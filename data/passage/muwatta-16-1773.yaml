label: { ar: "الموطأ 1773 — مالك عن ابن شهاب: الرضاعة قليلها وكثيرها يحرم، والرضاعة من قبل الرجال تحرم", en: "Muwatta 1773", es: "Muwatta 1773", fr: "Muwatta 1773", ur: "موطا 1773", tr: "El-Muvatta 1773 — Malik, İbn Şihab'dan rivayetle: Az ya da çok emzirmek evliliği haram kılar ve erkeklerden emzirmek de evliliği haram kılar.", id: "Al-Muwatta 1773 — Malik, berdasarkan riwayat Ibn Shihab: Menyusui, baik sedikit maupun banyak, menjadikan pernikahan haram, dan menyusui dari laki-laki menjadikan pernikahan haram." }
summary:
  ar: "يروي مالك عن ابن شهاب أنه كان يقول: الرضاعة، قليلها وكثيرها، تحرم. والرضاعة من قبل الرجال تحرم. {cite:muwatta-maruf-1997 p.123}"
  tr: "Malik, İbn Şihab'dan rivayetle şöyle der: \"Az da çok da olsa emzirme, haram bir ilişki kurar. Erkeklerden emzirme de haram bir ilişki kurar.\" {cite:muwatta-maruf-1997 s.123}"
  id: "Malik meriwayatkan dari Ibnu Shihab bahwa beliau biasa berkata: Menyusui, baik sedikit maupun banyak, menciptakan hubungan yang dilarang. Menyusui dari laki-laki juga menciptakan hubungan yang dilarang. {cite:muwatta-maruf-1997 p.123}"
