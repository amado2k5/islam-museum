text: |-
  ⁦(:٢٠)⁩
  ٦٠١
  والاشاجع أصول الاصابع التى تتصل بعصب ظاهرالكف الواحد أشجع ومنه قول
  لسد
  يدخلا -تى توارى أشصعه وناس يزعمون أنه إشجع مثال إصبع ولم يعرفه
  أبو الغوث وشجعته اذاقلت له أنت شجات أو قويت قلبه وتشجع أى تكلف الشجاعة
  رع) الشريعة. شرعة المناء وهومورد المشارية والشريعة ما شرع اللّٰه اعياده من
  الدين وقد شرع لهم إشرع شرعا أى سنّ والشارع الطريق الاعظم وشرع المنزل اذا كان بابه
  على طريق نافذوة رعت الاهاب اذا سلخته وقال يعة وب أذا شفقت مابين الرجلين ثتم سلحته
  قال -ععتسه من أمّ الهارس البكرية وشرعت فى هذا الامر شروعا أى خضت وشرعت
  الدواب فى الماءتشرع شرعا وشروعا اذادخات وهى ابسل شروع وشرّع وشرعنها أنا وفى
  المثل أهون السق التشريع ويقال شرعك هذا أى حسبك وفى المثل شرعاك ما بلغك المحل
  يضرب فى التبلغ باليسير ومررت برجل شرعك من رجل أى حسبك والمعدى انه من التجو
  الذى تشرع فيه وتطلبه يستوى فيه الواحد والتثنية والهع لانه مه دروقولهم الناس فى هذا
  الامرشرع أى سوا يحترّك ويسكن يستوى فيه الواحد والمؤنت والجمع والشرعة الشريعة
  ومنه قوله تعالى لكل جعلنا. مكم شرعة ومنهاجا ويقال أيضاهذه شرعة هذه أى مثلها
  وهذا شرع هذا وه ماشرعان أى.ثلان والشرعة أيضا الوتر وابهع شرع وشرع وشراع جع
  الجمع عن أبى عبيد والشراع أيضاشراع السفينة ورب قالو اللبعيراذارفع عنقه قد رفع
  شراعه ورح شراعى أى طويل وهو منسوب وأشرعت بابا الى الطريق أى فتهت وأشرعت
  قوله الجنزة يعنى السرير الذع
  الرمح قبله أى سددته فشرع هوورماح شرّع قال عبدالله بن أوفى الحزاعى يهجوامرأة
  يحمل عليه الميت قالءبدة
  وايست بشاركة محرما • ولوحف بالاسل الشرع
  وحيتان شرّع أى شارعات من غمرة الماء الى الجد رجع لشرجع الطويل والشرجع
  ولقد عات بان قصرى جرة
  الجنازة ومطارقة مشرجعة أى مطوّله لاروف لنواحيها ⁦( سع)⁩ النسع واجد شسوع
  غبرا يجملنى اليهاشرجع
  النعل التى تشد الى زمامها تقول منه شعت الذهل وقال أبو الغوث شعت النعل باتشديد
  وقال النابغة الذبيانى
  وكذلت أشعتها والشاسع والشوع البعيد وفلان شع مال اذا كان حسن القيام عليه
  وعنس براها ر حلتى فكأنها
  عع شعاع الشمس مايرى من ضومه اعند درور «اك القضبان واليهمع أشعة وشعع
  اذا جنات فوق الذراعين شرجع
  وقد أشعت الشمس نشرت شماعها ومنه حسديث ل.لة القدرات الشهس تطلع من غديومها
  كذافى نسفة بالاصل
  لاشعاع لها الواحدة شعاعة والشعاع بالفتح تفرق الدم وغسيره وانتشاره
  قال ابن الخطيب طعنت ابن عبد القيس طعنة ثاره لهانقد لولا الشعاع أضاءها
  ويقال أيضارأى شماع أى متفرق ونفس شعاع تفرقت همما قال قيس بن الملوح
  فقدتك من نقس شعاع ألم أكن • نهيتك عن هذا وأنت جمع
  وشعاعال-نيل أيضاسفاه وقد أشع الزرع أخرج شعاعه وأشع البعيربوك أى فرقه وكذلك
  شع بول يشعه وظل شعنع ليس بكثيف ومشعشع أيضا وشعنعت الشراب هن جته بالما.
  والشعشاع المتفترّق قال الراجز صدق اللقاء غير شعناع المغدر يقول هوجيع الهسمة
  ف-ير متفرقها ورجل شعشاع أى طويل حِسن وصكذلك الشعشعان وناقة شعشهانة قال
  ذوارمة هيهات خرقا الا ان يقربها • ذواعرش والشعدانات الغياهيم
