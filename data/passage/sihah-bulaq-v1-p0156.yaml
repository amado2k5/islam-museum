text: |-
  (فصل الجيم
  ٤٨٥
  والارتساح ومنه قولهم كيف نواتيه ولا تؤشه وللحديث ان علقمة بن قيس كان اذار أى
  -ن أحصابه بعض الاشاش وعظهم
  سل البساء ش لبرش فى شعر الفرس نكت صغار تخالف سائرلوته والفرس
  أبرش وقد ابرش القرس ابرشاشا وقواه-م دخلنا فى البرشاء أى فى بماعة الناس قال ابن
  السكيت بقال ما أدرى أى البرشاءهوأى أى الناس هو والابرش لقب جذية بن مالك
  وكان به برش فكنوايه عنه ⁦( رقش )⁩ بوقشت الشى اذانقشته بألوان شتى وأصله
  من أب براقس وهو طا ئريتلون ألوانا قال الشاءر كابي براقس كل لون لونه يتغيل
  وبراقسْ اسم كلية وفى المئسل على أهلها دات براقس لانم با-معت وقع -وافر الدواب فنجت
  فاستدلوا بنباحهاعلى القبيلة فاستباحوهم والبرقشر بالكسر طائر صغيرمثل العصفور:
  يسميه أهل الحجاز الشرشور ⁦( شش)⁩ البشاشة طلاقة الوجه وقد بتشت به بالكسر أبش
  بشاشسة ورحل هش بش أى طلق الوحه طيب قال يعقوب يقال لقيته فتبشبشبى وأصله
  نبشر فأبدلوا من الشين الوسطى قاءالفعل كافالواتجفيف ( س لبطئة السطوة
  والاخذ بالعف وقد بعش به يبعس ويبعاس بطناو بالطن ممباطشة قس) البغشة
  المطرة الضعيفة وهى فوق الطشة وقد بغشت السماء تبغشر بغشا ومطرباغش وبفشت
  الارض فهى مبغوشة بوش . البوش الهاعة من الناس المختاطين يقال بوش باتش
  والاوياش جمع مقلوب منه والبوشالرجل الفقير السكثير العيال قال أبو ذؤيب
  وأشعث بوشى تشفينا احا-ه • غداتئذذى جردة مإحل
  رش بهش البه يبهس بهشا اذا ارتاح له وخف اليه والبهس المقل مادام وطباقا ذايبس
  فهوخشل ويقال للقوم اذا كانواسود الوجوه قباحاوجوه البهسْ وفحديت عمررضى
  اللّٰه عنه وقد يلغه ان أباموسى يقرأحرفابلغته قال إن أبامومى لم يكن من أهل البهسْ
  يقول ليس من أهل الحجاز لان المقل انماينبت بالجاز ⁦(بيش)⁩ البيش بكسر البانيت
  ببلاد الهندوهوسم ويشة اسم موضع قال الشاعر
  سق جدما أعراض بيشة دونه • وغمرة وسمى الربيع ووابله
  وقال القاسم بن معن بئشة وزثنمهموزتان وهما أرضان.
  فى المل بكيم ⁦(جأش)⁩ الأش جأش القلب وهورواعه اذا اضطرب عند القزع
  يقال فلان رابط الجأش أى يربط نفسه عن الفرار لشجاعته والجوشوس الصدر
  ⁦( جمس)⁩ الجسْ سمبج الجلديقال أصابدشئ فحر وجهه وبه بحش وابلحس واد الحمار
  والهع جحماش وحشان والانتى حشة ويقال للرجل اذا كان يستبدبرأيه عجيس وحده
  وعيير وحده وهوذم والجشبة صوفة بلفها الراعى على يده يغزلها وبحاش أبوحى من غطفان
  وهو ححاش بن:عامسة بن سود بن ذييبان بن بغيض بن ريث بن غطقان وه-م قوم الشماخ
  ابن ضرار قال الشاعر وجاءت بهاش قضها بقضيضها • وجع موال ما أدق وألا ما
  وجاحشه أى دافعه والخيسْ المتنى عن القوم قال الشاءر
  .١٢٢
  صداح
