label: { ar: "جامع الترمذي 2006 — الأب والأبوة", en: "Jami' al-Tirmidhi 2006 — the father and fatherhood", ur: "جامع ترمذی 2006 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2006 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 2006 — le père et la paternité" }
text: "… مَنِيعٍ، وَمَحْمُودُ بْنُ غَيْلاَنَ، قَالُوا حَدَّثَنَا أَبُو أَحْمَدَ الزُّبَيْرِيُّ، عَنْ سُفْيَانَ، عَنْ أَبِي إِسْحَاقَ، عَنْ أَبِي الأَحْوَصِ، عَنْ أَبِيهِ، قَالَ قُلْتُ يَا رَسُولَ اللَّهِ الرَّجُلُ أَمُرُّ بِهِ فَلاَ يَقْرِينِي وَلاَ يُضَيِّفُنِي فَيَمُرُّ بِي أَفَأَجْزِيهِ قَالَ \" لاَ أَقْرِهِ \". قَالَ وَرَآنِي رَثَّ الثِّيَابِ فَقَالَ \" هَلْ لَكَ مِنْ مَالٍ \". قُلْتُ مِنْ كُلِّ الْمَالِ قَدْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2006، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2006 (Chapters on Righteousness And Maintaining Good Relations With Relatives), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2006، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2006 (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los familiares), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2006 (chapitres sur la piété et les bonnes relations familiales), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce sujet parmi les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
