text: |-
  ١٢٣
  وقال أبوزيد قرت الدم فى الجرح اذامات فيه: ⁦(قلت)⁩ القلت باسكان اللام الثرتم في الجبل
  يسة:قع فيها الماء وابهمع القلات وقات العين نقرتها وقلت الابهام النقرة التى فى أسفلها وقات
  الصدغ وقلت الثريدة والوقبة والقلت بالتحريك الهلال تقول منه قلت بالكسريقال
  ما اننلتوا وا-كن قلتوا وقال أعرابى إن المسافروماله لعلى قلت الاماوقى الله والمقلتة
  المهلكة والمقلات من النوق التى تضع واحدا ثم لا تحمل بعدها والمثلات من النساء الق
  لا يعيش لها ولدية ال أقدت قال بشر
  تطل مقالمت النساميطأنه • يقلن ألا يلق على الرمتزر
  كانت العرب تزعم أن المقلات اذا وطئت رجلا كر يما قتل غدراعاش وادهنا ⁦(قنت )⁩
  القنوت الطاعة هذا هو الاصل ومنه وله تعالى والقانين والقانتات ثم سمى القيام فى الصلاة
  قنوتاوفى الحديث أفضل الصلاة طول القنوت ومنه قنوت الوتر ⁦(قوت)⁩ قات أهله يقوتهم
  قوتا وقياتة والاسم القوت بالضم وه وما يقوم به بدن الانسان من الطعام بقال ماعفده
  قوت ليلة وقيت ليلة وقبتة ليلة فلما كسر القاف صارت الواويا. وقنسه فاقتات كماتقول
  رزقته فارتزق وهوفى قائت مر العيش أى فى كفاية واستقاته سأله القوت وفلان يتقوت
  بكذا واقتت اذارلاقنة أى أطعمها الحعاب قال ذوالرمة
  فقلت لارفعها اليك وأحبها • بروحك واقتته لها قيتة قدرا
  وأقات على النى اقتدر عله قال الشاءر
  وذى فغن كففت النفس عنه • وصكنت على اساءته مقتا ( ١
  وقال الفرّاء المقيت المقتدر كالذى يعطى كل رجل قوته وكان اللّٰه على كل شيء مقيتا ويقال
  المقيت الحافظ للشئ والشاهدله وأنشدئعلب ٢ .
  ليبْ شعِرِى وأسعرنَ اذاما * قرْبُوها.نسْورة ودعيت
  ألى الفضل أم على اذاحو * سبت انى على الحساب مقيت
  أى أعرف ماعملت من السوءلان الانسان على تفه بصيرة
  أى صرفه وأذله وكبته لوجهه أى صرعسه ( كنت البكتيت صوت البكر و«وفوق
  الكشيس يقمال كن البعبريكت بالكسر اذا صاج إما لينا وكت الرجل من الغضب
  وكتت القد رغلت وكذلك الجرة الجديداذاصب فيها الماءويقسال أتانابجيش ما يكت أى
  ما يحصى عدده والكتكتة فى: لضحك دون القهقة رت نة كريت أى تامة عت
  المكعيت البلبل ٣ جاءمصغراوجعه كعتان أبوزيدرجل كعت وامرأة كعتة وه-ما
  القصيران كفت) كفت الشئ أكنته كفتا اذاتممته الى نفسك وفى الحديث اكفتوا
  صييانكم بالليل فان للنيطان خطفة قال زهير يصف درعاوان صاحيماضمها اليه
  ومفاضة كالنهى تنسهجه الصبا * بيضاء كفت فضلها ؟هند
  وانماشدده للعد الغة وكفته عن وجهه أى صرفه وكفت أى أسرع واإنكفت السوق
  الشديد ورجل كفت وكفيت أى سريع مثال كش وكيش والكفت بالبكسر القدر الصغيرة
  ١ أ مقتدرا وقرأت في
  هامشر نسخة الصداح بخط باقوتم
  مانصه ذكر أبو مح-د الاسود
  الفند جانى أن هذا البيت فى
  قصيدة مرفوعسة ورواه على
  مساءنه أقيت وأورد التصيدة
  الى آخرمانقله م رفانظره
  رب شتمومعته وتصاحت
  وعى تر كنه فكفيت
  اه من مر
  ٣ أهل المدينة يسمونه النغر
  وقد حاء ذكره فى الحديت اه مو
  أى مصغرا اه
