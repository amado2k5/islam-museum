text: "… وشدته وما يستحب من الأحوال عند الموت. الباب الرابع فى وفاة رسول اللّه والخلفاء الراشدين من بعده. الباب الخامس فى كلام الممتضرين من الخلفاء والأمراء والصالحين. الباب السادس فى أقاويل العارفين على الجنائز والمقابر وحكم زيارة القبور. الباب السابع فى …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 3، ص 433، يذكر ساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 3, p. 433, that mentions a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 3، ص 433 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
