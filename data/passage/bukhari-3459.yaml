label:
  ar: "البخاري 3459 — هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها"
  en: "Bukhari 3459 — Have I wronged you in your wage: this community and those before it"
  ur: "بخاری 3459 — کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں"
text: "إنما أجلكم في أجل من خلا من الأمم ما بين صلاة العصر إلى مغرب الشمس، وإنما مثلكم ومثل اليهود والنصارى كرجل استعمل عمالا فقال من يعمل لي إلى نصف النهار على قيراط قيراط فعملت اليهود إلى نصف النهار على قيراط …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3459: هل ظلمتكم من أجركم شيئا: مثل هذه الأمة ومن قبلها. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3459: Have I wronged you in your wage: this community and those before it. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3459: کیا میں نے تمہاری مزدوری میں کمی کی: یہ امت اور پچھلی امتیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
