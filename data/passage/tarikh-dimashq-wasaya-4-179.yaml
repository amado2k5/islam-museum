text: "أحمد بن كليب الطرسوسي أحمد بن كيغلغ أبو العباس الزُهْري، عن أنس بن مَالك، قالَ: سَمعت رَسُول اللّٰه وَلِفِ يقول : إن اللّٰه قد أعطى كل ذي حقّ حقه، أَلَا لا وَصية لوَارث، وَالوَلد للفرَاش وللعَاهر الحجَر. قالَ الخطيب: سليمَان …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 4، ص 179، يذكر وصية أو عهد أخير، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn 'Asakir's Tarikh Dimashq, scan volume 4, p. 179, that mentions a testament or parting counsel, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "تاریخ دمشق، ابن عساکر، اسکین جلد 4، ص 179 کا اقتباس جس میں وصیت یا آخری نصیحت، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh Dimashq de Ibn 'Asakir, volumen 4, pág. 179, que menciona un testamento o consejo de despedida, lo que se dejó: patrimonio y herencia; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye."
  fr: "Extrait du Tarikh Dimashq d'Ibn 'Asakir, volume 4, page 179, mentionnant un testament ou des dernières volontés, ainsi que les biens et l'héritage laissés. Extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur de Testaments."
  tr: "İbn Asakir'in Şam Tarihi, Resimli Cilt 4, sayfa 179'dan bir alıntı, bir vasiyetname veya son miras belgesinden ve geride bıraktığı mal varlığından bahsetmektedir; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenen metin, makine tarafından okunabilir tıpkıbasım baskısından alınmıştır. Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Sejarah Damaskus karya Ibn Asakir, Jilid 4 Bergambar, halaman 179, menyebutkan surat wasiat atau testamen terakhir, serta harta dan warisan yang ditinggalkannya; dari edisi faksimili yang dapat dibaca mesin, dengan teks yang dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Peramban Surat Wasiat, Warisan, Barang Antik, dan Tempat Suci."
