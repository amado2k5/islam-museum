text: "أحمد بن كليب الطرسوسي أحمد بن كيغلغ أبو العباس الزُهْري، عن أنس بن مَالك، قالَ: سَمعت رَسُول اللّٰه وَلِفِ يقول : إن اللّٰه قد أعطى كل ذي حقّ حقه، أَلَا لا وَصية لوَارث، وَالوَلد للفرَاش وللعَاهر الحجَر. قالَ الخطيب: سليمَان …"
