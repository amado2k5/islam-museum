label: { ar: "نوادر جحا الكبرى، ص 146 — «إياك أن تنسي عقد الخيط بالإبرة فتبقى وحدها»", en: "Nawadir Juha al-Kubra, p. 146 — 'Do Not Forget to Knot the Thread on the Needle'", ur: "نوادر جحا الکبریٰ، ص 146 — «لازمًا دھاگے میں گرہ لگانا، ورنہ سوئی اکیلی رہ جائے گی»", fr: "Nawadir Juha al-Kubra, p. 146 — « N'oublie pas de nouer le fil à l'aiguille, sinon elle restera seule »", es: "Nawadir Juha al-Kubra, p. 146 — «No olvides anudar el hilo a la aguja, o se quedará sola»" }
text: "… إيَّاك أن تنسَي عقد الخيط بالإبرة فتبقى وحدها أخذوا أبنته عروساً إلى إحدى القرى، وبعد أن اجتازوا مسافةً طويلةً أسرع الشيخ عدَّةَ ساعاتٍ حتى لَحِقَ بهم، وقد تصبَّب عرقاً فتقدَّمَ إلى النساءِ وأبعدهُنَّ إلى جانب، وأنفرد بابنتِهِ فقال لها: يا …"
summary:
  ar: "لحق جحا بابنته وهي في طريقها إلى بيتها الجديد، وأوصاها أن تعقد الخيط قبل الخياطة، وإلا بقيت الإبرة وحدها في يدها. {cite:juha-nawadir-kubra-djuwaydi p. 146}"
  en: "Juha catches up with his daughter on the way to her new home and warns her to knot the thread for sewing, or else the needle stays alone in her hand. {cite:juha-nawadir-kubra-djuwaydi p. 146}"
  ur: "جحا اپنی بیٹی کے نئے گھر جاتے ہوئے راستے میں اس سے جا ملا اور اسے نصیحت کی کہ سلائی سے پہلے دھاگے میں گرہ لگا لے، ورنہ سوئی اس کے ہاتھ میں اکیلی رہ جائے گی۔ {cite:juha-nawadir-kubra-djuwaydi p. 146}"
  fr: "Juha rattrape sa fille sur le chemin de sa nouvelle maison et lui recommande de nouer le fil avant de coudre, faute de quoi l'aiguille restera seule dans sa main. {cite:juha-nawadir-kubra-djuwaydi p. 146}"
  es: "Juha alcanza a su hija en el camino hacia su nuevo hogar y le advierte que anude el hilo antes de coser, porque de lo contrario la aguja se quedará sola en su mano. {cite:juha-nawadir-kubra-djuwaydi p. 146}"
