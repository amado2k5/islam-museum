text: "… لي الشؤون الخارجية ولها الأمور الداخلية شبَّتِ النَّار في دار جحا فجاءه أحدُ جيرانه، وقال له: أسرع فقد شبَّتِ النار في دارِك وقد طرقت الباب كثيراً ولم يردَّ عليَّ أحدّ. فأجابه الشيخ ببرودٍ: يا أخي أقسمُ لك باللَّه أنَّ أُمورُ …"
summary:
  ar: "اندلعت النار في بيت جحا فحذره جار، فقال له إن الشؤون الخارجية له والأمور الداخلية لزوجته. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  en: "A fire breaks out in Juha's house and a neighbour warns him, and Juha says that outdoor matters are his and indoor matters are his wife's. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  ur: "جحا کے گھر میں آگ بھڑک اٹھتی ہے اور ایک پڑوسی اسے خبردار کرتا ہے، تو جحا کہتا ہے کہ باہر کے معاملات اس کے ہیں اور اندر کے معاملات اس کی بیوی کے۔ {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  fr: "Un incendie éclate dans la maison de Juha et un voisin l'avertit, et Juha répond que les affaires du dehors sont les siennes et celles du dedans sont celles de sa femme. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  es: "Se declara un incendio en la casa de Juha y un vecino le avisa, y Juha dice que los asuntos de fuera son suyos y los de dentro son de su esposa. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
  tr: "Juha'nın evinde yangın çıktı ve bir komşusu onu uyararak, dış işlerin onun sorumluluğunda, iç işlerin ise karısının sorumluluğunda olduğunu söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 101}"
  id: "Kebakaran terjadi di rumah Juha, dan seorang tetangga memperingatkannya, mengatakan bahwa urusan luar adalah tanggung jawabnya dan urusan dalam adalah tanggung jawab istrinya. {cite:juha-nawadir-kubra-djuwaydi p. 101}"
