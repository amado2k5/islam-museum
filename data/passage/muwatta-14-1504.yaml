label: { ar: "الموطأ 1504 — مالك: طلاق الرجل امرأته قبل أن يدخل بها وهي بكر، فيعفو أبوها عن نصف الصداق، جائز لزوجها فيما وضع عنه", en: "Muwatta 1504", es: "Muwatta 1504", fr: "Muwatta 1504", ur: "موطا 1504", tr: "El-Muvatta 1504 — Malik: Eğer bir erkek, evliliğin tamamlanmasından önce karısını boşayıp, karısı bakire ise ve babası mehirin yarısını bağışlarsa, kocanın bağışladığı kısmı kabul etmesi caizdir.", id: "Al-Muwatta 1504 — Malik: Jika seorang pria menceraikan istrinya sebelum hubungan suami istri terjalin dan istrinya masih perawan, dan ayahnya memaafkan setengah dari mahar, maka diperbolehkan bagi suaminya untuk menerima bagian yang telah dimaafkan oleh ayahnya." }
summary:
  ar: "يقول مالك في طلاق الرجل امرأته قبل أن يدخل بها، وهي بكر، فيعفو أبوها عن نصف الصداق، إن ذلك جائز لزوجها من أبيها فيما وضع عنه، لأن الله قال في كتابه إلا أن يعفون، فهن النساء اللاتي قد دخل بهن، أو يعفو الذي بيده عقدة النكاح، فهو الأب في ابنته البكر، والسيد في أمته. {cite:muwatta-maruf-1997 p.32}"
  tr: "Malik, bir erkeğin evliliği tamamlamadan önce bakire karısını boşaması ve babasının mehirin yarısını affetmesi konusunda, bunun kocası için babadan caiz olduğunu, çünkü Allah'ın Kitabında \"onlar affetmedikçe\" buyurduğunu söylüyor. Bunlar, evliliği tamamlamış veya evlilik sözleşmesini elinde bulunduran kişinin affettiği kadınlardır. Bakire kızına karşı baba, cariyesine karşı ise efendidir. {cite:muwatta-maruf-1997 s.32}"
  id: "Malik mengatakan tentang seorang pria yang menceraikan istrinya yang masih perawan sebelum melakukan hubungan suami istri, dan ayahnya melepaskan setengah dari mahar, bahwa hal ini diperbolehkan bagi suaminya dari ayahnya sejauh ia melepaskannya, karena Allah berfirman dalam Kitab-Nya, \"kecuali jika mereka melepaskannya.\" Ini adalah wanita-wanita yang telah dinikahinya, atau orang yang memegang kontrak pernikahan melepaskannya. Ia adalah ayah dalam hal putrinya yang masih perawan, dan tuan dalam hal budak perempuannya. {cite:muwatta-maruf-1997 p.32}"
