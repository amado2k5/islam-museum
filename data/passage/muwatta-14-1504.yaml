label: { ar: "الموطأ 1504 — مالك: طلاق الرجل امرأته قبل أن يدخل بها وهي بكر، فيعفو أبوها عن نصف الصداق، جائز لزوجها فيما وضع عنه", en: "Muwatta 1504" }
summary:
  ar: "يقول مالك في طلاق الرجل امرأته قبل أن يدخل بها، وهي بكر، فيعفو أبوها عن نصف الصداق، إن ذلك جائز لزوجها من أبيها فيما وضع عنه، لأن الله قال في كتابه إلا أن يعفون، فهن النساء اللاتي قد دخل بهن، أو يعفو الذي بيده عقدة النكاح، فهو الأب في ابنته البكر، والسيد في أمته. {cite:muwatta-maruf-1997 p.32}"
