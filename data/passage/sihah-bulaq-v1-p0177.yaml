text: |-
  عمواس بفح اوائله اه
  ٤٦٤
  ⁦(باب السين )⁩
  وعلس داؤه أيضاأى اشتدو برتح قال ابن السكيت المعلس الرجل المجرّب والعليس الشواء
  مع الجلد ( لكس علنكس أى اشتدسواده قال العجاج
  فاحم دووى حتى أعلنكسا وقال الفرّاءشعر معلنكس ومعلنكان وهو السكنيف المجتمع
  ويقال اعلنكس الذى اذاتردد علطس ناقة علطوس مثال فردوس وهى الخيار
  بارهة ⁦( ع طابس)⁩ العلطبيس الاملس البراق قال الراجز
  لمارأى شيب قذالى عيسا . وهاتى كالمست علطبيا . لا يجد الفمل بهانعربسا
  مس العماس بالفتح الحرب الشديدة والداهية وليل عماس أى مظلم ويوم عماس
  وقد عس عماسة قال ابن السكيت يقال أحرعموس وعماس أى مظلم لا يدرى من أين
  يؤتى له ومنه قواهم جاءنابامور. عمسات أى مظلة ملوية عن جهتها ورجل عموس
  متعسف وفلان يتعامس عن الشئء اذاتغافل عنه وقال وتعامس علىّ فلان أى تعامى
  علىّ وتركنى فى شبهة من أمره والعمس أن ترى أنك لا تعرف الامر وأنت عارف به ويقال
  عمر الكتاب أى درس وطاعون عمواس أوّل طاعون كان فى الاسلام بالشأم مرس .
  العمرّس يتشديد الراء القوىّ الشديد من الرجال والعمروس الخروف والجمع العمارس
  قال جيد بزتور أولئك لم يدرين ماسمك القرى * ولاعصب فيهارثات العمارس
  وربماقيل للغلام الحادرعم روس عن أبى عرور عملس العملس بتشديد اللام مثل
  العمزس قال أبوع روالعملس القوى على السيرالسربع وأنشد
  حملس أسفاراذا استقبات له عوم كحر النارلم يتلثم
  والعملس أيضا الذئب وأما قولهم فى المثل ه و أبرّ من العملس فهواسم رحل كان يحج بأمّه
  على ظهره ⁦(عنس)⁩ العنس الناقة الصلبة ويقال هى التى اعنونس ذنبها أى وفر وقال
  الاجز
  كم قد حسر نامن علاة عنس وعنس أيضاقبيلة من اليمن منهم الاسود العنسى
  الكذاب وعنست الجارية تعنس بالضم عنوسار عناسا فهى عائس وذلك اذاطال مكنها
  فى منزل أهلها بعدادرا كها-تى خرجت من ء_داد الابكارهذا مالم تتزوج فان تزوّجت
  مرّة فلايقال عنست قال الاعشى
  والبيض قد عنست وطال براؤها * ونشأن فى فنن وفى اذواد .
  ويروى والبيض مجرورابالعطف على الشرب فى قوله
  ولقد ارجل لمتى بعشية • للشرب قبل حوادث المرتاد :
  ويروى سنابك أى قبل حوادث الطالب يقول ارجل لمتى للشرب وللجوارى الحسان التى
  قد نشأن فى فتن أى فى نعمة وأصلها أغصان الشجر هذه رواية الاصحى وأما أبو عبيدة
  فانه رواه فى قن بالقاف أى فى عبيد وخدم ويقال للرحل أيضاعانس، قال أبوقيس بن رفاعة
  منا الذى هوما إن طرّشاربه * والعانون ومنا المرد والنيب
  والجمع عنس وعنس مثال بازل ويزل وبزل قال الراجز; يعرس أبكارابها وعنساقال أبوز يد
  وكذلك عنست الحارية تعنيا وقال الاصمعى لا يقال عنست واسكن عنست على مالم يسم
  وعله
