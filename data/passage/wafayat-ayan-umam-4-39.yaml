text: "… بلاد العجم الى بلاد إلى ليلجر ظبة فقال يا أباعبد الله كان تحتك ماء فقلت لا يا أمير المؤمنين ولكن كان كذا وكذا خضحك المعتص الروم ويوطن عديثة روسة ودعالى وقال أحسنت بارك اللّه عليك وخلع عليه وأسر له بمائة …"
