text: "… الثانى، وهو ما طبخ من ماء العنب حتى ذهب ثلثاه وإذا أكثر منه أسكر مصطلح أشربة. وهو المسمى بالمثلث حلال، ولا يحرم منه إلا القدح الأخير الذى يحصل به الإسكار، أما ما ذهب أقل من ثلثيه فحرام بالإجماع ؟ - …"
