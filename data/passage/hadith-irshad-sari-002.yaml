text: "ه، لأن الرسل مستوون في أنهم عباد الل᧦ه. وللأصيلي وابن عساكر من محمد بن عبد الل᧦ه ورسول الل᧦ه )إلى هرقل عظيم( أهل )الروم( أي المعظم عندهم ووصفه بذلك لمصلحة التأليف ولم يصفه بالأمرة ولا الملك لكونه معزولا بحكم الإسلام، وقوله:"
