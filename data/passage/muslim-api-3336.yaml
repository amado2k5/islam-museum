label: { ar: "صحيح مسلم 3336 — الحرام", en: "Sahih Muslim 3336 — the unlawful", ur: "صحیح مسلم 3336 — حرام", es: "Sahih Muslim 3336 — lo ilícito", fr: "Sahih Muslim 3336 — l'illicite", tr: "Sahih Müslim 3336 — Mescid-i Haram", id: "Sahih Muslim 3336 — Al-Haram" }
text: "… لَهَا عُقْدَةً حَتَّى أَقْدَمَ الْمَدِينَةَ - وَقَالَ - اللَّهُمَّ إِنَّ إِبْرَاهِيمَ حَرَّمَ مَكَّةَ فَجَعَلَهَا حَرَمًا وَإِنِّي حَرَّمْتُ الْمَدِينَةَ حَرَامًا مَا بَيْنَ مَأْزِمَيْهَا أَنْ لاَ يُهَرَاقَ فِيهَا دَمٌ وَلاَ يُحْمَلَ فِيهَا سِلاَحٌ لِقِتَالٍ وَلاَ يُخْبَطَ فِيهَا شَجَرَةٌ إِلاَّ لِعَلْفٍ اللَّهُمَّ بَارِكْ لَنَا فِي مَدِينَتِنَا اللَّهُمَّ بَارِكْ لَنَا فِي صَاعِنَا اللَّهُمَّ بَارِكْ لَنَا فِي مُدِّنَا اللَّهُمَّ بَارِكْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3336، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3336 (The Book of Pilgrimage), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3336، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih Muslim, n.º 3336 (El Libro de la Peregrinación), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 3336 (Le Livre du Pèlerinage), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih Müslim'de 3336 numaralı hadis, haram olan şeylerden bahsetmektedir. Helal ve haram sözlüğünün bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiş metinler içermektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 3336, menyebutkan apa yang diharamkan. Bagian kamus halal dan haram ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
