label: { ar: "صحيح مسلم 3336 — الحرام", en: "Sahih Muslim 3336 — the unlawful", ur: "صحیح مسلم 3336 — حرام" }
text: "… لَهَا عُقْدَةً حَتَّى أَقْدَمَ الْمَدِينَةَ - وَقَالَ - اللَّهُمَّ إِنَّ إِبْرَاهِيمَ حَرَّمَ مَكَّةَ فَجَعَلَهَا حَرَمًا وَإِنِّي حَرَّمْتُ الْمَدِينَةَ حَرَامًا مَا بَيْنَ مَأْزِمَيْهَا أَنْ لاَ يُهَرَاقَ فِيهَا دَمٌ وَلاَ يُحْمَلَ فِيهَا سِلاَحٌ لِقِتَالٍ وَلاَ يُخْبَطَ فِيهَا شَجَرَةٌ إِلاَّ لِعَلْفٍ اللَّهُمَّ بَارِكْ لَنَا فِي مَدِينَتِنَا اللَّهُمَّ بَارِكْ لَنَا فِي صَاعِنَا اللَّهُمَّ بَارِكْ لَنَا فِي مُدِّنَا اللَّهُمَّ بَارِكْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 3336، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 3336 (The Book of Pilgrimage), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 3336، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
