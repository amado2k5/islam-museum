text: "… خلف الجود لجعله فى صورة رجل وجعل رأسه راسخاً فى أصل شجرة طوبى، وشدّ أغصانها بأغصان سدرة المنتهى، ودلى بعض أغصانها إلى الدنيا، فمن تعلق بغصن منها أدخله الجنة، ألا إنّ السخاء من الإيمان، والإيمان فى الجنة. وخلق البخل من …"
summary:
