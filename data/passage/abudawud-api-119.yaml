label: { ar: "سنن أبي داود 119 — الأب والأبوة", en: "Sunan Abi Dawud 119 — the father and fatherhood", ur: "سنن ابی داؤد 119 — باپ اور والدیت", es: "Sunan Abi Dawud 119 — El padre y la paternidad" }
text: "حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا خَالِدٌ، عَنْ عَمْرِو بْنِ يَحْيَى الْمَازِنِيِّ، عَنْ أَبِيهِ، عَنْ عَبْدِ اللَّهِ بْنِ زَيْدِ بْنِ عَاصِمٍ، بِهَذَا الْحَدِيثِ قَالَ فَمَضْمَضَ وَاسْتَنْشَقَ مِنْ كَفٍّ وَاحِدَةٍ يَفْعَلُ ذَلِكَ ثَلاَثًا. ثُمَّ ذَكَرَ نَحْوَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 119، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 119 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 119، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 119 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
