label: { ar: "صحيح البخاري 4093 — الأب والأبوة", en: "Sahih al-Bukhari 4093 — the father and fatherhood", ur: "صحیح بخاری 4093 — باپ اور والدیت", es: "Sahih al-Bukhari 4093 — El padre y la paternidad" }
text: "حَدَّثَنَا عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا ـ قَالَتِ اسْتَأْذَنَ النَّبِيَّ أَبُو بَكْرٍ فِي الْخُرُوجِ حِينَ اشْتَدَّ عَلَيْهِ الأَذَى، فَقَالَ لَهُ \" أَقِمْ \". فَقَالَ يَا رَسُولَ اللَّهِ أَتَطْمَعُ أَنْ يُؤْذَنَ لَكَ، فَكَانَ رَسُولُ اللَّهِ يَقُولُ \" إِنِّي لأَرْجُو ذَلِكَ \" قَالَتْ فَانْتَظَرَهُ أَبُو بَكْرٍ فَأَتَاهُ رَسُولُ اللَّهِ ذَاتَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4093، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4093 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4093، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4093 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
