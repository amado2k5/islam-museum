label:
  ar: "رياض الصالحين 172 — ليس من نفس تقتل ظلما إلا كان على ابن آدم كفل"
  en: "Riyad al-Salihin 172 — Every soul killed unjustly carries its burden"
  es: "Riyad al-Salihin 172 — Toda alma asesinada injustamente carga con su peso."
  fr: "Riyad al-Salihin 172 — Chaque âme tuée injustement porte son fardeau"
  ur: "ریاض الصالحین 172 - ناحق قتل ہونے والی ہر جان اپنا بوجھ اٹھائے گی۔"
  tr: "Riyad es-Salihin 172 — Haksız yere öldürülen hiçbir can yoktur ki, Âdem oğlu bundan sorumlu olmasın."
  id: "Riyad as-Salihin 172 — Tidak ada jiwa yang dibunuh secara tidak adil kecuali anak Adam yang bertanggung jawab."
text: "لَيْسَ مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلاَّ كَانَ عَلَى ابْنِ آدَمَ الأَوَّلِ كِفْلٌ مِنْهَا»، وَرُبَّمَا قَالَ سُفْيَانُ «مِنْ دَمِهَا» لأَنَّهُ أَوَّلُ مَنْ سَنَّ الْقَتْلَ أَوَّلاً."
summary:
  ar: "حديث في رياض الصالحين للنووي، في باب «باب فيمن سن سنة حسنة أو سيئة»، من نسخة hadithunlocked المستخرجة؛ النص مقتبس بحدود أربعين كلمة."
  en: "A hadith in al-Nawawi's Riyad al-Salihin, in the chapter «باب فيمن سن سنة حسنة أو سيئة», excerpted within forty words."
  es: "Un hadiz de Riyad al-Salihin de al-Nawawi, en el capítulo «Bab fimen sinnah osanah or sie'a», extraído en cuarenta palabras."
  fr: "Un hadith du Riyad al-Salihin d'al-Nawawi, dans le chapitre «Bab fimen sinnah osanah or sie'a», extrait en quarante mots."
  ur: "النووی کی ریاض الصالحین میں ایک حدیث، باب \"باب فمن سنۃ اوسنہ یا سیعہ\" میں، چالیس الفاظ میں نقل کی گئی ہے۔"
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinde, \"İyi veya kötü bir uygulamayı başlatan kişi hakkındaki bölüm\" kısmında yer alan hadisin, hadithunlocked versiyonundan alıntılanan metni yaklaşık kırk kelimeden oluşmaktadır."
  id: "Sebuah hadits dalam kitab Riyad as-Salihin karya an-Nawawi, dalam bab “Bab tentang orang yang menetapkan amal baik atau amal buruk”, dari versi hadits yang telah diekstrak; teksnya dikutip sekitar empat puluh kata."
