text: |-
  • ⁦(باب الميم)⁩*
  •شم)•
  ٢٢٥
  وهم اذا انلخيل حالوافى كوانبها، فوارس الخيل لاميل ولاقزم
  بقال رجل قزم والذكر والاتى والواحدوالمع فيه سواءلانه فى الاصل مصدر والقزم أرداً
  المسال وشاة قزمة والقزام اللتام وقال
  أحصنوا أمهم من عبدهم • تلك أفعال القزام الوكعه
  أى زوجوا رزم ذكرابن دريد أن القرزوم بالقاف مضمومة لوح الاسكاف المدور
  وتشبه بهكركرة البعبروهو بالفا أعلى سم القسم مص_درقسمت الشئ قانقسم:
  والموضع مقسم مثل مجلس ومقسم بكسراليم اسم رجل وقول الشاءر القسلاخ بن جزن
  أنا القلاخ فى بغائى مقسما • أقسمت لا أسأم حتى تس.أما
  فهو اسم غلام له كان قد فرمنه والقسم بالكسر الحظ والنصيب من الخيرمشل طحنت طحنا
  والطحن الدقيق قال يعمة وب يقال هو يقسم أمره قسما أى يقدره ويظرفيه كيف يفعل
  وأقسمت حلفت وأصله من القسامة وهى الأيمان تقسم على الاولياه فى الدم والقسم
  بالتحريك الوين وكذلكْ المقسم وهوالمصدرمثل الخرج والقسم أيضاموضع القسم وقال
  زهير
  فتجمع أين منا وضكم • بمقسمة تودبم االدماء
  يعنى بمكة والقسمة الوجه وقال ابن الاءرابة هو مابين الوجنتين والانف تسكيرسينها:
  وقنتح وأنتدلمحرز بن مكعبر الضو
  كان دنانيراعلى قسماتهم * وأن كان ودشفة الوجوم لقاء
  والقسام الج-ن وفلان قسيم الوجه ومقسم الوجه وقال
  ويوماتوا فينا بوجه مقسم • كأن طبية تعطوالى وارق ال-لم
  وأماقول عنترة وكات فارة تاجر بقسمة * سبقت عوارضها اليك من الفم
  فيقال هو اليمين ويقال امرأة حسنة الوجه وبقال موضع وشئ مقسم أى محسن قال
  العجاج ١ ورب هذا الاثر المقسم * يعنى أز قدمى ابراهيم عليه السلام وقال أبو ميون
  يصف فرسا كل طويل الساق حرّالخدين * مقسم الوجههر بت الشدقين
  وقاسمه حف له وقاسمه المال وتقاسه اه واقتسماه بينهما والاسم القسمة مؤنمة وانماقال اللّٰه
  تعالى فارزقوهم منه بعدقوله عز وجل" واذا حضر القسمة لانها فى معنى المبراث والمال فذكر
  على ذلك وتقسمهم الدهر فتقسموا أى فرقهم فتقرقوا والتقسيم التفر بق وقول الشاعر
  يذكرقدرا تقسم مافيها فان هى قسعت * قذاك وان أكرت فعن أهلها تكرى
  قال أبو عمروقست عمت فى القسم وأكرت نقصت واستقسم أى طلب القسم بالازلام
  والسامى الذى يطوى الثياب أول طيها حتى تتكسر على طبه قال رؤية .
  طىّ القسامى برود العصاب • وقول ذى الرمّة ⁦(٢)⁩ • ولا تقسم شعبا واحد اشعب
  يقول انى ظنذت أن لا تنقسم سالات كثيرة يعى حالات شبابه خالا وأمر اواحدايعنى السكبر
  والشيب ⁦(قنم)⁩ القشم الاكل وقشمت الطعام قشمااذانفيت الردى منبه ويقال
  ما أصابت الابل منه مقشما أى لم تصب ما ترعاه وقشمت الخوص قشها اذا نققته لتسسفه
  والقشم بالكسر الجسم يقال أرى صيكم مختلاقد ذهب قشم -ه أى +ه ونيجمه وأنشذ
  ٨٢
  صجاج نى
  فى تستخسة بقية البيتة
  من عهدابراهيم لمايطسيم
  ١ه وتقدم فى طمم
  لا أحسب الدهريلى جدة أبد!
