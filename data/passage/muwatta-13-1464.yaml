label: { ar: "الموطأ 1464 — مالك: الجدة أم الأم لا ترث مع الأم شيئا، والجدة أم الأب لا ترث مع الأم ولا مع الأب، وإذا اجتمعتا فالقربى تأخذ السدس", en: "Muwatta 1464", es: "Muwatta 1464", fr: "Muwatta 1464", ur: "موطا 1464", tr: "El-Muvatta 1464 — Malik: Anneanne, anneyle birlikte hiçbir miras almaz; babaanne de ne anneyle ne de babayla birlikte miras almaz. İkisi de mevcutsa, daha yakın akraba altıda bir pay alır.", id: "Al-Muwatta 1464 — Malik: Nenek dari pihak ibu tidak mewarisi apa pun bersama ibu, dan nenek dari pihak ayah tidak mewarisi bersama ibu maupun ayah. Jika keduanya hadir, kerabat yang lebih dekat mendapat seperenam bagian." }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الجدة أم الأم لا ترث مع الأم شيئا، ويفرض لها فيما سوى ذلك السدس فريضة. وأن الجدة أم الأب لا ترث مع الأم ولا مع الأب شيئا، ويفرض لها فيما سوى ذلك السدس. فإذا اجتمعت الجدتان، أم الأب وأم الأم، وليس للمتوفى دونهما أب ولا أم، فإن أم الأم، إن كانت أقعدهما، فلها السدس دون أم الأب، وإن كانت أم الأب أقعدهما، أو كانتا في القعدد بمنزلة سواء، فالسدس بينهما نصفان. {cite:muwatta-maruf-1997 p.16}"
  tr: "Malik, aralarındaki yerleşik uygulamanın, anneannenin anneyle birlikte hiçbir miras almaması ve sadece sabit bir pay olarak altıda birine hak kazanması olduğunu belirtiyor. Benzer şekilde, babaanne de anne veya babayla birlikte hiçbir miras almaz ve sadece sabit bir pay olarak altıda birine hak kazanır. Eğer iki anneanne, babaanne ve anneanne mevcutsa ve ölen kişinin babası veya annesi yoksa, anneannenin en uzun süre hayatta kalan mal varlığına sahip olması durumunda altıda birini alır, babaanne ise hiçbir şey almaz. Eğer babaannenin en uzun süre hayatta kalan mal varlığına sahip olması durumunda veya her ikisi de eşit süre yaşamışsa, altıda bir pay aralarında eşit olarak paylaştırılır. {cite:muwatta-maruf-1997 s.16}"
  id: "Malik menyatakan bahwa praktik yang berlaku di antara mereka adalah nenek dari pihak ibu tidak mewarisi apa pun bersama ibu, dan hanya berhak atas seperenam sebagai bagian tetap. Demikian pula, nenek dari pihak ayah tidak mewarisi apa pun bersama ibu atau ayah, dan hanya berhak atas seperenam sebagai bagian tetap. Jika ada dua nenek, nenek dari pihak ayah dan nenek dari pihak ibu, dan almarhum tidak memiliki ayah atau ibu, maka jika nenek dari pihak ibu adalah orang yang memiliki sisa harta warisan terlama, ia menerima seperenam, sedangkan nenek dari pihak ayah tidak menerima apa pun. Jika nenek dari pihak ayah adalah orang yang memiliki sisa harta warisan terlama, atau jika mereka sama-sama berumur panjang, maka seperenam tersebut dibagi rata di antara mereka. {cite:muwatta-maruf-1997 p.16}"
