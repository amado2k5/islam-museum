label: { ar: "الموطأ 1464 — مالك: الجدة أم الأم لا ترث مع الأم شيئا، والجدة أم الأب لا ترث مع الأم ولا مع الأب، وإذا اجتمعتا فالقربى تأخذ السدس", en: "Muwatta 1464" }
summary:
  ar: "يقول مالك إن الأمر المجتمع عليه عندهم أن الجدة أم الأم لا ترث مع الأم شيئا، ويفرض لها فيما سوى ذلك السدس فريضة. وأن الجدة أم الأب لا ترث مع الأم ولا مع الأب شيئا، ويفرض لها فيما سوى ذلك السدس. فإذا اجتمعت الجدتان، أم الأب وأم الأم، وليس للمتوفى دونهما أب ولا أم، فإن أم الأم، إن كانت أقعدهما، فلها السدس دون أم الأب، وإن كانت أم الأب أقعدهما، أو كانتا في القعدد بمنزلة سواء، فالسدس بينهما نصفان. {cite:muwatta-maruf-1997 p.16}"
