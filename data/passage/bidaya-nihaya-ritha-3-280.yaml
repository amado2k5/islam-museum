text: "سنة ه رسول اللّٰه لم اجتمعنا في بيت عائشة، فنظر إلينا رسول اللّٰه لي فدمعت عيناه، ثم قال لنا: قد دنا الفراق ونعى إلينا نفسه، ثم قال: مرحبا بكم حيّاكم الله، هداكم الله، نصركم الله، نفعكم الله، وفقكم الله، سدّدكم …"
summary:
  ar: "مقطع من البداية والنهاية، المجلد المصوَّر 3، ص 280، فيه نعي وإخبار بوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from al-Bidaya wa-l-Nihaya, scan volume 3, p. 280, that carries a death announcement; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "البدایہ والنہایہ، اسکین جلد 3، ص 280 کا اقتباس جس میں وفات کی خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya, volume numérisé 3, p. 280, qui contient une annonce de décès; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de al-Bidaya wa-l-Nihaya, volumen escaneado 3, p. 280, que contiene un anuncio de fallecimiento; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "\"Başlangıç ve Son\" adlı resimli kitabın 3. cildinin 280. sayfasından, bir ölüm ilanı ve duyurusunu içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. En ünlü ağıt ve ölüm ilanlarını tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari \"Awal dan Akhir,\" Volume Bergambar 3, halaman 280, berisi obituari dan pengumuman kematian; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan obituari paling terkenal."
