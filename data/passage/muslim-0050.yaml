label: { ar: "مسلم 50 — ما من نبي بعثه الله في أمة قبلي إلا كان له حواريون وأصحاب", en: "Muslim 50 — Every prophet before me had disciples and companions" }
text: "قال رسول الله: «ما من نبي بعثه الله في أمة قبلي إلا كان له من أمته حواريون وأصحاب يأخذون بسنته ويقتدون بأمره، ثم إنها تخلف من بعدهم خلوف يقولون ما لا يفعلون ويفعلون ما لا يؤمرون»"
summary:
  ar: "رواية عبد الله بن مسعود في كتاب الإيمان من صحيح مسلم؛ يستكمل الحديث بجهاد الثلاثة: من جاهدهم بيده فهو مؤمن ومن جاهدهم بلسانه فهو مؤمن ومن جاهدهم بقلبه فهو مؤمن، وليس وراء ذلك من الإيمان حبة خردل."
