label: { ar: "جامع الترمذي 12 — التحريم", en: "Jami' al-Tirmidhi 12 — prohibition", ur: "جامع ترمذی 12 — تحریم", es: "Jami' al-Tirmidhi 12 — prohibición" }
text: "… وَتَكَلَّمَ فِيهِ. وَرَوَى عُبَيْدُ اللَّهِ عَنْ نَافِعٍ عَنِ ابْنِ عُمَرَ قَالَ قَالَ عُمَرُ مَا بُلْتُ قَائِمًا مُنْذُ أَسْلَمْتُ. وَهَذَا أَصَحُّ مِنْ حَدِيثِ عَبْدِ الْكَرِيمِ وَحَدِيثُ بُرَيْدَةَ فِي هَذَا غَيْرُ مَحْفُوظٍ. وَمَعْنَى النَّهْىِ عَنِ الْبَوْلِ قَائِمًا عَلَى التَّأْدِيبِ لاَ عَلَى التَّحْرِيمِ. وَقَدْ رُوِيَ عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ قَالَ إِنَّ مِنَ الْجَفَاءِ أَنْ تَبُولَ وَأَنْتَ قَائِمٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 12، يذكر التحريم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 12 (The Book on Purification), that mentions prohibition. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 12، جس میں تحریم کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 12 (El Libro de la Purificación), menciona la prohibición. El Navegador Halal y Haram lo incluye en su lista de textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
