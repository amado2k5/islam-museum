text: "… دينار -، عن أبيه، عن أبي صالح، عن أبي هريرة صه، قال: قال رسول اللّٰه في الإيمان تِسعٌ وتسعونَ شعبة ؛ أَعظَمُ ذلك قولُ: لا إله إلَّا الله، وأدنَى ذلك: كفُّ الأذى من طريق الناسِ، والحياء شعبة مِنَ الإيمان - …"
