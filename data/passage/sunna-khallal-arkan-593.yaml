text: "… دينار -، عن أبيه، عن أبي صالح، عن أبي هريرة صه، قال: قال رسول اللّٰه في الإيمان تِسعٌ وتسعونَ شعبة ؛ أَعظَمُ ذلك قولُ: لا إله إلَّا الله، وأدنَى ذلك: كفُّ الأذى من طريق الناسِ، والحياء شعبة مِنَ الإيمان - …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 593، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 593, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 593 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 593, que menciona las ramas de la fe; tomado del escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador de Pilares y Ramas de la Fe lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 593, mentionnant les piliers de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 593. sayfasından, inancın dallarını anlatan bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku Al-Khallal \"Al-Sunnah,\" halaman 593, yang menyebutkan cabang-cabang iman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
