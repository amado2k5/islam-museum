text: "… ابو عبد اللّٰه الكوف ولد سنة خمس عشرة وما ثتين وحدث ببغداد فسمع منه الشافعى وابن المعابى ووثقه وتوفى ببغداد فى قطيعة الربيع فى رمضان هذه السنة وحمل الى الكوفة فدفن بها. - عبيد الله بن عبد اللّٰه بن طاهر …"
summary:
