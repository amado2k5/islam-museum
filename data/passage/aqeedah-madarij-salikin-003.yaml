text: "ف بذلك إلى تأخير الهروي لمقام التوحيد ، وجعله آخر المقامات في كتابه منازل السائرين. (٢) هذه الأقوال التي خطأها ابن القيم هي أقوال لمن ذهب إلى أن المعرفة بالله لا تحصل إلا بالنظر ، وهو قول لكثير من أهل"
