text: "… رواية للبخاري في صحيحه و و فإن اللّه حرم عليكم دماءكم وأموالكم وأعراضكم إلاً بحق. وفي رواية : دماؤكم وأموالُكم وأعراضُكم عليكُم حرامُ، مثلُ هذا اليوم، وهذا البلد إلى يوم القيامة، حتّى دفعةٌ يدفعُها مسلمٌ مسلماً يريدُ بها سوءاً حرام. …"
