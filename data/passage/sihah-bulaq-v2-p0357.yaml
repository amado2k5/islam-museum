text: |-
  •⁦(فصل القاف)⁩.
  قنتف).
  ويقال أيضاه ماقتلان أى مثلان وحتنان وأقتلت فلانا أى عرّضته للقتل عن أبى عبيدة
  وقتلوا تقتسلا شدّد للكثرة ورجل مقتل أى محرب وقلب مقتل أى مذلل قتله العشق
  واستقدل أى استمات ورجل قتبل أى مقتول وامرأة قتيل ورجال ونسوة قملى فان لم تذكر
  المرأة قلت هذه قتيلة بنى فلان وكذات مررت بقتيلة لانك تسلات به طريقة الاسم وامرأة
  قتول أى قائلة وقال
  قتول بعينيها رمتك وانما • سهام الغوانى القاتلات عيونها
  والقتال بالفتح النفس ويقية الجسم وناقة ذات قتال اذا كانت وثيقة قال ذوالرمة
  مهاو يدءن الجلس غحخلاقتبالها• نقول منه قتله كماتول صدره ورأسه وفاده ويقال
  قتل الرجل فان كان قتله العشق أوالجنّ قبل اقتتل حكاه الفراء عن الكسائ قال ولا يقال
  فى هذين الااقتتل قال ذوارمة
  اذا ما اهر وحاولن أن يقنتلنه * بلااحنة بين النفوس ولاذحل
  وتقتل الرجل بمحاجته تأتى لها وتقتلت المرأة فى منيتها اذا تقلبت وتثنت وتكسرت وقال
  تقتات لى -تى اذا ماقتلتى ننسكت ماهذا بفعل النواسك
  وتقاتل القوم واقتتلوا بعى ولم يدغم لان التاءغير لازمة ومنهم من يدغم فيقول قتاوا يقتلون
  فينقل حركة التساعالى القاف فيم ما ويحذف الالف لانها مجتلية للسكون وتصديق ذلك قراءة
  الحسن الامن خطف انظطفة ومنهم من يكسر القاف فيهما لالتقاء الساكنين والفاعلى من
  الأوّل مقتل ومن الشانى مقتل بكسر القساف وأهل مكة يقولون مقتل يتبعون الضمة الضمة
  قال سيبويه وحدثنى اخليسل وهرون أن أناسا يقولون مردفين يريدون مرتدفين ابعوا
  الضعة الضمة وقول الراجز
  تعرّضت لى بمكان حلّ •تعرّض المهرة فى الطول" • تعرّضالم يال عن قتللَ
  أراد عن قتلى فلما أدخل عليه لامامشددة كما أدخل نونامشددة فى قوله
  أحب منك موضع القرطنّ» وصار الاعراب عليه فتح اللام الأولى كما يفتح فى قولك مررت
  بتمروبتمرة وبرجل وبرجلين ثل بوزيد القنول العيّ المسترخى مثل العنول وأنشد
  لا تجعليف كفتى قثول * رث حبل الثلة المبتل"
  ( قجل قمل الشئ يقعل فحولايبس فهو قاحل والمتقسل الرجل اليابس الجلد السني الحال
  وقول بالكسر فيلاه :له فه وقمل وقجل الشيخ قحلا يس جلده على عظبمه وشيخ قمل بالتسكين
  وانقعل أيضا بكسر الهمزة أى مسنّ جدّا وأقحات الشى أيبسته والقصال داء يصيب الغنم
  ضبف جاودها( قذل القذال جاع.وخر الرأس وهو معقد العذار من الفرس خلف
  الناصية ويقال القذالان مااكتنف فأس القفاهن عن يمين وشمال ويجمع على أقذلة وقذل
  وقدلته ضر بت قذِله ويقال القذل الميل والجور ذعل) أبو عمرور جل قدعل مثال
  سحل هين خسيس واقد عل عسر ⁦(قد عمل)⁩ أبوز يدما عنبده قد عملة أى شئ والقد عملة
  المرأة القصيرة الحسيسة وتصغيرها قديم وقال يعضهم القذعمل والقد عملة الضيخيم من الابل
  (قنذفل الاصمعىّ القبدّفيل الضخم قال المخزوع العدى
