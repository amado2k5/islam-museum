text: "… أدخلي في بطني الأحمِلَك سنتين وخلصيني جفا جحا أُمَّهُ، فقالت له: أهذا جزائي، وقد حملتُك في بطني تسعةَ أشهر ؟ فقال لها: أُدخلي في بطني لأَحملك سنتينِ، وخلْصيني.. نسيت واحداً من عيالي دخل جحا على بعض الملوك يوماً، فقال له …"
summary:
  ar: "أساء جحا إلى أمه، فذكّرته بأنها حملته تسعة أشهر، فقال لها أن تدخل في بطنه ليحملها سنتين ثم يتخلص منها. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  en: "Juha is rude to his mother, who reminds him she carried him nine months; he says let her enter his belly so he can carry her two years and then be released. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  ur: "جحا نے اپنی ماں سے بدتمیزی کی، تو اس نے اسے یاد دلایا کہ اس نے اسے نو مہینے اٹھایا تھا، جحا نے کہا کہ وہ اس کے پیٹ میں آ جائے تاکہ وہ اسے دو سال اٹھائے اور پھر اس سے جان چھڑا لے۔ {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  fr: "Juha est impoli avec sa mère, qui lui rappelle qu'elle l'a porté neuf mois ; il dit qu'elle n'a qu'à entrer dans son ventre pour qu'il la porte deux ans, puis qu'il soit libéré. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  es: "Juha es grosero con su madre, que le recuerda que lo llevó nueve meses; él dice que entre en su vientre para que él la lleve dos años y luego quede libre. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
  tr: "Juha annesine hakaret etti, bunun üzerine annesi ona kendisini dokuz ay boyunca karnında taşıdığını hatırlattı. Juha da annesine karnına girmesini, böylece onu iki yıl boyunca taşıyıp sonra da ondan kurtulabileceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 188}"
  id: "Juha menghina ibunya, jadi ibunya mengingatkannya bahwa ia telah mengandungnya selama sembilan bulan. Juha menyuruh ibunya masuk ke dalam perutnya agar ia bisa mengandungnya selama dua tahun dan kemudian menyingkirkannya. {cite:juha-nawadir-kubra-djuwaydi p. 188}"
