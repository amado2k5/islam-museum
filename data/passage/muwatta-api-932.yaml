label: { ar: "موطأ مالك 932 — الأب والأبوة", en: "Muwatta Malik 932 — the father and fatherhood", ur: "موطأ مالک 932 — باپ اور والدیت", es: "Muwatta Malik 932 — el padre y la paternidad", fr: "Muwatta Malik 932 — le père et la paternité" }
text: "وَحَدَّثَنِي عَنْ مَالِكٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ أُمِّ الْمُؤْمِنِينَ، أَنَّ رَسُولَ اللَّهِ ذَكَرَ صَفِيَّةَ بِنْتَ حُيَىٍّ فَقِيلَ لَهُ قَدْ حَاضَتْ. فَقَالَ رَسُولُ اللَّهِ \" لَعَلَّهَا حَابِسَتُنَا \". فَقَالُوا يَا رَسُولَ اللَّهِ إِنَّهَا قَدْ طَافَتْ. فَقَالَ رَسُولُ اللَّهِ \" فَلاَ إِذًا \". قَالَ مَالِكٌ قَالَ هِشَامٌ قَالَ عُرْوَةُ قَالَتْ عَائِشَةُ. وَنَحْنُ نَذْكُرُ …"
summary:
  ar: "حديث في موطأ مالك، رقم 932، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 932 (Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "موطأ مالک کی حدیث نمبر 932، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 932 (Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Muwatta Malik, n° 932 (Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
