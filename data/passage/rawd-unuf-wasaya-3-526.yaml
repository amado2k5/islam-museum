text: "… خمةً وثمانين وَبنْا، ولأُسامة ين زيد أربسين وَسْقًا، وللِقْداد بن الأسود خمسةَ عَشْر وَسْبقًا، ولأمّ رُمَيْئَةُ خسةَ أَوْسُقُ. :. شهد رحمانُ بن عَفَان وعباس وكتبٍ. وصاة الرسول عند موته قال ابن إسحاق : وحدتنى صالح بن كيسان، عن ابن شهاب …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 526، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
