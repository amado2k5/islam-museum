  fr: "Extrait du livre « al-Rawd al-Unuf » d'al-Suhayli (tome 3, p. 526) mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait est répertorié dans le Navigateur des Testaments."
  tr: "Suhayli'nin \"El-Ravd el-Unuf\" adlı eserinin Resimli Cilt 3, sayfa 526'sından bir alıntı; vasiyetname veya son vasiyet ve ölüm saatinden bahsediyor; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
