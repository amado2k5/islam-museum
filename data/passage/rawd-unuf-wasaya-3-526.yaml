text: "… خمةً وثمانين وَبنْا، ولأُسامة ين زيد أربسين وَسْقًا، وللِقْداد بن الأسود خمسةَ عَشْر وَسْبقًا، ولأمّ رُمَيْئَةُ خسةَ أَوْسُقُ. :. شهد رحمانُ بن عَفَان وعباس وكتبٍ. وصاة الرسول عند موته قال ابن إسحاق : وحدتنى صالح بن كيسان، عن ابن شهاب …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 526، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Suhayli's al-Rawd al-Unuf, scan volume 3, p. 526, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الروض الانف، سہیلی، اسکین جلد 3، ص 526 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
