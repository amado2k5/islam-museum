label: { ar: "الموطأ 2621 — أبو سهيل بن مالك: عمر بن عبد العزيز يسأل عن القدرية فيرى استتابتهم فإن أبوا فالسيف", en: "Muwatta 2621" }
summary:
  ar: "يروي مالك عن عمه أبي سهيل بن مالك قال: كنت أسير مع عمر بن عبد العزيز، فقال: ما رأيك في هؤلاء القدرية؟ فقلت: رأيي أن تستتيبهم، فإن قبلوا وإلا عرضتهم على السيف. فقال عمر بن عبد العزيز: وذلك رأيي. قال مالك: وذلك رأيي. {cite:muwatta-maruf-1997 p.481}"
