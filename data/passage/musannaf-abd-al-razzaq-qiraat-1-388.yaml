text: "بني أَسد قال : رأَيت ابن عباس يصلِّي في نعليه. - عبد الرزاق عن ابن مجاهد عن أَبيه أَنه كان يصلِّي في نعليه. - عبد الرزاق عن الثوري عن رجل من النخع أَن إبراهيم كان إذا أُقيمت الصلاة لبس نعليه …"
