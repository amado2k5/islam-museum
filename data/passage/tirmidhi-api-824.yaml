label: { ar: "جامع الترمذي 824 — الحلال", en: "Jami' al-Tirmidhi 824 — the lawful", ur: "جامع ترمذی 824 — حلال", es: "Jami' al-Tirmidhi 824 — el lícito" }
text: "… الشَّامِ وَهُوَ يَسْأَلُ عَبْدَ اللَّهِ بْنَ عُمَرَ عَنِ التَّمَتُّعِ بِالْعُمْرَةِ إِلَى الْحَجِّ فَقَالَ عَبْدُ اللَّهِ بْنُ عُمَرَ هِيَ حَلاَلٌ. فَقَالَ الشَّامِيُّ إِنَّ أَبَاكَ قَدْ نَهَى عَنْهَا. فَقَالَ عَبْدُ اللَّهِ بْنُ عُمَرَ أَرَأَيْتَ إِنْ كَانَ أَبِي نَهَى عَنْهَا وَصَنَعَهَا رَسُولُ اللَّهِ أَأَمْرَ أَبِي نَتَّبِعُ أَمْ أَمْرَ رَسُولِ اللَّهِ فَقَالَ الرَّجُلُ بَلْ أَمْرَ رَسُولِ اللَّهِ. فَقَالَ لَقَدْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 824، يذكر الحلال. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 824 (The Book on Hajj), that mentions the lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 824، جس میں حلال کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 824 (El Libro del Hajj), menciona lo lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
