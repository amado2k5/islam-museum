label: { ar: "صحيح البخاري 5973 — الأب والأبوة، بر الوالدين أو عقوقهما", en: "Sahih al-Bukhari 5973 — the father and fatherhood; dutifulness to the parents or disobedience to them", ur: "صحیح بخاری 5973 — باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی", es: "Sahih al-Bukhari 5973 — El padre y la paternidad; el cumplimiento del deber hacia los padres o la desobediencia hacia ellos.", fr: "Sahih al-Bukhari 5973 — le père et la paternité; le devoir envers les parents ou la désobéissance envers eux", tr: "Sahih el-Buhari 5973 — Baba ve Babalık, Anne Babaya İyilik mi Yoksa Onlara İtaatsizlik mi?", id: "Sahih al-Bukhari 5973 — Ayah dan Peran Ayah, Berbuat Baik kepada Orang Tua atau Tidak Taat kepada Mereka" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ أَبِيهِ، عَنْ حُمَيْدِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍوما ـ قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ مِنْ أَكْبَرِ الْكَبَائِرِ أَنْ يَلْعَنَ الرَّجُلُ وَالِدَيْهِ \". قِيلَ يَا رَسُولَ اللَّهِ وَكَيْفَ يَلْعَنُ الرَّجُلُ وَالِدَيْهِ قَالَ \" يَسُبُّ الرَّجُلُ أَبَا الرَّجُلِ، فَيَسُبُّ أَبَاهُ، وَيَسُبُّ أَمَّهُ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5973، يذكر الأب والأبوة، وبر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5973 (Good Manners and Form (Al-Adab)), that mentions the father and fatherhood, dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5973، جس میں باپ اور والدیت، والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5973 (Buenas costumbres y modales (Al-Adab)), menciona al padre y la paternidad, así como el respeto o la desobediencia hacia los padres. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5973 (Les bonnes manières et la bienséance), évoque le père et la paternité, ainsi que le devoir envers les parents et la désobéissance à ces derniers. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Sahih el-Buhari'de 5973 numaralı hadis, baba ve babalık kavramından, anne babaya saygı göstermekten veya göstermemekten bahseder. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan metinlerle birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5973, menyebutkan tentang ayah dan peran ayah, serta menghormati atau durhaka kepada orang tua. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
