text: "فَكَتَبَ إِلَىَّ إِنَّمَا كَانَ ذَلِكَ فِي أَوَّلِ الإِسْلاَمِ قَدْ أَغَارَ رَسُولُ اللَّهِ صلى الله عليه وسلم عَلَى بَنِي الْمُصْطَلِقِ وَهُمْ غَارُّونَ وَأَنْعَامُهُمْ تُسْقَى عَلَى الْمَاءِ فَقَتَلَ مُقَاتِلَتَهُمْ وَسَبَى سَبْيَهُمْ وَأَصَابَ يَوْمَئِذٍ - قَالَ يَحْيَى أَحْسِبُهُ قَالَ - جُوَيْرِيَةَ - أَوْ قَالَ الْبَتَّةَ - ابْنَةَ الْحَارِثِ وَحَدَّثَنِي هَذَا الْحَدِيثَ عَبْدُ اللَّهِ بْنُ عُمَرَ وَكَانَ فِي ذَاك …"
summary:
  ar: "في صحيح مسلم؛ إرسال كتاب أو رسالة إلى طرف."
