text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ عَلَى حِرَاءَ هُوَ وَأَبُو بَكْرٍ وَعُمَرُ وَعَلِيٌّ وَعُثْمَانُ وَطَلْحَةُ وَالزُّبَيْرُم فَتَحَرَّكَتِ الصَّخْرَةُ فَقَالَ النَّبِيُّ \" اهْدَأْ إِنَّمَا عَلَيْكَ نَبِيٌّ أَوْ صِدِّيقٌ أَوْ شَهِيدٌ \".وَفِي الْبَابِ عَنْ عُثْمَانَ وَسَعِيدِ بْنِ زَيْدٍ وَابْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3696، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3696 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3696، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
