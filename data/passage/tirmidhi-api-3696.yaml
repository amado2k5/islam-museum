label: { ar: "جامع الترمذي 3696 — الأب والأبوة", en: "Jami' al-Tirmidhi 3696 — the father and fatherhood", ur: "جامع ترمذی 3696 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3696 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3696 — le père et la paternité", tr: "Cami' el-Tirmizi 3696 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3696 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، قَالَ حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ سُهَيْلِ بْنِ أَبِي صَالِحٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ كَانَ عَلَى حِرَاءَ هُوَ وَأَبُو بَكْرٍ وَعُمَرُ وَعَلِيٌّ وَعُثْمَانُ وَطَلْحَةُ وَالزُّبَيْرُم فَتَحَرَّكَتِ الصَّخْرَةُ فَقَالَ النَّبِيُّ \" اهْدَأْ إِنَّمَا عَلَيْكَ نَبِيٌّ أَوْ صِدِّيقٌ أَوْ شَهِيدٌ \".وَفِي الْبَابِ عَنْ عُثْمَانَ وَسَعِيدِ بْنِ زَيْدٍ وَابْنِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3696، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3696 (Chapters on Virtues), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3696، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3696 (Capítulos sobre las virtudes), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 3696 (Chapitres sur les vertus), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Cami' el-Tirmizi'de 3696 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3696, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
