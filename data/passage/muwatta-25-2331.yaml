summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا الذي لا اختلاف فيه: أن المكاتب بمنزلة عبد أعتقه سيده بعد خدمة عشر سنين. فإذا هلك سيده قبل مضي العشر سنين، فإن ما بقي من خدمته لورثته، وكان ولاؤه للذي عقد عتقه، ولولده من الرجال أو العصبة. {cite:muwatta-maruf-1997 p.360}"
