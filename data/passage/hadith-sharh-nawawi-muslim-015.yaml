text: "ع وزوجها حاضر إلا بإذنه لحديث أبي هريرة السابق في صحيح مسلم في كتابه الزكاة وإنما كانت تصومه في شعبان لأن الني ٤ كان يصوم معظم شعبان فلا حاجة له فيهن حينئذ في النهار ولأنه إذا جاء شعبان يضيق قضاء"
