text: "… والاسْتِحْبَابِ، دون وُجُوب الفَرْض واللُّزوم ؛ وإنما شبَّهه بالواجب تأكيداً، كما يقول الرجلُ لصاحبه : حقُّكَ عليَّ واجبٌ، وكان الحَسنُ. يراه لازماً، وحكى ذلك عن مالك. يقال: وَجَبَ الشيءُ يجِبُ وجوبًا إِذا ثَبَتَ، ولزمَ..- والواحِبُ والفَرْض، عند الشافعي، سواءً، وهو …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 793، يرد فيه ذكر الفرض، والواجب، والوجوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 793, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 793 کا اقتباس جس میں فرض، واجب، وجوب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
