label: { ar: "الموطأ 1261 — مالك: إذا رمى المحرم شيئا فأصاب صيدا لم يرده فقتله، فعليه أن يفديه، والعمد والخطأ في ذلك سواء", en: "Muwatta 1261", es: "Muwatta 1261", fr: "Muwatta 1261", ur: "موطا 1261", tr: "El-Muvatta 1261 — Malik: İhramlı bir hacı, attığı bir şeyle av hayvanına isabet ederse ve bu hayvanı öldürmeyi amaçlamamışsa, fidye ödemek zorundadır. Bu konuda kasıtlı ve kasıtsız öldürme aynıdır.", id: "Al-Muwatta 1261 — Malik: Jika seorang jamaah haji yang sedang ihram melempar sesuatu dan mengenai hewan buruan yang tidak ia niatkan untuk dibunuh, maka ia wajib membayar tebusan. Pembunuhan yang disengaja dan tidak disengaja sama saja dalam hal ini." }
summary:
  ar: "يذكر مالك أنه سمع بعض أهل العلم يقول إذا رمى المحرم شيئا فأصاب شيئا من الصيد لم يرده فقتله، فإن عليه أن يفديه، وكذلك الحلال يرمي في الحرم شيئا فيصيب صيدا لم يرده فيقتله، فإن عليه أن يفديه، لأن العمد والخطأ في ذلك بمنزلة سواء. {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, bazı âlimlerin, ihramlı bir hacının attığı bir şeyin, kasıtsız bir av hayvanına isabet edip öldürmesi durumunda fidye ödemesi gerektiğini söylediklerini duyduğunu belirtiyor. Benzer şekilde, ihramlı bir hacının attığı bir şeyin, kasıtsız bir av hayvanına isabet edip öldürmesi durumunda da fidye ödemesi gerekir; çünkü kasıtlı ve kasıtsız eylemler aynı şekilde değerlendirilir. {cite:muwatta-maruf-1997 s.561}"
  id: "Malik menyebutkan bahwa ia mendengar beberapa ulama mengatakan bahwa jika seorang jamaah haji yang sedang ihram melempar sesuatu dan mengenai serta membunuh hewan buruan yang tidak ia inginkan, maka ia harus membayar tebusan. Demikian pula, jika seorang jamaah haji yang sedang ihram melempar sesuatu dan mengenai serta membunuh hewan buruan yang tidak ia inginkan, maka ia harus membayar tebusan, karena tindakan yang disengaja dan tidak disengaja diperlakukan sama. {cite:muwatta-maruf-1997 p.561}"
