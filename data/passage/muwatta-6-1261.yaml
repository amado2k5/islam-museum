label: { ar: "الموطأ 1261 — مالك: إذا رمى المحرم شيئا فأصاب صيدا لم يرده فقتله، فعليه أن يفديه، والعمد والخطأ في ذلك سواء", en: "Muwatta 1261" }
summary:
  ar: "يذكر مالك أنه سمع بعض أهل العلم يقول إذا رمى المحرم شيئا فأصاب شيئا من الصيد لم يرده فقتله، فإن عليه أن يفديه، وكذلك الحلال يرمي في الحرم شيئا فيصيب صيدا لم يرده فيقتله، فإن عليه أن يفديه، لأن العمد والخطأ في ذلك بمنزلة سواء. {cite:muwatta-maruf-1997 p.561}"
