text: "… إسلام الطبيب ضماد : أتى صماد بن ثعلبة مكة معتمراً، فسمع كفار قريش، يقولون. مُحمد مجنون. فقال : لو أتيت هذا الرجل فداويته، فجاءه فقال : يا محمد إني أداوي من الريح فإن شئت داويتُك لعَلَّ اللّه ينفعك، فتشهد رسول …"
