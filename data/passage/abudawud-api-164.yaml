label: { ar: "سنن أبي داود 164 — الأب والأبوة", en: "Sunan Abi Dawud 164 — the father and fatherhood", ur: "سنن ابی داؤد 164 — باپ اور والدیت", es: "Sunan Abi Dawud 164 — El padre y la paternidad" }
text: "… قَالَ كُنْتُ أُرَى أَنَّ بَاطِنَ الْقَدَمَيْنِ أَحَقُّ بِالْمَسْحِ مِنْ ظَاهِرِهِمَا حَتَّى رَأَيْتُ رَسُولَ اللَّهِ يَمْسَحُ عَلَى ظَاهِرِهِمَا. قَالَ وَكِيعٌ يَعْنِي الْخُفَّيْنِ. وَرَوَاهُ عِيسَى بْنُ يُونُسَ عَنِ الأَعْمَشِ كَمَا رَوَاهُ وَكِيعٌ وَرَوَاهُ أَبُو السَّوْدَاءِ عَنِ ابْنِ عَبْدِ خَيْرٍ عَنْ أَبِيهِ قَالَ رَأَيْتُ عَلِيًّا تَوَضَّأَ فَغَسَلَ ظَاهِرَ قَدَمَيْهِ وَقَالَ لَوْلاَ أَنِّي رَأَيْتُ رَسُولَ اللَّهِ يَفْعَلُهُ. وَسَاقَ الْحَدِيثَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 164، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 164 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 164، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 164 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
