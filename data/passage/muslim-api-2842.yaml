text: "… جَمِيعًا عَنْ أَبِي عَوَانَةَ، - قَالَ سَعِيدٌ حَدَّثَنَا أَبُو عَوَانَةَ، - عَنْ إِبْرَاهِيمَ بْنِ مُحَمَّدِ بْنِ الْمُنْتَشِرِ، عَنْ أَبِيهِ، قَالَ سَأَلْتُ عَبْدَ اللَّهِ بْنَ عُمَرَ -ما - عَنِ الرَّجُلِ، يَتَطَيَّبُ ثُمَّ يُصْبِحُ مُحْرِمًا فَقَالَ مَا أُحِبُّ أَنْ أُصْبِحَ مُحْرِمًا أَنْضَخُ طِيبًا لأَنْ أَطَّلِيَ بِقَطِرَانٍ أَحَبُّ إِلَىَّ مِنْ أَنْ أَفْعَلَ ذَلِكَ. فَدَخَلْتُ عَلَى عَائِشَةَ -ا - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2842، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2842 (The Book of Pilgrimage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2842، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
