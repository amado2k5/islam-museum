label: { ar: "الموطأ 1624 — مالك: العبد الذي يتظاهر من امرأته لا يدخل عليه إيلاء، لأنه لو ذهب يصوم كفارة المتظاهر دخل عليه طلاق الإيلاء قبل أن يفرغ من صيامه", en: "Muwatta 1624", es: "Muwatta 1624", fr: "Muwatta 1624", ur: "موطا 1624", tr: "El-Muvatta 1624 — Malik: Karısıyla cinsel perhiz yemini eden bir köle, ila’ (cinsel ilişkiden uzak durma yemini) yasağı kapsamına girmez; çünkü böyle bir yeminin kefareti olarak oruç tutarsa, orucunu bitirmeden önce ila’ boşanması kendisine yüklenir.", id: "Al-Muwatta 1624 — Malik: Seorang budak yang bernazar untuk menjaga kesucian dengan istrinya tidak termasuk dalam larangan ila’ (nazar untuk menjauhi hubungan suami istri), karena jika ia berpuasa sebagai penebusan atas nazar tersebut, maka perceraian ila’ akan dikenakan kepadanya sebelum ia menyelesaikan puasanya." }
summary:
  ar: "يقول مالك في العبد يتظاهر من امرأته، إنه لا يدخل عليه إيلاء، وذلك أنه لو ذهب يصوم صيام كفارة المتظاهر، دخل عليه طلاق الإيلاء قبل أن يفرغ من صيامه. {cite:muwatta-maruf-1997 p.71}"
  tr: "Malik, karısından cinsel ilişkiden uzak durma yemini eden bir köle hakkında şöyle der: \"İla' ile boşanma (evlilikten uzak durma yemini) ona uygulanmaz, çünkü eğer böyle bir yemin eden için kefaret orucunu tutmaya giderse, orucunu bitirmeden önce ila' ile boşanma ona uygulanır.\" {cite:muwatta-maruf-1997 s.71}"
  id: "Malik mengatakan mengenai seorang budak yang bernazar untuk berpantang dari istrinya bahwa perceraian dengan ila' (nazar untuk berpantang dari hubungan suami istri) tidak akan berlaku baginya, karena jika ia pergi dan berpuasa untuk menebus dosa orang yang bernazar seperti itu, maka perceraian dengan ila' akan berlaku baginya sebelum ia menyelesaikan puasanya. {cite:muwatta-maruf-1997 p.71}"
