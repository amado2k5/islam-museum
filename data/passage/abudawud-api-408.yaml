label: { ar: "سنن أبي داود 408 — الأب والأبوة", en: "Sunan Abi Dawud 408 — the father and fatherhood", ur: "سنن ابی داؤد 408 — باپ اور والدیت", es: "Sunan Abi Dawud 408 — El padre y la paternidad", fr: "Sunan Abi Dawud 408 — le père et la paternité", tr: "Sunan Abi Davud 408 — Baba ve Babalık", id: "Sunan Abi Dawud 408 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحْمَنِ الْعَنْبَرِيُّ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ أَبِي الْوَزِيرِ، حَدَّثَنَا مُحَمَّدُ بْنُ يَزِيدَ الْيَمَامِيُّ، حَدَّثَنِي يَزِيدُ بْنُ عَبْدِ الرَّحْمَنِ بْنِ عَلِيِّ بْنِ شَيْبَانَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، عَلِيِّ بْنِ شَيْبَانَ قَالَ قَدِمْنَا عَلَى رَسُولِ اللَّهِ الْمَدِينَةَ فَكَانَ يُؤَخِّرُ الْعَصْرَ مَا دَامَتِ الشَّمْسُ بَيْضَاءَ نَقِيَّةً."
summary:
  ar: "حديث في سنن أبي داود، رقم 408، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 408 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 408، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 408 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 408 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 408 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 408, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
