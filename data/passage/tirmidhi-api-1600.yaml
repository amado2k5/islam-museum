label: { ar: "جامع الترمذي 1600 — الأب والأبوة", en: "Jami' al-Tirmidhi 1600 — the father and fatherhood", ur: "جامع ترمذی 1600 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1600 — El padre y la paternidad" }
text: "حَدَّثَنَا هَنَّادٌ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ سَعِيدِ بْنِ مَسْرُوقٍ، عَنْ عَبَايَةَ بْنِ رِفَاعَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، رَافِعِ بْنِ خَدِيجٍ قَالَ كُنَّا مَعَ رَسُولِ اللَّهِ فِي سَفَرٍ فَتَقَدَّمَ سَرَعَانُ النَّاسِ فَتَعَجَّلُوا مِنَ الْغَنَائِمِ فَاطَّبَخُوا وَرَسُولُ اللَّهِ فِي أُخْرَى النَّاسِ فَمَرَّ بِالْقُدُورِ فَأَمَرَ بِهَا فَأُكْفِئَتْ ثُمَّ قَسَمَ بَيْنَهُمْ فَعَدَلَ بَعِيرًا بِعَشْرِ شِيَاهٍ. قَالَ أَبُو عِيسَى وَرَوَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1600، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1600 (The Book on Military Expeditions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1600، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1600 (El Libro de las Expediciones Militares), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
