text: "… الذي يلى ذاك حقّ واجب ورحم موصولة حدثنا موسى بوع اسماعيل قال حدثناا بواعوانه عن عبد الملك بن عميو عن موسابع طلحة عن ابي هريرع قال لما نزلت هذه الاية وانذر عشيرتك الاقبين قام البنى صلى ان علية ولم فنادى …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 1، ص 12، يرد فيه ذكر الواجب، وحق على كل مسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 1, p. 12, whose wording mentions the obligatory (wajib), a right due from every Muslim; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 1، ص 12 کا اقتباس جس میں واجب، ہر مسلمان پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Adab al-Mufrad de al-Bukhari, volume numérisé 1, p. 12, dont le texte mentionne l'obligatoire (wajib), un droit dû par chaque musulman ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
