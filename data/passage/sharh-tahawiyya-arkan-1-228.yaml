text: "شرح العقيدة الطحاوية وستون شعبة. فالصلاة والصيام والحج والجهاد وبر الوالدين والأمر بالمعروف والنهي عن المنكر من الإيمان، وقال النبي وَلِيِي: من رأى منكم منكرًا فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان. ومسألة مسمى …"
