label: { ar: "الموطأ 937 — بلغ مالكاً أن عبد الملك بن مروان أهل من عند مسجد ذي الحليفة حين استوت به راحلته، وأن أبان بن عثمان أشار عليه بذلك", en: "Muwatta 937", es: "Muwatta 937", fr: "Muwatta 937", ur: "موطا 937", tr: "El-Muvatta 937 — Malik'e rivayet edildiğine göre, Abdülmalik ibn Mervan, bineği hazır olduğunda Zül-Huleyfe mescidinin yakınlarından ihram haline girdi ve Eban ibn Osman da ona bunu yapmasını tavsiye etmişti.", id: "Al-Muwatta 937 — Diriwayatkan kepada Malik bahwa Abd al-Malik ibn Marwan memasuki keadaan ihram dari dekat masjid Dhu al-Hulayfah ketika kendaraannya sudah siap, dan bahwa Aban ibn Uthman telah menasihatinya untuk melakukan hal itu." }
summary:
  ar: "يرويه مالك أنه بلغه أن عبد الملك بن مروان أهل من عند مسجد ذي الحليفة حين استوت به راحلته، وأن أبان بن عثمان أشار عليه بذلك. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1070). {cite:muwatta-maruf-1997 p.449}"
  tr: "Malik, Abdülmalik ibn Mervan'ın bineği hazır olduğunda Zülhîl-Huleyfe mescidinin yakınlarında ihram haline girdiğini ve Eban ibn Osman'ın da ona bunu tavsiye ettiğini duyduğunu bildirmiştir. Editör, bunu Malik'ten Ebu Musab'ın (ö. 1070) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.449}"
  id: "Malik melaporkan bahwa ia mendengar bahwa Abd al-Malik ibn Marwan memasuki keadaan ihram di dekat masjid Dhu al-Hulayfah ketika kendaraannya sudah siap, dan bahwa Aban ibn Uthman telah menasihatinya untuk melakukan hal itu. Editor menyebutkan bahwa Abu Mus'ab (wafat 1070) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.449}"
