  والتسكين شاذ فى اللفظ لانه لم يجى شئ من المصادر عليه قال أبو عبيد الشئان بغير همزمثل
  الشنان وأنشد للأحوص
  وما العيس الاماتلذِوتشتهى • وان لام فيه ذوالشنان وفندا
  شنىء الرجل فهو مشنو.أى مبغض وان كان جيلا ورجل مشنأ على مفعل بالفتح أى قبيح
  المنظرورجلان مشناوقوم مشنا والمشناء بالكسر على مفعال مثله وتشانوا أى ساغضو
  وقواهم لا أبالشانتك ولا أب لشانئك أى لميغضك قال ابن السكيت وهى كناية عن قولهم
  لا أبالك وشى به أى أقتربه قال الفرزدق
  فلو كان ه_ذا الامر فى جاهلية • شنقت به أوغص بالماءشاربه
  والشنوءة على فعولة التقزز وه والتباعد من الادناس تقول رجل فيه شنوءة ومنه أزد
  شنوة وهم حى من اليمن ينسب اليهم شنائى قال ابن السكيت ربما قالوا أزد شنوّة بالتشديد
  غير مهموزوينسب اليهاشنوى وقال
  فحن قريس وهم شنوّه * بتاقر يشاختم النبوّه
  با) الشى تصغيرشي° وثي. أيضا بكسر السين ولا تقل شوى واله-ع أشياء غير
  مصروف قال المليل انمارك صرفه لانّ أصله فعلامجع على غيرواحده كما أنّ الشعرامجع
  على غيروا حده لات الفاعل لا يجمع على فعلاءثم استثقلوا الهسمزتين فى آخره نقلوا إلإولى
  الى أول الكامة فقالوا أشياء كما قالواعقاب بعنقاة وأيشق وقسى فصارتة_ ديره لفهاء
  يدل على صحة ذلك أنه لا يصرف وأنه يصغر على أشياء وأنه يجمع على أشاوى وأصله أشائى
  قلبت الهمزياء فاجتمعت ثلاث يا آت حذفت الوسطى وقلت الاخيرة ألفا فأبدلت من
  الاولى واو كما والوا أنيته أبوة وحكى الاصعىّ أنه ممع رجلام ن أفصح العرب يقول طلف
  الاحران عندك لأشاوى مثال الصحارى ويجمع أيضاعلى أشايا وأشياوات وقال الاخفش
  هو أفعلاء فلهذالم يصرف لان أصله أشيئًا حذفت الهمزة التى بين الياء والالف للتخفيف
  قال ه المازنى يف تصغر العرب أشياءفة ال أشياء قال له تركت قولك لانّ كل جمع
  كسر على غير واحده وهو من أبنية الجع فانه يردّ فى التصغير الى واحده كما فالواش ويعرون
  فى تمغر الشعراه وفما لا يعقل بالالف والتاءفكان يجب أن يقال شيشات وهذا القول لا يلزم
  الخليل لان فعلاءليس من آبنية الجمع وقال الكسانى أشيا أفعال مش-ل فرخ وأفراخ
  وانماتر كواصر فها لكثرة استعمالهم لها لانها شبهت بفعلاء وهذا القول يدخل عليه
  الاولى وهد القول يدخل عليه أن لا يجمع على أشاوى والمئيئة الارادة وقدثت السئ
  أشاوه وقواهم كل شى بشيئه اللّٰه بكسر الشين مثل شيعة أى بشيئة اللّٰه تعالى الاصمحى شيأت
  الرجل على الامرحلته عليه وأشاء.لغة فى أجاءه أى الجأه وعيم تقول شرّ ما يشيئك الى هجة
