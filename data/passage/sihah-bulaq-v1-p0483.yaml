text: |-
  ١٠٨
  ⁦(باب الجيم)⁩
  ⁦(عوج)⁩
  الواحدة عفيج بالتحريك وكذلت العفيح والعفيج مثل كبدوكبدثلاث اغات وعفحه بالعصا
  شريه بها ويكني به أيضاعن الجماع والمعفاج ما يضرب به وتعفم البعير فى مشمه أى تعوج
  والعفجيج الضخم الاحق قال الراجز
  أكوى ذوى الاضغان كيامنضدا * منه-م وذا انخذاية العفنججا
  فضج العفضاج الضخم السمين الرخو وكذلك العفاضح بالضم يقال ان فلانالمعصوب
  ما عنضج ( لج لعلج العير والعلج الرحل من كفار العجم والمع علوج وأعلاج ومعلوجاء
  وعلجة ويقال أيضافلان علج مال كما يقال إزاء مال وعالحت الشئ معالمة وء_لاجا اذا
  زاواته وعالت الرجل فعلجنه علا غلبته واستعلج جلدفلان أى غلف فهو مستعلج الخلق
  ورجل علج بكسر اللام أى شديد وعالج موضع بالبادية به رمسل والعالج البعير الذى يرعى
  العلمان ودونبت والعلج من النخل بالتحريك أشاؤه واعتلجت الارض طال نباتها واعتلجت
  الامواج التطمت والعلن بزيادة الون الناقة الكاز اللحم وقال الراجز (رؤيةnn
  وخلطت كل دلاث علجن • تخلبط خرقاء اليدين خلبن
  والمعلهيج الهيين بزيادة الها. قال الاخطل
  فكفة- امينى وأنت معلهج * هذارمة جعد الانامل حنكل
  يم عمج يعميج بالكسر قلب معج اذا أسرع فى السير والتعمج الاءوجاج فى السنزوسهم
  عموج يتلوى فى ذهابه وتعميت الحية اذا تلوّت فم رها وقال يصف زمام الناقة
  تلاعب مثنى حضرمى كانه * تعمج شطان بذى خروع قفر
  والعومج الحية قال رؤبة
  حصب الغواة العومج المنسوسا وكذلك العميج
  بالضم والتشديد وقال
  يبعن مل العمج المنسوس • أهوج بشى مشية المألوس
  وقال قطرب هو العمج على وزن السبب نج) العنج ضرب من رياضة البعير يجذب
  الراكب خطامه فردّه على رجليه وقد عنجت البعير أعنجه بالضم والامم.نه العنج بالتحريك
  وفى المثل عوديعلم العنج والعناج فى الدلو العظيمة حبل أو بطان يشد فى أسفلها ثم يسد الى
  العراقى فيكون ءونالها وللوذم قاذا انقطعت الاوذام أمسكها العناج فاذا كانت الدلو
  خفيفة فعنا جهاخيط يشد فى إحدى آذانها الى العرقوة قال الحطيئة
  قوم اذاعقدوا عقد الخارهم * شدوا العناج وشدّوافوقه السكريا
  تقول منه عنجت الدلو عنجا وقول لاعناج له اذا أرسل على غيرروية أبو عبيد العناجيج جياد
  الخيل واحدها عنجوج والعنهنج العظيم وأنشد أبوعمر ولهميان السعدى عنهنج شفلج بلندح
  ( وج العوج بالتحريك مصدرة ولك عوج الشئ بالمكسر فهو أعوج والاسم العوج
  بكسر العين قال ابن السكيت وكل ما كان يفتصب كالحائط والعود قيل فيه عوج بالفتح
  والعوج بالكسرما كان فى أرض أودين أو معاش يقال فى دينه عوج وأعوج اسم فرس
  كان لبنى هلال تنسب اليه الاعوجيات وبنسات أعوج قال أبو عبيدة كان أعوج لسكندة
  فأخذنه بنوسليم فى بعض أيامهم فصار الى بنى هلال وليس فى العرب فحل أشهرولا أكثرنلا
