label: { ar: "سنن النسائي 5293 — أثر من الآثار المحفوظة", en: "Sunan al-Nasa'i 5293 — a relic kept after its owner", ur: "سنن نسائی 5293 — محفوظ آثار و تبرکات", es: "Sunan al-Nasa'i 5293 — una reliquia conservada después de su propietario." }
text: "… اتَّخَذَ رَسُولُ اللَّهِ خَاتَمًا مِنْ ذَهَبٍ وَجَعَلَ فَصَّهُ مِمَّا يَلِي بَطْنَ كَفِّهِ فَاتَّخَذَ النَّاسُ الْخَوَاتِيمَ فَأَلْقَاهُ رَسُولُ اللَّهِ فَقَالَ \" لاَ أَلْبَسُهُ أَبَدًا \". ثُمَّ اتَّخَذَ رَسُولُ اللَّهِ خَاتَمًا مِنْ وَرِقٍ فَأَدْخَلَهُ فِي يَدِهِ ثُمَّ كَانَ فِي يَدِ أَبِي بَكْرٍ ثُمَّ كَانَ فِي يَدِ عُمَرَ ثُمَّ كَانَ فِي يَدِ عُثْمَانَ حَتَّى هَلَكَ فِي بِئْرِ أَرِيسٍ."
summary:
  ar: "حديث في سنن النسائي، رقم 5293، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5293 (The Book of Adornment), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "سنن نسائی کی حدیث نمبر 5293، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5293 (El Libro de los Adornos), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
