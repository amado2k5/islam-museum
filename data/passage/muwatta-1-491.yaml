ref: "1.491"
label: { ar: "الموطأ 491 — أبو عبيد مولى ابن أزهر يشهد العيد مع عمر ثم عثمان ثم علي", en: "Muwatta 491" }
text: "إن هذين يومان نهى رسول الله عن صيامهما: يوم فطركم من صيامكم، والآخر يوم تأكلون فيه من نسككم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبيد مولى ابن أزهر، في باب الأمر بالصلاة قبل الخطبة في العيدين: شهد العيد مع عمر بن الخطاب فصلى ثم خطب فقال إن هذين يومان نهى النبي عن صيامهما: يوم الفطر من الصيام ويوم يأكل الناس فيه من نسكهم. ثم شهده مع عثمان بن عفان فصلى ثم خطب وقال إنه اجتمع لهم في يومهم عيدان، فمن أحب من أهل العالية أن ينتظر الجمعة فلينتظرها ومن أحب أن يرجع فقد أذن له. ثم شهده مع علي بن أبي طالب وعثمان محصور، فصلى ثم خطب. ويخرّجه المحقق عند البخاري (1990) ومسلم (3/152) وابن حبان وأحمد والشافعي ومحمد بن الحسن من طرق أصحاب مالك، ويحيل على التمهيد (10/239). {cite:muwatta-maruf-1997 p.251} {cite:muwatta-maruf-1997 p.252}"
