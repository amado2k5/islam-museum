label: { ar: "الموطأ 491 — أبو عبيد مولى ابن أزهر يشهد العيد مع عمر ثم عثمان ثم علي", en: "Muwatta 491", es: "Muwatta 491", fr: "Muwatta 491", ur: "موطا 491", tr: "El-Muvatta 491 — İbn Ezher'in azatlı kölesi Ebu Ubeyd, önce Ömer, sonra Osman, sonra da Ali ile birlikte bayram namazına şahitlik etti.", id: "Al-Muwatta 491 — Abu Ubaid, budak yang dibebaskan oleh Ibnu Azhar, menyaksikan salat Id bersama Umar, kemudian Utsman, lalu Ali." }
text: "إن هذين يومان نهى رسول الله عن صيامهما: يوم فطركم من صيامكم، والآخر يوم تأكلون فيه من نسككم"
summary:
  ar: "يرويه مالك عن ابن شهاب عن أبي عبيد مولى ابن أزهر، في باب الأمر بالصلاة قبل الخطبة في العيدين: شهد العيد مع عمر بن الخطاب فصلى ثم خطب فقال إن هذين يومان نهى النبي عن صيامهما: يوم الفطر من الصيام ويوم يأكل الناس فيه من نسكهم. ثم شهده مع عثمان بن عفان فصلى ثم خطب وقال إنه اجتمع لهم في يومهم عيدان، فمن أحب من أهل العالية أن ينتظر الجمعة فلينتظرها ومن أحب أن يرجع فقد أذن له. ثم شهده مع علي بن أبي طالب وعثمان محصور، فصلى ثم خطب. ويخرّجه المحقق عند البخاري (1990) ومسلم (3/152) وابن حبان وأحمد والشافعي ومحمد بن الحسن من طرق أصحاب مالك، ويحيل على التمهيد (10/239). {cite:muwatta-maruf-1997 p.251} {cite:muwatta-maruf-1997 p.252}"
  tr: "Malik, İbn Şihab'dan, o da İbn Ezher'in azatlı kölesi Ebu Ubeyd'den, iki bayram gününde hutbeden önce namaz kılınması emri bölümünde şöyle rivayet etmiştir: Ömer ibn el-Hattab ile birlikte bayramı gördü; namaz kıldıktan sonra hutbe verdi ve şöyle dedi: \"Bunlar, Peygamber'in oruç tutmayı yasakladığı iki gündür: iftar günü ve insanların kurbanlarından yedikleri gün.\" Sonra Osman ibn Affan ile birlikte bayramı gördü; namaz kıldıktan sonra hutbe verdi ve şöyle dedi: \"Bugün onlar için iki bayram çakışmıştır. Aliye halkından cuma namazını beklemek isteyen bekleyebilir, geri dönmek isteyene de izin verilmiştir.\" Sonra Osman kuşatma altındayken Ali ibn Ebu Talib ile birlikte bayramı gördü; namaz kıldıktan sonra hutbe verdi. Araştırmacı, bunu Malik'in arkadaşlarının rivayet zincirleri aracılığıyla Buhari (1990), Müslim (3/152), İbn Hibban, Ahmed, Şafiî ve Muhammed ibn Hasan'ın derlemelerine dahil etmiş ve Temhid'e (10/239) atıfta bulunmuştur."
  id: "Malik meriwayatkannya dari Ibnu Shihab, dari Abu Ubayd, budak yang dibebaskan oleh Ibnu Azhar, dalam surah tentang perintah shalat sebelum khutbah pada dua hari raya Id: Beliau menyaksikan Id bersama Umar bin al-Khattab, yang shalat dan kemudian menyampaikan khutbah, seraya berkata, “Ini adalah dua hari yang dilarang Nabi untuk berpuasa: hari berbuka puasa dan hari orang-orang makan dari kurban mereka.” Kemudian beliau menyaksikannya bersama Utsman bin Affan, yang shalat dan kemudian menyampaikan khutbah, seraya berkata, “Dua hari raya bertepatan bagi mereka pada hari ini. Siapa pun di antara kaum al-Aliyah yang ingin menunggu shalat Jumat boleh melakukannya, dan siapa pun yang ingin kembali telah diberi izin.” Kemudian beliau menyaksikannya bersama Ali bin Abi Talib ketika Utsman sedang dikepung, yang shalat dan kemudian menyampaikan khutbah. Peneliti memasukkannya ke dalam koleksi al-Bukhari (1990), Muslim (3/152), Ibn Hibban, Ahmad, al-Shafi'i, dan Muhammad ibn al-Hasan melalui sanad para sahabat Malik, dan dia merujuk pada al-Tamhid (10/239)."
