label: { ar: "صحيح البخاري 5237 — الأب والأبوة", en: "Sahih al-Bukhari 5237 — the father and fatherhood", ur: "صحیح بخاری 5237 — باپ اور والدیت", es: "Sahih al-Bukhari 5237 — El padre y la paternidad", fr: "Sahih al-Bukhari 5237 — Le père et la paternité", tr: "Sahih el-Buhari 5237 — Baba ve Babalık", id: "Sahih al-Bukhari 5237 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا فَرْوَةُ بْنُ أَبِي الْمَغْرَاءِ، حَدَّثَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ خَرَجَتْ سَوْدَةُ بِنْتُ زَمْعَةَ لَيْلاً فَرَآهَا عُمَرُ فَعَرَفَهَا فَقَالَ إِنَّكِ وَاللَّهِ يَا سَوْدَةُ مَا تَخْفَيْنَ عَلَيْنَا، فَرَجَعَتْ إِلَى النَّبِيِّ فَذَكَرَتْ ذَلِكَ لَهُ، وَهْوَ فِي حُجْرَتِي يَتَعَشَّى، وَإِنَّ فِي يَدِهِ لَعَرْقًا، فَأُنْزِلَ عَلَيْهِ فَرُفِعَ عَنْهُ وَهُوَ يَقُولُ \" قَدْ أَذِنَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5237، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5237 (Wedlock, Marriage (Nikaah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 5237، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5237 (Matrimonio (Nikaah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 5237 (Mariage), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 5237 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5237, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
