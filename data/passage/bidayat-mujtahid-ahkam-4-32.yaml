text: "… توضأ قط إلا مرتبًا، ومن حملها على الندب؛ قال: إن الترتيب سنة، ومن فرق بين المسنون والمفروض من الأفعال قال: إن الترتيب الواجب إنما ينبغي أن يكون في الأفعال الواجبة، ومن لم يفرق قال: إن الشروط الواجبة قد تكون في …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 32، يرد فيه ذكر الفرض، والواجب، والمندوب، والسنن المؤكدة والرواتب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 4, p. 32, whose wording mentions the obligatory (fard), the obligatory (wajib), the recommended (mandub), the emphasised and regular sunnas, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 4، ص 32 کا اقتباس جس میں فرض، واجب، مندوب، سننِ مؤکدہ اور رواتب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Bidayat al-Mujtahid de Ibn Rushd, volume numérisé 4, p. 32, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), le recommandé (mandub), les sunnas appuyées et régulières, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen digitalizado 4, p. 32, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), lo recomendado (mandub), las sunnas enfatizadas y regulares, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Rüşd'ün *Bidayat al-Mujtahid* adlı eserinin 4. cildinin 32. sayfasından, farz ameller, müstehap ameller, tasdik sünnetler, sünnet amelleri ve müstehap ameller konularını ele alan bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz ameller, itaat amelleri, müstehap ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Bidayat al-Mujtahid* karya Ibnu Rushd, Jilid 4, halaman 32, yang membahas amalan wajib, amalan anjuran, sunnah yang dikonfirmasi, sunnah yang biasa dilakukan, dan amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
