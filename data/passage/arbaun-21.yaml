label: { ar: "الأربعون 21 — قل آمنت بالله ثم استقم", en: "Arba'un 21 — say: I believe, then stand firm" }
text: "قل آمنت بالله ثم استقم"
summary:
  ar: "حديث سفيان بن عبد الله الثقفي الطائفي — له صحبة وكان عاملاً لعمر بن الخطاب على الطائف — وهو الحديث الحادي والعشرون في الأربعين النووية وفي شرح ابن رجب؛ رواه مسلم (38) من رواية هشام بن عروة عن أبيه عنه، وخرجه أحمد والترمذي وابن ماجه من رواية الزهري عن محمد بن عبد الرحمن بن ماعز عنه بلفظ «حدثني بأمر أعتصم به، قال: قل ربي الله ثم استقم، قلت: يا رسول الله ما أخوف ما تخاف علي؟ فأخذ بلسان نفسه ثم قال: هذا» وقال الترمذي (2410) حسن صحيح، وعند النسائي من رواية ابنه عبد الله عنه «مرني بأمر في الإسلام لا أسأل عنه أحداً بعدك» وفيه «فما أتقي؟ فأومأ إلى لسانه»؛ ويبين ابن رجب أن سفيان طلب كلاماً جامعاً لأمر الإسلام كافياً لا يحتاج بعده إلى غيره، وأن الجواب منتزع من قوله تعالى في فصلت «إن الذين قالوا ربنا الله ثم استقاموا» [30] والأحقاف [13–14]؛ وفسر أبو بكر «ثم استقاموا» بأنهم لم يشركوا بالله شيئاً ولم يلتفتوا إلى إله غيره واستقاموا على أن الله ربهم، وأخرج النسائي عن أنس مرفوعاً «قد قالها الناس ثم كفر أكثرهم فمن مات عليها فهو من أهل الاستقامة» وإسناده ضعيف لضعف سهيل بن أبي حزم (جامع العلوم والحكم ص 471–476)."
  en: "The hadith of Sufyan ibn Abdullah al-Thaqafi al-Ta'ifi — a Companion who was Umar ibn al-Khattab's governor over al-Ta'if — the twenty-first of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (38) through Hisham ibn Urwa from his father from him, and by Ahmad, al-Tirmidhi and Ibn Majah through al-Zuhri from Muhammad ibn Abd al-Rahman ibn Ma'iz in the wording 'tell me something to hold fast to' — answered 'say: my Lord is God, then stand firm' — followed by 'what do you most fear for me?' whereupon he took hold of his own tongue and said 'this', al-Tirmidhi (2410) grading it hasan sahih, and al-Nasa'i carrying it through the Companion's son Abdullah with 'command me a matter in Islam I shall not need to ask anyone after you' and 'what shall I guard against?' answered by a gesture to his tongue; Ibn Rajab explains that Sufyan sought comprehensive words covering the matter of Islam so as to need no one after him, the answer drawn from 'those who say our Lord is God then stand firm' in Fussilat 30 and al-Ahqaf 13–14, Abu Bakr glossing 'then stood firm' as 'they associated nothing with God', 'they did not turn to a god other than Him' and 'they stood firm that God is their Lord', and al-Nasa'i reporting through Anas 'people have said it then most of them disbelieved; whoever dies upon it is of the people of istiqama' through a chain weakened by Suhayl ibn Abi Hazm (Jami' al-Ulum wal-Hikam pp. 471–476)."
