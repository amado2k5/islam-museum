text: "قل آمنت بالله ثم استقم"
summary:
  ar: "حديث سفيان بن عبد الله الثقفي الطائفي — له صحبة وكان عاملاً لعمر بن الخطاب على الطائف — وهو الحديث الحادي والعشرون في الأربعين النووية وفي شرح ابن رجب؛ رواه مسلم (38) من رواية هشام بن عروة عن أبيه عنه، وخرجه أحمد والترمذي وابن ماجه من رواية الزهري عن محمد بن عبد الرحمن بن ماعز عنه بلفظ «حدثني بأمر أعتصم به، قال: قل ربي الله ثم استقم، قلت: يا رسول الله ما أخوف ما تخاف علي؟ فأخذ بلسان نفسه ثم قال: هذا» وقال الترمذي (2410) حسن صحيح، وعند النسائي من رواية ابنه عبد الله عنه «مرني بأمر في الإسلام لا أسأل عنه أحداً بعدك» وفيه «فما أتقي؟ فأومأ إلى لسانه»؛ ويبين ابن رجب أن سفيان طلب كلاماً جامعاً لأمر الإسلام كافياً لا يحتاج بعده إلى غيره، وأن الجواب منتزع من قوله تعالى في فصلت «إن الذين قالوا ربنا الله ثم استقاموا» [30] والأحقاف [13–14]؛ وفسر أبو بكر «ثم استقاموا» بأنهم لم يشركوا بالله شيئاً ولم يلتفتوا إلى إله غيره واستقاموا على أن الله ربهم، وأخرج النسائي عن أنس مرفوعاً «قد قالها الناس ثم كفر أكثرهم فمن مات عليها فهو من أهل الاستقامة» وإسناده ضعيف لضعف سهيل بن أبي حزم ⁦(جامع العلوم والحكم ص 471–476)⁩."
  en: "The hadith of Sufyan ibn Abdullah al-Thaqafi al-Ta'ifi — a Companion who was Umar ibn al-Khattab's governor over al-Ta'if — the twenty-first of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by Muslim (38) through Hisham ibn Urwa from his father from him, and by Ahmad, al-Tirmidhi and Ibn Majah through al-Zuhri from Muhammad ibn Abd al-Rahman ibn Ma'iz in the wording 'tell me something to hold fast to' — answered 'say: my Lord is God, then stand firm' — followed by 'what do you most fear for me?' whereupon he took hold of his own tongue and said 'this', al-Tirmidhi (2410) grading it hasan sahih, and al-Nasa'i carrying it through the Companion's son Abdullah with 'command me a matter in Islam I shall not need to ask anyone after you' and 'what shall I guard against?' answered by a gesture to his tongue; Ibn Rajab explains that Sufyan sought comprehensive words covering the matter of Islam so as to need no one after him, the answer drawn from 'those who say our Lord is God then stand firm' in Fussilat 30 and al-Ahqaf 13–14, Abu Bakr glossing 'then stood firm' as 'they associated nothing with God', 'they did not turn to a god other than Him' and 'they stood firm that God is their Lord', and al-Nasa'i reporting through Anas 'people have said it then most of them disbelieved; whoever dies upon it is of the people of istiqama' through a chain weakened by Suhayl ibn Abi Hazm (Jami' al-Ulum wal-Hikam pp. 471–476)."
  es: "El hadiz de Sufyan ibn Abdullah al-Thaqafi al-Ta'ifi —un Compañero que fue gobernador de Umar ibn al-Khattab sobre al-Ta'if— el vigésimo primero de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por Muslim (38) a través de Hisham ibn Urwa de su padre de él, y por Ahmad, al-Tirmidhi e Ibn Majah a través de al-Zuhri de Muhammad ibn Abd al-Rahman ibn Ma'iz en la formulación 'dime algo a lo que aferrarme' — respondido 'di: mi Señor es Dios, entonces mantente firme' — seguido de '¿qué es lo que más temes por mí?' Entonces tomó su propia lengua y dijo 'esto', al-Tirmidhi (2410) lo clasificó hasan sahih, y al-Nasa'i lo llevó a través del hijo del Compañero Abdullah con 'ordename un asunto en el Islam que no necesite pedirle a nadie después de ti' y '¿de qué debo protegerme?' respondido con un gesto a su lengua; Ibn Rajab explica que Sufyan buscó palabras completas que cubrieran el asunto del Islam para no necesitar a nadie después de él, la respuesta extraída de 'aquellos que dicen que nuestro Señor es Dios entonces se mantienen firmes' en Fussilat 30 y al-Ahqaf 13-14, Abu Bakr glosó 'entonces se mantuvieron firmes' como 'no asociaron nada con Dios', 'no se volvieron a un dios que no fuera Él' y 'se mantuvieron firmes en que Dios es su Señor', y al-Nasa'i informando a través de Anas 'la gente lo ha dicho entonces la mayoría de ellos no creyó; Quien muere en él pertenece a la gente de istiqama' a través de una cadena debilitada por Suhayl ibn Abi Hazm (Jami' al-Ulum wal-Hikam pp. 471–476)."
  fr: "Le hadith de Sufyan ibn Abdullah al-Thaqafi al-Ta'ifi — un Compagnon qui était le gouverneur d'al-Ta'if sous Umar ibn al-Khattab — le vingt et unième des quarante d'al-Nawawi et du commentaire d'Ibn Rajab; transmis par Muslim (38) par Hisham ibn Urwa de son père, et par Ahmad, al-Tirmidhi et Ibn Majah par al-Zuhri de Muhammad ibn Abd al-Rahman ibn Ma'iz, dans la formulation « dis-moi quelque chose auquel me raccrocher » — il répondit « dis: mon Seigneur est Dieu, puis tiens bon » — suivi de « qu'est-ce que tu crains le plus pour moi ? » Sur ce, il prit sa propre langue et dit « ceci », al-Tirmidhi (2410) le qualifiant de hasan sahih, et al-Nasa'i le rapportant par l'intermédiaire du fils du Compagnon, Abdullah, avec « ordonne-moi une chose en Islam dont je n'aurai plus besoin de parler à personne après toi » et « contre quoi dois-je me prémunir ? », réponse par un geste à sa langue; Ibn Rajab explique que Sufyan cherchait des mots complets couvrant la question de l'Islam afin de n'avoir besoin de personne après lui, la réponse étant tirée de « ceux qui disent que notre Seigneur est Dieu, alors tenez bon » dans Fussilat 30 et al-Ahqaf 13-14, Abu Bakr glosant « alors tint bon » comme « ils n'ont rien associé à Dieu », « ils ne se sont pas tournés vers un dieu autre que Lui » et « ils ont tenu bon que Dieu est leur Seigneur », et al-Nasa'i rapportant par Anas « les gens l'ont dit, puis la plupart d'entre eux ont mécru; Quiconque meurt sur ce chemin est du peuple d'istiqama' par une chaîne affaiblie par Suhayl ibn Abi Hazm (Jami' al-Ulum wal-Hikam pp. 471–476)."
  ur: "سفیان بن عبداللہ الثقفی الطائفی کی حدیث - ایک صحابی جو عمر بن الخطاب کے الطائف کے گورنر تھے - نووی کی چالیسویں اور ابن رجب کی تفسیر کی اکیسویں؛ اسے مسلم (38) نے ہشام بن عروہ کے ذریعے اپنے والد سے نقل کیا ہے اور احمد، ترمذی اور ابن ماجہ نے الزہری کے ذریعے محمد بن عبدالرحمٰن بن مایز سے اس لفظ میں نقل کیا ہے کہ 'مجھے کچھ بتاؤ کہ اسے مضبوطی سے پکڑوں' - جواب دیا: 'کہو: میرا رب خدا ہے، پھر سب سے زیادہ ڈرتے رہو' - کیا تم نے میری پیروی کی؟ اس پر آپ نے اپنی زبان کو پکڑا اور کہا، \"یہ\"، الترمذی (2410) نے اسے صحیح قرار دیا، اور نسائی نے اسے صحابی کے بیٹے عبداللہ کے ذریعے لے کر کہا کہ \"مجھے اسلام میں ایک معاملہ کا حکم دو، مجھے آپ کے بعد کسی سے پوچھنے کی ضرورت نہیں ہے\" اور 'میں کس چیز سے بچوں؟' اس کی زبان کے اشارے سے جواب دیا؛ ابن رجب بیان کرتے ہیں کہ سفیان نے اسلام کے معاملے پر جامع الفاظ کی تلاش کی تاکہ ان کے بعد کسی کی ضرورت نہ پڑے، اس کا جواب فصیلات 30 اور الاحقاف 13-14 میں 'جو لوگ کہتے ہیں کہ ہمارا رب خدا ہے تو ثابت قدم رہو'، ابوبکر نے 'پھر ثابت قدمی سے کھڑے ہوئے' اس کے علاوہ 'خدا کی طرف متوجہ نہیں ہوئے' اور 'کچھ بھی نہیں'۔ ''وہ اس بات پر ثابت قدم رہے کہ اللہ ہی ان کا رب ہے''، اور نسائی نے انس سے روایت کی ہے کہ لوگوں نے یہ کہا تو ان میں سے اکثر کافر ہو گئے۔ جو اس پر مرے وہ اہل استقامت میں سے ہے سہیل ابن ابی حزم نے ضعیف کیا ہے ⁦(جامع العلوم والحکم ص 471-476)⁩۔"
  tr: "Sufyan ibn Abdullah el-Saqafi el-Ta'ifi'nin hadisi - kendisi sahabe ve Ömer ibn el-Hattab'ın Ta'if üzerindeki temsilcisiydi - ve bu hadis, el-Arba'in el-Nawawiyya'da ve İbn Receb'in açıklamasında yirmi birinci hadistir; Müslim (38) tarafından Hişam ibn Urva'dan, o da babasından, o da kendi rivayetiyle nakledilmiş ve Ahmed, Tirmizi ve İbn Mâce tarafından Zühri'den, o da Muhammed ibn Abd el-Rahman ibn Ma'iz'den, o da kendi rivayetiyle şu şekilde nakledilmiştir: \"Bana tutunabileceğim bir şey söyle.\" dedi. \"De ki: 'Rabbim Allah'tır,' sonra da sebat et.\" Ben dedim ki: \"Ey Allah'ın Resulü, benim için en çok neyden korkuyorsun?\" Bunun üzerine dilini tuttu ve şöyle dedi: \"Bu.\" Tirmizi (2410) bunun sahih ve doğru olduğunu söylemiş, Nesai de oğlu Abdullah'tan rivayetle şöyle buyurmuştur: \"Bana İslam'da öyle bir şey emret ki, senden sonra kimseden istemeyeyim.\" Ve orada şöyle denmiştir: \"Öyleyse neden sakınmalıyım?\" Bunun üzerine Sufyan dilini işaret etmiştir. İbn Receb, Sufyan'ın İslam konusunda yeterli ve başka hiçbir şeye ihtiyaç duymayacağı kapsamlı bir açıklama istediğini ve cevabın Yüce Allah'ın Fussilat'taki şu sözünden türetildiğini açıklamıştır: \"Şüphesiz, 'Rabbimiz Allah'tır' diyenler ve sonra da sebat edenler\" [30] ve Ahkaf'ta [13-14]. Ebu Bekir, \"sonra da sebat edenler\" ifadesini, Allah'a hiçbir şeyi ortak koşmamaları, O'ndan başka hiçbir ilaha yönelmemeleri ve Allah'ın Rableri olduğu gerçeğinde sebat etmeleri olarak açıklamıştır. Nesai, Enes'ten rivayetle, Peygamberimize nakledilen şu hadisi nakletmiştir: \"İnsanlar bunu söylemişlerdir, sonra çoğu inkâr etmiştir. Kim bunun üzerine ölürse, sebat edenlerdendir.\" Bu hadisin isnadı, Suhayl ibn Abi Hazm'ın zayıflığı nedeniyle zayıftır (Cami' el-Ulum ve el-Hikam, s. 471-476)."
  id: "Hadits Sufyan ibn Abdullah al-Thaqafi al-Ta’ifi — dia adalah seorang sahabat dan merupakan wakil Umar ibn al-Khattab atas Ta’if — dan merupakan hadits ke-21 dalam al-Arba’in al-Nawawiyya dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Muslim (38) dari Hisham ibn Urwa dari ayahnya dari dirinya, dan diriwayatkan oleh Ahmad, al-Tirmidhi dan Ibn Majah dari al-Zuhri dari Muhammad ibn Abd al-Rahman ibn Ma’iz dari dirinya dengan redaksi: “Katakanlah kepadaku sesuatu yang dapat aku pegang teguh. Beliau berkata: Katakanlah, ‘Tuhanku adalah Allah,’ kemudian teguhlah. Aku berkata: Wahai Rasulullah, apa yang paling engkau takuti untukku? Maka beliau memegang lidahnya dan kemudian berkata: Ini.” Al-Tirmidhi (2410) mengatakan bahwa hadits ini baik dan sahih, dan dalam kitab al-Nasa’i berdasarkan riwayat putranya Abdullah, ia berkata: “Beri aku sesuatu dalam Islam yang tidak akan aku tanyakan lagi kepada siapa pun setelahmu.” Dan di dalamnya ia berkata: “Lalu apa yang harus aku waspadai? Maka ia menunjuk ke lidahnya.” Ibn Rajab menjelaskan bahwa Sufyan meminta pernyataan yang komprehensif tentang masalah Islam yang cukup dan setelah itu ia tidak membutuhkan hal lain, dan jawabannya berasal dari firman Allah dalam kitab Fussilat, “Sesungguhnya orang-orang yang berkata, ‘Tuhan kami adalah Allah,’ lalu mereka tetap teguh” [30] dan Al-Ahqaf [13-14]. Abu Bakr menjelaskan “lalu tetap teguh” sebagai berarti bahwa mereka tidak menyekutukan Allah dengan sesuatu pun dan tidak berpaling kepada tuhan selain Dia dan tetap teguh pada kenyataan bahwa Allah adalah Tuhan mereka. Al-Nasa’i meriwayatkan dari Anas, yang dinisbahkan kepada Nabi, “Orang-orang telah mengatakan hal itu, kemudian kebanyakan dari mereka mengingkarinya, maka siapa pun yang meninggal dalam keadaan masih hidup dalam keadaan seperti itu termasuk orang-orang yang teguh pendiriannya.” Rantai periwayatannya lemah karena kelemahan Suhayl ibn Abi Hazm (Jami’ al-‘Ulum wa al-Hikam, hlm. 471-476)."
