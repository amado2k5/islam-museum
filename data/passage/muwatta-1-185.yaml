label: { ar: "الموطأ 185 — مالك: الصبح ينادى لها قبل الفجر دون سائر الصلوات", en: "Muwatta 185", es: "Muwatta 185", fr: "Muwatta 185", ur: "موطا 185", tr: "El-Muvatta 185 — Malik: Diğer namazlardan farklı olarak, sabah namazı için ezan şafak sökmeden önce okunur.", id: "Al-Muwatta 185 — Malik: Seruan untuk salat subuh dikumandangkan sebelum fajar, tidak seperti salat-salat lainnya." }
summary:
  ar: "قول لمالك يرويه يحيى في باب ما جاء في النداء للصلاة: لم تزل الصبح يُنادى لها قبل الفجر، فأما غيرها من الصلوات فلم يرها يُنادى لها إلا بعد أن يحل وقتها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.120}"
  tr: "Yahya'nın ezan bölümünde rivayet ettiği üzere Malik'e atfedilen bir ifade şöyledir: \"Fecr (sabah namazı) ezanı her zaman fecirden önce okunurdu, ancak diğer namazlar için ezanın vaktinden sonra okunduğunu görmemiştir.\" Editör, bu ifadenin Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.120}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Malik, sebagaimana diriwayatkan oleh Yahya dalam bab tentang seruan azan: Seruan azan untuk salat Subuh selalu dikumandangkan sebelum Subuh, tetapi untuk salat-salat lainnya, beliau tidak pernah melihat seruan azan dikumandangkan sampai setelah waktu yang telah ditentukan. Editor menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.120}"
