summary:
  ar: "قول لمالك يرويه يحيى في باب ما جاء في النداء للصلاة: لم تزل الصبح يُنادى لها قبل الفجر، فأما غيرها من الصلوات فلم يرها يُنادى لها إلا بعد أن يحل وقتها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.120}"
