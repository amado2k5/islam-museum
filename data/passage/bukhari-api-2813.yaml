text: "حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا عَبْدَةُ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَا أَنَّ رَسُولَ اللَّهِ لَمَّا رَجَعَ يَوْمَ الْخَنْدَقِ وَوَضَعَ السِّلاَحَ وَاغْتَسَلَ، فَأَتَاهُ جِبْرِيلُ وَقَدْ عَصَبَ رَأْسَهُ الْغُبَارُ فَقَالَ وَضَعْتَ السِّلاَحَ، فَوَاللَّهِ مَا وَضَعْتُهُ. فَقَالَ رَسُولُ اللَّهِ \" فَأَيْنَ \". قَالَ هَا هُنَا. وَأَوْمَأَ إِلَى بَنِي قُرَيْظَةَ. قَالَتْ فَخَرَجَ إِلَيْهِمْ رَسُولُ اللَّهِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2813، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2813 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2813، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2813 (La lucha por la causa de Alá (Yihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
