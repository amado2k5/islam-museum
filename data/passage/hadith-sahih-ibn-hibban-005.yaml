text: "يس، عن قتادة، عن أنس: أن الني لم لكتب إلى بكر بن وائل: ((من محمد رسول الله إلى بكر بن وائل أن أسلموا تسلموا». قال: فما قرأه إلا رجل منهم من بني ضبيعة، فهم يسمون بني الكاتب. [حم (الحديث: 68/5)]."
