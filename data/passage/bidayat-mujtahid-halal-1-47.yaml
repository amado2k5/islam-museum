text: "بداية المجتهد ونطهاية المقتصد وَقَالَ قَوْمٌ: بَلٍ ج و الاِنْتِبَاذُ مَكْرُوه. وَقَالَ قَوْمٌ: هُوَ مُبَاحٌ. وَقَالَ قَوْمٌ: كُلُّ خَلِيطَيْنِ فَهُمَا حَرَامٌ، وَإِنْ لَمْ يَكُونَا مِمَّا يَقْبَلَانِ الإِنْتِبَاذَ فِيمَا أَحْسَبُ الآنَ. وَالسَّبَبُ فِي اخْتِلَافِهِمْ: تَرَدُّدُهُمْ فِي محلِ النَّهْيُ الْوَارِدُ فِي ذَلِكَ؛ …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 47، يذكر الحرام، والمباح، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 47, that mentions the unlawful, the permissible, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
