ref: "2037"
label: { ar: "سنن أبي داود 2037 — ما حُرّم", en: "Sunan Abi Dawud 2037 — what was made unlawful", ur: "سنن ابی داؤد 2037 — جو حرام کیا گیا", es: "Sunan Abi Dawud 2037: lo que se declaró ilegal", fr: "Sunan Abi Dawud 2037 — ce qui a été rendu illégal" }
text: "… عَنْ سُلَيْمَانَ بْنِ أَبِي عَبْدِ اللَّهِ، قَالَ رَأَيْتُ سَعْدَ بْنَ أَبِي وَقَّاصٍ أَخَذَ رَجُلاً يَصِيدُ فِي حَرَمِ الْمَدِينَةِ الَّذِي حَرَّمَ رَسُولُ اللَّهِ فَسَلَبَهُ ثِيَابَهُ فَجَاءَ مَوَالِيهِ فَكَلَّمُوهُ فِيهِ فَقَالَ إِنَّ رَسُولَ اللَّهِ حَرَّمَ هَذَا الْحَرَمَ وَقَالَ \" مَنْ وَجَدَ أَحَدًا يَصِيدُ فِيهِ فَلْيَسْلُبْهُ ثِيَابَهُ \". فَلاَ أَرُدُّ عَلَيْكُمْ طُعْمَةً أَطْعَمَنِيهَا رَسُولُ اللَّهِ وَلَكِنْ إِنْ شِئْتُمْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2037، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 2037 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 2037، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sunan Abi Dawud, n.° 2037 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona lo que se ha prohibido. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sunan Abi Dawud, n° 2037 (Les Rites du Hajj (Kitab Al-Manasik Wa'l-Hajj)), mentionne ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
