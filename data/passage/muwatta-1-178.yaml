label: { ar: "الموطأ 178 — سهل بن سعد: ساعتان تفتح لهما أبواب السماء", en: "Muwatta 178" }
text: "ساعتان يفتح لهما أبواب السماء وقل داع ترد عليه دعوته: حضرة النداء للصلاة، والصف في سبيل الله"
summary:
  ar: "أثر يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، في باب ما جاء في النداء للصلاة: ساعتان تُفتح فيهما أبواب السماء وقلّ أن تُرد فيهما دعوة داعٍ: عند النداء للصلاة، وعند الصف في سبيل الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن أبي أويس عند البخاري في الأدب المفرد وسويد وعبد الرزاق ومعن ويحيى بن بكير، وينقل عن ابن عبد البر أنه موقوف على سهل عند جماعة الرواة ومثله لا يقال بالرأي، وأن أيوب بن سويد ومحمد بن مخلد وإسماعيل بن عمر رووه عن مالك مرفوعاً (التمهيد 21/138)؛ ويبين المحقق ضعف أيوب واتهام محمد بن مخلد، وأن إسماعيل بن عمر تفرد برفعه من بين الثقات، فالوقف من طريق مالك هو الراجح عنده، وأن موسى بن يعقوب الزمعي رواه عن أبي حازم مرفوعاً عند أبي داود (2540) وابن خزيمة والحاكم. {cite:muwatta-maruf-1997 p.117} {cite:muwatta-maruf-1997 p.118}"
