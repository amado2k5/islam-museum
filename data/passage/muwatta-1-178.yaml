label: { ar: "الموطأ 178 — سهل بن سعد: ساعتان تفتح لهما أبواب السماء", en: "Muwatta 178", es: "Muwatta 178", fr: "Muwatta 178", ur: "موطا 178", tr: "El-Muvatta 178 — Sahl ibn Saad: Cennetin kapılarının açıldığı iki saat.", id: "Al-Muwatta 178 — Sahl ibn Saad: Dua jam di mana pintu-pintu surga dibuka" }
text: "ساعتان يفتح لهما أبواب السماء وقل داع ترد عليه دعوته: حضرة النداء للصلاة، والصف في سبيل الله"
summary:
  ar: "أثر يرويه مالك عن أبي حازم بن دينار عن سهل بن سعد الساعدي، في باب ما جاء في النداء للصلاة: ساعتان تُفتح فيهما أبواب السماء وقلّ أن تُرد فيهما دعوة داعٍ: عند النداء للصلاة، وعند الصف في سبيل الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وابن أبي أويس عند البخاري في الأدب المفرد وسويد وعبد الرزاق ومعن ويحيى بن بكير، وينقل عن ابن عبد البر أنه موقوف على سهل عند جماعة الرواة ومثله لا يقال بالرأي، وأن أيوب بن سويد ومحمد بن مخلد وإسماعيل بن عمر رووه عن مالك مرفوعاً ⁦(التمهيد 21/138)⁩؛ ويبين المحقق ضعف أيوب واتهام محمد بن مخلد، وأن إسماعيل بن عمر تفرد برفعه من بين الثقات، فالوقف من طريق مالك هو الراجح عنده، وأن موسى بن يعقوب الزمعي رواه عن أبي حازم مرفوعاً عند أبي داود (2540) وابن خزيمة والحاكم. {cite:muwatta-maruf-1997 p.117} {cite:muwatta-maruf-1997 p.118}"
  tr: "Malik'in, Ebu Hazim ibn Dinar'dan, o da Sahl ibn Sa'd el-Sa'idi'den rivayet ettiği, ezanla ilgili rivayetler bölümünde yer alan bir hadiste şöyle denmektedir: \"Cennetin kapılarının iki vakitte açıldığı ve duaların nadiren reddedildiği zamanlar vardır: ezan vakti ve Allah yolunda saf tutmak.\" Editör, bu hadisin Buhari'nin el-Adab el-Mufrad adlı eserinde Ebu Mus'ab ve İbn Abi Uveys tarafından Malik'ten rivayet edildiğini, ayrıca Suveyd, Abdülrazzak, Ma'n ve Yahya ibn Bukayr tarafından da nakledildiğini belirtmektedir. İbn Abdülberr'in ise bunun bir grup rivayetçiye göre Sahl'ın bir sözü olduğunu ve böyle bir sözün kişisel görüşe dayandırılamayacağını söylediğini aktarmaktadır. Ayrıca, Ayyub ibn Suwaid, Muhammed ibn Makhlad ve İsmail ibn Umar'ın bunu Malik'ten rivayet ederek Peygamber'e dayandırdığı bir hadis olarak naklettiklerini belirtir (el-Tamhid 21/138). Editör, Ayyub'un zayıflığını ve Muhammed ibn Makhlad'a yöneltilen suçlamayı açıklığa kavuşturur ve İsmail ibn Umar'ın, güvenilir raviler arasında bunu Peygamber'e dayandıran tek kişi olduğunu belirtir. Bu nedenle, Malik'e dayandırılan versiyonun doğru olma olasılığı daha yüksektir. Ayrıca, Musa ibn Ya'qub al-Zam'i'nin bunu Ebu Hazim'den rivayet ederek Ebu Davud (2540), İbn Huzeyme ve el-Hakim'de Peygamber'e dayandırdığı bir hadis olarak naklettiğini belirtir. {cite:muwatta-maruf-1997 s.117} {cite:muwatta-maruf-1997 s.118}"
  id: "Sebuah hadits yang diriwayatkan oleh Malik dari Abu Hazim ibn Dinar dari Sahl ibn Sa'd al-Sa'idi, dalam surah tentang apa yang diriwayatkan mengenai seruan azan: \"Ada dua waktu ketika pintu-pintu langit dibuka dan jarang sekali doa ditolak: pada saat seruan azan, dan ketika seseorang berbaris di jalan Allah.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab dan Ibn Abi Uways dalam kitab al-Adab al-Mufrad karya al-Bukhari, serta oleh Suwaid, Abd al-Razzaq, Ma'n, dan Yahya ibn Bukayr. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa itu adalah pernyataan Sahl menurut sekelompok perawi, dan pernyataan seperti itu tidak dapat didasarkan pada pendapat pribadi. Ia juga menyatakan bahwa Ayyub ibn Suwaid, Muhammad ibn Makhlad, dan Isma'il ibn Umar meriwayatkan hadits ini dari Malik sebagai hadits yang ditelusuri kembali kepada Nabi (al-Tamhid 21/138). Editor mengklarifikasi kelemahan Ayyub dan tuduhan terhadap Muhammad ibn Makhlad, dan bahwa Isma'il ibn Umar adalah satu-satunya di antara perawi terpercaya yang menelusuri hadits ini kembali kepada Nabi. Oleh karena itu, versi yang ditelusuri kembali kepada Malik lebih mungkin benar. Ia juga menyatakan bahwa Musa ibn Ya'qub al-Zam'i meriwayatkan hadits ini dari Abu Hazim sebagai hadits yang ditelusuri kembali kepada Nabi dalam Abu Dawud (2540), Ibn Khuzaymah, dan al-Hakim. {cite:muwatta-maruf-1997 p.117} {cite:muwatta-maruf-1997 p.118}"
