  الذى بعلو جفون عينيه سواد مثل السكهل من غيرا كهال وعين كميل وامرأة كلاه والمكمل
  والمكهال الملمول الذى يكتل به والمكس الان عظما الذراعين من الفرس والمكملة التى فيها
