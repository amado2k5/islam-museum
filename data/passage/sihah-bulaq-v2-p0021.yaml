text: |-
  ٥٦٦
  *(فصل الهاء⅜nœn*
  صل لوساء ( با الهياءالشئ المنبت الذى تراه فى البيت من ضوالشمس
  والهياء أيضاد قاق الستراب ويقال له اذا ارتضع هبايم: وهبوا وأهبيته أنا والهبوة الغبرة
  قال رة
  تبدولنا أعلامه بعد الغرق • فى قطع الال وهبوات الدقق
  وموضع هابى النراب أى كأن تزابه مثل الهباء فى الرقة قال هوبر الجارنى
  ترود منا بين أذنيه ضرية • دعته الى هابى التراب عقيم
  والهابى تراب القبر وأنشد الاصمىّ
  وهاب كثمان الحامة أجفات * بدريح تزج والصباكل مجفل
  والهباءة أرض بيلاد غطفان ومنه يوم الهباءة لقيس بن زهير العبىّ على حذيفة بن بدر
  الفزارى قتله فى جفر الهباءة وهو مستنقع بها والهبى والهبية الجارية الصغيرة وهي زجر
  للفرس أى توسعى ويماعدى وقال• نعلهاهى وهلا وأرحب* تى هات بارجل
  أى أعط وللم رأة هاتى والمها تافعفا علة منه وما أهاتبك أى ما أنا بمعطيك ( جا لهجاء
  خلاف المدح وقد هجونه هجواوهجاء وتهجاء قال الجعدى
  دعى عنك تهجاه الرجال وأقبلى* فهو مهجوّ ولا نقل هجيته وبينهم أهجوّة وأهجبة يتهاجون
  بها والمرأة تهجوزوجها أى تذم صحبته وهجوت الجروف هجوا وهجاء وهجيتها تهجية
  وتهجيت كاه بحنى وأنشدئعلب
  بادارأسماءقد أقوت بأنشاج * كالوحى أوكامام الكاتب الهاجى
  ( (دا الهدى الرشاد والدلالة يؤنث ويذ كريقال هداه الله للادين هدى وقوله تعالى أولم
  يم-داهم قال أبو عمروبن العلاء أولم يبين اهم وهديته الطريق والبيت هسداية أى عرّفته
  هذه لفة أهل الحجاز وغيرهم يقول هديته الى الطريق والى الدار حكاها الاخنسْ وهدى
  واهتدى بعنى وقوله تعالى فان اللّٰه لايهدى من يضل قال الفراه ريدلايم:-دى والهداء
  صدرة رلك هديت المرأة الى زوجها هداء وقدهديت اليه قال زهي
  فان كان النساء مخبات * فحق لكل محصنة هداء
  وهى مهدية وهدىّ أيضاعلى فعيل والهذى ما يهسدى الى الحرم من النعم بقال مالى هدى
  ان كان كذا وكذا وهو يمين والهسدىّ أيضاءلى فعيل منله وقرى حتيبلغ الهدى ممل
  بالتخفيف والتشديد الواحدة هدية وهدية وأماقول زهير
  فل أرم عشرا أسرواهديا • ولم أرجاديت يستباء
  قال الادعى هو الرجل الذى له حرمة كرمة هدى البيت قال أبو عبيد ويقال للاسير أيضا
  هدى" وأنشد للمتلس يذكر طرفة ومقتل عروين هنداياه
  كماريفة بن العبد كان هديهم • ضربوادعيم قذاه ب؟هند
  أبوزيديق ال خذ فى هديتك بالكسرأى فيما كنت فيه من الحديث أو العمل ولا تعدل عنه
  ويقال أيضا نظرفلان هدية أمره أى جهة أمره وما أحسن هديّته وهديته أيضا بالفتح أى
  سيرته والجمع هدى مثل تقرة وتر ويقال أيضاهدى هدى فلان أى سارسيرته وفى الحديث
