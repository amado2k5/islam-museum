label: { ar: "جامع الترمذي 198 — المكروه، ما كرهه الفقهاء", en: "Jami' al-Tirmidhi 198 — the disliked (makruh); what the jurists disliked", ur: "جامع ترمذی 198 — مکروہ، جسے فقہاء نے مکروہ کہا", fr: "Jami' al-Tirmidhi 198 — le réprouvé (makruh) ; ce que les juristes ont réprouvé", es: "Yami' al-Tirmidhi 198 — lo reprobado (makruh); lo que los juristas reprobaron", tr: "Cami' el-Tirmizi 198 — Hoş görülmeyen, hukukçuların hoşlanmadığı şey", id: "Jami' al-Tirmidhi 198 — Hal yang tidak disukai, yaitu hal yang tidak disukai oleh para ahli hukum." }
text: "… النَّوْمِ وَهُوَ قَوْلُ ابْنِ الْمُبَارَكِ وَأَحْمَدَ. وَقَالَ إِسْحَاقُ فِي التَّثْوِيبِ غَيْرَ هَذَا قَالَ التَّثْوِيبُ الْمَكْرُوهُ هُوَ شَيْءٌ أَحْدَثَهُ النَّاسُ بَعْدَ النَّبِيِّ إِذَا أَذَّنَ الْمُؤَذِّنُ فَاسْتَبْطَأَ الْقَوْمَ قَالَ بَيْنَ الأَذَانِ وَالإِقَامَةِ قَدْ قَامَتِ الصَّلاَةُ حَىَّ عَلَى الصَّلاَةِ حَىَّ عَلَى الْفَلاَحِ. قَالَ وَهَذَا الَّذِي قَالَ إِسْحَاقُ هُوَ التَّثْوِيبُ الَّذِي قَدْ كَرِهَهُ أَهْلُ الْعِلْمِ وَالَّذِي أَحْدَثُوهُ بَعْدَ النَّبِيِّ. …"
summary:
  ar: "حديث في جامع الترمذي، رقم 198، يرد فيه ذكر المكروه، وما كرهه الفقهاء. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Jami' al-Tirmidhi, no. 198 (The Book on Salat (Prayer)), whose wording mentions the disliked (makruh), what the jurists disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "جامع ترمذی کی حدیث نمبر 198، جس کے الفاظ میں مکروہ، جسے فقہاء نے مکروہ کہا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 198, dont le texte mentionne le réprouvé (makruh), ce que les juristes ont réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Yami' al-Tirmidhi, n.º 198, cuyo texto menciona lo reprobado (makruh), lo que los juristas reprobaron. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Cami'ül-Tirmizi'nin 198 numaralı hadisinde, mekruh sayılan ve fıkıhçıların mekruh saydığı şeyler anlatılmaktadır. Bu hadis, farz, ibadet, sünnet, mekruh, haram ve küçük günahlar üzerine araştırma yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 198, menyebutkan apa yang tidak disukai dan apa yang dianggap tidak disukai oleh para ahli fiqih. Hadits ini disusun oleh seorang peneliti mengenai amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
