text: "والإلْمامُ: النزول. وقد ألَمَّ به، أي : نَزَل به. وغلامٌ : أي: نصيبَه ونصيبَ صاحبه. قال أبو عبيدة: وألَمَّ الرجل من اللّمَمِ، وهو صغار الذنوب. وقال قال الفراء: أصله لَمَمَّا، فلمَّا كثرت فيه الميمات الأخفش: اللَّمَمُ: المقارَب من الذنوب. واللّمَمُ …"
summary:
  ar: "مقطع من الصحاح للجوهري، المجلد المصوَّر 1، ص 1047، يرد فيه ذكر صغائر الذنوب، واللمم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Jawhari's al-Sihah, scan volume 1, p. 1047, whose wording mentions the minor sins, the lamam (small faults); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الصحاح، جوہری، اسکین جلد 1، ص 1047 کا اقتباس جس میں صغیرہ گناہ، لمم ⁦(چھوٹی لغزشیں)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Sihah de al-Jawhari, volume numérisé 1, p. 1047, dont le texte mentionne les péchés mineurs, le lamam (fautes légères) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Sihah de al-Jawhari, volumen digitalizado 1, p. 1047, cuyo texto menciona los pecados menores, el lamam (faltas leves); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Cevhari'nin Sahih'inin 1. cildinin 1047. sayfasından, küçük günahlar ve küçük ihlallerden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu bölüm, farz olan fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram olan fiiller ve küçük günahlar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Sahih Al-Jawhari, Jilid 1, halaman 1047, yang menyebutkan dosa-dosa kecil dan pelanggaran-pelanggaran kecil; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh mesin pencari yang berisi amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
