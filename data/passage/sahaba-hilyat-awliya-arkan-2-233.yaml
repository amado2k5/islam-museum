text: "… لربه عزوجل ذليلا لربه، عزيزاً فى نفسه، غنيا عن الناس، فقيراً إلى ربه. قال قتادة : م أخلاق المؤمن هو أحسن معونة وأيسر الناس مؤونة. و حدثنا أبو بكر بن مالك قال ثما عبد اللّٰه بن أحسد حدثنى أبى قال …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 233، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 233, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 233 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Hilyat al-Awliya' de Abu Nu'aym, volumen 2, pág. 233, que menciona las características del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Hilyat al-Awliya' d'Abu Nu'aym, volume 2, page 233, mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Ebu Nuaym'ın Hilyat al-Awliya' adlı eserinin resimli 2. cildinin 233. sayfasından, müminin niteliklerinden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Hilyat al-Awliya' karya Abu Nu'aym, jilid bergambar 2, halaman 233, yang menyebutkan sifat-sifat seorang mukmin; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
