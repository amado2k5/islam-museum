text: |-
  •⁦(باب النون)⁩-
  ٢٧٣
  أغلى السباء بكل أدكن عائق * أوجونة فدحت وفض ختامها
  يعنى زقاقد صلح وجاد فى لونه ورائحته لعيه والدكان واحد الد كاكين وهى الجوانيت فارمى"
  را-خ الدمن على أعضاده • ثلته كل ر.مح وسبل
  وفلان دمن مال كا يقال ازاء مال والدمنة آثار الناس وماسوّدوا والهع الدمن تقول منه
  دمّن القوم الدار ودمّن الشاء الماءهذا من البعر قال ذوارمة
  مولعة خذساءليست بنهجة • يدقن أجواف المياه وقيرها
  والماءمندمّن اذاسقطت فيه أبعار الغنم والابل والدمنة الحقدوابه-ع دمن وقد دمنت
  قلوبهم بالكسر يقال دمنت على فلان أى ضغنت ودمنت الارض مثل دملتها بالفتح وفلان أ
  يدمن كذا أى يديه ورجل مدمن خرأى مداوم شريها قال الاصحبى إذا انسغت التخلة
  عن دذن وسواد قيل قد أ صابها الدمان بالفتح ودمّون مشدّدام وضع وقال امروالقيس
  دمّون انامعشريمانون • واننالاهلنا محبون
  { دنن فرس أدن بين الدنى قصير اليدين قال الاصمعىّ ومن أسوإ العيوب الدنن فى كل
  ذى أربع وهودنو الصدر من الارض ورجل أدنَ أى منجى الظهرو بيت أدن أى متطأ من
  والدنّ واحد الدنان وهى الحباب والدندنة بالفتح أن تسمع من الرجسل نغمة ولا تفهم ما يقول
  وفى الحديث -ولها ندندن والدندن بالكسرما أسوة من النبات لقدمه قال حان ين
  ثابت ، كالسيل يغشى أصول الدندن البالى، ون) دون نقيض فوق وهو تقصير
  عن الغاية ويكون ظرفا والدون الحقير الخسيس وقال
  اذا ماعلا المردام العلاء • ويقنع بالدون من كان دونا
  ولا يشنق منه فعل وبعضهم يقول منه دان يدون دونا وأدين ادانة ويروى قول عدى
  لم يدن وغيره يرويه لم يدنّ بتشديد النون عسلى مالم يسم فاعله من دنى يدنى أى ضعف ويقال
  هذادون ذالذأى أقرب منه ويقال فى الاغراه بالشى دونكه قال تيم للمجاج لماقتل صالح بن
  عبدالرحن أقبرنا صالحاو كان قد صلبه فقال دونكموه والديوان أصله دوّان فعوّض من احدى
  الواوين ياءلانه يجمع على دواوين ولوكانت الياء أصلية لقالوا دياوين وقددونت الدواوبن
  ⁦( دهن)⁩ الدهن معروف ود هن حىّ من اليمن ينسب اليهم عمار الدهنى" والدهان الاديم
  الاحرومنه قوله تعالى فكانت وردة كالدهان أى صارت حراء كالاديم من قولهم فرس
  وردوالاتى وردة قال روَّبة كغصن بان عود سر عرع • كأن وردا من دهان يمرع
  أى يكثر دهنه يقول كأنّ لونه يعلى بالدهن لصفائه قال الاعشى
  وأجرد من فحول الفيل طرف • كأن على شوا كله دهانا
  وقال لبيد
  وكل مدمَاة كيت كانها • سليم دهان فى طراف مطنب
  والدهان أيضاجع دهن يقال دهنته بالدهان أدهنه وتدهن هووادّهن أيضا على افتعل
  اذا تطلى بالدهن ودهنته بالعصافرته بها والدهان أيضا المطر الضعيف واحدهادهن
  بالضم عن أبى زيد ودهن المطر الارض اذا بلها بلا يسيرا يقال دهنها ولىّ وهى مدهونة
  ماح
  ني
