text: "… والتزام القربة والكفر والظهار والحرام. فيشترط في جملة الجزاء : أن يكون مضمونها واحدا في هذه الستة، وقد صرح الحنفية بالأربعة الأول فقط، ولم يذكروا تعليق الظهار، ولا تعليق الحرام، لكنهم جعلوا تحريم الحلال في حكم اليمين بالله تعالى، وهو …"
