text: |-
  •⁦(باب الام)⁩•
  *⁦(جل)⁩•
  والجلل أيضا الهين وهو من الاضداد قال امروالقيص لماقتل أبوه
  ألا كل شى سواء جلل • أى هين يسيروفعات ذاك من جالن أى من أجلك قال يحيل
  رسم دار وقفت فى طلله • كدت أقضى الغداة من جلله
  أى من أحل ويقال من عظهه فى عينى والجليل العظيم والحليل التمام وهونبت ضعيف
  بحنى بدخصاص البيوت وقال
  ألاليت شعرى هل أبيتن ليلة • بمكة حولى اذجْر وجليل
  الواحدة جليلة وابهع جلائل قال الشاءر• بلوذيجنى مرخة وجلائل• والجلجل واحد
  الجلاجل وصونه الجلبلة وصوت الرء-دأيضا والمجلهل السعاب الذى فيه صوت الرعد
  وجلجات الشئَاذاحركته بيدكك وتجلال فى الارض أى سناخ فيها ودخسل بقمال تجلجات
  قواعد البيت أى تضعضت وفى الحديث انَ قارون خرج على قومه يتيختر فى حلة له فأمر
  اللّٰه الارض فأخذته فهو يتجلجل فيها الى يوم القيامة وحارحلاجل بالضم أى صافى النهيق
  وجلاجل بالفتح موضع قال ذوالرمة.
  أياظبية الوعساء بين جلاجل • وبين النقاأأنت أم أم سالم
  ويروى بالحاه مضمومة والجلجلان عرة الكزبرة وقال أبو الغوث هو السمسم فى قشره قبل أن
  بحصد والجدلان حبة القلب يقال أصبت حلملان قلبه وجلّ القوم من البلديجلون بالضم
  جلولا أى جلوا وخرجوا الى بلد آخرفهم لة يقال استعمل فلان على الجالة كما يقال على
  الجالية وهما بعنى وأنشداين الاعرابى ٢ عفروصيران الصريم جلمتل، ويقال أيضا
  جل" البعريجله جلاأى التقطه ومنه سميت الدابة التى تأكل العذرة الجلالة وكذلك اجتلات
  البعر وجلَ فلان يجل بالكسر جلالة أى عظم قدره فهو جليل وقول لبيد
  واخزها بالبرّ لله الاجل• بعسنى الاعظم وقول الراجزه الجهدللٰه العلى الاجال • يريد
  الاجل فأظهر التضعيف ضرورة وقول ابن أحسر
  ياجلّ ما بعدت عليك بلادنا • وطلابنا فابرق بأرضك وارعد
  يعف ما أجلّ مابعدت وجل الرجل أيضا أى أسن يقال جلت الناقة اذا أسنت عن أبى نصر
  وجات الهاجن عن الولد أى صغرت وأجللته فى المرتبة وأتدت فلانافا أجلى وما أحشانى
  أى ما أعطانى جليلة ولاحاشية فالجليلة التى نتجت بطنا واحدا والحوانى صسغار الابل
  ويقال ما أجلى وما أدقنى أى ما أعطانى كثيرا ولا قليلا ويقال ماله حليلة ولا دقيقة أى ماله
  ناقة ولاشاة وقول الشاعر• بكت فأدقت فى البسكاء وأجلت• أى أنت بقليل البكاء وكثيره
  وجلل الدئ تجليلا أى عمّ والجلل السحاب الذى يجال الارض بالمطرأى يعم وتجليل الفرس
  أن تلبسه الجلّ وتجلله أى علاه وتجلاء أى أخذجلاله والتجال التعاظم يقال فلان يتجال
  عن ذلك أى يترفع عنه وحلولا، بالمدقرية بناحية فارس والنسبة اليهاجلولى على غير قياس
  مثل حرورى" فى النسبة الى حووراء ⁦(جل)⁩ الهل من الابل قال الفراء الجل زوج الناقة
  والجمع حال وأبحال وجالات ويمائل والجامل القطيع من الابل مع رعانه وأربايه قال الشاعر
  إهم جامل مايهدأ المليل ساهره • قال ابن السكيت يقسال للابل اذا كانت ذكورة ولم يكن
  قول أقضى الغداة دواه النَحويون
  الحياة
  ٢ ف نسحة زيادة المعجاج وأول
  تكانما تخومها اذوات
