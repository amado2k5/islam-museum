text: "… نخاف في اللّه لومةَ لائم. وفي مُسْنَد أحمد من حديث إسماعيل بن عُبَيْد بن رِفاعة قال : كتب أخرجه ابن أبي داود في المصاحف. وإسناده حَسَن، لكنه مُرْسَل. وأخرج البخاري في فضائل القرآن باب القراء من أصحاب رسول الله ويل، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 6، ص 423، يذكر القراء، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 6, p. 423, that mentions the readers, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 6، ص 423 کا اقتباس جس میں قراء، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tarikh al-Islam de al-Dhahabi, volumen 6, pág. 423, que menciona a los lectores, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 6, page 423, mentionne les lecteurs, la compilation du Coran et les codex; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 6. cildinin 423. sayfasından alınan bir alıntı, Kur'an okuyucularını, Kur'an'ın derlenmesini ve el yazmalarını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 6, halaman 423, menyebutkan para qari, penyusunan Al-Qur'an, dan manuskrip; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan tanda diakritik."
