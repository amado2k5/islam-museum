text: "… لا أذكر للقبط من هذا حرفا، فارجع إلى صاحبك.. تم رجع إلى حديث هشام بن أسحاق قال : ثم دعا كاتبا يكتب.بالمربية فكتب : لمحمد بن عبد اللّه من المقوقس عظيم القبط سلام، أما بعد، فقد قرأن كتابك،.وفهمت ما ذكرتَ …"
