text: "… عَنْ حَمْزَةَ الزَّيَّاتِ، عَنْ أَبِي إِسْحَاقَ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عبَّاسٍ، عَلِا ه كَان إذا عَنْ أُبِيِّ بْن كَعْب: أَنَّ رَسُولَ اللهِ : ذَكَرَ أَحَدًا فَدَعَا لَهُ بَدَأَ بِنَفْسِهِ. قَالَ أَبُو عِيسَى : هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ صَحِيحٌ، …"
