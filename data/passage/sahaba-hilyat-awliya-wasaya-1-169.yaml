text: "… بن راهويه أخبرنا وهب بن جرير حدثنى أبى قال ممعت محمد بن إسحاق يقول حدثنى بريدة بن سفيان عن القرضى. قال : خرج أبو ذر إلى الريدة فأصابه قدره، فأوصاهم أن اغسلوني وكفنونى ثم ضحونى طى قارعة الطريق فأول ركب …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 1، ص 169، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 1, p. 169, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 1، ص 169 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
