text: "… وأَردف وراءَه أُسامة بن زيد، وهو يعود سعد بن عبادة في بني الحارث بن الخزرج، وذلك قبل وقعة بدر، حتى مرّ بمخلط فيه من المسلمين، والمشركين عبدة الأوثان، واليهود، وفيهم عبد اللّٰه بن أُبي ابن سلول، وفي المجلس عبد اللّٰه …"
summary:
