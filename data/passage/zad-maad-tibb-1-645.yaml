text: "… يكون أحدُ والثالث: أنه يفترِسُ من يقربُه، أو يدنو منه بدائه مع كونه ثقةً ثبتاً، فالثقةُ يَغْلَطُ، أو يكونُ أحدُ الحديثين قال الدكتور الأزهري: هذا المرض سمي بداء الأسد، لأنه يحول وجه المريض بما يجعله يشبه الأسد. ما هو الجذام …"
