label: { ar: "جامع الترمذي 3008 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3008 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3008 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 3008 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 3008 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا يُوسُفُ بْنُ حَمَّادٍ، حَدَّثَنَا عَبْدُ الأَعْلَى بْنُ عَبْدِ الأَعْلَى، عَنْ سَعِيدٍ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، أَنَّ أَبَا طَلْحَةَ، قَالَ غُشِينَا وَنَحْنُ فِي مَصَافِّنَا يَوْمَ أُحُدٍ حَدَّثَ أَنَّهُ كَانَ فِيمَنْ غَشِيَهُ النُّعَاسُ يَوْمَئِذٍ قَالَ فَجَعَلَ سَيْفِي يَسْقُطُ مِنْ يَدِي وَآخُذُهُ وَيَسْقُطُ مِنْ يَدِي وَآخُذُهُ وَالطَّائِفَةُ الأُخْرَى الْمُنَافِقُونَ لَيْسَ لَهُمْ هَمٌّ إِلاَّ أَنْفُسُهُمْ أَجْبَنُ قَوْمٍ وَأَرْعَبُهُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3008، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3008 (Chapters on Tafsir), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3008، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3008 (Capítulos sobre Tafsir), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport figurant dans Jami' al-Tirmidhi, n° 3008 (Chapitres sur le Tafsir), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
