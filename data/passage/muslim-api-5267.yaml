label: { ar: "صحيح مسلم 5267 — الأب والأبوة", en: "Sahih Muslim 5267 — the father and fatherhood", ur: "صحیح مسلم 5267 — باپ اور والدیت", es: "Sahih Muslim 5267 — El padre y la paternidad" }
text: "… حَدَّثَنِي عُمَرُ بْنُ مُحَمَّدٍ، حَدَّثَنِي الْقَاسِمُ بْنُ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ، عُمَرَ حَدَّثَهُ عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" لاَ يَأْكُلَنَّ أَحَدٌ مِنْكُمْ بِشِمَالِهِ وَلاَ يَشْرَبَنَّ بِهَا فَإِنَّ الشَّيْطَانَ يَأْكُلُ بِشِمَالِهِ وَيَشْرَبُ بِهَا \". قَالَ وَكَانَ نَافِعٌ يَزِيدُ فِيهَا \" وَلاَ يَأْخُذُ بِهَا وَلاَ يُعْطِي بِهَا \". وَفِي رِوَايَةِ أَبِي …"
summary:
  ar: "حديث في صحيح مسلم، رقم 5267، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5267 (The Book of Drinks), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5267، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5267 (El Libro de las Bebidas), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
