label: { ar: "الموطأ 697 — كتاب عمر بن الخطاب في الصدقة: فرائض الإبل والغنم، ولا يجمع بين مفترق ولا يفرق بين مجتمع", en: "Muwatta 697" }
text: "ولا يجمع بين مفترق، ولا يفرق بين مجتمع، خشية الصدقة. وما كان من خليطين فإنهما يتراجعان بينهما بالسوية"
summary:
  ar: "أول حديث في باب صدقة الماشية. يروي مالك أنه قرأ كتاب عمر بن الخطاب في الصدقة فوجد فيه بعد البسملة: في أربع وعشرين من الإبل فدونها الغنم، في كل خمس شاة؛ وفيما فوق ذلك إلى خمس وثلاثين ابنة مخاض، فإن لم تكن فابن لبون ذكر؛ وإلى خمس وأربعين بنت لبون؛ وإلى ستين حقة طروقة الفحل؛ وإلى خمس وسبعين جذعة؛ وإلى تسعين ابنتا لبون؛ وإلى عشرين ومئة حقتان؛ فما زاد ففي كل أربعين بنت لبون وفي كل خمسين حقة. وفي سائمة الغنم إذا بلغت أربعين إلى عشرين ومئة شاة، وإلى مئتين شاتان، وإلى ثلاث مئة ثلاث شياه، فما زاد ففي كل مئة شاة. ولا يُخرج في الصدقة تيس ولا هرمة ولا ذات عوار إلا ما شاء المصدق، ولا يُجمع بين مفترق ولا يُفرق بين مجتمع خشية الصدقة، وما كان من خليطين فإنهما يتراجعان بينهما بالسوية، وفي الرقة إذا بلغت خمس أواق ربع العشر. ويشرح المحقق أسنان الإبل والرقة، ويذكر أنه رواه عن مالك أبو مصعب، وأن الكتاب أخرجه أحمد وأبو داود (1568 و1569) وابن ماجة (1798) والترمذي (621) وغيرهم من طريق الزهري عن سالم عن أبيه أن النبي كتب كتاب الصدقة ولم يخرجه إلى عماله حتى قُبض فعمل به أبو بكر ثم عمر، ويرى أن الصواب فيه الإرسال، وأن حديث أنس في كتاب أبي بكر له عند البخاري وأبي داود (1567) والنسائي. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
