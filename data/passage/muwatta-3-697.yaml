label: { ar: "الموطأ 697 — كتاب عمر بن الخطاب في الصدقة: فرائض الإبل والغنم، ولا يجمع بين مفترق ولا يفرق بين مجتمع", en: "Muwatta 697", es: "Muwatta 697", fr: "Muwatta 697", ur: "موطا 697", tr: "El-Muvatta 697 — Ömer ibn el-Hattab'ın Zekat Kitabı: Deve ve koyunların sadaka yükümlülükleri; ayrı olanı birleştirmemek, ayrı olanı da ayırmamak gerekir.", id: "Al-Muwatta 697 — Kitab Umar ibn al-Khattab tentang Sedekah: Kewajiban unta dan domba, dan janganlah menggabungkan apa yang terpisah dan janganlah memisahkan apa yang digabungkan" }
text: "ولا يجمع بين مفترق، ولا يفرق بين مجتمع، خشية الصدقة. وما كان من خليطين فإنهما يتراجعان بينهما بالسوية"
summary:
  ar: "أول حديث في باب صدقة الماشية. يروي مالك أنه قرأ كتاب عمر بن الخطاب في الصدقة فوجد فيه بعد البسملة: في أربع وعشرين من الإبل فدونها الغنم، في كل خمس شاة؛ وفيما فوق ذلك إلى خمس وثلاثين ابنة مخاض، فإن لم تكن فابن لبون ذكر؛ وإلى خمس وأربعين بنت لبون؛ وإلى ستين حقة طروقة الفحل؛ وإلى خمس وسبعين جذعة؛ وإلى تسعين ابنتا لبون؛ وإلى عشرين ومئة حقتان؛ فما زاد ففي كل أربعين بنت لبون وفي كل خمسين حقة. وفي سائمة الغنم إذا بلغت أربعين إلى عشرين ومئة شاة، وإلى مئتين شاتان، وإلى ثلاث مئة ثلاث شياه، فما زاد ففي كل مئة شاة. ولا يُخرج في الصدقة تيس ولا هرمة ولا ذات عوار إلا ما شاء المصدق، ولا يُجمع بين مفترق ولا يُفرق بين مجتمع خشية الصدقة، وما كان من خليطين فإنهما يتراجعان بينهما بالسوية، وفي الرقة إذا بلغت خمس أواق ربع العشر. ويشرح المحقق أسنان الإبل والرقة، ويذكر أنه رواه عن مالك أبو مصعب، وأن الكتاب أخرجه أحمد وأبو داود ⁦(1568 و1569)⁩ وابن ماجة (1798) والترمذي (621) وغيرهم من طريق الزهري عن سالم عن أبيه أن النبي كتب كتاب الصدقة ولم يخرجه إلى عماله حتى قُبض فعمل به أبو بكر ثم عمر، ويرى أن الصواب فيه الإرسال، وأن حديث أنس في كتاب أبي بكر له عند البخاري وأبي داود (1567) والنسائي. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
  tr: "Hayvan zekâtı konusundaki ilk hadis. Malik, Ömer ibn el-Hattab'ın zekât kitabını okuduğunu ve Besmele'den sonra şu ayetleri bulduğunu rivayet eder: Yirmi dört veya daha az koyun için her beş koyuna bir koyun; otuz beşe kadar olan koyunlar için bir yaşında dişi bir deve; eğer yoksa iki yaşında erkek bir deve; kırk beşe kadar olan koyunlar için iki yaşında dişi bir deve; altmışa kadar olan koyunlar için üç yaşında dişi bir deve; yetmiş beşe kadar olan koyunlar için dört yaşında dişi bir deve; doksana kadar olan koyunlar için iki adet iki yaşında dişi bir deve; yüz yirmiye kadar olan koyunlar için iki adet üç yaşında dişi bir deve; ve kırk koyun için bir adet iki yaşında dişi bir deve ve elli koyun için bir adet üç yaşında dişi bir deve zekât olarak verilir. Otlayan koyunlar için, sayıları kırk ile yüz yirmi arasında ise bir koyun zekât olarak verilir; iki yüze kadar ise iki koyun; üç yüze kadar ise üç koyun; bundan daha fazla ise her yüz koyun için bir koyun zekât olarak verilir. Erkek keçi, yaşlı hayvan veya sakat hayvan, veren kişi kendi isteğiyle vermedikçe zekât olarak verilmez. Ayrı hayvanlar birlikte verilmemeli, birlikte olan hayvanlar da zekât verilmemesi için birbirinden ayrılmamalıdır; aksi takdirde zekât kesilebilir. İki kişi bir arada ise zekâtı aralarında eşit olarak bölüştürmelidirler. Gümüş için, beş ukiyeye ulaşırsa, onda birinin dörtte biri zekât olarak verilir. Araştırmacı, develerin dişlerinin ve yumuşaklığının nedenini açıklarken, bunun Malik Ebu Musab tarafından rivayet edildiğini ve kitabın Ahmed, Ebu Davud (1568 ve 1569), İbn Majah (1798), Tirmizi (621) ve diğerleri tarafından Zühri'nin, Salim'in, babasının rivayetine dayanan isnad zinciriyle nakledildiğini, Peygamberin sadaka üzerine bir kitap yazdığını ancak vefatından sonra valilerine göndermediğini belirtiyor. Daha sonra Ebu Bekir ve ardından Ömer bu hadis üzerine hareket etmiştir. Araştırmacı, doğru versiyonun mursal (isna zincirinde eksik bir halkası olan hadis) olduğuna ve Ebu Bekir'in kitabındaki Enes hadisinin Buhari, Ebu Davud (1567) ve Nesai'de bulunduğuna inanmaktadır. {cite:muwatta-maruf-1997 s.349} {cite:muwatta-maruf-1997 s.350}"
  id: "Hadits pertama tentang zakat ternak. Malik meriwayatkan bahwa ia membaca kitab Umar bin al-Khattab tentang zakat dan menemukan di dalamnya, setelah Basmala: Untuk dua puluh empat unta dan kurang dari itu, domba wajib dizakati satu ekor domba untuk setiap lima ekor; untuk lebih dari itu, hingga tiga puluh lima ekor, unta betina berumur satu tahun wajib dizakati, dan jika tidak ada, unta jantan berumur dua tahun wajib dizakati; hingga empat puluh lima ekor, unta betina berumur dua tahun wajib dizakati; hingga enam puluh ekor, unta betina berumur tiga tahun wajib dizakati; hingga tujuh puluh lima ekor, unta betina berumur empat tahun wajib dizakati; hingga sembilan puluh ekor, dua unta betina berumur dua tahun wajib dizakati; hingga seratus dua puluh ekor, dua unta betina berumur tiga tahun wajib dizakati; dan untuk lebih dari itu, satu unta betina berumur dua tahun wajib dizakati untuk setiap empat puluh ekor, dan satu unta betina berumur tiga tahun wajib dizakati untuk setiap lima puluh ekor. Untuk domba yang merumput, jika jumlahnya mencapai empat puluh hingga seratus dua puluh ekor, wajib dizakati satu ekor domba; hingga dua ratus ekor, wajib dizakati dua ekor domba; hingga tiga ratus ekor, wajib dizakati tiga ekor domba; dan untuk jumlah lebih dari itu, wajib dizakati satu ekor domba untuk setiap seratus ekor. Kambing jantan, hewan tua, atau hewan yang cacat tidak boleh diberikan sebagai zakat kecuali jika pemberi memilih untuk memberikannya. Hewan yang terpisah tidak boleh diberikan bersama-sama, dan hewan yang bersama-sama tidak boleh dipisahkan, karena dikhawatirkan akan dikenakan zakat. Jika dua orang merupakan campuran, mereka harus membagi zakat secara merata di antara mereka. Untuk perak, jika jumlahnya mencapai lima uqiyah, wajib dizakati seperempat dari sepersepuluh. Peneliti menjelaskan tentang gigi unta dan kelembutannya, menyebutkan bahwa hadits ini diriwayatkan oleh Malik Abu Mus'ab, dan bahwa kitab ini diriwayatkan oleh Ahmad, Abu Dawud (1568 dan 1569), Ibn Majah (1798), al-Tirmidhi (621), dan lainnya melalui sanad al-Zuhri, berdasarkan riwayat Salim, berdasarkan riwayat ayahnya, bahwa Nabi menulis kitab tentang sedekah tetapi tidak mengirimkannya kepada para gubernurnya sampai beliau wafat. Abu Bakr kemudian mengamalkannya, diikuti oleh Umar. Ia percaya bahwa versi yang benar adalah bahwa hadits ini mursal (hadits dengan mata rantai yang hilang dalam sanad), dan bahwa hadits Anas dalam kitab Abu Bakr ditemukan dalam kitab al-Bukhari, Abu Dawud (1567), dan al-Nasa'i. {cite:muwatta-maruf-1997 p.349} {cite:muwatta-maruf-1997 p.350}"
