label: { ar: "الموطأ 2641 — عطاء بن أبي مسلم عن النبي: تصافحوا يذهب الغل وتهادوا تحابوا", en: "Muwatta 2641", es: "Muwatta 2641", fr: "Muwatta 2641", ur: "موطا 2641", tr: "El-Muvatta 2641 — Ata’ ibn Abi Muslim, Peygamber'den rivayetle: El sıkışın, çünkü bu husumeti giderir; hediyeleşin, çünkü bu aranızdaki sevgiyi artırır." }
summary:
  ar: "يروي مالك عن عطاء بن أبي مسلم عبد الله الخراساني قال: قال رسول الله: تصافحوا يذهب الغل، وتهادوا تحابوا وتذهب الشحناء. ويذكر المحقق قول ابن عبد البر أن الحديث يتصل من وجوه حسان، ويرى أن أحاديث هذا المعنى من البراء وعمر ومعاذ وأنس ضعيفة. {cite:muwatta-maruf-1997 p.494} {cite:muwatta-maruf-1997 p.495}"
  tr: "Malik, Ata ibn Abi Muslim Abdullah al-Khorasani'den rivayetle şöyle der: Allah Resulü şöyle buyurmuştur: “El sıkışın, çünkü bu husumeti giderir; hediyeleşin, çünkü bu sevgiyi artırır ve düşmanlığı ortadan kaldırır.” Araştırmacı, İbn Abd al-Barr'ın hadisin birçok sağlam rivayet zinciriyle bağlantılı olduğunu belirttiğini ve bu anlamdaki hadislerin al-Bara', Ömer, Mu'adh ve Enes'ten rivayet edilenlerinin zayıf olduğunu düşündüğünü aktarır. {cite:muwatta-maruf-1997 s.494} {cite:muwatta-maruf-1997 s.495}"
  id: "Malik meriwayatkan dari Ata ibn Abi Muslim Abdullah al-Khorasani, yang berkata: Rasulullah SAW bersabda: “Berjabat tanganlah, karena itu menghilangkan permusuhan; bertukar hadiahlah, karena itu menumbuhkan kasih sayang dan menghilangkan permusuhan.” Peneliti menyebutkan pernyataan Ibnu Abd al-Barr bahwa hadits tersebut terhubung melalui beberapa sanad yang baik, dan ia menganggap hadits-hadits dengan makna yang sama dari al-Bara’, Umar, Mu’adh, dan Anas sebagai hadits yang lemah. {cite:muwatta-maruf-1997 p.494} {cite:muwatta-maruf-1997 p.495}"
