summary:
  ar: "يروي مالك عن عطاء بن أبي مسلم عبد الله الخراساني قال: قال رسول الله: تصافحوا يذهب الغل، وتهادوا تحابوا وتذهب الشحناء. ويذكر المحقق قول ابن عبد البر أن الحديث يتصل من وجوه حسان، ويرى أن أحاديث هذا المعنى من البراء وعمر ومعاذ وأنس ضعيفة. {cite:muwatta-maruf-1997 p.494} {cite:muwatta-maruf-1997 p.495}"
