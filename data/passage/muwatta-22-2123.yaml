label: { ar: "الموطأ 2123 — يحيى عن مالك: الرجل يهلك وله دين عليه شاهد واحد، وعليه دين للناس لهم فيه شاهد واحد، فيأبى ورثته أن يحلفوا على حقوقهم مع شاهدهم، فإن الغرماء يحلفون ويأخذون حقوقهم، فإن فضل فضل لم يكن للورثة منه شيء", en: "Muwatta 2123" }
summary:
  ar: "قال يحيى: قال مالك في الرجل يهلك وله دين، عليه شاهد واحد، وعليه دين للناس، لهم فيه شاهد واحد، فيأبى ورثته أن يحلفوا على حقوقهم مع شاهدهم. قال: فإن الغرماء يحلفون ويأخذون حقوقهم. فإن فضل فضل لم يكن للورثة منه شيء، وذلك أن الأيمان عرضت عليهم قبل فتركوها، إلا أن يقولوا لم نعلم لصاحبنا فضلا، فيعلم أنهم إنما تركوا الأيمان من أجل ذلك، فإني أرى أن يحلفوا ويأخذوا ما بقي بعد دينه. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
