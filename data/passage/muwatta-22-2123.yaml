label: { ar: "الموطأ 2123 — يحيى عن مالك: الرجل يهلك وله دين عليه شاهد واحد، وعليه دين للناس لهم فيه شاهد واحد، فيأبى ورثته أن يحلفوا على حقوقهم مع شاهدهم، فإن الغرماء يحلفون ويأخذون حقوقهم، فإن فضل فضل لم يكن للورثة منه شيء", en: "Muwatta 2123", es: "Muwatta 2123", fr: "Muwatta 2123", ur: "موطا 2123", tr: "El-Muvatta 2123 — Yahya, Malik'ten rivayetle: Bir adam ölür ve bir şahidin şahit olduğu bir borcu vardır; ayrıca bir şahidin şahit olduğu başka kişilere de borcu vardır. Mirasçıları, haklarını şahitleriyle birlikte yemin ederek teyit etmeyi reddederler. Bunun üzerine alacaklılar yemin ederek alacaklarını alırlar. Eğer bir miktar para artarsa, mirasçıların bundan payı olmaz.", id: "Al-Muwatta 2123 — Yahya berdasarkan riwayat Malik: Seorang pria meninggal dunia dan mempunyai hutang yang hanya disaksikan oleh satu orang, dan ia juga berhutang kepada orang lain yang juga hanya disaksikan oleh satu orang. Ahli warisnya menolak untuk bersumpah atas hak mereka dengan saksi mereka. Maka para kreditur bersumpah dan mengambil hak mereka. Jika ada kelebihan, ahli waris tidak mendapat bagiannya." }
summary:
  ar: "قال يحيى: قال مالك في الرجل يهلك وله دين، عليه شاهد واحد، وعليه دين للناس، لهم فيه شاهد واحد، فيأبى ورثته أن يحلفوا على حقوقهم مع شاهدهم. قال: فإن الغرماء يحلفون ويأخذون حقوقهم. فإن فضل فضل لم يكن للورثة منه شيء، وذلك أن الأيمان عرضت عليهم قبل فتركوها، إلا أن يقولوا لم نعلم لصاحبنا فضلا، فيعلم أنهم إنما تركوا الأيمان من أجل ذلك، فإني أرى أن يحلفوا ويأخذوا ما بقي بعد دينه. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
  tr: "Yahya şöyle dedi: Malik, bir borcu olan ve bu borç için bir şahit bulunan, ayrıca başkalarına da bir borcu olan ve mirasçıları şahitleriyle birlikte haklarına yemin etmeyi reddeden bir adam hakkında şöyle dedi: Alacaklılar yemin etmeli ve alacaklarını almalıdırlar. Eğer bir fazlalık varsa, mirasçıların buna hakkı yoktur, çünkü yeminler onlara önceden teklif edilmişti, ancak onlar reddettiler; ancak \"Arkadaşımız için bir fazlalık bilmiyoruz\" derlerse, bu durumda yemin etmeyi sadece bu nedenle reddettikleri anlaşılır. Bu nedenle, bence yemin etmeli ve borçları ödendikten sonra kalanını almalıdırlar. {cite:muwatta-maruf-1997 s.267} {cite:muwatta-maruf-1997 s.268}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang meninggal dunia meninggalkan hutang, yang hanya ada satu saksi, dan hutang lain kepada orang lain, yang juga hanya ada satu saksi, dan ahli warisnya menolak untuk bersumpah atas hak mereka bersama saksi mereka: Para kreditur harus bersumpah dan mengambil hak mereka. Jika ada kelebihan, ahli waris tidak berhak atasnya, karena sumpah telah ditawarkan kepada mereka sebelumnya, tetapi mereka menolaknya, kecuali jika mereka berkata, \"Kami tidak mengetahui adanya kelebihan untuk teman kami,\" dalam hal ini akan dipahami bahwa mereka hanya menolak sumpah karena alasan itu. Oleh karena itu, saya percaya mereka harus bersumpah dan mengambil apa yang tersisa setelah hutangnya dilunasi. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
