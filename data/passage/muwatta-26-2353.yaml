label: { ar: "الموطأ 2353 — مالك: المدبر يعجل عتقه على نجوم يؤديها إلى سيده", en: "Muwatta 2353" }
summary:
  ar: "قال مالك في مدبر قال لسيده: عجل لي العتق وأعطيك خمسين دينارا منجمة عليّ، فقال سيده: نعم، أنت حر وعليك خمسون دينارا تؤديها إليّ كل عام عشرة دنانير، فرضي العبد بذلك. ثم هلك السيد بعد يوم أو يومين أو ثلاثة: يثبت له العتق، وتصير الخمسون دينارا دينا عليه، وتجوز شهادته، وتثبت حرمته وميراثه وحدوده، ولا يضع عنه موت سيده شيئا من ذلك الدين. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
