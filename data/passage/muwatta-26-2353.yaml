label: { ar: "الموطأ 2353 — مالك: المدبر يعجل عتقه على نجوم يؤديها إلى سيده", en: "Muwatta 2353", es: "Muwatta 2353", fr: "Muwatta 2353", ur: "موطا 2353", tr: "Al-Muwatta 2353 — Malik: Özgürlüğüne bağlı olarak azat edilecek köle, efendisine taksitler halinde ödenerek azat edilebilir.", id: "Al-Muwatta 2353 — Malik: Budak yang akan dibebaskan dengan syarat pembebasannya dapat dibebaskan secara bertahap yang dibayarkan kepada tuannya." }
summary:
  ar: "قال مالك في مدبر قال لسيده: عجل لي العتق وأعطيك خمسين دينارا منجمة عليّ، فقال سيده: نعم، أنت حر وعليك خمسون دينارا تؤديها إليّ كل عام عشرة دنانير، فرضي العبد بذلك. ثم هلك السيد بعد يوم أو يومين أو ثلاثة: يثبت له العتق، وتصير الخمسون دينارا دينا عليه، وتجوز شهادته، وتثبت حرمته وميراثه وحدوده، ولا يضع عنه موت سيده شيئا من ذلك الدين. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
  tr: "Malik, efendisine, “Beni azat etmeyi hızlandır, sana taksitler halinde ödemek üzere elli dinar vereceğim” diyen bir köle hakkında şöyle demiştir: Efendisi, “Evet, özgürsün ve bana her yıl on dinar ödemek üzere elli dinar borçlusun” diye cevap vermiştir. Köle bunu kabul etmiştir. Sonra efendi bir, iki veya üç gün sonra ölmüştür: Kölenin azat edilmesi kesinleşmiş, elli dinar onun borcu haline gelmiş, tanıklığı geçerli olmuş ve miras ve yasal hakları tesis edilmiştir. Efendisinin ölümü onu bu borçtan kurtarmaz. {cite:muwatta-maruf-1997 s.370} {cite:muwatta-maruf-1997 s.371}"
  id: "Malik berkata tentang seorang budak yang berkata kepada tuannya, “Percepat pembebasanku dan aku akan memberimu lima puluh dinar yang akan dibayar secara bertahap,” dan tuannya menjawab, “Ya, kamu bebas, dan kamu berutang lima puluh dinar kepadaku untuk membayar sepuluh dinar setiap tahun.” Budak itu menyetujui hal ini. Kemudian tuannya meninggal satu, dua, atau tiga hari kemudian: pembebasan budak itu ditegakkan, lima puluh dinar menjadi hutang yang harus ditanggungnya, kesaksiannya dapat diterima, dan hak waris serta hak hukumnya ditegakkan. Kematian tuannya tidak membebaskannya dari hutang tersebut. {cite:muwatta-maruf-1997 p.370} {cite:muwatta-maruf-1997 p.371}"
