text: |-
  ⁦(فصل الصام)⁩
  100
  قال الشاعر
  تشج بى العوجا. كل تنوفة • كانَ لها بوا بنهى تغاوله
  ⁦( شحيج)⁩ شيج البغل والغراب صوته وكذلله الشصاح بالضم عن الاصمعى وقد شخيج يشحيج
  ويشميج والبغال بنات شحاج والجار انو حشى مشهج وشهاج ⁦( رج)⁩ شرج العيبة
  بالتحريك، راها ود أشرحت العيبة اذا داخلت بين اشراجها ومجرة السماء تسمى شرجا
  وشرج الوادى منفسحه والجمع أشراج ودابة أشرج بين الشرج اذا كانت احدى خصيبه
  أعظم من الاخرى والشرج أيضا اقشتاق فى القوس وقد انشرجت اذا انشقت عن ابن
  السكيت والشريجة القوس تتخذمن الشريج وه والعود الذى يشق فلقين وقال الشهاخ
  شراعج النبع براها النواس الشريجة شئ ينسج من سعف النخل يحمل فيه البطيخ ونحوه
  والشرح بالتسكين مسيل ماء من الحرّة الى السهل والجمع شبراج وشروج وتول هذاشرج
  هذا أى مثل وهما شرج واحد أى ضرب واحدو الشرجان الفرقتان يقال أصب وافى ءذا
  الامر شر جين أى ذرفتين وكل لوئين مختلفين فهحا شرجان وشرح اسم موضع وفى المثل أشبه
  شرج شرجالوات أسيرا قال يعقوب شرج ماء لبنى عيس وشرحت اللين شرجانضدته
  والتشريج الخياطة المتباعدة: وقول أبي ذؤيب
  قصر الصبوح لها قشرح لها * بالنىَّ فهى تتوخُ فيها الاصبع
  أى خلط لمها بالشهم وتشرج اللحم بالشهم اى تداخلا ⁦(شفرج)⁩ التفارج مثال
  العلابط فارسى معرب وه والذى تسميه الناس بشبارج عن يعقوب ( شمج قواهم
  ماذقت شماجا أى شيئا وأصله مايرمى به من العنب بعدما يؤ كل وشعجت الثوب أشعبه
  شميا اذاخة بعبلة النى لجول الوتب أي مرق قذي(ا الادب سية
  وينوشمج بنجرم من قضاعة وبنوشمج بن فزارة من ذبيان ⁦(شرج)⁩ شمرج ثوبه
  شمرجة اذا باعدبين الغرز وأساء اللحياطسة والشهرج بالضم الحسل الرقيق النسجج قال ابن
  مقبل بصف فرسا
  ويرعدار عاد الهجين أضاعه • غداة الشمال الشهرج المتتصح
  ⁦(شنج)⁩ لشتج نقبض فى الجالدوقد شنج الحلد بالكسر وانشنج وتشنج وشنحته أنا تشنيجا وفرص
  ستج النساوهو مدح له لانه اذا شتج نساه لم تسترخ رجلاه وقد يوصف الغراب بذلك قال
  العاوقاح
  شنج النساحرق الجناح كأنه • فى الدار اثر الفاعنين مقيد
  صر الصاد رخ) الصاروج النورة وأخلاطها فارسى معرّب وكذلك كل
  كلة فيها صادوجيم لانممالايجقعان فى كلة واحدة من كلام العرب ⁦(صلج)⁩ الصولجان
  يفتح اللام الحجن فارسى معرّب والجمع الصوالحة والهاء للعمة (صمح الصحيح القناديل
  رومى معرب الواحدة صمجة قال الشهاخ
  يسرى ادانام بنوالزيات • والنهم مثل الصمح الروميات
  نج لصبح الذى تعرفه العرب وه والذى يتخذ من مدذ ريضرب أحدهما بالآ خ.
  وأَما الصنج ذوالاوتار فيختص به الحجم وهمامه ربان وقال
  كأنها وقدبراها الاخماس
  ودلج الليل وهادة باس المخ
  قوله اللبن بكسبر الياء اه
