label: { ar: "سنن أبي داود 3629 — الأب والأبوة", en: "Sunan Abi Dawud 3629 — the father and fatherhood", ur: "سنن ابی داؤد 3629 — باپ اور والدیت", es: "Sunan Abi Dawud 3629 — El padre y la paternidad" }
text: "حَدَّثَنَا مُعَاذُ بْنُ أَسَدٍ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، أَخْبَرَنَا هِرْمَاسُ بْنُ حَبِيبٍ، - رَجُلٌ مِنْ أَهْلِ الْبَادِيَةِ - عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ أَتَيْتُ النَّبِيَّ بِغَرِيمٍ لِي فَقَالَ لِي \" الْزَمْهُ \". ثُمَّ قَالَ لِي \" يَا أَخَا بَنِي تَمِيمٍ مَا تُرِيدُ أَنْ تَفْعَلَ بِأَسِيرِكَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3629، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3629 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3629، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3629 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
