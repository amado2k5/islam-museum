text: |-
  * ⁦(باب القاف)⁩ •
  ٩٥
  قال النابغة الذبيانى يهجو النعمان
  حدثونى بنى الشقيقة ماي شنع فقعا بقرقر أن يزولا
  وفرس أشق أى طويل والاننى شقاء قال جابر أخو بنى معاوية بن بكر التغلبىّ
  ويوم الكلاب استتزات أسلاتنا • شرجبيل اذآلى ألية مقسم
  لينتزعن أرماحنا فأزاله * أبو حنش عن ظهرشقًا صلدم
  ويروى عن سرج يقول حلف عدونالينتزعن أرماحنا من أيدينا فقتلناه وشققت الشئ
  فانشق وشق ناب البعيرأى طلمع لغة فى شقأ وشق فلان العصاأى فارق الهاعة وانشقت
  العصاأى تفرق الامر والمشاقة والشقاق الخلاف والعداوة وشقء-لىّ الشئء يشق شقا
  ومشقة والاسم الثق بالسكسر وشق بصر الميت اذاتطر الى شى لايرتد اليسه طرفه قال ابن
  السكيت ولا تقل شق الميت بصره وه والذى حضره الموت والاشتفاق أخذشق الشى وهو
  صفه والاشتقاق الاخذ فى الكلام وفى الخصومة بمينا وشمالامع ترك القصد واشتقاق
  الحرف من الحرف أخذهمنه ويقال شقق السكلام اذا أخر جه أحسن مخرج وشققت
  الحطب وغيره فنشقق وشقشق الفحل شقشقة هدر والعصفوريشة شو فى صوته والشقشقة
  بالكسرشئ كالرئة يخرجها البعير من فيه اذاهاج واذا قالو اللغطيب ذوشقشقة فاغمايشبه
  بالفهلشقرق النقراق والشقراق طائريسمى الاخيل والعرب تنشاءم به وربما قالوا
  شرقراق مثال سرطراط (شمق الشمقمق الطويل ومروان بن محمد الشاءريكن بأبي
  الشمقعق ⁦(شنق)⁩ الشنق فى الصدقة مابين الفريضتين وفى الحديث لاشناق أى لا يؤخذ
  من الشنقحتى يتم والشنق أيضامادون الدية وذلك أن يسوق ذوالحمالة الدية كاملة فاذا
  كانت معهاديات جراحات قتلك هى الاشناق كا نها متعلقة بالدية العظمى ومنه قول
  الشاءر * بأشناف الديات الى الكمول * وقال الاخطل
  قرم تعلق أشناق الديات به • اذا اليون أمرت فوقهحلا
  والشنيق الدعى قال الشاعر
  أنا الداخل الباب الذى لايرومه • دتى.ولايدعى اليه شفيق
  وأشنقت القربة اشناها اذاشددتهما بالشفاق وهو خيط يشدبه فم القربة وشنقت البعير
  أشنه شنقااذا كففته بزمامه وأنت راكبه وأنشد طلحة قصيدة نازال شانقاراحلته حتى
  كتبت له وهو التييى تليس الخزاعى وأشفق بعيره لغة فى شنقه وأشفق البعير بنفسه اذارفع
  رأسه يتعدى ولا يتعدى والشنق طول الراس والشسناق الطويل قال الراجز
  قد رنونى بامرئ شناق • شمردل يلبس عظم الساق
  قال الكائى لحم مشفق أى مقط-ع قال وهو مأخوذ من أشفاق الدية وقال الاموى
  يقال للعجين الذى يقطع ويعمل بالزيت مشنق ⁦(شوق )⁩ الشوق والاشتياق نزاع النفس
  الى الشئ يقال شاقى الشىْ يشوقى فهو شائَق وأنامس-وق وشوّقنى فتشوقت اذاهيج
  شوقك وقول الراجز
  بادار مى بالدكاديك البرق • سقيافقد هيبت شوق المشتأق
