text: "… من جميع الأعاجم سواء كانوا من أهل الكتاب أو من المشركين ولا تؤخذ من العرب إلا من أهل الكتاب. وقال الإمام مالك : بل يجوز أن تضرب الجزية على جميع الكفار من كتابى ومجوسى ووثنى وغير ذلك ولمأخذ هذه المذاهب …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 2، ص 351، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 2, p. 351, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 2، ص 351 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 2, pág. 351, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
