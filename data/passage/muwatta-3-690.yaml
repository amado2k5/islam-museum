label: { ar: "الموطأ 690 — كتاب عمر بن عبد العزيز إلى رزيق بن حيان على جواز مصر: من كل أربعين ديناراً دينار، ومن أهل الذمة من كل عشرين دينار", en: "Muwatta 690", es: "Muwatta 690", fr: "Muwatta 690", ur: "موطا 690", tr: "El-Muvatta 690 — Ömer ibn Abdülaziz'in Razık ibn Hayyan'a Mısırlıların girişiyle ilgili mektubu: her kırk dinar için bir dinar ve Ahit Ehli için her yirmi dinar için bir dinar.", id: "Al-Muwatta 690 — Surat Umar ibn Abd al-Aziz kepada Raziq ibn Hayyan mengenai masuknya orang Mesir: satu dinar untuk setiap empat puluh dinar, dan untuk Ahlul Bait, satu dinar untuk setiap dua puluh dinar." }
summary:
  ar: "أول حديث في باب زكاة العروض. يرويه مالك عن يحيى بن سعيد عن رزيق بن حيان، وكان على جواز مصر في زمان الوليد وسليمان وعمر بن عبد العزيز، أن عمر بن عبد العزيز كتب إليه: انظر من مر بك من المسلمين فخذ مما ظهر من أموالهم مما يديرون من التجارات من كل أربعين ديناراً ديناراً، فما نقص فبحساب ذلك حتى تبلغ عشرين ديناراً، فإن نقصت ثلث دينار فدعها؛ ومن مر بك من أهل الذمة فخذ مما يديرون من التجارات من كل عشرين ديناراً ديناراً، فما نقص فبحساب ذلك حتى تبلغ عشرة دنانير، فإن نقصت ثلث دينار فدعها؛ واكتب لهم بما تأخذ منهم كتاباً إلى مثله من الحول. ويذكر المحقق أن اسمه في نسخة م «زريق» وأن يحيى رواه بتقديم الراء كما نص الباجي، وهو رزيق بن حيان الدمشقي أبو المقدام، وأنه رواه عن مالك أبو مصعب والشافعي في مسنده. {cite:muwatta-maruf-1997 p.346} {cite:muwatta-maruf-1997 p.347}"
  tr: "Mal zekâtı bölümündeki ilk hadis. Malik, Yahya ibn Sa'id'den, o da Ruzayq ibn Hayyan'dan rivayet etmiştir. Ruzayq ibn Hayyan, El-Valid, Süleyman ve Ömer ibn Abdülaziz dönemlerinde Mısır sınırından sorumluydu. Ömer ibn Abdülaziz ona şöyle yazmıştır: \"Senden geçen Müslümanlara bak ve onların mallarından, ticaretlerinden her kırk dinar için bir dinar al. Eğer eksik kalırsa, yirmi dinara ulaşana kadar hesapla. Eğer üçte bir dinar eksik kalırsa, bırak. Senden geçen Ahit Ehli'nden de ticaretlerinden her yirmi dinar için bir dinar al. Eğer eksik kalırsa, on dinara ulaşana kadar hesapla. Eğer üçte bir dinar eksik kalırsa, bırak. Onlara, gelecek yılın aynı zamanına kadar onlardan ne kadar aldığını ayrıntılı olarak anlatan bir belge yaz.\" Editör, M el yazmasındaki adının \"Zurayq\" olduğunu ve Yahya'nın, el-Baji'nin belirttiği gibi, \"ra\" harfinden önce \"ra\" harfiyle rivayet ettiğini belirtiyor. O, Ruzayq ibn Hayyan el-Dimashqi, Ebu el-Miqdam'dır ve bunu Malik, Ebu Mus'ab ve el-Şafii'den Musned'inde rivayet etmiştir. {cite:muwatta-maruf-1997 s.346} {cite:muwatta-maruf-1997 s.347}"
  id: "Hadits pertama dalam surah tentang zakat atas barang dagangan. Diriwayatkan oleh Malik dari Yahya ibn Sa'id dari Ruzayq ibn Hayyan, yang bertanggung jawab atas perbatasan Mesir pada masa pemerintahan al-Walid, Sulayman, dan Umar ibn Abd al-Aziz. Umar ibn Abd al-Aziz menulis kepadanya: \"Perhatikanlah orang-orang Muslim yang lewat di dekatmu dan ambillah dari harta mereka, dari perdagangan mereka, satu dinar untuk setiap empat puluh dinar. Jika kurang, hitunglah hingga mencapai dua puluh dinar. Jika kurang sepertiga dinar, tinggalkanlah. Dan dari Ahlul Baitullah yang lewat di dekatmu, ambillah dari perdagangan mereka, satu dinar untuk setiap dua puluh dinar. Jika kurang, hitunglah hingga mencapai sepuluh dinar. Jika kurang sepertiga dinar, tinggalkanlah. Tulislah kepada mereka sebuah dokumen yang merinci apa yang kamu ambil dari mereka hingga waktu yang sama tahun berikutnya.\" Penyunting mencatat bahwa namanya dalam manuskrip M adalah \"Zurayq,\" dan bahwa Yahya meriwayatkannya dengan huruf \"ra\" mendahului \"ra,\" sebagaimana dinyatakan oleh al-Baji. Dia adalah Ruzayq ibn Hayyan al-Dimashqi, Abu al-Miqdam, dan bahwa dia meriwayatkannya dari Malik, Abu Mus'ab, dan al-Shafi'i dalam Musnadnya. {cite:muwatta-maruf-1997 p.346} {cite:muwatta-maruf-1997 p.347}"
