label: { ar: "الموطأ 690 — كتاب عمر بن عبد العزيز إلى رزيق بن حيان على جواز مصر: من كل أربعين ديناراً دينار، ومن أهل الذمة من كل عشرين دينار", en: "Muwatta 690" }
summary:
  ar: "أول حديث في باب زكاة العروض. يرويه مالك عن يحيى بن سعيد عن رزيق بن حيان، وكان على جواز مصر في زمان الوليد وسليمان وعمر بن عبد العزيز، أن عمر بن عبد العزيز كتب إليه: انظر من مر بك من المسلمين فخذ مما ظهر من أموالهم مما يديرون من التجارات من كل أربعين ديناراً ديناراً، فما نقص فبحساب ذلك حتى تبلغ عشرين ديناراً، فإن نقصت ثلث دينار فدعها؛ ومن مر بك من أهل الذمة فخذ مما يديرون من التجارات من كل عشرين ديناراً ديناراً، فما نقص فبحساب ذلك حتى تبلغ عشرة دنانير، فإن نقصت ثلث دينار فدعها؛ واكتب لهم بما تأخذ منهم كتاباً إلى مثله من الحول. ويذكر المحقق أن اسمه في نسخة م «زريق» وأن يحيى رواه بتقديم الراء كما نص الباجي، وهو رزيق بن حيان الدمشقي أبو المقدام، وأنه رواه عن مالك أبو مصعب والشافعي في مسنده. {cite:muwatta-maruf-1997 p.346} {cite:muwatta-maruf-1997 p.347}"
