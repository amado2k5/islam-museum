text: "مِنْ وَرَائِهِمْ ثَلَاثَ أُمَمٍ: تَاوِيلَ، وَتَاريسَ، وَمَنْسَكَ. هذا حديث غريب، بل منكر ضعيف"
summary:
  ar: "ينقل ابن كثير عن الطبراني حديثاً يذكر أن وراء يأجوج ومأجوج ثلاث أمم هي تاويل وتاريس ومنسك، ويحكم عليه بأنه غريب بل منكر ضعيف؛ ويذكر محقق الطبعة أن فيه وهب بن جابر وهو مجهول عند ابن المديني، وأن الألباني عدّه منكراً."
  en: "Ibn Kathir cites from al-Tabarani a hadith that beyond Gog and Magog lie three further nations, Tawil, Taris and Mansak, and he judges it strange and indeed objectionable and weak. The edition's footnote notes that Wahb ibn Jabir in the chain is unknown according to Ibn al-Madini and that al-Albani called it munkar."
  es: "Ibn Kathir cita de al-Tabarani un hadiz que afirma que más allá de Gog y Magog se encuentran otras tres naciones: Tawil, Taris y Mansak, y lo considera extraño, incluso objetable y débil. La nota a pie de página de la edición señala que, según Ibn al-Madini, Wahb ibn Jabir en la cadena de transmisión es desconocido y que al-Albani lo denominó munkar."
  fr: "Ibn Kathir cite d'al-Tabarani un hadith selon lequel, au-delà de Gog et Magog, se trouvent trois autres nations: Tawil, Taris et Mansak. Il juge ce hadith étrange, voire contestable et faible. La note de bas de page de l'édition précise que, selon Ibn al-Madini, Wahb ibn Jabir, mentionné dans la chaîne de transmission, est inconnu et qu'al-Albani le qualifie de munkar (fausse)."
  ur: "ابن کثیر نے طبرانی سے ایک حدیث نقل کی ہے کہ یاجوج ماجوج کے علاوہ تین اور قومیں ہیں، تاویل، طاریس اور منسک، اور وہ اسے عجیب اور حقیقتاً قابل اعتراض اور ضعیف قرار دیتے ہیں۔ ایڈیشن کا حاشیہ نوٹ کرتا ہے کہ سلسلہ میں وہب بن جبیر کا نام ابن المدینی کے نزدیک نامعلوم ہے اور البانی نے اسے منکر کہا ہے۔"
  tr: "İbn Kathir, Al-Tabarani'den, Gog ve Magog'un ötesinde üç milletin olduğunu belirten bir hadis rivayet eder: Tawil, Taris ve Mansak. Bunu garip, hatta reddedilmiş ve zayıf bir rivayet olarak değerlendirir. Yayın editörü, hadisin İbn Al-Madini tarafından bilinmeyen Vahb ibn Cabir'i içerdiğini ve Al-Albani'nin bunu reddedilmiş saydığını belirtir."
  id: "Ibn Kathir mengutip Al-Tabarani berdasarkan sebuah hadits yang menyatakan bahwa di luar Gog dan Magog terdapat tiga bangsa: Tawil, Taris, dan Mansak. Ia menilai hadits tersebut aneh, bahkan ditolak dan lemah. Editor edisi tersebut menyebutkan bahwa hadits itu memuat Wahb ibn Jabir, yang tidak dikenal oleh Ibn Al-Madini, dan bahwa Al-Albani menganggapnya ditolak."
