text: "مِنْ وَرَائِهِمْ ثَلَاثَ أُمَمٍ: تَاوِيلَ، وَتَاريسَ، وَمَنْسَكَ. هذا حديث غريب، بل منكر ضعيف"
summary:
  ar: "ينقل ابن كثير عن الطبراني حديثاً يذكر أن وراء يأجوج ومأجوج ثلاث أمم هي تاويل وتاريس ومنسك، ويحكم عليه بأنه غريب بل منكر ضعيف؛ ويذكر محقق الطبعة أن فيه وهب بن جابر وهو مجهول عند ابن المديني، وأن الألباني عدّه منكراً."
  en: "Ibn Kathir cites from al-Tabarani a hadith that beyond Gog and Magog lie three further nations, Tawil, Taris and Mansak, and he judges it strange and indeed objectionable and weak. The edition's footnote notes that Wahb ibn Jabir in the chain is unknown according to Ibn al-Madini and that al-Albani called it munkar."
  es: "Ibn Kathir cita de al-Tabarani un hadiz que afirma que más allá de Gog y Magog se encuentran otras tres naciones: Tawil, Taris y Mansak, y lo considera extraño, incluso objetable y débil. La nota a pie de página de la edición señala que, según Ibn al-Madini, Wahb ibn Jabir en la cadena de transmisión es desconocido y que al-Albani lo denominó munkar."
