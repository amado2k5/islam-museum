label: { ar: "الموطأ 588 — أبو هريرة: نهى النبي عن الصلاة بعد العصر حتى تغرب الشمس وبعد الصبح حتى تطلع", en: "Muwatta 588" }
summary:
  ar: "يرويه مالك عن محمد بن يحيى بن حبان عن الأعرج عن أبي هريرة، أن النبي نهى عن الصلاة بعد العصر حتى تغرب الشمس، وعن الصلاة بعد الصبح حتى تطلع الشمس. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه البغوي، وإسحاق الطباع وابن مهدي وعثمان بن عمر عند أحمد، وسويد، والقعنبي عند الجوهري، وابن القاسم (96)، وقتيبة عند النسائي (1/276)، والشافعي في الرسالة (872)، ويحيى بن يحيى النيسابوري عند مسلم (2/206). {cite:muwatta-maruf-1997 p.303}"
