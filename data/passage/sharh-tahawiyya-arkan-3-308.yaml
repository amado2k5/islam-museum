text: "… كُلُّهُ إيمانٌ بالغيب الذي أخبر به الله علاله أو أخبر به رسول اللّه وَلِلقِ الجهة الثانية: أنَّ من أركان الإيمان: الإيمان باليوم الآخر، ومُقَدِّمَات اليوم الآخر وأشراط الساعة التي ثبتت في كتاب الله وفي سنة محمد رسول الله وَلِيلفِ فإنَّ …"
summary:
