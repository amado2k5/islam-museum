label: { ar: "الموطأ 1036 — محمد بن عبد الله بن أبي مريم سأل سعيد بن المسيب عن ظفر له انكسر وهو محرم: فقال: اقطعه", en: "Muwatta 1036", es: "Muwatta 1036", fr: "Muwatta 1036", ur: "موطا 1036", tr: "El-Muvatta 1036 — Muhammed ibn Abdullah ibn Abi Maryam, Said ibn el-Musayyab'a ihramlı haldeyken kırılan bir tırnağı hakkında sordu. Said ibn el-Musayyab şöyle dedi: \"Onu kes.\"", id: "Al-Muwatta 1036 — Muhammad ibn Abdullah ibn Abi Maryam bertanya kepada Saeed ibn Al-Musayyab tentang kuku yang patah saat ia sedang dalam keadaan ihram. Beliau menjawab: Potong saja." }
text: "اقطعه"
summary:
  ar: "يرويه مالك عن محمد بن عبد الله بن أبي مريم أنه سأل سعيد بن المسيب عن ظفر له انكسر وهو محرم، فقال سعيد: اقطعه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1196) وسويد (581). {cite:muwatta-maruf-1997 p.482}"
  tr: "Malik, Muhammed ibn Abdullah ibn Abi Maryam'dan rivayet ettiğine göre, ihramlı haldeyken tırnağı kırılan Sa'id ibn al-Musayyab'a sormuş ve Sa'id, \"Kes onu\" diye cevap vermiştir. Editör, bunun Malik'ten Ebu Mus'ab (1196) ve Suwayd (581) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.482}"
  id: "Malik meriwayatkan hadits ini dari Muhammad ibn Abdullah ibn Abi Maryam, yang bertanya kepada Sa'id ibn al-Musayyab tentang kuku yang patah saat ia sedang dalam keadaan ihram. Sa'id menjawab, \"Potong saja.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1196) dan Suwayd (581). {cite:muwatta-maruf-1997 p.482}"
