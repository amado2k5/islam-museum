text: "… عنْها قَالَتْ : هَاجَرَ عبْدُ اللّٰه بنُ جَحْشٍ بأُمِّ حَبِيبَةَ بِنْتِ أَبِى سُفْيَانَ، وَهِىَ امْرَأَتُهُ إِلَى أَرْضِ الْحَبَشَةِ، فَلَمَّا قَدِمَ أَرْضَ الْحَبَشَةِ مَرِضَ، فَلَمَّا حَضَرَتْهُ الوَفَاةُ أَوْصَى إِلَى رَسُولِ اللّٰه وَلَ م فَتَزَوَّجَ رَسُولُ اللّه لِلم حَبِيبَةً، وبَعَثَ مَعَهَا النَّجَاشىُ …"
