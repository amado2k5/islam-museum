text: "… هارباً من بلد إلى بلد، خوفاً من الإسلام وأهله، وهو آخر ملوك الفرس في الدنيا على الإطلاق، لقول رسول اللٰه لي: إِذَا هَلَكَ قَيْصَرُ فَلاَ فَيْصَرَ بَعْدَهُ، وَإِذَا هَلَكَ كِسْرَى فَلاَ الزمزمة : صوت له دويّ. وكان الأعاجم يزمزمون قبل …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 4، ص 158، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
