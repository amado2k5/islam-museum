summary:
  ar: "قال مالك في العبيد يكاتبون جميعا: إن للسيد أن يعتق منهم الكبير الفاني، والصغير الذي لا يؤدي واحد منهما شيئا، وليس عند واحد منهما عون ولا قوة في كتابتهم، فذلك جائز له. {cite:muwatta-maruf-1997 p.363}"
