label: { ar: "الموطأ 2337 — مالك: جواز عتق الكبير الفاني أو الصغير من المكاتبين", en: "Muwatta 2337", es: "Muwatta 2337", fr: "Muwatta 2337", ur: "موطا 2337", tr: "El-Muvatta 2337 — Malik: Köleliğin sona erdirilmesi sözleşmesi kapsamında yaşlı veya genç bir kölenin azat edilmesinin caizliği", id: "Al-Muwatta 2337 — Malik: Kebolehan membebaskan budak tua atau muda berdasarkan perjanjian pembebasan" }
summary:
  ar: "قال مالك في العبيد يكاتبون جميعا: إن للسيد أن يعتق منهم الكبير الفاني، والصغير الذي لا يؤدي واحد منهما شيئا، وليس عند واحد منهما عون ولا قوة في كتابتهم، فذلك جائز له. {cite:muwatta-maruf-1997 p.363}"
  tr: "Malik, sözleşme altında olan köleler hakkında şunları söylemiştir: Efendinin, yaşlı, daha az yetenekli köleyi ve genç köleyi, her ikisinin de hiçbir katkısı olmadığı ve sözleşmelerini yerine getirecek imkan veya güce sahip olmadıkları durumlarda, azat etme hakkı vardır; bu onun için caizdir. {cite:muwatta-maruf-1997 s.363}"
  id: "Malik berkata mengenai para budak yang semuanya terikat kontrak: Tuan berhak membebaskan budak yang lebih tua dan kurang mampu, serta budak yang lebih muda, yang keduanya tidak dapat memberikan kontribusi apa pun, dan keduanya tidak memiliki sarana atau kekuatan untuk memenuhi kontrak mereka; hal ini diperbolehkan baginya. {cite:muwatta-maruf-1997 p.363}"
