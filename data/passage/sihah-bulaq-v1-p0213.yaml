text: |-
  كذا فى نسخة
  .٤٢٨
  (ياب الزاى
  ⁦(رقذ)⁩
  ونحن غداة أوقد فى خزازى * رفدنافوق رفد الرافدينا
  ويروى فى خزاز والخزخز. ثال الهديد القوى حكاه أبو عبيد عن الاصمعى قال وأنشدنا
  غيره
  أعددت للورداذا الوردحفز • غرباجرورا وجلالاخزخز
  نز) ختر اللحم بالكسر يختز ختزا أى أنتن مثل خزن على القلب والخنزوانة التكبر يسال
  هودوخنزوانات قال الشاعر
  لميم نزت فى أنفه خنزوانة * على الرحم القربى أحذ أبائر
  ( خوذ. اخازيازذباب وهما اسمان جعلا واحداوبنيا على المكسر لا يتغيران فى الرفع
  والنصب والجز قال عمربن أحر
  تفقأفوقه القلع السوارى * وجنّ الخازبازيه جنونا
  وقال الاصمعى الخازيازخكاية اصوت الذباب فسماهيه وقال ابن الاعرابى الخاز بازنيت
  وأنشد أبونصرتقوية لقول ابن الاءرابى
  رعيتها أكرم عودعودا * الصل والصفصل واليعضيدا
  وانهازياز الستم المجودا • بحيثيدعوعامر مسعودا
  وعامر ومسعودهما راعيان قال وه وفى غير هذاداه يأخذ الابل فى حلوقها والناس
  قال الراجز
  ياخازبازارسل اللهازما * انى أخاف أن تكون لازما
  والحزبازلغة فيه وأنشد الاخفش ورمت لهازمه من الحزباز والحوزجيل من الناس
  ⁦( فصل الدال)⁩ درز. الدرز واحددروز النوب فارسى معرب يقال للقمل والصيبان
  بشات الدروز قال ابن الاعرابى يقال للسفلة أولاددرزة كما يقال للفقراء بنو غبراء قال
  الشاعر يخاطب زيدين على
  أولاددرزة أسلوك وطاروا ويقال أرادبه الخياطين
  وكانواق دخرجوامعه فتركوه وانهزموا (دلمز الدلامن القوى الماضى والدلمز
  مقت ورمنه وقد خففه الراجز
  فقال دلا مز يربى على الدلمز
  وجمع الدلامن دلا مزيفتح الدال قال الراجز يغبي على الدلامن الخرارت دهلز
  الدهليزبالكسر مابين الباب والدار فارسى معرب والجمع الدهاليز
  ف صل ال بز كبش ربيزأى مكتنز أعجر مثل رئيس وربز القرية وربسها ملأها
  ⁦( رجز)⁩ الرجز القذر مثل الرجس وقرئ قوله تعالى والرجز فاهيجر بالكسر والضم قال
  مجاهدهو الصنم وأماقوله تعالى رجزا من السماءفهو العذاب والرجز بالتحريك ضرب من
  الشعر وقد رجز الراجز وار تجز والمرتجز اسم فرس كان لرسول اللّٰه صلى اللّٰه علميه وسلم الذى
  اشتراه من الاعرابى وشهدله خزيمة بن ثابت والرجز أيضاداء يصيب الابل فى أعجازها فاذا
  ثارت الناقة ارتعشت فخذاها ساعة ثم تنبسطان يقال بعير أرجز وق د رجز وناقسة رجزاء
  قال الشاعر هممت بخير ثم قصرت دونه * كمانأت الرجزا شدعقالها
  ومنه سمى الرجز من الشعر لتقارب اجزائه وقلة حروفه والرجازة مر كب أصغر من الهودج
  ويقال هو كساميجعل فيه أججار يعلق بأحدياني الهودج اذامال زز بوزيدرزت
  الجرادة ترزرزا ورزوزاوهوأن تدخل ذنبها فى الارض فتاقي يضها وآرزت مثله وقدرززت
  الشئ
