text: "وفيها: مات أبو عامر الراهب، الذي كان عند هرقل عظيم الروم. وفيها: ماتت بُوران بنت كسرى ملكة الفرس، وملكوا بعدها أختها آزرمَن. قاله أبو عُبَيْدة. وفي أواخر ذي القعدة: وُلد محمد بن أبي بكر الصدّيق، أ ولدته أسماء بنت عُمَيْس، …"
summary:
