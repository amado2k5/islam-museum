text: "وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا ۚ قَالَ يَـٰقَوْمِ ٱعْبُدُوا۟ ٱللَّهَ مَا لَكُم مِّنْ إِلَـٰهٍ غَيْرُهُۥٓ ۖ إِنْ أَنتُمْ إِلَّا مُفْتَرُونَ"
text_search: "وإلى عاد أخاهم هودا ۚ قال يا قوم اعبدوا الله ما لكم من إله غيره ۖ إن أنتم إلا مفترون"
translations:
  en: { text: "And unto (the tribe of) A'ad (We sent) their brother, Hud. He said: O my people! Serve Allah! Ye have no other Allah save Him. Lo! ye do but invent.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور ہم نے عاد کی طرف ان کے بھائی ہود (کو بھیجا) انہوں نے کہا کہ میری قوم! خدا ہی کی عبادت کرو، اس کے سوا تمہارا کوئی معبود نہیں۔ تم (شرک کرکے خدا پر) محض بہتان باندھتے ہو", translator: "Fateh Muhammad Jalandhari", license: PD }
