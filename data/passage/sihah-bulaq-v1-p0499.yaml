text: |-
  باب الجيم)
  الكلا قال جبيهاء الاشجعى يصف عنزافه
  لحأت كأنّ القسور الجون بجها * عساليجه والثاهر المتناوح
  ورجل أيج اذا كان واسع مشق العين قال ذو الرمّة
  ومختلق للملك أيض فدغم • أشم أيج العين كالقمر البدر
  وعيز مجاء واسعة والبحة التى فى الحديث صتم واليجيجشى يفعلد الانسان عند منائاة الصىّ
  قال ابن السكيت اذاكان الرحل سمينا ثم اضطرب لمه قيسل رجل يجباج وبجيا حسة
  قال الراجز
  حتى تزى البجباجة الضياطا * يسع لماحالف الاغباطا
  ⁦( بحزج)⁩ البحزج ولد البقرة قال العجاج بفاحم وحف وعيسنى بخزج
  (بذج البذج من أولاد الضان بعنزلة العتود من أولاد المعز وبجعه يذجان وقال
  قد هلكت جارتنا من الهمج وان تجمع تأكل عتودا أو بذج
  ⁦(برج)⁩ برج الحصن ركنه والجمع بروج وابراج ور بماسمى الحصن به قال اللّٰه تعالى ولو كنتم
  فى بروح مشيدة والبرح واحسدبروج السماء وبرجان اسم لص بقال أسرق من برجان والبرح
  بالتحريك أن يكون بياض العسين محد قابالسواد كام لا يغيبمن سوادهاشئ واهى أة برجاء
  بينة البرح ومنه قيل توب مبرج للمهين من الحلل والتبرح اظهار المرأة زينتها ومحاسنها
  للرجال والابريج الممخضة وقال
  لقد تخض فى قلبى مودّتها • كما تخض فى ابريجه اللبن
  الهاء فى ابريجه برجع الى اللبن ( بردج : البردج السى وهو معزب وأصله بالفارسية برده
  قال الهجاج يصف الفالميم
  اا البر جار عم (عج ه بلسل
  بعجا اذا شقه فهو مبعوج وبعيج قال أبو ذؤيب
  وذلك أعلى منك قدرالانه * كريم وبطنى بالسكرام بعيج
  ورجل بعج كأنه مبعوج البطن من ضعف مشيه قال الشاعر
  لبلة أمشى على مخاطرة * مشبارويدا كمشية البعيج
  والانبعاج الانشقاق وتبعج السحاب تبعجاوهوانفراجه عن الودق يقال بعيج المطر الارض
  معجامن شدة صه الجارة قال العجاج
  حيث استهل المزن اذتبعجا والباعجة متسع
  الوادى ( ج البلوح الاشرافة قول يلج الصبح يبلج بالضم أى أضاء وانبنج وتبلج. شله
  وتبلج فلان اذا ضحك وهسْ وصبح أبلج بين البلج أى مشرق مفئ قال العجاج
  حتى بدت أعناق صبح أبلها وكذلك الحق اذا اتضح يقال الحق أبلج والباطل لجلج وكل شئ
  وضح فقد البلاج ابليجاجا والعلجة والبلجة فى آخر الليل يقال رأيت يلجة الصبح اذارأيت ضوءه
  والبلجة نناوة مابين الحاجبين يقال رجل أبلج بين اليلج اذ الم يكن-قرونا وفى حديث أم معبد
  فى صفة الني صلى اللّٰه عليه وسلم أيلج الوحه أى مشرقه ولم تردبلح الحاجب لانها تصفه بالقرن
  عن أبى عبيد ( هج لبهعة الحسن يقال رجل ذو بهجة وقد بهج بالضم بهاجة فهو
  بهيج قال اللّٰه تعالى من كل زوج :بهيج وبهج به بالكسر أى فرح به وسرّة فه و بهيج وبهيج
