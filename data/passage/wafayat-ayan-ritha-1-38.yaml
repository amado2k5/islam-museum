  tr: "\"Vafayat al-A'yan wa Anba' Abna' al-Zaman\" (Çağın Önemli Şahsiyetlerinin Biyografileri ve İnsanlarının Haberleri) Resimli Cilt 1, sayfa 38'den bir alıntı; vefat etmiş bir kişi için yazılmış bir ağıt ve övgü içeriyor; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgülerin bir tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari \"Wafayat al-A'yan wa Anba' Abna' al-Zaman\" (Biografi Tokoh Terkemuka dan Berita Orang-orang di Zaman Ini), Jilid Bergambar 1, hlm. 38, berisi elegi dan eulogi untuk orang yang telah meninggal; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan eulogi paling terkenal."
