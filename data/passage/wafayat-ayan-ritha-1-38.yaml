text: "… العداوة قالت: هو عدوّ أزرق، وقد جاء هذا في كلامهم وأشعارهم كثيراً، واستعمله الحريري في المقامة الرابعة عشرة فقال: فمذ أغبرّ العيشُ الأخضر، وازورّ المحبوب الأصفر، اسود يومي الأبيض، وابيض فَوْدي الأسود، حتى رثى لي العدو الأزرق، فحبذا الموت الأحمر. …"
summary:
  ar: "مقطع من وفيات الأعيان وأنباء أبناء الزمان، المجلد المصوَّر 1، ص 38، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
