label: { ar: "الموطأ 453 — أبو جعفر القارئ يلتفت في صلاته فيغمزه ابن عمر", en: "Muwatta 453", es: "Muwatta 453", fr: "Muwatta 453", ur: "موطا 453", tr: "El-Muvatta 453 — Ebu Cafer el-Kari namaz kılarken başını çeviriyor, bunun üzerine İbn Ömer onu dürtüyor.", id: "Al-Muwatta 453 — Abu Ja`far al-Qari’ menoleh saat shalat, lalu Ibnu Umar menyenggolnya." }
summary:
  ar: "أثر يرويه مالك عن أبي جعفر القارئ، في باب الالتفات والتصفيق عند الحاجة في الصلاة: كان يصلي وعبد الله بن عمر وراءه ولا يشعر، فالتفت فغمزه ابن عمر إنكاراً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
  tr: "Malik'in Ebu Cafer el-Kari'den rivayet ettiği, namaz sırasında gerektiğinde dönüp alkışlama bölümünde yer alan bir rivayete göre: Abdullah ibn Ömer arkasında namaz kılarken, onun varlığından habersizdi. Arkasını döndüğünde, İbn Ömer onu onaylamaz bir şekilde dürttü. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Abdül-Razzak tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.232} {cite:muwatta-maruf-1997 s.233}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Abu Ja'far al-Qari', dalam bab tentang berbalik dan bertepuk tangan bila perlu selama shalat: Beliau sedang shalat dengan Abdullah ibn Umar di belakangnya, tanpa menyadari kehadirannya. Beliau berbalik, dan Ibn Umar menyenggolnya sebagai tanda ketidaksetujuan. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab, Suwaid, dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
