summary:
  ar: "أثر يرويه مالك عن أبي جعفر القارئ، في باب الالتفات والتصفيق عند الحاجة في الصلاة: كان يصلي وعبد الله بن عمر وراءه ولا يشعر، فالتفت فغمزه ابن عمر إنكاراً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.232} {cite:muwatta-maruf-1997 p.233}"
