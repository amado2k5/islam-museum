label: { ar: "الموطأ، كتاب المساقاة", en: "Muwatta, Book of Irrigation Partnership (musaqat)", es: "Muwatta, Libro de la Asociación de Riego (musaqat)", fr: "Muwatta, Livre du Partenariat d'Irrigation (musaqat)" }
summary:
  ar: "كتاب المساقاة، الكتاب التاسع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 24 نصا (2049–2072) في بابين، من الصفحة 239 إلى الصفحة 247 من ملف PDF المجلد الثاني. يبدأ بمساقاة أهل خيبر وما جرى فيها من خرص عبد الله بن رواحة، ويبين السنة في المساقاة وما يشترط فيها من الأعمال والنفقة، وما لا يجوز من الزيادة فيها، ثم شرط الرقيق في المساقاة. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.247}"
  en: "The Book of Irrigation Partnership (musaqat), nineteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 24 reports (2049–2072) in two babs, PDF pp. 239–247 of volume 2. It opens with the agreement with the Jews of Khaybar and Ibn Rawaha's estimate, sets out the customary work and expenses in musaqat, forbids added payments that turn it into hire, and closes with the workers and slaves in the orchard."
  es: "El Libro de la Asociación de Riego (musaqat), decimonoveno libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997), en el volumen 2: 24 informes (2049–2072) en dos babs, PDF pp. 239–247 del volumen 2. Comienza con el acuerdo con los judíos de Khaybar y la estimación de Ibn Rawaha, establece el trabajo y los gastos habituales en el musaqat, prohíbe los pagos adicionales que lo convierten en un alquiler y termina con los trabajadores y esclavos en el huerto."
  fr: "Le Livre du Partenariat d'Irrigation (musaqat), dix-neuvième livre de la Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997), dans le volume 2: 24 rapports (2049–2072) en deux babs, PDF pp. 239–247 du volume 2. Il s'ouvre sur l'accord avec les Juifs de Khaybar et l'estimation d'Ibn Rawaha, expose le travail et les dépenses habituels dans le musaqat, interdit les paiements supplémentaires qui le transforment en loyer, et se termine avec les travailleurs et les esclaves dans le verger."
