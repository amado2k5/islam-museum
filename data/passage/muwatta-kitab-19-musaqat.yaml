summary:
  ar: "كتاب المساقاة، الكتاب التاسع عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997)، في المجلد الثاني: 24 نصا (2049–2072) في بابين، من الصفحة 239 إلى الصفحة 247 من ملف PDF المجلد الثاني. يبدأ بمساقاة أهل خيبر وما جرى فيها من خرص عبد الله بن رواحة، ويبين السنة في المساقاة وما يشترط فيها من الأعمال والنفقة، وما لا يجوز من الزيادة فيها، ثم شرط الرقيق في المساقاة. {cite:muwatta-maruf-1997 p.239} {cite:muwatta-maruf-1997 p.247}"
  en: "The Book of Irrigation Partnership (musaqat), nineteenth book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997), in volume 2: 24 reports (2049–2072) in two babs, PDF pp. 239–247 of volume 2. It opens with the agreement with the Jews of Khaybar and Ibn Rawaha's estimate, sets out the customary work and expenses in musaqat, forbids added payments that turn it into hire, and closes with the workers and slaves in the orchard."
