label: { ar: "الموطأ 1433 — ابن شهاب عن أبي إدريس الخولاني عن أبي ثعلبة الخشني: أكل كل ذي ناب من السباع حرام", en: "Muwatta 1433", es: "Muwatta 1433", fr: "Muwatta 1433", ur: "موطا 1433", tr: "El-Muvatta 1433 — İbn Şihab, Ebu İdris el-Havlanî'den, o da Ebu Tha'labe el-Huşani'den rivayetle: Dişli yırtıcı hayvanların yenmesi yasaktır.", id: "Al-Muwatta 1433 — Ibn Shihab, berdasarkan riwayat Abu Idris al-Khawlani, berdasarkan riwayat Abu Tha’labah al-Khushani: Memakan binatang buas yang bertaring hukumnya haram." }
text: "أكْلُ كُلِّ ذِي نابٍ مِن السِّبَاعِ حَرامٌ"
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي إدريس الخولاني عن أبي ثعلبة الخشني أن رسول الله قال أكل كل ذي ناب من السباع حرام. ويذكر المحقق أن ابن عبد البر قال إن يحيى انفرد بهذا اللفظ عن مالك في هذا الإسناد، وأن بقية رواة الموطأ رووه نهى عن أكل كل ذي ناب. {cite:muwatta-maruf-1997 p.640}"
  tr: "Malik, İbn Şihab'dan, o da Ebu İdris el-Havlanî'den, o da Ebu Tha'labe el-Huşani'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Dişli yırtıcı hayvanların etinin yenmesi yasaktır.\" Araştırmacı, İbn Abd el-Barr'ın bu rivayet zincirinde bu ifadeyi Malik'ten sadece Yahya'nın naklettiğini, Muvatta'nın diğer ravilerinin ise dişli yırtıcı hayvanların etinin yenmesini yasaklayan bir hüküm olarak naklettiklerini söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.640}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Abu Idris al-Khawlani, dari Abu Tha'labah al-Khushani, bahwa Rasulullah SAW bersabda: \"Memakan binatang buas yang bertaring hukumnya haram.\" Peneliti menyebutkan bahwa Ibn Abd al-Barr mengatakan bahwa Yahya adalah satu-satunya yang meriwayatkan hadits ini dari Malik dalam rantai periwayatan ini, dan bahwa perawi-perawi Muwatta' lainnya meriwayatkan hadits ini sebagai larangan memakan binatang buas yang bertaring. {cite:muwatta-maruf-1997 p.640}"
