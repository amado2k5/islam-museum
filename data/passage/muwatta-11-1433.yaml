summary:
  ar: "يروي مالك عن ابن شهاب عن أبي إدريس الخولاني عن أبي ثعلبة الخشني أن رسول الله قال أكل كل ذي ناب من السباع حرام. ويذكر المحقق أن ابن عبد البر قال إن يحيى انفرد بهذا اللفظ عن مالك في هذا الإسناد، وأن بقية رواة الموطأ رووه نهى عن أكل كل ذي ناب. {cite:muwatta-maruf-1997 p.640}"
