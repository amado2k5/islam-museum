label: { ar: "الموطأ، كتاب الصيد", en: "Muwatta, Book of Hunting (sayd)", es: "Muwatta, Libro de la caza (sayd)", fr: "Muwatta, Livre de Chasse (sayd)", ur: "موطا، شکار کی کتاب ⁦(کہا)⁩", tr: "Al-Muwatta, Avcılık Kitabı", id: "Al-Muwatta, Kitab Perburuan" }
summary:
  ar: "كتاب الصيد، الكتاب الحادي عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 27 نصاً (1414–1440) في سبعة أبواب، من الصفحة 635 إلى الصفحة 644 من ملف PDF المجلد الأول. يبدأ بترك أكل ما قتله المعراض والحجر، ثم الصيد بالكلاب المعلمة والجوارح، ثم صيد البحر، ثم تحريم كل ذي ناب من السباع، ثم جلود الميتة والاضطرار إليها. {cite:muwatta-maruf-1997 p.635} {cite:muwatta-maruf-1997 p.644}"
  en: "The Book of Hunting, eleventh book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 27 reports (1414–1440) in seven babs, PDF pp. 635–644 of volume 1, from game killed by a stone or blunt shaft through trained dogs and birds, sea game, fanged beasts, and hides and carrion."
  es: "El Libro de la Caza, undécimo libro del Muwatta en la recensión de Yahya ibn Yahya (ed. Ma'ruf 1997): 27 informes (1414–1440) en siete babs, PDF pp. 635–644 del volumen 1, desde la caza muerta con una piedra o un arpón romo hasta perros y aves entrenados, caza marina, bestias con colmillos, y pieles y carroña."
  fr: "Le Livre de la Chasse, onzième livre du Muwatta dans la recension de Yahya ibn Yahya (éd. Ma'ruf 1997): 27 rapports (1414–1440) dans sept babs, PDF pp. 635–644 du volume 1, du gibier tué par une pierre ou un pieu émoussé aux chiens et oiseaux dressés, au gibier marin, aux bêtes à crocs, aux peaux et aux charognes."
  ur: "شکار کی کتاب، یحییٰ بن یحییٰ کی تجدید میں موطا کی گیارہویں کتاب ⁦(ایڈیشن معارف 1997)⁩: 27 رپورٹس (1414–1440) سات بابوں میں، پی ڈی ایف پی پی 635-644 والیوم 1، پتھر کے ذریعے مارے گئے کھیل سے یا کند ہو کر، سمندری جہاز کے ذریعے کھیلے گئے کھیل سے چھپاتا ہے اور مردار."
  tr: "Yahya ibn Yahya'nın Malik'ten rivayet ettiği, El-Muvatta'nın on birinci kitabı olan Avcılık Kitabı, Beşar Awad Maruf'un (1997) baskısında yer almaktadır: 27 metin (1414-1440 Hicri), yedi bölüm halinde, 1. cildin PDF dosyasının 635. sayfasından 644. sayfasına kadar. Kitap, sopa veya taşla öldürülen hayvanların yenmesinin yasaklanmasıyla başlar, ardından eğitilmiş köpekler ve yırtıcı kuşlarla avlanma, deniz avcılığı, ardından tüm yırtıcı hayvanların zehirli dişlerinin yasaklanması, son olarak ölü hayvanların derilerinin ve bunların kullanılmasının gerekliliği konularını ele alır. {cite:muwatta-maruf-1997 s.635} {cite:muwatta-maruf-1997 s.644}"
  id: "Kitab Perburuan, kitab kesebelas Al-Muwatta, sebagaimana diriwayatkan oleh Yahya ibn Yahya dari Malik, dalam edisi Bashar Awad Maruf (1997): 27 teks (1414–1440 H) dalam tujuh bab, dari halaman 635 hingga halaman 644 dari berkas PDF Volume 1. Dimulai dengan larangan memakan apa yang dibunuh dengan pentungan atau batu, kemudian berburu dengan anjing terlatih dan burung pemangsa, kemudian berburu di laut, kemudian larangan memakan semua hewan pemangsa bertaring, kemudian kulit hewan mati dan perlunya menggunakannya. {cite:muwatta-maruf-1997 p.635} {cite:muwatta-maruf-1997 p.644}"
