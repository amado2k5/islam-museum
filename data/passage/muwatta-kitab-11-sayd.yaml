  ar: "كتاب الصيد، الكتاب الحادي عشر من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 27 نصاً (1414–1440) في سبعة أبواب، من الصفحة 635 إلى الصفحة 644 من ملف PDF المجلد الأول. يبدأ بترك أكل ما قتله المعراض والحجر، ثم الصيد بالكلاب المعلمة والجوارح، ثم صيد البحر، ثم تحريم كل ذي ناب من السباع، ثم جلود الميتة والاضطرار إليها. {cite:muwatta-maruf-1997 p.635} {cite:muwatta-maruf-1997 p.644}"
  en: "The Book of Hunting, eleventh book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 27 reports (1414–1440) in seven babs, PDF pp. 635–644 of volume 1, from game killed by a stone or blunt shaft through trained dogs and birds, sea game, fanged beasts, and hides and carrion."
