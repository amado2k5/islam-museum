text: |-
  •باب الميم)•
  ٣١٥
  فعقوت على مالم يسمّ فاعل اذ الم تقبل الولد السكائى رحم معقومة أى مسدودة لاتلد
  ومصدروالعقم والعقم بالفتح والضم وكلام عقمىّ وعقمى أى غامض ويقال أيضاعقمت
  مفاصل يديه ورجليه اذا يبست وفى الحديت تعقم أصلاب المشركين ورجل عقيم لا يولدله
  والملك عقيم لانّ الرجل قد يققل ابنه اذا خافه على الملانوريح عقيم لا تلقح سهابا ولاشجراويوم.
  القيامة يوم عقيم لانه لايوم بعده وامرأة عقيم ونسوة عقم وقديسكن وقال
  عقم النساءفايلدن شيهه • انّ الناعنلهعة-م
  والاعتقام أن تحفر البئرفاذا قربت من الماءاحتفرت بتراصغيرة بقدرما تجد طعم الماءقان
  كان عذيا جف رت بقيتها قال العجاج يصف تورا• اذا اتحى معتقما أولحفا• وقول الشاغر
  وماءآجن الجمات قفر • نعقم فى جوانبه السباع
  أى تحتفروبتال زدّد وعاقت فلانا اذا خاصمته ⁦( كم)⁩ العكم بالكسر العدل وهما
  عكمان والعكم أيضاغط تجعل فيه المرأة ذ خيرتها قال مزرّد
  ولما غدت أمى تحي بنتها • أغرت على العكم الذى كان يمنع
  خلطت بصاع الاقط صاعيز عجوة • الى صاع سمن وسطه يتريع
  وعكمت المتاع :ددته والعكام الخيط الذى يعكم به وعكمت البعيرشددت عليه العكم
  وعكهت الرجل العكم اذا عكمته له مثل قولك حليته الناقة أى حلبتها له وأعكمته أى أعنته
  على العكم وعكم عنافلان عكما اذا صرف عن زيارتنا وقال ١ . أزهير هل عن شيبة من معكم
  أى معدل ومصرف والعكم الانتظار قال أوس
  فحال ولم يعكم وشع أمره • بمنقطع الفضَراءشدّمؤالف
  أى لمَ نتظرية ول هرب ولم يكر وعكمت الابل تعكيما سمنت وحلت شحماء-لى شهم ورجسل
  معكم بالمكسر مكتنز الليم كرم العكرمة الاتى من المام وعكرمة أبو قبيلة
  وهو عكرمة بن خصفة بن قدس عيلان وقول زهير
  خذواحظكم يا آل عكرم واذكروا • أواصرنا والرحم بالغيب تذكر
  خذف الهاء فى غير نداءضرورة ⁦(علم)⁩. العلامة والعلم الجبل وأنشد أبو عبيدة لجري
  اذا قط عن علما بداعلم* والعلم علم النوب والعلم الراية وعسلم الرجل يعلم علما اذا صار أعلم وهو
  المشقوق الشفة العليا والمرأة علماه وعلت التئ أعله علماء ر فته وعالات الرجل فعامته أعله
  بالضم غليته بالعلم وعلت شفته أعلمه علما مثال كسرته أكسره كسرا اذاشة فتها ورجل علامة
  أى عالم جدّا والها الممبالغسة كانهم يريدون به داهية واستعلمى اللخبرفا علمته اياه وأعلم
  القصار النوب فهو معلم والثوب معلم وأعلم الفارص جعل لنفسه علامة الشيعان فه ومعلم
  قال الاخطل مازال فينارباط الخيل معلمة • وفى كليب رباط اللؤم والعار
  قوله معلة بكسر اللام وعلمته الشئ فتعلم وليس التشديد ههنا للتكثير ويقال أيضاتعلم فى
  موضع اعلم قال عمروبن معد يكرب
  تعلم أن خير الناس طرا• قبيل بين أجار المكلاب
  قال ابن السكيت تعلمت أنّ فلانا خاد ج بمستزلة علت قال واذا قال لذاعلم أنّ ز يداخار ج
  ١ فى نسخسة زيادة الشاهير
  أبو كبير الهذلوبقية البيت
  أم لاخلودليا زل متسكرم
  اه
