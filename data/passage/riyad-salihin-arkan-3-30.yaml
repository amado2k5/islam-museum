text: "… أَنْ لا إِلَهَ إِلَّ اللَّهُ، وأَنَّ مُحَمَّدا رسوَلُ اللَّهِ وَتُقِيمَ الصَّلاَةَ، وَتُؤْتِيَ الزَّكَاةَ، وتصُومّ رَمضَانَ، ومُحُجَّ الييْتَ إِنْ استَطّعتَ إِلَيْهِ سَبَيلاً. قال : صدَّقتَ. فَعجبْنَا لَهُ يسالُهُ ويصدُّقُهُ ا قَالَ : فَأَخْبَرْنِى عن الإيمانِ. قَالَ أَنْ تُؤْمِن بِاللَّهِ وملائِكَتِهِ، وكُتُبِهِ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 30، يذكر الصلاة والزكاة والصوم والحج مجتمعة، والإيمان بالله وملائكته وكتبه ورسله، والسؤال عن الإيمان وجوابه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 30, that mentions the prayer, the zakat, the fast and the pilgrimage named together, belief in God, His angels, His books and His messengers, the question about faith and its answer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 30 کا اقتباس جس میں نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان، ایمان کے بارے میں سوال اور اس کا جواب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen 3, pág. 30, que menciona la oración, el zakat, el ayuno y la peregrinación, la creencia en Dios, sus ángeles, sus libros y sus mensajeros, la cuestión de la fe y su respuesta; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
