text: "… بعيران - مثلا - أحدهما فوق الآخر في نحو بئر. فإن مات الأسفل بثقل الأعلى مثلا لم يحل، بخلاف ما لو طعن الأعلى بنحوسهم أو رمح، فوصل إلى الأسفل وأثر فيه يقينا، فهما حلال وإن لم يعلم بالأسفل. حديث: فإن …"
