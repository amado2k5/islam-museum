text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، حَدَّثَنَا ابْنُ أَبِي حَازِمٍ، عَنْ أَبِيهِ، عَنْ سَهْلٍ، قَالَ الْتَقَى النَّبِيُّ وَالْمُشْرِكُونَ فِي بَعْضِ مَغَازِيهِ فَاقْتَتَلُوا، فَمَالَ كُلُّ قَوْمٍ إِلَى عَسْكَرِهِمْ، وَفِي الْمُسْلِمِينَ رَجُلٌ لاَ يَدَعُ مِنَ الْمُشْرِكِينَ شَاذَّةً وَلاَ فَاذَّةً إِلاَّ اتَّبَعَهَا فَضَرَبَهَا بِسَيْفِهِ، فَقِيلَ يَا رَسُولَ اللَّهِ مَا أَجْزَأَ أَحَدُهُمْ مَا أَجْزَأَ فُلاَنٌ. فَقَالَ \" إِنَّهُ مِنْ أَهْلِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4207، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4207 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4207، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
