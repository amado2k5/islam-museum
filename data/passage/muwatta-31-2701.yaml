summary:
  ar: "قال يحيى: سُئل مالك: هل تأكل المرأة مع غير ذي محرم منها أو مع غلامها؟ فقال مالك: ليس بذلك بأس إذا كان على وجه ما يُعرف للمرأة أن تأكل معه من الرجال. وقد تأكل المرأة مع زوجها، ومع غيره ممن يؤاكله، أو مع أخيها على مثل ذلك. ويُكره للمرأة أن تخلو مع الرجل ليس بينه وبينها حرمة. {cite:muwatta-maruf-1997 p.524}"
