label: { ar: "الموطأ 2701 — مالك: اجتماع المرأة مع الرجل في الطعام وكراهة الخلوة به", en: "Muwatta 2701", es: "Muwatta 2701", fr: "Muwatta 2701", ur: "موطا 2701", tr: "Al-Muwatta 2701 — Malik: Bir kadın ve bir erkeğin birlikte yemek yemesi ve onunla yalnız kalmanın istenmeyen bir durum olması.", id: "Al-Muwatta 2701 — Malik: Seorang wanita dan seorang pria makan bersama, dan ketidakpantasan berduaan dengannya." }
summary:
  ar: "قال يحيى: سُئل مالك: هل تأكل المرأة مع غير ذي محرم منها أو مع غلامها؟ فقال مالك: ليس بذلك بأس إذا كان على وجه ما يُعرف للمرأة أن تأكل معه من الرجال. وقد تأكل المرأة مع زوجها، ومع غيره ممن يؤاكله، أو مع أخيها على مثل ذلك. ويُكره للمرأة أن تخلو مع الرجل ليس بينه وبينها حرمة. {cite:muwatta-maruf-1997 p.524}"
  tr: "Yahya şöyle dedi: Malik'e, \"Bir kadının yakın akrabası (mahrem) olmayan bir erkekle veya erkek hizmetçisiyle yemek yemesi caiz midir?\" diye soruldu. Malik şöyle cevap verdi: \"Eğer bu, bir kadının erkeklerle yemek yemesi için adet olan bir şekilde yapılırsa, bunda bir sakınca yoktur. Bir kadın kocasıyla, yemeklerini paylaştığı diğer erkeklerle veya erkek kardeşiyle benzer şekilde yemek yiyebilir. Bir kadının yakın akrabası (mahrem) olmayan bir erkekle yalnız kalması mekruhtur.\" {cite:muwatta-maruf-1997 s.524}"
  id: "Yahya berkata: Malik ditanya: Apakah diperbolehkan bagi seorang wanita untuk makan bersama seorang pria yang bukan kerabat dekat (mahram) atau dengan pelayan laki-lakinya? Malik menjawab: Tidak ada salahnya jika dilakukan dengan cara yang lazim bagi seorang wanita untuk makan bersama laki-laki. Seorang wanita boleh makan bersama suaminya, atau dengan laki-laki lain yang biasa makan bersamanya, atau dengan saudara laki-lakinya dengan cara yang serupa. Tidak disukai jika seorang wanita sendirian dengan seorang pria yang bukan kerabat dekat (mahram)nya. {kutipan:muwatta-maruf-1997 hlm. 524}"
