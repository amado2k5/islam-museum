label: { ar: "الموطأ 381 — عروة: تصلي المرأة في درع وخمار إذا كان الدرع سابغاً", en: "Muwatta 381", es: "Muwatta 381", fr: "Muwatta 381", ur: "موطا 381", tr: "Al-Muwatta 381 — Urwah: Bir kadın, elbisesi yeterince uzunsa, uzun elbise ve başörtüsüyle namaz kılabilir.", id: "Al-Muwatta 381 — Urwah: Seorang wanita boleh shalat dengan mengenakan gaun panjang dan jilbab jika gaunnya cukup panjang." }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب الرخصة في صلاة المرأة في الدرع والخمار: استفتته امرأة أن المنطق يشق عليها أفتصلي في درع وخمار، فقال: نعم إذا كان الدرع سابغاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.205}"
  tr: "Malik'in, Hişam ibn Urve'den, onun da babasından rivayet ettiği, bir kadının tunik ve başörtüsüyle namaz kılmasının caiz olduğu bölümünde yer alan bir rivayete göre: Bir kadın, konuşmakta zorlandığını, bu yüzden tunik ve başörtüsüyle namaz kılıp kılamayacağını sormuş ve Malik'ten fetva istemiş. Malik, \"Evet, eğer tunik yeterince uzunsa\" diye cevap vermiş. Editör, bu rivayetin Ebu Musab ve Suveyd tarafından Malik'ten nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.205}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, dalam surah tentang keringanan bagi wanita untuk shalat dengan mengenakan tunik dan jilbab: Seorang wanita meminta fatwa kepadanya, dengan mengatakan bahwa berbicara menjadi sulit baginya, jadi bolehkah ia shalat dengan mengenakan tunik dan jilbab? Beliau menjawab: Boleh, jika tuniknya cukup panjang. Editor menyebutkan bahwa Abu Musab dan Suwaid meriwayatkannya atas otoritas Malik. {cite:muwatta-maruf-1997 p.205}"
