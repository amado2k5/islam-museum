label: { ar: "الموطأ 381 — عروة: تصلي المرأة في درع وخمار إذا كان الدرع سابغاً", en: "Muwatta 381" }
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب الرخصة في صلاة المرأة في الدرع والخمار: استفتته امرأة أن المنطق يشق عليها أفتصلي في درع وخمار، فقال: نعم إذا كان الدرع سابغاً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.205}"
