text: "… طريق في الشجرة كان مع جماعةٍ مِنَ الشبَّانِ في نزهةٍ فاتَّفقوا فيما بينهم على أنْ يسرِقوا حذاءَهُ نقالوا : مَن يقدرُ على صعودِ هذه الشجرة؟ فقال جحا: أنا أصعدُها. فقالوا: لا تقدر. فَاغتاظ منهم وجمع أطراف ثيابِهِ وخلعَ حذاءَهُ ثم …"
summary:
  ar: "دبّر شبان سرقة حذاء جحا، فقال إنه سيصعد الشجرة، وخلع حذاءه وثبّته في حزامه وقال إنه قد يجد طريقًا إلى البيت عبر الشجرة. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  en: "Young men plan to steal Juha's shoe; he says he will climb the tree, takes off his shoes and tucks them in his belt, saying he may find a way back home through the tree. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  ur: "چند نوجوانوں نے جحا کا جوتا چرانے کا منصوبہ بنایا؛ جحا نے کہا کہ میں درخت پر چڑھوں گا، اور جوتے اتار کر اپنی پیٹی میں اڑس لیے اور کہا کہ شاید مجھے درخت کے راستے گھر واپسی کا راستہ مل جائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  fr: "Des jeunes gens projettent de voler la chaussure de Juha ; il dit qu'il va grimper à l'arbre, ôte ses chaussures et les glisse dans sa ceinture, disant qu'il trouvera peut-être par l'arbre un chemin pour rentrer chez lui. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  es: "Unos jóvenes planean robar el zapato de Juha; él dice que trepará al árbol, se quita los zapatos y los mete en el cinturón diciendo que quizá encuentre por el árbol un camino de vuelta a casa. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
  tr: "Bazı gençler Juha'nın ayakkabılarını çalmayı planladılar. Juha ağaca tırmanacağını, ayakkabılarını çıkarıp kemerine bağlayacağını ve ağaçtan geçerek evine dönebileceğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 40}"
  id: "Beberapa pemuda bersekongkol untuk mencuri sepatu Juha. Dia berkata dia akan memanjat pohon, melepas sepatunya, mengikatnya ke ikat pinggangnya, dan mengatakan dia mungkin akan menemukan jalan pulang melalui pohon itu. {cite:juha-nawadir-kubra-djuwaydi p. 40}"
