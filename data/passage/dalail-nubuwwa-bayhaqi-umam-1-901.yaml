text: "… ونصر أهل الكتاب على العجم، قال عطية : وسألنا أبا سعيد الخدري عن ذلك فقال التقينا مع رسول اللّٰه ومشركي العرب والتقت الروم وفارس فنصرنا اللّه تعالى على مشركي العرب ونصر أهل الكتاب على المجوس ففرحنا بنصر اللّٰه إيانا على …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 901، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
