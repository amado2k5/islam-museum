text: "… والاسترخاء ليس في اللحى المائل لكن في الذي يحاذيه. الإسكندر قال: علاج اللقوة بالمضوغ والغرور والعطوس والسعوط والحجامة في القفاء بلا شرط لأن هذه المحجمة يجذب الداء من النخاع، وادلك الرأس وأجعل عليه الأدوية المحمرة، وأجود ما يعطس به الجندبادستر …"
