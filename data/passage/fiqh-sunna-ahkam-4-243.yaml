text: "… الفراغ فيعيدها على الفرض أيضاً. وأما من صلى الثانية مع الجماعة على أنها نافلة اقتداء بالنبي في أمره بذلك فليس ذلك من إعادة الصلاة في اليوم مرتين لأن الأولى فريضة والثانية نافلة ؛ فلا إعادة حينئذ. استحباب انحراف الإمام عن …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 243، يرد فيه ذكر الفريضة والفرائض، والفرض، والمستحب، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 243, whose wording mentions the obligation (farida), the obligatory (fard), the recommended (mustahabb), the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 243 کا اقتباس جس میں فریضہ اور فرائض، فرض، مستحب، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
