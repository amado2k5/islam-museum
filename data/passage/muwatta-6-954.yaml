label: { ar: "الموطأ 954 — ابن عمر كان يقطع التلبية إذا انتهى إلى الحرم حتى يطوف بالبيت وبين الصفا والمروة، ثم يلبي حتى يغدو من منى إلى عرفة، ويترك التلبية في العمرة إذا دخل الحرم", en: "Muwatta 954" }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقطع التلبية في الحج إذا انتهى إلى الحرم، حتى يطوف بالبيت وبين الصفا والمروة، ثم يلبي حتى يغدو من منى إلى عرفة، فإذا غدا ترك التلبية. وكان يترك التلبية في العمرة إذا دخل الحرم. ويذكر المحقق أن البيهقي (5/104) رواه عن عطاء عن ابن عمر بلفظ «إذا دخل الحرم». {cite:muwatta-maruf-1997 p.455}"
