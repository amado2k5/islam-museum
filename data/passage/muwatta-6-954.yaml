label: { ar: "الموطأ 954 — ابن عمر كان يقطع التلبية إذا انتهى إلى الحرم حتى يطوف بالبيت وبين الصفا والمروة، ثم يلبي حتى يغدو من منى إلى عرفة، ويترك التلبية في العمرة إذا دخل الحرم", en: "Muwatta 954", es: "Muwatta 954", fr: "Muwatta 954", ur: "موطا 954", tr: "El-Muvatta 954 — İbn Ömer, Haram'a (kutsal bölgeye) ulaştığında, Kâbe'nin etrafında tavaf yapıp Safa ile Merve arasında Sa'i çekene kadar Telbiye okumayı bırakırdı. Daha sonra Mina'dan Arafat'a gidene kadar Telbiye okumaya devam ederdi. Umre sırasında ise Haram'a girdikten sonra Telbiye okumayı bırakırdı.", id: "Al-Muwatta 954 — Ibnu Umar akan berhenti membaca Talbiyah ketika sampai di Haram (tempat suci) hingga ia melakukan Tawaf mengelilingi Ka'bah dan Sa'i antara Safa dan Marwa. Kemudian ia akan melanjutkan membaca Talbiyah hingga ia berangkat dari Mina ke Arafat. Ia akan berhenti membaca Talbiyah selama Umrah begitu ia memasuki Haram." }
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يقطع التلبية في الحج إذا انتهى إلى الحرم، حتى يطوف بالبيت وبين الصفا والمروة، ثم يلبي حتى يغدو من منى إلى عرفة، فإذا غدا ترك التلبية. وكان يترك التلبية في العمرة إذا دخل الحرم. ويذكر المحقق أن البيهقي (5/104) رواه عن عطاء عن ابن عمر بلفظ «إذا دخل الحرم». {cite:muwatta-maruf-1997 p.455}"
  tr: "Malik, Nafi'den rivayet ettiğine göre, Abdullah ibn Umar, Hac sırasında Haram'a (kutsal bölgeye) ulaştıktan sonra, Kâbe'yi tavaf edip Safa ile Merve arasında Sa'i yapana kadar Telbiye okumayı bırakırdı. Daha sonra Mina'dan Arafat'a doğru yola çıkana kadar Telbiye okur, oradan da okumayı bırakırdı. Umre sırasında da Haram'a girdikten sonra Telbiye okumayı bırakırdı. Araştırmacı, el-Beyhaki'nin (5/104) bunu Ata'dan, o da İbn Umar'dan \"Haram'a girdikten sonra\" ifadesiyle rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.455}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar akan berhenti membaca Talbiyah selama ibadah Haji setelah sampai di Haram (tempat suci), hingga beliau melakukan tawaf di Ka'bah dan melakukan Sa'i antara Safa dan Marwa. Kemudian beliau akan membaca Talbiyah hingga meninggalkan Mina menuju Arafat, dan setelah itu beliau akan berhenti membacanya. Beliau juga akan berhenti membaca Talbiyah selama ibadah Umrah setelah memasuki Haram. Peneliti menyebutkan bahwa al-Bayhaqi (5/104) meriwayatkannya dari Ata’ atas otoritas Ibn Umar dengan redaksi, “setelah memasuki Haram.” {cite:muwatta-maruf-1997 p.455}"
