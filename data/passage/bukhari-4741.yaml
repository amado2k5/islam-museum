label:
  ar: "البخاري 4741 — يا آدم أخرج بعث النار"
  en: "Bukhari 4741 — Adam, bring out the party of the Fire"
  ur: "بخاری 4741 — اے آدم، آگ والوں کا حصہ نکالو"
text: "يقول الله عز وجل يوم القيامة يا آدم. يقول لبيك ربنا وسعديك، فينادى بصوت إن الله يأمرك أن تخرج من ذريتك بعثا إلى النار. قال يا رب وما بعث النار قال من كل ألف أراه قال تسعمائة وتسعة وتسعين فحينئذ …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 4741: يا آدم أخرج بعث النار. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 4741: Adam, bring out the party of the Fire. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 4741: اے آدم، آگ والوں کا حصہ نکالو۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
