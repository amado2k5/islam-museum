text: "… خراسان،. الجارودية. أهل دمشق،. الجهمية، حرف الخاء أهل الشام،،،، ,، الخرّمية. أهل طبريّة. الخوارج. أهل العراق، حرف الراء أهل الكوفة. أهل المدينة،،،، الروم،،،،،،،. أهل مصر،. حرف الزاي أهل مكة. الزنادقة،،،، الزيدية. حرف الباء حرف الشين البرامكة،. الشيعة،. البربر. حرف العين …"
summary:
