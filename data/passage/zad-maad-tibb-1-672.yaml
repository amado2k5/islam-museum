text: "… من هذا أنفع من الكثير من غيره. محبته للحلواء والعسل وبيان أنهما مع اللحم أفضل الأغذية أعني : اللحم والعسل والحلواء - مِن أفضل الأغذية، وأنفعها للبدن والكبد والأعضاء، وللاغتذاء بها نفع عظيم في حفظ الصحة والقوة، ولا ينفِرُ منها …"
