text: "… أيوب صلعم وأنما قدّمنا ذكر خبره وقعته قبل خبر يوسف وقعتته لما ذكر من أمره وانه كان نبيّا في عهد يعقوب الى يوسف، وذكر ان عُمْر أيوب كان ثلثا وتسعين سنة وانه اوصى عند موته الى ابنه حومل وأن الله …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 370، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 2, p. 370, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
