label: { ar: "سنن النسائي 2833 — ما حُرّم", en: "Sunan al-Nasa'i 2833 — what was made unlawful", ur: "سنن نسائی 2833 — جو حرام کیا گیا" }
text: "أَخْبَرَنَا زِيَادُ بْنُ أَيُّوبَ، قَالَ حَدَّثَنَا ابْنُ عُلَيَّةَ، قَالَ أَنْبَأَنَا أَيُّوبُ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَجُلٌ يَا رَسُولَ اللَّهِ مَا نَقْتُلُ مِنَ الدَّوَابِّ إِذَا أَحْرَمْنَا قَالَ \" خَمْسٌ لاَ جُنَاحَ عَلَى مَنْ قَتَلَهُنَّ الْحِدَأَةُ وَالْغُرَابُ وَالْفَأْرَةُ وَالْعَقْرَبُ وَالْكَلْبُ الْعَقُورُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2833، يذكر ما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2833 (The Book of Hajj), that mentions what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2833، جس میں جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
