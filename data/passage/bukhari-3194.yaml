label:
  ar: "البخاري 3194 — إن رحمتي سبقت غضبي"
  en: "Bukhari 3194 — My mercy outstrips My anger"
  ur: "بخاری 3194 — میری رحمت میرے غضب پر سبقت لے گئی"
text: "لما قضى الله الخلق كتب في كتابه، فهو عنده فوق العرش إن رحمتي غلبت غضبي ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3194: إن رحمتي سبقت غضبي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3194: My mercy outstrips My anger. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3194: میری رحمت میرے غضب پر سبقت لے گئی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
