label: { ar: "الموطأ 852 — مالك: لا أرى الفدية واجبة، وأحب إلي أن يفعله إذا كان قوياً عليه؛ فمن فدى فإنما يطعم عن كل يوم مداً بمد النبي", en: "Muwatta 852", es: "Muwatta 852", fr: "Muwatta 852", ur: "موطا 852", tr: "El-Muvatta 852 — Malik: Kefareti farz saymıyorum, fakat gücü yetiyorsa yapmasını tercih ederim; dolayısıyla kefareti ödeyen kimse, Peygamberin mudd'una göre her gün bir mudd yemek yemelidir.", id: "Al-Muwatta 852 — Malik: Aku tidak menganggap penebusan dosa itu wajib, tetapi aku lebih suka jika dia melakukannya jika dia mampu; maka siapa pun yang membayar penebusan dosa hendaknya memberi makan setiap hari satu mudd sesuai dengan mudd Nabi." }
summary:
  ar: "قول لمالك: لا أرى ذلك واجباً، وأحب إلي أن يفعله إذا كان قوياً عليه. فمن فدى، فإنما يطعم مكان كل يوم مداً بمد النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (810). {cite:muwatta-maruf-1997 p.413}"
  tr: "Malik şöyle dedi: Bunu zorunlu saymıyorum, fakat eğer gücü yetiyorsa yapmasını tercih ederim. Fidyeyi ödeyen kişi, Peygamberin ölçütüne göre her gün bir kişiye bir mudd (belirli bir ölçüde yiyecek) yedirmelidir. Araştırmacı, bunu Ebu Musab'ın (810) Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.413}"
  id: "Malik berkata: Aku tidak menganggapnya wajib, tetapi aku lebih suka jika dia melakukannya jika dia mampu. Barang siapa membayar tebusan, hendaknya ia memberi makan seseorang dengan satu mudd (ukuran makanan tertentu) untuk setiap hari, sesuai dengan mudd Nabi. Peneliti menyebutkan bahwa Abu Mus'ab (810) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.413}"
