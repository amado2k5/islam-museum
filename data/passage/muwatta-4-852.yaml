summary:
  ar: "قول لمالك: لا أرى ذلك واجباً، وأحب إلي أن يفعله إذا كان قوياً عليه. فمن فدى، فإنما يطعم مكان كل يوم مداً بمد النبي. ويذكر المحقق أنه رواه عن مالك أبو مصعب (810). {cite:muwatta-maruf-1997 p.413}"
