text: "الوزير أبو جعفر بن الزيّات. كان أبوه زيّاتاً، ونشأ هو فقرأ الأدب، وقال الشعر البديع، وتوصّل بالكتابة إلى أن اتصل بالمعتصم، ووَزَرَ له، وللواثق. وكان أديباً بليغاً عالماً باللّغة والنَّحو والشِّعْر. رثى أبا تمّام الطّائيّ. وكان بينه وبين ابن أبي …"
