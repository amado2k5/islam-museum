text: "مقدمة المؤلف باب: إرادته أَن يكتب لأَصحابه كتاباً ثم اختلفوا فلم يكتب. باب: إخراجه شيئاً من المال كان عِنده وعِتْق عبيده. باب: إعلامه ابنته فاطمةا بموته علي له. باب: وصيته بالأَنصارم عند موته. باب: جمعه أَصحابه في بيت عائشة ووصيته …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 65، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
