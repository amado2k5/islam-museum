  tr: "El-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 65. sayfasından, vasiyetname ve ölüm saatiyle ilgili bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. \"Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler\" bölümü tarafından derlenmiştir."
