text: "… إلاَّ أَنْ يُرِيدَ ابْنُ أبي طَالِبِ أَنْ يُطَلِّقَ ابْنَتيِ، ويَنكِحَ ابْنَتَهُم، فإنَّمَا فَاطِمَة بَضْعَةٌ مِنِّي يَرِيبُني ما رَابَها، ويُؤْذِيني ما آذاهَا، إنِّي أَخَافُ أَنْ تُفْتَنَ فَاطِمَةُ في دِينِها، وإني لَسْتُ أُحَرِّمُ حَلاَلاً، ولاَ أُحِلُّ حَراماً، ولكِنْ واللّهِ لا تَجْتَمِعُ بِنْتُ …"
