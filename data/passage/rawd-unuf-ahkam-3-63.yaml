text: "… أى تجاوز عنهم، وَاسْتَغْفِرْ أَهُمْ.ذنوبهم، من قارف من أهل الإيمان منهم وَشَاوِرْهُمْ فى الأمْرِ : أى لتُرِيهم أنك تسمع منهم، وَتَستمين بهم، وإن كنت عائيًا عَنهم، تأأَنَم لمم بذلكَ على بدينهم فإِذَا عَزَمْتْ : أى على أمي جاءك منى وأمر …"
summary:
  ar: "مقطع من الروض الأنف للسهيلي، المجلد المصوَّر 3، ص 63، يرد فيه ذكر اللمم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
