text: "… أى تجاوز عنهم، وَاسْتَغْفِرْ أَهُمْ.ذنوبهم، من قارف من أهل الإيمان منهم وَشَاوِرْهُمْ فى الأمْرِ : أى لتُرِيهم أنك تسمع منهم، وَتَستمين بهم، وإن كنت عائيًا عَنهم، تأأَنَم لمم بذلكَ على بدينهم فإِذَا عَزَمْتْ : أى على أمي جاءك منى وأمر …"
