label: { ar: "الموطأ 939 — مالك: سمع أهل العلم يقولون ليس على النساء رفع الصوت بالتلبية، لتسمع المرأة نفسها", en: "Muwatta 939", es: "Muwatta 939", fr: "Muwatta 939", ur: "موطا 939", tr: "El-Muvatta 939 — Malik: Alimlerin, kadınların Talbiye okurken seslerini yükseltmelerinin gerekmediğini, böylece kendilerinin de duyabileceğini söylediklerini duydum.", id: "Al-Muwatta 939 — Malik: Aku mendengar para ulama mengatakan bahwa wanita tidak diwajibkan untuk meninggikan suara mereka ketika membaca Talbiyah, agar wanita itu sendiri dapat mendengarnya." }
text: "ليس على النساء رفع الصوت بالتلبية، لتسمع المرأة نفسها"
summary:
  ar: "يرويه مالك أنه سمع أهل العلم يقولون: ليس على النساء رفع الصوت بالتلبية، لتسمع المرأة نفسها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1072). {cite:muwatta-maruf-1997 p.450}"
  tr: "Malik, âlimlerin şöyle dediğini duyduğunu aktarmıştır: \"Kadınların Talbiye okurken seslerini yükseltmeleri gerekmez, böylece kadın kendi sesini duyabilir.\" Araştırmacı, bunu Malik'ten Ebu Mus'ab'ın (ö. 1072) rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.450}"
  id: "Malik meriwayatkan bahwa ia mendengar para ulama berkata: Wanita tidak diwajibkan untuk meninggikan suara mereka ketika membaca Talbiyah, agar wanita tersebut dapat mendengar dirinya sendiri. Peneliti menyebutkan bahwa Abu Mus'ab (wafat 1072) meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.450}"
