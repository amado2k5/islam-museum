  id: "Kutipan dari Al-Muwafaqat karya Al-Shatibi, Jilid 2, halaman 340, yang membahas amalan wajib, anjuran, dan halal; dari versi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
