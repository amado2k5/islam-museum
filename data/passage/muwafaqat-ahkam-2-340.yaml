text: "… صارت الأعمال الخارجة عن الحظ دائرة على الأمور العامة. وقد تقدم أن غير الواجب بالجزء يصير واجباً بالكل، وهذا عامل بالكل فيما هو مندوب بالجزء أو مباح يختل النظام باختلاله. فقد صار عاملاً بالوجوب. فأما البناء على المقاصد التابعة فهو …"
summary:
  ar: "مقطع من الموافقات للشاطبي، المجلد المصوَّر 2، ص 340، يرد فيه ذكر الواجب، والوجوب، والمندوب، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shatibi's al-Muwafaqat, scan volume 2, p. 340, whose wording mentions the obligatory (wajib), obligation (wujub), the recommended (mandub), the permitted (mubah); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
