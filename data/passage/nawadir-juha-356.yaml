label: { ar: "نوادر جحا الكبرى، ص 177 — «قولوا للأفندي إذا خرج من البيت أن لا يبقي رأسه في النافذة»", en: "Nawadir Juha al-Kubra, p. 177 — 'Tell the Effendi Not to Leave His Head at the Window When He Goes Out'", ur: "نوادر جحا الکبریٰ، ص 177 — «آفندی سے کہو کہ باہر جائیں تو اپنا سر کھڑکی میں نہ چھوڑیں»", fr: "Nawadir Juha al-Kubra, p. 177 — « Dites à l'effendi de ne pas laisser sa tête à la fenêtre lorsqu'il sort »", es: "Nawadir Juha al-Kubra, p. 177 — «Díganle al efendi que no deje la cabeza en la ventana cuando salga»", tr: "Juha'nın Büyük Fıkraları, s. 177 — “Efendiye, evden çıkarken başını pencereden içeri sokmamasını söyleyin.”", id: "Anekdot Hebat Juha, hlm. 177 — “Beritahu si effendi, ketika dia meninggalkan rumah, agar jangan meninggalkan kepalanya di jendela.”" }
text: "… قولوا للأفندي إذا خرج من البيت أن لا يبقي رأسه في النافذة كان أحد الوجوه يُظهِرُ للشيخ تعظيماً ظاهرياً، ويُبرمُهُ بمجاملاتِهِ المتكلَّفة، فأراد الشيخ يوماً زيارته، وعندما وصل إلى دارهِ، كان ينظرُ من النافذة إلى جهة، فلمَّا رأى الشيخ أنسحب …"
summary:
  ar: "زار جحا وجيهاً يتجنبه بالتظاهر بأنه خارج البيت، فقال جحا للخدم أن يخبروا الوجيه ألا يترك رأسه في النافذة عندما يخرج، حتى لا يظن الناس أنه في البيت. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  en: "Juha visits a notable who avoids him by pretending to be out; Juha tells the servants to tell the notable not to keep his head at the window when he leaves, lest people think he is at home. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  ur: "جحا ایک معزز آدمی سے ملنے گیا جو گھر سے باہر ہونے کا بہانہ کر کے اس سے بچتا تھا، تو جحا نے نوکروں سے کہا کہ معزز آدمی کو بتا دو کہ جب وہ باہر جائے تو اپنا سر کھڑکی میں نہ چھوڑے، ورنہ لوگ سمجھیں گے کہ وہ گھر میں ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  fr: "Juha rend visite à un notable qui l'évite en feignant d'être sorti ; Juha dit aux domestiques de dire au notable de ne pas laisser sa tête à la fenêtre quand il sort, de peur que l'on croie qu'il est chez lui. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  es: "Juha visita a un notable que lo evita fingiendo estar fuera; Juha dice a los criados que digan al notable que no deje la cabeza en la ventana cuando salga, no sea que la gente piense que está en casa. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
  tr: "Juha, evden uzaktaymış gibi yaparak kendisinden kaçınan önemli bir adamı ziyaret etti. Juha, hizmetkarlarına, önemli adama dışarı çıktığında başını pencereden dışarı çıkarmamasını, böylece insanların evde olduğunu düşünmemelerini söylemelerini emretti. {cite:juha-nawadir-kubra-djuwaydi s. 177}"
  id: "Juha mengunjungi seorang pria terhormat yang menghindarinya dengan berpura-pura sedang berada di luar rumah. Juha menyuruh para pelayan untuk memberitahu pria terhormat itu agar tidak menjulurkan kepalanya keluar jendela saat keluar, agar orang-orang tidak mengira dia ada di rumah. {cite:juha-nawadir-kubra-djuwaydi p. 177}"
