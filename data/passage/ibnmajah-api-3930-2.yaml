text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ حَفْصٍ الأُبُلِّيُّ، حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ عَاصِمٍ، عَنِ السُّمَيْطِ، عَنْ عِمْرَانَ بْنِ الْحُصَيْنِ، قَالَ بَعَثَنَا رَسُولُ اللَّهِ ـ فِي سَرِيَّةٍ فَحَمَلَ رَجُلٌ مِنَ الْمُسْلِمِينَ عَلَى رَجُلٍ مِنَ الْمُشْرِكِينَ فَذَكَرَ الْحَدِيثَ وَزَادَ فِيهِ فَنَبَذَتْهُ الأَرْضُ فَأُخْبِرَ النَّبِيُّ ـ وَقَالَ \" إِنَّ الأَرْضَ لَتَقْبَلُ مَنْ هُوَ أَشَرُّ مِنْهُ وَلَكِنَّ اللَّهَ أَحَبَّ أَنْ يُرِيَكُمْ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3930.2، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3930.2 (Tribulations), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3930.2، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
