text: "… قال الشيخ: كان غرماؤه من اليهود، فلهذا لم يضعوا له شيئاً!. ذكر ثناء رسول اللّٰه وقَلِيِ على معاذ ومشيه معه وهو راكب عن أنس قال: قال رسول اللّٰه يم أعلم أمتي بالحلال والحرام معاذ بن جبل. رواه الإمام أحمد. وعن …"
