text: "… ثم سين مهملة. - باب بَيَانِ أرْكَانِ الإِسْلامِ وَدَعَائِمِهِ الْعِظَامِ - حَدَّثْنَا مُحَمَدُ أبْنُ عَبْدِ اللَّهِ أبْن نَمَيْر الْهَمْدَانِي حَدَّثَنَا أبو خَالِدٍ يَعْنِي سُلَيْمَانَ أَبْنَ حَيْانَ الأحْمَرَ عَنْ أَبِي مَالِكِ الأشْجَعِيّ، عَنْ سَعْدٍ ابْنِ عُبْيْدَةً. اللّه ا بالإسكان والمهملة. الصورة. …"
