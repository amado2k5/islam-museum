label: { ar: "الموطأ 1876 — مالك: من أسلف في طعام بسعر معلوم إلى أجل، فحل الأجل فلم يجد عند البائع وفاء، فأقاله: لا ينبغي أن يأخذ إلا ورقه أو ذهبه الذي دفع، ولا يشتري بذلك الثمن شيئا حتى يقبضه", en: "Muwatta 1876" }
summary:
  ar: "قال مالك: الأمر عندنا فيمن أسلف في طعام بسعر معلوم إلى أجل مسمى، فحل الأجل، فلم يجد المبتاع عند البائع وفاء مما ابتاع منه، فأقاله: فإنه لا ينبغي أن يأخذ منه إلا ورقه أو ذهبه، أو الثمن الذي دفع إليه بعينه، وإنه لا يشتري منه بذلك الثمن شيئا حتى يقبضه منه. وذلك أنه إذا أخذ غير الثمن الذي دفع إليه، أو صرفه في سلعة غير الطعام الذي ابتاع منه، فهو بيع الطعام قبل أن يستوفى. قال مالك: وقد نهى رسول الله عن بيع الطعام قبل أن يستوفى. {cite:muwatta-maruf-1997 p.171}"
