label: { ar: "الموطأ 1876 — مالك: من أسلف في طعام بسعر معلوم إلى أجل، فحل الأجل فلم يجد عند البائع وفاء، فأقاله: لا ينبغي أن يأخذ إلا ورقه أو ذهبه الذي دفع، ولا يشتري بذلك الثمن شيئا حتى يقبضه", en: "Muwatta 1876", es: "Muwatta 1876", fr: "Muwatta 1876", ur: "موطا 1876", tr: "El-Muvatta 1876 — Malik: Bir kimse belirli bir süre için bilinen bir fiyata yiyecek ödünç verirse ve süre dolduğunda satıcı ödeme yapamaz ve satışı iptal ederse: yalnızca ödediği kağıdı veya altını geri almalı ve parayı alana kadar onunla hiçbir şey satın almamalıdır.", id: "Al-Muwatta 1876 — Malik: Jika seseorang meminjamkan makanan dengan harga yang diketahui untuk jangka waktu tertentu, dan jangka waktu tersebut berakhir tetapi penjual tidak dapat membayar, dan dia membatalkan penjualan: dia hanya boleh mengambil kembali uang kertas atau emas yang telah dibayarkannya, dan dia tidak boleh membeli apa pun dengan uang itu sampai dia menerimanya." }
summary:
  ar: "قال مالك: الأمر عندنا فيمن أسلف في طعام بسعر معلوم إلى أجل مسمى، فحل الأجل، فلم يجد المبتاع عند البائع وفاء مما ابتاع منه، فأقاله: فإنه لا ينبغي أن يأخذ منه إلا ورقه أو ذهبه، أو الثمن الذي دفع إليه بعينه، وإنه لا يشتري منه بذلك الثمن شيئا حتى يقبضه منه. وذلك أنه إذا أخذ غير الثمن الذي دفع إليه، أو صرفه في سلعة غير الطعام الذي ابتاع منه، فهو بيع الطعام قبل أن يستوفى. قال مالك: وقد نهى رسول الله عن بيع الطعام قبل أن يستوفى. {cite:muwatta-maruf-1997 p.171}"
  id: "Malik berkata: Hukum kami adalah jika seseorang meminjamkan makanan dengan harga yang diketahui untuk jangka waktu tertentu, dan jangka waktu tersebut berakhir, tetapi pembeli mendapati penjual tidak mampu memenuhi kewajibannya, dan ia membatalkan pinjaman tersebut, maka ia hanya boleh mengambil kembali pembayaran awal dalam bentuk uang tunai atau emas, atau harga yang tepat yang dibayarkannya. Ia tidak boleh membeli apa pun lagi dari penjual dengan harga tersebut sampai ia menerimanya. Ini karena jika ia mengambil sesuatu selain harga awal, atau membelanjakannya untuk sesuatu selain makanan yang dibelinya, maka itu dianggap menjual makanan sebelum diterima. Malik berkata: Rasulullah shalla Allahu alaihi wa sallam melarang menjual makanan sebelum diterima. {kutipan:muwatta-maruf-1997 hlm. 171}"
