ref: "3057"
label:
  ar: "ابن ماجه 3057 — فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك"
  en: "Ibn Majah 3057 — I will say: O Lord, my companions; and it will be said: you do not know what they did after you"
  ur: "ابن ماجہ 3057 — میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
  es: "Ibn Majah 3057 — Diré: ¡Oh Señor, mis compañeros!; y se dirá: No sabes lo que hicieron después de ti."
  fr: "Ibn Majah 3057 — Je dirai: « Ô Seigneur, mes compagnons ! » et il me sera répondu: « Tu ne sais pas ce qu’ils ont fait après toi. »"
  tr: "İbn Majah 3057 — “Ey Rabbim, arkadaşlarım!” diyeceğim. O da, “Sen onların senden sonra ne yaptıklarını bilmiyorsun” diyecek."
  id: "Ibn Majah 3057 — Aku akan berkata, “Ya Tuhan, sahabat-sahabatku!” Dia akan berkata, “Kamu tidak tahu apa yang mereka lakukan setelahmu.”"
text: "إني فرطكم على الحوض وأكاثر بكم الأمم فلا تسودوا وجهي إني مستنقذ أناسا ومستنقذ مني أناس فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك …"
summary:
  ar: "حديث قدسي في ابن ماجه، رقم 3057: فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Ibn Majah, no. 3057: I will say: O Lord, my companions; and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ابن ماجہ میں حدیثِ قدسی، نمبر 3057: میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi de Ibn Majah, n.º 3057: Diré: «¡Oh Señor, mis compañeros!»; y se dirá: «No sabes lo que hicieron después de ti». El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi rapporté par Ibn Majah (n° 3057): Je dirai: « Ô Seigneur, mes compagnons ! » Et il sera répondu: « Tu ne sais pas ce qu'ils ont fait après toi. » Le Prophète le rapporte de son Seigneur. Le navigateur de hadiths qudsi rassemble les narrations issues des six livres et de la Muwatta."
  tr: "İbn Majah'ın 3057 numaralı hadisinde şöyle denmektedir: “Ben, ‘Ey Rabbim, arkadaşlarım!’ diyeceğim. O da, ‘Sen onların senden sonra ne yaptıklarını bilmiyorsun’ diyecek.” Peygamberimiz bunu Rabbinden rivayet etmiş olup, hadis-i kudsiyi inceleyenler bu rivayeti altı şeriat hadis külliyatında ve Muvatta'da bulacaklardır."
  id: "Sebuah hadits qudsi dalam Ibnu Majah, no. 3057: “Aku akan berkata, ‘Ya Tuhan, sahabat-sahabatku!’ Dia akan berkata, ‘Kamu tidak mengetahui apa yang mereka lakukan setelahmu.’” Nabi meriwayatkannya dari Tuhannya, dan mereka yang mempelajari hadits qudsi akan menemukan riwayatnya dalam enam kumpulan hadits kanonik dan Al-Muwatta."
