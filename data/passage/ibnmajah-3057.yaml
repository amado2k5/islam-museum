label:
  ar: "ابن ماجه 3057 — فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك"
  en: "Ibn Majah 3057 — I will say: O Lord, my companions; and it will be said: you do not know what they did after you"
  ur: "ابن ماجہ 3057 — میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا"
text: "إني فرطكم على الحوض وأكاثر بكم الأمم فلا تسودوا وجهي إني مستنقذ أناسا ومستنقذ مني أناس فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك …"
summary:
  ar: "حديث قدسي في ابن ماجه، رقم 3057: فأقول يا رب أصيحابي فيقول إنك لا تدري ما أحدثوا بعدك. يرويه النبي عن ربه، ومتصفح الأحاديث القدسية يجمع رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Ibn Majah, no. 3057: I will say: O Lord, my companions; and it will be said: you do not know what they did after you. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "ابن ماجہ میں حدیثِ قدسی، نمبر 3057: میں کہوں گا: اے رب میرے ساتھی، اور کہا جائے گا: تم نہیں جانتے انہوں نے تمہارے بعد کیا کیا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
