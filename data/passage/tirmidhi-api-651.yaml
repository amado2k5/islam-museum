label: { ar: "جامع الترمذي 651 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 651 — what was made lawful; what is not lawful", ur: "جامع ترمذی 651 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 651 — lo que se ha hecho lícito; lo que no es lícito", fr: "Jami' al-Tirmidhi 651 — ce qui a été rendu licite; ce qui ne l'est pas", tr: "Cami' el-Tirmizi 651 — Neler caizdir, neler caiz değildir", id: "Jami' al-Tirmidhi 651 — Apa yang diperbolehkan, apa yang tidak diperbolehkan" }
text: "… بَعْضِ أَصْحَابِنَا وَبِهِ يَقُولُ الثَّوْرِيُّ وَعَبْدُ اللَّهِ بْنُ الْمُبَارَكِ وَأَحْمَدُ وَإِسْحَاقُ. قَالُوا إِذَا كَانَ عِنْدَ الرَّجُلِ خَمْسُونَ دِرْهَمًا لَمْ تَحِلَّ لَهُ الصَّدَقَةُ. قَالَ وَلَمْ يَذْهَبْ بَعْضُ أَهْلِ الْعِلْمِ إِلَى حَدِيثِ حَكِيمِ بْنِ جُبَيْرٍ وَوَسَّعُوا فِي هَذَا وَقَالُوا إِذَا كَانَ عِنْدَهُ خَمْسُونَ دِرْهَمًا أَوْ أَكْثَرُ وَهُوَ مُحْتَاجٌ فَلَهُ أَنْ يَأْخُذَ مِنَ الزَّكَاةِ وَهُوَ قَوْلُ الشَّافِعِيِّ وَغَيْرِهِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 651، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 651 (The Book on Zakat), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 651، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 651 (El Libro del Zakat), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 651 (Le Livre de la Zakat), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui ne l'est pas."
  tr: "Cami' el-Tirmizi'nin 651 numaralı hadisinde helal ve haram olan şeyler belirtilmiştir. \"Helal ve Haram\" adlı kitabın bu bölümü, helal ve haram olan şeylerle ilgili olarak Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin sözlerinden derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 651, menyebutkan apa yang diperbolehkan dan apa yang tidak. Bagian buku \"Halal dan Haram\" ini menyusunnya dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan ucapan para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang diharamkan."
