label: { ar: "الموطأ 1170 — ابن عمر: من نذر بدنة يقلدها نعلين ويشعرها، وينحرها عند البيت أو بمنى يوم النحر", en: "Muwatta 1170", es: "Muwatta 1170", fr: "Muwatta 1170", ur: "موطا 1170", tr: "İbn Ömer, El-Muvatta 1170: Deve kurban etmeye adak adayan kimse, deveyi iki sandaletle süsleyip işaretlemeli ve Kurban Bayramı günü Kâbe'de veya Mina'da kesmelidir.", id: "Al-Muwatta 1170 — Ibn Umar: Barangsiapa yang bernazar untuk menyembelih unta, hendaklah ia menghiasinya dengan dua sandal dan memberi tanda padanya, lalu menyembelihnya di Ka'bah atau di Mina pada Hari Raya Kurban." }
summary:
  ar: "يقول عبد الله بن عمر إن من نذر بدنة قلدها نعلين وأشعرها، ثم نحرها عند البيت أو بمنى يوم النحر، وليس لها محل دون ذلك. ومن نذر جزورا من الإبل أو البقر فلينحرها حيث شاء. {cite:muwatta-maruf-1997 p.529}"
  tr: "Abdullah ibn Umar şöyle demiştir: \"Kim bir deve kurban etmeye adak adak ederse, deveyi iki sandaletle süsleyip işaretlesin, sonra da Kurban Bayramı günü Kâbe'de veya Mina'da kessin; başka bir yeri yoktur. Kim deve veya sığır kurban etmeye adak adak ederse, dilediği yerde kesebilir.\" {cite:muwatta-maruf-1997 s.529}"
  id: "Abdullah ibn Umar berkata bahwa siapa pun yang bernazar untuk mengorbankan unta hendaknya menghiasinya dengan dua sandal dan menandainya, kemudian menyembelihnya di Ka'bah atau di Mina pada Hari Raya Kurban; tidak ada tempat lain untuknya. Dan siapa pun yang bernazar untuk mengorbankan unta atau sapi boleh menyembelihnya di mana pun ia kehendaki. {cite:muwatta-maruf-1997 p.529}"
