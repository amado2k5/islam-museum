summary:
  ar: "يروي مالك عن يونس بن يوسف عن عطاء بن يسار عن أبي أيوب الأنصاري أنه وجد غلمانا قد ألجؤوا ثعلبا إلى زاوية، فطردهم عنه. قال مالك: لا أعلم إلا أنه قال: أفي حرم رسول الله يصنع هذا؟ {cite:muwatta-maruf-1997 p.468}"
