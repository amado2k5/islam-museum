label: { ar: "الموطأ 2601 — أبو أيوب الأنصاري: غلمان ألجؤوا ثعلبا إلى زاوية فطردهم عنه", en: "Muwatta 2601", es: "Muwatta 2601", fr: "Muwatta 2601", ur: "موطا 2601", tr: "El-Muvatta 2601 — Ebu Eyyub el-Ensari: Bazı çocuklar bir tilkiyi köşeye sıkıştırdılar, tilki de onları uzaklaştırdı.", id: "Al-Muwatta 2601 — Abu Ayyub al-Ansari: Beberapa anak laki-laki memojokkan seekor rubah, lalu rubah itu mengusir mereka." }
summary:
  ar: "يروي مالك عن يونس بن يوسف عن عطاء بن يسار عن أبي أيوب الأنصاري أنه وجد غلمانا قد ألجؤوا ثعلبا إلى زاوية، فطردهم عنه. قال مالك: لا أعلم إلا أنه قال: أفي حرم رسول الله يصنع هذا؟ {cite:muwatta-maruf-1997 p.468}"
  tr: "Malik, Yunus ibn Yusuf'tan, o da Ata ibn Yasar'dan, o da Ebu Eyyub el-Ensari'den rivayet eder ki, bir tilkiyi köşeye sıkıştırmış birkaç çocuk bulmuş ve onları kovmuştur. Malik şöyle demiştir: Ben sadece şunu söylediğini biliyorum: Bu, Allah'ın Resulü'nün türbesinde mi yapılıyor? {cite:muwatta-maruf-1997 s.468}"
  id: "Malik meriwayatkan dari Yunus bin Yusuf, dari Ata bin Yasar, dari Abu Ayyub al-Ansari, bahwa ia mendapati beberapa anak laki-laki yang telah mengurung seekor rubah, lalu ia mengusir mereka. Malik berkata: Aku hanya tahu bahwa ia berkata: Apakah ini dilakukan di tempat suci Rasulullah? {cite:muwatta-maruf-1997 p.468}"
