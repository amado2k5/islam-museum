label: { ar: "الموطأ 1827 — يحيى عن مالك عن نافع عن ابن عمر: نهى رسول الله عن المزابنة، وهي بيع الثمر بالتمر كيلا، وبيع الكرم بالزبيب كيلا", en: "Muwatta 1827", es: "Muwatta 1827", fr: "Muwatta 1827", ur: "موطا 1827", tr: "El-Muvatta 1827 — Yahya, Malik'ten, o da Nafi'den, o da İbn Umar'dan rivayetle: Allah Resulü, olgunlaşmamış hurmaların ölçüyle kuru hurma olarak satılmasını ve üzümlerin ölçüyle kuru üzüm olarak satılmasını yasaklamıştır.", id: "Al-Muwatta 1827 — Yahya berdasarkan riwayat Malik berdasarkan riwayat Nafi’ berdasarkan riwayat Ibn Umar: Rasulullah SAW melarang al-Muzabana, yaitu jual beli kurma mentah dengan kurma kering dengan takaran, dan jual beli anggur dengan kismis dengan takaran." }
summary:
  ar: "يروي يحيى عن مالك عن نافع عن عبد الله بن عمر أن رسول الله نهى عن المزابنة. والمزابنة: بيع الثمر بالتمر كيلا، وبيع الكرم بالزبيب كيلا. {cite:muwatta-maruf-1997 p.148}"
  tr: "Yahya, Malik'ten, o da Nafi'den, o da Abdullah ibn Umar'dan rivayetle, Allah Resulü'nün muzabana uygulamasını yasakladığını nakde çevirmiştir. Muzabana, olgunlaşmamış hurmaların ölçüyle kuru hurma karşılığında satılması ve üzümlerin ölçüyle kuru üzüm karşılığında satılmasıdır. {cite:muwatta-maruf-1997 s.148}"
  id: "Yahya meriwayatkan dari Malik, dari Nafi', dari Abdullah ibn Umar, bahwa Rasulullah SAW melarang praktik muzabana. Muzabana adalah penjualan kurma mentah dengan kurma kering dengan takaran, dan penjualan anggur dengan kismis dengan takaran. {cite:muwatta-maruf-1997 p.148}"
