label: { ar: "الموطأ 773 — ابن عمر: فرض النبي زكاة الفطر من رمضان صاعاً من تمر أو صاعاً من شعير على كل حر أو عبد ذكر أو أنثى من المسلمين", en: "Muwatta 773" }
text: "فرض زكاة الفطر من رمضان على الناس صاعاً من تمر، أو صاعاً من شعير، على كل حر أو عبد، ذكر أو أنثى، من المسلمين"
summary:
  ar: "أول حديث في باب مكيلة زكاة الفطر. يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي فرض زكاة الفطر من رمضان على الناس صاعاً من تمر أو صاعاً من شعير، على كل حر أو عبد، ذكر أو أنثى، من المسلمين. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (3301) والبغوي، وخالد بن مخلد عند الدارمي، والقعنبي عند مسلم (3/68) وأبي داود، وابن وهب عند ابن خزيمة، والتنيسي عند البخاري (1504)، وابن القاسم عند النسائي (5/48)، وابن مهدي عند أحمد وابن ماجة (1826)، وقتيبة عند مسلم والنسائي، والشافعي، ومعن عند الترمذي (676)، ويحيى بن يحيى النيسابوري عند مسلم، وأن الترمذي قال إن مالكاً زاد «من المسلمين» ولم يذكرها غير واحد عن نافع، ويرد المحقق بأن عبيد الله بن عمر وكثير بن فرقد ويونس بن يزيد وعمر بن نافع (البخاري 1503) والمعلى بن إسماعيل تابعوا مالكاً على هذه الزيادة. {cite:muwatta-maruf-1997 p.381} {cite:muwatta-maruf-1997 p.382}"
