label: { ar: "الموطأ 773 — ابن عمر: فرض النبي زكاة الفطر من رمضان صاعاً من تمر أو صاعاً من شعير على كل حر أو عبد ذكر أو أنثى من المسلمين", en: "Muwatta 773", es: "Muwatta 773", fr: "Muwatta 773", ur: "موطا 773", id: "Al-Muwatta 773 — Ibn Umar: Nabi (shalawat dan salam kepadanya) mewajibkan Zakat al-Fitr di bulan Ramadan, satu sa’ kurma atau satu sa’ jelai, bagi setiap orang merdeka atau budak, laki-laki atau perempuan, di antara umat Islam." }
text: "فرض زكاة الفطر من رمضان على الناس صاعاً من تمر، أو صاعاً من شعير، على كل حر أو عبد، ذكر أو أنثى، من المسلمين"
summary:
  ar: "أول حديث في باب مكيلة زكاة الفطر. يرويه مالك عن نافع عن عبد الله بن عمر، أن النبي فرض زكاة الفطر من رمضان على الناس صاعاً من تمر أو صاعاً من شعير، على كل حر أو عبد، ذكر أو أنثى، من المسلمين. ويذكر المحقق أنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان (3301) والبغوي، وخالد بن مخلد عند الدارمي، والقعنبي عند مسلم (3/68) وأبي داود، وابن وهب عند ابن خزيمة، والتنيسي عند البخاري (1504)، وابن القاسم عند النسائي (5/48)، وابن مهدي عند أحمد وابن ماجة (1826)، وقتيبة عند مسلم والنسائي، والشافعي، ومعن عند الترمذي (676)، ويحيى بن يحيى النيسابوري عند مسلم، وأن الترمذي قال إن مالكاً زاد «من المسلمين» ولم يذكرها غير واحد عن نافع، ويرد المحقق بأن عبيد الله بن عمر وكثير بن فرقد ويونس بن يزيد وعمر بن نافع ⁦(البخاري 1503)⁩ والمعلى بن إسماعيل تابعوا مالكاً على هذه الزيادة. {cite:muwatta-maruf-1997 p.381} {cite:muwatta-maruf-1997 p.382}"
  tr: "Zekâtü'l-Fitr'in ölçüsü hakkındaki bölümün ilk hadisi, Malik'in Nafi'den, o da Abdullah bin Umar'dan rivayet ettiğine göre, Peygamberimiz Ramazan ayında her hür veya köle, erkek veya kadın için bir sa' hurma veya bir sa' arpa zekâtını farz kılmıştır. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab tarafından, onun aracılığıyla da İbn Hibban (3301), el-Baghawi, el-Darimi'ye göre Halid ibn Makhlad, Müslim'e göre el-Ka'nabi (3/68), Ebu Davud, İbn Huzeyme'ye göre İbn Vahb, Buhari'ye göre el-Tunisi (1504), el-Nesai'ye göre İbn el-Kâsim (5/48), Ahmed ve İbn Majah'a göre İbn Mehdi (1826), Müslim ve el-Nesai'ye göre Kuteybe, el-Şafiî, Tirmizi'ye göre Ma'n (676) ve Müslim'e göre Yahya ibn Yahya el-Neysaburi tarafından rivayet edildiğini belirtmektedir. Tirmizi, Malik'in \"Müslümanlardan\" diye eklediğini ve sadece bir başka kişinin daha bunu Nafi'den rivayet ettiğini belirtmiştir. Araştırmacı, Ubeydullah ibn 'Ömer, Kesir ibn Farkad, Yunus ibn Yezid, 'Ömer ibn Nafi' (el-Buhari 1503) ve el-Mu'alla ibn İsmail'in bu eklemede Malik'i takip ettiği şeklinde yanıt verir. {cite:muwatta-maruf-1997 s.381} {cite:muwatta-maruf-1997 s.382}"
  id: "Hadits pertama dalam bab tentang ukuran Zakat Fitrah. Diriwayatkan oleh Malik dari Nafi' dari Abdullah bin Umar, bahwa Nabi mewajibkan Zakat Fitrah kepada orang-orang di bulan Ramadhan, yaitu satu sa' kurma atau satu sa' jelai, bagi setiap orang merdeka maupun budak, laki-laki maupun perempuan, dari kalangan Muslim. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban (3301), al-Baghawi, Khalid ibn Makhlad menurut al-Darimi, al-Qa'nabi menurut Muslim (3/68) dan Abu Dawud, Ibn Wahb menurut Ibn Khuzaymah, al-Tunisi menurut al-Bukhari (1504), Ibn al-Qasim menurut al-Nasa'i (5/48), Ibn Mahdi menurut Ahmad dan Ibn Majah (1826), Qutaybah menurut Muslim dan al-Nasa'i, al-Shafi'i, Ma'n menurut al-Tirmidhi (676), dan Yahya ibn Yahya al-Naysaburi menurut Muslim. Al-Tirmidhi menyatakan bahwa Malik menambahkan \"dari kaum Muslimin,\" dan hanya satu orang lagi yang meriwayatkannya dari Nafi'. Peneliti menjawab bahwa 'Ubayd Allah ibn 'Umar, Kathir ibn Farqad, Yunus ibn Yazid, 'Umar ibn Nafi' (al-Bukhari 1503), dan al-Mu'alla ibn Isma'il semuanya mengikuti Malik dalam penambahan ini. {kutip:muwatta-maruf-1997 hal.381} {kutip:muwatta-maruf-1997 hal.382}"
