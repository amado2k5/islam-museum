text: |-
  ⁦(فصل الضاد)⁩
  ٢٥١٠
  والضرة لحمة الضرع يقال ضرة شكرى أى ملاى من اللبن والضرة أيضا المال السكثير
  والمضر الذى تروح عليه ضرة من المال قال الاشعر ا رقبان الاسدى جاهلى
  يحسبك فى القوم أن يعلوا • بأنك فيهم غىّ مضر
  وضرة الابهام اللحمة التى تحتهادهى التى تقابل الالية فى السكف والضرتان حجر الرى وضرة:
  المرأة امرأة ذوجها والضر بالكسر تزوج المرأة على ضرة يقال تكمت فلانة على ضر
  أى على امرأة كأنت قبلها وحكى أبو عبدالقه الطوال تزوحت المرأة على ضر وضر بالكسر
  والضم والبأساء والضراء الشده وهما اسمان مؤنشان من غيرتذكير قال الفزاءلوججعاعلى
  أبوس وأضر كما تجمع النعماء بمعنى النعمة على أنهم لحاز والضر بالضم الهزال و-و الحال
  والمضرة خلاف المنفعة والضرار المضارة ومكان ذوضراراى ضيق عن أبى عبيد ويقال
  لا ضرر عليت ولاضارورة ولا تضرة ورحسل ذوضارورة وضرورة أى ذوحاجة وقد اضطر
  الى الشئ أَى ألجى اليه قال الشاعر
  أثيي أخاضارورة أصفق العدى * عليه وقلت فى الصديق أواصره
  ورجل ضرير بين الضرارة أى ذاهب البصر والضرائر المحاويج والضرير حرف الوادى يقال
  نزل فلان على أحد ضريرى الوادى أى على أحدجانبيه قال أوس بن حجر
  وماخليج من المرّوت ذوشعب • يرمى الضر يرمخشب الطلح والضال
  والضرير النفس وبقية الجسم قال الهجاج حامى الهياهرس الضرير وانه لذوضرير
  على الشي اذا كان ذاصبر عليه ومقاساه قال جرير
  من كل جرشعة المواجو زادها • بعد المفاوزجرأة وضريرا
  قال ناقة ذات ضر يراذا كانت شديدة النفس اطمئة اللغوب قال آبو عمروالضريرمن
  الدواب الصبور على كل شيء والضرير المضارة وأكثرما يستعمل فى الغيرة يقمال ما أشة
  ضريره عليها وأضر بى فلان أى دنامنى دنواشديدا قال الشاعرابن عنمة
  لام الارض ويل ما أجنت * يحيث أضر بالحسن السبيل
  وفى الحديث لاتضارون فى رؤيته وبعضهم:قول لا تضارون بفتح التاءأى لا تضامون
  وسحاب مضر أى مسف وأضر الفرس على فاس اللبام أى أزم عليه مئسل أضز بالزاى وأضر
  يعدواذا أسرع بعض الاسراع حكاهما أبو عبيد والاضرار أن يتزوج الرجل على ضرة عن
  الاصحى قال ومنه قيل رجل مضر وامى أقمضرأ يضالهاضرائر ⁦( ضطر)⁩ الضيطر
  الرجل الفخم الذى لاغما عنده وكذلك الضوطر والضوطرى وقال جربر
  تعدّون عقر التيب أفضل مجدكم • بن ضوطرى لولا الكمىّ المقنعا
  يريدهلا الكمى وكذلك الضيطا روابمع الضيطارون وقال الشاعر
  تعرّض ضيطاروفعالة دوتا • وماخير ضيطاريقلب مسطحا
  يقول تعرّض لناهؤلا« القوم ليقا تلونا وليسوابشئ لانه لاسلاح معهم سوى المسطح وفعالة
  كتاية عن خزاعة وكذلك الضياطرة مثل بيطاروبياطرة وأنشد الاخفش نفداش بن زهير
  وتلحق خيسل لاهوادة بينها • وتشق الماح بالضياطرة الجر
