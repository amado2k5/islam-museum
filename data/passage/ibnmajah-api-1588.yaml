text: "… زَيْدٍ، قَالَ كَانَ ابْنٌ لِبَعْضِ بَنَاتِ رَسُولِ اللَّهِ ـ يَقْضِي فَأَرْسَلَتْ إِلَيْهِ أَنْ يَأْتِيَهَا فَأَرْسَلَ إِلَيْهَا أَنَّ \" لِلَّهِ مَا أَخَذَ وَلَهُ مَا أَعْطَى وَكُلُّ شَىْءٍ عِنْدَهُ إِلَى أَجَلٍ مُسَمًّى فَلْتَصْبِرْ وَلْتَحْتَسِبْ \". فَأَرْسَلَتْ إِلَيْهِ فَأَقْسَمَتْ عَلَيْهِ فَقَامَ رَسُولُ اللَّهِ ـ وَقُمْتُ مَعَهُ وَمَعَهُ مُعَاذُ بْنُ جَبَلٍ وَأُبَىُّ بْنُ كَعْبٍ وَعُبَادَةُ بْنُ الصَّامِتِ فَلَمَّا دَخَلْنَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1588، فيه تعزية ومواساة وصبر عند المصيبة. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1588 (Chapters Regarding Funerals), that carries condolence, consolation and patience at a loss. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1588، جس میں تعزیت، تسلی اور مصیبت پر صبر ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Ibn Majah, n° 1588, qui contient des condoléances, une consolation et la patience devant la perte. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Ibn Majah, n.º 1588, que contiene condolencias, consuelo y paciencia ante la pérdida. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "İbn Majah'ın Sünen'inde yer alan 1588 numaralı hadis, musibet karşısında taziye, teselli ve sabır sunmaktadır. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü mersiye ve ağıtlardan bazılarını bir araya getirmektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1588, menyampaikan belasungkawa, penghiburan, dan kesabaran dalam menghadapi musibah. Koleksi ini menyusun beberapa elegi dan ratapan paling terkenal, bersama dengan teks dari Al-Quran, Sunnah, biografi Nabi, kisah para Sahabat dan Penerus mereka, serta buku-buku relevan lainnya."
