text: "… الاختلاف عليه، لأنه جنة للمصلين، ولا اختلاف أكثر من عدم متابعته فى أركان الصلاة. ويؤيد هذا أن النى جعل اتباع الامام فى الجلوس- إذا صلى جالساً : من طاعة الأئمة الواجبة دائما، إذ هى من طاعة اللّٰه، فقد روى الطبالسى …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 373، يرد فيه ذكر طاعة الله ورسوله، والواجب، والطاعة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 373, whose wording mentions obedience to God and His Messenger, the obligatory (wajib), obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 373 کا اقتباس جس میں اللہ اور اس کے رسول کی اطاعت، واجب، اطاعت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 373, dont le texte mentionne l'obéissance à Dieu et à Son Messager, l'obligatoire (wajib), l'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 373, cuyo texto menciona la obediencia a Dios y a Su Mensajero, lo obligatorio (wajib), la obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 373. sayfasından bir alıntı, Allah'a ve Resulüne itaati ve görev ile itaat kavramlarını ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz fiiller, görevler, itaat fiilleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 373, menyebutkan ketaatan kepada Allah dan Rasul-Nya, serta konsep kewajiban dan ketaatan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus mengurutkan perbuatan wajib, kewajiban, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
