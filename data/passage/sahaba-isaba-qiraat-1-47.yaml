text: "… كما أمره الله.. وكان يرسل بَعْثات القرّاء إلى كل بلد يعلّمون أهلها كتاب اللّٰه.. قال عُبَادَةُ بْنُ الصَّامِتِ: كان الرّجل إذا هاجر دفعه النبي في إلى رجل منا يعلّمه القرآن. سادسها: القداسة التي امتاز بها كتاب اللّٰه عن كل ما …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 47، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 47, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 47 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 1, pág. 47, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
