summary:
  ar: "مقطع من كتاب الإيمان لابن تيمية، المجلد المصوَّر 1، ص 15، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
