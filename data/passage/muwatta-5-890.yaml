label: { ar: "الموطأ 890 — أبو سعيد الخدري: كان رسول الله يعتكف العشر الوسط من رمضان، فاعتكف عاماً، فلما كانت ليلة إحدى وعشرين قال: من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أُنسيتها", en: "Muwatta 890", es: "Muwatta 890", fr: "Muwatta 890", ur: "موطا 890", tr: "El-Muvatta 890 — Ebu Said El-Hudri: Allah Resulü Ramazan ayının orta on gününde itikaf yapardı. Bir yıl itikaf yaptı ve yirmi birinci gecesinde şöyle buyurdu: \"Benimle itikaf yapacak olan, itikafı son on günde yapsın.\" Ben bu geceyi gördüm, sonra unutturuldu.", id: "Al-Muwatta 890 — Abu Saeed Al-Khudri: Rasulullah SAW biasa melakukan i'tikaf pada sepuluh hari pertengahan bulan Ramadhan. Suatu tahun, beliau melakukan i'tikaf, dan pada malam tanggal dua puluh satu, beliau bersabda: Barang siapa yang melakukan i'tikaf bersamaku, hendaknya ia melakukannya pada sepuluh hari terakhir. Aku melihat malam itu, lalu aku dilupakan." }
text: "من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أنسيتها، وقد رأيتني أسجد من صبحها في ماء وطين، فالتمسوها في العشر الأواخر، والتمسوها في كل وتر"
summary:
  ar: "أول حديث في باب ما جاء في ليلة القدر. يرويه زياد عن مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم بن الحارث التيمي عن أبي سلمة بن عبد الرحمن عن أبي سعيد الخدري، أن رسول الله كان يعتكف العشر الوسط من رمضان، فاعتكف عاماً، حتى كانت ليلة إحدى وعشرين، وهي الليلة التي يخرج فيها من صبيحتها من اعتكافه، فقال: من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أُنسيتها، وقد رأيتني أسجد من صبيحتها في ماء وطين، فالتمسوها في العشر الأواخر والتمسوها في كل وتر. فمطرت السماء تلك الليلة وكان المسجد على عريش فوكف، فأبصرت عيناه أثر الماء والطين على جبهته وأنفه من صبح ليلة إحدى وعشرين. ويذكر المحقق أن الحديث مرسل عند مالك، وأنه موصول في الصحيحين وغيرهما من طريق هشام بن عروة عن أبيه عن عائشة، وأن الترمذي عدّد من رواه عن عمر وأبي وجابر بن سمرة وغيرهم. {cite:muwatta-maruf-1997 p.427} {cite:muwatta-maruf-1997 p.428}"
  id: "Hadits pertama dalam bab ini membahas tentang Laylat al-Qadr (Malam Ketetapan). Diriwayatkan oleh Ziyad dari Malik, dari Yazid ibn Abdullah ibn al-Had, dari Muhammad ibn Ibrahim ibn al-Harith al-Taymi, dari Abu Salamah ibn Abd al-Rahman, dari Abu Sa'id al-Khudri, bahwa Rasulullah shalla Allahu alaihi wa sallam biasa melakukan i'tikaf (pengasingan di masjid) selama sepuluh hari pertengahan bulan Ramadhan. Suatu tahun, beliau melakukan i'tikaf hingga malam ke-21, yaitu malam di mana beliau mengakhiri i'tikafnya keesokan paginya. Beliau bersabda, \"Siapa pun yang melakukan i'tikaf bersamaku hendaknya melakukannya pada sepuluh hari terakhir. Aku melihat malam ini, tetapi kemudian aku dilupakan. Aku melihat diriku sujud di air dan lumpur keesokan paginya. Maka carilah i'tikaf pada sepuluh hari terakhir dan carilah pada setiap malam ganjil.\" Malam itu hujan turun, dan masjid itu terbuat dari pelepah kurma, sehingga bocor. Keesokan paginya, pada malam ke-21, matanya melihat jejak air dan lumpur di dahi dan hidungnya. Peneliti menyebutkan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang) menurut Malik, dan bahwa hadits ini terhubung dalam dua kitab Sahih (Bukhari dan Muslim) dan koleksi lainnya melalui rantai periwayatan Hisham ibn Urwah, dari ayahnya, dari Aisyah. Al-Tirmidhi mencantumkan para perawi hadits ini dari Umar, Abu, Jabir ibn Samurah, dan lainnya. {cite:muwatta-maruf-1997 p.427} {cite:muwatta-maruf-1997 p.428}"
