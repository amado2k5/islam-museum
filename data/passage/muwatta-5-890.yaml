label: { ar: "الموطأ 890 — أبو سعيد الخدري: كان رسول الله يعتكف العشر الوسط من رمضان، فاعتكف عاماً، فلما كانت ليلة إحدى وعشرين قال: من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أُنسيتها", en: "Muwatta 890" }
text: "من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أنسيتها، وقد رأيتني أسجد من صبحها في ماء وطين، فالتمسوها في العشر الأواخر، والتمسوها في كل وتر"
summary:
  ar: "أول حديث في باب ما جاء في ليلة القدر. يرويه زياد عن مالك عن يزيد بن عبد الله بن الهاد عن محمد بن إبراهيم بن الحارث التيمي عن أبي سلمة بن عبد الرحمن عن أبي سعيد الخدري، أن رسول الله كان يعتكف العشر الوسط من رمضان، فاعتكف عاماً، حتى كانت ليلة إحدى وعشرين، وهي الليلة التي يخرج فيها من صبيحتها من اعتكافه، فقال: من اعتكف معي فليعتكف العشر الأواخر، وقد رأيت هذه الليلة ثم أُنسيتها، وقد رأيتني أسجد من صبيحتها في ماء وطين، فالتمسوها في العشر الأواخر والتمسوها في كل وتر. فمطرت السماء تلك الليلة وكان المسجد على عريش فوكف، فأبصرت عيناه أثر الماء والطين على جبهته وأنفه من صبح ليلة إحدى وعشرين. ويذكر المحقق أن الحديث مرسل عند مالك، وأنه موصول في الصحيحين وغيرهما من طريق هشام بن عروة عن أبيه عن عائشة، وأن الترمذي عدّد من رواه عن عمر وأبي وجابر بن سمرة وغيرهم. {cite:muwatta-maruf-1997 p.427} {cite:muwatta-maruf-1997 p.428}"
