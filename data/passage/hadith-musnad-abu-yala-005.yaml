text: "أصحابكم أولاء الذين خرجوا بيني وبينهم كتاب الله، يقول الله في كتابه في امرأة ورجل: (وإن خفتم شقاق بينهما فابعثوا حكما من أهله. وحكما من أهلها إن يريدا إصلاحا يوفق الله بينهما ٣٥) [النساء: ٣٥] فأمة محم لل اعظم حرمة،"
