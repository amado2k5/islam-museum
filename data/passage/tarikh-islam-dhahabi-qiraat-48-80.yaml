text: "… بن خليفة. أبو عِمران، اللَّخْمِيُّ، القُرطُبيُّ، ويُعرف بابنِ الفخَّار، النّاسخ، المقرىء. أخذ القراءآت عن أبي إسحاق بن طلحةً، وأبي القاسم الشَّراط. وسَمِعَ مِن أبي القاسم بن بَشْكُوالَ، وغيرهِ. وصَحِبَ الصَّالِحينَ. وأقرأ القرآنَ. وكان يكتبُ المصاحِفَ. قال الأبَّار : تُوفّي في …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 48، ص 80، يذكر قراءات القرآن، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 48, p. 80, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 48، ص 80 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 48, pág. 80, que menciona las lecturas del Corán, la recopilación del Corán y los códices, los sistemas de escritura y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Extrait du Tarikh al-Islam d'al-Dhahabi, volume 48, page 80, évoquant les lectures du Coran, sa compilation et les codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 48. cildinin (resimli) 80. sayfasından bir alıntı, Kur'an okunuşlarını, Kur'an'ın derlenmesini ve el yazmalarını, çeşitli yazı ve üslupları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 48 (bergambar), halaman 80, membahas bacaan Al-Quran, penyusunan Al-Quran dan manuskripnya, serta berbagai aksara dan gaya penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan diakritik."
