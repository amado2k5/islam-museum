label: { ar: "جامع الترمذي 3331 — الأب والأبوة", en: "Jami' al-Tirmidhi 3331 — the father and fatherhood", ur: "جامع ترمذی 3331 — باپ اور والدیت", es: "Jami' al-Tirmidhi 3331 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 3331 — le père et la paternité", tr: "Cami' el-Tirmizi 3331 — Baba ve Babalık", id: "Jami' al-Tirmidhi 3331 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا سَعِيدُ بْنُ يَحْيَى بْنِ سَعِيدٍ الأُمَوِيُّ، حَدَّثَنِي أَبِي قَالَ، هَذَا مَا عَرَضْنَا عَلَى هِشَامِ بْنِ عُرْوَةَ عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ أُنْزِلَ : ⁦( عبَسَ وَتَوَلَّى )⁩ فِي ابْنِ أُمِّ مَكْتُومٍ الأَعْمَى أَتَى رَسُولَ اللَّهِ فَجَعَلَ يَقُولُ يَا رَسُولَ اللَّهِ أَرْشِدْنِي وَعِنْدَ رَسُولِ اللَّهِ رَجُلٌ مِنْ عُظَمَاءِ الْمُشْرِكِينَ فَجَعَلَ رَسُولُ اللَّهِ يُعْرِضُ عَنْهُ وَيُقْبِلُ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3331، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3331 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3331، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3331 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3331 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'de yer alan 3331 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3331, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
