label: { ar: "صحيح البخاري 4137 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 4137 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 4137 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر" }
text: "وَقَالَ أَبُو الزُّبَيْرِ عَنْ جَابِرٍ، كُنَّا مَعَ النَّبِيِّ بِنَخْلٍ فَصَلَّى الْخَوْفَ. وَقَالَ أَبُو هُرَيْرَةَ صَلَّيْتُ مَعَ النَّبِيِّ غَزْوَةَ نَجْدٍ صَلاَةَ الْخَوْفِ. وَإِنَّمَا جَاءَ أَبُو هُرَيْرَةَ إِلَى النَّبِيِّ أَيَّامَ خَيْبَرَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4137، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4137 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 4137، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
