text: |-
  ٥٠
  كان أوب مساحى القوم فوقهم * طير تعيف على جون مزاحيف
  والاسم العيفة والعيوف من الابل الذى يسمّ الماء فيدعه وهو عطشان
  الكثير الريس غدافا وكذلك الشعر الاسود الطويل والجناح الاسود قال الكميت
  يصف الظليم وبيضه
  يكسوه وحف اغدافا من قطيفته • ذات الفضول مع الاشفاق والحدب
  وأغدفت المرأة قناعها أى أرسلته على وجهها قال عنترة
  ان تغدفى دونى القناع فاتى * طب بأخذ الفارس المستلتم
  وأغدف الليل أى أرخى سد وله وأغدف الصماد الشبكة على الصيد وفى الحديث ان قلب
  المؤمن آشدارتكاضا من الذئب يصيبه من العصفور حين يغدف به (غرف الغرف
  شجريديغ به :قال سقاءغرفى أى مدبوغ بالغرف قال ذوارمة
  وفراء غرفية أثأى خوارزها * مشلشل ضيعته بينها الكتب
  يعنى مزادة دبغت بالغرف ومشلشل من نعت السرب فى قوله
  ما بال عينك منها الماء ينسكب كانه من كلى مف رية سرب
  وربعاجاء بالتحريك حكاه بعقوب قال الشاعر
  أمسى سقام خلا لا أنيس به • الا السباع ومزالريح بالغرفة
  سقام اسم واد يقال غرفت الابل بالكسر تغرف عرفا اذا اشتكت عن أكل الغرف والغريف
  الشجر الكثير الملتف من أشجر كان قال الاعشى
  كبردية الغيل وسط الغريف * ساق الرصاف اليه غديرا
  وقيل الغريف فى هذا البيت ماء فى الاجة والغريفة جلدة من أدم نحو من شبر فارغة فى أسفل
  قراب السيف تذبذب وتكون مفرضة مزينة قال الطرماح يذكر منفر البعير
  خريع النعو مضطرب النواى * كاخلاق الغريفة ذى غضون
  جعله حلة النعومته وبنوأسديسمون النعل الغريفة وأمّا الغريف بكسر القين وتسكين
  الراءفضرب من الشجر قال حاتم يصف النخل
  رواء يسيل الماءتحت أصوله • يميل به عيل بأدناه غريف
  وقال أحيحة بن الحلاح
  معرورف أسبل جباره * بحافتيه الشوع والغريف
  وغرفت الشئ فانغرف أى قطعته فانقطع قال قيس بن الخطيم
  تنام عن كبر شأنهافاذا * قامت رويد اتكاد تتغرفة
  وغرفت ناصية الفرس قطعتها وجززتها حكاه أبو عبيد عن الاصعى وعرفت الجكد
  ديغته بالغرف وغرفت الماء بيدى عرفا واغترفت منه والغرفة المرة الواحدة والغرفة بالضم
  اسم للمفعول منه لائك مالم تغرفه لا تسميه غرفة والجمع غراف مثل نطفة ونطاف وزعموا أن
  ابنة الجلندى وضعت قلادتهما على سلحفاة فانسايت فى البحر فقالت ياقوم نزاف نزاف لم يبق
  فى
