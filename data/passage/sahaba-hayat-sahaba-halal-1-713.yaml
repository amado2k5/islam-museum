text: "… قبل ان يقاتلوكم؟ قلت: يدعوننا الى واحدة من ثلاث: امادينهم فان أجبناهم أجرونا مجراهم، أو الجزية والمنعة، أو المنابذة، قال: فكيف طاعتهم امراءم؟ قلت: أطوع قوم لمرشدهم، قال : فما يحلون : ما يحرمون؟ فأخبرته، فقال: أيحرمون ما حلل لهم. …"
