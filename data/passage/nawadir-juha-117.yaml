text: "… قسمة اللَّه أم قسمة العبد كان الأستاذ يميلُ إلى مسرةِ الأطفالِ وتفريحِهِم، وكثيراً ما كانَ يجتمِعُ أطفالُ آقَ شَهْرْ حولهُ فيضحِكُهُمْ، ويُلاعِبُهُم، ويُدْخِلُ عليهم السرور، وإذا حَدَثَ لهم مُشْكِلٌ يُهرعون إلى الشيخ. ففي ذات يومٍ اختلفوا على قسمةٍ بضعٍ جوزاتٍ، …"
summary:
  ar: "طلب الأطفال من جحا أن يقسم بينهم الجوز، فسألهم أيريدون قسمة الله أم قسمة العبد؛ ثم قسم بينهم أنصبة غير متساوية وفسّرها بأمثلة ثلاث أسر وبحاله هو. {cite:juha-nawadir-kubra-djuwaydi p. 56}"
  en: "Children ask Juha to share out walnuts; he asks whether they want God's division or the servant's; he gives unequal shares and explains them with the examples of three families and his own case. {cite:juha-nawadir-kubra-djuwaydi p. 56}"
  ur: "بچوں نے جحا سے کہا کہ اخروٹ ان میں بانٹ دے؛ اس نے پوچھا کہ تم اللہ کی تقسیم چاہتے ہو یا بندے کی؛ پھر اس نے غیر برابر حصے دیے اور تین گھرانوں کی مثالوں اور اپنے حال سے ان کی وضاحت کی۔ {cite:juha-nawadir-kubra-djuwaydi p. 56}"
  fr: "Des enfants demandent à Juha de partager des noix; il leur demande s'ils veulent le partage de Dieu ou celui du serviteur; il donne des parts inégales et les explique par l'exemple de trois familles et par son propre cas. {cite:juha-nawadir-kubra-djuwaydi p. 56}"
  es: "Unos niños le piden a Juha que reparta nueces; él pregunta si quieren el reparto de Dios o el del siervo; da partes desiguales y las explica con el ejemplo de tres familias y con su propio caso. {cite:juha-nawadir-kubra-djuwaydi p. 56}"
