text: "… وإنما عُني بالمركبات الرومُ واليونانيون، وأكثر طِبِّ الهند بالمفردات. وقد اتفق الأطباء على أَنه متى أمكن التداوي بالغذاء لا يُعدل عنه إلى الدواء، ومتى أمكن بالبسيط لا يُعدل عنه إلى المركب. قالوا : وكل داء قدر على دفعه بالأغذية والحمية، …"
