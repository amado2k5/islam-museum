text: |-
  ٥٨٠
  * ⁦(فصل الباء)⁩.
  *.).
  فى المع لثلاثة أوجه أحدها أن تدل على النسب غو المهالبة والثانى تدل على الهجمة نحو
  الموازبة والجوارية ور بمالم تدخل فيها الهاءكة ولهم كيالج والثالث أن تكون عوضا من
  حرف محذوف نحو (لمرازية والزنادقة والعبادلة وهم عبد اللّٰه ين عباس وعبد القه بن عمروعبد
  اللّٰه بن الزبير وقدتكون الهاهعوضامن الوا والذاهبة من قاء الفول نحوعدة وصفة
  وقد تكون عوضامن الواو واليا: الذاهبة من عين الفعل نحوثبة الحوض أله من ثاب الماه
  يثوب توبا وقولهم اقام اقامة وأصله اقواما وقد تكون عوضا من الياء الذاهبة.ن لام
  الفعل نحمومائة ورئة وبرة ⁦(هلا)⁩ هلازبر للخيل أى توسعى وتنحى وقال
  وأى جوادلا يقاله هلا * والناقه أيضا وقال * -تى -دوناها بهيدوحلا * وهمازجران
  للناقة وقدتكن بما الاناث عندد نوالفول منها قال الجعدى
  ألاحبيا ليلى وقولالهاهلا • وأماهلا ب لتشديدفاصلها لا بنيت مع هل فصارفيها معف
  التحضيض كما بنوالولا وألا وجهاوا كل واحدة مع لا بنزلة حرف واحد وأخلص وهن للفسعل
  حيث دخل فيهن معنى التحضض نا نا وههنا للتقريب اذا أشرت الى. كان وهناك
  وهذالك للتبعيد واللام زائدة والكاف للخطاب وفيها دليل على التبعيد تفتح للمذكر وتكسر
  للمؤنث قال الذراء يقال اجلس ههنا قر يبا وتخح حهنا أى تساعد وهنا أيضا اللهو واللعب
  وانتد الاحمبى لامحديث أر كب يومه) . وحديث تاعل ته
  وهذا بالفتح والتشديد معناء ههنا وهناك أى هماك قال» لما رأيت عمايها هنا• ومنه قولهم
  تجمعوا من هتا ومن هنا أى من ههذاومن ههنا وقول القائل * حنت نوارولات هناحنت
  يقول ليس ذا موضع حنين وقول الراعى • نعم لات هنا انّ قلبك متيح* يقول ليس الامر
  حيث ذهبت ويقال فى النداء خاصة ياهناءيزيادة داء فى آخره تصيرتاء فى الوصل معناه
  يافلان وهى بدل من الواوالتى فى هنوك وهنوات قال امر ؤالقيس
  وقد رابى قولها ياهنا • ريحك ألحقت شرّ بشرّ
  ⁦(هيا)⁩ هيا من حروف الذداء وأصلها أيامثل حراق وأراق قال الشاعر
  ويقول من طرب هياربا ⁦(يا)⁩ يارف من روف المعجم وهي من ووف الزيادات ومن
  حروف المدوا لدين وقد يكنى بها عن المتكلم المجرور ذ كراكان أو أننى نحوة ولان ثوبى وغلامى
  وان شئت قتحتها وان شئت سكنت ولك أن تحذفها فى النداءخاصة تقول باقوم وياعباد
  بالكسرفان جاءت :عد الالف فتحت لاغير نحو عصاى ورحاى وكذلك ان جاءت بعديا الجع
  كقوله تعالى وما أنتم بمصرخىّ وأصله ؟صرخيف سقطت النون للاضافة فاجتمع الساكنان
  خركت الشانية بالفتح لانهايا المكلم ردّت الى أصلهاركسرها بعض القرّاء نوعما أن
  ذا لساكن اذا حرك -رك بالكسر وليس بالوجه وقد يكى بم اءن المسكلم المنصوب الا أنه لابدّ
  من أن تزاد قبلهانون وقاية للفعل ليسلم من اخر كقولك ضربق وقدزيدت فى المجرور فى أسماء
  مخصوصة لا يقاس عليه انحومنى وعنى ولدنى وقطنى وانمافهلواذلل ليسلم السكون الذى بن
  الاسم عليه وقد تكون الياععلامة للتأنيث كقولك افعلى وأنت تفعلين وتنسب القصيدة
  الى
