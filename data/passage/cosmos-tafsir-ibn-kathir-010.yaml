text: "إنَّما هو الإخبار عن إهلاكِ القبيلة المسمَّاة بعادٍ، وما أحلَّ اللّٰه بهم من بأسِهِ الَّذِي لا يُرَدُّ، لا أنَّ المراد: الإخبار عن مدينة أو إقليم."
summary:
  ar: "يرى ابن كثير أن المراد بالآية هو الإخبار عن إهلاك القبيلة المسماة عاداً لا عن مدينة أو إقليم، وينبّه إلى أن ما ذكره بعض المفسرين من مدينة إرم المبنية بالذهب والفضة المنتقلة بين البلاد من خرافات الإسرائيليين وأن قصة الأعرابي الذي دخلها لا يصح إسنادها."
  en: "Ibn Kathir holds that the verse reports the destruction of the tribe called Ad, not a city or region. He warns against the story, repeated by some exegetes, of an Iram city of gold and silver that moves between lands, calling it among the fables of the Israelites, and says the chain for the tale of the bedouin who entered it is not sound."
