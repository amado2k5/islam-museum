text: "إنَّما هو الإخبار عن إهلاكِ القبيلة المسمَّاة بعادٍ، وما أحلَّ اللّٰه بهم من بأسِهِ الَّذِي لا يُرَدُّ، لا أنَّ المراد: الإخبار عن مدينة أو إقليم."
summary:
  ar: "يرى ابن كثير أن المراد بالآية هو الإخبار عن إهلاك القبيلة المسماة عاداً لا عن مدينة أو إقليم، وينبّه إلى أن ما ذكره بعض المفسرين من مدينة إرم المبنية بالذهب والفضة المنتقلة بين البلاد من خرافات الإسرائيليين وأن قصة الأعرابي الذي دخلها لا يصح إسنادها."
  en: "Ibn Kathir holds that the verse reports the destruction of the tribe called Ad, not a city or region. He warns against the story, repeated by some exegetes, of an Iram city of gold and silver that moves between lands, calling it among the fables of the Israelites, and says the chain for the tale of the bedouin who entered it is not sound."
  es: "Ibn Kathir sostiene que el versículo relata la destrucción de la tribu llamada Ad, no de una ciudad o región. Advierte contra la historia, repetida por algunos exegetas, de una ciudad llamada Iram, de oro y plata, que se traslada entre tierras, considerándola una fábula de los israelitas, y afirma que la cadena de transmisión del relato del beduino que entró en ella no es fiable."
  fr: "Ibn Kathir soutient que le verset relate la destruction de la tribu d'Ad, et non d'une ville ou d'une région. Il met en garde contre le récit, repris par certains exégètes, d'une cité d'Iram, faite d'or et d'argent, qui se déplacerait d'un pays à l'autre, le qualifiant de fable israélite, et affirme que la chaîne de transmission du récit du Bédouin qui y serait entré est erronée."
  ur: "ابن کثیر کا خیال ہے کہ آیت عاد نامی قبیلے کی تباہی کی خبر دیتی ہے نہ کہ کسی شہر یا علاقے کی۔ وہ اس کہانی کے خلاف تنبیہ کرتا ہے، جسے بعض مفسرین نے دہرایا ہے، سونے اور چاندی کے ایک ارم شہر جو زمینوں کے درمیان گھومتا ہے، اسے بنی اسرائیل کے افسانوں میں قرار دیتا ہے، اور کہتا ہے کہ اس میں داخل ہونے والے اعرابی کی کہانی کا سلسلہ صحیح نہیں ہے۔"
  tr: "İbn Kathir, ayetin bir şehir veya bölgeye değil, Ad kabilesinin yıkımına işaret ettiğine inanmaktadır. Bazı yorumcuların altın ve gümüşten yapılmış ve ülkeler arasında dolaşan İram şehri hakkında söylediklerinin İsrailoğullarına ait bir efsane olduğunu ve şehre giren Bedevi hikayesinin doğrulanamayacağını belirtmektedir."
  id: "Ibn Kathir meyakini bahwa ayat tersebut merujuk pada kehancuran suku yang disebut 'Ad, bukan pada sebuah kota atau wilayah. Ia menunjukkan bahwa apa yang disebutkan oleh beberapa penafsir tentang kota Iram, yang dibangun dari emas dan perak dan berpindah-pindah antar negara, adalah mitos Bani Israel, dan bahwa kisah tentang orang Badui yang memasuki kota itu tidak dapat dibuktikan kebenarannya."
