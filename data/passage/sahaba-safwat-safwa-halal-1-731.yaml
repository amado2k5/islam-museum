text: "… الأعمال بالنيات والثاني: قوله واي: من حسن إسلام المرء تركه ما لا يعنيه والثالث : قوله وَلِفِ: لا يكون المؤمن مؤمناً حتى يرضى لأخيه ما يرضاه لنفسه والرابع : قوله ام: الحلال بيِّنّ والحرام بيِّنٌ، وبين ذلك أمور مشتبهات الحديث. …"
