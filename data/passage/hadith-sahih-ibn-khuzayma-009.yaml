text: "للصحيح والحسن . قال ابن حجر : ((ومقتضى هذا أن يؤخذ ما يوجد في كتاب ابن خزيمة وابن حبان وغيرهما - ممن اشترط الصحيح - بالتسليم، وكذا ما يوجد في الكتب المخرجة على «الصحيحين)) وفي كل ذلك نظر. أما الأول"
