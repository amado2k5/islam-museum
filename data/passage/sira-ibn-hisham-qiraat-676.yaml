text: "… محمد بن عبدالرحمن البرقي، قال: أوعب أبو محمد عبد الملك بن هشام كتاب السيرة وبحضرته رجالٌ من فُصَحَاءِ العَرَبِ فقال من الكامل : تَمَّ الْكِتَابُ وَصَارَ فِي الْعَرْضِ. عشْرِينَ جُزْءاً كُلُهَا تُرْضِي كَمْلَتْ بِلاَ لَخْنٍ وَلَاَ خَطَلٍ فِي الَشْكْلِ وَالْإِعْجَامِ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 676، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hisham's Sira, p. 676, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سیرت ابن ہشام، ص 676 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Sira de Ibn Hisham, pág. 676, que menciona los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Sira d'Ibn Hisham, p. 676, mentionne la ponctuation et les signes vocaliques du mushaf; il s'agit d'une numérisation automatique, citée dans un intervalle de quarante mots conformément à la politique relative aux sources. Le navigateur du musée, consacré à la lecture et à l'écriture du Coran, le mentionne également."
  tr: "İbn Hişam'ın Peygamber biyografisinden, 676. sayfada yer alan bir alıntı, Kur'an'ın diyakritik işaretlerini ve biçimini ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari biografi Nabi karya Ibnu Hisham, halaman 676, menyebutkan tanda diakritik dan bentuk Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
