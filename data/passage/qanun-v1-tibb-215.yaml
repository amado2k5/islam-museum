text: "… فصيلة الصنوبريات أزهارها صفراء، ثمارها عنبية خضراء. يستعمل بخوراً طارداً للرائحة الكريهة في غرف المرضى، يستخرج من خشبه زيت يسمى زيت الكاد يستعمل كثيراً في الطب في مركبات علاج الأمراض الجلدية وفي علاج الجرب عند المواشي. التداوي بالنباتات والأعشاب قديماً …"
summary:
