label: { ar: "الموطأ 874 — مالك: المعتكف مشتغل باعتكافه لا يعرض لغيره من التجارات، ولا بأس أن يأمر ببعض حاجته وبيع ماله ومصلحة أهله بما لا يشغله", en: "Muwatta 874", es: "Muwatta 874", fr: "Muwatta 874", ur: "موطا 874", tr: "El-Muvatta 874 — Malik: İtikaf halindeki kişi itikafla meşgul olur ve başka işlerle uğraşmaz. Bazı ihtiyaçlarını sipariş etmesinde, malını satmasında ve ailesinin ihtiyaçlarını karşılamasında bir sakınca yoktur, yeter ki bu onu meşgul etmesin.", id: "Al-Muwatta 874 — Malik: Orang yang sedang beritikaf disibukkan dengan itikafnya dan tidak terlibat dalam perdagangan lain. Tidak ada salahnya jika ia memesan sebagian kebutuhannya, menjual hartanya, dan memenuhi kebutuhan keluarganya, selama hal itu tidak mengalihkan perhatiannya." }
summary:
  ar: "قول لمالك: المعتكف مشتغل باعتكافه، لا يعرض لغيره مما يشتغل به من التجارات أو غيرها. ولا بأس بأن يأمر المعتكف ببعض حاجته في ضيعته ومصلحة أهله، وأن يأمر ببيع ماله، أو بشيء لا يشغله في نفسه، إذا كان خفيفاً، أن يأمر بذلك من يكفيه إياه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (867–869). {cite:muwatta-maruf-1997 p.421} {cite:muwatta-maruf-1997 p.422}"
  tr: "Malik şöyle buyurmuştur: İtikaf halindeki kişi itikafıyla meşgul olmalı ve ticaret veya başka herhangi bir işle meşgul olmamalıdır. İtikaf halindeki kişinin, mal varlığı ve aile işleriyle ilgili bazı ihtiyaçlarının karşılanması için birine talimat vermesinde, malının satışını emretmesinde veya kendisini şahsen yüklemeyen küçük bir mesele olduğu sürece birine bir şey emanet etmesinde bir sakınca yoktur. Araştırmacı, bunun Malik'ten Ebu Mus'ab (867-869) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.421} {cite:muwatta-maruf-1997 s.422}"
  id: "Malik berkata: Orang yang sedang i'tikaf disibukkan dengan i'tikafnya dan tidak boleh terlibat dalam kegiatan lain seperti perdagangan atau hal lainnya. Tidak ada salahnya jika orang yang sedang i'tikaf menyuruh seseorang untuk mengurus beberapa kebutuhannya yang berkaitan dengan harta dan urusan keluarganya, atau untuk memerintahkan penjualan hartanya, atau untuk mempercayakan sesuatu kepada seseorang yang tidak membebani dirinya secara pribadi, asalkan itu adalah masalah kecil. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (867–869). {cite:muwatta-maruf-1997 p.421} {cite:muwatta-maruf-1997 p.422}"
