label: { ar: "الموطأ 874 — مالك: المعتكف مشتغل باعتكافه لا يعرض لغيره من التجارات، ولا بأس أن يأمر ببعض حاجته وبيع ماله ومصلحة أهله بما لا يشغله", en: "Muwatta 874" }
summary:
  ar: "قول لمالك: المعتكف مشتغل باعتكافه، لا يعرض لغيره مما يشتغل به من التجارات أو غيرها. ولا بأس بأن يأمر المعتكف ببعض حاجته في ضيعته ومصلحة أهله، وأن يأمر ببيع ماله، أو بشيء لا يشغله في نفسه، إذا كان خفيفاً، أن يأمر بذلك من يكفيه إياه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (867–869). {cite:muwatta-maruf-1997 p.421} {cite:muwatta-maruf-1997 p.422}"
