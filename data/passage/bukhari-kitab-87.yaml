summary:
  ar: "القسم 87 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الديات»، ويضم فيها النصوص من 6861 إلى 6917 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 87 of Sahih al-Bukhari (Blood Money (Ad-Diyat)) in the division of the open hadith dataset the museum took its reports from: reports 6861 to 6917 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 87، عنوان «کتاب الدیات»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6861 تا 6917۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 87 de Sahih al-Bukhari (Dinero de sangre (Ad-Diyat)) pertenece a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6861 al 6917, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
