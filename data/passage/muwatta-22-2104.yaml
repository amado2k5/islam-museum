label: { ar: "الموطأ 2104 — يحيى بن سعيد عن سعيد بن المسيب: اختصم إلى عمر مسلم ويهودي فقضى لليهودي، فقال اليهودي: لقد قضيت بالحق، فضربه عمر بالدرة، وقال: ما يدريك؟ قال: إن القاضي بالحق يكون عن يمينه ملك وعن شماله ملك يسددانه ما دام مع الحق", en: "Muwatta 2104", es: "Muwatta 2104", fr: "Muwatta 2104", ur: "موطا 2104", tr: "El-Muvatta 2104 — Yahya ibn Sa’id, Sa’id ibn al-Musayyab’dan rivayetle: Ömer’in huzurunda bir Müslüman ve bir Yahudi tartıştı ve Ömer Yahudi’nin lehine hüküm verdi. Yahudi, “Adil hüküm verdiniz” dedi. Ömer ona kamçısıyla vurdu ve “Nereden biliyorsun?” dedi. Yahudi, “Bir hakim adil hüküm verdiğinde, sağında ve solunda birer melek bulunur ve hakikatten yana olduğu sürece ona yol gösterirler” diye cevap verdi.", id: "Al-Muwatta 2104 — Yahya ibn Sa’id berdasarkan riwayat Sa’id ibn al-Musayyab: Seorang Muslim dan seorang Yahudi berdebat di hadapan Umar, dan beliau memutuskan untuk memihak orang Yahudi. Orang Yahudi itu berkata, “Engkau telah memutuskan dengan adil.” Umar mencambuknya dan berkata, “Bagaimana engkau tahu?” Ia menjawab, “Ketika seorang hakim memutuskan dengan adil, ada malaikat di sebelah kanannya dan malaikat di sebelah kirinya, yang membimbingnya selama ia berada di jalan kebenaran.”" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب اختصم إليه مسلم ويهودي، فرأى عمر أن الحق لليهودي فقضى له. فقال اليهودي: والله لقد قضيت بالحق. فضربه عمر بالدرة، ثم قال: وما يدريك؟ فقال اليهودي: إنا نجد أنه ليس قاض يقضي بالحق إلا كان عن يمينه ملك وعن شماله ملك يسددانه ويوفقانه للحق ما دام مع الحق، فإذا ترك الحق عرجا وتركاه. ويذكر المحقق قول ابن عبد البر في أن الأنبياء لا يعلمون الغيب إلا ما أعلموا به. {cite:muwatta-maruf-1997 p.260}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Sa'id ibn al-Musayyab'dan rivayetle, Ömer ibn al-Khattab'ın huzurunda bir Müslüman ile bir Yahudi'nin tartıştığını anlatır. Ömer, Yahudi'nin haklı olduğunu gördü ve onun lehine hüküm verdi. Yahudi, \"Allah'a yemin ederim ki, adaletle hüküm verdiniz!\" dedi. Ömer ona kamçısıyla vurdu ve sonra, \"Nereden biliyorsun?\" dedi. Yahudi, \"Biz, adaletle hüküm veren hiçbir hakimin sağında ve solunda birer melek bulunmadığını, hakikate bağlı kaldığı sürece ona yol gösterip destek vermediklerini görüyoruz. Ama hakikatten vazgeçerse, melekler yükselir ve onu yalnız bırakırlar.\" diye cevap verdi. Araştırmacı, İbn Abd al-Barr'ın peygamberlerin gaybı ancak kendilerine bildirilenlerden bildikleri yönündeki ifadesinden bahsetmektedir. {cite:muwatta-maruf-1997 s.260}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Sa'id ibn al-Musayyab, bahwa seorang Muslim dan seorang Yahudi berdebat di hadapan Umar ibn al-Khattab. Umar melihat bahwa kebenaran ada pada orang Yahudi dan memutuskan untuk memihaknya. Orang Yahudi itu berkata, \"Demi Allah, engkau telah memutuskan dengan adil!\" Umar mencambuknya dan kemudian berkata, \"Bagaimana kamu tahu?\" Orang Yahudi itu menjawab, \"Kami mendapati bahwa tidak ada hakim yang memutuskan dengan adil kecuali ada malaikat di sebelah kanannya dan malaikat di sebelah kirinya, yang membimbing dan mendukungnya kepada kebenaran selama ia berpegang teguh padanya. Tetapi jika ia meninggalkan kebenaran, mereka naik dan meninggalkannya.\" Peneliti tersebut menyebutkan pernyataan Ibnu Abd al-Barr bahwa para nabi tidak mengetahui hal gaib kecuali apa yang diberitahukan kepada mereka. {cite:muwatta-maruf-1997 p.260}"
