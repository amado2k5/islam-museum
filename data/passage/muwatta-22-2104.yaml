label: { ar: "الموطأ 2104 — يحيى بن سعيد عن سعيد بن المسيب: اختصم إلى عمر مسلم ويهودي فقضى لليهودي، فقال اليهودي: لقد قضيت بالحق، فضربه عمر بالدرة، وقال: ما يدريك؟ قال: إن القاضي بالحق يكون عن يمينه ملك وعن شماله ملك يسددانه ما دام مع الحق", en: "Muwatta 2104" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن سعيد بن المسيب أن عمر بن الخطاب اختصم إليه مسلم ويهودي، فرأى عمر أن الحق لليهودي فقضى له. فقال اليهودي: والله لقد قضيت بالحق. فضربه عمر بالدرة، ثم قال: وما يدريك؟ فقال اليهودي: إنا نجد أنه ليس قاض يقضي بالحق إلا كان عن يمينه ملك وعن شماله ملك يسددانه ويوفقانه للحق ما دام مع الحق، فإذا ترك الحق عرجا وتركاه. ويذكر المحقق قول ابن عبد البر في أن الأنبياء لا يعلمون الغيب إلا ما أعلموا به. {cite:muwatta-maruf-1997 p.260}"
