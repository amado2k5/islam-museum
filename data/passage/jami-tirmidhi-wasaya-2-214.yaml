text: "… الإمام الترمذي كتاب الشمائل بثلاثة أبواب منطقية، وهي: باب ما جاء في وفاة رسول اللّٰه. عايد، ثم باب ما جاء في ميراث رسول اللّٰه وَية، ثم باب ما جاء في رؤية رسول اللّٰه يبة في النومُ فهذا عرض سريع لكتاب …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 214، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 2, p. 214, that mentions a deathbed and last hours, what was left behind: estate and inheritance; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "جامع ترمذی، اسکین جلد 2، ص 214 کا اقتباس جس میں وقتِ وفات اور آخری لمحات، ترکہ اور میراث کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 2, pág. 214, que menciona el lecho de muerte y las últimas horas, y lo que quedó: patrimonio y herencia; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Jami' al-Tirmidhi, volume 2, page 214, évoquant un lit de mort et les dernières heures du défunt, ainsi que son héritage. Ce passage, issu d'une numérisation automatique, est cité dans un intervalle de quarante mots, conformément à la politique relative aux sources. Il est répertorié dans le Testaments Browser."
  tr: "Cami' el-Tirmizi'nin 2. cildinin 214. sayfasından alınan bir alıntıda, ölen kişinin ölüm saati, vefatı, geride bıraktığı mal ve mirastan bahsedilmektedir; bu metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, tarihi eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 2, halaman 214, menyebutkan saat kematian dan wafatnya almarhum, serta harta dan warisan yang ditinggalkannya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peneliti wasiat, warisan, barang antik, dan tempat suci."
