text: "… الإمام الترمذي كتاب الشمائل بثلاثة أبواب منطقية، وهي: باب ما جاء في وفاة رسول اللّٰه. عايد، ثم باب ما جاء في ميراث رسول اللّٰه وَية، ثم باب ما جاء في رؤية رسول اللّٰه يبة في النومُ فهذا عرض سريع لكتاب …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 2، ص 214، يذكر ساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
