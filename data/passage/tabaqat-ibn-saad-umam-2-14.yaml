text: "… عليا السلام، وأَرادوا إصلاحه ومراجعته، أَرسلوا إليه وأَنا عندهم إنّا منأُخذ من قرمش وغلقان سبعين رجسلًا من أَشرافهم نُسلِّمهم إليك تضرب أعناقهم ونكون معك على قريش وغطقسان حتى نردّهم عنك وتردّ جَناحَنا الذي كسرتُ إلى ديارهم يعنى بنى النضير فإن …"
