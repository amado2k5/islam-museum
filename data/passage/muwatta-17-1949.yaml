label: { ar: "الموطأ 1949 — مالك: المساج المدرج في جرابه أو الثوب القبطي المدرج في طيه، لا يجوز بيعهما حتى ينشرا ويظهر ما فيهما، لأنه من الغرر والملامسة", en: "Muwatta 1949", es: "Muwatta 1949", fr: "Muwatta 1949", ur: "موطا 1949", tr: "Al-Muwatta 1949 — Malik: Kesesine konmuş bir masaj bezi veya kıvrımlarına yerleştirilmiş bir Kıpti giysisi, açılıp içindekiler ortaya çıkana kadar satılamaz; çünkü bu belirsizlik ve dokunma içerir.", id: "Al-Muwatta 1949 — Malik: Kain pijat yang diletakkan di dalam kantungnya atau pakaian Koptik yang diletakkan dalam lipatannya tidak boleh dijual sampai dibuka dan isinya diperlihatkan, karena hal ini melibatkan ketidakpastian dan sentuhan." }
summary:
  ar: "قال مالك في الساج المدرج في جرابه، أو الثوب القبطي المدرج في طيه: إنه لا يجوز بيعهما حتى ينشرا، وينظر إلى ما في أجوافهما، وذلك أن بيعهما من بيع الغرر، وهو من الملامسة. {cite:muwatta-maruf-1997 p.197}"
  tr: "Malik, kılıfına sarılı tik ağacı veya katlanmış Koptik kumaş hakkında şöyle demiştir: \"Bunları, açılıp içindekiler incelenene kadar satmak caiz değildir; çünkü satmak belirsizlik içeren bir satış, yani bir tür ima işlemidir.\" {cite:muwatta-maruf-1997 s.197}"
  id: "Malik berkata mengenai kayu jati yang dibungkus selubungnya, atau kain Koptik yang dilipat: tidak diperbolehkan menjualnya sampai dibuka dan isinya diperiksa, karena menjualnya adalah penjualan yang mengandung ketidakpastian, yang merupakan bentuk implikasi. {cite:muwatta-maruf-1997 p.197}"
