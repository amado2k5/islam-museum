text: "غزوة الخندق ثم غزاة الخندق وهي غزاة الأحزاب. وكانت في ذي القعدة سنة خمس. وكان سبيها أن رسول اللّٰه وا قي لما أجلى بني النضير، أتوا خيبر، فلما قدموها، خرج حُتَيّ بن أخطب وكنانة بن أبي الحُقيق اليهودي وغيرهما، حتى …"
