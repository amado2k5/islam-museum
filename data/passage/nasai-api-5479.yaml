label: { ar: "سنن النسائي 5479 — تربية الأب ووصيته", en: "Sunan al-Nasa'i 5479 — the father raising and counselling", ur: "سنن نسائی 5479 — باپ کی تربیت اور نصیحت", es: "Sunan al-Nasa'i 5479 — El padre que cría y aconseja", fr: "Sunan al-Nasa'i 5479 — l'éducation et les conseils du père", tr: "Sunan an-Nasa'i 5479 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan an-Nasa'i 5479 — Didikan dan Wasiat Ayah" }
text: "… بْنِ سَعْدٍ، وَعَمْرِو بْنِ مَيْمُونٍ الأَوْدِيِّ، قَالاَ كَانَ سَعْدٌ يُعَلِّمُ بَنِيهِ هَؤُلاَءِ الْكَلِمَاتِ كَمَا يُعَلِّمُ الْمُكْتِبُ الْغِلْمَانَ وَيَقُولُ إِنَّ رَسُولَ اللَّهِ كَانَ يَتَعَوَّذُ بِهِنَّ فِي دُبُرِ كُلِّ صَلاَةٍ \" اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5479، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 5479 (The Book of Seeking Refuge with Allah), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 5479، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5479 (El Libro de la Búsqueda de Refugio en Alá), menciona la crianza y el consejo paternos. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el papel del padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5479 (Le Livre de la Recherche de Refuge auprès d'Allah), mentionne le rôle du père dans l'éducation et le soutien de ses enfants. Le site « Paternité en Islam » le répertorie parmi les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
  tr: "Sunan-ı Nesai'de yer alan 5479 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5479, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini disusun oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
