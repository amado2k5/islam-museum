text: "حَدَّثَنَا مَخْلَدُ بْنُ خَالِدٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا ابْنُ جُرَيْجٍ، قَالَ أُخْبِرْتُ عَنْ عُثَيْمِ بْنِ كُلَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّهُ جَاءَ إِلَى النَّبِيِّ فَقَالَ قَدْ أَسْلَمْتُ. فَقَالَ لَهُ النَّبِيُّ \" أَلْقِ عَنْكَ شَعْرَ الْكُفْرِ \". يَقُولُ احْلِقْ. قَالَ وَأَخْبَرَنِي آخَرُ أَنَّ النَّبِيَّ قَالَ لآخَرَ مَعَهُ \" أَلْقِ عَنْكَ شَعْرَ الْكُفْرِ وَاخْتَتِنْ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 356، يذكر الجراحة والختان والجبائر. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 356 (Purification (Kitab Al-Taharah)), that mentions surgery, circumcision and splints. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 356، جس میں جراحت، ختنہ اور پٹیاں کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
