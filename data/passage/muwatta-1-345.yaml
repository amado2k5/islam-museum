text: "بيننا وبين المنافقين شهود العشاء والصبح، لا يستطيعونهما"
summary:
  ar: "أول حديث في باب ما جاء في العتمة والصبح. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة الأسلمي عن سعيد بن المسيب مرسلاً: قال النبي إن الفرق بين المؤمنين والمنافقين شهود العشاء والصبح في الجماعة، فإن المنافقين لا يستطيعونهما، أو نحو هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إسناده وإرساله، وأن هذا اللفظ لا يُحفظ مسنداً ومعناه محفوظ من وجوه ثابتة ⁦(التمهيد 20/11)⁩. {cite:muwatta-maruf-1997 p.190}"
  tr: "İşa ve Fecir namazları hakkında rivayet edilenler bölümündeki ilk hadis, Yahya'nın Malik'ten, o da Abdülrahman ibn Harmalah el-Aslami'den, o da Sa'id ibn el-Musayyab'dan mursal bir hadis olarak rivayet edilmiştir: Peygamberimiz şöyle buyurmuştur: \"Müminler ile münafıklar arasındaki fark, İşa ve Fecir namazlarını cemaatle kılmaktır; münafıklar bunu yapamazlar.\" veya buna benzer bir ifade. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Şafiî tarafından da rivayet edildiğini belirtmektedir. İbn Abdül-Barr'ın, Malik'in rivayetinde isnad ve mursal olması konusunda ihtilaf bulunmadığını ve bu ifadenin isnadla değil, sahih rivayet zincirleriyle korunduğunu söylediğini aktarmaktadır (el-Temhid 20/11). {cite:muwatta-maruf-1997 s.190}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang telah diriwayatkan mengenai salat Isya dan Subuh. Diriwayatkan oleh Yahya dari Malik, dari Abd al-Rahman ibn Harmalah al-Aslami, dari Sa'id ibn al-Musayyab, dalam hadits mursal: Nabi bersabda, \"Perbedaan antara orang-orang beriman dan orang-orang munafik adalah mengerjakan salat Isya dan Subuh secara berjamaah, karena orang-orang munafik tidak mampu mengerjakannya,\" atau sesuatu yang serupa. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwayd, dan al-Shafi'i. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa tidak ada perbedaan pendapat mengenai riwayat Malik tentang sanadnya dan apakah hadits ini mursal, dan bahwa redaksi ini tidak terpelihara oleh sanad, tetapi maknanya terpelihara melalui sanad yang sahih (al-Tamhid 20/11). {mengutip:muwatta-maruf-1997 hal.190}"
