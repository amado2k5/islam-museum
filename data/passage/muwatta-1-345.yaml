text: "بيننا وبين المنافقين شهود العشاء والصبح، لا يستطيعونهما"
summary:
  ar: "أول حديث في باب ما جاء في العتمة والصبح. يرويه يحيى عن مالك عن عبد الرحمن بن حرملة الأسلمي عن سعيد بن المسيب مرسلاً: قال النبي إن الفرق بين المؤمنين والمنافقين شهود العشاء والصبح في الجماعة، فإن المنافقين لا يستطيعونهما، أو نحو هذا. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي، وينقل عن ابن عبد البر أنه لم يُختلف عن مالك في إسناده وإرساله، وأن هذا اللفظ لا يُحفظ مسنداً ومعناه محفوظ من وجوه ثابتة (التمهيد 20/11). {cite:muwatta-maruf-1997 p.190}"
