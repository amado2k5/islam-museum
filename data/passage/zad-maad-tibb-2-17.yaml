text: "… النبيُّ وَام: أَلَمْ آمُرْكَ أَن لا تَستَقيدَ حَتَّى تَبْرأَ جِراحُكَ فَعَصَيْتَني، فَأَبعدَكَ الله وبطل عَرجك، ثم أمر رسولُ اللّٰه يه من كان به جُرح بعد الرجل الذي عَرَجَ أن لا يُستقاد منه حتى يبرأ جرح صاحبه. فالجراح على ما بلغ …"
