text: "… بِمَا لَدَيْهِمْ فَرِحُونَ، أي: لا تكونوا من المشركين الذين قد فرَّقُوا دينهم؛ أي: بدَّلُوه وغيروه وآمنوا ببعض وكفروا ببعض.، أي: تركوه وراء ظهورهم، وهؤلاء كاليهود والنَّصارى وقرأ بعضهم: فَارَفُوا دِينهم والمجوس وعَبَدة الأوثان، وسائر أهل الأديان الباطلة، مما عدا أهل …"
