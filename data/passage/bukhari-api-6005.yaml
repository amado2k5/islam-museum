label: { ar: "صحيح البخاري 6005 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 6005 — the orphan and the father lost", ur: "صحیح بخاری 6005 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 6005 — El huérfano y el padre perdido", fr: "Sahih al-Bukhari 6005 — L'orphelin et le père perdus", tr: "Sahih el-Buhari 6005 — Yetim ve Babayı Kaybetme", id: "Sahih al-Bukhari 6005 — Anak Yatim dan Kehilangan Ayah" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الْوَهَّابِ، قَالَ حَدَّثَنِي عَبْدُ الْعَزِيزِ بْنُ أَبِي حَازِمٍ، قَالَ حَدَّثَنِي أَبِي قَالَ، سَمِعْتُ سَهْلَ بْنَ سَعْدٍ، عَنِ النَّبِيِّ قَالَ \" أَنَا وَكَافِلُ الْيَتِيمِ، فِي الْجَنَّةِ هَكَذَا \". وَقَالَ بِإِصْبَعَيْهِ السَّبَّابَةِ وَالْوُسْطَى."
summary:
  ar: "حديث في صحيح البخاري، رقم 6005، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6005 (Good Manners and Form (Al-Adab)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 6005، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6005 (Buenas costumbres y modales (Al-Adab)), menciona al huérfano y al padre ausente. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre la paternidad."
  fr: "Un hadith du Sahih al-Bukhari, n° 6005 (Les bonnes manières et la bienséance), évoque l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, la Sunna, la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sahih el-Buhari'de 6005 numaralı hadis, yetimlerden ve babasızlık durumundan bahseder. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 6005, menyebutkan tentang anak yatim dan kehilangan seorang ayah. Bagian \"Kebapakan dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
