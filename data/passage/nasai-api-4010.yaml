label: { ar: "سنن النسائي 4010 — بر الوالدين أو عقوقهما", en: "Sunan al-Nasa'i 4010 — dutifulness to the parents or disobedience to them", ur: "سنن نسائی 4010 — والدین کے ساتھ نیکی یا نافرمانی", es: "Sunan al-Nasa'i 4010 — Cumplimiento de deberes hacia los padres o desobediencia hacia ellos", fr: "Sunan al-Nasa'i 4010 — le devoir envers les parents ou la désobéissance envers eux" }
text: "… عَبْدِ الأَعْلَى، قَالَ حَدَّثَنَا خَالِدٌ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي بَكْرٍ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ ح وَأَنْبَأَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، قَالَ أَنْبَأَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي بَكْرٍ، قَالَ سَمِعْتُ أَنَسًا، يَقُولُ قَالَ رَسُولُ اللَّهِ \" الْكَبَائِرُ الشِّرْكُ بِاللَّهِ وَعُقُوقُ الْوَالِدَيْنِ وَقَتْلُ النَّفْسِ وَقَوْلُ الزُّورِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4010، يذكر بر الوالدين أو عقوقهما. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4010 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions dutifulness to the parents or disobedience to them. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4010، جس میں والدین کے ساتھ نیکی یا نافرمانی کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4010 (El Libro de la Lucha [La Prohibición del Derramamiento de Sangre]), menciona la obediencia o desobediencia hacia los padres. El navegador \"La Paternidad en el Islam\" lo incluye entre los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 4010 (Le Livre du Combat [L'Interdiction du Sang]), évoque le devoir envers les parents ou la désobéissance à leur égard. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la figure paternelle."
