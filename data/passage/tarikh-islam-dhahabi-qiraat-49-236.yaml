text: "… بَلَنْسِيةَ. وُلِدَ سنةَ ثمانٍ وأربعينَ وخمسمائة. ذكرَهُ أبو عبد اللّه الأبَارُ، فقالَ : أخذَ القراءآتِ عن أبي الحسن بن هُذَيل، وأجازَ له إجازةٌ عامة في جُمادى الآخرةِ سنةَ ثلاثٍ وستّين. وكانَ يكتُبُ المصاحفَ. وسَكَنَ تونُسَ وأقرأ بها القرآنَ. ورأيتُ الآخذَ …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 49، ص 236، يذكر قراءات القرآن، وجمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 49, p. 236, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 49، ص 236 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 49, pág. 236, que menciona las lecturas del Corán, la recopilación del Corán y los códices, los sistemas de escritura y el arte de escribir; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 49, page 236, mentionne les lectures du Coran, sa compilation et les codex, les écritures et l'art de l'écriture; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 49. cildinin (resimli baskı) 236. sayfasından bir alıntı, Kur'an okunuşlarını, Kur'an'ın derlenmesini ve el yazmalarını, çeşitli yazı ve üslupları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak kod politikasına uygun olarak yaklaşık kırk kelimeyle sınırlıdır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 49 (edisi bergambar), halaman 236, membahas bacaan Al-Quran, penyusunan Al-Quran dan manuskripnya, serta berbagai aksara dan gaya penulisan. Kutipan ini diambil dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan kebijakan kode sumber. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan diakritik."
