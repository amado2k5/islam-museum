label: { ar: "الموطأ 1050 — مالك: كل من حُبس عن الحج بعد ما يحرم، إما بمرض أو بغيره، أو بخطأ من العدد، أو خفي عليه الهلال: فهو محصر، وعليه ما على المحصر", en: "Muwatta 1050", es: "Muwatta 1050", fr: "Muwatta 1050", ur: "موطا 1050", tr: "El-Muvatta 1050 — Malik: İhrama girdikten sonra hastalık veya başka sebeplerden dolayı, sayımda hata nedeniyle veya yeni ayın görünmemesi nedeniyle Hac yapmaktan alıkonulan kimse, ihramlı sayılır ve ihramlı olan biriyle aynı yükümlülüklere tabidir." }
summary:
  ar: "قول لمالك: كل من حُبس عن الحج بعد ما يحرم، إما بمرض أو بغيره، أو بخطأ من العدد، أو خفي عليه الهلال، فهو محصر، وعليه ما على المحصر. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1168). {cite:muwatta-maruf-1997 p.487}"
  tr: "Malik şöyle demiştir: \"İhram haline girdikten sonra, hastalık veya başka sebeplerden dolayı, hacı sayımında hata nedeniyle veya hilalin görülmemesi nedeniyle hac yapmaktan alıkonulan kimse, ihram halinde sayılır ve ihram halinde olan biriyle aynı yükümlülüklere tabidir.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1168) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.487}"
  id: "Malik berkata: Barang siapa yang terhalang melaksanakan haji setelah memasuki keadaan ihram, baik karena sakit atau alasan lain, atau karena kesalahan dalam menghitung jamaah, atau karena hilal tidak terlihat, maka dianggap berada dalam keadaan ihram dan wajib membayar kewajiban yang sama seperti orang yang berada dalam keadaan tersebut. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1168). {cite:muwatta-maruf-1997 p.487}"
