label: { ar: "الموطأ 2452 — زيد بن أسلم عن عطاء بن يسار: النهي عن الغبيراء", en: "Muwatta 2452" }
summary:
  ar: "حدث مالك عن زيد بن أسلم عن عطاء بن يسار أن النبي سئل عن الغبيراء؟ فقال: لا خير فيها، ونهى عنها. قال مالك: فسألت زيد بن أسلم: ما الغبيراء؟ فقال: هي الأسكركة. ويذكر المحقق أن الحديث في الموطأ مرسل، وأن ابن عبد البر ساقه موصولا من رواية ابن وهب عن مالك عن زيد بن أسلم عن عطاء عن ابن عباس. {cite:muwatta-maruf-1997 p.413}"
