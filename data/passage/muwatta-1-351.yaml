label: { ar: "الموطأ 351 — سعيد بن المسيب لمن صلى في بيته ثم أدرك الإمام: إنما ذلك إلى الله", en: "Muwatta 351", es: "Muwatta 351", fr: "Muwatta 351", ur: "موطا 351", tr: "El-Muvatta 351 — Sa'id ibn el-Musayyab, evinde namaz kıldıktan sonra imama yetişen kişi hakkında şöyle diyor: Bu, Allah'ın takdirine kalmıştır.", id: "Al-Muwatta 351 — Sa’id ibn al-Musayyab, mengenai orang yang shalat di rumah lalu menyusul imam: Itu terserah kepada Allah." }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب إعادة الصلاة مع الإمام: سأل رجل سعيد بن المسيب أنه يصلي في بيته ثم يأتي المسجد فيجد الإمام يصلي أفيصلي معه، فقال: نعم، فسأله أيهما صلاته، فقال سعيد: أو أنت تجعلهما؟ إنما ذلك إلى الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن ابن عيينة عن يحيى بن سعيد بنحوه. {cite:muwatta-maruf-1997 p.194}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, imamla birlikte namazı tekrarlama bölümünde yer alan bir rivayette şöyle denmektedir: Bir adam Sa'id ibn al-Musayyab'a, \"Evde namaz kılıyorum, sonra camiye gidiyorum ve imamın namaz kıldığını görüyorum. Onunla birlikte namaz kılmalı mıyım?\" diye sordu. Sa'id, \"Evet\" diye cevap verdi. Adam daha sonra, \"Bu iki namazdan hangisi geçerlidir?\" diye sordu. Sa'id, \"Hangisinin geçerli olduğuna sen karar ver. Bu Allah'a kalmıştır.\" diye yanıtladı. Editör, bu rivayetin Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından, el-Beyhaki'nin de benzer bir şekilde kaydettiği rivayetin Malik'ten naklettiğini ve Abd al-Razzaq'ın da İbn Uyaynah'tan Yahya ibn Sa'id'den benzer bir şekilde naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.194}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Yahya ibn Sa'id, dalam bab tentang mengulang salat bersama imam: Seorang pria bertanya kepada Sa'id ibn al-Musayyab, \"Saya salat di rumah, kemudian saya pergi ke masjid dan mendapati imam sedang salat. Haruskah saya salat bersamanya?\" Beliau menjawab, \"Ya.\" Pria itu kemudian bertanya, \"Mana dari kedua salat ini yang sah?\" Sa'id menjawab, \"Kamu yang memutuskan mana yang sah? Itu terserah Allah.\" Editor menyebutkan bahwa Abu Mus'ab, Suwayd, dan Yahya ibn Bukayr meriwayatkannya dari Malik, sebagaimana dicatat oleh al-Bayhaqi, dan bahwa 'Abd al-Razzaq meriwayatkannya dari Ibn 'Uyaynah atas otoritas Yahya ibn Sa'id dalam bentuk yang serupa. {cite:muwatta-maruf-1997 p.194}"
