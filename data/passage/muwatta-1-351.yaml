label: { ar: "الموطأ 351 — سعيد بن المسيب لمن صلى في بيته ثم أدرك الإمام: إنما ذلك إلى الله", en: "Muwatta 351" }
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب إعادة الصلاة مع الإمام: سأل رجل سعيد بن المسيب أنه يصلي في بيته ثم يأتي المسجد فيجد الإمام يصلي أفيصلي معه، فقال: نعم، فسأله أيهما صلاته، فقال سعيد: أو أنت تجعلهما؟ إنما ذلك إلى الله. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي، وأن عبد الرزاق أخرجه عن ابن عيينة عن يحيى بن سعيد بنحوه. {cite:muwatta-maruf-1997 p.194}"
