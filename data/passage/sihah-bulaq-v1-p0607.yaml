text: |-
  ١ لأول بالفتح والثانى بالكسر
  اه ويوجد فى يعض نسخ زيادة
  فى الآخر و الثليب الكلا
  ٢٤
  والثعبان أيضاضرب من الحيات طوال والجمع ثعابين والثعبة ضرب من الوزغ والمشعب
  بالفتح واحد مشاعب الحياض وانشعب الماء جرى فى المشعب وانتعب الدم من الانف قال
  الاصمعى فوه يجرى ثعابيب وسعابيب وهو أن يجرى منه ما صاف فيه غدد ⁦( تعلب)⁩
  الثعلب معروف قال الكسائى الاتى منه ثعلبة والذكر ثعليان وأنشد
  أرب يبول الثعلبان برأسه * لقدذل من بالت عليه الثعالب
  وداء التعلب علة معروفة يتنائرمنها الشعر وأرض مشعلبة بكسر اللام ذات تعالب وأما
  قولهم أرض مشعلة فهومن ثعالة ويجوز أيضا أن يكون من ثعلب كماقالوا معرة لارض
  كثيره العقارب والمعلب طرف الرمح الداخل فى جبة السنان والأعلب مخرج ماء المطرمن
  جرين التمرو التعلبتان تعلبة بن جدعاء بن ذهل بن رومان بن جندب بن خارجة بن سعدين
  فطرة بن طيو تعلبة بن رومان بن جندب قال الشاءر
  يأتى لى الثعلبان الذى • قال خباج الامة الراعية
  وأم جندب جديلة ابنة سبيع بن عمرومن جير اليها ينسبون والثعلبية موضع بطريق مكة
  ( تغب الشغب الغدير يكون فى ظل جيل لاتصيبه الشمس فيبردماؤه والجمع تغبان مشل
  شيث وشيثان وثغبان مثل حل وحلان قال الشاعر مشعشعة بثغبان البطاح وقد يسكن
  فيقال ثغب والجمع ثغاب واثغاب تب لثقب بالفتح واحد الثقوب والثقب بالضم بجمع
  تقبة ويجمع أيضا على ثقب والمثقب ما يثقب به وثقبت الشء ثقبا وثقبته شقد للكثرة ودر
  مثقب أى مثقوب وتثقب الجلد اذا ثقبه الحلم وتثقيب النارتذ كيتها ويال أيضائقب عود
  العرفج وذلك اذا مطرولان عوده فاذا اسوتشيئا قيل قدقل فاذا ازداد قليلاقد أدبى وهو
  حينمذ يصلح أن يؤكل فاذاتمت خومته قيل د أخوص والمثقب يكسر القاف لقب شاعر
  من بى عبدا لقيس سمى بذلك اقوله
  أرين محاسناوكنن اخرى * وثتبن الوصاوص للعيون
  وثقبت النار تشقب ثقوبا وثقابة اذا اتقدت وأثة بتها أنا رشهاب ثاقب أى مضئ وبقال أيضا
  ثقبت الناقسة أى غزرت فهى ثاقب والثقوب بالفتح ما تشعل به النار من دقاق العيدان
  ب ثلبه ثلبا اذاضرّح بالعيب وتنقصه قال الراجز لا يحسن التعريض الائلبا
  والمثالب العيوب الواحدة مثلبة والائلب والائلب ١ تات الحجارة والتراب وقيل
  بفينه الائلب والائلب والتلب بالمكسر الجمل الذى انكسرت أنيابه من الهرم وتناثر هلب
  ذنبه والانى ثلبة والجمع لبة مثل قرد وقردة تقول منه ثلب البعير تقليبا عن الاصمعى قاله
  فى كتاب الفرق ورمح ثلب أى متثلم قال أبو العيال الهذلى" ومطرد من الخطى لاعار ولا ثلب
  ومنه اهرأثالبة الشوى أى.تنققة القدمين قال جرير
  اقدولدت غسان ثالبة الشوى * عدوس السرى لا يعرف الكرم جيدها
  والثلبوت اسم وادبين طيء وذبيان ب الثوب واحد الاثواب والثياب ويجمع
  فى القلة على أثوب وبعض العرب يقول أثؤب فيه-مز لانّ الضمة على الواوتستثقل والهمزة
  أقوىء-لى احتمالها وكذلك دار وأدوروساق وأسؤق وجيع ماجاهعلى هذا المثال قال
  الراجز
