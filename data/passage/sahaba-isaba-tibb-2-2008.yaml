text: "… تقدمت. وعن الوَاقِدِيّ عن عبد اللّٰه بن أبي يحيى عن ثبيتة عن أمها قالت: لما أراد النَّبي وَلِيفي الخروج إلى خيبر قلت : - أم سِمَاك بنت سهل: يا رسول الله! أخرج معك أخرز السقاء وأداوي الجرحى في ترجمة أمها …"
