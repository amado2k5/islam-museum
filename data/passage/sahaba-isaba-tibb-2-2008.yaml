text: "… تقدمت. وعن الوَاقِدِيّ عن عبد اللّٰه بن أبي يحيى عن ثبيتة عن أمها قالت: لما أراد النَّبي وَلِيفي الخروج إلى خيبر قلت : - أم سِمَاك بنت سهل: يا رسول الله! أخرج معك أخرز السقاء وأداوي الجرحى في ترجمة أمها …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 2008، يذكر مداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 2008, that mentions the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 2008 کا اقتباس جس میں زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Isaba de Ibn Hajar, volumen escaneado 2, pág. 2008, que menciona el tratamiento de heridas, mujeres que atienden a los heridos, búsqueda de tratamiento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage al-Isaba d'Ibn Hajar, volume 2, page 2008, qui mentionne le traitement des blessures, les femmes soignant les blessés, la recherche de soins; extrait du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Hacer'in El-İsabe adlı eserinin resimli 2. cildinin 2008. sayfasında, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedavi konularına değinilmektedir; bu bölüm, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari kitab Al-Isabah karya Ibn Hajar, jilid 2 bergambar, hlm. 2008, menyebutkan pengobatan luka, perempuan yang merawat orang terluka, dan perawatan medis; dari versi bergambar yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
