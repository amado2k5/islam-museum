text: |-
  ⁦(فصل الرا.)⁩
  ٢٢٩
  قال أبوعم رو وبنو أرفدة الذين فى الحديت حِنس من الحيس يرقدون ورفيدة حىّ من
  العرب يقال لهم الرفيدات ⁦(رقد )⁩ الرعاد النوم وقدرقديرقد رقداوروداورقادا
  وقوم رقود أى رقد والرقدة النومة والمرقد بالفتح المضجع وأرقده أنامه وأرقد بالمكان أقام
  به والمرقد بالضم دواءر قد. ن شريه والرقدان الطفر من النشاط كفعل الحمل والجدى ويقال
  ارقدار قدادا أى أسرع فار العجاج يصف نورا
  فظل يرقد من النشاط • كالبربرى لح فى انخراط
  ورحل هرقدى مثال حرعزى أى يرقدفى أموره والراقوددن طويل الاسفل كهيئة
  الاردبة يسيع داخله بالقار وهو معرّب والجمع الرواقيد ورقد اسم جبل تنهت منه الارحية
  قال الشاءرذ والرمة يصف كركرة البعير أ ومنسمه
  تفض الحصى عن مجمرات وقيعة • كارحاء وقد زلمتها المناقر.
  ( ركد. ركد الماءركود اسكن وكذلك الريح والسفينة والشهس اذاقام قائم الظهيرة
  وكل ثابت فى.كان فهورا كدور كد الميزان استوى وركد القوم هدوا والمراكد
  المواضع التى يركد فيها الانسان وغيره وقال الشاء ريصف هار المردته الفيل فطبأ الى !
  لجبال فى شعابها وهو يرى السماء طرائق
  أرته من الجرباء فى كل -نزل * طباياذ-رعاه النهار المراكد
  وجفنة ركود أى عملوة رمد الرماد معروف والرمدداء بالكسر والمتمثله وكذلك
  الارمداءمثال الاربعاء ويقال رمادرمدد أى هالك جعلوه صفة قال الكعيت
  رمادا أطارته السوادك رمددا والارمد الذى على لون الرماد وهوغبرة فيها كدرة
  ومنه قيل للنعامة رمداء وللبعوض رمد قال أبو وجرة وذكر صائدا
  تبيت جاربه الافعى وساعره • رمديه عاذرمنهنّ كالجرب
  وأرمد الرجل إرمادا اقتقر والترميد جعل الشى فى الرمادوف المشل شوى أخوك-ق اذا
  أنضج رمّد والمرقد من الشواء الذى يمل فى الجر والترمسد الاضراع يقال رمدت الضأن
  فربق ربق أى هي الارباق لانها انما تضرع على رأس الولد وأرمدت الناقة أضرعت وكذلك
  البقرة والشاة والرمدوالرمادة الهسلاك قال ابن السكيت يقال قدر مدنا القوم نرمدهم
  ونرمدهم رمدا أى أحذا علميهم ورمدت الغنم ترمدرمداهلكت من بردأ وصة مع قال أبو وجرة
  صيت عليكم حاصبى فتركنكم • كاصرام عاد حين جلاها الرمد
  ومنمعام ازمادة لانه هلك فيه الناس وهلكت الاموال وهى أعوام جدب تتابعت على
  الناس فى أيام عمربن الخطاب رضى اللّٰه عنه ورمد الرجل بالكسرير مدر مداهاجت عينه فهو
  رمد وأرمدو أرمدالقه عينه فهى ومدة وحكى السجستاني مارمداذوا كان آجنانقاته
  من كتاب ⁦( رند)⁩ الرندشجر طيب الرائحة من شجر البادية وقال الشاعرامى والقيس
  ورنداوابى والسكاء المقترا قال الاصمعى وربعاسموا العودرندا وأنكرأن يكون الرند
  الآس رود الارادة المشيئة وأصلها الواولة ولك راوده الاأن الواوسكنت
  فنقلت حوكتها الى ما قبلها فانقلبت فى الماضى ألفاوفى المستة بل ياء وسقعات فى المصدر
  محاح
