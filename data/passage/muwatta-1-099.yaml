summary:
  ar: "أثر يرويه مالك عن الصلت بن زبيد، في باب الرخصة في ترك الوضوء من المذي: سأل الصلت سليمان بن يسار عن البلل يجده فقال له: انضح ما تحت ثوبك بالماء ولا تلتفت إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.84}"
