label: { ar: "الموطأ 99 — سليمان بن يسار: انضح ما تحت ثوبك واله عنه", en: "Muwatta 99", es: "Muwatta 99", fr: "Muwatta 99", ur: "موطا 99", tr: "El-Muvatta 99 — Süleyman ibn Yasar: Elbisenizin altından su serpin ve öylece bırakın.", id: "Al-Muwatta 99 — Sulayman ibn Yasar: Percikkan air dari bawah pakaianmu dan biarkan saja." }
summary:
  ar: "أثر يرويه مالك عن الصلت بن زبيد، في باب الرخصة في ترك الوضوء من المذي: سأل الصلت سليمان بن يسار عن البلل يجده فقال له: انضح ما تحت ثوبك بالماء ولا تلتفت إليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن. {cite:muwatta-maruf-1997 p.84}"
  tr: "Malik'in, meni öncesi sıvıdan sonra abdest almama muafiyeti bölümünde, As-Salt ibn Zubayd'dan rivayet ettiği bir hadiste şöyle denmektedir: As-Salt, Süleyman ibn Yasar'a bulduğu ıslaklık hakkında sormuş ve o da ona şöyle demiştir: Elbisenin altına su serp ve ona aldırma. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suwayd ve Muhammed ibn al-Hasan tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.84}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari As-Salt ibn Zubayd, dalam bab tentang keringanan berwudhu setelah keluarnya cairan pra-ejakulasi: As-Salt bertanya kepada Sulayman ibn Yasar tentang basah yang ia temukan, dan Sulayman menjawab: Percikkan air di bawah pakaianmu dan jangan hiraukan. Editor menyebutkan bahwa riwayat ini dinarasikan dari Malik oleh Abu Mus'ab, Suwayd, dan Muhammad ibn al-Hasan. {cite:muwatta-maruf-1997 p.84}"
