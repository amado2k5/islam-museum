label: { ar: "الموطأ 2336 — مالك: لا يعتق السيد أحد المكاتبين دون رضا أصحابه في الكتابة", en: "Muwatta 2336" }
summary:
  ar: "قال مالك: إذا كان القوم جميعا في كتابة واحدة، لم يُعتق سيدهم أحدهم دون مؤامرة أصحابه الذين معه في الكتابة ورضاهم، وإن كانوا صغارا؛ فليست مؤامرتهم بشيء، ولا يجوز ذلك عليهم. فربما كان الرجل يسعى على القوم كلهم ويؤدي عنهم كتابتهم فيعمد السيد إلى من يؤدي عنهم فيعتقه، فيكون ذلك عجزا لمن بقي. وقد ذكر مالك نفي الضرر، وهذا أشد الضرر. {cite:muwatta-maruf-1997 p.363}"
