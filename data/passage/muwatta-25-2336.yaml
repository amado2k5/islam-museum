label: { ar: "الموطأ 2336 — مالك: لا يعتق السيد أحد المكاتبين دون رضا أصحابه في الكتابة", en: "Muwatta 2336", es: "Muwatta 2336", fr: "Muwatta 2336", ur: "موطا 2336", tr: "Al-Muwatta 2336 — Malik: Bir efendi, sözleşmedeki diğer ortaklarının rızası olmadan kölelerinden birini azat edemez.", id: "Al-Muwatta 2336 — Malik: Seorang majikan tidak boleh membebaskan salah satu budaknya tanpa persetujuan dari pemilik bersama lainnya dalam perjanjian tersebut." }
summary:
  ar: "قال مالك: إذا كان القوم جميعا في كتابة واحدة، لم يُعتق سيدهم أحدهم دون مؤامرة أصحابه الذين معه في الكتابة ورضاهم، وإن كانوا صغارا؛ فليست مؤامرتهم بشيء، ولا يجوز ذلك عليهم. فربما كان الرجل يسعى على القوم كلهم ويؤدي عنهم كتابتهم فيعمد السيد إلى من يؤدي عنهم فيعتقه، فيكون ذلك عجزا لمن بقي. وقد ذكر مالك نفي الضرر، وهذا أشد الضرر. {cite:muwatta-maruf-1997 p.363}"
  tr: "Malik şöyle demiştir: Eğer bir grup insan tek bir azat sözleşmesiyle bağlıysa, efendileri, diğer sözleşme taraflarının rızası ve onayı olmadan, aralarında reşit olmayanlar bile olsa, hiçbirini azat edemez. Onların anlaşması geçersizdir ve böyle bir şey onlara karşı caiz değildir. Örneğin, bir adam hepsi için çalışıyor ve azat ücretlerini ödüyor olabilir, sonra efendi, onlar için ödeme yapanı seçip azat eder ve böylece diğer kişileri haklarından mahrum bırakır. Malik, zararı önleme ilkesinden bahsetmiştir ve bu en büyük zarardır. {cite:muwatta-maruf-1997 s.363}"
  id: "Malik berkata: Jika sekelompok orang terikat oleh satu kontrak pembebasan, majikan mereka tidak dapat membebaskan siapa pun dari mereka tanpa persetujuan dan izin dari pihak-pihak lain yang terikat kontrak, bahkan jika mereka masih di bawah umur. Perjanjian mereka tidak sah, dan hal seperti itu tidak diperbolehkan terhadap mereka. Misalnya, seseorang mungkin bekerja untuk mereka semua dan membayar biaya pembebasan mereka, lalu majikan memilih orang yang membayar untuk mereka dan membebaskannya, sehingga merampas hak-hak individu yang tersisa. Malik menyebutkan prinsip mencegah kerugian, dan ini adalah kerugian terbesar. {cite:muwatta-maruf-1997 p.363}"
