text: |-
  ⁦(قشر)⁩
  ٣٨٧
  القرارة لتلا تحترق وقررت على رأسه دلوا من ماء بارد أى صيبت وقر الحديث فى اذنه يقره
  كانه صبه فيها وقريومنا من القرويوم قار وقروليلة قارة وقرة والقرار فى المكان الاستقبرار
  فيه تقول منه قررت بالمكان بالكسر أقرقرارا وقروت أيضا بالقتح أفرقراراوقرورا وقروت
  به عينا وقررت به عينا قرة وقرورافيه -ما ورجل قرير العين وقدقرت عينه تروتقرنقيض
  حنت وأقرالقه عينه أى أعطاه حتى تقر فلا تطمح الى من هوفوه ويقال حتى تبرد
  ولا تسنخن فللسر ورد معة باردة وللحزن دمصة حارة وقار ممقارة أى قرمعه وسكن
  وفى الحديث قاروا الصلاة هو من القرارلا من الوقار وأقز بالحق اعترف به وقرره بالحق غيره
  حتى أقروأقره فى مكانه فاستة روأقررت هذا الامر تقرارة وتقرة وأقرت الناقة اذائيت
  جلها عن ابن السكيت وأقره اللّٰه من القرفهومة رور على غير قياس كاأنه بنى على قر وتقرير.
  الانسان بالشى٣-له على الاقراربه وتقرير الشئ جعله فى قراره وقررت عنده الخبرحتى
  استقرّوفلان ما يتقار فى مكانه أوما يستقر واقترماء الفحل فى الرحم أى استقر واقتررت
  بالقرارة اتتدمت بها واقتررت القرارة اذا أخذت ما التصق بالقدر واقتررت بالرور
  غنسلت به واقترت الناقة سمنت قال أبوذؤيب يصف ظبية
  بها أبلت شهرى ربيع كليهما • فقدمارفيها نسؤها واقترارها
  نسؤهابد« سمنها وذلك انما يكون فى أوّل الربيع اذا أكلت الرطب واقترارهانهاية سمنها
  وذلك انما يكون اذا أكلت اليبيس وبزور الصحراء فعقدت عليها الشحم سر) قسره
  على الامر قسرا أكرهه عليه وقهره وكذلكْ اقتسره عليه وقسر بطن من يجيلة وهم رهط
  خالد بن عبد اللّه القسرى والقياسر والقياسرة الابل العظام قال الشاعر
  وعلى القياسر فى الخدور كواعب, • رج الروادف فااقياسر داف
  الواحد قيسرى وأماقول العجاج أطربا وأنت قنسرى • والدهر بالانسان دوّارى
  فهو الشيخ الكبير عن الاخفس ويروى قنسرى بكسر الذون والقسورنيت قال
  جبيها الاشجعى فى عنزله * لجأت كأنّ القسور الجون بجها • عساليجه والتامر المتناوح
  والقسور والقسورة الاسد قال اللّٰه تعالى فرت من قسورة ويقال هم الرماة من الصيادين
  وقنسرون بلد بالشام بكسر القاف والنون مشددة تكسر وتفتح وأنشد ثعلب بالفتح هذا
  البيت (لعكرمة العبسى
  سقى اللّه قتيانا ورانى زكتهم • بحاضر قسر ين من سبل القطر
  والنسبة اليه قنسرى وان شئت قنسري على مافسرناء فى نصيبين من ياب الباء ( شر
  القشرواحد القتور والقشرة أخص منه وقد قشرت العود وغيره أقشره وأقشره قشرا!
  نزعت عنه قشره وقشرته تقشيرا وفستق مقشر وانقشر العود وتقشر بعى والمطرة القاشرة
  التى تقشر وجه الارض والقاشرة أول الشهجاج لانها تقشر الجلد ولباس الرجل قشر.
  وفى حديث قيلة كنت اذار أيت رجلاذارواء وذاقشر طمح بصرى اليه وتم رقشر أى كثير
  و القشر ورجل أقشربين التشربائة ريك أى شديد الحرة والقاشور الذى يجى فى الحلبة آخر
  لم الحيسل وهو الفسكل والسكيت أيضا د القاشور المشوم وسنة قاشورة أى مجدية قال الراجز
  قوله فيهما أى فى الفعلين اللذين
  أحدهما كعلم والا خركضرب
