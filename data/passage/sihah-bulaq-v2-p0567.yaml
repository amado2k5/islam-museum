text: |-
  قول بعض الملوك هو المنذرين
  احرئ الفيس وقوله صاحبه هو
  حل بن زيدين عوف بن بكر بن
  وائل وقوله وخصاه يعنى بين يديه
  كما فى القاموس وكتب فى مادّة
  خضف وفارس خضاف وهم
  للجوهرى وأنت تراه لم يذكره على:
  ما فى النسخ التى يأيدينا وكذا لم
  نجده فى مأدة فرس اه مصحمه
  * ⁦(باب الفاء)⁩*
  كماقال آخر
  على حين ألهى الناس جلّ أمورهم * فند لازريق المال ندل الثعالب
  ولانه أضيف الى مالا يضاف الى مثله وه والفعل فلم يوفر حظه من الاعراب وخشفت رأسه
  بالحجرأى فضخته واللخشيف الثلج والخشوف من الرجال السريع وقال أبوعمر والخشف من
  الابل التى تسير بالليل الواحدخشوف وخاشف وخاشفة وأنشد
  بات يارى ورشات كالقطا * مجمهمات خشفاتحت السرى
  ورجل مخشف أى جرى«على الليل والخشاف اللخفاش ويقال انخطاف وخشاف بالفتح اسم
  الذر اق وسكل عراق مني التمفة والله حة إالتريك بلد أتتصل من القوص التودبذات
  خصف وخصاف وخصفة أيضا أبو حىّ من العرب وهو خصفة بن قيس عيسلان والاخصف
  الابيض انخاصرتين من الخيل والغنم وهو الذى ارتفع البلق من بطنه الى جنبيه والاخصف
  لون كلون الرمادفيه سواد وبيساض قال العجاج فى صفة الصبح
  أبدى الصباح عن بريم أخصفا • وحبل أخصف وظليم أخصف فيه - وادوبياض
  وكتيبة خصيف وهولون الحديد ويقال خصفت من ورائها بخيل أى ردفت فلهذا
  لم تدخلها الهاءلانم بابمعنى مفعولة فلو كانت للون الحديد لقالواخصيفة لانها بعنى فاعلة
  وكل لونين احتم عافهو خصيف والخصيف اللين الحايب يصبة عليه الرائب فان جعل فيه التمر
  والسمن فهو العو بثائى وقال :
  اذا ما الخصف العوبثانساءنا * تركنا.واخترنا السديف المسرهدا
  وخصفت النعل خرزتها فهى نعل خصيف وقوله تسالى وطفقا يخصفان عليهما من ورق الجنة
  يقول يلزقان بعضه ببعض ليسترابه عورتهما وك ذلك الاختصاف ومنه قرأ الحسن
  يخصفان الاأنه أدغم التاء فى الصادوحر"لذالخاء بالكسر لاجتماع الساكنين وبعضهم
  حوّل عليها حركة التاءففتحها حكاه الاخفس والخصف الاشفى وخصفت الناقة تخصف
  خصافا اذا ألقت ولدها وقد بلغ الشهر التاسع فهى خصوف ويقال الخصوف هى التى تنتج
  بعد الحول من مضر بهابشهر والجرور بشهرين وخصاف مثل قطام اسم فرس وفى المثل
  هو أبرأ من خاصى خصاف وذلك أن بعض الملوك طلبه من صاحبه ليستفحله فنعه اياه
  وخصاه (خضف خضف بها أى ردم وأنشد الاصمفى
  انا وجدنا خلفابتس الخلف * عبدا اذا مانا بالحمل خضف
  ومنه قيل للامة ياخضاف ( طف الخاف الاستلاب وقد خطفه بالكسر يخطفه
  خطفا وهى اللغة الجيدة وقيه لغة أخرى حكاها الاخفش خطف بالفتح يخطف وهى قليله
  رديثسة لا تسكاد تعرف وقد قرأج ايوأس فى قوله تعالى يخطف أبصارهمم واختطفه وتخطنجه
  بعنى وقرأ الحسن الامن خطف الخطفة بالتشديدير يداختطف فأدغم على ما نفسره فى باب
  اللام فى قتل وانخطاق طائر وانخطاف حديدة حجذاه تسكون فى جانى البكرة فيها المحوروكل
  حديدة جناء خطاف ومخاليب السباع خطاطيفها قال الشاعر
  ادا
