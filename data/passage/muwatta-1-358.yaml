label: { ar: "الموطأ 358 — صرع عن فرسه فصلى قاعداً: إنما جعل الإمام ليؤتم به", en: "Muwatta 358" }
text: "إنما جعل الإمام ليؤتم به، فإذا صلى قائماً فصلوا قياماً، وإذا ركع فاركعوا، وإذا رفع فارفعوا"
summary:
  ar: "أول حديث في باب صلاة الإمام وهو جالس. يرويه يحيى عن مالك عن ابن شهاب عن أنس بن مالك: ركب النبي فرساً فصُرع عنه فجُحش شقه الأيمن، فصلى صلاة من الصلوات وهو قاعد وصلوا وراءه قعوداً، فلما انصرف قال إن الإمام إنما جُعل ليؤتم به، فإذا صلى قائماً صلوا قياماً، وإذا ركع ركعوا، وإذا رفع رفعوا، وإذا قال سمع الله لمن حمده قالوا ربنا ولك الحمد، وإذا صلى جالساً صلوا جلوساً أجمعون. ويخرّجه المحقق عند البخاري (689) ومسلم (2/18) وأبي داود (601) والنسائي (2/98) والدارمي والشافعي من طرق أصحاب مالك، ويحيل على التمهيد (6/129). {cite:muwatta-maruf-1997 p.196}"
