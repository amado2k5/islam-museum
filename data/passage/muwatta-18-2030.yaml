label: { ar: "الموطأ 2030 — مالك: فيمن دفع إلى رجل مالا قراضا، فاستسلف منه المدفوع إليه المال مالا، واشترى به سلعة لنفسه: إن صاحب المال بالخيار، إن شاء شركه في السلعة على قراضها، وإن شاء خلى بينه وبينها، وأخذ منه رأس المال كله، وكذلك يفعل بكل من تعدى", en: "Muwatta 2030", es: "Muwatta 2030", fr: "Muwatta 2030", ur: "موطا 2030", tr: "El-Muvatta 2030 — Malik: Bir kimse, bir kişiye kâr paylaşımı karşılığında para verirse ve bu kişi daha sonra ondan borç alıp kendine mal alırsa: Parayı alan kişinin seçeneği vardır; isterse onu mallara kâr paylaşımı esasına göre ortak edebilir veya malları ona bırakıp tüm sermayeyi geri alabilir. Aynı durum, haddini aşan herkes için de geçerlidir.", id: "Al-Muwatta 2030 — Malik: Mengenai seseorang yang memberikan uang kepada orang lain dengan sistem bagi hasil, dan penerima kemudian meminjam uang darinya dan membeli barang untuk dirinya sendiri: pemilik uang memiliki pilihan; jika ia mau, ia dapat menjadikan penerima sebagai mitra dalam barang tersebut dengan sistem bagi hasil, atau ia dapat membiarkannya memiliki barang tersebut dan mengambil kembali seluruh modalnya. Hal yang sama berlaku bagi siapa pun yang melanggar." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فاستسلف منه المدفوع إليه المال مالا، واشترى به سلعة لنفسه: إن صاحب المال بالخيار؛ إن شاء شركه في السلعة على قراضها، وإن شاء خلى بينه وبينها، وأخذ منه رأس المال كله، وكذلك يفعل بكل من تعدى. {cite:muwatta-maruf-1997 p.230}"
  tr: "Malik, bir adamın başka bir adama kâr paylaşımı karşılığında para vermesi ve bu kişinin daha sonra ondan borç alıp kendine mal satın alması konusunda şöyle demiştir: Paranın sahibi seçme hakkına sahiptir; isterse onu kâr paylaşımı esasına göre mallara ortak edebilir, isterse de malları ona bırakıp tüm sermayeyi geri alabilir. Bu şekilde kural ihlal eden herkes için de aynı durum geçerlidir. {cite:muwatta-maruf-1997 s.230}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain dengan kesepakatan bagi hasil, dan penerima kemudian meminjam uang darinya dan membeli barang untuk dirinya sendiri: Pemilik uang memiliki pilihan; jika ia mau, ia dapat menjadikannya mitra dalam barang tersebut dengan dasar bagi hasil, atau jika ia mau, ia dapat membiarkannya memiliki barang tersebut dan mengambil kembali seluruh modalnya. Hal yang sama berlaku untuk siapa pun yang melakukan pelanggaran dengan cara ini. {cite:muwatta-maruf-1997 p.230}"
