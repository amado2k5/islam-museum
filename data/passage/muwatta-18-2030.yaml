label: { ar: "الموطأ 2030 — مالك: فيمن دفع إلى رجل مالا قراضا، فاستسلف منه المدفوع إليه المال مالا، واشترى به سلعة لنفسه: إن صاحب المال بالخيار، إن شاء شركه في السلعة على قراضها، وإن شاء خلى بينه وبينها، وأخذ منه رأس المال كله، وكذلك يفعل بكل من تعدى", en: "Muwatta 2030" }
