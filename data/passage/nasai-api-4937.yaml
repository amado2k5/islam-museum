label: { ar: "سنن النسائي 4937 — الأب والأبوة", en: "Sunan al-Nasa'i 4937 — the father and fatherhood", ur: "سنن نسائی 4937 — باپ اور والدیت", es: "Sunan al-Nasa'i 4937 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4937 — Le père et la paternité", tr: "Sunan an-Nasa'i 4937 — Baba ve Babalık", id: "Sunan an-Nasa'i 4937 — Sang Ayah dan Peran Ayah" }
text: "أَخْبَرَنِي هَارُونُ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنَا قُدَامَةُ بْنُ مُحَمَّدٍ، قَالَ أَنْبَأَنَا مَخْرَمَةُ، عَنْ أَبِيهِ، قَالَ سَمِعْتُ عُثْمَانَ بْنَ أَبِي الْوَلِيدِ، مَوْلَى الأَخْنَسِيِّينَ يَقُولُ سَمِعْتُ عُرْوَةَ بْنَ الزُّبَيْرِ، يَقُولُ كَانَتْ عَائِشَةُ تُحَدِّثُ عَنِ النَّبِيِّ يَقُولُ \" لاَ تُقْطَعُ الْيَدُ إِلاَّ فِي الْمِجَنِّ أَوْ ثَمَنِهِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4937، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4937 (The Book of Cutting off the Hand of the Thief), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4937، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4937 (El Libro de la Perdición del Ladrón), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4937 (Le Livre de la Main Coupée du Voleur), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 4937 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4937, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
