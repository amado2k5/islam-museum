label:
  ar: "أبو داود 1289 — يا ابن آدم لا تعجزني من أربع ركعات في أول نهارك"
  en: "Abu Dawud 1289 — Son of Adam, do not fail Me in four rak'as at the start of your day"
  ur: "ابو داود 1289 — اے ابن آدم، دن کے آغاز میں چار رکعتوں سے مجھے عاجز نہ کر"
text: "يقول الله عز وجل يا ابن آدم لا تعجزني من أربع ركعات في أول نهارك أكفك آخره ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 1289: يا ابن آدم لا تعجزني من أربع ركعات في أول نهارك. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 1289: Son of Adam, do not fail Me in four rak'as at the start of your day. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 1289: اے ابن آدم، دن کے آغاز میں چار رکعتوں سے مجھے عاجز نہ کر۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
