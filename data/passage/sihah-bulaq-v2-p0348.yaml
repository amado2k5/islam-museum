  فهومن صفة أشعث والمحال والحالة البصكرة العظيمة التى تستقى بها الابل وقال
  يردن والليل عرم طائره • ورد الحمال قلقت محاوره
  والحالة أيضا الفقارة والمممل بفتح الحاء مشتدا اللين الذى ذهب عنه حلاوة الحلب وتغير
  طعمه قليلا وقال
  ماذقت ثفلامنذعام أول • الامن القارص والممصل
  دل المدل بكسر اليم الرجل الخفىّ الشخص القليل اللحم بالدال والذال جيها وعدل
  بالمنديل لغة فى تندل ⁦(مذل)⁩ رجل مذل أى صغير لجنة -ثل مذل والمدل الباذل
  عنده من مال أوسرّ وكذلك اذ الم يقدر على ضبط نفسه قال الاسودين بعفر
  ولقد أروح الى التجارمر جلا • مذلا بمالى اينا أجيادى
  بذال مذلت بسرّى أمذل بالضم مذلا أى قلقت بدو فجرت حتى أهشيته وكذلك المذل
  بالتحر يك وقدم ذات بسرّى بالكسرومذلت من كلامه قلقت ومذلت رجعلى أيضامذلا
  ومذلا أى خدوت وأنشد أبوزيد
  وان مذت رجلى دعوتك أشتقى • بدءواك من مذل بها فيهون
  والامذلال الاسترخاء والفتور والمذل مثله والمذيل المريض الذى لا يتقارّ وهو ضعيف
  قال الراعى
  ما بال دفك بالفراش مذيلا • أقذى بعينك أم أردت رحيلا
  رجل ) الممرجل ضرب من ثياب الوشى قال العجاج* بشية كشية الممرجل *
  قال سيبويه مراجل ميمها من تقس الحرف وهى ثياب الوشى ⁦(مرطل)⁩ مرطله
  بالطين وغيره أى لطخه وقال • ثمغوثة أعراضهم عمرطله • سل ابن السكيت يقسال
  لسيل الماءمسل بالتحريك صل المصل معروف ومصل الاقط عملد وهوأن تجعن
  فى وعاء خوص أو غيره حتى بقطرماؤه والذى يسيل منه المصالة والمصالة أيضاقطارة الحب
  ومصل الجرح أى سال.نه شى بسبر و-كى الاممعى مصات استه اذا قطرت وأعطاه عطاء
  ما صلا أى قليلا وانه ليحاب من الناقة لينا ما صلا وأمصل مانه أى أفسده وصرفه فيما لا خير
  فبه وقال بعاتب امرأنه
  لعمرى لقد أمصلت مالى كاه • وماست من شئ فربك ماحقه
  وأمصت المرأة أى ألقت ولدها وهومضغة وأمصل الراعى الغنم اذا حلبها واستوعب
  مافيها وشاة عمصل وممصال وهى التى يصير لبنها متزيلا قبل أن يحقن ⁦(مطال)⁩. مطلت
  الحديدة أمطلها مطلا اذاضر بتها ومددتهالتطول وكل عدود عطول ومنه اشتقاق المطل
  بالدين وهو الليات به يقال مطله وماطله محقه والمماطلة فى المسكافحة ( عل معلت
  الشئ معلااذا اختلسته والمعل السرعة فى السير ومعلنى عن حاجتى وأمعلنى أى أعجانى أبو
  عمر ومعات الاروغيره معلاوه ومعول اذا استلت خصسيتاه ومعان أمرك أى عجات به
  وقطعته وأفسدته ويقال لا تمعلواركابكم أى لا نقطء وابعضها من بعض ⁦( مغل )⁩. مغل
  الداية بالسكسر يمغل مغلا اذا أصكل التراب مع البقل فاشتكى بطنه بقال به مغلة شديدة
