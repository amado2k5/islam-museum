label: { ar: "سنن أبي داود 4364 — ألبان الإبل وأبوالها", en: "Sunan Abi Dawud 4364 — camel milk and urine as treatment", ur: "سنن ابی داؤد 4364 — اونٹنی کا دودھ اور پیشاب", es: "Sunan Abi Dawud 4364 — Leche y orina de camella como tratamiento", fr: "Sunan Abi Dawud 4364 — le lait et l'urine de chamelle comme traitement", tr: "Sunan Abi Dawud 4364 — Deve sütü ve idrarı", id: "Sunan Abi Dawud 4364 — Susu dan air kencing unta" }
text: "… - قَدِمُوا عَلَى رَسُولِ اللَّهِ فَاجْتَوَوُا الْمَدِينَةَ فَأَمَرَ لَهُمْ رَسُولُ اللَّهِ بِلِقَاحٍ وَأَمَرَهُمْ أَنْ يَشْرَبُوا مِنْ أَبْوَالِهَا وَأَلْبَانِهَا فَانْطَلَقُوا فَلَمَّا صَحُّوا قَتَلُوا رَاعِيَ رَسُولِ اللَّهِ وَاسْتَاقُوا النَّعَمَ فَبَلَغَ النَّبِيَّ خَبَرُهُمْ مِنْ أَوَّلِ النَّهَارِ فَأَرْسَلَ النَّبِيُّ فِي آثَارِهِمْ فَمَا ارْتَفَعَ النَّهَارُ حَتَّى جِيءَ بِهِمْ فَأَمَرَ بِهِمْ فَقُطِعَتْ أَيْدِيهِمْ وَأَرْجُلُهُمْ وَسُمِّرَ أَعْيُنُهُمْ وَأُلْقُوا فِي الْحَرَّةِ يَسْتَسْقُونَ فَلاَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4364، يذكر ألبان الإبل وأبوالها. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4364 (Prescribed Punishments (Kitab Al-Hudud)), that mentions camel milk and urine as treatment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4364، جس میں اونٹنی کا دودھ اور پیشاب کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4364 (Castigos Prescritos (Kitab Al-Hudud)), menciona la leche y la orina de camella como tratamiento. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 4364 (Kitab Al-Hudud), mentionne l'utilisation du lait et de l'urine de chamelle comme remèdes. Le dictionnaire en ligne The Medicine Browser le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 4364 numaralı hadiste deve sütü ve idrarından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 4364, menyebutkan susu unta dan air kencing. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
