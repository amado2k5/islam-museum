text: "… عَنْ أَبِي إِسْحَاقَ، عَنْ قَيْسِ بْنِ سَكَنٍ، قَالَ : قَالَ ابْنُ مَسْعُودِ إِنَّكُمْ نَزَلْتُمْ أَرْضًا لَا يُقْصَبُ بِهَا الْمُسْلِمُونَ، إِنَّمَا هُمُ النَّبَطُ، أَوْ قَالَ : النَّبِيطُ وَفَارِسُ، فَإِذَا شَرَيْتُمْ لَحْمَا فَسَلُوا، فَإِنْ كَانَ ذَبِيحَةَ يَهُودِيِّ أَوْ نَصْرَانِيِّ فَكُلُوهُ، فَإِنَّ طَعَامَهُمْ …"
summary:
