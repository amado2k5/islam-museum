text: "… شهد بدراً والمشاهد، ومات بالمدينة سنة أربعين وهو ابن سَبْع وستين. وروى ابْنُ مَنْدَه بإسناد ضعيف عن الحارث بن خَزَمة، قال: بُعث النبي لَل له يُوم الاثنين. وروى ابْنُ أبِي دَاوُدَ في كتاب المَصَاحِفِ. من طريق ابن إسحاق: حدثني يحيى …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 667، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 667, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 667 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
