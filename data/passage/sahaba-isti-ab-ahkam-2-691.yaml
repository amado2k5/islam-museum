text: "… النجار. جماعة من ولده. قال أَبو عمر : هو أَبو محمَّد غلبت عليه كنيته، - مسعود بن عمرو الثقفي : روى عن وهو الَّذي زعم أنَّ الوتر واجب، فقال عبادة بن النّبيِّ وولة في كراهية السؤال. روى عنه سعيد بن …"
