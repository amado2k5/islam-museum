text: "… بن جندب وسعد أبو بلال بن مبعد فى آخرين عن النبى نحوه. فمن الطبقة الأولى من التابعين - أويس بن عامر القرنى سيد العباد، وعلم الاصفياء من الزهاد ؛ أويس بن عامر القرنى. بشر النى به، وأوصى به أصحابه. حدثنا …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 2، ص 79، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 2, p. 79, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 2، ص 79 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
