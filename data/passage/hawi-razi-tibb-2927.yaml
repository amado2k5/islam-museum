text: "… يجلو الأخلاط المرارية والمالحة. وقد قال فيما تقدم: إن العفص إذا خلط بالمر فمن شأنه أن يفعل هذه الأفعال، ولذلك صار هذا الدواء نافعاً لليرقان ووجع الكلى والطحال، وهو مع هذا مبرد. ولذلك متى خلط في الضماد مع دقيق الشعير …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 2927، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
