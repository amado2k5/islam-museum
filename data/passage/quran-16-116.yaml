text: "وَلَا تَقُولُوا۟ لِمَا تَصِفُ أَلْسِنَتُكُمُ ٱلْكَذِبَ هَـٰذَا حَلَـٰلٌ وَهَـٰذَا حَرَامٌ لِّتَفْتَرُوا۟ عَلَى ٱللَّهِ ٱلْكَذِبَ ۚ إِنَّ ٱلَّذِينَ يَفْتَرُونَ عَلَى ٱللَّهِ ٱلْكَذِبَ لَا يُفْلِحُونَ"
text_search: "ولا تقولوا لما تصف ألسنتكم الكذب هذا حلال وهذا حرام لتفتروا على الله الكذب ۚ إن الذين يفترون على الله الكذب لا يفلحون"
translations:
  en: { text: "And speak not, concerning that which your own tongues qualify (as clean or unclean), the falsehood: \"This is lawful, and this is forbidden,\" so that ye invent a lie against Allah. Lo! those who invent a lie against Allah will not succeed.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور یوں ہی جھوٹ جو تمہاری زبان پر آجائے مت کہہ دیا کرو کہ یہ حلال ہے اور یہ حرام ہے کہ خدا پر جھوٹ بہتان باندھنے لگو۔ جو لوگ خدا پر جھوٹ بہتان باندھتے ہیں ان کا بھلا نہیں ہوگا", translator: "Fateh Muhammad Jalandhari", license: PD }
