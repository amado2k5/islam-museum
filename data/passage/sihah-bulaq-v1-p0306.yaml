  يطأ جاريته الا ألحقت به وادها فمن شاء فليمسكها ومن شاء فليسمرها قال الامععى أراد التشمير
  بالشين فحوّله الى السين وهو الارسال والسم-رتلون الاسمرتة ول سمر بالضم وسمر أيضا
  بالكسر واسعارّ يسمار اسميرارامثله حكاها الفرّاء والسمراء الحنطة والاسمران الماء والبر
