label: { ar: "الأربعون 3 — بني الإسلام على خمس", en: "Arba'un 3 — Islam is built on five", es: "Arba'un 3 — El Islam se basa en cinco", fr: "Arba'un 3 — L'islam est fondé sur cinq", ur: "اربعون 3 - اسلام کی بنیاد پانچ پر ہے۔", tr: "Kırk Üç — İslam beş temel üzerine kuruludur", id: "Empat Puluh Tiga — Islam dibangun di atas lima" }
text: "بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا عبده ورسوله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان"
summary:
  ar: "حديث عبد الله بن عمر في أركان الإسلام، وهو الحديث الثالث في الأربعين النووية وفي شرح ابن رجب؛ رواه البخاري (8) ومسلم (16) من طرق عن عكرمة بن خالد وسعد بن عبيد ومحمد بن زيد عن ابن عمر، وأخرجه أحمد (2/143) والترمذي (2609) والنسائي وابن خزيمة وابن حبان وغيرهم، وروي أيضاً من حديث جرير بن عبد الله البجلي عند أحمد (4/363–364)؛ يبيّن ابن رجب أن الإسلام مبني على هذه الخمس كالبنيان على دعائمه، وأن الإيمان بالله ورسوله داخل في ضمن الإسلام ⁦(جامع العلوم والحكم ص 121–130)⁩."
  en: "Abdullah ibn Umar's hadith on the pillars of Islam, the third hadith of al-Nawawi's Forty and of Ibn Rajab's commentary; transmitted by al-Bukhari (8) and Muslim (16) through Ikrama ibn Khalid, Sa'd ibn Ubayd and Muhammad ibn Zayd from Ibn Umar, and also by Ahmad (2/143), al-Tirmidhi (2609), al-Nasa'i, Ibn Khuzayma, Ibn Hibban and others; a version from Jarir ibn Abdullah al-Bajali is transmitted by Ahmad (4/363–364). Ibn Rajab explains Islam as a structure resting on these five supports, with belief in God and His Messenger included within islam (Jami' al-Ulum wal-Hikam pp. 121–130)."
  es: "El hadiz de Abdullah ibn Umar sobre los pilares del Islam, el tercer hadiz de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; transmitido por al-Bujari (8) y Muslim (16) a través de Ikrama ibn Khalid, Sa'd ibn Ubayd y Muhammad ibn Zayd de Ibn Umar, y también por Ahmad (2/143), al-Tirmidhi (2609), al-Nasa'i, Ibn Khuzayma, Ibn Hibban y otros; una versión de Jarir ibn Abdullah al-Bajali es transmitida por Ahmad (4/363–364). Ibn Rajab explica el Islam como una estructura que se sustenta en estos cinco pilares, incluyendo la creencia en Dios y Su Mensajero (Jami' al-Ulum wal-Hikam, págs. 121–130)."
  fr: "Le hadith d'Abdullah ibn Umar sur les piliers de l'islam, le troisième des quarante hadiths d'al-Nawawi et du commentaire d'Ibn Rajab, a été transmis par al-Bukhari (8) et Muslim (16) par Ikrama ibn Khalid, Sa'd ibn Ubayd et Muhammad ibn Zayd d'après Ibn Umar, ainsi que par Ahmad (2/143), al-Tirmidhi (2609), al-Nasa'i, Ibn Khuzayma, Ibn Hibban et d'autres. Une version de Jarir ibn Abdullah al-Bajali a été transmise par Ahmad (4/363-364). Ibn Rajab explique l'islam comme une structure reposant sur ces cinq piliers, la croyance en Dieu et en Son Messager étant incluse dans l'islam (Jami' al-Ulum wal-Hikam, p. 121-130)."
  ur: "اسلام کے ستونوں پر عبداللہ بن عمر کی حدیث، نووی کی چالیس اور ابن رجب کی تفسیر کی تیسری حدیث۔ اسے البخاری (8) اور مسلم (16) نے عکرمہ بن خالد، سعد بن عبید اور محمد بن زید کے ذریعے ابن عمر سے نقل کیا ہے، اور احمد (2/143)، الترمذی (2609)، النسائی، ابن خزیمہ، ابن حبان اور دیگر نے بھی نقل کیا ہے۔ جریر بن عبداللہ البجلی کا ایک نسخہ احمد (4/363-364) نے نقل کیا ہے۔ ابن رجب نے اسلام کو ان پانچ تائیدوں پر قائم ایک ڈھانچے کے طور پر بیان کیا ہے، جس میں خدا اور اس کے رسول پر ایمان شامل ہے ⁦(جامع العلوم والحکم صفحہ 121-130)⁩۔"
  tr: "Abdullah bin Ömer'in İslam'ın rükünleri hakkındaki hadisi, İbn Receb'in açıklamasında ve El-Arba'in El-Neveviyye'de üçüncü hadis olarak yer almaktadır; bu hadis, İbn Ömer'den İkrime bin Halid, Saad bin Ubeyd ve Muhammed bin Zeyd'in rivayet zincirleriyle Buhari (8) ve Müslim (16) tarafından nakledilmiştir; ayrıca Ahmed (2/143), Tirmizi (2609), Nesai, İbn Huzeyme, İbn Hibban ve diğerleri tarafından da nakledilmiştir; ayrıca Ahmed'de (4/363-364) Cerir bin Abdullah el-Bajali'den de nakledilmiştir; İbn Receb, İslam'ın bu beş temel üzerine, bir binanın rükünleri üzerine kurulmuş gibi inşa edildiğini ve Allah'a ve Resulüne iman etmenin İslam'ın içinde yer aldığını açıklamaktadır (Cami' el-Ulum ve'l-Hikam, s. 121-130)."
  id: "Hadits Abdullah bin Omar tentang rukun Islam, yang merupakan hadits ketiga dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab; diriwayatkan oleh Al-Bukhari (8) dan Muslim (16) melalui sanad dari Ikrimah bin Khalid, Saad bin Ubaid dan Muhammad bin Zaid dari Ibn Omar, dan juga diriwayatkan oleh Ahmad (2/143), Al-Tirmidhi (2609), Al-Nasa’i, Ibn Khuzaimah, Ibn Hibban dan lainnya, dan juga diriwayatkan dari Jarir bin Abdullah Al-Bajali dalam Ahmad (4/363–364); Ibn Rajab menjelaskan bahwa Islam dibangun di atas lima rukun ini seperti bangunan di atas pilar-pilarnya, dan bahwa kepercayaan kepada Allah dan Rasul-Nya termasuk dalam Islam (Jami’ Al-‘Ulum wal-Hikam hlm. 121–130)."
