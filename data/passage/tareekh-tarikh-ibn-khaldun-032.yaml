text: "تحته إلى خاتمته نحيي ما أحيا ونميست ما أمات مما وجد الحكمان في كتاب الله. وهما أبو موسى عبد الله بن قيس وعمرو المفرقة. وأخذ الحكمان من علي ومعاوية ومن الجندين العهود والمواثيق أنهما آمنان على أنفسهما وأهليهما والأمة لهما"
