text: "… اسلحكم حدثنا محمد بن حاتم حدثي بشر ابن الحرث انبأنا عباد بن العوام عن هشام عن الحسن أن رجلاً أتسى النبي مل فقال أي الايمان أفضل قال الصبر والسماحة. حادثنا عبداللّه حدثني أبي حدثنا وكيع حدثنا أسامة بن زيد عن …"
summary:
