label: { ar: "جامع الترمذي 3586 — ضحك وتبسم", en: "Jami' al-Tirmidhi 3586 — laughter and smiling", ur: "جامع ترمذی 3586 — ہنسی اور تبسم", fr: "Jami' al-Tirmidhi 3586 — rire et sourire", es: "Jami' al-Tirmidhi 3586 — risa y sonrisa" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ حُمَيْدٍ، حَدَّثَنَا عَلِيُّ بْنُ أَبِي بَكْرٍ، عَنِ الْجَرَّاحِ بْنِ الضَّحَّاكِ الْكِنْدِيِّ، عَنْ أَبِي شَيْبَةَ، عَنْ عَبْدِ اللَّهِ بْنِ عُكَيْمٍ، عَنْ عُمَرَ بْنِ الْخَطَّابِ، قَالَ عَلَّمَنِي رَسُولُ اللَّهِ قَالَ قُلِ اللَّهُمَّ اجْعَلْ سَرِيرَتِي خَيْرًا مِنْ عَلاَنِيَتِي وَاجْعَلْ عَلاَنِيَتِي صَالِحَةً اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ صَالِحِ مَا تُؤْتِي النَّاسَ مِنَ الْمَالِ وَالأَهْلِ وَالْوَلَدِ غَيْرِ الضَّالِّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3586، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Jami' al-Tirmidhi, no. 3586, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "جامع ترمذی کی حدیث نمبر 3586، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Jami' al-Tirmidhi, n° 3586, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Jami' al-Tirmidhi, n.º 3586, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
