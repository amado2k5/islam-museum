summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع أبا الحباب سعيد بن يسار يقول: سمعت أبا هريرة يقول: سمعت النبي يقول: أُمرت بقرية تأكل القرى، يقولون: يثرب، وهي المدينة، تنفي الناس كما ينفي الكير خبث الحديد. ويذكر المحقق قول ابن عبد البر أن الصواب في الإسناد أنه عن سعيد بن يسار أبي الحباب، لا عن سعيد بن المسيب. {cite:muwatta-maruf-1997 p.464}"
