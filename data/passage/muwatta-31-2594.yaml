label: { ar: "الموطأ 2594 — أبو الحباب سعيد بن يسار عن أبي هريرة: المدينة تنفي الناس كما ينفي الكير خبث الحديد", en: "Muwatta 2594", es: "Muwatta 2594", fr: "Muwatta 2594", ur: "موطا 2594", tr: "El-Muvatta 2594 — Ebu el-Habab Said bin Yasar, Ebu Hurayra'dan rivayetle: Medine, körüğün demirden pislikleri atması gibi insanları dışarı atar.", id: "Al-Muwatta 2594 — Abu al-Habab Saeed bin Yasar berdasarkan Abu Hurairah: Madinah mengusir orang sebagaimana alat peniup api mengusir kotoran dari besi." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع أبا الحباب سعيد بن يسار يقول: سمعت أبا هريرة يقول: سمعت النبي يقول: أُمرت بقرية تأكل القرى، يقولون: يثرب، وهي المدينة، تنفي الناس كما ينفي الكير خبث الحديد. ويذكر المحقق قول ابن عبد البر أن الصواب في الإسناد أنه عن سعيد بن يسار أبي الحباب، لا عن سعيد بن المسيب. {cite:muwatta-maruf-1997 p.464}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Ebu el-Hubab Sa'id ibn Yasar'ın şöyle dediğini işittiğini aktarır: \"Ebu Hurayra'nın şöyle dediğini işittim: Peygamber'in şöyle dediğini işittim: Bana, diğer şehirleri fethedecek bir şehre gitmem emredildi. Onlar, 'Yathrib' derler ki, bu Medine'dir. O şehir, körüğün demirden pislikleri attığı gibi insanları kovacaktır.\" Araştırmacı, İbn Abd el-Barr'ın, doğru rivayet zincirinin Sa'id ibn Yasar Ebu el-Hubab'dan geldiği, Sa'id ibn el-Musayyab'dan gelmediği yönündeki ifadesinden bahsetmektedir. {cite:muwatta-maruf-1997 s.464}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar Abu al-Hubab Sa'id ibn Yasar berkata: Aku mendengar Abu Hurayrah berkata: Aku mendengar Nabi bersabda: Aku diperintahkan untuk pergi ke sebuah kota yang akan menaklukkan kota-kota lain. Mereka berkata: Yathrib, yaitu Madinah. Kota itu akan mengusir orang-orang seperti alat peniup api yang mengusir kotoran dari besi. Peneliti menyebutkan pernyataan Ibn 'Abd al-Barr bahwa sanad yang benar adalah dari Sa'id ibn Yasar Abu al-Hubab, bukan dari Sa'id ibn al-Musayyab. {cite:muwatta-maruf-1997 p.464}"
