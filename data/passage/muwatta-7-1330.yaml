label: { ar: "الموطأ 1330 — يحيى بن سعيد: رجل اطلع في قبر يحفر بالمدينة فقال بئس مضجع المؤمن، فقال النبي بئس ما قلت، فلا مثل للقتل في سبيل الله", en: "Muwatta 1330" }
text: "لَاَ مِثْلَ لِلْقَتْلِ في سَبِيلِ اللهِ"
summary:
  ar: "يروي مالك عن يحيى بن سعيد أن رسول الله كان جالسا، وقبر يحفر بالمدينة، فاطلع رجل في القبر فقال بئس مضجع المؤمن، فقال رسول الله بئس ما قلت، فقال الرجل إني لم أرد هذا يا رسول الله، إنما أردت القتل في سبيل الله، فقال رسول الله لا مثل للقتل في سبيل الله، ما على الأرض بقعة هي أحب إلي أن يكون قبري بها منها، ثلاث مرات. {cite:muwatta-maruf-1997 p.595}"
