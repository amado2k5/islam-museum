  جاوزت الناقة خسيسبتها وذلك فى السنة السادسة اذا ألقت ثنيتها وهى التى تجوز فى الضحابا
  والهدى ( خفس أخفس الرجل اذا قال أقبح ماقدر عليه ويقال شراب مخفس أى
  سريع الاسكار ويقال لهذه الدويبة خنفساء بفتح الفاء مدودة والاتى خنفساءة والخنفس
  لغة فيه والاتى خففة (خلس خلت الشى واختلته وتخلسته اذا استلبته
  والتخالم القسالب والاسم الخلة بالضم يقال الفرصة خلسة والخلسة أيضا الاسم من
  قواهم اختلس النبات اذا اختلط رطبه ويابسه وأخلس رأسه اذا خالط سواده
  البياض قال سويد الحارتى
  فتى قبل لم تعبس السن وجهه * سوى خلة فى الرأس كالبرق فى الدجا
  والخليس الاشمط وانظليس النبات الهائج خلبس الخلابس بضم الفاء الحديث
  الرقيق قال الكميت وأشهد منهن الحديت الخلابسا وربم قالواخلبسه وخلبسَ
  قلبه أى فتنه وذهب به كما يقال خلبه وليس يبعد أن يكون هو الاصل لان السين من حروف
  الزيادات وانخلابيس المتفرّقون ( خس الجسة عدديقال خمسة رجال وخس نسوة
  والتذ كيريالهاء وجاءفلان خامسا وخاميا أيضا وأنشدابن السكيت
  •ضى ثلاث سنين منذحل بها • وعام حات وهذا التابع اخامى
  والخمس بالكسر من اظماء الابل أن ترعى ثلاثة أيام وترد اليوم الرابع وقد أخمس الرجل أى
  وردت ابله خسا والابل خواءس والرجل مخس وأماقول شبيب بن عوانة
  عقيلة دلاه للحدضريحه * وأثوابه يبرقن والجمس مائج
  فعقيلة والخس رجلان وأخس القوم صارواخسة والخمس أيضابرد من بروداليمن قال
  أبوع ر وأوّل من عمله ملك باليمن يقال له خمس قال الاعشى يصف الارض
  يوماتراها كشبه أردية الخمس ويوما أديمها نغلا
  ويوم الجيس جمعه أخساء وأخسة والهيس الجيش لانهم خس فرق المقدمة والقلب والميمنة
  والميسرة والساق ألاترى الى قول الشاعر قديضرب الجيش الخيس الازورا
  صفة والجيس الثوب الذى طوله خس أذرع ومنه حديتمعاذرضى اللّٰه عنه اتتونى .
  بخميس أوابيس كأنه بعنى الصغسير من الثياب وكذلك المخموس مثل حرمح ومجروح وقتيل
  ومقتول قال عبيديصف ناقته
  هاتيك تحملنى وأيض صارما • ومذربا فى مارن مخمرص
  بعرمحاطول مارنه خس أذرع وخست القوم أخسه-م بالضم اذا أخذت منهم خسر
  أموالهم وخستهم أخمسهم بالكسراذا كنت خامسهم أوكلتهم خسة بنفت ونى مخمس أى
  له خسة أركان وحبل مخموس أى من خمس قوى وتقول عندى خسة دراهم الهاء مرفوعة
  وان شئت أدعمت لات الهاء من خسة تصيرتاء فى الوصل فقدغم فى الدال فان أدخلت الالف
  واللام فى الدراهم قلت عندى خسِسة الدراهم بضم الهاء ولا يجوز أن تدغم لانك قد أدغمت
  اللام فى الدال ولا يجوز أن تدغم الهاء من خسة وقد أدغمت مابعدها قال الشاعر
  مازال مذعقدت يدادازاره * فسا وأدرك خسة الاشبار
