text: "… على قوم بين أيديهم لحم في قدر نضج طيب ولحم آخر خبيث، فجعلوا يأكلون من الخبيث ويدعون النضج الطيب فقال : يا جبريل : من هؤلاء ؟ قال: هذا الذي يقوم وعنده امرأة حلالا طيباً فيأتي المرأة الخبيئة فتبيت معه …"
