label: { ar: "سنن النسائي 2220 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 2220 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 2220 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan al-Nasa'i 2220 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan al-Nasa'i 2220 — mentions de nations, de religions et de peuples non musulmans" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، عَنْ عَبْدِ الرَّحْمَنِ، قَالَ حَدَّثَنَا مَهْدِيُّ بْنُ مَيْمُونٍ، قَالَ أَخْبَرَنِي مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي يَعْقُوبَ، قَالَ أَخْبَرَنِي رَجَاءُ بْنُ حَيْوَةَ، عَنْ أَبِي أُمَامَةَ، قَالَ أَتَيْتُ رَسُولَ اللَّهِ فَقُلْتُ مُرْنِي بِأَمْرٍ آخُذُهُ عَنْكَ. قَالَ \" عَلَيْكَ بِالصَّوْمِ فَإِنَّهُ لاَ مِثْلَ لَهُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 2220، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2220 (The Book of Fasting), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 2220، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sunan al-Nasa'i, n.º 2220 (El Libro del Ayuno), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan al-Nasa'i, n° 2220 (Le Livre du jeûne), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
