text: "… وتزيل الترهّل والتربّل - - ويمنع انصباب المواد إلى القروح وينفع أصحاب العرق المديني -. والمياه النحاسية والحديدية والمالحة أيضاً تنفع من أمراض البرد والرطوبة ومن أوجاع المفاصل والنقرس والإسترخاء والربو وأمراض الكلى، وتقوي جبر الكسر وتنفع من الدماميل والقروح. …"
