label: { ar: "الموطأ 2704 — عبد الله بن عمر: النبي ينبذ خاتم الذهب فينبذ الناس خواتيمهم", en: "Muwatta 2704", es: "Muwatta 2704", fr: "Muwatta 2704", ur: "موطا 2704", tr: "El-Muvatta 2704 — Abdullah bin Ömer: Peygamber altın yüzüğünü attı, bunun üzerine insanlar da yüzüklerini attılar.", id: "Al-Muwatta 2704 — Abdullah bin Umar: Nabi membuang cincin emasnya, maka orang-orang pun membuang cincin mereka." }
summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أن رسول الله كان يلبس خاتما من ذهب، ثم قام رسول الله فنبذه وقال: لا ألبسه أبدا، فنبذ الناس خواتيمهم. {cite:muwatta-maruf-1997 p.525}"
  tr: "Malik, Abdullah ibn Dinar'dan, o da Abdullah ibn Umar'dan rivayet ettiğine göre, Allah Resulü altın bir yüzük takardı. Sonra Allah Resulü ayağa kalktı, yüzüğü attı ve \"Bunu bir daha asla takmayacağım\" dedi. Bunun üzerine insanlar da yüzüklerini attılar. {cite:muwatta-maruf-1997 s.525}"
  id: "Malik meriwayatkan dari Abdullah ibn Dinar, dari Abdullah ibn Umar, bahwa Rasulullah SAW biasa mengenakan cincin emas. Kemudian Rasulullah SAW berdiri, membuangnya, dan berkata, \"Aku tidak akan pernah memakainya lagi.\" Maka orang-orang pun membuang cincin mereka. {cite:muwatta-maruf-1997 p.525}"
