label: { ar: "الموطأ 2522 — عمر بن عبد العزيز: دية اليهودي والنصراني نصف دية الحر المسلم", en: "Muwatta 2522", es: "Muwatta 2522", fr: "Muwatta 2522", ur: "موطا 2522", tr: "El-Muvatta 2522 — Ömer ibn Abdülaziz: Bir Yahudi veya Hristiyan için ödenen kan parası, özgür bir Müslüman için ödenen kan parasının yarısıdır.", id: "Al-Muwatta 2522 — Umar ibn Abd al-Aziz: Uang darah untuk seorang Yahudi atau Kristen adalah setengah dari uang darah untuk seorang Muslim merdeka" }
summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن عمر بن عبد العزيز قضى أن دية اليهودي أو النصراني، إذا قُتل أحدهما، مثل نصف دية الحر المسلم. {cite:muwatta-maruf-1997 p.434}"
  tr: "Yahya, Malik'ten rivayetle, Ömer ibn Abdülaziz'in, bir Yahudi veya Hristiyan'dan biri öldürüldüğünde ödenecek kan parasının, özgür bir Müslüman için ödenecek kan parasının yarısı olduğuna hükmettiğini işittiğini aktarır. {cite:muwatta-maruf-1997 s.434}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Umar ibn Abd al-Aziz menetapkan bahwa uang darah untuk seorang Yahudi atau Kristen, jika salah satu dari mereka terbunuh, adalah setengah dari uang darah untuk seorang Muslim merdeka. {cite:muwatta-maruf-1997 p.434}"
