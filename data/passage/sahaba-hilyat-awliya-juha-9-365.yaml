text: "… كن ورعاً تكن أعبد الناس، وكن قانما تكن أشكر الناس، وأحب للناس ما تحب لنفسك تكن مؤمنا، وأحسن مجاورة من جاورك تكن مسلطا، وأقل الضحك فان كثرة الضحك عيت القاب."
summary:
  ar: "مقطع من حلية الأولياء وطبقات الأصفياء، المجلد المصوَّر 9، ص 365، فيه أدب المزاح وحدوده؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from Hilyat al-Awliya' wa-Tabaqat al-Asfiya', scan volume 9, p. 365, with the ethics and limits of jesting; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "حلیۃ الاولیاء و طبقات الاصفیاء، اسکین جلد 9، ص 365 کا اقتباس جس میں مزاح کے آداب اور حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volume numérisé 9, p. 365, avec l'éthique et les limites de la plaisanterie ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de Hilyat al-Awliya' wa-Tabaqat al-Asfiya', volumen escaneado 9, p. 365, con la ética y los límites de la broma; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Hilyat al-Awliya' wa Tabaqat al-Asfiya' adlı resimli cilt 9'un 365. sayfasından, mizahın adabı ve sınırlarını ele alan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Hilyat al-Awliya' wa Tabaqat al-Asfiya', jilid bergambar 9, halaman 365, yang membahas etika dan batasan humor; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Disusun oleh Juha dan Islamic Folklore Browser."
