label: { ar: "صحيح البخاري 3012 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3012 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3012 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3012 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3012 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا الزُّهْرِيُّ، عَنْ عُبَيْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، عَنِ الصَّعْبِ بْنِ جَثَّامَةَم ـ قَالَ مَرَّ بِيَ النَّبِيُّ بِالأَبْوَاءِ ـ أَوْ بِوَدَّانَ ـ وَسُئِلَ عَنْ أَهْلِ الدَّارِ يُبَيَّتُونَ مِنَ الْمُشْرِكِينَ، فَيُصَابُ مِنْ نِسَائِهِمْ وَذَرَارِيِّهِمْ قَالَ \" هُمْ مِنْهُمْ \". وَسَمِعْتُهُ يَقُولُ \" لاَ حِمَى إِلاَّ لِلَّهِ وَلِرَسُولِهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3012، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3012 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3012، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 3012 (La lucha por la causa de Alá (Yihad)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 3012 (Combat pour la cause d'Allah (Jihad)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
