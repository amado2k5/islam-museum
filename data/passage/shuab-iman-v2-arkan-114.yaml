text: "… كُلْ يا مغموم فدخل سائل وقال: أطعمونا شيئاً فأخذ ثلاثة أرغفة مع تمر فدفعها إليه وأعطاني ثلاثة وأكل رغيفين وقال المؤاسباة من أخلاق المؤمنين. - أخبرنا أبو عبد الرحمن السلمي، قال: سمعت أبا بكر محمد بن أحمد البلخي يقول: سمعت …"
