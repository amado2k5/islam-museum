text: "… كُلْ يا مغموم فدخل سائل وقال: أطعمونا شيئاً فأخذ ثلاثة أرغفة مع تمر فدفعها إليه وأعطاني ثلاثة وأكل رغيفين وقال المؤاسباة من أخلاق المؤمنين. - أخبرنا أبو عبد الرحمن السلمي، قال: سمعت أبا بكر محمد بن أحمد البلخي يقول: سمعت …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 114، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 114, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 114 کا اقتباس جس میں مومن کی خصلتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Shu'ab al-Iman de al-Bayhaqi, vol. 2, pág. 114, que menciona las características del creyente; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Shu'ab al-Iman d'al-Bayhaqi, tome 2, page 114, mentionnant les caractéristiques du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 114. sayfasından, müminin özelliklerini anlatan bir bölüm; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu metin, İslam'ın temelleri, imanın esasları, iman dalları ve müminin özellikleri hakkındaki girişleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 114, yang menyebutkan ciri-ciri seorang mukmin; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup entri tentang rukun Islam, rukun iman, cabang-cabang iman, dan ciri-ciri seorang mukmin."
