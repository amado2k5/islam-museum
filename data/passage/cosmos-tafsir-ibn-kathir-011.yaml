text: "جبلان متناوحان بينهما ثُغْرةٌ يخرج مِنْهَا يأجوج ومأجوج علىٰ بلاد الترك، فيَعِيثُون فيهم فسادًا، ويهلكون الحرث والنَّسل."
summary:
  ar: "يصف ابن كثير الموضع الذي بلغه ذو القرنين بأنه جبلان متقابلان بينهما ثغرة يخرج منها يأجوج ومأجوج على بلاد الترك فيفسدون ويهلكون الحرث والنسل، ثم يؤكد في الصفحة نفسها أنهم من ذرية آدم استناداً إلى حديث الصحيحين في بعث النار."
  en: "Ibn Kathir describes the place Dhu al-Qarnayn reached as two facing mountains with a gap from which Gog and Magog come out against the lands of the Turks, ruining crops and livestock. On the same page he affirms that they descend from Adam, citing the hadith in the two Sahihs about the portion sent to the Fire."
