text: "جبلان متناوحان بينهما ثُغْرةٌ يخرج مِنْهَا يأجوج ومأجوج علىٰ بلاد الترك، فيَعِيثُون فيهم فسادًا، ويهلكون الحرث والنَّسل."
summary:
  ar: "يصف ابن كثير الموضع الذي بلغه ذو القرنين بأنه جبلان متقابلان بينهما ثغرة يخرج منها يأجوج ومأجوج على بلاد الترك فيفسدون ويهلكون الحرث والنسل، ثم يؤكد في الصفحة نفسها أنهم من ذرية آدم استناداً إلى حديث الصحيحين في بعث النار."
  en: "Ibn Kathir describes the place Dhu al-Qarnayn reached as two facing mountains with a gap from which Gog and Magog come out against the lands of the Turks, ruining crops and livestock. On the same page he affirms that they descend from Adam, citing the hadith in the two Sahihs about the portion sent to the Fire."
  es: "Ibn Kathir describe el lugar al que llegó Dhu al-Qarnayn como dos montañas enfrentadas con una brecha por la que Gog y Magog emergieron contra las tierras de los turcos, devastando las cosechas y el ganado. En la misma página afirma que descienden de Adán, citando el hadiz de los dos Sahih sobre la porción enviada al Fuego."
  fr: "Ibn Kathir décrit le lieu où Dhu al-Qarnayn parvint comme deux montagnes se faisant face, séparées par une brèche d'où Gog et Magog surgissent pour attaquer les terres des Turcs, ravageant les récoltes et le bétail. Sur la même page, il affirme qu'ils descendent d'Adam, citant le hadith des deux recueils authentiques (Sahihs) concernant la part d'âmes envoyée en Enfer."
  ur: "ابن کثیر نے ذوالقرنین کے مقام کو دو آمنے سامنے والے پہاڑوں کے طور پر بیان کیا ہے جہاں سے یاجوج ماجوج ترکوں کی زمینوں کے خلاف نکل کر فصلوں اور مویشیوں کو برباد کرتے ہیں۔ اسی صفحہ پر وہ جہنم میں بھیجے جانے والے حصے کے بارے میں دو صحیحوں میں حدیث کا حوالہ دیتے ہوئے تصدیق کرتا ہے کہ وہ آدم سے نازل ہوئے ہیں۔"
  tr: "İbn Kathir, Zülkarneyn'in ulaştığı yeri, aralarında bir boşluk bulunan, karşılıklı iki dağ olarak tanımlar; bu boşluktan Gog ve Magog, Türklerin topraklarına girer, ekinleri ve nesilleri bozarlar ve yok ederler. Daha sonra aynı sayfada, cehennemin dirilişiyle ilgili iki Sahih hadise dayanarak, onların Âdem soyundan olduklarını doğrular."
  id: "Ibn Kathir menggambarkan tempat yang dicapai Dzul-Qarnayn sebagai dua gunung yang saling berhadapan dengan celah di antaranya, dari mana Gog dan Magog muncul ke tanah bangsa Turki, merusak dan menghancurkan tanaman dan keturunan. Kemudian, pada halaman yang sama, ia menegaskan bahwa mereka adalah keturunan Adam, berdasarkan hadits dari dua kitab Sahih tentang kebangkitan dari Neraka."
