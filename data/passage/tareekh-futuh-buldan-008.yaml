text: "لى اعدائهم ، وكان كتاب صلح دبيل : بسم الله الرحمن الرحيم ، هذا كتاب من حبيب بن مسلمة، لنصارى اهل دبين ومجوسها ويهودها، شاهدهم وغائبهم اني أمنتكم على انفسهم، وأموالكم، وكنائسكم ، وبيعكم، وسور مدينتكم، فانتم آمنون ، وعلينا"
