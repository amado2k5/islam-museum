text: "… به، وقال بعضهم : يهتف العلم بالعمل فإن أجابه وإلا ارتحل. وقد أورد العلامة ابن القيم في كتابه القيم مفاتح دار السعادة أربعين وجها لفضل العلم على المال نذكر بعضها مختصرًا. العلم ميراث الأنبياء والمال ميراث الملوك والأغنياء. العلم يحرس …"
