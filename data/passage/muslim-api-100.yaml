label: { ar: "صحيح مسلم 100 — تعريف الإسلام بأعماله", en: "Sahih Muslim 100 — Islam defined by its acts", ur: "صحیح مسلم 100 — اسلام کی تعریف اس کے اعمال سے", es: "Sahih Muslim 100 — El Islam definido por sus actos", fr: "Sahih Muslim 100 — L'islam défini par ses actes" }
text: "… دَوِيَّ صَوْتِهِ وَلاَ نَفْقَهُ مَا يَقُولُ حَتَّى دَنَا مِنْ رَسُولِ اللَّهِ فَإِذَا هُوَ يَسْأَلُ عَنِ الإِسْلاَمِ فَقَالَ رَسُولُ اللَّهِ \" خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ \". فَقَالَ هَلْ عَلَىَّ غَيْرُهُنَّ قَالَ \" لاَ. إِلاَّ أَنْ تَطَّوَّعَ وَصِيَامُ شَهْرِ رَمَضَانَ \". فَقَالَ هَلْ عَلَىَّ غَيْرُهُ فَقَالَ \" لاَ. إِلاَّ أَنْ تَطَّوَّعَ \". وَذَكَرَ لَهُ رَسُولُ اللَّهِ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 100، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 100 (The Book of Faith), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 100، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 100 (El Libro de la Fe), menciona el Islam definido por sus actos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih Muslim, n° 100 (Le Livre de la Foi), mentionne que l'islam est défini par ses actes. Le moteur de recherche « Piliers et Branches de la Foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
