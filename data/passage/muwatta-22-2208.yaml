label: { ar: "الموطأ 2208 — يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار: أن ثابت بن الضحاك الأنصاري أخبره أنه وجد بعيرا بالحرة فعقله، ثم ذكره لعمر بن الخطاب، فأمره أن يعرفه ثلاث مرات، فقال: إنه قد شغلني عن ضيعتي، فقال عمر: أرسله حيث وجدته", en: "Muwatta 2208", es: "Muwatta 2208", fr: "Muwatta 2208", ur: "موطا 2208", tr: "El-Muvatta 2208 — Yahya, Malik'ten, o da Yahya ibn Said'den, o da Süleyman ibn Yasar'dan rivayet eder ki: Sabit ibn el-Dahhak el-Ensari, Harrah'ta bir deve bulduğunu ve onu bağladığını bildirdi. Sonra bunu Ömer ibn el-Hattab'a anlattı ve Ömer ona bunu üç defa duyurmasını emretti. Sabit ibn el-Dahhak el-Ensari, \"Beni tarlamdan uzaklaştırdı\" dedi. Ömer, \"Onu bulduğun yerde serbest bırak\" dedi.", id: "Al-Muwatta 2208 — Yahya, dari Malik, dari Yahya ibn Saeed, dari Sulayman ibn Yasar: bahwa Thabit ibn al-Dahhak al-Ansari memberitahunya bahwa ia menemukan seekor unta di al-Harrah dan mengikatnya. Kemudian ia menceritakannya kepada Umar ibn al-Khattab, yang memerintahkannya untuk mengumumkannya tiga kali. Ia berkata: Unta itu telah mengganggu ladangku. Umar berkata: Lepaskanlah di tempat kau menemukannya." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار أن ثابت بن الضحاك الأنصاري أخبره أنه وجد بعيرا بالحرة، فعقله، ثم ذكره لعمر بن الخطاب. فأمره عمر أن يعرفه ثلاث مرات. فقال له ثابت: إنه قد شغلني عن ضيعتي. فقال له عمر: أرسله حيث وجدته. {cite:muwatta-maruf-1997 p.305}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet eder ki, Sabit ibn el-Dahhak el-Ensari ona lav tarlasında bir deve bulduğunu, onu bağladığını ve sonra Ömer ibn el-Hattab'a haber verdiğini anlatmıştır. Ömer ona bunu üç defa duyurmasını emretmiştir. Sabit ona: \"Beni tarlamdan uzaklaştırdı\" demiştir. Ömer ona: \"Onu bulduğun yerde serbest bırak\" demiştir. {cite:muwatta-maruf-1997 s.305}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Thabit ibn al-Dahhak al-Ansari mengatakan kepadanya bahwa ia menemukan seekor unta di ladang lava, lalu ia mengikatnya, kemudian menceritakannya kepada Umar ibn al-Khattab. Umar memerintahkannya untuk mengumumkannya tiga kali. Thabit berkata kepadanya: Unta itu telah mengganggu pekerjaanku di ladang. Umar berkata kepadanya: Lepaskanlah di tempat kau menemukannya. {cite:muwatta-maruf-1997 p.305}"
