label: { ar: "الموطأ 2208 — يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار: أن ثابت بن الضحاك الأنصاري أخبره أنه وجد بعيرا بالحرة فعقله، ثم ذكره لعمر بن الخطاب، فأمره أن يعرفه ثلاث مرات، فقال: إنه قد شغلني عن ضيعتي، فقال عمر: أرسله حيث وجدته", en: "Muwatta 2208" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد عن سليمان بن يسار أن ثابت بن الضحاك الأنصاري أخبره أنه وجد بعيرا بالحرة، فعقله، ثم ذكره لعمر بن الخطاب. فأمره عمر أن يعرفه ثلاث مرات. فقال له ثابت: إنه قد شغلني عن ضيعتي. فقال له عمر: أرسله حيث وجدته. {cite:muwatta-maruf-1997 p.305}"
