text: |-
  ٤٨٦
  فصل الرام).
  .⁦(دتا)⁩.
  ايم موضع والمركو الحوض الإكبير والجرموز الصغير قال الراجز
  السجل والنطفة والذنوب • حتى ترى مركوهايئوب
  يقول أستق تارة ذنوبا وتارة نطفة حتى يرجع الحوض ملان كم كار قبل أن يشرب
  وأركيت اليسه أى لجأت قال أبو عمر ويقال للغريم اركنى الى كذاوكذا أى أخرتى وركوت
  الحمل على البعير ضاعفته وركوت عسلى فلان الذنب أى ورّكته وركوت بقية يومى أى أقت
  ابن الاعرابى ركوت الشئ أركوه اذاشددته وأصلحته قال سويد
  قدع عنت قوماقد كفوك شؤنهم • وشأنك ان لإتركد يتفاقم
  وأركيت لبنى فلان جندا أى هيأنه لهم قال الفراء أركيت عليه الذنب والامر أى ورّكته
  وأنا مرتك على كذا أى معوّل عليه ومالى مرتكى الاعليك ⁦(رمى)⁩ رميت الشئء من
  يدى أى آلقمته فارتمى ورمت بالسهم رمساورماية وراسته مراماة ورماء وارتمينا وتزامين
  وكانت بيتهم رمّيا ثم صاروا الى جيزى أبو عبيدة رمى اللّٰه لك أى نصرك وصنع لك ابن السكين
  رميت عن القوس ورميت عليها قال ولا تقل رحيت بها قال الراجز
  أرمى عليهاوهى فرع أجع * وهى ثلاث أدرع واصبح
  قال ويقال خرجت أترقى اذ اخرجت ترمى فى الاغراض وفى أصول الشهجر وخزجت أرتى
  اذا رميت القنص ورميت على الجسين وأرميت أيضا أى زدت قال حاتم طي
  وأسمر خطيا كأنّ حكعوبه * نوى القسب قد أرمى ذراعاعلى العشر
  وتقول للمرأة أنت تزمين وأنتن تزمين الواحد والهاعة سواء والرماء بالفتح والمدّالربا وأرمى
  فلان أى أربى قال عمررضى اللّٰه عنه لا تشتروا الذهب بالنعضة الايدابيد هاوها انى أخاف
  عليكم الزماء قال الكسائىّ هو مدود وترامى الجرح الى الفسادويقال طعنه فأ وماه عن
  فرسه أى ألقاه عن ظهرداته كمايقال أذراء وأرميت الجرمن يدى أى ألقيت ويقال
  سايه فارمى عليه أى زاد والرمية الصيدير مى يقال بئس الرمية الارنب أى بئس الشئمما
  يرمى الارنب واغماياءت بالها لانهاصارت فى عداد الاسماء وليس هو على رميت فهى
  مرمية وعدل به الى فعيل وانماهو بئس الشىء فى نفسه مماير مى الارنب أبو عمر والمرماة
  مثل السروة وهو نصل مدوّر للسهم وأما الذى فى الحديث لوأن أحدهم دعى الى حرماقين
  لاجاب وهولا يجيب الصلاة فيقال المرماة الظلف وقال أبو عبيدهوما بين ظلق الشاة قال
  ولا أدرى ماوجهم الاأنه هكذا يفسر والرمى السقىّ وهى السحابة العظيمة القطر الشديدة
  الوقع من مدائب الحيم والخريف والجمع أرمية وأسقية عن الاصمعى ومنه قول أبى ذؤيب
  يصف عسلا يمانية أحمالها مظ مائد * وآل قراس صوب أرمية كل
  ويروى أسقية نا رنا اليمير نورتوا اذا أدام النظرية سال ظلّ دانيا وأرناه غيره
  ويقال أونانى حسن ما رأيت أى حلى على الرنوّ وكأس رنوناة أى دائمة ساكنة
  ووزنه افعلعسلة قال ابن أحر
  بنت عليها اللك أطنابها • كأس رنوناة وطرف طعر
  يقال انه لم يسمع الامنه وفلان رنوّفلانة اذا كان يديم النظر اليها ورجل رناه بالتشديد للذى
