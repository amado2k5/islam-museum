text: "أمراض الرأس في السكتة والفالج والخدر والرحشة... الخ قليلٍ، وإذا أمكن فليكن أول علاجك الفصد كما فعل حذّاق الأطبّاء فإنك تخفّف بذلك عن جملة البدن، والحمى دواءً عجيبٌ له لأنها تسخّن وتذهب البلغم. لي أبلغ علاجه الجوع والاستفراغ والسهر والحركة. …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 21، يذكر الطب والطبيب، والمرض والمريض، وأسماء الأمراض، والبيمارستان وصناعة الطب، والعلاج، والجراحة والختان والجبائر، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 21, that mentions medicine and the physician, illness and the sick, named diseases, the hospital and the medical craft, treatment, surgery, circumcision and splints, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 21 کا اقتباس جس میں طب اور طبیب، بیماری اور بیمار، بیماریوں کے نام، بیمارستان، علاج، جراحت، ختنہ اور پٹیاں، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
