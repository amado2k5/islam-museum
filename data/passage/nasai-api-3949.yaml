label: { ar: "سنن النسائي 3949 — الأب والأبوة", en: "Sunan al-Nasa'i 3949 — the father and fatherhood", ur: "سنن نسائی 3949 — باپ اور والدیت" }
text: "أَخْبَرَنَا أَبُو بَكْرِ بْنُ إِسْحَاقَ الصَّغَانِيُّ، قَالَ حَدَّثَنَا شَاذَانُ، قَالَ حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ \" يَا أُمَّ سَلَمَةَ لاَ تُؤْذِينِي فِي عَائِشَةَ فَإِنَّهُ وَاللَّهِ مَا أَتَانِي الْوَحْىُ فِي لِحَافِ امْرَأَةٍ مِنْكُنَّ إِلاَّ هِيَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3949، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3949 (The Book of the Kind Treatment of Women), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3949، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
