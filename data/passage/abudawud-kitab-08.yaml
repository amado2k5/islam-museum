summary:
  ar: "القسم 8 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الوتر»، ويضم فيها النصوص من 1416 إلى 1555 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 8 of Sunan Abi Dawud (Prayer (Kitab Al-Salat): Detailed Injunctions about Witr) in the division of the open hadith dataset the museum took its reports from: reports 1416 to 1555 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 8، عنوان «کتاب الوتر»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1416 تا 1555۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 8 de Sunan Abi Dawud (Oración (Kitab Al-Salat): Preceptos detallados sobre el Witr) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1416 al 1555 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du recueil ouvert Sunan Abi Dawud (La Prière (Kitab Al-Salat): Instructions détaillées concernant la prière de Witr), dans sa section 1416 à 1555. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 8. bölümü, açık hadis veritabanına dahil edilmiş olup \"Vitr Kitabı\" başlığını taşımaktadır. Bu bölüm, 1416 ile 1555 yılları arasında numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 8 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi basis data hadits terbuka dan diberi judul \"Kitab Witir.\" Bagian ini berisi teks-teks bernomor 1416 hingga 1555. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
