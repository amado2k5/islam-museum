text: "خطاب فقال عمر: قال رسول الله ٤٤) ((ما أحرز)) - الحديث قال: فكتب له كتابا فيه شهادة عبد الرحن بن عوف، وزيد بن ثابت ورجل آخر . والحديث دليل على أن الولاء لا يورث. وفيه خلاف، وتظهر فائدة الخلاف فيما"
