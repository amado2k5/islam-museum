text: "وَلَوْ شَآءَ ٱللَّهُ لَجَعَلَكُمْ أُمَّةً وَٰحِدَةً وَلَـٰكِن يُضِلُّ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَ"
text_search: "ولو شاء الله لجعلكم أمة واحدة ولكن يضل من يشاء ويهدي من يشاء ۚ ولتسألن عما كنتم تعملون"
translations:
  en: { text: "Had Allah willed He could have made you (all) one nation, but He sendeth whom He will astray and guideth whom He will, and ye will indeed be asked of what ye used to do.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور اگر خدا چاہتا تو تم (سب) کو ایک ہی جماعت بنا دیتا۔ لیکن وہ جسے چاہتا ہے گمراہ کرتا ہے اور جسے چاہتا ہے ہدایت دیتا ہے۔ اور جو عمل تم کرتے ہو (اُس دن) اُن کے بارے میں تم سے ضرور پوچھا جائے گا", translator: "Fateh Muhammad Jalandhari", license: PD }
