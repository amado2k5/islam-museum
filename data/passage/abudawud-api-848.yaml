label: { ar: "سنن أبي داود 848 — مغفرة ما تقدم من الذنب", en: "Sunan Abi Dawud 848 — forgiveness of past sins", ur: "سنن ابی داؤد 848 — پچھلے گناہوں کی مغفرت", es: "Sunan Abi Dawud 848 — perdón de los pecados pasados", fr: "Sunan Abi Dawud 848 — pardon des péchés passés", tr: "Sunan Abi Davud 848 — Geçmiş günahların bağışlanması", id: "Sunan Abi Dawud 848 — Pengampunan dosa masa lalu" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ السَّمَّانِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ قَالَ \" إِذَا قَالَ الإِمَامُ سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ فَقُولُوا اللَّهُمَّ رَبَّنَا لَكَ الْحَمْدُ فَإِنَّهُ مَنْ وَافَقَ قَوْلُهُ قَوْلَ الْمَلاَئِكَةِ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 848، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan Abi Dawud, no. 848 (Prayer (Kitab Al-Salat)), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن ابی داؤد کی حدیث نمبر 848، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan Abi Dawud, n.° 848 (Oración (Kitab Al-Salat)), que habla del perdón de los pecados pasados. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan Abi Dawud, n° 848 (La Prière), évoque le pardon des péchés passés. Le Livre des Hasanat et Sayyi'at le répertorie parmi les textes qui comptabilisent, inscrivent, effacent ou pèsent un acte."
  tr: "Sunan Ebu Davud'da yer alan 848 numaralı hadis, geçmiş günahların affedilmesinden bahsetmektedir. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, amelleri sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 848, menyebutkan pengampunan dosa-dosa masa lalu. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan."
