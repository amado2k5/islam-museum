label: { ar: "الموطأ 1993 — مالك: الأمر المجتمع عليه أن من استسلف شيئا من الحيوان بصفة وتحلية معلومة، فلا بأس بذلك وعليه أن يرد مثله، إلا ما كان من الولائد، فإنه يخاف فيه الذريعة إلى إحلال ما لا يحل", en: "Muwatta 1993", es: "Muwatta 1993", fr: "Muwatta 1993", ur: "موطا 1993", tr: "Al-Muwatta 1993 — Malik: Görüş birliği şudur ki, bir kimse bilinen bir tanımı ve durumu olan bir hayvanı ödünç alırsa, bunda bir sakınca yoktur ve yavrular hariç, aynısını iade etmelidir; çünkü yavruların iade edilmesi, caiz olmayan bir şeye izin verilmesine yol açabileceğinden korkulmaktadır.", id: "Al-Muwatta 1993 — Malik: Konsensusnya adalah jika seseorang meminjam hewan dengan deskripsi dan kondisi yang diketahui, tidak ada salahnya, dan dia harus mengembalikan hewan yang setara, kecuali anak-anaknya, karena ada kekhawatiran bahwa hal ini dapat menyebabkan diperbolehkannya sesuatu yang tidak diperbolehkan." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن من استسلف شيئا من الحيوان بصفة وتحلية معلومة، فإنه لا بأس بذلك، وعليه أن يرد مثله، إلا ما كان من الولائد، فإنه يخاف في ذلك الذريعة إلى إحلال ما لا يحل، فلا يصلح. وتفسير ما كره من ذلك: أن يستسلف الرجل الجارية، فيصيبها ما بدا له، ثم يرده إلى صاحبها بعينها، فذلك لا يصلح ولا يحل، ولم يزل أهل العلم ينهون عنه، ولا يرخصون فيه لأحد. {cite:muwatta-maruf-1997 p.215} {cite:muwatta-maruf-1997 p.216}"
  tr: "Malik şöyle dedi: Aramızdaki görüş birliği şudur ki, bir kimse bilinen bir tanımı ve durumu olan bir hayvanı ödünç alırsa, bunda bir sakınca yoktur ve genç dişi köleler hariç, onun karşılığını iade etmelidir. Çünkü bu durumda, haram olanın helal kılınmasına yol açabileceğinden korkulmaktadır, bu nedenle caiz değildir. Bu konuda hoş karşılanmayan şeyin açıklaması şudur: Bir erkek genç bir dişi köleyi ödünç alır, onunla istediğini yapar ve sonra onu sahibine olduğu gibi iade ederse, bu caiz değildir. Alimler bunu her zaman yasaklamış ve kimseye bunu yapmasına izin vermemiştir. {cite:muwatta-maruf-1997 s.215} {cite:muwatta-maruf-1997 s.216}"
  id: "Malik berkata: Konsensus di antara kami adalah bahwa jika seseorang meminjam hewan dengan deskripsi dan kondisi yang diketahui, tidak ada yang salah dengan itu, dan dia harus mengembalikannya dalam keadaan yang sama, kecuali untuk budak perempuan muda. Karena dalam hal itu, ada kekhawatiran bahwa hal itu dapat menyebabkan diperbolehkannya sesuatu yang dilarang, sehingga tidak diperbolehkan. Penjelasan mengapa hal itu tidak disukai adalah bahwa jika seorang pria meminjam budak perempuan muda, melakukan apa pun yang dia suka dengannya, dan kemudian mengembalikannya kepada pemiliknya persis seperti semula, itu tidak diperbolehkan atau sah. Para ulama selalu melarangnya dan tidak memberikan izin kepada siapa pun untuk melakukannya. {cite:muwatta-maruf-1997 p.215} {cite:muwatta-maruf-1997 p.216}"
