summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أن من استسلف شيئا من الحيوان بصفة وتحلية معلومة، فإنه لا بأس بذلك، وعليه أن يرد مثله، إلا ما كان من الولائد، فإنه يخاف في ذلك الذريعة إلى إحلال ما لا يحل، فلا يصلح. وتفسير ما كره من ذلك: أن يستسلف الرجل الجارية، فيصيبها ما بدا له، ثم يرده إلى صاحبها بعينها، فذلك لا يصلح ولا يحل، ولم يزل أهل العلم ينهون عنه، ولا يرخصون فيه لأحد. {cite:muwatta-maruf-1997 p.215} {cite:muwatta-maruf-1997 p.216}"
