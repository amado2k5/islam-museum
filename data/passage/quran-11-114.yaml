text_search: "وأقم الصلاة طرفي النهار وزلفا من الليل ۚ إن الحسنات يذهبن السيئات ۚ ذلك ذكرى للذاكرين"
translations:
  en: { text: "Establish worship at the two ends of the day and in some watches of the night. Lo! good deeds annul ill-deeds. This is reminder for the mindful.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "اور دن کے دونوں سروں (یعنی صبح اور شام کے اوقات میں) اور رات کی چند (پہلی) ساعات میں نماز پڑھا کرو۔ کچھ شک نہیں کہ نیکیاں گناہوں کو دور کر دیتی ہیں۔ یہ ان کے لیے نصیحت ہے جو نصیحت قبول کرنے والے ہیں", translator: "Fateh Muhammad Jalandhari", license: PD }
