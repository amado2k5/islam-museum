label:
  ar: "البخاري 7503 — أصبح من عبادي مؤمن بي وكافر"
  en: "Bukhari 7503 — Some of My servants have woken as believers in Me and some as deniers"
  ur: "بخاری 7503 — میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ"
text: "قال الله أصبح من عبادي كافر بي ومؤمن بي ."
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 7503: أصبح من عبادي مؤمن بي وكافر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 7503: Some of My servants have woken as believers in Me and some as deniers. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 7503: میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
