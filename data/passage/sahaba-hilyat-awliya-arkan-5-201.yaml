text: "… شئ ؛ شهادة أن لا إله إلا اللّٰه وأن محمد عبده ورسوله، وإيمان بالله وملا أسكته وكتبه ورسله والجنة والنار، والحياة بمد الموت - هذه واحدة، والصلوات الخمس حمود الاسلام لا يقبل اللّٰه الايمان إلا بالصلاة، والزكاة طهور من الذنوب …"
summary:
  ar: "مقطع من حلية الأولياء لأبي نعيم، المجلد المصوَّر 5، ص 201، يذكر الشهادة والصلاة والزكاة، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Abu Nu'aym's Hilyat al-Awliya', scan volume 5, p. 201, that mentions the testimony, the prayer and the zakat, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "حلیۃ الاولیاء، ابو نعیم، اسکین جلد 5، ص 201 کا اقتباس جس میں شہادت، نماز اور زکوٰۃ، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
