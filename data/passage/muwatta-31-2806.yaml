label: { ar: "الموطأ 2806 — أبو هريرة: للمملوك طعامه وكسوته بالمعروف ولا يكلف ما لا يطيق", en: "Muwatta 2806", es: "Muwatta 2806", fr: "Muwatta 2806", ur: "موطا 2806", tr: "El-Muvatta 2806 — Ebu Hurayra: Bir köle, makul ölçüde yiyecek ve giyecek hakkına sahiptir ve taşıyabileceğinden fazla yük altına sokulmamalıdır.", id: "Al-Muwatta 2806 — Abu Hurairah: Seorang budak berhak atas makanan dan pakaian secara wajar, dan ia tidak boleh dibebani melebihi kemampuannya." }
summary:
  ar: "بلغ مالكا أن أبا هريرة قال: قال رسول الله: للمملوك طعامه وكسوته بالمعروف، ولا يكلف من العمل إلا ما يطيق. {cite:muwatta-maruf-1997 p.576}"
  tr: "Malik, Ebu Hurayra'dan rivayet ettiğine göre, Allah'ın Resulü şöyle buyurmuştur: \"Bir kul, makul ölçüde yiyecek ve giyeceğe hak kazanır ve gücünün ötesinde bir işle yüklenmemelidir.\" {cite:muwatta-maruf-1997 s.576}"
  id: "Malik meriwayatkan bahwa Abu Hurayrah berkata: Rasulullah SAW bersabda: Seorang hamba berhak atas makanan dan pakaian dengan cara yang wajar, dan ia tidak boleh dibebani pekerjaan di luar kemampuannya. {cite:muwatta-maruf-1997 p.576}"
