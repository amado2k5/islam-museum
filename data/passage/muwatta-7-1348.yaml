label: { ar: "الموطأ 1348 — عبد الرحمن بن أبي صعصعة: حفر السيل قبر عمرو بن الجموح وعبد الله بن عمرو، فوجدا لم يتغيرا بعد ست وأربعين سنة", en: "Muwatta 1348" }
summary:
  ar: "يروي مالك عن عبد الرحمن بن أبي صعصعة أنه بلغه أن عمرو بن الجموح وعبد الله بن عمرو الأنصاريين السلميين، كان قد حفر السيل قبرهما، وكانا في قبر واحد، وهما ممن استشهد يوم أحد. فحفر عنهما ليغيرا من مكانهما، فوجدا لم يتغيرا، كأنهما ماتا بالأمس، وكان أحدهما قد جرح فوضع يده على جرحه فدفن وهو كذلك، فأميطت يده عن جرحه ثم أرسلت فرجعت كما كانت. وكان بين أحد وبين يوم حفر عنهما ست وأربعون سنة. ويذكر المحقق أن هذا البلاغ مقطوع عند مالك، وأنه يتصل من وجوه صحاح بمعنى واحد متقارب عند ابن عبد البر. {cite:muwatta-maruf-1997 p.603}"
