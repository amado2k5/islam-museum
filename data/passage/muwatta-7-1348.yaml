label: { ar: "الموطأ 1348 — عبد الرحمن بن أبي صعصعة: حفر السيل قبر عمرو بن الجموح وعبد الله بن عمرو، فوجدا لم يتغيرا بعد ست وأربعين سنة", en: "Muwatta 1348", es: "Muwatta 1348", fr: "Muwatta 1348", ur: "موطا 1348", tr: "El-Muvatta 1348 — Abdülrahman ibn Abi Sa’sa’ah: Sel, Amr ibn el-Cemuh ve Abdullah ibn Amr’ın mezarlarını ortaya çıkardı ve kırk altı yıl sonra bile değişmemiş halde bulundular.", id: "Al-Muwatta 1348 — Abd al-Rahman ibn Abi Sa’sa’ah: Banjir menggali kuburan Amr ibn al-Jamuh dan Abdullah ibn Amr, dan kuburan itu ditemukan tidak berubah setelah empat puluh enam tahun." }
summary:
  ar: "يروي مالك عن عبد الرحمن بن أبي صعصعة أنه بلغه أن عمرو بن الجموح وعبد الله بن عمرو الأنصاريين السلميين، كان قد حفر السيل قبرهما، وكانا في قبر واحد، وهما ممن استشهد يوم أحد. فحفر عنهما ليغيرا من مكانهما، فوجدا لم يتغيرا، كأنهما ماتا بالأمس، وكان أحدهما قد جرح فوضع يده على جرحه فدفن وهو كذلك، فأميطت يده عن جرحه ثم أرسلت فرجعت كما كانت. وكان بين أحد وبين يوم حفر عنهما ست وأربعون سنة. ويذكر المحقق أن هذا البلاغ مقطوع عند مالك، وأنه يتصل من وجوه صحاح بمعنى واحد متقارب عند ابن عبد البر. {cite:muwatta-maruf-1997 p.603}"
  tr: "Malik, Abdülrahman ibn Abi Sa'sa'ah'tan rivayetle, Amr ibn el-Cemuh ve Abdullah ibn Amr el-Ensari el-Sulami'nin mezarlarının ani bir sel felaketiyle ortaya çıkarıldığını duyduğunu aktarır. İkisi de aynı mezara birlikte gömülmüş ve Uhud Savaşı'nda şehit düşenler arasındaydılar. Mezarları taşınmak üzere kazıldığında, sanki dün ölmüşler gibi, hiç değişmemiş halde bulundular. Bir tanesi yaralanmış ve elini yarasının üzerine koymuştu ve o şekilde gömülmüştü. Eli yarasından çekilip bırakıldığında, eski haline geri döndü. Uhud Savaşı ile mezarlarının kazıldığı gün arasında kırk altı yıl geçmişti. Araştırmacı, bu rivayetin Malik tarafından bağlantısız olarak değerlendirildiğini, ancak İbn Abdül-Barr'a göre benzer bir anlama sahip birkaç sahih rivayet zinciriyle bağlantılı olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.603}"
  id: "Malik meriwayatkan dari Abd al-Rahman ibn Abi Sa'sa'ah bahwa ia mendengar bahwa kuburan Amr ibn al-Jamuh dan Abdullah ibn Amr al-Ansari al-Sulami telah digali oleh banjir bandang. Mereka dikuburkan bersama dalam satu kuburan, dan mereka termasuk di antara mereka yang gugur sebagai syuhada dalam Perang Uhud. Ketika kuburan mereka digali untuk dipindahkan, mereka ditemukan tidak berubah, seolah-olah mereka baru meninggal kemarin. Salah seorang dari mereka terluka dan meletakkan tangannya di atas lukanya, dan ia dikuburkan dalam posisi itu. Ketika tangannya diangkat dari lukanya dan kemudian dilepaskan, tangannya kembali ke posisi semula. Empat puluh enam tahun telah berlalu antara Perang Uhud dan hari kuburan mereka digali. Peneliti mencatat bahwa riwayat ini dianggap terputus oleh Malik, tetapi dihubungkan melalui beberapa rantai periwayatan otentik dengan makna yang serupa menurut Ibn Abd al-Barr. {cite:muwatta-maruf-1997 p.603}"
