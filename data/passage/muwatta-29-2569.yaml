label: { ar: "الموطأ 2569 — مالك: لا يُقاد من أحد حتى تبرأ جراح صاحبه، وحكم الجراح المتفاوتة", en: "Muwatta 2569" }
summary:
  ar: "قال مالك: ولا يُقاد من أحد حتى تبرأ جراح صاحبه، فيُقاد منه. فإن جاء جرح المستقاد منه مثل جرح الأول حين يصح فهو القود، وإن زاد جرح المستقاد منه أو مات، فليس على المجروح الأول شيء. وإن برأ جرح المستقاد منه وشل المجروح الأول، أو برأت جراحه وبها عيب أو نقص أو عثل، فإن المستقاد منه لا يُكسر الثانية ولا يُقاد بجرحه، ولكنه يُعقل له بقدر ما نقص من يد الأول أو فسد منها. {cite:muwatta-maruf-1997 p.448}"
