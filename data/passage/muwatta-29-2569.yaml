label: { ar: "الموطأ 2569 — مالك: لا يُقاد من أحد حتى تبرأ جراح صاحبه، وحكم الجراح المتفاوتة", en: "Muwatta 2569", es: "Muwatta 2569", fr: "Muwatta 2569", ur: "موطا 2569", tr: "El-Muvatta 2569 — Malik: Birinin yaraları iyileşene kadar kimse idam edilmez ve farklı yaralar hakkındaki hüküm şöyledir:", id: "Al-Muwatta 2569 — Malik: Tidak seorang pun boleh dieksekusi sampai luka temannya sembuh, dan hukum mengenai luka yang berbeda-beda" }
summary:
  ar: "قال مالك: ولا يُقاد من أحد حتى تبرأ جراح صاحبه، فيُقاد منه. فإن جاء جرح المستقاد منه مثل جرح الأول حين يصح فهو القود، وإن زاد جرح المستقاد منه أو مات، فليس على المجروح الأول شيء. وإن برأ جرح المستقاد منه وشل المجروح الأول، أو برأت جراحه وبها عيب أو نقص أو عثل، فإن المستقاد منه لا يُكسر الثانية ولا يُقاد بجرحه، ولكنه يُعقل له بقدر ما نقص من يد الأول أو فسد منها. {cite:muwatta-maruf-1997 p.448}"
  tr: "Malik şöyle dedi: Kurbanın yaraları iyileşene kadar kimse misilleme olarak idam edilmemelidir; iyileştikten sonra ise ondan misilleme alınmalıdır. Eğer ikinci kurbanın açtığı yara, iyileştiğinde ilk kurbanın açtığı yaraya benzer ise, o zaman misilleme alınmalıdır. Eğer ikinci kurbanın açtığı yara daha şiddetliyse veya kurban ölürse, ilk kurban hiçbir şeyden sorumlu değildir. Eğer ikinci kurbanın açtığı yara iyileşir ancak ilk kurban felç olursa veya yaraları iyileşir ancak bir kusur, eksiklik veya bozukluk varsa, o zaman ikinci kurbanın açtığı yara kırılmamalı ve yarası nedeniyle misilleme olarak idam edilmemelidir. Ancak, ilk kurbanın elindeki kayıp veya hasar için tazmin edilmelidir. {cite:muwatta-maruf-1997 s.448}"
  id: "Malik berkata: Tidak seorang pun boleh dieksekusi sebagai pembalasan sampai luka korban sembuh, setelah itu pembalasan akan dilakukan terhadapnya. Jika luka yang ditimbulkan oleh korban serupa dengan luka yang ditimbulkan oleh korban pertama setelah sembuh, maka pembalasan harus dilakukan. Jika luka yang ditimbulkan oleh korban lebih parah, atau jika korban meninggal, maka korban pertama tidak bertanggung jawab atas apa pun. Jika luka yang ditimbulkan oleh korban sembuh, tetapi korban pertama lumpuh, atau jika lukanya sembuh tetapi memiliki cacat, kekurangan, atau gangguan, maka luka kedua yang ditimbulkan oleh korban tidak boleh dipatahkan, dan ia tidak boleh dieksekusi sebagai pembalasan atas lukanya. Namun, ia harus diberi kompensasi atas kehilangan atau kerusakan pada tangan korban pertama. {cite:muwatta-maruf-1997 p.448}"
