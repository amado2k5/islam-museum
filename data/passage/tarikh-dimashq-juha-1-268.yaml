text: "… بكار انه وفد على العباس بن الوليد بن عبد الملك بحمص وكان قد اعسر عسرة شديدة فقضى عنه الف دينار واعطاه عشرة آلاف درهم وجهزه الى المدينة بعشرة احمال تحمل الكساوى والطرائف وكان عمران ابن ابى فرقة كتب الى بشير …"
summary:
