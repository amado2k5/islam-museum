  tr: "Şam Tarihi, Resimli Cilt 1, sayfa 268'den, esprili bir anekdot veya mizahi bir hikaye içeren bir alıntı; kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiş metin, makine tarafından okunabilir taranmış versiyondan alınmıştır. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
