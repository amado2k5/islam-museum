text: "… مع رسول اللّٰه. فقال جلساؤه: اما واللّه ! لوكنا شهدنا ذلك لكنا فعلنا و فعلنا. فقال حذيفة: لا تمنّوا ذلك لقد رأيتنا ليلة الأحزاب ونحن صافون قعود، و أبو سفيان ومن معه فوقنا وقريظة اليهود اسفل منا نخافهم على ذرارينا، …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 336، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 2, p. 336, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 2، ص 336 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Hayat al-Sahaba de al-Kandahlawi, volumen 2, pág. 336, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 2, page 336, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Répertorié dans le navigateur Umam."
  tr: "Kandahlevi'nin \"Hayat al-Sahaba\" (Sahabelerin Hayatları) adlı eserinin Resimli 2. Cildinin 336. sayfasından bir alıntı, Müslüman olmayan milletleri, dinleri ve halkları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak yönergelerine uygun olarak metin yaklaşık kırk kelimeyle sınırlıdır. \"Müslüman Olmayan Milletler, Dinler, Mezhepler ve Halklar\" tarayıcısı tarafından derlenmiştir."
