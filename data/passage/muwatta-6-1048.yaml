label: { ar: "الموطأ 1048 — سليمان بن يسار: صُرع سعيد بن حزابة المخزومي ببعض طريق مكة وهو محرم، فسأل عمن يلي الماء، فوجد ابن عمر وابن الزبير ومروان، فأمروه أن يتداوى ويفتدي، فإذا صح اعتمر ثم عليه حج قابل والهدي", en: "Muwatta 1048" }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار أن سعيد بن حزابة المخزومي صُرع ببعض طريق مكة وهو محرم، فسأل عمن يلي على الماء، فوجد عبد الله بن عمر وعبد الله بن الزبير ومروان بن الحكم، فذكر لهم ما عرض له، فكلهم أمره أن يتداوى بما لا بد له منه ويفتدي، فإذا صح اعتمر وحل من إحرامه، ثم عليه حج قابل ويهدي ما استيسر. ويذكر المحقق أن هذا الحكم عند مالك في المحصر بغير عدو. {cite:muwatta-maruf-1997 p.486}"
