label: { ar: "الموطأ 1048 — سليمان بن يسار: صُرع سعيد بن حزابة المخزومي ببعض طريق مكة وهو محرم، فسأل عمن يلي الماء، فوجد ابن عمر وابن الزبير ومروان، فأمروه أن يتداوى ويفتدي، فإذا صح اعتمر ثم عليه حج قابل والهدي", en: "Muwatta 1048", es: "Muwatta 1048", fr: "Muwatta 1048", ur: "موطا 1048", tr: "El-Muvatta 1048 — Süleyman ibn Yasar: Sa'id ibn Hazabah el-Makhzumi, ihramlı haldeyken Mekke yolundan birinde hastalandı. Su kaynağının sorumlusunun kim olduğunu sordu ve İbn Ömer, İbn el-Zübeyr ve Mervan'ı buldu. Ona tıbbi tedavi görmesini ve kurban kesmesini söylediler. İyileştiğinde Umre yapması, ardından da ertesi yıl Hac yapması ve kurban kesmesi gerekiyordu.", id: "Al-Muwatta 1048 — Sulayman ibn Yasar: Sa'id ibn Hazabah al-Makhzumi jatuh sakit di salah satu jalan menuju Mekah saat dalam keadaan ihram. Dia bertanya siapa yang bertanggung jawab atas sumber air dan menemukan Ibn 'Umar, Ibn al-Zubayr, dan Marwan. Mereka menyuruhnya untuk berobat dan mempersembahkan kurban. Setelah sembuh, dia harus melaksanakan Umrah, dan kemudian dia wajib melaksanakan Haji pada tahun berikutnya dan mempersembahkan hewan kurban." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن سليمان بن يسار أن سعيد بن حزابة المخزومي صُرع ببعض طريق مكة وهو محرم، فسأل عمن يلي على الماء، فوجد عبد الله بن عمر وعبد الله بن الزبير ومروان بن الحكم، فذكر لهم ما عرض له، فكلهم أمره أن يتداوى بما لا بد له منه ويفتدي، فإذا صح اعتمر وحل من إحرامه، ثم عليه حج قابل ويهدي ما استيسر. ويذكر المحقق أن هذا الحكم عند مالك في المحصر بغير عدو. {cite:muwatta-maruf-1997 p.486}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Süleyman ibn Yasar'dan rivayet ettiğine göre, Sa'id ibn Hazabah el-Makhzumi, ihramlı haldeyken Mekke yolundan birinde su kaynağının sorumlusunu sordu ve Abdullah ibn Umar, Abdullah ibn el-Zubayr ve Mervan ibn el-Hakam'ı buldu. Onlara başına gelenleri anlattı ve hepsi ona gerekli tıbbi tedaviyi almasını ve kurban kesmesini tavsiye etti. İyileştiğinde Umre yapması ve ihram halinden çıkması gerekiyordu. Daha sonra ertesi yıl Hac yapması ve gücü yettiğince kurban kesmesi gerekiyordu. Araştırmacı, Malik'e göre bu hükmün, Hac ibadetini düşman tarafından engellenmeyen kimse için geçerli olduğunu belirtiyor. {cite:muwatta-maruf-1997 s.486}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, dari Sulayman ibn Yasar, bahwa Sa'id ibn Hazabah al-Makhzumi ditimpa musibah di salah satu jalan menuju Mekah saat dalam keadaan ihram. Ia bertanya kepada orang yang bertanggung jawab atas sumber air tersebut dan menemukan Abdullah ibn Umar, Abdullah ibn al-Zubayr, dan Marwan ibn al-Hakam. Ia menceritakan apa yang telah terjadi padanya, dan mereka semua menasihatinya untuk mencari pengobatan yang diperlukan dan mempersembahkan kurban. Setelah sembuh, ia harus melaksanakan Umrah dan keluar dari keadaan ihramnya. Ia kemudian wajib melaksanakan Haji tahun berikutnya dan mempersembahkan kurban sesuai kemampuannya. Peneliti menyebutkan bahwa hukum ini, menurut Malik, berlaku bagi seseorang yang tidak dihalangi untuk menyelesaikan Haji oleh musuh. {cite:muwatta-maruf-1997 p.486}"
