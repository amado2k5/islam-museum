text: "… مُوثَقٌ بِالْحَدِيدِ فَقَالَ أَهْلُهُ إِنَّا حُدِّثْنَا أَنَّ صَاحِبَكُمْ هَذَا قَدْ جَاءَ بِخَيْرٍ فَهَلْ عِنْدَكَ شَىْءٌ تُدَاوِيهِ فَرَقَيْتُهُ بِفَاتِحَةِ الْكِتَابِ فَبَرَأَ فَأَعْطُونِي مِائَةَ شَاةٍ فَأَتَيْتُ رَسُولَ اللَّهِ فَأَخْبَرْتُهُ فَقَالَ \" هَلْ إِلاَّ هَذَا \". وَقَالَ مُسَدَّدٌ فِي مَوْضِعٍ آخَرَ \" هَلْ قُلْتَ غَيْرَ هَذَا \". قُلْتُ لاَ. قَالَ \" خُذْهَا فَلَعَمْرِي لَمَنْ أَكَلَ بِرُقْيَةِ بَاطِلٍ لَقَدْ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 3896، يذكر الرقية، والبرء من العلة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3896 (Medicine (Kitab Al-Tibb)), that mentions ruqya recited over the sick, recovery from an ailment. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3896، جس میں رقیہ، بیماری سے شفایابی کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
