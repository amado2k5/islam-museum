text: "… مجعولاً في صرّة من كتّان، ويطلى على جبهة من به صداع بارد، وإذا نقع في الخلّ ليلة، ثم سحق من الغد، واستعط به وقدّم إلى المريض حتى يستنشقه، نفع من الأوجاع المزمنة في الرأس، ومن اللقوة. وهو من الأدوية المنفخة …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج1، ص 677، يذكر اللدود والسعوط، والمرض والمريض، والوجع، وأسماء الأمراض، والدواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 677, that mentions medicine given by the mouth-side or the nose, illness and the sick, pain, named diseases, the drug; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 677 کا اقتباس جس میں لدود اور سعوط، بیماری اور بیمار، درد، بیماریوں کے نام، دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 677, que menciona la medicina administrada por vía oral o nasal, la enfermedad y los enfermos, el dolor, las enfermedades con nombre y el medicamento; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 1, p. 677, qui mentionne la médecine administrée par voie orale ou nasale, la maladie et les malades, la douleur, les maladies nommées, le médicament; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 1. Kısım, s. 677'den bir bölüm; infüzyonlar ve enfiye, hastalık ve hasta, ağrı, hastalıkların isimleri ve ilaçlardan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 1, hlm. 677, yang menyebutkan infus dan tembakau hisap, penyakit dan pasien, rasa sakit, nama-nama penyakit, dan obat-obatan; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
