text: "… كان لا يداري، ولا يماري، يا سائب! قد كنت تعمل أعمالاً في الجاهلية لا تتقبل منك، وهي اليوم تتقبل منك، وكان ذا سلف وصلة. - حدثنا حسين بن علي عن حمزة الزيات قال: لما كان يوم فتح مكة دخل رسول …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 1، ص 410، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 1, p. 410, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 1، ص 410 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 1, pág. 410, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Musannaf d'Ibn Abi Shayba, volume 1, page 410, mentionnant les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Abi Şeybe'nin Musannaf adlı eserinin 1. cildinin 410. sayfasından, Kur'an okuyucularından bahseden bir bölüm; makineyle okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazı, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Cuplikan dari Musannaf karya Ibn Abi Shaybah, Volume 1, halaman 410, yang menyebutkan para qari; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
