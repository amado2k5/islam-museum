label: { ar: "موطأ مالك 659 — ضحك وتبسم", en: "Muwatta Malik 659 — laughter and smiling", ur: "موطأ مالک 659 — ہنسی اور تبسم", fr: "Muwatta Malik 659 — rire et sourire", es: "Muwatta Malik 659 — risa y sonrisa" }
text: "… عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَجُلاً، أَفْطَرَ فِي رَمَضَانَ فَأَمَرَهُ رَسُولُ اللَّهِ أَنْ يُكَفِّرَ بِعِتْقِ رَقَبَةٍ أَوْ صِيَامِ شَهْرَيْنِ مُتَتَابِعَيْنِ أَوْ إِطْعَامِ سِتِّينَ مِسْكِينًا. فَقَالَ لاَ أَجِدُ. فَأُتِيَ رَسُولُ اللَّهِ بِعَرَقِ تَمْرٍ. فَقَالَ خُذْ هَذَا فَتَصَدَّقْ بِهِ . فَقَالَ يَا رَسُولَ اللَّهِ مَا أَحَدٌ أَحْوَجَ مِنِّي. فَضَحِكَ رَسُولُ اللَّهِ حَتَّى بَدَتْ أَنْيَابُهُ ثُمَّ قَالَ كُلْهُ ."
summary:
  ar: "حديث في موطأ مالك، رقم 659، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Muwatta Malik, no. 659, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "موطأ مالک کی حدیث نمبر 659، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Muwatta Malik, n° 659, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Muwatta Malik, n.º 659, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
