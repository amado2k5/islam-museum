text: "… عن الطريق هذه الأحاديث المذكورةُ في الباب ظاهرةً في فضل إزالة الأذى عن الطريق، سواء كان الأذى شجرةٌ تؤذي، أو غصنٌ شوكٍ، أو حجرا يُعْثَر به، أو قَذَراً، أو جِيفةٌ، أو غيرَ ذلك. وإماطةُ الأذى عن الطريق من شعب الإيمان …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 96، يذكر شعب الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 3, p. 96, that mentions the branches of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 3، ص 96 کا اقتباس جس میں ایمان کی شاخیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
