label:
  ar: "النسائي 448 — المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي"
  en: "Nasa'i 448 — The Ascension and the prayers: I have upheld My command and lightened it for My servants"
  ur: "نسائی 448 — معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی"
text: "بينا أنا عند البيت بين النائم واليقظان إذ أقبل أحد الثلاثة بين الرجلين فأتيت بطست من ذهب ملآن حكمة وإيمانا فشق من النحر إلى مراق البطن فغسل القلب بماء زمزم ثم ملئ حكمة وإيمانا ثم أتيت بدابة دون البغل وفوق …"
summary:
  ar: "حديث قدسي في سنن النسائي، رقم 448: المعراج وفرض الصلوات: أمضيت فريضتي وخففت عن عبادي. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan al-Nasa'i, no. 448: The Ascension and the prayers: I have upheld My command and lightened it for My servants. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن نسائی میں حدیثِ قدسی، نمبر 448: معراج اور نمازوں کی فرضیت: میں نے اپنا فریضہ نافذ کیا اور بندوں پر تخفیف کی۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
