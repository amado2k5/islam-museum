text: "… ثم يَضَعُ يَدَهُ في الْجَفْنَةِ فَيَلْتَقِمُ منها. قال ابن هشام : بفطورِنَا وسحورِنا. قال ابن إسحاق: وحدَّثني سعيد بن أبي هند، عن مُطَرّف بن عبد الله بن الشِّخِّير، عن عُثْمَانَ بْنَ أَبي العَاص، قال: كَانَ مِنْ آخر ما عَهِدَ إِليَّ …"
summary:
