text: "… ثم يَضَعُ يَدَهُ في الْجَفْنَةِ فَيَلْتَقِمُ منها. قال ابن هشام : بفطورِنَا وسحورِنا. قال ابن إسحاق: وحدَّثني سعيد بن أبي هند، عن مُطَرّف بن عبد الله بن الشِّخِّير، عن عُثْمَانَ بْنَ أَبي العَاص، قال: كَانَ مِنْ آخر ما عَهِدَ إِليَّ …"
summary:
  ar: "مقطع من السيرة النبوية لابن هشام، ص 610، يذكر وصية أو عهد أخير؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Hisham's Sira, p. 610, that mentions a testament or parting counsel; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "سیرت ابن ہشام، ص 610 کا اقتباس جس میں وصیت یا آخری نصیحت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
