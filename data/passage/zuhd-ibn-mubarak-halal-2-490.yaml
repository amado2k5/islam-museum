text: "بابُ فضل الذِّكر : في ذكر الحوض والكوثر قال رسول اللٰه وَليم أُعطِيتُ خمساً لم يُعطَهُنَّ نبيٌّ قَبْلِي: جُعِلَت لي الأرضُ مسجداً، ونُصِرتُ بالرُّعبِ، فيُرعَبُ القومُ من بين يَدَي مَسِيرةَ شهرٍ، وبُعِثتُ إلى الأبيضِ والأسودِ، وأُحِلَّت ليَ الغنائمُ ولم تُحَلَّ …"
