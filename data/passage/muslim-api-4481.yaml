label: { ar: "صحيح مسلم 4481 — ما كرهه الله للناس، ما كُره", en: "Sahih Muslim 4481 — what God disliked for people; what was disliked", ur: "صحیح مسلم 4481 — جو اللہ نے لوگوں کے لیے ناپسند کیا، جو ناپسند کیا گیا", fr: "Sahih Muslim 4481 — ce que Dieu a réprouvé pour les gens ; ce qui fut réprouvé", es: "Sahih Muslim 4481 — lo que Dios reprobó para la gente; lo que se reprobó", tr: "Sahih Muslim 4481 — Allah'ın insanlar için hoşlanmadığı şeyler, hoş karşılanmayan şeylerdir.", id: "Sahih Muslim 4481 — Apa yang tidak disukai Allah bagi manusia, apa yang tidak disukai" }
text: "حَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا جَرِيرٌ، عَنْ سُهَيْلٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ اللَّهَ يَرْضَى لَكُمْ ثَلاَثًا وَيَكْرَهُ لَكُمْ ثَلاَثًا فَيَرْضَى لَكُمْ أَنْ تَعْبُدُوهُ وَلاَ تُشْرِكُوا بِهِ شَيْئًا وَأَنْ تَعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلاَ تَفَرَّقُوا وَيَكْرَهُ لَكُمْ قِيلَ وَقَالَ وَكَثْرَةَ السُّؤَالِ وَإِضَاعَةَ الْمَالِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4481، يرد فيه ذكر ما كرهه الله للناس، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 4481 (The Book of Judicial Decisions), whose wording mentions what God disliked for people, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 4481، جس کے الفاظ میں جو اللہ نے لوگوں کے لیے ناپسند کیا، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 4481, dont le texte mentionne ce que Dieu a réprouvé pour les gens, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 4481, cuyo texto menciona lo que Dios reprobó para la gente, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih Müslim'de 4481 numaralı hadis, Allah'ın insanlar için hoşlanmadığı ve hoş karşılanmayan şeyleri zikrediyor. Bu hadis, farz, ibadet, tavsiye edilen, hoş karşılanmayan, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklıyor ancak buna dayanarak dini bir hüküm vermiyor."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4481, menyebutkan apa yang tidak disukai Allah dari manusia, dan apa yang dibenci. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, amalan ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
