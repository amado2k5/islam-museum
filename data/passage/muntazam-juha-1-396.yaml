text: "… بكر السوسى تدم بغداد فى سنة احدى واربعين وثلثمائة وحدث بها احاديث مستقيمة فروى عنه الدار قطنى وابن رز قويه وغيرهما وتوفى فى هذه السنة. - محمل بن احمل ابن اسحاق بن البهلول بن حسان أبو طالب التفونى اصله من …"
summary:
  ar: "مقطع من المنتظم في تاريخ الملوك والأمم، المجلد المصوَّر 1، ص 396، فيه خبر من أخبار الظرفاء والمغفلين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح جحا والفلكلور الإسلامي."
  en: "An excerpt from al-Muntazam of Ibn al-Jawzi, scan volume 1, p. 396, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "المنتظم ابن الجوزی، اسکین جلد 1، ص 396 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muntazam d'Ibn al-Jawzi, volume numérisé 1, p. 396, avec un récit des beaux esprits et des sots ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources. Le Navigateur de Juha et du folklore islamique le recense."
  es: "Un extracto de al-Muntazam de Ibn al-Jawzi, volumen escaneado 1, p. 396, con un relato de ingeniosos y necios; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras que fija la política de fuentes. El Navegador de Juha y del folclore islámico lo recoge."
  tr: "Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kralların ve Milletlerin Tarihindeki Düzenlilik), Resimli Cilt 1, s. 396'dan, zeki ve aptal insanlar hakkında bir hikaye içeren bir alıntı; makine tarafından okunabilir taranmış versiyondan. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
  id: "Cuplikan dari Al-Muntazam fi Tarikh al-Muluk wa al-Umam (Kitab Sejarah Raja dan Bangsa-Bangsa), Jilid Bergambar 1, hlm. 396, berisi kisah tentang orang-orang yang cerdas dan bodoh; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh Juha dan Peramban Cerita Rakyat Islam."
