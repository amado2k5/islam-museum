text: "… فقال عليُّ : أنا الذي سمَّتهُ أمي حيدرة كليث غاباتٍ شديد القسورة أكيلهم بالصاع كيل السندرة فاختلفا ضربتين فبدره علي بضربة فقد الحجر والمغْفَرَ ورأسه ووقع في وهو الصداع وراجع الطب النبوي من تحقيقنا، وجاء في حاشية ص : صداع …"
