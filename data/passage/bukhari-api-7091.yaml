label: { ar: "صحيح البخاري 7091 — الأب والأبوة", en: "Sahih al-Bukhari 7091 — the father and fatherhood", ur: "صحیح بخاری 7091 — باپ اور والدیت", es: "Sahih al-Bukhari 7091 — El padre y la paternidad", fr: "Sahih al-Bukhari 7091 — Le père et la paternité", tr: "Sahih el-Buhari 7091 — Baba ve Babalık", id: "Sahih al-Bukhari 7091 — Ayah dan Peran Ayah" }
text: "وَقَالَ لِي خَلِيفَةُ حَدَّثَنَا يَزِيدُ بْنُ زُرَيْعٍ، حَدَّثَنَا سَعِيدٌ، وَمُعْتَمِرٌ، عَنْ أَبِيهِ، عَنْ قَتَادَةَ، أَنَّ أَنَسًا، حَدَّثَهُمْ عَنِ النَّبِيِّ بِهَذَا وَقَالَ عَائِذًا بِاللَّهِ مِنْ شَرِّ الْفِتَنِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 7091، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 7091 (Afflictions and the End of the World), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 7091، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 7091 (Aflicciones y el fin del mundo), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 7091 (Les Afflictions et la Fin du Monde), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih el-Buhari'de 7091 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlemektedir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 7091, menyebutkan tentang ayah dan peran ayah. Situs web \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
