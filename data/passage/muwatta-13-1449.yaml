label: { ar: "الموطأ 1449 — مالك: الأمر المجتمع عليه عندنا في ميراث الولد من والده، للذكر مثل حظ الأنثيين، وللبنات الثلثان، وللبنت النصف", en: "Muwatta 1449", es: "Muwatta 1449", fr: "Muwatta 1449", ur: "موطا 1449", tr: "El-Muvatta 1449 — Malik: Bizim aramızda, bir oğlun babasından miras alması konusunda ittifak edilmiş uygulama şudur: Erkek, kızdan iki kat pay alır; kız çocukları üçte iki pay alır; kız çocuğu ise yarısını alır.", id: "Al-Muwatta 1449 — Malik: Kebiasaan yang disepakati di antara kita mengenai warisan anak laki-laki dari ayahnya adalah bahwa laki-laki mendapat dua kali bagian perempuan, anak perempuan mendapat dua pertiga, dan anak perempuan mendapat setengahnya." }
summary:
  ar: "يقول يحيى عن مالك إن الأمر المجتمع عليه عندهم، والذي أدرك عليه أهل العلم ببلدهم في فرائض المواريث، أن ميراث الولد من والده أو والدته إذا توفي الأب أو الأم وتركا ولدا رجالا ونساء، فللذكر مثل حظ الأنثيين، فإن كن نساء فوق اثنتين فلهن ثلثا ما ترك، وإن كانت واحدة فلها النصف. ويبين الحكم في ولد الابن وفي اجتماع الولد لصلب وولد الابن، ويستدل بآية النساء. {cite:muwatta-maruf-1997 p.5}"
  tr: "Yahya, Malik'in şöyle dediğini aktarır: Onlar arasında yerleşik uygulama ve ülkelerindeki âlimlerin miras hukuku hakkındaki anlayışı şudur: Eğer bir çocuk babasından veya annesinden miras alırsa ve baba veya anne vefat ederse ve geride erkek ve kız çocukları bırakırsa, erkek çocuk kız çocuğunun payının iki katını alır. İkiden fazla kız çocuğu varsa, geriye kalanların üçte ikisini miras alırlar; tek kız çocuğu varsa, yarısını miras alır. Daha sonra, Nisa Suresi'nden (4:19) bir ayeti zikrederek, erkek çocuğunun ve erkek çocuğunun iki erkek çocuğunun birleşimiyle ilgili hükmü açıklar. {cite:muwatta-maruf-1997 s.5}"
  id: "Yahya mengutip Malik yang mengatakan bahwa praktik yang berlaku di antara mereka, dan pemahaman para ulama di negeri mereka mengenai hukum warisan, adalah jika seorang anak mewarisi harta dari ayah atau ibunya, dan ayah atau ibu tersebut meninggal dunia meninggalkan anak laki-laki dan perempuan, maka anak laki-laki menerima dua kali bagian dari anak perempuan. Jika ada lebih dari dua anak perempuan, mereka mewarisi dua pertiga dari sisanya; jika hanya ada satu anak perempuan, ia mewarisi setengahnya. Kemudian ia menjelaskan hukum mengenai anak laki-laki dan gabungan antara anak laki-laki dan anak laki-laki, dengan mengutip ayat dari Surah An-Nisa (4:19). {cite:muwatta-maruf-1997 p.5}"
