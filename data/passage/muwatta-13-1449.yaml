label: { ar: "الموطأ 1449 — مالك: الأمر المجتمع عليه عندنا في ميراث الولد من والده، للذكر مثل حظ الأنثيين، وللبنات الثلثان، وللبنت النصف", en: "Muwatta 1449" }
summary:
  ar: "يقول يحيى عن مالك إن الأمر المجتمع عليه عندهم، والذي أدرك عليه أهل العلم ببلدهم في فرائض المواريث، أن ميراث الولد من والده أو والدته إذا توفي الأب أو الأم وتركا ولدا رجالا ونساء، فللذكر مثل حظ الأنثيين، فإن كن نساء فوق اثنتين فلهن ثلثا ما ترك، وإن كانت واحدة فلها النصف. ويبين الحكم في ولد الابن وفي اجتماع الولد لصلب وولد الابن، ويستدل بآية النساء. {cite:muwatta-maruf-1997 p.5}"
