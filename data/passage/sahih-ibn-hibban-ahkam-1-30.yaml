text: "… سعيد الخُدْري، قال: قال رسُولُ اللَّهِ: غُسْلُ يَوْمِ الجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ، كَغُسْل. : الجَنابَةِ. ذكرُ الخبرِ الدَّالِّ على أن الأمرَ بالاغتسال للجمعة في الأخبار التي ذكرناها قبلُ إنما هو أمرُ ندبٍ وإرشادٍ لِعلة معلومة أخبرنا محمدُ بنُ الحسن …"
summary:
