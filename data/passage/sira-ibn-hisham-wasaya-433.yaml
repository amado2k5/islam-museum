text: "… بن طارق فَلاَنُوا ورَقّوا وَرَغِبُوا في الحياة، فَأَعْطَوْا بأيديهم، فَأْسَرُوهُمْ، ثم خرجوا إلى مَكّة ليبيعوهم بها، حتى إذا كانوا بِالظَّهْرَانِ انتزع عبدُ اللّه بن طارِقِ يده من القِرَانِ، ثم أخذ سَيْفَهُ واستأْخَرَ عنه القومُ، فَرَمَوْهُ بالحجارةِ حتى قتلوه، فَقَبْرُهُ بِالظَّهْرَانِ، …"
summary:
