label: { ar: "سنن ابن ماجه 1272 — الأب والأبوة، اليتيم وفقد الأب", en: "Sunan Ibn Majah 1272 — the father and fatherhood; the orphan and the father lost", ur: "سنن ابن ماجہ 1272 — باپ اور والدیت، یتیم اور باپ کی موت" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ الأَزْهَرِ، حَدَّثَنَا أَبُو النَّضْرِ، حَدَّثَنَا أَبُو عَقِيلٍ، عَنْ عُمَرَ بْنِ حَمْزَةَ، حَدَّثَنَا سَالِمٌ، عَنْ أَبِيهِ، قَالَ رُبَّمَا ذَكَرْتُ قَوْلَ الشَّاعِرِ وَأَنَا أَنْظُرُ، إِلَى وَجْهِ رَسُولِ اللَّهِ ـ عَلَى الْمِنْبَرِ فَمَا نَزَلَ حَتَّى جَيَّشَ كُلُّ مِيزَابٍ بِالْمَدِينَةِ فَأَذْكُرُ قَوْلَ الشَّاعِرِ وَأَبْيَضَ يُسْتَسْقَى الْغَمَامُ بِوَجْهِهِ ثِمَالُ الْيَتَامَى عِصْمَةٌ لِلأَرَامِلِ وَهُوَ قَوْلُ أَبِي طَالِبٍ."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1272، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1272 (Establishing the Prayer and the Sunnah Regarding Them), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1272، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
