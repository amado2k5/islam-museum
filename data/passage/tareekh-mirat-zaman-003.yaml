text: "وليفي فأمر به فقرئ عليه فإذا فيه: (بسم الله الرحمن الرحيم: من محمد عبد الله ورسوله إلى هرقل عظيم الروم سلام على من اتبع الهدى، أما بعد: فإني أدعوك بدعاية الإسلام، أسلم تسلم، يؤتك الله أجرك مرتين، فإن توليت فعليك"
