label: { ar: "جامع الترمذي 2673 — وزر من تبع", en: "Jami' al-Tirmidhi 2673 — bearing the burden of those who follow", ur: "جامع ترمذی 2673 — پیروی کرنے والوں کا بوجھ" }
text: "… مَسْعُودٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" مَا مِنْ نَفْسٍ تُقْتَلُ ظُلْمًا إِلاَّ كَانَ عَلَى ابْنِ آدَمَ كِفْلٌ مِنْ دَمِهَا وَذَلِكَ لأَنَّهُ أَوَّلُ مَنْ أَسَنَّ الْقَتْلَ \". وَقَالَ عَبْدُ الرَّزَّاقِ \" سَنَّ الْقَتْلَ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الأَعْمَشِ، بِهَذَا الإِسْنَادِ نَحْوَهُ بِمَعْنَاهُ قَالَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2673، يذكر وزر من تبع. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2673 (Chapters on Knowledge), that speaks of bearing the burden of those who follow. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2673، جس میں پیروی کرنے والوں کا بوجھ کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
