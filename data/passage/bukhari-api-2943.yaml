label: { ar: "صحيح البخاري 2943 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 2943 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 2943 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 2943 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 2943 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 2943 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 2943 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا مُعَاوِيَةُ بْنُ عَمْرٍو، حَدَّثَنَا أَبُو إِسْحَاقَ، عَنْ حُمَيْدٍ، قَالَ سَمِعْتُ أَنَسًا ـ يَقُولُ كَانَ رَسُولُ اللَّهِ إِذَا غَزَا قَوْمًا لَمْ يُغِرْ حَتَّى يُصْبِحَ، فَإِنْ سَمِعَ أَذَانًا أَمْسَكَ، وَإِنْ لَمْ يَسْمَعْ أَذَانًا أَغَارَ بَعْدَ مَا يُصْبِحُ، فَنَزَلْنَا خَيْبَرَ لَيْلاً."
summary:
  ar: "حديث في صحيح البخاري، رقم 2943، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2943 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 2943، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 2943 (La lucha por la causa de Alá (Yihad)), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un hadith du Sahih al-Bukhari, n° 2943 (Combat pour la cause d'Allah (Jihad)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'de 2943 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 2943, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
