label: { ar: "الموطأ 688 — مالك: الدين لا يزكيه صاحبه حتى يقبضه، وإن أقام سنين فزكاة واحدة؛ ويخرج زكاة كل شيء منه", en: "Muwatta 688" }
summary:
  ar: "قول طويل لمالك: الأمر الذي لا اختلاف فيه عندنا في الدين أن صاحبه لا يزكيه حتى يقبضه، وإن أقام عند من هو عليه سنين ثم قبضه لم تجب عليه إلا زكاة واحدة. فإن قبض منه ما لا تجب فيه الزكاة وكان له ناض سواه تجب فيه الزكاة زكاه معه، وإن لم يكن له ناض غيره حفظ عدد ما اقتضى حتى يتم بما يقتضيه بعد ذلك النصاب فيزكيه، سواء استهلك ما اقتضى أولاً أو لم يستهلكه، ثم ما اقتضى بعد ذلك من قليل أو كثير زكاه بحسابه. ويستدل مالك على أن الدين الغائب أعواماً ليس فيه إلا زكاة واحدة بالعروض تكون للتجارة أعواماً ثم تُباع فليس في أثمانها إلا زكاة واحدة، لأن زكاة كل شيء تُخرج منه لا من مال سواه. ويذكر المحقق أن الناض ما كان ذهباً أو فضة، ويثبت فروق النسخ، وأنه رواه عن مالك أبو مصعب ويحيى بن بكير عند أبي عبيد في الأموال. {cite:muwatta-maruf-1997 p.344} {cite:muwatta-maruf-1997 p.345}"
