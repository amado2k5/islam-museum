label: { ar: "الموطأ 688 — مالك: الدين لا يزكيه صاحبه حتى يقبضه، وإن أقام سنين فزكاة واحدة؛ ويخرج زكاة كل شيء منه", en: "Muwatta 688", es: "Muwatta 688", fr: "Muwatta 688", ur: "موطا 688", tr: "Al-Muwatta 688 — Malik: Bir borç, tahsil edilene kadar zekâta tabi değildir; yıllarca ödenmemiş kalsa bile, yalnızca bir zekât verilir ve zekât, borcun her bir kısmı için ödenir.", id: "Al-Muwatta 688 — Malik: Suatu utang tidak dikenakan zakat sampai utang tersebut diterima, meskipun utang tersebut tidak dibayar selama bertahun-tahun, maka hanya satu zakat yang wajib dibayarkan; dan zakat dibayarkan atas setiap bagian dari utang tersebut." }
summary:
  ar: "قول طويل لمالك: الأمر الذي لا اختلاف فيه عندنا في الدين أن صاحبه لا يزكيه حتى يقبضه، وإن أقام عند من هو عليه سنين ثم قبضه لم تجب عليه إلا زكاة واحدة. فإن قبض منه ما لا تجب فيه الزكاة وكان له ناض سواه تجب فيه الزكاة زكاه معه، وإن لم يكن له ناض غيره حفظ عدد ما اقتضى حتى يتم بما يقتضيه بعد ذلك النصاب فيزكيه، سواء استهلك ما اقتضى أولاً أو لم يستهلكه، ثم ما اقتضى بعد ذلك من قليل أو كثير زكاه بحسابه. ويستدل مالك على أن الدين الغائب أعواماً ليس فيه إلا زكاة واحدة بالعروض تكون للتجارة أعواماً ثم تُباع فليس في أثمانها إلا زكاة واحدة، لأن زكاة كل شيء تُخرج منه لا من مال سواه. ويذكر المحقق أن الناض ما كان ذهباً أو فضة، ويثبت فروق النسخ، وأنه رواه عن مالك أبو مصعب ويحيى بن بكير عند أبي عبيد في الأموال. {cite:muwatta-maruf-1997 p.344} {cite:muwatta-maruf-1997 p.345}"
  tr: "Malik uzun uzadıya şöyle dedi: Borcun sahibinin, parayı alana kadar zekâtını ödememesi konusunda aramızda bir görüş ayrılığı yoktur. Borçlu yıllarca elinde kalsa ve sonra parayı alsa bile, sadece bir zekât ödemekle yükümlüdür. Eğer zekâtı gerekmeyen bir miktar alırsa ve zekâtı gereken başka malları varsa, bunların zekâtını da öder. Başka mal varlığı yoksa, aldığı miktarı, sonraki miktarlarla birlikte nisaba (asgari eşiğe) ulaşana kadar takip eder ve sonra, ilk miktarı tüketmiş olsun ya da olmasın, zekâtını öder. Daha sonra, küçük veya büyük olsun, sonraki miktarların zekâtını öder. Malik, yıllarca ticaret için tutulan ve sonra satılan mal örneğini kullanarak, yıllarca ödenmemiş bir borcun sadece bir zekât gerektirdiğini savunur. Satılan malın zekâtı, malın kendisinden ödenir, diğer mallardan değil, bu nedenle satıştan elde edilen gelirden sadece bir zekât ödenir. Araştırmacı, \"varlıklar\" ifadesinin altın veya gümüşü kastettiğini belirtiyor ve el yazmalarındaki farklılıkları doğruluyor; bunun, Ebu Ubeyd'in servet üzerine yazdığı eserinde Ebu Musab ve Yahya ibn Bukayr tarafından Malik'ten rivayet edildiğini kaydediyor. {cite:muwatta-maruf-1997 s.344} {cite:muwatta-maruf-1997 s.345}"
  id: "Malik menjelaskan panjang lebar: Tidak ada perbedaan pendapat di antara kita mengenai utang, bahwa pemiliknya tidak membayar zakat sampai ia menerimanya. Bahkan jika utang tersebut tetap berada di tangan debitur selama bertahun-tahun dan kemudian ia menerimanya, ia hanya wajib membayar satu kali zakat. Jika ia menerima sejumlah uang yang tidak dikenakan zakat, dan ia memiliki aset lain yang dikenakan zakat, maka ia juga membayar zakat atas aset tersebut. Jika ia tidak memiliki aset lain, ia mencatat jumlah yang diterima sampai mencapai nisab (ambang batas minimum) dengan jumlah selanjutnya, dan kemudian ia membayar zakat atasnya, terlepas apakah ia telah menggunakan jumlah awal tersebut atau belum. Kemudian, ia membayar zakat atas jumlah selanjutnya, baik kecil maupun besar. Malik berpendapat bahwa utang yang telah jatuh tempo selama bertahun-tahun hanya memerlukan satu kali pembayaran zakat, berdasarkan contoh barang dagangan yang disimpan untuk diperdagangkan selama bertahun-tahun dan kemudian dijual. Hanya satu kali pembayaran zakat yang wajib dibayarkan atas hasil penjualan tersebut, karena zakat atas apa pun dibayarkan dari barang itu sendiri, bukan dari aset lain. Peneliti menyebutkan bahwa “aset” merujuk pada emas atau perak, dan ia menegaskan perbedaan dalam manuskrip, mencatat bahwa hal ini diriwayatkan dari Malik oleh Abu Musab dan Yahya ibn Bukayr dalam karya Abu Ubayd tentang kekayaan. {cite:muwatta-maruf-1997 p.344} {cite:muwatta-maruf-1997 p.345}"
