label: { ar: "جامع الترمذي 1181 — الحرام، ما حُرّم", en: "Jami' al-Tirmidhi 1181 — the unlawful; what was made unlawful", ur: "جامع ترمذی 1181 — حرام، جو حرام کیا گیا", es: "Jami' al-Tirmidhi 1181 — lo ilícito; lo que se hizo ilícito" }
text: "… فَإِنَّهُ إِنْ تَزَوَّجَ فَإِنَّهَا تَطْلُقُ. وَأَمَّا ابْنُ الْمُبَارَكِ فَشَدَّدَ فِي هَذَا الْبَابِ وَقَالَ إِنْ فَعَلَ لاَ أَقُولُ هِيَ حَرَامٌ. وَقَالَ أَحْمَدُ إِنْ تَزَوَّجَ لاَ آمُرُهُ أَنْ يُفَارِقَ امْرَأَتَهُ. وَقَالَ إِسْحَاقُ أَنَا أُجِيزُ فِي الْمَنْصُوبَةِ لِحَدِيثِ ابْنِ مَسْعُودٍ وَإِنْ تَزَوَّجَهَا لاَ أَقُولُ تَحْرُمُ عَلَيْهِ امْرَأَتُهُ. وَوَسَّعَ إِسْحَاقُ فِي غَيْرِ الْمَنْصُوبَةِ. وَذُكِرَ عَنْ عَبْدِ اللَّهِ بْنِ الْمُبَارَكِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1181، يذكر الحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 1181 (The Book on Divorce and Li'an), that mentions the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 1181، جس میں حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1181 (El Libro del Divorcio y el Li'an), menciona lo ilícito y lo que se ha declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo lícito e ilícito."
