text: "… على وجوبه بالإجماع على تحريم النظر إلى العَوْرة، وقال: لولا أن الختان فرض لما أبيح النظر إليها من المختون. وأجيب عن هذا بأن مثل هذا يباح لمصلحة الجسم كنظر الطبيب، والطبّ ليس بواجب إجماعاً؛ على ما يأتي في النحل بيانه …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 579، يرد فيه ذكر الفرض، والواجب، والوجوب، وما ليس بواجب، والمباح، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 579, whose wording mentions the obligatory (fard), the obligatory (wajib), obligation (wujub), what is said not to be obligatory, the permitted (mubah), forbidding (tahrim); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 579 کا اقتباس جس میں فرض، واجب، وجوب، جو واجب نہیں، مباح، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volume numérisé 3, p. 579, dont le texte mentionne l'obligatoire (fard), l'obligatoire (wajib), l'obligation (wujub), ce qui est dit non obligatoire, le permis (mubah), l'interdiction (tahrim) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Jami' li-Ahkam al-Qur'an de al-Qurtubi, volumen digitalizado 3, p. 579, cuyo texto menciona lo obligatorio (fard), lo obligatorio (wajib), la obligatoriedad (wujub), lo que se dice que no es obligatorio, lo permitido (mubah), la prohibición (tahrim); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
