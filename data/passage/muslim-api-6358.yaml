label: { ar: "صحيح مسلم 6358 — دفن وقبر ومرقد", en: "Sahih Muslim 6358 — a burial, grave or resting place", ur: "صحیح مسلم 6358 — تدفین، قبر اور مرقد", es: "Sahih Muslim 6358 — un entierro, tumba o lugar de descanso", fr: "Sahih Muslim 6358 — un lieu de sépulture, une tombe ou un lieu de repos", tr: "Sahih Muslim 6358 — Defin, mezar ve istirahat yeri", id: "Sahih Muslim 6358 — Pemakaman, kuburan, dan tempat peristirahatan" }
text: "… قَالَ \" لَكِنِّي أَفْقِدُ جُلَيْبِيبًا فَاطْلُبُوهُ \". فَطُلِبَ فِي الْقَتْلَى فَوَجَدُوهُ إِلَى جَنْبِ سَبْعَةٍ قَدْ قَتَلَهُمْ ثُمَّ قَتَلُوهُ فَأَتَى النَّبِيُّ فَوَقَفَ عَلَيْهِ فَقَالَ \" قَتَلَ سَبْعَةً ثُمَّ قَتَلُوهُ هَذَا مِنِّي وَأَنَا مِنْهُ هَذَا مِنِّي وَأَنَا مِنْهُ \". قَالَ فَوَضَعَهُ عَلَى سَاعِدَيْهِ لَيْسَ لَهُ إِلاَّ سَاعِدَا النَّبِيِّ قَالَ فَحُفِرَ لَهُ وَوُضِعَ فِي قَبْرِهِ. وَلَمْ يَذْكُرْ غَسْلاً."
summary:
  ar: "حديث في صحيح مسلم، رقم 6358، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6358 (The Book of the Merits of the Companions), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 6358، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6358 (El Libro de los Méritos de los Compañeros), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un hadith du Sahih Muslim, n° 6358 (Livre des mérites des Compagnons), mentionne un lieu de sépulture. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
  tr: "Sahih Müslim'de 6358 numaralı hadis, defin, mezar ve türbeden bahsetmektedir. Bu hadis, vasiyetnameler, miras, eski eserler ve türbeler üzerine araştırmalar yapan bir uzman tarafından, Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6358, menyebutkan tentang penguburan, kuburan, dan makam. Hadits ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
