text: "… تأذن ان اخرج فى جيش كذا وكذا. قال: لا. قالت: يا رسول اللّٰه - - ! انه ليس أريد ان اقاتل، انما اريد اداوى الجرحى، والمرضى او أسقى المرضى. قال: لولا ان تكون سنّة ويقال: فلانة خرجت لأذنت لك، ولكن …"
