text: "ر بالترك والإهمال. ٣١٢ وبالجملة فهذه الصناعة وتعلمها مستوفى في كتاب العمدة لا بن رشيق وقد ذكرنا منها ما حضرنا بحسب الجهد. ومن أراد يجب فيها. ومن أحسن ما قيل في ذلك وأظنه لابن رشيق: لعن الله صنعة الشعر ماذا"
