text: |-
  ⁦(فصل الطاء)⁩
  وقال غيره تضبح تنحم وهوموت أنفاسها اذاعدون قال عنترة
  والخيل تعلم حين تضح فى حياض الموت ضب
  والضبح أيضا الرماد وضبحته النار غيرته ولم تبالغ فيه قال الشاعر
  فلما أن تلهوجنا شراء • به اللهبان مقهو راضها
  وانضح لونه أى تغير الى السواد قليلا وقال عاقتها قبل انضاح لونى
  والضباح ضوت
  الشعاب والمضبوحة حجارة القداحة التى كانها محترقة وقال
  والمروذا القداح مضوح الفلق ومضوح اسم رجل ⁦(ضحح)⁩ ماء ضضاح ،ى
  قريب القعر وضحضح السراب وتضجضح اذا تر قرق والضح الشمس وفى الحديث لا يقعدن
  أحدكم بين الضح والظل قانه مقعد الشيطان قال ذوالرمة يصف الحرباء
  غداأ كهب الاعلى وراح كانه * من الضح واستقباله الشمس أخضر
  أى واستقباله عين الشمس وقولهم جاءفلان بالضح والريح أى بماطلعت عليه الشمس وماجرتأ
  عليه الريح يعنى من الكثرة والعامة تقول بالضيح والرويح وليس بشئ رح . الضرح
  التنحية وقد ضر حه أى نحماه ود فعه فهوشئ مضطرح أى مرمى فى ناحبة قال الشاعر
  فلما ان أتينءلى أضاح+ ضرحن حصاء أشتاناعزبنا
  وضرحت عنى شهادة القوم اذاجر حتها وألقيتها عنك الاصحعى انضرح ما بين القوم مثسل
  انضرح اذا تساعد واضر حه عنك أى أبعده والضريح البعيد والضريح السو فى وسط القبر
  واللعد فى الجانب وقد ضرحت ضرحا اذاحرته والضروح الفرس النفوح برجله تقول
  ضرحت الدابة برجلها اذار محت وفيهاضراح والضراح بالضم بيت فى السماء وهوالبيت
  المعمور عن ابن عباس وقوس ضروح اذا كانت شديدة الدفع والحفز للسهم والمضرحىّ
  الصقر الطويل الجناح وربعماقيل للسيد مضر حىّ قال الشاءر
  بأبيض من أَمية مضرحىّ * كأن جبينه سيف صنيع
  (ضيح الضيح والضياح بالفتح اللبن الرقيق المعزوح قال الراجز
  امتخضا وسقيانى الضيحا وضيحت اللبن تضيحا مز جته حتى صارضيحا وضيحت الرجل
  وقيته الضيح
  وبالشئ طرحا اذا رميته وطرح النوى بفلان كل مطرح اذا نأت به وطرّحه تطر يحا اذا اكثر
  من طرحه واطرحه أى أبعده وهو افتعله والطرح بالتحريك المكان البعيد قال الاعشى
  تبتنى الجد وتسم وللعلى • وترى نارك من نامطرح
  والطروح مثله وقوس طروح مثل ضروح شديدة الخفز للسهم ونخلة طروح أى طويلة
  العراجين وسيرطراحى بالضم أى بعيد وأنشد الاصمعى
  بسير طراحترى من نجائه * جلود المهارى بالندى الجون نذبع
  ومطارحة الكلام معروف وسنام إطريح أى طويل وطرح بناءه تطريحا اذاطوله جدًا
  ٤ ٧
  محداح
  لع
  قوله معروف وهو الناء القوم
  المسائل بعضهم على بعض تقول
  طارحه الكلام متعديا الى
  مفعولين كما فى المختار !ه
