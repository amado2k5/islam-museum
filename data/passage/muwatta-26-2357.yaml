label: { ar: "الموطأ 2357 — مالك: الوصية في العتاقة تخالف التدبير", en: "Muwatta 2357", es: "Muwatta 2357", fr: "Muwatta 2357", ur: "موطا 2357", tr: "Al-Muwatta 2357 — Malik: Köle azad etme ile ilgili bir vasiyetname, tevbir (vekâlet) ilkesine aykırıdır.", id: "Al-Muwatta 2357 — Malik: Wasiat mengenai pembebasan bertentangan dengan prinsip tadbir (mandat)." }
summary:
  ar: "قال: الوصية في العتاقة مخالفة للتدبير، والسنة فرقت بين ذلك. ولو كانت الوصية بمنزلة التدبير، لكان كل موص لا يقدر على تغيير وصيته، وكان قد حبس عليه من ماله ما لا يستطيع أن ينتفع به. {cite:muwatta-maruf-1997 p.372}"
  tr: "Şöyle dedi: Köleliğin azaltılmasına ilişkin bir vasiyetname, şartlı köleliğin azaltılmasından farklıdır ve Sünnet ikisi arasında ayrım yapar. Eğer bir vasiyetname şartlı köleliğin azaltılmasına eşdeğer olsaydı, her vasiyetçi vasiyetini değiştiremezdi ve mal varlığından faydalanamayacağı şeyleri esirgemiş olurdu. {cite:muwatta-maruf-1997 s.372}"
  id: "Beliau berkata: Wasiat mengenai pembebasan budak berbeda dengan pembebasan budak bersyarat, dan Sunnah membedakan keduanya. Jika wasiat disamakan dengan pembebasan budak bersyarat, setiap pewaris tidak akan dapat mengubah wasiatnya, dan ia akan menahan dari hartanya apa yang tidak dapat ia manfaatkan. {cite:muwatta-maruf-1997 p.372}"
