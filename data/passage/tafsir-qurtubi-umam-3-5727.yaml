text: "… يؤمر بأهل الجنة إلى الجنة؛ أي أخرجوا من جملتهم. قال قتادة: عُزِلوا عن كل خير. وقال الضحاك: يمتاز المجرمون بعضهم من بعض، فيمتاز اليهود فرقة، والنصارى فرقة، والمجوس فرقة، والصابئون فرقة، وعبدة الأوثان فرقة. وعنه أيضاً : إن لكل فرقة …"
