text: "حَدَّثَنِي يَحْيَى، عَنْ مَالِكٍ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، كَانَ يُخْرِجُ زَكَاةَ الْفِطْرِ عَنْ غِلْمَانِهِ الَّذِينَ، بِوَادِي الْقُرَى وَبِخَيْبَرَ. وَحَدَّثَنِي عَنْ مَالِكٍ، أَنَّ أَحْسَنَ، مَا سَمِعْتُ فِيمَا، يَجِبُ عَلَى الرَّجُلِ مِنْ زَكَاةِ الْفِطْرِ أَنَّ الرَّجُلَ يُؤَدِّي ذَلِكَ عَنْ كُلِّ مَنْ يَضْمَنُ نَفَقَتَهُ وَلاَ بُدَّ لَهُ مِنْ أَنْ يُنْفِقَ عَلَيْهِ وَالرَّجُلُ يُؤَدِّي عَنْ مُكَاتَبِهِ …"
summary:
  ar: "حديث في موطأ مالك، رقم 625، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Muwatta Malik, no. 625 (Zakat), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "موطأ مالک کی حدیث نمبر 625، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 625 (Zakat), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
