  كخلفة من أبى رباح • يسمعه الاهه الكبار
  أى الاهه أدخلت عليه الالف واللام فجرى مجرى الاسم العلم كالعباس والحسن الانه
  يخالف الاعلام من حيث كان صفة وقولهم يا أللّٰه يقطع الهمزة انما جازلاته ينوى به الوقف
  على حرف النداء تغخيما للاسم وقواهم لاهتم واللهم فالميم بدل من حوف التداء وربعماجع بين
  البدل والمبدل منه فى ضرورة الشعركة ول الراجزه عفوت أوعذبت يا اللهماء لات للشاعر
  أن يردّ الشئ الى أصله قال الشاعر
  لاما بن عمك لا أفضلات فى حسب • عنى ولا أنت ديانى فتخزونى
  أراد للّٰه ابن عمك فحذف لام الجر واللام التى بعدها وأما الالف فهى منقلبة عن الياء بدلالة
  قولهم لهى أبوك ألاترى كيف ظهرت اليساه لما قلبت الى موضع اللام وأمالاهوت فان صح
  انه من كلام العرب فمكون اشتقاقه من لاء ووزنه فعلوت مثل رغبوت ورحوت وليس بمقاوب
  كما كان الطاغوت مقلويا واللات اسم صنم كان لثقيف وكان بالطائف وبعض العرب يقف
  عليها بالتاء وبعضهم بالهاء قال الاخفش سمعنا من العرب من يقول أفرأيتم اللات والعزى
  بالتاءويقول هى اللات فيجعلها تا فى المسكوت وهى اللات فاعلم أنه جرّ فى موضع الرفع
  نهذا مثل أمس مكسور على كل حال وهو أجود منه لات الالف واللام اللتان فى اللات
  لا تسة طان وان كانتازاتدتين قال وأمّا ما سمعينا من الاكثرف اللات والعزى فى السكوت عليها
  فاللاه لانهاهاء فصارت تاء فى الاصل وهى فى تلك اللغة مثل كان من الامركيت وكيت
