label: { ar: "صحيح البخاري 3508 — الأب والأبوة، النسب والانتساب", en: "Sahih al-Bukhari 3508 — the father and fatherhood; paternity and lineage", ur: "صحیح بخاری 3508 — باپ اور والدیت، نسب اور انتساب", es: "Sahih al-Bukhari 3508 — El padre y la paternidad; paternidad y linaje", fr: "Sahih al-Bukhari 3508 — le père et la paternité; la paternité et la lignée" }
text: "حَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، عَنِ الْحُسَيْنِ، عَنْ عَبْدِ اللَّهِ بْنِ بُرَيْدَةَ، قَالَ حَدَّثَنِي يَحْيَى بْنُ يَعْمَرَ، أَنَّ أَبَا الأَسْوَدِ الدِّيلِيَّ، حَدَّثَهُ عَنْ أَبِي ذَرٍّ ـ أَنَّهُ سَمِعَ النَّبِيَّ يَقُولُ \" لَيْسَ مِنْ رَجُلٍ ادَّعَى لِغَيْرِ أَبِيهِ وَهْوَ يَعْلَمُهُ إِلاَّ كَفَرَ، وَمَنِ ادَّعَى قَوْمًا لَيْسَ لَهُ فِيهِمْ فَلْيَتَبَوَّأْ مَقْعَدَهُ مِنَ النَّارِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 3508، يذكر الأب والأبوة، والنسب والانتساب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3508 (Virtues and Merits of the Prophet (pbuh) and his Companions), that mentions the father and fatherhood, paternity and lineage. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 3508، جس میں باپ اور والدیت، نسب اور انتساب کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 3508 (Virtudes y méritos del Profeta y sus Compañeros), menciona al padre y la paternidad, la genealogía y el linaje. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 3508 (Vertus et Mérites du Prophète et de ses Compagnons), mentionne le père, la paternité et la filiation. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
