text: "… ص. وقد ذُكر الخبر فى المعجم الصغير للطبرانى ص. كما ذكر جواب الحديث وهذا نصه كما فى الطبرانى : روى عبد اللّه بن مسعود فقال: دخلت على رسول اللّٰه عي فقال يا ابن مسعود: أى عرى الإيمان أوثق؟ قلت اللّٰه …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 5844، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
