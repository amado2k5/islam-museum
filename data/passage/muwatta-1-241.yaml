ref: "1.241"
label: { ar: "الموطأ 241 — تشهد ابن عمر ودعاؤه وتسليمه", en: "Muwatta 241" }
text: "بسم الله، التحيات لله، الصلوات لله، الزاكيات لله، السلام على النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، شهدت أن لا إله إلا الله، شهدت أن محمداً رسول الله"
summary:
  ar: "أثر يرويه يحيى عن مالك عن نافع، في باب التشهد في الصلاة: كان عبد الله بن عمر يتشهد بصيغة تبدأ بالبسملة ثم التحيات لله والصلوات لله والزاكيات لله، يقولها في الركعتين الأوليين ويدعو بعدها بما بدا له، فإذا جلس في آخر صلاته تشهد كذلك ثم دعا، فإذا أراد أن يسلم قال: السلام على النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، السلام عليكم عن يمينه، ثم يرد على الإمام، فإن سلم عليه أحد عن يساره رد عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.144} {cite:muwatta-maruf-1997 p.145}"
