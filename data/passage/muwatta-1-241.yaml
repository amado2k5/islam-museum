label: { ar: "الموطأ 241 — تشهد ابن عمر ودعاؤه وتسليمه", en: "Muwatta 241", es: "Muwatta 241", fr: "Muwatta 241", ur: "موطا 241", tr: "El-Muvatta 241 — İbn Ömer'in şahitliği, duası ve selamı", id: "Al-Muwatta 241 — Kesaksian, doa, dan salam Ibnu Umar" }
text: "بسم الله، التحيات لله، الصلوات لله، الزاكيات لله، السلام على النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، شهدت أن لا إله إلا الله، شهدت أن محمداً رسول الله"
summary:
  ar: "أثر يرويه يحيى عن مالك عن نافع، في باب التشهد في الصلاة: كان عبد الله بن عمر يتشهد بصيغة تبدأ بالبسملة ثم التحيات لله والصلوات لله والزاكيات لله، يقولها في الركعتين الأوليين ويدعو بعدها بما بدا له، فإذا جلس في آخر صلاته تشهد كذلك ثم دعا، فإذا أراد أن يسلم قال: السلام على النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، السلام عليكم عن يمينه، ثم يرد على الإمام، فإن سلم عليه أحد عن يساره رد عليه. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومحمد بن الحسن ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.144} {cite:muwatta-maruf-1997 p.145}"
  tr: "Yahya'nın, Malik'ten, o da Nafi'den rivayet ettiği, namazdaki teşehhüd ile ilgili bir rivayet: Abdullah ibn Umar, teşehhüdü Besmele (Rahman ve Rahim olan Allah'ın adıyla) ile başlayıp, ardından \"Bütün selamlar, dualar ve temiz şeyler Allah'a aittir\" diyerek okurdu. Bunu ilk iki rekatta söyler, sonra dilediği gibi dua ederdi. Namazın sonunda oturduğunda da aynı şekilde teşehhüdü okur ve dua ederdi. Selam vermek istediğinde, sağındaki kişiye \"Peygambere selam olsun, Allah'ın rahmeti ve bereketi üzerimize olsun. Bize ve Allah'ın salih kullarına selam olsun. Size selam olsun\" derdi. Sonra imama selam verirdi. Solundan biri ona selam verirse, o da selamı iade ederdi. Araştırmacı, bunun Malik'ten rivayetle Ebu Mus'ab, Süveyd, Muhammed ibn el-Hasan ve Yahya ibn Bukayr tarafından el-Beyhaki tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.144} {cite:muwatta-maruf-1997 s.145}"
  id: "Riwayat dari Yahya, berdasarkan Malik, berdasarkan Nafi', mengenai Tasyahhud dalam salat: Abdullah ibn Umar biasa membaca Tasyahhud dengan cara diawali dengan Basmala (Dengan nama Allah, Yang Maha Pengasih, Yang Maha Penyayang), diikuti dengan \"Segala salam, doa, dan hal-hal yang suci adalah milik Allah.\" Beliau mengucapkan ini pada dua rakaat pertama dan kemudian berdoa sesuai keinginannya. Ketika duduk di akhir salatnya, beliau membaca Tasyahhud dengan cara yang sama dan kemudian berdoa. Ketika ingin mengucapkan Taslim (salam), beliau mengucapkan: \"Salam sejahtera atas Nabi, dan rahmat Allah serta nikmat-Nya. Salam sejahtera atas kami dan atas hamba-hamba Allah yang saleh. Salam sejahtera atas kalian,\" ke arah kanan. Kemudian beliau membalas salam kepada Imam. Jika ada yang memberi salam dari sebelah kirinya, beliau akan membalas salam tersebut. Peneliti menyebutkan bahwa diriwayatkan atas wewenang Malik oleh Abu Mus'ab, Suwaid, Muhammad ibn al-Hasan, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {kutip:muwatta-maruf-1997 hal.144} {kutip:muwatta-maruf-1997 hal.145}"
