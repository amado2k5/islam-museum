text: "… يُنصَرُونَ وهكذا وقع، فإنهم يوم خَيْبَر أذلَّهم الله وأرْغَمَ آنا فَهُم وكذلك من قبلهم من يهود المدينة: بني قَيْنُقَاع وبني النَّضِير وبني قُرَيْظَة كلهم أذلَّهُمُ الله، وكذلك النصارى بالشام كَسَرهم الصحابة في غير ما موطن، وسَلَبوهم مُلْك الشام أبد الآبدين …"
summary:
  ar: "مقطع من تفسير ابن كثير، المجلد المصوَّر 1، ص 1089، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn Kathir's Tafsir, scan volume 1, p. 1089, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "تفسیر ابن کثیر، اسکین جلد 1، ص 1089 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Tafsir de Ibn Kathir, volumen 1, pág. 1089, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait du Tafsir d'Ibn Kathir, volume 1, page 1089, mentionnant des nations, religions et peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est référencé dans le navigateur Umam."
  tr: "İbn Kathir'in Tefsir'inin 1. cildinin 1089. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
  id: "Cuplikan dari Tafsir Ibnu Katsir, Jilid 1, halaman 1089, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban untuk bangsa, agama, sekte, dan masyarakat non-Muslim."
