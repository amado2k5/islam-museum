text: "صراط مستقيم) يوبخ تعالى أهل خصوصا والمبين لها أفضل الخلو الكتاب من اليهود والنصارى على وأعلمهم وأفصحهم وأنصحهم ويا منيتي من دون كل أمان آمن بالله عنها وتحريفها وتعويجها عما في طلب الخير مجالا، ثم أخبر أن من جعلت له،"
