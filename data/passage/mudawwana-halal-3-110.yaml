text: "… تحل له من أجل ان المرأة لا يحل لها أن تنكح عبدها وتعتد منه عدة الحرة ثلاثة قروء هي ابن وهب قال يونس وقال ربيعة اذا ورئت زوجها أو بعضه فقد حرمت عليه وان أعتقته فأحب أن ينكحها نكهها ولا …"
summary:
