label: { ar: "الموطأ 1358 — يحيى بن سعيد: كان عليه مشي فأصابته خاصرة فركب حتى أتى مكة، فأفتاه عطاء بالهدي، ثم أمره أهل المدينة أن يمشي من حيث عجز", en: "Muwatta 1358", es: "Muwatta 1358", fr: "Muwatta 1358", ur: "موطا 1358", tr: "El-Muvatta 1358 — Yahya ibn Said: Yürümesi gerekiyordu, fakat bacağında bir sakatlık geçirdi, bu yüzden Mekke'ye ulaşana kadar at üzerinde gitti. Ata ona kurban kesmesini emreden bir fetva verdi, bunun üzerine Medine halkı yürüyemediği yerden yürümesini emretti.", id: "Al-Muwatta 1358 — Yahya ibn Saeed: Ia diharuskan berjalan kaki, tetapi ia mengalami cedera otot paha belakang, sehingga ia menunggang kuda hingga sampai di Mekah. Ata memberinya fatwa yang mengharuskannya untuk mempersembahkan hewan kurban, kemudian penduduk Madinah memerintahkannya untuk berjalan kaki dari tempat ia tidak mampu lagi." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه كان عليه مشي، فأصابته خاصرة فركب حتى أتى مكة، فسأل عطاء بن أبي رباح وغيره، فقالوا عليك هدي. فلما قدم المدينة سأل، فأمروه أن يمشي مرة أخرى من حيث عجز، فمشى. {cite:muwatta-maruf-1997 p.607}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ettiğine göre, yürümekle yükümlüydü, ancak yanından yaralandığı için Mekke'ye kadar at üzerinde gitti. Ata' ibn Abi Rabah ve diğerlerine sordu ve onlar da ona kurban kesmesi gerektiğini söylediler. Medine'ye vardığında tekrar sordu ve onlar da ona, yürüyemez hale geldiği yerden tekrar yürümesini söylediler, o da yürüdü. {cite:muwatta-maruf-1997 s.607}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia wajib berjalan kaki, tetapi ia mengalami cedera di bagian samping tubuhnya, sehingga ia menunggang kuda hingga sampai di Mekah. Ia bertanya kepada 'Ata' ibn Abi Rabah dan yang lainnya, dan mereka mengatakan kepadanya bahwa ia harus mempersembahkan kurban. Ketika ia tiba di Madinah, ia bertanya lagi, dan mereka menyuruhnya untuk berjalan kaki lagi dari tempat ia tidak mampu lagi berjalan, maka ia pun berjalan kaki. {cite:muwatta-maruf-1997 p.607}"
