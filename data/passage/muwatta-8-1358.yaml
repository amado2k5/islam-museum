label: { ar: "الموطأ 1358 — يحيى بن سعيد: كان عليه مشي فأصابته خاصرة فركب حتى أتى مكة، فأفتاه عطاء بالهدي، ثم أمره أهل المدينة أن يمشي من حيث عجز", en: "Muwatta 1358" }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه كان عليه مشي، فأصابته خاصرة فركب حتى أتى مكة، فسأل عطاء بن أبي رباح وغيره، فقالوا عليك هدي. فلما قدم المدينة سأل، فأمروه أن يمشي مرة أخرى من حيث عجز، فمشى. {cite:muwatta-maruf-1997 p.607}"
