text: "سنة حيّان لابنه اذ رايتنى قد حوّلت قلنسوتي ومضيتُ نحو عسكر وكيع فملْه بمن معك من العجم الى فوقف ابن حيان مع العجم فلما حوّل حيَّان قلنسوته مالت الأعجام الى عسكر وكيع فكبّرة اصحابه، وبعث قنيبة اخاه صالحا الى الناس …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 3، ص 23، يذكر نقط المصحف وشكله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Tabari's Tarikh al-Rusul wa-l-Muluk, scan volume 3, p. 23, that mentions the dotting and vowel marks of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الرسل والملوک، طبری، اسکین جلد 3، ص 23 کا اقتباس جس میں مصحف کے نقطے اور اعراب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Rusul wa-l-Muluk de al-Tabari, volumen 3, pág. 23, que menciona los puntos y las marcas vocálicas del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Rusul wa-l-Muluk d'al-Tabari, volume 3, page 23, mentionne la ponctuation et les signes vocaliques du mushaf; extrait de la numérisation, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Tabari'nin Peygamberler ve Krallar Tarihi, Resimli Cilt 3, sayfa 23'ten bir alıntı, Kur'an'ın diyakritik işaretlerini ve biçimini ele almaktadır; bu alıntı, makineyle okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Kur'an okunuşları, yazısı, hat sanatı ve diyakritik işaretleri konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari Sejarah Para Nabi dan Raja karya Al-Tabari, Jilid 3 Bergambar, hlm. 23, menyebutkan tanda diakritik dan bentuk Al-Qur'an; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan diakritik."
