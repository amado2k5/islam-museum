text: "لا يحتجم المحرم إلا أن يضطر إليه مما لا بد له منه"
summary:
  ar: "يرويه مالك عن نافع عن عبد الله بن عمر، أنه كان يقول: لا يحتجم المحرم إلا أن يضطر إليه مما لا بد له منه. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1190) وسويد ومحمد بن الحسن الشيباني (416)، وأنه عند البخاري معلقاً من طريق مالك. {cite:muwatta-maruf-1997 p.470}"
