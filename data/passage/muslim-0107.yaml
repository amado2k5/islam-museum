label: { ar: "مسلم 107 — شيخ زان وملك كذاب وعائل مستكبر", en: "Muslim 107 — An old adulterer, a lying king, a proud beggar", es: "Musulmán 107 — Un viejo adúltero, un rey mentiroso, un mendigo orgulloso", fr: "Muslim 107 — Un vieil adultère, un roi menteur, un mendiant orgueilleux", ur: "مسلم 107 - بوڑھا زانی، جھوٹا بادشاہ، مغرور فقیر", tr: "Müslim 107 — Şehvet düşkünü bir şeyh, yalancı bir kral ve kibirli bir yoksul", id: "Muslim 107 — Seorang syekh yang cabul, seorang raja yang pendusta, dan seorang pengemis yang sombong" }
text: "قال رسول الله: «ثلاثة لا يكلمهم الله يوم القيامة ولا يزكيهم — ولا ينظر إليهم — ولهم عذاب أليم: شيخ زان، وملك كذاب، وعائل مستكبر»"
summary:
  ar: "رواية أبي هريرة في الباب نفسه من كتاب الإيمان في صحيح مسلم؛ صيغة ثانية من ثلاثية الذين لا يكلمهم الله: من جمع الكبر إلى حاجته أو لؤمه إلى سلطانه أو شيخوخته إلى فاحشته."
  tr: "Sahih Müslim'in aynı bölümünde Ebu Hurayra'nın rivayeti, Allah'ın konuşmadığı üç kimseyi ikinci kez tanımlar: kibirle ihtiyacını birleştiren, cimrilikle gücünü birleştiren veya yaşlılıkla ahlaksızlığını birleştiren kimse."
  id: "Riwayat Abu Hurairah dalam bab yang sama dari Kitab Iman dalam Sahih Muslim adalah versi kedua dari tiga serangkai orang yang tidak diajak bicara oleh Allah: orang yang menggabungkan kesombongan dengan kebutuhannya, atau kekikiran dengan kekuasaannya, atau usia tua dengan kecabulannya."
