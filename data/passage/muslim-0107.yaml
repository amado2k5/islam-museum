label: { ar: "مسلم 107 — شيخ زان وملك كذاب وعائل مستكبر", en: "Muslim 107 — An old adulterer, a lying king, a proud beggar" }
text: "قال رسول الله: «ثلاثة لا يكلمهم الله يوم القيامة ولا يزكيهم — ولا ينظر إليهم — ولهم عذاب أليم: شيخ زان، وملك كذاب، وعائل مستكبر»"
summary:
  ar: "رواية أبي هريرة في الباب نفسه من كتاب الإيمان في صحيح مسلم؛ صيغة ثانية من ثلاثية الذين لا يكلمهم الله: من جمع الكبر إلى حاجته أو لؤمه إلى سلطانه أو شيخوخته إلى فاحشته."
