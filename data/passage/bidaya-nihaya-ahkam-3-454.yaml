text: "… نبيّ اسمه أحمد ومحمد، صادقاً سيداً، لا أغضب عليه أبداً، ولا يغضبني أبداً، وقد غفرت له قبل أن يعصيني ما تقدم من ذنبه وما تأخر، أمته مرحومة، أعطيهم من النوافل مثل ما أعطيت الأنبياء، وافترضت عليهم الفرائض التي افترضت على …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 3، ص 454، يرد فيه ذكر الفريضة والفرائض، وما فرضه الله ورسوله، وما فُرض على الناس، والنافلة والنوافل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 3, p. 454, whose wording mentions the obligation (farida), what God and His Messenger made obligatory, what was made obligatory on people, the supererogatory (nafila); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 3، ص 454 کا اقتباس جس میں فریضہ اور فرائض، جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، نفل اور نوافل کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Bidaya wa-l-Nihaya de Ibn Kathir, volume numérisé 3, p. 454, dont le texte mentionne l'obligation (farida), ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, le surérogatoire (nafila) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen digitalizado 3, p. 454, cuyo texto menciona la obligación (farida), lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo supererogatorio (nafila); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 3. cildinin 454. sayfasından bir alıntı, farz olan amelleri ve görevleri, Allah ve Resulü'nün emrettiklerini, insanlar üzerine farz olanları, nafile amelleri ve gönüllü amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 3, halaman 454, menyebutkan amalan dan kewajiban yang wajib, apa yang telah ditetapkan oleh Allah dan Rasul-Nya, apa yang wajib bagi manusia, serta amalan sunnah dan amalan sukarela. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip dalam sekitar empat puluh kata sesuai dengan pedoman sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
