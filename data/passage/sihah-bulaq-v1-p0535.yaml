text: |-
  ١ يحى مثلَ وردت الماء
  التقاطااه مترجم
  قولة بيحة بشة الياءكسيدة بعف
  التى تناوحها أى تقابلها يقال
  تناوح التجراذا قابل بعضه يعضا
  إ مد
  ٨٠٦
  [ياب البا-)
  سيبويه النقابة بالكسر الاسم وبالفتح المصدر مثل الولاية والولاية أبو عبيد النقيبة النفس
  يقال فلان مهون النقيبة اذا كان مبارك النفس قال ابن السكيت اذا كان ميمون الامر
  ينجبح فيما يحاول ويظفر وقال ثعلب اذا كان معون المشورة وكلب نقيب نقبت غلصمت
  ليضعف صوته يفعله اللثيم الملايسمع صوته الاضياف والنقاب نقاب المرأة وقد انتقبت وانها
  لحسنة النقبة بالمكسر وناقبت فلانا اذا القيته فأة واقيته نقابا ووردت الماءنة ابامئل
  التقاطا ⁦(١)⁩ اذا هجمت عليه من غير طلب والنقاب أ يضا الرجل العلامة قال أوس بن جر
  كريم جواد أخوماقط • نقاب يعدث بالغائب
  ونقبوا فى البلاد ساروا فيها طلي للمهرب ⁦( نكب)⁩ أبوز يدنكب عن الطريق
  بنكب نكوبا أى ء_دل وذ.كب على قومه ينكب نكابة اذا كان منكبالهم يعتمدون عليه وهو
  رأس العرفاء ونكبته الجارة نكبا أى لنمته وخدشته والنكيب دائرة الحافر والخف
  قال لسفٱو
  وتصك المرو لماثجرت • شكيب معر دامى الاطل
  ونكب كانته نبكا كيماونكبه تنكيبا أى عسدل عنه واعتزله وتنكبه أى تجنبه وتنكب
  القوس أى ألقاها على منكبه والنكبة واحدة نكبات الدهرتقول أصابته نكبة ونكب فلان
  فهو منكوب والمنكب مجمع عظم العضد والكتف والمناكب أيضافى جناح الطائر أربع بعد
  القوادم والمنكب من الارض الموضع المرتفع والنكباء الريح الناكبة التى تشكب عن
  مهاب الرياح القوم والنكب فى الرياح أربع فنكباء الصبا والجنوب تسمى الازيب ونكبا.
  الصباوالشمال تسمى الصابية وتسمى الفكيباء أيضا وانماصغروها وهم يريدون تكبيرها لانهم
  يستبردونهاجدا ونكاء الشمال والدبور قرّة نسمى الجربيا وهى نيحة الازيب ونكباء الجنوب
  والدبور حارة تسمى الهيف وهي نيحة النكيباه لان العرب تناوح بيزهذه النكب كمانا وحوا
  بين الفوم من الرياح والنكب بالتحريك الميسل فى الشئ والنكب داء يأخذ الابل فى مذا كيها
  فتظلع منه وتمثى منحرفة يقمال نكب البعير بالكسر ينكب نكباذ، وأنكب قال العديس
  لا يكون النكب الا فى الكتف قال الشاءر
  فهلا أعذونى لمثلى تفاقدوا • اذا الخصم أبزى مائل الرأس أتكب
  وهو من صفة المتطاول الجمائر والانكب الذى لاقوس معه ب اب عنى فلان ينوب
  منابا أى قام مقامى وانتاب فلان القوم اننيابا أى أناهم مرة بعسد أخرى وه وافتعال من
  النوية ومنه قول الهذلى
  أقب طريد بنزما افلا • فلايرد الماء الااتنيايا
  ويروى اثتيابا وهو افتعال من آب يؤوب اذا أتى ليلا وأناب الى اللّٰه اى أقبل وتاب والنوبة
  واحسدة النوب تقول جاءت نوبتك ونيابتك وهم يتناوبون النوبة فيما بينهم فى الماهوغيره
  والنوية بالضم الاسم من قولا فابه أمر وانسابه أى أصابه والنائسة المصيبة واحدة نواتب
  الدهر والنوب والنوية ايضاجيل من السودان الواحد نوبى والذوب أيضا النجل وهوجع
  نائب مثسل عائط وعوط وفاره وفره لانها ترعى وتنوب الى مكانها قال الاصعى هو من النوبة
  التى تنوب الفاس لوقت معروف وقال أبو عبيد سميت نو بالام انضرب الى السواد
  قال
