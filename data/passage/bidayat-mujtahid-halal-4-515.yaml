text: "… حال الاختيار. الجملة الثانية: نذكر فيها أحوالها في حال الاضطرار. الجملة الأولى في المحرمات من الأطعمة في حال الاختيار والأغذية الإنسانية نبات وحيوان. فأما الحيوان الذي يغتذى به، فمنه حلال في الشرع، ومنه حرام، وهذا منه برِّي ومنه بحري. والمحرمة …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 4، ص 515، يذكر الحلال، والحرام، والمحرمات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
