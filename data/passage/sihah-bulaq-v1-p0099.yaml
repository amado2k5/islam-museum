text: |-
  ٥٤٢
  ⁦(و نض)⁩
  وتنفض عنها غيب كل خميلة * وتخشى رماة الفوث من كل مرصد
  واستنفض القوم أى بعثوا النفيضة ويقال اذا تكامت ليلا فا خفض واذا ت-كامت نهارا
  فانفض أى التفت هل ترى من تكره ⁦( نقض)⁩ النقض نقض البناء والحبل والعهد
  والنقاضة ما نقض من حبل الشعر والمناقصة فى القول أن يتكلم بعايتنا قض معناه والنقيضة
  فى الشعر ما ينقض به والانتقاض الانشكاث والنقض بالكسر البعير الذى أنضاه السفر
  وكذلك الناقة والمع أنقاض والفقض أيضا الموضع الذى ينتقض عن الكمة والنقض أيضا
  المنقوض مثل الذكث وتنقضث الارض عن الكمأة أى تفطرت وانقضت العقاب أى
  صوّتت وأنشد الاصمعى تنقض أيديها نقيض العقبان وكذلك الدجاجة قال الراجز
  تنقض انقاض الدجاج المخض والانقاض والكنيت أصوات صغار الابل والقرقرة والهدير
  . أصوات مسان الابل قال شظاظ وهولص من بى ضية
  رب عجوز من غير شهبره • علتها الانقاض بعد القرقره
  أى أسمعتها وذلك أنه اجتاز على امرأة من بن غمير تعقل بعير الها وتتعوذ من شظاظ وكان
  شظاظ على بكر فنزل وسرق بعسيرها وترك هناك بكره قال أبوزيد أنقضت بالمعزانقا ضادعوت
  بها والانقاض صو يت مثل النقروانقاض العلل نصويته وهو مكروه وأنفض الحمل ظهره
  أى أثقله وأصله الصوت ومنسه قوله تعالى الذى آنقض ظهرك والنقيض صوت المحامل
  والرحال قال الراجز شيب اصداغى فهنّ بيض • محامل لقد ها نقيض
  ( نهض نهض يتهض نهضا ونهو ضا أى قام وأنهضته أنا فانتهض واستنهضته لامر كذا
  اذا أمرته بالنهوض له وناهضته أى قاومته وتناهض القوم فى الحرب اذا نهض كل فريق
  الى صاحبه ونهض النبت اذا استوى قال الراجزيصف كبره
  وريية تنهض بالتشدد
  ونهض الطائراذايسط جناحيه ليطير والناهض فرخ الطائر الذى وفرحناحاه ونهض للطيران
  قال الشاعر⁦(امر والقيس)⁩
  راشهمن ريش ناهضة • ثم أمهاه على حجره
  والناهض اللحم الذى يلى عضد الفرس من أعلاها وناهضة الرجل بنوايه الذى يغضبون له
  ومالفلان ناهضة وهم الذين ية ومون بأهره والنهض من البعيرما بين المنكب والكتف والجع
  أنحض مثل فلس وأفلس قال الراجز (هميان
  وقربوا كل جمعالى عضه • أبق السناف أثرا بأنهضه
  وتهضت فلانانهضاظلمته ⁦(نوض)⁩) ناض فسلانا ينوض نوضا ذهب فى البلادوأيضا تأخر
  ونكص ونضث الشئء اذا عالحته لتنزعه مثل الغصن والوتد ونحوه والانواض والانا ويض
  مواضع عتفعة ومنه قول لبيد أروى الاناويض وأروى مذنيه والنوض
  وصسلة مابين عجز البعيرومتنه ومنه قول الراجز جاذبن بالاصلاب والانواض
  ل( قصل الواد % ⁦( وشض)⁩ الوخض طحن غيريائف وقد وشفته بالرع والوخيض
  المطعون قال ذوارمة يصف تورا
  وتارة يخض الاسحار عن عرض • وخضا وتنتظم الاسدار والجب
  ورض
