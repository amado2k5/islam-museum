text: "… الهاسيِّ من بكْرِ إذا ما بُنادَى بالرحيل سَعَى بها أمامَهُمُ الحَوْلِيْ من وَلَدِ الذَّرْ وقال أبو عُبيدة : كان لعبد اللّٰه بن جُدْعان جَفْنَة يأ كل منها القائمُ والراكب. كذا فى البخلاء الرباب ودارم وسعد والفزر : أسماء قبائل. والتراضبة …"
