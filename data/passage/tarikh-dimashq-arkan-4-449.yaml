text: "… أبُو خليفة الفضل بن الحُبَابُ الجُمحَي - إملاء - نا أحمَد بن الفرات، عن عُبَيد اللّه بن مُوسَى، نا دَاوُد عن الشعبي، عن جرير بن عَبد اللّه قال: قالَ رَسُول الله لَلِقِ بُني الإسلام على خَمسٍ: شَهَادة أن لا إله …"
summary:
