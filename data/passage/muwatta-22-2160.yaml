label: { ar: "الموطأ 2160 — مالك: بلغه أن عمر أو عثمان قضى في امرأة غرت رجلا بنفسها، وذكرت أنها حرة فتزوجها فولدت له أولادا، فقضى أن يفدي ولده بمثلهم، والقيمة أعدل في هذا", en: "Muwatta 2160" }
summary:
  ar: "قال مالك: وبلغه أن عمر بن الخطاب، أو عثمان بن عفان، قضى أحدهما في امرأة غرت رجلا بنفسها، وذكرت أنها حرة، فتزوجها، فولدت له أولادا. فقضى أن يفدي ولده بمثلهم. قال يحيى: سمعت مالكا يقول: والقيمة أعدل في هذا، إن شاء الله. {cite:muwatta-maruf-1997 p.285}"
