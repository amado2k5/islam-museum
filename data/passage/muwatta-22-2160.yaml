label: { ar: "الموطأ 2160 — مالك: بلغه أن عمر أو عثمان قضى في امرأة غرت رجلا بنفسها، وذكرت أنها حرة فتزوجها فولدت له أولادا، فقضى أن يفدي ولده بمثلهم، والقيمة أعدل في هذا", en: "Muwatta 2160", es: "Muwatta 2160", fr: "Muwatta 2160", ur: "موطا 2160", tr: "El-Muvatta 2160 — Malik: Ona, Ömer veya Osman'ın, bekar olduğunu iddia ederek bir erkeği aldatan ve bu yüzden onunla evlenip çocuk sahibi olan bir kadın hakkında hüküm verdiği rivayet edilmiştir. Ömer, erkeğin çocuklarını değerlerine denk bir bedelle kurtarması gerektiğine hükmetmiştir ve bu konuda değer daha adildir.", id: "Al-Muwatta 2160 — Malik: Diriwayatkan kepadanya bahwa Umar atau Utsman menetapkan hukum tentang seorang wanita yang menipu seorang pria dengan mengaku merdeka, lalu pria itu menikahinya dan wanita itu melahirkan anak-anak baginya. Beliau menetapkan bahwa pria itu harus menebus anak-anaknya dengan nilai yang setara dengan nilai mereka, dan nilai lebih adil dalam hal ini." }
summary:
  ar: "قال مالك: وبلغه أن عمر بن الخطاب، أو عثمان بن عفان، قضى أحدهما في امرأة غرت رجلا بنفسها، وذكرت أنها حرة، فتزوجها، فولدت له أولادا. فقضى أن يفدي ولده بمثلهم. قال يحيى: سمعت مالكا يقول: والقيمة أعدل في هذا، إن شاء الله. {cite:muwatta-maruf-1997 p.285}"
  tr: "Malik şöyle dedi: Ömer ibn el-Hattab veya Osman ibn Affan'ın, bekar olduğunu iddia ederek bir erkeği kandıran bir kadın hakkında hüküm verdiği rivayet edilir. Adam onunla evlenmiş ve ondan çocukları olmuştur. O, adamın çocuklarını aynı miktarda parayla kurtarması gerektiğine hükmetmiştir. Yahya şöyle dedi: Malik'in şöyle dediğini işittim: Bu konuda değer daha adildir, Allah'ın izniyle. {cite:muwatta-maruf-1997 s.285}"
  id: "Malik berkata: Ia mendengar Umar bin al-Khattab, atau Utsman bin Affan, memutuskan dalam kasus seorang wanita yang menipu seorang pria dengan mengaku bebas, sehingga pria itu menikahinya dan wanita itu melahirkan anak-anak baginya. Ia memutuskan bahwa pria itu harus menebus anak-anaknya dengan jumlah yang setara. Yahya berkata: Aku mendengar Malik berkata: Nilainya lebih adil dalam masalah ini, insya Allah. {cite:muwatta-maruf-1997 p.285}"
