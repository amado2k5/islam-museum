label: { ar: "الموطأ 1837 — مالك: هذا بمنزلة أن يكري الرجل الرجل راحلته بعينها، أو يؤاجر غلامه، ثم يحدث بالمكري أو الغلام حدث، فيرد ربه ما بقي من الكراء إلى الذي سلفه", en: "Muwatta 1837" }
summary:
  ar: "قال مالك: وإنما هذا بمنزلة أن يكري الرجل الرجل راحلته بعينها، أو يؤاجر غلامه الخياط أو النجار أو العمال لغير ذلك من الأعمال، أو يكري مسكنه، ويستلف إجارة ذلك الغلام أو كراء ذلك المسكن أو تلك الراحلة، ثم يحدث في ذلك حدث بموت أو غيره، فيرد رب الراحلة أو العبد أو المسكن إلى الذي سلفه ما بقي من كراء الراحلة أو إجارة العبد أو كراء المسكن، يحاسب صاحبه بما استوفى من ذلك. {cite:muwatta-maruf-1997 p.154} {cite:muwatta-maruf-1997 p.155}"
