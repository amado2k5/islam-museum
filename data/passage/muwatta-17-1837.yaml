label: { ar: "الموطأ 1837 — مالك: هذا بمنزلة أن يكري الرجل الرجل راحلته بعينها، أو يؤاجر غلامه، ثم يحدث بالمكري أو الغلام حدث، فيرد ربه ما بقي من الكراء إلى الذي سلفه", en: "Muwatta 1837", es: "Muwatta 1837", fr: "Muwatta 1837", ur: "موطا 1837", tr: "El-Muvatta 1837 — Malik: Bu, bir adamın kendine ait binek hayvanını başka birine kiralamasına veya kölesini kiraya vermesine benzer; sonra kiracıya veya köleye bir şey olur, mal sahibi de kira bedelinin kalanını kiralayana iade eder.", id: "Al-Muwatta 1837 — Malik: Ini seperti seorang pria menyewakan kudanya kepada pria lain, atau menyewakan budaknya, kemudian sesuatu terjadi pada penyewa atau budak tersebut, sehingga pemilik mengembalikan sisa uang sewa kepada orang yang meminjamkannya." }
summary:
  ar: "قال مالك: وإنما هذا بمنزلة أن يكري الرجل الرجل راحلته بعينها، أو يؤاجر غلامه الخياط أو النجار أو العمال لغير ذلك من الأعمال، أو يكري مسكنه، ويستلف إجارة ذلك الغلام أو كراء ذلك المسكن أو تلك الراحلة، ثم يحدث في ذلك حدث بموت أو غيره، فيرد رب الراحلة أو العبد أو المسكن إلى الذي سلفه ما بقي من كراء الراحلة أو إجارة العبد أو كراء المسكن، يحاسب صاحبه بما استوفى من ذلك. {cite:muwatta-maruf-1997 p.154} {cite:muwatta-maruf-1997 p.155}"
  tr: "Malik şöyle dedi: Bu, bir adamın kendi binek hayvanını başka birine kiralamasına, kölesini, terzisini, marangozunu veya diğer işçilerini başka işler için çalıştırmasına veya evini kiraya verip o kölenin ücretini, evin kirasını veya binek hayvanının kirasını borç almasına benzer. Sonra ölüm gibi bir şey olur ve binek hayvanının, kölenin veya evin sahibi, binek hayvanının, kölenin veya evin kirasından geriye kalanını borç verene iade eder ve borç verenle aldığı şeyi hesaplaşır. {cite:muwatta-maruf-1997 s.154} {cite:muwatta-maruf-1997 s.155}"
  id: "Malik berkata: Ini seperti seorang pria menyewakan kudanya kepada pria lain, atau menyewakan budaknya, penjahitnya, tukang kayunya, atau pekerja lainnya untuk pekerjaan lain, atau menyewakan rumahnya dan meminjam upah budak itu, atau uang sewa rumah itu, atau kuda itu. Kemudian sesuatu terjadi, seperti kematian, dan pemilik kuda, budak, atau rumah itu mengembalikan kepada pemberi pinjaman sisa uang sewa untuk kuda, budak, atau rumah itu, dan melunasi kepada pemberi pinjaman apa yang telah diterimanya. {cite:muwatta-maruf-1997 p.154} {cite:muwatta-maruf-1997 p.155}"
