label: { ar: "الموطأ 273 — إذا قلت لصاحبك أنصت والإمام يخطب فقد لغوت", en: "Muwatta 273", es: "Muwatta 273", fr: "Muwatta 273", ur: "موطا 273", tr: "Al-Muwatta 273 — İmam hutbe okurken arkadaşınıza, “Dinle,” derseniz, boş yere konuşmuş olursunuz." }
text: "إذا قلت لصاحبك: أنصت، والإمام يخطب يوم الجمعة، فقد لغوت"
summary:
  ar: "أول حديث في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أخبر النبي أن من قال لصاحبه «أنصت» والإمام يخطب يوم الجمعة فقد لغا. ويخرّجه المحقق عند أحمد (2/485) والدارمي وعبد الرزاق والشافعي والبيهقي والبغوي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن لمالك فيه إسنادين: هذا، وإسناد ابن شهاب عن سعيد بن المسيب عن أبي هريرة، وأن يحيى لم يرو عن مالك غير إسناد أبي الزناد وجمعهما القعنبي وابن القاسم وابن وهب ⁦(التمهيد 19/29)⁩. {cite:muwatta-maruf-1997 p.159} {cite:muwatta-maruf-1997 p.160}"
  tr: "Cuma günü imamın hutbe okurken dikkatle dinlemekle ilgili rivayetler bölümündeki ilk hadis, Yahya'nın Malik'ten, onun da Ebu el-Zinad'dan, onun da el-A'raj'dan, onun da Ebu Hurayra'dan rivayet ettiğine göre şöyledir: Peygamberimiz bize, imam cuma hutbesi okurken arkadaşına \"Sessiz ol\" diyen kimsenin boş konuşma yaptığını bildirmiştir. Araştırmacı, bu hadisi Ahmed (2/485), el-Darimi, Abd el-Razzaq, el-Şafiî, el-Beyhaki ve el-Baghawi'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiştir. İbn Abd el-Barr'ın, Malik'in bu hadis için iki rivayet zinciri olduğunu söylediğini aktarmıştır: Bu hadis ve İbn Şihab'ın Sa'id ibn el-Musayyab'dan, onun da Ebu Hurayra'dan rivayet ettiği hadis zinciri. Ayrıca Yahya'nın Malik'ten Ebu el-Zinad'ın rivayet zincirinden başka bir şey nakletmediğini ve her ikisinin de el-Ka'nabi, İbn el-Kâsım ve İbn Vahb tarafından birleştirildiğini belirtir (el-Tamhid 19/29). {cite:muwatta-maruf-1997 s.159} {cite:muwatta-maruf-1997 s.160}"
  id: "Hadits pertama dalam bab ini membahas tentang mendengarkan dengan saksama pada hari Jumat ketika imam sedang menyampaikan khutbah. Diriwayatkan oleh Yahya dari Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah: Nabi memberitahukan kepada kita bahwa siapa pun yang berkata kepada temannya, \"Diamlah,\" ketika imam sedang menyampaikan khutbah Jumat, maka ia telah melakukan percakapan yang sia-sia. Peneliti memasukkannya dalam kumpulan hadits Ahmad (2/485), al-Darimi, Abd al-Razzaq, al-Shafi'i, al-Bayhaqi, dan al-Baghawi melalui sanad para sahabat Malik. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa Malik memiliki dua sanad untuk hadits ini: sanad ini, dan sanad Ibn Shihab dari Sa'id ibn al-Musayyab dari Abu Hurayrah. Ia juga menyatakan bahwa Yahya tidak meriwayatkan dari Malik apa pun selain sanad Abu al-Zinad, dan bahwa keduanya digabungkan oleh al-Qa'nabi, Ibn al-Qasim, dan Ibn Wahb (al-Tamhid 19/29). {cite:muwatta-maruf-1997 p.159} {cite:muwatta-maruf-1997 p.160}"
