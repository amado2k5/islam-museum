label: { ar: "الموطأ 273 — إذا قلت لصاحبك أنصت والإمام يخطب فقد لغوت", en: "Muwatta 273" }
text: "إذا قلت لصاحبك: أنصت، والإمام يخطب يوم الجمعة، فقد لغوت"
summary:
  ar: "أول حديث في باب ما جاء في الإنصات يوم الجمعة والإمام يخطب. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: أخبر النبي أن من قال لصاحبه «أنصت» والإمام يخطب يوم الجمعة فقد لغا. ويخرّجه المحقق عند أحمد (2/485) والدارمي وعبد الرزاق والشافعي والبيهقي والبغوي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن لمالك فيه إسنادين: هذا، وإسناد ابن شهاب عن سعيد بن المسيب عن أبي هريرة، وأن يحيى لم يرو عن مالك غير إسناد أبي الزناد وجمعهما القعنبي وابن القاسم وابن وهب (التمهيد 19/29). {cite:muwatta-maruf-1997 p.159} {cite:muwatta-maruf-1997 p.160}"
