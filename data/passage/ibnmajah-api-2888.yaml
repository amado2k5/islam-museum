label: { ar: "سنن ابن ماجه 2888 — ما يُكفَّر باجتناب الكبائر", en: "Sunan Ibn Majah 2888 — what is expiated when the major sins are avoided", ur: "سنن ابن ماجہ 2888 — جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے", fr: "Sunan Ibn Majah 2888 — ce qui est expié quand les grands péchés sont évités", es: "Sunan Ibn Mayah 2888 — lo que se expía cuando se evitan los pecados mayores", tr: "Sunan İbn Majah 2888 — Büyük günahlardan sakınmakla hangi günahlar kefaret edilir?", id: "Sunan Ibn Majah 2888 — Apa yang dapat ditebus dengan menghindari dosa-dosa besar?" }
text: "حَدَّثَنَا أَبُو مُصْعَبٍ، حَدَّثَنَا مَالِكُ بْنُ أَنَسٍ، عَنْ سُمَىٍّ، - مَوْلَى أَبِي بَكْرِ بْنِ عَبْدِ الرَّحْمَنِ - عَنْ أَبِي صَالِحٍ السَّمَّانِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ النَّبِيَّ ـ قَالَ \" الْعُمْرَةُ إِلَى الْعُمْرَةِ كَفَّارَةُ مَا بَيْنَهُمَا وَالْحَجُّ الْمَبْرُورُ لَيْسَ لَهُ جَزَاءٌ إِلاَّ الْجَنَّةُ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2888، يرد فيه ذكر ما يُكفَّر باجتناب الكبائر. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan Ibn Majah, no. 2888 (Chapters on Hajj Rituals), whose wording mentions what is expiated when the major sins are avoided. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2888، جس کے الفاظ میں جو کبیرہ گناہوں سے بچنے پر معاف ہو جاتا ہے کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan Ibn Majah, n° 2888, dont le texte mentionne ce qui est expié quand les grands péchés sont évités. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan Ibn Mayah, n.º 2888, cuyo texto menciona lo que se expía cuando se evitan los pecados mayores. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "İbn Mâce Sünen'inde 2888 numaralı hadis, büyük günahlardan kaçınmanın neleri telafi edeceğinden bahsetmektedir. Bu hadis, farz, itaat, tavsiye edilen, mekruh, haram ve küçük günahları derleyen kişi tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinden gelen rivayetlerle birlikte derlenmiştir. Derleyen kişi metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 2888, menyebutkan apa yang dapat diampuni dengan menghindari dosa-dosa besar. Hadits ini disusun oleh penyusunnya mengenai amalan-amalan wajib, amalan-amalan ketaatan, amalan-amalan yang dianjurkan, amalan-amalan yang tidak disukai, amalan-amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat-riwayat dari para Sahabat dan Penerus mereka mengenai topik-topik tersebut. Penyusun tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
