text: "… محمدٌ لَلاي أُوتِرَ قُبل أن أنام البخاري:، ومسلم:. وفي صحيح مسلم نحوه عن أبي الدرداء مسلم:. وفي صحيح مسلم، عن أبي ذر يرفعه، قال : يُصْبِعُ عَلَى كُلِّ سُلَامَى مِنْ أَحَدِكُمْ صَدَقَةٌ، فَكُلُّ تَسْبِيْحَةٍ صَدَقَةٌ، وَكُلُّ تَحْمِيْدَةِ صَدَقَةٌ، وَكُلُّ تَهْلِيلَةٍ …"
