text: "… خضرون بن قايل بن آدم قال وذكر ابن اسحق أن آدم حضرته الوفاة أخبر بنيه أن الطوفان سيقع بالناس وأوصاهم اذا كان ذلك أن يحملوا جسده معهم فى السفينة وأن يدفنوه فى مكان عينه لهم. فلما كان الطوفان حملوه معهم …"
summary:
  ar: "مقطع من البداية والنهاية لابن كثير، المجلد المصوَّر 2، ص 330، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn Kathir's al-Bidaya wa-l-Nihaya, scan volume 2, p. 330, that mentions a testament or parting counsel, a deathbed and last hours, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "البدایہ والنہایہ، ابن کثیر، اسکین جلد 2، ص 330 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Bidaya wa-l-Nihaya de Ibn Kathir, volumen 2, pág. 330, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn Kathir, al-Bidaya wa-l-Nihaya (tome 2, p. 330), mentionnant un testament ou des adieux, un lit de mort et les dernières heures, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments Browser."
  tr: "İbn Kathir'in \"El-Bidaya ve'l-Nihaya\" (Başlangıç ve Son) adlı eserinin 2. cildinin 330. sayfasında, vasiyetname veya son miras, ölüm saati, defin, mezar ve istirahat yeri konularına değinilmektedir; bu metin, makineyle okunabilir taranmış baskıdan alınmıştır. Kaynak politikasına uygun olarak, metin yaklaşık kırk kelimeden oluşmaktadır. Metin, \"Vasiyetnameler, Miraslar, Antikalar ve İstirahat Yerleri\" bölümü tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Ibn Kathir \"Al-Bidaya wa'l-Nihaya\" (Permulaan dan Akhir), Jilid 2, halaman 330, menyebutkan wasiat atau surat wasiat terakhir, saat kematian, pemakaman, kuburan, dan tempat peristirahatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini dikompilasi oleh bagian \"Wasiat, Warisan, Barang Antik, dan Tempat Peristirahatan\"."
