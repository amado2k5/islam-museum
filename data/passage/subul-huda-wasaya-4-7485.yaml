text: "… الابلق، لا أن تغمروا صوته بلغطكم، وقبهيروا منطقه بصخبكم، وفى قراءة ابن مسعود لا ترفعوا بأصواتكم • وقد كره بعض العلماء رفع الصوت عند قبره، وكره بعض العلماء رفع الصوت فى مجالس العلماء تشريفا خم إذ هم ورثة الأنبياء. لفظ …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 4، ص 7485، يذكر ما خلّفه من تركة وميراث، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
