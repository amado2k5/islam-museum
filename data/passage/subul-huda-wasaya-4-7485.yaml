text: "… الابلق، لا أن تغمروا صوته بلغطكم، وقبهيروا منطقه بصخبكم، وفى قراءة ابن مسعود لا ترفعوا بأصواتكم • وقد كره بعض العلماء رفع الصوت عند قبره، وكره بعض العلماء رفع الصوت فى مجالس العلماء تشريفا خم إذ هم ورثة الأنبياء. لفظ …"
