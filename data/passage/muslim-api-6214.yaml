label: { ar: "صحيح مسلم 6214 — أثر من الآثار المحفوظة", en: "Sahih Muslim 6214 — a relic kept after its owner", ur: "صحیح مسلم 6214 — محفوظ آثار و تبرکات", es: "Sahih Muslim 6214 — una reliquia conservada después de su dueño." }
text: "… فَسَأَلَ عَنِ النَّبِيِّ فَقَالُوا خَرَجَ. وَجَّهَ هَا هُنَا - قَالَ - فَخَرَجْتُ عَلَى أَثَرِهِ أَسْأَلُ عَنْهُ حَتَّى دَخَلَ بِئْرَ أَرِيسٍ - قَالَ - فَجَلَسْتُ عِنْدَ الْبَابِ وَبَابُهَا مِنْ جَرِيدٍ حَتَّى قَضَى رَسُولُ اللَّهِ حَاجَتَهُ وَتَوَضَّأَ فَقُمْتُ إِلَيْهِ فَإِذَا هُوَ قَدْ جَلَسَ عَلَى بِئْرِ أَرِيسٍ وَتَوَسَّطَ قُفَّهَا وَكَشَفَ عَنْ سَاقَيْهِ وَدَلاَّهُمَا فِي الْبِئْرِ - قَالَ - …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6214، يذكر أثر من الآثار المحفوظة. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6214 (The Book of the Merits of the Companions), that mentions a relic kept after its owner. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح مسلم کی حدیث نمبر 6214، جس میں محفوظ آثار و تبرکات کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6214 (El Libro de los Méritos de los Compañeros), menciona una reliquia conservada tras la muerte de su dueño. El Navegador de Testamentos la incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, herencias, reliquias y tumbas."
