label: { ar: "الموطأ 1511 — عبد الملك بن أبي بكر عن أبيه: حين تزوج النبي أم سلمة قال لها ليس بك على أهلك هوان، إن شئت سبعت عندك وسبعت عندهن، وإن شئت ثلثت", en: "Muwatta 1511", es: "Muwatta 1511", fr: "Muwatta 1511", ur: "موطا 1511", tr: "El-Muvatta 1511 — Abdul-Malik ibn Abi Bekr, babasından rivayetle: Peygamberimiz Ümmü Seleme ile evlendiğinde ona şöyle dedi: “Sen ailen için bir yük değilsin. İstersen yedi gün seninle, yedi gün de onlarla kalabilirim; istersen üç gün de kalabilirim.”", id: "Al-Muwatta 1511 — Abdul-Malik ibn Abi Bakr, berdasarkan riwayat ayahnya: Ketika Nabi menikahi Umm Salamah, beliau berkata kepadanya, “Engkau bukanlah beban bagi keluargamu. Jika engkau mau, aku boleh tinggal tujuh hari bersamamu dan tujuh hari bersama mereka, atau jika engkau mau, tiga hari.”" }
text: "ثَلِّثْ"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام المخزومي عن أبيه أن رسول الله حين تزوج أم سلمة، وأصبحت عنده، قال لها ليس بك على أهلك هوان، إن شئت سبعت عندك وسبعت عندهن، وإن شئت ثلثت عندك ودرت. فقالت ثلث. {cite:muwatta-maruf-1997 p.34}"
  tr: "Yahya, Malik'ten, o da Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan, o da Abdul Malik ibn Abi Bakr ibn Abdur Rahman ibn Al-Harith ibn Hisham Al-Makhzumi'den, o da babasından rivayet eder ki, Allah Resulü Ümmü Seleme ile evlendiğinde ve Ümmü Seleme onunla birlikteyken, ona şöyle dedi: \"Sen ailen için bir yük değilsin. İstersen yedi gün seninle, yedi gün de onlarla kalırım; istersen üç gün seninle kalır, üç gün de onlarla dönüşümlü olarak kalırım.\" Ümmü Seleme, \"Üç gün\" dedi. {cite:muwatta-maruf-1997 s.34}"
  id: "Yahya meriwayatkan dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari Abdul Malik ibn Abi Bakr ibn Abdur Rahman ibn Al-Harith ibn Hisham Al-Makhzumi, dari ayahnya, bahwa ketika Rasulullah menikahi Umm Salamah, dan dia bersamanya, beliau berkata kepadanya, “Engkau bukanlah beban bagi keluargamu. Jika engkau mau, aku akan tinggal tujuh hari bersamamu dan tujuh hari bersama mereka, atau jika engkau mau, aku akan tinggal tiga hari bersamamu dan bergantian di antara mereka.” Dia menjawab, “Tiga hari.” {cite:muwatta-maruf-1997 p.34}"
