label: { ar: "الموطأ 1511 — عبد الملك بن أبي بكر عن أبيه: حين تزوج النبي أم سلمة قال لها ليس بك على أهلك هوان، إن شئت سبعت عندك وسبعت عندهن، وإن شئت ثلثت", en: "Muwatta 1511" }
text: "ثَلِّثْ"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن عبد الملك بن أبي بكر بن عبد الرحمن بن الحارث بن هشام المخزومي عن أبيه أن رسول الله حين تزوج أم سلمة، وأصبحت عنده، قال لها ليس بك على أهلك هوان، إن شئت سبعت عندك وسبعت عندهن، وإن شئت ثلثت عندك ودرت. فقالت ثلث. {cite:muwatta-maruf-1997 p.34}"
