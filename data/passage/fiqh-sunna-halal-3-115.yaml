text: "… ويحرم في حق من يخل بالزوجة في الوطء والإنفاق، مع عدم قدرته عليه وَتوَقانِه إليه. قال القرطبي : فمتى علم الزوج أنه يعجز عن نفقة زوجته، أو صداقها أو شيء من حقوقها الواجبة عليه، فلا يحل له أن يتزوجها حتى …"
