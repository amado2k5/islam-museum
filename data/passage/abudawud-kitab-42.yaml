summary:
  ar: "القسم 42 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب السنة»، ويضم فيها النصوص من 4596 إلى 4772 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 42 of Sunan Abi Dawud (Model Behavior of the Prophet (Kitab Al-Sunnah)) in the division of the open hadith dataset the museum took its reports from: reports 4596 to 4772 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 42، عنوان «کتاب السنۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 4596 تا 4772۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 42 de Sunan Abi Dawud (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 4596 al 4772, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du recueil ouvert Sunan Abi Dawud (Conduite exemplaire du Prophète – Kitab al-Sunnah), dans le livre 42: les hadiths 4596 à 4772. Le musée classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan Abi Davud'un 42. bölümü \"Sünnet Kitabı\" başlığını taşımakta olup, 4596'dan 4772'ye kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 42 dari Sunan Abi Dawud, dari basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Sunnah\" dan berisi teks 4596 hingga 4772, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
