text: "… سائر الفصول، وجنس المرض أيضاً يعين في الدلالة على النكس، مثل الحمّيات الورمية إذا خلفت حرارة وتلهّباً في الأحشاء، ومثل الصرع والسدر وأوجاع الكلى والكبد والطحال والسعفة والبيضة والنوازل يتولّد عنها من الرمد وغيره وأمراض النفس. فصل: في أسباب الموت …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج3، ص 141، يذكر المرض والمريض، والوجع، والحمى والوعك، وأسماء الأمراض، وأعضاء البدن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 3, p. 141, that mentions illness and the sick, pain, fever, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج3، ص 141 کا اقتباس جس میں بیماری اور بیمار، درد، بخار، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 3, pág. 141, que menciona la enfermedad y los enfermos, el dolor, la fiebre, enfermedades específicas y los órganos del cuerpo; tomado del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait du Canon de la médecine d'Ibn Sina, vol. 3, p. 141, qui mentionne la maladie et les malades, la douleur, la fièvre, les maladies nommées, les organes du corps; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "İbn Sina'nın Tıp Kanunu'nun 3. Bölümünün 141. sayfasından, hastalık ve hasta, ağrı, ateş ve halsizlik, hastalıkların isimleri ve vücut organlarından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Bagian 3, hlm. 141, yang menyebutkan penyakit dan pasien, rasa sakit, demam dan rasa tidak enak badan, nama-nama penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
