text: "… سائر الفصول، وجنس المرض أيضاً يعين في الدلالة على النكس، مثل الحمّيات الورمية إذا خلفت حرارة وتلهّباً في الأحشاء، ومثل الصرع والسدر وأوجاع الكلى والكبد والطحال والسعفة والبيضة والنوازل يتولّد عنها من الرمد وغيره وأمراض النفس. فصل: في أسباب الموت …"
