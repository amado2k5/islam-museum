text: "… تميم بن كعب بن سلمة أبو عبد الرحمن الأنصاريّ الأنصار حلماً وحياء وسخاء، وكان جميلاً وسيماً. الخزرجيّ: روى عنه من الصحابة عمر وأبو قتادة وعبد الرحمن الإمام المقدم في علم الحلال والحرام قال أبو إدريس ابن سمرة وغيرهم. الخولاني: كان …"
