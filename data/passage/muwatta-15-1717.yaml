label: { ar: "الموطأ 1717 — ابن شهاب: أمر النبي رجلا من ثقيف أسلم وعنده عشر نسوة أن يمسك أربعا ويفارق سائرهن، واختلف الرواة فيه وأرجح المرسل عند أهل الحديث", en: "Muwatta 1717" }
text: "أمْسِكْ مِنْهُنَّ أرْبَعًا. وَفَارقْ سَائرَهُنَّ"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أنه قال بلغني أن رسول الله قال لرجل من ثقيف، أسلم وعنده عشر نسوة، حين أسلم الثقفي: أمسك منهن أربعا، وفارق سائرهن. ويذكر المحقق أن ابن عبد البر قال إن الحديث رواه جماعة رواة الموطأ وأكثر أصحاب ابن شهاب، وأن البخاري قال عن رواية معمر إنها غير محفوظة، وأن الصحيح المرسل، وأن الأحاديث في الباب معلولة عند ابن عبد البر. {cite:muwatta-maruf-1997 p.99}"
