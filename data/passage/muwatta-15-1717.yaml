label: { ar: "الموطأ 1717 — ابن شهاب: أمر النبي رجلا من ثقيف أسلم وعنده عشر نسوة أن يمسك أربعا ويفارق سائرهن، واختلف الرواة فيه وأرجح المرسل عند أهل الحديث", en: "Muwatta 1717", es: "Muwatta 1717", fr: "Muwatta 1717", ur: "موطا 1717", tr: "El-Muvatta 1717 — İbn Şihab: Peygamberimiz, İslam'ı kabul etmiş ve on karısı olan Sakif bir adama, dördünü yanında tutmasını ve geri kalanını boşamasını emretti. Bu konuda rivayetçiler arasında görüş ayrılığı vardır ve hadis âlimleri mursal hadisi daha muhtemel kabul etmektedir.", id: "Al-Muwatta 1717 — Ibn Shihab: Nabi memerintahkan seorang pria dari Thaqif yang telah memeluk Islam dan memiliki sepuluh istri untuk mempertahankan empat dan menceraikan sisanya. Para perawi berbeda pendapat tentang masalah ini, dan hadits mursal dianggap lebih mungkin oleh para ulama hadits." }
text: "أمْسِكْ مِنْهُنَّ أرْبَعًا. وَفَارقْ سَائرَهُنَّ"
summary:
  ar: "يروي يحيى عن مالك عن ابن شهاب أنه قال بلغني أن رسول الله قال لرجل من ثقيف، أسلم وعنده عشر نسوة، حين أسلم الثقفي: أمسك منهن أربعا، وفارق سائرهن. ويذكر المحقق أن ابن عبد البر قال إن الحديث رواه جماعة رواة الموطأ وأكثر أصحاب ابن شهاب، وأن البخاري قال عن رواية معمر إنها غير محفوظة، وأن الصحيح المرسل، وأن الأحاديث في الباب معلولة عند ابن عبد البر. {cite:muwatta-maruf-1997 p.99}"
  tr: "Yahya, İbn Şihab'dan rivayetle Malik'ten naklederek şöyle buyurduğunu aktarır: “Bana ulaştığına göre, Allah Resulü, İslam'ı kabul etmiş ve on karısı olan bir Sakif adama şöyle buyurmuştur: ‘Dördünü tut, geri kalanını boşa.’” Araştırmacı, İbn Abdül-Barr'ın bu hadisin Muvatta'nın bir grup ravisi ve İbn Şihab'ın öğrencilerinin çoğu tarafından rivayet edildiğini söylediğini ve Buhari'nin Ma'mar'ın rivayetinin sahih olmadığını, doğru versiyonun mursal (bağlantısız) versiyon olduğunu ve bu konudaki hadislerin İbn Abdül-Barr tarafından kusurlu kabul edildiğini belirttiğini aktarır. {cite:muwatta-maruf-1997 s.99}"
  id: "Yahya meriwayatkan dari Malik, dari Ibn Shihab, bahwa ia berkata: “Sampai kepadaku bahwa Rasulullah SAW bersabda kepada seorang laki-laki dari Thaqif yang telah memeluk Islam dan memiliki sepuluh istri, ketika laki-laki Thaqif itu memeluk Islam: ‘Pertahankan empat di antara mereka dan ceraikan sisanya.’” Peneliti menyebutkan bahwa Ibn Abd al-Barr mengatakan bahwa hadits tersebut diriwayatkan oleh sekelompok perawi Muwatta dan sebagian besar murid Ibn Shihab, dan bahwa al-Bukhari mengatakan tentang riwayat Ma’mar bahwa itu tidak sahih, dan bahwa versi yang benar adalah versi mursal (terputus), dan bahwa hadits-hadits tentang topik ini dianggap cacat oleh Ibn Abd al-Barr. {cite:muwatta-maruf-1997 p.99}"
