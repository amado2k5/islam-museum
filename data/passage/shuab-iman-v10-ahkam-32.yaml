text: "- الجامع لشعب الإيمان إلى غير ذلك من الآيات التي وردت في معناه وقد وردت في تقلد القضاء آثار تزهد فيه، بل توجب التحرز والفرار منه، وهي محمولة على تعظيم أمر القضاء، والدلالة على خطره ورفعة قدره، لا على الكراهة …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء العاشر، ص 32، يرد فيه ذكر الكراهة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 10, p. 32, whose wording mentions dislike (karaha); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 10، ص 32 کا اقتباس جس میں کراہت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 32, dont le texte mentionne la réprobation (karaha) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 10 de al-Bayhaqi, p. 32, cuyo texto menciona la reprobación (karaha); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"Şu'ab el-İman\" (İman Dalları) adlı eserinin 10. cildinin 32. sayfasında, kınanabilirlik kavramından bahsedilmektedir; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Bu metin, farz olan ameller, itaat amelleri, tavsiye edilen ameller, kınanabilir ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab \"Shu'ab al-Iman\" (Cabang-Cabang Iman) karya Al-Bayhaqi, Jilid 10, halaman 32, menyebutkan konsep perbuatan tercela; ini berasal dari versi hasil pemindaian yang dapat dibaca mesin, dan teks tersebut dikutip dalam sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, amalan ketaatan, amalan yang dianjurkan, amalan tercela, amalan yang dilarang, dan dosa-dosa kecil."
