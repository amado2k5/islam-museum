label: { ar: "الموطأ 2468 — مالك: لا قود بين الصبيان وعمدهم خطأ", en: "Muwatta 2468" }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا قود بين الصبيان، وأن عمدهم خطأ، ما لم تجب عليهم الحدود ويبلغوا الحلم، وأن قتل الصبي لا يكون إلا خطأ؛ فلو أن صبيا وكبيرا قتلا رجلا حرا خطأ، كان على عاقلة كل واحد منهما نصف الدية. {cite:muwatta-maruf-1997 p.420}"
