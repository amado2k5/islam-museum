label: { ar: "الموطأ 2468 — مالك: لا قود بين الصبيان وعمدهم خطأ", en: "Muwatta 2468", es: "Muwatta 2468", fr: "Muwatta 2468", ur: "موطا 2468", tr: "Al-Muwatta 2468 — Malik: Çocuklar arasında misilleme yoktur ve kasıtlı eylemleri kasıtsızdır.", id: "Al-Muwatta 2468 — Malik: Tidak ada pembalasan antara anak laki-laki dan tindakan yang disengaja mereka adalah tidak disengaja." }
summary:
  ar: "قال مالك: الأمر المجتمع عليه عندنا أنه لا قود بين الصبيان، وأن عمدهم خطأ، ما لم تجب عليهم الحدود ويبلغوا الحلم، وأن قتل الصبي لا يكون إلا خطأ؛ فلو أن صبيا وكبيرا قتلا رجلا حرا خطأ، كان على عاقلة كل واحد منهما نصف الدية. {cite:muwatta-maruf-1997 p.420}"
  tr: "Malik şöyle dedi: Aramızdaki fikir birliği, çocuklar arasında misilleme olmadığı ve kasıtlı olarak öldürülmelerinin, öngörülen cezalara tabi tutulmadıkları ve ergenliğe ulaşmadıkları sürece, kasıtsız sayıldığı yönündedir. Bir çocuğun öldürülmesi her zaman kasıtsızdır; bu nedenle, bir çocuk ve bir yetişkin kasıtsız olarak özgür bir adamı öldürürse, her birinin klanı kan parasının yarısını ödemekle yükümlüdür. {cite:muwatta-maruf-1997 s.420}"
  id: "Malik berkata: Konsensus di antara kami adalah bahwa tidak ada pembalasan antara anak-anak, dan pembunuhan yang disengaja oleh mereka dianggap tidak disengaja, kecuali jika mereka dikenai hukuman yang telah ditentukan dan mencapai pubertas. Pembunuhan seorang anak selalu tidak disengaja; jadi jika seorang anak dan seorang dewasa secara tidak sengaja membunuh seorang pria merdeka, klan masing-masing dari mereka bertanggung jawab atas setengah dari uang darah tersebut. {cite:muwatta-maruf-1997 p.420}"
