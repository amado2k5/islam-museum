summary:
  ar: "يروي مالك عن ابن شهاب، عن عبيد الله بن عبد الله بن عتبة بن مسعود، عن عبد الله بن عباس، عن ميمونة أن النبي سئل عن الفأرة تقع في السمن، فقال: انزعوها وما حولها فاطرحوه. ويبين المحقق ما في طرق الحديث عن مالك من اختلاف، ويعرض قول ابن عبد البر أن رواية يحيى هي الأجود، وأن ابن بكير وأبا مصعب رووه مرسلا. {cite:muwatta-maruf-1997 p.565} {cite:muwatta-maruf-1997 p.566}"
