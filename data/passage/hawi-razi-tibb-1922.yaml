text: "… عن المشي في حال الصحة فضلا عن المرض أكثر من سائر المفاصل. أهرن، قال: إذا حدثت جراحة في العصب فإياك والمبادرة بالحام الجراحة لكن عليك بتسكين الوجع بالدهن المسخن حتى إذا سكن الورم وأمنت انصباب الفضول والورم فالفصد وغيره، فعند …"
