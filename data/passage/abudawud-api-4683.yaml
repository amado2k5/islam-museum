label: { ar: "سنن أبي داود 4683 — الأب والأبوة", en: "Sunan Abi Dawud 4683 — the father and fatherhood", ur: "سنن ابی داؤد 4683 — باپ اور والدیت", es: "Sunan Abi Dawud 4683 — El padre y la paternidad", fr: "Sunan Abi Dawud 4683 — Le père et la paternité" }
text: "… عُبَيْدٍ، حَدَّثَنَا مُحَمَّدُ بْنُ ثَوْرٍ، عَنْ مَعْمَرٍ، قَالَ وَأَخْبَرَنِي الزُّهْرِيُّ، عَنْ عَامِرِ بْنِ سَعْدِ بْنِ أَبِي وَقَّاصٍ، عَنْ أَبِيهِ، قَالَ أَعْطَى رَسُولُ اللَّهِ رِجَالاً وَلَمْ يُعْطِ رَجُلاً مِنْهُمْ شَيْئًا فَقَالَ سَعْدٌ يَا رَسُولَ اللَّهِ أَعْطَيْتَ فُلاَنًا وَفُلاَنًا وَلَمْ تُعْطِ فُلاَنًا شَيْئًا وَهُوَ مُؤْمِنٌ. فَقَالَ النَّبِيُّ \" أَوْ مُسْلِمٌ \". حَتَّى أَعَادَهَا سَعْدٌ ثَلاَثًا وَالنَّبِيُّ يَقُولُ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4683، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4683 (Model Behavior of the Prophet (Kitab Al-Sunnah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4683، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4683 (El comportamiento ejemplar del Profeta (Kitab Al-Sunnah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4683 (Comportement exemplaire du Prophète (Kitab Al-Sunnah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
