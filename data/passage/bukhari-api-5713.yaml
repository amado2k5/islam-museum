label: { ar: "صحيح البخاري 5713 — القسط والعود الهندي، اللدود والسعوط", en: "Sahih al-Bukhari 5713 — costus (Indian aloeswood); medicine given by the mouth-side or the nose", ur: "صحیح بخاری 5713 — قسط ہندی، لدود اور سعوط" }
text: "… عُبَيْدُ اللَّهِ، عَنْ أُمِّ قَيْسٍ، قَالَتْ دَخَلْتُ بِابْنٍ لِي عَلَى رَسُولِ اللَّهِ وَقَدْ أَعْلَقْتُ عَلَيْهِ مِنَ الْعُذْرَةِ فَقَالَ \" عَلَى مَا تَدْغَرْنَ أَوْلاَدَكُنَّ بِهَذَا الْعِلاَقِ عَلَيْكُنَّ بِهَذَا الْعُودِ الْهِنْدِيِّ، فَإِنَّ فِيهِ سَبْعَةَ أَشْفِيَةٍ، مِنْهَا ذَاتُ الْجَنْبِ يُسْعَطُ مِنَ الْعُذْرَةِ، وَيُلَدُّ مِنْ ذَاتِ الْجَنْبِ \". فَسَمِعْتُ الزُّهْرِيَّ يَقُولُ بَيَّنَ لَنَا اثْنَيْنِ وَلَمْ يُبَيِّنْ لَنَا خَمْسَةً. قُلْتُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5713، يذكر القسط والعود الهندي، واللدود والسعوط، وأسماء الأمراض، وعلاج العذرة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5713 (Medicine), that mentions costus (Indian aloeswood), medicine given by the mouth-side or the nose, named diseases, treating the throat ailment (al-udhra), healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5713، جس میں قسط ہندی، لدود اور سعوط، بیماریوں کے نام، گلے کی بیماری (عذرہ) کا علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
