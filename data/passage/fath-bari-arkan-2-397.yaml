text: "… بذلك فى حديث وكان النبى يبعث إلى قومه وبعثت إلى الإنس والجن فيما أخرجه البزار بلفظ : وعن ابن الكلبى كان النبى يبعث إلى الإنس فقط، وبعث محمد إلى الإنس والجن وإذا تقرر كونهم مكلفين فهم مكلفون بالتوحيد وأركان الإسلام، …"
