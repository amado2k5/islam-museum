label: { ar: "سنن ابن ماجه 2680 — الأب والأبوة", en: "Sunan Ibn Majah 2680 — the father and fatherhood", ur: "سنن ابن ماجہ 2680 — باپ اور والدیت", es: "Sunan Ibn Majah 2680 — El padre y la paternidad", fr: "Sunan Ibn Majah 2680 — le père et la paternité" }
text: "حَدَّثَنَا رَجَاءُ بْنُ الْمُرَجَّى السَّمَرْقَنْدِيُّ، حَدَّثَنَا النَّضْرُ بْنُ شُمَيْلٍ، حَدَّثَنَا أَبُو حَمْزَةَ الصَّيْرَفِيُّ، حَدَّثَنِي عَمْرُو بْنُ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ صَارِخًا فَقَالَ لَهُ رَسُولُ اللَّهِ \" مَا لَكَ \". قَالَ سَيِّدِي رَآنِي أُقَبِّلُ جَارِيَةً لَهُ فَجَبَّ مَذَاكِيرِي. فَقَالَ النَّبِيُّ \" عَلَىَّ بِالرَّجُلِ \". فَطُلِبَ فَلَمْ يُقْدَرْ عَلَيْهِ. فَقَالَ رَسُولُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 2680، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 2680 (The Chapters on Blood Money), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 2680، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 2680 (Los capítulos sobre la indemnización por derramamiento de sangre), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 2680 (Les chapitres sur l'argent du sang), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
