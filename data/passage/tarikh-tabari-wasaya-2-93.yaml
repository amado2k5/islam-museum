text: "عيانًا، وقيل اقوال كثيرة فى ذلك قد حكينا منها جُمَلا فى.. كتابنا المسمى جامع البيان عن تأويل آى القرآن ذكرهنا اطالة اللتاب بذكر قلك فى هذا الموضع، فلما اراد الله عر وجل أن يخلق آدم عم امر بتربته أن توخذة …"
summary:
  ar: "مقطع من تاريخ الرسل والملوك للطبري، المجلد المصوَّر 2، ص 93، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
