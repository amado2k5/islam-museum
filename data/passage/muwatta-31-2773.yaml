label: { ar: "الموطأ 2773 — عائشة والنمرقة المصورة: أصحاب الصور يعذبون يوم القيامة", en: "Muwatta 2773" }
summary:
  ar: "يروي مالك عن نافع، عن القاسم بن محمد، عن عائشة أنها اشترت نمرقة فيها تصاوير، فلما رآها النبي وقف على الباب ولم يدخل، فعرفت الكراهة في وجهه فاعتذرت إلى الله ورسوله، فسألها عن شأن النمرقة، فقالت إنها اشترتها له ليقعد عليها ويتوسدها. فبيّن أن أصحاب هذه الصور يعذبون يوم القيامة ويقال لهم: أحيوا ما خلقتم، وأن البيت الذي فيه الصور لا تدخله الملائكة. {cite:muwatta-maruf-1997 p.558}"
