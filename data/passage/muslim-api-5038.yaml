label: { ar: "صحيح مسلم 5038 — الأب والأبوة", en: "Sahih Muslim 5038 — the father and fatherhood", ur: "صحیح مسلم 5038 — باپ اور والدیت", es: "Sahih Muslim 5038 — El padre y la paternidad" }
text: "وَحَدَّثَنَا عَبْدُ الْمَلِكِ بْنُ شُعَيْبِ بْنِ اللَّيْثِ، حَدَّثَنَا أَبِي، عَنْ جَدِّي، حَدَّثَنِي خَالِدُ بْنُ، يَزِيدَ حَدَّثَنِي سَعِيدُ بْنُ أَبِي هِلاَلٍ، عَنِ ابْنِ الْمُنْكَدِرِ، أَنَّ أَبَا أُمَامَةَ بْنَ سَهْلٍ، أَخْبَرَهُ عَنِ ابْنِ، عَبَّاسٍ قَالَ أُتِيَ رَسُولُ اللَّهِ وَهُوَ فِي بَيْتِ مَيْمُونَةَ وَعِنْدَهُ خَالِدُ بْنُ الْوَلِيدِ بِلَحْمِ ضَبٍّ. فَذَكَرَ بِمَعْنَى حَدِيثِ الزُّهْرِيِّ."
summary:
  ar: "حديث في صحيح مسلم، رقم 5038، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 5038 (The Book of Hunting, Slaughter, and what may be Eaten), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 5038، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 5038 (El Libro de la Caza, la Matanza y los Alimentos Comibles), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
