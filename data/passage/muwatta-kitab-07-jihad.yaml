summary:
  ar: "كتاب الجهاد، الكتاب السابع من الموطأ في رواية يحيى بن يحيى عن مالك، في طبعة بشار عواد معروف (1997): 68 نصاً (1283–1350) في إحدى وعشرين باباً، من الصفحة 571 إلى الصفحة 604 من ملف PDF المجلد الأول. يبدأ بالترغيب في الجهاد وفضل المجاهد، ثم ينتقل إلى أحكام الحرب من النهي عن قتل النساء والولدان ووفاء الأمان، ثم إلى الغنيمة والنفل والخمس وقسمة الخيل والسلب، ثم إلى الغلول والشهادة وغسل الشهداء، ويختم بالدفن في قبر واحد عند الضرورة. {cite:muwatta-maruf-1997 p.571} {cite:muwatta-maruf-1997 p.604}"
  en: "The Book of Jihad, seventh book of the Muwatta in Yahya ibn Yahya's recension (ed. Ma'ruf 1997): 68 reports (1283–1350) in twenty-one babs, PDF pp. 571–604 of volume 1, from the merit of striving through the conduct of war, booty and the fifth, ghulul, martyrdom and the burial of the martyrs."
