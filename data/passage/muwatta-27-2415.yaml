label: { ar: "الموطأ 2415 — مالك: لا خلاف عندنا أن العبد الآبق يُقطع إذا سرق ما يجب فيه القطع", en: "Muwatta 2415", es: "Muwatta 2415", fr: "Muwatta 2415", ur: "موطا 2415", tr: "El-Muvatta 2415 — Malik: Kaçan kölenin, kesmeyi gerektiren bir şey çalması halinde elinin kesilmesi gerektiği konusunda aramızda ihtilaf yoktur.", id: "Al-Muwatta 2415 — Malik: Tidak ada perbedaan pendapat di antara kami bahwa seorang budak yang melarikan diri harus dipotong tangannya jika ia mencuri sesuatu yang mengharuskan pemotongan." }
summary:
  ar: "قال مالك: وذلك الأمر الذي لا اختلاف فيه عندنا، أن العبد الآبق إذا سرق ما يجب فيه القطع قُطع. {cite:muwatta-maruf-1997 p.397}"
  tr: "Malik şöyle dedi: \"Bu konuda aramızda hiçbir anlaşmazlık yoktur; eğer kaçak bir köle, uzuv kesilmesini gerektiren bir şey çalarsa, eli kesilir.\" {cite:muwatta-maruf-1997 s.397}"
  id: "Malik berkata: Ini adalah masalah yang tidak ada perbedaan pendapat di antara kita, bahwa jika seorang budak yang melarikan diri mencuri sesuatu yang mengharuskan amputasi, tangannya akan dipotong. {cite:muwatta-maruf-1997 p.397}"
