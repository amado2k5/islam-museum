text: "… كل من أحكم أصل الإيمان واجتنب جميع الكبائر وأحسن جميع الفرائض أعني الأركان الخمسة ولم يكن منه إلا صغائر متفرقة لم يصر عليها فيشبه أن يكون عذابه المناقشة في الحساب فقط فإنه إذا حوسب رجحت حسناته على سيئاته إذ ورد …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 4، ص 6375، يذكر أركان الإسلام؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 4, p. 6375, that mentions the pillars of Islam; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 4، ص 6375 کا اقتباس جس میں ارکانِ اسلام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 4, pág. 6375, que menciona los pilares del Islam; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 4, page 6375), mentionnant les piliers de l'islam; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Gazali'nin İhya Ulum el-Din adlı eserinin 4. cildinin 6375. sayfasından, İslam'ın temellerini anlatan bir bölüm; makineyle okunabilir taranmış baskıdan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özelliklerine dair bilgiler içermektedir."
  id: "Kutipan dari kitab Ihya Ulum al-Din karya Al-Ghazali, Volume 4, halaman 6375, yang menyebutkan rukun Islam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut diringkas dengan sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini mencakup informasi tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
