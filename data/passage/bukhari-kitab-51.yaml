summary:
  ar: "القسم 51 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الهبة وفضلها والتحريض عليها»، ويضم فيها النصوص من 2566 إلى 2636 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 51 of Sahih al-Bukhari (Gifts) in the division of the open hadith dataset the museum took its reports from: reports 2566 to 2636 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 51، عنوان «کتاب الہبۃ وفضلہا والتحریض علیہا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2566 تا 2636۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 51 de Sahih al-Bukhari (Regalos) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2566 al 2636, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 51 du Sahih al-Bukhari (Les Dons), dans la section du recueil ouvert: les hadiths 2566 à 2636 de cette section. Le musée conserve ses archives relatives à ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
