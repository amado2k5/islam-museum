label:
  ar: "صحيح البخاري، كتاب الهبة وفضلها والتحريض عليها"
  en: "Sahih al-Bukhari, Book 51: Gifts"
  ur: "صحیح بخاری، کتاب الہبۃ وفضلہا والتحریض علیہا"
  es: "Sahih al-Bukhari, Libro 51: Regalos"
