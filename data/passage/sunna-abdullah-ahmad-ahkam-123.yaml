text: "… من أخبار الآحاد العدول؛ لأنه كان يذهب في ذلك إلى عرضها على ما اجتمع عليه من الأحاديث ومعاني القرآن، فما شذّ عن ذلك ردَّه وسمَّاه شاذًا، وكان مع ذلك أيضًا يقول الطاعات من الصلاة وغيرها : لا تسمى إيمانًا، وكل …"
summary:
  ar: "مقطع من كتاب السنة لعبد الله بن أحمد، ص 123، يرد فيه ذكر الطاعات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from 'Abd Allah ibn Ahmad's Kitab al-Sunna, p. 123, whose wording mentions the acts of obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب السنہ، عبد اللہ بن احمد، ص 123 کا اقتباس جس میں طاعات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 123, dont le texte mentionne les actes d'obéissance ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Kitab al-Sunna de 'Abd Allah ibn Ahmad, p. 123, cuyo texto menciona los actos de obediencia; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Abdullah ibn Ahmed'in \"Sünnet\" adlı kitabından, itaat amellerini anlatan 123. sayfadan bir alıntı; taranmış, makine tarafından okunabilir baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Bu metin, farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh ameller, haram ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari buku \"Al-Sunnah\" karya Abdullah ibn Ahmad, halaman 123, yang menyebutkan amalan-amalan ketaatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
