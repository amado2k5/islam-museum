label:
  ar: "صحيح البخاري، كتاب المرضى"
  en: "Sahih al-Bukhari, Book 75: Patients"
  ur: "صحیح بخاری، کتاب المرضیٰ"
  es: "Sahih al-Bukhari, Libro 75: Pacientes"
