summary:
  ar: "القسم 75 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المرضى»، ويضم فيها النصوص من 5640 إلى 5677 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 75 of Sahih al-Bukhari (Patients) in the division of the open hadith dataset the museum took its reports from: reports 5640 to 5677 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 75، عنوان «کتاب المرضیٰ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 5640 تا 5677۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 75 de Sahih al-Bukhari (Pacientes) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 5640 al 5677 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 75 du Sahih al-Bukhari (Les Patients), soit les hadiths 5640 à 5677 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une numérotation différente."
