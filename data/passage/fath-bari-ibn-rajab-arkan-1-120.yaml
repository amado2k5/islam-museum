text: "… خرَّجٍ حديثَ: - أَبِي هُرَيْرَةَ أَنَّ النَّبِيَّ اْ سُئِلَ: أَيُّ العَمَلِ أَفْضَلُ؟ قَالَ: إيمَانٌ بالله وَرَسُولَه قِيْلَ: ثُمَّ مَاذَا؟ قَالَ: الجَهَادُ فِي سَبِيلَ اللهِ قَيِلَ: ثُمَّ مَاذَا؟ قَالَ: حَجٌّ مَبْرُورٌ. مَقصودُ البخاريِّ بهذا البابِ: أن الإيمان كلَّه عملٌ؛ مناقضةً لقول …"
summary:
  ar: "مقطع من فتح الباري لابن رجب، المجلد المصوَّر 1، ص 120، يذكر الإيمان أفضل الأعمال، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
