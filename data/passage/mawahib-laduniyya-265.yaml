text: "حمد رسول الله إلى بني نهد بن زيد، السلام على من آمن بالله عز وجل ورسوله، لكم يا بني نهد في الوظيفة الفريضة، ولكم الفارض والفريش، وذو العنان الركوب، والفلو الضبيس، لا يمنع سرحكم، لا يعضد طلحكم، ولا يحبس دركم ما لم"
