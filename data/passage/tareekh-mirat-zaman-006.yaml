text: "ب الله ومعالم السنن والسلام. فكتب إليه رسول الله ولي : ((من محمد رسول الله لي إلى خالد بن الوليد، سلام عليك، أما بعد: فإن كتابك ورد علي يخبرني بإسلامهم، فالحمد لله على ذلك، فبشرهم، وأنذرهم، وخوفهم، وحذرهم، وليقبل معك"
