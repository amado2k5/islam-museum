text: |-
  ١٠١
  أى ات أبانا فى الشرف كالنجم المضى وطارقة الرجل فخذه وعشيرته قال الشاعر
  تكون ذهاب طارقى اليها • وطارقتى باكناف الدروب
  والطرق الضرب بالحصى وهوضرب من التكهن والطرّاق المتكهنون والطوارق المتكهنات
  قال لبيذ
  لعمرك ماتدرى الطوارق بالمصى • ولازاجرات الطير ما اللّٰه صانع
  وطرق الفمن الناقة يطرق طروقا أى قعا عليسها وطروقة الفمسل أنناء بقال ناقة طروقة
  الفحل للتى يلغت أن يضربها الفحل وطرق النيباد الصوف يطرقه طرقا اذاضريه والقضيب
  الذى يضريه به يسمى مطارقة وكدلت مطارقة الجذادين قالى رؤية
  عاذلة أواعت بالترقيش • الى سرّافا طوقى وميشى
  قال يعقوب أطرق الرجلى اذاسكت فلم متكلم وأطرق أى أرخ عبنيه ينظ- وإلى الارض وقى
  المثلى أطرق كرا أطرق كر• النّ النعام فى القرى يضرب للمعجب بنفسه كمايقال فغض
  العارف والمطرق المسترخى العين خلقة وأطرقاعلى افظ أمر الاثنين اسم بلمد قال أبو ذؤيب
  عملى أطرقا باليات اخيا • م الاالتمام والاالعصى
  ويقال أطرقى فلك أى أءرنى خلك ليضرب فى الى واستطرقته فلااذا طلبته منه ليضرب
  فى املك وأطرقت الابل وتطارقت اذاذهبت بعضها فى اثر بعض ومنسه قول الراجز
  جامب معار أطرقت شتينا * يقول جاءت مجفعة وذهبت متفرقسة وزكن راعبها مصبوقا
  والجان المطرقة التى يطرق بعضاعلى بعض كالنعسل المطرقة الخصوفة ويقال أطرقت
  بالجلد والعصب أى أليست وترس مطرق وماراق النعل ما أطبقت فخرزت به وريس
  طراق اذا كان بعضه فوق بعض وطارق الرحل بين الثوبين اذا ظاهر بينهسما أى لبس
  أحدهما على الآخر وطارق بين أعلمين أى خصف احداه_مافوق الاخرى ونعل. طارقة
  أى مخصوفة وكل خصيفة طراق قال ذوالرقة
  أغباش ليل تمام كان طارقه • تطغطخ الغيم حق ماله جوب
  قال الاضمعى طرقت القطاة اذاحان خروج بيضها قال أبو عبيد لا يقال ذلات فى غير القطاة
  قال الممزق العبدة
  لقد تخذت رجحلى الى جنب غرزها • نسيفا كأ فحوص القطاة المطرَق
  قال وطرقت الناقة بولدهااذانشب ولم يسهل خروجه وعكذلك المرأة وأنشد
  أبو عبيدة لناصرخة ثم اسكاتة • كالمرقت بنناس بكر
  قال وضربه حتق طرق يجعره قال وطرق فلان بحق اذا كان قد حده ثم أقر به بع_دذلك
  وطرّقت الابل اذا حيتها عن كلا أوغيره وطرقت له من الطريق ⁦(طسدق)⁩ الطسسق
  الوظيفة من خراج الارض فارسى معرب وكتب عمرالى عنمان بن حنيف فى رجايز من
  أهل الذمة أسلما ارفع الجزية عن رؤسهما وخذ الطق من أرضيهما فق طفق
  يفعل حكذا يطفق طفقا أى جعل يذهل ومنه قوله تعالى وظفقا يخصفان عليهما قال
  الاخفس ويعضهم يول طفق بالفتح يطفق طفوقا ⁦(طقق)⁩ الطقطقة أصوات -واقر
  قوله والجمات المطرقة روعة
  ككرمة وكعظمة كمافى القاموس
