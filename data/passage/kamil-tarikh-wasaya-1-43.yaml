text: "… لهنّ فيهنّ امرأة تقول : نَحْنُ بناتُ طارِقْ ونفرُشُ النّمارِقْ إنْ تُقْبِلوا نُعانِقْ أوْ تُدبِروا نُفارِقْ فِراقَ غَيرٍ وامِقْ وتقول أيضاً : إيها نبي عبد الدّارْ إيها حُماةَ الدّيارْ بتارْ ضرباً بكلّ فرفع السيف ليضربها، ثمّ أكرم سيف رسول الله، …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 1، ص 43، يذكر أثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
