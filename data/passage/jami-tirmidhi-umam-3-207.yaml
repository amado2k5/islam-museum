text: "… سِنِينَ إِلَىٰ تِسْعِ سِنِينَ، فَسَمِّ بَيْتَنَا وَبَيْنَكَ وَسَطًا تَنْتَهِي إِلَيْهِ، قَالَ : فَسَمَّوْا بَيْنَهُمْ سِتَّ سِنِينَ، قَالَ : فَمَضَتِ السِّتُّ سِنِينَ قَبْلَ أَنْ يَظْهَرُوا، فَأَخَذَ الْمُشْرِكُونَ رَهْنَ أَبِي بَكْرٍ، فَلَمَّا دَخَلَتِ السَّنَةُ السَّابِعَةُ ظَهَرَتِ الرُّومُ عَلَىٰ فَارِسَ، فَعَابَ الْمُسْلِمُونَ عَلَىٰ …"
