text: "انتهى إلى أصحابه فضتح يمينه فقال : « بسم الله الرحمن الرحيم هذا كتاب من الرحمن الرحيم فيه أسماء أهل الجنة وأسماء آبائهم وأسماء عشائرهم ، لتجمل على آخرهم لا يزاد فيهم ولا ينقص منهم . ثم فتح يساره فقال"
