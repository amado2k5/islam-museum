text: "… على الجدار. فعدّ الشّيخ ذلك تصُّرفاً في مُلك الغير. وكان لجماعةٍ فيهم أطفال وغيب، وأوجب على نفسه لهم شيئاً وأعطاهم. وكان يقول: إنْ كان هذا واجباً فقد خلصت منه، وإنْ كان غير واجبِ فهو صدقة مستورة باسم الحقّ. وكذلك كان …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 52، ص 129، يرد فيه ذكر الواجب، وما يجب على المكلف، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 52, p. 129, whose wording mentions the obligatory (wajib), what is binding on the person addressed, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 52، ص 129 کا اقتباس جس میں واجب، جو مکلف پر واجب ہے، جو واجب نہیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam de al-Dhahabi, volume numérisé 52, p. 129, dont le texte mentionne l'obligatoire (wajib), ce qui s'impose à la personne responsable, ce qui est dit non obligatoire ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen digitalizado 52, p. 129, cuyo texto menciona lo obligatorio (wajib), lo que obliga a la persona responsable, lo que se dice que no es obligatorio; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 52. cildinin (resimli baskı) 129. sayfasından bir alıntı, farz olan amelleri, sorumlu bir bireyden beklenenleri ve farz olmayan amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh edilen ameller, haram ameller ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 52 (edisi bergambar), halaman 129, membahas tentang amalan wajib, apa yang dituntut dari individu yang bertanggung jawab, dan apa yang tidak wajib. Kutipan ini diambil dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Kutipan ini disusun oleh seorang peneliti yang berspesialisasi dalam amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
