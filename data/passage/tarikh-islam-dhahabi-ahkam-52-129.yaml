text: "… على الجدار. فعدّ الشّيخ ذلك تصُّرفاً في مُلك الغير. وكان لجماعةٍ فيهم أطفال وغيب، وأوجب على نفسه لهم شيئاً وأعطاهم. وكان يقول: إنْ كان هذا واجباً فقد خلصت منه، وإنْ كان غير واجبِ فهو صدقة مستورة باسم الحقّ. وكذلك كان …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 52، ص 129، يرد فيه ذكر الواجب، وما يجب على المكلف، وما ليس بواجب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 52, p. 129, whose wording mentions the obligatory (wajib), what is binding on the person addressed, what is said not to be obligatory; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
