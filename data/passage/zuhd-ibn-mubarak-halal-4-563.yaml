text: "… رسول اللّٰه : اعطيت خمسا لم يُعطهن نبيّ قبلى. جيات لى الأرض مسجدا، ونصرت بالرعب فيرعب القوم من بين يدى مسيرة شهر، و بُعثث إلى الأبيض و الأسود، واحلت لى الغنائم ولم تحل لأحد قبلى، وقيل لى سل تعطه فاختبأت …"
