label: { ar: "الأربعون 35 — لا تحاسدوا ولا تناجشوا وكونوا عباد الله إخواناً", en: "Arba'un 35 — do not envy one another; be brothers", es: "Arba'un 35 — No os envidiéis unos a otros; sed hermanos.", fr: "Arba'un 35 — Ne vous enviez pas les uns les autres; soyez frères." }
summary:
  ar: "حديث أبي هريرة قال: قال رسول الله: «لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا ولا يبع بعضكم على بيع بعض وكونوا عباد الله إخواناً، المسلم أخو المسلم لا يظلمه ولا يخذله ولا يكذبه ولا يحقره» ثم أشار إلى صدره ثلاث مرات «التقوى ههنا» وقال «بحسب امرئ من الشر أن يحقر أخاه المسلم، كل المسلم على المسلم حرام: دمه وماله وعرضه» — وهو الحديث الخامس والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ أخرجه مسلم (2564) من رواية أبي سعيد مولى عبد الله بن عامر بن كريز عن أبي هريرة، وأبو سعيد هذا لا يعرف اسمه وقد روى عنه غير واحد وذكره ابن حبان في ثقاته وقال ابن المديني هو مجهول؛ ورواه سفيان الثوري فقال فيه عن سعيد بن يسار عن أبي هريرة فوهم إنما هو أبو سعيد مولى ابن كريز قاله أحمد ويحيى والدارقطني؛ وخرجه الترمذي (1927) من رواية أبي صالح عن أبي هريرة بلفظ «المسلم أخو المسلم لا يخونه ولا يكذبه ولا يخذله كل المسلم على المسلم حرام عرضه وماله ودمه، التقوى ههنا، بحسب امرئ من الشر أن يحقر أخاه المسلم» ⁦(جامع العلوم والحكم ص 710–730)⁩."
  en: "The hadith of Abu Hurayra that the Messenger of God said 'do not envy one another, do not outbid one another, do not hate one another, do not turn your backs on one another, and let none of you sell upon his brother's sale — be servants of God, brothers: a Muslim is a Muslim's brother, he does not wrong him, fail him, lie to him or despise him', then pointing to his breast three times 'God-fearingness is here', and 'it is enough evil for a man to despise his Muslim brother; all of the Muslim is forbidden to the Muslim — his blood, his property and his honour' — the thirty-fifth of al-Nawawi's Forty and of Ibn Rajab's commentary, transmitted by Muslim (2564) through Abu Sa'id, the client of Abdullah ibn Amir ibn Kurayz, from Abu Hurayra — this Abu Sa'id's personal name is unknown though several narrated from him, Ibn Hibban listing him among the trustworthy while Ibn al-Madini called him unknown; Sufyan al-Thawri slipped narrating it 'from Sa'id ibn Yasar from Abu Hurayra' — it is rather Abu Sa'id the client of Ibn Kurayz, as Ahmad, Yahya and al-Daraqutni held; and al-Tirmidhi (1927) carries it through Abu Salih from Abu Hurayra in the wording 'a Muslim is a Muslim's brother, he does not betray him, lie to him or fail him; all of the Muslim is forbidden to the Muslim — his honour, his property and his blood; God-fearingness is here; it is enough evil for a man to despise his Muslim brother' (Jami' al-Ulum wal-Hikam pp. 710–730)."
  es: "El hadiz de Abu Hurayra dice que el Mensajero de Dios dijo: \"No os envidiéis unos a otros, no os superéis en las pujas, no os odiéis, no os deis la espalda, y que ninguno de vosotros venda sobre la venta de su hermano. Sed siervos de Dios, hermanos: un musulmán es hermano de otro musulmán, no le hace daño, no le falla, no le miente ni lo desprecia\", y luego señalando su pecho tres veces: \"Aquí está el temor de Dios\", y \"es suficiente maldad para un hombre despreciar a su hermano musulmán; Todo lo musulmán está prohibido para el musulmán: su sangre, su propiedad y su honor', el trigésimo quinto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab, transmitido por Muslim (2564) a través de Abu Sa'id, el cliente de Abdullah ibn Amir ibn Kurayz, de Abu Hurayra; el nombre personal de este Abu Sa'id es desconocido, aunque varios narraron de él, Ibn Hibban lo incluyó entre los dignos de confianza, mientras que Ibn al-Madini lo llamó desconocido; Sufyan al-Thawri se le escapó narrarlo 'de Sa'id ibn Yasar de Abu Hurayra'; es más bien Abu Sa'id el cliente de Ibn Kurayz, como sostenían Ahmad, Yahya y al-Daraqutni; y al-Tirmidhi (1927) lo transmite a través de Abu Salih de Abu Hurayra con la frase 'un musulmán es hermano de un musulmán, no lo traiciona, no le miente ni le falla; Todo lo que pertenece al musulmán está prohibido para él: su honor, sus bienes y su sangre; aquí reside el temor de Dios; basta con que un hombre desprecie a su hermano musulmán (Jami' al-Ulum wal-Hikam, págs. 710-730)."
  fr: "Le hadith d'Abu Hurayra rapporte que le Messager de Dieu a dit: « Ne vous enviez pas, ne vous surenchérissez pas, ne vous haïssez pas, ne vous tournez pas le dos et que nul d'entre vous ne vende sur la vente de son frère. Soyez serviteurs de Dieu, frères: un musulman est le frère d'un autre musulman, il ne lui fait pas de tort, ne le déçoit pas, ne lui ment pas et ne le méprise pas », puis, pointant sa poitrine trois fois: « La crainte de Dieu est ici », et « c'est déjà un mal suffisant pour un homme de mépriser son frère musulman; « Tout ce qui appartient au musulman est interdit au musulman — son sang, ses biens et son honneur » — le trente-cinquième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, transmis par Muslim (2564) par l'intermédiaire d'Abu Sa'id, le disciple d'Abdullah ibn Amir ibn Kurayz, d'après Abu Hurayra — le nom personnel de cet Abu Sa'id est inconnu, bien que plusieurs récits proviennent de lui, Ibn Hibban le comptant parmi les dignes de confiance tandis qu'Ibn al-Madini le qualifie d'inconnu; Sufyan al-Thawri a omis de le rapporter « de Sa'id ibn Yasar d'après Abu Hurayra » — il s'agit plutôt d'Abu Sa'id, le disciple d'Ibn Kurayz, comme l'ont soutenu Ahmad, Yahya et al-Daraqutni; et al-Tirmidhi (1927) le transmet par l'intermédiaire d'Abu Salih d'après Abu Hurayra dans la formulation suivante: « un musulman est le frère d'un autre musulman, il ne le trahit pas, ne lui ment pas et ne le déçoit pas; Tout ce qui appartient au musulman est interdit au musulman: son honneur, ses biens et son sang; la crainte de Dieu est ici; il est déjà assez mal pour un homme de mépriser son frère musulman' (Jami' al-Ulum wal-Hikam pp. 710–730)."
