text: "… ومعها محرم. فقام رجل فقال: يا رسول اللّٰه : اكتتبت في غزوة كذا وكذا، وخرجت امرأتي حاجّة قال: اذهب فاحجج مع امرأتك. ولحديث: لا يحل لامرأة تؤمن بالله واليوم الآخر تسافر مسيرة يوم وليلة إلا مع ذي محرم عليها،، ولأن …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 5، ص 133، يذكر ما أُحل، وما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
