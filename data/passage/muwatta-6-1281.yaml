label: { ar: "الموطأ 1281 — عائشة: الصيام لمن تمتع بالعمرة إلى الحج لمن لم يجد هديا، ما بين الإهلال بالحج إلى يوم عرفة", en: "Muwatta 1281", es: "Muwatta 1281", fr: "Muwatta 1281", ur: "موطا 1281", tr: "Al-Muwatta 1281 — Aişe: Umre ve ardından Hac yapacak olanlar için, kurbanlık hayvan bulamayanlar için, Hac için ihrama girme zamanı ile Arafat Günü arasında oruç tutmak farzdır.", id: "Al-Muwatta 1281 — Aisyah: Puasa wajib bagi mereka yang melaksanakan Umrah yang kemudian Haji, bagi mereka yang tidak dapat menemukan hewan kurban, antara waktu memasuki keadaan Ihram untuk Haji dan Hari Arafah." }
text: "الصِّيامُ لمَن تَمَتَّعَ بالعُمرَةِ إلى الحَجِّ لمَن لَمْ يَجِدْ هَدْيًا، ما بَينَ أن يُهِلَّ بالحَجِّ إلى يَومِ عَرَفَةَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها كانت تقول إن الصيام لمن تمتع بالعمرة إلى الحج، لمن لم يجد هديا، ما بين أن يهل بالحج إلى يوم عرفة. فإن لم يصم صام أيام منى. {cite:muwatta-maruf-1997 p.569}"
  tr: "Malik, İbn Şihab'dan, o da Urve ibn el-Zübeyr'den, o da Müminlerin Annesi Aişe'den rivayet eder ki, Aişe şöyle derdi: Umre ve ardından Hac yapan ve kurbanlık hayvan bulamayan kimse için, Hac için ihrama girdiği gün ile Arafat günü arasında oruç tutmak farzdır. Oruç tutmazsa, Mina günlerinde oruç tutmalıdır. {cite:muwatta-maruf-1997 s.569}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Urwah bin al-Zubayr, dari Aisyah, Umrah kaum Mukminin, bahwa beliau biasa berkata: Bagi orang yang melaksanakan Umrah yang kemudian Haji, dan yang tidak dapat menemukan hewan kurban, maka puasa wajib dilakukan antara memasuki keadaan ihram untuk Haji dan hari Arafah. Jika ia tidak berpuasa, maka ia harus berpuasa pada hari-hari Mina. {cite:muwatta-maruf-1997 p.569}"
