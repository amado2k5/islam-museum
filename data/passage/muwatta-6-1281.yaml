label: { ar: "الموطأ 1281 — عائشة: الصيام لمن تمتع بالعمرة إلى الحج لمن لم يجد هديا، ما بين الإهلال بالحج إلى يوم عرفة", en: "Muwatta 1281" }
text: "الصِّيامُ لمَن تَمَتَّعَ بالعُمرَةِ إلى الحَجِّ لمَن لَمْ يَجِدْ هَدْيًا، ما بَينَ أن يُهِلَّ بالحَجِّ إلى يَومِ عَرَفَةَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عروة بن الزبير عن عائشة أم المؤمنين أنها كانت تقول إن الصيام لمن تمتع بالعمرة إلى الحج، لمن لم يجد هديا، ما بين أن يهل بالحج إلى يوم عرفة. فإن لم يصم صام أيام منى. {cite:muwatta-maruf-1997 p.569}"
