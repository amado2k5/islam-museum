label: { ar: "الموطأ 2005 — مالك: فأما الرجل يعطي السلعة فيقال له: بعها ولك كذا وكذا في كل دينار، فإن ذلك لا يصلح، لأنه كلما نقص دينار من ثمن السلعة نقص من حقه الذي سمي له، فهذا غرر لا يدرى كم جعل له", en: "Muwatta 2005", es: "Muwatta 2005", fr: "Muwatta 2005", ur: "موطا 2005", tr: "El-Muvatta 2005 — Malik: Bir kimse bir mal verir ve kendisine, \"Bunu sat, her dinar için şu kadar alacaksın\" denirse, bu caiz değildir. Çünkü malın fiyatından her dinar düşüldüğünde, kendisine belirlenmiş olan hakkı da eksiltilmiş olur. Bu bir belirsizliktir, çünkü kendisine ne kadar verildiği bilinmemektedir.", id: "Al-Muwatta 2005 — Malik: Adapun seorang laki-laki yang memberikan suatu barang dan diberitahu: Jualah barang ini dan kamu akan menerima sekian banyak untuk setiap dinar, ini tidak diperbolehkan, karena setiap kali satu dinar dikurangi dari harga barang tersebut, haknya yang telah ditentukan untuknya juga ikut berkurang. Ini adalah ketidakpastian, karena tidak diketahui berapa banyak yang telah diberikan kepadanya." }
summary:
  ar: "قال مالك: فأما الرجل يعطي السلعة فيقال له: بعها ولك كذا وكذا في كل دينار، لشيء يسميه، فإن ذلك لا يصلح. لأنه كلما نقص دينار من ثمن السلعة، نقص من حقه الذي سمي له. فهذا غرر، لا يدرى كم جعل له. {cite:muwatta-maruf-1997 p.220}"
  tr: "Malik şöyle dedi: Bir kimse bir malı verip, \"Bunu sat, her dinar için şu kadarını alacaksın\" denildiğinde, bunu kendisi belirtse bile, bu caiz değildir. Çünkü malın fiyatından her dinar düşüldüğünde, kendisine vaat edilen pay da düşülür. Bu belirsizliktir, çünkü ne kadar hak ettiği bilinmemektedir. {cite:muwatta-maruf-1997 s.220}"
  id: "Malik berkata: Adapun orang yang memberikan suatu barang dan diberi tahu, \"Juallah dan kamu akan menerima sekian banyak untuk setiap dinar,\" untuk sesuatu yang dia tentukan, ini tidak diperbolehkan. Karena setiap kali satu dinar dikurangi dari harga barang tersebut, bagian yang dijanjikan kepadanya juga ikut dikurangi. Ini adalah ketidakpastian, karena tidak diketahui berapa banyak yang menjadi haknya. {cite:muwatta-maruf-1997 p.220}"
