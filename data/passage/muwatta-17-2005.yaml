summary:
  ar: "قال مالك: فأما الرجل يعطي السلعة فيقال له: بعها ولك كذا وكذا في كل دينار، لشيء يسميه، فإن ذلك لا يصلح. لأنه كلما نقص دينار من ثمن السلعة، نقص من حقه الذي سمي له. فهذا غرر، لا يدرى كم جعل له. {cite:muwatta-maruf-1997 p.220}"
