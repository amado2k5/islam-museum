label: { ar: "سنن أبي داود 5004 — ما أُحل، ما لا يحل", en: "Sunan Abi Dawud 5004 — what was made lawful; what is not lawful", ur: "سنن ابی داؤد 5004 — جو حلال کیا گیا، جو حلال نہیں" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ سُلَيْمَانَ الأَنْبَارِيُّ، حَدَّثَنَا ابْنُ نُمَيْرٍ، عَنِ الأَعْمَشِ، عَنْ عَبْدِ اللَّهِ بْنِ يَسَارٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي لَيْلَى، قَالَ حَدَّثَنَا أَصْحَابُ، مُحَمَّدٍ أَنَّهُمْ كَانُوا يَسِيرُونَ مَعَ النَّبِيِّ فَنَامَ رَجُلٌ مِنْهُمْ فَانْطَلَقَ بَعْضُهُمْ إِلَى حَبْلٍ مَعَهُ فَأَخَذَهُ فَفَزِعَ فَقَالَ رَسُولُ اللَّهِ \" لاَ يَحِلُّ لِمُسْلِمٍ أَنْ يُرَوِّعَ مُسْلِمًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5004، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan Abi Dawud, no. 5004 (General Behavior (Kitab Al-Adab)), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن ابی داؤد کی حدیث نمبر 5004، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
