text: "… أذى شوكة فما فوقها إلا كفَّر اللّٰه بها سيثاته كما تحط الشجرة ورقها. - وروى عن أبي هريرة قال، قال رسول اللّٰه : • مثل المؤمن كمثل الخامة من الزرع من حيث أتتها الريح كفأتها، فإذا اعتدلت تكفا بالبلاء، والفاجر …"
summary:
