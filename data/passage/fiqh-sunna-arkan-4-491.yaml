text: "… أذى شوكة فما فوقها إلا كفَّر اللّٰه بها سيثاته كما تحط الشجرة ورقها. - وروى عن أبي هريرة قال، قال رسول اللّٰه : • مثل المؤمن كمثل الخامة من الزرع من حيث أتتها الريح كفأتها، فإذا اعتدلت تكفا بالبلاء، والفاجر …"
summary:
  ar: "مقطع من فقه السنة لسيد سابق، المجلد المصوَّر 4، ص 491، يذكر مَثَل المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Sayyid Sabiq's Fiqh al-Sunna, scan volume 4, p. 491, that mentions the likeness of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "فقہ السنہ، سید سابق، اسکین جلد 4، ص 491 کا اقتباس جس میں مومن کی مثال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Fiqh al-Sunna de Sayyid Sabiq, volumen 4, pág. 491, que menciona la semejanza del creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Fiqh al-Sunna de Sayyid Sabiq, volume 4, page 491, évoquant la ressemblance du croyant; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Seyyid Sabiq'in Fıkıh el-Sünnet adlı eserinin 4. cildinin 491. sayfasından bir alıntı, müminin kıssasını anlatmaktadır; bu alıntı, makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu alıntı, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Fiqh al-Sunnah karya Sayyid Sabiq, Jilid 4, halaman 491, menyebutkan perumpamaan tentang orang beriman; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik orang beriman."
