text: "… لو أقسم على اللّٰه لأبرَّه. باب: إِخباره الأَقرع بن شفي بأَنه يُدفن بالرّبْوة من أَرض فلسطين. باب: إخباره بأن عمر بن الخطاب من المحدَّثين. باب: إخباره بأَول أَزواجه لحوقاً به. باب: إخباره بكتابة المصاحف. باب: إِخباره بأُويس القَرنيّ. باب: إخباره …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 42، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 42, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
