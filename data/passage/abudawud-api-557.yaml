text: "مَا أُحِبُّ أَنَّ مَنْزِلِي إِلَى جَنْبِ الْمَسْجِدِ فَنُمِيَ الْحَدِيثُ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَسَأَلَهُ عَنْ قَوْلِهِ ذَلِكَ فَقَالَ أَرَدْتُ يَا رَسُولَ اللَّهِ أَنْ يُكْتَبَ لِي إِقْبَالِي إِلَى الْمَسْجِدِ وَرُجُوعِي إِلَى أَهْلِي إِذَا رَجَعْتُ ‏.‏ فَقَالَ ‏ \"‏ أَعْطَاكَ اللَّهُ ذَلِكَ كُلَّهُ أَنْطَاكَ اللَّهُ جَلَّ وَعَزَّ مَا احْتَسَبْتَ كُلَّهُ أَجْمَعَ ‏\"‏ ‏.‏"
summary:
  ar: "في سنن أبي داود؛ إرسال كتاب أو رسالة إلى طرف."
  en: "In Sunan Abi Dawud; sending a letter or message to a party."
  ur: "سنن ابی داؤد میں؛ کسی فریق کو خط یا پیغام بھیجنا."
