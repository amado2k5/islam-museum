label: { ar: "الموطأ 1360 — مالك فيمن يقول لرجل أنا أحملك إلى بيت الله: إن نوى حمله على رقبته يريد المشقة فليمش ويهد، وإن لم ينو شيئا فليحج معه راكبا", en: "Muwatta 1360", es: "Muwatta 1360", fr: "Muwatta 1360", ur: "موطا 1360", tr: "El-Muvatta 1360 — Malik, bir başkasına, “Seni Allah’ın Evi’ne taşıyacağım” diyen kişi hakkında şöyle demiştir: Eğer onu boynunda taşımayı kastediyorsa ve zorluk çekmeyi istiyorsa, yürüsün ve sabretsin. Ama hiçbir şey kastetmiyorsa, onu sırtında taşıyarak Hac ibadetini yerine getirsin.", id: "Al-Muwatta 1360 — Malik berkata tentang seseorang yang berkata kepada orang lain, “Aku akan menggendongmu ke Baitullah”: Jika ia bermaksud menggendongnya di lehernya dan menginginkan kesulitan, maka hendaklah ia berjalan dan bersabar. Tetapi jika ia tidak bermaksud apa pun, maka hendaklah ia melaksanakan haji dengan menggendong orang tersebut." }
summary:
  ar: "سئل مالك عن الرجل يقول للرجل أنا أحملك إلى بيت الله. فقال إن نوى أن يحمله على رقبته، يريد بذلك المشقة وتعب نفسه، فليس ذلك عليه، وليمش على رجليه، وليهد. وإن لم يكن نوى شيئا، فليحج وليركب، وليحج بذلك الرجل معه. فإن أبى أن يحج معه فليس عليه شيء، وقد قضى ما عليه. {cite:muwatta-maruf-1997 p.608}"
  tr: "Malik'e, bir başkasına \"Seni Allah'ın Evi'ne taşıyacağım\" diyen bir adam hakkında soru soruldu. O şöyle cevap verdi: \"Eğer onu sırtında taşımayı, yani kendisine zorluk ve yorgunluk yaşatmayı amaçlıyorsa, bunu yapmakla yükümlü değildir. Kendi ayakları üzerinde yürümeli ve kurban kesmelidir. Ama böyle bir niyeti yoksa, kendisi hacca gitmeli, binmeli ve diğer adamın da onunla birlikte hacca gitmesine izin vermelidir. Eğer onunla birlikte hacca gitmeyi reddederse, daha fazla bir şey yapmakla yükümlü değildir ve yükümlülüğünü yerine getirmiş olur.\" {cite:muwatta-maruf-1997 s.608}"
  id: "Malik ditanya tentang seorang pria yang berkata kepada orang lain, \"Aku akan mengantarmu ke Baitullah.\" Beliau menjawab, \"Jika ia bermaksud mengantarnya di punggungnya, dengan maksud untuk menyusahkan dirinya sendiri dan kelelahan, maka ia tidak wajib melakukannya. Ia harus berjalan kaki dan mempersembahkan kurban. Tetapi jika ia tidak bermaksud demikian, maka ia harus melaksanakan haji sendiri, menumpang, dan membiarkan orang lain melaksanakan haji bersamanya. Jika ia menolak untuk melaksanakan haji bersamanya, maka ia tidak wajib melakukan apa pun lagi, dan ia telah memenuhi kewajibannya.\" {cite:muwatta-maruf-1997 p.608}"
