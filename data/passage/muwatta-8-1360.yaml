label: { ar: "الموطأ 1360 — مالك فيمن يقول لرجل أنا أحملك إلى بيت الله: إن نوى حمله على رقبته يريد المشقة فليمش ويهد، وإن لم ينو شيئا فليحج معه راكبا", en: "Muwatta 1360" }
summary:
  ar: "سئل مالك عن الرجل يقول للرجل أنا أحملك إلى بيت الله. فقال إن نوى أن يحمله على رقبته، يريد بذلك المشقة وتعب نفسه، فليس ذلك عليه، وليمش على رجليه، وليهد. وإن لم يكن نوى شيئا، فليحج وليركب، وليحج بذلك الرجل معه. فإن أبى أن يحج معه فليس عليه شيء، وقد قضى ما عليه. {cite:muwatta-maruf-1997 p.608}"
