label: { ar: "جامع الترمذي 3617 — دفن وقبر ومرقد", en: "Jami' al-Tirmidhi 3617 — a burial, grave or resting place", ur: "جامع ترمذی 3617 — تدفین، قبر اور مرقد", es: "Jami' al-Tirmidhi 3617 — un lugar de entierro, tumba o descanso.", fr: "Jami' al-Tirmidhi 3617 — un lieu de sépulture, une tombe ou un lieu de repos" }
text: "… حَدَّثَنَا عُثْمَانُ بْنُ الضَّحَّاكِ، عَنْ مُحَمَّدِ بْنِ يُوسُفَ بْنِ عَبْدِ اللَّهِ بْنِ سَلاَمٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، قَالَ مَكْتُوبٌ فِي التَّوْرَاةِ صِفَةُ مُحَمَّدٍ وَعِيسَى ابْنِ مَرْيَمَ يُدْفَنُ مَعَهُ. قَالَ فَقَالَ أَبُو مَوْدُودٍ وَقَدْ بَقِيَ فِي الْبَيْتِ مَوْضِعُ قَبْرٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ. هَكَذَا قَالَ عُثْمَانُ بْنُ الضَّحَّاكِ وَالْمَعْرُوفُ الضَّحَّاكُ بْنُ عُثْمَانَ الْمَدَنِيُّ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3617، يذكر دفن وقبر ومرقد. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3617 (Chapters on Virtues), that mentions a burial, grave or resting place. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "جامع ترمذی کی حدیث نمبر 3617، جس میں تدفین، قبر اور مرقد کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3617 (Capítulos sobre las virtudes), menciona un entierro, tumba o lugar de descanso. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, propiedades, reliquias y tumbas."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3617 (Chapitres sur les vertus), mentionne un lieu de sépulture, une tombe ou un lieu de repos. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
