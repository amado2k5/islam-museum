text: "… إن الميت ليعذب ببكاء الحي عليه، تقول: يغفر اللّٰه لأبي عبد الرحمن، أما إنه لم يكذب؛ ولكنه نسي أو أخطأً. إنما مر رسول اللّٰه وَليل على يهودية يبكى عليها، فقال: إنهم ليبكون عليها وإنها لتعذب في قبرها. متفق عليه. - …"
summary:
  ar: "مقطع من مشكاة المصابيح، المجلد المصوَّر 4، ص 386، فيه بكاء على ميت أو نياحة وحدودها؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
  en: "An excerpt from Mishkat al-Masabih, scan volume 4, p. 386, that carries weeping over the dead, or wailing and its limits; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Elegy and Death-Announcement Browser lists it."
  ur: "مشکوٰۃ المصابیح، اسکین جلد 4، ص 386 کا اقتباس جس میں میت پر رونا، یا نوحہ اور اس کی حدود ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں اور بغیر تصحیح کے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Mishkat al-Masabih, volume numérisé 4, p. 386, qui contient des pleurs sur un défunt, ou la lamentation et ses limites; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le navigateur des élégies et des annonces de décès le recense."
  es: "Un extracto de Mishkat al-Masabih, volumen escaneado 4, p. 386, que contiene llanto por un difunto, o el lamento y sus límites; tomado del escaneo leído por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El navegador de elegías y anuncios de fallecimiento lo recoge."
  tr: "Mishkat al-Masabih'in resimli 4. cildinin 386. sayfasından, yas tutma veya ağıt yakma ve sınırları hakkındaki bir bölümden alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgülerden oluşan bir derlemeden derlenmiştir."
  id: "Cuplikan dari Mishkat al-Masabih, jilid bergambar 4, halaman 386, berisi bagian tentang berkabung atau ratapan dan batasannya; diambil dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun dari kumpulan elegi dan eulogi paling terkenal."
