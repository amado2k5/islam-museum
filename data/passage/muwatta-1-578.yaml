text: "إن الرجل ليرفع بدعاء ولده من بعده"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، أن سعيد بن المسيب كان يقول: إن الرجل ليُرفع بدعاء ولده من بعده، وأشار بيديه نحو السماء فرفعهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر (التمهيد 23/142) أن رواة الموطأ لم يختلفوا عن مالك في أنه من قول سعيد بن المسيب، وأن ابن وهب رواه عن عمرو بن الحارث ومالك عن يحيى بن سعيد كذلك، وأن هذا لا يدرك بالرأي. {cite:muwatta-maruf-1997 p.298}"
