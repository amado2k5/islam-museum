label: { ar: "الموطأ 578 — سعيد بن المسيب: إن الرجل ليرفع بدعاء ولده من بعده", en: "Muwatta 578", es: "Muwatta 578", fr: "Muwatta 578", ur: "موطا 578", tr: "El-Muvatta 578 — Sa'id ibn el-Musayyab: Bir insan, ölümünden sonra oğlunun duasıyla yücelir.", id: "Al-Muwatta 578 — Sa’id ibn al-Musayyab: Seorang pria diangkat derajatnya oleh doa anaknya setelah kematiannya." }
text: "إن الرجل ليرفع بدعاء ولده من بعده"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد، أن سعيد بن المسيب كان يقول: إن الرجل ليُرفع بدعاء ولده من بعده، وأشار بيديه نحو السماء فرفعهما. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد، وينقل عن ابن عبد البر ⁦(التمهيد 23/142)⁩ أن رواة الموطأ لم يختلفوا عن مالك في أنه من قول سعيد بن المسيب، وأن ابن وهب رواه عن عمرو بن الحارث ومالك عن يحيى بن سعيد كذلك، وأن هذا لا يدرك بالرأي. {cite:muwatta-maruf-1997 p.298}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek, Sa'id ibn al-Musayyab'ın şöyle dediğini aktarmıştır: \"Bir insan, ölümünden sonra oğlunun duasıyla mertebesi yükselir.\" Ve elleriyle göğe doğru işaret ederek ellerini kaldırmıştır. Araştırmacı, Ebu Mus'ab ve Suveyd'in bunu Malik'ten rivayet ettiğini ve İbn Abd al-Barr'ın (el-Tamhid 23/142) şöyle dediğini aktarmaktadır: \"el-Muvatta'nın ravileri, Malik'ten rivayet edilen bu sözün Sa'id ibn al-Musayyab'a ait olduğu konusunda hemfikirdir; İbn Wahb da bunu Amr ibn al-Harith'ten, Malik de Yahya ibn Sa'id'den rivayet etmiştir ve bu kişisel görüşle anlaşılamaz.\" {cite:muwatta-maruf-1997 s.298}"
  id: "Malik meriwayatkannya dari Yahya ibn Sa'id, bahwa Sa'id ibn al-Musayyab biasa berkata: \"Kedudukan seseorang ditingkatkan dengan doa anaknya setelah kematiannya,\" dan dia menunjuk dengan kedua tangannya ke langit dan mengangkatnya. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwayd meriwayatkannya dari Malik, dan mengutip Ibn 'Abd al-Barr (al-Tamhid 23/142) yang mengatakan bahwa para perawi al-Muwatta' tidak berbeda pendapat mengenai riwayat Malik bahwa itu adalah pernyataan Sa'id ibn al-Musayyab, dan bahwa Ibn Wahb meriwayatkannya dari 'Amr ibn al-Harith dan Malik dari Yahya ibn Sa'id juga, dan bahwa hal ini tidak dapat dipahami melalui pendapat pribadi. {cite:muwatta-maruf-1997 p.298}"
