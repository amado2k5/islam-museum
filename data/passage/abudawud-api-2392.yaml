label: { ar: "سنن أبي داود 2392 — ضحك وتبسم", en: "Sunan Abi Dawud 2392 — laughter and smiling", ur: "سنن ابی داؤد 2392 — ہنسی اور تبسم", fr: "Sunan Abi Dawud 2392 — rire et sourire", es: "Sunan Abi Dawud 2392 — risa y sonrisa" }
text: "… أَجِدُ. فَقَالَ لَهُ رَسُولُ اللَّهِ اجْلِسْ . فَأُتِيَ رَسُولُ اللَّهِ بِعَرَقٍ فِيهِ تَمْرٌ فَقَالَ خُذْ هَذَا فَتَصَدَّقْ بِهِ . فَقَالَ يَا رَسُولَ اللَّهِ مَا أَحَدٌ أَحْوَجَ مِنِّي. فَضَحِكَ رَسُولُ اللَّهِ حَتَّى بَدَتْ أَنْيَابُهُ وَقَالَ لَهُ كُلْهُ . قَالَ أَبُو دَاوُدَ رَوَاهُ ابْنُ جُرَيْجٍ عَنِ الزُّهْرِيِّ عَلَى لَفْظِ مَالِكٍ أَنَّ رَجُلاً أَفْطَرَ وَقَالَ فِيهِ أَوْ تُعْتِقَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 2392، فيه ضحك وتبسم. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sunan Abi Dawud, no. 2392, with laughter and smiling. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "سنن ابی داؤد کی حدیث نمبر 2392، جس میں ہنسی اور تبسم ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sunan Abi Dawud, n° 2392, avec rire et sourire. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sunan Abi Dawud, n.º 2392, con risa y sonrisa. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
