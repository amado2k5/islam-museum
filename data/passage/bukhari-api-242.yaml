label: { ar: "صحيح البخاري 242 — الحرام", en: "Sahih al-Bukhari 242 — the unlawful", ur: "صحیح بخاری 242 — حرام", es: "Sahih al-Bukhari 242 — lo ilícito", fr: "Sahih al-Bukhari 242 — l'illicite", tr: "Sahih el-Buhari 242 — Yasak", id: "Sahih al-Bukhari 242 — Yang Terlarang" }
text: "حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنَا سُفْيَانُ، قَالَ حَدَّثَنَا الزُّهْرِيُّ، عَنْ أَبِي سَلَمَةَ، عَنْ عَائِشَةَ، عَنِ النَّبِيِّ قَالَ \" كُلُّ شَرَابٍ أَسْكَرَ فَهُوَ حَرَامٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 242، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih al-Bukhari, no. 242 (Ablutions (Wudu')), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح بخاری کی حدیث نمبر 242، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sahih al-Bukhari, n.º 242 (Abluciones (Wudu')), menciona lo ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih al-Bukhari, n° 242 (Ablutions (Wudu')), mentionne ce qui est illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
  tr: "Sahih el-Buhari'nin 242. hadisinde haram olan şeylerden bahsedilir. Helal ve Haram tarayıcısı, bunu Kur'an, Sünnet, Peygamberimizin hayatı ve Sahabeler ile onların haleflerinin helal ve haram olan şeyler hakkındaki rivayetleriyle birleştirir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 242, menyebutkan apa yang dilarang. Peramban Halal dan Haram menggabungkan ini dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka mengenai apa yang diperbolehkan dan apa yang dilarang."
