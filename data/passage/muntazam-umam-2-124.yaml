text: "… خرجنا فى سرية الى ارض الروم نصحبنا شاب لم يكن فينا اقرأ للقرآن منه ولا انقه ولا افرض، صائم النهار نائم الليل فمررنا بحصن قمال عنه العسكر ونزل بقرب الحصن نظننا انه يول فنظر الى امرأة من النصارى تنظر من …"
