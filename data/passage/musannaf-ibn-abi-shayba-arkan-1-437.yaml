text: "… والدماء تسيل، كلما دخل قوم بكوا وأثنوا عليه، فقلنا له : أوصنا - وما سأله الوصية أحد غيرنا - فقال: عليكم بكتاب الله، فإنكم لن تضلوا ما اتبعتموه، وأوصيكم بالمهاجرين فإن الناس يكثرون ويقلون، وأوصيكم بالأنصار فإنهم شعب الإيمان الذي …"
