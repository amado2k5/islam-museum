text: "… رِضْوَانَهُ فَأَحْبَطَ أَعْمَٰلَهُمْ محمد :. فالواجب على كلِّ مؤمن أن يُحِبَّ ما أحبَّه اللّٰه محبةً توجِبُ له الإتيان بما وجب عليه منه، فإنْ زادت المحبَّةُ، حتّى أتى بما ندب إليه منه، كان ذلك فضلاً، وأنْ يكره ما كرهه اللّٰه تعالى …"
summary:
  ar: "مقطع من جامع العلوم والحكم لابن رجب، المجلد المصوَّر 2، ص 826، يرد فيه ذكر ما وجب على كل مسلم، والواجب، وما يجب على المكلف، والمندوب، والندب، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Rajab's Jami' al-'Ulum wa-l-Hikam, scan volume 2, p. 826, whose wording mentions a duty laid on every Muslim, the obligatory (wajib), what is binding on the person addressed, the recommended (mandub), recommendation (nadb), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "جامع العلوم والحکم، ابن رجب، اسکین جلد 2، ص 826 کا اقتباس جس میں جو ہر مسلمان پر لازم ہے، واجب، جو مکلف پر واجب ہے، مندوب، ندب، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volume numérisé 2, p. 826, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib), ce qui s'impose à la personne responsable, le recommandé (mandub), la recommandation (nadb), ce qui fut réprouvé ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Jami' al-'Ulum wa-l-Hikam de Ibn Rajab, volumen digitalizado 2, p. 826, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib), lo que obliga a la persona responsable, lo recomendado (mandub), la recomendación (nadb), lo que se reprobó; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
