text: "صلاة الجماعة أفضل من صلاة أحدكم وحده بخمسة وعشرين جزءاً"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، في باب فضل صلاة الجماعة على صلاة الفذ: أخبر النبي أن صلاة الجماعة أفضل من صلاة المنفرد بخمسة وعشرين جزءاً. ويخرّجه المحقق عند مسلم (2/121) والترمذي (216) والنسائي (2/103) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه في الموطأ بهذا الإسناد عند جميع الرواة، وأن بعضهم رواه عن مالك عن الزهري عن أبي سلمة، والشافعي وروح عن مالك عن أبي الزناد عن الأعرج ⁦(التمهيد 6/316)⁩. {cite:muwatta-maruf-1997 p.188} {cite:muwatta-maruf-1997 p.189}"
  tr: "Malik, İbn Şihab'dan, o da Sa'id ibn el-Musayyab'dan, o da Ebu Hurayra'dan rivayetle, cemaat namazının tek başına namazdan üstünlüğü bölümünde şöyle nakletmiştir: Peygamberimiz bize cemaat namazının tek başına namazdan yirmi beş kat daha üstün olduğunu bildirmiştir. Araştırmacı, bu hadisi Malik'in sahabelerinin rivayet zincirleriyle Müslim (2/121), Tirmizi (216), Nesai (2/103), İbn Hibban, Ahmed ve Şafiî'nin hadis külliyatlarına dahil etmiştir. İbn Abdülberr'in, bu hadisin tüm ravilere göre bu isnad zinciriyle el-Muvatta'da bulunduğunu ve bazılarının bunu Malik'ten, o da el-Zuhri'den, o da Ebu Seleme'den, el-Şafii ve Rav ise Malik'ten, o da Ebu el-Zinad'dan, o da el-A'raj'dan rivayet ettiğini söylediğini aktarıyor (el-Tamhid 6/316). {cite:muwatta-maruf-1997 s.188} {cite:muwatta-maruf-1997 s.189}"
  id: "Diriwayatkan oleh Malik dari Ibnu Shihab, dari Sa'id ibn al-Musayyab, dari Abu Hurayrah, dalam surah tentang keutamaan shalat berjamaah atas shalat berjamaah perorangan: Nabi memberitahukan kepada kita bahwa shalat berjamaah lebih utama dua puluh lima kali lipat daripada shalat berjamaah perorangan. Peneliti menyertakan hadits ini dalam kumpulan hadits Muslim (2/121), al-Tirmidhi (216), al-Nasa'i (2/103), Ibnu Hibban, Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik. Ia mengutip Ibnu 'Abd al-Barr yang mengatakan bahwa hadits ini ditemukan dalam kitab al-Muwatta' dengan sanad menurut semua perawi, dan sebagian dari mereka meriwayatkannya dari Malik, dari al-Zuhri, dari Abu Salamah, dan al-Shafi'i dan Rawh dari Malik, dari Abu al-Zinad, dari al-A'raj (al-Tamhid 6/316). {cite:muwatta-maruf-1997 p.188} {cite:muwatta-maruf-1997 p.189}"
