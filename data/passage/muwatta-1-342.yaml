text: "صلاة الجماعة أفضل من صلاة أحدكم وحده بخمسة وعشرين جزءاً"
summary:
  ar: "يرويه مالك عن ابن شهاب عن سعيد بن المسيب عن أبي هريرة، في باب فضل صلاة الجماعة على صلاة الفذ: أخبر النبي أن صلاة الجماعة أفضل من صلاة المنفرد بخمسة وعشرين جزءاً. ويخرّجه المحقق عند مسلم (2/121) والترمذي (216) والنسائي (2/103) وابن حبان وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أنه في الموطأ بهذا الإسناد عند جميع الرواة، وأن بعضهم رواه عن مالك عن الزهري عن أبي سلمة، والشافعي وروح عن مالك عن أبي الزناد عن الأعرج (التمهيد 6/316). {cite:muwatta-maruf-1997 p.188} {cite:muwatta-maruf-1997 p.189}"
