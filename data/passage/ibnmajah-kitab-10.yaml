summary:
  ar: "القسم 10 من سنن ابن ماجه في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الطلاق»، ويضم فيها النصوص من 2016 إلى 2477 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 10 of Sunan Ibn Majah (The Chapters on Divorce) in the division of the open hadith dataset the museum took its reports from: reports 2016 to 2477 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابن ماجہ کی کتاب 10، عنوان «کتاب الطلاق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2016 تا 2477۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 10 de Sunan Ibn Majah (Los capítulos sobre el divorcio) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2016 al 2477, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan Ibn Majah (Livre 10, chapitres sur le divorce), dans la base de données ouverte: les hadiths 2016 à 2477 de cette base de données sont classés dans ce livre. Les éditions imprimées présentent une classification et une numérotation différentes."
