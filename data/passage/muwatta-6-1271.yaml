text: "اقْتُلُوهُ"
summary:
  ar: "يروي مالك عن ابن شهاب عن أنس بن مالك أن رسول الله دخل مكة عام الفتح وعلى رأسه المغفر، فلما نزعه جاءه رجل فقال إن ابن خطل متعلق بأستار الكعبة، فقال اقتلوه. ويذكر المحقق أن ابن عبد البر قال إن الحديث انفرد به مالك، ولم يثبت فيه إسناد غير حديثه. {cite:muwatta-maruf-1997 p.565}"
