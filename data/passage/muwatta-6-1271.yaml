label: { ar: "الموطأ 1271 — ابن شهاب عن أنس بن مالك: دخل النبي مكة عام الفتح، فلما نزع المغفر قيل إن ابن خطل متعلق بأستار الكعبة، فقال اقتلوه", en: "Muwatta 1271", es: "Muwatta 1271", fr: "Muwatta 1271", ur: "موطا 1271", tr: "El-Muvatta 1271 — İbn Şihab, Enes bin Malik'ten rivayet eder: Peygamberimiz fethedildiği yıl Mekke'ye girdi ve miğferini çıkardığında İbn Hattal'ın Kâbe'nin perdelerine tutunduğu görüldü. Bunun üzerine Peygamberimiz \"Onu öldürün\" dedi.", id: "Al-Muwatta 1271 — Ibn Shihab meriwayatkan dari Anas bin Malik: Nabi memasuki Mekah pada tahun penaklukan, dan ketika beliau melepas helmnya, dikatakan bahwa Ibn Khatal berpegangan pada tirai Ka'bah, lalu beliau berkata, \"Bunuh dia.\"" }
text: "اقْتُلُوهُ"
summary:
  ar: "يروي مالك عن ابن شهاب عن أنس بن مالك أن رسول الله دخل مكة عام الفتح وعلى رأسه المغفر، فلما نزعه جاءه رجل فقال إن ابن خطل متعلق بأستار الكعبة، فقال اقتلوه. ويذكر المحقق أن ابن عبد البر قال إن الحديث انفرد به مالك، ولم يثبت فيه إسناد غير حديثه. {cite:muwatta-maruf-1997 p.565}"
  tr: "Malik, İbn Şihab'dan, o da Enes ibn Malik'ten rivayet ettiğine göre, Allah Resulü Fetih yılında miğfer takarak Mekke'ye girdi. Miğferini çıkardığında, bir adam yanına gelip, \"İbn Hattal Kâbe'nin perdelerine tutunuyor\" dedi. Bunun üzerine Peygamberimiz \"Onu öldürün\" dedi. Araştırmacı, İbn Abdül-Barr'ın bu hadisin yalnızca Malik tarafından rivayet edildiğini ve başka bir rivayet zincirinin bulunmadığını söylediğini belirtiyor. {cite:muwatta-maruf-1997 s.565}"
  id: "Malik meriwayatkan dari Ibn Shihab, dari Anas ibn Malik, bahwa Rasulullah SAW memasuki Mekah pada tahun Penaklukan dengan mengenakan helm. Ketika beliau melepasnya, seorang laki-laki datang kepadanya dan berkata, \"Ibn Khatal berpegangan pada tirai Ka'bah.\" Maka beliau berkata, \"Bunuh dia.\" Peneliti menyebutkan bahwa Ibn Abd al-Barr mengatakan bahwa hadits ini hanya diriwayatkan oleh Malik, dan tidak ada sanad lain yang dapat membuktikannya. {cite:muwatta-maruf-1997 p.565}"
