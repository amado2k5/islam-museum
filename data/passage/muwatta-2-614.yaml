label: { ar: "الموطأ 614 — عائشة تأمر أن يُمر عليها بسعد بن أبي وقاص في المسجد: ما صلى النبي على سهيل بن بيضاء إلا في المسجد", en: "Muwatta 614" }
text: "ما أسرع الناس، ما صلى رسول الله على سهيل بن بيضاء إلا في المسجد"
summary:
  ar: "أول حديث في باب الصلاة على الجنائز في المسجد. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن عائشة، أنها أمرت أن يُمر عليها بسعد بن أبي وقاص في المسجد حين مات لتدعو له، فأنكر ذلك الناس عليها، فقالت: ما أسرع الناس، ما صلى النبي على سهيل بن بيضاء إلا في المسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند الطحاوي، وينقل عن الدارقطني في أحاديث الموطأ أنه روي موصولاً من حديث مالك ولا يثبت، وعن ابن عبد البر (التمهيد 21/216) أنه منقطع عند جمهور الرواة وأن حماد بن خالد انفرد بوصله عن أبي سلمة عن عائشة، ويضيف أن مسلماً (3/63) وأبا داود (3190) أخرجاه من طريق الضحاك بن عثمان عن أبي النضر عن أبي سلمة، وأن الدارقطني تتبعها على مسلم ورجح رواية مالك، وأن أحمد ومسلماً (3/62) والترمذي (1033) وابن ماجة والنسائي أخرجوه من حديث عباد بن عبد الله بن الزبير عن عائشة، وقال الترمذي: حسن. {cite:muwatta-maruf-1997 p.314} {cite:muwatta-maruf-1997 p.315}"
