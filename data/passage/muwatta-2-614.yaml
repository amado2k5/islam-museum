label: { ar: "الموطأ 614 — عائشة تأمر أن يُمر عليها بسعد بن أبي وقاص في المسجد: ما صلى النبي على سهيل بن بيضاء إلا في المسجد", en: "Muwatta 614", es: "Muwatta 614", fr: "Muwatta 614", ur: "موطا 614", tr: "Al-Muwatta 614 — Aişe, Saad bin Abi Waqqas'ın mescide getirilmesini emretti: Peygamber, Suhayl bin Bayda'ya mescit dışında namaz kılmadı.", id: "Al-Muwatta 614 — Aisyah memerintahkan agar Saad bin Abi Waqqas dibawa kepadanya di masjid: Nabi tidak mendoakan Suhayl bin Bayda’ kecuali di masjid." }
text: "ما أسرع الناس، ما صلى رسول الله على سهيل بن بيضاء إلا في المسجد"
summary:
  ar: "أول حديث في باب الصلاة على الجنائز في المسجد. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن عائشة، أنها أمرت أن يُمر عليها بسعد بن أبي وقاص في المسجد حين مات لتدعو له، فأنكر ذلك الناس عليها، فقالت: ما أسرع الناس، ما صلى النبي على سهيل بن بيضاء إلا في المسجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والقعنبي عند الطحاوي، وينقل عن الدارقطني في أحاديث الموطأ أنه روي موصولاً من حديث مالك ولا يثبت، وعن ابن عبد البر ⁦(التمهيد 21/216)⁩ أنه منقطع عند جمهور الرواة وأن حماد بن خالد انفرد بوصله عن أبي سلمة عن عائشة، ويضيف أن مسلماً (3/63) وأبا داود (3190) أخرجاه من طريق الضحاك بن عثمان عن أبي النضر عن أبي سلمة، وأن الدارقطني تتبعها على مسلم ورجح رواية مالك، وأن أحمد ومسلماً (3/62) والترمذي (1033) وابن ماجة والنسائي أخرجوه من حديث عباد بن عبد الله بن الزبير عن عائشة، وقال الترمذي: حسن. {cite:muwatta-maruf-1997 p.314} {cite:muwatta-maruf-1997 p.315}"
  tr: "Mescitte ölüler için namaz kılınması konusundaki bölümün ilk hadisi. Ömer ibn Ubeydullah'ın azatlı kölesi Ebu el-Nadr'dan, o da Aişe'den rivayet edildiğine göre, Aişe, Saad ibn Abi Vakkas öldüğünde onun için namaz kılmak üzere mescide getirilmesini emretmiştir. İnsanlar buna itiraz edince, Aişe şöyle demiştir: \"İnsanlar ne kadar da hızlı davranıyorlar!\" Peygamberimiz, Suhayl ibn Beyda' için mescit dışında namaz kılmamıştır. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve el-Ka'nebi tarafından rivayet edildiğini, el-Tahavi'nin de bunu kaydettiğini belirtmektedir. El-Daraqutni'nin el-Muvatta' adlı hadis derlemesinde, bu hadisin Malik'ten terekeli ile rivayet edildiğini söylediğini aktarmaktadır, ancak bu sahih kabul edilmemektedir. Ayrıca İbn Abdülberr'in (el-Temhid 21/216) rivayetine göre, rivayetlerin çoğunluğuna göre bu rivayetin bağlantısız olduğunu ve Hammad ibn Halid'in ise bunu Ebu Seleme'den, oradan da Aişe'den rivayet eden tek kişi olduğunu belirtir. Müslim (3/63) ve Ebu Davud'un (3190) bunu el-Dahhak ibn Osman'dan, Ebu el-Nadr'dan, oradan da Ebu Seleme'den rivayet ettiklerini ve el-Daraqutni'nin de Müslim'i takip ederek Malik'in rivayetini tercih ettiğini ekler. Ayrıca Ahmed, Müslim (3/62), Tirmizi (1033), İbn Majah ve el-Nasa'i'nin bunu Aişe'den, Abbas ibn Abdullah ibn el-Zubayr'dan rivayet ettiklerini ve Tirmizi'nin \"Bu sahihtir\" dediğini ifade eder. {cite:muwatta-maruf-1997 s.314} {cite:muwatta-maruf-1997 s.315}"
  id: "Hadits pertama dalam bab tentang mendoakan orang mati di masjid. Diriwayatkan oleh Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Aisyah, bahwa ia memerintahkan agar Saad ibn Abi Waqqas dibawa kepadanya di masjid ketika ia meninggal agar ia dapat mendoakannya. Orang-orang keberatan, lalu ia berkata: Betapa cepatnya orang-orang bertindak! Nabi tidak mendoakan Suhayl ibn Bayda’ kecuali di masjid. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan al-Qa'nabi, sebagaimana dicatat oleh al-Tahawi. Ia mengutip al-Daraqutni dalam kumpulan haditsnya di al-Muwatta' yang mengatakan bahwa hadits ini diriwayatkan dengan sanad yang terhubung dari Malik, tetapi ini tidak dianggap sahih. Ia juga mengutip Ibn 'Abd al-Barr (al-Tamhid 21/216) yang mengatakan bahwa hadits ini terputus menurut mayoritas perawi, dan bahwa Hammad ibn Khalid adalah satu-satunya yang menghubungkannya dari Abu Salamah dari 'Aisyah. Ia menambahkan bahwa Muslim (3/63) dan Abu Dawud (3190) memasukkannya melalui al-Dahhak ibn 'Uthman dari Abu al-Nadr dari Abu Salamah, dan bahwa al-Daraqutni menindaklanjutinya dengan Muslim dan lebih menyukai riwayat Malik. Ia lebih lanjut menyatakan bahwa Ahmad, Muslim (3/62), al-Tirmidhi (1033), Ibn Majah, dan al-Nasa'i memasukkannya melalui 'Abbad ibn 'Abd Allah ibn al-Zubayr dari 'Aisyah, dan al-Tirmidhi berkata: Hadits ini baik. {kutip:muwatta-maruf-1997 hal.314} {kutip:muwatta-maruf-1997 hal.315}"
