label: { ar: "جامع الترمذي 2068 — الكمأة، تمر العجوة", en: "Jami' al-Tirmidhi 2068 — truffles and their water for the eye; 'ajwa dates", ur: "جامع ترمذی 2068 — کھمبی، عجوہ کھجور", es: "Jami' al-Tirmidhi 2068 — trufas y su agua para los ojos; dátiles 'ajwa", fr: "Jami' al-Tirmidhi 2068 — les truffes et leur eau pour les yeux; les dattes 'ajwa", tr: "Jami' al-Tirmidhi 2068 - Yermantarları, Ajwa tarihleri", id: "Jami' al-Tirmidzi 2068 — Truffle, kurma Ajwa" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قال حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، قال حَدَّثَنَا أَبِي، عَنْ قَتَادَةَ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ نَاسًا، مِنْ أَصْحَابِ النَّبِيِّ قَالُوا الْكَمْأَةُ جُدَرِيُّ الأَرْضِ فَقَالَ النَّبِيُّ \" الْكَمْأَةُ مِنَ الْمَنِّ وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ وَالْعَجْوَةُ مِنَ الْجَنَّةِ وَهِيَ شِفَاءٌ مِنَ السُّمِّ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2068، يذكر الكمأة، وتمر العجوة، وأسماء الأمراض، والسم والترياق، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2068 (Chapters on Medicine), that mentions truffles and their water for the eye, 'ajwa dates, named diseases, poison and antidote, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2068، جس میں کھمبی، عجوہ کھجور، بیماریوں کے نام، زہر اور تریاق، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2068 (Capítulos sobre Medicina), menciona las trufas y su agua para los ojos, los dátiles 'ajwa, enfermedades específicas, venenos y antídotos, y la curación. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2068 (Chapitres sur la médecine), mentionne les truffes et leur eau pour les yeux, les dattes ajwa, les maladies nommées, les poisons et leurs antidotes, ainsi que la guérison. Le Répertoire des ouvrages de référence sur la médecine le classe parmi les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 2068 numaralı hadiste trüf mantarı, ajva hurması, hastalıkların isimleri, zehir ve panzehir ile tedavi yöntemlerinden bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2068, menyebutkan jamur truffle, kurma 'Ajwa, nama-nama penyakit, racun dan penawarnya, serta obat-obatan. Hadits ini disusun oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
