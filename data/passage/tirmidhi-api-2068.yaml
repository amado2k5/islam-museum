text: "حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قال حَدَّثَنَا مُعَاذُ بْنُ هِشَامٍ، قال حَدَّثَنَا أَبِي، عَنْ قَتَادَةَ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ نَاسًا، مِنْ أَصْحَابِ النَّبِيِّ قَالُوا الْكَمْأَةُ جُدَرِيُّ الأَرْضِ فَقَالَ النَّبِيُّ \" الْكَمْأَةُ مِنَ الْمَنِّ وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ وَالْعَجْوَةُ مِنَ الْجَنَّةِ وَهِيَ شِفَاءٌ مِنَ السُّمِّ \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2068، يذكر الكمأة، وتمر العجوة، وأسماء الأمراض، والسم والترياق، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2068 (Chapters on Medicine), that mentions truffles and their water for the eye, 'ajwa dates, named diseases, poison and antidote, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2068، جس میں کھمبی، عجوہ کھجور، بیماریوں کے نام، زہر اور تریاق، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
