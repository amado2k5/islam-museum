summary:
  ar: "يروي مالك عن حميد بن قيس عن مجاهد أبي الحجاج عن ابن أبي ليلى عن كعب بن عجرة أن رسول الله قال له لعلك آذاك هوامك، فقال نعم، فقال احلق رأسك، وصم ثلاثة أيام، أو أطعم ستة مساكين، أو انسك بشاة. {cite:muwatta-maruf-1997 p.557}"
