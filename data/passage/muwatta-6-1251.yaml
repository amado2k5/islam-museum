label: { ar: "الموطأ 1251 — حميد بن قيس عن مجاهد عن ابن أبي ليلى عن كعب: هل آذاك هوامك؟ فاحلق رأسك وصم أو أطعم أو انسك", en: "Muwatta 1251", es: "Muwatta 1251", fr: "Muwatta 1251", ur: "موطا 1251", tr: "El-Muvatta 1251 — Hamid bin Kays, Mücahid'den, o da İbn Abi Leyla'dan, o da Ka'b'dan rivayetle: \"Haşereleriniz sizi rahatsız mı ediyor? O halde saçınızı kazıyın ve oruç tutun, ya da fakirleri doyurun, ya da kurban kesin.\"", id: "Al-Muwatta 1251 — Hamid bin Qais, dari Mujahid, dari Ibn Abi Layla, dari Ka’b: “Apakah kutu mengganggu Anda? Maka cukurlah kepala Anda dan berpuasalah, atau berilah makan orang miskin, atau laksanakan kurban.”" }
summary:
  ar: "يروي مالك عن حميد بن قيس عن مجاهد أبي الحجاج عن ابن أبي ليلى عن كعب بن عجرة أن رسول الله قال له لعلك آذاك هوامك، فقال نعم، فقال احلق رأسك، وصم ثلاثة أيام، أو أطعم ستة مساكين، أو انسك بشاة. {cite:muwatta-maruf-1997 p.557}"
  tr: "Malik, Humaid ibn Qais'ten, o da Mujahid Abu al-Hajjaj'dan, o da İbn Abi Leyla'dan, o da Ka'b ibn 'Ujrah'tan rivayet eder ki, Allah Resulü ona, \"Belki de bitlerin seni rahatsız ediyordur?\" dedi. O da, \"Evet,\" dedi. Bunun üzerine Resulullah, \"Başını tıraş et, üç gün oruç tut, ya da altı fakiri doyur, ya da bir koyun kurban et,\" dedi. {cite:muwatta-maruf-1997 s.557}"
  id: "Malik meriwayatkan dari Humaid ibn Qais, dari Mujahid Abu al-Hajjaj, dari Ibn Abi Layla, dari Ka'b ibn 'Ujrah, bahwa Rasulullah SAW bersabda kepadanya, \"Mungkin kutu rambutmu mengganggumu?\" Dia menjawab, \"Ya.\" Maka beliau bersabda, \"Cukurlah kepalamu, berpuasalah selama tiga hari, atau berilah makan enam orang fakir miskin, atau sembelihlah seekor domba.\" {cite:muwatta-maruf-1997 p.557}"
