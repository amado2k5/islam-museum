text: "… نصف الرأس حلق يوماً عند المزين الحلاق وأعطاه درهماً، وعاد في الأسبوع الثاني فحلق عنده، ووقف المزين أمامه على العادة لِيقبضَ أجرتَه، فقال له جحا: يا صاحبي أنت تعلم، أني أقرعُ وشعرُ رأسي يُعادِلُ نصف رأسِ، فهلا تجعل لي الحلاقتين، …"
summary:
  ar: "دفع جحا درهمًا لحلاق وطلب أن يُحسب الحلاقتان واحدة لأن نصف رأسه أصلع. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  en: "Juha pays a barber a dirham and asks that the two haircuts be charged as one, since half his head is bald. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  ur: "جحا نے ایک حجام کو ایک درہم دیا اور کہا کہ دونوں حجامتیں ایک شمار کی جائیں کیونکہ اس کا آدھا سر گنجا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  fr: "Juha paie un dirham à un barbier et demande que les deux coupes de cheveux soient comptées pour une seule, puisque la moitié de sa tête est chauve. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  es: "Juha paga un dírham a un barbero y pide que los dos cortes de pelo se cobren como uno, ya que la mitad de su cabeza es calva. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
  tr: "Juha bir berbere bir dirhem ödedi ve başının yarısı kel olduğu için iki saç kesiminin tek sayılmasını istedi. {cite:juha-nawadir-kubra-djuwaydi s. 35}"
  id: "Juha membayar tukang cukur satu dirham dan meminta agar kedua potongan rambut itu dihitung sebagai satu karena setengah kepalanya botak. {cite:juha-nawadir-kubra-djuwaydi p. 35}"
