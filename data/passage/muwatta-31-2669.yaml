summary:
  ar: "قال يحيى: وسمعت مالكا يقول: يُؤخذ من الشارب حتى يبدو طرف الشفة، وهو الإطار، ولا يجزّه فيمثّل بنفسه. {cite:muwatta-maruf-1997 p.507}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Bıyık, dudağın kenarı görünene kadar, yani çerçeve olacak şekilde kısaltılmalı, ancak çok kısa kesilmemeli, çünkü bu şekil bozukluğu olur. {cite:muwatta-maruf-1997 s.507}"
  id: "Yahya berkata: Saya mendengar Malik berkata: Kumis harus dipangkas hingga tepi bibir terlihat, yang merupakan bingkainya, tetapi jangan dipotong terlalu pendek, karena itu akan merusak penampilan. {cite:muwatta-maruf-1997 p.507}"
