text: "… مأخذها من الكتاب والسنة، بما تلقوه من صاحب الشرع وأصحابه. والقوم يومئذ عرب لم يعرفوا أمر التعليم والتأليف والتدوين، ولا دُفِعوا إليه ولا دعتهم إليه الحاجة. وجرى الأمر على ذلك زمن الصحابة والتابعين، وكانوا يسمون المختصين حمل ذلك ونقله القُرَّاء، …"
summary:
  ar: "مقطع من مقدمة ابن خلدون، المجلد المصوَّر 1، ص 580، يذكر القراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Khaldun's Muqaddima, scan volume 1, p. 580, that mentions the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مقدمہ ابن خلدون، اسکین جلد 1، ص 580 کا اقتباس جس میں قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Muqaddima de Ibn Khaldun, volumen 1, pág. 580, que menciona a los lectores; tomado de la lectura automática, citado en un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de la Muqaddima d'Ibn Khaldoun (tome 1, p. 580) mentionne les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn Haldun'un Mukaddime'sinin 1. cildinin 580. sayfasında okuyuculardan bahsedilmektedir; makine tarafından okunabilir taranmış versiyondan, kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Muqaddimah karya Ibn Khaldun, Volume 1, halaman 580, menyebutkan para pembaca; dari versi hasil pemindaian yang dapat dibaca mesin, teks tersebut dikutip dalam kurang lebih empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
