label: { ar: "سنن ابن ماجه 4238 — الأب والأبوة", en: "Sunan Ibn Majah 4238 — the father and fatherhood", ur: "سنن ابن ماجہ 4238 — باپ اور والدیت", es: "Sunan Ibn Majah 4238 — El padre y la paternidad", fr: "Sunan Ibn Majah 4238 — Le père et la paternité", tr: "Sunan İbn Majah 4238 — Baba ve Babalık", id: "Sunan Ibn Majah 4238 — Ayah dan Peran Ayah" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ : كَانَتْ عِنْدِي امْرَأَةٌ فَدَخَلَ عَلَىَّ النَّبِيُّ ـ فَقَالَ : \" مَنْ هَذِهِ \". قُلْتُ : فُلاَنَةُ. لاَ تَنَامُ - تَذْكُرُ مِنْ صَلاَحِهَا - فَقَالَ النَّبِيُّ ـ : \" مَهْ عَلَيْكُمْ بِمَا تُطِيقُونَ فَوَاللَّهِ لاَ يَمَلُّ اللَّهُ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4238، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4238 (Zuhd), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4238، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 4238 (Zuhd), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 4238 (Zuhd), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 4238 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Ibn Majah, nomor 4238, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
