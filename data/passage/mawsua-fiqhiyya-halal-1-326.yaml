text: "… ترك شىء من أركانها، فيحرم ترك شىء من الطواف، أو السعى أو الحلق، على القول بركنيتهما، ولا يتحلل من إحرام العمرة حتى يتم ماتركه. ومكروهات العمرة: ترك واجب من واجباتها، وترك الواجب مكروه كراهة تحريم عند الحنفية، وعند غيرهم حرام، …"
