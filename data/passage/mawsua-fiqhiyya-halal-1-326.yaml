text: "… ترك شىء من أركانها، فيحرم ترك شىء من الطواف، أو السعى أو الحلق، على القول بركنيتهما، ولا يتحلل من إحرام العمرة حتى يتم ماتركه. ومكروهات العمرة: ترك واجب من واجباتها، وترك الواجب مكروه كراهة تحريم عند الحنفية، وعند غيرهم حرام، …"
summary:
  ar: "مقطع من الموسوعة الفقهية الكويتية، المجلد المصوَّر 1، ص 326، يذكر الحرام، والتحريم، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from the Kuwaiti Encyclopaedia of Fiqh, scan volume 1, p. 326, that mentions the unlawful, prohibition, the disliked; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "موسوعہ فقہیہ کویتیہ، اسکین جلد 1، ص 326 کا اقتباس جس میں حرام، تحریم، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la Enciclopedia Kuwaití de Fiqh, volumen 1, pág. 326, que menciona lo ilícito, la prohibición y lo reprobable; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador Halal y Haram lo incluye en su lista."
  fr: "Extrait de l'Encyclopédie koweïtienne de Fiqh (numérisation, volume 1, p. 326) mentionnant l'illicite, l'interdit et le déconseillé; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "Kuveyt İslam Hukuku Ansiklopedisi, Resimli Cilt 1, sayfa 326'dan, yasaklanmış, haram ve hoş görülmeyen fiilleri ele alan bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari Ensiklopedia Fiqih Islam Kuwait, Jilid 1 Bergambar, halaman 326, yang membahas perbuatan yang dilarang, diharamkan, dan tidak disukai; diambil dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
