label: { ar: "جامع الترمذي 3215 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 3215 — what was made lawful; what is not lawful", ur: "جامع ترمذی 3215 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 3215 — lo que se ha hecho lícito; lo que no es lícito" }
text: "… قَالَ ابْنُ عَبَّاسٍما نُهِيَ رَسُولُ اللَّهِ عَنْ أَصْنَافِ النِّسَاءِ إِلاَّ مَا كَانَ مِنَ الْمُؤْمِنَاتِ الْمُهَاجِرَاتِ قَالَ : ⁦( لا يَحِلُّ لَكَ النِّسَاءُ مِنْ بَعْدُ وَلاَ أَنْ تَبَدَّلَ بِهِنَّ مِنْ أَزْوَاجٍ وَلَوْ أَعْجَبَكَ حُسْنُهُنَّ إِلاَّ مَا مَلَكَتْ يَمِينُكَ )⁩ فَأَحَلَّ اللَّهُ فَتَيَاتِكُمُ الْمُؤْمِنَاتِ وَامْرَأَةً مُؤْمِنَةً إِنْ وَهَبَتْ نَفْسَهَا لِلنَّبِيِّ وَحَرَّمَ كُلَّ ذَاتِ دِينٍ غَيْرَ الإِسْلاَمِ ثُمَّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3215، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 3215 (Chapters on Tafsir), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 3215، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3215 (Capítulos sobre Tafsir), menciona lo que es lícito y lo que no lo es. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
