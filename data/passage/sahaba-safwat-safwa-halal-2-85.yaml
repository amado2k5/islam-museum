text: "صفة الصفوة ج - صدقت ثم قال يا ابراهيم معى حلال وحرام فاما الحلال فرمان من الجبل المباح واما الحرام فحيتان مررت على صيادين وها يصطادان فتخاونا فاخذت الحيانة فكل انت الحلال ودع الحرام - حامد الاسود قال كنت مع …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 2، ص 85، يذكر الحلال، والحرام، والمباح؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
