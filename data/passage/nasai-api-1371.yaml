label: { ar: "سنن النسائي 1371 — ما وجب على كل مسلم، الواجب", en: "Sunan al-Nasa'i 1371 — a duty laid on every Muslim; the obligatory (wajib)", ur: "سنن نسائی 1371 — جو ہر مسلمان پر لازم ہے، واجب", fr: "Sunan al-Nasa'i 1371 — un devoir imposé à chaque musulman ; l'obligatoire (wajib)", es: "Sunan al-Nasa'i 1371 — un deber impuesto a cada musulmán; lo obligatorio (wajib)", tr: "Sunan an-Nasa'i 1371 — Her Müslüman için farz olan, farz olan", id: "Sunan an-Nasa'i 1371 — Apa yang wajib bagi setiap Muslim, kewajiban" }
text: "أَخْبَرَنِي مَحْمُودُ بْنُ غَيْلاَنَ، قَالَ حَدَّثَنَا الْوَلِيدُ بْنُ مُسْلِمٍ، قَالَ حَدَّثَنِي الْمُفَضَّلُ بْنُ فَضَالَةَ، عَنْ عَيَّاشِ بْنِ عَبَّاسٍ، عَنْ بُكَيْرِ بْنِ الأَشَجِّ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، عَنْ حَفْصَةَ، زَوْجِ النَّبِيِّ أَنَّ النَّبِيَّ قَالَ \" رَوَاحُ الْجُمُعَةِ وَاجِبٌ عَلَى كُلِّ مُحْتَلِمٍ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 1371، يرد فيه ذكر ما وجب على كل مسلم، والواجب. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sunan al-Nasa'i, no. 1371 (The Book of Jumu'ah (Friday Prayer)), whose wording mentions a duty laid on every Muslim, the obligatory (wajib). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "سنن نسائی کی حدیث نمبر 1371، جس کے الفاظ میں جو ہر مسلمان پر لازم ہے، واجب کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sunan al-Nasa'i, n° 1371, dont le texte mentionne un devoir imposé à chaque musulman, l'obligatoire (wajib). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sunan al-Nasa'i, n.º 1371, cuyo texto menciona un deber impuesto a cada musulmán, lo obligatorio (wajib). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sunan-ı Nesai'de yer alan 1371 numaralı hadis, her Müslüman için farz olan şeyleri sıralamaktadır. Bu hadis, farz olan amelleri, itaat amellerini, müstehap amelleri, mekruh amelleri, haram amelleri ve küçük günahları, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden ilgili metinlerle birlikte ele alan bir araştırmacı tarafından derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 1371, menyebutkan apa yang wajib bagi setiap Muslim. Hadits ini disusun oleh seorang peneliti yang mencakup amalan wajib, amalan ketaatan, amalan anjuran, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
