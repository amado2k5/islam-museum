text: "ا ابن أربعين سنة، فرزق الله خيرا كثيرا. قال أبو بكر الخلال في كتاب «أخلاق أحمد)»، وهو مجلد: أملى علي زهير بن صالح بن أحد، قال: تزوج جدي عباسة بنت الفضل من العرب، فلم يولد له منها غير أبي. وتوفيت"
