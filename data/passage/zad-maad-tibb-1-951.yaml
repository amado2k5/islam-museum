text: "… الشرع، وصلةُ الرحم حتى تَعْقِلَهُ القلوب، وتُخْبِرَ به الألسنة، وتَعْمَلَ به التي أمر اللَّه أن تُوصَلَ، وحرَّمَ الجنة على كل قاطع الجوارحُ؟ أهو السلامُ عليه إذا لقيه، وعيادتُه إذا رحم، فالنفقةُ تُسْتَحَقُّ بشيئين : بالميراث بكتاب اللَّه، مرض، وتشميتُه إذا …"
