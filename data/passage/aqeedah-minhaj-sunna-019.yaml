text: "عن الموت والسنة والنوم، والعجز والجهل والحاجة، كما نزه نفسه في كتابه، فيجمع له بين إثبات صفات الكمال، ونفي النقائص المنافية للكمال، وينزه عن مماثلة شيء من المخلوقات له في شيء من صفاته، وينزه عن النقائص مطلقا، وينزه في صفات"
