label: { ar: "الموطأ 2150 — يحيى عن مالك: إذا استودع الرجل مالا فابتاع به لنفسه وربح فيه، فإن الربح له لأنه ضامن للمال حتى يؤديه إلى صاحبه", en: "Muwatta 2150", es: "Muwatta 2150", fr: "Muwatta 2150", ur: "موطا 2150", tr: "El-Muvatta 2150 — Yahya, Malik'ten rivayetle: Bir kişiye para emanet edilirse ve o kişi bu parayla kendine bir şey satın alıp kar elde ederse, bu kar kendisine aittir; çünkü parayı sahibine iade edene kadar paradan sorumludur.", id: "Al-Muwatta 2150 — Yahya berdasarkan riwayat Malik: Jika seseorang dipercayakan uang dan menggunakannya untuk membeli sesuatu untuk dirinya sendiri dan memperoleh keuntungan, maka keuntungan itu menjadi miliknya karena dia bertanggung jawab atas uang tersebut sampai dia mengembalikannya kepada pemiliknya." }
summary:
  ar: "قال يحيى: وسمعت مالكا يقول: إذا استودع الرجل مالا فابتاع به لنفسه وربح فيه، فإن ذلك الربح له، لأنه ضامن للمال حتى يؤديه إلى صاحبه. {cite:muwatta-maruf-1997 p.279}"
  tr: "Yahya şöyle dedi: Malik'in şöyle dediğini duydum: Bir adama para emanet edilirse ve o adam bu parayla kendine bir şey satın alıp kar ederse, o kar ona aittir; çünkü parayı sahibine iade edene kadar ondan sorumludur. {cite:muwatta-maruf-1997 s.279}"
  id: "Yahya berkata: Aku mendengar Malik berkata: Jika seseorang dipercayakan uang dan menggunakannya untuk membeli sesuatu untuk dirinya sendiri dan memperoleh keuntungan, maka keuntungan itu menjadi miliknya, karena dia bertanggung jawab atas uang tersebut sampai dia mengembalikannya kepada pemiliknya. {cite:muwatta-maruf-1997 p.279}"
