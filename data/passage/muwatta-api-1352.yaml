label: { ar: "موطأ مالك 1352 — ما لا بأس به، ما كُره", en: "Muwatta Malik 1352 — what is said to be no harm; what was disliked", ur: "موطأ مالک 1352 — جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا", fr: "Muwatta de Malik 1352 — ce qui est dit sans inconvénient ; ce qui fut réprouvé", es: "Muwatta de Malik 1352 — lo que se dice que no tiene inconveniente; lo que se reprobó", tr: "Muwatta Malik 1352 — Neler helaldir, nelerden mekruhtur", id: "Muwatta Malik 1352 — Apa yang diperbolehkan, apa yang tidak disukai" }
text: "… أَنْ يَشْتَرِيَ أَحَدٌ شَيْئًا مِنَ الْحَيَوَانِ بِعَيْنِهِ إِذَا كَانَ غَائِبًا عَنْهُ وَإِنْ كَانَ قَدْ رَآهُ وَرَضِيَهُ عَلَى أَنْ يَنْقُدَ ثَمَنَهُ لاَ قَرِيبًا وَلاَ بَعِيدًا. قَالَ مَالِكٌ وَإِنَّمَا كُرِهَ ذَلِكَ لأَنَّ الْبَائِعَ يَنْتَفِعُ بِالثَّمَنِ وَلاَ يُدْرَى هَلْ تُوجَدُ تِلْكَ السِّلْعَةُ عَلَى مَا رَآهَا الْمُبْتَاعُ أَمْ لاَ فَلِذَلِكَ كُرِهَ ذَلِكَ وَلاَ بَأْسَ بِهِ إِذَا كَانَ مَضْمُونًا مَوْصُوفًا."
summary:
  ar: "حديث في موطأ مالك، رقم 1352، يرد فيه ذكر ما لا بأس به، وما كُره. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Muwatta Malik, no. 1352 (Business Transactions), whose wording mentions what is said to be no harm, what was disliked. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "موطأ مالک کی حدیث نمبر 1352، جس کے الفاظ میں جس میں کوئی مضائقہ نہیں، جو ناپسند کیا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Muwatta de Malik, n° 1352, dont le texte mentionne ce qui est dit sans inconvénient, ce qui fut réprouvé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Muwatta de Malik, n.º 1352, cuyo texto menciona lo que se dice que no tiene inconveniente, lo que se reprobó. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Malik'in Muwatta'sında yer alan 1352 numaralı hadis, helal ve haram olan şeylerden bahsetmektedir. Bu hadis, farz, ibadet, sünnet, haram ve küçük günahlar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak bir fetva vermemiştir."
  id: "Sebuah hadits dalam Muwatta Malik, nomor 1352, menyebutkan apa yang diperbolehkan dan apa yang tidak disukai. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, ibadah, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tersebut tetapi tidak mengeluarkan fatwa berdasarkan teks tersebut."
