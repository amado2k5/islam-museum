text: "حَدَّثَنَا مُوسَى، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ حُصَيْنٍ، عَنْ أَبِي وَائِلٍ، قَالَ حَدَّثَنِي مَسْرُوقُ بْنُ الأَجْدَعِ، قَالَ حَدَّثَتْنِي أُمُّ رُومَانَ، وَهْىَ أُمُّ عَائِشَةَ قَالَتْ بَيْنَا أَنَا وَعَائِشَةُ أَخَذَتْهَا الْحُمَّى، فَقَالَ النَّبِيُّ \" لَعَلَّ فِي حَدِيثٍ تُحُدِّثَ \". قَالَتْ نَعَمْ وَقَعَدَتْ عَائِشَةُ قَالَتْ مَثَلِي وَمَثَلُكُمْ كَيَعْقُوبَ وَبَنِيهِ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4691، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4691 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4691، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
