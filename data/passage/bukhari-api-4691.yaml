label: { ar: "صحيح البخاري 4691 — الحمى", en: "Sahih al-Bukhari 4691 — fever", ur: "صحیح بخاری 4691 — بخار", es: "Sahih al-Bukhari 4691 - fiebre", fr: "Sahih al-Bukhari 4691 – fièvre", tr: "Sahih el-Buhari 4691 — Ateş", id: "Sahih al-Bukhari 4691 — Demam" }
text: "حَدَّثَنَا مُوسَى، حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ حُصَيْنٍ، عَنْ أَبِي وَائِلٍ، قَالَ حَدَّثَنِي مَسْرُوقُ بْنُ الأَجْدَعِ، قَالَ حَدَّثَتْنِي أُمُّ رُومَانَ، وَهْىَ أُمُّ عَائِشَةَ قَالَتْ بَيْنَا أَنَا وَعَائِشَةُ أَخَذَتْهَا الْحُمَّى، فَقَالَ النَّبِيُّ \" لَعَلَّ فِي حَدِيثٍ تُحُدِّثَ \". قَالَتْ نَعَمْ وَقَعَدَتْ عَائِشَةُ قَالَتْ مَثَلِي وَمَثَلُكُمْ كَيَعْقُوبَ وَبَنِيهِ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4691، يذكر الحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4691 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4691، جس میں بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4691 (Comentario profético del Corán (Tafsir del Profeta (pbuh))), menciona la fiebre. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4691 (Commentaire prophétique du Coran (Tafsir du Prophète)), mentionne la fièvre. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4691 numaralı hadis, ateşten bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4691, menyebutkan tentang demam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
