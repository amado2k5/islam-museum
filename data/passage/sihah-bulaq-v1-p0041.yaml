text: |-
  قوله لدى كفاح فى أسنخة بدله
  اصاب غابا
  ٦٠٠
  وكنا كااريق لدى كفاح • فيخبوساعة ويهب ساعا
  وساعة. وعاء أى شديدة كما يقال ايلة ليلاء وتقول عاملته مساوعة من الساعة كماتول
  مياومة من اليوم ولا يستعمل منهما الاهذا والساعة القيامة وجاهنا بعد سوع من الليل
  وبعد سواع أى بعد هد ممنه وسواع أيضا اسم صنم كان لقوم نوح عليه السلام ثم صار لهذيل
  وكان برهاط يحجون اليه وأسعت الابل أهلمتها فساعت هى تسوع سوعا ومنه قيسل ضائع
  سائع وناقة مسباع تذهب فى المرعى ورجل مضاع مسياع للمال وهومضبع مسبع عن أبي
  عبيد ⁦( سبع)⁩ ساع الماءوالسراب يسبع سيماوسيوعا أى جرى واضطرب على وجه
  الارض قال الراجز
  فهنّ يخبطن السراب الاسيعا والانسياع مثله والسباع الطين
  بالتين الذى يطيز به قال القطامى
  فلما أن جرى سمن عليهَا * كماطينت بالقدن السياعا
  وهومقلوب أى كماطينت بالسياع الفدن وهو القصر نقول منه سيعت الحائط والمسيعة
  المسالحة
  صل الشين بع) الشبع نقيض الموع يقال شبعت خبزاولماو من خ-بز
  ولحم شبعا وهو من مصادر الطبائع والشبع بالتسكين اسم ما أشبعك من شئ ورجل شبعان
  وامر أقشبعى وربما قالوا امراة شبعى الخلخال اذا.لا نه من تينها وتقول شبعت من هذا
  الامرودويت اذا كرهته وهماعلى الاستعارة وأشبعته من الموع وأشبعت الثوب من
  الصبغ وتوب شبيع الغزل أى كثيره والمتشبع المتزين بأكثر مما عنده يتكثريذلك ويتزين
  بالباطل وفى الحديث المتشبع بالا يملك كلابس توبى زور وعندى شبعة من طعام
  بالضم أى قدرما يشبع به مرّة قال يعقو ب هذا بلدقد شبعت غنمه اذا قاربت
  الشبع بدع بو ع روالشبادع العقارب واحد تم اشبدعة بالكسر والدال غير
  متجمة والأحر مثله ( جع لشهجاعة شدة القاب عند البأس وقد شجع الرجل بالضم فهو
  شجاع وقوم شجعة وشجعان وتظيره غلام وغلمة وغلمان ورجل شجيع وقوم شجعان مثل
  جريب وجربان وشجعاء مثل فقيه وفه(٠ وامر أة شجاعة قال أبوز يدسمعت الكلا بيبن
  يق ولون رجل شجاع ولا يوصف به الرأة والشجع فى الابل سرعة نقل القوائم قال سويد
  ابن أبى كاهل فركبناها على مجهولها • بصلاب الارض فيهنّ شبع
  أى بصلاب القوائم ية ال جمل شجع القوائم وناقة شجعة وشجعاء وحكى يعقوب عن اللحيانى
  وجل شجاع وشجاع وقوم شجعان وشجعان وقال أبو عبيدة قوم شجعة وشجعة وحكى
  أبو عبيدة قوم شجعة أيضا بالتحريك والاشجع من الرجال مثل الشجاع ويقال الذى فيه
  خفة كالهوج لقوته ويسجى به الاسد قال الشاعر
  بأشجع أخاذ على الدهر -كما
  عنى الدهر واشجيع قبيلة من غطفان وشجع قبيلة من عذرة وشجيع قبيلة من كانة والاشجع
  ضرب من الحمات وكذلك الشجاع وتزعم العرب أن الرجل اذا اشتدجوعه تعرّضت له
  فى بطنه حية يسمونها الشجاع والصفر وقال أبو خراش يخاطب امر أنه
  أرتشجاع البطن لوتعلينه • وأوثر غيرى من عيالك بالطعم
  والاشاجع
