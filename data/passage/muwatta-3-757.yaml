label: { ar: "الموطأ 757 — أسلم: ضرب عمر الجزية على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً، مع أرزاق المسلمين وضيافة ثلاثة أيام", en: "Muwatta 757" }
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر بن الخطاب، أن عمر ضرب الجزية على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً، مع ذلك أرزاق المسلمين وضيافة ثلاثة أيام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الأعلى بن مسهر عند أبي عبيد في الأموال (100) ومحمد بن الحسن الشيباني (333) ويحيى بن بكير عند أبي عبيد. {cite:muwatta-maruf-1997 p.375}"
