label: { ar: "الموطأ 757 — أسلم: ضرب عمر الجزية على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً، مع أرزاق المسلمين وضيافة ثلاثة أيام", en: "Muwatta 757", es: "Muwatta 757", fr: "Muwatta 757", ur: "موطا 757", tr: "El-Muvatta 757 — Aslam: Ömer, altın sahiplerine dört dinar, gümüş sahiplerine ise kırk dirhem cizye vergisi koydu ve Müslümanlara erzak ve üç gün boyunca misafirperverlik bahşetti.", id: "Al-Muwatta 757 — Aslam: Umar mengenakan jizya kepada kaum yang memiliki harta emas sebesar empat dinar dan kepada kaum yang memiliki harta perak sebesar empat puluh dirham, beserta rezeki bagi kaum Muslimin dan jamuan makan selama tiga hari." }
summary:
  ar: "يرويه مالك عن نافع عن أسلم مولى عمر بن الخطاب، أن عمر ضرب الجزية على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً، مع ذلك أرزاق المسلمين وضيافة ثلاثة أيام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وعبد الأعلى بن مسهر عند أبي عبيد في الأموال (100) ومحمد بن الحسن الشيباني (333) ويحيى بن بكير عند أبي عبيد. {cite:muwatta-maruf-1997 p.375}"
  tr: "Malik, Ömer ibn el-Hattab'ın azatlı kölesi Aslam'dan rivayet ettiğine göre, Ömer, Müslümanlara erzak ve üç gün misafirperverliğin yanı sıra, altın sahibi olanlardan dört dinar, gümüş sahibi olanlardan ise kırk dirhem cizye talep etmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Abdül-A'la ibn Müşir tarafından, Ebu Ubeyd'in el-Amwal'da (100), Muhammed ibn el-Hasan el-Şeybani'de (333) ve Ebu Ubeyd'in kaydettiği Yahya ibn Bukayr tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.375}"
  id: "Malik meriwayatkannya dari Nafi’ atas otoritas Aslam, budak yang dibebaskan oleh Umar ibn al-Khattab, bahwa Umar mengenakan jizya empat dinar kepada mereka yang memiliki emas dan empat puluh dirham kepada mereka yang memiliki perak, di samping rezeki bagi kaum Muslim dan jamuan makan selama tiga hari. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab dan Abd al-A’la ibn Mushir, sebagaimana dicatat oleh Abu Ubayd dalam al-Amwal (100), dan oleh Muhammad ibn al-Hasan al-Shaybani (333), dan oleh Yahya ibn Bukayr, sebagaimana dicatat oleh Abu Ubayd. {cite:muwatta-maruf-1997 p.375}"
