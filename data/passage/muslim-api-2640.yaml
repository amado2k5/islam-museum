label: { ar: "صحيح مسلم 2640 — ما فُرض على الناس، الفرض", en: "Sahih Muslim 2640 — what was made obligatory on people; the obligatory (fard)", ur: "صحیح مسلم 2640 — جو لوگوں پر فرض کیا گیا، فرض", fr: "Sahih Muslim 2640 — ce qui a été imposé aux gens ; l'obligatoire (fard)", es: "Sahih Muslim 2640 — lo que se impuso a la gente; lo obligatorio (fard)" }
text: "حَدَّثَنَا حَرْمَلَةُ بْنُ يَحْيَى، أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ عَائِشَةَ، -ا - قَالَتْ كَانَ رَسُولُ اللَّهِ يَأْمُرُ بِصِيَامِهِ قَبْلَ أَنْ يُفْرَضَ رَمَضَانُ فَلَمَّا فُرِضَ رَمَضَانُ كَانَ مَنْ شَاءَ صَامَ يَوْمَ عَاشُورَاءَ وَمَنْ شَاءَ أَفْطَرَ."
summary:
  ar: "حديث في صحيح مسلم، رقم 2640، يرد فيه ذكر ما فُرض على الناس، والفرض، وما جُعل لمن شاء. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih Muslim, no. 2640 (The Book of Fasting), whose wording mentions what was made obligatory on people, the obligatory (fard), what is left to whoever wishes. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح مسلم کی حدیث نمبر 2640، جس کے الفاظ میں جو لوگوں پر فرض کیا گیا، فرض، جو چاہنے والے کے لیے چھوڑا گیا کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih Muslim, n° 2640, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), ce qui est laissé à qui le veut. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih Muslim, n.º 2640, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo que se deja a quien quiera. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
