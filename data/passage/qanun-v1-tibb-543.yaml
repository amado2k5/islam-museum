text: "… الأمعاء وللإسهال المريء، شرباً من بزره، واحتقاناً من عصارته، ويحبس نزف البواسير، ويشرب ورقه بالطلاء لوجع المثانة والكلى الحمّيات : قيل: إنه نافع من الحمّى المثلثة يعني الغبّ. وقيل: إنه يجب أن يشرب للغبّ ثلاثة من أصوله في أربع أواق …"
