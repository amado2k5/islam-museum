  tr: "İbn Sina'nın Tıp Kanunu'nun 1. cildinin 543. sayfasından, ağrı, ateş, halsizlik, hastalık isimleri ve vücut organlarından bahseden bir bölüm; makineyle okunabilir fotokopi versiyonundan alınmıştır ve kaynak politikasına göre metin kırk kelime içinde alıntılanmıştır."
  id: "Sebuah bagian dari Kitab Kedokteran Ibnu Sina, Jilid 1, hlm. 543, yang menyebutkan rasa sakit, demam, rasa tidak enak badan, nama-nama penyakit, dan organ-organ tubuh; dari versi fotokopi yang dapat dibaca mesin, dan teks dikutip dalam empat puluh kata sesuai dengan kebijakan sumber."
