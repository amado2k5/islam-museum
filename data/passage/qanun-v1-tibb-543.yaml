  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 1, p. 543, that mentions pain, fever, fever, named diseases, the organs of the body; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج1، ص 543 کا اقتباس جس میں درد، بخار، بخار، بیماریوں کے نام، اعضائے بدن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto del Canon de Medicina de Ibn Sina, vol. 1, pág. 543, que menciona el dolor, la fiebre, las enfermedades específicas y los órganos del cuerpo; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
