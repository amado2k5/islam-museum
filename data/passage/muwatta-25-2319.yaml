label: { ar: "الموطأ 2319 — عروة وسليمان بن يسار: بنو المكاتب يسعون في كتابة أبيهم", en: "Muwatta 2319", es: "Muwatta 2319", fr: "Muwatta 2319", ur: "موطا 2319", tr: "El-Muvatta 2319 — Urve ve Süleyman ibn Yasar: Katiplerin oğulları babalarının sözleşmesini yazmak için çabalıyorlar.", id: "Al-Muwatta 2319 — Urwah dan Sulayman ibn Yasar: Putra-putra juru tulis berusaha menulis perjanjian ayah mereka" }
summary:
  ar: "بلغ مالكا أن عروة بن الزبير وسليمان بن يسار سئلا عن رجل كاتب على نفسه وعلى بنيه ثم مات: هل يسعى بنو المكاتب في كتابة أبيهم أم هم عبيد؟ فقالا: بل يسعون في كتابة أبيهم، ولا يوضع عنهم لموت أبيهم شيء. {cite:muwatta-maruf-1997 p.356} {cite:muwatta-maruf-1997 p.357}"
  tr: "Malik, Urva ibn el-Zübeyr ve Süleyman ibn Yaşar'a, kendisi ve oğulları için azat sözleşmesi yapmış ve sonra ölmüş bir adam hakkında soru sorulduğunu rivayet etmiştir: Azat edilen adamın oğulları babalarının sözleşmesini yerine getirmeye çalışmalı mıdır, yoksa köle sayılırlar mı? Onlar şöyle cevap verdiler: Aksine, babalarının sözleşmesini yerine getirmeye çalışmalıdırlar ve babalarının ölümü nedeniyle onlardan hiçbir şey muaf tutulmaz. {cite:muwatta-maruf-1997 s.356} {cite:muwatta-maruf-1997 s.357}"
  id: "Malik meriwayatkan bahwa Urwah ibn al-Zubayr dan Sulayman ibn Yasar ditanya tentang seorang pria yang telah membuat perjanjian pembebasan untuk dirinya dan putra-putranya, lalu meninggal: Haruskah putra-putra dari orang yang dibebaskan itu berusaha untuk memenuhi perjanjian ayah mereka, atau apakah mereka dianggap sebagai budak? Mereka menjawab: Sebaliknya, mereka harus berusaha untuk memenuhi perjanjian ayah mereka, dan tidak ada yang dibebaskan dari kewajiban mereka karena kematian ayah mereka. {cite:muwatta-maruf-1997 p.356} {cite:muwatta-maruf-1997 p.357}"
