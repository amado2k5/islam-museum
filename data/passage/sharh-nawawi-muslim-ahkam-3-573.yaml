text: "… القاضي: والمشهورُ من مذهب مالك أنه فرض كفاية، قال: وبه قال جماعةٌ من العلماء، كردّ السلام. ومذهبُ الشافعيِّ وأصحابه وآخرين أنه سنةٌ وأدبٌ، وليس بواجبٍ، ويجملون الحديثَ على النَّدْبِ والأدب، كقوله : حقٌّ على كلُّ مسلمِ أن يغتسلَ في كلِّ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 573، يرد فيه ذكر الفرض، وما وجب على كل مسلم، وفرض الكفاية، والواجب، وحق على كل مسلم، والمندوب، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 3, p. 573, whose wording mentions the obligatory (fard), a duty laid on every Muslim, the communal obligation (fard kifaya), the obligatory (wajib), a right due from every Muslim, the recommended (mandub), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
