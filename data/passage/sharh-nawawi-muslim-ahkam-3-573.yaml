  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 3, p. 573, dont le texte mentionne l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya), l'obligatoire (wajib), un droit dû par chaque musulman, le recommandé (mandub), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
