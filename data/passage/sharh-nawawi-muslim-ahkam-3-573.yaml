text: "… القاضي: والمشهورُ من مذهب مالك أنه فرض كفاية، قال: وبه قال جماعةٌ من العلماء، كردّ السلام. ومذهبُ الشافعيِّ وأصحابه وآخرين أنه سنةٌ وأدبٌ، وليس بواجبٍ، ويجملون الحديثَ على النَّدْبِ والأدب، كقوله : حقٌّ على كلُّ مسلمِ أن يغتسلَ في كلِّ …"
summary:
  ar: "مقطع من شرح النووي على صحيح مسلم، المجلد المصوَّر 3، ص 573، يرد فيه ذكر الفرض، وما وجب على كل مسلم، وفرض الكفاية، والواجب، وحق على كل مسلم، والمندوب، وما ليس بواجب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's commentary on Sahih Muslim, scan volume 3, p. 573, whose wording mentions the obligatory (fard), a duty laid on every Muslim, the communal obligation (fard kifaya), the obligatory (wajib), a right due from every Muslim, the recommended (mandub), what is said not to be obligatory, recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح نووی بر صحیح مسلم، اسکین جلد 3، ص 573 کا اقتباس جس میں فرض، جو ہر مسلمان پر لازم ہے، فرضِ کفایہ، واجب، ہر مسلمان پر حق، مندوب، جو واجب نہیں، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de commentary on Sahih Muslim de al-Nawawi, volume numérisé 3, p. 573, dont le texte mentionne l'obligatoire (fard), un devoir imposé à chaque musulman, l'obligation collective (fard kifaya), l'obligatoire (wajib), un droit dû par chaque musulman, le recommandé (mandub), ce qui est dit non obligatoire, la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de commentary on Sahih Muslim de al-Nawawi, volumen digitalizado 3, p. 573, cuyo texto menciona lo obligatorio (fard), un deber impuesto a cada musulmán, la obligación colectiva (fard kifaya), lo obligatorio (wajib), un derecho debido por cada musulmán, lo recomendado (mandub), lo que se dice que no es obligatorio, la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Nevevi'nin Sahih Müslim tefsirinin 3. cildinin 573. sayfasından bir alıntı, farz olan amelleri, her Müslümanın üzerine düşen görevleri, toplumsal yükümlülükleri, görevleri, her Müslümanın haklarını, tavsiye edilen amelleri, farz olmayan amelleri ve tavsiye edilen amelleri ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh amelleri, haram amelleri ve küçük günahları konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Al-Nawawi tentang Sahih Muslim, Jilid 3, halaman 573, membahas tentang amalan wajib, kewajiban setiap Muslim, kewajiban bersama, tugas, hak setiap Muslim, amalan yang dianjurkan, amalan yang tidak wajib, dan amalan yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban yang khusus untuk amalan wajib, tugas, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
