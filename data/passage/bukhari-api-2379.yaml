label: { ar: "صحيح البخاري 2379 — الأب والأبوة", en: "Sahih al-Bukhari 2379 — the father and fatherhood", ur: "صحیح بخاری 2379 — باپ اور والدیت", es: "Sahih al-Bukhari 2379 — El padre y la paternidad", fr: "Sahih al-Bukhari 2379 — le père et la paternité" }
text: "أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنِي ابْنُ شِهَابٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" مَنِ ابْتَاعَ نَخْلاً بَعْدَ أَنْ تُؤَبَّرَ فَثَمَرَتُهَا لِلْبَائِعِ، إِلاَّ أَنْ يَشْتَرِطَ الْمُبْتَاعُ، وَمَنِ ابْتَاعَ عَبْدًا وَلَهُ مَالٌ فَمَالُهُ لِلَّذِي بَاعَهُ إِلاَّ أَنْ يَشْتَرِطَ الْمُبْتَاعُ \". وَعَنْ مَالِكٍ عَنْ نَافِعٍ عَنِ ابْنِ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 2379، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2379 (Distribution of Water), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2379، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 2379 (Distribución del Agua), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 2379 (La distribution de l'eau), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
