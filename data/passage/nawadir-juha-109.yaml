text: "… والعياذُ بِاللهِ لو كنْتُ لابسَه كان قميصُه منشوراً على الحبل فهبَّتِ الريحُ وألقَتْهُ. فقال لنفسه: يلزمُنا أَنْ نذبَحَ قُرباناً. فسألتْهُ امرأتُهُ؟ ولماذا؟ فقال: والعياذ باللَّه لو كنت لابسه!. لو ساروا كلهم لجهة واحدة لوقعت الأرض قالوا له يوماً : نرى …"
summary:
  ar: "طارت قميص جحا عن حبل الغسيل، فعزم أن يذبح أضحية، ولما قيل له إن القميص هو القربان قال معاذ الله لو كنت لابسه. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  en: "Juha's shirt blows off the washing line; he resolves to sacrifice a victim; told the shirt was the offering, he says God forbid, had he been wearing it. {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  ur: "جحا کی قمیص دھلے کپڑوں کی رسی سے اڑ گئی؛ اس نے قربانی کرنے کا ارادہ کیا؛ جب اسے بتایا گیا کہ قمیص ہی نذر تھی تو اس نے کہا کہ خدا نہ کرے، اگر میں اسے پہنے ہوتا۔ {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  fr: "La chemise de Juha s'envole de la corde à linge ; il décide de faire un sacrifice ; quand on lui dit que la chemise était l'offrande, il répond : «Dieu m'en garde, si je l'avais portée». {cite:juha-nawadir-kubra-djuwaydi p. 53}"
  es: "La camisa de Juha sale volando del tendedero; decide hacer un sacrificio; cuando le dicen que la camisa fue la ofrenda, dice: «Dios no lo quiera, si la hubiera llevado puesta». {cite:juha-nawadir-kubra-djuwaydi p. 53}"
