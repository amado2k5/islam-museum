summary:
  ar: "حدثني يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وأبي سلمة بن عبد الرحمن عن أبي هريرة أن رسول الله قال: جرح العجماء جبار، والبئر جبار، والمعدن جبار، وفي الركاز الخمس. قال مالك: وتفسير الجبار أنه لا دية فيه. {cite:muwatta-maruf-1997 p.441}"
