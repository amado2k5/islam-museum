label: { ar: "الموطأ 2541 — أبو هريرة: جرح العجماء جبار والبئر والمعدن جبار وفي الركاز الخمس", en: "Muwatta 2541", es: "Muwatta 2541", fr: "Muwatta 2541", ur: "موطا 2541", tr: "El-Muvatta 2541 — Ebu Hurayra: Hayvanın verdiği zarar cezalandırılmaz, kuyu ve maden de cezalandırılmaz, gömülü hazinede ise beşte bir vergi alınır." }
summary:
  ar: "حدثني يحيى عن مالك عن ابن شهاب عن سعيد بن المسيب وأبي سلمة بن عبد الرحمن عن أبي هريرة أن رسول الله قال: جرح العجماء جبار، والبئر جبار، والمعدن جبار، وفي الركاز الخمس. قال مالك: وتفسير الجبار أنه لا دية فيه. {cite:muwatta-maruf-1997 p.441}"
  tr: "Yahya, Malik'ten, o da İbn Şihab'tan, o da Sa'id ibn el-Musayyab ve Ebu Seleme ibn Abd el-Rahman'dan, o da Ebu Hurayra'dan rivayetle bana şöyle nakletmiştir: \"Bir hayvanın yaralanması tazminata tabi değildir, bir kuyu tazminata tabi değildir, bir maden tazminata tabi değildir ve gömülü hazinede beşte biri ödenir.\" Malik şöyle dedi: \"'Tazminata tabi değildir' ifadesinin yorumu, bunun için kan parası ödenmesi gerekmediğidir.\" {cite:muwatta-maruf-1997 s.441}"
  id: "Yahya meriwayatkan kepadaku dari Malik, dari Ibn Shihab, dari Sa'id ibn al-Musayyab dan Abu Salamah ibn Abd al-Rahman, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: \"Luka pada hewan tidak dikenakan ganti rugi, sumur tidak dikenakan ganti rugi, tambang tidak dikenakan ganti rugi, dan harta karun yang terkubur, seperlima yang harus dibayar.\" Malik berkata: \"Penafsiran dari 'tidak dikenakan ganti rugi' adalah bahwa tidak ada uang darah yang harus dibayar untuk itu.\" {cite:muwatta-maruf-1997 p.441}"
