text: "مقدمة التحقيق : الأوامرِ من هذا الكتابِ ما لم يقُم دليلٌ علىٰ خروجه من باب الوجوبِ إلىٰ بابِ الندبِ، أو سائرِ وجوه الأوامرِ، وحكمُ فعلِه عليه الائتساءُ به فيه، وليسَ واجبًا، إلا أن يكون تنفيذًا لحكمٍ أو بيانًا لأمرٍ علىٰ …"
summary:
  ar: "مقطع من المحلى لابن حزم، الجزء الأول، ص 109، يرد فيه ذكر الواجب، والوجوب، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Hazm's al-Muhalla, vol. 1, p. 109, whose wording mentions the obligatory (wajib), obligation (wujub), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المحلیٰ، ابن حزم، جلد 1، ص 109 کا اقتباس جس میں واجب، وجوب، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Muhalla, vol. 1 de Ibn Hazm, p. 109, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
