label: { ar: "الموطأ 1428 — زيد بن أسلم عن سعد الجاري: سأل ابن عمر عن الحيتان يقتل بعضها بعضا، فقال ليس بها بأس، وكذلك قال ابن عمرو بن العاص", en: "Muwatta 1428" }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن سعد الجاري مولى عمر بن الخطاب أنه قال سألت عبد الله بن عمر عن الحيتان يقتل بعضها بعضا، أو تموت صردا، فقال ليس بها بأس. قال سعد ثم سألت عبد الله بن عمرو بن العاص، فقال مثل ذلك. {cite:muwatta-maruf-1997 p.639}"
