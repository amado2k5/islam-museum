label: { ar: "الموطأ 1428 — زيد بن أسلم عن سعد الجاري: سأل ابن عمر عن الحيتان يقتل بعضها بعضا، فقال ليس بها بأس، وكذلك قال ابن عمرو بن العاص", en: "Muwatta 1428", es: "Muwatta 1428", fr: "Muwatta 1428", ur: "موطا 1428", tr: "El-Muvatta 1428 — Zeyd ibn Aslam, Sa'd el-Ceri'den rivayetle: İbn Ömer'e balinaların birbirini öldürmesi soruldu ve o da bunun bir sakıncası olmadığını söyledi. İbn Amr ibn el-As da aynı şeyi söyledi.", id: "Al-Muwatta 1428 — Zayd ibn Aslam berdasarkan riwayat Sa`d al-Jari: Ibn Umar ditanya tentang paus yang saling membunuh, dan beliau berkata tidak ada yang salah dengan itu. Ibn Amr ibn al-As mengatakan hal yang sama." }
summary:
  ar: "يروي مالك عن زيد بن أسلم عن سعد الجاري مولى عمر بن الخطاب أنه قال سألت عبد الله بن عمر عن الحيتان يقتل بعضها بعضا، أو تموت صردا، فقال ليس بها بأس. قال سعد ثم سألت عبد الله بن عمرو بن العاص، فقال مثل ذلك. {cite:muwatta-maruf-1997 p.639}"
  tr: "Malik, Zeyd ibn Aslam'dan, o da Ömer ibn el-Hattab'ın azatlı kölesi Sa'd el-Ceri'den rivayetle şöyle aktarır: Abdullah ibn Ömer'e birbirini öldüren veya aniden ölen balıklar hakkında sordum ve o şöyle dedi: Bunda bir sakınca yok. Sa'd dedi ki: Sonra Abdullah ibn Amr ibn el-As'a sordum ve o da aynı şeyi söyledi. {cite:muwatta-maruf-1997 s.639}"
  id: "Malik meriwayatkan dari Zayd ibn Aslam, dari Sa'd al-Jari, budak yang dibebaskan oleh Umar ibn al-Khattab, bahwa ia berkata: Saya bertanya kepada Abdullah ibn Umar tentang ikan yang saling membunuh, atau mati tiba-tiba, dan dia berkata: Tidak ada yang salah dengan itu. Sa'd berkata: Kemudian saya bertanya kepada Abdullah ibn Amr ibn al-As, dan dia mengatakan hal yang sama. {cite:muwatta-maruf-1997 p.639}"
