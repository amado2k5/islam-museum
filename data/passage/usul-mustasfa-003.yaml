text: "من الفقهاء ، ومنهم من نقله عن الشافعي (١). وقد صرح الشافعي في كتاب (أحكام القرآن): بتردد الأمر بين الندب والوجوب، وقال: النهي على التحريم. فقال: إنما أوجبنا تزويج الأيم لقوله تعالى: (فلا تعضلوهن)(٢) وقال: «لم يتبين لي وجوب إنكاح"
