text: "… لا يتم لنا أمر نأخذ فيه نحن عند محمد بن اسلم مثل. السراق قال أبو عبد اللّٰه وكت إلى أحمد بن نصر أن اكتب إلى بحال عمد بن اسلم فانه ركن من اركان الاسلام. قال وأخبرنى محمد ين مطرف وكان …"
summary:
