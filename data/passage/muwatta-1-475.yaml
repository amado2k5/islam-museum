label: { ar: "الموطأ 475 — اللهم لا تجعل قبري وثناً يعبد", en: "Muwatta 475" }
text: "اللهم لا تجعل قبري وثناً يعبد، اشتد غضب الله على قوم اتخذوا قبور أنبيائهم مساجد"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، في باب جامع الصلاة: دعا النبي ألا يُجعل قبره وثناً يُعبد، وأخبر أن غضب الله اشتد على قوم اتخذوا قبور أنبيائهم مساجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومعن بن عيسى عند ابن سعد، وينقل عن ابن عبد البر أنه لا خلاف عن مالك في إرساله وأنه حديث غريب، وأن البزار زعم أن عمر بن محمد أسنده عن أبي سعيد الخدري فعدّه ابن عبد البر صحيحاً عند من قال بالمرسل والمسند (التمهيد 5/41–42)؛ ويرى المحقق أن كلام ابن عبد البر بُني على وهم، فالبزار أخرجه من طريق عمر بن محمد بن صهبان الضعيف لا عمر بن محمد بن زيد الثقة، وأن معمراً تابع مالكاً على إرساله، وأن عبارة الدعاء جاءت من حديث أبي هريرة بإسناد حسن عند الحميدي وأحمد (2/246)؛ وأما قوله إن الله لعن من اتخذ قبور أنبيائهم مساجد فمحفوظ من طرق كثيرة صحاح كما قال البزار. {cite:muwatta-maruf-1997 p.243} {cite:muwatta-maruf-1997 p.244}"
