text: "اللهم لا تجعل قبري وثناً يعبد، اشتد غضب الله على قوم اتخذوا قبور أنبيائهم مساجد"
summary:
  ar: "يرويه مالك عن زيد بن أسلم عن عطاء بن يسار مرسلاً، في باب جامع الصلاة: دعا النبي ألا يُجعل قبره وثناً يُعبد، وأخبر أن غضب الله اشتد على قوم اتخذوا قبور أنبيائهم مساجد. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ومعن بن عيسى عند ابن سعد، وينقل عن ابن عبد البر أنه لا خلاف عن مالك في إرساله وأنه حديث غريب، وأن البزار زعم أن عمر بن محمد أسنده عن أبي سعيد الخدري فعدّه ابن عبد البر صحيحاً عند من قال بالمرسل والمسند ⁦(التمهيد 5/41–42)⁩؛ ويرى المحقق أن كلام ابن عبد البر بُني على وهم، فالبزار أخرجه من طريق عمر بن محمد بن صهبان الضعيف لا عمر بن محمد بن زيد الثقة، وأن معمراً تابع مالكاً على إرساله، وأن عبارة الدعاء جاءت من حديث أبي هريرة بإسناد حسن عند الحميدي وأحمد (2/246)؛ وأما قوله إن الله لعن من اتخذ قبور أنبيائهم مساجد فمحفوظ من طرق كثيرة صحاح كما قال البزار. {cite:muwatta-maruf-1997 p.243} {cite:muwatta-maruf-1997 p.244}"
  tr: "Malik, Zayd ibn Aslam'dan, o da Ata ibn Yasar'dan rivayetle, tam namaz bölümünde mursal bir hadiste şöyle nakletmiştir: Peygamberimiz, kabrinin putlaştırılmaması için dua etmiş ve bize, peygamberlerinin kabirlerini ibadet yeri edinen bir kavme Allah'ın gazabının şiddetli olduğunu bildirmiştir. Araştırmacı, İbn Sa'd'ın derlemesinde Ebu Musab, Suveyd ve Ma'n ibn İsa'nın bunu Malik'ten naklettiğini belirtmekte ve İbn Abd al-Barr'ın, Malik'in rivayetinde mursal statüsü konusunda ihtilaf bulunmadığını ve bunun garib bir hadis olduğunu söylediğini aktarmaktadır. Ayrıca, el-Bazzar'ın Ömer ibn Muhammed'in bunu Ebu Sa'id el-Hudri'den bir isnad zinciriyle naklettiğini iddia ettiğini, dolayısıyla İbn Abd al-Barr'ın bunu mursal ve musned hadisleri kabul edenlere göre sahih saydığını belirtmektedir (el-Tamhid 5/41-42). Ancak araştırmacı, İbn Abdülbarr'ın ifadesinin bir hataya dayandığına inanmaktadır; zira el-Bazzar bunu güvenilir Ömer ibn Muhammed ibn Zeyd'den değil, zayıf Ömer ibn Muhammed ibn Sahban'dan rivayet etmiştir ve Ma'mar, mursal statüsünde Malik'i takip etmiştir ve duanın sözleri, el-Humeydi ve Ahmed'in derlemelerinde hasen bir isnad zinciriyle Ebu Hurayra'nın hadisinden gelmektedir (2/246). Peygamberlerinin kabirlerini ibadet yeri olarak kullananları Allah'ın lanetlediğine dair ifadesine gelince, el-Bazzar'ın belirttiği gibi, bu birçok sahih isnad zinciriyle korunmuştur. {cite:muwatta-maruf-1997 s.243} {cite:muwatta-maruf-1997 s.244}"
  id: "Malik meriwayatkan hadits ini dari Zayd ibn Aslam, yang juga meriwayatkannya dari Ata ibn Yasar, dalam hadits mursal, dalam surah tentang shalat lengkap: Nabi berdoa agar kuburnya tidak dijadikan berhala untuk disembah, dan beliau memberitahukan kepada kita bahwa murka Allah sangat besar kepada kaum yang menjadikan kubur para nabi mereka sebagai tempat ibadah. Peneliti menyebutkan bahwa Abu Musab, Suwayd, dan Ma'n ibn Isa meriwayatkannya dari Malik dalam kumpulan hadits Ibn Sa'd, dan ia mengutip Ibn Abd al-Barr yang mengatakan bahwa tidak ada perbedaan pendapat mengenai otoritas Malik terkait status mursalnya dan bahwa hadits ini adalah hadits gharib, dan bahwa al-Bazzar mengklaim bahwa Umar ibn Muhammad meriwayatkannya dengan sanad dari Abu Sa'id al-Khudri, sehingga Ibn Abd al-Barr menganggapnya sahih menurut mereka yang menerima hadits mursal dan musnad (al-Tamhid 5/41-42); Namun, peneliti tersebut meyakini bahwa pernyataan Ibnu Abd al-Barr didasarkan pada kesalahan, karena al-Bazzar meriwayatkannya melalui Umar bin Muhammad bin Sahban yang lemah, bukan Umar bin Muhammad bin Zayd yang terpercaya, dan bahwa Ma'mar mengikuti Malik dalam status mursalnya, dan bahwa redaksi doa tersebut berasal dari hadits Abu Hurayrah dengan sanad hasan dalam kumpulan hadits al-Humaydi dan Ahmad (2/246). Adapun pernyataannya bahwa Allah melaknat orang-orang yang menjadikan kuburan para nabi mereka sebagai tempat ibadah, hal itu terpelihara melalui banyak sanad yang sahih, sebagaimana dinyatakan oleh Al-Bazzar. {cite:muwatta-maruf-1997 p.243} {cite:muwatta-maruf-1997 p.244}"
