text: "… إلى مصر مراراً، ودخل بلاد الروم، وسافر مع تيمورلنك إلى ما وراء النهر. ثم رحل إلى شيراز فولي قضاءها. ومات فيها. نسبته إلى جزيرة ابن عمر. من كتبه النشر في القراآت العشر، و غاية النهاية في طبقات القراء اختصره من …"
summary:
  ar: "مقطع من سبل الهدى والرشاد للصالحي، المجلد المصوَّر 1، ص 366، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Salihi's Subul al-Huda wa-l-Rashad, scan volume 1, p. 366, that mentions the readings of the Qur'an, the readers; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "سبل الہدیٰ والرشاد، صالحی، اسکین جلد 1، ص 366 کا اقتباس جس میں قرآن کی قراءتیں، قراء کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra de al-Salihi, Subul al-Huda wa-l-Rashad, volumen 1, pág. 366, que menciona las lecturas del Corán y sus lectores; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
  fr: "Un extrait du Subul al-Huda wa-l-Rashad d'al-Salihi, volume 1, page 366, mentionne les lectures du Coran et les lecteurs; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à la transcription du Coran."
  tr: "Al-Salihi'nin \"Subul al-Huda wa al-Rashad\" adlı eserinin 1. cildinin 366. sayfasından, Kur'an okunuşları ve okuyucularından bahseden bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritik konularında uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Salihi, \"Subul al-Huda wa al-Rashad,\" Jilid 1, halaman 366, yang menyebutkan bacaan dan para qari Al-Quran; diambil dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut disarikan dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
