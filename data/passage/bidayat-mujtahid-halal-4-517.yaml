text: "… دم الحيوان المذكى، أعني أنه الذي يسيل عند التذكية من الحيوان الحلال الأكل. وأما أكل دم يسيل من الحيوان الحي فقليله وكثيره حرام؛ وكذلك الدم من الحيوان المحرم الأكل، وإن ذكي فقليله وكثيره حرام، ولا خلاف في هذا. وأما سبب …"
