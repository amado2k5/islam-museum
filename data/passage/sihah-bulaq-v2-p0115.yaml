text: |-
  قوله ودحبة بالكسر فى القاموس
  جوازقهه ا
  ٤٧٢
  .د),
  وأخى عله الدهرأى أتى عله وأهدكه ومنه قول النابغة
  أضحت خلا وأضحى أهلها احتملوا • أخنى عليها الذى أخنى عسلى ابسد
  وأخنيت عليه أفسدت وى خوت النيوم تخوى خيا أعملت وذلك اذاسقطت
  ولم تطر فى نونها وأخوت مثله وخوت الدارخواءع دود أقوت وكذلك اذاسقطت ومن
  قوله تعالى فبتلك بيوته م خاوية أى خالية وية ال ساقطة كما قال تعالى فهى خاوية على عروشها
  أى ساقطة على سقوفها وخوت المرأة وخويت أيضاخوى أى خلاجونها عند الولادة
  وخوّيت اه اتخوية اذاعملت لها خوية تأكاما وهى طعام والحوى البطن السهل من
  الارضء-لى فعيل وحكى أبو عبيد الحواة الصوت وخوى البعير تخوية اذا جافى بطنسه عن
  الارض فى بروكه وكذلك الرجل فى سيجوده والطائراذا أرسل جناحيه ويقال أيضاخوت
  الجوم اذا مالت الامغيب
  صل الدل أى الدأى من البعير الموضع الذى تقع عليه ظلفة الرحل فتعره
  ومنه قيل للغراب ابن دأية وقال يصف الشيب
  ولمارأيت النسر عزابن دأية • وعشش فى وكريه باشت له نفسى
  ويجمع على دأيات بالنعر يك وجمع الدأى دئمثل ضأن وضئين ومعز ومعيز قال الراحز
  يعض منها الظلف الدتبا • عض امثقاف الحرص اللخطيا
  أبوز يددأيت للشئ أدأى له دأيا اذا ختلته مثل أدوت له ودأوث له لغة فى دأيت يقال الذئب
  يدأى للغزال! أخذه أى يختله مثل يأدو بى الدى الجراد قبل أن يطير الواحدة
  دياة قال الراجز كأتخوق قرطها المعقوب • على دباة أو على يعسوب
  وأرض مديية عسلى مفعولة اذا أكل الدبى نباتها و أدبى الرمت اذا أشبه ما يخرج من وره
  الدبي وه وحينة ذيصلح أن يرعى ويؤ كل وأرض مدبية ومدياة كثيرة الدبى والدتاء على وزن
  المحكاء الفرع الواحدة دباءة قال امر والقيس
  وان أدبرت قلت دباءة • من الخضر مفهوسة فى الغدر
  أ ابن الاعرابي جاءفلان بدبى دبى اذاجاء بمال كالدبى فى الكثرة ⁦(دبا)⁩ الدجى الظلمة يقال ؟
  دجا الليل يدجود جوًا وليلة داجية وكذا أدحى الليل وتدبى ودياجى الليل حنادسه كانه جمع
  ديجاة قال الاصمعى دجا الليل افاهو ألبس سكل شئ وايس هو من الظلمة قال ومنه
  قواهسم دجا الاسلام أى قوى وألبس كل شئ والدجى جمع دجية بالضم" وهى قترة الصائد
  والظلمة أيضاوانه افى عيش داج كانه يراد به الحفض والمداحاة المداراة بقال داجبته اذا
  داريته كانك ساترته العداوة قال قعذب ابن أتمّ صاحب
  كل يداجى ء-لى البغضاء داحبه • وإن أعالنهم الابماء لنوا
  وذكرأبو عمروأن المداجاة أيضا المنع بين الثدة والارناء ⁦(دحا)⁩ دحوت الشئدحوا
  بسطته قال اللّٰه تعالى والارض بعد ذلك دحاها أى بسطهاودما المعر الحصى عن وجه الارض
  ويقال للاعب بالجوزأ بعد المدى وادحه أى ارمه ويقال للفرس مرّيد حود حواوذلك اذا
  رى بيديه رميالأيردع-نبكه عن الارض كثيراودحية بالكسر هو د حية بن خليفة ال-كابى"
