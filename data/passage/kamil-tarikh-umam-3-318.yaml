text: "… تبع بلاد الفرس والروم والصين وغيرها كان بعد قتل قباذ، بعني أيام ابنه أنوشروان ولا خلاف أن مولد النبي عليه كان في زمن أنوشروان، وكان ملكه سبعا وأربعين سنة. ولا خلاف أيضًا أن الحبشة لما ملكت اليمن انقرضت ملوك حمير …"
summary:
  ar: "مقطع من الكامل في التاريخ لابن الأثير، المجلد المصوَّر 3، ص 318، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn al-Athir's al-Kamil fi al-Tarikh, scan volume 3, p. 318, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
