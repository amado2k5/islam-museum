label:
  ar: "مسلم 2241b — نبي قرصته نملة: فهلا نملة واحدة"
  en: "Muslim 2241b — A prophet stung by an ant: why not just the one ant"
  ur: "مسلم 2241b — ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں"
  es: "Muslim 2241b — Un profeta picado por una hormiga: ¿por qué no solo una hormiga?"
  fr: "Muslim 2241b — Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ?"
  tr: "Müslim 2241b — Bir peygamberi bir karınca ısırdı: Neden sadece bir karınca değil?"
  id: "Muslim 2241b — Seorang nabi digigit semut: Mengapa bukan hanya satu semut?"
text: "نزل نبي من الأنبياء تحت شجرة فلدغته نملة فأمر بجهازه فأخرج من تحتها ثم أمر بها فأحرقت فأوحى الله إليه فهلا نملة واحدة ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2241b: نبي قرصته نملة: فهلا نملة واحدة. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2241b: A prophet stung by an ant: why not just the one ant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2241b: ایک نبی جسے چیونٹی نے کاٹا: صرف ایک چیونٹی کیوں نہیں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
  es: "Un hadiz qudsi en Sahih Muslim, n.° 2241b: Un profeta picado por una hormiga: ¿por qué no solo una hormiga? El Profeta lo relata de su Señor; el Navegador de Hadiz Qudsi reúne sus narraciones en los seis libros y el Muwatta."
  fr: "Un hadith qudsi du Sahih Muslim n° 2241b: Un prophète piqué par une fourmi: pourquoi pas une seule fourmi ? Le Prophète le rapporte de son Seigneur; le navigateur de hadiths qudsi rassemble ces narrations issues des six livres et de la Muwatta."
  tr: "Sahih Muslim'de 2241b numaralı hadis-i kudsi şöyledir: Bir peygamberi bir karınca soktu: \"Neden sadece bir karınca değil?\" Peygamber bunu Rabbinden rivayet etmiş ve hadis-i kudsi, bu rivayetleri altı şeriat hadis külliyatında ve Muvatta'da derlemiştir."
  id: "Sebuah hadits qudsi dalam Sahih Muslim, no. 2241b: Seorang Nabi disengat semut: \"Mengapa bukan hanya satu semut?\" Nabi meriwayatkan hal ini dari Tuhannya, dan hadits qudsi mengumpulkan riwayat-riwayatnya dalam enam koleksi hadits kanonik dan Al-Muwatta."
