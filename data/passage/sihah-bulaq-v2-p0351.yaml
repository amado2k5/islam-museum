text: |-
  ١ ف نسحخة أول البيت
  منتبه الاعلام لماع الطفق
  ٢٣٦
  ورثتم قناة االك غير كلالة • عن ابنى مناف عبد شمس وهاشم
  قال ابن الاعرابى المكلالة بنو العم الاباعدو --كى عن أء-رابت انه قال مالى كثير ويراف
  كلالة متراخ نسبهم ويقال هو مصدر-ن تكالد النسب أى تطرّفه كانه أخقطرفيه من جهة
  الوالد والولد وليس له منهما أ-دفسى بالمصدر والعرب تقول هوابن عمّ الكلالة وابن عتم
  كاالة اذالم يكن لحاوكان رجلامن العشيرة وكلات من المشى أكل كلا لا وكلالة أى أعييت
  وكذلات البعيراذا أعيا وكل السسيف والريح والطرف واللسان يكل كلا وكلة وكلالة وكاولا
  وسيف كليل الحدورجل كليل اللسان وكليل الطرف وناس يجعلون كلا" البصرة اسما من كلّ
  على فعلاء ولا يصرفونه والمعن أنه موضع تكلّ الريح فيه عن عملها فى غير هذا الموضع قال رؤية
  ١ يكل وفد الريح من حيث انخرق * والكلة السترالقيق يخاط كالبيت يتوقى فيه من
  البق وكلّ لفظه واحد ومعنامجع فعلى هذا تقول كل حضر وكل حضر واعلى اللفظ حرة وعلى
  المعى أخرى وكل وبعض معرفتان ولم يجى عن العرب بالالف واللام وهو جائزلانّ فيهما
  معنى الاضافة أضفت أولم نضف والاكليل شبه عصابة تزين بالجوهر ويسمى التاج اكابلا
  والاكايل منزل من منازل القمر وهو أربعة أتجم مصطفة والا كايل السهاب الذى تراه كان
  غشاء ألبسه واكليل الملك نيت يتداوى به والكاكل والكلسكال الصدر ورياياء فى ضرورة
  الشعر مشددا وقال
  كان مهوا ها على الكاكل • موضع كفى راهب يصلى
  ورجل كاكل بالضم وكلا كل أيضا أى قسير غليظ مع شدة وأكلّ الرجل بعيره أى أعياه
  وأكلّ الرجل أيضا أى كلّ بعبره وأصبحت مكلا أى ذاقرابات وهم على عيال وسحاب
  مكال أى ملع بالبرقوية ال هو الذى -وله قطع من السصاب فهو مكال بهنّ واكتلّ الغوام
  بالبرق أى أع وكاله أى ألبسه الاكايل وروضمكالة أى حفت بالنور والمكال الهاد يقال
  حل فكال أى مضى قد ماولم يجم وأنتد الامعى
  رقديكون كال من جين تال حل ا كال أفا كذب والأبين كاة الضداد وأنش
  أبوزيد لجهم برسبل
  ولا أكال عن حرب مجلهة • ولا أخدّر الملقين باكسلم
  وانكلّ الرجل انكلالا تبسم قال الاعشى
  وتنكل عن غزهذاب كانها * جف أقموان نبته متناعم
  يقال كشر وافتر وانكل" كل ذلك تبدومنه الاسنان وانكلال الغيم بالبرق هوقدر مايريك
  سواد الغيم من بياضه ⁦( كمل)⁩ الكمال التمام وفيه ثلاث لغات كمل وكل وكمل والكسر
  أردوها وت-كامل وأكمكته أنا ورجل كامل وقوم كلة مثل حافد وحفدة ويقال أعطه هذا
  المال كلا أى كا، وكامل اسم فرس زيد ائفيل والتكميل والاكال الاتمام واستكمله استتمه
  وقول حيد -تى اذا ماحاجب الشهرديج • تذكر البيض بكملول فلج
  من توّن السكملول قال * ومقازة وفلج يريدلج فى السيم واغماترك التشديد للقافية وقال الخديل
  الجكملول
