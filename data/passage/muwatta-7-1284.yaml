label: { ar: "الموطأ 1284 — أبو هريرة عن النبي: تكفل الله لمن جاهد في سبيله بالجنة أو الرد إلى مسكنه مع الأجر أو الغنيمة", en: "Muwatta 1284", es: "Muwatta 1284", fr: "Muwatta 1284", ur: "موطا 1284", tr: "El-Muvatta 1284 — Ebu Hurayra, Peygamber'den rivayetle: Allah, kendi yolunda mücadele eden herkese cenneti veya savaş ganimetiyle birlikte yurtlarına dönüşü garanti etmiştir.", id: "Al-Muwatta 1284 — Abu Hurairah berdasarkan riwayat Nabi: Allah telah menjamin surga bagi siapa pun yang berjuang di jalan-Nya, atau kembali ke rumahnya dengan pahala atau rampasan perang." }
text: "تكفَّلَ اللهُ لمن جاهدَ في سَبِيلِهِ لا يُخْرجهُ من بَيْتِهِ إلا الجهادُ في سَبِيلهِ وَتَصْديقُ كَلِماتهِ"
summary:
  ar: "يروي مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله قال تكفل الله لمن جاهد في سبيله، لا يخرجه من بيته إلا الجهاد في سبيله وتصديق كلماته، أن يدخله الجنة، أو يرده إلى مسكنه الذي خرج منه، مع ما نال من أجر أو غنيمة. {cite:muwatta-maruf-1997 p.571}"
  tr: "Malik, Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Allah, kim kendi yolunda çaba gösterirse ve onu evinden ayrılmaya zorlayan tek şey kendi yolunda çaba göstermek ve O'nun sözüne iman etmekse, cennete gireceğini veya elde ettiği tüm ödül ve ganimetlerle birlikte ayrıldığı eve geri döneceğini garanti etmiştir.\" {cite:muwatta-maruf-1997 s.571}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah SAW bersabda: Allah telah menjamin bahwa siapa pun yang berjuang di jalan-Nya, dan tidak ada sesuatu pun yang memaksanya untuk meninggalkan rumahnya kecuali berjuang di jalan-Nya dan beriman kepada firman-Nya, maka ia akan masuk surga, atau kembali ke tempat tinggal yang ditinggalkannya, beserta segala pahala atau harta yang telah diperolehnya. {cite:muwatta-maruf-1997 p.571}"
