text: "… أرى أنيساً دخلوا ثم خرجوا حرّموا ثم استحلّوا عرفوا ثم أنكروا وإنما دين أحدهم لعقه على لسانه ولو سألته هل يؤمن بيوم الحساب، لقال: نعم، كذب ومالك يوم الدين ما هذه من أخلاق المؤمنين، إن من أخلاق المؤمنين قوة في …"
summary:
  ar: "مقطع من الإبانة الكبرى لابن بطة، كتاب الإيمان، المجلد المصوَّر 1، ص 666، يذكر خصال المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Batta's al-Ibana al-Kubra, the Book of Faith, scan volume 1, p. 666, that mentions the traits of the believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
