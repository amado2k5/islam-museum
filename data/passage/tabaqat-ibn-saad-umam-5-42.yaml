text: "… كأَنَّ على عننى جبسالَ رَضْوَى، وأَجدل كأنَّ فى جوفى شوك السّلَّاء، وأَجسدك كأَنَّ نفّسى يخرج من ثَقْبِ إبْرَة. قال : أَخبرنا محمد بن حمر قال ! حدثنا عبد اللّٰه بن أَبى يحيى هن عمرو. بن شُعيب قال ! توظَّى حمرو …"
