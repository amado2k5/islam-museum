summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان يحتجم وهو صائم ثم لا يفطر، قال: وما رأيته احتجم قط إلا وهو صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني (357)، وأن الشيباني رواه بلفظ «ما رأيت أبي قط احتجم إلا وهو صائم». {cite:muwatta-maruf-1997 p.401}"
