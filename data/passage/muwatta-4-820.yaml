label: { ar: "الموطأ 820 — هشام بن عروة: كان يحتجم وهو صائم ثم لا يفطر، وما رآه احتجم قط إلا وهو صائم", en: "Muwatta 820", es: "Muwatta 820", fr: "Muwatta 820", ur: "موطا 820", tr: "El-Muvatta 820 — Hişam ibn Urve: Oruçluyken hacamat yaptırırdı ve sonra orucunu bozmazdı; oruçlu olmadığı zamanlarda hacamat yaptırdığı hiç görülmemiştir.", id: "Al-Muwatta 820 — Hisham ibn Urwah: Dia biasa melakukan bekam saat berpuasa dan kemudian dia tidak berbuka puasa, dan dia tidak pernah terlihat melakukan bekam kecuali saat berpuasa." }
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أنه كان يحتجم وهو صائم ثم لا يفطر، قال: وما رأيته احتجم قط إلا وهو صائم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني (357)، وأن الشيباني رواه بلفظ «ما رأيت أبي قط احتجم إلا وهو صائم». {cite:muwatta-maruf-1997 p.401}"
  tr: "Malik, Hişam ibn Urvah'tan, onun babasından rivayet ettiğine dayanarak, babasının oruçluyken hacamat yaptırdığını ve orucunu bozmadığını nakletmiştir. “Onu oruçluyken dışında hacamat yaptırırken hiç görmedim” demiştir. Araştırmacı, bunun Malik'ten Ebu Musab, Suveyd ve Şeybani (357) tarafından nakledildiğini ve Şeybani'nin bunu “Babamı oruçluyken dışında hacamat yaptırırken hiç görmedim” ifadesiyle aktardığını belirtmektedir. {cite:muwatta-maruf-1997 s.401}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa ia biasa melakukan bekam saat berpuasa dan kemudian tidak berbuka puasa. Ia berkata: “Aku tidak pernah melihatnya melakukan bekam kecuali saat berpuasa.” Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Musab, Suwaid, dan al-Shaybani (357), dan bahwa al-Shaybani meriwayatkannya dengan redaksi: “Aku tidak pernah melihat ayahku melakukan bekam kecuali saat berpuasa.” {cite:muwatta-maruf-1997 p.401}"
