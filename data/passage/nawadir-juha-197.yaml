label: { ar: "نوادر جحا الكبرى، ص 89 — «أعطني شلتة أجعلها فراشاً وأخرى لحافاً»", en: "Nawadir Juha al-Kubra, p. 89 — 'Give Me One Blanket as a Bed and Another as a Cover'", ur: "نوادر جحا الکبریٰ، ص 89 — «ایک لحاف بستر کے لیے اور دوسرا اوڑھنے کے لیے دو»", fr: "Nawadir Juha al-Kubra, p. 89 — « Donne-moi une couverture comme matelas et une autre pour me couvrir »", es: "Nawadir Juha al-Kubra, p. 89 — «Dame una manta de colchón y otra para cubrirme»", tr: "Juha'nın Büyük Fıkraları, s. 89 — “Bana yatak yapmak için bir yastık, battaniye yapmak için de bir tane ver.”", id: "Anekdot Hebat Juha, hlm. 89 — “Berikan aku bantal untuk dijadikan tempat tidur dan satu lagi sebagai selimut.”" }
text: "… أعطني شلتة أجعلها فراشاً وأخرى لحافاً كان يوماً ضيفاً عندَ أحدهم، فتأخّر قليلاً، فتعشَّى صاحبُ الدار ظانّاً أنَّ جحا تعشّى أيضاً، وجاء جحا فسامره ولاطفه وأمضى معه هَزِيعاً من الليل، ثمّ دخل أصحاب الدار للمنام بعد أن قالوا للشيخ: تصبح …"
summary:
  ar: "نزل جحا ضيفًا وصل متأخرًا فلم يأكل شيئًا ولم يستطع أن ينام على فراش مستوٍ؛ فطرق الباب الداخلي وطلب غطاءين، أحدهما فراشًا والآخر لحافًا. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  en: "Juha, a guest who arrives late, eats nothing, and cannot sleep on a flat bed; he knocks at the inner door and asks for two blankets, one for a mattress and one as a covering. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  ur: "جحا دیر سے پہنچنے والا مہمان تھا، اس نے کچھ نہ کھایا اور سیدھے بستر پر سو نہ سکا؛ اس نے اندر کے دروازے پر دستک دی اور دو چادریں مانگیں، ایک بچھانے کو اور ایک اوڑھنے کو۔ {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  fr: "Juha, invité arrivé tard, ne mange rien et ne peut dormir sur un lit plat; il frappe à la porte intérieure et demande deux couvertures, l'une comme matelas et l'autre pour se couvrir. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  es: "Juha, un invitado que llega tarde, no come nada y no puede dormir en una cama plana; llama a la puerta interior y pide dos mantas, una de colchón y otra para cubrirse. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  tr: "Juha misafir olarak geç geldiği için ne yemek yiyebildi ne de düz bir yatakta uyuyabildi. İç kapıyı çaldı ve biri yatak için diğeri yorgan için olmak üzere iki battaniye istedi. {cite:juha-nawadir-kubra-djuwaydi s. 89}"
  id: "Juha tiba terlambat sebagai tamu, sehingga ia tidak makan apa pun dan tidak bisa tidur di kasur yang rata. Ia mengetuk pintu dalam dan meminta dua selimut, satu untuk kasur dan yang lainnya untuk selimut tebal. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
