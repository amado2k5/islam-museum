label: { ar: "سنن أبي داود 4116 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 4116 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 4116 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 4116 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 4116 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا أَحْمَدُ بْنُ عَمْرِو بْنِ السَّرْحِ، وَأَحْمَدُ بْنُ سَعِيدٍ الْهَمْدَانِيُّ، قَالاَ أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنَا ابْنُ لَهِيعَةَ، عَنْ مُوسَى بْنِ جُبَيْرٍ، أَنَّ عُبَيْدَ اللَّهِ بْنَ عَبَّاسٍ، حَدَّثَهُ عَنْ خَالِدِ بْنِ يَزِيدَ بْنِ مُعَاوِيَةَ، عَنْ دِحْيَةَ بْنِ خَلِيفَةَ الْكَلْبِيِّ، أَنَّهُ قَالَ أُتِيَ رَسُولُ اللَّهِ بِقَبَاطِيَّ فَأَعْطَانِي مِنْهَا قُبْطِيَّةً فَقَالَ \" اصْدَعْهَا صَدْعَيْنِ فَاقْطَعْ أَحَدَهُمَا قَمِيصًا وَأَعْطِ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 4116، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4116 (Clothing (Kitab Al-Libas)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 4116، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4116 (Vestimenta (Kitab Al-Libas)), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 4116 (Vêtements (Kitab Al-Libas)), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
