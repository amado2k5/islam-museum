label: { ar: "الموطأ 1537 — ابن شهاب عن أبي عبد الرحمن عن زيد بن ثابت: في الرجل يطلق الأمة ثلاثا ثم يشتريها، لا تحل له حتى تنكح زوجا غيره", en: "Muwatta 1537", es: "Muwatta 1537", fr: "Muwatta 1537", ur: "موطا 1537", tr: "El-Muvatta 1537 — İbn Şihab, Ebu Abdül-Rahman'dan, o da Zeyd ibn Sabit'ten rivayetle: Bir erkek cariyesini üç defa boşayıp sonra geri satın alırsa, cariye başka bir kocayla evleninceye kadar ona helal olmaz.", id: "Al-Muwatta 1537 — Ibn Shihab, berdasarkan riwayat Abu Abd al-Rahman, berdasarkan riwayat Zayd ibn Thabit: Mengenai seorang pria yang menceraikan budak perempuannya tiga kali dan kemudian membelinya kembali, budak tersebut tidak halal baginya sampai ia menikah lagi dengan suami lain." }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي عبد الرحمن عن زيد بن ثابت أنه كان يقول في الرجل يطلق الأمة ثلاثا ثم يشتريها، إنها لا تحل له حتى تنكح زوجا غيره. {cite:muwatta-maruf-1997 p.44}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Abdül-Rahman'dan, o da Zeyd ibn Sabit'ten rivayet eder ki, üç defa cariyesini boşayıp sonra geri satın alan bir adam hakkında şöyle derdi: \"O kadın başka bir adamla evleninceye kadar ona helal değildir.\" {cite:muwatta-maruf-1997 s.44}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abu Abdullah al-Rahman, dari Zayd bin Thabit, bahwa beliau biasa mengatakan tentang seorang pria yang menceraikan budak perempuannya tiga kali lalu membelinya kembali, bahwa budak tersebut tidak halal baginya sampai ia menikah dengan pria lain. {cite:muwatta-maruf-1997 p.44}"
