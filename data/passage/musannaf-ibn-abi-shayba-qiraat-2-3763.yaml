label: { ar: "مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3763 — قراءات القرآن، جمع القرآن والمصاحف", en: "the Musannaf of Ibn Abi Shayba, scan volume 2, p. 3763 — the readings of the Qur'an; the collection of the Qur'an and the codices", ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 3763 — قرآن کی قراءتیں، جمعِ قرآن اور مصاحف", es: "El Musannaf de Ibn Abi Shayba, escaneo del volumen 2, pág. 3763 — las lecturas del Corán; la colección del Corán y los códices" }
text: "… قوله: منهن، يؤيد المثبت، والله أعلم. في جميع النسخ: ولا تنكحوهن حتى يؤمن !!. والذي في المصحف ما أثبته، ولم أقف على هذه القراءة - إن كانت- فيما بين يدي من كتب القراءات، فلعلها خطأ، أو قراءة اندثرت؛ فلذلك لم …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 3763، يذكر قراءات القرآن، وجمع القرآن والمصاحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 3763, that mentions the readings of the Qur'an, the collection of the Qur'an and the codices; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 3763 کا اقتباس جس میں قرآن کی قراءتیں، جمعِ قرآن اور مصاحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Musannaf de Ibn Abi Shayba, volumen 2, pág. 3763, que menciona las lecturas del Corán, la colección del Corán y los códices; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
