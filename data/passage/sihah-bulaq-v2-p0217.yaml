text: |-
  ٢٧٠
  • فضل ائنا)•
  ابنتسه وختنت الصدى ختنا والاسم الختان والختانة بقال أهمرت ختانته اذا استقصيت
  فى القطع وانلمتان أيضاموضع القطع من الذكر ومنه اذا التقى انختانان وقد تسمى الدعوة
  لذلب ختانا بعتن) الخبعثنة الضخم الشديد مثل القذعملة وأنشدأ بوعرو
  خبعتى انطلق فى أخلاقه زعر » وقال أبوز سد الطاق فى وصف الاسد
  خيعتنة فى ساعديه تزايل • تقول وعى من بعدماقد تكسرا
  وقال الفوزدق يصف ابل
  حواسات العشاءخيعات • اذا النكاء عارضت الشمالا
  ( خدن الخدن والخدين الصديق يقال خادنت الرجل ومنه خسدن الجارية قال اللّٰه
  تعالى ولا متخذات أخدان ورجل خسدنة يخادن الناس كثيرا زن ) خزنت المال
  واخترته جعلته فى الحزانة وخزنت السر واختزنته كتمته والمخزن بفتح الزاى ما يخزن فيه
  و الشئ والخزانة بالكسر واحدة الخزائن وخزن اللهم بالكسرانتن مثل خنز مقلوب منه قال
  طرقة
  ثم لا يخزن فينالها • اغايخزن لحم المدخر
  ( خشن الخشونة ضدّ اللين وقد خشن الشئ بالضم فهو خشن واخشوشن الشى اشتدت
  خشونته وهو لامبالغة كة ولك أعشبت الارض واعشوشيت واخشوشن الرجل تعوّدليس
  الحشن والاخشن مثل الخشن والجمع خشن قال الراجز
  ألين مسافى حوايا البطن * من ينربيات ذاذخشن * يرمحبها أرمى من ابنتقن
  يعى به الجدد وفى الحديث أخيشن فى ذات اللّٰه وكتيبة خشناء كثيرة السلاح ومعشر خشن
  ويجوز تحريكه فى الشعر وخاشنته خلاف لا ينته وختات صدره تخشينا أوغرت وقال عنترة
  وخشات صدراجيبه لك ناصح • والخشنة الجشونة وقال حكيم بن مصعب
  تشكى الى الكلب خشنة عيشه • وبى مثل ما بالمكلب أبد أكثر
  خضن الخاضنة المغازلة قال الطرماح
  وألقت الىّ القول منهن زولة * تخاضن أوترنولقول المخاضن
  ن التخمين القول بالحدس قال أبو عيد انهان من الرماح الضعيف وقناتجائة
  وخان الناس خشارتهم ( نن الظنة كالغنة والاخن الاغن والمع خنّ قال الراجز
  جارية ليست من الوخشن • ولا من السود القصار الخن
  والمخنة الانف وفلان مخنة لفلان أى مأكلة له ومخنة القوم حريهم وخنذت الجلة اذا
  استخرحت منها شيأ بعدشئ والحنين كالبكاء فى الانف والضحك فى الانف وقد خن يخن
  والخضنة أن لا يبين كلامه فيختنخن فى خياشيه واللحنان داء يأخذفى الانف والحنان أيضادا.
  يأخذ الطيرف حلوقها ⁦(خون )⁩ خائه فى كذايخونه خونا وخيائة ومخانة واختانه قال
  اللّٰه تعالى تختانون أنفسكم أى يخون بعضكم بعضا ورجل خائن وخاثنة أيضا والهاه
  للمبالغة مثل علامة ونسابة وأنسد أبو عبيدة للكلابة
  حدثت نفسك بالوفاء ولم تكن • للغدرخائنة مغلّ الاصبح
  وقوم خونة كماقالواحوكة وقدذ كروجه ئبوت الواد وخونه نسبه الى الحيانة والحوان
  الاسد
