label: { ar: "صحيح مسلم 6448 — الأب والأبوة", en: "Sahih Muslim 6448 — the father and fatherhood", ur: "صحیح مسلم 6448 — باپ اور والدیت", es: "Sahih Muslim 6448 — El padre y la paternidad", fr: "Sahih Muslim 6448 — Le père et la paternité", tr: "Sahih Muslim 6448 — Baba ve Babalık", id: "Sahih Muslim 6448 — Ayah dan Peran Ayah" }
text: "… - قَالاَ حَدَّثَنَا وَكِيعٌ، عَنْ سُفْيَانَ، عَنْ عَبْدِ الْمَلِكِ بْنِ عُمَيْرٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي بَكْرَةَ، عَنْ أَبِيهِ، قَالَ قَالَ رَسُولُ اللَّهِ \" أَرَأَيْتُمْ إِنْ كَانَ جُهَيْنَةُ وَأَسْلَمُ وَغِفَارُ خَيْرًا مِنْ بَنِي تَمِيمٍ وَبَنِي عَبْدِ اللَّهِ بْنِ غَطَفَانَ وَعَامِرِ بْنِ صَعْصَعَةَ \". وَمَدَّ بِهَا صَوْتَهُ فَقَالُوا يَا رَسُولَ اللَّهِ فَقَدْ خَابُوا وَخَسِرُوا. قَالَ \" …"
summary:
  ar: "حديث في صحيح مسلم، رقم 6448، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 6448 (The Book of the Merits of the Companions), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 6448، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 6448 (El Libro de los Méritos de los Compañeros), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih Muslim, n° 6448 (Livre des mérites des Compagnons), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sahih Müslim'de 6448 numaralı hadis, baba ve babalık kavramından bahsetmektedir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 6448, menyebutkan tentang ayah dan peran ayah. Peramban \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
