text: "… فيها، وطاف في بعض بلاد المشرق، وعاد إلى بلده، وأقراً بها. ثم سكن قرطبة سنة وخطب وأقرأ بجامعها وتوفي فيها. له كتب كثيرة، منها مشكل إعراب القرآن و الكشف عن وجوه القراآت وعللها. توفي سنة ه. الأعلام. مكحول الشامي، أبو …"
