label: { ar: "صحيح البخاري 5499 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 5499 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 5499 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 5499 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 5499 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا مُعَلَّى بْنُ أَسَدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ ـ يَعْنِي ابْنَ الْمُخْتَارِ ـ أَخْبَرَنَا مُوسَى بْنُ عُقْبَةَ، قَالَ أَخْبَرَنِي سَالِمٌ، أَنَّهُ سَمِعَ عَبْدَ اللَّهِ، يُحَدِّثُ عَنْ رَسُولِ اللَّهِ أَنَّهُ لَقِيَ زَيْدَ بْنَ عَمْرِو بْنِ نُفَيْلٍ بِأَسْفَلِ بَلْدَحٍ، وَذَاكَ قَبْلَ أَنْ يُنْزَلَ عَلَى رَسُولِ اللَّهِ الْوَحْىُ، فَقَدَّمَ إِلَيْهِ رَسُولُ اللَّهِ سُفْرَةً فِيهَا لَحْمٌ، فَأَبَى أَنْ يَأْكُلَ مِنْهَا، …"
summary:
  ar: "حديث في صحيح البخاري، رقم 5499، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 5499 (Hunting, Slaughtering), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 5499، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato del Sahih al-Bukhari, n.º 5499 (Caza y matanza), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista de textos del Corán, la Sunnah, la Seerah y libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 5499 (Chasse, Abattage), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
