text: "… مخلوقاتُه ومفعولاتُه، وهو لا يُوصَفُ بشيءٍ منها، إنَّما يوصَفُ بما قام به من صفاته وأفعاله ! والله أعلم. وقوله : وجعلتُه بينكم محرَّماً، فلا تظالموا يعني : أنَّه تعالى حَرَّم الظلم على مباده، ونهاهم أنْ يتظالموا فيما بينهم، فحرامٌ على …"
summary:
