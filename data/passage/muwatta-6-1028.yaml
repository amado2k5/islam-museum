label: { ar: "الموطأ 1028 — هشام بن عروة عن أبيه: خمس فواسق يقتلن في الحرم: الفأرة، والعقرب، والغراب، والحدأة، والكلب العقور", en: "Muwatta 1028", es: "Muwatta 1028", fr: "Muwatta 1028", ur: "موطا 1028", tr: "El-Muvatta 1028 — Hişam ibn Urve, babasının rivayetine göre: Kutsal alanda beş zararlı yaratık öldürülebilir: fare, akrep, karga, çaylak ve kuduz köpek.", id: "Al-Muwatta 1028 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Lima makhluk berbahaya boleh dibunuh di tempat suci: tikus, kalajengking, gagak, elang, dan anjing gila" }
text: "خمس فواسق يقتلن في الحرم: الفأرة، والعقرب، والغراب، والحدأة، والكلب العقور"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن رسول الله قال: خمس فواسق يقتلن في الحرم: الفأرة، والعقرب، والغراب، والحدأة، والكلب العقور. ويذكر المحقق أن ابن عبد البر قال إنه يتصل عن النبي، ويستند من حديث ابن عمر وعائشة، وأن وكيعاً رواه عن مالك عن هشام عن أبيه عن عائشة، وأنه محفوظ عن عائشة وعن ابن عمر. {cite:muwatta-maruf-1997 p.480}"
  tr: "Malik, Hişam ibn Urve'den, o da babasından rivayet ederek, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Beş yaratık zararlıdır ve kutsal mekân içinde öldürülebilirler: fare, akrep, karga, çaylak ve kuduz köpek.\" Araştırmacı, İbn Abdül-Barr'ın bunun Peygamberle bağlantılı olduğunu ve İbn Ömer ve Ayşe'nin hadislerine dayandığını, Vaki'nin ise bunu Malik'ten, o da Hişam'dan, o da babasından, o da Ayşe'den rivayet ettiğini ve Ayşe ve İbn Ömer'in rivayetiyle korunduğunu söylediğini belirtmektedir. {cite:muwatta-maruf-1997 s.480}"
  id: "Malik meriwayatkannya dari Hisham ibn Urwah, dari ayahnya, bahwa Rasulullah SAW bersabda: “Lima makhluk berbahaya dan boleh dibunuh di dalam tempat suci: tikus, kalajengking, gagak, elang, dan anjing gila.” Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini terkait dengan Nabi dan berdasarkan hadits Ibnu Umar dan Aisyah, dan bahwa Waki’ meriwayatkannya dari Malik, dari Hisham, dari ayahnya, dari Aisyah, dan bahwa hadits ini terpelihara dari Aisyah dan Ibnu Umar. {cite:muwatta-maruf-1997 p.480}"
