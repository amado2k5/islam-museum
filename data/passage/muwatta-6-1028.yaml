text: "خمس فواسق يقتلن في الحرم: الفأرة، والعقرب، والغراب، والحدأة، والكلب العقور"
summary:
  ar: "يرويه مالك عن هشام بن عروة عن أبيه، أن رسول الله قال: خمس فواسق يقتلن في الحرم: الفأرة، والعقرب، والغراب، والحدأة، والكلب العقور. ويذكر المحقق أن ابن عبد البر قال إنه يتصل عن النبي، ويستند من حديث ابن عمر وعائشة، وأن وكيعاً رواه عن مالك عن هشام عن أبيه عن عائشة، وأنه محفوظ عن عائشة وعن ابن عمر. {cite:muwatta-maruf-1997 p.480}"
