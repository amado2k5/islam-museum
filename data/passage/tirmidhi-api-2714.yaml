text: "دَخَلْتُ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم وَبَيْنَ يَدَيْهِ كَاتِبٌ فَسَمِعْتُهُ يَقُولُ ‏ \"‏ ضَعِ الْقَلَمَ عَلَى أُذُنِكَ فَإِنَّهُ أَذْكَرُ لِلْمُمْلِي ‏\"‏ ‏.‏ قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ إِلاَّ مِنْ هَذَا الْوَجْهِ وَهُوَ إِسْنَادٌ ضَعِيفٌ ‏.‏ وَعَنْبَسَةُ بْنُ عَبْدِ الرَّحْمَنِ وَمُحَمَّدُ بْنُ زَاذَانَ يُضَعَّفَانِ فِي الْحَدِيثِ ‏.‏"
summary:
  ar: "في جامع الترمذي؛ ذكر كتابة كتاب أو إرساله."
  en: "In Jami' al-Tirmidhi; mention of writing or dispatching a letter."
  ur: "جامع ترمذی میں؛ خط لکھنے یا بھیجنے کا ذکر."
