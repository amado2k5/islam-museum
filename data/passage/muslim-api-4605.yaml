label: { ar: "صحيح مسلم 4605 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih Muslim 4605 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح مسلم 4605 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih Muslim 4605 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih Muslim 4605 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا شَيْبَانُ بْنُ فَرُّوخَ، حَدَّثَنَا سُلَيْمَانُ، - يَعْنِي ابْنَ الْمُغِيرَةِ - حَدَّثَنَا حُمَيْدُ، بْنُ هِلاَلٍ عَنْ عَبْدِ اللَّهِ بْنِ مُغَفَّلٍ، قَالَ أَصَبْتُ جِرَابًا مِنْ شَحْمٍ يَوْمَ خَيْبَرَ - قَالَ - فَالْتَزَمْتُهُ فَقُلْتُ لاَ أُعْطِي الْيَوْمَ أَحَدًا مِنْ هَذَا شَيْئًا - قَالَ - فَالْتَفَتُّ فَإِذَا رَسُولُ اللَّهِ مُتَبَسِّمًا."
summary:
  ar: "حديث في صحيح مسلم، رقم 4605، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4605 (The Book of Jihad and Expeditions), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح مسلم کی حدیث نمبر 4605، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih Muslim, n.º 4605 (El Libro de la Yihad y las Expediciones), menciona naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sahih Muslim, n° 4605 (Livre du Jihad et des Expéditions), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
