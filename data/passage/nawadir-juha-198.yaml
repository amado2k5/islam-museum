label: { ar: "نوادر جحا الكبرى، ص 89 — «أنت لك الرنين وذاك له الدراهم»", en: "Nawadir Juha al-Kubra, p. 89 — 'You Have the Jingle and He Has the Coins'", ur: "نوادر جحا الکبریٰ، ص 89 — «تمہارے لیے جھنکار اور اس کے لیے سکے»", fr: "Nawadir Juha al-Kubra, p. 89 — « À toi le tintement, à lui les pièces »", es: "Nawadir Juha al-Kubra, p. 89 — «Para ti el tintineo y para él las monedas»", tr: "Juha'nın Muhteşem Fıkraları, s. 89 — “Çalmayı sen alırsın, parayı o alır.”", id: "Anekdot Hebat Juha, hlm. 89 — “Kamu mendapatkan deringnya, dan dia mendapatkan uangnya.”" }
text: "… أنت لك الرنين وذاك له الدراهم ادَّعى بعضُهم على آخر أمام الشيخ، وكان قاضياً، أنه رأى في منامه أن ذلك الشخص المدَّعى عليه أخذ منه دراهم عدّها له وكان لها رنين، ثمَّ قال: والآن أطلبها فلا يعطيني إيَّاها. هزيعاً من …"
summary:
  ar: "ادعى رجل أنه رأى في المنام أن مدينًا أخذ منه مالًا برنين؛ فأمر جحا المدعى عليه بإحضار نقود ووزنها، وقال للمدعي أن يأخذ الرنين وللمدعى عليه أن يحتفظ بالنقود. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  en: "A man claims in a dream that a debtor took money from him with a jingle; Juha orders the defendant to bring coins and weighs them; he tells the plaintiff to take the jingle and the defendant to keep the coins. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  ur: "ایک آدمی نے دعویٰ کیا کہ اس نے خواب میں دیکھا کہ ایک مقروض جھنکار کے ساتھ اس سے رقم لے گیا؛ جحا نے مدعا علیہ کو سکے لانے کا حکم دیا اور انہیں تولا؛ پھر مدعی سے کہا کہ جھنکار لے لو اور مدعا علیہ سے کہا کہ سکے اپنے پاس رکھو۔ {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  fr: "Un homme prétend avoir rêvé qu'un débiteur lui a pris de l'argent avec un tintement; Juha ordonne au défendeur d'apporter des pièces et les pèse; il dit au plaignant de prendre le tintement et au défendeur de garder les pièces. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  es: "Un hombre afirma haber soñado que un deudor le tomó dinero con un tintineo; Juha ordena al demandado que traiga monedas y las pesa; le dice al demandante que se quede con el tintineo y al demandado que conserve las monedas. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
  tr: "Bir adam, rüyasında bir borçlunun kendisinden yüzük şeklinde para aldığını iddia etti; bunun üzerine Juha, davalıya parayı getirip tartmasını emretti ve davacıya yüzüğü almasını, davalıya ise parayı saklamasını söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 89}"
  id: "Seorang pria mengaku bermimpi bahwa seorang debitur mengambil uang darinya dalam bentuk cincin; maka Juha memerintahkan terdakwa untuk membawa uang dan menimbangnya, dan menyuruh penggugat untuk mengambil cincin itu dan terdakwa untuk menyimpan uangnya. {cite:juha-nawadir-kubra-djuwaydi p. 89}"
