text: "… ثَائِرُ الرَّأْسِ يُسْمَعُ دَوِيُّ صَوْتِهِ وَلاَ نَفْقَهُ مَا يَقُولُ حَتَّى دَنَا فَإِذَا هُوَ يَسْأَلُ عَنِ الإِسْلاَمِ فَقَالَ لَهُ رَسُولُ اللَّهِ \" خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ وَاللَّيْلَةِ \". قَالَ هَلْ عَلَىَّ غَيْرُهُنَّ قَالَ \" لاَ إِلاَّ أَنْ تَطَّوَّعَ \". قَالَ رَسُولُ اللَّهِ \" وَصِيَامُ شَهْرِ رَمَضَانَ \". قَالَ هَلْ عَلَىَّ غَيْرُهُ قَالَ \" لاَ إِلاَّ أَنْ …"
summary:
  ar: "حديث في موطأ مالك، رقم 426، يذكر تعريف الإسلام بأعماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Muwatta Malik, no. 426 (Shortening the Prayer), that mentions Islam defined by its acts. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "موطأ مالک کی حدیث نمبر 426، جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Muwatta Malik, n.° 426 (Abreviación de la oración), menciona el Islam definido por sus actos. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los informes de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Muwatta Malik, n° 426 (Raccourcir la prière), mentionne que l'islam est défini par ses actes. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant les piliers de l'islam, les branches de la foi et les qualités du croyant."
  tr: "Malik'in Muwatta'sında yer alan 426 numaralı hadis, İslam'ı amelleriyle tanımlar. Bu hadis, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri ile birlikte, bir okuyucu tarafından derlenmiş ve Kur'an, Sünnet, Peygamberin biyografisi ve Sahabeler ile onların haleflerinin rivayetleriyle desteklenmiştir."
  id: "Sebuah hadits dalam Muwatta karya Malik, nomor 426, mendefinisikan Islam melalui perbuatannya. Hadits ini, bersama dengan rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, disusun oleh seorang pembaca dan didukung oleh teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka dalam keempat kategori tersebut."
