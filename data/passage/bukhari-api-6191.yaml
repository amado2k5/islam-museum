text: "حَدَّثَنَا سَعِيدُ بْنُ أَبِي مَرْيَمَ، حَدَّثَنَا أَبُو غَسَّانَ، قَالَ حَدَّثَنِي أَبُو حَازِمٍ، عَنْ سَهْلٍ، قَالَ أُتِيَ بِالْمُنْذِرِ بْنِ أَبِي أُسَيْدٍ إِلَى النَّبِيِّ حِينَ وُلِدَ، فَوَضَعَهُ عَلَى فَخِذِهِ وَأَبُو أُسَيْدٍ جَالِسٌ، فَلَهَا النَّبِيُّ بِشَىْءٍ بَيْنَ يَدَيْهِ، فَأَمَرَ أَبُو أُسَيْدٍ بِابْنِهِ فَاحْتُمِلَ مِنْ فَخِذِ النَّبِيِّ فَاسْتَفَاقَ النَّبِيُّ فَقَالَ \" أَيْنَ الصَّبِيُّ \". فَقَالَ أَبُو أُسَيْدٍ قَلَبْنَاهُ يَا …"
summary:
  ar: "حديث في صحيح البخاري، رقم 6191، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6191 (Good Manners and Form (Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 6191، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
