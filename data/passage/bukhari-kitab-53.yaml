summary:
  ar: "القسم 53 من صحيح البخاري في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصلح»، ويضم فيها النصوص من 2690 إلى 2710 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 53 of Sahih al-Bukhari (Peacemaking) in the division of the open hadith dataset the museum took its reports from: reports 2690 to 2710 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح بخاری کی کتاب 53، عنوان «کتاب الصلح»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2690 تا 2710۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 53 de Sahih al-Bukhari (La Pacificación) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2690 al 2710 según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
