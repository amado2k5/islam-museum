label:
  ar: "البخاري 3350 — إبراهيم وأبوه يوم القيامة: إني حرمت الجنة على الكافرين"
  en: "Bukhari 3350 — Ibrahim and his father on the Day of Resurrection"
  ur: "بخاری 3350 — قیامت کے دن ابراہیم اور ان کے والد"
text: "يلقى إبراهيم أباه آزر يوم القيامة، وعلى وجه آزر قترة وغبرة، فيقول له إبراهيم ألم أقل لك لا تعصني فيقول أبوه فاليوم لا أعصيك. فيقول إبراهيم يا رب، إنك وعدتني أن لا تخزيني يوم يبعثون، فأى خزى أخزى من أبي …"
summary:
  ar: "حديث قدسي في صحيح البخاري، رقم 3350: إبراهيم وأبوه يوم القيامة: إني حرمت الجنة على الكافرين. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih al-Bukhari, no. 3350: Ibrahim and his father on the Day of Resurrection. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح بخاری میں حدیثِ قدسی، نمبر 3350: قیامت کے دن ابراہیم اور ان کے والد۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
