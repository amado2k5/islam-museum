label: { ar: "الموطأ 213 — المصلي يناجي ربه فلا يجهر بعضكم على بعض بالقرآن", en: "Muwatta 213", es: "Muwatta 213", fr: "Muwatta 213", ur: "موطا 213", tr: "Al-Muwatta 213 — Kul, Rabbiyle konuşmaktadır; öyleyse Kur'an okurken birbirinizin sesini yükseltmeyin.", id: "Al-Muwatta 213 — Orang yang beribadah sedang berbicara dengan Tuhannya, maka janganlah kalian saling meninggikan suara saat membaca Al-Qur'an." }
text: "إن المصلي يناجي ربه، فلينظر بما يناجيه به، ولا يجهر بعضكم على بعض بالقرآن"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن أبي حازم التمار عن البياضي، في باب العمل في القراءة: خرج النبي على الناس وهم يصلون وقد علت أصواتهم بالقراءة، فأخبرهم أن المصلي يناجي ربه فلينظر بما يناجيه، ونهاهم أن يجهر بعضهم على بعض بالقرآن. ويبين المحقق أن أبا حازم التمار ثقة وثقه أبو داود وابن عبد البر والعجلي وإن قال ابن حجر «مقبول»، وأن البياضي هو فروة بن عمرو من بني بياضة من الخزرج شهد العقبة وبدراً؛ ويخرّج الحديث عند أحمد (4/344) والنسائي في الكبرى والبيهقي والبخاري في خلق أفعال العباد من طرق أصحاب مالك، ويحيل على التمهيد (23/315). {cite:muwatta-maruf-1997 p.131}"
  tr: "Malik, Yahya ibn Sa'id'den, o da Muhammed ibn İbrahim el-Taymi'den, o da Ebu Hazim el-Tammar'dan, o da el-Bayadi'den rivayetle, Kur'an okuma sırasındaki davranışlar bölümünde şöyle anlatmaktadır: Peygamber, namaz kılanların yanına çıktı ve sesleri Kur'an okurken yükselmişti. Onlara, namaz kılanın Rabbiyle özel bir konuşma yaptığını, bu yüzden O'na ne söylediğine dikkat etmesi gerektiğini bildirdi. Kur'an okurken birbirlerinin sesini yükseltmelerini yasakladı. Araştırmacı, Ebu Hazim el-Tammar'ın güvenilir olduğunu, Ebu Davud, İbn Abd el-Barr ve el-Ajli tarafından da doğrulandığını, ancak İbn Hacer'in onun \"kabul edilebilir\" olduğunu söylediğini açıklığa kavuşturmaktadır. Ayrıca el-Bayadi'nin, Akabe Biatı ve Bedir Savaşı'na katılan Hazrec kabilesinin Beni Bayade'sinden Farve ibn Amr olduğunu belirtmektedir. Bu hadis, Ahmed'in (4/344), el-Kubra'da el-Nasa'i'nin, el-Beyhaki'nin ve el-Buhari'nin Halq Af'al al-'Ibad adlı eserlerinde, Malik'in sahabelerinin rivayet zincirleriyle bulunmaktadır. Kendisi el-Tamhid'e (23/315) atıfta bulunmaktadır. {cite:muwatta-maruf-1997 s.131}"
  id: "Diriwayatkan oleh Malik dari Yahya ibn Sa'id, dari Muhammad ibn Ibrahim al-Taymi, dari Abu Hazim al-Tammar, dari al-Bayadi, dalam surah tentang amalan saat membaca Al-Quran: Nabi keluar menemui orang-orang ketika mereka sedang shalat, dan suara mereka meninggi dalam membaca. Beliau memberitahu mereka bahwa orang yang shalat sedang berbicara secara pribadi dengan Tuhannya, maka hendaklah ia memperhatikan apa yang diucapkannya kepada-Nya. Beliau melarang mereka untuk saling meninggikan suara saat membaca Al-Quran. Peneliti menjelaskan bahwa Abu Hazim al-Tammar dapat dipercaya, sebagaimana dikonfirmasi oleh Abu Dawud, Ibn Abd al-Barr, dan al-Ajli, meskipun Ibn Hajar mengatakan bahwa ia \"dapat diterima.\" Ia juga menyatakan bahwa al-Bayadi adalah Farwah ibn Amr dari Bani Bayadah dari suku Khazraj, yang ikut serta dalam Ikrar Aqaba dan Perang Badar. Hadits ini terdapat dalam kumpulan hadits Ahmad (4/344), al-Nasa'i dalam al-Kubra, al-Bayhaqi, dan al-Bukhari dalam Khalq Af'al al-'Ibad, melalui sanad para sahabat Malik. Beliau merujuk pada al-Tamhid (23/315). {cite:muwatta-maruf-1997 p.131}"
