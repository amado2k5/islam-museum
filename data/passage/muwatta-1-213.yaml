label: { ar: "الموطأ 213 — المصلي يناجي ربه فلا يجهر بعضكم على بعض بالقرآن", en: "Muwatta 213" }
text: "إن المصلي يناجي ربه، فلينظر بما يناجيه به، ولا يجهر بعضكم على بعض بالقرآن"
summary:
  ar: "يرويه مالك عن يحيى بن سعيد عن محمد بن إبراهيم التيمي عن أبي حازم التمار عن البياضي، في باب العمل في القراءة: خرج النبي على الناس وهم يصلون وقد علت أصواتهم بالقراءة، فأخبرهم أن المصلي يناجي ربه فلينظر بما يناجيه، ونهاهم أن يجهر بعضهم على بعض بالقرآن. ويبين المحقق أن أبا حازم التمار ثقة وثقه أبو داود وابن عبد البر والعجلي وإن قال ابن حجر «مقبول»، وأن البياضي هو فروة بن عمرو من بني بياضة من الخزرج شهد العقبة وبدراً؛ ويخرّج الحديث عند أحمد (4/344) والنسائي في الكبرى والبيهقي والبخاري في خلق أفعال العباد من طرق أصحاب مالك، ويحيل على التمهيد (23/315). {cite:muwatta-maruf-1997 p.131}"
