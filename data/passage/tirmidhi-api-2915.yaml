label: { ar: "جامع الترمذي 2915 — عدد الحسنات", en: "Jami' al-Tirmidhi 2915 — a stated number of good deeds", ur: "جامع ترمذی 2915 — نیکیوں کی مقررہ تعداد", es: "Jami' al-Tirmidhi 2915 — un número determinado de buenas obras", fr: "Jami' al-Tirmidhi 2915 — un nombre déterminé de bonnes actions", tr: "Cami' el-Tirmizi 2915 — İyi amellerin sayısı", id: "Jami' al-Tirmidhi 2915 — Jumlah amal kebaikan" }
text: "… فَيُلْبَسَ حُلَّةَ الْكَرَامَةِ ثُمَّ يَقُولُ يَا رَبِّ ارْضَ عَنْهُ فَيَرْضَى عَنْهُ فَيُقَالُ لَهُ اقْرَأْ وَارْقَ وَيُزَادُ بِكُلِّ آيَةٍ حَسَنَةً \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، قَالَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، قَالَ حَدَّثَنَا شُعْبَةُ، عَنْ عَاصِمِ بْنِ بَهْدَلَةَ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، نَحْوَهُ وَلَمْ يَرْفَعْهُ. قَالَ أَبُو عِيسَى …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2915، يذكر عدد الحسنات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 2915 (Chapters on The Virtues of the Qur'an), that speaks of a stated number of good deeds. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 2915، جس میں نیکیوں کی مقررہ تعداد کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2915 (Capítulos sobre las virtudes del Corán), menciona un número determinado de buenas acciones. El Libro Mayor de Hasanat y Sayyi'at lo incluye junto con los textos que registran, escriben, borran o ponderan una acción."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2915 (Chapitres sur les vertus du Coran), mentionne un nombre précis de bonnes actions. Le Livre des Hasanat et Sayyi'at le recense avec les textes qui comptent, écrivent, effacent ou pèsent une action."
  tr: "Cami' el-Tirmizi'de 2915 numaralı hadis, iyi amellerin sayısından bahseder. Bu hadis, iyi ve kötü amellerin bir listesini ve bu amelleri sayan, kaydeden, silen veya tartan metinleri içerir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2915, menyebutkan jumlah amal kebaikan. Hadits ini mencakup daftar amal baik dan amal buruk beserta teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
