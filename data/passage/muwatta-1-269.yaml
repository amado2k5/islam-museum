text: "غسل يوم الجمعة واجب على كل محتلم"
summary:
  ar: "يرويه مالك عن صفوان بن سليم عن عطاء بن يسار عن أبي سعيد الخدري، في باب العمل في غسل يوم الجمعة: قال النبي إن غسل يوم الجمعة واجب على كل محتلم. ويخرّجه المحقق عند البخاري (879، 895) ومسلم (3/3) وأبي داود (341) والنسائي (3/93) وابن حبان وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن رواة الموطأ لم يختلفوا في إسناده، وأن بكر بن الشرود رواه عن مالك بإسناد آخر خطأً، وأن بكراً سيئ الحفظ ضعيف كذبه ابن معين (التمهيد 16/211). {cite:muwatta-maruf-1997 p.158}"
