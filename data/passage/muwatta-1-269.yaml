text: "غسل يوم الجمعة واجب على كل محتلم"
summary:
  ar: "يرويه مالك عن صفوان بن سليم عن عطاء بن يسار عن أبي سعيد الخدري، في باب العمل في غسل يوم الجمعة: قال النبي إن غسل يوم الجمعة واجب على كل محتلم. ويخرّجه المحقق عند البخاري ⁦(879، 895)⁩ ومسلم (3/3) وأبي داود (341) والنسائي (3/93) وابن حبان وابن خزيمة وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن رواة الموطأ لم يختلفوا في إسناده، وأن بكر بن الشرود رواه عن مالك بإسناد آخر خطأً، وأن بكراً سيئ الحفظ ضعيف كذبه ابن معين ⁦(التمهيد 16/211)⁩. {cite:muwatta-maruf-1997 p.158}"
  tr: "Malik, Cuma günü gusül abdesti alma uygulaması bölümünde, Safvan ibn Salim'den, Ata ibn Yasar'dan, Ebu Sa'id el-Hudri'den rivayetle şöyle buyurmuştur: Peygamberimiz şöyle buyurmuştur: \"Cuma günü gusül abdesti almak her yetişkin erkek için farzdır.\" Araştırmacı, bu hadisi Buhari (879, 895), Müslim (3/3), Ebu Davud (341), Nesai (3/93), İbn Hibban, İbn Huzeyme, Ahmed ve Şafiî'nin hadis külliyatlarına, Malik'in sahabelerinin rivayet zincirleriyle dahil etmiştir. İbn Abd el-Barr'ın, Muvatta'nın ravilerinin isnad zinciri konusunda ihtilaf etmediklerini ve Bakr ibn el-Şarud'un bunu Malik'ten başka bir isnad zinciriyle rivayet ettiğini, bunun da bir hata olduğunu söylediğini aktarmıştır. Ayrıca Bakr'ın hafızasının zayıf ve güçsüz olduğunu ve İbn Ma'in'in onu yalancı olarak nitelendirdiğini belirtir (el-Tamhid 16/211). {cite:muwatta-maruf-1997 s.158}"
  id: "Diriwayatkan oleh Malik dari Safwan ibn Salim, dari Ata ibn Yasar, dari Abu Sa'id al-Khudri, dalam surah tentang praktik mandi wajib pada hari Jumat: Nabi bersabda, \"Mandi wajib pada hari Jumat adalah wajib bagi setiap laki-laki dewasa.\" Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (879, 895), Muslim (3/3), Abu Dawud (341), al-Nasa'i (3/93), Ibn Hibban, Ibn Khuzaymah, Ahmad, dan al-Shafi'i, melalui sanad para sahabat Malik. Ia mengutip Ibn Abd al-Barr yang mengatakan bahwa para perawi al-Muwatta' tidak berbeda pendapat mengenai sanadnya, dan bahwa Bakr ibn al-Sharud meriwayatkannya dari Malik dengan sanad lain, yang merupakan kesalahan. Ia juga menyatakan bahwa Bakr memiliki daya ingat yang buruk dan lemah, dan bahwa Ibn Ma'in menyatakan dia sebagai pembohong (al-Tamhid 16/211). {cite:muwatta-maruf-1997 p.158}"
