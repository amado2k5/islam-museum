text: "… كثيراً ما أسمعه يقول : إن اللّٰه لم يقبض نبياً حق يخيره قالت فلما حضر رسول اللّٰه كان آخر كلة سمعتها منسه يقول : بل الرفيق الأعلى من الجنة فقلت إذا والله لا يختارنا وعرفت أنه الذى كان يقول انا …"
