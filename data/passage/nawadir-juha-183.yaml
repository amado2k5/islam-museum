text: "نوادر جحا الكبرى الحقيقةِ تماماً، فالطيرُ الذي كُنَّا نبيعُهُ أمس ليس بطائرٍ مصبوغٍ كما زعمْتَ بل هو لونه الذي خلقه اللَّهُ به، وهو الطائر المسمى بالببغاء. فأجابه الشيخ: أوَ ليس هو طائراً. فما هي فائدتُهُ وما هي معارفُهُ؟ فأجابوه: إنّ …"
summary:
  ar: "حاول جحا في السوق بيع ديك بإثني عشر قرشًا، بعد أن رأى طائرًا ملونًا يُباع بإثني عشر ذهبًا؛ فقال الناس إن الطائر ببغاء يتكلم؛ فقال جحا إن كانت الببغاء تتكلم فالديك يفكر جيدًا. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  en: "At market Juha tries to sell a rooster at twelve piastres, after seeing a coloured bird sold for twelve gold coins; the crowd says the bird is a parrot who talks; Juha says if the parrot talks, the rooster thinks well. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  ur: "بازار میں جحا نے ایک رنگین پرندہ بارہ سونے کے سکوں میں بکتے دیکھ کر اپنا مرغ بارہ قرش میں بیچنا چاہا؛ لوگوں نے کہا کہ وہ پرندہ طوطا ہے جو بولتا ہے؛ جحا نے کہا کہ اگر طوطا بولتا ہے تو مرغ خوب سوچتا ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  fr: "Au marché, après avoir vu un oiseau coloré vendu douze pièces d'or, Juha essaie de vendre son coq douze piastres; la foule dit que l'oiseau est un perroquet qui parle; Juha dit que si le perroquet parle, le coq réfléchit bien. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  es: "En el mercado, tras ver un pájaro de colores vendido por doce monedas de oro, Juha intenta vender su gallo por doce piastras; la gente dice que el pájaro es un loro que habla; Juha dice que, si el loro habla, el gallo piensa bien. {cite:juha-nawadir-kubra-djuwaydi p. 83}"
  tr: "Juha, pazarda rengarenk bir kuşun on iki altın paraya satıldığını görünce, kendisi de on iki piaster karşılığında bir horoz satmaya çalıştı. İnsanlar kuşun konuşan bir papağan olduğunu söylediler, bunun üzerine Juha, \"Eğer bir papağan konuşabiliyorsa, o zaman bir horoz da çok iyi düşünüyor olmalı.\" diye cevap verdi. {cite:juha-nawadir-kubra-djuwaydi s. 83}"
  id: "Juha mencoba menjual seekor ayam jantan seharga dua belas piaster di pasar, setelah melihat seekor burung berwarna-warni dijual seharga dua belas koin emas. Orang-orang mengatakan burung itu adalah burung beo yang bisa berbicara, jadi Juha menjawab, \"Jika burung beo bisa berbicara, maka seekor ayam jantan pasti berpikir dengan sangat baik.\" {cite:juha-nawadir-kubra-djuwaydi p. 83}"
