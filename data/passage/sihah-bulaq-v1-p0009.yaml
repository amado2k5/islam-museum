text: |-
  ٦٣٢
  (باب العين
  (وكع
  وموقعة الطائر بفتح لقاف الموضع الذى يقع عليه وميقعة البازى الموضع الذى يألفه
  فيقع عليه والميقعة أيضاخشبة القصار التى يدق عليها والميقعة الممارقة قال ابن حلزة
  أغى الى سرف مذكرة • تهص الحصى بمواقع انخنس
  وقول الشاعر
  دافت له بايض مشر فى • كأن، لى. واقع) غبارا
  يعنى بدهواقع الميقعة ويقال الميقعة المسسن الطويل والوقع بالسكين المكان المرتفعمن
  المبل عن أبى عمرو والوقع باتهريك الحجارة واحدتها وقعة والوقع أيضاامفى يقسال وقع
  الرجل يوقع إذا اشتكى لحم قدمه من غاظ الارض والجارة ومنه قول الشاءر
  كل المسداء يحتسذى الحافى الوقع والوقسع أيضا السماب الرقيق والحافر الوقيع الذى
  أصابته ايلجارة فرققته والوقيع ن السيوف مشحذ بالجر وسكين وقبع أى حديدوقع
  بالميقعة يقال قع حديدك قال لشماخ نواجذ هن كالحد إالوقيع والوقائع المنقع
  والوقيعة فى الناس الغيبة والوقيعة القتال والمع لوقائع وقال أبوصاء-د الوقيعة نقرة
  فى متنجمرفى سهسل أوجبل يستنقع فيها الماء وهى تصغر وتعظم -ق تجارز حد الوقيعة
  فتكون وقيطا قال ابن آحر
  الزاجر العيس فى الامليس أعينها • مثل الوقئع فى انصاف ا السمل
  ويقال كويته وقاع منسل قطام قال أبوعبسد هى الدائرة على الجاءرتين وحينما كانت
  لا تكون الاادارة يعنى ليس لهاموضع معلوم وقال وف بن الاحوص
  وكنت اذامنيت بخصم سو• • دلفت له فأكو يه وقاع
  ووقعت بالة وم فى القتال وأوقعت ج-م بمعى ويقال أيضا أرقع فلان بفلان مايسوء.
  وواقعوهم فى لق ال مواقعة ووقاعار وقعتم ن كذاومن كذا وقعا ووقع الشئء وقوعاسط
  وأوقعه غيره وأه_ل الكوفة يسمون الفعل المتعدى واقعاوبقمال وقع ربيع بالارس ولا
  يقال سقط ووتعت السكين أحددتهوحافره وقوع مثل وقيع ومنه قول رؤبة
  بكل موقوع الذسور أخلقا ووقع فى الناس وقيعة أى اغتابهم وهورجل وقاع ووقاعة
  يغتاب الناس ووقع الط تروقوعاوانه لح-ن الوقعة بالكسر والنسر الواقع نجم وتوقعت
  الشئء واستوقعته أى انتظرت كونه والتوقيع ما يوقع فى الكتاب بقال السرور توقيع
  جازوط ريق موقع أى مذلل ويقال رجل موقع للذى أصابته البلايا وكذلك البعير قال
  الشاعر
  فامنكم أفناء بكرين وائل • لغارتنا الاذلول موقع
  والتوقيع أيضا اقبال الصيقل على السيف بميقعته يحدده وسكين موقع أى محدّد ومرماة
  موقعة والتوقيع الدبرواذا كثر باالبعير الدبر قيل انه لموقع الظهر وأنشدابن الاعرابى
  مثل الحار الموقع الظهرلا • يحسن منيا الااذاضربا
  والتوق يع أيضاتطنى الشى وتوهمه يقال وقع أى ألق ظنك على الشئ كع
  سقاه وكيح وفرس وكيع أى صلب شد يدوقد وكع بااضم وأوكهه غيره ومنه قول الشاعر
  على ان مكتوب العجال وكبع يعنى-اء اللبن والوكع بلتحريك اقبال الابهام على السبابة
  من الرجل-قبرى أصلها خارجا كالعقدة يقال رجل أوكع وامرأة وكعاء وربا قالواعبد
  اوكع
