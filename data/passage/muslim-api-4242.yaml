label: { ar: "صحيح مسلم 4242 — الأب والأبوة", en: "Sahih Muslim 4242 — the father and fatherhood", ur: "صحیح مسلم 4242 — باپ اور والدیت" }
text: "وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، وَابْنُ، بَشَّارٍ قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، قَالَ سَمِعْتُ الْعَلاَءَ، يُحَدِّثُ عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ أَنَّهُ نَهَى عَنِ النَّذْرِ وَقَالَ \" إِنَّهُ لاَ يَرُدُّ مِنَ الْقَدَرِ وَإِنَّمَا يُسْتَخْرَجُ بِهِ مِنَ الْبَخِيلِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4242، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 4242 (The Book of Vows), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 4242، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
