label: { ar: "سنن ابن ماجه 1921 — الأب والأبوة", en: "Sunan Ibn Majah 1921 — the father and fatherhood", ur: "سنن ابن ماجہ 1921 — باپ اور والدیت", es: "Sunan Ibn Majah 1921 — El padre y la paternidad" }
text: "حَدَّثَنَا إِسْحَاقُ بْنُ وَهْبٍ الْوَاسِطِيُّ، حَدَّثَنَا الْوَلِيدُ بْنُ الْقَاسِمِ الْهَمْدَانِيُّ، حَدَّثَنَا الأَحْوَصُ بْنُ حَكِيمٍ، عَنْ أَبِيهِ، وَرَاشِدِ بْنِ سَعْدٍ، وَعَبْدِ الأَعْلَى بْنِ عَدِيٍّ، عَنْ عُتْبَةَ بْنِ عَبْدٍ السُّلَمِيِّ، قَالَ قَالَ رَسُولُ اللَّهِ ـ \" إِذَا أَتَى أَحَدُكُمْ أَهْلَهُ فَلْيَسْتَتِرْ وَلاَ يَتَجَرَّدْ تَجَرُّدَ الْعَيْرَيْنِ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1921، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1921 (The Chapters on Marriage), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1921، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1921 (Los capítulos sobre el matrimonio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
