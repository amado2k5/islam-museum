label: { ar: "الموطأ 848 — عائشة وحفصة: أصبحتا صائمتين متطوعتين فأُهدي لهما طعام فأفطرتا عليه، فقال النبي: اقضيا مكانه يوماً آخر", en: "Muwatta 848", es: "Muwatta 848", fr: "Muwatta 848", ur: "موطا 848", tr: "Muvatta 848 — Aişe ve Hafsa: Gönüllü bir oruç tutmaya başladılar, sonra kendilerine yemek verildi ve oruçlarını onunla açtılar. Peygamberimiz şöyle buyurdu: \"Onu başka bir gün kaza edin.\"", id: "Al-Muwatta 848 — Aisyah dan Hafsa: Mereka memulai puasa sunnah, kemudian diberi makanan, lalu mereka berbuka puasa dengan makanan itu. Nabi bersabda: Gantilah puasa itu di hari lain." }
text: "اقضيا مكانه يوماً آخر"
summary:
  ar: "أول حديث في باب قضاء التطوع. يرويه مالك عن ابن شهاب، أن عائشة وحفصة زوجي النبي أصبحتا صائمتين متطوعتين، فأُهدي لهما طعام فأفطرتا عليه، فدخل عليهما رسول الله، فقالت حفصة وكانت بنت أبيها: يا رسول الله، إنا أصبحنا صائمتين متطوعتين فأُهدي لنا طعام فأفطرنا عليه، فقال: اقضيا مكانه يوماً آخر. ويذكر المحقق أن مالكاً رواه منقطعاً بين الزهري وعائشة وحفصة، وأن الصحيح المحفوظ هو المنقطع كما قرره أبو زرعة وأبو حاتم، وأن الموصول رواه بعض أصحاب الزهري عن عروة عن عائشة، ويحيل على الترمذي (735) والتمهيد (12/66). {cite:muwatta-maruf-1997 p.410} {cite:muwatta-maruf-1997 p.411}"
  tr: "Gönüllü oruçların kaza edilmesi bölümündeki ilk hadis. Malik, İbn Şihab'dan rivayet ettiğine göre, Peygamberimizin eşleri Ayşe ve Hafsa gönüllü oruç tutmaya başlamışlardı. Onlara hediye olarak yemek verildi ve oruçlarını onunla açtılar. Resulullah yanlarına girdi ve babasının yakın arkadaşı olan Hafsa şöyle dedi: \"Ey Resulullah, biz gönüllü oruç tutmaya başladık ve bize hediye olarak yemek verildi ve oruçlarımızı onunla açtık.\" Resulullah şöyle buyurdu: \"O günü başka bir gün kaza edin.\" Araştırmacı, Malik'in bu hadisi Zühri, Ayşe ve Hafsa arasında kopuk bir isnad zinciriyle rivayet ettiğini ve doğru ve korunmuş olanın, Ebu Züra ve Ebu Hatim'in de tespit ettiği gibi, kopuk isnad zincirine sahip olan olduğunu belirtiyor. Bağlı olan rivayet ise Zühri'nin bazı sahabeleri tarafından Urve'den, o da Ayşe'den rivayet edilmiştir. Tirmizi (735) ve Temhid'den (12/66) söz eder. {cite:muwatta-maruf-1997 s.410} {cite:muwatta-maruf-1997 s.411}"
  id: "Hadits pertama dalam bab tentang mengganti puasa sunnah. Diriwayatkan oleh Malik dari Ibnu Shihab, bahwa Aisyah dan Hafsa, istri-istri Nabi, memulai puasa sunnah. Mereka diberi makanan sebagai hadiah, dan mereka berbuka puasa dengan makanan itu. Rasulullah SAW mendatangi mereka, dan Hafsa, yang merupakan sahabat dekat ayahnya, berkata: “Wahai Rasulullah, kami memulai puasa sunnah, dan kami diberi makanan sebagai hadiah, dan kami berbuka puasa dengan makanan itu.” Beliau bersabda: “Gantilah puasa yang hilang itu di hari lain.” Peneliti menyebutkan bahwa Malik meriwayatkan hadits ini dengan sanad yang terputus antara al-Zuhri dan Aisyah serta Hafsa, dan bahwa versi yang benar dan lestari adalah versi dengan sanad yang terputus, sebagaimana telah ditetapkan oleh Abu Zur’ah dan Abu Hatim. Versi yang terhubung diriwayatkan oleh beberapa sahabat al-Zuhri dari Urwah dari Aisyah. Dia merujuk pada al-Tirmidzi (735) dan al-Tamhid (12/66). {kutip:muwatta-maruf-1997 hal.410} {kutip:muwatta-maruf-1997 hal.411}"
