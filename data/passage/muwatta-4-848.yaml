label: { ar: "الموطأ 848 — عائشة وحفصة: أصبحتا صائمتين متطوعتين فأُهدي لهما طعام فأفطرتا عليه، فقال النبي: اقضيا مكانه يوماً آخر", en: "Muwatta 848" }
text: "اقضيا مكانه يوماً آخر"
summary:
  ar: "أول حديث في باب قضاء التطوع. يرويه مالك عن ابن شهاب، أن عائشة وحفصة زوجي النبي أصبحتا صائمتين متطوعتين، فأُهدي لهما طعام فأفطرتا عليه، فدخل عليهما رسول الله، فقالت حفصة وكانت بنت أبيها: يا رسول الله، إنا أصبحنا صائمتين متطوعتين فأُهدي لنا طعام فأفطرنا عليه، فقال: اقضيا مكانه يوماً آخر. ويذكر المحقق أن مالكاً رواه منقطعاً بين الزهري وعائشة وحفصة، وأن الصحيح المحفوظ هو المنقطع كما قرره أبو زرعة وأبو حاتم، وأن الموصول رواه بعض أصحاب الزهري عن عروة عن عائشة، ويحيل على الترمذي (735) والتمهيد (12/66). {cite:muwatta-maruf-1997 p.410} {cite:muwatta-maruf-1997 p.411}"
