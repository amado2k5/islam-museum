text: |-
  ٣١٢
  • (فصل العين
  شأن هذه الحروف أن تعجم وأعجمت الكتاب خلاف قولك أعر بته قال رؤبة
  الشعرلا يطيعه من يظاء • ريد أن يعر به فيعجمه
  أى ياتى به أعجميايعى يلهن فيه قال الفراء رفعسه على الضالفة لانه يريد أن يعر به ولا يريد
  أن يعجمه وقال الاخفش لوقوعه موقع المرفوع لانه أراد أن يقول يريد أن يعربه فيق-ع
  موقع الاعمام فلما وضع قولد فيعجم موضع قوله فيقع رفعه وأنشد الفراء
  الدارأقوت بعد محرنجم • مَن معرب فيها ومن معجم
  وباب معجم أى مقفل به واستحجم عليه الكلام استبهم أبو عر والعجمجمة من الذوق الشديدة
  مثل العثمثمة وأنشد
  بان يبارى ورشات كالقطاء عجمجمات حشفاتحت السرى.
  ⁦(عجرم)⁩ العجرم بالكسر القصير مع شدة والعجارم بالضم الرجل الشديد وربعاكنى عن الذكر
  بذلك والعجرمة بالكسر شجرة والعجرمة بالفتح الاسراع ⁦(عدم)⁩ عدمت الشى بالكسر
  أعدمه عدما باتحريك على غيرقياس اى فقدته والعدم أيضا الفقروكذلك العدم اذافهمت
  أوله خففت وان قحت ثقلت وكذلك الجد والجد و الصلب والصاب والرشدوالرشد والحزن
  والحزن قال الشاعر متهال بنعم :لامتباعد • سيان منه الوفر والعدم
  وقال آخر
  واقدعات لتأقينّ عشية * مابعدها خوف علىّ ولاعدم
  وأعدمه اللّه وأعدم الرجل افتة رفهو معدم وعديم ويقال ما بعدمنى هذا الامر أى
  مايعدونى قال لبيد
  واقد أغدووما يعدمنى • صاحب غيرطويل الحنبل
  يقول ليسممى أحد غيرن غسى وفردى والعدائم نوع من الرطب يكون بالمدينسة يجى آخر
  الرطب وعدامة ماءلبف جشم والعندم البقم ويقالى دم الاخوين وقال
  أماود ما ماترات تخالها • على قنة العزى وبالتسبر عندماً
  ذم العذم العضّ والا كل بجفا يقال فرس عذوم للذى يعذم بأسنانه أى يكدم
  والعدم اللوم والأخذ باللسان قال أبوخراش
  . يعود على ذى الجهل بالحلم والنهى • ولم يك حاشاعلى الجارذاعذم
  والاسم العذيمة والمع العذائم قال الراجزه يظل من جاراه فى عذائم وعذمه عن نفسه
  دفعه (عرم العرم المسناة لا واحدلها من لفظها ويقال واحدها عرمة وعرمت
  العظم أعرمه وأعر مه ءرما اذا عرقته وكذلك عرمت الابل الشجرناات منه والعرام بالضم
  العراق من العظم والشجر وتعرمت العظم تعرقته وصبتعارم بين الهرام بالضم أى شرس
  وقد عوم يع رم ويعرم عرامة بالفتح وقال • دبت عليها عارمات الانبار * أى خبيئاتها
  ويروى ذريات والعرم العارم والاعرم الذى فيسه سواد وبياض وبيض القطاعرم وحية
  عرماء وقطيع أعرم بين العرم اذا كان ضأنا ومعزى وقال يصف امر أة راعية
  حياكة وسط القطبع الاعرم * والعرمة بساض يكون بمرمة الشاة والعرمة بالتحربك
  مجتمع رمل والعرمة الكدس الذى بجع بعد ماديس ليذرى قال الراجز
  يدق معزاء الطريق الفازر * دق الدياس عرم الانادر
  والعريه
