text: |-
  ٣٥٠
  .أث),,
  ما أضيف انيما وقيل عوّ اليمامة والنسبة الى المامة يمامى واليمّ البحر وقديم الرجل فهو
  ميموم اذاطرح فى البحر تم اليتم بالتحر يك ضرب من التبت الواحدة ينمة وم
  اليوم معروف والجمع آيام وأصله ايوام فأدغم قال الاخفس فى قوله نعالى أسس على التقوى
  من آول يوم قال من أول الايام كاهول اقست كل رجل تريد كل الرجال وعاماته ماومة كما
  تقول مشاهرة وربما عبروا عن الشدة باليوم يقال يوم أيوم كاية ال ليلة ليلاء قال الراجز
  نعم أخو الهيجاء فى اليوم اليي * وهو مقلوب منه أخر الواوقدّم الميم ثم قلب الواوياء
  حيث صارت طرفا كما قالوا أدل فى جمع دلو ويام وخارف قبيلتان من اليمن ويام ابن نوح عليه
  السلام غرق فى الطوقان ( ٣م ابن السسكيت الايهمان عند أهل البادية السيل
  والجل الهاتج الصول يتعودمنهما وهما الاعمان قال وعمد أهل الامصار السل والحريق
  قال أبو عبيد وانماسمى أيهم لانه ليس مما يستطاع دفعه ولا يتعاق فيكام أو يستعتب واهذا
  فيل للفلاة التى لا يهتدى فيها الطريق يهماء وللبرأيهم قال الاعشى
  ويهماء بالليل غطئى الفلاة يؤنسى صوت فيادها.
  والايهم من الرجال الاصم والايهم الشجاع وجبلة بن الايهم آخرملوك عُسان
  باسب النون
  صل الالف ⁦( ا ن)⁩ أيبه بذى يأبنه ويأبنه اتهمهبه والابنة بالضم العقدة
  فى العود ومنه قول الاعشى * قضيب سراء كثير الابن • ويقال أيضايينه-م أبن أى عداوات
  وفلاث يؤبن بكذا أى يذكر يقبيح وفى ذكر مجاس رسول اللّٰه صلى اللّٰه عليه وس-لم لا توبن فيه
  الحرم أى لايذ كرن بسوء أبوزيد أبنت الشئ رقبته قال أوس يصف الجمار
  يقول له الراون هذاكراكب * يؤين شخصافوق عليا واقفة
  وقال الاصمعى التأبين أن تقفو أثر الشئ وأبذت الرجدل تأيينا اذا بكيته وأثقيت عليه بعد
  الموت قال رقية • فامدح بلا لا غير مامو"بن" يقول غير هالك أى غيرمبكة" و~:«قول لبيد
  وأبنام لاعب الرماح * ومدرة الكتيبة الرداح
  واتان الشئ بالكسر والتشديد وقته وأوانه يقال كل الفوا كدى ابانها أى فى وقتراو أبإنان
  جبلان قال بشريصف الظعائن
  توم بها الحداة مياه غفل • وفيها عن أبانين ازورار
  واغاقيل أبانان وأبان أحدهما والآخر متالع كايقال القمران قال لبيد
  درس المنايمتالع قابات • فتقادمت بالحس فالسوبان
  وتول هذان أبانان حسنين تنصب النعت لانه نكرة وصفت به معرفة لان الاماكان
  لا تزول فصارا كالشئ الواحد وخالفا الحيوان فأذ اقلت هذان زيدان حسفان ترفع النعت
  ههتا لانه نكرة وصفت بدنكرة ⁦(أتن )⁩ الاتان الحمارة ولا تقل أتانة وثلاث آتن مثل عناق
  وأعنق والكثير أتن وأتن والمأنوناء الاتن مثل المعيوراء واستأتن الرجل اشتره أتانا
  واتخذها لنفسبه وقولهم كان مارافاستأتن أى صار أنا نا يضرب (جمل يهون بعد العز
