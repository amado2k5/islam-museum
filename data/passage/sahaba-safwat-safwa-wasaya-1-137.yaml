text: "… في صدري - وكانت امرأة جلدة - قالت: إليك؛ لا أرض لك! قال: فقلت: إن رسول اللّٰه قد عزم عليك؟ قال: فوقفت وأخرجت ثوبين معها فقالت: هذان ثوبان جئت بهما لأخي حمزة، فقد بلغني مقتله، فكفنوه بهما. قال: فجئنا بالثوبين …"
