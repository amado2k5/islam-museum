label: { ar: "جامع الترمذي 3891 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3891 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3891 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 3891 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 3891 — mentions de nations, de religions et de peuples non musulmans" }
text: "حَدَّثَنَا عَبَّاسٌ الْعَنْبَرِيُّ، قَالَ حَدَّثَنَا يَحْيَى بْنُ كَثِيرٍ الْعَنْبَرِيُّ أَبُو غَسَّانَ، قَالَ حَدَّثَنَا سَلْمُ ابْنُ جَعْفَرٍ وَكَانَ ثِقَةً عَنِ الْحَكَمِ بْنِ أَبَانَ، عَنْ عِكْرِمَةَ، قَالَ قِيلَ لاِبْنِ عَبَّاسٍ بَعْدَ صَلاَةِ الصُّبْحِ مَاتَتْ فُلاَنَةُ لِبَعْضِ أَزْوَاجِ النَّبِيِّ فَسَجَدَ فَقِيلَ لَهُ أَتَسْجُدُ هَذِهِ السَّاعَةَ فَقَالَ أَلَيْسَ قَدْ قَالَ رَسُولُ اللَّهِ \" إِذَا رَأَيْتُمْ آيَةً فَاسْجُدُوا \". فَأَىُّ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3891، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3891 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3891، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3891 (Capítulos sobre las virtudes), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3891 (Chapitres sur les vertus), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, les religions, les sectes et les peuples non musulmans."
