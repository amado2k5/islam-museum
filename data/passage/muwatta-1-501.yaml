label: { ar: "الموطأ 501 — مالك: يخرج الإمام من منزله قدر ما يبلغ مصلاه وقد حلت الصلاة", en: "Muwatta 501", es: "Muwatta 501", fr: "Muwatta 501", ur: "موطا 501", tr: "El-Muvatta 501 — Malik: İmam evinden ancak namaz kılacağı yere kadar çıkar ve namaz vakti gelmiştir.", id: "Al-Muwatta 501 — Malik: Imam hanya meninggalkan rumahnya sejauh yang bisa ia capai di tempat shalatnya, dan waktu shalat telah tiba." }
summary:
  ar: "أول قول في باب غدو الإمام يوم العيد وانتظار الخطبة. يقول يحيى: قال مالك: مضت السنة التي لا اختلاف فيها عندنا في وقت الفطر والأضحى أن الإمام يخرج من منزله قدر ما يبلغ مصلاه وقد حلت الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.256}"
  tr: "İlk olarak imamın bayram günü dışarı çıkıp hutbeyi beklemesiyle ilgili bir açıklama var. Yahya şöyle diyor: Malik şöyle buyurdu: \"Bizim aramızda ihtilaf bulunmayan yerleşik uygulama şudur ki, Ramazan Bayramı ve Kurban Bayramı vakitleri konusunda imam evinden ancak namaz kılacağı yere kadar çıkar ve namaz vakti gelir.\" Araştırmacı, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.256}"
  id: "Pernyataan pertama mengenai imam yang keluar rumah pada hari raya Idul Fitri dan menunggu khutbah. Yahya berkata: Malik berkata: Kebiasaan yang telah ditetapkan, yang tidak ada perbedaan pendapat di antara kita, mengenai waktu Idul Fitri dan Idul Adha, adalah bahwa imam hanya meninggalkan rumahnya sejauh ia dapat mencapai tempat shalatnya, dan waktu shalat telah tiba. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.256}"
