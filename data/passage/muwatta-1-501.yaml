summary:
  ar: "أول قول في باب غدو الإمام يوم العيد وانتظار الخطبة. يقول يحيى: قال مالك: مضت السنة التي لا اختلاف فيها عندنا في وقت الفطر والأضحى أن الإمام يخرج من منزله قدر ما يبلغ مصلاه وقد حلت الصلاة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.256}"
