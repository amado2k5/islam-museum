label: { ar: "جامع الترمذي 3338 — الحساب", en: "Jami' al-Tirmidhi 3338 — the reckoning", ur: "جامع ترمذی 3338 — حساب", es: "Jami' al-Tirmidhi 3338 — el ajuste de cuentas", fr: "Jami' al-Tirmidhi 3338 — le jugement", tr: "Cami' el-Tirmizi 3338 — Hesap", id: "Jami' al-Tirmidhi 3338 — Catatan" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ عُبَيْدٍ الْهَمْدَانِيُّ، حَدَّثَنَا عَلِيُّ بْنُ أَبِي بَكْرٍ، عَنْ هَمَّامٍ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، عَنِ النَّبِيِّ قَالَ \" مَنْ حُوسِبَ عُذِّبَ \". قَالَ وَهَذَا حَدِيثٌ غَرِيبٌ لاَ نَعْرِفُهُ مِنْ حَدِيثِ قَتَادَةَ عَنْ أَنَسٍ عَنِ النَّبِيِّ إِلاَّ مِنْ هَذَا الْوَجْهِ."
summary:
  ar: "حديث في جامع الترمذي، رقم 3338، يذكر الحساب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Jami' al-Tirmidhi, no. 3338 (Chapters on Tafsir), that speaks of the reckoning. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "جامع ترمذی کی حدیث نمبر 3338، جس میں حساب کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3338 (Capítulos sobre Tafsir), que habla del cálculo. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3338 (Chapitres sur le Tafsir), évoque le calcul des comptes. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptent, écrivent, effacent ou pèsent un acte."
  tr: "Cami' el-Tirmizi'de 3338 numaralı hadis, hesaplaşmadan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3338, menyebutkan tentang perhitungan amal. Perhitungan ini menggabungkan daftar amal baik dan buruk dengan teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
