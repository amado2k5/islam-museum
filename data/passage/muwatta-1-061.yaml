label: { ar: "الموطأ 61 — أكل من فضل الطعام ثم صلى ولم يتوضأ", en: "Muwatta 61", es: "Muwatta 61", fr: "Muwatta 61", ur: "موطا 61", tr: "Al-Muwatta 61 — Artan yemeklerden yedi, sonra abdest almadan namaz kıldı.", id: "Al-Muwatta 61 — Dia memakan sisa makanan, lalu shalat tanpa berwudhu." }
text: "ثم أتي بفضل ذلك الطعام فأكل منه ثم صلى ولم يتوضأ"
summary:
  ar: "يرويه مالك عن محمد بن المنكدر مرسلاً، في باب ترك الوضوء مما مست النار: دُعي النبي إلى طعام فقُرّب إليه خبز ولحم فأكل ثم توضأ ثم صلى، ثم أُتي بما بقي من ذلك الطعام فأكل ثم صلى ولم يتوضأ. وينقل المحقق عن ابن عبد البر أنه مرسل في الموطأ عند جميع الرواة، وأن من أسنده عن مالك عن ابن المنكدر عن جابر ضعفاء لا يُحتج بهم، والصواب عن مالك إرساله، لكن الثقات رووه عن ابن المنكدر عن جابر مسنداً ⁦(التمهيد 12/273)⁩؛ ويعدّ المحقق منهم معمراً وابن عيينة وابن جريج وغيرهم، ويخرّج الموصول عند الترمذي (80) وفي الشمائل وأبي يعلى وابن حبان والبيهقي. {cite:muwatta-maruf-1997 p.63}"
  tr: "Malik, Muhammed ibn el-Munkadir'den rivayetle, ateşte pişirilmiş yemek yedikten sonra abdest almamak bölümünde, mursal bir hadis olarak şöyle aktarır: Peygamber bir yemeğe davet edildi ve kendisine ekmek ve et getirildi. Yedikten sonra abdest aldı ve namaz kıldı. Sonra kalan yemek getirildi ve yine abdest almadan yedi ve namaz kıldı. Editör, İbn Abd el-Barr'ın, Muwatta'da tüm ravilere göre mursal olduğunu ve Malik'ten, İbn el-Munkadir'den, Cabir'den rivayet edenlerin zayıf olduğunu ve rivayetlerinin güvenilir sayılmadığını söylediğini aktarıyor. Malik'ten rivayet edilen doğru versiyon mursaldır. Bununla birlikte, güvenilir raviler bunu İbn el-Munkadir'den, Cabir'den rivayetle, bir isnad zinciriyle aktarmışlardır (el-Tamhid 12/273). Editör aralarında Ma'mer, İbn 'Uyeyne, İbn Cüreyc ve diğerlerini içerir. Ayrıca et-Tirmizi (80), el-Şema'il, Ebu Ya'la, İbn Hibban ve el-Beyhaki'deki bağlantılı versiyonu da içermektedir. {cite:muwatta-maruf-1997 s.63}"
  id: "Malik meriwayatkan hadits ini berdasarkan riwayat Muhammad ibn al-Munkadir sebagai hadits mursal, dalam surah tentang tidak berwudhu setelah makan makanan yang dimasak di atas api: Nabi diundang makan, dan roti serta daging dihidangkan kepadanya. Beliau makan, kemudian berwudhu dan shalat. Kemudian, sisa makanan dihidangkan kepadanya, dan beliau makan serta shalat tanpa berwudhu lagi. Editor mengutip Ibn Abd al-Barr yang mengatakan bahwa hadits ini mursal dalam kitab Muwatta' menurut semua perawi, dan bahwa mereka yang meriwayatkannya dengan sanad dari Malik, dari Ibn al-Munkadir, dari Jabir adalah lemah dan riwayat mereka tidak dianggap dapat diandalkan. Versi yang benar berdasarkan riwayat Malik adalah bahwa hadits ini mursal. Namun, perawi yang terpercaya meriwayatkannya berdasarkan riwayat Ibn al-Munkadir, dari Jabir, dengan sanad (al-Tamhid 12/273). Redaksinya antara lain Ma'mar, Ibnu 'Uyaynah, Ibnu Jurayj, dan lain-lain. Ia juga memasukkan versi sambung dalam al-Tirmidzi (80), al-Shama'il, Abu Ya'la, Ibnu Hibban, dan al-Bayhaqi. {mengutip:muwatta-maruf-1997 hal.63}"
