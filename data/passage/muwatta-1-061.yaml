label: { ar: "الموطأ 61 — أكل من فضل الطعام ثم صلى ولم يتوضأ", en: "Muwatta 61" }
text: "ثم أتي بفضل ذلك الطعام فأكل منه ثم صلى ولم يتوضأ"
summary:
  ar: "يرويه مالك عن محمد بن المنكدر مرسلاً، في باب ترك الوضوء مما مست النار: دُعي النبي إلى طعام فقُرّب إليه خبز ولحم فأكل ثم توضأ ثم صلى، ثم أُتي بما بقي من ذلك الطعام فأكل ثم صلى ولم يتوضأ. وينقل المحقق عن ابن عبد البر أنه مرسل في الموطأ عند جميع الرواة، وأن من أسنده عن مالك عن ابن المنكدر عن جابر ضعفاء لا يُحتج بهم، والصواب عن مالك إرساله، لكن الثقات رووه عن ابن المنكدر عن جابر مسنداً (التمهيد 12/273)؛ ويعدّ المحقق منهم معمراً وابن عيينة وابن جريج وغيرهم، ويخرّج الموصول عند الترمذي (80) وفي الشمائل وأبي يعلى وابن حبان والبيهقي. {cite:muwatta-maruf-1997 p.63}"
