text: "… وَلِفِ هَكَذَا أَنْزِلَتْ. ثم قال النبي للغي أَقرأيا عمر. فقرأت القراءة التي أَقرأَنِي النبي للم، فقال النبي : هَكَذَا أَنْزِلَتْ : ثم قال النبي لغ إِنَّ هَذَا الْقُرْآنَ أُنّْزِلَ عَلَى سَبْعَةِ أَخْرُفٍ. فَأَقْرَأُوا مَا تَيَسَّرَ مِنْهُ. أَخرجه البثلاثة. قلت: قول …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 4، ص 377، يذكر الأحرف السبعة، وقراءات القرآن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 4, p. 377, that mentions the seven ahruf, the readings of the Qur'an; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 4، ص 377 کا اقتباس جس میں سبعہ احرف، قرآن کی قراءتیں کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 4, pág. 377, que menciona los siete ahruf, las lecturas del Corán; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait de l'ouvrage d'Ibn al-Athir, Usd al-Ghaba (tome 4, p. 377), mentionne les sept ahruf, les lectures du Coran; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information est également disponible dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "İbn el-Athir'in Usd el-Ghaba adlı eserinin resimli 4. cildinin 377. sayfasından, Kur'an'ın yedi okuma şeklini ve okunuşlarını anlatan bir bölüm; makineyle okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeden oluşmaktadır. Kur'an okunuşları, yazı, hat sanatı ve diyakritikler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, jilid 4 bergambar, halaman 377, yang menyebutkan tujuh cara pembacaan dan bacaan Al-Quran; dari versi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, aksara, kaligrafi, dan tanda diakritik."
