text: "… متفقٌ عليه. - وعن طَلِحَةَ بن عُيْدِ اللَّهِ، قالَ : جَاءَ رجُلِ إِلى رسُولِ اللَّهِ الَِّام منْ أَهْل نَجْد، ثَائرُ الرَّأَس تَسَمْعُ دِويَّ صَوْتِه، ولا نَفْقَهُ ما يقُولُ، حَتّى دنَّا مِنَ رَسُولَ اللّه لَلِيَام فإذا هُوَ يُسَأَلُ عَن الإِسْلام، فَقَال …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 251، يذكر تعريف الإسلام بأعماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 251, that mentions Islam defined by its acts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 251 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen 3, pág. 251, que menciona el Islam definido por sus actos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de Riyad al-Salihin d'al-Nawawi, volume 3, page 251, mentionnant l'islam défini par ses actes; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin Resimli Cilt 3, sayfa 251'inden bir alıntı, İslam'ı uygulamaları üzerinden tanımlamaktadır; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, İslam'ın temellerini, imanın esaslarını, imanın dallarını ve bir müminin özelliklerini içeren bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid Bergambar 3, halaman 251, mendefinisikan Islam melalui praktik-praktiknya; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
