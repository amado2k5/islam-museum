text: "رسولك زعم (١) كذا في غالب النسخ دون ذكر ترجمة للكتاب ، ووقع في نسخة الملك سعود : ((كتاب الصلاة)) ، وفي النسخة الأفغانية : ((كتاب الوضوء)) ، وعزا الحافظ ابن حجر أحاديث هذا الكتاب إلى (الطهارة)) ، وعزا بعضها"
