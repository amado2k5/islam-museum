  tr: "İbn İshak'ın biyografisinden, İbn Hişam'ın rivayetine göre, 426. sayfada yer alan, zeki ve aptal insanlar hakkında bir hikâyeyi içeren bir bölüm; taranmış, makine tarafından okunabilir versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
