text: "… وَمُحَمَّدُ وَبِبِئْرِ بَذْرٍ إِذْ يَرُدُ وُجُوهَهُمْ حَتَّىٰ رَأَيْتُ لَدَى النَّبِيِّ سَرَاتَهُمْ قِسْمَيْنٍ: نَقْتُلُ مَنْ نَشَاءُ وَنَطْرُذُ سَبْعُونَ : عُتْبَةُ مِنْهُمُ وَالْأَسْوَدُ فَأَقَامَ بِالْعَطَنِ الْمُعَطَّنِ مِنْهُمُ وَأبْنَ الْمُغِيرَةِ قَدْ ضَرَبْنَا ضَرْبَةً فَوْقَ الْوَرِيدِ لَهَا رَشَاشٌ مُزْبِدُ عَضْبٌ بِأَيْدِي الْمُؤْمِنِينَ مُهَنَّدُ وَأُمَيَّةُ …"
