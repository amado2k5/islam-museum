summary:
  ar: "القسم 16 من سنن أبي داود في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الضحايا»، ويضم فيها النصوص من 2788 إلى 2843 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 16 of Sunan Abi Dawud (Sacrifice (Kitab Al-Dahaya)) in the division of the open hadith dataset the museum took its reports from: reports 2788 to 2843 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن ابی داؤد کی کتاب 16، عنوان «کتاب الضحایا»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 2788 تا 2843۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 16 de Sunan Abi Dawud (El Sacrificio (Kitab Al-Dahaya)) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 2788 al 2843, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sunan Abi Dawud (Sacrifice), livre 16, qui comprend les hadiths 2788 à 2843 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı Sunan Abi Davud'un 16. bölümü, açık hadis veritabanının bölümlerine ayrılmıştır ve \"Kurbanlar Kitabı\" başlığını taşımaktadır. Bu bölüm, sırasıyla numaralandırılmış 2788 ila 2843 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 16 dari Sunan Abi Dawud, yang menjadi sumber catatan museum, dibagi menjadi beberapa bagian dari basis data hadits terbuka dan diberi judul \"Kitab Para Korban\". Bagian ini berisi teks 2788 hingga 2843, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
