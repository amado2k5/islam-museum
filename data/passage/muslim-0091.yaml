label: { ar: "مسلم 91 — لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر", en: "Muslim 91 — No one with an atom's weight of pride enters Paradise", es: "Musulmán 91 — Nadie con un mínimo de orgullo entra en el Paraíso", fr: "Muslim 91 — Nul ne peut entrer au Paradis avec le poids d'un atome d'orgueil", ur: "مسلم 91 - ذرہ برابر تکبر والا جنت میں نہیں جائے گا۔", tr: "Müslim 91 — Kalbinde zerre kadar kibir bulunan kimse cennete giremeyecektir.", id: "Muslim 91 — Barangsiapa memiliki kesombongan seberat atom di dalam hatinya, ia tidak akan masuk surga." }
text: "قال رسول الله: «لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر» قال رجل: إن الرجل يحب أن يكون ثوبه حسناً ونعله حسنة؛ قال: «إن الله جميل يحب الجمال، الكبر بطر الحق وغمط الناس»"
summary:
  ar: "رواية عبد الله بن مسعود في باب تحريم الكبر من كتاب الإيمان في صحيح مسلم؛ حد الجمال وحده الكبر — «بطر الحق وغمط الناس» — من أدق تعريفات الكبر في الدواوين."
  tr: "Sahih Müslim'de yer alan İman Kitabı'ndaki gururun yasaklanması bölümünde Abdullah bin Mesud'un rivayetine göre; güzelliğin sınırı gururdur – \"hakikati reddetmek ve insanları küçümsemek\" – bu, Divanlardaki gururun en doğru tanımlarından biridir."
  id: "Riwayat Abdullah bin Masoud dalam bab tentang larangan kesombongan dari Kitab Iman dalam Sahih Muslim; batas keindahan adalah kesombongan — “menolak kebenaran dan meremehkan orang lain” — adalah salah satu definisi kesombongan yang paling akurat dalam Diwan."
