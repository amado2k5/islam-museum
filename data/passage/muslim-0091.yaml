label: { ar: "مسلم 91 — لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر", en: "Muslim 91 — No one with an atom's weight of pride enters Paradise" }
text: "قال رسول الله: «لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر» قال رجل: إن الرجل يحب أن يكون ثوبه حسناً ونعله حسنة؛ قال: «إن الله جميل يحب الجمال، الكبر بطر الحق وغمط الناس»"
summary:
  ar: "رواية عبد الله بن مسعود في باب تحريم الكبر من كتاب الإيمان في صحيح مسلم؛ حد الجمال وحده الكبر — «بطر الحق وغمط الناس» — من أدق تعريفات الكبر في الدواوين."
