ref: "1.8"
label: { ar: "الموطأ 8 — كتاب عمر إلى أبي موسى في العصر والعشاء", en: "Muwatta 8", es: "Muwatta 8", fr: "Muwatta 8", ur: "موطا 8", tr: "El-Muvatta 8 — Ömer'in Ebu Musa'ya ikindi ve akşam namazlarıyla ilgili mektubu", id: "Al-Muwatta 8 — Surat Umar kepada Abu Musa mengenai salat Asar dan Maghrib" }
text: "صل العشاء ما بينك وبين ثلث الليل، فإن أخرت فإلى شطر الليل، ولا تكن من الغافلين"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى أبي موسى الأشعري أن يصلي العصر والشمس بيضاء نقية بقدر ما يسير الراكب ثلاثة فراسخ، وأن يصلي العشاء فيما بينه وبين ثلث الليل، فإن أخّرها فإلى نصفه، وألا يكون من الغافلين. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.38}"
  en: "Umar's letter to Abu Musa on the afternoon prayer and the recitation in it, and estimating the distance a rider covers."
  es: "La carta de Umar a Abu Musa sobre la oración de la tarde y la recitación que contiene, y sobre cómo calcular la distancia que recorre un jinete."
  fr: "Lettre d'Umar à Abu Musa sur la prière de l'après-midi et la récitation qui y est faite, et estimation de la distance parcourue par un cavalier."
  ur: "ظہر کی نماز اور اس میں قراءت کے بارے میں عمر کا ابو موسیٰ کے نام خط، اور سوار کا فاصلہ طے کرنا۔"
  tr: "Malik'in, Hişam ibn Urva'dan, onun da babasından rivayet ettiği, namaz vakitleri bölümünde yer alan bir rivayete göre: Ömer ibn el-Hattab, Ebu Musa el-Eş'ari'ye yazdığı mektupta, ikindi namazını güneş henüz parlak ve açıkken, bir süvarinin üç fersah (yaklaşık 12 kilometre) yol alabileceği süre boyunca kılmasını, yatsı namazını ise o zamandan gecenin üçte birine kadar veya geciktirirse gecenin ortasına kadar kılmasını ve gafillerden olmamasını öğütlemiştir. Editör, bu rivayetin Malik'ten Ebu Mus'ab el-Zuhri, Suveyd ibn Sa'id ve Yahya ibn Bukayr tarafından, el-Beyhaki'nin de kaydıyla nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.38}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Hisham ibn Urwah, atas otoritas ayahnya, dalam bab tentang waktu shalat: Umar ibn al-Khattab menulis kepada Abu Musa al-Ash'ari memerintahkannya untuk mengerjakan shalat Ashar selagi matahari masih terang dan cerah, selama waktu yang dapat ditempuh oleh seorang penunggang kuda sejauh tiga farsakh (sekitar 12 kilometer), dan mengerjakan shalat Isya antara saat itu dan sepertiga malam, atau jika ia menundanya, maka sampai tengah malam, dan jangan termasuk orang-orang yang lalai. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus'ab al-Zuhri, Suwaid ibn Sa'id, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.38}"
