label: { ar: "الموطأ 8 — كتاب عمر إلى أبي موسى في العصر والعشاء", en: "Muwatta 8" }
text: "صل العشاء ما بينك وبين ثلث الليل، فإن أخرت فإلى شطر الليل، ولا تكن من الغافلين"
summary:
  ar: "أثر يرويه مالك عن هشام بن عروة عن أبيه، في باب وقوت الصلاة: كتب عمر بن الخطاب إلى أبي موسى الأشعري أن يصلي العصر والشمس بيضاء نقية بقدر ما يسير الراكب ثلاثة فراسخ، وأن يصلي العشاء فيما بينه وبين ثلث الليل، فإن أخّرها فإلى نصفه، وألا يكون من الغافلين. ويذكر المحقق أنه رواه عن مالك أبو مصعب الزهري وسويد بن سعيد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.38}"
  en: "Umar's letter to Abu Musa on the afternoon prayer and the recitation in it, and estimating the distance a rider covers."
