text: "وسُئل وهبٌ: عن الأرضين كيف هي؟ قال: هي سبعُ أرضِين مُمهّدةٌ، بين كلِّ أرضين بَحرٌ، والبحرُ الأخضرُ مُحِيطٌ بذلك، والهيكلُ مِن وراءِ البحرِ"
summary:
  ar: "في باب الرد على الجهمية يروي عبد الله بن أحمد عن وهب بن منبه، لما سئل عن الأرضين، أنها سبع أرضين ممهدة بين كل أرضين بحر، والبحر الأخضر محيط بذلك والهيكل وراء البحر؛ والخبر هنا من كلام وهب لا من حديث مرفوع."
  en: "In the chapter refuting the Jahmiyya, Abdullah ibn Ahmad reports Wahb ibn Munabbih answering a question about the earths: seven levelled earths with a sea between each, encircled by the green sea, and the Haykal beyond the sea. This is Wahb's own statement, not a hadith traced to the Prophet."
  es: "En el capítulo que refuta a los Jahmiyya, Abdullah ibn Ahmad relata que Wahb ibn Munabbih respondió a una pregunta sobre las Tierras: siete Tierras niveladas con un mar entre cada una, rodeadas por el Mar Verde, y el Haykal más allá del mar. Esta es una declaración del propio Wahb, no un hadiz atribuido al Profeta."
