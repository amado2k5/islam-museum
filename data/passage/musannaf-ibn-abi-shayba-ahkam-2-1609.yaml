text: "… الحسن، أنه كره أن يعتمد الرجل على شيء في الفريضة إلا من عِلّة وكان لا يرى به بأسا في التطوع. وكان ابن سيرين يكرهه في الفريضة والتطوع. - الرجل يريد السفر من كان يستحب له أن يصلي قبل خروجه - …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 1609، يرد فيه ذكر الفريضة والفرائض، والمستحب، والتطوع، وما كُره؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 1609, whose wording mentions the obligation (farida), the recommended (mustahabb), the voluntary act (tatawwu'), what was disliked; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "مصنف ابن ابی شیبہ، اسکین جلد 2، ص 1609 کا اقتباس جس میں فریضہ اور فرائض، مستحب، تطوع ⁦(نفلی عمل)⁩، جو ناپسند کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
