text: "… تفاوتت فالحكم للراجح بلا خلاف. كما تعقب كثيراً من المصنفين، فمثلاً في ترجمة سويد بن حنظلة قال قال أبو عمر: لا أعلم له غير هذا الحديث، فقال ابن حجر: قلت: أخرجه أبو داود وابن ماجة ولفظه: الْمُسْلِمُ أخُو الْمُسْلِمِ : …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 139، يذكر وصف المسلم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 1, p. 139, that mentions a description of the Muslim; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 1، ص 139 کا اقتباس جس میں مسلمان کا وصف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
