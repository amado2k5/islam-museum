summary:
  ar: "يروي مالك عن يحيى بن سعيد عن ابن شهاب أن رسول الله قام من الليل فنظر في أفق السماء، فقال: ماذا فُتح الليلة من الخزائن؟ وماذا وقع من الفتن؟ كم من كاسية في الدنيا عارية يوم القيامة، أيقظوا صواحب الحجر. {cite:muwatta-maruf-1997 p.500}"
