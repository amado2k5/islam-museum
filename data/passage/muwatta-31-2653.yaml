label: { ar: "الموطأ 2653 — ابن شهاب: النبي ينظر إلى أفق السماء ليلا ويأمر بإيقاظ صواحب الحجر", en: "Muwatta 2653", es: "Muwatta 2653", fr: "Muwatta 2653", ur: "موطا 2653", tr: "El-Muvatta 2653 — İbn Şihab: Peygamber geceleyin gökyüzünün ufkuna bakar ve taştan yapılmış kadınların uyandırılmasını emreder.", id: "Al-Muwatta 2653 — Ibn Shihab: Nabi memandang cakrawala langit di malam hari dan memerintahkan para wanita di atas batu untuk dibangunkan." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد عن ابن شهاب أن رسول الله قام من الليل فنظر في أفق السماء، فقال: ماذا فُتح الليلة من الخزائن؟ وماذا وقع من الفتن؟ كم من كاسية في الدنيا عارية يوم القيامة، أيقظوا صواحب الحجر. {cite:muwatta-maruf-1997 p.500}"
  tr: "Malik, Yahya ibn Sa'id'den, o da İbn Şihab'dan rivayet ettiğine göre, Allah Resulü geceleyin kalkıp gökyüzünün ufkuna baktı ve şöyle buyurdu: \"Bu gece hangi hazineler açıldı? Hangi imtihanlar yaşandı? Bu dünyada giyinik olan kaç kadın kıyamet günü çıplak kalacak! Kadınları odalarında uyandırın.\" {cite:muwatta-maruf-1997 s.500}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id, dari Ibn Shihab, bahwa Rasulullah SAW bangun di malam hari dan memandang cakrawala langit, lalu berkata: \"Harta karun apa saja yang telah terungkap malam ini? Ujian apa saja yang telah terjadi? Betapa banyak wanita yang berpakaian di dunia ini akan telanjang pada Hari Kiamat! Bangunkan para wanita di kamar mereka.\" {cite:muwatta-maruf-1997 p.500}"
