label: { ar: "سنن النسائي 3285 — ما لا يحل", en: "Sunan al-Nasa'i 3285 — what is not lawful", ur: "سنن نسائی 3285 — جو حلال نہیں", es: "Sunan al-Nasa'i 3285 — lo que no es lícito" }
text: "… \". قَالَتْ نَعَمْ لَسْتُ لَكَ بِمُخْلِيَةٍ وَأَحَبُّ مَنْ شَرِكَتْنِي فِي خَيْرٍ أُخْتِي. فَقَالَ رَسُولُ اللَّهِ \" إِنَّ ذَلِكَ لاَ يَحِلُّ \". قَالَتْ أُمُّ حَبِيبَةَ يَا رَسُولَ اللَّهِ وَاللَّهِ لَقَدْ تَحَدَّثْنَا أَنَّكَ تَنْكِحُ دُرَّةَ بِنْتَ أَبِي سَلَمَةَ. فَقَالَ \" بِنْتُ أُمِّ سَلَمَةَ \". قَالَتْ أُمُّ حَبِيبَةَ نَعَمْ. قَالَ رَسُولُ اللَّهِ \" فَوَاللَّهِ لَوْ أَنَّهَا لَمْ تَكُنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 3285، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 3285 (The Book of Marriage), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 3285، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3285 (El Libro del Matrimonio), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
