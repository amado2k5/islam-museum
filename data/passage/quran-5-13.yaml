text: "فَبِمَا نَقْضِهِم مِّيثَـٰقَهُمْ لَعَنَّـٰهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَـٰسِيَةً ۖ يُحَرِّفُونَ ٱلْكَلِمَ عَن مَّوَاضِعِهِۦ ۙ وَنَسُوا۟ حَظًّا مِّمَّا ذُكِّرُوا۟ بِهِۦ ۚ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَآئِنَةٍ مِّنْهُمْ إِلَّا قَلِيلًا مِّنْهُمْ ۖ فَٱعْفُ عَنْهُمْ وَٱصْفَحْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُحْسِنِينَ"
text_search: "فبما نقضهم ميثاقهم لعناهم وجعلنا قلوبهم قاسية ۖ يحرفون الكلم عن مواضعه ۙ ونسوا حظا مما ذكروا به ۚ ولا تزال تطلع على خائنة منهم إلا قليلا منهم ۖ فاعف عنهم واصفح ۚ إن الله يحب المحسنين"
