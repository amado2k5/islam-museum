label: { ar: "سنن أبي داود 324 — الأب والأبوة", en: "Sunan Abi Dawud 324 — the father and fatherhood", ur: "سنن ابی داؤد 324 — باپ اور والدیت", es: "Sunan Abi Dawud 324 — El padre y la paternidad" }
text: "… حَدَّثَنَا مُحَمَّدٌ، - يَعْنِي ابْنَ جَعْفَرٍ - أَخْبَرَنَا شُعْبَةُ، عَنْ سَلَمَةَ، عَنْ ذَرٍّ، عَنِ ابْنِ عَبْدِ الرَّحْمَنِ بْنِ أَبْزَى، عَنْ أَبِيهِ، عَنْ عَمَّارٍ، بِهَذِهِ الْقِصَّةِ فَقَالَ \" إِنَّمَا كَانَ يَكْفِيكَ \". وَضَرَبَ النَّبِيُّ بِيَدِهِ إِلَى الأَرْضِ ثُمَّ نَفَخَ فِيهَا وَمَسَحَ بِهَا وَجْهَهُ وَكَفَّيْهِ شَكَّ سَلَمَةُ وَقَالَ لاَ أَدْرِي فِيهِ إِلَى الْمِرْفَقَيْنِ. يَعْنِي أَوْ إِلَى الْكَفَّيْنِ."
summary:
  ar: "حديث في سنن أبي داود، رقم 324، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 324 (Purification (Kitab Al-Taharah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 324، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 324 (Purificación (Kitab Al-Taharah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
