label: { ar: "سنن ابن ماجه 4076 — الأب والأبوة", en: "Sunan Ibn Majah 4076 — the father and fatherhood", ur: "سنن ابن ماجہ 4076 — باپ اور والدیت" }
text: "حَدَّثَنَا هِشَامُ بْنُ عَمَّارٍ، حَدَّثَنَا يَحْيَى بْنُ حَمْزَةَ، حَدَّثَنَا ابْنُ جَابِرٍ، عَنْ يَحْيَى بْنِ جَابِرٍ الطَّائِيِّ، حَدَّثَنِي عَبْدُ الرَّحْمَنِ بْنُ جُبَيْرِ بْنِ نُفَيْرٍ، عَنْ أَبِيهِ، أَنَّهُ سَمِعَ النَّوَّاسَ بْنَ سَمْعَانَ، يَقُولُ قَالَ رَسُولُ اللَّهِ ـ \" سَيُوقِدُ الْمُسْلِمُونَ مِنْ قِسِيِّ يَأْجُوجَ وَمَأْجُوجَ وَنُشَّابِهِمْ وَأَتْرِسَتِهِمْ سَبْعَ سِنِينَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 4076، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 4076 (Tribulations), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 4076، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
