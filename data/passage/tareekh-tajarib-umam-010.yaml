text: "كتب إلى مفلح وهو بطبرستان يأمره بالإنصراف إليه وهو بالرى. فورد عليه كتاب موسى وقد توجه نحو أرض الديلم فى طلب الحسن بن زيد. فلما ورد عليه الكتاب أنصرف رأجعا. فعظم ذلك على رؤساء طبرستان ومن كان هاربا قبل قدوم"
