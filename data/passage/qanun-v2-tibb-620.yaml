text: "الكتاب الثالث الفن السادس عشر: في أحوال الأمعاء والمقعدة، والتحليل، الجيدة إذا أردت الإنضاج ومن الأدوية وتسكين الوجع، ضمّاد الحلبة، والخبّازى، وضمّاد إكليل الملك، وضمّاد من الكرنب المطبوخ. فإن احتيج إلى أقوى منه، جعل معه قليل بصل مشوي، وقليل مقل. …"
summary:
  ar: "مقطع من القانون في الطب لابن سينا ج2، ص 620، يذكر الوجع، وأعضاء البدن، والجراحة والختان والجبائر، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn Sina's Canon of Medicine, vol. 2, p. 620, that mentions pain, the organs of the body, surgery, circumcision and splints, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "القانون فی الطب، ابن سینا ج2، ص 620 کا اقتباس جس میں درد، اعضائے بدن، جراحت، ختنہ اور پٹیاں، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
