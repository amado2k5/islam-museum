label: { ar: "الموطأ 87 — ابن شهاب يبين صفة المسح على الخفين، ومالك يستحبها", en: "Muwatta 87", es: "Muwatta 87", fr: "Muwatta 87", ur: "موطا 87", tr: "El-Muvatta 87 — İbn Şihab çorapların üzerinden silme yöntemini açıklıyor ve Malik bunu tavsiye edilen bir yöntem olarak değerlendiriyor.", id: "Al-Muwatta 87 — Ibn Shihab menjelaskan cara mengusap kaus kaki, dan Malik menganggapnya dianjurkan." }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب الزهري عن صفة المسح على الخفين، فأدخل ابن شهاب إحدى يديه تحت الخف والأخرى فوقه ثم أمرّهما؛ ويروي يحيى عن مالك أن قول ابن شهاب أحب ما سمع إليه في ذلك. وهو في باب العمل في المسح على الخفين. ويذكر المحقق رواية ابن أبي شيبة عن سعيد بن عبد العزيز أنه سأل الزهري فوصف مثله. {cite:muwatta-maruf-1997 p.79}"
  tr: "Malik, İbn Şihab el-Zuhri'ye çorapların üzerinden nasıl doğru bir şekilde silineceğini sorduğunu rivayet eder. İbn Şihab daha sonra bir elini çorabın altına, diğerini üstüne koyar ve çorapların üzerinden geçirir. Yahya, Malik'ten naklederek, İbn Şihab'ın bu konudaki ifadesinin duyduğu en tercih edilebilir ifade olduğunu söyler. Bu, çorapların üzerinden silme uygulaması bölümünde yer almaktadır. Araştırmacı ayrıca, İbn Abi Şeybe'nin Sa'id ibn Abd el-Aziz'den naklederek, el-Zuhri'ye sorduğunu ve onun da benzer bir şey anlattığını da belirtir. {cite:muwatta-maruf-1997 s.79}"
  id: "Malik meriwayatkan bahwa ia bertanya kepada Ibn Shihab al-Zuhri tentang cara yang tepat untuk mengusap kaus kaki. Ibn Shihab kemudian meletakkan satu tangan di bawah kaus kaki dan tangan lainnya di atasnya, lalu mengusapkannya ke kaus kaki tersebut. Yahya meriwayatkan dari Malik bahwa pernyataan Ibn Shihab adalah yang paling baik yang pernah didengarnya mengenai masalah ini. Hal ini terdapat dalam bab tentang praktik mengusap kaus kaki. Peneliti juga menyebutkan riwayat Ibn Abi Shaybah dari Sa'id ibn 'Abd al-'Aziz, yang bertanya kepada al-Zuhri dan beliau menjelaskan sesuatu yang serupa. {cite:muwatta-maruf-1997 p.79}"
