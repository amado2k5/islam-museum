label: { ar: "الموطأ 87 — ابن شهاب يبين صفة المسح على الخفين، ومالك يستحبها", en: "Muwatta 87" }
summary:
  ar: "يروي مالك أنه سأل ابن شهاب الزهري عن صفة المسح على الخفين، فأدخل ابن شهاب إحدى يديه تحت الخف والأخرى فوقه ثم أمرّهما؛ ويروي يحيى عن مالك أن قول ابن شهاب أحب ما سمع إليه في ذلك. وهو في باب العمل في المسح على الخفين. ويذكر المحقق رواية ابن أبي شيبة عن سعيد بن عبد العزيز أنه سأل الزهري فوصف مثله. {cite:muwatta-maruf-1997 p.79}"
