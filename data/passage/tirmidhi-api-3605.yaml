label: { ar: "جامع الترمذي 3605 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Jami' al-Tirmidhi 3605 — mentions of non-Muslim nations, religions and peoples", ur: "جامع ترمذی 3605 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Jami' al-Tirmidhi 3605 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Jami' al-Tirmidhi 3605 — mentions de nations, de religions et de peuples non musulmans", tr: "Cami' el-Tirmizi 3605 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Jami' al-Tirmidhi 3605 — Penyebutan bangsa, agama, dan masyarakat non-Muslim" }
text: "حَدَّثَنَا خَلاَّدُ بْنُ أَسْلَمَ الْبَغْدَادِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ مُصْعَبٍ، حَدَّثَنَا الأَوْزَاعِيُّ، عَنْ أَبِي عَمَّارٍ، عَنْ وَاثِلَةَ بْنِ الأَسْقَعِ، قَالَ قَالَ رَسُولُ اللَّهِ \" إِنَّ اللَّهَ اصْطَفَى مِنْ وَلَدِ إِبْرَاهِيمَ إِسْمَاعِيلَ وَاصْطَفَى مِنْ وَلَدِ إِسْمَاعِيلَ بَنِي كِنَانَةَ وَاصْطَفَى مِنْ بَنِي كِنَانَةَ قُرَيْشًا وَاصْطَفَى مِنْ قُرَيْشٍ بَنِي هَاشِمٍ وَاصْطَفَانِي مِنْ بَنِي هَاشِمٍ \". قَالَ أَبُو عِيسَى هَذَا …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3605، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3605 (Chapters on Virtues), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "جامع ترمذی کی حدیث نمبر 3605، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 3605 (Capítulos sobre las virtudes), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3605 (Chapitres sur les vertus), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages sur les nations, les religions, les sectes et les peuples non musulmans."
  tr: "Cami' el-Tirmizi'de yer alan 3605 numaralı hadiste, gayrimüslim milletler, dinler ve halklardan bahsedilmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 3605, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
