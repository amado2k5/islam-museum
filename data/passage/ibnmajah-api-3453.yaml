label: { ar: "سنن ابن ماجه 3453 — الكمأة، تمر العجوة", en: "Sunan Ibn Majah 3453 — truffles and their water for the eye; 'ajwa dates", ur: "سنن ابن ماجہ 3453 — کھمبی، عجوہ کھجور" }
text: "… بْنِ إِيَاسٍ، عَنْ شَهْرِ بْنِ حَوْشَبٍ، عَنْ أَبِي سَعِيدٍ، وَجَابِرٍ، قَالاَ قَالَ رَسُولُ اللَّهِ ـ \" الْكَمْأَةُ مِنَ الْمَنِّ وَمَاؤُهَا شِفَاءٌ لِلْعَيْنِ وَالْعَجْوَةُ مِنَ الْجَنَّةِ وَهِي شِفَاءٌ مِنَ الْجَنَّةَ \". حَدَّثَنَا عَلِيُّ بْنُ مَيْمُونٍ، وَمُحَمَّدُ بْنُ عَبْدِ اللَّهِ الرَّقِّيَّانِ، قَالاَ حَدَّثَنَا سَعِيدُ بْنُ مَسْلَمَةَ بْنِ هِشَامٍ، عَنِ الأَعْمَشِ، عَنْ جَعْفَرِ بْنِ إِيَاسٍ، عَنْ أَبِي نَضْرَةَ، …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3453، يذكر الكمأة، وتمر العجوة، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Ibn Majah, no. 3453 (Chapters on Medicine), that mentions truffles and their water for the eye, 'ajwa dates, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3453، جس میں کھمبی، عجوہ کھجور، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
