label: { ar: "سنن أبي داود 685 — الأب والأبوة", en: "Sunan Abi Dawud 685 — the father and fatherhood", ur: "سنن ابی داؤد 685 — باپ اور والدیت", es: "Sunan Abi Dawud 685 — El padre y la paternidad", fr: "Sunan Abi Dawud 685 — Le père et la paternité", tr: "Sunan Abi Davud 685 — Baba ve Babalık", id: "Sunan Abi Dawud 685 — Sang Ayah dan Peran Ayah" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ الْعَبْدِيُّ، حَدَّثَنَا إِسْرَائِيلُ، عَنْ سِمَاكٍ، عَنْ مُوسَى بْنِ طَلْحَةَ، عَنْ أَبِيهِ، طَلْحَةَ بْنِ عُبَيْدِ اللَّهِ قَالَ قَالَ رَسُولُ اللَّهِ \" إِذَا جَعَلْتَ بَيْنَ يَدَيْكَ مِثْلَ مُؤَخَّرَةِ الرَّحْلِ فَلاَ يَضُرُّكَ مَنْ مَرَّ بَيْنَ يَدَيْكَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 685، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 685 (Prayer (Kitab Al-Salat)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 685، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 685 (Oración (Kitab Al-Salat)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 685 (La Prière), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 685 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 685, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
