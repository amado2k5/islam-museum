label: { ar: "الموطأ 993 — مالك في المعتمر يقع بأهله: عليه الهدي، وعمرة أخرى يبتدئ بها بعد إتمامه التي أفسد، ويحرم من حيث أحرم بعمرته التي أفسد", en: "Muwatta 993" }
summary:
  ar: "قول لمالك في المعتمر يقع بأهله: إن عليه في ذلك الهدي، وعمرة أخرى يبتدئ بها بعد إتمامه التي أفسد، ويحرم من حيث أحرم بعمرته التي أفسد، إلا أن يكون أحرم من مكان أبعد من ميقاته فليس عليه أن يحرم إلا من ميقاته. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1134). {cite:muwatta-maruf-1997 p.466}"
