label: { ar: "الموطأ 993 — مالك في المعتمر يقع بأهله: عليه الهدي، وعمرة أخرى يبتدئ بها بعد إتمامه التي أفسد، ويحرم من حيث أحرم بعمرته التي أفسد", en: "Muwatta 993", es: "Muwatta 993", fr: "Muwatta 993", ur: "موطا 993", tr: "El-Muvatta 993 — Malik, karısıyla cinsel ilişkiye giren hacı hakkında: Bir kurban kesmeli ve iptal ettiği umreyi tamamladıktan sonra yeni bir umreye başlamalıdır; ihrama ise iptal ettiği umre için girdiği yerden girmelidir.", id: "Al-Muwatta 993 — Malik tentang jamaah haji yang bersetubuh dengan istrinya: Ia harus mempersembahkan hewan kurban, dan melaksanakan umrah lain yang dimulai setelah menyelesaikan umrah yang ia batalkan, dan ia memasuki ihram dari tempat yang sama di mana ia memasuki ihram untuk umrah yang ia batalkan." }
summary:
  ar: "قول لمالك في المعتمر يقع بأهله: إن عليه في ذلك الهدي، وعمرة أخرى يبتدئ بها بعد إتمامه التي أفسد، ويحرم من حيث أحرم بعمرته التي أفسد، إلا أن يكون أحرم من مكان أبعد من ميقاته فليس عليه أن يحرم إلا من ميقاته. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1134). {cite:muwatta-maruf-1997 p.466}"
  tr: "Malik, eşiyle cinsel ilişkiye giren bir hacı adayının Umre yapmasıyla ilgili olarak şöyle demiştir: Geçersiz sayılan Umre'yi tamamladıktan sonra bir kurban kesmeli ve yeni bir Umre yapmalıdır. Geçersiz sayılan Umre için ihrama girdiği yerden girmelidir; ancak belirlenmiş mikatından daha uzak bir yerden ihrama girmişse, yalnızca belirlenmiş mikatından ihrama girmelidir. Araştırmacı, bunun Malik'ten Ebu Mus'ab (1134) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.466}"
  id: "Malik berkata mengenai seorang jamaah Umrah yang bersetubuh dengan istrinya: Ia harus mempersembahkan hewan kurban dan melaksanakan Umrah lagi, dimulai setelah menyelesaikan Umrah yang batal. Ia harus memasuki Ihram dari tempat yang sama dengan tempat ia memasuki Ihram untuk Umrah yang batal tersebut, kecuali jika ia memasuki Ihram dari tempat yang lebih jauh dari Miqat yang telah ditentukan, dalam hal ini ia harus memasuki Ihram hanya dari Miqat yang telah ditentukan. Peneliti menyebutkan bahwa hal ini diriwayatkan dari Malik oleh Abu Mus'ab (1134). {cite:muwatta-maruf-1997 p.466}"
