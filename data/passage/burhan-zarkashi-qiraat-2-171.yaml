text: "… والصحابة ق متفرقون في البلاد وإن لم يكمله سوى أربعة فقد حفظ جميع أجزائه مئون لا يحصون. قال الشيخ: وقد سمى الإمام أبو عبيد القاسم بن سلام القراء من الصحابة في أول كتاب القراءات له، فسمى عددا كثيرا. ما يبين …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 171، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
