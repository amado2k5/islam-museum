label: { ar: "الموطأ 182 — مالك: لم يبلغني تسليم المؤذن على الإمام في الزمان الأول", en: "Muwatta 182", es: "Muwatta 182", fr: "Muwatta 182", ur: "موطا 182", tr: "El-Muvatta 182 — Malik: Eski zamanlarda müezzinin imama selam verdiğini duymadım.", id: "Al-Muwatta 182 — Malik: Aku belum pernah mendengar muazin memberi salam kepada imam pada masa-masa awal" }
summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن تسليم المؤذن على الإمام ودعائه إياه للصلاة ومن أول من سُلّم عليه، فقال إنه لم يبلغه أن التسليم كان في الزمان الأول. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.119}"
  tr: "Malik'in ezanla ilgili bir fetvası: Müezzinin imamı selamlayıp namaza davet etmesi ve bu selamlamanın ilk kimde yapıldığı soruldu. O da, bu uygulamanın daha önceki zamanlarda var olduğunu duymadığını söyledi. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtiyor. {cite:muwatta-maruf-1997 s.119}"
  id: "Fatwa Malik mengenai seruan azan: Beliau ditanya tentang muazin yang memberi salam kepada imam dan mengajaknya azan, dan siapa orang pertama yang diberi salam tersebut. Beliau menjawab bahwa beliau belum pernah mendengar praktik ini ada di masa lalu. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.119}"
