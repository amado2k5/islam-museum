summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن تسليم المؤذن على الإمام ودعائه إياه للصلاة ومن أول من سُلّم عليه، فقال إنه لم يبلغه أن التسليم كان في الزمان الأول. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.119}"
