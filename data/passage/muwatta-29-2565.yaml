label: { ar: "الموطأ 2565 — مالك: العفو عن قتل العمد بعد الاستحقاق لا عقل فيه إلا بالشرط", en: "Muwatta 2565", es: "Muwatta 2565", fr: "Muwatta 2565", ur: "موطا 2565", tr: "El-Muvatta 2565 — Malik: İntikam alma hakkı sona erdikten sonra kasten öldürme suçuna verilen af, şartlı tazminat dışında herhangi bir tazminata bağlı değildir.", id: "Al-Muwatta 2565 — Malik: Pengampunan atas pembunuhan yang disengaja setelah hak untuk membalas dendam tidak dikenakan kompensasi apa pun kecuali dengan syarat tertentu." }
summary:
  ar: "قال مالك في الرجل يعفو عن قتل العمد بعد أن يستحقه ويجب له: إنه ليس على القاتل عقل يلزمه، إلا أن يكون الذي عفا عنه اشترط ذلك عند عفوه عنه. {cite:muwatta-maruf-1997 p.447}"
  tr: "Malik, kasten öldürme suçundan hüküm giymiş ve kan parasına layık görülen birini affeden kişi hakkında şunları söylemiştir: Katil, affeden kişi affetme sırasında bu şartı koymadığı sürece kan parası ödemekle yükümlü değildir. {cite:muwatta-maruf-1997 s.447}"
  id: "Malik berkata mengenai seorang pria yang mengampuni seseorang atas pembunuhan berencana setelah si pembunuh dianggap pantas menerima uang darah dan berhak atasnya: Si pembunuh tidak berkewajiban membayar uang darah kecuali jika orang yang mengampuninya menetapkan syarat ini ketika mengampuninya. {cite:muwatta-maruf-1997 p.447}"
