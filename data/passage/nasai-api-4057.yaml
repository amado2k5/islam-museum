label: { ar: "سنن النسائي 4057 — ما لا يحل", en: "Sunan al-Nasa'i 4057 — what is not lawful", ur: "سنن نسائی 4057 — جو حلال نہیں", es: "Sunan al-Nasa'i 4057 — lo que no es lícito" }
text: "… الأَزْهَرِ النَّيْسَابُورِيُّ قَالَ حَدَّثَنَا إِسْحَاقُ بْنُ سُلَيْمَانَ الرَّازِيُّ، قَالَ أَنْبَأَنَا الْمُغِيرَةُ بْنُ مُسْلِمٍ، عَنْ مَطَرٍ الْوَرَّاقِ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، أَنَّ عُثْمَانَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" لاَ يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلاَّ بِإِحْدَى ثَلاَثٍ رَجُلٌ زَنَى بَعْدَ إِحْصَانِهِ فَعَلَيْهِ الرَّجْمُ أَوْ قَتَلَ عَمْدًا فَعَلَيْهِ الْقَوَدُ أَوِ ارْتَدَّ بَعْدَ إِسْلاَمِهِ فَعَلَيْهِ الْقَتْلُ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 4057، يذكر ما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 4057 (The Book of Fighting [The Prohibition of Bloodshed]), that mentions what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 4057، جس میں جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4057 (El Libro de la Lucha [La Prohibición del Derrame de Sangre]), menciona lo que no es lícito. El Navegador Halal y Haram lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
