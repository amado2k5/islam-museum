text: "… فى الحديث، وكان يذهب الى الاعتزال ويدعو اليه. سمعت الحسن بن محمد انخلال- وذكر طلحة ابن محمد - فقال: كان معتزليا، داعية يجب أن لا يروى عنده. سمعت الازهرى ذكر طلحة صاحب ابن مجاهد فقال : ضعيف فى روايته وفى …"
