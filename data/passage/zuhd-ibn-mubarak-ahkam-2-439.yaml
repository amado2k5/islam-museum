text: "… وهب في التفسير من جامعه عن ابن لهيعة عن ابن هبيرة. والحفيظ: الذي حفظ ذنوبه حتى رجع عنها وتاب منها. ويمكن أن يقال: هو حفيظ لكلّ ما قرَّبه إلى ربّه من الفرائض والطاعات."
summary:
  ar: "مقطع من الزهد لابن المبارك، المجلد المصوَّر 2، ص 439، يرد فيه ذكر الفريضة والفرائض، والطاعات؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Mubarak's Kitab al-Zuhd, scan volume 2, p. 439, whose wording mentions the obligation (farida), the acts of obedience; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "کتاب الزہد، ابن المبارک، اسکین جلد 2، ص 439 کا اقتباس جس میں فریضہ اور فرائض، طاعات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
