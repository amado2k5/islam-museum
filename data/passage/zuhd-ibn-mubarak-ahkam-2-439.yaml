  tr: "İbn el-Mubarak'ın \"El-Zuhd\" (Zühd) adlı eserinin 2. cildinin 439. sayfasından, farz olan amelleri, görevleri ve itaat amellerini sıralayan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları sıralayan bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab \"Al-Zuhd\" (Asketisme) karya Ibn al-Mubarak, Jilid 2, halaman 439, yang menyebutkan amalan wajib, kewajiban, dan ketaatan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai kebijakan sumber dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
