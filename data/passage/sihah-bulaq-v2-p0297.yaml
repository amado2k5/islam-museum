text: |-
  ( ١ تسخسة زيادة ذوالرمة
  وأول الببت
  من دمنة هيجت شوقي ممالمها
  ٢٩٠
  •⁦(فصل برا٠)⁩،:،:
  ٠⁦(رشم)⁩•
  لا متلائها وحفان رذم ورذم مثل عمود وعمد وعمد ولا تقل رذم وأرذم على الحسين أى زاد
  ⁦( رزم)⁩ الرازم من الأيل الثابت على الارض الذكدلا يقوم من الهزال وقد رزمت الناقة
  ززم وترزم رزوما ورزاما بالضم قامت من الاعياء واله-زال ولم تترك فهى رازم ويقال
  للثابت القائم على الارض رزم مثال هبع وقول ساعدة بن جؤية
  يخشى عليهم من الاملال تايخة • من النواعخ مثل الحادر الززم
  قالوا أراد الفيل والحادر الغليظ أبوزيد الرزمة بالتحرين صوت الناقة تخرجه من حلقه،
  لا تفتح به فاها وذلك على وادها حين ترأمه قال والحنين أشدّ من الرزمة وو المذل رزمة
  ولا درّة يضرب لمن يعد ولاينى وقد أرزمت الناقة يقال لا أفعل ذاكما أرزمت أمّ حائل
  والارزام أيضاصوت الرعد ورزمة السباع أصواتها والرزيم الزئير وقال
  لا سودهنّ على الطريق رزيم • والمرزمان مرزما الشعر بين وه-مانجمان أحدهما
  فى الشعرى والآخر فى الذراع وأتم مرزم الشمال وأنشدابى الاءرابية؟
  تقشرأ على أنفه أمّ مرزم• ورزمت الشيء جعته والرزمة الكارة من الثياب وقدرذهتها
  ترزيما اذاسددتهارزما والمرازمة فى الاكل الموالاة كمابرازم الرجل بين الجراد والتمر
  ورازمت الابل اذا خلطت بين مرعيين وفى الحديث اذا أكلتم فوازموايريدم والاة الهسه
  أبو زيد ارزامّ الرجل ارزيماما أذاغضب ورزام أبوحى من غيم وهورزام بن مالك بن حنظلة بن
  مالك بن عمروبن تيم وقال ولولارجال من رزام أعزة • وآل سببع أوأسوأك علقما
  أراد أوأن أ-وألطقما أى ياعلتمة →رسم) الرسم الاثرورسم الدارما كان من آثارها
  لاصقا يالارض وترسمت الدارتأملت ر-عها وقال ذوارمة
  أأن ترسمت من خرفاء منزلة • ماء الصباية من عينيان مسجوم
  وكذلك اذا نظرت وتفرّست أين تحفر أوتبى وقال • ترسم الشيخ وضرب المنقاره والروسم
  الرسم ويقال الروسم ثى تجلى يه الدنانير وقال •دنانيرشيفت من هرقل بروسم • والروسم
  خشبة فيها كتابه يختم بها الطعام وهو بالشين معجمة أيضا والرواسيم كتب كانت فى الجاهلية
  وقال ١ كانم ابالهدملات الرواسيم• والراسم الملء الجارى وناقة رسوم تؤثر فى الارض
  من شدة الوطء وقدرست ترسم رسيماورسمت له كذا قار تسمه اذا امتئله وارتسم الرجل كبر
  ودعا وقال الاعشى
  وقابلها الريح فى دنها • وصلى على دنها وارنسم
  والنوب المرسم بالتشديد المخطط ورسم على كذاو كذا أى كتب والرسيم ضرب من سه
  الابل وهوفوق الذميل وقدرسم يرسم بالسكسرر سماولا يقال آرسم وقول حيد بن نور
  وماربع االضبعان موراوكافت • بعيرى غلامىّ الرسيم فأرسما
  قال أبو حاتم انما أراد أرسم الغلامان بعيميم-ماولم يرد أرسم البعير والرسوم الذى بيق على
  السير يوما وليلة رشم الرشم مصدررشمت الطعام أرشمه اذاختمته والروشم اللوح الذى
  تختميه البيادر بالشين والسين جميعا والرشم بالتعريك أول مايفاهر من النبت عن ابن
  السكيت والرشم أيضا مصد رقولك رشيم الرجل بالكسرير شم اذاصار أرثيم وه والذى يتشمم
  الطعام ويحرص عليه وقال
