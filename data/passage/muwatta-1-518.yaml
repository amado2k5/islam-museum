summary:
  ar: "بلاغ في باب الاستمطار بالنجوم: يروي مالك أنه بلغه أن أبا هريرة كان يقول إذا أصبح وقد مُطر الناس: مُطرنا بنوء الفتح، ثم يتلو الآية الثانية من سورة فاطر في أن ما يفتح الله للناس من رحمة فلا ممسك لها [[passage/quran-35-2|فاطر 2]]. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
