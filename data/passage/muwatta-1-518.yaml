label: { ar: "الموطأ 518 — بلاغ: أبو هريرة إذا أصبح وقد مُطر الناس قال: مطرنا بنوء الفتح", en: "Muwatta 518", es: "Muwatta 518", fr: "Muwatta 518", ur: "موطا 518", tr: "El-Muvatta 518 — Rivayet: Ebu Hurayra uyandığında insanların üzerine yağmur yağdığını görünce şöyle dedi: \"Yağmuru bize Feth yıldızı verdi.\"", id: "Al-Muwatta 518 — Riwayat: Abu Hurairah, ketika ia bangun dan hujan turun kepada orang-orang, berkata: Hujan telah diberikan kepada kita oleh bintang Al-Fath." }
summary:
  ar: "بلاغ في باب الاستمطار بالنجوم: يروي مالك أنه بلغه أن أبا هريرة كان يقول إذا أصبح وقد مُطر الناس: مُطرنا بنوء الفتح، ثم يتلو الآية الثانية من سورة فاطر في أن ما يفتح الله للناس من رحمة فلا ممسك لها [[passage/quran-35-2|فاطر 2]]. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
  tr: "Yıldızlar aracılığıyla yağmur dileme ile ilgili bir rivayet: Malik, Ebu Hurayra'nın sabah yağmur yağdığında şöyle dediğini işittiğini aktarır: \"Yağmur bize Feth yıldızı tarafından verildi.\" Sonra da Fatir Suresi'nin ikinci ayetini okurdu: \"Allah'ın insanlara açtığı her rahmeti kimse engelleyemez.\" [[pasaj/kuran-35-2|Fatir 2]]. Editör, bunu Ebu Musab ve Suveyd'in Malik'ten rivayet ettiğini belirtir. {cite:muwatta-maruf-1997 s.267} {cite:muwatta-maruf-1997 s.268}"
  id: "Sebuah riwayat mengenai memohon hujan melalui bintang-bintang: Malik meriwayatkan bahwa ia mendengar Abu Hurayrah biasa berkata, ketika hujan turun di pagi hari: “Kami telah diberi hujan oleh bintang Al-Fath,” kemudian ia membaca ayat kedua Surah Fatir, “Rahmat apa pun yang Allah berikan kepada manusia, maka tidak ada seorang pun yang dapat menahannya” [[passage/quran-35-2|Fatir 2]]. Editor menyebutkan bahwa Abu Musab dan Suwayd meriwayatkannya dari Malik. {cite:muwatta-maruf-1997 p.267} {cite:muwatta-maruf-1997 p.268}"
