text: "من أحدث في أمرنا هذا ما ليس منه فهو رد"
summary:
  ar: "حديث عائشة بنت أبي بكر، وهو الحديث الخامس في الأربعين النووية وفي شرح ابن رجب، وفي رواية لمسلم «من عمل عملاً ليس عليه أمرنا فهو رد»؛ رواه البخاري (2697) ومسلم (1718) من طريق القاسم بن محمد عن عمته عائشة، وأخرجه أيضاً أحمد وأبو داود (4606) وابن ماجه (14) وابن أبي عاصم في «السنة» وغيرهم؛ يجعله ابن رجب أصلاً عظيماً وميزاناً للأعمال في ظاهرها كما أن حديث النيات ميزان لها في باطنها، وأجّل الكلام على المحدثات إلى شرح حديث العرباض بن سارية ⁦(الحديث الثامن والعشرين)⁩ ⁦(جامع العلوم والحكم ص 155–171)⁩."
  en: "Aisha bint Abi Bakr's hadith, the fifth of al-Nawawi's Forty and of Ibn Rajab's commentary; in Muslim's wording, 'whoever does an act that is not upon our command has it rejected'. Transmitted by al-Bukhari (2697) and Muslim (1718) through al-Qasim ibn Muhammad from his aunt Aisha, and also by Ahmad, Abu Dawud (4606), Ibn Majah (14), Ibn Abi Asim in al-Sunna and others; Ibn Rajab makes it a great foundation — the scale of deeds in their outward form as the hadith of intentions is their scale inwardly — and defers the discussion of innovations to his commentary on the hadith of al-Irbad ibn Sariya (hadith 28) (Jami' al-Ulum wal-Hikam pp. 155–171)."
  es: "Hadiz de Aisha bint Abi Bakr, el quinto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; en palabras de Muslim, \"a quien le sea rechazado un acto que no esté bajo nuestro mandato\". Transmitido por al-Bujari (2697) y Muslim (1718) a través de al-Qasim ibn Muhammad de su tía Aisha, y también por Ahmad, Abu Dawud (4606), Ibn Majah (14), Ibn Abi Asim en al-Sunna y otros; Ibn Rajab lo convierte en un gran fundamento —la escala de los actos en su forma externa, así como el hadiz de las intenciones es su escala interna— y pospone la discusión de las innovaciones a su comentario sobre el hadiz de al-Irbad ibn Sariya (hadiz 28) (Jami' al-Ulum wal-Hikam, págs. 155-171)."
  fr: "Le hadith d'Aïcha bint Abi Bakr, le cinquième des Quarante d'al-Nawawi et du commentaire d'Ibn Rajab, stipule, selon Muslim: « Quiconque accomplit un acte qui ne relève pas de Notre commandement le verra rejeté. » Transmis par al-Bukhari (2697) et Muslim (1718) par l'intermédiaire d'al-Qasim ibn Muhammad, d'après sa tante Aïcha, et également par Ahmad, Abu Dawud (4606), Ibn Majah (14), Ibn Abi Asim dans al-Sunna et d'autres, il constitue un fondement majeur pour Ibn Rajab. Il établit que la gravité des actes, dans leur forme extérieure, est à l'image de leurs intentions, dans leur forme intérieure, et renvoie la discussion des innovations à son commentaire du hadith d'al-Irbad ibn Sariya (hadith 28) (Jami' al-Ulum wal-Hikam, p. 155-171)."
  ur: "عائشہ بنت ابی بکر کی حدیث، نووی کی چالیسویں اور ابن رجب کی تفسیر کی پانچویں؛ مسلم کے الفاظ میں، 'جس نے کوئی ایسا عمل کیا جو ہمارے حکم کے مطابق نہیں ہے وہ مردود ہے'۔ البخاری (2697) اور مسلم (1718) نے القاسم بن محمد کے ذریعے اپنی خالہ عائشہ سے نقل کیا ہے، اور احمد، ابوداؤد (4606)، ابن ماجہ (14)، ابن ابی عاصم السنۃ اور دیگر کے ذریعے بھی نقل کیا ہے۔ ابن رجب نے اسے ایک عظیم بنیاد قرار دیا ہے - اعمال کا پیمانہ ان کی ظاہری شکل میں ہے کیونکہ نیتوں کی حدیث ان کا باطنی پیمانہ ہے - اور بدعات کی بحث کو العرباد ابن ساریہ کی حدیث ⁦(حدیث 28)⁩ ⁦(جامع العلوم والحکام صفحہ 15-15)⁩ پر اپنی تفسیر تک موخر کرتے ہیں۔"
  tr: "Ayşe bint Ebu Bekir'in hadisi, El-Arba'in El-Nawawiyya'da beşinci hadis olup, İbn Receb'in açıklamasında ve Müslim'in bir rivayetinde şöyle geçmektedir: \"Kim bizim emrimize aykırı bir fiil işlerse, o iş reddedilir.\" Bu hadis, Buhari (2697) ve Müslim (1718) tarafından, teyzesi Ayşe'den rivayet edilen El-Kâsim bin Muhammed'den nakledilmiştir. Ayrıca Ahmed, Ebu Davud (4606), İbn Mâce (14), İbn Ebu Asim \"El-Sünnet\"te ve diğerleri tarafından da rivayet edilmiştir. İbn Receb, niyet hadisinin iç görünüşleri için bir ölçüt olması gibi, niyetleri de dış görünüşleri için büyük bir ilke ve ölçüt haline getirmiş ve bidatler konusunu Al-Arbad bin Sariyah hadisinin (yirmi sekizinci hadis) açıklamasına ertelemiştir (Cami' Al-'Ulum ve Al-Hikam, s. 155-171)."
  id: "Hadits Aisyah binti Abi Bakr, yang merupakan hadits kelima dalam Al-Arba’in Al-Nawawiyya dan dalam penjelasan Ibn Rajab, dan dalam riwayat Muslim: “Barangsiapa melakukan suatu perbuatan yang tidak sesuai dengan perintah Kami, maka perbuatan itu ditolak.” Hadits ini diriwayatkan oleh Al-Bukhari (2697) dan Muslim (1718) dari Al-Qasim bin Muhammad dari bibinya Aisyah, dan juga diriwayatkan oleh Ahmad, Abu Dawud (4606), Ibn Majah (14), Ibn Abi Asim dalam “Al-Sunnah” dan lainnya. Ibn Rajab menjadikannya sebagai prinsip besar dan tolok ukur untuk amal perbuatan dalam penampilan lahiriahnya, sebagaimana hadits tentang niat merupakan tolok ukur untuk amal perbuatan dalam penampilan batiniahnya, dan beliau menunda pembahasan tentang bid'ah hingga penjelasan hadits Al-Arbad bin Sariyah (hadits ke-28) (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 155–171)."
