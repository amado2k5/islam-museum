label: { ar: "سنن أبي داود 5230 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan Abi Dawud 5230 — mentions of non-Muslim nations, religions and peoples", ur: "سنن ابی داؤد 5230 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan Abi Dawud 5230 — Menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan Abi Dawud 5230 — mentions de nations, religions et peuples non musulmans" }
text: "حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، عَنْ مِسْعَرٍ، عَنْ أَبِي الْعَنْبَسِ، عَنْ أَبِي الْعَدَبَّسِ، عَنْ أَبِي مَرْزُوقٍ، عَنْ أَبِي غَالِبٍ، عَنْ أَبِي أُمَامَةَ، قَالَ خَرَجَ عَلَيْنَا رَسُولُ اللَّهِ مُتَوَكِّئًا عَلَى عَصًا فَقُمْنَا إِلَيْهِ فَقَالَ \" لاَ تَقُومُوا كَمَا تَقُومُ الأَعَاجِمُ يُعَظِّمُ بَعْضُهَا بَعْضًا \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 5230، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 5230 (General Behavior (Kitab Al-Adab)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن ابی داؤد کی حدیث نمبر 5230، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 5230 (Conducta General (Kitab Al-Adab)), con menciones de naciones, religiones y pueblos no musulmanes. El navegador Umam lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan Abi Dawud, n° 5230 (Comportement général), mentionne les nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
