text: |-
  *⁦(باب ال.كاف)⁩*
  . •دكد).
  ١٣٣
  الحبكان مشى القصير وقد حال يحيك حيكانا اذاحرك منكسه وخحج بين رجلءه فى المشى وضبة
  حيكانة أى ضخمة تحيك اذاسحت وحالك فيه السبف وأحاك يمعنى يقال ضربه فا أحال فيه
  السيف اذالم يعمل والحيك أخذ القول فى القلب ية سال ما يحيك فيه الملام اذ الم يؤثزفيه
  صل الدال ( رك الادرا اللمعوق يقال مشيت حتق أدركتسه وعشت
  حتى أدركت زماته وأدركته بيصرى أى رأيته وأدرك الغلام وأدرك التمرأى بلغ وربما
  قالوا أدرك الدقيق بعن فى واستدركت مافات وتدارحكته بمعنى وتدارك القوم
  أى تلاحوا أى لخق آخرهم أولهم ومنمقوه تعالى حتى اذا ادّاركوافيها بمبعاوأصله
  تداركوا فأدغمت التاء فى الدال واجتلبت الااف ليسلم السكون وتدارك الثريان أى أدركة
  رى المطورى الارض وقولة-م دراك أى أدرك وهو اسم لفعل الامروكسرت الكاف
  لاجتماع الساكمين لات حقها السكنون للامر والدريكة الطريدة والدرك بالتحر يك قطعة
  حبل تشد فى طرف الرشاء الى عرقوة الدلوليكون هوالذى يلى الماءفلايع-فن الرشاء
  والدرك التبعة يسكن ويحرك يقال مالحقك من درك فعلىّ خلاصه ودركات النار مساؤل
  أهلها والناردركات والجنة درجات والقعرالاخردرك ودرك والدراك المداركة
  يقال دارك الرجل صونه أى نايمه ودراك أيضااسم كاب قال الكميت يصف
  النور والكلاب
  فاختل حضنى دواك وانتنى حرجا ، لزارع طعنة فى شدقها قبل
  أى فى جانب الطعنة سعة وزارع اسم كاب أيضا ويقال لا بارك اللّٰه فيه ولا تارك ولا دارك
  كله؟عنى ومدركة لقب عمروين الياس بن مضراقبه بها أبوه لما أدرك الابل والدوّاٰ الكثير
  الادراكْ وقمليجى مفعال من أفعل يفعل الا أنهسم قد قالوا حساس درَّاله لغة أوازدواج
  رمك الدرمك دقيق الحوارى ( رنك لدرنول ضرب من البسط ذوخل وتشبه
  به فروة البعير قال الراجز * جعد الدرانيك رفلى الاجلاد• (دعك، الدعل مثل الدلك
  وقدد عكت الاديم والخصم أى لينته وتداعك الرجسلان فى الحرب أى تمرسا ورجل دعك
  أى محاك والدعكة لغة فى الدعقة وهى جماعة من الابل ( كن الدل الدق
  وقدد ككت الشئ أدكه دكااذاضر بته وكسرته حتى سؤيته بالارض ومنمقول
  نعالى فدكتادكة واحدة قال الاخفش هى أرض دك والجمع دكوك قال اللّٰه تعالى جعل دكا
  قال ويحتمل أن يكون مصدر الائه حين قال جعله كانه قال دكه فقال دكا أو أراد جعل ذادك
  فحذف وقد قرئ بالمدأى جعل أرضاد كاه فخذف لان الجيل مذكر قال أبو زيددك الرجل
  :هومد كوك اذادكته الحمى ودككت الركىّ أى دقنته بالتراب وتدكدكت الجبال أى صارت
  دكاوات وهى رواب من طين واحد تهادكاء وناقة دكاء لاسنام لا والمع دلود كاوات مثل
  *روحراوات والدك الجبسل الذليسل والجمع الدككة مثل * روبحرة وفرس أدن اذا كان
  متدانيساعريض الظهر من خيل دك ووجل مدك بكسر الميم أى قوة شديد الوط للارض
  وأمة مدكة أى قوية على العمل والدكد الأمن الرمل ما التبدمنه بالارض ولم يرتقع
  وفى الحديث أنه سأل جرير بن عبد اللّه عن منزله فقال سهل ودكداك وسلم
  ٣٤
  مجاح
  قول الدرمك بعدى كجعفر كاق
  القاموس
