text: "… ابو بكر المقرئ المعرف بالمطر زسمع سويد بن سعيد واباكريب، روى عنه الخلدى والجعابى وكان ثقة ثبتا قارئا مصنفا نبيلا، توف ف صفر هذه السنة ودفن فى مقابر باب الكوفة... محمد بن ابراهيم ابن ابان بن ميمون ابو عبداقه السراج …"
summary:
  ar: "مقطع من المنتظم لابن الجوزي، المجلد المصوَّر 1، ص 150، يذكر دفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's al-Muntazam, scan volume 1, p. 150, that mentions a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "المنتظم، ابن الجوزی، اسکین جلد 1، ص 150 کا اقتباس جس میں تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un fragmento de al-Muntazam de Ibn al-Jawzi, volumen 1, pág. 150, que menciona un entierro, tumba o lugar de descanso; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Muntazam d'Ibn al-Jawzi (tome 1, p. 150) mentionnant une sépulture ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le Navigateur des Testaments."
  tr: "İbn el-Cevzi'nin el-Muntazam adlı eserinin resimli 1. cildinin 150. sayfasından bir alıntı, mezar, türbe ve kutsal mekandan bahsetmektedir; bu alıntı, makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, vasiyetnameler, miraslar, eski eserler ve kutsal mekanlar araştırmacısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Muntazam karya Ibn al-Jawzi, jilid 1 bergambar, halaman 150, menyebutkan tentang pemakaman, kuburan, dan makam; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan makam."
