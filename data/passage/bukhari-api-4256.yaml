label: { ar: "صحيح البخاري 4256 — الحمى والوعك، الحمى", en: "Sahih al-Bukhari 4256 — fever; fever", ur: "صحیح بخاری 4256 — بخار، بخار", es: "Sahih al-Bukhari 4256 — fiebre; fiebre", fr: "Sahih al-Bukhari 4256 — fièvre; fièvre", tr: "Sahih el-Buhari 4256 — Ateş ve Hastalık, Ateş", id: "Sahih al-Bukhari 4256 — Demam dan Penyakit, Demam" }
text: "… عَنِ ابْنِ عَبَّاسٍما ـ قَالَ قَدِمَ رَسُولُ اللَّهِ وَأَصْحَابُهُ فَقَالَ الْمُشْرِكُونَ إِنَّهُ يَقْدَمُ عَلَيْكُمْ وَفْدٌ وَهَنَهُمْ حُمَّى يَثْرِبَ. وَأَمَرَهُمُ النَّبِيُّ أَنْ يَرْمُلُوا الأَشْوَاطَ الثَّلاَثَةَ، وَأَنْ يَمْشُوا مَا بَيْنَ الرُّكْنَيْنِ، وَلَمْ يَمْنَعْهُ أَنْ يَأْمُرَهُمْ أَنْ يَرْمُلُوا الأَشْوَاطَ كُلَّهَا إِلاَّ الإِبْقَاءُ عَلَيْهِمْ. وَزَادَ ابْنُ سَلَمَةَ عَنْ أَيُّوبَ عَنْ سَعِيدِ بْنِ جُبَيْرٍ عَنِ ابْنِ عَبَّاسٍ قَالَ لَمَّا قَدِمَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 4256، يذكر الحمى والوعك، والحمى. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4256 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions fever, fever. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4256، جس میں بخار، بخار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 4256 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona la fiebre. El Navegador de Medicina lo incluye en la lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 4256 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne la fièvre. Le navigateur de ressources médicales le répertorie avec les textes relatifs à la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 4256 numaralı hadis, ateş ve hastalıktan bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 4256, menyebutkan tentang demam dan penyakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
