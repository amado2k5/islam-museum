text: "… لكم العرب، وتؤد إليكم العجم الجزية، والله لتنفقنّ كنوز كسرى وقيصر في سبيل اللّه: فمن بين مستهزىء ومصدّق فكان ما رأيتم، والله ليكوننّ الباقي. فامتنع الناس من الردّة. وهذا المقام الذي قاله رسول الله، وَالظِ، لما اسر سهيل بن عمرو …"
summary:
