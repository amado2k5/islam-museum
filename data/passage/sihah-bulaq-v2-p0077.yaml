text: |-
  ٥١٠
  • ⁦(طلا)⁩
  وطغا البحرهاجت أمواجه وطفا الدم تبيغ وطفا السيل اذاجاءبماه كثير والطفية أعلى
  الجبل وكل مكان مرتف-ع طغوة أبوزيد الطغيسة من كل شى نيذة منه قال الهذلى يصف
  مشتار العل.
  صب اللهيف لها السبوب بطغية • تنبي العقاب كمايلط المجنب
  قوله تني أى تدفع لانه لا تنبت عليم ا مخالبها لملاستها وأنشد لاسامة الهذلى
  والا النعام وحفانه • وطغيامع اللهق الناشط
  قال الاصعى طفيا بالضم وقال ثعلب طغيا بالفتح وهوالصغير من بقر الوحس والطغوان
  والطفيان بعنى والطغوى بالفتح مثله والطاغية. لك الروم والطاغيسة الصاعقة وقوله تعالى
  فأمائ ودفأ هلكوا بالطاغية يعنى صيحة العذاب والطاغوت الكاهن والشيطان وكل رأس
  فى الضلاقة قد يكون واحدا قال اللّٰه تعالى يريدون أن يتها كوا الى الطاغوت وقد أمروا أن
  يكفروابه وة يكون بمعاقال اللّٰه تعالى أوليا ؤهم الطاغوت يخرجونهم وطاغوت وان جاء
  على وزن لاهوت فهو مسلوب لانه من طغاولا هوت غسير مقلوب لانه من لاه بمنزلة الرغبوت
  والرهبوت والجمع الطواغيت (طفا الطقى بالضم خوص المقسل قال أبوذؤيب
  عفاغيرنوى الدارما ان تبينه • وأقطاع طفى قدعفت فى المازل
  ويروى المناقل الواحدة طفية وفى الحديث اقتلوا من الحيات ذا الطفيتين والابتركانه شبه
  الخطين على ظهره باللمفيتين وربماقيل لهذه الحية طفية على معنى ذات طفية قال الهذلى
  وهم يذلونا من بعدعزتها • كماتذل الطفى من رقية الراقى
  أى ذوات الطقى وقديسى الشئ باسم ما يجاوره والطفاوة بالضم دارة الشمس وبقال أصبنا
  طفاوة من الربيع أى شيأمنه والطفاوة أيضاحى من قيس عيلان وطفا الشى ذوق الماء يطفو
  طفوا وطفوا اذا علا ولم يرسب ومرّالغبى يطفواذاخف على وجه الارضش واشتدّ عدوه
  ( طلا الطلا الولد من ذوات الظلف وابمع أطلاء وأنشد الاصعى "تزهير
  بها العين والارآم يمشين خلفة * وأطلاؤها بنهضن من كل مجتم
  والطلا الشخص يقال انه لهيل الطلا وأنشدا بوهرو
  وخذ كتن الصلبىّ جلونه • جبل الطلامستشرب اللون أ كمل
  والطلا أيضا المطلى بالقطران ابن السكيت الطلى الصغير من أولاد الغتم وانماعى طلبالانه
  يعلى أى تشدرجله بخيط الى وتدأيا ما وجعه طليان مئسل رغيف ورغفان ويقال طلوت
  الطلاوطليته اذا ربطته برجله وحبسته وطليت الشئ حبسته فهو طلى" ومطلىّ ويقال
  بأسنانه طلىّ وطليان مثل حبىّ وصيبان أى قلح تقول منه على فوه بالكسر بطلى طلى والطلى
  الاعناق قال الاصمعى واحدتها طلية وقال أبو عرو والغراء واحدتها طلاة وأعالى الرجل
  أى مالت عنقه لاموت أولغيره وقال الشاءر
  تركت أبالقد أطلى وماات • عليه القشعمان من النسور
  ويروى القشعمان مثال النعلبان والطسلاوة والطلاوة الحس-ن والقبول يقال مأعليه
  طلاوة والعالاء ماطنخ من عصير العنب حتى ذهب ثلثاه وتسميه العجم الميجتج وبعض العرب
