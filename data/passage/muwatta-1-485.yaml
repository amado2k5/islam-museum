label: { ar: "الموطأ 485 — الأعرابي النجدي يسأل عن الإسلام: خمس صلوات في اليوم والليلة؛ أفلح إن صدق", en: "Muwatta 485" }
text: "خمس صلوات في اليوم والليلة. قال: هل علي غيرهن؟ قال: لا، إلا أن تطوع"
summary:
  ar: "أول حديث في باب جامع الترغيب في الصلاة. يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه أنه سمع طلحة بن عبيد الله يقول: جاء رجل من أهل نجد ثائر الرأس يُسمع دوي صوته ولا يُفقه ما يقول حتى دنا فإذا هو يسأل عن الإسلام، فقال النبي خمس صلوات في اليوم والليلة، فسأل هل عليه غيرهن فقال لا إلا أن تطوع، ثم ذكر صيام رمضان فسأل مثله، ثم ذكر الزكاة فسأل مثله، فأدبر الرجل يقول والله لا أزيد على هذا ولا أنقص منه، فقال النبي: أفلح إن صدق. ويخرّجه المحقق عند البخاري (46، 2678) ومسلم (1/31) وأبي داود (391) والنسائي (1/226) وابن حبان وأحمد والبزار والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (16/157). {cite:muwatta-maruf-1997 p.248} {cite:muwatta-maruf-1997 p.249}"
