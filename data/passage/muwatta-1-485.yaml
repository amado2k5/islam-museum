label: { ar: "الموطأ 485 — الأعرابي النجدي يسأل عن الإسلام: خمس صلوات في اليوم والليلة؛ أفلح إن صدق", en: "Muwatta 485", es: "Muwatta 485", fr: "Muwatta 485", ur: "موطا 485", tr: "El-Muvatta 485 — Necdli bir Bedevi İslam hakkında soruyor: Gündüz ve gece beş vakit namaz; doğruyu söylerse kurtuluşa erer.", id: "Al-Muwatta 485 — Seorang Badui dari Najd bertanya tentang Islam: Shalat lima kali sehari dan lima kali semalam; dia akan beruntung jika dia jujur." }
text: "خمس صلوات في اليوم والليلة. قال: هل علي غيرهن؟ قال: لا، إلا أن تطوع"
summary:
  ar: "أول حديث في باب جامع الترغيب في الصلاة. يرويه يحيى عن مالك عن عمه أبي سهيل بن مالك عن أبيه أنه سمع طلحة بن عبيد الله يقول: جاء رجل من أهل نجد ثائر الرأس يُسمع دوي صوته ولا يُفقه ما يقول حتى دنا فإذا هو يسأل عن الإسلام، فقال النبي خمس صلوات في اليوم والليلة، فسأل هل عليه غيرهن فقال لا إلا أن تطوع، ثم ذكر صيام رمضان فسأل مثله، ثم ذكر الزكاة فسأل مثله، فأدبر الرجل يقول والله لا أزيد على هذا ولا أنقص منه، فقال النبي: أفلح إن صدق. ويخرّجه المحقق عند البخاري ⁦(46، 2678)⁩ ومسلم (1/31) وأبي داود (391) والنسائي (1/226) وابن حبان وأحمد والبزار والشافعي والبيهقي من طرق أصحاب مالك، ويحيل على التمهيد (16/157). {cite:muwatta-maruf-1997 p.248} {cite:muwatta-maruf-1997 p.249}"
  tr: "Namaza teşvik bölümündeki ilk hadis. Yahya, Malik'ten, o da amcası Ebu Suhayl ibn Malik'ten, o da babasından rivayetle, Talha ibn Ubaydullah'ın şöyle dediğini işitmiştir: Necd'den dağınık saçlı, gür sesli bir adam geldi, ancak yaklaşınca sözleri anlaşılmaz oldu. İslam hakkında sordu ve Peygamber, \"Gündüz ve gece beş vakit namaz\" dedi. Adam başka bir farz olup olmadığını sordu ve Peygamber, \"Hayır, nafile namazlar dışında\" diye cevap verdi. Sonra Ramazan orucundan bahsetti ve aynı soruyu sordu. Sonra zekâttan bahsetti ve aynı soruyu sordu. Adam, \"Allah'a yemin ederim ki, buna ne bir şey eklerim ne de bir şey eksiltirim\" diyerek uzaklaştı. Peygamber, \"Doğru sözlü olan kurtuluşa erer\" dedi. Bu hadis, el-Buhari (46, 2678), Müslim (1/31), Ebu Davud (391), el-Nesa'i (1/226), İbn Hibban, Ahmed, el-Bezzar, el-Şafi'i ve el-Beyhaki'nin mecmualarında, Malik'in sahabelerinin rivayetleri aracılığıyla bulunmaktadır. Yazar et-Temhid'den (16/157) bahsediyor. {cite:muwatta-maruf-1997 s.248} {cite:muwatta-maruf-1997 s.249}"
  id: "Hadits pertama dalam surah ini adalah tentang anjuran shalat. Diriwayatkan oleh Yahya dari Malik, dari pamannya Abu Suhayl ibn Malik, dari ayahnya, yang mendengar Talhah ibn Ubaydullah berkata: Seorang pria dari Najd datang dengan rambut acak-acakan, suaranya lantang, tetapi kata-katanya tidak dapat dipahami sampai dia mendekat. Dia bertanya tentang Islam, dan Nabi bersabda, \"Lima shalat siang dan malam.\" Pria itu bertanya apakah ada kewajiban lain, dan Nabi menjawab, \"Tidak, kecuali jika kamu melakukan shalat sunnah.\" Kemudian dia menyebutkan puasa di bulan Ramadhan dan menanyakan pertanyaan yang sama. Kemudian dia menyebutkan zakat dan menanyakan pertanyaan yang sama. Pria itu berpaling, berkata, \"Demi Allah, aku tidak akan menambah atau mengurangi ini.\" Nabi bersabda, \"Dia akan beruntung jika dia jujur.\" Hadits ini terdapat pada kumpulan al-Bukhari (46, 2678), Muslim (1/31), Abu Dawud (391), al-Nasa'i (1/226), Ibnu Hibban, Ahmad, al-Bazzar, al-Syafi'i, dan al-Bayhaqi, melalui silsilah para sahabat Malik. Penulis merujuk pada al-Tamhid (16/157). {kutip:muwatta-maruf-1997 hal.248} {kutip:muwatta-maruf-1997 hal.249}"
