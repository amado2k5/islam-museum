label: { ar: "جامع الترمذي 2623 — حلاوة الإيمان وكماله", en: "Jami' al-Tirmidhi 2623 — the sweetness and completeness of faith", ur: "جامع ترمذی 2623 — ایمان کی مٹھاس اور اس کا کمال", es: "Jami' al-Tirmidhi 2623 — La dulzura y la plenitud de la fe", fr: "Jami' al-Tirmidhi 2623 — la douceur et la plénitude de la foi" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا اللَّيْثُ، عَنِ ابْنِ الْهَادِ، عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ بْنِ الْحَارِثِ، عَنْ عَامِرِ بْنِ سَعْدِ بْنِ أَبِي وَقَّاصٍ، عَنِ الْعَبَّاسِ بْنِ عَبْدِ الْمُطَّلِبِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ يَقُولُ \" ذَاقَ طَعْمَ الإِيمَانِ مَنْ رَضِيَ بِاللَّهِ رَبًّا وَبِالإِسْلاَمِ دِينًا وَبِمُحَمَّدٍ نَبِيًّا \". قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2623، يذكر حلاوة الإيمان وكماله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Jami' al-Tirmidhi, no. 2623 (The Book on Faith), that mentions the sweetness and completeness of faith. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "جامع ترمذی کی حدیث نمبر 2623، جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Jami' al-Tirmidhi, n.º 2623 (El Libro de la Fe), menciona la dulzura y la plenitud de la fe. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2623 (Le Livre de la Foi), évoque la douceur et la plénitude de la foi. Le Guide des Piliers et des Branches de la Foi le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'Islam, aux branches de la foi et aux qualités du croyant."
