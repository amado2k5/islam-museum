label: { ar: "الموطأ 1574 — إسحاق بن عبد الله بن أبي طلحة عن أنس: دعا خياط النبي لطعام صنعه، فذهب معه، فرأى النبي يتبع الدباء من حول القصعة", en: "Muwatta 1574", es: "Muwatta 1574", fr: "Muwatta 1574", ur: "موطا 1574", tr: "El-Muvatta 1574 — İshak ibn Abdullah ibn Abi Talha, Enes'ten rivayetle: Peygamberin terzisi onu hazırladığı bir yemeğe davet etti, o da onunla gitti ve Peygamberin kase içinde kabağı takip ettiğini gördü.", id: "Al-Muwatta 1574 — Ishaq ibn Abdullah ibn Abi Talha berdasarkan riwayat Anas: Penjahit Nabi mengundangnya untuk makan yang telah disiapkannya, lalu ia pergi bersamanya, dan melihat Nabi mengikuti labu di sekitar mangkuk." }
text: "يَتَّبِعُ الدُّبَّاءَ مِن حَوْلِ الْقَصْعةِ"
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول إن خياطا دعا رسول الله لطعام صنعه، فذهبت مع رسول الله إلى ذلك الطعام، فقرب إليه برا من شعير ومرقا فيه دباء، فرأيت رسول الله يتبع الدباء من حول القصعة، فلم أزل أحب الدباء بعد ذلك اليوم. ويذكر المحقق أن أسانيد الحديث يقوي بعضها بعضا. {cite:muwatta-maruf-1997 p.55}"
  tr: "Malik, İshak ibn Abdullah ibn Abi Talha'dan rivayetle Enes ibn Malik'in şöyle dediğini işittiğini aktarır: Bir terzi, Allah'ın Resulü'nü hazırladığı bir yemeğe davet etti. Ben de Allah'ın Resulü ile birlikte o yemeğe gittim. Ona arpa ve kabaklı bir çorba ikram edildi. Allah'ın Resulü'nün kaseden kabakları ayıkladığını gördüm ve o günden sonra kabağı çok sevdim. Editör, bu hadisin rivayet zincirlerinin birbirini güçlendirdiğini belirtmektedir. {cite:muwatta-maruf-1997 s.55}"
  id: "Malik meriwayatkan dari Ishaq ibn Abdullah ibn Abi Talha bahwa ia mendengar Anas ibn Malik berkata: Seorang penjahit mengundang Rasulullah SAW untuk makan yang telah ia siapkan, maka aku pergi bersama Rasulullah SAW ke makan tersebut. Beliau disuguhi gandum jelai dan kaldu berisi labu. Aku melihat Rasulullah SAW mengambil labu dari sekeliling mangkuk, dan sejak hari itu, aku menyukai labu. Editor mencatat bahwa sanad hadits ini saling menguatkan. {cite:muwatta-maruf-1997 p.55}"
