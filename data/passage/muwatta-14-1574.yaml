label: { ar: "الموطأ 1574 — إسحاق بن عبد الله بن أبي طلحة عن أنس: دعا خياط النبي لطعام صنعه، فذهب معه، فرأى النبي يتبع الدباء من حول القصعة", en: "Muwatta 1574" }
text: "يَتَّبِعُ الدُّبَّاءَ مِن حَوْلِ الْقَصْعةِ"
summary:
  ar: "يروي مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول إن خياطا دعا رسول الله لطعام صنعه، فذهبت مع رسول الله إلى ذلك الطعام، فقرب إليه برا من شعير ومرقا فيه دباء، فرأيت رسول الله يتبع الدباء من حول القصعة، فلم أزل أحب الدباء بعد ذلك اليوم. ويذكر المحقق أن أسانيد الحديث يقوي بعضها بعضا. {cite:muwatta-maruf-1997 p.55}"
