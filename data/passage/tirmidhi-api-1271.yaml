text: "… عَنْ إِيَاسِ بْنِ عَبْدٍ الْمُزَنِيِّ، قَالَ نَهَى النَّبِيُّ عَنْ بَيْعِ الْمَاءِ. قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ وَبُهَيْسَةَ عَنْ أَبِيهَا وَأَبِي هُرَيْرَةَ وَعَائِشَةَ وَأَنَسٍ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو. قَالَ أَبُو عِيسَى حَدِيثُ إِيَاسٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ أَنَّهُمْ كَرِهُوا بَيْعَ الْمَاءِ. وَهُوَ قَوْلُ ابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ وَأَحْمَدَ وَإِسْحَاقَ. وَقَدْ رَخَّصَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1271، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1271 (The Book on Business), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1271، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
