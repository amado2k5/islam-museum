label: { ar: "جامع الترمذي 1271 — الأب والأبوة", en: "Jami' al-Tirmidhi 1271 — the father and fatherhood", ur: "جامع ترمذی 1271 — باپ اور والدیت", es: "Jami' al-Tirmidhi 1271 — El padre y la paternidad", fr: "Jami' al-Tirmidhi 1271 — le père et la paternité", tr: "Cami' el-Tirmizi 1271 — Baba ve Babalık", id: "Jami' al-Tirmidhi 1271 — Sang Ayah dan Peran Ayah" }
text: "… عَنْ إِيَاسِ بْنِ عَبْدٍ الْمُزَنِيِّ، قَالَ نَهَى النَّبِيُّ عَنْ بَيْعِ الْمَاءِ. قَالَ وَفِي الْبَابِ عَنْ جَابِرٍ وَبُهَيْسَةَ عَنْ أَبِيهَا وَأَبِي هُرَيْرَةَ وَعَائِشَةَ وَأَنَسٍ وَعَبْدِ اللَّهِ بْنِ عَمْرٍو. قَالَ أَبُو عِيسَى حَدِيثُ إِيَاسٍ حَدِيثٌ حَسَنٌ صَحِيحٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَكْثَرِ أَهْلِ الْعِلْمِ أَنَّهُمْ كَرِهُوا بَيْعَ الْمَاءِ. وَهُوَ قَوْلُ ابْنِ الْمُبَارَكِ وَالشَّافِعِيِّ وَأَحْمَدَ وَإِسْحَاقَ. وَقَدْ رَخَّصَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 1271، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 1271 (The Book on Business), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 1271، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 1271 (El Libro de los Negocios), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 1271 (Le Livre des Affaires), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
  tr: "Cami' el-Tirmizi'nin 1271 numaralı hadisinde baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 1271, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
