text: |-
  ٦٨
  *⁦(أهن)⁩*
  الفراء تأزق صدرى وتأزل أى ضاق فق ، الآفاق التواحى الواحد أفق وأفق مثل
  عسر وعسر ورجل أفتى بفتح الهمزة والفاء اذا كان من آفاق الارض حكاه أبونصر
  وبعضهم يقول أفقّ يضمهما وهر القياس وفرس أفق بالضم أى رائع وكذلاك الأى
  قال الشاعر
  أرجل لمتى وأجز ذيلى • وتحمل شكنى أفق كت
  والآفق الذى يلغ النهاية فى الكرم على فاعل تقول منه أفق بالكسر يأفق أفقا وذرس آفق
  قويل من آفق وافقة اذا كان كريم الطرفين والافيق الجلد الذى لم تتم دباغته والجمع أفق مثل
  أديم وأدم وقد أفق أديمه يأفقه أفقا أى دبغه الى أن صارأفيقا وقان الاصمعى يقال
  للاديم اذادبغ قبل أن يخرز أفيق والجمع آفقة مل أديم وآهمة ورغيف وأرغفة ويقال أفق
  فلان اذا ذهب فى الارض وأقو فى العطاء أى فضل وأعطى بعضا أكثر من بعض ومنه قول
  الاعشى
  ولا الملك النعمان يوم لقيته * بعبطته يعطى القطوط ويأفق
  وأراد بالقطوط كتب الجوائز ( ا ق تألق البرق أى لمع والاثتلاف مثل التألق
  والااق بالكسر الذتب والاتى القة وجعها القوربعا قالو اللقردة القة ولا يقال للذكرالق
  ولكن قردورباح قال الشاعر« والقة ترغثرتاحها* والاواق الجنون وهو فوعل لانه
  يقال للمجنون مؤولق على مفوصل قال الشاعر
  ومؤولق أنضحت كية رأسه • قتركته ذفراكرمج الجورب
  أى هجوته وان سقت جعلت الاولق أفعل لانه يقال ألق الرجل فهو مألوق على مفعول قال
  أبوزيد اهرأة ألقى بالتحريك قال وهى السريعة الوئب والااق المتألق وهو على وزت اقع
  والالوقة لعام يصلح من الزبدقال الشاعر
  حديثك أشهى عندنا من ألوقة * تعجلها طيات:هوان للطعم
  ا ق الائق الفرح والسرور وقد أنق بالكسر يأتق أنقاوشئ أنيق أى حسن معجب
  وانتنى الشأى أعجمبى وتأنق فى الامراذا عمله بنيقسة مثل تنوق ولداناقة ولباقة وتأذق
  غلان فى الروضة اذا وقع فيها معجبابهنا والانوق على فعول طائروهو الرخة وفى المثل أءزمن
  بيض الانوق لانها تحرزه ف_لا يكاد ينظفسر بدلان أوكارها فى رؤس الجيال والاماكن
  الصعبة البعيدة وهى تحمق مع ذلك قال الكميت
  وذات اسميز والالوان شى * تحمق وهى كيسة المويل
  واتماقال ذات اسمين لانها تسمى الرخة والانوق وق الاوق النقل يقال ألتى عليه
  أوقه وقد أوقته تأويقا أى حلته المشقة والمكروه قال الراجز
  عزعلى عمك أن تأقق • أو أن تبيتى ليلة لم تغبق * أو أن ترى كابا لم تبرنشق
  وأمّاقول الشاعر
  تمع من السيدان والأوق تظرة * فقليك للسيدان والاوق آلفَ
  فهواسم موضع ( هق لايهقان الجرجير البرى وهو فيعلان قال لبيد
  فعلا
