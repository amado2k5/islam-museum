text: "رأيت أبا بكر الصديق أكل لحماً ثم صلى ولم يتوضأ"
summary:
  ar: "أثر يرويه يحيى عن مالك عن أبي نعيم وهب بن كيسان أنه سمع جابر بن عبد الله الأنصاري يقول إنه رأى أبا بكر الصديق أكل لحماً ثم صلى ولم يتوضأ؛ وهو في باب ترك الوضوء مما مست النار. ويذكر المحقق أن عبد الرزاق وابن أبي شيبة أخرجا آثاراً عن أبي بكر بهذا المعنى. {cite:muwatta-maruf-1997 p.63}"
