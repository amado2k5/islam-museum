label: { ar: "الموطأ 861 — أبو هريرة: والذي نفسي بيده، لخلوف فم الصائم أطيب عند الله من ريح المسك، يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به", en: "Muwatta 861", es: "Muwatta 861", fr: "Muwatta 861", ur: "موطا 861", tr: "El-Muvatta 861 — Ebu Hurayra: Canım elinde olan Allah'a yemin ederim ki, oruç tutanın nefesi Allah katında misk kokusundan daha tatlıdır. O, benim rızam için arzularından, yemeğinden ve içeceğinden vazgeçer. Oruç benim içindir ve ben onu mükafatlandıracağım.", id: "Al-Muwatta 861 — Abu Hurairah: Demi Dia yang jiwaku berada di tangan-Nya, napas orang yang berpuasa lebih harum di sisi Allah daripada wangi kesturi. Ia meninggalkan hawa nafsu, makanan, dan minumannya demi Aku. Puasa adalah untuk-Ku, dan Aku akan memberi pahala kepadanya." }
text: "لخلوف فم الصائم أطيب عند الله من ريح المسك، إنما يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: والذي نفسي بيده، لخلوف فم الصائم أطيب عند الله من ريح المسك، إنما يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به، وكل حسنة بعشر أمثالها إلى سبعمئة ضعف إلا الصيام فهو لي وأنا أجزي به. ويذكر المحقق أنه رواه عن مالك أبو مصعب (854) ومن طريقه البغوي، وإسماعيل بن أبي أويس عند البخاري (1904)، وسويد، والقعنبي عند البخاري. {cite:muwatta-maruf-1997 p.416}"
  id: "Diriwayatkan oleh Malik dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah, bahwa Rasulullah shalla Allahu alaihi wa sallam bersabda: “Demi Dia yang jiwaku berada di tangan-Nya, napas orang yang berpuasa lebih harum di sisi Allah daripada wangi kesturi. Ia hanya meninggalkan hawa nafsu, makanan, dan minumannya demi Aku. Puasa adalah untuk-Ku dan Aku akan memberi pahala kepadanya. Setiap amal kebaikan akan diberi pahala sepuluh kali lipat hingga tujuh ratus kali lipat, kecuali puasa, yang adalah untuk-Ku dan Aku akan memberi pahala kepadanya.” Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (854), dan dari sanadnya oleh al-Baghawi, Isma'il ibn Abi Uways (sebagaimana tercatat oleh al-Bukhari, 1904), Suwayd, dan al-Qa'nabi (sebagaimana tercatat oleh al-Bukhari). {mengutip:muwatta-maruf-1997 hal.416}"
