label: { ar: "الموطأ 861 — أبو هريرة: والذي نفسي بيده، لخلوف فم الصائم أطيب عند الله من ريح المسك، يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به", en: "Muwatta 861" }
text: "لخلوف فم الصائم أطيب عند الله من ريح المسك، إنما يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به"
summary:
  ar: "يرويه مالك عن أبي الزناد عن الأعرج عن أبي هريرة، أن رسول الله قال: والذي نفسي بيده، لخلوف فم الصائم أطيب عند الله من ريح المسك، إنما يذر شهوته وطعامه وشرابه من أجلي، فالصيام لي وأنا أجزي به، وكل حسنة بعشر أمثالها إلى سبعمئة ضعف إلا الصيام فهو لي وأنا أجزي به. ويذكر المحقق أنه رواه عن مالك أبو مصعب (854) ومن طريقه البغوي، وإسماعيل بن أبي أويس عند البخاري (1904)، وسويد، والقعنبي عند البخاري. {cite:muwatta-maruf-1997 p.416}"
