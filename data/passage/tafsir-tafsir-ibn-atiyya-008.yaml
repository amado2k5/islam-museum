text: "، ووقع ظلمه؟ - فقالت فرقة: ((له ذلك)، ذلك في صحيح البخاري، وفي كتاب السير، وذهب النحاس إلى أنها مكية . ومنهم ابن سيرين، وإبراهيم النخعي، وسفيان، ومجاهد، قال القاضي أبو محمد رحمه الله : واحتجت بهذه الآية وعموم لفظها،"
