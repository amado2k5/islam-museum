text: "جاج : قد ذكرناه في ترجمة عبد الملك بن مروان، وأن عبد الملك كتب له كتابا إلى الحجاج بأمانه، وكان قد شبب بأخت الحجاج [وكان اسمها] زينب. [وقال أبو انفرج الأصفهاني: كان ابن نمير يشبب بأخت الحجاج] فأباح الحجاج دمه،"
