label: { ar: "الموطأ 1778 — يحيى عن مالك عن عبد الله بن دينار عن سليمان بن يسار وعروة بن الزبير عن عائشة: يحرم من الرضاعة ما يحرم من الولادة، وينبه المحقق إلى أن ابن عبد البر رأى الواو في الإسناد خطأ", en: "Muwatta 1778" }
text: "يَحْرُمُ مِن الرَّضاعَةِ مَا يَحْرُمُ مِن الْوِلَاَدةِ"
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن دينار عن سليمان بن يسار، وعن عروة بن الزبير، عن عائشة أم المؤمنين، أن رسول الله قال: يحرم من الرضاعة ما يحرم من الولادة. وينقل المحقق قول ابن عبد البر إن الصواب في الإسناد: سليمان بن يسار عن عروة بن الزبير، وإن الواو في كتاب يحيى خطأ، وإن الحديث رواه مكحول الشامي عن عروة. {cite:muwatta-maruf-1997 p.126}"
