label:
  ar: "رياض الصالحين 1528 — من رد عن عرض أخيه رد الله عن وجهه النار"
  en: "Riyad al-Salihin 1528 — Whoever defends his brother's honor, God shields him from the Fire"
  es: "Riyad al-Salihin 1528 — Quien defiende el honor de su hermano, Dios lo protege del Fuego."
  fr: "Riyad al-Salihin 1528 — Quiconque défend l'honneur de son frère, Dieu le protège du Feu"
  ur: "ریاض الصالحین 1528 - جو اپنے بھائی کی عزت کا دفاع کرتا ہے خدا اسے آگ سے بچاتا ہے"
  tr: "Riyad es-Salihin 1528 — Kim kardeşinin şerefini savunursa, Allah onun yüzünü ateşten korur."
  id: "Riyad as-Salihin 1528 — Barangsiapa membela kehormatan saudaranya, Allah akan melindungi wajahnya dari api neraka."
text: "مَنْ رَدَّ عَنْ عِرْضِ أَخِيهِ رَدَّ اللَّهُ عَنْ وَجْهِهِ النَّارَ يَوْمَ الْقِيَامَةِ"
