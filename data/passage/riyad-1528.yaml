  ur: "النووی کی ریاض الصالحین میں ایک حدیث، باب «كتاب الأمور المنهي عنها» میں، چالیس الفاظ میں نقل کی گئی ہے۔"
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinde, \"Yasak İşler Kitabı\" bölümünde, hadisin kilidini açan kaynaktan alınmış yaklaşık kırk kelimelik bir hadis metni."
