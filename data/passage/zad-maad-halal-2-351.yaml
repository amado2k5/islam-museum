text: "اللعان مأذون فيه شرعاً، بل هو بادر إلى فراقها، وإن كان الأمر صائراً إلى ما بادر إليه، وأما طلاقُه ثلاثةً، فما زاد الفُرقة الواقعة إلا تأكيداً، فإنها حرمت عليه تحريماً مؤبَّداً، فالطلاقُ تأكيد لهذا التحريم، وكأنه قال: لا تَحِلُّ لي …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 2، ص 351، يذكر ما أُحل، وما لا يحل، وما حُرّم، والتحريم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn al-Qayyim's Zad al-Ma'ad, scan volume 2, p. 351, that mentions what was made lawful, what is not lawful, what was made unlawful, prohibition; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "زاد المعاد، ابن القیم، اسکین جلد 2، ص 351 کا اقتباس جس میں جو حلال کیا گیا، جو حلال نہیں، جو حرام کیا گیا، تحریم کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Zad al-Ma'ad de Ibn al-Qayyim, volumen 2, pág. 351, que menciona lo que se ha permitido, lo que no se permite, lo que se ha prohibido y las prohibiciones; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait du Zad al-Ma'ad d'Ibn al-Qayyim, volume 2, page 351, mentionnant ce qui a été rendu licite, ce qui ne l'est pas, ce qui a été déclaré illicite et les interdits; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié dans le Halal and Haram Browser."
  tr: "İbn al-Qayyim'in *Zad al-Ma'ad* adlı eserinin 2. cildinin 351. sayfasından, helal, haram ve haram olan şeyleri ve haramlığın kendisini anlatan bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Zad al-Ma'ad* karya Ibn al-Qayyim, Jilid 2, halaman 351, yang menyebutkan apa yang diperbolehkan, tidak diperbolehkan, dan dilarang, serta larangan itu sendiri; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
