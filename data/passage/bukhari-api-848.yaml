label: { ar: "صحيح البخاري 848 — الفريضة والفرائض، التطوع", en: "Sahih al-Bukhari 848 — the obligation (farida); the voluntary act (tatawwu')", ur: "صحیح بخاری 848 — فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩", fr: "Sahih al-Bukhari 848 — l'obligation (farida) ; l'acte volontaire (tatawwu')", es: "Sahih al-Bujari 848 — la obligación (farida); el acto voluntario (tatawwu')", tr: "Sahih el-Buhari 848 — Zorunlu ve Gönüllü Ameller", id: "Sahih al-Bukhari 848 — Amalan Wajib dan Amalan Sunnah" }
text: "وَقَالَ لَنَا آدَمُ حَدَّثَنَا شُعْبَةُ، عَنْ أَيُّوبَ، عَنْ نَافِعٍ، قَالَ كَانَ ابْنُ عُمَرَ يُصَلِّي فِي مَكَانِهِ الَّذِي صَلَّى فِيهِ الْفَرِيضَةَ. وَفَعَلَهُ الْقَاسِمُ. وَيُذْكَرُ عَنْ أَبِي هُرَيْرَةَ رَفَعَهُ لاَ يَتَطَوَّعُ الإِمَامُ فِي مَكَانِهِ. وَلَمْ يَصِحَّ."
summary:
  ar: "حديث في صحيح البخاري، رقم 848، يرد فيه ذكر الفريضة والفرائض، والتطوع. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب، ويصف المتحف ما في النص ولا يُفتي به."
  en: "A report in Sahih al-Bukhari, no. 848 (Call to Prayers (Adhaan)), whose wording mentions the obligation (farida), the voluntary act (tatawwu'). The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on these themes; the museum describes what the text says and issues no ruling."
  ur: "صحیح بخاری کی حدیث نمبر 848، جس کے الفاظ میں فریضہ اور فرائض، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے؛ میوزیم متن کا بیان کرتا ہے، فتویٰ نہیں دیتا۔"
  fr: "Un récit de Sahih al-Bukhari, n° 848, dont le texte mentionne l'obligation (farida), l'acte volontaire (tatawwu'). Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le réunit avec les textes du Coran, de la Sunna, de la sîra et les récits des Compagnons et des Suivants sur ces thèmes ; le musée décrit ce que dit le texte et ne rend aucun avis juridique."
  es: "Un relato de Sahih al-Bujari, n.º 848, cuyo texto menciona la obligación (farida), el acto voluntario (tatawwu'). El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo reúne con los textos del Corán, la Sunna, la sira y los relatos de los Compañeros y los Sucesores sobre estos temas; el museo describe lo que dice el texto y no emite ningún dictamen."
  tr: "Sahih el-Buhari'de 848 numaralı hadis, farz olan amelleri, görevleri ve gönüllü amelleri ele almaktadır. Bu hadis, farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları inceleyen bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile onların haleflerinin bu konulardaki rivayetleriyle birlikte derlenmiştir. Araştırmacı metnin içeriğini açıklamış ancak buna dayanarak dini bir hüküm vermemiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 848, menyebutkan tentang amalan wajib, kewajiban, dan amalan sunnah. Hadits ini disusun oleh seorang peneliti yang ahli dalam amalan wajib, kewajiban, ketaatan, amalan anjuran, amalan makruh, amalan haram, dan dosa-dosa kecil, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka tentang topik-topik tersebut. Peneliti tersebut menjelaskan isi teks tetapi tidak mengeluarkan fatwa agama berdasarkan teks tersebut."
