label: { ar: "صحيح مسلم 4487 — الأجران", en: "Sahih Muslim 4487 — the double reward", ur: "صحیح مسلم 4487 — دوہرا اجر", es: "Sahih Muslim 4487 — la doble recompensa", fr: "Sahih Muslim 4487 — la double récompense", tr: "Sahih Muslim 4487 — İki Ödül", id: "Sahih Muslim 4487 — Dua Pahala" }
text: "… أَخْبَرَنَا عَبْدُ الْعَزِيزِ بْنُ مُحَمَّدٍ، عَنْ يَزِيدَ بْنِ عَبْدِ، اللَّهِ بْنِ أُسَامَةَ بْنِ الْهَادِ عَنْ مُحَمَّدِ بْنِ إِبْرَاهِيمَ، عَنْ بُسْرِ بْنِ سَعِيدٍ، عَنْ أَبِي قَيْسٍ، مَوْلَى عَمْرِو بْنِ الْعَاصِ عَنْ عَمْرِو بْنِ الْعَاصِ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ قَالَ \" إِذَا حَكَمَ الْحَاكِمُ فَاجْتَهَدَ ثُمَّ أَصَابَ فَلَهُ أَجْرَانِ. وَإِذَا حَكَمَ فَاجْتَهَدَ ثُمَّ أَخْطَأَ فَلَهُ أَجْرٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 4487، يذكر الأجران. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih Muslim, no. 4487 (The Book of Judicial Decisions), that speaks of the double reward. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح مسلم کی حدیث نمبر 4487، جس میں دوہرا اجر کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un informe en Sahih Muslim, n.° 4487 (El Libro de Decisiones Judiciales), habla de la doble recompensa. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que cuentan, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sahih Muslim, n° 4487 (Livre des décisions judiciaires), évoque la double récompense. Le Livre des Hasanat et Sayyi'at le mentionne parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sahih Müslim'de 4487 numaralı hadis, iki tür mükafattan bahseder. Bu hadis, iyi ve kötü amellerin listesini, ameli sayan, kaydeden, silen veya tartan metinlerle birleştirir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 4487, menyebutkan dua pahala. Hadits ini menggabungkan daftar amal baik dan amal buruk dengan teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
