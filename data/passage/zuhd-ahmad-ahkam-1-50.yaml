text: "… ؛ فقد روى عن عمر بن الخطاب له أن قال : من أظهر لنا خيرًا ظننا به خيرًا وأحببناه عليه، ومن أظهر لنا شرًا ظننا به شرًا وأبغضناه عليه. وينبغي له أن يتنزه عن المكروهات وفضول المباحات أمام تلامذته، وأن …"
