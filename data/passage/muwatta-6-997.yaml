label: { ar: "الموطأ 997 — نبيه بن وهب: عمر بن عبيد الله أرسل إلى أبان بن عثمان، وهو أمير الحاج، أنه يريد أن ينكح طلحة بنت شيبة، فأنكر أبان ذلك وقال: سمعت عثمان يقول: قال رسول الله: لا ينكح المحرم ولا ينكح ولا يخطب", en: "Muwatta 997", es: "Muwatta 997", fr: "Muwatta 997", ur: "موطا 997", tr: "El-Muvatta 997 — Nebih ibn Vahb: Ömer ibn Ubeyd, Allah'ın Hac kervanının lideri Eban ibn Osman'a Talha bint Şeybe ile evlenmek istediğini bildirdiğini söyledi. Eban buna itiraz etti ve şöyle dedi: Osman'ın şöyle dediğini işittim: Allah'ın Resulü şöyle buyurdu: İhramlı olan kimse ne evlenmeli, ne evlendirmeli, ne de evlilik teklifinde bulunmalıdır.", id: "Al-Muwatta 997 — Nabih ibn Wahb: Umar ibn Ubayd Allah mengirimkan pesan kepada Aban ibn Uthman, yang merupakan pemimpin kafilah haji, bahwa ia ingin menikahi Talha bint Shaybah. Aban keberatan dan berkata: Aku mendengar Uthman berkata: Rasulullah SAW bersabda: Seseorang yang sedang ihram tidak boleh menikah, tidak boleh dinikahkan, dan tidak boleh melamar." }
text: "لا ينكح المحرم، ولا ينكح، ولا يخطب"
summary:
  ar: "يرويه مالك عن نافع عن نبيه بن وهب أخي بني عبد الدار، أن عمر بن عبيد الله أرسل إلى أبان بن عثمان، وأبان يومئذ أمير الحاج، وهما محرمان، أنه يريد أن ينكح طلحة بن عمر بنت شيبة بن جبير، ويريد أن يحضر أبان، فأنكر ذلك أبان وقال: سمعت عثمان بن عفان يقول: قال رسول الله: لا ينكح المحرم ولا ينكح ولا يخطب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1177) وسويد ⁦(331 و565)⁩ وغيرهم. {cite:muwatta-maruf-1997 p.468}"
  tr: "Malik, Nafi'den, o da Beni Abdülder'in kardeşi Nebih ibn Vahb'dan rivayet ettiğine göre, Ömer ibn Ubeyd Allah, o sırada Hac kervanının lideri olan Eban ibn Osman'a, ikisi de ihramlı haldeyken, Talha ibn Ömer'i Şeybe ibn Cübeyr'in kızıyla evlendirmek istediğini ve Eban'ın da orada bulunmasını istediğini bildirmiştir. Eban buna itiraz ederek şöyle demiştir: Osman ibn Affan'ın şöyle dediğini işittim: Allah Resulü şöyle buyurdu: \"İhramlı olan kimse ne evlenmeli, ne de evlendirmeli, ne de evlilik teklifinde bulunmalıdır.\" Araştırmacı, bunun Malik'ten Ebu Musab (1177), Suveyd (331 ve 565) ve diğerleri tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.468}"
  id: "Malik meriwayatkannya dari Nafi’ yang juga meriwayatkan dari Nabih ibn Wahb, saudara Banu Abd al-Dar, bahwa Umar ibn Ubayd Allah mengirim pesan kepada Aban ibn Uthman, yang saat itu pemimpin kafilah haji, ketika mereka berdua dalam keadaan ihram, bahwa ia ingin menikahkan Talhah ibn Umar dengan putri Shaybah ibn Jubayr, dan ia ingin Aban hadir. Aban keberatan dan berkata: Aku mendengar Uthman ibn Affan berkata: Rasulullah SAW bersabda: “Seseorang yang sedang ihram tidak boleh menikah, tidak boleh dinikahkan, dan tidak boleh melamar.” Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus’ab (1177), Suwayd (331 dan 565), dan lainnya. {cite:muwatta-maruf-1997 p.468}"
