label: { ar: "الموطأ 997 — نبيه بن وهب: عمر بن عبيد الله أرسل إلى أبان بن عثمان، وهو أمير الحاج، أنه يريد أن ينكح طلحة بنت شيبة، فأنكر أبان ذلك وقال: سمعت عثمان يقول: قال رسول الله: لا ينكح المحرم ولا ينكح ولا يخطب", en: "Muwatta 997" }
text: "لا ينكح المحرم، ولا ينكح، ولا يخطب"
summary:
  ar: "يرويه مالك عن نافع عن نبيه بن وهب أخي بني عبد الدار، أن عمر بن عبيد الله أرسل إلى أبان بن عثمان، وأبان يومئذ أمير الحاج، وهما محرمان، أنه يريد أن ينكح طلحة بن عمر بنت شيبة بن جبير، ويريد أن يحضر أبان، فأنكر ذلك أبان وقال: سمعت عثمان بن عفان يقول: قال رسول الله: لا ينكح المحرم ولا ينكح ولا يخطب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1177) وسويد (331 و565) وغيرهم. {cite:muwatta-maruf-1997 p.468}"
