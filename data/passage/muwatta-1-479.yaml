label: { ar: "الموطأ 479 — ابن مسعود: زمان كثير فقهاؤه قليل قراؤه، وسيأتي زمان على العكس", en: "Muwatta 479", es: "Muwatta 479", fr: "Muwatta 479", ur: "موطا 479", tr: "İbn Mes'ud, El-Muvatta 479: Öyle bir zaman gelecek ki, çok sayıda fıkıhçı olacak, Kur'an okuyucusu ise az olacak; öyle bir zaman gelecek ki, bunun tam tersi olacak.", id: "Al-Muwatta 479 — Ibnu Mas'ud: Akan tiba waktunya ketika banyak ahli fiqih tetapi sedikit yang membaca Al-Quran, dan akan datang waktunya ketika kebalikannya akan terjadi." }
text: "إنك في زمان كثير فقهاؤه، قليل قراؤه، تحفظ فيه حدود القرآن وتضيع حروفه"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب جامع الصلاة: قال عبد الله بن مسعود لإنسان إنه في زمان كثير فقهاؤه قليل قراؤه، تُحفظ فيه حدود القرآن وتُضيع حروفه، قليل من يسأل كثير من يعطي، يطيلون الصلاة ويقصرون الخطبة ويبدؤون أعمالهم قبل أهوائهم؛ وسيأتي زمان قليل فقهاؤه كثير قراؤه، تُحفظ حروف القرآن وتُضيع حدوده، كثير من يسأل قليل من يعطي، يطيلون الخطبة ويقصرون الصلاة ويبدون أهواءهم قبل أعمالهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن عبد الرزاق (3787) أخرج نحوه عن معمر عن أبي إسحاق عن أبي الأحوص عن ابن مسعود، ويعلق: وهذا زماننا. وإسناد مالك هنا منقطع بين يحيى بن سعيد وابن مسعود. {cite:muwatta-maruf-1997 p.246}"
  tr: "Malik'in Yahya ibn Sa'id'den rivayet ettiği, tam namaz bölümünde yer alan bir hadiste Abdullah ibn Mas'ud şöyle demiştir: \"Öyle bir zaman gelecek ki, çok âlim olacak, ama Kur'an okuyan az olacak. Kur'an'ın sınırları korunacak, ama harfleri ihmal edilecek. Az kişi isteyecek, çok kişi verecek. Namazı uzatacaklar, hutbeyi kısaltacaklar ve amellerini arzularının önüne koyacaklar. Ve öyle bir zaman gelecek ki, az âlim olacak, ama Kur'an okuyan çok olacak. Kur'an'ın harfleri korunacak, ama sınırları ihmal edilecek. Çok kişi isteyecek, ama az kişi verecek. Hutbeyi uzatacaklar, namazı kısaltacaklar ve arzularını amellerinin önüne koyacaklar.\" Editör, Ebu Mus'ab'ın bunu Malik'ten rivayet ettiğini ve Abdül-Razzaq'ın (3787) da Ma'mar'dan, o da Ebu İshak'tan, o da Ebu el-Ahvas'tan, o da İbn Mes'ud'dan benzer bir rivayet aktardığını belirtiyor. Şöyle yorumluyor: \"Bu bizim zamanımız.\" Malik'in rivayet zinciri burada Yahya ibn Sa'id ve İbn Mes'ud arasında kopuyor. {cite:muwatta-maruf-1997 s.246}"
  id: "Sebuah riwayat dari Malik, berdasarkan Yahya ibn Sa'id, dalam surah tentang shalat lengkap: Abdullah ibn Mas'ud berkata kepada seseorang, \"Akan tiba suatu masa ketika banyak ulama tetapi sedikit yang membaca Al-Quran. Batasan-batasan Al-Quran akan dijaga, tetapi huruf-hurufnya akan diabaikan. Sedikit yang meminta, tetapi banyak yang memberi. Mereka akan memperpanjang shalat dan mempersingkat khutbah, dan mereka akan memprioritaskan amal perbuatan mereka daripada keinginan mereka. Dan akan datang suatu masa ketika sedikit ulama tetapi banyak yang membaca Al-Quran. Huruf-huruf Al-Quran akan dijaga, tetapi batasan-batasannya akan diabaikan. Banyak yang meminta, tetapi sedikit yang memberi. Mereka akan memperpanjang khutbah dan mempersingkat shalat, dan mereka akan memprioritaskan keinginan mereka daripada amal perbuatan mereka.\" Penyunting menyebutkan bahwa Abu Mus'ab meriwayatkan hadits ini dari Malik, dan bahwa Abd al-Razzaq (3787) meriwayatkan sesuatu yang serupa dari Ma'mar, dari Abu Ishaq, dari Abu al-Ahwas, dari Ibn Mas'ud. Ia berkomentar: \"Inilah zaman kita.\" Rantai periwayatan Malik di sini terputus antara Yahya ibn Sa'id dan Ibn Mas'ud. {cite:muwatta-maruf-1997 p.246}"
