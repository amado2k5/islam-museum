label: { ar: "الموطأ 479 — ابن مسعود: زمان كثير فقهاؤه قليل قراؤه، وسيأتي زمان على العكس", en: "Muwatta 479" }
text: "إنك في زمان كثير فقهاؤه، قليل قراؤه، تحفظ فيه حدود القرآن وتضيع حروفه"
summary:
  ar: "أثر يرويه مالك عن يحيى بن سعيد، في باب جامع الصلاة: قال عبد الله بن مسعود لإنسان إنه في زمان كثير فقهاؤه قليل قراؤه، تُحفظ فيه حدود القرآن وتُضيع حروفه، قليل من يسأل كثير من يعطي، يطيلون الصلاة ويقصرون الخطبة ويبدؤون أعمالهم قبل أهوائهم؛ وسيأتي زمان قليل فقهاؤه كثير قراؤه، تُحفظ حروف القرآن وتُضيع حدوده، كثير من يسأل قليل من يعطي، يطيلون الخطبة ويقصرون الصلاة ويبدون أهواءهم قبل أعمالهم. ويذكر المحقق أنه رواه عن مالك أبو مصعب، وأن عبد الرزاق (3787) أخرج نحوه عن معمر عن أبي إسحاق عن أبي الأحوص عن ابن مسعود، ويعلق: وهذا زماننا. وإسناد مالك هنا منقطع بين يحيى بن سعيد وابن مسعود. {cite:muwatta-maruf-1997 p.246}"
