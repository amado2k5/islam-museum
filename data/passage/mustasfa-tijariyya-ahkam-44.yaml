text: "… للواجب إلا ما ترجح فعله على تركه بدفع ضرر معلوم أوموهوم، فمعنى الوجوب رجحان الفسل على الترك، والموجب هو المرجيح، واللّه تعالى هو المرجح، وهو الذى عرف رسوله، وأمره أن يعرف الناس أن الكفر سم مهلك، والمعصية داء والطاعة شفاء. …"
