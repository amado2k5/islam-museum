label: { ar: "الموطأ 591 — جعفر بن محمد عن أبيه مرسلاً: غُسل النبي في قميص", en: "Muwatta 591", es: "Muwatta 591", fr: "Muwatta 591", ur: "موطا 591", tr: "El-Muvatta 591 — Cafer ibn Muhammed, babasının rivayetine göre, mursal bir hadiste: Peygamber bir gömlekle yıkandı.", id: "Al-Muwatta 591 — Ja'far ibn Muhammad, berdasarkan hadits mursal dari ayahnya: Nabi dimandikan dengan mengenakan baju." }
summary:
  ar: "أول حديث في كتاب الجنائز وفي باب ما جاء في غسل الميت. يرويه مالك عن جعفر بن محمد عن أبيه مرسلاً، أن النبي غُسل في قميص. ويذكر المحقق أن هذا الكتاب وقع في بعض النسخ بعد كتاب الجهاد وهو اختلاف قديم في ترتيب الموطأ، وأنه أبقاه في موضعه هنا، وأن الحديث رواه عن مالك أبو مصعب وسويد والشافعي في المسند، وينقل عن ابن عبد البر ⁦(التمهيد 2/15)⁩ أن سائر رواة الموطأ أرسلوه إلا سعيد بن عفير فجعله عن عائشة، وأن الحكم عنده أنه مرسل عند مالك، لكنه حديث مشهور عند أهل السير والمغازي، وقد روي مسنداً من حديث عائشة من وجه صحيح، من رواية عباد بن عبد الله بن الزبير عنها عند أحمد (6/267) وأبي داود (3141) وابن حبان (6627) والحاكم (3/56). {cite:muwatta-maruf-1997 p.305}"
  tr: "Cenaze Kitabı'ndaki, ölülerin yıkanmasıyla ilgili rivayetler bölümündeki ilk hadis, Malik tarafından Cafer ibn Muhammed'den, o da babasından rivayetle mursal hadis olarak nakledilmiştir ve Peygamber'in gömlek giymiş halde yıkandığını belirtir. Editör, bu hadisin Cihad Kitabı'ndan sonraki bazı rivayetlerde de yer aldığını, bunun Muwatta'nın sıralamasında eski bir tutarsızlık olduğunu belirtir. Burada hadisin konumunu korur ve hadisin Malik'ten Ebu Musab, Suveyd ve Şafiî tarafından Musned'de nakledildiğini söyler. İbn Abdülberr'in (el-Tamhid 2/15) Muwatta'nın tüm ravilerinin, Sa'id ibn Ufeyr hariç, hadisi mursal olarak naklettiğini, Sa'id ibn Ufeyr'in ise hadisi Aişe'ye atfettiğini söylediğini aktarır. İbn Abdül-Barr'a göre, Malik tarafından mursal olarak kabul edilir, ancak Peygamberin seferlerinin biyografilerini yazanlar ve tarihçiler arasında iyi bilinen bir hadistir. Ayrıca, Ahmed (6/267), Ebu Davud (3141), İbn Hibban (6627) ve el-Hakim'in (3/56) derlemelerinde, Aişe'den sahih bir isnad yoluyla, Abbasi ibn Abdullah ibn el-Zübeyr'den rivayetle eksiksiz bir isnad zinciriyle nakledilmiştir. {cite:muwatta-maruf-1997 s.305}"
  id: "Hadits pertama dalam Kitab Pemakaman, dalam bab tentang apa yang diriwayatkan mengenai memandikan jenazah, diriwayatkan oleh Malik dari Ja'far ibn Muhammad, dari ayahnya, sebagai hadits mursal, bahwa Nabi dimandikan sambil mengenakan baju. Editor mencatat bahwa hadits ini muncul dalam beberapa versi setelah Kitab Jihad, yang merupakan perbedaan lama dalam urutan Muwatta'. Ia mempertahankan posisinya di sini, dan bahwa hadits tersebut diriwayatkan dari Malik oleh Abu Mus'ab, Suwaid, dan al-Shafi'i dalam Musnad. Ia mengutip Ibn 'Abd al-Barr (al-Tamhid 2/15) yang mengatakan bahwa semua perawi Muwatta' meriwayatkannya sebagai mursal kecuali Sa'id ibn 'Ufayr, yang menisbatkannya kepada Aisyah. Menurut Ibn 'Abd al-Barr, hadits ini dianggap mursal oleh Malik, namun merupakan hadits yang terkenal di kalangan penulis biografi dan sejarawan tentang kampanye Nabi. Hadits ini juga diriwayatkan dengan sanad lengkap dari Aisyah melalui sanad yang sahih, dari 'Abbad ibn 'Abd Allah ibn al-Zubayr, atas otoritasnya, dalam kumpulan hadits Ahmad (6/267), Abu Dawud (3141), Ibn Hibban (6627), dan al-Hakim (3/56). {cite:muwatta-maruf-1997 p.305}"
