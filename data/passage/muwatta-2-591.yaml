label: { ar: "الموطأ 591 — جعفر بن محمد عن أبيه مرسلاً: غُسل النبي في قميص", en: "Muwatta 591" }
summary:
  ar: "أول حديث في كتاب الجنائز وفي باب ما جاء في غسل الميت. يرويه مالك عن جعفر بن محمد عن أبيه مرسلاً، أن النبي غُسل في قميص. ويذكر المحقق أن هذا الكتاب وقع في بعض النسخ بعد كتاب الجهاد وهو اختلاف قديم في ترتيب الموطأ، وأنه أبقاه في موضعه هنا، وأن الحديث رواه عن مالك أبو مصعب وسويد والشافعي في المسند، وينقل عن ابن عبد البر (التمهيد 2/15) أن سائر رواة الموطأ أرسلوه إلا سعيد بن عفير فجعله عن عائشة، وأن الحكم عنده أنه مرسل عند مالك، لكنه حديث مشهور عند أهل السير والمغازي، وقد روي مسنداً من حديث عائشة من وجه صحيح، من رواية عباد بن عبد الله بن الزبير عنها عند أحمد (6/267) وأبي داود (3141) وابن حبان (6627) والحاكم (3/56). {cite:muwatta-maruf-1997 p.305}"
