text: "… عليه اللَّبِن والتراب، فقالت : أحتسبُك عند اللّٰه ! وعَزَّاها رسولُ اللّٰه على قبره ؛ وجلس ناحيةً، وجعل المسلمون يردّون تراب القبر ويُسوّونه، وتنحّى رسول اللّٰه فجلس حتى سُوِّى على قبره ورُشّ على قبره الماء، ثم أَقبل فوقف عليه فدعا …"
summary:
  ar: "مقطع من كتاب المغازي — محمد بن عمر الواقدي، المجلد المصوَّر 1، ص 529، فيه تعزية ومواساة وصبر عند المصيبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
