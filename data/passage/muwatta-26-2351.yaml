label: { ar: "الموطأ 2351 — مالك: الجارية الحامل إذا بيعت يتبعها حملها", en: "Muwatta 2351", es: "Muwatta 2351", fr: "Muwatta 2351", ur: "موطا 2351", tr: "Al-Muwatta 2351 — Malik: Hamile bir cariye satılırsa, doğmamış çocuğu da onunla birlikte satılır.", id: "Al-Muwatta 2351 — Malik: Jika seorang budak perempuan yang hamil dijual, maka janin yang belum lahir akan mengikutinya." }
summary:
  ar: "قال مالك: وكذلك لو ابتاع رجل جارية وهي حامل، فالوليدة وما في بطنها لمن ابتاعها، اشترط ذلك أو لم يشترطه. ولا يحل للبائع أن يستثني ما في بطنها، لأنه غرر يضع من ثمنها ولا يدري أيصل إليه أم لا؛ فهو بمنزلة من باع جنينا في بطن أمه، وذلك لا يحل. {cite:muwatta-maruf-1997 p.370}"
  tr: "Malik şöyle dedi: Benzer şekilde, bir adam hamile bir cariyeyi satın alırsa, çocuk ve karnındaki şey, bunu şart koşmuş olsun ya da olmasın, alıcıya aittir. Satıcının karnındaki şeyi hariç tutması caiz değildir, çünkü bu, değerini düşüren bir belirsizliktir; zira onu alıp almayacağını bilmemektedir. Bu, annesinin karnındaki cenin satmaya benzer ki bu caiz değildir. {cite:muwatta-maruf-1997 s.370}"
  id: "Malik berkata: Demikian pula, jika seorang pria membeli seorang budak perempuan ketika ia sedang hamil, anak dan apa yang ada di dalam kandungannya menjadi milik pembeli, baik ia menetapkan hal ini atau tidak. Tidak diperbolehkan bagi penjual untuk mengecualikan apa yang ada di dalam kandungannya, karena ini merupakan bentuk ketidakpastian yang mengurangi harga jualnya, karena ia tidak tahu apakah ia akan menerimanya atau tidak. Ini seperti menjual janin di dalam kandungan ibunya, yang tidak diperbolehkan. {kutipan:muwatta-maruf-1997 hlm.370}"
