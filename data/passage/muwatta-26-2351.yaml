label: { ar: "الموطأ 2351 — مالك: الجارية الحامل إذا بيعت يتبعها حملها", en: "Muwatta 2351" }
summary:
  ar: "قال مالك: وكذلك لو ابتاع رجل جارية وهي حامل، فالوليدة وما في بطنها لمن ابتاعها، اشترط ذلك أو لم يشترطه. ولا يحل للبائع أن يستثني ما في بطنها، لأنه غرر يضع من ثمنها ولا يدري أيصل إليه أم لا؛ فهو بمنزلة من باع جنينا في بطن أمه، وذلك لا يحل. {cite:muwatta-maruf-1997 p.370}"
