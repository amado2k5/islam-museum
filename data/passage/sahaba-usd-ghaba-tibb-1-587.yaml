text: "طَارِق بن سُوَيد يا رسول اللّٰه، إن بأرضنا أعناباً نعتصرها، أفنشرب لنها؟ فقال: لا فراجعته فقال: لا. فقلت: إنا نستشفي به. قال: إن ذلك ليس بشفاءٍ، ولكنه داءً. ورواه إسرائيل، عن سماك، فقال: سُوَيد بن طارق. ورواه شَرِيك، عن سماك، …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 1، ص 587، يذكر الداء، والتداوي، والشفاء، والتداوي بالمحرم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 1, p. 587, that mentions the disease and its remedy, seeking treatment, healing, treatment with what is forbidden; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 1، ص 587 کا اقتباس جس میں بیماری، علاج کرانا، شفا، حرام سے علاج کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
