text: "… مَن باع بخار الطعام يقبض رنين الدراهم عثر أحد فقراء مدينة آقَ شَهْرٌ على كسرة خبز يابسة، فأخذ يفكّر في إدام نمسها به. فمرَّ بدكان طاهٍ، وقد رأى الطعام يغلي، وروائحُ البهار كالعنبر صاعدة منه فتقدمٍ إلى القدر وأخذ يقطع …"
summary:
  ar: "كان رجل فقير يأكل خبزاً يابساً وهو يمسكه فوق بخار قدر الطباخ، فشكاه الطباخ، فحكم جحا قاضياً في آق شهر بأن هز الدراهم عند أذن الطباخ وقال: من باع بخار الطعام يقبض رنين الدراهم. {cite:juha-nawadir-kubra-djuwaydi p. 95}"
  en: "A poor man eats dry bread by holding it in the steam from a cook's pot, and the cook sues him. Juha, as judge in Akshehir, shakes coins beside the cook's ear and says that whoever sells the steam of food receives the ring of coins. {cite:juha-nawadir-kubra-djuwaydi p. 95}"
  ur: "ایک غریب آدمی باورچی کی ہانڈی کی بھاپ پر سوکھی روٹی رکھ کر کھاتا ہے تو باورچی اس پر دعویٰ کر دیتا ہے۔ جحا آق شہر میں قاضی کی حیثیت سے باورچی کے کان کے پاس سکے ہلاتا ہے اور کہتا ہے کہ جو کھانے کی بھاپ بیچے وہ سکوں کی کھنک پائے۔ {cite:juha-nawadir-kubra-djuwaydi p. 95}"
  fr: "Un pauvre mange du pain sec en le tenant dans la vapeur de la marmite d'un cuisinier, et le cuisinier le poursuit en justice. Juha, juge à Akshehir, secoue des pièces près de l'oreille du cuisinier et dit que celui qui vend la vapeur du repas reçoit le tintement des pièces. {cite:juha-nawadir-kubra-djuwaydi p. 95}"
  es: "Un hombre pobre come pan seco sosteniéndolo sobre el vapor de la olla de un cocinero, y el cocinero lo demanda. Juha, como juez en Akshehir, agita monedas junto al oído del cocinero y dice que quien vende el vapor de la comida cobra el tintineo de las monedas. {cite:juha-nawadir-kubra-djuwaydi p. 95}"
