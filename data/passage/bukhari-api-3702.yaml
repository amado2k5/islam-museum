text: "… بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ، قَالَ كَانَ عَلِيٌّ قَدْ تَخَلَّفَ عَنِ النَّبِيِّ فِي خَيْبَرَ وَكَانَ بِهِ رَمَدٌ فَقَالَ أَنَا أَتَخَلَّفُ عَنْ رَسُولِ اللَّهِ فَخَرَجَ عَلِيٌّ فَلَحِقَ بِالنَّبِيِّ، فَلَمَّا كَانَ مَسَاءُ اللَّيْلَةِ الَّتِي فَتَحَهَا اللَّهُ فِي صَبَاحِهَا، قَالَ رَسُولُ اللَّهِ \" لأُعْطِيَنَّ الرَّايَةَ ـ أَوْ لَيَأْخُذَنَّ الرَّايَةَ ـ غَدًا رَجُلاً يُحِبُّهُ اللَّهُ وَرَسُولُهُ ـ أَوْ قَالَ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3702، يذكر أسماء الأمراض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 3702 (Companions of the Prophet), that mentions named diseases. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 3702، جس میں بیماریوں کے نام کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
