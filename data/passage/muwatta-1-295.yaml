summary:
  ar: "قول لمالك في باب الهيئة وتخطي الرقاب واستقبال الإمام يوم الجمعة: السنة عند أهل المدينة أن يستقبل الناس الإمام يوم الجمعة إذا أراد أن يخطب، من كان منهم يلي القبلة وغيرها. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.167} {cite:muwatta-maruf-1997 p.168}"
