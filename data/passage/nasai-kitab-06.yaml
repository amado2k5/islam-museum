summary:
  ar: "القسم 6 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المواقيت»، ويضم فيها النصوص من 494 إلى 625 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 6 of Sunan al-Nasa'i (The Book of the Times (of Prayer)) in the division of the open hadith dataset the museum took its reports from: reports 494 to 625 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 6، عنوان «کتاب المواقیت»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 494 تا 625۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 6 de Sunan al-Nasa'i (El Libro de los Tiempos de la Oración) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 494 al 625, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des Heures de la Prière), dans la section 494 à 625 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanı bölümünde yer alan Sunan al-Nasa'i'nin 6. bölümü \"Namaz Vakitleri Kitabı\" başlığını taşımakta olup, 494 ila 625 numaralı metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 6 dari Sunan al-Nasa'i, dalam bagian tentang basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Waktu Shalat\" dan berisi teks 494 hingga 625, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
