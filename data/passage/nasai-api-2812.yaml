label: { ar: "سنن النسائي 2812 — الأب والأبوة", en: "Sunan al-Nasa'i 2812 — the father and fatherhood", ur: "سنن نسائی 2812 — باپ اور والدیت", es: "Sunan al-Nasa'i 2812 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2812 — le père et la paternité" }
text: "… حَدَّثَنَا يَحْيَى بْنُ آدَمَ، قَالَ حَدَّثَنَا مُفَضَّلُ بْنُ مُهَلْهَلٍ، عَنْ بَيَانٍ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ أَبِي الشَّعْثَاءِ، قَالَ كُنْتُ مَعَ إِبْرَاهِيمَ النَّخَعِيِّ وَإِبْرَاهِيمَ التَّيْمِيِّ فَقُلْتُ لَقَدْ هَمَمْتُ أَنْ أَجْمَعَ الْعَامَ الْحَجَّ وَالْعُمْرَةَ. فَقَالَ إِبْرَاهِيمُ لَوْ كَانَ أَبُوكَ لَمْ يَهُمَّ بِذَلِكَ. قَالَ وَقَالَ إِبْرَاهِيمُ التَّيْمِيُّ عَنْ أَبِيهِ عَنْ أَبِي ذَرٍّ قَالَ إِنَّمَا كَانَتِ الْمُتْعَةُ لَنَا خَاصَّةً."
summary:
  ar: "حديث في سنن النسائي، رقم 2812، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2812 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2812، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2812 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2812 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
