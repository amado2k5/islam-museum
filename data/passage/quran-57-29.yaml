text: "لِّئَلَّا يَعْلَمَ أَهْلُ ٱلْكِتَـٰبِ أَلَّا يَقْدِرُونَ عَلَىٰ شَىْءٍ مِّن فَضْلِ ٱللَّهِ ۙ وَأَنَّ ٱلْفَضْلَ بِيَدِ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ"
text_search: "لئلا يعلم أهل الكتاب ألا يقدرون على شيء من فضل الله ۙ وأن الفضل بيد الله يؤتيه من يشاء ۚ والله ذو الفضل العظيم"
translations:
  en: { text: "That the People of the Scripture may know that they control naught of the bounty of Allah, but that the bounty is in Allah's hand to give to whom He will. And Allah is of Infinite Bounty.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "(یہ باتیں) اس لئے (بیان کی گئی ہیں) کہ اہل کتاب جان لیں کہ وہ خدا کے فضل پر کچھ بھی قدرت نہیں رکھتے۔ اور یہ کہ فضل خدا ہی کے ہاتھ ہے جس کو چاہتا ہے دیتا ہے اور خدا بڑے فضل کا مالک ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
