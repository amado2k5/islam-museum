text: "… إلى رسول اللَّه بخيبر، كما جاء مصرحاً به في الصحيح فعد ذلك ابن إسحاق لأبي موسى مِجرة، ولم يقل : إنه هاجر من مكة إلى أرض الحبشة لينكر عليه. نصل محاولة المشركين رد النجاشي المهاجرين فانجاز المهاجرون إلى مملكة أصحمة …"
summary:
  ar: "مقطع من زاد المعاد لابن القيم، المجلد المصوَّر 1، ص 340، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
