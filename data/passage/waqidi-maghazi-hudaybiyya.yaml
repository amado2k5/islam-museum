label: { ar: "غزوة الحديبية — advising the Prophet at the sacrifice", en: "Treaty of Hudaybiyya — advising the Prophet at the sacrifice" }
text: "فقلت: يا رسول الله، انطلق أنت إلى هديك فانحره، فإنهم سيقتدون بك"
summary:
  ar: "في باب الحديبية، تروي أم سلمة أنها رأت المشركين ينظرون إلى النبي فقالت له: «يا رسول الله، انطلق أنت إلى هديك فانحره، فإنهم سيقتدون بك»، فاضطبع بثوبه وخرج وأخذ الحربة ينحر هديه رافعا صوته بسم الله والله أكبر، فقالت أم سلمة: فما هذا إلا أن رأوه نحر هديه. ويتضمن الباب قصة عثمان المحاصرين وصفية بنت حييئ لما دخلت على النبي بغير حجابها."
  en: "In the Hudaybiyya chapter Umm Salama recounts urging the Prophet to slaughter his own offering so the Quraysh would imitate him; he rose, took the spear and slaughtered it crying Allahu akbar, and she remarks the Quraysh only did likewise after seeing him. The chapter also covers the besieged Uthman and Safiyya bint Huyayy's entry to the Prophet."
