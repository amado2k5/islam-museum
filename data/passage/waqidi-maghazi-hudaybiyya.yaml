label: { ar: "غزوة الحديبية — advising the Prophet at the sacrifice", en: "Treaty of Hudaybiyya — advising the Prophet at the sacrifice", es: "Tratado de Hudaybiyya: consejos al Profeta en el momento del sacrificio.", fr: "Traité de Hudaybiyya — conseils au Prophète lors du sacrifice", ur: "حدیبیہ کا معاہدہ - قربانی کے وقت نبی کو مشورہ دینا", tr: "Hudeybiye Savaşı — Kurban kesimi sırasında Peygambere öğüt vermek", id: "Perang Hudaybiyyah — memberi nasihat kepada Nabi pada saat penyembelihan hewan kurban" }
text: "فقلت: يا رسول الله، انطلق أنت إلى هديك فانحره، فإنهم سيقتدون بك"
summary:
  ar: "في باب الحديبية، تروي أم سلمة أنها رأت المشركين ينظرون إلى النبي فقالت له: «يا رسول الله، انطلق أنت إلى هديك فانحره، فإنهم سيقتدون بك»، فاضطبع بثوبه وخرج وأخذ الحربة ينحر هديه رافعا صوته بسم الله والله أكبر، فقالت أم سلمة: فما هذا إلا أن رأوه نحر هديه. ويتضمن الباب قصة عثمان المحاصرين وصفية بنت حييئ لما دخلت على النبي بغير حجابها."
  en: "In the Hudaybiyya chapter Umm Salama recounts urging the Prophet to slaughter his own offering so the Quraysh would imitate him; he rose, took the spear and slaughtered it crying Allahu akbar, and she remarks the Quraysh only did likewise after seeing him. The chapter also covers the besieged Uthman and Safiyya bint Huyayy's entry to the Prophet."
  es: "En el capítulo sobre Hudaybiyya, Umm Salama relata cómo instó al Profeta a sacrificar su propia ofrenda para que los Quraysh lo imitaran; él se levantó, tomó la lanza y la sacrificó gritando «Allahu Akbar» (Dios es grande). Ella comenta que los Quraysh solo hicieron lo mismo después de verlo. El capítulo también abarca la visita de Uthman, asediado por el Profeta, y la llegada de Safiyya bint Huyayy."
  fr: "Dans le chapitre consacré à Hudaybiyya, Umm Salama raconte comment elle exhorta le Prophète à immoler lui-même un sacrifice afin que les Qurayshites l'imitent. Il se leva, prit la lance et l'immola en criant « Allahu akbar ». Umm Salama remarque que les Qurayshites ne firent de même qu'après l'avoir vu. Ce chapitre relate également le siège d'Uthman et l'arrivée de Safiyya bint Huyayy auprès du Prophète."
  ur: "حدیبیہ کے باب میں ام سلمہ نے نبی کو اپنی قربانی کو ذبح کرنے کی تاکید کی تاکہ قریش ان کی تقلید کریں۔ آپ اٹھے، نیزہ لیا اور اللہ اکبر کہتے ہوئے اسے ذبح کر دیا، اور وہ کہتی ہیں کہ قریش نے بھی آپ کو دیکھ کر ایسا ہی کیا۔ اس باب میں محصور عثمان اور صفیہ بنت حیا کے نبی کے پاس آنے کا بھی احاطہ کیا گیا ہے۔"
  tr: "Hudeybiye bölümünde Ümmü Seleme, müşriklerin Peygamber'e baktığını görünce ona, \"Ey Allah'ın Resulü, git ve kurbanını kes, çünkü onlar senin örneğini izleyecekler\" dediğini anlatır. Bunun üzerine Peygamber, elbisesine sarındı, dışarı çıktı, mızrağını aldı ve kurbanını keserken sesini yükselterek, \"Allah'ın adıyla, Allah en büyüktür\" dedi. Ümmü Seleme, \"Bunu ancak kurbanını kestiğini gördükleri için yaptılar\" dedi. Bölümde ayrıca Osman ve kuşatılmış kadınlar ile Safiyye bint Huyayy'nin peçesiz bir şekilde Peygamber'in yanına girmesi de anlatılmaktadır."
  id: "Dalam surah tentang Hudaybiyyah, Umm Salamah meriwayatkan bahwa ia melihat kaum musyrik memandang Nabi, lalu ia berkata kepadanya, “Wahai Rasulullah, pergilah dan sembelihlah hewan kurbanmu, karena mereka akan mengikuti teladanmu.” Kemudian beliau membungkus dirinya dengan pakaiannya, keluar, mengambil tombaknya, dan menyembelih hewan kurbannya, sambil meninggikan suaranya dan berkata, “Dengan nama Allah, Allah Maha Besar.” Umm Salamah berkata, “Ini hanya karena mereka melihatnya menyembelih hewan kurbannya.” Surah ini juga memuat kisah Utsman dan orang-orang yang terkepung, serta Safiyyah binti Huyayy ketika ia menemui Nabi tanpa mengenakan cadar."
