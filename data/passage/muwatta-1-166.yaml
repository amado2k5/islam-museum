label: { ar: "الموطأ 166 — الأعرابي يبول في المسجد: اتركوه، وصب الذنوب", en: "Muwatta 166", es: "Muwatta 166", fr: "Muwatta 166", ur: "موطا 166", tr: "El-Muvatta 166 — Bedevi mescitte idrarını yapıyor: Onu rahat bırakın ve günahlarından bağışlansın.", id: "Al-Muwatta 166 — Orang Badui buang air kecil di masjid: Biarkan saja dia, dan biarkan dia diampuni dosa-dosanya." }
text: "اتركوه. فتركوه فبال، ثم أمر رسول الله بذنوب من ماء فصب على ذلك المكان"
summary:
  ar: "أول حديث في باب ما جاء في البول قائماً وغيره. يرويه يحيى عن مالك عن يحيى بن سعيد الأنصاري مرسلاً: دخل أعرابي المسجد فكشف عن فرجه ليبول، فصاح به الناس حتى علا الصوت، فأمرهم النبي أن يتركوه، فبال، ثم أمر بدلو عظيمة من ماء فصُبت على ذلك المكان. ويفسر المحقق الذنوب بالدلو العظيمة، وينقل عن ابن عبد البر أنه روي مسنداً متصلاً عن يحيى بن سعيد عن أنس من وجوه صحاح، وأنه ثابت من حديث أنس في الصحيحين ⁦(البخاري 221، مسلم 1/163)⁩ ومن حديث أبي هريرة عند البخاري (6010) ⁦(التمهيد 24/14)⁩. {cite:muwatta-maruf-1997 p.110}"
  tr: "Ayakta işemek ve diğer konularla ilgili rivayetler bölümündeki ilk hadis, Yahya'nın Malik'ten, o da Yahya ibn Sa'id el-Ensari'den rivayet ettiği mursal bir hadistir: Bir bedevi mescide girdi ve işemek için cinsel organlarını açtı. İnsanlar ona bağırdılar ve sesleri yükseldi, bunun üzerine Peygamber onlara onu rahat bırakmalarını emretti. Bedevi işedi, sonra o bölgeye büyük bir kova su dökülmesini emretti. Araştırmacı, büyük kovanın günahları temsil ettiğini yorumluyor ve İbn Abdülberr'in, Yahya ibn Sa'id'den, o da Enes'ten sahih rivayet zincirleriyle nakledildiğini ve Enes'in iki Sahih hadisinde (Buhari 221, Müslim 1/163) ve Ebu Hurayra'nın Buhari'deki (6010) hadisinde (Temhid 24/14) sabit olduğunu söylediğini aktarıyor. {cite:muwatta-maruf-1997 s.110}"
  id: "Hadits pertama dalam bab ini membahas tentang apa yang diriwayatkan mengenai buang air kecil sambil berdiri dan hal-hal lainnya. Diriwayatkan oleh Yahya dari Malik dari Yahya ibn Sa'id al-Ansari, dalam hadits mursal: Seorang Badui masuk ke masjid dan memperlihatkan kemaluannya untuk buang air kecil. Orang-orang berteriak kepadanya hingga suara mereka meninggi, lalu Nabi memerintahkan mereka untuk membiarkannya. Ia buang air kecil, kemudian memerintahkan agar seember besar air dituangkan ke tempat tersebut. Peneliti menafsirkan ember besar tersebut sebagai representasi dosa, dan mengutip Ibnu 'Abd al-Barr yang mengatakan bahwa hadits tersebut diriwayatkan dengan sanad yang berkesinambungan dari Yahya ibn Sa'id dari Anas melalui sanad-sana periwayatan yang sahih, dan bahwa hadits tersebut telah ditetapkan dalam hadits Anas dalam dua kitab Sahih (al-Bukhari 221, Muslim 1/163) dan dalam hadits Abu Hurayrah dalam al-Bukhari (6010) (al-Tamhid 24/14). {cite:muwatta-maruf-1997 p.110}"
