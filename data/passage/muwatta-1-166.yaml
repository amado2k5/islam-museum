label: { ar: "الموطأ 166 — الأعرابي يبول في المسجد: اتركوه، وصب الذنوب", en: "Muwatta 166" }
text: "اتركوه. فتركوه فبال، ثم أمر رسول الله بذنوب من ماء فصب على ذلك المكان"
summary:
  ar: "أول حديث في باب ما جاء في البول قائماً وغيره. يرويه يحيى عن مالك عن يحيى بن سعيد الأنصاري مرسلاً: دخل أعرابي المسجد فكشف عن فرجه ليبول، فصاح به الناس حتى علا الصوت، فأمرهم النبي أن يتركوه، فبال، ثم أمر بدلو عظيمة من ماء فصُبت على ذلك المكان. ويفسر المحقق الذنوب بالدلو العظيمة، وينقل عن ابن عبد البر أنه روي مسنداً متصلاً عن يحيى بن سعيد عن أنس من وجوه صحاح، وأنه ثابت من حديث أنس في الصحيحين (البخاري 221، مسلم 1/163) ومن حديث أبي هريرة عند البخاري (6010) (التمهيد 24/14). {cite:muwatta-maruf-1997 p.110}"
