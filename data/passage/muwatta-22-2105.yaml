label: { ar: "الموطأ 2105 — يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن عبد الله بن عمرو بن عثمان عن أبي عمرة الأنصاري عن زيد بن خالد الجهني: قال رسول الله ألا أخبركم بخير الشهداء، الذي يأتي بشهادته قبل أن يسألها", en: "Muwatta 2105" }
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن عبد الله بن عمرو بن عثمان عن أبي عمرة الأنصاري عن زيد بن خالد الجهني أن رسول الله قال: ألا أخبركم بخير الشهداء؟ الذي يأتي بشهادته قبل أن يسألها، أو يخبر بشهادته قبل أن يسألها. ويذكر المحقق أن الصواب أنه عبد الرحمن بن أبي عمرة الأنصاري، بنقل الترمذي. {cite:muwatta-maruf-1997 p.260} {cite:muwatta-maruf-1997 p.261}"
