label: { ar: "الموطأ 2105 — يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن عبد الله بن عمرو بن عثمان عن أبي عمرة الأنصاري عن زيد بن خالد الجهني: قال رسول الله ألا أخبركم بخير الشهداء، الذي يأتي بشهادته قبل أن يسألها", en: "Muwatta 2105", es: "Muwatta 2105", fr: "Muwatta 2105", ur: "موطا 2105", tr: "El-Muvatta 2105 — Yahya, Malik'ten, o da Abdullah ibn Abi Bekr ibn Muhammed ibn Amr ibn Hazm'dan, o da babasından, o da Abdullah ibn Amr ibn Osman'dan, o da Ebu Amre el-Ensari'den, o da Zeyd ibn Halid el-Cuhani'den rivayet etmiştir: Allah Resulü şöyle buyurdu: Size şahitlerin en hayırlısını söylemeyeyim mi? Şahitliği istenmeden önce gelen kimsedir.", id: "Al-Muwatta 2105 — Yahya, dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari ayahnya, dari Abdullah ibn Amr ibn Uthman, dari Abu Amrah al-Ansari, dari Zayd ibn Khalid al-Juhani: Rasulullah SAW bersabda: Tidakkah aku akan memberitahukan kepadamu tentang saksi yang terbaik? Yaitu orang yang datang dengan kesaksiannya sebelum diminta." }
summary:
  ar: "يروي يحيى عن مالك عن عبد الله بن أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن عبد الله بن عمرو بن عثمان عن أبي عمرة الأنصاري عن زيد بن خالد الجهني أن رسول الله قال: ألا أخبركم بخير الشهداء؟ الذي يأتي بشهادته قبل أن يسألها، أو يخبر بشهادته قبل أن يسألها. ويذكر المحقق أن الصواب أنه عبد الرحمن بن أبي عمرة الأنصاري، بنقل الترمذي. {cite:muwatta-maruf-1997 p.260} {cite:muwatta-maruf-1997 p.261}"
  tr: "Yahya, Malik'ten, o da Abdullah ibn Abi Bakr ibn Muhammed ibn Amr ibn Hazm'dan, o da babasından, o da Abdullah ibn Amr ibn Uthman'dan, o da Ebu Amrah el-Ensari'den, o da Zeyd ibn Halid el-Cuhani'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakletmiştir: \"Size en hayırlı şahitlerin kim olduğunu söylemeyeyim mi? Şahitliği istenmeden önce veren veya şahitliği istenmeden önce veren kimsedir.\" Editör, Tirmizi'nin rivayetine göre doğru ismin Abdülrahman ibn Abi Amrah el-Ensari olduğunu belirtmektedir. {cite:muwatta-maruf-1997 s.260} {cite:muwatta-maruf-1997 s.261}"
  id: "Yahya meriwayatkan dari Malik, dari Abdullah ibn Abi Bakr ibn Muhammad ibn Amr ibn Hazm, dari ayahnya, dari Abdullah ibn Amr ibn Uthman, dari Abu Amrah al-Ansari, dari Zayd ibn Khalid al-Juhani, bahwa Rasulullah SAW bersabda: “Tidakkah aku akan memberitahukan kepadamu siapa saksi yang terbaik? Dia yang memberi kesaksian sebelum diminta, atau yang memberi kesaksian sebelum diminta.” Editor mencatat bahwa nama yang benar adalah Abd al-Rahman ibn Abi Amrah al-Ansari, sebagaimana diriwayatkan oleh al-Tirmidhi. {cite:muwatta-maruf-1997 p.260} {cite:muwatta-maruf-1997 p.261}"
