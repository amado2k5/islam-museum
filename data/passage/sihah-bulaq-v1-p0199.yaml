text: |-
  ٤٤٢
  يعنى عوضاو الاوس الذتب وبه سمي الرح-ل وأوس أبو قبيلم ن اليمن وهو أوس بن قيلة
  أخوانلا زرج منهما الانصار وقيلة أ.هما وأويس اسم للذئب جاه مصغراءشل الكميت
  واللجين قال الهذلى
  باليت شعرى عنك والامر أمم * ما فعل اليوم أو يس فى الغنم
  واستاسه أى استعاضه والمسناس المستعطى قال الجعدى
  ثلاثة أهلين أفنيتهم * وكان الالههو المستاا س
  والآس شهر مه روف والآس أيضابقيسة الرماد فى الموقد وقال الاصهى آثار الداروما
  بعرف من علاماتها ( يس بن السكيت آيست منه آيس يأسالغة فى يئست منه أيأس
  يأسا ومصدرهماواحد و آيسى.:ه فلان مثل أيأسى وكذلك التأييس
  صل الباء س . البأس العذاب والبأس الشدة فى الحرب تقول منه بؤس
  الرجل بااضم يبؤس بأسا اذا كان شديد البأس حسكاه أبوزيدفى كتاب الهمزفهو بئيس على
  فعيل أى شجاع وعذاب بنيس أيضا أى شديد قال ويئس ارجل يبأس بؤساوبدا اشتدّت
  حاجنمهوبائس وأنشدأ بوعمرو
  وبيضاء من أهل المدينة لم تذق * بتيسا ولم تتبع حولة مجحد
  وهواسم وضع. وضع المصدرويس كلمة ذمّ ونعم كلة مدح تقول بئس الرجل زيدوبه ست
  المرأة هندوهما فعلان ماضيان لا يتصرّفان لانه-ما أز بلا عن موضهما قتعم منقول من
  قولك نعم فلان اذا أصاب نعمة ويئس منة ول من بئس فلان اذا أصاب بؤسافنقلا الى المدح
  والذمّ فشابها الحروف فلم يتصرّفا وفيهدالغات نذكرها فى نعم من باب الميم والابؤس جع بوس
  من قولهم يوم بؤس ويوم نعم والابوس أيضا الداهية وفى المثل عسى الغوير أبؤسا وقد أ بأس
  اباما قال المكميت
  قالوا أساء بنوكر زفقلت لهم * عسى الغويرباباس واغوار
  ولا تبتدس أى لا تحزن ولا تشتك والمبتئس السكاره والحزين قال حسان بن ثابت
  ما يقسم اللّٰه فاقبل غير مبتئس • منه واقعدكر بماناعم البال
  والبأساء الشدّة قال الاخفس بى على فعلاء وليس له أفعل لانه اسم كماقديحى وافعل
  فى الاسماءليس معه فعلا ء غحوأحد والبؤسى خلاف النعمى ⁦(بجس)⁩ بجست الماء
  فانيجس أى فجرته فانفجر وعجس الماه بنفسه بجس يتعدى ولا يتعدى رسهائب يجس
  وابنجس الماء وتيجس أى تفجر (بخس البخس الناقص يقال شروه بتمن فخس وقد يخب،
  حقه يبخسه بخسا اذانقصه يقال للبيع اذا كان قصد الاعخس فيه ولاشطط وفى المثل تحسبها
  حقاء وهى باخس هكذاجرى المغل قال ثعلب وان شقت قلت باخسسة والبخس أيضا أرض
  ننيت من غيرسق قال الاموى يقال عخس المخ تبخيسا أى نقص ولم ييق الافى السلامى
  والعين وهوآخر مايبق رس البرس بالسكسر القطن قال الشاءرِ
  ترى اللغام على هامأتها قزعا • كالبرس طيره ضرب السكرابيل
  « برئس) البرنس قلنسوة طو يلة وكان النساك يليسونها فى ضدر الاسلام وقد تبرنس
  الرجل
