label:
  ar: "مسلم 2805 — أهون أهل النار عذابا: أردت منك أهون من هذا"
  en: "Muslim 2805 — The one in the Fire with the lightest punishment"
  ur: "مسلم 2805 — آگ والوں میں سب سے ہلکے عذاب والا"
text: "يقول الله تبارك وتعالى لأهون أهل النار عذابا لو كانت لك الدنيا وما فيها أكنت مفتديا بها فيقول نعم فيقول قد أردت منك أهون من هذا وأنت في صلب آدم أن لا تشرك - أحسبه قال - ولا أدخلك النار …"
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 2805: أهون أهل النار عذابا: أردت منك أهون من هذا. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 2805: The one in the Fire with the lightest punishment. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 2805: آگ والوں میں سب سے ہلکے عذاب والا۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
