label: { ar: "سنن ابن ماجه 3658 — من أبر قال أمك", en: "Sunan Ibn Majah 3658 — Who is kindest? Your mother", ur: "سنن ابن ماجہ 3658 — سب سے زیادہ نیکی کا حق دار؟ تیری ماں", es: "Sunan Ibn Majah 3658 — ¿Quién es la más bondadosa? Tu madre." }
text: "حَدَّثَنَا أَبُو بَكْرٍ، مُحَمَّدُ بْنُ مَيْمُونٍ الْمَكِّيُّ حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنْ عُمَارَةَ بْنِ الْقَعْقَاعِ، عَنْ أَبِي زُرْعَةَ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالُوا يَا رَسُولَ اللَّهِ مَنْ أَبَرُّ قَالَ ‏\"‏ أُمَّكَ ‏\"‏ ‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ أُمَّكَ ‏\"‏ ‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ أَبَاكَ ‏\"‏ ‏.‏ قَالَ ثُمَّ مَنْ قَالَ ‏\"‏ الأَدْنَى فَالأَدْنَى ‏\"‏ ‏.‏"
summary:
  ar: "سئل من أبر قال أمك، قال ثم من قال أمك، قال ثم من قال أباك، قال ثم من قال الأدنى فالأدنى."
  en: "Asked «who deserves the most kindness?« — «your mother«; «then who?« — «your mother«; «then who?« — «your father«; then «the nearest and the nearest.»"
  ur: "پوچھا «سب سے زیادہ نیکی کا حق دار کون؟» — «تیری ماں»؛ «پھر کون؟» — «تیری ماں»؛ «پھر کون؟» — «تیرا باپ»؛ پھر «قریب تر، قریب تر۔»"
  es: "Preguntado «¿Quién merece más amabilidad?» — «Tu madre»; «¿Y luego quién?» — «Tu madre»; «¿Y luego quién?» — «Tu padre»; luego «El más cercano y el más cercano»."
