text: |-
  ٧٩
  ومن تعاجيب خلق اللّه غاطية ١ عصر منها ملاحى وغربيب
  ولا يجمع عجب ولا عجيب ويقال جمع عجيب عجائب مثل أفيل وأفائل وتبيع وتسائع وقواهم
  أعاجيب كانهم أرادواجمع أعجموبة مثل أحدوثه وأحاديث وعجبت من كذا وتعجبت منه
  واستعجبت بمعنى وعجبت غيرى تعجيها وأعجبنى هذا الشئ لحسنه وقد أتجب ذلان بنفسه فهو
  عجب برأيه وبن فسه والاسم العجب بالضم وقواهم ما أعجبه برأيه شاذلا يقاس عليه والعجب
  بالفتح أصل الذنب والعجب أيضا واحدالعجوب وهى أواخر ارمل قال لبيد ⁦(يص ف المط )⁩
  يجتاب أصلا قالصامتنبدا • بعجوب أنقاء يميل هيامها
  دب العداب بالفتح ما استرق من الرمل قال ابن أحر
  كثور العداب الفرديضريه الندى * تعلى الندى فى متنه وتحدّرا
  والعداية الركب ٢ قال الشاعر
  وكنت كذات العرك لم تبق ماءها * ولاهى مما بالعدابة طاهر
  ذب العذب الماء الطيب وقد عذب عذوبة ويقال للريق والجر الاعذيان
  واستعذب القوم ماءهم اذا استقوه عذبا واستعذبه أى عدّه عذبا ويستعذب لفلان
  من يتركذا أى يستقى له وعذية اللسان طرفه الدقيق والعذية احدى عذبى
  السوط ⁦(٣)⁩ وقول ذى الرمة
  غضف مهرتة الاشداق ضارية • مثل السراحين فى أعناقها العذب
  بعق السيوروعذية الميزان الخيط الذى رفع به وعذبة الشجر غصنه والعذية القذاة وماء
  ذوعذب أى كثير القذى يقال أعذب حوضك أى انزع مافه من القذى وأعذبته عن الامر
  اذا منعته عنه يقال أعذب نفسك عن كذا أى اظلفها عنه والعذوب من الدواب وغيرها
  القائم الذى لا يأ كل ولا يشرب وكذلت العاذب والعذاب العقوبة وقد عذبته تعذيبا
  والعذيب ماء لتمسيم وعاذب مكان أبو عمر والعذبىّ السكريم الاخلاق بالذال المعجمة ٤
  وأنشداكثير
  (أى ابن جابر المحاربى ليس كثيرعزة اه مر€
  سرت ماسرت من ليلها ثم أعرضت * الى عذبى ذى غناء وذى فضل
  (عرب. العرب جيل من الشاس والنسبة اليهسم عربى" بين العروية وهم أهل الامصار
  والاعراب منهم سكان البادية خاصة وجاء فى الشعر الفصيح الاعار يب والنسمة الى الاعراب
  أعرابى لانه لا واحد له وليس الاعراب جعالعرب كما كان الانباط جعالنبط وانما العرب اسم
  جنس والعرب العارية هم الخلص منهم وأخذ من لفظه فأكدبه كقوله ليل لايل وربما
  قالوا العرب العرباء وته زب أى تشبه بالعرب وتعرّب بعد هجرته أى صار أعرابيا والعرب
  المستعربة هم الذين ليسوابخلص وكذلك المستعربة والعربية هى هذه اللغة ويعرب بن قحطان
  أول من تكلم بالعربية وهو أبواليمن كاهم والعرب والعرب واحد مثل العجم والفجم
  والعريب تصغير العرب وقال أبو الهندى
  ومكن الضباب طعام العريب • ولا تشتهيه نفوس العجم
  وانماصغرهم تعظيما كماقال أنا جذيلها الممكك وعذيقها المرجب وعرب
  قوله أعجب فلان الخ بضم الهمزة
  وفتح جسيم معجب كمافى المختار
  ول-كونه مبني اللمجهول لابصاغ
  منه التعجب اه
  ٢ تحتين أى الماناه
  ( ٣ ذبة السوط طرفه والجمع
  عذب
  ٤ القاموس ذكره فى المهملة
  تبعالتهذيب الازهرى وعلى كل
  هوبوزن عرنى بالضيم اه
