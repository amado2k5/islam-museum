label: { ar: "الموطأ 2586 — مالك: إذا قبل ولاة الدم الدية فهي موروثة على كتاب الله", en: "Muwatta 2586", es: "Muwatta 2586", fr: "Muwatta 2586", ur: "موطا 2586", tr: "El-Muvatta 2586 — Malik: Eğer kanın koruyucuları kan parasını kabul ederlerse, bu Allah'ın Kitabına göre mirastır.", id: "Al-Muwatta 2586 — Malik: Jika para wali darah menerima uang darah, maka uang itu menjadi warisan menurut Kitab Allah." }
summary:
  ar: "قال يحيى: قال مالك: إذا قبل ولاة الدم الدية فهي موروثة على كتاب الله، يرثها بنات الميت وأخواته ومن يرثه من النساء؛ فإن لم يُحرز النساء ميراثه، كان ما بقي من ديته لأولى الناس بميراثه مع النساء. {cite:muwatta-maruf-1997 p.457} {cite:muwatta-maruf-1997 p.458}"
  tr: "Yahya şöyle dedi: Malik şöyle dedi: Eğer kanın koruyucuları kan parasını kabul ederlerse, bu Allah'ın Kitabına göre mirastır. Ölen kişinin kızları, kız kardeşleri ve ondan miras alan diğer kadınlar miras alırlar. Eğer kadınlar ondan miras almazlarsa, kan parasından geriye kalan, kadınlar da dahil olmak üzere, ona en yakın olanlara miras kalır. {cite:muwatta-maruf-1997 s.457} {cite:muwatta-maruf-1997 s.458}"
  id: "Yahya berkata: Malik berkata: Jika para wali darah menerima uang darah, maka uang itu diwariskan menurut Kitab Allah. Anak perempuan almarhum, saudara perempuannya, dan perempuan lain yang mewarisi hartanya berhak mewarisinya. Jika perempuan tidak mewarisi hartanya, maka sisa uang darahnya diberikan kepada orang-orang terdekatnya dalam hal warisan, termasuk perempuan. {cite:muwatta-maruf-1997 p.457} {cite:muwatta-maruf-1997 p.458}"
