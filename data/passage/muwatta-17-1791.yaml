label: { ar: "الموطأ 1791 — مالك: ما أصاب العبد أو الوليدة في الأيام الثلاثة فهو من البائع، وعهدة السنة من الجنون والجذام والبرص، فإذا مضت السنة برئ البائع من العهدة كلها", en: "Muwatta 1791", es: "Muwatta 1791", fr: "Muwatta 1791", ur: "موطا 1791", tr: "El-Muvatta 1791 — Malik: Kölenin veya kadın kölenin üç gün içinde başına gelen her şeyden satıcı sorumludur; bir yıllık garanti ise akıl hastalığı, cüzzam ve vitiligo için geçerlidir. Bir yıl geçtikten sonra satıcı tüm sorumluluktan kurtulur.", id: "Al-Muwatta 1791 — Malik: Apa pun yang menimpa budak laki-laki atau budak perempuan dalam tiga hari tersebut adalah tanggung jawab penjual, dan jaminan selama satu tahun berlaku untuk penyakit gila, kusta, dan vitiligo. Jika satu tahun berlalu, penjual dibebaskan dari semua tanggung jawab." }
summary:
  ar: "قال مالك: ما أصاب العبد أو الوليدة في الأيام الثلاثة، من حين يشتريان حتى تنقضي الأيام الثلاثة، فهو من البائع. وإن عهدة السنة من الجنون والجذام والبرص. فإذا مضت السنة، فقد برئ البائع من العهدة كلها. {cite:muwatta-maruf-1997 p.134}"
  tr: "Malik şöyle dedi: Kölenin, erkek veya kadın olsun, satın alındığı günden itibaren üç günün bitiminden sonraki üç gün içinde başına gelen her şeyden satıcı sorumludur. Akıl hastalığı, cüzzam ve vitiligo vakalarında garanti süresi bir yıldır. Bir yıl geçerse, satıcı tüm sorumluluktan kurtulur. {cite:muwatta-maruf-1997 s.134}"
  id: "Malik berkata: Apa pun yang menimpa budak, laki-laki atau perempuan, selama tiga hari sejak waktu pembelian hingga tiga hari tersebut berakhir adalah tanggung jawab penjual. Masa garansi adalah satu tahun untuk kasus-kasus gangguan jiwa, kusta, dan vitiligo. Jika satu tahun telah berlalu, penjual dibebaskan dari semua tanggung jawab. {cite:muwatta-maruf-1997 p.134}"
