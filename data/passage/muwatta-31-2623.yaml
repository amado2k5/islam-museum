label: { ar: "الموطأ 2623 — محمد بن كعب القرظي: معاوية على المنبر لا مانع لما أعطى الله", en: "Muwatta 2623", es: "Muwatta 2623", fr: "Muwatta 2623", ur: "موطا 2623", tr: "El-Muvatta 2623 — Muhammed ibn Ka'b el-Kurazi: Muaviye minberde: Allah'ın verdiği şeyi kimse geri alamaz.", id: "Al-Muwatta 2623 — Muhammad ibn Ka’b al-Qurazi: Mu’awiyah di mimbar: Tidak ada seorang pun yang dapat menahan apa yang telah diberikan Allah." }
summary:
  ar: "يروي مالك عن يزيد بن زياد عن محمد بن كعب القرظي أن معاوية بن أبي سفيان قال وهو على المنبر: أيها الناس، إنه لا مانع لما أعطى الله، ولا معطي لما منع، ولا ينفع ذا الجد منه الجد. من يرد الله به خيرا يفقهه في الدين. ثم قال: سمعت هؤلاء الكلمات من رسول الله على هذه الأعواد. ويذكر المحقق أن يزيد بن زياد، شيخ مالك في هذا الحديث، مقل في الرواية، ولم يرو له مالك سوى هذا الحديث، ويذكر المحقق أن البخاري والعقيلي وابن عدي رجحوا انقطاع الإسناد، وأن ابن عبد البر عده متصلا. {cite:muwatta-maruf-1997 p.482} {cite:muwatta-maruf-1997 p.483}"
  tr: "Malik, Yezid ibn Ziyad'dan, o da Muhammed ibn Ka'b el-Kurazi'den rivayetle, Muaviye ibn Ebu Sufyan'ın minberde şöyle dediğini aktarır: \"Ey insanlar! Allah'ın verdiğini kimse engelleyemez, O'nun vermediğini de kimse veremez ve hiçbir mal O'na karşı kimseye fayda sağlayamaz. Allah kime iyilik dilerse, ona din anlayışı verir.\" Sonra da şöyle dedi: \"Bu sözleri Allah'ın Resulü'nden tam bu basamaklarda işittim.\" Editör, bu hadiste Malik'in hocası olan Yezid ibn Ziyad'ın rivayet konusunda çok üretken olmadığını ve Malik'in bu hadisi sadece ondan naklettiğini belirtir. Editör ayrıca, Buhari, Ukayli ve İbn Adi'nin rivayet zincirinin kopuk olduğunu, İbn Abd el-Barr'ın ise sükûnet olduğunu düşündüğünü de ekler. {cite:muwatta-maruf-1997 s.482} {cite:muwatta-maruf-1997 s.483}"
  id: "Malik meriwayatkan dari Yazid ibn Ziyad, yang juga dari Muhammad ibn Ka'b al-Qurazi, bahwa Mu'awiyah ibn Abi Sufyan berkata ketika berkhutbah: \"Wahai manusia, tidak ada seorang pun yang dapat menahan apa yang diberikan Allah, dan tidak ada seorang pun yang dapat memberi apa yang ditahan-Nya, dan tidak ada harta benda yang dapat menyelamatkan siapa pun dari-Nya. Barangsiapa yang dikehendaki Allah untuk berbuat baik, maka Dia akan memberinya pemahaman tentang agama.\" Kemudian ia berkata: \"Aku mendengar kata-kata ini dari Rasulullah di tangga ini.\" Editor mencatat bahwa Yazid ibn Ziyad, guru Malik dalam hadits ini, tidak banyak meriwayatkan, dan Malik hanya meriwayatkan hadits ini darinya. Editor juga menyebutkan bahwa al-Bukhari, al-'Uqayli, dan Ibn 'Adi menganggap sanadnya terputus, sedangkan Ibn 'Abd al-Barr menganggapnya terhubung. {kutip:muwatta-maruf-1997 hal.482} {kutip:muwatta-maruf-1997 hal.483}"
