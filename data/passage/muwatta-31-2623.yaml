label: { ar: "الموطأ 2623 — محمد بن كعب القرظي: معاوية على المنبر لا مانع لما أعطى الله", en: "Muwatta 2623" }
summary:
  ar: "يروي مالك عن يزيد بن زياد عن محمد بن كعب القرظي أن معاوية بن أبي سفيان قال وهو على المنبر: أيها الناس، إنه لا مانع لما أعطى الله، ولا معطي لما منع، ولا ينفع ذا الجد منه الجد. من يرد الله به خيرا يفقهه في الدين. ثم قال: سمعت هؤلاء الكلمات من رسول الله على هذه الأعواد. ويذكر المحقق أن يزيد بن زياد، شيخ مالك في هذا الحديث، مقل في الرواية، ولم يرو له مالك سوى هذا الحديث. {cite:muwatta-maruf-1997 p.482} {cite:muwatta-maruf-1997 p.483}"
