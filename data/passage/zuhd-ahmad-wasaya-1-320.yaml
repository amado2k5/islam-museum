text: "… الثانية : رؤية ملك الموت أو ملائكة الموت. الداهية الثالثة : خوف سوء الخاتمة وتبشير الفجار بالنار. الداهية الأولى سكرات الموت : لو لم يكن بين يدي العبد المسكين كرب ولا هول ولا عذاب سوى سكرات الموت بمجردها لكان جديرًا …"
