text: "… الْعَاصِ وَاعَجَبًا لِوَبْرٍ تَدَلَّى عَلَيْنَا مِنْ قَدُومِ ضَأْنٍ، يَنْعَى عَلَىَّ قَتْلَ رَجُلٍ مُسْلِمٍ أَكْرَمَهُ اللَّهُ عَلَى يَدَىَّ وَلَمْ يُهِنِّي عَلَى يَدَيْهِ. قَالَ فَلاَ أَدْرِي أَسْهَمَ لَهُ أَمْ لَمْ يُسْهِمْ لَهُ. قَالَ سُفْيَانُ وَحَدَّثَنِيهِ السَّعِيدِيُّ عَنْ جَدِّهِ عَنْ أَبِي هُرَيْرَةَ. قَالَ أَبُو عَبْدِ اللَّهِ السَّعِيدِيُّ عَمْرُو بْنُ يَحْيَى بْنِ سَعِيدِ بْنِ عَمْرِو بْنِ سَعِيدِ بْنِ الْعَاصِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 2827، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 2827 (Fighting for the Cause of Allah (Jihaad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 2827، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
