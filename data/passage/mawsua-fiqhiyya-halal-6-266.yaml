text: "… حلال المسلمين علي حرام، كأن يمينا على ترك الطعام والشراب إلا أن ينوي غير ذلك، وهذا استحسان. وقال المالكية: تحريم الحلال في غير الزوجة لغو لا يقتضي شيئا، إلا إذا حرم الأمة ناويا عتقها، فإنها تعتق، فمن قال: الخادم أو …"
