text: |-
  ٢٢٣
  والمغفلة التى فى الحديث جائبا اعنفقة،⁦(غلل)⁩ الغلة واحدة الغسلات والغلل الماءبين
  الاشجار والجمع الاغلال قال الراجودكين
  ينجيه من مثل حام الاغلال * وقع يد عجلى ورجل شلالى
  يقول يقج هذا الفرس: ن خسل سراع فى الغارة كالهام الواردة وقال أبوعمر والغلل
  الماء الذى ليس له جرية وانما يظهر على وجه الارض ظه وراقليلا فيخفى مرّة و يظهرمزة
  والغلل المصفاة قال لبدد
  لها غلل من رازقى وكرسف • بأيمان عجم تصفون المقاولا
  •-ى الفدام الذى على رآس الاباريق وبعضهم يروبه غلل جمع غلة والغلفله سرعة السه
  والمغلغلة الرسالة المحمولة من بلد الى بلد والغال أرض معامئنة ذات شجر ومنابت السلم أ
  والطلح يقال غال من سلم كما يقال عيص من سدروقصيمة من غضى والغبال أيضانيت والمع
  غلان بالضم ويعير غلان بالفتح شديدالعطس وكذلك المغتل" ويقال نعم غلول الشيخ هذا
  أى الطعام الذى يدخله جوفه على فعول بفتح الفاء والغلالة شعار يليس تحت الثوب وتحت
  الدرع أيضا والغلّ بالكسر الغس والحقد أيضارقد غلّ صدره يقلّ بالكسر غلااذا كان دا
  غس أوضغن وحقد والغل بالضم" واحد الاغلال يقال فى رقبته غلّ من -ديد ومنه قيل
  للمرأة السيئة الخلو غل قل وأصله أنّ الغلّ كان يكون من قد وعليه شعرفية مل وغلات يده
  الى عنقه وقد غل فهو مغلول بقال ماله ألّ وغلّ والغسل أيضا والغلة حرارة العطس
  وسي ذلك الغايل تقول منه غلّ الرجل بغل غللاف، ومغلول على مالم يسمّ فاعله والغايل
  الضغ والحقد مثل الغل والغليل النوى يخلط بالقت تعلفه الناقة قال علقمة
  غلّ لها دُوفئة من نوى قرّان معجوم * وغله فانغسلَ أى أدخله فدخل قال بعض العرب
  ومنها ما يغل يعنى من الكاش أى يدخل قضيبه من غير أن يرفع الالية وغلّ أيضادخُل
  يتعدى ولا يتعدى يقال غل ت فلان المفاوزأى دخلها وتوسطها وعلّمن المعتم غلولا أى
  فان وأغلّ مثله وغل الماهبين الاشهاراذا برى فيها يغل بالضم فى جيع ذلك وتغلفل الماء
  فى الشجراذا تخللها قال اين السكيت لم نسمع فى المغنم الاغل غلولا وقرى وما كان أني
  أن يغلّ ويغل قال ذعى يغل يخون ومعنى يغل يحتملمعنسن أحدهمايخان يعنى أن يؤخذ
  من غنيمته والآخر يخون أى ينسب الى الغسلول قال أبو، بيد الغلول فى المغتم خاصة
  ولا نواهمن الحيانة ولا من الحقد ومما ييين ذلك أنه يقال من الحيانة أغلّ يغلّ ومن اسا تد غلّ"
  يقل بالكسر ومن الغسلول غل يغل بالضم وغل البعير أيضا اذالم يقضويه وأعلالرحل
  خان قال النحر
  حزى اللّٰه عنا جرة ابنة نوفل * جزاء مغل بالامانة كاذب
  وفى الحديت لا اغلال ولا اسلال أى لاخمائة ولاسرقة ويقسال لارشوة وقال شريح ليس
  على المستعبر غير المعلّ ضمان وقال النبى لى اللّٰه عليه وسلم :لاث لا يغل عليهنّ قلب ؤمن
  ومن رواه يغل فهومن الضفن وأغلت الضاع من الغلة قال الراجر
  أقبل سيل ياء منَ عند الله * يحرد حرد الجنة المعُله
  وأغل القوم ادا بلفت عُلتهم وفلان يغل على عيإلى أى يأتبهم بالغلة وأغلّ الجارُرفى الاهاب
  قوله جانا العنفقة فى القاموش
  وكرحلة العنفقة لا جانباها
  ووهم الجوهرى اه
