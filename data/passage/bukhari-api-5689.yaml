label: { ar: "صحيح البخاري 5689 — التلبينة، المرض والمريض", en: "Sahih al-Bukhari 5689 — talbina (barley gruel); illness and the sick", ur: "صحیح بخاری 5689 — تلبینہ، بیماری اور بیمار", es: "Sahih al-Bukhari 5689 — talbina (gachas de cebada); la enfermedad y los enfermos", fr: "Sahih al-Bukhari 5689 — talbina (bouillie d'orge); maladie et malades", tr: "Sahih el-Buhari 5689 — Talbina, Hastalık ve Hastalar", id: "Sahih al-Bukhari 5689 — Talbina, Penyakit dan Orang Sakit" }
text: "حَدَّثَنَا حِبَّانُ بْنُ مُوسَى، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا يُونُسُ بْنُ يَزِيدَ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَا ـ أَنَّهَا كَانَتْ تَأْمُرُ بِالتَّلْبِينِ لِلْمَرِيضِ وَلِلْمَحْزُونِ عَلَى الْهَالِكِ، وَكَانَتْ تَقُولُ إِنِّي سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" إِنَّ التَّلْبِينَةَ تُجِمُّ فُؤَادَ الْمَرِيضِ، وَتَذْهَبُ بِبَعْضِ الْحُزْنِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5689، يذكر التلبينة، والمرض والمريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5689 (Medicine), that mentions talbina (barley gruel), illness and the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5689، جس میں تلبینہ، بیماری اور بیمار کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 5689 (Medicina), menciona la talbina (gachas de cebada), la enfermedad y los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5689 (Médecine), mentionne la talbina (bouillie d'orge), la maladie et les malades. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5689 numaralı hadiste, talbina (arpa lapası), hastalık ve hasta kişiden bahsedilir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5689, menyebutkan talbina (bubur barley), penyakit, dan orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
