text: "قرية. وأما الاختلاف في هذه الكور والنواحي فإن الجيهاني ذكر في كتابه أن الصغد كصورة إنسان رأسه بنجكث ورجلاه الكشانية وظهره أوفر وبطنه كبوذنجكث وتركسفي ويداء مايمزغ وبوزماجن وجعل طوله سته وثلاثين فرسخا في سنة وأربعين فرسخا، وقال: منبرها الأجل"
