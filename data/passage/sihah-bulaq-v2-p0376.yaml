text: |-
  n(عملn•
  ٢١٦
  ضخمات وضخام وعبلة اسم جارية وأمية الصغرى وهم من قريس يقال لهم العبلات بالصريك
  والنسبة اليهم عبلى تردّه الى الواحدلان أمهم استهما عبلة وعبات الحبل عبلا قتلته والعبل
  بالتعريك الهدب وهو كل ورق مفتول مئل ورق الارطى والائل والطرفاء ونحوذلك
  قال ابن السكيت بقال أعبل الارطى اذا غلظ هديه فى القيظ وأحترّ وصلح أن يدبغ
  به قال ذو الرمّة
  اذا ذابت الشمس اتق صقراتها * بأفنان هربوع الصرية معبل
  وعيلت الشهجرة أعبلها ء يلا اذا حتت ورقها الاصحى أعبات الشجرة سقط ورقها وفى
  لحديث فى شجرة سرّتحتها سبعون نييافهى لا تسرف ولا تعبل ولا تجرد أى لا تقع فيهما سرفة
  ولا يسقط ورقها ولا يأكاها الجراد والاعمل حجارة بيض وصخرة عبلاء أى بيضاء والهع
  عبال مثل بطماء وبطاح والمعبلة نصل عريض طويل قال الكسائى عبلت السهم جعات
  فيه معبلة والعبال مخفف الورد الجبلى ويقال ألتى عليه عبالته بتشديد اللام أى ثقله
  والعبيل والعتيلة البظر والعنابل الغليظ وقال
  والقوس فيها وترعنابل • تزل عن صفحته المعابل
  بهل عبهل الابل أى أهملها منسل أجاها والعين مبدلة من الهمسزة وابل معيهلة
  لا راعى لهما ولا حافظ وقال • عباهل عبهلها الورتاد • وعباحلة المن ملوكهم الذين أقروا
  على ملكهم لايزالون عنه نسل العنلة بيرم النجاد والجتاب والعتلة الهراوة
  الدليظة والعتلة النافة التى لا تلقح فهى قوية أبدا والعدلة واحدة العمل وهى القسى"
  الفارسية قال أبو الصلت الثقنى
  يرمون عن عنل كأنها غبط • بزمخر يعجل المرمى اعجالا .
  وجديلة طايء تقول للاجير عميل وابهع عتلاه وعتلت الرجل أعتل وأعتلداذا جذ بته جذبا
  عنيفلورجلمعتل بالكسر وقال ٢ ي صف فرسا • تفرعه فرعاولنانعتله • قال ابن
  السكيت عتل وعننه باللام والنون جميعا والعتل الفليظ الجمافى وقال تعالى عتل بعد ذلك
  زنيم والعتل أيضا الرح الغليظ ورجل عتل بالكسر بين العتل أى سريع الى الشر ويقال.
  لا أنعتل معك أى لا أبرح مكانى نل رجل عشولّ أى قدم مسة خ مثل الفثول-
  وفى كتاب سيبويه عثول وعنوثل منه ويقال للضبع أم عثيل ( ثجل أبو عبيد
  العنجل مثل الاتجل وهو العظيم البطن ⁦(عشكل)⁩ العنكول والعشكال الشمراخ وهوما
  عليه البسر من عيدان الكاسة وهو فى النخل بنزلة العنقود ف السكرم وقول الراجز
  لوأبصرت سعدى بها كائلى • طويلة الاقناء والاناكل
  أراد العناكل فقلب العين همزة وتعشكل العذق اذا كثرت شماريخه وعشكل الهودج أى
  زين (عجل العجل ولد البقرة والعجول مثله والجع التجاجيل والاتى عجملة عن أب
  الجرّاح وبقرة معجسل ذات عمل وعجل قبيلة من ربيعة وهو عمل بن لجيم بن صعب بن على مبن
  بكرين وائل وقول الشاعر
