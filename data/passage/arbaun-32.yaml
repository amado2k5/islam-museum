text: "لا ضرر ولا ضرار"
summary:
  ar: "حديث أبي سعيد الخدري أن النبي قال: «لا ضرر ولا ضرار» — وهو الحديث الثاني والثلاثون في الأربعين النووية وفي شرح ابن رجب؛ قال النووي حديث حسن رواه ابن ماجه والدارقطني وغيرهما مسنداً ورواه مالك في الموطأ عن عمرو بن يحيى عن أبيه مرسلاً فأسقط أبي سعيد وله طرق يقوى بعضها ببعض؛ وبين ابن رجب أن ابن ماجه لم يخرج حديث أبي سعيد وإنما أخرجه الدارقطني والحاكم والبيهقي من رواية عثمان بن محمد بن عثمان بن ربيعة حدثنا الدراوردي عن عمرو بن يحيى المازني عن أبيه عن أبي سعيد مرفوعاً «لا ضرر ولا ضرار من ضار ضره الله ومن شاق شق الله عليه» وقال الحاكم صحيح الإسناد على شرط مسلم وقال البيهقي تفرد به عثمان عن الدراوردي؛ وأما مالك فلم يختلف عنه في إرساله عند ابن عبد البر وقال لا يسند من وجه صحيح ثم خرجه من رواية عبد الملك بن معاذ النصيبي عن الدراوردي موصولاً والدراوردي كان أحمد يضعف ما حدث به من حفظه ولا يعبأ به ولا شك في تقديم قول مالك على قوله، وقال خالد بن سعد الأندلسي الحافظ لم يصح حديث «لا ضرر ولا ضرار» مسنداً؛ ومعنى الحديث عند الشراح نفي الضرر ابتداءً ومجازاةً — فلا يضر المسلم نفسه ولا غيره ولا يقابل ضرراً بضرر — وهو قاعدة كبرى في الفقه يستخرج منها ابن رجب في شرحه الطويل إسقاط الضرر عما يوجبه الشرع من التكاليف ⁦(جامع العلوم والحكم ص 667–683)⁩."
  en: "The hadith of Abu Sa'id al-Khudri that the Prophet said 'no harm and no reciprocating harm' — the thirty-second of al-Nawawi's Forty and of Ibn Rajab's commentary; al-Nawawi calls it hasan, transmitted by Ibn Majah, al-Daraqutni and others with a full chain and by Malik in the Muwatta' mursal through Amr ibn Yahya from his father, dropping Abu Sa'id, with routes that strengthen one another; Ibn Rajab clarifies that Ibn Majah did not in fact carry Abu Sa'id's version — it comes through al-Daraqutni, al-Hakim and al-Bayhaqi via Uthman ibn Muhammad ibn Uthman ibn Rabi'a, 'al-Darawardi told us', from Amr ibn Yahya al-Mazini from his father from Abu Sa'id in the fuller wording 'no harm and no reciprocating harm; whoever harms, God harms him, and whoever makes things difficult, God makes things difficult for him' — al-Hakim grading its chain sahih on Muslim's condition and al-Bayhaqi noting Uthman alone narrates it from al-Darawardi; as for Malik's mursal, Ibn Abd al-Barr reports no one diverges from it and that it has no sound full chain, then carries a connected route through Abd al-Malik ibn Mu'adh al-Nasibi from al-Darawardi — whose transmissions from memory Ahmad used to weaken and pay no heed to, Malik's word unquestionably outweighing his — while the Andalusian memoriser Khalid ibn Sa'd declared 'no harm and no reciprocating harm' never established with a full chain; the commentators read the hadith as negating harm both initiatory and retaliatory — that a Muslim neither harms himself or another nor answers harm with harm — a supreme legal maxim from which Ibn Rajab, in his long commentary, draws the removal of hardship from the Law's impositions (Jami' al-Ulum wal-Hikam pp. 667–683)."
  es: "El hadiz de Abu Sa'id al-Khudri que dice que el Profeta dijo 'no hay daño ni daño recíproco' —el trigésimo segundo de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab; al-Nawawi lo llama hasan, transmitido por Ibn Majah, al-Daraqutni y otros con una cadena completa y por Malik en el Muwatta' mursal a través de Amr ibn Yahya de su padre, dejando de lado a Abu Sa'id, con rutas que se refuerzan unas a otras; Ibn Rajab aclara que Ibn Majah no transmitió la versión de Abu Sa'id, sino que esta llega a través de al-Daraqutni, al-Hakim y al-Bayhaqi a través de Uthman ibn Muhammad ibn Uthman ibn Rabi'a, 'al-Darawardi nos lo contó', de Amr ibn Yahya al-Mazini de su padre de Abu Sa'id en la redacción más completa 'sin daño ni daño recíproco; quien dañe, Dios le da daño, y quien haga las cosas difíciles, Dios le hace las cosas difíciles'. Al-Hakim califica su cadena como sahih según la condición de Muslim y al-Bayhaqi señala que solo Uthman la narra de al-Darawardi; En cuanto al mursal de Malik, Ibn Abd al-Barr informa que nadie se desvía de él y que no tiene una cadena completa sólida, luego lleva una ruta conectada a través de Abd al-Malik ibn Mu'adh al-Nasibi de al-Darawardi —cuyas transmisiones de memoria Ahmad solía debilitar y no prestar atención, la palabra de Malik indudablemente pesaba más que la suya— mientras que el memorizador andalusí Khalid ibn Sa'd declaró 'ningún daño y ningún daño recíproco' nunca establecido con una cadena completa; los comentaristas interpretan el hadiz como una negación del daño tanto iniciador como retaliatorio —que un musulmán ni se daña a sí mismo ni a otro ni responde al daño con daño— una máxima jurídica suprema de la que Ibn Rajab, en su extenso comentario, extrae la eliminación de la dificultad de las imposiciones de la Ley (Jami' al-Ulum wal-Hikam pp. 667–683)."
  fr: "Le hadith d'Abu Sa'id al-Khudri selon lequel le Prophète a dit « ni mal ni mal en retour » — le trente-deuxième des quarante hadiths d'al-Nawawi et du commentaire d'Ibn Rajab; al-Nawawi le qualifie de hasan, transmis par Ibn Majah, al-Daraqutni et d'autres avec une chaîne complète et par Malik dans le Muwatta' mursal par l'intermédiaire d'Amr ibn Yahya de son père, omettant Abu Sa'id, avec des voies qui se renforcent mutuellement; Ibn Rajab précise qu'Ibn Majah n'a en fait pas transmis la version d'Abu Sa'id — elle provient d'al-Daraqutni, al-Hakim et al-Bayhaqi via Uthman ibn Muhammad ibn Uthman ibn Rabi'a, « al-Darawardi nous l'a dit », d'Amr ibn Yahya al-Mazini de son père d'Abu Sa'id dans la formulation plus complète « ni mal ni mal en retour »; Quiconque nuit, Dieu lui nuit, et quiconque rend les choses difficiles, Dieu lui rend les choses difficiles » — al-Hakim autorisant la chaîne de transmission selon les conditions de Muslim et al-Bayhaqi notant qu'Uthman est le seul à la rapporter d'al-Darawardi; quant à la transmission murale de Malik, Ibn Abd al-Barr rapporte que personne ne s'en écarte et qu'elle ne possède pas de chaîne de transmission complète et fiable, puis emprunte un chemin continu à travers Abd al-Malik ibn Mu'adh al-Nasibi d'al-Darawardi — dont Ahmad avait tendance à minimiser et à ignorer les transmissions de mémoire, la parole de Malik l'emportant incontestablement sur la sienne — tandis que le mémorisateur andalou Khalid ibn Sa'd a déclaré « ni mal ni mal réciproque », sans jamais établir de chaîne de transmission complète; Les commentateurs interprètent le hadith comme niant le préjudice à la fois initié et en représailles — qu'un musulman ne se nuit ni à lui-même ni à autrui et ne répond pas au préjudice par le préjudice — une maxime juridique suprême dont Ibn Rajab, dans son long commentaire, tire la suppression des difficultés liées aux impositions de la Loi (Jami' al-Ulum wal-Hikam pp. 667–683)."
  ur: "ابو سعید الخدری کی حدیث ہے کہ نبی نے فرمایا 'کوئی نقصان نہیں اور کوئی نقصان نہیں' - نووی کی چالیس کی بتیسویں اور ابن رجب کی تفسیر کی؛ النووی اسے حسن کہتے ہیں، جسے ابن ماجہ، الدارقطنی اور دیگر نے مکمل سلسلہ کے ساتھ نقل کیا ہے اور مالک نے موطا مرسل میں عمرو بن یحییٰ کے ذریعے اپنے والد سے، ابو سعید کو چھوڑ دیا، ایک دوسرے کو مضبوط کرنے والے راستوں کے ساتھ۔ ابن رجب نے وضاحت کی ہے کہ ابن ماجہ نے درحقیقت ابو سعید کا نسخہ نہیں لیا ہے بلکہ یہ الدارقطنی، الحاکم اور بیہقی کے ذریعے عثمان بن محمد بن عثمان بن ربیعہ کے ذریعے آتا ہے، الدراوردی نے ہم سے بیان کیا، عمرو بن یحییٰ نے اپنے والد ابو سعید المعروف ابو سعید المعروف سے۔ اور کوئی بدلہ نقصان نہیں؛ جو کوئی نقصان پہنچاتا ہے، خدا اسے نقصان پہنچاتا ہے، اور جو شخص مشکل بناتا ہے، خدا اس کے لئے مشکل پیدا کرتا ہے۔'' - الحاکم نے اس کی سند کو مسلم کی حالت پر صحیح قرار دیا ہے اور بیہقی نے عثمان کو اکیلے داروردی سے روایت کیا ہے۔ جہاں تک مالک کی مرسل کا تعلق ہے، ابن عبد البر نے رپورٹ کیا ہے کہ کوئی بھی اس سے ہٹ نہیں سکتا اور اس کا کوئی مکمل سلسلہ نہیں ہے، پھر الدراوردی سے عبد الملک بن معاذ النصیبی کے ذریعے ایک مربوط راستہ لے کر جاتا ہے - جس کی یادداشت سے منتقلی احمد کمزور ہو جاتی تھی اور اس پر کوئی دھیان نہیں دیتی تھی، جبکہ مالک کا لفظ خلیصدل اور اس کے الفاظ کو خارج کر دیتا ہے۔ ابن سعد نے اعلان کیا کہ 'کوئی نقصان نہیں اور کوئی نقصان نہیں' ایک مکمل سلسلہ کے ساتھ کبھی قائم نہیں ہوا۔ مفسرین حدیث کو ابتدائی اور انتقامی دونوں طرح کے نقصان کی نفی کے طور پر پڑھتے ہیں - کہ ایک مسلمان نہ تو اپنے آپ کو نقصان پہنچاتا ہے اور نہ ہی نقصان کا جواب نقصان سے دیتا ہے - ایک اعلیٰ قانونی ماخذ جس سے ابن رجب نے اپنی طویل تفسیر میں قانون کے نفاذ سے سختی کو دور کرنے کی طرف اشارہ کیا ہے ⁦(جامع العلوم والحکم والحکام pp66-7)⁩۔"
  tr: "Ebu Said el-Hudri'nin rivayet ettiği hadiste Peygamber şöyle buyurmuştur: \"Ne zarar verilmeli ne de zarara karşılık verilmelidir.\" Bu hadis, Nevevi'nin Kırk Hadis adlı eserinde ve İbn Receb'in tefsirinde otuz ikinci hadistir. Nevevi şöyle demiştir: Bu hadis, İbn Majah, Darakutni ve diğerleri tarafından isnad zinciriyle rivayet edilmiş sahih bir hadistir. Malik de bunu Muvatta'da Amr ibn Yahya'dan, o da babasından isnad zinciriyle rivayet etmiştir; dolayısıyla Ebu Said'i atlamıştır. Bu hadisin birçok isnad zinciri vardır ve bazılarının birbirini desteklediği rivayet edilir. İbn Receb, İbn Majah'ın Ebu Said hadisini kendi hadislerine dahil etmediğini, aksine bu hadisin Daravütni, Hakim ve Beyhaki tarafından Osman ibn Muhammed ibn Osman ibn Rabi'ah'tan rivayetle nakledildiğini açıklamıştır. Osman ibn Muhammed ibn Osman ibn Rabi'ah şöyle demiştir: Daravüti, Amr ibn Yahya el-Mazini'den, o da babasından, o da Ebu Said'den rivayetle, Peygamberimize atfedilen şu hadisi bize aktarmıştır: \"Ne zarar verilmeli ne de zarara karşılık verilmelidir. Kim zarar verirse Allah da ona zarar verir, kim de ona zorluk çıkarırsa Allah da ona zorluk çıkarır.\" Hakim şöyle demiştir: Müslim'in şartlarına göre sahih bir isnad zinciri vardır. Beyhaki ise şöyle demiştir: Osman, Daravüti'den rivayetle tek başına nakletmiştir. Malik ise İbn Abd el-Barr'a göre rivayetinde ondan farklı bir görüş belirtmemiş ve sahih bir şekilde rivayet edilmediğini söylemiştir. Sonra bunu Abdülmalik ibn Mu'adh el-Nasibi'nin, Daravdi'den rivayet ettiği ve isnad zinciriyle bağlantılı olan hadisten çıkardı. Ahmed, Daravdi'nin ezberden rivayet ettiği şeyleri zayıf bulur ve ona önem vermezdi. Malik'in ifadesinin Daravdi'nin ifadesine göre öncelikli olmasında şüphe yoktur. Ve ezberci Halid ibn Sa'd el-Endülüs, \"Ne zarar vardır ne de zarara karşılık\" hadisinin isnad zinciriyle bağlantılı olmadığını söyledi. Tefsircilere göre hadisin anlamı, başlangıçta ve karşılık olarak zararın reddedilmesidir - yani Müslüman kendine veya başkalarına zarar vermez ve zarara zararla karşılık vermez - ve bu, İbn Receb'in uzun tefsirinde Şeriatın yükümlülüklerden zararı ortadan kaldırmasını sağladığı fıkıhta önemli bir ilkedir (Cami' el-Ulum ve el-Hikam, s. 667-683)."
  id: "Hadits Abu Saeed al-Khudri, bahwa Nabi bersabda: “Janganlah ada bahaya dan jangan pula membalas bahaya” — dan hadits ini adalah hadits ke-32 dalam Kitab Empat Puluh Hadits karya al-Nawawi dan dalam tafsir Ibn Rajab; al-Nawawi berkata: Ini adalah hadits yang baik yang diriwayatkan oleh Ibn Majah, al-Daraqutni dan lainnya dengan sanad yang baik, dan Malik meriwayatkannya dalam kitab al-Muwatta’ atas otoritas Amr ibn Yahya atas otoritas ayahnya dengan sanad yang baik, sehingga ia menghilangkan Abu Saeed, dan hadits ini memiliki sanad yang beberapa di antaranya saling menguatkan; Dan Ibn Rajab menjelaskan bahwa Ibn Majah tidak memasukkan hadits Abu Saeed, melainkan hadits itu dimasukkan oleh al-Daraqutni, al-Hakim dan al-Bayhaqi atas otoritas Uthman ibn Muhammad ibn Uthman ibn Rabi’ah, yang berkata: al-Darawardi meriwayatkan kepada kami atas otoritas Amr ibn Yahya al-Mazini atas otoritas ayahnya atas otoritas Abu Saeed, yang dinisbahkan kepada Nabi: “Tidak boleh ada bahaya dan tidak boleh ada pembalasan atas bahaya. Barangsiapa berbuat jahat, Allah akan menyakitinya, dan barangsiapa mempersulitnya, Allah akan mempersulitnya.” Al-Hakim berkata: Hadits ini memiliki sanad yang sahih menurut syarat-syarat Muslim, dan al-Bayhaqi berkata: Uthman adalah satu-satunya yang meriwayatkannya atas otoritas al-Darawardi; Adapun Malik, menurut Ibnu Abd al-Barr, ia tidak berbeda pendapat dengannya dalam periwayatan hadits tersebut, dan ia mengatakan bahwa hadits itu tidak diriwayatkan secara sahih. Kemudian ia mengambilnya dari riwayat Abd al-Malik ibn Mu’adh al-Nasibi berdasarkan riwayat al-Darawardi dengan sanad yang berkesinambungan. Ahmad biasa menganggap apa yang diriwayatkan al-Darawardi dari hafalannya lemah dan tidak memperhatikannya. Tidak diragukan lagi bahwa pendapat Malik lebih diutamakan daripada pendapat Ahmad. Dan Khalid ibn Sa’d al-Andalusi, seorang penghafal hadits, mengatakan bahwa hadits “Tidak ada bahaya dan tidak ada balasan bahaya” tidak sahih dengan sanad yang berkesinambungan. Menurut para penafsir, makna hadits tersebut adalah penolakan terhadap bahaya pada awalnya dan dalam pembalasan — sehingga seorang Muslim tidak membahayakan dirinya sendiri atau orang lain dan tidak membalas bahaya dengan bahaya — dan ini merupakan prinsip utama dalam fiqih yang darinya Ibn Rajab mengambil kesimpulan dalam komentarnya yang panjang tentang penghapusan bahaya dari apa yang diwajibkan oleh syariat (Jami’ al-‘Ulum wa al-Hikam, hlm. 667–683)."
