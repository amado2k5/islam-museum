text: "… و ما اكثر من هذ اعكاز احمل بها زادى وقدح اكل فيه ققال له عمر ابك لمم قال لاقال فماغشية بلغنى انها تصيبك قال حضرت خيب بن عدي حين صلب فدعا على قريش وانا فيهم فر بماذكرت ذلك فاخذتنى فترة …"
