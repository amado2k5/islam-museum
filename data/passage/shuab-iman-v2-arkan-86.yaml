text: "… أو كسَاها فَمَنْ دونَه من خلق الله، فإنها لَه زكاةٌ، وأيُّما رجلٍ مسلم لم يكن له عنده صدقةً فليقل في دعائه: الّلّهُمّ صلّ على محمدٍ عبدك ورسولك، وصلّ على المؤمنين والمؤمنات، والمسلمين والمسلمات فإنّها له زكاةٌ. قال: لا يشبع مؤمن …"
summary:
