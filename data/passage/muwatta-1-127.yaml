label:
  ar: 'الموطأ 127 — أم سليم تسأل عن احتلام المرأة: نعم فلتغتسل'
  en: Muwatta 127
  ur: 'موطأ 127 — ام سلیم کا سوال: عورت خواب میں وہ دیکھے تو کیا'
  es: "Muwatta 127"
  fr: "Muwatta 127"
  tr: "Al-Muwatta 127 — Ümmü Süleym, bir kadının ıslak rüyası hakkında soruyor: Evet, gusül (ritüel banyo) yapmalıdır."
  id: "Al-Muwatta 127 — Umm Sulaym bertanya tentang mimpi basah seorang wanita: Ya, dia harus melakukan ghusl (mandi ritual)."
text: نعم، فلتغتسل
summary:
  ar: 'أول حديث في باب غسل المرأة إذا رأت في المنام مثل ما يرى الرجل. يرويه مالك عن ابن شهاب عن عروة بن الزبير: سألت أم سليم النبي عن المرأة ترى في المنام مثل ما يرى الرجل أتغتسل، فقال: نعم، فلتغتسل. فقالت لها عائشة مستنكرة: أف لك، وهل ترى ذلك المرأة؟ فقال لها النبي: تربت يمينك، ومن أين يكون الشبه؟ أي شبه الولد بأمه. وينقل المحقق عن ابن عبد البر أن جمهور رواة الموطأ رووه عن مالك عن ابن شهاب عن عروة مرسلاً، وأن ابن أبي الوزير وعبد الله بن نافع روياه عنه عن عروة عن عائشة، وأن يونس وعقيلاً وغيرهما رووه عن ابن شهاب عن عروة عن عائشة، وأن الحديث عند أهل العلم صحيح لابن شهاب عن عروة عن عائشة ⁦(التمهيد 8/333–335)⁩. {cite:muwatta-maruf-1997 p.96}'
  ur: 'موطأ میں حدیث، نمبر 127: ام سلیم نے نبی سے پوچھا کہ عورت خواب میں وہ دیکھے جو مرد دیکھتا ہے تو کیا اسے غسل کرنا چاہیے، تو آپ نے کہا: «ہاں، وہ غسل کرے»؛ اور عائشہ کے اعتراض پر نبی نے کہا: «تربت يمينك، ومن أين يكون الشبه؟» یعنی بچہ ماں سے مشابہت رکھتا ہے۔'
  tr: "Bu hadisler bölümündeki ilk hadis, bir kadının rüyasında bir erkeğin gördüğünü görmesi durumunda gusül abdesti almasıyla ilgilidir. Malik, İbn Şihab'tan, o da Urve ibn el-Zübeyr'den rivayet etmiştir: Ümmü Süleym, Peygamberimize rüyasında bir erkeğin gördüğünü gören bir kadın hakkında sordu: Gusül abdesti almalı mıdır? Peygamberimiz buyurdu ki: Evet, alsın gusül abdesti alsın. Aişe ona karşı çıkarak dedi ki: Yazıklar olsun sana! Bir kadın bunu mu görür? Peygamberimiz ona dedi ki: Sağ elin toz içinde kalsın! Benzerlik nereden geliyor? Yani çocuğun annesine benzemesinden. Araştırmacı, İbn Abdülberr'in şöyle dediğini aktarıyor: \"Muvatta'nın ravilerinin çoğu, bu hadisi Malik'ten, İbn Şihab'tan, o da Urve'den rivayetle mursal bir hadis olarak nakletmişlerdir. İbn Abi el-Vezir ve Abdullah ibn Nafi' ise bu hadisi ondan, Urve'den, o da Aişe'den rivayet etmişlerdir. Yunus, Akil ve diğerleri ise bu hadisi İbn Şihab'tan, o da Urve'den, o da Aişe'den rivayet etmişlerdir. Bu hadis, âlimler tarafından İbn Şihab'tan, o da Urve'den, o da Aişe'den rivayetle sahih kabul edilmektedir.\" (el-Tamhid 8/333–335). {cite:muwatta-maruf-1997 s.96}"
  id: "Hadits pertama dalam surah ini membahas tentang mandi wajib seorang wanita jika ia melihat dalam mimpi apa yang dilihat seorang pria. Diriwayatkan oleh Malik dari Ibnu Shihab dari Urwah ibn al-Zubayr: Umm Sulaym bertanya kepada Nabi tentang seorang wanita yang melihat dalam mimpi apa yang dilihat seorang pria: Haruskah ia bermandi wajib? Beliau menjawab: Ya, bolehlah ia bermandi wajib. Aisyah berkata kepadanya dengan tidak setuju: Malu kamu! Apakah seorang wanita melihat hal itu? Nabi menjawab kepadanya: Semoga tangan kananmu tertutup debu! Dan dari manakah kemiripan itu berasal? Maksudnya kemiripan anak dengan ibunya. Peneliti mengutip Ibnu Abd al-Barr yang mengatakan bahwa mayoritas perawi al-Muwatta' meriwayatkan hadits ini dari Malik atas otoritas Ibnu Shihab atas otoritas Urwah sebagai hadits mursal, dan bahwa Ibnu Abi al-Wazir dan Abdullah ibn Nafi' meriwayatkannya dari beliau atas otoritas Urwah atas otoritas Aisyah, dan bahwa Yunus, Aqil, dan lainnya meriwayatkannya atas otoritas Ibnu Shihab atas otoritas Urwah atas otoritas Aisyah, dan bahwa hadits ini dianggap sahih oleh para ulama atas otoritas Ibnu Shihab atas otoritas Urwah atas otoritas Aisyah (al-Tamhid 8/333–335). {cite:muwatta-maruf-1997 p.96}"
