label: { ar: "الموطأ 127 — أم سليم تسأل عن احتلام المرأة: نعم فلتغتسل", en: "Muwatta 127" }
text: "نعم، فلتغتسل"
summary:
  ar: "أول حديث في باب غسل المرأة إذا رأت في المنام مثل ما يرى الرجل. يرويه مالك عن ابن شهاب عن عروة بن الزبير: سألت أم سليم النبي عن المرأة ترى في المنام مثل ما يرى الرجل أتغتسل، فقال: نعم، فلتغتسل. فقالت لها عائشة مستنكرة: أف لك، وهل ترى ذلك المرأة؟ فقال لها النبي: تربت يمينك، ومن أين يكون الشبه؟ أي شبه الولد بأمه. وينقل المحقق عن ابن عبد البر أن جمهور رواة الموطأ رووه عن مالك عن ابن شهاب عن عروة مرسلاً، وأن ابن أبي الوزير وعبد الله بن نافع روياه عنه عن عروة عن عائشة، وأن يونس وعقيلاً وغيرهما رووه عن ابن شهاب عن عروة عن عائشة، وأن الحديث عند أهل العلم صحيح لابن شهاب عن عروة عن عائشة (التمهيد 8/333–335). {cite:muwatta-maruf-1997 p.96}"
