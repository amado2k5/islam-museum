label: { ar: "مسلم 2284 — آخذ بحجزكم وأنتم تقحمون في النار", en: "Muslim 2284 — I hold you back while you plunge into the fire" }
text: "قال رسول الله: إنما مثلي ومثل أمتي كمثل رجل استوقد ناراً، فجعلت الدواب والفراش يقعن فيه، فأنا آخذ بحجزكم وأنتم تقحمون فيه"
summary:
