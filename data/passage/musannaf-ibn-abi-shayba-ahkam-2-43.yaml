text: "… فيقول: اللّه أكبر ؟. الرجل يدخل المسجد وهو يرى أنهم قد صلوا الفريضة، فيصلي من قال: يتم مع الإمام ما بقي ويجعل الباقي تطوعا.. الرجل يكون قائماً، فيصلي، فيسمع الإقامة وقت صلى.. الرجل يريد السفر من كان يستحب له أن …"
summary:
  ar: "مقطع من مصنف ابن أبي شيبة، المجلد المصوَّر 2، ص 43، يرد فيه ذكر الفريضة والفرائض، والمستحب، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from the Musannaf of Ibn Abi Shayba, scan volume 2, p. 43, whose wording mentions the obligation (farida), the recommended (mustahabb), the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
