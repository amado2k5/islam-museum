label: { ar: "الموطأ 2200 — مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف عن جابر بن عبد الله: قال رسول الله أيما رجل أعمر عمرى له ولعقبه، فإنها للذي يعطاها، لا ترجع إلى الذي أعطاها أبدا", en: "Muwatta 2200" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف عن جابر بن عبد الله الأنصاري أن رسول الله قال: أيما رجل أعمر عمرى له ولعقبه، فإنها للذي يعطاها، لا ترجع إلى الذي أعطاها أبدا. لأنه أعطى عطاء وقعت فيه المواريث. {cite:muwatta-maruf-1997 p.302}"
