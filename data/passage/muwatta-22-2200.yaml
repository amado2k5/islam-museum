label: { ar: "الموطأ 2200 — مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف عن جابر بن عبد الله: قال رسول الله أيما رجل أعمر عمرى له ولعقبه، فإنها للذي يعطاها، لا ترجع إلى الذي أعطاها أبدا", en: "Muwatta 2200", es: "2200 vatios", fr: "2200 watts", ur: "2200 واٹ", tr: "El-Muvatta 2200 — Malik, İbn Şihab'dan, o da Ebu Selama ibn Abdülrahman ibn Avf'tan, o da Cabir ibn Abdullah'tan rivayetle: Allah Resulü şöyle buyurdu: \"Bir kimse kendisi ve nesli için bir ömür boyu kullanım hakkı verirse, bu hak kime verilirse ona aittir ve asla verene geri dönmez.\"", id: "Al-Muwatta 2200 — Malik, berdasarkan riwayat Ibn Shihab, berdasarkan riwayat Abu Salama ibn Abd al-Rahman ibn Awf, berdasarkan riwayat Jabir ibn Abdullah: Rasulullah SAW bersabda: “Jika seseorang memberikan hak waris seumur hidup untuk dirinya dan keturunannya, maka hak waris itu menjadi milik orang yang menerimanya dan tidak akan pernah kembali kepada orang yang memberikannya.”" }
summary:
  ar: "يروي مالك عن ابن شهاب عن أبي سلمة بن عبد الرحمن بن عوف عن جابر بن عبد الله الأنصاري أن رسول الله قال: أيما رجل أعمر عمرى له ولعقبه، فإنها للذي يعطاها، لا ترجع إلى الذي أعطاها أبدا. لأنه أعطى عطاء وقعت فيه المواريث. {cite:muwatta-maruf-1997 p.302}"
  tr: "Malik, İbn Şihab'dan, o da Ebu Selama ibn Abdülrahman ibn Avf'tan, o da Cabir ibn Abdullah el-Ensari'den rivayetle, Allah Resulü'nün şöyle buyurduğunu nakde çevirmiştir: \"Bir kimse kendisi ve soyundan gelenler için bir ömür boyu kullanım hakkı verirse, bu hak kendisine verilene aittir ve asla verene geri dönmez; çünkü o, miras hakkına tabi bir bağışta bulunmuştur.\" {cite:muwatta-maruf-1997 s.302}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abu Salama ibn Abd al-Rahman ibn Awf, dari Jabir ibn Abdullah al-Ansari, bahwa Rasulullah SAW bersabda: “Jika seseorang memberikan hak waris seumur hidup untuk dirinya dan keturunannya, maka hak waris itu menjadi milik orang yang menerimanya dan tidak akan pernah kembali kepada pemberinya, karena ia memberikan hadiah yang termasuk dalam hak waris.” {cite:muwatta-maruf-1997 p.302}"
