text: "… حدّثنا موسى بن محمّد بن إبراهيم، عن أَبى وَجْزَة، قال : لما مَلَّت قُرَيشٌ المُقام، وأَجدب الجَناب، وضاقوا بالخَنْدَق، وكان أبو سُفيان على طمعِ أَن يُغير على بَيْضَة المدينة، كتب كتاباً فيه : باسمك اللّهمّ، فإنى أَحلف باللّات والعُزَّى، لقد …"
