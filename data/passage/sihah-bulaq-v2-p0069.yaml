text: |-
  ٥١٨
  فألقت عصاها واستقترت بها النوى • كماقرعينابالاياب المسافر
  وهذه عصاى أتوكأ عليها قال الفراء أول لحن .مع بالعراق هذه عصاتى ويقال فى الوارج
  قد شقواعصا المسلمين أى اجتماعهم وائتلافهم وانشقت العصا أى وقع الخلاف قال الشاعر
  اذا كانت الهيجاء وانشقت العصا • فيسبك والفحاك يف مهند
  أى يكفيك ويكفى الضهاك وقولهم لا ترفع عصاك عن أهلك يرادبه الادب والعصا اسم فرس
  جذيمة الابرش وفى المثل ركب العصاقصيروة ولهم انه اضعيف العصا أى ترعيسة
  وأنشد الاصمعى للراعى
  ضعيف العصابادى العروق ترى له عليها اذا ما أجدب الناس اصبعا
  ويقال أيضاانه للين العصا أى رفيق حسن السياسة لماولى قال أوس بن معن المزنىّ يذكر
  رجلاعلى ماءي-قى ابلا
  عليه شريب وادع لبن العصا • ياجلها جاته وتساجله
  موضع الهات نصب وجعل شربهاللماء مساجلة والعصىّ العظام التى فى الجناح وقال
  وفى حقها الادنى عصىّ القوادم * وعصوته بالعصاضر تهبها ر عصوت الجرح شددته
  والعصى مقصور مصدرة ولك عصى بالسيف يعصى اذ اضرب به قال جرير
  تصف السيوف وغيركم يعصى بها • ياابن القيون وذاك فعل الصيقل
  وفلان يعنصى على عصا أى يتوكاً عليها ويعتصى بالسيف أى يجعله عصا والعصيان خلاف
  الطاعة وقدعصاه يعصبه عصبا ومعصبة فهو عاص وعدىّ وعاصاء أيضا مثل عصاه
  واستعصى عليه واعتصت النواة أى اشتدت وأعهى الكرم اذا أخرج عيسدانه والعاصى
  العرق الذى لايرقأ وقال
  صرت نظرة لوصادفت جوز دارع * غدا والعواصى من دم الجوف تنعر
  وهومن الياء أيضا وعصية بطن من سليم والعنصوة الخصلة من الشعر (عضا العضو
  والعضوواحسد الاعضاء وعضيت الشاة تعضية اذاجزأتها أعضاء ويقال أيضاعضيت
  الشئ تعضية اذافرّقته وفى الحديث لا تعضية فى ميراث الافيماجل القسم يعن أنّ مالا
  يحتم-ل القسم كالمبة من الجوهر ونحوها لا يفرّق وان طلب بعض الورثة القسم فيه لارة فيه
  ضررا عليهم أوعلى بعضهم ولكنه يباع ثم يقسم التمن بينهم بالقريضة وقوله تعالى الذين جعلوا
  القرآن عضين واحدتم اعضة ونقصانها الواووالهاء وقدذ كرنا. فى باب الهاء الاصمعى
  فى الدار فرق من الناس وعزون وعضون وأصناف بمعنى واحد ⁦( طا )⁩. أعطاه ما لا يعطيه
  اعطاء والاسم العطاء وأصله عطا وبالوا ولانه من عطوت الاأن العرب تهمزالوا ووالياءاذا
  جاء تابعد الالفلات الهمزة أحسل للحركة منهما ولاخ-م يستثقلون الوقف على الواو
  ٢لى الواحدفة ول عطاءة ورداءة ومنه-م من يردها الى الاص-ل فيتول عطاوة ودرايه
  وك_ذلك فى التشنيسة عطا آن وعطاوان وردا آن وردايان واستعطى وتعطى سأل العطاء
  ورجل معطاءكثير الاعطاء وامر أة معطاء ومفعال يستوى فيه الذكر والمؤنث وقوم
  معاطى
