text: |-
  ٤٤٩
  فلا تعلف ولا تسق حتى تموت أويحفولهاحفرة وتترك فيها الى أن تموت لانهم كانوا يزعون أنّ
  الناس يحشرون ركبانا على البلإيا ومشاة اذا الم تعكس مطاياهم على قبورهم تقول منه
  أبليت وبليت قال الطرقاح
  منازل لازى الانصاب فيها • ولاحفر المبلى للمنون
  أى انها منازل أهل الأسلام دون أهل الجاهلية وقامت مبليات فلان ينن عليه وذلك أن
  يقمن حول راحلته اذامات وبلى على فعيل قبيلة من قضاعة والنسبة اليهم بلوى وبلونه
  بلواجر بته واختبرته وبلاه اللّٰه بلاء وأبلاه ابلاه حسنا وابتلاه أى اختبره والتبالى الاختبار
  وقولهم ما أمالله أى ماأكترث له واذا قالو الم أمل حذفوا الالف تخف فالكثرة الاستعمال كما
  حذفوا الماءمن قولهم لا آدرى و كذلك يفعلون فى المصدرفة ولون ما أباليه مالة والاصل
  بالية مثل عافاه عافية حذفوا الياءمنهابنا على قواهم لم أبل وليس من باب الطاعة والجاية
  والطاقسة وناس من العرب ية ولون لم أبله لا يزيدون على حذف الالف كماحذفواعلبط.
  وبلى التوب يبلى إلى بكسر الباءفان فتحتم امددت قال العجاج
  والمريبليه بلا السربال • كرالميالى واختلاف الاحوال
  وأبليت النوب ويقال لامجد أبل ويخلف الله ونقول أبليت فلانابمينا اذاطيبت نفسه بها
  والبلاه الاختبار ويكون بالخير والشر يقال ابلاه اللّٰه بلاء حسنا وأبليته معروظ قال زهير
  جزى اللّه بالاحسان ما فعلابكم • وأبلاهما خير البلاه الذى يلو
  أى خير الصنيع الذى يختبر به عباده قال الاحر يقال نزات إلا على المكفار مثل قطام
  يحكيه عن العرب وبلى جواب للتصقيق توجب ما يقال انلانهازك انو وهى حرف لانها
  نقيضة لا قال سيبويه ليس إلى ونعم اسمين سا)، بى فلان بيتامن البيان وبى على أهله بناء
  فيه.اأى زفها والعامة تقول بنى بأهله وهو خطأ وكان الاصل فيه أن الداخل بأهله كان يضرب
  عليها قبة ليلة دخوله بم افقيل لكل داخل بأهله بان وبف قصوراشدد المكثرة وابتنى دارا
  وبنى بمعف والبنيان الممائط وقوس يانية بنت على وترها اذا الصقت به -تى يكاد ينقطع والبنية
  على فعيلة الكعبة يقال لاورب هذه البنية ما كان كذا وكذا والبف بالضم مة- ورمثل البق
  قال بنية وبق وبنية وبنى بكسر الياءمقصور مثل جزية وجزى وفلان صصيح البنية أى الفطرة؟
  والمبناة القطع قال النابغة
  على ظهر مبناة جديد سيورها • يطوف بها وسط القطيمة بائع
  ويقبال هى العيبة وأبنيت فلانا أى جعده يبنى بتا قال الشاعر
  لووصل الغيث أبنينا امراً • كانت له جبة سحق بجاد
  وفى المشل المعزى تبهى ولا تبف أى لا تجمل منها الابنية لان أبنية العرب طراف وأخبية
  فالطراف من أدم وانجباء من صوف أووبر ولا يكون من شعر والاين أص-له بنو والذاهب
  منه وا وكماذهب من أب وأخ لانك تقول فى مؤنثه بنت وأخت ولم نزهذه الهاء تطمق مؤنشا
  الاومذكره عذوف الواويدلك على ذلك أخوات وهنوات فيمن ردّ وتقسديره من الفعل فعل
  بالتهريك لات جمعه أبناء مثل بحل وأجمال ولا يجوز أن يكون فعلااً وفعلا الذى ججعهما أيضا
  LIE
