text: "… رأى شخص النبي يأمره بفعل ما هو مندوب إليه أو ينهاه عن منهي عنه، أو يرشده إلى فعل مصلحةٍ فلا خلاف في أنه يستحب له العمل بما أمره. وفي فتاوي الحناطي : لو رأى إنسان النبي في منامه على الصفة …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 1، ص 3176، يرد فيه ذكر المستحب، والمندوب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
