label:
  ar: "أبيات الحارث بن وعلة «قومي هم قتلوا أميم» (1)"
  en: "al-Harith ibn Wa'la's verses ('My own people killed Umaym') (1)"
  es: "Versículos de al-Harith ibn Wa'la ('Mi propio pueblo mató a Umaym') (1)"
