text: "قومي هم قتلوا أميم أخي فإذا رميت يصيبني سهمي"
summary:
  ar: "بيت من أبيات الحارث بن وعلة «قومي هم قتلوا أميم»، كما في طبعة 1916 لديوان الحماسة {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
  en: "Verse 1 of al-Harith ibn Wa'la's verses ('My own people killed Umaym'), as in the 1916 edition of the Hamasa."
  es: "Versículo 1 de los versículos de al-Harith ibn Wa'la ('Mi propio pueblo mató a Umaym'), como en la edición de 1916 de la Hamasa."
  fr: "Verset 1 des vers d'al-Harith ibn Wa'la (« Mon propre peuple a tué Umaym »), tel qu'il figure dans l'édition de 1916 du Hamasa."
  ur: "حارث بن والا کی آیات کی پہلی آیت ⁦('میرے اپنے لوگوں نے امیہ کو قتل کیا')⁩، جیسا کہ حماسہ کے 1916 کے ایڈیشن میں ہے۔"
  tr: "Al-Harith ibn Wa’la’nın şiirlerinden bir dize: “Ümeym’i öldürenler benim kavmimdir,” (1916 tarihli Diwan Al-Hamasa’da yer almaktadır) {{cite:hamasa-abu-tammam-ed-1916 s.57}}."
  id: "Sebuah bait dari puisi Al-Harith ibn Wa’la: “Kaumku adalah orang-orang yang membunuh Umaym,” sebagaimana terdapat dalam edisi Diwan Al-Hamasa tahun 1916 {{cite:hamasa-abu-tammam-ed-1916 p.57}}."
translations:
  en:
    text: "My own people are the ones who killed Umaym, my brother; so when I shoot, my arrow strikes me."
