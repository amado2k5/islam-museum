text: "إِنَّ ٱلَّذِينَ يُجَـٰدِلُونَ فِىٓ ءَايَـٰتِ ٱللَّهِ بِغَيْرِ سُلْطَـٰنٍ أَتَىٰهُمْ ۙ إِن فِى صُدُورِهِمْ إِلَّا كِبْرٌ مَّا هُم بِبَـٰلِغِيهِ ۚ فَٱسْتَعِذْ بِٱللَّهِ ۖ إِنَّهُۥ هُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ"
text_search: "إن الذين يجادلون في آيات الله بغير سلطان أتاهم ۙ إن في صدورهم إلا كبر ما هم ببالغيه ۚ فاستعذ بالله ۖ إنه هو السميع البصير"
translations:
  en: { text: "Lo! those who wrangle concerning the revelations of Allah without a warrant having come unto them, there is naught else in their breasts save pride which they will never attain. So take thou refuge in Allah. Lo! He, only He, is the Hearer, the Seer.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جو لوگ بغیر کسی دلیل کے جو ان کے پاس آئی ہو خدا کی آیتوں میں جھگڑتے ہیں ان کے دلوں میں اور کچھ نہیں (ارادہٴ) عظمت ہے اور وہ اس کو پہنچنے والے نہیں تو خدا کی پناہ مانگو۔ بےشک وہ سننے والا (اور) دیکھنے والا ہے", translator: "Fateh Muhammad Jalandhari", license: PD }
