label: { ar: "صحيح البخاري 1934 — مغفرة ما تقدم من الذنب", en: "Sahih al-Bukhari 1934 — forgiveness of past sins", ur: "صحیح بخاری 1934 — پچھلے گناہوں کی مغفرت" }
text: "… يَدَهُ الْيُمْنَى إِلَى الْمَرْفِقِ ثَلاَثًا، ثُمَّ غَسَلَ يَدَهُ الْيُسْرَى إِلَى الْمَرْفِقِ ثَلاَثًا، ثُمَّ مَسَحَ بِرَأْسِهِ، ثُمَّ غَسَلَ رِجْلَهُ الْيُمْنَى ثَلاَثًا، ثُمَّ الْيُسْرَى ثَلاَثًا، ثُمَّ قَالَ رَأَيْتُ رَسُولَ اللَّهِ تَوَضَّأَ نَحْوَ وُضُوئِي هَذَا، ثُمَّ قَالَ \" مَنْ تَوَضَّأَ وُضُوئِي هَذَا، ثُمَّ يُصَلِّي رَكْعَتَيْنِ، لاَ يُحَدِّثُ نَفْسَهُ فِيهِمَا بِشَىْءٍ، إِلاَّ غُفِرَ لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِهِ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 1934، يذكر مغفرة ما تقدم من الذنب. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1934 (Fasting), that speaks of forgiveness of past sins. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1934، جس میں پچھلے گناہوں کی مغفرت کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
