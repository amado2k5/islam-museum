text: "… زيادة فى الجواب فقلت بالايمان والتصديق غير أنا قد اصبنا من هذه الذنوب ! فقال اما انى قد اغفر لتكم، توف ابن مريج فى جادى الاولى من هذه السنة عن سبع ونحمسين سنة وستة اشهر ودفن بحجرة سويقة غالب. - …"
