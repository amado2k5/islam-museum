text: "… قطعت سعر الفوطة دخلٍ، يوماً، هو وتيمور لنك إلى الحمّام، فسأله تيمورلنك: لو كنْتُ عبداً فكم كنت أساوي؟ فقال له : خمسين درهماً. فصاح تيمور لنك بوجهه: يا قليل الإنصاف إن الفوطة التي بوسطي تساوي هذه القيمة. فأجابه الشيخ بسكون: …"
summary:
  ar: "سأل تيمور جحا في الحمام ماذا يكون لو كان عبدًا، فأجابه جحا، وتتمة الحكاية في الصفحة التالية. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  en: "At the bath, Timur asks Juha what he would be if he were a slave, and Juha answers; the anecdote continues on the next page. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  ur: "حمام میں تیمور نے جحا سے پوچھا کہ اگر تم غلام ہوتے تو کیا ہوتے؛ جحا نے جواب دیا؛ حکایت کا باقی حصہ اگلے صفحے پر ہے۔ {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  fr: "Au bain, Timur demande à Juha ce qu'il serait s'il était esclave, et Juha répond; l'anecdote continue à la page suivante. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
  es: "En el baño, Timur le pregunta a Juha qué sería si fuera esclavo, y Juha responde; la anécdota continúa en la página siguiente. {cite:juha-nawadir-kubra-djuwaydi p. 58}"
