text: "… حميد فى تفسير سورة البروج بإسناد صحيح عن ابن أبزى لا هزم المسلمون أهل فارس قال عمر : اجتمعوا. فقال : إن المجوس ليسوا أهل كتاب فنضع عليهم، ولا من عبدة الأوثان فنجرى عليهم أحكامهم فقال على : بل هم …"
