label: { ar: "الموطأ 1162 — مالك: بعض أهل العلم يكره رمي الجمرة قبل طلوع فجر يوم النحر", en: "Muwatta 1162", es: "Muwatta 1162", fr: "Muwatta 1162", ur: "موطا 1162", tr: "El-Muvatta 1162 — Malik: Bazı âlimler, Kurban Bayramı günü şafak sökmeden önce Cemarat'a taş atılmasını hoş karşılamazlar.", id: "Al-Muwatta 1162 — Malik: Sebagian ulama tidak menyukai melempar kerikil ke Jamarat sebelum fajar pada Hari Raya Kurban." }
summary:
  ar: "سمع مالك بعض أهل العلم يكره رمي الجمرة حتى يطلع الفجر من يوم النحر، ومن رمى فقد حل له النحر. {cite:muwatta-maruf-1997 p.525}"
  tr: "Malik, bazı âlimlerin, kurban günü şafak sökene kadar Cemarat'a taş atmanın mekruh olduğunu, ancak atan kişinin daha sonra kurban kesmesine izin verildiğini söylediklerini işitti. {cite:muwatta-maruf-1997 s.525}"
  id: "Malik mendengar beberapa ulama mengatakan bahwa melempar kerikil ke Jamarat hingga fajar pada Hari Raya Kurban adalah perbuatan yang tidak disukai, tetapi siapa pun yang melemparnya kemudian diperbolehkan untuk melaksanakan kurban. {cite:muwatta-maruf-1997 p.525}"
