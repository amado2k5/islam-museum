text: "… ورقة ملك من الملائكة ، قال: وقال: فرضت عليّ خمسون صلاة، وقال. : لك بكل حسنة عشر إذا هممت بالحسنة فلم تعملها كتبت لك حسنة ، فإذا عملتها كتبت لك عشراً وإذا هممت بالسيئة فلم تعملها لم يكتب عليك شيء …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 964، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 964, that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 964 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, pág. 964, que habla de un número determinado de buenas acciones, la escritura de buenas acciones, un número determinado de malas acciones, la escritura de malas acciones; de la copia extraída, citada dentro de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Dala'il al-Nubuwwa d'al-Bayhaqi, p. 964, qui parle d'un nombre déterminé de bonnes actions, de l'écriture des bonnes actions, d'un nombre déterminé de mauvaises actions, de l'écriture des mauvaises actions; tiré de la copie extraite, cité en quarante mots conformément à la politique des sources."
  tr: "El-Beyhakî'nin \"Peygamberliğin Delilleri\" adlı eserinin 964. sayfasından, iyi amellerin sayısı, iyi amellerin yazılması, kötü amellerin sayısı ve kötü amellerin yazılmasıyla ilgili bir pasaj; alıntılanan metin, kaynakların politikasına göre yaklaşık kırk kelimeyle özetlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Bayhaqi “Bukti Kenabian,” hlm. 964, yang menyebutkan jumlah amal baik, pencatatan amal baik, jumlah amal buruk, dan pencatatan amal buruk; dari salinan yang diambil, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
