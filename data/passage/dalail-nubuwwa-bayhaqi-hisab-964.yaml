text: "… ورقة ملك من الملائكة ، قال: وقال: فرضت عليّ خمسون صلاة، وقال. : لك بكل حسنة عشر إذا هممت بالحسنة فلم تعملها كتبت لك حسنة ، فإذا عملتها كتبت لك عشراً وإذا هممت بالسيئة فلم تعملها لم يكتب عليك شيء …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، ص 964، يذكر عدد الحسنات، وكتابة الحسنات، وعدد السيئات، وكتابة السيئات؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, p. 964, that speaks of a stated number of good deeds, the writing of good deeds, a stated number of bad deeds, the writing of bad deeds; from the extracted copy, quoted within forty words per the sources policy."
  ur: "دلائل النبوۃ، بیہقی کے صفحہ 964 کا اقتباس جس میں نیکیوں کی مقررہ تعداد، نیکیوں کا لکھا جانا، برائیوں کی تعداد، برائیوں کا لکھا جانا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
