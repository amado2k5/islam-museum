text: "… اجماع يلزم الحجة بمثله على أن ذلك غير فرض وإلا فهو فرض على الذاكر والسامع وفرضها في التشهد الأول عند ذكره على وجهين أحدهما : أن يكون واجب لأجل ذكره لا لأجل الصلاة كما يجب على المسبوق ببعض الصلاة لأجل …"
summary:
  ar: "مقطع من شعب الإيمان للبيهقي، الجزء الثاني، ص 224، يرد فيه ذكر ما فُرض على الناس، والفرض، والواجب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Shu'ab al-Iman, vol. 2, p. 224, whose wording mentions what was made obligatory on people, the obligatory (fard), the obligatory (wajib), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شعب الایمان، بیہقی، جلد 2، ص 224 کا اقتباس جس میں جو لوگوں پر فرض کیا گیا، فرض، واجب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 224, dont le texte mentionne ce qui a été imposé aux gens, l'obligatoire (fard), l'obligatoire (wajib), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Shu'ab al-Iman, vol. 2 de al-Bayhaqi, p. 224, cuyo texto menciona lo que se impuso a la gente, lo obligatorio (fard), lo obligatorio (wajib), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Beyhakî'nin \"İman Dalları\" adlı eserinin 2. cildinin 224. sayfasından, insanların üzerine farz olan şeylerden, \"zorunluluk\" ve \"görev\" terimlerinden ve sorumlu kişiden beklenenlerden bahseden bir alıntı. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz fiiller, görevler, itaat eylemleri, tavsiye edilen fiiller, mekruh fiiller, haram fiiller ve küçük günahlar konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Al-Bayhaqi, \"Cabang-Cabang Iman,\" Jilid 2, halaman 224, yang menyebutkan apa yang wajib dilakukan oleh manusia, istilah \"kewajiban\" dan \"tugas,\" serta apa yang dituntut dari individu yang bertanggung jawab. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Kutipan ini disusun oleh peramban yang khusus untuk perbuatan wajib, tugas, perbuatan taat, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa-dosa kecil."
