summary:
  ar: "فتوى لمالك في باب ما جاء في النداء للصلاة: سُئل عن قوم حضور أرادوا أن يجمعوا المكتوبة فأرادوا أن يقيموا ولا يؤذنوا، فقال: ذلك مجزئ عنهم، وإنما يجب النداء في مساجد الجماعات التي تُجمع فيها الصلاة. ويذكر المحقق أن أبا مصعب رواه عن مالك. {cite:muwatta-maruf-1997 p.119}"
