text: "… الصَّلَوَاتِ وَالصَّلاةِ الوُسْطَى. ومَن قَدَّمَ الصلاةَ فى أول وقتها كان أوْلَي بالمحافظة عليها ممّن أخْرها عن أوّلِ الوقتِ. - وقد رأينا الناسَ فيما وَجَبَ عليهم وفيما تَطوَّعُوا بِهِ يُؤْمَرون بتعجيلِهِ إذا أمكَنَ، لما يَعْرِضُ للادميّين من الأشغال والنَّشْيَأَن والمِلَلِ، الذى …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 404، يرد فيه ذكر ما يجب على المكلف، والتطوع؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 404, whose wording mentions what is binding on the person addressed, the voluntary act (tatawwu'); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 404 کا اقتباس جس میں جو مکلف پر واجب ہے، تطوع ⁦(نفلی عمل)⁩ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 404, dont le texte mentionne ce qui s'impose à la personne responsable, l'acte volontaire (tatawwu') ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 404, cuyo texto menciona lo que obliga a la persona responsable, el acto voluntario (tatawwu'); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 404. sayfasından, sorumlu bir bireyin yükümlülükleri ve gönüllü ibadetlerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzenlenmemiştir. Bu metin, farz olan ibadetler, görevler, itaat gerektiren ibadetler, tavsiye edilen ibadetler, mekruh edilen ibadetler, haram olan ibadetler ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari risalah Al-Shafi'i, halaman 404, yang menyebutkan kewajiban individu yang bertanggung jawab dan ibadah sukarela; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
