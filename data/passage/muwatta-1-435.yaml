label: { ar: "الموطأ 435 — عثمان يسوي الحصباء بنعليه حتى يخبروه أن الصفوف قد استوت", en: "Muwatta 435" }
text: "استو في الصف. ثم كبر"
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب ما جاء في تسوية الصفوف: كان مع عثمان بن عفان فقامت الصلاة وهو يكلمه في أن يفرض له عطاءً، فلم يزل يكلمه وعثمان يسوي الحصباء بنعليه حتى جاءه رجال وكّلهم بتسوية الصفوف فأخبروه أنها قد استوت، فقال له: استو في الصف، ثم كبّر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
