label: { ar: "الموطأ 435 — عثمان يسوي الحصباء بنعليه حتى يخبروه أن الصفوف قد استوت", en: "Muwatta 435", es: "Muwatta 435", fr: "Muwatta 435", ur: "موطا 435", tr: "Al-Muwatta 435 — Osman, sıraların düzgün olduğu kendisine bildirilinceye kadar, taşlarını sandaletleriyle düzeltti.", id: "Al-Muwatta 435 — Uthman meratakan kerikil-kerikil itu dengan sandalnya hingga ia diberitahu bahwa barisannya sudah lurus." }
text: "استو في الصف. ثم كبر"
summary:
  ar: "أثر يرويه مالك عن عمه أبي سهيل بن مالك عن أبيه مالك بن أبي عامر، في باب ما جاء في تسوية الصفوف: كان مع عثمان بن عفان فقامت الصلاة وهو يكلمه في أن يفرض له عطاءً، فلم يزل يكلمه وعثمان يسوي الحصباء بنعليه حتى جاءه رجال وكّلهم بتسوية الصفوف فأخبروه أنها قد استوت، فقال له: استو في الصف، ثم كبّر. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد وعبد الرزاق. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
  tr: "Malik'in, amcası Ebu Suhayl ibn Malik'ten, o da babası Malik ibn Abi Amir'den rivayet ettiği, safları düzeltme bölümündeki bir rivayet şöyledir: Namaz başladığında Osman ibn Affan ile birlikteydi ve ona bir nafaka tahsis etmekten bahsediyordu. Osman, taşlarını sandaletleriyle düzeltirken Malik konuşmaya devam etti. Sonra safları düzeltmek için görevlendirdiği adamlar gelip safların zaten düzeltilmiş olduğunu bildirdiler. Bunun üzerine Malik ona, \"Safı düzelt\" dedi ve tekbir getirdi (Allahu Ekber). Editör, bu rivayetin Malik'ten Ebu Musab, Suveyd ve Abdül-Razzak tarafından nakledildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.224} {cite:muwatta-maruf-1997 s.225}"
  id: "Sebuah riwayat yang disampaikan oleh Malik, dari pamannya Abu Suhayl ibn Malik, dari ayahnya Malik ibn Abi Amir, dalam surah tentang meluruskan salat: Beliau bersama Utsman ibn Affan ketika salat dimulai, dan beliau berbicara kepadanya tentang pemberian uang saku. Beliau terus berbicara sementara Utsman meratakan kerikil dengan sandalnya sampai orang-orang yang ditunjuknya untuk meluruskan salat datang dan memberitahunya bahwa salat sudah lurus. Kemudian beliau berkata kepadanya: Luruskan salat, lalu beliau mengucapkan takbir (Allahu Akbar). Editor menyebutkan bahwa riwayat ini disampaikan dari Malik oleh Abu Musab, Suwaid, dan Abd al-Razzaq. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
