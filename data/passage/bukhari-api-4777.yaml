label: { ar: "صحيح البخاري 4777 — أطوار خلق الجنين", en: "Sahih al-Bukhari 4777 — the stages of the embryo", ur: "صحیح بخاری 4777 — جنین کے مراحل" }
text: "… وَلَدَتِ الْمَرْأَةُ رَبَّتَهَا، فَذَاكَ مِنْ أَشْرَاطِهَا، وَإِذَا كَانَ الْحُفَاةُ الْعُرَاةُ رُءُوسَ النَّاسِ فَذَاكَ مِنْ أَشْرَاطِهَا فِي خَمْسٍ لا يَعْلَمُهُنَّ إِلاَّ اللَّهُ {إِنَّ اللَّهَ عِنْدَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ وَيَعْلَمُ مَا فِي الأَرْحَامِ} \". ثُمَّ انْصَرَفَ الرَّجُلُ فَقَالَ \" رُدُّوا عَلَىَّ \". فَأَخَذُوا لِيَرُدُّوا فَلَمْ يَرَوْا شَيْئًا. فَقَالَ \" هَذَا جِبْرِيلُ جَاءَ لِيُعَلِّمَ النَّاسَ دِينَهُمْ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 4777، يذكر أطوار خلق الجنين. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 4777 (Prophetic Commentary on the Qur'an (Tafseer of the Prophet (pbuh))), that mentions the stages of the embryo. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 4777، جس میں جنین کے مراحل کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
