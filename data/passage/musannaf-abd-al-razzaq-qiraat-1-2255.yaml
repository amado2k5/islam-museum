text: "… قال عطاءٌ : في العصفور نصف درهم. - عبد الرزاق عن عمرو بن قيس عن عطاءٍ أَن عثمان ابن عفان انطلق حاجاً، فأَغلق الباب على حمام، فوجدهن قد مُتْن، فقضى في كل حمامة شاة. - عبد الرزاق عن ابن مجاهد …"
