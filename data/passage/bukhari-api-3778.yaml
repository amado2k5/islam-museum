label: { ar: "صحيح البخاري 3778 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sahih al-Bukhari 3778 — mentions of non-Muslim nations, religions and peoples", ur: "صحیح بخاری 3778 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sahih al-Bukhari 3778 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sahih al-Bukhari 3778 — mentions de nations, religions et peuples non musulmans", tr: "Sahih el-Buhari 3778 — Gayrimüslim milletlerin, dinlerin ve halkların anılması", id: "Sahih al-Bukhari 3778 — Penyebutan bangsa, agama, dan kaum non-Muslim" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا شُعْبَةُ، عَنْ أَبِي التَّيَّاحِ، قَالَ سَمِعْتُ أَنَسًا ـ يَقُولُ قَالَتِ الأَنْصَارُ يَوْمَ فَتْحِ مَكَّةَ ـ وَأَعْطَى قُرَيْشًا ـ وَاللَّهِ إِنَّ هَذَا لَهُوَ الْعَجَبُ، إِنَّ سُيُوفَنَا تَقْطُرُ مِنْ دِمَاءِ قُرَيْشٍ، وَغَنَائِمُنَا تُرَدُّ عَلَيْهِمْ. فَبَلَغَ ذَلِكَ النَّبِيَّ فَدَعَا الأَنْصَارَ قَالَ فَقَالَ \" مَا الَّذِي بَلَغَنِي عَنْكُمْ \". وَكَانُوا لاَ يَكْذِبُونَ. فَقَالُوا هُوَ الَّذِي …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3778، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3778 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3778، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe del Sahih al-Bukhari, n.º 3778 (Méritos de los Ayudantes en Medina (Ansar)), con menciones a naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un récit du Sahih al-Bukhari, n° 3778 (Mérites des Compagnons de Médine (Ansar)), mentionne des nations, religions et peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
  tr: "Sahih el-Buhari'de 3778 numaralı hadis, gayrimüslim milletleri, dinleri ve halkları zikretmektedir. Bu hadis, gayrimüslim milletler, dinler, mezhepler ve halklar konusunda uzmanlaşmış bir araştırmacı tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan ilgili metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 3778, menyebutkan bangsa-bangsa, agama-agama, dan kaum-kaum non-Muslim. Hadits ini disusun oleh seorang peneliti yang ahli dalam bangsa-bangsa, agama-agama, sekte-sekte, dan kaum-kaum non-Muslim, bersama dengan teks-teks yang relevan dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
