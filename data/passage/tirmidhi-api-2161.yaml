label: { ar: "جامع الترمذي 2161 — الأب والأبوة", en: "Jami' al-Tirmidhi 2161 — the father and fatherhood", ur: "جامع ترمذی 2161 — باپ اور والدیت", es: "Jami' al-Tirmidhi 2161 — El padre y la paternidad" }
text: "… إِسْمَاعِيلَ عَنْ مُحَمَّدِ بْنِ يُوسُفَ عَنِ السَّائِبِ بْنِ يَزِيدَ قَالَ حَجَّ يَزِيدُ مَعَ النَّبِيِّ حَجَّةَ الْوَدَاعِ وَأَنَا ابْنُ سَبْعِ سِنِينَ. فَقَالَ عَلِيُّ بْنُ الْمَدِينِيِّ عَنْ يَحْيَى بْنِ سَعِيدٍ الْقَطَّانِ كَانَ مُحَمَّدُ بْنُ يُوسُفَ ثَبْتًا صَاحِبَ حَدِيثٍ وَكَانَ السَّائِبُ بْنُ يَزِيدَ جَدَّهُ وَكَانَ مُحَمَّدُ بْنُ يُوسُفَ يَقُولُ حَدَّثَنِي السَّائِبُ بْنُ يَزِيدَ وَهُوَ جَدِّي مِنْ قِبَلِ أُمِّي."
summary:
  ar: "حديث في جامع الترمذي، رقم 2161، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 2161 (Chapters On Al-Fitan), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 2161، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2161 (Capítulos sobre Al-Fitan), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
