text: "- بها يوم الفيامة وأقل الناس المتخصرون قال محمد بن كعب : فلما توفى عبد اللّٰه ابن أنيس أمر بها فوضعت على بطنه وكمن ودفن ودفنت معه. - عبد اللّه بن زيد الجهنى وذكر عبد الله بن زيد الجهف فى …"
