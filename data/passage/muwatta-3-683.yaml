label: { ar: "الموطأ 683 — مالك: لا تجب على وارث زكاة في دين أو عرض أو دار أو رقيق ورثه حتى يحول الحول على ثمنه من يوم باعه وقبضه", en: "Muwatta 683", es: "Muwatta 683", fr: "Muwatta 683", ur: "موطا 683", tr: "Al-Muwatta 683 — Malik: Bir mirasçının, miras yoluyla edindiği borç, mal, ev veya köleler için zekât yükümlülüğü, bunların satılıp gelirinin alındığı günden itibaren bir yıl geçmeden sona erer.", id: "Al-Muwatta 683 — Malik: Zakat tidak diwajibkan bagi ahli waris atas hutang, harta benda, rumah, atau budak yang diwariskan hingga setahun berlalu sejak tanggal ia menjualnya dan menerima hasilnya." }
summary:
  ar: "قول لمالك: السنة عندنا التي لا اختلاف فيها أنه لا تجب على وارث زكاة في مال ورثه في دين ولا عرض ولا دار ولا عبد ولا وليدة، حتى يحول الحول على ثمن ما باع من ذلك أو اقتضى، من يوم باعه وقبضه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
  tr: "Malik şöyle demiştir: Aramızda yerleşik olan ve üzerinde ihtilaf bulunmayan uygulama şudur: Bir mirasçı, miras yoluyla elde ettiği maldan, ister borç, ister mal, ister ev, ister köle, isterse de kadın köle olsun, satış veya paranın tahsil edildiği günden itibaren bir yıl geçmeden zekât ödemekle yükümlü değildir. Araştırmacı, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.343}"
  id: "Malik berkata: Kebiasaan yang telah mapan di antara kita, yang tidak ada perselisihan mengenainya, adalah bahwa ahli waris tidak diwajibkan membayar zakat atas harta warisan, baik itu utang, barang dagangan, rumah, budak, atau budak perempuan, sampai satu tahun berlalu sejak penjualan atau penerimaan hasil penjualan dan penerimaan uang tersebut. Peneliti menyebutkan bahwa Abu Mus'ab meriwayatkan hal ini dari Malik. {cite:muwatta-maruf-1997 p.343}"
