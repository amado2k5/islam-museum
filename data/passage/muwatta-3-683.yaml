summary:
  ar: "قول لمالك: السنة عندنا التي لا اختلاف فيها أنه لا تجب على وارث زكاة في مال ورثه في دين ولا عرض ولا دار ولا عبد ولا وليدة، حتى يحول الحول على ثمن ما باع من ذلك أو اقتضى، من يوم باعه وقبضه. ويذكر المحقق أنه رواه عن مالك أبو مصعب. {cite:muwatta-maruf-1997 p.343}"
