label: { ar: "الموطأ 1889 — مالك: الدقيق بالحنطة مثلا بمثل لا بأس به، لأنه أخلص الدقيق فباعه بالحنطة مثلا بمثل، ولو جعل نصف المد من دقيق ونصفه من حنطة فباعه بمد حنطة لم يصلح", en: "Muwatta 1889", es: "Muwatta 1889", fr: "Muwatta 1889", ur: "موطا 1889", tr: "El-Muvatta 1889 — Malik: Unu buğdayla birebir aynı miktarda satmak caizdir, çünkü unu arındırmış ve buğdayla birebir aynı miktarda satmıştır. Ancak, yarım mudd un ve yarım mudd buğdayı bir mudd buğdayla birebir aynı miktarda satarsa, bu caiz olmaz." }
summary:
  ar: "قال مالك: والدقيق بالحنطة مثلا بمثل، لا بأس به، وذلك لأنه أخلص الدقيق فباعه بالحنطة مثلا بمثل. ولو جعل نصف المد من دقيق، ونصفه من حنطة، فباع ذلك بمد من حنطة، كان ذلك مثل الذي وصفنا، لا يصلح؛ لأنه إنما أراد أن يأخذ فضل حنطته الجيدة، حين جعل معها الدقيق، فهذا لا يصلح. {cite:muwatta-maruf-1997 p.176}"
  tr: "Malik şöyle dedi: Unu buğdayla birebir aynı miktarda satmak caizdir, çünkü unu arındırmış ve buğdayla birebir aynı miktarda satmıştır. Ancak yarım mudd (kuru ölçü birimi) un ve yarım mudd buğdayı alıp bir mudd buğdayla satarsa, bu bizim tarif ettiğimiz gibi olur ve caiz değildir, çünkü unla karıştırırken sadece fazla olan iyi buğdayını almayı amaçlamıştır ve bu caiz değildir. {cite:muwatta-maruf-1997 s.176}"
  id: "Malik berkata: Menjual tepung terigu dengan perbandingan satu sama lain untuk gandum, adalah diperbolehkan, karena ia telah menyucikan tepung terigu tersebut dan menjualnya dengan perbandingan satu sama lain untuk gandum. Namun, jika ia mengambil setengah mudd (satuan ukuran kering) tepung terigu dan setengah mudd gandum, lalu menjualnya dengan perbandingan satu mudd gandum, maka itu akan sama seperti yang telah kami jelaskan, dan itu tidak diperbolehkan, karena ia hanya bermaksud mengambil kelebihan gandum yang baik ketika ia mencampurnya dengan tepung terigu, dan ini tidak diperbolehkan. {kutipan:muwatta-maruf-1997 hlm. 176}"
