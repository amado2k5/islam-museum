label: { ar: "مسلم 2785 — لا يزن عند الله جناح بعوضة", en: "Muslim 2785 — Weighing less than a gnat's wing" }
text: "قال أبو هريرة عن رسول الله: إنه ليأتي الرجل العظيم السمين يوم القيامة لا يزن عند الله جناح بعوضة، اقرءوا: «فلا نقيم لهم يوم القيامة وزناً»"
summary:
  ar: "رواية أبي هريرة في كتاب صفة القيامة والجنة والنار في صحيح مسلم؛ ثقل الإنسان الحقيقي عند الله لا في جسمه، مقروناً بقوله تعالى «فلا نقيم لهم يوم القيامة وزناً» (الكهف 105)."
