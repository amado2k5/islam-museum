label: { ar: "الموطأ 314 — عائشة: كان يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة", en: "Muwatta 314", es: "Muwatta 314", fr: "Muwatta 314", ur: "موطا 314", tr: "Al-Muwatta 314 — Aişe: Geceleyin on bir rekat namaz kılardı, bunun üzerine bir rekat vitir namazı kılardı.", id: "Al-Muwatta 314 — Aisyah: Beliau biasa shalat sebelas rakaat di malam hari, diakhiri dengan satu rakaat witr." }
text: "كان يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة، فإذا فرغ اضطجع على شقه الأيمن"
summary:
  ar: "أول حديث في باب صلاة النبي في الوتر. يرويه يحيى عن مالك عن ابن شهاب عن عروة بن الزبير عن عائشة: كان النبي يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة، فإذا فرغ اضطجع على شقه الأيمن. ويخرّجه المحقق عند مسلم (2/165) وأبي داود (1335) والترمذي (440–441) والنسائي (3/234) وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن أصحاب ابن شهاب جعلوا الاضطجاع بعد ركعتي الفجر لا بعد الوتر، وأن ما قاله مالك لا يُدفع لموضعه من الحفظ ⁦(التمهيد 8/121–122)⁩؛ ويرى المحقق أن اجتماع أصحاب الزهري على أن الاضطجاع بعد الفجر هو المحفوظ كما نص عليه ابن حجر، فتكون رواية مالك في هذا الحرف شاذة. {cite:muwatta-maruf-1997 p.176} {cite:muwatta-maruf-1997 p.177}"
  tr: "Peygamberimizin Vitr namazı bölümündeki ilk hadis. Yahya, Malik'ten, o da İbn Şihab'tan, o da Urve ibn el-Zübeyr'den, o da Aişe'den rivayet etmiştir: Peygamberimiz geceleri on bir rekat namaz kılardı ve bunu bir rekat Vitr namazı ile bitirirdi. Namazı bitirdikten sonra sağ tarafına yatardı. Araştırmacı, bu hadisi Malik'in sahabelerinin rivayet zinciriyle Müslim (2/165), Ebu Davud (1335), Tirmizi (440-441), Nesai (3/234), Ahmed ve Şafiî'nin hadis külliyatlarına dahil etmiştir. İbn Abdülberr'in, İbn Şihab'ın arkadaşlarının yatmayı Vitr'den sonra değil, Fecir'in iki rekatından sonraya yerleştirdiklerini ve Malik'in söylediğinin hadiste yerleşik konumu nedeniyle reddedilemeyeceğini söylediğini aktarıyor (el-Temhid 8/121-122). Araştırmacı, İbn Hacer'in belirttiği gibi, el-Zuhri'nin arkadaşlarının ittifakının yatmanın Fecir'den sonra olduğu yönünde olduğuna inanıyor ve bu nedenle Malik'in bu konudaki rivayetinin anormal olduğunu düşünüyor. {cite:muwatta-maruf-1997 s.176} {cite:muwatta-maruf-1997 s.177}"
  id: "Hadits pertama dalam bab ini adalah tentang salat Witir Nabi. Diriwayatkan oleh Yahya dari Malik, dari Ibnu Shihab, dari Urwah bin al-Zubayr, dari Aisyah: Nabi biasa salat sebelas rakaat di malam hari, diakhiri dengan satu rakaat salat Witir. Setelah selesai, beliau berbaring di sisi kanan. Peneliti memasukkannya dalam kumpulan hadits Muslim (2/165), Abu Dawud (1335), al-Tirmidhi (440-441), al-Nasa'i (3/234), Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik. Ia mengutip Ibnu Abd al-Barr yang mengatakan bahwa para sahabat Ibnu Shihab menempatkan sujud setelah dua rakaat Subuh, bukan setelah Witir, dan bahwa apa yang dikatakan Malik tidak dapat ditolak karena kedudukannya yang telah ditetapkan dalam hadits (al-Tamhid 8/121-122). Peneliti tersebut meyakini bahwa konsensus para sahabat al-Zuhri adalah bahwa sujud dilakukan setelah Subuh, sebagaimana dinyatakan oleh Ibnu Hajar, sehingga riwayat Malik mengenai hal ini menjadi anomali. {cite:muwatta-maruf-1997 p.176} {cite:muwatta-maruf-1997 p.177}"
