label: { ar: "الموطأ 314 — عائشة: كان يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة", en: "Muwatta 314" }
text: "كان يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة، فإذا فرغ اضطجع على شقه الأيمن"
summary:
  ar: "أول حديث في باب صلاة النبي في الوتر. يرويه يحيى عن مالك عن ابن شهاب عن عروة بن الزبير عن عائشة: كان النبي يصلي من الليل إحدى عشرة ركعة يوتر منها بواحدة، فإذا فرغ اضطجع على شقه الأيمن. ويخرّجه المحقق عند مسلم (2/165) وأبي داود (1335) والترمذي (440–441) والنسائي (3/234) وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن أصحاب ابن شهاب جعلوا الاضطجاع بعد ركعتي الفجر لا بعد الوتر، وأن ما قاله مالك لا يُدفع لموضعه من الحفظ (التمهيد 8/121–122)؛ ويرى المحقق أن اجتماع أصحاب الزهري على أن الاضطجاع بعد الفجر هو المحفوظ كما نص عليه ابن حجر، فتكون رواية مالك في هذا الحرف شاذة. {cite:muwatta-maruf-1997 p.176} {cite:muwatta-maruf-1997 p.177}"
