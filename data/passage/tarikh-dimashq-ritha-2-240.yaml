text: "… ابو محمد الوراق انشد لمبد المحسن الصورى الحسن بن على الاسدى شاعر قدم دمشق وحدث ومدح با ابا وهوى ضيعته فى سكن يرقد الليل ويستعذبه زارنى منه خيال ما له وطافوا به حول البيت ثم دفن وقال بعضهم يرثيه آليت …"
summary:
  ar: "مقطع من تاريخ مدينة دمشق، المجلد المصوَّر 2، ص 240، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
