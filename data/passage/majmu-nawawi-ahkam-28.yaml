text: "… يأمر بالمكروه والجواب عن قياسهم على الوقوف وغيره أن الطهارة ليست واجبة فى غير الطواف من أركان الحج فلم تكن شرحنا، بخلاف الطواف فانهم سنموا وجوبها فيه على الراجح عندهم، واللّه أعلم • فرع فى مذاهبهم فى النية فى طواف …"
summary:
  ar: "مقطع من المجموع للنووي، ص 28، يرد فيه ذكر الواجب، والوجوب، وما ليس بواجب، والمكروه؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's al-Majmu', p. 28, whose wording mentions the obligatory (wajib), obligation (wujub), what is said not to be obligatory, the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المجموع، نووی، ص 28 کا اقتباس جس میں واجب، وجوب، جو واجب نہیں، مکروہ کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Majmu' de al-Nawawi, p. 28, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui est dit non obligatoire, le réprouvé (makruh) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
