text: "… مَوْلِدِهِ \". فَقُلْنَا يَا رَسُولَ اللَّهِ أَلاَ نُخْبِرُ بِهَا النَّاسَ فَيَسْتَبْشِرُوا بِهَا فَقَالَ \" إِنَّ لِلْجَنَّةِ مِائَةَ دَرَجَةٍ بَيْنَ كُلِّ دَرَجَتَيْنِ كَمَا بَيْنَ السَّمَاءِ وَالأَرْضِ أَعَدَّهَا اللَّهُ لِلْمُجَاهِدِينَ فِي سَبِيلِهِ وَلَوْلاَ أَنْ أَشُقَّ عَلَى الْمُؤْمِنِينَ وَلاَ أَجِدُ مَا أَحْمِلُهُمْ عَلَيْهِ وَلاَ تَطِيبُ أَنْفُسُهُمْ أَنْ يَتَخَلَّفُوا بَعْدِي مَا قَعَدْتُ خَلْفَ سَرِيَّةٍ وَلَوَدِدْتُ أَنِّي أُقْتَلُ ثُمَّ أُحْيَا …"
summary:
  ar: "حديث في سنن النسائي، رقم 3132، يذكر رفع الدرجات. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3132 (The Book of Jihad), that speaks of ranks raised. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3132، جس میں درجات کی بلندی کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
