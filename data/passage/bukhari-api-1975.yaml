label: { ar: "صحيح البخاري 1975 — عدد الحسنات، مضاعفة الحسنة بعشر أمثالها", en: "Sahih al-Bukhari 1975 — a stated number of good deeds; the good deed multiplied tenfold and beyond", ur: "صحیح بخاری 1975 — نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا" }
text: "… عَلَيْكَ حَقًّا، وَإِنَّ لِزَوْرِكَ عَلَيْكَ حَقًّا، وَإِنَّ بِحَسْبِكَ أَنْ تَصُومَ كُلَّ شَهْرٍ ثَلاَثَةَ أَيَّامٍ، فَإِنَّ لَكَ بِكُلِّ حَسَنَةٍ عَشْرَ أَمْثَالِهَا، فَإِنَّ ذَلِكَ صِيَامُ الدَّهْرِ كُلِّهِ \". فَشَدَّدْتُ، فَشُدِّدَ عَلَىَّ، قُلْتُ يَا رَسُولَ اللَّهِ، إِنِّي أَجِدُ قُوَّةً. قَالَ \" فَصُمْ صِيَامَ نَبِيِّ اللَّهِ دَاوُدَ وَلاَ تَزِدْ عَلَيْهِ \". قُلْتُ وَمَا كَانَ صِيَامُ نَبِيِّ اللَّهِ دَاوُدَ ـ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 1975، يذكر عدد الحسنات، ومضاعفة الحسنة بعشر أمثالها. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sahih al-Bukhari, no. 1975 (Fasting), that speaks of a stated number of good deeds, the good deed multiplied tenfold and beyond. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "صحیح بخاری کی حدیث نمبر 1975، جس میں نیکیوں کی مقررہ تعداد، نیکی کا دس گنا اور اس سے زیادہ بڑھنا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
