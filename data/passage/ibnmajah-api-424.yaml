label: { ar: "سنن ابن ماجه 424 — الأب والأبوة", en: "Sunan Ibn Majah 424 — the father and fatherhood", ur: "سنن ابن ماجہ 424 — باپ اور والدیت", es: "Sunan Ibn Majah 424 — El padre y la paternidad" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ الْمُصَفَّى الْحِمْصِيُّ، حَدَّثَنَا بَقِيَّةُ، عَنْ مُحَمَّدِ بْنِ الْفَضْلِ، عَنْ أَبِيهِ، عَنْ سَالِمٍ، عَنِ ابْنِ عُمَرَ، قَالَ رَأَى رَسُولُ اللَّهِ ـ رَجُلاً يَتَوَضَّأُ فَقَالَ \" لاَ تُسْرِفْ لاَ تُسْرِفْ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 424، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 424 (The Book of Purification and its Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 424، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 424 (El Libro de la Purificación y su Sunnah), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
