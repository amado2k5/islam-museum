text: "… اللّٰه كما يَستحي الرجل ذو الهَيْئَة من أَهله . إذا أَسأُتَ فأحسن؛ إِنَّ الحَسَناتِ يُذْهِبْنَ السَّيِّئَاتِ ذَلِكَ ذِكْرَى لِلذَّاكِرِينَ ٢ . قال : فخرج الطُّفَيل سريماً إلى قومه ، فهَدَم ذا الكَفِّين ، وجعل يحشو النار فى جوفه ويقول : …"
summary:
  ar: "مقطع من كتاب المغازي للواقدي، ص 923، يذكر محو السيئات وحط الخطايا؛ من النسخة المستخرجة، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Waqidi's Kitab al-Maghazi, p. 923, that speaks of bad deeds erased and sins shed; from the extracted copy, quoted within forty words per the sources policy."
  ur: "کتاب المغازی للواقدی کے صفحہ 923 کا اقتباس جس میں برائیوں کا مٹنا کا ذکر ہے؛ نکالی گئی نقل سے، چالیس الفاظ کی حد میں۔"
