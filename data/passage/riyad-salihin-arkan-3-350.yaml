text: "… وَطَريقُ الجَمْعِ بَيْنَ الأَحَادِيثِ أنْ يُقَالَ : إِنْ كَانَ الْمَمْدُوحُ عِنْدَهُ كَمَالُ إِيمَانِ ويَقين، وَريَاضَةُ نَفْس، وَمَعْرفَةٌ تَامَّةٌ بحَيْثُ لا يَفْتَتنُ، وَلا يَغْتَرُّ بِذَلِكَ، وَلَا تَلْعَبُ بِه نَفْسُهُ، فَلَيْسٌ بِحَرَامٍ وَلا مَكْرُّوهِ، وإنَّ خِيفَ مَلَيْهِ شَيءٍ مَنْ هَذِهِ الأمُورِ كُرِهَ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 350، يذكر حلاوة الإيمان وكماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 350, that mentions the sweetness and completeness of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 350 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Riyad al-Salihin de al-Nawawi, volumen 3, pág. 350, que menciona la dulzura y la plenitud de la fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Riyad al-Salihin d'al-Nawawi, volume 3, page 350, évoquant la douceur et la plénitude de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Nevevi'nin Riyad es-Salihin adlı eserinin Resimli Cilt 3, sayfa 350'sinden, imanın tatlılığı ve mükemmelliğinden bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özellikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Riyad as-Salihin karya an-Nawawi, Jilid Bergambar 3, halaman 350, yang menyebutkan manisnya dan kesempurnaan iman; dari versi pindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
