label: { ar: "جامع الترمذي 2707 — ما أُحل، ما لا يحل", en: "Jami' al-Tirmidhi 2707 — what was made lawful; what is not lawful", ur: "جامع ترمذی 2707 — جو حلال کیا گیا، جو حلال نہیں", es: "Jami' al-Tirmidhi 2707 — lo que se ha hecho lícito; lo que no es lícito", fr: "Jami' al-Tirmidhi 2707 — ce qui a été rendu licite; ce qui ne l'est pas" }
text: "… \" مَنْ كَشَفَ سِتْرًا فَأَدْخَلَ بَصَرَهُ فِي الْبَيْتِ قَبْلَ أَنْ يُؤْذَنَ لَهُ فَرَأَى عَوْرَةَ أَهْلِهِ فَقَدْ أَتَى حَدًّا لاَ يَحِلُّ لَهُ أَنْ يَأْتِيَهُ لَوْ أَنَّهُ حِينَ أَدْخَلَ بَصَرَهُ اسْتَقْبَلَهُ رَجُلٌ فَفَقَأَ عَيْنَيْهِ مَا غَيَّرْتُ عَلَيْهِ وَإِنْ مَرَّ رَجُلٌ عَلَى بَابٍ لاَ سِتْرَ لَهُ غَيْرِ مُغْلَقٍ فَنَظَرَ فَلاَ خَطِيئَةَ عَلَيْهِ إِنَّمَا الْخَطِيئَةُ عَلَى أَهْلِ الْبَيْتِ \". …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2707، يذكر ما أُحل، وما لا يحل. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Jami' al-Tirmidhi, no. 2707 (Chapters on Seeking Permission), that mentions what was made lawful, what is not lawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "جامع ترمذی کی حدیث نمبر 2707، جس میں جو حلال کیا گیا، جو حلال نہیں کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe de Jami' al-Tirmidhi, n.º 2707 (Capítulos sobre la búsqueda de permiso), menciona lo que es lícito y lo que no lo es. El navegador Halal and Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y los Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Jami' al-Tirmidhi, n° 2707 (Chapitres sur la recherche de la permission), mentionne ce qui est licite et ce qui ne l'est pas. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant ce qui est licite et ce qui est illicite."
