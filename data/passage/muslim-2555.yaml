label: { ar: "مسلم 2555 — الرحم معلقة بالعرش تقول من وصلني وصله الله", en: "Muslim 2555 — The tie of kinship hangs from the Throne saying: who keeps me, God keeps him", es: "Muslim 2555 — El vínculo de parentesco cuelga del Trono diciendo: quien me protege, Dios lo protege.", fr: "Muslim 2555 — Le lien de parenté est suspendu au Trône, disant: celui qui me protège, Dieu le protège", ur: "مسلم 2555 - رشتہ داری کا رشتہ عرش سے لٹکا ہوا ہے کہتا ہے: جو مجھے رکھتا ہے، خدا اس کی حفاظت کرتا ہے", tr: "Müslim 2555 — Rahim Arş'a bağlıdır ve şöyle buyurmaktadır: \"Kim benimle bağ kurarsa, Allah da onunla bağ kurar.\"" }
text: "قال رسول الله: «الرحم معلقة بالعرش، تقول: من وصلني وصله الله، ومن قطعني قطعه الله»"
summary:
  ar: "رواية عائشة في باب صلة الرحم من صحيح مسلم؛ يجعل الرحم كلاماً معلقاً بالعرش يجازي الواصل والقاطع بمثل فعلهما."
  tr: "Sahih Müslim'de akrabalık bağlarını koruma bölümünde Aişe'nin rivayeti, akrabalığı Arş'tan asılı bir ifade olarak ele alır ve akrabalık bağlarını koruyanla koparanın aynı şekilde cezalandırılacağını belirtir."
