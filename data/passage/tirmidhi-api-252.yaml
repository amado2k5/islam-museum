text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا أَبُو الأَحْوَصِ، عَنْ سِمَاكِ بْنِ حَرْبٍ، عَنْ قَبِيصَةَ بْنِ هُلْبٍ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ يَؤُمُّنَا فَيَأْخُذُ شِمَالَهُ بِيَمِينِهِ. قَالَ وَفِي الْبَابِ عَنْ وَائِلِ بْنِ حُجْرٍ وَغُطَيْفِ بْنِ الْحَارِثِ وَابْنِ عَبَّاسٍ وَابْنِ مَسْعُودٍ وَسَهْلِ بْنِ سَعْدٍ. قَالَ أَبُو عِيسَى حَدِيثُ هُلْبٍ حَدِيثٌ حَسَنٌ. وَالْعَمَلُ عَلَى هَذَا عِنْدَ أَهْلِ الْعِلْمِ مِنْ أَصْحَابِ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 252، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 252 (The Book on Salat (Prayer)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 252، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
