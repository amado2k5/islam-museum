text: |-
  *(باب الواو والياه
  ٤٨٧/
  يديم النظر الى النساء الحسان والرناء بالضم والمدالصوت والرنابالفحح مقصور الذى المنفاور
  اليه وقولهم يا ابن ترناكناية عن اللميم قال صخر الغىّ
  فات ابن ترنا اذازرتكم • يدافع عنى قولا عنيفا
  ⁦( وى)⁩ الاروية الأتى من الوعول وبهاسميت المرأة وهى أفعولة فى الاصل الاأنه-م
  قلبوا الواوالثانيسة باء وأدخموها فى التى بعدهاد كسروا الأولى لتسلم الياءوثلاث أراوىّ
  عسلى أفاعيل وقد يخفف فيقال ثلاث أراوفاذا كثرت فهى الاروى على أفعل يغسير قياس
  وأروى أيضا اسم امرأة والريان ضد العطشان والمرأة ريا ولم يبدل من الياء واولا نماصفة
  واغمايبدلون الياه فى فعلى اذاكانت اسما والياء سوضع اللام كوللن شروى هذا
  الثوب واغمماهى من شريت وتقوى وانماهى من التقية وان كانت صفة تركوها على أصلها
  فالوا امرأة خزيا ورياولو كانت ريا اسمالسكانت روّى لانك كنت تبسدل الالف واواموضع
  اللام وتترك الوا والتى هى عين فعلى على الاصل وقول أبى النجم * واهالرياثم واهاواها
  انما أخرجه على الصفة وريان اسم جبل يبلادبنى عامر قال لبيد
  قدافع الريان عزى رسمها * خلقا كماضمن الوحى سلامها
  ولنا قبلك روية أى حاجة والروية أيضا التفكر فى الامر حرت فى كلامهم غيرمهموزة والروية
  أيضا البقية من الدين ونحوه والرواء بالكسر والمدّحبل يشدبه المتاع على البعيروالمع الاروية
  يقال رويته على الرحل اذاشددته على ظهر البعير الملايسقط من غلبة النوم قال الراجز
  نى على ما كان من تخددى * ودقة فى عظم ساقى ويدى• أروى على ذى العكن الضففدد
  ورويت على أهلى ولا هلى اذا أتيتهم بالماء يقال من أين ريتكم مفتوحة الراء أبى من أين ترتوون
  الماءورويت من المعاء بالكسر أروى رياوريا وروى أيضامثل رضيت رضا وارتويت وترقيت
  كاء بمعنى ورويت الحديث والشعررواية فأنارا وفى الماء والشهر والحسديث من قوم رواة
  قال ابن أحر تروى لقى ألقى فى صفصف * تصهره الشمس فايتسهر
  قال بعقوب وروبت القوم أرويهم ريااذا استقيت اهم الماءورقيته الشعر تزوية أى حلته على
  روايته وأرويته أيضاوسمى يوم التروية لانهم كانوا يرتوون فيه من الما لما بعدورويت فى الامر
  اذا نظرت فيه وفكرت يهمزولايه مز وتقول أنشد القصيدة ياهذا ولا تقل اروها الا أن
  تأمره بروايتهما أى باستظهارها والراية العلم والراوية البعيرأ والبغل أو الججار الذى يستقى
  عليه والعامّة تسمى المزادة راوية وذلك جائز على الاستعارة والاصل ماذ كرناه . قال أبو النجم
  تمشى من الردة مشى الحفل • مشى الروايا بالمزاد الاثقل
  وماءرواء بالفتح مدود أى عذب قال الراجز
  يا ابلى ماذ أمه فتأبيه • ماءرواء ونصى حوليه
  واذا كسرت الراءقصرته وكنبته بالياء وقلت ماءروى ويقال هو الذى فيه للواردة رىّ
  ورجل له رواء بالضم أى منظر ورجل راوية للشعر والهاء للمبالغة وقوم رواء من الماه
  بالكسر والمد قال حمرين بماء التيمى
  تمشى الى رواء عاطناتها • تحبس العانس فى ربطاتها
