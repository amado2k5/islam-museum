text: "… حدث بد مشق روى عنه الوليد بن مسلم وقال سمعت الملاء بن الزبير الكلابى يحدث عن ابيه انه قال رأيت غلبة فارس الروم ثم رأيت غلبة الروم فارسا ثم رأيت غلبة المسلمين فارساً والروم كل ذلك فى مدة خمة عشر …"
summary:
  ar: "مقطع من تاريخ دمشق لابن عساكر، المجلد المصوَّر 1، ص 62، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
