text: "عك، قال: فسار الحسن إلى عبد الملك بن مروان، فرحب به ووصله، وكتب له كتابا إلى الحجاج لا يجاوزه. زائدة، عن عبد الملك بن حمير، قال: حدثني أبو مصب أن عبد الملك بن مروان كتب إلى هشام بن إسماعيل متولي"
