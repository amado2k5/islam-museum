label: { ar: "الموطأ 1672 — أبو الزناد عن سليمان بن يسار: نفيع مكاتب أم سلمة كانت تحته حرة فطلقها اثنتين، فأمره أزواج النبي أن يأتي عثمان، فقالا حرمت عليك", en: "Muwatta 1672" }
text: "حَرُمَتْ عَليْكَ"
summary:
  ar: "يروي مالك عن أبي الزناد عن سليمان بن يسار أن نفيعا، مكاتبا كان لأم سلمة زوج النبي، أو عبدا لها، كانت تحته امرأة حرة، فطلقها اثنتين، ثم أراد أن يراجعها، فأمره أزواج النبي أن يأتي عثمان بن عفان فيسأله عن ذلك، فلقيه عند الدرج آخذا بيد زيد بن ثابت، فسألهما، فابتدراه جميعا، فقالا حرمت عليك، حرمت عليك. {cite:muwatta-maruf-1997 p.86}"
