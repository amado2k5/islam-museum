label: { ar: "الموطأ 1672 — أبو الزناد عن سليمان بن يسار: نفيع مكاتب أم سلمة كانت تحته حرة فطلقها اثنتين، فأمره أزواج النبي أن يأتي عثمان، فقالا حرمت عليك", en: "Muwatta 1672", es: "Muwatta 1672", fr: "Muwatta 1672", ur: "موطا 1672", tr: "El-Muvatta 1672 — Ebu el-Zinad, Süleyman ibn Yasar'dan rivayetle: Nafi', Ümmü Seleme'nin azatlı kölesiydi ve ondan iki kez boşandı. Peygamberin eşleri ona Osman'a gitmesini emrettiler ve \"O sana haramdır\" dediler.", id: "Al-Muwatta 1672 — Abu al-Zinad berdasarkan riwayat Sulayman ibn Yasar: Nafi’ adalah seorang budak yang dibebaskan oleh Umm Salamah, dan ia menceraikannya dua kali. Istri-istri Nabi memerintahkannya untuk pergi kepada Uthman, dan mereka berkata, “Dia haram bagimu.”" }
text: "حَرُمَتْ عَليْكَ"
summary:
  ar: "يروي مالك عن أبي الزناد عن سليمان بن يسار أن نفيعا، مكاتبا كان لأم سلمة زوج النبي، أو عبدا لها، كانت تحته امرأة حرة، فطلقها اثنتين، ثم أراد أن يراجعها، فأمره أزواج النبي أن يأتي عثمان بن عفان فيسأله عن ذلك، فلقيه عند الدرج آخذا بيد زيد بن ثابت، فسألهما، فابتدراه جميعا، فقالا حرمت عليك، حرمت عليك. {cite:muwatta-maruf-1997 p.86}"
  tr: "Malik, Ebu el-Zinad'dan, o da Süleyman ibn Yasar'dan rivayet eder ki, Peygamberin eşi Ümmü Seleme'nin kölesi veya onun bir kölesi olan Nafi', himayesinde hür bir kadın bulunduruyordu. Onu iki kez boşadı, sonra geri almak istedi. Peygamberin eşleri ona Osman ibn Affan'a gidip bu konuda ona sormasını söylediler. Merdivenlerde Zeyd ibn Sabit'in elini tutarak onunla karşılaştı ve ikisine de sordu. İkisi de ona doğru koşarak, \"O sana haramdır, o sana haramdır\" dediler. {cite:muwatta-maruf-1997 s.86}"
  id: "Malik meriwayatkan dari Abu al-Zinad, dari Sulayman ibn Yasar, bahwa Nafi', seorang budak Umm Salamah, istri Nabi, atau budaknya, memiliki seorang wanita merdeka di bawah pengawasannya. Dia menceraikannya dua kali, kemudian ingin mengambilnya kembali. Istri-istri Nabi menyuruhnya pergi ke Uthman ibn Affan dan menanyakan hal itu kepadanya. Dia menemuinya di tangga, sambil memegang tangan Zayd ibn Thabit, dan menanyakan kepada mereka berdua. Mereka berdua bergegas menghampirinya dan berkata, \"Dia haram bagimu, dia haram bagimu.\" {cite:muwatta-maruf-1997 p.86}"
