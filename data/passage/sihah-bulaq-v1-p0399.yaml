text: |-
  ٢٤٢:
  ولد يعده والشانى طريد الاول وطردت القوم اذا أتقيت عليه-م وجزته-م والطردبالتحريك
  مزاولة الصيد والطريدة ماطردت من صيد وغيره والطريدة الوسيقة وهو ما يسرق من
  الابل والطريدة قصبة فيهاحزة توضع على المغازل والقداح فتبرى بها قال الشماخ
  أقام الثقاف والطريدة درأها • كماقومت ضغن الشعوس المهامز
  والطر يدالمرجون ومطاردة الاقران فى الحرب حل بضهم على بعض يقال ه-م فرسان
  الطراد وقد استطر دله وذلك ضرب من المكيدة واطردالشئتبع بعضه بعضا وجرى تقول
  اطرد الامر اذا استقام والانهارتطرد أى تجرى وقول الشاعريصف الغرس
  وكأن مطرد النسيم اذاجوى • بعد الكلال خلينازنيور
  يعوبه الانف والمطرد بالكسررخ قصير يطعر به الوحش (طود الطود الجبل
  العظيم ويقال طوّد فى الجبسال مشل طوّف وطوّح والمطاودمثال المطاوح قال ذوالرمة
  أخوشقة جاب الفلاة بنفه • على الهول-تى اوحته المطاود
  صل المين بد العبد خلاف الحتر والجمع عبيد مثل كاب وكايب وهوجع
  عزيز وأعبدوعباد وعبدان بالضم مثل تمروتران وعبدان بالكسر مثسل بعمشان وعبدان
  مشقدة الدال وعبقاعمد ويقصر ومعبوداء بالمد وحكى الاخفس عبدمشل سقف
  وستف وأنشد
  انسب العبد الى آبائه • أسود الجلدة من قوم عبد
  قال ومنه قرأبعضهم وعبد الطاغوت وأضافه قال وبعضه-م قرأ وعبد الطاغوت وأضافه
  والمعنى فيما يقال خدم الطاغوت قال وليس هذابجمع لان فعلا لا يجمع على فعل وانما
  هواسم يبنى على فع-ل مثل حذروندس فيكون المعنى خادم الطاغوت وأماقول الشاءر
  أوس بن جر
  أبى لبيى ان أمكمو • أمة وان ابا كوعبد
  فان الفراء بقول اغاضم الباءضرورة لان القصيدة من الكامل وهى حذاه تقول عب-دبين
  العبودة والعبودية وأصل العبودية الخضوع والذل والتعبيد التذليل يقال طريق معبد
  والبعير المعبد المهنو• بالقعاران المذال والمعبدة السفينة المقيرة قال بشرف سفينة ركبها
  معبدة السقائف ذات دسر * مضبرة جوانبهارداح
  والتعبيد الاستعباد وهوأن يتخذه عبدا وكذلك الاعتباد وفى الحديث ورحل
  اعتبد محررا والاعبادمثله قال الشاءر
  علام يعبدنى قومى ود كثرت فيهم • أباعرماشاؤا وعبدان
  وكذلك التعبد وقال الشاءر
  تعبدتى غرين سعد وقد أرى • وغربن سعدلى مطيع ومهمع
  والعبادة الطاعة والتعبد التنسك والتعبيد من قواهم ماعبد أن فعل ذاكأى مالبث وحكى
  ابر السكيت أعبد بخلان بمعدف أبدع بداذا كات راحلمته أو عطبت أبوزيدالعبد بالتصريك
  الغضب والانف والاسم العبدة مثل الانفة وقد عبد أى أنف قال الفرزدق
  أولتك أحلاسى فجتنى بمثلهم • وأعبد أن أهجوكليدا بدارم
  قال
