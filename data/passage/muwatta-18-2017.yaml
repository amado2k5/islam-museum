label: { ar: "الموطأ 2017 — مالك: فيمن دفع مالا قراضا، وشرط عليه شيئا من الربح خالصا دون صاحبه: فإن ذلك لا يصلح وإن كان درهما واحدا، إلا أن يشترط نصف الربح له ونصفه لصاحبه، أو ثلثه، أو ربعه، فإن كل ما سمي من ذلك حلال", en: "Muwatta 2017" }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، وشرط عليه فيه شيئا من الربح خالصا دون صاحبه، فإن ذلك لا يصلح، وإن كان درهما واحدا. إلا أن يشترط نصف الربح له، ونصفه لصاحبه، أو ثلثه، أو ربعه، أو أقل من ذلك أو أكثر. فإذا سمى شيئا من ذلك قليلا أو كثيرا، فإن كل شيء سمي من ذلك حلال، وهو قراض المسلمين. ولكن إن اشترط أن له من الربح درهما واحدا فما فوقه، خالصا له دون صاحبه، وما بقي من الربح فهو بينهما نصفين، فإن ذلك لا يصلح، وليس على ذلك قراض المسلمين. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
