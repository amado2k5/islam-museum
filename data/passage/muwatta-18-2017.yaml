label: { ar: "الموطأ 2017 — مالك: فيمن دفع مالا قراضا، وشرط عليه شيئا من الربح خالصا دون صاحبه: فإن ذلك لا يصلح وإن كان درهما واحدا، إلا أن يشترط نصف الربح له ونصفه لصاحبه، أو ثلثه، أو ربعه، فإن كل ما سمي من ذلك حلال", en: "Muwatta 2017", es: "Muwatta 2017", fr: "Muwatta 2017", ur: "موطا 2017", tr: "El-Muvatta 2017 — Malik: Kâr paylaşımı (kırad) için para veren ve kârın sadece kendisine ait olmasını, ortağının ise pay almamasını şart koşan kimse hakkında: Bu, bir dirhem bile olsa caiz değildir; ancak kârın yarısının kendisine, yarısının ortağına, üçte birinin veya dörtte birinin de kendisine kalmasını şart koşarsa caiz olur. Bu şekilde şart koşulan her şey caizdir.", id: "Al-Muwatta 2017 — Malik: Mengenai seseorang yang memberikan uang untuk perjanjian bagi hasil (qirad), dan menetapkan bahwa ia menerima bagian keuntungan secara eksklusif, tidak termasuk rekannya: ini tidak diperbolehkan, meskipun hanya satu dirham, kecuali jika ia menetapkan bahwa setengah keuntungan diberikan kepadanya dan setengahnya lagi kepada rekannya, atau sepertiga, atau seperempat. Apa pun yang ditetapkan dengan cara ini adalah diperbolehkan." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، وشرط عليه فيه شيئا من الربح خالصا دون صاحبه، فإن ذلك لا يصلح، وإن كان درهما واحدا. إلا أن يشترط نصف الربح له، ونصفه لصاحبه، أو ثلثه، أو ربعه، أو أقل من ذلك أو أكثر. فإذا سمى شيئا من ذلك قليلا أو كثيرا، فإن كل شيء سمي من ذلك حلال، وهو قراض المسلمين. ولكن إن اشترط أن له من الربح درهما واحدا فما فوقه، خالصا له دون صاحبه، وما بقي من الربح فهو بينهما نصفين، فإن ذلك لا يصلح، وليس على ذلك قراض المسلمين. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
  tr: "Malik, bir adamın bir başkasına kâr paylaşımı (kırad) için para verip, ortağı hariç sadece kendisinin kâr payı almasını şart koşması durumunda, bu durumun, bir dirhem bile olsa, caiz olmadığını söylemiştir. Ancak, kârın yarısının kendisine, yarısının da ortağına, ya da üçte birinin, dörtte birinin veya daha azının ya da daha fazlasının kendisine kalmasını şart koşarsa, o zaman belirlediği pay, ister küçük ister büyük olsun, caizdir ve bu, Müslümanlar için geçerli bir kırad anlaşması olarak kabul edilir. Fakat eğer bir dirhem veya daha fazlasını ortağı hariç sadece kendisinin almasını ve kalan kısmın aralarında eşit olarak paylaşılmasını şart koşarsa, bu caiz değildir ve Müslümanlar için geçerli bir kırad anlaşması olarak kabul edilmez. {cite:muwatta-maruf-1997 s.224} {cite:muwatta-maruf-1997 s.225}"
  id: "Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil (qirad), dengan ketentuan bahwa ia menerima bagian keuntungan secara eksklusif, tidak termasuk rekannya, bahwa hal ini tidak diperbolehkan, meskipun hanya satu dirham. Namun, jika ia menetapkan bahwa setengah keuntungan diberikan kepadanya dan setengahnya kepada rekannya, atau sepertiga, seperempat, atau kurang atau lebih dari itu, maka apa pun yang ia tentukan, baik bagian kecil maupun besar, diperbolehkan, dan ini dianggap sebagai perjanjian qirad yang sah bagi umat Islam. Tetapi jika ia menetapkan bahwa ia menerima satu dirham atau lebih dari keuntungan secara eksklusif, tidak termasuk rekannya, dan sisanya dibagi rata di antara mereka, maka ini tidak diperbolehkan, dan ini tidak dianggap sebagai perjanjian qirad yang sah bagi umat Islam. {cite:muwatta-maruf-1997 p.224} {cite:muwatta-maruf-1997 p.225}"
