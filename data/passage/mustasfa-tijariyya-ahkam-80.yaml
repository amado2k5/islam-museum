text: "… بل هو كما لو أوجب الشرع الصلاة فقط، فمن أتى بها فقد أدى كلية ما أوجبه اللّٰه تعالى عليه بكماله. فاذا أوجب الصوم خرجت الصلاة عن كونها كلية الواجب لكن ليس هذا حكما مقصوداً فان قيل هو نسخ لوجوب الاقتصار …"
summary:
  ar: "مقطع من المستصفى للغزالي، طبعة التجارية، ص 80، يرد فيه ذكر الواجب، والوجوب، وما يجب على المكلف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, the Tijariyya printing, p. 80, whose wording mentions the obligatory (wajib), obligation (wujub), what is binding on the person addressed; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، طبع تجاریہ، ص 80 کا اقتباس جس میں واجب، وجوب، جو مکلف پر واجب ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 80, dont le texte mentionne l'obligatoire (wajib), l'obligation (wujub), ce qui s'impose à la personne responsable ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 80, cuyo texto menciona lo obligatorio (wajib), la obligatoriedad (wujub), lo que obliga a la persona responsable; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin ticari baskısından, 80. sayfadan bir alıntı; farz olan ameller, görevler ve sorumlu kişiden beklenenler konusunu ele almaktadır; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Edisi Komersial, hlm. 80, membahas tentang amalan wajib, kewajiban, dan apa yang dituntut dari orang yang bertanggung jawab; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
