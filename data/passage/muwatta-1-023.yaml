ref: "1.23"
label: { ar: "الموطأ 23 — يحيى بن سعيد: ما فاته من وقتها أعظم من أهله وماله، وأقوال مالك في الوقت", en: "Muwatta 23" }
text: "إن المصلي ليصلي الصلاة وما فاته وقتها، ولما فاته من وقتها أعظم أو أفضل من أهله وماله"
summary:
  ar: "قول موقوف على يحيى بن سعيد الأنصاري يرويه عنه مالك في باب جامع الوقوت: قد يصلي المصلي الصلاة في وقتها، ومع ذلك يكون ما فاته من أول الوقت أعظم عنده من أهله وماله. ويتبعه يحيى بن يحيى بأقوال لمالك: من أدركه الوقت في سفر وأخّر الصلاة ساهياً أو ناسياً حتى قدم على أهله، صلى صلاة المقيم إن قدم والوقت باقٍ، وصلاة المسافر إن قدم وقد ذهب الوقت، لأنه يقضي مثل الذي كان عليه، وأن هذا ما أدرك عليه أهل العلم بالمدينة؛ وأن الشفق هو الحمرة التي في المغرب، فإذا ذهبت وجبت العشاء وخرج وقت المغرب. وينقل المحقق عن ابن عبد البر أن هذا موقوف في الموطأ ويستحيل أن يكون رأياً، وأنه روي مرفوعاً بإسناد ليس بالقوي فيه يعقوب بن الوليد، وأن مالكاً لم يكن يعجبه قول يحيى هذا (التمهيد 24/75)، ويذكر أن عبارة «وهذا الأمر الذي أدركت عليه الناس» لم يروها أبو مصعب ولا سويد. {cite:muwatta-maruf-1997 p.44} {cite:muwatta-maruf-1997 p.45}"
  en: "Malik: the ruling for one who sleeps through a prayer or forgets it and then catches its time, whether travelling or resident — the reference point is the time he catches."
