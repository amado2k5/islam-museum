label: { ar: "الموطأ 23 — يحيى بن سعيد: ما فاته من وقتها أعظم من أهله وماله، وأقوال مالك في الوقت", en: "Muwatta 23", es: "Muwatta 23", fr: "Muwatta 23", ur: "موطا 23", tr: "El-Muvatta 23 — Yahya ibn Said: Onun o zamanın nimetlerinden mahrum kalması, ailesinden ve malından daha değerlidir ve Malik'in o zamana dair sözleri", id: "Al-Muwatta 23 — Yahya ibn Saeed: Apa yang ia lewatkan dari waktu itu lebih besar daripada keluarganya dan hartanya, dan perkataan Malik mengenai waktu" }
text: "إن المصلي ليصلي الصلاة وما فاته وقتها، ولما فاته من وقتها أعظم أو أفضل من أهله وماله"
summary:
  ar: "قول موقوف على يحيى بن سعيد الأنصاري يرويه عنه مالك في باب جامع الوقوت: قد يصلي المصلي الصلاة في وقتها، ومع ذلك يكون ما فاته من أول الوقت أعظم عنده من أهله وماله. ويتبعه يحيى بن يحيى بأقوال لمالك: من أدركه الوقت في سفر وأخّر الصلاة ساهياً أو ناسياً حتى قدم على أهله، صلى صلاة المقيم إن قدم والوقت باقٍ، وصلاة المسافر إن قدم وقد ذهب الوقت، لأنه يقضي مثل الذي كان عليه، وأن هذا ما أدرك عليه أهل العلم بالمدينة؛ وأن الشفق هو الحمرة التي في المغرب، فإذا ذهبت وجبت العشاء وخرج وقت المغرب. وينقل المحقق عن ابن عبد البر أن هذا موقوف في الموطأ ويستحيل أن يكون رأياً، وأنه روي مرفوعاً بإسناد ليس بالقوي فيه يعقوب بن الوليد، وأن مالكاً لم يكن يعجبه قول يحيى هذا ⁦(التمهيد 24/75)⁩، ويذكر أن عبارة «وهذا الأمر الذي أدركت عليه الناس» لم يروها أبو مصعب ولا سويد. {cite:muwatta-maruf-1997 p.44} {cite:muwatta-maruf-1997 p.45}"
  en: "Malik: the ruling for one who sleeps through a prayer or forgets it and then catches its time, whether travelling or resident — the reference point is the time he catches."
  es: "Malik: la norma para quien se queda dormido durante una oración o la olvida y luego la capta a tiempo, ya sea que esté de viaje o residiendo en el lugar, es que el punto de referencia es el momento en que la capta."
  fr: "Malik: la règle pour celui qui dort pendant une prière ou l’oublie et la rattrape ensuite à l’heure prévue, qu’il soit en voyage ou résident — le point de référence est l’heure à laquelle il rattrape le moment."
  ur: "مالک: اس کے لیے حکم ہے جو نماز پڑھ کر سو جائے یا بھول جائے اور پھر اس کا وقت پکڑے، خواہ سفر میں ہو یا مقیم۔"
  tr: "Malik'in \"Kapsamlı Vakit\" bölümünde naklettiği, Yahya ibn Sa'id el-Ensari'ye atfedilen bir ifade şöyledir: Bir kimse namazı vaktinde kılabilir, ancak vaktin başında kaçırdığı namaz, ailesinden ve malından daha önemlidir. Yahya ibn Yahya daha sonra Malik'ten şu ifadeleri ekler: Eğer namaz vakti yolculuk halindeyken gelirse ve namazı kasıtsız veya unutkanlıkla ailesinin yanına ulaşana kadar ertelerse, vaktin henüz müsait olduğu bir zamanda varırsa yerleşik namazı, vaktin geçmesinden sonra varırsa yolculuk namazını kılmalıdır; çünkü daha önce kaçırdığı namazı kaza etmektedir. Bunu Medine alimlerinin uyguladığını görmüştür. Alacakaranlık, gün batımındaki kızıllıktır; kaybolduğunda yatsı namazı farz olur ve akşam namazının vakti biter. Araştırmacı, İbn Abd el-Barr'ın bunun Muwatta'da bir Sahabe'ye atfedilen bir ifade olduğunu ve bir görüş olamayacağını söylediğini aktarmaktadır. Bu hadis, Ya'kub ibn el-Velid'i de içeren, sağlam olmayan bir isnad zinciriyle Peygamberimize kadar uzanan bir hadis olarak da rivayet edilmiştir. Malik, Yahya'nın ifadesini onaylamamıştır (el-Temhid 24/75). Ayrıca, \"İnsanların bunu uyguladığını gördüm\" ifadesinin Ebu Mus'ab veya Suveyd tarafından rivayet edilmediğini de belirtmektedir. {cite:muwatta-maruf-1997 s.44} {cite:muwatta-maruf-1997 s.45}"
  id: "Sebuah pernyataan yang dinisbahkan kepada Yahya ibn Sa'id al-Ansari, diriwayatkan oleh Malik dalam surah tentang Waktu yang Komprehensif: Seseorang mungkin melaksanakan salat tepat waktu, namun apa yang terlewatkan di awal waktu lebih penting baginya daripada keluarga dan hartanya. Yahya ibn Yahya kemudian menambahkan pernyataan dari Malik: Jika waktu salat tiba ketika ia sedang dalam perjalanan dan ia menunda salat tanpa sengaja atau karena lupa hingga sampai ke keluarganya, ia harus melaksanakan salat penduduk jika ia tiba saat waktu masih tersedia, dan salat musafir jika ia tiba setelah waktu berlalu, karena ia sedang mengganti salat yang terlewatkan seperti sebelumnya. Inilah yang ia temukan dipraktikkan oleh para ulama Madinah. Senja adalah kemerahan saat matahari terbenam; ketika menghilang, salat Isya menjadi wajib, dan waktu Maghrib berakhir. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa ini adalah pernyataan yang dinisbahkan kepada seorang Sahabat dalam Muwatta' dan tidak mungkin merupakan pendapat. Hadits ini juga diriwayatkan sebagai hadits yang ditelusuri kembali kepada Nabi dengan sanad yang tidak kuat, termasuk Ya'qub ibn al-Walid. Malik tidak menyetujui pernyataan Yahya (al-Tamhid 24/75). Ia juga menyebutkan bahwa ungkapan \"Inilah yang aku temukan dilakukan oleh orang-orang\" tidak diriwayatkan oleh Abu Mus'ab atau Suwayd. {cite:muwatta-maruf-1997 p.44} {cite:muwatta-maruf-1997 p.45}"
