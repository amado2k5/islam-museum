text: |-
  ٢١٦
  ⁦(باب الر١م)⁩
  ⁦(دبر )⁩
  ونحوهذا وبإخراء موضع بالبادية وبها قبر ابراهيم بن عبد اللّٰه بن الحسن بن الحسن بن على
  ابن أبى طالب رصى اللّٰه عنه ⁦(خنور )⁩ أم خنورع لى وزن التنور الضبع وأم خنور
  أيضا الداهية ( تير الخنجر سكير كبير وانلخصبور الناقة الغزيرة والجمع الحناجر
  ⁦( خور)⁩ اللخور منسل الغور المنحفض من الارضبين التشزين والخوران مجرى الروث
  و يقال طعنه فحاره خورا أى أصاب خورانه وخار التوريخور خواراصاح ومنه قوله
  تعالى فأخرج لهسم ججلا جسد الهخوار وخار الحر والرجل يخور خؤورة ضعف وانكسر
  والاستخارة الاستعطاف يقال هومن الخوار والصوت وأصلدان الصائد يأتى ولد الظبية
  فى كناسه فيعرك أذنه فيخور أى يصيح يستعطف بذلك أمه كى يصيدها قال الهذلى خالدين
  زهر
  لعلكً ا ما أم عرونبذات • والأخلي لاشانى يستخيرها
  ويضال أخرنا المطايا الى موضع كذا نخير(ااخارة صرفناها وعطفناها والحور بالتحريك
  الضعف رجل خوارورمح خوّار وأرض خوارة والجمع خور قال الشاعر جري
  بل أنت نزوة خوار على أمة • لا يسبق الحليات اللوم واندور
  وناقة خوارة أى غزيرة وابهع خور خير) الخيرضذ الشر تقول منهخرت بارجل
  فأنت شائر وخاراللّه لك قال الشاعر
  فساكتانة فى خير بخائرة • ولا كتانة فى شر بأشرار
  وقوله تعالى ان ترك خسيرا أى مالا والخيار خلاف الاشرار والخيار الاسم من الاختيار
  والحيار القشاء وليس بعربى ورجل خير وخيره شدد ومخفف وكذلك امرأة خيرة وخيرة قال
  اللّٰه تعالى أولئك لهم الخيرات بمع خيرة وهى الفاضلة من كل شى وقال تعالى في ن خيرات
  حسان قال الاخفش انه لما وصف به وقيل فلان خير أشبه الصفات فأدخلوافيه الهاه
  للمؤنث ولم يريدوابه افعل وأنندأ بو عبيدة لرحل من بى عدى تميم جاهليّ
  واقد طعنت مجامع الريلات • ربلات هندخيرة الملكات
  فان أردت معنى التفضيل قلت فلانة خير الناس ولم تقل خيرة وفلان خير الناس ولم تقل آخير
  لا يثق ولا يجمع لانه فى معنى أفعل وأماقول الشاعر سبرة بن عمر والاسدى يرنى عمروبن
  معودوخالدين نضلة .
  الابكر الناعى بخيرى بنى أسد • بعمروبن مسعود وبالسيد الصمد
  قائماثناه لانه أراد خيرى نقمففه مثل ميت وميت وهين وهين والخير بالكسر الكرم والخيرة
  الاسم من قولك خار اللّٰه لك فى هذا الاحر واظظيرة مثال العنبة الاسم من قولك اختاره اللّه
  يقال محمدخيرة اللّٰه م ن خلقه وخيرة اللّٰه أيضا بالتسكين والاختيار الاصطفاء وكذلك التغير
  وتسغير مختار مخير حذفت منه التاء لانها زائدة وأبدات من الالف الياء لانها أبدلت منها
  فى حال التكبير والاستفارة طلب الخيرة بقال استخرالله يخرلك وخيرته بين الشيئين أى
  فوضت اليه الخيار وانخيرى معترّب
  صل الدال بر الدبر بالفتح بماعة النهل قال الاصحى لا واحدلها
  ويجمع على دبور قال لبيد
  با-ض
