label: { ar: "الموطأ 412 — ابن عمر: رأيته يصلي على حمار وهو متوجه إلى خيبر", en: "Muwatta 412", es: "Muwatta 412", fr: "Muwatta 412", ur: "موطا 412", tr: "El-Muvatta 412 — İbn Ömer: Onu Hayber'e doğru giderken bir eşeğin üzerinde namaz kılarken gördüm.", id: "Al-Muwatta 412 — Ibn Umar: Aku melihat dia shalat di atas seekor keledai ketika dia sedang menuju Khaybar" }
text: "رأيت رسول الله يصلي وهو على حمار وهو متوجه إلى خيبر"
summary:
  ar: "يرويه مالك عن عمرو بن يحيى المازني عن أبي الحباب سعيد بن يسار عن عبد الله بن عمر، في باب صلاة النافلة في السفر: رأى النبي يصلي النافلة وهو على حمار متوجهاً إلى خيبر. ويبين المحقق أن قوله «على حمار» غلط من عمرو بن يحيى، والمعروف في صلاة النبي أنها على راحلته أو على البعير، وينقل عن النسائي أن عمراً لم يُتابع على ذلك، وعن الدارقطني في التتبع أن من روى أنه صلى على حمار فقد وهم والصواب أنه من فعل أنس؛ ثم يبين أن الإنكار على هذه العبارة في هذا الحديث خاصة وإلا فقد ثبت أنه صلى على حمار من حديث أنس في الصحيحين. ويخرّجه عند مسلم (2/149) وأبي داود (1226) والنسائي (2/60) وأحمد والشافعي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.215}"
  tr: "Malik, Amr ibn Yahya el-Mazini'den, o da Ebu el-Habab Sa'id ibn Yasar'dan, o da Abdullah ibn Umar'dan rivayet ederek, yolculuk halindeyken kılınan nazil namazlar bölümünde şöyle anlatmıştır: Peygamber'i Hayber'e doğru giderken eşeğe binmiş halde nazil namaz kılarken görmüştür. Araştırmacı, \"eşek üzerinde\" ifadesinin Amr ibn Yahya'nın bir hatası olduğunu, çünkü Peygamber'in binek hayvanı veya deve üzerinde namaz kıldığı bilindiğini açıklığa kavuşturmaktadır. El-Nasa'i'nin bu konuda Amr'a uymadığını, el-Daraqutni'nin ise \"el-Tatabbu'\" adlı kitabında, eşek üzerinde namaz kıldığını rivayet edenin yanıldığını ve doğru rivayetin Enes tarafından yapıldığını söylediğini aktarmaktadır. Daha sonra, bu ifadeye yönelik itirazın bu hadise özgü olduğunu, aksi takdirde iki Sahih hadiste Enes'in hadisinde de eşek üzerinde namaz kıldığı tespit edildiğini açıklamaktadır. Bu hadis, Malik'in sahabelerinin rivayet zincirleri aracılığıyla Müslim (2/149), Ebu Davud (1226), el-Nesai (2/60), Ahmed ve el-Şafiî'de de bulunmaktadır. {cite:muwatta-maruf-1997 s.215}"
  id: "Malik meriwayatkan hadits ini dari Amr ibn Yahya al-Mazini, dari Abu al-Habab Sa'id ibn Yasar, dari Abdullah ibn Umar, dalam surah tentang salat sunnah saat bepergian: Ia melihat Nabi mengerjakan salat sunnah sambil menunggang keledai, menuju Khaybar. Peneliti menjelaskan bahwa frasa \"di atas keledai\" adalah kesalahan Amr ibn Yahya, karena sudah diketahui bahwa Nabi mengerjakan salat di atas tunggangannya atau unta. Ia mengutip al-Nasa'i yang mengatakan bahwa Amr tidak diikuti dalam hal ini, dan al-Daraqutni dalam kitabnya \"al-Tatabbu'\" yang mengatakan bahwa siapa pun yang meriwayatkan bahwa beliau salat di atas keledai telah keliru, dan versi yang benar adalah yang dilakukan oleh Anas. Kemudian ia menjelaskan bahwa keberatan terhadap redaksi ini khusus untuk hadits ini, jika tidak, sudah ditetapkan bahwa beliau salat di atas keledai dalam hadits Anas di kedua kitab Sahih. Hal ini juga ditemukan dalam Muslim (2/149), Abu Dawud (1226), al-Nasa'i (2/60), Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.215}"
