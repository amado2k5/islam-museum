label: { ar: "الموطأ 412 — ابن عمر: رأيته يصلي على حمار وهو متوجه إلى خيبر", en: "Muwatta 412" }
text: "رأيت رسول الله يصلي وهو على حمار وهو متوجه إلى خيبر"
summary:
  ar: "يرويه مالك عن عمرو بن يحيى المازني عن أبي الحباب سعيد بن يسار عن عبد الله بن عمر، في باب صلاة النافلة في السفر: رأى النبي يصلي النافلة وهو على حمار متوجهاً إلى خيبر. ويبين المحقق أن قوله «على حمار» غلط من عمرو بن يحيى، والمعروف في صلاة النبي أنها على راحلته أو على البعير، وينقل عن النسائي أن عمراً لم يُتابع على ذلك، وعن الدارقطني في التتبع أن من روى أنه صلى على حمار فقد وهم والصواب أنه من فعل أنس؛ ثم يبين أن الإنكار على هذه العبارة في هذا الحديث خاصة وإلا فقد ثبت أنه صلى على حمار من حديث أنس في الصحيحين. ويخرّجه عند مسلم (2/149) وأبي داود (1226) والنسائي (2/60) وأحمد والشافعي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.215}"
