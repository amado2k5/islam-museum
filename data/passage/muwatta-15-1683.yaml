label: { ar: "الموطأ 1683 — نافع عن ابن عمر: طلق امرأته وهي حائض على عهد النبي، فأمره النبي أن يراجعها ثم يمسكها حتى تطهر ثم تحيض ثم تطهر، ثم إن شاء أمسك وإن شاء طلق قبل أن يمس", en: "Muwatta 1683" }
text: "مُرهُ فَلْيُراجِعْها"
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر طلق امرأته وهي حائض على عهد رسول الله، فسأل عمر بن الخطاب رسول الله عن ذلك، فقال مره فليراجعها، ثم يمسكها حتى تطهر، ثم تحيض، ثم تطهر، ثم إن شاء أمسك بعد، وإن شاء طلق قبل أن يمس، فتلك العدة التي أمر الله أن يطلق لها النساء. {cite:muwatta-maruf-1997 p.89}"
