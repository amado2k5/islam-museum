label: { ar: "الموطأ 1683 — نافع عن ابن عمر: طلق امرأته وهي حائض على عهد النبي، فأمره النبي أن يراجعها ثم يمسكها حتى تطهر ثم تحيض ثم تطهر، ثم إن شاء أمسك وإن شاء طلق قبل أن يمس", en: "Muwatta 1683", es: "Muwatta 1683", fr: "Muwatta 1683", ur: "موطا 1683", tr: "El-Muvatta 1683 — İbn Ömer'den rivayet edildiğine göre Nafi', Peygamberimiz zamanında karısını adetliyken boşadı. Peygamberimiz ona karısını geri almasını, temizlenene kadar yanında tutmasını, sonra tekrar adet görmesini ve tekrar temizlenmesini emretti. Daha sonra isterse onu yanında tutabileceğini, isterse de onunla cinsel ilişkiye girmeden önce boşayabileceğini söyledi.", id: "Al-Muwatta 1683 — Diriwayatkan oleh Nafi’ dari Ibnu Umar: Ia menceraikan istrinya ketika istrinya sedang haid pada zaman Nabi. Nabi memerintahkannya untuk mengambilnya kembali, kemudian merawatnya hingga ia suci, kemudian haid lagi, kemudian suci lagi. Kemudian, jika ia mau, ia dapat merawatnya, dan jika ia mau, ia dapat menceraikannya sebelum berhubungan intim dengannya." }
text: "مُرهُ فَلْيُراجِعْها"
summary:
  ar: "يروي مالك عن نافع أن عبد الله بن عمر طلق امرأته وهي حائض على عهد رسول الله، فسأل عمر بن الخطاب رسول الله عن ذلك، فقال مره فليراجعها، ثم يمسكها حتى تطهر، ثم تحيض، ثم تطهر، ثم إن شاء أمسك بعد، وإن شاء طلق قبل أن يمس، فتلك العدة التي أمر الله أن يطلق لها النساء. {cite:muwatta-maruf-1997 p.89}"
  tr: "Malik, Nafi'den rivayetle, Abdullah ibn Umar'ın, Allah Resulü zamanında, karısı adetliyken onu boşadığını anlatır. Ömer ibn el-Hattab bu konuda Allah Resulü'ne sordu ve Resulullah şöyle buyurdu: \"Ona söyle, onu geri alsın, sonra temizlenene kadar yanında tutsun, sonra tekrar adet görsün, sonra tekrar temizlensin. Sonra, dilerse ondan sonra da yanında tutabilir, dilerse de onunla cinsel ilişkiye girmeden önce boşayabilir. Bu, Allah'ın kadınlar için emrettiği bekleme süresidir.\" {cite:muwatta-maruf-1997 s.89}"
  id: "Malik meriwayatkan dari Nafi’ bahwa Abdullah ibn Umar menceraikan istrinya ketika istrinya sedang haid pada masa Rasulullah. Umar ibn al-Khattab bertanya kepada Rasulullah tentang hal ini, dan beliau bersabda, “Katakan padanya untuk mengambilnya kembali, kemudian mempertahankannya sampai ia suci, kemudian haid lagi, kemudian suci lagi. Kemudian, jika ia mau, ia boleh mempertahankannya setelah itu, dan jika ia mau, ia boleh menceraikannya sebelum berhubungan intim dengannya. Itulah masa iddah yang diperintahkan Allah kepada perempuan untuk diceraikan.” {cite:muwatta-maruf-1997 p.89}"
