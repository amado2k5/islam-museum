label: { ar: "الموطأ 403 — مالك: صلاة الأسير مثل صلاة المقيم إلا أن يكون مسافراً", en: "Muwatta 403", es: "Muwatta 403", fr: "Muwatta 403", ur: "موطا 403", tr: "El-Muvatta 403 — Malik: Bir mahkûmun namazı, yolcu olmadığı sürece, bir yurttaşın namazı gibidir.", id: "Al-Muwatta 403 — Malik: Shalat seorang tahanan sama seperti shalat seorang penduduk, kecuali jika ia seorang musafir." }
summary:
  ar: "فتوى لمالك في باب صلاة المسافر إذا أجمع مكثاً: سُئل عن صلاة الأسير فقال إنها مثل صلاة المقيم إلا أن يكون مسافراً. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.213}"
  tr: "Malik'in, kalmaya niyetli bir yolcunun namazı hakkındaki fetvası: Kendisine bir mahkumun namazı sorulduğunda, \"Bu namaz, yerleşik birinin namazı gibidir, ancak yolcudur\" demiştir. Araştırmacı, bu fetvanın Ebu Mus'ab ve Suveyd tarafından Malik'ten rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.213}"
  id: "Fatwa Malik mengenai salat seorang musafir yang berniat menetap: Beliau ditanya tentang salat seorang tahanan, dan beliau menjawab bahwa salat tahanan sama seperti salat penduduk, hanya saja ia adalah seorang musafir. Peneliti menyebutkan bahwa Abu Mus'ab dan Suwaid meriwayatkan fatwa ini dari Malik. {cite:muwatta-maruf-1997 p.213}"
