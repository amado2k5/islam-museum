label: { ar: "الموطأ 2410 — عائشة وغلام بني أبي بكر: البرد المسروق واللبد", en: "Muwatta 2410" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن عمرة بنت عبد الرحمن أن عائشة خرجت إلى مكة ومعها مولاتان لها وغلام لبني عبد الله بن أبي بكر، فبعثت مع المولاتين ببرد مرجل قد خيط عليه خرقة خضراء. فأخذ الغلام البرد ففتقه واستخرجه، وجعل مكانه لبدا أو فروة وخاطه. فلما قدمت المولاتان المدينة دفعتا ذلك إلى أهله، فوجدوا فيه اللبد ولم يجدوا البرد، فكلمتا عائشة واتهمتا العبد، فاعترف، فأمرت به عائشة فقطعت يده، وقالت: القطع في ربع دينار فصاعدا. {cite:muwatta-maruf-1997 p.395} {cite:muwatta-maruf-1997 p.396}"
