label: { ar: "الموطأ 2410 — عائشة وغلام بني أبي بكر: البرد المسروق واللبد", en: "Muwatta 2410", es: "Muwatta 2410", fr: "Muwatta 2410", ur: "موطا 2410", tr: "Al-Muwatta 2410 — Aişe ve Beni Ebu Bekir'in kölesi: Çalınan pelerin ve keçe", id: "Al-Muwatta 2410 — Aisyah dan budak Banu Abi Bakr: Jubah dan kain felt yang dicuri" }
summary:
  ar: "يروي مالك عن عبد الله بن أبي بكر بن حزم عن عمرة بنت عبد الرحمن أن عائشة خرجت إلى مكة ومعها مولاتان لها وغلام لبني عبد الله بن أبي بكر، فبعثت مع المولاتين ببرد مرجل قد خيط عليه خرقة خضراء. فأخذ الغلام البرد ففتقه واستخرجه، وجعل مكانه لبدا أو فروة وخاطه. فلما قدمت المولاتان المدينة دفعتا ذلك إلى أهله، فوجدوا فيه اللبد ولم يجدوا البرد، فكلمتا عائشة واتهمتا العبد، فاعترف، فأمرت به عائشة فقطعت يده، وقالت: القطع في ربع دينار فصاعدا. {cite:muwatta-maruf-1997 p.395} {cite:muwatta-maruf-1997 p.396}"
  tr: "Malik, Abdullah ibn Abi Bekr ibn Hazm'dan, Amrah bint Abdülrahman'dan rivayetle, Ayşe'nin iki hizmetçisi ve Abdullah ibn Abi Bekr'in oğullarına ait bir köleyle birlikte Mekke'ye gittiğini anlatır. İki hizmetçiyle birlikte üzerine yeşil bir kumaş dikilmiş güzel bir pelerin gönderdi. Köle pelerini aldı, yırttı, kumaşı çıkardı ve yerine keçe veya kürk koydu, sonra da dikti. İki hizmetçi Medine'ye vardıklarında pelerini sahiplerine verdiler. Sahipleri keçeyi buldular ama pelerini bulamadılar. Ayşe ile konuşup köleyi suçladılar ve köle itiraf etti. Ayşe, \"Hırsızlığın cezası çeyrek dinar veya daha fazlasıdır\" diyerek kölenin elinin kesilmesini emretti. {cite:muwatta-maruf-1997 s.395} {cite:muwatta-maruf-1997 s.396}"
  id: "Malik meriwayatkan dari Abdullah ibn Abi Bakr ibn Hazm, dari Amrah bint Abd al-Rahman, bahwa Aisyah pergi ke Mekah bersama dua pelayan wanitanya dan seorang budak milik putra-putra Abdullah ibn Abi Bakr. Ia mengirimkan bersama kedua pelayan itu sebuah jubah bagus dengan kain hijau yang dijahit di atasnya. Budak itu mengambil jubah tersebut, merobeknya, mengambil kainnya, dan menggantinya dengan kain felt atau bulu, lalu menjahitnya kembali. Ketika kedua pelayan itu tiba di Madinah, mereka mengembalikannya kepada pemiliknya, yang menemukan kain felt tetapi tidak menemukan jubahnya. Mereka berbicara kepada Aisyah dan menuduh budak itu, yang kemudian mengaku. Aisyah memerintahkan agar tangannya dipotong, seraya berkata, \"Hukuman untuk pencurian adalah seperempat dinar atau lebih.\" {cite:muwatta-maruf-1997 p.395} {cite:muwatta-maruf-1997 p.396}"
