label: { ar: "صحيح مسلم 5727 — الرقية", en: "Sahih Muslim 5727 — ruqya recited over the sick", ur: "صحیح مسلم 5727 — رقیہ", es: "Sahih Muslim 5727 — ruqya recitada sobre el enfermo", fr: "Sahih Muslim 5727 — Ruqya récitée sur les malades", tr: "Sahih Muslim 5727 — Rukye", id: "Sahih Muslim 5727 — Ruqyah" }
text: "… عُبَادَةَ، حَدَّثَنَا ابْنُ جُرَيْجٍ، أَخْبَرَنِي أَبُو الزُّبَيْرِ أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ أَرْخَصَ النَّبِيُّ فِي رُقْيَةِ الْحَيَّةِ لِبَنِي عَمْرٍو. قَالَ أَبُو الزُّبَيْرِ وَسَمِعْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ لَدَغَتْ رَجُلاً مِنَّا عَقْرَبٌ وَنَحْنُ جُلُوسٌ مَعَ رَسُولِ اللَّهِ. فَقَالَ رَجُلٌ يَا رَسُولَ اللَّهِ أَرْقِي قَالَ \" مَنِ اسْتَطَاعَ مِنْكُمْ أَنْ يَنْفَعَ أَخَاهُ فَلْيَفْعَلْ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5727، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 5727 (The Book of Greetings), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 5727، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.° 5727 (El Libro de los Saludos), menciona la ruqya recitada sobre los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih Muslim, n° 5727 (Livre des salutations), mentionne la récitation de la roqya sur les malades. Le dictionnaire en ligne Medicine Browser le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih Müslim'de 5727 numaralı hadis, rukyeden (Kur'an ayetleri ve dualarla yapılan İslami şifa) bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 5727, menyebutkan ruqyah (penyembuhan Islami melalui ayat-ayat Al-Quran dan doa). Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
