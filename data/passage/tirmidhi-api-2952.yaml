label: { ar: "جامع الترمذي 2952 — قراءات القرآن", en: "Jami' al-Tirmidhi 2952 — the readings of the Qur'an", ur: "جامع ترمذی 2952 — قرآن کی قراءتیں", es: "Jami' al-Tirmidhi 2952 — Las lecturas del Corán" }
text: "… عِلْمٍ. حَدَّثَنَا الْحُسَيْنُ بْنُ مَهْدِيٍّ الْبَصْرِيُّ، أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ قَتَادَةَ، قَالَ مَا فِي الْقُرْآنِ آيَةٌ إِلاَّ وَقَدْ سَمِعْتُ فِيهَا بِشَيْءٍ. حَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ بْنُ عُيَيْنَةَ، عَنِ الأَعْمَشِ، قَالَ قَالَ مُجَاهِدٌ لَوْ كُنْتُ قَرَأْتُ قِرَاءَةَ ابْنِ مَسْعُودٍ لَمْ أَحْتَجْ إِلَى أَنْ أَسْأَلَ ابْنَ عَبَّاسٍ عَنْ كَثِيرٍ مِنَ الْقُرْآنِ مِمَّا سَأَلْتُ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2952، يذكر قراءات القرآن. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Jami' al-Tirmidhi, no. 2952 (Chapters on Tafsir), that mentions the readings of the Qur'an. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "جامع ترمذی کی حدیث نمبر 2952، جس میں قرآن کی قراءتیں کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2952 (Capítulos sobre Tafsir), menciona las lecturas del Corán. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el tema."
