label: { ar: "الموطأ 283 — مالك فيمن ركع ركعة مع الإمام ثم رعف فخرج", en: "Muwatta 283", es: "Muwatta 283", fr: "Muwatta 283", ur: "موطا 283", id: "Al-Muwatta 283 — Malik tentang seseorang yang shalat satu rakaat bersama imam, kemudian mimisan dan pergi." }
summary:
  ar: "قول لمالك في باب ما جاء فيمن رعف يوم الجمعة: من ركع ركعة مع الإمام يوم الجمعة ثم رعف فخرج فعاد وقد صلى الإمام الركعتين كلتيهما، فإنه يبني بركعة أخرى ما لم يتكلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
  tr: "Malik, Cuma günü burnundan kanayan kimse hakkında rivayet edilenler bölümünde şöyle demiştir: Bir kimse Cuma günü imamla birlikte bir rekat namaz kılar, sonra burnundan kanar, ayrılır ve imam iki rekatı kıldıktan sonra geri dönerse, konuşmamış olması şartıyla namazı bir rekat daha ile tamamlamalıdır. Araştırmacı, bunun Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.162}"
  id: "Malik berkata dalam bab tentang apa yang diriwayatkan mengenai orang yang mimisan pada hari Jumat: Jika seseorang shalat satu rakaat bersama imam pada hari Jumat, kemudian mimisan, pergi, dan kembali setelah imam selesai shalat dua rakaat, maka ia harus menyelesaikan shalatnya dengan satu rakaat lagi, asalkan ia belum berbicara. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab dan Suwaid. {cite:muwatta-maruf-1997 p.162}"
