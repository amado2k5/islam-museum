summary:
  ar: "قول لمالك في باب ما جاء فيمن رعف يوم الجمعة: من ركع ركعة مع الإمام يوم الجمعة ثم رعف فخرج فعاد وقد صلى الإمام الركعتين كلتيهما، فإنه يبني بركعة أخرى ما لم يتكلم. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.162}"
