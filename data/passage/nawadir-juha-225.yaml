label: { ar: "نوادر جحا الكبرى، ص 103 — «اربطوه من أسفل»", en: "Nawadir Juha al-Kubra, p. 103 — 'Tie It from Below'", ur: "نوادر جحا الکبریٰ، ص 103 — «اسے نیچے سے باندھو»", fr: "Nawadir Juha al-Kubra, p. 103 — « Attachez-le par le bas »", es: "Nawadir Juha al-Kubra, p. 103 — «Átenlo desde abajo»" }
text: "… اربطوه من أسفل كان مسافراً بسفينة، فهبَّتِ الأنواءُ وتمزَّقَتِ القِلاع وأخذ البحارون يصعدون إلى الصواري يربطونها، فعندما رآهم كذلك قال لهم: لماذا تصعدون مرتفعين وعلَّةُ المركب في الأسفل، فاربطوهُ من أسفل حتى لا يهتزَّ! خذ منه وَأعطِ الخباز كان له …"
summary:
  ar: "في عاصفة تسلق البحارة الصواري ليثبتوها، فقال جحا أن يربطوا أسفل السفينة من تحت حتى لا تتأرجح. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  en: "In a storm sailors climb the masts to secure them, and Juha says they should tie the base of the ship from below so that it does not sway. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  ur: "طوفان میں ملاح مستول کو مضبوط کرنے کے لیے اس پر چڑھتے ہیں، تو جحا کہتا ہے کہ جہاز کا نچلا حصہ نیچے سے باندھ دو تاکہ وہ ڈگمگائے نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  fr: "Pendant une tempête, des marins grimpent aux mâts pour les assujettir, et Juha dit qu'il faut attacher la base du navire par le bas pour qu'il ne se balance pas. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
  es: "En una tormenta los marineros trepan a los mástiles para asegurarlos, y Juha dice que hay que atar la base del barco desde abajo para que no se balancee. {cite:juha-nawadir-kubra-djuwaydi p. 103}"
