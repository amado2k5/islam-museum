summary:
  ar: "القسم 7 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الزكاة عن رسول الله»، ويضم فيها النصوص من 617 إلى 681 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 7 of Jami' al-Tirmidhi (The Book on Zakat) in the division of the open hadith dataset the museum took its reports from: reports 617 to 681 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 7، عنوان «کتاب الزکاۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 617 تا 681۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 7 de Jami' al-Tirmidhi (El Libro del Zakat) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 617 al 681 según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 7 de Jami' al-Tirmidhi (Le Livre de la Zakat), qui comprend les hadiths 617 à 681 de la numérotation de ce recueil. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Cami' el-Tirmizi'nin 7. bölümü, \"Allah Resulü'nün rivayetine göre Zekat Kitabı\" başlığını taşımakta olup, 617'den 681'e kadar olan metinleri sırasıyla numaralandırmaktadır. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 7 dari Jami' al-Tirmidhi, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Zakat berdasarkan otoritas Rasulullah\" dan berisi teks 617 hingga 681, yang dinomori sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
