label: { ar: "الموطأ 629 — عيادة عبد الله بن ثابت: دعهن فإذا وجب فلا تبكين باكية؛ والشهداء سبعة سوى القتل في سبيل الله", en: "Muwatta 629" }
text: "الشهداء سبعة سوى القتل في سبيل الله: المطعون شهيد، والغرق شهيد، وصاحب ذات الجنب شهيد، والمبطون شهيد، والحرق شهيد، والذي يموت تحت الهدم شهيد، والمرأة تموت بجمع شهيد"
summary:
  ar: "أول حديث في باب النهي عن البكاء على الميت. يرويه مالك عن عبد الله بن عبد الله بن جابر بن عتيك عن عتيك بن الحارث بن عتيك، وهو جده أبو أمه، عن جابر بن عتيك، أن النبي جاء يعود عبد الله بن ثابت فوجده قد غُلب، فصاح به فلم يجبه، فاسترجع وقال: غُلبنا عليك يا أبا الربيع. فصاح النسوة وبكين، فجعل جابر يسكتهن، فقال النبي: دعهن، فإذا وجب فلا تبكين باكية. قالوا: وما الوجوب؟ قال: إذا مات. فقالت ابنته: والله إن كنت لأرجو أن تكون شهيداً فإنك كنت قد قضيت جهازك. فأخبر النبي أن الله أوقع أجره على قدر نيته، وسألهم ما يعدون الشهادة، فقالوا: القتل في سبيل الله، فعدّ الشهداء سبعة سوى القتل في سبيل الله: المطعون والغرق وصاحب ذات الجنب والمبطون والحرق والذي يموت تحت الهدم والمرأة تموت بجمع. ويذكر المحقق أن البغوي حكى عن الشافعي أن مالكاً صحّف في «جابر بن عتيك» وإنما هو جبر، وقال ابن قانع: الصواب جبر، ويرى المحقق أن توهيم مالك فيه نظر لأن جابر بن عتيك وجبر بن عتيك واحد كما بينه في تعليقه على تهذيب الكمال، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وروح بن عبادة عند أحمد (5/446)، والقعنبي عند أبي داود (3111) والحاكم (1/351)، وعتبة بن عبد الله عند النسائي (4/13)، والشافعي، ومحمد بن الحسن الشيباني (302). {cite:muwatta-maruf-1997 p.320} {cite:muwatta-maruf-1997 p.321}"
