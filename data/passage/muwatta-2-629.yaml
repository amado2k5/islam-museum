label: { ar: "الموطأ 629 — عيادة عبد الله بن ثابت: دعهن فإذا وجب فلا تبكين باكية؛ والشهداء سبعة سوى القتل في سبيل الله", en: "Muwatta 629", es: "Muwatta 629", fr: "Muwatta 629", ur: "موطا 629", tr: "El-Muvatta 629 — Abdullah bin Sabit'in kliniği: Onları kendi hallerine bırakın, gerekirse bir kadın ağlamasın; şehitler ise yedi kişidir, Allah yolunda öldürülenlerin dışında.", id: "Al-Muwatta 629 — Klinik Abdullah bin Thabit: Biarkanlah mereka, dan jika perlu, jangan biarkan seorang wanita menangis; dan para syuhada ada tujuh, selain mereka yang gugur di jalan Allah." }
text: "الشهداء سبعة سوى القتل في سبيل الله: المطعون شهيد، والغرق شهيد، وصاحب ذات الجنب شهيد، والمبطون شهيد، والحرق شهيد، والذي يموت تحت الهدم شهيد، والمرأة تموت بجمع شهيد"
summary:
  ar: "أول حديث في باب النهي عن البكاء على الميت. يرويه مالك عن عبد الله بن عبد الله بن جابر بن عتيك عن عتيك بن الحارث بن عتيك، وهو جده أبو أمه، عن جابر بن عتيك، أن النبي جاء يعود عبد الله بن ثابت فوجده قد غُلب، فصاح به فلم يجبه، فاسترجع وقال: غُلبنا عليك يا أبا الربيع. فصاح النسوة وبكين، فجعل جابر يسكتهن، فقال النبي: دعهن، فإذا وجب فلا تبكين باكية. قالوا: وما الوجوب؟ قال: إذا مات. فقالت ابنته: والله إن كنت لأرجو أن تكون شهيداً فإنك كنت قد قضيت جهازك. فأخبر النبي أن الله أوقع أجره على قدر نيته، وسألهم ما يعدون الشهادة، فقالوا: القتل في سبيل الله، فعدّ الشهداء سبعة سوى القتل في سبيل الله: المطعون والغرق وصاحب ذات الجنب والمبطون والحرق والذي يموت تحت الهدم والمرأة تموت بجمع. ويذكر المحقق أن البغوي حكى عن الشافعي أن مالكاً صحّف في «جابر بن عتيك» وإنما هو جبر، وقال ابن قانع: الصواب جبر، ويرى المحقق أن توهيم مالك فيه نظر لأن جابر بن عتيك وجبر بن عتيك واحد كما بينه في تعليقه على تهذيب الكمال، وأنه رواه عن مالك أبو مصعب ومن طريقه ابن حبان والبغوي، وروح بن عبادة عند أحمد (5/446)، والقعنبي عند أبي داود (3111) والحاكم (1/351)، وعتبة بن عبد الله عند النسائي (4/13)، والشافعي، ومحمد بن الحسن الشيباني (302). {cite:muwatta-maruf-1997 p.320} {cite:muwatta-maruf-1997 p.321}"
  tr: "Ölüler için ağlamanın yasaklanması bölümündeki ilk hadis. Malik, Abdullah ibn Abdullah ibn Cabir ibn Atik'ten, o da annesinin dedesi Atik ibn el-Haris ibn Atik'ten, o da Cabir ibn Atik'ten rivayet eder ki, Peygamberimiz Abdullah ibn Sabit'i ziyarete geldiğinde onu keder içinde buldu. Ona seslendi, ama cevap vermedi. Bunun üzerine \"İnna lillahi ve inna ilayhi raji'un\" (Allah'a aitiz ve O'na döneceğiz) dedi ve \"Ey Ebu el-Rabi', senin için keder içindeyiz\" dedi. Kadınlar feryat edip ağladılar ve Cabir onları susturmaya çalıştı. Peygamberimiz \"Onları rahat bırakın. Ölüm kaçınılmaz olduğunda kimse ağlamamalıdır\" dedi. \"Kaçınılmaz olan nedir?\" diye sordular. Peygamberimiz \"Öldüğü zaman\" dedi. Kızı, \"Allah'a yemin ederim ki, senin şehit olmanı ummuştum, çünkü onun cenazesini hazırlamıştın\" dedi. Peygamber onlara Allah'ın onu niyetine göre ödüllendireceğini bildirdi ve şehitliği ne olarak gördüklerini sordu. Onlar, \"Allah yolunda öldürülmek\" dediler. Bunun üzerine Allah yolunda öldürülenlerin yanı sıra yedi şehit daha saydı: vebadan ölen, boğulan, zatürreden ölen, mide rahatsızlığından ölen, yanıklardan ölen, çöken bir binanın altında kalan ve doğum sırasında ölen bir kadın. Araştırmacı, el-Baghawi'nin el-Şafiî'den rivayet ettiğine göre Malik'in \"Cabir ibn Atik\" isminde hata yaptığını, doğru ismin \"Cebbr\" olması gerektiğini belirtiyor. İbn Kani' ise doğru ismin Cebbr olduğunu söyledi. Araştırmacı, Malik'in hatasının tartışmalı olduğunu düşünüyor çünkü Cabir ibn Atik ve Ceb ibn Atik aynı kişidir, bunu Tahdhib el-Kamal tefsirinde açıklamıştır. Ayrıca o, bunun Malik'ten Ebu Mus'ab tarafından ve onun aracılığıyla da İbn Hibban, el-Beğavî, Ravh ibn Ubâde (Ahmed, 5/446), el-Ka'nâbî (Ebu Davud, 3111) ve el-Hakim (1/351), Utbe ibn Abdullah (en-Nesa'i, 4/13) tarafından rivayet edildiğini belirtmektedir. el-Şafi'i ve Muhammed ibn el-Hasan el-Şeybani (302). {cite:muwatta-maruf-1997 s.320} {cite:muwatta-maruf-1997 s.321}"
  id: "Hadits pertama dalam bab tentang larangan menangisi orang yang meninggal. Diriwayatkan oleh Malik dari Abdullah ibn Abdullah ibn Jabir ibn Atik, dari Atik ibn al-Harith ibn Atik, yang merupakan kakek dari pihak ibunya, dari Jabir ibn Atik, bahwa Nabi datang mengunjungi Abdullah ibn Thabit dan mendapati beliau sangat berduka. Beliau memanggilnya, tetapi beliau tidak menjawab. Maka beliau berkata, \"Inna lillahi wa inna ilayhi raji'un\" (Sesungguhnya kami milik Allah dan kepada-Nya kami akan kembali), dan berkata, \"Kami sangat berduka atasmu, wahai Abu al-Rabi'.\" Para wanita menangis dan meratap, dan Jabir berusaha menenangkan mereka. Nabi berkata, \"Biarkan mereka. Ketika kematian tak terhindarkan, tidak seorang pun boleh menangis.\" Mereka bertanya, \"Apa yang tak terhindarkan?\" Beliau menjawab, \"Ketika dia meninggal.\" Putrinya berkata, \"Demi Allah, aku berharap engkau akan menjadi syahid, karena engkau telah menyiapkan pemakamannya.\" Nabi memberitahu mereka bahwa Allah akan memberi pahala kepadanya sesuai dengan niatnya, dan beliau bertanya kepada mereka apa yang mereka anggap sebagai syahid. Mereka menjawab, \"Terbunuh di jalan Allah.\" Maka beliau menyebutkan tujuh syuhada selain mereka yang gugur di jalan Allah: satu orang yang meninggal karena wabah, satu orang yang tenggelam, satu orang yang meninggal karena radang selaput dada, satu orang yang meninggal karena penyakit perut, satu orang yang meninggal karena luka bakar, satu orang yang meninggal karena tertimpa bangunan yang runtuh, dan seorang wanita yang meninggal saat melahirkan. Peneliti menyebutkan bahwa al-Baghawi meriwayatkan dari al-Shafi'i bahwa Malik melakukan kesalahan dalam nama \"Jabir ibn 'Atik,\" padahal seharusnya \"Jabr.\" Ibn Qani' berkata: Nama yang benar adalah Jabr. Peneliti tersebut meyakini bahwa kesalahan Malik patut dipertanyakan karena Jabir ibn 'Atik dan Jabr ibn 'Atik adalah orang yang sama, sebagaimana dijelaskannya dalam komentarnya tentang Tahdhib al-Kamal. Ia juga mencatat bahwa hadits tersebut diriwayatkan dari Malik oleh Abu Mus'ab, dan melalui dia oleh Ibn Hibban, al-Baghawi, Rawh ibn 'Ubadah (seperti yang dicatat oleh Ahmad, 5/446), al-Qa'nabi (seperti yang dicatat oleh Abu Dawud, 3111) dan al-Hakim (1/351), 'Utbah ibn 'Abd Allah (seperti yang dicatat oleh al-Nasa'i, 4/13), al-Shafi'i, dan Muhammad ibn al-Hasan al-Shaybani (302). {cite:muwatta-maruf-1997 p.320} {cite:muwatta-maruf-1997 p.321}"
