label: { ar: "سنن أبي داود 3600 — الأب والأبوة", en: "Sunan Abi Dawud 3600 — the father and fatherhood", ur: "سنن ابی داؤد 3600 — باپ اور والدیت", es: "Sunan Abi Dawud 3600 — El padre y la paternidad", fr: "Sunan Abi Dawud 3600 — Le père et la paternité" }
text: "حَدَّثَنَا حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا مُحَمَّدُ بْنُ رَاشِدٍ، حَدَّثَنَا سُلَيْمَانُ بْنُ مُوسَى، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ رَدَّ شَهَادَةَ الْخَائِنِ وَالْخَائِنَةِ وَذِي الْغِمْرِ عَلَى أَخِيهِ وَرَدَّ شَهَادَةَ الْقَانِعِ لأَهْلِ الْبَيْتِ وَأَجَازَهَا لِغَيْرِهِمْ. قَالَ أَبُو دَاوُدَ الْغِمْرُ الْحِنَةُ وَالشَّحْنَاءُ وَالْقَانِعُ الأَجِيرُ التَّابِعُ مِثْلُ الأَجِيرِ الْخَاصِّ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3600، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3600 (The Office of the Judge (Kitab Al-Aqdiyah)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3600، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.º 3600 (El Libro del Juez (Kitab Al-Aqdiyah)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 3600 (Le Livre du Juge (Kitab Al-Aqdiyah)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
