text: "… نية الخير مطلقاً، وانه يثاب على النية. وإذا استنفرتم فانفروا معناه إذا طلبكم الإمام للحروج الى الجهاد فاخرجوا. وهذا دليل على أن الجهاد ليس فرص عين بل فرض كفاية، إذا فعله من تحصل بهم الكفاية سقط الحرج عن الباقين. وإن …"
summary:
  ar: "مقطع من دلائل النبوة للبيهقي، المجلد المصوَّر 3، ص 118، يرد فيه ذكر الفرض، وفرض الكفاية، وما إذا قام به البعض سقط عن الباقين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Bayhaqi's Dala'il al-Nubuwwa, scan volume 3, p. 118, whose wording mentions the obligatory (fard), the communal obligation (fard kifaya), what is lifted from the rest when some carry it out; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "دلائل النبوۃ، بیہقی، اسکین جلد 3، ص 118 کا اقتباس جس میں فرض، فرضِ کفایہ، جسے کچھ لوگ ادا کر دیں تو باقیوں سے ساقط ہو جاتا ہے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Dala'il al-Nubuwwa de al-Bayhaqi, volume numérisé 3, p. 118, dont le texte mentionne l'obligatoire (fard), l'obligation collective (fard kifaya), ce dont les autres sont déchargés quand certains l'accomplissent ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Dala'il al-Nubuwwa de al-Bayhaqi, volumen digitalizado 3, p. 118, cuyo texto menciona lo obligatorio (fard), la obligación colectiva (fard kifaya), lo que deja de obligar a los demás cuando algunos lo cumplen; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
