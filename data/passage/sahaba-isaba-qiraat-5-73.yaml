text: "عبد الرحمن حرف العين - القسم الثانى لما خرح الى الجهاد بالشام فمات ابوه فى طاعون عمواس سنة ثمائية عشرة وتزوج عمرامه فنشا فى حجر عمر فسمع منه ومن غيره وتزوج بنت عمان ثم كان ن ندبه عثمان لكتابة المصاحف …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 5، ص 73، يذكر جمع القرآن والمصاحف، والخطوط والكتابة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 5, p. 73, that mentions the collection of the Qur'an and the codices, the scripts and the craft of writing; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 5، ص 73 کا اقتباس جس میں جمعِ قرآن اور مصاحف، خطوط اور کتابت کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de la obra Al-Isaba de Ibn Hajar, volumen 5, pág. 73, que menciona la colección del Corán y los códices, los manuscritos y el arte de la escritura; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye en su lista."
