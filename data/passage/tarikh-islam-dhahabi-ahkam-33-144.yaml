text: "وذكر عنه صلاح وزُهْد وتقشّف زائد وقناعة مع الحُرمة العظيمة. والجلالة. وأنّه كان يُرغّب في حضور الجماعة. وكان لا يصلّي في المسجد غير الفريضة، ويتنفّل في بيته، ولا يقبل ممّن يقرأ عليه هديّة. وكان من أذكياء النّاس وأَفْقههم وأكثرهم تفتُّناً. …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 33، ص 144، يرد فيه ذكر الفريضة والفرائض، والنافلة والنوافل، والترغيب في العمل؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 33, p. 144, whose wording mentions the obligation (farida), the supererogatory (nafila), encouragement to an act; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 33، ص 144 کا اقتباس جس میں فریضہ اور فرائض، نفل اور نوافل، عمل کی ترغیب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Tarikh al-Islam de al-Dhahabi, volume numérisé 33, p. 144, dont le texte mentionne l'obligation (farida), le surérogatoire (nafila), l'encouragement à un acte ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen digitalizado 33, p. 144, cuyo texto menciona la obligación (farida), lo supererogatorio (nafila), el estímulo a un acto; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "El-Dhahabi'nin *İslam Tarihi* adlı eserinin 33. cildinin 144. sayfasından bir alıntı, farz olan amelleri ve çoğullarını, nafile olan amelleri ve çoğullarını ele almakta ve iyi amelleri teşvik etmektedir. Bu alıntı, makine tarafından okunabilir taranmış bir baskıdan alınmıştır ve kaynak yönergelerine uygun olarak yaklaşık kırk kelimeden oluşan bir metindir ve düzenlenmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Jilid 33, halaman 144, menyebutkan amalan wajib dan bentuk jamaknya, amalan sunnah dan bentuk jamaknya, serta menganjurkan amal kebaikan. Kutipan ini berasal dari edisi hasil pemindaian yang dapat dibaca mesin, dan teksnya merupakan kutipan sekitar empat puluh kata, sesuai dengan pedoman sumber, dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
