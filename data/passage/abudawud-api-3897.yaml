label: { ar: "سنن أبي داود 3897 — الرقية", en: "Sunan Abi Dawud 3897 — ruqya recited over the sick", ur: "سنن ابی داؤد 3897 — رقیہ", es: "Sunan Abi Dawud 3897 — ruqya recitada sobre el enfermo", fr: "Sunan Abi Dawud 3897 — Ruqya récitée sur les malades", tr: "Sünen Ebu Davud 3897 — Ruqyah", id: "Sunan Abi Dawud 3897 — Ruqyah" }
text: "… أَبِي ح، وَحَدَّثَنَا ابْنُ بَشَّارٍ، حَدَّثَنَا ابْنُ جَعْفَرٍ، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ اللَّهِ بْنِ أَبِي السَّفَرِ، عَنِ الشَّعْبِيِّ، عَنْ خَارِجَةَ بْنِ الصَّلْتِ، عَنْ عَمِّهِ، أَنَّهُ مَرَّ - قَالَ - فَرَقَاهُ بِفَاتِحَةِ الْكِتَابِ ثَلاَثَةَ أَيَّامٍ غُدْوَةً وَعَشِيَّةً كُلَّمَا خَتَمَهَا جَمَعَ بُزَاقَهُ ثُمَّ تَفَلَ فَكَأَنَّمَا أُنْشِطَ مِنْ عِقَالٍ فَأَعْطَوْهُ شَيْئًا فَأَتَى النَّبِيَّ ثُمَّ ذَكَرَ مَعْنَى حَدِيثِ مُسَدَّدٍ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3897، يذكر الرقية. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 3897 (Medicine (Kitab Al-Tibb)), that mentions ruqya recited over the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 3897، جس میں رقیہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 3897 (Medicina (Kitab Al-Tibb)), menciona la ruqya recitada sobre los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sunan Abi Dawud, n° 3897 (Médecine (Kitab Al-Tibb)), mentionne la récitation de la ruqya sur les malades. Le navigateur de textes médicaux le répertorie avec les ouvrages sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Abi Davud'da yer alan 3897 numaralı hadiste rukye (dua)den bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3897, menyebutkan ruqyah (mantra). Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
