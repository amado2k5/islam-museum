  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 1, s. 1286'sından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
