text: "… فسبقت هذا. أخبرنا ابن الفضل أخبرنا دعلج بن احمد. أخبرنا احمد بن على الابار حدثنا احمد بن سعيد أبو عبد الرحمن الرباطى حدثنا أبو داود.قال : مات -فيان بالبصرة، ودفن ليلا ولم نشهد الصلاة - يعنى عليه- وغدونا على قيره …"
