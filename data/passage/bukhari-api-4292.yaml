label: { ar: "صحيح البخاري 4292 — اليتيم وفقد الأب", en: "Sahih al-Bukhari 4292 — the orphan and the father lost", ur: "صحیح بخاری 4292 — یتیم اور باپ کی موت", es: "Sahih al-Bukhari 4292 — El huérfano y el padre perdido" }
text: "حَدَّثَنَا أَبُو الْوَلِيدِ، حَدَّثَنَا شُعْبَةُ، عَنْ عَمْرٍو، عَنِ ابْنِ أَبِي لَيْلَى، مَا أَخْبَرَنَا أَحَدٌ، أَنَّهُ رَأَى النَّبِيَّ يُصَلِّي الضُّحَى غَيْرَ أُمِّ هَانِئٍ، فَإِنَّهَا ذَكَرَتْ أَنَّهُ يَوْمَ فَتْحِ مَكَّةَ اغْتَسَلَ فِي بَيْتِهَا ثُمَّ صَلَّى ثَمَانِيَ رَكَعَاتٍ، قَالَتْ لَمْ أَرَهُ صَلَّى صَلاَةً أَخَفَّ مِنْهَا غَيْرَ أَنَّهُ يُتِمُّ الرُّكُوعَ وَالسُّجُودَ."
summary:
  ar: "حديث في صحيح البخاري، رقم 4292، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4292 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4292، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4292 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al huérfano y al padre desaparecido. El navegador \"La paternidad en el Islam\" lo incluye en su lista de textos del Corán, la Sunnah, la sirah y libros sobre la figura paterna."
