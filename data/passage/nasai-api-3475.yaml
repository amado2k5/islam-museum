label: { ar: "سنن النسائي 3475 — الأب والأبوة", en: "Sunan al-Nasa'i 3475 — the father and fatherhood", ur: "سنن نسائی 3475 — باپ اور والدیت", es: "Sunan al-Nasa'i 3475 — El padre y la paternidad", fr: "Sunan al-Nasa'i 3475 — Le père et la paternité", tr: "Sunan an-Nasa'i 3475 — Baba ve Babalık", id: "Sunan an-Nasa'i 3475 — Sang Ayah dan Peran Ayah" }
text: "… الْعَجْلاَنِ وَقَالَ \" اللَّهُ يَعْلَمُ إِنَّ أَحَدَكُمَا كَاذِبٌ فَهَلْ مِنْكُمَا تَائِبٌ \". قَالَ لَهُمَا ثَلاَثًا فَأَبَيَا فَفَرَّقَ بَيْنَهُمَا. قَالَ أَيُّوبُ وَقَالَ عَمْرُو بْنُ دِينَارٍ إِنَّ فِي هَذَا الْحَدِيثِ شَيْئًا لاَ أَرَاكَ تُحَدِّثُ بِهِ قَالَ قَالَ الرَّجُلُ مَالِي قَالَ \" لاَ مَالَ لَكَ إِنْ كُنْتَ صَادِقًا فَقَدْ دَخَلْتَ بِهَا وَإِنْ كُنْتَ كَاذِبًا فَهِيَ أَبْعَدُ مِنْكَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 3475، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 3475 (The Book of Divorce), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 3475، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3475 (El Libro del Divorcio), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 3475 (Le Livre du Divorce), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 3475 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3475, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
