label: { ar: "الموطأ 2178 — مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب: سرق رقيق لحاطب ناقة لرجل من مزينة فانتحروها، فأمر عمر كثير بن الصلت بقطع أيديهم، ثم قال: والله لأغرمنك غرما يشق عليك، وأعطاه ثمانمائة درهم", en: "Muwatta 2178", es: "Muwatta 2178", fr: "Muwatta 2178", ur: "موطا 2178", tr: "El-Muvatta 2178 — Malik, Hişam ibn Urvah'tan, o da babasından, o da Yahya ibn Abdülrahman ibn Hatib'den rivayet eder: Hatib'e ait bazı köleler, Muzaynahlı bir adama ait bir deveyi çalıp kestiler. Ömer, Kathir ibn el-Tuz'a ellerini kesmesini emretti, sonra da: Allah'a yemin ederim ki, size çok ağır bir ceza vereceğim dedi ve ona sekiz yüz dirhem verdi.", id: "Al-Muwatta 2178 — Malik, berdasarkan riwayat Hisham ibn Urwah, berdasarkan riwayat ayahnya, berdasarkan riwayat Yahya ibn Abd al-Rahman ibn Hatib: Beberapa budak milik Hatib mencuri seekor unta milik seorang pria dari Muzaynah dan menyembelihnya. Umar memerintahkan Kathir ibn al-Salt untuk memotong tangan mereka, lalu berkata: Demi Allah, aku akan mendenda kalian dengan denda yang akan berat bagi kalian, dan dia memberinya delapan ratus dirham." }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب أن رقيقا لحاطب سرقوا ناقة لرجل من مزينة فانتحروها. فرفع ذلك إلى عمر بن الخطاب، فأمر عمر كثير بن الصلت أن يقطع أيديهم. ثم قال عمر: أراك تجيعهم. ثم قال عمر: والله لأغرمنك غرما يشق عليك. ثم قال للمزني: كم ثمن ناقتك؟ فقال المزني: قد كنت والله أمنعها من أربع مائة درهم، فقال عمر: أعطه ثمان مائة درهم. {cite:muwatta-maruf-1997 p.294}"
  tr: "Malik, Hişam ibn Urvah'tan, o da babasından, o da Yahya ibn Abdülrahman ibn Hatib'den rivayet eder ki, Hatib'in kölelerinden bazıları Muzeyne'li bir adama ait bir deveyi çalıp kesmişler. Bu olay Ömer ibn el-Hattab'a bildirilmiş ve Ömer, Kathir ibn el-Tuz'a ellerini kesmesini emretmiş. Sonra Ömer, \"Görüyorum ki onları aç bırakıyorsunuz\" demiş. Ardından Ömer, \"Allah'a yemin ederim ki, sizin için zor olacak bir ceza keseceğim\" demiş. Sonra Muzeyne'li adama, \"Devenin değeri ne kadar?\" diye sormuş. Muzeyne'li adam, \"Allah'a yemin ederim ki, dört yüz dirhem bile vermezdim\" diye cevap vermiş. Ömer, \"Ona sekiz yüz dirhem ver\" demiş. {cite:muwatta-maruf-1997 s.294}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, dari ayahnya, dari Yahya ibn Abd al-Rahman ibn Hatib, bahwa beberapa budak Hatib mencuri seekor unta milik seorang pria dari Muzaynah dan kemudian menyembelihnya. Hal ini dilaporkan kepada Umar ibn al-Khattab, dan Umar memerintahkan Kathir ibn al-Salt untuk memotong tangan mereka. Kemudian Umar berkata, \"Aku melihat kalian membuat mereka kelaparan.\" Kemudian Umar berkata, \"Demi Allah, aku akan mengenakan denda yang akan sulit bagi kalian.\" Kemudian dia berkata kepada pria Muzaynah itu, \"Berapa harga untamu?\" Pria Muzaynah itu menjawab, \"Demi Allah, aku akan menahan empat ratus dirham untuk itu.\" Umar berkata, \"Berikan dia delapan ratus dirham.\" {cite:muwatta-maruf-1997 p.294}"
