label: { ar: "الموطأ 2178 — مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب: سرق رقيق لحاطب ناقة لرجل من مزينة فانتحروها، فأمر عمر كثير بن الصلت بقطع أيديهم، ثم قال: والله لأغرمنك غرما يشق عليك، وأعطاه ثمانمائة درهم", en: "Muwatta 2178" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه عن يحيى بن عبد الرحمن بن حاطب أن رقيقا لحاطب سرقوا ناقة لرجل من مزينة فانتحروها. فرفع ذلك إلى عمر بن الخطاب، فأمر عمر كثير بن الصلت أن يقطع أيديهم. ثم قال عمر: أراك تجيعهم. ثم قال عمر: والله لأغرمنك غرما يشق عليك. ثم قال للمزني: كم ثمن ناقتك؟ فقال المزني: قد كنت والله أمنعها من أربع مائة درهم، فقال عمر: أعطه ثمان مائة درهم. {cite:muwatta-maruf-1997 p.294}"
