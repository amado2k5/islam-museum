label: { ar: "سنن النسائي 901 — ذكر أمم وأديان وشعوب غير مسلمة", en: "Sunan al-Nasa'i 901 — mentions of non-Muslim nations, religions and peoples", ur: "سنن نسائی 901 — غیر مسلم امتوں، ادیان اور اقوام کا ذکر", es: "Sunan al-Nasa'i 901 — menciones de naciones, religiones y pueblos no musulmanes", fr: "Sunan al-Nasa'i 901 — mentions de nations, de religions et de peuples non musulmans" }
text: "أَخْبَرَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، قَالَ حَدَّثَنَا حَجَّاجٌ، قَالَ حَدَّثَنَا حَمَّادٌ، عَنْ ثَابِتٍ، وَقَتَادَةَ، وَحُمَيْدٍ، عَنْ أَنَسٍ، أَنَّهُ قَالَ كَانَ رَسُولُ اللَّهِ يُصَلِّي بِنَا إِذْ جَاءَ رَجُلٌ فَدَخَلَ الْمَسْجِدَ وَقَدْ حَفَزَهُ النَّفَسُ فَقَالَ اللَّهُ أَكْبَرُ الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ. فَلَمَّا قَضَى رَسُولُ اللَّهِ صَلاَتَهُ قَالَ \" أَيُّكُمُ الَّذِي تَكَلَّمَ بِكَلِمَاتٍ \" فَأَرَمَّ الْقَوْمُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 901، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 901 (The Book of the Commencement of the Prayer), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "سنن نسائی کی حدیث نمبر 901، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 901 (El Libro del Inicio de la Oración), con menciones de naciones, religiones y pueblos no musulmanes. El Umam Browser lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre naciones, religiones, sectas y pueblos no musulmanes."
  fr: "Un rapport du Sunan al-Nasa'i, n° 901 (Le Livre du Commencement de la Prière), mentionne des nations, des religions et des peuples non musulmans. Le navigateur Umam le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages relatifs aux nations, religions, sectes et peuples non musulmans."
