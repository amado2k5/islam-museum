label: { ar: "سنن النسائي 3150 — مضاعفة الأجر", en: "Sunan al-Nasa'i 3150 — the reward doubled or multiplied", ur: "سنن نسائی 3150 — اجر کا دوگنا یا کئی گنا ہونا", es: "Sunan al-Nasa'i 3150 — la recompensa se duplica o multiplica", fr: "Sunan al-Nasa'i 3150 — la récompense doublée ou multipliée", tr: "Sunan an-Nasa'i 3150 — Sevabı katlamak", id: "Sunan an-Nasa'i 3150 — Melipatgandakan pahala" }
text: "… إِنَّ نَاسًا لَيَهَابُونَ الصَّلاَةَ عَلَيْهِ يَقُولُونَ رَجُلٌ مَاتَ بِسِلاَحِهِ. فَقَالَ رَسُولُ اللَّهِ \" مَاتَ جَاهِدًا مُجَاهِدًا \". قَالَ ابْنُ شِهَابٍ ثُمَّ سَأَلْتُ ابْنًا لِسَلَمَةَ بْنِ الأَكْوَعِ فَحَدَّثَنِي عَنْ أَبِيهِ مِثْلَ ذَلِكَ غَيْرَ أَنَّهُ قَالَ حِينَ قُلْتُ إِنَّ نَاسًا لَيَهَابُونَ الصَّلاَةَ عَلَيْهِ. فَقَالَ رَسُولُ اللَّهِ \" كَذَبُوا مَاتَ جَاهِدًا مُجَاهِدًا فَلَهُ أَجْرُهُ مَرَّتَيْنِ \". وَأَشَارَ بِأُصْبُعَيْهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 3150، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3150 (The Book of Jihad), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3150، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 3150 (El Libro de la Yihad), habla de la recompensa duplicada o multiplicada. El Libro Mayor de Hasanat y Sayyi'at lo incluye entre los textos que registran, escriben, borran o sopesan una acción."
  fr: "Un hadith du Sunan al-Nasa'i, n° 3150 (Le Livre du Jihad), mentionne une récompense doublée ou multipliée. Le Livre des Hasanat et Sayyi'at le recense parmi les textes qui comptabilisent, inscrivent, effacent ou évaluent un acte."
  tr: "Sunan-ı Nesai'de 3150 numaralı hadis, sevabın katlanarak artırılmasından bahseder. Bu hadis, iyi ve kötü amellerin listesiyle birlikte, ameli sayan, kaydeden, silen veya tartan metinlerle birlikte gruplandırılmıştır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 3150, menyebutkan tentang penggandaan pahala. Hadits ini dikelompokkan bersama daftar amal baik dan buruk, beserta teks-teks yang menghitung, mencatat, menghapus, atau menimbang perbuatan tersebut."
