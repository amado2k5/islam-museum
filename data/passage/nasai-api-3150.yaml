label: { ar: "سنن النسائي 3150 — مضاعفة الأجر", en: "Sunan al-Nasa'i 3150 — the reward doubled or multiplied", ur: "سنن نسائی 3150 — اجر کا دوگنا یا کئی گنا ہونا" }
text: "… إِنَّ نَاسًا لَيَهَابُونَ الصَّلاَةَ عَلَيْهِ يَقُولُونَ رَجُلٌ مَاتَ بِسِلاَحِهِ. فَقَالَ رَسُولُ اللَّهِ \" مَاتَ جَاهِدًا مُجَاهِدًا \". قَالَ ابْنُ شِهَابٍ ثُمَّ سَأَلْتُ ابْنًا لِسَلَمَةَ بْنِ الأَكْوَعِ فَحَدَّثَنِي عَنْ أَبِيهِ مِثْلَ ذَلِكَ غَيْرَ أَنَّهُ قَالَ حِينَ قُلْتُ إِنَّ نَاسًا لَيَهَابُونَ الصَّلاَةَ عَلَيْهِ. فَقَالَ رَسُولُ اللَّهِ \" كَذَبُوا مَاتَ جَاهِدًا مُجَاهِدًا فَلَهُ أَجْرُهُ مَرَّتَيْنِ \". وَأَشَارَ بِأُصْبُعَيْهِ."
summary:
  ar: "حديث في سنن النسائي، رقم 3150، يذكر مضاعفة الأجر. تجمعه قائمة الحسنات والسيئات مع النصوص التي تعدّ العمل أو تكتبه أو تمحوه أو تزنه."
  en: "A report in Sunan al-Nasa'i, no. 3150 (The Book of Jihad), that speaks of the reward doubled or multiplied. The Hasanat and Sayyi'at Ledger lists it with the texts that count, write, erase or weigh a deed."
  ur: "سنن نسائی کی حدیث نمبر 3150، جس میں اجر کا دوگنا یا کئی گنا ہونا کا ذکر ہے۔ حسنات و سیئات کی فہرست اسے ان نصوص کے ساتھ جمع کرتی ہے جو عمل کو گنتے، لکھتے، مٹاتے یا تولتے ہیں۔"
