label: { ar: "الموطأ 313 — بلاغ عن ابن عمر: صلاة الليل والنهار مثنى مثنى", en: "Muwatta 313", es: "Muwatta 313", fr: "Muwatta 313", ur: "موطا 313", tr: "El-Muvatta 313 — İbn Ömer'den rivayet: Gece ve gündüz namazları ikişerli olarak kılınır.", id: "Al-Muwatta 313 — Riwayat dari Ibnu Umar: Shalat malam dan shalat siang dilakukan berpasangan." }
text: "صلاة الليل والنهار مثنى مثنى، يسلم من كل ركعتين"
summary:
  ar: "بلاغ في باب ما جاء في صلاة الليل: يروي مالك أنه بلغه أن عبد الله بن عمر كان يقول إن صلاة الليل والنهار مثنى مثنى يُسلّم من كل ركعتين، ويقول مالك إن ذلك الأمر عند أهل المدينة. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن الحديث سيأتي مرفوعاً دون لفظة «والنهار»، وأن في هذه اللفظة كلاماً طويلاً ساقه في تعليقه على ابن ماجه (1322). {cite:muwatta-maruf-1997 p.176}"
  tr: "Gece namazı hakkında rivayet edilen bir rapor: Malik, Abdullah ibn Umar'ın gece ve gündüz namazlarının iki rekat halinde kılındığını ve her iki rekattan sonra selam verildiğini söylediğini işittiğini bildirir. Malik, bunun Medine halkı arasında yaygın bir uygulama olduğunu söyler. Editör, bunu Ebu Mus'ab'ın Malik'ten rivayet ettiğini ve hadisin \"ve gündüz\" ifadesi olmadan Peygamber'e (marfu') kadar uzanan bir isnad zinciriyle sunulacağını ve bu ifade hakkında İbn Majah'ın tefsirinde (1322) uzun bir tartışmanın yer aldığını belirtir. {cite:muwatta-maruf-1997 s.176}"
  id: "Sebuah laporan mengenai apa yang telah diriwayatkan tentang salat malam: Malik meriwayatkan bahwa ia mendengar bahwa Abdullah ibn Umar biasa mengatakan bahwa salat malam dan salat siang dilakukan berpasangan, dengan taslim (salam) diucapkan setelah setiap dua rakaat. Malik mengatakan bahwa ini adalah praktik di kalangan penduduk Madinah. Editor menyebutkan bahwa Abu Mus'ab meriwayatkannya dari Malik, dan bahwa hadits tersebut akan disajikan dengan sanad yang kembali kepada Nabi (marfu') tanpa frasa \"dan siang,\" dan bahwa ada pembahasan panjang tentang frasa ini, yang ia sertakan dalam komentarnya tentang Ibn Majah (1322). {cite:muwatta-maruf-1997 p.176}"
