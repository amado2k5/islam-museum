text: "صلاة الليل والنهار مثنى مثنى، يسلم من كل ركعتين"
summary:
  ar: "بلاغ في باب ما جاء في صلاة الليل: يروي مالك أنه بلغه أن عبد الله بن عمر كان يقول إن صلاة الليل والنهار مثنى مثنى يُسلّم من كل ركعتين، ويقول مالك إن ذلك الأمر عند أهل المدينة. ويذكر المحقق أن أبا مصعب رواه عن مالك، وأن الحديث سيأتي مرفوعاً دون لفظة «والنهار»، وأن في هذه اللفظة كلاماً طويلاً ساقه في تعليقه على ابن ماجه (1322). {cite:muwatta-maruf-1997 p.176}"
