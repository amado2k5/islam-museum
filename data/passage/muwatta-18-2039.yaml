label: { ar: "الموطأ 2039 — يحيى عن مالك: فيمن دفع إلى رجل مالا قراضا فعمل فيه فربح، فأراد أن يأخذ حصته من الربح وصاحب المال غائب: لا ينبغي له أن يأخذ منه شيئا إلا بحضرة صاحب المال، وإن أخذ شيئا فهو له ضامن حتى يحسب مع المال إذا اقتسماه", en: "Muwatta 2039", es: "Muwatta 2039", fr: "Muwatta 2039", ur: "موطا 2039", tr: "El-Muvatta 2039 — Yahya, Malik'ten rivayetle: Bir kimse, bir kişiye kâr paylaşımı için para verir ve o kişi bu parayı yatırıp kâr elde ederse, paranın sahibi yokken kendi payını almak isterse: Paranın sahibi olmadan hiçbir şey almamalıdır; eğer bir şey alırsa, paylaştırılıncaya kadar bundan sorumlu olur.", id: "Al-Muwatta 2039 — Yahya berdasarkan riwayat Malik: Mengenai orang yang memberikan uang kepada seseorang untuk perjanjian bagi hasil, dan orang tersebut menginvestasikannya dan memperoleh keuntungan, lalu ingin mengambil bagian keuntungannya sementara pemilik uang tidak ada di tempat: dia tidak boleh mengambil apa pun dari uang itu kecuali di hadapan pemilik uang, dan jika dia mengambil sesuatu, dia bertanggung jawab atasnya sampai hal itu dihitung bersama uang ketika mereka membaginya." }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه فربح، فأراد أن يأخذ حصته من الربح، وصاحب المال غائب، قال: لا ينبغي له أن يأخذ منه شيئا إلا بحضرة صاحب المال، وإن أخذ شيئا فهو له ضامن، حتى يحسب مع المال إذا اقتسماه. {cite:muwatta-maruf-1997 p.233}"
  tr: "Yahya şöyle dedi: Malik, bir adamın başka bir adama kâr paylaşımı için para verdiğini, diğerinin bu parayı yatırıp kâr elde ettiğini ve para sahibinin yokluğunda kâr payını almak istediğini şöyle ifade etti: \"Para sahibi olmadan hiçbir şey almamalıdır; eğer bir şey alırsa, paylaştırılana kadar bundan sorumludur.\" {cite:muwatta-maruf-1997 s.233}"
  id: "Yahya berkata: Malik berkata mengenai seorang pria yang memberikan uang kepada pria lain untuk perjanjian bagi hasil, dan pria yang terakhir menginvestasikan uang itu dan memperoleh keuntungan, lalu ingin mengambil bagian keuntungannya sementara pemilik uang tidak ada: Ia tidak boleh mengambil apa pun dari keuntungan itu kecuali di hadapan pemilik uang, dan jika ia mengambil sesuatu, ia bertanggung jawab atasnya, sampai hal itu dihitung bersama uang tersebut ketika mereka membaginya. {cite:muwatta-maruf-1997 p.233}"
