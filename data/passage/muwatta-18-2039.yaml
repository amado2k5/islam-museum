label: { ar: "الموطأ 2039 — يحيى عن مالك: فيمن دفع إلى رجل مالا قراضا فعمل فيه فربح، فأراد أن يأخذ حصته من الربح وصاحب المال غائب: لا ينبغي له أن يأخذ منه شيئا إلا بحضرة صاحب المال، وإن أخذ شيئا فهو له ضامن حتى يحسب مع المال إذا اقتسماه", en: "Muwatta 2039" }
summary:
  ar: "قال يحيى: قال مالك في رجل دفع إلى رجل مالا قراضا، فعمل فيه فربح، فأراد أن يأخذ حصته من الربح، وصاحب المال غائب، قال: لا ينبغي له أن يأخذ منه شيئا إلا بحضرة صاحب المال، وإن أخذ شيئا فهو له ضامن، حتى يحسب مع المال إذا اقتسماه. {cite:muwatta-maruf-1997 p.233}"
