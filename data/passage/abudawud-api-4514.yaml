label: { ar: "سنن أبي داود 4514 — الحجامة", en: "Sunan Abi Dawud 4514 — cupping", ur: "سنن ابی داؤد 4514 — حجامہ", es: "Sunan Abi Dawud 4514 - catación", fr: "Sunan Abi Dawud 4514 — ventouses", tr: "Sünen Ebu Davud 4514 — Hacamat", id: "Sunan Abi Dawud 4514 — Bekam" }
text: "… بْنُ الأَعْرَابِيِّ كَذَا قَالَ عَنْ أُمِّهِ، وَالصَّوَابُ، عَنْ أَبِيهِ، عَنْ أُمِّ مُبَشِّرٍ، - دَخَلَتْ عَلَى النَّبِيِّ فَذَكَرَ مَعْنَى حَدِيثِ مَخْلَدِ بْنِ خَالِدٍ نَحْوَ حَدِيثِ جَابِرٍ قَالَ فَمَاتَ بِشْرُ بْنُ الْبَرَاءِ بْنِ مَعْرُورٍ فَأَرْسَلَ إِلَى الْيَهُودِيَّةِ فَقَالَ \" مَا حَمَلَكِ عَلَى الَّذِي صَنَعْتِ \". فَذَكَرَ نَحْوَ حَدِيثِ جَابِرٍ فَأَمَرَ بِهَا رَسُولُ اللَّهِ فَقُتِلَتْ وَلَمْ يَذْكُرِ الْحِجَامَةَ."
summary:
  ar: "حديث في سنن أبي داود، رقم 4514، يذكر الحجامة. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sunan Abi Dawud, no. 4514 (Types of Blood-Wit (Kitab Al-Diyat)), that mentions cupping. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "سنن ابی داؤد کی حدیث نمبر 4514، جس میں حجامہ کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 4514 (Tipos de sangre-inteligencia (Kitab Al-Diyat)), menciona la ventosaterapia. El Navegador de Medicina la incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Sunan Abi Dawud, n° 4514 (Types de sang – Kitab Al-Diyat), mentionne la ventousothérapie. Le Répertoire des ressources médicales la répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sunan Ebu Davud'da yer alan 4514 numaralı hadiste hacamat uygulamasından bahsedilmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri üzerine metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4514, menyebutkan tentang bekam. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
