text: "… بل لغلبتها واحتباس الغليظ عن الخروج. البول الغليظ الكثير في وجع الفالج يحل المرض؛ وذلك لأنه يدل على أن المادة هي ذي تخرج بالبول. البول الغليظ الذي فيه ثفل متشتت في المواضع في وجع الطحال والحمى الربع دليل البرء، لأنه …"
summary:
