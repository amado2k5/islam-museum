text: |-
  *⁦(شطا)⁩*
  ٤٦٩
  لا ابن عمك لا أفضت فى حسب • عنى ولا أنت ديانى فتخزونى
  اى ولا أنت مالك أمرى فتسوسنى وخزى بالكسر يخزى خزيا أى ذلّ وهان وقال ابن
  السكيت وقع فى بلية وأخزاهاقه قال لبيد
  غير أن لا تكذبنها فى التقى • واخزها بالبرلله الاجل:
  قال الكسائى خازانى فلان فحزيته أخزيه وكرهت أن أخزيه وخزى أيضايخزى خزاية
  أى استحيافه وخزيان وقوم خزايا وامر أة خزيا قال جرير
  وان حى لم يحمه غيرفرتنا • وغيرابن ذى السكير بن خزيان ضائع
  أبوعبيداخزاء بالمدنيت ( سا يقال خسا أوز كاأى فرد أوزوج قال الكميت
  مكارم لا تحصى اذاخن لم نقل • خسا أوز كافيما نعد خلالها
  شى خشى الرجل يخشى خشبة أى شاف فهو خشيان والمرأة خشيا وتاشائى فلان
  فحشيته اخشيه بالكسر عن أبى عبيد أى كنت أشد خشية منه وهذا المكان أخشى من
  ذالدأى أشدخوفاً وقول الشاعر
  ولد خشْيت بأنّ من تبع الهدى • سكن الجنان مع النيمحمد
  فالوا معناه عات وقوله تعالى خشينا أن يرهقهماطفيانا وكفرا قال الاخفس معناهكرهنا
  وخشاه تخشية أى خوّفه يقال خش ذوالة بالحبالة يعف الذتب قال الاصمعىّ الخشى
  على فعيل منل الخشى وهواليابس قال الراجز* سم ذراريح رطاب وخشى * الاموى
  لخشو الحشف من التمريقال خشت النخلة تخشواذا أحتفت ⁦(خصى)⁩ الخصية واحدة
  لحصى وكذلان اخصية بالسكسر قال أبو عبيدة مممت خصية بالضم ولم أسمع خصية بالسكسر
  ومعت خصياه ولم يقولواخصى للمواحد وقال أبوهر واظخصيتان البيضتان والخصسيان
  لجلدتان المقان فيهما السيضتان وفشه
  كأن خصيه من التدلدل • ظرف عموزفيه ثنتاحتظال
  أراد فيه حنظلتان الاموى الخصية البيضة وقالت امى أة من العرب
  لست أبالى أن أكون مهقة • اذارأيت خصية معلقه
  والبجهع خصى فاذا ثذيت قلت خصيان ولم تلحقه التاء ركذلا الالية اذائذوت قات أليان
  ولم تفقه التاء وهما نادران وخصيت الغصل خصاء عدود اذاسلات خصييه بقال برئت اليك
  من انخصاء قال بشري جورجلا
  جزيز القفاشبعان يربض حجرة * حديث الخصاء وارم العفل معبر
  والرجل خصوالجمع خصيان وخصية وموضع القطع مخصى ⁦(خطا)⁩ انلخطوة بالضم
  مابين القدمين ويجع القلة خطوات وخطوات وخطوات والسكثير خطا وانخطوة بالفعح المرة
  الواحدة وابهع خطوات بالتحريك وخطاءمثل ركوة وركاء قال امر والقيس
  لهاوثيات كونب الظباء • فواد خطاء وواد مطر
  وقولهم فى الدعاء اذادعو اللانسان خطى عنه السوء أى دفع عنه السوعية ال خطنى عنك
  أى أميط وخطوت واختطيت بمعنق وأخطيت غيرى اذا حلته على أن يخطو وتخطيته اذا
  ١١٨
  مصاح
