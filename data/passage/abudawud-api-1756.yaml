label: { ar: "سنن أبي داود 1756 — الأب والأبوة", en: "Sunan Abi Dawud 1756 — the father and fatherhood", ur: "سنن ابی داؤد 1756 — باپ اور والدیت", es: "Sunan Abi Dawud 1756 — El padre y la paternidad" }
text: "… بْنِ سَلَمَةَ رَوَى عَنْهُ، حَجَّاجُ بْنُ مُحَمَّدٍ - عَنْ جَهْمِ بْنِ الْجَارُودِ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، قَالَ أَهْدَى عُمَرُ بْنُ الْخَطَّابِ نَجِيبًا فَأُعْطِيَ بِهَا ثَلاَثَمِائَةِ دِينَارٍ فَأَتَى النَّبِيَّ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أَهْدَيْتُ نَجِيبًا فَأُعْطِيتُ بِهَا ثَلاَثَمِائَةِ دِينَارٍ أَفَأَبِيعُهَا وَأَشْتَرِي بِثَمَنِهَا بُدْنًا قَالَ \" لاَ انْحَرْهَا إِيَّاهَا \". قَالَ أَبُو دَاوُدَ …"
summary:
  ar: "حديث في سنن أبي داود، رقم 1756، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 1756 (The Rites of Hajj (Kitab Al-Manasik Wa'l-Hajj)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 1756، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 1756 (Los ritos del Hajj (Kitab Al-Manasik Wa'l-Hajj)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
