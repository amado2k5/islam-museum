text: "… إِنّ اللَّهِ قَدْ فَرِضَ عَلَيْكُمُ الحَجِ نَحْجُوا فقَالَ رَجَلٌ : أَكْلِ عَامٍ يَا رسولَ اللّهِ؟ سكت، حَتَّى قَالَها ثَلاثاً. فَقَال رَسُولُ اللّه للشالم : لَوْ قُلْتُ نَعَمْ لَوجَبت وَلَمَا اسْتَطَعْتَه ثُمَّ قال : ذَرُونى ما تركْتُكُمْ، إِنَّمَا هَلَكَ مِنْ كانَ …"
summary:
  ar: "مقطع من رياض الصالحين للنووي، المجلد المصوَّر 3، ص 261، يرد فيه ذكر ما فرضه الله ورسوله، وما فُرض على الناس، والفرض، و«لو قلت نعم لوجبت»؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Nawawi's Riyad al-Salihin, scan volume 3, p. 261, whose wording mentions what God and His Messenger made obligatory, what was made obligatory on people, the obligatory (fard), 'had I said yes, it would have become obligatory'; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "ریاض الصالحین، نووی، اسکین جلد 3، ص 261 کا اقتباس جس میں جو اللہ اور اس کے رسول نے فرض کیا، جو لوگوں پر فرض کیا گیا، فرض، «اگر میں ہاں کہہ دیتا تو واجب ہو جاتا» کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Riyad al-Salihin de al-Nawawi, volume numérisé 3, p. 261, dont le texte mentionne ce que Dieu et Son Messager ont rendu obligatoire, ce qui a été imposé aux gens, l'obligatoire (fard), « si j'avais dit oui, cela serait devenu obligatoire » ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Riyad al-Salihin de al-Nawawi, volumen digitalizado 3, p. 261, cuyo texto menciona lo que Dios y Su Mensajero hicieron obligatorio, lo que se impuso a la gente, lo obligatorio (fard), «si hubiera dicho que sí, se habría hecho obligatorio»; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
