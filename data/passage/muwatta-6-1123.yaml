label: { ar: "الموطأ 1123 — ابن شهاب: من أهدى بدنة جزاء أو نذراً أو هدي تمتع، فأصيبت في الطريق فعليه البدل", en: "Muwatta 1123", es: "Muwatta 1123", fr: "Muwatta 1123", ur: "موطا 1123", tr: "El-Muvatta 1123 — İbn Şihab: Kim bir deveyi kurban olarak, adak olarak veya Hac-ı Tamattu için kurban olarak sunarsa ve deve yolda yaralanırsa, yerine yenisini temin etmelidir.", id: "Al-Muwatta 1123 — Ibn Shihab: Barang siapa mempersembahkan unta sebagai kurban, atau nazar, atau sebagai kurban untuk Haji Tamattu’, dan unta tersebut terluka di tengah jalan, maka ia wajib menyediakan penggantinya." }
text: "من أهدى بدنة جزاء أو نذراً أو هدي تمتع، فأصيبت في الطريق فعليه البدل"
summary:
  ar: "يرويه مالك عن ابن شهاب أنه قال: من أهدى بدنة جزاء أو نذراً، أو هدي تمتع، فأُصيبت في الطريق، فعليه البدل. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1219) وسويد (528). {cite:muwatta-maruf-1997 p.513}"
  tr: "Malik, İbn Şihab'dan rivayet ederek şöyle demiştir: \"Kim Hac-ı Tamattu' için kurban olarak bir deve sunarsa ve bu deve yolda ölürse, yerine başka bir deve sunmalıdır.\" Araştırmacı, bunun Malik'ten Ebu Mus'ab (1219) ve Suveyd (528) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.513}"
  id: "Malik meriwayatkan hadits ini dari Ibnu Shihab, yang berkata: Barang siapa mempersembahkan unta sebagai kurban, nazar, atau hewan kurban untuk Haji Tamattu', dan unta tersebut terbunuh di tengah jalan, maka ia wajib mempersembahkan penggantinya. Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (1219) dan Suwaid (528). {cite:muwatta-maruf-1997 p.513}"
