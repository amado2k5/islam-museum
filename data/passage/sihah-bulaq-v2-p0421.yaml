text: |-
  وان يأنك الاعدا بالجهدأ جهد
  ١٦٦
  •فصل الجيم) *
  •⁦(جلل)⁩•
  وهو أن تدعوالناس الى طعاصك عامة قال طرفة.
  فحن فى المشتاة ندعو الجفلى * لاترى الادب فينا ينتقر
  قال الاخفش يقال دعى فلان فى النقرى لافى الحفلى والاجفلى أى دعى فى الخاصة لاف
  العامة وقال الفراءيا القوم أجفلة وأزفلة أى بجاعة وجاوا بأجفلتهسم وأزفلتهم أى أ
  بجماعتهسم وقال بعضهسم الاحفلى والازفلى الجماعة من كل شئ وجعل أى أسرع والهافل إ
  المنزعج قال الشاعر
  حراجع نجد يعد فرك وبغضة • مطاق بصرى أصمع القلب جافه
  والاجفيسل الجبان وظليم إجفيسل يهرب من كل شئ وأجقل القوم أى هربوامسر عين
  والجفالة من الناس الهاعة وأجفمات الريح فهو مجفل أى أسرعت وجافلة أيضاواً جفات
  الريح بالتراب أى أذهبته وطيرته وأنشد الاصمعى
  وهاب كجمان الحامة أجفات • بدرمح تزج والصباكل مجفل
  وانجفل القوم أى انقلعوا كلهم فضوا لل الجل بالفح الشراع والجمع
  جلول قال القطامى
  فى ذى جلول يقضى المون صاحبه * اذا الصرارى من أهو اله ارنسما
  والجلة البعريقال انّ بى فلان وقودهم الجلة ووقودهم الوألة وهم يجتاون الجلة أى يلقطون
  البعر والجلّ بالضم واحدجلال الدواب وجع اهلال أجلة والجل الذى فى قول الاعشى
  وشاهدنا الجل والباعين • هوالورد فارسى معرب وجسلّ الشى معظمه والجلى
  الامى العظيم وجمها جلل مثل كبرى وكبر ومنه قول طرفة
  مق أدع فى الجلى أكن من حاتها• وقال آخر ١
  وان دءوت الى جلى ومكرمة • يوماكراما من الاقوام فادعينا
  والجلة وعاء التمر والجل بالكسر قصب الزرع اذا حصد ويقال أيضاماله دق ولاجسل أى
  دقيق ولاجليل والجلة من الابل المسان وهو حع جليل مثل صبىّ وصببة قال النمر
  أزمان لم تأخذالى سلاحها • ابلى بجلتها ولا أبكارها
  ومشيخة جلة أى مسات وائيلة الصحيفسة فيها الحكمة قال أبو عبيد كل كتاب عند العرب
  مجلة وقول النابغة .
  مجلتهم ذات الاله ودينهم • قويم فايرجون غير العواقب
  فن رواه بالجيم فهو من ه_ذاومن رواه بالهاء نعناه أنهم يحجون فيحلون مواضع مقدّسة
  وجلال اللّه عظمته وقولهم فعلته من جلالك أى من أجلك وأنتد الكسائة
  واكرامى القوم العدامن جلالها • والجلالة البقرة التى تتبسع النياسات وفى الحديث
  نمى عن ابن الجسلالة والجلال بالضم العظيم والجسلالة الناقة العظيمة والجلل الامر
  العظيم قال وعلة بن الجرث
  قومى هسم قتلوا أميم أنى • فاذارميت يصيبف همى
  فائن مفوت لاعفون جللا • ولتى سطوت اوهن عظمى
  والجال
