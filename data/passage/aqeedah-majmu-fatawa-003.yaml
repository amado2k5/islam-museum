text: "ديق، والشهادة ونحوهما. وهذا معنى الإقرار الذي يذكره الفقهاء في كتاب الإقرار . والثاني: إنشاء الالتزام كما في قوله تعالى : (أأقررتم وأخدتم على ذلكم إصري قالوا أقررنا قال فاشهدوا وأنا معكم من الشاهدين) [آل عمران: ٨١]. وليس هو هنا"
