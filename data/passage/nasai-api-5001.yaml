label: { ar: "سنن النسائي 5001 — ما بُني عليه الإسلام، الصلاة والزكاة والصوم والحج مجتمعة", en: "Sunan al-Nasa'i 5001 — what Islam is built on; the prayer, the zakat, the fast and the pilgrimage named together", ur: "سنن نسائی 5001 — وہ جن پر اسلام کی بنیاد ہے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ", es: "Sunan al-Nasa'i 5001 — en qué se basa el Islam; la oración, el zakat, el ayuno y la peregrinación mencionados juntos.", fr: "Sunan al-Nasa'i 5001 — les fondements de l'islam: la prière, la zakat, le jeûne et le pèlerinage, cités ensemble.", tr: "Sunan an-Nasa'i 5001 — İslam'ın temelleri: namaz, zekât, oruç ve Hac bir arada.", id: "Sunan an-Nasa'i 5001 — Landasan Islam: shalat, zakat, puasa, dan haji yang digabungkan." }
text: "… بْنُ عَبْدِ اللَّهِ بْنِ عَمَّارٍ، قَالَ حَدَّثَنَا الْمُعَافَى، - يَعْنِي ابْنَ عِمْرَانَ - عَنْ حَنْظَلَةَ بْنِ أَبِي سُفْيَانَ، عَنْ عِكْرِمَةَ بْنِ خَالِدٍ، عَنِ ابْنِ عُمَرَ، أَنَّ رَجُلاً، قَالَ لَهُ أَلاَ تَغْزُو قَالَ سَمِعْتُ رَسُولَ اللَّهِ يَقُولُ \" بُنِيَ الإِسْلاَمُ عَلَى خَمْسٍ شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَإِقَامِ الصَّلاَةِ وَإِيتَاءِ الزَّكَاةِ وَالْحَجِّ وَصِيَامِ رَمَضَانَ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5001، يذكر ما بُني عليه الإسلام، والصلاة والزكاة والصوم والحج مجتمعة، والشهادة والصلاة والزكاة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5001 (The Book Of Faith and its Signs), that mentions what Islam is built on, the prayer, the zakat, the fast and the pilgrimage named together, the testimony, the prayer and the zakat. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5001، جس میں وہ جن پر اسلام کی بنیاد ہے، نماز، زکوٰۃ، روزہ اور حج ایک ساتھ، شہادت، نماز اور زکوٰۃ کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 5001 (El Libro de la Fe y sus Signos), menciona los fundamentos del Islam: la oración, el zakat, el ayuno y la peregrinación, el testimonio, la oración y el zakat. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sunan an-Nasa'i, n° 5001 (Le Livre de la Foi et ses Signes), mentionne les fondements de l'islam: la prière, la zakat, le jeûne et le pèlerinage, ainsi que le témoignage. Le moteur de recherche « Piliers et Branches de la Foi » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sunan-ı Nesai'de yer alan 5001 numaralı hadis, namaz, zekât, oruç ve Hac gibi İslam'ın temellerini ve ayrıca iman ikrarını, namazı ve zekâtı zikrediyor. Bu hadis, İslam'ın temellerini, imanın temellerini, imanın dallarını ve müminin özelliklerini, Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetleriyle birlikte bu dört kategori içinde inceleyen bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 5001, menyebutkan landasan-landasan Islam, termasuk salat, zakat, puasa, dan haji, serta pengakuan iman, salat, dan zakat. Hadits ini disusun oleh seorang peneliti yang meneliti rukun-rukun Islam, rukun-rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, semuanya dalam empat kategori ini."
