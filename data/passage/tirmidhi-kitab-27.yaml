summary:
  ar: "القسم 27 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب البر والصلة عن رسول الله»، ويضم فيها النصوص من 1897 إلى 2035 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 27 of Jami' al-Tirmidhi (Chapters on Righteousness And Maintaining Good Relations With Relatives) in the division of the open hadith dataset the museum took its reports from: reports 1897 to 2035 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 27، عنوان «کتاب البر والصلۃ عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1897 تا 2035۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 27 de Jami' al-Tirmidhi (Capítulos sobre la rectitud y el mantenimiento de buenas relaciones con los familiares) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1897 al 2035, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du livre 27 de Jami' al-Tirmidhi (chapitres sur la piété et les bonnes relations familiales), soit les hadiths 1897 à 2035 de la base de données ouverte. Il conserve ses archives sous ce livre; les éditions imprimées classent et numérotent la collection différemment."
