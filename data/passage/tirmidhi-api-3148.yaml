text: "… لِوَائِي وَأَنَا أَوَّلُ مَنْ تَنْشَقُّ عَنْهُ الأَرْضُ وَلاَ فَخْرَ قَالَ فَيَفْزَعُ النَّاسُ ثَلاَثَ فَزَعَاتٍ فَيَأْتُونَ آدَمَ فَيَقُولُونَ أَنْتَ أَبُونَا آدَمُ فَاشْفَعْ لَنَا إِلَى رَبِّكَ. فَيَقُولُ إِنِّي أَذْنَبْتُ ذَنْبًا أُهْبِطْتُ مِنْهُ إِلَى الأَرْضِ وَلَكِنِ ائْتُوا نُوحًا. فَيَأْتُونَ نُوحًا فَيَقُولُ إِنِّي دَعَوْتُ عَلَى أَهْلِ الأَرْضِ دَعْوَةً فَأُهْلِكُوا وَلَكِنِ اذْهَبُوا إِلَى إِبْرَاهِيمَ. فَيَأْتُونَ إِبْرَاهِيمَ فَيَقُولُ إِنِّي كَذَبْتُ ثَلاَثَ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 3148، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Jami' al-Tirmidhi, no. 3148 (Chapters on Tafsir), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "جامع ترمذی کی حدیث نمبر 3148، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 3148 (Capítulos sobre Tafsir), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 3148 (Chapitres sur le Tafsir), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant du père."
