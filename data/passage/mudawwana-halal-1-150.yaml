text: "… الحلاق بقى عليه قال لم يحل منها عند مالك ولكنه على احرامه كما هو ولا يكون طوافه الذي طاف حين دخل مكة لعمرته. ولكن طوافه ذلك لهما جميعاً وهذا قد أحرم بهما جميعاً فلا يحل من واحد منهما دون الآخر …"
