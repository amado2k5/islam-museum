label: { ar: "الموطأ 1938 — مالك: في رجل ابتاع سلعة بعشرة دنانير نقدا، أو بخمسة عشر دينارا إلى أجل، وقد وجبت للمشتري بأحد الثمنين: إنه لا ينبغي ذلك، لأنه إن أخر العشرة كانت خمسة عشر إلى أجل، وإن نقد العشرة فإنما اشترى بها الخمسة عشر التي إلى أجل", en: "Muwatta 1938", es: "Muwatta 1938", fr: "Muwatta 1938", ur: "موطا 1938", tr: "El-Muvatta 1938 — Malik: Bir kimse, bir malı on dinara nakit veya on beş dinara kredili olarak satın almış ve malın borcu bu iki fiyattan birine göre dolmuşsa, bu caiz değildir. Çünkü eğer on dinarı peşin öderse, on beş dinar kredili olur; eğer on dinarı nakit öderse, bununla sadece on beş dinarı kredili olarak satın almış olur.", id: "Al-Muwatta 1938 — Malik: Mengenai seorang pria yang membeli suatu barang seharga sepuluh dinar secara tunai, atau seharga lima belas dinar secara kredit, dan barang tersebut jatuh tempo kepada pembeli dengan salah satu dari kedua harga tersebut: bahwa hal ini tidak diperbolehkan, karena jika ia menunda pembayaran sepuluh dinar, maka yang harus dibayar secara kredit adalah lima belas dinar, dan jika ia membayar sepuluh dinar secara tunai, ia hanya membeli lima belas dinar yang dibayar secara kredit." }
summary:
  ar: "قال مالك: في رجل ابتاع سلعة من رجل بعشرة دنانير نقدا، أو بخمسة عشر دينارا إلى أجل، قد وجبت للمشتري بأحد الثمنين: إنه لا ينبغي ذلك، لأنه إن أخر العشرة كانت خمسة عشر إلى أجل، وإن نقد العشرة كان إنما اشترى بها الخمسة عشر التي إلى أجل. {cite:muwatta-maruf-1997 p.192} {cite:muwatta-maruf-1997 p.193}"
  tr: "Malik şöyle dedi: Bir kimse başka bir kimseden on dinara nakit veya on beş dinara kredili mal alırsa ve alıcı bu iki fiyattan birine hak kazanmışsa, bu caiz değildir. Çünkü on dinarı peşin öderse, on beş dinar kredili olur; on dinarı nakit öderse de, sadece on beş dinarı kredili olarak almış olur. {cite:muwatta-maruf-1997 s.192} {cite:muwatta-maruf-1997 s.193}"
  id: "Malik berkata: Jika seseorang membeli barang dari orang lain seharga sepuluh dinar secara tunai, atau seharga lima belas dinar secara kredit, dan pembeli berhak atas salah satu dari kedua harga tersebut, maka hal ini tidak diperbolehkan. Karena jika ia menunda pembayaran sepuluh dinar, maka pembayaran menjadi lima belas dinar secara kredit, dan jika ia membayar sepuluh dinar secara tunai, maka ia hanya membeli lima belas dinar secara kredit. {cite:muwatta-maruf-1997 p.192} {cite:muwatta-maruf-1997 p.193}"
