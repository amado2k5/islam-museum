text: |-
  (فصل الجيم
  ⁦(جزر)⁩
  ٢٩٥
  والخبر خلاف القدر قال أبوع بيدهو كلام مولد والجبرية بالتحريك خلاف القدرية ويقال
  أيضا فيه جبر يه وجبروة وجبروت وجبورة مثل فرّوجة أى كبر وأنسد الاحر
  فانك ان عاديتنى غضب الحصى * عليك وذوالجبورة المتغطرف
  والجبير مثال الفسيق الشديد التجبر والجبارة والجبيرة اليارق والجبارة والجميرة ايضا
  العيدان التى تجير بها العظام وجبريل اسم يقال هو جبر أضيف الى ايل وفيه لغات جبرئيل.
  مثال جبر عمل يمم زولايهمز وأنشد الاخفش
  شهدنا فاتلق لنا من كتيبة * يدا الدهر الاجبر ئيل أمامها
  ويقال جبريل بالكسر وأنشدحسان
  وجبر يل رسول اللّٰه فينا * وروح القدس ليس له كفاء
  وجبرتل مقصور مثال جبر عل وجبربن بالنون ( حجر الجر واحد الجرة والاجحار
  وأججرته أى ألجأنه الى ان دخسل بجره فانجمر وقد اجتهر لنفسه جمرا أى اتخذه والجران
  لجر وتظيره حقت فى عقب الشهروعقيانه وفى الحديث اذا حاضت المرأة حرم إلجران
  والجرة بالفتح السنة الشديدة قال الشاعر
  اذا السنة الشهباء بالناس أجفت • ونال كرام المار فى الجرة الاكل
  والجرمة الضيق وسو الخلق والميم زائدة وجدرت عينه غارت وججرذلان تأخر ومجاحر القوم
  -كامنهم والجواحر الدواخل فى الجرة والمكامن (بجدر الجدر القصير وبحدراسم رجل
  ⁦( جخر)⁩ الجخر بالتحريك الانساع فى البئريقال جغر جوف البئر بالكسر وتجغير البئر
  توسيعها ⁦( جدر)⁩ الجدر والجدار الحائط وجمع الجدار جدروجع الجد ر جدران مثل بطن
  ويطنان والجدر أيضانيت وقد أجدر المكان والجدر أثر السكدم بعنق المار قال رؤية
  وجادر الليتين مطوى الحنق وشاة جدراء اذا تقوب جلد*امن داء يصيها والجدرى بضم
  لجيم وفتح الدال والإدرى بفتحهما لغنان تقول منه جدر الرجل فهو محدّر وأرض مجدّرة
  ذات جدرى ويقال أيضاه ذا الامر مجدرة لذلك أى محراة وفلان جدير بكذا اى خليق
  وأنت جدير أن تفعل كذا والجهع جدراء وجديرون والحدير مكان قدبى حواليه جدار
  ويقال للمحظيرة من صخر جديرة وجد رقرية بالشأم تنسب اليها الحر وقال الشاعر
  ألا يا اصحينا فيهجا جدرية • بما سحاب يسبق الحق باطلى
  والجدرة خراج وهى السلعة والجمع جدر وأنشدابن الاءرابى باقاتل اللّٰه دقيلاذا الجدر
  والجدرة أيضاحىّ من الازد ويقال سموا بذلك لانهم بنواجدار الكعبة وجندرت الكتاب اذا
  أمروت القسلم على مادرس منه ليتبين وكذلك الثوب اذا أعدت وشيه بعدما كان ذهب
  وأظنه معر با أذر) المؤذرولد البقرة الوحشية والجمع جاذر در لجذر
  الاصل قال زهير يصف بقرة
  وسامعتين تعرف العتقفيهما • الى جذر مدلوك السكعوب محدّد
  يعنى قرنها وأصسل كل شئ جذره بالفتح عن الاصمعى وجذره بالكسر عن أبى عمرو
  وفى الحديث ات الامانة تزات فى جذر قلوب الرجال وعشرة فى حساب الضرب جذرمائة
  والجارية البعير المجتمع الخلق
  عن ابن فارس مكذا وجدت
  هذه الزيادة فى بعض الفسمخ وكذا
  انجر تغير رائحة اللحم عن ابن
  فارس اه
