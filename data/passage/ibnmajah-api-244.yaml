label: { ar: "سنن ابن ماجه 244 — الأب والأبوة", en: "Sunan Ibn Majah 244 — the father and fatherhood", ur: "سنن ابن ماجہ 244 — باپ اور والدیت", es: "Sunan Ibn Majah 244 — El padre y la paternidad" }
text: "… حَدَّثَنَا سُوَيْدُ بْنُ عَمْرٍو، عَنْ حَمَّادِ بْنِ سَلَمَةَ، عَنْ ثَابِتٍ، عَنْ شُعَيْبِ بْنِ عَبْدِ اللَّهِ بْنِ عَمْرٍو، عَنْ أَبِيهِ، قَالَ مَا رُئِيَ رَسُولُ اللَّهِ ـ يَأْكُلُ مُتَّكِئًا قَطُّ وَلاَ يَطَأُ عَقِبَيْهِ رَجُلاَنِ. قَالَ أَبُو الْحَسَنِ وَحَدَّثَنَا خَازِمُ بْنُ يَحْيَى، حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْحَجَّاجِ السَّامِيُّ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، قَالَ أَبُو الْحَسَنِ وَحَدَّثَنَا إِبْرَاهِيمُ بْنُ نَصْرٍ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 244، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 244 (The Book of the Sunnah), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 244، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 244 (El Libro de la Sunnah), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
