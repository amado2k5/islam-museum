text: "… يعلّمون أولادهم حبّ أبي بكرٍ وعُمر ملها كما يُعلّمون السُّورة من القرآن. في الأصل: عن أخيه، والصواب ما أثبته كما ترجمته في تهذيب الكمال. من عقائد أهل السُنَّة أن حُبَّ العرب من الإيمان، وبغضهم من النفاق، كما قال حرب الكرماني …"
summary:
  ar: "مقطع من كتاب السنة للخلال، ص 231، يذكر ما عُدّ من الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Khallal's Kitab al-Sunna, p. 231, that mentions what is counted as part of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "کتاب السنہ، خلال، ص 231 کا اقتباس جس میں جو ایمان میں سے گنا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Kitab al-Sunna de al-Khallal, pág. 231, que menciona lo que se considera parte de la fe; tomado de un escaneo automático, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du Kitab al-Sunna d'al-Khallal, p. 231, mentionnant ce qui est considéré comme faisant partie de la foi; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "El-Hallal'ın \"El-Sünnet\" adlı kitabının 231. sayfasından, taranmış, makine tarafından okunabilir versiyondan alınan bir alıntı, imanın nelerden oluştuğunu anlatmaktadır. Metin, kaynak yönergelerine uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri gibi bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari buku Al-Khallal \"Al-Sunnah,\" halaman 231, menyebutkan apa yang membentuk iman; dari versi yang dipindai dan dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan pedoman sumber. Teks ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
