label: { ar: "سنن أبي داود 3378 — تربية الأب ووصيته", en: "Sunan Abi Dawud 3378 — the father raising and counselling", ur: "سنن ابی داؤد 3378 — باپ کی تربیت اور نصیحت", es: "Sunan Abi Dawud 3378 — El padre que cría y aconseja", fr: "Sunan Abi Dawud 3378 — l'éducation et les conseils du père", tr: "Sunan Abi Dawud 3378 — Babanın Yetiştirilmesi ve Vasiyeti", id: "Sunan Abi Dawud 3378 — Didikan dan Wasiat Ayah" }
text: "… عَنِ الزُّهْرِيِّ، عَنْ عَطَاءِ بْنِ يَزِيدَ اللَّيْثِيِّ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، عَنِ النَّبِيِّ بِهَذَا الْحَدِيثِ زَادَ وَاشْتِمَالُ الصَّمَّاءِ أَنْ يَشْتَمِلَ فِي ثَوْبٍ وَاحِدٍ يَضَعُ طَرَفَىِ الثَّوْبِ عَلَى عَاتِقِهِ الأَيْسَرِ وَيُبْرِزُ شِقَّهُ الأَيْمَنَ وَالْمُنَابَذَةُ أَنْ يَقُولَ إِذَا نَبَذْتُ إِلَيْكَ هَذَا الثَّوْبَ فَقَدْ وَجَبَ الْبَيْعُ وَالْمُلاَمَسَةُ أَنْ يَمَسَّهُ بِيَدِهِ وَلاَ يَنْشُرُهُ وَلاَ يُقَلِّبُهُ فَإِذَا مَسَّهُ وَجَبَ الْبَيْعُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 3378، يذكر تربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3378 (Commercial Transactions (Kitab Al-Buyu)), that mentions the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 3378، جس میں باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sunan Abi Dawud, n.° 3378 (Transacciones comerciales (Kitab Al-Buyu)), menciona la crianza y el consejo paternos. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un rapport du Sunan Abi Dawud, n° 3378 (Traditions commerciales), mentionne l'éducation et les conseils du père. Le site « Paternité en Islam » répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés à la figure paternelle."
  tr: "Sünen Ebu Davud'da yer alan 3378 numaralı hadis, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. Bu hadis, İslam'da babalık üzerine araştırmalar yapan bir kişi tarafından, Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan derlenmiştir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 3378, menyebutkan peran seorang ayah dalam membesarkan anak dan nasihatnya. Hadits ini disusun oleh peneliti tentang peran ayah dalam Islam, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
