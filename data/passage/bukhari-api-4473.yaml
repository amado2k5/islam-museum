label: { ar: "صحيح البخاري 4473 — الأب والأبوة", en: "Sahih al-Bukhari 4473 — the father and fatherhood", ur: "صحیح بخاری 4473 — باپ اور والدیت", es: "Sahih al-Bukhari 4473 — El padre y la paternidad", fr: "Sahih al-Bukhari 4473 — le père et la paternité" }
text: "حَدَّثَنِي أَحْمَدُ بْنُ الْحَسَنِ، حَدَّثَنَا أَحْمَدُ بْنُ مُحَمَّدِ بْنِ حَنْبَلِ بْنِ هِلاَلٍ، حَدَّثَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، عَنْ كَهْمَسٍ، عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ غَزَا مَعَ رَسُولِ اللَّهِ سِتَّ عَشْرَةَ غَزْوَةً."
summary:
  ar: "حديث في صحيح البخاري، رقم 4473، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 4473 (Military Expeditions led by the Prophet (pbuh) (Al-Maghaazi)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح بخاری کی حدیث نمبر 4473، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.° 4473 (Expediciones militares dirigidas por el Profeta (Al-Maghaazi)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sahih al-Bukhari, n° 4473 (Expéditions militaires menées par le Prophète (Al-Maghaazi)), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les versets du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
