label: { ar: "الموطأ 2687 — أبو شريح الكعبي: من كان يؤمن بالله واليوم الآخر فليكرم ضيفه وجاره", en: "Muwatta 2687" }
summary:
  ar: "يروي مالك عن سعيد بن أبي سعيد المقبري عن أبي شريح الكعبي أن رسول الله قال: من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه؛ جائزته يوم وليلة، وضيافته ثلاثة أيام، فما كان بعد ذلك فهو صدقة، ولا يحل له أن يثوي عنده حتى يحرجه. {cite:muwatta-maruf-1997 p.518}"
