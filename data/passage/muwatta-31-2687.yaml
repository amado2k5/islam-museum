label: { ar: "الموطأ 2687 — أبو شريح الكعبي: من كان يؤمن بالله واليوم الآخر فليكرم ضيفه وجاره", en: "Muwatta 2687", es: "Muwatta 2687", fr: "Muwatta 2687", ur: "موطا 2687", tr: "El-Muvatta 2687 — Ebu Şurayh el-Ka'bi: Allah'a ve Ahiret Günü'ne iman eden kimse, misafirine ve komşusuna saygı göstermelidir.", id: "Al-Muwatta 2687 — Abu Shurayh al-Ka'bi: Barangsiapa beriman kepada Allah dan Hari Kiamat hendaknya menghormati tamunya dan tetangganya." }
summary:
  ar: "يروي مالك عن سعيد بن أبي سعيد المقبري عن أبي شريح الكعبي أن رسول الله قال: من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه؛ جائزته يوم وليلة، وضيافته ثلاثة أيام، فما كان بعد ذلك فهو صدقة، ولا يحل له أن يثوي عنده حتى يحرجه. {cite:muwatta-maruf-1997 p.518}"
  tr: "Malik, Sa'id ibn Abi Sa'id al-Maqburi'den, o da Abu Shurayh al-Ka'bi'den rivayet ettiğine göre, Allah Resulü şöyle buyurmuştur: \"Allah'a ve Ahiret Günü'ne iman eden kimse ya güzel söz söylesin ya da sussun. Allah'a ve Ahiret Günü'ne iman eden kimse komşusuna saygı göstersin. Allah'a ve Ahiret Günü'ne iman eden kimse misafirine saygı göstersin; misafirin hakkı bir gün bir gecedir, misafirperverliği ise üç gündür. Bunun ötesindeki her şey sadakadır ve ona zorluk çıkarmadıkça yanında kalması caiz değildir.\" {cite:muwatta-maruf-1997 s.518}"
  id: "Malik meriwayatkan dari Sa'id ibn Abi Sa'id al-Maqburi, dari Abu Shurayh al-Ka'bi, bahwa Rasulullah SAW bersabda: \"Barangsiapa beriman kepada Allah dan Hari Kiamat hendaknya ia berbicara yang baik atau diam. Barangsiapa beriman kepada Allah dan Hari Kiamat hendaknya ia menghormati tetangganya. Barangsiapa beriman kepada Allah dan Hari Kiamat hendaknya ia menghormati tamunya; haknya adalah satu hari satu malam, dan keramahannya adalah tiga hari. Apa pun yang melebihi itu adalah sedekah, dan tidak diperbolehkan baginya untuk tinggal bersama tamu tersebut sampai ia menyusahkan tamu tersebut.\" {cite:muwatta-maruf-1997 p.518}"
