  وأنشده ابن جنى اسم فاعل
  منصوب أرادا كلا الابارصا
  تفذف التنوين لالتقاء
  الساكنين اهم ر
  قوله التملق هذاه والصواب
  وأما قول القاموس ببصبص
  الشئء تبلق فهوابه ببصبص اذا
  تقلق كمانيه علية مد
