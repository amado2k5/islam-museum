text: |-
  والغاسق الليل اذاغاب الشفقوة وله تعالى ومن شرّغاسق اذا وقب قال الحسن الليل
  ادادخل ويقال انه القمر وغسقت عمنه غسة اأظات وغسق المرح غسقانا أى سال منه
  ماء أصغر وأغسق المؤذن أى أخر المغرب الى غسسق اللمل والغساق البارد المنتن يخقذ
  ويشتدوقرأ أبوعرو الاحيما وغساقا بالتحفيف والكائى بالتشديد غفق
  قل ابن الاعرابى يقال ظل يتغفق الشراب اذاشريه يومه أججمع قال والغفق أن رد الابل
  سكل ساعة قال الراجز
  يرعى الغضى من جاني مشفق * غباومن يرع الهوض يففق
  والمغفق المرجع وأتشدارؤية*من يعد مغزاى وبعد المغفق* قال والمنغفق المنصرف وقال
  الاصمى"المتعطف وأقشدارؤية• حتى تردى أربع فى المنغفق • لف) أغلقت
  المباب فهو مغلق والاسم الغلق ومنه قول الشاعر* وباب اذا مامال للغلق يصرف• ويقال
  هذا من غلقت الباب غلقا ومى لغة رديثة متروكة قال أبو الاسود الدؤلى
  ولا أقول لقدر القوم قدغليت * ولا أقول لباب الدار مغلوق
  وغلقت الابواب شتد للكثرة دربعاقالوا أغلقت الابواب قال الفرزدق
  مازات أفتح أبوابا وأغلقها • حتى أتيت أباع روبن عمار
  قال أبو ساتم السيسستانى يريداً باعمر وبن العلاهوباب غلق أى مغلق وهو فعل بمعنى مفعول
  مشل قارورة فتح وجذع قطل والغاق بالتحريك المغلاق وهو ما يغلق به الباب وكذلك
  المغلوق بالمضم والمغالق الازلام وكل سهم فى الميسر مغلق قال لبيد
  وجزورا بساردعوت لحتفها *بمغالق متشابه أجسامها
  وغلق الرهن غلقا أى استقه المرتهن وذلك اذ الم يفشكك فى الوقت المشروط وفى الحديث
  لا يغلق الرهن قال زهير
  وفارقسك برهن لافكالله • يوم الوداع فأمسى الرهن قد غلقا
  ويقال احتد فلان فنشب فى حدته وغلق وغلق ظهر البعير اسكثرة الدبر غلقا لا يبرأً واستغلق
  عليه الكلام أى ارتتج عليه وكلام غلق أى مشكل وغلاق اسم رجل من بنى تيم واهاب
  مغلوق اذاجعات فيه الغلقة حين يعطن قال ابن السكيت وهى شجرة يعطن بما أهل الطائف
  لفق) الغلفق الخضرة على رأس الماء ويشال نيت ينبت فى ال م م و ورق عسراض
  قال الزفيان
  ومنهل طام عليه الفلفق • ينيرأ ويسدى به الخدرتق
  وعيش غلفق أى رخىّ وقوس غلفق أى رخوة قال الراجز
  يحمل فرع شوحط لم تحق • لاكزة العود ولا بفلفق
  ويقال اللام فى هذه الحروف زائدة ( مق الغمق بالتحريك ركوب الندى الارض
  وقد غمقت الارض فهى عمقة أى ذات ندى وتقل وليله غمقة لثقة ونبات غمق اذا وجدت
  ريحه خة وفسادامن كثرة الاتداءعليه ⁦(غيق)⁩ غاق -كاية صوت الغراب فان نكرته
  تونت قال التلاخ بن حزن
  معاود
