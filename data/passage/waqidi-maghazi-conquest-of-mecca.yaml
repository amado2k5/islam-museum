label: { ar: "شأن الفتح — دخول النبي مكة وآل بيته", en: "The Conquest of Mecca — the Prophet's entry and his household", es: "La conquista de La Meca: la entrada del Profeta y su familia.", fr: "La conquête de La Mecque — l'entrée du Prophète et sa famille", ur: "فتح مکہ - نبی کا داخلہ اور آپ کا گھرانہ" }
text: "يا رسول الله، صهرك وابن عمتك وابن عمك وأخوك من الرضاعة! وقد جاء الله بهما مسلمين"
summary:
  ar: "في باب الفتح، يخبر عمر النبي بأن أبا سفيان بن الحارث وابا سفيان بن حرب اللذين كانا يقولان في مكة ما قالا قد جاءا مسلمين، فكلمته أم سلمة زوجته فقالت: «يا رسول الله، صهرك وابن عمتك وابن عمك وأخوك من الرضاعة! وقد جاء الله بهما مسلمين، لا يكونان أشقى الناس بك»، فقال النبي: لا حاجة لي بهما. ويذكر الواقدي دخول النبي مكة في ثمانية آلاف وعشرة آلاف، وكشف الكعبة وتكسير الأصنام، ودخول صفية وبني عبد المطلب معهم."
  en: "At the conquest Umm Salama urged the Prophet on behalf of Abu Sufyan ibn al-Harith and Abu Sufyan ibn Harb — 'your son-in-law, your cousin, your paternal cousin and your foster-brother, God has brought them to you as Muslims' — and the Prophet declined to press them. The chapter covers the entry into Mecca with eight to ten thousand men, the idols' destruction, and Safiyya and Banu Abd al-Muttalib coming in with them."
  es: "En la conquista, Umm Salama intercedió ante el Profeta en nombre de Abu Sufyan ibn al-Harith y Abu Sufyan ibn Harb: «Tu yerno, tu primo, tu primo paterno y tu hermano de crianza, Dios los ha traído a ti como musulmanes». El Profeta se negó a insistir. El capítulo abarca la entrada a La Meca con entre ocho y diez mil hombres, la destrucción de los ídolos y la llegada de Safiyya y Banu Abd al-Muttalib."
  fr: "Lors de la conquête, Umm Salama insista auprès du Prophète en faveur d'Abu Sufyan ibn al-Harith et d'Abu Sufyan ibn Harb: « Votre gendre, votre cousin, votre cousin paternel et votre frère de lait, Dieu les a amenés à vous comme musulmans. » Le Prophète refusa d'insister. Ce chapitre relate l'entrée à La Mecque avec huit à dix mille hommes, la destruction des idoles et l'arrivée de Safiyya et des Banu Abd al-Muttalib parmi eux."
  ur: "فتح کے وقت ام سلمہ نے ابو سفیان بن الحارث اور ابو سفیان بن حرب کی طرف سے نبی سے درخواست کی - 'آپ کے داماد، آپ کے چچازاد، آپ کے پھوپھی اور آپ کے رضاعی بھائی، خدا نے انہیں آپ کے پاس مسلمان بنا کر لایا ہے' - اور نبی نے ان پر دباؤ ڈالنے سے انکار کردیا۔ اس باب میں آٹھ سے دس ہزار آدمیوں کے مکہ میں داخل ہونے، بتوں کی تباہی اور صفیہ اور بنو عبدالمطلب کے ان کے ساتھ آنے کا احاطہ کیا گیا ہے۔"
