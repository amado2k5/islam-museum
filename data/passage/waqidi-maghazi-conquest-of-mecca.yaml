label: { ar: "شأن الفتح — دخول النبي مكة وآل بيته", en: "The Conquest of Mecca — the Prophet's entry and his household" }
text: "يا رسول الله، صهرك وابن عمتك وابن عمك وأخوك من الرضاعة! وقد جاء الله بهما مسلمين"
summary:
  ar: "في باب الفتح، يخبر عمر النبي بأن أبا سفيان بن الحارث وابا سفيان بن حرب اللذين كانا يقولان في مكة ما قالا قد جاءا مسلمين، فكلمته أم سلمة زوجته فقالت: «يا رسول الله، صهرك وابن عمتك وابن عمك وأخوك من الرضاعة! وقد جاء الله بهما مسلمين، لا يكونان أشقى الناس بك»، فقال النبي: لا حاجة لي بهما. ويذكر الواقدي دخول النبي مكة في ثمانية آلاف وعشرة آلاف، وكشف الكعبة وتكسير الأصنام، ودخول صفية وبني عبد المطلب معهم."
  en: "At the conquest Umm Salama urged the Prophet on behalf of Abu Sufyan ibn al-Harith and Abu Sufyan ibn Harb — 'your son-in-law, your cousin, your paternal cousin and your foster-brother, God has brought them to you as Muslims' — and the Prophet declined to press them. The chapter covers the entry into Mecca with eight to ten thousand men, the idols' destruction, and Safiyya and Banu Abd al-Muttalib coming in with them."
