label: { ar: "الموطأ 2433 — ابن شهاب عن السائب بن يزيد: خادم سرق مرآة امرأة سيده لا قطع عليه", en: "Muwatta 2433", es: "Muwatta 2433", fr: "Muwatta 2433", ur: "موطا 2433", tr: "El-Muvatta 2433 — İbn Şihab, El-Sa'ib bin Yazid'den rivayetle: Efendisinin karısından ayna çalan bir hizmetçi, uzuvlarının kesilmesine tabi değildir.", id: "Al-Muwatta 2433 — Ibn Shihab berdasarkan riwayat Al-Sa’ib bin Yazid: Seorang pelayan yang mencuri cermin dari istri majikannya tidak dikenai hukuman amputasi." }
summary:
  ar: "يروي مالك عن ابن شهاب عن السائب بن يزيد أن عبد الله بن عمرو بن الحضرمي جاء بغلام له إلى عمر بن الخطاب، وطلب قطع يده لأنه سرق مرآة لامرأته ثمنها ستون درهما. فقال عمر: أرسله، فليس عليه قطع، خادمكم سرق متاعكم. {cite:muwatta-maruf-1997 p.405}"
  tr: "Malik, İbn Şihab'dan, o da el-Sa'ib ibn Yazid'den rivayet ettiğine göre, Abdullah ibn Amr ibn el-Hadrami kölesini Ömer ibn el-Hattab'a getirmiş ve karısına ait altmış dirhem değerindeki aynayı çaldığı için elinin kesilmesini istemiş. Ömer şöyle demiş: \"Onu serbest bırakın, elinin kesilmesini hak etmiyor. Hizmetkarınız malınızı çaldı.\" {cite:muwatta-maruf-1997 s.405}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari al-Sa'ib ibn Yazid, bahwa Abdullah ibn Amr ibn al-Hadrami membawa budaknya kepada Umar ibn al-Khattab dan meminta agar tangannya dipotong karena ia telah mencuri cermin milik istrinya yang bernilai enam puluh dirham. Umar berkata: \"Lepaskan dia, karena dia tidak pantas dipotong tangannya. Budakmu telah mencuri hartamu.\" {cite:muwatta-maruf-1997 p.405}"
