label: { ar: "الموطأ 2433 — ابن شهاب عن السائب بن يزيد: خادم سرق مرآة امرأة سيده لا قطع عليه", en: "Muwatta 2433" }
summary:
  ar: "يروي مالك عن ابن شهاب عن السائب بن يزيد أن عبد الله بن عمرو بن الحضرمي جاء بغلام له إلى عمر بن الخطاب، وطلب قطع يده لأنه سرق مرآة لامرأته ثمنها ستون درهما. فقال عمر: أرسله، فليس عليه قطع، خادمكم سرق متاعكم. {cite:muwatta-maruf-1997 p.405}"
