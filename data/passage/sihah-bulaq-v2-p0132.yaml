text: |-
  *باب الواو والياء)*
  : ⁦(جدى)⁩*
  ٤٥٥
  الرجل صاحب منزله وأمّ مثواه صاحبة منزه قال أبوزيد الثوية مأوى الغنم قال وكذلك
  لثاية غير مهموز قال والثاية أيضاحجارة ترفع فتسكون علما بالليل للراعى اذارجع قال ابن
  السكيت هذه ثاية الغيم وثاية الابل اى.أواها وهى عازية أومأوهأحول البيوت والثوية
  سم موضع
  صل الجم أى جأى عليه جأ يا أى عض والجؤوة مثال الجعوة لون من
  أنوان الخيل والابل وهى حرة تضرب الى السواد يقال فرس أجأى والاتى جأواء وقدجئى
  الفرس يجاى وكتيمة حآواسنة الحاى وهى التى يعلوهالون السواد لكثرة الدروع وقواهم
  حق لا يجأى مرغه أى لا يحبس لعابه وسقاءلا يجأى شماً أى لا يمسكه والجثارة مثال
  لجعاوة وعاء القدراوشي توضع عليه من جاد أوخصفة وجعهاجماء مثل جراحة وحراح هذا
  أول الاصعى وكان أبو عمرويقول الجياء والجواء يعنى بذلت الوعاء أيضا والاحر مثله وفى
  حديث علىّ عليه السلام لأن أطلى بجوا قدرأحب الّمن أن اطلى بالزعفران وأما اندرقة
  التى تنزل بها القدر عن الاثافى فهى الجعال ⁦(جبا)⁩. الجبا بالفتح مقصورنثيلة البئروهى
  زابها الذى حولها تراه من بعيدومنه امرأة جبأى على فعلى مغال وحى اذا كانت قائمة
  لنديين والجى بالسكسر مقصور الماء الجموع فى الحوض للابل وكذلك الجبوة والجبادة قال
  الكسائى جييت الماء فى الحوض وجبوته أى جعته والحابية الموض الذى يجى فيه الماء
  للابل قال الاعشى كمابية الشيخ العراقى تفهق* والجمع الجوالي ومنه قوله تعمالى وجفان
  كالحوابى والجابية مدينة بالشأم وجبيت الخراج جباية وجبوته جياوة ولايهه زوأصله
  الهمز والاجباء بيع الزرع قبل أن يبدوصلاحه وفى الحديث من أجي فقد أربى وأصله
  الهمز والتحبية أن يقوم الانسان قيام الراكع وفى حديث ابن مسعود فى ذكر القيامة حين
  ينفخ فى الصورقال فيقومون فيجبون تجبية رجل واحدقيا مالرب العمالمين قال أبو عبيد
  التحيبية تكون فى حالين أحدهما أن يضع يديه على ركبتيه وهو قاتم والا خر أن ينكب
  على وجهه باركاوهو السجود واجتباه أى اصطفاه ⁦(جنا )⁩ الجنوة والجنوة والجنوة
  ثلاث لغات الحجارة الجموعة وجتى الحرم بالضم وجثى الحرم أيضا بالكسر ما اجتمع فيه من
  حجارة البهار وجنا على ركبتيه يجنو ويجنى جنيا وجنوّا على فعول فيهما وأجثاه غيره وقوم
  جثىّ أيضاممل جلس جلوسا وقوم جلوس ومنه قوله تعالى ونذر الظالمين فيها جنبا وجنيا
  أيضا بكسر الجيم لمابعدها من الكسر وجاثيته ركبنى الى ركبته وتجانوا على الركب وسورة
  لجاثية التى تلى الدحان ⁦(جما)⁩ اجتماه قلب اجتاحه وججحوان اسم رجل من
  بنى أسد وقال فقبلى مات الخالدان كلاهما * عميد بنى جوان وابن المضلل
  وجمااسم رجل قال الاخفس لا يتصرف لانه مثل عمر جخى التبغية الميل ومنه
  قول حذيفة كالسكوز مجخيا أى مائلالانه اذا مال ائصب مافيه وأنسد أبو عبيدة
  كفى -وأة أن لا تزال مجغيا* وجغى الشيخ أيضا انحنى قال الراجز» لاخير فى الشيخ اذا ماجخى
  ويرى اجلخاوفى الحديث أنه عليه السلام جخى فى سجوده أى خوّى ومتضبعيه وتجافى عن
  الارض دى لجدية بتسكين الدال شى محتو يجعل تحت دفتى السرج والرحل وهما
