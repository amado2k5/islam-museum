text: "وَقَالَ ابْنُ وَهْبٍ أَخْبَرَنَا عَمْرٌو، عَنْ بُكَيْرِ بْنِ الأَشَجِّ، أَنَّ كُرَيْبًا، مَوْلَى ابْنِ عَبَّاسٍ حَدَّثَهُ أَنَّ ابْنَ عَبَّاسٍما ـ قَالَ لَيْسَ السَّعْىُ بِبَطْنِ الْوَادِي بَيْنَ الصَّفَا وَالْمَرْوَةِ سُنَّةً، إِنَّمَا كَانَ أَهْلُ الْجَاهِلِيَّةِ يَسْعَوْنَهَا وَيَقُولُونَ لاَ نُجِيزُ الْبَطْحَاءَ إِلاَّ شَدًّا"
summary:
  ar: "حديث في صحيح البخاري، رقم 3847، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3847 (Merits of the Helpers in Madinah (Ansaar)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3847، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
