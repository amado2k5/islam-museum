  ar: "صحيح مسلم، كتاب المساقاة"
  en: "Sahih Muslim, Book 22: The Book of Musaqah"
  ur: "صحیح مسلم، کتاب المساقاۃ"
  es: "Sahih Muslim, Libro 22: El Libro de Musaqah"
summary:
  ar: "القسم 22 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب المساقاة»، ويضم فيها النصوص من 3962 إلى 4139 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 22 of Sahih Muslim (The Book of Musaqah) in the division of the open hadith dataset the museum took its reports from: reports 3962 to 4139 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 22، عنوان «کتاب المساقاۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 3962 تا 4139۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 22 de Sahih Muslim (El Libro de Musaqah) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 3962 al 4139, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
