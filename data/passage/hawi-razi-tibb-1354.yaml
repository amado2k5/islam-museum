text: "أمراض الأمعاء في القولنج وإيلاوس وأرجاع البطن الشبيهة به والرياح وخير ذلك شراب الإشقيل نافع من القولنج. الإفسنتين متى شرب مع سنبل أو ساساليوس حل النفخ، الإفسنتين إذا عجن بدهن الحناء والموم وضمد به الخاصرة سكن الوجع المزمن منها، وشراب …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 1354، يذكر المرض والمريض، والوجع، وأسماء الأمراض، وأعضاء البدن، والجراحة والختان والجبائر، والحناء دواء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 1354, that mentions illness and the sick, pain, named diseases, the organs of the body, surgery, circumcision and splints, henna as a remedy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 1354 کا اقتباس جس میں بیماری اور بیمار، درد، بیماریوں کے نام، اعضائے بدن، جراحت، ختنہ اور پٹیاں، مہندی بطور دوا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
