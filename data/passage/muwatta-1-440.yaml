summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم أن عمر بن الخطاب قال: لا يصلين أحدكم وهو ضام بين وركيه، أي وهو يدافع الحاجة؛ وهو في باب النهي عن الصلاة والإنسان يريد حاجته. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.227}"
