text: "لا يصلين أحدكم وهو ضام بين وركيه"
summary:
  ar: "أثر يرويه مالك عن زيد بن أسلم أن عمر بن الخطاب قال: لا يصلين أحدكم وهو ضام بين وركيه، أي وهو يدافع الحاجة؛ وهو في باب النهي عن الصلاة والإنسان يريد حاجته. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد. {cite:muwatta-maruf-1997 p.227}"
  tr: "Malik'in Zeyd ibn Aslam'dan rivayet ettiği bir hadiste Ömer ibn el-Hattab şöyle buyurmuştur: \"Hiçbiriniz kalçaları yukarı çekilmiş haldeyken namaz kılmasın.\" Bu, kişinin tuvalet ihtiyacını bastırdığı sırada namaz kılmasının yasaklanması kapsamına girer. Araştırmacı, bu hadisin Malik'ten Ebu Mus'ab ve Suveyd tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.227}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik dari Zayd ibn Aslam menyatakan bahwa Umar ibn al-Khattab berkata: “Tidak seorang pun di antara kalian boleh shalat dalam keadaan pinggul terangkat,” artinya dalam keadaan menahan keinginan untuk buang air besar. Hal ini termasuk dalam kategori melarang shalat dalam keadaan ingin buang air besar. Peneliti menyebutkan bahwa riwayat ini dinarasikan oleh Abu Mus'ab dan Suwayd dari Malik. {cite:muwatta-maruf-1997 p.227}"
