text: "… من نورِ موسى لا أُطيقُ الوقوفَ حينَ أراهُ وقال في رثائه : فَرَّ إِلى الجنّة حُورِيُّها وارتفعَ الحسنُ من الأرض وأصبحَ العشاقُ في مأتم بعضهمُ يبكي على بعضٍ وقال فيه : هتف الناعي بشَجْوِ الأبد إذ نعى موسى بن عبد …"
summary:
  ar: "مقطع من نفح الطيب من غصن الأندلس الرطيب، المجلد المصوَّر 1، ص 133، فيه رثاء وثناء على ميت؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يصحَّح. يجمعه متصفح أشهر ما قيل في الرثاء والنعي."
