  tr: "Ölen kişi için yazılmış bir ağıt ve övgü içeren Nafh al-Tayyib min Ghusn al-Andalus al-Ratib, Resimli Cilt 1, s. 133'ten bir alıntı; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. En ünlü ağıt ve övgüleri tarayan bir kişi tarafından derlenmiştir."
  id: "Cuplikan dari Nafh al-Tayyib min Ghusn al-Andalus al-Ratib, Jilid Bergambar 1, hlm. 133, berisi elegi dan pujian untuk almarhum; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan cuplikan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh mesin pencari elegi dan pujian paling terkenal."
