text: "إِنَّ ٱلَّذِينَ كَفَرُوا۟ يُنَادَوْنَ لَمَقْتُ ٱللَّهِ أَكْبَرُ مِن مَّقْتِكُمْ أَنفُسَكُمْ إِذْ تُدْعَوْنَ إِلَى ٱلْإِيمَـٰنِ فَتَكْفُرُونَ"
text_search: "إن الذين كفروا ينادون لمقت الله أكبر من مقتكم أنفسكم إذ تدعون إلى الإيمان فتكفرون"
translations:
  en: { text: "Lo! (on that day) those who disbelieve are informed by proclamation: Verily Allah's abhorrence is more terrible than your abhorrence one of another, when ye were called unto the faith but did refuse.", translator: "Marmaduke Pickthall", license: PD }
  ur: { text: "جن لوگوں نے کفر کیا ان سے پکار کر کہہ دیا جائے گا کہ جب تم (دنیا میں) ایمان کی طرف بلائے جاتے تھے اور مانتے نہیں تھے تو خدا اس سے کہیں زیادہ بیزار ہوتا تھا جس قدر تم اپنے آپ سے بیزار ہو رہے ہو", translator: "Fateh Muhammad Jalandhari", license: PD }
