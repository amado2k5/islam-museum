label: { ar: "الموطأ 2324 — مالك: للمكاتب أن يعجل أداء نجومه قبل محلها", en: "Muwatta 2324", es: "Muwatta 2324", fr: "Muwatta 2324", ur: "موطا 2324", tr: "Al-Muwatta 2324 — Malik: Ofisler, taksit ödemelerini vadesinden önce hızlandırabilirler.", id: "Al-Muwatta 2324 — Malik: Kantor-kantor dapat mempercepat pembayaran angsuran mereka sebelum tanggal jatuh tempo." }
summary:
  ar: "قال مالك: الأمر عندنا أن المكاتب إذا أدى جميع نجومه قبل محلها جاز ذلك له، ولم يكن لسيده أن يأبى؛ لأنه بذلك تسقط عنه كل شروط الخدمة والسفر، ولا تتم عتاقة الرجل وعليه بقية من رق، ولا تتم حرمته، ولا تجوز شهادته، ولا يجب ميراثه. ولا ينبغي للسيد أن يشترط عليه خدمة بعد عتاقته. {cite:muwatta-maruf-1997 p.358}"
  tr: "Malik şöyle dedi: Aramızda yerleşik uygulama şudur ki, eğer bir köle, özgür bırakılma sözleşmesi kapsamında tüm taksitlerini vadesinden önce öderse, bu onun için caizdir ve efendisinin bunu reddetme hakkı yoktur. Çünkü bunu yaparak, hizmet ve seyahatle ilgili tüm şartlar ortadan kalkar ve adamın özgür bırakılması, hâlâ kölelik bağları devam ettiği sürece tamamlanmış sayılmaz. Haklarına tam olarak saygı gösterilmez, tanıklığı kabul edilemez ve mirasa hak kazanamaz. Efendi, özgür bırakıldıktan sonra ondan herhangi bir hizmet talep etmemelidir. {cite:muwatta-maruf-1997 s.358}"
  id: "Malik berkata: Praktik yang berlaku di antara kita adalah jika seorang budak yang terikat kontrak pembebasan membayar semua cicilannya sebelum jatuh tempo, hal ini diperbolehkan baginya, dan tuannya tidak berhak menolak. Ini karena, dengan melakukan hal itu, semua syarat pelayanan dan perjalanan dicabut darinya, dan pembebasan orang tersebut belum lengkap selama ia masih memiliki ikatan perbudakan yang tersisa. Hak-haknya tidak sepenuhnya dihormati, kesaksiannya tidak dapat diterima, dan ia tidak berhak atas warisan. Tuan tidak boleh menetapkan kewajiban pelayanan apa pun darinya setelah pembebasannya. {cite:muwatta-maruf-1997 p.358}"
