label: { ar: "الموطأ 2324 — مالك: للمكاتب أن يعجل أداء نجومه قبل محلها", en: "Muwatta 2324" }
summary:
  ar: "قال مالك: الأمر عندنا أن المكاتب إذا أدى جميع نجومه قبل محلها جاز ذلك له، ولم يكن لسيده أن يأبى؛ لأنه بذلك تسقط عنه كل شروط الخدمة والسفر، ولا تتم عتاقة الرجل وعليه بقية من رق، ولا تتم حرمته، ولا تجوز شهادته، ولا يجب ميراثه. ولا ينبغي للسيد أن يشترط عليه خدمة بعد عتاقته. {cite:muwatta-maruf-1997 p.358}"
