text: "ه . فكتب من يمصر باستحقاق تلك التركة بفا . اخوالميت واوصل الكتاب من مصر بأنه اخو المتوفى فصادف عميد الحيوش . واتفا على روشن داره يصلى الفجر فظنه نقيبا فدفع اليه الكتاب وسأله. إيصاله الى صاحب الخبر فقضى له"
