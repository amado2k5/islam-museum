summary:
  ar: "القسم 49 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الرقاق»، ويضم فيها النصوص من 6937 إلى 6951 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 49 of Sahih Muslim (The Book of Heart-Melting Traditions) in the division of the open hadith dataset the museum took its reports from: reports 6937 to 6951 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 49، عنوان «کتاب الرقاق»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 6937 تا 6951۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 49 de Sahih Muslim (El Libro de las Tradiciones Conmovedoras) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 6937 al 6951, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du Sahih Muslim (Livre des traditions émouvantes), volume 49, qui correspond aux hadiths 6937 à 6951 de la base de données ouverte. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 49. bölümü \"Yumuşatıcı Kalpler Kitabı\" başlığını taşımakta olup, 6937'den 6951'e kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 49 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab yang Melembutkan Hati\" dan berisi teks 6937 hingga 6951, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
