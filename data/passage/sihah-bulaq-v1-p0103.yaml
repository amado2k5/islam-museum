  قال رؤية يخاطب امرأة
  أماترى دهراحذانى حفضا * أطر الصفاعين العريش القعضا • فقد أفدى مربها منقضا
  يقول ان ترى أيتها المرأة الهرم حنانى فقد كنت أفدى فى حال شبابى لهدايتى فى المفاوز
  وقوتى على السفروسمات الذون من ترين للجزم بالمجازاة ومازائدة والصناعين تنفية امرأة
  صناع واعض المقعوض وصف بالصدر كقولك ماء غور والعريش ههنا الهودج
