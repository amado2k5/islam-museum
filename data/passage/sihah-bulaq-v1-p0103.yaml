  انطيل فانقضت عليهم والقضض الحصى الصغار يقال منه قض الطعام يقض بالفتح فهو
  طعام قضض وقد قضضت منه أيضا اذا أكاته ووقع بين أضراسك حصى والقضة بالكسر
  عذرة الجارية والقضة أيضا الخصى الصغار والقضة أيضا أرض ذات حصى قال الراجز
  يصف دلوا قدوقعت فى قضة من شرج * ثم استقلت مثل شدق العلج
  وأقض الرحل مضحعه وأقض عليه المضجع أى تترب وخشن وأقض اللّٰه عليه المضجع
  تعدى ولا يتعدى واستقض مضجعه أى وجده خشنا ودرع قضاء أى خشنة المس
  لم تنسحق بعد ويتال أقض فلان اذا تتبع المطامع الدنية وجاواقضهم بقضيضهم أى جاوا
  باجمعهم قال الشعاخ
  أننى سليم قضا بقضضبها • تمح حولى بالبقيع سبالها
  وهوعنصوب على نيسة المصدرومن العسرب من يعربه ويجريه مجرى كلهم واقتض الجارية
