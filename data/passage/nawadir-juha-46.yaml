text: "… من يعطي الكثير لا يبخل بالقليل كان من عادة الشيخ أن يدعوَ اللَّهَ في وقت السحَر، ويطلب إليه أن يُعطِيَهُ ألفاً ذهباً، وأنه لا يقبلها إذا كانت تسعمائة وتسعاً وتسعين، وكان له جار يهودي، يسمع في كلُ يوم هذا الدُّعاءَ، …"
summary:
  ar: "دعا جحا بألف قطعة ذهب، فألقى جار يهودي تسعمائة وتسعًا وتسعين قطعة من المدخنة، فاحتفظ بها جحا ورفع الجار دعوى، فحاجّ جحا في المحكمة بأن الجار بخيل يريد بغله وعباءته، فرد القاضي الدعوى، ويقال إن الجار أسلم على يد جحا. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  en: "Juha prays for 1000 gold pieces; a Jewish neighbour drops 999 coins down the chimney; Juha keeps them and the neighbour sues; in court Juha argues that the neighbour is a miser who now wants his mule and cloak; the judge dismisses the claim, and the neighbour is said to have converted to Islam at Juha's hands. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  ur: "جحا نے ایک ہزار سونے کے سکوں کی دعا کی؛ ایک یہودی پڑوسی نے چمنی سے نو سو ننانوے سکے نیچے ڈالے، جحا نے وہ رکھ لیے اور پڑوسی نے مقدمہ کر دیا؛ عدالت میں جحا نے دلیل دی کہ پڑوسی کنجوس ہے اور اب اس کا خچر اور چوغہ مانگتا ہے، قاضی نے دعویٰ خارج کر دیا، اور کہا جاتا ہے کہ پڑوسی نے جحا کے ہاتھ پر اسلام قبول کر لیا۔ {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  fr: "Juha prie pour obtenir mille pièces d'or ; un voisin juif laisse tomber 999 pièces par la cheminée ; Juha les garde et le voisin porte plainte ; au tribunal, Juha soutient que le voisin est un avare qui veut maintenant sa mule et son manteau ; le juge rejette la demande, et l'on dit que le voisin se convertit à l'islam de la main de Juha. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
  es: "Juha reza pidiendo mil monedas de oro; un vecino judío deja caer 999 monedas por la chimenea; Juha se las queda y el vecino lo demanda; ante el tribunal, Juha sostiene que el vecino es un avaro que ahora quiere su mula y su capa; el juez desestima la demanda, y se dice que el vecino se convirtió al islam de manos de Juha. {cite:juha-nawadir-kubra-djuwaydi p. 26}"
