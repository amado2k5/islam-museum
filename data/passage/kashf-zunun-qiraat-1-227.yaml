text: "للشَّيخ أبي العَبّاس أحمد بن خليل الصّالحيّ. وهو الذي اختصر ابن طولون منه تأليفه المسمى ب: غاية الاعتبار فيما وُجِدَ على القُبورِ من الأشعار. أخبار ابن المَهْدي : ليوسُف بن إبراهيم. أخبار أبي عَمْرو بن العلاء : لأبي بَكْر محمد …"
