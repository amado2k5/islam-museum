text: "… اللَّهِ الْخُزَاعِيُّ الْبَصْرِيُّ، حَدَّثَنَا يَزِيدُ بْنُ هَارُونَ، أَخْبَرَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" يَأْتِي الدَّجَّالُ الْمَدِينَةَ فَيَجِدُ الْمَلاَئِكَةَ يَحْرُسُونَهَا فَلاَ يَدْخُلُهَا الطَّاعُونُ وَلاَ الدَّجَّالُ إِنْ شَاءَ اللَّهُ \". قَالَ وَفِي الْبَابِ عَنْ أَبِي هُرَيْرَةَ وَفَاطِمَةَ بِنْتِ قَيْسٍ وَأُسَامَةَ بْنِ زَيْدٍ وَسَمُرَةَ بْنِ جُنْدَبٍ وَمِحْجَنٍ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ صَحِيحٌ."
summary:
  ar: "حديث في جامع الترمذي، رقم 2242، يذكر الطاعون والوباء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2242 (Chapters On Al-Fitan), that mentions plague and epidemic. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2242، جس میں طاعون اور وبا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
