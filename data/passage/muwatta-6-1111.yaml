label: { ar: "الموطأ 1111 — هشام بن عروة عن أبيه: إذا اضطررت إلى بدنتك فاركبها ركوباً غير فادح، وإذا اضطررت إلى لبنها فاشرب بعد ما يروى فصيلها، فإذا نحرتها فانحر فصيلها معها", en: "Muwatta 1111", es: "Muwatta 1111", fr: "Muwatta 1111", ur: "موطا 1111", tr: "El-Muvatta 1111 — Hişam ibn Urve, babasından rivayetle: Kurbanlık devenizi kullanmak zorunda kalırsanız, onu size yük olmayacak şekilde sürün. Sütünü içmek zorunda kalırsanız, ancak yavrusu doyduktan sonra için. Ve eğer onu keserseniz, yavrusunu da onunla birlikte kesin.", id: "Al-Muwatta 1111 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Jika kamu terpaksa menggunakan unta kurbanmu, tunggangilah dengan cara yang tidak memberatkan. Jika kamu terpaksa meminum susunya, minumlah hanya setelah anak unta itu kenyang. Dan jika kamu menyembelihnya, sembelihlah anak unta itu bersamanya." }
summary:
  ar: "يرويه مالك عن هشام بن عروة أن أباه قال: إذا اضطررت إلى بدنتك فاركبها ركوباً غير فادح، وإذا اضطررت إلى لبنها فاشرب بعد ما يروى فصيلها، فإذا نحرتها فانحر فصيلها معها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1205) وسويد (528) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.509}"
  tr: "Malik, Hişam ibn Urve'den rivayet ettiğine göre, babasının şöyle dediğini aktarmıştır: “Eğer kurbanlık devenizi kullanmak zorunda kalırsanız, ona usulca binin. Eğer sütünü içmek zorunda kalırsanız, yavrusu doyduktan sonra için. Ve eğer onu keserseniz, yavrusunu da onunla birlikte kesin.” Araştırmacı, bunun Malik'ten Ebu Mus'ab (1205), Suveyd (528) ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.509}"
  id: "Malik meriwayatkan hadits ini dari Hisham ibn Urwah, yang mengatakan bahwa ayahnya berkata: “Jika kamu terpaksa menggunakan unta kurbanmu, tunggangilah dengan lembut. Jika kamu terpaksa meminum susunya, minumlah setelah anaknya kenyang. Dan jika kamu menyembelihnya, sembelihlah anaknya bersama unta tersebut.” Peneliti menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus’ab (1205), Suwaid (528), dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.509}"
