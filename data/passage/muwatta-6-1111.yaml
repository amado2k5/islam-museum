label: { ar: "الموطأ 1111 — هشام بن عروة عن أبيه: إذا اضطررت إلى بدنتك فاركبها ركوباً غير فادح، وإذا اضطررت إلى لبنها فاشرب بعد ما يروى فصيلها، فإذا نحرتها فانحر فصيلها معها", en: "Muwatta 1111" }
summary:
  ar: "يرويه مالك عن هشام بن عروة أن أباه قال: إذا اضطررت إلى بدنتك فاركبها ركوباً غير فادح، وإذا اضطررت إلى لبنها فاشرب بعد ما يروى فصيلها، فإذا نحرتها فانحر فصيلها معها. ويذكر المحقق أنه رواه عن مالك أبو مصعب (1205) وسويد (528) ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.509}"
