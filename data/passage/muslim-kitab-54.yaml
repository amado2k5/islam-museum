summary:
  ar: "القسم 54 من صحيح مسلم في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الفتن وأشراط الساعة»، ويضم فيها النصوص من 7235 إلى 7416 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 54 of Sahih Muslim (The Book of Tribulations and Portents of the Last Hour) in the division of the open hadith dataset the museum took its reports from: reports 7235 to 7416 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "صحیح مسلم کی کتاب 54، عنوان «کتاب الفتن واشراط الساعۃ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 7235 تا 7416۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 54 de Sahih Muslim (El Libro de las Tribulaciones y Presagios de la Última Hora) corresponde a la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 7235 al 7416, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sahih Muslim (Livre des tribulations et des présages de la fin des temps), dans la section 7235 à 7416 de la base de données ouverte. Il classe ses archives sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sahih Müslim'in 54. bölümü \"Filipinler ve Kıyamet Alametleri Kitabı\" başlığını taşımakta olup, 7235'ten 7416'ya kadar numaralandırılmış metinleri içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 54 dari Sahih Muslim, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Cobaan dan Tanda-Tanda Hari Kiamat\" dan berisi teks 7235 hingga 7416, yang diberi nomor sesuai urutan. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
