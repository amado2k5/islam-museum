text: |-
  ١ رمى وأربى لغتنان
  ٩٢
  باب الباء)
  وحل الحى حى بى سبيع • قراضية وتحن اهم إطار
  ( قرطب قرطبه صرعه على قفاه وقال
  فرحت أمشى مشية السكران * وزل خفاى فقرطباتى
  والقرطبى بتشديد الباءضرب من اللعب ⁦( قرطعب)⁩ يقال ماعندهرطعية ولا
  قذعملة ولاسعنة ولا معنة أى شئ قال أبو عبيدما وحدنا أحد ايدرى أصولها ⁦( رهب )⁩
  القرهب من الثيران المسن قال الكميت
  من الارحبيات العتاق كانها شبوب صوار فوق علياءرهب
  ( قسب القسب الصلب والقسب تريابس يتفتت فى الفم صاب النواة وقال يصف رعا
  وأسمز خطي اكأنّ كعوبه • نوى القسب قد أرمى ذراعا على العشر (
  والقسيب⁦(٢)⁩ الطويل الشديد قال ابن السكيت حررت بالنهروله قسيب أى جرية وقد
  قسب بقسب وقال عبيد
  للماءمن تحته قسيب شب القشب الخلط
  وأنشد الاصمعى للنابغة
  فيت كأن العائدات فرشنى * هراسابه يعلى قرائى ويقشب
  ونسبرقشيب أدا خلطا له فى لحم يأ كله سم فاذا أكله قتله فيؤخذمنه ريشه قال الهذلى
  بهيدع الكمى على يديه * يخزتخاله نسراقشيبا
  قوله به يعنى بالسيف والقشيب الجديد وسيف قشيب حديث عهد بالحلاء ورجل قشب
  خشب بالكسراذا كان لاخير فيه والقشب أيضا السم والجمع أقشاب عن أبى عروقال
  وقشبه قشباسقاه السم وقسب طعامه أى سمه وقشبه أيضا اذاذ كره بسوه تقول قشبه
  بقبيح اى الطخه به قال الفرّاء قشب الرجل واقتشب اذا اكتسب حدا أوذما حكاه عنه
  أبو عبيد وقشبنى ريحه تقشيبا أى آذانى كانه قال سمنى ريحه ورجل مقشب الحدب اذا مزج
  حسبه ⁦(قصب)⁩ القصب الاباء والقصباء مثله الواحدة قصبة قال سيبويه القصباء واحد
  تسوقير الكاسا لقدة التب الارى الماس اليرن اوذوب كل مالقذر
  أقامت به فابتنت خيمة • على قصب وفرات نهر
  وقال الاصمعى قصب البطحاء مماه تجرى الى عيون الركايا يقول أقامت بين قصب أى ركايا
  وماء عذب وكل عذب فرات وكل كثير برى فقد نهرواسنهر والقصب، روق الرئة وهى مخارح
  النفس ومجاريه والقصب ثساب كتان رقاق والقصب أنابيب من جوهر وفى الحديث بشر
  خديجة سيت فى الجنة من قصب وقصبة الانف عظامه وقصبة القرية وسطها وقصبة السواد
  مدينتها والقصب بالضم المعاء يقال هو يجرّ قصبه قال الراعى
  تكسوالمفارق واللبات ذا أرج * من قصب معتلف الكافوردراج
  وأمافول امرئ القيس
  والقصب مضطمر والمتن ملحوب فيريد الخصر وهو على
  الاستعارة والجمع أقصاب قال الاعشى
  وشاهدنا الجل والياسمين * والممعات باقصابها
