text: |-
  ⁦(مغط)⁩
  ٠٦٥
  أى حان له أن يرطا والمرط بالكسر واحد المروط وهى أكسية من صوف أوخز كان
  يؤتزربها قال الشاعر
  نساهم توباهافق الدرع رادة • وفى المرط الفاوان ردفهماعبل
  قوه نساهم أى تقارع وتمز طشعره أى تحات ورجل أمرط بين المرط وهو الذى قد خف
  عار ضاه من الشعر والامرط من السهام الذى قد سقطت قدذه ويقال أبضاسه-م عرط
  اذا لم تكن له قذذ قال لبيديصف الشيب
  حرط القذاذ فليس فيه مصنع • لا الريش ينفعه ولا التعقيب
  ويجوز فيه تسكين الراءفيكون جع أمرط واغماصح أن يوصفبه الواحد لما بعده
  من المع كاقال الشاعر
  وان التى هام الفواد بذكرها • رقود عن الفعشاءخرس الجبار
  وسهام مراط مثل سلب وسلاب ⁦(١)⁩ قال الراجز ذؤالة كالاقدح المراط قال أيو عمرو
  الامرط اللص حكاء عنه أبو عبيدة والمرطى ضرب من العدو قال الاصمعى هوفوق التقريب
  ودون الاهذاب وقال يصف فرسا تقريبها المرطى والشدابراق والمربطاء مابين
  السرة والعانة قال الاصمى هى ممدودة ومفه قول عمر رضى اللّٰه عنه لابى محمسذورة حين أذن
  ورفع صوته أما خشيت أن تنشق مى يطائك سط قال ابن السكيت بقال للرجل اذا
  -طاعلى الفرص وغيرها أى أدخل يده فى ظبيتها فأنتى رحها وأخرج مافيماقد منطها يسطها
  صطاوانما يفعل ذلك اذانزا على الفرس الكريم فل لتيم ويقال أيضامطت المعاءاذا
  خرطت مافيها بأصبعك تخرج ما فيها والماسط ضرب من نبات الصيف اذاره مه الابل
  خرط بطونما وماسط اسم مويه ملح وكذلك كل ما علح يمسبط البطونهوماسط والمسيها
  الماه الكدرييق فى الحوض قال الراجز
  يشرين ماء الاجن والضفيط • ولا يعف ن كدر المسسيط
  قال أبو الغمر يقال اذاسال الوادى بسيل صغير فهو مسيعاة حكاه عنه بعة وب وأصغر من
  ذلك مسيطة شط) امتشطت المرأة ومشطتها الماشطة قشطها مشطاولمة مشسيط أى
  ممدوطة والمشسطة قوع من المشط كاركبة والجلسة والمشاطة ماسقط منه والمشط بالضم
  واحد الامشاط التى يشط بها والمشط أيضانبت صغيريقال له مشط الذتب والمشط
  سلاميات ظهر القدم ومشط الكتف العظم العريض ⁦( طط)⁩. مطه يطه أى مده ومط
  حاجسه أى مدهما وتكبر وقطط أى تدد والمططة الماء انلحائرف أسفل الحوض قال حيا
  خبط النهال سمل المطائط والمطيطاء بضم الميم مدودا التختر ومد اليدين فى المشى وفى الحديث
  اذا مشت أمنى المطبطاء وخدمبتهم فارس والروم كان بأسهم بينهم ⁦(لجعط)⁩ رج-ل أمعط بين
  المعط وهو الذى لا شعر على جسده وقد معط وامتعط شعره وتعط أى تساقط من داء وضوه
  وكذاك امّعط وهوانفعل يقال امعط الحل وغيره أى اغجرد والذئب الامعط الذى
  قد نساقط شعره يقال معط الذئب ولا يقال معط شعره واص أمعط شبه بالذئب واصوص
  معط (مغط المقط المديقال مغطه فامتغط ومفط فى القوس مثل مخط وامتغط النهار
  ساح
  قوله فيكون جمع الخ وقال المترجم
  الاسهل فى ساكن الراه كونه
  مفردامثل قفل فانظره قاله نه بر
  قوله معط الذئب أى بكسر العين
  من الباب الرابع ولا يقال معط
  أى مبنيا للمجهول كذا فى
  ترجته
