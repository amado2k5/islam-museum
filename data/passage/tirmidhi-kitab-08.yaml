summary:
  ar: "القسم 8 من جامع الترمذي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الصوم عن رسول الله»، ويضم فيها النصوص من 682 إلى 808 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 8 of Jami' al-Tirmidhi (The Book on Fasting) in the division of the open hadith dataset the museum took its reports from: reports 682 to 808 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "جامع ترمذی کی کتاب 8، عنوان «کتاب الصوم عن رسول اللہ»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 682 تا 808۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 8 de Jami' al-Tirmidhi (El Libro del Ayuno) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 682 al 808, según la numeración de dicho conjunto. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a tiré ses hadiths du livre 8 de Jami' al-Tirmidhi (Le Livre du jeûne), qui correspond aux hadiths 682 à 808 de la numérotation de ce recueil. Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
