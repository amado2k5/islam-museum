label: { ar: "الموطأ 2142 — يحيى عن مالك: إذا كانت قيمة الرهن أكثر مما ادعى المرتهن أحلف على ما ادعى ثم يعطى الراهن الفضل، وإن كانت أقل أحلف على ما زعم ثم قاصه بقيمة الرهن، وخلف من عليه الحق على الفضل الباقي", en: "Muwatta 2142" }
summary:
  ar: "قال: فإن كانت قيمة الرهن أكثر مما ادعى فيه المرتهن، أحلف على ما ادعى، ثم يعطى الراهن ما فضل من قيمة الرهن. وإن كانت قيمته أقل مما يدعي فيه المرتهن، أحلف على الذي زعم أنه له فيه، ثم قاصه بما بلغ الرهن، ثم خلف الذي عليه الحق على الفضل الذي بقي للمدعى عليه بعد مبلغ ثمن الرهن. وذلك أن الذي بيده الرهن صار مدعيا على الراهن. فإن حلف بطل عنه بقية ما حلف عليه المرتهن مما ادعى فوق قيمة الرهن، وإن نكل لزمه ما بقي من حق المرتهن بعد قيمة الرهن. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
