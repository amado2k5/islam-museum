label: { ar: "الموطأ 2142 — يحيى عن مالك: إذا كانت قيمة الرهن أكثر مما ادعى المرتهن أحلف على ما ادعى ثم يعطى الراهن الفضل، وإن كانت أقل أحلف على ما زعم ثم قاصه بقيمة الرهن، وخلف من عليه الحق على الفضل الباقي", en: "Muwatta 2142", es: "Muwatta 2142", fr: "Muwatta 2142", ur: "موطا 2142", tr: "El-Muvatta 2142 — Yahya, Malik'ten rivayetle: Rehin verilen şeyin değeri rehin alanın iddia ettiğinden fazlaysa, rehin alan iddia ettiği miktara yemin eder, sonra rehin verene fazlalık verilir. Eğer daha azsa, rehin veren iddia ettiği miktara yemin eder, sonra bunu rehin verilen şeyin değerinden mahsup eder ve hak sahibi kalan fazlalık için tazmin edilir.", id: "Al-Muwatta 2142 — Yahya berdasarkan riwayat Malik: Jika nilai gadai lebih besar dari yang diklaim oleh penerima gadai, maka penerima gadai bersumpah atas apa yang diklaimnya, dan pemberi gadai diberikan kelebihannya. Jika nilainya lebih kecil, penerima gadai bersumpah atas apa yang diklaimnya, dan ia menguranginya dari nilai gadai, dan pihak yang berhak menerima ganti rugi atas kelebihan yang tersisa." }
summary:
  ar: "قال: فإن كانت قيمة الرهن أكثر مما ادعى فيه المرتهن، أحلف على ما ادعى، ثم يعطى الراهن ما فضل من قيمة الرهن. وإن كانت قيمته أقل مما يدعي فيه المرتهن، أحلف على الذي زعم أنه له فيه، ثم قاصه بما بلغ الرهن، ثم خلف الذي عليه الحق على الفضل الذي بقي للمدعى عليه بعد مبلغ ثمن الرهن. وذلك أن الذي بيده الرهن صار مدعيا على الراهن. فإن حلف بطل عنه بقية ما حلف عليه المرتهن مما ادعى فوق قيمة الرهن، وإن نكل لزمه ما بقي من حق المرتهن بعد قيمة الرهن. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
  tr: "Şöyle dedi: Eğer rehin değerinin rehin alanın talep ettiği miktardan fazla olması durumunda, rehin alan talep ettiği miktara yemin eder ve rehin verene rehin değerinin kalan kısmı verilir. Eğer rehin değerinin rehin alanın talep ettiği miktardan az olması durumunda, rehin alan kendisine ödenmesi gereken miktara yemin eder, bu miktardan rehin değeri düşülür ve daha sonra borçlu, rehin değeri ödendikten sonra alacaklıya kalan miktar için tazmin edilir. Çünkü rehin alan kişi, rehin verene karşı alacaklı konumuna gelmiştir. Eğer yemin ederse, rehin alanın rehin değerinin üzerindeki talebiyle ilgili olarak yemin ettiği kısmın kalan kısmı geçersiz sayılır. Eğer yemin etmeyi reddederse, rehin alanın hakkının rehin değeri ödendikten sonra kalan kısmından sorumlu olur. {cite:muwatta-maruf-1997 s.275} {cite:muwatta-maruf-1997 s.276}"
  id: "Dia berkata: Jika nilai jaminan lebih besar dari apa yang diklaim oleh penerima jaminan, dia bersumpah atas apa yang diklaimnya, dan kemudian pemberi jaminan diberikan sisa nilai jaminan tersebut. Jika nilainya kurang dari apa yang diklaim oleh penerima jaminan, dia bersumpah atas apa yang diklaimnya sebagai haknya, kemudian dikurangi dengan nilai jaminan, dan kemudian pihak yang berutang diberi kompensasi atas sisa jumlah yang terutang kepada penggugat setelah nilai jaminan dibayarkan. Ini karena pihak yang memegang jaminan telah menjadi penggugat terhadap pemberi jaminan. Jika dia bersumpah, sisa dari apa yang diikrarkan oleh penerima jaminan mengenai klaimnya di atas nilai jaminan tersebut dibatalkan. Jika dia menolak untuk bersumpah, dia bertanggung jawab atas sisa hak penerima jaminan setelah nilai jaminan dibayarkan. {cite:muwatta-maruf-1997 p.275} {cite:muwatta-maruf-1997 p.276}"
