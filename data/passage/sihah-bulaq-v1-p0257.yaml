  الاخيرلايد من اخذك يوما
  فاحذرى ويروى ان ابن عباس
  قال لابن الزبير حين خرج الحسين
  الى الع-ر
  راق رضى اللّٰه عنه-م
  خلالت الجوفبيضى واصفرى
  فلنصبر
  ٢ اسمه عطية وكنيته أبو
  المرقال فانظرهامش ٨٨
  ٢٨٤
  لكل اناس مقبر بفناتهم *فهم ينقصون والقبور تزيد
  وهو المقبرى" والمقبرى وقبرت الميت أقبره وأقبره قبرا أى دفسته وأذ-برنه أى أمرت بأن يقبر
  قالت تيم للحجاج أقبرنا صالحاوكان قد قدله وصلبه أى ائدّن لنا فى أن تقبره فقال لهم
  دونكموه قال ابن السكست أقبرته أى صيرت له قبرايد فن فيه وقوله تعالى ثم أمانه فأقبره أى
  جعله عمن يقبرولم يجعله يلق للكلاب وكان القبرمماا كرم به بنوآدم والقبرة واحسدة القبر
  وهوضرب من الطير قال طرفة وكان يصطادهذا الطير فى صباه
