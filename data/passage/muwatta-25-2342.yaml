label: { ar: "الموطأ 2342 — مالك: وضع السيد عن المكاتب ألفا عند موته يُحسب بقدر قيمة الكتابة", en: "Muwatta 2342", es: "Muwatta 2342", fr: "Muwatta 2342", ur: "موطا 2342", tr: "El-Muvatta 2342 — Malik: Üstat, vefatı üzerine katiplerin eserlerinin değerine göre hesaplanan bin lirayı katipler adına miras bıraktı.", id: "Al-Muwatta 2342 — Malik: Sang guru memberikan seribu kepada para juru tulis pada saat kematiannya, yang dihitung berdasarkan nilai pekerjaan juru tulis tersebut." }
summary:
  ar: "قال مالك في مكاتب لسيده عليه عشرة آلاف درهم، فيضع عنه عند موته ألف درهم: يُقوَّم المكاتب فينظر كم قيمته؛ فإن كانت قيمته ألف درهم، فالموضوع عنه عُشر الكتابة، وذلك في القيمة مئة درهم، فيصير إلى عُشر القيمة نقدا. ولو فعل ذلك لم يُحسب في ثلث مال الميت إلا قيمة المكاتب، وإن كان الموضوع نصف الكتابة حُسب نصف القيمة. {cite:muwatta-maruf-1997 p.366}"
  tr: "Malik, efendisine on bin dirhem borcu olan ve ölümünden sonra efendisi borcunu bin dirhem azaltan bir köle hakkında şöyle demiştir: Kölenin değeri belirlenir. Değeri bin dirhem ise, azat bedelinin onda biri, yani yüz dirhem azaltılır. Böylece köle, değerinin onda birini nakit olarak alır. Bu şekilde yapılırsa, ölen kişinin mirasının üçte birine sadece kölenin değeri dahil edilir. Azat bedelinin yarısı azaltılırsa, değerin yarısı dahil edilir. {cite:muwatta-maruf-1997 s.366}"
  id: "Malik berkata mengenai seorang budak yang berutang kepada tuannya sepuluh ribu dirham, dan setelah kematiannya, tuannya mengurangi utang tersebut sebesar seribu dirham: Budak itu dinilai untuk menentukan nilainya. Jika nilainya seribu dirham, maka sepersepuluh dari biaya pembebasan dikurangi, yaitu seratus dirham. Dengan demikian, ia menerima sepersepuluh dari nilainya dalam bentuk tunai. Jika ini dilakukan, hanya nilai budak yang termasuk dalam sepertiga harta warisan almarhum. Jika setengah dari biaya pembebasan dikurangi, maka setengah dari nilainya termasuk. {cite:muwatta-maruf-1997 p.366}"
