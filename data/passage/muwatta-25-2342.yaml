label: { ar: "الموطأ 2342 — مالك: وضع السيد عن المكاتب ألفا عند موته يُحسب بقدر قيمة الكتابة", en: "Muwatta 2342" }
summary:
  ar: "قال مالك في مكاتب لسيده عليه عشرة آلاف درهم، فيضع عنه عند موته ألف درهم: يُقوَّم المكاتب فينظر كم قيمته؛ فإن كانت قيمته ألف درهم، فالموضوع عنه عُشر الكتابة، وذلك في القيمة مئة درهم، فيصير إلى عُشر القيمة نقدا. ولو فعل ذلك لم يُحسب في ثلث مال الميت إلا قيمة المكاتب، وإن كان الموضوع نصف الكتابة حُسب نصف القيمة. {cite:muwatta-maruf-1997 p.366}"
