text: "ما قاله القضاة أبو الحسن علي الماوردي. وقال الحسين الحليمي في كتابه المترجم ب(المنهاج) : وينبغي للإمام ألا يولي الحكم بين الناس إلا من جمع إلى العلم السكينة والتنبت، وإلى الفهم الصبر والحلم، وكان عدلا أمينا نزها عن المطاعم الدنية،"
