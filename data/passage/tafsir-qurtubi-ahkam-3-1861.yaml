text: "- صورة الناء، الأية: لمجتنب الكبائر وممتثل الفرائض تكفير صغائره قطعاً لكانت له في حكم المباح الذي يقطع بأَلا تِباعة فيه، وذلك نقض لعُرَى الشريعة. ولا صغيرة عندنا. قال القُشيريّ عبد الرحيم: والصحيح أنها كبائر ولكن بعضها أعظم وقعاً من …"
summary:
