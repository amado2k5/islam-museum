text: "… كلَّا الهمزة : - فيحتمل الأمرين. وقد اختلف القراء في الوقف عليها. نمنهم: من يقف عليها أينما وقعت، وغلب عليها معنى الزجر. ومنهم : من يقف دونها أينما وقعت ويبتدئ بها وغلب عليها معنى الزجر. ومنهم: من يقف دونها أينما …"
summary:
  ar: "مقطع من البرهان في علوم القرآن للزركشي، المجلد المصوَّر 2، ص 1117، يذكر قراءات القرآن، والقراء؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
