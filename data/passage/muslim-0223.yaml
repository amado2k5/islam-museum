label: { ar: "مسلم 223 — الطهور شطر الإيمان", en: "Muslim 223 — Purity is half of faith" }
text: "قال رسول الله: «الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن ما بين السموات والأرض، والصلاة نور، والصدقة برهان، والصبر ضياء، والقرآن حجة لك أو عليك»"
summary:
  ar: "رواية أبي مالك الأشعري، أول حديث في كتاب الطهارة من صحيح مسلم؛ مقياس الأعمال في الميزان: الطهور والحمد والصلاة والصدقة والصبر والقرآن."
