text: "اختلاف الناس يالمفضي إلى الشقاق والعدوان ولا سيما الاختلاف في كتاب الله الذي أنزله لإزالة الشقاق بحكمه، وإدالة الوحدة والوفاق منه، وتقدم بيانه وحكمته في تفسير آية البقرة (٢١٣) وفي غيرها وسنعود إلى بيان حكمته وحكمة خلق الإنسان مستعدا للاختلاف"
