text: "… إليه راية الرؤساء لمعروفة بالعقاب، وكان لا يحبسها إلاَّ رئيس، فإذا حميت الحرب اجتمعت قريش، فوضعت تلك الراية بيد الرئيس. ويقال : كان أفضل قريش في الجاهلية رأياً ثلاثة : عتبة، وأبو جهل، وأبو سفيان، فلمًا أتى اللّٰه بالإسلام أدبروا …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 3، ص 813، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 3, p. 813, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 3، ص 813 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
