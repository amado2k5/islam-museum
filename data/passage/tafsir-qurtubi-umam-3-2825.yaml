  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin 3. cildinin 2825. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Tarayıcı tarafından Müslüman olmayan milletler, dinler, mezhepler ve halklar için derlenmiştir."
