text: "… الزهريّ: أن العرب وفارس والروم وأهل الشام وأهل اليمن من ولد سَام بن نوح. والسند والهند والزّنج والحبشة والزُّطّ والنُّوبة، وكلُّ جلد أسود من ولد حَامٍ بن نوح والترك وَبَرْبَرْ ووراء الصين ويأجوج ومأجوج والصقالبة كلهم من ولد يَافِتَ بن …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 2825، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
