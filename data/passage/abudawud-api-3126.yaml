text: "… عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ \" وُلِدَ لِيَ اللَّيْلَةَ غُلاَمٌ فَسَمَّيْتُهُ بِاسْمِ أَبِي إِبْرَاهِيمَ \". فَذَكَرَ الْحَدِيثَ قَالَ أَنَسٌ لَقَدْ رَأَيْتُهُ يَكِيدُ بِنَفْسِهِ بَيْنَ يَدَىْ رَسُولِ اللَّهِ فَدَمَعَتْ عَيْنَا رَسُولِ اللَّهِ فَقَالَ \" تَدْمَعُ الْعَيْنُ وَيَحْزَنُ الْقَلْبُ وَلاَ نَقُولُ إِلاَّ مَا يَرْضَى رَبُّنَا إِنَّا بِكَ يَا إِبْرَاهِيمُ لَمَحْزُونُونَ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 3126، فيه رثاء وثناء على ميت. يجمعه متصفح أشهر ما قيل في الرثاء والنعي مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين وما في الكتب المحصودة في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 3126 (Funerals (Kitab Al-Jana'iz)), that carries an elegy or praise of the dead. The Elegy and Death-Announcement Browser lists it with the texts of the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors and the harvested books on this subject."
  ur: "سنن ابی داؤد کی حدیث نمبر 3126، جس میں مرثیہ یا میت کی تعریف ہے۔ مرثیے اور وفات کی خبر کے مشہور اقوال کا براؤزر اسے قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور جمع شدہ کتابوں کی عبارتوں کے ساتھ درج کرتا ہے۔"
  fr: "Un récit dans Sunan Abi Dawud, n° 3126, qui contient une élégie ou un éloge du défunt. Le navigateur des élégies et des annonces de décès le recense avec les textes du Coran, de la Sunna, de la sîra, les récits des Compagnons et des Successeurs et les livres moissonnés sur ce sujet."
  es: "Un relato en Sunan Abi Dawud, n.º 3126, que contiene una elegía o elogio del difunto. El navegador de elegías y anuncios de fallecimiento lo recoge junto con los textos del Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros cosechados sobre este tema."
  tr: "Sünen Ebu Davud'da yer alan 3126 numaralı hadis, vefat edenler için övgü ve ağıtlar içermektedir. Bu derleme, Kur'an, Sünnet, Peygamberin biyografisi, Sahabeler ve haleflerinin rivayetleri ve diğer ilgili kitaplardan metinlerle birlikte en ünlü ağıt ve ağıtlardan bazılarını içermektedir."
  id: "Sebuah hadits dalam Sunan Abi Dawud, no. 3126, berisi pujian dan sanjungan untuk orang yang telah meninggal. Kompilasi ini mencakup beberapa pujian dan ratapan yang paling terkenal, bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, catatan dari para Sahabat dan Penerus mereka, dan buku-buku relevan lainnya."
