text: "… بنت قرطة. فلما قفلت وكبت دابتها، فوقصت ' بها فسقطت عنها فاتت. خدمة النساء فى الجهاد فى سبيل اللّٰه اخرج الطبرانى عن ام سليما تالت : كان النبي يغزو معه نسوة من الأنصار، فتسقى المرضى وتداوى الجرحى • قال الهيثمى …"
summary:
  ar: "مقطع من حياة الصحابة للكاندهلوي، المجلد المصوَّر 2، ص 601، يذكر المرض والمريض، ومداواة الجراح، ومداواة النساء للجرحى، والتداوي؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Kandahlawi's Hayat al-Sahaba, scan volume 2, p. 601, that mentions illness and the sick, the treatment of wounds, women treating the wounded, seeking treatment; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "حیاۃ الصحابہ، کاندھلوی، اسکین جلد 2، ص 601 کا اقتباس جس میں بیماری اور بیمار، زخموں کا علاج، خواتین کا زخمیوں کا علاج، علاج کرانا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de Hayat al-Sahaba de al-Kandahlawi, volumen escaneado 2, pág. 601, que menciona la enfermedad y los enfermos, el tratamiento de las heridas, las mujeres que atienden a los heridos y la búsqueda de tratamiento; tomado del escaneo leído por máquina, citado dentro de las cuarenta palabras según la política de fuentes."
  fr: "Un extrait de Hayat al-Sahaba d'al-Kandahlawi, volume 2 scanné, p. 601, qui mentionne la maladie et les malades, le traitement des blessures, les femmes soignant les blessés, la recherche de soins; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Kandhlawi'nin \"Sahabelerin Hayatları\" adlı eserinin resimli 2. cildinin 601. sayfasında yer alan bir alıntıda, hastalık ve hastalar, yaraların tedavisi, kadınların yaralıları tedavi etmesi ve tıbbi tedavi konularına değinilmektedir; bu alıntı, makine tarafından okunabilir resimli versiyondan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir."
