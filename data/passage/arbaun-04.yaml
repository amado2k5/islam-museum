ref: '4'
label:
  ar: الأربعون 4 — يجمع خلقه في بطن أمه
  en: Arba'un 4 — the creation gathered in the womb
  es: "Arba'un 4 — la creación reunida en el vientre"
  fr: "Arba'un 4 — la création rassemblée dans le ventre maternel"
  ur: "اربعون 4 - رحم میں جمع مخلوق"
  tr: "Kırkıncı (4) – Yaratılışı annesinin rahminde toplanmıştır."
  id: "Yang keempat puluh (4) – Penciptaannya terkumpul di dalam rahim ibunya"
summary:
  ar: 'حديث عبد الله بن مسعود، وهو الحديث الرابع في الأربعين النووية وفي شرح ابن رجب، وفيه أن خلق الإنسان يجمع في بطن أمه أربعين يوماً نطفة ثم علقة مثل ذلك ثم مضغة مثل ذلك، ثم يبعث الله الملك فينفخ فيه الروح ويؤمر بأربع كلمات: بكتب رزقه وعمله وأجله وشقي أو سعيد، وفيه أن الرجل ليعمل بعمل أهل الجنة حتى ما يكون بينه وبينها إلا ذراع فيسبق عليه الكتاب؛ متفق على صحته، رواه البخاري ⁦(3208، 3332، 6594، 7454)⁩ ومسلم (2643) من طريق الأعمش عن زيد بن وهب عن ابن مسعود، وأخرجه أيضاً أحمد ⁦(1/382 و414 و430)⁩ وأبو داود (4708) وابن ماجه (76) والترمذي (2137) وغيرهم؛ شرحه ابن رجب في أطوار الجنين وكتابة المقادير والخواتيم ⁦(جامع العلوم والحكم ص 131–154)⁩.'
  en: 'Abdullah ibn Masud''s hadith, the fourth of al-Nawawi''s Forty and of Ibn Rajab''s commentary: a person''s creation is gathered in his mother''s womb — forty days as a drop, then a clinging clot for the like, then a morsel of flesh for the like — then God sends the angel who breathes the spirit into him and is ordered to write four things: his provision, his work, his term and whether he is wretched or happy; and that a man may do the deeds of the people of Paradise until only a cubit remains between him and it, then what is written overtakes him. Agreed upon as sound; transmitted by al-Bukhari (3208, 3332, 6594, 7454) and Muslim (2643) through al-A''mash from Zayd ibn Wahb from Ibn Masud, and also by Ahmad (1/382, 414, 430), Abu Dawud (4708), Ibn Majah (76), al-Tirmidhi (2137) and others; Ibn Rajab comments on the stages of the embryo, the writing of destinies and deeds-by-endings (Jami'' al-Ulum wal-Hikam pp. 131–154).'
  es: "Hadiz de Abdullah ibn Masud, el cuarto de los Cuarenta de al-Nawawi y del comentario de Ibn Rajab: la creación de una persona se reúne en el vientre de su madre —cuarenta días como una gota, luego un coágulo adherido para lo mismo, luego un bocado de carne para lo mismo— luego Dios envía al ángel que le infunde el espíritu y se le ordena escribir cuatro cosas: su sustento, su obra, su duración y si es desdichado o feliz; y que un hombre puede hacer las obras de la gente del Paraíso hasta que solo quede un codo entre él y él, entonces lo que está escrito lo alcanza. Aceptado como auténtico; transmitido por al-Bukhari (3208, 3332, 6594, 7454) y Muslim (2643) a través de al-A'mash de Zayd ibn Wahb de Ibn Masud, y también por Ahmad (1/382, 414, 430), Abu Dawud (4708), Ibn Majah (76), al-Tirmidhi (2137) y otros; Ibn Rajab comenta sobre las etapas del embrión, la escritura de destinos y los hechos por finales (Jami' al-Ulum wal-Hikam pp. 131–154)."
  fr: "Le hadith d'Abdullah ibn Masud, le quatrième des Quarante d'al-Nawawi et commenté par Ibn Rajab, relate que la création de l'homme commence dans le ventre de sa mère: quarante jours sous forme de goutte, puis un caillot de sang pendant quarante jours, puis un morceau de chair pendant quarante jours. Ensuite, Dieu envoie l'ange qui insuffle l'esprit en lui et reçoit l'ordre d'inscrire quatre choses: sa subsistance, son œuvre, sa durée de vie et s'il sera malheureux ou heureux. L'homme peut accomplir les œuvres des gens du Paradis jusqu'à ce qu'il ne lui reste qu'une coudée pour l'atteindre, alors ce qui est inscrit le rattrapera. Ce hadith est unanimement reconnu comme authentique. transmis par al-Bukhari (3208, 3332, 6594, 7454) et Muslim (2643) par l'intermédiaire d'al-A'mash de Zayd ibn Wahb d'Ibn Masud, et aussi par Ahmad (1/382, 414, 430), Abu Dawud (4708), Ibn Majah (76), al-Tirmidhi (2137) et d'autres; Ibn Rajab commente les étapes de l'embryon, l'écriture des destins et les actes par les fins (Jami' al-Ulum wal-Hikam pp. 131–154)."
  ur: "عبداللہ بن مسعود کی حدیث، النووی کی چالیسویں اور ابن رجب کی تفسیر کی چوتھی: انسان کی تخلیق ماں کے پیٹ میں جمع ہوتی ہے - چالیس دن ایک قطرہ کی طرح، پھر اس طرح کے لیے ایک لٹکا ہوا لوتھڑا، پھر اسی طرح کے لیے گوشت کا ایک لقمہ - پھر اللہ فرشتہ بھیجتا ہے، جو اس کی روح کو چار چیزیں لکھتا ہے، اس کی روح کو لکھتا ہے۔ اور خواہ وہ بدبخت ہو یا خوش۔ اور یہ کہ آدمی اہل جنت کے اعمال کرے یہاں تک کہ اس کے اور اس کے درمیان صرف ایک ہاتھ رہ جائے پھر جو کچھ لکھا ہے وہ اس پر آ جائے گا۔ آواز کے طور پر اتفاق کیا؛ البخاری ⁦(3208، 3332، 6594، 7454)⁩ اور مسلم (2643) نے العماش کے ذریعے زید بن وہب سے ابن مسعود سے، اور احمد ⁦(1/382، 414، 430)⁩، ابوداؤد (4708)، المجاہدین (1/382) اور دیگر؛ ابن رجب جنین کے مراحل، تقدیر کی تحریر اور اعمال بہ آخر پر تبصرہ کرتے ہیں ⁦(جامع العلوم والحکم صفحہ 131-154)⁩۔"
  tr: "Abdullah bin Mesud'un hadisi, El-Arba'in el-Nawawiyyah'da dördüncü hadis olup İbn Receb'in şerhinde de yer almaktadır. Bu hadiste, insanın yaratılışının kırk gün boyunca annesinin rahminde sperm olarak, sonra benzer bir süre pıhtı olarak, sonra da benzer bir süre et yığını olarak kaldığı belirtilmektedir. Ardından Allah, ona ruh üfleyen meleği gönderir ve meleğe dört şeyi yazması emredilir: rızkını, amellerini, ömrünü ve bereketli mi yoksa mutsuz mu olacağını yazması. Ayrıca, bir insan cennet ehlinin amellerini, cennete bir kol mesafesi kalana kadar işleyebilir, sonra yazılanlar onu yakalar. Bu hadisin sahih olduğu konusunda ittifak vardır. Buhari (3208, 3332, 6594, 7454) ve Müslim (2643) tarafından El-A'maş'tan, o da Zeyd bin Vahb'tan, o da İbn Mesud'dan rivayet edilmiştir. Bu hadis ayrıca Ahmed (1/382, 414 ve 430), Ebu Davud (4708), İbn Majah (76), Tirmizi (2137) ve diğerleri tarafından da rivayet edilmiştir. İbn Receb bunu cenin evrelerinde ve kaderlerin ve mühürlerin yazımında açıklamıştır (Cami'ül-Ulum ve El-Hikam, s. 131-154)."
  id: "Hadits Abdullah bin Masoud, yang merupakan hadits keempat dalam Al-Arba’in Al-Nawawiyyah dan dalam penjelasan Ibn Rajab, menyatakan bahwa penciptaan manusia terkumpul di dalam rahim ibunya selama empat puluh hari sebagai sperma, kemudian menjadi segumpal darah selama periode yang sama, kemudian menjadi segumpal daging selama periode yang sama. Kemudian Allah mengutus malaikat yang meniupkan ruh ke dalam dirinya dan diperintahkan untuk menulis empat hal: untuk menulis rezekinya, amal perbuatannya, umurnya, dan apakah ia akan sengsara atau diberkati. Hadits ini juga menyatakan bahwa seseorang dapat melakukan amal perbuatan penghuni Surga hingga hanya tersisa sejauh lengan antara dirinya dan Surga, kemudian apa yang telah tertulis akan menimpanya. Hadits ini disepakati sebagai sahih. Diriwayatkan oleh Al-Bukhari (3208, 3332, 6594, 7454) dan Muslim (2643) dari Al-A’mash dari Zaid bin Wahb dari Ibn Masoud. Hadits ini juga diriwayatkan oleh Ahmad (1/382, 414, dan 430), Abu Dawud (4708), Ibn Majah (76), Al-Tirmidhi (2137), dan lainnya. Ibn Rajab menjelaskannya dalam tahapan janin dan penulisan takdir serta segel (Jami’ Al-‘Ulum wa Al-Hikam, hlm. 131–154)."
