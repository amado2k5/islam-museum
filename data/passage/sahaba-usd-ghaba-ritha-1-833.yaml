text: "… وما أدري ما بفعل بي! أحمد. واختلف الناس في المرأة التي قال لها رسول اللّٰه ال هذا، فقيل: كانت أم السائب زوجته. وقيل: أم العلاء الأنصارية، وكان نزل عليها. وقيل: كانت أُم خارجة بن زيد. وقالت امرأته ترثيه : عُثْمَةُ …"
