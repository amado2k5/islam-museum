text: "… في العضل المحركة للساعد قبضاً وبسطا قال الشيخ الرئيس رحمة اللّٰه عليه العضل المحركة للساعد... إلى قوله فالباسطة زوج أحد فرديه. الشرح قد علمت من كلامنا في العظام أن هذا المفصل له حركة انقباض وانبساط وحركة انكباب وانبطاح. وهذه الحركات …"
