label: { ar: "الموطأ 1884 — مالك: لا تحل صبرة الحنطة بصبرة الحنطة، ولا بأس بصبرة الحنطة بصبرة التمر يدا بيد، لأنه لا بأس أن تشترى الحنطة بالتمر جزافا", en: "Muwatta 1884", es: "Muwatta 1884", fr: "Muwatta 1884", ur: "موطا 1884", tr: "El-Muvatta 1884 — Malik: Bir yığın buğdayı bir yığın buğdayla değiştirmek caiz değildir, fakat bir yığın buğdayı bir yığın hurmayla elden ele değiştirmekte bir sakınca yoktur, çünkü buğdayı hurma ile birlikte toptan almak caizdir.", id: "Al-Muwatta 1884 — Malik: Tidak diperbolehkan menukar setumpuk gandum dengan setumpuk gandum, tetapi tidak ada salahnya menukar setumpuk gandum dengan setumpuk kurma secara langsung, karena diperbolehkan membeli gandum dengan kurma dalam jumlah besar." }
summary:
  ar: "قال مالك: ولا تحل صبرة الحنطة بصبرة الحنطة. ولا بأس بصبرة الحنطة بصبرة التمر، يدا بيد، وذلك أنه لا بأس أن تشترى الحنطة بالتمر جزافا. {cite:muwatta-maruf-1997 p.174} {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik şöyle dedi: Bir buğday yığınını başka bir buğday yığınıyla değiştirmek caiz değildir. Ancak, bir buğday yığınını bir hurma yığınıyla elden ele değiştirmekte bir sakınca yoktur, çünkü buğdayı hurma ile birlikte toptan almak caizdir. {cite:muwatta-maruf-1997 s.174} {cite:muwatta-maruf-1997 s.175}"
  id: "Malik berkata: Tidak diperbolehkan menukar satu tumpukan gandum dengan tumpukan gandum lainnya. Namun, tidak ada salahnya menukar satu tumpukan gandum dengan satu tumpukan kurma, secara langsung, karena diperbolehkan membeli gandum dengan kurma dalam jumlah besar. {cite:muwatta-maruf-1997 p.174} {cite:muwatta-maruf-1997 p.175}"
