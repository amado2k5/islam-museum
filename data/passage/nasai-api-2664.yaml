label: { ar: "سنن النسائي 2664 — الأب والأبوة", en: "Sunan al-Nasa'i 2664 — the father and fatherhood", ur: "سنن نسائی 2664 — باپ اور والدیت", es: "Sunan al-Nasa'i 2664 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2664 — Le père et la paternité", tr: "Sunan an-Nasa'i 2664 — Baba ve Babalık", id: "Sunan an-Nasa'i 2664 — Sang Ayah dan Peran Ayah" }
text: "… بْنُ بِلاَلٍ، قَالَ حَدَّثَنِي يَحْيَى، - وَهُوَ ابْنُ سَعِيدٍ الأَنْصَارِيُّ - قَالَ سَمِعْتُ الْقَاسِمَ بْنَ مُحَمَّدٍ، يُحَدِّثُ عَنْ أَبِيهِ، عَنْ أَبِي بَكْرٍ، أَنَّهُ خَرَجَ حَاجًّا مَعَ رَسُولِ اللَّهِ حَجَّةَ الْوَدَاعِ وَمَعَهُ امْرَأَتُهُ أَسْمَاءُ بِنْتُ عُمَيْسٍ الْخَثْعَمِيَّةُ فَلَمَّا كَانُوا بِذِي الْحُلَيْفَةِ وَلَدَتْ أَسْمَاءُ مُحَمَّدَ بْنَ أَبِي بَكْرٍ فَأَتَى أَبُو بَكْرٍ النَّبِيَّ فَأَخْبَرَهُ فَأَمَرَهُ رَسُولُ اللَّهِ أَنْ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2664، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2664 (The Book of Hajj), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2664، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2664 (El Libro del Hajj), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan al-Nasa'i, n° 2664 (Le Livre du Hajj), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 2664 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2664, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
