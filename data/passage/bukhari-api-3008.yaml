text: "حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنْ عَمْرٍو، سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِما ـ قَالَ لَمَّا كَانَ يَوْمَ بَدْرٍ أُتِيَ بِأُسَارَى، وَأُتِيَ بِالْعَبَّاسِ وَلَمْ يَكُنْ عَلَيْهِ ثَوْبٌ، فَنَظَرَ النَّبِيُّ لَهُ قَمِيصًا فَوَجَدُوا قَمِيصَ عَبْدِ اللَّهِ بْنِ أُبَىٍّ يَقْدُرُ عَلَيْهِ، فَكَسَاهُ النَّبِيُّ إِيَّاهُ، فَلِذَلِكَ نَزَعَ النَّبِيُّ قَمِيصَهُ الَّذِي أَلْبَسَهُ. قَالَ ابْنُ عُيَيْنَةَ كَانَتْ لَهُ …"
summary:
  ar: "حديث في صحيح البخاري، رقم 3008، فيه ذكر أمم وأديان وشعوب غير مسلمة. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 3008 (Fighting for the Cause of Allah (Jihaad)), with mentions of non-Muslim nations, religions and peoples. The Umam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the non-Muslim nations, religions, sects and peoples."
  ur: "صحیح بخاری کی حدیث نمبر 3008، جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
