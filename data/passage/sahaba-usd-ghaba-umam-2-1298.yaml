text: "… بن قريش، شهد بنيان الكعبة مرتين، مرة في الجاهلية عياش، أنبأنا أبو غسان محمد بن مطرف، عن حين بنتها قريش، ومرة حين بناها ابنُ الزبير. إسحاق بن عبد الله بن أبي فروة، عن ابن أبي جُنَيدة وقيل: توفي أيام معاوية، …"
summary:
