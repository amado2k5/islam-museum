label: { ar: "الموطأ 1739 — مالك في العبد يطلق أمته طلاقا رجعيا ثم يموت وهي في عدتها: تعتد عدة الأمة المتوفى عنها زوجها، فإن عتقت ثم مات وهي في عدة طلاقه اعتدت عدة الحرة", en: "Muwatta 1739", es: "Muwatta 1739", fr: "Muwatta 1739", ur: "موطا 1739", tr: "El-Muvatta 1739 — Malik, kölesini geri alınabilir bir boşanma ile boşayan ve köle henüz bekleme süresi içindeyken ölen bir kölenin durumu hakkında şöyle diyor: Kocası ölmüş bir kölenin bekleme süresini tutar. Eğer azat edildikten sonra boşanmanın ardından bekleme süresi içindeyken ölürse, azat edilmiş bir kadının bekleme süresini tutar." }
summary:
  ar: "قال مالك في العبد يطلق أمته طلاقا لم يبتها فيه، وله عليها الرجعة، ثم يموت وهي في عدتها من الطلاق: إنها تعتد عدة الأمة المتوفى عنها زوجها، شهرين وخمس ليال. وإن عتقت وله عليها رجعة، ثم اختارت فراقه بعد العتق حتى يموت وهي في عدتها من طلاقه، اعتدت عدة الحرة المتوفى عنها زوجها، أربعة أشهر وعشرا، لأن عدة الوفاة إنما وقعت عليها بعد أن عتقت. {cite:muwatta-maruf-1997 p.109}"
  tr: "Malik, kölesinin kadın kölesinden kesinleşmemiş bir boşanma ile boşandığı ve onu geri alma hakkına sahip olduğu, ancak kadın henüz boşanma bekleme süresindeyken kölenin ölmesi durumunda, kadının kocasının ölüm bekleme süresini, yani iki ay beş geceyi, gözlemlediğini söylemiştir. Eğer kadın azat edilirse ve kölenin onu geri alma hakkı varsa ve kadın azat edildikten sonra, boşanma bekleme süresindeyken kölenin ölümüne kadar ondan ayrılmayı seçerse, kocasının ölüm bekleme süresini, yani dört ay on günü gözlemler; çünkü ölüm bekleme süresi ancak azat edildikten sonra kadın için geçerlidir. {cite:muwatta-maruf-1997 s.109}"
  id: "Malik berkata mengenai seorang budak yang menceraikan budak perempuannya dengan perceraian yang belum final, dan ia berhak untuk mengambilnya kembali, lalu ia meninggal dunia sementara budak perempuan itu masih dalam masa iddah akibat perceraian: budak perempuan itu menjalani masa iddah budak perempuan yang suaminya telah meninggal, yaitu dua bulan lima malam. Jika ia dibebaskan dan budak laki-laki itu berhak untuk mengambilnya kembali, dan kemudian ia memilih untuk berpisah darinya setelah pembebasannya hingga budak laki-laki itu meninggal dunia sementara ia masih dalam masa iddah akibat perceraian, maka ia menjalani masa iddah perempuan merdeka yang suaminya telah meninggal dunia, yaitu empat bulan sepuluh hari, karena masa iddah kematian hanya berlaku baginya setelah ia dibebaskan. {cite:muwatta-maruf-1997 p.109}"
