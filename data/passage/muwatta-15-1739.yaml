label: { ar: "الموطأ 1739 — مالك في العبد يطلق أمته طلاقا رجعيا ثم يموت وهي في عدتها: تعتد عدة الأمة المتوفى عنها زوجها، فإن عتقت ثم مات وهي في عدة طلاقه اعتدت عدة الحرة", en: "Muwatta 1739" }
summary:
  ar: "قال مالك في العبد يطلق أمته طلاقا لم يبتها فيه، وله عليها الرجعة، ثم يموت وهي في عدتها من الطلاق: إنها تعتد عدة الأمة المتوفى عنها زوجها، شهرين وخمس ليال. وإن عتقت وله عليها رجعة، ثم اختارت فراقه بعد العتق حتى يموت وهي في عدتها من طلاقه، اعتدت عدة الحرة المتوفى عنها زوجها، أربعة أشهر وعشرا، لأن عدة الوفاة إنما وقعت عليها بعد أن عتقت. {cite:muwatta-maruf-1997 p.109}"
