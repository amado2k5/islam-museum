label: { ar: "الموطأ 1560 — علي بن أبي طالب: نهى رسول الله عن متعة النساء يوم خيبر، وعن أكل لحوم الحمر الأنسية", en: "Muwatta 1560", es: "Muwatta 1560", fr: "Muwatta 1560", ur: "موطا 1560", tr: "El-Muvatta 1560 — Ali ibn Abi Talib: Allah'ın Resulü, Hayber günü mut'ah (geçici nikah) yapmayı ve evcil eşek eti yemeyi yasaklamıştır.", id: "Al-Muwatta 1560 — Ali ibn Abi Talib: Rasulullah SAW melarang pernikahan musyawarah pada hari Khaybar, dan memakan daging keledai peliharaan." }
text: "مُتْعةِ النِّساءِ يَوْمَ خَيْبِرَ"
summary:
  ar: "يروي مالك عن ابن شهاب عن عبد الله والحسن ابني محمد بن علي بن أبي طالب عن أبيهما عن علي بن أبي طالب أن رسول الله نهى عن متعة النساء يوم خيبر، وعن أكل لحوم الحمر الأهلية. {cite:muwatta-maruf-1997 p.50}"
  tr: "Malik, İbn Şihab'dan, o da Muhammed ibn Ali ibn Abi Talib'in oğulları Abdullah ve Hasan'dan, o da babalarından, o da Ali ibn Abi Talib'den rivayetle, Allah Resulü'nün Hayber günü mut'ah evliliğini yasakladığını ve evcil eşek etinin yenmesini yasakladığını nakletmiştir. {cite:muwatta-maruf-1997 s.50}"
  id: "Malik meriwayatkan dari Ibnu Shihab, dari Abdullah dan al-Hasan, putra-putra Muhammad ibn Ali ibn Abi Talib, dari ayah mereka, dari Ali ibn Abi Talib, bahwa Rasulullah melarang pernikahan mu'ah pada hari Khaybar, dan melarang memakan daging keledai. {cite:muwatta-maruf-1997 p.50}"
