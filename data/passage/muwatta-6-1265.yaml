label: { ar: "الموطأ 1265 — مالك في من جهل أو نسي صيام ثلاثة أيام في الحج، أو مرض فيها حتى يقدم بلده: يهدي إن وجد، وإلا فيصوم", en: "Muwatta 1265", es: "Muwatta 1265", fr: "Muwatta 1265", ur: "موطا 1265", tr: "El-Muvatta 1265 — Malik, Hac sırasında üç gün oruç tutmayı bilmeyen veya unutan ya da Hac esnasında hastalanıp ülkesine dönen kimse hakkında şöyle demiştir: Eğer bir kurban bulabilirse kurban kesmeli, bulamazsa oruç tutmalıdır.", id: "Al-Muwatta 1265 — Malik berkata tentang seseorang yang tidak mengetahui atau lupa berpuasa tiga hari selama haji, atau jatuh sakit selama haji hingga kembali ke negaranya: Hendaknya ia menyembelih hewan kurban jika ia dapat menemukannya, jika tidak, hendaknya ia berpuasa." }
summary:
  ar: "يقول مالك في الذي يجهل أو ينسى صيام ثلاثة أيام في الحج، أو يمرض فيها فلا يصومها حتى يقدم بلده، إنه يهدي إن وجد هديا، وإلا فليصم ثلاثة أيام في أهله، وسبعة بعد ذلك. {cite:muwatta-maruf-1997 p.561}"
  tr: "Malik, Hac sırasında üç gün oruç tutmayı bilmeyen veya unutan, ya da hastalanıp eve dönene kadar oruç tutmayan kimse için, eğer bulabilirse kurban kesmesini; bulamazsa evde üç gün, ondan sonra da yedi gün daha oruç tutmasını söyler. {cite:muwatta-maruf-1997 s.561}"
  id: "Malik berkata mengenai seseorang yang tidak mengetahui atau lupa berpuasa tiga hari selama ibadah haji, atau yang jatuh sakit dan tidak berpuasa hingga kembali ke rumah, bahwa ia harus menyembelih hewan kurban jika ia dapat menemukannya; jika tidak, ia harus berpuasa tiga hari di rumah, dan tujuh hari lagi setelah itu. {cite:muwatta-maruf-1997 p.561}"
