summary:
  ar: "يقول مالك في الذي يجهل أو ينسى صيام ثلاثة أيام في الحج، أو يمرض فيها فلا يصومها حتى يقدم بلده، إنه يهدي إن وجد هديا، وإلا فليصم ثلاثة أيام في أهله، وسبعة بعد ذلك. {cite:muwatta-maruf-1997 p.561}"
