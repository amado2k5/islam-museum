label: { ar: "الموطأ 2700 — هشام بن عروة عن أبيه: الدعاء عند كل طعام وشراب ودواء", en: "Muwatta 2700", es: "2700 vatios", fr: "2700 watts", ur: "2700 واٹ", tr: "El-Muvatta 2700 — Hişam ibn Urve, babasından rivayetle: Her yemekten, içecekten ve ilaçtan önce dua edin.", id: "Al-Muwatta 2700 — Hisham ibn Urwah, berdasarkan riwayat ayahnya: Doa sebelum setiap makan, minum, dan minum obat" }
summary:
  ar: "يروي مالك عن هشام بن عروة عن أبيه أنه كان لا يؤتى أبدا بطعام ولا شراب، حتى الدواء، فيطعمه أو يشربه، إلا قال: الحمد لله الذي هدانا وأطعمنا وسقانا ونعّمنا، ويكمل الدعاء بطلب تمام النعمة وشكرها والبركة فيما رزق. {cite:muwatta-maruf-1997 p.524}"
  tr: "Malik, Hişam ibn Urva'dan, o da babasından rivayet ettiğine göre, kendisine yiyecek, içecek, hatta ilaç getirildiğinde şöyle derdi: \"Bizi hidayete erdiren, doyuran, içiren ve bize nimetler bahşeden Allah'a hamd olsun.\" Sonra da, kendisine verilen nimetlerin tam olmasını dileyerek, şükranlarını sunarak ve kendisine verilen nimetlerin devamlılığını isteyerek duasını tamamlardı. {cite:muwatta-maruf-1997 s.524}"
  id: "Malik meriwayatkan dari Hisham ibn Urwah, yang juga dari ayahnya, bahwa setiap kali makanan atau minuman, bahkan obat-obatan, dibawa kepadanya, ia akan berkata: “Segala puji bagi Allah yang telah membimbing kita, memberi kita makan, memberi kita minum, dan melimpahkan nikmat kepada kita.” Kemudian ia akan melengkapi doanya dengan memohon kepenuhan nikmat tersebut, mengungkapkan rasa syukur atasnya, dan memohon agar nikmat yang telah diberikan kepadanya terus berlanjut. {cite:muwatta-maruf-1997 p.524}"
