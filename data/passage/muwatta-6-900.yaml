text: "كان يغتسل لإحرامه قبل أن يحرم، ولدخوله مكة، ولوقوفه عشية عرفة"
summary:
  ar: "يرويه مالك عن نافع أن عبد الله بن عمر كان يغتسل لإحرامه قبل أن يحرم، ولدخوله مكة، ولوقوفه عشية عرفة. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشافعي في مسنده، وأن ابن أبي شيبة والبيهقي رويا نحوه من طرق عن ابن عمر. {cite:muwatta-maruf-1997 p.434}"
