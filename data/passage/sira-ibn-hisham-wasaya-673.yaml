text: "… صالح بن كيسان، عن الزهري، عن عبيدالله بن عبدالله بن عتبة، عَنْ عَائِشَةَ، قالت: كان آخرُ ما عهد رسولُ اللّٰه وَطِفِ أَن قال: لاَ يُثْرَكُ بِجَزِيرَةِ الْعَرَبِ دِينَانِ. فتنة الناس بوفاته وَلِ يقهِمْ قال ابن إسحاق: وَلَمَّا توفي رسولُ اللّٰه …"
summary:
