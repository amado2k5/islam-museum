label: { ar: "الموطأ 1160 — مولاة أسماء بنت أبي بكر: جئنا معها إلى منى بغلس، فقالت كنا نصنع ذلك مع من هو خير منكن", en: "Muwatta 1160" }
text: "قد كُنَّا نَصْنَعُ ذلكَ مع من هو خَيْرٌ منكِ"
summary:
  ar: "يروي عطاء بن أبي رباح عن مولاة لأسماء بنت أبي بكر أنها جاءت مع أسماء إلى منى بغلس، فقالت لها إنهم جاءوا منى بغلس، فقالت أسماء إنهم كانوا يصنعون ذلك مع من هو خير منها. ويذكر المحقق أن الحديث في الصحيحين من حديث ابن عمر مرفوعا. {cite:muwatta-maruf-1997 p.524}"
