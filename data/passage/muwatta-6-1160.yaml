label: { ar: "الموطأ 1160 — مولاة أسماء بنت أبي بكر: جئنا معها إلى منى بغلس، فقالت كنا نصنع ذلك مع من هو خير منكن", en: "Muwatta 1160", es: "Muwatta 1160", fr: "Muwatta 1160", ur: "موطا 1160", tr: "El-Muvatta 1160 — Ebu Bekir bint Asma’nın azatlı kölesi: Şafak vakti onunla birlikte Mina’ya geldik ve o şöyle dedi: Biz bunu sizden daha iyi biriyle yapardık.", id: "Al-Muwatta 1160 — Budak yang dibebaskan oleh Asma’ bint Abi Bakr: Kami datang bersamanya ke Mina saat fajar, dan dia berkata: Kami biasa melakukan itu dengan seseorang yang lebih baik dari kalian." }
text: "قد كُنَّا نَصْنَعُ ذلكَ مع من هو خَيْرٌ منكِ"
summary:
  ar: "يروي عطاء بن أبي رباح عن مولاة لأسماء بنت أبي بكر أنها جاءت مع أسماء إلى منى بغلس، فقالت لها إنهم جاءوا منى بغلس، فقالت أسماء إنهم كانوا يصنعون ذلك مع من هو خير منها. ويذكر المحقق أن الحديث في الصحيحين من حديث ابن عمر مرفوعا. {cite:muwatta-maruf-1997 p.524}"
  tr: "Ata' ibn Abi Rabah, Esma' bint Abi Bekr'in bir hizmetçisinden rivayetle, Esma' ile birlikte şafak vakti Mina'ya geldiklerini anlatır. Hizmetçi ona, \"Onlar şafak vakti Mina'ya geldiler\" demiş, Esma' da \"Bunu ondan daha üstün olanlarla yaparlardı\" diye cevap vermiştir. Araştırmacı, hadisin İbn Ömer'den rivayetle iki Sahih'te (Buhari ve Müslim) bulunduğunu ve rivayet zincirinin Peygamberimize kadar uzandığını belirtmektedir. {cite:muwatta-maruf-1997 s.524}"
  id: "Ata' ibn Abi Rabah meriwayatkan dari seorang pelayan wanita Asma' bint Abi Bakr bahwa ia datang bersama Asma' ke Mina pada waktu subuh. Ia berkata kepada Asma', \"Mereka datang ke Mina pada waktu subuh,\" yang dijawab Asma', \"Mereka biasa melakukan itu dengan orang-orang yang lebih baik darinya.\" Peneliti menyebutkan bahwa hadits ini terdapat dalam dua kitab Sahih (Bukhari dan Muslim) dari Ibn Umar, dengan sanad yang sampai kepada Nabi Muhammad shalla Allahu alaihi wa sallam. {cite:muwatta-maruf-1997 p.524}"
