label: { ar: "الموطأ 310 — الحولاء بنت تويت: إن الله لا يمل حتى تملوا", en: "Muwatta 310", es: "Muwatta 310", fr: "Muwatta 310", ur: "موطا 310", tr: "Al-Muwatta 310 — Al-Hawla bint Tuwayt: Siz yorulmadıkça Allah yorulmaz.", id: "Al-Muwatta 310 — Al-Hawla bint Tuwayt: Allah tidak akan lelah sampai kamu lelah" }
text: "إن الله تبارك وتعالى لا يمل حتى تملوا، اكلفوا من العمل ما لكم به طاقة"
summary:
  ar: "يرويه مالك عن إسماعيل بن أبي حكيم بلاغاً، في باب ما جاء في صلاة الليل: سمع النبي امرأة من الليل تصلي فسأل عنها فقيل له إنها الحولاء بنت تويت لا تنام الليل، فكره ذلك حتى عُرفت الكراهية في وجهه، ثم قال إن الله لا يمل حتى يملوا، وأمرهم أن يتكلفوا من العمل ما لهم به طاقة. وينقل المحقق عن ابن عبد البر أن معناه عند أهل العلم أن الله لا يمل من الثواب حتى يملوا هم من العمل، فيحضهم على القليل الدائم ويخبرهم أن النفوس لا تحتمل الإسراف عليها ⁦(التمهيد 1/194)⁩، وأن الحديث منقطع من رواية إسماعيل بن أبي حكيم ويتصل لفظاً ومعنى من طرق صحاح ⁦(التمهيد 1/191)⁩، ويذكر أنه في الصحيحين من حديث عروة عن عائشة. {cite:muwatta-maruf-1997 p.174} {cite:muwatta-maruf-1997 p.175}"
  tr: "Malik, isnad zinciri olmaksızın, gece namazı hakkında rivayet edilenler bölümünde İsmail ibn Abi Hakim'den şöyle nakletmiştir: Peygamberimiz gece namaz kılan bir kadını işitti ve onun hakkında sordu. Ona kadının Havla bint Tuveyt olduğu ve gece uyumadığı söylendi. Bunu o kadar çok hoşuna gitmedi ki, yüzünden belli oldu. Sonra, \"Onlar yorulmadıkça Allah yorulmaz\" dedi ve onlara ancak yapabilecekleri işleri yapmalarını emretti. Araştırmacı, İbn Abdül-Barr'ın, âlimlere göre anlamının, onlar çalışmaktan yorulmadıkça Allah'ın ödüllendirmekten yorulmaması olduğunu söylediğini aktarıyor. Onları az az çalışmaya teşvik ediyor ve nefsin israfı kaldıramayacağını bildiriyor (el-Tamhid 1/194). Ayrıca, hadisin İsmail ibn Abi Hakim'in rivayetinde kopuk olduğunu, ancak sahih rivayet zincirlerinde lafz ve anlam bakımından bağlantılı olduğunu belirtir (el-Tamhid 1/191). Bu hadisin, Urve'nin Aişe'den rivayetiyle iki Sahih'te (Buhari ve Müslim) bulunduğunu da ekler. {cite:muwatta-maruf-1997 s.174} {cite:muwatta-maruf-1997 s.175}"
  id: "Malik meriwayatkannya dari Isma'il ibn Abi Hakim, tanpa sanad, dalam surah tentang apa yang diriwayatkan tentang salat malam: Nabi mendengar seorang wanita salat malam dan bertanya tentangnya. Beliau diberitahu bahwa wanita itu adalah Hawla' bint Tuwayt dan bahwa dia tidak tidur di malam hari. Beliau sangat tidak menyukai hal itu sehingga ketidaksukaannya terlihat jelas di wajahnya. Kemudian beliau berkata, \"Allah tidak akan lelah sampai mereka lelah,\" dan beliau memerintahkan mereka untuk hanya melakukan pekerjaan yang mampu mereka lakukan. Peneliti mengutip Ibn 'Abd al-Barr yang mengatakan bahwa maknanya, menurut para ulama, adalah bahwa Allah tidak akan lelah memberi pahala sampai mereka lelah bekerja. Dia mendorong mereka untuk melakukan sedikit demi sedikit secara konsisten dan memberi tahu mereka bahwa jiwa tidak dapat menanggung pemborosan (al-Tamhid 1/194). Ia juga menyatakan bahwa hadits tersebut terputus dalam riwayat Isma'il ibn Abi Hakim, tetapi terhubung dalam redaksi dan makna melalui sanad yang sahih (al-Tamhid 1/191). Ia menyebutkan bahwa hadits tersebut ditemukan dalam dua kitab Sahih (Bukhari dan Muslim) atas otoritas 'Urwah atas otoritas 'Aisyah. {cite:muwatta-maruf-1997 p.174} {cite:muwatta-maruf-1997 p.175}"
