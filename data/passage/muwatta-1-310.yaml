label: { ar: "الموطأ 310 — الحولاء بنت تويت: إن الله لا يمل حتى تملوا", en: "Muwatta 310" }
text: "إن الله تبارك وتعالى لا يمل حتى تملوا، اكلفوا من العمل ما لكم به طاقة"
summary:
  ar: "يرويه مالك عن إسماعيل بن أبي حكيم بلاغاً، في باب ما جاء في صلاة الليل: سمع النبي امرأة من الليل تصلي فسأل عنها فقيل له إنها الحولاء بنت تويت لا تنام الليل، فكره ذلك حتى عُرفت الكراهية في وجهه، ثم قال إن الله لا يمل حتى يملوا، وأمرهم أن يتكلفوا من العمل ما لهم به طاقة. وينقل المحقق عن ابن عبد البر أن معناه عند أهل العلم أن الله لا يمل من الثواب حتى يملوا هم من العمل، فيحضهم على القليل الدائم ويخبرهم أن النفوس لا تحتمل الإسراف عليها (التمهيد 1/194)، وأن الحديث منقطع من رواية إسماعيل بن أبي حكيم ويتصل لفظاً ومعنى من طرق صحاح (التمهيد 1/191)، ويذكر أنه في الصحيحين من حديث عروة عن عائشة. {cite:muwatta-maruf-1997 p.174} {cite:muwatta-maruf-1997 p.175}"
