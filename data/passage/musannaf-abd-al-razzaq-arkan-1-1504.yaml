text: "… ما هنالك، فقال أَبو سعيد : أَمَّا هذا فقد قضى الذي عليه، سمعت رسول اللّٰه عل له يقول: من رأَى منكم منكراً فاستطاع أَن يغيِّره بيده فليفعل، فإن لم يستطيع فبلسانه، فإن لم يستطع فبقلبه، وذلك أَضعف الايمان باب خروج …"
