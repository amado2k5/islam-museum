summary:
  ar: "القسم 21 من سنن النسائي في تقسيم قاعدة بيانات الحديث المفتوحة التي أُخذت منها سجلات المتحف، وعنوانه «كتاب الجنائز»، ويضم فيها النصوص من 1818 إلى 2089 بترقيمها. يضع المتحف تحت هذا الكتاب ما عنده من سجلات هذه النصوص."
  en: "Book 21 of Sunan al-Nasa'i (The Book of Funerals) in the division of the open hadith dataset the museum took its reports from: reports 1818 to 2089 in that dataset's numbering. The museum files its records of these reports under this book; printed editions divide and number the collection differently."
  ur: "سنن نسائی کی کتاب 21، عنوان «کتاب الجنائز»، اس کھلے حدیث ڈیٹا سیٹ کی تقسیم کے مطابق جس سے میوزیم کے ریکارڈ لیے گئے: اس کی ترقیم میں روایات 1818 تا 2089۔ میوزیم ان روایات کے اپنے ریکارڈ اسی کتاب کے تحت رکھتا ہے۔"
  es: "El libro 21 de Sunan al-Nasa'i (El Libro de los Funerales) se encuentra en la división del conjunto de datos abiertos de hadices del que el museo extrajo sus informes: informes del 1818 al 2089, según la numeración de dicho conjunto de datos. El museo archiva sus registros de estos informes bajo este libro; las ediciones impresas dividen y numeran la colección de manera diferente."
  fr: "Le musée a extrait ses hadiths du Sunan al-Nasa'i (Livre des funérailles), dans la partie ouverte de ce recueil (les hadiths 1818 à 2089). Il conserve les archives de ces hadiths sous ce livre; les éditions imprimées présentent une classification et une numérotation différentes."
  tr: "Müzenin kayıtlarının alındığı açık hadis veritabanındaki Sunan al-Nasa'i'nin 21. bölümü \"Cenaze Kitabı\" başlığını taşımakta olup 1818'den 2089'a kadar numaralandırılmış metinler içermektedir. Müze, bu metinlere ait kayıtlarını bu bölüm altında toplamaktadır."
  id: "Bagian 21 dari Sunan al-Nasa'i, dalam basis data hadits terbuka yang menjadi sumber catatan museum, berjudul \"Kitab Pemakaman\" dan berisi teks-teks bernomor 1818 hingga 2089. Museum menempatkan catatan teks-teks ini di bawah bagian ini."
