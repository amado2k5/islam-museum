text: "… تَنْوِيب الدعاء مزة بعدَ اخرى. وقيل : التَّثويءُ الصلاةُ بعدَ الفَريضة. يقال : تَنَوَّبَت أَي تَطَوَعْت بعد المكتُوبة، ولا يكون التَّنْوِيبُ إِلا بعد المكتوبة، وهو العود للصلاة بعد الصلاة. وفي الحديث : إِذا ثُوب بالصلاة فأتُوها وعليكم السَّكِينةُ والوَقارُ.. قال …"
summary:
  ar: "مقطع من لسان العرب لابن منظور، المجلد المصوَّر 4، ص 247، يرد فيه ذكر الفريضة والفرائض، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn Manzur's Lisan al-'Arab, scan volume 4, p. 247, whose wording mentions the obligation (farida), the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "لسان العرب، ابن منظور، اسکین جلد 4، ص 247 کا اقتباس جس میں فریضہ اور فرائض، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Lisan al-'Arab de Ibn Manzur, volume numérisé 4, p. 247, dont le texte mentionne l'obligation (farida), la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Lisan al-'Arab de Ibn Manzur, volumen digitalizado 4, p. 247, cuyo texto menciona la obligación (farida), la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn Manzur'un Lisan al-Arab adlı eserinin 4. cildinin 247. sayfasından, farz olan amelleri ve farz namazları anlatan bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir ve düzeltilmemiştir. Farz olan ameller, görevler, itaat amelleri, tavsiye edilen ameller, mekruh olan ameller, haram olan ameller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Lisan al-Arab karya Ibn Manzur, Volume 4, halaman 247, yang menyebutkan amalan wajib dan salat yang dianjurkan; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks ini disarikan dengan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
