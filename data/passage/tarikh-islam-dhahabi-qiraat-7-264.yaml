text: "عبد اللّٰه بن الحارث - خ - بن هشام بن المغيرة المخزومي، أبو محمد، والد أبي بكر الفقيه وإخوته، وأحد الذين عيّنهم عثمان لكتابة مصاحف الأمصار. سمع: أباه، وعمر، وعثمان، وعليّاً، وحفصة أم المؤمنين، وجماعة. وعنه: ابنه أبو بكر، والشعبي، …"
summary:
  ar: "مقطع من تاريخ الإسلام للذهبي، المجلد المصوَّر 7، ص 264، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from al-Dhahabi's Tarikh al-Islam, scan volume 7, p. 264, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "تاریخ الاسلام، ذہبی، اسکین جلد 7، ص 264 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Tarikh al-Islam de al-Dhahabi, volumen 7, pág. 264, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Tarikh al-Islam d'al-Dhahabi, volume 7, page 264, mentionne la compilation du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure également dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Al-Dhahabi'nin *İslam Tarihi* adlı eserinin 7. cildinin 264. sayfasından alınan bir alıntı, Kur'an'ın derlenmesi, el yazmaları ve yazım kurallarını ele almaktadır; bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşmaktadır. Bu alıntı, Kur'an okunuşları, yazım kuralları, yazı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Kutipan dari *Sejarah Islam* karya Al-Dhahabi, Volume 7, halaman 264, membahas penyusunan Al-Quran dan manuskripnya, serta ortografi Al-Quran; diambil dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Quran, ortografi, aksara, dan tanda diakritik."
