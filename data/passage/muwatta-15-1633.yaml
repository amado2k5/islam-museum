label: { ar: "الموطأ 1633 — مالك: إن خيرها فقالت قبلت واحدة، وقال لم أرد هذا وإنما خيرتك في الثلاث جميعا، فلم تقبل إلا واحدة، أقامت عنده على نكاحها، ولم يكن ذلك فراقا", en: "Muwatta 1633", es: "Muwatta 1633", fr: "Muwatta 1633", ur: "موطا 1633", tr: "El-Muvatta 1633 — Malik: Eğer ona seçim hakkı vermiş ve o da, “Birini kabul ediyorum” demişse, ve o da, “Bunu kastetmedim, aksine sana üçünden de seçim hakkı verdim” demiş ve o sadece birini kabul etmişse, evliliğinde onunla birlikte kalmış olur ve bu bir ayrılık sayılmaz.", id: "Al-Muwatta 1633 — Malik: Jika dia memberi wanita itu pilihan dan wanita itu berkata, “Saya menerima satu,” dan dia berkata, “Bukan ini maksud saya, melainkan saya memberi Anda pilihan tiga,” dan wanita itu hanya menerima satu, maka dia tetap bersama suaminya dalam pernikahan itu, dan itu bukanlah perpisahan." }
summary:
  ar: "يقول مالك وإن خيرها فقالت قد قبلت واحدة، وقال لم أرد هذا، وإنما خيرتك في الثلاث جميعا، أنها لم تقبل إلا واحدة، أقامت عنده على نكاحها، ولم يكن ذلك فراقا. {cite:muwatta-maruf-1997 p.74}"
  tr: "Malik şöyle dedi: “Eğer ona seçim hakkı verilmiş ve o da ‘Birini kabul ediyorum’ demişse ve o da ‘Bunu kastetmedim, aksine sana üçünden de seçim hakkı verdim’ demişse ve o sadece birini kabul etmişse, evliliğinde onunla birlikte kalmış demektir ve bu bir ayrılık değildir.” {cite:muwatta-maruf-1997 s.74}"
  id: "Malik berkata, “Jika dia diberi pilihan dan berkata, ‘Saya menerima satu,’ dan dia berkata, ‘Bukan itu maksud saya, melainkan saya memberi Anda pilihan dari ketiganya,’ dan dia hanya menerima satu, dia tetap bersama pria itu dalam pernikahannya, dan itu bukanlah perpisahan.” {cite:muwatta-maruf-1997 p.74}"
