label: { ar: "مسلم 2344 — رأيت خاتماً في ظهره كأنه بيضة حمام", en: "Muslim 2344 — I saw a seal on his back like a dove's egg", es: "Musulmán 2344 — Vi una foca en su espalda como un huevo de paloma", fr: "Muslim 2344 — J'ai vu un sceau sur son dos, comme un œuf de colombe", ur: "مسلم 2344 - میں نے اس کی پیٹھ پر کبوتر کے انڈے کی طرح مہر دیکھی۔", tr: "Müslim 2344 — Sırtında güvercin yumurtasına benzeyen bir yüzük gördüm.", id: "Muslim 2344 — Aku melihat sebuah lingkaran di punggungnya yang tampak seperti telur merpati" }
text: "قال جابر بن سمرة: رأيت خاتماً في ظهر رسول الله كأنه بيضة حمام"
summary:
  ar: "رواية جابر بن سمرة في باب إثبات خاتم النبوة من كتاب الفضائل في صحيح مسلم؛ الخاتم بين كتفيه شبيه بيضة الحمام — أوجز نصوص الخاتم."
  tr: "Sahih Müslim'in Faziletler Kitabı'ndaki Peygamberliğin Mührünü ispatlama bölümünde Cabir bin Samra'nın rivayeti; omuzları arasındaki mühür güvercin yumurtasına benzer - mühür hakkında en özlü metinlerden biridir."
  id: "Riwayat Jabir bin Samra dalam bab tentang pembuktian Tanda Kenabian dari Kitab Keutamaan dalam Sahih Muslim; tanda di antara kedua bahunya mirip dengan telur merpati — teks yang paling ringkas tentang tanda tersebut."
