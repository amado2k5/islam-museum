text: "… أحد منهم يوجه إلينا شيئاً، فقال أبو سفيان: يا رسول اللّٰه! أبيحت خضراء قريش بعد هذا اليوم، قال: قال رسول اللّٰه لل ليه: من أغلق بابه فهو آمن، قال: فغلق الناس أبوابهم، قال: فأقبل رسول اللّٰه والفي حتى استلم الحجر …"
