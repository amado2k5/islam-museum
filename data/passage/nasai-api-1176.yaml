label: { ar: "سنن النسائي 1176 — الأب والأبوة", en: "Sunan al-Nasa'i 1176 — the father and fatherhood", ur: "سنن نسائی 1176 — باپ اور والدیت", es: "Sunan al-Nasa'i 1176 — El padre y la paternidad", fr: "Sunan al-Nasa'i 1176 — le père et la paternité" }
text: "أَخْبَرَنَا الْهَيْثَمُ بْنُ أَيُّوبَ الطَّالْقَانِيُّ، قَالَ حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدِ بْنِ إِبْرَاهِيمَ بْنِ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ، قَالَ حَدَّثَنَا أَبِي، عَنْ أَبِي عُبَيْدَةَ بْنِ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ فِي الرَّكْعَتَيْنِ كَأَنَّهُ عَلَى الرَّضْفِ. قُلْتُ حَتَّى يَقُومَ قَالَ ذَلِكَ يُرِيدُ."
summary:
  ar: "حديث في سنن النسائي، رقم 1176، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 1176 (The Book of The At-Tatbiq (Clasping One's Hands Together)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 1176، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 1176 (El Libro del At-Tatbiq (Junto de las Manos)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 1176 (Le Livre de l'At-Tatbiq, ou l'union des mains), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
