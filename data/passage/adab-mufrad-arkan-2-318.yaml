text: "… جعفر قال : حدثنى أبى، عن حكيم بن أفلح، عن ابن مسعود، عن النى ول ه قال أربع للمسلم على المسلم : يعوده إذا مرض، ويشهده إذا مات، ويجيبه إذا دعاه، ويشمّته إذا عطس ابن ماجه عن أبى مسمود البدرى …"
summary:
  ar: "مقطع من الأدب المفرد للبخاري، المجلد المصوَّر 2، ص 318، يذكر حق المؤمن على المؤمن؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Bukhari's al-Adab al-Mufrad, scan volume 2, p. 318, that mentions what a believer owes a believer; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الادب المفرد، بخاری، اسکین جلد 2، ص 318 کا اقتباس جس میں مومن کا مومن پر حق کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Adab al-Mufrad de Al-Bujari, volumen 2, pág. 318, que menciona lo que un creyente le debe a otro creyente; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait du traité al-Adab al-Mufrad d'al-Bukhari (tome 2, p. 318), qui évoque les devoirs d'un croyant envers un autre; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Buhari'nin El-Adab El-Mufrad adlı eserinin 2. cildinin 318. sayfasından, bir müminin diğer bir mümin üzerindeki haklarından bahseden bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın esasları, imanın esasları, imanın dalları ve müminin özelliklerine uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Adab Al-Mufrad karya Al-Bukhari, Jilid 2, halaman 318, yang menyebutkan hak-hak seorang mukmin atas mukmin lainnya; dari versi hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
