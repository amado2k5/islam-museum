text: "- الجامع لشعب الإيمان أبي، قال سمعت الأعمش، يحدث عن عمرو بن مرة، عن أبي البختري، قال قال سلمان: المؤمن للمؤمن كاليدين تقي إحداهما الأخرى. قال: وحدثنا علي، حدثنا الوليد بن مسلم، قال سمعت الأوزاعي، يقول سمعت بلال بن سعد …"
