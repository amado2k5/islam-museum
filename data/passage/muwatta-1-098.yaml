text: "لو سال على فخذي ما انصرفت حتى أقضي صلاتي"
summary:
  ar: "أول أثر في باب الرخصة في ترك الوضوء من المذي. يرويه يحيى عن مالك عن يحيى بن سعيد عن سعيد بن المسيب: سأله رجل أنه يجد البلل وهو يصلي أفينصرف؟ فقال سعيد إنه لو سال على فخذه ما انصرف حتى يقضي صلاته. ويذكر المحقق أن عبد الرزاق رواه عن ابن عيينة والثوري عن يحيى بن سعيد عن سعيد بمعناه. {cite:muwatta-maruf-1997 p.83} {cite:muwatta-maruf-1997 p.84}"
