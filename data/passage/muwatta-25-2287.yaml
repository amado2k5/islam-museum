label: { ar: "الموطأ 2287 — حميد بن قيس المكي: مكاتب ابن المتوكل بمكة", en: "Muwatta 2287" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي أن مكاتبا لابن المتوكل هلك بمكة وعليه بقية من كتابته وديون للناس، وترك ابنة. فكتب عامل مكة إلى عبد الملك بن مروان يسأله، فأمره أن يبدأ بديون الناس، ثم يُقضى ما بقي من الكتابة، ثم يُقسم الباقي من ماله بين ابنته ومولاه. {cite:muwatta-maruf-1997 p.344}"
