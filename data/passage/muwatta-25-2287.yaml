label: { ar: "الموطأ 2287 — حميد بن قيس المكي: مكاتب ابن المتوكل بمكة", en: "Muwatta 2287", es: "Muwatta 2287", fr: "Muwatta 2287", ur: "موطا 2287", tr: "Al-Muwatta 2287 - Hamid ibn Qays al-Makki: İbnü'l-Mütevekkil'in Mekke'deki ofisleri", id: "Al-Muwatta 2287 — Hamid ibn Qays al-Makki: Kantor Ibn al-Mutawakkil di Mekah" }
summary:
  ar: "يروي مالك عن حميد بن قيس المكي أن مكاتبا لابن المتوكل هلك بمكة وعليه بقية من كتابته وديون للناس، وترك ابنة. فكتب عامل مكة إلى عبد الملك بن مروان يسأله، فأمره أن يبدأ بديون الناس، ثم يُقضى ما بقي من الكتابة، ثم يُقسم الباقي من ماله بين ابنته ومولاه. {cite:muwatta-maruf-1997 p.344}"
  tr: "Malik, Hamid ibn Kays el-Mekki'den rivayetle, İbn el-Mutavakkil'in bir kâtibinin Mekke'de öldüğünü, azat sözleşmesinin kalan kısmını ve diğerlerine olan borçlarını ödediğini ve geride bir kız çocuğu bıraktığını anlatır. Mekke valisi Abd el-Malik ibn Mervan'a yardım istemek için bir mektup yazmış ve ona önce halka olan borçları ödemesini, sonra azat sözleşmesinin kalan kısmını kapatmasını ve daha sonra da mal varlığının geri kalanını kızı ve azat ettiği kölesi arasında paylaştırmasını emretmiştir. {cite:muwatta-maruf-1997 s.344}"
  id: "Malik meriwayatkan dari Hamid ibn Qays al-Makki bahwa seorang juru tulis Ibn al-Mutawakkil meninggal di Mekah, dengan sisa hutang kontrak pembebasan budak dan hutang kepada orang lain, serta meninggalkan seorang putri. Gubernur Mekah menulis surat kepada Abd al-Malik ibn Marwan meminta bantuannya, dan ia memerintahkannya untuk memulai dengan melunasi hutang kepada orang-orang tersebut, kemudian melunasi sisa kontrak pembebasan budak, dan kemudian membagi sisa hartanya antara putrinya dan budak yang telah dibebaskan. {cite:muwatta-maruf-1997 p.344}"
