label: { ar: "الموطأ 1882 — مالك: لا يباع مد حنطة بمدي حنطة، ولا مد تمر بمدي تمر، ولا مد زبيب بمدي زبيب، ولا شيء من الحبوب والأدم إذا كان من صنف واحد، وإنما ذلك بمنزلة الورق بالورق والذهب بالذهب", en: "Muwatta 1882" }
summary:
  ar: "قال مالك: ولا يباع شيء من الطعام والأدم إذا كان من صنف واحد، اثنان بواحد. لا يباع مد حنطة بمدي حنطة، ولا مد تمر بمدي تمر، ولا مد زبيب بمدي زبيب، ولا ما أشبه ذلك من الحبوب والأدم كلها، إذا كان من صنف واحد، وإن كان يدا بيد. إنما ذلك بمنزلة الورق بالورق والذهب بالذهب. ولا يحل في شيء من ذلك الفضل. ولا يحل إلا مثلا بمثل، ويدا بيد. {cite:muwatta-maruf-1997 p.174}"
