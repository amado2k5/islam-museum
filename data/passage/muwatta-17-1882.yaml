label: { ar: "الموطأ 1882 — مالك: لا يباع مد حنطة بمدي حنطة، ولا مد تمر بمدي تمر، ولا مد زبيب بمدي زبيب، ولا شيء من الحبوب والأدم إذا كان من صنف واحد، وإنما ذلك بمنزلة الورق بالورق والذهب بالذهب", en: "Muwatta 1882", es: "Muwatta 1882", fr: "Muwatta 1882", ur: "موطا 1882", tr: "El-Muvatta 1882 — Malik: Bir ölçek buğday bir ölçek buğdayla, bir ölçek hurma bir ölçek hurmayla, bir ölçek kuru üzüm bir ölçek kuru üzümle veya aynı türden herhangi bir tahıl veya yiyecekle satılmamalıdır. Aksine, bu gümüşü gümüşle, altını altınla satmaya benzer.", id: "Al-Muwatta 1882 — Malik: Takaran gandum tidak boleh ditukar dengan takaran gandum, takaran kurma tidak boleh ditukar dengan takaran kurma, takaran kismis tidak boleh ditukar dengan takaran kismis, atau barang sejenis biji-bijian atau makanan lainnya. Sebaliknya, ini seperti menjual perak dengan perak dan emas dengan emas." }
summary:
  ar: "قال مالك: ولا يباع شيء من الطعام والأدم إذا كان من صنف واحد، اثنان بواحد. لا يباع مد حنطة بمدي حنطة، ولا مد تمر بمدي تمر، ولا مد زبيب بمدي زبيب، ولا ما أشبه ذلك من الحبوب والأدم كلها، إذا كان من صنف واحد، وإن كان يدا بيد. إنما ذلك بمنزلة الورق بالورق والذهب بالذهب. ولا يحل في شيء من ذلك الفضل. ولا يحل إلا مثلا بمثل، ويدا بيد. {cite:muwatta-maruf-1997 p.174}"
  tr: "Malik şöyle dedi: Aynı türden hiçbir yiyecek veya baharat, bire bir oranında çift olarak satılamaz. Bir ölçek buğday bir ölçek buğdayla, bir ölçek hurma bir ölçek hurmayla, bir ölçek kuru üzüm bir ölçek kuru üzümle veya aynı türden tahıllar ve baharatlar arasında benzer hiçbir şey, elden ele olsa bile, satılamaz. Bu, gümüşü gümüşle veya altını altınla satmaya benzer. Bu işlemlerin hiçbirinde fazlalık caiz değildir. Sadece takasın ağırlık olarak eşit ve elden ele olması durumunda caizdir. {cite:muwatta-maruf-1997 s.174}"
  id: "Malik berkata: Tidak ada barang sejenis, baik makanan maupun bumbu, yang boleh dijual berpasangan untuk satu barang. Takaran gandum tidak boleh dijual dengan takaran gandum lainnya, takaran kurma dengan takaran kurma lainnya, takaran kismis dengan takaran kismis lainnya, dan barang sejenis lainnya, baik biji-bijian maupun bumbu, jika jenisnya sama, meskipun pertukaran dilakukan secara langsung. Ini seperti menjual perak dengan perak atau emas dengan emas. Tidak diperbolehkan adanya kelebihan dalam transaksi-transaksi ini. Hal ini hanya diperbolehkan jika pertukaran dilakukan secara langsung dan dengan berat yang sama. {cite:muwatta-maruf-1997 p.174}"
