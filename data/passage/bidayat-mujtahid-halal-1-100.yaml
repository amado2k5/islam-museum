text: "… كافر مسلمة، يحرم على الإطلاق، بإجماع. وقال ابن حجر فِي فتح الباري : واعتبار الكفاءة في الدين متفق عليه، فلا تحل المسلمة للكافر أصلًا. وقال العيني في عمدة القاري بعد قول البخاري: باب الأكفاء في الدين أي: هذا باب في …"
summary:
  ar: "مقطع من بداية المجتهد لابن رشد، المجلد المصوَّر 1، ص 100، يذكر ما لا يحل، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
  en: "An excerpt from Ibn Rushd's Bidayat al-Mujtahid, scan volume 1, p. 100, that mentions what is not lawful, what was made unlawful; from the machine-read scan, quoted within forty words per the sources policy. The Halal and Haram Browser lists it."
  ur: "بدایۃ المجتہد، ابن رشد، اسکین جلد 1، ص 100 کا اقتباس جس میں جو حلال نہیں، جو حرام کیا گیا کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ حلال و حرام براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Bidayat al-Mujtahid de Ibn Rushd, volumen 1, pág. 100, que menciona lo que no es lícito y lo que fue declarado ilícito; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Halal and Haram lo incluye en su lista."
  fr: "Extrait de Bidayat al-Mujtahid d'Ibn Rushd (tome 1, p. 100) mentionnant ce qui est illicite et ce qui a été déclaré illicite; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce passage est répertorié par le Halal and Haram Browser."
  tr: "İbn Rüşd'ün *El-Müctehid* adlı eserinin 1. cildinin 100. sayfasından, haram ve izin verilmeyen şeyleri belirten bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır. Helal ve Haram Tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab *Al-Mujtahid* karya Ibnu Rushd, Jilid 1, halaman 100, yang menyebutkan apa yang diperbolehkan dan apa yang diharamkan; dari versi pindaian yang dapat dibaca mesin. Teks dikutip dalam kurang lebih empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh Halal and Haram Browser."
