label: { ar: "الموطأ 1960 — مالك: بلغه أن عبد الله بن مسعود كان يحدث: أيما بيعين تبايعا فالقول ما قال البائع، أو يتراددان، وذكر المحقق أن الحديث مشهور عند العلماء ولا إسناد صحيح له", en: "Muwatta 1960" }
summary:
  ar: "قال مالك: وبلغه أن عبد الله بن مسعود كان يحدث أن رسول الله قال: أيما بيعين تبايعا، فالقول ما قال البائع، أو يتراددان. ويذكر المحقق أن ابن عبد البر قال إن الحديث محفوظ عن ابن مسعود، وأنه عند جماعة العلماء أصل تلقوه بالقبول، وأن الترمذي قال إنه مرسل، وأن لا إسناد صحيحا له فيما يعلم المحقق. {cite:muwatta-maruf-1997 p.201} {cite:muwatta-maruf-1997 p.202}"
