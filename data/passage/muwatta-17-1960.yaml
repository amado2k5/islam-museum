label: { ar: "الموطأ 1960 — مالك: بلغه أن عبد الله بن مسعود كان يحدث: أيما بيعين تبايعا فالقول ما قال البائع، أو يتراددان، وذكر المحقق أن الحديث مشهور عند العلماء ولا إسناد صحيح له", en: "Muwatta 1960", es: "Muwatta 1960", fr: "Muwatta 1960", ur: "موطا 1960", tr: "El-Muvatta 1960 — Malik: Abdullah bin Mesud'un şöyle dediği kendisine ulaştı: \"İki kişi satış yaparsa, söz satıcının sözüdür, yoksa iptal edebilirler.\" Araştırmacı, hadisin âlimler arasında yaygın olduğunu, ancak sahih bir rivayet zincirinin bulunmadığını belirtti.", id: "Al-Muwatta 1960 — Malik: Sampai kepadanya bahwa Abdullah bin Masoud biasa berkata: “Jika dua orang melakukan jual beli, maka kesepakatannya adalah apa yang dikatakan penjual, atau mereka dapat membatalkannya.” Peneliti menyebutkan bahwa hadits ini terkenal di kalangan ulama, tetapi tidak memiliki sanad yang sahih." }
summary:
  ar: "قال مالك: وبلغه أن عبد الله بن مسعود كان يحدث أن رسول الله قال: أيما بيعين تبايعا، فالقول ما قال البائع، أو يتراددان. ويذكر المحقق أن ابن عبد البر قال إن الحديث محفوظ عن ابن مسعود، وأنه عند جماعة العلماء أصل تلقوه بالقبول، وأن الترمذي قال إنه مرسل، وأن لا إسناد صحيحا له فيما يعلم المحقق. {cite:muwatta-maruf-1997 p.201} {cite:muwatta-maruf-1997 p.202}"
  tr: "Malik şöyle dedi: Abdullah ibn Mes'ud'un, Resulullah'ın şöyle buyurduğunu rivayet ettiği kendisine ulaştı: \"İki kişi satış yaparsa, satıcının sözü geçerlidir, yoksa satışı iptal edebilirler.\" Araştırmacı, İbn Abdül-Barr'ın hadisin İbn Mes'ud'dan nakledildiğini ve bir grup âlim tarafından kabul edilen temel bir kaynak olarak görüldüğünü söylediğini belirtiyor. Ayrıca Tirmizi'nin hadisin mursal (rivayet zincirinde eksik bir halka bulunan hadis) olduğunu ve araştırmacının bilgisine göre sağlam bir isnadı olmadığını söylediğini de kaydediyor. {cite:muwatta-maruf-1997 s.201} {cite:muwatta-maruf-1997 s.202}"
  id: "Malik berkata: Ia sampai kepadanya bahwa Abdullah ibn Mas'ud biasa meriwayatkan bahwa Rasulullah SAW bersabda: \"Jika dua orang berjual beli, maka perkataan penjual diterima, atau mereka dapat membatalkannya.\" Peneliti menyebutkan bahwa Ibnu Abd al-Barr mengatakan bahwa hadits ini terpelihara dari Ibnu Mas'ud, dan bahwa hadits ini dianggap oleh sekelompok ulama sebagai sumber fundamental yang mereka terima. Ia juga mencatat bahwa al-Tirmidhi mengatakan bahwa hadits ini mursal (hadits dengan mata rantai periwayatan yang hilang), dan bahwa, sepengetahuan peneliti, hadits ini tidak memiliki sanad yang sahih. {cite:muwatta-maruf-1997 p.201} {cite:muwatta-maruf-1997 p.202}"
