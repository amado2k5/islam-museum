text: "… إلا ما الأصل في العتود وجوب حرَّمه اللّهُ ورسولُه، فإن المسلمين على شروطهم إلا شرطاً أحلَّ حراماً، أو حرَّم حلالاً، فلا يحرُم مِن الشروط والعقود إلا ما حرَّمه اللّهُ ورسولُه، وليس مع المانعين نصٌّ بالتحريم ألبتة، وإنما معهم قياسٌ قد …"
