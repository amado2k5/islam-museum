text: "رأى عمر بن الخطاب حلة سيراء عند باب المسجد فقال: يا رسول الله لو اشتريتها تلبسها يوم الجمعة وللوفد؟ قال: إنما يلبسها من لا خلاق له في الآخرة، ثم جاءت حلل فأعطى رسول الله عمر منها حلة… فكسا عمر أخاً له بمكة مشركاً"
summary:
  ar: "في كتاب البيوع باب لبس الحرير؛ سياق مزدوج: عرض الحلة على باب المسجد والوفود، ثم هبة النبي إياها لعمر بعد — نص يجمع زهد الإمامة وود الصحبة."
  tr: "Satış Kitabı'ndaki İpek Giyinme Bölümü; iki yönlü bir bağlam sunar: giysinin cami kapısında ve heyetlere sunulması, ardından Peygamber'in onu Ömer'e hediye etmesi; bu metin, liderliğin çileciliği ile arkadaşlığın sevgisini bir araya getirir."
  id: "Dalam Kitab Penjualan, Bab tentang Mengenakan Sutra; terdapat konteks ganda: pemberian pakaian di pintu masjid dan delegasi, kemudian pemberiannya oleh Nabi kepada Umar setelahnya — sebuah teks yang menggabungkan asketisme kepemimpinan dan kasih sayang persahabatan."
