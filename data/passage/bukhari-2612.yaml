label: { ar: "البخاري 2612 — الحلة السيراء", en: "Bukhari 2612 — the striped silk hulla" }
text: "رأى عمر بن الخطاب حلة سيراء عند باب المسجد فقال: يا رسول الله لو اشتريتها تلبسها يوم الجمعة وللوفد؟ قال: إنما يلبسها من لا خلاق له في الآخرة، ثم جاءت حلل فأعطى رسول الله عمر منها حلة… فكسا عمر أخاً له بمكة مشركاً"
summary:
  ar: "في كتاب البيوع باب لبس الحرير؛ سياق مزدوج: عرض الحلة على باب المسجد والوفود، ثم هبة النبي إياها لعمر بعد — نص يجمع زهد الإمامة وود الصحبة."
