text: |-
  ٤٨٨٠
  (ياب المدين⅜n⅜n
  ⁦(حوش)⁩
  حتوش والمحشة بالنتح الدبرونهى عن اتيان الذساء فى محائهن وربماياء بالسين والحشيس
  ما يبس من الكلا ولا يقال له رطباحتيش والهسر المكان الكثير الحشيتر ومنه قولهسم
  انك بمحش صدق فلا تبرحه أى بموضع كثير الخير والحش بالسكسر ما يقطع به الحشيش والمحس
  أيضاما تحزك به النار من حديد وكذلك الهشة ومنه قيل للرجل الشهجاع ذعم محش الكتيبة
  وأما الذى يجمل فيه المشيش ففيه لغتان محش ومحمس والفتح أفصح وحشئت الحشيش
  قطعته واحتششته طلبته وجعته والحشاش الذين يحتشون وحششت فرمى ألقيت له
  حشيشا وفى المثل أحشك وتروثنى ولوقيل أيضا بالسين لم يبعد وحس الرجل سهمه اذا ألزق به
  القدد من نواحيه ويقال اللبعيرقد حش ظهره بجنبين واسعين ف)ه ومحشوش أى انه مجفر
  الجنبين والحشاش والحشاشة بقية الروح في المريض وأ-شت المرأة فهى محش اذا ييس
  ولدها فى بطنها وكذلت أحشنت اليد أى يبست وشات وفيه لغسة أخرى جاءت فى الحديث حش
  ولدها فى بطنها قال أبو عبيد وبعضه-م يقول حشيضم الحاء ⁦( حقسْ)⁩ حفس السيل
  يحفش حفشا اذاسال من كل جانب الى مستفقم واحد والحافشة المسيل قال الشاعر
  عشية رحتاورا ح والنا • كماملاً الحافشات المسيلا
  وكذلك حفش الاداوة سيلانها والقرس يحفش أى يأتى بجرى بعد جرى ويقال هم يحفشون
  الدك أى يجتمعون وتالفون والحفس وعاء المغازل والحفس الذى فى الحسديث هوالبت
  الصغير عن أبى عبيد وية ال معنى قوله عليه السلام هلا قعد فى حفس أمه أى عند حفس أمه
  سْ رجل أحس الساقين دقيقهما وحش الساقين أيضا بالتسكين وقد حشت
  قوائمه أى دقت وأحشت القدر أشبعت وقودها وأحشت الرجل أيضا أغضبته وكذلك
  التحميش والاسم الحئة من-ل الحشمة مقلوب منه واحتس واستعمش أي التهب غضبا يقال
  احتمس الديكان أى اقتتلا حنس الحنس بالهريك كل ما يصاد من الطير والهوام وايهع
  الاحفاش والحنش أيضا الحية ويقال الافعى وبهاهى الرجل حنشاوحنشت الصيد صده
  وحنشته أحنشه لفة فى عنشته اذا عطفته وش حشت الصيدأ -وشه اذا جئتهمن
  -واليه لتصرفه الى الحبالة وكذلك أحشت الصيد وأحوشته واحتوش القوم الصيد
  اذا أنهره بعضهم على بعض واغاظه رت فيه الواوكما ظهرت فى اجتوروا واحتوش القوم على
  فلان جعلوه وسطهم وتحوّش القوم عنى تنحوا وحشت الابل بمعتها وسقتها والحائس جماعة
  النخل لا واحدله كما قالوالجاعة البرربرب قال الاخطال
  . وكأن ظعن الحى حائسر قرية • دان جفامطيب الاثمار
  وأصل الحائش المجتمع من الشجر نخلا كان أوغيره يقال حائس الطرفاء وانحاش عنه أى نفو
  ومايهاش فلان من شى اذ الم يكنرث له والحواشة مابستهيا منه ويقأل حاش اللّه تنزيها
  له ولا يقال حاش لك قياسا عليه وانغمايقال حاشاكْ وحاشالك والحوشى الوحشى وحوشىّ
  الكلام وحشيه وغريه ورجل حونى لا يخالط الناس وفيه حوشية وأصل الحوش زعموا
  بسلاد الجنّ من وراء رمل يبرين لا يسكنها أحد من الناس والحوش النهم المتوحش
  ويقال ان الابل الموشية منسوبة الى الحوش وهى فحول جن تزعم العرب الهاضربت
  فحم
