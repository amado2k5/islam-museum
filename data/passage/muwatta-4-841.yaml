summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يُسأل عن قضاء رمضان، فقال: أحب إلي أن لا يُفرّق قضاء رمضان، وأن يُواتر، أي يُتابع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (822) وسويد (470). {cite:muwatta-maruf-1997 p.409}"
