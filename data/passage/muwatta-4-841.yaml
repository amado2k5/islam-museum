label: { ar: "الموطأ 841 — سعيد بن المسيب: أحب إلي ألا يفرق قضاء رمضان وأن يوالى", en: "Muwatta 841", es: "Muwatta 841", fr: "Muwatta 841", ur: "موطا 841", tr: "El-Muvatta 841 — Said ibn el-Musayyab: Ramazan oruçlarının kaza edilmesinin ayrı günlerde değil, ardı ardına tutulmasını tercih ederim.", id: "Al-Muwatta 841 — Sa’id ibn al-Musayyab: Saya lebih suka jika puasa pengganti Ramadan tidak dilakukan pada hari-hari yang terpisah, melainkan secara berurutan." }
summary:
  ar: "يرويه مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يُسأل عن قضاء رمضان، فقال: أحب إلي أن لا يُفرّق قضاء رمضان، وأن يُواتر، أي يُتابع. ويذكر المحقق أنه رواه عن مالك أبو مصعب (822) وسويد (470). {cite:muwatta-maruf-1997 p.409}"
  tr: "Malik, Yahya ibn Sa'id'den rivayet ederek, Sa'id ibn al-Musayyab'a Ramazan oruçlarının kaza edilmesi hakkında soru sorulduğunu işitmiştir. Sa'id ibn al-Musayyab şöyle demiştir: \"Kaçırılan Ramazan oruçlarının ayrı ayrı aralıklarla değil, ardı ardına kaza edilmesini tercih ederim.\" Editör, bunun Malik'ten Ebu Mus'ab (822) ve Suwayd (470) tarafından rivayet edildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.409}"
  id: "Malik meriwayatkan hadits ini dari Yahya bin Sa'id, yang mendengar Sa'id bin al-Musayyab ditanya tentang mengganti puasa Ramadan yang terlewat. Beliau berkata: \"Saya lebih suka puasa Ramadan yang terlewat tidak diganti secara terpisah, melainkan secara berurutan.\" Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Mus'ab (822) dan Suwayd (470). {cite:muwatta-maruf-1997 p.409}"
