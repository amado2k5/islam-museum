summary:
  ar: "يروي يحيى عن مالك أنه بلغه أن أبا بكر بن محمد بن عمرو بن حزم أقاد من كسر الفخذ. {cite:muwatta-maruf-1997 p.449}"
  tr: "Yahya, Malik'ten rivayetle, Ebu Bekir ibn Muhammed ibn Amr ibn Hazm'ın kırık bir uyluk için misilleme yaptığını duyduğunu aktarır. {cite:muwatta-maruf-1997 s.449}"
  id: "Yahya meriwayatkan dari Malik bahwa ia mendengar bahwa Abu Bakr ibn Muhammad ibn Amr ibn Hazm melakukan pembalasan atas patah tulang paha. {cite:muwatta-maruf-1997 p.449}"
