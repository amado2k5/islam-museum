text: "… الأعلامُ التي يستدل بها على الطريق والمياه. قال ابن هشام: يقول: مُسِحَتْ فاستوَت بالأرض فليس فيها شيء ناتءٌ. النفر الذين حزبوا الأحزاب : قال ابن إسحاق: وكان الذين حَزَّبُوا الأَحْزَابَ مِنْ قُريشٍ وغَطَفَانَ وبني قُرَيظة: حُيَيُّ بْنُ أخْطَبَ، وسَلاَّمُ بْنُ …"
