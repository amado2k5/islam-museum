label: { ar: "سنن النسائي 2102 — الأب والأبوة", en: "Sunan al-Nasa'i 2102 — the father and fatherhood", ur: "سنن نسائی 2102 — باپ اور والدیت", es: "Sunan al-Nasa'i 2102 — El padre y la paternidad", fr: "Sunan al-Nasa'i 2102 — le père et la paternité", tr: "Sunan an-Nasa'i 2102 — Baba ve Babalık", id: "Sunan an-Nasa'i 2102 — Sang Ayah dan Peran Ayah" }
text: "… بْنُ سَعْدٍ، قَالَ حَدَّثَنَا عَمِّي، قَالَ حَدَّثَنَا أَبِي، عَنِ ابْنِ إِسْحَاقَ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ أَبِي أَنَسٍ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ قَالَ \" إِذَا دَخَلَ شَهْرُ رَمَضَانَ فُتِّحَتْ أَبْوَابُ الْجَنَّةِ وَغُلِّقَتْ أَبْوَابُ النَّارِ وَسُلْسِلَتِ الشَّيَاطِينُ \". قَالَ أَبُو عَبْدِ الرَّحْمَنِ هَذَا - يَعْنِي حَدِيثَ ابْنِ إِسْحَاقَ - خَطَأٌ وَلَمْ يَسْمَعْهُ ابْنُ إِسْحَاقَ …"
summary:
  ar: "حديث في سنن النسائي، رقم 2102، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 2102 (The Book of Fasting), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 2102، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 2102 (El Libro del Ayuno), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 2102 (Le Livre du jeûne), mentionne le père et la paternité. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 2102 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan derler."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 2102, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
