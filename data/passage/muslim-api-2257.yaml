label: { ar: "صحيح مسلم 2257 — الأب والأبوة، تربية الأب ووصيته", en: "Sahih Muslim 2257 — the father and fatherhood; the father raising and counselling", ur: "صحیح مسلم 2257 — باپ اور والدیت، باپ کی تربیت اور نصیحت", es: "Sahih Muslim 2257 — El padre y la paternidad; la crianza y el asesoramiento paternos", fr: "Sahih Muslim 2257 — Le père et la paternité; l’éducation et les conseils du père", tr: "Sahih Muslim 2257 — Baba ve Babalık, Babanın Yetiştirilmesi ve İradesi", id: "Sahih Muslim 2257 — Ayah dan Peran Ayah, Didikan Ayah dan Wasiat" }
text: "… قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ، الأَسَدِيُّ عَنْ سُفْيَانَ، عَنْ عَلْقَمَةَ بْنِ مَرْثَدٍ، عَنْ سُلَيْمَانَ بْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، قَالَ كَانَ رَسُولُ اللَّهِ يُعَلِّمُهُمْ إِذَا خَرَجُوا إِلَى الْمَقَابِرِ فَكَانَ قَائِلُهُمْ يَقُولُ - فِي رِوَايَةِ أَبِي بَكْرٍ - السَّلاَمُ عَلَى أَهْلِ الدِّيَارِ - وَفِي رِوَايَةِ زُهَيْرٍ - السَّلاَمُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ وَإِنَّا إِنْ …"
summary:
  ar: "حديث في صحيح مسلم، رقم 2257، يذكر الأب والأبوة، وتربية الأب ووصيته. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih Muslim, no. 2257 (The Book of Prayer - Funerals), that mentions the father and fatherhood, the father raising and counselling. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "صحیح مسلم کی حدیث نمبر 2257، جس میں باپ اور والدیت، باپ کی تربیت اور نصیحت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih Muslim, n.° 2257 (El Libro de la Oración - Funerales), menciona al padre y la paternidad, la crianza y el consejo paternos. El Navegador de la Paternidad en el Islam lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Le Sahih Muslim, n° 2257 (Le Livre de la prière – Funérailles), mentionne le père et la paternité, l'éducation et le rôle du père dans l'éducation de ses enfants. Le site « Paternité en Islam » répertorie ce passage avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages consacrés au père."
  tr: "Sahih Müslim'de 2257 numaralı hadis, babayı, babalığı, babanın çocuk yetiştirmedeki rolünü ve tavsiyelerini ele almaktadır. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, Peygamberin biyografisi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 2257, menyebutkan tentang ayah, peran ayah, peran ayah dalam membesarkan anak, dan nasihatnya. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan buku-buku lain tentang topik ini."
