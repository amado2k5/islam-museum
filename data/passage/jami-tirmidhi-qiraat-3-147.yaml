text: "… زَيْدِ بْنِ ثَابِتٍ وَسَعِيدِ بْنِ الْعَاصِ وَعَبْدِ الرَّحْمَنِ بْنِ الْحَارِثِ بْنِ هِشَامٍ وَعَبْدِ اللَّهِ بْنِ الزُّبَيْرِ : أَنِ انْسَخُوا الصُّحُفَ فِي الْمَصَاحِفِ، وَقَالَ لِلرَّهْطِ الْقُرَشِيِّينَ الثَّلَاثَةِ : مَا اخْتَلَفْتُمْ أَنْتُمْ وَزَيْدُ بْنُ ثَابِتٍ فَاكْتُبُوهُ بِلِسَانِ قُرَيْشٍ ؛ فَإِنَّمَا نَزَلَ بِلِسَانِهِمْ، …"
summary:
  ar: "مقطع من جامع الترمذي، المجلد المصوَّر 3، ص 147، يذكر جمع القرآن والمصاحف، ورسم المصحف؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط."
  en: "An excerpt from Jami' al-Tirmidhi, scan volume 3, p. 147, that mentions the collection of the Qur'an and the codices, the orthography of the mushaf; from the machine-read scan, quoted within forty words per the sources policy. The browser of the museum for how the Qur'an was read and written lists it."
  ur: "جامع ترمذی، اسکین جلد 3، ص 147 کا اقتباس جس میں جمعِ قرآن اور مصاحف، رسمِ مصحف کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Jami' al-Tirmidhi, volumen 3, pág. 147, que menciona la colección del Corán y los códices, la ortografía del mushaf; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador del museo sobre cómo se leía y escribía el Corán lo incluye."
  fr: "Un extrait du Jami' al-Tirmidhi, volume 3, page 147, mentionne la collecte du Coran et des codex, ainsi que l'orthographe du mushaf; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cette information figure dans le catalogue du musée consacré à la lecture et à l'écriture du Coran."
  tr: "Cami' el-Tirmizi'nin 3. cildinin 147. sayfasından bir alıntı, Kur'an'ın derlenmesi, el yazmaları ve yazı sisteminden bahsetmektedir; bu alıntı, makineyle okunabilir taranmış bir kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Bu metin, Kur'an okunuşları, yazı sistemi, hat sanatı ve diyakritik işaretler konusunda uzmanlaşmış bir araştırmacı tarafından derlenmiştir."
  id: "Sebuah kutipan dari Jami' al-Tirmidhi, Volume 3, halaman 147, menyebutkan penyusunan Al-Qur'an dan manuskripnya, serta aksara Al-Qur'an; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh seorang peneliti yang berspesialisasi dalam bacaan Al-Qur'an, aksara, kaligrafi, dan diakritik."
