text: "… وأحمد. توفي أسيد بن حضير في شعبان سنة عشرين، أخبرنا أبو محمد القاسم بن علي بن هبة اللّٰه بن وحمل عمر بن الخطاب السرير حتى عساكر، عن أبي المظفر القشيري إجازة، قال: وضعه بالبقيع؛ وصلّى عليه، وأوصى إلى عمر، فنظر …"
summary:
  ar: "مقطع من أسد الغابة لابن الأثير، المجلد المصوَّر 2، ص 49، يذكر وصية أو عهد أخير، ودفن وقبر ومرقد؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Athir's Usd al-Ghaba, scan volume 2, p. 49, that mentions a testament or parting counsel, a burial, grave or resting place; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "اسد الغابہ، ابن الاثیر، اسکین جلد 2، ص 49 کا اقتباس جس میں وصیت یا آخری نصیحت، تدفین، قبر اور مرقد کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto del Usd al-Ghaba de Ibn al-Athir, volumen 2, pág. 49, que menciona un testamento o consejo de despedida, un entierro, tumba o lugar de descanso; tomado del escaneo leído por máquina, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Usd al-Ghaba d'Ibn al-Athir, tome 2, page 49, mentionnant un testament ou des dernières volontés, un enterrement, une tombe ou un lieu de repos; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "İbn el-Athir'in Usd al-Ghaba adlı eserinin Resimli Cilt 2, sayfa 49'daki bir alıntısında, vasiyetname veya son vasiyet, defin, mezar ve türbeden bahsedilmektedir; bu alıntı, makineyle okunabilir tıpkıbasım baskısından alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Bu metin, Vasiyetnameler, Miraslar, Antik Eserler ve Türbeler Tarayıcısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Usd al-Ghaba karya Ibn al-Athir, Jilid 2 Bergambar, hlm. 49, menyebutkan surat wasiat atau testamen terakhir, pemakaman, kuburan, dan makam; dari edisi faksimili yang dapat dibaca mesin. Teks tersebut dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber. Teks ini disusun oleh Wills, Inheritances, Antiquities, and Tombs Browser."
