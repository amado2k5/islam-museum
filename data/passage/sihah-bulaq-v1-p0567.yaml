text: |-
  ١ ى لا يعرف له أصل ولا قوم.
  ولا أب ولا شرف اه عاصم
  ٢ وله مايرم الخ من الارمام
  يقال أرمّ العظم اذا جرى فيه الرم
  وهوالمخ اه وانقولى
  ٧٤
  والضرب الخفيف من المطر والضرب الرجل الخفيف اللحم قال طرفة
  أنا الرجل الضرب الذى تعرفونه • خشاش كرأس الحية المتوقد
  والضرب الصغة والصنف من الاساء ودرهم ضرب وصف بالمصدركة ولهم ماءعور
  وسكب ويقال الضرب الاسراع فى المشى والضرب بالتحريك العسل الابيض الغليف
  يذكرويؤنت قال الهذلى
  وماضرب بيضاءيأوى مليكها * الى طنف أعيا براق ونازل
  واستضرب العسل صار ضر باوهذا كقولهم استنوق الجمل واستتيس العنز بمعنى التعوّل من
  حال الى حال وتقول أنت الناقة على مضر بم ما بكسر الراء أى الوقت الذى ضربها الفعل
  فيه جعاوا الزمان كالمكان وتقول أيضا مالفلان مضرب عسلة أى مضرب من النسب
  والمال وما أعرف له مضرب عسلة تعنى أعراقه ١ مضرب السيف أيضانحو من شبرمن
  طرفه وكذلك مضرية السيف والمضرب أيضا العظم الذى فيه مخ تقول للشاة اذا كانت
  مهزولة ما يرمّ منها ٢ م ضرب أى اذا كسر عظم من عظامها لم يصب فيه مخ والمضراب
  الذى يضرب به العود ورجل مضرب بكسر الميم شديد الضرب والضارب المكان
  ذوالشجر والضارب الناقة التى تضرب حالبها والضارب الليسل الذى ذهبت ظلته بينا
  وشمالاوملات الدنيا قال الراجز
  باليت أم الغمركانت صاسى • مكان من أمسى على الركائب
  ورابعتنى تحت ليل ضارب * بساعد فعم وكف خاضب
  والضارب السامح قال ذوالرمة
  ليالى اللهو تطبينى فأتبعه • كانى ضارب فى غمرة لعب
  والضارب والضريب الذى يضرب بالقداح وه والموكل بها والجمع الضرباء وانضريب
  الصقيع تقول منه ضربت الارض كما تقول طلت الارض من الطل وضريب الشي مثله
  وشكاه والضرائب الاشكال وضر يب الشول لبن يحاب بعضه على بعض عن أبى نصر
  وقال بعض أهل البادية لا بكون ضريبا الا من عدّق ابل قنه ما يكون رقيقا ومنه
  مايكون خاثرا قال ابن أحر
  وما كنت أخشى أن تكون منيتى • ضريب جلاد الشول خطا وصافيا
  والضريبة الطبيعة والسجية تقول فلان كريم الضريبة ولقيم الضريبة وكذلك تقول فى
  النحيتة والسليقة والنحيزة والبوس والسوص والغريزة والنحاس واللخيم والضريبة واحدة
  الضرائب التى تؤخذ فى الارصاد والجزية ونحوها ومنه ضرية العبدوهى غلته والضريبة
  المضروب بالسيف واغماد خلته الهاء وإن كان بعنى مفعول لانه صارفى ء_داد الاسماء
  كالنطيحة والاكيلة والضريبة الصوف أو الشعر ينفش ثم يدرح ويشد بخيط ثم يغزل والجمع
  الضرائب غب ، الضغاب والضغيب صوت الارنب وقد ضغبت تضغب وامرأة
  ضغبة أى مواعسة بحب الضغايدس وهى صغار القماء أسقطت السين منه لانها آخر حروف
  | الاسم كماقيل فى تصغير فرزدق فريزد ⁦(ضوب)⁩ الضوبان الجل القوى الضخم
  واجده
