label: { ar: "نوادر جحا الكبرى، ص 62 — «إذا لم أجده يسمع صوتي»", en: "Nawadir Juha al-Kubra, p. 62 — 'If I Do Not Find It, It Will Hear My Voice'", ur: "نوادر جحا الکبریٰ، ص 62 — «اگر نہ ملا تو وہ میری آواز سنے گا»", fr: "Nawadir Juha al-Kubra, p. 62 — « Si je ne le trouve pas, il entendra ma voix »", es: "Nawadir Juha al-Kubra, p. 62 — «Si no lo encuentro, oirá mi voz»", tr: "Juha'nın Büyük Fıkraları, s. 62 — “Eğer onu bulamazsam, sesimi duyacaktır.”", id: "Anekdot Hebat Juha, hlm. 62 — “Jika aku tidak menemukannya, dia akan mendengar suaraku”" }
text: "… إذا لم أجدْهُ يسمع صوتي وأضاع حماره يوماً، فأخذ يفتِّش عليه، ويغني، فقالوا له: هل مَنْ أضاعَ حمارَهُ يغني، أم يبتئس؟ فأجابهم: لعلَّهُ وراءَ هذا الجبل، فإذا لم أجذْهُ فلا بُدَّ مِنْ أنْ يسمعَ صوتي، فيعلم أنّي غيرُ مهتمِّ له …"
summary:
  ar: "كان جحا يبحث عن حماره الضائع وهو يغني؛ فسُئل أينبغي لمن أضاع حمارًا أن يغني أم يحزن، فقال إنه إن كان وراء التل سمع صوته وجاء، لأنه يعلم أنه غير قلق. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  en: "Searching for his lost donkey, Juha sings; asked whether a man who lost a donkey should sing or grieve, he says that if it is behind the hill it will hear his voice and come, knowing he is not worried. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  ur: "جحا اپنے گمشدہ گدھے کو ڈھونڈتے ہوئے گا رہا تھا؛ پوچھا گیا کہ گدھا کھونے والا گائے یا غم کرے، تو اس نے کہا کہ اگر وہ ٹیلے کے پیچھے ہے تو میری آواز سنے گا اور آ جائے گا، کیونکہ اسے معلوم ہو گا کہ مجھے فکر نہیں۔ {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  fr: "Cherchant son âne perdu, Juha chante; quand on lui demande si celui qui a perdu un âne doit chanter ou s'affliger, il dit que s'il est derrière la colline, il entendra sa voix et viendra, sachant qu'il n'est pas inquiet. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  es: "Buscando su burro perdido, Juha canta; cuando le preguntan si quien ha perdido un burro debe cantar o afligirse, dice que, si está detrás de la colina, oirá su voz y vendrá, sabiendo que él no está preocupado. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
  tr: "Juha, kayıp eşeğini ararken şarkı söylüyordu; kendisine, eşeğini kaybeden birinin şarkı mı söylemesi yoksa yas mı tutması gerektiği soruldu. O da, eğer eşek tepenin ötesindeyse, sesini duyup geleceğini, çünkü eşeğin endişelenmediğini bildiğini söyledi. {cite:juha-nawadir-kubra-djuwaydi s. 62}"
  id: "Juha sedang mencari keledainya yang hilang sambil bernyanyi; ia ditanya apakah seseorang yang kehilangan keledai harus bernyanyi atau berduka. Ia menjawab bahwa jika keledai itu berada di balik bukit, ia akan mendengar suaranya dan datang, karena ia tahu keledai itu tidak khawatir. {cite:juha-nawadir-kubra-djuwaydi p. 62}"
