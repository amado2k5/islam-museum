text: "ير مجموع في موضع واحد ولا مرتب السور، وقال الحارث: المحاسبي في كتاب فهم السنن، كتابة القرآن ليست بمحدثة فإنه وليف كان يأمر بكتابته ولكنه كان مفرقا في الرقاع ونحوها، وإنما أمر الصديق بنسخها من مكان إلى مكان مجتمعا، وكان"
