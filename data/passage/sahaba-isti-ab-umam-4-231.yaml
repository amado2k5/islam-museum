text: "… المسيبِ يقولُ: ولَد نوحٌ ثلاثةً، وولَد كلُّ واحدٍ ثلاثةً؛ سامَ وحامَ ويافثَ، فولَد سامُ العربَ وفارسَ والرومَ، وفي كلِّ هؤلاء خيرٌ، وولَد يافثُ التركَ والصقالبةَ ويأجوجَ ومأجوجَ، وليس في. واحدٍ من هؤلاء خيرٌ، وولَد حامُ القبطَ والسودانَ والبربرَ في حاشية …"
summary:
  ar: "مقطع من الاستيعاب لابن عبد البر، المجلد المصوَّر 4، ص 231، فيه ذكر أمم وأديان وشعوب غير مسلمة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الأمم والأديان والطوائف والشعوب غير المسلمة."
  en: "An excerpt from Ibn 'Abd al-Barr's al-Isti'ab, scan volume 4, p. 231, with mentions of non-Muslim nations, religions and peoples; from the machine-read scan, quoted within forty words per the sources policy. The Umam Browser lists it."
  ur: "الاستیعاب، ابن عبد البر، اسکین جلد 4، ص 231 کا اقتباس جس میں غیر مسلم امتوں، ادیان اور اقوام کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ غیر مسلم امتوں، ادیان، فرقوں اور اقوام کا براؤزر اسے درج کرتا ہے۔"
  es: "Fragmento de Al-Isti'ab de Ibn 'Abd al-Barr, volumen 4, pág. 231, con menciones de naciones, religiones y pueblos no musulmanes; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Umam lo incluye en su lista."
  fr: "Extrait de l'ouvrage d'Ibn 'Abd al-Barr, al-Isti'ab, volume 4, page 231, mentionnant des nations, des religions et des peuples non musulmans; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Ce texte est répertorié dans le navigateur Umam."
  tr: "İbn Abdülbarr'ın el-İsti'ab adlı eserinin resimli 4. cildinin 231. sayfasından, Müslüman olmayan milletler, dinler ve halklardan bahseden bir bölüm; makine tarafından okunabilir taranmış baskıdan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle özetlenmiştir. Müslüman olmayan milletler, dinler, mezhepler ve halklar tarayıcısı tarafından derlenmiştir."
  id: "Kutipan dari kitab al-Isti'ab karya Ibn Abd al-Barr, jilid 4 bergambar, halaman 231, yang menyebutkan bangsa, agama, dan masyarakat non-Muslim; dari edisi hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata, sesuai dengan kebijakan sumber. Disusun oleh peramban bangsa, agama, sekte, dan masyarakat non-Muslim."
