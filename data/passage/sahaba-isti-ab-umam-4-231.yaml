text: "… المسيبِ يقولُ: ولَد نوحٌ ثلاثةً، وولَد كلُّ واحدٍ ثلاثةً؛ سامَ وحامَ ويافثَ، فولَد سامُ العربَ وفارسَ والرومَ، وفي كلِّ هؤلاء خيرٌ، وولَد يافثُ التركَ والصقالبةَ ويأجوجَ ومأجوجَ، وليس في. واحدٍ من هؤلاء خيرٌ، وولَد حامُ القبطَ والسودانَ والبربرَ في حاشية …"
