label:
  ar: "أبو داود 5274 — يؤذيني ابن آدم يسب الدهر وأنا الدهر"
  en: "Abu Dawud 5274 — The son of Adam wrongs Me by cursing time, and I am time"
  ur: "ابو داود 5274 — ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں"
text: "يقول الله عز وجل يؤذيني ابن آدم يسب الدهر وأنا الدهر بيدي الأمر أقلب الليل والنهار . قال ابن السرح عن ابن المسيب مكان سعيد . والله أعلم ."
summary:
  ar: "حديث قدسي في سنن أبي داود، رقم 5274: يؤذيني ابن آدم يسب الدهر وأنا الدهر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Abi Dawud, no. 5274: The son of Adam wrongs Me by cursing time, and I am time. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابی داود میں حدیثِ قدسی، نمبر 5274: ابن آدم زمانے کو برا کہہ کر مجھے ایذا دیتا ہے اور زمانہ میں ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
