label: { ar: "سنن ابن ماجه 3691 — اليتيم وفقد الأب", en: "Sunan Ibn Majah 3691 — the orphan and the father lost", ur: "سنن ابن ماجہ 3691 — یتیم اور باپ کی موت", es: "Sunan Ibn Majah 3691 — El huérfano y el padre perdido" }
text: "… قَالَ رَسُولُ اللَّهِ ـ \" لاَ يَدْخُلُ الْجَنَّةَ سَيِّئُ الْمَلَكَةِ \". قَالُوا يَا رَسُولَ اللَّهِ أَلَيْسَ أَخْبَرْتَنَا أَنَّ هَذِهِ الأُمَّةَ أَكْثَرُ الأُمَمِ مَمْلُوكِينَ وَيَتَامَى قَالَ \" نَعَمْ فَأَكْرِمُوهُمْ كَكَرَامَةِ أَوْلاَدِكُمْ وَأَطْعِمُوهُمْ مِمَّا تَأْكُلُونَ \". قَالُوا فَمَا يَنْفَعُنَا فِي الدُّنْيَا قَالَ \" فَرَسٌ تَرْتَبِطُهُ تُقَاتِلُ عَلَيْهِ فِي سَبِيلِ اللَّهِ مَمْلُوكُكَ يَكْفِيكَ فَإِذَا صَلَّى فَهُوَ أَخُوكَ \"."
summary:
  ar: "حديث في سنن ابن ماجه، رقم 3691، يذكر اليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 3691 (Etiquette), that mentions the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 3691، جس میں یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 3691 (Etiqueta), menciona al huérfano y al padre ausente. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre la figura paterna."
