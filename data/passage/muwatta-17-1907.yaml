label: { ar: "الموطأ 1907 — مالك: من أسلف في شيء من الحيوان إلى أجل مسمى، فوصفه وحلاه، ونقد ثمنه، فذلك جائز، لازم للبائع والمبتاع على ما وصفا وحليا، ولم يزل ذلك من عمل الناس الجائز بينهم", en: "Muwatta 1907", es: "Muwatta 1907", fr: "Muwatta 1907", ur: "موطا 1907", tr: "El-Muvatta 1907 — Malik: Bir kimse belirli bir süre için bir hayvanı ödünç alır, onu tanımlar ve bedelini öderse, bu, tanımladıkları ve açıkladıkları doğrultusunda hem satıcı hem de alıcı için caiz ve bağlayıcıdır. Bu, insanlar arasında her zaman caiz bir uygulama olmuştur.", id: "Al-Muwatta 1907 — Malik: Jika seseorang memberikan pinjaman dengan jaminan hewan untuk jangka waktu tertentu, mendeskripsikan hewan tersebut, dan membayar harganya, maka hal itu diperbolehkan dan mengikat baik bagi penjual maupun pembeli sesuai dengan apa yang mereka deskripsikan dan uraikan. Ini selalu menjadi praktik yang diperbolehkan di kalangan manusia." }
summary:
  ar: "قال مالك: ومن أسلف في شيء من الحيوان إلى أجل مسمى، فوصفه وحلاه، ونقد ثمنه، فذلك جائز. وهو لازم للبائع والمبتاع على ما وصفا وحليا. ولم يزل ذلك من عمل الناس الجائز بينهم، والذي لم يزل عليه أهل العلم ببلدنا. {cite:muwatta-maruf-1997 p.182}"
  tr: "Malik şöyle demiştir: Bir kimse belirli bir süre için bir hayvanı ödünç alır, onu tarif eder, özelliklerini belirtir ve bedelini öderse, bu caizdir. Bu, hem satıcı hem de alıcı için, tarif ettikleri ve özelliklerini belirttikleri şekilde bağlayıcıdır. Bu, insanlar arasında her zaman caiz bir uygulama olmuştur ve ülkemizin âlimleri de her zaman buna bağlı kalmışlardır. {cite:muwatta-maruf-1997 s.182}"
  id: "Malik berkata: Jika seseorang meminjamkan uang dengan jaminan hewan untuk jangka waktu tertentu, mendeskripsikan dan menggambarkan hewan tersebut, dan membayar harganya, maka hal itu diperbolehkan. Hal itu mengikat baik penjual maupun pembeli sesuai dengan apa yang mereka deskripsikan dan gambarkan. Ini selalu menjadi praktik yang diperbolehkan di kalangan masyarakat, dan inilah yang selalu dipegang teguh oleh para ulama di negeri kita. {cite:muwatta-maruf-1997 p.182}"
