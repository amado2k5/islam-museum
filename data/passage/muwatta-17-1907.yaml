label: { ar: "الموطأ 1907 — مالك: من أسلف في شيء من الحيوان إلى أجل مسمى، فوصفه وحلاه، ونقد ثمنه، فذلك جائز، لازم للبائع والمبتاع على ما وصفا وحليا، ولم يزل ذلك من عمل الناس الجائز بينهم", en: "Muwatta 1907" }
summary:
  ar: "قال مالك: ومن أسلف في شيء من الحيوان إلى أجل مسمى، فوصفه وحلاه، ونقد ثمنه، فذلك جائز. وهو لازم للبائع والمبتاع على ما وصفا وحليا. ولم يزل ذلك من عمل الناس الجائز بينهم، والذي لم يزل عليه أهل العلم ببلدنا. {cite:muwatta-maruf-1997 p.182}"
