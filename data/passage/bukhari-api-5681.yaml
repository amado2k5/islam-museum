label: { ar: "صحيح البخاري 5681 — الحجامة، الكي", en: "Sahih al-Bukhari 5681 — cupping; cautery", ur: "صحیح بخاری 5681 — حجامہ، داغنا", es: "Sahih al-Bukhari 5681 — ventosas; cauterización", fr: "Sahih al-Bukhari 5681 — ventouses; cautère", tr: "Sahih el-Buhari 5681 — Hacamat, Dağlama", id: "Sahih al-Bukhari 5681 — Bekam, Kauterisasi" }
text: "حَدَّثَنِي مُحَمَّدُ بْنُ عَبْدِ الرَّحِيمِ، أَخْبَرَنَا سُرَيْجُ بْنُ يُونُسَ أَبُو الْحَارِثِ، حَدَّثَنَا مَرْوَانُ بْنُ شُجَاعٍ، عَنْ سَالِمٍ الأَفْطَسِ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ قَالَ \" الشِّفَاءُ فِي ثَلاَثَةٍ شَرْطَةِ مِحْجَمٍ، أَوْ شَرْبَةِ عَسَلٍ، أَوْ كَيَّةٍ بِنَارٍ، وَأَنْهَى أُمَّتِي عَنِ الْكَىِّ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 5681، يذكر الحجامة، والكي، والتداوي بالعسل، والشفاء. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih al-Bukhari, no. 5681 (Medicine), that mentions cupping, cautery, honey as a remedy, healing. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح بخاری کی حدیث نمبر 5681، جس میں حجامہ، داغنا، شہد سے علاج، شفا کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Sahih al-Bukhari, n.° 5681 (Medicina), menciona la ventosaterapia, la cauterización y la miel como remedios y tratamientos curativos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un hadith du Sahih al-Bukhari, n° 5681 (Médecine), mentionne la ventousothérapie, la cautérisation et le miel comme remèdes. Le navigateur de ressources médicales le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Sahih el-Buhari'de 5681 numaralı hadis, hacamat, yakma, bal ile tedavi ve iyileşmeden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedavi yöntemleri hakkındaki metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Sahih al-Bukhari, nomor 5681, menyebutkan tentang bekam, kauterisasi, pengobatan dengan madu, dan penyembuhan. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan terapi."
