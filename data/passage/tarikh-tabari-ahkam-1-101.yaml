  en: "An excerpt from al-Tabari's History, scan volume 1, p. 101, whose wording mentions the disliked (makruh); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
