text: "سنة بعث اليم فعُقد له هناك فكان سبب هلاك ابن الزيّات وكان بُغا الشرابىُّ الرسول اليه يدعوه فسلّم عليه بالخلافة فى الطريق فعقدوا له وبايعوا فامهل حتى اذا كان يوم الاربعاء لسبع خلون من صفر وقد عزم المتوكل على مكروه …"
summary:
