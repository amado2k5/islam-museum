text: "… النبي وَ فيم وجُحودِهِم الإسلامَ، وكانَتْ أحبار يَهُودَ هُمْ الذين يسألون رسولَ اللّٰه وَاِعِ ويَتَعَنَّقُونه ويأتونه باللَّبْسِ، لِيَلْبِسُوا الحَقَّ بالباطِلِ، فكان القرآنُ ينزِل فيهم وفيما يسألون عنه، إلاّ قليلاً من المسائل في الحلالِ والحرامِ كان المُسْلمون يَسألون عنها. من بني …"
