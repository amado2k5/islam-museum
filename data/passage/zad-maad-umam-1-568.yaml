text: "… وهؤلاء هم بنو الحارث بن كعب. فقوله : بعث علياً إلى أهل نجران لياتيه بصدقاتهم أو جزيتهم، أراد به الطائفتين من أهل نجران، صدقات من أسلم منهم، وجزية النصارى. فصل في قدوم رسول فَرْوَةَ بنِ عمرو الجُذَامي ملك عرب الروم …"
summary:
