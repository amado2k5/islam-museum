text: "… وضع يده على فمه، فانصرفوا فسألوا فقيل لهم: قد ولد لعبد اللّٰه بن عبد المطلب غلام، فذهب اليهودي معهم إلى أمه فأخرجته لهم، فلما رأى اليهودي العلامة خر مغشيًا عليه وقال : ذهبت النبوة من بني إسرائيل، يا معشر قريش …"
