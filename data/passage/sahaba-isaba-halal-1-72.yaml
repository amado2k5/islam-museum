text: "مقدمة التحقيق نقدر أن نؤدّيه كما سمعنا قال: إِذَا لَمْ تُحِلُّوا حَرَاماً وَلَمْ تُحَرِّمُوا حَلَالا وَأَصَبْتُمُ الْمَعْنَى فَلَا بَأْسَ.، والحديثان الثَّاني والثالث مكذوبان على أبي هريرة، إذ في سند الأوّل منهما أَشْعَثُ بْنُ بُرازٍ كذاب ساقط لا يؤخذ حديثه قال …"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 1، ص 72، يذكر الحلال، وما لا يحل، والحرام، وما حُرّم؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الحلال والحرام."
