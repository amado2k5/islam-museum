text: "… الجاهلين فهذا من الجاهلين، فقال عمر : صدقت، فكأنما كانت نارآ فأطفئت. وقال محمد بن كعب : ثلاث من كن فيه استكمل الإيمان بالله، إذا رضى لم يدخله رضاه فى الباطل وإذا غضب لم يخرجه غضبه عن الحق وإذا قدر …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 180، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 180, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 180 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Ihya' 'Ulum al-Din de al-Ghazali, volumen 1, pág. 180, que menciona la dulzura y la plenitud de la fe, rasgos que, presentes en una persona, la caracterizan, uno de los artículos de fe; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'al-Ghazali, Ihya' 'Ulum al-Din (tome 1, p. 180), évoquant la douceur et la plénitude de la foi, qualités qui, chez une personne, caractérisent la foi, l'un des articles de la foi. Cet extrait, issu d'une numérisation automatique, est cité en quarante mots conformément à la politique relative aux sources. Il figure dans le répertoire « Piliers et Branches de la Foi »."
  tr: "Gazali'nin İhya Ulum el-Din (Dinî İlimlerin Yeniden Canlandırılması) adlı eserinin 1. cildinin 180. sayfasından bir alıntı, imanın tatlılığı ve mükemmelliği, imanın sahiplerinin nitelikleri ve imanın rükünlerinden birini ele almaktadır. Bu alıntı, kaynak yönergelerine uygun olarak, yaklaşık kırk kelimeyle sınırlı, makine tarafından okunabilir baskıdan alınmıştır. İslam'ın rükünleri, imanın rükünleri, imanın dalları ve müminin nitelikleri konusunda uzmanlaşmış bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari kitab Ihya Ulum al-Din (Kebangkitan Ilmu-ilmu Agama) karya Al-Ghazali, Jilid 1, halaman 180, membahas tentang kemanisan dan kesempurnaan iman, sifat-sifat orang yang memilikinya, dan salah satu rukun iman. Kutipan ini diambil dari edisi yang dapat dibaca mesin, dan teksnya dibatasi hingga sekitar empat puluh kata, sesuai dengan pedoman sumber. Kutipan ini disusun oleh peramban yang khusus mempelajari rukun Islam, rukun iman, cabang-cabang iman, dan sifat-sifat seorang mukmin."
