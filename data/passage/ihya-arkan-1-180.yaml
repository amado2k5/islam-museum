text: "… الجاهلين فهذا من الجاهلين، فقال عمر : صدقت، فكأنما كانت نارآ فأطفئت. وقال محمد بن كعب : ثلاث من كن فيه استكمل الإيمان بالله، إذا رضى لم يدخله رضاه فى الباطل وإذا غضب لم يخرجه غضبه عن الحق وإذا قدر …"
summary:
  ar: "مقطع من إحياء علوم الدين للغزالي، المجلد المصوَّر 1، ص 180، يذكر حلاوة الإيمان وكماله، وخصال من كنّ فيه، وركن من أركان الإيمان؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from al-Ghazali's Ihya' 'Ulum al-Din, scan volume 1, p. 180, that mentions the sweetness and completeness of faith, traits that, found in a person, mark faith, one of the articles of faith; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "احیاء علوم الدین، غزالی، اسکین جلد 1، ص 180 کا اقتباس جس میں ایمان کی مٹھاس اور اس کا کمال، وہ خصلتیں جو جس میں ہوں، ایمان کا ایک رکن کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
