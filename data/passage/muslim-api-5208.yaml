label: { ar: "صحيح مسلم 5208 — ما لا يحل، الحرام", en: "Sahih Muslim 5208 — what is not lawful; the unlawful", ur: "صحیح مسلم 5208 — جو حلال نہیں، حرام", es: "Sahih Muslim 5208 — lo que no es lícito; lo ilícito", fr: "Sahih Muslim 5208 — ce qui n'est pas licite; l'illicite" }
text: "وَحَدَّثَنَا حَجَّاجُ بْنُ الشَّاعِرِ، حَدَّثَنَا ضَحَّاكُ بْنُ مَخْلَدٍ، عَنْ سُفْيَانَ، عَنْ عَلْقَمَةَ بْنِ، مَرْثَدٍ عَنِ ابْنِ بُرَيْدَةَ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ قَالَ \" نَهَيْتُكُمْ عَنِ الظُّرُوفِ وَإِنَّ الظُّرُوفَ - أَوْ ظَرْفًا - لاَ يُحِلُّ شَيْئًا وَلاَ يُحَرِّمُهُ وَكُلُّ مُسْكِرٍ حَرَامٌ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 5208، يذكر ما لا يحل، والحرام، وما حُرّم. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sahih Muslim, no. 5208 (Introduction), that mentions what is not lawful, the unlawful, what was made unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "صحیح مسلم کی حدیث نمبر 5208، جس میں جو حلال نہیں، حرام، جو حرام کیا گیا کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
  es: "Un informe en Sahih Muslim, n.° 5208 (Introducción), menciona lo que no es lícito, lo ilícito y lo que fue declarado ilícito. El Navegador Halal y Haram lo incluye junto con los textos del Corán, la Sunnah, la Seerah y los relatos de los Compañeros y Sucesores sobre lo que es lícito e ilícito."
  fr: "Un hadith du Sahih Muslim, n° 5208 (Introduction), mentionne ce qui est illicite et ce qui a été déclaré illicite. Le Halal and Haram Browser le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs concernant le licite et l'illicite."
