text: "… احسبوني حوت يونس كان يتفرَّج على الصيادين وهم يصطادون سمكاً من بحيرةِ آقَ شَهْرٌ وفيما هو يتأمَّل زلقت رجلُهُ، فوقع في الشبكة، فقال له الصيادون؟ ماذا فعلت؟ فأجابهم: احسبوني حوت يونسَ بين السمك. الفراريج حزينة على أمِّها ضاعت دجاجة الشيخ …"
summary:
  ar: "كان جحا يراقب صيادين في بحيرة آق شهر، فسقط في شبكتهم؛ وسُئل ماذا فعل، فقال إن يعدّوه بين السمك كحوت يونس. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  en: "Juha watches fishermen on the Akshehir lake and falls into their net; asked what he did, he says to count him among the fish as Jonah's whale. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  ur: "جحا آق شہر کی جھیل پر مچھیروں کو دیکھ رہا تھا اور ان کے جال میں گر پڑا؛ پوچھا گیا کہ یہ کیا کیا، تو اس نے کہا کہ مجھے مچھلیوں میں یونس کی مچھلی کی طرح گن لو۔ {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  fr: "Juha observe des pêcheurs sur le lac d'Akşehir et tombe dans leur filet; quand on lui demande ce qu'il a fait, il dit de le compter parmi les poissons comme la baleine de Jonas. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
  es: "Juha observa a unos pescadores en el lago de Akşehir y cae en su red; cuando le preguntan qué hizo, dice que lo cuenten entre los peces como la ballena de Jonás. {cite:juha-nawadir-kubra-djuwaydi p. 77}"
