label: { ar: "سنن ابن ماجه 1835 — الأب والأبوة، اليتيم وفقد الأب", en: "Sunan Ibn Majah 1835 — the father and fatherhood; the orphan and the father lost", ur: "سنن ابن ماجہ 1835 — باپ اور والدیت، یتیم اور باپ کی موت", es: "Sunan Ibn Majah 1835 — El padre y la paternidad; el huérfano y el padre perdido", fr: "Sunan Ibn Majah 1835 — Le père et la paternité; l’orphelin et le père perdu", tr: "Sunan İbn Majah 1835 — Baba ve babalık, yetim ve babanın kaybı", id: "Sunan Ibn Majah 1835 — Ayah dan peran ayah, anak yatim dan kehilangan ayah" }
text: "… أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا يَحْيَى بْنُ آدَمَ، حَدَّثَنَا حَفْصُ بْنُ غِيَاثٍ، عَنْ هِشَامِ بْنِ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ زَيْنَبَ بِنْتِ أُمِّ سَلَمَةَ، عَنْ أُمِّ سَلَمَةَ، قَالَتْ أَمَرَنَا رَسُولُ اللَّهِ ـ بِالصَّدَقَةِ. فَقَالَتْ زَيْنَبُ امْرَأَةُ عَبْدِ اللَّهِ أَيُجْزِينِي مِنَ الصَّدَقَةِ أَنْ أَتَصَدَّقَ عَلَى زَوْجِي وَهُوَ فَقِيرٌ وَبَنِي أَخٍ لِي أَيْتَامٍ وَأَنَا أُنْفِقُ عَلَيْهِمْ هَكَذَا …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 1835، يذكر الأب والأبوة، واليتيم وفقد الأب. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Ibn Majah, no. 1835 (The Chapters Regarding Zakat), that mentions the father and fatherhood, the orphan and the father lost. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابن ماجہ کی حدیث نمبر 1835، جس میں باپ اور والدیت، یتیم اور باپ کی موت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.° 1835 (Los capítulos sobre el Zakat), menciona al padre y la paternidad, al huérfano y al padre fallecido. El navegador \"La paternidad en el Islam\" lo incluye junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Ibn Majah, n° 1835 (Les chapitres concernant la Zakat), évoque le père et la paternité, l'orphelin et le père disparu. Le site « Paternité en Islam » répertorie ce hadith avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "İbn Majah'ın Sünen'inde yer alan 1835 numaralı hadiste baba ve babalık, yetim ve babanın kaybından bahsedilir. \"İslam'da Babalık\" bölümü, bu hadisi Kur'an, Sünnet, biyografi ve bu konuyla ilgili diğer kitaplardan alıntılarla birlikte derlemektedir."
  id: "Sebuah hadits dalam Sunan Ibn Majah, no. 1835, menyebutkan tentang ayah dan peran ayah, anak yatim, dan kehilangan seorang ayah. Bagian \"Peran Ayah dalam Islam\" mengumpulkan hadits ini bersama dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
