text: "… عكس هذا، وهو أن يقول للمحتضَر من يحضره: أمسك على ورثتك، وأبق لولدك فليس أحد أحق بمالك من أولادك، وينهاه عن الوصية، فيتضرر بذلك ذوو القربى وكل من يستحق أن يوصى له ؛ فقيل لهم: كما تخشون على ذرّيتكم وتسرون …"
summary:
  ar: "مقطع من الجامع لأحكام القرآن للقرطبي، المجلد المصوَّر 3، ص 1754، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from al-Qurtubi's al-Jami' li-Ahkam al-Qur'an, scan volume 3, p. 1754, that mentions a testament or parting counsel, a deathbed and last hours; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "الجامع لاحکام القرآن، قرطبی، اسکین جلد 3، ص 1754 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de al-Qurtubi, al-Jami' li-Ahkam al-Qur'an, volumen 3, pág. 1754, que menciona un testamento o consejo de despedida, el lecho de muerte y las últimas horas; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El Navegador de Testamentos lo incluye en su lista."
  fr: "Extrait du Coran d'al-Qurtubi (al-Jami' li-Ahkam al-Qur'an), volume 3, page 1754, mentionnant un testament ou des adieux, un lit de mort et les dernières heures; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire des Testaments."
  tr: "Al-Qurtubi'nin Al-Jami' li-Ahkam al-Qur'an adlı eserinin resimli 3. cildinin 1754. sayfasında, vasiyetname veya son miras ve ölüm saati geçmektedir; bu metin, makineyle okunabilir taranmış kopyadan alınmıştır. Kaynak politikasına göre metin yaklaşık kırk kelimeden oluşmaktadır. Vasiyetnameler, miraslar, eski eserler ve türbeler araştırmacısı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab Al-Qurtubi, Al-Jami' li-Ahkam al-Qur'an, jilid 3 bergambar, halaman 1754, menyebutkan wasiat atau surat wasiat terakhir, dan saat kematian; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks tersebut dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Teks ini disusun oleh peneliti wasiat, warisan, barang antik, dan tempat-tempat suci."
