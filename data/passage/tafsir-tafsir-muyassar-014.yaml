text: "فرائضه، وعاقبة الكافرين بالله النار. (٣٦) والذين أعطيناهم الكتاب من اليهود والنصارى من آمن منهم بك كعبد الله بن سلام والنجاشي، يستبشرون بالقرآن المنزل عليك لموافقته ما عندهم، ومن المتحزبين على الكفر ضدك، كالسيد والعاقب -أسقفي ((نجران)»-، وكعب بن الأشرف،"
