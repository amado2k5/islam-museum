label: { ar: "سنن ابن ماجه 256 — القراء", en: "Sunan Ibn Majah 256 — the readers", ur: "سنن ابن ماجہ 256 — قراء", es: "Sunan Ibn Majah 256 - los lectores", fr: "Sunan Ibn Majah 256 — les lecteurs" }
text: "… يَوْمٍ أَرْبَعَمِائَةِ مَرَّةٍ \". قَالُوا يَا رَسُولَ اللَّهِ وَمَنْ يَدْخُلُهُ قَالَ \" أُعِدَّ لِلْقُرَّاءِ الْمُرَائِينَ بِأَعْمَالِهِمْ وَإِنَّ مِنْ أَبْغَضِ الْقُرَّاءِ إِلَى اللَّهِ الَّذِينَ يَزُورُونَ الأُمَرَاءَ \". قَالَ الْمُحَارِبِيُّ الْجَوَرَةَ. قَالَ أَبُو الْحَسَنِ حَدَّثَنَا حَازِمُ بْنُ يَحْيَى حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ وَمُحَمَّدُ بْنُ نُمَيْرٍ قَالَا حَدَّثَنَا ابْنُ نُمَيْرٍ عَنْ مُعَاوِيَةَ النَّصْرِيِّ وَكَانَ ثِقَةً ثُمَّ …"
summary:
  ar: "حديث في سنن ابن ماجه، رقم 256، يذكر القراء. يجمعه متصفح قراءات القرآن والرسم والخطوط والضبط مع نصوص القرآن والسنة والسيرة والكتب في قراءات القرآن وكتابته."
  en: "A report in Sunan Ibn Majah, no. 256 (The Book of the Sunnah), that mentions the readers. The browser of the museum for how the Qur'an was read and written lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on that subject."
  ur: "سنن ابن ماجہ کی حدیث نمبر 256، جس میں قراء کا ذکر ہے۔ قراءات، رسم، خطوط اور نقطوں کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Ibn Majah, n.º 256 (El Libro de la Sunnah), menciona a los lectores. El explorador del museo sobre cómo se leía y escribía el Corán lo enumera junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el tema."
  fr: "Un rapport du Sunan Ibn Majah, n° 256 (Le Livre de la Sunna), mentionne les lecteurs. Le catalogue du musée consacré à la lecture et à la transcription du Coran répertorie ce rapport avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de ce sujet."
