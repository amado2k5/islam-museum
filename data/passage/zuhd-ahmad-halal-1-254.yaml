text: "… في استقصائها ؛ فإنها تنقلب إلى أضدادها، فمن بالغ في الأكل والشرب والجماع انقلب ذلك إلى ضده وحرم الأكل والشرب والجماع. الثالث: أن يصبر على أداء حق اللّٰه فيها ولا يضيعه فيسلبها. الرابع : أن يصبر عن صرفها في الحرام. …"
