text: "قال ابن السكن: لم يذكر في حديثه سماعا ولا رؤية، الله وليفي وكتب له كتابا إنه لا يجني عليه إلا يده. وإسناده ولست أدري أهو صحابي أم لا؟ ولم أجد له ذكرا إلا ضعيف. في هذا الحديث. ٢٥٨٠ - رافع"
