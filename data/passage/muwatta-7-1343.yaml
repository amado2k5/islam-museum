label: { ar: "الموطأ 1343 — سعيد بن المسيب: ليس برهان الخيل بأس إذا دخل فيها محلل، فإن سبق أخذ السبق، وإن سبق لم يكن عليه شيء", en: "Muwatta 1343", es: "Muwatta 1343", fr: "Muwatta 1343", ur: "موطا 1343", tr: "El-Muvatta 1343 — Sa’id ibn al-Musayyab: Yasal olarak yetkilendirilmiş bir kişi katılırsa at yarışlarında bir sakınca yoktur. At kazanırsa ödülü alır, kaybederse de hiçbir şeyden sorumlu değildir.", id: "Al-Muwatta 1343 — Sa’id ibn al-Musayyab: Tidak ada yang salah dengan pacuan kuda jika orang yang berpartisipasi adalah orang yang berwenang secara hukum. Jika kudanya menang, dia mengambil hadiahnya, dan jika kalah, dia tidak bertanggung jawab atas apa pun." }
summary:
  ar: "يروي مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول ليس برهان الخيل بأس إذا دخل فيها محلل، فإن سبق أخذ السبق، وإن سبق لم يكن عليه شيء. {cite:muwatta-maruf-1997 p.601}"
  tr: "Malik, Yahya ibn Sa'id'den rivayetle, Sa'id ibn al-Musayyab'ın şöyle dediğini işittiğini aktarır: \"Üçüncü şahıs kefilin katıldığı at yarışlarında bir sakınca yoktur. Yarış kazanılırsa ödülü alır; kazanılmazsa hiçbir sorumluluğu yoktur.\" {cite:muwatta-maruf-1997 s.601}"
  id: "Malik meriwayatkan dari Yahya ibn Sa'id bahwa ia mendengar Sa'id ibn al-Musayyab berkata: Tidak ada yang salah dengan pacuan kuda jika ada penjamin pihak ketiga yang ikut serta. Jika pacuan dimenangkan, dia mengambil hadiahnya; jika tidak, dia tidak bertanggung jawab. {cite:muwatta-maruf-1997 p.601}"
