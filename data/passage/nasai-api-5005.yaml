label: { ar: "سنن النسائي 5005 — شعب الإيمان، الإيمان بضع وسبعون شعبة", en: "Sunan al-Nasa'i 5005 — the branches of faith; faith as seventy-odd branches", ur: "سنن نسائی 5005 — ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں" }
text: "أَخْبَرَنَا أَحْمَدُ بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنَا أَبُو دَاوُدَ، عَنْ سُفْيَانَ، قَالَ وَحَدَّثَنَا أَبُو نُعَيْمٍ، قَالَ حَدَّثَنَا سُفْيَانُ، عَنْ سُهَيْلٍ، عَنْ عَبْدِ اللَّهِ بْنِ دِينَارٍ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ \" الإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً أَفْضَلُهَا لاَ إِلَهَ إِلاَّ اللَّهُ وَأَوْضَعُهَا إِمَاطَةُ الأَذَى عَنِ الطَّرِيقِ وَالْحَيَاءُ شُعْبَةٌ مِنَ الإِيمَانِ \"."
summary:
  ar: "حديث في سنن النسائي، رقم 5005، يذكر شعب الإيمان، والإيمان بضع وسبعون شعبة. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sunan al-Nasa'i, no. 5005 (The Book Of Faith and its Signs), that mentions the branches of faith, faith as seventy-odd branches. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "سنن نسائی کی حدیث نمبر 5005، جس میں ایمان کی شاخیں، ایمان کی ستر سے کچھ اوپر شاخیں کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
