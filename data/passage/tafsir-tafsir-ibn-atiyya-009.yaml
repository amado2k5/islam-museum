text: "اد العقل إذا اختل الدماغ . وقوله تعالى: ( فتكون) نصب بالفاء في جواب الاستفهام، صرف الفعل من الجزم إلى النصب . وقوله تعالى : ( فإنها لا تعمى الأبصر) لفظة مبالغة كأنه قال : ليس العمى عمى الأبصار وإنما"
