label: { ar: "الموطأ 819 — ابن شهاب: سعد بن أبي وقاص وعبد الله بن عمر كانا يحتجمان وهما صائمان", en: "Muwatta 819", es: "Muwatta 819", fr: "Muwatta 819", ur: "موطا 819", tr: "El-Muvatta 819 — İbn Şihab: Sa'd ibn Abi Vakkas ve Abdullah ibn Ömer oruçluyken hacamat yaptırırlardı.", id: "Al-Muwatta 819 — Ibn Shihab: Sa'd ibn Abi Waqqas dan `Abdullah ibn `Umar biasa melakukan bekam ketika mereka sedang berpuasa." }
summary:
  ar: "يرويه مالك عن ابن شهاب أن سعد بن أبي وقاص وعبد الله بن عمر كانا يحتجمان وهما صائمان. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد والشيباني (356)، وأن عبد الرزاق (7540) رواه عن معمر عن الزهري. {cite:muwatta-maruf-1997 p.401}"
  tr: "Malik, İbn Şihab'dan rivayetle, Sa'd ibn Abi Vakkas ve Abdullah ibn Ömer'in oruçluyken hacamat yaptırdıklarını nakletmiştir. Araştırmacı, bunun Malik'ten Ebu Mus'ab, Suveyd ve el-Şeybani (356) tarafından nakledildiğini ve Abd el-Razzaq'ın (7540) bunu Ma'mar'dan, o da el-Zuhri'den naklettiğini belirtmektedir. {cite:muwatta-maruf-1997 s.401}"
  id: "Malik meriwayatkannya dari Ibn Shihab bahwa Sa'd ibn Abi Waqqas dan Abdullah ibn Umar biasa melakukan bekam saat berpuasa. Peneliti menyebutkan bahwa riwayat ini diwariskan dari Malik oleh Abu Mus'ab, Suwaid, dan al-Shaybani (356), dan bahwa Abd al-Razzaq (7540) meriwayatkannya dari Ma'mar dari al-Zuhri. {cite:muwatta-maruf-1997 p.401}"
