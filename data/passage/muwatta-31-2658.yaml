summary:
  ar: "يروي مالك عن أبي بكر بن نافع عن أبيه نافع مولى ابن عمر عن صفية بنت أبي عبيد أنها أخبرته عن أم سلمة زوج النبي أنها قالت حين ذُكر الإزار: فالمرأة يا رسول الله؟ قال: ترخيه شبرا. قالت أم سلمة: إذا ينكشف عنها. قال: فذراعا لا تزيد عليه. {cite:muwatta-maruf-1997 p.502}"
