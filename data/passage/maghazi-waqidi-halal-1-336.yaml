text: "… رسول اللّه أَن أَسيرَ معك. فأَذِن له رسول اللّٰه. قال جابر : فلم يخرج معه أَحدٌ لم يشهد القتال بالأمس غيرى، واستأْذنه رجالٌ لم يحضروا القتال فأَبى ذلك عليهم ؛ ودعا رسول اللّٰه بلوائه، وهو معقود لم يُحَلّ من الأَمس، …"
