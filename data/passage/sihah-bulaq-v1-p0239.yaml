text: |-
  ٤٠٢
  ⁦( باب الرا ء )⁩
  عن خفض ونبر الغلام تزعرع والنبرة الهمزة وقد نبرت الحرف نبراوقر يش لا تنبر أى لاتهمير
  والنير بال.كسر دويبة شيهة بالقراد اذاديت على البعير نورم موضع مدبها والمع نباروأنيساد
  قال الراجز
  كانهما من سمن وايفار • ديت عليها ذربات الانبار
  وانتبرت يده أى تنفطت ايت السكيت أتسار الطعام واحدها نبر مثل نقس وأنقاس وانياد
  اسم بلد ⁦( تتر)⁩ النترجذب فى جفوة وفى الحديت فلينترذ كره ثلاث نترات بعف بعد
  البول والطعن النتر مثل انخلس وقوس ناترة تقطع وترهالصلابتها قال الشاعر
  قطوف برجل كالقسىّ النوائر والننر يالتحريك الفساد والضباع قال التجاج
  واعلم بأن ذا الجلال قد قدر فى الكتب الاولى التى كان سطر أمرى هذاها جتقب منه النتر
  • نتر تترت الشى أفره تترافاتتستروالاسم الننار والنشار بالضم ما تنائر من الشيودر
  شرشدد للصكثرة والانتشار والاستنثار بعنى وهو تثرما فى الانف بالنفس وفى الحديث اذا
  استنشقت قانتروالشثرة للدواب شبه العطسة يقال شرت الشاة اذالطرحت من أنفها الاذى
  قال الاصعى النافر والناثر الشاة تسعل فينتر من أنفهاشئ والنمور السكثيرة الولد والنثرة
  الفرجة بين الشاريين حيال وقرة الاتف وكذلك من الاسد والنترة كوكان ينهمامقداوش
  وفيهما اطخ بياض كأنه قطعة معاب وهى أنف الاسدينزلها القمر والنثرة الدرع الواسعا
  قال ابن السكيت يقال للدرع نترة وتثلة قال ويقال تتردر عه عنه اذا ألقاها عنه ولا يقال
  يتلهاو يقال طعنه فأنتره أى أرعفه قال الراجز
  ان عليها فارسا كعشره * اذارأى قارس قوم أنتره
  جر تجرائلشبة ينجرهانجرانحتها وصائعه نجار والنجار أيضاقبيلة من الانصار
  وفجرت الماءنجرا أسختته بالرضفة والمنيرة عجر محمى يسخن به الماء وذلك المامفحيرة قال
  ابو الفمر الكلاب النجيرة اللبن الحلميب يجعل عليه=عن والنحر السوق الشديد ورجل مج
  أى سديد السوق للابل والنجر الاصل والحسب واللون أيضا وكذلك النجارومن
  أمشالهم فى المخلط كل تجارابل نجارها أى قيه كل لون من الاخلاق وليس له رأى يثبت عليه
  عن أبى عييد وتجرارض مكة والمديسة ونجران بلدوهو من المن قال الاخطل
  مثل القنافذهداجون قدبلفت • غيرات أوبلغت سوا تهم هجر
  والقافية مرفوعة واغا السوأة هى البالغة الاأنه قليها والنحران خشبة تدور عليها
  رجل البناب وأنشد أبو عبيدة
  صبت الماءفى النجران حتى • تركت الباب ليس له صرير
  والخجران العطشان والنجر بالتحريك عطس بصيب الابل والغستم عن أكل الحبة فلاتكاد
  تروى من الماءيق ال نجرت الابل ومجرت أيضاوقال حتى اذاما اشتدلويان النجر ومنه
  شهر ناجروهوكل شهرف صميم الجولان الابل تتير فى ذلك الشهر قال ذوالرمة
  صرى اجن يزوى له المروجهه • اذاذاقه الظمان فى شهر ناجر
  قال يعة وب وقد يصيب الانسان التجر من شرب اللين الحامض فلايروى من الماء غحر )
  النحرموضع القلادة من الصدروهو المصر والمنحر أيضا الموضع الذى يتحرفيه اله-دى وغيره
