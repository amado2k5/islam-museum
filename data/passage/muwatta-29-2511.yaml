label: { ar: "الموطأ 2511 — سعيد بن المسيب: عمر جعل في الأضراس بعيرا بعيرا ومعاوية خمسة أبعرة", en: "Muwatta 2511" }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: قضى عمر في الأضراس ببعير بعير، وقضى معاوية في الأضراس بخمسة أبعرة خمسة أبعرة. قال سعيد: فالدية تنقص في قضاء عمر وتزيد في قضاء معاوية، فلو كنت أنا لجعلت في الأضراس بعيرين بعيرين، فتلك الدية سواء. {cite:muwatta-maruf-1997 p.431}"
