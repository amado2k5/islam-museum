label: { ar: "الموطأ 2511 — سعيد بن المسيب: عمر جعل في الأضراس بعيرا بعيرا ومعاوية خمسة أبعرة", en: "Muwatta 2511", es: "Muwatta 2511", fr: "Muwatta 2511", ur: "موطا 2511", tr: "Al-Muwatta 2511 - Sa'id ibn al-Musayyab: Ömer her azı dişi için bir deve yerleştirdi ve Mu'awiyah beş deve yerleştirdi.", id: "Al-Muwatta 2511 — Sa’id ibn al-Musayyab: Umar menempatkan seekor unta pada setiap geraham, dan Mu’awiyah menempatkan lima ekor unta." }
summary:
  ar: "يروي يحيى عن مالك عن يحيى بن سعيد أنه سمع سعيد بن المسيب يقول: قضى عمر في الأضراس ببعير بعير، وقضى معاوية في الأضراس بخمسة أبعرة خمسة أبعرة. قال سعيد: فالدية تنقص في قضاء عمر وتزيد في قضاء معاوية، فلو كنت أنا لجعلت في الأضراس بعيرين بعيرين، فتلك الدية سواء. {cite:muwatta-maruf-1997 p.431}"
  tr: "Yahya, Malik'ten, o da Yahya ibn Sa'id'den rivayet ettiğine göre, Sa'id ibn al-Musayyab'ın şöyle dediğini işitmiştir: Ömer, diş kaybı için tazminatın bir deve olduğunu, Mu'aviye ise beş deve olduğunu hükmetmiştir. Sa'id şöyle demiştir: \"Ömer'in hükmüne göre kan parası daha azdır, Mu'aviye'nin hükmüne göre ise daha fazladır. Bana kalsa, kan parası aynı olduğu için diş kaybı için tazminatı iki deve olarak belirlerdim.\" {cite:muwatta-maruf-1997 s.431}"
  id: "Yahya meriwayatkan dari Malik, dari Yahya ibn Sa'id, bahwa ia mendengar Sa'id ibn al-Musayyab berkata: 'Umar menetapkan bahwa ganti rugi atas kehilangan gigi adalah satu ekor unta, sedangkan Mu'awiyah menetapkan bahwa ganti ruginya adalah lima ekor unta. Sa'id berkata: \"Uang darahnya lebih sedikit menurut hukum Umar dan lebih banyak menurut hukum Mu'awiyah. Jika saya yang menentukan, saya akan menetapkan ganti rugi atas kehilangan gigi sebanyak dua ekor unta, karena uang darahnya sama.\" {cite:muwatta-maruf-1997 p.431}"
