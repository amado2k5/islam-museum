label: { ar: "الموطأ 1099 — أم الفضل بنت الحارث: تماروا عندها يوم عرفة في صيام رسول الله، فأرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب", en: "Muwatta 1099", es: "Muwatta 1099", fr: "Muwatta 1099", ur: "موطا 1099", tr: "El-Muvatta 1099 — Ümmü el-Fadl bint el-Harith: Arafat Günü'nde, Allah Resulü'nün orucu hakkında onun huzurunda tartıştılar. Bunun üzerine, Arafat'ta devesinin üzerinde duran Resul'e bir bardak süt gönderdi ve o da içti.", id: "Al-Muwatta 1099 — Umm al-Fadl bint al-Harith: Mereka berdebat di hadapannya pada Hari Arafah tentang puasa Rasulullah, lalu dia mengirimkan secangkir susu kepada beliau ketika beliau sedang berdiri di atas untanya di Arafah, dan beliau meminumnya." }
text: "أرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب"
summary:
  ar: "أول حديث في باب صيام يوم عرفة. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن عمير مولى عبد الله بن عباس عن أم الفضل بنت الحارث، أن ناساً تماروا عندها يوم عرفة في صيام رسول الله، فقال بعضهم: هو صائم، وقال بعضهم: ليس بصائم، فأرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب. ويذكر المحقق أنه رواه عن مالك أبو مصعب ⁦(891 و1365)⁩ وسويد ⁦(476 و562)⁩ والشيباني، وأنه في الصحيحين. {cite:muwatta-maruf-1997 p.503}"
  id: "Hadits pertama dalam bab tentang puasa di Hari Arafah. Diriwayatkan oleh Malik dari Abu al-Nadr, budak yang dibebaskan oleh Umar ibn Ubayd Allah, dari Umayr, budak yang dibebaskan oleh Abdullah ibn Abbas, dari Umm al-Fadl bint al-Harith, bahwa sebagian orang berdebat di hadapannya pada Hari Arafah tentang apakah Rasulullah shalla Allahu alaihi wa sallam sedang berpuasa. Sebagian berkata: Beliau sedang berpuasa, dan sebagian berkata: Beliau tidak berpuasa. Maka ia mengirimkan secangkir susu kepada beliau ketika beliau sedang berdiri di atas untanya di Arafah, dan beliau meminumnya. Editor menyebutkan bahwa hadits ini diriwayatkan dari Malik oleh Abu Musab (891 dan 1365), Suwayd (476 dan 562), dan al-Shaybani, dan terdapat dalam dua kitab Sahih (Bukhari dan Muslim). {mengutip:muwatta-maruf-1997 hal.503}"
