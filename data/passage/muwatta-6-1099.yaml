label: { ar: "الموطأ 1099 — أم الفضل بنت الحارث: تماروا عندها يوم عرفة في صيام رسول الله، فأرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب", en: "Muwatta 1099" }
text: "أرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب"
summary:
  ar: "أول حديث في باب صيام يوم عرفة. يرويه مالك عن أبي النضر مولى عمر بن عبيد الله عن عمير مولى عبد الله بن عباس عن أم الفضل بنت الحارث، أن ناساً تماروا عندها يوم عرفة في صيام رسول الله، فقال بعضهم: هو صائم، وقال بعضهم: ليس بصائم، فأرسلت إليه بقدح لبن وهو واقف على بعيره بعرفة فشرب. ويذكر المحقق أنه رواه عن مالك أبو مصعب (891 و1365) وسويد (476 و562) والشيباني، وأنه في الصحيحين. {cite:muwatta-maruf-1997 p.503}"
