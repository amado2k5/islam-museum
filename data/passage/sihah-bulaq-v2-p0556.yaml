text: |-
  *⁦(سرعف )⁩ ,,
  ٣١
  المطرة تجرف مامرت به وسصف رأسه أى حلقه وسععت حفيف الرحى وتيحيفها قال أبو
  يوسف هوصوتها اذاطحنت والسحاف السل يقال رجل مسحوف ⁦(سحف)⁩ سنفة
  لجموع رقته وهزاله يقال به سخفة من جوع والسحف بالضم رقة العقل وقد سيف الرجل
  بالضم منخافة فهو سخيف وساخفته مثل حامقته دف ، قال الاصمعى السدفة
  والسدفة فى لغة نجد الظلمة وفى لغة غيرهم الضوموهومن الاضدأد وكذلك السدف بالتحريك
  وقال أبو عبيدو بعضهم يجعل السدفة اختلاط الضوء والظلة معاكوقت مابين طلوع الفجر
  الى الاسفار وقد أسدف الليل أى أظلم ومنه قول العجاج * وأقطع الليل اذا ما أسدفا*
  وأسدفت المرأة القناع أى أرسلته والسدف الليل قال الشاعر
  نزور العد وعلى نابه • بار عن كالسدف المظلم.
  والسدف أيضا الصبح واقباله ذكره الفرّاء وأنشد لعد القرقرة
  غن يغرس الودى أعلمنا • منابر كض الجياد فى السدف
  وأسدف الصبح أى أضاء ويقال أسدف الباب أى افتحة حتى يضى البيت وفى لغة هوازن
  أسدفوا أى أسرجوا من السراج والسديف السخام ومنه قول الشاعر.
  زكناه واخترنا المسديف المسرهدا * ( رف السرف ضدّ القصد والسرف
  الاغفال والخطأ وقد سرفت الشى بالكسراذًا أغفلته وجهلته وحكى الاصعىّ عن
  بعض الاعراب وواعده أصحاب له من المسصد مكانا فأخلف هسم فقبل له فى ذلك فقال عررت
  بكم فسر قتسكم أى أغفلتكم ومنه قول جرير
  أعطواهنيدة يحدوهامانية • مافى عطائهم منّ ولاسرفَ
  أى اغضال ويقال خطأ أى لا يخطئون موضع العطاء بأن يعطوه من لا يستحق ويحرموه
  المستحق ورجل سرف الفؤاد أى مخطئ الفؤادغافله قال طرفة
  إن امى أسرف الفؤاديرى * عس لابماء سحابة شقى
  والسرف الضراوة وفى الحديث أن للحم سر فاكسرف الجرويقال هو من الاسراف
  وسرف اسم موضع والاسراف فى النفقة التبذير ومسرف لقب ملم بن عقبة المرّىّ
  صاحب وقعة الحرّة لانه قد أسرف فيها قال علىّ بن عبد اللّه بن عباس
  هم منعواذمارى يوم جاءت * كائب مسرف وبنى اللكيعة
  والسبرفة دوية تخذلنفسها ستاهى بعا من دهاق العيدان تضم بعضها الى بعض بلعلبها
  على مشال المناووس ثم تدخل فيه وتموت يقال فى المثل• وآصنع من سرفة وقد سرفت
  لسرفة الشجرة تسرفها سرفا اذا أكات ورقها عن ابن السكيت وسرفت الشجرفهى
  مسروفة وأرض سرفة كثيرة السرفة واسرافيل اسم أعجمي كأنه مضاف الى ايل قال
  الاخفس ويقال فى لغة اسرافين كما قالواجبرين واسماعين واسرائين ⁦(سرعف)⁩.
  السرعوف كل شى ناعم خفيف اللجم والسرعوفسة المرأة الناعمة الطويلة والجرادة تسمى
  سرعوفة وتشبه بها الفرس قال المشاعر
  وان أعرضت قلت سرعوفة * لهاذنب خلفها مسبطر
