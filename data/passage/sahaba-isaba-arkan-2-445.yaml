text: "… رافع بن بديل بن ورقاء الخزَاعي: فقال له : يا جندع بن الصميل أسلم تسلم، وتغنم، من ذكره ابن منْدَه، وقد استشهد يوم بئر معونة، وذكر حر نار تضرم فقال: ما الإسلام؟ قال: البراء من"
summary:
  ar: "مقطع من الإصابة لابن حجر، المجلد المصوَّر 2، ص 445، يذكر تعريف الإسلام بأعماله؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن."
  en: "An excerpt from Ibn Hajar's al-Isaba, scan volume 2, p. 445, that mentions Islam defined by its acts; from the machine-read scan, quoted within forty words per the sources policy. The Pillars and Branches of Faith Browser lists it."
  ur: "الاصابہ، ابن حجر، اسکین جلد 2، ص 445 کا اقتباس جس میں اسلام کی تعریف اس کے اعمال سے کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے درج کرتا ہے۔"
  es: "Un extracto de Al-Isaba de Ibn Hajar, volumen 2, pág. 445, que menciona el Islam definido por sus actos; tomado de la lectura automática, citado con un máximo de cuarenta palabras según la política de fuentes. El navegador Pillars and Branches of Faith lo incluye."
  fr: "Extrait de l'ouvrage d'Ibn Hajar, al-Isaba (tome 2, p. 445), qui évoque l'islam défini par ses actes; extrait de la numérisation automatique, cité en quarante mots conformément à la politique relative aux sources. Cet extrait figure dans le répertoire « Piliers et branches de la foi »."
  tr: "İbn Hacer'in *El-İsabe* adlı eserinin 2. cildinin 445. sayfasından bir alıntı, İslam'ı uygulamaları üzerinden tanımlar; bu, makine tarafından okunabilir taranmış versiyondan alınmıştır ve kaynak politikasına göre metin yaklaşık kırk kelimeyle alıntılanmıştır. Bu metin, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri hakkındaki bölümleri içeren bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari kitab *Al-Isabah* karya Ibn Hajar, Jilid 2, halaman 445, mendefinisikan Islam melalui praktik-praktiknya; ini diambil dari versi hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber. Kutipan ini disusun oleh peramban yang mencakup bagian-bagian tentang rukun Islam, rukun iman, cabang-cabang iman, dan karakteristik seorang mukmin."
