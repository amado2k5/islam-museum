text: "… يوجبه كالجماع ونحوه. وهذه العضلة لحمية وأكثرها في اسفل العنق لأن الأجزاء العالية بطبعها تهبط إلى أسفل، فيكتفي فيها بشيء يسير من انضمام وبالعكس من ذلك الأجزاء السافلة، وهذه العضلة مع منعها خروج البول بغير إرادة فهي أيضا تعين على …"
summary:
  ar: "مقطع من شرح تشريح القانون لابن النفيس، ص 94، يرد فيه ذكر فرض العين؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from Ibn al-Nafis's Commentary on the Anatomy of the Canon, p. 94, whose wording mentions the individual obligation (fard 'ayn); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "شرح تشریح القانون، ابن النفیس، ص 94 کا اقتباس جس میں فرضِ عین کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de Commentary on the Anatomy de the Canon de Ibn al-Nafis, p. 94, dont le texte mentionne l'obligation individuelle (fard 'ayn) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de Commentary on the Anatomy de the Canon de Ibn al-Nafis, p. 94, cuyo texto menciona la obligación individual (fard 'ayn); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "İbn el-Nafis'in Hukukun Anatomisi üzerine tefsirinden, 94. sayfadan, bireysel yükümlülüklerden bahseden bir bölüm; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır ve düzeltilmemiştir. Zorunlu fiiller, görevler, itaat gerektiren fiiller, tavsiye edilen fiiller, mekruh edilen fiiller, haram fiiller ve küçük günahlar için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari tafsir Ibnu al-Nafis tentang anatomi hukum, halaman 94, yang menyebutkan kewajiban individu; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks dikutip dalam sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, tugas, perbuatan ketaatan, perbuatan yang dianjurkan, perbuatan yang tidak disukai, perbuatan yang dilarang, dan dosa kecil."
