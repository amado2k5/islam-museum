label: { ar: "الموطأ 120 — ابن عمر يغسل وجهه ويديه ويمسح رأسه قبل أن يطعم أو ينام جنباً", en: "Muwatta 120" }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب وضوء الجنب إذا أراد أن ينام أو يطعم قبل أن يغتسل: كان عبد الله بن عمر إذا أراد أن ينام أو يطعم وهو جنب غسل وجهه ويديه إلى المرفقين ومسح برأسه ثم طعم أو نام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.93}"
