label: { ar: "الموطأ 120 — ابن عمر يغسل وجهه ويديه ويمسح رأسه قبل أن يطعم أو ينام جنباً", en: "Muwatta 120", es: "120 copias", fr: "120 exemplaires", ur: "120 کاپیاں", tr: "El-Muvatta 120 — İbn Ömer, ritüel kirlilik halindeyken yemek yemeden veya uyumadan önce yüzünü ve ellerini yıkar ve başını siler.", id: "Al-Muwatta 120 — Ibnu Umar mencuci muka dan tangannya serta mengusap kepalanya sebelum makan atau tidur dalam keadaan najis." }
summary:
  ar: "أثر يرويه مالك عن نافع، في باب وضوء الجنب إذا أراد أن ينام أو يطعم قبل أن يغتسل: كان عبد الله بن عمر إذا أراد أن ينام أو يطعم وهو جنب غسل وجهه ويديه إلى المرفقين ومسح برأسه ثم طعم أو نام. ويذكر المحقق أنه رواه عن مالك أبو مصعب وسويد ويحيى بن بكير عند البيهقي. {cite:muwatta-maruf-1997 p.93}"
  tr: "Malik'in Nafi'den rivayet ettiği bir hadiste, cünüp haldeyken gusül abdesti almadan önce uyumak veya yemek yemek isteyen bir kişinin abdesti bölümünde şöyle denmektedir: Abdullah ibn Umar, cünüp haldeyken uyumak veya yemek yemek istediğinde yüzünü ve dirseklerine kadar ellerini yıkar, başını siler ve sonra yer veya uyurdu. Editör, bu hadisin Malik'ten Ebu Mus'ab, Suveyd ve Yahya ibn Bukayr tarafından rivayet edildiğini ve el-Beyhaki tarafından kaydedildiğini belirtmektedir. {cite:muwatta-maruf-1997 s.93}"
  id: "Sebuah riwayat yang dinarasikan oleh Malik atas otoritas Nafi’, dalam bab tentang wudhu orang yang dalam keadaan junub yang ingin tidur atau makan sebelum melakukan ghusl (mandi wajib): Abdullah ibn Umar, ketika ia ingin tidur atau makan dalam keadaan junub, akan membasuh wajah dan tangannya sampai siku, mengusap kepalanya, lalu makan atau tidur. Editor menyebutkan bahwa riwayat ini dinarasikan atas otoritas Malik oleh Abu Mus’ab, Suwaid, dan Yahya ibn Bukayr, sebagaimana dicatat oleh al-Bayhaqi. {cite:muwatta-maruf-1997 p.93}"
