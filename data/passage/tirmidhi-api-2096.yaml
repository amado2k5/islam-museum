label: { ar: "جامع الترمذي 2096 — المرض والمريض، عيادة المريض", en: "Jami' al-Tirmidhi 2096 — illness and the sick; visiting the sick", ur: "جامع ترمذی 2096 — بیماری اور بیمار، بیمار کی عیادت", es: "Jami' al-Tirmidhi 2096 — La enfermedad y los enfermos; la visita a los enfermos", fr: "Jami' al-Tirmidhi 2096 — la maladie et les malades; rendre visite aux malades", tr: "Cami' el-Tirmizi 2096 — Hastalık ve Hasta, Hasta Ziyareti", id: "Jami' al-Tirmidhi 2096 — Penyakit dan Pasien, Menjenguk Orang Sakit" }
text: "… بْنُ أَبِي قَيْسٍ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ جَاءَنِي رَسُولُ اللَّهِ يَعُودُنِي وَأَنَا مَرِيضٌ فِي بَنِي سَلِمَةَ فَقُلْتُ يَا نَبِيَّ اللَّهِ كَيْفَ أَقْسِمُ مَالِي بَيْنَ وَلَدِي فَلَمْ يَرُدَّ عَلَىَّ شَيْئًا فَنَزَلَتْ : ⁦(يُوصِيكُمُ اللَّهُ فِي أَوْلاَدِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الأُنْثَيَيْنِ )⁩ الآيَةَ. قَالَ أَبُو عِيسَى هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ. وَقَدْ …"
summary:
  ar: "حديث في جامع الترمذي، رقم 2096، يذكر المرض والمريض، وعيادة المريض. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Jami' al-Tirmidhi, no. 2096 (Chapters On Inheritance), that mentions illness and the sick, visiting the sick. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "جامع ترمذی کی حدیث نمبر 2096، جس میں بیماری اور بیمار، بیمار کی عیادت کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un informe en Jami' al-Tirmidhi, n.° 2096 (Capítulos sobre la herencia), menciona la enfermedad y a los enfermos, así como las visitas a los enfermos. El Navegador de Medicina lo incluye en su lista de textos sobre medicina profética, medicina, anatomía, cirugía, fármacos y tratamientos."
  fr: "Un rapport du Jami' al-Tirmidhi, n° 2096 (Chapitres sur l'héritage), mentionne la maladie et les malades, ainsi que les visites aux malades. Le Répertoire des médicaments le répertorie avec les textes sur la médecine prophétique, la médecine, l'anatomie, la chirurgie, les médicaments et les traitements."
  tr: "Cami' el-Tirmizi'de 2096 numaralı hadis, hastalık, hasta ve hasta ziyaretinden bahsetmektedir. Bu hadis, tıp araştırmacısı tarafından Peygamber tıbbı, tıp, anatomi, cerrahi ve tedaviye ilişkin metinlerle birlikte derlenmiştir."
  id: "Sebuah hadits dalam Jami' al-Tirmidhi, no. 2096, menyebutkan tentang penyakit, orang sakit, dan mengunjungi orang sakit. Hadits ini dikumpulkan oleh peneliti medis bersama dengan teks-teks tentang pengobatan Nabi, kedokteran, anatomi, pembedahan, dan pengobatan."
