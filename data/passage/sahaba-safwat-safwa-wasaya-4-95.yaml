text: "… بردة قال: أخرجت إلينا عائشةا. كساء ملبداً وإزراراً غليظاً فقالت: قبض رسول اللّٰه لير في هذين. أخرجاه في الصحيحين. وعنهاا قالت: ما ترك رسول اللّٰه الي ديناراً ولا درهماً ولا شاة ولا بعيراً ولا أوصى بشيء. انفرد بإخراجه مسلم. عن …"
summary:
  ar: "مقطع من صفة الصفوة لابن الجوزي، المجلد المصوَّر 4، ص 95، يذكر وصية أو عهد أخير، وساعة الاحتضار والوفاة، وما خلّفه من تركة وميراث، وأثر من الآثار المحفوظة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر. يجمعه متصفح الوصايا والمواريث والآثار والمراقد."
  en: "An excerpt from Ibn al-Jawzi's Sifat al-Safwa, scan volume 4, p. 95, that mentions a testament or parting counsel, a deathbed and last hours, what was left behind: estate and inheritance, a relic kept after its owner; from the machine-read scan, quoted within forty words per the sources policy. The Testaments Browser lists it."
  ur: "صفۃ الصفوہ، ابن الجوزی، اسکین جلد 4، ص 95 کا اقتباس جس میں وصیت یا آخری نصیحت، وقتِ وفات اور آخری لمحات، ترکہ اور میراث، محفوظ آثار و تبرکات کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے درج کرتا ہے۔"
