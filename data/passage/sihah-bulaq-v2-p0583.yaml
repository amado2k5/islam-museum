text: |-
  قوله بعد الدامية فى القاموس
  وزاد أبو عبيدة قبل دامية
  دامعة بالمهملة ووهم الجوهرى
  فقال بعد الدامية اه
  قوله والارفاع المغانن فى القاموس
  وسخ المغابن اه
  *⁦(باب الغيئ)⁩ •
  ن داميات اذاب طوية ملق انركت أنذت اتعد ادامية والفد احفة طاعة خر ج من
  سل الر١ بخ) أربغ فلان ابله اذا تركهاترد الماهكيفشاءت من غير
  وقت يقال تركت ابلهم عملاهربغة ⁦(ردغ)⁩ الردغة بالتحر يك الماء والطين والوحل
  الشديدوكذلك الردغة بالتسكين والجمع ردغ ورداغ والرديغ الاحق والمرادغ البادل
  وهى مابين العنق الى الترقوة الواحدة مردغة⁦(رزغ)⁩ الرزغة بالتحريك الوحل وأرزغ
  المطر الارض اذا بلها وبالغ ولم يسل قال طرفة يهجو
  وأنت على الادتى شمال عرية * شامية تزوى الوجوه بليل
  وأنت على الاقصى صباغير قرّة * تذاءب منها مر زغ ومسيل
  يقول أنت للبعداء كالصباتسوق السحاب من كل وجه فيكون منها مطر مر زغ ومطر مسيل
  وهو الذى يسيل الاودية والتلاع فن رواه تذاءب بالفتح جعله للمرزغ ومن رفع جعله للصبا
  ثم قال منها مرزغ ومنها مسيل والرزغ المرتطم وأرزعت فى الرجل اذا استضعفته وعبته
  قال رؤية وأعطى الذلة كف المرزغ* ويقال احتفر القوم حتى أرزغوا أى بلغوا الطين
  ليدو الرجل يقال وريخ مرة مل الورع علبروق الذي الهافر وموصل الونلفم
  فى رسغ لايتشكى الخوشبا • مسة بطفا مع الصحيم عصبا
  وجاء المطر فرسخ اذا بلغ الماء الرسخ والرساغ حبل يشد فى رسغ البعيرشذاشديدافمنعه من
  الانبعاث فى المشى والرسخ بالتحريك استرخاء فى قوام البعير عن الاصمعى ( غغ
  الرغرغة رفاغة العيش والرغرغة أن ترد الابل الماءكل يوم متى شاءت وهو مثل الرفه
  والرغيغة لسبن يغلى ويذرت عليه دقيق تتخذ للنفساء ⁦(رفع)⁩ الرفع السعة والخصب يقال
  فغ عيشه بالضم رفاغة اتسع فهوعيش رافع ورفيغ أى واسع طيب ورقع الرجل بوس
  هوفى رفاغية من العيس مثال ثمانيسة والأرفاغ المغابن من الاياط وأصول الفخذير
  الواحدرفع ورفع قال الراجز
  قدز وجونى جبألا فيهاحذب • دقيقة الارفاغ ضخماءاركب
  ( روغ ،راغ النملب يروغ روغاوروغانا وفى المثل روغى جعاروانظرى أين المفرّ وحعار
  اسم للضبع ولا تقل روغى الاللهؤنث والاسم منه الرواغ بالفتح وأراغ وارتاغ بمعى طلب
  وأراد تقول أرغت الصيد وماذاتريغ أى تر يدوتطلب وراغ إلى كذا أى مال اليه سرا
  وحاد وطريق رائغ أى مائل وقوله تعالى فراغ عليهم ضربا باليمين أى أقبل قال الفراءمال
  عليهم وكان الروغ ههنا أنه اعتل عليهم روعًا ليفعل بالهتهم ما فعل ويقال أريغوابى اراغتكم
  أى اطلبوابى طلبتكم وفلان يراوغ فى الامر مراوغة والمراوغة أيضا المصارعة وهذه
  رياغة بى فلان للموضع الذى يصطرعون فيه عن اليزيدى وأصله رواغة صارت الواوياه
  كسرة ما قبلها وتراوغ القوم أى راوغ بعضهم بعضا
  الميل
