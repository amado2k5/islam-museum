label: { ar: "سنن أبي داود 4106 — الأب والأبوة", en: "Sunan Abi Dawud 4106 — the father and fatherhood", ur: "سنن ابی داؤد 4106 — باپ اور والدیت", es: "Sunan Abi Dawud 4106 — El padre y la paternidad", fr: "Sunan Abi Dawud 4106 — Le père et la paternité", tr: "Sunan Abi Dawud 4106 — Baba ve Babalık", id: "Sunan Abi Dawud 4106 — Sang Ayah dan Peran Ayah" }
text: "… مُحَمَّدُ بْنُ عِيسَى، حَدَّثَنَا أَبُو جُمَيْعٍ، سَالِمُ بْنُ دِينَارٍ عَنْ ثَابِتٍ، عَنْ أَنَسٍ، أَنَّ النَّبِيَّ أَتَى فَاطِمَةَ بِعَبْدٍ قَدْ وَهَبَهُ لَهَا قَالَ وَعَلَى فَاطِمَةَا ثَوْبٌ إِذَا قَنَّعَتْ بِهِ رَأْسَهَا لَمْ يَبْلُغْ رِجْلَيْهَا وَإِذَا غَطَّتْ بِهِ رِجْلَيْهَا لَمْ يَبْلُغْ رَأْسَهَا فَلَمَّا رَأَى النَّبِيُّ مَا تَلْقَى قَالَ \" إِنَّهُ لَيْسَ عَلَيْكِ بَأْسٌ إِنَّمَا هُوَ أَبُوكِ وَغُلاَمُكِ \"."
summary:
  ar: "حديث في سنن أبي داود، رقم 4106، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 4106 (Clothing (Kitab Al-Libas)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 4106، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 4106 (El Libro de la Vestimenta (Kitab Al-Libas)), menciona al padre y la paternidad. El navegador \"La Paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 4106 (Vêtements (Kitab Al-Libas)), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 4106 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 4106, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
