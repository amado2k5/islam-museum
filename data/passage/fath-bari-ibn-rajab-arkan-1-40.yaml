text: "… عبدِ اللهِ بنِ عمرو أن النبيَّ وَلِلُو مُل أيُّ المسلمينَ خير؟ قالّ: من سَلَمَ المسلَمونَ من لسانهِ ويدِه - كما تقدمَ ذكره. فعلى هذه الروايةِ: أيُّ المسلمين خيرُ؟ وفي روايةِ أبي موسى: أيُّ الإسلامِ أفضلُ؟. قالَ ابنُ رجب : والذي …"
