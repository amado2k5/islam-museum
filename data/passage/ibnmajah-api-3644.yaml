text: "أَهْدَى النَّجَاشِيُّ إِلَى رَسُولِ اللَّهِ ـ صلى الله عليه وسلم ـ حَلْقَةً فِيهَا خَاتَمُ ذَهَبٍ فِيهِ فَصٌّ حَبَشِيٌّ فَأَخَذَهُ رَسُولُ اللَّهِ ـ صلى الله عليه وسلم ـ بِعُودٍ وَإِنَّهُ لَمُعْرِضٌ عَنْهُ أَوْ بِبَعْضِ أَصَابِعِهِ ثُمَّ دَعَا ابْنَةَ ابْنَتِهِ أُمَامَةَ بِنْتَ أَبِي الْعَاصِ فَقَالَ ‏ \"‏ تَحَلَّىْ بِهَذَا يَا بُنَيَّةُ ‏\"‏ ‏.‏"
summary:
  ar: "في سنن ابن ماجه؛ ذكر خاتم أو صك موثق."
  en: "In Sunan Ibn Majah; mention of a seal or certified document."
  ur: "سنن ابن ماجہ میں؛ مہر یا تصدیق شدہ دستاویز کا ذکر."
