  tr: "Usd al-Ghaba fi Ma'rifat al-Sahaba (Sahabelerin Bilgisine Göre Orman Aslanları) adlı resimli cilt 1'den, s. 1639'dan, zeki ve aptal insanlar hakkında bir hikaye içeren bir bölüm; makine tarafından okunabilir taranmış versiyondan alınmıştır. Metin, kaynak politikasına göre yaklaşık kırk kelimeyle özetlenmiştir. Juha ve İslam Halk Bilimi Tarayıcısı tarafından derlenmiştir."
