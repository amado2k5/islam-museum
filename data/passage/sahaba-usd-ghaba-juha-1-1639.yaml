  en: "An excerpt from Usd al-Ghaba fi Ma'rifat al-Sahaba, scan volume 1, p. 1639, with a report of the wits and the fools; from the machine-read scan, quoted within forty words per the sources policy. The Juha and Islamic Folklore Browser lists it."
  ur: "اُسد الغابہ فی معارف الصحابہ، اسکین جلد 1، ص 1639 کا اقتباس جس میں ظریفوں اور مغفلوں کی ایک خبر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔ جحا اور اسلامی لوک ادب کا براؤزر اسے درج کرتا ہے۔"
