text: "… ولا نَبْلي وَقَفْتُ فَلَمَّا خِفْتُ ضِيقةَ مَوْقفي رَجعتُ لِعَودٍ كالهِزبْر أبي الشبل قال خلف الأحمر: أبيات هُبَيرة في الاعتذار خيرٌ من قَول الحارث بن هشام، يعني قوله : اللّهُ يعلمُ ما تركتُ قِتَالهم حَتَّى عَلوا فَرَسِي بأشقَرَ مُزْبِدِ وقال الأصمعي: …"
summary:
