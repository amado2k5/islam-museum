label:
  ar: "ابن ماجه 3470 — الحمى ناري أسلطها على عبدي المؤمن"
  en: "Ibn Majah 3470 — Fever is My fire that I set on My believing servant"
  ur: "ابن ماجہ 3470 — بخار میری آگ ہے جسے میں اپنے مومن بندے پر مسلط کرتا ہوں"
text: "أبشر فإن الله يقول هي ناري أسلطها على عبدي المؤمن في الدنيا لتكون حظه من النار في الآخرة ."
summary:
  ar: "حديث قدسي في سنن ابن ماجه، رقم 3470: الحمى ناري أسلطها على عبدي المؤمن. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sunan Ibn Majah, no. 3470: Fever is My fire that I set on My believing servant. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "سنن ابن ماجہ میں حدیثِ قدسی، نمبر 3470: بخار میری آگ ہے جسے میں اپنے مومن بندے پر مسلط کرتا ہوں۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
