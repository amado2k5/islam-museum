text: "قال أبو عمرو بن العَلاَءِ: سألت رجلًا من سعد بن بكر رَمى، قال أبوزيد: وهو مهموز لأنها تُذرَأ نحو الصيد من أهل ذات عِرْقٍ، فقلت: هذا الكوكب الضخم، ما أي : تُدْفَعُ، أبو عبيدة : ادَّرَأتُ للصيد على افتَعَلْتُ، إذا …"
summary:
