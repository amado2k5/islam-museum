label: { ar: "الموطأ 1850 — مالك عن عبد الله بن دينار عن عبد الله بن عمر عن عمر: مثله، والرماء هو الربا", en: "Muwatta 1850" }
summary:
  ar: "يروي مالك عن عبد الله بن دينار عن عبد الله بن عمر أن عمر بن الخطاب قال مثل ذلك: لا تبيعوا الذهب بالذهب إلا مثلا بمثل، ولا تشفوا بعضها على بعض، ولا تبيعوا شيئا منها غائبا بناجز، وإن استنظرك إلى أن يلج بيته فلا تنظره، إني أخاف عليكم الرماء. والرماء هو الربا. {cite:muwatta-maruf-1997 p.160}"
