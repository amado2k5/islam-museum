label: { ar: "مسلم 2382 — أمن الناس علي في صحبته أبو بكر", en: "Muslim 2382 — The dearest of people to me in companionship is Abu Bakr", es: "Muslim 2382 — La persona más querida para mí en compañía es Abu Bakr.", fr: "Muslim 2382 — La personne qui m'est la plus chère en compagnie est Abou Bakr.", ur: "مسلم 2382 - صحبت میں مجھے سب سے زیادہ عزیز ابو بکر ہیں۔", tr: "Müslim 2382 — Benim için en güvenilir insan Ebu Bekir'di.", id: "Muslim 2382 — Orang yang paling dapat dipercaya bagiku adalah Abu Bakar." }
text: "قال رسول الله: «إن أمن الناس علي في ماله وصحبته أبو بكر، ولو كنت متخذا خليلا لاتخذت أبا بكر خليلا، ولكن أخوة الإسلام ومودته؛ لا تبقين في المسجد خوخة إلا سدت إلا خوخة أبي بكر»"
summary:
  ar: "رواية أبي سعيد الخدري في باب فضائل أبي بكر من صحيح مسلم؛ حديث الاختيار الأخروي وبكاء أبي بكر فهماً لدنو الأجل، وحديث سد الخوخات إلا خوخة أبي بكر — نص الصديقية الأشهر عند أهل السنة."
  tr: "Sahih Müslim'de Ebu Bekir'in faziletleri bölümünde Ebu Said el-Hudri'nin rivayeti; ahiret seçimi hadisi, Ebu Bekir'in ölümün yaklaştığını anlayarak ağlaması hadisi ve Ebu Bekir'in kapısı hariç diğer tüm kapıların kapatılması hadisi - Sünniler arasında doğruluk konusunda en meşhur metin."
  id: "Riwayat Abu Saeed Al-Khudri dalam bab tentang keutamaan Abu Bakr dalam Sahih Muslim; hadits tentang pilihan akhirat dan tangisan Abu Bakr dalam memahami datangnya kematian, dan hadits tentang menutup pintu kecuali pintu Abu Bakr — teks yang paling terkenal tentang kebenaran di kalangan Sunni."
