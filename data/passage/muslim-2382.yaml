label: { ar: "مسلم 2382 — أمن الناس علي في صحبته أبو بكر", en: "Muslim 2382 — The dearest of people to me in companionship is Abu Bakr" }
text: "قال رسول الله: «إن أمن الناس علي في ماله وصحبته أبو بكر، ولو كنت متخذا خليلا لاتخذت أبا بكر خليلا، ولكن أخوة الإسلام ومودته؛ لا تبقين في المسجد خوخة إلا سدت إلا خوخة أبي بكر»"
summary:
  ar: "رواية أبي سعيد الخدري في باب فضائل أبي بكر من صحيح مسلم؛ حديث الاختيار الأخروي وبكاء أبي بكر فهماً لدنو الأجل، وحديث سد الخوخات إلا خوخة أبي بكر — نص الصديقية الأشهر عند أهل السنة."
