label: { ar: "سنن النسائي 2838 — الحرام", en: "Sunan al-Nasa'i 2838 — the unlawful", ur: "سنن نسائی 2838 — حرام" }
text: "أَخْبَرَنَا عَمْرُو بْنُ عَلِيٍّ، قَالَ حَدَّثَنَا يَحْيَى، قَالَ حَدَّثَنَا ابْنُ جُرَيْجٍ، قَالَ حَدَّثَنَا عَمْرُو بْنُ دِينَارٍ، أَنَّ أَبَا الشَّعْثَاءِ، حَدَّثَهُ عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ نَكَحَ حَرَامًا."
summary:
  ar: "حديث في سنن النسائي، رقم 2838، يذكر الحرام. يجمعه متصفح الحلال والحرام مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في ما أُحل وما حُرّم."
  en: "A report in Sunan al-Nasa'i, no. 2838 (The Book of Hajj), that mentions the unlawful. The Halal and Haram Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on what is lawful and what is unlawful."
  ur: "سنن نسائی کی حدیث نمبر 2838، جس میں حرام کا ذکر ہے۔ حلال و حرام براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کی ان نصوص کے ساتھ جمع کرتا ہے جو حلال اور حرام بیان کرتی ہیں۔"
