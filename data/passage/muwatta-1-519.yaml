label: { ar: "الموطأ 519 — أبو أيوب الأنصاري بمصر: لا يستقبل القبلة ولا يستدبرها بفرجه", en: "Muwatta 519" }
text: "إذا ذهب أحدكم الغائط أو البول فلا يستقبل القبلة ولا يستدبرها بفرجه"
summary:
  ar: "أول حديث في باب النهي عن استقبال القبلة والإنسان على حاجته. يرويه يحيى عن مالك عن إسحاق بن عبد الله بن أبي طلحة عن رافع بن إسحاق مولى آل الشفاء، وكان يُقال له مولى أبي طلحة، أنه سمع أبا أيوب الأنصاري وهو بمصر يقول: والله ما أدري كيف أصنع بهذه الكراييس، وقد قال النبي: إذا ذهب أحدكم الغائط أو البول فلا يستقبل القبلة ولا يستدبرها بفرجه. ويبين المحقق أن اختلاف الرواة في «مولى لآل الشفاء» و«مولى الشفاء» جاء من مالك نفسه لا من الرواة عنه، ويخرّج الحديث عند النسائي (1/21) وأحمد (5/414) والطبراني والطحاوي والجوهري والبغوي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.268}"
