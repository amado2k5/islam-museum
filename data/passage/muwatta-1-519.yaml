label: { ar: "الموطأ 519 — أبو أيوب الأنصاري بمصر: لا يستقبل القبلة ولا يستدبرها بفرجه", en: "Muwatta 519", es: "Muwatta 519", fr: "Muwatta 519", ur: "موطا 519", tr: "El-Muvatta 519 — Ebu Eyyub el-Ensari Mısır'da: Ne kıbleye yönelmeli ne de cinsel organlarıyla kıbleye sırtını dönmelidir.", id: "Al-Muwatta 519 — Abu Ayyub al-Ansari di Mesir: Dia tidak boleh menghadap kiblat dan tidak boleh membelakangi kiblat dengan alat kelaminnya." }
text: "إذا ذهب أحدكم الغائط أو البول فلا يستقبل القبلة ولا يستدبرها بفرجه"
summary:
  ar: "أول حديث في باب النهي عن استقبال القبلة والإنسان على حاجته. يرويه يحيى عن مالك عن إسحاق بن عبد الله بن أبي طلحة عن رافع بن إسحاق مولى آل الشفاء، وكان يُقال له مولى أبي طلحة، أنه سمع أبا أيوب الأنصاري وهو بمصر يقول: والله ما أدري كيف أصنع بهذه الكراييس، وقد قال النبي: إذا ذهب أحدكم الغائط أو البول فلا يستقبل القبلة ولا يستدبرها بفرجه. ويبين المحقق أن اختلاف الرواة في «مولى لآل الشفاء» و«مولى الشفاء» جاء من مالك نفسه لا من الرواة عنه، ويخرّج الحديث عند النسائي (1/21) وأحمد (5/414) والطبراني والطحاوي والجوهري والبغوي من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.268}"
  tr: "İhtisas sırasında kıbleye dönmenin yasaklanmasıyla ilgili bölümdeki ilk hadis, Yahya tarafından Malik'ten, o da İshak ibn Abdullah ibn Abi Talha'dan, o da Şifa ailesinin azatlı kölesi Rafi' ibn İshak'tan rivayet edilmiştir. Rafi' ibn İshak, Mısır'dayken Ebu Eyyub el-Ensari'nin şöyle dediğini işitmiştir: \"Allah'a yemin ederim ki, bu taburelerle ne yapacağımı bilmiyorum, çünkü Peygamber şöyle buyurmuştur: 'Sizden biri ihtisas yapmaya gittiğinde kıbleye dönmemeli ve cinsel organlarıyla sırtını da dönmemelidir.'\" Araştırmacı, \"Şifa ailesinin azatlı kölesi\" ve \"Şifa'nın azatlı kölesi\" ile ilgili rivayetler arasındaki farkın, ondan rivayet edenlerden değil, Malik'in kendisinden kaynaklandığını açıklığa kavuşturmaktadır. Bu hadis, Malik'in sahabelerinin rivayet zincirleriyle el-Nasa'i (1/21), Ahmed (5/414), el-Taberani, el-Tahavi, el-Cevhari ve el-Bağavi'de bulunmaktadır. {cite:muwatta-maruf-1997 s.268}"
  id: "Hadits pertama dalam bab tentang larangan menghadap kiblat saat buang air besar diriwayatkan oleh Yahya dari Malik, dari Ishaq ibn Abdullah ibn Abi Talha, dari Rafi’ ibn Ishaq, budak yang dibebaskan dari keluarga al-Shifa’ (juga dikenal sebagai budak yang dibebaskan dari Abi Talha), yang mendengar Abu Ayyub al-Ansari, ketika berada di Mesir, berkata: “Demi Allah, saya tidak tahu harus berbuat apa dengan tinja-tinja ini, karena Nabi bersabda: ‘Ketika salah seorang dari kalian pergi buang air besar, ia tidak boleh menghadap kiblat dan tidak boleh membelakangi kiblat dengan kemaluannya.’” Peneliti menjelaskan bahwa perbedaan riwayat mengenai “budak yang dibebaskan dari keluarga al-Shifa’” dan “budak yang dibebaskan dari al-Shifa’” berasal dari Malik sendiri, bukan dari mereka yang meriwayatkan darinya. Hadits ini ditemukan dalam kitab al-Nasa’i (1/21), Ahmad (5/414), al-Tabarani, al-Tahawi, al-Jawhari, dan al-Baghawi, melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.268}"
