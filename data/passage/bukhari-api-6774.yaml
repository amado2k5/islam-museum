label: { ar: "صحيح البخاري 6774 — خبر من أخبار الظرفاء والمغفلين", en: "Sahih al-Bukhari 6774 — a report of the wits and the fools", ur: "صحیح بخاری 6774 — ظریفوں اور مغفلوں کی ایک خبر", fr: "Sahih al-Bukhari 6774 — un récit des beaux esprits et des sots", es: "Sahih al-Bujari 6774 — un relato de ingeniosos y necios" }
text: "حَدَّثَنَا قُتَيْبَةُ، حَدَّثَنَا عَبْدُ الْوَهَّابِ، عَنْ أَيُّوبَ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عُقْبَةَ بْنِ الْحَارِثِ، قَالَ جِيءَ بِالنُّعَيْمَانِ أَوْ بِابْنِ النُّعَيْمَانِ شَارِبًا، فَأَمَرَ النَّبِيُّ مَنْ كَانَ بِالْبَيْتِ أَنْ يَضْرِبُوهُ. قَالَ فَضَرَبُوهُ، فَكُنْتُ أَنَا فِيمَنْ ضَرَبَهُ بِالنِّعَالِ."
summary:
  ar: "حديث في صحيح البخاري، رقم 6774، فيه خبر من أخبار الظرفاء والمغفلين. يجمعه متصفح جحا والفلكلور الإسلامي مع نصوص القرآن والسنة والسيرة والكتب في الضحك والمزاح والنوادر."
  en: "A report in Sahih al-Bukhari, no. 6774, with a report of the wits and the fools. The Juha and Islamic Folklore Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on laughter, jesting and anecdotes."
  ur: "صحیح بخاری کی حدیث نمبر 6774، جس میں ظریفوں اور مغفلوں کی ایک خبر ہے۔ جحا اور اسلامی لوک ادب کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  fr: "Un récit de Sahih al-Bukhari, n° 6774, avec un récit des beaux esprits et des sots. Le Navigateur de Juha et du folklore islamique le recense avec les textes du Coran, de la Sunna, de la sîra et des livres sur le rire, la plaisanterie et les anecdotes."
  es: "Un relato de Sahih al-Bujari, n.º 6774, con un relato de ingeniosos y necios. El Navegador de Juha y del folclore islámico lo recoge junto a los textos del Corán, la Sunna, la sira y los libros sobre la risa, la broma y las anécdotas."
