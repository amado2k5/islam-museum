text: "… تزوجت امرأتين ما كان في واحدة منهما صوت - يعني دفا - فقال محمد. قال رسول اللّٰه عايالم : فصل ما بين الحلال والحرام الصوت بالدف.. الغناء عند الزواج ومما أباحه الإسلام وحبب فيه، الغناء عند الزواج، ترويحًا للنفوس، وتنشيطًا …"
