label: { ar: "الموطأ 2042 — مالك: فيمن دفع إلى رجل مالا قراضا فتجر فيه فربح، ثم عزل رأس المال وقسم الربح، فأخذ حصته وطرح حصة صاحب المال في المال بحضرة شهداء: لا تجوز قسمة الربح إلا بحضرة صاحب المال، وإن كان أخذ شيئا رده حتى يستوفي صاحب المال رأس ماله", en: "Muwatta 2042", es: "Muwatta 2042", fr: "Muwatta 2042", ur: "موطا 2042", tr: "El-Muvatta 2042 — Malik: Bir kimse, bir adama kâr ortaklığı için para vermiş, o adam da bu parayla ticaret yapmış ve kâr elde etmiş, sonra da sermayeyi bir kenara ayırıp kârı bölüştürmüş, kendi payını almış ve şahitler huzurunda sermaye sahibinin payını çıkarmışsa: Kârın bölüştürülmesi, ancak sermaye sahibinin huzurunda caizdir. Eğer bir şey almışsa, sermaye sahibi sermayesini tam olarak alana kadar onu iade etmelidir.", id: "Al-Muwatta 2042 — Malik: Mengenai seseorang yang memberikan uang kepada seorang pria untuk kemitraan bagi hasil, yang kemudian memperdagangkan uang tersebut dan memperoleh keuntungan, lalu menyisihkan modal dan membagi keuntungan tersebut, mengambil bagiannya dan mengurangi bagian pemilik modal di hadapan saksi: Pembagian keuntungan tidak diperbolehkan kecuali di hadapan pemilik modal. Jika ia mengambil sesuatu, ia harus mengembalikannya sampai pemilik modal menerima modalnya secara penuh." }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فتجر فيه، فربح، ثم عزل رأس المال، وقسم الربح، فأخذ حصته، وطرح حصة صاحب المال في المال، بحضرة شهداء أشهدهم على ذلك. قال: لا تجوز قسمة الربح إلا بحضرة صاحب المال، وإن كان أخذ شيئا رده، حتى يستوفي صاحب المال رأس ماله، ثم يقتسمان ما بقي بينهما على شرطهما. {cite:muwatta-maruf-1997 p.234}"
  tr: "Malik, bir başkasına kâr paylaşımı ortaklığı (kırad) için para veren, bu parayla ticaret yapan ve kâr elde eden, daha sonra sermayeyi bir kenara ayırıp, kendi payını alıp sermaye sahibinin payını çıkaran ve tayin ettiği şahitlerin huzurunda kârı bölüştüren bir adam hakkında şöyle demiştir: Kârın bölüştürülmesi, sermaye sahibinin huzurunda yapılmadıkça caiz değildir. İlk adam bir şey almışsa, sermaye sahibi sermayesinin tamamını alana kadar onu geri vermelidir. Sonra kalanını aralarında anlaştıkları şekilde bölüştürürler. {cite:muwatta-maruf-1997 s.234}"
  id: "Malik berkata tentang seorang pria yang memberikan uang kepada pria lain untuk usaha bagi hasil (qirad), yang kemudian berdagang dengan uang tersebut dan memperoleh keuntungan, lalu menyisihkan modal dan membagi keuntungannya, mengambil bagiannya dan mengurangi bagian pemilik modal, di hadapan saksi-saksi yang telah ditunjuknya: Pembagian keuntungan tidak diperbolehkan kecuali di hadapan pemilik modal. Jika orang pertama mengambil sesuatu, ia harus mengembalikannya sampai pemilik modal menerima modalnya secara penuh. Kemudian mereka membagi sisanya di antara mereka sesuai dengan kesepakatan mereka. {cite:muwatta-maruf-1997 p.234}"
