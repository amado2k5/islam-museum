label: { ar: "الموطأ 2042 — مالك: فيمن دفع إلى رجل مالا قراضا فتجر فيه فربح، ثم عزل رأس المال وقسم الربح، فأخذ حصته وطرح حصة صاحب المال في المال بحضرة شهداء: لا تجوز قسمة الربح إلا بحضرة صاحب المال، وإن كان أخذ شيئا رده حتى يستوفي صاحب المال رأس ماله", en: "Muwatta 2042" }
summary:
  ar: "قال مالك في رجل دفع إلى رجل مالا قراضا، فتجر فيه، فربح، ثم عزل رأس المال، وقسم الربح، فأخذ حصته، وطرح حصة صاحب المال في المال، بحضرة شهداء أشهدهم على ذلك. قال: لا تجوز قسمة الربح إلا بحضرة صاحب المال، وإن كان أخذ شيئا رده، حتى يستوفي صاحب المال رأس ماله، ثم يقتسمان ما بقي بينهما على شرطهما. {cite:muwatta-maruf-1997 p.234}"
