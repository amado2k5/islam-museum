text: "بكار، صاحب كتاب ((نسب قريش))، وكانت وفاته سنة ٢٣٦، ولا شيء في كتابه المذكور. وختم مصعب كلمته بقوله: ((لم يولد قبله ولا بعده في الكعبة أحد))، فعلق عليها الحاكم بقوله: (وهم مصعب في الحرف الأخير، فقد تواترت الأخبار أن فاطمة"
