label: { ar: "صحيح مسلم 7346 — الإيمان بالله وملائكته وكتبه ورسله", en: "Sahih Muslim 7346 — belief in God, His angels, His books and His messengers", ur: "صحیح مسلم 7346 — اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان", es: "Sahih Muslim 7346 — creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros", fr: "Sahih Muslim 7346 — la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers", tr: "Sahih Muslim 7346 — Allah'a, meleklerine, kitaplarına ve peygamberlerine iman", id: "Sahih Muslim 7346 — Kepercayaan kepada Tuhan, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya" }
text: "… \" أَتَشْهَدُ أَنِّي رَسُولُ اللَّهِ \". فَقَالَ هُوَ أَتَشْهَدُ أَنِّي رَسُولُ اللَّهِ فَقَالَ رَسُولُ اللَّهِ \" آمَنْتُ بِاللَّهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ مَا تَرَى \". قَالَ أَرَى عَرْشًا عَلَى الْمَاءِ. فَقَالَ رَسُولُ اللَّهِ \" تَرَى عَرْشَ إِبْلِيسَ عَلَى الْبَحْرِ وَمَا تَرَى \". قَالَ أَرَى صَادِقَيْنِ وَكَاذِبًا أَوْ كَاذِبَيْنِ وَصَادِقًا. فَقَالَ رَسُولُ اللَّهِ \" لُبِسَ عَلَيْهِ دَعُوهُ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7346، يذكر الإيمان بالله وملائكته وكتبه ورسله. يجمعه متصفح أركان الإسلام وأركان الإيمان وشعب الإيمان وخصال المؤمن مع نصوص القرآن والسنة والسيرة وأخبار الصحابة والتابعين في هذه الأبواب الأربعة."
  en: "A report in Sahih Muslim, no. 7346 (The Book of Tribulations and Portents of the Last Hour), that mentions belief in God, His angels, His books and His messengers. The Pillars and Branches of Faith Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the reports of the Companions and Successors on the pillars of Islam, the pillars of faith, the branches of faith and the traits of the believer."
  ur: "صحیح مسلم کی حدیث نمبر 7346، جس میں اللہ، اس کے فرشتوں، کتابوں اور رسولوں پر ایمان کا ذکر ہے۔ ارکانِ اسلام، ارکانِ ایمان، شعبِ ایمان اور مومن کی خصلتوں کا براؤزر اسے قرآن، سنت، سیرت اور صحابہ و تابعین کے آثار کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih Muslim, n.º 7346 (El Libro de las Tribulaciones y Presagios de la Última Hora), menciona la creencia en Dios, Sus ángeles, Sus libros y Sus mensajeros. El Navegador de Pilares y Ramas de la Fe lo incluye junto con los textos del Corán, la Sunnah, la sirah y los relatos de los Compañeros y Sucesores sobre los pilares del Islam, los pilares de la fe, las ramas de la fe y las características del creyente."
  fr: "Un hadith du Sahih Muslim, n° 7346 (Le Livre des tribulations et des signes de la fin des temps), mentionne la croyance en Dieu, en Ses anges, en Ses livres et en Ses messagers. Le navigateur « Piliers et branches de la foi » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les hadiths des Compagnons et des Successeurs relatifs aux piliers de l'islam, aux branches de la foi et aux qualités du croyant."
  tr: "Sahih Müslim'de 7346 numaralı hadis, Allah'a, meleklerine, kitaplarına ve peygamberlerine imanı zikreder. Bu hadis, İslam'ın temelleri, imanın esasları, imanın dalları ve müminin özellikleri ile Kur'an, Sünnet, Peygamberin hayatı ve Sahabeler ile haleflerinin rivayetlerinden derlenmiştir."
  id: "Sebuah hadits dalam Sahih Muslim, nomor 7346, menyebutkan tentang kepercayaan kepada Allah, para malaikat-Nya, kitab-kitab-Nya, dan para rasul-Nya. Hadits ini disusun berdasarkan Rukun Islam, Rukun Iman, Cabang-cabang Iman, dan Karakteristik Orang Beriman, beserta teks-teks dari Al-Quran, Sunnah, biografi Nabi, dan riwayat dari para Sahabat dan Penerus mereka, dalam empat kategori tersebut."
