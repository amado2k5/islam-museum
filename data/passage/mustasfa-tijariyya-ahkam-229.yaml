text: "… وبين أن يشاركه غيره فيه ولا يتعين واحد من هذه الأقسام إلا بدليل زائد بل يحتمل الحظر أيضا عند من يجوّز عليهم الصغائر وقال قوم انه على المظر وقال قوم على الاباحة وقال قوم على الندب وقال قوم على الوجوب …"
summary:
  ar: "مقطع من المستصفى للغزالي، طبعة التجارية، ص 229، يرد فيه ذكر الوجوب، والمندوب، وصغائر الذنوب، والمباح، والندب؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Ghazali's al-Mustasfa, the Tijariyya printing, p. 229, whose wording mentions obligation (wujub), the recommended (mandub), the minor sins, the permitted (mubah), recommendation (nadb); from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "المستصفیٰ، غزالی، طبع تجاریہ، ص 229 کا اقتباس جس میں وجوب، مندوب، صغیرہ گناہ، مباح، ندب کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 229, dont le texte mentionne l'obligation (wujub), le recommandé (mandub), les péchés mineurs, le permis (mubah), la recommandation (nadb) ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Mustasfa, the Tijariyya printing de al-Ghazali, p. 229, cuyo texto menciona la obligatoriedad (wujub), lo recomendado (mandub), los pecados menores, lo permitido (mubah), la recomendación (nadb); tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Gazali'nin El-Mustasfa adlı eserinin ticari baskısından, 229. sayfadan bir alıntı; farz, tavsiye edilen, küçük günahlar, caiz ve müstehap olan fiilleri ele almaktadır; makine tarafından okunabilir taranmış kopyadan alınmıştır. Metin, kaynak politikasına uygun olarak yaklaşık kırk kelimeden oluşan bir alıntıdır ve düzeltilmemiştir. Farz, tavsiye edilen ve müstehap olan fiillerin yanı sıra mekruh edilen, yasaklanan ve küçük günah fiilleri için bir tarayıcı tarafından derlenmiştir."
  id: "Kutipan dari Al-Mustasfa karya Al-Ghazali, Edisi Komersial, hlm. 229, membahas perbuatan wajib, anjuran, dosa kecil, halal, dan yang diinginkan; dari salinan hasil pemindaian yang dapat dibaca mesin. Teks ini merupakan kutipan sekitar empat puluh kata, sesuai dengan kebijakan sumber, dan belum dikoreksi. Teks ini disusun oleh peramban untuk perbuatan wajib, anjuran, dan yang diinginkan, serta perbuatan yang tidak disukai, haram, dan dosa kecil."
