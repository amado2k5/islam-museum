label: { ar: "الموطأ 33 — الاستنثار في الوضوء والإيتار في الاستجمار", en: "Muwatta 33" }
text: "إذا توضأ أحدكم فليجعل في أنفه ماء ثم لينثر، ومن استجمر فليوتر"
summary:
  ar: "يرويه مالك عن أبي الزناد عبد الله بن ذكوان عن الأعرج عبد الرحمن بن هرمز عن أبي هريرة، في باب العمل في الوضوء: أمر النبي المتوضئ أن يدخل الماء في أنفه ثم ينثره، ومن استجمر بالأحجار أن يوتر، أي يجعل عددها وتراً. ويفسر المحقق الاستجمار بالمسح بالجمار وهي الأحجار الصغار، ويخرّج الحديث عند البخاري (162) وأبي داود (140) والنسائي (1/65) وابن حبان (1439) من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.51}"
