label: { ar: "الموطأ 33 — الاستنثار في الوضوء والإيتار في الاستجمار", en: "Muwatta 33", es: "Muwatta 33", fr: "Muwatta 33", ur: "موطا 33", tr: "Al-Muwatta 33 — Abdest sırasında burnu yıkamak ve tuvalet ihtiyacını giderdikten sonra temizlik için tek sayıda taş kullanmak", id: "Al-Muwatta 33 — Berkumur hidung saat berwudhu dan menggunakan batu berjumlah ganjil untuk bersuci setelah buang air besar" }
text: "إذا توضأ أحدكم فليجعل في أنفه ماء ثم لينثر، ومن استجمر فليوتر"
summary:
  ar: "يرويه مالك عن أبي الزناد عبد الله بن ذكوان عن الأعرج عبد الرحمن بن هرمز عن أبي هريرة، في باب العمل في الوضوء: أمر النبي المتوضئ أن يدخل الماء في أنفه ثم ينثره، ومن استجمر بالأحجار أن يوتر، أي يجعل عددها وتراً. ويفسر المحقق الاستجمار بالمسح بالجمار وهي الأحجار الصغار، ويخرّج الحديث عند البخاري (162) وأبي داود (140) والنسائي (1/65) وابن حبان (1439) من طرق أصحاب مالك. {cite:muwatta-maruf-1997 p.51}"
  id: "Malik meriwayatkan hadits ini dari Abu al-Zinad Abdullah ibn Dhakwan, dari al-A'raj Abd al-Rahman ibn Hurmuz, dari Abu Hurayrah, dalam bab tentang tindakan wudhu: Nabi (shalawat dan salam kepadanya) memerintahkan orang yang berwudhu untuk memasukkan air ke hidungnya lalu menghembuskannya, dan orang yang berwudhu dengan batu hendaknya melakukannya dengan jumlah ganjil. Peneliti menjelaskan berwudhu dengan batu sebagai mengusap dengan kerikil, yaitu batu-batu kecil, dan ia memasukkan hadits ini dalam kumpulan hadits al-Bukhari (162), Abu Dawud (140), al-Nasa'i (1/65), dan Ibn Hibban (1439) melalui sanad para sahabat Malik. {cite:muwatta-maruf-1997 p.51}"
