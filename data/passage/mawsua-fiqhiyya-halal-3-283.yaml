text: "… وفي التنزيل في صفة النبي والغم : ويحرم عليهم الخبائث وهذا مذهب الحنفية والشافعية والحنابلة. واستثنوا من ذلك الجراد فإنه مما أجمعت الأمة على حل أكله، لقول النبي دية : أحلت لنا ميتتان ودمان، فأما الميتتان: فالحوت والجراد، وأما الدمان …"
summary:
