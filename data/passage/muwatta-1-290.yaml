label: { ar: "الموطأ 290 — في الجمعة ساعة لا يوافقها عبد مسلم يسأل الله شيئاً إلا أعطاه", en: "Muwatta 290", es: "Muwatta 290", fr: "Muwatta 290", ur: "موطا 290", tr: "Al-Muwatta 290 — Cuma günü öyle bir saat vardır ki, o saatte hiçbir Müslüman kul Allah'tan bir şey istemezse, Allah ona mutlaka verir.", id: "Al-Muwatta 290 — Pada hari Jumat terdapat satu saat di mana setiap hamba Muslim tidak meminta apa pun kepada Allah kecuali Dia akan memberikannya kepadanya." }
text: "فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله شيئاً إلا أعطاه إياه"
summary:
  ar: "أول حديث في باب ما جاء في الساعة التي في يوم الجمعة. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: ذكر النبي يوم الجمعة وأخبر أن فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله شيئاً إلا أعطاه إياه، وأشار بيده يقللها. ويخرّجه المحقق عند البخاري (935) ومسلم (3/5) والنسائي وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن عامة رواة الموطأ يقولون «وهو قائم يصلي» إلا قتيبة وأبا مصعب وابن أبي أويس والتنيسي فلم يذكروا «وهو قائم»، وأن المعروف في حديث أبي الزناد إثباتها ⁦(التمهيد 19/17)⁩. {cite:muwatta-maruf-1997 p.164}"
  tr: "Cuma günü namaz vakitleri bölümündeki ilk hadis. Yahya, Malik'ten, o da Ebu el-Zinad'dan, o da el-A'raj'dan, o da Ebu Hurayra'dan rivayet etmiştir: Peygamberimiz Cuma gününden bahsetmiş ve bize, o saatte hiçbir Müslüman kulun namaz kılarken Allah'tan bir şey istemeden ona vermeyeceği bir vakit olduğunu bildirmiş ve eliyle bu vakitin kısa olduğunu işaret etmiştir. Araştırmacı, bu hadisi Malik'in sahabelerinin rivayet zincirleriyle Buhari (935), Müslim (3/5), Nesai, Ahmed ve Şafiî'nin hadis külliyatlarına dahil etmiştir. İbn Abd el-Barr'ın, Muvatta'nın çoğu ravisinin \"namaz kılarken ayakta dururken\" dediğini, ancak Kuteybe, Ebu Musab, İbn Ebi Uveys ve Tünisi'nin \"namaz kılarken ayakta dururken\" demediklerini söylediğini aktarmıştır. Ayrıca, Ebu el-Zinad hadisinin bilinen rivayetinde bu ifadenin yer aldığını da belirtiyor (el-Tamhid 19/17). {cite:muwatta-maruf-1997 s.164}"
  id: "Hadits pertama dalam surah tentang waktu salat Jumat. Diriwayatkan oleh Yahya dari Malik, dari Abu al-Zinad, dari al-A'raj, dari Abu Hurayrah: Nabi menyebutkan hari Jumat dan memberitahukan kepada kita bahwa ada suatu waktu di hari itu di mana tidak ada seorang hamba Muslim pun yang berdiri salat dan memohon sesuatu kepada Allah kecuali Dia mengabulkannya, dan beliau memberi isyarat dengan tangannya untuk menunjukkan singkatnya waktu tersebut. Peneliti memasukkannya dalam kumpulan hadits al-Bukhari (935), Muslim (3/5), al-Nasa'i, Ahmad, dan al-Shafi'i melalui sanad para sahabat Malik. Ia mengutip Ibn 'Abd al-Barr yang mengatakan bahwa sebagian besar perawi al-Muwatta' mengatakan \"ketika ia berdiri salat,\" kecuali Qutaybah, Abu Mus'ab, Ibn Abi Uways, dan al-Tunisi, yang tidak menyebutkan \"ketika ia berdiri.\" Ia juga menyatakan bahwa versi hadits Abu al-Zinad yang terkenal memuat ungkapan ini (al-Tamhid 19/17). {cite:muwatta-maruf-1997 p.164}"
