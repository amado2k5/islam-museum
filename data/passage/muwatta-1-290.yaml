label: { ar: "الموطأ 290 — في الجمعة ساعة لا يوافقها عبد مسلم يسأل الله شيئاً إلا أعطاه", en: "Muwatta 290" }
text: "فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله شيئاً إلا أعطاه إياه"
summary:
  ar: "أول حديث في باب ما جاء في الساعة التي في يوم الجمعة. يرويه يحيى عن مالك عن أبي الزناد عن الأعرج عن أبي هريرة: ذكر النبي يوم الجمعة وأخبر أن فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله شيئاً إلا أعطاه إياه، وأشار بيده يقللها. ويخرّجه المحقق عند البخاري (935) ومسلم (3/5) والنسائي وأحمد والشافعي من طرق أصحاب مالك، وينقل عن ابن عبد البر أن عامة رواة الموطأ يقولون «وهو قائم يصلي» إلا قتيبة وأبا مصعب وابن أبي أويس والتنيسي فلم يذكروا «وهو قائم»، وأن المعروف في حديث أبي الزناد إثباتها (التمهيد 19/17). {cite:muwatta-maruf-1997 p.164}"
