text: |-
  ٣٤٠
  ⁦(باب الرا.)⁩
  والشعير أيضا الغريب قال الشاعر لا تتركنى فيهم شطيرا وقال آخر،
  اذا كنت فى سعد وأمك منهمو * تطيرا فلا يغررك حالك من سعد
  فان ابن أخت القوم يه فى اناؤه • اذالم يراحسم خاله بأب جلد:
  ⁦( شنظر)⁩ رجل شنظير وشتظيرة أى سي الخلق قالت امرأة من العرب
  شنظيرة زوّجنيه أهلى من جقه يحسب رأسى رج-لى كانه لم يرانى قبلى
  وربما قالو اشنذيرة بالذال المعجمة لقربها من الظالغة أولنغة (شعر الشهرللانسان وغيره
  وجعه شعور واشعار الواحدة شعرة ويقال رأى ف لان الشعرة اذار أى الشيب حكاه
  يعقوب ورجل أشعر كشير شعر الجسد وقوم شعر وكان يقال اعبيد اللّٰه بن زياد أشعر بركا
  والاشعر ما أحاط بالحافر من الشعر والجمع الاشاءر وأشاءر الناقة جوانب حيائها
  والشعرة بالكسر شعرار كب لذساخاصة والشعير من الحبوب الواحدة شعيرة وشعيرة
  السكين الحديدة التى تدخل فى السسيلان لتكون مساكاللنصل والشعيرة البدنة تهدى
  والشها ترأعمال الحج وكل ماجعل على الطاعة اللّٰه تعالى قال الاصمعى الواحدة شعيرة قال
  وقال بعضهم شعارة والمشاعرم واضع المناسك والمشعر الحرام أحد المشاعر وكسر الميم
  اغة والمشاءر الحواس قال بلعاء بن قيس
  والرأس مى تفع فيه مشاعره ، هدى السبيل لهسمع وعينان
  والشعار ماولى الجسد من الشياب وشعار القوم فى الحرب علامته-م ليعرف بعضهم بعضا
  والشعار بالفتح الشجريقال أرض كثيرة الشعار وأشعر الهدى اذاطعن فى سنامه الايمن
  حق يسيل منه دم إيعلم أنه هدى وفى الحديث أشعر أدير المؤمنين وأشعرار جل هما اذالزق
  بمكان الشعار من التياب بالجسد وشعرت بالذى بالذتح أشعربه شمرا أى فطنت له ومنه قولهم
  ليت شعرى أى!تنى عات قال سيبويه أصلد شعرة ولكنهم حذفوا الهاء كما حذفوها من
  قواهم ذهب بعذرها وهو أبو عذرها والشعر واحد الاشعارويقال مارأيت قصيدة أشعر
  جعامنها والشاءر جعه الشعراء على غير قياس وقال الاخفش الشاعرمثل لابن وتامر أى
  صاحب شعر وسمى شاعر الفطنته وما كان شاعرا واقد شعر با اضم وهويشعر والمتشاءر الذى
  يتعاطى قول الشعر وشاءرته فشعرته أشعره بالفتح أى غلبته بالشه روشاءرته ناومته فى شعار
  واحدواستشعر فلان خوفا أى أضمره وأشعرت السكين جعات لها شعيرة وأشعرته فشه رأى
  أدرنه فدرى وأشعرته ألبسته الشعار وأشعره فلان شراغشيه به بقال أشعره الحب
  مرضا رأشعر الجنين وتشهرأى فت شعره وفى الحديث ذكاة الحنين ذكاة أمه اذا أشعر وهذ
  كقولهم أنبت ا فلام اذانيتت عانته والشعرى الكوكب الذى يطلع بعد الجوزاء أو طلوعه
  فى شدة المرّوه ما الشعريان الشعرى العبور التى فى الجوزاء والسعرى الغميصا التى
  فى الذراع تزعم العرب ان-ما أختاسهيل والشعراء ضرب من اخوخ واحده وبمعه سواء
  والشعراءذبابة يقال هى التى لها إبرة وداهية شعرا. وداهية وبراء ويقال للرجل اذا تكام
  بما يشكر عليه بقمت بم اشعراء ذات وبر والشعراء الشجر المكشير حكاه أبو عبيد وبالموصل
  جبل يقال له شعران وقال أبو عمروّعو يذلك لكثرة شحيره والاشعر أ يو قبيلة مين اليمير وهو
