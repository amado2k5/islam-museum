label: { ar: "صحيح البخاري 6727 — ما خلّفه من تركة وميراث", en: "Sahih al-Bukhari 6727 — what was left behind: estate and inheritance", ur: "صحیح بخاری 6727 — ترکہ اور میراث", es: "Sahih al-Bukhari 6727 — Lo que quedó: patrimonio y herencia", fr: "Sahih al-Bukhari 6727 — Ce qui a été laissé derrière: biens et héritage" }
text: "حَدَّثَنَا إِسْمَاعِيلُ بْنُ أَبَانَ، أَخْبَرَنَا ابْنُ الْمُبَارَكِ، عَنْ يُونُسَ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ عَائِشَةَ، أَنَّ النَّبِيَّ قَالَ \" لاَ نُورَثُ مَا تَرَكْنَا صَدَقَةٌ \"."
summary:
  ar: "حديث في صحيح البخاري، رقم 6727، يذكر ما خلّفه من تركة وميراث. يجمعه متصفح الوصايا والمواريث والآثار والمراقد مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sahih al-Bukhari, no. 6727 (Laws of Inheritance (Al-Faraa'id)), that mentions what was left behind: estate and inheritance. The Testaments Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on testaments, last hours, estates, relics and graves."
  ur: "صحیح بخاری کی حدیث نمبر 6727، جس میں ترکہ اور میراث کا ذکر ہے۔ وصایا، ترکہ، آثار اور مراقد کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sahih al-Bukhari, n.º 6727 (Leyes de la herencia (Al-Faraa'id)), menciona lo que se dejó como legado: bienes y herencia. El Navegador de Testamentos lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre testamentos, últimas horas, bienes, reliquias y tumbas."
  fr: "Un hadith du Sahih al-Bukhari, n° 6727 (Lois de l'héritage), mentionne ce qui a été laissé derrière soi: les biens et l'héritage. Le navigateur de testaments le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant des testaments, de la fin des temps, des biens, des reliques et des tombes."
