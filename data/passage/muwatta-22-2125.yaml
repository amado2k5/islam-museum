label: { ar: "الموطأ 2125 — مالك: الأمر عندنا أن من ادعى على رجل بدعوى، نظر، فإن كانت بينهما مخالطة أو ملابسة أحلف المدعى عليه، فإن حلف بطل الحق، وإن أبى أن يحلف ورد اليمين على المدعي، فحلف طالب الحق أخذ حقه", en: "Muwatta 2125", es: "Muwatta 2125", fr: "Muwatta 2125", ur: "موطا 2125", tr: "Al-Muwatta 2125 — Malik: Bizde uygulanan prosedür şöyledir: Bir kimse bir kişiye karşı dava açarsa, biz konuyu inceleriz. Aralarında herhangi bir etkileşim veya ilişki varsa, davalı yemin ettirilir. Yemin ederse, dava geçersiz sayılır. Yemin etmeyi reddeder ve yemini davacıya iade ederse, davacı hakkını kullanır.", id: "Al-Muwatta 2125 — Malik: Prosedur di tempat kami adalah jika seseorang mengajukan klaim terhadap orang lain, kami akan memeriksa masalah tersebut. Jika ada interaksi atau hubungan antara mereka, tergugat akan diminta untuk bersumpah. Jika ia bersumpah, klaim tersebut batal. Jika ia menolak untuk bersumpah dan mengembalikan sumpah kepada penggugat, maka penggugat berhak atas klaimnya." }
summary:
  ar: "قال مالك: وعلى ذلك الأمر عندنا، أنه من ادعى على رجل بدعوى نظر، فإن كانت بينهما مخالطة أو ملابسة أحلف المدعى عليه، فإن حلف بطل ذلك الحق عنه، وإن أبى أن يحلف ورد اليمين على المدعي، فحلف طالب الحق أخذ حقه. {cite:muwatta-maruf-1997 p.268}"
  tr: "Malik şöyle dedi: \"Bizim düşünce ekolümüzdeki hüküm şudur: Eğer bir kişi, güvene dayalı bir konuda bir başkasına karşı hak iddiasında bulunursa ve aralarında herhangi bir etkileşim veya ilişki varsa, davalı yemin ettirilir. Eğer yemin ederse, bu hak ona karşı geçersiz hale gelir. Ancak yemin etmeyi reddeder ve yemini davacıya iade ederse ve davacı yemin ederse, hakkını elde eder.\" {cite:muwatta-maruf-1997 s.268}"
  id: "Malik berkata: Dan inilah putusan dalam aliran pemikiran kami: jika seseorang mengajukan klaim terhadap orang lain mengenai masalah kepercayaan, dan ada interaksi atau hubungan di antara mereka, tergugat diharuskan untuk bersumpah. Jika ia bersumpah, hak tersebut dibatalkan terhadapnya. Tetapi jika ia menolak untuk bersumpah dan mengembalikan sumpah kepada penggugat, dan penggugat bersumpah, ia memperoleh haknya. {cite:muwatta-maruf-1997 p.268}"
