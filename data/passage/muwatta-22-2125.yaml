label: { ar: "الموطأ 2125 — مالك: الأمر عندنا أن من ادعى على رجل بدعوى، نظر، فإن كانت بينهما مخالطة أو ملابسة أحلف المدعى عليه، فإن حلف بطل الحق، وإن أبى أن يحلف ورد اليمين على المدعي، فحلف طالب الحق أخذ حقه", en: "Muwatta 2125" }
summary:
