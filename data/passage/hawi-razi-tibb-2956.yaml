text: "الأدوية المفردة باب الألف وقال ابن ماسويه في إصلاح الأدوية المسهلة: وخاصته النفع من عرق النسا والتقرس ووجع المفاصل والخاصرة والورك المتولد من البلغم اللزج. قال الطبري: إنه يقتل حب القرع، ويدر الحيض والبول، ويخرج الرطوبة من الجسم بالإسهال..... انقضى …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 2956، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
  en: "An excerpt from al-Razi's al-Hawi fi al-Tibb, p. 2956, that mentions pain, named diseases, the hospital and the medical craft, the organs of the body, the drug, drugs and pharmacy; from the machine-read scan, quoted within forty words per the sources policy."
  ur: "الحاوی فی الطب، رازی، ص 2956 کا اقتباس جس میں درد، بیماریوں کے نام، بیمارستان، اعضائے بدن، دوا، ادویہ اور دواسازی کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں۔"
  es: "Un extracto de al-Razi, al-Hawi fi al-Tibb, pág. 2956, que menciona el dolor, las enfermedades, el hospital y la práctica médica, los órganos del cuerpo, el medicamento, los medicamentos y la farmacia; del escaneo leído por máquina, citado en un máximo de cuarenta palabras según la política de fuentes."
  fr: "Un extrait de l'ouvrage d'al-Razi, al-Hawi fi al-Tibb, p. 2956, qui mentionne la douleur, les maladies nommées, l'hôpital et l'art médical, les organes du corps, le médicament, les médicaments et la pharmacie; tiré du scan lu par machine, cité en quarante mots conformément à la politique des sources."
  tr: "Al-Razi'nin Al-Hawi fi al-Tibb adlı eserinin 2956. sayfasından bir bölüm; ağrı, hastalık isimleri, hastane ve tıp mesleği, vücut organları, tıp, ilaçlar ve eczacılıktan bahsediyor; makineyle okunabilir fotokopi versiyonundan alınmış olup, kaynak politikasına uygun olarak yaklaşık kırk kelimeyle alıntılanmıştır."
  id: "Sebuah bagian dari Al-Hawi fi al-Tibb karya Al-Razi, hlm. 2956, yang menyebutkan rasa sakit, nama-nama penyakit, rumah sakit dan profesi medis, organ-organ tubuh, obat-obatan, narkoba dan farmasi; dari versi fotokopi yang dapat dibaca mesin, dan teks tersebut dikutip dengan sekitar empat puluh kata sesuai dengan kebijakan sumber."
