text: "الأدوية المفردة باب الألف وقال ابن ماسويه في إصلاح الأدوية المسهلة: وخاصته النفع من عرق النسا والتقرس ووجع المفاصل والخاصرة والورك المتولد من البلغم اللزج. قال الطبري: إنه يقتل حب القرع، ويدر الحيض والبول، ويخرج الرطوبة من الجسم بالإسهال..... انقضى …"
summary:
  ar: "مقطع من الحاوي في الطب للرازي، ص 2956، يذكر الوجع، وأسماء الأمراض، والبيمارستان وصناعة الطب، وأعضاء البدن، والدواء، والعقاقير والصيدلة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر."
