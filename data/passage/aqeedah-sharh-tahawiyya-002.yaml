text: "ب غيره . ومسألة انتفاع الأموات بسعي الأحياء ذكرها ابن القيم في كتابه «الروح) (٣) وبسط القول فيها، وذكر أقوال الناس، وما ذكره ابن أبي العز في شرح الطحاوية هو ملخص من ذلك الكتاب، وذهب ابن القيم فيه إلى القول"
