label:
  ar: "مسلم 72 — أصبح من عبادي مؤمن بي وكافر"
  en: "Muslim 72 — Some of My servants have woken as believers in Me and some as deniers"
  ur: "مسلم 72 — میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ"
text: "ألم تروا إلى ما قال ربكم قال ما أنعمت على عبادي من نعمة إلا أصبح فريق منهم بها كافرين . يقولون الكواكب وبالكواكب ."
summary:
  ar: "حديث قدسي في صحيح مسلم، رقم 72: أصبح من عبادي مؤمن بي وكافر. يرويه النبي عن ربه، ويجمع متصفح الأحاديث القدسية رواياته في الكتب الستة والموطأ."
  en: "A hadith qudsi in Sahih Muslim, no. 72: Some of My servants have woken as believers in Me and some as deniers. The Prophet relates it from his Lord; the Hadith Qudsi Browser gathers its narrations across the six books and the Muwatta."
  ur: "صحیح مسلم میں حدیثِ قدسی، نمبر 72: میرے بندوں میں سے کچھ نے مجھ پر ایمان کے ساتھ صبح کی اور کچھ نے انکار کے ساتھ۔ نبی اسے اپنے رب سے روایت کرتے ہیں؛ احادیثِ قدسیہ کا براؤزر چھ کتابوں اور مؤطا میں اس کی روایات جمع کرتا ہے۔"
