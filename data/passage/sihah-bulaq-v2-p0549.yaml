text: |-
  قوله بن غدانة الخ رواه النحويون
  ما ان أنتم ذهب ولاصريف بالرفع
  استشهاداعلى اهمال مالاقنرانها
  بان قال ابن مالك فى الخلاصة
  اعمال ليس أعملت مادون ان •
  اه كتبه المصجم
  ٢ ى سخة زيادة الشاعر
  الهذلى أمية بن أبى عائد اه
  ٣ نمخة قال ذو الرمة
  وفى نسخسة الفرزدق وليحرراه
  كبية المصحح
  قوله قلبتهم عبارة القاموس قلبهم
  من المكتب اه
  سة ⁦(ب ب الفا.)⁩•
  ا *⁦(صفف)⁩*
  الصريف وقال ابن السكيت الصريف الفضة وأنشد
  بنى غدانة ما ان أنتم ذهبا • ولاصريفا ولكن أنتم الخزف
  والصريف اللبن ينصرف به عن الضرع حارا اذا حلب وصريفون موضع بالعراق قال
  الاعشى
  وتجبى اليه السيلمون ودونها * صَريفون فى أنهارها والورنق
  والصر يفسة من الحر منسوية اليه والصرقان الرصاص والصرفان أيضاحنس من التمر
  قاات الزياء
  ماللجمال مشيها وتيدا * أجندلا يحملن أم حديدا
  أم صرفانابارد اشديدا * أم الرجال جثما قعودا
  قال أبو عبيدة لم يكن يهدى لهاشئ. كان أحبّ اليها من التمر الصرفان وأنشد
  ولما أنتها العيرقاات أبارد * من التمرأم هذا جديد وجندل
  والصيرف المحتال المتصرّف فى الامور قال ٢
  قد كنت خرّاجاولو جاصيرفا • لم تلتحصى حيص بيض لخاص
  وكذلك الصيرفى قال سويد بن أبي كاهل البشكرى
  واسانا صير فياصارما • كسام السيف مأمس قطع
  والصير فى الصراف من المصارقة وقوم صيارفة والهاء للنسية وقدحاء فى الشعر الصياريف
  تنقى يداها الحصى فى كل ماجرة * فى الدراهيم تتقاد الصياريف
  لما احتاج الى اتمام الوزن أشبع الحركة ضرورة حتى صارت حرفا يقال صرقت
  الدراهم بالدنانيروبين الدرهمين صرف أى قضل لجودة فضة أحدهما وفى الحديث من
  الب صرف الحديث قال أبو عبيد صرف الحديث تزيينه بالزيادة فيه وصرفت الرجل عنى
  فانصرف والمنصرف قديكون مكانا وقد يكون مصدرا وصرفت الصمان قلبنهم وصرف اللّٰه
  عنك الاذى وكلبة صارف اذا اشتهت الفحل وقد صرفت تصرف صر وفا وصرافا وآصريف
  الجرشر بها صر فا ومرّقت الرج.ل فى أمرى نصر يفاقتصرّف فيه واصطرف في طاب
  الكسب وقال
  قد يكب المال الهدأن الجافى * بغير ماعصف ولا اصطراق
  واستصرفت اللّٰه المكاره ⁦(صعف)⁩ الصعف شراب لاهل المن يشدخ العنب فيطرح
  حتى يغلى قال أبو عبيد فجها لهم لا يرونهاخر المكان اسها ⁦(صفف)⁩ الصف واحد
  الصفوف وصاوهم فى القتال والمصف الموقف فى الحرب والجسع المصاف والصف أن
  تجلب الناقة فى محلبين أوثلاثه تصف بينها وأنشدأ بوزيد
  • ناقة شيخ للالدراهب تصف فى ثلاثة الحالب * فى اللهجمين والهن المقارب •
  وقال آخر*تزفد بعد الصف فى فرقان* وه وجع فرق وصقة الدار والسرج واحدة الصفف
  ويقال ناقة صفوف للتى تصفّ أقداحامن لبنم!اذا حليت وذلت من كثرة لبنها كما يقال قرون
  وشفوع قال الراجز
  حلاه
