summary:
  ar: "قال مالك: ولد الملاعنة من الموالي ينسب إلى موالي أمه، فيرثونه ويعقلون عنه إن جنى. فإن اعترف به أبوه ألحق به، وصار ولاؤه لموالي أبيه، وصار ميراثه لهم وعقله عليهم، ويُجلد أبوه الحد. {cite:muwatta-maruf-1997 p.337}"
