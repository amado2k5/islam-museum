label: { ar: "الموطأ 2272 — مالك: ولد الملاعنة ينسب إلى موالي أمه", en: "Muwatta 2272", es: "Muwatta 2272", fr: "Muwatta 2272", ur: "موطا 2272", tr: "Al-Muwatta 2272 — Malik: Lanetlenmiş bir kadının çocuğu, annesinin efendilerine isnat edilir.", id: "Al-Muwatta 2272 — Malik: Anak dari seorang wanita yang dikutuk dinisbahkan kepada majikan ibunya." }
summary:
  ar: "قال مالك: ولد الملاعنة من الموالي ينسب إلى موالي أمه، فيرثونه ويعقلون عنه إن جنى. فإن اعترف به أبوه ألحق به، وصار ولاؤه لموالي أبيه، وصار ميراثه لهم وعقله عليهم، ويُجلد أبوه الحد. {cite:muwatta-maruf-1997 p.337}"
  tr: "Malik şöyle dedi: Zina ile suçlanan bir kadının çocuğu, ondan miras alan ve suç işlerse kan parasından sorumlu olan efendilerine sayılır. Eğer babası onu kabul ederse, çocuk babasına sayılır ve bağlılığı babasının efendilerine geçer; mirası ve kan parası da onlara kalır ve babası da belirlenen cezaya göre kırbaçlanır. {cite:muwatta-maruf-1997 s.337}"
  id: "Malik berkata: Anak dari seorang wanita yang dituduh berzina diislamkan kepada majikannya, yang mewarisi hartanya dan bertanggung jawab atas uang darahnya jika ia melakukan kejahatan. Jika ayahnya mengakuinya, maka ia diislamkan kepadanya, dan kesetiaannya menjadi kepada majikan ayahnya, dan warisan serta uang darahnya menjadi milik mereka, dan ayahnya dicambuk sesuai dengan hukuman yang telah ditetapkan. {cite:muwatta-maruf-1997 p.337}"
