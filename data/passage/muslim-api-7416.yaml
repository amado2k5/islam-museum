label: { ar: "صحيح مسلم 7416 — أعضاء البدن", en: "Sahih Muslim 7416 — the organs of the body", ur: "صحیح مسلم 7416 — اعضائے بدن" }
text: "حَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، حَدَّثَنَا مَعْمَرٌ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، قَالَ هَذَا مَا حَدَّثَنَا أَبُو هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ فَذَكَرَ أَحَادِيثَ مِنْهَا وَقَالَ رَسُولُ اللَّهِ \" إِنَّ فِي الإِنْسَانِ عَظْمًا لاَ تَأْكُلُهُ الأَرْضُ أَبَدًا فِيهِ يُرَكَّبُ يَوْمَ الْقِيَامَةِ \". قَالُوا أَىُّ عَظْمٍ هُوَ يَا رَسُولَ اللَّهِ قَالَ \" عَجْبُ الذَّنَبِ \"."
summary:
  ar: "حديث في صحيح مسلم، رقم 7416، يذكر أعضاء البدن. يجمعه متصفح الطب مع نصوص الطب النبوي والطب والتشريح والجراحة والدواء والتداوي."
  en: "A report in Sahih Muslim, no. 7416 (The Book of Tribulations and Portents of the Last Hour), that mentions the organs of the body. The Medicine Browser lists it with the texts on prophetic medicine, medicine, anatomy, surgery, drugs and treatment."
  ur: "صحیح مسلم کی حدیث نمبر 7416، جس میں اعضائے بدن کا ذکر ہے۔ طب براؤزر اسے طبِ نبوی، طب، تشریح، جراحت، دوا اور علاج کی نصوص کے ساتھ جمع کرتا ہے۔"
