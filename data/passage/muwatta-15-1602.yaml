label: { ar: "الموطأ 1602 — ابن شهاب عن سعيد بن المسيب وأبي بكر بن عبد الرحمن: في الرجل يولي من امرأته، إنها إذا مضت الأربعة الأشهر فهي تطليقة، وله عليها الرجعة ما كانت في العدة", en: "Muwatta 1602", es: "Muwatta 1602", fr: "Muwatta 1602", ur: "موطا 1602", tr: "El-Muvatta 1602 — İbn Şihab, Said bin el-Musayyab ve Ebu Bekr bin Abdül-Rahman'dan rivayetle: Bir erkek karısından cinsel perhiz yemini ederse, dört ay geçmişse bu boşanma sayılır ve kadın bekleme süresi içinde olduğu sürece onu geri alma hakkına sahiptir.", id: "Al-Muwatta 1602 — Ibn Shihab, berdasarkan riwayat Saeed bin Al-Musayyab dan Abu Bakr bin Abd Al-Rahman: Mengenai seorang pria yang bersumpah untuk tidak berhubungan intim dengan istrinya, jika telah berlalu empat bulan, maka hal itu dianggap sebagai perceraian, dan dia berhak untuk mengambilnya kembali selama istrinya masih dalam masa iddah." }
summary:
  ar: "يروي مالك عن ابن شهاب أن سعيد بن المسيب وأبا بكر بن عبد الرحمن كانا يقولان في الرجل يولي من امرأته إنها إذا مضت الأربعة الأشهر فهي تطليقة، ولزوجها عليها الرجعة ما كانت في العدة. {cite:muwatta-maruf-1997 p.65}"
  tr: "Malik, İbn Şihab'dan rivayetle, Sa'id ibn al-Musayyab ve Ebu Bekr ibn Abd al-Rahman'ın, karısından cinsel perhiz yemini eden bir erkek hakkında, dört ay geçtikten sonra bunun boşanmış sayıldığını ve kadının bekleme süresi içinde olduğu sürece kocasının onu geri alma hakkına sahip olduğunu söylediklerini aktarır. {cite:muwatta-maruf-1997 s.65}"
  id: "Malik meriwayatkan dari Ibn Shihab bahwa Sa'id ibn al-Musayyab dan Abu Bakr ibn Abd al-Rahman biasa mengatakan tentang seorang pria yang bersumpah untuk tidak berhubungan intim dengan istrinya, bahwa jika empat bulan berlalu, itu dianggap sebagai perceraian, dan suaminya berhak untuk mengambilnya kembali selama istrinya masih dalam masa iddah. {cite:muwatta-maruf-1997 p.65}"
