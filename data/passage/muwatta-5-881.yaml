label: { ar: "الموطأ 881 — مالك عن رجل دخل المسجد لاعتكاف العشر الأواخر من رمضان فأقام يوماً أو يومين ثم مرض فخرج: يقضي ما وجب عليه من عكوف إذا صح، في رمضان أو غيره", en: "Muwatta 881" }
summary:
  ar: "سئل مالك عن رجل دخل المسجد لاعتكاف العشر الأواخر من رمضان فأقام يوماً أو يومين ثم مرض فخرج من المسجد: أيجب عليه أن يعتكف ما بقي من العشر إذا صح، أم لا يجب، وفي أي شهر يعتكف إن وجب؟ فقال مالك: يقضي ما وجب عليه من عكوف إذا صح، في رمضان أو غيره، وقد بلغه أن رسول الله أراد الاعتكاف في رمضان ثم رجع فلم يعتكف، حتى إذا ذهب رمضان اعتكف عشراً من شوال. ويذكر المحقق أنه رواه عن مالك أبو مصعب (877). {cite:muwatta-maruf-1997 p.425}"
