label: { ar: "الموطأ 881 — مالك عن رجل دخل المسجد لاعتكاف العشر الأواخر من رمضان فأقام يوماً أو يومين ثم مرض فخرج: يقضي ما وجب عليه من عكوف إذا صح، في رمضان أو غيره", en: "Muwatta 881", es: "Muwatta 881", fr: "Muwatta 881", ur: "موطا 881", tr: "El-Muvatta 881 — Malik, Ramazan ayının son on gününde itikaf yapmak için camiye giren, bir iki gün kalan, sonra hastalanıp ayrılan bir adamın rivayetine dayanarak şöyle der: İyileşirse, ister Ramazan ayında ister başka bir zamanda olsun, itikafta yapması gerekenleri kaza etmelidir.", id: "Al-Muwatta 881 — Malik berdasarkan riwayat seorang pria yang masuk masjid untuk melakukan i'tikaf pada sepuluh hari terakhir bulan Ramadhan, tinggal selama satu atau dua hari, kemudian jatuh sakit dan pergi: Ia wajib mengganti i'tikaf yang telah ia lakukan jika ia sembuh, baik itu di bulan Ramadhan atau di waktu lain." }
summary:
  ar: "سئل مالك عن رجل دخل المسجد لاعتكاف العشر الأواخر من رمضان فأقام يوماً أو يومين ثم مرض فخرج من المسجد: أيجب عليه أن يعتكف ما بقي من العشر إذا صح، أم لا يجب، وفي أي شهر يعتكف إن وجب؟ فقال مالك: يقضي ما وجب عليه من عكوف إذا صح، في رمضان أو غيره، وقد بلغه أن رسول الله أراد الاعتكاف في رمضان ثم رجع فلم يعتكف، حتى إذا ذهب رمضان اعتكف عشراً من شوال. ويذكر المحقق أنه رواه عن مالك أبو مصعب (877). {cite:muwatta-maruf-1997 p.425}"
  id: "Malik ditanya tentang seorang pria yang masuk masjid untuk beri'tikaf selama sepuluh hari terakhir Ramadan, tinggal selama satu atau dua hari, kemudian jatuh sakit dan meninggalkan masjid: Apakah dia wajib beri'tikaf selama sisa sepuluh hari itu jika dia sembuh, atau tidak wajib? Dan di bulan apa dia harus beri'tikaf jika itu wajib? Malik menjawab: Dia harus mengganti i'tikaf yang wajib dia lakukan jika dia sembuh, baik di bulan Ramadan atau bulan lainnya. Dia mendengar bahwa Rasulullah shalla Allahu alaihi wa sallam bermaksud beri'tikaf selama Ramadan tetapi kemudian kembali dan tidak melakukannya. Kemudian, setelah Ramadan berlalu, beliau beri'tikaf selama sepuluh hari di bulan Syawal. Peneliti menyebutkan bahwa ini diriwayatkan dari Malik oleh Abu Mus'ab (877). {cite:muwatta-maruf-1997 p.425}"
