text: |-
  -٢٩٨
  ⁦(باب الر٠١)⁩
  طينه وبس كالجر والجشر وسخ الوطب من اللبن بقال وطب جشرأى ومخ ⁦( جعر )⁩
  الجعرنجو كل ذات مخلب من السباع وقد جعر يجعر والجعر الدبر وجعاراءم للضبع لسكثرة
  جعزها وانما ينيت على الكسر لانه حصل فيها العدل والتأنيث والصفة الغالبة ومعنى
  قولنسا غالية أنم اغلبت على الموصوف حتى صار يعرف بها كماي رف باسمه وهى معدولة عن
  جاءرة فاذا منع من الصرف بعلتين وجب البناء بثلاث لانه ليس بعد منع الصرف الامنع
  الاعراب وكذلن القول فى حلاق اسم للمنية والجاءرتانموضع الرقنين من است
  الحماروهو مضرب الفرس بذنبه على نخذيه وقال الاصعى هماحرفا الوركين المشرفان على
  الفمنذين قال كعب بن زعيريصف الحار والاتن
  اذا ما انصاهنّ شؤبوبه • رأيت بلهاءرتيه غضونا
  وبعضهم يجعل الجاءرة حلقة الدبر والجعار بكسر الجيم حبل يشده الساقى الى وتدثم يشده
  فى حقوه اذا نزل البثرلئلا يقع فيهما تقول منه تجعرت وقال الراجز
  ليس الجعارمانعى من القدر * وان تجعرت بمحبول ممر
  والجعرورضرب من الدقل وهوأردأ التمر ( عبر الجعبر القصير الفليظ والمرأة
  جميرة قال الراجز
  يسين عن قس الاذى غوافلا * لاجعبريات ولاطهاملا
  ⁦( جعظر)⁩ المعظرى الفظ الغليظ ابن السكيت يقال للرجل اذا كان قصير اغليظا
  يعظارة بكسر الجسيم ⁦(جعفر)⁩ الجعفر التهر الصغير وجعفر أبوقبيلة من عامروهو
  جعفرين كلاب بن ربيعة بن عامروهم الجعافرة ⁦( جفر)⁩ الجغرمن آولاد المعزمابلغ
  أربعة أشهر وجفر جنباه وفصل عن أمه والانثى جفرة والجفر البئر الواسعة لم نطو ومنه جفر
  الهباءة وهو مستنقع يبلاد غطفان والجفرة بالضم سعة فى الارض مستديرة وابلهع جفار
  مشل برمة وبرام ومنه قسل للجوف جفرة وذرس مجفروناقة مجفرة أى عظيمة الجفرة وهى
  وسطه قال الجعدى
  فتا يابطرير مرهف • جرة المحزم من- فسعل
  والحفار أيضاماء لبنى غيم ينجدومنه يوم الاغار قال بشر
  ويوم النسارويوم الجفار • كاناءذايا وكانا غراما
  أى هلا كا
  والجفير كالكاتة أوسع منها وجف ر الفحل عن الضراب يجفر بالضم جفوراوذلن اذا أكثر
  الضراب حتى حسر وانقطع وعدل عنه ويقال فى الكبش ربض ولا يقال جة رومنه قبل
  الصوم مجفرة أى مقطعة للنكاح قال ذوالرمة
  وقد عارض الشعرى سهيل كانه * قريع هدان عارض الشول بافر
  وجفر جنباه اتسع ويقال أجفرت ما كنت فيه أى تركته: أجفرت فلافاة طعته وتركت
  زيارته ⁦( بحر )⁩ الجرجع جرة من الناروالجهرة ألف فارس يقال بحرة كايهرة وكل
  قبيل انضم وافصار وايدا واحدة ولم يحالفواغيرهم فهم جرة قال أبو عبيدة بحرات العرب
  مسلاث بنوضية بن أدوينو الحرث بن كعب وينوغير بن عامر فطفئت منه-م بحرتان طفتت
  ضبة لانها حالفت الرباب وطفئت بنو الحرث لانها حالفت مذحيج ويقيت غمير لم تطفألاتها
