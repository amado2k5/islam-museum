label: { ar: "سنن أبي داود 2629 — الأب والأبوة", en: "Sunan Abi Dawud 2629 — the father and fatherhood", ur: "سنن ابی داؤد 2629 — باپ اور والدیت", es: "Sunan Abi Dawud 2629 — El padre y la paternidad", fr: "Sunan Abi Dawud 2629 — le père et la paternité", tr: "Sunan Abi Davud 2629 — Baba ve Babalık", id: "Sunan Abi Dawud 2629 — Sang Ayah dan Peran Ayah" }
text: "… مَنْصُورٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَيَّاشٍ، عَنْ أَسِيدِ بْنِ عَبْدِ الرَّحْمَنِ الْخَثْعَمِيِّ، عَنْ فَرْوَةَ بْنِ مُجَاهِدٍ اللَّخْمِيِّ، عَنْ سَهْلِ بْنِ مُعَاذِ بْنِ أَنَسٍ الْجُهَنِيِّ، عَنْ أَبِيهِ، قَالَ غَزَوْتُ مَعَ نَبِيِّ اللَّهِ غَزْوَةَ كَذَا وَكَذَا فَضَيَّقَ النَّاسُ الْمَنَازِلَ وَقَطَعُوا الطَّرِيقَ فَبَعَثَ نَبِيُّ اللَّهِ مُنَادِيًا يُنَادِي فِي النَّاسِ أَنَّ مَنْ ضَيَّقَ مَنْزِلاً أَوْ قَطَعَ طَرِيقًا فَلاَ جِهَادَ لَهُ."
summary:
  ar: "حديث في سنن أبي داود، رقم 2629، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan Abi Dawud, no. 2629 (Jihad (Kitab Al-Jihad)), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن ابی داؤد کی حدیث نمبر 2629، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan Abi Dawud, n.° 2629 (Yihad (Kitab Al-Jihad)), menciona al padre y la paternidad. El navegador \"La paternidad en el Islam\" lo incluye en su lista junto con los textos del Corán, la Sunnah, la sirah y los libros sobre el padre."
  fr: "Un hadith du Sunan Abi Dawud, n° 2629 (Jihad), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sünen Ebu Davud'da yer alan 2629 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan Abi Dawud, nomor 2629, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
