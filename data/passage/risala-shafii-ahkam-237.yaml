text: "… الحقُّ فى التوجّهِ الى البيت الحرام أبداً، لا يحلُ استقبالُ غيره فى مكتوبةٍ، إلاَّ فى بعض الحَوْفِ، أو نافلةٍ فى سفرٍ، استدلالا بالكتاب والسنة. - وهكذا كل ما نسَغَ الله، ومعنى نَسَخَ تَرك فَرْضَه- : كان حقًّا فى وقته، وترْكُهُ …"
summary:
  ar: "مقطع من الرسالة للشافعي، ص 237، يرد فيه ذكر الفرض، والنافلة والنوافل، وما لا يحل، والصلاة المكتوبة؛ من النسخة المصورة المقروءة آليا، والنص مقتبس بحدود أربعين كلمة وفق سياسة المصادر ولم يُصحَّح. يجمعه متصفح الفروض والواجبات والطاعات والمستحبات والمكروهات والمحرمات وصغائر الذنوب."
  en: "An excerpt from al-Shafi'i's al-Risala, p. 237, whose wording mentions the obligatory (fard), the supererogatory (nafila), what is not lawful, the prescribed prayer; from the machine-read scan, quoted within forty words per the sources policy and not corrected. The Rulings Browser (obligations, acts of obedience, recommended, disliked and forbidden acts, and minor sins) lists it."
  ur: "الرسالہ، شافعی، ص 237 کا اقتباس جس میں فرض، نفل اور نوافل، جو حلال نہیں، فرض نماز کا ذکر ہے؛ مشینی طور پر پڑھی گئی نقل سے، چالیس الفاظ کی حد میں، بغیر تصحیح کے۔ فرائض، واجبات، طاعات، مستحبات، مکروہات، محرمات اور صغیرہ گناہوں کا براؤزر اسے درج کرتا ہے۔"
  fr: "Un extrait de al-Risala de al-Shafi'i, p. 237, dont le texte mentionne l'obligatoire (fard), le surérogatoire (nafila), ce qui n'est pas licite, la prière prescrite ; tiré de la numérisation lue par machine, cité dans la limite de quarante mots selon la politique des sources et non corrigé. Le Navigateur des statuts légaux (obligations, actes d'obéissance, actes recommandés, réprouvés et interdits, péchés mineurs) le répertorie."
  es: "Un extracto de al-Risala de al-Shafi'i, p. 237, cuyo texto menciona lo obligatorio (fard), lo supererogatorio (nafila), lo que no es lícito, la oración prescrita; tomado de la digitalización leída por máquina, citado dentro de cuarenta palabras según la política de fuentes y sin corregir. El Explorador de las calificaciones legales (obligaciones, actos de obediencia, actos recomendados, reprobados y prohibidos, y pecados menores) lo recoge."
  tr: "Şafiî'nin risalesi'nin 237. sayfasından bir alıntı, farz olan amelleri, nafile amelleri, haram olan amelleri ve farz namazları ele almaktadır. Bu alıntı, makine tarafından okunabilir taranmış bir kopyadan alınmıştır ve kaynak politikasına göre yaklaşık kırk kelimeyle alıntılanmıştır ve düzenlenmemiştir. Farz olan amelleri, görevleri, itaat amellerini, tavsiye edilen amelleri, mekruh olan amelleri, haram olan amelleri ve küçük günahları bir tarayıcı tarafından derlenmiştir."
  id: "Sebuah kutipan dari risalah Al-Shafi'i, halaman 237, menyebutkan amalan wajib, amalan sunnah, amalan haram, dan salat yang dianjurkan. Kutipan ini berasal dari salinan hasil pemindaian yang dapat dibaca mesin, dan teksnya dikutip sekitar empat puluh kata sesuai dengan kebijakan sumber dan belum diedit. Teks ini disusun oleh peramban untuk amalan wajib, kewajiban, amalan ketaatan, amalan yang dianjurkan, amalan yang tidak disukai, amalan yang dilarang, dan dosa-dosa kecil."
