text: "… الحقُّ فى التوجّهِ الى البيت الحرام أبداً، لا يحلُ استقبالُ غيره فى مكتوبةٍ، إلاَّ فى بعض الحَوْفِ، أو نافلةٍ فى سفرٍ، استدلالا بالكتاب والسنة. - وهكذا كل ما نسَغَ الله، ومعنى نَسَخَ تَرك فَرْضَه- : كان حقًّا فى وقته، وترْكُهُ …"
summary:
