label: { ar: "سنن النسائي 4959 — الأب والأبوة", en: "Sunan al-Nasa'i 4959 — the father and fatherhood", ur: "سنن نسائی 4959 — باپ اور والدیت", es: "Sunan al-Nasa'i 4959 — El padre y la paternidad", fr: "Sunan al-Nasa'i 4959 — Le père et la paternité", tr: "Sunan an-Nasa'i 4959 — Baba ve Babalık", id: "Sunan an-Nasa'i 4959 — Sang Ayah dan Peran Ayah" }
text: "… وَأَنَا أَسْمَعُ، عَنِ ابْنِ وَهْبٍ، قَالَ أَخْبَرَنِي عَمْرُو بْنُ الْحَارِثِ، وَهِشَامُ بْنُ سَعْدٍ، عَنْ عَمْرِو بْنِ شُعَيْبٍ، عَنْ أَبِيهِ، عَنْ جَدِّهِ عَبْدِ اللَّهِ بْنِ عَمْرٍو، أَنَّ رَجُلاً، مِنْ مُزَيْنَةَ أَتَى رَسُولَ اللَّهِ فَقَالَ يَا رَسُولَ اللَّهِ كَيْفَ تَرَى فِي حَرِيسَةِ الْجَبَلِ فَقَالَ \" هِيَ وَمِثْلُهَا وَالنَّكَالُ وَلَيْسَ فِي شَىْءٍ مِنَ الْمَاشِيَةِ قَطْعٌ إِلاَّ فِيمَا آوَاهُ …"
summary:
  ar: "حديث في سنن النسائي، رقم 4959، يذكر الأب والأبوة. يجمعه متصفح الأبوة في الإسلام مع نصوص القرآن والسنة والسيرة والكتب في هذا الباب."
  en: "A report in Sunan al-Nasa'i, no. 4959 (The Book of Cutting off the Hand of the Thief), that mentions the father and fatherhood. The Fatherhood in Islam Browser lists it with the texts of the Qur'an, the Sunnah, the seerah and the books on the father."
  ur: "سنن نسائی کی حدیث نمبر 4959، جس میں باپ اور والدیت کا ذکر ہے۔ اسلام میں ابوبت کا براؤزر اسے قرآن، سنت، سیرت اور کتابوں کی متعلقہ نصوص کے ساتھ جمع کرتا ہے۔"
  es: "Un relato en Sunan al-Nasa'i, n.º 4959 (El Libro de la Perdición del Ladrón), menciona al padre y la paternidad. El Navegador de la Paternidad en el Islam lo incluye en su lista junto con los textos del Corán, la Sunnah, la Seerah y los libros sobre el padre."
  fr: "Un hadith du Sunan an-Nasa'i, n° 4959 (Le Livre de la Main Coupée du Voleur), mentionne le père et la paternité. Le site « Paternité en Islam » le répertorie avec les textes du Coran, de la Sunna, de la Sîra et les ouvrages traitant de la paternité."
  tr: "Sunan-ı Nesai'de yer alan 4959 numaralı hadiste baba ve babalık kavramından bahsedilir. \"İslam'da Babalık\" tarayıcısı, bu konuyu Kur'an, Sünnet, biyografi ve diğer kitaplardan derleyerek sunmaktadır."
  id: "Sebuah hadits dalam Sunan an-Nasa'i, nomor 4959, menyebutkan tentang ayah dan peran ayah. Browser \"Peran Ayah dalam Islam\" mengumpulkan hadits tersebut dengan teks-teks dari Al-Quran, Sunnah, biografi, dan buku-buku lain tentang topik ini."
