summary:
  ar: "مدينة كبيرة حسنة جليلة عامرة، من مدن السمريقي الخرلغ، وفيها صناعات، وبين أهلها وبين الأغزاز حرب دائمة، وفقا لما يذكره المؤلف {cite:nuzhat-al-mushtaq-2002 p. 932} {cite:nuzhat-al-mushtaq-2002 p. 933}."
  en: "A large, fine, populous city among the cities of the Khallukh Samrīqī, with crafts; the author says its people are in constant war with the Oghuz {cite:nuzhat-al-mushtaq-2002 p. 932} {cite:nuzhat-al-mushtaq-2002 p. 933}."
  es: "Una ciudad grande, hermosa y populosa entre las ciudades del Khalukh Samrīqī, con artesanías; el autor dice que su gente está en guerra constante con los Oghuz {cite:nuzhat-al-mushtaq-2002 p. 932} {cite:nuzhat-al-mushtaq-2002 p. 933}."
  fr: "Une grande et belle ville peuplée parmi les villes du Khallukh Samrīqī, avec des métiers; l'auteur dit que ses habitants sont en guerre constante avec les Oghuz {cite:nuzhat-al-mushtaq-2002 p. 932} {cite:nuzhat-al-mushtaq-2002 p. 933}."
  ur: "خلوخ سمریقی کے شہروں کے درمیان ایک بڑا، عمدہ، آبادی والا شہر، دستکاری کے ساتھ؛ مصنف کا کہنا ہے کہ اس کے لوگ اوغوز کے ساتھ مسلسل جنگ میں ہیں۔ 932} {حوالہ: نزہت المشتاق-2002 ص۔ 933}۔"
  tr: "Büyük, iyi, soylu, refah içinde bir şehir, Samriqi Al-Kharlag'ın şehirlerinden biri, sanayiye sahip ve halkı ile işgalciler arasında sürekli bir savaş vardır, yazara göre {cite:Nuzhat-al-Mushtaq-2002 s. 932} {cite:Nuzhat-al-Mushtaq-2002 s. 933}."
  id: "Sebuah kota besar, baik, mulia, makmur, salah satu kota Samriqi Al-Kharlag, dengan industri, dan ada perang terus-menerus antara penduduknya dan para penjajah, menurut penulis {cite:Nuzhat-al-Mushtaq-2002 hlm. 932} {cite:Nuzhat-al-Mushtaq-2002 hlm. 933}."
