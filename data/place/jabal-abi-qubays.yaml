summary:
  ar: "جبل بمكة مشرف على الحرم؛ يذكره الرحيق المختوم في سبب حلف الفضول: علاه الزبيدي المظلوم ونادى بأشعار يصف فيها ظلامته رافعاً صوته."
  en: "A mountain at Mecca overlooking the sanctuary; al-Raheeq al-Makhtum names it in the origin of the Fudul pact, where the wronged Zabidi merchant climbed it and cried out his grievance in verse."
  es: "Una montaña en La Meca que domina el santuario; al-Raheeq al-Makhtum la menciona en el origen del pacto de Fudul, donde el mercader zabidi agraviado la escaló y clamó su agravio en verso."
  fr: "Une montagne de La Mecque surplombant le sanctuaire; al-Raheeq al-Makhtum la mentionne dans l'origine du pacte de Fudul, où le marchand zabidi lésé l'escalada et exprima son grief en vers."
  ur: "مکہ میں ایک پہاڑ جو حرم کو نظر انداز کرتا ہے؛ الرحیق المختم نے اس کا نام فضول معاہدہ کی اصل میں رکھا ہے، جہاں ظالم زبیدی سوداگر اس پر چڑھ گیا اور آیت میں اپنی شکایت بیان کی۔"
