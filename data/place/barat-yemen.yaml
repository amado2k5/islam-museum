summary:
  ar: جبل عظيم شاهق وعر من بلاد شاكر من همدان، ليس له إلا ثلاثة طرق للصعود، وأهله دهمة؛ قاتله الهادي في صفر 285هـ.
  en: A great, towering, rugged mountain in the land of Shakir of Hamdan with only three ways up, inhabited by the Dahma; al-Hadi fought there in Safar 285 AH.
  ur: ہمدان کی شاکر شاخ کے علاقے میں ایک بلند و دشوار عظیم پہاڑ جس پر چڑھنے کے صرف تین راستے ہیں اور جس کے رہنے والے دہمہ ہیں؛ ہادی نے صفر 285ھ میں وہاں لڑائی کی۔
  es: "Una gran montaña, imponente y escarpada, en la tierra de Shakir de Hamdan, con solo tres caminos para ascender, habitada por los Dahma; al-Hadi luchó allí en Safar 285 AH."
  fr: "Une grande montagne imposante et escarpée au pays de Shakir de Hamdan, avec seulement trois chemins pour y accéder, habitée par les Dahma; al-Hadi y a combattu en Safar 285 AH."
