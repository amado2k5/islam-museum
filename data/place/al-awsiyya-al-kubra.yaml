summary:
  ar: "الأوسية الكبرى، ضيعة في الفيوم؛ يصلها الماء من مقسمين، ولها باب يتحكم في الماء، ويُشرب منه نخلها وشجرها {cite:khitat-maqrizi-1998 p.731}."
  en: "Al-Awsiyya al-Kubra, a village of the Fayyum; water reaches it from two outlets, it has a gate that controls the flow, and its palms and trees are watered from it {cite:khitat-maqrizi-1998 p.731}."
  es: "Al-Awsiyya al-Kubra, una aldea del Fayyum; el agua llega a ella desde dos salidas, tiene una compuerta que controla el flujo y sus palmeras y árboles se riegan con ella {cite:khitat-maqrizi-1998 p.731}."
  fr: "Al-Awsiyya al-Kubra, un village du Fayyum; l'eau y parvient par deux sorties, il possède une porte qui contrôle le débit, et ses palmiers et arbres sont arrosés par elle {cite:khitat-maqrizi-1998 p.731}."
  ur: "الاوسیہ الکبری، فیوم کا ایک گاؤں؛ پانی اس تک دو راستوں سے پہنچتا ہے، اس کا ایک دروازہ ہے جو بہاؤ کو کنٹرول کرتا ہے، اور اس کی کھجوروں اور درختوں کو اس سے پانی پلایا جاتا ہے۔"
