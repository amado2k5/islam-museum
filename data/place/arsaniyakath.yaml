summary:
  ar: "مدينة بناؤها متقن وأسواقها عامرة، ولها بساتين وفواكه، وتقع في مستو من الأرض، وتبعد عن بونجكت تسعة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 505}"
  en: "A town with well-built structures, busy markets and orchards and fruit, on level ground, twenty-nine miles from Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 505}"
  es: "Un pueblo con edificios bien construidos, mercados bulliciosos, huertos frutales y frutales, situado en terreno llano, a veintinueve millas de Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 505}"
  fr: "Une ville aux bâtiments bien construits, aux marchés animés, aux vergers et aux arbres fruitiers, située en plaine, à vingt-neuf miles de Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 505}"
  ur: "بونجیکاٹھ سے انتیس میل کے فاصلے پر سطح زمین پر اچھی طرح سے تعمیر شدہ ڈھانچے، مصروف بازاروں اور باغات اور پھلوں والا قصبہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 505}"
  tr: "Titiz bir yapıya sahip ve meyve bahçeleri ile meyvelerle dolu hareketli pazarlara sahip, düz bir arazide yer alan ve Punjkat'a yirmi dokuz mil uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 505}"
  id: "Sebuah kota dengan konstruksi yang tepat dan pasar yang ramai, dengan kebun buah dan buah-buahan, terletak di tanah datar, dan berjarak dua puluh sembilan mil dari Punjkat. {cite:Nuzhat-al-Mushtaq-2002 hlm. 505}"
