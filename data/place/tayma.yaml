summary:
  ar: "حصن عامر وبنية أزلية، عين ماء خرارة، وبها نخيل كثير، وتبعد عن أول الشام ثلاثة أيام، وعن المدينة أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 352}"
  en: "A populated fortress and ancient settlement with a rushing spring and many palms, three days from the beginning of Syria and four stages from Medina. {cite:nuzhat-al-mushtaq-2002 p. 352}"
  es: "Una fortaleza poblada y un antiguo asentamiento con un manantial caudaloso y numerosas palmeras, a tres días del inicio de Siria y a cuatro etapas de Medina. {cite:nuzhat-al-mushtaq-2002 p. 352}"
  fr: "Une forteresse habitée et un ancien village avec une source jaillissante et de nombreux palmiers, à trois jours de marche du début de la Syrie et à quatre étapes de Médine. {cite:nuzhat-al-mushtaq-2002 p. 352}"
  ur: "ایک آبادی والا قلعہ اور قدیم بستی جس میں ایک تیز بہار اور بہت سی کھجوریں ہیں، شام کے آغاز سے تین دن اور مدینہ سے چار مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 352}"
  tr: "Ebedi yapıya sahip zengin bir kale, Kharara suyu kaynağı, birçok palmiye ağacı bulunuyor, Levant'ın başlangıcından üç gün ve Medine'den dört adım uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 352}"
  id: "Benteng makmur dengan struktur abadi, mata air Kharara, dengan banyak pohon palem, terletak tiga hari dari awal Levant dan empat langkah dari Madinah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 352}"
