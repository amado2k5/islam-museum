summary:
  ar: "الإسكندرية فتحها عمرو بن العاص عنوة بغير عهد ولا عقد في رواية كتابه إلى عمر بن الخطاب — وهي كلها صلح في قول يزيد بن أبي حبيب — بعد أن رفض ملك الروم صلح الموقس فأغلقوا بابها وآذنوا بالحرب؛ واختطّ بها الزبير بن العوّام خطّة، وسأل الموقس عمرو أن يُدفن في كنيسة من كنائسها ذكرها."
  en: "Alexandria, taken by Amr ibn al-As by force with neither covenant nor contract — in the wording of his letter to Umar ibn al-Khattab, though in Yazid ibn Abi Habib's reading it was all treaty — after Rome's king rejected the Muqawqis's peace, its people shutting the gate and declaring war; al-Zubayr ibn al-Awwam laid a khitta in it, and the Muqawqis asked Amr to bury him in one of its churches he named."
