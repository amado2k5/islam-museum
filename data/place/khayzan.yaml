summary:
  ar: "خيزان بلدة بعمل أرمينية؛ صالح الجرّاح بن عبد الله الحكمي أهل حمزين على نقلهم إليها وجعل لهم قريتين منها، وصالحها مسلمة بن عبد الملك وأمر بحصنها فهُدم واتخذ لنفسه بها ضياعاً هي اليوم المعروفة بحوز خيزان."
  en: "Khayzan, a town of Armenia's district; al-Jarrah ibn Abdallah al-Hakami compounded with Hamzin's people to transfer them to it, giving them two of its villages, and Maslama ibn Abd al-Malik made peace with it, ordered its fortress demolished, and took estates there known today as Hawz Khayzan."
  es: "Khayzan, una ciudad del distrito de Armenia; al-Jarrah ibn Abdallah al-Hakami llegó a un acuerdo con la gente de Hamzin para trasladarlos allí, cediéndoles dos de sus aldeas, y Maslama ibn Abd al-Malik hizo las paces con ella, ordenó la demolición de su fortaleza y tomó posesión de las propiedades que hoy se conocen como Hawz Khayzan."
  fr: "Khayzan, une ville du district d'Arménie; al-Jarrah ibn Abdallah al-Hakami s'allia avec le peuple de Hamzin pour les y transférer, leur donnant deux de ses villages, et Maslama ibn Abd al-Malik fit la paix avec elle, ordonna la démolition de sa forteresse et prit des terres qui y sont connues aujourd'hui sous le nom de Hawz Khayzan."
  ur: "خازن، آرمینیا کے ضلع کا ایک قصبہ؛ الجراح بن عبداللہ الحکمی نے حمزین کے لوگوں کے ساتھ مل کر انہیں اس میں منتقل کر دیا، اس کے دو گاؤں انہیں دے دیے، اور مسلمہ بن عبد الملک نے اس کے ساتھ صلح کی، اس کے قلعے کو گرانے کا حکم دیا، اور وہاں کی جاگیریں لے لیں جو آج حوز خیزان کے نام سے مشہور ہے۔"
  tr: "Khizan Ermeni yönetimi altında bir kasabaydı; Al-Jarrah ibn Abdullah al-Hakemi, Hamzin halkını yerleşimleriyle barıştırdı ve onlara iki köy verdi. Köyü Maslama ibn Abd al-Malik ile barıştırdı, tahkimatını emretti, yıktı ve bugün Hawz Khizan olarak bilinen yerleşimi ele geçirdi."
  id: "Khizan adalah sebuah kota di bawah kekuasaan Armenia; Al-Jarrah ibn Abdullah al-Hakami mendamaikan penduduk Hamzin dengan relokasi mereka dan memberikan dua desa kepada mereka. Ia mendamaikannya dengan Maslama ibn Abd al-Malik, memerintahkan pertahanannya, merobohkannya, dan mengambil alih pemukiman yang kini dikenal sebagai Hawz Khizan."
