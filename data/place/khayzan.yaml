  en: "Khayzan, a town of Armenia's district; al-Jarrah ibn Abdallah al-Hakami compounded with Hamzin's people to transfer them to it, giving them two of its villages, and Maslama ibn Abd al-Malik made peace with it, ordered its fortress demolished, and took estates there known today as Hawz Khayzan."
