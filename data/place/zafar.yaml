summary:
  ar: "مدينة كانت قصبة يحصب، وكان بها قصر ريدان المشهور، وهي اليوم في خراب أكثره، وبقيت فيها بقايا من أهلها. {cite:nuzhat-al-mushtaq-2002 p. 152}"
  en: "Once the capital of Yahsub and home to the famous Rayban palace, it is now largely in ruins, with a few of its people still living there. {cite:nuzhat-al-mushtaq-2002 p. 152}"
  es: "Antaño capital de Yahsub y hogar del famoso palacio Rayban, ahora se encuentra en gran parte en ruinas, aunque algunos de sus antiguos habitantes aún viven allí. {cite:nuzhat-al-mushtaq-2002 p. 152}"
  fr: "Autrefois capitale de Yahsub et abritant le célèbre palais Rayban, la ville est aujourd'hui en grande partie en ruines, et seuls quelques habitants y vivent encore. {cite:nuzhat-al-mushtaq-2002 p. 152}"
