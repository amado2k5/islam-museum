summary:
  ar: "مدينة كبيرة كثيرة الخيرات متصلة المكاسب، وأهلها مياسير، ولها رستاق عامر، وهي في الشبه قريبة من أبرقويه. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  en: "A large city rich in produce and gains, with wealthy people and a populous district; in appearance it resembles Abarqawayh. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  es: "Una gran ciudad rica en productos y ganancias, con gente adinerada y un distrito populoso; en apariencia se asemeja a Abarqawayh. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  fr: "Une grande ville prospère, riche en produits agricoles et en gains, peuplée de gens aisés et dotée d'un quartier densément peuplé; son apparence la rapproche d'Abarqawayh. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  ur: "پیداوار اور فوائد سے مالا مال ایک بڑا شہر، امیر لوگ اور ایک آبادی والا ضلع؛ ظاہری شکل میں یہ ابرقویہ سے مشابہ ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 431}"
  tr: "Büyük bir şehir, iyi şanslarla dolu, halkı büyük bir şehir ve Abarquwayh'e yakın zengin bir Rustaq'a sahiptir. {cite:nuzhat-al-mushtaq-2002 s. 431}"
  id: "Kota besar yang penuh keberuntungan, dengan penduduknya yang besar, dan memiliki Rustaq yang makmur, dekat dengan Abarquwayh. {cite:Nuzhat-al-Mushtaq-2002 hlm. 431}"
