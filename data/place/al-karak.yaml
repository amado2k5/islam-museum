summary:
  ar: "مدينة وحصن شهير جنوب البلقاء، كانت قاعدة ملوك من بيت أيوب ثم ملاذاً لأمراء المماليك؛ أُخذت سنة خمس وثمانين من الملك المسعود خضر بن بيبرس، ونُفي إليها الملك الناصر محمد بن قلاوون ثم أُحضر منها إلى السلطنة سنة ثمان وتسعين {cite:shadharat-dhahab p. 661, 769}."
  en: "A city and famous fortress south of al-Balqa', seat of kings of the Ayyubid house and then a refuge for Mamluk amirs. It was taken in 685 from al-Malik al-Mas'ud Khidr ibn Baybars, and al-Malik al-Nasir Muhammad ibn Qalawun was exiled there, then brought back from it to the sultanate in 698 {cite:shadharat-dhahab p. 661, 769}."
  ur: "بلقاء کے جنوب میں شہر اور قلعہ؛ ایوبی حکمرانوں کا مرکز رہا اور بعد میں مملوک امرا کی پناہ گاہ بنا۔ الناصر محمد بن قلاوون کو یہاں جلاوطن کیا گیا، پھر 698ھ میں سلطنت کے لیے واپس بلایا گیا۔ {cite:shadharat-dhahab p. 661,769}"
  es: "Ciudad y famosa fortaleza al sur de al-Balqa', sede de los reyes de la dinastía ayubí y posteriormente refugio de los emires mamelucos. Fue tomada en 685 a al-Malik al-Mas'ud Khidr ibn Baybars, y al-Malik al-Nasir Muhammad ibn Qalawun fue exiliado allí, para luego ser traído de vuelta al sultanato en 698 {cita: shadharat-dhahab pág. 661, 769}."
  fr: "Ville et forteresse réputée au sud d'al-Balqa', siège des rois de la dynastie ayyoubide puis refuge des émirs mamelouks. Elle fut prise en 685 à al-Malik al-Mas'ud Khidr ibn Baybars, et al-Malik al-Nasir Muhammad ibn Qalawun y fut exilé, avant d'être ramené au sultanat en 698 {cite:shadharat-dhahab p. 661, 769}."
  tr: "Balqa'nın güneyinde ünlü bir şehir ve kale olan bu şehir, Eyyub hanedanından kralların üssü ve ardından Memlük prenslerinin sığınağıdır. Seksen beşinci yılda Kral el-Mes'ud Hidr bin Baybars tarafından ele geçirilmiş, Kral el-Nasir Muhammed ibn Kalavun tarafından sürgün edilmiş ve doksan sekizinci yılında Sultanlığa getirilmiştir {atıf: shadharat-dhahab, s. 661, 769}."
  id: "Kota dan benteng terkenal di selatan Balqa, kota ini menjadi basis bagi raja-raja dari dinasti Ayyub dan kemudian menjadi tempat perlindungan bagi para pangeran Mamluk. Kota ini direbut pada tahun delapan puluh lima oleh Raja al-Mas'ud Khidr ibn Baybars, diasingkan oleh Raja al-Nasir Muhammad ibn Qalawun, dan dibawa ke Kesultanan pada tahun sembilan puluh delapan {cite:shadharat-dhahab, hlm. 661, 769}."
