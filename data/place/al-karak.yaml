summary:
  ar: "مدينة وحصن شهير جنوب البلقاء، كانت قاعدة ملوك من بيت أيوب ثم ملاذاً لأمراء المماليك؛ أُخذت سنة خمس وثمانين من الملك المسعود خضر بن بيبرس، ونُفي إليها الملك الناصر محمد بن قلاوون ثم أُحضر منها إلى السلطنة سنة ثمان وتسعين {cite:shadharat-dhahab p. 661, 769}."
  en: "A city and famous fortress south of al-Balqa', seat of kings of the Ayyubid house and then a refuge for Mamluk amirs. It was taken in 685 from al-Malik al-Mas'ud Khidr ibn Baybars, and al-Malik al-Nasir Muhammad ibn Qalawun was exiled there, then brought back from it to the sultanate in 698 {cite:shadharat-dhahab p. 661, 769}."
