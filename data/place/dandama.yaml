  ar: "مدينة صغيرة في أرض سفالة، بينها وبين جنطمة مجريان في البحر وسبعة أيام في البر، وأهلها مثل أهل جنطمة في الفقر والذلة {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
