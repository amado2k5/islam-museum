  fr: "Une petite ville située dans les terres de Sofala, à deux traversées maritimes et sept jours de route de Jantama. Ses habitants, comme ceux de Jantama, sont pauvres {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
  ur: "سوفالہ کا ایک چھوٹا سا شہر جنتاما سے زمینی راستے، دو سمندری راستے اور سات دن کی مسافت پر ہے۔ اس کے لوگ جنتامہ کی طرح غریب ہیں۔ 67-68}۔"
