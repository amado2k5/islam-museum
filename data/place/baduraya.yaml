  ar: "بلد في سواد بغداد؛ عند البلاذري ذكرها الشاعر في سوق بغداد مع الأنبار وقطربل ومسكن وعبر بعض المسلمين نهر سبوذا فأصابوا كوثى ونهر الملك وبادوريا."
  en: "Town of the Baghdad Sawad; in al-Baladhuri a poet lists it with al-Anbar, Qatarrabul and Maskin in Baghdad's market, and some Muslims crossed Nahr Subudhan taking Kutha, Nahr al-Malik and Baduraya."
  es: "Ciudad del Sawad de Bagdad; en al-Baladhuri un poeta la enumera junto con al-Anbar, Qatarrabul y Maskin en el mercado de Bagdad, y algunos musulmanes cruzaron Nahr Subudhan tomando Kutha, Nahr al-Malik y Baduraya."
  fr: "Ville du Sawad de Bagdad; dans al-Baladhuri, un poète la mentionne avec al-Anbar, Qatarrabul et Maskin dans le marché de Bagdad, et certains musulmans ont traversé Nahr Subudhan en passant par Kutha, Nahr al-Malik et Baduraya."
  ur: "بغداد کا قصبہ سواد؛ البلادھوری میں ایک شاعر نے اسے بغداد کے بازار میں الانبار، قطررابول اور مسکین کے ساتھ درج کیا ہے، اور کچھ مسلمانوں نے کوٹھا، نہر المالک اور بدورایا کو لے کر نہر سبودھان کو عبور کیا۔"
