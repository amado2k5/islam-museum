summary:
  ar: "مدينة فاضلة شاعجة كاملة، لها أزقة واسعة وشوارع وأسواق عامرة، وخانات واسعة وبساتين وجنات، تتجهز منها الأوساق من جميع الآفاق، وتقع على البحر. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  en: "A fine, lively and complete city with broad lanes, markets, wide inns, gardens and orchards, from which goods are shipped to every land; it lies on the sea. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  es: "Una ciudad hermosa, animada y completa, con amplias callejuelas, mercados, grandes posadas, jardines y huertos, desde donde se envían mercancías a todas partes; está situada a orillas del mar. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  fr: "Une ville belle, animée et complète, avec de larges avenues, des marchés, de vastes auberges, des jardins et des vergers, d'où les marchandises sont expédiées vers tous les pays; elle est située au bord de la mer. {cite:nuzhat-al-mushtaq-2002 p. 600}"
