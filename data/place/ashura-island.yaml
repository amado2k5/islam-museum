summary:
  ar: "جزيرة قليلة العمارة، أرضها حرشاء كثيرة المقارب والأشجار، تبعد عن جزيرة شامل أربعة أيام، ومنها إلى جزيرة ملاي يوم خفيف {cite:nuzhat-al-mushtaq-2002 p. 85}."
  en: "A sparsely settled island with rough land full of thickets and trees, four days from Shamil and a light day's sail from Malay {cite:nuzhat-al-mushtaq-2002 p. 85}."
  es: "Una isla escasamente poblada con tierra accidentada llena de matorrales y árboles, a cuatro días de Shamil y a un día de navegación ligera de Malay {cite:nuzhat-al-mushtaq-2002 p. 85}."
  fr: "Une île peu peuplée, au terrain accidenté et couvert de fourrés et d'arbres, à quatre jours de Shamil et à une journée de navigation légère de Malay {cite:nuzhat-al-mushtaq-2002 p. 85}."
  ur: "ایک کم آباد جزیرہ جس میں جھاڑیوں اور درختوں سے بھری کھردری زمین ہے، شمل سے چار دن کی مسافت پر اور مالے سے ہلکے دن کا سفر۔ 85}۔"
  tr: "Az inşa edilmiş bir ada olan bu ada, arazisi yoğun ormanlık ve ağaçlarla zengin, Shamil Adası'na dört gün uzaklıkta, oradan Malay Adası'na ise hafif bir gün uzaklıkta {cite:Nuzhat-al-mushtaq-2002, s. 85}."
  id: "Pulau yang jarang dibangun, wilayahnya lebat berhutan dan kaya pohon, berjarak empat hari dari Pulau Shamil, dan dari sana ke Pulau Melayu hanya sehari yang ringan {cite:Nuzhat-al-mushtaq-2002, hlm. 85}."
