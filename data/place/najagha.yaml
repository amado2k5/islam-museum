summary:
  ar: "مدينة صغيرة على ضفة النهر الذي يشق بلاد الحبشة، أهلها فلاحون يزرعون الذرة والشعير، ويجهزون منه معايشهم. وتبعد عن مركطة ستة أيام {cite:nuzhat-al-mushtaq-2002 p. 43}."
  en: "A small town on the bank of the river that crosses Abyssinia. Its people are farmers who grow sorghum and barley for their living. Six days from Markata {cite:nuzhat-al-mushtaq-2002 p. 43}."
  es: "Un pequeño pueblo a orillas del río que atraviesa Abisinia. Sus habitantes son agricultores que cultivan sorgo y cebada para subsistir. Seis días desde Markata {cite:nuzhat-al-mushtaq-2002 p. 43}."
  fr: "Une petite ville située sur la rive du fleuve qui traverse l'Abyssinie. Ses habitants sont des agriculteurs qui cultivent du sorgho et de l'orge pour vivre. À six jours de Markata {cite:nuzhat-al-mushtaq-2002 p. 43}."
  ur: "دریا کے کنارے ایک چھوٹا سا قصبہ جو حبشہ کو عبور کرتا ہے۔ اس کے لوگ کسان ہیں جو اپنی زندگی گزارنے کے لیے جوار اور جو کاشت کرتے ہیں۔ مرکاتہ سے چھ دن {حوالہ: نزہت المشتاق-2002 ص۔ 43}۔"
