label:
  ar: "آمل (مازندران)"
  en: "Amul (Mazandaran)"
summary:
  ar: "مدينة في الركن الجنوبي الغربي من سهل مازندران الشرقي، على الضفة الغربية لنهر هراز، على نحو 20 كم جنوب بحر قزوين، كانت من أهم مدن طبرستان ومراكز صناعاتها وتجارتها وعلمائها، ومنها أبو جعفر الطبري وأبو الطيب الطبري {cite:encyclopaedia-of-islam-2 vol. 1 p. 481-483}."
  en: "A town in the south-west corner of the eastern Mazandaran plain, on the west bank of the Harhaz river about 20 km south of the Caspian Sea. In the Muslim period it was a great town and capital of Tabaristan, a centre of industry, trade and scholarship, where al-Tabari and the jurist Abu '1-Tayyib al-Tabari were born {cite:encyclopaedia-of-islam-2 vol. 1 p. 481-483}."
