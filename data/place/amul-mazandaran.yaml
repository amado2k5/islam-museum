summary:
  ar: "مدينة في الركن الجنوبي الغربي من سهل مازندران الشرقي، على الضفة الغربية لنهر هراز، على نحو 20 كم جنوب بحر قزوين، كانت من أهم مدن طبرستان ومراكز صناعاتها وتجارتها وعلمائها، ومنها أبو جعفر الطبري وأبو الطيب الطبري {cite:encyclopaedia-of-islam-2 vol. 1 p. 481-483}."
  en: "A town in the south-west corner of the eastern Mazandaran plain, on the west bank of the Harhaz river about 20 km south of the Caspian Sea. In the Muslim period it was a great town and capital of Tabaristan, a centre of industry, trade and scholarship, where al-Tabari and the jurist Abu '1-Tayyib al-Tabari were born {cite:encyclopaedia-of-islam-2 vol. 1 p. 481-483}."
  es: "Ciudad situada en el extremo suroeste de la llanura oriental de Mazandarán, en la orilla occidental del río Harhaz, a unos 20 km al sur del mar Caspio. Durante el período musulmán fue una gran ciudad y capital de Tabaristán, centro de industria, comercio y erudición, donde nacieron al-Tabari y el jurista Abu '1-Tayyib al-Tabari {cite:encyclopaedia-of-islam-2 vol. 1 p. 481-483}."
  fr: "Ville située à l'extrémité sud-ouest de la plaine orientale du Mazandaran, sur la rive ouest du fleuve Harhaz, à environ 20 km au sud de la mer Caspienne. À l'époque musulmane, c'était une ville importante et la capitale du Tabaristan, un centre industriel, commercial et intellectuel, où naquirent al-Tabari et le juriste Abu 'i-Tayyib al-Tabari (encyclopédie de l'islam, vol. 2, p. 481-483)."
  ur: "مشرقی مازندران کے میدان کے جنوب مغربی کونے میں واقع ایک قصبہ، بحیرہ کیسپین سے تقریباً 20 کلومیٹر جنوب میں دریائے ہرز کے مغربی کنارے پر۔ مسلم دور میں یہ طبرستان کا ایک عظیم قصبہ اور دارالحکومت تھا، صنعت، تجارت اور علمی مرکز تھا، جہاں الطبری اور فقیہ ابو 1-طیب الطبری پیدا ہوئے تھے۔ 1 ص۔ 481-483}۔"
  tr: "Doğu Mazandaran ovasının güneybatı köşesinde, Haraz Nehri'nin batı kıyısında, Hazar Denizi'nin yaklaşık 20 km güneyinde yer alan bu şehir, Tabaristan'ın en önemli şehirlerinden biriydi; sanayi, ticaret ve alimlerin merkezleri arasında Abu Ja'far al-Tabari ile Abu al-Tayyib al-Tabari {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 481-483} yer almaktadır."
  id: "Sebuah kota yang terletak di sudut barat daya dataran Mazandaran timur, di tepi barat Sungai Haraz, sekitar 20 km di selatan Laut Kaspia, kota ini merupakan salah satu kota terpenting di Tabaristan, pusat industri, perdagangan, dan ulamanya, termasuk Abu Ja'far al-Tabari dan Abu al-Tayyib al-Tabari {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 481-483}."
