summary:
  ar: "مدينة من مدن ما بين مالقة وقرطبة، وكانت هي وانتقرة مدينتين أخلتهما الفتن، ومعها انتقيرة مدينة ذات مكانة في زمن ابن أبي عامر. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  en: "A town between Malaga and Cordoba; it and Antaqira were two cities emptied by the troubles of the civil wars. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  es: "Una ciudad entre Málaga y Córdoba; tanto esta como Antaqira quedaron despobladas por los estragos de las guerras civiles. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  fr: "Ville située entre Malaga et Cordoue, elle fut, avec Antaqira, l'une des deux cités vidées de leurs habitants par les troubles des guerres civiles. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  ur: "ملاگا اور قرطبہ کے درمیان ایک قصبہ؛ یہ اور انتقیرہ خانہ جنگیوں کی مصیبتوں سے خالی ہونے والے دو شہر تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 570}"
  tr: "Malaga ile Córdoba arasında bir şehirdir ve Intiqira ile Intiqira, İbn Ebi Amir döneminde büyük öneme sahip bir şehir olan İntiqira ile birlikte çatışmalar tarafından yok edilen şehirlerdi. {kaynak:nuzhat-al-mushtaq-2002 s. 570}"
  id: "Ini adalah kota di antara Malaga dan Córdoba, dan kota ini serta Intiqira adalah kota yang tersapu oleh konflik, bersama dengan Intiqira, sebuah kota yang sangat penting pada masa Ibn Abi Amir. {cite:Nuzhat-al-Mushtaq-2002 hlm. 570}"
