summary:
  ar: "مدينة على الضفة الغربية للنيل، من المدن القديمة التي بناها القبط الأول. فيها مزارع وبساتين وأمن وهدوء، وأعناب كثيرة يُحمل منها إلى جميع أرض مصر، وفيها بقايا بنيان وآثار للقبط. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A city on the west bank of the Nile, one of the old towns built by the early Copts. It has farms, orchards, a quiet and secure setting, and plentiful grapes carried to all of Egypt. Remains of Coptic buildings and monuments survive there. {cite:nuzhat-al-mushtaq-2002 p. 129}"
