summary:
  ar: "مدينة على الضفة الغربية للنيل، من المدن القديمة التي بناها القبط الأول. فيها مزارع وبساتين وأمن وهدوء، وأعناب كثيرة يُحمل منها إلى جميع أرض مصر، وفيها بقايا بنيان وآثار للقبط. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A city on the west bank of the Nile, one of the old towns built by the early Copts. It has farms, orchards, a quiet and secure setting, and plentiful grapes carried to all of Egypt. Remains of Coptic buildings and monuments survive there. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  es: "Ciudad situada en la margen occidental del Nilo, una de las antiguas ciudades construidas por los primeros coptos. Cuenta con granjas, huertos, un entorno tranquilo y seguro, y abundantes uvas que se exportaban a todo Egipto. Aún se conservan restos de edificios y monumentos coptos. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  fr: "Ville située sur la rive ouest du Nil, l'une des anciennes cités fondées par les premiers Coptes. Elle possède des fermes, des vergers, un cadre paisible et sûr, et produit d'abondantes récoltes de raisins exportées dans toute l'Égypte. Des vestiges de bâtiments et de monuments coptes y subsistent. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  ur: "دریائے نیل کے مغربی کنارے پر ایک شہر، قدیم قبطیوں کے بنائے ہوئے پرانے قصبوں میں سے ایک۔ اس میں کھیتوں، باغات، ایک پرسکون اور محفوظ ماحول، اور بہت سارے انگور پورے مصر میں لے جایا جاتا ہے۔ قبطی عمارتوں اور یادگاروں کے باقیات وہاں موجود ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 129}"
  tr: "Nil'in batı kıyısında yer alan bir şehir, ilk Kıpti tarafından inşa edilen antik şehirlerden biridir. Çiftlikleri, meyve bahçeleri, güvenlik ve huzur vardır; birçok üzüm tüm Mısır'a taşınır ve Kıpti yapılarının ve kalıntılarının kalıntılarını barındırır. {kaynak:nuzhat-al-mushtaq-2002 s. 129}"
  id: "Sebuah kota di tepi barat Sungai Nil, salah satu kota kuno yang dibangun oleh Koptik pertama. Kota ini memiliki pertanian, kebun buah, keamanan, dan ketenangan, dengan banyak buah anggur yang dibawa ke seluruh Mesir, serta berisi sisa-sisa bangunan dan reruntuhan Koptik. {cite:Nuzhat-al-Mushtaq-2002 hlm. 129}"
