summary:
  ar: "مدينة كبيرة عامرة في طرف الصحراء، ليس لأهل تلك البلاد مدينة يأوون إليها غيرها، ومنها إلى البحر ثلاث عشرة مرحلة، وفيها قبائل لمتونة ولمطة. {cite:nuzhat-al-mushtaq-2002 p. 224}"
  en: "A large, populated city on the edge of the desert; it is the only town where the people of the region shelter, and the Lamtuna and Lamta tribes live near it. {cite:nuzhat-al-mushtaq-2002 p. 224}"
  es: "Una gran ciudad poblada al borde del desierto; es el único lugar donde se refugian los habitantes de la región, y las tribus Lamtuna y Lamta viven cerca de ella. {cite:nuzhat-al-mushtaq-2002 p. 224}"
  fr: "Une grande ville peuplée en bordure du désert; c’est la seule ville où les habitants de la région trouvent refuge, et les tribus Lamtuna et Lamta vivent à proximité. {cite:nuzhat-al-mushtaq-2002 p. 224}"
  ur: "صحرا کے کنارے پر ایک بڑا، آبادی والا شہر؛ یہ واحد قصبہ ہے جہاں علاقے کے لوگ پناہ لیتے ہیں، اور لمٹونا اور لامٹا قبائل اس کے قریب رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 224}"
  tr: "Çölün kenarında yer alan büyük, hareketli bir şehir olan bu ülkenin halkının sığınacak başka bir şehri yoktur ve oradan denize on üç aşama vardır; aralarında Lamtuna ve Lamta kabileleri de bulunur. {kaynak:nuzhat-al-mushtaq-2002 s. 224}"
  id: "Kota besar dan ramai di tepi gurun, penduduk negeri itu tidak memiliki kota lain untuk berlindung, dan dari sana ada tiga belas tahap menuju laut, termasuk suku Lamtuna dan Lamta. {cite:Nuzhat-al-Mushtaq-2002 hlm. 224}"
