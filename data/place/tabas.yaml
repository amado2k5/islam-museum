summary:
  ar: "مدينة جرومية، ولها نخيل، وبناؤها بالطين، وماؤها من مياه مجلوبة، وتقع على شفير المفازة. {cite:nuzhat-al-mushtaq-2002 p. 463}"
  en: "A city with palms and mud-brick buildings, drinking from water brought in from outside, on the edge of the desert. {cite:nuzhat-al-mushtaq-2002 p. 463}"
  es: "Una ciudad con palmeras y edificios de adobe, que se abastece de agua traída del exterior, al borde del desierto. {cite:nuzhat-al-mushtaq-2002 p. 463}"
  fr: "Une ville aux palmiers et aux bâtiments en briques de terre crue, alimentée par une eau acheminée de l'extérieur, aux portes du désert. {cite:nuzhat-al-mushtaq-2002 p. 463}"
  ur: "صحرا کے کنارے پر کھجوروں اور مٹی کی اینٹوں کی عمارتوں والا شہر، باہر سے لائے گئے پانی سے پینا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 463}"
  tr: "Jerumiyah şehri, palmiye ağaçlarıyla kaplıdır, yapısı kilden yapılmıştır, suyu sudan çekilir ve Mafazah'ın kenarında yer almaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 463}"
  id: "Kota Jerumiyah, dengan pohon palem, pembangunannya terbuat dari tanah liat, airnya diambil dari air, dan terletak di tepi Mafazah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 463}"
