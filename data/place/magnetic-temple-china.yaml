label: { ar: "هيكل الصين المدور", en: "The round temple of farthest China", es: "El templo redondo de la China más lejana", fr: "Le temple rond de la Chine la plus reculée", ur: "دور دراز چین کا گول مندر", tr: "Çin'in yuvarlak yapısı", id: "Struktur bulat Tiongkok" }
summary:
  ar: "هيكل مدور بأقاصي بلاد الصين له سبعة أبواب في داخله قبة مسبعة في أعاليها شبه جوهرة يزيد على رأس العجل تضيء منه جميع أقطار الهيكل، حاول جماعة من الملوك أخذها فلم يدن أحد منها على مقدار عشرة أذرع الحرميتين إلا انعكست الآلات وعطلت ومن تعرض لهدم الهيكل مات، وعند جماعة من أهل الخبرة أن ذلك لقوة دافعة منفردة من أنواع الأحجار المغناطيسية، وفي الهيكل بئر مسبعة الرأس على رأسها طوق مكتوب بقلم يشبه المسند هذه بئر تؤدي إلى مخزن الكتب وتاريخ الدنيا وعلوم السماء {cite:muruj-al-dhahab p. 548}."
  en: "The wondrous round temple of farthest China — seven gates, a seven-sided dome, a magnetic jewel no king could approach within twenty cubits, and a seven-mouthed well whose rim promised in musnad-like script descent to 'the treasury of books, the history of the world and the sciences of heaven' {cite:muruj-al-dhahab p. 548}."
  es: "El maravilloso templo redondo de la más lejana China: siete puertas, una cúpula de siete lados, una joya magnética a la que ningún rey podía acercarse en menos de veinte codos, y un pozo de siete bocas cuyo borde prometía, en una escritura similar al musnad, el descenso al \"tesoro de los libros, la historia del mundo y las ciencias del cielo\" {cite:muruj-al-dhahab p. 548}."
  fr: "Le merveilleux temple rond de la Chine la plus lointaine — sept portes, un dôme à sept côtés, un joyau magnétique qu'aucun roi ne pouvait approcher à moins de vingt coudées, et un puits à sept bouches dont le bord promettait dans une écriture semblable au musnad la descente vers « le trésor des livres, l'histoire du monde et les sciences du ciel » {cite: muruj-al-dhahab p. 548}."
  ur: "دور دراز چین کا عجوبہ گول مندر - سات دروازے، ایک سات رخا گنبد، ایک مقناطیسی زیور جس کا کوئی بادشاہ بیس ہاتھ کے اندر نہیں جا سکتا تھا، اور سات منہ والا کنواں جس کے کنارے مسند نما رسم الخط میں 'کتابوں کے خزانے، تاریخ عالم اور ہیئت کے علوم' تک پہنچنے کا وعدہ کیا گیا تھا۔ 548}۔"
  tr: "Çin'in uzak köşelerinde, yedi kapılı, içinde buzağının başının üzerinde yükselen yarım mücevherle taçlandırılmış penta şeklinde bir kubbe bulunan yuvarlak bir tapınak tapınağı vardır; tapınağın tüm yanlarını aydınlatmaktadır. Bir grup kral tapınağı almaya çalıştı, ancak iki haremite yaklaşık on arşına yaklaşamadı; makineler onları devrip devre dışı bıraktı ve tapınağın yıkımından zarar görenler öldü. Bazı uzmanlara göre, bunun nedeni manyetik taş türünden gelen tek bir itici güçtü. Tapınakta, masad benzeri bir kalemle yazılmış bir yaka bulunan yedi başlı bir kuyu vardır. Bu kuyu kitapların, dünyanın tarihinin ve gökyüzü bilimlerinin depolanmasına yol açar {cite:muruj-al-dhahab s. 548}."
  id: "Sebuah kuil bundar di ujung Tiongkok dengan tujuh pintu, di dalamnya terdapat kubah berbentuk penta yang di atasnya terdapat semi-permata yang menjulang di atas kepala anak sapi, menerangi semua sisi kuil. Sekelompok raja mencoba merebutnya, tetapi tidak ada yang mendekati sekitar sepuluh hasta dari dua haremites kecuali mesin-mesin itu membalikkan dan melumpuhkan mereka, dan mereka yang mengalami kehancuran kuil meninggal. Menurut beberapa ahli, ini disebabkan oleh satu gaya penggerak dari jenis batu magnetik. Di dalam kuil terdapat sebuah sumur berkepala tujuh yang di atasnya dihiasi kerah yang ditulis dengan pena menyerupai masad. Sumur ini mengarah ke penyimpanan buku, sejarah dunia, dan ilmu langit {cite:muruj-al-dhahab hlm. 548}."
