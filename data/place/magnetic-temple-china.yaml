label: { ar: "هيكل الصين المدور", en: "The round temple of farthest China" }
summary:
  ar: "هيكل مدور بأقاصي بلاد الصين له سبعة أبواب في داخله قبة مسبعة في أعاليها شبه جوهرة يزيد على رأس العجل تضيء منه جميع أقطار الهيكل، حاول جماعة من الملوك أخذها فلم يدن أحد منها على مقدار عشرة أذرع الحرميتين إلا انعكست الآلات وعطلت ومن تعرض لهدم الهيكل مات، وعند جماعة من أهل الخبرة أن ذلك لقوة دافعة منفردة من أنواع الأحجار المغناطيسية، وفي الهيكل بئر مسبعة الرأس على رأسها طوق مكتوب بقلم يشبه المسند هذه بئر تؤدي إلى مخزن الكتب وتاريخ الدنيا وعلوم السماء {cite:muruj-al-dhahab p. 548}."
  en: "The wondrous round temple of farthest China — seven gates, a seven-sided dome, a magnetic jewel no king could approach within twenty cubits, and a seven-mouthed well whose rim promised in musnad-like script descent to 'the treasury of books, the history of the world and the sciences of heaven' {cite:muruj-al-dhahab p. 548}."
