  ur: "پہاڑوں اور گھاٹیوں کے درمیان ایک قصبہ جس کا داخلی دروازہ سخت ہے۔ زرخیز، پانی اور پھلوں سے مالا مال، قرت سے اٹھارہ میل کے فاصلے پر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 531}"
