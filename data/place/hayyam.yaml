  es: "Una ciudad a orillas del río Ruda, en las tierras de los Ghuzz, a siete días del lago, con Jajan al norte; al-Idrisi la describe como pequeña y muy fortificada. {cite:nuzhat-al-mushtaq-2002 p. 838}"
  fr: "Une ville située sur la rivière Ruda, au pays des Ghuzz, à sept jours du lac, avec Jajan au nord; al-Idrisi la décrit comme petite et très fortement fortifiée. {cite:nuzhat-al-mushtaq-2002 p. 838}"
