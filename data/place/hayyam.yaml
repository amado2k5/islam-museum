  ar: "مدينة على نهر روذا، في بلاد الأغزاز، بينها وبين البحيرة سبعة أيام، ومدينة جاجان بشمالها، ويذكر الإدريسي أنها صغيرة في نهاية من الحصانة. {cite:nuzhat-al-mushtaq-2002 p. 838}"
