summary:
  ar: "وادٍ من ناحية بدر، بلغه النبي في ربيع الأول سنة 2هـ يطارد كرز بن جابر الفهري الذي أغار على مراعي المدينة، فلم يدركه."
  en: "A valley in the Badr district; the Prophet reached it in Rabi' al-Awwal of 2 AH, pursuing Kurz ibn Jabir al-Fihri, who had raided Medina's pastures, but did not catch him."
  es: "Un valle en el distrito de Badr; el Profeta llegó a él en Rabi' al-Awwal del año 2 de la Hégira, persiguiendo a Kurz ibn Jabir al-Fihri, que había asaltado los pastos de Medina, pero no logró atraparlo."
  fr: "Une vallée du district de Badr; le Prophète l'atteignit en Rabi' al-Awwal de l'an 2 de l'Hégire, poursuivant Kurz ibn Jabir al-Fihri, qui avait pillé les pâturages de Médine, mais ne parvint pas à le rattraper."
  ur: "ضلع بدر کی ایک وادی؛ رسول اللہ 2 ہجری کے ربیع الاول میں کرز بن جابر الفہری کا تعاقب کرتے ہوئے اس تک پہنچے، جس نے مدینہ کی چراگاہوں پر چھاپہ مارا تھا، لیکن اسے پکڑا نہیں تھا۔"
  tr: "Badr yakınlarındaki bir vadide, Peygamber, 2 Hicri yılının Rabi'al-Awwal'ında ona ulaştı; Karz ibn Cabir el-Fihri'yi takip etti; Karz bin Cabir el-Fihri, şehrin otlaklarına baskın yaptı ama ona ulaşamadı."
  id: "Di sebuah lembah dekat Badr, Nabi sampai kepadanya pada Rabi' al-Awwal tahun 2 H, mengejar Karz ibn Jabir al-Fihri, yang menyerang padang rumput kota tetapi tidak sampai kepadanya."
