summary:
  ar: "جامع عظيم لا يشبهه مسجد من مساجد المسلمين، طوله مائة باع وعرضه نحو ثمانين، فيه ألف سارية وأكثر، وقبلته مزينة بالفص المذهب والملون، وبه منبر ومحراب وقبة، ويصفه الإدريسي تفصيلاً. {cite:nuzhat-al-mushtaq-2002 p. 575}"
  en: "A great mosque unlike any other among the mosques of the Muslims, about a hundred bay long and eighty wide, with more than a thousand columns; its qibla is decorated with gilded and coloured glass, with a pulpit, mihrab and dome, which al-Idrisi describes in detail. {cite:nuzhat-al-mushtaq-2002 p. 575}"
