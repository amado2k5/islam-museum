label: { ar: "الجامع الأعظم بقرطبة", en: "Great Mosque of Cordoba", es: "Gran Mezquita de Córdoba", fr: "Grande Mosquée de Cordoue" }
summary:
  ar: "جامع عظيم لا يشبهه مسجد من مساجد المسلمين، طوله مائة باع وعرضه نحو ثمانين، فيه ألف سارية وأكثر، وقبلته مزينة بالفص المذهب والملون، وبه منبر ومحراب وقبة، ويصفه الإدريسي تفصيلاً. {cite:nuzhat-al-mushtaq-2002 p. 575}"
  en: "A great mosque unlike any other among the mosques of the Muslims, about a hundred bay long and eighty wide, with more than a thousand columns; its qibla is decorated with gilded and coloured glass, with a pulpit, mihrab and dome, which al-Idrisi describes in detail. {cite:nuzhat-al-mushtaq-2002 p. 575}"
  es: "Una gran mezquita, única entre las mezquitas musulmanas, de aproximadamente cien naves de largo y ochenta de ancho, con más de mil columnas; su qibla está decorada con vidrieras doradas y de colores, y cuenta con púlpito, mihrab y cúpula, que al-Idrisi describe con detalle. {cite:nuzhat-al-mushtaq-2002 p. 575}"
  fr: "Une grande mosquée sans pareille parmi les mosquées musulmanes, d'une centaine de travées de long et quatre-vingts de large, avec plus de mille colonnes; sa qibla est ornée de vitraux dorés et colorés, et elle possède une chaire, un mihrab et un dôme, qu'al-Idrisi décrit en détail. {cite:nuzhat-al-mushtaq-2002 p. 575}"
