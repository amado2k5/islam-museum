label:
  ar: "العمق (سهل شمال سورية)"
  en: "Al-'Amk (plain of Antioch)"
summary:
  ar: "سهل فيضي واسع في شمال سورية، شمال شرق أنطاكية، في الانخفاض التكتوني بين جبال الأمانوس وكرد داغ، يغمر جزءًا كبيرًا منه بحيرة وأحراش، عُرف بأنه ممر إقليمي للمواصلات بين أنطاكية وحلب، وكانت له مواقع في الحروب البيزنطية والإسلامية والصليبية {cite:encyclopaedia-of-islam-2 vol. 1 p. 468-469}."
  en: "A large alluvial plain of northern Syria, north-east of Antioch, lying in the tectonic depression between the Amanus and the Kurd Dagh. Much of it is covered by a marshy lake, and it was a corridor for the routes between Antioch and Aleppo, and a frontier zone between Arabs, Byzantines and Crusaders {cite:encyclopaedia-of-islam-2 vol. 1 p. 468-469}."
