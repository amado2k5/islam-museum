summary:
  ar: "مدينة على بحيرة تنسب إليها، ولها طراز لعمل ثياب الحرير، وتجار الترك يتجهزون منها بالكثير، وتبعد عن قرنطية ست مراحل. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  en: "A city on the lake named after it, with a workshop for silk garments; Turkish merchants buy much there; six stages from Qarantiyya. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  es: "Una ciudad a orillas del lago que lleva su nombre, con un taller de confección de prendas de seda; los comerciantes turcos compran mucho allí; a seis etapas de Qarantiyya. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  fr: "Une ville lacustre portant son nom, avec un atelier de confection de vêtements en soie; les marchands turcs y font de nombreux achats; à six étapes de Qarantiyya. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  ur: "جھیل پر ایک شہر جس کا نام اس کے نام پر رکھا گیا ہے، جس میں ریشمی کپڑوں کی ورکشاپ ہے۔ ترکی کے تاجر وہاں بہت کچھ خریدتے ہیں۔ قرنطیہ سے چھ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 708}"
  tr: "Adını taşıyan bir göl kenarında bir şehir, ipek giysiler tarzı ve Türk tüccarlar bunlardan çok üretir. Kurantı'ya altı adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 708}"
  id: "Sebuah kota di tepi danau yang dinamai menurut nama itu, dengan gaya pakaian sutra, dan para pedagang Turki memproduksi banyak di antaranya. Kota ini berjarak enam langkah dari Qurantiya. {cite:nuzhat-al-mushtaq-2002 hlm. 708}"
