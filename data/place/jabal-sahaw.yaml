summary:
  ar: "جبل من أعلى الجبال وأصعبها مسلكاً، يبعد عن كلديس ثمانية أميال، لا تتعداه العرب إلى غيره. {cite:nuzhat-al-mushtaq-2002 p. 267}"
  en: "Among the highest and steepest mountains, eight miles from Kaldis; the Arabs do not cross beyond it. {cite:nuzhat-al-mushtaq-2002 p. 267}"
  es: "Entre las montañas más altas y escarpadas, a ocho millas de Kaldis; los árabes no la cruzan. {cite:nuzhat-al-mushtaq-2002 p. 267}"
  fr: "Parmi les montagnes les plus hautes et les plus escarpées, à huit milles de Kaldis; les Arabes ne vont pas au-delà. {cite:nuzhat-al-mushtaq-2002 p. 267}"
  ur: "کالدیس سے آٹھ میل کے فاصلے پر سب سے اونچے اور سب سے اونچے پہاڑوں میں سے عرب اس سے آگے نہیں بڑھتے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 267}"
  tr: "Clyde'a sekiz mil uzaklıkta, Arapların başka hiçbir yerde aşılamadığı en yüksek ve tırmanılması en zor dağlardan biridir. {kaynak:nuzhat-al-mushtaq-2002 s. 267}"
  id: "Sebuah gunung di antara yang tertinggi dan paling sulit didaki, terletak delapan mil dari Clydes, yang tidak bisa dilampaui oleh orang Arab di tempat lain. {cite:nuzhat-al-mushtaq-2002 hlm. 267}"
