summary:
  ar: "مدينة عامرة على نهر البحر، تنسب إلى أرض طبست، ويذكر المؤلف أنها تبعد مائة ميل عن موقع الذراع الثاني من نهر قطولو {cite:nuzhat-al-mushtaq-2002 p. 953}."
  en: "A populous city on a sea-river, attributed to the land of Tabst; the author gives one hundred miles from the second arm of the Qatulu river {cite:nuzhat-al-mushtaq-2002 p. 953}."
  es: "Una ciudad populosa en un río marino, atribuida a la tierra de Tabst; el autor la sitúa a cien millas del segundo brazo del río Qatulu {cite:nuzhat-al-mushtaq-2002 p. 953}."
  fr: "Une ville populeuse sur un fleuve maritime, attribuée au pays de Tabst; l'auteur donne cent milles du deuxième bras du fleuve Qatulu {cite:nuzhat-al-mushtaq-2002 p. 953}."
  ur: "ایک سمندری دریا پر ایک آبادی والا شہر، جو تبست کی سرزمین سے منسوب ہے۔ مصنف دریائے قطولو کے دوسرے بازو سے ایک سو میل کا فاصلہ بتاتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ 953}۔"
  tr: "Deniz nehri üzerinde gelişen bir şehir olan ve Tabestt topraklarına atfedilen bu şehir, Katulu Nehri'nin ikinci kolunun bulunduğu yerden yüz mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 953}."
  id: "Sebuah kota yang berkembang di tepi sungai laut, yang dikaitkan dengan tanah Tabestt, penulis menyebutkan bahwa kota ini berjarak seratus mil dari lokasi cabang kedua Sungai Qatulu {cite:Nuzhat-al-mushtaq-2002, hlm. 953}."
