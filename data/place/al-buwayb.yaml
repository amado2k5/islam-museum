summary:
  ar: "موضع قرب جسر الفرات؛ عند البلاذري قتل به مهران بن مهربنداذ سنة أربع عشرة ويقال إن جنبتيه امتلأتا عظاماً حتى استوى وعفا عليها التراب زمن الفتنة وكان ما بين السكون وبني سليم مغيضاً للفرات زمن الأكاسرة يصب في الجوف."
  en: "Site near the Euphrates bridge where Mihran ibn Mihrbandadh was killed in year 14; its flanks are said to have filled with bones till dust covered them in the civil-war time, the stretch between al-Sakun and Banu Sulaym having been the Euphrates' outflow into al-Jawf under the Khasraws."
  es: "Lugar cercano al puente del Éufrates donde Mihran ibn Mihrbandadh fue asesinado en el año 14; se dice que sus flancos se llenaron de huesos hasta que el polvo los cubrió durante la guerra civil, ya que el tramo entre al-Sakun y Banu Sulaym era la salida del Éufrates hacia al-Jawf bajo el dominio de los Khasraw."
  fr: "Site près du pont de l'Euphrate où Mihran ibn Mihrbandadh fut tué en l'an 14; ses flancs auraient été remplis d'ossements jusqu'à ce que la poussière les recouvre pendant la guerre civile, la portion entre al-Sakun et Banu Sulaym étant l'exutoire de l'Euphrate vers al-Jawf sous les Khasraws."
  ur: "فرات کے پل کے قریب جگہ جہاں مہران بن مہربندھ کو سال 14 میں قتل کیا گیا تھا۔ کہا جاتا ہے کہ اس کے کنارے ہڈیوں سے بھر گئے تھے یہاں تک کہ خانہ جنگی کے زمانے میں خاک ان پر چھائی ہوئی تھی، السقون اور بنو سلیم کے درمیان کا علاقہ خسرو کے تحت الجوف میں فرات کا بہاؤ تھا۔"
  tr: "Fırat Köprüsü yakınlarındaki bir yer; Al-Baladhuri'ye göre, Mihran ibn Mehrbandadh on dördüncü yılda öldürülmüştür. Kısaca yanlarının kemiklerle dolduğu, fitne zamanında ise toprakla üzerlerinin üzerine geldiği söylenir. Al-Sukun ile Banu Sulaym arasındaki bölge, Akasra zamanında Fırat nehri olup Al-Jawf'a dökülmüştür."
  id: "Sebuah tempat dekat Jembatan Efrat; menurut Al-Baladhuri, Mihran ibn Mehrbandadh dibunuh pada tahun empat belas. Konon sisi Sungai itu dipenuhi tulang hingga menjadi stabil, dan tanah menutupi mereka pada masa fitnah. Wilayah antara Al-Sukun dan Banu Sulaym adalah sungai Efrat pada masa Akasra, mengalir ke Al-Jawf."
