  ar: "موضع قرب جسر الفرات؛ عند البلاذري قتل به مهران بن مهربنداذ سنة أربع عشرة ويقال إن جنبتيه امتلأتا عظاماً حتى استوى وعفا عليها التراب زمن الفتنة وكان ما بين السكون وبني سليم مغيضاً للفرات زمن الأكاسرة يصب في الجوف."
  en: "Site near the Euphrates bridge where Mihran ibn Mihrbandadh was killed in year 14; its flanks are said to have filled with bones till dust covered them in the civil-war time, the stretch between al-Sakun and Banu Sulaym having been the Euphrates' outflow into al-Jawf under the Khasraws."
