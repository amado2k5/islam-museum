  fr: "Une ville située à l'ouest-sud-ouest de Gharghun, à plusieurs étapes de là, au pays des Ghuzz; Dhahlan se trouve à proximité, selon le récit d'al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 841}"
  ur: "غرغون کے مغرب-جنوب مغرب میں ایک قصبہ، غز کی زمینوں میں کئی مراحل کے فاصلے پر؛ الادریسی کے بیان میں دحلان اس کے قریب واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 841}"
