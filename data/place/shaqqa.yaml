summary:
  ar: "بلدة على ساحل البحر مشرفة فرجة الأرجاء، وهي في هذا الزمان أم الأقاليم التي يقصدها الناس، ويسافر إليها من إفريقية وأطراف الجزيرة. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  en: "A town on the sea coast with wide open ground, which in al-Idrisi's time was the mother of the districts, visited by travellers from Ifriqiya and the island's edges. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  es: "Una ciudad costera con amplias llanuras, que en tiempos de al-Idrisi era la cuna de los distritos, visitada por viajeros procedentes de Ifriqiya y los confines de la isla. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  fr: "Une ville côtière aux vastes plaines, qui, à l'époque d'al-Idrisi, était la mère des districts, visitée par les voyageurs venus d'Ifriqiya et des confins de l'île. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  ur: "وسیع کھلی زمین کے ساتھ سمندر کے ساحل پر ایک قصبہ، جو الادریسی کے زمانے میں اضلاع کی ماں تھا، جس کا دورہ عفریقیہ اور جزیرے کے کناروں سے آنے والے مسافر کرتے تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 600}"
  tr: "Sahilde yer alan ve çevresine bakan bir kasaba olan bu kasaba, şu anda insanların Ifriqiya ve adanın kenarlarından ziyaret ettiği ve seyahat ettiği bölgelerin anasıdır. {kaynak:nuzhat-al-mushtaq-2002 s. 600}"
  id: "Sebuah kota di tepi laut yang menghadap sekitar, saat ini menjadi ibu dari wilayah yang dikunjungi dan dikunjungi orang dari Ifriqiya dan pinggiran pulau. {cite:nuzhat-al-mushtaq-2002 hlm. 600}"
