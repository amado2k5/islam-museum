summary:
  ar: "مدينة صغيرة يذكر الإدريسي أنها مدينة أصحاب الكهف، وبالقرب منها كهف في جبل له مرب من وجه الأرض كالمدارج، وفيه موتى رقود على جنوبهم، وتبعد عن عمورية وعن نيقية. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  en: "A small town which al-Idrisi names as the town of the People of the Cave; near it is a cave in a mountain, with a stepped approach, where the sleepers lie on their sides; between Amorium and Nicaea. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  es: "Un pequeño pueblo que al-Idrisi denomina el pueblo de la gente de la cueva; cerca de él hay una cueva en una montaña, con un acceso escalonado, donde los durmientes yacen de lado; entre Amorium y Nicea. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  fr: "Une petite ville qu'al-Idrisi nomme la ville des Gens de la Caverne; près d'elle se trouve une grotte dans une montagne, avec un accès par gradins, où les dormeurs reposent sur le côté; entre Amorium et Nicée. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  ur: "ایک چھوٹا سا قصبہ جسے ادریسی اہلِ غار کا قصبہ کہتے ہیں۔ اس کے قریب ایک پہاڑی میں ایک غار ہے، جس میں ایک قدم بڑھا ہوا ہے، جہاں سونے والے اپنے اطراف میں لیٹتے ہیں۔ Amorium اور Nicaea کے درمیان۔ {حوالہ: نزہت المشتاق-2002 ص۔ 802}"
  tr: "El-İdrisi tarafından Mağara Halkı'nın şehri olarak bahsedilen, yakınında teraslı bir dağın içinde bir mağara bulunan ve Amorite ile İznik'ten uzakta, güneylerinde ölü insanların yattığı küçük bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 802}"
  id: "Sebuah kota kecil yang disebut oleh al-Idrisi sebagai kota Orang-orang Gua, di dekatnya terdapat sebuah gua di sebuah gunung dengan lereng seperti teras, dan di dalamnya terdapat mayat yang terbaring di selatan, jauh dari Amori dan Nicaea. {cite:Nuzhat-al-Mushtaq-2002 hlm. 802}"
