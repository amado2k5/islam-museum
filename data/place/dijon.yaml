  ur: "لنکا سے تقریباً ستر میل کے فاصلے پر بہت سے ذریعہ معاش اور رزق کے ساتھ اچھی زمین کا ایک بابرکت شہر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 743}"
  tr: "Kutsanmış bölgede, bol geçim kaynakları ve geçim kaynaklarına sahip, Lanka'ya yaklaşık yetmiş mil uzaklıkta bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 743}"
  id: "Sebuah kota di wilayah yang diberkati, dengan mata pencaharian dan mata pencaharian yang melimpah, sekitar tujuh puluh mil dari Lanka. {cite:Nuzhat-al-Mushtaq-2002 hlm. 743}"
