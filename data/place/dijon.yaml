summary:
  ar: "مدينة في الرقعة مباركة البقعة، ذات معايش وأرزاق كثيرة، وتبعد عن لنكة نحو سبعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 743}"
  en: "A blessed city of good ground with many livelihoods and provisions, about seventy miles from Lanka. {cite:nuzhat-al-mushtaq-2002 p. 743}"
