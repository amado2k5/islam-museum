  fr: "Une île face à Dénia, de l'autre côté de la mer, avec une petite ville charmante, et à une distance d'un canal des côtes de Barcelone. {cite: Nuzhat-al-Mushtaq-2002 p. 582}"
  ur: "ایک جزیرہ جس کا سامنا ڈینیا سمندر کے اس پار ہے، جس میں ایک چھوٹا سا عمدہ شہر ہے، اور بارسلونا کے ساحل سے ایک چینل کا فاصلہ ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 582}"
