summary:
  ar: "مدينة عامرة على البحر، كثيرة الديار والكروم والحروث، ويذكر المؤلف أن بينها وبين موقع نهر رين غربا ثمانين ميلا {cite:nuzhat-al-mushtaq-2002 p. 879}."
  en: "A populous city on the sea, with many houses, vineyards and fields; the author gives eighty miles west to the place where the Rhine lies {cite:nuzhat-al-mushtaq-2002 p. 879}."
  es: "Una ciudad populosa a orillas del mar, con muchas casas, viñedos y campos; el autor sitúa ochenta millas al oeste del lugar donde discurre el Rin {cite:nuzhat-al-mushtaq-2002 p. 879}."
  fr: "Une ville populeuse en bord de mer, avec de nombreuses maisons, des vignobles et des champs; l'auteur indique quatre-vingts milles à l'ouest jusqu'à l'endroit où se trouve le Rhin {cite:nuzhat-al-mushtaq-2002 p. 879}."
  ur: "سمندر پر ایک آبادی والا شہر، جس میں بہت سے گھر، انگور کے باغ اور کھیت ہیں۔ مصنف نے اس جگہ کو مغرب میں اسّی میل کا فاصلہ دیا ہے جہاں رائن واقع ہے {حوالہ: نزہت المشتاق-2002 ص 879}۔"
  tr: "Deniz kenarında gelişen, evler, bağlar ve tarlalarla dolu bir şehir. Yazar, şehrin Rennes Nehri'nin seksen mil batısında olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 879}."
  id: "Sebuah kota yang makmur di tepi laut, penuh dengan rumah, kebun anggur, dan ladang. Penulis menyebutkan bahwa kota ini terletak delapan puluh mil di sebelah barat Sungai Rennes {cite:Nuzhat-al-mushtaq-2002, hlm. 879}."
