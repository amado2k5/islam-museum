summary:
  ar: "مدينة حسنة ظاهرة العمارة على الضفة الغربية لنهر رين، ذات كروم وشجر ومواش، متاخمة لأرض إفريزية، وأهلها أهل عزة وجلادة {cite:nuzhat-al-mushtaq-2002 p. 873}."
  en: "A fine city with visible buildings on the western bank of the Rhine, with vineyards, trees and livestock, bordering the land of the Frisians; the author describes its people as proud and resolute {cite:nuzhat-al-mushtaq-2002 p. 873}."
  es: "Una hermosa ciudad con edificios visibles en la orilla occidental del Rin, con viñedos, árboles y ganado, que limita con la tierra de los frisones; el autor describe a su gente como orgullosa y resuelta {cite:nuzhat-al-mushtaq-2002 p. 873}."
  fr: "Une belle ville avec des bâtiments visibles sur la rive ouest du Rhin, avec des vignobles, des arbres et du bétail, bordant le pays des Frisons; l'auteur décrit ses habitants comme fiers et résolus {cite:nuzhat-al-mushtaq-2002 p. 873}."
  ur: "رائن کے مغربی کنارے پر نظر آنے والی عمارتوں کے ساتھ ایک عمدہ شہر، انگور کے باغ، درخت اور مویشی، فریسیوں کی سرزمین سے متصل۔ مصنف اپنے لوگوں کو قابل فخر اور پرعزم قرار دیتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ 873}۔"
  tr: "Rennes Nehri'nin batı kıyısında, bağları, ağaçları ve hayvanlarıyla birlikte, friz arazisine bitişik, mimari bir olgu olan güzel bir şehir ve halkı gurur duyuyor {cite:nuzhat-al-mushtaq-2002, s. 873}."
  id: "Sebuah kota yang indah, fenomena arsitektur di tepi barat Sungai Rennes, dengan kebun anggur, pohon, dan ternak, berdekatan dengan tanah frieze, dan penduduknya bangga dan bangga {cite:nuzhat-al-mushtaq-2002, hlm. 873}."
