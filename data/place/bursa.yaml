  ur: "اناطولیہ کا شہر، قدیم پروسا، میسیائی اولمپس کی شمالی تلہٹیوں پر؛ عثمانیوں نے 6 اپریل 1326ء کو فتح کیا اور 1402ء تک ان کا مرکزی دارالحکومت رہا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397-1398}۔"
