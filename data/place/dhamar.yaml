summary:
  ar: "مدينة في اليمن على بعد ثمانية وأربعين ميلاً من صنعاء، وتقع على طريق الوادي الذي يمر بها نازلاً، ويزرع فيها الورس، وهو نبات أصفر يشبه الزعفران {cite:nuzhat-al-mushtaq-2002 p. 53}."
  en: "A city in Yemen forty-eight miles from Sanaa, on the valley road that runs past it. The wars plant, a yellow dye plant resembling saffron, is grown there {cite:nuzhat-al-mushtaq-2002 p. 53}."
  es: "Una ciudad en Yemen, a setenta y siete kilómetros de Saná, en la carretera del valle que la bordea. Allí se cultiva la planta de wars, una planta tintórea amarilla parecida al azafrán {cite:nuzhat-al-mushtaq-2002 p. 53}."
  fr: "Une ville du Yémen, à soixante-dix-sept kilomètres de Sanaa, sur la route de la vallée qui la longe. On y cultive le wars, une plante tinctoriale jaune ressemblant au safran {cite:nuzhat-al-mushtaq-2002 p. 53}."
  ur: "یمن کا ایک شہر صنعا سے اڑتالیس میل کے فاصلے پر، وادی کی سڑک پر ہے جو اس سے گزرتی ہے۔ جنگ کا پودا، زعفران سے مشابہ ایک پیلے رنگ کا پودا، وہاں اگایا جاتا ہے۔ 53}۔"
  tr: "Yemen'de, Sana'a'ya kırk sekiz mil uzaklıkta, vadi yolunun üzerinden inen ve al-wars yetiştiren bir şehir; bu bitki safrana benzeyen sarı bir bitki {cite:nuzhat-al-mushtaq-2002, s. 53}."
  id: "Sebuah kota di Yaman yang terletak empat puluh delapan mil dari Sana'a, terletak di jalan lembah yang melintasinya dan menumbuhkan al-wars, tanaman kuning yang menyerupai saffron {cite:nuzhat-al-mushtaq-2002, hlm. 53}."
