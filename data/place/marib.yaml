label: { en: "Maʾrib", ar: "مأرب" }
summary:
  en: "The second Sabaean capital after Sirwah, seat of the famous dam; its ruins lie about sixty miles east of Sanaa, and its flood is the Quranic Sayl al-Arim."
  ar: "العاصمة الثانية لمملكة سبأ بعد صرواح ومركز سدّها المشهور؛ أنقاضها على نحو ستين ميلاً شرقي صنعاء، وثلمتها الكبرى هي سيل العرم القرآني.، وعند المسعودي أن مأرب سمة للملك الذي كان يتملك على هذه البلدة فوقع الاسم على البلد فاشتهر به وقيل سمة لقصر الملك في صدر الزمن، وبناه لقمان الأكبر سداً فرسخاً في فرسخ تخرج مياهه من مخراق حجر وحديد فيه ثلاثون نقباً إلى الجنان، وقال الأعشى وفي ذاك للمؤتسي أسوة بمأرب عفى عليها العرم {cite:muruj-al-dhahab p. 489-492}"
