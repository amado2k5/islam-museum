summary:
  en: "The second Sabaean capital after Sirwah, seat of the famous dam; its ruins lie about sixty miles east of Sanaa, and its flood is the Quranic Sayl al-Arim."
  ar: "العاصمة الثانية لمملكة سبأ بعد صرواح ومركز سدّها المشهور؛ أنقاضها على نحو ستين ميلاً شرقي صنعاء، وثلمتها الكبرى هي سيل العرم القرآني. وعند المسعودي أن مأرب سمة للملك الذي كان يتملك على هذه البلدة فوقع الاسم على البلد فاشتهر به وقيل سمة لقصر الملك في صدر الزمن، وبناه لقمان الأكبر سداً فرسخاً في فرسخ تخرج مياهه من مخراق حجر وحديد فيه ثلاثون نقباً إلى الجنان، وقال الأعشى وفي ذاك للمؤتسي أسوة بمأرب عفى عليها العرم {cite:muruj-al-dhahab p. 489-492}"
  es: "La segunda capital sabea después de Sirwah, sede de la famosa presa; sus ruinas se encuentran a unos sesenta kilómetros al este de Sanaa, y su inundación es el Sayl al-Arim del Corán."
  fr: "La deuxième capitale sabéenne après Sirwah, siège du célèbre barrage; ses ruines se trouvent à environ soixante miles à l'est de Sanaa, et son inondation est le Sayl al-Arim coranique."
  ur: "سیرواہ کے بعد دوسرا سبائی دارالحکومت، مشہور ڈیم کی نشست؛ اس کے کھنڈرات صنعاء سے تقریباً ساٹھ میل مشرق میں ہیں اور اس کا سیلاب قرآنی سائل العریم ہے۔"
  tr: "Saba Krallığı'nın Sirwah'dan sonra ikinci başkenti ve ünlü barajının merkezidir; kalıntıları Sana'a'nın yaklaşık altmış mil doğusunda yer alır ve en büyük çukuru Kur'an'daki 'Arm' selidir. Al-Mas'udi'ye göre, Merib bu kasabayı yöneten kralın bir simgesidir, bu yüzden adı bu isimle ünlü olmuştur ve erken zamanlarda kralın sarayının bir özelliği olduğu söylenir. Büyük Luqman, burayı bir Farsakh barajı olarak inşa etmiştir; suları cennete açılan otuz tünelli taş ve demir bir boşluktan akar. Al-A'sha şöyle demiştir: Al-Mu'tasi, Al-'Aram tarafından affedilen Merip gibidir {atıf:Muruj-al-Dhahab, s. 489-492}"
  id: "Ibu kota kedua Kerajaan Saba setelah Sirwah dan pusat bendungan terkenalnya; reruntuhannya terletak sekitar enam puluh mil sebelah timur Sana'a, dan depresi utamanya adalah banjir Al-Qur'an 'Arm. Menurut Al-Mas'udi, Marib adalah simbol raja yang memerintah kota ini, sehingga nama ini menjadi terkenal karenanya, dan dikatakan sebagai ciri istana raja pada masa dahulu. Luqman yang Agung membangunnya sebagai bendungan farsakh di farsakh, yang airnya mengalir dari rongga batu dan besi dengan tiga puluh terowongan menuju surga. Al-A'sha berkata tentang ini: Al-Mu'tasi seperti Marib, yang diampuni oleh Al-'Aram {cite:Muruj-al-Dhahab, hlm. 489-492}"
