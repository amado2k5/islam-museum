summary:
  ar: "بلدة من عمل أصبهان؛ بها قبور الندماء الثلاثة من أهل الكوفة ممن كانوا في جيش الحجاج إلى الديلم كانوا يتنادمون فماتوا واحداً بعد واحد ودفن كل إلى صاحبه وقال أحدهم: ألم تعلما أني براوند مفردا."
  en: "A town of Isbahan's district; there lie the Graves of the Boon-Companions — three Kufans of al-Hajjaj's Daylam army who drank together, died one by one, each buried beside his friend, the last singing 'know you not that I am alone at Rawand'."
  es: "Un pueblo del distrito de Isbahan; allí yacen las tumbas de los Compañeros de la Bendición: tres kufanos del ejército Daylam de al-Hajjaj que bebieron juntos, murieron uno a uno, cada uno enterrado junto a su amigo, el último cantando '¿Acaso no sabéis que estoy solo en Rawand?'."
  fr: "Une ville du district d'Isbahan; là reposent les tombes des Compagnons de la Bénédiction — trois Koufans de l'armée Daylam d'al-Hajjaj qui buvaient ensemble, moururent l'un après l'autre, chacun enterré à côté de son ami, le dernier chantant « ne savez-vous pas que je suis seul à Rawand »."
  ur: "اسبہان کے ضلع کا ایک قصبہ؛ وہاں بون صحابہ کی قبریں پڑی ہیں - الحجاج کی دیلم فوج کے تین کوفان جنہوں نے ایک ساتھ پیا، ایک ایک کر کے مر گئے، ہر ایک کو اپنے دوست کے پاس دفن کیا گیا، آخری گانا 'تم نہیں جانتے کہ میں راوند میں اکیلا ہوں'۔"
  tr: "İsfahan'ın eseri bir kasaba; Daylam'a gelen hacılar ordusunda yer alan Kufa'dan üç Nadma'nın mezarlarını barındırır. Pişman oldular ve birbiri ardına öldüler, her biri yoldaşına gömüldü. Birisi dedi ki: Ben sadece Brawand olduğumu bilmiyor muydunuz?"
  id: "Sebuah kota dari karya Isfahan; di sana terdapat makam tiga Nadma' dari Kufa yang berada dalam pasukan peziarah ke Daylam. Mereka menyesal, dan mereka meninggal satu per satu, masing-masing dimakamkan kepada temannya. Salah satu dari mereka berkata: Apakah kau tidak tahu bahwa aku adalah Brawand sendirian?"
