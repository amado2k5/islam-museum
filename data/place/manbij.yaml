summary:
  ar: "منبج من أعمال جند قنسرين على ناحية دلوك ورعبان؛ قدّم إليها إياد بن غنم فصالح أهلها على مثل صلح أنطاكية وأنفذ أبو عبيدة ذلك، وبعث إياد إلى دلوك ورعبان فصالحه أهلها على مثل صلح منبج واشترط عليهم أن يبحثوا عن أخبار الروم ويكاتبوا بها المسلمين؛ وقربها قرية جسر منبج ولم يكن الجسر يومئذ إنما اتخذ في خلافة عثمان بن عفان للصوائف ويقال بل كان له رسم قديم؛ وولّى أبو عبيدة كل كورة فتحها عاملاً وضم إليه جماعة من المسلمين وشحن النواحي المخوفة."
  en: "Manbij of the Qinnasrin jund in the Duluk–Ra'ban quarter; Iyad ibn Ghanm went before it and its people compounded on Antioch's terms, which Abu Ubayda ratified, and Iyad was sent on to Duluk and Ra'ban whose people compounded on Manbij's terms with the stipulation that they seek out news of the Byzantines and write it to the Muslims; near it stands the village of Jisr Manbij — no bridge existing then, made in Uthman's caliphate for the summer expeditions, or by some report of ancient trace; Abu Ubayda set over every kura he took an administrator joined to a Muslim garrison, provisioning the exposed quarters."
  es: "Manbij del distrito de Qinnasrin en el barrio de Duluk-Ra'ban; Iyad ibn Ghanm fue antes y su gente aceptó los términos de Antioquía, que Abu Ubayda ratificó, e Iyad fue enviado a Duluk y Ra'ban, cuya gente aceptó los términos de Manbij con la condición de que buscaran noticias de los bizantinos y se las escribieran a los musulmanes; cerca de allí se encuentra la aldea de Jisr Manbij, sin puente existente entonces, construida en el califato de Uthman para las expediciones de verano, o según algún relato de vestigios antiguos; Abu Ubayda puso sobre cada kura que tomó un administrador unido a una guarnición musulmana, abasteciendo los barrios expuestos."
  fr: "Manbij, du jund de Qinnasrin dans le quartier de Duluk-Ra'ban; Iyad ibn Ghanm s'y rendit et ses habitants conclurent un pacte avec Antioche, ratifié par Abu Ubayda. Iyad fut ensuite envoyé à Duluk et Ra'ban, dont les habitants conclurent un pacte avec Manbij, à condition de rechercher des nouvelles des Byzantins et de les transmettre aux musulmans. Près de là se trouve le village de Jisr Manbij — aucun pont n'existait alors, construit sous le califat d'Uthman pour les expéditions estivales, ou selon un récit ancien. Abu Ubayda nomma à la tête de chaque kura conquise un administrateur rattaché à une garnison musulmane, assurant le ravitaillement des quartiers exposés."
  ur: "دولک – ربن سہ ماہی میں کناسرین جنڈ کا منبج؛ عیاض بن غنم اس سے پہلے چلا گیا اور اس کے لوگوں نے انطاکیہ کی شرائط پر جو ابو عبیدہ نے توثیق کی تھی، اور عیاد کو دولک اور ربان کی طرف بھیجا گیا تھا جن کے لوگوں نے منبج کی شرائط پر اس شرط کے ساتھ مرکب کیا تھا کہ وہ بازنطینیوں کی خبریں ڈھونڈیں اور مسلمانوں کو لکھیں۔ اس کے قریب جسر منبج کا گاؤں کھڑا ہے - اس وقت کوئی پل موجود نہیں تھا، جو عثمان کی خلافت میں موسم گرما کی مہمات کے لیے بنایا گیا تھا، یا قدیم آثار کی کسی رپورٹ کے مطابق؛ ابو عبیدہ نے ہر قرہ پر مقرر کیا جس پر وہ لے گیا ایک منتظم ایک مسلم گیریژن میں شامل ہوا، بے نقاب کوارٹرز کا انتظام کرتا تھا۔"
  tr: "Manbij, Qinnasrin'in askerlerinin Daluk ve Ra'ban bölgelerindeki işlerinden biriydi; İyad ibn Ghanam buraya gelip halkını Antakya Antlaşması'ndaki anlaşmayla uzlaştırdı ve Ebu Ubeyde bunu uyguladı. İyad, Daluk ve Ra'ban'a gönderdi ve onların halkı, Manbic Antlaşması'nda olduğu gibi Romalılar hakkında haber aramalarını ve Müslümanlarla yazışmalarını şart koşarak onu uzlaştırdı. Yakınında Jisr Manbij köyü bulunur, ancak o dönemde köprü sadece Osman bin Affan halifeliği sırasında Suwaif için kullanılıyordu ve eski bir geleneği olduğu söylenir. Ebu Ubeyde fethettiği her bölgeye bir vali atadı, bir grup Müslüman topladı ve tehlikeli bölgelere saldırdı."
  id: "Manbij adalah salah satu karya tentara Qinnasrin di wilayah Daluk dan Ra'ban; Iyad ibn Ghanam datang ke sana dan mendamaikan rakyatnya dengan kesepakatan yang sama seperti Perjanjian Antiokhia, dan Abu Ubaidah melaksanakannya. Iyad mengirim surat kepada Daluk dan Ra'ban, dan rakyat mereka mendamaikannya dengan kesepakatan yang sama seperti dalam Perjanjian Manbij, yang menetapkan bahwa mereka mencari kabar tentang orang Romawi dan berkorespondensi dengan Muslim. Di dekatnya terdapat desa Jisr Manbij, tetapi pada waktu itu, jembatan itu hanya digunakan selama kekhalifahan Uthman ibn Affan untuk Suwaif, dan dikatakan memiliki kebiasaan lama. Abu Ubaidah menunjuk gubernur di setiap wilayah yang ditaklukkannya, merekrut sekelompok Muslim, dan menyerbu wilayah berbahaya."
