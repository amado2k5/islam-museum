  ar: "ماء بأرض جذام في شمال الحجاز؛ عنده نزل عمرو بن العاص في غزوته إلى أطراف الشام فسُمّيت به غزوة ذات السلاسل بحسب ابن إسحاق."
  en: "A water in the land of Judham in the northern Hijaz; Amr ibn al-As camped there on his campaign towards Syria, and according to Ibn Ishaq the campaign of Dhat al-Salasil took its name from it."
  es: "Un cuerpo de agua en la tierra de Judham, en el norte del Hiyaz; Amr ibn al-As acampó allí en su campaña hacia Siria, y según Ibn Ishaq, la campaña de Dhat al-Salasil tomó su nombre de este lugar."
  fr: "Un point d'eau du pays de Judham, dans le nord du Hedjaz; Amr ibn al-As y campa lors de sa campagne vers la Syrie, et selon Ibn Ishaq, la campagne de Dhat al-Salasil en tira son nom."
  ur: "شمالی حجاز میں جودھم کی سرزمین میں ایک پانی؛ عمرو بن العاص نے شام کی طرف اپنی مہم کے دوران وہیں پڑاؤ ڈالا اور ابن اسحاق کے بقول غط السلسل کی مہم کا نام اسی سے پڑا۔"
