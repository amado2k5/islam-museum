label: { ar: "السوس ⁦(خوزستان)⁩", en: "Sus (Khuzistan)", es: "Sus (Juzistán)", fr: "Sus (Khuzistan)", ur: "سوس ⁦(خوزستان)⁩", tr: "Al-Sous (Huzistan)", id: "Al-Sous (Khuzestan)" }
summary:
  ar: "مدينة متحضرة جامعة لكل خير، وفيها نخيل وقصب كثير يُصنع منه السكر الكثير، وتشتهر بالفواكه وأنواع الثياب. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  en: "A civilised city with every good thing, palms and much sugar cane made into sugar, and known for fruit and cloth. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  es: "Una ciudad civilizada con todo lo bueno, palmeras y mucha caña de azúcar convertida en azúcar, y conocida por sus frutas y telas. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  fr: "Une ville civilisée dotée de toutes les commodités, avec des palmiers et une abondance de canne à sucre transformée en sucre, et réputée pour ses fruits et ses tissus. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  ur: "ایک مہذب شہر جس میں ہر اچھی چیز، کھجوریں اور گنے کی بہت سی گنے سے چینی بنائی جاتی ہے، اور پھل اور کپڑے کے لیے مشہور ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 396}"
  tr: "Her iyiliği kapsayan, çok sayıda palmiye ağacı ve bol şeker üreten şeker kamışı ile medeni bir şehir; meyveleri ve çeşitli giysi türleriyle ünlüdür. {kaynak:nuzhat-al-mushtaq-2002 s. 396}"
  id: "Sebuah kota beradab yang mencakup segala kebaikan, dengan banyak pohon palem dan tebu yang menghasilkan banyak gula, dan terkenal dengan buah-buahan serta berbagai jenis pakaiannya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 396}"
