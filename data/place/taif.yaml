summary:
  en: "Hill town in the Sarat mountains south-east of Mecca, 1,680 m above sea level, home of the Thaqif tribe in early Islam and later the summer capital of western Arabia. The Prophet visited it in 619 CE and it was besieged in 630 CE. Before Islam it had a brick wall and fortresses, and the valley of Wajj, which gave it its early name, was declared a haram in the agreement between the Prophet and the Thaqif."
  ar: "مدينة جبلية في جبال السراة جنوب شرق مكة على ارتفاع 1680 مترًا، سكنتها ثقيف في صدر الإسلام وصارت لاحقًا عاصمة صيفية لغربي الجزيرة. زارها النبي سنة 619م وحوصرت سنة 630م. وكان لها قبل الإسلام سور من اللبن وحصون، وأُعلن وادي وج الذي أعطاها اسمها الأول حرمًا في الاتفاق بين النبي وثقيف."
  ur: "سراۃ کے پہاڑوں میں مکہ کے جنوب مشرق میں 1680 میٹر کی بلندی پر واقع پہاڑی شہر، جو ابتدائی اسلام میں ثقیف کا مسکن تھا اور بعد میں مغربی عرب کا گرمائی دارالحکومت بنا۔ نبی نے 619ء میں یہاں کا سفر کیا اور 630ء میں اس کا محاصرہ ہوا۔ اسلام سے پہلے اس کی اینٹوں کی دیوار اور قلعے تھے، اور وادیٔ وج، جس نے اسے ابتدائی نام دیا، نبی اور ثقیف کے معاہدے میں حرم قرار پائی۔"
