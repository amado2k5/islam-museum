summary:
  ar: "حصن طاعن في البحر مليح الهيئة وثيق البنيان، وهو من أحسن البلاد وأجملها، ويصفه الإدريسي بالحسن. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  en: "A fortress jutting into the sea, fine in form and strongly built, among the best and most handsome places, in al-Idrisi's description. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  es: "Una fortaleza que se adentra en el mar, de bella forma y sólida construcción, uno de los lugares más bellos y hermosos, según la descripción de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  fr: "Une forteresse s'avançant dans la mer, d'une belle forme et d'une construction robuste, figurant parmi les plus beaux et les plus remarquables lieux décrits par al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  ur: "ایک قلعہ جو سمندر میں اُترتا ہے، شکل میں عمدہ اور مضبوطی سے بنایا گیا، بہترین اور خوبصورت جگہوں میں سے، الادریسی کی تفصیل میں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 594}"
  tr: "Denizde güçlü bir kale, görünüşü güzel ve iyi inşa edilmiş, Al-Idrisi tarafından iyi olarak tanımlanan en güzel ve en güzel topraklardan biridir. {kaynak:nuzhat-al-mushtaq-2002 s. 594}"
  id: "Benteng yang kuat di laut, indah dalam penampilan dan dibangun dengan baik, dan merupakan salah satu tanah terbaik dan terindah, yang digambarkan oleh Al-Idrisi sebagai baik. {cite:nuzhat-al-mushtaq-2002 hlm. 594}"
