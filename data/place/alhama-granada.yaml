  ar: "الحامة من حصون نواحي غرناطة؛ أخذها صاحب قادس غدراً آخر أيام الصلح سنة سبع وثمانين وثمانمائة، وحاصرها أهل غرناطة محاولين ردها فقطعوا عليها الماء حتى أغاثها جمع النصارى ودخلتها فحصنت، وخابت محاولة أهل بسطة ووادي آش لاستردادها فانقطع أمل الناس منها {cite:nafh-tib-maqqari p. 516-517}."
  en: "Alhama — the fortress whose stealthy capture by the Marquis of Cadiz in the truce's last days (887) opened Granada's final war; Granada besieged it vainly until relief came, and its Baza-Guadix rescuers were hurled from the heights {cite:nafh-tib-maqqari p. 516-517}."
