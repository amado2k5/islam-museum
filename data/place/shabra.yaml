summary:
  ar: "قرية وضيئة تبعد عن منية الشامين نحو خمسة أميال، يذكر الإدريسي أن فيها العسل المشهور المفوه في جميع الأرض. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  en: "A bright village about five miles from its neighbour, where al-Idrisi says a famous fine honey is made. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  es: "Un pueblo luminoso a unos ocho kilómetros de su vecino, donde, según al-Idrisi, se produce una miel exquisita. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  fr: "Un village lumineux situé à environ huit kilomètres de son voisin, où, selon al-Idrisi, on produit un miel fin et réputé. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  ur: "اپنے پڑوسی سے پانچ میل کے فاصلے پر ایک روشن گاؤں، جہاں الادریسی کہتے ہیں کہ ایک مشہور باریک شہد بنایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 330}"
  tr: "Minyat al-Shamin'e yaklaşık beş mil uzaklıktaki parlak bir köy olan Al-Idrisi, içinde ünlü ve dünya çapında yayılmış bal içerdiğinden bahseder. {cite:nuzhat-al-mushtaq-2002 s. 330}"
  id: "Sebuah desa terang sekitar lima mil dari Minyat al-Shamin, Al-Idrisi menyebutkan bahwa desa ini mengandung madu, terkenal dan tersebar di seluruh dunia. {cite:Nuzhat-al-Mushtaq-2002 hlm. 330}"
