summary:
  ar: "المهدية قاعدة الفاطميين الأولى على ساحل إفريقية؛ وصفها المقدسي نحو 375هـ: مسورة بالحجر والجيل، شرب أهلها من الآبار وجباب ماء المطر، وهي خزانة القيروان ومطرح أصقلية ومصر عامرة آهلة — ومن أحب أن ينظر إلى القسطنطينية فلينظر إليها فإنها على عملها في جزيرة يُدخل إليها من طريق واحد مثل الشراك {cite:ahsan-al-taqasim p. 181}."
  en: "Al-Mahdiyya, the first Fatimid seat on the Ifriqiyan coast; al-Muqaddasi c. 375 AH: walled in stone and gypsum, its folk drinking from wells and rain-cisterns, the granary of Qayrawan and berth of Sicily — whoever would see Constantinople should look on it, for it is built like it, on an island entered by a single causeway {cite:ahsan-al-taqasim p. 181}."
  es: "Al-Mahdiyya, la primera sede fatimí en la costa de Ifriqiya; al-Muqaddasi c. 375 AH: amurallada en piedra y yeso, su gente bebiendo de pozos y cisternas de lluvia, el granero de Qayrawan y puerto de Sicilia; quien quiera ver Constantinopla debería mirarla, pues está construida como ella, en una isla a la que se accede por una sola calzada {cite:ahsan-al-taqasim p. 181}."
  fr: "Al-Mahdiyya, premier siège fatimide sur la côte d'Ifriqiyan; al-Muqaddasi c. 375 AH: entourée de murs de pierre et de gypse, ses habitants buvant aux puits et aux citernes d'eau de pluie, le grenier de Qayrawan et le port de Sicile — quiconque veut voir Constantinople devrait la regarder, car elle est construite comme elle, sur une île accessible par une seule chaussée {cite: ahsan-al-taqasim p. 181}."
  ur: "المہدیہ، افریقیان کے ساحل پر پہلی فاطمی نشست؛ المقدسی ج۔ 375 ہجری: پتھر اور جپسم کی دیواریں، کنوؤں اور بارش کے حوضوں سے اس کے پینے کے لوگ، قیراوان کا غلہ اور سسلی کی برتھ - جو کوئی قسطنطنیہ کو دیکھے اسے دیکھنا چاہیے، کیونکہ یہ ایک جزیرے پر بنایا گیا ہے جس میں ایک کاز وے سے داخل ہوتا ہے۔ 181}۔"
  tr: "Mahdiyye, Fatımıların İfrikiye kıyısındaki ilk üssüydü; el-Makdisi, yaklaşık 375 Hicri civarında burayı taş ve taş duvarlarla çevrili olarak tanımlamıştır; halkı kuyulardan ve yağmur suyu kaynaklarından su içirdi. Burası Kairouan'ın hazinesi ve Sicilya'nın türbesidir; Mısır refah içinde ve yerleşim yeridir — ve Konstantinopolis'e bakmak isteyen ona bakmalıdır, çünkü ada, tek bir güzergâhla girilen bir adada inşa edilmiştir, tuzak gibi {atıf:ahsan-al-taqasim, s. 181}."
  id: "Mahdiyya adalah markas pertama Fatimiyah di pesisir Ifriqiya; al-Maqdisi menggambarkannya sekitar tahun 375 H sebagai berdinding batu dan batu, penduduknya minum dari sumur dan mata air hujan. Ini adalah harta Kairouan dan Makam Sisilia, dan Mesir makmur serta berpenghuni — dan siapa pun yang ingin melihat Konstantinopel harus melihatnya, karena pulau ini dibangun di sebuah pulau yang dimasuki melalui satu jalur seperti perangkap {cite:ahsan-al-taqasim, hlm. 181}."
