summary:
  ar: "المهدية قاعدة الفاطميين الأولى على ساحل إفريقية؛ وصفها المقدسي نحو 375هـ: مسورة بالحجر والجيل، شرب أهلها من الآبار وجباب ماء المطر، وهي خزانة القيروان ومطرح أصقلية ومصر عامرة آهلة — ومن أحب أن ينظر إلى القسطنطينية فلينظر إليها فإنها على عملها في جزيرة يُدخل إليها من طريق واحد مثل الشراك {cite:ahsan-al-taqasim p. 181}."
  en: "Al-Mahdiyya, the first Fatimid seat on the Ifriqiyan coast; al-Muqaddasi c. 375 AH: walled in stone and gypsum, its folk drinking from wells and rain-cisterns, the granary of Qayrawan and berth of Sicily — whoever would see Constantinople should look on it, for it is built like it, on an island entered by a single causeway {cite:ahsan-al-taqasim p. 181}."
