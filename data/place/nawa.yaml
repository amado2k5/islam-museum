summary:
  ar: "نوى: قرية من قرى حوران جنوبي دمشق في الجولان {cite:al-bidaya-wal-nihaya p. 293-294} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}، عُرفت في القرن السابع الهجري بأنها مسقط رأس الإمام محيي الدين النووي (ت ٦٧٦هـ/١٢٧٧م)، الذي وُلد فيها سنة ٦٣١هـ/١٢٣٣م ومات في بيت أبيه بها، وما يزال قبره مكرَّماً فيها {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
  en: "Nawa: a village of the Hawran south of Damascus in the Jawlan {cite:al-bidaya-wal-nihaya p. 293-294} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}, known in the seventh Islamic century as the birthplace of Imam Muhyi al-Din al-Nawawi (d. 676/1277), who was born there in 631/1233 and died in his father's house; his tomb is still honoured there {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}."
  ur: "نوى: دمشق کے جنوب میں حوران کے گاؤں میں سے ایک، جوڑان (جولان) کی سرزمین پر {cite:al-bidaya-wal-nihaya p. 293-294} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}۔ ساتویں صدی ہجری میں یہ امام محی الدین نووی (وفات 676ھ/1277ء) کی جائے پیدائش کے طور پر معروف ہوئی، جو یہیں 631ھ/1233ء میں پیدا ہوئے اور اپنے والد کے گھر میں فوت ہوئے؛ ان کا مزار آج بھی یہاں معزز ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096}۔"
