id: place/dome-of-the-rock
class: place
kind: site
label: { ar: "قبة الصخرة", en: "Dome of the Rock", es: "Cúpula de la Roca", fr: "Dôme du Rocher", ur: "چٹان کا گنبد", tr: "Kaya Kubbesi", id: "Kubah Batu" }
summary:
  ar: "مسجد قبة الصخرة في وسط الحرم الشريف ببيت المقدس، فوق الصخرة المقدسة. بناه عبد الملك بن مروان على مثمن من الحجر، وشُرع فيه سنة 66هـ ⁦(685م)⁩ وفُرغ منه سنة 72هـ ⁦(691م)⁩ {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}. يذكر الكتاب أنه أُعيد إعماره وقبته سنة 1964م في رعاية الملك حسين {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
  en: "The Dome of the Rock, in the middle of the Haram al-Sharif in Jerusalem, over the sacred rock. The book dates its octagonal building to 66 AH (685 CE) to 72 AH (691 CE) under Abd al-Malik ibn Marwan {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}, and records a restoration of the building and dome in 1964 {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
  es: "La Cúpula de la Roca, en el centro del Haram al-Sharif en Jerusalén, sobre la roca sagrada. El libro fecha su construcción octogonal entre el 66 AH (685 d. C.) y el 72 AH (691 d. C.) bajo el mandato de Abd al-Malik ibn Marwan {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}, y registra una restauración del edificio y la cúpula en 1964 {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
  fr: "Le Dôme du Rocher, situé au centre du Haram al-Sharif à Jérusalem, surplombe le rocher sacré. L'ouvrage date sa construction octogonale entre 66 AH (685-691 AH), sous le règne d'Abd al-Malik ibn Marwan {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}, et mentionne une restauration du bâtiment et du dôme en 1964 {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
  ur: "چٹان کا گنبد، یروشلم میں حرم الشریف کے وسط میں، مقدس چٹان کے اوپر۔ اس کتاب کی تاریخ 66 ہجری ⁦(685 عیسوی)⁩ سے 72 ہجری ⁦(691 عیسوی)⁩ عبد الملک بن مروان کے تحت ہے۔ 43}، اور 1964 میں عمارت اور گنبد کی بحالی کو ریکارڈ کرتا ہے {حوالہ: بیت المقدس فی الاسلام ازہر ص۔ 93}۔"
