summary:
  ar: "مسجد قبة الصخرة في وسط الحرم الشريف ببيت المقدس، فوق الصخرة المقدسة. بناه عبد الملك بن مروان على مثمن من الحجر، وشُرع فيه سنة 66هـ (685م) وفُرغ منه سنة 72هـ (691م) {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}. يذكر الكتاب أنه أُعيد إعماره وقبته سنة 1964م في رعاية الملك حسين {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
  en: "The Dome of the Rock, in the middle of the Haram al-Sharif in Jerusalem, over the sacred rock. The book dates its octagonal building to 66 AH (685 CE) to 72 AH (691 CE) under Abd al-Malik ibn Marwan {cite:bayt-al-maqdis-fi-al-islam-azhar p. 43}, and records a restoration of the building and dome in 1964 {cite:bayt-al-maqdis-fi-al-islam-azhar p. 93}."
