summary:
  ar: "مدينة صغيرة عليها سور حصين، يعيش أهلها على صيد المرجان، وفيها معدن المرجان الذي يُحمل إلى سائر الأقطار، ويقصدها التجار من كل البلاد. {cite:nuzhat-al-mushtaq-2002 p. 290} وقال المقدسي إنها مدينة في جزيرة يدخل إليها من موضع واحد ومنها يرتفع المرجان لا معدن له غيرها ولا يخرج إلا من بحرها {cite:ahsan-al-taqasim p. 181}."
  en: "A small town with a strong wall, whose people live by coral fishing; its coral beds supply the coral that is carried to every land, and merchants come from all regions. {cite:nuzhat-al-mushtaq-2002 p. 290}"
  es: "Un pequeño pueblo con una sólida muralla, cuyos habitantes viven de la pesca de coral; sus arrecifes abastecen de coral a todas partes, y comerciantes de todas las regiones acuden a él. {cite:nuzhat-al-mushtaq-2002 p. 290}"
  fr: "Une petite ville fortifiée, dont les habitants vivent de la pêche au corail; ses bancs de corail fournissent le corail exporté vers tous les pays, et des marchands viennent de toutes les régions. {cite:nuzhat-al-mushtaq-2002 p. 290}"
  ur: "ایک مضبوط دیوار والا ایک چھوٹا سا شہر، جس کے لوگ مرجان کی مچھلیاں پکڑ کر گزارہ کرتے ہیں۔ اس کے مرجان کے بستر مرجان فراہم کرتے ہیں جو ہر زمین پر لے جایا جاتا ہے، اور تاجر تمام علاقوں سے آتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 290}"
