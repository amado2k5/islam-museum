summary:
  ar: "جبل على الضفة الغربية للنيل يُبلغ إليه من زماخر بنحو خمسة أميال. يذكر المؤلف أنه يعترض مجرى النيل فيضغط جريانه ويدفعه بقوة. ويحكي أهل زماخر أن ساحرة كانت تسكن قصرا على أعلاه، وينقل المؤلف ذلك عنهم ولا يتبناه. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  en: "A mountain on the west bank of the Nile, about five miles from Zamakhir. The author says it blocks the river's course and forces its flow through under pressure. The people of Zamakhir say a sorceress once lived in a palace on its summit; the author reports this as their account, not his own. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  es: "Una montaña en la orilla oeste del Nilo, a unos ocho kilómetros de Zamakhir. El autor afirma que bloquea el curso del río y fuerza su flujo a través de ella bajo presión. Los habitantes de Zamakhir cuentan que una hechicera vivió en un palacio en su cima; el autor relata esto como su versión, no la suya propia. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  fr: "Une montagne sur la rive ouest du Nil, à environ huit kilomètres de Zamakhir. L'auteur affirme qu'elle bloque le cours du fleuve et force son écoulement à s'y engouffrer sous pression. Les habitants de Zamakhir racontent qu'une sorcière vivait autrefois dans un palais à son sommet; l'auteur rapporte ce récit comme étant le leur, et non le sien. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  ur: "زمخیر سے پانچ میل کے فاصلے پر دریائے نیل کے مغربی کنارے پر ایک پہاڑ۔ مصنف کا کہنا ہے کہ یہ دریا کے راستے کو روکتا ہے اور دباؤ میں اس کے بہاؤ کو مجبور کرتا ہے۔ زماخیر کے لوگ کہتے ہیں کہ ایک جادوگرنی کبھی اس کی چوٹی پر ایک محل میں رہتی تھی۔ مصنف اسے اپنے اکاؤنٹ کے طور پر رپورٹ کرتا ہے، نہ کہ اس کا اپنا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 127}"
  tr: "Nil'in batı kıyısındaki bir dağ, Zamacher'den yaklaşık beş mil uzaklıkta Nil'e ulaşır. Yazar, Nil'in akışını kesip akıntısını zorla ittiğini belirtir. Zamakhar halkı, üst katta bir sarayda bir cadının yaşadığını anlatır, ancak yazar bunu onlara atfeder fakat kabul etmez. {cite:nuzhat-al-mushtaq-2002 s. 127}"
  id: "Sebuah gunung di tepi barat Sungai Nil mencapainya dari Zamacher sekitar lima mil. Penulis menyebutkan bahwa gunung itu menghalangi aliran Sungai Nil, menekan alirannya dan mendorongnya dengan kuat. Orang-orang Zamakhar menceritakan bahwa seorang penyihir pernah tinggal di sebuah istana di lantai atas, tetapi penulis mengaitkannya dengan mereka namun tidak menerimanya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 127}"
