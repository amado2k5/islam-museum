label: { ar: "جبل الطيلمون", en: "Jabal al-Tilmun" }
summary:
  ar: "جبل على الضفة الغربية للنيل يُبلغ إليه من زماخر بنحو خمسة أميال. يذكر المؤلف أنه يعترض مجرى النيل فيضغط جريانه ويدفعه بقوة. ويحكي أهل زماخر أن ساحرة كانت تسكن قصرا على أعلاه، وينقل المؤلف ذلك عنهم ولا يتبناه. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  en: "A mountain on the west bank of the Nile, about five miles from Zamakhir. The author says it blocks the river's course and forces its flow through under pressure. The people of Zamakhir say a sorceress once lived in a palace on its summit; the author reports this as their account, not his own. {cite:nuzhat-al-mushtaq-2002 p. 127}"
