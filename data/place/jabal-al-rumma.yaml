label: { ar: "جبل الرماة (جبل عينين)", en: "Jabal al-Rumma (Archers' Hill / Jabal Aynayn)" }
summary:
  ar: "جبل صغير يقع على الضفة الجنوبية من وادي قناة جنوب شرق معسكر المسلمين في أحد، على بعد حوالي مائة وخمسين متراً من مقر الجيش الإسلامي. عيّن النبي عبد الله بن جبير قائداً لخمسين رامياً فوقه لحماية جناح المسلمين الأيسر من فرسان المشركين. عُرف في عصر النبي بجبل عينين، ثم سُمي جبل الرماة لاحقاً {cite:mubarakpuri-raheeq p.255}."
  en: "A small hill on the southern bank of Wadi Qanat, southeast of the Muslim camp at Uhud, about a hundred and fifty metres from the Muslim army's position. The Prophet appointed Abdullah ibn Jubayr commander of fifty archers on it to protect the Muslims' left flank from the polytheist cavalry. In the Prophet's time it was known as Jabal Aynayn, and was later called the Archers' Hill {cite:mubarakpuri-raheeq p.255}."
