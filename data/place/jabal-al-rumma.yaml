label: { ar: "جبل الرماة ⁦(جبل عينين)⁩", en: "Jabal al-Rumma (Archers' Hill / Jabal Aynayn)", es: "Jabal al-Rumma (Colina de los Arqueros / Jabal Aynayn)", fr: "Jabal al-Rumma (Colline des Archers / Jabal Aynayn)", ur: "جبل الرما ⁦(تیرنداز پہاڑی / جبل عینین)⁩" }
summary:
  ar: "جبل صغير يقع على الضفة الجنوبية من وادي قناة جنوب شرق معسكر المسلمين في أحد، على بعد حوالي مائة وخمسين متراً من مقر الجيش الإسلامي. عيّن النبي عبد الله بن جبير قائداً لخمسين رامياً فوقه لحماية جناح المسلمين الأيسر من فرسان المشركين. عُرف في عصر النبي بجبل عينين، ثم سُمي جبل الرماة لاحقاً {cite:mubarakpuri-raheeq p.255}."
  en: "A small hill on the southern bank of Wadi Qanat, southeast of the Muslim camp at Uhud, about a hundred and fifty metres from the Muslim army's position. The Prophet appointed Abdullah ibn Jubayr commander of fifty archers on it to protect the Muslims' left flank from the polytheist cavalry. In the Prophet's time it was known as Jabal Aynayn, and was later called the Archers' Hill {cite:mubarakpuri-raheeq p.255}."
  es: "Una pequeña colina en la orilla sur de Wadi Qanat, al sureste del campamento musulmán de Uhud, a unos ciento cincuenta metros de la posición del ejército musulmán. El Profeta designó a Abdullah ibn Jubayr como comandante de cincuenta arqueros en ella para proteger el flanco izquierdo de los musulmanes de la caballería politeísta. En tiempos del Profeta se la conocía como Jabal Aynayn, y más tarde se la denominó la Colina de los Arqueros {cite:mubarakpuri-raheeq p.255}."
  fr: "Une petite colline sur la rive sud du Wadi Qanat, au sud-est du camp musulman d'Uhud, à environ cent cinquante mètres de la position de l'armée musulmane. Le Prophète y nomma Abdullah ibn Jubayr commandant de cinquante archers afin de protéger le flanc gauche des musulmans contre la cavalerie polythéiste. À l'époque du Prophète, elle était connue sous le nom de Jabal Aynayn, et fut plus tard appelée la Colline des Archers (voir Mubarakpuri-Raheeq, p. 255)."
  ur: "وادی قنات کے جنوبی کنارے پر ایک چھوٹی پہاڑی، احد میں مسلمانوں کے کیمپ کے جنوب مشرق میں، مسلمانوں کی فوج کے مقام سے تقریباً ڈیڑھ سو میٹر کے فاصلے پر۔ نبی نے عبداللہ بن جبیر کو پچاس تیر اندازوں کا سپہ سالار مقرر کیا تاکہ مسلمانوں کے بائیں جانب کو مشرک گھڑ سواروں سے بچایا جا سکے۔ نبی کے زمانے میں اسے جبل عینین کہا جاتا تھا، اور بعد میں اسے تیر اندازوں کی پہاڑی کہا جاتا تھا۔"
