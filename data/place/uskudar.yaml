kids:
  ar: "أسكدار حيّ جميل في إسطنبول على الضفة الآسيوية من البسفور، فيه مساجد قديمة كثيرة."
  en: "Üsküdar is a lovely district of Istanbul on the Asian side of the Bosphorus, with many old mosques."
  ur: "اسکودار استنبول کا ایک خوبصورت علاقہ ہے جو باسفورس کے ایشیائی کنارے پر ہے اور اس میں بہت سی پرانی مسجدیں ہیں۔"
