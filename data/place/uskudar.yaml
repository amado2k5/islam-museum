summary:
  ar: "أسكدار، ويعرفها الغرب باسم سكوتاري، أهم ضواحي إسطنبول على الشاطئ الآسيوي، عند الطرف الجنوبي للبسفور. سُمّيت في العصور القديمة خريسوبوليس، وكانت على الأرجح ضاحية لمستعمرة خلقيدونية اليونانية، وصارت بعد الفتح العثماني جسر العبور من القسطنطينية إلى آسيا بدلاً من خلقيدونية، وازدهرت بمجمعات الوقف التي أقامتها نساء البيت السلطاني ومنها مجمع مهرماه سنة 955هـ/1548م، وبتكاياها ومقبرتها الإسلامية الكبرى {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  en: "Üsküdar, known in Western Europe as Scutari, is the most important of the Asian-shore suburbs of Istanbul, at the southern end of the Bosphorus. Called Chrysopolis since antiquity and probably a suburb of the Greek colony of Chalcedon, it replaced Chalcedon after the Ottoman arrival as the bridgehead from Constantinople towards Asia, and grew through the endowed complexes of the royal household, among them Mihrimah's in 955/1548, through its many dervish lodges, and through its immense Muslim cemetery {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  ur: "اسکودار، جسے مغربی یورپ میں سکوتاری کہا جاتا ہے، استنبول کے ایشیائی ساحل کے نواحی علاقوں میں سب سے اہم ہے اور باسفورس کے جنوبی سرے پر واقع ہے۔ قدیم زمانے سے اسے کریسوپولس کہا جاتا تھا اور غالباً یہ خلقیدونیہ کی یونانی بستی کا نواحی علاقہ تھا۔ عثمانیوں کے آنے کے بعد یہ قسطنطنیہ سے ایشیا کی طرف گزرگاہ کے طور پر خلقیدونیہ کی جگہ آ گیا، اور شاہی خاندان کے وقفی مجموعوں، جن میں 955ھ/1548ء میں مہرِ ماہ کا مجموعہ شامل ہے، نیز بے شمار خانقاہوں اور مسلمانوں کے وسیع قبرستان کی بدولت پھلا پھولا {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  es: "Üsküdar, conocida en Europa Occidental como Scutari, es el suburbio más importante de la costa asiática de Estambul, en el extremo sur del Bósforo. Llamada Crisópolis desde la antigüedad y probablemente un suburbio de la colonia griega de Calcedonia, reemplazó a Calcedonia después de la llegada otomana como cabeza de puente desde Constantinopla hacia Asia, y creció a través de los complejos dotados por la casa real, entre ellos el de Mihrimah en 955/1548, a través de sus numerosas logias derviches y a través de su inmenso cementerio musulmán {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  fr: "Üsküdar, connue en Europe occidentale sous le nom de Scutari, est la plus importante des banlieues d'Istanbul donnant sur la rive asiatique, à l'extrémité sud du Bosphore. Appelée Chrysopolis depuis l'Antiquité et probablement une banlieue de la colonie grecque de Chalcédoine, elle remplaça cette dernière après l'arrivée des Ottomans comme tête de pont entre Constantinople et l'Asie, et se développa grâce aux somptueux complexes de la maison royale, parmi lesquels celui de Mihrimah en 955/1548, grâce à ses nombreux couvents de derviches moines et grâce à son immense cimetière musulman."
  tr: "Batı'da Skotari olarak bilinen Üsküdar, İstanbul'un Asya kıyısında, Boğaz'ın güney ucunda yer alan en önemli banliyösüdür. Antik çağlarda Chrysopolis olarak adlandırılır ve muhtemelen Yunan kolonisi Kalkedon'un bir banliyösüydü. Osmanlı fethinden sonra, Kalkedonya yerine Konstantinopolis'ten Asya'ya köprü olmuştur. Kraliyet hanesinin kadınları tarafından kurulan vakıf kompleksleriyle, 955 Hicri/1548 yılında Mehramah kompleksi, tkiwaları ve büyük İslami mezarlığı {cite:Encyclopaedia-of-Islam-2 cilt 10, s. 979} {cite:Encyclopaedia-of-Islam-2 cilt 10, s. 980}"
  id: "Üsküdar, yang dikenal di Barat sebagai Skotari, adalah pinggiran kota terpenting Istanbul di pesisir Asia, di ujung selatan Bosphorus. Pada zaman kuno, kota ini disebut Chrysopolis dan kemungkinan merupakan pinggiran koloni Yunani Chalcedon. Setelah penaklukan Ottoman, kota ini menjadi jembatan dari Konstantinopel ke Asia, bukan Chalcedonia. Kota ini berkembang dengan kompleks wakaf yang didirikan oleh perempuan keluarga kerajaan, termasuk kompleks Mehramah pada tahun 955 H/1548 M, tkiwas-nya, dan pemakaman Islam utamanya {cite:Encyclopaedia-of-Islam-2 vol. 10, hlm. 979} {cite:Encyclopaedia-of-Islam-2 vol. 10, hlm. 980}."
