label: { ar: "أسكدار", en: "Üsküdar (Scutari)", ur: "اسکودار" }
summary:
  ar: "أسكدار، ويعرفها الغرب باسم سكوتاري، أهم ضواحي إسطنبول على الشاطئ الآسيوي، عند الطرف الجنوبي للبسفور. سُمّيت في العصور القديمة خريسوبوليس، وكانت على الأرجح ضاحية لمستعمرة خلقيدونية اليونانية، وصارت بعد الفتح العثماني جسر العبور من القسطنطينية إلى آسيا بدلاً من خلقيدونية، وازدهرت بمجمعات الوقف التي أقامتها نساء البيت السلطاني ومنها مجمع مهرماه سنة 955هـ/1548م، وبتكاياها ومقبرتها الإسلامية الكبرى {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  en: "Üsküdar, known in Western Europe as Scutari, is the most important of the Asian-shore suburbs of Istanbul, at the southern end of the Bosphorus. Called Chrysopolis since antiquity and probably a suburb of the Greek colony of Chalcedon, it replaced Chalcedon after the Ottoman arrival as the bridgehead from Constantinople towards Asia, and grew through the endowed complexes of the royal household, among them Mihrimah's in 955/1548, through its many dervish lodges, and through its immense Muslim cemetery {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
  ur: "اسکودار، جسے مغربی یورپ میں سکوتاری کہا جاتا ہے، استنبول کے ایشیائی ساحل کے نواحی علاقوں میں سب سے اہم ہے اور باسفورس کے جنوبی سرے پر واقع ہے۔ قدیم زمانے سے اسے کریسوپولس کہا جاتا تھا اور غالباً یہ خلقیدونیہ کی یونانی بستی کا نواحی علاقہ تھا۔ عثمانیوں کے آنے کے بعد یہ قسطنطنیہ سے ایشیا کی طرف گزرگاہ کے طور پر خلقیدونیہ کی جگہ آ گیا، اور شاہی خاندان کے وقفی مجموعوں، جن میں 955ھ/1548ء میں مہرِ ماہ کا مجموعہ شامل ہے، نیز بے شمار خانقاہوں اور مسلمانوں کے وسیع قبرستان کی بدولت پھلا پھولا {cite:encyclopaedia-of-islam-2 vol. 10 p. 979} {cite:encyclopaedia-of-islam-2 vol. 10 p. 980}."
