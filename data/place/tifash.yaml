summary:
  ar: "مدينة قديمة بالحجر والجير، فيها عين ماء جارية، وغالب زرعها الشعير، وتبعد عن الأربس مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 295}"
  en: "An old city built of stone and lime with a running spring; its main crop is barley; one stage from al-Arbus. {cite:nuzhat-al-mushtaq-2002 p. 295}"
  es: "Una antigua ciudad construida de piedra y cal con un manantial; su principal cultivo es la cebada; a una etapa de al-Arbus. {cite:nuzhat-al-mushtaq-2002 p. 295}"
  fr: "Une ancienne ville construite en pierre et en chaux, traversée par une source; sa principale culture est l'orge; à une étape d'al-Arbus. {cite:nuzhat-al-mushtaq-2002 p. 295}"
  ur: "ایک پرانا شہر پتھر اور چونے سے بنا ہوا چشمہ کے ساتھ۔ اس کی اہم فصل جو ہے۔ العربس سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 295}"
  tr: "Kireçtaşı ve kireçtaşından oluşmuş, akan bir kaynağı ve çoğunlukla arpa ekimi yapan eski bir şehir, Al-Arbas'a birkaç adım uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 295}"
  id: "Sebuah kota kuno yang terbuat dari batu kapur dan batu kapur, dengan mata air yang mengalir dan sebagian besar pertanian jelai, terletak beberapa langkah dari Al-Arbas. {cite:nuzhat-al-mushtaq-2002 hlm. 295}"
