summary:
  ar: "مدينة قديمة البناء على الشرق من النيل، ذات بساتين وثمار كثيرة، ويذكر المؤلف أنها المعروفة بمدينة السحرة، وأن فرعون جلبهم منها ليوم الموعد للقاء موسى {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "An old city on the east bank of the Nile with gardens and abundant fruit. The author says it is known as the city of magicians, from which Pharaoh brought them for the appointed day of the encounter with Musa {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Una antigua ciudad en la orilla oriental del Nilo, con jardines y abundante fruta. El autor afirma que se la conoce como la ciudad de los magos, de donde el faraón los trajo para el día señalado del encuentro con Musa {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Une ancienne cité sur la rive orientale du Nil, avec des jardins et des vergers abondants. L'auteur indique qu'elle est connue comme la cité des magiciens, d'où le pharaon les aurait fait venir pour le jour fixé de la rencontre avec Moïse (cit.: nuzhat-al-mushtaq-2002, p. 124)."
  ur: "نیل کے مشرقی کنارے پر ایک پرانا شہر جس میں باغات اور بہت سارے پھل ہیں۔ مصنف کا کہنا ہے کہ اسے جادوگروں کا شہر کہا جاتا ہے جہاں سے فرعون انہیں موسیٰ سے معرکہ آرائی کے مقررہ دن کے لیے لایا تھا۔ 124}۔"
