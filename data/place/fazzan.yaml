summary:
  ar: "أرض تلي أرض زغاوة، فيها مدن مثل جرمة وتساوة، ويذكر المؤلف أن أهلها يعتمدون على الآبار والنخيل، وأن المسافرين يقطعونها في طريق التجار {cite:nuzhat-al-mushtaq-2002 p. 112}، {cite:nuzhat-al-mushtaq-2002 p. 109}."
  en: "The land that follows Zaghawa country, with towns such as Jarma and Tasawa. The author says its people depend on wells and palms, and that it lies on the merchants' road {cite:nuzhat-al-mushtaq-2002 p. 112}, {cite:nuzhat-al-mushtaq-2002 p. 109}."
