id: place/jazirat-al-qurud
class: place
kind: island
label: { ar: "جزيرة القرود", en: "Island of the monkeys", es: "Isla de los monos", fr: "L'île des singes", ur: "بندروں کا جزیرہ", tr: "Maymun Adası", id: "Pulau Monyet" }
summary:
  ar: "جزيرة صغيرة بالقرب من جزيرة الرائج، فيها غياض وأشجار ومنها أنواع من الثمر، وتكثر فيها القرود حتى يقال إن لها أميراً تنقاد إليه، ويصطادها أهل اليمن ليبيعوها في حوانيتهم {cite:nuzhat-al-mushtaq-2002 p. 63}."
  en: "A small island near Ramij, with groves, trees and fruit, where monkeys are so numerous that the author says they are said to have a leader they obey. Yemeni traders catch them to sell in their shops {cite:nuzhat-al-mushtaq-2002 p. 63}."
  es: "Una pequeña isla cerca de Ramij, con arboledas, árboles y frutales, donde los monos son tan numerosos que, según el autor, se dice que tienen un líder al que obedecen. Los comerciantes yemeníes los capturan para venderlos en sus tiendas {cite:nuzhat-al-mushtaq-2002 p. 63}."
  fr: "Une petite île près de Ramij, couverte de bosquets, d'arbres et de fruits, abrite une population de singes si nombreuse que, selon l'auteur, ils auraient un chef auquel ils obéissent. Des commerçants yéménites les capturent pour les vendre dans leurs boutiques {cite:nuzhat-al-mushtaq-2002 p. 63}."
  ur: "رامج کے قریب ایک چھوٹا سا جزیرہ، جس میں باغات، درخت اور پھل ہیں، جہاں بندروں کی اتنی زیادہ تعداد ہے کہ مصنف کا کہنا ہے کہ ان کے پاس ایک رہنما ہے جس کی وہ اطاعت کرتے ہیں۔ یمنی تاجر انہیں اپنی دکانوں میں بیچنے کے لیے پکڑتے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 63}۔"
  tr: "Al-Raij Adası yakınlarında küçük bir ada, ghiyadlar ve ağaçlarla, çeşitli meyve türleri dahil. Maymunlar o kadar bol ki, takip ettikleri bir prensleri olduğu söylenir ve Yemen halkı onları avlayarak dükkanlarında satmak ister {cite:Nuzhat-al-Mushtaq-2002, s. 63}."
  id: "Sebuah pulau kecil dekat Pulau Al-Raij, dengan ghiyad dan pohon-pohon, termasuk berbagai jenis buah. Monyet begitu melimpah sehingga dikatakan memiliki pangeran yang mereka ikuti, dan masyarakat Yaman memburu mereka untuk dijual di toko-toko mereka {cite:Nuzhat-al-Mushtaq-2002, hlm. 63}."
