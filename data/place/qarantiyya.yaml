summary:
  ar: "أول مدينة من مدن الكيماكية، كبيرة لها سور حصين وخيول وفرسان، وهي على بحيرة كبيرة يحكى أن طولها ستة أيام في عرض يوم ونصف، وتبعد عن باخوان سبعة أيام. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  en: "The first city of the Kimak lands, large, with a strong wall and horses and horsemen, on a great lake said to be six days long and a day and a half wide; seven days from Bakhwan. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  es: "La primera ciudad de las tierras de Kimak, grande, con una sólida muralla, caballos y jinetes, a orillas de un gran lago que se decía que tenía seis días de largo y un día y medio de ancho; a siete días de Bakhwan. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  fr: "La première ville des terres Kimak, grande, avec une solide muraille, des chevaux et des cavaliers, sur un grand lac dont on disait qu'il faisait six jours de long et un jour et demi de large; à sept jours de Bakhwan. {cite:nuzhat-al-mushtaq-2002 p. 708}"
  ur: "کیمک کا پہلا شہر، ایک بڑا، ایک مضبوط دیوار اور گھوڑوں اور سواروں کے ساتھ، ایک عظیم جھیل پر اترا جو چھ دن طویل اور ڈیڑھ دن چوڑا تھا۔ بخوان سے سات دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 708}"
