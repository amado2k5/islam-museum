label: { ar: "حمام أعين", en: "Hammam A'yan", es: "Hammam A'yan", fr: "Hammam A'yan", ur: "ہمم اعیان", tr: "Göz banyosu", id: "Eye bath" }
summary:
  ar: "حمام بالكوفة نسب إلى أعين مولى سعد بن أبي وقاص وهو الذي أرسله الحجاج بن يوسف إلى عبد الله بن الجارود العبدي من رستقاباذ حين خالف وتابعه الناس على إخراج الحجاج من العراق فقال له حين أدى الرسالة لولا أنك رسول لقتلتك وكان الحمام قبله لرجل من العباد يقال له جابر أخو حيان الذي ذكره الأعشى وهو صاحب مسناة جابر بالحيرة فابتاعه من ورثته وعند حمام أعين أقطع عثمان خالد بن عرفطة أرضاً."
  en: "Bath at Kufa named for A'yan, Sa'd ibn Abi Waqqas's mawla — the man al-Hajjaj sent to Abdallah ibn al-Jarud al-Abdi of Rustuqubadh during his defection, who answered the message 'were you not a messenger I'd kill you'; before him it belonged to Jabir, brother of the Hayyan al-A'sha mentioned — owner of Hira's Musannat Jabir — bought from his heirs; Uthman granted Khalid ibn Urfuta land by Hammam A'yan."
  es: "El baño de Kufa recibió su nombre de A'yan, el mawla de Sa'd ibn Abi Waqqas, el hombre que al-Hajjaj envió a Abdallah ibn al-Jarud al-Abdi de Rustuqubadh durante su deserción, quien respondió al mensaje \"si no fueras un mensajero, te mataría\"; antes de él perteneció a Jabir, hermano del mencionado Hayyan al-A'sha, propietario de Musannat Jabir de Hira, comprado a sus herederos; Uthman concedió tierras a Khalid ibn Urfuta por medio de Hammam A'yan."
  fr: "Le bain de Kufa porte le nom d'A'yan, le mawla de Sa'd ibn Abi Waqqas — l'homme qu'al-Hajjaj envoya à Abdallah ibn al-Jarud al-Abdi de Rustuqubadh lors de sa défection, et qui répondit au message « si tu n'étais pas un messager, je te tuerais »; avant lui, il appartenait à Jabir, frère du Hayyan al-A'sha mentionné — propriétaire du Musannat Jabir de Hira — acheté à ses héritiers; Uthman accorda à Khalid ibn Urfuta des terres près de Hammam A'yan."
  ur: "کوفہ میں حمام عیان کے نام سے منسوب کیا گیا، سعد بن ابی وقاص کے مولا - ایک شخص الحجاج نے اپنے انحراف کے دوران رسطوقبد کے عبداللہ بن جارود العبدی کے پاس بھیجا، جس نے اس پیغام کا جواب دیا کہ 'کیا تم رسول نہیں تھے میں تمہیں قتل کر دوں گا'؛ اس سے پہلے یہ جابر کا تھا، جو حیان العشا کا ذکر کیا گیا ہے - حرا کی مسنات جابر کے مالک نے اپنے وارثوں سے خریدا تھا۔ عثمان نے خالد بن عرفطہ کو حمام عیان کے ذریعہ زمین عطا کی۔"
  tr: "Kufa'daki Hamam, Sa'd ibn Ebi Vakqas'ın özgür bıraktığı A'in'e atfedilir; E'in, Al-Hacac bin Yusuf tarafından Abdullah ibn Al-Jarud Al-Abdi'ye Rastaqabadh'tan gönderilmişti; o karşı çıktığında ve halk da Al-Hacac'ı Irak'tan kovmak için onu takip etti. Mesajı ilettiğinde, 'Sen bir elçi olmasaydın, seni öldürürdüm.' dedi. Önündeki hamam, Hayyan'ın kardeşi Cabir adında Al-'Abbad'dan bir adama aitti; Hayyan'ın kardeşi, Al-A'sha'nın bahsettiği ve Cabir'in ailesinin sahibi olduğu için evi varislerinden satın aldı. Hammam A'in'de, Osman Halid bin Arfatah bir arazi parçası kesti."
  id: "Hammam di Kufa dikaitkan dengan A'in, mantan izin Sa'd ibn Abi Waqqas, yang dikirim oleh Al-Hajjaj ibn Yusuf kepada Abdullah ibn Al-Jarud Al-Abdi dari Rastaqabadh ketika ia menentang dan rakyat mengikutinya mengusir Al-Hajjaj dari Irak. Ia berkata kepadanya saat menyampaikan pesan, 'Jika kau bukan utusan, aku akan membunuhmu.' Pemandian di depannya milik seorang pria dari Al-'Abbad bernama Jabir, saudara Hayyan, yang disebut Al-A'sha, yang merupakan pemilik keluarga Jabir di Al-Hirah, sehingga ia membelinya dari ahli warisnya. Di Hammam A'in, Uthman Khalid ibn Arfatah memotong sebidang tanah."
