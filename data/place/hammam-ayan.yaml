label: { ar: "حمام أعين", en: "Hammam A'yan" }
summary:
  ar: "حمام بالكوفة نسب إلى أعين مولى سعد بن أبي وقاص وهو الذي أرسله الحجاج بن يوسف إلى عبد الله بن الجارود العبدي من رستقاباذ حين خالف وتابعه الناس على إخراج الحجاج من العراق فقال له حين أدى الرسالة لولا أنك رسول لقتلتك وكان الحمام قبله لرجل من العباد يقال له جابر أخو حيان الذي ذكره الأعشى وهو صاحب مسناة جابر بالحيرة فابتاعه من ورثته وعند حمام أعين أقطع عثمان خالد بن عرفطة أرضاً."
  en: "Bath at Kufa named for A'yan, Sa'd ibn Abi Waqqas's mawla — the man al-Hajjaj sent to Abdallah ibn al-Jarud al-Abdi of Rustuqubadh during his defection, who answered the message 'were you not a messenger I'd kill you'; before him it belonged to Jabir, brother of the Hayyan al-A'sha mentioned — owner of Hira's Musannat Jabir — bought from his heirs; Uthman granted Khalid ibn Urfuta land by Hammam A'yan."
