summary:
  ar: "مدينة كبيرة القطر كثيرة الأشجار والثمار، لها مرسى حسن مأمون مشتى، وبه إنشاء المراكب الكبار والصغار، وتبعد عن رومة نحو مائة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 756}"
  en: "A large city rich in trees and fruit, with a fine sheltered harbour where large and small ships are built; about a hundred and twenty miles from Rome. {cite:nuzhat-al-mushtaq-2002 p. 756}"
  es: "Una gran ciudad rica en árboles y frutas, con un excelente puerto protegido donde se construyen barcos grandes y pequeños; a unos ciento veinte kilómetros de Roma. {cite:nuzhat-al-mushtaq-2002 p. 756}"
  fr: "Une grande ville riche en arbres et en fruits, dotée d'un beau port abrité où sont construits des navires de toutes tailles; à environ cent vingt milles de Rome. {cite:nuzhat-al-mushtaq-2002 p. 756}"
  ur: "درختوں اور پھلوں سے مالا مال ایک بڑا شہر، ایک عمدہ پناہ گاہ کے ساتھ جہاں بڑے اور چھوٹے جہاز بنائے جاتے ہیں۔ روم سے تقریباً ایک سو بیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 756}"
