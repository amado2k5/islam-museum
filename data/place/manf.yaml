summary:
  ar: "قرية وأخرى عامرة أسفل جبل المقطم، وأكثرها اليوم خراب، ويذكر الإدريسي عن موضع يعرف بتنور فرعون أن فيه مرآة تُبصر منها صورة الشخص، وأمرٌ يُروى عن طلسم فيه. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  en: "A village and town at the foot of Mount Muqattam, now largely in ruins. Al-Idrisi describes a place called the oven of Pharaoh, where a mirror is said to show a viewer's image, and a talisman said to have been made there. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  es: "Un pueblo y una aldea al pie del monte Muqattam, ahora en gran parte en ruinas. Al-Idrisi describe un lugar llamado el horno del faraón, donde se dice que un espejo refleja la imagen del observador y donde se dice que se forjó un talismán. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  fr: "Un village et une ville au pied du mont Muqattam, aujourd'hui en grande partie en ruines. Al-Idrisi décrit un lieu appelé le four du Pharaon, où un miroir refléterait l'image de celui qui s'y regarde, et où un talisman aurait été fabriqué. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  ur: "کوہ مقطم کے دامن میں ایک گاؤں اور قصبہ جو اب زیادہ تر کھنڈرات میں ہے۔ الادریسی نے فرعون کے تنور کے نام سے ایک جگہ بیان کی ہے، جہاں ایک آئینہ دیکھنے والے کی تصویر دکھاتا ہے، اور کہا جاتا ہے کہ وہاں ایک طلسم بنایا گیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 326}"
  tr: "Mokattam Dağı'nın eteğinde bir köy ve bir diğeri vardır; bunların çoğu bugün harabe halindedir. Al-Idrisi, Firavun'un fırını olarak bilinen bir yerden bahseder; burada bir aynadan bir kişinin görüntüsünü görürsünüz ve orada bir tılsım hakkında bir hikaye anlatılır. {kaynak:nuzhat-al-mushtaq-2002 s. 326}"
  id: "Sebuah desa dan satu lagi di kaki Gunung Mokattam, sebagian besar masih rusak hingga kini. Al-Idrisi menyebutkan sebuah tempat yang dikenal sebagai tungku Firaun, di mana terdapat cermin yang dapat melihat gambar seseorang, dan sebuah kisah tentang jimat di sana diceritakan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 326}"
