  en: "A village and town at the foot of Mount Muqattam, now largely in ruins. Al-Idrisi describes a place called the oven of Pharaoh, where a mirror is said to show a viewer's image, and a talisman said to have been made there. {cite:nuzhat-al-mushtaq-2002 p. 326}"
