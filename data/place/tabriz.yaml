label:
  ar: تبريز
  en: Tabriz
summary:
  ar: "تبريز هي العاصمة التقليدية لإقليم أذربيجان الفارسي، تقع على سهل غريني قرب بحيرة أرومية وتتكرر فيها الزلازل. صارت عاصمة أذربيجان في عهد الأتابكة الإلدكزيين، وبلغت أوج ازدهارها عاصمةً للإيلخانيين المغول في عهد غازان خان، وتعاقبت عليها بعد ذلك أسر جلائرية وتيمورية وقره قويونلو وصراعات صفوية عثمانية. ومن آثارها المسجد الأزرق الذي أقامته خاتون جان سنة 870هـ/1465م."
  en: "Tabriz is the traditional capital of the Persian province of Azerbaijan, set on an alluvial plain near Lake Urmiya and prone to earthquakes. It became the capital of Azerbaijan under the Ildegizid Atabegs and reached its greatest splendour as capital of the Mongol Il-Khans under Ghazan Khan. Jalayirid, Timurid and Kara Koyunlu rulers followed, and later Safavid-Ottoman wars; its monuments include the Blue Mosque built by Khatun Jan in 870/1465."
  ur: "تبریز فارسی صوبے آذربائیجان کا روایتی دارالحکومت ہے، جو جھیل ارمیہ کے قریب ایک رسوبی میدان پر واقع ہے اور جہاں زلزلے عام ہیں۔ یہ ایلدگزی اتابکوں کے دور میں آذربائیجان کا دارالحکومت بنا اور غازان خان کے عہد میں منگول ایل خانیوں کے دارالحکومت کے طور پر اپنے عروج کو پہنچا۔ اس کے بعد جلائری، تیموری اور قرہ قویونلو حکمران اور بعد میں صفوی عثمانی جنگیں آئیں؛ اس کی عمارتوں میں خاتون جان کی 870ھ/1465ء میں بنوائی ہوئی نیلی مسجد شامل ہے۔"
