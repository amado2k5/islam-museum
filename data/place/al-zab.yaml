  fr: "À al-Baladhuri: un district situé à plus de dix jours de marche de Qayrawan où Ibrahim ibn al-Aghlab et douze hommes se réfugièrent en fuyant l'Égypte, et où il revendiqua le commandement des troupes de ce district."
  ur: "البلادوری میں: قیروان سے دس دن کے مارچ پر ایک ضلع جہاں ابراہیم بن الغلب اور بارہ آدمیوں نے مصر سے بھاگ کر پناہ لی تھی، اور جہاں اس نے اس ضلع کی فوجوں کی قیادت کا دعویٰ کیا تھا۔"
