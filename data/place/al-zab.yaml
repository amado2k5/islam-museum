  ar: "عند البلاذري: موضع من القيروان على مسيرة أكثر من عشرة أيام لحق به إبراهيم بن الأغلب واثنا عشر رجلاً هاربين من مصر واعتقد فيه على جند تلك الناحية وغيرهم الرياسة."
  en: "In al-Baladhuri: a district over ten days' march from Qayrawan where Ibrahim ibn al-Aghlab and twelve men took refuge fleeing Egypt, and where he claimed leadership over that district's troops."
