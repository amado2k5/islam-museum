label: { ar: "جزيرة شامل", en: "Shamil island", es: "Isla Shamil", fr: "Île de Shamil", ur: "شمل جزیرہ" }
summary:
  ar: "جزيرة معمورة في آخر البحر الصنفي، تبعد عن مدينة الصنف الساحلية أربعة أيام، وفيها أهل كثيرون وقصب سكر وسمك كبير الحجم يغني أهلها عن أكل اللحم {cite:nuzhat-al-mushtaq-2002 p. 85}."
  en: "A populated island at the far end of the Sanf sea, four days from the coastal city of Sanf. Many people live there, with sugar cane and large fish that spare the islanders from eating meat {cite:nuzhat-al-mushtaq-2002 p. 85}."
  es: "Una isla poblada en el extremo del mar de Sanf, a cuatro días de la ciudad costera de Sanf. Allí viven muchas personas, que cultivan caña de azúcar y pescan peces grandes que evitan que los isleños coman carne {cite:nuzhat-al-mushtaq-2002 p. 85}."
  fr: "Une île habitée située à l'extrémité de la mer de Sanf, à quatre jours de la ville côtière de Sanf. De nombreuses personnes y vivent, et la culture de la canne à sucre et l'élevage de gros poissons permettent aux insulaires de se passer de viande {cite:nuzhat-al-mushtaq-2002 p. 85}."
  ur: "ساحلی شہر سانف سے چار دن کے فاصلے پر بحیرہ سانف کے انتہائی سرے پر ایک آبادی والا جزیرہ۔ وہاں بہت سے لوگ رہتے ہیں، جن میں گنے اور بڑی مچھلیاں ہیں جو جزیروں کے باشندوں کو گوشت کھانے سے باز رکھتی ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 85}۔"
