summary:
  ar: "حصن على طريق البصرة، تجتمع فيه الطرق، وهو على مراحل الطريق من اليمامة إلى مكة. {cite:nuzhat-al-mushtaq-2002 p. 160}"
  en: "A fortress on the road to Basra where routes meet, listed among the stages of the road from al-Yamama to Mecca. {cite:nuzhat-al-mushtaq-2002 p. 160}"
  es: "Una fortaleza en el camino a Basora, donde confluyen varias rutas, incluida entre las etapas del camino de al-Yamama a La Meca. {cite:nuzhat-al-mushtaq-2002 p. 160}"
  fr: "Une forteresse située sur la route de Bassora, au carrefour de plusieurs itinéraires, et figurant parmi les étapes de la route reliant al-Yamama à La Mecque. {cite:nuzhat-al-mushtaq-2002 p. 160}"
  ur: "بصرہ کی سڑک پر ایک قلعہ جہاں راستے ملتے ہیں، یمامہ سے مکہ تک سڑک کے مراحل میں درج ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 160}"
  tr: "Basra yolunda, yolların kesiştiği bir kale, Al-Yamama'dan Mekke'ye giden yol boyunca aşamalı olarak inşa edilmektedir. {kaynak:nuzhat-al-mushtaq-2002 s. 160}"
  id: "Sebuah benteng di jalan Basra, tempat jalan bertemu, dan bertahap di sepanjang jalan dari Al-Yamama ke Mekah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 160}"
