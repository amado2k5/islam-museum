summary:
  ar: "هزاردر قصر بالبصرة فيه أبواب كثيرة بناه شيرويه الأسواري لمرجانة أم عبيد الله بن زياد وقيل اتخذ فيه ألف باب وقيل نزل ذلك الموضع ألف أسور في ألف بيت أنزلهم كسرى."
  en: "Hazārdir, the Basra palace of many doors built by Shirawayh for Marjana — named for the thousand doors, or the thousand asāwira Kisra lodged in a thousand houses there."
  es: "Hazārdir, el palacio de Basora de muchas puertas construido por Shirawayh para Marjana, llamado así por las mil puertas, o los mil asāwira Kisra alojados en mil casas allí."
  fr: "Hazārdir, le palais aux mille portes de Bassora construit par Shirawayh pour Marjana — nommé ainsi en raison des mille portes, ou des mille asāwira Kisra logés dans mille maisons qui s'y trouvaient."
  ur: "ہزاردر، بصرہ کا محل جس کا بہت سے دروازوں کا شیراویہ نے مرجانہ کے لیے بنایا تھا - جسے ہزار دروازوں کا نام دیا گیا ہے، یا ہزار اساویرہ کسریٰ وہاں ایک ہزار گھروں میں مقیم ہیں۔"
  tr: "Hazardar, Şiruyah al-Aswari tarafından Marjana, Ubayd Allah ibn Ziyad için inşa edilmiş ve Basra'da birçok kapıya sahip bir saraydır. Orada bin kapı yapıldığı ve Khosrow tarafından inşa edilen bin duvarın da orada yapıldığı söylenir."
  id: "Hazardar adalah sebuah istana di Basra dengan banyak gerbang, dibangun oleh Shiruyah al-Aswari untuk Marjana, Ubayd Allah ibn Ziyad. Konon seribu gerbang dibangun di sana, dan konon seribu tembok dibangun di tempat itu, yang dibangun oleh Khosrow."
