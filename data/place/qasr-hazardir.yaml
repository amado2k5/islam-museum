  ar: "هزاردر قصر بالبصرة فيه أبواب كثيرة بناه شيرويه الأسواري لمرجانة أم عبيد الله بن زياد وقيل اتخذ فيه ألف باب وقيل نزل ذلك الموضع ألف أسور في ألف بيت أنزلهم كسرى."
