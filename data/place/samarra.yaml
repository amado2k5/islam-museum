label:
  en: Samarra
  ar: سامراء
  ur: سامرا
summary:
  ar: "مدينة على الضفة الشرقية لنهر دجلة، على بعد 125 كيلومترًا شمال بغداد، أُسست سنة 221هـ/836م وكانت عاصمة الخلفاء العباسيين حتى سنة 279هـ/892م. بلغت مساحتها المأهولة 57 كيلومترًا مربعًا، وبنى المتوكل فيها الجامع الكبير بمئذنته الملوية بين 235هـ/849م و237هـ/851م. وفيها مشهد الإمامين علي الهادي والحسن العسكري، وصارت بلدة زيارة منذ القرن الرابع الهجري."
  en: "A town on the east bank of the Tigris, 125 km north of Baghdad, laid out in 221/836 and the capital of the Abbasid caliphs until 279/892. At its height it covered 57 square kilometres, and al-Mutawakkil built its Great Mosque with the spiral minaret between 235/849 and 237/851. It holds the shrine of the Imams 'Ali al-Hadi and al-Hasan al-'Askari and has been a pilgrimage town since the fourth/tenth century."
  ur: "دریائے دجلہ کے مشرقی کنارے پر بغداد سے 125 کلومیٹر شمال میں واقع شہر، جو 221ھ/836ء میں بسایا گیا اور 279ھ/892ء تک عباسی خلفاء کا دارالحکومت رہا۔ عروج پر اس کا آباد رقبہ 57 مربع کلومیٹر تھا، اور متوکل نے 235ھ/849ء اور 237ھ/851ء کے درمیان یہاں ملویہ مینار والی جامع مسجد بنوائی۔ یہاں امام علی الہادی اور حسن العسکری کا مشہد ہے اور چوتھی صدی ہجری سے یہ زیارت کا قصبہ ہے۔"
