summary:
  ar: "أعظم مدن أرض لبان، على الضفة الغربية لنهر أرين، كثيرة الديار متسعة العمارة ذات كروم وغلات قائمة، ويذكر المؤلف مسافتها عن البحر شمالا {cite:nuzhat-al-mushtaq-2002 p. 870}."
  en: "The greatest city of the land of Lubān, on the west bank of the river the author calls Arīn, with many houses, vineyards and crops; the author also gives its distance north to the sea {cite:nuzhat-al-mushtaq-2002 p. 870}."
  es: "La ciudad más grande de la tierra de Lubān, en la orilla oeste del río que el autor llama Arīn, con muchas casas, viñedos y cultivos; el autor también da su distancia al norte del mar {cite:nuzhat-al-mushtaq-2002 p. 870}."
  fr: "La plus grande ville du pays de Lubān, sur la rive ouest du fleuve que l'auteur appelle Arīn, avec de nombreuses maisons, des vignobles et des récoltes; l'auteur donne également sa distance au nord de la mer {cite:nuzhat-al-mushtaq-2002 p. 870}."
  ur: "لبان کی سرزمین کا سب سے بڑا شہر، دریا کے مغربی کنارے پر مصنف آرین کہتا ہے، جس میں بہت سے مکانات، انگور کے باغات اور فصلیں ہیں۔ مصنف نے اس کا فاصلہ شمال میں سمندر تک بھی بتایا ہے۔ 870}۔"
  tr: "Lubban topraklarının en büyük şehri, Arrin Nehri'nin batı kıyısında, bağları ve mevcut ürünleriyle mimari açıdan geniş bir yapıya sahiptir. Yazar, denizden kuzeye olan mesafesinden bahseder {cite:Nuzhat-al-Mushtaq-2002, s. 870}."
  id: "Kota terbesar di tanah Lubban, di tepi barat Sungai Arrin, memiliki arsitektur luas dengan kebun anggur dan tanaman yang sudah ada. Penulis menyebutkan jaraknya dari laut di utara {kutip: Nuzhat-al-Mushtaq-2002, hlm. 870}."
