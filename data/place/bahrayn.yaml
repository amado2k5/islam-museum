summary:
  en: The pre-modern name for the eastern Arabian coastal region where Kinda first settled and where Abd al-Qays, branches of Bakr ibn Waʾil and Tamim dwelt; also a seat of the Mazdean faith among the Arabs.
  ar: الاسم القديم لإقليم الساحل الشرقي من جزيرة العرب؛ نزلت به كندة أولاً ثم أقامت به عبد القيس وبطون من بكر بن وائل وتميم، وكان من مواطن المجوسية في العرب. وعند ابن الجوزي وفي سنة 287هـ غلب أبو سعيد الجنابي القرمطي على هجر منها وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310}
