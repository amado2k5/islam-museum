label:
  en: Bahrayn (historic Eastern Arabia)
  ar: البحرين
  ur: بحرین
  es: "Bahrayán (Arabia Oriental histórica)"
  fr: "Bahrayn (Arabie orientale historique)"
  tr: "Bahreyn"
  id: "Bahrain"
summary:
  en: The pre-modern name for the eastern Arabian coastal region where Kinda first settled and where Abd al-Qays, branches of Bakr ibn Waʾil and Tamim dwelt; also a seat of the Mazdean faith among the Arabs.
  ar: الاسم القديم لإقليم الساحل الشرقي من جزيرة العرب؛ نزلت به كندة أولاً ثم أقامت به عبد القيس وبطون من بكر بن وائل وتميم، وكان من مواطن المجوسية في العرب. وعند ابن الجوزي وفي سنة 287هـ غلب أبو سعيد الجنابي القرمطي على هجر منها وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310}
  es: "Nombre premoderno de la región costera oriental de Arabia donde Kinda se asentó por primera vez y donde vivieron Abd al-Qays, ramas de Bakr ibn Waʾil y Tamim; también sede de la fe mazdeísta entre los árabes."
  fr: "Nom pré-moderne de la région côtière orientale de l'Arabie où Kinda s'est d'abord installé et où vivaient Abd al-Qays, des branches de Bakr ibn Waʾil et Tamim; également un siège de la foi mazdéenne parmi les Arabes."
  ur: "مشرقی عرب کے ساحلی علاقے کا ماقبل جدید نام جہاں پہلے کنڈا آباد ہوئے اور جہاں عبد القیس، بکر بن وائل اور تمیم کی شاخیں آباد تھیں۔ عربوں میں مزدیان عقیدے کی ایک نشست بھی ہے۔"
  tr: "Arabistan Yarımadası'nın doğu kıyı bölgesinin eski adı; Kinda önce oraya yerleşti, ardından Abdül-Kays ve Bakr ibn Wa'il ile Tamim klanları buraya yerleşti ve burası Araplar arasında Magianların anavatanlarından biri oldu. İbn al-Jawzi'ye göre, 287 Hicri yılında Abu Sa'id al-Janabi al-Qarmati buradan göçü aştı ve halkını güvence altına aldı {cite:muntazam-ibn-al-jawzi s. 310}"
  id: "Nama lama wilayah pesisir timur Semenanjung Arab; Kinda pertama kali menetap di sana, kemudian Abd al-Qays dan klan Bakr ibn Wa'il dan Tamim menetap di sana, dan kota ini menjadi salah satu tanah air para Majus di Arab. Menurut Ibn al-Jawzi, pada tahun 287 H, Abu Sa'id al-Janabi al-Qarmati berhasil mengatasi migrasi dari sana dan mengamankan rakyatnya {cite:muntazam-ibn-al-jawzi hlm. 310}"
