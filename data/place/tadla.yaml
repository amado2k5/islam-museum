  ar: "مدينة كثيرة العمارة والقوافل تأتيها وتصدر عنها، يزرع أهلها القطن كثيراً ويسافر به إلى الجهات. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  en: "A town of many buildings, on a busy caravan route, whose people grow much cotton that is carried to every region. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  es: "Un pueblo con muchos edificios, situado en una concurrida ruta de caravanas, cuyos habitantes cultivan mucho algodón que se transporta a todas las regiones. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  fr: "Une ville aux nombreux bâtiments, située sur une route caravanière très fréquentée, dont les habitants cultivent une grande quantité de coton qui est acheminé vers toutes les régions. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  ur: "کارواں کے مصروف راستے پر بہت سی عمارتوں کا ایک قصبہ، جس کے لوگ زیادہ کپاس اگاتے ہیں جو ہر علاقے میں لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 241}"
