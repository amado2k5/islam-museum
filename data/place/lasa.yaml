summary:
  ar: "مدينة صغيرة جداً على ضفة البحر الملح، وبينها وبين شرمة يوم، وفيها حمّة حارة يتطهّر فيها أهل النواحي، ويُجلب إليها المرضى فيبرؤون {cite:nuzhat-al-mushtaq-2002 p. 55}."
  en: "A very small town on the salt sea, one day from Sharma. It has hot springs where people from the region bathe and bring their sick to be cured {cite:nuzhat-al-mushtaq-2002 p. 55}."
  es: "Un pueblo muy pequeño a orillas del mar salado, a un día de Sharma. Tiene aguas termales donde la gente de la región se baña y lleva a sus enfermos para que se curen {cite:nuzhat-al-mushtaq-2002 p. 55}."
  fr: "Un tout petit village au bord de la mer salée, à une journée de Sharma. Il possède des sources thermales où les habitants de la région viennent se baigner et amener leurs malades pour se faire soigner {cite:nuzhat-al-mushtaq-2002 p. 55}."
  ur: "نمکین سمندر پر ایک بہت چھوٹا سا شہر، شرما سے ایک دن۔ اس میں گرم چشمے ہیں جہاں علاقے کے لوگ نہاتے ہیں اور اپنے بیماروں کو علاج کے لیے لاتے ہیں۔ 55}۔"
