summary:
  ar: "مدينة في بلاد السوس الأقصى تحيط بها قرى كثيرة، وفيها فواكه متنوعة وقصب السكر، ويصف الإدريسي سكر السوس بالجودة. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  en: "A city in Sus al-Aqsa surrounded by many villages, with varied fruit and sugar cane; al-Idrisi praises the sugar of Sus. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  es: "Una ciudad en Sus al-Aqsa rodeada de numerosos pueblos, con una gran variedad de frutas y caña de azúcar; al-Idrisi elogia el azúcar de Sus. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  fr: "Une ville de Sus al-Aqsa entourée de nombreux villages, où l'on cultive une grande variété de fruits et de canne à sucre; al-Idrisi fait l'éloge du sucre de Sus. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  ur: "سوس الاقصی کا ایک شہر جس کے چاروں طرف بہت سے دیہات ہیں، جس میں مختلف قسم کے پھل اور گنے ہیں۔ الادریسی نے سوس کی شکر کی تعریف کی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 227}"
  tr: "Sous'un Uzak Toprakları'nda, birçok köyle çevrili, çeşitli meyve ve şeker kamışı bulunan bir şehir. El-İdrisi, meyan kökünü yüksek kaliteli olarak tanımlar. {kaynak:nuzhat-al-mushtaq-2002 s. 227}"
  id: "Sebuah kota di Tanah Jauh Sous, dikelilingi oleh banyak desa, dengan berbagai buah dan tebu. Al-Idrisi menggambarkan licorice sebagai berkualitas tinggi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 227}"
