summary:
  ar: "مدينة الجزائر، مر بها ابن بطوطة في طريقه من المغرب إلى المشرق. وعند ابن خلدون اختطها بلكين بن زيري بن مناد الصنهاجي بأمر أبيه وعلى عهده وهي المنسوبة لبني مزغنة بساحل البحر في أيام العبيديين بالقيروان {cite:tarikh-ibn-khaldun-ibar p. 1630}، وهي عاصمة الجهاد البحري في شمال أفريقية في القرن السادس عشر؛ دخلها الأخوان عروج وخير الدين بربروسة وحكماها، ومنها انضمّ خير الدين إلى الدولة العثمانية بعد أن قوّى استحكاماتها {cite:dawlat-uthmaniyya-salabi p. 207-216}"
  en: "Algiers, which Ibn Battuta passed through on his way from the Maghrib to the East. According to Ibn Khaldun, Bulughin ibn Zirí ibn Manad al-Sanhaji founded it at his father's order and in his time; it is the one attributed to Banu Mazghanna on the sea coast, in the days of the Ubaydids at al-Qayrawan {cite:tarikh-ibn-khaldun-ibar p. 1630}. It was the capital of naval jihad in North Africa in the sixteenth century; the brothers Aruj and Khayr al-Din Barbarossa entered it and governed it, and from it Khayr al-Din joined the Ottoman state after strengthening its fortifications {cite:dawlat-uthmaniyya-salabi p. 207-216}"
