summary:
  ar: "مدينة الجزائر، مر بها ابن بطوطة في طريقه من المغرب إلى المشرق. وعند ابن خلدون اختطها بلكين بن زيري بن مناد الصنهاجي بأمر أبيه وعلى عهده وهي المنسوبة لبني مزغنة بساحل البحر في أيام العبيديين بالقيروان {cite:tarikh-ibn-khaldun-ibar p. 1630}، وهي عاصمة الجهاد البحري في شمال أفريقية في القرن السادس عشر؛ دخلها الأخوان عروج وخير الدين بربروسة وحكماها، ومنها انضمّ خير الدين إلى الدولة العثمانية بعد أن قوّى استحكاماتها {cite:dawlat-uthmaniyya-salabi p. 207-216}"
  en: "Algiers, which Ibn Battuta passed through on his way from the Maghrib to the East. According to Ibn Khaldun, Bulughin ibn Zirí ibn Manad al-Sanhaji founded it at his father's order and in his time; it is the one attributed to Banu Mazghanna on the sea coast, in the days of the Ubaydids at al-Qayrawan {cite:tarikh-ibn-khaldun-ibar p. 1630}. It was the capital of naval jihad in North Africa in the sixteenth century; the brothers Aruj and Khayr al-Din Barbarossa entered it and governed it, and from it Khayr al-Din joined the Ottoman state after strengthening its fortifications {cite:dawlat-uthmaniyya-salabi p. 207-216}"
  es: "Argel, ciudad por la que pasó Ibn Battuta en su viaje desde el Magreb hacia Oriente. Según Ibn Khaldun, Bulughin ibn Zirí ibn Manad al-Sanhaji la fundó por orden de su padre y en su época; es la que se atribuye a los Banu Mazghanna en la costa, en tiempos de los Ubaydids en al-Qayrawan {cite:tarikh-ibn-khaldun-ibar p. 1630}. Fue la capital de la yihad naval en el norte de África en el siglo XVI; los hermanos Aruj y Khayr al-Din Barbarroja entraron en ella y la gobernaron, y desde allí Khayr al-Din se unió al Estado otomano tras reforzar sus fortificaciones {cite:dawlat-uthmaniyya-salabi pp. 207-216}."
  fr: "Alger, ville traversée par Ibn Battuta lors de son voyage du Maghreb vers l'Orient. Selon Ibn Khaldun, elle fut fondée par Bulughin ibn Zirí ibn Manad al-Sanhaji sur ordre de son père et de son vivant; il s'agit de celle attribuée aux Banu Mazghanna, sur la côte, à l'époque des Ubaydides à al-Qayrawan (voir: Tarikh ibn Khaldun-Ibar, p. 1630). Elle fut la capitale du djihad naval en Afrique du Nord au XVIe siècle; les frères Aruj et Khayr al-Din Barberousse y prirent pied et la gouvernèrent, et c'est de là que Khayr al-Din rejoignit l'Empire ottoman après avoir renforcé ses fortifications (voir: Dawlat Uthmaniyya Salabi, p. 207-216)."
