  ar: "موضع بالشام كانت فيه وقعة للمسلمين مع الروم بعد فتح دمشق بعام واحد بحسب حاشية المحققين؛ قُتل فيه السائب بن الحارث السهمي في خلافة عمر بحسب ابن إسحاق."
