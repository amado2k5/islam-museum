  es: "Un lugar en al-Sham donde los musulmanes libraron una batalla contra los bizantinos un año después de la conquista de Damasco, según la nota marginal de los editores; al-Sa'ib ibn al-Harith al-Sahmi fue asesinado allí durante el califato de Umar, según Ibn Ishaq."
  fr: "Un lieu du Levant où les musulmans ont livré bataille aux Byzantins un an après la conquête de Damas, selon une note marginale des éditeurs; al-Sa'ib ibn al-Harith al-Sahmi y fut tué sous le califat d'Umar, selon Ibn Ishaq."
