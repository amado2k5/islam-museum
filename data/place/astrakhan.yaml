summary:
  ar: "مدينة وإقليم على الضفة اليسرى لنهر الفولغا، على نحو ستين ميلًا من مصبه في بحر قزوين. ذكرها ابن بطوطة سنة 1333م بوصفها مستقرًا نُسب تأسيسه إلى حاج، وإلى ذلك يُرجع اسمها «حاجي طرخان»، وضُربت فيها نقود منذ سنة 776هـ ⁦(1374-1375م)⁩؛ ثم صارت مركزًا لخانية نوغاي، وأخضعها الروس سنة 962هـ ⁦(1554م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  en: "A city and district on the left bank of the Volga, some sixty miles from its mouth in the Caspian Sea. Ibn Battuta, who passed through in 1333, mentions a settlement supposed to have been founded by a pilgrim from Mecca, which explains the name Hajji Tarkhan. Coins were struck there from 776 AH (1374-5); later it was the centre of a Noghay khanate, and the Russians conquered the khanate in 962 AH (1554) {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  es: "Ciudad y distrito situado en la margen izquierda del Volga, a unos sesenta kilómetros de su desembocadura en el mar Caspio. Ibn Battuta, que pasó por allí en 1333, menciona un asentamiento que se cree fue fundado por un peregrino de La Meca, lo que explica el nombre de Hajji Tarkhan. Allí se acuñaron monedas desde el año 776 de la Hégira (1374-1375); posteriormente fue el centro de un kanato noghi, y los rusos conquistaron el kanato en el año 962 de la Hégira (1554) {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  fr: "Ville et district situés sur la rive gauche de la Volga, à une centaine de kilomètres de son embouchure dans la mer Caspienne. Ibn Battuta, qui y passa en 1333, mentionne un établissement supposément fondé par un pèlerin venu de La Mecque, ce qui explique le nom de Hajji Tarkhan. Des pièces de monnaie y furent frappées à partir de 776 AH (1374-1375); plus tard, la ville devint le centre d'un khanat noghaï, conquis par les Russes en 962 AH (1554) {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  ur: "وولگا کے بائیں کنارے پر واقع ایک شہر اور ضلع، بحیرہ کیسپین میں اس کے منہ سے کوئی ساٹھ میل دور ہے۔ ابن بطوطہ، جو 1333 میں گزرا، ایک بستی کا ذکر کرتا ہے جس کے بارے میں خیال کیا جاتا ہے کہ مکہ کے ایک حاجی نے اس کی بنیاد رکھی تھی، جو حاجی ترکھان کے نام کی وضاحت کرتی ہے۔ وہاں 776ھ (1374-5) سے سکے چلائے گئے۔ بعد میں یہ نوگھے خانات کا مرکز تھا، اور روسیوں نے 962 ہجری (1554) میں خانیت کو فتح کر لیا۔ 1 ص۔ 770}۔"
