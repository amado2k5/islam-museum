  en: "Astrakhan"
summary:
  ar: "مدينة وإقليم على الضفة اليسرى لنهر الفولغا، على نحو ستين ميلًا من مصبه في بحر قزوين. ذكرها ابن بطوطة سنة 1333م بوصفها مستقرًا نُسب تأسيسه إلى حاج، وإلى ذلك يُرجع اسمها «حاجي طرخان»، وضُربت فيها نقود منذ سنة 776هـ (1374-1375م)؛ ثم صارت مركزًا لخانية نوغاي، وأخضعها الروس سنة 962هـ (1554م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
  en: "A city and district on the left bank of the Volga, some sixty miles from its mouth in the Caspian Sea. Ibn Battuta, who passed through in 1333, mentions a settlement supposed to have been founded by a pilgrim from Mecca, which explains the name Hajji Tarkhan. Coins were struck there from 776 AH (1374-5); later it was the centre of a Noghay khanate, and the Russians conquered the khanate in 962 AH (1554) {cite:encyclopaedia-of-islam-2 vol. 1 p. 770}."
