summary:
  ar: "زالق حصن بسجستان بينه وبين مدينة سجستان خمسة فراسخ؛ أغار عليه الربيع بن زياد يوم مهرجان فأخذ دهقانه فافتدى نفسه بأن ركز عنزة ثم غمرها ذهباً وفضة."
  en: "Zaliq, the Sijistan fortress five farsakhs from the capital; raided by al-Rabi' on Mihrjan, its dahqan ransoming himself with his spear planted and heaped over with gold and silver."
  es: "Zaliq, la fortaleza de Sijistan, a cinco farsakhs de la capital; asaltada por al-Rabi' en Mihrjan, su dahqan se redimió con su lanza clavada y cubierta de oro y plata."
  fr: "Zaliq, la forteresse du Sijistan à cinq farsakhs de la capitale; pillée par al-Rabi' sur Mihrjan, son dahqan se rachetant avec sa lance plantée et recouverte d'or et d'argent."
  ur: "زلق، راجدھانی سے پانچ فرسخ کے فاصلے پر سجستان کا قلعہ؛ ربیع نے مہرجان پر چھاپہ مارا، اس کے دہقان نے اپنے نیزے سے خود کو چھڑایا اور سونے اور چاندی کا ڈھیر لگا دیا۔"
  tr: "Sijistan'da, şehri ile Sijistan arasında beş farsakh uzaklıktaki bir kaleyi ele geçirdi; Maharjan gününde Rabi' ibn Ziyad ona baskın düzenledi, çiftçisini yakaladı ve bir keçiyi tutup altın ve gümüş yağmuruna tutarak kendini fidye etti."
  id: "Ia merebut sebuah benteng di Sijistan lima farsakh antara benteng itu dan kota Sijistan; pada hari Maharjan, Rabi ibn Ziyad menyerangnya, menangkap petaninya, dan menebus dirinya dengan menembak seekor kambing lalu menyiramnya dengan emas dan perak."
