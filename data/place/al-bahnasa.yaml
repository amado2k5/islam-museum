label: { ar: "البهنسا", en: "al-Bahnasa", es: "al-Bahnasa", fr: "al-Bahnasa", ur: "البھناسہ", tr: "Al-Bahnsa", id: "Al-Bahnsa" }
summary:
  ar: "مدينة عامرة جامعة لأمم شتى، كانت فيها طرز تنسج الستور المعروفة بالبهنسية للخاصة والعامة، وتوجد فيها أسماء الطرز منقوشة على المنسوجات. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  en: "A populous city of mixed peoples, known for its weaving workshops that produced the curtains called al-Bahnasiyya for elite and common buyers. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  es: "Una ciudad populosa de pueblos diversos, conocida por sus talleres de tejido que producían las cortinas llamadas al-Bahnasiyya para compradores de la élite y del pueblo llano. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  fr: "Ville peuplée et multiculturelle, réputée pour ses ateliers de tissage qui produisaient les rideaux appelés al-Bahnasiyya, destinés à une clientèle aisée et populaire. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  ur: "مخلوط لوگوں کا ایک آبادی والا شہر، جو اپنی بُنائی کی ورکشاپس کے لیے جانا جاتا ہے جس نے اشرافیہ اور عام خریداروں کے لیے البہنسیہ نامی پردے تیار کیے تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 130}"
  tr: "Çeşitli ulusları bir araya getiren, 'Bahhansiyya' olarak bilinen dokuma desenlerinin hem özel hem de kamu amaçları için dokunduğu, bu nakışların isimlerinin tekstillere kazındığı hareketli bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 130}"
  id: "Sebuah kota yang ramai yang mengumpulkan berbagai bangsa, di mana pola tenun yang dikenal sebagai 'Bahhansiyya' ditenun untuk penggunaan pribadi maupun publik, dan nama-nama sulaman ini diukir pada tekstil. {cite:Nuzhat-al-Mushtaq-2002 hlm. 130}"
