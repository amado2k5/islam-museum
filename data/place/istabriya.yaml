summary:
  ar: "مدينة متحضرة عامرة أسواقها فسيحة وطرقاتها متقنة، ويذكر المؤلف أنها تبعد عن أشكالة على الساحل عشرين ميلا {cite:nuzhat-al-mushtaq-2002 p. 915}."
  en: "A civilised, populous city with wide markets and well-laid streets; the author gives twenty miles along the coast from Ashkāla {cite:nuzhat-al-mushtaq-2002 p. 915}."
  es: "Una ciudad civilizada y populosa con amplios mercados y calles bien trazadas; el autor menciona veinte millas a lo largo de la costa desde Ashkāla {cite:nuzhat-al-mushtaq-2002 p. 915}."
  fr: "Une ville civilisée et peuplée avec de vastes marchés et des rues bien aménagées; l'auteur indique vingt miles le long de la côte depuis Ashkāla {cite:nuzhat-al-mushtaq-2002 p. 915}."
  ur: "ایک مہذب، آبادی والا شہر جس میں وسیع بازار اور اچھی سڑکیں ہیں۔ مصنف اشکالہ سے ساحل کے ساتھ بیس میل بتاتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 915}۔"
  tr: "Geniş pazarları ve özenle tasarlanmış yolları olan medeni ve refah içinde bir şehir. Yazar, buranın kıyıda Ashkala'dan yirmi mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 915}."
  id: "Sebuah kota yang beradab dan makmur dengan pasar yang luas dan jalan-jalan yang dirancang dengan baik. Penulis menyebutkan bahwa kota ini berjarak dua puluh mil dari Ashkala di pesisir {cite:Nuzhat-al-mushtaq-2002, hlm. 915}."
