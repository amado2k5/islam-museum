label: { ar: "جبل تانسف", en: "Jabal Tansaf" }
summary:
  ar: "جبل يُبلغ إليه من الطيلمون بمرحلتين، وله حافة ملساء فيها شق ضيق. يحكي المؤلف، نقلا عما هو مشهور عنده، أن طيورا تأتي في وقت معلوم من السنة فتدخل رؤوسها في الشق فتبقى مضطربة حتى تموت، ويذكر أن ذلك معلوم ومثبت في كتب كثيرة. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  en: "A mountain reached in two stages from Jabal al-Tilmun, with a smooth face and a narrow crack. The author relates, as a widely known account, that birds come at a fixed time of the year, put their heads into the crack and die there. He says the report is recorded in many books; he does not verify it himself. {cite:nuzhat-al-mushtaq-2002 p. 127}"
