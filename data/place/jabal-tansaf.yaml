summary:
  ar: "جبل يُبلغ إليه من الطيلمون بمرحلتين، وله حافة ملساء فيها شق ضيق. يحكي المؤلف، نقلا عما هو مشهور عنده، أن طيورا تأتي في وقت معلوم من السنة فتدخل رؤوسها في الشق فتبقى مضطربة حتى تموت، ويذكر أن ذلك معلوم ومثبت في كتب كثيرة. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  en: "A mountain reached in two stages from Jabal al-Tilmun, with a smooth face and a narrow crack. The author relates, as a widely known account, that birds come at a fixed time of the year, put their heads into the crack and die there. He says the report is recorded in many books; he does not verify it himself. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  es: "Una montaña a la que se accede en dos etapas desde Jabal al-Tilmun, con una ladera lisa y una estrecha grieta. El autor relata, como un relato ampliamente conocido, que los pájaros llegan en una época fija del año, introducen la cabeza en la grieta y mueren allí. Afirma que este relato está recogido en muchos libros; no lo verifica personalmente. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  fr: "Une montagne accessible en deux étapes depuis Jabal al-Tilmun, à la face lisse et présentant une étroite crevasse. L'auteur rapporte, d'après un récit largement répandu, que des oiseaux viennent à une période fixe de l'année, y glissent leur tête et y meurent. Il précise que ce récit est consigné dans de nombreux ouvrages; il ne le vérifie pas lui-même. {cite:nuzhat-al-mushtaq-2002 p. 127}"
