summary:
  ar: "أرز الروم ⁦(أرزروم)⁩ مدينة أرمينية إسلامية على حدود بلاد الروم؛ في سنة خمس وستمائة نازلتها الكرج فافتتحوها بالسيف وأحرقوها على ما في نسخة الشذرات واسمها فيها «أرحلس» {cite:shadharat-dhahab p. 22}."
  en: "Arzan al-Rum (Erzurum), the Muslim Armenian city on the Byzantine marches; in 605 the Georgians besieged, stormed and burned it — the manuscript reads the name 'Arhalis' {cite:shadharat-dhahab p. 22}."
  es: "Arzan al-Rum (Erzurum), la ciudad musulmana armenia en las marcas bizantinas; en 605 los georgianos la sitiaron, la asaltaron y la incendiaron; el manuscrito menciona el nombre 'Arhalis' {cite:shadharat-dhahab p. 22}."
  fr: "Arzan al-Rum (Erzurum), la ville arménienne musulmane sur les marches byzantines; en 605, les Géorgiens l'assiégèrent, la prirent d'assaut et l'incendièrent — le manuscrit porte le nom 'Arhalis' {cite:shadharat-dhahab p. 22}."
  ur: "بازنطینی مارچوں پر مسلم آرمینیائی شہر ارزان الروم ⁦(ارزورم)⁩؛ 605 میں جارجیوں نے محاصرہ کیا، دھاوا بول دیا اور اسے جلا دیا - مخطوطہ میں 'ارھالیس' کا نام لکھا گیا ہے۔ 22}۔"
  tr: "Arz al-Rum (Erzurum), Romalıların topraklarının sınırlarında yer alan bir İslam Ermeni şehridir; 605 Hicri yılında, Karj tarafından fethedilip kılıçla fethedilmiş ve yakılmıştır; el yazması parçalarına göre 'Arhals' (atıf:shadharat-dhahab, s. 22} olarak adlandırılmıştır."
  id: "Arz al-Rum (Erzurum) adalah sebuah kota Armenia Islam di perbatasan tanah Romawi; pada tahun 605 H, kota ini ditaklukkan oleh Karj, ditaklukkan dengan pedang, dan dibakarnya, menurut manuskrip fragmen yang disebut 'Arhals' {cite:shadharat-dhahab, hlm. 22}."
