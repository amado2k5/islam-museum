summary:
  ar: "مدينة كبيرة على رأس المجاز الذي يعبر منه إلى البر المتصل، ويذكر المؤلف أنها تبعد عن هستينكش شرقا سبعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 945}."
  en: "A large city at the head of the strait crossed to the mainland; the author gives seventy miles east of Hastīnkish {cite:nuzhat-al-mushtaq-2002 p. 945}."
  es: "Una gran ciudad en la cabecera del estrecho cruzaba al continente; el autor indica setenta millas al este de Hastīnkish {cite:nuzhat-al-mushtaq-2002 p. 945}."
  fr: "Une grande ville située à l'extrémité du détroit permettait de rejoindre le continent; l'auteur indique soixante-dix milles à l'est de Hastīnkish {cite:nuzhat-al-mushtaq-2002 p. 945}."
  ur: "آبنائے کے سر پر ایک بڑا شہر سرزمین کو عبور کر گیا۔ مصنف ہستنکیش سے ستر میل مشرق بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص 945}۔"
  tr: "Majaz'ın tepesinde büyük bir şehir ve buradan bağlı anakaraya geçilmektedir. Yazar, buranın Hastingsh'in yetmiş mil doğusunda olduğunu belirtir {cite:nuzhat-al-mushtaq-2002, s. 945}."
  id: "Sebuah kota besar di puncak majaz dari mana seseorang menyeberang ke daratan utama yang terhubung. Penulis menyebutkan bahwa kota ini berjarak tujuh puluh mil sebelah timur Hastingsh {cite:nuzhat-al-mushtaq-2002, hlm. 945}."
