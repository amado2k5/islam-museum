summary:
  ar: "باميان من أوائل الهند مما يلي سجستان بها بيت عظيم من بيوت البدد يحله الزهاد والعباد وبه من الأصنام الذهب المرصعة ما يجاوز القدر، تحجه الهند من أقاصي بلادها برا وبحرا، وإلى هذا الموضع بلغ يعقوب بن الليث لا قصد لفتح الهند، والصور التي أنفذت إلى مدينة السلام من ذلك الموضع من الباميان حلب عند فتحها {cite:fihrist-ibn-al-nadim p. 486}."
  en: "Bamiyan — its great idol house and the images sent to Baghdad after the conquest {cite:fihrist-ibn-al-nadim}"
