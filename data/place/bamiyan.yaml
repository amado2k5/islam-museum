summary:
  ar: "باميان من أوائل الهند مما يلي سجستان بها بيت عظيم من بيوت البدد يحله الزهاد والعباد وبه من الأصنام الذهب المرصعة ما يجاوز القدر، تحجه الهند من أقاصي بلادها برا وبحرا، وإلى هذا الموضع بلغ يعقوب بن الليث لا قصد لفتح الهند، والصور التي أنفذت إلى مدينة السلام من ذلك الموضع من الباميان حلب عند فتحها {cite:fihrist-ibn-al-nadim p. 486}."
  en: "Bamiyan — its great idol house and the images sent to Baghdad after the conquest {cite:fihrist-ibn-al-nadim}"
  es: "Bamiyán: su gran casa de ídolos y las imágenes enviadas a Bagdad después de la conquista {cite:fihrist-ibn-al-nadim}"
  fr: "Bamiyan — son grand temple des idoles et les images envoyées à Bagdad après la conquête {cite:fihrist-ibn-al-nadim}"
  ur: "بامیان - اس کا عظیم بت خانہ اور فتح کے بعد بغداد کو بھیجی گئی تصاویر"
  tr: "Bamiyan, Hindistan'ın en eski bölgelerinden biridir ve Sijistan yakınlarında yer alır. Badad evlerinden oluşan büyük bir evi vardır; münzeviler ve ibadet edenler tarafından süslenmiş, kaderin ötesinde altın heykellerle süslenmiştir. Hindistan, topraklarının en uzak köşelerinden kara ve deniz yoluyla hac yapar. Yaqub ibn al-Layth, Hindistan'ı fethetme niyeti olmadan buraya ulaşmıştır. Bamiyan'dan barış şehrine gönderilen görüntüler, fetih zamanındaki Halep'ten alınmıştır {cite:fihrist-ibn-al-nadim s. 486}."
  id: "Bamiyan adalah salah satu bagian tertua di India, terletak dekat Sijistan. Kota ini memiliki rumah besar yang dihuni oleh para Badad, dihiasi oleh para pertapa dan pemuja, dihiasi dengan patung emas yang melampaui takdir. India melakukan ziarah dari penjuru terjauh tanahnya melalui darat dan laut. Yaqub ibn al-Layth tiba di tempat ini tanpa niat menaklukkan India. Patung-patung yang dikirim ke kota damai dari tempat itu dari Bamiyan berasal dari Aleppo pada masa penaklukannya {cite:fihrist-ibn-al-nadim hlm. 486}."
