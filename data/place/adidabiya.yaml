summary:
  ar: "مدينة على ساحل برقة، كانت محطة عسكرية وسوقًا تجاريًا كبيرًا، بناها الفاطميون مسجدًا كبيرًا سنة نحو 300 للهجرة، ثم تراجعت بعد الغزو الهلالي والسليمي في القرن الخامس للهجرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  en: "A town of Cyrenaica on the coast, once a military station and a great commercial centre, with a substantial mosque built by the Fatimid prince Abu 'l-Qasim about 300/912. Its prosperity declined after the great Hilali and Sulami invasion in the 5th/11th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  es: "Ciudad de Cirenaica en la costa, que fue en su día una base militar y un importante centro comercial, con una gran mezquita construida por el príncipe fatimí Abu 'l-Qasim alrededor del año 300/912. Su prosperidad decayó tras la gran invasión de los hilalíes y sulamíes en el siglo V/XI {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  fr: "Une ville de Cyrénaïque sur la côte, autrefois station militaire et grand centre commercial, avec une mosquée importante construite par le prince fatimide Abu 'l-Qasim vers 300/912. Sa prospérité déclina après la grande invasion des Hilali et des Sulami au 5e/11e siècle {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  ur: "ساحل پر سائرینیکا کا ایک قصبہ، جو کبھی ایک فوجی اسٹیشن اور ایک عظیم تجارتی مرکز تھا، جس میں فاطمی شہزادے ابو القاسم نے تقریباً 300/912 میں ایک بڑی مسجد بنائی تھی۔ 5ویں/11ویں صدی میں عظیم ہلالی اور سلیمی حملے کے بعد اس کی خوشحالی میں کمی آئی۔ 1 ص۔ 226}۔"
  tr: "Cyrenica kıyısında bir şehir olan bu şehir, askeri bir istasyon ve büyük bir ticaret pazarıydı. Fatımiler yaklaşık 300 Hicride büyük bir cami inşa ettiler, ardından beşinci yüzyıldaki Hilali ve Süleymi istilalarından sonra gerilediler {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 226}."
  id: "Sebuah kota di pesisir Cyrenaica, kota ini merupakan stasiun militer dan pasar komersial besar. Umat Fatimiyah membangun masjid besar sekitar tahun 300 H, kemudian mengalami kemunduran setelah invasi Hilali dan Sulaymi pada abad kelima H {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 226}."
