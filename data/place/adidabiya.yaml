summary:
  ar: "مدينة على ساحل برقة، كانت محطة عسكرية وسوقًا تجاريًا كبيرًا، بناها الفاطميون مسجدًا كبيرًا سنة نحو 300 للهجرة، ثم تراجعت بعد الغزو الهلالي والسليمي في القرن الخامس للهجرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
  en: "A town of Cyrenaica on the coast, once a military station and a great commercial centre, with a substantial mosque built by the Fatimid prince Abu 'l-Qasim about 300/912. Its prosperity declined after the great Hilali and Sulami invasion in the 5th/11th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 226}."
