summary:
  ar: "مدينة جليلة نبيلة فيها رجال أنجاد وقرى عامرة وجبايات وافرة، وتبعد عن دجون نحو ثمانين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 742}"
  en: "A great and noble city with brave men, populous villages and abundant tax revenue, about eighty miles from Dijon. {cite:nuzhat-al-mushtaq-2002 p. 742}"
  es: "Una gran y noble ciudad con hombres valientes, pueblos poblados y abundantes ingresos fiscales, a unos ochenta kilómetros de Dijon. {cite:nuzhat-al-mushtaq-2002 p. 742}"
  fr: "Une grande et noble ville, peuplée d'hommes courageux, de villages animés et aux abondantes recettes fiscales, située à environ 130 kilomètres de Dijon. {cite:nuzhat-al-mushtaq-2002 p. 742}"
  ur: "ڈیجون سے تقریباً اسی میل کے فاصلے پر بہادر آدمیوں، آبادی والے دیہاتوں اور ٹیکس کی وافر آمدنی والا ایک عظیم اور عظیم شہر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 742}"
  tr: "Soylu asil adamların, gelişen köylerin ve bol vergilerin bulunduğu, Dajon'a yaklaşık seksen mil uzaklıkta bulunan soylu bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 742}"
  id: "Sebuah kota bangsawan dengan pria bangsawan yang berkembang, desa-desa yang makmur, dan pajak yang melimpah, terletak sekitar delapan puluh mil dari Dajon. {cite:Nuzhat-al-Mushtaq-2002 hlm. 742}"
