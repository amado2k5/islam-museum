summary:
  ar: "مدينة جبلية سهلية، من أنزه بلاد فرغانة، وقدرها مثل أخسيكث، ولها ربض عامر كبير وأسواق. {cite:nuzhat-al-mushtaq-2002 p. 507}"
  en: "A town of hills and plains, among the most pleasant lands of Farghana, as large as Akhsikath, with a great populous suburb and markets. {cite:nuzhat-al-mushtaq-2002 p. 507}"
  es: "Una ciudad de colinas y llanuras, entre las tierras más agradables de Farghana, tan grande como Akhsikath, con un gran suburbio populoso y mercados. {cite:nuzhat-al-mushtaq-2002 p. 507}"
  fr: "Ville de collines et de plaines, parmi les plus belles régions de Farghana, aussi grande qu'Akhsikath, avec une banlieue très peuplée et des marchés. {cite:nuzhat-al-mushtaq-2002 p. 507}"
  ur: "پہاڑیوں اور میدانوں کا ایک قصبہ، فرغانہ کی سب سے خوشگوار زمینوں میں سے، اخسیکاٹھ جتنا بڑا، بہت زیادہ آبادی والا مضافاتی اور بازار۔ {حوالہ: نزہت المشتاق-2002 ص۔ 507}"
  tr: "Fergana'nın en soylu topraklarından biri olan, dağlık bir ovalık şehir olan bu şehir, büyüklüğü Akhisikth gibidir ve büyük, zengin bir banliyösü ile pazarları vardır. {kaynak:nuzhat-al-mushtaq-2002 s. 507}"
  id: "Kota dataran pegunungan, salah satu tanah paling mulia di Fergana, ukurannya mirip dengan Akhisikth, dan memiliki pinggiran kota yang luas dan makmur serta pasar-pasar. {cite:nuzhat-al-mushtaq-2002 hlm. 507}"
