label: { ar: "جزائر ذيبة المهل ⁦(جزر المالديف)⁩", en: "The Maldives (Dhibat al-Mahal)", ur: "مالدیپ ⁦(ذیبۃ المہل کے جزائر)⁩" }
summary:
  ar: "سلسلة جزر في البحر الهندي يسميها ابن بطوطة جزائر ذيبة المهل ويعدها إحدى عجائب الدنيا، نحو ألفي جزيرة في حلقات، وصلها بعد عشرة أيام من قالقوط، فوصف أقاليمها ومعاشها من سمك قلب الماس والنارجيل وتجارة الودع والقنبر، وعادات أهلها، وحكم السلطانة خديجة، وما رواه له أهلها عن سبب إسلامهم على يد أبي البركات البربري، وأقام بها نحو سنة ونصف وولي قضاءها {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 583-585} {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 599}."
  en: "An Indian Ocean archipelago that Ibn Battuta calls the islands of Dhibat al-Mahal and counts among the wonders of the world: some two thousand islands set in rings. He reached it ten days out of Calicut and describes its districts, its living from the qulb al-mas fish, the coconut and the trade in cowries and coir, its people's customs, the rule of Sultana Khadija, and what its people told him of their conversion at the hands of Abu al-Barakat al-Barbari; he stayed about a year and a half and served as its qadi {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 583-585} {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 599}."
  ur: "بحرِ ہند کا ایک جزیرہ نما سلسلہ جسے ابن بطوطہ ذیبۃ المہل کے جزائر کہتا اور دنیا کے عجائب میں شمار کرتا ہے: حلقوں میں بٹے تقریباً دو ہزار جزیرے۔ وہ قالیقوط سے دس دن کے سفر کے بعد یہاں پہنچا، اور اس نے اس کے اقالیم، قلب الماس مچھلی، ناریل، کوڑیوں اور قنبر کی تجارت، اہلِ جزائر کے رسوم، سلطانہ خدیجہ کی حکومت، اور ابو البرکات البربری کے ہاتھوں ان کے اسلام کا وہ قصہ بیان کیا جو اہلِ جزائر نے اسے سنایا؛ وہ تقریباً ڈیڑھ سال رہا اور وہاں کا قاضی بنا {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 583-585} {cite:rihla-ibn-battuta-ihya-al-ulum-1987 p. 599}۔"
