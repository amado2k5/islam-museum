summary:
  ar: "مدينة على الساحل في أرض بربرة، ويزرع أهلها الذرة على ضفة النيل، وتبعد عن النجا وعن خاقون مسافات متفاوتة في البر والبحر. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  en: "A coastal town in Barbara land. Its people grow sorghum by the Nile, and it lies at varying distances by sea and land from al-Naja and Khaqun. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  es: "Un pueblo costero en la región de Bárbara. Sus habitantes cultivan sorgo a orillas del Nilo y se encuentra a distancias variables por mar y tierra de al-Naja y Khaqun. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  fr: "Ville côtière du pays de Barbara. Ses habitants cultivent le sorgho au bord du Nil. Elle se situe à des distances variables, par voie maritime et terrestre, d'al-Naja et de Khaqun. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  ur: "باربرا لینڈ میں ایک ساحلی شہر۔ اس کے لوگ دریائے نیل کے کنارے جوارم اگاتے ہیں، اور یہ النجا اور خاقون سے سمندر اور زمین کے راستے مختلف فاصلے پر واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 48}"
  tr: "Berbera topraklarında kıyıda yer alan bir şehir, sakinleri Nil kıyısında mısır yetiştirir ve Naga ile Khakon'dan kara ve deniz mesafelerinde farklı mesafelerde yer almaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 48}"
  id: "Sebuah kota di pesisir di tanah Berbera, yang penduduknya menanam jagung di tepi Sungai Nil, dan terletak pada jarak yang berbeda-beda di darat dan laut dari Naga dan Khakon. {cite:nuzhat-al-mushtaq-2002 hlm. 48}"
