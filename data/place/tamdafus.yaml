summary:
  ar: "مدينة صغيرة خربة، بقي من سورها بعضه، وفيها بقايا بناء قديم وهياكل وأصنام حجارة، وتبعد عن الجزائر شرقاً ثمانية عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 258}"
  en: "A small ruined town, with part of its wall standing, ancient remains and stone idols; eighteen miles east of Algiers. {cite:nuzhat-al-mushtaq-2002 p. 258}"
  es: "Un pequeño pueblo en ruinas, con parte de su muralla en pie, restos antiguos e ídolos de piedra; a dieciocho millas al este de Argel. {cite:nuzhat-al-mushtaq-2002 p. 258}"
  fr: "Une petite ville en ruines, dont une partie des remparts est encore debout, des vestiges antiques et des idoles de pierre; à dix-huit milles à l’est d’Alger. {cite:nuzhat-al-mushtaq-2002 p. 258}"
  ur: "ایک چھوٹا سا تباہ شدہ شہر، جس کی دیوار کا کچھ حصہ کھڑا ہے، قدیم باقیات اور پتھر کے بت؛ الجزائر کے مشرق میں اٹھارہ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 258}"
  tr: "Sadece duvarlarının bir kısmı kalmış, eski bir bina, yapılar ve taş heykellerin kalıntılarını barındıran küçük harabe bir şehir. Cezayir'in on sekiz mil doğusundadır. {cite:nuzhat-al-mushtaq-2002 s. 258}"
  id: "Sebuah kota kecil yang hancur dengan hanya sebagian temboknya yang tersisa, berisi sisa-sisa bangunan tua, struktur, dan patung batu. Kota ini berjarak delapan belas mil sebelah timur Aljazair. {cite:nuzhat-al-mushtaq-2002 hlm. 258}"
