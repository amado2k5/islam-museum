summary:
  ar: "مدينة جليلة يحيط بها البحر من جهات، وهي في ذاتها حسنة البناء فسيحة الأرجاء، وبها مرافق ومرسى، وتبعد عن غوشيت اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  en: "A great city on the sea on several sides, handsome in its build and spacious in its open ground, with facilities and a harbour; twelve miles from Gushit. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  es: "Una gran ciudad costera, de hermosa arquitectura y amplias zonas verdes, con servicios y puerto; a doce millas de Gushit. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  fr: "Une grande ville en bord de mer sur plusieurs côtés, belle par son architecture et spacieuse par ses espaces ouverts, dotée d'infrastructures et d'un port; à douze milles de Gushit. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  ur: "کئی اطراف سے سمندر پر ایک عظیم شہر، اپنی تعمیر میں خوبصورت اور کھلے میدان میں کشادہ، سہولیات اور بندرگاہ کے ساتھ؛ گشیت سے بارہ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 763}"
  tr: "Her tarafı denizle çevrili soylu bir şehir, iyi inşa edilmiş ve geniş, olanakları ve marinası ile Gouchet'e on iki mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 763}"
  id: "Kota yang mulia yang dikelilingi laut di segala sisi, kota ini dibangun dengan baik dan luas, dengan fasilitas dan marina, serta berjarak dua belas mil dari Gouchet. {cite:nuzhat-al-mushtaq-2002 hlm. 763}"
