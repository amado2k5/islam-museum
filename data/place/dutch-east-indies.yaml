summary:
  ar: "أرخبيل جنوب شرقي آسيا الذي كانت تحكمه هولندا، ويعرضه شكيب أرسلان في فصل يتضمن محاضرة للسيد إسماعيل العطاس ألقاها في القاهرة سنة 1929. تعرض المحاضرة تاريخ الجزر من بقايا ما قبل التاريخ حتى الاستعمار الهولندي، وتذكر أن المسلمين فيها كانوا نحو خمسين مليوناً بحسب إحصاء ذكره المؤلف، وأن الزراعة فيها تقوم على الأرز والسكر والجوز الهندي وغيرها. ويذكر أرسلان أن الأرقام الرسمية الهولندية وأرقام كتّاب فرنسيين لم تكن متفقة. هذه صورة من مصدر واحد عن أحوال الجزر في عشرينيات القرن العشرين، ولا تُعد إحصاءً محققاً."
  en: "The Dutch-ruled archipelago of Southeast Asia. Arslan's chapter reprints a lecture by Sayyid Isma'il al-Attas, delivered in Cairo in 1929, which surveys the islands from prehistory to Dutch rule. It gives a figure of about fifty million Muslims in the Dutch colonies, drawn from a census that Arslan's source reports, and describes the main crops. This is one 1920s source's picture of the islands, not a verified census."
