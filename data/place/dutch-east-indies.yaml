summary:
  ar: "أرخبيل جنوب شرقي آسيا الذي كانت تحكمه هولندا، ويعرضه شكيب أرسلان في فصل يتضمن محاضرة للسيد إسماعيل العطاس ألقاها في القاهرة سنة 1929. تعرض المحاضرة تاريخ الجزر من بقايا ما قبل التاريخ حتى الاستعمار الهولندي، وتذكر أن المسلمين فيها كانوا نحو خمسين مليوناً بحسب إحصاء ذكره المؤلف، وأن الزراعة فيها تقوم على الأرز والسكر والجوز الهندي وغيرها. ويذكر أرسلان أن الأرقام الرسمية الهولندية وأرقام كتّاب فرنسيين لم تكن متفقة. هذه صورة من مصدر واحد عن أحوال الجزر في عشرينيات القرن العشرين، ولا تُعد إحصاءً محققاً."
  en: "The Dutch-ruled archipelago of Southeast Asia. Arslan's chapter reprints a lecture by Sayyid Isma'il al-Attas, delivered in Cairo in 1929, which surveys the islands from prehistory to Dutch rule. It gives a figure of about fifty million Muslims in the Dutch colonies, drawn from a census that Arslan's source reports, and describes the main crops. This is one 1920s source's picture of the islands, not a verified census."
  es: "El archipiélago del sudeste asiático bajo dominio neerlandés. El capítulo de Arslan reproduce una conferencia de Sayyid Isma'il al-Attas, impartida en El Cairo en 1929, que ofrece un panorama de las islas desde la prehistoria hasta el dominio neerlandés. Menciona una cifra de aproximadamente cincuenta millones de musulmanes en las colonias neerlandesas, según un censo citado por la fuente de Arslan, y describe los principales cultivos. Esta es una descripción de las islas que ofrece una fuente de la década de 1920, no un censo verificado."
  fr: "L'archipel d'Asie du Sud-Est sous domination néerlandaise. Le chapitre d'Arslan reproduit une conférence de Sayyid Isma'il al-Attas, donnée au Caire en 1929, qui retrace l'histoire des îles de la préhistoire à la domination néerlandaise. On y trouve le chiffre d'environ cinquante millions de musulmans dans les colonies néerlandaises, tiré d'un recensement cité par la source d'Arslan, ainsi qu'une description des principales cultures. Il s'agit là d'une vision des îles issue d'une source des années 1920, et non d'un recensement vérifié."
  ur: "جنوب مشرقی ایشیا کا ڈچ حکومت والا جزیرہ نما۔ ارسلان کا باب 1929 میں قاہرہ میں دیا گیا سید اسماعیل العطاس کا ایک لیکچر دوبارہ پرنٹ کرتا ہے، جس میں جزائر سے قبل تاریخ سے لے کر ڈچ حکمرانی تک کا سروے کیا گیا ہے۔ یہ ڈچ کالونیوں میں تقریباً پچاس ملین مسلمانوں کا اعداد و شمار دیتا ہے، جو مردم شماری سے اخذ کیا گیا ہے جو ارسلان کا ذریعہ بتاتا ہے، اور اہم فصلوں کی وضاحت کرتا ہے۔ یہ جزائر کی 1920 کی دہائی کی تصویر ہے، مردم شماری کی تصدیق شدہ نہیں۔"
