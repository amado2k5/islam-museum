  id: "Zabulistan adalah wilayah di selatan Kabul dan Sijistan; wilayah ini ditaklukkan oleh Abdul Rahman bin Samura, yang memecahkan rakyatnya dan menangkapnya, lalu dikalahkan oleh Ratbil hingga ia mencapai Bast."
