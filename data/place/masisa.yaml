label: { ar: "المصيصة", en: "Masisa (Mopsuestia)", es: "Masisa (Mopsuestia)", fr: "Masisa (Mopsuestia)", ur: "مسیسا ⁦(موپسوسٹیا)⁩" }
summary:
  ar: "المصيصة حصن الثغر الشامي على جيحان؛ لم يسكنها المسلمون حتى بنى حصنها عبد الله بن عبد الملك سنة 84 على أساسه القديم وسكّن بها ثلاثمائة منتخب وبنى مسجداً فوق تلها، وكانت بها كنيسة هريا تقصدها طوالع الروم؛ وأراد عمر بن عبد العزيز هدمها فأمسك لما عُلّم أنها تدفع عن أنطاكية وبنى جامع كفربيا بصهريجه؛ ثم بنى هشام الربض ومروان الخصوص والحائط والخندق، وفرض أبو العباس بها أربع مائة زيادة وأقطعهم، وتعاقب على عمران الثغور المنصور والمهدي وهارون."
  en: "Masisa (Mopsuestia), the Syrian march-fortress on the Jayhan; unpeopled by Muslims until Abdullah ibn Abd al-Malik built its fortress in year 84 on the ancient foundation, settling three hundred picked men and a mosque on its hill, while its church Herya had been the Byzantines' wintering goal; Umar ibn Abd al-Aziz meant to raze it and held back when shown it shielded Antioch, building the Kafarbayya mosque with its cistern; Hisham added the rabad, Marwan the eastern suburb with wall, gate and moat, Abu al-Abbas four hundred more garrison-men with estates, and the Mansur–Mahdi–Harun succession kept building the marches."
  es: "Masisa (Mopsuestia), la fortaleza fronteriza siria en el Jayhan; deshabitada por musulmanes hasta que Abdullah ibn Abd al-Malik construyó su fortaleza en el año 84 sobre los cimientos antiguos, asentando a trescientos hombres selectos y una mezquita en su colina, mientras que su iglesia Herya había sido el refugio invernal de los bizantinos; Umar ibn Abd al-Aziz pretendía arrasarla y se contuvo cuando se le mostró que protegía Antioquía, construyendo la mezquita Kafarbayya con su cisterna; Hisham añadió el rabad, Marwan el suburbio oriental con muralla, puerta y foso, Abu al-Abbas cuatrocientos hombres de guarnición más con propiedades, y la sucesión Mansur-Mahdi-Harun continuó construyendo las fronteras."
  fr: "Masisa (Mopsueste), la forteresse syrienne sur le Jayhan, était inhabitée par les musulmans jusqu'à ce qu'Abdullah ibn Abd al-Malik y construise sa forteresse en l'an 84, sur les fondations antiques, y installant trois cents hommes d'élite et une mosquée sur sa colline, tandis que son église, Herya, avait servi de refuge hivernal aux Byzantins. Umar ibn Abd al-Aziz avait l'intention de la raser, mais s'y retint lorsqu'on lui montra qu'elle protégeait Antioche, et fit construire la mosquée Kafarbayya avec sa citerne. Hisham y ajouta le rabad, Marwan la banlieue orientale avec muraille, porte et douves, Abu al-Abbas quatre cents hommes de garnison supplémentaires avec des domaines, et la succession Mansur-Mahdi-Harun continua à construire les marches."
  ur: "مسیسا ⁦(موپسوسٹیا)⁩، جیہان پر شامی مارچ کا قلعہ؛ مسلمانوں کی طرف سے اس وقت تک لوگوں سے محروم رہا جب تک کہ عبداللہ ابن عبد الملک نے قدیم بنیاد پر 84 میں اپنا قلعہ تعمیر کیا، اس کی پہاڑی پر تین سو چنیدہ آدمیوں اور ایک مسجد کو آباد کیا، جبکہ اس کا چرچ ہیریہ بازنطینیوں کا سردیوں کا ہدف تھا۔ عمر بن عبد العزیز کا مطلب اسے گرانا تھا اور جب دکھایا گیا تھا کہ اس نے انطاکیہ کی حفاظت کی ہے، کفاربیہ مسجد کو اس کے حوض کے ساتھ تعمیر کیا ہے۔ ہشام نے رباد کو شامل کیا، مروان نے مشرقی مضافات کو دیوار، گیٹ اور کھائی کے ساتھ، ابو العباس نے مزید چار سو فوجیوں کو جاگیروں کے ساتھ، اور منصور-مہدی- ہارون جانشینی نے مارچوں کی تعمیر جاری رکھی۔"
