label: { ar: "المصيصة", en: "Masisa (Mopsuestia)" }
summary:
  ar: "المصيصة حصن الثغر الشامي على جيحان؛ لم يسكنها المسلمون حتى بنى حصنها عبد الله بن عبد الملك سنة 84 على أساسه القديم وسكّن بها ثلاثمائة منتخب وبنى مسجداً فوق تلها، وكانت بها كنيسة هريا تقصدها طوالع الروم؛ وأراد عمر بن عبد العزيز هدمها فأمسك لما عُلّم أنها تدفع عن أنطاكية وبنى جامع كفربيا بصهريجه؛ ثم بنى هشام الربض ومروان الخصوص والحائط والخندق، وفرض أبو العباس بها أربع مائة زيادة وأقطعهم، وتعاقب على عمران الثغور المنصور والمهدي وهارون."
  en: "Masisa (Mopsuestia), the Syrian march-fortress on the Jayhan; unpeopled by Muslims until Abdullah ibn Abd al-Malik built its fortress in year 84 on the ancient foundation, settling three hundred picked men and a mosque on its hill, while its church Herya had been the Byzantines' wintering goal; Umar ibn Abd al-Aziz meant to raze it and held back when shown it shielded Antioch, building the Kafarbayya mosque with its cistern; Hisham added the rabad, Marwan the eastern suburb with wall, gate and moat, Abu al-Abbas four hundred more garrison-men with estates, and the Mansur–Mahdi–Harun succession kept building the marches."
