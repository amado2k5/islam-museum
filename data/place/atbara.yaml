  tr: "Atbara Nehri"
  id: "Sungai Atbara"
summary:
  ar: "رافد لنهر النيل، عرفه القدماء باسم أستابوراس، ينبع في الحبشة قرب غوندار، ويدخل السودان قرب جلابات، فيلتقي بالسلام والستيت، ويصب في النيل الرئيس نحو 200 ميل شمال الخرطوم؛ يحمل في موسم الفيضان ماءً كثيرًا محمّلًا بالطمي ويجف بقية العام {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  en: "A tributary of the Nile, known to the ancients as Astaboras. It rises in Abyssinia not far from Gondar, enters the Sudan near Gallabat, is joined by the Salam and the Setit, and joins the main Nile about 200 miles north of Khartoum. In the flood season it carries a large amount of silt-laden water to the Nile, and it dries up for the rest of the year {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  es: "Afluente del Nilo, conocido por los antiguos como Astaboras. Nace en Abisinia, cerca de Gondar, entra en Sudán cerca de Gallabat, recibe las aguas del Salam y el Setit, y se une al Nilo principal a unos 320 kilómetros al norte de Jartum. Durante la época de crecidas, transporta una gran cantidad de agua cargada de sedimentos al Nilo, y se seca el resto del año {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  fr: "L'Astaboras, un affluent du Nil, prend sa source en Abyssinie, non loin de Gondar, pénètre au Soudan près de Gallabat, reçoit les eaux du Salam et du Setit, et rejoint le Nil principal à environ 320 kilomètres au nord de Khartoum. Lors des crues, il charrie une grande quantité d'eau chargée de limon vers le Nil, et s'assèche le reste de l'année."
  ur: "دریائے نیل کی ایک معاون دریا، جسے قدیم لوگوں کے نزدیک استابوراس کے نام سے جانا جاتا تھا۔ یہ گونڈر سے زیادہ دور حبشہ میں طلوع ہوتا ہے، گلابات کے قریب سوڈان میں داخل ہوتا ہے، سلام اور سیٹیت سے مل جاتا ہے، اور خرطوم سے تقریباً 200 میل شمال میں مرکزی نیل سے جا ملتا ہے۔ سیلاب کے موسم میں یہ بہت زیادہ گاد سے بھرا پانی دریائے نیل تک لے جاتا ہے اور یہ باقی سال تک خشک ہو جاتا ہے۔ 1 ص۔ 784}۔"
  tr: "Nil Nehri'nin bir kolu olan ve antik çağda Astaporas olarak bilinen bu nehir, Gondar yakınlarındaki Habeşistan'da doğar, Sudan'a Jalabate yakınlarında girer, burada Al-Salam ve Al-Sit ile buluşur ve Hartum'un yaklaşık 200 mil kuzeyinde ana Nil'e dökülür; sel sezonunda, çok miktarda çamur yüklü su taşır ve yılın geri kalanında kurur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 784}."
  id: "Anak sungai dari Sungai Nil, yang dikenal oleh orang kuno sebagai Astaporas, bermuara di Abyssinia dekat Gondar, memasuki Sudan dekat Jalabate, di mana ia bertemu dengan Al-Salam dan Al-Sit, dan bermuara ke Sungai Nil utama sekitar 200 mil utara Khartoum; selama musim banjir, sungai ini membawa banyak air yang penuh lumpur dan mengering sepanjang tahun {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 784}."
