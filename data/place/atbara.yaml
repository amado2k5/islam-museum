label:
  ar: "نهر عطبرة"
  en: "Atbara (river)"
summary:
  ar: "رافد لنهر النيل، عرفه القدماء باسم أستابوراس، ينبع في الحبشة قرب غوندار، ويدخل السودان قرب جلابات، فيلتقي بالسلام والستيت، ويصب في النيل الرئيس نحو 200 ميل شمال الخرطوم؛ يحمل في موسم الفيضان ماءً كثيرًا محمّلًا بالطمي ويجف بقية العام {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  en: "A tributary of the Nile, known to the ancients as Astaboras. It rises in Abyssinia not far from Gondar, enters the Sudan near Gallabat, is joined by the Salam and the Setit, and joins the main Nile about 200 miles north of Khartoum. In the flood season it carries a large amount of silt-laden water to the Nile, and it dries up for the rest of the year {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
