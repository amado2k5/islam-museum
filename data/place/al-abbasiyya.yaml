summary:
  ar: "عند البلاذري: مدينة ابتناها عمر بن حفص العتكي في أقصى بلاد البربر وسماها العباسية فلما قاتله أبو خاتم الإباضي فاستشهد هدمت تلك المدينة التي ابتناها."
  en: "In al-Baladhuri: a city Umar ibn Hafs al-Ataki built in the farthest Berber lands and named al-Abbasiyya; when Abu Khatim al-Ibadi fought him and he was martyred, the city he built was demolished."
  es: "En al-Baladhuri: una ciudad que Umar ibn Hafs al-Ataki construyó en las tierras bereberes más remotas y a la que llamó al-Abbasiyya; cuando Abu Khatim al-Ibadi luchó contra él y fue martirizado, la ciudad que construyó fue demolida."
  fr: "À al-Baladhuri: une ville qu'Umar ibn Hafs al-Ataki fit construire dans les terres berbères les plus reculées et qu'il nomma al-Abbasiyya; lorsqu'Abu Khatim al-Ibadi le combattit et qu'il fut martyrisé, la ville qu'il avait construite fut démolie."
  ur: "البلادھوری میں: ایک شہر عمر بن حفص العتاکی نے سب سے دور بربر سرزمین میں تعمیر کیا اور اس کا نام العباسیہ رکھا۔ جب ابو خاتم العبادی نے اس سے جنگ کی اور وہ شہید ہو گئے تو اس نے جو شہر بنایا تھا اسے منہدم کر دیا گیا۔"
  tr: "Al-Baladhuri'ye göre: Ömer bin Hafs el-Ataki tarafından Berberi topraklarının en uzak köşesinde inşa edilen ve Abbasi adını vermiş bir şehir. Ebu Hatim el-İbadi onunla savaştığında ve şehit olduğunda, inşa ettiğimiz şehir yıkıldı."
  id: "Menurut Al-Baladhuri: sebuah kota yang dibangun oleh Umar ibn Hafs al-Ataki di bagian terjauh tanah Berber dan dinamai Abbasiyah. Ketika Abu Khatim al-Ibadi melawannya dan dia gugur, kota yang kami bangun hancur."
