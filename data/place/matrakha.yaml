summary:
  ar: "مدينة كبيرة عامرة، كثيرة الأقاليم واسعة الأرض، على نهر كبير يسمى سقيو، ويذكر المؤلف أنها تبعد عن روشية سبعة وعشرين ميلا {cite:nuzhat-al-mushtaq-2002 p. 916}."
  en: "A large, populous city with many districts and wide land, on a great river called Saqyū; the author gives twenty-seven miles to Rushiyya {cite:nuzhat-al-mushtaq-2002 p. 916}."
  es: "Una ciudad grande y populosa con muchos distritos y una extensa tierra, a orillas de un gran río llamado Saqyū; el autor le da veintisiete millas a Rushiyya {cite:nuzhat-al-mushtaq-2002 p. 916}."
  fr: "Une grande ville peuplée avec de nombreux quartiers et de vastes terres, sur un grand fleuve appelé Saqyū; l'auteur donne vingt-sept milles à Rushiyya {cite:nuzhat-al-mushtaq-2002 p. 916}."
  ur: "ایک بہت بڑا، آبادی والا شہر جس میں بہت سے اضلاع اور وسیع زمین ہے، ایک عظیم دریا پر Saqyū؛ مصنف نے رشیہ کو ستائیس میل بتائے ہیں {حوالہ: نزہت المشتاق-2002 ص 916}۔"
