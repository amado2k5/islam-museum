summary:
  ar: "مدينة على غربي دجلة فوق الموصل، كثيرة الخيرات، ولها ماء جار غير دجلة يشرب منه أهلها، وتبعد عن سنجار سبعة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 660}"
  en: "A town on the western bank of the Tigris above Mosul, rich in produce, with a running stream besides the Tigris for drinking; twenty-seven miles from Sinjar. {cite:nuzhat-al-mushtaq-2002 p. 660}"
  es: "Un pueblo situado en la orilla occidental del Tigris, sobre Mosul, rico en productos agrícolas, con un arroyo que fluye junto al Tigris para beber; a veintisiete millas de Sinjar. {cite:nuzhat-al-mushtaq-2002 p. 660}"
  fr: "Ville située sur la rive ouest du Tigre, en amont de Mossoul, riche en produits agricoles, avec un cours d'eau alimenté par le Tigre et fournissant de l'eau potable; à vingt-sept milles de Sinjar. {cite:nuzhat-al-mushtaq-2002 p. 660}"
  ur: "موصل کے اوپر دجلہ کے مغربی کنارے پر ایک قصبہ، پیداوار سے مالا مال، پینے کے لیے دجلہ کے علاوہ ایک بہتی ندی؛ سنجار سے ستائیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 660}"
