summary:
  ar: "مدينة بها أسواق وخيرات شاملة، يذكر المؤلف أنها على بعد ثلاث مراحل بالنهر من شنت {cite:nuzhat-al-mushtaq-2002 p. 888} {cite:nuzhat-al-mushtaq-2002 p. 889}."
  en: "A city with markets and abundant produce, which the author places three stages by river from Shant {cite:nuzhat-al-mushtaq-2002 p. 888} {cite:nuzhat-al-mushtaq-2002 p. 889}."
  es: "Una ciudad con mercados y productos abundantes, que el autor sitúa a tres etapas por río desde Shant {cite:nuzhat-al-mushtaq-2002 p. 888} {cite:nuzhat-al-mushtaq-2002 p. 889}."
  fr: "Une ville avec des marchés et des produits abondants, que l'auteur situe à trois étapes par la rivière depuis Shant {cite:nuzhat-al-mushtaq-2002 p. 888} {cite:nuzhat-al-mushtaq-2002 p. 889}."
  ur: "بازاروں اور وافر پیداوار والا شہر، جس کے مصنف نے شانت سے دریا کے راستے تین مراحل طے کیے ہیں۔ 888} {حوالہ: نزہت المشتاق-2002 ص۔ 889}۔"
  tr: "Pazarları ve kapsamlı malları olan bir şehir olan yazar, Shant'a nehir kenarında üç adım uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 888} {cite:Nuzhat-al-Mushtaq-2002 s. 889}."
  id: "Sebuah kota dengan pasar dan barang-barang lengkap, penulis menyebutkan bahwa kota ini berjarak tiga langkah di tepi sungai dari Shant {cite:Nuzhat-al-Mushtaq-2002 hlm. 888} {cite:Nuzhat-al-Mushtaq-2002 hlm. 889}."
