summary:
  ar: "دير قاووس موضع في دجلة فوق الأبلة بأربعة فراسخ كان شرب أهل البصرة منه قبل حفر نهر الأبلة يجري في سباخ لا عمارة على حافاته وكانت الأرواح تدفنه."
  en: "Dayr Qawus, the Tigris spot four farsakhs above al-Ubulla where Basrans drank before the canal — running amid salt-flats, unbuilt on its banks, and haunted."
  es: "Dayr Qawus, el punto del Tigris situado a cuatro farsakhs por encima de al-Ubulla, donde los basranos bebían antes de que el canal fluyera entre salinas, sin construcciones en sus orillas y con fama de estar embrujado."
  fr: "Dayr Qawus, le point du Tigre à quatre farsakhs au-dessus d'al-Ubulla où les habitants de Bassorah buvaient avant le canal — coulant au milieu de marais salants, non construit sur ses rives et hanté."
  ur: "دیر قووس، دجلہ الابلہ سے چار فرسخ کے اوپر جگہ رکھتا ہے جہاں بسران نہر سے پہلے پیتے تھے - نمک کے فلیٹوں کے درمیان دوڑتے ہوئے، اس کے کناروں پر غیر تعمیر شدہ، اور پریشان۔"
  tr: "Deir Qawus, Dicle'de Al-Ablah'ın dört lig ötesinde bir yerdir. Abla Nehri kazılmadan önce, Basra halkı buradan su içirdi; nehir boyunca binasız bir su kaynağından akardı ve ruhlar onu gömmek için kullanılırdı."
  id: "Deir Qawus adalah sebuah tempat di Sungai Tigris di atas Al-Ablah yang berjarak empat liga. Sebelum penggalian Sungai Abla, penduduk Basra minum dari sana, mengalir melalui sebuah rendaman tanpa bangunan di sepanjang tepinya, dan roh-roh biasa menguburnya."
