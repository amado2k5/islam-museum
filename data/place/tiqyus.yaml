summary:
  ar: "مدينة حسنة تبعد عن الحمة نحو عشرين ميلا، وفيها بقول طيبة ناعمة، وغلات من الحناء والكمون والكزبرة. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  en: "A fine town about twenty miles from al-Hamma, with tender vegetables and crops of henna, cumin and coriander. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  es: "Un pueblo encantador a unos treinta kilómetros de Al-Hamma, con verduras frescas y cultivos de henna, comino y cilantro. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  fr: "Une jolie ville à une trentaine de kilomètres d'al-Hamma, où poussent des légumes tendres et où sont cultivés le henné, le cumin et la coriandre. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  ur: "الحما سے بیس میل کے فاصلے پر ایک عمدہ قصبہ جہاں مہندی، زیرہ اور دھنیا کی نرم سبزیاں اور فصلیں ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 277}"
  tr: "Al-Hamma'ya yaklaşık yirmi mil uzaklıkta, ince pişmiş fasulyeleri ve kına, kimyon ile kişniş verimleriyle güzel bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 277}"
  id: "Sebuah kota indah sekitar dua puluh mil dari Al-Hamma, dengan kacang panggang halus dan hasil henna, jinten, dan ketumbar. {cite:nuzhat-al-mushtaq-2002 hlm. 277}"
