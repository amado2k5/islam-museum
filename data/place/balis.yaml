summary:
  ar: "بالس بلدة سورية صغيرة على الضفة الغربية للفرات مقابل الرقة، ويذكر ياقوت أن الفرات ابتعد عنها نحو الشرق، وغرق عندها سليمان شاه جد عثمان. {cite:farghani-elements-astronomy p. 500}"
  tr: "Bals, Fırat'ın batı kıyısında Rakka'nın karşısında yer alan küçük bir Suriye kasabasıdır. Yaqut, Fırat'ın doğuya doğru hareket ettiğini ve Osman'ın dedesi Süleyman Şah'ın orada boğulduğunu belirtir. {alıntı:Farghani-elements-astronomy s. 500}"
  id: "Bals adalah sebuah kota kecil di Suriah di tepi barat Sungai Efrat berseberangan dengan Raqqa. Yaqut menyebutkan bahwa Sungai Efrat bergerak ke timur, dan Suleiman Shah, kakek Uthman, tenggelam di sana. {Sitasi: Farghani-Elements-Astronomy hlm. 500}"
