  fr: "ville au pied des montagnes Mah; à al-Baladhuri, Yazdgard s'enfuit d'al-Mada'in avec ses asawira, ses trésors, ses femmes et ses enfants, partant après Jalula."
  ur: "مہ پہاڑوں کے دامن میں شہر؛ البلاذری میں یزدگرد اپنے اساویرہ، خزانے، عورتوں اور بچوں کے ساتھ مدعین سے وہاں سے بھاگا، جلولا کے بعد روانہ ہوا۔"
  tr: "Mah dağlarının kaynağında bir kasaba; el-Baladhuri'ye göre Yazdegerd, bilezikleri, hazineleri, kadınları ve soyundan gelenlerle birlikte şehirlerden kaçtı, ardından Celula'nın ardından ayrıldı."
  id: "Sebuah kota di asal pegunungan Mah; menurut al-Baladhuri, Yazdegerd melarikan diri dari kota-kota dengan gelang, harta, wanita, dan keturunannya, lalu pergi mengejar Jalula."
