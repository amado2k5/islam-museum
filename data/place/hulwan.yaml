summary:
  ar: "بلد في أصل جبال ماه؛ عند البلاذري هرب إليه يزدجرد من المدائن بأساورته وخزائنه ونسائه وذراريه ثم ارتحل منه بعد جلولاء."
  en: "town at the foot of the Mah mountains; in al-Baladhuri Yazdgard fled there from al-Mada'in with his asawira, treasuries, women and children, departing after Jalula."
