  ar: "مدينة متحضرة، ويذكر المؤلف أنها كانت خرابا فعمّرها هرقل الثاني، وتبعد غربا نصف يوم عن فربسيوس {cite:nuzhat-al-mushtaq-2002 p. 898}."
  en: "A civilised city; the author says it had been in ruins until Heraclius II rebuilt it, and places it half a day west of Furbāsiyūs {cite:nuzhat-al-mushtaq-2002 p. 898}."
  es: "Una ciudad civilizada; el autor dice que estuvo en ruinas hasta que Heraclio II la reconstruyó, y la sitúa a medio día al oeste de Furbāsiyūs {cite:nuzhat-al-mushtaq-2002 p. 898}."
  fr: "Une ville civilisée; l'auteur dit qu'elle était en ruines jusqu'à ce qu'Héraclius II la reconstruise, et la situe à une demi-journée à l'ouest de Furbāsiyūs {cite:nuzhat-al-mushtaq-2002 p. 898}."
  ur: "ایک مہذب شہر؛ مصنف کا کہنا ہے کہ یہ اس وقت تک کھنڈرات میں پڑ چکا تھا جب تک کہ ہیراکلئس دوم نے اسے دوبارہ تعمیر نہیں کیا اور اسے فرباسیوس کے مغرب میں آدھے دن میں رکھ دیا۔ 898}۔"
