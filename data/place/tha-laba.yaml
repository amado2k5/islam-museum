summary:
  ar: "مدينة من مدن البادية، وبها مجتمع للقوافل، ويذكرها الإدريسي مع مواضع الطريق بين الكوفة والحجاز. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  en: "A desert town where caravans gather, which al-Idrisi lists among the stops on the road between Kufa and the Hijaz. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  es: "Un pueblo desértico donde se reúnen las caravanas, que al-Idrisi menciona entre las paradas de la ruta entre Kufa y el Hiyaz. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  fr: "Une ville du désert où se rassemblent les caravanes, qu'al-Idrisi mentionne parmi les étapes de la route entre Koufa et le Hedjaz. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  ur: "ایک صحرائی قصبہ جہاں قافلے جمع ہوتے ہیں، جسے ادریسی نے کوفہ اور حجاز کے درمیان سڑک پر پڑنے والے اسٹاپوں میں درج کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 381}"
  tr: "Kervan topluluğu olan bir çöl şehri ve El-İdrisi, Kufa ile Hicaz arasındaki güzergah boyunca bahseder. {kaynak:Nuzhat-al-mushtaq-2002 s. 381}"
  id: "Sebuah kota gurun dengan komunitas karavan, dan Al-Idrisi menyebutkannya di sepanjang rute antara Kufa dan Hijaz. {cite:Nuzhat-al-Mushtaq-2002 hlm. 381}"
