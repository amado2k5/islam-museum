summary:
  ar: "مدينة من بلاد حوران حكى الهول عن غرائب آثارها؛ وفي القرن الثامن وصفها ابن فضل الله العمري خاوية على عروشها خالية من أهلها وسكانها لا يُحسّ بها حسيس ولا يوجد بها أنيس {cite:umari-masalik-1924 p. 231}."
  en: "A Hawran city whose wonders lore spoke of; in the eighth century al-Umari describes it as a throne of ruins void of inhabitants — no sound within, no soul {cite:umari-masalik-1924 p. 231}."
  es: "Una ciudad de Hawran cuyas maravillas hablaba la tradición; en el siglo VIII, al-Umari la describe como un trono de ruinas vacío de habitantes: ni un sonido en su interior, ni alma {cite:umari-masalik-1924 p. 231}."
  fr: "Une ville de Hawran dont les merveilles étaient évoquées dans la légende; au VIIIe siècle, al-Umari la décrit comme un trône de ruines vide d'habitants — aucun son à l'intérieur, aucune âme {cite:umari-masalik-1924 p. 231}."
  ur: "ہاورن شہر جس کے عجائبات کے بارے میں کہا جاتا ہے؛ آٹھویں صدی میں عمری نے اسے کھنڈرات کے تخت کے طور پر بیان کیا ہے جو کہ باشندوں کے لیے خالی نہیں ہے - اندر کوئی آواز نہیں، کوئی روح نہیں {حوالہ: عمری مسالک-1924 صفحہ۔ 231}۔"
