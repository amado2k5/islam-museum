summary:
  ar: "الجوزجان إقليم بخراسان؛ لحق به منهزمو وقعة الأحنف بطخارستان فوجه إليهم الأقرع بن حابس التميمي في خيل فكانت في المسلمين جولة ثم كروا فهزموا الكفرة وفتحوه عنوة ومنه رستاق حوف ذو القصرين."
  en: "al-Juzjan of Khurasan; the rout's fugitives reached it, al-Aqra' ibn Habis pursued with horse, turned a first setback and stormed it — its Rustaq Hawf with the two castles mourned in verse."
  es: "al-Juzjan de Jorasán; los fugitivos de la desbandada llegaron hasta allí, al-Aqra' ibn Habis los persiguió a caballo, superó un primer revés y la asaltó; su Rustaq Hawf, con sus dos castillos, fue lamentada en verso."
  fr: "al-Juzjan du Khorasan; les fugitifs de la déroute l'atteignirent, al-Aqra' ibn Habis poursuivit à cheval, subit un premier revers et s'en empara — son Rustaq Hawf avec les deux châteaux pleurés en vers."
  ur: "خراسان کا الجزان؛ اقراء ابن حابس نے گھوڑے کا تعاقب کیا، پہلا جھٹکا لگا اور اس پر دھاوا بول دیا - اس کا رستاق حوف دو قلعوں کے ساتھ آیت میں ماتم کیا۔"
  tr: "El-Cevcan, Horasan'da bir bölgedir; ardından Tokharistan'daki El-Ahnaf Savaşı ile yenilgiye uğramıştır. El-Aqra' ibn Habis el-Tamimi onları süvarilerle göndermiş, Müslümanlar arasında süvari oluşturmuş, ardından saldırıya uğramış, kâfirleri yenmiş ve Rustaq Huf Dhu al-Kasrayn dahil zorla ele geçirmişlerdir."
  id: "Al-Jawzjan adalah sebuah wilayah di Khorasan; diikuti oleh kekalahan dalam Pertempuran Al-Ahnaf di Tokharistan. Al-Aqra' ibn Habis al-Tamimi mengirim mereka dengan kavaleri, menyebabkan kavaleri di antara Muslim, lalu mereka diserang, mengalahkan kaum kafir, dan merebutnya secara paksa, termasuk Rustaq Huf Dhu al-Qasrayn."
