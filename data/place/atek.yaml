summary:
  ar: "إقليم في تركمانستان السوفياتية على المنحدر الشمالي لجبال الحدود مع خراسان (كوبيت داغ)، بين محطتي جاورس ودوشك. اسمه تركي معناه «حافة الحد»، وهو ترجمة لاسمه الفارسي «دامان كوه» أي «سفح الجبل»؛ وكان في العصور الوسطى من أقسام أبيورد في خراسان، ثم وقع في القرنين السادس عشر والسابع عشر الميلاديين تحت سلطة خانات خوارزم، ثم التركمان {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  en: "A district of Soviet Turkmenistan on the northern slope of the frontier mountains with Khurasan (the Kopet Dagh), between the railway stations of Gjaurs and Dushak. Its name is Turkish, Etek, 'edge border', a translation of its Persian name Daman-i Kuh, 'foot of the mountain'. In the Middle Ages it was part of Abiward in Khurasan; in the sixteenth and seventeenth centuries it fell under the Khans of Khwarazm, and later under the Turkomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
