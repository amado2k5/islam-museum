summary:
  ar: "إقليم في تركمانستان السوفياتية على المنحدر الشمالي لجبال الحدود مع خراسان ⁦(كوبيت داغ)⁩، بين محطتي جاورس ودوشك. اسمه تركي معناه «حافة الحد»، وهو ترجمة لاسمه الفارسي «دامان كوه» أي «سفح الجبل»؛ وكان في العصور الوسطى من أقسام أبيورد في خراسان، ثم وقع في القرنين السادس عشر والسابع عشر الميلاديين تحت سلطة خانات خوارزم، ثم التركمان {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  en: "A district of Soviet Turkmenistan on the northern slope of the frontier mountains with Khurasan (the Kopet Dagh), between the railway stations of Gjaurs and Dushak. Its name is Turkish, Etek, 'edge border', a translation of its Persian name Daman-i Kuh, 'foot of the mountain'. In the Middle Ages it was part of Abiward in Khurasan; in the sixteenth and seventeenth centuries it fell under the Khans of Khwarazm, and later under the Turkomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  es: "Distrito del Turkmenistán soviético situado en la ladera norte de la cordillera fronteriza con Jorasán (Kopet Dagh), entre las estaciones de ferrocarril de Gjaurs y Dushak. Su nombre es turco, Etek, que significa «frontera», traducción de su nombre persa, Daman-i Kuh, «pie de la montaña». En la Edad Media formó parte de Abiward, en Jorasán; en los siglos XVI y XVII estuvo bajo el dominio de los kanes de Corasmia, y posteriormente bajo el de los turcomanos {cite:encyclopaedia-of-islam-2 vol. 1 p. 784}."
  fr: "District du Turkménistan soviétique situé sur le versant nord des montagnes frontalières avec le Khorasan (le Kopet Dagh), entre les gares de Gjaurs et de Dushak. Son nom turc, Etek, signifie « bordure », traduction de son nom persan Daman-i Kuh, « pied de la montagne ». Au Moyen Âge, il faisait partie d'Abiward, au Khorasan; aux XVIe et XVIIe siècles, il passa sous la domination des khans du Khwarezm, puis sous celle des Turkmènes (voir: Encyclopaedia of Islam, vol. 2, p. 784)."
