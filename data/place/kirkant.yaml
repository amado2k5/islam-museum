summary:
  ar: "مدينة متحضرة من أشرف الحواضر عامرة، قلعتها حصينة سامية، ويجتمع بها السفن والرفاق، وتحمل إليها كل ما وصل إليها من عظام الأمور، وتبعد عن الشاقة مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  en: "A civilised city, among the noblest and most populous; its citadel is strong and lofty, ships and travellers gather there, and it is one stage from al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  es: "Una ciudad civilizada, entre las más nobles y pobladas; su ciudadela es fuerte y majestuosa, allí se congregan barcos y viajeros, y está a una etapa de al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  fr: "Une ville civilisée, parmi les plus nobles et les plus peuplées; sa citadelle est forte et imposante, navires et voyageurs s'y rassemblent, et elle est à une étape d'al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  ur: "ایک مہذب شہر، عظیم ترین اور سب سے زیادہ آبادی والا شہر؛ اس کا قلعہ مضبوط اور بلند ہے، وہاں بحری جہاز اور مسافر جمع ہوتے ہیں، اور یہ الشقہ سے ایک منزل ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 599}"
  tr: "En soylu şehirler arasında medeni bir şehir, refah içinde, gemilerin ve yoldaşların toplandığı, kendisine ulaşan tüm büyük şeyleri taşıdığı ve zorlukların bir adım ötesinde, soylu bir kale. {kaynak:nuzhat-al-mushtaq-2002 s. 599}"
  id: "Sebuah kota beradab di antara kota-kota paling mulia, makmur, bentengnya mulia, tempat kapal dan pengiring berkumpul, membawa semua hal besar yang telah sampai kepadanya, dan ini selangkah menjauh dari kesulitan. {cite:nuzhat-al-mushtaq-2002 hlm. 599}"
