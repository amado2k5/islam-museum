  ur: "انہوں نے تقریباً تیس میل کے فاصلے پر ایک جزیرہ آباد کیا جو البیضاء کے شمال میں واقع تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 585}"
  tr: "Muheet Adası otuz mil uzaklıkta, yerleşim görmektedir ve Alba Adası'nın yaklaşık on altı mil kuzeyindedir. {cite:nuzhat-al-mushtaq-2002 s. 585}"
  id: "Pulau Muheet berjarak tiga puluh mil, berpenghuni, dan sekitar enam belas mil di utara Pulau Alba. {cite:nuzhat-al-mushtaq-2002 hlm. 585}"
