summary:
  ar: "مدينة أزلية قديمة مشهورة، كانت في القدم دار مملكة الروم قبل أن تُبنى القسطنطينية فانتقل الملك إليها، وهي على بحيرة طويلة عريضة طولها نحو اثني عشر ميلاً، وتبعد عن البحر ثلاثة أميال. {cite:nuzhat-al-mushtaq-2002 p. 805}"
  en: "An ancient, famous city that was once the seat of the Roman kingdom before Constantinople was built; it stands by a long broad lake about twelve miles long, three miles from the sea. {cite:nuzhat-al-mushtaq-2002 p. 805}"
  es: "Una ciudad antigua y famosa que fue sede del reino romano antes de la construcción de Constantinopla; se encuentra junto a un lago largo y ancho de aproximadamente doce millas de longitud, a tres millas del mar. {cite:nuzhat-al-mushtaq-2002 p. 805}"
  fr: "Une ville antique et célèbre, qui fut jadis la capitale du royaume romain avant la construction de Constantinople; elle se dresse au bord d'un long et large lac d'environ douze milles de long, à trois milles de la mer. {cite:nuzhat-al-mushtaq-2002 p. 805}"
  ur: "ایک قدیم، مشہور شہر جو قسطنطنیہ کی تعمیر سے پہلے کبھی رومی سلطنت کا مرکز تھا۔ یہ سمندر سے تین میل کے فاصلے پر ایک لمبی چوڑی جھیل کے قریب بارہ میل لمبی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 805}"
