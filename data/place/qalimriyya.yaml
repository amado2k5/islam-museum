summary:
  ar: "مدينة كثيرة الكروم والفواكه من التفاح والجراسيا وغيرها، على نهر يسمى منديق، ولها حصن منيع لا يمكن قتاله، وتبعد عن شنترين نحو ثلاثة أيام. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  en: "A city of many vineyards and fruits, including apples and cherries, on a river called the Mundiq, with a strong fort that cannot be taken; about three days from Shantarin. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  es: "Una ciudad con numerosos viñedos y cultivos frutales, entre ellos manzanas y cerezas, situada a orillas del río Mundiq, con una sólida fortaleza inexpugnable; a unos tres días de Shantarin. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  fr: "Une ville riche en vignobles et en fruits, notamment des pommiers et des cerisiers, située sur une rivière appelée le Mundiq, dotée d'une forteresse imprenable; à environ trois jours de Shantarin. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  ur: "کئی انگور کے باغوں اور پھلوں کا ایک شہر، بشمول سیب اور چیری، منڈیق نامی دریا پر، ایک مضبوط قلعہ کے ساتھ جسے نہیں لیا جا سکتا؛ Shantarin سے تقریبا تین دن. {حوالہ: نزہت المشتاق-2002 ص۔ 726}"
