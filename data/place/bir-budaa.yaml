label: { ar: "بئر بضاعة", en: "Bir Buda'a (the well of Buda'a)", ur: "بئرِ بضاعہ" }
summary:
  ar: "بئر من آبار زمن النبي، في بستان، ورد فيها حديث أبي سعيد الخدري «الماء طهور لا ينجسه شيء» حين قيل للنبي إنها يُطرح فيها الحِيَض ولحم الكلاب والنتن؛ ذكر أبو داود أن قتيبة سأل قيّمها فقال إن أكثر مائها إلى العانة، وأنه هو قاس عرضها بردائه فوجده ستة أذرع ورأى فيها ماء متغير اللون؛ وفسّر الخطابي أنها كانت في حدور من الأرض تكسح السيول إليها الأقذار، لا أن الناس كانوا يلقونها فيها عمداً {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 45-46}."
  en: "A well of the Prophet's time, standing in a walled garden, the subject of Abu Sa'id al-Khudri's report 'water is pure, nothing makes it impure', said when the Prophet was told that menstrual rags, dogs' flesh and filth were thrown into it; Abu Dawud records that Qutayba asked its keeper, who said its water at most reached the groin, and that he himself measured its width with his cloak at six cubits and saw discoloured water in it; al-Khattabi explains that it lay on sloping ground where floods swept refuse into it, not that people threw refuse in on purpose {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 45-46}."
  ur: "نبی کے زمانے کا ایک کنواں، ایک باغ میں، جس کے بارے میں ابو سعید خدری کی حدیث «پانی پاک ہے، اسے کوئی چیز ناپاک نہیں کرتی» آئی، جب نبی کو بتایا گیا کہ اس میں حیض کے چیتھڑے، کتوں کا گوشت اور گندگی ڈالی جاتی ہے؛ ابو داؤد ذکر کرتے ہیں کہ قتیبہ نے اس کے نگران سے پوچھا تو اس نے کہا کہ اس کا پانی زیادہ سے زیادہ زیرِ ناف تک ہوتا ہے، اور خود انہوں نے اپنی چادر سے اس کی چوڑائی چھ ہاتھ ناپی اور اس میں بدلے رنگ کا پانی دیکھا؛ خطابی کی تشریح ہے کہ یہ ڈھلوان زمین میں تھا جہاں سیلاب گندگی بہا لاتے تھے، نہ کہ لوگ قصداً اس میں ڈالتے تھے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 45-46}۔"
