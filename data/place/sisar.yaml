  ar: "مدينة بالجبل بين همذان والدينور وأذربيجان؛ عند البلاذري بناها سليمان بن قيراط وسلام الطيفوري بأمر المهدي ملجأ لدوابه وأغنامه من الصعاليك وسمت لثلاثين أكاماً ومائة عين وضمت إليها رساتيق من الدينور وأذربيجان فكورت ورتب الرشيد فيها ألف رجل وأخذت من عاصم بن مرة في خلافة المأمون فصارت من ضياع الخلافة."
  en: "the Jibal city between Hamadhan, al-Dinawar and Adharbayjan; in al-Baladhuri built by Sulayman ibn Qayrat and Salam al-Tayfuri at al-Mahdi's command to shelter his herds from brigands — 'thirty heads and a hundred springs' — made a kura, garrisoned by al-Rashid's thousand, and reverted to caliphal estates under al-Ma'mun."
