summary:
  ar: "مدينة بالجبل بين همذان والدينور وأذربيجان؛ عند البلاذري بناها سليمان بن قيراط وسلام الطيفوري بأمر المهدي ملجأ لدوابه وأغنامه من الصعاليك وسمت لثلاثين أكاماً ومائة عين وضمت إليها رساتيق من الدينور وأذربيجان فكورت ورتب الرشيد فيها ألف رجل وأخذت من عاصم بن مرة في خلافة المأمون فصارت من ضياع الخلافة."
  en: "the Jibal city between Hamadhan, al-Dinawar and Adharbayjan; in al-Baladhuri built by Sulayman ibn Qayrat and Salam al-Tayfuri at al-Mahdi's command to shelter his herds from brigands — 'thirty heads and a hundred springs' — made a kura, garrisoned by al-Rashid's thousand, and reverted to caliphal estates under al-Ma'mun."
  es: "la ciudad de Jibal entre Hamadhan, al-Dinawar y Adharbayjan; en al-Baladhuri construida por Sulayman ibn Qayrat y Salam al-Tayfuri por orden de al-Mahdi para proteger sus rebaños de los bandidos —'treinta cabezas y cien manantiales'— se convirtió en un kura, guarnecido por los mil de al-Rashid, y volvió a ser propiedad del califa bajo al-Ma'mun."
  fr: "la ville de Jibal entre Hamadhan, al-Dinawar et Adharbayjan; à al-Baladhuri, construite par Sulayman ibn Qayrat et Salam al-Tayfuri sur ordre d'al-Mahdi pour abriter ses troupeaux des brigands — « trente têtes et cent sources » — fut transformée en kura, garnie par les mille hommes d'al-Rashid, et retourna aux domaines califes sous al-Ma'mun."
  ur: "جبل شہر ہمادان، الدناور اور ادربائجان کے درمیان؛ البلادوری میں سلیمان بن قیراط اور سلام الطیفوری نے المہدی کے حکم پر اپنے ریوڑ کو چوروں سے پناہ دینے کے لیے تعمیر کیا - 'تیس سر اور ایک سو چشمے' - نے ایک کورا بنایا، جس کو الرشید کے ہزار لوگوں نے گھیرے میں لیا، اور المہدی کے ماتحت خلیفہ کی جاگیروں میں واپس چلا گیا۔"
