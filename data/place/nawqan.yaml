summary:
  ar: "مدينة من غرر البلاد، عليها سور حصين من تراب، وبها مياسير وتجار وصناع، وفيها قبر علي بن موسى الرضا، ويبلغ معدن الفيروز بجبلها. {cite:nuzhat-al-mushtaq-2002 p. 693}"
  en: "One of the fine cities of the land, with a strong earthen wall, wealthy merchants and craftsmen; the tomb of Ali ibn Musa al-Rida is in it, and turquoise is mined in its hills. {cite:nuzhat-al-mushtaq-2002 p. 693}"
  es: "Una de las ciudades más bellas del país, con una sólida muralla de tierra, ricos comerciantes y artesanos; en ella se encuentra la tumba de Ali ibn Musa al-Rida, y en sus colinas se extrae turquesa. {cite:nuzhat-al-mushtaq-2002 p. 693}"
  fr: "L'une des plus belles villes du pays, dotée d'une solide muraille de terre, abritant de riches marchands et artisans; le tombeau d'Ali ibn Musa al-Rida s'y trouve, et on y extrait de la turquoise dans ses collines. {cite:nuzhat-al-mushtaq-2002 p. 693}"
  ur: "زمین کے عمدہ شہروں میں سے ایک، مٹی کی مضبوط دیوار کے ساتھ، دولت مند تاجر اور کاریگر۔ اس میں علی ابن موسی الرضا کی قبر ہے اور اس کی پہاڑیوں میں فیروزی کی کان کنی کی گئی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 693}"
  tr: "Toprağın ghararında, sağlam toprak duvarı, surlar, tüccarlar ve zanaatkârlarla dolu bir şehir; Ali ibn Musa al-Ridha'nın türbesini barındırır ve turkuaz mineral dağına ulaşır. {cite:nuzhat-al-mushtaq-2002 s. 693}"
  id: "Sebuah kota di gharar tanah, dengan tembok tanah yang kuat, dengan benteng, pedagang, dan pengrajin, dan di sini terdapat makam Ali ibn Musa al-Ridha, serta mineral biru kehijauan mencapai gunungnya. {cite:nuzhat-al-mushtaq-2002 hlm. 693}"
