label: { ar: "الشقيف أرنون", en: "Shaqif Arnun (Beaufort)", es: "Shaqif Arnun (Beaufort)", fr: "Shaqif Arnun (Beaufort)", ur: "شقیف ارنون ⁦(بیفورٹ)⁩", tr: "Arnoun Al-Shaqif", id: "Arnoun Al-Shaqif" }
summary:
  ar: "قلعة الشقيف المعروفة بحبس جلدك وأرنون — بوفور عند الفرنج — فوق النهر الليطاني من أعمال طبرية، فتحها عز الدين فرخشاه سنة 578هـ وسلمها الملك الصالح إسماعيل للفرنج سنة 638هـ {cite:kamil-ibn-al-athir p. 110-111} {cite:shadharat-dhahab p. 189}."
  en: "Beaufort castle above the Litani in the Tiberias district — taken by Farrukhshah in 578, handed back to the Franks by al-Salih Isma'il in 638 {cite:kamil-ibn-al-athir p. 110-111} {cite:shadharat-dhahab p. 189}."
  es: "Castillo de Beaufort sobre Litani en el distrito de Tiberíades, tomado por Farrukhshah en 578, devuelto a los francos por al-Salih Isma'il en 638 {cita:kamil-ibn-al-athir p. 110-111} {cita: shadharat-dhahab p. 189}."
  fr: "Château de Beaufort au-dessus du Litani dans le district de Tibériade — pris par Farrukhshah en 578, restitué aux Francs par al-Salih Isma'il en 638 {cite:kamil-ibn-al-athir p. 110-111} {cite: shadharat-dhahab p. 189}."
  ur: "ضلع تبریاس میں لیتانی کے اوپر بیفورٹ قلعہ - جسے فرخ شاہ نے 578 میں لیا، 638 میں الصالح اسماعیل نے فرینکوں کو واپس کر دیا۔ 110-111} {حوالہ: شدارت ذہاب ص۔ 189}۔"
  tr: "Litani Nehri'nin üzerindeki Shaqif kalesi, Franklar arasında Boabor—Jaldak ve Arnoun hapishanesi olarak bilinir—Tiberya kalesinin bir parçasıdır. 578 Hicri yılında İzzeddin Farkhshah tarafından fethedilmiş ve 638 Hicri yılında Kral el-Salih İsmail tarafından Franklara teslim edilmiştir {cite:kamil-ibn-al-athir s. 110-111} {cite:shadharat-dhahab, s. 189}."
  id: "Benteng Shaqif, yang dikenal sebagai penjara Jaldak dan Arnoun—Boabor di kalangan bangsa Franka—di atas Sungai Litani, merupakan bagian dari benteng Tiberias. Benteng ini ditaklukkan oleh Izz al-Din Farkhshah pada tahun 578 H dan diserahkan oleh Raja al-Salih Ismail kepada bangsa Franka pada tahun 638 H {cite:kamil-ibn-al-athir hlm. 110-111} {cite:shadharat-dhahab, hlm. 189}."
