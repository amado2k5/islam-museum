summary:
  ar: "مدينة من بلاد الروم، نزل عليها المعتصم بعد فتح حصون كثيرة سنة ثلاث وعشرين ومائتين فخرج إليه لاوي البطريق وسلمها وأسر بطريقها الكبير باطس وقتل منها ثلاثين ألفاً وأقام عليها أربعة أيام يهدم ويحرق وأراد المسير إلى القسطنطينية فصرفته فتنة العباس بن المأمون {cite:muruj-al-dhahab p. 450}."
  en: "The Phrygian capital stormed by al-Mu'tasim in 223 — delivered by its patrikios Lawi, sacked for four days while the caliph dreamed of Constantinople {cite:muruj-al-dhahab p. 450}."
  es: "La capital frigia, asaltada por al-Mu'tasim en 223, fue liberada por su patricio Lawi y saqueada durante cuatro días mientras el califa soñaba con Constantinopla {cite:muruj-al-dhahab p. 450}."
  fr: "La capitale phrygienne prise d'assaut par al-Mu'tasim en 223 — livrée par son patrikios Lawi, pillée pendant quatre jours tandis que le calife rêvait de Constantinople {cite:muruj-al-dhahab p. 450}."
  ur: "223 میں المعتصم کی طرف سے فریگین کے دارالحکومت پر حملہ کیا گیا - اس کے سرپرست لاوی کے ذریعہ پہنچایا گیا، چار دن کے لئے برطرف کیا گیا جب کہ خلیفہ نے قسطنطنیہ کا خواب دیکھا۔ 450}۔"
  tr: "Roma topraklarında bir şehir; 223 Hicri yılında birçok kaleyi fethettikten sonra Al-Mu'tasim'in yerleştiği yer. Levili Penguen ona gitti, yolu teslim etti, büyük Batis yolunu ele geçirdi, otuz binini öldürdü, dört gün boyunca orada kalarak yıktı ve yaktı, Konstantinopolis'e yürümeyi planladı, ancak Abbas ibn al-Ma'mun'un isyanı patlak verdi {cite:muruj-al-dhahab, s. 450}."
  id: "Sebuah kota di tanah Romawi, tempat Al-Mu'tasim menetap setelah menaklukkan banyak benteng pada tahun 223 H. Penguin Lewi pergi kepadanya, menyerahkannya, merebut jalan besar Batis, membunuh tiga puluh ribu dari mereka, tinggal di sana selama empat hari, menghancurkan dan membakarnya, dan berniat berbaris ke Konstantinopel, tetapi pemberontakan Abbas ibn al-Ma'mun memicu {cite:muruj-al-dhahab, hlm. 450}."
