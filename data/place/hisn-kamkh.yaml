label: { ar: "حصن كَمْخ", en: "Hisn Kamkh (Kamacha)" }
summary:
  ar: "حصن كَمْخ من ثغور أرمينية على مقربة من شمشاط؛ تناوب عليه المسلمون والروم غزواً بعد غزو: فُتح لعمير بن الحباب سنة 59 إذ صعد سوره وحده، وفتحه مسلمة بن عبد الملك، وحوصر بالمجانيق والدبابات سنة 149 تحت العباس بن محمد ففُتح بعد مقتل مائتي رجل من المسلمين بالحجارة، وفتحه عامل شمشاط سنة 177، وردّه عبد الله بن طاهر في خلافة المأمون، ثم دُفع إلى الروم مؤامرةً من نصارى شمشاط مع يقلّا وبقراط بن أشوط."
  en: "Hisn Kamkh (Kamacha), a fortress of the Armenian marches near Shimshat, contested raid after raid between Muslims and Romans: taken for Umayr ibn al-Habab in year 59 who climbed its wall alone, retaken by Maslama ibn Abd al-Malik, besieged with mangonels and armoured shelters in year 149 under al-Abbas ibn Muhammad until it fell after two hundred Muslims were killed by stones, taken again by Shimshat's governor in year 177, restored by Abdallah ibn Tahir in al-Ma'mun's caliphate, then delivered to the Romans by a plot of Shimshat's Christians with Yiqala and Baqrat ibn Ashut."
