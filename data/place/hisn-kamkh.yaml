label: { ar: "حصن كَمْخ", en: "Hisn Kamkh (Kamacha)", es: "Hisn Kamkh (Kamacha)", fr: "Hisn Kamkh (Kamacha)", ur: "ہسن کامخ ⁦(کماچہ)⁩" }
summary:
  ar: "حصن كَمْخ من ثغور أرمينية على مقربة من شمشاط؛ تناوب عليه المسلمون والروم غزواً بعد غزو: فُتح لعمير بن الحباب سنة 59 إذ صعد سوره وحده، وفتحه مسلمة بن عبد الملك، وحوصر بالمجانيق والدبابات سنة 149 تحت العباس بن محمد ففُتح بعد مقتل مائتي رجل من المسلمين بالحجارة، وفتحه عامل شمشاط سنة 177، وردّه عبد الله بن طاهر في خلافة المأمون، ثم دُفع إلى الروم مؤامرةً من نصارى شمشاط مع يقلّا وبقراط بن أشوط."
  en: "Hisn Kamkh (Kamacha), a fortress of the Armenian marches near Shimshat, contested raid after raid between Muslims and Romans: taken for Umayr ibn al-Habab in year 59 who climbed its wall alone, retaken by Maslama ibn Abd al-Malik, besieged with mangonels and armoured shelters in year 149 under al-Abbas ibn Muhammad until it fell after two hundred Muslims were killed by stones, taken again by Shimshat's governor in year 177, restored by Abdallah ibn Tahir in al-Ma'mun's caliphate, then delivered to the Romans by a plot of Shimshat's Christians with Yiqala and Baqrat ibn Ashut."
  es: "Hisn Kamkh (Kamacha), una fortaleza de las marcas armenias cerca de Shimshat, resistió incursión tras incursión entre musulmanes y romanos: tomada por Umayr ibn al-Habab en el año 59, quien escaló su muralla solo, retomada por Maslama ibn Abd al-Malik, asediada con mangoneles y refugios blindados en el año 149 bajo el mando de al-Abbas ibn Muhammad hasta que cayó después de que doscientos musulmanes murieran apedreados, tomada nuevamente por el gobernador de Shimshat en el año 177, restaurada por Abdallah ibn Tahir en el califato de al-Ma'mun, y luego entregada a los romanos por una conspiración de los cristianos de Shimshat con Yiqala y Baqrat ibn Ashut."
  fr: "Hisn Kamkh (Kamacha), une forteresse des marches arméniennes près de Shimshat, fut le théâtre de raids successifs entre musulmans et Romains: prise par Umayr ibn al-Habab en l'an 59 qui escalada seul ses remparts, reprise par Maslama ibn Abd al-Malik, assiégée avec des mangonneaux et des abris blindés en l'an 149 sous al-Abbas ibn Muhammad jusqu'à sa chute après que deux cents musulmans eurent été tués par des pierres, reprise par le gouverneur de Shimshat en l'an 177, restaurée par Abdallah ibn Tahir dans le califat d'al-Ma'mun, puis livrée aux Romains par un complot des chrétiens de Shimshat avec Yiqala et Baqrat ibn Ashut."
  ur: "شمشات کے قریب آرمینیائی مارچوں کا قلعہ حسن کامخ ⁦(کماچہ)⁩ نے مسلمانوں اور رومیوں کے درمیان چھاپے کے بعد حملہ کیا: 59 میں عمیر بن الحباب کے لیے لیا گیا جو اکیلے اس کی دیوار پر چڑھ گیا، مسلمہ بن عبد الملک نے اسے دوبارہ حاصل کیا، مینگونیل اور بکتر بند پناہ گاہوں کے ساتھ محاصرہ کیا یہاں تک کہ محمد بن حباب دو سال بعد اس کے نیچے آ گیا۔ سو مسلمانوں کو پتھروں سے مارا گیا، جنہیں شمشات کے گورنر نے سنہ 177 میں دوبارہ لیا، عبداللہ ابن طاہر نے المامون کی خلافت میں بحال کیا، پھر شمشات کے عیسائیوں کے ایک سازش کے ذریعے یقلہ اور بقراط ابن اشوت کے ساتھ رومیوں کو پہنچایا۔"
