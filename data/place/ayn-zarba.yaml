summary:
  ar: "عين زربة من مدن الثغور الشامية؛ أمر الرشيد بابتناء مدينتها وتحصينها سنة 180 وندب إليها نُذبة من أهل خراسان وغيرهم فأقطعهم بها المنازل، وأغارت عليها الروم والقاسم بن الرشيد مقيم بدابق فاستاقوا مواشي أهلها وأسروا بشراً فنفر إليهم أهل المصيصة ومطوعتها فاستنقذوا ما صار إليهم، فوجّه القاسم من حصّنها ورمّها وزاد في شحنتها؛ ونقل إليها المعتصم بشراً من الزط الذين غلبوا على البطائح بين واسط والبصرة فانتفع أهلها بهم."
  en: "Ayn Zarba (Anazarbus) among the Syrian march-cities; al-Rashid ordered its building and fortification in year 180, summoning levies of Khurasanis and others whom he granted house-lots there; the Byzantines raided it while al-Qasim ibn al-Rashid dwelt at Dabiq, driving off its people's herds and taking captives, until the men and volunteers of Masisa flew to them and recovered all that had reached the raiders, so al-Qasim sent men to fortify and repair it and added to its garrison; al-Mu'tasim later transferred to it and its districts people of the Zutt who had mastered the Bata'ih between Wasit and Basra, and its people profited by them."
  es: "Ayn Zarba (Anazarbus) se encontraba entre las ciudades fronterizas sirias; al-Rashid ordenó su construcción y fortificación en el año 180, convocando levas de Jorasánidos y otros a quienes concedió parcelas de tierra allí; los bizantinos la saquearon mientras al-Qasim ibn al-Rashid habitaba en Dabiq, expulsando los rebaños de su gente y tomando cautivos, hasta que los hombres y voluntarios de Masisa volaron hacia ellos y recuperaron todo lo que había llegado a los asaltantes, por lo que al-Qasim envió hombres para fortificarla y repararla y aumentó su guarnición; al-Mu'tasim posteriormente trasladó a ella y a sus distritos a gente de los Zutt que había dominado el Bata'ih entre Wasit y Basora, y su gente se benefició de ellos."
  fr: "Ayn Zarba (Anazarbe) figurait parmi les villes de la marche syrienne. Al-Rachid ordonna sa construction et sa fortification en l'an 180, mobilisant des troupes du Khorasan et d'autres peuples auxquels il octroya des parcelles de terrain. Les Byzantins la pillèrent alors qu'al-Qasim ibn al-Rachid résidait à Dabiq, emportant les troupeaux de ses habitants et faisant des prisonniers. Les hommes et les volontaires de Massa accoururent à leur secours et récupérèrent tout ce qui avait atteint les assaillants. Al-Qasim envoya alors des hommes pour la fortifier et la réparer, et renforça sa garnison. Plus tard, al-Mu'tasim y transféra, ainsi que dans ses environs, des habitants de la région de Zutt, qui avaient conquis la Bata'ih entre Wasit et Bassora, et la population locale en tira profit."
  ur: "شام کے مارچ والے شہروں میں عین زربا ⁦(انزاربس)⁩؛ الرشید نے سال 180 میں اس کی تعمیر اور قلعہ بندی کا حکم دیا، خراسانیوں اور دیگر لوگوں کو بلایا جن کو اس نے وہاں مکانات دیے تھے۔ بازنطینیوں نے اس پر چھاپہ مارا جب کہ القاسم بن الرشید دبیق میں مقیم تھا، وہاں کے لوگوں کے ریوڑ کو بھگا رہا تھا اور قیدیوں کو لے جا رہا تھا، یہاں تک کہ مسیسا کے آدمی اور رضاکار ان کے پاس پہنچے اور جو کچھ حملہ آوروں تک پہنچا تھا، وہ سب واپس لے لیا، چنانچہ القاسم نے اس کی مضبوطی اور مرمت کے لیے آدمی بھیجے اور اس میں شامل کر دیا۔ المعتصم نے بعد میں اسے اور اس کے اضلاع میں زت کے لوگوں کو منتقل کر دیا جنہوں نے وصیت اور بصرہ کے درمیان بطعیہ میں مہارت حاصل کی تھی اور اس کے لوگوں نے ان سے فائدہ اٹھایا۔"
  tr: "Ain Zarbah, Levant sınırlarının şehirlerinden biriydi; al-Rashid, şehrinin 180 Hicri yılında inşa edilip tahkim edilmesini emretti. Horasan'dan ve diğerlerinden bir grup insanı evlerini kapatmak üzere atadı. Romalılar ve Dabiq'ten gelen el-Kasım bin el-Reşid buraya baskın düzenledi, halkının hayvanlarını çaldılar, Beşar'ı ele geçirdiler ve el-Masisa halkı ile mutawa'a'sı başlarına gelenleri kurtarmak için acele etti. El-Kasim daha sonra kaleden çıktı, tahkim etti ve yükünü artırdı; el-Mutasim, Wasit ile Basra arasındaki Bata'ih'i domine eden Zat'tan isyancıları taşıdı ve halkı bundan faydalandı."
  id: "Ain Zarbah adalah salah satu kota di perbatasan Levant; al-Rashid memerintahkan pembangunan dan benteng kotanya pada tahun 180 H. Ia menunjuk sekelompok orang dari Khurasan dan lainnya untuk memblokir rumah mereka. Bangsa Romawi dan al-Qasim ibn al-Rashid, seorang penduduk Dabiq, menyerbunya, mencuri ternak rakyatnya, menangkap Bashar, dan rakyat al-Masisa beserta mutawa'a-nya bergegas menyelamatkan apa yang terjadi pada mereka. Al-Qasim kemudian berbaris dari bentengnya, memperkuatnya, dan menambah muatan; al-Mu'tasim mengangkut pemberontak dari Zat, yang telah menguasai Bata'ih antara Wasit dan Basra, dan rakyatnya mendapat manfaat dari mereka."
