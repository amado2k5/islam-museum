label: { ar: "عين زربة", en: "Ayn Zarba (Anazarbus)" }
summary:
  ar: "عين زربة من مدن الثغور الشامية؛ أمر الرشيد بابتناء مدينتها وتحصينها سنة 180 وندب إليها نُذبة من أهل خراسان وغيرهم فأقطعهم بها المنازل، وأغارت عليها الروم والقاسم بن الرشيد مقيم بدابق فاستاقوا مواشي أهلها وأسروا بشراً فنفر إليهم أهل المصيصة ومطوعتها فاستنقذوا ما صار إليهم، فوجّه القاسم من حصّنها ورمّها وزاد في شحنتها؛ ونقل إليها المعتصم بشراً من الزط الذين غلبوا على البطائح بين واسط والبصرة فانتفع أهلها بهم."
  en: "Ayn Zarba (Anazarbus) among the Syrian march-cities; al-Rashid ordered its building and fortification in year 180, summoning levies of Khurasanis and others whom he granted house-lots there; the Byzantines raided it while al-Qasim ibn al-Rashid dwelt at Dabiq, driving off its people's herds and taking captives, until the men and volunteers of Masisa flew to them and recovered all that had reached the raiders, so al-Qasim sent men to fortify and repair it and added to its garrison; al-Mu'tasim later transferred to it and its districts people of the Zutt who had mastered the Bata'ih between Wasit and Basra, and its people profited by them."
