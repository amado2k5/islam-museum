summary:
  ar: "بلدة في الجبال ⁦(الجبال الغربية)⁩، على بعد نحو سبعة فراسخ أو 54 كم جنوب غرب همذان، عند منحدر جبل ألوند، على مدخل سهل زراعي خصب؛ كانت محطة قوافل دائمة على طريق همذان-بغداد القديم، وكانت مزدهرة كثيفة السكان في العصر العباسي وحتى العصر المغولي {cite:encyclopaedia-of-islam-2 vol. 1 p. 734-735}."
  en: "A town in al-Jibal, about seven farsakhs or 54 km south-west of Hamadhan, on the western slope of the Alwand Kuh at the entrance to a fertile plain. It was a permanent caravan station on the ancient Hamadhan-Baghdad road, and in the Arab Middle Ages and even under the Mongols it was a prosperous, populous place with good markets {cite:encyclopaedia-of-islam-2 vol. 1 p. 734-735}."
  es: "Una ciudad en al-Jibal, a unos siete farsakhs o 54 km al suroeste de Hamadhan, en la ladera occidental del Alwand Kuh, a la entrada de una llanura fértil. Fue una estación de caravanas permanente en la antigua ruta Hamadhan-Bagdad, y en la Edad Media árabe, e incluso bajo el dominio mongol, fue un lugar próspero y populoso con buenos mercados {cite:encyclopaedia-of-islam-2 vol. 1 p. 734-735}."
  fr: "Ville située à al-Jibal, à environ sept farsakhs (54 km) au sud-ouest d'Hamadhan, sur le versant ouest de l'Alwand Kuh, à l'entrée d'une plaine fertile, elle constituait une étape permanente pour les caravanes sur l'ancienne route Hamadhan-Bagdad. Au Moyen Âge arabe, et même sous l'occupation mongole, c'était un lieu prospère et peuplé, doté de marchés florissants (voir: Encyclopaedia of Islam, vol. 1, p. 734-735)."
  ur: "الجبل کا ایک قصبہ، تقریباً سات فرسخ یا 54 کلومیٹر جنوب مغرب میں حمادان سے، ایک زرخیز میدان کے دروازے پر الوند کوہ کی مغربی ڈھلوان پر۔ یہ قدیم ہمدان-بغداد روڈ پر کارواں کا ایک مستقل اسٹیشن تھا، اور عرب قرون وسطی اور یہاں تک کہ منگولوں کے دور میں بھی یہ ایک خوشحال، آبادی والا مقام تھا جس میں اچھی مارکیٹیں تھیں۔ 1 ص۔ 734-735}۔"
