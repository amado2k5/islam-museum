summary:
  ar: "بلدة في الجبال (الجبال الغربية)، على بعد نحو سبعة فراسخ أو 54 كم جنوب غرب همذان، عند منحدر جبل ألوند، على مدخل سهل زراعي خصب؛ كانت محطة قوافل دائمة على طريق همذان-بغداد القديم، وكانت مزدهرة كثيفة السكان في العصر العباسي وحتى العصر المغولي {cite:encyclopaedia-of-islam-2 vol. 1 p. 734-735}."
  en: "A town in al-Jibal, about seven farsakhs or 54 km south-west of Hamadhan, on the western slope of the Alwand Kuh at the entrance to a fertile plain. It was a permanent caravan station on the ancient Hamadhan-Baghdad road, and in the Arab Middle Ages and even under the Mongols it was a prosperous, populous place with good markets {cite:encyclopaedia-of-islam-2 vol. 1 p. 734-735}."
