summary:
  ar: "الاسم القديم لنيسابور، وكانت عاصمة أحد الأرباع الأربعة لإقليم خراسان. تُفسَّر تسميتها في المصادر الإسلامية بأنها «مدينة السحاب»، وسكّت عملة في العصر الساساني والعربي الساساني والأموي، وظهر اسمها العربي على دراهم ما بعد الإصلاح. {cite:encyclopaedia-of-islam-2 vol. 1 p. 22}"
  en: "The older name of Nishapur and the capital of one of the four quarters of the province of Khurasan. Muslim geographers explain the name as 'Cloud-city'; the mint signature on Sasanian coins and the Arab-Sasanian dirhams of the conquest period, and the Arabic name on Umayyad post-reform dirhams (91/709–97/715), show that it kept minting under that name until the later coins were struck as Nisabur. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
  ur: "نیشاپور کا قدیم نام، جو خراسان کے چار اضلاع میں سے ایک کا دارالحکومت تھا۔ مسلمان جغرافیہ نگار اس کے نام کو «ابر کا شہر» بتاتے ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
  es: "El nombre antiguo de Nishapur y la capital de uno de los cuatro distritos de la provincia de Jorasán. Los geógrafos musulmanes explican el nombre como «Ciudad de las Nubes»; la firma de ceca en las monedas sasánidas y en los dirhams árabe-sasánidas del período de la conquista, así como el nombre árabe en los dirhams omeyas posteriores a la reforma (91/709–97/715), demuestran que se siguió acuñando con ese nombre hasta que las monedas posteriores se acuñaron como Nisabur. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
  fr: "L'ancien nom de Nishapur désignait la capitale de l'un des quatre quartiers de la province du Khorasan. Les géographes musulmans expliquent ce nom par « ville des nuages ». La signature de l'atelier monétaire sur les pièces sassanides et les dirhams arabo-sassanides de la période de la conquête, ainsi que le nom arabe figurant sur les dirhams omeyyades post-réforme (91/709–97/715), montrent que la ville a continué à frapper des pièces sous ce nom jusqu'à ce que les pièces plus récentes soient frappées sous le nom de Nisabur. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
  tr: "Nişapur'un eski adı ve Horasan bölgesinin dört mahallesinden birinin başkentiydi. İslami kaynaklar adını 'Bulutlar Şehri' olarak açıklar; madeni paralar Sasani, Sasani ve Emevi dönemlerinde basılmış, Arapça adı ise Reform sonrası dirhemlerde ortaya çıkmıştır. {cite:encyclopaedia-of-Islam-2 cilt 1 s. 22}"
  id: "Nama kuno Nishapur, dan merupakan ibu kota salah satu dari empat kawasan wilayah Khorasan. Sumber Islam menjelaskan namanya sebagai 'Kota Awan,' dan koin dicetak pada era Sasanian, Sassaniah, dan Umayyah, serta nama Arabnya muncul pada dirham setelah Reformasi. {cite:Encyclopaedia-of-Islam-2 vol. 1 hlm. 22}"
