summary:
  ar: "الاسم القديم لنيسابور، وكانت عاصمة أحد الأرباع الأربعة لإقليم خراسان. تُفسَّر تسميتها في المصادر الإسلامية بأنها «مدينة السحاب»، وسكّت عملة في العصر الساساني والعربي الساساني والأموي، وظهر اسمها العربي على دراهم ما بعد الإصلاح. {cite:encyclopaedia-of-islam-2 vol. 1 p. 22}"
  en: "The older name of Nishapur and the capital of one of the four quarters of the province of Khurasan. Muslim geographers explain the name as 'Cloud-city'; the mint signature on Sasanian coins and the Arab-Sasanian dirhams of the conquest period, and the Arabic name on Umayyad post-reform dirhams (91/709–97/715), show that it kept minting under that name until the later coins were struck as Nisabur. {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
  ur: "نیشاپور کا قدیم نام، جو خراسان کے چار اضلاع میں سے ایک کا دارالحکومت تھا۔ مسلمان جغرافیہ نگار اس کے نام کو «ابر کا شہر» بتاتے ہیں۔ {cite:encyclopaedia-of-islam-2 vol. 1 pp. 22–23}"
