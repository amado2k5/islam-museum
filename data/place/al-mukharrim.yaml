summary:
  ar: "قرية قرب عين التمر؛ عند البلاذري لم يكن يدعى يومئذ مخرّماً إنما نزله بعض ولد مخرّم بن حزن بن زياد بن أنس الديان الحارثي فسمّي به فيما ذكر هشام بن محمد الكلبي."
  en: "Village near Ayn al-Tamr; in al-Baladhuri it was not yet called Mukharrim then — it was named after a descendant of Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi who settled it, per al-Kalbi."
  es: "Pueblo cerca de Ayn al-Tamr; en al-Baladhuri todavía no se llamaba Mukharrim; recibió el nombre de un descendiente de Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi, quien lo estableció, según al-Kalbi."
  fr: "Village près d'Ayn al-Tamr; à al-Baladhuri, il ne s'appelait pas encore Mukharim à l'époque - il portait le nom d'un descendant de Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi qui l'a réglé, selon al-Kalbi."
  ur: "عین التمر کے قریب گاؤں؛ البلادھوری میں اس وقت تک اسے مخرم نہیں کہا جاتا تھا - اس کا نام مکرم بن حزن ابن زیاد ابن انس الدیان الحارثی کی اولاد کے نام پر رکھا گیا جس نے اسے آباد کیا، فی الکلبی۔"
  tr: "Ain al-Tamr yakınlarında bir köy; el-Baladhuri'ye göre o dönemde Mukhrim olarak adlandırılmamış, ancak Mukhram ibn Hazn ibn Ziyad ibn Anas al-Dayan al-Harithi'nin bazı soyundan gelenler tarafından yerleşilmiş ve Hisham ibn Muhammed el-Kalbi'nin de belirttiği gibi adını almıştır."
  id: "Sebuah desa dekat Ain al-Tamr; menurut al-Baladhuri, saat itu belum disebut Mukhrim, tetapi dihuni oleh beberapa keturunan Mukhram ibn Hazn ibn Ziyad ibn Anas al-Dayan al-Harithi, dan dinamai sesuai dengan nama tersebut seperti yang disebutkan oleh Hisham ibn Muhammad al-Kalbi."
