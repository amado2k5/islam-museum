summary:
  ar: "مدينة على البحر وعلى ضفة خور عذب تدخله المراكب، تبعد عن أوريسين ثلاث مراحل على الساحل. {cite:nuzhat-al-mushtaq-2002 p. 202}"
  en: "A city on the sea, on the bank of a sweet-water creek that ships enter, three stages from Orissa along the coast. {cite:nuzhat-al-mushtaq-2002 p. 202}"
  es: "Una ciudad junto al mar, a orillas de un arroyo de agua dulce por donde entran los barcos, a tres etapas de Orissa a lo largo de la costa. {cite:nuzhat-al-mushtaq-2002 p. 202}"
  fr: "Une ville en bord de mer, sur les rives d'un bras de mer aux eaux douces où s'aventurent les navires, à trois étapes d'Orissa en longeant la côte. {cite:nuzhat-al-mushtaq-2002 p. 202}"
  ur: "سمندر پر ایک شہر، میٹھے پانی کی نالی کے کنارے جس میں بحری جہاز داخل ہوتے ہیں، ساحل کے ساتھ ساتھ اڑیسہ سے تین مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 202}"
  tr: "Deniz kenarında ve teknelerle ulaşılabilen taze bir dere kıyısında, kıyıdaki Orisin'den üç aşama mesafede. {kaynak:nuzhat-al-mushtaq-2002 s. 202}"
  id: "Sebuah kota di tepi laut dan di tepi sungai segar yang dapat diakses dengan perahu, tiga tahap dari Orisin di pantai. {cite:nuzhat-al-mushtaq-2002 hlm. 202}"
