summary:
  ar: "مدينة في غرب إيران تولّى فيها ابن سينا الوزارة وتوفي فيها سنة 1037م، وعند المسعودي سمي بابها باب الأسد لأسد من حجارة على ربوة على طريق الري كالثور العظيم كأنه أسد حي، وكان أهلها يتوارثون أن الأسكندر بن فيلبس بنى همذان حين انصرافه من خراسان وأن الأسد جعل طلسماً للمدينة وأن خراب البلد وفناء أهلها يكون عند كسره وقلعه من وجهة الديلم والجيل، فقلبه عسكر مرداويج قبل وقعة همذان فكسر فكانت المجزرة {cite:muruj-al-dhahab p. 725}"
  en: City in western Iran where Ibn Sina served as vizier and where he died in 1037.
