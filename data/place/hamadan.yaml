summary:
  ar: "مدينة في غرب إيران تولّى فيها ابن سينا الوزارة وتوفي فيها سنة 1037م، وعند المسعودي سمي بابها باب الأسد لأسد من حجارة على ربوة على طريق الري كالثور العظيم كأنه أسد حي، وكان أهلها يتوارثون أن الأسكندر بن فيلبس بنى همذان حين انصرافه من خراسان وأن الأسد جعل طلسماً للمدينة وأن خراب البلد وفناء أهلها يكون عند كسره وقلعه من وجهة الديلم والجيل، فقلبه عسكر مرداويج قبل وقعة همذان فكسر فكانت المجزرة {cite:muruj-al-dhahab p. 725}"
  en: City in western Iran where Ibn Sina served as vizier and where he died in 1037.
  es: "Ciudad del oeste de Irán donde Ibn Sina ejerció como visir y donde falleció en 1037."
  fr: "Ville de l'ouest de l'Iran où Ibn Sina a exercé les fonctions de vizir et où il est mort en 1037."
  ur: "مغربی ایران کا وہ شہر جہاں ابن سینا نے وزیر کے طور پر خدمات انجام دیں اور جہاں اس کا انتقال 1037 میں ہوا۔"
  tr: "İran'ın batısında, İbn Sina'nın hizmete geçtiği ve 1037 yılında öldüğü bir şehirdir. El-Mes'udi'ye göre, kapısı sulama yolundaki tepede taş yapılmış bir aslan için Bab al-Asad olarak adlandırılmıştır; büyük bir boğa gibi, sanki yaşayan bir aslanmış gibi. Halkı, İskender ibn Filip'in Horasan'dan ayrılırken Hamadan'ı inşa ettiğini, aslanın şehri bir muska haline getirdiğini ve şehrin ve halkının Daylam ve Jill yanlarından sökülüp kırıldığında yıkıma uğrayacağını miras almıştır. Mardavij'in ordusu, Hamadan Savaşı'ndan önce şehri devirmiş ve bu savaş kırılmış ve katliama yol açmıştır {cite:muruj-al-dhahab, s. 725}."
  id: "Sebuah kota di barat Iran di mana Ibn Sina mengambil alih kementerian dan meninggal pada tahun 1037 M. Menurut al-Mas'udi, gerbangnya dinamai Bab al-Asad untuk menghormati singa yang terbuat dari batu di atas bukit di atas jalan irigasi, seperti banteng besar, seolah-olah singa hidup. Rakyatnya mewarisi bahwa Alexander ibn Philip membangun Hamadan saat ia meninggalkan Khorasan, dan bahwa singa itu menjadikan kota itu sebagai jimat dan bahwa kehancuran kota serta penduduknya akan terjadi ketika kota itu dihancurkan dan dicabut dari sisi Daylam dan Jill. Pasukan Mardavij menggulingkannya sebelum Pertempuran Hamadan, yang kemudian menghancurkannya, menyebabkan pembantaian {cite:muruj-al-dhahab, hlm. 725}."
