summary:
  ar: "مدينة كانت قبل ذلك متحضرة كثيرة العمارات، واقعة في فحص أفيح كثير الأعشاب، وفيها الآن بقايا عمارات وخراب. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  en: "A town that was once civilised and built up, set in a wide plain full of herbs, now left with the remains of buildings and ruin. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  es: "Una ciudad que antaño fue civilizada y floreciente, situada en una extensa llanura repleta de hierbas, ahora reducida a ruinas y restos de edificios. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  fr: "Une ville jadis civilisée et prospère, située dans une vaste plaine verdoyante, aujourd'hui réduite à l'état de ruines et de vestiges de bâtiments. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  ur: "ایک قصبہ جو کبھی مہذب اور تعمیر کیا گیا تھا، جڑی بوٹیوں سے بھرے ایک وسیع میدان میں قائم تھا، اب عمارتوں اور کھنڈرات کے باقیات کے ساتھ رہ گیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 244}"
  tr: "Daha önce çok sayıda binayla medenileşmiş, sık bir çayır alanda yer alan bir şehir, şimdi bina kalıntıları ve kalıntılar barındırmaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 244}"
  id: "Sebuah kota yang sebelumnya beradab dengan banyak bangunan, terletak di area padang rumput yang lebat, kini berisi sisa-sisa bangunan dan reruntuhan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 244}"
