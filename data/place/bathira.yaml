summary:
  ar: "قلعة منيعة الحصن رقيعة القدر، مشرفة على البحر، تبعد عن جزيرة صقلية مرحلة مع أحواز من الأرض، ويذكر الإدريسي أن واديها عظيم يدور بها. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  en: "A strong fortress of modest size overlooking the sea; a valley of great size circles it, in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  es: "Una sólida fortaleza de tamaño modesto con vistas al mar; un valle de gran extensión la rodea, según el relato de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  fr: "Une forteresse imposante de taille modeste dominant la mer; une vaste vallée l’entoure, selon le récit d’al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  ur: "معمولی سائز کا ایک مضبوط قلعہ جو سمندر کو دیکھتا ہے۔ الادریسی کے بیان میں، ایک بڑے سائز کی وادی اس کے گرد چکر لگاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 599}"
  tr: "Kalenin kalesi, denize bakan muhteşem bir kaledir; Sicilya adasından bir adım uzaklıkta, kara kenarlarıyla birlikte yer alır. Al-Idrisi, vadisinin geniş olduğunu ve içinden aktığını belirtir. {cite:nuzhat-al-mushtaq-2002 s. 599}"
  id: "Benteng benteng ini adalah benteng megah yang menghadap laut, terletak selangkah dari pulau Sisilia, bersama dengan tepi daratan. Al-Idrisi menyebutkan bahwa lembahnya luas dan mengalir melaluinya. {cite:nuzhat-al-mushtaq-2002 hlm. 599}"
