summary:
  ar: "حصن منيع فيه بركتان للماء، وكروم تحمل عنباً كبير الحب يُصنع منه الزبيب ويُحمل إلى البلاد المجاورة، وهو على الطريق إلى صعدة. {cite:nuzhat-al-mushtaq-2002 p. 147}"
  en: "A strong fortress with two water pools and vineyards whose large grapes are dried into raisins and carried to neighbouring lands; it lies on the road to Sa'da. {cite:nuzhat-al-mushtaq-2002 p. 147}"
  es: "Una sólida fortaleza con dos estanques y viñedos cuyas grandes uvas se secan para convertirlas en pasas y se transportan a las tierras vecinas; se encuentra en el camino a Sa'da. {cite:nuzhat-al-mushtaq-2002 p. 147}"
  fr: "Une forteresse imposante dotée de deux bassins et de vignobles dont les gros raisins sont séchés en raisins secs et transportés vers les terres voisines; elle se situe sur la route de Sa'da. {cite:nuzhat-al-mushtaq-2002 p. 147}"
  ur: "ایک مضبوط قلعہ جس میں پانی کے دو تالاب اور انگور کے باغ ہیں جن کے بڑے انگور کشمش میں خشک کر کے ہمسایہ ممالک میں لے جایا جاتا ہے۔ یہ صعدہ کی سڑک پر واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 147}"
  tr: "İki su havuzu ve büyük üzüm yetiştiren bağlarla güçlü bir kale, bu bağlardan kuru üzüm yapıp komşu ülkelere taşınır, Saada yolunda. {kaynak:nuzhat-al-mushtaq-2002 s. 147}"
  id: "Benteng kuat dengan dua kolam air dan kebun anggur yang menghasilkan anggur besar dari mana kismis dibuat dan diangkut ke negara tetangga, di jalan menuju Saada. {cite:Nuzhat-al-Mushtaq-2002 hlm. 147}"
