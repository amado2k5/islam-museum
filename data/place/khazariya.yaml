summary:
  ar: "مدينة كبيرة عامرة فسيحة كثيرة المياه، ينسب إليها الخزر، ويذكر المؤلف أنها تقع بعد اللانية {cite:nuzhat-al-mushtaq-2002 p. 915}."
  en: "A large, populous, spacious city with abundant water, to which the Khazars are attributed, which the author places after al-Lāniya {cite:nuzhat-al-mushtaq-2002 p. 915}."
  es: "Una ciudad grande, populosa y espaciosa con abundante agua, a la que se atribuyen los jázaros, que el autor sitúa después de al-Lāniya {cite:nuzhat-al-mushtaq-2002 p. 915}."
  fr: "Une grande ville peuplée et spacieuse avec de l'eau en abondance, à laquelle les Khazars sont attribués, que l'auteur place après al-Lāniya {cite:nuzhat-al-mushtaq-2002 p. 915}."
  ur: "ایک بہت بڑا، آبادی والا، کشادہ پانی والا شہر، جس کی طرف خزاروں کو منسوب کیا جاتا ہے، جسے مصنف نے الانیہ کے بعد رکھا ہے۔ 915}۔"
  tr: "Büyük, zengin, geniş ve bol suya sahip, Hazarlara atfedilen bir şehirdir ve yazar buranın Laniyya'dan sonra kurulduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 915}."
  id: "Sebuah kota besar, makmur, luas, dan melimpah dengan air melimpah, yang dikaitkan dengan Khazar, dan penulis menyebutkan bahwa kota ini terletak setelah Laniyya {cite:Nuzhat-al-Mushtaq-2002, hlm. 915}."
