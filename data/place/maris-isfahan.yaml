label: { ar: "مارس بأصبهان", en: "Maris at Isfahan", es: "Maris en Isfahán", fr: "Maris à Ispahan", ur: "اصفہان میں ماریس", tr: "İsfahan'da Yürüyüş", id: "Maret di Isfahan" }
summary:
  ar: "بيت معظم على رأس جبل بأصبهان على ثلاثة فراسخ منها، كانت فيه أصنام حتى أخرجها يستاسف الملك لما تمجس وجعله بيست ناره، وهو معظم عند المجوس إلى زمان المسعودي، ويعد من البيوت المعظمة المتخذة على أسماء الكواكب {cite:muruj-al-dhahab p. 538-539}."
  en: "The revered hill-shrine three farsakhs from Isfahan whose idols Gushtasp cast out for his fire-temple — still honoured by the Magians, and counted among the temples named for the planets {cite:muruj-al-dhahab p. 538-539}."
  es: "El venerado santuario de la colina, tres farsakhs de Isfahán, cuyos ídolos Gushtasp expulsó para su templo de fuego, sigue siendo honrado por los magos y se cuenta entre los templos que llevan el nombre de los planetas {cite:muruj-al-dhahab p. 538-539}."
  fr: "Le sanctuaire de colline vénéré des trois farsakhs d'Ispahan dont les idoles Gushtasp a rejetées pour son temple du feu — toujours honoré par les Mages, et compté parmi les temples nommés d'après les planètes {cite:muruj-al-dhahab p. 538-539}."
  ur: "اصفہان سے تین فرسخ کا قابل احترام پہاڑی مزار جس کے بت گشتاسپ نے اپنے آتش گیر معبد کے لیے نکالے تھے — جسے آج بھی مجوسیوں نے عزت دی ہے، اور سیاروں کے لیے نامزد مندروں میں شمار کیا جاتا ہے۔ 538-539}۔"
  tr: "İsfahan'da bir dağın zirvesinde, üç lig uzaklıkta, içinde putlar bulunan, ta ki onları kaldırana kadar bir onur evi vardı. Kral, etkilendiği için pişman oldu ve ateşinden en iyisini yaptı. El-Mes'udi zamanına kadar Magiler için büyük bir ev olarak kabul edildi ve gezegenlerin adını taşıyan onurlu evlerden biri olarak kabul edilir {cite:muruj-al-dhahab, s. 538-539}."
  id: "Sebuah rumah kehormatan di puncak gunung di Isfahan, tiga liga dari sana, berisi patung-patung hingga ia menghilangkannya. Raja menyesal telah disentuh dan memanfaatkan apinya sebaik mungkin. Rumah itu dianggap sebagai rumah besar bagi orang Majus hingga masa al-Mas'udi dan dianggap sebagai salah satu rumah terhormat yang dinamai menurut planet {cite:muruj-al-dhahab, hlm. 538-539}."
