  ar: "مناذر الكبرى والصغرى من كور الأهواز؛ حاصرها أبو موسى الأشعري وفتحها الربيع بن زياد الحارثي عنوة وقتل المقاتلة وسبى الذرية وولاها عاصم بن قيس السلمي وفيها استشهد المهاجر بن زياد صائماً مفطراً ونصبوا رأسه بين شرفتين."
  en: "Greater and Lesser Manadhir of al-Ahwaz's districts; Abu Musa besieged them and al-Rabi' ibn Ziyad took them by force, killing the fighters — governed by Asim ibn Qays al-Sulami — and there fell al-Muhajir ibn Ziyad, his head raised between two merlons."
