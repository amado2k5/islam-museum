summary:
  ar: "سد عظيم بناه ملوك الساسانيين أمام تستر في مجرى الماء، موثق بالحجر، يذكر الإدريسي أنه ارتدع به الماء حتى صار أعلى من الأرض حوله. {cite:nuzhat-al-mushtaq-2002 p. 393}"
  en: "A great dam built in front of Tustar in the water channel by Sasanian rulers, faced with stone; al-Idrisi says it held back the water until it stood above the land around it. {cite:nuzhat-al-mushtaq-2002 p. 393}"
  es: "Una gran presa construida frente a Tustar en el canal de agua por los gobernantes sasánidas, revestida de piedra; al-Idrisi dice que retenía el agua hasta que esta se elevaba por encima del terreno circundante. {cite:nuzhat-al-mushtaq-2002 p. 393}"
  fr: "Un grand barrage construit en face de Tustar, dans le canal d'irrigation, par les souverains sassanides, était revêtu de pierre; selon al-Idrisi, il retenait les eaux jusqu'à ce qu'elles dépassent le niveau des terres environnantes. {cite:nuzhat-al-mushtaq-2002 p. 393}"
