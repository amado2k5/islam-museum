summary:
  ar: "جزيرة قبالة ساحل شرق أفريقيا، مركز تجاري للثقافة السواحلية. نقل سعيد بن سلطان عاصمته إليها في ثلاثينيات القرن التاسع عشر، ثم صارت سلطنة مستقلة سنة 1856."
  en: "An island off the East African coast and a trading centre of Swahili culture. Said bin Sultan moved his capital there in the 1830s, and it became an independent sultanate in 1856."
  ur: "مشرقی افریقہ کے ساحل کے سامنے ایک جزیرہ اور سواحلی ثقافت کا تجارتی مرکز۔ سعید بن سلطان نے 1830ء کی دہائی میں اپنا دارالحکومت یہاں منتقل کیا، اور 1856ء میں یہ ایک آزاد سلطنت بن گئی۔"
  es: "Una isla frente a la costa de África Oriental y centro comercial de la cultura suajili. Said bin Sultan trasladó allí su capital en la década de 1830, y se convirtió en un sultanato independiente en 1856."
  fr: "Une île au large des côtes est-africaines et un centre commercial de culture swahilie. Saïd bin Sultan y transféra sa capitale dans les années 1830, et elle devint un sultanat indépendant en 1856."
