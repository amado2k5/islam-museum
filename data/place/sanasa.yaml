summary:
  ar: "جزيرة في البحر قبالة طريغيوقن، وفيها بئر يُذكر أنها تخرج منه نار محرقة ثم تخمد في بعض الأوقات. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  en: "An island facing Tarighyawqan with a well that, according to report, sends out burning fire which at times dies down. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  es: "Una isla frente a Tarighyawqan con un pozo que, según se cuenta, emite un fuego ardiente que a veces se extingue. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  fr: "Une île face à Tarighyawqan abrite un puits d'où jaillit, selon un témoignage, un feu ardent qui s'éteint parfois. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  ur: "ایک جزیرہ جس کا سامنا Targhyawqan کے ساتھ ایک کنواں ہے جو رپورٹ کے مطابق جلتی ہوئی آگ بھیجتا ہے جو کبھی کبھار مر جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 203}"
  tr: "Triguigen açıklarındaki denizde bir ada, buradan yanan bir ateş çıkardığı ve zaman zaman söndürdüğü söylenen bir kuyu var. {kaynak:nuzhat-al-mushtaq-2002 s. 203}"
  id: "Sebuah pulau di laut lepas pantai Triguigen, yang memiliki sumur yang dikatakan menghasilkan api yang menyala dan kemudian memadamkannya sesekali. {cite:Nuzhat-al-Mushtaq-2002 hlm. 203}"
