summary:
  ar: "فيد، بفتح الفاء، موضع معروف يقع على منحدر جنوب سلمى الجنوبي الشرقي، تمتد فيه مزارع النخيل إلى ميلين أو ثلاثة ويزرع فيه الحبوب، وعداده من نجد؛ وقد ورد ذكره في الأحداث وأشعار العرب ⁦(ص ٩٣ من الطبعة، في تعليق المحقق)⁩."
  en: "Fayd, with a fatha on the fa, is a known place on the south-eastern slope of the southern side of Salma. Palm plantations stretch for two or three miles there, and grain is grown; it is counted as part of Najd. Its name occurs in the events and in Arab poetry (p. 93 of the edition, in the editor's note)."
  es: "Fayd, con una fatha en la letra fa, es un lugar conocido en la ladera sureste del lado sur de Salma. Allí se extienden plantaciones de palmeras a lo largo de dos o tres millas, y se cultivan cereales; se considera parte de Najd. Su nombre aparece en los acontecimientos y en la poesía árabe (pág. 93 de la edición, en la nota del editor)."
  fr: "Fayd, dont le nom comporte une fatha, est un lieu connu situé sur le versant sud-est du versant sud du mont Salma. Des palmeraies s'y étendent sur deux ou trois kilomètres et on y cultive des céréales; ce lieu est considéré comme faisant partie du Najd. Son nom apparaît dans les récits historiques et la poésie arabe (p. 93 de l'édition, dans la note de l'éditeur)."
  ur: "Fayd، fata پر فتحہ کے ساتھ، سلمیٰ کے جنوبی جانب جنوب مشرقی ڈھلوان پر ایک معروف جگہ ہے۔ کھجور کے باغات وہاں دو یا تین میل تک پھیلے ہوئے ہیں، اور اناج اگایا جاتا ہے۔ اس کا شمار نجد کا حصہ ہے۔ اس کا نام واقعات اور عرب شاعری میں آتا ہے ⁦(ایڈیٹر کے نوٹ میں صفحہ 93)⁩۔"
