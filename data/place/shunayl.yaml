summary:
  ar: "نهر الثلج جنوبي غرناطة، مبدؤه من جبل شلير وهو جبل الثلج، وعليه تقع استجة وقنطرتها العجيبة. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  en: "The snow river south of Granada, rising in Jabal Shulayr, the snow mountain; Istija and its wonderful bridge stand on it. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  es: "El río de nieve al sur de Granada, que nace en Jabal Shulayr, la montaña nevada; sobre él se alzan Istija y su maravilloso puente. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  fr: "La rivière de neige au sud de Grenade, prenant sa source dans le Jabal Shulayr, la montagne enneigée; Istija et son magnifique pont s'y dressent. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  ur: "غرناطہ کے جنوب میں برف کا دریا، جبل شولیر میں بلند ہوتا ہے، برف کا پہاڑ؛ استجا اور اس کا شاندار پل اس پر کھڑا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 569}"
  tr: "Kar Nehri, Granada'nın güneyindedir ve Istaga ve onun muhteşem kemeri bulunan Kar Dağı olan Schlir Dağı'ndan doğar. {kaynak:nuzhat-al-mushtaq-2002 s. 569}"
  id: "Sungai Salju terletak di selatan Granada, berasal dari Gunung Schlir, yang merupakan Gunung Salju, di mana terletak Istaga dan lengkungan ajaibnya. {cite:nuzhat-al-mushtaq-2002 hlm. 569}"
