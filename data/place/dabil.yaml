  en: "Dabil (Dvin) of the third Armenia's cities; Anushirwan settled and fortified it; Habib ibn Maslama besieged its people and sat upon it until the Roman Maurian met him, night-attacked and killed him and spoiled his camp — in al-Waqidi's report — while the sounder version with them has Salman meeting the Maurian at Qaliqala."
