summary:
  ar: "دبيل من مدن أرمينية الثالثة؛ عمّرها أنوشروان وحصّنها؛ وحاصر حبيب بن مسلمة أهلها فأقام عليها فلقيه الموريان الرومي فبيّته وقتله وغنم ما كان في عسكره في رواية الواقدي — والثبت عندهم أن سلمان لقي الموريان بقاليقلا."
  en: "Dabil (Dvin) of the third Armenia's cities; Anushirwan settled and fortified it; Habib ibn Maslama besieged its people and sat upon it until the Roman Maurian met him, night-attacked and killed him and spoiled his camp — in al-Waqidi's report — while the sounder version with them has Salman meeting the Maurian at Qaliqala. In 280 the city was buried by an earthquake after a Shawwal eclipse — about a hundred houses surviving, thirty thousand dead pulled from the rubble {cite:muntazam-ibn-al-jawzi p. 143}."
  es: "Dabil (Dvin) era una de las ciudades de la tercera Armenia; Anushirwan la fundó y fortificó; Habib ibn Maslama sitió a su gente y la ocupó hasta que el romano Maurian lo encontró, lo atacó de noche, lo mató y arrasó su campamento —según el relato de al-Waqidi—, mientras que la versión más fidedigna afirma que Salman se encontró con el Maurian en Qaliqala. En el año 280, la ciudad quedó sepultada por un terremoto tras un eclipse de Shawwal; sobrevivieron alrededor de cien casas y se rescataron treinta mil muertos de entre los escombros {cite:muntazam-ibn-al-jawzi p. 143}."
  fr: "Dabil (Dvin), l'une des troisièmes villes d'Arménie, fut fondée et fortifiée par Anushirwan. Habib ibn Maslama assiégea ses habitants et l'occupa jusqu'à ce que le Romain Maurien le rencontre, l'attaque de nuit, le tue et pille son camp – selon le récit d'al-Waqidi – tandis qu'une version plus plausible situe la rencontre entre Salman et Maurien à Qaliqala. En 280, la ville fut ensevelie par un tremblement de terre après une éclipse de Shawwal; une centaine de maisons seulement subsistèrent, mais trente mille morts furent extraits des décombres (cf. Muntazam ibn al-Jawzi, p. 143)."
  ur: "آرمینیا کے تیسرے شہروں کا دبیل ⁦(ڈوین)⁩؛ انوشیروان نے اسے آباد کیا اور اسے مضبوط بنایا۔ حبیب ابن مسلمہ نے اس کے لوگوں کا محاصرہ کیا اور اس پر بیٹھا رہے یہاں تک کہ رومی موریان اس سے مل گئے، رات کو حملہ کرکے اسے قتل کردیا اور اس کے کیمپ کو خراب کردیا - الواقدی کی رپورٹ میں - جب کہ ان کے ساتھ بہتر ورژن میں قلقلہ میں سلمان کی موریان سے ملاقات کی ہے۔ 280 میں شوال گرہن کے بعد شہر ایک زلزلے سے دب گیا - تقریباً ایک سو گھر بچ گئے، تیس ہزار مردہ ملبے سے نکالے گئے۔ 143}۔"
