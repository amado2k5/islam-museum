summary:
  ar: "بلدة بجرجان نزلها صول التركي فحصره فيها يزيد بن المهلب ستة أشهر وقاتله مراراً حتى صالحه على أمان نفسه وماله وثلاثمائة من أهل بيته وتسليم البحيرة بما فيها."
  en: "A Jurjan town where Sul al-Turki camped; Yazid besieged him six months, fought him again and again, till he treated for his self, property and three hundred of his household against surrendering al-Buhayra and all in it."
  es: "Una ciudad de Jurjan donde acampó Sul al-Turki; Yazid lo asedió durante seis meses, combatió contra él una y otra vez, hasta que Sul pactó por su vida, sus propiedades y las de trescientos miembros de su familia a cambio de no rendirse ante al-Buhayra y todo lo que había en ella."
  fr: "Une ville de Jurjan où Sul al-Turki avait établi son campement; Yazid l'assiégea pendant six mois, le combattit à plusieurs reprises, jusqu'à ce qu'il se défende lui-même, ses biens et trois cents membres de sa famille contre la reddition d'al-Buhayra et de tout ce qui s'y trouvait."
  ur: "ایک جرجان شہر جہاں سل الترکی نے ڈیرہ ڈالا تھا۔ یزید نے اس کا چھ ماہ تک محاصرہ کیا، بار بار اس سے لڑتا رہا، یہاں تک کہ اس نے اپنی جان، مال اور اپنے تین سو گھر والوں کے لیے بحیرہ اور اس میں موجود تمام افراد کو ہتھیار ڈالنے کے خلاف علاج کیا۔"
  tr: "Sül el-Turki, Jurjan'da bir kasaba kurdu; Yazid bin el-Muhallab'ı altı ay boyunca kuşattı ve kendisi, serveti ve üç yüz ailesinin güvenliği için onunla barışana kadar defalarca savaştı, gölü ve içindekileri teslim etti."
  id: "Sebuah kota di Jurjan dihuni oleh Sul al-Turki, yang mengepung Yazid ibn al-Muhallab selama enam bulan dan bertempur dengannya berulang kali sampai dia berdamai demi keselamatan dirinya, kekayaannya, dan tiga ratus keluarganya, lalu menyerahkan danau beserta isinya."
