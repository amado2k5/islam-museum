summary:
  ar: "بلد من بلاد لمتونة، يذكر المؤلف أن بينه وبين أرض قمنورية اثنتي عشرة مرحلة في الصحراء، وأن الماء فيه قليل فيحفر المسافرون الآبار {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A place in the land of the Lamtuna. The author gives twelve stages of desert travel between it and Qamnuriyya, with little water, so travellers dig wells {cite:nuzhat-al-mushtaq-2002 p. 106}."
  es: "Un lugar en la tierra de Lamtuna. El autor describe doce etapas de viaje por el desierto entre este lugar y Qamnuriyya, con poca agua, por lo que los viajeros cavan pozos {cite:nuzhat-al-mushtaq-2002 p. 106}."
  fr: "Un lieu du pays des Lamtuna. L'auteur décrit douze étapes de voyage dans le désert entre ce lieu et Qamnuriyya, où l'eau est rare, obligeant les voyageurs à creuser des puits {cite:nuzhat-al-mushtaq-2002 p. 106}."
  ur: "لامتنا کی سرزمین میں ایک جگہ۔ مصنف نے اس اور قمنوریہ کے درمیان صحرائی سفر کے بارہ مراحل بتائے ہیں جن میں تھوڑا پانی ہے، اس لیے مسافر کنویں کھودتے ہیں۔ 106}۔"
