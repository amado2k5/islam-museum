label: { ar: "جبل سياه كوه", en: "Jabal Siyah Kuh", es: "Jabal Siyah Kuh", fr: "Jabal Siyah Kuh", ur: "جبل سیاہ کوہ", tr: "Siah Koh Dağı", id: "Gunung Siah Koh" }
summary:
  ar: "جبل قريب من جبل كركس كوه ليس فيه عمارة، وبينهما مسافة يسيرة، وفيه وحشة من توارى فيه لا يظهر. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  en: "A mountain close to Kirkis Kuh with no settlement, a short distance from it, a lonely place where those who hide do not reappear. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  es: "Una montaña cercana a Kirkis Kuh, sin asentamientos, a poca distancia de ella, un lugar solitario donde quienes se esconden no vuelven a aparecer. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  fr: "Une montagne proche de Kirkis Kuh, sans aucune habitation, à une courte distance de là, un lieu isolé où ceux qui se cachent ne réapparaissent pas. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  ur: "کرکس کوہ کے قریب ایک پہاڑ جس میں کوئی بستی نہیں، اس سے تھوڑے فاصلے پر، ایک تنہا جگہ جہاں چھپنے والے دوبارہ نظر نہیں آتے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 443}"
  tr: "Karkas Dağı yakınındaki bir dağ, binasız bir dağdır ve aralarında kısa bir mesafe vardır; orada saklananların görünmediği bir yalnızlık vardır. {cite:nuzhat-al-mushtaq-2002 s. 443}"
  id: "Sebuah gunung dekat Gunung Karkas adalah gunung tanpa bangunan, dan ada jarak pendek di antara keduanya, serta ada kesunyian di mana mereka yang bersembunyi di sana tidak muncul. {cite:Nuzhat-al-Mushtaq-2002 hlm. 443}"
