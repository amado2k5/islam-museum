summary:
  ar: "مدينة حسنة أزلية متوسطة القدر، يأتيها نهر من ناحية الجبل ويجاز عليه، وفيها تجارات ومنافع جمة، وشرب أهلها من عيون فيها. {cite:nuzhat-al-mushtaq-2002 p. 541}"
  en: "A fine, ancient, medium-sized town with a river coming down from the hills that is crossed by bridge, with much trade and advantage; its people drink from springs. {cite:nuzhat-al-mushtaq-2002 p. 541}"
  es: "Una hermosa y antigua ciudad de tamaño mediano, bañada por un río que desciende de las colinas y que es cruzada por un puente. Posee una importante actividad comercial y es próspera; sus habitantes beben de manantiales. {cite:nuzhat-al-mushtaq-2002 p. 541}"
  fr: "Une belle et ancienne ville de taille moyenne, traversée par une rivière descendant des collines et franchie par un pont, prospère grâce à un commerce florissant; ses habitants s’abreuvent à des sources. {cite:nuzhat-al-mushtaq-2002 p. 541}"
