summary:
  ar: "عاصمة إندونيسيا، تقع في جزيرة جاوة {cite:rihla-imam-akbar-indonesia-azhar p. 24}. فيها القصر الرئاسي الذي استقبل فيه الرئيس جوكو ويدودو الإمام الأكبر في 22 فبراير 2016م {cite:rihla-imam-akbar-indonesia-azhar p. 56}، وفيها جامعة شريف هداية الله الإسلامية الحكومية التي ألقى فيها الإمام خطابه الموجه إلى المسلمين {cite:rihla-imam-akbar-indonesia-azhar p. 79}، ومسجد الأزهر الذي سمّاه الشيخ شلتوت في زيارة سابقة {cite:rihla-imam-akbar-indonesia-azhar p. 105}."
  en: "Capital of Indonesia, on the island of Java. The Grand Imam met President Widodo at the palace here on 22 February 2016, gave his global address at Sharif Hidayatullah State Islamic University, and visited the Azhar Mosque named by Shaltut on an earlier visit."
  es: "Capital de Indonesia, en la isla de Java. El Gran Imán se reunió con el presidente Widodo en el palacio el 22 de febrero de 2016, pronunció su discurso mundial en la Universidad Islámica Estatal Sharif Hidayatullah y visitó la Mezquita de Al-Azhar, nombrada por Shaltut, en una visita anterior."
  fr: "Capitale de l'Indonésie, sur l'île de Java. Le Grand Imam a rencontré le président Widodo au palais le 22 février 2016, a prononcé un discours international à l'Université islamique d'État Sharif Hidayatullah et a visité la mosquée Al-Azhar, nommée par Shaltut lors d'une visite précédente."
  ur: "جاوا کے جزیرے پر انڈونیشیا کا دارالحکومت۔ گرینڈ امام نے 22 فروری 2016 کو یہاں محل میں صدر ودودو سے ملاقات کی، شریف ہدایت اللہ اسٹیٹ اسلامک یونیورسٹی میں اپنا عالمی خطاب کیا، اور قبل ازیں دورے پر شلتوت کے نام سے منسوب ازہر مسجد کا دورہ کیا۔"
  tr: "Endonezya'nın başkenti, Java adasında yer alır {cite:rihla-imam-akbar-indonezya-azhar s. 24}. Cumhurbaşkanı Joko Widodo'nun 22 Şubat 2016'da Büyük İmamı kabul ettiği cumhurbaşkanlığı sarayı {cite:rihla-imam-akbar-indonezya-azhar s. 56}} ve burada İmamın Müslümanlara hitaben yaptığı konuşmayı yaptığı Şerif Hidayatullah İslam Devleti Üniversitesi {cite:rihla-imam-akbar-indonezya-azhar s. 79} ve önceki ziyaretinde adını verdiği El-Ezher Camii {cite:rihla-imam-akbar-indonesia-azhar s. 105} bulunmaktadır."
  id: "Ibu kota Indonesia terletak di pulau Jawa {cite:rihla-imam-akbar-indonesia-azhar hlm. 24}. Di sini terdapat istana kepresidenan tempat Presiden Joko Widodo menerima Imam Agung pada 22 Februari 2016 {cite:rihla-imam-akbar-indonesia-azhar hlm. 56}, dan di sini terdapat Universitas Negeri Islam Sharif Hidayatullah tempat sang Imam menyampaikan pidatonya kepada umat Muslim {cite:rihla-imam-akbar-indonesia-azhar hlm. 79}, serta Masjid Al-Azhar, yang dinamai oleh Sheikh Shaltout saat kunjungan sebelumnya {cite:rihla-imam-akbar-indonesia-azhar hlm. 105}."
