  ar: "عاصمة إندونيسيا، تقع في جزيرة جاوة {cite:rihla-imam-akbar-indonesia-azhar p. 24}. فيها القصر الرئاسي الذي استقبل فيه الرئيس جوكو ويدودو الإمام الأكبر في 22 فبراير 2016م {cite:rihla-imam-akbar-indonesia-azhar p. 56}، وفيها جامعة شريف هداية الله الإسلامية الحكومية التي ألقى فيها الإمام خطابه الموجه إلى المسلمين {cite:rihla-imam-akbar-indonesia-azhar p. 79}، ومسجد الأزهر الذي سمّاه الشيخ شلتوت في زيارة سابقة {cite:rihla-imam-akbar-indonesia-azhar p. 105}."
  en: "Capital of Indonesia, on the island of Java. The Grand Imam met President Widodo at the palace here on 22 February 2016, gave his global address at Sharif Hidayatullah State Islamic University, and visited the Azhar Mosque named by Shaltut on an earlier visit."
