summary:
  ar: "مدينة في شمال إيران جنوب شرقي بحر قزوين، تُسمى اليوم كركان، وكانت ثاني مدن إقليم جرجان في الإسلام؛ هزم يزيد بن المهلب أتراك المنطقة سنة 98هـ (716م)، وتقول رواية إنه أسس المدينة على موقع قرية تُسمى أستراك، وصارت بعد الغزو المغولي أهم بلدة في الإقليم، وسكنها كثير من السادة {cite:encyclopaedia-of-islam-2 vol. 1 p. 769}."
  en: "A town in northern Iran about 23 miles east of the south-eastern corner of the Caspian Sea, now called Gurgan. In Islamic times it was the second city of the province of Gurgan, and after the Mongol conquest it replaced Gurgan as the principal town of the area. Yazid ibn al-Muhallab defeated the Turks of the area in 98 AH (716), and a tradition says that he founded the town on the site of a village called Astarak {cite:encyclopaedia-of-islam-2 vol. 1 p. 769}."
