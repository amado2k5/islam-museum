summary:
  ar: "مدينة في شمال إيران جنوب شرقي بحر قزوين، تُسمى اليوم كركان، وكانت ثاني مدن إقليم جرجان في الإسلام؛ هزم يزيد بن المهلب أتراك المنطقة سنة 98هـ ⁦(716م)⁩، وتقول رواية إنه أسس المدينة على موقع قرية تُسمى أستراك، وصارت بعد الغزو المغولي أهم بلدة في الإقليم، وسكنها كثير من السادة {cite:encyclopaedia-of-islam-2 vol. 1 p. 769}."
  en: "A town in northern Iran about 23 miles east of the south-eastern corner of the Caspian Sea, now called Gurgan. In Islamic times it was the second city of the province of Gurgan, and after the Mongol conquest it replaced Gurgan as the principal town of the area. Yazid ibn al-Muhallab defeated the Turks of the area in 98 AH (716), and a tradition says that he founded the town on the site of a village called Astarak {cite:encyclopaedia-of-islam-2 vol. 1 p. 769}."
  es: "Una ciudad en el norte de Irán, a unos 37 kilómetros al este del extremo sureste del mar Caspio, ahora llamada Gurgan. En la época islámica, era la segunda ciudad de la provincia de Gurgan, y tras la conquista mongola, reemplazó a Gurgan como la principal ciudad de la zona. Yazid ibn al-Muhallab derrotó a los turcos de la región en el año 98 de la Hégira (716 d. C.), y una tradición afirma que fundó la ciudad en el emplazamiento de una aldea llamada Astarak {cite:encyclopaedia-of-islam-2 vol. 1 p. 769}."
  fr: "Ville du nord de l'Iran, située à environ 37 kilomètres à l'est de l'extrémité sud-est de la mer Caspienne, aujourd'hui appelée Gurgan. À l'époque islamique, elle était la deuxième ville de la province de Gurgan et, après la conquête mongole, elle remplaça Gurgan comme principale ville de la région. Yazid ibn al-Muhallab vainquit les Turcs de la région en 98 AH (716), et une tradition rapporte qu'il fonda la ville sur le site d'un village appelé Astarak (source: Encyclopaedia of Islam, vol. 1, p. 769)."
  ur: "بحیرہ کیسپین کے جنوب مشرقی کونے سے تقریباً 23 میل مشرق میں شمالی ایران کا ایک قصبہ جسے اب گرگان کہتے ہیں۔ اسلامی دور میں یہ صوبہ گرگان کا دوسرا شہر تھا، اور منگول فتح کے بعد اس نے گرگن کی جگہ علاقے کے اہم شہر کے طور پر لے لی۔ یزید ابن المحلب نے 98 ہجری (716) میں اس علاقے کے ترکوں کو شکست دی، اور ایک روایت میں بتایا گیا ہے کہ اس نے اس شہر کی بنیاد ایک گاؤں کے مقام پر رکھی جس کا نام استرق ہے۔ 1 ص۔ 769}۔"
  tr: "Hazar Denizi'nin güneydoğusunda, kuzey İran'da yer alan ve bugün Karkan olarak adlandırılan bir şehir, İslam'da Gorgan bölgesinin ikinci şehriydi. Bölgenin Türkleri Yezid bin el-Muhallab, 98 Hicri (716 M.S.) yılında onu mağlup etti. Bir anlatıma göre, şehri Astrak adlı bir köyün bulunduğu yerde kurdu ve Moğol istilasından sonra bölgenin en önemli kasabası haline geldi; birçok Seyyid'in yaşadığı bir yer {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 769}."
  id: "Sebuah kota di utara Iran di tenggara Laut Kaspia, yang sekarang disebut Karkan, adalah kota kedua di wilayah Gorgan dalam Islam. Yazid ibn al-Muhallab, orang Turki di wilayah tersebut, mengalahkannya pada tahun 98 H (716 M). Salah satu catatan mengatakan ia mendirikan kota itu di lokasi sebuah desa bernama Astrak, dan setelah invasi Mongol, kota ini menjadi kota terpenting di wilayah tersebut, dihuni oleh banyak Sayyid {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 769}."
