summary:
  ar: "مدينة أزلية قديمة، عليها سور من حجارة حصين، ولها ربض فيه الأسواق، وعين جارية كبيرة عليها جناتهم وبساتينهم، وتبعد عن الجهنيين مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  en: "An ancient city with a strong stone wall and a suburb of markets, watered by a large running spring that feeds its gardens and orchards; one stage from al-Juhayniyyin. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  es: "Una ciudad antigua con una sólida muralla de piedra y un suburbio de mercados, regada por un gran manantial que alimenta sus jardines y huertos; a una etapa de al-Juhayniyyin. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  fr: "Une ancienne cité entourée d'une solide muraille de pierre et d'une banlieue commerçante, arrosée par une grande source qui irrigue ses jardins et ses vergers; à une étape d'al-Juhayniyyin. {cite:nuzhat-al-mushtaq-2002 p. 294}"
