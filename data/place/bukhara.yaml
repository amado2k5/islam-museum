summary:
  ar: مدينة على طريق الحرير في أوزبكستان الحالية، كانت مركز علم في عهد السامانيين وفيها نشأ ابن سينا وصالحت خاتونها عبيد الله بن زياد على ألف ألف بعد انهزام الترك عند بيكند ثم نكثت أيام سعيد بن عثمان فأعادت الصلح بالرهن وأعانته على سمرقند وحملت إليه الصلح بالترمذ. ويذكر المقدسي أنه لا ترى مثل لحمان بخارى ولهم جنس بطيخ يسمى الساف {cite:ahsan-al-taqasim p. 247}.
  en: Silk Road city in present-day Uzbekistan, a centre of learning under the Samanids and the home of Ibn Sina's youth. In the Futuh its Khatun truced Ubaydallah ibn Ziyad at a million after her Turks were routed at Baykand, broke covenant before Sa'id ibn Uthman's hundred-twenty-thousand host, renewed on hostages, aided him on Samarqand, and sued for peace at Tirmidh.
