education:
  did_you_know:
    ar: "بخارى مدينة على طريق الحرير كانت مركز علم في عهد السامانيين وفيها نشأ ابن سينا، وصالحت ملكتها عبيد الله بن زياد على ألف ألف."
    en: "Bukhara, a Silk Road city that became a centre of learning under the Samanids and the birthplace of Ibn Sina — its queen made peace with Ubayd Allah ibn Ziyad for a million."
    ur: "بخارہ، شاہراہِ ریشم کا شہر جو سامانیوں کے عہد میں علم کا مرکز بنا اور ابنِ سینا کی جائے پیدائش — اس کی ملکہ نے عبیداللہ بن زیاد سے دس لاکھ پر صلح کی۔"
    sources: [source/futuh-buldan-maarif-1407, source/ahsan-al-taqasim]
