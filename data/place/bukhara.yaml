summary:
  ar: "مدينة على طريق الحرير في واحة على المجرى الأدنى لنهر زرافشان في أوزبكستان الحالية، كانت مركز علم في عهد السامانيين وفيها نشأ ابن سينا. صالحت خاتونها عبيد الله بن زياد على ألف ألف ثم نكثت أيام سعيد بن عثمان. وتذكر دائرة المعارف الإسلامية أن السامانيين حكموها من 260هـ/874م حتى سقوطهم سنة 389هـ/999م، وأنها نُهبت في عهد جنكيز خان سنة 616هـ/1220م، ثم حكمها الأوزبك من 905هـ/1500م وبقيت إمارة إلى الثورة الروسية. ويذكر المقدسي أنه لا ترى مثل لحمان بخارى ولهم جنس بطيخ يسمى الساف {cite:ahsan-al-taqasim p. 247}."
  en: "Silk Road city in an oasis on the lower Zarafshan, in present-day Uzbekistan, a centre of learning under the Samanids and the home of Ibn Sina's youth. In the Futuh its Khatun truced Ubaydallah ibn Ziyad at a million after her Turks were routed at Baykand, broke covenant before Sa'id ibn Uthman's hundred-twenty-thousand host, renewed on hostages, aided him on Samarqand, and sued for peace at Tirmidh. The Encyclopaedia of Islam records Samanid rule from 260/874 to 389/999, the sack under Chingiz Khan in 616/1220, and Uzbek rule from 905/1500 as an emirate until the Russian Revolution."
  ur: "شاہراہِ ریشم پر دریائے زرافشان کے نچلے بہاؤ کی وادی میں موجودہ ازبکستان کا شہر، سامانیوں کے عہد میں علم کا مرکز اور ابن سینا کی جوانی کا وطن۔ اس کی خاتون نے عبیداللہ بن زیاد سے دس لاکھ پر صلح کی اور سعید بن عثمان کے زمانے میں عہد توڑ دیا۔ دائرۃ المعارف اسلامیہ کے مطابق یہاں 260ھ/874ء سے 389ھ/999ء تک سامانی حکومت رہی، 616ھ/1220ء میں چنگیز خان کے ہاتھوں لوٹا گیا، اور 905ھ/1500ء سے ازبکوں کے ماتحت امارت رہا، روسی انقلاب تک۔"
