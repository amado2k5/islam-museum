summary:
  ar: السند بلاد الهند على الساحل؛ وصفها حكيم بن جبلة لعثمان ماؤها وشل وثمرها دقل ولصها بطل إن قل الجيش فيها ضاعوا وإن كثروا جاعوا.
  en: al-Sind, India's seaboard; Hakim ibn Jabala's verdict to Uthman — scant water, worthless fruit, a trifling thief; small armies lost, large ones starved.
  es: "Al-Sind, la costa de la India; el veredicto de Hakim ibn Jabala a Uthman: poca agua, fruta sin valor, un ladrón insignificante; pequeños ejércitos perdidos, grandes ejércitos muertos de hambre."
  fr: "al-Sind, la côte indienne; le verdict d'Hakim ibn Jabala sur Uthman: eau rare, fruits sans valeur, un voleur insignifiant; petites armées perdues, grandes armées affamées."
  ur: "السند، ہندوستان کی سمندری پٹی؛ حکیم ابن جبلہ کا عثمان کے بارے میں فیصلہ - کم پانی، بیکار پھل، ایک معمولی چور؛ چھوٹی فوجیں ہار گئیں، بڑی فوجیں بھوک سے مر گئیں۔"
