summary:
  ar: "مدينة صغيرة في بلاد الزنج على البحر، وأهلها يعملون في استخراج الحديد، وتبعد عن ملندة مسيرة يومين {cite:nuzhat-al-mushtaq-2002 p. 59}."
  en: "A small town in the Zanj lands on the sea, whose people mine iron. Two days from Malanda {cite:nuzhat-al-mushtaq-2002 p. 59}."
  es: "Un pequeño pueblo en Zanj, a orillas del mar, cuyos habitantes extraen hierro. A dos días de Malanda {cite:nuzhat-al-mushtaq-2002 p. 59}."
  fr: "Une petite ville du Zanj, située au bord de la mer, dont les habitants exploitent des mines de fer. À deux jours de Malanda {cite:nuzhat-al-mushtaq-2002 p. 59}."
  ur: "زنج میں ایک چھوٹا سا قصبہ سمندر پر اترتا ہے جس کے لوگ لوہے کی کان کرتے ہیں۔ مالندہ سے دو دن {حوالہ: نزہت المشتاق-2002 ص۔ 59}۔"
  tr: "Zanj topraklarında deniz kenarında küçük bir kasaba, sakinleri demir çıkarımıyla uğraşmaktadır ve Malenda'dan iki günlük bir yolculuktur {cite:Nuzhat-al-Mushtaq-2002, s. 59}."
  id: "Sebuah kota kecil di tanah Zanj di tepi laut, penduduknya bekerja dalam penambangan besi, dan perjalanan dari Malenda memakan waktu dua hari {cite:Nuzhat-al-Mushtaq-2002, hlm. 59}."
