summary:
  ar: "من أرفع القلاع حصنا وأشرف المدن، وبه أسواق جميلة الترتيب، ومياه جارية بمياه غزيرة، وعليها أرحاء كثيرة، وعمل واسع. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  en: "Among the highest fortresses and noblest towns, with well-arranged markets, running water and many mills, and a wide district. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  es: "Entre las fortalezas más altas y las ciudades más nobles, con mercados bien organizados, agua corriente y numerosos molinos, y un distrito extenso. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  fr: "Parmi les forteresses les plus élevées et les villes les plus nobles, avec des marchés bien organisés, l'eau courante et de nombreux moulins, et un vaste territoire. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  ur: "سب سے اونچے قلعوں اور عظیم ترین قصبوں میں سے، اچھی طرح سے منظم بازار، بہتا ہوا پانی اور بہت سی ملیں، اور ایک وسیع ضلع۔ {حوالہ: نزہت المشتاق-2002 ص۔ 598}"
