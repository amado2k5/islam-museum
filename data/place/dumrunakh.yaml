summary:
  ar: "مدينة صغيرة على أصل جبل، لها قلعة حصينة، وتبعد عن لالان نحو أربع مراحل شرقاً، ويذكر الإدريسي أن أهلها يعبدون صنماً على رأس جبل عال. {cite:nuzhat-al-mushtaq-2002 p. 712}"
  en: "A small town at the foot of a mountain with a strong fort, about four stages east of Lalan; its people, al-Idrisi says, worship an idol on a high mountain top. {cite:nuzhat-al-mushtaq-2002 p. 712}"
  es: "Un pequeño pueblo al pie de una montaña con una sólida fortaleza, a unas cuatro etapas al este de Lalan; según al-Idrisi, sus habitantes veneran un ídolo en la cima de una alta montaña. {cite:nuzhat-al-mushtaq-2002 p. 712}"
  fr: "Une petite ville au pied d'une montagne fortifiée, à environ quatre étapes à l'est de Lalan; ses habitants, selon al-Idrisi, vénèrent une idole au sommet d'une haute montagne. {cite:nuzhat-al-mushtaq-2002 p. 712}"
  ur: "ایک پہاڑ کے دامن میں ایک چھوٹا سا قصبہ جس میں ایک مضبوط قلعہ ہے، لالن کے مشرق میں تقریباً چار مراحل؛ اس کے لوگ، الادریسی کہتے ہیں، ایک اونچے پہاڑ کی چوٹی پر ایک بت کی پوجا کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 712}"
