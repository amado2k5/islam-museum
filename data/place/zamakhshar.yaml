summary:
  ar: "زمخشر: مدينة صغيرة في خوارزم بين نزوار وجرجانية (كركانج)، عاصمة خوارزم لاحقاً؛ وصفها المقدسي في القرن الرابع الهجري بأن لها حصناً وسجناً وجامعاً وسوراً بأبواب من حديد وخندقاً تُرفع عليه الجسور ليلاً، واشتهرت بأنها مسقط رأس المفسّر والنحوي أبي القاسم محمود بن عمر الزمخشري سنة ٤٦٧هـ/١٠٧٥م {cite:encyclopaedia-of-islam-2 vol. 11 p. 449}."
  en: "Zamakhshar: a small town of mediaeval Khwarazm lying between Nuzwar and Gurgandj (Jurjaniyya), the later capital of the province. Al-Muqaddasi records that in the later fourth/tenth century it had a citadel, a prison, a congregational mosque, walls with iron gates and a protective ditch with drawbridges raised at night. Its fame came from being the birthplace in 467/1075 of the Qur'an commentator and grammarian Abu al-Qasim Mahmud al-Zamakhshari {cite:encyclopaedia-of-islam-2 vol. 11 p. 449}."
  ur: "زمخشر: قرون وسطی کے خوارزم کا ایک چھوٹا شہر، جو نزوار اور جرجانیہ (گرگانج) کے درمیان واقع تھا، جو بعد میں صوبے کا دارالحکومت بنا۔ مقصدی کے مطابق چوتھی صدی ہجری کے آخر میں یہاں قلعہ، قیدخانہ، جامع مسجد، لوہے کے دروازوں والی دیوار اور ایک خندق تھی جس پر رات کو پل اٹھا لیے جاتے تھے۔ اس کی شہرت اس بات سے ہے کہ 467ھ/1075ء میں یہیں مفسر اور ماہر نحو ابوالقاسم محمود زمخشری پیدا ہوئے {cite:encyclopaedia-of-islam-2 vol. 11 p. 449}۔"
