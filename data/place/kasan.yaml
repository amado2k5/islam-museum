  tr: "Kasan, Fergana'da bir kasabadır ve halk Kaşnan der; Salih ibn Müslim el-Bahili tarafından fethedilmiş ve ardından halkı ayaklanarak el-Mensur halifeliği sırasında burayı son fetheden ülke olmuştur."
  id: "Kasan adalah sebuah kota di Ferghana, dan masyarakat umum menyebut Kashnan; kota ini ditaklukkan oleh Saleh ibn Muslim al-Bahili dan kemudian penduduknya bangkit, menjadi yang terakhir menaklukkannya selama masa kekhalifahan al-Mansur."
