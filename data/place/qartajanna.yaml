summary:
  ar: "مدينة خربة يسكنها رؤساء من العرب، بقي من سورها التراب، وكانت من غرائب البناء، فيها طياطر قسي قائمة في الهواء، وكذلك دواميس تحت الأرض يجري إليها الماء من عين قرب القيروان. {cite:nuzhat-al-mushtaq-2002 p. 286} فتحها حسان بن النعمان عنوة، ثم هدم المسلمون ما أمكنهم من أسوارها حتى لا يتحصن بها أحد بعد ذلك، ثم أعادوا فتحها بعد قتل الكاهنة. {cite:salabi-umayyad-state-2020 p.58-60}"
  en: "A ruined city, now inhabited by Arab chiefs, with an earthen wall remaining. Al-Idrisi describes its wonders: standing arcades in the air, and underground cisterns fed by water from a spring near Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 286}"
  es: "Una ciudad en ruinas, ahora habitada por jefes árabes, con una muralla de tierra aún en pie. Al-Idrisi describe sus maravillas: arcadas que se alzan en el aire y cisternas subterráneas alimentadas por agua de un manantial cerca de Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 286}"
  fr: "Une ville en ruines, désormais habitée par des chefs arabes, dont il subsiste une muraille de terre. Al-Idrisi décrit ses merveilles: des arcades dressées dans les airs et des citernes souterraines alimentées par une source près de Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 286}"
  ur: "ایک تباہ شدہ شہر، جس میں اب عرب سردار آباد ہیں، ایک مٹی کی دیوار باقی ہے۔ الادریسی اس کے عجائبات کو بیان کرتے ہیں: ہوا میں کھڑے آرکیڈز، اور زیر زمین حوض جو قیروان کے قریب ایک چشمے سے پانی سے بھرے ہوئے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 286}"
