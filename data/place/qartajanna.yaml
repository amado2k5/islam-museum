  ar: "مدينة خربة يسكنها رؤساء من العرب، بقي من سورها التراب، وكانت من غرائب البناء، فيها طياطر قسي قائمة في الهواء، وكذلك دواميس تحت الأرض يجري إليها الماء من عين قرب القيروان. {cite:nuzhat-al-mushtaq-2002 p. 286}"
  en: "A ruined city, now inhabited by Arab chiefs, with an earthen wall remaining. Al-Idrisi describes its wonders: standing arcades in the air, and underground cisterns fed by water from a spring near Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 286}"
