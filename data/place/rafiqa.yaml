summary:
  ar: "الرافقة مدينة العباس بجانب الرقة؛ لم يكن لها أثر قديم إنما بناها المنصور سنة 155 على بناء مدينته ببغداد ورتّب فيها جنداً من أهل خراسان وجرت على يدي المهدي وهو ولي عهد ثم بنى الرشيد قصورها ونقل إليها أسواق الرقة."
  en: "al-Rafiqa, the Abbasid companion-city beside al-Raqqa; it had no ancient trace — al-Mansur built it in year 155 on the model of his city at Baghdad, stationing a Khurasani army in it, works continuing under al-Mahdi as heir apparent, al-Rashid building its palaces and al-Raqqa's markets being moved into the space between."
  es: "Al-Rafiqa, la ciudad hermana abasí junto a Al-Raqqa; no tenía rastro antiguo: Al-Mansur la construyó en el año 155 siguiendo el modelo de su ciudad en Bagdad, estacionando en ella un ejército de Jorasán. Las obras continuaron bajo el mandato de Al-Mahdi como heredero aparente, Al-Rashid construyó sus palacios y los mercados de Al-Raqqa se trasladaron al espacio intermedio."
