  en: "al-Rafiqa, the Abbasid companion-city beside al-Raqqa; it had no ancient trace — al-Mansur built it in year 155 on the model of his city at Baghdad, stationing a Khurasani army in it, works continuing under al-Mahdi as heir apparent, al-Rashid building its palaces and al-Raqqa's markets being moved into the space between."
