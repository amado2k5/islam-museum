summary:
  ar: "جزيرة كبيرة جدا في البحر الكبير المظلم، يدخل إليها من جون صنقلة، فيها بلاد وحصون وقرى ومزارع وأودية وأنهار وجبال، وفيها أرض غير مسكونة {cite:nuzhat-al-mushtaq-2002 p. 880}."
  en: "A very large island in the Great Dark Sea, entered through the bay of Ṣanqala, with lands, fortresses, villages, farms, valleys, rivers and mountains, and with uninhabited ground {cite:nuzhat-al-mushtaq-2002 p. 880}."
  es: "Una isla muy grande en el Gran Mar Oscuro, a la que se accede a través de la bahía de Ṣanqala, con tierras, fortalezas, aldeas, granjas, valles, ríos y montañas, y con terreno deshabitado {cite:nuzhat-al-mushtaq-2002 p. 880}."
  fr: "Une très grande île dans la Grande Mer Sombre, accessible par la baie de Ṣanqala, avec des terres, des forteresses, des villages, des fermes, des vallées, des rivières et des montagnes, et des terres inhabitées {cite:nuzhat-al-mushtaq-2002 p. 880}."
  ur: "عظیم تاریک سمندر میں ایک بہت بڑا جزیرہ، خلیج صنقل سے ہوتا ہوا داخل ہوا، جس میں زمینیں، قلعے، دیہات، کھیتوں، وادیاں، دریا اور پہاڑ، اور غیر آباد زمین کے ساتھ۔ 880}۔"
