summary:
  ar: "موضع على الساحل الجنوبي لليمن غرب عدن، في أرض بني صبيحة، وكان مقر بني مشمّر، وهو اليوم اسم يبقى في موضع رأس العارة، أقصى جنوب الجزيرة العربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 548}."
  en: "A place on the south shore of Yemen, west of Aden, in Subayhi territory, once the headquarters of the Banu Mushammir and a caravan junction; today the name survives in Ras al-'Ara, the southernmost point of Arabia {cite:encyclopaedia-of-islam-2 vol. 1 p. 548}."
