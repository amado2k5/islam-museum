summary:
  ar: "ميناء مصري على ساحل المتوسط عند الطرف الشمالي لقناة السويس وعلى ضفتها الغربية، أُسس سنة 1859م في عهد الوالي سعيد باشا وسُمّي باسمه. اختار موقعه فريق مهندسين بقيادة لاروش ودي لسبس، وكانت أرضه ماء إلا شريطاً رملياً بين بحيرة المنزلة والبحر. صار بعد حفر القناة ثاني موانئ مصر بعد الإسكندرية ومركز محافظة تحمل اسمه، وبلغ عدد سكان المدينة نحو 374 ألفاً في تقدير 1986م {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  en: "An Egyptian seaport on the Mediterranean coast at the northern end of the Suez Canal, on its western bank, founded in 1859 in the reign of the viceroy Sa'id Pasha and named after him. Its site was chosen by a party of engineers under Laroche and de Lesseps and was under water except for a sand strip between Lake Manzala and the sea. After the canal was dug it became the second seaport of Egypt after Alexandria and the chief town of a governorate of the same name; the town had about 374,000 inhabitants in a 1986 estimate {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}."
  ur: "مصر کی بحیرۂ روم کے ساحل پر نہرِ سویز کے شمالی سرے اور اس کے مغربی کنارے پر واقع بندرگاہ، جو 1859ء میں والی سعید پاشا کے دور میں قائم ہوئی اور انہی کے نام پر ہے۔ اس کی جگہ لاروش اور دی لیسپس کی قیادت میں انجینئروں کی ایک ٹولی نے چنی، اور وہ علاقہ منزلہ جھیل اور سمندر کے درمیان ریت کی ایک پٹی کے سوا زیر آب تھا۔ نہر کھلنے کے بعد یہ اسکندریہ کے بعد مصر کی دوسری بندرگاہ اور اسی نام کی گورنری کا صدر مقام بنی؛ 1986ء کے اندازے میں شہر کی آبادی تقریباً 374 ہزار تھی {cite:encyclopaedia-of-islam-2 vol. 8 p. 353} {cite:encyclopaedia-of-islam-2 vol. 8 p. 354}۔"
