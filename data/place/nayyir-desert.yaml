label: { ar: "صحراء نيسر", en: "The Nayyir desert", es: "El desierto de Nayyir", fr: "Le désert de Nayyir", ur: "صحرائے نیئر", tr: "Nisar Çölü", id: "Gurun Nisar" }
summary:
  ar: "صحراء قليلة الأنيس، يسلكها التجار إلى أودغست وغانة في زمن الخريف، ويقل فيها الماء وله مجابات معلومة، ومنها موضع لا ماء فيه نحو أربعة عشر يوما، وذكر المؤلف أن قوافل السير فيها تكون ليلا ثم تستريح وقت الظهيرة {cite:nuzhat-al-mushtaq-2002 p. 107}، {cite:nuzhat-al-mushtaq-2002 p. 108}."
  en: "A thinly inhabited desert that merchants cross on the way to Awdaghast and Ghana, mostly in the autumn season. Water is scarce and found at known stations; one stretch of about fourteen days has none. The author describes travel by night, with rest through the heat of midday {cite:nuzhat-al-mushtaq-2002 p. 107}, {cite:nuzhat-al-mushtaq-2002 p. 108}."
  es: "Un desierto escasamente poblado que los comerciantes atraviesan en su camino hacia Awdaghast y Ghana, principalmente en otoño. El agua escasea y se encuentra en estaciones conocidas; en un tramo de unos catorce días no hay agua. El autor describe el viaje de noche, con descansos durante el calor del mediodía {cite:nuzhat-al-mushtaq-2002 p. 107}, {cite:nuzhat-al-mushtaq-2002 p. 108}."
  fr: "Ce désert peu peuplé est traversé par les marchands se rendant à Awdaghast et au Ghana, principalement en automne. L'eau y est rare et se trouve uniquement dans des points de ravitaillement connus; pendant une quinzaine de jours, il n'y en a absolument pas. L'auteur décrit un voyage de nuit, ponctué de pauses durant la chaleur de midi {cite:nuzhat-al-mushtaq-2002 p. 107}, {cite:nuzhat-al-mushtaq-2002 p. 108}."
  ur: "ایک باریک آباد صحرا جسے تاجر اوداگست اور گھانا کے راستے سے گزرتے ہیں، زیادہ تر خزاں کے موسم میں۔ پانی کی کمی ہے اور معلوم سٹیشنوں پر پایا جاتا ہے۔ تقریباً چودہ دن کا ایک حصہ کوئی نہیں ہے۔ مصنف نے دوپہر کی گرمی میں آرام کے ساتھ رات کے سفر کو بیان کیا ہے۔ 107}، {حوالہ: نزہت المشتاق-2002 ص۔ 108}۔"
  tr: "Seyrek dost canlısı bir çöl, sonbaharda tüccarların Oudgast ve Gana'ya seyahat ettiği bir yer. Su kıttır ve bilinen rezervuarları vardır. Bunlar arasında yaklaşık on dört gün boyunca susuz bir yer vardır. Yazar, oraya giden kervanların gece vakti olduğunu ve öğlen vakti dinlendiğini belirtmiştir {cite:Nuzhat-al-Mushtaq-2002 s. 107}, {cite:Nuzhat-al-Mushtaq-2002, s. 108}."
  id: "Gurun yang jarang ramah, ditempuh oleh para pedagang ke Oudgast dan Ghana selama musim gugur. Air langka dan diketahui memiliki waduk. Di antaranya adalah tempat tanpa air selama sekitar empat belas hari. Penulis menyebutkan bahwa karavan yang bepergian ke sana dilakukan pada malam hari dan beristirahat pada siang hari {cite:Nuzhat-al-Mushtaq-2002 hlm. 107}, {cite:Nuzhat-al-Mushtaq-2002, hlm. 108}."
