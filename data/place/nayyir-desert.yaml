label: { ar: "صحراء نيسر", en: "The Nayyir desert" }
summary:
  ar: "صحراء قليلة الأنيس، يسلكها التجار إلى أودغست وغانة في زمن الخريف، ويقل فيها الماء وله مجابات معلومة، ومنها موضع لا ماء فيه نحو أربعة عشر يوما، وذكر المؤلف أن قوافل السير فيها تكون ليلا ثم تستريح وقت الظهيرة {cite:nuzhat-al-mushtaq-2002 p. 107}، {cite:nuzhat-al-mushtaq-2002 p. 108}."
  en: "A thinly inhabited desert that merchants cross on the way to Awdaghast and Ghana, mostly in the autumn season. Water is scarce and found at known stations; one stretch of about fourteen days has none. The author describes travel by night, with rest through the heat of midday {cite:nuzhat-al-mushtaq-2002 p. 107}, {cite:nuzhat-al-mushtaq-2002 p. 108}."
