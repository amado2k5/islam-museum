summary:
  ar: "بلدة صغيرة في جنوب شرق الأناضول، كانت تُسمى حصن منصور، نسبة إلى الأمير الأموي منصور بن ذي العوانة الذي قُتل سنة 141 للهجرة؛ حصّنها هارون الرشيد، وصارت في القرن السادس للهجرة من أملاك الأرتقيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 218}."
  en: "A small town in south-east Anatolia, formerly called Hisn Mansur after the Umayyad amir Mansur b. Dhi'awana, who was killed in 141/758 on al-Mansur's orders. Harun al-Rashid fortified it and gave it a garrison; in the 6th/12th century it belonged to the Artukids {cite:encyclopaedia-of-islam-2 vol. 1 p. 218}."
