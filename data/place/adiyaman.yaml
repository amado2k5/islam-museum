summary:
  ar: "بلدة صغيرة في جنوب شرق الأناضول، كانت تُسمى حصن منصور، نسبة إلى الأمير الأموي منصور بن ذي العوانة الذي قُتل سنة 141 للهجرة؛ حصّنها هارون الرشيد، وصارت في القرن السادس للهجرة من أملاك الأرتقيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 218}."
  en: "A small town in south-east Anatolia, formerly called Hisn Mansur after the Umayyad amir Mansur b. Dhi'awana, who was killed in 141/758 on al-Mansur's orders. Harun al-Rashid fortified it and gave it a garrison; in the 6th/12th century it belonged to the Artukids {cite:encyclopaedia-of-islam-2 vol. 1 p. 218}."
  es: "Una pequeña ciudad en el sureste de Anatolia, antiguamente llamada Hisn Mansur en honor al emir omeya Mansur b. Dhi'awana, quien fue asesinado en 141/758 por orden de al-Mansur. Harun al-Rashid la fortificó y le proporcionó una guarnición; en el siglo VI/XII perteneció a los Artúquidas {cite:encyclopaedia-of-islam-2 vol. 1 p. 218}."
  fr: "Hisn Mansur, petite ville du sud-est de l'Anatolie, portait autrefois le nom de l'émir omeyyade Mansur ben Dhi'awana, assassiné en 141/758 sur ordre d'al-Mansur. Harun al-Rashid la fortifia et y installa une garnison; au VIe/XIIe siècle, elle appartint aux Artukides (voir: Encyclopaedia of Islam, vol. 1, p. 218)."
  ur: "جنوب مشرقی اناطولیہ کا ایک چھوٹا سا قصبہ، جسے پہلے اموی امیر منصور بن کے بعد ہسن منصور کہا جاتا تھا۔ ذی عوانہ، جو المنصور کے حکم پر 141/758 میں مارا گیا۔ ہارون الرشید نے اسے مضبوط کیا اور اسے ایک چوکی دی۔ 6ویں/12ویں صدی میں اس کا تعلق آرٹوکیڈز سے تھا۔ 1 ص۔ 218}۔"
  tr: "Güneydoğu Anadolu'da küçük bir kasaba, eskiden Mansur Kalesi olarak biliniyordu, 141 Hicri'de öldürülen Emevi prensi Mansur ibn Dhi al-Awanah'ın adını taşır; Harun el-Rashid tarafından tahkim edilmiş ve altıncı yüzyıl Ehli'de Ertuqi topraklarının bir parçası olmuştur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 218}."
  id: "Sebuah kota kecil di tenggara Anatolia, yang sebelumnya dikenal sebagai Benteng Mansur, dinamai menurut pangeran Umayyah Mansur ibn Dhi al-Awanah, yang tewas pada tahun 141 H; kota ini diperkuat oleh Harun al-Rashid dan menjadi bagian dari wilayah Ertuqid pada abad keenam H {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 218}."
