summary:
  ar: "مدينة في إقليم أرنيط بالأندلس، يذكرها الإدريسي مع وشقة وتطيلة، وتقع في الشمال الشرقي من أقاليم الأندلس. {cite:nuzhat-al-mushtaq-2002 p. 538}"
  en: "A city of the Arnit district of al-Andalus, named by al-Idrisi with Wasqa and Tutaila, in the north-east of al-Andalus. {cite:nuzhat-al-mushtaq-2002 p. 538}"
  es: "Ciudad del distrito de Arnit de al-Andalus, nombrada por al-Idrisi con Wasqa y Tutaila, en el noreste de al-Andalus. {cita:nuzhat-al-mushtaq-2002 p. 538}"
  fr: "Ville du district d'Arnit d'al-Andalus, nommée par al-Idrisi avec Wasqa et Tutaila, au nord-est d'al-Andalus. {cite:nuzhat-al-mushtaq-2002 p. 538}"
  ur: "اندلس کے ارنیت ضلع کا ایک شہر، جس کا نام الادریسی نے واسقع اور توتیلہ کے ساتھ، الاندلس کے شمال مشرق میں رکھا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 538}"
  tr: "Endülüs'ün Arnet bölgesinde yer alan, Al-Idrisi tarafından Washqa ve Attila ile birlikte bahsedilen, Al-Andalus vilayetlerinin kuzeydoğusunda yer alan bir şehirdir. {cite:nuzhat-al-mushtaq-2002 s. 538}"
  id: "Sebuah kota di wilayah Arnet, Andalusia, yang disebutkan oleh Al-Idrisi bersama dengan Washqa dan Attila, terletak di timur laut provinsi Al-Andalus. {cite:nuzhat-al-mushtaq-2002 hlm. 538}"
