summary:
  ar: "جزيرة كبيرة في البحر الهندي، يحكمها ملك عظيم الثروة، ويذكر المؤلف أن فيها الجواهر والياقوت وأنواع الأحجار الثمينة، وتقصدها مراكب الصين، وأن أهلها يتعيشون من الزراعة والصيد، وفيها أديان مختلفة يجتمع علماؤها للنقاش بحضرة الملك {cite:nuzhat-al-mushtaq-2002 p. 74-75}. ويجلب منها عند ابن خرداذبه الياقوت الأواهي وأشباهه والماس والدر والبلور والسنبادج الذي يعالج به الجوهر {cite:masalik-mamalik-ibn-khurdadhbih p. 78}."
  en: "A large island in the Indian Ocean ruled by a very wealthy king. The author says it has gems, rubies and other precious stones, and that Chinese ships call there. Its people live by farming and fishing, and scholars of different faiths meet to debate before the king {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
  es: "Una gran isla en el océano Índico, gobernada por un rey muy rico. El autor afirma que posee gemas, rubíes y otras piedras preciosas, y que allí atracan barcos chinos. Sus habitantes viven de la agricultura y la pesca, y eruditos de diferentes credos se reúnen para debatir ante el rey {cite:nuzhat-al-mushtaq-2002, págs. 74-75}."
  fr: "Une grande île de l'océan Indien, gouvernée par un roi très riche. L'auteur affirme qu'elle recèle des gemmes, des rubis et d'autres pierres précieuses, et que des navires chinois y font escale. Ses habitants vivent de l'agriculture et de la pêche, et des érudits de différentes confessions se réunissent pour débattre devant le roi {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
