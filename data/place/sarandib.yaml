summary:
  ar: "جزيرة كبيرة في البحر الهندي، يحكمها ملك عظيم الثروة، ويذكر المؤلف أن فيها الجواهر والياقوت وأنواع الأحجار الثمينة، وتقصدها مراكب الصين، وأن أهلها يتعيشون من الزراعة والصيد، وفيها أديان مختلفة يجتمع علماؤها للنقاش بحضرة الملك {cite:nuzhat-al-mushtaq-2002 p. 74-75}. ويجلب منها عند ابن خرداذبه الياقوت الأواهي وأشباهه والماس والدر والبلور والسنبادج الذي يعالج به الجوهر {cite:masalik-mamalik-ibn-khurdadhbih p. 78}."
  en: "A large island in the Indian Ocean ruled by a very wealthy king. The author says it has gems, rubies and other precious stones, and that Chinese ships call there. Its people live by farming and fishing, and scholars of different faiths meet to debate before the king {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
  es: "Una gran isla en el océano Índico, gobernada por un rey muy rico. El autor afirma que posee gemas, rubíes y otras piedras preciosas, y que allí atracan barcos chinos. Sus habitantes viven de la agricultura y la pesca, y eruditos de diferentes credos se reúnen para debatir ante el rey {cite:nuzhat-al-mushtaq-2002, págs. 74-75}."
  fr: "Une grande île de l'océan Indien, gouvernée par un roi très riche. L'auteur affirme qu'elle recèle des gemmes, des rubis et d'autres pierres précieuses, et que des navires chinois y font escale. Ses habitants vivent de l'agriculture et de la pêche, et des érudits de différentes confessions se réunissent pour débattre devant le roi {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
  ur: "بحر ہند کے ایک بڑے جزیرے پر ایک بہت امیر بادشاہ کی حکومت تھی۔ مصنف کا کہنا ہے کہ اس میں جواہرات، یاقوت اور دیگر قیمتی پتھر ہیں اور یہ کہ چینی جہاز وہاں بلاتے ہیں۔ اس کے لوگ کھیتی باڑی اور ماہی گیری سے گزارہ کرتے ہیں اور مختلف عقائد کے علماء بادشاہ کے سامنے بحث کے لیے ملتے ہیں۔ 74-75}۔"
  tr: "Hint Okyanusu'nda çok zengin bir kral tarafından yönetilen büyük bir ada. Yazar, burada mücevherler, yakutlar ve çeşitli değerli taşlar bulunduğunu, Çin gemilerinin sıkça uğradığını ve halkının tarım ve balıkçılıkla geçimini sağladığını belirtir. Kralın huzurunda tartışmak üzere toplanan çeşitli dinleri vardır {cite:Nuzhat-al-Mushtaq-2002, s. 74-75}. İbn Hordadbeh, buradan değerli yakutları ve benzerlerini — elmaslar, inciler, kristaller ve synbadlar — getirir; bunlar özünü işlemek için kullanılır {cite:masalik-mamalik-ibn-khurdadhbih s. 78}."
  id: "Sebuah pulau besar di Samudra Hindia, diperintah oleh seorang raja yang sangat kaya. Penulis menyebutkan bahwa pulau ini berisi permata, rubi, dan berbagai batu mulia, yang sering dikunjungi oleh kapal-kapal Tiongkok, dan penduduknya hidup dari pertanian dan perikanan. Ada berbagai agama yang para cendekiannya berkumpul untuk berdiskusi di hadapan raja {cite:Nuzhat-al-Mushtaq-2002, hlm. 74-75}. Dari pulau ini, Ibn Khordadbeh membawa ruby berharga dan sejenisnya, berlian, mutiara, kristal, dan synbade, yang digunakan untuk mengolah esensi {cite:masalik-mamalik-ibn-khurdadhbih hlm. 78}."
