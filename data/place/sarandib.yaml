summary:
  ar: "جزيرة كبيرة في البحر الهندي، يحكمها ملك عظيم الثروة، ويذكر المؤلف أن فيها الجواهر والياقوت وأنواع الأحجار الثمينة، وتقصدها مراكب الصين، وأن أهلها يتعيشون من الزراعة والصيد، وفيها أديان مختلفة يجتمع علماؤها للنقاش بحضرة الملك {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
  en: "A large island in the Indian Ocean ruled by a very wealthy king. The author says it has gems, rubies and other precious stones, and that Chinese ships call there. Its people live by farming and fishing, and scholars of different faiths meet to debate before the king {cite:nuzhat-al-mushtaq-2002 p. 74-75}."
