  ur: "نہر النعمان ابن المنذر ال قندال میں دجلہ کا ایک کھور جسے سلیمان ابن علی نے باندھا تھا - لخمید بادشاہ کی کسری دور کی گرانٹ، اس کا ایک محل وہاں ہے۔"
  tr: "Qandal'daki el-Hirah'ın sahibi olan Al-Nu'man ibn al-Mundhir Nehri, Dicle vadilerinde Süleyman bin Ali'nin baraj yaptığı bir deredir; el-Nu'man Khosrow döneminde bu derseyi kesmiş ve el-Nu'man için bir saray yapılmıştır."
  id: "Sungai Al-Nu'man ibn al-Mundhir, pemilik al-Hirah di Qandal, adalah sebuah aliran sungai di lembah-lembah Tigris yang dibendung oleh Sulayman ibn Ali; al-Nu'man memotongnya pada masa Khosrow, dan di sana terdapat sebuah istana untuk al-Nu'man."
