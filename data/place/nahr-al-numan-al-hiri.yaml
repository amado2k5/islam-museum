  ar: "نهر النعمان بن المنذر صاحب الحيرة بالقندل خور من أخوار دجلة سده سليمان بن علي؛ أقطع النعمان إياه أيام كسرى وكان هناك قصر للنعمان."
  en: "Nahr al-Nu'man ibn al-Mundhir at al-Qandal, a Tigris khawr dammed by Sulayman ibn Ali — the Lakhmid king's own Kisra-era grant, with a palace of his there."
  es: "Nahr al-Nu'man ibn al-Mundhir en al-Qandal, un khawr de Tigris represado por Sulayman ibn Ali, la concesión de la era Kisra del propio rey Lakhmid, con un palacio suyo allí."
