summary:
  ar: "مدينة في مالي على أطراف الصحراء، كانت مركزًا للعلم الإسلامي في العصور الوسطى، وفيها جامع سانكوري وجامع جينغاريبر. ويصف ابن بطوطة تنبكتو بأنها على نحو أربعة أميال من نهر النيجر وأغلب سكانها مسوفة أهل اللثام وحاكمها يسمى فربا موسى، ويذكر فيها قبر الشاعر أبي إسحاق الساحلي الغرناطي، ثم ركب النيل إلى كوكو التي وصفها بأنها من أحسن مدن السودان وأكبرها وأخصبها {cite:rihla-ibn-battuta-1958 p. 206-207}"
  en: A city in Mali on the edge of the desert; it was a centre of Islamic learning in the Middle Ages and holds the Sankore and Djinguereber mosques. Ibn Battuta describes Timbuktu as lying about four miles from the Niger, most of whose people are veiled Masufa and whose governor is called Farba Musa; he notes the tomb there of the poet Abu Ishaq al-Sahili of Granada, then travelled down the Niger to Kukah, which he counted among the finest, largest and most fertile of the Sudanese cities {cite:rihla-ibn-battuta-1958 p. 206-207}"
