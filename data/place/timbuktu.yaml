label: { ar: "تمبكتو", en: "Timbuktu", es: "Tombuctú", fr: "Tombouctou", ur: "ٹمبکٹو" }
summary:
  ar: "مدينة في مالي على أطراف الصحراء، كانت مركزًا للعلم الإسلامي في العصور الوسطى، وفيها جامع سانكوري وجامع جينغاريبر. ويصف ابن بطوطة تنبكتو بأنها على نحو أربعة أميال من نهر النيجر وأغلب سكانها مسوفة أهل اللثام وحاكمها يسمى فربا موسى، ويذكر فيها قبر الشاعر أبي إسحاق الساحلي الغرناطي، ثم ركب النيل إلى كوكو التي وصفها بأنها من أحسن مدن السودان وأكبرها وأخصبها {cite:rihla-ibn-battuta-1958 p. 206-207}"
  en: A city in Mali on the edge of the desert; it was a centre of Islamic learning in the Middle Ages and holds the Sankore and Djinguereber mosques. Ibn Battuta describes Timbuktu as lying about four miles from the Niger, most of whose people are veiled Masufa and whose governor is called Farba Musa; he notes the tomb there of the poet Abu Ishaq al-Sahili of Granada, then travelled down the Niger to Kukah, which he counted among the finest, largest and most fertile of the Sudanese cities {cite:rihla-ibn-battuta-1958 p. 206-207}"
  es: "Una ciudad de Malí al borde del desierto; fue un centro de aprendizaje islámico en la Edad Media y alberga las mezquitas de Sankore y Djinguereber. Ibn Battuta describe Tombuctú como situada a unos seis kilómetros del Níger, cuya mayoría de habitantes son masufas veladas y cuyo gobernador se llama Farba Musa; menciona la tumba del poeta Abu Ishaq al-Sahili de Granada, y luego viajó río abajo por el Níger hasta Kukah, a la que consideraba una de las ciudades sudanesas más bellas, grandes y fértiles {cite:rihla-ibn-battuta-1958 p. 206-207}."
  fr: "Tombouctou, ville du Mali en bordure du désert, fut un centre d'études islamiques au Moyen Âge et abrite les mosquées de Sankoré et de Djinguereber. Ibn Battuta décrit Tombouctou comme se situant à environ six kilomètres du Niger, dont la plupart des habitants portent le voile (Masufa) et dont le gouverneur se nomme Farba Moussa. Il mentionne le tombeau du poète Abou Ishaq al-Sahili de Grenade, puis descendit le Niger jusqu'à Kouka, qu'il considérait comme l'une des plus belles, des plus grandes et des plus fertiles villes du Soudan."
  ur: "مالی میں صحرا کے کنارے پر ایک شہر؛ یہ قرون وسطیٰ میں اسلامی تعلیم کا مرکز تھا اور اس میں سنکور اور جینگویربر مساجد موجود تھیں۔ ابن بطوطہ نے ٹمبکٹو کو نائیجر سے تقریباً چار میل کے فاصلے پر واقع قرار دیا ہے، جس کے زیادہ تر لوگ پردہ دار مصوفہ ہیں اور جس کا گورنر فربہ موسیٰ کہلاتا ہے۔ اس نے وہاں غرناطہ کے شاعر ابو اسحاق السہلی کی قبر کو نوٹ کیا، پھر نائیجر سے کوکاہ تک کا سفر کیا، جسے اس نے سوڈانی شہروں کے بہترین، سب سے بڑے اور زرخیز شہروں میں شمار کیا۔ 206-207}\""
