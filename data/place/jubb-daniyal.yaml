label: { ar: "جُبّ دانيال ببابل", en: "Daniel's Pit at Babylon", es: "El pozo de Daniel en Babilonia", fr: "La fosse de Daniel à Babylone", ur: "بابل میں ڈینیئل کا گڑھا", tr: "Jacob Daniel Babil'de", id: "Yakub Daniel di Babilonia" }
summary:
  ar: "الجُبّ الذي ألقى فيه بختنصّر دانيال وأُتي معه بأسدين؛ وفي الحكاية أن نبياً من أنبياء بني إسرائيل أتاه بأمر الله فاستخرجه، وكان الأسدان يمشيان عن يمينه وشماله حتى أمرهما بالرجوع {cite:umari-masalik-1924 p. 232}."
  en: "The pit at Babylon into which Nebuchadnezzar cast Daniel with two lions; in the tale a prophet of Israel came by God's command to draw him out, the lions pacing at his right and left until he sent them back {cite:umari-masalik-1924 p. 232}."
  es: "El pozo de Babilonia en el que Nabucodonosor arrojó a Daniel con dos leones; en el relato, un profeta de Israel vino por mandato de Dios para sacarlo, mientras los leones caminaban a su derecha e izquierda hasta que los envió de vuelta {cite:umari-masalik-1924 p. 232}."
  fr: "La fosse de Babylone dans laquelle Nabuchodonosor jeta Daniel avec deux lions; dans le récit, un prophète d'Israël vint sur l'ordre de Dieu pour le tirer, les lions tournant à sa droite et à sa gauche jusqu'à ce qu'il les renvoie {cite:umari-masalik-1924 p. 232}."
  ur: "بابل کا وہ گڑھا جس میں نبوکدنضر نے دانیال کو دو شیروں کے ساتھ ڈالا۔ کہانی میں اسرائیل کا ایک نبی خدا کے حکم سے اسے نکالنے کے لیے آیا، شیر اس کے دائیں بائیں چلتے رہے یہاں تک کہ اس نے انہیں واپس بھیج دیا۔ 232}۔"
  tr: "Bahtanes'in Daniel'i attığı ve yanında iki aslan getirdiği kuyu; hikayede, İsrailoğullarının peygamberlerinden bir peygamber Tanrı'nın emriyle ona geldi ve Tanrı onu çıkardı, iki aslan sağında ve solunda yürüdü, ta ki o onları geri dönmeye emretene kadar {cite:Umari-Masalik-1924, s. 232}."
  id: "Sumur tempat Bakhtaneser melemparkan Daniel dan membawa dua singa bersamanya; dalam cerita itu, seorang nabi dari para nabi Anak-anak Israel datang kepadanya atas perintah Tuhan dan dia mengambilnya, dan kedua singa itu berjalan ke kanan dan kiri sampai dia memerintahkan mereka kembali {cite:umari-masalik-1924, hlm. 232}."
