summary:
  ar: من مشهور مدن الأندلس، على ساحل البحر، ولها القلعة المنيعة المعروفة بقلعة خيران بناها عبد الرحمن الناصر وعظمت في دولة
    المنصور بن أبي عامر وولى عليها مولاه خيران فنسبت إليه؛ وبها من صنعة الديباج ما تفوق به على سائر البلاد وفيها دار الصناعة
    وتشتمل كورتها على معدن الحديد والرخام ومن أبوابها باب العقاب عليه صورة عقاب من حجر قديم {cite:nafh-tib-maqqari p. 198}.
    وكان بالمرية لنسج طرز الحرير ثمانمائة نول وللحلل النفيسة والديباج الفاخر ألف نول وللإسقلاطون والجرجانية والأصفهانية مثل
    ذلك، ويصنع بها من صنوف آلات الحديد والنحاس والزجاج ما لا يوصف، وساحلها أفضل السواحل وبها قصور الملوك القديمة، ولم يكن
    في بلاد الأندلس أكثر مالاً من أهلها ولا أعظم متاجر وذخائر، وكان بها من الحمامات والفنادق نحو الألف {cite:nafh-tib-maqqari
    p. 199}. وسقطت عنوة يوم الجمعة 17 جمادى الأولى سنة 542 {cite:nafh-tib-maqqari p. 466}.
  en: Almeria — the harbour city of al-Andalus with its impregnable citadel of Khayran built by al-Nasir; its silk looms outwove
    every land (800 for tiraz, a thousand each for brocade, esclaton and the rest), its district mined iron and marble, its
    baths and fondacos neared a thousand, and no Andalusi city held greater wealth or warehouses — until it fell by storm
    on Friday 17 Jumada I 542 {cite:nafh-tib-maqqari p. 198-199,466}.
  es: "Almería, la ciudad portuaria de al-Ándalus con su inexpugnable ciudadela de Khayran construida por al-Nasir; sus telares de seda superaban a los de cualquier otro lugar (800 para tiraz, mil para brocado, esclatón y demás), su distrito extraía hierro y mármol, sus baños y fondacos se acercaban a los mil, y ninguna ciudad andalusí poseía mayor riqueza ni almacenes, hasta que cayó por asalto el viernes 17 de Jumada I de 542 {cite:nafh-tib-maqqari p. 198-199,466}."
  fr: "Almeria — la ville portuaire d'al-Andalus avec sa citadelle imprenable de Khayran construite par al-Nasir; ses métiers à tisser la soie surpassaient tous les autres pays (800 pour le tiraz, mille chacun pour le brocart, l'esclaton et le reste), son district exploitait le fer et le marbre, ses bains et fondacos approchaient le millier, et aucune ville andalouse ne possédait plus de richesses ni d'entrepôts — jusqu'à ce qu'elle tombe sous la tempête le vendredi 17 Jumada I 542 {cite:nafh-tib-maqqari p. 198-199,466}."
