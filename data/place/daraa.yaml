summary:
  ar: "أرض قرى متصلة لا يحوطها سور ولا حفير، يزرع أهلها الحناء وينقلونها إلى سائر الجهات، ومن درعة إلى بلاد السوس الأقصى أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  en: "A land of continuous villages with no walls or ditches, whose people grow henna and carry it to all regions; four stages from Draa to Sus al-Aqsa. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  es: "Una tierra de aldeas continuas sin murallas ni fosos, cuyos habitantes cultivan henna y la distribuyen por todas las regiones; cuatro etapas desde Draa hasta Sus al-Aqsa. {cite:nuzhat-al-mushtaq-2002 p. 227}"
  fr: "Une région de villages continus, sans murs ni fossés, où les habitants cultivent le henné et le transportent dans toutes les régions; quatre étapes de Draa à Sus al-Aqsa. {cite: Nuzhat-al-Mushtaq-2002 p. 227}"
  ur: "مسلسل دیہاتوں کی سرزمین جس میں کوئی دیوار یا گڑھا نہیں ہے، جس کے لوگ مہندی لگاتے ہیں اور اسے تمام علاقوں میں لے جاتے ہیں۔ درعا سے سوس الاقصیٰ تک چار مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 227}"
  tr: "Bağlı köylerin arazisi duvarlarla veya çukur kazma ile çevrili değildir; sakinleri kına yetiştirir ve her yöne, Draa'dan Sous'un uzak köşelerine kadar dört aşamada taşır. {kaynak:nuzhat-al-mushtaq-2002 s. 227}"
  id: "Tanah desa-desa yang terhubung tidak dikelilingi tembok atau lubang penggalian; penduduknya menanam henna dan membawanya ke segala arah, dan dari Draa hingga ujung Sous, empat tahap. {cite:Nuzhat-al-Mushtaq-2002 hlm. 227}"
