summary:
  ar: "موضع على طريق البحر إلى الطور، ويصفه الإدريسي بأنه صعب الطريق، وفيه قرية صغيرة يأوي إليها بعض عرب تلك النواحي. {cite:nuzhat-al-mushtaq-2002 p. 349}"
  en: "A place on the sea road to Mount Tur, described by al-Idrisi as hard to cross, with a small village where some Arabs of the district settle. {cite:nuzhat-al-mushtaq-2002 p. 349}"
  es: "Un lugar en la ruta marítima hacia el monte Tur, descrito por al-Idrisi como de difícil acceso, con una pequeña aldea donde se asientan algunos árabes de la región. {cite:nuzhat-al-mushtaq-2002 p. 349}"
  fr: "Un lieu situé sur la route maritime menant au mont Tur, décrit par al-Idrisi comme difficile à traverser, avec un petit village où s'installent quelques Arabes de la région. {cite:nuzhat-al-mushtaq-2002 p. 349}"
  ur: "کوہ طور پر سمندری راستے پر ایک جگہ، جسے الادریسی نے عبور کرنا مشکل بتایا ہے، ایک چھوٹا سا گاؤں ہے جہاں ضلع کے کچھ عرب آباد ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 349}"
  tr: "Al-Tur'a giden deniz yolu üzerinde yer alan bir yerdir ve Al-Idrisi tarafından ulaşılması zor olarak tanımlanır; ayrıca bazı Arapların sığındığı küçük bir köy vardır. {cite:nuzhat-al-mushtaq-2002 s. 349}"
  id: "Ini adalah tempat di jalur laut menuju Al-Tur, yang oleh Al-Idrisi digambarkan sulit dijangkau, dan terdapat sebuah desa kecil di mana beberapa orang Arab dari daerah tersebut berlindung. {cite:Nuzhat-al-Mushtaq-2002 hlm. 349}"
