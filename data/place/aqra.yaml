summary:
  ar: "مدينة على أحد نهرين يخرجان من أرض بؤامية، ويذكر المؤلف أنها تبعد عن بطش أربعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 884}."
  en: "A city on one of two rivers rising in the land of Bawāmiya; the author gives forty miles from Baṭash {cite:nuzhat-al-mushtaq-2002 p. 884}."
  es: "Una ciudad en uno de los dos ríos que nacen en la tierra de Bawāmiya; el autor indica cuarenta millas desde Baṭash {cite:nuzhat-al-mushtaq-2002 p. 884}."
  fr: "Une ville située sur l'une des deux rivières prenant leur source au pays de Bawāmiya; l'auteur indique quarante milles de Baṭash {cite:nuzhat-al-mushtaq-2002 p. 884}."
  ur: "بوامیہ کی سرزمین میں نکلنے والے دو دریاؤں میں سے ایک پر ایک شہر؛ مصنف بطش سے چالیس میل بتاتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 884}۔"
  tr: "Bawamiya topraklarından doğan iki nehirden biri üzerinde yer alan bir şehirdir ve yazar, Tasht'a kırk mil uzaklıkta olduğunu belirtmektedir {cite:Nuzhat-al-Mushtaq-2002, s. 884}."
  id: "Kota ini terletak di salah satu dari dua sungai yang berasal dari tanah Bawamiya, dan penulis menyebutkan bahwa kota ini berjarak empat puluh mil dari Tasht {cite:Nuzhat-al-Mushtaq-2002, hlm. 884}."
