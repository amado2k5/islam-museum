label: { ar: "نصيبين", en: "Nasibin (Nisibis)", es: "Nasibin (Nisibis)", fr: "Nasibin (Nisibis)", ur: "نصیبین ⁦(نصیب)⁩" }
summary:
  ar: "نصيبين من مدن الجزيرة؛ فتحها إياد بن غنم بعد قتال على مثل صلح الرها، وفتح بعدها طور عبدين وحصن ماردين ودارا وقردى وباذبدى على مثل صلحها؛ وشكا عاملها إلى معاوية أيام عثمان إصابة جماعة من المسلمين بالعقارب فأمره أن يوظف على أهل كل حيز من المدينة عدة من العقارب مسمّاة في كل ليلة فيأتونه بها فيأمر بقتلها."
  en: "Nasibin (Nisibis) of the Jazira cities; Iyad ibn Ghanm took it after fighting on the like of al-Ruha's treaty, and after it Tur Abdin and the fortress of Mardin with Dara, Qarda and Bazabda on the like of its terms; its administrator complained to Mu'awiya in Uthman's days that a company of Muslims had been stung by scorpions, and he ordered him to charge each quarter of the city with a named quota of scorpions every night to be brought and killed."
  es: "Nasibin (Nisibis) de las ciudades de Jazira; Iyad ibn Ghanm la tomó después de luchar según el tratado de al-Ruha, y después Tur Abdin y la fortaleza de Mardin con Dara, Qarda y Bazabda según sus términos; su administrador se quejó a Mu'awiya en tiempos de Uthman de que una compañía de musulmanes había sido picada por escorpiones, y le ordenó que asignara a cada barrio de la ciudad una cuota determinada de escorpiones cada noche para ser traídos y matados."
  fr: "Nasibin (Nisibis) des villes de Jazira; Iyad ibn Ghanm la prit après avoir combattu selon un traité similaire à celui d'al-Ruha, puis Tur Abdin et la forteresse de Mardin avec Dara, Qarda et Bazabda selon des termes similaires; son administrateur se plaignit à Mu'awiya du temps d'Uthman qu'un groupe de musulmans avait été piqué par des scorpions, et il lui ordonna de charger chaque nuit chaque quartier de la ville avec un quota nommé de scorpions à apporter et à tuer."
  ur: "جزیرہ شہروں کے نصیبین ⁦(نصیب)⁩؛ عیاض بن غنم نے رواحہ کے معاہدے کی طرح لڑنے کے بعد اسے اپنے قبضے میں لیا اور اس کے بعد تور عبدین اور ماردین کا قلعہ درہ، قردہ اور بزبدہ کے ساتھ اس کی شرائط پر۔ اس کے منتظم نے عثمان کے زمانے میں معاویہ سے شکایت کی کہ مسلمانوں کی ایک جماعت کو بچھو نے ڈنک مارا ہے، اور اس نے اسے حکم دیا کہ شہر کے ہر چوتھائی حصے میں ہر رات بچھووں کا ایک مخصوص کوٹہ لگا کر لایا جائے اور مار دیا جائے۔"
