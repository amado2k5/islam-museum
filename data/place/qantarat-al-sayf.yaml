summary:
  ar: "قنطرة عظيمة على نهر يانة، وعليها حصن منيع يحميها، وأهلها أهل شوكة، ويصفها الإدريسي بالمنعة. {cite:nuzhat-al-mushtaq-2002 p. 546}"
  en: "A great bridge over the Yana river, guarded by a strong fort, whose people are formidable; al-Idrisi praises its defences. {cite:nuzhat-al-mushtaq-2002 p. 546}"
  es: "Un gran puente sobre el río Yana, custodiado por una sólida fortaleza, cuyos habitantes son formidables; al-Idrisi elogia sus defensas. {cite:nuzhat-al-mushtaq-2002 p. 546}"
  fr: "Un grand pont enjambant la rivière Yana, gardé par une forteresse imposante, dont les habitants sont redoutables; al-Idrisi fait l’éloge de ses défenses. {cite:nuzhat-al-mushtaq-2002 p. 546}"
  ur: "یانا ندی پر ایک عظیم پل، ایک مضبوط قلعہ کی حفاظت، جس کے لوگ مضبوط ہیں؛ الادریسی اس کے دفاع کی تعریف کرتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 546}"
  tr: "Yana Nehri üzerinde güçlü bir kale ile büyük bir köprü var. Halkı Shawka'dan geliyor ve Al-Idrisi onu güçlü olarak tanımlıyor. {cite:nuzhat-al-mushtaq-2002 s. 546}"
  id: "Sebuah jembatan besar di Sungai Yana, dengan benteng kuat yang melindunginya. Penduduknya berasal dari Shawka, dan Al-Idrisi menggambarkannya sebagai kuat. {cite:nuzhat-al-mushtaq-2002 hlm. 546}"
