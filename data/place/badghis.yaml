summary:
  ar: "بادغيس إقليم بخراسان جبلي؛ دخل في صلح عظيم هراة مع ابن عامر مع بوشنج وكتب له ابن عامر كتاباً يأمره فيه بتقوى الله ومناصحة المسلمين وإصلاح أرضيه وتقسيم الجزية عدلاً فمن منع ما عليه فلا عهد له ولا ذمة."
  en: "Badghis, the hill-country of Khurasan; covered by Herat's great sulh with Ibn Amir and Bushanj under the writ charging him to divide the jizya justly — 'whoever withholds what is on him has no covenant nor dhimma'."
  es: "Badghis, la región montañosa de Jorasán; cubierta por el gran sulh de Herat con Ibn Amir y Bushanj bajo el edicto que le ordenaba dividir la jizya con justicia: \"quien retiene lo que le corresponde no tiene pacto ni dhimma\"."
  fr: "Badghis, la région montagneuse du Khorasan; couverte par le grand sulh d'Hérat avec Ibn Amir et Bushanj sous le writ lui enjoignant de diviser la jizya justement — « celui qui retient ce qui lui appartient n'a ni alliance ni dhimma »."
  ur: "بادغیس، خراسان کا پہاڑی ملک؛ ہرات کے عظیم سلح نے ابن عامر اور بوشنج کے ساتھ رٹ کے تحت اس پر جزیہ کو منصفانہ طور پر تقسیم کرنے کا الزام لگایا - 'جو شخص اپنے پر موجود چیزوں کو روکے اس کا نہ کوئی عہد ہے اور نہ ہی ذم'۔"
  tr: "Badghis, Horasan'da dağlık bir bölgedir; Bushang ile Herat ile İbn Emir arasında büyük bir barış antlaşması yaptı. İbn Amir ona Allah'tan korkmasını, Müslümanlara öğüt vermesini, topraklarını reforme etmesini ve cizyeyi adil dağıtmasını emreden bir mektup yazdı. Borçluluğu saklayan kişi ne bir antlaşma ne de sorumluluğu vardır."
  id: "Badghis adalah wilayah pegunungan di Khorasan; ia menandatangani perjanjian damai besar antara Herat dan Ibn Amir dengan Bushang. Ibn Amir menulis surat kepadanya yang memerintahkannya untuk takut kepada Tuhan, menasihati umat Muslim, mereformasi tanahnya, dan membagikan jizya secara adil. Siapa pun yang menahan hak tidak memiliki perjanjian atau tanggung jawab."
