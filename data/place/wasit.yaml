label:
  ar: واسط
  en: Wasit
summary:
  ar: مدينة حامية أحدثها الحجاج سنة 83 أو 84؛ عند البلاذري بنى مسجدها وقصرها وقبة الخضراء بها وكانت أرض قصب فسميت واسط القصب
    وبينها وبين الأهواز والبصرة والكوفة مقدار واحد وكتب الحجاج إلى عبد الملك إني اتخذت مدينة في كرش من الأرض بين الجبل والمصرين
    فلذلك سمي أهل واسط الكرشيين.
  en: A garrison city founded by al-Hajjaj in year 83 or 84; in al-Baladhuri he built its mosque, palace and Green Dome —
    it was reed-land, whence Wasit al-Qasab — equidistant from al-Ahwaz, Basra and Kufa; his letter to Abd al-Malik, 'I have
    founded a city in a karsh of land between the mountain and the two garrison towns,' is why the Wasitis were called al-Karshiyyin.
