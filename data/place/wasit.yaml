summary:
  ar: مدينة حامية أحدثها الحجاج سنة 83 أو 84؛ عند البلاذري بنى مسجدها وقصرها وقبة الخضراء بها وكانت أرض قصب فسميت واسط القصب
    وبينها وبين الأهواز والبصرة والكوفة مقدار واحد وكتب الحجاج إلى عبد الملك إني اتخذت مدينة في كرش من الأرض بين الجبل والمصرين
    فلذلك سمي أهل واسط الكرشيين.
  en: A garrison city founded by al-Hajjaj in year 83 or 84; in al-Baladhuri he built its mosque, palace and Green Dome —
    it was reed-land, whence Wasit al-Qasab — equidistant from al-Ahwaz, Basra and Kufa; his letter to Abd al-Malik, 'I have
    founded a city in a karsh of land between the mountain and the two garrison towns,' is why the Wasitis were called al-Karshiyyin.
  es: "Una ciudad guarnición fundada por al-Hajjaj en el año 83 o 84; en al-Baladhuri construyó su mezquita, palacio y la Cúpula Verde —era una zona de cañaverales, de donde proviene Wasit al-Qasab— equidistante de al-Ahwaz, Basora y Kufa; su carta a Abd al-Malik, «He fundado una ciudad en un karsh de tierra entre la montaña y las dos ciudades guarnición», es la razón por la que los Wasitis fueron llamados al-Karshiyyin."
  fr: "Une ville de garnison fondée par al-Hajjaj en l'an 83 ou 84; à al-Baladhuri, il fit construire sa mosquée, son palais et son Dôme Vert — c'était une zone de roseaux, d'où Wasit al-Qasab — à égale distance d'al-Ahwaz, de Bassora et de Kufa; sa lettre à Abd al-Malik, « J'ai fondé une ville dans un karsh de terre entre la montagne et les deux villes de garnison », explique pourquoi les Wasitis étaient appelés al-Karshiyyin."
  ur: "ایک گیریژن شہر جسے الحجاج نے 83 یا 84 میں قائم کیا تھا۔ البلادوری میں اس نے اس کی مسجد، محل اور سبز گنبد تعمیر کیا - یہ سرکنڈوں کی زمین تھی، جہاں سے وصیت القصاب - الاہواز، بصرہ اور کوفہ سے مساوی فاصلے پر تھا۔ عبد الملک کے نام اس کا خط، 'میں نے پہاڑ اور دو فوجی بستیوں کے درمیان ایک کرش زمین میں ایک شہر کی بنیاد رکھی ہے'، اسی لیے وصیتیوں کو الکرشیین کہا جاتا ہے۔"
  tr: "Burası 83 veya 84 yılında el-Haccac tarafından kurulmuş korunan bir şehirdi; el-Baladhuri'ye göre, üzerine cami, sarayın ve yeşil kubbesini inşa etti. Burası sazlık bir araziydi, bu yüzden Wasit al-Qasab olarak adlandırıldı ve Ahvaz, Basra ile Kufa arasında yaklaşık bir mesafe vardı. Al-Hacac, Abd al-Malik'e dağlar ile Mısırlılar arasında bir toprak kuşağında bir şehir aldığını yazdı, bu yüzden Wasit halkına el-Kerşin denildi."
  id: "Kota ini didirikan oleh al-Hajjaj pada tahun 83 atau 84; menurut al-Baladhuri, ia membangun masjid, istana, dan kubah hijau di atasnya. Itu adalah tanah alang-alang, sehingga disebut Wasit al-Qasab, dan di antara Ahvaz, Basra, dan Kufa ada satu bentang. Al-Hajjaj menulis kepada Abd al-Malik bahwa ia telah mengambil sebuah kota di sabuk tanah antara pegunungan dan Mesir, sehingga penduduk Wasit disebut al-Kershin."
