summary:
  ar: "مدينة قديمة لحمير بين بيحان وحضرموت، بها جبل الملح ويقاسم جبلها الثاني أهل مأرب؛ قال الهمداني: لما احتربت حمير ومذحج خرج أهل شبوة منها فسكنوا حضرموت وبهم سميت شبام، وكان الأصل «شباه» فأبدلت الميم من الهاء {cite:sifat-jazirat-al-arab p. 70}."
  en: "An old Himyarite city between Bayhan and Hadramawt with a salt mountain whose second ridge belonged to Ma'rib. Al-Hamdani reports: when Himyar and Madhhij warred, the people of Shabwa abandoned it for Hadramawt, and from them Shibam took its name — 'the original was Shabah, the mim replacing the ha' {cite:sifat-jazirat-al-arab p. 70}."
