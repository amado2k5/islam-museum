summary:
  ar: "مدينة قديمة لحمير بين بيحان وحضرموت، بها جبل الملح ويقاسم جبلها الثاني أهل مأرب؛ قال الهمداني: لما احتربت حمير ومذحج خرج أهل شبوة منها فسكنوا حضرموت وبهم سميت شبام، وكان الأصل «شباه» فأبدلت الميم من الهاء {cite:sifat-jazirat-al-arab p. 70}."
  en: "An old Himyarite city between Bayhan and Hadramawt with a salt mountain whose second ridge belonged to Ma'rib. Al-Hamdani reports: when Himyar and Madhhij warred, the people of Shabwa abandoned it for Hadramawt, and from them Shibam took its name — 'the original was Shabah, the mim replacing the ha' {cite:sifat-jazirat-al-arab p. 70}."
  es: "Una antigua ciudad himyarita entre Bayhan y Hadramawt con una montaña de sal cuya segunda cresta pertenecía a Ma'rib. Al-Hamdani relata: cuando Himyar y Madhhij guerrearon, la gente de Shabwa la abandonó para ir a Hadramawt, y de ellos Shibam tomó su nombre: «el original era Shabah, la mim reemplazando la ha» {cita:sifat-jazirat-al-arab p. 70}."
  fr: "Une ancienne cité himyarite située entre Bayhan et Hadramawt, avec une montagne de sel dont la seconde crête appartenait à Ma'rib. Al-Hamdani rapporte: lors de la guerre entre Himyar et Madhhij, les habitants de Shabwa l'abandonnèrent pour Hadramawt, et Shibam prit d'eux son nom — « l'original était Shabah, le mim remplaçant le ha » {cite: sifat-jazirat-al-arab p. 70}."
  ur: "بیہان اور حضرموت کے درمیان ایک پرانا حمیری شہر جس میں نمک کا پہاڑ ہے جس کی دوسری چوٹی مارب سے تعلق رکھتی ہے۔ الحمدانی بیان کرتے ہیں: جب ہمیار اور مدحج میں جنگ ہوئی تو شبوا کے لوگوں نے اسے حضرموت کے لیے چھوڑ دیا اور ان سے شبم نے اس کا نام لیا - اصل شبہ تھا، ح کی جگہ میم ہے۔ 70}۔"
  tr: "Bayhan ile Hadramawt arasında yer alan eski bir Himyar şehri olan bu şehir, Tuz Dağı'nı barındırır ve ikinci dağı Merib halkı tarafından paylaşılmaktadır. El-Hamdani şöyle demiştir: Himyar ve Madhij kavga ettiğinde, Şabva halkı oradan ayrılıp Hadramaut'a yerleşmiş ve onlara Şibam adı verilmiştir. Orijinal adı 'Şabah' olduğundan, 'm' yerine 'h' harfi kullanılmıştır {atıf:sifat-jazirat-al-Arab, s. 70}."
  id: "Kota kuno Himyar di antara Bayhan dan Hadramawt, berisi Gunung Garam dan gunung keduanya dibagi oleh masyarakat Marib. Al-Hamdani berkata: Ketika Himyar dan Madhhij berperang, orang-orang Shabwa meninggalkan sana dan menetap di Hadramaut, dan mereka dinamai Shibam. Nama aslinya adalah 'Shabah,' sehingga 'm' diganti dengan 'h' {cite:sifat-jazirat-al-Arab, hlm. 70}."
