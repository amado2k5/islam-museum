summary:
  ar: "بلدة لم تعد قائمة على الساحل الجزائري، بين وهران والحدود المغربية عند نهر تافنة، مقابل جزيرة راشغون، وقد حلّت محل بورتوس سيجنسيس، مرفأ سيغا عاصمة الملك سيفاكس؛ عرفت في القرن الرابع الهجري ⁦(العاشر الميلادي)⁩ عاصمة لأمير من البربر المكناسة، وتعرضت للتخريب مرارًا، وهُجرت في أواخر القرن العاشر الهجري ⁦(السادس عشر الميلادي)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 710}."
  en: "A town no longer in existence on the Algerian coast, between Oran and the Moroccan frontier at the Tafna, facing the island of Rachgoun. It replaced Portus Sigensis, the port of Siga, capital of King Syphax; it was rebuilt by a Miknasa Berber amir who was a vassal of the caliph al-Nasir of Cordova, was often laid waste, and was finally abandoned at the end of the tenth/sixteenth century {cite:encyclopaedia-of-islam-2 vol. 1 p. 710}."
  es: "Un pueblo que ya no existe en la costa argelina, entre Orán y la frontera marroquí en Tafna, frente a la isla de Rachgoun. Reemplazó a Portus Sigensis, el puerto de Siga, capital del rey Syphax; fue reconstruido por un emir bereber Miknasa que era vasallo del califa al-Nasir de Córdoba, fue devastado en varias ocasiones y finalmente fue abandonado a finales del siglo X/XVI {cite:encyclopaedia-of-islam-2 vol. 1 p. 710}."
  fr: "Ville aujourd'hui disparue, située sur la côte algérienne entre Oran et la frontière marocaine de la Tafna, face à l'île de Rachgoun. Elle remplaçait Portus Sigensis, le port de Siga, capitale du roi Syphax; reconstruite par un émir berbère Miknasa, vassal du calife al-Nasir de Cordoue, elle fut souvent ravagée, puis finalement abandonnée à la fin du Xᵉ/XVIᵉ siècle (source: Encyclopaedia of Islam, vol. 1, p. 710)."
