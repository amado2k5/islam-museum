  ar: "أرشگول"
  en: "Arshgul"
summary:
  ar: "بلدة لم تعد قائمة على الساحل الجزائري، بين وهران والحدود المغربية عند نهر تافنة، مقابل جزيرة راشغون، وقد حلّت محل بورتوس سيجنسيس، مرفأ سيغا عاصمة الملك سيفاكس؛ عرفت في القرن الرابع الهجري (العاشر الميلادي) عاصمة لأمير من البربر المكناسة، وتعرضت للتخريب مرارًا، وهُجرت في أواخر القرن العاشر الهجري (السادس عشر الميلادي) {cite:encyclopaedia-of-islam-2 vol. 1 p. 710}."
  en: "A town no longer in existence on the Algerian coast, between Oran and the Moroccan frontier at the Tafna, facing the island of Rachgoun. It replaced Portus Sigensis, the port of Siga, capital of King Syphax; it was rebuilt by a Miknasa Berber amir who was a vassal of the caliph al-Nasir of Cordova, was often laid waste, and was finally abandoned at the end of the tenth/sixteenth century {cite:encyclopaedia-of-islam-2 vol. 1 p. 710}."
