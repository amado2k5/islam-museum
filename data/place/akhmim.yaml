summary:
  ar: "مدينة قديمة الاختطاط على الشط الشرقي من النيل، فيها مسجدان يذكرهما ابن جبير، وفيها آثار ومصانع من بنيان القبط وكنائس عامرة بالمعاهدين من نصارى القبط ⁦(الصفحة 374 من الماسح الضوئي للنسخة)⁩. وشرقيها حيث ينعطف الرمل ملتفاً على الريف «بربا إخميم» — أشهر البرابي بالصعيد — رآها ابن فضل الله العمري مملوءة صوراً مصبغة في الجدر والسقوف والأركان من باطن البناء وظاهره لم تنطمس رسومها {cite:umari-masalik-1924 pp. 239-240}."
  en: "An old city on the east bank of the Nile, with two mosques that Ibn Jubayr mentions, remains and structures built by the Copts, and churches full of Coptic Christians living under covenant (page 374 of the scanned copy). East of it, where the sand bends around the countryside, lies the Birba of Akhmim, the most famous of the birbas of the Sa'id, which Ibn Fadl Allah al-Umari saw filled with coloured figures on its walls, ceilings and corners, inside and out, their drawings not effaced {cite:umari-masalik-1924 pp. 239-240}."
  es: "Una antigua ciudad en la orilla este del Nilo, con dos mezquitas que menciona Ibn Jubayr, restos y estructuras construidas por los coptos, e iglesias llenas de cristianos coptos que viven bajo pacto (página 374 de la copia escaneada). Al este, donde la arena se curva alrededor del campo, se encuentra la Birba de Akhmim, la más famosa de las birbas de Sa'id, que Ibn Fadl Allah al-Umari vio llena de figuras de colores en sus paredes, techos y esquinas, por dentro y por fuera, cuyos dibujos no se han borrado {cite:umari-masalik-1924 pp. 239-240}."
  fr: "Une ancienne ville sur la rive orientale du Nil, avec deux mosquées mentionnées par Ibn Jubayr, des vestiges et des édifices coptes, et des églises fréquentées par des chrétiens coptes vivant sous un pacte (page 374 de la copie numérisée). À l'est, là où le sable épouse les contours de la campagne, se trouve la Birba d'Akhmim, la plus célèbre des Birbas des Saïd, qu'Ibn Fadl Allah al-Umari vit ornée de figures colorées sur ses murs, ses plafonds et dans ses angles, à l'intérieur comme à l'extérieur, leurs dessins n'ayant pas été effacés {cite:umari-masalik-1924 pp. 239-240}."
  ur: "دریائے نیل کے مشرقی کنارے پر ایک پرانا شہر، جس میں دو مساجد ہیں جن کا ابن جبیر نے ذکر کیا ہے، باقیات اور قبطیوں کے بنائے ہوئے ڈھانچے، اور عہد کے تحت رہنے والے قبطی عیسائیوں سے بھرے گرجا گھر ⁦(اسکین کاپی کا صفحہ 374)⁩۔ اس کے مشرق میں، جہاں ریت دیہی علاقوں کے گرد جھکتی ہے، اخمیم کا بیربہ واقع ہے، جو سعید کے بیربوں میں سب سے مشہور ہے، جسے ابن فضل اللہ العمری نے دیکھا کہ اس کی دیواروں، چھتوں اور کونوں پر اندر اور باہر رنگین نقشوں سے بھرا ہوا ہے، ان کے نقشوں کو ظاہر نہیں کیا گیا ہے۔"
