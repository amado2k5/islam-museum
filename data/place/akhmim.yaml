label: { ar: "إخميم", en: "Akhmim" }
summary:
  ar: "مدينة قديمة الاختطاط على الشط الشرقي من النيل، فيها مسجدان يذكرهما ابن جبير، وفيها آثار ومصانع من بنيان القبط وكنائس عامرة بالمعاهدين من نصارى القبط (الصفحة 374 من الماسح الضوئي للنسخة). وشرقيها حيث ينعطف الرمل ملتفاً على الريف «بربا إخميم» — أشهر البرابي بالصعيد — رآها ابن فضل الله العمري مملوءة صوراً مصبغة في الجدر والسقوف والأركان من باطن البناء وظاهره لم تنطمس رسومها {cite:umari-masalik-1924 pp. 239-240}."
  en: "An old city on the east bank of the Nile, with two mosques that Ibn Jubayr mentions, remains and structures built by the Copts, and churches full of Coptic Christians living under covenant (page 374 of the scanned copy). East of it, where the sand bends around the countryside, lies the Birba of Akhmim, the most famous of the birbas of the Sa'id, which Ibn Fadl Allah al-Umari saw filled with coloured figures on its walls, ceilings and corners, inside and out, their drawings not effaced {cite:umari-masalik-1924 pp. 239-240}."
