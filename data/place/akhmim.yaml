summary:
  ar: "مدينة قديمة الاختطاط على الشط الشرقي من النيل، فيها مسجدان يذكرهما ابن جبير، وفيها آثار ومصانع من بنيان القبط وكنائس عامرة بالمعاهدين من نصارى القبط (الصفحة 374 من الماسح الضوئي للنسخة). وشرقيها حيث ينعطف الرمل ملتفاً على الريف «بربا إخميم» — أشهر البرابي بالصعيد — رآها ابن فضل الله العمري مملوءة صوراً مصبغة في الجدر والسقوف والأركان من باطن البناء وظاهره لم تنطمس رسومها {cite:umari-masalik-1924 pp. 239-240}."
