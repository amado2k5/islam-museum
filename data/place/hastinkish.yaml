summary:
  ar: "مدينة كبيرة كثيرة البشر عامرة، ذات أسواق وفعلة وتجار، ويذكر المؤلف أنها تبعد عن شرهام خمسين ميلا على الساحل {cite:nuzhat-al-mushtaq-2002 p. 945}."
  en: "A large, populous, busy city with markets, workers and merchants; the author gives fifty miles along the coast from Sharham {cite:nuzhat-al-mushtaq-2002 p. 945}."
  es: "Una ciudad grande, populosa y bulliciosa con mercados, trabajadores y comerciantes; el autor menciona cincuenta millas a lo largo de la costa desde Sharham {cite:nuzhat-al-mushtaq-2002 p. 945}."
  fr: "Une grande ville peuplée et animée, avec des marchés, des ouvriers et des marchands; l'auteur indique cinquante miles le long de la côte depuis Sharham {cite:nuzhat-al-mushtaq-2002 p. 945}."
  ur: "ایک بڑا، آبادی والا، بازاروں، کارکنوں اور تاجروں کے ساتھ مصروف شہر؛ مصنف نے شہرم سے ساحل کے ساتھ پچاس میل کا فاصلہ بیان کیا ہے۔ 945}۔"
  tr: "Pazarları, ticareti ve tüccarları olan büyük, yoğun nüfuslu bir şehir. Yazar, buranın Sharham'a kıyıda elli mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 945}."
  id: "Sebuah kota besar yang padat penduduk dengan pasar, perdagangan, dan pedagang. Penulis menyebutkan bahwa kota ini berjarak lima puluh mil dari Sharham di pesisir {cite:Nuzhat-al-Mushtaq-2002, hlm. 945}."
