summary:
  ar: "بلنسية مدينة شرق الأندلس على البحر، صار أمرها إلى الفقيه القاضي أبي أحمد ابن جحاف فاستولى عليها ردريق القنبيطور سنة ثمان وثمانين وأربعمائة وقيل التي قبلها بعد حصار عشرين شهراً وأحرقها وعاث فيها ومن أُحرق فيها الأديب أبو جعفر ابن البني، ثم فتحها الله على يدي الأمير أبي محمد مزدلي بعثاً من يوسف بن تاشفين سنة خمس وتسعين وأربعمائة وتولى عليها بعد ذلك بنو غانية وابن مردنيش {cite:nafh-tib-maqqari p. 455-456}، وفيها يقول ابن خفاجة: عاثت بساحتك الظباء يا دار ومحا محاسنك البلى والنار."
  en: "Valencia, the great city of eastern al-Andalus; held for the Almoravids by the qadi Ibn Jahhaf, taken by Rodrigo el Campeador in 488 after a twenty-month siege — the poet Ibn al-Banna among its burn victims — retaken by the Almoravid amir Mazdali in 495 {cite:nafh-tib-maqqari p. 455-456}."
  ur: "مشرقی اندلس کا ساحلی شہر؛ مقری 488ھ، یا اس سے ایک سال پہلے، القنبیطور کے قبضے اور 495ھ میں مزدلی کے ہاتھوں اس کی بازیابی کا ذکر کرتے ہیں۔ {cite:nafh-tib-maqqari p. 455-456}"
  es: "Valencia, la gran ciudad del este de al-Andalus; retenida para los almorávides por el cadí Ibn Jahhaf, tomada por Rodrigo el Campeador en 488 después de un asedio de veinte meses (el poeta Ibn al-Banna entre sus víctimas quemadas) retomada por el emir almorávide Mazdali en 495 {citar:nafh-tib-maqqari p. 455-456}."
  fr: "Valence, la grande ville de l'est d'Al-Andalus; détenu pour les Almoravides par le cadi Ibn Jahhaf, pris par Rodrigo el Campeador en 488 après un siège de vingt mois — le poète Ibn al-Banna parmi ses brûlés — repris par l'émir almoravide Mazdali en 495 {cite:nafh-tib-maqqari p. 455-456}."
  tr: "Valencia, Endülüs'ün doğusunda deniz kenarında bir şehirdi. Otoritesi, 488 Hicri yılında Rudraq al-Qanbitur tarafından ele geçirilen hukukçu ve yargıç Ebu Ahmed ibn Jahaf'ın yetkisine girdi—ya da yirmi ay kuşatma altında olduğu söylenir—yaktı ve yok etti. Yakanlar arasında yazar Ebu Ca'fer bin el-Bunni de vardı. Sonra Allah, 495 Hicri yılında Yusuf bin Taşfin tarafından gönderilen Prens Ebu Muhammed Mazdali'nin elleriyle burayı fethetti. Bundan sonra Banu Ghaniyya ve İbn Mardaniş burayı ele geçirdi. İbn Hafaca şöyle dedi: 'Avlunuz ceylanlar tarafından tahrip edildi, ey evim, güzelliğiniz çürüme ve ateşle silinsin.'"
  id: "Valencia adalah sebuah kota di sebelah timur Andalusia di tepi laut. Kewenangannya berada di bawah yurisdiksi ahli hukum dan hakim Abu Ahmad ibn Jahaf, yang merebutnya oleh Rudraq al-Qanbitur pada tahun 488 H—atau dikatakan kota ini telah dikepung selama dua puluh bulan—dan membakar serta menghancurkannya. Di antara yang membakarnya adalah penulis Abu Ja'far ibn al-Bunni. Kemudian Tuhan menaklukkannya oleh tangan Pangeran Abu Muhammad Mazdali yang dikirim oleh Yusuf ibn Tashfin pada tahun 495 H. Setelah itu, Banu Ghaniyya dan Ibn Mardanish mengambil alihnya. Ibn Khafaja berkata: 'Halaman rumahmu telah dihancurkan oleh kijang, wahai rumah, dan semoga kecantikanmu terhapus oleh kerusakan dan api.'"
