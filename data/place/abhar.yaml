summary:
  ar: "مدينة بين همذان وقزوين؛ قام عليها البراء بن عازب وهو في طريقه إلى قزوين فقاتله أهل حصنها وكان حصناً بناه بعض الأعاجم على عيون سُدّت بحلود البقر والصوف واتخذ عليها دكة ثم أنشئ الحصن عليها ثم طلبوا الأمان فأمّنهم على مثل ما أمّن حذيفة أهل نهاوند وغلب على أراضيها."
  en: "A town between Hamadhan and Qazwin; al-Bara' ibn Azib besieged it en route to Qazwin — its fortress had been built by a Persian lord over springs dammed with ox-hides and wool, a bench laid and the fort raised above — fought, then sought aman on Nihawand's terms, which he granted, and he seized Abhar's lands."
  es: "Una ciudad entre Hamadhan y Qazwin; al-Bara' ibn Azib la asedió de camino a Qazwin —su fortaleza había sido construida por un señor persa sobre manantiales represados con pieles de buey y lana, se colocó un banco y se elevó el fuerte encima— luchó, luego buscó un acuerdo con Nihawand en sus términos, que este concedió, y se apoderó de las tierras de Abhar."
  fr: "Une ville entre Hamadhan et Qazwin; al-Bara' ibn Azib l'assiégea en route vers Qazwin — sa forteresse avait été construite par un seigneur perse au-dessus de sources barrées avec des peaux de bœuf et de la laine, un banc installé et le fort surélevé au-dessus — combattit, puis demanda l'aman aux conditions de Nihawand, qu'il accorda, et il s'empara des terres d'Abhar."
