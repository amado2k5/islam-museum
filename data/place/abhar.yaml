summary:
  ar: "مدينة بين همذان وقزوين؛ قام عليها البراء بن عازب وهو في طريقه إلى قزوين فقاتله أهل حصنها وكان حصناً بناه بعض الأعاجم على عيون سُدّت بحلود البقر والصوف واتخذ عليها دكة ثم أنشئ الحصن عليها ثم طلبوا الأمان فأمّنهم على مثل ما أمّن حذيفة أهل نهاوند وغلب على أراضيها."
  en: "A town between Hamadhan and Qazwin; al-Bara' ibn Azib besieged it en route to Qazwin — its fortress had been built by a Persian lord over springs dammed with ox-hides and wool, a bench laid and the fort raised above — fought, then sought aman on Nihawand's terms, which he granted, and he seized Abhar's lands."
