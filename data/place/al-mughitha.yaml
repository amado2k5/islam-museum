summary:
  ar: "المغيثة سد اتخذه سليمان بن علي بالبصرة على البطيحة فحجز الماء عن نهر الدير وصرفه إلى نهر ابن عمر وأنفق عليه ألف ألف درهم."
  en: "al-Mughitha, the dam Sulayman ibn Ali built on Basra's batiha at a million dirhams' cost — turning the water from Nahr al-Dayr into Nahr Ibn Umar."
  es: "al-Mughitha, la presa que Sulayman ibn Ali construyó en el batiha de Basora a un costo de un millón de dirhams, desviando el agua del Nahr al-Dayr hacia el Nahr Ibn Umar."
  fr: "al-Mughitha, le barrage que Sulayman ibn Ali a construit sur le batiha de Bassora pour un coût d'un million de dirhams — transformant l'eau de Nahr al-Dayr en Nahr Ibn Umar."
  ur: "المغیثہ، ڈیم سلیمان ابن علی نے بصرہ کے بیتحہ پر ایک ملین درہم کی لاگت سے تعمیر کیا - نہر الدیر سے پانی کو نہر ابن عمر میں تبدیل کیا۔"
  tr: "Al-Mughita, Süleyman bin Ali tarafından Basra'da Al-Batiha'da inşa edilen bir barajdı, bu yüzden Deir Nehri'nden su ayırdı ve İbn Ömer Nehri'ne yönlendirdi ve bin bin dirhem harcadı."
  id: "Al-Mughitha adalah bendungan yang dibangun oleh Suleiman ibn Ali di Basra di Al-Batiha, sehingga ia menyisihkan air dari Sungai Deir dan mengalihkannya ke Sungai Ibn Umar, menghabiskan seribu ribu dirham untuk itu."
