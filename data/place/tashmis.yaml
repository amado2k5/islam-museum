summary:
  ar: "مدينة كبيرة كانت ذات أسواق ومنافع، على نهر سفدد، وبينها وبين البحر نحو ميل، أفنتها الفتن، وبقيت منها بقايا، وتبعد عن طنجة يومين. {cite:nuzhat-al-mushtaq-2002 p. 530}"
  en: "A great town once full of markets and profit, on the Safdad river about a mile from the sea; wars wore it away and only remains survive. Two days from Tangier. {cite:nuzhat-al-mushtaq-2002 p. 530}"
  es: "Una gran ciudad, antaño rebosante de mercados y prosperidad, situada a orillas del río Safdad, a aproximadamente una milla del mar; las guerras la devastaron y solo quedan sus ruinas. A dos días de Tánger. {cite:nuzhat-al-mushtaq-2002 p. 530}"
  fr: "Une grande ville jadis prospère et animée, située sur le fleuve Safdad à environ un kilomètre de la mer; les guerres l'ont ravagée et il n'en reste que des vestiges. À deux jours de Tanger. {cite:nuzhat-al-mushtaq-2002 p. 530}"
  ur: "سمندر سے تقریباً ایک میل کے فاصلے پر دریائے صفداد پر ایک عظیم شہر جو کبھی بازاروں اور منافع سے بھرا ہوا تھا۔ جنگوں نے اسے ختم کر دیا اور صرف زندہ رہتا ہے۔ تانگیر سے دو دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 530}"
