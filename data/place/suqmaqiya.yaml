summary:
  ar: "مدينة على رأس جبل، لها مزارع ومرافق، يتصرف في أمورها شيوخها ورؤساؤها، ويذكر المؤلف أنها تقع في شرق الأرض المنتنة {cite:nuzhat-al-mushtaq-2002 p. 930}."
  en: "A city on a mountain top with farms and resources, run by its elders and chiefs, which the author places east of the Foul Land {cite:nuzhat-al-mushtaq-2002 p. 930}."
  es: "Una ciudad en la cima de una montaña con granjas y recursos, gobernada por sus ancianos y jefes, que el autor sitúa al este de la Tierra Impura {cite:nuzhat-al-mushtaq-2002 p. 930}."
  fr: "Une ville au sommet d'une montagne avec des fermes et des ressources, dirigée par ses anciens et ses chefs, que l'auteur situe à l'est de la Terre Impure {cite:nuzhat-al-mushtaq-2002 p. 930}."
  ur: "کھیتوں اور وسائل کے ساتھ پہاڑ کی چوٹی پر ایک شہر، جو اس کے بزرگوں اور سرداروں کے ذریعہ چلایا جاتا ہے، جسے مصنف نے فاؤل لینڈ کے مشرق میں رکھا ہے۔ 930}۔"
  tr: "Bir dağın tepesinde, çiftlikleri ve tesisleri olan, şeyhleri ve reisleri tarafından yönetilen bir şehir. Yazar, buranın çürümüş toprakların doğusunda yer aldığını belirtir {cite:nuzhat-al-mushtaq-2002, s. 930}."
  id: "Sebuah kota di puncak gunung, dengan pertanian dan fasilitas, dikelola oleh para sheikh dan kepala suku. Penulis menyebutkan bahwa kota ini terletak di sebelah timur tanah busuk {cite:nuzhat-al-mushtaq-2002, hlm. 930}."
