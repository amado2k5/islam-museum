summary:
  ar: "خرتنك: قرية من قرى سمرقند على فرسخين منها ⁦(نحو ثلاثة أميال)⁩، نزل بها الإمام محمد بن إسماعيل البخاري في أواخر أيامه عند أقرباء له، فمات فيها وقُبر بها ليلة الفطر أول شوال سنة ٢٥٦هـ/٨٧٠م، وصار قبره مزارًا يستسقى عنده {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  en: "Khartank: a village of Samarkand about two parasangs (roughly three miles) from the city, where Imam Muhammad ibn Isma'il al-Bukhari lodged with relatives at the end of his life; he died there on the night of the festival, the first of Shawwal 256/870, and was buried there, and his grave became a place of pilgrimage where rain was invoked {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  ur: "خرتنک: سمرقند کے قریب ایک گاؤں جو شہر سے دو فرسخ ⁦(تقریباً تین میل)⁩ کے فاصلے پر تھا، جہاں امام محمد بن اسماعیل بخاری نے اپنی زندگی کے آخری ایام اپنے رشتہ داروں کے ہاں گزارے؛ وہ 256ھ/870ء میں شوال کی پہلی رات عید الفطر کی رات وہیں فوت ہوئے اور وہیں دفن ہوئے، اور ان کی قبر زیارت اور استسقاء کی جگہ بن گئی {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}۔"
  es: "Jartank: una aldea de Samarcanda a unos dos parasangs (aproximadamente tres millas) de la ciudad, donde el Imam Muhammad ibn Isma'il al-Bukhari se hospedó con parientes al final de su vida; murió allí la noche de la festividad, el primero de Shawwal 256/870, y fue enterrado allí, y su tumba se convirtió en un lugar de peregrinación donde se invocaba la lluvia {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  fr: "Khartank: un village de Samarcande situé à environ deux parasangs (environ trois miles) de la ville, où l'imam Muhammad ibn Isma'il al-Bukhari a séjourné chez des proches à la fin de sa vie; il y est décédé la nuit de la fête, le premier de Shawwal 256/870, et y a été enterré, et sa tombe est devenue un lieu de pèlerinage où la pluie était invoquée {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  tr: "Hartanak: Semerkand'da, yaklaşık iki farsakh uzaklıkta (yaklaşık üç mil) bir köy; İmam Muhammed bin İsmail el-Buhari'nin son zamanlarında akrabalarıyla birlikte yerleştiği yer. Orada öldü ve 256 Hicri / 870 yılında Şavval'ın ilk Fitr gecesinde defnedildi. Mezarı, bulunduğu yerde yağmur için bir türbe oldu {cite:tabaqat-shafiiyya-subki j.2 s. 14-15} {cite:encyclopaedia-of-islam-2 cilt 1, s. 1360}."
  id: "Khartanak: Sebuah desa di Samarkand, sekitar dua farsakh dari sana (sekitar tiga mil), tempat Imam Muhammad ibn Ismail al-Bukhari menetap di hari-hari tuanya bersama kerabatnya. Ia meninggal di sana dan dimakamkan di sana pada malam al-Fitr, hari pertama Syawal pada tahun 256 H / 870 M. Makamnya menjadi tempat suci hujan di tempatnya {cite:tabaqat-shafiiyya-subki j.2 hlm. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1, hlm. 1360}."
