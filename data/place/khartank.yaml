summary:
  ar: "خرتنك: قرية من قرى سمرقند على فرسخين منها (نحو ثلاثة أميال)، نزل بها الإمام محمد بن إسماعيل البخاري في أواخر أيامه عند أقرباء له، فمات فيها وقُبر بها ليلة الفطر أول شوال سنة ٢٥٦هـ/٨٧٠م، وصار قبره مزارًا يستسقى عنده {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  en: "Khartank: a village of Samarkand about two parasangs (roughly three miles) from the city, where Imam Muhammad ibn Isma'il al-Bukhari lodged with relatives at the end of his life; he died there on the night of the festival, the first of Shawwal 256/870, and was buried there, and his grave became a place of pilgrimage where rain was invoked {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}."
  ur: "خرتنک: سمرقند کے قریب ایک گاؤں جو شہر سے دو فرسخ (تقریباً تین میل) کے فاصلے پر تھا، جہاں امام محمد بن اسماعیل بخاری نے اپنی زندگی کے آخری ایام اپنے رشتہ داروں کے ہاں گزارے؛ وہ 256ھ/870ء میں شوال کی پہلی رات عید الفطر کی رات وہیں فوت ہوئے اور وہیں دفن ہوئے، اور ان کی قبر زیارت اور استسقاء کی جگہ بن گئی {cite:tabaqat-shafiiyya-subki j.2 p. 14-15} {cite:encyclopaedia-of-islam-2 vol. 1 p. 1360}۔"
