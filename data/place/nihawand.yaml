  ar: "مدينة بالجبل؛ عند البلاذري فيها يوم نهاوند سنة 20 إذ تجمعت الفرس وأهل الري وقومس وأصبهان وهمذان والماهين إلى يزدجرد بعد فراره من حلوان فأمر عليهم مردانشاه ذا الحاجب وأخرجوا الدرفشكابيان."
  en: "A Jibal city; in al-Baladhuri, the field of Yawm Nihawand in year 20 when the Persians and the people of Rayy, Qumis, Isbahan, Hamadhan and the Mahayn gathered to the fleeing Yazdgard under Mardanshah Dhu al-Hajib behind the Dirafsh-i Kabiyan."
  es: "Una ciudad de Jibal; en al-Baladhuri, el campo de Yawm Nihawand en el año 20, cuando los persas y la gente de Rayy, Qumis, Isbahan, Hamadhan y Mahayn se reunieron en Yazdgard que huía bajo Mardanshah Dhu al-Hajib detrás de Dirafsh-i Kabiyan."
  fr: "Une ville Jibal; à al-Baladhuri, le champ de Yawm Nihawand en l'an 20 lorsque les Perses et les habitants de Rayy, Qumis, Isbahan, Hamadhan et Mahayn se sont rassemblés vers Yazdgard en fuite sous Mardanshah Dhu al-Hajib derrière le Dirafsh-i Kabiyan."
  ur: "جبل شہر؛ البلادھوری میں، یوم نہاوند کے میدان میں سن 20 میں جب فارس اور رے، قمیس، اسبہان، حمادان اور ماہین کے لوگ دیرفش کبیان کے پیچھے مردان شاہ ذو الحجیب کے تحت فرار ہونے والے یزدگرد میں جمع ہوئے۔"
