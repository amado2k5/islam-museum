summary:
  ar: "هي مدينة مكناسة نفسها، مدينة حسنة مرتفعة على الأرض يجري في شرقيها نهر صغير عليه أرحاء، وبينها وبين بني زياد نحو ربع ميل. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  en: "The city of Miknasa (Meknes) itself, a handsome city raised above the ground with a small river and mills on its east, about a quarter of a mile from Bani Ziyad. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  es: "La ciudad de Miknasa (Meknes), una hermosa ciudad elevada sobre el terreno, con un pequeño río y molinos al este, se encuentra a unos cuatrocientos metros de Bani Ziyad. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  fr: "La ville de Miknasa (Meknès) elle-même, une belle cité surélevée, traversée par une petite rivière et bordée de moulins à l'est, se situe à environ 400 mètres de Bani Ziyad. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  ur: "مکناسا ⁦(میکنیس)⁩ کا شہر، ایک خوبصورت شہر جس کے مشرق میں ایک چھوٹی سی دریا اور ملیں ہیں، جو بنی زیاد سے تقریباً ایک چوتھائی میل کے فاصلے پر زمین سے اوپر ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 244}"
  tr: "Burası Meknassa şehridir; doğusunda küçük bir nehir akan güzel bir şehirdir ve varlığı Bani Ziyad ile arasında yaklaşık çeyrek mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 244}"
  id: "Ini adalah kota Meknassa itu sendiri, sebuah kota indah yang diangkat di atas tanah oleh sebuah sungai kecil yang mengalir di sebelah timurnya, dengan keberadaannya sekitar seperempat mil di antara sungai ini dan Bani Ziyad. {cite:Nuzhat-al-Mushtaq-2002 hlm. 244}"
