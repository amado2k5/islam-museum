summary:
  ar: "قرية عامرة على الضفة الشرقية للنيل، حولها الجنات والأراضي المتصلة العمارة والقصب والعنب، وتبعد عن القيس نصف يوم {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "A prosperous village on the east bank of the Nile, with gardens, cultivated land, cane and grapes. Half a day from al-Qays {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Un pueblo próspero en la orilla este del Nilo, con jardines, tierras cultivadas, caña de azúcar y vides. A medio día de al-Qays {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Un village prospère sur la rive orientale du Nil, avec des jardins, des terres cultivées, de la canne à sucre et des vignes. À une demi-journée d'al-Qays {cite:nuzhat-al-mushtaq-2002 p. 124}."
  ur: "دریائے نیل کے مشرقی کنارے پر ایک خوشحال گاؤں، جس میں باغات، کاشت کی گئی زمین، گنے اور انگور ہیں۔ القیس سے آدھا دن {حوالہ: نزہت المشتاق-2002 ص۔ 124}۔"
  tr: "Nil'in doğu kıyısında, bahçeler ve arazilerle çevrili, binalar, şeker kamışı ve üzümlerle birbirine bağlanmış canlı bir köy ve Al-Qais'e yarım gün uzaklıktadır {cite:Nuzhat-al-Mushtaq-2002, s. 124}."
  id: "Sebuah desa yang berkembang di tepi timur Sungai Nil, dikelilingi oleh taman dan tanah yang terhubung oleh bangunan, tebu, dan anggur, dan berjarak setengah hari dari Al-Qais {cite:Nuzhat-al-Mushtaq-2002, hlm. 124}."
