label: { ar: "الرها", en: "al-Ruha (Edessa)" }
summary:
  ar: "الرها (أديسا) أعظم مدن الجزيرة الفراتية؛ أول ما فتحه إياد بن غنم من الجزيرة، وقف على بابها على فرس كميت فصالحه أهلها على أن لهم هيكلهم وما حوله ولا يحدثون كنيسة إلا ما كان لهم ويعاونون المسلمين على عدوهم فإن تركوا شيئاً فلا ذمة لهم — ودخل أهل الجزيرة في صلحهم.، وعند ابن الجوزي وفي بيعة بها منديل كان لعيسى مسح به وجهه فصارت صورة وجهه فيه التمسه ملك الروم سنة 331هـ بإطلاق أسارى مسلمين فسلمه المتقي {cite:muntazam-ibn-al-jawzi p. 623-624}"
  en: "al-Ruha (Edessa), greatest city of the Euphratean Jazira; the first of the Jazira towns Iyad ibn Ghanm took — standing at its gate on a chestnut horse, its people compounded with him for their great church and its surroundings, no new church beyond what they had, and aid to the Muslims against their enemy, failing which they had no dhimma — the people of the Jazira entering into their treaty."
