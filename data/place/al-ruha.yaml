summary:
  ar: "الرها ⁦(أديسا)⁩ أعظم مدن الجزيرة الفراتية؛ أول ما فتحه إياد بن غنم من الجزيرة، وقف على بابها على فرس كميت فصالحه أهلها على أن لهم هيكلهم وما حوله ولا يحدثون كنيسة إلا ما كان لهم ويعاونون المسلمين على عدوهم فإن تركوا شيئاً فلا ذمة لهم — ودخل أهل الجزيرة في صلحهم. وعند ابن الجوزي وفي بيعة بها منديل كان لعيسى مسح به وجهه فصارت صورة وجهه فيه التمسه ملك الروم سنة 331هـ بإطلاق أسارى مسلمين فسلمه المتقي {cite:muntazam-ibn-al-jawzi p. 623-624}"
  en: "al-Ruha (Edessa), greatest city of the Euphratean Jazira; the first of the Jazira towns Iyad ibn Ghanm took — standing at its gate on a chestnut horse, its people compounded with him for their great church and its surroundings, no new church beyond what they had, and aid to the Muslims against their enemy, failing which they had no dhimma — the people of the Jazira entering into their treaty."
  es: "al-Ruha (Edesa), la ciudad más grande de la Jazira del Éufrates; la primera de las ciudades de la Jazira que tomó Iyad ibn Ghanm; de pie en su puerta sobre un caballo castaño, su gente se comprometió con él por su gran iglesia y sus alrededores, sin ninguna iglesia nueva más allá de la que ya tenían, y ayuda a los musulmanes contra su enemigo, sin lo cual no tenían dhimma; la gente de la Jazira entrando en su tratado."
  fr: "al-Ruha (Édesse), la plus grande ville de la Jazira euphratéenne; la première des villes de la Jazira qu'Iyad ibn Ghanm prit — se tenant à sa porte sur un cheval alezan, ses habitants ayant conclu un accord avec lui pour leur grande église et ses environs, pas de nouvelle église au-delà de celle qu'ils possédaient déjà, et une aide aux musulmans contre leur ennemi, faute de quoi ils n'auraient pas de dhimma — les habitants de la Jazira concluant leur traité."
