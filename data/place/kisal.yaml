summary:
  ar: "كسال مدينة بناها مروان بن محمد حين ولّي الثغر فنزلها — وهي من برذعة على أربعين فرسخاً ومن تفليس على عشرين فرسخاً — وانطلق منها فدخل أرض الخزر مما يلي باب اللان."
  en: "Kisal, the city Marwan ibn Muhammad built and made his seat when given the march — forty farsakhs from Bardha'a and twenty from Tiflis — and from it he set out to enter the Khazar land by way of Bab al-Lan."
  es: "Kisal, la ciudad que Marwan ibn Muhammad construyó y convirtió en su sede cuando se le concedió la marcha —a cuarenta farsakhs de Bardha'a y veinte de Tiflis— y desde allí partió para entrar en la tierra jázara por el paso de Bab al-Lan."
  fr: "Kisal, la ville que Marwan ibn Muhammad a construite et où il a établi son siège lorsqu'il a reçu la marche — quarante farsakhs de Bardha'a et vingt de Tiflis — et de là il est parti pour entrer au pays Khazar en passant par Bab al-Lan."
  ur: "کسال، شہر مروان بن محمد نے بنایا اور جب مارچ دیا تو اپنی جگہ بنا لی - بردعہ سے چالیس فرسخ اور طفلس سے بیس - اور اس سے باب اللان کے راستے خزر سرزمین میں داخل ہونے کے لیے روانہ ہوئے۔"
