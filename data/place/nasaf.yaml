summary:
  ar: "نسف وهي نخشب بلد ما وراء النهر؛ أقبل أهلها مع السغد والترك وكش إلى سعيد بن عثمان في مائة ألف وعشرين ألفاً فالتقوا ببخارا فانكسروا."
  en: "Nasaf — that is Nakhshab — beyond the river; its folk marched with Sughd, Turks and Kish on Sa'id ibn Uthman's host and were broken at Bukhara."
  es: "Nasaf —es decir, Nakhshab— al otro lado del río; su gente marchó con Sughd, turcos y kish contra el ejército de Sa'id ibn Uthman y fueron derrotados en Bujará."
  fr: "Nasaf — c'est-à-dire Nakhshab — au-delà du fleuve; ses habitants marchèrent avec les Sughd, les Turcs et les Kish sur l'armée de Sa'id ibn Uthman et furent vaincus à Boukhara."
  ur: "نصف - یعنی نخشب - دریا سے پرے؛ اس کے لوگوں نے سغد، ترک اور کیش کے ساتھ سعید بن عثمان کے لشکر پر چڑھائی کی اور بخارا میں ٹوٹ پڑے۔"
  tr: "Nasaf, nehrin ötesindeki bir toprak; halkı Sogdlar ve Türklerle birlikte yüz yirmi bin adamla Said ibn Osman geldi, Buhara'ya karşı buluştu ancak yenildi."
  id: "Nasaf, sebuah tanah di seberang sungai; rakyatnya, bersama dengan Sogd dan Turki, datang kepada Sa'id ibn Uthman dengan seratus dua puluh ribu orang, bertemu Bukhara, namun dikalahkan."
