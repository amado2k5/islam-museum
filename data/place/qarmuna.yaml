  fr: "Ville fortifiée perchée sur une colline dominant une plaine fertile en blé et en orge; à deux étapes de Séville. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  ur: "ایک مضبوط پہاڑی کی چوٹی پر ایک قلعہ بند قصبہ جس سے گندم اور جو سے مالا مال میدان نظر آتا ہے۔ Seville سے دو مراحل. {حوالہ: نزہت المشتاق-2002 ص۔ 572}"
