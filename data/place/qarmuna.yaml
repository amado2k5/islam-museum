summary:
  ar: "مدينة حصينة على رأس جبل منيع، تطل على فحص كثير الإصابة في الحنطة والشعير، وتبعد عن إشبيلية مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  en: "A fortified town on a strong hilltop overlooking a plain rich in wheat and barley; two stages from Seville. {cite:nuzhat-al-mushtaq-2002 p. 572}"
