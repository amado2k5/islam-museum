  fr: "Une ville dotée d'une banlieue densément peuplée et d'une solide muraille construite avec art le long de la mer, où l'on construit des navires et d'où part la flotte; une grande montagne se dresse au sud. {cite:nuzhat-al-mushtaq-2002 p. 557}"
