summary:
  ar: "جزيرة قريبة من جزيرة جابة، فيها جوز الهند والموز والقصب والأرز، وفي آخرها بركان يتصاعد منه الدخان نهاراً وتشتعل النار ليلاً {cite:nuzhat-al-mushtaq-2002 p. 82}."
  en: "An island close to Jaba with coconuts, bananas, cane and rice. At its far end is a volcano that smokes by day and burns by night {cite:nuzhat-al-mushtaq-2002 p. 82}."
  es: "Una isla cercana a Jaba con cocos, plátanos, caña de azúcar y arroz. En su extremo más alejado hay un volcán que humea de día y arde de noche {cite:nuzhat-al-mushtaq-2002 p. 82}."
  fr: "Une île proche de Jaba, où poussent cocotiers, bananiers, canne à sucre et riz. À son extrémité se dresse un volcan qui fume le jour et brûle la nuit {cite:nuzhat-al-mushtaq-2002 p. 82}."
  ur: "جبہ کے قریب ایک جزیرہ جس میں ناریل، کیلے، گنے اور چاول ہیں۔ اس کے آخری سرے پر ایک آتش فشاں ہے جو دن کو دھواں چھوڑتا ہے اور رات کو جلتا ہے۔ 82}۔"
  tr: "Jaba Adası yakınlarındaki bir ada, hindistancevizi, muz, şeker kamışı ve pirinç içeriyor; sonunda gündüzleri duman yükseliyor ve gece ateşler yanıyor {cite:Nuzhat-al-Mushtaq-2002, s. 82}."
  id: "Sebuah pulau dekat Pulau Jaba, yang berisi kelapa, pisang, tebu, dan beras, di ujungnya terdapat gunung berapi yang asapnya naik pada siang hari dan api menyala pada malam hari {cite:Nuzhat-al-Mushtaq-2002, hlm. 82}."
