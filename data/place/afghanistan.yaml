summary:
  ar: إقليم في آسيا الوسطى، فتحه المسلمون في القرن الأول للهجرة، ومقاومة كابل الإسلامَ زمنًا أطول من سائر المشرق، ثم حكمه الغزنويون والغوريون والكرت والتيموريون، ومن أبرز مدنه غزنة وكابل وهرات {cite:encyclopaedia-of-islam-2 vol. 1 p. 248}.
  en: A region of Central Asia that the Muslims conquered in the first centuries AH. Kabul resisted Islamization longer than the other eastern provinces. The Ghaznawids, Ghurids, Karts and Timurids ruled it; Ghazna, Kabul and Harat were its chief towns {cite:encyclopaedia-of-islam-2 vol. 1 p. 248}.
  es: "Una región de Asia Central que los musulmanes conquistaron en los primeros siglos de la Hégira. Kabul resistió la islamización durante más tiempo que las demás provincias orientales. Fue gobernada por los gaznávidas, los gúridas, los karts y los timúridas; Ghazna, Kabul y Harat eran sus principales ciudades {cite:encyclopaedia-of-islam-2 vol. 1 p. 248}."
  fr: "Région d'Asie centrale conquise par les musulmans au cours des premiers siècles de l'Hégire, Kaboul résista plus longtemps à l'islamisation que les autres provinces orientales. Elle fut successivement gouvernée par les Ghaznévides, les Ghurides, les Karts et les Timourides; Ghazni, Kaboul et Harat en étaient les principales villes (voir: Encyclopédie de l'Islam, vol. 1, p. 248)."
  ur: "وسطی ایشیا کا ایک خطہ جسے مسلمانوں نے پہلی صدی ہجری میں فتح کیا۔ کابل نے دیگر مشرقی صوبوں کی نسبت زیادہ دیر تک اسلامائزیشن کی مزاحمت کی۔ غزنویوں، غوریوں، کارتوں اور تیموریوں نے اس پر حکومت کی۔ غزنہ، کابل اور حرات اس کے اہم شہر تھے {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد 1 ص۔ 248}۔"
  tr: "Orta Asya'da bir bölge, ilk yüzyılda Müslümanlar tarafından fethedilmiş ve Kabil'in İslam'a direnişi Doğu'nun geri kalanından daha uzun sürmüştür. O dönemde Gazneliler, Guri halkları, Kart ve Timurlar tarafından yönetilmiştir. En önemli şehirleri arasında Gazna, Kabil ve Herat bulunmaktadır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 248}."
  id: "Sebuah wilayah di Asia Tengah yang ditaklukkan oleh Muslim pada abad pertama H, dan perlawanan Kabul terhadap Islam berlangsung lebih lama daripada wilayah Timur lainnya. Saat itu wilayah ini diperintah oleh Ghaznavid, bangsa Ghurid, Kart, dan Timurid. Di antara kota-kota paling menonjolnya adalah Ghazna, Kabul, dan Herat {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 248}."
