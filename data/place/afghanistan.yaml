summary:
  ar: "إقليم في آسيا الوسطى، فتحه المسلمون في القرن الأول للهجرة، ومقاومة كابل الإسلامَ زمنًا أطول من سائر المشرق، ثم حكمه الغزنويون والغوريون والكرت والتيموريون، ومن أبرز مدنه غزنة وكابل وهرات {cite:encyclopaedia-of-islam-2 vol. 1 p. 248}."
  en: "A region of Central Asia that the Muslims conquered in the first centuries AH. Kabul resisted Islamization longer than the other eastern provinces. The Ghaznawids, Ghurids, Karts and Timurids ruled it; Ghazna, Kabul and Harat were its chief towns {cite:encyclopaedia-of-islam-2 vol. 1 p. 248}."
