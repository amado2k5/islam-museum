summary:
  ar: "مدينة صغيرة عامرة، وبها سوق ومسجد، ويُحمل منها الحلفاء إلى جميع بلاد البحر، وعليها حصن منيع عال في أعلى جبل. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  en: "A small populated town with a market and mosque, from which esparto grass is carried to all the lands of the sea; a strong high fortress crowns the mountain above it. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  es: "Un pequeño pueblo poblado con mercado y mezquita, desde donde se transporta el esparto a todas las tierras del mar; una imponente fortaleza corona la montaña que lo domina. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  fr: "Une petite ville peuplée, dotée d'un marché et d'une mosquée, d'où l'alfa est exportée vers toutes les régions côtières; une imposante forteresse domine la montagne qui la surplombe. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  ur: "ایک چھوٹا آبادی والا قصبہ جس میں ایک بازار اور مسجد ہے، جہاں سے ایسپارٹو گھاس سمندر کی تمام زمینوں تک پہنچائی جاتی ہے۔ ایک مضبوط اونچا قلعہ اس کے اوپر پہاڑ کا تاج بناتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 558}"
  tr: "Pazarı ve camisi olan, müttefiklerin tüm denizlere götürüldüğü, en yüksek dağda güçlü bir kaleye sahip küçük hareketli bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 558}"
  id: "Sebuah kota kecil yang ramai dengan pasar dan masjid, dari mana sekutu dibawa ke seluruh lautan, dan memiliki benteng kuat di gunung tertinggi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 558}"
