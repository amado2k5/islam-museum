summary:
  ar: "مدينة في الصحراء قريبة من بلاد لمتونة، وهي طريق القوافل إلى السودان؛ تبعد عن سلى وتكرور نحو أربعين يوماً بسير القوافل، وبينها وبين أوليل نحو أربعين مرحلة {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  en: "A desert town near the Lamtuna lands and the caravan route to Sudan. About forty days by caravan from Sala and Takrur, and about forty stages from Awlil {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  es: "Un pueblo desértico cerca de las tierras de Lamtuna y la ruta de caravanas hacia Sudán. Aproximadamente cuarenta días en caravana desde Sala y Takrur, y aproximadamente cuarenta etapas desde Awlil {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  fr: "Une ville du désert près des terres de Lamtuna et de la route caravanière vers le Soudan. Environ quarante jours en caravane depuis Sala et Takrur, et environ quarante étapes depuis Awlil {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  ur: "لامتونا کے قریب ایک صحرائی قصبہ اور سوڈان جانے والے کارواں کا راستہ۔ سالا اور تکرور سے قافلہ کے تقریباً چالیس دن اور اولیل سے تقریباً چالیس مراحل۔ 18-19}۔"
  tr: "Lamtuna topraklarına yakın çölde bir şehir olan bu şehir, Sudan'a giden kervan yoludur; kervan güzergahıyla Salé ve Kikrur'dan yaklaşık kırk gün uzaklıktadır ve Ulil ile arasında yaklaşık kırk etap vardır {cite:Nuzhat-al-mushtaq-2002, s. 18-19}."
  id: "Sebuah kota di gurun dekat tanah Lamtuna, kota ini merupakan rute karavan menuju Sudan; jaraknya sekitar empat puluh hari dari Salé dan Kikrur melalui rute karavan, dan antara kota ini dan Ulil terdapat sekitar empat puluh tahap {cite:Nuzhat-al-mushtaq-2002, hlm. 18-19}."
