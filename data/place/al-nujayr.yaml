summary:
  ar: "حصن لبني كندة بحضرموت تحصّن به الأشعث بن قيس وعظماء كندة في ردتهم فحاصره زياد بن لبيد والمهاجر بن أبي أمية حتى جُهدوا فنزلوا على الأمان؛ وُجدت به نسوة شمتن بوفاة النبي فأمر أبو بكر بقطع أيديهن وأرجلهن، وردّت سباياه بالفداء أربعمائة درهم للرأس."
  en: "A fortress of Banu Kinda in Hadramawt in which al-Ash'ath ibn Qays and the chiefs of Kinda fortified themselves in their apostasy; Ziyad ibn Labid and al-Muhajir ibn Abi Umayya besieged it until they were exhausted and came down on terms; women were found there who had gloated at the Prophet's death and Abu Bakr ordered their hands and feet cut, and its captives were ransomed back at four hundred dirhams a head."
  es: "Una fortaleza de Banu Kinda en Hadramawt donde al-Ash'ath ibn Qays y los jefes de Kinda se atrincheraron en su apostasía; Ziyad ibn Labid y al-Muhajir ibn Abi Umayya la sitiaron hasta que se agotaron y llegaron a un acuerdo; allí se encontraron mujeres que se habían regodeado con la muerte del Profeta y Abu Bakr ordenó que les cortaran las manos y los pies, y sus cautivos fueron rescatados a cambio de cuatrocientos dirhams por persona."
  fr: "Une forteresse des Banu Kinda dans le Hadramaout où al-Ash'ath ibn Qays et les chefs de Kinda s'étaient retranchés dans leur apostasie; Ziyad ibn Labid et al-Muhajir ibn Abi Umayya l'assiégèrent jusqu'à épuisement et finirent par se rendre; on y trouva des femmes qui s'étaient réjouies de la mort du Prophète et Abu Bakr ordonna qu'on leur coupe les mains et les pieds, et les captives furent rachetées à quatre cents dirhams par personne."
