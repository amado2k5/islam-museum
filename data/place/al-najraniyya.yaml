summary:
  ar: "قرية بناحية الكوفة نزلها نصارى نجران ومن تبعهم من يهودها لما أجلاهم عمر بن الخطاب من اليمن في خلافته، فسُمّيت بهم؛ وكان صاحب النجرانية يبعث رسله إلى متفرقيهم بالشام والنواحي يجبونهم مالاً يقسمه عليهم لإقامة الحُلَل المفروضة عليهم، وشكوا تفرقهم وموت من مات وإسلام من أسلم حتى وجدهم عمر بن عبد العزيز على العشر من عدّتهم الأولى."
  en: "A village in the Kufa district settled by the Christians of Najran and their Jewish dependents when Umar ibn al-Khattab exiled them from Yemen in his caliphate, and named after them; the head of al-Najraniyya used to send agents to their scattered communities in Syria and the districts collecting a fund divided among them to sustain the stipulated hullas, and they complained of dispersion, deaths and conversions until Umar ibn Abd al-Aziz found them at a tithe of their original number."
