label: { ar: "النجرانية", en: "al-Najraniyya", es: "al-Najraniyya", fr: "al-Najraniyya" }
summary:
  ar: "قرية بناحية الكوفة نزلها نصارى نجران ومن تبعهم من يهودها لما أجلاهم عمر بن الخطاب من اليمن في خلافته، فسُمّيت بهم؛ وكان صاحب النجرانية يبعث رسله إلى متفرقيهم بالشام والنواحي يجبونهم مالاً يقسمه عليهم لإقامة الحُلَل المفروضة عليهم، وشكوا تفرقهم وموت من مات وإسلام من أسلم حتى وجدهم عمر بن عبد العزيز على العشر من عدّتهم الأولى."
  en: "A village in the Kufa district settled by the Christians of Najran and their Jewish dependents when Umar ibn al-Khattab exiled them from Yemen in his caliphate, and named after them; the head of al-Najraniyya used to send agents to their scattered communities in Syria and the districts collecting a fund divided among them to sustain the stipulated hullas, and they complained of dispersion, deaths and conversions until Umar ibn Abd al-Aziz found them at a tithe of their original number."
  es: "Una aldea en el distrito de Kufa, fundada por los cristianos de Najran y sus dependientes judíos cuando Umar ibn al-Khattab los exilió de Yemen durante su califato, y nombrada en su honor; el jefe de al-Najraniyya solía enviar agentes a sus comunidades dispersas en Siria y los distritos para recaudar fondos que se repartían entre ellos para mantener las hullas estipuladas, y se quejaban de dispersión, muertes y conversiones hasta que Umar ibn Abd al-Aziz los encontró reducidos a la décima parte de su número original."
  fr: "Un village du district de Kufa, fondé par les chrétiens de Najran et leurs dépendants juifs lorsque Umar ibn al-Khattab les exila du Yémen lors de son califat, et nommé d'après eux; le chef d'al-Najraniyya avait coutume d'envoyer des agents à leurs communautés dispersées en Syrie et dans les districts, collectant un fonds divisé entre elles pour soutenir les hullas stipulées, et elles se plaignaient de dispersion, de morts et de conversions jusqu'à ce qu'Umar ibn Abd al-Aziz les trouve réduits à la dîme de leur nombre d'origine."
