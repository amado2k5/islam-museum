summary:
  ar: "جمهورية جيبوتي، دولة ذات سيادة وجمهورية رئاسية موحدة، استقلت عن فرنسا في 27 يونيو 1977، عاصمتها مدينة جيبوتي، لغتاها الرسميتان العربية والفرنسية ولغتاها الوطنيتان الصومالية والعفرية."
  en: "The Republic of Djibouti, a sovereign state and unitary presidential republic, independent from France on 27 June 1977, with Djibouti City as its capital, Arabic and French as official languages and Somali and Afar as national languages."
  ur: "جمہوریہ جبوتی، خودمختار ریاست اور وحدانی صدارتی جمہوریہ، 27 جون 1977 کو فرانس سے آزاد، دارالحکومت جبوتی شہر، سرکاری زبانیں عربی اور فرانسیسی، قومی زبانیں صومالی اور عفر۔"
  fr: "La République de Djibouti, État souverain et république présidentielle unitaire, indépendante de la France le 27 juin 1977, avec la ville de Djibouti pour capitale, l'arabe et le français pour langues officielles et le somali et l'afar pour langues nationales."
  es: "La República de Yibuti, Estado soberano y república presidencial unitaria, independiente de Francia el 27 de junio de 1977, con la ciudad de Yibuti como capital, el árabe y el francés como lenguas oficiales y el somalí y el afar como lenguas nacionales."
