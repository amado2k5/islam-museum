summary:
  ar: "مدينة حصينة منيعة، لها سور من رخام، وبها قوم قلائل من الروم، ويذكر الإدريسي أنها تبعد عن طرطوشة خمسين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  en: "A strong, well-defended city with a marble wall and a few Romans; fifty miles from Tortosa in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  es: "Una ciudad fuerte y bien defendida, con una muralla de mármol y algunos romanos; a cincuenta millas de Tortosa, según el relato de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  fr: "Une ville forte et bien défendue, entourée de remparts de marbre et peuplée de quelques Romains; à cinquante milles de Tortosa, selon le récit d’al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  ur: "ماربل کی دیوار اور چند رومیوں کے ساتھ ایک مضبوط، اچھی طرح سے محفوظ شہر؛ الادریسی کے کھاتے میں تورتوسا سے پچاس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 555}"
  tr: "Mermer duvarlı, tahkim edilmiş ve tahkim edilmiş bir şehirdir ve az sayıda Romalıya ev sahipliği yapmaktadır. Al-Idrisi, buranın Tartuşa'ya elli mil uzaklıkta olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 555}"
  id: "Sebuah kota yang diperkuat dan diperkuat dengan tembok marmer, dan menjadi rumah bagi sejumlah kecil orang Romawi. Al-Idrisi menyebutkan bahwa kota ini berjarak lima puluh mil dari Tartusha. {cite:Nuzhat-al-Mushtaq-2002 hlm. 555}"
