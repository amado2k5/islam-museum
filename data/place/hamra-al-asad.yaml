summary:
  ar: "موضع على بعد ثمانية أميال جنوب المدينة المنورة. بلغه النبي في اليوم التالي لغزوة أحد ⁦(الأحد الثامن شوال 3هـ)⁩ في طلب جيش قريش المنصرف، فعسكر هناك الإثنين والثلاثاء والأربعاء ثم رجع إلى المدينة. وتُعدّ غزوة حمراء الأسد تتمة لغزوة أحد لا غزوة مستقلة {cite:mubarakpuri-raheeq p.285}."
  en: "A place eight miles south of Medina. The Prophet reached it the day after the battle of Uhud (Sunday 8 Shawwal 3 AH) in pursuit of the withdrawing Quraysh army, camped there Monday, Tuesday and Wednesday, then returned to Medina. The march on Hamra al-Asad is counted a continuation of Uhud, not a separate campaign {cite:mubarakpuri-raheeq p.285}."
  es: "Un lugar situado a ocho millas al sur de Medina. El Profeta llegó allí al día siguiente de la batalla de Uhud (domingo 8 de Shawwal del año 3 de la Hégira) persiguiendo al ejército Quraysh en retirada, acampó allí el lunes, martes y miércoles, y luego regresó a Medina. La marcha hacia Hamra al-Asad se considera una continuación de Uhud, no una campaña independiente {cita: mubarakpuri-raheeq p.285}."
  fr: "Hamra al-Asad, un lieu situé à huit milles au sud de Médine, fut atteint par le Prophète le lendemain de la bataille d'Uhud (dimanche 8 Shawwal 3 AH), à la poursuite de l'armée qurayshite en retraite. Il y campa les lundi, mardi et mercredi, puis retourna à Médine. La marche sur Hamra al-Asad est considérée comme la suite de la bataille d'Uhud, et non comme une campagne distincte (cf. Mubarakpuri-Raheeq, p. 285)."
  ur: "مدینہ سے آٹھ میل جنوب میں ایک جگہ۔ رسول اللہ جنگ احد کے اگلے دن ⁦(اتوار 8 شوال 3 ہجری)⁩ قریش کے پیچھے ہٹنے والے لشکر کے تعاقب میں پہنچے، وہاں پیر، منگل اور بدھ کو ڈیرے ڈالے، پھر مدینہ واپس آئے۔ حمراء الاسد پر مارچ کو احد کا تسلسل شمار کیا جاتا ہے، کوئی الگ مہم نہیں {حوالہ:مبارکپوری الرحیق صفحہ 285}۔"
