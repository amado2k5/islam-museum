summary:
  ar: "المحفوظة مدينة بناها الحكم بن عوانة الكلبي من وراء البحيرة مما يلي الهند وجعلها مأوى للمسلمين ومعاذاً ومصرها وكان شاور مشايخ كلب في تسميتها فلما قال رجل سمها تدمر قال دمر الله عليك يا أحمق ولكني أسميها المحفوظة."
  en: "al-Mahfuza, 'the Guarded', built by al-Hakam ibn Awana beyond the lake as the Muslims' refuge-misr when Hind apostatized — named against a fool's 'Tadmur'."
  es: "al-Mahfuza, 'el Guardián', construido por al-Hakam ibn Awana más allá del lago como refugio-misr de los musulmanes cuando Hind apostató, nombrado en contraposición a un tonto llamado 'Tadmur'."
  fr: "al-Mahfuza, « le Gardien », construit par al-Hakam ibn Awana au-delà du lac comme refuge-misr des musulmans lorsque Hind apostasié — nommé contre le « Tadmur » d'un fou."
  ur: "المحفوظہ، 'دی گارڈڈ'، جسے الحکم ابن عوانہ نے جھیل کے پار مسلمانوں کے پناہ گزین کے طور پر تعمیر کیا جب ہند نے مرتد کیا - جسے ایک احمق کے 'تدمور' کے خلاف نامزد کیا گیا۔"
  tr: "Al-Mahfouzah, Hindistan yakınlarında gölün arkasında Al-Hakam ibn Awana Al-Kalbi tarafından inşa edilmiş bir şehirdir ve burayı Müslümanlar, Muadh ve Mısır'ın sığınak konumuna getirir. Kalb'ın yaşlıları adını sorgulamıştır. Bir adam 'Palmyra deyin,' dediğinde, 'Allah seni yok etsin, aptal, ama ben ona Al-Mahfouzah diyorum.' dedi."
  id: "Al-Mahfouzah adalah sebuah kota yang dibangun oleh Al-Hakam ibn Awana Al-Kalbi di belakang danau dekat India, menjadikannya tempat perlindungan bagi umat Muslim, Muadh, dan Mesirnya. Para tetua Kalb menanyakan namanya. Ketika seorang pria berkata, 'Sebut saja Palmyra,' ia berkata, 'Semoga Allah menghancurkanmu, bodoh, tapi aku menyebutnya Al-Mahfouzah.'"
