summary:
  ar: "القندهار مدينة على طريق سجستان إلى الهند؛ فتحها عباد بن زياد بعد قتال وأصيب فيها رجال من المسلمين وعمل على مثال قلانسها الطوال فسميت العبادية وفيها قال ابن مفرغ بقدهار ومن تكتب منيته بقندهار يرجم دونه الخبر."
  en: "al-Qandahar on the Sijistan-India road; stormed by Abbad ibn Ziyad at cost — its tall caps the model of the 'Abbadiyya — and Ibn Mufarrigh's 'he whose fate is written at Qandahar'."
  es: "Al-Qandahar en la ruta Sijistan-India; asaltada por Abbad ibn Ziyad a costa —sus altas cumbres son el modelo de la 'Abbadiyya'— y de Ibn Mufarrigh 'aquel cuyo destino está escrito en Qandahar'."
  fr: "al-Qandahar sur la route Sijistan-Inde; prise d'assaut par Abbad ibn Ziyad à prix d'or — ses hauts sommets sont le modèle de l'« Abbadiyya » — et Ibn Mufarrigh « celui dont le destin est écrit à Qandahar »."
  ur: "سجستان-انڈیا روڈ پر القندھار؛ عباد ابن زیاد نے قیمت پر حملہ کیا - اس کی اونچی ٹوپیاں 'عبادیہ' کا نمونہ - اور ابن مفرج کی 'وہ جس کی قسمت قندھار میں لکھی گئی ہے'۔"
  tr: "Kandahar, Sijistan'dan Hindistan'a giden yolda bir şehirdir; Abbad ibn Ziyad tarafından bir savaştan sonra ele geçirilmiştir; burada Müslüman erkekler yaralanmıştır. Uzun şapkasının örneği üzerinde çalışmıştır ve bu şapka Al-Abadiyah adını vermiştir. İbn Mufragh Kadahar'da şöyle demiştir: Kandahar'da şehit olarak kaydedilen herkes anlatıcı sayılır."
  id: "Kandahar adalah sebuah kota di jalan dari Sijistan ke India; kota ini direbut oleh Abbad ibn Ziyad setelah sebuah pertempuran, di mana pria Muslim terluka. Ia mengerjakan contoh topi panjangnya, yang dinamai Al-Abadiyah. Ibn Mufragh berkata dalam Qadahar: Siapa pun yang tercatat sebagai martir di Kandahar dianggap sebagai narator."
