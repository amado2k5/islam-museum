  ar: "مدينة من أرض قمنورية، كانت من مدينتين عامرتين فيها قديما، ثم أفنتها الفتن والغارات، ونقل المؤلف أن الطريق منها إلى سلى نحو اثني عشر يوما {cite:nuzhat-al-mushtaq-2002 p. 105}، {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A town in the land of Qamnuriyya. The author says it was once one of two thriving towns there, and that wars and raids later emptied it. He gives about twelve days of travel from it toward Sila {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
