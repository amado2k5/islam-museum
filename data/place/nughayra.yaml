summary:
  ar: "مدينة من أرض قمنورية، كانت من مدينتين عامرتين فيها قديما، ثم أفنتها الفتن والغارات، ونقل المؤلف أن الطريق منها إلى سلى نحو اثني عشر يوما {cite:nuzhat-al-mushtaq-2002 p. 105}، {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A town in the land of Qamnuriyya. The author says it was once one of two thriving towns there, and that wars and raids later emptied it. He gives about twelve days of travel from it toward Sila {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  es: "Una ciudad en la tierra de Qamnuriyya. El autor dice que alguna vez fue una de las dos ciudades prósperas de la región, y que las guerras y las incursiones la despoblaron posteriormente. Indica que el viaje desde allí hacia Sila dura aproximadamente doce días {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  fr: "Une ville du pays de Qamnuriyya. L'auteur indique qu'elle fut jadis l'une des deux villes prospères de la région, et que les guerres et les raids l'ont ensuite vidée de ses habitants. Il mentionne environ douze jours de voyage depuis cette ville en direction de Sila {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  ur: "قمنوریہ کی سرزمین کا ایک قصبہ۔ مصنف کا کہنا ہے کہ یہ کبھی وہاں کے دو ترقی پذیر شہروں میں سے ایک تھا، اور بعد میں جنگوں اور چھاپوں نے اسے خالی کر دیا۔ وہ اس سے سیلا کی طرف تقریباً بارہ دن کا سفر بتاتا ہے۔ 105}، {حوالہ: نزہت المشتاق-2002 ص۔ 106}۔"
  tr: "Bir zamanlar geçmişte iki zengin şehirden biri olan Qamanuriyya topraklarından bir şehir, daha sonra çatışmalar ve baskınlarla yok olmuştur. Yazar, oradan Sele'ye giden yolun yaklaşık on iki gün sürdüğünü bildirmektedir {cite:Nuzhat-al-Mushtaq-2002 s. 105}, {cite:Nuzhat-al-Mushtaq-2002 s. 106}."
  id: "Sebuah kota dari tanah Qamanuriyya, yang dulunya merupakan salah satu dari dua kota makmur di masa lalu, kemudian dihancurkan oleh konflik dan serangan. Penulis melaporkan bahwa rute dari sana ke Sele memakan waktu sekitar dua belas hari {cite:Nuzhat-al-Mushtaq-2002 hlm. 105}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 106}."
