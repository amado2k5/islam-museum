summary:
  ar: "بلدة صغيرة على ساحل البحر المتوسط، شرق الإسكندرية بنحو خمسة عشر ميلًا؛ اشتهرت بالمعارك البحرية قرب شاطئها سنتي 1798 و1801، وجُففت بحيرتها بعد 1887."
  en: "A small town on the Mediterranean coast about fifteen miles east of Alexandria, known for the naval battles off its shore in 1798 and 1801; its lake was drained after 1887 {cite:encyclopaedia-of-islam-2 vol. 1 p. 187}."
  es: "Un pequeño pueblo en la costa mediterránea a unas quince millas al este de Alejandría, conocido por las batallas navales frente a sus costas en 1798 y 1801; su lago fue desecado después de 1887 {cite:encyclopaedia-of-islam-2 vol. 1 p. 187}."
  fr: "Une petite ville sur la côte méditerranéenne à une quinzaine de kilomètres à l'est d'Alexandrie, connue pour les batailles navales qui se sont déroulées au large de ses côtes en 1798 et 1801; son lac a été asséché après 1887 {cite:encyclopaedia-of-islam-2 vol. 1 p. 187}."
  ur: "اسکندریہ سے تقریباً پندرہ میل مشرق میں بحیرہ روم کے ساحل پر ایک چھوٹا سا قصبہ، جو 1798 اور 1801 میں اپنے ساحل پر بحری جنگوں کے لیے جانا جاتا ہے۔ اس کی جھیل 1887 کے بعد بہہ گئی تھی۔ 1 ص۔ 187}۔"
