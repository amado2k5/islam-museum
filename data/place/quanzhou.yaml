summary:
  ar: "ميناء في جنوب شرق الصين أقام فيه تجار مسلمون في العصور الوسطى، وفيه مسجد قديم يعود إلى سنة 1009م. وقد يراد بها خانقو مدينة التجار والأموال التي طولها أربعون فرسخا في أخبار أبي دلف عن الصين {cite:fihrist-ibn-al-nadim p. 492} ويصف ابن بطوطة مدينة الزيتون أول ما وصلها من بلاد الصين، ويقول إنها ليست بها زيتون ولا في جميع بلاد أهل الصين والهند وإنما هو اسم وضع عليها، وإنها مدينة عظيمة تصنع بها ثياب الكمخا والأطلس ومرساها من أعظم مراسي الدنيا، ويذكر أن للمسلمين بها سكناً على حدة ترجع أمورهم إلى قاضٍ وشيخ إسلام {cite:rihla-ibn-battuta-1958 p. 163-164}"
  en: A port in southeastern China where Muslim merchants resided in the Middle Ages; it holds an old mosque dating to 1009 CE. Ibn Battuta calls the first Chinese city he reached al-Zaytun and says the name is not from olives — none grow in China or India — but was simply given to it; he calls it a great city where kamkha and atlas cloths are made, its roadstead among the greatest in the world, with a Muslim quarter whose affairs return to a qadi and a shaykh al-Islam {cite:rihla-ibn-battuta-1958 p. 163-164}
  es: "Un puerto en el sureste de China donde residían comerciantes musulmanes en la Edad Media; alberga una antigua mezquita que data del año 1009 d. C. Ibn Battuta llama a la primera ciudad china a la que llegó al-Zaytun y dice que el nombre no proviene de las aceitunas —ninguna crece en China ni en la India— sino que simplemente se le dio; la describe como una gran ciudad donde se fabricaban telas kamkha y atlas, con una rada entre las más importantes del mundo, y un barrio musulmán cuyos asuntos dependían de un cadí y un jeque al-Islam {cite:rihla-ibn-battuta-1958 p. 163-164}"
  fr: "Port du sud-est de la Chine où résidaient des marchands musulmans au Moyen Âge, il abrite une ancienne mosquée datant de 1009. Ibn Battuta nomme la première ville chinoise qu'il atteignit al-Zaytun et précise que ce nom ne provient pas des olives – aucune n'en pousse en Chine ni en Inde – mais lui a simplement été attribué. Il la décrit comme une grande ville où l'on fabrique des tissus kamkha et atlas, dont la rade compte parmi les plus grandes du monde, et dont le quartier musulman est administré par un cadi et un cheikh al-Islam. {cite:rihla-ibn-battuta-1958 p. 163-164}"
  ur: "جنوب مشرقی چین میں ایک بندرگاہ جہاں مسلمان تاجر قرون وسطی میں مقیم تھے۔ اس میں 1009 عیسوی کی ایک پرانی مسجد ہے۔ ابن بطوطہ نے پہلا چینی شہر بتایا جس کو وہ الزیتون پہنچا اور کہتا ہے کہ یہ نام زیتون سے نہیں ہے - چین یا ہندوستان میں کوئی نہیں اگتا ہے - بلکہ اسے صرف دیا گیا تھا۔ وہ اسے ایک عظیم شہر کہتا ہے جہاں کامخا اور اٹلس کے کپڑے بنتے ہیں، اس کا روڈ سٹیڈ دنیا میں سب سے بڑا شہر ہے، ایک مسلم چوتھائی ہے جس کے معاملات ایک قاضی اور شیخ الاسلام کی طرف لوٹتے ہیں۔ 163-164}"
  tr: "Orta Çağ'da Müslüman tüccarların yerleştiği güneydoğu Çin'de bir liman ve 1009 yılına tarihlenen eski bir cami barındırır. Ayrıca, Abu Dulf'un Çin'deki Akhbar'ında kırk farsakh uzanan tüccar ve zenginlik şehri Khangu'ya da atıfta bulunabilir {cite:fihrist-ibn-al-nadim s. 492}. İbn Battuta, zeytin şehrini Çin'den gelen ilk şehir olarak tanımlar; zeytin olmadığını, Çin ve Hindistan'ın tüm topraklarında bulunmadığını, ona verilen bir isim olduğunu belirtir. Kamkha ve atlas giysilerinin yapıldığı büyük bir şehirdir ve demirleme yeri dünyanın en büyük limanlarından biridir. Müslümanların burada ayrı ikametgahları olduğu ve bir yargıç ile İslami bir şeyhin olduğu belirtilir {cite:rihla-ibn-battuta-1958, s. 163-164}"
  id: "Sebuah pelabuhan di tenggara Tiongkok tempat para pedagang Muslim menetap pada Abad Pertengahan, dan memiliki sebuah masjid tua yang berasal dari tahun 1009 M. Mungkin juga merujuk pada Khangu, kota para pedagang dan kekayaan, yang membentang empat puluh farsakh di Akhbar karya Abu Dulf di Tiongkok {cite:fihrist-ibn-al-nadim hlm. 492}. Ibn Battuta menggambarkan kota zaitun sebagai yang pertama tiba dari Tiongkok, mengatakan bahwa kota itu tidak memiliki zaitun dan tidak ditemukan di semua negeri di Tiongkok dan India, melainkan nama yang diberikan padanya. Ini adalah kota besar tempat pakaian kamkha dan atlas dibuat, dan tempat berlabuhnya adalah salah satu pelabuhan terbesar di dunia. Disebutkan bahwa Muslim memiliki tempat tinggal terpisah di sana, dengan hal-hal yang berkaitan dengan seorang hakim dan seorang sheikh Islam {cite:rihla-ibn-battuta-1958, hlm. 163-164}"
