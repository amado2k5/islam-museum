summary:
  ar: "ميناء في جنوب شرق الصين أقام فيه تجار مسلمون في العصور الوسطى، وفيه مسجد قديم يعود إلى سنة 1009م. وقد يراد بها خانقو مدينة التجار والأموال التي طولها أربعون فرسخا في أخبار أبي دلف عن الصين {cite:fihrist-ibn-al-nadim p. 492} ويصف ابن بطوطة مدينة الزيتون أول ما وصلها من بلاد الصين، ويقول إنها ليست بها زيتون ولا في جميع بلاد أهل الصين والهند وإنما هو اسم وضع عليها، وإنها مدينة عظيمة تصنع بها ثياب الكمخا والأطلس ومرساها من أعظم مراسي الدنيا، ويذكر أن للمسلمين بها سكناً على حدة ترجع أمورهم إلى قاضٍ وشيخ إسلام {cite:rihla-ibn-battuta-1958 p. 163-164}"
  en: A port in southeastern China where Muslim merchants resided in the Middle Ages; it holds an old mosque dating to 1009 CE. Ibn Battuta calls the first Chinese city he reached al-Zaytun and says the name is not from olives — none grow in China or India — but was simply given to it; he calls it a great city where kamkha and atlas cloths are made, its roadstead among the greatest in the world, with a Muslim quarter whose affairs return to a qadi and a shaykh al-Islam {cite:rihla-ibn-battuta-1958 p. 163-164}
