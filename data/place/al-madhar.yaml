summary:
  ar: "بلدة من كور دجلة؛ أتاها عتبة بن غزوان فخرج إليه مرزبانها فقاتله فهزمه الله وغرق عامة من معه وأخذ سلماً فضرب عتبة عنقه."
  en: "A town of the Tigris districts; its marzban came out against Utba ibn Ghazwan, was routed with most of his men drowned, captured alive and beheaded."
  es: "Una ciudad de la región del Tigris; su marzban (jefe de aldea) salió en armas contra Utba ibn Ghazwan, fue derrotado y la mayoría de sus hombres se ahogaron, fueron capturados vivos y decapitados."
  fr: "Une ville des districts du Tigre; son marzban sortit contre Utba ibn Ghazwan, fut mis en déroute, la plupart de ses hommes se noyèrent, furent capturés vivants et décapités."
  ur: "دجلہ کے اضلاع کا ایک قصبہ؛ اس کا مرزبان عتبہ بن غزوان کے خلاف نکلا، اس کے اکثر آدمیوں کو غرق کر دیا گیا، زندہ پکڑ لیا گیا اور سر قلم کر دیا گیا۔"
  tr: "Dicle bölgesinde bir kasaba; Utbah bin Gazvan buraya geldi ve komutanları onunla savaşmak için dışarı çıktı. Tanrı onu yendi, halkının çoğunu boğdu, bir merdiven aldı ve Utbah'ın boynuna vurdu."
  id: "Sebuah kota di distrik Tigris; Utbah ibn Ghazwan datang ke sana, dan para komandannya keluar untuk melawannya. Tuhan mengalahkannya, menenggelamkan sebagian besar rakyatnya, mengambil tangga, dan memukul leher Utbah."
