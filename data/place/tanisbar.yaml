summary:
  ar: "مدينة حسنة كثيرة الخيرات على جنوب نهر تيسيا، ويذكر المؤلف أنها تبعد عن جرنغراتة أربع مراحل {cite:nuzhat-al-mushtaq-2002 p. 889}."
  en: "A fine city rich in produce on the south bank of the river Tisia; the author gives four stages from Jirnjarāta {cite:nuzhat-al-mushtaq-2002 p. 889}."
  es: "Una hermosa ciudad rica en productos agrícolas en la orilla sur del río Tisia; el autor da cuatro etapas desde Jirnjarāta {cite:nuzhat-al-mushtaq-2002 p. 889}."
  fr: "Une belle ville riche en produits agricoles sur la rive sud du fleuve Tisia; l'auteur donne quatre étapes depuis Jirnjarāta {cite:nuzhat-al-mushtaq-2002 p. 889}."
  ur: "دریائے تیسیا کے جنوبی کنارے پر پیداوار سے مالا مال ایک عمدہ شہر؛ مصنف نے جرنجرات سے چار مراحل بیان کیے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 889}۔"
  tr: "Tisia Nehri'nin güney yakasında bolca bol güzel bir şehir ve yazar, buranın Jarngrata'ya dört aşama uzaklıkta olduğunu belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 889}."
  id: "Sebuah kota indah yang penuh makna di sisi selatan Sungai Tisia, dan penulis menyebutkan bahwa kota ini berjarak empat tahap dari Jarngrata {cite:Nuzhat-al-Mushtaq-2002, hlm. 889}."
