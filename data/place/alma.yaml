  ar: "مدينة كبيرة متحضرة لها أسواق عامرة، تبعد عن بزلة جنوبا ستين ميلا، ويذكر المؤلف أنها من مدن صوابة {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
