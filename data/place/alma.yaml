  es: "Una ciudad grande y civilizada con mercados bulliciosos, sesenta millas al sur de Bazla, y una de las ciudades de la región de Ṣawāba {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  fr: "Une grande ville civilisée avec des marchés animés, à soixante miles au sud de Bazla, et l'une des villes de la région de Ṣawāba {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  ur: "ایک بڑا، مہذب شہر جس میں مصروف بازار ہیں، بزلہ سے ساٹھ میل جنوب میں، اور صوابہ کے علاقے کے شہروں میں سے ایک۔ 874} {حوالہ: نزہت المشتاق-2002 ص۔ 875}۔"
