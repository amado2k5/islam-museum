summary:
  ar: "بلد جليل وقطر نبيل، كثير الخيرات والعسل واللبن، أسعاره رخيصة، وعلى نهرها قنطرة كبيرة حسنة، وهي من مدن مقذونية {cite:nuzhat-al-mushtaq-2002 p. 893}."
  en: "A noble, fine city and land, rich in produce, honey and milk, with cheap prices and a large bridge over its river; one of the cities of Maqdūniya {cite:nuzhat-al-mushtaq-2002 p. 893}."
  es: "Una ciudad y tierra noble y hermosa, rica en productos agrícolas, miel y leche, con precios baratos y un gran puente sobre su río; una de las ciudades de Maqdūniya {cite:nuzhat-al-mushtaq-2002 p. 893}."
  fr: "Une ville et une terre nobles et belles, riches en produits agricoles, en miel et en lait, avec des prix bas et un grand pont sur sa rivière; une des villes de Maqdūniya {cite:nuzhat-al-mushtaq-2002 p. 893}."
  ur: "ایک عمدہ، عمدہ شہر اور زمین، پیداوار، شہد اور دودھ سے مالا مال، سستے داموں اور اس کے دریا پر ایک بڑا پل۔ مقدونیہ کے شہروں میں سے ایک {حوالہ: نزہت المشتاق-2002 ص 893}۔"
