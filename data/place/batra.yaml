summary:
  ar: "جبل معترض في أرض الخزر من الشمال إلى الجنوب، وفيه معادن فضة ومعادن رصاص جيد يستخرج منها الكثير {cite:nuzhat-al-mushtaq-2002 p. 920}."
  en: "A mountain range across Khazar land running north to south, with silver and good lead deposits from which much is extracted {cite:nuzhat-al-mushtaq-2002 p. 920}."
  es: "Una cadena montañosa que atraviesa la tierra jázara de norte a sur, con yacimientos de plata y plomo de los que se extrae mucho {cite:nuzhat-al-mushtaq-2002 p. 920}."
  fr: "Une chaîne de montagnes traversant le pays Khazar s'étendant du nord au sud, avec des gisements d'argent et de plomb de bonne qualité dont une grande quantité est extraite {cite:nuzhat-al-mushtaq-2002 p. 920}."
  ur: "خزر زمین کے پار ایک پہاڑی سلسلہ شمال سے جنوب تک چلتا ہے، جس میں چاندی اور سیسے کے اچھے ذخائر ہیں جہاں سے بہت کچھ نکالا جاتا ہے۔ 920}۔"
  tr: "Kuzeyden güneye doğru Hazar topraklarında yer alan Ma'atid Dağı, gümüş ve iyi kurşun mineralleri içerir ve bunlardan birçoğu çıkarılmıştır {atıf:Nuzhat-al-Mushtaq-2002, s. 920}."
  id: "Gunung Ma'atid di tanah Khazar dari utara ke selatan, mengandung perak dan mineral timbal yang baik dari mana banyak yang diekstraksi {cite:Nuzhat-al-Mushtaq-2002, hlm. 920}."
