label: { ar: "مدينة الصفر", en: "The City of Brass" }
summary:
  ar: "مدينة الصفر وقبة الرصاص التي بمفاوز الأندلس، وما كان من خبر الملوك السالفة فيها وتعذر الوصول إليها، ثم ما كان من أمر صاحب عبد الملك بن مروان في نزوله عليها وما تهافت فيه المسلمون عند الطلوع على سورها وإخبارهم عن أنفسهم أنهم وصلوا إلى نعيم الدنيا والآخرة، وقيل إن أسوارها من الصفر على ساحل البحر الحبشي في أطراف مفاوز الهند وما يجري من وادي الرمل نحوها {cite:muruj-al-dhahab p. 557}."
  en: "The brass-walled city and leaden dome in the wastes of al-Andalus — unreachable by the old kings — whose wall Abd al-Malik's envoy's Muslims swarmed, crying they had won the bliss of both worlds; a variant sets it on the Abyssinian sea at India's far end past the river of sand {cite:muruj-al-dhahab p. 557}."
