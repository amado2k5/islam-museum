label: { ar: "مدينة الصفر", en: "The City of Brass", es: "La Ciudad de Bronce", fr: "La Cité du Laiton", ur: "پیتل کا شہر", tr: "Sıfır Şehri", id: "Kota Nol" }
summary:
  ar: "مدينة الصفر وقبة الرصاص التي بمفاوز الأندلس، وما كان من خبر الملوك السالفة فيها وتعذر الوصول إليها، ثم ما كان من أمر صاحب عبد الملك بن مروان في نزوله عليها وما تهافت فيه المسلمون عند الطلوع على سورها وإخبارهم عن أنفسهم أنهم وصلوا إلى نعيم الدنيا والآخرة، وقيل إن أسوارها من الصفر على ساحل البحر الحبشي في أطراف مفاوز الهند وما يجري من وادي الرمل نحوها {cite:muruj-al-dhahab p. 557}."
  en: "The brass-walled city and leaden dome in the wastes of al-Andalus — unreachable by the old kings — whose wall Abd al-Malik's envoy's Muslims swarmed, crying they had won the bliss of both worlds; a variant sets it on the Abyssinian sea at India's far end past the river of sand {cite:muruj-al-dhahab p. 557}."
  es: "La ciudad de muros de bronce y cúpula de plomo en los desiertos de al-Ándalus —inaccesible para los antiguos reyes— cuyo muro los musulmanes del enviado de Abd al-Malik asaltaron, clamando que habían ganado la dicha de ambos mundos; una variante la sitúa en el mar de Abisinia, en el extremo más alejado de la India, más allá del río de arena {cite:muruj-al-dhahab p. 557}."
  fr: "La ville aux murs de bronze et au dôme de plomb dans les déserts d'al-Andalus — inaccessible aux anciens rois — dont les murs furent envahis par les musulmans envoyés par Abd al-Malik, criant qu'ils avaient gagné le bonheur des deux mondes; une variante la situe sur la mer d'Abyssinie à l'extrémité de l'Inde, au-delà du fleuve de sable {cite:muruj-al-dhahab p. 557}."
  ur: "اندلس کے کچرے میں پیتل کی دیواروں والا شہر اور سیسہ پلائی ہوئی گنبد - پرانے بادشاہوں کی پہنچ سے باہر - جس کی دیوار پر عبد الملک کے ایلچی کے مسلمان روتے ہوئے رو رہے تھے کہ انہوں نے دونوں جہانوں کی نعمتیں جیت لی ہیں۔ ایک قسم اسے حبشہ کے سمندر پر ہندوستان کے دور سرے پر ریت کے دریا سے گزرتی ہے۔ 557}۔"
  tr: "Endülüs'teki Mafuz'daki Safr şehri ve Kurşun Kubbe, oraya ulaşamayan önceki kralların haberleri, ardından Abdülmalik ibn Mervan'ın yoldaşının ona inmesi ve Müslümanların surlarına tırmanmak için koşup kendilerine bu dünyanın ve ahiretin mutluluğuna ulaştıklarını söylemeleri. Surlarının, Hindistan'ın Mafaz şehrinin dışındaki Habeşistan Denizi kıyısındaki Safar'dan ve ona doğru akan Vadi el-Raml'dan geldiği söylenir {cite:muruj-al-dhahab s. 557}."
  id: "Kota Safr dan Kubah Timbal di Mafuz, Andalusia, serta kabar tentang raja-raja sebelumnya yang tidak dapat mencapainya, lalu perintah sahabat Abd al-Malik ibn Marwan untuk turun ke sana, dan umat Muslim bergegas memanjat temboknya sambil berkata pada diri mereka bahwa mereka telah mencapai kebahagiaan dunia ini dan akhirat. Dikatakan bahwa temboknya berasal dari Safar di pesisir Laut Abyssinia di pinggiran Mafaz, India, dan Wadi al-Raml yang mengalir ke arahnya {cite:muruj-al-dhahab hlm. 557}."
