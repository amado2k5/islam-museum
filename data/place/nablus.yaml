summary:
  ar: مدينة السامرية، وفيها البئر التي يذكر أهل بيت المقدس أن عيسى جلس عندها وطلب الماء من المرأة السامرية، وتبعد عن الرملة يوماً. {cite:nuzhat-al-mushtaq-2002 p. 356} ووصفها المقدسي بأنها تسمّى دمشق الصغرى، كثيرة الزيتون في وادٍ ضغطه جبلان، سوقها من الباب إلى الباب وجامعها وسطها مبلّطة نظيفة ولأهلها دواميس عجيبة {cite:ahsan-al-taqasim p. 142}.
  en: The city of the Samaritans, with the well where, as the people of Jerusalem say, a visitor asked a Samaritan woman for water; a day from Ramla. {cite:nuzhat-al-mushtaq-2002 p. 356}
  ur: فلسطین کا شہر جسے مقدسی نے چھوٹا دمشق کہا؛ ان کے بیان میں یہ دو پہاڑوں کے درمیان وادی میں زیتون کی کثرت والا شہر ہے، جس کی جامع مسجد بازار کے وسط میں تھی۔ {cite:ahsan-al-taqasim p. 142}
  es: "La ciudad de los samaritanos, con el pozo donde, según cuentan los habitantes de Jerusalén, un visitante pidió agua a una mujer samaritana; a un día de Ramla. {cite:nuzhat-al-mushtaq-2002 p. 356}"
  fr: "La ville des Samaritains, avec le puits où, selon les habitants de Jérusalem, un visiteur demanda de l'eau à une Samaritaine; à une journée de Ramla. {cite:nuzhat-al-mushtaq-2002 p. 356}"
  tr: "Samirye şehri ve Kudüs halkının İsa'nın oturup Samiriyeli kadından su istediğini belirttiği kuyunun bulunduğu ve Ramla'dan bir gün uzaklıkta olduğunu belirtir. {atıf:Nuzhat-al-Mushtaq-2002, s. 356} Al-Maqdisi, burayı zeytinlerle zengin, iki dağla sıkışmış bir vadide Küçük Şam olarak tanımlamıştır. Pazarı kapı kapı, camisi döşeli ve temizdir, halkı muhteşem duvarlara sahiptir {cite:ahsan-al-taqasim, s. 142}."
  id: "Kota Samaria, dan di sana terdapat sumur tempat orang-orang Yerusalem menyebutkan bahwa Yesus duduk dan meminta air kepada wanita Samaria, dan kota itu hanya sehari lagi dari Ramla. {cite:Nuzhat-al-Mushtaq-2002, hlm. 356} Al-Maqdisi menggambarkannya sebagai Damaskus Kecil, kaya zaitun di sebuah lembah yang dipadatkan oleh dua gunung. Pasarnya dari pintu ke pintu, masjidnya beraspal dan bersih, dan penduduknya memiliki tembok yang menakjubkan {cite:ahsan-al-taqasim, hlm. 142}."
