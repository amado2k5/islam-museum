summary:
  ar: "مدينة السامرية، وفيها البئر التي يذكر أهل بيت المقدس أن عيسى جلس عندها وطلب الماء من المرأة السامرية، وتبعد عن الرملة يوماً. {cite:nuzhat-al-mushtaq-2002 p. 356} ووصفها المقدسي بأنها تسمّى دمشق الصغرى، كثيرة الزيتون في وادٍ ضغطه جبلان، سوقها من الباب إلى الباب وجامعها وسطها مبلّطة نظيفة ولأهلها دواميس عجيبة {cite:ahsan-al-taqasim p. 142}."
  en: "The city of the Samaritans, with the well where, as the people of Jerusalem say, a visitor asked a Samaritan woman for water; a day from Ramla. {cite:nuzhat-al-mushtaq-2002 p. 356}"
  ur: "فلسطین کا شہر جسے مقدسی نے چھوٹا دمشق کہا؛ ان کے بیان میں یہ دو پہاڑوں کے درمیان وادی میں زیتون کی کثرت والا شہر ہے، جس کی جامع مسجد بازار کے وسط میں تھی۔ {cite:ahsan-al-taqasim p. 142}"
