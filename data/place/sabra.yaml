summary:
  ar: "مدينة كانت دار الملك، وفيها قصور وديار، والآن هي خراب لا يُرجى جبرها، ولا ساكن فيها. {cite:nuzhat-al-mushtaq-2002 p. 284} وأما المقدسي فيذكرها عامرة إذ رآها: بناها الفاطمي أول ما ملك الإقليم واشتق اسمها من صبر عسكره في الحرب، مدورة مثل الكأس ودار السلطان وسطها على عمل مدينة السلام والماء يجري وسطها، عرض سورها اثنا عشر ذراعاً، وأبوابها باب الفتوح وباب زويلة وباب وادي القصارين وتجارها يغدون من المصر على حمير مصرية {cite:ahsan-al-taqasim p. 181}."
  en: "A city that was once a royal seat with palaces and houses; now in ruin with no hope of repair and no residents. {cite:nuzhat-al-mushtaq-2002 p. 284}"
  es: "Una ciudad que antaño fue sede real, con palacios y residencias; ahora en ruinas, sin esperanza de reparación y sin habitantes. {cite:nuzhat-al-mushtaq-2002 p. 284}"
  fr: "Une ville qui fut jadis une résidence royale, avec ses palais et ses demeures; aujourd'hui en ruines, sans espoir de restauration et sans habitants. {cite:nuzhat-al-mushtaq-2002 p. 284}"
  ur: "ایک شہر جو کبھی محلات اور مکانات پر مشتمل شاہی نشست تھا۔ اب مرمت کی کوئی امید اور رہائشیوں کے ساتھ تباہ حال۔ {حوالہ: نزہت المشتاق-2002 ص۔ 284}"
  tr: "Bir zamanlar kralın evi olan, sarayları ve evleri olan bir şehir, şimdi ise onarılamayan bir harabe haline gelmiş ve kimse orada yaşamıyor. {cit:Nuzhat-al-Mushtaq-2002, s. 284} al-Maqdisi'ye gelince, gördüğü gibi geliştiğini belirtir: Fatımiler, bölgeyi ilk yönettiğinde inşa etmişlerdir ve adı, savaşta ordusunun sabrından gelmektedir; bir kadeh gibi yuvarlaktır ve ortasındaki Sultan'ın evi Barış Şehri gibi, içinden su akmaktadır. Duvarları on iki arşin genişliğindedir ve kapıları Bab al-Futuh, Bab Zuweila ve Bab Wadi al-Qassarin'dir. Tüccarları Mısır'dan Mısırlı eşeklere gelir {cite:ahsan-al-taqasim, s. 181}."
  id: "Sebuah kota yang dulunya adalah rumah raja, dengan istana dan rumah, tetapi kini menjadi reruntuhan yang tidak bisa diperbaiki, dan tidak ada yang tinggal di sana. {cite:Nuzhat-al-Mushtaq-2002, hlm. 284} Adapun al-Maqdisi, ia menyebutkan kota itu berkembang seperti yang ia lihat: Fatimiyah membangunnya saat ia pertama kali memerintah wilayah tersebut, dan namanya berasal dari kesabaran pasukannya dalam perang, bulat seperti cangkir, dan rumah Sultan di tengahnya seperti Kota Damai, dengan air mengalir melaluinya. Temboknya selebar dua belas hasta, dan gerbangnya adalah Bab al-Futuh, Bab Zuweila, dan Bab Wadi al-Qassarin. Para pedagangnya berasal dari Mesir ke keledai Mesir {cite:ahsan-al-taqasim, hlm. 181}."
