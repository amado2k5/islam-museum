summary:
  ar: "مدينة كانت دار الملك، وفيها قصور وديار، والآن هي خراب لا يُرجى جبرها، ولا ساكن فيها. {cite:nuzhat-al-mushtaq-2002 p. 284} وأما المقدسي فيذكرها عامرة إذ رآها: بناها الفاطمي أول ما ملك الإقليم واشتق اسمها من صبر عسكره في الحرب، مدورة مثل الكأس ودار السلطان وسطها على عمل مدينة السلام والماء يجري وسطها، عرض سورها اثنا عشر ذراعاً، وأبوابها باب الفتوح وباب زويلة وباب وادي القصارين وتجارها يغدون من المصر على حمير مصرية {cite:ahsan-al-taqasim p. 181}."
  en: "A city that was once a royal seat with palaces and houses; now in ruin with no hope of repair and no residents. {cite:nuzhat-al-mushtaq-2002 p. 284}"
