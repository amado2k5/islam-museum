  ur: "بہت سے خوشحال لوگوں کے ساتھ اچھے سائز کا ایک قصبہ، جو اپنے ضلع کی بہترین فصل زعفران کے لیے جانا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 490}"
