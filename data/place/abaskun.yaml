summary:
  ar: "مدينة حسنة صالحة، يركب إليها من آبسكون إلى الأبواب والجيل والديلم، وتقع على حدود طبرستان. {cite:nuzhat-al-mushtaq-2002 p. 688}"
  en: "A fine, well-settled town from which the road runs to the Gates, the Jil and Daylam, on the edge of Tabaristan. {cite:nuzhat-al-mushtaq-2002 p. 688}"
  es: "Una ciudad hermosa y bien establecida desde donde parte el camino hacia las Puertas, el Jil y Daylam, en los límites de Tabaristán. {cite:nuzhat-al-mushtaq-2002 p. 688}"
  fr: "Une belle ville bien établie, d'où part la route menant aux Portes, au Jil et à Daylam, à la lisière du Tabaristan. {cite:nuzhat-al-mushtaq-2002 p. 688}"
  ur: "ایک عمدہ، آباد بستی جہاں سے سڑک طبرستان کے کنارے پر گیٹس، جل اور دیلام تک جاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 688}"
  tr: "Abskun'dan Al-Abbab, Al-Jil ve Daylam'a seyahat edilebilen iyi ve doğru bir şehirdir ve Tabaristan sınırında yer alır. {kaynak:nuzhat-al-mushtaq-2002 s. 688}"
  id: "Sebuah kota yang baik dan benar, yang dapat dikunjungi dari Abskun ke Al-Abbab, Al-Jil, dan Daylam, dan terletak di perbatasan Tabaristan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 688}"
