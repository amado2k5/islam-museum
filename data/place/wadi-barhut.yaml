summary:
  ar: "أطمة من بلاد حضرموت وبلاد الشحر ذكرها المسعودي في جملة آطام الأرض، والأطمة عين النار التي تنبع من الأرض {cite:muruj-al-dhahab p. 357-358}. وعند ابن فضل الله العمري أن بئر برهوت ببلاد حضرموت لم يُعرف عمقه ولا عُلم أن إنساناً نزله {cite:umari-masalik-1924 p. 233}."
  en: "A fire-vent of Hadramawt and the Shihr lands, named among the earth's atmas — springs of fire welling from the ground {cite:muruj-al-dhahab p. 357-358}."
  es: "Un respiradero de fuego de Hadramawt y las tierras de Shihr, nombrado entre los atmas de la tierra: manantiales de fuego que brotan del suelo {cite:muruj-al-dhahab p. 357-358}."
  fr: "Un évent de feu du Hadramawt et des terres de Shihr, nommé parmi les atmas de la terre — sources de feu jaillissant du sol {cite:muruj-al-dhahab p. 357-358}."
  ur: "حضرموت اور شحر سرزمین کا ایک آگ کا راستہ، جس کا نام زمین کے اتمس میں رکھا گیا ہے - زمین سے آگ کے چشمے نکلتے ہیں {حوالہ: مروج الذہب ص۔ 357-358}۔"
  tr: "Hadramaut topraklarından ve El-Şehr topraklarından Atma, Al-Mas'udi tarafından yeryüzünün 'Atma'ları (dünyevi nesneler) arasında anılmıştır ve 'Atmah' yeryüzünden çıkan ateştir {atıf:Muruj-al-Dhahab s. 357-358}. İbn Fadlallah Al-Omari'ye göre, Hadramaut'taki Barhout kuyusu derinliği bilinmemekte ve bir insanın ondan indiği bilinmemektedir {cite:umari-masalik-1924, s. 233}."
  id: "Atma dari tanah Hadramaut dan tanah Al-Shahr disebutkan oleh Al-Mas'udi di antara 'Atma' (benda duniawi) bumi, dan 'Atmah' adalah api yang muncul dari bumi {cite:Muruj-al-Dhahab hlm. 357-358}. Menurut Ibn Fadlallah Al-Omari, sumur Barhout di Hadramaut tidak diketahui kedalamannya dan tidak diketahui bahwa manusia pernah turun {cite:umari-masalik-1924, hlm. 233}."
