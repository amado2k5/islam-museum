summary:
  ar: "المنصورة مدينة بالسند دون البحيرة؛ بناها عمرو بن محمد بن القاسم لما ظفر أمره وهي التي ينزلها العمال اليوم وكان موضعها قبل غيضة قرب برهمباذ العتيقة."
  en: "al-Mansura of Sind below the lake; built by Amr ibn Muhammad ibn al-Qasim on his victory — the governors' seat, once mere thicket near old Brahmanabadh."
  es: "Al-Mansura de Sind, al sur del lago; construida por Amr ibn Muhammad ibn al-Qasim tras su victoria; la sede del gobernador, que antaño era un simple matorral cerca de la antigua Brahmanabadh."
  fr: "al-Mansura du Sind en dessous du lac; construit par Amr ibn Muhammad ibn al-Qasim à l'occasion de sa victoire — le siège des gouverneurs, autrefois simple fourré près du vieux Brahmanabadh."
  ur: "جھیل کے نیچے سندھ کا المنصورہ؛ عمرو بن محمد بن القاسم نے اپنی فتح پر تعمیر کیا - گورنروں کی نشست، جو کبھی پرانے برہمن آباد کے قریب محض جھاڑی تھی۔"
  tr: "Mansura, Sind'de göl olmayan bir şehirdir; Amr ibn Muhammed ibn al-Kasim tarafından inşa edilmiştir ve bugün işçilerin yaşadığı yerdir. Konumu Ghaydah'dan önce, eski Barhambadh yakınlarındadır."
  id: "Mansura adalah sebuah kota di Sind tanpa danau; kota ini dibangun oleh Amr ibn Muhammad ibn al-Qasim saat ia mewarisi, dan di sinilah para pekerja tinggal saat ini. Lokasinya sebelum Ghaydah dekat Barhambadh lama."
