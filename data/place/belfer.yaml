summary:
  ar: "مدينة متحضرة على البحر الملح، ممكنة، فيها مصايد للحوت ومعايش وأقوات كثيرة، ومراكبها تسافر إلى شنت ياقوب، وتبعد عن شنت جوان نحو سبعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 855}"
  en: "A civilised city on the salt sea, well-provisioned, with fisheries for tuna and many livelihoods; its boats sail to Shant Yaqub; about seventy miles from Shant Juan. {cite:nuzhat-al-mushtaq-2002 p. 855}"
  es: "Una ciudad civilizada a orillas del mar, bien abastecida, con pesquerías de atún y numerosos medios de subsistencia; sus barcos navegan hasta Shant Yaqub, a unos setenta kilómetros de Shant Juan. {cite:nuzhat-al-mushtaq-2002 p. 855}"
  fr: "Une ville civilisée au bord de la mer salée, bien approvisionnée, avec des pêcheries de thon et de nombreuses sources de revenus; ses bateaux naviguent jusqu’à Shant Yaqub, à environ soixante-dix milles de Shant Juan. {cite:nuzhat-al-mushtaq-2002 p. 855}"
  ur: "نمکین سمندر پر ایک مہذب شہر، اچھی طرح سے فراہم کردہ، ٹونا کے لئے ماہی گیری اور بہت سے ذریعہ معاش کے ساتھ؛ اس کی کشتیاں شانت یعقوب کی طرف چلتی ہیں۔ شانت جوآن سے تقریباً ستر میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 855}"
  tr: "Tuzlu deniz kıyısında, balina balıkçılığı, bol geçim kaynakları ve yiyecek ile medeni bir şehir olabilir ve tekneleri Chant Yacoub'a, Chant Jouan'a yaklaşık yetmiş mil uzaklıktaki Chant Yacoub'a gider. {cite:nuzhat-al-mushtaq-2002 s. 855}"
  id: "Kota yang beradab di tepi laut asin, mungkin, dengan perikanan paus dan mata pencaharian serta makanan yang melimpah, dan kapal-kapalnya berlayar ke Chant Yacoub, sekitar tujuh puluh mil dari Chant Jouan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 855}"
