summary:
  ar: "مدينة متحضرة متوسطة القدر، ويذكر المؤلف أنها تبعد غربا ثلاثين ميلا في البر عن برنس {cite:nuzhat-al-mushtaq-2002 p. 897} {cite:nuzhat-al-mushtaq-2002 p. 898}."
  en: "A civilised city of middling size; the author gives thirty miles west by land from Burnus {cite:nuzhat-al-mushtaq-2002 p. 897} {cite:nuzhat-al-mushtaq-2002 p. 898}."
  es: "Una ciudad civilizada de tamaño mediano; el autor indica treinta millas al oeste por tierra desde Burnus {cite:nuzhat-al-mushtaq-2002 p. 897} {cite:nuzhat-al-mushtaq-2002 p. 898}."
  fr: "Une ville civilisée de taille moyenne; l'auteur indique trente miles à l'ouest par voie terrestre de Burnus {cite:nuzhat-al-mushtaq-2002 p. 897} {cite:nuzhat-al-mushtaq-2002 p. 898}."
  ur: "متوسط سائز کا ایک مہذب شہر؛ مصنف نے برنس سے زمین کے ذریعے تیس میل مغرب کی سمت بتائی ہے۔ 897} {حوالہ: نزہت المشتاق-2002 ص۔ 898}۔"
  tr: "Orta düzeyde medeni bir şehir olan yazar, Prens'in karadan otuz mil batısında olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 897} {cite:Nuzhat-al-Mushtaq-2002 s. 898}."
  id: "Sebuah kota yang cukup beradab, penulis menyebutkan bahwa kota ini berjarak tiga puluh mil ke barat melalui daratan dari Prince {cite:Nuzhat-al-Mushtaq-2002 hlm. 897} {cite:Nuzhat-al-Mushtaq-2002 hlm. 898}."
