summary:
  ar: "مدينة في جبل الديلم؛ عند البلاذري أسلم الأساورة المقيمون بإزاء الديلم حين غشيهم المسلمون بقزوين على مثل ما أسلم عليه أساورة البصرة."
  en: "City in the Daylam mountain country; in al-Baladhuri the asawira living opposite Daylam converted when the Muslims came to Qazwin, on the terms of Basra's asawira."
  es: "Ciudad en la región montañosa de Daylam; en al-Baladhuri, los asawira que vivían frente a Daylam se convirtieron cuando los musulmanes llegaron a Qazwin, en los términos de los asawira de Basora."
  fr: "Ville située dans la région montagneuse de Daylam; à al-Baladhuri, les asawira vivant en face de Daylam se sont convertis lorsque les musulmans sont arrivés à Qazwin, selon les conditions des asawira de Bassora."
  ur: "دیلام پہاڑی ملک میں شہر؛ البلادوری میں دیلام کے سامنے رہنے والے اساویرہ نے اس وقت مذہب تبدیل کیا جب مسلمان بصرہ کے اساویرہ کی شرائط پر قزوین پہنچے۔"
  tr: "Cebel-Daylam'da bir şehir; el-Baladhuri'ye göre, Daylam'ın karşısındaki Aswara sakinleri, Hazar kabilesindeki Müslümanların onları Basra'daki Aswara ailesine benzer şekilde kandırmasıyla İslam'ı benimsemişlerdir."
  id: "Sebuah kota di Jabal al-Daylam; menurut al-Baladhuri, penduduk Aswara di seberang Daylam memeluk Islam ketika Muslim suku Kaspia menipu mereka dengan cara yang mirip dengan Aswara di Basra."
