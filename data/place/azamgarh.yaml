summary:
  ar: مدينة في ولاية أتار براديش الهندية، أسسها أعظم خان الأول سنة 1076هـ ⁦(1665م)⁩، وتعرضت لفيضانات متكررة، ومركزها اليوم دار المصنفين ⁦(شبلي)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 858}.
  en: A town in Uttar Pradesh, India, founded in 1076 AH (1665) by A'zam Khan I; it suffered repeated floods and is now the seat of the Dar al-Musannifin (Shibli Academy) {cite:encyclopaedia-of-islam-2 vol. 1 p. 858}.
  es: "Una ciudad en Uttar Pradesh, India, fundada en 1076 AH (1665) por A'zam Khan I; sufrió repetidas inundaciones y ahora es la sede de Dar al-Musannifin (Academia Shibli) {cite:encyclopaedia-of-islam-2 vol. 1 p. 858}."
  fr: "Une ville de l'Uttar Pradesh, en Inde, fondée en 1076 AH (1665) par A'zam Khan I; elle a subi des inondations répétées et est maintenant le siège du Dar al-Musannifin (Académie Shibli) {cite:encyclopaedia-of-islam-2 vol. 1 p. 858}."
  ur: "اتر پردیش، ہندوستان کا ایک قصبہ جس کی بنیاد اعظم خان اول نے 1076 ہجری (1665) میں رکھی تھی۔ اسے بار بار سیلاب کا سامنا کرنا پڑا اور اب یہ دارالمصنفین ⁦(شبلی اکیڈمی)⁩ کی نشست ہے۔ 1 ص۔ 858}۔"
