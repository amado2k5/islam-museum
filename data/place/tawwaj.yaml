summary:
  ar: "توج مدينة من أرض أردشير خرة بفارس؛ فتحها الحكم بن أبي العاص ويقال عثمان بن أبي العاص سنة ١٩ وبنى بها المساجد وجعلها داراً للمسلمين فأسكنها عبد القيس وكانت قاعدة الغزو على فارس ومصرت بعد مقتل شهرك."
  en: "Tawwaj of Ardashir-Khurra's land in Fars; opened by al-Hakam — or Uthman — ibn Abi al-As in 19h, its mosques built and Abd al-Qais settled in it as the Muslims' base for the Fars campaigns, fortified after Shahrak's death."
  es: "Tawwaj, tierra de Ardashir-Khurra en Fars; inaugurado por al-Hakam —o Uthman— ibn Abi al-As en el año 19h, sus mezquitas fueron construidas y Abd al-Qais se estableció allí como base de los musulmanes para las campañas de Fars, fortificada después de la muerte de Shahrak."
  fr: "Tawwaj du pays d'Ardashir-Khurra dans le Fars; ouvert par al-Hakam — ou Uthman — ibn Abi al-As en 19 h, ses mosquées construites et Abd al-Qais s'y installa comme base des musulmans pour les campagnes du Fars, fortifié après la mort de Shahrak."
