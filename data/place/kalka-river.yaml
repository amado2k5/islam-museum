label: { ar: "نهر قلقة", en: "Kalka River", es: "Río Kalka", fr: "Rivière Kalka", ur: "دریائے کالکا", tr: "Kalqa Nehri", id: "Sungai Qalqa" }
summary:
  ar: "نهر يصب في بحر آزوف قرب ماريوبول في بلاد الأفلاق الجنوبية؛ عنده كانت الملحمة الكبرى سنة عشرين وستمائة بين التتار وبين القفجاق والروس وقد ثبت الجمعان أياماً ثم انتصرت التتار وعلُوا أولئك بالسيف {cite:shadharat-dhahab p. 87}."
  en: "A river flowing into the Sea of Azov near Mariupol, in the southern lands of al-Aflaq. Beside it took place the great battle of the year 620 between the Tatars on one side and the Qifjaq and the Russians on the other. The two hosts held firm for days, then the Tatars prevailed and put those others to the sword {cite:shadharat-dhahab p. 87}."
  es: "Un río que desemboca en el mar de Azov cerca de Mariúpol, en las tierras meridionales de al-Aflaq. Junto a él tuvo lugar la gran batalla del año 620 entre los tártaros, por un lado, y los qifjaq y los rusos, por el otro. Ambos ejércitos resistieron durante días, hasta que los tártaros se impusieron y pasaron a cuchillo a los demás {cita: shadharat-dhahab, pág. 87}."
  fr: "Un fleuve se jette dans la mer d'Azov près de Marioupol, dans les terres méridionales d'al-Aflaq. C'est à proximité qu'eut lieu la grande bataille de l'an 620, opposant les Tatars aux Qifjaq et aux Russes. Les deux camps tinrent bon pendant plusieurs jours, puis les Tatars l'emportèrent et massacrèrent leurs adversaires (cf. shadharat-dhahab, p. 87)."
  ur: "الفلق کی جنوبی سرزمین میں ماریوپول کے قریب بحیرہ ازوف میں بہنے والا ایک دریا۔ اس کے ساتھ ہی ایک طرف تاتاریوں اور دوسری طرف کیفجاق اور روسیوں کے درمیان سنہ 620 کی عظیم جنگ ہوئی۔ دونوں میزبان دنوں تک ڈٹے رہے، پھر تاتاری غالب آ گئے اور ان باقیوں کو تلوار پر چڑھا دیا۔ 87}۔"
  tr: "Güney Stephalogy'de Mariupol yakınlarında Azak Denizi'ne dökülen bir nehir; 620 yılının büyük destanı Tatarlar, Kipçaklar ve Ruslar arasında yaşandı. İki taraf günlerce direndi, sonra Tatarlar zafer kazandı ve kılıçla yükseldiler {atıf:shadharat-dhahab, s. 87}."
  id: "Sebuah sungai yang mengalir ke Laut Azov dekat Mariupol di Stephalogy Selatan; ada kisah besar tahun 620 antara Tatar, Kipchak, dan Rusia. Kedua pihak bertahan selama beberapa hari, lalu Tatar menang dan bangkit dengan pedang {cite:shadharat-dhahab, hlm. 87}."
