summary:
  ar: "بلد في السواد على طريق المدائن؛ عند البلاذري بلغ بعض المسلمين كلواذى في غاراتهم وكانوا يعيشون بما ينالون من الغارات."
  en: "Sawad town on the al-Mada'in road; in al-Baladhuri some Muslims reached it on their raids, living off what the raids yielded."
  es: "La ciudad de Sawad se encuentra en la carretera de al-Mada'in; en al-Baladhuri, algunos musulmanes llegaron hasta allí en sus incursiones, viviendo de lo que conseguían en ellas."
  fr: "La ville de Sawad se trouvait sur la route d'al-Mada'in; à al-Baladhuri, certains musulmans l'atteignaient lors de leurs raids, vivant des fruits de ces raids."
  ur: "المدائن روڈ پر واقع سواد قصبہ؛ البلادوری میں کچھ مسلمان چھاپوں پر پہنچ گئے، چھاپوں سے جو نتیجہ نکلا اس سے بچتے رہے۔"
  tr: "Şehirlere giden yolda kara bir ülke; el-Baladhuri'ye göre, bazı Müslümanlar baskınlarında zarar gördü ve aldıkları darbelerle yaşadılar."
  id: "Sebuah negara berpakaian hitam di jalan menuju kota; menurut al-Baladhuri, beberapa Muslim terluka dalam serangan mereka dan hidup dari pukulan yang mereka terima."
