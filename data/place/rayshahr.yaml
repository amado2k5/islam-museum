summary:
  ar: "ريشهر من أرض سابور بقرب توج؛ فيها اقتتل الحكم بن أبي العاص وشهرك مرزبان فارس قتالاً شديداً وقتل شهرك بيد سوار بن همام العبدي وقتل ابن شهرك سواراً وفتحت عنوة وكان يومها كيوم القادسية."
  en: "Rayshahr of Sabur's land near Tawwaj; there al-Hakam and the marzban Shahrak fought fiercely — Sawwar killed Shahrak, Shahrak's son killed Sawwar, and the town fell by force on a day likened to al-Qadisiyya."
  es: "Rayshahr de la tierra de Sabur cerca de Tawwaj; allí al-Hakam y el marzban Shahrak lucharon ferozmente: Sawwar mató a Shahrak, el hijo de Shahrak mató a Sawwar y la ciudad cayó por la fuerza en un día comparado con al-Qadisiyya."
  fr: "Rayshahr du pays de Sabur près de Tawwaj; là, al-Hakam et le marzban Shahrak se sont battus avec acharnement: Sawwar a tué Shahrak, le fils de Shahrak a tué Sawwar et la ville est tombée de force un jour comparé à al-Qadisiyya."
  ur: "تواج کے قریب صبور کی سرزمین کا ریشہر؛ وہاں الحکم اور مرزبان شہرک کے درمیان زبردست لڑائی ہوئی — سوار نے شاہرک کو قتل کیا، شہرق کے بیٹے نے سوار کو قتل کیا، اور شہر القدسیہ سے تشبیہہ دینے والے دن طاقت سے گر گیا۔"
  tr: "Rishahr, Tuj yakınlarındaki Sabor topraklarından; orada al-Hakam ibn Ebi el-As şiddetle savaştı, Şehrak, Fars merzbanı ve Şehrak Suwar ibn Hammam al-Abdi tarafından öldürüldü, İbn Şehrak ise Suwar'da öldürüldü ve kapı zorla açıldı. Gün, el-Kadisiye günü gibiydi."
  id: "Rishahr dari tanah Sabor dekat Tuj; di sana al-Hakam ibn Abi al-As bertempur sengit, Shahrak, marzban Persia, dan Shahrak dibunuh oleh Suwar ibn Hammam al-Abdi, dan Ibn Shahrak dibunuh di Suwar, dan tempat itu dibuka secara paksa. Hari itu seperti hari al-Qadisiyyah."
