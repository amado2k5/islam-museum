summary:
  ar: "قرية مسكونة في أرض البجة فيها سوق، ومنها تُنسب الجمال البختية، وهي أصبر الجمال على السير وأسرعها، ويعيش أهلها من إنتاجها. {cite:nuzhat-al-mushtaq-2002 p. 47}"
  en: "An inhabited village in Beja land with a market. It gives its name to the Bactrian camels, prized as the most patient and fastest of camels for travel. {cite:nuzhat-al-mushtaq-2002 p. 47}"
  es: "Un pueblo habitado en la región de Beja, con un mercado. Su nombre proviene de los camellos bactrianos, apreciados por ser los más pacientes y rápidos para viajar. {cite:nuzhat-al-mushtaq-2002 p. 47}"
  fr: "Village habité du pays Beja, doté d'un marché. Il a donné son nom aux chameaux de Bactriane, réputés pour être les plus patients et les plus rapides pour les voyages. {cite:nuzhat-al-mushtaq-2002 p. 47}"
  ur: "بیجہ کا ایک آباد گاؤں جس میں بازار ہے۔ یہ اپنا نام بکٹرین اونٹوں کو دیتا ہے، جو سفر کے لیے سب سے زیادہ صبر کرنے والے اور تیز ترین اونٹوں کے طور پر قابل قدر ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 47}"
