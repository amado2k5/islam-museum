  fr: "Uqbat al-Jarud, le col entre Jarra et Shiraz — al-Jarud al-Abdi s'est attardé à l'aube pour avoir besoin de quelque chose avec sa gourde, les Kurdes l'ont encerclé et tué, et le col porte son nom."
  ur: "عقبت الجرود، جرا اور شیراز کے درمیان گزرا — الجرود العابدی اپنے پانی کے فلاسک کے ساتھ فجر کے وقت پیچھے رہ گیا، کردوں نے اسے گھیر لیا اور مار ڈالا، اور اس درہ پر اس کا نام ہے۔"
