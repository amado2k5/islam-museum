  ar: "عقبة الجارود بفارس بين جرة وشيراز؛ تخلف الجارود العبدي عن أصحابه فيها سحراً لحاجته ومعه إداوة فأحاطت به جماعة من الأكراد فقتلوه فسميت به."
  en: "Uqbat al-Jarud, the pass between Jarra and Shiraz — al-Jarud al-Abdi lagged at dawn for a need with his water-flask, Kurds surrounded and killed him, and the pass bears his name."
