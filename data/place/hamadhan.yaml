summary:
  ar: مدينة الجبل؛ عند البلاذري فتحها جرير بن عبد الله سنة 23 وقيل 24 على مثل صلح نهاوند بعد أن أصيبت عينه بسهم فقال احتسبتها
    عند الله ثم غدر أهلها فقاتلهم العلاء بن وهب حتى نزلوا على حكمه بخراج الأرض وجزية الرؤوس ومائة ألف درهم للمسلمين.
  en: the Jibal's city; in al-Baladhuri taken by Jarir ibn Abdallah in 23 or 24 on Nihawand's terms after an arrow took his
    eye, then re-subdued by al-Ala ibn Wahb for Uthman after its people broke faith — on land kharaj, head jizya and 100,000
    dirhams.
  es: "la ciudad de Jibal; en al-Baladhuri tomada por Jarir ibn Abdallah en el año 23 o 24 en los términos de Nihawand después de que una flecha le sacara un ojo, luego sometida nuevamente por al-Ala ibn Wahb para Uthman después de que su gente rompiera la fe, en tierras kharaj, jizya de cabeza y 100.000 dirhams."
  fr: "la ville de Jibal; à al-Baladhuri prise par Jarir ibn Abdallah en 23 ou 24 aux conditions de Nihawand après qu'une flèche lui ait pris l'œil, puis soumise à nouveau par al-Ala ibn Wahb pour Uthman après que son peuple ait rompu la foi — sur la terre kharaj, la jizya de tête et 100 000 dirhams."
  ur: "جبل کا شہر؛ البلادھوری میں جریر ابن عبداللہ نے 23 یا 24 میں نہاوند کی شرائط پر ایک تیر کی آنکھ لگنے کے بعد لیا، پھر علاء بن وہب نے عثمان کے لیے دوبارہ تابع کیا جب اس کے لوگوں کے ایمان توڑنے کے بعد - زمین خراج، سر جزیہ اور 100,000 درہم پر۔"
  tr: "Dağın şehri; el-Baladhuri'ye göre, Jarir bin Abdullah 23. yılda, bazıları 24. yılda, Nahavand Antlaşması ile aynı temelde fethetti; gözüne bir ok isabet ettikten sonra, 'Bunu Allah'la saydım.' dedi. Sonra halkı onları sattı ve Al-Ala'bin Vahb, toprak vergisi, baş cizyesi ve Müslümanlar için yüz bin dirhem ile kendi yönetimine gelene kadar onlarla savaştı."
  id: "Kota gunung; menurut al-Baladhuri, Jarir ibn Abdullah menaklukkannya pada tahun 23, atau ada yang mengatakan 24, berdasarkan dasar yang sama seperti Perjanjian Nahavand, setelah matanya terkena panah, ia berkata, 'Aku telah menghitungnya kepada Allah.' Kemudian rakyatnya mengkhianati mereka, dan Al-Ala' ibn Wahb melawan mereka hingga mereka memerintahnya dengan pajak tanah, jizya kepala, dan seratus ribu dirham untuk umat Muslim."
