label:
  ar: "نهر جيحون (آمو داريا)"
  en: "Amu Darya (the Oxus)"
summary:
  ar: "نهر آسيا الوسطى الكبير، ويسمى عند العرب في الكتب العلمية جيحون، ويُعرف عند اليونان بالأوكسوس، ويجري من هضبة البامير إلى بحر الآرال بطول يزيد على 2400 كم، ويفصل بين أفغانستان وطاجيكستان ثم أوزبكستان وتركمانستان {cite:encyclopaedia-of-islam-2 vol. 1 p. 476-477}."
  en: "The great river of Central Asia, known to the Arabs, in learned works, as Djayhun and to the Greeks as the Oxus. It rises in the Pamirs, runs more than 2,400 km towards the Aral Sea, and today forms frontiers between Afghanistan and Tajikistan, and then between Uzbekistan and Turkmenistan {cite:encyclopaedia-of-islam-2 vol. 1 p. 476-477}."
