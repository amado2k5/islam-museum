id: place/amu-darya
class: place
kind: river
label:
  ar: "نهر جيحون ⁦(آمو داريا)⁩"
  en: "Amu Darya (the Oxus)"
  es: "Amu Darya (el Oxus)"
  fr: "Amou-Daria (l'Oxus)"
  ur: "آمو دریا ⁦(آکسس)⁩"
  tr: "Jeyhun Nehri (Amu Derya)"
  id: "Sungai Jeyhun (Amu Darya)"
summary:
  ar: "نهر آسيا الوسطى الكبير، ويسمى عند العرب في الكتب العلمية جيحون، ويُعرف عند اليونان بالأوكسوس، ويجري من هضبة البامير إلى بحر الآرال بطول يزيد على 2400 كم، ويفصل بين أفغانستان وطاجيكستان ثم أوزبكستان وتركمانستان {cite:encyclopaedia-of-islam-2 vol. 1 p. 476-477}."
  en: "The great river of Central Asia, known to the Arabs, in learned works, as Djayhun and to the Greeks as the Oxus. It rises in the Pamirs, runs more than 2,400 km towards the Aral Sea, and today forms frontiers between Afghanistan and Tajikistan, and then between Uzbekistan and Turkmenistan {cite:encyclopaedia-of-islam-2 vol. 1 p. 476-477}."
  es: "El gran río de Asia Central, conocido por los árabes, en obras académicas, como Djayhun y por los griegos como Oxus. Nace en los Pamir, recorre más de 2400 km hacia el mar de Aral y hoy forma fronteras entre Afganistán y Tayikistán, y luego entre Uzbekistán y Turkmenistán {cite:encyclopaedia-of-islam-2 vol. 1 p. 476-477}."
  fr: "Le grand fleuve d'Asie centrale, connu des Arabes, dans les ouvrages savants, sous le nom de Djayhun et des Grecs sous celui d'Oxus, prend sa source dans le Pamir, parcourt plus de 2 400 km jusqu'à la mer d'Aral et forme aujourd'hui les frontières entre l'Afghanistan et le Tadjikistan, puis entre l'Ouzbékistan et le Turkménistan (encyclopédie de l'islam, vol. 1, p. 476-477)."
  ur: "وسطی ایشیا کا عظیم دریا جسے عربوں کے لیے علمی کاموں میں جیہون اور یونانیوں کے لیے آکسس کے نام سے جانا جاتا ہے۔ یہ پامیر میں اٹھتا ہے، بحیرہ ارال کی طرف 2,400 کلومیٹر سے زیادہ کا فاصلہ طے کرتا ہے، اور آج افغانستان اور تاجکستان کے درمیان سرحدیں بناتا ہے، اور پھر ازبکستان اور ترکمانستان کے درمیان۔ 1 ص۔ 476-477}۔"
  tr: "Araplar tarafından bilimsel metinlerde Ceyhun olarak adlandırılan Büyük Orta Asya Nehri, Yunanlar tarafından Oxus olarak bilinir, Pamir Platosu'ndan Aral Denizi'ne kadar 2400 km'yi aşan bir süreyle akar ve Afganistan ile Tacikistan'ı, ardından Özbekistan ve Türkmenistan'ı ayırır {atıf:İslam Ansiklopedisi-2 cilt 1, s. 476-477}."
  id: "Sungai Asia Tengah Besar, yang disebut Jeyhun oleh bangsa Arab dalam teks ilmiah, dikenal oleh orang Yunani sebagai Oxus, mengalir dari Dataran Tinggi Pamir ke Laut Aral sepanjang lebih dari 2400 km, memisahkan Afghanistan dan Tajikistan, lalu Uzbekistan dan Turkmenistan {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 476-477}."
