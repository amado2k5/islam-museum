label:
  ar: "جزيرة العربية (في الخليج)"
  en: "Jazirat al-'Arabiyya"
summary:
  ar: "جزيرة صغيرة في الخليج العربي، تقل مساحتها عن ميل مربع، وتبعد نحو 50 ميلًا عن الساحل السعودي ونحو 60 ميلًا عن الساحل الإيراني. وهي إحدى جزر مجموعة الكُرين الخمس على الجانب العربي من الخليج، وتكاد تكون غير مأهولة، وتطالب بها السعودية والكويت وإيران {cite:encyclopaedia-of-islam-2 vol. 1 p. 628}."
  en: "A small island in the Persian Gulf, less than a mile square, about 50 miles from the Saudi Arabian mainland and about 60 miles from Iran. It is one of the five-island Kurayn group on the Arabian side of the Gulf; it is normally uninhabited, and Saudi Arabia, Kuwait and Iran all claim it {cite:encyclopaedia-of-islam-2 vol. 1 p. 628}."
