summary:
  ar: "جزيرة صغيرة في الخليج العربي، تقل مساحتها عن ميل مربع، وتبعد نحو 50 ميلًا عن الساحل السعودي ونحو 60 ميلًا عن الساحل الإيراني. وهي إحدى جزر مجموعة الكُرين الخمس على الجانب العربي من الخليج، وتكاد تكون غير مأهولة، وتطالب بها السعودية والكويت وإيران {cite:encyclopaedia-of-islam-2 vol. 1 p. 628}."
  en: "A small island in the Persian Gulf, less than a mile square, about 50 miles from the Saudi Arabian mainland and about 60 miles from Iran. It is one of the five-island Kurayn group on the Arabian side of the Gulf; it is normally uninhabited, and Saudi Arabia, Kuwait and Iran all claim it {cite:encyclopaedia-of-islam-2 vol. 1 p. 628}."
  es: "Una pequeña isla en el Golfo Pérsico, de menos de una milla cuadrada, a unas 50 millas de la costa continental de Arabia Saudita y a unas 60 millas de Irán. Es una de las cinco islas del grupo Kurayn, situadas en la costa arábiga del Golfo; normalmente está deshabitada, y Arabia Saudita, Kuwait e Irán la reclaman {cite:encyclopaedia-of-islam-2 vol. 1 p. 628}."
  fr: "Petite île du golfe Persique, d'une superficie inférieure à un kilomètre carré, située à environ 80 kilomètres des côtes saoudiennes et à environ 95 kilomètres de l'Iran. Elle fait partie des cinq îles de l'archipel de Kurayn, côté arabe du golfe; elle est généralement inhabitée et revendiquée par l'Arabie saoudite, le Koweït et l'Iran (voir: Encyclopaedia of Islam, vol. 1, p. 628)."
