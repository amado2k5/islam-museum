label: { en: "al-Khandama", ar: "الخندمة" }
summary:
  en: "A rugged mountain on the edge of Mecca where resisters from Quraysh and Banu Bakr gathered under Safwan ibn Umayya, Ikrima ibn Abi Jahl, and Suhayl ibn Amr, and clashed with Khalid ibn al-Walid's column on the morning of the Conquest."
  ar: "جبل وعر بفرع مكة تجمّع فيه مقاتلو قريش وبني بكر بقيادة صفوان وعكرمة وسهيل لصد المسلمين، ودارت فيه وقعة الخندمة مع مجنبة خالد بن الوليد صبيحة الفتح."
