summary:
  en: "A rugged mountain on the edge of Mecca where resisters from Quraysh and Banu Bakr gathered under Safwan ibn Umayya, Ikrima ibn Abi Jahl, and Suhayl ibn Amr, and clashed with Khalid ibn al-Walid's column on the morning of the Conquest."
  ar: "جبل وعر بفرع مكة تجمّع فيه مقاتلو قريش وبني بكر بقيادة صفوان وعكرمة وسهيل لصد المسلمين، ودارت فيه وقعة الخندمة مع مجنبة خالد بن الوليد صبيحة الفتح."
  es: "Una escarpada montaña en las afueras de La Meca donde los resistentes de Quraysh y Banu Bakr se reunieron bajo el mando de Safwan ibn Umayya, Ikrima ibn Abi Jahl y Suhayl ibn Amr, y se enfrentaron a la columna de Khalid ibn al-Walid en la mañana de la Conquista."
  fr: "Une montagne escarpée aux abords de La Mecque où des résistants de Quraysh et de Banu Bakr se rassemblèrent sous Safwan ibn Umayya, Ikrima ibn Abi Jahl et Suhayl ibn Amr, et affrontèrent la colonne de Khalid ibn al-Walid le matin de la Conquête."
  ur: "مکہ کے کنارے پر ایک ناہموار پہاڑ جہاں قریش اور بنو بکر کے مزاحمت کار صفوان بن امیہ، عکرمہ ابن ابی جہل اور سہیل بن عمرو کے ماتحت جمع ہوئے اور فتح کی صبح خالد بن ولید کے کالم سے ٹکرا گئے۔"
