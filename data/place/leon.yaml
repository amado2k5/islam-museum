summary:
  ar: "مدينة عامرة بها رجال محاربون وأهلها أهل همة ونفاسة، وكانت من مدن قشتالة، وتبعد عن سمورة أربعة أيام، وعن شنت ياقوب ثلاثة أيام. {cite:nuzhat-al-mushtaq-2002 p. 732}"
  en: "A populous city with fighting men and people of spirit; one of the cities of Castile, four days from Zamora and three from Shant Yaqub. {cite:nuzhat-al-mushtaq-2002 p. 732}"
  es: "Una ciudad populosa con hombres guerreros y gente de espíritu indomable; una de las ciudades de Castilla, a cuatro días de Zamora y a tres de Shant Yaqub. {cite:nuzhat-al-mushtaq-2002 p. 732}"
  fr: "Une ville peuplée d'hommes combatifs et d'un peuple courageux; une des villes de Castille, à quatre jours de Zamora et à trois de Shant Yaqub. {cite:nuzhat-al-mushtaq-2002 p. 732}"
  ur: "لڑنے والے مردوں اور روح کے لوگوں کے ساتھ ایک آبادی والا شہر؛ کاسٹیل کے شہروں میں سے ایک، زمورا سے چار دن اور شانت یعقوب سے تین دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 732}"
  tr: "Savaşçılarla ve cesur ve prestijli insanlarıyla hareketli bir şehir. Kastilya'nın şehirlerinden biriydi; Samora'ya dört gün, Shant Yaqub'a ise üç gün uzaklıktaydı. {kaynak:nuzhat-al-mushtaq-2002 s. 732}"
  id: "Kota yang ramai dengan para pejuang dan penduduknya yang berani serta bergengsi. Ini adalah salah satu kota di Kastilia, terletak empat hari dari Samora dan tiga hari dari Shant Yaqub. {cite:Nuzhat-al-Mushtaq-2002 hlm. 732}"
