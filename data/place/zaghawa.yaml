summary:
  ar: "مدينة كثيرة الناس، حولها قبائل من الزغاويين يرعون إبلهم، وهم أكثر السودان جرباً، وشربهم من الآبار، وطعامهم الذرة والمقددات والحوت. وتبعد عن مانان ثماني مراحل {cite:nuzhat-al-mushtaq-2002 p. 29-30}."
  en: "A town with many people, surrounded by Zaghawa tribes who herd camels. Their water comes from wells and their food is sorghum, dried meat and fish. Eight stages from Manan."
  es: "Un pueblo con muchos habitantes, rodeado por tribus zaghawa que crían camellos. Su agua proviene de pozos y su alimentación se basa en sorgo, carne seca y pescado. A ocho etapas de Manan."
  fr: "Un village densément peuplé, entouré par les tribus Zaghawa qui élèvent des chameaux. Ils s'approvisionnent en eau à des puits et se nourrissent de sorgho, de viande séchée et de poisson. À huit étapes de Manan."
  ur: "بہت سے لوگوں پر مشتمل ایک قصبہ، جس کے چاروں طرف زاغاوا قبائل ہیں جو اونٹ چراتے ہیں۔ ان کا پانی کنوؤں سے آتا ہے اور ان کی خوراک جوار، خشک گوشت اور مچھلی ہیں۔ منان سے آٹھ مراحل۔"
  tr: "Çok sayıda insanın bulunduğu bir şehir olan bu şehirde, Sudan'ın en deneyimli develerini güden Zaghawi kabileleri vardır; bu kabileler kuyulardan su içir ve yiyecekleri mısır, uskumru ve balıktır. Manan'dan sekiz aşama uzaklıktadır {cite:Nuzhat-al-Mushtaq-2002, s. 29-30}."
  id: "Sebuah kota dengan banyak penduduk, di sekitarnya terdapat suku-suku Zaghawi yang menggembalakan unta mereka, yang paling berpengalaman di Sudan, minum dari sumur, dan makanan mereka adalah jagung, makarel, dan ikan. Kota ini berjarak delapan tahap dari Manan {cite:Nuzhat-al-Mushtaq-2002, hlm. 29-30}."
