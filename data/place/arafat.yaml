summary:
  ar: "سهل فسيح خارج مكة، يقف فيه الحجاج يوم عرفة، وسُمّي بذلك لأن جبريل قال لإبراهيم: أعرفت مناسكك؟ وفيه جبل المشاش في وسطه، وجبل كبكب خلفه ⁦(الأزرقي، ص 119 و284 و321 من الماسح)⁩."
  en: "A broad plain outside Mecca where pilgrims stand on the Day of Arafat. It is so called because Gabriel asked Abraham, 'Have you recognised your rites?' In its middle is Jabal al-Mashash, and behind it Jabal Kabkab (al-Azraqi, pp. 119, 284 and 321 of the scan)."
  es: "Una amplia llanura a las afueras de La Meca donde los peregrinos se congregan el Día de Arafat. Recibe este nombre porque Gabriel le preguntó a Abraham: \"¿Has reconocido tus ritos?\". En su centro se encuentra Jabal al-Mashash, y detrás de él, Jabal Kabkab (al-Azraqi, págs. 119, 284 y 321 del escaneo)."
  fr: "Une vaste plaine aux abords de La Mecque où les pèlerins se rassemblent le jour d'Arafat. Elle doit son nom à la question de Gabriel à Abraham: « As-tu reconnu tes rites ? » En son centre se trouve le Jabal al-Mashash, et derrière lui le Jabal Kabkab (al-Azraqi, pp. 119, 284 et 321 du recueil)."
  ur: "مکہ سے باہر ایک وسیع میدان جہاں عرفات کے دن حجاج کھڑے ہوتے ہیں۔ اسے اس لیے کہا جاتا ہے کہ جبرائیل نے ابراہیم سے پوچھا، 'کیا تم نے اپنی رسومات کو پہچان لیا ہے؟' اس کے درمیان میں جبل المشش ہے اور اس کے پیچھے جبل کبکب ہے ⁦(الازراقی ص 119، 284 اور اسکین کی 321)⁩۔"
  tr: "Mekke dışında, hacıların Arafah Günü'nde durduğu geniş bir ova, adını Cebrail'in İbrahim'e şöyle demesiyle almıştır: \"Ritüellerini biliyor musun?\" Ortasında El-Maşaş Dağı, arkasında ise Kabkab Dağı yer alır (El-Azraqi, s. 119, 284 ve 321, El-Mesih'ten)."
  id: "Sebuah dataran luas di luar Mekah, tempat para peziarah berdiri pada Hari Arafah, dinamai demikian karena Jibril berkata kepada Ibrahim: Apakah kamu tahu ritualmu? Di dalamnya terdapat Gunung Al-Mashash di tengahnya, dan Gunung Kabkab di belakangnya (Al-Azraqi, hlm. 119, 284, dan 321 dari Al-Masih)."
