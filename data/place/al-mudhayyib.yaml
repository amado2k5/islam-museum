summary:
  ar: "موضع في طريق العراق؛ عند البلاذري صار إليه أبو عبيد بن مسعود فبلغه أن جابان الأعجمي بتستر في جمع كثير فلقيه فهزمه وقيل إن جرير بن عبد الله سلك الطريق على فيد والتعلبية إلى المذيب."
  en: "Waystation on the Iraq road; in al-Baladhuri Abu Ubayd ibn Mas'ud reached it and met Jaban the Persian's host from Tustar, routing it; Jarir ibn Abdallah is said to have taken the road over Fayd and al-Ta'labiyya to al-Mudhayyib."
  es: "Estación de paso en el camino a Irak; en al-Baladhuri, Abu Ubayd ibn Mas'ud llegó hasta allí y se encontró con el anfitrión de Jaban el Persa procedente de Tustar, desviándolo; se dice que Jarir ibn Abdallah tomó el camino que pasaba por Fayd y al-Ta'labiyya hasta al-Mudhayyib."
  fr: "Étape sur la route d'Irak; à al-Baladhuri, Abu Ubayd ibn Mas'ud l'atteignit et rencontra l'armée de Jaban le Perse de Tustar, la mettant en déroute; Jarir ibn Abdallah aurait pris la route par Fayd et al-Ta'labiyya jusqu'à al-Mudhayyib."
  ur: "عراق کی سڑک پر راستہ؛ البلادوری میں ابو عبید ابن مسعود اس تک پہنچے اور تستار سے فارسی کے میزبان جبان سے ملاقات کی اور اس کا راستہ طے کیا۔ جریر بن عبداللہ کے بارے میں کہا جاتا ہے کہ انہوں نے فید اور الطلبیہ کے اوپر سے المذائب تک کا راستہ اختیار کیا۔"
