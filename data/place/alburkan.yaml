summary:
  ar: "الجزيرة المعروفة بألبركان، وهي الأطمة التي يخرج منها أجسام من النار كأجساد الناس بلا رؤوس فتعلو في الهواء بالليل ثم تسقط في البحر فتطفو على الماء، وهي الحجارة الخفاف البيض التي يمحو بها الكتابة من الدفاتر، وفيها قبر فرفوريس الحكيم صاحب إيساغوجي، والأطمة تفسيرها عين النار التي تنبع من الأرض {cite:muruj-al-dhahab p. 357-358}."
  en: "The island al-Burkan, Sicily's fire-vent: headless flame-bodies rise by night and fall into the sea as the light white stones used to erase writing; it holds Porphyry's tomb. Atma is a spring of fire rising from the earth {cite:muruj-al-dhahab p. 357-358}."
