label: { ar: "ألبركان أطمة صقلية", en: "Alburkan — the fire-vent of Sicily", es: "Alburkan: la chimenea de Sicilia", fr: "Alburkan — l'évent d'incendie de Sicile", ur: "البرکان - سسلی کا فائر وینٹ", tr: "Sicilya'nın Atma volkanı", id: "Gunung berapi Atma dari Sisilia" }
summary:
  ar: "الجزيرة المعروفة بألبركان، وهي الأطمة التي يخرج منها أجسام من النار كأجساد الناس بلا رؤوس فتعلو في الهواء بالليل ثم تسقط في البحر فتطفو على الماء، وهي الحجارة الخفاف البيض التي يمحو بها الكتابة من الدفاتر، وفيها قبر فرفوريس الحكيم صاحب إيساغوجي، والأطمة تفسيرها عين النار التي تنبع من الأرض {cite:muruj-al-dhahab p. 357-358}."
  en: "The island al-Burkan, Sicily's fire-vent: headless flame-bodies rise by night and fall into the sea as the light white stones used to erase writing; it holds Porphyry's tomb. Atma is a spring of fire rising from the earth {cite:muruj-al-dhahab p. 357-358}."
  es: "La isla de al-Burkan, la chimenea de fuego de Sicilia: cuerpos llameantes sin cabeza se elevan por la noche y caen al mar como las piedras blancas y ligeras que se usaban para borrar la escritura; alberga la tumba de Porfirio. Atma es un manantial de fuego que brota de la tierra {cite:muruj-al-dhahab p. 357-358}."
  fr: "L'île d'al-Burkan, source de feu de Sicile: des corps de flammes sans tête s'élèvent la nuit et retombent dans la mer, tels des pierres blanches et légères qui servaient autrefois à effacer les inscriptions; elle abrite le tombeau de Porphyre. Atma est une source de feu jaillissant de la terre {cite: Muruj-al-Dhahab, p. 357-358}."
  ur: "جزیرہ البرکان، سسلی کا آگ کا راستہ: بغیر سر کے شعلے والے اجسام رات کو اٹھتے ہیں اور سمندر میں اس طرح گرتے ہیں جیسے ہلکے سفید پتھر تحریر کو مٹا دیتے تھے۔ اس میں پورفیری کی قبر ہے۔ آتما آگ کا ایک چشمہ ہے جو زمین سے نکلتا ہے 357-358}۔"
  tr: "Alburkan olarak bilinen ada, başsız insanların bedenleri gibi ateş cisimlerinin gece havada yükseldiği, sonra denize düştüğü ve suda yüzdüğü al-tamma olan al-tamma adasıdır. Bunlar, defterlerden yazıları silmek için kullanılan soluk beyaz taşlardır. Burada, Isagogi'nin sahibi Bilge Furfuris'in mezarı bulunur. Al-al-Dhahab, yerden fışkıran 'ateş ain'i olarak yorumlanır {cite:muruj-al-dhahab, s. 357-358}."
  id: "Pulau yang dikenal sebagai Alburkan, yaitu al-tamma dari mana tubuh api muncul seperti tubuh orang tanpa kepala, naik di udara pada malam hari, lalu jatuh ke laut dan mengapung di atas air. Ini adalah batu putih pucat yang digunakan untuk menghapus tulisan dari buku catatan. Di dalamnya terdapat makam Furfuris yang Bijaksana, pemilik Isagogi. Al-al-dhahab diartikan sebagai 'ain api' yang muncul dari bumi {cite:muruj-al-dhahab, hlm. 357-358}."
