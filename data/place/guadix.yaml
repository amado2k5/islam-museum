label: { ar: "وادي آش", en: "Guadix", es: "Guadix", fr: "Guadix", ur: "گواڈکس", tr: "Ash Valley", id: "Lembah Ash" }
summary:
  ar: "مدينة جليلة من أعمال غرناطة يقال لها وادي الأشات، قد أحدقت بها البساتين والأنهار وقد خص الله أهلها بالأدب وحب الشعر، ومن أعمالها حصن جليانة وهو كبير يضاهي المدن وبه التفاح الجلياني الذي خص الله به ذلك الموضع يجمع عظم الحجم وكرم الجوهر وحلاوة الطعم وذكاء الرائحة والنقاء، وبين الحصن ووادي آش اثنا عشر ميلاً {cite:nafh-tib-maqqari p. 185}. واستقرت بها دعوة ابني أبي عبد الله محمد وأبي الحجاج يوسف ابني السلطان أبي الحسن حين هربا من أبيهما وبايعتهما المرية وبسطة وغرناطة {cite:nafh-tib-maqqari p. 518}."
  en: "Guadix (Wadi Ash) — a fine city of Granada's district ringed by gardens and rivers, its people specially gifted with letters and love of verse; its fortress Juliana grew the apple proverbial in all al-Andalus. In the last civil war Boabdil and his brother fled there and it rose for their cause {cite:nafh-tib-maqqari p. 185,518}."
  es: "Guadix (Wadi Ash), una hermosa ciudad del distrito de Granada, rodeada de jardines y ríos, cuyos habitantes poseían un don especial para las letras y la poesía; en su fortaleza Juliana se cultivaba la manzana proverbial de todo al-Ándalus. En la última guerra civil, Boabdil y su hermano huyeron allí, y la ciudad se alzó en su defensa {cite:nafh-tib-maqqari p. 185,518}."
  fr: "Guadix (Wadi Ash) — une belle ville du district de Grenade, entourée de jardins et de rivières, dont les habitants étaient particulièrement doués pour les lettres et l'amour de la poésie; sa forteresse Juliana produisait la pomme proverbiale de tout al-Andalus. Lors de la dernière guerre civile, Boabdil et son frère s'y réfugièrent et la ville se souleva pour leur cause {cite:nafh-tib-maqqari p. 185,518}."
  ur: "Guadix (Wadi Ash) - باغات اور ندیوں سے گھرا گریناڈا کے ضلع کا ایک عمدہ شہر، اس کے لوگوں کو خصوصی طور پر خطوط اور آیت کی محبت سے نوازا گیا ہے۔ اس کے قلعے جولیانا نے تمام الاندلس میں سیب کا محاورہ بڑھایا۔ پچھلی خانہ جنگی میں بوعبدل اور اس کا بھائی وہاں سے بھاگ گئے اور یہ ان کی وجہ سے اٹھ کھڑا ہوا۔ 185,518}۔"
  tr: "Granada'da Şotlar Vadisi adında soylu bir şehir, meyve bahçeleri ve nehirlerle çevrilidir ve Allah halkını edebiyat ve şiire olan sevgiyle kutsamıştır. Eserleri arasında, Tanrı'nın özel olarak o yere tahsis ettiği Galliani elmalarını barındıran, büyük büyüklük, cömertlik, tatlı tat, keskin aroma ve saflığı birleştiren Jaliana kalesi vardır. Kale ile Kül Vadisi arasında on iki mil vardır {cite:nafh-tib-maqqari, s. 185}. Sultan Ebu el-Hasan'ın oğulları Ebu Abdullah Muhammed ve Ebu el-Hacan Yusuf'un oğullarının babalarından kaçarken oraya yerleşmişlerdir ve Almeria, Basta ve Granada onlara bağlılık yemini etmişler {cite:nafh-tib-maqqari, s. 518}."
  id: "Sebuah kota mulia di Granada bernama Lembah Tembakan, dikelilingi oleh kebun buah dan sungai, dan Tuhan telah memberkati penduduknya dengan sastra dan kecintaan pada puisi. Di antara karyanya adalah benteng Jaliana, yang besar dan sebanding dengan kota-kota lain, berisi apel Galliani yang secara khusus ditetapkan Tuhan untuk tempat itu, menggabungkan ukuran besar, kemurahan hati, rasa manis, aroma tajam, dan kemurnian. Antara benteng dan Lembah Abu terdapat dua belas mil {cite:nafh-tib-maqqari, hlm. 185}. Panggilan putra-putra Abu Abdullah Muhammad dan Abu al-Hajjaj Yusuf, putra Sultan Abu al-Hasan, menetap di sana ketika mereka melarikan diri dari ayah mereka, dan Almeria, Basta, serta Granada bersumpah setia kepada mereka {cite:nafh-tib-maqqari, hlm. 518}."
