summary:
  ar: "مدينة على البحر الشرقي، تبعد عن باجة أربع مراحل، ويفصلها عن البحر أربع مراحل أخرى، وتبعد عن بشهيار تسع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  en: "A city on the eastern sea, four stages from Baja and nine from Bashhiyar, with a further stretch of four stages to the sea. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  es: "Una ciudad en el mar oriental, a cuatro etapas de Baja y a nueve de Bashhiyar, con un tramo adicional de cuatro etapas hasta el mar. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  fr: "Une ville située sur la mer orientale, à quatre étapes de Baja et à neuf de Bashhiyar, avec quatre étapes supplémentaires jusqu'à la mer. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  ur: "مشرقی سمندر پر ایک شہر، باجا سے چار مراحل اور بشیار سے نو، سمندر تک مزید چار مراحل کے ساتھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 213}"
  tr: "Doğu denizinde, Béja'ya dört adım uzaklıkta, denizden dört aşama daha ve Başhiyar'dan dokuz adım uzaklıkta bir şehirdir. {kaynak:nuzhat-al-mushtaq-2002 s. 213}"
  id: "Ini adalah sebuah kota di laut timur, empat langkah dari Béja, dipisahkan oleh empat tahap lagi dari laut, dan sembilan anak tangga dari Başhiyar. {cite:nuzhat-al-mushtaq-2002 hlm. 213}"
