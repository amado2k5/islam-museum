summary:
  ar: "مدينة لها ملك عظيم يركب الفيلة، وتقصدها كثرة من تجار المسلمين، فيُكرَمون من ملكها، ويُنصف لهم في ما بأيديهم، ويصفها الإدريسي بكثرة الفيلة في جيش الملك. {cite:nuzhat-al-mushtaq-2002 p. 188}"
  en: "A city ruled by a powerful king with many elephants in his army. Muslim merchants visit it in numbers, and according to al-Idrisi the king honours them and keeps their property secure. {cite:nuzhat-al-mushtaq-2002 p. 188}"
  es: "Una ciudad gobernada por un rey poderoso con un ejército repleto de elefantes. Numerosos mercaderes musulmanes la visitan, y según al-Idrisi, el rey los honra y protege sus bienes. {cite:nuzhat-al-mushtaq-2002 p. 188}"
  fr: "Une ville gouvernée par un roi puissant à la tête d'une armée nombreuse d'éléphants. De nombreux marchands musulmans s'y rendent, et selon al-Idrisi, le roi les honore et veille à la sécurité de leurs biens. {cite:nuzhat-al-mushtaq-2002 p. 188}"
  ur: "ایک شہر جس پر ایک طاقتور بادشاہ حکومت کرتا تھا جس کی فوج میں بہت سے ہاتھی تھے۔ مسلمان تاجر بڑی تعداد میں اس کا دورہ کرتے ہیں، اور الادریسی کے مطابق بادشاہ ان کی عزت کرتا ہے اور ان کی جائیداد کو محفوظ رکھتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 188}"
  tr: "Büyük bir kralın fil sürdüğü bir şehir ve birçok Müslüman tüccar tarafından ziyaret edilerek kralını onurlandırır ve sahip olduklarıyla onlara adalet sağlanırdı. El-İdrisi, kralın ordusunda çok sayıda fil olduğunu tanımlamıştır. {alıntı:Nuzhat-al-mushtaq-2002 s. 188}"
  id: "Sebuah kota dengan raja besar yang menunggang gajah, dan banyak pedagang Muslim mengunjunginya, menghormati rajanya dan mementingkan keadilan kepada mereka dalam apa yang mereka miliki. Al-Idrisi menggambarkannya sebagai memiliki banyak gajah dalam pasukan raja. {cite:Nuzhat-al-Mushtaq-2002 hlm. 188}"
