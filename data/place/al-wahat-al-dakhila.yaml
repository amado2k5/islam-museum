id: place/al-wahat-al-dakhila
class: place
kind: oasis
label: { ar: "الواحات الداخلة", en: "The Inner Oases (al-Dakhila)", es: "Los oasis interiores (al-Dakhila)", fr: "Les oasis intérieures (al-Dakhila)", ur: "اندرونی نخلستان ⁦(الدخیلہ)⁩", tr: "Dakhla Vahaları", id: "Oasis Dakhla" }
summary:
  ar: "واحات فيها بربر وعرب متحضرون يزرعون حيث الماء كثير، وينسب إليها النيلج المعروف بالجودة، ويذكر المؤلف أن بها حميرا صغيرة {cite:nuzhat-al-mushtaq-2002 p. 122}، {cite:nuzhat-al-mushtaq-2002 p. 123}."
  en: "Oases with Berbers and settled Arabs who farm where water is plentiful. The author says the indigo grown there is famed and gives it the name of the oases; the donkeys there are small {cite:nuzhat-al-mushtaq-2002 p. 122}, {cite:nuzhat-al-mushtaq-2002 p. 123}."
  es: "Oasis con bereberes y árabes asentados que cultivan donde abunda el agua. El autor dice que el índigo que se cultiva allí es famoso y le da el nombre de los oasis; los burros allí son pequeños {cite:nuzhat-al-mushtaq-2002 p. 122}, {cite:nuzhat-al-mushtaq-2002 p. 123}."
  fr: "Des oasis peuplées de Berbères et d'Arabes sédentarisés qui pratiquent l'agriculture là où l'eau abonde. L'auteur mentionne que l'indigo qui y est cultivé est réputé et donne son nom aux oasis; les ânes y sont petits {cite:nuzhat-al-mushtaq-2002 p. 122}, {cite:nuzhat-al-mushtaq-2002 p. 123}."
  ur: "بربروں کے ساتھ نخلستان اور آباد عرب جو کھیتی باڑی کرتے ہیں جہاں پانی وافر ہوتا ہے۔ مصنف کا کہنا ہے کہ وہاں اگائی جانے والی انڈگو مشہور ہے اور اسے نخلستان کا نام دیتا ہے۔ وہاں گدھے چھوٹے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 122}، {حوالہ: نزہت المشتاق-2002 ص۔ 123}۔"
  tr: "Medeni Berberilerin ve Arapların ekim yaptığı vahalar, suyun bol olduğu yerlerdir ve kalitesiyle bilinen Nilj onlara atfedilir. Yazar, küçük eşeklerin olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 122}, {cite:Nuzhat-al-Mushtaq-2002 s. 123}."
  id: "Oasis tempat Berber dan Arab beradab bertani di mana air melimpah, dan Nilj yang dikenal karena kualitasnya dikaitkan dengan mereka. Penulis menyebutkan bahwa ada keledai kecil {cite:Nuzhat-al-Mushtaq-2002 hlm. 122}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 123}."
