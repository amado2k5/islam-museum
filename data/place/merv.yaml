summary:
  ar: "مدينة قديمة في تركمانستان الحالية، كانت عاصمة خراسان، ومنها انطلقت الدعوة العباسية، وبها أقام المأمون قبل انتقاله إلى بغداد وعند البلاذري تلقى يزدجرد عند حدها ماهويه مرزبانها معظماً وأكرمه نيزك طرخان شهراً ثم تضافرا على قتله فلم تفتح له فدخل بيت طحان على الرغاب فقتل. ويعدّد المقدسي من خاصياتها بطيخ مرو الكبير الذي لا نظير له في أقاليم العجم {cite:ahsan-al-taqasim p. 247}."
  en: "An ancient city in present-day Turkmenistan; it was the capital of Khurasan, the Abbasid movement set out from it, and al-Ma'mun resided there before moving to Baghdad."
