  did_you_know:
    ar: "مرو عاصمة خراسان القديمة انطلقت منها الدعوة العباسية وأقام بها المأمون قبل بغداد؛ ويعدّد المقدسي من خاصياتها بطيخها الكبير."
    en: "Merv, ancient capital of Khurasan, saw the Abbasid call begin and housed al-Ma'mun before Baghdad; al-Muqaddasi lists its huge matchless melons among its specialties."
    ur: "مرو، خراسان کا قدیم دارالحکومت، جہاں سے دعوتِ عباسیہ شروع ہوئی اور مامون بغداد جانے سے پہلے یہاں رہا؛ مقدسی اس کے بڑے بے نظیر خربوزوں کو اس کی خاصیت گنتا ہے۔"
    sources: [source/ahsan-al-taqasim, source/futuh-buldan-maarif-1407]
