  ar: "عند البلاذري: بلدة قرب البصرة جمع أهلها لسويد بن قطب ة فخدعهم خالد بن الوليد بالانصراف نهاراً والرجوع ليلاً فانكسروا وقتل منهم بشر وغرّق طائفة في دجلة البصرة."
  en: "In al-Baladhuri: a town near Basra whose people gathered against Suwayd ibn Qutba; Khalid ibn al-Walid tricked them — departing by day, returning by night — they broke, many were killed, and a party drowned in Basra's Tigris."
  es: "En al-Baladhuri, una ciudad cercana a Basora, cuyos habitantes se reunieron contra Suwayd ibn Qutba, Khalid ibn al-Walid los engañó: partía de día y regresaba de noche. Se dispersaron, muchos murieron y un grupo se ahogó en el Tigris de Basora."
