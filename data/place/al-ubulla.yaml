summary:
  ar: "عند البلاذري: بلدة قرب البصرة جمع أهلها لسويد بن قطب ة فخدعهم خالد بن الوليد بالانصراف نهاراً والرجوع ليلاً فانكسروا وقتل منهم بشر وغرّق طائفة في دجلة البصرة."
  en: "In al-Baladhuri: a town near Basra whose people gathered against Suwayd ibn Qutba; Khalid ibn al-Walid tricked them — departing by day, returning by night — they broke, many were killed, and a party drowned in Basra's Tigris."
  es: "En al-Baladhuri, una ciudad cercana a Basora, cuyos habitantes se reunieron contra Suwayd ibn Qutba, Khalid ibn al-Walid los engañó: partía de día y regresaba de noche. Se dispersaron, muchos murieron y un grupo se ahogó en el Tigris de Basora."
  fr: "À al-Baladhuri: une ville près de Bassora dont les habitants se sont rassemblés contre Suwayd ibn Qutba; Khalid ibn al-Walid les a trompés — partant le jour, revenant la nuit — ils ont rompu les rangs, beaucoup ont été tués et un groupe s'est noyé dans le Tigre de Bassora."
  ur: "البلادوری میں: بصرہ کے قریب ایک قصبہ جس کے لوگ سوید بن قطبہ کے خلاف جمع ہوئے تھے۔ خالد بن الولید نے انہیں دھوکہ دیا - دن کو روانہ ہوتے تھے، رات کو واپس آتے تھے - وہ ٹوٹ گئے، بہت سے لوگ مارے گئے، اور ایک جماعت بصرہ کے دجلہ میں ڈوب گئی۔"
  tr: "al-Baladhuri'ye göre: Basra yakınlarında bir kasaba. Halkı Suwayd ibn Qutbah tarafından toplanmış, ancak Halid ibn al-Velid gündüz ayrılıp gece geri dönerek onları kandırmış, ancak yenilmiş, bazıları ölmüş ve bir grup Basra Dicle'inde boğulmuştur."
  id: "Menurut al-Baladhuri: sebuah kota dekat Basra. Penduduknya berkumpul oleh Suwayd ibn Qutbah, tetapi Khalid ibn al-Walid menipu mereka dengan pergi pada siang hari dan kembali pada malam hari, namun mereka dikalahkan, beberapa terbunuh, dan sekelompok orang tenggelam di Tigris, Basra."
