summary:
  ar: "ناحية متاخمة لسيسر؛ عند البلاذري أجلاها الجرشي فرفضها أهلها فألجأ أكثرهم ضياعهم إلى قائده همام بن هانيء العبدي فكان يؤدي حق بيت المال حتى توفي ثم عرضها ولده ومحمد بن العباس على المأمون مقبل من خراسان بأن يعطوه رقبتها ويكونوا مزارعين له بشرط التعزيز والمنع من الصعاليك فقبل فصارت من ضياع الخلافة."
  en: "a tract adjacent to Sisar; in al-Baladhuri evacuated by al-Jurashi, its people's estates commended to his commander Hammam ibn Hani', then given in 'neck' to al-Ma'mun — returning from Khurasan — for protection and cultivation, becoming caliphal estates."
  es: "un territorio adyacente a Sisar; en al-Baladhuri evacuado por al-Jurashi, las propiedades de su gente fueron encomendadas a su comandante Hammam ibn Hani', luego entregadas en 'neck' a al-Ma'mun — que regresaba de Khurasan — para su protección y cultivo, convirtiéndose en propiedades califales."
  fr: "une bande de terre adjacente à Sisar; à al-Baladhuri évacuée par al-Jurashi, les terres de ses habitants furent confiées à son commandant Hammam ibn Hani', puis données en « cou » à al-Ma'mun — de retour du Khorasan — pour protection et culture, devenant des terres califales."
  ur: "سیسار سے ملحق ایک راستہ؛ البلادوری میں الجراشی کے ذریعہ خالی کرائے گئے، اس کے لوگوں کی جاگیریں اس کے کمانڈر ہمام بن ہانی کو دی گئیں، پھر المامون کو - خراسان سے واپس آنے والے - تحفظ اور کھیتی کے لیے 'خلیفہ کی جاگیر' بن گئیں۔"
