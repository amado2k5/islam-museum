summary:
  ar: "عند البلاذري: بلدة سميت لأن أهراء العجم كانت بها وكان أصحاب النعمان وصنائعه يعطون أرزاقهم منها؛ حصرها خالد بعد غارة سوق بغداذ وحرق نواحيها فصالحوه وفي خلافة عمر صولحت على طسوجها أربع مائة ألف درهم وألف عباءة قطوانية في السنة بصلح جرير بن عبد الله البجلي ويقال على ثمانين ألفاً."
  en: "In al-Baladhuri: a town named for the Persians' granaries there, whence al-Nu'man's retainers and clients drew rations; Khalid besieged it after the Baghdad-market raid, burning its outskirts until they made peace — and in Umar's caliphate it was pacified on its canals for four hundred thousand dirhams and a thousand Qatawani cloaks yearly under Jarir ibn Abdallah al-Bajali, or eighty thousand it is said."
  es: "En al-Baladhuri: una ciudad que debe su nombre a los graneros persas que allí se encontraban, de donde los sirvientes y clientes de al-Nu'man obtenían sus raciones; Khalid la asedió después del asalto al mercado de Bagdad, incendiando sus alrededores hasta que firmaron la paz; y en el califato de Umar fue pacificada en sus canales a cambio de cuatrocientos mil dirhams y mil mantos de Qatawani al año bajo el mandato de Jarir ibn Abdallah al-Bajali, o ochenta mil según se dice."
  fr: "À al-Baladhuri: une ville ainsi nommée en raison des greniers persans qui s'y trouvaient, d'où les serviteurs et clients d'al-Nu'man tiraient leurs rations; Khalid l'assiégea après le raid du marché de Bagdad, incendiant ses abords jusqu'à ce qu'ils fassent la paix — et sous le califat d'Umar, elle fut pacifiée sur ses canaux pour quatre cent mille dirhams et mille manteaux qatawani par an sous Jarir ibn Abdallah al-Bajali, ou quatre-vingt mille, dit-on."
  ur: "البلادھوری میں: ایک قصبہ جس کا نام وہاں پر فارسیوں کے غلہ کے لیے رکھا گیا تھا، جہاں سے النعمان کے رکھوالے اور مؤکل راشن لیتے تھے۔ بغداد کے بازار کے حملے کے بعد خالد نے اس کا محاصرہ کر لیا، اس کے مضافات کو جلا دیا یہاں تک کہ انہوں نے صلح کر لی - اور عمر کی خلافت میں اسے چار لاکھ درہم اور جریر بن عبداللہ البجلی کے تحت سالانہ ایک ہزار قتاوانی چادروں میں اس کی نہروں پر آرام دیا گیا، یا اسی ہزار کہا جاتا ہے۔"
  tr: "Al-Baladhuri'ye göre: Perslerin Ahara'sı burada yaşadığı için bu kasaba adlandırılmıştır ve Nu'man halkı ile zanaatkarları geçimlerini buradan sağlarlardı; Halid, Ghaddh'daki bir pazara yapılan baskından sonra burayı kuşatmış ve çevresini yakmış, böylece onunla barışmışlardır. Ömer halifeliği sırasında, Jarir ibn Abdullah al-Bajali antlaşmasıyla Tasuj'a dört yüz bin dirhem ve bin Qatwani pelerini yerleştirilmiştir; bu antlaşmanın seksen bin olduğu söylenir."
  id: "Menurut Al-Baladhuri: sebuah kota dinamai karena Ahara milik bangsa Persia tinggal di sana, dan penduduk Nu'man beserta para pengrajinnya digunakan untuk mencari nafkah dari kota itu; Khalid mengepungnya setelah melakukan serangan di pasar di Ghaddh dan membakar sekitarnya, sehingga mereka berdamai dengannya. Selama masa khalifah Umar, empat ratus ribu dirham dan seribu jubah Qatwani ditempatkan di Tasuj berdasarkan perjanjian Jarir ibn Abdullah al-Bajali, yang dikatakan berjumlah delapan puluh ribu."
