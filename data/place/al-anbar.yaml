summary:
  ar: "عند البلاذري: بلدة سميت لأن أهراء العجم كانت بها وكان أصحاب النعمان وصنائعه يعطون أرزاقهم منها؛ حصرها خالد بعد غارة سوق بغداذ وحرق نواحيها فصالحوه وفي خلافة عمر صولحت على طسوجها أربع مائة ألف درهم وألف عباءة قطوانية في السنة بصلح جرير بن عبد الله البجلي ويقال على ثمانين ألفاً."
  en: "In al-Baladhuri: a town named for the Persians' granaries there, whence al-Nu'man's retainers and clients drew rations; Khalid besieged it after the Baghdad-market raid, burning its outskirts until they made peace — and in Umar's caliphate it was pacified on its canals for four hundred thousand dirhams and a thousand Qatawani cloaks yearly under Jarir ibn Abdallah al-Bajali, or eighty thousand it is said."
