summary:
  ar: "بلدة على ساحل قيليقية عند خليج إسكندرونة، وكانت مرفأ مهماً للتجارة بين الغرب والشرق في القرنين الثالث عشر والرابع عشر، ثم تراجعت بتراكم الطمي حتى صارت اليوم يمورتلك {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-828}."
  en: "A town on the Cilician coast at the Gulf of Iskenderun, an important harbour for trade between West and East in the thirteenth and fourteenth centuries. It declined as silt built up, and is today Yumurtalık {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-828}."
  es: "Ciudad situada en la costa de Cilicia, en el golfo de Iskenderun, un importante puerto para el comercio entre Occidente y Oriente durante los siglos XIII y XIV. Entró en decadencia debido a la acumulación de sedimentos y hoy se llama Yumurtalık {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-828}."
  fr: "Ville située sur la côte cilicienne, dans le golfe d'Iskenderun, elle constitua un important port pour le commerce entre l'Occident et l'Orient aux XIIIe et XIVe siècles. Déclinée par l'ensablement, elle porte aujourd'hui le nom de Yumurtalık (voir Encyclopaedia of Islam, vol. 1, p. 827-828)."
