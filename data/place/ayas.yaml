summary:
  ar: "بلدة على ساحل قيليقية عند خليج إسكندرونة، وكانت مرفأ مهماً للتجارة بين الغرب والشرق في القرنين الثالث عشر والرابع عشر، ثم تراجعت بتراكم الطمي حتى صارت اليوم يمورتلك {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-828}."
  en: "A town on the Cilician coast at the Gulf of Iskenderun, an important harbour for trade between West and East in the thirteenth and fourteenth centuries. It declined as silt built up, and is today Yumurtalık {cite:encyclopaedia-of-islam-2 vol. 1 p. 827-828}."
