summary:
  ar: "عاصمة اليونان. ظهر فيها المسلمون لأول مرة سنة 283هـ ⁦(896م)⁩ حين احتل قراصنة مسلمون ⁦(سراسينيون)⁩ المدينة مدة قصيرة، ثم حكمها الفرنجة والكتالان ثم الفلورنسيون، وأخذها السلطان بايزيد لفترة قصيرة، وفتحها محمد الفاتح فصارت تحت الحكم العثماني نحو 330 سنة، وضُمّت إلى مملكة اليونان الحديثة بعد مؤتمر لندن ⁦(1830م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 787}."
  en: "Capital of Greece. Muslims first came into contact with the town in 283 AH (896), when Saracen pirates occupied it briefly. It then passed to western rulers (the Burgundians, the Catalans and the Florentine Acciajuoli), was taken temporarily by Bayazid I in 1397, and came under Ottoman rule when Mehmed II entered it, beginning nearly 330 years of Turkish occupation. It was incorporated into the new kingdom of Greece after the London Conference of 1830 {cite:encyclopaedia-of-islam-2 vol. 1 p. 787}."
  es: "Capital de Grecia. Los musulmanes entraron en contacto con la ciudad por primera vez en el año 283 de la Hégira (896 d. C.), cuando piratas sarracenos la ocuparon brevemente. Posteriormente, pasó a manos de gobernantes occidentales (los borgoñones, los catalanes y los florentinos Acciajuoli), fue tomada temporalmente por Bayezid I en 1397 y quedó bajo dominio otomano cuando Mehmed II entró en ella, dando comienzo a casi 330 años de ocupación turca. Fue incorporada al nuevo reino de Grecia tras la Conferencia de Londres de 1830 {cite:encyclopaedia-of-islam-2 vol. 1 p. 787}."
  fr: "Capitale de la Grèce. Les musulmans entrèrent en contact avec la ville pour la première fois en 283 AH (896), lorsque des pirates sarrasins l'occupèrent brièvement. Elle passa ensuite sous domination occidentale (les Bourguignons, les Catalans et les Florentins Acciajuoli), fut temporairement conquise par Bayezid Ier en 1397, puis tomba sous domination ottomane à l'arrivée de Mehmed II, marquant le début de près de 330 ans d'occupation turque. Elle fut intégrée au nouveau royaume de Grèce après la conférence de Londres de 1830."
  ur: "یونان کا دارالحکومت۔ مسلمانوں کا اس قصبے سے پہلی بار رابطہ 283 ہجری (896) میں ہوا، جب سارسن قزاقوں نے مختصر طور پر اس پر قبضہ کر لیا۔ اس کے بعد یہ مغربی حکمرانوں ⁦(برگنڈیائی، کاتالان اور فلورنٹائن اکیاجولی)⁩ کو منتقل ہوا، جسے بایزید اول نے 1397 میں عارضی طور پر لے لیا تھا، اور جب محمد دوم نے ترک قبضے کے تقریباً 330 سال کا آغاز کیا تو عثمانی حکومت کے تحت آیا۔ اسے 1830 کی لندن کانفرنس کے بعد یونان کی نئی مملکت میں شامل کیا گیا تھا۔ 1 ص۔ 787}۔"
  tr: "Yunanistan'ın başkenti. Müslümanlar ilk olarak 283 Hicri (896 MS) yılında, Müslüman korsanlar (Saracenler) kısa süreliğine şehri işgal ettiğinde ortaya çıktı. Daha sonra şehri Franklar, Katalanlar ve ardından Floransalılar yönetti. Sultan Bayezid kısa bir süre için burayı ele geçirdi ve Fatih Mehmed fethederek yaklaşık 330 yıl boyunca Osmanlı yönetimine girdi. Londra Konferansı'ndan (1830 MS) sonra modern Yunanistan Krallığı'na dahil edildi {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 787}."
  id: "Ibu kota Yunani. Muslim pertama kali muncul di sana pada tahun 283 H (896 M) ketika bajak laut Muslim (Saracen) sempat menduduki kota tersebut. Kota ini kemudian diperintah oleh bangsa Frank, Catalan, dan kemudian Florentine. Sultan Bayezid mengambilnya untuk waktu singkat, dan Mehmed Sang Penakluk menaklukkannya, membawanya di bawah kekuasaan Ottoman selama sekitar 330 tahun. Kota ini diintegrasikan ke dalam Kerajaan Yunani modern setelah Konferensi London (1830 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 787}."
