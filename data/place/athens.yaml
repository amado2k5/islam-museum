summary:
  ar: "عاصمة اليونان. ظهر فيها المسلمون لأول مرة سنة 283هـ (896م) حين احتل قراصنة مسلمون (سراسينيون) المدينة مدة قصيرة، ثم حكمها الفرنجة والكتالان ثم الفلورنسيون، وأخذها السلطان بايزيد لفترة قصيرة، وفتحها محمد الفاتح فصارت تحت الحكم العثماني نحو 330 سنة، وضُمّت إلى مملكة اليونان الحديثة بعد مؤتمر لندن (1830م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 787}."
  en: "Capital of Greece. Muslims first came into contact with the town in 283 AH (896), when Saracen pirates occupied it briefly. It then passed to western rulers (the Burgundians, the Catalans and the Florentine Acciajuoli), was taken temporarily by Bayazid I in 1397, and came under Ottoman rule when Mehmed II entered it, beginning nearly 330 years of Turkish occupation. It was incorporated into the new kingdom of Greece after the London Conference of 1830 {cite:encyclopaedia-of-islam-2 vol. 1 p. 787}."
