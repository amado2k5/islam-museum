summary:
  ar: موضع على الفرات بالشمال من الشام، عسكر فيه معاوية أولاً وقطع عن جيش العراق الماء، ثم وصل إليه علي فعسكر مقابله، وجرت فيه وقعة صفين سنة 37هـ {cite:sallabi-ali-vol2 p. 101}.
  en: A plain on the Euphrates in northern Syria where Muawiya camped first and cut the water from Ali's army; Ali camped opposite, and the battle of Siffin took place there in 37 AH {cite:sallabi-ali-vol2 p. 101}.
  es: "Una llanura en el Éufrates, en el norte de Siria, donde Muawiya acampó primero y cortó el agua al ejército de Ali; Ali acampó enfrente, y la batalla de Siffin tuvo lugar allí en el año 37 de la Hégira {cite:sallabi-ali-vol2 p. 101}."
  fr: "Une plaine sur l'Euphrate dans le nord de la Syrie où Muawiya a campé en premier et a coupé l'eau de l'armée d'Ali; Ali a campé en face, et la bataille de Siffin a eu lieu là en 37 AH {cite:sallabi-ali-vol2 p. 101}."
  ur: "شمالی شام میں فرات کا ایک میدان جہاں معاویہ نے پہلے ڈیرے ڈالے اور علی کی فوج سے پانی کاٹ لیا۔ علی نے مخالف ڈیرے ڈالے اور صفین کی جنگ وہاں 37 ہجری میں ہوئی۔ 101}۔"
