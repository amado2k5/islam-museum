summary:
  ar: "موضع على الفرات بالشمال من الشام، عسكر فيه معاوية أولاً وقطع عن جيش العراق الماء، ثم وصل إليه علي فعسكر مقابله، وجرت فيه وقعة صفين سنة 37هـ {cite:sallabi-ali-vol2 p. 101}."
  en: "A plain on the Euphrates in northern Syria where Muawiya camped first and cut the water from Ali's army; Ali camped opposite, and the battle of Siffin took place there in 37 AH {cite:sallabi-ali-vol2 p. 101}."
