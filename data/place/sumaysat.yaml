  en: "Sumaysat (Samosata) on the Euphrates in the Jazira; Iyad sent Safwan ibn al-Mu'attal and Habib ibn Maslama who mastered villages and forts of its district before its people compounded on the like of al-Ruha's terms, then it apostatised and Iyad returned and besieged it until he took it."
