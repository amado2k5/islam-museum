summary:
  ar: "سميساط على الفرات من أعمال الجزيرة؛ وجّه إليها إياد صفوان بن المعطل وحبيب بن مسلمة فغلبا على قرى وحصون من قراها ثم صالحه أهلها على مثل صلح أهل الرها، ثم كفرت فرجع إليها إياد فحاصرها حتى فتحها."
  en: "Sumaysat (Samosata) on the Euphrates in the Jazira; Iyad sent Safwan ibn al-Mu'attal and Habib ibn Maslama who mastered villages and forts of its district before its people compounded on the like of al-Ruha's terms, then it apostatised and Iyad returned and besieged it until he took it."
  es: "Sumaysat (Samosata) en el Éufrates en el Jazira; Iyad envió a Safwan ibn al-Mu'attal y Habib ibn Maslama, quienes conquistaron aldeas y fortalezas de su distrito antes de que su gente aceptara términos similares a los de al-Ruha, luego apostató e Iyad regresó y la asedió hasta que la tomó."
  fr: "Sumaysat (Samosata) sur l'Euphrate dans la Jazira; Iyad envoya Safwan ibn al-Mu'attal et Habib ibn Maslama qui prirent le contrôle des villages et des forts de son district avant que son peuple ne se soumette aux conditions d'al-Ruha, puis elle apostasia et Iyad revint et l'assiégea jusqu'à ce qu'il la prenne."
  ur: "جزیرہ میں فرات پر سموسات؛ عیاض نے صفوان بن المطلب اور حبیب ابن مسلمہ کو بھیجا جنہوں نے اس کے ضلع کے دیہاتوں اور قلعوں پر قبضہ کر لیا اس سے پہلے کہ اس کے لوگ الروح کی شرائط پر جمع ہو جائیں، پھر یہ مرتد ہو گیا اور عیاض واپس آیا اور اس کا محاصرہ کر لیا یہاں تک کہ اس نے اسے لے لیا۔"
  tr: "Fırat üzerindeki Sumeysat, adanın topraklarının bir parçasıdır; İyad, Safvan ibn al-Mu'tal ve Habib ibn Maslama'yı adaya gönderdi, köyleri ve kaleleri ele geçirdi, ardından halkı Edessa halkı gibi onunla barıştı. Sonra inançsız oldu, bu yüzden Iyad geri döndü ve adayı kuşattı, ta ki fethedilene kadar."
  id: "Sumaysat di Sungai Efrat adalah bagian dari wilayah pulau itu; Iyad mengirim Safwan ibn al-Mu'tal dan Habib ibn Maslama ke sana, menaklukkan desa dan benteng-benteng desanya, lalu rakyatnya berdamai dengannya seperti halnya penduduk Edessa. Kemudian ia menjadi kafir, sehingga Iyad kembali dan mengepungnya hingga ditaklukkan."
