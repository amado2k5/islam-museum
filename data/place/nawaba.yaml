summary:
  ar: "مدينة تبعد عن النيل يسيراً، وتقع فوق خط الاستواء، وأهلها قليلون وتجارتها قليلة، وأرضها حارة جافة؛ ويبعد عنها ستة أيام {cite:nuzhat-al-mushtaq-2002 p. 37}."
  en: "A town a short distance from the Nile, above the equator. Its people and trade are few, and the land is hot and dry; six days from the Nubian capital {cite:nuzhat-al-mushtaq-2002 p. 37}."
  es: "Un pueblo situado a poca distancia del Nilo, al norte del ecuador. Su población y comercio son escasos, y la tierra es cálida y seca; a seis días de la capital nubia {cite:nuzhat-al-mushtaq-2002 p. 37}."
  fr: "Une ville située à proximité du Nil, au nord de l'équateur. Sa population et son commerce sont peu développés, et le climat y est chaud et aride; à six jours de la capitale nubienne {cite: nuzhat-al-mushtaq-2002 p. 37}."
  ur: "خط استوا کے اوپر دریائے نیل سے تھوڑے فاصلے پر ایک قصبہ۔ اس کے لوگ اور تجارت کم ہے، اور زمین گرم اور خشک ہے۔ نیوبیا کے دارالحکومت سے چھ دن {حوالہ: نزہت المشتاق-2002 صفحہ۔ 37}۔"
  tr: "Nil'e çok yakın bir mesafede, ekvatorun üzerinde yer alan, az nüfuslu ve az ticaretin yaşanan, toprakları sıcak ve kuru; altı gün uzaklıkta {cite:Nuzhat-al-Mushtaq-2002, s. 37}."
  id: "Sebuah kota yang terletak tidak jauh dari Sungai Nil, terletak di atas khatulistiwa, dengan sedikit penduduk dan sedikit perdagangan, serta tanahnya panas dan kering; kota ini berjarak enam hari {cite:Nuzhat-al-Mushtaq-2002, hlm. 37}."
