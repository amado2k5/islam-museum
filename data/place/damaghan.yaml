summary:
  ar: "مدينة قومس الرئيسة؛ وجّه سليمان بن عمرو الضبي إلى قومس بعد صلح ابن الزينبدي فلم يمتنعوا وفتحوا أبواب الدامغان أي فتحت بالصلح من غير قتال."
  en: "The chief city of Qumis; when Sulayman ibn Amr al-Dabbi was sent to Qumis after Ibn al-Zaynabi's treaty its people did not resist and opened Damaghan's gates — it was taken by treaty without fighting."
  es: "La ciudad principal de Qumis; cuando Sulayman ibn Amr al-Dabbi fue enviado a Qumis tras el tratado de Ibn al-Zaynabi, su gente no opuso resistencia y abrió las puertas de Damaghan; fue tomada mediante tratado sin luchar."
  fr: "La principale ville de Qumis; lorsque Sulayman ibn Amr al-Dabbi fut envoyé à Qumis après le traité d'Ibn al-Zaynabi, ses habitants ne résistèrent pas et ouvrirent les portes de Damaghan — elle fut prise par traité sans combat."
  ur: "قمیس کا سردار شہر؛ ابن الزینبی کے معاہدے کے بعد جب سلیمان بن عمرو الدبی کو قمس بھیجا گیا تو وہاں کے لوگوں نے مزاحمت نہیں کی اور دمغان کے دروازے کھول دیے - یہ بغیر لڑائی کے معاہدے کے ذریعے لے لیا گیا۔"
