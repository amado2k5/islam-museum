  ar: "نهر عظيم في شمال الهند، يمر شرقي أطراغا ويتصل بالبحر، وعلى ضفته ملوك وجيوش، ويُذكر أن قبيلة من الهند تغتسل فيه وتزعم أن ذنوبها تُغسل. {cite:nuzhat-al-mushtaq-2002 p. 208}"
  en: "A great river in northern India that passes east of Atraghan and reaches the sea; the author notes a people there who wash in it, believing their sins are cleansed. {cite:nuzhat-al-mushtaq-2002 p. 208}"
  es: "Un gran río del norte de la India que pasa al este de Atraghan y desemboca en el mar; el autor menciona a un pueblo que allí se baña, creyendo que sus pecados se purifican con él. {cite:nuzhat-al-mushtaq-2002 p. 208}"
  fr: "Un grand fleuve du nord de l'Inde qui coule à l'est d'Atraghan et se jette dans la mer; l'auteur mentionne un peuple qui s'y lave, croyant que ses péchés sont ainsi purifiés. {cite:nuzhat-al-mushtaq-2002 p. 208}"
