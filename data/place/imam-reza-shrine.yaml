summary:
  ar: "مزار علي بن موسى الرضا في خراسان؛ يذكر ياقوت قبره في طوس وفي قرية سناباذ قربها. {cite:mujam-al-buldan-sader-1995 4 p.49}"
  en: "The shrine of Ali ibn Musa al-Rida in Khurasan. Yaqut places his grave at Tus and at the village of Sanabadh near it. {cite:mujam-al-buldan-sader-1995 4 p.49}"
  ur: "خراسان میں علی بن موسیٰ الرضا کا مزار؛ یاقوت ان کی قبر طوس اور اس کے قریب سناباد گاؤں میں بتاتے ہیں۔ {cite:mujam-al-buldan-sader-1995 4 p.49}"
  es: "El santuario de Ali ibn Musa al-Rida en Jorasán. Yaqut sitúa su tumba en Tus y en la aldea de Sanabadh, cerca de allí. {cite:mujam-al-buldan-sader-1995 4 p.49}"
  fr: "Le sanctuaire d'Ali ibn Musa al-Rida au Khorasan. Yaqut situe sa tombe à Tus et dans le village de Sanabadh, à proximité. {cite:mujam-al-buldan-sader-1995 4 p.49}"
  tr: "Horasan'daki Ali ibn Musa al-Ridha türbesi; Yaqut, Tus'taki ve yakınlardaki Samanab köyündeki mezarından bahseder. {kaynak:Mucam-al-Buldan-Sader-1995 4 s.49}"
  id: "Makam Ali ibn Musa al-Ridha di Khorasan; Yaqut menyebutkan makamnya di Tus dan di desa terdekat Sanabad. {sitasi:mujam-al-buldan-sader-1995 4 hlm.49}"
