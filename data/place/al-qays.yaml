summary:
  ar: "مدينة قديمة حسنة البناء على الضفة الغربية للنيل، فيها قصب السكر وأنواع التمور، وتبعد عن دهروط نحو ثمانية عشر ميلا {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "An old, well-built city on the west bank of the Nile, with sugar cane and many kinds of dates. It is about eighteen miles from Dahrut {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Una ciudad antigua y bien construida en la orilla oeste del Nilo, con caña de azúcar y muchos tipos de dátiles. Está a unos dieciocho kilómetros de Dahrut {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Une ancienne ville bien construite sur la rive ouest du Nil, où l'on cultive la canne à sucre et de nombreuses variétés de dattes. Elle se situe à environ 29 kilomètres de Dahrut {cite:nuzhat-al-mushtaq-2002 p. 124}."
  ur: "دریائے نیل کے مغربی کنارے پر ایک پرانا، اچھی طرح سے بنایا ہوا شہر، جس میں گنے اور کئی قسم کی کھجوریں ہیں۔ یہ دہروت سے تقریباً اٹھارہ میل کے فاصلے پر ہے۔ 124}۔"
  tr: "Nil'in batı kıyısında, şeker kamışı ve çeşitli hurma türlerine ev sahipliği yapan, eski, sağlam inşa edilmiş bir şehirdir ve Dahrut'a yaklaşık on sekiz mil uzaklıktadır {cite:Nuzhat-al-Mushtaq-2002, s. 124}."
  id: "Sebuah kota tua yang dibangun dengan baik di tepi barat Sungai Nil, rumah bagi tebu dan berbagai jenis kurma, dan berjarak sekitar delapan belas mil dari Dahrut {cite:Nuzhat-al-Mushtaq-2002, hlm. 124}."
