summary:
  ar: "مدينة كانت قائمة بذاتها، هدم المصامدة أسوارها، ثم عمرها أهلها بعد ذلك وزرعوا في أرضها لطيب ترابها، وتبعد عن فاس نحو عشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 249}"
  en: "A town that once stood on its own; the Masmuda destroyed its walls, and later people resettled it and farmed its land for the good soil. About twenty miles from Fez. {cite:nuzhat-al-mushtaq-2002 p. 249}"
  es: "Un pueblo que antaño se mantenía independiente; los Masmuda destruyeron sus murallas, y posteriormente otros pobladores lo repoblaron y cultivaron sus tierras por su fértil suelo. A unos treinta kilómetros de Fez. {cite:nuzhat-al-mushtaq-2002 p. 249}"
  fr: "Une ville qui, jadis, était indépendante; les Masmoudha détruisirent ses remparts, puis des habitants s’y relogèrent et cultivèrent ses terres fertiles. À une trentaine de kilomètres de Fès. {cite:nuzhat-al-mushtaq-2002 p. 249}"
  ur: "ایک قصبہ جو کبھی اپنے طور پر کھڑا تھا۔ مسمودا نے اس کی دیواروں کو تباہ کر دیا، اور بعد میں لوگوں نے اسے دوبارہ آباد کیا اور اچھی زمین کے لیے اس کی زمین کاشت کی۔ فیز سے تقریباً بیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 249}"
  tr: "Kendi ayakları üzerinde duran bir şehirdi; Masamada surlarını yıktı, ardından halkı daha sonra burayı yeniden inşa etti ve Fez'e yaklaşık yirmi mil uzaklıktaki güzel toprağıyla arazisini işledi. {kaynak:nuzhat-al-mushtaq-2002 s. 249}"
  id: "Kota ini berdiri sendiri; Masamada merobohkan temboknya, kemudian penduduknya membangunnya kembali dan mengolah tanahnya dengan tanah halus, yang terletak sekitar dua puluh mil dari Fez. {cite:nuzhat-al-mushtaq-2002 hlm. 249}"
