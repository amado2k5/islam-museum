label:
  ar: الموصل
  en: Mosul
summary:
  ar: مدينة على الضفة الغربية من دجلة في شمال بلاد الرافدين قبالة نينوى، وكانت في صدر الإسلام قاعدة ديار ربيعة من إقليم الجزيرة. فتحها العرب سنة 20هـ/641م وجعلها هرثمة بن عرفجة مصرًا، وحكمها الحمدانيون والعقيليون ثم الزنكيون وبدر الدين لؤلؤ، ثم الجلائريون والصفويون والعثمانيون. ضُمّت ولايتها إلى العراق سنة 1925م، وتعد اليوم ثالث أكبر مدن العراق بحسب المقالة.
  en: A city on the west bank of the Tigris in northern Mesopotamia, opposite Nineveh, and in early Islamic times the capital of Diyar Rabi'a in the Jazira. The Arabs took it in 20/641 and Harthama ibn Arfaja made it a garrison city; the Hamdanids, Uqaylids, Zengids and Badr al-Din Lu'lu' ruled it, followed by the Jalayirids, Safavids and Ottomans. Its province was awarded to Iraq in 1925, and the article calls it Iraq's third largest city.
  ur: دجلہ کے مغربی کنارے پر شمالی بین النہرین میں نینوا کے بالمقابل شہر، جو ابتدائی اسلامی دور میں الجزیرہ کے دیار ربیعہ کا صدر مقام تھا۔ عربوں نے اسے 20ھ/641ء میں لیا اور ہرثمہ بن عرفجہ نے اسے چھاؤنی شہر بنایا؛ اس پر حمدانی، عقیلی، زنگی اور بدر الدین لؤلؤ نے حکومت کی، پھر جلائری، صفوی اور عثمانی آئے۔ اس کا صوبہ 1925ء میں عراق کو دیا گیا، اور مضمون اسے عراق کا تیسرا بڑا شہر بتاتا ہے۔
