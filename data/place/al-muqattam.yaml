summary:
  ar: "جبل يمتد من أول أرض مصر في الصحراء حتى قرب أسوان، وتُستخرج من بعض مواضعه المغرة والكلس. يروي المؤلف أن في جبله آثارا قديمة وكنوزا خبأها الملوك، ويعزو إلى رواية متداولة قصة كاهن ارتبط به الجبل {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
  en: "A mountain range running through the desert from the start of Egyptian lands toward Aswan, with ochre and lime quarried from some of its sites. The author says it holds old remains and treasures hidden by kings, and attributes to a circulating story a priest associated with the mountain {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
