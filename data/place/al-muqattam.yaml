label: { ar: "جبل المقطم", en: "Mount al-Muqattam", es: "Monte al-Muqattam", fr: "Mont al-Muqattam", ur: "کوہ المقطم", tr: "Mokattam Dağı", id: "Gunung Mokattam" }
summary:
  ar: "جبل يمتد من أول أرض مصر في الصحراء حتى قرب أسوان، وتُستخرج من بعض مواضعه المغرة والكلس. يروي المؤلف أن في جبله آثارا قديمة وكنوزا خبأها الملوك، ويعزو إلى رواية متداولة قصة كاهن ارتبط به الجبل {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
  en: "A mountain range running through the desert from the start of Egyptian lands toward Aswan, with ochre and lime quarried from some of its sites. The author says it holds old remains and treasures hidden by kings, and attributes to a circulating story a priest associated with the mountain {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
  es: "Una cadena montañosa que atraviesa el desierto desde el inicio de las tierras egipcias hacia Asuán, con canteras de ocre y cal extraídas en algunos de sus yacimientos. El autor afirma que alberga restos antiguos y tesoros escondidos por reyes, y atribuye a una leyenda popular la existencia de un sacerdote asociado a la montaña {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
  fr: "Une chaîne de montagnes traversant le désert depuis l'entrée du territoire égyptien jusqu'à Assouan, d'où l'on extrayait de l'ocre et de la chaux. L'auteur affirme qu'elle recèle d'anciens vestiges et des trésors cachés par des rois, et attribue à une légende locale le lien avec un prêtre associé à cette montagne {cite:nuzhat-al-mushtaq-2002 p. 132} {cite:nuzhat-al-mushtaq-2002 p. 133}."
  ur: "ایک پہاڑی سلسلہ جو صحرا میں مصری سرزمین کے آغاز سے اسوان کی طرف چل رہا ہے، اس کے کچھ مقامات سے گیدر اور چونا نکالا گیا ہے۔ مصنف کا کہنا ہے کہ اس میں پرانی باقیات اور بادشاہوں کے چھپے ہوئے خزانے ہیں، اور ایک گردش کرنے والی کہانی سے منسوب ہے جو پہاڑ سے منسلک ایک پادری ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 132} {حوالہ: نزہت المشتاق-2002 ص۔ 133}۔"
  tr: "Mısır'ın en eski topraklarından Asvan yakınlarına kadar uzanan bir dağ, bazı alanlarında okra ve kireçtaşı bulunur. Yazar, dağında krallar tarafından gizlenmiş antik kalıntılar ve hazineler olduğunu anlatır ve dağın ilişkilendirildiği bir rahibin hikayesini dolaşımda dolaşan bir anlatıma atfeder {cite:Nuzhat-al-Mushtaq-2002 s. 132} {cite:Nuzhat-al-Mushtaq-2002 s. 133}."
  id: "Sebuah gunung yang membentang dari tanah Mesir paling awal di gurun hingga dekat Aswan, dan beberapa situsnya mengandung oker dan batu kapur. Penulis menceritakan bahwa gunungnya berisi reruntuhan kuno dan harta karun yang disembunyikan oleh raja, dan mengaitkan kisah seorang pendeta yang terkait dengan gunung itu dalam sebuah catatan yang beredar {cite:Nuzhat-al-Mushtaq-2002 hlm. 132} {cite:Nuzhat-al-Mushtaq-2002 hlm. 133}."
