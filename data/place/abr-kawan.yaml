summary:
  ar: "أبر كاوان جزيرة في البحر مما يلي فارس؛ فتحها الحكم بن أبي العاص في جيش عبد القيس والأزد وتميم وبني ناجية وهي أول ما فتح من سواحل فارس وتعرف عند العامة ببني كاوان."
  en: "Abr Kawan, the island off Fars first taken by al-Hakam ibn Abi al-As's sea expedition — folk call it Bani Kawan."
  es: "Abr Kawan, la isla frente a Fars que fue tomada por primera vez por la expedición marítima de al-Hakam ibn Abi al-As, es conocida popularmente como Bani Kawan."
  fr: "Abr Kawan, l'île au large de Fars prise en premier par l'expédition maritime d'al-Hakam ibn Abi al-As — les gens l'appellent Bani Kawan."
  ur: "ابر کاون، فارس کا جزیرہ جسے الحکم ابن ابی العاص کی سمندری مہم نے سب سے پہلے اپنے قبضے میں لیا تھا - لوگ اسے بنی کاوان کہتے ہیں۔"
  tr: "Kawan, İran yakınlarındaki denizde bir adaydı; Abd al-Qais, Al-Azd, Tamim ve Banu Naciyyah'ın ordusunda Al-Hakam ibn Abi Al-As tarafından fethedildi. Pers kıyılarından fethedilen ilk adaydı ve yaygın olarak Bani Kawan olarak biliniyordu."
  id: "Kawan adalah sebuah pulau di laut dekat Persia; pulau ini ditaklukkan oleh Al-Hakam ibn Abi Al-As dalam pasukan Abd al-Qais, Al-Azd, Tamim, dan Banu Najiyyah. Pulau ini adalah pulau pertama yang ditaklukkan dari pesisir Persia dan dikenal sebagai Bani Kawan."
