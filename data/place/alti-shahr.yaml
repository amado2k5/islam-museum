label: { ar: "ألتي شهر ⁦(المدن الست)⁩", en: "Alti Shahr ('six towns', Chinese Turkistan)", es: "Alti Shahr ('seis ciudades', Turkestán chino)", fr: "Alti Shahr (« six villes », Turkistan chinois)" }
summary:
  ar: "ألتي شهر، أي «المدن الست»، اسم لجزء من تركستان الصينية ⁦(سنكيانغ)⁩ يضم كوتشا وآق سو وأوش تورفان وكاشغر ويركند وختن، ويبدو أنه ظهر في القرن الثامن عشر، وقد تُضاف إليها يانغي حصار سابعةً {cite:encyclopaedia-of-islam-2 vol. 1 p. 445}."
  en: "Alti Shahr, 'six towns', is a name for part of Chinese Turkistan (Sinkiang) comprising Kucha, Aksu, Ush Turfan, Kashgar, Yarkand and Khotan. It appears to date from the 18th century, and Yangi Hisar is sometimes added as a seventh town {cite:encyclopaedia-of-islam-2 vol. 1 p. 445}."
  es: "Alti Shahr, que significa \"seis ciudades\", es el nombre de una parte del Turquestán chino (Sinkiang) que comprende Kucha, Aksu, Ush Turfan, Kashgar, Yarkand y Khotan. Parece datar del siglo XVIII, y a veces se añade Yangi Hisar como una séptima ciudad {cite:encyclopaedia-of-islam-2 vol. 1 p. 445}."
  fr: "Alti Shahr, « six villes », désigne une partie du Turkestan chinois (Sinkiang) comprenant Kucha, Aksu, Ush Turfan, Kashgar, Yarkand et Khotan. Ce nom semble dater du XVIIIe siècle, et Yangi Hisar y est parfois ajouté comme septième ville (voir Encyclopaedia of Islam, vol. 1, p. 445)."
