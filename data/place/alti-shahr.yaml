label: { ar: "ألتي شهر (المدن الست)", en: "Alti Shahr ('six towns', Chinese Turkistan)" }
summary:
  ar: "ألتي شهر، أي «المدن الست»، اسم لجزء من تركستان الصينية (سنكيانغ) يضم كوتشا وآق سو وأوش تورفان وكاشغر ويركند وختن، ويبدو أنه ظهر في القرن الثامن عشر، وقد تُضاف إليها يانغي حصار سابعةً {cite:encyclopaedia-of-islam-2 vol. 1 p. 445}."
  en: "Alti Shahr, 'six towns', is a name for part of Chinese Turkistan (Sinkiang) comprising Kucha, Aksu, Ush Turfan, Kashgar, Yarkand and Khotan. It appears to date from the 18th century, and Yangi Hisar is sometimes added as a seventh town {cite:encyclopaedia-of-islam-2 vol. 1 p. 445}."
