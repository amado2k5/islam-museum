summary:
  ar: "مدينة كبيرة عامرة في أعلى جبل لا يصعد إليه بسهولة، ليست في طاعة أحد من الملوك، ويذكر المؤلف أنها تبعد عن قلوري سبعة أيام {cite:nuzhat-al-mushtaq-2002 p. 955}."
  en: "A large, populous city on a high mountain that is hard to climb, not under any king's rule; the author gives seven days from Qulārī {cite:nuzhat-al-mushtaq-2002 p. 955}."
  es: "Una ciudad grande y populosa en una montaña alta y difícil de escalar, que no está bajo el dominio de ningún rey; el autor da siete días desde Qulārī {cite:nuzhat-al-mushtaq-2002 p. 955}."
  fr: "Une grande ville peuplée sur une haute montagne difficile à gravir, qui n'est sous la domination d'aucun roi; l'auteur donne sept jours à partir de Qulārī {cite:nuzhat-al-mushtaq-2002 p. 955}."
  ur: "ایک اونچے پہاڑ پر ایک بڑا، آبادی والا شہر جس پر چڑھنا مشکل ہے، کسی بادشاہ کی حکومت میں نہیں۔ مصنف نے قولاری سے سات دن بتائے ہیں۔ 955}۔"
  tr: "En yüksek dağda yer alan büyük bir şehir, kolayca tırmanılamaz, hiçbir kralın emri altında değildir ve yazar Kaluri'ye yedi gün uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 955}."
  id: "Sebuah kota besar di gunung tertinggi yang sulit didaki, tidak berada di bawah perintah raja manapun, dan penulis menyebutkan bahwa kota itu berjarak tujuh hari dari Kaluri {cite:Nuzhat-al-Mushtaq-2002, hlm. 955}."
