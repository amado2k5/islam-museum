summary:
  ar: "جبل الزور ببلاد الداور من نواحي كابل؛ حصر فيه عبد الرحمن بن سمرة الداور فصالحهم ودخل على الزور وهو صنم من ذهب عيناه ياقوتتان فقطع يده وأخذ الياقوتتين وقال دونك الذهب والجوهر إنما أردت أن أعلمك أنه لا يضر ولا ينفع."
  en: "Jabal al-Zur in the Dawar country toward Kabul; Ibn Samura bottled its folk there, truced, and entered on the gold ruby-eyed Zur idol — cutting its hand and taking the rubies to show it 'neither harms nor benefits'."
  es: "Jabal al-Zur, en la región de Dawar, cerca de Kabul; allí Ibn Samura reunió a su gente, firmó una tregua y profanó el ídolo de Zur, de oro y ojos de rubí, cortándole la mano y tomando los rubíes para demostrarle que \"no le causaba ni daño ni beneficio\"."
  fr: "Jabal al-Zur, dans le pays Dawar, en direction de Kaboul; Ibn Samura y a rassemblé ses habitants, a conclu une trêve et s'est attaqué à l'idole de Zur aux yeux de rubis d'or, lui coupant la main et prenant les rubis pour lui montrer qu'il ne lui faisait « ni mal ni bien »."
  ur: "کابل کی طرف داور ملک میں جبل الزور؛ ابن سمرہ نے وہاں اپنے لوگوں کو بوتل میں ڈالا، ٹراس کیا، اور سونے کے یاقوت کی آنکھوں والے ظور کے بت پر داخل ہوا - اس کا ہاتھ کاٹ کر یاقوت لے کر یہ ظاہر کیا کہ 'نہ نقصان ہے نہ فائدہ'۔"
