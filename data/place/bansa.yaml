summary:
  ar: "مدينة كبيرة عامرة خصيبة حصينة كثيرة الزرع، أهلها أهل نجدة في الحروب، وهي عند المؤلف دار مملكة اللمانية {cite:nuzhat-al-mushtaq-2002 p. 874}."
  en: "A large, populous, fertile and fortified city with abundant crops; the author says its people are known for bravery in war and that it was the seat of the realm of the Germans {cite:nuzhat-al-mushtaq-2002 p. 874}."
  es: "Una ciudad grande, populosa, fértil y fortificada con cosechas abundantes; el autor dice que su gente es conocida por su valentía en la guerra y que fue la sede del reino de los germanos {cite:nuzhat-al-mushtaq-2002 p. 874}."
  fr: "Une grande ville peuplée, fertile et fortifiée aux récoltes abondantes; l'auteur dit que ses habitants sont connus pour leur bravoure à la guerre et qu'elle était le siège du royaume des Allemands {cite:nuzhat-al-mushtaq-2002 p. 874}."
  ur: "وافر فصلوں کے ساتھ ایک بڑا، آبادی والا، زرخیز اور قلعہ بند شہر؛ مصنف کا کہنا ہے کہ اس کے لوگ جنگ میں بہادری کے لیے مشہور ہیں اور یہ جرمنوں کی سلطنت کا گڑھ تھا۔ 874}۔"
  tr: "Büyük, refah, verimli ve çok sayıda ürün yetiştiren bir şehir olan bu şehir, halkı savaşlarda destek sağlayan kişilerdi. Yazara göre, Alman Krallığı'nın Dar'ıdır {cite:Nuzhat-al-mushtaq-2002, s. 874}."
  id: "Kota yang besar, makmur, subur, dan berbenteng dengan banyak hasil panen, penduduknya adalah orang yang mendukung dalam peperangan. Menurut penulis, ini adalah Dar Kerajaan Jerman {cite:Nuzhat-al-mushtaq-2002, hlm. 874}."
