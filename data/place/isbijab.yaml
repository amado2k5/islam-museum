  ar: "أسبيجاب حصن في أقصى الشاش؛ فتح قديماً ثم غلب عليه الترك ومعهم قوم من أهل الشاش ثم فتحه نوح بن أسد في خلافة المعتصم وبنى حوله سوراً يحيط بكروم أهله ومزارعهم."
