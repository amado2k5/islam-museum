  fr: "Isbijab, le fort le plus éloigné d'al-Shash; une ancienne conquête perdue face aux Turcs, reprise par Nuh ibn Asad sous al-Mu'tasim, qui entoura de murs les vignes et les fermes de ses habitants."
  ur: "اسبجاب، الشاش کا دور قلعہ؛ ایک پرانی فتح ترکوں سے ہار گئی، جسے نوح بن اسد نے المعتصم کے ماتحت دوبارہ حاصل کیا، جس نے اپنے لوگوں کی انگوروں اور کھیتوں کو دیوار سے لگا دیا۔"
