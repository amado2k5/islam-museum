summary:
  ar: "مدينة في شمال الضفة عند أطراف مرج بن عامر، مركز قضاء منذ العصر العثماني. فيها مسجد فاطمة خاتون الكبير ⁦(الجنينة)⁩ وخان الأحجر، ونشأ فيها مخيم اللاجئين سنة ١٩٥٣ {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
  en: "A town in the northern West Bank at the edge of the Jezreel valley (Marj Ibn Amir), a district centre since Ottoman times. It holds the Fatima Khatun Great Mosque (al-Junayniyya) and the Khan al-Ahjar caravanserai, and its refugee camp was established in 1953 {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
  ur: "مغربی کنارہ کے شمال میں مرج بن عامر کے کنارے ایک شہر، عثمانی دور سے ضلع کا مرکز۔ اس میں فاطمہ خاتون کی عظیم مسجد ⁦(جنینیہ)⁩ اور خان الاحجر کاروانسرائے ہے اور اس کا مہاجرین کیمپ 1953ء میں قائم ہوا {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}۔"
  fr: "Ville du nord de la Cisjordanie au bord de la plaine de Jezréel (Marj Ibn Amir), centre de district depuis l\u2019époque ottomane. Elle abrite la Grande Mosquée Fatima Khatun (al-Junayniyya) et le caravansérail Khan al-Ahjar ; son camp de réfugiés fut établi en 1953 {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
  es: "Ciudad del norte de Cisjordania al borde del valle de Jezreel (Marj Ibn Amir), centro de distrito desde la época otomana. Alberga la Gran Mezquita Fatima Khatun (al-Junayniyya) y el caravansaray Khan al-Ahjar; su campo de refugiados se estableció en 1953 {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
  tr: "Batı Şeria\u2019nın kuzeyinde, Yizreel (Merc İbn Amir) ovasının kenarında bir şehir; Osmanlı döneminden beri sancak merkezi. Fatıma Hatun Ulu Camii (el-Cüneyhiyye) ve Han el-Ahcer kervansarayı buradadır; mülteci kampı 1953\u2019te kuruldu {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
  id: "Kota di Tepi Barat utara di tepi lembah Yizreel (Marj Ibn Amir), pusat distrik sejak masa Utsmaniyah. Di sini berdiri Masjid Agung Fatima Khatun (al-Junayniyya) dan kervansaray Khan al-Ahjar; kamp pengungsinya didirikan 1953 {cite:marom-lajjun-2023}{cite:wafa-news}{cite:travel-palestine}."
