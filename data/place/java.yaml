summary:
  ar: "أكبر جزر الأرخبيل الهندي الشرقي المعروف اليوم بإندونيسيا، ويصفها شكيب أرسلان في الفصل المعنون «الإسلام في جاوى وما جاورها» نقلاً عن محاضرة وكتب هولندية. يذكر أنها كانت تدين قبل الإسلام بالبراهمية والبوذية، وأن الإسلام انتشر فيها بالتجارة والملاحة، وأن ضريح مالك إبراهيم في غريسيك يُعدّ من أقدم القبور الإسلامية المعروفة هناك. ويعرض أرقام السكان والمسلمين كما وردت في الإحصاءات التي نقلها، ويرى أن الحكومة الهولندية كانت تحد من نشر الإسلام وتنظم شؤون المسلمين بقدر ما يخدم سلطتها."
  en: "The largest island of what is now Indonesia. Arslan's chapter on Islam in Java and its neighbours draws on Dutch scholarship and a lecture by Sayyid Isma'il al-Attas. It notes that Brahmanism and Buddhism were the dominant religions before Islam, that Islam spread through trade and seafaring, and that the tomb of Malik Ibrahim at Gresik is among the earliest Muslim graves there. The population figures he gives come from Dutch censuses reported second-hand and need checking."
