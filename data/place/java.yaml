summary:
  ar: "أكبر جزر الأرخبيل الهندي الشرقي المعروف اليوم بإندونيسيا، ويصفها شكيب أرسلان في الفصل المعنون «الإسلام في جاوى وما جاورها» نقلاً عن محاضرة وكتب هولندية. يذكر أنها كانت تدين قبل الإسلام بالبراهمية والبوذية، وأن الإسلام انتشر فيها بالتجارة والملاحة، وأن ضريح مالك إبراهيم في غريسيك يُعدّ من أقدم القبور الإسلامية المعروفة هناك. ويعرض أرقام السكان والمسلمين كما وردت في الإحصاءات التي نقلها، ويرى أن الحكومة الهولندية كانت تحد من نشر الإسلام وتنظم شؤون المسلمين بقدر ما يخدم سلطتها."
  en: "The largest island of what is now Indonesia. Arslan's chapter on Islam in Java and its neighbours draws on Dutch scholarship and a lecture by Sayyid Isma'il al-Attas. It notes that Brahmanism and Buddhism were the dominant religions before Islam, that Islam spread through trade and seafaring, and that the tomb of Malik Ibrahim at Gresik is among the earliest Muslim graves there. The population figures he gives come from Dutch censuses reported second-hand and need checking."
  es: "La isla más grande de lo que hoy es Indonesia. El capítulo de Arslan sobre el islam en Java y sus islas vecinas se basa en estudios académicos neerlandeses y en una conferencia de Sayyid Isma'il al-Attas. Señala que el brahmanismo y el budismo eran las religiones dominantes antes del islam, que este se extendió a través del comercio y la navegación, y que la tumba de Malik Ibrahim en Gresik se encuentra entre las tumbas musulmanas más antiguas de la zona. Las cifras de población que proporciona provienen de censos neerlandeses de segunda mano y requieren verificación."
  fr: "La plus grande île de l'actuelle Indonésie. Le chapitre d'Arslan sur l'islam à Java et dans ses régions voisines s'appuie sur des travaux universitaires néerlandais et une conférence de Sayyid Isma'il al-Attas. Il note que le brahmanisme et le bouddhisme étaient les religions dominantes avant l'islam, que ce dernier s'est répandu grâce au commerce et à la navigation, et que le tombeau de Malik Ibrahim à Gresik compte parmi les plus anciennes sépultures musulmanes de la région. Les chiffres de population qu'il fournit proviennent de recensements néerlandais rapportés de manière indirecte et nécessitent une vérification."
  ur: "اب انڈونیشیا کا سب سے بڑا جزیرہ۔ جاوا اور اس کے پڑوسیوں میں اسلام پر ارسلان کا باب ڈچ سکالرشپ اور سید اسماعیل العطاس کے لیکچر پر مبنی ہے۔ یہ نوٹ کرتا ہے کہ برہمنیت اور بدھ مت اسلام سے پہلے غالب مذاہب تھے، کہ اسلام تجارت اور سمندری سفر کے ذریعے پھیلا، اور یہ کہ گریسک میں ملک ابراہیم کی قبر وہاں کی قدیم ترین مسلمانوں کی قبروں میں سے ہے۔ وہ جو آبادی کے اعداد و شمار دیتا ہے وہ ڈچ مردم شماری سے آتا ہے جو دوسرے ہاتھ کی اطلاع دیتا ہے اور اسے جانچنے کی ضرورت ہے۔"
  tr: "Doğu Hindistan Takımadaları'nın bugün Endonezya olarak bilinen en büyük adası, Shakib Arslan tarafından \"Java ve Çevresinde İslam\" başlıklı bölümde bir Hollandaca konferans ve kitaplara atıfta bulunarak tanımlanmıştır. İslam'dan önce Brahminizm ve Budizm'in uygulandığı, İslam'ın ticaret ve denizcilik yoluyla yayıldığı ve Gressik'teki Malik İbrahim türbesinin bilinen en eski İslami mezarlardan biri olarak kabul edildiği belirtilir. Nüfus ve Müslüman rakamlarını, raporladığı istatistiklerde yer aldığı şekliyle sunar ve Hollanda hükümetinin İslam'ın yayılmasını sınırladığını ve Müslüman işlerini otoritesine hizmet ettiği kadar düzenlediğini savunur."
  id: "Pulau terbesar di Kepulauan India Timur yang kini dikenal sebagai Indonesia, dijelaskan oleh Shakib Arslan dalam bab berjudul \"Islam di Jawa dan Sekitarnya,\" mengutip kuliah dan buku-buku Belanda. Disebutkan bahwa sebelum Islam, Islam mempraktikkan Brahminisme dan Buddha, dan Islam menyebar ke sana melalui perdagangan dan navigasi, dan makam Malik Ibrahim di Gressik dianggap sebagai salah satu makam Islam tertua yang diketahui di sana. Ia menyajikan angka penduduk dan Muslim seperti yang dilaporkan dalam statistik yang dilaporkannya, dan berargumen bahwa pemerintah Belanda membatasi penyebaran Islam dan mengatur urusan Muslim sebanyak mereka melayani otoritasnya."
