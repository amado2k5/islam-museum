summary:
  ar: "الكريون موضع دون الإسكندرية لقيه عنده عمرو بن العاص جموع الروم والقبط الذين تجمّعوا ليغزوه بالفسطاط فهزمهم وقتل منهم مقتلة عظيمة؛ وعنده قال للمسلمين سيروا على بركة الله فمن ركز منكم رمحاً في دار فهي له ولبني أبيه فكانت الدار بين النفسين والثلاثة سكنى أيام رباطهم لا تباع ولا تورث."
  en: "Al-Kiryawn, a place below Alexandria where Amr ibn al-As met the Roman and Copt hosts mustered to strike him at al-Fustat — routing them in a great slaughter; and there he told the Muslims 'go forth with God's blessing — whoever plants his spear in a house, it is his and his sons'', so a house stood shared between two and three souls as ribat-day lodgings, neither sold nor inherited."
  es: "Al-Kiryawn, un lugar cerca de Alejandría donde Amr ibn al-As se enfrentó a las huestes romanas y coptas reunidas para atacarlo en al-Fustat, derrotándolos en una gran matanza; y allí les dijo a los musulmanes: \"Salid con la bendición de Dios; quien plante su lanza en una casa, será suya y de sus hijos\". Así, una casa se compartía entre dos o tres personas como alojamiento diario, sin ser vendida ni heredada."
  fr: "Al-Kiryawn, un lieu situé en contrebas d'Alexandrie où Amr ibn al-As rencontra les armées romaines et coptes rassemblées pour l'attaquer à al-Fustat — les mettant en déroute lors d'un grand massacre; et là, il dit aux musulmans: « Allez-y avec la bénédiction de Dieu — celui qui plante sa lance dans une maison, elle lui appartient, ainsi qu'à ses fils », de sorte qu'une maison était partagée entre deux ou trois âmes comme logement pour le ribat, ni vendue ni héritée."
  ur: "الکریون، اسکندریہ کے نیچے ایک جگہ جہاں عمرو بن العاص نے رومی اور قبطی فوجوں سے ملاقات کی اور اسے الفستات پر حملہ کرنے کے لیے اکٹھا کیا - انہیں ایک عظیم قتل عام میں لے جانا؛ اور وہاں اس نے مسلمانوں سے کہا کہ 'خدا کے فضل کے ساتھ نکلو - جو کوئی اپنا نیزہ کسی گھر میں لگائے گا، وہ اس کا اور اس کے بیٹوں کا ہے'، چنانچہ ایک گھر دو اور تین جانوں کے درمیان رباط دن کے قیام کے طور پر کھڑا ہو گیا، نہ بیچا گیا اور نہ وراثت میں۔"
