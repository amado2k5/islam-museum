summary:
  ar: "الكريون موضع دون الإسكندرية لقيه عنده عمرو بن العاص جموع الروم والقبط الذين تجمّعوا ليغزوه بالفسطاط فهزمهم وقتل منهم مقتلة عظيمة؛ وعنده قال للمسلمين سيروا على بركة الله فمن ركز منكم رمحاً في دار فهي له ولبني أبيه فكانت الدار بين النفسين والثلاثة سكنى أيام رباطهم لا تباع ولا تورث."
  en: "Al-Kiryawn, a place below Alexandria where Amr ibn al-As met the Roman and Copt hosts mustered to strike him at al-Fustat — routing them in a great slaughter; and there he told the Muslims 'go forth with God's blessing — whoever plants his spear in a house, it is his and his sons'', so a house stood shared between two and three souls as ribat-day lodgings, neither sold nor inherited."
