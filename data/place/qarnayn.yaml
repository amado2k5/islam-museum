label: { ar: "القرنين", en: "al-Qarnayn", es: "al-Qarnayn", fr: "al-Qarnayn", ur: "القرنین", tr: "İki boru", id: "Dua tanduk" }
summary:
  ar: "مدينة متوسطة لها سور، ويذكر الإدريسي أنها كانت في سالف الدهر دار رستم ودار ملكه، وتبعد عن سجستان مرحلة على يسار الذاهب إلى خراسان. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  en: "A medium-sized walled city which al-Idrisi says was once the home and seat of Rustam; one stage from Sijistan, on the left of the road to Khurasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  es: "Una ciudad amurallada de tamaño mediano que, según al-Idrisi, fue en su día el hogar y la sede de Rustam; situada a una etapa de Sijistan, a la izquierda del camino a Khurasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  fr: "Une ville fortifiée de taille moyenne qui, selon al-Idrisi, fut jadis la demeure et le siège de Rustam; à une étape de Sijistan, sur la gauche de la route du Khorasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  ur: "ایک درمیانے درجے کی دیواروں والا شہر جس کے بارے میں الادریسی کا کہنا ہے کہ کبھی رستم کا گھر اور مقام تھا۔ سجستان سے ایک مرحلہ، خراسان جانے والی سڑک کے بائیں طرف۔ {حوالہ: نزہت المشتاق-2002 ص۔ 456}"
  tr: "Surlu orta büyüklükte bir şehir. El-İdrisi, buranın antik zamanlarda Rustam'ın ve kralının hanedanı olduğunu ve Horasan'a giden evin solunda bir sahne olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 456}"
  id: "Sebuah kota berukuran sedang dengan tembok. Al-Idrisi menyebutkan bahwa pada zaman dahulu merupakan rumah Rustam dan rumah rajanya, dan merupakan panggung di sebelah kiri yang menuju ke Khorasan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 456}"
