summary:
  ar: "نهران حفرهما مسلمة بن عبد الملك حين تقطع الأرضين المنخفضة الباقي فيها الماء مقابل إنفاقه ثلاثة آلاف ألف درهم على سد البثوق أيام الحجاج ثم أقطعا داود بن علي في الدولة المباركة فابتيعا من ورثته فصارا من ضياع الخلافة."
  en: "Twin canals dug by Maslama ibn Abd al-Malik when granted the lowlands still holding water in return for spending three million dirhams on the dams under al-Hajjaj; granted to Dawud ibn Ali under the Abbasids, then bought from his heirs into the caliphal estates."
  es: "Dos canales gemelos excavados por Maslama ibn Abd al-Malik cuando se le concedieron las tierras bajas que aún contenían agua a cambio de gastar tres millones de dirhams en las represas bajo el mandato de al-Hajjaj; concedidos a Dawud ibn Ali bajo los abasíes, y luego comprados a sus herederos para incorporarlos a las propiedades del califato."
  fr: "Deux canaux jumeaux creusés par Maslama ibn Abd al-Malik lorsqu'il reçut les basses terres encore inondées en échange de trois millions de dirhams dépensés pour les barrages sous al-Hajjaj; accordés à Dawud ibn Ali sous les Abbassides, puis rachetés à ses héritiers pour les domaines califaux."
  ur: "مسلمہ بن عبد الملک کی طرف سے کھودی گئی جڑواں نہریں جب الحجاج کے زیر انتظام ڈیموں پر تیس ملین درہم خرچ کرنے کے عوض نشیبی علاقوں کو پانی فراہم کیا گیا تھا۔ عباسیوں کے تحت داؤد ابن علی کو عطا کیا گیا، پھر اس کے وارثوں سے خلیفہ جات میں خریدا گیا۔"
  tr: "İki alçak arazi kalan suyu kestiğinde, iki alçak arazi iki nehir kazdı; karşılığında Hacc günlerinde Bathuq Barajı'na üç bin dirhem harcadılar. Daha sonra kutsanmış devlet sırasında Davud ibn Ali'yi kesip varislerinden satın aldılar ve böylece halifeliğin kaybına yol açtılar."
  id: "Dua sungai digali oleh Maslama ibn Abd al-Malik ketika kedua tanah rendah tersebut memutus sisa air sebagai imbalan atas pengeluaran tiga ribu dirham untuk Bendungan Bathuq pada masa al-Hajjaj. Kemudian mereka memutus akses Dawud ibn Ali selama masa keberuntungan, membelinya dari ahli warisnya, sehingga menyebabkan hilangnya kekhalifahan."
