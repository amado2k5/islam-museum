summary:
  ar: "مدينة على أرض حجرية مستوية، لم يبق منها الآن إلا قصران في الصحراء، ولا ماء جارٍ فيها ولا حولها، وتبعد عن برقة ست مراحل. {cite:nuzhat-al-mushtaq-2002 p. 311}"
  en: "A town on a level rocky plain, now reduced to two palaces in the desert; it has no running water and no plants around it, and lies six stages from Barqa. {cite:nuzhat-al-mushtaq-2002 p. 311}"
  es: "Un pueblo situado en una llanura rocosa, ahora reducido a dos palacios en el desierto; carece de agua corriente y de vegetación a su alrededor, y se encuentra a seis etapas de Barqa. {cite:nuzhat-al-mushtaq-2002 p. 311}"
  fr: "Une ville située sur un plateau rocailleux, aujourd'hui réduite à deux palais dans le désert; elle est dépourvue d'eau courante et de végétation, et se trouve à six étapes de Barqa. {cite:nuzhat-al-mushtaq-2002 p. 311}"
  ur: "ایک سطحی چٹانی میدان پر ایک قصبہ، اب صحرا میں دو محلات تک کم ہو گیا ہے۔ اس میں نہ بہتا ہوا پانی ہے اور نہ ہی اس کے ارد گرد کوئی پودے ہیں، اور یہ برقع سے چھ منزلوں پر واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 311}"
