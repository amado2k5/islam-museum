summary:
  en: "Constantinople — al-Kustantiniyya to the Arabs — was made the Eastern Roman capital by Constantine in 330 and stood behind its walls through Arab sieges under the Umayyads, a Frankish seizure in 1204, and Ottoman blockades under Bayezid I and Murad II, until Mehmed II took it on 29 May 1453 and made it the Ottoman seat, Istanbul {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
  ar: "القسطنطينية التي عرفها العرب بهذا الاسم جعلها قسطنطين عاصمة الدولة الرومية الشرقية سنة 330م، وصمدت خلف أسوارها في وجه حصارات العرب في الدولة الأموية واستيلاء الفرنج سنة 1204م وحصارات العثمانيين في عهدي بايزيد الأول ومراد الثاني، حتى فتحها محمد الفاتح في 29 مايو 1453م فصارت دار السلطنة العثمانية إسطنبول {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
