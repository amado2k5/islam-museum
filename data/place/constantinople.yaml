summary:
  en: "Constantinople — al-Kustantiniyya to the Arabs — was made the Eastern Roman capital by Constantine in 330 and stood behind its walls through Arab sieges under the Umayyads, a Frankish seizure in 1204, and Ottoman blockades under Bayezid I and Murad II, until Mehmed II took it on 29 May 1453 and made it the Ottoman seat, Istanbul {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
  ar: "القسطنطينية التي عرفها العرب بهذا الاسم جعلها قسطنطين عاصمة الدولة الرومية الشرقية سنة 330م، وصمدت خلف أسوارها في وجه حصارات العرب في الدولة الأموية واستيلاء الفرنج سنة 1204م وحصارات العثمانيين في عهدي بايزيد الأول ومراد الثاني، حتى فتحها محمد الفاتح في 29 مايو 1453م فصارت دار السلطنة العثمانية إسطنبول {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
  es: "Constantinopla —al-Kustantiniyya para los árabes— fue convertida en la capital del Imperio Romano de Oriente por Constantino en el año 330 y se mantuvo tras sus murallas durante los asedios árabes bajo los Omeyas, una toma franca en 1204 y bloqueos otomanos bajo Bayezid I y Murad II, hasta que Mehmed II la tomó el 29 de mayo de 1453 y la convirtió en la sede otomana, Estambul {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
  fr: "Constantinople — al-Kustantiniyya pour les Arabes — fut faite capitale de l'Empire romain d'Orient par Constantin en 330 et resta derrière ses murs malgré les sièges arabes sous les Omeyyades, une prise franque en 1204 et les blocus ottomans sous Bayezid Ier et Murad II, jusqu'à ce que Mehmed II la prenne le 29 mai 1453 et en fasse le siège ottoman, Istanbul {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 570-571}."
  ur: "قسطنطنیہ — عربوں کے لیے الکستنطینیہ — کو قسطنطنیہ نے 330 میں مشرقی روم کا دارالحکومت بنایا تھا اور اس کی دیواروں کے پیچھے امویوں کے دور میں عرب محاصروں کے ذریعے کھڑا تھا، 1204 میں فرینکوں کا قبضہ تھا، اور بایزید اول اور مراد دوئم کے تحت عثمانی ناکہ بندی، جب تک کہ محمود دوئم نے اسے 24 مئی کو فتح نہیں کیا تھا۔ نشست، استنبول {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 5.1 صفحہ 570-571}۔"
  tr: "Arapların bu isimle andığı İstanbul, 330 yılında Doğu Roma İmparatorluğu'nun başkenti yapıldı. Emevi İmparatorluğu'ndaki Arap kuşatmalarına, 1204'te Frankların fethine ve Bayezid I ile Murad II dönemindeki Osmanlı kuşatmalarına karşı duvarlarına dayandı; ta ki 29 Mayıs 1453'te Fatih Mehmed tarafından fethedilene kadar ve İstanbul Osmanlı Sultanlığı'nın merkezi oldu {cite:Encyclopaedia-of-Islam-2 cilt 5.1, s. 570-571}."
  id: "Konstantinopel, sebagaimana dikenal dengan nama ini oleh orang Arab, dijadikan ibu kota Kekaisaran Romawi Timur pada tahun 330 M. Konstantinopel bertahan dari pengepungan Arab di Kekaisaran Umayyah, penaklukan Franka pada tahun 1204 M, dan pengepungan Ottoman selama masa pemerintahan Bayezid I dan Murad II, hingga ditaklukkan oleh Mehmed Sang Penakluk pada 29 Mei 1453, dan menjadi pusat Kesultanan Ottoman Istanbul {cite:Encyclopaedia-of-Islam-2 vol. 5.1, hlm. 570-571}."
