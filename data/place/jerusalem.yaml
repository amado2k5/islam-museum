summary:
  en: "City sacred to Jews, Christians and Muslims; the first qibla of Islam, the destination of the Night Journey in tradition, and surrendered to the Muslims in 637 CE."
  ar: "مدينة مقدسة لدى اليهود والمسيحيين والمسلمين؛ أولى القبلتين، ومنتهى الإسراء في الرواية، وسلّمت للمسلمين سنة 637م. ووصفها ابنها المقدسي نحو 375هـ بأنها «بلدة جمعت الدنيا والآخرة» لا سمّ لبردها ولا أذى لحرّها ولا أحسن من بنيانها ولا أنظف من مسجدها، يحوطها حصن بعضه على جبل والباقي عليه خندق ولها ثمانية أبواب حديد وماؤها أوفر ماء، وذكر عيوبها كما ذكر محاسنها: قذارة الحمامات وغلاء المؤن وضرائب الفنادق وقلة العلماء وكثرة النصارى واليهود حتى خلا المسجد من مجالس العلم {cite:ahsan-al-taqasim p. 142-143}."
