summary:
  en: "City holy to Jews, Christians and Muslims; in Islamic tradition the first qibla and the end of the Night Journey, handed over to the Muslims in the late 630s CE. The Encyclopaedia of Islam divides its Islamic history into three periods: six hundred years of contest, culminating in the Crusades; six hundred years as a provincial holy city under the Mamluks and Ottomans; and the modern period from the 1830s."
  ar: "مدينة مقدسة لدى اليهود والمسيحيين والمسلمين؛ أولى القبلتين، ومنتهى الإسراء في الرواية، وسلّمت للمسلمين سنة 637م. وتقسم دائرة المعارف الإسلامية تاريخها الإسلامي إلى ثلاث مراحل: ستة قرون من التنازع بلغت ذروتها في الحروب الصليبية، ثم ستة قرون بلدةً مقدسة إقليمية في عهد المماليك والعثمانيين، ثم المرحلة الحديثة منذ ثلاثينيات القرن التاسع عشر. ووصفها ابنها المقدسي نحو 375هـ بأنها «بلدة جمعت الدنيا والآخرة» لا سمّ لبردها ولا أذى لحرّها ولا أحسن من بنيانها ولا أنظف من مسجدها، يحوطها حصن بعضه على جبل والباقي عليه خندق ولها ثمانية أبواب حديد وماؤها أوفر ماء، وذكر عيوبها كما ذكر محاسنها: قذارة الحمامات وغلاء المؤن وضرائب الفنادق وقلة العلماء وكثرة النصارى واليهود حتى خلا المسجد من مجالس العلم {cite:ahsan-al-taqasim p. 142-143}."
  ur: "یہودیوں، عیسائیوں اور مسلمانوں کے نزدیک مقدس شہر؛ اسلامی روایت میں پہلا قبلہ اور سفرِ اسراء کی منزل، جو 630 کی دہائی کے اواخر میں مسلمانوں کے سپرد ہوا۔ دائرۃ المعارف اسلامیہ اس کی اسلامی تاریخ کو تین ادوار میں بانٹتا ہے: چھ سو برس کی کشمکش جو صلیبی جنگوں میں عروج کو پہنچی، پھر مملوکوں اور عثمانیوں کے تحت چھ سو برس ایک صوبائی مقدس شہر کے طور پر، اور 1830ء کی دہائی سے جدید دور۔"
