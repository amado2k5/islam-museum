summary:
  en: "City holy to Jews, Christians and Muslims; in Islamic tradition the first qibla and the end of the Night Journey, handed over to the Muslims in the late 630s CE. The Encyclopaedia of Islam divides its Islamic history into three periods: six hundred years of contest, culminating in the Crusades; six hundred years as a provincial holy city under the Mamluks and Ottomans; and the modern period from the 1830s."
  ar: "مدينة مقدسة لدى اليهود والمسيحيين والمسلمين؛ أولى القبلتين، ومنتهى الإسراء في الرواية، وسلّمت للمسلمين سنة 637م. وتقسم دائرة المعارف الإسلامية تاريخها الإسلامي إلى ثلاث مراحل: ستة قرون من التنازع بلغت ذروتها في الحروب الصليبية، ثم ستة قرون بلدةً مقدسة إقليمية في عهد المماليك والعثمانيين، ثم المرحلة الحديثة منذ ثلاثينيات القرن التاسع عشر. ووصفها ابنها المقدسي نحو 375هـ بأنها «بلدة جمعت الدنيا والآخرة» لا سمّ لبردها ولا أذى لحرّها ولا أحسن من بنيانها ولا أنظف من مسجدها، يحوطها حصن بعضه على جبل والباقي عليه خندق ولها ثمانية أبواب حديد وماؤها أوفر ماء، وذكر عيوبها كما ذكر محاسنها: قذارة الحمامات وغلاء المؤن وضرائب الفنادق وقلة العلماء وكثرة النصارى واليهود حتى خلا المسجد من مجالس العلم {cite:ahsan-al-taqasim p. 142-143}."
  ur: "یہودیوں، عیسائیوں اور مسلمانوں کے نزدیک مقدس شہر؛ اسلامی روایت میں پہلا قبلہ اور سفرِ اسراء کی منزل، جو 630 کی دہائی کے اواخر میں مسلمانوں کے سپرد ہوا۔ دائرۃ المعارف اسلامیہ اس کی اسلامی تاریخ کو تین ادوار میں بانٹتا ہے: چھ سو برس کی کشمکش جو صلیبی جنگوں میں عروج کو پہنچی، پھر مملوکوں اور عثمانیوں کے تحت چھ سو برس ایک صوبائی مقدس شہر کے طور پر، اور 1830ء کی دہائی سے جدید دور۔"
  es: "Ciudad santa para judíos, cristianos y musulmanes; en la tradición islámica, la primera qibla y el final del Viaje Nocturno, entregada a los musulmanes a finales de la década de 630 d. C. La Enciclopedia del Islam divide su historia islámica en tres períodos: seiscientos años de conflictos, que culminaron en las Cruzadas; seiscientos años como ciudad santa provincial bajo los mamelucos y los otomanos; y el período moderno a partir de la década de 1830."
  fr: "Ville sainte pour les juifs, les chrétiens et les musulmans; dans la tradition islamique, première qibla et point d’arrivée du Voyage nocturne, elle fut remise aux musulmans à la fin des années 630. L’Encyclopédie de l’Islam divise son histoire islamique en trois périodes: six siècles de conflits, culminant avec les croisades; six siècles comme ville sainte provinciale sous les Mamelouks et les Ottomans; et la période moderne à partir des années 1830."
  tr: "Yahudiler, Hristiyanlar ve Müslümanlar için kutsal bir şehir; iki Kible'den ilki ve rivayetteki nihai el-İsra, 637 yılında Müslümanlara sunulmuştur. İslam Ansiklopedisi, İslam tarihini üç aşamaya ayırır: Haçlı Seferleri'nde doruğa ulaşan altı yüzyıllık çatışma, ardından Memlük ve Osmanlı dönemlerinde altı yüzyıllık bölgesel kutsal kasaba ve 1830'lardan itibaren modern aşama. Oğlu el-Makdisi, yaklaşık 375 H.S. burayı 'bu dünyayla ahireti birleştiren bir kasaba' olarak tanımlamıştır; soğuğu nedeniyle zehir yok, özgürlüğüne zarar vermeyen, kendisinden daha iyi inşa edilmiş olmayan ve camiden daha temizdir. Bir kale ile çevrilidir; bir kısmı bir dağda, geri kalan kısmı ise sekiz demir kapılı hendekli ve daha bol su içerir. Ayrıca kusurlarını ve avantajlarını da belirtmiştir: hamamların pisliği, yüksek erzaklar, otel vergileri, alim kıtlığı ve camide bilgi toplanmalarından yoksun olan Hristiyanlar ve Yahudilerin bolluğu."
  id: "Sebuah kota suci untuk Yahudi, Kristen, dan Muslim; Qibla pertama dari dua Qibla, dan al-Isra tertinggi dalam riwayat, disampaikan kepada Muslim pada tahun 637 M. Ensiklopedia Islam membagi sejarah Islamnya menjadi tiga tahap: enam abad konflik yang berpuncak pada Perang Salib, kemudian enam abad kota suci regional selama era Mamluk dan Ottoman, dan kemudian fase modern sejak tahun 1830-an. Putranya, al-Maqdisi menggambarkannya sekitar tahun 375 H sebagai 'sebuah kota yang menggabungkan dunia ini dan akhirat,' tanpa racun karena dinginnya, tanpa kerusakan bagi kebebasannya, tidak dibangun lebih baik darinya, dan lebih bersih dari masjidnya. Masjid ini dikelilingi oleh sebuah benteng, sebagian berada di atas gunung dan sisanya memiliki parit, dengan delapan gerbang besi dan air yang lebih melimpah. Ia juga menyebutkan kekurangannya serta kelebihannya: kotoran pemandian, persediaan tinggi, pajak hotel, kelangkaan ulama, dan kelimpahan umat Kristen dan Yahudi sehingga masjid itu kekurangan pengumpulan pengetahuan {cite:ahsan-al-taqasim hlm. 142-143}."
