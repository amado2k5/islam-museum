summary:
  ar: "عين بالبديدون قرب طرسوس يخرج منها النهر المعروف بالبديدون، فسرها الروم للمأمون بأنها مد رجليك وقالوا إن اسمها بالعربية الرقة، توفي عليها المأمون سنة ثماني عشرة ومائتين وحمل إلى طرسوس فدفن بها {cite:muruj-al-dhahab p. 399, 435-437}."
  en: "The spring by Tarsus where al-Ma'mun died — glossed by the captives as 'stretch your legs' and 'al-Raqqa' in Arabic {cite:muruj-al-dhahab p. 399, 435-437}."
  es: "El manantial junto a Tarso donde murió al-Ma'mun, descrito por los cautivos como \"estira las piernas\" y \"al-Raqqa\" en árabe {cite:muruj-al-dhahab p. 399, 435-437}."
  fr: "La source près de Tarse où al-Ma'mun est mort — glosée par les captifs comme « étirez vos jambes » et « al-Raqqa » en arabe {cite:muruj-al-dhahab p. 399, 435-437}."
  ur: "ترسوس کا وہ چشمہ جہاں المامون کی موت ہوئی - اسیروں نے 'اپنی ٹانگیں پھیلانا' اور عربی میں 'الرقہ' کے طور پر چمکایا {حوالہ: مروج الذہب صفحہ 399، 435-437}۔"
  tr: "Tarsus yakınlarındaki Al-Budaidun'da inşa edilmiştir; buradan Al-Budaidun olarak bilinen nehir çıkmaktadır. Bizanslılar Al-Ma'mun'a 'bacaklarını esnettiğini' açıkladılar ve Arapça adının 'Al-Raqqa' olduğunu söylediler. Al-Ma'mun, 218 Hicri yılında bu nehirde öldü ve Tarsus'a götürülerek defnedildi {cite:muruj-al-dhahab s. 399, 435-437}."
  id: "Gereja ini dibangun di Al-Budaidun dekat Tarsus, dari mana sungai yang dikenal sebagai Al-Budaidun bermula. Orang Bizantium menjelaskan kepada Al-Ma'mun bahwa ia sedang 'meregangkan kaki' dan mengatakan nama Arabnya adalah 'Al-Raqqa.' Al-Ma'mun meninggal di sana pada tahun 218 H, dan ia dibawa ke Tarsus di mana ia dimakamkan {cite:muruj-al-dhahab hlm. 399, 435-437}."
