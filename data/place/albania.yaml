summary:
  ar: "بلاد ألبانيا، وتسمى في العثمانية أرناؤوطلق؛ بلد على البحر الأدرياتيكي في جنوب شرقي أوروبا، ولغته من أصل هندو أوروبي لا يُعرف لها أدب قبل سنة 1496م، وفيها لهجتا الگيغ والتوسك، ويتكلمها نحو 1,500,000 نسمة في ألبانيا و700,000 في كوسوفو-ميتوهيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 699-700}."
  en: "Albania, called Arnawutluk in Ottoman usage, is a country on the Adriatic in south-eastern Europe. Its language is Indo-European, with no literary records before 1496, and has two main dialects, Geg in the north and Tosk in the south. About 1,500,000 people speak it in Albania and 700,000 in the Kosovo-Metohija area of Yugoslavia {cite:encyclopaedia-of-islam-2 vol. 1 p. 699-700}."
