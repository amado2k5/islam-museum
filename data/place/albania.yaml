label:
  ar: ألبانيا ⁦(أرناؤوطلق)⁩
  en: Albania
  es: "Albania"
  fr: "Albanie"
  ur: "البانیہ"
summary:
  ar: بلاد ألبانيا، وتسمى في العثمانية أرناؤوطلق؛ بلد على البحر الأدرياتيكي في جنوب شرقي أوروبا، ولغته من أصل هندو أوروبي لا يُعرف لها أدب قبل سنة 1496م، وفيها لهجتا الگيغ والتوسك، ويتكلمها نحو 1,500,000 نسمة في ألبانيا و700,000 في كوسوفو-ميتوهيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 699-700}.
  en: Albania, called Arnawutluk in Ottoman usage, is a country on the Adriatic in south-eastern Europe. Its language is Indo-European, with no literary records before 1496, and has two main dialects, Geg in the north and Tosk in the south. About 1,500,000 people speak it in Albania and 700,000 in the Kosovo-Metohija area of Yugoslavia {cite:encyclopaedia-of-islam-2 vol. 1 p. 699-700}.
  es: "Albania, llamada Arnawutluk en la época otomana, es un país situado en la costa adriática del sureste de Europa. Su idioma es indoeuropeo, sin registros literarios anteriores a 1496, y cuenta con dos dialectos principales: el geg en el norte y el tosk en el sur. Aproximadamente 1.500.000 personas lo hablan en Albania y 700.000 en la región de Kosovo y Metohija, en Yugoslavia {cite:encyclopaedia-of-islam-2 vol. 1 p. 699-700}."
  fr: "L'Albanie, appelée Arnawutluk en ottoman, est un pays de l'Adriatique situé en Europe du Sud-Est. Sa langue est indo-européenne, sans aucun document littéraire antérieur à 1496. Elle compte deux dialectes principaux: le geg au nord et le tosk au sud. Environ 1 500 000 personnes la parlent en Albanie et 700 000 au Kosovo-Metohija (ex-Yougoslavie)."
  ur: "البانیہ، جسے عثمانی استعمال میں ارناوتلک کہا جاتا ہے، جنوب مشرقی یورپ میں ایڈریاٹک پر ایک ملک ہے۔ اس کی زبان ہند-یورپی ہے، جس کا 1496 سے پہلے کوئی ادبی ریکارڈ نہیں ہے، اور اس کی دو اہم بولیاں ہیں، شمال میں گیگ اور جنوب میں ٹوسک۔ تقریباً 1,500,000 لوگ اسے البانیہ میں اور 700,000 یوگوسلاویہ کے کوسوو میتوہیجا علاقے میں بولتے ہیں۔ 1 ص۔ 699-700}۔"
