label: { ar: "جزيرة حسران", en: "Hasran Island", es: "Isla Hasran", fr: "Île d'Hasran", ur: "جزیرہ حسان", tr: "Hasran Adası", id: "Pulau Hasran" }
summary:
  ar: "جزيرة واسعة فيها جبل ونهر صغير عذب يجري، وفيها أرض تنبت ما يأكله الناس والبهائم، وذكر الإدريسي أنها جزيرة عامرة. {cite:nuzhat-al-mushtaq-2002 p. 218}"
  en: "A wide island with a mountain and a small sweet-water river running through it; its land yields food for people and animals. Al-Idrisi describes it as inhabited. {cite:nuzhat-al-mushtaq-2002 p. 218}"
  es: "Una isla extensa con una montaña y un pequeño río de agua dulce que la atraviesa; su tierra produce alimento para personas y animales. Al-Idrisi la describe como habitada. {cite:nuzhat-al-mushtaq-2002 p. 218}"
  fr: "Une vaste île traversée par une montagne et une petite rivière d'eau douce; ses terres nourrissent hommes et animaux. Al-Idrisi la décrit comme habitée. {cite:nuzhat-al-mushtaq-2002 p. 218}"
  ur: "ایک وسیع جزیرہ جس میں ایک پہاڑ اور ایک چھوٹا سا میٹھے پانی کا دریا بہتا ہے۔ اس کی زمین انسانوں اور جانوروں کے لیے خوراک پیدا کرتی ہے۔ الادریسی نے اسے آباد قرار دیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 218}"
  tr: "Bir dağ ve küçük bir taze nehir akan geniş bir ada, insanların ve hayvanların yediği toprakları barındırıyor. Al-Idrisi buranın zengin bir ada olduğunu belirtti. {kaynak:nuzhat-al-mushtaq-2002 s. 218}"
  id: "Sebuah pulau luas dengan sebuah gunung dan sungai kecil yang mengalir, dan memiliki tanah yang menanam makanan manusia dan ternak. Al-Idrisi menyebutkan bahwa pulau ini makmur. {cite:nuzhat-al-mushtaq-2002 hlm. 218}"
