summary:
  en: "A large town some seven stages south of Mecca toward Yemen, remembered in the prophetic sources as comprising seventy-three villages and a powerful Christian community whose delegation reached Medina in 9 AH."
  ar: "بلد كبير على نحو سبع مراحل جنوب مكة باتجاه اليمن، وصفته مصادر السيرة بأنه يشتمل على ثلاث وسبعين قرية وجماعة نصرانية عزيزة الجانب ورد وفدها المدينة سنة 9هـ. وكان الأفعى بن الأفعى الجرهمي ملكاً على نجران حين أوصى نزار بن معد بنيه أن يقسم بينهم عنده قسمته {cite:muruj-al-dhahab p. 431}"
  ur: "مکہ سے یمن کی طرف تقریباً سات منزل جنوب میں بڑا قصبہ؛ سیرت کے مصادر میں تہتر بستیوں اور ایک مضبوط مسیحی برادری کا ذکر ہے جس کا وفد 9 ہجری میں مدینہ آیا۔ {cite:mubarakpuri-raheeq}"
