summary:
  ar: "مدينة متوسطة القدر كثيرة الخيرات، على نهر يأتي من جبل البرتاب فيجتاز بجاقة إلى مكناسة، وتبعد عن مكناسة نحو سبعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  en: "A medium-sized city rich in produce, on a river rising in the Partab hills that passes Jaqa; about seventy miles from Muknasa. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  es: "Una ciudad de tamaño mediano, rica en productos agrícolas, situada a orillas de un río que nace en las colinas de Partab y que pasa por Jaqa; a unos setenta kilómetros de Muknasa. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  fr: "Ville de taille moyenne, riche en produits agricoles, située sur une rivière prenant sa source dans les collines de Partab et traversant Jaqa; à environ 110 kilomètres de Muknasa. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  ur: "ایک درمیانے درجے کا شہر جو پیداوار سے مالا مال ہے، پرتاب پہاڑیوں میں سے نکلنے والے دریا پر جو جاکا سے گزرتا ہے؛ مکناسہ سے تقریباً ستر میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 733}"
  tr: "Orta büyüklükte, kutsamalarla dolu bir şehir, Al-Bartab Dağı'ndan gelip Bajaka'dan geçip Meknasa'ya doğru akan bir nehir üzerinde, Meknasa'dan yaklaşık yetmiş mil uzaklıkta. {atıf:Nuzhat-al-mushtaq-2002 s. 733}"
  id: "Sebuah kota berukuran sedang penuh berkat, di sungai yang berasal dari Gunung Al-Bartab, melewati Bajaka ke Meknasa, sekitar tujuh puluh mil dari Meknasa. {cite:Nuzhat-al-Mushtaq-2002 hlm. 733}"
