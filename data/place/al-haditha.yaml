summary:
  ar: "الحديثة قرب الموصل؛ كانت قرية قديمة فيها بيعتان وآبيات النصارى فمصّرها هرثمة بن عرفجة وأسكنها قوماً من العرب فسمت الحديثة لأنها بعد الموصل وبنى نحوها حصناً وقيل سمت حين تحول إليها من تحول من أهل الأنبار لما وليهم ابن الرفيل أيام الحجاج وبنوا بها مسجداً."
  en: "al-Haditha near Mosul — an old village with two churches and Christian cells which Harthama ibn Arfaja made a misr settling Arabs, named 'the New' as it postdated Mosul, with a fort beside it; others say it was named when Anbar folk moved in under Ibn al-Rufayl in al-Hajjaj's days and built its mosque."
