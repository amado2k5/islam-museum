summary:
  ar: "الحديثة قرب الموصل؛ كانت قرية قديمة فيها بيعتان وآبيات النصارى فمصّرها هرثمة بن عرفجة وأسكنها قوماً من العرب فسمت الحديثة لأنها بعد الموصل وبنى نحوها حصناً وقيل سمت حين تحول إليها من تحول من أهل الأنبار لما وليهم ابن الرفيل أيام الحجاج وبنوا بها مسجداً."
  en: "al-Haditha near Mosul — an old village with two churches and Christian cells which Harthama ibn Arfaja made a misr settling Arabs, named 'the New' as it postdated Mosul, with a fort beside it; others say it was named when Anbar folk moved in under Ibn al-Rufayl in al-Hajjaj's days and built its mosque."
  es: "al-Haditha, cerca de Mosul, es un antiguo pueblo con dos iglesias y celdas cristianas que Harthama ibn Arfaja convirtió en un asentamiento árabe, llamado \"el Nuevo\" porque es posterior a Mosul, y tiene un fuerte al lado; otros dicen que recibió ese nombre cuando la gente de Anbar se instaló allí bajo el mando de Ibn al-Rufayl en tiempos de al-Hajjaj y construyó su mezquita."
  fr: "al-Haditha près de Mossoul — un vieux village avec deux églises et des cellules chrétiennes que Harthama ibn Arfaja a transformé en misr, s'installant auprès des Arabes, nommé « le Nouveau » car il est postérieur à Mossoul, avec un fort à côté; d'autres disent qu'il a été nommé ainsi lorsque des habitants d'Anbar s'y sont installés sous Ibn al-Rufayl à l'époque d'al-Hajjaj et ont construit sa mosquée."
  ur: "موصل کے قریب الحدیثہ - ایک پرانا گاؤں جس میں دو گرجا گھر اور عیسائی خلیے تھے جسے حرثمہ بن عرفجہ نے عربوں کو آباد کرنے کے لیے ایک مسر بنایا تھا، جسے 'دی نیو' کا نام دیا گیا تھا جیسا کہ اس نے موصل کو پوسٹ ڈیٹ کیا تھا، اس کے ساتھ ایک قلعہ تھا۔ دوسرے کہتے ہیں کہ اس کا نام اس وقت رکھا گیا جب الحجاج کے زمانے میں انبار کے لوگ ابن الرفیل کے ماتحت چلے گئے اور اس کی مسجد بنائی۔"
  tr: "Musul yakınlarındaki El-Haditha; iki Hristiyan yemin ve ayeti olan eski bir köydü. Mısır'ı Harthama ibn Arfajah bazı Araplar tarafından yerleşilmişti, bu yüzden Musul'dan sonra geldiği için Al-Haditha olarak adlandırıldı. Etrafına bir kale inşa etti ve adını, Hacc döneminde İbn al-Rafail'in iktidara gelmesiyle Anbar'dan bazı kişilerin dönmesinden aldığı söylenir."
  id: "Al-Haditha dekat Mosul; ini adalah desa tua dengan dua janji dan ayat Kristen. Mesirnya, Harthama ibn Arfajah, dihuni oleh beberapa orang Arab, sehingga disebut Al-Haditha karena berasal setelah Mosul. Ia membangun benteng di sekitarnya, dan dikatakan dinamai menurut beberapa orang dari Anbar yang berpindah agama ketika Ibn al-Rafail mengambil alih pada masa al-Hajjaj dan membangun masjid di sana."
