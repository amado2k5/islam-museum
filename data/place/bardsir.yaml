  tr: "Bir suru, hendek ve kapıları olan, birçok pazara sahip bir şehir ve Sircan'a iki aşama uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 439}"
  id: "Sebuah kota dengan tembok, parit, dan gerbang, dengan banyak pasar, dan berjarak dua tahap dari Sirjan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 439}"
