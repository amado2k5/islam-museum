summary:
  ar: "وصفه الإدريسي بأنه يبدأ فوق خط الاستواء بثلاث عشرة درجة، ويمتد غرباً مع الخط مارّاً بالصين والهند والسند وجنوب اليمن إلى باب المندب، وطوله نحو أربعة آلاف وخمس مائة فرسخ، وفيه نحو ثلاث مائة جزيرة {cite:nuzhat-al-mushtaq-2002 p. 9}."
  en: "Al-Idrisi describes this sea as beginning thirteen degrees north of the equator, running west past China, India, Sind and southern Yemen to Bab al-Mandab, about 4,500 farsakhs long, with some three hundred islands {cite:nuzhat-al-mushtaq-2002 p. 9}."
