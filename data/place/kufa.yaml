summary:
  ar: "الكوفة إحدى مدينتين حاميتين أسسهما الإسلام المبكر في العراق، أسسها سعد بن أبي وقاص سنة 17هـ/638م على الضفة اليمنى للفرات قرب الحيرة. كانت قاعدة عسكرية للعرب ومقر خلافة علي، ومسرحًا لثورات كبرى في القرن الأول الهجري، ومهد مدرسة نحوية معروفة. ثم تراجعت بعد نقل العباسيين مركز الحكم إلى بغداد وبعد هجمات القرامطة، وفقدت أهميتها مع ظهور الحلة سنة 495هـ/1101م."
  en: "Kufa was one of the two garrison cities founded by early Islam in Iraq, established by Sa'd ibn Abi Waqqas in 17 AH, 638 CE, on the right bank of the Euphrates near al-Hira. It was a military base of the Arabs, the seat of Ali's caliphate and the scene of major risings in the first Islamic century, and it was the home of a well-known grammatical school. It declined after the Abbasids moved the centre of government to Baghdad and after Qarmatian attacks, and lost its importance with the rise of al-Hilla in 495/1101."
  ur: "کوفہ ان دو فوجی شہروں میں سے ایک تھا جو ابتدائی اسلام نے عراق میں قائم کیے، جسے سعد بن ابی وقاص نے 17ھ/638ء میں فرات کے دائیں کنارے حیرہ کے قریب بنایا۔ یہ عربوں کا فوجی مرکز، علی کی خلافت کا مقام اور پہلی اسلامی صدی کی بڑی بغاوتوں کا میدان تھا، اور ایک معروف نحوی مدرسے کا وطن بھی۔ عباسیوں کے مرکزِ حکومت کو بغداد لے جانے اور قرامطہ کے حملوں کے بعد یہ زوال پذیر ہوا، اور 495ھ/1101ء میں حلہ کے ابھرنے سے اپنی اہمیت کھو بیٹھا۔"
