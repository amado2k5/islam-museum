summary:
  en: "Garrison city in Iraq founded around 638 CE, seat of Ali ibn Abi Talib's caliphate and an early centre of Islamic scholarship."
  ar: "مدينة حامية في العراق أُسست نحو سنة 638م، وكانت مقر خلافة علي بن أبي طالب ومركزًا مبكرًا للعلم. وعند البلاذري في فضلها: كتب عمر إلى أهل الكوفة رأس العرب وقال بالكوفة وجوه الناس وكتب إلى أهل الكوفة إلى رأس الإسلام وقال عمر وذكر الكوفة هم رمح الله وكنز الإيمان وجمجمة العرب يحرزون ثغورهم ويعلون أهل الأمصار وقال سلمان الكوفة قبة الإسلام يأتي على الناس زمان لا يبقى مؤمن إلا وهو بها أو يهوى قلبه إليها وبني مسجدها الجامع ببعض نقض قصور الحيرة التي كانت لآل المنذر وحسبت لأهل الحيرة قيمة ذلك من جزيتهم وأخذ المنصور أهل الكوفة بحفر خندقها وألزم كل امرئ منهم للنفقة عليه أربعين درهماً وكان ذاماً لهم لميلهم إلى الطالبيين وإرجافهم بالسلطان.، وعند المسعودي افتخر أهل الكوفة بمائهم الفرات أنه أعذب المياه وأغذاها وأصح للأجسام من دجلة وأنه خير من النيل، وقالوا إن ماء دجلة يقطع شهوة الرجال ويذهب بصهيل الخيل ويصيب النازلين عليها قحولاً في العظام ويبساً في الجلود إن لم يتدسموا {cite:muruj-al-dhahab p. 320-321}، وعند ابن الجوزي وفي مسجدها علق القرامطة الحجر الأسود على الأسطوانة السابعة منه حين أخذوه سنة 317هـ حتى رده إخوة أبي طاهر سنة 339هـ {cite:muntazam-ibn-al-jawzi p. 659}"
