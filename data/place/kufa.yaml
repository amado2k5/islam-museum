summary:
  en: "Garrison city in Iraq founded around 638 CE, seat of Ali ibn Abi Talib's caliphate and an early centre of Islamic scholarship."
  ar: "مدينة حامية في العراق أُسست نحو سنة 638م، وكانت مقر خلافة علي بن أبي طالب ومركزًا مبكرًا للعلم. وعند البلاذري في فضلها: كتب عمر إلى أهل الكوفة رأس العرب وقال بالكوفة وجوه الناس وكتب إلى أهل الكوفة إلى رأس الإسلام وقال عمر وذكر الكوفة هم رمح الله وكنز الإيمان وجمجمة العرب يحرزون ثغورهم ويعلون أهل الأمصار وقال سلمان الكوفة قبة الإسلام يأتي على الناس زمان لا يبقى مؤمن إلا وهو بها أو يهوى قلبه إليها وبني مسجدها الجامع ببعض نقض قصور الحيرة التي كانت لآل المنذر وحسبت لأهل الحيرة قيمة ذلك من جزيتهم وأخذ المنصور أهل الكوفة بحفر خندقها وألزم كل امرئ منهم للنفقة عليه أربعين درهماً وكان ذاماً لهم لميلهم إلى الطالبيين وإرجافهم بالسلطان."
