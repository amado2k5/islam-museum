label: { ar: "بحيرة الباسفرية", en: "Lake Basafriya", es: "Lago Basafriya", fr: "Lac Basafriya", ur: "جھیل باسفریہ", tr: "Baspsphere Gölü", id: "Danau Baspsphere" }
summary:
  ar: "بحيرة عليها دير للباسفريين، ماؤها مالح، وسمكها كثير، وحول أطرافها قصب وحلفاء ينتفع بها أهل تلك النواحي. {cite:nuzhat-al-mushtaq-2002 p. 424}"
  en: "A lake with a monastery of the Basafriyya on it, salt water and abundant fish; reeds and esparto grass around its edges are used by the local people. {cite:nuzhat-al-mushtaq-2002 p. 424}"
  es: "Un lago con un monasterio de la Basafría en su orilla, de agua salada y con abundante pesca; los juncos y el esparto que rodean sus orillas son utilizados por la población local. {cite:nuzhat-al-mushtaq-2002 p. 424}"
  fr: "Un lac bordé d'un monastère basafriyya, aux eaux salées et poissonneuses; les roseaux et l'alfa qui poussent sur ses rives sont utilisés par les populations locales. {cite:nuzhat-al-mushtaq-2002 p. 424}"
  ur: "ایک جھیل جس پر باسفریہ کی خانقاہ ہے، کھارا پانی اور بہت سی مچھلیاں۔ اس کے کناروں کے ارد گرد سرکنڈے اور ایسپارٹو گھاس کو مقامی لوگ استعمال کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 424}"
  tr: "Boğaziçi için bir manastırı olan bir göl, suyu tuzlu, kalınlığı bol ve kenarlarında bu bölgelerin halkının faydalandığı sazlar ve sazlıklar bulunur. {kaynak:nuzhat-al-mushtaq-2002 s. 424}"
  id: "Sebuah danau dengan biara untuk Bosphorus, airnya asin, ketebalannya melimpah, dan di sekitar tepinya terdapat alang-alang dan alang-alang yang dimanfaatkan oleh masyarakat di wilayah tersebut. {cite:Nuzhat-al-Mushtaq-2002 hlm. 424}"
