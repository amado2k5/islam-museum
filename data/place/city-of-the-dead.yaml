summary:
  ar: "مقبرة أهل مصر، وكانت خِطّة بالفسطاط نزلها بطن من المعافر ثم صارت مقبرة واسعة فيها قبر الإمام الشافعي. {cite:mujam-al-buldan-sader-1995 4 p.317}"
  en: "The burial ground of Egypt, in origin a quarter of Fustat settled by a clan of the Mu'afir; in Yaqut's time it held the tomb of al-Shafi'i in a madrasa. {cite:mujam-al-buldan-sader-1995 4 p.317}"
  ur: "مصر کا قبرستان، جو اصلاً فسطاط کا ایک محلہ تھا؛ یاقوت کے زمانے میں یہاں امام شافعی کا مزار ایک مدرسے میں تھا۔ {cite:mujam-al-buldan-sader-1995 4 p.317}"
  es: "El cementerio de Egipto, originalmente un barrio de Fustat habitado por un clan de los Mu'afir; en tiempos de Yaqut albergaba la tumba de al-Shafi'i en una madrasa. {cite:mujam-al-buldan-sader-1995 4 p.317}"
  fr: "Le cimetière d'Égypte, à l'origine un quartier de Fustat peuplé par un clan des Mu'afir, abritait à l'époque de Yaqut le tombeau d'al-Shafi'i dans une madrasa. {cite:mujam-al-buldan-sader-1995 4 p.317}"
  tr: "Mısır halkının mezarlığı, başlangıçta Fustat'ta bulunuyordu, Ma'afir'in bir kolu tarafından yerleşildi, ardından İmam el-Şafi'i'nin mezarını içeren büyük bir mezarlığa dönüştü. {kaynak:Mujam-al-Buldan-Sader-1995 4 s.317}"
  id: "Pemakaman masyarakat Mesir, yang awalnya terletak di Fustat, dihuni oleh cabang Ma'afir, kemudian menjadi pemakaman besar yang berisi makam Imam al-Shafi'i. {cite:mujam-al-buldan-sader-1995 4 hlm.317}"
