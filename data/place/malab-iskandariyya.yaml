label: { ar: "الملعب بالإسكندرية", en: "the Hippodrome of Alexandria", es: "El Hipódromo de Alejandría", fr: "l'hippodrome d'Alexandrie", ur: "اسکندریہ کا ہپپوڈروم", tr: "Alexandria Stadyumu", id: "Stadion Alexandria" }
summary:
  ar: "ملعب قديم بالإسكندرية كان له عيد يجتمعون إليه كل سنة وتُرمى به كرة فمن وقعت في كمه آل إليه الملك؛ وحضره عمرو بن العاص في الجاهلية فوقعت الكرة في كمه فقالوا أُحرمت العادة إن مثل هذا لا يُملّك — واقعة مشهورة؛ وفي مكان هذا الملعب عمّر بنو خليف قصرهم المنسوب إليهم {cite:umari-masalik-1924 p. 241-242}."
  en: "Alexandria's ancient hippodrome, where a yearly festival threw a ball whose lucky catcher took the kingship; Amr ibn al-As attended it in the jahiliyya and the ball fell into his sleeve — 'the custom is annulled, such a man cannot be made king' — and on its site the Banu Khulayf raised their famous palace {cite:umari-masalik-1924 p. 241-242}."
  es: "El antiguo hipódromo de Alejandría, donde en un festival anual se lanzaba una pelota cuyo afortunado receptor se convertía en rey; Amr ibn al-As asistió a él en la época jahiliyya y la pelota cayó en su manga —«la costumbre queda anulada, un hombre así no puede ser coronado rey»— y en su emplazamiento los Banu Khulayf erigieron su famoso palacio {cite:umari-masalik-1924 p. 241-242}."
  fr: "L'ancien hippodrome d'Alexandrie, où un festival annuel lançait une balle dont le chanceux attrapeur prenait le trône; Amr ibn al-As y assista dans la jahiliyya et la balle tomba dans sa manche — « la coutume est annulée, un tel homme ne peut pas être fait roi » — et sur son site les Banu Khulayf érigèrent leur célèbre palais {cite:umari-masalik-1924 p. 241-242}."
  ur: "اسکندریہ کا قدیم ہپوڈروم، جہاں سالانہ تہوار ایک گیند پھینکتا تھا جس کے خوش قسمت پکڑنے والے نے بادشاہی حاصل کر لی تھی۔ عمرو بن العاص نے جاہلیت میں اس میں شرکت کی اور گیند اس کی آستین میں گر گئی - 'رسم منسوخ ہے، ایسے آدمی کو بادشاہ نہیں بنایا جا سکتا' - اور اس کے مقام پر بنو خلیف نے اپنا مشہور محل کھڑا کیا۔ 241-242}۔"
  tr: "İskenderiye'de eski bir stadyum vardı; her yıl insanlar toplanıp topa top atarlardı. Koluna düşen kim olursa, kral ona bahşedilirdi. Amr ibn al-As, İslam öncesi dönemde bu salona katılırdı ve top koluna düşerdi, 'Gelenek yasaktır, çünkü böyle biri sahip olmaz.' dediler — ünlü bir olay. Bu stadyumun yerine, Ömer bin Halife sarayları onlara atfedilmiştir {atıf:umari-masalik-1924, s. 241-242}."
  id: "Sebuah stadion tua di Alexandria yang dulu memiliki festival di mana orang-orang berkumpul setiap tahun dan melempar bola ke dalamnya. Siapa pun yang jatuh ke lengan bajunya, raja akan memberikannya. Amr ibn al-As menghadirinya pada era pra-Islam, dan bola jatuh ke lengan bajunya, lalu mereka berkata, 'Adat terlarang, karena orang seperti itu tidak memiliki.' — sebuah kejadian terkenal. Di tempat stadion ini, Umar ibn Khalif, istana mereka dikaitkan dengan mereka {cite:umari-masalik-1924, hlm. 241-242}."
