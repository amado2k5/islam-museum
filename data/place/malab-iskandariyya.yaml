label: { ar: "الملعب بالإسكندرية", en: "the Hippodrome of Alexandria" }
summary:
  ar: "ملعب قديم بالإسكندرية كان له عيد يجتمعون إليه كل سنة وتُرمى به كرة فمن وقعت في كمه آل إليه الملك؛ وحضره عمرو بن العاص في الجاهلية فوقعت الكرة في كمه فقالوا أُحرمت العادة إن مثل هذا لا يُملّك — واقعة مشهورة؛ وفي مكان هذا الملعب عمّر بنو خليف قصرهم المنسوب إليهم {cite:umari-masalik-1924 p. 241-242}."
  en: "Alexandria's ancient hippodrome, where a yearly festival threw a ball whose lucky catcher took the kingship; Amr ibn al-As attended it in the jahiliyya and the ball fell into his sleeve — 'the custom is annulled, such a man cannot be made king' — and on its site the Banu Khulayf raised their famous palace {cite:umari-masalik-1924 p. 241-242}."
