summary:
  ar: "قصر النعمان بالبصرة كان للنعمان بن صهبان الراسبي الذي حكم بين مضر وربيعة أيام مات يزيد بن معاوية وزاد فيه عبيد الله بن زياد فقال بئس المال هذا يا أبا حاتم إن كثر الماء غرقت وإن قل عطشت فكان كما قال قل الماء فمات كل من ثم."
  en: "Qasr al-Nu'man at Basra, the seat of al-Nu'man ibn Suhban al-Rasibi who judged between Mudar and Rabi'a when Yazid died; Ubaydallah ibn Ziyad enlarged it and Nu'man foretold 'evil wealth — much water drowns me, little parching' — the water failed and every soul there died."
  es: "Qasr al-Nu'man en Basora, sede de al-Nu'man ibn Suhban al-Rasibi, quien juzgó entre Mudar y Rabi'a cuando murió Yazid; Ubaydallah ibn Ziyad lo amplió y Nu'man predijo 'riqueza maligna: mucha agua me ahoga, poca sed'; el agua cesó y todas las almas que allí se encontraban murieron."
  fr: "Qasr al-Nu'man à Bassora, le siège d'al-Nu'man ibn Suhban al-Rasibi qui jugeait entre Mudar et Rabi'a lorsque Yazid mourut; Ubaydallah ibn Ziyad l'agrandit et Nu'man prédit « richesse maléfique — beaucoup d'eau me noie, peu me dessèche » — l'eau manqua et chaque âme qui s'y trouvait mourut."
  ur: "بصرہ میں قصر النعمان، النعمان بن سحبان الراسیبی کا مقام جو یزید کی وفات کے وقت مدر اور ربیعہ کے درمیان فیصلہ کرتا تھا۔ عبیداللہ ابن زیاد نے اسے بڑا کیا اور نعمان نے پیشین گوئی کی کہ 'بد دولت - بہت پانی مجھے ڈوبتا ہے، تھوڑا سا خشک' - پانی ناکام ہوگیا اور وہاں کی ہر جان مر گئی۔"
  tr: "Basra'daki Nu'man Sarayı, Yezid bin Muaviye öldüğü günlerde Mudar ile Rebi'ah arasında hüküm süren el-Nu'man ibn Sahban el-Rasbi'ye aitti ve Ubeyd Allah ibn Ziyad ekledi: 'Bu servet ne kadar sefil, ey Ebu Hatim. Su bol olursa boğulursun, kıt ise susarsın.' Dedi ki, 'Suyu azalt,' ve sonra herkes öldü."
  id: "Istana Nu'man di Basra milik al-Nu'man ibn Sahban al-Rasbi, yang memerintah antara Mudar dan Rabi'ah pada masa Yazid ibn Muawiyah wafat, dan Ubayd Allah ibn Ziyad menambahkan, 'Betapa malangnya kekayaan ini, wahai Abu Hatim. Jika airnya melimpah, kamu tenggelam, dan jika langka, kamu menjadi haus.' Jadi, seperti yang dia katakan, 'Kurangi airnya,' sehingga semua orang meninggal setelahnya."
