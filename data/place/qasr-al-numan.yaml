summary:
  ar: "قصر النعمان بالبصرة كان للنعمان بن صهبان الراسبي الذي حكم بين مضر وربيعة أيام مات يزيد بن معاوية وزاد فيه عبيد الله بن زياد فقال بئس المال هذا يا أبا حاتم إن كثر الماء غرقت وإن قل عطشت فكان كما قال قل الماء فمات كل من ثم."
  en: "Qasr al-Nu'man at Basra, the seat of al-Nu'man ibn Suhban al-Rasibi who judged between Mudar and Rabi'a when Yazid died; Ubaydallah ibn Ziyad enlarged it and Nu'man foretold 'evil wealth — much water drowns me, little parching' — the water failed and every soul there died."
