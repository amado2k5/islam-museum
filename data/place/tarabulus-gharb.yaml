summary:
  ar: "مدينة حصينة بسور من حجارة بيضاء، حسنة الشوارع متقنة الأسواق، فيها زيتون وتين ونخل وفواكه كثيرة، وقد استفتحها الملك رجار، وهي اليوم في طاعته. {cite:nuzhat-al-mushtaq-2002 p. 297}"
  en: "A fortified city with a wall of white stone, handsome streets and well-made markets, with olives, figs, palms and many fruits; al-Idrisi says King Roger took it, and it is now under his rule. {cite:nuzhat-al-mushtaq-2002 p. 297}"
  es: "Una ciudad fortificada con una muralla de piedra blanca, calles hermosas y mercados bien organizados, con olivos, higueras, palmeras y muchas frutas; al-Idrisi dice que el rey Roger la conquistó y que ahora está bajo su dominio. {cite:nuzhat-al-mushtaq-2002 p. 297}"
  fr: "Une ville fortifiée, entourée de remparts de pierre blanche, avec de belles rues et des marchés bien aménagés, regorgeant d'oliviers, de figuiers, de palmiers et de nombreux fruits; selon al-Idrisi, le roi Roger s'en est emparé et elle est désormais sous son autorité. {cite:nuzhat-al-mushtaq-2002 p. 297}"
  ur: "ایک قلعہ بند شہر جس میں سفید پتھر کی فصیل، خوبصورت گلیاں اور اچھی طرح سے بنی ہوئی مارکیٹیں، زیتون، انجیر، کھجوریں اور بہت سے پھل۔ الادریسی کا کہنا ہے کہ بادشاہ راجر نے اسے لے لیا، اور اب یہ ان کی حکومت میں ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 297}"
