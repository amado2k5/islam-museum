label: { ar: "نمرة", en: "Namira", es: "Namira", fr: "Namira" }
summary:
  ar: "ناحية بعرفة نزل بها النبي قبل الوقوف، وكان منزل الخلفاء بها؛ يذكر الأزرقي عن عطاء أن الصخرة الساقطة بأصل الجبل بنمرة، عن يمين الذاهب إلى عرفة، كان يُلقى عليها ثوب يُستظل به ⁦(الأزرقي، أخبار مكة، ص 27)⁩."
  en: "A district of Arafat where the Prophet alighted before the standing, and which was the encampment of the caliphs. Al-Azraqi cites Ata' that the fallen rock at the foot of the mountain at Namira, on the right of one going to Arafat, used to have a garment thrown over it for shade (al-Azraqi, Akhbar Makka, p. 27)."
  es: "Un distrito de Arafat donde el Profeta descendió antes de la parada, y que fue el campamento de los califas. Al-Azraqi cita a Ata' que la roca caída al pie de la montaña en Namira, a la derecha de quien se dirige a Arafat, solía tener una prenda extendida sobre ella para dar sombra (al-Azraqi, Akhbar Makka, p. 27)."
  fr: "Un quartier d'Arafat où le Prophète descendit avant la levée du pied du temple, et qui servait de campement aux califes. Al-Azraqi cite Ata' selon lequel un vêtement était jeté sur un rocher tombé au pied de la montagne à Namira, sur la droite de celui qui se rend à Arafat, pour se protéger du soleil (al-Azraqi, Akhbar Makka, p. 27)."
