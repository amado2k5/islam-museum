summary:
  ar: "ناحية بعرفة نزل بها النبي قبل الوقوف، وكان منزل الخلفاء بها؛ يذكر الأزرقي عن عطاء أن الصخرة الساقطة بأصل الجبل بنمرة، عن يمين الذاهب إلى عرفة، كان يُلقى عليها ثوب يُستظل به (الأزرقي، أخبار مكة، ص 27)."
  en: "A district of Arafat where the Prophet alighted before the standing, and which was the encampment of the caliphs. Al-Azraqi cites Ata' that the fallen rock at the foot of the mountain at Namira, on the right of one going to Arafat, used to have a garment thrown over it for shade (al-Azraqi, Akhbar Makka, p. 27)."
