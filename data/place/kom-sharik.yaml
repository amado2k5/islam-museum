summary:
  ar: كوم في الطريق من الفسطاط إلى الإسكندرية، قاتل عنده المسلمون الروم ثلاثة أيام، وسُمّي باسم شريك بن سمي {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
  en: A mound on the road from al-Fustat to Alexandria where the Muslims fought the Romans for three days, named after Sharik ibn Sumayy {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
