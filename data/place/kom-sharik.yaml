summary:
  ar: كوم في الطريق من الفسطاط إلى الإسكندرية، قاتل عنده المسلمون الروم ثلاثة أيام، وسُمّي باسم شريك بن سمي {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
  en: A mound on the road from al-Fustat to Alexandria where the Muslims fought the Romans for three days, named after Sharik ibn Sumayy {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}.
  ur: فسطاط سے اسکندریہ کے راستے میں ایک ٹیلا جہاں مسلمانوں نے تین دن رومیوں سے جنگ کی، اور جو شریک بن سمی کے نام سے موسوم ہوا {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}۔
  es: "Un montículo en el camino de al-Fustat a Alejandría donde los musulmanes lucharon contra los romanos durante tres días, llamado así en honor a Sharik ibn Sumayy {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}."
  fr: "Un monticule sur la route d'al-Fustat à Alexandrie où les musulmans ont combattu les Romains pendant trois jours, nommé d'après Sharik ibn Sumayy {cite:futuh-misr-amir-1999 p. 107} {cite:futuh-misr-amir-1999 p. 108}."
  tr: "Fustat'tan İskenderiye'ye giden yolda bir kamptı; burada Roma Müslümanları üç gün boyunca savaştı ve adı Sharik ibn Sami'den alışılmıştır {cite:futuh-misr-amir-1999 s. 107} {cite:futuh-misr-amir-1999, s. 108}."
  id: "Ia berada di sebuah kamp di jalan dari Fustat ke Alexandria, di mana Muslim Romawi bertempur selama tiga hari dan dinamai menurut Sharik ibn Sami {cite:futuh-misr-amir-1999 hlm. 107} {cite:futuh-misr-amir-1999, hlm. 108}."
