summary:
  ar: "بناها جيرون بن سعد بن عاد بدمشق على رواية المسعودي وجمع إليها عمد الرخام والمرمر وشيد بنيانها وسماها إرم ذات العماد، وقد روي عن كعب الأحبار فيها غير هذا، وبقي منها قصر جيرون بنياناً عظيماً بأبواب نحاسية عجيبة عند باب الجامع الأموي حتى سنة ٣٣٢هـ {cite:muruj-al-dhahab p. 449}."
  en: "Iram of the pillars — placed by al-Mas'udi's report at Damascus, built by the 'Adite Jayrun with marble colonnades and still visible in 332 AH as the bronze-doored Jayrun palace beside the Umayyad mosque; Ka'b al-Ahbar gives another account {cite:muruj-al-dhahab p. 449}."
