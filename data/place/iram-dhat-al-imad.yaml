label: { ar: "إرم ذات العماد", en: "Iram dhat al-'imad", es: "Iram dhat al-'imad", fr: "Iram dhat al-'imad", ur: "ارم دات العماد", tr: "Sütunlu İram", id: "Iram dengan pilar-pilar" }
summary:
  ar: "بناها جيرون بن سعد بن عاد بدمشق على رواية المسعودي وجمع إليها عمد الرخام والمرمر وشيد بنيانها وسماها إرم ذات العماد، وقد روي عن كعب الأحبار فيها غير هذا، وبقي منها قصر جيرون بنياناً عظيماً بأبواب نحاسية عجيبة عند باب الجامع الأموي حتى سنة ٣٣٢هـ {cite:muruj-al-dhahab p. 449}. وأنكر ابن خلدون على المفسرين جعلهم إرم اسم مدينة ذات أساطين بناها شداد بن عاد في صحاري عدن في ثلاثمائة سنة وقصورها من الذهب وأساطينها من الزبرجد والياقوت، وذكره الطبري والثعابي والزمخشري، وقال لم يسمع لها خبر من يومئذ في شيء من بقاع الأرض وصحاري عدن في وسط اليمن وعمرانها متعاقب والأدلاء تقص طرقه ولم ينقل عنها خبر ولو قالوا إنها درست فيما درس من الآثار لكان أشبه، ومنهم من يقول إنها دمشق بناءً على أن قوم عاد ملكوها، وقد ينتهي الهذيان ببعضهم إلى أنها غائبة لا يعثر عليها إلا أهل الرياضة والسحر، مزاعم كلها أشبه بالخرافات {cite:muqaddima-ibn-khaldun p. 26}"
  en: "Iram of the pillars — placed by al-Mas'udi's report at Damascus, built by the 'Adite Jayrun with marble colonnades and still visible in 332 AH as the bronze-doored Jayrun palace beside the Umayyad mosque; Ka'b al-Ahbar gives another account {cite:muruj-al-dhahab p. 449}."
  es: "Iram de los pilares — ubicados según el informe de al-Mas'udi en Damasco, construidos por el 'Adita Jayrun con columnatas de mármol y aún visibles en el año 332 AH como el palacio Jayrun de puertas de bronce junto a la mezquita Omeya; Ka'b al-Ahbar ofrece otra versión {cite:muruj-al-dhahab p. 449}."
  fr: "Iram des piliers — placé par le rapport d'al-Mas'udi à Damas, construit par le 'Adite Jayrun avec des colonnades de marbre et encore visible en 332 AH comme le palais Jayrun à porte de bronze à côté de la mosquée omeyyade; Ka'b al-Ahbar donne un autre récit {cite:muruj-al-dhahab p. 449}."
  ur: "ستونوں کا ارم - دمشق میں المسعودی کی رپورٹ کے ذریعہ رکھا گیا ہے، جسے 'عادیت جیرون' نے ماربل کالونیڈ کے ساتھ بنایا تھا اور 332 ہجری میں اب بھی اموی مسجد کے ساتھ پیتل کے دروازے والے جیرون محل کے طور پر نظر آتا ہے۔ کعب الاحبار نے ایک اور روایت بیان کی ہے {حوالہ: مروج الذہب ص۱۱۔ 449}۔"
  tr: "El-Mes'udi'nin rivayetine göre, Şam'da Jairun ibn Sa'd ibn 'Ad tarafından inşa edilmiştir; mermer ve mermer sütunlar toplamış ve yapısını inşa etmiş, ona 'Sütunlu İram' adını vermiştir. Ka'b el-Ahbar'dan farklı olduğu rivayet edilmiştir. Bunlar arasında, Jiron'un sarayı 332 Hicri yılına kadar Emevi Camii kapısında dikkat çekici bakır kapılarla görkemli bir yapı olarak kalmıştır {atıf:muruj-al-dhahab, s. 449}. İbn Haldun, yorumcuları İram'ı, üç yüz yıl önce Aden çöllerinde Shaddad bin 'Ad tarafından inşa edilen, altın saraylar ve peridot ile yakut sütunlarıyla inşa edilen iki sütunlu bir şehrin adı olarak adlandırmakla eleştirmiştir. Al-Tabari, Al-Tha'abi ve Al-Zemakhshari bunu belirterek, o günden itibaren dünyanın hiçbir yerinde ya da Yemen'in orta kesimindeki Aden çöllerinde haber alınmadığını, gelişiminin ardışık olduğunu, rehberlerin onun rotalarını takip ettiğini ancak haber verilmediğini belirtmiştir. Eğer arkeolojik çalışmalarda incelendiğini söyleselerdi, bu daha olası olurdu. Bazıları 'Ad' halkının yönettiği gerçeğine dayanarak Şam olduğunu söylerken, bazıları sadece spor ve büyücülük insanları tarafından yok olduğunu saçmalıkla bitirebilir. Tüm bu iddialar batıl inançlara benzemektedir {atıf:Muqaddima-ibn-khaldun s. 26}"
  id: "Bangunan ini dibangun oleh Jairun ibn Sa'd ibn 'Ad di Damaskus menurut kisah Al-Mas'udi, yang mengumpulkan kolom marmer dan marmer lalu membangun strukturnya, menamainya 'Iram dengan tiang-tiangnya. Diceritakan dari Ka'b al-Ahbar' bahwa ia berbeda. Di antara semua itu, istana Jiron tetap menjadi bangunan megah dengan pintu tembaga yang luar biasa di pintu Masjid Umayyah hingga tahun 332 H {cite:muruj-al-dhahab, hlm. 449}. Ibn Khaldun mengkritik para komentator karena menyebut Iram sebagai nama kota dengan dua pilar yang dibangun oleh Shaddad ibn 'Ad di gurun Aden tiga ratus tahun lalu, dengan istana emas dan pilar peridot serta rubi. Al-Tabari, Al-Tha'abi, dan Al-Zamakhshari menyebutkan hal ini, mengatakan bahwa tidak ada kabar tentang kota itu yang terdengar dari hari itu di mana pun di bumi atau gurun Aden di Yaman tengah, dan perkembangannya berturut-turut, dan para pemandu menelusuri rutenya tetapi tidak ada berita yang dikirimkan. Jika mereka mengatakan itu dipelajari dalam pekerjaan arkeologi, kemungkinan besar hal itu terjadi. Beberapa mengatakan itu adalah Damaskus berdasarkan fakta bahwa orang-orang 'Ad memerintahnya, dan beberapa mungkin mengakhiri dengan omong kosong bahwa itu hanya tidak ada bagi orang-orang yang berolahraga dan sihir. Semua klaim ini menyerupai takhayul {cite:Muqaddima-ibn-khaldun hlm. 26}"
