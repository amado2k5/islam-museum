id: place/iram-dhat-al-imad
class: place
kind: city
label: { ar: "إرم ذات العماد", en: "Iram dhat al-'imad" }
summary:
  ar: "بناها جيرون بن سعد بن عاد بدمشق على رواية المسعودي وجمع إليها عمد الرخام والمرمر وشيد بنيانها وسماها إرم ذات العماد، وقد روي عن كعب الأحبار فيها غير هذا، وبقي منها قصر جيرون بنياناً عظيماً بأبواب نحاسية عجيبة عند باب الجامع الأموي حتى سنة ٣٣٢هـ {cite:muruj-al-dhahab p. 449}. وأنكر ابن خلدون على المفسرين جعلهم إرم اسم مدينة ذات أساطين بناها شداد بن عاد في صحاري عدن في ثلاثمائة سنة وقصورها من الذهب وأساطينها من الزبرجد والياقوت، وذكره الطبري والثعابي والزمخشري، وقال لم يسمع لها خبر من يومئذ في شيء من بقاع الأرض وصحاري عدن في وسط اليمن وعمرانها متعاقب والأدلاء تقص طرقه ولم ينقل عنها خبر ولو قالوا إنها درست فيما درس من الآثار لكان أشبه، ومنهم من يقول إنها دمشق بناءً على أن قوم عاد ملكوها، وقد ينتهي الهذيان ببعضهم إلى أنها غائبة لا يعثر عليها إلا أهل الرياضة والسحر، مزاعم كلها أشبه بالخرافات {cite:muqaddima-ibn-khaldun p. 26}"
  en: "Iram of the pillars — placed by al-Mas'udi's report at Damascus, built by the 'Adite Jayrun with marble colonnades and still visible in 332 AH as the bronze-doored Jayrun palace beside the Umayyad mosque; Ka'b al-Ahbar gives another account {cite:muruj-al-dhahab p. 449}."
