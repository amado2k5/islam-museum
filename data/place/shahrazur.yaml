  ar: "مدينة في سائد العراق إلى جهة الجبل؛ عجز عنها عزرة بن قيس والي حلوان ففتحها عتبة بن فرقد بعد قتال على مثل صلح حلوان وكانت المقارب تصيب الرجل فيموت وصالح أهل الصامغان ودراباذ معها على الجزية والخراج ولم تزل وأعمالها مضمومة إلى الموصل حتى آخر خلافة الرشيد."
  en: "A city on Iraq's upper flank toward the mountain; Uzra ibn Qays failed at it and Utba ibn Farqad took it after fighting on Hulwan's terms — the approach-fever killing Muslims — with al-Samaghan and Darabadh treating alongside; its district stayed joined to Mosul till late in al-Rashid's reign."
