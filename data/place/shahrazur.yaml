summary:
  ar: "مدينة في سائد العراق إلى جهة الجبل؛ عجز عنها عزرة بن قيس والي حلوان ففتحها عتبة بن فرقد بعد قتال على مثل صلح حلوان وكانت المقارب تصيب الرجل فيموت وصالح أهل الصامغان ودراباذ معها على الجزية والخراج ولم تزل وأعمالها مضمومة إلى الموصل حتى آخر خلافة الرشيد."
  en: "A city on Iraq's upper flank toward the mountain; Uzra ibn Qays failed at it and Utba ibn Farqad took it after fighting on Hulwan's terms — the approach-fever killing Muslims — with al-Samaghan and Darabadh treating alongside; its district stayed joined to Mosul till late in al-Rashid's reign."
  es: "Una ciudad situada en el flanco superior de Irak, cerca de la montaña; Uzra ibn Qays fracasó en su intento y Utba ibn Farqad la conquistó tras luchar en los términos de Hulwan —la fiebre del acercamiento que mataba a los musulmanes— con al-Samaghan y Darabadh combatiendo paralelamente; su distrito permaneció unido a Mosul hasta finales del reinado de al-Rashid."
  fr: "Une ville située sur le flanc nord de l'Irak, en direction de la montagne; Uzra ibn Qays échoua à la prendre et Utba ibn Farqad s'en empara après avoir combattu selon les conditions de Hulwan — la fièvre de l'approche tuant des musulmans — avec al-Samaghan et Darabadh combattant à ses côtés; son district resta rattaché à Mossoul jusqu'à la fin du règne d'al-Rashid."
  ur: "پہاڑ کی طرف عراق کے بالائی کنارے پر ایک شہر؛ عذرا بن قیس اس میں ناکام رہے اور عتبہ ابن فرقد نے حلوان کی شرائط پر لڑنے کے بعد اسے لے لیا - جس میں مسلمانوں کو مارا جانے والا بخار - السمغان اور دارباد کے ساتھ ساتھ علاج کر رہے تھے۔ اس کا ضلع الرشید کے دور حکومت کے آخر تک موصل میں شامل رہا۔"
