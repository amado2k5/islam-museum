summary:
  ar: "مدينة في الأردن من فلسطين، عند سفوح جبل الجلبوع غربي نهر الأردن؛ قربها وقعت وقعة عين جالوت سنة ثمان وخمسين وستمائة {cite:shadharat-dhahab p. 299}."
  en: "Jordan-valley town of Palestine at the foot of Mount Gilboa, west of the river; near it the battle of Ayn Jalut was fought in 658 {cite:shadharat-dhahab p. 299}."
  es: "Ciudad palestina del valle del Jordán, al pie del monte Gilboa, al oeste del río; cerca de ella se libró la batalla de Ayn Jalut en 658 {cita:shadharat-dhahab p. 299}."
  fr: "Ville de la vallée du Jourdain en Palestine, au pied du mont Gilboa, à l'ouest du fleuve; près d'elle s'est déroulée la bataille d'Ayn Jalut en 658 {cite: shadharat-dhahab p. 299}."
  ur: "دریا کے مغرب میں کوہ گلبوہ کے دامن میں فلسطین کا اردن وادی شہر؛ اس کے قریب عین جالوت کی جنگ 658 میں لڑی گئی تھی۔ 299}۔"
  tr: "Filistin'de, Ürdün Nehri'nin batısındaki Gilboa Dağı'nın eteklerinde yer alan bir şehir; yakınında, 658 yılında Ein Jalut Muharebesi gerçekleşmiştir {cite:shadharat-dhahab, s. 299}."
  id: "Sebuah kota di Yordania, Palestina, di kaki bukit Gunung Gilboa sebelah barat Sungai Yordan; di dekatnya, terjadi Pertempuran Ein Jalut pada tahun 658 {cite:shadharat-dhahab, hlm. 299}."
