summary:
  ar: "مدينة على ساحل البحر تبعد عن أنطاكية خمسة وأربعين ميلاً، وبها مرسى حسن، وينقل منها المتاع إلى الشام. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  en: "A coastal town forty-five miles from Antioch with a good harbour, from which goods are carried into Syria. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  es: "Una ciudad costera a cuarenta y cinco millas de Antioquía con un buen puerto, desde donde se transportan mercancías a Siria. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  fr: "Ville côtière située à quarante-cinq milles d'Antioche, dotée d'un bon port d'où sont acheminées des marchandises vers la Syrie. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  ur: "انطاکیہ سے پینتالیس میل دور ایک ساحلی قصبہ جس میں ایک اچھی بندرگاہ ہے جہاں سے سامان شام لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 646}"
