summary:
  ar: "مدينة على ساحل البحر المتصل بالقلزم، في أرض الحبشة. وأهلها كثيرون، وتأتيها المراكب بأنواع من التجارات، ويخرج منها الرقيق والفضة، والذهب فيها قليل {cite:nuzhat-al-mushtaq-2002 p. 44}."
  en: "A city on the coast of Abyssinia, on the sea that joins the Red Sea. Many people live there and ships bring many kinds of trade. Slaves and silver leave from it; gold is scarce {cite:nuzhat-al-mushtaq-2002 p. 44}."
