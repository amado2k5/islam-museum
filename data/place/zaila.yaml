summary:
  ar: "مدينة على ساحل البحر المتصل بالقلزم، في أرض الحبشة. وأهلها كثيرون، وتأتيها المراكب بأنواع من التجارات، ويخرج منها الرقيق والفضة، والذهب فيها قليل {cite:nuzhat-al-mushtaq-2002 p. 44}."
  en: "A city on the coast of Abyssinia, on the sea that joins the Red Sea. Many people live there and ships bring many kinds of trade. Slaves and silver leave from it; gold is scarce {cite:nuzhat-al-mushtaq-2002 p. 44}."
  es: "Una ciudad en la costa de Abisinia, en el mar que une con el Mar Rojo. Allí viven muchas personas y los barcos traen consigo diversos tipos de comercio. De ella parten esclavos y plata; el oro escasea {cite:nuzhat-al-mushtaq-2002 p. 44}."
  fr: "Une ville côtière d'Abyssinie, sur la mer qui rejoint la mer Rouge. Densément peuplée, elle voit transiter des navires chargés de marchandises diverses. On y exporte des esclaves et de l'argent; l'or y est rare {cite: nuzhat-al-mushtaq-2002 p. 44}."
