summary:
  ar: "مدينة من منابر المرية، لها أسواق وصناعات وحروث ومزارع، وتبعد عن المرية بمسيرة يومين في البر. {cite:nuzhat-al-mushtaq-2002 p. 563}"
  en: "One of the towns with pulpits around Almeria, with markets, crafts, tilled land and farms; two days' journey by land from Almeria. {cite:nuzhat-al-mushtaq-2002 p. 563}"
  es: "Una de las localidades con púlpitos en los alrededores de Almería, con mercados, artesanía, tierras cultivadas y granjas; a dos días de viaje por tierra desde Almería. {cite:nuzhat-al-mushtaq-2002 p. 563}"
  fr: "L'une des villes dotées de chaires aux alentours d'Almería, avec ses marchés, son artisanat, ses terres cultivées et ses fermes; à deux jours de route d'Almería. {cite:nuzhat-al-mushtaq-2002 p. 563}"
  ur: "المیریا کے ارد گرد منبروں والے قصبوں میں سے ایک، بازار، دستکاری، کھیت والی زمین اور کھیت؛ المیریا سے زمین کے ذریعے دو دن کا سفر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 563}"
  tr: "Almería'nın platformlarının şehri, pazarları, sanayileri, sabanlık ve çiftlikleri vardır ve Almería'dan kara yoluyla iki günlük bir yolculuktur. {kaynak:nuzhat-al-mushtaq-2002 s. 563}"
  id: "Ini adalah kota dengan platform Almería, dengan pasar, industri, bajak, dan pertanian, serta perjalanan darat dari Almería selama dua hari. {cite:nuzhat-al-mushtaq-2002 hlm. 563}"
