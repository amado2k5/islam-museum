  en: Darabjird of Fars — the banner-town of its people and seat of their religion under the Hirbadh; Uthman truced it on
    payment, its folk equal with Fars's surrendered towns.
  es: "Darabjird de Fars, la ciudad insignia de su pueblo y sede de su religión bajo el Hirbadh; Uthman la sometió a una tregua a cambio de un pago, y su gente quedó en igualdad de condiciones con las ciudades de Fars que se habían rendido."
  fr: "Darabjird de Fars — la ville bannière de son peuple et le siège de sa religion sous le Hirbadh; Uthman lui fit une trêve moyennant paiement, ses habitants étant égaux aux villes de Fars qui s'étaient rendues."
