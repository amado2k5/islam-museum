summary:
  ar: "مدينة حصينة، وأبنيتها من حجر لقلة الخشب، وينزلها العمال والولاة، وفيها مياسير ذوو أموال، وهي أكبر مدن كرمان، ويصفها الإدريسي بعفة أهلها وحسن معاملتهم. {cite:nuzhat-al-mushtaq-2002 p. 433}"
  en: "A fortified city built of stone for lack of timber, where governors and officials stay; its wealthy people are known for their modesty and fair dealing, and it is the largest city of Kerman in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 433}"
  es: "Una ciudad fortificada construida de piedra por falta de madera, donde residen gobernadores y funcionarios; sus habitantes adinerados son conocidos por su modestia y honestidad, y es la ciudad más grande de Kerman según el relato de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 433}"
  fr: "Ville fortifiée construite en pierre faute de bois, où résident gouverneurs et fonctionnaires, ses habitants aisés sont réputés pour leur modestie et leur équité. Selon al-Idrisi, c'est la plus grande ville de Kerman. {cite:nuzhat-al-mushtaq-2002 p. 433}"
  ur: "لکڑی کی کمی کی وجہ سے پتھر سے بنا ہوا قلعہ بند شہر، جہاں گورنر اور اہلکار قیام پذیر ہوتے ہیں۔ اس کے امیر لوگ اپنی شائستگی اور منصفانہ سلوک کے لیے مشہور ہیں، اور یہ الادریسی کے حساب سے کرمان کا سب سے بڑا شہر ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 433}"
  tr: "Ahşap kıtlığı nedeniyle taş binalara sahip, işçiler ve valiler tarafından yerleşilen tahkimatlı bir şehirdir ve zengin kişilerin tahkimatlarına sahiptir. Kerman'ın en büyük şehri olup, El-İdrisi burayı halkının iffetli ve iyi muamelesi olarak tanımlar. {kaynak:Nuzhat-al-mushtaq-2002 s. 433}"
  id: "Ini adalah kota benteng, dengan bangunan batu karena kelangkaan kayu, dihuni oleh pekerja dan gubernur, serta memiliki benteng orang-orang kaya. Ini adalah kota terbesar di Kerman, dan Al-Idrisi menggambarkannya sebagai kesucian dan perlakuan baik terhadap penduduknya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 433}"
