  tr: "Araştırmacılara göre Medine'den üç mil uzaklıktaki bir yer; Peygamber orada kaldı ve Ali bin Ebi Talib onu takip etti."
  id: "Sebuah tempat tiga mil dari Madinah menurut para peneliti; Nabi tinggal di sana, dan Ali ibn Abi Talib mengikutinya."
