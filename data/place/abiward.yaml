summary:
  ar: "أبورد بلد بخراسان؛ قدم بهمتة عظيمها على ابن عامر فصالحه على أربعمائة ألف ويقال وجه إليها عبد الله بن خازم فصالح أهلها على أربعمائة ألف درهم."
  en: "Abiward of Khurasan; its great Bahmana truced Ibn Amir at four hundred thousand — or Ibn Khazim's mission fixed its people at the same."
  es: "Abiward de Jorasán; su gran Bahmana pactó una tregua con Ibn Amir por cuatrocientos mil, o la misión de Ibn Khazim fijó a su gente en la misma cantidad."
  fr: "Abiward du Khorasan; son grand Bahmana a fait trêve à Ibn Amir à quatre cent mille — ou la mission d'Ibn Khazim a fixé son peuple au même nombre."
  ur: "خراسان کا ابیوارڈ؛ اس کے عظیم بہمن نے ابن عامر کو چار لاکھ پر شکست دی یا ابن خزیم کے مشن نے اس کے لوگوں کو اسی پر طے کیا۔"
  tr: "Ebu Rud Horasan'da bir kasabadır; cömertçe İbn Amir'e yaklaştı ve onunla dört yüz bin dolar barış yaptı. Söylenir ki, Abdullah ibn Hazım buraya atanmış ve halkını dört yüz bin dirhem karşılığında uzlaştırmıştır."
  id: "Abu Rud adalah sebuah kota di Khorasan; ia dengan murah hati mendekati Ibn Amir dan berdamai dengannya dengan upah empat ratus ribu. Dikatakan bahwa Abdullah ibn Khazim diangkat ke sana dan mendamaikan rakyatnya dengan upacara empat ratus ribu dirham."
