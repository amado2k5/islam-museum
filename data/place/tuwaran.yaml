summary:
  ar: "مدينة حصينة لها فرج ومتنزه، وهي قصبة واد فيه مزارع وعمارات، وتقع قرب الفهرج من بلاد كرمان. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  en: "A fortified city with gardens and open spaces, capital of a valley of fields and buildings, near Fahraj in Kerman. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  es: "Ciudad fortificada con jardines y espacios abiertos, capital de un valle de campos y edificios, cerca de Fahraj en Kerman. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  fr: "Une ville fortifiée avec des jardins et des espaces ouverts, capitale d'une vallée de champs et de bâtiments, près de Fahraj dans le Kerman. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  ur: "باغات اور کھلی جگہوں کے ساتھ ایک قلعہ بند شہر، کرمان میں فہراج کے قریب کھیتوں اور عمارتوں کی وادی کا دارالحکومت۔ {حوالہ: نزہت المشتاق-2002 ص۔ 175}"
  tr: "Bahçesi ve parkı olan tahkimatlı bir şehir olan bu şehir, Kirman bölgesindeki Al-Fahraj yakınlarında yer alan, çiftlikler ve binalarla dolu bir vadi kasbahıdır. {cite:nuzhat-al-mushtaq-2002 s. 175}"
  id: "Kota benteng dengan taman dan taman ini adalah sebuah kabah lembah dengan lahan pertanian dan bangunan, terletak dekat Al-Fahraj di wilayah Kerman. {cite:nuzhat-al-mushtaq-2002 hlm. 175}"
