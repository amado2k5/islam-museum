  ar: "مدينة عامرة آهلة، لها أسوار حصينة وسوق نظيفة، وبها تجارات وفعلة لضروب من الصناعات، وتبعد عن وادي آش ثلاثين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  en: "A populous, inhabited city with strong walls, a clean market, trade and crafts of many kinds; thirty miles from Wadi Ash. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  es: "Una ciudad populosa y habitada, con sólidas murallas, un mercado limpio, comercio y artesanía de diversa índole; a treinta millas de Wadi Ash. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  fr: "Une ville peuplée et densément peuplée, dotée de remparts solides, d'un marché propre et d'une activité commerciale et artisanale diversifiée; à une cinquantaine de kilomètres de Wadi Ash. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  ur: "ایک آبادی والا، آباد شہر جس میں مضبوط دیواریں، ایک صاف ستھرا بازار، تجارت اور کئی قسم کے دستکاری؛ وادی ایش سے تیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 568}"
