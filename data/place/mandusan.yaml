summary:
  ar: "بيت معظم ببلاد الهند تعظمه الهند وله قرابين تقرب، وفيه أحجار المغناطيس الجاذبة والدافعة والمنفرة من أوصاف لا يسع الاخبار عنها، ويعد من البيوت المعظمة المتخذة على أسماء الكواكب {cite:muruj-al-dhahab p. 539}."
  en: "The great Indian shrine of the magnet-stones — attracting, repelling, repulsing in ways the writer declines to tell — counted among the temples named for the planets {cite:muruj-al-dhahab p. 539}."
  es: "El gran santuario indio de las piedras magnéticas —que atraen, repelen, repelen de maneras que el autor se niega a contar— se contaba entre los templos que llevaban el nombre de los planetas {cite:muruj-al-dhahab p. 539}."
  fr: "Le grand sanctuaire indien des pierres magnétiques — attirant, repoussant, répulsant de manières que l'auteur refuse de décrire — comptait parmi les temples nommés d'après les planètes {cite:muruj-al-dhahab p. 539}."
  ur: "مقناطیسی پتھروں کی عظیم ہندوستانی عبادت گاہ — اپنی طرف متوجہ کرنے، پیچھے ہٹانے، پیچھے ہٹانے کے طریقوں سے مصنف نے یہ بتانے سے انکار کیا ہے — کو سیاروں کے لیے نامزد مندروں میں شمار کیا جاتا ہے۔ 539}۔"
  tr: "Hindistan'daki çoğu insanın evi Hindistan tarafından saygı görür ve yakınlarında adaklar vardır. Tarif edilemez manyetik, itici ve itici taşlar içerir. Gezegenlerin adını taşıyan saygı duyulan evlerden biri olarak kabul edilir {cite:muruj-al-dhahab, s. 539}."
  id: "Rumah sebagian besar orang di India dihormati oleh India dan memiliki persembahan di sekitarnya. Rumah ini berisi batu-batu magnetik, pendorong, dan menjijikkan dengan deskripsi yang tak terlukiskan. Rumah ini dianggap sebagai salah satu rumah yang dihormati yang dinamai menurut planet {cite:muruj-al-dhahab, hlm. 539}."
