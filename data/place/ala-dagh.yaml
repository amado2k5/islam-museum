summary:
  ar: "آلا داغ، اسم تركي يُطلق على جبال كثيرة في البلدان الناطقة بالتركية، منها جبل جنوب غرب قونية، وأحد مرتفعات قره داغ في الجنوب الشرقي من قارص، وقريبًا منه هزم الروس الأتراك في 16 أكتوبر 1877م {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  en: "Ala Dagh, 'motley-coloured mountain', a Turkish name for many mountains in Turkish-speaking lands, among them one south-west of Konya and a spur of the Kara Dagh in south-east Kars, near which the Russians defeated the Turks on 16 October 1877 {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
