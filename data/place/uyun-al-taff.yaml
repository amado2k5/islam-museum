label: { ar: "عيون الطف", en: "Uyun al-Taff (the Taff Springs)" }
summary:
  ar: "عيون على أطراف السواد منها عين الصيد والقطقطانة والرحيمة وعين جمل وذواتها؛ عند البلاذري كانت للموكلين بالمسالح التي وراء السواد وهي عيون خندق سابور الذي حفره بينه وبين العرب الموكلين بمسالح الخندق وذلك أن سابور أقطعهم أرضها فاعتملوها من غير أن يلزمهم لها خراج فلما كان يوم ذي قار غلبت العرب على طائفة من تلك العيون وبقي في أيدي الأعاجم بعضها ثم لما قدم المسلمون الحيرة هربت الأعاجم بعد أن طموا عامة ما في أيديهم وبقي الذي في أيدي العرب فأسلموا عليه وصار ما عمروه من الأرضين عشرياً ولما مضى أمر القادسية والمدائن دفع ما جلا عنه أهله من أراضي تلك العيون إلى المسلمين فأقطعوه فصارت عشرية أيضاً وكذلك مجرى عيون الطف وأرضيها مجرى أعراض المدينة وقرى نجد وكل صدقتها إلى عمال المدينة فلما ولي إسحاق بن إبراهيم بن مصعب السواد للمتوكل ضمها إلى ما في يده فتولى عمالة عشرها وصيرها سوادية وهي على ذلك إلى اليوم وقد استخرج عيون إسلامية مجرى ما سقت عيونها من الأرضين هذا المجرى."
  en: "Springs on the Sawad's fringe — Ayn al-Sayd, al-Qutqutana, al-Ruhayma, Ayn Jamal and their sisters; in al-Baladhuri they belonged to the holders of the frontier posts beyond the Sawad, being the springs of Sabur's trench dug between him and the Arabs manning its posts — Sabur having granted them the land, worked without kharaj. At Dhu Qar the Arabs took some springs; the Persians kept some, then plugged most on fleeing the Muslim advance on al-Hira; what the Arabs kept they cultivated tithe-free, and the spring-lands abandoned after al-Qadisiyya and al-Mada'in were given to the Muslims who granted them likewise as ushri. Uyun al-Taff's revenues ran with Medina's crown lands and Najd villages to Medina's officials until Ishaq ibn Ibrahim ibn Mus'ab took the Sawad for al-Mutawakkil, annexed them, farmed their ushr and made them Sawadi — as they remain; he also dug 'Islamic springs' of the same dispensation."
