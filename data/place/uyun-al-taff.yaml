label: { ar: "عيون الطف", en: "Uyun al-Taff (the Taff Springs)", es: "Uyun al-Taff (los manantiales de Taff)", fr: "Uyun al-Taff (les sources de Taff)", ur: "یون الطاف ⁦(طاف چشمے)⁩", tr: "Oyoun al-Taff", id: "Oyoun al-Taff" }
summary:
  ar: "عيون على أطراف السواد منها عين الصيد والقطقطانة والرحيمة وعين جمل وذواتها؛ عند البلاذري كانت للموكلين بالمسالح التي وراء السواد وهي عيون خندق سابور الذي حفره بينه وبين العرب الموكلين بمسالح الخندق وذلك أن سابور أقطعهم أرضها فاعتملوها من غير أن يلزمهم لها خراج فلما كان يوم ذي قار غلبت العرب على طائفة من تلك العيون وبقي في أيدي الأعاجم بعضها ثم لما قدم المسلمون الحيرة هربت الأعاجم بعد أن طموا عامة ما في أيديهم وبقي الذي في أيدي العرب فأسلموا عليه وصار ما عمروه من الأرضين عشرياً ولما مضى أمر القادسية والمدائن دفع ما جلا عنه أهله من أراضي تلك العيون إلى المسلمين فأقطعوه فصارت عشرية أيضاً وكذلك مجرى عيون الطف وأرضيها مجرى أعراض المدينة وقرى نجد وكل صدقتها إلى عمال المدينة فلما ولي إسحاق بن إبراهيم بن مصعب السواد للمتوكل ضمها إلى ما في يده فتولى عمالة عشرها وصيرها سوادية وهي على ذلك إلى اليوم وقد استخرج عيون إسلامية مجرى ما سقت عيونها من الأرضين هذا المجرى."
  en: "Springs on the Sawad's fringe — Ayn al-Sayd, al-Qutqutana, al-Ruhayma, Ayn Jamal and their sisters; in al-Baladhuri they belonged to the holders of the frontier posts beyond the Sawad, being the springs of Sabur's trench dug between him and the Arabs manning its posts — Sabur having granted them the land, worked without kharaj. At Dhu Qar the Arabs took some springs; the Persians kept some, then plugged most on fleeing the Muslim advance on al-Hira; what the Arabs kept they cultivated tithe-free, and the spring-lands abandoned after al-Qadisiyya and al-Mada'in were given to the Muslims who granted them likewise as ushri. Uyun al-Taff's revenues ran with Medina's crown lands and Najd villages to Medina's officials until Ishaq ibn Ibrahim ibn Mus'ab took the Sawad for al-Mutawakkil, annexed them, farmed their ushr and made them Sawadi — as they remain; he also dug 'Islamic springs' of the same dispensation."
  es: "Manantiales en la periferia del Sawad: Ayn al-Sayd, al-Qutqutana, al-Ruhayma, Ayn Jamal y sus hermanas; en al-Baladhuri pertenecían a los poseedores de los puestos fronterizos más allá del Sawad, siendo los manantiales de la trinchera de Sabur excavada entre él y los árabes que custodiaban sus puestos; Sabur les había concedido la tierra, la trabajaban sin pagar diezmos. En Dhu Qar, los árabes tomaron algunos manantiales; los persas conservaron algunos, y luego bloquearon la mayoría al huir del avance musulmán sobre al-Hira; lo que los árabes conservaron lo cultivaron sin pagar diezmos, y las tierras de los manantiales abandonadas después de al-Qadisiyya y al-Mada'in fueron entregadas a los musulmanes, quienes también las concedieron como ushri. Los ingresos de Uyun al-Taff, junto con las tierras de la corona de Medina y las aldeas de Najd, pasaron a manos de los funcionarios de Medina hasta que Ishaq ibn Ibrahim ibn Mus'ab tomó el Sawad para al-Mutawakkil, lo anexó, cultivó sus tierras y las convirtió en Sawadi, tal como permanecen; también excavó 'manantiales islámicos' de la misma época."
  fr: "Les sources situées en bordure du Sawad – Ayn al-Sayd, al-Qutqutana, al-Ruhayma, Ayn Jamal et leurs voisines – appartenaient, à al-Baladhuri, aux détenteurs des postes frontières au-delà du Sawad. Il s'agissait des sources du fossé creusé par Sabur entre lui et les Arabes qui tenaient ses postes. Sabur leur avait concédé la terre, qu'il exploitait sans payer de dîme (kharaj). À Dhu Qar, les Arabes s'approprièrent quelques sources; les Perses en conservèrent quelques-unes, puis en bouchèrent la plupart en fuyant l'avancée musulmane sur al-Hira. Celles que les Arabes conservèrent furent cultivées sans payer de dîme, et les terres des sources abandonnées après al-Qadisiyya et al-Mada'in furent données aux musulmans qui les concédèrent également à titre d'ushri (droit d'usufruit). Les revenus d'Uyun al-Taff étaient liés aux terres de la couronne de Médine et aux villages du Najd, et appartenaient aux fonctionnaires de Médine, jusqu'à ce qu'Ishaq ibn Ibrahim ibn Mus'ab prenne le Sawad pour al-Mutawakkil, l'annexe, exploite son ushr et en fasse un Sawadi — comme il l'est encore aujourd'hui; il creusa également des « sources islamiques » de la même tradition."
  ur: "سواد کے کنارے پر چشمے — عین السید، القطانہ، الرحیمہ، عین جمال اور ان کی بہنیں؛ البلادھوری میں ان کا تعلق سواد سے آگے سرحدی چوکیوں کے حاملین سے تھا، جو کہ صابور کی خندق کے چشمے تھے جو اس کے اور عربوں کے درمیان کھودی گئی تھی جو اس کی چوکیوں پر کام کر رہے تھے۔ ذو قر میں عربوں نے کچھ چشمے لیے۔ فارسیوں نے کچھ اپنے پاس رکھے، پھر الحیرہ پر مسلمانوں کی پیش قدمی سے بھاگنے پر سب سے زیادہ پلٹ گئے۔ عربوں نے جو کچھ رکھا تھا وہ دسواں حصہ کے بغیر کاشت کرتے تھے، اور القدسیہ اور المدائن کے بعد چھوڑ دی گئی بہار کی زمینیں مسلمانوں کو دی گئیں جنہوں نے انہیں عشری کے طور پر عطا کیا۔ یون الطف کی آمدنی مدینہ کی تاجدار زمینوں اور نجد کے دیہاتوں کے ساتھ مدینہ کے حکام تک پہنچتی تھی یہاں تک کہ اسحاق بن ابراہیم ابن مصعب نے سواد کو المتوکل کے لیے لے لیا، ان کا الحاق کیا، ان کا عشر کھیتی باڑی اور انہیں سوادی بنا دیا۔ اس نے اسی نظام کے 'اسلامی چشمے' بھی کھودے۔"
  tr: "Kara kenarlardaki gözler, Av Gözü, Qatqtana, Rahima ve Deve Gözü ile onların akrabaları dahil; El-Baladhuri'ye göre, Köleler, Araplar ile Masalih hendeğini emanet eden Araplar arasında Kazdıkları Sapur Çukuru'nun kaynakları olan Siyah Ağacın ötesindeki Masalih'i tutuyorlardı. Bunun nedeni, Sabor'un topraklarını kesip vergi ödemeden doldurmasıydı. Dhi Qar gününde Araplar bu kaynaklardan bir grup geçti ve bazıları Arap olmayanların elinde kaldı. Sonra, Müslümanlar El-Hirah'a vardığında, Arap olmayanlar ellerindeki şeylerin çoğunu örttükten sonra kaçtılar. Arapların elinde kalan kalan kaldı ve onlar İslam'a geçti, ektikleri ise ondalık oldu. El-Kadisiye ve Al-Mada'in meselesi geçince, o kaynakların toprakları Müslümanlara devredildi, onlar da kesip ayrıldı ve o da bir 'tihr oldu. Aynı şekilde, Uyun al-Tuff ve toprakları Medine şehirleri ve Necd köylerinin güzergahıdır ve tüm yardımları Medine valilerine gider. İshaq ibn İbrahim bin Mus'ab al-Sawad El-Mutevakkil'e atandığında, onları sahip olduklarına kattı, böylece ondalıklarının yönetimini devraldı ve onları Suwadiyyah yaptı; bu durum günümüzde de öyle kalmaktadır. Sulanan iki topraktan su olarak İslam kaynakları çıkardı."
  id: "Mata tertuju pada tepi hitam, termasuk Mata Berburu, Qatqtana, Rahima, dan Mata Unta, beserta kerabat mereka; menurut Al-Baladhuri, para budak memiliki Masalih di luar Hitam, yaitu mata air Palung Sapur yang digali antara dia dan orang Arab yang dipercayakan dengan parit Masalih. Hal ini karena Sabor memotong tanahnya dan mengisinya tanpa mewajibkan mereka membayar pajak. Pada hari Dhi Qar, orang Arab mengalahkan sekelompok mata air ini, dan beberapa tetap berada di tangan non-Arab. Kemudian, ketika Muslim tiba di Al-Hirah, orang non-Arab melarikan diri setelah sebagian besar menutupi apa yang mereka miliki. Apa yang tersisa di tangan orang Arab tetap ada dan mereka memeluk Islam, dan apa yang mereka tanam menjadi 'tithe'. Ketika masalah Al-Qadisiyyah dan Al-Mada'in selesai, tanah mata air tersebut dialihkan kepada Muslim, yang kemudian memutusnya, dan menjadi 'tihr juga. Demikian pula, aliran Uyun al-Tuff dan tanahnya adalah alur kota-kota Madinah dan desa-desa Najd, dan semua amal mereka diberikan kepada para gubernur Madinah. Ketika Ishaq ibn Ibrahim ibn Mus'ab al-Sawad diangkat ke Al-Mutawakkil, ia menggabungkan mereka ke atas apa yang dimilikinya, sehingga ia mengambil alih administrasi persepuluhan mereka dan menjadikan mereka Suwadiyyah, yang masih demikian hingga hari ini. Ia mengambil mata air Islam sebagai air dari dua tanah yang diairi."
