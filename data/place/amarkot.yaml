summary:
  ar: "عمركوت، بلدة في منطقة ثارباركار بإقليم السند في باكستان، فيها وُلد الإمبراطور أكبر سنة 949هـ/1542م أثناء فرار همايون بعد هزيمته أمام شير شاه، وكانت تابعة لأمراء السُّودا الراجبوت، ثم صارت جزءًا من الإمبراطورية المغولية {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  en: "Amarkot, a town in the Tharparkar district of Sind in Pakistan, where Akbar was born on 5 Rajab 949/23 November 1542, when Humayun had taken refuge there after his defeat by Shir Shah. It was held by Soda Rajput princes, became part of the Mughal empire in 999/1590, and passed to the British with the conquest of Sind in 1843 {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  es: "Amarkot, una ciudad en el distrito de Tharparkar de Sind en Pakistán, donde nació Akbar el 5 de Rajab de 949/23 de noviembre de 1542, cuando Humayun se refugió allí tras su derrota a manos de Shir Shah. Estuvo en manos de príncipes rajput soda, pasó a formar parte del imperio mogol en 999/1590 y fue conquistada por los británicos con la conquista de Sind en 1843 {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  fr: "Amarkot, ville du district de Tharparkar, dans le Sind (Pakistan), où Akbar naquit le 5 Rajab 949 (23 novembre 1542), après la défaite d'Humayun face à Shir Shah. Elle fut successivement sous la domination de princes Rajput Soda, puis intégrée à l'empire moghol en 999 (1590), avant de passer aux mains des Britanniques lors de la conquête du Sind en 1843 (voir Encyclopaedia of Islam, vol. 1, p. 453)."
