summary:
  ar: "عمركوت، بلدة في منطقة ثارباركار بإقليم السند في باكستان، فيها وُلد الإمبراطور أكبر سنة 949هـ/1542م أثناء فرار همايون بعد هزيمته أمام شير شاه، وكانت تابعة لأمراء السُّودا الراجبوت، ثم صارت جزءًا من الإمبراطورية المغولية {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  en: "Amarkot, a town in the Tharparkar district of Sind in Pakistan, where Akbar was born on 5 Rajab 949/23 November 1542, when Humayun had taken refuge there after his defeat by Shir Shah. It was held by Soda Rajput princes, became part of the Mughal empire in 999/1590, and passed to the British with the conquest of Sind in 1843 {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
