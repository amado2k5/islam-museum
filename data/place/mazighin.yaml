summary:
  ar: "مرسى يبعد عن أنفا نحو خمسة وستين ميلاً، وعلى الساحل جون يسمى البيضاء، وتبعد عنه آسفي بنحو خمسين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  en: "A harbour about sixty-five miles from Anfa, with a bay called al-Bayda on the coast; about fifty miles from Asfi. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  es: "Un puerto a unas sesenta y cinco millas de Anfa, con una bahía llamada al-Bayda en la costa; a unas cincuenta millas de Asfi. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  fr: "Un port situé à environ soixante-cinq milles d'Anfa, avec une baie appelée al-Bayda sur la côte; à environ cinquante milles d'Asfi. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  ur: "عنفہ سے پینسٹھ میل کے فاصلے پر ایک بندرگاہ جس کے ساحل پر البیضا نامی خلیج ہے۔ آصفی سے تقریباً پچاس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 240}"
  tr: "Marsa, Anfa'ya yaklaşık altmış beş mil uzaklıktadır ve kıyıda Yuhanna'nın adı Al-Bayda, Safi ise yaklaşık elli mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 240}"
  id: "Marsa berjarak sekitar enam puluh lima mil dari Anfa, dan di pantai John disebut Al-Bayda, dan Safi sekitar lima puluh mil jauhnya. {cite:nuzhat-al-mushtaq-2002 hlm. 240}"
