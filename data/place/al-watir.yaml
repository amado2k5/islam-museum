summary:
  en: "A watering place of Khuza'a in lower Mecca where Banu al-Dil of Banu Bakr made the night attack that broke the Hudaybiyya truce."
  ar: "ماء لخزاعة بأسفل مكة، بيّتت عليه بنو الديل من بني بكر خزاعةً في الخرق الذي أشعل فتح مكة."
  es: "Un abrevadero de Khuza'a, en la parte baja de La Meca, donde Banu al-Dil de Banu Bakr lanzó el ataque nocturno que rompió la tregua de Hudaybiyya."
  fr: "Un point d'eau de Khuza'a dans la partie basse de La Mecque où les Banu al-Dil des Banu Bakr ont lancé l'attaque nocturne qui a rompu la trêve de Hudaybiyya."
  ur: "مکہ کے نچلے حصے میں خزاعہ کی آبیاری کی جگہ جہاں بنو بکر کے بنو الدل نے رات کو حملہ کیا جس نے حدیبیہ کی جنگ بندی کو توڑ دیا۔"
  tr: "Mekke'nin dibinde, Banu Bakr Huza'ah'tan Banu al-Dayl'in Mekke'nin fethini ateşleyen nehirde geceyi geçirdiği Huza'ah için su."
  id: "Air untuk Khuza'ah di dasar Mekah, tempat Banu al-Dayl dari Banu Bakr Khuza'ah menginap semalam di sungai yang memicu penaklukan Mekah."
