summary:
  ar: "بلدة يذكر المؤلف أنها تبعد عن أودغست إحدى وثلاثين مرحلة، وأن أهل زغاوة يحملون إليها الحنطة {cite:nuzhat-al-mushtaq-2002 p. 108}، {cite:nuzhat-al-mushtaq-2002 p. 111}."
  en: "A town the author places thirty-one stages from Awdaghast. He says the Zaghawa bring wheat to it from there {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 111}."
  es: "El autor sitúa la ciudad a treinta y un etapas de Awdaghast. Dice que los Zaghawa traen trigo desde allí {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 111}."
  fr: "L'auteur situe une ville à trente et une étapes d'Awdaghast. Il précise que les Zaghawa y apportent du blé depuis cet endroit {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 111}."
  ur: "ایک قصبہ جس کا مصنف اوداگست سے اکتیس مراحل طے کرتا ہے۔ وہ کہتے ہیں کہ زاغوا وہاں سے گندم لاتے ہیں {حوالہ: نزہت المشتاق-2002 ص 108}، {حوالہ: نزہت المشتاق-2002 ص۔ 111}۔"
  tr: "Yazar, buranın Oudaghest'e otuz bir adım uzaklıkta olduğunu ve Zaghawa halkının oraya buğday getirdiğini belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 108}, {cite:Nuzhat-al-Mushtaq-2002 s. 111}."
  id: "Penulis menyebutkan bahwa tempat ini berjarak tiga puluh satu langkah dari Oudaghest, dan bahwa penduduk Zaghawa membawa gandum ke sana {cite:Nuzhat-al-Mushtaq-2002 hlm. 108}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 111}."
