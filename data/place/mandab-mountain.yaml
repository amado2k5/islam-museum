id: place/mandab-mountain
class: place
kind: mountain
label: { ar: "جبل المندب", en: "Mount Mandab", es: "Monte Mandab", fr: "Mont Mandab", ur: "کوہ مندب", tr: "Mandab Dağı", id: "Gunung Mandab" }
summary:
  ar: "جبل طويل يقع عند مدخل البحر الأحمر وباب المندب، ويمتد مع ساحل اليمن، وتمر به المراكب الصاعدة إلى اليمن، ويذكر المؤلف عنه ما ينسبه إلى صاحب كتاب العجائب من أنه يجذب الحديد {cite:nuzhat-al-mushtaq-2002 p. 50}."
  en: "A long mountain at the entrance to the Red Sea, at Bab al-Mandab, running along the Yemeni coast. Ships bound for Yemen pass it. The author repeats a claim from the Book of Wonders that it draws iron to itself {cite:nuzhat-al-mushtaq-2002 p. 50}."
  es: "Una larga montaña a la entrada del Mar Rojo, en Bab al-Mandeb, que se extiende a lo largo de la costa yemení. Los barcos que se dirigen a Yemen la bordean. El autor repite una afirmación del Libro de las Maravillas según la cual atrae el hierro {cite:nuzhat-al-mushtaq-2002 p. 50}."
  fr: "Une longue montagne à l'entrée de la mer Rouge, à Bab el-Mandeb, longe la côte yéménite. Les navires à destination du Yémen la longent. L'auteur reprend une affirmation du Livre des Merveilles selon laquelle elle attirerait le fer à elle {cite:nuzhat-al-mushtaq-2002 p. 50}."
  ur: "باب المندب کے مقام پر بحیرہ احمر کے دروازے پر ایک لمبا پہاڑ جو یمنی ساحل کے ساتھ ساتھ چلتا ہے۔ یمن جانے والے جہاز اس سے گزرتے ہیں۔ مصنف نے عجائبات کی کتاب سے اس دعوے کو دہرایا ہے کہ یہ لوہے کو اپنی طرف کھینچتی ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 50}۔"
  tr: "Kızıldeniz ve Bab el-Mendab girişinde yer alan, Yemen kıyısı boyunca uzanan uzun bir dağdır ve Yemen'e giden gemiler buradan geçer. Yazar, bunu Al-Ajaib adlı kitabın yazarına atfeter ve demir çektiğini iddia eder {cite:Nuzhat-al-mushtaq-2002, s. 50}."
  id: "Sebuah gunung panjang yang terletak di pintu masuk Laut Merah dan Bab al-Mandab, membentang sepanjang pantai Yaman, yang dilalui kapal-kapal menuju Yaman. Penulis mengaitkannya dengan penulis buku Al-Ajaib, mengklaim bahwa gunung ini menarik besi {cite:Nuzhat-al-mushtaq-2002, hlm. 50}."
