  ar: "جبل طويل يقع عند مدخل البحر الأحمر وباب المندب، ويمتد مع ساحل اليمن، وتمر به المراكب الصاعدة إلى اليمن، ويذكر المؤلف عنه ما ينسبه إلى صاحب كتاب العجائب من أنه يجذب الحديد {cite:nuzhat-al-mushtaq-2002 p. 50}."
  en: "A long mountain at the entrance to the Red Sea, at Bab al-Mandab, running along the Yemeni coast. Ships bound for Yemen pass it. The author repeats a claim from the Book of Wonders that it draws iron to itself {cite:nuzhat-al-mushtaq-2002 p. 50}."
