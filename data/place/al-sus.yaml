summary:
  ar: السوس مدينة عظيمة من كور الأهواز؛ حاصرها أبو موسى حتى نفد طعام أهلها ففتحها على أمان ثمانين وفيها قتل مرزبانها ووجد
    في قلعتها جثة دانيال النبي فدفنها في النهر بأمر عمر.
  en: al-Sus, the great city of al-Ahwaz; starved out by Abu Musa it fell on an eighty-man aman, its marzban beheaded — and
    in its citadel was found the prophet Daniel's body, buried in the riverbed on Umar's command.
  es: "al-Sus, la gran ciudad de al-Ahwaz, fue asediada por el hambre a manos de Abu Musa y cayó sobre un aman de ochenta hombres, cuyo marzban fue decapitado. En su ciudadela se encontró el cuerpo del profeta Daniel, enterrado en el lecho del río por orden de Umar."
  fr: "al-Sus, la grande ville d'al-Ahwaz; affamée par Abu Musa, elle tomba sur un aman de quatre-vingts hommes, son marzban décapité — et dans sa citadelle fut trouvé le corps du prophète Daniel, enterré dans le lit du fleuve sur l'ordre d'Umar."
