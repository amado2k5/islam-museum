summary:
  ar: "مدينة عامرة كبيرة القطر، كثيرة الأزقة بالبلاط، ولهم مراكب غزو، وتبعد عن رغوري ثمانية وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  en: "A populous city of great extent, with many lanes paved with flagstone and raiding ships; about twenty-eight miles from Raghuri. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  es: "Una ciudad populosa de gran extensión, con muchas callejuelas empedradas y barcos de asalto; a unos veintiocho kilómetros de Raghuri. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  fr: "Une ville populeuse et étendue, avec de nombreuses ruelles pavées et des navires de raid; à environ vingt-huit milles de Raghuri. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  ur: "بہت زیادہ آبادی والا شہر، جس میں جھنڈے کے پتھر اور چھاپہ مار بحری جہازوں سے پکی کئی گلیاں ہیں۔ راگھوری سے تقریباً اٹھائیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 769}"
  tr: "Geniş çaplı, birçok fayanslı sokak ve Ragouri'ye yirmi sekiz mil uzaklıkta bulunan sefer gemilerine sahip zengin bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 769}"
  id: "Kota yang makmur dengan diameter besar, banyak gang dengan ubin, dan mereka memiliki kapal ekspedisi yang terletak dua puluh delapan mil dari Ragouri. {sitasi:Nuzhat-al-Mushtaq-2002 hlm. 769}"
