summary:
  ar: "مدينة من قواعد الروم، أهلها أنجاد، وبها مراكب غزو، وتبعد عن جاذرة ثلاثين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  en: "A city of the Roman bases whose people are brave, with raiding ships; thirty miles from Jadhara. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  es: "Ciudad de antiguas bases romanas cuyos habitantes son valientes y cuentan con barcos de asalto; a treinta millas de Jadhara. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  fr: "Une ville des bases romaines, dont les habitants sont courageux et possèdent des navires de raid; à trente milles de Jadhara. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  ur: "رومی اڈوں کا ایک شہر جس کے لوگ بہادر ہیں، چھاپہ مار جہازوں کے ساتھ؛ جدھرا سے تیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 769}"
  tr: "Roma üslerinden gelen bir şehir, halkı Angad'dı, sefer gemileri vardı ve Jadra'ya otuz mil uzaklıktaydı. {cite:nuzhat-al-mushtaq-2002 s. 769}"
  id: "Kota dari basis Romawi, penduduknya adalah Angad, memiliki kapal ekspedisi, dan berjarak tiga puluh mil dari Jadra. {cite:Nuzhat-al-Mushtaq-2002 hlm. 769}"
