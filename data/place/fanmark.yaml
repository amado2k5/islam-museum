summary:
  ar: "أرض كثيرة القرى والعمارات والأغنام، ويذكر المؤلف أن بلادها خالية في أكثرها، وليس فيها بلد عامر إلا أبورة وقلمار {cite:nuzhat-al-mushtaq-2002 p. 953}."
  en: "A land of many villages and sheep; the author says most of it is empty and that only Abura and Qalmār are inhabited towns {cite:nuzhat-al-mushtaq-2002 p. 953}."
  es: "Una tierra de muchos pueblos y ovejas; el autor dice que la mayor parte está vacía y que solo Abura y Qalmār son ciudades habitadas {cite:nuzhat-al-mushtaq-2002 p. 953}."
  fr: "Un pays de nombreux villages et de moutons; l'auteur dit que la plupart est vide et que seules Abura et Qalmār sont des villes habitées {cite:nuzhat-al-mushtaq-2002 p. 953}."
  ur: "بہت سے دیہاتوں اور بھیڑوں کی زمین؛ مصنف کا کہنا ہے کہ اس کا زیادہ تر حصہ خالی ہے اور صرف ابورہ اور قلمار ہی آباد شہر ہیں {حوالہ: نزہت المشتاق-2002 صفحہ 953}۔"
  tr: "Arazi köyler, binalar ve koyunlarla doludur. Yazar, topraklarının çoğunun terk edilmiş olduğunu ve Abura ile Qalmar dışında refah içinde bir ülke olmadığını belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 953}."
  id: "Tanah ini penuh dengan desa, bangunan, dan domba. Penulis menyebutkan bahwa sebagian besar tanahnya kosong, dan tidak ada negara makmur kecuali Abura dan Qalmar {cite:Nuzhat-al-Mushtaq-2002, hlm. 953}."
