label: { ar: "الجابية", en: "al-Jabiya", ur: "الجابیہ", es: "al-Jabiya", fr: "al-Jabiya", tr: "El-Cebiye", id: "Al-Jabiya" }
summary:
  ar: "الجابية مقر رئيسي لأمراء غسان في الجولان نحو 80 كم جنوب دمشق قرب نوى الحالية. صارت بعد الفتح معسكراً كبيراً وقاعدة جند دمشق، وفيها اجتمع القادة مع عمر سنة 17هـ/638م في يوم الجابية الشهير، واجتمع فيها بنو أمية فبويع مروان بن الحكم، وكان بها مسجد جامع بمنبر. وتصلها دائرة المعارف الإسلامية بمناوشة سبقت يوم اليرموك سنة 15هـ/636م {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  en: "Al-Jabiya was the principal residence of the Ghassanid amirs, in the Jawlan about 80 km south of Damascus, near modern Nawa. After the conquest it became the main camp in Syria and headquarters of the jund of Damascus; Umar met his commanders there in 17/638 in the famous yawm al-Jabiya, the Umayyads gathered there to acclaim Marwan ibn al-Hakam, and it had a large mosque with a minbar. The Encyclopaedia of Islam also links it with a skirmish before the battle of the Yarmuk in 15/636 {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  ur: "الجابیہ غسانی امیروں کی اہم رہائش گاہ تھی، جولان میں دمشق سے تقریباً 80 کلومیٹر جنوب میں، موجودہ نوا کے قریب۔ فتح کے بعد یہ شام کی سب سے بڑی چھاؤنی اور جندِ دمشق کا صدر مقام بنی؛ عمر نے 17ھ/638ء میں یہاں اپنے سپہ سالاروں سے مشہور یومِ جابیہ کی ملاقات کی، بنو امیہ نے یہاں جمع ہو کر مروان بن الحکم کی بیعت کی، اور یہاں منبر والی بڑی مسجد تھی۔ اسلامی دائرۃ المعارف اسے 15ھ/636ء میں جنگِ یرموک سے پہلے کی ایک جھڑپ سے بھی جوڑتا ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}۔"
  es: "Al-Jabiya fue la residencia principal de los emires gasánidas, en Jawlan, a unos 80 km al sur de Damasco, cerca de la actual Nawa. Tras la conquista, se convirtió en el principal campamento de Siria y cuartel general del jund de Damasco; Umar se reunió allí con sus comandantes en el 17/638 en el famoso yawm al-Jabiya, los omeyas se congregaron allí para aclamar a Marwan ibn al-Hakam, y contaba con una gran mezquita con un minbar. La Enciclopedia del Islam también la relaciona con una escaramuza previa a la batalla del Yarmuk en el 15/636 {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  fr: "Al-Jabiya était la résidence principale des émirs ghassanides, située dans le Jawlan, à environ 80 km au sud de Damas, près de l'actuelle Nawa. Après la conquête, elle devint le principal camp en Syrie et le quartier général du jund de Damas. Umar y rencontra ses commandants en 17/638 lors du célèbre yawm al-Jabiya, les Omeyyades s'y rassemblèrent pour acclamer Marwan ibn al-Hakam, et la ville possédait une grande mosquée dotée d'un minbar. L'Encyclopédie de l'Islam la rattache également à une escarmouche survenue avant la bataille du Yarmouk en 15/636 (encyclopédie de l'Islam, vol. 2, p. 385; encyclopédie de l'Islam, vol. 11, p. 302)."
  tr: "El-Cebiye, günümüz Nawa'sına yakın, Şam'ın yaklaşık 80 km güneyinde, Golan'da Gassan prenslerinin ana karargahıydı. Fetihten sonra, büyük bir kamp ve Şam askerleri için bir üs haline geldi; liderler burada 17 Hicriy / 638 yılında ünlü El-Cebiye gününde Ömer ile buluştular. Emeviyeler burada toplandı ve Mervan bin el-Hakam bağlılık yemini etti. Ayrıca vaaz kürsüsü olan büyük bir cami de vardı. İslami Ansiklopedi, burayı 15 Hicri/636 yılında Yarmuk Günü'nden önceki bir çatışmaya bağlar {cite:Encyclopaedia-of-Islam-2 cilt 2, s. 385} {cite:Encyclopaedia-of-Islam-2 cilt 11, s. 302}."
  id: "Al-Jabiyah adalah markas utama para pangeran Ghassan di Golan, sekitar 80 km di selatan Damaskus, dekat Nawa saat ini. Setelah penaklukan, kota ini menjadi kamp besar dan markas bagi tentara Damaskus, di mana para pemimpin bertemu dengan Umar pada tahun 17 H / 638 M pada hari terkenal Al-Jabiya. Umayyah berkumpul di sana, dan Marwan ibn al-Hakam diikrarkan kesetiaan. Masjid ini juga memiliki masjid megah dengan mimbar. Ensiklopedia Islam menghubungkannya dengan sebuah bentrokan yang terjadi sebelum Hari Yarmouk pada tahun 15 H/636 M {cite:Encyclopaedia-of-Islam-2 vol. 2, hlm. 385} {cite:Encyclopaedia-of-Islam-2 vol. 11, hlm. 302}."
