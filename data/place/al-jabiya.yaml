  ar: "الجابية مكان في الجولان كان فيه معسكر كبير، واجتمع فيه عمر مع قادته ثم اجتمع فيه بنو أمية."
  en: "Al-Jabiya was a place in the Golan region with a big camp, where Umar met his commanders and later the Umayyads gathered."
