label: { ar: "الجابية", en: "al-Jabiya", ur: "الجابیہ" }
summary:
  ar: "الجابية مقر رئيسي لأمراء غسان في الجولان نحو 80 كم جنوب دمشق قرب نوى الحالية. صارت بعد الفتح معسكراً كبيراً وقاعدة جند دمشق، وفيها اجتمع القادة مع عمر سنة 17هـ/638م في يوم الجابية الشهير، واجتمع فيها بنو أمية فبويع مروان بن الحكم، وكان بها مسجد جامع بمنبر. وتصلها دائرة المعارف الإسلامية بمناوشة سبقت يوم اليرموك سنة 15هـ/636م {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  en: "Al-Jabiya was the principal residence of the Ghassanid amirs, in the Jawlan about 80 km south of Damascus, near modern Nawa. After the conquest it became the main camp in Syria and headquarters of the jund of Damascus; Umar met his commanders there in 17/638 in the famous yawm al-Jabiya, the Umayyads gathered there to acclaim Marwan ibn al-Hakam, and it had a large mosque with a minbar. The Encyclopaedia of Islam also links it with a skirmish before the battle of the Yarmuk in 15/636 {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  ur: "الجابیہ غسانی امیروں کی اہم رہائش گاہ تھی، جولان میں دمشق سے تقریباً 80 کلومیٹر جنوب میں، موجودہ نوا کے قریب۔ فتح کے بعد یہ شام کی سب سے بڑی چھاؤنی اور جندِ دمشق کا صدر مقام بنی؛ عمر نے 17ھ/638ء میں یہاں اپنے سپہ سالاروں سے مشہور یومِ جابیہ کی ملاقات کی، بنو امیہ نے یہاں جمع ہو کر مروان بن الحکم کی بیعت کی، اور یہاں منبر والی بڑی مسجد تھی۔ اسلامی دائرۃ المعارف اسے 15ھ/636ء میں جنگِ یرموک سے پہلے کی ایک جھڑپ سے بھی جوڑتا ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 385} {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}۔"
