summary:
  ar: "السلطانية مدينة في شمال إقليم الجبال الإسلامي الوسيط، على نحو خمسين كيلومتراً جنوب شرق زنجان. أسسها الإلخانيون المغول في أواخر القرن السابع الهجري، فبدأ أرغون بناءها، ووسّعها ابنه أولجايتو سنة 705هـ/1305م وجعلها المقر الموسمي الرئيسي لدولته، وانتهى بناؤها سنة 713هـ/1313م. وفيها ضريح أولجايتو، قبة هائلة ثمانية الأضلاع، ما زالت قائمة {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  en: "Sultaniyya is a town in the northern part of the mediaeval Islamic province of Jibal, some 50 km south-east of Zanjan. The Mongol Ilkhans founded it towards the end of the seventh/thirteenth century: Arghun began building it, his son Oljeitu enlarged it in 705/1305 and made it the chief seasonal residence of his kingdom, and its building was finished in 713/1313. Its great survivor is Oljeitu's mausoleum, an enormous domed octagon {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  ur: "سلطانیہ قرونِ وسطیٰ کے اسلامی صوبہ جبال کے شمالی حصے میں زنجان سے تقریباً پچاس کلومیٹر جنوب مشرق میں ایک شہر ہے۔ منگول ایل خانیوں نے اسے ساتویں/تیرھویں صدی کے آخر میں بسایا: ارغون نے تعمیر شروع کی، ان کے بیٹے اولجایتو نے 705ھ/1305ء میں اسے وسعت دی اور اپنی سلطنت کا بنیادی موسمی مسکن بنایا، اور اس کی تعمیر 713ھ/1313ء میں مکمل ہوئی۔ اس کی بڑی باقی ماندہ یادگار اولجایتو کا مقبرہ ہے، ایک عظیم الشان ہشت پہلو گنبد {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  es: "Sultaniyya es una ciudad en la parte norte de la provincia islámica medieval de Jibal, a unos 50 km al sureste de Zanjan. Los Ilkhanes mongoles la fundaron hacia finales del siglo VII/XIII: Arghun comenzó su construcción, su hijo Oljeitu la amplió en 705/1305 y la convirtió en la principal residencia estacional de su reino, y su construcción se terminó en 713/1313. Su mayor vestigio es el mausoleo de Oljeitu, un enorme octógono con cúpula {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  fr: "Sultaniyya est une ville située au nord de la province islamique médiévale de Jibal, à environ 50 km au sud-est de Zanjan. Fondée par les Ilkhans mongols vers la fin du VIIe/XIIIe siècle, sa construction fut entreprise par Arghun, agrandie en 705/1305 par son fils Oljeitu, qui en fit la principale résidence saisonnière de son royaume. Le bâtiment fut achevé en 713/1313. Son principal vestige est le mausolée d'Oljeitu, un immense octogone surmonté d'un dôme."
  tr: "Sultaniya, Orta İslam dağlık bölgesinin kuzeyinde, Zencan'ın yaklaşık elli kilometre güneydoğusunda yer alan bir şehirdir. 7. yüzyılın sonlarında Moğol İlhanlıkları tarafından kurulmuştur; Argun inşaatına başlamış, oğlu Oljeitu tarafından 705 Ah/1305 yılında genişletilmiş ve devletinin ana mevsimlik merkezi haline gelmiştir; inşaatı ise 713 Hicri/1313 yılında tamamlanmıştır. Oljeitu'nun türbesi, hâlâ ayakta olan devasa sekizgen bir kubbe {cite:Encyclopaedia-of-Islam-2 cilt 9 s. 884} {cite:Encyclopaedia-of-Islam-2 cilt 9 s. 886}."
  id: "Sultaniya adalah sebuah kota di bagian utara wilayah pegunungan Islam Tengah, sekitar lima puluh kilometer tenggara Zanjan. Kota ini didirikan oleh Ilkhanates Mongol pada akhir abad ke-7 H, dengan Argun mulai membangunnya, diperluas oleh putranya Oljeitu pada tahun 705 H/1305 M, menjadikannya pusat musiman utama negaranya, dan pembangunannya selesai pada tahun 713 H/1313 M. Di sini terdapat makam Oljeitu, sebuah kubah oktagonal besar, yang masih berdiri {cite:Encyclopaedia-of-Islam-2 vol. 9 hlm. 884} {cite:Encyclopaedia-of-Islam-2 vol. 9 hlm. 886}."
