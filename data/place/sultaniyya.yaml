summary:
  ar: "السلطانية مدينة في شمال إقليم الجبال الإسلامي الوسيط، على نحو خمسين كيلومتراً جنوب شرق زنجان. أسسها الإلخانيون المغول في أواخر القرن السابع الهجري، فبدأ أرغون بناءها، ووسّعها ابنه أولجايتو سنة 705هـ/1305م وجعلها المقر الموسمي الرئيسي لدولته، وانتهى بناؤها سنة 713هـ/1313م. وفيها ضريح أولجايتو، قبة هائلة ثمانية الأضلاع، ما زالت قائمة {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  en: "Sultaniyya is a town in the northern part of the mediaeval Islamic province of Jibal, some 50 km south-east of Zanjan. The Mongol Ilkhans founded it towards the end of the seventh/thirteenth century: Arghun began building it, his son Oljeitu enlarged it in 705/1305 and made it the chief seasonal residence of his kingdom, and its building was finished in 713/1313. Its great survivor is Oljeitu's mausoleum, an enormous domed octagon {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
  ur: "سلطانیہ قرونِ وسطیٰ کے اسلامی صوبہ جبال کے شمالی حصے میں زنجان سے تقریباً پچاس کلومیٹر جنوب مشرق میں ایک شہر ہے۔ منگول ایل خانیوں نے اسے ساتویں/تیرھویں صدی کے آخر میں بسایا: ارغون نے تعمیر شروع کی، ان کے بیٹے اولجایتو نے 705ھ/1305ء میں اسے وسعت دی اور اپنی سلطنت کا بنیادی موسمی مسکن بنایا، اور اس کی تعمیر 713ھ/1313ء میں مکمل ہوئی۔ اس کی بڑی باقی ماندہ یادگار اولجایتو کا مقبرہ ہے، ایک عظیم الشان ہشت پہلو گنبد {cite:encyclopaedia-of-islam-2 vol. 9 p. 884} {cite:encyclopaedia-of-islam-2 vol. 9 p. 885} {cite:encyclopaedia-of-islam-2 vol. 9 p. 886}."
