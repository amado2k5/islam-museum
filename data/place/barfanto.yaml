summary:
  ar: "مدينة في سفح جبل لطيف، ويذكر المؤلف أنها تبعد غربا ثلاثين ميلا عن بترني، وأن نهرا يجري بينهما {cite:nuzhat-al-mushtaq-2002 p. 898}."
  en: "A city at the foot of a gentle hill; the author gives thirty miles west of Batrānī, with a river flowing between them {cite:nuzhat-al-mushtaq-2002 p. 898}."
  es: "Una ciudad al pie de una suave colina; el autor indica treinta millas al oeste de Batrānī, con un río que fluye entre ellas {cite:nuzhat-al-mushtaq-2002 p. 898}."
  fr: "Une ville au pied d'une douce colline; l'auteur indique trente milles à l'ouest de Batrānī, avec une rivière coulant entre les deux {cite:nuzhat-al-mushtaq-2002 p. 898}."
  ur: "ایک نرم پہاڑی کے دامن میں ایک شہر؛ مصنف نے بطرانی سے تیس میل مغرب میں بتایا ہے، جس کے درمیان ایک دریا بہتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ 898}۔"
  tr: "Latif Dağı'nın eteğinde bir şehir vardır ve yazar bunun Baterni'nin otuz mil batısında olduğunu ve aralarında bir nehir aktığını belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 898}."
  id: "Sebuah kota di kaki Gunung Latif, dan penulis menyebutkan bahwa kota itu berjarak tiga puluh mil sebelah barat Baterni, dan sebuah sungai mengalir di antara keduanya {cite:Nuzhat-al-Mushtaq-2002, hlm. 898}."
