label: { ar: "نهر معقل", en: "Nahr Ma'qil", es: "Nahr Ma'qil", fr: "Nahr Ma'qil", ur: "نہر معقل", tr: "Maqil Nehri", id: "Sungai Maqil" }
summary:
  ar: "نهر معقل من أنهار البصرة؛ سمي بمعقل بن يسار المزني لأن زياداً بعثه ففتحه تبركاً به لصحبته فقال الناس نهر معقل ولم يسمّه أحد نهر زياد مع أنه حفره."
  en: "The Ma'qil canal of Basra, named for Ma'qil ibn Yasar whom Ziyad sent to open it for his Companion's blessing — though Ziyad dug it, none called it Ziyad's canal."
  es: "El canal Ma'qil de Basora, que recibió su nombre de Ma'qil ibn Yasar, a quien Ziyad envió para abrirlo y recibir la bendición de su Compañero, aunque Ziyad lo excavó, nadie lo llamó el canal de Ziyad."
  fr: "Le canal Ma'qil de Bassora, nommé d'après Ma'qil ibn Yasar que Ziyad envoya l'ouvrir pour obtenir la bénédiction de son Compagnon — bien que Ziyad l'ait creusé, personne ne l'a appelé le canal de Ziyad."
  ur: "بصرہ کی نہر معقل، جس کا نام معقل بن یسار کے نام پر رکھا گیا تھا جسے زیاد نے اپنے ساتھی کی برکت کے لیے اسے کھولنے کے لیے بھیجا تھا - اگرچہ زیاد نے اسے کھودا، لیکن کسی نے اسے زیاد کی نہر نہیں کہا۔"
  tr: "Ma'qil Nehri, Basra'nın nehirlerinden biridir; adı Ma'qil ibn Yaşar al-Muzani olarak verilmiştir çünkü Ziyad onu gönderip fethetmiştir ve yoldaşlığı için bir nimet olarak almıştır. İnsanlar bunun Ma'qil Nehri olduğunu söylerdi ama kimse ona Ziyad Nehri adını vermemiştir, oysa o kazmıştır."
  id: "Sungai Ma'qil adalah salah satu sungai di Basra; dinamai Ma'qil ibn Yasar al-Muzani karena Ziyad mengirimkannya dan menaklukkannya sebagai berkah atas kebersamaannya. Orang-orang mengatakan itu adalah Sungai Ma'qil, tetapi tidak ada yang menamainya Sungai Ziyad meskipun ia yang menggali."
