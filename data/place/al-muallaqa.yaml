summary:
  ar: "مدينة خربة بإفريقية على ساحل البحر على نحو ستة عشر ميلاً من تونس؛ يُقال إنها كانت لابنة الملك الذي يأخذ كل سفينة غصباً. بها آثار عظيمة وأحجار كبيرة ومهاوٍ بعيدة وأشراب عميقة، ومن عجيبها ما حكاه العمري أن أحجارها تُنقل إلى ما جاورها ولا ينقطع مددها ولا يظهر نقص في كثرتها {cite:umari-masalik-1924 p. 244}."
  en: "A ruined city of Ifriqiya on the Mediterranean, about sixteen miles from Tunis, said to have belonged to the daughter of the king who seized every ship; its mighty ruins, deep cisterns and inexhaustible stones were counted wonders — blocks were carted to neighbouring works yet their number never lessened {cite:umari-masalik-1924 p. 244}."
  es: "Una ciudad en ruinas de Ifriqiya en el Mediterráneo, a unas dieciséis millas de Túnez, que se dice que perteneció a la hija del rey que se apoderó de todos los barcos; sus imponentes ruinas, profundas cisternas e inagotables piedras eran consideradas maravillas: los bloques se transportaban en carros a las obras vecinas, pero su número nunca disminuía {cite:umari-masalik-1924 p. 244}."
  fr: "Une ville en ruines d'Ifriqiya sur la Méditerranée, à environ seize milles de Tunis, qui aurait appartenu à la fille du roi qui s'emparait de tous les navires; ses puissantes ruines, ses citernes profondes et ses pierres inépuisables étaient considérées comme des merveilles — des blocs étaient transportés vers les chantiers voisins, mais leur nombre ne diminuait jamais {cite:umari-masalik-1924 p. 244}."
  ur: "تیونس سے سولہ میل کے فاصلے پر بحیرہ روم پر واقع ایک تباہ شدہ شہر افریقیہ کے بارے میں کہا جاتا ہے کہ یہ بادشاہ کی بیٹی کا تھا جس نے ہر جہاز پر قبضہ کیا تھا۔ اس کے زبردست کھنڈرات، گہرے حوض اور ناقابل تسخیر پتھروں کو عجائبات میں شمار کیا جاتا تھا - بلاکس پڑوسیوں کے کاموں کے لیے بنائے گئے تھے لیکن ان کی تعداد میں کبھی کمی نہیں آئی۔ 244}۔"
