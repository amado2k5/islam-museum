summary:
  ar: "مدينة خربة بإفريقية على ساحل البحر على نحو ستة عشر ميلاً من تونس؛ يُقال إنها كانت لابنة الملك الذي يأخذ كل سفينة غصباً. بها آثار عظيمة وأحجار كبيرة ومهاوٍ بعيدة وأشراب عميقة، ومن عجيبها ما حكاه العمري أن أحجارها تُنقل إلى ما جاورها ولا ينقطع مددها ولا يظهر نقص في كثرتها {cite:umari-masalik-1924 p. 244}."
  en: "A ruined city of Ifriqiya on the Mediterranean, about sixteen miles from Tunis, said to have belonged to the daughter of the king who seized every ship; its mighty ruins, deep cisterns and inexhaustible stones were counted wonders — blocks were carted to neighbouring works yet their number never lessened {cite:umari-masalik-1924 p. 244}."
