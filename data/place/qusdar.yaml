  ar: "قصدار بلدة بمكران؛ فتحها سنان بن سلمة ثم انتقض أهلها وبها مات ثم فتحها المنذر بن الجارود وسبى بها."
  en: "Qusdar of Makran; first opened by Sinan ibn Salama who died there at its breach — retaken by al-Mundhir ibn al-Jarud with captives."
  es: "Qusdar de Makrán; abierto por primera vez por Sinan ibn Salama, quien murió allí en su brecha, fue retomado por al-Mundhir ibn al-Jarud con cautivos."
  fr: "Qusdar de Makran; ouverte pour la première fois par Sinan ibn Salama qui y mourut lors de sa brèche — reprise par al-Mundhir ibn al-Jarud avec des captifs."
  ur: "مکران کا قصر؛ سب سے پہلے سنان ابن سلامہ نے کھولا جو اس کی خلاف ورزی پر وہیں مر گیا - المنذر ابن الجرود نے اسیروں کے ساتھ دوبارہ حاصل کیا۔"
  tr: "Kasdar, Makran'da bir kasabadır; Sinan ibn Salamah tarafından fethedildi, sonra halkı isyan etti, orada öldü ve ardından el-Mundhir bin el-Jarud onu ele geçirip esir aldı."
  id: "Qasdar adalah sebuah kota di Makran; kota ini ditaklukkan oleh Sinan ibn Salamah, kemudian penduduknya memberontak, meninggal di sana, dan kemudian al-Mundhir ibn al-Jarud merebutnya dan menangkapnya."
