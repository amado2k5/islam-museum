summary:
  ar: "جبل تقع على ظهره ديار بني سعد، وفيه جملة من قبائل هذيل، ويذكر الإدريسي أن رأسه من أبرد المواضع حتى يجمد فيه الماء أحياناً. {cite:nuzhat-al-mushtaq-2002 p. 145}"
  en: "A mountain on whose back lie the lands of Banu Sa'd, with several Hudhayl clans; al-Idrisi says its summit is so cold that water sometimes freezes there. {cite:nuzhat-al-mushtaq-2002 p. 145}"
  es: "Una montaña sobre cuya ladera se extienden las tierras de Banu Sa'd, con varios clanes Hudhayl; al-Idrisi afirma que su cumbre es tan fría que a veces el agua se congela allí. {cite:nuzhat-al-mushtaq-2002 p. 145}"
  fr: "Une montagne sur le versant de laquelle s'étendent les terres des Banu Sa'd, peuplées de plusieurs clans Hudhayl; al-Idrisi affirme que son sommet est si froid que l'eau y gèle parfois. {cite:nuzhat-al-mushtaq-2002 p. 145}"
  ur: "ایک پہاڑ جس کی پشت پر بنو سعد کی زمینیں ہیں، جن میں کئی قبیلے ہذیل ہیں۔ الادریسی کا کہنا ہے کہ اس کی چوٹی اتنی ٹھنڈی ہے کہ کبھی کبھی وہاں پانی جم جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 145}"
  tr: "Sırtında Banu Sa'd toprakları bulunan bir dağdır ve içinde Hudhayl'in birkaç kabilesi bulunmaktadır. Al-Idrisi, zirvesinin bazen suyun donduğu en soğuk yerlerden biri olduğunu belirtir. {kaynak:Nuzhat-al-mushtaq-2002 s. 145}"
  id: "Sebuah gunung di punggungnya terdapat tanah Banu Sa'd, dan di sini terdapat beberapa suku Hudhayl. Al-Idrisi menyebutkan bahwa puncaknya termasuk tempat terdingin di mana air kadang-kadang membeku. {cite:nuzhat-al-mushtaq-2002 hlm. 145}"
