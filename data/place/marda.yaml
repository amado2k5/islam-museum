summary:
  ar: "مدينة كانت دار مملكة، فيها آثار عجيبة من البنيان، وقنطرة ومجرى ماء، وقصر يسمى دار الطبيخ، ويصفها الإدريسي بأنها تنطق بالملك والقدرة. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  en: "A city that was once a royal seat, with remarkable monuments, a bridge, a water channel and a palace called the kitchen house; al-Idrisi says its ruins speak of power and rule. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  es: "Una ciudad que antaño fue sede real, con monumentos notables, un puente, un canal de agua y un palacio llamado la casa de la cocina; al-Idrisi afirma que sus ruinas hablan de poder y dominio. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  fr: "Ville qui fut jadis siège royal, dotée de monuments remarquables, d'un pont, d'un canal et d'un palais appelé la maison-cuisine; selon al-Idrisi, ses ruines témoignent de la puissance et du pouvoir. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  ur: "ایک ایسا شہر جو کسی زمانے میں ایک شاہی نشست تھا، جس میں قابل ذکر یادگاریں، ایک پل، ایک پانی کا نالہ اور ایک محل جسے کچن ہاؤس کہتے ہیں۔ الادریسی کا کہنا ہے کہ اس کے کھنڈرات طاقت اور حکمرانی کی بات کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 545}"
  tr: "Bir zamanlar krallık olan, olağanüstü mimari kalıntıları, bir kemer, bir su yolu ve el-İdrisi'nin krallık ve gücün sesi olarak tanımladığı Dar al-Tabih adlı bir sarayı olan bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 545}"
  id: "Sebuah kota yang dulunya merupakan kerajaan, dengan reruntuhan arsitektur yang luar biasa, sebuah lengkungan, aliran air, dan sebuah istana bernama Dar al-Tabikh, yang al-Idrisi gambarkan sebagai suara kekuasaan dan kerajaan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 545}"
