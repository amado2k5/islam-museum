summary:
  ar: "اللّكز أرض وقلعة بأعالي القوقاز؛ في سهلها أنزل مروان بن محمد خلقاً من الخزر ما بين السمور والشابران، وامتنع صاحب قلعتها من أداء الوظيفة وخرج يريد صاحب الخزر فقتله راعٍ بسهم وهو لا يعرفه فصالح أهل اللكز على عشرين ألف مدي تحمل إلى إهراء الباب وولّى عليهم خشرماً السلمي."
  en: "Al-Lakz, a land and fortress of the upper Caucasus; in its plain Marwan ibn Muhammad settled a body of Khazars between al-Samur and al-Shabiran; its fortress-lord withheld the levy and went out seeking the Khazar king, whereupon a herdsman killed him with an arrow unawares — so the Lakz people compounded for twenty thousand mudd borne to Bab's granaries, and Khashrama al-Sulami was set over them."
