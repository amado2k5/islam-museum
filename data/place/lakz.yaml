summary:
  ar: "اللّكز أرض وقلعة بأعالي القوقاز؛ في سهلها أنزل مروان بن محمد خلقاً من الخزر ما بين السمور والشابران، وامتنع صاحب قلعتها من أداء الوظيفة وخرج يريد صاحب الخزر فقتله راعٍ بسهم وهو لا يعرفه فصالح أهل اللكز على عشرين ألف مدي تحمل إلى إهراء الباب وولّى عليهم خشرماً السلمي."
  en: "Al-Lakz, a land and fortress of the upper Caucasus; in its plain Marwan ibn Muhammad settled a body of Khazars between al-Samur and al-Shabiran; its fortress-lord withheld the levy and went out seeking the Khazar king, whereupon a herdsman killed him with an arrow unawares — so the Lakz people compounded for twenty thousand mudd borne to Bab's granaries, and Khashrama al-Sulami was set over them."
  es: "Al-Lakz, tierra y fortaleza del alto Cáucaso; en su llanura, Marwan ibn Muhammad asentó un grupo de jázaros entre al-Samur y al-Shabiran; su señor de la fortaleza retuvo el tributo y salió en busca del rey jázaro, momento en el que un pastor lo mató con una flecha por sorpresa; así, el pueblo de Lakz pagó un acuerdo por veinte mil mudd llevados a los graneros de Bab, y Khashrama al-Sulami fue puesto al frente de ellos."
  fr: "Al-Lakz, terre et forteresse du Haut-Caucase; dans sa plaine, Marwan ibn Muhammad installa un groupe de Khazars entre al-Samur et al-Shabiran; le seigneur de sa forteresse retint la levée et partit à la recherche du roi Khazar, sur quoi un berger le tua d'une flèche par surprise — alors les habitants de Lakz constituèrent une entente pour vingt mille mudd transportés aux greniers de Bab, et Khashrama al-Sulami fut placé à leur tête."
  ur: "ال لکز، بالائی قفقاز کی زمین اور قلعہ؛ اس کے میدان میں مروان بن محمد نے السامور اور الشبیران کے درمیان خزروں کی ایک لاش کو آباد کیا۔ اس کے قلعہ دار نے محصول روک لیا اور خضر بادشاہ کی تلاش میں نکلا، جس پر ایک چرواہے نے اسے بے خبری میں ایک تیر سے مار ڈالا - چنانچہ اہل لکز نے باب کے اناج میں لے جانے والے بیس ہزار مٹی کو اکٹھا کر لیا، اور خشرمہ السلمی کو ان پر مقرر کر دیا گیا۔"
  tr: "Al-Lakz, Yukarı Kafkasya'da bir toprak ve kaledir; ovalarında Mervan bin Muhammed, Al-Samur ile Şabran arasında bir grup Hazar göndermiştir. Kalenin sahibi görevini yerine getirmeyi reddetmiş ve Hazar sahibini aramaya çıkmıştır. Bir çoban onu tanımadan okla öldürmüştür, bu yüzden Al-Lakz halkı yirmi bin midi ile anlaşmış, İhra kapısına götürülmüş ve Haşram El-Selmi'yi onların başına atamıştır."
  id: "Al-Lakz adalah sebuah tanah dan benteng di Kaukasus Atas; di datarannya, Marwan ibn Muhammad mengirim sekelompok Khazar antara Al-Samur dan Shabran. Pemilik bentengnya menolak menjalankan tugasnya dan pergi mencari pemilik Khazar. Seorang gembala membunuhnya dengan panah tanpa mengetahuinya, sehingga penduduk Al-Lakz setuju dengan dua puluh ribu midi, dibawa ke gerbang Ihra, dan menunjuk Khashram Al-Salmi sebagai pemimpin mereka."
