  ar: "موضع في طريق المدائن؛ عند البلاذري انتهى إليه خالد بن عرفطة على خيل الطلب يقتلون من لحقوا من الفرس ونزل على رجل يقال له بسطام فأكرمه وبرّه فسمّي نهر هناك نهر بسطام."
  en: "Place on the al-Mada'in road; in al-Baladhuri the limit of Khalid ibn Urfuta's pursuit of fleeing Persians, where he lodged with a man named Bustam who honored him — the canal there being named Nahr Bustam."
  es: "Situado en el camino de al-Mada'in; en al-Baladhuri, el límite de la persecución de persas fugitivos por parte de Khalid ibn Urfuta, donde se hospedó con un hombre llamado Bustam que lo honró; el canal de ese lugar se llama Nahr Bustam."
  fr: "Lieu sur la route d'al-Mada'in; à al-Baladhuri, limite de la poursuite des Perses en fuite par Khalid ibn Urfuta, où il logea chez un homme nommé Bustam qui l'honora — le canal à cet endroit étant nommé Nahr Bustam."
