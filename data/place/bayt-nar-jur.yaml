summary:
  ar: "بيت نار بمدينة جور من أرض فارس بناه أردشير بن بابك على عين عجيبة على ساعة من المدينة، وقد رآه المسعودي بنفسه، وله عيد وهو أحد متنزهات فارس، وجور بلد ماء الورد الجوري الذي يعمل به وبكوار أطيب ماء ورد في العالم {cite:muruj-al-dhahab p. 551}."
  en: "Ardashir ibn Babak's fire-temple at Jur of Fars — seen by al-Mas'udi himself — set on a fine spring an hour from town, keeping its own festival among Fars's promenades; Jur with Kawar yields the world's sweetest rose-water {cite:muruj-al-dhahab p. 551}."
