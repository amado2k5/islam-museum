label: { ar: "بيت النار بجور", en: "The fire-temple of Jur", es: "El templo del fuego de Jur", fr: "Le temple du feu de Jur", ur: "جور کا آتش گیر مندر" }
summary:
  ar: "بيت نار بمدينة جور من أرض فارس بناه أردشير بن بابك على عين عجيبة على ساعة من المدينة، وقد رآه المسعودي بنفسه، وله عيد وهو أحد متنزهات فارس، وجور بلد ماء الورد الجوري الذي يعمل به وبكوار أطيب ماء ورد في العالم {cite:muruj-al-dhahab p. 551}."
  en: "Ardashir ibn Babak's fire-temple at Jur of Fars — seen by al-Mas'udi himself — set on a fine spring an hour from town, keeping its own festival among Fars's promenades; Jur with Kawar yields the world's sweetest rose-water {cite:muruj-al-dhahab p. 551}."
  es: "El templo del fuego de Ardashir ibn Babak en Jur de Fars —visto por el propio al-Mas'udi— situado en un manantial a una hora de la ciudad, celebra su propio festival entre los paseos de Fars; Jur con Kawar produce el agua de rosas más dulce del mundo {cite:muruj-al-dhahab p. 551}."
  fr: "Le temple du feu d'Ardashir ibn Babak à Jur de Fars — vu par al-Mas'udi lui-même — situé sur une belle source à une heure de la ville, organisant son propre festival parmi les promenades de Fars; Jur avec Kawar produit l'eau de rose la plus douce du monde {cite:muruj-al-dhahab p. 551}."
  ur: "اردشیر ابن بابک کا جور آف فارس میں آتش گیر معبد - جسے خود المسعودی نے دیکھا تھا - شہر سے ایک گھنٹے کے فاصلے پر ایک عمدہ چشمے پر قائم ہے، جس نے فارس کے چہل قدمی کے درمیان اپنا تہوار برقرار رکھا ہے۔ کوار کے ساتھ جور سے دنیا کا سب سے میٹھا گلاب کا پانی ملتا ہے {حوالہ: مروج الذہب صفحہ 551}۔"
