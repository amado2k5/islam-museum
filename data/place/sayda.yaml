summary:
  ar: "مدينة على ساحل البحر الملح، تنسب إلى امرأة كانت في الجاهلية، رخيصة الأسعار، محدقة بالبساتين والأشجار، ويُصنع فيها السميكات التي يُستفاد منها في الاستمتاع. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  en: "A city on the salt sea named after a woman of pre-Islamic times, cheap, ringed by orchards and trees, where a fish is cured for use. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  es: "Una ciudad a orillas del mar salado, que lleva el nombre de una mujer de la época preislámica, barata, rodeada de huertos y árboles, donde se cura un pescado para su consumo. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  fr: "Une ville au bord de la mer salée, nommée d'après une femme de l'époque préislamique, bon marché, entourée de vergers et d'arbres, où l'on prépare du poisson pour la consommation. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  ur: "نمکین سمندر پر ایک شہر جسے زمانہ جاہلیت کی ایک عورت کے نام سے موسوم کیا گیا، سستا، باغات اور درختوں سے جڑا ہوا، جہاں ایک مچھلی استعمال کے لیے ٹھیک کی جاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 371}"
  tr: "Tuz kıyısındaki bir şehir, İslam öncesi dönemde yaşamış bir kadına atfedilen, ucuzdu, meyve bahçeleri ve ağaçlarla çevriliydi ve keyif için kullanılan balıklar üretiyordu. {kaynak:nuzhat-al-mushtaq-2002 s. 371}"
  id: "Sebuah kota di pesisir asin, yang dikaitkan dengan seorang wanita yang berada di era pra-Islam, murah, dikelilingi oleh kebun buah dan pohon, serta membuat ikan yang digunakan untuk hiburan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 371}"
