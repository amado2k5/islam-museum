summary:
  ar: "مدينة صغيرة كالقرية الجامعة في أرض سفالة، أهلها في ذلة وفقر، ولا يملكون ما يتصرفون به، ومعادنها الحديد، ويُنقل حديدهم إلى بلاد الهند {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
  en: "A small town like a gathered village in the Sofala lands. Its people are poor and have little to trade; the region's hills hold iron, which is carried to India {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
  es: "Un pequeño pueblo, como una aldea agrupada, en las tierras de Sofala. Sus habitantes son pobres y tienen poco que comerciar; las colinas de la región contienen hierro, que se transporta a la India {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
  fr: "Une petite ville semblable à un village regroupé dans les terres de Sofala. Ses habitants sont pauvres et n'ont que peu de choses à échanger; les collines de la région recèlent du fer, qui est transporté vers l'Inde {cite:nuzhat-al-mushtaq-2002 p. 67-68}."
  ur: "ایک چھوٹا سا قصبہ جیسا کہ سفالہ زمینوں میں اکٹھا گاؤں۔ اس کے لوگ غریب ہیں اور تجارت کے لیے بہت کم ہیں۔ خطے کی پہاڑیوں میں لوہا ہے جسے ہندوستان لے جایا جاتا ہے {حوالہ: نزہت المشتاق-2002 ص 67-68}۔"
  tr: "Küçük bir şehir, sefalet diyarında bir köy gibi, halkı aşağılanma ve yoksulluk içinde, uğraşacak hiçbir şeyi yok, demir cevheri taşınıyor ve demirleri Hindistan topraklarına taşınıyor {cite:Nuzhat-al-Mushtaq-2002, s. 67-68}."
  id: "Sebuah kota kecil seperti desa di tanah kebejatan, penduduknya dalam penghinaan dan kemiskinan, mereka tidak punya apa-apa untuk dihadapi, bijih besi diangkut, dan besi mereka diangkut ke tanah India {cite:Nuzhat-al-Mushtaq-2002, hlm. 67-68}."
