summary:
  ar: "عند البلاذري: أرض دخلتها خيول المسلمين بعد فتح مصر فلقوا قتالاً شديداً ورشقاً بالنبل حتى فقئت الحدق فسمّوا دماة الحدق ثم صالحهم عبد الله بن سعد بن أبي سرح على هدنة بغير جزية."
  en: "In al-Baladhuri: the land Muslim horses entered after Egypt's conquest, meeting fierce fighting and arrow-showers that gouged eyes — 'the eye-bleeders' — until Abdallah ibn Sa'd ibn Abi Sarh made peace with them on a truce without jizya."
  es: "En al-Baladhuri: la tierra a la que entraron los caballos musulmanes tras la conquista de Egipto, encontrándose con feroces combates y lluvias de flechas que les sacaban los ojos —'las que les sangraban los ojos'— hasta que Abdallah ibn Sa'd ibn Abi Sarh hizo las paces con ellos mediante una tregua sin jizya."
  fr: "À al-Baladhuri: le pays où les chevaux musulmans pénétrèrent après la conquête de l'Égypte, rencontrant des combats féroces et des flèches qui crevaient les yeux — « les saigneurs d'yeux » — jusqu'à ce qu'Abdallah ibn Sa'd ibn Abi Sarh fasse la paix avec eux sur une trêve sans jizya."
  ur: "البلادھوری میں ہے: مصر کی فتح کے بعد سرزمین مسلم گھوڑے داخل ہوئے، شدید لڑائی اور تیروں کی بارش ہوئی جس نے آنکھیں پھوڑ دیں - 'آنکھوں سے خون بہانے والے' - یہاں تک کہ عبداللہ ابن سعد ابن ابی سرح نے ان سے بغیر جزیہ کے صلح کر لی۔"
