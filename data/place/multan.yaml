summary:
  ar: "مدينة في جنوب البنجاب بباكستان، فتحها محمد بن القاسم سنة 712م، وهي مركز مهم للتصوف. وبها على نهر مهران من أرض السند الهيكل الذي فيه الصنم المشهور عند أهلها {cite:muruj-al-dhahab p. 557}، وبها البيت الذي يقال إنه أحد البيوت السبعة وفيه الصنم الحديدي الذي تمسكه حجارة المغناطيس في وسط القبة، تحجه الهند من أقاصي بلادها {cite:fihrist-ibn-al-nadim p. 485}"
  en: A city in southern Punjab in Pakistan, conquered by Muhammad ibn al-Qasim in 712 CE; it is an important centre of Sufism.
  es: "Ciudad situada en el sur de Punjab, en Pakistán, conquistada por Muhammad ibn al-Qasim en el año 712 d.C.; es un importante centro del sufismo."
  fr: "Une ville du sud du Pendjab au Pakistan, conquise par Muhammad ibn al-Qasim en 712 après J.-C.; c'est un centre important du soufisme."
  ur: "پاکستان میں جنوبی پنجاب کا ایک شہر، جسے محمد بن القاسم نے 712 عیسوی میں فتح کیا تھا۔ یہ تصوف کا ایک اہم مرکز ہے۔"
  tr: "Pakistan'ın güney Pencap'ında yer alan bir şehir, 712 yılında Muhammed ibn el-Kasim tarafından fethedilmiştir ve Sufizm için önemli bir merkezdir. Sindh topraklarında, Mehran Nehri üzerinde, halkı arasında ünlü heykelin bulunduğu tapınak yer alır {cite:muruj-al-dhahab s. 557} ve kubbenin ortasında manyetik taşlarla tutulan demir heykelin bulunduğu yedi evden biri olduğu söylenen evi barındırır; Hindistan bu heykelin en uzak köşelerinden ziyaret eder {cite:fihrist-ibn-al-nadim s. 485}"
  id: "Sebuah kota di selatan Punjab, Pakistan, yang ditaklukkan oleh Muhammad ibn al-Qasim pada tahun 712 M, dan merupakan pusat penting bagi tasawuf. Kota ini terletak di Sungai Mehran di tanah Sindh, kuil yang berisi arca terkenal di antara penduduknya {cite:muruj-al-dhahab hlm. 557}, dan di dalamnya terdapat rumah yang dikatakan sebagai salah satu dari tujuh rumah yang berisi arca besi yang dipegang oleh batu magnetik di tengah kubah, yang dikunjungi India dari sudut terjauh tanahnya {cite:fihrist-ibn-al-nadim hlm. 485}"
