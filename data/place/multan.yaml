summary:
  ar: "مدينة في جنوب البنجاب بباكستان، فتحها محمد بن القاسم سنة 712م، وهي مركز مهم للتصوف. وبها على نهر مهران من أرض السند الهيكل الذي فيه الصنم المشهور عند أهلها {cite:muruj-al-dhahab p. 557}، وبها البيت الذي يقال إنه أحد البيوت السبعة وفيه الصنم الحديدي الذي تمسكه حجارة المغناطيس في وسط القبة، تحجه الهند من أقاصي بلادها {cite:fihrist-ibn-al-nadim p. 485}"
  en: A city in southern Punjab in Pakistan, conquered by Muhammad ibn al-Qasim in 712 CE; it is an important centre of Sufism.
