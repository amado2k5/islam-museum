label: { ar: "بحر نيطس (البحر الأسود)", en: "The sea of Nitas (Black Sea)" }
summary:
  ar: "خليج يتفرع من البحر الشامي عند فم أبذه، وعرضه هناك بقدر رمية سهم، ويتصل عند القسطنطينية، ثم يمتد شرقاً إلى مصبات الروس وبرجان ونهر دنابر ونهر دنو حتى مضيق القسطنطينية، وطوله نحو ألف وثلاث مائة ميل، وفيه ست جزائر {cite:nuzhat-al-mushtaq-2002 p. 12}."
  en: "A gulf branching from the Syrian sea at the mouth of Abdhah, narrow enough to cross with an arrow's flight there. It widens at Constantinople and runs east past the Rus, Burjan and the Dnieper and Danube rivers back to the Constantinople strait; about 1,300 miles long with six islands {cite:nuzhat-al-mushtaq-2002 p. 12}."
