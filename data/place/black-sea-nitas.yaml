label: { ar: "بحر نيطس ⁦(البحر الأسود)⁩", en: "The sea of Nitas (Black Sea)", es: "El mar de Nitas (Mar Negro)", fr: "La mer de Nitas (mer Noire)", ur: "نطاس کا سمندر ⁦(بحیرہ اسود)⁩" }
summary:
  ar: "خليج يتفرع من البحر الشامي عند فم أبذه، وعرضه هناك بقدر رمية سهم، ويتصل عند القسطنطينية، ثم يمتد شرقاً إلى مصبات الروس وبرجان ونهر دنابر ونهر دنو حتى مضيق القسطنطينية، وطوله نحو ألف وثلاث مائة ميل، وفيه ست جزائر {cite:nuzhat-al-mushtaq-2002 p. 12}."
  en: "A gulf branching from the Syrian sea at the mouth of Abdhah, narrow enough to cross with an arrow's flight there. It widens at Constantinople and runs east past the Rus, Burjan and the Dnieper and Danube rivers back to the Constantinople strait; about 1,300 miles long with six islands {cite:nuzhat-al-mushtaq-2002 p. 12}."
  es: "Un golfo que se ramifica desde el mar de Siria en la desembocadura del Abdhah, lo suficientemente estrecho como para cruzarlo con el vuelo de una flecha. Se ensancha en Constantinopla y se extiende hacia el este pasando por los ríos Rus, Burjan, Dniéper y Danubio hasta el estrecho de Constantinopla; tiene aproximadamente 1300 millas de largo y cuenta con seis islas {cite:nuzhat-al-mushtaq-2002 p. 12}."
  fr: "Un golfe se ramifiant de la mer de Syrie à l'embouchure d'Abdhah, suffisamment étroit pour être traversé par une flèche à cet endroit. Il s'élargit à Constantinople et s'étend vers l'est, longeant la Rus', le Burjan et les fleuves Dniepr et Danube, jusqu'au détroit de Constantinople; environ 2 100 kilomètres de long et six îles {cite: nuzhat-al-mushtaq-2002 p. 12}."
  ur: "بحیرہ شام سے ابداح کے منہ پر ایک خلیج جو اس قدر تنگ ہے کہ وہاں تیر کے ساتھ عبور کیا جا سکتا ہے۔ یہ قسطنطنیہ میں چوڑا ہوتا ہے اور مشرق میں روس، برجان اور ڈینیپر اور ڈینیوب دریاؤں سے گزر کر آبنائے قسطنطنیہ تک جاتا ہے۔ چھ جزیروں کے ساتھ تقریباً 1,300 میل لمبا {حوالہ: نزہت المشتاق-2002 صفحہ۔ 12}۔"
