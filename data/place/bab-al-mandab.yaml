summary:
  ar: "مضيق بين البحر الأحمر وخليج عدن، يقسمه بركان ميون ⁦(بريم)⁩ إلى مضيق كبير عرضه نحو 14 كم ومضيق صغير عرضه نحو 2.5 كم، وتياراته مع الموسم خطرة على السفن الشراعية {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  en: "The straits between the Red Sea and the Gulf of Aden, divided by the volcanic island of Mayyun (Perim) into a Large Strait about 14 km wide and a Small Strait about 2.5 km wide; monsoon currents make the passage dangerous for sailing craft {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  es: "El estrecho entre el Mar Rojo y el Golfo de Adén, dividido por la isla volcánica de Mayyun (Perim) en un Estrecho Grande de unos 14 km de ancho y un Estrecho Pequeño de unos 2,5 km de ancho; las corrientes monzónicas hacen que el paso sea peligroso para las embarcaciones de vela {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
  fr: "Les détroits entre la mer Rouge et le golfe d'Aden, divisés par l'île volcanique de Mayyun (Perim) en un Grand Détroit d'environ 14 km de large et un Petit Détroit d'environ 2,5 km de large; les courants de mousson rendent le passage dangereux pour les navires à voile {cite:encyclopaedia-of-islam-2 vol. 1 p. 894}."
