label: { ar: "بحيرة زرة", en: "Lake Zarra", es: "Lago Zarra", fr: "Lac Zarra", ur: "جھیل زررہ", tr: "Zarra Gölü", id: "Danau Zarra" }
summary:
  ar: "بحيرة يتسع ماؤها وينتقص بحسب الفصول، وعليها قرى ومزارع، وطولها نحو تسعة أميال، وفيها سمك كثير. {cite:nuzhat-al-mushtaq-2002 p. 455}"
  en: "A lake whose water spreads and shrinks with the seasons, with villages and farms along it, about nine miles long and rich in fish. {cite:nuzhat-al-mushtaq-2002 p. 455}"
  es: "Un lago cuyas aguas se expanden y se contraen con las estaciones, con pueblos y granjas a sus orillas, de unos nueve kilómetros de largo y rico en peces. {cite:nuzhat-al-mushtaq-2002 p. 455}"
  fr: "Un lac dont la superficie varie au fil des saisons, bordé de villages et de fermes, d'une quinzaine de kilomètres de long et riche en poissons. {cite:nuzhat-al-mushtaq-2002 p. 455}"
  ur: "ایک جھیل جس کا پانی موسموں کے ساتھ پھیلتا اور سکڑتا ہے، اس کے ساتھ گاؤں اور کھیت ہیں، تقریباً نو میل لمبی اور مچھلیوں سے مالا مال ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 455}"
  tr: "Mevsimlere göre suyu genişleyip azalabilen, üzerinde köyler ve çiftlikler bulunan, yaklaşık dokuz mil uzunluğunda ve çok sayıda balık barındıran bir göl. {cite:nuzhat-al-mushtaq-2002 s. 455}"
  id: "Danau yang airnya dapat melebar dan berkurang sesuai musim, dengan desa dan pertanian di atasnya, panjangnya sekitar sembilan mil, dan memiliki banyak ikan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 455}"
