summary:
  ar: "فرغانة إقليم ما وراء النهر على سيحون؛ فتح صالح بن مسلم الباهلي منها كاسان وأورشت وسخر وأخسكت وهي مدينتها القديمة وكان نصر بن سيار في جيشه."
  en: "Farghana, the Transoxanian land on the Sayhun; Salih ibn Muslim took its Kasan, Urusht, Sakhr and Akhsikath — its old city — with Nasr ibn Sayyar in his host."
  es: "Farghana, la tierra transoxánica en el Sayhun; Salih ibn Muslim tomó Kasan, Urusht, Sakhr y Akhsikath —su ciudad vieja— con Nasr ibn Sayyar en su ejército."
  fr: "Ferghana, la terre transoxanienne sur le Sayhun; Salih ibn Muslim prit son Kasan, Urusht, Sakhr et Akhsikath — sa vieille ville — avec Nasr ibn Sayyar dans son armée."
  ur: "فرغانہ، سیہون پر ٹرانسکسانیائی زمین؛ صالح بن مسلم نے اس کے قصان، اُرُشت، صخر اور اخصِقات — اس کے پرانے شہر — کو نصر بن سیار کے ساتھ اپنے میزبان میں لے لیا۔"
  tr: "Fergana, Sihun Nehri üzerindeki nehrin ötesinde bir bölgeydi; Salih ibn Muslim al-Bahili Kasan, Orsht, Sakhr ve eski şehri olan Akhskt'ı fethetti ve Nasr ibn Sayyar onun ordusundaydı."
  id: "Fergana adalah wilayah di seberang sungai di Sihun; Saleh ibn Muslim al-Bahili menaklukkan Kasan, Orsht, Sakhr, dan Akhskt, yang merupakan kota kunonya, dan Nasr ibn Sayyar berada dalam pasukannya."
