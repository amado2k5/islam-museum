  id: "Teluk Panglima Orang Beriman adalah kanal kuno yang menghubungkan Sungai Nil ke Laut Merah. Orang Arab mengaitkannya dengan penggalian Umar ibn al-Khattab untuk memasok Mekah dan Madinah, serta garis keturunannya dari Ptolemy hingga Tarjan. {cite:Farghani-elements-astronomy hlm. 396}"
