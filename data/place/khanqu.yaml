summary:
  ar: "خانقو مدينة التجار والأموال في الصين عند أبي دلف الينبوعي وطولها أربعون فرسخا، وقيل للصين ثلاثمائة مدينة كلها عامرة وعلى كل خمسين مدينة ملك من قبل البغبور، ومن مدنهم ورصنوا وبانصوا التي تتصل بناحية التبت والترك والتغزغز {cite:fihrist-ibn-al-nadim p. 492}."
  en: "Khanqu — China's city of merchants and wealth, forty parasangs long {cite:fihrist-ibn-al-nadim}"
  es: "Khanqu — Ciudad de comerciantes y riqueza de China, de cuarenta parasangs de largo {cite:fihrist-ibn-al-nadim}"
  fr: "Khanqu — la ville chinoise des marchands et de la richesse, longue de quarante parasanges {cite:fihrist-ibn-al-nadim}"
  ur: "خانقو - تاجروں اور دولت کا چین کا شہر، چالیس پارسنگ طویل {حوالہ: فہرست ابن الندیم}"
  tr: "Çin'de Abu Dulf al-Yanbu'i yakınlarındaki tüccar ve para şehriydi; kırk farsakh uzunluğundaydı. Çin'in üç yüz şehrinin yerleşim olduğu ve her elli şehrin Bigburlar tarafından yönetildiği söylenir. Şehirleri arasında, Tibet ve Türk bölgeleriyle bağlantılı Rusanu ve Bansu da vardı {cite:fihrist-ibn-al-nadim s. 492}."
  id: "Mereka adalah kota pedagang dan uang di Tiongkok dekat Abu Dulf al-Yanbu'i, yang panjangnya empat puluh farsakh. Dikatakan bahwa Tiongkok memiliki tiga ratus kota yang semuanya dihuni, dengan masing-masing lima puluh kota diperintah oleh Bigbur. Di antara kota-kota mereka adalah Rusanu dan Bansu, yang terhubung dengan wilayah Tibet dan Turkik {cite:fihrist-ibn-al-nadim hlm. 492}."
