summary:
  ar: "البيت المعظم الباقي للصابئة الحرانيين بمدينة حران في باب الرقة سنة اثنتين وثلاثين وثلاثمائة، وهو هيكل آزر أبي إبراهيم عندهم، وذكر ابن عيشون القاضي في قصيدته ما تحته من السراديب الأربعة المتخذة لأنواع صور الأصنام الممثلة للأجسام السماوية وإيرادهم لأطفالهم إليها وعرضهم على الأصنام وما يظهر منها من نطق بحيل المنافيخ والسدنة من وراء الجدر {cite:muruj-al-dhahab p. 545-546}."
  en: "The last great Harranian temple in 332 — Azar's shrine in Bab al-Raqqa with four crypt-vaults of celestial-shaped idols that 'spoke' through priests' pipes, where children were brought to turn pale at the voices, as Ibn Ayshun's qasida describes {cite:muruj-al-dhahab p. 545-546}."
  es: "El último gran templo harranio en 332: el santuario de Azar en Bab al-Raqqa con cuatro criptas-bóvedas de ídolos con forma celestial que \"hablaban\" a través de las flautas de los sacerdotes, donde se llevaba a los niños para que palidecieran al oír las voces, como describe la qasida de Ibn Ayshun {cite:muruj-al-dhahab p. 545-546}."
  fr: "Le dernier grand temple harranien en 332 — le sanctuaire d'Azar à Bab al-Raqqa avec quatre cryptes voûtées d'idoles de forme céleste qui « parlaient » à travers les pipes des prêtres, où les enfants étaient amenés pour pâlir aux voix, comme le décrit la qasida d'Ibn Ayshun {cite:muruj-al-dhahab p. 545-546}."
  ur: "332 میں آخری عظیم ہررانی ہیکل - باب الرقہ میں آزر کا مزار جس میں آسمانی شکل کے بت کے چار تہہ خانے تھے جو پادریوں کے پائپوں کے ذریعے 'بولتے' تھے، جہاں بچوں کو آوازوں پر پیلا پڑنے کے لیے لایا جاتا تھا، جیسا کہ ابن ایشون کا قصیدہ بیان کرتا ہے۔ 545-546}۔"
  tr: "Harran şehrinde, 332 Hicri yılında Bab al-Rakka'da Harrani Sabialıların hayatta kalan evi, aralarında Azar Ebu İbrahim'in tapınağı da bulunmaktadır. İbn 'Ayshun al-Qadi şiirinde, altındaki dört mahzeni göksel cisimleri temsil eden çeşitli heykellerin çocuklarına götürülüp putlara sunulması ile duvarların arkasındaki üfleyiciler ve bekçilerin sesinden bahsetmiştir {atıf:Muruj-al-Dhahab, s. 545-546}."
  id: "Rumah yang masih ada dari Harrani Sabians di kota Harran di Bab al-Raqqa pada tahun 332 H, yang merupakan kuil Azar Abu Ibrahim di antara mereka. Ibn 'Ayshun al-Qadi menyebutkan dalam puisinya empat ruang bawah tanah yang digunakan untuk berbagai patung berhala yang mewakili benda-benda langit, yang dibawa kepada anak-anak mereka, dan mempersembahkannya kepada berhala, serta suara tiup dan penjaga di balik tembok {cite:muruj-al-dhahab, hlm. 545-546}."
