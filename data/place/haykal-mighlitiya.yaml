label: { ar: "هيكل مغليتيا بحران", en: "The Mighlitiya temple at Harran" }
summary:
  ar: "البيت المعظم الباقي للصابئة الحرانيين بمدينة حران في باب الرقة سنة اثنتين وثلاثين وثلاثمائة، وهو هيكل آزر أبي إبراهيم عندهم، وذكر ابن عيشون القاضي في قصيدته ما تحته من السراديب الأربعة المتخذة لأنواع صور الأصنام الممثلة للأجسام السماوية وإيرادهم لأطفالهم إليها وعرضهم على الأصنام وما يظهر منها من نطق بحيل المنافيخ والسدنة من وراء الجدر {cite:muruj-al-dhahab p. 545-546}."
  en: "The last great Harranian temple in 332 — Azar's shrine in Bab al-Raqqa with four crypt-vaults of celestial-shaped idols that 'spoke' through priests' pipes, where children were brought to turn pale at the voices, as Ibn Ayshun's qasida describes {cite:muruj-al-dhahab p. 545-546}."
