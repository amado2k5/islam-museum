summary:
  ar: "برزان موضع بسجستان؛ بعث رتبيل إلى عبيد الله بن أبي بكرة به يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فوهب له مائتي ألف فتم الصلح على ألف ألف درهم."
  en: "Barzan in Sijistan; there Rutbil's embassy sought Ubaydallah ibn Abi Bakra's peace for his land and Kabul's — concluded at a million dirhams."
  es: "Barzan, en Sijistan; allí la embajada de Rutbil solicitó la paz de Ubaydallah ibn Abi Bakra para su tierra y la de Kabul, y concluyó con un millón de dirhams."
  fr: "Barzan au Sijistan; là, l'ambassade de Rutbil a cherché à obtenir la paix d'Ubaydallah ibn Abi Bakra pour son pays et celui de Kaboul — accord conclu pour un million de dirhams."
  ur: "سجستان میں برزان؛ وہاں رتبیل کے سفارت خانے نے عبیداللہ ابن ابی بکرہ سے اس کی زمین اور کابل کے لیے امن طلب کیا - جس کا اختتام دس لاکھ درہم پر ہوا۔"
  tr: "Barzan, Sijistan'da bir yerdir; Ratbil, Ratbil'i Ubeyd Allah ibn Ebu Bekra'ya toprağı ve Kabil için bin iki yüz bin dirhem için barış istemek üzere gönderdi, ona iki yüz bin verdi ve barış bin bin dirhem karşılığında tamamlandı."
  id: "Barzan adalah sebuah tempat di Sijistan; Ratbil mengirim Ratbil kepada Ubayd Allah ibn Abi Bakrah untuk memohon perdamaian mengenai tanahnya dan Kabul untuk seribu dua ratus ribu, dan dia memberinya dua ratus ribu, dan perdamaian itu selesai dengan seribu ribu dirham."
