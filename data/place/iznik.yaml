  ar: "إزنيق مدينة قديمة قرب بحيرة في تركيا، عرفت بنيقية، وصُنع فيها خزف جميل ملوّن."
  en: "Iznik is an old town in Turkey, once called Nicaea, famous for the beautiful coloured pottery that was made there."
