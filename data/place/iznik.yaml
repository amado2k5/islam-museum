label: { ar: "إزنيق", en: "Iznik (Nicaea)", ur: "ازنیق" }
summary:
  ar: "مدينة في شمال غرب الأناضول، هي نيقية القديمة والبيزنطية، وتسميها المصادر العربية نيقية. حاصرها العرب بلا جدوى سنة 99هـ/717م و107هـ/725م، وسقطت في يد السلجوقي سليمان بن قتلمش في أوائل 1081م، واستسلمت في 5-6 رجب 490هـ/19-20 يونيو 1097م للبيزنطيين المتحالفين مع الصليبيين، ثم افتتحها أورخان بعد حصار طويل سنة 731هـ/1331م. ومعالمها الإسلامية المبكرة وخزفها الشهير مما تتناوله دائرة المعارف الإسلامية {cite:encyclopaedia-of-islam-2 vol. 4 p. 309} {cite:encyclopaedia-of-islam-2 vol. 4 p. 310}."
  en: "City in north-western Anatolia, the ancient and Byzantine Nicaea, called Nikiya in Arabic geographers. The Arabs besieged it in vain in 99/717 and 107/725, the Seljuk Sulayman ibn Qutlumush took it in early 1081, it surrendered to the Byzantines and their Crusader allies on 5-6 Rajab 490, 19-20 June 1097, and Orkhan took it after a long siege in 731/1331. The Encyclopaedia of Islam also treats its early Ottoman monuments and its famous pottery {cite:encyclopaedia-of-islam-2 vol. 4 p. 309} {cite:encyclopaedia-of-islam-2 vol. 4 p. 310}."
  ur: "شمال مغربی اناطولیہ کا شہر، قدیم اور بازنطینی نیقیہ، جسے عرب جغرافیہ نویس نیکیہ کہتے ہیں۔ عربوں نے 99ھ/717ء اور 107ھ/725ء میں اس کا بے نتیجہ محاصرہ کیا، سلجوقی سلیمان بن قتلمش نے 1081ء کے آغاز میں اسے لیا، یہ 5-6 رجب 490ھ، یعنی 19-20 جون 1097ء، کو بازنطینیوں اور ان کے صلیبی حلیفوں کے حوالے ہوا، اور اورخان نے طویل محاصرے کے بعد 731ھ/1331ء میں اسے فتح کیا۔ اسلامی دائرۃ المعارف اس کی ابتدائی عثمانی عمارتوں اور مشہور ظروف کا بھی ذکر کرتا ہے {cite:encyclopaedia-of-islam-2 vol. 4 p. 309} {cite:encyclopaedia-of-islam-2 vol. 4 p. 310}۔"
