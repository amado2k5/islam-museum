summary:
  ar: "مدينة قرب جبل الأوراس، تبعد عن قسنطينة ثلاث مراحل، وتتصل بجبل الأوراس، وأهله مسلطون على من جاورهم. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  en: "A city near the Aurès range, three stages from Constantine, linked to the Aurès range, whose people are strong against their neighbours. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  es: "Una ciudad cercana a la sierra de Aurès, a tres etapas de Constantina, vinculada a la sierra de Aurès, cuyos habitantes son fuertes frente a sus vecinos. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  fr: "Une ville proche de la chaîne des Aurès, à trois étapes de Constantine, reliée à cette chaîne, dont les habitants sont farouchement opposés à leurs voisins. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  ur: "Aurès رینج کے قریب ایک شہر، Constantine سے تین مراحل، Aurès رینج سے منسلک، جس کے لوگ اپنے پڑوسیوں کے خلاف مضبوط ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 277}"
  tr: "Mount Aurès yakınlarında, Konstantin'e üç adım mesafede, Mount Aurès'e bağlıdır ve burada sakinleri yakında yaşayanlardan daha fazladır. {cite:nuzhat-al-mushtaq-2002 s. 277}"
  id: "Sebuah kota dekat Gunung Aurès, tiga langkah dari Konstantinus, terhubung dengan Gunung Aurès, yang penduduknya mendominasi penduduk yang tinggal di sekitarnya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 277}"
