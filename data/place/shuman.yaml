summary:
  ar: "شومان موضع يذكره البلاذري في خبر حملة قتيبة وراء النهر، إذ كان صاحبه قد ضيّق على ملك الصغانيان وغزاه، فأعطى ملك الصغانيان الطاعة لقتيبة. ولا يذكر النص فتحه على يد المفضل بن المهلب. {cite:futuh-buldan-maarif-1407 p.590}"
  en: "Shuman is a place named by al-Baladhuri in the account of Qutayba's campaign beyond the river. Its ruler had pressed the king of al-Saghaniyan and attacked him, so the king submitted to Qutayba. The text does not record a conquest by al-Mufaddal ibn al-Muhallab. {cite:futuh-buldan-maarif-1407 p.590}"
  es: "Shuman es un lugar mencionado por al-Baladhuri en el relato de la campaña de Qutayba más allá del río. Su gobernante había presionado al rey de al-Saghaniyan y lo había atacado, por lo que el rey se sometió a Qutayba. El texto no registra ninguna conquista por parte de al-Mufaddal ibn al-Muhallab. {cite:futuh-buldan-maarif-1407 p.590}"
  fr: "Shuman est un lieu mentionné par al-Baladhuri dans le récit de la campagne de Qutayba au-delà du fleuve. Son souverain avait harcelé et attaqué le roi d'al-Saghaniyan, qui se soumit alors à Qutayba. Le texte ne fait état d'aucune conquête de la part d'al-Mufaddal ibn al-Muhallab. {cite:futuh-buldan-maarif-1407 p.590}"
  ur: "شمعان ایک جگہ ہے جسے البلادھوری نے قتیبہ کی دریا سے آگے کی مہم کے حوالے سے نام دیا ہے۔ اس کے حاکم نے الصغانیان کے بادشاہ پر دباؤ ڈالا اور اس پر حملہ کیا تو بادشاہ نے قتیبہ کے سامنے سر تسلیم خم کیا۔ متن میں المفضل ابن المحلب کی فتح درج نہیں ہے۔ {حوالہ: فتوح-بلدان-معارف-1407 صفحہ 590}"
  tr: "Shuman, al-Baladhuri tarafından Qutaybah'ın nehrin ötesindeki seferinin anlatımında bahsedilen bir yerdir; burada yoldaşı, iki sughanayin kralını kuşatıp işgal etmiş ve bu yüzden Qutaybah'a itaat etmiştir. Metin, el-Mufaddal ibn al-Muhallab tarafından fethetmesinden bahsedilmez. {cit:futuh-buldan-maarif-1407 s.590}"
  id: "Shuman adalah tempat yang disebutkan oleh al-Baladhuri dalam catatan kampanye Qutaybah di seberang sungai, di mana rekannya mengepung dan menyerang raja dua sughanayyin, sehingga ia memberikan ketaatan kepada Qutaybah. Teks tersebut tidak menyebutkan penaklukannya oleh al-Mufaddal ibn al-Muhallab. {cite:futuh-buldan-maarif-1407 hlm.590}"
