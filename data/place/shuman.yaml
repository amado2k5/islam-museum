  ar: "شومان موضع يذكره البلاذري في خبر حملة قتيبة وراء النهر، إذ كان صاحبه قد ضيّق على ملك الصغانيان وغزاه، فأعطى ملك الصغانيان الطاعة لقتيبة. ولا يذكر النص فتحه على يد المفضل بن المهلب. {cite:futuh-buldan-maarif-1407 p.590}"
  en: "Shuman is a place named by al-Baladhuri in the account of Qutayba's campaign beyond the river. Its ruler had pressed the king of al-Saghaniyan and attacked him, so the king submitted to Qutayba. The text does not record a conquest by al-Mufaddal ibn al-Muhallab. {cite:futuh-buldan-maarif-1407 p.590}"
