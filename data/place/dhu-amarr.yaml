  ar: "ماء كان يجتمع عنده جمع من بني ثعلبة ومحارب، فوصل إليه جيش المدينة في المحرم سنة 3هـ، فأقام هناك ثم رجع إلى المدينة من دون قتال."
  en: "A watering place where a company from Banu Tha'laba and Banu Muharib would gather. The Madina force reached it in Muharram of year 3 AH, stayed there, then returned to Madina without fighting."
  es: "Un abrevadero donde se reunía una compañía de Banu Tha'laba y Banu Muharib. Las fuerzas de Medina llegaron allí en Muharram del año 3 de la Hégira, permanecieron en el lugar y luego regresaron a Medina sin combatir."
  fr: "Un point d'eau où se rassemblaient les Banu Tha'laba et les Banu Muharib. Les troupes de Médine l'atteignirent en Muharram de l'an 3 de l'Hégire, y séjournèrent, puis retournèrent à Médine sans combattre."
  ur: "پانی دینے کی جگہ جہاں بنو ثعلبہ اور بنو محرب کی ایک جماعت جمع ہوتی تھی۔ مدینہ کی فوج 3 ہجری کے محرم میں اس تک پہنچی، وہیں ٹھہری، پھر بغیر لڑے مدینہ واپس آگئی۔"
