summary:
  ar: "مدينة قديمة بأذربيجان يزعم المجوس أن زردشت صاحبهم كان منها وكان صدقة بن علي بن صدقة بن دينار مولى الأزد حارب أهلها حتى دخلها وغلب عليها وبنى وإخوته بها قصوراً."
  en: "An ancient city of Azerbaijan which the Magians claim as their prophet Zarathustra's home; Sadaqa ibn Ali ibn Sadaqa ibn Dinar, the Azd's mawla, fought its people till he entered and mastered it, building palaces with his brothers."
  es: "Una antigua ciudad de Azerbaiyán que los magos reclaman como el hogar de su profeta Zoroastro; Sadaqa ibn Ali ibn Sadaqa ibn Dinar, el mawla de Azd, luchó contra su gente hasta que entró y la dominó, construyendo palacios con sus hermanos."
  fr: "Une ancienne ville d'Azerbaïdjan que les Mages revendiquent comme la patrie de leur prophète Zarathoustra; Sadaqa ibn Ali ibn Sadaqa ibn Dinar, le mawla d'Azd, a combattu ses habitants jusqu'à ce qu'il y entre et la maîtrise, construisant des palais avec ses frères."
  ur: "آذربائیجان کا ایک قدیم شہر جس کے بارے میں مجوسی اپنے نبی زرتھسٹرا کا گھر ہونے کا دعویٰ کرتے ہیں۔ صدقہ بن علی بن صدقہ ابن دینار، عزد کے مولا، نے اس کے لوگوں سے جنگ کی یہاں تک کہ وہ اس میں داخل ہو گیا اور اس پر قابو پا لیا، اپنے بھائیوں کے ساتھ محلات بناتا رہا۔"
