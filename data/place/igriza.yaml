summary:
  ar: "مدينة متوسطة متحضرة لها أسواق وتجارات وكروم وأغنام، تتاخم جبل منت جون على نهر دروة، ويذكر المؤلف أن بينها وبين ألمة خمسين ميلا شمالا {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  en: "A medium-sized, civilised city with markets, trade, vineyards and flocks, bordering Mount Mont Jūn on the river Darūa; the author gives fifty miles north to Alma {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  es: "Una ciudad civilizada de tamaño mediano con mercados, comercio, viñedos y rebaños, que limita con el monte Mont Jūn en el río Darūa; el autor sitúa cincuenta millas al norte de Alma {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  fr: "Une ville civilisée de taille moyenne avec des marchés, du commerce, des vignobles et des troupeaux, bordant le mont Mont Jūn sur la rivière Darūa; l'auteur donne cinquante milles au nord jusqu'à Alma {cite:nuzhat-al-mushtaq-2002 p. 874} {cite:nuzhat-al-mushtaq-2002 p. 875}."
  ur: "ایک درمیانے درجے کا، مہذب شہر جس میں منڈیاں، تجارت، انگور کے باغات اور ریوڑ ہیں، دریائے داروا کے پہاڑ مونٹ جون سے ملحق ہے۔ مصنف نے الما کو شمال میں پچاس میل کا فاصلہ دیا ہے۔ 874} {حوالہ: نزہت المشتاق-2002 ص۔ 875}۔"
