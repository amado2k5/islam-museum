summary:
  ar: "مدينة صغيرة على خور كبير تدخله المراكب، يوجد فيها الذهب كثيراً، وهو غلتهم وشغلهم، وأكلهم السلاحف البحرية ولحوم الصدف، وتبعد عن دغوطة يومين {cite:nuzhat-al-mushtaq-2002 p. 79}."
  en: "A small town on a large creek that ships enter. Gold is plentiful there and is the main work and income of its people, who eat sea turtles and shellfish. Two days from Daghuta {cite:nuzhat-al-mushtaq-2002 p. 79}."
  es: "Un pequeño pueblo a orillas de un gran arroyo por donde entran los barcos. Allí abunda el oro, que constituye la principal fuente de ingresos de sus habitantes, quienes se alimentan de tortugas marinas y mariscos. A dos días de Daghuta {cite:nuzhat-al-mushtaq-2002 p. 79}."
  fr: "Une petite ville située sur un large bras de mer où accostent les navires. L'or y abonde et constitue la principale activité et source de revenus de ses habitants, qui consomment des tortues marines et des coquillages. À deux jours de Daghuta {cite:nuzhat-al-mushtaq-2002 p. 79}."
  ur: "ایک بڑی کریک پر ایک چھوٹا سا شہر جس میں جہاز داخل ہوتے ہیں۔ وہاں سونا بہت زیادہ ہے اور یہ اس کے لوگوں کا بنیادی کام اور آمدنی ہے، جو سمندری کچھوے اور شیلفش کھاتے ہیں۔ داغوتہ سے دو دن {حوالہ: نزہت المشتاق-2002 ص۔ 79}۔"
