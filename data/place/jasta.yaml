  ar: "مدينة صغيرة على خور كبير تدخله المراكب، يوجد فيها الذهب كثيراً، وهو غلتهم وشغلهم، وأكلهم السلاحف البحرية ولحوم الصدف، وتبعد عن دغوطة يومين {cite:nuzhat-al-mushtaq-2002 p. 79}."
  en: "A small town on a large creek that ships enter. Gold is plentiful there and is the main work and income of its people, who eat sea turtles and shellfish. Two days from Daghuta {cite:nuzhat-al-mushtaq-2002 p. 79}."
