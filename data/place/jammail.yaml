label: { ar: "جمّاعيل", en: "Jamma'il", ur: "جماعیل" }
summary:
  ar: "قرية من أرض نابلس في الأرض المقدسة، يذكرها ابن رجب في «الذيل على طبقات الحنابلة» مولداً للحافظ عبد الغني المقدسي (541هـ) والشيخ أبي عمر بن قدامة (528هـ) وأخيه الموفق ابن قدامة (541هـ) والعماد إبراهيم بن عبد الواحد (543هـ) وغيرهم من أسرة المقادسة، وكان أبوهما أحمد بن محمد بن قدامة خطيبها، ثم هاجرت الأسرة منها إلى دمشق سنة إحدى وخمسين وخمسمائة لاستيلاء الفرنج على الأرض المقدسة، فنزلوا سفح قاسيون وعُرف موضعهم بالصالحية {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 5}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 61}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 93}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 124}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 133}."
  en: "A village in the land of Nablus in the Holy Land. Ibn Rajab's al-Dhayl ala Tabaqat al-Hanabila names it as the birthplace of the hafiz Abd al-Ghani al-Maqdisi (541 AH), of Shaykh Abu Umar ibn Qudama (528 AH) and his brother al-Muwaffaq Ibn Qudama (541 AH), of al-Imad Ibrahim ibn Abd al-Wahid (543 AH) and of others of the Maqdisi family; the brothers' father, Ahmad ibn Muhammad ibn Qudama, was its preacher. In 551 AH the family left it for Damascus because the Franks had taken the Holy Land, and settled on the slope of Mount Qasyun, where their quarter became known as al-Salihiyya."
  ur: "ارضِ مقدسہ میں نابلس کے علاقے کا ایک گاؤں۔ ابن رجب کی «الذیل علی طبقات الحنابلہ» کے مطابق یہ حافظ عبد الغنی مقدسی (541ھ)، شیخ ابو عمر ابن قدامہ (528ھ)، ان کے بھائی موفق ابن قدامہ (541ھ)، عماد ابراہیم بن عبد الواحد (543ھ) اور مقادسہ خاندان کے دیگر افراد کی جائے پیدائش ہے؛ دونوں بھائیوں کے والد احمد بن محمد بن قدامہ یہاں کے خطیب تھے۔ 551ھ میں فرنگیوں کے ارضِ مقدسہ پر قبضے کے سبب یہ خاندان دمشق ہجرت کر گیا اور جبلِ قاسیون کے دامن میں آباد ہوا، جہاں ان کی بستی صالحیہ کہلائی۔"
