summary:
  ar: "قرية من أرض نابلس في الأرض المقدسة، يذكرها ابن رجب في «الذيل على طبقات الحنابلة» مولداً للحافظ عبد الغني المقدسي ⁦(541هـ)⁩ والشيخ أبي عمر بن قدامة ⁦(528هـ)⁩ وأخيه الموفق ابن قدامة ⁦(541هـ)⁩ والعماد إبراهيم بن عبد الواحد ⁦(543هـ)⁩ وغيرهم من أسرة المقادسة، وكان أبوهما أحمد بن محمد بن قدامة خطيبها، ثم هاجرت الأسرة منها إلى دمشق سنة إحدى وخمسين وخمسمائة لاستيلاء الفرنج على الأرض المقدسة، فنزلوا سفح قاسيون وعُرف موضعهم بالصالحية {cite:dhayl-tabaqat-hanabila-faqi-v2 p. 5}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 52}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 61}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 93}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 124}{cite:dhayl-tabaqat-hanabila-faqi-v2 p. 133}."
  en: "A village in the land of Nablus in the Holy Land. Ibn Rajab's al-Dhayl ala Tabaqat al-Hanabila names it as the birthplace of the hafiz Abd al-Ghani al-Maqdisi (541 AH), of Shaykh Abu Umar ibn Qudama (528 AH) and his brother al-Muwaffaq Ibn Qudama (541 AH), of al-Imad Ibrahim ibn Abd al-Wahid (543 AH) and of others of the Maqdisi family; the brothers' father, Ahmad ibn Muhammad ibn Qudama, was its preacher. In 551 AH the family left it for Damascus because the Franks had taken the Holy Land, and settled on the slope of Mount Qasyun, where their quarter became known as al-Salihiyya."
  ur: "ارضِ مقدسہ میں نابلس کے علاقے کا ایک گاؤں۔ ابن رجب کی «الذیل علی طبقات الحنابلہ» کے مطابق یہ حافظ عبد الغنی مقدسی ⁦(541ھ)⁩، شیخ ابو عمر ابن قدامہ ⁦(528ھ)⁩، ان کے بھائی موفق ابن قدامہ ⁦(541ھ)⁩، عماد ابراہیم بن عبد الواحد ⁦(543ھ)⁩ اور مقادسہ خاندان کے دیگر افراد کی جائے پیدائش ہے؛ دونوں بھائیوں کے والد احمد بن محمد بن قدامہ یہاں کے خطیب تھے۔ 551ھ میں فرنگیوں کے ارضِ مقدسہ پر قبضے کے سبب یہ خاندان دمشق ہجرت کر گیا اور جبلِ قاسیون کے دامن میں آباد ہوا، جہاں ان کی بستی صالحیہ کہلائی۔"
  es: "Un pueblo en la región de Nablus, en Tierra Santa. La obra de Ibn Rajab, al-Dhayl ala Tabaqat al-Hanabila, lo menciona como el lugar de nacimiento del hafiz Abd al-Ghani al-Maqdisi (541 AH), del jeque Abu Umar ibn Qudama (528 AH) y su hermano al-Muwaffaq Ibn Qudama (541 AH), de al-Imad Ibrahim ibn Abd al-Wahid (543 AH) y de otros miembros de la familia Maqdisi; el padre de los hermanos, Ahmad ibn Muhammad ibn Qudama, fue su predicador. En 551 AH, la familia lo abandonó para trasladarse a Damasco, ya que los francos habían tomado Tierra Santa, y se establecieron en la ladera del monte Qasyun, donde su barrio pasó a ser conocido como al-Salihiyya."
  fr: "Un village du pays de Naplouse, en Terre sainte. Ibn Rajab, dans son ouvrage al-Dhayl ala Tabaqat al-Hanabila, le mentionne comme le lieu de naissance du hafiz Abd al-Ghani al-Maqdisi (541 AH), du cheikh Abu Umar ibn Qudama (528 AH) et de son frère al-Muwaffaq Ibn Qudama (541 AH), d'al-Imad Ibrahim ibn Abd al-Wahid (543 AH) et d'autres membres de la famille Maqdisi; le père des frères, Ahmad ibn Muhammad ibn Qudama, y était prédicateur. En 551 AH, la famille quitta le village pour Damas, suite à la conquête de la Terre sainte par les Francs, et s'installa sur les pentes du mont Qasyun, où leur quartier prit le nom d'al-Salihiyya."
  tr: "Kutsal Topraklar'da Nablus topraklarında yer alan bir köy, İbn Receb tarafından \"Al-Dhayl 'ala Tabaqat al-Hanabili\" adlı eserde hafız Abd al-Ghani al-Maqdisi (541 H), Şeyh Abu Umar ibn Qudamah (528 H), kardeşi al-Muwaffaq ibn Qudamah (541 H) ve İmam İbrahim ibn Abd al-Wahid (543 H) gibi Maqadisa ailesinden doğumları olarak anılmıştır. Babaları Ahmed ibn Muhammed ibn Qudamah nişanlılarıydı. Aile, Franklar Kutsal Toprakları ele geçirdiğinde 551 Hicri yılında oradan Şam'a göç etti, bu yüzden Kasioun'un eteğine yerleşti ve yerleri al-Salihiyah olarak bilindi. Dhayl-tabaqat-hanabila-faqi-v2 s. 5}{cite:dhayl-tabaqat-hanabila-faqi-v2 s. 52}{cite:dhayl-tabaqat-hanabila-faqi-v2 s. 61}{cite:dhayl-tabaqat-hanabila-faqi-v2 s. 93}{cite:dhayl-tabaqat-hanabila-faqi-v2 s. 124}{cite:dhayl-tabaqat-hanabila-faqi-v2 s. 133}."
  id: "Sebuah desa di tanah Nablus di Tanah Suci, yang disebutkan oleh Ibn Rajab dalam \"Al-Dhayl 'ala Tabaqat al-Hanabili\" sebagai kelahiran hafiz Abd al-Ghani al-Maqdisi (541 H), Sheikh Abu Umar ibn Qudamah (528 H), saudaranya al-Muwaffaq ibn Qudamah (541 H), dan Imad Ibrahim ibn Abd al-Wahid (543 H), di antara lainnya dari keluarga Maqadisa. Ayah mereka, Ahmad ibn Muhammad ibn Qudamah, adalah tunangan mereka. Keluarga tersebut kemudian bermigrasi dari sana ke Damaskus pada tahun 551 H ketika bangsa Frank mengambil alih Tanah Suci, sehingga mereka menetap di kaki Qasioun, dan tempat mereka dikenal sebagai al-Salihiyah. Dhayl-Tabaqat-Hanabila-Faqi-V2 hlm. 5}{cite:Dhayl-tabaqat-hanabila-faqi-v2 hlm. 52}{cite:Dhayl-tabaqat-hanabila-faqi-v2 hlm. 61}{cite:Dhayl-tabaqat-hanabila-faqi-v2 hlm. 93}{cite:Dhayl-tabaqat-hanabila-faqi-v2 hlm. 124}{cite:Dhayl-tabaqat-hanabila-faqi-v2 hlm. 133}."
