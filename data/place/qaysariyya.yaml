label: { ar: "قيسارية", en: "Caesarea", es: "Cesarea", fr: "Césarée", ur: "سیزریا" }
summary:
  ar: "قيسارية الساحلية من أعمال فلسطين؛ أول من حاصرها عمرو بن العاص سنة 13 وأنفذ فتحها معاوية بن أبي سفيان شوال سنة 19 — وقيل أول سنة 20 — بعد حصار نحو سبع سنين ودلالة يوسف اليهودي على السرب؛ روى الواقدي أنه وجد بها من المرتدة سبعمائة ألف ومن السامرة ثلاثين ألفاً ومن اليهود مائتي ألف وبها ثلاثمائة سوق وكان يحرس سورها كل ليلة مائة ألف؛ وأخرج الروم أيام ابن الزبير على قيسارية فشعثوها وهدموا مسجدها فلما استقام لعبد الملك بن مروان الأمر رمّها وأعاد مسجدها وأشحنها بالرجال وبنى صور وعكا الخارجة وكانتا على مثل سبيلها. وقال المقدسي نحو 375هـ: ليس على بحر الروم بلد أجلّ ولا أكثر خيرات منها، عليها حصن منيع وربض عامر أدير عليه الحصن وشربهم من الآبار والصهاريج {cite:ahsan-al-taqasim p. 142}."
  en: "Coastal Caesarea of the Filastin district; first besieged by Amr ibn al-As in year 13 and finally taken by Mu'awiya ibn Abi Sufyan in Shawwal year 19 — some say the opening of year 20 — after a siege of near seven years and the guidance of Yusuf the Jew to the water-conduit; al-Waqidi reports it held seven hundred thousand apostates, thirty thousand Samaritans and two hundred thousand Jews, three hundred markets and a hundred thousand guarding its wall each night; in Ibn al-Zubayr's days the Byzantines came upon it and ruined it, demolishing its mosque, and when Abd al-Malik's rule was secure he repaired it, restored its mosque, garrisoned it and rebuilt Tyre and Acre the Outer on its model."
  es: "Cesarea costera del distrito de Filastin; asediada por primera vez por Amr ibn al-As en el año 13 y finalmente tomada por Mu'awiya ibn Abi Sufyan en Shawwal del año 19 —algunos dicen que al comienzo del año 20— después de un asedio de casi siete años y la guía de Yusuf el Judío hasta el acueducto; al-Waqidi informa que albergaba setecientos mil apóstatas, treinta mil samaritanos y doscientos mil judíos, trescientos mercados y cien mil que custodiaban su muralla cada noche; en tiempos de Ibn al-Zubayr, los bizantinos la conquistaron y la arruinaron, demoliendo su mezquita, y cuando el gobierno de Abd al-Malik se consolidó, la reparó, restauró su mezquita, la guarneció y reconstruyó Tiro y Acre la Exterior siguiendo su modelo."
  fr: "Césarée côtière du district de Filastin; assiégée une première fois par Amr ibn al-As en l'an 13 et finalement prise par Mu'awiya ibn Abi Sufyan en Shawwal l'an 19 — certains disent au début de l'an 20 — après un siège de près de sept ans et grâce à la guidance de Yusuf le Juif vers le canal d'adduction d'eau; al-Waqidi rapporte qu'elle abritait sept cent mille apostats, trente mille Samaritains et deux cent mille Juifs, trois cents marchés et cent mille gardes nocturnes à ses remparts; à l'époque d'Ibn al-Zubayr, les Byzantins s'en emparèrent et la ravagèrent, détruisant sa mosquée, et lorsque le pouvoir d'Abd al-Malik fut consolidé, il la fit réparer, restaura sa mosquée, y installa une garnison et reconstruisit Tyr et Acre l'Extérieure sur son modèle."
  ur: "فلاسٹن ضلع کا ساحلی سیزریا؛ سب سے پہلے 13 میں عمرو بن العاص نے محاصرہ کیا اور آخر میں شوال 19 میں معاویہ ابن ابی سفیان نے لے لیا - کچھ کہتے ہیں کہ سال 20 کا آغاز - تقریبا سات سال کے محاصرے کے بعد اور یوسف یہودی کی راہنمائی کے بعد پانی کے نالے تک۔ الواقدی نے رپورٹ کیا ہے کہ اس نے سات لاکھ مرتد، تیس ہزار سامری اور دو لاکھ یہودی، تین سو بازار اور ایک لاکھ ہر رات اس کی دیوار کی حفاظت کی تھی۔ ابن الزبیر کے زمانے میں بازنطینیوں نے اس پر آکر اسے برباد کر دیا، اس کی مسجد کو مسمار کر دیا، اور جب عبد الملک کی حکومت محفوظ رہی تو اس نے اس کی مرمت کی، اس کی مسجد کو بحال کیا، اس کی چوکیداری کی اور اس کے ماڈل پر ٹائر اور ایکر دی آؤٹر کو دوبارہ تعمیر کیا۔"
