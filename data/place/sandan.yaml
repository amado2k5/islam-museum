summary:
  ar: "مدينة متحضرة كبيرة يقصدها التجار المياسير، واسعة القطر كثيرة الزرع والنخل والنارجيل، وفي شرقها جزيرة تسمى بها. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  en: "A large, civilised city of wealthy travelling merchants with broad land, many fields, palms and coconuts; an island of the same name lies to its east. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  es: "Una gran ciudad civilizada de ricos mercaderes ambulantes, con extensas tierras, numerosos campos, palmeras y cocoteros; una isla del mismo nombre se encuentra al este. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  fr: "Une grande ville civilisée, habitée par de riches marchands itinérants, avec de vastes terres, de nombreux champs, des palmiers et des cocotiers; une île du même nom se trouve à l’est. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  ur: "وسیع زمین، بہت سے کھیت، کھجوریں اور ناریل کے ساتھ دولت مند سفر کرنے والے تاجروں کا ایک بڑا، مہذب شہر؛ اسی نام کا ایک جزیرہ اس کے مشرق میں واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 182}"
  tr: "Al-Mayaseer'de tüccarların sıkça ziyaret ettiği büyük ve medeni bir şehir; burada ürünler, palmiye ve hindistancevizi ağaçları açısından zengin geniş bir alan vardır ve doğusunda bir ada bulunur. {cite:nuzhat-al-mushtaq-2002 s. 182}"
  id: "Sebuah kota besar yang beradab yang sering dikunjungi para pedagang di Al-Mayaseer, sebuah wilayah luas yang kaya akan tanaman, pohon palem, dan pohon kelapa, dengan sebuah pulau di sebelah timurnya yang bernama di sana. {cite:nuzhat-al-mushtaq-2002 hlm. 182}"
