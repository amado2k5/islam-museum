summary:
  ar: "مدينة واسعة العمارات كثيرة القرى، على ضفة نهر جنجس، ويصفها الإدريسي بوفرة الأموال فيها، وتبعد عن نهروارة سبع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  en: "A city of broad buildings and many villages on the bank of the Ganges, rich in wealth; seven stages from Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  es: "Una ciudad de amplios edificios y numerosos pueblos a orillas del Ganges, rica en recursos; a siete etapas de Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  fr: "Une ville aux vastes édifices et aux nombreux villages, située sur les rives du Gange et riche de ses richesses; à sept étapes de Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  ur: "وسیع عمارتوں کا شہر اور گنگا کے کنارے بہت سے گاؤں، دولت سے مالا مال؛ نہرواڑہ سے سات مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 194}"
  tr: "Jengis Nehri kıyısında, çok sayıda bina, birçok köy olan geniş bir şehir; Al-Idrisi tarafından zengin olarak tanımlanır ve Wara Nehri'ne yedi adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 194}"
  id: "Sebuah kota luas dengan banyak bangunan, banyak desa, di tepi Sungai Jengis, yang digambarkan oleh Al-Idrisi sebagai kota yang kaya akan kekayaan, dan berjarak tujuh langkah dari Sungai Wara. {cite:Nuzhat-al-Mushtaq-2002 hlm. 194}"
