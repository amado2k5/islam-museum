summary:
  ar: "سرق مدينة من كور الأهواز؛ فتحها أبو موسى على مثل صلح رامهرمز ثم غدروا فلم يفتحها حارثة بن بدر وفتحها عبد الله بن عامر عنوة وولاها حارثة بعد ذلك."
  en: "Surraq of al-Ahwaz; taken on Ramhurmuz's terms, betrayed, Haritha ibn Badr's army repulsed, and Abdallah ibn Amir took it by force — Haritha its governor after."
  es: "Surraq de al-Ahwaz; tomada en los términos de Ramhurmuz, traicionada, el ejército de Haritha ibn Badr rechazado, y Abdallah ibn Amir la tomó por la fuerza; Haritha fue su gobernador posteriormente."
  fr: "Surraq d'al-Ahwaz; prise aux conditions de Ramhurmuz, trahie, l'armée de Haritha ibn Badr repoussée, et Abdallah ibn Amir la prit par la force — Haritha en fut ensuite le gouverneur."
  ur: "سورۃ الاحواز؛ رامہرمز کی شرائط پر قبضہ کیا، غداری کی، حارثہ بن بدر کی فوج نے پسپا کر دیا، اور عبداللہ بن عامر نے اسے زبردستی لے لیا - حارثہ کے بعد اس کا گورنر۔"
