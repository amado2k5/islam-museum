summary:
  ar: "سمرقند مدينة السغد الكبرى؛ حصرها سعيد بن عثمان وحلف أن لا يبرح أو يفتحها ويرمي قهندزها فقاتل أهلها ثلاثة أيام ففقئت عينه وعين المهلب ثم خاف أهلها على قصر فيه أبناء ملوكهم وعظمائهم حصرهم فيه فصالحه على سبعمائة ألف درهم ورهن من أبناء ملوكهم خمسة عشر وقيل أربعين وقيل ثمانين ورمى القهندز فثبت الحجر في كوته."
  en: "Samarqand, the great city of Sughd; Sa'id ibn Uthman besieged it under oath not to stir till it opened, lost an eye in three days' fighting — and al-Muhallab his — then truced at seven hundred thousand and royal hostages after besieging the kings'-sons castle, his stone lodging in the qahandaz's loophole."
