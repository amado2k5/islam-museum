label: { ar: "سمرقند", en: "Samarqand" }
summary:
  ar: "سمرقند مدينة قديمة في ما وراء النهر على الضفة الجنوبية لنهر زرافشان، كانت في صدر الإسلام أولى مدن الإقليم سعةً وسكاناً، وازدهرت بموقعها على طريق الحرير وخصب الصغد وبصناعة الورق وعلمائها. حكمها السامانيون والقراخانيون ثم أصابها خراب المغول سنة 617هـ/1220م، وجعلها تيمور عاصمة له فبُنيت فيها شاه زنده وبيبي خانم وگور أمير ومدرسة ألوغ بيك ومرصده. وحصرها سعيد بن عثمان فصالحه أهلها على سبعمائة ألف درهم {cite:ahsan-al-taqasim pp. 246-248}."
  en: "Samarqand is an ancient city of Transoxania on the southern bank of the Zarafshan, the first city of the region in size and population in early Islamic times, flourishing through its place on the Silk Road, the fertility of Sughd, its paper and its scholars. Ruled by the Samanids and Karakhanids and devastated by the Mongols in 617/1220, it became Timur's capital and received the Shah-i Zinda, Bibi Khanum, the Gur-i Mir and Ulugh Beg's madrasa and observatory. Sa'id ibn Uthman besieged it and its people made peace for seven hundred thousand dirhams {cite:ahsan-al-taqasim pp. 246-248}."
  ur: "سمرقند ماوراء النہر کا قدیم شہر ہے جو دریائے زرافشاں کے جنوبی کنارے پر ہے، ابتدائی اسلامی دور میں رقبے اور آبادی کے لحاظ سے خطے کا پہلا شہر تھا، اور شاہراہِ ریشم پر اپنے مقام، صغد کی زرخیزی، کاغذ سازی اور علماء کی وجہ سے پھلا پھولا۔ اس پر سامانیوں اور قراخانیوں نے حکومت کی، سنہ 617ھ/1220ء میں منگولوں نے اسے تباہ کیا، پھر تیمور نے اسے دارالحکومت بنایا اور یہاں شاہِ زندہ، بی بی خانم، گورِ امیر اور الغ بیگ کا مدرسہ اور رصد گاہ بنے۔ سعید بن عثمان نے اس کا محاصرہ کیا اور اہلِ شہر نے سات لاکھ درہم پر صلح کی۔"
