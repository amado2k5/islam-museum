education:
  did_you_know:
    ar: "حاصر سعيد بن عثمان سمرقند وحلف ألا يبرح حتى يفتحها؛ فصالحه أهلها على سبعمائة ألف درهم ورهنوا من أبناء ملوكهم خمسة عشر رهينة، وقيل أربعين."
    en: "Sa'id ibn Uthman besieged Samarqand vowing not to leave until he took it; its people ransomed peace for seven hundred thousand dirhams and fifteen royal hostages, some accounts say forty."
    ur: "سعید بن عثمان نے سمرقند کا محاصرہ کیا اور فتح کے بغیر نہ لوٹنے کی قسم کھائی؛ اہلِ شہر نے سات لاکھ درہم اور پندرہ شاہی یرغمال پر صلح کی، بعض روایات میں چالیس ہیں۔"
