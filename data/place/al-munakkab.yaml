  es: "Un pueblo agradable, de tamaño mediano, rico en pesquerías de atún, con un edificio de planta cuadrada y una gran dársena cuyas aguas llegan desde aproximadamente una milla de distancia; a cuarenta millas de Granada. {cite:nuzhat-al-mushtaq-2002 p. 564}"
  fr: "Une jolie petite ville de taille moyenne, riche en pêcheries de thon, avec une structure carrée et un grand bassin alimenté par l'eau à environ un mille de distance; à quarante milles de Grenade. {cite:nuzhat-al-mushtaq-2002 p. 564}"
