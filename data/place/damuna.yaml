  ur: "ڈیمونا، لاہون کے ساتھ فیوم کے دو گاؤں میں سے ایک؛ پانی بڑی نہر کے بہاؤ سے اس تک پہنچتا ہے، اور اس کی بیلوں کو پانی کے پہیوں سے سیراب کیا جاتا ہے۔"
