summary:
  ar: "مدينة وحصن على تل، بها منبر ولها عمارات ومزارع وماء جار، وتبعد عن دير الجص مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 452}"
  en: "A town and fortress on a hill, with a pulpit, buildings, fields and running water, one stage from Dayr al-Jiss. {cite:nuzhat-al-mushtaq-2002 p. 452}"
  es: "Un pueblo y fortaleza en una colina, con un púlpito, edificios, campos y agua corriente, a una etapa de Dayr al-Jiss. {cite:nuzhat-al-mushtaq-2002 p. 452}"
  fr: "Une ville et une forteresse sur une colline, avec une chaire, des bâtiments, des champs et de l'eau courante, à une étape de Dayr al-Jiss. {cite:nuzhat-al-mushtaq-2002 p. 452}"
  ur: "ایک پہاڑی پر ایک قصبہ اور قلعہ، جس میں ایک منبر، عمارتیں، کھیت اور بہتے ہوئے پانی کے ساتھ، دیرالجِس سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 452}"
  tr: "Bir tepe üzerinde bir şehir ve kale, vaaz kürsüsü, binalar, çiftlikler ve akan suyu var; Deir Al-Jass'a bir aşama uzaklıkta. {cite:nuzhat-al-mushtaq-2002 s. 452}"
  id: "Sebuah kota dan benteng di atas bukit, dengan mimbar, bangunan, pertanian, dan air mengalir, dan hanya satu tahap dari Deir Al-Jass. {cite:nuzhat-al-mushtaq-2002 hlm. 452}"
