  ur: "بدخشاں"
  tr: "Cömertçe"
  id: "Dengan murah hati"
summary:
  ar: بلاد جبلية تكثر فيها الدواب والنتاج، وترفع منها الحجارة ذوات الجواهر النفيسة، وينقل منها المسك، ويتصل جنوبها بالهند من طريق بلاد الختل. {cite:nuzhat-al-mushtaq-2002 p. 487}
  en: A mountain land with many animals and herds, from which precious stones are taken; musk is carried out of it, and it links southward to India through the Khuttal lands. {cite:nuzhat-al-mushtaq-2002 p. 487}
  es: "Una región montañosa con abundantes animales y rebaños, de donde se extraen piedras preciosas; también se extrae almizcle, y se conecta hacia el sur con la India a través de las tierras de Khuttal. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  fr: "Une région montagneuse riche en animaux et en troupeaux, d'où l'on extrait des pierres précieuses; on y exporte également du musc, et elle est reliée au sud, vers l'Inde, par les terres de Khuttal. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  ur: "ایک پہاڑی زمین جس میں بہت سے جانور اور ریوڑ ہیں، جہاں سے قیمتی پتھر لیے جاتے ہیں۔ اس سے مشک نکالی جاتی ہے، اور یہ کھٹل کی زمینوں کے ذریعے جنوب کی طرف ہندوستان سے جڑتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 487}"
  tr: "Burası hayvancılık ve ürün açısından zengin dağlık bir arazidir; değerli taşlar çıkarılır, misk taşınır ve güneyi Khatl toprakları üzerinden Hindistan'a bağlıdır. {cite:nuzhat-al-mushtaq-2002 s. 487}"
  id: "Ini adalah tanah pegunungan yang kaya akan ternak dan hasil panen, dari mana batu permata berharga ditanam, musk diangkut, dan wilayah selatannya terhubung ke India melalui tanah Khatl. {cite:nuzhat-al-mushtaq-2002 hlm. 487}"
