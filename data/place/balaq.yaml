summary:
  ar: "مدينة من مدن النوبة بين ذراعين من النيل، يجتمع فيها تجار النوبة والحبشة وتجار أرض مصر عند الصلح والهدنة. ومن بلاق إلى جبل الجنادل سبعة أيام في البر. {cite:nuzhat-al-mushtaq-2002 p. 38-39}"
  en: "A town in Nubia between two arms of the Nile, where merchants from Nubia, Abyssinia and Egypt meet during truces. Seven days' journey by land to the cataract of Janadil. {cite:nuzhat-al-mushtaq-2002 p. 38-39}"
  es: "Una ciudad de Nubia situada entre dos brazos del Nilo, donde comerciantes de Nubia, Abisinia y Egipto se reunían durante las treguas. Siete días de viaje por tierra hasta la catarata de Janadil. {cite:nuzhat-al-mushtaq-2002 p. 38-39}"
  fr: "Ville de Nubie située entre deux bras du Nil, où se rencontraient, lors des trêves, des marchands nubiens, abyssins et égyptiens. Sept jours de marche par voie terrestre jusqu'à la cataracte de Janadil. {cite:nuzhat-al-mushtaq-2002 p. 38-39}"
  ur: "نوبیا کا ایک قصبہ دریائے نیل کے دو بازوؤں کے درمیان، جہاں نوبیا، حبشہ اور مصر کے تاجر جنگ بندی کے دوران ملتے ہیں۔ جنادل کے موتیا بند تک زمینی راستے سے سات دن کا سفر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 38-39}"
  tr: "Nil'in iki kolu arasında yer alan bir Nubia şehri; Nubia, Habeşistan ve Mısır topraklarından tüccarlar barış ve ateşkes içinde toplanmıştı. Balak'tan Cebel-Janadil'e, kara yoluyla yedi gün. {cite:nuzhat-al-mushtaq-2002 s. 38-39}"
  id: "Sebuah kota Nubia di antara dua cabang Sungai Nil, tempat para pedagang dari Nubia, Abyssinia, dan tanah Mesir berkumpul dalam perdamaian dan gencatan senjata. Dari Balaq ke Jabal al-Janadil, tujuh hari melalui darat. {cite:Nuzhat-al-Mushtaq-2002 hlm. 38-39}"
