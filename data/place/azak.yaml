summary:
  ar: "مدينة على بحر آزوف، كانت مركزاً لتجارة الشرق والغرب في القرن الرابع عشر، وفتحها العثمانيون سنة 1475م، ثم تداولها الروس والقوزاق والعثمانيون {cite:encyclopaedia-of-islam-2 vol. 1 p. 857}."
  en: "A city on the Sea of Azov, an emporium of East-West trade in the fourteenth century; taken by the Ottomans in 1475 and fought over by the Russians, Cossacks and Ottomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 857}."
  es: "Ciudad a orillas del mar de Azov, centro del comercio entre Oriente y Occidente en el siglo XIV; tomada por los otomanos en 1475 y disputada por rusos, cosacos y otomanos {cite:encyclopaedia-of-islam-2 vol. 1 p. 857}."
  fr: "Une ville sur la mer d'Azov, un centre de commerce entre l'Orient et l'Occident au XIVe siècle; prise par les Ottomans en 1475 et disputée par les Russes, les Cosaques et les Ottomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 857}."
  ur: "بحیرہ ازوف پر ایک شہر، چودھویں صدی میں مشرق و مغرب کی تجارت کا ایک ایمپوریم؛ 1475 میں عثمانیوں نے قبضہ کیا اور روسیوں، Cossacks اور عثمانیوں سے لڑا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد 1 ص۔ 857}۔"
