summary:
  ar: "مدينة فيها رئيس من قبل البغبوغ وحشم وعبيد، وهي تقاتل الترك الذين يحرسون أبواب الجبل الحاجز، وتبعد عن قاشا ثماني مراحل. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  en: "A city with an official appointed by the Baghbugh, retainers and servants, which fights the Turks guarding the passes of the barrier mountain; eight stages from Qasha. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  es: "Ciudad con un funcionario designado por el Baghbugh, vasallos y sirvientes, que combate a los turcos custodiando los pasos de la cordillera; a ocho etapas de Qasha. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  fr: "Une ville dotée d'un fonctionnaire nommé par le Baghbugh, de suivants et de serviteurs, qui combat les Turcs gardant les cols de la montagne barrière; à huit étapes de Qasha. {cite:nuzhat-al-mushtaq-2002 p. 213}"
  ur: "ایک شہر جس کا ایک اہلکار باغبغ کے ذریعہ مقرر کیا جاتا ہے، محافظ اور نوکر، جو رکاوٹ پہاڑ کے راستوں کی حفاظت کرنے والے ترکوں سے لڑتے ہیں۔ قاشہ سے آٹھ مراحل {حوالہ: نزہت المشتاق-2002 ص۔ 213}"
  tr: "Bigbog, Haşim ve Ubayd liderliğindeki bir liderin olduğu, Bariyer Dağı'nın kapılarını koruyan Türklerle savaşan ve Kaşa'ya sekiz adım uzaklıktaki bir şehir. {kaynak:Nuzhat-al-mushtaq-2002 s. 213}"
  id: "Sebuah kota dengan pemimpin yang dipimpin oleh Bigbog, Hashem, dan Ubayd, melawan Turki yang menjaga gerbang Gunung Penghalang, dan berjarak delapan langkah dari Qasha. {cite:Nuzhat-al-Mushtaq-2002 hlm. 213}"
