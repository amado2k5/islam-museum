label: { ar: "دمهرة", en: "Dimhara" }
summary:
  ar: "مملكة في جزر البحر الهندي، تحكمها ملكة يساعدها زوج يتولى الأمور، وتحكم بين الناس بنفسها، وتُحمل على كرسي وتلبس الحرير المنسوج وتضع على رأسها تاجاً من الذهب، ولا يمشي أحد بنعل من الذهب إلا الملكة وحدها، وتتصدق من أموال معلومة على فقراء بلادها بمشهد من الناس {cite:nuzhat-al-mushtaq-2002 p. 69}."
  en: "A kingdom on the islands of the Indian Ocean ruled by a queen with a husband who handles affairs. She judges disputes herself, dresses in woven silk, wears a gold crown, and is the only person allowed gold sandals. She gives alms from set funds to the poor of her land in public view {cite:nuzhat-al-mushtaq-2002 p. 69}."
