summary:
  ar: "مملكة في جزر البحر الهندي، تحكمها ملكة يساعدها زوج يتولى الأمور، وتحكم بين الناس بنفسها، وتُحمل على كرسي وتلبس الحرير المنسوج وتضع على رأسها تاجاً من الذهب، ولا يمشي أحد بنعل من الذهب إلا الملكة وحدها، وتتصدق من أموال معلومة على فقراء بلادها بمشهد من الناس {cite:nuzhat-al-mushtaq-2002 p. 69}."
  en: "A kingdom on the islands of the Indian Ocean ruled by a queen with a husband who handles affairs. She judges disputes herself, dresses in woven silk, wears a gold crown, and is the only person allowed gold sandals. She gives alms from set funds to the poor of her land in public view {cite:nuzhat-al-mushtaq-2002 p. 69}."
  es: "Un reino en las islas del Océano Índico gobernado por una reina cuyo esposo administra los asuntos. Ella misma juzga las disputas, viste seda tejida, lleva una corona de oro y es la única a quien se le permite usar sandalias de oro. Reparte limosnas de fondos establecidos a los pobres de su tierra en público {cite:nuzhat-al-mushtaq-2002 p. 69}."
  fr: "Un royaume insulaire de l'océan Indien, gouverné par une reine dont le mari gère les affaires du royaume. Elle tranche elle-même les litiges, porte des vêtements de soie tissée, une couronne d'or et est la seule autorisée à porter des sandales d'or. Elle distribue publiquement l'aumône aux pauvres de son royaume, prélevée sur des fonds alloués."
  ur: "بحر ہند کے جزیروں پر ایک بادشاہی جس پر ملکہ ایک شوہر کے ساتھ حکومت کرتی ہے جو معاملات کو سنبھالتی ہے۔ وہ خود تنازعات کا فیصلہ کرتی ہے، بنے ہوئے ریشم کے کپڑے پہنتی ہے، سونے کا تاج پہنتی ہے، اور وہ واحد شخص ہے جسے سونے کے سینڈل کی اجازت ہے۔ وہ عوام کی نظر میں اپنی زمین کے غریبوں کو مقررہ فنڈز سے خیرات دیتی ہے۔ 69}۔"
  tr: "Hint Okyanusu adalarında bir krallık, bir kraliçe tarafından yönetiliyor ve işleri yöneten bir koca tarafından destekleniyor. Halk arasında kendisi hükmediyor, sandalyede taşınıyor, dokuma ipek giyer ve başında altın bir taç takar. Altın sandaletle yürüyen kimse yoktur, sadece kraliçe vardır. Ülkesinin yoksullarına bilinen paradan yardım sağlar {cite:nuzhat-al-mushtaq-2002, s. 69}."
  id: "Sebuah kerajaan di pulau-pulau Samudra Hindia, diperintah oleh seorang ratu yang dibantu oleh suami yang mengatur urusan. Dia memerintah di antara rakyat sendiri, digendong di kursi, mengenakan sutra anyaman, dan mengenakan mahkota emas di kepalanya. Tidak ada yang berjalan dengan sandal emas kecuali ratu sendiri. Dia memberikan amal dari uang yang dikenal kepada orang miskin di negaranya dalam penampilan publik {cite:nuzhat-al-mushtaq-2002, hlm. 69}."
