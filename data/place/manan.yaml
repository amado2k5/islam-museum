summary:
  ar: "مدينة صغيرة من أرض كانم، لا صناعات فيها تُذكر، تجارتهم قليلة، وتبعد عن تملمة اثنتي عشرة مرحلة."
  en: "A small town in the land of Kanem with no notable crafts and little trade. Twelve stages from Tamalma."
  es: "Un pequeño pueblo en la tierra de Kanem, sin artesanía destacable y con escaso comercio. A doce etapas de Tamalma."
  fr: "Une petite ville du pays de Kanem, sans artisanat notable et avec un commerce rudimentaire. À douze étapes de Tamalma."
  ur: "کنیم کی سرزمین کا ایک چھوٹا سا شہر جس میں کوئی قابل ذکر دستکاری اور کم تجارت نہیں ہے۔ تملما سے بارہ مراحل۔"
  tr: "Kanem diyarında küçük bir kasaba olan bu kasaba, az sanayiye sahip, ticaretleri sınırlıdır ve Tamlema'ya on iki adım uzaklıktadır."
  id: "Sebuah kota kecil di tanah Kanem, dengan sedikit industri, perdagangan mereka terbatas, dan berjarak dua belas langkah dari Tamlema."
