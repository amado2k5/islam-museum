  ar: "هيت على الفرات الأسفل؛ فتحها جيش الكوفة الذي بعثه عمار بن ياسر عليه سعد بن عمرو بن حرام — وقيل مذلاج بن عمرو السلمي — فأمنهم أهلها واستثنى عليهم نصف كنيستهم، وهي أواخر ما التقى فيه فتح الجزيرة من جهة عمير بن سعد بفتح العراق من جهة الكوفة."
  en: "Hit on the lower Euphrates; taken by the Kufan army Ammar ibn Yasir dispatched under Sa'd ibn Amr ibn Haram — or by report Midlaj ibn Amr al-Sulami — its people taking aman with half their church reserved for the Muslims; it is where Umayr ibn Sa'd's Jazira conquest met the Iraq conquest out of Kufa."
