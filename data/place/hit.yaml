label: { ar: "هيت", en: "Hit", es: "Golpear", fr: "Frapper", ur: "مارا۔" }
summary:
  ar: "هيت على الفرات الأسفل؛ فتحها جيش الكوفة الذي بعثه عمار بن ياسر عليه سعد بن عمرو بن حرام — وقيل مذلاج بن عمرو السلمي — فأمنهم أهلها واستثنى عليهم نصف كنيستهم، وهي أواخر ما التقى فيه فتح الجزيرة من جهة عمير بن سعد بفتح العراق من جهة الكوفة."
  en: "Hit on the lower Euphrates; taken by the Kufan army Ammar ibn Yasir dispatched under Sa'd ibn Amr ibn Haram — or by report Midlaj ibn Amr al-Sulami — its people taking aman with half their church reserved for the Muslims; it is where Umayr ibn Sa'd's Jazira conquest met the Iraq conquest out of Kufa."
  es: "Atacada en el bajo Éufrates; tomada por el ejército de Kufa Ammar ibn Yasir enviado bajo el mando de Sa'd ibn Amr ibn Haram —o según se cuenta, Midlaj ibn Amr al-Sulami— su gente tomó aman con la mitad de su iglesia reservada para los musulmanes; es donde la conquista de Jazira de Umayr ibn Sa'd se encontró con la conquista de Irak desde Kufa."
  fr: "Frappée sur le cours inférieur de l'Euphrate; prise par l'armée de Kufa envoyée par Ammar ibn Yasir sous les ordres de Sa'd ibn Amr ibn Haram — ou selon un rapport de Midlaj ibn Amr al-Sulami — ses habitants se sont réfugiés, la moitié de leur église étant réservée aux musulmans; c'est là que la conquête de la Jazira par Umayr ibn Sa'd a rejoint la conquête de l'Irak depuis Kufa."
  ur: "نچلے فرات پر مارو۔ کوفان کی فوج نے عمار بن یاسر کو سعد بن عمرو بن حرام کے ماتحت روانہ کیا - یا مدلج ابن عمرو السلمی کی رپورٹ کے مطابق - اس کے لوگ امن لے رہے ہیں اور ان کے آدھے چرچ مسلمانوں کے لیے مختص ہیں۔ یہ وہ جگہ ہے جہاں عمیر بن سعد کی جزیرہ فتح کوفہ سے عراق کی فتح سے ملی تھی۔"
