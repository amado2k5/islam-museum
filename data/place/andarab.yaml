summary:
  ar: "مدينة على نهرين، أحدهما يسمى أندراب والآخر، وفيها حدائق ومتنزهات وأشجار كثيرة وكروم، وتبعد عن بذخشان سبع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 484}"
  en: "A town on two rivers, one called Andarab, with gardens, walks, many trees and vineyards; seven stages from Badakhshan. {cite:nuzhat-al-mushtaq-2002 p. 484}"
  es: "Un pueblo situado entre dos ríos, uno de ellos llamado Andarab, con jardines, paseos, numerosos árboles y viñedos; a siete etapas de Badakhshan. {cite:nuzhat-al-mushtaq-2002 p. 484}"
  fr: "Ville traversée par deux rivières, dont l'une s'appelle Andarab, avec jardins, promenades, arbres abondants et vignobles; à sept étapes de Badakhshan. {cite:nuzhat-al-mushtaq-2002 p. 484}"
  ur: "دو دریاؤں پر ایک شہر، ایک اندراب کہلاتا ہے، جس میں باغات، چہل قدمی، بہت سے درخت اور انگور کے باغ ہیں۔ بدخشاں سے سات مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 484}"
  tr: "İki nehir üzerinde bir şehirdir; biri Andarab, diğeri ise diğeridir; bahçeleri, parkları, birçok ağaç ve bağları vardır ve Badakhshan'a yedi adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 484}"
  id: "Ini adalah sebuah kota di dua sungai, satu bernama Andarab dan satu lagi, serta memiliki taman, taman, banyak pohon, dan kebun anggur, serta berjarak tujuh langkah dari Badakhshan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 484}"
