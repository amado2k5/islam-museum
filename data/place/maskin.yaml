  ar: "قرية في سواد العراق؛ عند البلاذري أغار النسير — من قبل خالد بن الوليد — على قرى بمسكن وقطربل فغنم منها غنيمة حسنة وذكرها الشاعر في سوق بغداذ مع الأنبار وقطربل وبادوريا."
  en: "Village of the Sawad; in al-Baladhuri raided by al-Nusayr on Khalid ibn al-Walid's behalf together with Qatarrabul for a fine booty; a poet lists it among al-Anbar, Qatarrabul and Baduraya around Baghdad's market."
  es: "Pueblo del Sawad; en al-Baladhuri, asaltada por al-Nusayr en nombre de Khalid ibn al-Walid junto con Qatarrabul en busca de un excelente botín; un poeta lo enumera entre al-Anbar, Qatarrabul y Baduraya alrededor del mercado de Bagdad."
  fr: "Village des Sawad; à al-Baladhuri attaqué par al-Nusayr au nom de Khalid ibn al-Walid avec Qatarrabul pour un beau butin; un poète le répertorie parmi al-Anbar, Qatarrabul et Baduraya autour du marché de Bagdad."
  ur: "سواد کا گاؤں؛ البلادوری میں النصیر نے خالد بن الولید کی طرف سے قطربل کے ساتھ مل کر مال غنیمت کے لیے چھاپہ مارا۔ ایک شاعر نے اسے بغداد کے بازار کے ارد گرد الانبار، قطرابول اور بدورایا کے درمیان درج کیا ہے۔"
