summary:
  ar: "بحيرة طولها ستة عشر ميلاً، يذكر الإدريسي أن فيها في كل شهر نوعاً من السمك لا يوجد في غيره، وأنواع السمك فيها اثنا عشر نوعاً. {cite:nuzhat-al-mushtaq-2002 p. 289}"
  en: "A lake sixteen miles long; al-Idrisi says each month brings a kind of fish found in no other month, twelve kinds in all. {cite:nuzhat-al-mushtaq-2002 p. 289}"
  es: "Un lago de dieciséis millas de largo; al-Idrisi dice que cada mes trae una especie de pez que no se encuentra en ningún otro mes, doce especies en total. {cite:nuzhat-al-mushtaq-2002 p. 289}"
  fr: "Un lac de seize milles de long; al-Idrisi dit que chaque mois apporte une espèce de poisson qu’on ne trouve qu’en un autre mois, douze espèces au total. {cite:nuzhat-al-mushtaq-2002 p. 289}"
  ur: "سولہ میل لمبی ایک جھیل؛ الادریسی کا کہنا ہے کہ ہر ماہ ایک قسم کی مچھلی لاتی ہے جو کسی اور مہینے میں نہیں پائی جاتی، مجموعی طور پر بارہ اقسام۔ {حوالہ: نزہت المشتاق-2002 ص۔ 289}"
