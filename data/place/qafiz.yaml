summary:
  ar: "قصر في وسط وطاء، وفي شرقيه بحيرة طولها نحو نصف ميل، ويبعد عن البحر أربعة أميال، وفيه قبائل رواحة. {cite:nuzhat-al-mushtaq-2002 p. 315}"
  en: "A palace in the middle of a plain with a lake about half a mile long to its east, four miles from the sea, where the Rawaha tribes live. {cite:nuzhat-al-mushtaq-2002 p. 315}"
  es: "Un palacio en medio de una llanura con un lago de aproximadamente media milla de largo al este, a cuatro millas del mar, donde viven las tribus Rawaha. {cite:nuzhat-al-mushtaq-2002 p. 315}"
  fr: "Un palais au milieu d'une plaine, avec un lac d'environ un demi-mille de long à l'est, à quatre milles de la mer, où vivent les tribus Rawaha. {cite:nuzhat-al-mushtaq-2002 p. 315}"
  ur: "ایک میدان کے بیچ میں ایک محل جس کے مشرق میں تقریباً آدھا میل لمبی ایک جھیل ہے، سمندر سے چار میل دور، جہاں راواہ قبائل رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 315}"
  tr: "Wata'nın ortasında bir saray, doğusunda yaklaşık yarım mil uzunluğunda bir göl var, denizden dört mil uzaklıkta ve Rawaha kabilelerine ev sahipliği yapıyor. {kaynak:nuzhat-al-mushtaq-2002 s. 315}"
  id: "Sebuah istana di tengah Wata, dengan danau sepanjang sekitar setengah mil di sebelah timurnya, empat mil dari laut, dan merupakan rumah bagi suku Rahaa. {cite:Nuzhat-al-Mushtaq-2002 hlm. 315}"
