label: { ar: "الأهرامان", en: "The Pyramids of Giza", es: "Las pirámides de Giza", fr: "Les pyramides de Gizeh", ur: "گیزا کے اہرام", tr: "Piramitler", id: "Piramida" }
summary:
  ar: "هرمان على نحو ستة أميال من مصر، مبنيان بحجارة كبيرة يذكر الإدريسي أنها من الرخام، وارتفاعهما نحو أربعمائة ذراع، وفي داخل كل هرم كتابات بعضها درست. {cite:nuzhat-al-mushtaq-2002 p. 326} وعند ابن خرداذبه: عليهما بالمسند «إلى بنيتهما فمن كان يدّعي قوة في ملكه فليهدِمهما فإن الهدم أيسر من البناء وإن خراج الدنيا لا يقوم بهدمهما»، وروى عن كاتب أحمد بن طولون أنهم فتحوا هرماً من الأهرام الصغار فنزلوا إلى صحن أربعين ذراعاً في أربعين فيه ثلاثمائة وستة وستون تمثالاً على صور الناس وأربع نيمخاجات وجدوا فيها جرار جزع مملوءة مومياء {cite:masalik-mamalik-ibn-khurdadhbih p. 159}. وفُتح أكبرها في زمان المأمون حين قدم مصر، وشاع أنه وجد ذهباً فوزنه فإذا هو مثل ما أنفق على الفتح — وراجع ابن فضل الله العمري التواريخ الصحيحة فلم يجد للمأمون شيئاً من ذلك، وأخبر أنه أصعد مراراً ماراً على أهرام الجيزة كلها ورأى بعضها مبنياً بالطوب، وأن الهدم قد شرع في عصره في قلعها ونقل أحجارها إلى الأبنية {cite:umari-masalik-1924 pp. 235-237}."
  en: "Two pyramids about six miles from Misr, built of large stones which al-Idrisi describes as marble, about four hundred cubits high, with inscriptions inside each, many now worn away. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  es: "Dos pirámides a unos seis kilómetros de Misr, construidas con grandes piedras que al-Idrisi describe como mármol, de unos cuatrocientos codos de altura, con inscripciones en el interior de cada una, muchas de ellas ahora desgastadas. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  fr: "Deux pyramides à environ six milles de Misr, construites en gros blocs de pierre qu'al-Idrisi décrit comme du marbre, d'une hauteur d'environ quatre cents coudées, avec des inscriptions à l'intérieur, dont beaucoup sont aujourd'hui effacées. {cite:nuzhat-al-mushtaq-2002 p. 326}"
  ur: "مصر سے تقریباً چھ میل کے فاصلے پر دو اہرام، بڑے پتھروں سے بنائے گئے جنہیں الادریسی نے سنگ مرمر سے تعبیر کیا، تقریباً چار سو ہاتھ اونچا، ہر ایک کے اندر نوشتہ کندہ تھا، جن میں سے کئی اب ختم ہو چکے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 326}"
  tr: "Mısır'dan yaklaşık altı mil uzaklıkta, el-İdrisi'nin mermer olarak bahsettiği büyük taşlardan yapılmış iki piramit, yaklaşık dört yüz arşin yüksekliğinde ve her piramidin içinde bazı incelenmiş yazıtlar bulunmaktadır. {alıntı:Nuzhat-al-Mushtaq-2002, s. 326} İbn Khordadbeh'e göre: Musned'de \"onları inşa etmekle yükümlüdürler. Krallığında iktidarı iddia eden kişi onları yıkmalıdır, çünkü yıkım inşa etmekten daha kolaydır ve dünyevi hazine onları yıkamaz.\" Yazıcı Ahmed ibn Tulun'dan anlatıldığı kadarıyla, küçük bir piramit açtılar ve kırk arşına kadar kırk arşın yüksekliğinde bir avluya indiler; burada üç yüz altmış altı insan figürü ve dört nemakhat heykeli vardı; burada mumyalarla dolu küpler buldular {cite:masalik-mamalik-ibn-khurdadhbih s. 159}. En büyüğü, el-Me'mun'un Mısır'a geldiği zamanlarda fethedilmişti ve söylentilere göre altın bulup tarttı, böylece fetih için harcadığı kadar olduğu ortaya çıktı. İbn Fadlallah el-Umari gerçek tarihleri inceledi ve el-Memun için hiçbir şey bulamadı. Giza'nın tüm piramitlerine defalarca tırmandığını ve bazılarının tuğladan inşa edildiğini gördüğünü, yıkımın ise kendi döneminde kökünden sökülüp taşlarını binalara taşıyarak başladığını anlattı {cite:Umari-masalik-1924, s. 235-237}."
  id: "Dua piramida sekitar enam mil dari Mesir, dibangun dengan batu besar yang disebut al-Idrisi sebagai marmer, dengan tinggi sekitar empat ratus hasta, dan di dalam setiap piramida terdapat prasasti, beberapa di antaranya telah dipelajari. {cite:Nuzhat-al-Mushtaq-2002, hlm. 326} Menurut Ibn Khordadbeh: mereka wajib dalam Musnad \"untuk membangunnya. Siapa pun yang mengklaim kekuasaan di kerajaannya harus membongkarnya, karena pembongkaran lebih mudah daripada membangun, dan harta duniawi tidak dapat merobohkannya.\" Diceritakan dari juru tulis Ahmad ibn Tulun bahwa mereka membuka sebuah piramida kecil dan turun ke halaman berukuran empat puluh hasta x empat puluh, berisi tiga ratus enam puluh enam patung yang menggambarkan sosok manusia dan empat nemakhat, di mana mereka menemukan guci berisi mumi {cite:Masalik-mamalik-ibn-khurdadhbih hlm. 159}. Yang terbesar ditaklukkan pada masa al-Ma'mun ketika ia tiba di Mesir, dan beredar kabar bahwa ia menemukan emas dan menimbangnya, sehingga ternyata jumlahnya sebanyak yang ia keluarkan untuk penaklukan. Ibn Fadlallah al-Umari meninjau tanggal otentik dan tidak menemukan apa pun untuk al-Ma'mun. Ia melaporkan bahwa ia berulang kali mendaki semua piramida Giza dan melihat beberapa di antaranya dibangun dari bata, dan pembongkaran dimulai pada zamannya dengan mencabutnya dan memindahkan batu-batunya ke bangunan {cite:umari-masalik-1924, hlm. 235-237}."
