label: { ar: "الأهرامان", en: "The Pyramids of Giza" }
summary:
  ar: "هرمان على نحو ستة أميال من مصر، مبنيان بحجارة كبيرة يذكر الإدريسي أنها من الرخام، وارتفاعهما نحو أربعمائة ذراع، وفي داخل كل هرم كتابات بعضها درست. {cite:nuzhat-al-mushtaq-2002 p. 326} وعند ابن خرداذبه: عليهما بالمسند «إلى بنيتهما فمن كان يدّعي قوة في ملكه فليهدِمهما فإن الهدم أيسر من البناء وإن خراج الدنيا لا يقوم بهدمهما»، وروى عن كاتب أحمد بن طولون أنهم فتحوا هرماً من الأهرام الصغار فنزلوا إلى صحن أربعين ذراعاً في أربعين فيه ثلاثمائة وستة وستون تمثالاً على صور الناس وأربع نيمخاجات وجدوا فيها جرار جزع مملوءة مومياء {cite:masalik-mamalik-ibn-khurdadhbih p. 159}. وفُتح أكبرها في زمان المأمون حين قدم مصر، وشاع أنه وجد ذهباً فوزنه فإذا هو مثل ما أنفق على الفتح — وراجع ابن فضل الله العمري التواريخ الصحيحة فلم يجد للمأمون شيئاً من ذلك، وأخبر أنه أصعد مراراً ماراً على أهرام الجيزة كلها ورأى بعضها مبنياً بالطوب، وأن الهدم قد شرع في عصره في قلعها ونقل أحجارها إلى الأبنية {cite:umari-masalik-1924 pp. 235-237}."
  en: "Two pyramids about six miles from Misr, built of large stones which al-Idrisi describes as marble, about four hundred cubits high, with inscriptions inside each, many now worn away. {cite:nuzhat-al-mushtaq-2002 p. 326}"
