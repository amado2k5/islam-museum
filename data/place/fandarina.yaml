summary:
  ar: "مدينة على الساحل، على خور يأتي من ناحية منيبار، تحط به مراكب الهند والسند، وفي شمالها جبل كبير يُنبت القاقلة. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  en: "A coastal town on a creek from the direction of Manibar, where Indian and Sind ships land; a great mountain to its north grows cardamom. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  es: "Un pueblo costero situado en una ensenada procedente de Manibar, donde atracan barcos de la India y Sind; al norte, una gran montaña produce cardamomo. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  fr: "Ville côtière située sur un bras de mer venant de Manibar, où accostent des navires indiens et sindhis; une grande montagne au nord d'elle produit de la cardamome. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  ur: "منیبار کی سمت سے ایک کریک پر ایک ساحلی شہر، جہاں ہندوستانی اور سندھ کے جہاز اترتے ہیں۔ اس کے شمال میں ایک عظیم پہاڑ الائچی اگتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 191}"
  tr: "Manibar bölgesinden gelen bir dere kenarında, Hindistan ve Sindh'ten teknelerin karaya çıktığı kıyıda bir şehir ve kuzeyinde Kaqila'nın yetiştiği büyük bir dağ vardır. {kaynak:nuzhat-al-mushtaq-2002 s. 191}"
  id: "Sebuah kota di pantai, di sebuah sungai kecil dari wilayah Manibar, tempat kapal dari India dan Sindh mendarat, dan di utaranya terdapat gunung besar tempat Qaqila tumbuh. {cite:Nuzhat-al-Mushtaq-2002 hlm. 191}"
