summary:
  ar: "حجران متعامدان مربعان على طولهما، أعلاهما أضيق من أسفلهما، وعليهما كتابات بخط قديم، ويذكر الإدريسي عن أهل الخبر أنهما نُحتا من حجر جبل وأُقيما بأمر ملك. {cite:nuzhat-al-mushtaq-2002 p. 321}"
  en: "Two square, tall stone obelisks, narrower at the top, bearing old inscriptions; al-Idrisi reports from informants that they were cut from a mountain and set up by a king. {cite:nuzhat-al-mushtaq-2002 p. 321}"
  es: "Dos obeliscos de piedra, altos y cuadrados, más estrechos en la parte superior, con antiguas inscripciones; al-Idrisi relata, citando a informantes, que fueron tallados en una montaña y erigidos por un rey. {cite:nuzhat-al-mushtaq-2002 p. 321}"
  fr: "Deux obélisques carrés en pierre, hauts et plus étroits à leur sommet, portant d'anciennes inscriptions; al-Idrisi rapporte, d'après des informateurs, qu'ils furent taillés dans une montagne et érigés par un roi. {cite:nuzhat-al-mushtaq-2002 p. 321}"
