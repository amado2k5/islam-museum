summary:
  ar: "مدينة متوسطة المقدار بها عمارة وافرة، على جبل، ويذكر المؤلف أنها تبعد عن سقماقية ست مراحل {cite:nuzhat-al-mushtaq-2002 p. 930}."
  en: "A medium-sized city with ample buildings on a mountain; the author gives six stages from Suqmāqiya {cite:nuzhat-al-mushtaq-2002 p. 930}."
