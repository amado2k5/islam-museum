  fr: "Une ville de taille moyenne avec de nombreux bâtiments sur une montagne; l'auteur donne six étapes à partir de Suqmāqiya {cite:nuzhat-al-mushtaq-2002 p. 930}."
  ur: "ایک درمیانے درجے کا شہر جس میں پہاڑ پر کافی عمارتیں ہیں۔ مصنف نے سقماقیہ سے چھ مراحل بیان کیے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 930}۔"
  tr: "Orta büyüklükte, zengin mimariye sahip, bir dağın üzerinde yer alan bir şehirdir ve yazar, Saqmaqiya'dan altı aşama uzaklıkta olduğunu belirtmektedir {cite:Nuzhat-al-Mushtaq-2002, s. 930}."
  id: "Sebuah kota berukuran sedang dengan arsitektur yang melimpah, terletak di atas gunung, dan penulis menyebutkan bahwa kota ini berjarak enam tahap dari Saqmaqiya {cite:Nuzhat-al-Mushtaq-2002, hlm. 930}."
