summary:
  ar: "مدينة صغيرة في بلاد زغاوة، شبيهة بالقرية الكبيرة، وأكثر أهلها انتقلوا إلى كوكو وبينهما ست عشرة مرحلة، ويشربون الألبان، ويذكر المؤلف أن المرض الجلدي منتشر فيها {cite:nuzhat-al-mushtaq-2002 p. 110}."
  en: "A small town in Zaghawa country, like a large village. Most of its people moved to Kawkaw, sixteen stages away. They drink milk, and the author reports that a skin disease is common among them {cite:nuzhat-al-mushtaq-2002 p. 110}."
  es: "Un pequeño pueblo en el país de Zaghawa, parecido a una aldea grande. La mayoría de sus habitantes se mudaron a Kawkaw, a dieciséis etapas de distancia. Beben leche, y el autor informa que una enfermedad de la piel es común entre ellos {cite:nuzhat-al-mushtaq-2002 p. 110}."
  fr: "Une petite ville du pays de Zaghawa, semblable à un grand village. La plupart de ses habitants ont déménagé à Kawkaw, à seize étapes de là. Ils consomment du lait, et l'auteur rapporte qu'une maladie de peau est fréquente parmi eux {cite:nuzhat-al-mushtaq-2002 p. 110}."
  ur: "زغاوا ملک کا ایک چھوٹا سا قصبہ، جیسے ایک بڑے گاؤں۔ اس کے زیادہ تر لوگ سولہ مراحل کے فاصلے پر کوکاو میں چلے گئے۔ وہ دودھ پیتے ہیں، اور مصنف نے رپورٹ کیا ہے کہ ان میں جلد کی بیماری عام ہے۔ 110}۔"
