summary:
  ar: "مدينة صغيرة في بلاد زغاوة، شبيهة بالقرية الكبيرة، وأكثر أهلها انتقلوا إلى كوكو وبينهما ست عشرة مرحلة، ويشربون الألبان، ويذكر المؤلف أن المرض الجلدي منتشر فيها {cite:nuzhat-al-mushtaq-2002 p. 110}."
  en: "A small town in Zaghawa country, like a large village. Most of its people moved to Kawkaw, sixteen stages away. They drink milk, and the author reports that a skin disease is common among them {cite:nuzhat-al-mushtaq-2002 p. 110}."
