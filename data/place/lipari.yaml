summary:
  ar: "منزل حسن على ساحل البحر، وبه سوق وحمام وسكان ومزارع وأرجاء، وله مرسى حسن يصاد به التن ⁦(التونة)⁩. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  en: "A fine stop on the sea shore, with a market, bath, residents and fields, and a good harbour where tuna is fished. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  es: "Un lugar ideal para hacer una parada en la costa, con mercado, balneario, residentes, campos y un buen puerto donde se pesca atún. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  fr: "Une halte agréable en bord de mer, avec un marché, des bains, des habitations et des champs, et un bon port où l'on pêche le thon. {cite:nuzhat-al-mushtaq-2002 p. 594}"
  ur: "سمندر کے کنارے پر ایک عمدہ اسٹاپ، ایک بازار، حمام، رہائشیوں اور کھیتوں کے ساتھ، اور ایک اچھی بندرگاہ جہاں ٹونا مچھلی پکڑی جاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 594}"
  tr: "Hassan'ın evi deniz kıyısında yer almakta olup, pazar, hamam, sakinler, çiftlikler ve diğer alanlar içerir ve ton balığı avlandığı bir marinaya sahiptir. {kaynak:nuzhat-al-mushtaq-2002 s. 594}"
  id: "Rumah Hassan terletak di tepi pantai, memiliki pasar, pemandian mandi, penduduk, peternakan, dan area lainnya, serta memiliki marina tempat tangkapan tuna. {cite:nuzhat-al-mushtaq-2002 hlm. 594}"
