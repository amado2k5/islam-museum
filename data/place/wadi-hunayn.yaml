summary:
  en: "A deep, hollow valley in the Tihama lowlands between Mecca and Ta'if with narrow gorges where the Hawazin confederation laid their ambush against the Muslim army in Shawwal 8 AH."
  ar: "وادٍ من أودية تهامة أجوف جرار بين مكة والطائف، فيه مضايق وشعاب كمنت فيها هوازن لجيش المسلمين في شوال 8هـ."
  es: "Un valle profundo y hueco en las tierras bajas de Tihama, entre La Meca y Ta'if, con estrechas gargantas, donde la confederación Hawazin tendió una emboscada al ejército musulmán en Shawwal del año 8 de la Hégira."
  fr: "Une vallée profonde et creuse dans les basses terres de Tihama, entre La Mecque et Taïf, avec des gorges étroites où la confédération des Hawazin a tendu son embuscade à l'armée musulmane en Shawwal 8 AH."
  ur: "مکہ اور طائف کے درمیان تہامہ نشیبی علاقوں میں ایک گہری، کھوکھلی وادی جس میں تنگ گھاٹیاں ہیں جہاں شوال 8 ہجری میں ہوازن کنفیڈریشن نے مسلم فوج کے خلاف گھات لگا کر حملہ کیا۔"
