label: { ar: "إرلاندة", en: "Irlanda", es: "Irlanda", fr: "Irlande", ur: "آئرلینڈ", tr: "İrlanda", id: "Irlandia" }
summary:
  ar: "جزيرة كبيرة جدا، ينقل المؤلف عن صاحب كتاب العجائب أن بها ثلاث مدائن كانت المراكب تحط بها، وأن أهلها تفانوا في حروب داخلية {cite:nuzhat-al-mushtaq-2002 p. 947} {cite:nuzhat-al-mushtaq-2002 p. 948}."
  en: "A very large island; the author, citing the author of a book of marvels, says it had three towns where ships used to call, and that its people destroyed each other in internal wars {cite:nuzhat-al-mushtaq-2002 p. 947} {cite:nuzhat-al-mushtaq-2002 p. 948}."
  es: "Una isla muy grande; el autor, citando al autor de un libro de maravillas, dice que tenía tres pueblos donde solían atracar barcos, y que sus habitantes se destruían entre sí en guerras internas {cite:nuzhat-al-mushtaq-2002 p. 947} {cite:nuzhat-al-mushtaq-2002 p. 948}."
  fr: "Une île très grande; l'auteur, citant l'auteur d'un livre de merveilles, dit qu'elle avait trois villes où les navires faisaient escale, et que ses habitants s'entretuaient lors de guerres internes {cite:nuzhat-al-mushtaq-2002 p. 947} {cite:nuzhat-al-mushtaq-2002 p. 948}."
  ur: "ایک بہت بڑا جزیرہ؛ مصنف نے عجائبات کی کتاب کے مصنف کا حوالہ دیتے ہوئے کہا ہے کہ اس کے تین قصبے تھے جہاں بحری جہاز آتے تھے اور اس کے لوگوں نے اندرونی جنگوں میں ایک دوسرے کو تباہ کر دیا تھا۔ 947} {حوالہ: نزہت المشتاق-2002 ص۔ 948}۔"
  tr: "Çok büyük bir ada. Yazar, Al-Aja'ib adlı kitabın yazarının, burada gemilerin demirlediği üç şehir olduğunu ve sakinlerinin iç savaşlara kendilerini adadığını söylediğini aktarıyor {cite:nuzhat-al-mushtaq-2002 s. 947} {cite:nuzhat-al-mushtaq-2002 s. 948}."
  id: "Sebuah pulau yang sangat besar. Penulis mengutip penulis buku Al-Aja'ib yang mengatakan bahwa pulau ini memiliki tiga kota tempat kapal biasa berlabuh, dan bahwa penduduknya mendedikasikan diri untuk perang internal {cite:nuzhat-al-mushtaq-2002 hlm. 947} {cite:nuzhat-al-mushtaq-2002 hlm. 948}."
