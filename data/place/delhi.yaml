summary:
  ar: مدينة في شمال الهند على الضفة الغربية لنهر جمنا، كانت عاصمة أقدم الحكام المسلمين في الهند منذ 608هـ/1211م وعاصمة الأسرات الشمالية حتى سنة 1858م. تعاقبت في منطقتها مدن كثيرة للحكم منها قلعة راي بيثورا وسيري وتغلق آباد وجهان پناه وفيروزآباد وشاهجهان آباد التي أسسها شاه جهان سنة 1048هـ/1639م. وفيها أقدم المعالم الإسلامية في شبه القارة، من مسجد قوة الإسلام وقطب منار إلى ضريح همايون والقلعة الحمراء والجامع الكبير.
  en: A city in northern India on the west bank of the Yamuna. It was the capital of the earliest Muslim rulers of India from 608/1211 and of the northern dynasties until 1858, and then of British India from 1911 and independent India after 1947. Many successive cities of government rose in its area, from Qil'a Ray Pithora and Siri to Tughluqabad, Jahanpanah, Firuzabad and Shah Jahan's Shahjahanabad of 1048/1639. It holds the earliest monuments of a settled Islamic power in the subcontinent, from the Quwwat al-Islam mosque and the Qutb Minar to Humayun's tomb, the Red Fort and the Jami Masjid.
  ur: دریائے جمنا کے مغربی کنارے پر شمالی ہندوستان کا شہر۔ یہ 608ھ/1211ء سے ہندوستان کے قدیم ترین مسلم حکمرانوں کا اور 1858ء تک شمالی خاندانوں کا دارالحکومت رہا، پھر 1911ء سے برطانوی ہندوستان کا اور 1947ء کے بعد آزاد ہندوستان کا۔ اس علاقے میں حکومت کے کئی شہر یکے بعد دیگرے بنے، قلعہ رائے پتھورا اور سیری سے تغلق آباد، جہاں پناہ اور فیروزآباد تک، اور شاہ جہان کا شاہجہان آباد جو 1048ھ/1639ء میں بنا۔ اس میں برصغیر کی مستحکم اسلامی طاقت کی قدیم ترین عمارتیں ہیں، مسجد قوت الاسلام اور قطب منار سے لے کر مقبرہ ہمایوں، لال قلعہ اور جامع مسجد تک۔
