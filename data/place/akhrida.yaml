summary:
  ar: "مدينة جليلة كثيرة العمارة، واسعة لطيفة، وبقربها بحيرة كبيرة يُصاد فيها السمك، وتبعد عن بولغو يوماً. {cite:nuzhat-al-mushtaq-2002 p. 792}"
  en: "A great city with many buildings, broad and pleasant, with a great lake nearby where fish are taken; a day from Bulgo. {cite:nuzhat-al-mushtaq-2002 p. 792}"
  es: "Una gran ciudad con muchos edificios, amplia y agradable, con un gran lago cerca donde se pesca; a un día de Bulgo. {cite:nuzhat-al-mushtaq-2002 p. 792}"
  fr: "Une grande ville aux nombreux édifices, vaste et agréable, avec un grand lac à proximité où l'on pêche; à une journée de Bulgo. {cite:nuzhat-al-mushtaq-2002 p. 792}"
  ur: "ایک عظیم شہر جس میں بہت سی عمارتیں، وسیع اور خوشگوار، قریب ہی ایک عظیم جھیل کے ساتھ جہاں مچھلیاں لی جاتی ہیں۔ بلگو سے ایک دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 792}"
  tr: "Çok sayıda binaya sahip, geniş ve hoş bir şehir olan bu şehirde, yakınında balıkçılık için büyük bir göl bulunur ve bir zamanlar Bolgo'dan uzaktır. {kaynak:nuzhat-al-mushtaq-2002 s. 792}"
  id: "Kota megah dengan banyak bangunan, luas dan menyenangkan, di dekatnya terdapat danau besar untuk memancing, dan dulunya jauh dari Bolgo. {cite:Nuzhat-al-Mushtaq-2002 hlm. 792}"
