summary:
  ar: "نهر الأبلة قناة البصرة الكبرى من الإجانة إلى الأبلة طوله أربعة فراسخ؛ بدأ حفره أبو موسى الأشعري بأمر عمر وأتمه زياد بن أبي سفيان من حيث انطمّ فكان ذلك سبب عداوته وعبد الله بن عامر."
  en: "The Ubulla canal, Basra's great channel from al-Ijana to al-Ubulla, four farsakhs long; Abu Musa began its digging on Umar's order and Ziyad completed it from the silted reach — the cause of his feud with Abdallah ibn Amir."
  es: "El canal de Ubulla, el gran canal de Basora que va desde al-Ijana hasta al-Ubulla, de cuatro farsakhs de longitud; Abu Musa comenzó a excavarlo por orden de Umar y Ziyad lo completó desde el tramo sedimentado, causa de su disputa con Abdallah ibn Amir."
  fr: "Le canal d'Ubulla, le grand canal de Bassora reliant al-Ijana à al-Ubulla, long de quatre farsakhs; Abu Musa commença son creusement sur l'ordre d'Umar et Ziyad le termina à partir de la partie envasée — la cause de sa querelle avec Abdallah ibn Amir."
  ur: "نہر اوبولا، بصرہ کا العجانہ سے الابلہ تک کا عظیم نالہ، چار فرسخ طویل؛ ابو موسیٰ نے عمر کے حکم پر اس کی کھدائی شروع کی اور زیاد نے اسے گاد کی پہنچ سے مکمل کیا - عبداللہ بن عامر کے ساتھ اس کے جھگڑے کی وجہ۔"
