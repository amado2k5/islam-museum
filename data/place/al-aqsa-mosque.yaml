label: { ar: "المسجد الأقصى", en: "al-Aqsa Mosque", es: "Mezquita de Al-Aqsa", fr: "Mosquée al-Aqsa", ur: "مسجد اقصیٰ", tr: "Mescid-i Aksa Camii", id: "Masjid Al-Aqsa" }
summary:
  ar: "المسجد الأقصى في بيت المقدس، الذي يعدّه الكتاب مسرى النبي وثاني المساجد التي تشد إليها الرحال. يرى الكتاب أن اسم الأقصى كان يشمل المسجد كله بما دار عليه السور، وأن إطلاقه على المبنى المعروف اليوم اصطلاح حادث {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}، وأن عبد الملك بن مروان بنى المسجدين المعروفين بالصخرة والأقصى {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17-18}، وأن مساحة الساحة كلها نحو مائة وأربعين دونماً وتسعمائة متر على حساب دائرة الانتداب {cite:bayt-al-maqdis-fi-al-islam-azhar p. 120}."
  en: "The al-Aqsa Mosque in Jerusalem, which the book calls the Prophet's place of the Night Journey and the second mosque to which journeys are made. The book holds that 'al-Aqsa' named the whole enclosure within the wall, and that applying it to the present building is a later usage {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}."
  es: "La mezquita de Al-Aqsa en Jerusalén, a la que el libro denomina el lugar del Viaje Nocturno del Profeta y la segunda mezquita a la que se realizan los viajes. El libro sostiene que «Al-Aqsa» designaba todo el recinto dentro de la muralla, y que su aplicación al edificio actual es un uso posterior {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}."
  fr: "La mosquée al-Aqsa à Jérusalem, que l'ouvrage décrit comme le lieu du Voyage nocturne du Prophète et la deuxième mosquée où l'on se rend en pèlerinage. L'ouvrage soutient qu'« al-Aqsa » désignait l'ensemble de l'enceinte fortifiée et que son application au bâtiment actuel est un usage postérieur {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}."
  ur: "یروشلم میں مسجد اقصیٰ، جسے کتاب رات کے سفر کی جگہ کہتی ہے اور دوسری مسجد جس میں سفر کیا جاتا ہے۔ کتاب میں کہا گیا ہے کہ 'اقصیٰ' نے دیوار کے اندر موجود پورے حصار کا نام دیا ہے اور اسے موجودہ عمارت پر لاگو کرنا بعد میں استعمال کیا گیا ہے۔ 74}۔"
  tr: "Kitapta Peygamber'in gece yolculuğu olarak kabul edilen Kudüs'teki Aksa Camii, hacıların çekildiği ikinci cami olarak kabul edilir. Kitapta El-Aksa adının tüm camiyi ve çevresindeki surları kapsadığı, bugün bilinen binanın adının günlük bir terim olduğu belirtilir {cite:bayt-al-maqdis-fi-al-Islam-azhar, s. 74}} ve Abdül-Malik ibn Mervan'ın Kaya ve El-Aksa olarak bilinen iki camiyi inşa ettiği {cite:bayt-al-maqdis-fi-al-Islam-azhar, s. 17-18} ve meydanın toplam alanının yaklaşık yüz kırk dokuz yüz dunum olduğunu, bunun Mandat Dairesi masraflarıyla gerçekleştiğini belirtir {cite:bayt-al-maqdis-fi-al-Islam-azhar, s. 120}."
  id: "Masjid Al-Aqsa di Yerusalem, yang dalam buku ini dianggap sebagai perjalanan malam Nabi dan masjid kedua yang menarik para jemaah. Kitab tersebut menyatakan bahwa nama Al-Aqsa mencakup seluruh masjid dan tembok sekitarnya, dan bahwa nama bangunan yang dikenal saat ini adalah istilah sehari-hari {cite:bayt-al-maqdis-fi-al-Islam-azhar, hlm. 74}, dan bahwa Abd al-Malik ibn Marwan membangun dua masjid yang dikenal sebagai Batu dan Al-Aqsa {cite:bayt-al-maqdis-fi-al-Islam-azhar, hlm. 17-18}, dan total luas alun-alun tersebut sekitar seratus empat puluh sembilan ratus dunam, dengan biaya Departemen Mandat {cite:bayt-al-maqdis-fi-al-Islam-azhar, hlm. 120}."
