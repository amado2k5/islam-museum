label: { ar: "المسجد الأقصى", en: "al-Aqsa Mosque" }
summary:
  ar: "المسجد الأقصى في بيت المقدس، الذي يعدّه الكتاب مسرى النبي وثاني المساجد التي تشد إليها الرحال. يرى الكتاب أن اسم الأقصى كان يشمل المسجد كله بما دار عليه السور، وأن إطلاقه على المبنى المعروف اليوم اصطلاح حادث {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}، وأن عبد الملك بن مروان بنى المسجدين المعروفين بالصخرة والأقصى {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17-18}، وأن مساحة الساحة كلها نحو مائة وأربعين دونماً وتسعمائة متر على حساب دائرة الانتداب {cite:bayt-al-maqdis-fi-al-islam-azhar p. 120}."
  en: "The al-Aqsa Mosque in Jerusalem, which the book calls the Prophet's place of the Night Journey and the second mosque to which journeys are made. The book holds that 'al-Aqsa' named the whole enclosure within the wall, and that applying it to the present building is a later usage {cite:bayt-al-maqdis-fi-al-islam-azhar p. 74}."
