label: { ar: "بنجار ⁦(الكيماك)⁩", en: "Banjar (Kimak)", es: "Banjar (Kimak)", fr: "Banjar (Kimak)", ur: "بنجر ⁦(کمک)⁩", tr: "Banjjar (Al-Kimak)", id: "Banjjar (Al-Kimak)" }
summary:
  ar: "مدينة كبيرة القطر، لها أجناد وعدد وأموال، وفيها أنواع من النمور وغيرها من الحيوانات، ويخرج أهلها الفراء إلى صقع البلاد، وتبعد عن سراوس نحو ثلاثة أيام. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  en: "A large town with soldiers, arms and wealth, where tigers and other animals are found; its people carry furs to distant lands; about three days from Suraws. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  es: "Una gran ciudad con soldados, armas y riquezas, donde se encuentran tigres y otros animales; sus habitantes transportan pieles a tierras lejanas; a unos tres días de Suraws. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  fr: "Une grande ville peuplée de soldats, d'armes et de richesses, où l'on trouve des tigres et d'autres animaux; ses habitants exportent des fourrures vers des contrées lointaines; à environ trois jours de Suraws. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  ur: "ایک بڑا شہر جس میں سپاہیوں، ہتھیاروں اور دولت کے ساتھ شیر اور دوسرے جانور پائے جاتے ہیں۔ اس کے لوگ کھالیں دور دراز علاقوں تک لے جاتے ہیں۔ سورس سے تقریباً تین دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 709}"
  tr: "Askerleri, sayıları ve zenginliği olan büyük bir şehir; çeşitli kaplanlar ve diğer hayvanlar da var. İnsanları kürkleriyle ülkenin soğuğuna seyahat eder ve Sarous'a yaklaşık üç gün uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 709}"
  id: "Sebuah kota besar dengan tentara, jumlah, dan kekayaan, serta memiliki berbagai harimau dan hewan lainnya. Penduduknya melakukan perjalanan bulu ke dinginnya pedesaan, dan jaraknya sekitar tiga hari dari Sarous. {cite:Nuzhat-al-Mushtaq-2002 hlm. 709}"
