summary:
  ar: "مدينة جليلة على شرقي النهر الذي يصب في البحر، ويذكر المؤلف أنها تبعد عن سيستار في البر ستين ميلا {cite:nuzhat-al-mushtaq-2002 p. 944} {cite:nuzhat-al-mushtaq-2002 p. 945}."
  en: "A notable city on the east bank of a river that flows to the sea; the author gives sixty miles by land from Sīsitār {cite:nuzhat-al-mushtaq-2002 p. 944} {cite:nuzhat-al-mushtaq-2002 p. 945}."
  es: "Una ciudad notable en la orilla este de un río que desemboca en el mar; el autor indica sesenta millas por tierra desde Sīsitār {cite:nuzhat-al-mushtaq-2002 p. 944} {cite:nuzhat-al-mushtaq-2002 p. 945}."
  fr: "Une ville notable sur la rive est d'un fleuve qui se jette dans la mer; l'auteur donne soixante milles par voie terrestre depuis Sīsitār {cite:nuzhat-al-mushtaq-2002 p. 944} {cite:nuzhat-al-mushtaq-2002 p. 945}."
  ur: "ایک دریا کے مشرقی کنارے پر ایک قابل ذکر شہر جو سمندر کی طرف بہتا ہے۔ مصنف نے سیستار سے زمین کے ذریعے ساٹھ میل بتائی ہے {حوالہ: نزہت المشتاق-2002 صفحہ 944} {حوالہ: نزہت المشتاق-2002 ص۔ 945}۔"
  tr: "Denize dökülen nehrin doğu yakasında soylu bir şehirdir ve yazar, anakaradan Sistar'dan altmış mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 944} {cite:Nuzhat-al-Mushtaq-2002 s. 945}."
  id: "Sebuah kota bangsawan di sisi timur sungai yang mengalir ke laut, dan penulis menyebutkan bahwa kota ini berjarak enam puluh mil dari Sistar di daratan utama {cite:Nuzhat-al-Mushtaq-2002 hlm. 944} {cite:Nuzhat-al-Mushtaq-2002 hlm. 945}."
