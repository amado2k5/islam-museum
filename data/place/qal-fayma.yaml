label: { ar: "قلعة فيمي", en: "Qal'at Fayma", es: "Qal'at Fayma", fr: "Qal'at Fayma", ur: "قلعت فیمہ", tr: "Fimi Kalesi", id: "Kastil Fimi" }
summary:
  ar: "حصن أزلي قديم ومعقل غير ذميم، ومياهه قليلة فيما استدار به، ويذكر الإدريسي أن بين الحمة وطرزي مسافة معلومة. {cite:nuzhat-al-mushtaq-2002 p. 608}"
  en: "An ancient, unblemished stronghold with little water in its surroundings; al-Idrisi gives distances from it along the roads of the western part of the island. {cite:nuzhat-al-mushtaq-2002 p. 608}"
  es: "Una antigua fortaleza inmaculada con poca agua en sus alrededores; al-Idrisi indica las distancias desde ella a lo largo de los caminos de la parte occidental de la isla. {cite:nuzhat-al-mushtaq-2002 p. 608}"
  fr: "Une forteresse antique et immaculée, peu arrosée aux alentours; al-Idrisi indique les distances qui la séparent de cette forteresse par les routes de la partie occidentale de l’île. {cite:nuzhat-al-mushtaq-2002 p. 608}"
  ur: "ایک قدیم، بے داغ گڑھ جس کے گردونواح میں تھوڑا سا پانی ہے۔ الادریسی جزیرے کے مغربی حصے کی سڑکوں کے ساتھ اس سے فاصلے بتاتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 608}"
  tr: "Kadim ve ebedi bir kale ile sahiplenmemiş bir kale, döndüğünde suları sınırlıdır. Al-Idrisi, Al-Hamma ile Tarzi arasında bilinen bir mesafe olduğunu belirtir. {cit:Nuzhat-al-mushtaq-2002 s. 608}"
  id: "Benteng kuno dan abadi serta benteng yang belum diklaim, airnya terbatas saat berbalik. Al-Idrisi menyebutkan bahwa ada jarak yang diketahui antara Al-Hamma dan Tarzi. {cite:nuzhat-al-mushtaq-2002 hlm. 608}"
