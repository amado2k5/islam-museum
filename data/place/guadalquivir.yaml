summary:
  ar: "نهر الأندلس الكبير الذي يمر بقرطبة؛ يذكر المؤلف أنه يخرج من جبل ويغوص تحت الأرض ثم يظهر، ويمر بقرطبة وإشبيلية وقادس ثم يصب في بحر الظلمات، ويذكر أن أصله واحد مع نهر مرسية. {cite:nuzhat-al-mushtaq-2002 p. 561}"
  en: "The great river that passes Cordoba. The author reports that it emerges from a mountain, goes under the ground and reappears, passes Cordoba, Seville and Cadiz, and reaches the Sea of Darkness; he also reports that its source is shared with the river of Murcia. {cite:nuzhat-al-mushtaq-2002 p. 561}"
