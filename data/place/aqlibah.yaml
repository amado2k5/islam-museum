summary:
  ar: "مدينة عامرة في بلاد القمانية الداخلة، تبعد عن طرويا ثمانية أيام، وهي عند المؤلف آخر عمالة {cite:nuzhat-al-mushtaq-2002 p. 958}."
  en: "A populous city in the inner land of the Qumans, eight days from Ṭarawiyā, which the author calls the last district of the region {cite:nuzhat-al-mushtaq-2002 p. 958}."
  es: "Una ciudad populosa en la tierra interior de los Qumanes, a ocho días de Tarawiyā, que el autor llama el último distrito de la región {cite:nuzhat-al-mushtaq-2002 p. 958}."
  fr: "Une ville populeuse dans le pays intérieur des Qumans, à huit jours de Ṭarawiyā, que l'auteur appelle le dernier district de la région {cite:nuzhat-al-mushtaq-2002 p. 958}."
  ur: "قمان کی اندرونی سرزمین میں ایک آبادی والا شہر، طراویہ سے آٹھ دن بعد، جسے مصنف نے اس خطے کا آخری ضلع کہا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 958}۔"
  tr: "Qamaniyah topraklarında, Tarawayh'e sekiz gün uzaklıkta, gelişen bir şehir ve yazara göre son valilik {cite:Nuzhat-al-Mushtaq-2002, s. 958}."
  id: "Sebuah kota yang berkembang di tanah Qamaniyah, terletak delapan hari dari Tarawayh, dan menurut penulis, ini adalah prefektur terakhir {cite:Nuzhat-al-Mushtaq-2002, hlm. 958}."
