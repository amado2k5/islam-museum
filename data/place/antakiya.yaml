summary:
  ar: أنطاكية مدينة الثغر الشامي على الأرنط؛ صالح أهلها أبا عبيدة على الجزية والجلاء فجلا بعضهم وأقام بعضهم على دينار وجريب لكل حالم ثم نقضوا فأعاد فتحها إياد بن غنم وحبيب بن مسلمة على الصلح الأول؛ وأمر عمر بترتيب مرابطة من المسلمين أهل النيات والحسبة بها ولحقت بأمرها الصوائف، وأقطع عثمان بها قطائع ونقل إليها معاوية سنة 42 فرساً وأهالي بعلبك وحمص والمصرين؛ وبها باب مسلم سمي بمسلم بن عبد الله جد عبد الله بن حبيب الأنطاكي قتله علج بحجر على السور، وأقطع الوليد بن عبد الملك جنداً أرض سلوقية وبنى حصنها، وكانت أرض بغراس لمسلمة بن عبد الملك فوقفها في سبيل البر. وبناها الملك المعروف بأنطيخش وسميت على اسمه فلما وردها المسلمون حذفوا الأحرف إلا الألف والنون والطاء، وبها كنيسة أشمونيت خارج السور كانت في أيدي اليهود فعوضتهم الملك داراً فعرفت دار اليهود، وفي تاريخ الملكية بكنيسة القسيان بها أن لمولد المسيح إلى سنة ٣٣٢هـ تسعمائة سنة وأربعون سنة وسنون الإسكندر ألفاً ومائتين وخمساً وثمانين ومن الإسكندر إلى المسيح ثلاثمائة سنة وتسعاً وستين {cite:muruj-al-dhahab p. 505}، وبها هيكل يعرف بالديماس على يمين مسجدها
    الجامع عظيم البنيان يدخل القمر في كل سنة عند طلوعه من باب من أبوابه في بعض الأهلة الصيفية وقيل إنه من بناء الفرس حين ملكت أنطاكية وأنه كان بيت نار {cite:muruj-al-dhahab p. 556}
  en: Antioch, the Syrian frontier city on the Amanus approach; its people compounded with Abu Ubayda for jizya and evacuation — some departing, some staying at a dinar and a jarib per adult — then broke faith, and Iyad ibn Ghanm with Habib ibn Maslama retook it on the first treaty; Umar ordered murabita of right intent settled there and the summer expeditions attached to it, Uthman granted estates in it, and Mu'awiya transferred Persians and people of Ba'labakk, Hims and the two Misrs to it in year 42; it holds Bab Muslim named for Muslim ibn Abdullah, grandfather of Abdullah ibn Habib, whom a Byzantine killed with a stone on the wall; al-Walid granted troops the Saluqiyya lands and built its fortress, and Maslama ibn Abd al-Malik's Baghras lands became his endowment in the way of good.
  ur: دریائے عاصی کے کنارے شام کا سرحدی شہر؛ بلاذری اس کے باشندوں کی ابو عبیدہ کے ساتھ صلح، دوبارہ فتح اور بعد کے فوجی و آبادیاتی انتظامات بیان کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}
  es: "Antioquía, la ciudad fronteriza siria en el acceso al Amanus; su gente se asoció con Abu Ubayda para el pago de la jizya y la evacuación —algunos partieron, otros se quedaron a cambio de un dinar y un jarib por adulto— luego rompió su promesa, e Iyad ibn Ghanm con Habib ibn Maslama la reconquistó en el primer tratado; Umar ordenó que los murabita de buena intención se establecieran allí y que las expediciones de verano se adhirieran a ella, Uthman concedió propiedades en ella, y Mu'awiya transfirió persas y gente de Ba'labakk, Hims y los dos Misrs a ella en el año 42; alberga Bab Muslim, que lleva el nombre de Muslim ibn Abdullah, abuelo de Abdullah ibn Habib, a quien un bizantino mató con una piedra en la muralla; al-Walid concedió a las tropas las tierras de Saluqiyya y construyó su fortaleza, y las tierras de Baghras de Maslama ibn Abd al-Malik se convirtieron en su dotación en el camino del bien."
  fr: "Antioche, ville frontalière syrienne sur la route d'Amanus, ses habitants s'allièrent à Abou Ubayda pour la jizya et l'évacuation – certains partant, d'autres restant moyennant un dinar et un jarib par adulte – puis rompirent leur engagement, et Iyad ibn Ghanm, avec Habib ibn Maslama, la reprit lors du premier traité; Umar ordonna l'installation de murabita de bonne volonté et y rattacha les expéditions estivales; Uthman y octroya des terres, et Mu'awiya y transféra des Perses et des habitants de Ba'labakk, Hims et des deux Misr; elle abrite Bab Muslim, nommée en l'honneur de Muslim ibn Abdullah, grand-père d'Abdullah ibn Habib, tué par un Byzantin à coups de pierre sur le mur; al-Walid octroya aux troupes les terres de Saluqiyya et y construisit sa forteresse, et les terres de Baghras de Maslama ibn Abd al-Malik devinrent sa dot."
  tr: "Antakya, dağdaki Levant sınırının şehriydi; halkı haraç ve tahliye için Ebu Ubeyde ile barıştı, bu yüzden bazıları sürüldü, bazıları ise her hayalperest için bir dinar ve bir cep ile yetindi. Sonra bunu bozdular ve İyad bin Ghanam ile Habib ibn Maslama ilk ateşkesin bir parçası olarak burayı yeniden fethetti. Ömer iyi niyetli Müslümanlar ve hisbeler için bir yerleşim yeri emretti, Savif de onun emrini yerine getirdi. Osman kesilmiş oradaki sürüler ve Muaviye, 42 Hicri'de atlarını, Baalbek, Hums halkını ve Mısırlıları transfer etti. Abdullah ibn Habib el-Antaki'nin dedesi Müslüman ibn Abdullah'ın adını taşıyan bir Müslüman kapısı vardı; Alaj tarafından duvara bir taşla öldürüldü. Al-Walid ibn Abd al-Malik, Seleukos topraklarını kesip kalesini inşa etti; bu kale, Ghara'da Maslama ibn Abd al-Malik'e ait topraktı ve o da burayı doğruluğa adadı. Antikhesh olarak bilinen kral tarafından inşa edilmiş ve onun adını taşımıştır. Müslümanlar buraya döndüklerinde, harfleri sadece Alif, Rahibe ve Ta harflerini çıkarmışlardır. Ayrıca duvarın dışında Yahudilerin elinde olan Aşmonit Kilisesi de vardır, bu yüzden Kral Dara onlara tazminat vermiş ve Yahudi Evi olarak anılmıştır. Oradaki Azizler Kilisesi'nin mülkiyet tarihinde, 332 Hicri yılında İsa'nın doğumunun dokuz yüz kırk yıl, İskender'in yıllarının iki yüz seksen beş ve İskender'den İsa'ya üç yüz altmış dokuz yıl olduğu belirtilir {atıf: Muruj-al-dhahab, s. 505}. Caminin sağında, yapısal olarak görkemli olan Dimas adında bir tapınak vardır; ay her yıl bazı yaz hilallerinde kapılarından birinden yükselirken oraya girer. Antakya'yı yöneten Persler tarafından inşa edildiği ve ateş evi olduğu söylenir {atıf:Muruj-al-dhahab, s. 556}"
  id: "Antiokhia adalah kota perbatasan Levant di gunung itu; rakyatnya berdamai dengan Abu Ubaidah untuk upeti dan evakuasi, sehingga beberapa diusir, dan beberapa menerima dinar dan kantong untuk setiap pemimpi. Kemudian mereka memecahkannya, dan Iyad ibn Ghanam serta Habib ibn Maslama merebutnya kembali sebagai bagian dari gencatan senjata pertama. Umar memerintahkan penempatan Muslim yang berniat baik dan hisbah, dan Sawa'if mengikuti perintahnya. Uthman memotong ternak di sana, dan Muawiya memindahkan kuda, penduduk Baalbek, Homs, dan Mesir pada tahun 42 H. Ada gerbang Muslim yang dinamai menurut Muslim ibn Abdullah, kakek Abdullah ibn Habib al-Antaki, yang dibunuh oleh Alaj dengan batu di dinding. Al-Walid ibn Abd al-Malik memotong tanah Seleukid dan membangun bentengnya, yang merupakan tanah di Gharas milik Maslama ibn Abd al-Malik, yang mendedikasikannya untuk kebenaran. Gereja ini dibangun oleh raja yang dikenal sebagai Antikhesh dan dinamai menurut namanya. Ketika umat Muslim kembali ke sana, mereka menghilangkan huruf-huruf kecuali Alif, Biarawati, dan Ta. Di dalamnya juga terdapat Gereja Ashmonite di luar tembok, yang sebelumnya dimiliki oleh orang Yahudi, sehingga Raja Dara memberikan kompensasi kepada mereka, dan gereja itu dikenal sebagai Rumah Yahudi. Dalam sejarah kepemilikan Gereja Para Santo di sana, dinyatakan bahwa kelahiran Kristus pada tahun 332 H adalah sembilan ratus empat puluh tahun, dan tahun Alexander adalah dua ratus delapan puluh lima, dan dari Alexander hingga Kristus tiga ratus enam puluh sembilan tahun {cite:Muruj-al-dhahab, hlm. 505}. Di sini terdapat sebuah kuil yang dikenal sebagai Dimas di sebelah kanan masjidnya, yang berstruktur megah, di mana bulan masuk setiap tahun saat terbit melalui salah satu gerbangnya pada bulan sabit musim panas. Dikatakan bahwa gereja ini dibangun oleh orang Persia saat mereka memerintah Antiokhia dan merupakan rumah api {cite:Muruj-al-dhahab, hlm. 556}"
