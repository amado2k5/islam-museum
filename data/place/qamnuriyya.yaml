label: { ar: "أرض قمنورية", en: "The land of Qamnuriyya", es: "La tierra de Qamnuriyya", fr: "Le pays de Qamnuriyya", ur: "قمنوریہ کی سرزمین", tr: "Qamanuriya toprakları", id: "Tanah Qamanuriya" }
summary:
  ar: "أرض من بلاد السودان جنوب الصحراء، كانت بها مدن مشهورة، ثم أنهكها ضغط زغاوة ولمتونة حتى تفرق أهلها في الجبال والصحاري، ولم يبق منهم إلا قوم قليل يعيشون على الألبان والسمك، وذكر المؤلف أن التجار يصفونهم بأمور في معتقدهم وتشويش {cite:nuzhat-al-mushtaq-2002 p. 105}، {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A land of the Sudan south of the Sahara that once had well-known towns. Pressure from the Zaghawa and Lamtuna reduced its people, who scattered to mountains and deserts; only a few remain, living on milk and fish. The author reports that merchants describe their beliefs as confused {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  es: "Una tierra del Sudán al sur del Sahara que antaño albergó ciudades importantes. La presión de los Zaghawa y los Lamtuna diezmó su población, que se dispersó por montañas y desiertos; solo quedan unos pocos, que viven de la leche y el pescado. El autor relata que los comerciantes describen sus creencias como confusas {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  fr: "Une région du Soudan au sud du Sahara, qui abritait autrefois des villes prospères. La pression des Zaghawa et des Lamtuna a décimé sa population, qui s'est dispersée dans les montagnes et les déserts; seuls quelques individus subsistent, vivant de lait et de poisson. L'auteur rapporte que les marchands décrivent leurs croyances comme confuses {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
  ur: "صحارا کے جنوب میں سوڈان کی ایک سرزمین جس میں کبھی مشہور قصبے تھے۔ زغاوا اور لامتونا کے دباؤ نے اس کے لوگوں کو کم کر دیا، جو پہاڑوں اور صحراؤں میں بکھر گئے۔ صرف چند ہی بچے ہیں جو دودھ اور مچھلی پر گزارہ کرتے ہیں۔ مصنف نے رپورٹ کیا ہے کہ تاجر اپنے عقائد کو مبہم قرار دیتے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 105}، {حوالہ: نزہت المشتاق-2002 ص۔ 106}۔"
  tr: "Sudan'ın Sahra'nın güneyindeki bir toprak, bir zamanlar ünlü şehirlere sahipti, ancak Zaghawa ve Latuna'nın baskısıyla tükenmiş, sakinleri dağlara ve çöllere dağılmıştı. Sadece birkaç kişi kalmış, süt ürünleri ve balıkla geçinmektedir. Yazar, tüccarların onları inanç ve kafa karışıklığı sorunları içinde tanımladığını belirtmiştir {cite:nuzhat-al-mushtaq-2002 s. 105}, {cite:nuzhat-al-mushtaq-2002 s. 106}."
  id: "Sebuah tanah di Sudan selatan Sahara, yang dulunya memiliki kota-kota terkenal, kemudian kelelahan akibat tekanan Zaghawa dan Latuna hingga penduduknya tersebar di pegunungan dan gurun. Hanya beberapa orang yang tersisa, hidup dengan susu dan ikan. Penulis menyebutkan bahwa para pedagang menggambarkan mereka memiliki masalah kepercayaan dan kebingungan {cite:nuzhat-al-mushtaq-2002 hlm. 105}, {cite:nuzhat-al-mushtaq-2002 hlm. 106}."
