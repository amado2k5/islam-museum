label: { ar: "أرض قمنورية", en: "The land of Qamnuriyya" }
summary:
  ar: "أرض من بلاد السودان جنوب الصحراء، كانت بها مدن مشهورة، ثم أنهكها ضغط زغاوة ولمتونة حتى تفرق أهلها في الجبال والصحاري، ولم يبق منهم إلا قوم قليل يعيشون على الألبان والسمك، وذكر المؤلف أن التجار يصفونهم بأمور في معتقدهم وتشويش {cite:nuzhat-al-mushtaq-2002 p. 105}، {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A land of the Sudan south of the Sahara that once had well-known towns. Pressure from the Zaghawa and Lamtuna reduced its people, who scattered to mountains and deserts; only a few remain, living on milk and fish. The author reports that merchants describe their beliefs as confused {cite:nuzhat-al-mushtaq-2002 p. 105}, {cite:nuzhat-al-mushtaq-2002 p. 106}."
