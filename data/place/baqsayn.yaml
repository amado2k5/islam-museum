summary:
  ar: "مدينة مشهورة، مذكورة في عديد القواعد القديمة، فيها مزارع وصناع وعلماء، وتقع على نهر دنو جنوبا {cite:nuzhat-al-mushtaq-2002 p. 884}."
  en: "A famous city mentioned in many ancient capitals, with farms, craftsmen and scholars, on the Danube to the south {cite:nuzhat-al-mushtaq-2002 p. 884}."
  es: "Una ciudad famosa mencionada en muchas capitales antiguas, con granjas, artesanos y eruditos, en el Danubio al sur {cite:nuzhat-al-mushtaq-2002 p. 884}."
  fr: "Une ville célèbre mentionnée dans de nombreuses capitales antiques, avec des fermes, des artisans et des érudits, sur le Danube au sud {cite:nuzhat-al-mushtaq-2002 p. 884}."
  ur: "ایک مشہور شہر جس کا تذکرہ بہت سے قدیم دارالحکومتوں میں، کھیتوں، کاریگروں اور علماء کے ساتھ، جنوب میں ڈینیوب پر ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 884}۔"
  tr: "Birçok eski dilbilgisinde bahsedilen, çiftlikleri, zanaatkârları ve bilginleriyle ünlü bir şehir; güneyde Dano Nehri üzerinde yer alır {cite:Nuzhat-al-Mushtaq-2002, s. 884}."
  id: "Sebuah kota terkenal, disebutkan dalam banyak tata bahasa kuno, dengan pertanian, pengrajin, dan cendekiawan, terletak di Sungai Dano di selatan {cite:Nuzhat-al-Mushtaq-2002, hlm. 884}."
