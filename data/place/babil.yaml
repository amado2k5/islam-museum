summary:
  ar: قرية صغيرة كانت قبل مدينة كبيرة، ويذكر الإدريسي أنها كانت مصراً عظيماً في أزمنة قديمة، وأن نصف قدرها قطر صغير الآن. {cite:nuzhat-al-mushtaq-2002 p. 670}
  en: A small village that was once a great city; al-Idrisi says it was an old great capital, and that it is now a small place. {cite:nuzhat-al-mushtaq-2002 p. 670}
  es: "Un pequeño pueblo que antaño fue una gran ciudad; al-Idrisi afirma que fue una antigua gran capital y que ahora es un lugar pequeño. {cite:nuzhat-al-mushtaq-2002 p. 670}"
  fr: "Un petit village qui fut jadis une grande ville; selon al-Idrisi, il s’agissait d’une ancienne capitale importante, et ce n’est plus aujourd’hui qu’un petit village. {cite:nuzhat-al-mushtaq-2002 p. 670}"
  ur: "ایک چھوٹا سا گاؤں جو کبھی بڑا شہر تھا۔ الادریسی کا کہنا ہے کہ یہ ایک پرانا عظیم سرمایہ تھا، اور اب یہ ایک چھوٹی جگہ ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 670}"
  tr: "Bir zamanlar büyük bir şehir olan küçük bir köy ve Al-Idrisi, antik çağlarda büyük bir Mısır olduğunu, çapının yarısının ise şimdi küçük olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 670}"
  id: "Sebuah desa kecil yang dulunya merupakan kota besar, dan Al-Idrisi menyebutkan bahwa itu adalah Mesir besar pada zaman kuno, dan setengah diameternya sekarang kecil. {cite:Nuzhat-al-Mushtaq-2002 hlm. 670}"
