  fr: "Une ville située à vingt-sept milles d'Ishtikhan, de taille similaire, avec des quartiers, des villages et des fermes. {cite:nuzhat-al-mushtaq-2002 p. 503}"
  ur: "استخان سے ستائیس میل کے فاصلے پر ایک قصبہ، جس کا حجم اس سے ملتا جلتا ہے، جس میں اضلاع، دیہات اور کھیت ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 503}"
  tr: "Stichgen'e yirmi yedi mil uzaklıkta, büyüklüğü olarak yakın, yerleşimleri, köyleri ve çiftlikleriyle birlikte bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 503}"
  id: "Sebuah kota yang terletak dua puluh tujuh mil dari Stichgen, hampir berukuran dengannya, dengan pemukiman, desa, dan pertaniannya. {cite:nuzhat-al-mushtaq-2002 hlm. 503}"
