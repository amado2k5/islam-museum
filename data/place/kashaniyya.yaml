summary:
  ar: "مدينة تبعد عن اشتيخن سبعة وعشرين ميلاً، ومتقاربة معها في الكبر، ولها رساتيق وقرى ومزارع. {cite:nuzhat-al-mushtaq-2002 p. 503}"
  en: "A town twenty-seven miles from Ishtikhan, similar in size to it, with districts, villages and farms. {cite:nuzhat-al-mushtaq-2002 p. 503}"
