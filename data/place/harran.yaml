summary:
  ar: حران من مدن الجزيرة؛ صالح أهلها إياد بن غنم على مثل صلح الرها — وروي أنهم انتقلوا إليها قبل وصوله فصالحوا عن مدينتهم
    وهم بها — وكان بين أهلها تنافس حرنانيون ونصارى على المصالحة؛ وبها تل عفراء وأرض تل مذابا وأرض المصلى وصوافي في ربضها للغمر
    بن يزيد بن عبد الملك. ونقل ابن فضل الله العمري عن البكري أن على باب حران كتابة بالسريانية تنسب إلى أفلاطون قوله في النفس
    «الإنسان نبات سماوي»، وأن الباقي من هياكل الصابئة بيت بحران في باب الرقة يعرف بمعلنيشا وهو هيكل آزر أبي إبراهيم، وكانت
    سدنتهم يقفون وراء الجدر فيتكلمون فتجري الأصوات في مخاريق موصولة إلى الصور المجوفة فيظهر منها نطق {cite:umari-masalik-1924
    p. 225-226}.
  en: Harran of the Jazira cities; its people compounded with Iyad ibn Ghanm on the like of al-Ruha's treaty — some say they
    had removed there before his arrival and compounded for their city from within it — its Harranian and Christian factions
    vying to make the peace; in it lay Tall Afra, the land of Tall Madhaba and the Musalla land, with estates in its suburb
    belonging to al-Ghamr ibn Yazid ibn Abd al-Malik.
  ur: جزیرہ کے قدیم شہروں میں سے ایک؛ اس کے باشندوں نے عیاض بن غنم کے ساتھ الرہا کے معاہدے جیسی صلح کی۔ بعض روایات کے مطابق
    وہ ان کی آمد سے پہلے وہاں منتقل ہو چکے تھے اور شہر کے اندر سے صلح کی۔ شہر کے حرّانی اور عیسائی گروہ صلح کے معاہدے کے لیے
    ایک دوسرے سے مقابلہ کرتے تھے۔ اس میں تل عفراء، تل مذابہ اور مصلیٰ کی زمین شامل تھی، جبکہ مضافات کی جاگیریں الغمر بن یزید
    بن عبدالملک کی تھیں۔
  es: "Harran, una de las ciudades de Jazira, cuyos habitantes se aliaron con Iyad ibn Ghanm en un tratado similar al de al-Ruha (algunos dicen que se habían trasladado allí antes de su llegada y que habían pactado su ciudad desde dentro), con sus facciones harranianas y cristianas luchando por lograr la paz, se encontraba en ella Tall Afra, la tierra de Tall Madhaba y la tierra de Musalla, con propiedades en sus alrededores pertenecientes a al-Ghamr ibn Yazid ibn Abd al-Malik."
  fr: "Harran, l'une des villes de la Jazira; ses habitants s'allièrent à Iyad ibn Ghanm sur un traité semblable à celui d'al-Ruha — certains disent qu'ils s'y étaient installés avant son arrivée et s'étaient alliés pour leur ville depuis l'intérieur — ses factions harraniennes et chrétiennes rivalisant pour faire la paix; elle comprenait Tall Afra, le territoire de Tall Madhaba et le territoire de Musalla, avec des domaines dans sa banlieue appartenant à al-Ghamr ibn Yazid ibn Abd al-Malik."
  tr: "Harran, Cazire'nin şehirlerinden biridir; halkı Edessa Antlaşması kapsamında Iyad ibn Ghanam ile barışmıştır — onun gelişinden önce oraya taşındıkları ve şehirleriyle barış yaptıkları anlatılır — ve halkı arasında Harnanis halkı ile Hristiyanlar uzlaşma için yarışmıştır; ayrıca namaz yeri olan Tal Madhba diyarı Tell Afra ve Ghamr ibn Yazid ibn Abd al-Malik'in banliyösündeki Sawafi de yer almıştır. İbn Fadlallah al-Umari, Harran'ın kapısında Platon'a atfedilen Süryanice al-Bekri'nin sözlerini aktarmıştır; Platon ruh hakkında şöyle demiştir: 'İnsan göksel bir bitkidir,', ve kalan Sabian yapılarının Bab al-Rakka'daki Beit Bahran olup Ma'alnisha olarak bilindiği, Azar Abu İbrahim'in tapınağı olduğu belirtildi. Koruyucuları duvarların arkasında duruyor ve konuşuyordu, sesler boş heykele bağlı boşluklardan akıyor ve telaffuzunu ortaya çıkarıyordu {cite:umari-masalik-1924, s. 225-226}."
  id: "Harran adalah salah satu kota di Jazira; penduduknya berdamai dengan Iyad ibn Ghanam dalam Perjanjian Edessa — diceritakan bahwa mereka pindah ke sana sebelum kedatangannya dan berdamai dengan kota mereka saat masih di sana — dan di antara penduduknya, penduduk Harnanis dan Kristen bersaing untuk rekonsiliasi; juga termasuk Tell Afra, tanah Tal Madhba, tanah tempat ibadah, dan Sawafi di pinggiran Ghamr ibn Yazid ibn Abd al-Malik. Ibn Fadlallah al-Umari mengutip al-Bakri yang berkata dalam bahasa Siria di pintu Harran yang dikaitkan dengan Plato, yang berkata tentang jiwa: 'Manusia adalah tumbuhan surgawi,' dan bahwa struktur Saban yang tersisa adalah Beit Bahran di Bab al-Raqqa yang dikenal sebagai Ma'alnisha, yang merupakan kuil Azar Abu Ibrahim. Para penjaga mereka berdiri di balik tembok dan berbicara, dan suara mengalir dalam rongga yang terhubung dengan gambar kosong, mengungkapkan pengucapan {cite:Umari-Masalik-1924, hlm. 225-226}."
