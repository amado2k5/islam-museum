summary:
  ar: "حران من مدن الجزيرة؛ صالح أهلها إياد بن غنم على مثل صلح الرها — وروي أنهم انتقلوا إليها قبل وصوله فصالحوا عن مدينتهم وهم بها — وكان بين أهلها تنافس حرنانيون ونصارى على المصالحة؛ وبها تل عفراء وأرض تل مذابا وأرض المصلى وصوافي في ربضها للغمر بن يزيد بن عبد الملك. ونقل ابن فضل الله العمري عن البكري أن على باب حران كتابة بالسريانية تنسب إلى أفلاطون قوله في النفس «الإنسان نبات سماوي»، وأن الباقي من هياكل الصابئة بيت بحران في باب الرقة يعرف بمعلنيشا وهو هيكل آزر أبي إبراهيم، وكانت سدنتهم يقفون وراء الجدر فيتكلمون فتجري الأصوات في مخاريق موصولة إلى الصور المجوفة فيظهر منها نطق {cite:umari-masalik-1924 p. 225-226}."
  en: "Harran of the Jazira cities; its people compounded with Iyad ibn Ghanm on the like of al-Ruha's treaty — some say they had removed there before his arrival and compounded for their city from within it — its Harranian and Christian factions vying to make the peace; in it lay Tall Afra, the land of Tall Madhaba and the Musalla land, with estates in its suburb belonging to al-Ghamr ibn Yazid ibn Abd al-Malik."
