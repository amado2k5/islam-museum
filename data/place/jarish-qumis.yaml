label: { ar: "جريش بقومس", en: "Jarish of Qumis", es: "Jarish de Qumis", fr: "Jarish de Qumis", ur: "جرش آف قمیس", tr: "Qumis'te Jareesh", id: "Jareesh di Qumis" }
summary:
  ar: "بيت نار معظم بقومس لا يدرى من بناه يقال له جريش، ويقال إن الإسكندر لما غلب عليها تركها ولم يطفئها، وقيل إنه كان في ذلك الموضع قديماً مدينة عظيمة عجيبة البناء فيها بيت كبير فيه أصنام فأخربت ثم بني بعد ذلك البيت وجعلت فيه النار {cite:muruj-al-dhahab p. 549}."
  en: "Qumis's great fire-temple of unknown founder — Alexander said to have spared its flame — on the site of a marvellous idol-city razed long before {cite:muruj-al-dhahab p. 549}."
  es: "El gran templo de fuego de Qumis, de fundador desconocido —se dice que Alejandro perdonó su llama—, en el sitio de una maravillosa ciudad de ídolos arrasada mucho antes {cite:muruj-al-dhahab p. 549}."
  fr: "Le grand temple du feu de Qumis, de fondateur inconnu — Alexandre aurait épargné sa flamme — sur le site d'une merveilleuse cité idolâtre rasée bien avant {cite:muruj-al-dhahab p. 549}."
  ur: "قمیس کے نامعلوم بانی کا عظیم آتش گیر مندر - سکندر نے کہا کہ اس کے شعلے کو چھوڑ دیا گیا ہے - ایک شاندار بت شہر کے مقام پر {حوالہ: مروج الذہاب صفحہ 50 سے بہت پہلے منہدم ہو گیا تھا۔ 549}۔"
  tr: "Qumis'te inşaatçısı bilinmeyen bir ateş evi Jarish olarak adlandırılır. İskender onu yendiğinde terk ettiği ve söndürmediği söylenir. Ayrıca uzun zaman önce orada büyük ve harika bir şehir olduğu söylenir; büyük bir evi ve heykelleri vardı, bu ev yıkıldı, ardından ev inşa edildi ve içinde ateş yakıldı {cite:muruj-al-dhahab, s. 549}."
  id: "Sebuah rumah api di Qumis, yang pembangunnya tidak diketahui, disebut Jarish. Konon ketika Alexander mengalahkannya, ia meninggalkannya dan tidak memadamkannya. Juga dikatakan bahwa dulu pernah ada sebuah kota besar dan menakjubkan di tempat itu, dengan sebuah rumah besar dengan berhala, yang kemudian dihancurkan, kemudian rumah itu dibangun dan api dinyalakan di dalamnya {cite:muruj-al-dhahab, hlm. 549}."
