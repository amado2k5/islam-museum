summary:
  ar: "مدينة محدثة البناء على الضفة الشرقية للنيل، تبعد عن قوص نحو سبعة أميال. هواؤها طيب، وفيها الحبوب والزراعة، وأهلها مختلطون، ويصفهم المؤلف بالمواساة والوفاء. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A recently built town on the east bank of the Nile, about seven miles from Qus. The author describes its air as good, its farmland and grain as abundant, and its mixed population as generous. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  es: "Una ciudad de reciente construcción en la orilla este del Nilo, a unos siete kilómetros de Qus. El autor describe su aire como puro, sus tierras de cultivo y cereales como abundantes, y su población mixta como generosa. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  fr: "Une ville récemment construite sur la rive est du Nil, à environ onze kilomètres de Qus. L'auteur décrit son air comme pur, ses terres agricoles et ses céréales comme abondantes, et sa population mixte comme généreuse. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  ur: "دریائے نیل کے مشرقی کنارے پر حال ہی میں تعمیر کیا گیا قصبہ قوس سے سات میل کے فاصلے پر ہے۔ مصنف نے اس کی ہوا کو اچھی، اس کی کھیتی اور اناج کو وافر اور اس کی مخلوط آبادی کو سخی قرار دیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 129}"
