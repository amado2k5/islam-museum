summary:
  ar: "مدينة عامرة كثيرة الديار كثيرة المياه غزيرة الأنهار، لها كروم ومزارع، على جبل رشنان العظيم، ويذكر المؤلف أن بينها وبين خيماخيث أربع مراحل {cite:nuzhat-al-mushtaq-2002 p. 931}."
  en: "A populous city with many houses, abundant water and rivers, vineyards and farms, at the foot of the great mountain Rashnān; the author gives four stages from Khaymākhīth {cite:nuzhat-al-mushtaq-2002 p. 931}."
  es: "Una ciudad populosa con muchas casas, agua y ríos abundantes, viñedos y granjas, al pie de la gran montaña Rashnān; el autor da cuatro etapas desde Khaymākhīth {cite:nuzhat-al-mushtaq-2002 p. 931}."
  fr: "Une ville peuplée avec de nombreuses maisons, de l'eau et des rivières en abondance, des vignobles et des fermes, au pied de la grande montagne Rashnān; l'auteur donne quatre étapes à partir de Khaymākhīth {cite:nuzhat-al-mushtaq-2002 p. 931}."
  ur: "عظیم پہاڑ راشنان کے دامن میں بہت سے مکانات، وافر پانی اور ندیاں، انگور کے باغات اور کھیتوں والا ایک آبادی والا شہر؛ مصنف نے خیمہ خیث سے چار مراحل بیان کیے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 931}۔"
  tr: "Büyük Rashnan Dağı'nda bağları ve çiftlikleri olan, çok sayıda toprak, bol suları ve bol nehirleri olan zengin bir şehir. Yazar, Khimakhith ile arasında dört aşama olduğunu belirtir {atıf:Nuzhat-al-Mushtaq-2002, s. 931}."
  id: "Sebuah kota yang makmur dengan banyak tanah, air yang melimpah, dan sungai yang melimpah, dengan kebun anggur dan pertanian di Gunung Rashnan yang agung. Penulis menyebutkan bahwa antara kota ini dan Khimakhith terdapat empat tahap {cite:Nuzhat-al-Mushtaq-2002, hlm. 931}."
