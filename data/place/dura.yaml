summary:
  ar: "بلدة في جبل الخليل الفوقى جنوب غرب الخليل، من قرى العرش الفلسطينية ومقر مشيخة آل عمرو. في قلبها القديم الجامع العمري {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
  en: "A town in upper Jabal al-Khalil south-west of Hebron, one of Palestine\u2019s Throne Villages and seat of the al-\u2018Amr sheikhs. Its old core holds the historic Omari Mosque {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
  ur: "الخلیل کے جنوب مغرب میں جبل الخلیل فوقی کا ایک قصبہ، فلسطین کے تخت گاؤں میں سے اور آلِ عمرو مشائخ کی نشست۔ اس کے قدیم مرکز میں تاریخی عمری مسجد ہے {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}۔"
  fr: "Ville du haut Jabal al-Khalil au sud-ouest d\u2019Hébron, l\u2019un des Villages du trône palestiniens et siège des cheikhs al-\u2018Amr. Son centre ancien abrite la mosquée historique al-Omari {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
  es: "Ciudad del alto Jabal al-Khalil al suroeste de Hebrón, una de las Aldeas del trono palestinas y sede de los jeques al-\u2018Amr. Su núcleo antiguo alberga la histórica mezquita al-Omari {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
  tr: "el-Halil\u2019in güneybatısında Yukarı Cebelü\u2019l-Halil\u2019de bir kasaba; Filistin\u2019in Taht Köyleri\u2019nden ve el-Amr şeyhlerinin merkezi. Eski çekirdeğinde tarihi Ömer Camii bulunur {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
  id: "Kota di Jabal al-Khalil atas, barat daya Hebron, salah satu Desa Takhta Palestina dan kedudukan syekh al-\u2018Amr. Pusat tuanya memiliki Masjid al-Omari bersejarah {cite:unesco-tl-5717-throne-villages}{cite:dura-municipality}."
