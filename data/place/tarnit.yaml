summary:
  ar: "مدينة كبيرة قديمة أزلية حسنة، ذات أسواق وتجار وسفار، توسق منها السفن، وفيها مرسى في غربي المدينة، وتحيط بها بحيرة يدخلها البحر في اليوم مرتين. {cite:nuzhat-al-mushtaq-2002 p. 630}"
  en: "A large, ancient and fine city with markets, merchants and travellers, from which ships take cargo; it has a harbour on its west side and a lagoon fed by the sea twice a day. {cite:nuzhat-al-mushtaq-2002 p. 630}"
  es: "Una ciudad grande, antigua y hermosa, con mercados, comerciantes y viajeros, desde donde los barcos cargan mercancías; tiene un puerto en su lado oeste y una laguna alimentada por el mar dos veces al día. {cite:nuzhat-al-mushtaq-2002 p. 630}"
  fr: "Une grande et belle ville ancienne, avec des marchés, des marchands et des voyageurs, d'où les navires chargent leurs marchandises; elle possède un port à l'ouest et une lagune alimentée par la mer deux fois par jour. {cite:nuzhat-al-mushtaq-2002 p. 630}"
  ur: "ایک بڑا، قدیم اور عمدہ شہر جس میں بازار، تاجر اور مسافر ہوتے ہیں، جہاں سے جہاز سامان لے جاتے ہیں۔ اس کے مغرب کی طرف ایک بندرگاہ ہے اور دن میں دو بار سمندر کی طرف سے کھلایا جانے والا جھیل ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 630}"
