summary:
  ar: "كانت المدينة المشهورة قبل المرية، ثم خربت فلم يبق منها إلا آثار، وحولها جنات وبساتين ومتنزهات وكروم، ويذكر الإدريسي أن أهلها يتعالجون بحمامها، ويقصدها المرضى من كل الجهات. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  en: "Once a famous town before Almeria; it was ruined and only traces remain. Gardens, orchards and vineyards surround it, and al-Idrisi says its baths draw the sick from every region. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  es: "Antaño una ciudad famosa antes de Almería, quedó en ruinas y solo quedan vestigios. Jardines, huertos y viñedos la rodean, y al-Idrisi afirma que sus baños atraen a los enfermos de todas las regiones. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  fr: "Autrefois ville prospère avant Almeria, elle fut ruinée et il n'en reste aujourd'hui que des vestiges. Jardins, vergers et vignobles l'entourent, et al-Idrisi affirme que ses bains attirent les malades de toute la région. {cite:nuzhat-al-mushtaq-2002 p. 566}"
