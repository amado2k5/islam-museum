summary:
  ar: "مدينة ينسب إليها القمانيون، تسمى بذلك لأن نهرا يغوص تحت شعاب جبل ثم يخرج في البحر، وماؤه أسود كالدخان، بحسب الإدريسي. {cite:nuzhat-al-mushtaq-2002 p. 915}"
  en: "The city to which the Qumanians are attributed; it is named for a river that dives under the spurs of a mountain and comes out into the sea, with black water like smoke, according to al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 915}"
  es: "La ciudad a la que se atribuyen los habitantes de Qumán; recibe su nombre de un río que se sumerge bajo las estribaciones de una montaña y desemboca en el mar, con aguas negras como humo, según al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 915}"
  fr: "La ville à laquelle sont rattachés les Qumaniens tire son nom d'une rivière qui prend sa source au pied d'une montagne et se jette dans la mer, ses eaux noires comme de la fumée, selon al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 915}"
  ur: "وہ شہر جس کی طرف قمانیوں کو منسوب کیا جاتا ہے۔ الادریسی کے مطابق، اس کا نام ایک دریا کے نام پر رکھا گیا ہے جو پہاڑ کے نیچے غوطہ لگا کر سمندر میں نکلتا ہے، جس میں دھوئیں کی طرح کالا پانی ہوتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 915}"
