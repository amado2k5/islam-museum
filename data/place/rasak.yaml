  ar: "مدينة لها إقليمان، وفي أقاليمها قصب السكر كثير، ويُعمل بها الفانيذ ⁦(السكر المكرر)⁩ ويُحمل إلى الآفاق. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  en: "A city with two districts, whose sugar cane is plentiful; refined sugar is made there and carried to distant lands. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  es: "Una ciudad con dos distritos, donde abunda la caña de azúcar; allí se produce azúcar refinada que se transporta a tierras lejanas. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  fr: "Une ville divisée en deux quartiers, où la canne à sucre est abondante; on y produit du sucre raffiné qui est ensuite exporté vers des contrées lointaines. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  ur: "دو اضلاع پر مشتمل ایک شہر، جس میں گنے کی بہتات ہے۔ ریفائنڈ چینی وہاں بنائی جاتی ہے اور دور دراز علاقوں میں لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 174}"
