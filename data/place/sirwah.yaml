  ar: "عاصمة مكاربة سبأ في القرون التي خلت قبل سنة 650 ق.م في تقدير الرحيق المختوم؛ توجد أنقاضها على مسافة يوم إلى الجانب الغربي من مأرب وتُعرف باسم خريبة، وفي زمنها بدأ بناء سد مأرب."
  en: "Capital of the Sabaean mukarribs in the centuries before 650 BCE in al-Raheeq al-Makhtum's reckoning; its ruins lie a day's journey west of Marib and are known as Kharibah; the Marib dam was begun in that age."
  es: "Capital de los mukarribs sabeos en los siglos anteriores al 650 a. C. según el cómputo de al-Raheeq al-Makhtum; sus ruinas se encuentran a un día de viaje al oeste de Marib y se conocen como Kharibah; la construcción de la presa de Marib comenzó en esa época."
