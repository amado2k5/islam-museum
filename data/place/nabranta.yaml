summary:
  ar: "مدينة خربة شمال موضع سغوة بثماني مراحل، كانت من المدن المشهورة، ثم غلب الرمل على مساكنها ونشفت آبارها، ولم يبق فيها إلا بقايا قوم {cite:nuzhat-al-mushtaq-2002 p. 111}، {cite:nuzhat-al-mushtaq-2002 p. 112}."
  en: "A ruined city eight stages north of the Sughwa, once well known. Sand overwhelmed its houses and dried its wells, and only a few people remain {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
  es: "Una ciudad en ruinas situada a ocho etapas al norte de Sughwa, otrora muy conocida. La arena cubrió sus casas y secó sus pozos, y solo quedan unas pocas personas {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
  fr: "Une ville en ruines, à huit étapes au nord de la Sughwa, jadis réputée. Le sable a enseveli ses maisons et asséché ses puits; il ne reste plus que quelques habitants {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
  ur: "سگھوا کے شمال میں آٹھ مراحل پر ایک تباہ حال شہر، جو کبھی مشہور تھا۔ ریت نے اس کے مکانات کو گھیر لیا اور اس کے کنویں سوکھ گئے، اور صرف چند لوگ باقی رہ گئے {حوالہ: نزہت المشتاق-2002 ص۔ 111}، {حوالہ: نزہت المشتاق-2002 ص۔ 112}۔"
  tr: "Saghwa alanının kuzeyindeki Khirbet şehri sekiz evrede ünlü şehirlerden biriydi, o zamanlar evleri kumla kaplanmış ve kuyuları kurumuş, geriye sadece bir halkın kalıntıları kalmıştır {cite:nuzhat-al-mushtaq-2002 s. 111}, {cite:nuzhat-al-mushtaq-2002 s. 112}."
  id: "Kota Khirbet di utara lokasi Saghwa dalam delapan fase adalah salah satu kota terkenal, kemudian pasir mendominasi tempat tinggalnya dan sumurnya mengering, menyisakan hanya sisa-sisa sebuah bangsa {cite:nuzhat-al-mushtaq-2002 hlm. 111}, {cite:nuzhat-al-mushtaq-2002 hlm. 112}."
