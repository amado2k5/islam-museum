  ur: "ساودھلی ⁦(اودھالی)⁩"
summary:
  ar: "اسم سلالة قبيلة ومنطقة في محمية عدن الغربية، تبلغ مساحتها نحو 2000 كيلومتر مربع وسكانها نحو 10,000 نسمة، تقع بين أراضي يافع السفلى وفضلي والعولقي. ويرجع سلطانها إلى فرع من قبيلة الهيثم، ومقر حكمه لودر ⁦(الغدر)⁩، وعقد صلحًا مع البريطانيين سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 811}."
  en: "The dynastic title of a tribe and a district of about 2,000 square kilometres and 10,000 inhabitants in the Western Aden Protectorate, between Lower Yafi', Fadli and 'Awlaki territories. The Sultan belongs to the 'Awasidi, a branch of the Haytham, and his residence is at Lodar (also called al-Ghudr). A treaty with the British was made in 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 811}."
  es: "Título dinástico de una tribu y un distrito de aproximadamente 2000 kilómetros cuadrados y 10 000 habitantes en el Protectorado de Adén Occidental, entre los territorios de Yafi' Inferior, Fadli y 'Awlaki. El sultán pertenece a los 'Awasidi, una rama de los Haytham, y su residencia se encuentra en Lodar (también llamado al-Ghudr). Se firmó un tratado con los británicos en 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 811}."
  fr: "Le titre dynastique d'une tribu et d'un district d'environ 2 000 kilomètres carrés et 10 000 habitants, situé dans le protectorat d'Aden occidental, entre les territoires de Bas-Yaf', Fadli et 'Awlaki. Le sultan appartient à la tribu des 'Awasidi, une branche des Haytham, et sa résidence se trouve à Lodar (également appelée al-Ghudr). Un traité avec les Britanniques a été conclu en 1912."
  ur: "ایک قبیلے کا خاندانی لقب اور تقریباً 2,000 مربع کلومیٹر کے ایک ضلع اور مغربی عدن پروٹیکٹوریٹ میں 10,000 باشندے، لوئر یافی'، فدلی اور 'عولقی علاقوں کے درمیان۔ سلطان کا تعلق ہیثم کی ایک شاخ اوسیدی سے ہے اور اس کی رہائش لودر میں ہے ⁦(جسے الغدر بھی کہا جاتا ہے)⁩۔ انگریزوں کے ساتھ ایک معاہدہ 1912 میں کیا گیا تھا۔ 1 ص۔ 811}۔"
