label:
  ar: "الصوضالي (العوضلي)"
  en: "Sawdhali (Awdhali)"
summary:
  ar: "اسم سلالة قبيلة ومنطقة في محمية عدن الغربية، تبلغ مساحتها نحو 2000 كيلومتر مربع وسكانها نحو 10,000 نسمة، تقع بين أراضي يافع السفلى وفضلي والعولقي. ويرجع سلطانها إلى فرع من قبيلة الهيثم، ومقر حكمه لودر (الغدر)، وعقد صلحًا مع البريطانيين سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 811}."
  en: "The dynastic title of a tribe and a district of about 2,000 square kilometres and 10,000 inhabitants in the Western Aden Protectorate, between Lower Yafi', Fadli and 'Awlaki territories. The Sultan belongs to the 'Awasidi, a branch of the Haytham, and his residence is at Lodar (also called al-Ghudr). A treaty with the British was made in 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 811}."
