summary:
  ar: "مدينة من أعمال دمشق من كورة سنير، بها بيت بعل وهو الصنم الذي ذكره الله في القرآن أتدعون بعلاً، وقد كانت اليونانية اختارت لهذا الهيكل قطعة أرض بين جبل لبنان وجبل سنير فاتخذته موضعاً للأصنام، وهما بيتان عظيمان أحدهما أقدم من الآخر فيهما نقوش عجيبة محفورة في الحجر لا يتأتى حفر مثلها في الخشب مع علو سمكهما وعظم أحجازهما وطول أساطينهما ووسع فتحهما {cite:muruj-al-dhahab p. 554-555}."
  en: "City in Damascus's Sanir district holding the temple of Baal — the Baal of the Qur'anic verse — its two mighty shrines of carved stone between Lebanon and Sanir mountains unmatched even in wood-carving for their columns and vaults {cite:muruj-al-dhahab p. 554-555}."
