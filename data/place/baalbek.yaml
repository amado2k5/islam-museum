summary:
  ar: مدينة من أعمال دمشق من كورة سنير، بها بيت بعل وهو الصنم الذي ذكره الله في القرآن أتدعون بعلاً، وقد كانت اليونانية اختارت لهذا الهيكل قطعة أرض بين جبل لبنان وجبل سنير فاتخذته موضعاً للأصنام، وهما بيتان عظيمان أحدهما أقدم من الآخر فيهما نقوش عجيبة محفورة في الحجر لا يتأتى حفر مثلها في الخشب مع علو سمكهما وعظم أحجازهما وطول أساطينهما ووسع فتحهما {cite:muruj-al-dhahab p. 554-555}. وعدّ ابن فضل الله العمري «ملعب بعلبك» في الآثار المشهورة من بقايا بناء القدماء بالشام {cite:umari-masalik-1924 p. 231}.
  en: City in Damascus's Sanir district holding the temple of Baal — the Baal of the Qur'anic verse — its two mighty shrines of carved stone between Lebanon and Sanir mountains unmatched even in wood-carving for their columns and vaults {cite:muruj-al-dhahab p. 554-555}.
  es: "Ciudad en el distrito de Sanir de Damasco que alberga el templo de Baal —el Baal del versículo coránico— sus dos poderosos santuarios de piedra tallada entre las montañas del Líbano y Sanir, inigualables incluso en la talla de madera por sus columnas y bóvedas {cite:muruj-al-dhahab p. 554-555}."
  fr: "Ville du quartier de Sanir à Damas abritant le temple de Baal — le Baal du verset coranique — ses deux puissants sanctuaires en pierre sculptée entre les montagnes du Liban et de Sanir, inégalés même dans la sculpture sur bois de leurs colonnes et de leurs voûtes {cite:muruj-al-dhahab p. 554-555}."
  ur: "دمشق کے ضلع سانیر کا شہر جس میں بعل کا مندر ہے - قرآنی آیت کا بعل - لبنان اور سنیر کے پہاڑوں کے درمیان کندہ شدہ پتھر کے اس کے دو زبردست مزارات ہیں یہاں تک کہ ان کے کالموں اور تہواروں کے لئے لکڑی کی تراش خراش میں بھی بے مثال ہیں۔ 554-555}۔"
  tr: "Şam'da Snir Kora'sında yer alan bu şehir, Kur'an'da Allah'ın bahsettiği put olan Baal Evi'ni barındırır. Baal mı diyorsunuz? Yunanlılar bu tapınak için Lübnan Dağı ile Snir Dağı arasında bir arazi seçmiş ve burayı putların yapıldığı yer yapmıştır. Bunlar diğerinden daha eski olan iki büyük evdir; kalınlıklarına, sütunlarının büyüklüğüne, uzunluğa ve açılışlarının genişliğine rağmen ahşap üzerinde oyulamaz taş üzerine oyulmuş harika yazıtlar vardır {cite:muruj-al-dhahab, s. 554-555}. İbn Fadlallah al-Omari, \"Baalbek Oyun Alanı\"nı Levant'taki antik yapının kalıntılarının ünlü anıtlarından biri olarak kabul eder {cite:umari-masalik-1924, s. 231}."
  id: "Sebuah kota di Damaskus dari Kora Snir, kota ini berisi Rumah Baal, yang merupakan patung yang disebutkan oleh Tuhan dalam Al-Qur'an. Apakah Anda menyebut Baal? Orang Yunani memilih sebidang tanah di antara Gunung Lebanon dan Gunung Snir untuk kuil ini dan menjadikannya lokasi berhala-berhala. Ini adalah dua rumah besar, satu lebih tua dari yang lain, dengan prasasti menakjubkan yang dipahat di batu yang tidak dapat dipahat dari kayu, meskipun tebal, kebesaran tiangnya, panjang pilarnya, dan lebarnya bukaan {cite:muruj-al-dhahab, hlm. 554-555}. Ibn Fadlallah al-Omari menganggap \"Taman Bermain Baalbek\" sebagai salah satu monumen terkenal dari sisa-sisa bangunan kuno di Levant {cite:umari-masalik-1924, hlm. 231}."
