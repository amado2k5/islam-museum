summary:
  ar: "جزيرة صغيرة في نهر الدانوب، في رومانيا اليوم، يسكنها أتراك، قرب البوابات الحديدية وأورسوفا؛ كانت قلعة عثمانية منذ القرن الثامن عشر، وبقيت بعد 1878 جزيرة عثمانية معزولة إلى أن ضُمت إلى رومانيا سنة 1920."
  en: "A small island in the Danube, now in Romania, inhabited by Turks, close to the Iron Gates and Orsova. An Ottoman fortress from the 18th century, it remained an isolated Ottoman possession after 1878 until it passed to Romania in 1920 {cite:encyclopaedia-of-islam-2 vol. 1 p. 193}."
