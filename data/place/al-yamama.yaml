summary:
  ar: "إقليم في وسط الجزيرة العربية؛ قُتل فيه أبو قيس بن الحارث السهمي يوم اليمامة في خلافة أبي بكر، ويرد فيه هوذة بن علي الحنفي في سياق رسل النبي بحسب ابن إسحاق."
  en: A region in central Arabia; Abu Qays ibn al-Harith al-Sahmi was killed there on the day of al-Yamama in Abu Bakr's caliphate, and Hawdha ibn Ali al-Hanafi appears there in the context of the Prophet's envoys, according to Ibn Ishaq.
  ur: "جزیرہ عرب کے وسط کا علاقہ؛ ابن اسحاق کے بیان میں یہاں کے ہوذہ بن علی کا ذکر نبی کے سفیروں کے ضمن میں آتا ہے، اور ابو قیس بن حارث کی وفات جنگ یمامہ میں بیان ہوئی ہے۔ {cite:ibn-hisham-saqqa}"
