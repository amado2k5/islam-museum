label: { ar: "مدينة الزاهرة", en: "Madinat al-Zahira", es: "Madinat al-Zahira", fr: "Madinat al-Zahira", ur: "مدینۃ الزہرہ", tr: "Al-Zahira Şehri", id: "Kota Al-Zahira" }
summary:
  ar: "مدينة بناها الحاجب المنصور بن أبي عامر لنزله سماها الزاهرة ونقل إليها خزائن الأموال والأسلحة وقعد فيها على سرير الملك {cite:nafh-tib-maqqari p. 433}. وفي سنة ثمان وستين وثلاثمائة أمر المنصور ببنائها عندما استفحل أمره وخاف على نفسه في الدخول إلى قصر السلطان فأقامها بطرف البلد على نهر قرطبة الأعظم ونهض معظمها في عامين، وفي سنة سبعين انتقل إليها بخاصته وعامته واتخذ فيها الدواوين والأهراء وأطلق بساحتها الأرحاء وأقطع ما حولها لوزرائه وكتابه وقواده حتى اتصلت أرباضها بأرباض قرطبة وأفرد الخليفة من كل شيء إلا من الاسم الخلافي {cite:nafh-tib-maqqari p. 615-616}."
  en: "The palace-city al-Mansur Ibn Abi Amir built for his seat, moving into it the treasuries and arms stores and taking the throne of kingship within it {cite:nafh-tib-maqqari p. 433}."
  es: "La ciudad-palacio que al-Mansur Ibn Abi Amir construyó para su sede, trasladando a ella los tesoros y los depósitos de armas y tomando el trono del rey dentro de ella {cite:nafh-tib-maqqari p. 433}."
  fr: "La cité-palais qu'al-Mansur Ibn Abi Amir fit construire pour son siège, y installant les trésors et les arsenaux et prenant le trône de la royauté {cite:nafh-tib-maqqari p. 433}."
  ur: "المنصور ابن ابی عامر نے اپنی نشست کے لیے محل تعمیر کیا، اس میں خزانے اور اسلحہ کے ذخیرے منتقل کیے اور بادشاہی کا تخت اس کے اندر لے لیا۔ 433}۔"
  tr: "Başkâr el-Mansur bin Ebi Amir tarafından ikametgahı için inşa edilen bir şehre Al-Zahira adını verdi, servet ve silah hazinelerini aktardı ve kralın tahtına oturdu {atıf:nafh-tib-maqqari, s. 433}. 368 yılında, durumu kötüleştiğinde ve sultanın sarayına girmekten korktuğunda el-Mansur sarayının inşasını emretti. Şehri Büyük Kordoba Nehri kenarında kurdu ve çoğu iki yıl içinde restore edildi. 70 yılında kendi halkı ve generalleriyle birlikte oraya taşındı, meclisleri ve sarayları devraldı, sarayları avlusunda açtı ve çevredeki tüm alanları bakanları, kâtipleri ve liderleri için kesti, sınırları Kordoba ile birleşene kadar. Halife, halifelik hariç her şeye bağlıydı {cite:nafh-tib-maqqari s. 615-616}."
  id: "Sebuah kota yang dibangun oleh kamarawan al-Mansur ibn Abi Amir sebagai tempat tinggalnya, ia menamainya Al-Zahira, memindahkan harta dan senjata, dan duduk di atas takhta raja {cite:nafh-tib-maqqari, hlm. 433}. Pada tahun 368, al-Mansur memerintahkan pembangunannya ketika situasinya memburuk dan ia takut memasuki istana sultan. Ia mendirikannya di tepi kota di Sungai Cordoba Besar, dan sebagian besar istana dipulihkan dalam waktu dua tahun. Pada tahun 70, ia pindah ke sana bersama rakyatnya dan jenderal-jenderalnya sendiri, mengambil alih dewan dan istana, melepaskan istana di halaman istana, dan memutus semua area sekitar untuk menteri, juru tulis, dan pemimpinnya hingga perbatasannya terhubung dengan Cordoba. Khalifah berdedikasi pada segala hal kecuali kekhalifahan {cite:nafh-tib-maqqari hlm. 615-616}."
