label: { ar: "مدينة الزاهرة" }
summary:
  ar: "مدينة بناها الحاجب المنصور بن أبي عامر لنزله سماها الزاهرة ونقل إليها خزائن الأموال والأسلحة وقعد فيها على سرير الملك {cite:nafh-tib-maqqari p. 433}. وفي سنة ثمان وستين وثلاثمائة أمر المنصور ببنائها عندما استفحل أمره وخاف على نفسه في الدخول إلى قصر السلطان فأقامها بطرف البلد على نهر قرطبة الأعظم ونهض معظمها في عامين، وفي سنة سبعين انتقل إليها بخاصته وعامته واتخذ فيها الدواوين والأهراء وأطلق بساحتها الأرحاء وأقطع ما حولها لوزرائه وكتابه وقواده حتى اتصلت أرباضها بأرباض قرطبة وأفرد الخليفة من كل شيء إلا من الاسم الخلافي {cite:nafh-tib-maqqari p. 615-616}."
  en: "The palace-city al-Mansur Ibn Abi Amir built for his seat, moving into it the treasuries and arms stores and taking the throne of kingship within it {cite:nafh-tib-maqqari p. 433}."
