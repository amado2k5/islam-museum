summary:
  ar: "جزيرة متصلة بسرنديب، فيها زروع ومعادن وطيب، ويذكر المؤلف أن فيها حيواناً يسمى الكركدن، وأن في قرنه صوراً تظهر عند شقه، وينكر المؤلف ما يُحكى عن ذلك {cite:nuzhat-al-mushtaq-2002 p. 75-76}."
  en: "An island connected to Sarandib, with crops, minerals and perfumes. The author describes a rhinoceros there and a horn that, when cut, is said to show figures inside. He rejects the tale as impossible {cite:nuzhat-al-mushtaq-2002 p. 75-76}."
