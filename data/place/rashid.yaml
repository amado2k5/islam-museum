  en: "A civilised town on the Nile with farms, wheat and barley, fine vegetables and fresh fruit, and much Nile fish, including the dulays fish carried to other regions; sixty miles from Alexandria. {cite:nuzhat-al-mushtaq-2002 p. 343}"
