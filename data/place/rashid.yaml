summary:
  ar: "مدينة متحضرة على النيل، فيها مزارع وغلات حنطة وشعير، وبقول حسنة وفواكه رطبة، ويصاد بها السمك النيلي الكثير، ويُصاد بها الدليس ويُحمل إلى الجهات، وتبعد عن الإسكندرية ستين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 343}"
  en: "A civilised town on the Nile with farms, wheat and barley, fine vegetables and fresh fruit, and much Nile fish, including the dulays fish carried to other regions; sixty miles from Alexandria. {cite:nuzhat-al-mushtaq-2002 p. 343}"
  es: "Una ciudad civilizada a orillas del Nilo, con granjas, trigo y cebada, verduras selectas y fruta fresca, y abundante pescado del Nilo, incluyendo el dulay, que se exporta a otras regiones; a sesenta millas de Alejandría. {cite:nuzhat-al-mushtaq-2002 p. 343}"
  fr: "Une ville civilisée sur le Nil, avec des fermes, du blé et de l'orge, des légumes fins et des fruits frais, et une abondance de poissons du Nil, notamment le dulays, exporté vers d'autres régions; à soixante milles d'Alexandrie. {cite:nuzhat-al-mushtaq-2002 p. 343}"
  ur: "دریائے نیل پر ایک مہذب شہر جس میں کھیتوں، گندم اور جو، عمدہ سبزیاں اور تازہ پھل، اور نیل کی بہت سی مچھلیاں، جن میں ڈولی مچھلی بھی شامل ہے جو دوسرے علاقوں میں لے جایا جاتا ہے۔ اسکندریہ سے ساٹھ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 343}"
