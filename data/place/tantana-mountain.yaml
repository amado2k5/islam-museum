label: { ar: "جبل طنطنة", en: "Mount Tantana", es: "Monte Tantana", fr: "Mont Tantana", ur: "ماؤنٹ ٹنٹانا", tr: "Tantana Dağı", id: "Gunung Tantana" }
summary:
  ar: "جبل حول أرض وادان وآزقار، وفي أسفله عيون ومراع، وفيه معدن حديد جيد بحسب المؤلف {cite:nuzhat-al-mushtaq-2002 p. 113}، {cite:nuzhat-al-mushtaq-2002 p. 116}."
  en: "A mountain around which the Azqar pasture; springs and grazing lie at its foot. The author reports a good iron mine in it {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  es: "Una montaña alrededor de la cual pastan los Azqar; a sus pies se encuentran manantiales y pastos. El autor menciona una buena mina de hierro en ella {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  fr: "Une montagne autour de laquelle s'étend le pâturage d'Azqar; des sources et des pâturages se trouvent à son pied. L'auteur y signale une bonne mine de fer {cite:nuzhat-al-mushtaq-2002 p. 113}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  ur: "ایک پہاڑ جس کے ارد گرد ازقر چراگاہ ہے۔ اس کے دامن میں چشمے اور چرنے ہیں۔ مصنف نے اس میں لوہے کی ایک اچھی کان کی اطلاع دی ہے۔ 113}، {حوالہ: نزہت المشتاق-2002 ص۔ 116}۔"
  tr: "Wadan ve Azqar toprakları çevresinde, tabanında kaynaklar ve otlaklar bulunan bir dağdır ve yazara göre iyi demir cevheri içerir {cite:Nuzhat-al-Mushtaq-2002 s. 113}, {cite:Nuzhat-al-Mushtaq-2002 s. 116}."
  id: "Sebuah gunung di sekitar tanah Wadan dan Azqar, dengan mata air dan padang rumput di dasarnya, dan menurut penulis mengandung bijih besi yang baik {cite:Nuzhat-al-Mushtaq-2002 hlm. 113}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 116}."
