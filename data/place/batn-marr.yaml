  ar: "موضع على طريق مكة إلى الجحفة يبعد نحو ستة عشر ميلا من مكة، فيه عين ماء في مجرى رملي وحوله نخيلات يأوي إليها قوم من العرب. {cite:nuzhat-al-mushtaq-2002 p. 141}"
  en: "A place on the road from Mecca, about sixteen miles out, with a spring in a sandy watercourse and a few palms where Bedouin camp. {cite:nuzhat-al-mushtaq-2002 p. 141}"
  es: "Un lugar en el camino desde La Meca, a unos veintiséis kilómetros de distancia, con un manantial en un arroyo arenoso y algunas palmeras donde acampan los beduinos. {cite:nuzhat-al-mushtaq-2002 p. 141}"
  fr: "Un lieu sur la route de La Mecque, à environ seize milles, avec une source dans un cours d'eau sablonneux et quelques palmiers où campent des Bédouins. {cite:nuzhat-al-mushtaq-2002 p. 141}"
  ur: "مکہ سے سڑک پر ایک جگہ، تقریباً سولہ میل باہر، ایک ریتلی آبشار میں ایک چشمہ اور چند کھجوروں کے ساتھ جہاں بدوؤں نے ڈیرے ڈالے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 141}"
