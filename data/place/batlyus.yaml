summary:
  ar: "مدينة جليلة في بسيط الأرض، لها ربض كبير أكبر من المدينة، وعلى نهر يانة الذي يغور تحت الأرض قبل أن يصل إلى حصن مارتلة، وتبعد عن ماردة يوماً. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  en: "A great city on a plain with a suburb larger than the town, on the Yana river, which al-Idrisi says sinks underground before reaching Martula; about a day from Merida. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  es: "Una gran ciudad en una llanura con un suburbio más grande que la propia ciudad, a orillas del río Yana, que según al-Idrisi se sumerge bajo tierra antes de llegar a Martula; aproximadamente a un día de Mérida. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  fr: "Une grande ville située dans une plaine, avec une banlieue plus étendue que la ville elle-même, sur la rivière Yana, qui, selon al-Idrisi, disparaît sous terre avant d'atteindre Martula; à environ une journée de Mérida. {cite:nuzhat-al-mushtaq-2002 p. 545}"
  ur: "ایک میدان میں ایک عظیم شہر جس کا مضافاتی قصبے سے بڑا ہے، دریائے یانا پر، جس کے بارے میں الادریسی کا کہنا ہے کہ مارٹولا تک پہنچنے سے پہلے زیر زمین ڈوب جاتا ہے۔ میریڈا سے تقریباً ایک دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 545}"
