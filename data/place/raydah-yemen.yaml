summary:
  ar: مدينة على مسيرة يوم من صنعاء بحسب حاشية المحقق عن معجم البلدان، قاتل الهادي عندها صعصعة بن جعفر وخرّب قصرها في آخر جمادى الآخرة سنة 288هـ.
  en: A town a day's journey from Sana'a according to the editor's footnote from Mu'jam al-Buldan, where al-Hadi fought Sa'sa'a ibn Ja'far and razed its palace at the end of Jumada II 288 AH.
  ur: مرتب کے حاشیے میں معجم البلدان کے حوالے سے صنعاء سے ایک دن کی مسافت پر ایک شہر، جہاں ہادی نے جمادی الآخرہ 288ھ کے آخر میں صعصعہ بن جعفر سے جنگ کی اور اس کے قصر کو ڈھا دیا۔
  es: "Según la nota a pie de página del editor de Mu'jam al-Buldan, se trata de una ciudad situada a un día de viaje de Sana'a, donde al-Hadi luchó contra Sa'sa'a ibn Ja'far y arrasó su palacio a finales de Jumada II del año 288 de la Hégira."
  fr: "Une ville à une journée de voyage de Sanaa selon la note de bas de page de l'éditeur de Mu'jam al-Buldan, où al-Hadi a combattu Sa'sa'a ibn Ja'far et a rasé son palais à la fin de Jumada II 288 AH."
  tr: "Mu'cam al-Buldan'ın editörüne göre Sana'a'dan bir günlük yolculuk mesafesindeki bir şehirde, el-Hadi, 288 Hicri yılında Cumeda'l-Ahhirah'ın sonunda Sa'sa'ah ibn Ja'far'ı öldürdü ve sarayını yıktı."
  id: "Sebuah kota yang berada dalam perjalanan sehari dari Sana'a, menurut catatan kaki editor Mu'jam al-Buldan, al-Hadi membunuh Sa'sa'ah ibn Ja'far dan menghancurkan istananya di akhir Jumada al-Akhirah pada tahun 288 H."
