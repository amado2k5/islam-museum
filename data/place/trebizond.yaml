summary:
  ar: "مدينة حسنة على ضفة البحر، كانت متجرا ومقصدا للتجار، ويذكر المؤلف أن بينها وبين القسطنطينة تسعة مجار ونصف مجرى بحرا {cite:nuzhat-al-mushtaq-2002 p. 907} {cite:nuzhat-al-mushtaq-2002 p. 908}."
  en: "A fine city on the coast that was once a trading centre and destination for merchants; the author gives nine and a half sea-stages from Constantinople {cite:nuzhat-al-mushtaq-2002 p. 907} {cite:nuzhat-al-mushtaq-2002 p. 908}."
  es: "Una hermosa ciudad costera que alguna vez fue un centro comercial y destino para mercaderes; el autor indica que se encuentra a nueve etapas marítimas y media de Constantinopla {cite:nuzhat-al-mushtaq-2002 p. 907} {cite:nuzhat-al-mushtaq-2002 p. 908}."
  fr: "Une belle ville côtière qui fut autrefois un centre commercial et une destination pour les marchands; l'auteur donne neuf étapes et demie de mer depuis Constantinople {cite:nuzhat-al-mushtaq-2002 p. 907} {cite:nuzhat-al-mushtaq-2002 p. 908}."
  ur: "ساحل پر ایک عمدہ شہر جو کبھی تجارتی مرکز اور تاجروں کی منزل تھا۔ مصنف قسطنطنیہ سے ساڑھے نو سمندری مراحل بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص 907} {حوالہ: نزہت المشتاق-2002 ص۔ 908}۔"
  tr: "Sahilde güzel bir şehir olan bu şehir, tüccarlar için bir ticaret ve destinasyon noktasıydı. Yazar, Konstantinopolis ile arasında dokuz buçuk deniz deresi olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 907} {cite:Nuzhat-al-Mushtaq-2002, s. 908}."
  id: "Kota yang indah di tepi pantai, kota ini merupakan tujuan perdagangan dan tujuan bagi para pedagang. Penulis menyebutkan bahwa terdapat sembilan setengah aliran laut antara kota ini dan Konstantinopel {cite:Nuzhat-al-Mushtaq-2002, hlm. 907} {cite:Nuzhat-al-Mushtaq-2002, hlm. 908}."
