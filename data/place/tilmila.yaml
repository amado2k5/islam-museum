summary:
  ar: "مدينة صغيرة من مدن كوار، على يوم من إبزر، فيها ماء قليل ونخل قليل وتمر طيب، ومعدنها من الشب قليل الفائدة لاختلاطه بعروق التراب {cite:nuzhat-al-mushtaq-2002 p. 118}."
  en: "A small town of Kawar, one day from Ibzar, with little water and few palms but good dates. Its alum mine is of little value because the ore is mixed with earth veins {cite:nuzhat-al-mushtaq-2002 p. 118}."
  es: "Kawar es un pequeño pueblo situado a un día de Ibzar, con poca agua y escasas palmeras, pero con buenos dátiles. Su mina de alumbre tiene poco valor porque el mineral está mezclado con vetas de tierra {cite:nuzhat-al-mushtaq-2002 p. 118}."
  fr: "Kawar, petite ville située à une journée d'Ibzar, est pauvre en eau et compte peu de palmiers, mais ses dattes sont excellentes. Sa mine d'alun est peu rentable car le minerai est mélangé à des filons de terre {cite:nuzhat-al-mushtaq-2002 p. 118}."
  ur: "ابزار سے ایک دن کاوار کا ایک چھوٹا سا قصبہ جہاں تھوڑا سا پانی اور چند کھجوریں تھیں لیکن اچھی کھجوریں تھیں۔ اس کی پھٹکڑی کی کان کی قیمت بہت کم ہے کیونکہ کچ دھات زمین کی رگوں سے ملی ہوئی ہے۔ 118}۔"
  tr: "Kuwar'da küçük bir kasaba, İbzar'da bir günde, az su, az palmiye ağacı ve iyi hurma ile mineral alümünü toprak damarlarıyla karışması nedeniyle pek işe yaramaz {atıf:Nuzhat-al-Mushtaq-2002, s. 118}."
  id: "Sebuah kota kecil di Kuwar, pada hari di Ibzar, dengan sedikit air, sedikit pohon palem, dan kurma yang baik, serta mineral alum yang kurang berguna karena bercampur dengan urat tanah {kutip: Nuzhat-al-Mushtaq-2002, hlm. 118}."
