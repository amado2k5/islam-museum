summary:
  ar: "هيكل معظم ببلاد الهند يعرف بالأحري يقصده الناس من البلدان الشاسعة، وله بلد قد وقف عليه وحوله ألف مقصورة فيها جوار لم ينظرن لغير تعظيم هذا الصنم {cite:muruj-al-dhahab p. 557}."
  en: "India's great pilgrimage temple — a whole town endowed to it, ringed by a thousand cells of women consecrated to nothing but the idol's service {cite:muruj-al-dhahab p. 557}."
  es: "El gran templo de peregrinación de la India: una ciudad entera dedicada a él, rodeada por mil celdas de mujeres consagradas únicamente al servicio del ídolo {cite:muruj-al-dhahab p. 557}."
  fr: "Le grand temple de pèlerinage de l'Inde — une ville entière qui lui est dédiée, entourée d'un millier de cellules de femmes consacrées uniquement au service de l'idole {cite:muruj-al-dhahab p. 557}."
  ur: "ہندوستان کا عظیم زیارت گاہ — ایک پورا قصبہ اس کے لیے مختص ہے، جس میں خواتین کے ایک ہزار خلیے ہیں جو صرف بت کی خدمت کے لیے مخصوص ہیں۔ 557}۔"
  tr: "Hindistan'daki tapınakların çoğu geniş topraklardan gelen insanlar tarafından bilinir ve üzerinde bir kasaba vardır; çevresinde ise sadece bu heykeli kutsamak isteyen komşularıyla binlerce oda vardır {cite:muruj-al-dhahab s. 557}."
  id: "Sebagian besar kuil di India dikenal oleh orang-orang dari tanah luas, dan terdapat sebuah kota yang berdiri di atasnya serta di sekitarnya terdapat seribu kamar bersama tetangga yang hanya memandang untuk menghormati arca ini {cite:muruj-al-dhahab hlm. 557}."
