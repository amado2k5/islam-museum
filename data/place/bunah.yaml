summary:
  ar: "مدينة في قاع الجون، يصل إليها المسافر بعد رأس الحمراء على الساحل، ويصفها الإدريسي بأنها تُذكر فيما بعد من الأجزاء. {cite:nuzhat-al-mushtaq-2002 p. 275}"
  en: "A city at the bottom of a bay, reached along the coast after Ras al-Hamra; al-Idrisi says it will be described later. {cite:nuzhat-al-mushtaq-2002 p. 275}"
  es: "Una ciudad situada al fondo de una bahía, a la que se llega siguiendo la costa después de Ras al-Hamra; al-Idrisi dice que se describirá más adelante. {cite:nuzhat-al-mushtaq-2002 p. 275}"
  fr: "Une ville située au fond d'une baie, accessible par la côte après Ras al-Hamra; al-Idrisi indique qu'elle sera décrite plus loin. {cite:nuzhat-al-mushtaq-2002 p. 275}"
  ur: "ایک خلیج کے نیچے ایک شہر، راس الحمرا کے بعد ساحل کے ساتھ پہنچ گیا؛ ادریسی کہتے ہیں کہ اس کی تفصیل بعد میں آئے گی۔ {حوالہ: نزہت المشتاق-2002 ص۔ 275}"
  tr: "Goun'un dibinde yer alan bir şehir, kıyıda Ras Alhambra'dan sonra yolcuların ulaştığı ve Al-Idrisi'nin daha sonra bu bölgelerin bir parçası olarak anıldığını anlattığı bir şehirdir. {cite:nuzhat-al-mushtaq-2002 s. 275}"
  id: "Sebuah kota di dasar Goun, dicapai oleh para pelancong setelah Ras Alhambra di pantai, dan Al-Idrisi menggambarkannya sebagai bagian dari bagian tersebut. {cite:nuzhat-al-mushtaq-2002 hlm. 275}"
