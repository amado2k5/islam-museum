summary:
  ar: "مدينة شمال ودان، ينسبها المؤلف إلى رجل بناها وسكنها مع بني عمه، وذكر أن ذلك كان سنة ست وثلاث مائة للهجرة، وأنها الآن عامرة {cite:nuzhat-al-mushtaq-2002 p. 115}، {cite:nuzhat-al-mushtaq-2002 p. 116}."
  en: "A town north of Wadan. The author says it was named after the man who built it and settled there with his cousins in the year 306 AH, and that it is now populated {cite:nuzhat-al-mushtaq-2002 p. 115}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  es: "Una ciudad al norte de Wadan. El autor dice que recibió su nombre del hombre que la construyó y se estableció allí con sus primos en el año 306 AH, y que ahora está poblada {cite:nuzhat-al-mushtaq-2002 p. 115}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  fr: "Une ville au nord de Wadan. L'auteur dit qu'elle a été nommée d'après l'homme qui l'a construite et s'y est installé avec ses cousins en l'an 306 AH, et qu'elle est maintenant peuplée {cite:nuzhat-al-mushtaq-2002 p. 115}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  ur: "ودان کے شمال میں ایک قصبہ۔ مصنف کا کہنا ہے کہ اس کا نام اس شخص کے نام پر رکھا گیا جس نے اسے تعمیر کیا اور 306 ہجری میں اپنے چچازاد بھائیوں کے ساتھ وہاں آباد ہوا، اور یہ کہ اب یہ آباد ہے۔ 115}، {حوالہ: نزہت المشتاق-2002 ص۔ 116}۔"
  tr: "Yazarın kuzenleriyle birlikte orada inşa eden ve yaşayan bir adama atfettiği Kuzey Oudan şehri, bunun 306 Hicri yılında olduğunu ve şu anda yerleşim olduğunu belirtmiştir {cite:Nuzhat-al-Mushtaq-2002 s. 115}, {cite:Nuzhat-al-Mushtaq-2002 s. 116}."
  id: "Kota Utara Oudan, yang oleh penulis dikaitkan dengan seorang pria yang membangun dan tinggal di sana bersama sepupunya, menyebutkan bahwa ini terjadi pada tahun 306 H, dan sekarang telah dihuni {cite:Nuzhat-al-Mushtaq-2002 hlm. 115}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 116}."
