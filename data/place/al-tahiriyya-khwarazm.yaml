summary:
  ar: "مدينة ذات دخل وخرج ومزارع وبركات، وفواكهها عامة، وهي أول عمالة خوارزم من غربي النهر، وتبعد عن راشت مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 696}"
  en: "A town of income and trade, with farms, reservoirs and common fruits; the first district of Khwarazm on the western side of the river, two stages from Rasht. {cite:nuzhat-al-mushtaq-2002 p. 696}"
  es: "Un pueblo de ingresos y comercio, con granjas, embalses y frutales comunes; el primer distrito de Khwarazm en la orilla occidental del río, a dos etapas de Rasht. {cita: Nuzhat-al-Mushtaq-2002 p. 696}"
  fr: "Ville prospère et commerçante, avec ses fermes, ses réservoirs et ses vergers communs; premier district du Khwarezm sur la rive ouest du fleuve, à deux étapes de Rasht. {cite:nuzhat-al-mushtaq-2002 p. 696}"
  ur: "آمدنی اور تجارت کا ایک شہر، جس میں کھیتوں، ذخائر اور عام پھل ہیں۔ دریا کے مغربی کنارے پر خوارزم کا پہلا ضلع، رشت سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 696}"
