summary:
  ar: قرية مدينة فيها مسجد يُذكر فيه قبر إبراهيم، وحوله قبور متقابلة، وفيها جبال كثيفة الأشجار كالزيتون. {cite:nuzhat-al-mushtaq-2002 p. 363} زارها ابن فضل الله العمري سنة 745هـ ووصف حرمها وسماطها اليومي الذي يوزع آلاف الأرغفة على الواردين، وعاين عند وليّ الوقف ناصر الدين التميمي الداري الكتاب النبوي في إقطاع حبرون وعينون {cite:umari-masalik-1924 p. 168-176}.
  en: A town with a mosque where the tomb of Abraham is said to lie, with graves set facing one another and wooded hills of olive trees around it. {cite:nuzhat-al-mushtaq-2002 p. 363}
