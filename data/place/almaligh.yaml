summary:
  ar: "ألماليغ، عاصمة مملكة إسلامية في أعالي وادي إيلي، أسسها في القرن السابع الهجري/الثالث عشر الميلادي أوزار أو بوزار، وصارت مدينة تجارية كبيرة وغنية، وكان حاكمها يحمل لقب طغرل خان {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  en: "Almaligh was the capital of a Muslim kingdom in the upper Ili valley, founded in the 7th/13th century by Uzar or Buzar, who was said to have been a brigand. It became a great and wealthy commercial city, and its site lay south of Lake Sayram {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  es: "Almaligh fue la capital de un reino musulmán en el valle superior del Ili, fundado en el siglo VII/XIII por Uzar o Buzar, quien, según se dice, era un bandido. Se convirtió en una gran y próspera ciudad comercial, y su emplazamiento se encontraba al sur del lago Sayram {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  fr: "Almaligh était la capitale d'un royaume musulman situé dans la haute vallée de l'Ili. Fondée au VIIe ou XIIIe siècle par Uzar ou Buzar, un brigand présumé, elle devint une grande et riche cité commerciale, située au sud du lac Sayram (source: Encyclopaedia of Islam, vol. 1, p. 440)."
  ur: "الملیگ بالائی وادی الی میں ایک مسلم سلطنت کا دارالحکومت تھا، جس کی بنیاد 7ویں/13ویں صدی میں عزر یا بزار نے رکھی تھی، جس کے بارے میں کہا جاتا ہے کہ وہ ایک بریگینڈ تھا۔ یہ ایک عظیم اور دولت مند تجارتی شہر بن گیا، اور اس کا مقام جھیل سائرام کے جنوب میں واقع تھا۔ 1 ص۔ 440}۔"
