summary:
  ar: "ألماليغ، عاصمة مملكة إسلامية في أعالي وادي إيلي، أسسها في القرن السابع الهجري/الثالث عشر الميلادي أوزار أو بوزار، وصارت مدينة تجارية كبيرة وغنية، وكان حاكمها يحمل لقب طغرل خان {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  en: "Almaligh was the capital of a Muslim kingdom in the upper Ili valley, founded in the 7th/13th century by Uzar or Buzar, who was said to have been a brigand. It became a great and wealthy commercial city, and its site lay south of Lake Sayram {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
