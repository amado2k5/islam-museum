label: { ar: "قرقيسيا", en: "Qarqisiya (Circesium)", es: "Qarqisiya (Circesio)", fr: "Qarqisiya (Circesium)", ur: "قرقیسیہ (Circesium)", tr: "Kırgızistan", id: "Kyrgyzstan" }
summary:
  ar: "قرقيسيا عند ملتقى الخابور بالفرات من أعمال الجزيرة؛ وجّه إليها إياد حبيب بن مسلمة الفهري ففتحها صلحاً على مثل صلح الرقة، ثم نقض أهلها فصالحهم عمير بن سعد على مثل صلحهم الأول حين سلك الخابور إلى حصون الفرات؛ ولم تكن للرحبة التي في أسفلها أثر قديم إنما بنيت في خلافة المأمون."
  en: "Qarqisiya (Circesium) where the Khabur meets the Euphrates in the Jazira; Iyad sent Habib ibn Maslama al-Fihri who took it by treaty on the like of al-Raqqa's terms, and when its people broke faith Umayr ibn Sa'd re-compounded with them on their first treaty as he worked the Khabur down to the Euphrates forts; the al-Rahba below it had no ancient trace — built in al-Ma'mun's caliphate."
  es: "Qarqisiya (Circesium), donde el Khabur se encuentra con el Éufrates en el Jazira; Iyad envió a Habib ibn Maslama al-Fihri, quien la tomó por tratado en términos similares a los de al-Raqqa, y cuando su gente rompió la promesa, Umayr ibn Sa'd volvió a negociar con ellos sobre su primer tratado mientras trabajaba el Khabur hasta las fortalezas del Éufrates; al-Rahba, debajo de ella, no tenía rastro antiguo, ya que fue construida durante el califato de al-Ma'mun."
  fr: "Qarqisiya (Circesium), où le Khabour rencontre l'Euphrate dans la Jazira; Iyad envoya Habib ibn Maslama al-Fihri qui la prit par traité selon des termes similaires à ceux d'al-Raqqa, et lorsque ses habitants manquèrent à leur parole, Umayr ibn Sa'd revint sur leur premier traité tout en travaillant le long du Khabour jusqu'aux forts de l'Euphrate; al-Rahba en aval n'avait aucune trace ancienne — construite dans le califat d'al-Ma'mun."
  ur: "قرقیسیہ (Circesium) جہاں خبر جزیرہ میں فرات سے ملتی ہے۔ عیاض نے حبیب بن مسلمہ الفہری کو بھیجا جس نے اسے الرقہ کی شرائط کی طرح معاہدہ کرکے لے لیا، اور جب اس کے لوگوں کا ایمان ٹوٹ گیا تو عمیر بن سعد نے ان کے ساتھ اپنے پہلے معاہدے پر دوبارہ معاہدہ کیا جب اس نے خبر سے فرات کے قلعوں تک کام کیا۔ اس کے نیچے الرحبہ کا کوئی قدیم نشان نہیں تھا جو کہ المامون کی خلافت میں بنایا گیا تھا۔"
  tr: "Qarkisi, adanın Fırat bölgesindeki El-Habur kavşağında; İyad Habib bin Meslemah el-Fihri onu gönderdi ve Rakka'daki Antlaşma'ya benzer bir barışla fethetti. Sonra halkı antlaşmayı bozdu ve Umer bin Sa'd, El-Habur'un Fırat kalelerine gittiğinde olduğu gibi onlarla barış yaptı. Altındaki avluda eski kalıntılar yoktu, ancak el-Me'mun halifeliği sırasında inşa edilmiştir."
  id: "Qarqisia di persimpangan Al-Khabur di distrik Efrat pulau itu; Iyad Habib bin Maslamah Al-Fihri mengirimnya dan menaklukkannya dengan perdamaian yang mirip dengan Perjanjian Raqqa. Kemudian rakyatnya melanggar perjanjian itu, dan Umair bin Sa'd berdamai dengan mereka seperti yang dilakukan ketika Al-Khabur pergi ke benteng-benteng Sungai Efrat. Halaman di bawahnya tidak memiliki peninggalan kuno, tetapi dibangun pada masa kekhalifahan al-Ma'mun."
