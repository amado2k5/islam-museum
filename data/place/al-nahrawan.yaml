summary:
  ar: "مدينة صغيرة يشقها نهر النهروان في وسطها، وتقع على طريق بغداد إلى الجهة الشرقية، ويذكرها الإدريسي في جملة مواضع السواد. {cite:nuzhat-al-mushtaq-2002 p. 668}"
  en: "A small town crossed in its middle by the Nahrawan canal, on the road east of Baghdad, listed among the places of the Sawad. {cite:nuzhat-al-mushtaq-2002 p. 668}"
  es: "Un pequeño pueblo atravesado por el canal Nahrawan, en la carretera al este de Bagdad, incluido entre los lugares del Sawad. {cite:nuzhat-al-mushtaq-2002 p. 668}"
  fr: "Une petite ville traversée en son centre par le canal de Nahrawan, sur la route à l'est de Bagdad, répertoriée parmi les lieux du Sawad. {cite:nuzhat-al-mushtaq-2002 p. 668}"
  ur: "ایک چھوٹا سا قصبہ جو بغداد کے مشرق کی سڑک پر نہر نہر سے گزرتا ہے، جو سواد کے مقامات میں شامل ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 668}"
  tr: "Küçük bir şehir, Nahrawan Nehri'nin ortasından geçerken, doğuda Bağdat'tan gelen yol üzerinde yer alır ve Al-Idrisi, Al-Sawad'ın yerleri arasında burayı anmaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 668}"
  id: "Sebuah kota kecil memotong Sungai Nahrawan di tengahnya, terletak di jalan dari Baghdad ke timur, dan Al-Idrisi menyebutnya sebagai salah satu tempat di Al-Sawad. {cite:nuzhat-al-mushtaq-2002 hlm. 668}"
