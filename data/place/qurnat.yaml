summary:
  ar: "مدينة كبيرة عامرة على مضيق البحر، يبعد عنها مضيق يسمى بينهما ثلاثون ميلاً، وجزيرة بها تتصل بالبر. {cite:nuzhat-al-mushtaq-2002 p. 637}"
  en: "A large populated city on a strait, thirty miles from the narrows that lie between them; an island lies off it joined to the mainland. {cite:nuzhat-al-mushtaq-2002 p. 637}"
  es: "Una gran ciudad poblada situada en un estrecho, a treinta millas del desfiladero que los separa; frente a ella se encuentra una isla unida al continente. {cite:nuzhat-al-mushtaq-2002 p. 637}"
  fr: "Une grande ville peuplée située sur un détroit, à trente milles du passage étroit qui les sépare; une île, rattachée au continent, se trouve au large. {cite:nuzhat-al-mushtaq-2002 p. 637}"
  ur: "آبنائے پر ایک بڑا آبادی والا شہر، ان کے درمیان موجود تنگ دریا سے تیس میل کے فاصلے پر۔ ایک جزیرہ ہے جو سرزمین سے جڑا ہوا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 637}"
  tr: "Deniz boğazında büyük bir şehir, Thirty Miles Away adlı bir boğazla ayrılmış ve anakaraya bağlayan bir ada. {cite:nuzhat-al-mushtaq-2002 s. 637}"
  id: "Sebuah kota besar di selat laut, dipisahkan oleh selat bernama Thirty Miles Away, dan sebuah pulau yang menghubungkannya ke daratan utama. {cite:Nuzhat-al-Mushtaq-2002 hlm. 637}"
