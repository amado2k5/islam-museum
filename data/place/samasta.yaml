summary:
  ar: "ضيعة وقصور بعيدة من معظم النيل بنحو ميلين، عامرة بالناس، وفيها مزارع للقصب يُعمل منها السكر والفانيذ. وهي مع ترفة من الضياع المأهولة في مصر. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  en: "An estate-village about two miles from the main Nile, populated and with sugar-cane fields producing sugar and fanid. Along with Tarfa, the author counts it among the inhabited estates of Egypt. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  es: "Un poblado perteneciente a una hacienda, situado a unos tres kilómetros del Nilo principal, poblado y con campos de caña de azúcar que producían azúcar y fanid. Junto con Tarfa, el autor lo incluye entre las haciendas habitadas de Egipto. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  fr: "Un village-domaine situé à environ trois kilomètres du Nil principal, habité et doté de champs de canne à sucre produisant du sucre et du manioc. L'auteur le compte, avec Tarfa, parmi les domaines habités d'Égypte. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  ur: "مرکزی نیل سے تقریباً دو میل کے فاصلے پر ایک اسٹیٹ گاؤں، آبادی والا اور گنے کے کھیتوں کے ساتھ چینی اور فینیڈ پیدا کرتا ہے۔ ترفا کے ساتھ مصنف نے اسے مصر کی آباد جاگیروں میں شمار کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 131}"
