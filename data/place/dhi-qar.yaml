summary:
  ar: "موضع قرب الكوفة اتخذه علي مجتمعاً لجنده حين استنفر أهل الكوفة سنة 36هـ، وفيه خطب القعقاع بن عمرو ثم انضم الكوفيون والبصريون إليه {cite:sallabi-ali-vol2 p. 47}."
  en: "A place near Kufa where Ali gathered his army in 36 AH after calling the Kufans out; al-Qa'qa' spoke there, and Kufan and Basran volunteers joined him {cite:sallabi-ali-vol2 p. 48}."
  es: "Un lugar cerca de Kufa donde Ali reunió a su ejército en el año 36 de la Hégira después de llamar a los kufanos; allí habló al-Qa'qa', y voluntarios kufanos y basranos se unieron a él {cite:sallabi-ali-vol2 p. 48}."
  fr: "Un lieu près de Kufa où Ali a rassemblé son armée en 36 AH après avoir appelé les Kufans; al-Qa'qa' y a pris la parole, et des volontaires de Kufa et de Basran l'ont rejoint {cite:sallabi-ali-vol2 p. 48}."
  ur: "کوفہ کے قریب ایک جگہ جہاں علی نے 36 ہجری میں کوفوں کو بلانے کے بعد اپنی فوج جمع کی تھی۔ قعقاع نے وہاں خطاب کیا اور کوفان اور بصران کے رضاکار اس کے ساتھ شامل ہوئے۔ 48}۔"
  tr: "Ali'nin 36 Hicri'de Kufe halkını seferber ederken askerlerinin toplandığı Kufa yakınlarındaki bir yerdi. El-Ka'ka bin Amr'in vaazlar verdiği yer, ardından Kufan ve Beşranlılar ona katıldı {cite:sallabi-ali-cilt 2 s. 47}."
  id: "Sebuah tempat dekat Kufa yang diambil Ali sebagai tempat berkumpul bagi para prajuritnya ketika ia menggerakkan rakyat Kufa pada tahun 36 H. Di sanalah al-Qa'qa' ibn Amr menyampaikan khotbah, lalu Kufan dan Basrani bergabung dengannya {cite:sallabi-ali-vol2 hlm. 47}."
