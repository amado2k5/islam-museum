label: { ar: "جبل اللكام", en: "Jabal al-Lakkam", es: "Jabal al-Lakkam", fr: "Jabal al-Lakkam", ur: "جبل لکم", tr: "Cebel el-Lakam", id: "Jabal al-Lakam" }
summary:
  ar: "جبل يبتدئ من بحر القلزم، فيمتد إلى نواحي الشام، ويسمى هناك جبل بني اللكام، وينتهي إلى حمص وينعطف حتى مرعش وشمشاط. {cite:nuzhat-al-mushtaq-2002 p. 353}"
  en: "A range that begins at the Red Sea and runs into the lands of Syria, called Jabal al-Lakkam there; it reaches toward Homs and bends by Mar'ash and Shamshat. {cite:nuzhat-al-mushtaq-2002 p. 353}"
  es: "Una cordillera que comienza en el Mar Rojo y se adentra en las tierras de Siria, donde se llama Jabal al-Lakkam; se extiende hacia Homs y se curva pasando por Mar'ash y Shamshat. {cite:nuzhat-al-mushtaq-2002 p. 353}"
  fr: "Une chaîne de montagnes qui commence à la mer Rouge et s'étend jusqu'aux terres de Syrie, appelées Jabal al-Lakkam dans cette région; elle se dirige vers Homs et forme une courbe près de Mar'ash et Shamshat. {cite:nuzhat-al-mushtaq-2002 p. 353}"
  ur: "ایک سلسلہ جو بحیرہ احمر سے شروع ہوتا ہے اور شام کی سرزمین تک جاتا ہے، وہاں جبل لکم کہلاتا ہے۔ یہ حمص تک پہنچتا ہے اور مرش اور شمشات سے موڑتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 353}"
  tr: "Qilazm Denizi'nden başlayıp Levant bölgelerine kadar uzanan, Bani al-Lakam Dağı olarak adlandırılan, Homs'ta sona eren ve Maraş ile Şashat'a dönen bir dağ. {kaynak:nuzhat-al-mushtaq-2002 s. 353}"
  id: "Sebuah gunung yang bermula dari Laut Qilazm, membentang hingga ke wilayah Levant, disebut Gunung Bani al-Lakam, berakhir di Homs, dan berbelok ke Marash dan Shashat. {cite:nuzhat-al-mushtaq-2002 hlm. 353}"
