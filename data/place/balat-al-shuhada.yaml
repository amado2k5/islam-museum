  ur: "فرانسیا میں 'شہداء کاز وے' - پوٹیئرز - جہاں الغفیقی کی فوج کو رمضان 114 میں تباہ کر دیا گیا تھا۔ جنگ کا نام اس جگہ سے پڑا۔ 272}۔"
