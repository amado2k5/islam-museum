  id: "Sebuah tempat di tanah bangsa Franka di mana pasukan Abd al-Rahman ibn Abdullah al-Ghafiqi, Emir al-Andalus, terluka pada Ramadan tahun seratus empat belas, dan di sanalah pertempuran tersebut dikenal {cite:nafh-tib-maqqari, hlm. 272}."
