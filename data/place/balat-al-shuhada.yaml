  ar: "موضع في أرض الإفرنجة أصيب عندها عسكر عبد الرحمن بن عبد الله الغافقي أمير الأندلس في رمضان سنة أربع عشرة ومائة وبه عرفت الغزوة {cite:nafh-tib-maqqari p. 272}."
