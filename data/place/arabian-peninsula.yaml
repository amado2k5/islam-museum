summary:
  ar: "جزيرة العرب: الإقليم الذي تحيط به البحار والأنهار من أطرافه، وقسّمه العرب إلى تهامة والحجاز ونجد والعروض واليمن، كما يعرضه ياقوت الحموي في معجم البلدان. {cite:mujam-al-buldan-sader-1995 2 p.137}"
  en: "The Arabian Peninsula (Jazirat al-Arab): the land ringed by seas and rivers that the Arabs divided into Tihama, Hijaz, Najd, al-Arud and Yemen, as Yaqut presents it in the Mu'jam al-Buldan. {cite:mujam-al-buldan-sader-1995 2 p.137}"
  es: "La península arábiga (Jazirat al-Arab): la tierra rodeada de mares y ríos que los árabes dividieron en Tihama, Hiyaz, Najd, al-Arud y Yemen, tal como la presenta Yaqut en el Mu'jam al-Buldan. {cite:mujam-al-buldan-sader-1995 2 p.137}"
  fr: "La péninsule arabique (Jazirat al-Arab): la région entourée de mers et de fleuves que les Arabes divisèrent en Tihama, Hedjaz, Najd, al-Arud et Yémen, telle que Yaqut la présente dans le Mu'jam al-Buldan. {cite:mujam-al-buldan-sader-1995 2 p.137}"
  ur: "جزیرہ نما عرب ⁦(جزیرات العرب)⁩: وہ سرزمین جو سمندروں اور دریاؤں سے گھلتی ہے جسے عربوں نے تہامہ، حجاز، نجد، العرود اور یمن میں تقسیم کیا، جیسا کہ یاقوت اسے معجم البلدان میں پیش کرتا ہے۔ {حوالہ: معجم البلدان الصدر 1995 2 صفحہ 137}"
