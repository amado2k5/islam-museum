summary:
  ar: "وادٍ ذو قرى شمال المدينة على طريق الشام؛ غزا زيد بن حارثة فيه بني فزارة مرتين، في الأولى أُصيب وأصحابه وفي الثانية قتلهم وقُتلت أم قرفة؛ ويذكر المسعودي أن بعضهم جعل منصرف النبي من خيبر إلى وادي القرى غزوة أخرى."
  en: "A valley of villages north of Medina on the Syrian road; Zayd ibn Haritha fought Banu Fazara there twice, wounded in the first and victorious in the second when Umm Qirfa was killed; al-Mas'udi notes that some counted the Prophet's return from Khaybar through Wadi al-Qura as a separate expedition."
