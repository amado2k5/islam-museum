label: { ar: "وادي القرى", en: "Wadi al-Qura", es: "Wadi al-Qura", fr: "Wadi al-Qura", ur: "وادی القراء", tr: "Wadi Al-Qura", id: "Wadi Al-Qura" }
summary:
  ar: "وادٍ ذو قرى شمال المدينة على طريق الشام؛ غزا زيد بن حارثة فيه بني فزارة مرتين، في الأولى أُصيب وأصحابه وفي الثانية قتلهم وقُتلت أم قرفة؛ ويذكر المسعودي أن بعضهم جعل منصرف النبي من خيبر إلى وادي القرى غزوة أخرى."
  en: "A valley of villages north of Medina on the Syrian road; Zayd ibn Haritha fought Banu Fazara there twice, wounded in the first and victorious in the second when Umm Qirfa was killed; al-Mas'udi notes that some counted the Prophet's return from Khaybar through Wadi al-Qura as a separate expedition."
  es: "Un valle de aldeas al norte de Medina, en la ruta siria; Zayd ibn Haritha luchó allí dos veces contra Banu Fazara, resultando herido en la primera y victorioso en la segunda, cuando Umm Qirfa fue asesinado; al-Mas'udi señala que algunos consideraban el regreso del Profeta desde Khaybar a través de Wadi al-Qura como una expedición separada."
  fr: "Une vallée de villages au nord de Médine, sur la route syrienne; Zayd ibn Haritha y a combattu les Banu Fazara à deux reprises, blessé lors de la première bataille et victorieux lors de la seconde où Umm Qirfa a été tuée; al-Mas'udi note que certains ont considéré le retour du Prophète de Khaybar à travers Wadi al-Qura comme une expédition distincte."
  ur: "شام کی سڑک پر مدینہ کے شمال میں دیہات کی ایک وادی؛ زید بن حارثہ نے وہاں بنو فزارہ سے دو بار جنگ کی، پہلی میں زخمی ہوئے اور دوسری میں فتح حاصل کی جب ام قرفہ شہید ہو گئیں۔ المسعودی نوٹ کرتے ہیں کہ کچھ لوگوں نے نبی کی خیبر سے وادی القریٰ کے راستے واپسی کو ایک الگ مہم کے طور پر شمار کیا۔"
  tr: "Şehrin kuzeyinde Levant yolu üzerindeki köylerin bulunduğu bir vadi; Zayd ibn Haritha, Banu Fazara'ya iki kez saldırdı; ilkinde yoldaşlarıyla birlikte yaralandı, ikinci seferinde ise onları ve ümmü Karfa'yı öldürdü. El-Mes'udi, bazılarının Peygamber'in Haybar'dan Vadi el-Kura'ya ayrılışını başka bir savaş haline getirdiğini belirtir."
  id: "Sebuah lembah dengan desa-desa di utara kota di jalan Levant; Zayd ibn Haritha menyerang Banu Fazara dua kali, pertama ia terluka bersama para sahabatnya, dan pada kali kedua ia membunuh mereka dan um Qarfa. Al-Mas'udi menyebutkan bahwa beberapa dari mereka menjadikan keberangkatan Nabi dari Khaybar ke Wadi al-Qura sebagai pertempuran lain."
