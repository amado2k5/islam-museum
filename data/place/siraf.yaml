summary:
  ar: "سيراف بلد بساحل فارس؛ في رواية أن حصنه المسمى سوريانج هو الذي كتب عبد مسلم لأهله أماناً ورمى به إليهم في سهم فأمر عمر بإنفاذه ويقال إنه شهرياج."
  en: "Siraf on Fars's coast; in one telling its Surayanj fort is where the Muslim slave's arrow-aman was written, which Umar ordered honored — others call it Shahrij."
  es: "Siraf, en la costa de Fars; según una versión, en su fuerte de Surayanj se escribió el aman de la flecha del esclavo musulmán, que Umar ordenó honrar; otros lo llaman Shahrij."
  fr: "Siraf sur la côte de Fars; selon une version, c'est dans son fort de Surayanj que fut écrite la flèche-aman de l'esclave musulman, qu'Umar ordonna d'honorer — d'autres l'appellent Shahrij."
  ur: "فارس کے ساحل پر سیاف؛ ایک میں اس کا سورینج قلعہ بتایا گیا ہے جہاں مسلمان غلام کا تیر امان لکھا گیا تھا، جسے عمر نے عزت دینے کا حکم دیا تھا - دوسرے اسے شہریج کہتے ہیں۔"
  tr: "Siraf, İran kıyısında bir kasabadır; bir anlatıma göre, Suryang adlı kalesi, Müslüman kölesi ailesi için bir güvenlik mektubu yazıp okla onlara fırlattığı yerdir; bu yüzden Ömer onun idamını emretmiş, bunun Shahriaj olduğu söylenir."
  id: "Siraf adalah sebuah kota di pesisir Persia; menurut sebuah cerita, bentengnya yang disebut Suryang adalah benteng yang budak Muslimnya menulis surat perlindungan untuk keluarganya dan melemparkannya dengan panah, sehingga Umar memerintahkan eksekusinya, dan dikatakan bahwa itu adalah Shahriaj."
