summary:
  ar: "مدينة حوران؛ أول ما فُتح من حواضر الشام صلحاً — صالح أهلها على الأمان على دمائهم وأموالهم وأولادهم بأداء الجزية، وقيل عن كل حالم دينار وجريب حنطة — ففُتحت على يد خالد بن الوليد ⁦(وقيل يزيد بن أبي سفيان لأنها من ولايته إذ كانت من دمشق)⁩ سنة 13هـ تقريباً، وافتُتحت معها جميع أرض كورة حوران."
  en: "The city of Hawran; the first of Syria's towns taken by treaty — its people compounding for safety of lives, wealth and children on paying the jizya, some say a dinar and a jarib of wheat per adult — conquered under Khalid ibn al-Walid (some say Yazid ibn Abi Sufyan, its governorship being his as it belonged to Dimashq) about 13 AH, all the land of the Hawran district opening with it."
  es: "La ciudad de Hawran, la primera de las ciudades de Siria tomada por tratado —sus habitantes se comprometieron a garantizar la seguridad de sus vidas, sus bienes y sus hijos mediante el pago de la jizya, según algunos, un dinar y un jarib de trigo por adulto—, fue conquistada bajo el mando de Khalid ibn al-Walid (algunos dicen que Yazid ibn Abi Sufyan, ya que la gobernación le pertenecía a Dimashq) alrededor del año 13 de la Hégira, abarcando todo el territorio del distrito de Hawran."
  fr: "La ville de Hawran; la première des villes de Syrie à être prise par traité — ses habitants s'engageant à payer la jizya pour la sécurité de leurs vies, de leurs biens et de leurs enfants, certains disent un dinar et un jarib de blé par adulte — conquise sous Khalid ibn al-Walid (certains disent Yazid ibn Abi Sufyan, son gouvernement étant le sien car elle appartenait à Dimashq) vers 13 AH, tout le territoire du district de Hawran s'ouvrant avec elle."
