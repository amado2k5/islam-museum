summary:
  ar: "مدينة حوران؛ أول ما فُتح من حواضر الشام صلحاً — صالح أهلها على الأمان على دمائهم وأموالهم وأولادهم بأداء الجزية، وقيل عن كل حالم دينار وجريب حنطة — ففُتحت على يد خالد بن الوليد (وقيل يزيد بن أبي سفيان لأنها من ولايته إذ كانت من دمشق) سنة 13هـ تقريباً، وافتُتحت معها جميع أرض كورة حوران."
  en: "The city of Hawran; the first of Syria's towns taken by treaty — its people compounding for safety of lives, wealth and children on paying the jizya, some say a dinar and a jarib of wheat per adult — conquered under Khalid ibn al-Walid (some say Yazid ibn Abi Sufyan, its governorship being his as it belonged to Dimashq) about 13 AH, all the land of the Hawran district opening with it."
