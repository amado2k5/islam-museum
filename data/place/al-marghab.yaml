summary:
  ar: "المرغاب موضع بالبصرة حفر بشير بن عبيد الله بن أبي بكرة فيه المرغاب والسواقي والمعترضات بالتغلب وسماه مرغاب مرو وكان في قطيعة هلال بن أحوز المازني ذات ثمانية آلاف جريب."
  en: "al-Marghab at Basra — Bashir ibn Ubaydallah ibn Abi Bakra dug its canals by force within Hilal ibn Ahwaz's eight-thousand-jarib grant and named it Marghab Marw."
  es: "al-Marghab en Basora: Bashir ibn Ubaydallah ibn Abi Bakra cavó sus canales por la fuerza dentro de la concesión de ocho mil jarib de Hilal ibn Ahwaz y lo llamó Marghab Marw."
  fr: "al-Marghab à Bassorah — Bashir ibn Ubaydallah ibn Abi Bakra a creusé ses canaux de force dans le cadre de la concession de huit mille jarib de Hilal ibn Ahwaz et l'a nommé Marghab Marw."
  ur: "بصرہ میں المرگب - بشیر بن عبیداللہ ابن ابی بکرہ نے ہلال ابن احواز کی آٹھ ہزار جریب گرانٹ میں زبردستی اس کی نہریں کھودیں اور اس کا نام مرغاب مرو رکھا۔"
  tr: "Al-Murghab, Basra'da Beşir bin Ubeydallah bin Ebi Bekra'nın Marghab'ı, su kanallarını ve vadinin nesnelerini kazdığı ve buraya Merk adını verdiği bir yerdir. Hilal bin Ahwaz al-Mazini bölgesindeydi ve sekiz bin ceribi kapsıyordu."
  id: "Al-Murghab adalah sebuah tempat di Basra di mana Bashir bin Ubayd Allah bin Abi Bakrah menggali Marghab, kanal air, dan benda-benda lembah, dan ia menamainya Marw. Tempat ini berada di daerah Hilal bin Ahwaz al-Mazi, mencakup delapan ribu jerib."
