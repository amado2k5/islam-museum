label: { ar: "السرير", en: "Al-Sarir", es: "Al-Sarir", fr: "Al-Sarir", ur: "السریر" }
summary:
  ar: "السرير أرض بأعالي القوقاز ملكها يُلقّب صاحب السرير؛ دخلها مروان بن محمد فأوقع بأهلها وفتح قلاعاً فيها ودان له ملكها وأطاعه فصالحه على ألف رأس — خمسمائة غلام وخمسمائة جارية سود الشعور والحواجب وهدب الأشفار في كل سنة — وعلى مائة ألف مدي يُصبّ في إهراء الباب وأُخذ منه الرهن."
  en: "Al-Sarir, a land of the upper Caucasus whose king bears the title Sahib al-Sarir; Marwan ibn Muhammad entered it, fell upon its people and took castles, till its king submitted and obeyed — compounding for a thousand heads yearly, five hundred lads and five hundred girls black of hair, brow and lash, plus a hundred thousand mudd poured into Bab's granaries, with hostages taken of him."
  es: "Al-Sarir, una tierra del alto Cáucaso cuyo rey ostenta el título de Sahib al-Sarir; Marwan ibn Muhammad entró en ella, atacó a su gente y tomó castillos, hasta que su rey se sometió y obedeció, exigiendo anualmente mil cabezas, quinientos muchachos y quinientas muchachas de cabello, cejas y pestañas negras, además de cien mil mudd vertidos en los graneros de Bab, con rehenes tomados de él."
  fr: "Al-Sarir, une terre du Haut-Caucase dont le roi porte le titre de Sahib al-Sarir; Marwan ibn Muhammad y entra, attaqua son peuple et prit des châteaux, jusqu'à ce que son roi se soumette et obéisse — exigeant mille têtes par an, cinq cents garçons et cinq cents filles aux cheveux, sourcils et cils noirs, plus cent mille boues déversées dans les greniers de Bab, avec des otages pris de lui."
  ur: "السریر، بالائی قفقاز کی ایک سرزمین جس کا بادشاہ صاحب السریر کا لقب رکھتا ہے۔ مروان بن محمد اس میں داخل ہوا، اس کے لوگوں پر چڑھ دوڑا اور قلعے لے لیے، یہاں تک کہ اس کے بادشاہ نے فرمانبرداری کی اور ایک ہزار سروں کے حساب سے سالانہ، پانچ سو لڑکوں اور پانچ سو لڑکیوں کے بال کالے، پیشانی اور کوڑے، اس کے علاوہ ایک لاکھ مٹی باب کے اناج میں ڈالی، اس کے ساتھ یرغمال بنائے گئے۔"
