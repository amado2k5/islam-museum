id: place/wadi-al-rukkad
class: place
kind: site
label: { ar: "وادي الرقاد", en: "Wadi al-Rukkad", ur: "وادیٔ رقاد" }
summary:
  ar: "وادٍ في منطقة اليرموك والجولان، قامت على جسر فيه أهمية حاسمة في معركة اليرموك. تذكر دائرة المعارف الإسلامية أن البيزنطيين انسحبوا إلى أرض بين وادي الرقاد ووادي العلان غرب وادي الحرير، وأن خالد بن الوليد استولى في غارة ليلية على الجسر فوق وادي الرقاد، وهو طريق الانسحاب الوحيد الممكن، فحوصر الروم {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  en: "A wadi in the Yarmuk and Jawlan region whose bridge proved decisive in the battle of the Yarmuk. The Encyclopaedia of Islam says the Byzantines withdrew to ground between the Wadi al-Rukkad and the Wadi al-Allan, west of the Wadi al-Harir, and that Khalid ibn al-Walid seized the bridge over the Wadi al-Rukkad in a night raid, cutting off the only viable line of retreat {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}."
  ur: "یرموک اور جولان کے علاقے کی ایک وادی جس کا پل جنگِ یرموک میں فیصلہ کن ثابت ہوا۔ اسلامی دائرۃ المعارف کے مطابق بازنطینی وادیٔ رقاد اور وادیٔ علان کے درمیان، وادیٔ حریر کے مغرب میں، ایک زمین میں ہٹ گئے، اور خالد بن الولید نے رات کے حملے میں وادیٔ رقاد کا پل چھین لیا جو پسپائی کا واحد قابلِ عمل راستہ تھا {cite:encyclopaedia-of-islam-2 vol. 11 p. 302}۔"
