summary:
  ar: "واد بين منى ومزدلفة؛ يذكر الأزرقي أن المسافة من جمرة العقبة إلى وادي محسر سبعة آلاف ومائتا ذراع ⁦(ص 789)⁩، وأن ابن عباس قال: ارفعوا عن محسر، أي لا تنزلوا محسراً لا تبلغوه، وأن محسراً ينتهي إليه القرن الذي يلي حائطه ⁦(ص 802)⁩."
  en: "A valley between Mina and Muzdalifa. Al-Azraqi reports that the distance from the Jamrat al-Aqaba to Wadi Muhassir is seven thousand two hundred cubits (p. 789); that Ibn Abbas said, 'Move on from Muhassir', meaning do not stop at Muhassir, which you do not reach; and that the qarn beside its wall ends at Muhassir (p. 802)."
  es: "Un valle entre Mina y Muzdalifa. Al-Azraqi informa que la distancia desde Jamrat al-Aqaba hasta Wadi Muhassir es de siete mil doscientos codos (pág. 789); que Ibn Abbas dijo: «Sigue adelante desde Muhassir», lo que significa que no te detengas en Muhassir, adonde no llegas; y que el qarn junto a su muro termina en Muhassir (pág. 802)."
  fr: "Une vallée entre Mina et Muzdalifa. Al-Azraqi rapporte que la distance entre Jamrat al-Aqaba et Wadi Muhassir est de sept mille deux cents coudées (p. 789); qu'Ibn Abbas a dit: « Départ de Muhassir », c'est-à-dire ne vous arrêtez pas à Muhassir, que vous n'atteindrez pas; et que le qarn près de son mur se termine à Muhassir (p. 802)."
  ur: "منیٰ اور مزدلفہ کے درمیان ایک وادی۔ الازراقی نے رپورٹ کیا ہے کہ جمرات العقبہ سے وادی محسیر تک کا فاصلہ سات ہزار دو سو ہاتھ ہے ⁦(ص 789)⁩؛ ابن عباس نے کہا کہ محسیر سے آگے بڑھو، یعنی محسر پر نہ رکو جس تک تم نہیں پہنچ سکتے۔ اور یہ کہ اس کی دیوار کے ساتھ قرن محسیر پر ختم ہوتا ہے ⁦(ص 802)⁩۔"
