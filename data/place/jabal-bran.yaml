label: { ar: "جبل بران", en: "Jabal Bran", es: "Jabal Bran", fr: "Jabal Bran", ur: "جبل بران", tr: "Bran Dağı", id: "Gunung Bran" }
summary:
  ar: "جبل يمر من الجنوب إلى الشمال حتى يقارب مدينة أسيوط؛ ويذكر المؤلف أن الناس يتحدثون عن كنوز فيه وأن الطلب عليها متصل إلى زمنه. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A mountain running north-south nearly to Asyut; the author says people speak of treasure hidden in it and that searches continued up to his time. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  es: "Una montaña que se extiende de norte a sur casi hasta Asyut; el autor dice que se habla de tesoros escondidos en ella y que las búsquedas continuaron hasta su época. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  fr: "Une montagne orientée nord-sud, presque jusqu'à Assiout; l'auteur rapporte que des gens parlaient d'un trésor caché en son sein et que les recherches se sont poursuivies jusqu'à son époque. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  ur: "ایک پہاڑ جو شمال سے جنوب میں آسیوت کی طرف چل رہا ہے۔ مصنف کا کہنا ہے کہ لوگ اس میں چھپے خزانے کی بات کرتے ہیں اور اس کی تلاش اس کے وقت تک جاری رہی۔ {حوالہ: نزہت المشتاق-2002 ص۔ 129}"
  tr: "Güneyden kuzeye doğru uzanan bir dağ Assiut şehrine yaklaşır; yazar, orada insanların hazinelerden bahsettiğini ve talebin zamanına kadar devam ettiğini belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 129}"
  id: "Sebuah gunung membentang dari selatan ke utara hingga mendekati kota Assiut; penulis menyebutkan bahwa orang-orang berbicara tentang harta karun di sana dan permintaan akan harta karun terus berlanjut hingga zamannya. {cite:nuzhat-al-mushtaq-2002 hlm. 129}"
