  ar: "جبل يمر من الجنوب إلى الشمال حتى يقارب مدينة أسيوط؛ ويذكر المؤلف أن الناس يتحدثون عن كنوز فيه وأن الطلب عليها متصل إلى زمنه. {cite:nuzhat-al-mushtaq-2002 p. 129}"
