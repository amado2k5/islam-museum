summary:
  ar: "مدينتان على نهر شوران، والمدينة الجنوبية منهما كثيرة الزراعات والأشجار، وعندهم خشب كثير يجلب إليهم من الجبال، ويذكر المؤلف أن بينها وبين دادمي خمسة أيام {cite:nuzhat-al-mushtaq-2002 p. 930} {cite:nuzhat-al-mushtaq-2002 p. 931}."
  en: "Two towns on the river Shūrān; the southern one has many fields and trees and receives timber from the mountains, and the author gives five days from Dādmī {cite:nuzhat-al-mushtaq-2002 p. 930} {cite:nuzhat-al-mushtaq-2002 p. 931}."
  es: "Dos pueblos en el río Shūrān; el del sur tiene muchos campos y árboles y recibe madera de las montañas, y el autor da cinco días desde Dādmī {cite:nuzhat-al-mushtaq-2002 p. 930} {cite:nuzhat-al-mushtaq-2002 p. 931}."
  fr: "Deux villes sur la rivière Shūrān; celle du sud a de nombreux champs et arbres et reçoit du bois des montagnes, et l'auteur donne cinq jours depuis Dādmī {cite:nuzhat-al-mushtaq-2002 p. 930} {cite:nuzhat-al-mushtaq-2002 p. 931}."
  ur: "دریائے شوران پر دو قصبے؛ جنوبی میں بہت سے کھیت اور درخت ہیں اور پہاڑوں سے لکڑی حاصل کرتے ہیں، اور مصنف نے دادمی سے پانچ دن بتائے ہیں۔ 930} {حوالہ: نزہت المشتاق-2002 ص۔ 931}۔"
  tr: "Şuran Nehri üzerinde iki şehir vardır ve güney şehri ürün ve ağaç açısından boldur, ayrıca dağlardan getirilen bol odun vardır. Yazar, aralarında Dadmi ile beş gün olduğunu belirtir {atıf:Nuzhat-al-Mushtaq-2002, s. 930} {cite:Nuzhat-al-Mushtaq-2002, s. 931}."
  id: "Dua kota di Sungai Shura, dan kota selatannya kaya akan tanaman dan pohon, serta banyak kayu yang dibawa dari pegunungan. Penulis menyebutkan bahwa ada lima hari antara mereka dan Dadmi {cite:Nuzhat-al-Mushtaq-2002, hlm. 930} {cite:Nuzhat-al-Mushtaq-2002, hlm. 931}."
