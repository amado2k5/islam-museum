  ar: "مدينتان على نهر شوران، والمدينة الجنوبية منهما كثيرة الزراعات والأشجار، وعندهم خشب كثير يجلب إليهم من الجبال، ويذكر المؤلف أن بينها وبين دادمي خمسة أيام {cite:nuzhat-al-mushtaq-2002 p. 930} {cite:nuzhat-al-mushtaq-2002 p. 931}."
