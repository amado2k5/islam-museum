label: { ar: "الجامع الأزهر", en: "al-Azhar Mosque", es: "Mezquita de Al-Azhar", fr: "Mosquée al-Azhar", ur: "مسجد الازہر", tr: "El-Ezher Camii", id: "Masjid Al-Azhar" }
summary:
  ar: "الجامع الأزهر بالقاهرة، شرع العبيديون في بنائه في ربيع الآخر سنة تسع وخمسين وفرغ في رمضان سنة إحدى وستين {cite:tarikh-khulafa-minhaj-1434 p. 621}. وذكر محيي الدين عفيفي أحمد في كلمته أمام مجلس الأمن أن عدد الدارسين في الأزهر نحو أربعين ألف طالب وطالبة من نحو مائة وثلاثين دولة {cite:nazarat-mawdu-iyya-azhar p. 100}، وهو رقم من سنة الكلمة ويحتاج إلى مصدر ثانٍ قبل الاستعمال."
  en: "Cairo's al-Azhar mosque, begun by the Ubaydids in Rabi' II 359 and finished in Ramadan 361 {cite:tarikh-khulafa-minhaj-1434 p. 621}. In his 2016 statement to the UN Security Council, Muhyi al-Din Afifi Ahmad gives about 40,000 students from about 130 countries (p. 100); the figure needs a second source."
  es: "La mezquita de al-Azhar de El Cairo, iniciada por los Ubaydids en Rabi' II 359 y terminada en Ramadán 361 {cite:tarikh-khulafa-minhaj-1434 p. 621}. En su declaración de 2016 ante el Consejo de Seguridad de la ONU, Muhyi al-Din Afifi Ahmad menciona unos 40.000 estudiantes de unos 130 países (p. 100); esta cifra necesita una segunda fuente."
  fr: "La mosquée al-Azhar du Caire, dont la construction a été commencée par les Ubaydides en Rabi' II 359 et achevée en Ramadan 361 {cite:tarikh-khulafa-minhaj-1434 p. 621}. Dans sa déclaration de 2016 au Conseil de sécurité de l'ONU, Muhyi al-Din Afifi Ahmad mentionne environ 40 000 étudiants originaires de quelque 130 pays (p. 100); ce chiffre nécessite une autre source."
  ur: "قاہرہ کی مسجد الازہر، عبیدیوں نے ربیع الثانی 359 میں شروع کی اور رمضان 361 میں ختم ہوئی۔ 621}۔ اقوام متحدہ کی سلامتی کونسل کے سامنے اپنے 2016 کے بیان میں، محی الدین عفیفی احمد نے تقریباً 130 ممالک کے تقریباً 40,000 طلباء ⁦(ص 100)⁩; اعداد و شمار کو دوسرا ذریعہ درکار ہے۔"
