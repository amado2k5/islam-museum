id: place/al-azhar
education:
  did_you_know:
    ar: "شرع العبيديون في بناء الجامع الأزهر بالقاهرة سنة ٣٥٩هـ وفرغ سنة ٣٦١هـ، وصار من أقدم مؤسسات العلم في العالم الإسلامي."
    en: "The Ubaydi (Fatimid) builders began Cairo's al-Azhar mosque in 359 AH and finished in 361; it grew into one of the Islamic world's oldest seats of learning."
    ur: "عبیدی ⁦(فاطمی)⁩ بانیوں نے قاہرہ کی جامع الازہر کی تعمیر 359ھ میں شروع کی اور 361ھ میں مکمل کی، اور یہ اسلامی دنیا کے قدیم ترین علمی مراکز میں سے ایک بنا۔"
    sources: [source/tarikh-khulafa-minhaj-1434, source/nazarat-mawdu-iyya-azhar]
