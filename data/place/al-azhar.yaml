summary:
  ar: "الجامع الأزهر بالقاهرة، شرع العبيديون في بنائه في ربيع الآخر سنة تسع وخمسين وفرغ في رمضان سنة إحدى وستين {cite:tarikh-khulafa-minhaj-1434 p. 621}. وذكر محيي الدين عفيفي أحمد في كلمته أمام مجلس الأمن أن عدد الدارسين في الأزهر نحو أربعين ألف طالب وطالبة من نحو مائة وثلاثين دولة {cite:nazarat-mawdu-iyya-azhar p. 100}، وهو رقم من سنة الكلمة ويحتاج إلى مصدر ثانٍ قبل الاستعمال."
  en: "Cairo's al-Azhar mosque, begun by the Ubaydids in Rabi' II 359 and finished in Ramadan 361 {cite:tarikh-khulafa-minhaj-1434 p. 621}. In his 2016 statement to the UN Security Council, Muhyi al-Din Afifi Ahmad gives about 40,000 students from about 130 countries (p. 100); the figure needs a second source."
