label: { ar: "المقبرة الشرقية ⁦(صحراء المماليك)⁩ بالقاهرة", en: "Eastern Cemetery (Northern Cemetery) of Cairo", ur: "قاہرہ کا مشرقی قبرستان", es: "Cementerio Oriental (Cementerio del Norte) de El Cairo", fr: "Cimetière oriental (cimetière nord) du Caire" }
summary:
  ar: "جبانة القاهرة الشرقية التي عمّرها السلاطين والأمراء الجراكسة بالخوانق والقباب منذ خانقاه فرج بن برقوق ⁦(1400-1411م)⁩، ويرى يومانز أنها لم تكن «مدينة للموتى» بل حياً عامراً بالطلبة والصوفية والزوار {cite:yeomans-islamic-cairo-2006 p.202} {cite:yeomans-islamic-cairo-2006 p.213}."
  en: "Cairo's eastern necropolis, built up by Burji sultans and amirs with khanqahs and mausolea from Faraj ibn Barquq's khanqah (1400-1411) onwards; Yeomans holds it was never a 'city of the dead' but a living quarter of students, Sufis and visitors {cite:yeomans-islamic-cairo-2006 p.202} {cite:yeomans-islamic-cairo-2006 p.213}."
  es: "La necrópolis oriental de El Cairo, construida por sultanes y emires Burji con khanqahs y mausoleos desde la khanqah de Faraj ibn Barquq (1400-1411) en adelante; Yeomans sostiene que nunca fue una \"ciudad de los muertos\", sino un barrio residencial de estudiantes, sufíes y visitantes {cite:yeomans-islamic-cairo-2006 p.202} {cite:yeomans-islamic-cairo-2006 p.213}."
  fr: "La nécropole orientale du Caire, construite par les sultans et émirs burjis avec des khanqahs et des mausolées à partir de la khanqah de Faraj ibn Barquq (1400-1411); Yeomans soutient qu'elle n'a jamais été une « ville des morts » mais un quartier vivant d'étudiants, de soufis et de visiteurs {cite:yeomans-islamic-cairo-2006 p.202} {cite:yeomans-islamic-cairo-2006 p.213}."
  ur: "قاہرہ کا مشرقی مقبرہ جسے برجی سلطانوں اور امیروں نے فرج ابن برق کی خانقاہ (1400-1411) کے بعد خانقاہوں اور مزاروں کے ساتھ تعمیر کیا تھا۔ یومانز کا خیال ہے کہ یہ کبھی بھی 'مردوں کا شہر' نہیں تھا بلکہ طلباء، صوفیاء اور زائرین کا ایک زندہ حصہ تھا {حوالہ: yeomans-islamic-cairo-2006 p.202}"
