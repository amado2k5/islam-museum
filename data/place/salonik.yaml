summary:
  ar: "مدينة كبيرة عامرة كثيرة العمارة براً وبحراً، على طرف خليج صغير، ومن صلونيك إلى رنذينة خمسة وعشرون ميلاً، ويصفها الإدريسي بأن أسواقها معمورة. {cite:nuzhat-al-mushtaq-2002 p. 800}"
  en: "A large city, populous on land and sea, on a small gulf; twenty-five miles to Randhina, with busy markets, in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 800}"
  es: "Una gran ciudad, populosa tanto por tierra como por mar, situada en un pequeño golfo; a veinticinco millas de Randhina, con mercados bulliciosos, según la descripción de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 800}"
  fr: "Une grande ville, peuplée sur terre et sur mer, située sur un petit golfe; à vingt-cinq milles de Randhina, avec des marchés animés, selon le récit d’al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 800}"
  ur: "ایک بڑا شہر، زمین اور سمندر پر آبادی، ایک چھوٹی خلیج پر؛ رندھینا سے پچیس میل، مصروف بازاروں کے ساتھ، الادریسی کے کھاتے میں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 800}"
  tr: "Selanik'ten Randhina'ya kadar küçük bir koyun kenarında, hem kara hem deniz yoluyla birçok binaya sahip büyük, zengin bir şehir yirmi beş mil uzaklıktadır. Al-Idrisi, burayı zengin pazarlara sahip olarak tanımlar. {cite:nuzhat-al-mushtaq-2002 s. 800}"
  id: "Sebuah kota besar dan makmur dengan banyak bangunan, baik di darat maupun laut, di tepi teluk kecil, dari Salonik ke Randhina berjarak dua puluh lima mil. Al-Idrisi menggambarkannya memiliki pasar yang makmur. {cite:nuzhat-al-mushtaq-2002 hlm. 800}"
