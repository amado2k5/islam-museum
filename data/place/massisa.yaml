  id: "Al-Masisa adalah sebuah kota di Kilikia di Sungai Jayhan. Ahli geografi Arab menganggapnya bagian dari perbatasan Levant, kota ini dibangun kembali oleh Abbasiyah, dan dihancurkan oleh gempa bumi pada tahun 1114 M, menurut William dari Tyre. {sitasi: Farghani-Elements-Astronomy hlm. 529}"
