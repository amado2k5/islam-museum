label: { ar: "السوس الأدنى", en: "Sus al-Adna", es: "Sus al-Adna", fr: "Sus al-Adna", ur: "سوس العدنا" }
summary:
  ar: "السوس الأدنى إقليم خلف طنجة وبينه وبين السوس الأقصى نيف وعشرون يوماً؛ جوّل فيه عقبة بن نافع في ولايته الثانية للمغرب لا يعرض له أحد ولا يقاتله، وانتهت خيل موسى بن نصير إليه فوطن أهله وسبى منهم."
  en: "Sus al-Adna, the province beyond Tangier — some twenty-odd days short of Sus al-Aqsa; Uqba ibn Nafi' roamed it in his second Maghreb charge with none confronting or fighting him, and Musa ibn Nusayr's cavalry reached it, settling its people and taking captives."
  es: "Sus al-Adna, la provincia más allá de Tánger, a unos veinte días de Sus al-Aqsa; Uqba ibn Nafi' la recorrió en su segunda incursión en el Magreb sin que nadie le hiciera frente ni luchara contra él, y la caballería de Musa ibn Nusayr llegó hasta allí, asentando a su gente y tomando prisioneros."
  fr: "Sus al-Adna, la province au-delà de Tanger — à une vingtaine de jours de Sus al-Aqsa; Uqba ibn Nafi' l'a parcourue lors de sa deuxième charge maghrébine sans que personne ne l'affronte ni ne la combatte, et la cavalerie de Musa ibn Nusayr l'a atteinte, y installant ses habitants et faisant des captifs."
  ur: "سوس العدنا، تانگیر سے آگے کا صوبہ - سوس الاقصیٰ سے بیس دن کم ہے۔ عقبہ بن نافع اپنے دوسرے مغرب کے الزام میں اس میں گھومتا رہا اور اس سے کوئی مقابلہ نہیں کیا اور موسیٰ بن نصیر کے گھڑ سوار دستے اس کے لوگوں کو آباد کرتے اور قیدیوں کو لے کر اس تک پہنچ گئے۔"
