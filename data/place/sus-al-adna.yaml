  en: "Sus al-Adna, the province beyond Tangier — some twenty-odd days short of Sus al-Aqsa; Uqba ibn Nafi' roamed it in his second Maghreb charge with none confronting or fighting him, and Musa ibn Nusayr's cavalry reached it, settling its people and taking captives."
