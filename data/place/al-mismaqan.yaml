summary:
  ar: "مدينة عامرة بأهلها، وأكثر شجرها النخيل، ويصفها الإدريسي بأن فيها أنواع الحبوب وقصب السكر الكثير. {cite:nuzhat-al-mushtaq-2002 p. 394}"
  en: "A populated town, its trees mostly palms; al-Idrisi notes grains of many kinds and much sugar cane. {cite:nuzhat-al-mushtaq-2002 p. 394}"
  es: "Un pueblo poblado, con árboles mayoritariamente palmeras; al-Idrisi menciona cereales de muchos tipos y mucha caña de azúcar. {cite:nuzhat-al-mushtaq-2002 p. 394}"
  fr: "Ville peuplée, ses arbres sont principalement des palmiers; al-Idrisi mentionne des céréales de toutes sortes et une grande quantité de canne à sucre. {cite:nuzhat-al-mushtaq-2002 p. 394}"
  ur: "ایک آبادی والا شہر، اس کے درخت زیادہ تر کھجور کے ہیں۔ الادریسی نے کئی قسم کے اناج اور بہت زیادہ گنے کو نوٹ کیا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 394}"
  tr: "Çoğu palmiye ağacıyla dolu, halkıyla dolu bir şehir ve Al-Idrisi burayı birçok tahıl ve şeker kamışı türüne sahip olarak tanımlar. {kaynak:Nuzhat-al-mushtaq-2002 s. 394}"
  id: "Sebuah kota yang ramai dengan penduduknya, dengan sebagian besar pohon palem, dan Al-Idrisi menggambarkannya memiliki banyak jenis biji-bijian dan tebu. {cite:Nuzhat-al-Mushtaq-2002 hlm. 394}"
