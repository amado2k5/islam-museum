summary:
  ar: "موضع قُتل فيه عمير بن رئاب السهمي مع خالد بن الوليد منصرفه من اليمامة في خلافة أبي بكر بحسب ابن إسحاق. وعند البلاذري: حصن فيه مسلحة للأعاجم عظيمة حاصره خالد حتى سألوا الأمان فأبى وافتتحه عنوة وسبى من كنيستها جماعة كان منهم آباء وموالي ابن سيرين وابن إسحاق وموسى بن نصير وآل أبي فروة ودفن بها بشير بن سعد الأنصاري وعمير بن رئاب."
  en: A place where Umayr ibn Ri'ab al-Sahmi was killed with Khalid ibn al-Walid on his way back from al-Yamama in Abu Bakr's caliphate, according to Ibn Ishaq.
  es: "Según Ibn Ishaq, este es el lugar donde Umayr ibn Ri'ab al-Sahmi fue asesinado junto con Khalid ibn al-Walid cuando regresaban de al-Yamama, en el califato de Abu Bakr."
  fr: "Un lieu où Umayr ibn Ri'ab al-Sahmi fut tué avec Khalid ibn al-Walid sur le chemin du retour d'al-Yamama dans le califat d'Abu Bakr, selon Ibn Ishaq."
  ur: "ابن اسحاق کے مطابق، وہ جگہ جہاں عمیر بن ریاب السہمی کو خالد بن ولید کے ساتھ ابوبکر کی خلافت میں یمامہ سے واپسی پر قتل کیا گیا تھا۔"
  tr: "İbn İshaq'a göre, Ebu Bekir halifeliği sırasında El-Yamama'dan ayrılan Halid ibn el-Velid ile birlikte Umayr ibn Ri'ab el-Sahmi'nin öldürüldüğü bir yerdir. El-Baladhuri'ye göre: Halid tarafından büyük silahlı bir Arap olmayan kale kuşatılmış, güvenlik talep edene kadar ancak reddetmiş ve zorla ele geçirmiş, kiliseden İbn Sirin, İbn İshaq, Musa ibn Nusayr ve Abu Furwa'nın ailesi de dahil olmak üzere bir grubu kiliseden sürgün etmiştir. Beşir bin Sa'd el-Ensari ve Umere ibn Rey'ab burada gömülmüştür."
  id: "Tempat di mana Umayr ibn Ri'ab al-Sahmi dibunuh bersama Khalid ibn al-Walid, yang telah meninggalkan Al-Yamama selama kekhalifahan Abu Bakr, menurut Ibn Ishaq. Menurut al-Baladhuri: sebuah benteng non-Arab bersenjata besar dikepung oleh Khalid sampai mereka meminta perlindungan, tetapi ia menolak dan merebutnya secara paksa, mengasingkan sekelompok orang dari gerejanya, termasuk ayah dan mantan Ibn Sirin, Ibn Ishaq, Musa ibn Nusayr, dan keluarga Abu Furwah. Bashir ibn Sa'd al-Ansari dan Umair ibn Ray'ab dimakamkan di sana."
