summary:
  ar: "موضع قُتل فيه عمير بن رئاب السهمي مع خالد بن الوليد منصرفه من اليمامة في خلافة أبي بكر بحسب ابن إسحاق. وعند البلاذري: حصن فيه مسلحة للأعاجم عظيمة حاصره خالد حتى سألوا الأمان فأبى وافتتحه عنوة وسبى من كنيستها جماعة كان منهم آباء وموالي ابن سيرين وابن إسحاق وموسى بن نصير وآل أبي فروة ودفن بها بشير بن سعد الأنصاري وعمير بن رئاب."
  en: A place where Umayr ibn Ri'ab al-Sahmi was killed with Khalid ibn al-Walid on his way back from al-Yamama in Abu Bakr's caliphate, according to Ibn Ishaq.
