summary:
  ar: "مدينة كثيرة العمارات على البحر، تسلطت عليها العرب فأجلت أهلها، ولم يبق منها الآن إلا بقايا، ويذكر الإدريسي أن سكانها من هوارة البربر. {cite:nuzhat-al-mushtaq-2002 p. 308} وهي عند ابن فضل الله العمري خراب يباب بها صنمان عظيمان من الرخام الأبيض في زي أمراتين، وغالب بنائها في جدرها وسقوفها وأرضها ودياراتها من الرخام، وكان يجري إليها وادٍ يصب في البحر ترسى السفن إليه حتى غلب عليها سافي الرمل فقطع مدد الوادي وأخلى أوطانها وأجلى سكانها {cite:umari-masalik-1924 p. 243-244}."
  en: "A city of many buildings on the coast, which Arabs took over, driving out its people; only remains survive, and al-Idrisi says its later people were Hawwara Berbers. {cite:nuzhat-al-mushtaq-2002 p. 308}"
