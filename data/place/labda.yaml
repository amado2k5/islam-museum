summary:
  ar: "مدينة كثيرة العمارات على البحر، تسلطت عليها العرب فأجلت أهلها، ولم يبق منها الآن إلا بقايا، ويذكر الإدريسي أن سكانها من هوارة البربر. {cite:nuzhat-al-mushtaq-2002 p. 308} وهي عند ابن فضل الله العمري خراب يباب بها صنمان عظيمان من الرخام الأبيض في زي أمراتين، وغالب بنائها في جدرها وسقوفها وأرضها ودياراتها من الرخام، وكان يجري إليها وادٍ يصب في البحر ترسى السفن إليه حتى غلب عليها سافي الرمل فقطع مدد الوادي وأخلى أوطانها وأجلى سكانها {cite:umari-masalik-1924 p. 243-244}."
  en: "A city of many buildings on the coast, which Arabs took over, driving out its people; only remains survive, and al-Idrisi says its later people were Hawwara Berbers. {cite:nuzhat-al-mushtaq-2002 p. 308}"
  es: "Una ciudad costera con numerosos edificios, que fue conquistada por los árabes, quienes expulsaron a sus habitantes; solo sobreviven ruinas, y al-Idrisi afirma que sus últimos pobladores fueron bereberes de Hawwara. {cite:nuzhat-al-mushtaq-2002 p. 308}"
  fr: "Une ville côtière aux nombreux édifices, conquise par les Arabes qui en chassèrent les habitants; il n’en subsiste que des vestiges, et al-Idrisi affirme que ses derniers habitants étaient des Berbères Hawwara. {cite:nuzhat-al-mushtaq-2002 p. 308}"
  ur: "ساحل پر بہت سی عمارتوں کا ایک شہر، جسے عربوں نے اپنے قبضے میں لے لیا، اس کے لوگوں کو باہر نکال دیا۔ صرف زندہ بچا ہے، اور الادریسی کا کہنا ہے کہ اس کے بعد کے لوگ حوارہ بربر تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 308}"
  tr: "Deniz kenarında birçok binası olan bu şehir, Araplar tarafından fethedilmiş ve halkı sürgün edilmiştir. Bugün sadece kalıntıları kalmıştır. El-İdrisi, sakinlerinin Berberi Havara kökenli olduğunu belirtir. {cit:Nuzhat-al-Mushtaq-2002, s. 308} İbn Fadlallah al-Omari'ye göre, Amratin kılığına girmiş iki büyük beyaz mermer heykelin yok edildiği bir harabedir. Yapılarının çoğu mermerden yapılmış olup, duvarları, çatıları, arazi ve evlerinin çoğu mermerden yapılmıştır. Bir vadi denize akıyordu; gemiler demirledi ve kumla bastırıldı, vadinin kesimlerini yararak vadini boşalttı, vatanlarını tahliye etti {cite:umari-masalik-1924, s. 243-244}."
  id: "Kota dengan banyak bangunan di tepi laut, kota ini ditaklukkan oleh bangsa Arab dan mengusir penduduknya. Hanya sisa-sisa yang tersisa hingga kini. Al-Idrisi menyebutkan bahwa penduduknya berasal dari suku Berber Hawara. {cite:Nuzhat-al-Mushtaq-2002, hlm. 308} Menurut Ibn Fadlallah al-Omari, ini adalah reruntuhan di mana dua patung marmer putih besar yang berpakaian sebagai Amratin dihancurkan. Sebagian besar bangunannya terbuat dari marmer, dengan sebagian besar dinding, atap, tanah, dan rumahnya terbuat dari marmer. Sebuah lembah mengalir ke laut, di mana kapal-kapal berlabuh hingga tertutup pasir, memotong bagian lembah, mengevakuasi tanah airnya, dan mengevakuasi penduduknya {cite:umari-masalik-1924, hlm. 243-244}."
