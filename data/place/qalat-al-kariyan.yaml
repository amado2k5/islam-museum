label: { ar: "قلعة الكاريان", en: "Qal'at al-Kariyan", es: "Qal'at al-Kariyan", fr: "Qal'at al-Kariyan", ur: "قلعت الکریان", tr: "Carian Kalesi", id: "Kastil Carian" }
summary:
  ar: "قلعة على جبل من الطين، لا يُصعد إليها إلا بطريق صعب يشبه مدرج النمل، وقد ذكر الإدريسي أنها من عجائب البنيان. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  en: "A castle on a mountain of clay, reached only by a hard path like an ant's track; al-Idrisi counts it among the marvels of building. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  es: "Un castillo sobre una montaña de arcilla, al que solo se puede acceder por un sendero árido como el de una hormiga; al-Idrisi lo considera una de las maravillas de la arquitectura. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  fr: "Un château bâti sur une montagne d'argile, accessible uniquement par un chemin escarpé semblable à une trace de fourmi; al-Idrisi le compte parmi les merveilles architecturales. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  ur: "مٹی کے پہاڑ پر ایک قلعہ، صرف چیونٹی کے راستے جیسے سخت راستے سے پہنچا۔ ادریسی نے اسے عمارت کے عجائبات میں شمار کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 420}"
  tr: "Çamur dağında bir kale, ancak karınca terasına benzeyen zorlu bir patikayla tırmanılabiliyor ve Al-Idrisi bunun yapının harikalarından biri olduğunu belirtti. {kaynak:nuzhat-al-mushtaq-2002 s. 420}"
  id: "Sebuah benteng di atas gunung lumpur, yang hanya bisa didaki melalui jalan sulit yang menyerupai teras semut, dan Al-Idrisi menyebutkan bahwa itu adalah salah satu keajaiban struktur tersebut. {cite:nuzhat-al-mushtaq-2002 hlm. 420}"
