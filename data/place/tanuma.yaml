summary:
  ar: "جزيرة عامرة فيها مياه عذبة وأرز ونارجيل ومغاص للؤلؤ، وينبت فيها العود والكافور، وتبعد عن جزيرة قمار خمسة أيام {cite:nuzhat-al-mushtaq-2002 p. 82-83}."
  en: "A populated island with fresh water, rice and coconuts, and a pearl-diving ground. Oud and camphor grow there. Five days from Qumar {cite:nuzhat-al-mushtaq-2002 p. 82-83}."
  es: "Una isla poblada con agua dulce, arroz y cocos, y un lugar ideal para bucear en busca de perlas. Allí crecen el oud y el alcanfor. A cinco días de Qumar {cite:nuzhat-al-mushtaq-2002 p. 82-83}."
  fr: "Une île habitée avec de l'eau douce, du riz et des cocotiers, et un lieu de pêche aux perles. On y trouve du oud et du camphre. À cinq jours de Qumar {cite:nuzhat-al-mushtaq-2002 p. 82-83}."
  ur: "ایک آبادی والا جزیرہ جس میں تازہ پانی، چاول اور ناریل، اور موتی ڈائیونگ گراؤنڈ ہے۔ عود اور کافور وہاں اگتے ہیں۔ قمر سے پانچ دن {حوالہ: نزہت المشتاق-2002 ص۔ 82-83}۔"
  tr: "Tatlı suyu, sedir, hindistancevizi ve inci kupalarıyla dolu yemyeşil bir ada; ud ve kafur yetişiyor ve Qamar Adası'na beş gün uzaklıkta {cite:Nuzhat-al-mushtaq-2002, s. 82-83}."
  id: "Sebuah pulau yang subur dengan air tawar, cedar, kelapa, dan mutiara, tempat oud dan kamper tumbuh, dan berjarak lima hari dari Pulau Qamar {cite:Nuzhat-al-mushtaq-2002, hlm. 82-83}."
