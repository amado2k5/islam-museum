summary:
  ar: "آخر أرض بربرة، وهي قرية على طريق مركة، ومنها إلى قرنوة ثمانية أيام، وإلى بذونة ستة أيام. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  en: "The last land of Barbara, a village on the road from Mirka. Eight days from it to Qarnawa, and six to Badhuna. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  es: "La última tierra de Bárbara, un pueblo en el camino desde Mirka. Ocho días desde allí hasta Qarnawa, y seis hasta Badhuna. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  fr: "Le dernier village de Barbara se trouve sur la route de Mirka. Il faut huit jours pour atteindre Qarnawa et six pour Badhuna. {cite:nuzhat-al-mushtaq-2002 p. 48}"
  ur: "میرکا سے سڑک پر واقع ایک گاؤں باربرا کی آخری زمین۔ اس سے قرنوا تک آٹھ دن اور بدونہ تک چھ دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 48}"
  tr: "Son arazi Berbera'dır; Markah yolu üzerindeki bir köy, buradan Qarnawa'ya sekiz gün, ardından Dhuna'ya altı gün sürer. {cite:nuzhat-al-mushtaq-2002 s. 48}"
  id: "Tanah terakhir adalah Berbera, sebuah desa di jalan Markah, dari mana perjalanan memakan waktu delapan hari ke Qarnawa, lalu ke Dhuna selama enam hari. {cite:Nuzhat-al-Mushtaq-2002 hlm. 48}"
