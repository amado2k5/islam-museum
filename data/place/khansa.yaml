summary:
  ar: "المدينة التي يسميها جامع التواريخ خنساي، وهي حاضرة بلاد الصين الجنوبية كما يصفها النص {cite:jami-al-tawarikh-khashshab-1960 p. 150}. ينقل الكتاب عن وصاف وزهة القلوب ومسالك الأبصار أوصافا لها: أسوارها وجسورها وأسواقها ومعابدها وسكانها {cite:jami-al-tawarikh-khashshab-1960 p. 137}{cite:jami-al-tawarikh-khashshab-1960 p. 138}، ويذكر أن أوروديك سماها كسانى وقدّر فيها أربعين ألف مسلم {cite:jami-al-tawarikh-khashshab-1960 p. 139}. ولم يرد على هذه الصفحات تحديد حديث للمدينة بمدينة معاصرة."
  en: "The city that Jami' al-Tawarikh calls Khansa, which the text describes as the capital of southern China {cite:jami-al-tawarikh-khashshab-1960 p. 150}. The book quotes Wassaf, Zahrat al-Qulub and Masalik al-Absar for descriptions of its walls, bridges, markets, temples and population {cite:jami-al-tawarikh-khashshab-1960 p. 137}{cite:jami-al-tawarikh-khashshab-1960 p. 138}, and it notes that Oderic called it Casay and counted forty thousand Muslims there {cite:jami-al-tawarikh-khashshab-1960 p. 139}. These pages do not state a modern identification of the city; that needs a source."
  es: "La ciudad que el Jami' al-Tawarikh llama Jansa, descrita en el texto como capital de la China meridional {cite:jami-al-tawarikh-khashshab-1960 p. 150}. La obra cita a Wassaf, Zahrat al-Qulub y Masalik al-Absar para describir sus murallas, puentes, mercados, templos y población {cite:jami-al-tawarikh-khashshab-1960 p. 137}{cite:jami-al-tawarikh-khashshab-1960 p. 138}, y recoge que Oderico la llamó Casay y contó allí cuarenta mil musulmanes {cite:jami-al-tawarikh-khashshab-1960 p. 139}. Estas páginas no dan una identificación moderna de la ciudad; eso requiere una fuente."
  fr: "La ville que le Jami' al-Tawarikh appelle Khansa, décrite dans le texte comme la capitale de la Chine méridionale {cite:jami-al-tawarikh-khashshab-1960 p. 150}. L'ouvrage cite Wassaf, Zahrat al-Qulub et Masalik al-Absar pour décrire ses murailles, ponts, marchés, temples et population {cite:jami-al-tawarikh-khashshab-1960 p. 137}{cite:jami-al-tawarikh-khashshab-1960 p. 138}, et rapporte qu'Oderic la nomma Casay et y compta quarante mille musulmans {cite:jami-al-tawarikh-khashshab-1960 p. 139}. Ces pages ne donnent pas d'identification moderne de la ville ; cela exige une source."
  ur: "وہ شہر جسے جامع التواریخ خنسای کہتی ہے، جسے متن جنوبی چین کا دارالحکومت بتاتا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 150}۔ کتاب اس کی فصیلوں، پلوں، بازاروں، عبادت گاہوں اور آبادی کے بیان کے لیے وصاف، زہۃ القلوب اور مسالک الابصار سے نقل کرتی ہے {cite:jami-al-tawarikh-khashshab-1960 p. 137}{cite:jami-al-tawarikh-khashshab-1960 p. 138}، اور بتاتی ہے کہ اوڈرک نے اسے کسانی کہا اور وہاں چالیس ہزار مسلمان شمار کیے {cite:jami-al-tawarikh-khashshab-1960 p. 139}۔ ان صفحات میں اس شہر کی جدید شناخت درج نہیں؛ اس کے لیے ماخذ درکار ہے۔"
  tr: "Şehir, metinde tanımlandığı üzere Güney Çin'in başkenti olan Tarih Camii Khansai olarak adlandırılır; {cite:jami-al-tawarikh-khashshab-1960, s. 150} Kitap, kalp vadisi ve gözlerin yolları: duvarları, köprüleri, pazarları, tapınakları ve sakinleri hakkında açıklamalar yapar {cite:jami-al-tawarikh-khashshab-1960 s. 137}{cite:jami-al-tawarikh-khashshab-1960 s. 138} ve Urodik'in şehre Kisani adını verdiği ve kırk bin Müslüman olduğunu tahmin ettiği belirtilir {cite:jami-al-tawarikh-khashshab-1960 s. 139}. Bu sayfalarda hiçbir hadis şehri çağdaş şehir olarak belirtmez."
  id: "Kota yang disebut Masjid Sejarah Khansai, yang merupakan ibu kota Tiongkok selatan seperti yang dijelaskan dalam teks {cite:jami-al-tawarikh-khashshab-1960, hlm. 150}. Buku ini mengutip deskripsi lembah hati dan jalan mata: dinding, jembatan, pasar, kuil, dan penduduknya {cite:jami-al-tawarikh-khashshab-1960 hlm. 137}{cite:jami-al-tawarikh-khashshab-1960 hlm. 138}, dan menyebutkan bahwa Urodik menamainya Kisani dan memperkirakan memiliki empat puluh ribu Muslim {cite:jami-al-tawarikh-khashshab-1960 hlm. 139}. Tidak ada hadits yang menyebutkan kota ini sebagai kota kontemporer di halaman-halaman ini."
