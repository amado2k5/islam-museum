summary:
  ar: "حصن صغير في قشتالة، على بعد نحو سبعة أميال جنوب غرب سيوداد ريال، على قمة جبل تمتد سفوحه إلى وادي آنة. انتصر فيه الخليفة الموحدي يعقوب المنصور على ألفونسو الثامن ملك قشتالة في معركة الأرك {cite:encyclopaedia-of-islam-2 vol. 1 p. 630}."
  en: "A small citadel in Castile, about seven miles south-west of Ciudad Real, on a mountain whose spurs descend to the Guadiana. The Almohad ruler Ya'qub al-Mansur won the battle of al-Arak (Alarcos) here against Alfonso VIII of Castile {cite:encyclopaedia-of-islam-2 vol. 1 p. 630}."
