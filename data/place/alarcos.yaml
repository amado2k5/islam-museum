summary:
  ar: "حصن صغير في قشتالة، على بعد نحو سبعة أميال جنوب غرب سيوداد ريال، على قمة جبل تمتد سفوحه إلى وادي آنة. انتصر فيه الخليفة الموحدي يعقوب المنصور على ألفونسو الثامن ملك قشتالة في معركة الأرك {cite:encyclopaedia-of-islam-2 vol. 1 p. 630}."
  en: "A small citadel in Castile, about seven miles south-west of Ciudad Real, on a mountain whose spurs descend to the Guadiana. The Almohad ruler Ya'qub al-Mansur won the battle of al-Arak (Alarcos) here against Alfonso VIII of Castile {cite:encyclopaedia-of-islam-2 vol. 1 p. 630}."
  es: "Una pequeña ciudadela en Castilla, a unos siete kilómetros al suroeste de Ciudad Real, en una montaña cuyas estribaciones descienden hasta el Guadiana. El gobernante almohade Ya'qub al-Mansur ganó aquí la batalla de al-Arak (Alarcos) contra Alfonso VIII de Castilla {cite:encyclopaedia-of-islam-2 vol. 1 p. 630}."
  fr: "Une petite citadelle de Castille, à environ onze kilomètres au sud-ouest de Ciudad Real, sur une montagne dont les contreforts descendent vers le Guadiana. Le souverain almohade Ya'qub al-Mansur y remporta la bataille d'al-Arak (Alarcos) contre Alphonse VIII de Castille (source: Encyclopaedia of Islam, vol. 1, p. 630)."
  ur: "کاسٹیل میں ایک چھوٹا سا قلعہ، سیوڈاڈ ریئل سے تقریباً سات میل جنوب مغرب میں، ایک پہاڑ پر جس کے اسپرز گوڈیانا تک آتے ہیں۔ الموحد حکمران یعقوب المنصور نے یہاں کاسٹائل کے الفانسو VIII کے خلاف العرک ⁦(الارکوس)⁩ کی جنگ جیت لی۔ 1 ص۔ 630}۔"
