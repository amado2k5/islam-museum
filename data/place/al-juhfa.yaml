summary:
  ar: "بلاد بين مكة والمدينة، عند المسعودي نزلها عبيل بن عوص بن أرم بن سام بن نوح هو وولده ومن تبعه فهلكوا بالسيل فسمي الموضع الجحفة لإجحافها عليهم، ثم نزلها قوم من بني حنيفة اليمامة واستوطنوها {cite:muruj-al-dhahab p. 457-458}."
  en: "The land between Mecca and Medina — named (al-Mas'udi says) for the torrent that swept away (ajhafa) 'Ubayl ibn Aws and his people who first settled it; Banu Hanifa of Yamama later dwelt there {cite:muruj-al-dhahab p. 457-458}."
  es: "La tierra entre La Meca y Medina —llamada así (según al-Mas'udi) por el torrente que arrastró (ajhafa) a 'Ubayl ibn Aws y a su gente, quienes la poblaron por primera vez; los Banu Hanifa de Yamama habitaron allí más tarde {cite:muruj-al-dhahab p. 457-458}."
  fr: "La terre entre La Mecque et Médine — nommée (d'après al-Mas'udi) d'après le torrent qui a emporté (ajhafa) 'Ubayl ibn Aws et son peuple qui s'y étaient installés en premier; Banu Hanifa de Yamama y a habité plus tard {cite:muruj-al-dhahab p. 457-458}."
  ur: "مکہ اور مدینہ کے درمیان کی سرزمین کا نام ⁦(المسعودی کہتے ہیں)⁩ اس ندی کے لیے رکھا گیا جو بہہ گیا ⁦(اجحافہ)⁩ ابیل بن اوس اور اس کی قوم جنہوں نے اسے سب سے پہلے آباد کیا۔ یمامہ کے بنو حنیفہ نے بعد میں وہیں رہائش اختیار کی 457-458}۔"
  tr: "Mekke ile Medine arasında bir topraktır. El-Mes'udi'ye göre, Ubeyl ibn Aws ibn Aram ibn Sam ibn Nuh ve onun soyundan gelenler tarafından yerleşilmiş ve onlar selde ölmüştür. Burası, üzerlerine yönelik zulüm nedeniyle Al-Juhfa olarak adlandırılmıştır. Daha sonra Banu Hanifa el-Yamama'dan bir grup buraya yerleşmiş ve yerleşmiştir {cite:muruj-al-dhahab, s. 457-458}."
  id: "Sebuah tanah di antara Mekah dan Madinah. Menurut Al-Mas'udi, tempat ini dihuni oleh Ubayl ibn Aws ibn Aram ibn Sam ibn Nuh bersama keturunannya dan mereka yang mengikutinya, dan mereka tewas dalam banjir. Tempat itu dinamai Al-Juhfa karena penindasan terhadap mereka. Kemudian sekelompok dari Banu Hanifa al-Yamama menetap di sana dan menetap di sana {cite:muruj-al-dhahab, hlm. 457-458}."
