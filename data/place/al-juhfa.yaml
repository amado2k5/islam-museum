summary:
  ar: "بلاد بين مكة والمدينة، عند المسعودي نزلها عبيل بن عوص بن أرم بن سام بن نوح هو وولده ومن تبعه فهلكوا بالسيل فسمي الموضع الجحفة لإجحافها عليهم، ثم نزلها قوم من بني حنيفة اليمامة واستوطنوها {cite:muruj-al-dhahab p. 457-458}."
  en: "The land between Mecca and Medina — named (al-Mas'udi says) for the torrent that swept away (ajhafa) 'Ubayl ibn Aws and his people who first settled it; Banu Hanifa of Yamama later dwelt there {cite:muruj-al-dhahab p. 457-458}."
  es: "La tierra entre La Meca y Medina —llamada así (según al-Mas'udi) por el torrente que arrastró (ajhafa) a 'Ubayl ibn Aws y a su gente, quienes la poblaron por primera vez; los Banu Hanifa de Yamama habitaron allí más tarde {cite:muruj-al-dhahab p. 457-458}."
  fr: "La terre entre La Mecque et Médine — nommée (d'après al-Mas'udi) d'après le torrent qui a emporté (ajhafa) 'Ubayl ibn Aws et son peuple qui s'y étaient installés en premier; Banu Hanifa de Yamama y a habité plus tard {cite:muruj-al-dhahab p. 457-458}."
