summary:
  en: "A valley in the territory of Hawazin where Malik ibn Awf mustered the tribal confederation before Hunayn, and where the defeated remnants of Hawazin rallied under Durayd ibn al-Simma before being pursued by Abu Amir al-Ash'ari."
  ar: "وادٍ في ديار هوازن عسكر فيه مالك بن عوف بالقبائل وأموالها قبل حنين، وفيه لجأ المنهزمون من هوازن تحت قيادة دريد بن الصمة، ودارت فيه سرية أوطاس."
  es: "Un valle en el territorio de Hawazin donde Malik ibn Awf reunió a la confederación tribal ante Hunayn, y donde los restos derrotados de Hawazin se reagruparon bajo el mando de Durayd ibn al-Simma antes de ser perseguidos por Abu Amir al-Ash'ari."
  fr: "Une vallée du territoire de Hawazin où Malik ibn Awf a rassemblé la confédération tribale avant Hunayn, et où les restes vaincus de Hawazin se sont ralliés sous Durayd ibn al-Simma avant d'être poursuivis par Abu Amir al-Ash'ari."
  ur: "ہوازن کے علاقے میں ایک وادی جہاں مالک ابن عوف نے حنین کے سامنے قبائلی اتحاد کو اکٹھا کیا تھا، اور جہاں ہوازن کی شکست خوردہ باقیات ابو امیر العشری کے تعاقب سے پہلے دورید بن السماء کے ماتحت جمع ہوئی تھیں۔"
  tr: "Malik ibn Awf'un kabileler ve servetleriyle birlikte Hunayn önünde kamp kurduğu Hawazin topraklarındaki bir vadi. Hawazin'den yenilenler, Duraid ibn al-Sammah'ın komutasında sığındı ve Awtas birliği orada dolaştı."
  id: "Sebuah lembah di tanah Hawazin tempat Malik ibn Awf berkemah bersama suku-suku dan kekayaan mereka di depan Hunayn. Yang kalah dari Hawazin berlindung di sana di bawah komando Duraid ibn al-Sammah, dan pasukan Awta berkeliaran di sana."
