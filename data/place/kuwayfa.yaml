summary:
  ar: "موضع ارتاده المسلمون قبل الكوفة فوجدوا الماء محيطاً بها؛ وقيل حوّل إليها سعد جند أسبانبر وكرد بنداذ دون الكوفة."
  en: "Site the Muslims surveyed before Kufa, found ringed by water; Sa'd is also said to have moved the troops of Asbanbur and Kurd Bandadh to it below Kufa."
  es: "El lugar que los musulmanes exploraron antes de Kufa, se encuentra rodeado de agua; también se dice que Sa'd trasladó allí las tropas de Asbanbur y Kurd Bandadh, al sur de Kufa."
  fr: "Site exploré par les musulmans avant Kufa, trouvé entouré d'eau; Sa'd y aurait également déplacé les troupes d'Asbanbur et de Kurd Bandadh en aval de Kufa."
  ur: "کوفہ سے پہلے مسلمانوں کی جگہ کا سروے کیا گیا، پانی میں گھنٹی ہوئی پائی گئی۔ سعد کے بارے میں یہ بھی کہا جاتا ہے کہ اسبنبر اور کرد بندہ کی فوجوں کو کوفہ کے نیچے اس کی طرف منتقل کیا گیا۔"
  tr: "Kufe'den önce Müslümanların ziyaret ettiği ve çevresinde su bulduğu bir yerdir; Sa'd'ın Kufa'dan önce Aspanbar ve Kürt Bandad askerleri tarafından Din Tanrısı'na dönüştürüldüğü söylenir."
  id: "Ini adalah tempat yang dikunjungi Muslim sebelum Kufa dan ditemukan air di sekitarnya; konon Sa'd dipindahkan oleh tentara Aspanbar dan Bandadh Kurdi sebelum Kufa."
