label: { ar: "صفد", en: "Safad", ur: "صفد" }
summary:
  ar: "مدينة الجليل الأعلى على تل مشرف؛ بنا الفرنجة أول قلعتها سنة ٤٩٥هـ ونقلت إلى فرسان الهيكل، ثم فتحها صلاح الدين في شوال ٥٨٤هـ بعد حصار ستة أسابيع، وهدم المعظم عيسى قلعتها سنة ٦١٧هـ، وأعادها الملك الصالح إسماعيل إلى الفرنج سنة ٦٣٨هـ فجددها فرسان الهيكل، وصارت في العصر المملوكي عاصمة مملكة {cite:encyclopaedia-of-islam-2 vol. 8 p. 757-758}."
  en: "The principal town of Upper Galilee on a commanding hill. The Franks built its first fortress in 495/1101-2 and later handed it to the Templars; Saladin took it in Shawwal 584/December 1187 after a six-week siege; al-Mu'azzam Isa razed the fortress in 617/1219-20, and al-Malik al-Salih Isma'il returned it to the Franks in 638/1240; under the Mamluks it became the capital of a province (mamlaka) {cite:encyclopaedia-of-islam-2 vol. 8 p. 757-758}."
  ur: "بالائی جلیل کا اہم شہر ایک بلند پہاڑی پر۔ فرانسیسکوں نے 495ھ/1101-2ء میں اس کا پہلا قلعہ بنایا جو بعد میں ٹیمپلرز کو منتقل ہوا؛ صلاح الدین نے شوال 584ھ/دسمبر 1187ء میں چھ ہفتوں کے محاصرے کے بعد فتح کیا؛ معظم عیسیٰ نے 617ھ/1219-20ء میں قلعہ گرا دیا اور ملک صالح اسماعیل نے 638ھ/1240ء میں اسے فرنگیوں کو واپس کیا؛ مملوک دور میں یہ ایک مملکہ (صوبہ) کا دارالحکومت بنا {cite:encyclopaedia-of-islam-2 vol. 8 p. 757-758}۔"
