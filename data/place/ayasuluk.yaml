  en: "Ayasuluk (Selçuk)"
summary:
  ar: "بلدة صغيرة على الساحل الغربي للأناضول، عند موقع أفسس القديمة، عُرفت في العصور الوسطى باسم آيا سولوك، ودخلت الحكم العثماني نهائياً سنة 1425م، ثم تراجعت لصالح كوشادسي المجاورة {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
  en: "A small town on the western coast of Anatolia, on the site of ancient Ephesus, known in the Middle Ages as Aya Solük. It came under Ottoman rule for good under Murad II in 1425, and later declined in favour of neighbouring Kuşadası {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
