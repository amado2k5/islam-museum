summary:
  ar: "بلدة صغيرة على الساحل الغربي للأناضول، عند موقع أفسس القديمة، عُرفت في العصور الوسطى باسم آيا سولوك، ودخلت الحكم العثماني نهائياً سنة 1425م، ثم تراجعت لصالح كوشادسي المجاورة {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
  en: "A small town on the western coast of Anatolia, on the site of ancient Ephesus, known in the Middle Ages as Aya Solük. It came under Ottoman rule for good under Murad II in 1425, and later declined in favour of neighbouring Kuşadası {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
  es: "Una pequeña ciudad en la costa occidental de Anatolia, en el emplazamiento de la antigua Éfeso, conocida en la Edad Media como Aya Solük. Cayó definitivamente bajo el dominio otomano con Murad II en 1425, y posteriormente decayó en favor de la vecina Kuşadası {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
  fr: "Petite ville de la côte ouest de l'Anatolie, située sur le site de l'ancienne Éphèse, connue au Moyen Âge sous le nom d'Aya Solük. Elle passa définitivement sous domination ottomane sous Murad II en 1425, puis déclina au profit de la ville voisine de Kuşadası {cite:encyclopaedia-of-islam-2 vol. 1 p. 826-827}."
  ur: "اناطولیہ کے مغربی ساحل پر ایک چھوٹا سا قصبہ، قدیم ایفیسس کے مقام پر، قرون وسطیٰ میں آیا سولوک کے نام سے جانا جاتا تھا۔ یہ 1425 میں مراد II کے تحت عثمانی حکومت کے تحت آیا، اور بعد میں پڑوسی ملک Kuşadası کے حق میں انکار کر دیا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 826-827}۔"
  tr: "Anadolu'nun batı kıyısında, antik Efes'in bulunduğu yerde, Orta Çağ'da Aya Soluk olarak bilinen küçük bir kasaba, 1425 yılında kalıcı olarak Osmanlı yönetimine girmiş, ardından komşu Kuşadası'ya dönüşmüş {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 826-827}."
  id: "Sebuah kota kecil di pantai barat Anatolia, di lokasi Efesus kuno, yang dikenal pada Abad Pertengahan sebagai Aya Soluk, yang masuk ke dalam kekuasaan Ottoman secara permanen pada tahun 1425 M, kemudian merosot menjadi Kuşadası yang berdekatan {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 826-827}."
