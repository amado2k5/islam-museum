summary:
  ar: "موضع على نهر يأخذ من دجلة كانت فيه قرية يسكنها خلق من الجرامقة وناس من النبط، نزل المعتصم بالبراذان أولاً فلم يستطب هواءها ثم تنقل حتى انتهى إلى القاطول فبنى فيه قصراً وانتقل الناس من مدينة السلام، ثم تأذى به وعزم على سامرا؛ وقال عيار يا ساكن القاطول بين الجرامقة تركت ببغداد الكباش البطارقة {cite:muruj-al-dhahab p. 444-445}."
  en: "The Jaramiqa village-site on a Tigris canal where al-Mu'tasim first built before abandoning it for Samarra — lampooned as 'you left the Batarqa rams of Baghdad' {cite:muruj-al-dhahab p. 444-445}."
