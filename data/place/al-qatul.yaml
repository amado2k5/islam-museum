label: { ar: "القاطول", en: "al-Qatul", es: "al-Qatul", fr: "al-Qatul", ur: "القطول", tr: "Savaşçı", id: "Petarung" }
summary:
  ar: "موضع على نهر يأخذ من دجلة كانت فيه قرية يسكنها خلق من الجرامقة وناس من النبط، نزل المعتصم بالبراذان أولاً فلم يستطب هواءها ثم تنقل حتى انتهى إلى القاطول فبنى فيه قصراً وانتقل الناس من مدينة السلام، ثم تأذى به وعزم على سامرا؛ وقال عيار يا ساكن القاطول بين الجرامقة تركت ببغداد الكباش البطارقة {cite:muruj-al-dhahab p. 444-445}."
  en: "The Jaramiqa village-site on a Tigris canal where al-Mu'tasim first built before abandoning it for Samarra — lampooned as 'you left the Batarqa rams of Baghdad' {cite:muruj-al-dhahab p. 444-445}."
  es: "El emplazamiento del pueblo de Jaramiqa en un canal del Tigris donde al-Mu'tasim construyó primero antes de abandonarlo por Samarra, ridiculizado como \"dejaste los carneros de Batarqa de Bagdad\" {cite:muruj-al-dhahab p. 444-445}."
  fr: "Le site du village de Jaramiqa sur un canal du Tigre où al-Mu'tasim a d'abord construit avant de l'abandonner pour Samarra — raillé comme « vous avez laissé les béliers de Batarqa de Bagdad » {cite:muruj-al-dhahab p. 444-445}."
  ur: "دجلہ کی نہر پر جارامیقہ گاؤں کی جگہ جہاں المعتصم نے سب سے پہلے سامرا کے لیے اسے چھوڑنے سے پہلے تعمیر کیا تھا - اس طرح چراغاں کیا گیا کہ 'آپ بغداد کے بطرقہ مینڈھوں کو چھوڑ گئے'۔ 444-445}۔"
  tr: "Dicle'den alınan bir nehir kenarında bir yer. Bir köyde Jaramaqa ve Nabatalılardan bazıları yaşamıştı. Al-Mu'tasim önce Baradhan'a yerleşti, ancak havasını sevmedi, sonra Al-Katul'a ulaştı ve orada bir saray inşa etti. İnsanlar barış şehrinden ayrıldı, sonra o zarar gördü ve Samarra'ya gitmeye kararlıydı. Dedi ki: 'Ayyar, ey Ceramka arasında El-Katil sakini, Bağdat'taki koçlara patarakaları bıraktın {cite:muruj-al-dhahab, s. 444-445}."
  id: "Sebuah tempat di sungai yang diambil dari Tigris. Ada sebuah desa yang dihuni oleh beberapa orang dari Jaramaqa dan orang-orang dari Nabatean. Al-Mu'tasim pertama kali menetap di Baradhan, tetapi tidak menyukai udaranya, kemudian dia pindah sampai mencapai Al-Qatul dan membangun sebuah istana di sana. Orang-orang pindah dari kota damai, kemudian dia disakiti dan bertekad ke Samarra. Dia berkata: 'Ayyar, wahai penduduk Al-Qatil di antara Jaramqa, kamu meninggalkan pataraqa para domba jantan di Baghdad {cite:muruj-al-dhahab, hlm. 444-445}."
