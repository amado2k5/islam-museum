id: place/al-manara-iskandariyya
class: place
kind: site
label: { ar: "منارة الإسكندرية", en: "Lighthouse of Alexandria", es: "Faro de Alejandría", fr: "Phare d'Alexandrie", ur: "اسکندریہ کا لائٹ ہاؤس", tr: "İskenderiye Deniz Feneri", id: "Mercusuar Alexandria" }
summary:
  ar: "منارة عالية على ساحل الإسكندرية، بناؤها من الحجر المتقن، ويذكر الإدريسي أن ارتفاعها نحو ثلاثمائة ذراع، وأن النار توقد فيها بالليل والنهار لإرشاد المراكب، وأنها تُسمى فانوساً. {cite:nuzhat-al-mushtaq-2002 p. 320} وفي القرن الثامن لم يبق منها عند ابن فضل الله العمري إلا ما هو في حكم الأطلال الدوارس والرسوم الطوامس؛ وحكى عن ابن ظافر أن ابن قلاقس والوجيه علي بن الدروي طلعاها فوصفها الأول بقبته التي لاحظ منها صحابه أنجماً وخُيّل إليه أن البحر تحته غمامة {cite:umari-masalik-1924 p. 241}."
  en: "A tall lighthouse on the Alexandria coast of finely cut stone. Al-Idrisi gives its height as about three hundred cubits, says fire burned in it day and night to guide ships, and that it was called Fanus. {cite:nuzhat-al-mushtaq-2002 p. 320}"
  es: "Un alto faro en la costa de Alejandría, construido con piedra finamente tallada. Al-Idrisi indica que medía unos trescientos codos, que en él ardía fuego día y noche para guiar a los barcos y que se llamaba Fanus. {cite:nuzhat-al-mushtaq-2002 p. 320}"
  fr: "Un haut phare en pierre finement taillée, situé sur la côte d'Alexandrie. Al-Idrisi indique sa hauteur à environ trois cents coudées, précise qu'un feu y brûlait jour et nuit pour guider les navires, et qu'il était appelé Fanus. {cite:nuzhat-al-mushtaq-2002 p. 320}"
  ur: "اسکندریہ کے ساحل پر باریک کٹے ہوئے پتھر کا ایک اونچا لائٹ ہاؤس۔ الادریسی اس کی اونچائی تقریباً تین سو ہاتھ بتاتے ہیں، کہتے ہیں کہ اس میں آگ دن رات بحری جہازوں کی رہنمائی کے لیے جلتی تھی، اور اسے فانوس کہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 320}"
  tr: "İskenderiye kıyısında, ince taştan yapılmış yüksek bir deniz feneri. El-İdrisi, yüksekliğinin yaklaşık üç yüz arşin olduğunu ve burada gece gündüz ateşlerin yakıldığını, tekneleri yönlendirmek için kullanıldığını ve buna fener dendiğini belirtir. {cit:Nuzhat-al-Mushtaq-2002, s. 320} Sekizinci yüzyılda, İbn Fadlallah Al-Omari'nin geriye sadece Doris ve Dönen Çizimler kalıntıları kalıntıları kalmıştı; İbn Dhafer'den rivayet edilmiştir ki, İbn Kalaqis ve ünlü Ali ibn al-Darwi bunu görmüştür ve ilk kişi kubbesi olarak tanımlamıştır; yoldaşları buradan yıldızlar görüp denizin altında bulutlu olduğunu hayal etmişler {cite:umari-masalik-1924, s. 241}."
  id: "Sebuah mercusuar tinggi di pesisir Alexandria, dibangun dari batu halus. Al-Idrisi menyebutkan bahwa tingginya sekitar tiga ratus hasta, dan api dinyalakan siang dan malam untuk mengarahkan perahu, dan disebut lentera. {cite:Nuzhat-al-Mushtaq-2002, hlm. 320} Pada abad kedelapan, Ibn Fadlallah Al-Omari tidak memiliki apa pun selain reruntuhan Doris dan Gambar Berputar; diceritakan dari Ibn Dhafer bahwa Ibn Qalaqis dan Ali ibn al-Darwi yang terkenal melihatnya, dan yang pertama menggambarkannya sebagai kubahnya, dari mana para sahabatnya melihat bintang dan membayangkan laut mendung di bawahnya {cite:umari-masalik-1924, hlm. 241}."
