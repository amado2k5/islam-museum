  ar: "منارة عالية على ساحل الإسكندرية، بناؤها من الحجر المتقن، ويذكر الإدريسي أن ارتفاعها نحو ثلاثمائة ذراع، وأن النار توقد فيها بالليل والنهار لإرشاد المراكب، وأنها تُسمى فانوساً. {cite:nuzhat-al-mushtaq-2002 p. 320}"
  en: "A tall lighthouse on the Alexandria coast of finely cut stone. Al-Idrisi gives its height as about three hundred cubits, says fire burned in it day and night to guide ships, and that it was called Fanus. {cite:nuzhat-al-mushtaq-2002 p. 320}"
