status: { review: published, completeness: 3, generated_by: "Claude Haiku 5.5; the builder traditions, the tale of the treasure under the lighthouse, its height of more than 150 cubits (Ibn Abd al-Hakam), the mosque at its top, the dome of Ibn Tulun and the Baybars rebuilding of 673 AH are read from al-Maqrizi's Khitat (local scan, pp. 476, 478, 482). The Idrisi height of about 300 cubits (p. 320) conflicts with the Khitat's 150 and is kept as a labelled report; the Umari passage (p. 241) keeps its citation" }
