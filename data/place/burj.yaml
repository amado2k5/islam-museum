summary:
  ar: "مدينة كبيرة جليلة بنيانها بالآجر والجص، يقصدها تجار الصين وفرضة لمن جاء من السند، وتبعد عن نهروارة ثماني مراحل. {cite:nuzhat-al-mushtaq-2002 p. 187}"
  en: "A large, handsome city of fired brick and lime, visited by Chinese merchants and a port for ships from Sind, eight stages from Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 187}"
  es: "Una ciudad grande y hermosa, construida con ladrillos cocidos y cal, visitada por comerciantes chinos y puerto para barcos procedentes de Sind, a ocho etapas de Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 187}"
  fr: "Une grande et belle ville en briques cuites et chaux, fréquentée par des marchands chinois et servant de port pour les navires en provenance du Sind, à huit étapes de Nahrawara. {cite:nuzhat-al-mushtaq-2002 p. 187}"
  ur: "اینٹوں اور چونے کا ایک بڑا، خوبصورت شہر، جس کا دورہ چینی تاجروں نے کیا اور سندھ سے بحری جہازوں کے لیے ایک بندرگاہ، نہرواڑہ سے آٹھ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 187}"
  tr: "Tuğla ve sıvadan inşa edilmiş büyük ve görkemli bir şehir, Çinli tüccarların sıkça ziyaret ettiği ve Sindh'ten gelenler için bir sığınak olan Warwara Nehri'ne sekiz adım uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 187}"
  id: "Sebuah kota besar dan megah yang dibangun dari bata dan plester, sering dikunjungi oleh pedagang Tiongkok dan menjadi tempat perlindungan bagi mereka yang datang dari Sindh, dan berjarak delapan langkah dari Sungai Warwara. {cite:nuzhat-al-mushtaq-2002 hlm. 187}"
