label: { ar: "صندى فولات", en: "Sandi Fulat", es: "Sandi Fulat", fr: "Sandi Fulat", ur: "سینڈی فولات", tr: "kumlu folat", id: "Folat Pasir" }
summary:
  ar: "جزيرة عظيمة فيها مياه عذبة وزروع وأرز، ملكها يقال له زنبد، وأهلها يلبسون الفوط. تحيط بها من جهة الصين جبال وعرة، وهي باب من أبواب الصين، وتبعد عن جزيرة صنف عشرة أيام {cite:nuzhat-al-mushtaq-2002 p. 89}."
  en: "A large island with fresh water, crops and rice, ruled by a king named Zanbad, whose people wear cloth wraps. Rugged mountains on its China side make it one of the gates to China. Ten days from the island of Sanf {cite:nuzhat-al-mushtaq-2002 p. 89}."
  es: "Una gran isla con agua dulce, cultivos y arroz, gobernada por un rey llamado Zanbad, cuyos habitantes visten túnicas de tela. Las escarpadas montañas en su lado chino la convierten en una de las puertas de China. Diez días desde la isla de Sanf {cite:nuzhat-al-mushtaq-2002 p. 89}."
  fr: "Une grande île d'eau douce, cultivée et rizicole, gouvernée par un roi nommé Zanbad, dont les habitants portent des pagnes. Ses montagnes escarpées, côté chinois, en font l'une des portes d'entrée de la Chine. À dix jours de l'île de Sanf (source: nuzhat-al-mushtaq-2002, p. 89)."
  ur: "میٹھے پانی، فصلوں اور چاولوں والا ایک بڑا جزیرہ، جس پر زنبد نامی بادشاہ کی حکومت تھی، جس کے لوگ کپڑے کی چادر پہنتے ہیں۔ چین کی طرف ناہموار پہاڑ اسے چین کے دروازوں میں سے ایک بناتے ہیں۔ سنف جزیرہ سے دس دن {حوالہ: نزہت المشتاق-2002 ص۔ 89}۔"
  tr: "Tatlı su, ekinler ve sedir ağaçlarıyla büyük bir ada olan kralının adı Zanbad'dır ve halkı havlu giyer. Çin tarafında engebeli dağlarla çevrilidir, Çin'e açılan kapılardan biridir ve Zanif adasına on gün uzaklıktadır {cite:nuzhat-al-mushtaq-2002, s. 89}."
  id: "Sebuah pulau besar dengan air tawar, tanaman, dan cedar, rajanya disebut Zanbad, dan penduduknya mengenakan handuk. Pulau ini dikelilingi oleh pegunungan terjal di sisi Tiongkok, merupakan salah satu gerbang menuju Tiongkok, dan berjarak sepuluh hari dari pulau Zanif {cite:nuzhat-al-mushtaq-2002, hlm. 89}."
