summary:
  ar: "جزيرة عظيمة فيها مياه عذبة وزروع وأرز، ملكها يقال له زنبد، وأهلها يلبسون الفوط. تحيط بها من جهة الصين جبال وعرة، وهي باب من أبواب الصين، وتبعد عن جزيرة صنف عشرة أيام {cite:nuzhat-al-mushtaq-2002 p. 89}."
  en: "A large island with fresh water, crops and rice, ruled by a king named Zanbad, whose people wear cloth wraps. Rugged mountains on its China side make it one of the gates to China. Ten days from the island of Sanf {cite:nuzhat-al-mushtaq-2002 p. 89}."
