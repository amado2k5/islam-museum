label: { ar: "قاليقلا", en: "Qaliqala (Theodosiopolis/Erzurum)", es: "Qaliqala (Teodosiópolis/Erzurum)", fr: "Qaliqala (Théodosiopolis/Erzurum)" }
summary:
  ar: "قاليقلا من مدن أرمينية الثالثة في التقسيم المروي — أو الثانية — وكانت مركز فتوح أرمينية؛ يروي البلاذري أن امرأة ملّكت أرمينيافس بعد زوجها تسمّى قالي بنتها وسماها قاليقالة أي إحسان قالي وصُوّرت على باب من أبوابها فأعربتها العرب قاليقلا؛ فتحها حبيب بن مسلمة في خلافة عثمان على جلاء من شاء وجزية من بقي وأسكنها معاوية ألفي رجل مرابطة بقطائع، وظلت ممتنعة حتى أسقطها كوسان الأرمني سنة 133 بنقب أخوين من أهلها فهدمها، فردّها المنصور سنة 139 فادياً أسراها ومعمّراً وشارفاً جنداً، وأنفق المعتصم خمسمائة ألف درهم على تحصينها."
  en: "Qaliqala (Theodosiopolis, Erzurum), of Armenia III in the reported division — or II — and the seat of Armenia's conquests; al-Baladhuri relates that a woman who ruled Armeniakos after her husband, named Qali, built it calling it 'Qali's beneficence', her image on one of its gates, and the Arabs arabised it Qaliqala; Habib ibn Maslama took it in Uthman's caliphate on departure-who-willed and jizya for who stayed, Mu'awiya garrisoning it with two thousand men on land-grants; it stayed defiant until Kusan the Armenian brought it down in year 133 through two brothers' tunnel under its wall and demolished it; al-Mansur restored it in year 139 ransoming its captives, settling and garrisoning it, and al-Mu'tasim spent five hundred thousand dirhams on its fortification."
  es: "Qaliqala (Teodosiópolis, Erzurum), de Armenia III en la división reportada — o II — y sede de las conquistas de Armenia; al-Baladhuri relata que una mujer que gobernó Armeniakos después de su esposo, llamado Qali, la construyó llamándola 'la beneficencia de Qali', su imagen en una de sus puertas, y los árabes la arabizaron Qaliqala; Habib ibn Maslama la tomó en el califato de Uthman en partida para quien quisiera y jizya para quien se quedara, Mu'awiya la guarneció con dos mil hombres en concesiones de tierras; se mantuvo desafiante hasta que Kusan el Armenio la derribó en el año 133 a través de un túnel de dos hermanos bajo su muralla y la demolió; al-Mansur la restauró en el año 139 rescatando a sus cautivos, asentándose y guarneciéndola, y al-Mu'tasim gastó quinientos mil dirhams en su fortificación."
  fr: "Qaliqala (Théodosiopolis, Erzurum), de la IIIe division d'Arménie (ou II) selon la tradition, fut le siège des conquêtes arméniennes. Al-Baladhuri rapporte qu'une femme, ayant régné sur Armeniakos après son époux nommé Qali, la fit construire sous le nom de « Bienfaisance de Qali », son effigie figurant sur l'une de ses portes. Les Arabes la baptisèrent Qaliqala. Habib ibn Maslama s'en empara sous le califat d'Uthman, selon le principe du « départ de qui le voulait » et de la jizya pour ceux qui restaient. Mu'awiya y installa une garnison de deux mille hommes, grâce à des concessions de terres. La ville résista jusqu'à ce que Kusan l'Arménien la réduise à néant en 133 av. J.-C., par un tunnel creusé par deux frères sous ses remparts. Al-Mansur la restaura en 139 av. J.-C., rachetant ses captifs, s'y installant et y établissant une garnison. Al-Mu'tasim dépensa cinq cent mille dirhams pour sa fortification."
