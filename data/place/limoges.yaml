  ar: "مدينة حسنة حصينة ذات خيرات وعمارات ظاهرة وزراعات ظائلة، وهي قاعدة إقليم أنجو، ومنها إلى مدينة منت لشون ستون ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 741}"
  en: "A fine, strong city with abundant produce, conspicuous buildings and wide cultivation; capital of the Anjou district, sixty miles from Mont Lichon. {cite:nuzhat-al-mushtaq-2002 p. 741}"
  es: "Una ciudad hermosa y fuerte, con abundante producción agrícola, edificios notables y extensos cultivos; capital del distrito de Anjou, a sesenta millas del Mont Lichon. {cite:nuzhat-al-mushtaq-2002 p. 741}"
  fr: "Une belle et forte ville aux abondantes productions agricoles, aux édifices remarquables et aux vastes terres cultivées; capitale du district d’Anjou, à soixante milles du mont Lichon. {cite:nuzhat-al-mushtaq-2002 p. 741}"
  ur: "ایک عمدہ، مضبوط شہر جس میں وافر پیداوار، نمایاں عمارتیں اور وسیع کھیتی؛ انجو ضلع کا دارالحکومت، مونٹ لیچون سے ساٹھ میل دور۔ {حوالہ: نزہت المشتاق-2002 ص۔ 741}"
