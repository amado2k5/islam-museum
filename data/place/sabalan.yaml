summary:
  ar: "جبل عظيم بأذربيجان فيه أكراد سبلان؛ اشترط صلح حذيفة ألّا يعرض لأكراد البلاسجان وسبلان وساترودان."
  en: "Azerbaijan's great mountain holding the Sabalan Kurds; Hudhayfa's treaty barred exposing the land to the Kurds of Balasajan, Sabalan and Satrudan."
  es: "La gran montaña de Azerbaiyán donde habitan los kurdos de Sabalan; el tratado de Hudhayfa prohibió que los kurdos de Balasajan, Sabalan y Satrudan accedieran a ese territorio."
  fr: "La grande montagne d'Azerbaïdjan, refuge des Kurdes de Sabalan; le traité d'Hudhayfa interdisait de livrer ces terres aux Kurdes de Balasajan, Sabalan et Satrudan."
  ur: "آذربائیجان کا عظیم پہاڑ جس پر سبلان کرد ہیں؛ حذیفہ کے معاہدے نے بالساجان، سبلان اور سترودان کے کردوں کے لیے زمین کو ظاہر کرنے سے روک دیا۔"
  tr: "Azerbaycan'da Siblan Kürtlerinin yaşadığı büyük bir dağ, Hudayfa Antlaşması'nın Belasjan, Siblan ve Satrudan Kürtlerine teslim edilmemesi şartıydı."
  id: "Sebuah gunung besar di Azerbaijan yang dihuni oleh orang Kurdi Siblan adalah syarat bahwa Perjanjian Hudhayfa tidak akan diserahkan kepada orang Kurdi Belasjan, Siblan, dan Satrudan."
