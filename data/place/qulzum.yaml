label: { ar: "القلزم", en: "al-Qulzum", es: "al-Qulzum", fr: "al-Qulzum", ur: "القلم", tr: "El-Kalzam", id: "Al-Qalzam" }
summary:
  ar: "عند البلاذري: بحر وطريق ولّاه المتوكل محمد بن عبد الله القمي مع المعدن بمصر وطريق الحجاز وحمل منه الميرة في المراكب إلى بلاد البجة. وعلى ميل منها الموضع المعروف بذنب التمساح حيث حفر ملك من الروم طريقاً نحو بحر الروم فلم يتصل لارتفاع القلزم، عليه قنطرة عظيمة تعبرها قوافل حج مصر {cite:muruj-al-dhahab p. 558}"
  en: "In al-Baladhuri: a sea and route al-Mutawakkil gave Muhammad ibn Abdallah al-Qummi together with Egypt's mine and the Hijaz road; provisions were carried from it in ships to the Buja lands."
  es: "En al-Baladhuri: un mar y una ruta que al-Mutawakkil le dio a Muhammad ibn Abdallah al-Qummi junto con la mina de Egipto y el camino del Hiyaz; desde allí se transportaban provisiones en barcos a las tierras de Buja."
  fr: "Dans al-Baladhuri: une mer et une route qu'al-Mutawakkil a données à Muhammad ibn Abdallah al-Qummi avec la mine d'Égypte et la route du Hedjaz; des provisions étaient transportées de là par bateau vers les terres de Buja."
  ur: "البلادوری میں ہے: ایک سمندر اور راستہ المتوکل نے محمد بن عبداللہ القمی کو مصر کی کان اور حجاز کی سڑک کے ساتھ مل کر دیا۔ اس سے سامان بحری جہازوں میں بوجا سرزمین تک پہنچایا جاتا تھا۔"
  tr: "al-Baladhuri'ye göre: al-Mutawakkil Mutawakkil Muhammed ibn Abdullah al-Qummi tarafından belirlenen bir deniz ve güzergah ile Mısır'daki el-Ma'dan ile Hicaz rotası, mirahın tekneyle Bjeh topraklarına taşındığı güzergah. Buradan hafif bir yerde, Roma kralının Roma denizine doğru bir yol kazdığı ancak Qalzam'ın yüksekliğine bağlanmadığı Timsah Kuyruğu olarak bilinen yer yer vardır. Mısır'a hac yolculuğunun kervanlarının geçtiği büyük bir köprü vardır {cite:muruj-al-dhahab, s. 558}"
  id: "Menurut al-Baladhuri: sebuah laut dan rute yang ditetapkan oleh al-Mutawakkil Muhammad ibn Abdullah al-Qummi dengan al-Ma'dan di Mesir dan rute Hijaz, dari mana mirah dibawa dengan perahu ke tanah Bjeh. Sedikit dari sana terdapat tempat yang dikenal sebagai Ekor Buaya, di mana seorang raja Romawi menggali jalan menuju laut Romawi tetapi tidak terhubung ke puncak Qalzam. Kota ini memiliki jembatan besar yang dilintasi oleh kafilah ziarah ke Mesir {cite:muruj-al-dhahab, hlm. 558}"
