summary:
  ar: مدينة صغيرة على البحر لا سور لها، فيها حمام وفندق وماء كثير، ويصب بغربيها نهر كبير منبعه من جبل شلير. {cite:nuzhat-al-mushtaq-2002 p. 564}
  en: A small coastal town with no wall, having a bath, an inn and plentiful water; a large river to its west, which the author says rises in the Shilir mountain, reaches the sea here. {cite:nuzhat-al-mushtaq-2002 p. 564}
  es: "Un pequeño pueblo costero sin murallas, con baños, posada y agua en abundancia; un gran río al oeste, que según el autor nace en la montaña Shilir, desemboca aquí en el mar. {cite:nuzhat-al-mushtaq-2002 p. 564}"
  fr: "Une petite ville côtière sans remparts, dotée de bains publics, d'une auberge et d'eau en abondance; un grand fleuve à l'ouest, qui, selon l'auteur, prend sa source dans le mont Shilir, se jette à la mer à cet endroit. {cite:nuzhat-al-mushtaq-2002 p. 564}"
  ur: "ایک چھوٹا سا ساحلی شہر جس میں کوئی دیوار نہیں، نہانے کے لیے ایک سرائے اور وافر پانی ہے۔ اس کے مغرب میں ایک بڑا دریا، جسے مصنف کے مطابق شلیر پہاڑ سے نکلتا ہے، یہاں سمندر تک پہنچتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 564}"
