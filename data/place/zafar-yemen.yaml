summary:
  ar: "مدينة على ساحل البحر الهندي، وهي آخر بلاد اليمن على هذا الساحل عند ابن بطوطة، ومنها تحمل الخيل العتاق إلى الهند؛ وقد سماها «ظفار الحموض» ⁦(الرحلة، الطبعة 1958م، ص 159، والطبعة 1904م ص 199، والطبعة 2021م ص 267)⁩."
  en: "A city on the coast of the Indian Ocean, the last of Yemen's lands on this coast according to Ibn Battuta, from which purebred horses are carried to India. He calls it 'Zafar al-Hamus' (Rihla, 1958 edition, p. 159; 1904 edition, p. 199; 2021 edition, p. 267)."
  es: "Una ciudad en la costa del Océano Índico, el último territorio yemení en esta costa según Ibn Battuta, desde donde se transportaban caballos de pura raza a la India. Él la llama 'Zafar al-Hamus' (Rihla, edición de 1958, pág. 159; edición de 1904, pág. 199; edición de 2021, pág. 267)."
  fr: "Ville côtière de l'océan Indien, Zafar al-Hamus est, selon Ibn Battuta, la dernière terre du Yémen sur cette côte, d'où sont acheminés vers l'Inde des chevaux de race pure. Il la nomme « Zafar al-Hamus » (Rihla, édition de 1958, p. 159; édition de 1904, p. 199; édition de 2021, p. 267)."
  ur: "بحر ہند کے ساحل پر واقع ایک شہر، ابن بطوطہ کے مطابق اس ساحل پر یمن کی آخری سرزمین ہے، جہاں سے خالص نسل کے گھوڑے ہندوستان لے جاتے ہیں۔ وہ اسے 'ظفر الحمس' کہتے ہیں ⁦(رحلہ، 1958 ایڈیشن، صفحہ 159؛ 1904 ایڈیشن، صفحہ 199؛ 2021 ایڈیشن، صفحہ 267)⁩۔"
