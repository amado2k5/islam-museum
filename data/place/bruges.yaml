summary:
  ar: "مدينة متوسطة متحضرة كثيرة المرافق رخيصة الأسعار، متصلة الكروم والجروت والخيرات، تبعد عن قنط غربا خمسة عشر ميلا {cite:nuzhat-al-mushtaq-2002 p. 871}، وعن صنقلة على البحر ثلاثين ميلا شمالا {cite:nuzhat-al-mushtaq-2002 p. 871}."
  en: "A medium-sized, civilised city with many amenities and low prices, fifteen miles west of Ghent {cite:nuzhat-al-mushtaq-2002 p. 871}, and thirty miles north of the coastal place Ṣanqala {cite:nuzhat-al-mushtaq-2002 p. 871}."
  es: "Una ciudad civilizada de tamaño mediano con muchas comodidades y precios bajos, a quince millas al oeste de Gante {cite:nuzhat-al-mushtaq-2002 p. 871} y a treinta millas al norte de la localidad costera de Ṣanqala {cite:nuzhat-al-mushtaq-2002 p. 871}."
  fr: "Une ville de taille moyenne, civilisée, avec de nombreuses commodités et des prix bas, à quinze miles à l'ouest de Gand {cite:nuzhat-al-mushtaq-2002 p. 871}, et à trente miles au nord de la ville côtière de Ṣanqala {cite:nuzhat-al-mushtaq-2002 p. 871}."
  ur: "ایک درمیانے درجے کا، مہذب شہر جس میں بہت سی سہولیات اور کم قیمتیں ہیں، گھنٹ سے پندرہ میل مغرب میں {حوالہ: نزہت المشتاق-2002 صفحہ 871}، اور ساحلی مقام صنقل سے تیس میل شمال میں {حوالہ: نزہت المشتاق-2002 ص 871}۔"
