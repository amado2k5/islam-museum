summary:
  ar: جبل قرب شبام في اليمن، صعده الهادي سنة 288هـ حين خرج عليه المخالفون، ويقول المحقق إنه لم يجده في كتب الجغرافيين وإن الهمداني يذكر جبل ذخار في وادي مور.
  en: A mountain near Shibam in Yemen that al-Hadi climbed in 288 AH when his opponents rose against him; the editor did not find it in the geographers but notes al-Hamdani's Jabal Dhukhar in Wadi Mawr.
  ur: یمن میں شبام کے قریب ایک پہاڑ جس پر ہادی 288ھ میں مخالفوں کے اٹھ کھڑے ہونے پر چڑھے؛ مرتب کو یہ جغرافیہ دانوں کی کتابوں میں نہیں ملا مگر وہ ہمدانی کے وادی مور کے جبل ذخار کا ذکر کرتا ہے۔
  es: "Una montaña cerca de Shibam, en Yemen, que al-Hadi escaló en el año 288 de la Hégira cuando sus oponentes se alzaron contra él; el editor no la encontró en la lista de geógrafos, pero menciona el Jabal Dhukhar de al-Hamdani en Wadi Mawr."
  fr: "Une montagne près de Shibam au Yémen qu'al-Hadi a escaladée en 288 AH lorsque ses opposants se sont soulevés contre lui; l'éditeur ne l'a pas trouvée chez les géographes mais note le Jabal Dhukhar d'al-Hamdani dans le Wadi Mawr."
  tr: "Yemen'de Shibam yakınlarında bir dağ, al-Hadi'nin 288 Hicri yılında muhalifler isyan ettiğinde tırmandığı bir dağ. Doğrulayıcı, bunu coğrafyacıların kitaplarında bulmadığını söyler ve el-Hamdani Wadi Mur'da Cebel Dhikhar'dan bahseder."
  id: "Sebuah gunung dekat Shibam di Yaman, yang didaki al-Hadi pada tahun 288 H ketika para penentang memberontak. Verifier mengatakan ia tidak menemukannya dalam buku-buku ahli geografi, dan al-Hamdani menyebutkan Jabal Dhikhar di Wadi Mur."
