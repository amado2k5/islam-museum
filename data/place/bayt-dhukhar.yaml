summary:
  ar: جبل قرب شبام في اليمن، صعده الهادي سنة 288هـ حين خرج عليه المخالفون، ويقول المحقق إنه لم يجده في كتب الجغرافيين وإن الهمداني يذكر جبل ذخار في وادي مور.
  en: A mountain near Shibam in Yemen that al-Hadi climbed in 288 AH when his opponents rose against him; the editor did not find it in the geographers but notes al-Hamdani's Jabal Dhukhar in Wadi Mawr.
  ur: یمن میں شبام کے قریب ایک پہاڑ جس پر ہادی 288ھ میں مخالفوں کے اٹھ کھڑے ہونے پر چڑھے؛ مرتب کو یہ جغرافیہ دانوں کی کتابوں میں نہیں ملا مگر وہ ہمدانی کے وادی مور کے جبل ذخار کا ذکر کرتا ہے۔
