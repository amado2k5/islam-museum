summary:
  ar: "مدينة مشهورة بين بلاد الهند، يميز الإدريسي بين قشمير الداخلة وقشمير الخارجة، وتبعد عن كارموت أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 193}"
  en: "A famous city among the lands of India; al-Idrisi distinguishes Inner and Outer Qashmir, and gives four stages from it to Qarmut. {cite:nuzhat-al-mushtaq-2002 p. 193}"
  es: "Una ciudad famosa entre las tierras de la India; al-Idrisi distingue entre Qashmir Interior y Exterior, y describe cuatro etapas desde allí hasta Qarmut. {cite:nuzhat-al-mushtaq-2002 p. 193}"
  fr: "Ville célèbre parmi les terres de l'Inde, Qarmut est distinguée, selon al-Idrisi, par le Qashmir intérieur et extérieur, et par quatre étapes depuis Qarmut. {cite:nuzhat-al-mushtaq-2002 p. 193}"
  ur: "ہندوستان کی سرزمینوں میں ایک مشہور شہر؛ الادریسی نے اندرونی اور بیرونی کشمیر میں فرق کیا ہے اور اس سے قرموت تک چار مراحل بتائے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 193}"
  tr: "Hindistan'ın ünlü şehri olan Al-Idrisi, Dakhla'nın Keşmir'i ile Kharga'nın Keşmir'i arasında ayrım yapar ve Karmut'a dört adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 193}"
  id: "Kota terkenal di India, Al-Idrisi membedakan antara Kashmir Dakhla dan Kashmir Kharga, dan jaraknya empat langkah dari Karmut. {cite:Nuzhat-al-Mushtaq-2002 hlm. 193}"
