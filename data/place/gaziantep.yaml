summary:
  ar: "مدينة في جنوب شرق الأناضول، كانت تُسمى عينتاب، ومركز ولاية تحمل اسمها؛ كانت ذات أهمية منذ العصر الحمداني، وصارت تحت الحكم العثماني في القرن السادس عشر {cite:encyclopaedia-of-islam-2 vol. 1 p. 840}."
  en: "City in south-east Anatolia, formerly 'Aynṭab, chief town of a vilayet. It was important from the Hamdanid period and under Ottoman rule from the sixteenth century {cite:encyclopaedia-of-islam-2 vol. 1 p. 840}."
  es: "Ciudad en el sureste de Anatolia, antiguamente 'Aynṭab, capital de un vilayato. Fue importante desde el período hamdánida y bajo dominio otomano desde el siglo XVI {cite:encyclopaedia-of-islam-2 vol. 1 p. 840}."
  fr: "Ville du sud-est de l'Anatolie, anciennement 'Aynṭab, chef-lieu d'un vilayet. Elle joua un rôle important dès la période hamdanide et fut sous domination ottomane à partir du XVIe siècle {cite:encyclopaedia-of-islam-2 vol. 1 p. 840}."
  ur: "جنوب مشرقی اناطولیہ کا شہر، پہلے 'عینطاب'، ولایت کا مرکزی شہر۔ یہ ہمدانی دور سے اور سولہویں صدی سے عثمانی حکومت کے تحت اہم تھا۔ 1 ص۔ 840}۔"
  tr: "Güneydoğu Anadolu'da bir şehir, bir zamanlar Ayntab olarak adlandırılan ve adını taşıyan bir eyaletin merkezi; Hamdanî döneminden beri önemliydi ve on altıncı yüzyılda Osmanlı yönetimine girdi {cite:encyclopaedia-of-Islam-2 cilt 1, s. 840}."
  id: "Sebuah kota di tenggara Anatolia, yang dulu disebut Ayntab, dan merupakan pusat provinsi yang menggunakan nama tersebut; kota ini penting sejak era Hamdanid dan berada di bawah kekuasaan Ottoman pada abad keenam belas {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 840}."
