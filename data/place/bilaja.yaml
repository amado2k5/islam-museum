  ur: "قصر ابن منقود سے پندرہ میل کے فاصلے پر دریائے القریب کے قریب ایک مضبوط، بلند اور محافظ گڑھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 609}"
  tr: "Qarib Nehri yakınında, sağlam bir kale ve yüksek, iyi korunmuş bir kale ve İbn Mankoud'un sarayına on beş mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 609}"
  id: "Benteng yang diperkuat dan benteng tinggi yang terawat baik, dekat Sungai Qarib, dan berjarak lima belas mil dari istana Ibn Mankoud. {cite:Nuzhat-al-Mushtaq-2002 hlm. 609}"
