  ar: "حصن حصين ومعقل شامخ مصون، يقرب منه نهر القارب، وتبعد عن قصر ابن منكود خمسة عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 609}"
  en: "A strong, lofty and guarded stronghold near the river al-Qarib, fifteen miles from Qasr Ibn Mankud. {cite:nuzhat-al-mushtaq-2002 p. 609}"
