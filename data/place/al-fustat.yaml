education:
  did_you_know:
    ar: "سماها المسلمون الفسطاط لقولهم «فسطاط القوم» أي مجمعهم؛ ووصفها المقدسي نحو ٣٧٥هـ بأن دورها أربع طبقات تسكن الدار الواحدة نحو مائتي نفس."
    en: "The Muslims named it al-Fustat from 'the people's pavilion' — their gathering place; al-Muqaddasi around 375 AH saw houses of four or five floors, each sheltering some two hundred souls."
    ur: "مسلمانوں نے اسے «فسطاط» کہا یعنی لوگوں کا ڈیرہ اور مجمع؛ مقدسی نے تقریباً 375ھ میں دیکھا کہ اس کے گھر چار پنج منزلہ ہیں اور ہر گھر میں تقریباً دو سو افراد رہتے ہیں۔"
    sources: [source/futuh-buldan-maarif-1407, source/ahsan-al-taqasim]
