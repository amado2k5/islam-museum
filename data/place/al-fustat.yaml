summary:
  ar: 'الفسطاط عند البلاذري: كانت المدينة تسمى اليونة فسمّاها المسلمون فسطاطاً لقولهم هذا فسطاط القوم ومجمعهم — وقوم قالوا
    لأن عمرو ضرب بها فسطاطاً؛ نزلها عمرو بجنان الريحان وقد خندق أهلها وصعد الزبير حصنها بالسلّم مجرداً سيفه ففُتح عنوة، واختطّ
    بها الزبير وبنى دارها المعروفة التي نزلها عبد الله بن الزبير حين غزا إفريقية، وجعلت جزيتها دينارين على الحالم إلا فقيراً
    وأرضها أرض خراج. وعند المسعودي أن بعض الأهرام التي ببلاد مصر ترى من الفسطاط على أميال منها {cite:muruj-al-dhahab p. 542}.
    وسماها المقدسي الذي حلّ بها نحو 375هـ «مصرَ مصر وناسخ بغداد ومفخر الإسلام ومتجر الأنام وخزانة المغرب ومطرح المشرق»، دورها
    أربع طبقات وخمس كالمناير تسكن الدار الواحدة نحو مائتي نفس، ويصلي قدام الإمام يوم الجمعة نحو عشرة آلاف، وروى أن مراكب ساحلها
    لو ذهبت إلى بلد لحملت أهله وآلاته وحجارته {cite:ahsan-al-taqasim pp. 162-163}. وتحفظ قاعدة البرديات العربية وثائق صادرة
    من الفسطاط نفسه تعود إلى ٨٠١–٩٠٠م: بيع دار وإيجار حجرة في حوش وقائمة أجور لعقارات مدنية — شواهد ورقية على عمارة المدينة
    اليومية {cite:apd P.Michael.inv. B 937} {cite:apd P.Michael.inv. B 327} {cite:apd P.Michael.inv. CQ 37}'
  en: 'Al-Fustat in al-Baladhuri: the city had been called al-Yuna, renamed al-Fustat by the Muslims as ''the people''s encampment
    and gathering'' — or, some say, for the tent Amr pitched there; Amr camped at Jinan al-Rayhan while its folk ditched,
    and al-Zubayr scaled its fortress by ladder bare-sworded until it fell by force; al-Zubayr laid his khitta there and built
    his famous house — the one Abdallah ibn al-Zubayr later lodged in when raiding Ifriqiya — its jizya set at two dinars
    per free man save the poor, its land made kharaj-land. The Arabic Papyrology Database preserves documents issued at Fustat
    itself, dated within 801–900 CE — the sale of a house, the lease of a room in an enclosure, and a rent roll of urban properties
    — everyday paper evidence of the city''s housing {cite:apd P.Michael.inv. B 937} {cite:apd P.Michael.inv. B 327} {cite:apd
    P.Michael.inv. CQ 37}.'
  es: "Al-Fustat en al-Baladhuri: la ciudad se llamaba al-Yuna, rebautizada como al-Fustat por los musulmanes como 'el campamento y reunión del pueblo', o, según algunos, por la tienda que Amr plantó allí; Amr acampó en Jinan al-Rayhan mientras su gente huía, y al-Zubayr escaló su fortaleza por una escalera con la espada descubierta hasta que cayó por la fuerza; al-Zubayr estableció allí su khitta y construyó su famosa casa, aquella en la que Abdallah ibn al-Zubayr se alojó más tarde cuando asaltó Ifriqiya; su jizya se fijó en dos dinares por hombre libre, excepto los pobres, y su tierra se convirtió en kharaj-land. La base de datos de papirología árabe conserva documentos emitidos en la propia Fustat, fechados entre 801 y 900 d. C.: la venta de una casa, el arrendamiento de una habitación en un recinto y un registro de alquileres de propiedades urbanas; evidencia en papel cotidiana de la vivienda de la ciudad {cite:apd P.Michael.inv. B 937} {cite:apd P.Michael.inv. B 327} {cite:apd P.Michael.inv. CQ 37}."
  fr: "Al-Fustat dans al-Baladhuri: la ville s’appelait autrefois al-Yuna, rebaptisée al-Fustat par les musulmans, signifiant « le campement et le rassemblement du peuple » – ou, selon certains, en référence à la tente qu’Amr y dressa. Amr campa à Jinan al-Rayhan tandis que ses habitants creusaient des fossés, et al-Zubayr escalada sa forteresse à l’aide d’une échelle, l’épée à la main, jusqu’à ce qu’elle tombe de force. Al-Zubayr y établit sa khitta et y construisit sa célèbre maison – celle où Abdallah ibn al-Zubayr logea plus tard lors d’un raid sur Ifriqiya – la jizya y fut fixée à deux dinars par homme libre, à l’exception des pauvres, et ses terres devinrent des terres kharaj. La base de données de papyrologie arabe conserve des documents émis à Fustat même, datés entre 801 et 900 de notre ère: la vente d’une maison, la location d’une pièce dans un enclos et un registre des loyers des propriétés urbaines – autant de témoignages papier quotidiens du logement dans la ville. B 937} {cite:apd P.Michael.inv. B 327} {cite:apd P.Michael.inv. CQ 37}."
  ur: "البلادھوری میں الفستط: اس شہر کو الیونا کہا گیا تھا، جسے مسلمانوں نے الفستات کا نام 'لوگوں کا پڑاؤ اور اجتماع' رکھ دیا - یا بعض کہتے ہیں کہ وہاں خیمہ عمرو لگایا گیا تھا۔ عمرو نے جنان الریحان میں ڈیرہ ڈالا جب کہ اس کے لوگ کھود رہے تھے، اور الزبیر نے ننگی تلوار سے سیڑھی سے اس کے قلعے کو بڑھایا یہاں تک کہ وہ زبردستی گر گیا۔ الزبیر نے اپنا کھٹہ وہیں بچھا دیا اور اپنا مشہور گھر بنایا - جسے عبداللہ ابن الزبیر نے بعد میں افریقیہ پر چڑھائی کرتے وقت قیام کیا - اس کا جزیہ غریبوں کو بچانے کے لیے دو دینار فی آزاد مقرر کیا گیا، اس کی زمین کو خرج زمین بنا دیا۔ عربی پیپرولوجی ڈیٹا بیس خود فوسٹیٹ میں جاری کردہ دستاویزات کو محفوظ رکھتا ہے، جن کی تاریخ 801-900 عیسوی کے اندر ہے — ایک مکان کی فروخت، ایک دیوار میں ایک کمرے کا لیز، اور شہری املاک کا کرایہ — شہر کی رہائش کے روزمرہ کے کاغذی ثبوت {cite:apd P.Michael.inv. B 937} {حوالہ:apd P.Michael.inv. B 327} {حوالہ:apd P.Michael.inv. CQ 37}۔"
