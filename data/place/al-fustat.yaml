summary:
  ar: "الفسطاط عند البلاذري: كانت المدينة تسمى اليونة فسمّاها المسلمون فسطاطاً لقولهم هذا فسطاط القوم ومجمعهم — وقوم قالوا لأن عمرو ضرب بها فسطاطاً؛ نزلها عمرو بجنان الريحان وقد خندق أهلها وصعد الزبير حصنها بالسلّم مجرداً سيفه ففُتح عنوة، واختطّ بها الزبير وبنى دارها المعروفة التي نزلها عبد الله بن الزبير حين غزا إفريقية، وجعلت جزيتها دينارين على الحالم إلا فقيراً وأرضها أرض خراج."
  en: "Al-Fustat in al-Baladhuri: the city had been called al-Yuna, renamed al-Fustat by the Muslims as 'the people's encampment and gathering' — or, some say, for the tent Amr pitched there; Amr camped at Jinan al-Rayhan while its folk ditched, and al-Zubayr scaled its fortress by ladder bare-sworded until it fell by force; al-Zubayr laid his khitta there and built his famous house — the one Abdallah ibn al-Zubayr later lodged in when raiding Ifriqiya — its jizya set at two dinars per free man save the poor, its land made kharaj-land."
