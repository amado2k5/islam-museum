  tr: "Alaf'ta bir kale ve köy, Aquilinler ve El-Rabi'ah'ın sertlikleri nedeniyle kimsenin ulaşamayacağını düşündükleri için el-Hadi'nin emriyle yıkıldı ve yakıldı."
  id: "Sebuah benteng dan desa di Alaf yang menurut keluarga Aquilin dan Al-Rabi'ah tidak bisa dijangkau oleh siapa pun karena kekasarannya, sehingga benteng itu dihancurkan dan dibakar atas perintah al-Hadi."
