summary:
  ar: "مدينة بفارس؛ عند البلاذري بقيت هي وإصطخر غير مفتوحتين من فارس لما قدم عبد الله بن عامر البصرة سنة 29. وعند المسعودي أن بها بيتاً للنار بناه أردشير بن بابك على عين عجيبة له عيد وهو أحد متنزهات فارس قال المسعودي وقد رأيته، وفي وسط المدينة بنيان كانت تعظمه الفرس يقال له الطربال أخرّ به المسلمون، وبينها وبين مدينة كوار عشرة فراسخ وبها يعمل ماء الورد الجوري والكواري أطيب ماء ورد يعمل في العالم {cite:muruj-al-dhahab p. 551}"
  en: "a city of Fars; in al-Baladhuri it and Istakhr alone unconquered at Abdallah ibn Amir's arrival in year 29."
  es: "una ciudad de Fars; en al-Baladhuri, solo ella e Istakhr permanecían invictas a la llegada de Abdallah ibn Amir en el año 29."
  fr: "une ville de Fars; à al-Baladhuri, elle et Istakhr étaient les seules invaincues à l'arrivée d'Abdallah ibn Amir en l'an 29."
  ur: "فارس کا ایک شہر؛ البلادھوری میں اور 29 میں عبداللہ بن عامر کی آمد پر اکیلے استخارہ کو فتح نہیں ہوئی۔"
  tr: "Fars'ta bir şehir; el-Baladhuri'ye göre, Abdullah ibn Amir 29. yılda Basra'ya geldiğinde Persler tarafından fethedilmemiş kalmıştır. El-Mes'udi'ye göre, Erdeşir bin Babik tarafından garip bir pınarın üzerine bir ateş evi inşa edilmiştir ve festivali vardır ve burası Pers'in parklarından biridir. El-Mes'udi şöyle demiştir: 'Gördüm.' Şehrin merkezinde, Müslümanların inşa etmek için kullandığı, bir zamanlar Persler tarafından saygı duyulan Tarbal adlı bir bina vardı. Kuwar şehri ile arasında on farsakh vardır ve gül suyu üretir, el-Kuvari ise dünyanın en güzel gül suyunu üretir {atıf:Muruj-al-Dhahab, s. 551}"
  id: "Sebuah kota di Fars; menurut al-Baladhuri, kota ini dan Istakhr tetap belum ditaklukkan dari Persia ketika Abdullah ibn Amir tiba di Basra pada tahun 29. Menurut al-Mas'udi, ada sebuah rumah api yang dibangun oleh Ardashir ibn Babik di sebuah mata air aneh yang memiliki festival, dan itu adalah salah satu taman di Persia. Al-Mas'udi berkata, 'Aku telah melihatnya.' Di pusat kota, terdapat sebuah bangunan yang dulu dihormati oleh orang Persia yang disebut Tarbal, yang digunakan umat Muslim untuk membangunnya. Di antara bangunan itu dan kota Kuwar terdapat sepuluh farsakh, yang menghasilkan air mawar, dan al-Kuwari menghasilkan air mawar terbaik di dunia {cite:muruj-al-dhahab, hlm. 551}"
