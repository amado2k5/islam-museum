summary:
  ar: "مدينة بفارس؛ عند البلاذري بقيت هي وإصطخر غير مفتوحتين من فارس لما قدم عبد الله بن عامر البصرة سنة 29. وعند المسعودي أن بها بيتاً للنار بناه أردشير بن بابك على عين عجيبة له عيد وهو أحد متنزهات فارس قال المسعودي وقد رأيته، وفي وسط المدينة بنيان كانت تعظمه الفرس يقال له الطربال أخرّ به المسلمون، وبينها وبين مدينة كوار عشرة فراسخ وبها يعمل ماء الورد الجوري والكواري أطيب ماء ورد يعمل في العالم {cite:muruj-al-dhahab p. 551}"
  en: "a city of Fars; in al-Baladhuri it and Istakhr alone unconquered at Abdallah ibn Amir's arrival in year 29."
