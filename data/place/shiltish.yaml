summary:
  ar: "مدينة على جزيرة طولها نحو ميل، ليس لها سور ولا حظيرة، ولها سوق، وبها صناعة الحديد وصنعة المراسي التي ترسى بها السفن، وتبعد عن لبلة ذراعاً من البحر. {cite:nuzhat-al-mushtaq-2002 p. 542}"
  en: "A town on an island about a mile long, without a wall or enclosure, with a market and an ironworking trade that makes the anchors used by ships; it lies by the sea near Labla. {cite:nuzhat-al-mushtaq-2002 p. 542}"
  es: "Un pueblo situado en una isla de aproximadamente una milla de largo, sin murallas ni recinto, con un mercado y un oficio de herrero que fabrica las anclas que usan los barcos; se encuentra junto al mar, cerca de Labla. {cite:nuzhat-al-mushtaq-2002 p. 542}"
  fr: "Une ville située sur une île d'environ un mille de long, sans muraille ni enceinte, avec un marché et une activité de travail du fer qui fabrique les ancres utilisées par les navires; elle se trouve en bord de mer, près de Labla. {cite:nuzhat-al-mushtaq-2002 p. 542}"
  ur: "ایک جزیرے پر ایک قصبہ تقریباً ایک میل لمبا، بغیر کسی دیوار یا دیوار کے، ایک بازار اور لوہے کی تجارت کے ساتھ جو جہازوں کے لنگر کو استعمال کرتا ہے۔ یہ لیبلا کے قریب سمندر کے کنارے واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 542}"
  tr: "Yaklaşık bir mil uzunluğunda, duvarı veya ahırı olmayan, bir pazarı olan, demir endüstrisi ve demirleme gemilerinin araçlarına sahip bir adada şehir ve denize bir kol mesafesinde yer alıyor. {cite:nuzhat-al-mushtaq-2002 s. 542}"
  id: "Sebuah kota di sebuah pulau sepanjang sekitar satu mil, tanpa tembok atau lumbung, dengan pasar, dan memiliki industri besi serta keterampilan kapal jangkar, serta terletak satu lengan dari laut. {cite:nuzhat-al-mushtaq-2002 hlm. 542}"
