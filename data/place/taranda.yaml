summary:
  ar: "طرندة حصنٌ واقعة في بلاد الروم على ثلاث مراحل من ملطية؛ نزلها المسلمون بعد أن غزاها عبد الله بن عبد الملك سنة 83 وبنوا بها مساكن، وكانت ملطية يومئذ خراباً فكانت تأتيهم طالعة من جند الجزيرة في الصيف فيقيمون بها حتى يسقط الثلج فيقفلون؛ ثم رحّل عمر بن عبد العزيز أهلها عنها وهم كارهون إشفاقاً عليهم من العدو فكسروا خوابي الخل والزيت وأنزلهم ملطية وأخرب طرندة."
  en: "Taranda (Taranta), a fortress lying in Byzantine country three stages from Malatya; the Muslims settled it after Abdallah ibn Abd al-Malik raided it in year 83, building dwellings while Malatya lay ruined — Jaziran troops coming up each summer to stay until the snows fell, then marching home; Umar ibn Abd al-Aziz removed its people against their will, fearing the enemy for them — they smashed their vinegar and oil jars — settled them in Malatya and demolished Taranda."
  es: "Taranda (Taranta), una fortaleza situada en territorio bizantino a tres etapas de Malatya; los musulmanes se asentaron allí después de que Abdallah ibn Abd al-Malik la saqueara en el año 83, construyendo viviendas mientras Malatya yacía en ruinas. Las tropas de Jazira llegaban cada verano para quedarse hasta que caían las nieves, y luego regresaban a casa. Umar ibn Abd al-Aziz expulsó a sus habitantes contra su voluntad, temiendo por ellos al enemigo; rompieron sus tinajas de vinagre y aceite, los reubicaron en Malatya y demolieron Taranda."
  fr: "Taranda (Taranta), une forteresse située en territoire byzantin à trois étapes de Malatya; les musulmans s'y installèrent après le raid d'Abdallah ibn Abd al-Malik en l'an 83, construisant des habitations tandis que Malatya était en ruines — les troupes jaziranes venaient chaque été y rester jusqu'aux premières neiges, puis rentraient chez elles; Umar ibn Abd al-Aziz en expulsa les habitants contre leur gré, craignant pour eux l'ennemi — ils brisèrent leurs jarres de vinaigre et d'huile — les installèrent à Malatya et détruisirent Taranda."
  ur: "ترنڈا ⁦(ترانٹا)⁩، بازنطینی ملک میں ملاٹیا سے تین مراحل پر واقع ایک قلعہ؛ مسلمانوں نے اسے آباد کیا جب عبداللہ بن عبد الملک نے سن 83 میں اس پر چڑھائی کی، مکانات تعمیر کیے جب کہ ملاتیا تباہ ہو گیا — ہر موسم گرما میں جازیران کی فوجیں برف گرنے تک قیام کرنے کے لیے آتی ہیں، پھر گھر کی طرف کوچ کرتی ہیں۔ عمر بن عبدالعزیز نے اپنے لوگوں کو ان کی مرضی کے خلاف ہٹا دیا، ان کے لیے دشمن کے خوف سے - انھوں نے ان کے سرکہ اور تیل کے برتنوں کو توڑ دیا - انھیں ملاتیا میں بسایا اور ترنڈا کو مسمار کردیا۔"
