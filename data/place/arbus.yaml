summary:
  ar: "مدينة في أرض منبسطة، فيها عيون ماء جارية لا تجف، ومن أشهر عيونها عين رباح، وفيها زعفران يضاهي الزعفران الأندلسي، وتبعد عن القيروان ثلاث مراحل. {cite:nuzhat-al-mushtaq-2002 p. 292}"
  en: "A city on level ground with running springs that never dry, including Ayn Rabah; its saffron rivals the Andalusian kind; three stages from Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 292}"
  es: "Una ciudad en terreno llano con manantiales que nunca se secan, incluyendo Ayn Rabah; su azafrán rivaliza con el andaluz; a tres etapas de Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 292}"
  fr: "Ville située en plaine, traversée de sources intarissables, dont Ayn Rabah; son safran rivalise avec celui d’Andalousie; à trois étapes de Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 292}"
  ur: "بہتے چشموں کے ساتھ سطح زمین پر ایک شہر جو کبھی خشک نہیں ہوتا، بشمول عین رباح؛ اس کا زعفران اندلس کی قسم کا حریف ہے۔ قیروان سے تین مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 292}"
  tr: "Düz arazide bir şehir, akan kaynakları hiç kurumaz. En ünlü kaynaklarından biri, Endülüs safranına benzer safran içeren Ain Rabah'tır ve Kairouan'a üç adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 292}"
  id: "Sebuah kota di tanah datar dengan mata air yang mengalir dan tidak pernah kering. Salah satu mata airnya yang paling terkenal adalah Ain Rabah, yang memiliki saffron sebanding dengan saffron Andalusia, dan berjarak tiga langkah dari Kairouan. {cite:nuzhat-al-mushtaq-2002 hlm. 292}"
