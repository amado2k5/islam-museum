summary:
  ar: "الكيرج مدينة بالسند؛ خرج إليها دوهر بن داهر فهزمه محمد بن القاسم ونزل أهلها على حكمه فقتل وسبى وبها صور أهل السند محمداً لما حمل مقيداً."
  en: "al-Kiraj of Sind; Duhar's sally broken, it yielded on terms — and here Sind's folk painted Muhammad ibn al-Qasim when he was carried bound."
  es: "al-Kiraj de Sind; la salida de Duhar se rompió, cedió bajo ciertas condiciones, y aquí la gente de Sind pintó a Muhammad ibn al-Qasim cuando lo llevaban atado."
  fr: "al-Kiraj du Sind; la sortie de Duhar brisée, elle céda à ses conditions — et c'est là que les habitants du Sind peignirent Muhammad ibn al-Qasim lorsqu'il fut transporté ligoté."
  ur: "سندھ کا الکراج؛ دہر کی سلی ٹوٹ گئی، یہ شرائط پر حاصل ہوئی - اور یہاں سندھ کے لوگوں نے محمد بن القاسم کو اس وقت پینٹ کیا جب وہ باندھے گئے تھے۔"
  tr: "Al-Kiraj, Sindh'te bir şehirdir; Dawhar bin Dahir oraya çıktı, ancak Muhammed bin Al-Kasim onu yendi ve halkı onun yönetimine girdi, bu yüzden öldürüldü ve yakalandı. Sindh halkı, Muhammed'i götürülürken zincirler içinde tasvir etti."
  id: "Al-Kiraj adalah sebuah kota di Sindh; Dawhar bin Dahir muncul di sana, tetapi Muhammad bin Al-Qasim mengalahkannya, dan rakyatnya jatuh di bawah kekuasaannya, sehingga ia dibunuh dan ditangkap. Orang-orang Sindh menggambarkan Muhammad dalam rantai saat ia dibawa pergi."
