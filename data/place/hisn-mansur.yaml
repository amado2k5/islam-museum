summary:
  ar: "حصن منصور من الثغور نُسب إلى منصور بن جاونة بن الحارث العامري القيسي الذي تولى بناءه ومرمّته وكان مقيماً به أيام مروان بن محمد بجند كثيف من أهل الشام والجزيرة ليردّ العدو؛ وبناه الرشيد وشحنه في خلافة المهدي."
  en: "Hisn Mansur (Adiyaman) of the frontier, named for Mansur ibn Jamwana ibn al-Harith al-Amiri of Qays, who undertook its building and upkeep, stationed there in Marwan ibn Muhammad's days with a dense Syrian and Jaziran host to repel the enemy; al-Rashid built and garrisoned it in al-Mahdi's caliphate."
  es: "Hisn Mansur (Adiyaman) de la frontera, que recibió su nombre de Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, quien se encargó de su construcción y mantenimiento, estuvo acantonado allí en tiempos de Marwan ibn Muhammad con un denso ejército sirio y jazirano para repeler al enemigo; al-Rashid lo construyó y lo guarneció durante el califato de al-Mahdi."
  fr: "Hisn Mansur (Adiyaman) de la frontière, nommé d'après Mansur ibn Jamwana ibn al-Harith al-Amiri de Qays, qui entreprit sa construction et son entretien, stationné là à l'époque de Marwan ibn Muhammad avec une importante armée syrienne et jazirane pour repousser l'ennemi; al-Rashid le construisit et le garnit dans le califat d'al-Mahdi."
  ur: "سرحد کا حسان منصور ⁦(عادیمان)⁩، جسے قیس کے منصور بن جموانہ بن الحارث العمیری کے نام سے منسوب کیا گیا، جس نے اس کی تعمیر اور دیکھ بھال کا کام کیا، مروان بن محمد کے دنوں میں دشمن کو پسپا کرنے کے لیے ایک گھنے شامی اور جزیران کے لشکر کے ساتھ وہاں تعینات تھا۔ الرشید نے اسے المہدی کی خلافت میں بنایا اور اس کی حفاظت کی۔"
