  en: "Hisn Mansur (Adiyaman) of the frontier, named for Mansur ibn Jamwana ibn al-Harith al-Amiri of Qays, who undertook its building and upkeep, stationed there in Marwan ibn Muhammad's days with a dense Syrian and Jaziran host to repel the enemy; al-Rashid built and garrisoned it in al-Mahdi's caliphate."
