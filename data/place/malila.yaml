summary:
  ar: "مدينة حسنة متوسطة ذات مياه كثيرة، ومنها يشرب أهلها، وكانت لها قبل ذلك عمارات متصلة وزراعات، وتقع في البحر على اثني عشر ميلاً من كرط. {cite:nuzhat-al-mushtaq-2002 p. 533}"
  en: "A fine, medium-sized town with much water, drunk by its people; it once had continuous buildings and fields, and lies twelve miles from Kart. {cite:nuzhat-al-mushtaq-2002 p. 533}"
  es: "Un pueblo agradable, de tamaño mediano, con abundante agua, de la que bebían sus habitantes; antiguamente contaba con edificios y campos continuos, y se encuentra a doce millas de Kart. {cite:nuzhat-al-mushtaq-2002 p. 533}"
  fr: "Une jolie ville de taille moyenne, riche en eau, consommée par ses habitants; elle était autrefois composée de bâtiments et de champs continus, et se situe à douze milles de Kart. {cite:nuzhat-al-mushtaq-2002 p. 533}"
  ur: "ایک عمدہ، درمیانے درجے کا شہر جس میں بہت زیادہ پانی ہے، اس کے لوگ پیتے ہیں۔ اس میں کبھی مسلسل عمارتیں اور کھیت تھے، اور یہ کارٹ سے بارہ میل دور ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 533}"
  tr: "Halkının su içtiği, bol suyu olan mütevazı bir şehir. Daha önce birbirine bağlı binalar ve tarım arazileri vardı ve Kart'a on iki mil uzaklıkta deniz kenarında yer almaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 533}"
  id: "Sebuah kota sederhana dengan banyak air, tempat penduduknya minum. Sebelumnya, kota ini memiliki bangunan dan lahan pertanian yang terhubung, dan kini terletak di laut dua belas mil dari Kart. {cite:nuzhat-al-mushtaq-2002 hlm. 533}"
