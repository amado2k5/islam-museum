  fr: "Un lieu entre La Mecque et Médine, près d'al-Abwa', à vingt-neuf milles de Rabigh du côté de Médine; le Prophète y a mené son premier raid en 2 AH (al-Raheeq p. 198)."
  ur: "مکہ اور مدینہ کے درمیان ایک جگہ، ابواء کے قریب، مدینہ کی طرف ربیع سے انتیس میل کے فاصلے پر؛ نبی نے اس پر پہلا حملہ 2 ہجری میں کیا ⁦(الرحیق صفحہ 198)⁩۔"
