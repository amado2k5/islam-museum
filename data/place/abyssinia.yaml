summary:
  en: "The Aksumite kingdom across the Red Sea: twice occupier of Yemen (340 and 525), patron of Abraha’s elephant campaign, and later refuge of the first Muslim emigrants."
  ar: "مملكة أكسوم خلف البحر الأحمر: محتلة اليمن مرتين (340م و525م)، وصاحبة حملة أبرهة بالفيل، ثم مأوى مهاجرة المسلمين الأولى.، وعند المسعودي أن ما كان من بلاد الأحابش من غربي اليمن وجدة والحجاز مما يلي بحر القلزم فبلاد فشفة لا خير في أرضها ولا شيء يحمل من ساحلها إلا الذبل والنمور، وما يليها من ساحل الشحر وبلاد الأحقاف من ساحل حضرموت إلى عدن لا يحمل من أرضهم إلا اللبان ويسمى الكندر، وأن بحر القلزم أصعب البحار وأقلها خيراً في بطنه وظهره لا تسير فيه المراكب إلا بالنهار فإذا جن الليل أرست في مواضع معروفة {cite:muruj-al-dhahab p. 348-349}"
