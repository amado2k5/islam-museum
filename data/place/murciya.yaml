summary:
  ar: "مدينة قاعدة أرض تدمير، لها ربض عامر آهل، وعليها سور متقن، والماء يشق ربضها، وهي على ضفة النهر الأبيض، وتبعد عن بلنسية خمس مراحل. {cite:nuzhat-al-mushtaq-2002 p. 559}"
  en: "The capital of the Tudmir lands, with a populous suburb and a well-built wall, watered by a channel through its suburb, on the bank of the white river; five stages from Valencia. {cite:nuzhat-al-mushtaq-2002 p. 559}"
  es: "La capital de las tierras tudmir, con un suburbio populoso y una muralla bien construida, regada por un canal que atraviesa su periferia, a orillas del río Blanco; a cinco etapas de Valencia. {cite:nuzhat-al-mushtaq-2002 p. 559}"
  fr: "Capitale des terres de Tudmir, avec une banlieue densément peuplée et une muraille bien construite, irriguée par un canal traversant sa banlieue, sur la rive du fleuve blanc; à cinq étapes de Valence. {cite:nuzhat-al-mushtaq-2002 p. 559}"
  ur: "توڈمیر کا دارالحکومت، ایک آبادی والا مضافاتی علاقہ اور ایک اچھی طرح سے تعمیر شدہ دیوار کے ساتھ، اس کے مضافاتی علاقے سے گزرتے ہوئے، سفید دریا کے کنارے پر ایک چینل سے پانی پلایا جاتا ہے۔ والنسیا سے پانچ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 559}"
  tr: "Şehir, iyi inşa edilmiş duvarları ve yerleşimini su oyan sularla dolu bir yıkım diyarının merkezidir. Beyaz Nehir kıyısında, Valencia'ya beş adım uzaklıkta yer almaktadır. {cite:nuzhat-al-mushtaq-2002 s. 559}"
  id: "Kota ini merupakan dasar dari tanah kehancuran, dengan pinggiran kota yang berkembang pesat dengan tembok yang kokoh, dan air yang mengalir melalui pemukimannya. Kota ini terletak di tepi Sungai Putih, lima langkah dari Valencia. {cite:nuzhat-al-mushtaq-2002 hlm. 559}"
