summary:
  ar: "فنر، ويسمى الفنار، حيّ من أحياء إسطنبول خُصّص للروم الأرثوذكس بعد الفتح سنة 857هـ/1453م بحسب التقليد. انتقل إليه بطريرك الروم في 1011هـ/1603م واستقر في كنيسة القديس جاورجيوس التي لا تزال مقر البطريركية الأرثوذكسية، وسكنته أسر روم ثرية تُعرف بالفنارية، استعانت بها الدولة العثمانية في الترجمة وفي ولاية الأفلاق والبغدان قرابة قرن {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  en: "Fener, or Phanar, is a quarter of Istanbul which, according to tradition, Mehmed II allotted to the Greeks after the conquest of 857/1453. The Greek Patriarch moved there in 1011/1603 and settled in the Church of St George, still the seat of the Orthodox Patriarchate, and wealthy Greek families called Phanariots lived around it, whom the Porte used as interpreters and, for over a century, as governors of Moldavia and Wallachia {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  ur: "فنر، جسے فنار بھی کہتے ہیں، استنبول کا ایک محلہ ہے جو روایت کے مطابق 857ھ/1453ء کی فتح کے بعد سلطان محمد ثانی نے یونانیوں کو دیا۔ یونانی پیٹریارک 1011ھ/1603ء میں وہاں منتقل ہوا اور سینٹ جارج کے گرجے میں مقیم ہوا جو آج بھی آرتھوڈوکس پیٹریارکیٹ کا مرکز ہے، اور اس کے گرد دولت مند یونانی خاندان آباد ہوئے جنہیں فنارِیوٹ کہا جاتا ہے، اور جن سے سلطنت نے ترجمانی کا کام لیا اور ایک صدی سے زیادہ مدت تک مولداویا اور والاچیا کی گورنری دی {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  es: "Fener, o Phanar, es un barrio de Estambul que, según la tradición, Mehmed II asignó a los griegos después de la conquista de 857/1453. El Patriarca griego se trasladó allí en 1011/1603 y se instaló en la Iglesia de San Jorge, que aún es la sede del Patriarcado Ortodoxo, y a su alrededor vivían familias griegas adineradas llamadas fanariotas, a quienes la Sublime Puerta empleó como intérpretes y, durante más de un siglo, como gobernadores de Moldavia y Valaquia {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  fr: "Fener, ou Phanar, est un quartier d'Istanbul que, selon la tradition, Mehmed II aurait attribué aux Grecs après la conquête de 857/1453. Le patriarche grec s'y installa en 1011/1603 et résida dans l'église Saint-Georges, toujours siège du patriarcat orthodoxe. De riches familles grecques, appelées Phanariotes, vivaient aux alentours; la Porte les employait comme interprètes et, pendant plus d'un siècle, comme gouverneurs de Moldavie et de Valachie."
  tr: "Fener, Al-Fanar olarak da bilinir, geleneklere göre 857 Hicri / 1453 yılında fetih sonrası İstanbul'da Yunan Ortodoksları için ayrılmış bir ilçedir. Yunan Patriği 1011 Hicri / 1603 yılında buraya taşınmış ve halen Ortodoks Patrikhanesi'nin merkezi olarak hizmet veren Aziz George Kilisesi'ne yerleşmiştir. Osmanlı devletinin çeviri için kullandığı zengin Roma aileleri olan Fanariyya tarafından yaşanmıştır ve Aflakes ile Bağdan eyaletinde yaklaşık bir yüzyıl boyunca yaşamıştır {cite:Encyclopaedia-of-Islam-2 cilt 2 s. 917} {cite:Encyclopaedia-of-Islam-2 cilt 2 s. 918}"
  id: "Fener, juga dikenal sebagai Al-Fanar, adalah sebuah distrik di Istanbul yang ditetapkan untuk Ortodoks Yunani setelah penaklukan pada tahun 857 H / 1453 M menurut tradisi. Patriark Yunani pindah ke sana pada tahun 1011 H / 1603 M dan menetap di Gereja Santo George, yang masih menjadi pusat Patriarkat Ortodoks. Wilayah ini dihuni oleh keluarga Romawi kaya yang dikenal sebagai Fanariyya, yang digunakan oleh negara Ottoman untuk penerjemahan dan berada di provinsi Aflakes dan Baghdan selama hampir satu abad {cite:Encyclopaedia-of-Islam-2 vol. 2 hlm. 917} {cite:Encyclopaedia-of-Islam-2 vol. 2 hlm. 918}."
