label: { ar: "فنر", en: "Fener (Phanar)", ur: "فنر" }
summary:
  ar: "فنر، ويسمى الفنار، حيّ من أحياء إسطنبول خُصّص للروم الأرثوذكس بعد الفتح سنة 857هـ/1453م بحسب التقليد. انتقل إليه بطريرك الروم في 1011هـ/1603م واستقر في كنيسة القديس جاورجيوس التي لا تزال مقر البطريركية الأرثوذكسية، وسكنته أسر روم ثرية تُعرف بالفنارية، استعانت بها الدولة العثمانية في الترجمة وفي ولاية الأفلاق والبغدان قرابة قرن {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  en: "Fener, or Phanar, is a quarter of Istanbul which, according to tradition, Mehmed II allotted to the Greeks after the conquest of 857/1453. The Greek Patriarch moved there in 1011/1603 and settled in the Church of St George, still the seat of the Orthodox Patriarchate, and wealthy Greek families called Phanariots lived around it, whom the Porte used as interpreters and, for over a century, as governors of Moldavia and Wallachia {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
  ur: "فنر، جسے فنار بھی کہتے ہیں، استنبول کا ایک محلہ ہے جو روایت کے مطابق 857ھ/1453ء کی فتح کے بعد سلطان محمد ثانی نے یونانیوں کو دیا۔ یونانی پیٹریارک 1011ھ/1603ء میں وہاں منتقل ہوا اور سینٹ جارج کے گرجے میں مقیم ہوا جو آج بھی آرتھوڈوکس پیٹریارکیٹ کا مرکز ہے، اور اس کے گرد دولت مند یونانی خاندان آباد ہوئے جنہیں فنارِیوٹ کہا جاتا ہے، اور جن سے سلطنت نے ترجمانی کا کام لیا اور ایک صدی سے زیادہ مدت تک مولداویا اور والاچیا کی گورنری دی {cite:encyclopaedia-of-islam-2 vol. 2 p. 917} {cite:encyclopaedia-of-islam-2 vol. 2 p. 918}."
