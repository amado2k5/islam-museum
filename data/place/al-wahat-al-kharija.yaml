summary:
  ar: "واحات صحراوية كانت عامرة بالزرع والثمار ثم درست طرقها، ويذكر المؤلف فيها ثعبانا كبيرا يعرف عند أهلها، وأن فيها جبلا معدنه اللازورد يحمل إلى مصر {cite:nuzhat-al-mushtaq-2002 p. 121}، {cite:nuzhat-al-mushtaq-2002 p. 122}."
  en: "Desert oases that were once farmed and fertile, but whose roads have fallen out of use. The author reports a lapis lazuli mine on a mountain there, with the stone carried to Egypt, and a great serpent that locals describe {cite:nuzhat-al-mushtaq-2002 p. 121}, {cite:nuzhat-al-mushtaq-2002 p. 122}."
