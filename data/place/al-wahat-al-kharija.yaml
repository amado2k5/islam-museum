class: place
kind: oasis
label: { ar: "الواحات الخارجة", en: "The Outer Oases (al-Kharija)", es: "Los oasis exteriores (al-Kharija)", fr: "Les oasis extérieures (al-Kharija)", ur: "بیرونی نخلستان ⁦(الخریجہ)⁩", tr: "Kharga Vahaları", id: "Oasis Kharga" }
summary:
  ar: "واحات صحراوية كانت عامرة بالزرع والثمار ثم درست طرقها، ويذكر المؤلف فيها ثعبانا كبيرا يعرف عند أهلها، وأن فيها جبلا معدنه اللازورد يحمل إلى مصر {cite:nuzhat-al-mushtaq-2002 p. 121}، {cite:nuzhat-al-mushtaq-2002 p. 122}."
  en: "Desert oases that were once farmed and fertile, but whose roads have fallen out of use. The author reports a lapis lazuli mine on a mountain there, with the stone carried to Egypt, and a great serpent that locals describe {cite:nuzhat-al-mushtaq-2002 p. 121}, {cite:nuzhat-al-mushtaq-2002 p. 122}."
  es: "Oasis desérticos que alguna vez fueron cultivados y fértiles, pero cuyos caminos han caído en desuso. El autor informa sobre una mina de lapislázuli en una montaña de la zona, cuya piedra fue transportada a Egipto, y una gran serpiente que los lugareños describen {cite:nuzhat-al-mushtaq-2002 p. 121}, {cite:nuzhat-al-mushtaq-2002 p. 122}."
  fr: "Des oasis désertiques autrefois cultivées et fertiles, mais dont les routes sont aujourd'hui abandonnées. L'auteur mentionne une mine de lapis-lazuli sur une montagne de la région, dont la pierre était transportée jusqu'en Égypte, ainsi qu'un grand serpent décrit par les habitants {cite:nuzhat-al-mushtaq-2002 p. 121}, {cite:nuzhat-al-mushtaq-2002 p. 122}."
  ur: "صحرائی نخلستان جو کبھی کھیتی باڑی اور زرخیز تھے لیکن جن کی سڑکیں استعمال سے باہر ہو چکی ہیں۔ مصنف نے وہاں کے ایک پہاڑ پر لاپیس لازولی کی ایک کان کی اطلاع دی ہے، جس میں پتھر مصر لے جایا گیا تھا، اور ایک عظیم سانپ جسے مقامی لوگ بیان کرتے ہیں۔ 121}، {حوالہ: نزہت المشتاق-2002 ص۔ 122}۔"
  tr: "Bir zamanlar ürün ve meyve açısından zengin olan çöl vahaları, daha sonra güzergahları incelenmiştir. Yazar, yerel halk arasında bilinen büyük bir yılan ve içinde Mısır'a taşınan lapis lazuli metali taşıyan bir dağın bulunduğunu belirtmektedir {cite:Nuzhat-al-Mushtaq-2002 s. 121}, {cite:Nuzhat-al-Mushtaq-2002 s. 122}."
  id: "Oasis gurun yang dulu kaya akan tanaman dan buah-buahan, kemudian rutenya dipelajari. Penulis menyebutkan seekor ular besar yang dikenal di kalangan penduduk setempatnya dan bahwa ular itu berisi gunung dengan logam lapis lazuli yang dibawa ke Mesir {cite:Nuzhat-al-Mushtaq-2002 hlm. 121}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 122}."
