summary:
  ar: "جزيرة كثيرة الزروع والحبوب، فيها طيور كثيرة ونارجيل، وتتصل بجزيرة أخرى معمورة يحكمها ملك اسمه قامرون، وبين الجزيرتين مجريان {cite:nuzhat-al-mushtaq-2002 p. 88}."
  en: "A fertile island with many crops, grains and birds, and plenty of coconuts. Joined to another populated island ruled by a king named Qamrun, with two passages between them {cite:nuzhat-al-mushtaq-2002 p. 88}."
  es: "Una isla fértil con muchos cultivos, cereales y aves, y abundancia de cocos. Unida a otra isla poblada gobernada por un rey llamado Qamrun, con dos pasos entre ellas {cite:nuzhat-al-mushtaq-2002 p. 88}."
  fr: "Une île fertile, riche en cultures, céréales, oiseaux et cocotiers. Reliée à une autre île habitée, gouvernée par un roi nommé Qamrun, et reliée par deux passages {cite:nuzhat-al-mushtaq-2002 p. 88}."
  ur: "ایک زرخیز جزیرہ جس میں بہت سی فصلیں، اناج اور پرندے اور بہت سارے ناریل ہیں۔ ایک اور آبادی والے جزیرے میں شامل ہوا جس کی حکومت قمرون نامی بادشاہ کے پاس تھی، جس کے درمیان دو راستے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ 88}۔"
  tr: "Tarım ve tahıl açısından zengin, birçok kuş ve hindistancevizi bulunan bir ada, Qamrun adında bir kralın yönettiği başka bir yerleşim adasına bağlıdır ve iki adanın arasında iki ada bulunur {cite:Nuzhat-al-Mushtaq-2002, s. 88}."
  id: "Sebuah pulau yang kaya akan tanaman dan biji-bijian, dengan banyak burung dan kelapa, terhubung dengan pulau berpenghuni lain yang diperintah oleh seorang raja bernama Qamrun, dengan dua pulau di antara keduanya {cite:Nuzhat-al-Mushtaq-2002, hlm. 88}."
