summary:
  ar: "أرض رملية قفر لا يعمرها إلا الإبل المنسوبة إليها المشهورة بسرعة الجري. ويذكر الإدريسي أن طولها نحو تسعمائة ميل، وأن أهلها يعيشون على السمك المجفف والتمر والألبان، ولا يعرفون الحنطة إلا قليلاً. {cite:nuzhat-al-mushtaq-2002 p. 155}"
  en: "A sandy and barren land that only its camels can cross, famed for their speed. Al-Idrisi gives its length as about nine hundred miles and says its people live on dried fish, dates and milk and know little of wheat. {cite:nuzhat-al-mushtaq-2002 p. 155}"
