summary:
  ar: "أرض رملية قفر لا يعمرها إلا الإبل المنسوبة إليها المشهورة بسرعة الجري. ويذكر الإدريسي أن طولها نحو تسعمائة ميل، وأن أهلها يعيشون على السمك المجفف والتمر والألبان، ولا يعرفون الحنطة إلا قليلاً. {cite:nuzhat-al-mushtaq-2002 p. 155} وسمّاها الهمداني «أصحاب البراري» وذكر أنهم كانوا يعظّمون الشمس ويسجدون لها، وأن لهم على سواحل بحر اليمن «الجمال المعنبرة»: فالجمل إذا اشتمّ العنبر برك عليه فلم يتركه حتى يفتقده صاحبه فيلتقطه، وربما نفق الجمل من التجوع {cite:sifat-jazirat-al-arab pp. 20-21}."
  en: "A sandy and barren land that only its camels can cross, famed for their speed. Al-Idrisi gives its length as about nine hundred miles and says its people live on dried fish, dates and milk and know little of wheat. {cite:nuzhat-al-mushtaq-2002 p. 155} Al-Hamdani calls them 'the desert-dwellers', soft-hearted lovers of star-lore who magnified and prostrated to the sun, and preserves the famous lore of their ambergris camels: on the shores of the Yemen sea, a camel that catches the ambergris scent kneels upon it and will not rise until its owner misses it and comes to scrape it off {cite:sifat-jazirat-al-arab pp. 20-21}."
  es: "Una tierra arenosa y árida que solo sus camellos pueden cruzar, famosa por su velocidad. Al-Idrisi calcula que tiene una longitud de aproximadamente novecientas millas y dice que su gente vive de pescado seco, dátiles y leche, y que sabe poco de trigo. {cite:nuzhat-al-mushtaq-2002 p. 155} Al-Hamdani los llama 'los habitantes del desierto', amantes bondadosos de la astrología que magnificaban y se postraban ante el sol, y conserva la famosa tradición de sus camellos de ámbar gris: en las costas del mar de Yemen, un camello que percibe el aroma del ámbar gris se arrodilla sobre él y no se levanta hasta que su dueño lo echa de menos y viene a rasparlo {cite:sifat-jazirat-al-arab pp. 20-21}."
  fr: "Une terre sablonneuse et aride que seuls ses chameaux peuvent traverser, réputée pour sa rapidité. Al-Idrisi estime sa longueur à environ neuf cents milles et indique que ses habitants se nourrissent de poisson séché, de dattes et de lait, et connaissent peu le blé. {cite:nuzhat-al-mushtaq-2002 p. 155} Al-Hamdani les appelle « les habitants du désert », des êtres sensibles, amoureux des astres, qui magnifiaient et se prosternaient devant le soleil, et il conserve la célèbre légende de leurs chameaux d'ambre gris: sur les rives de la mer du Yémen, un chameau qui perçoit le parfum de l'ambre gris s'agenouille dessus et ne se relève que lorsque son propriétaire s'en aperçoit et vient le gratter. {cite:sifat-jazirat-al-arab pp. 20-21}"
  ur: "ایک ریتلی اور بنجر زمین جسے صرف اس کے اونٹ ہی عبور کر سکتے ہیں، اپنی رفتار کے لیے مشہور ہے۔ الادریسی اس کی لمبائی نو سو میل بتاتے ہیں اور کہتے ہیں کہ اس کے لوگ سوکھی مچھلی، کھجور اور دودھ پر گزارہ کرتے ہیں اور گندم کو بہت کم جانتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 155} الحمدانی انہیں صحرائی، نرم دل ستاروں کے عاشق کہتے ہیں جنہوں نے سورج کو سجدہ کیا اور اپنے عنبر کے اونٹوں کی مشہور روایت کو محفوظ کیا: یمن کے سمندر کے کنارے ایک اونٹ جو عنبر کی خوشبو کو پکڑتا ہے اس کے اوپر گھٹنے ٹیکتا ہے اور اس کے مالک کو کھجلی نہیں آتی۔ {حوالہ:صفت جزیرۃ العرب صفحہ 20-21}۔"
