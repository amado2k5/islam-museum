summary:
  ar: "أرض رملية قفر لا يعمرها إلا الإبل المنسوبة إليها المشهورة بسرعة الجري. ويذكر الإدريسي أن طولها نحو تسعمائة ميل، وأن أهلها يعيشون على السمك المجفف والتمر والألبان، ولا يعرفون الحنطة إلا قليلاً. {cite:nuzhat-al-mushtaq-2002 p. 155} وسمّاها الهمداني «أصحاب البراري» وذكر أنهم كانوا يعظّمون الشمس ويسجدون لها، وأن لهم على سواحل بحر اليمن «الجمال المعنبرة»: فالجمل إذا اشتمّ العنبر برك عليه فلم يتركه حتى يفتقده صاحبه فيلتقطه، وربما نفق الجمل من التجوع {cite:sifat-jazirat-al-arab pp. 20-21}."
  en: "A sandy and barren land that only its camels can cross, famed for their speed. Al-Idrisi gives its length as about nine hundred miles and says its people live on dried fish, dates and milk and know little of wheat. {cite:nuzhat-al-mushtaq-2002 p. 155} Al-Hamdani calls them 'the desert-dwellers', soft-hearted lovers of star-lore who magnified and prostrated to the sun, and preserves the famous lore of their ambergris camels: on the shores of the Yemen sea, a camel that catches the ambergris scent kneels upon it and will not rise until its owner misses it and comes to scrape it off {cite:sifat-jazirat-al-arab pp. 20-21}."
