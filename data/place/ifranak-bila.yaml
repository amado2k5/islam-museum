summary:
  ar: "مدينة كبيرة حسنة ذات عيون وآبار ونعم وافرة، ويذكر المؤلف أنها تبعد عن سيق لاوش ثمانين ميلا {cite:nuzhat-al-mushtaq-2002 p. 885}."
  en: "A large, fine city with springs, wells and abundant produce; the author gives eighty miles from Siqlāwsh {cite:nuzhat-al-mushtaq-2002 p. 885}."
  es: "Una ciudad grande y hermosa con manantiales, pozos y abundante producción; el autor indica ochenta millas desde Siqlāwsh {cite:nuzhat-al-mushtaq-2002 p. 885}."
  fr: "Une grande et belle ville avec des sources, des puits et des produits abondants; l'auteur donne quatre-vingts miles de Siqlāwsh {cite:nuzhat-al-mushtaq-2002 p. 885}."
  ur: "ایک بڑا، عمدہ شہر جس میں چشمے، کنویں اور وافر پیداوار ہے۔ مصنف نے صقلوش سے اسی میل کا فاصلہ بیان کیا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 885}۔"
  tr: "Kaynakları, kuyuları ve bol nimetleriyle dolu büyük, güzel bir şehir. Yazar, Siq Laosh'a seksen mil uzaklıkta olduğunu belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 885}."
  id: "Sebuah kota besar dan indah dengan mata air, sumur, dan berkah yang melimpah. Penulis menyebutkan bahwa kota ini berjarak delapan puluh mil dari Siq Laosh {cite:Nuzhat-al-Mushtaq-2002, hlm. 885}."
