summary:
  ar: أنديجان حاضرة وادي فرغانة في مصادر أبي الفداء، ويرى غوليوس أن مؤلفين عرّفوا فرغانة بها، وأن الجداول الفلكية تضع قصبة الإقليم في أخسيكت. {cite:farghani-elements-astronomy p. 411}
  tr: "Ebu el-Fida'nın kaynaklarında Andican, Fergana Vadisi'nin başkentidir. Jülyus, yazarların Fergana'yı buraya getirdiğine ve astronomik takvimlerin bölgenin kasbahını Aksiket'e yerleştirdiğine inanır. {alıntı:Farghani-elements-astronomy s. 411}"
  id: "Andijan adalah ibu kota Lembah Fergana menurut sumber Abu al-Fida. Julius percaya bahwa para penulis memperkenalkan Fergana di sana, dan bahwa kalender astronomi menempatkan kasbah wilayah tersebut di Aksiket. {sitasi: Farghani-elements-astronomy hlm. 411}"
