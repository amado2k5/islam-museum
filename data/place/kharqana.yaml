summary:
  ar: "مدينة جليلة صغيرة على حدود فرغانة، تقع في طريق فرغانة، وتبعد عن بونجكت سبعة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  en: "A great but small town on the border of Farghana, on the road to Farghana, twenty-seven miles from Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  es: "Un pueblo estupendo pero pequeño en la frontera de Farghana, en la carretera a Farghana, a veintisiete millas de Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  fr: "Une grande petite ville à la frontière de Farghana, sur la route de Farghana, à vingt-sept miles de Bunjikath. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  ur: "بونجی کاٹھ سے ستائیس میل کے فاصلے پر فرغانہ کی سڑک پر فرغانہ کی سرحد پر ایک عظیم مگر چھوٹا قصبہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 504}"
  tr: "Fergana sınırında, Fergana yolu üzerinde, Pungkat'a yirmi yedi mil uzaklıkta küçük bir soylu şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 504}"
  id: "Sebuah kota kecil yang bangsawan di perbatasan Fergana, terletak di jalan Fergana, dua puluh tujuh mil dari Pungkat. {cite:Nuzhat-al-Mushtaq-2002 hlm. 504}"
