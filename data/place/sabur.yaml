summary:
  ar: "سابور مدينة بفارس؛ أتاها عثمان بن أبي العاص سنة ٢٣ ويقال ٢٤ فصالحته على أمان ومال معجل إثر منام أخي شهرك ثم نقض أهلها ففتحها أبو موسى عنوة سنة ٢٦ وعلى مقدمته عثمان."
  en: "Sabur of Fars; Uthman's aman-sulh of 23 or 24h after Shahrak's brother's dream — then the people's breach, and Abu Musa took it by force in 26h with Uthman on his vanguard."
  es: "Sabur de Fars; el aman-sulh de Uthman de 23 o 24 h después del sueño del hermano de Shahrak, luego la brecha del pueblo, y Abu Musa la tomó por la fuerza en 26 h con Uthman en su vanguardia."
  fr: "Sabur de Fars; l'aman-sulh d'Uthman de 23 ou 24h après le rêve du frère de Shahrak — puis la brèche du peuple, et Abu Musa la prit par la force en 26h avec Uthman à l'avant-garde."
  ur: "فارس کا صبور؛ شاہرق کے بھائی کے خواب کے بعد 23 یا 24 ھ میں عثمان کی امان سلح - پھر لوگوں کی خلاف ورزی، اور ابو موسیٰ نے عثمان کے ساتھ 26 ھ میں زبردستی اس پر قبضہ کر لیا۔"
  tr: "Sapur İran'da bir şehirdir; Osman bin Ebi el-As 23 yılında buraya geldi ve denir ki 24 yılında, kardeşim Şehrak'ın rüyasından sonra burayı güvenlik ve hızlı zenginlikle uzlaştırdı, sonra halkını yok etti ve Ebu Musa 26 Hicri yılında, Osman cephede iken zorla ele geçirdi."
  id: "Sapur adalah sebuah kota di Persia; Uthman ibn Abi al-As datang ke sana pada tahun 23, dan dikatakan pada tahun 24, yang mendamaikannya dengan keselamatan dan kekayaan cepat setelah bermimpi tentang saudaraku Shahrak, lalu ia menghancurkan rakyatnya, dan Abu Musa secara paksa merebutnya pada tahun 26 H dengan Uthman di garis depan."
