summary:
  ar: "مدينة كبيرة جامعة، بها عرفت أرضها، وفيها عمارة كثيرة، ويذكر المؤلف أن بينها وبين مدينة ألبة ما يذكره {cite:nuzhat-al-mushtaq-2002 p. 950}."
  en: "A large city with much building; the author says the land is known through it, and gives a distance to Alba {cite:nuzhat-al-mushtaq-2002 p. 950}."
  es: "Una gran ciudad con muchos edificios; el autor dice que la tierra se conoce a través de ella y da una distancia a Alba {cite:nuzhat-al-mushtaq-2002 p. 950}."
  fr: "Une grande ville avec de nombreux bâtiments; l'auteur dit que la région est connue grâce à elle, et donne une distance jusqu'à Alba {cite:nuzhat-al-mushtaq-2002 p. 950}."
  ur: "بہت سی عمارتوں والا ایک بڑا شہر؛ مصنف کا کہنا ہے کہ زمین اس کے ذریعے معلوم ہوتی ہے، اور البا کو ایک فاصلہ بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 950}۔"
  tr: "Toprakları bilinen büyük, kapsamlı bir şehirdir ve birçok bina barındırır. Yazar, Alba şehri ile ilgili bir şeyler olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 950}."
  id: "Sebuah kota besar dan komprehensif di mana tanahnya dikenal, dan memiliki banyak bangunan. Penulis menyebutkan bahwa ada sesuatu yang terkait dengannya dan kota Alba {cite:Nuzhat-al-Mushtaq-2002, hlm. 950}."
