summary:
  ar: "مدينة حسنة من بلاد اللانية وثغر من ثغورها، ويذكر المؤلف أنها تبعد عن موقع النهر مائة وخمسين ميلا {cite:nuzhat-al-mushtaq-2002 p. 915}."
  en: "A fine city in the land of the Alans and one of its ports; the author gives one hundred and fifty miles from a river site {cite:nuzhat-al-mushtaq-2002 p. 915}."
  es: "Una hermosa ciudad en la tierra de los alanos y uno de sus puertos; el autor indica que está a ciento cincuenta millas de un sitio fluvial {cite:nuzhat-al-mushtaq-2002 p. 915}."
  fr: "Une belle ville du pays des Alains et l'un de ses ports; l'auteur donne cent cinquante milles d'un site fluvial {cite:nuzhat-al-mushtaq-2002 p. 915}."
  ur: "الانس کی سرزمین میں ایک عمدہ شہر اور اس کی بندرگاہوں میں سے ایک؛ مصنف نے ایک ندی کے مقام سے ایک سو پچاس میل کا فاصلہ بیان کیا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 915}۔"
  tr: "Al-Laniya topraklarında ve limanlarında güzel bir şehir. Yazar, nehir alanından yüz elli mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 915}."
  id: "Sebuah kota yang indah di tanah Al-Laniya dan pelabuhan-pelabuhannya. Penulis menyebutkan bahwa kota ini berjarak seratus lima puluh mil dari lokasi sungai {cite:Nuzhat-al-mushtaq-2002, hlm. 915}."
