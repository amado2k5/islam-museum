label: { en: "al-Ji'rana", ar: "الجعرانة" , ur: "جعرانہ", es: "al-Ji'rana", fr: "al-Ji'rana", tr: "Al-Ja'rana", id: "Al-Ja'rana"}
summary:
  en: "A settlement between Mecca and Ta'if where the Prophet halted the spoils and captives of Hunayn, received Hawazin's delegation and granted them general amnesty, distributed the shares to al-Mu'allafa Qulubuhum, addressed the Ansar, and entered ihram for Umrah."
  ar: "موضع بين مكة والطائف حبس فيه النبي سبايا وغنائم حنين، واستقبل فيه وفد هوازن فرد إليهم أسرارهم وسباياهم، وقسم الفيء على المؤلفة قلوبهم، وخطب في الأنصار خطبته الشهيرة، وأحرم منه بعمرته في ذي القعدة سنة ثمان. وفيه حديث أبي موسى وبلال في الصحيح: أتاه أعرابي يسأله إنجاز ما وعده فقال «أبشر»، فلما أكثر عليه «أبشر» أقبل على أبي موسى وبلال كهيئة الغضبان فقال «ردّ البشرى فاقبلا أنتما»، ثم دعا بقدح فيه ماء فغسل فيه يديه ووجهه ومجّ فيه وقال «اشربا منه وأفرغا على وجوهكما ونحوركما وأبشرا»، ففعلا وأفضلا لأم سلمة من وراء الستر {cite:sahih-al-bukhari 4328}."
  ur: "مکہ اور طائف کے درمیان ایک مقام جہاں حنین کے بعد غنائم تقسیم ہوئے، ہوازن کا وفد آیا اور نبی نے عمرے کا احرام باندھا۔ {cite:ibn-hisham-saqqa}"
  es: "Un acuerdo entre La Meca y Ta'if donde el Profeta detuvo el saqueo y la captura de los cautivos de Hunayn, recibió a la delegación de Hawazin y les concedió una amnistía general, distribuyó las porciones a al-Mu'allafa Qulubuhum, se dirigió a los Ansar y entró en estado de ihram para la Umrah."
  fr: "Un accord entre La Mecque et Taïf où le Prophète fit halte pour le butin et les captifs de Hunayn, reçut la délégation de Hawazin et leur accorda une amnistie générale, distribua les parts à al-Mu'allafa Qulubuhum, s'adressa aux Ansar et entra en ihram pour la Omra."
  tr: "Mekke ile Taif arasında, Peygamber'in Hunayn'ın esirlerini ve ganimetlerini yakaladığı, Hawazin'den bir heyetle sırlarını ve esirlerini paylaştığı, kalplerini barışanlara ödülü dağıttığı, ünlü vaazını Ansur'a verdiği ve 8. yılda Zulü Kı'de'de umresine girdiği bir yer. Bu kitap, Ebu Musa ve Bilal'in Sahih'teki hadislerini içerir: Bir Bedevi geldi Sözünü tutmasını istedi ve \"Sevinin.\" dedi. \"Sevinmekten öteye\" geldiğinde, öfkeli bir ifadeyle Ebu Musa ve Bilal'e döndü ve dedi ki, \"Müjdeyi geri verin, siz de gelin.\" Sonra bir kadeh suyla dua etti, ellerini ve yüzünü yıkadı, ovuşturdu ve dedi ki, \"Ondan için, yüzünüze ve boyununuza dökün, müjdeler verin.\" Bunu yaptı ve perde arkasında um Salamah için dindar oldu {atıf: Sahih-al-Bukhari 4328}."
  id: "Sebuah tempat antara Mekah dan Ta'if di mana Nabi menangkap tawanan dan rampasan Hunayn, menerima delegasi dari Hawazin yang membagikan rahasia dan tawanan, membagikan hadiah kepada mereka yang berdamai hati, menyampaikan khotbah terkenalnya kepada Ansur, dan memasuki Ihram untuk Umrah-nya di Dhu al-Qi'dah pada tahun ke-8. Isinya berisi hadits Abu Musa dan Bilal dalam Sahih: Seorang Badui datang kepadanya meminta agar dia memenuhi janjinya, dan dia berkata, \"Bersukacitalah.\" Ketika dia lebih dari \"bersukacita,\" dia menoleh kepada Abu Musa dan Bilal dengan wajah marah dan berkata, \"Kembalikan kabar bahagia, maka datanglah kalian sendiri.\" Kemudian dia berdoa dengan secangkir air, mencuci tangan dan wajahnya, menggosoknya, dan berkata, \"Minumlah dan tuangkan ke wajah dan leher kalian, dan berikan kabar bahagia.\" Dia melakukannya dan berdoa untuk um Salamah di balik kerudung {cite:\" Sahih-al-Bukhari 4328}."
