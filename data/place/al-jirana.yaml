label: { en: "al-Ji'rana", ar: "الجعرانة" }
summary:
  en: "A settlement between Mecca and Ta'if where the Prophet halted the spoils and captives of Hunayn, received Hawazin's delegation and granted them general amnesty, distributed the shares to al-Mu'allafa Qulubuhum, addressed the Ansar, and entered ihram for Umrah."
  ar: "موضع بين مكة والطائف حبس فيه النبي سبايا وغنائم حنين، واستقبل فيه وفد هوازن فرد إليهم أسرارهم وسباياهم، وقسم الفيء على المؤلفة قلوبهم، وخطب في الأنصار خطبته الشهيرة، وأحرم منه بعمرته في ذي القعدة سنة ثمان. وفيه حديث أبي موسى وبلال في الصحيح: أتاه أعرابي يسأله إنجاز ما وعده فقال «أبشر»، فلما أكثر عليه «أبشر» أقبل على أبي موسى وبلال كهيئة الغضبان فقال «ردّ البشرى فاقبلا أنتما»، ثم دعا بقدح فيه ماء فغسل فيه يديه ووجهه ومجّ فيه وقال «اشربا منه وأفرغا على وجوهكما ونحوركما وأبشرا»، ففعلا وأفضلا لأم سلمة من وراء الستر {cite:sahih-al-bukhari 4328}."
