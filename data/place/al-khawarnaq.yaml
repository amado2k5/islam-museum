summary:
  ar: "قصر قديم فارسي بالحيرة؛ عند البلاذري بناه النعمان بن امرئ القيس وهو ابن الشقيقة بنت أبي ربيعة بن ذهل بن شيبان لبهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان بهرام جور في حجرة النعمان هذا الذي ترك ملكه وساح فذكره عدي بن زيد العبادي في شعره فلما ظهرت الدولة المباركة أقطع الخورنق إبراهيم بن سلمة أحد الدعاة بخراسان وهو جد عبد الرحمن بن إسحاق القاضي كان بمدينة السلام في خلافة المأمون والمعتصم وكان مولى للرباب وأحدث إبراهيم قبة الخورنق في خلافة أبي العباس ولم تكن قبل ذلك. وفي الخبر المشهور عند ابن فضل الله العمري أن البناء سنمار كمله للنعمان في عشرين سنة فلما قال «لو شئت أن أجعله يدور مع الشمس لفعلت» أُمر به فطُرح من أعلى شرفاته وصار مثلاً في السوء الجزاء {cite:umari-masalik-1924 p. 230}."
  en: "An old Persian palace at al-Hira; in al-Baladhuri built by al-Nu'man ibn Imri' al-Qays — son of al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban — for Bahram Jur ibn Yazdgard ibn Bahram ibn Sabur Dhu al-Aktaf, Bahram Jur being in this Nu'man's charge when he left his kingdom and wandered, as Adi ibn Zayd al-Ibadi mentions in his verse; when the blessed dawla rose al-Khawarnaq was granted to Ibrahim ibn Salama, one of the Khurasan da'is — grandfather of Abd al-Rahman ibn Ishaq the qadi of Madinat al-Salam under al-Ma'mun and al-Mu'tasim — and Ibrahim raised al-Khawarnaq's dome in Abu al-Abbas's reign, it not existing before."
  es: "Un antiguo palacio persa en al-Hira; en al-Baladhuri construido por al-Nu'man ibn Imri' al-Qays - hijo de al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban - para Bahram Jur ibn Yazdgard ibn Bahram ibn Sabur Dhu al-Aktaf, estando Bahram Jur a cargo de este Nu'man cuando dejó su reino y vagó, como Adi ibn Zayd al-Ibadi menciona en su verso; cuando la bendita dawla rose al-Khawarnaq fue concedida a Ibrahim ibn Salama, uno de los Khurasan da'is, abuelo de Abd al-Rahman ibn Ishaq, cadí de Madinat al-Salam bajo al-Ma'mun y al-Mu'tasim, e Ibrahim levantó la cúpula de al-Khawarnaq durante el reinado de Abu al-Abbas, que no existía antes."
  fr: "Un vieux palais persan à al-Hira; à al-Baladhuri construit par al-Nu'man ibn Imri' al-Qays — fils d'al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban — pour Bahram Jur ibn Yazdgard ibn Bahram ibn Sabur Dhu al-Aktaf, Bahram Jur étant à la charge de ce Nu'man lorsqu'il quitta son royaume et erra, comme le mentionne Adi ibn Zayd al-Ibadi dans son vers; lorsque la dawla bénie rose al-Khawarnaq a été accordée à Ibrahim ibn Salama, l'un des da'is du Khurasan - grand-père d'Abd al-Rahman ibn Ishaq le cadi de Madinat al-Salam sous al-Ma'mun et al-Mu'tasim - et Ibrahim a élevé le dôme d'al-Khawarnaq sous le règne d'Abu al-Abbas, il n'existait pas auparavant."
  ur: "الحیرہ میں ایک پرانا فارسی محل؛ البلادوری میں جسے النعمان بن عمری القیس ولد الشقیقہ بنت ابی ربیعہ ابن دہل بن شیبان نے تعمیر کیا تھا - بہرام جر بن یزدگرد بن بہرام ابن صبور ذو الاختف کے لیے، بہرام جریر کے ساتھ جب اس نے اس کا چارج سنبھالا تھا اور اس نے اس کی حکومت چھوڑی تھی۔ عدی بن زید العبادی نے اپنی آیت میں ذکر کیا ہے۔ جب خراسان داعی میں سے ایک ابراہیم بن سلامہ کو دولۃ گلاب الخوارناق عطا کیا گیا تھا - عبدالرحمٰن بن اسحاق کے دادا جو مدینۃ السلام کے قاضی المعون اور المعتصم کے ماتحت تھے - اور ابراہیم نے الخوارناق کی پرورش ابوعباس سے پہلے نہیں کی تھی۔"
  tr: "Al-Hirah'ta eski bir Fars sarayı; Al-Baladhuri'ye göre, el-Nu'man ibn İmru' el-Kais tarafından inşa edilmiştir; kendisi, Bahram Jur ibn Yezdgerd ibn Bahram ibn Sabur Dhu al-Aktaf'tan el-Şaqiqa bint Abi Rabi'ah ibn Dhuhl ibn Sheyban'ın oğludur. Bahram al-Jur, Hujret al-Nu'man'daydı, krallığını terk edip hükümdar oldu. Adi ibn Zayd el-Abbadi onu şiirlerinde anmıştır. Mübarek devlet ortaya çıktığında, Horasan'daki vaizlerden biri olan İbrahim ibn Salama tarafından khuranq kesilmiştir; kendisi Abd al-Rahman ibn İshaq al-Qadi'nin büyükbabasıydı. El-Memun ve el-Mu'tasim halifeliği sırasında barış şehrindeydi. El-Rabab'ın özgür bir adamıydı. İbrahim, daha önce var olmayan Ebu el-Abbas halifeliği sırasında el-Hurnak'ın kubbesini kurmuştur. İbn Fadlallah al-Umari'nin ünlü raporunda, Sinmar binasının al-Nu'man tarafından yirmi yılda tamamlandığı söylenir. 'Eğer onu güneşle yörüngede yapmak isteseydiniz, yapardım,' dediğinde, bunu emretti, böylece bina üst balkonlarından fırlatıldı ve kötü bir karşılık örneği oldu {cite:umari-masalik-1924, s. 230}."
  id: "Sebuah istana Persia tua di Al-Hirah; menurut Al-Baladhuri, dibangun oleh al-Nu'man ibn Imru' al-Qais, yang merupakan putra al-Shaqiqa bint Abi Rabi'ah ibn Dhuhl ibn Shayban dari Bahram Jur ibn Yazdgerd ibn Bahram ibn Sabur Dhu al-Aktaf. Bahram al-Jur berada di Hujrat al-Nu'man, yang meninggalkan kerajaannya dan menjadi penguasa. Adi ibn Zayd al-Abbadi menyebutnya dalam puisinya. Ketika negara yang diberkati muncul, khuranq dipisahkan oleh Ibrahim ibn Salama, salah satu pendakwah di Khurasan, yang merupakan kakek Abd al-Rahman ibn Ishaq al-Qadi. Ia berada di kota damai pada masa kekhalifahan al-Ma'mun dan al-Mu'tasim. Ia adalah mantan al-Rabab. Ibrahim mendirikan kubah al-Khurnaq pada masa kekhalifahan Abu al-Abbas, yang sebelumnya belum ada. Dalam laporan terkenal oleh Ibn Fadlallah al-Umari, dikatakan bahwa bangunan Sinmar selesai dibangun oleh al-Nu'man dalam dua puluh tahun. Ketika dia berkata, 'Jika kamu ingin membuatnya mengorbit dengan matahari, aku akan melakukannya,' dia memerintahkannya, sehingga bangunan itu dilempar dari balkon atasnya, menjadi contoh balasan jahat {cite:umari-masalik-1924, hlm. 230}."
