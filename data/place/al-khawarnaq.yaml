label: { ar: "الخورنق", en: "al-Khawarnaq" }
summary:
  ar: "قصر قديم فارسي بالحيرة؛ عند البلاذري بناه النعمان بن امرئ القيس وهو ابن الشقيقة بنت أبي ربيعة بن ذهل بن شيبان لبهرام جور بن يزدجرد بن بهرام بن سابور ذي الأكتاف وكان بهرام جور في حجرة النعمان هذا الذي ترك ملكه وساح فذكره عدي بن زيد العبادي في شعره فلما ظهرت الدولة المباركة أقطع الخورنق إبراهيم بن سلمة أحد الدعاة بخراسان وهو جد عبد الرحمن بن إسحاق القاضي كان بمدينة السلام في خلافة المأمون والمعتصم وكان مولى للرباب وأحدث إبراهيم قبة الخورنق في خلافة أبي العباس ولم تكن قبل ذلك. وفي الخبر المشهور عند ابن فضل الله العمري أن البناء سنمار كمله للنعمان في عشرين سنة فلما قال «لو شئت أن أجعله يدور مع الشمس لفعلت» أُمر به فطُرح من أعلى شرفاته وصار مثلاً في السوء الجزاء {cite:umari-masalik-1924 p. 230}."
  en: "An old Persian palace at al-Hira; in al-Baladhuri built by al-Nu'man ibn Imri' al-Qays — son of al-Shaqiqa bint Abi Rabi'a ibn Duhl ibn Shayban — for Bahram Jur ibn Yazdgard ibn Bahram ibn Sabur Dhu al-Aktaf, Bahram Jur being in this Nu'man's charge when he left his kingdom and wandered, as Adi ibn Zayd al-Ibadi mentions in his verse; when the blessed dawla rose al-Khawarnaq was granted to Ibrahim ibn Salama, one of the Khurasan da'is — grandfather of Abd al-Rahman ibn Ishaq the qadi of Madinat al-Salam under al-Ma'mun and al-Mu'tasim — and Ibrahim raised al-Khawarnaq's dome in Abu al-Abbas's reign, it not existing before."
