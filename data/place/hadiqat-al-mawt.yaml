label: { ar: "حديقة الموت", en: "The Garden of Death (Hadiqat al-Mawt)", es: "El Jardín de la Muerte (Hadiqat al-Mawt)", fr: "Le jardin de la mort (Hadiqat al-Mawt)", ur: "موت کا باغ ⁦(حدیث الموت)⁩" }
summary:
  ar: "بستان باليمامة كان يُسمى أُباض؛ أُلجئ إليه المشركون يوم وقعة اليمامة سنة 12هـ وقتل فيه مسيلمة فسُمّي يومئذ حديقة الموت لكثرة من قُتل به، وبنى فيه إسحاق بن أبي خميسة مولى قيس مسجداً جامعاً أيام المأمون؛ ومن حصون اليمامة المعروفة عند البلاذري قصر الورد المنسوب إلى الورد بن سمين بن عبيد الحنفي وحصن مُعتق المسمى لحصانته، ومن عيونها الرّيّا التي منها شرب الصعفوقة وشرب الخبيبة والخضرمة."
  en: "An orchard in al-Yamama formerly called Ubad; the polytheists were driven into it on the day of the battle of al-Yamama in 12 AH and Musaylima was killed in it, whence it was named the Garden of Death for the many slain there, and Ishaq ibn Abi Khamisa, mawla of Qays, built a congregational mosque in it in al-Ma'mun's days; among al-Yamama's named strongholds in al-Baladhuri are Qasr al-Ward, named for al-Ward ibn Samin ibn Ubayd al-Hanafi, and the fortress called Mu'tiq for its impregnability — that whoever took refuge in it was freed of his enemy — and among its springs al-Rayya with the sharb of al-Sa'fuqa, al-Khabiba and al-Khidrima."
  es: "Un huerto en al-Yamama antiguamente llamado Ubad; los politeístas fueron expulsados a él el día de la batalla de al-Yamama en el año 12 AH y Musaylima fue asesinado en él, por lo que fue llamado el Jardín de la Muerte por los muchos asesinados allí, e Ishaq ibn Abi Khamisa, mawla de Qays, construyó una mezquita congregacional en él en los días de al-Ma'mun; entre las fortalezas nombradas de al-Yamama en al-Baladhuri están Qasr al-Ward, llamado así por al-Ward ibn Samin ibn Ubayd al-Hanafi, y la fortaleza llamada Mu'tiq por su inexpugnabilidad —que quien se refugiaba en ella era liberado de su enemigo— y entre sus manantiales al-Rayya con el sharb de al-Sa'fuqa, al-Khabiba y al-Khidrima."
  fr: "Un verger à al-Yamama, autrefois appelé Ubad; les polythéistes y furent repoussés le jour de la bataille d'al-Yamama en 12 AH et Musaylima y fut tué, d'où son nom de Jardin de la Mort en raison des nombreux morts qui s'y trouvèrent, et Ishaq ibn Abi Khamisa, mawla de Qays, y fit construire une mosquée du vendredi à l'époque d'al-Ma'mun; parmi les places fortes nommées d'al-Yamama à al-Baladhuri figurent Qasr al-Ward, nommé d'après al-Ward ibn Samin ibn Ubayd al-Hanafi, et la forteresse appelée Mu'tiq pour son imprégnabilité — quiconque s'y réfugiait était libéré de son ennemi — et parmi ses sources se trouvent al-Rayya avec le sharb d'al-Sa'fuqa, al-Khabiba et al-Khidrima."
  ur: "یمامہ میں ایک باغ جسے پہلے عباد کہا جاتا تھا۔ 12 ہجری میں جنگ یمامہ کے دن مشرکین کو اس میں بھگا دیا گیا اور مسیلمہ اس میں مارا گیا، اسی وجہ سے اس کو وہاں کے بہت سے مقتولین کے لیے موت کا باغ کہا گیا، اور قیس کے مولا اسحاق بن ابی خمیسہ نے مامون کے دنوں میں اس میں ایک اجتماعی مسجد تعمیر کی۔ البلادھوری میں یمامہ کے نام کے گڑھوں میں سے قصر الورد ہیں، جسے ورد ابن سمین ابن عبید الحنفی کے نام سے منسوب کیا گیا ہے، اور اس کے ناقابل تسخیر ہونے کی وجہ سے معتق کہلانے والا قلعہ ہے - کہ جس نے اس میں پناہ لی اس کے دشمن سے آزاد ہو گیا - اور اس کے چشموں میں سے الریاض الصباء اور الصحابہ کے ساتھ۔ الخدریمہ"
