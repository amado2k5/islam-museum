label: { ar: "حديقة الموت", en: "The Garden of Death (Hadiqat al-Mawt)" }
summary:
  ar: "بستان باليمامة كان يُسمى أُباض؛ أُلجئ إليه المشركون يوم وقعة اليمامة سنة 12هـ وقتل فيه مسيلمة فسُمّي يومئذ حديقة الموت لكثرة من قُتل به، وبنى فيه إسحاق بن أبي خميسة مولى قيس مسجداً جامعاً أيام المأمون؛ ومن حصون اليمامة المعروفة عند البلاذري قصر الورد المنسوب إلى الورد بن سمين بن عبيد الحنفي وحصن مُعتق المسمى لحصانته، ومن عيونها الرّيّا التي منها شرب الصعفوقة وشرب الخبيبة والخضرمة."
  en: "An orchard in al-Yamama formerly called Ubad; the polytheists were driven into it on the day of the battle of al-Yamama in 12 AH and Musaylima was killed in it, whence it was named the Garden of Death for the many slain there, and Ishaq ibn Abi Khamisa, mawla of Qays, built a congregational mosque in it in al-Ma'mun's days; among al-Yamama's named strongholds in al-Baladhuri are Qasr al-Ward, named for al-Ward ibn Samin ibn Ubayd al-Hanafi, and the fortress called Mu'tiq for its impregnability — that whoever took refuge in it was freed of his enemy — and among its springs al-Rayya with the sharb of al-Sa'fuqa, al-Khabiba and al-Khidrima."
