summary:
  ar: "زويلة من مدن المغرب ما بين برقة وفزان؛ بلغها عقبة بن نافع الفهري في ولايته الأولى للمغرب من قبل عمرو بن العاص ووضع على أهلها ومن بينها وبين برقة ما رأى أنهم يطيقونه."
  en: "Zawila, a town of the Maghreb between Barqa and Fazzan; Uqba ibn Nafi' al-Fihri reached it in his first charge over the Maghreb from Amr ibn al-As, laying on its people and those between it and Barqa what he judged they could bear."
  es: "Zawila, una ciudad del Magreb situada entre Barqa y Fazzan; Uqba ibn Nafi' al-Fihri llegó a ella en su primer mandato sobre el Magreb, enviado por Amr ibn al-As, imponiendo a sus habitantes y a los que se encontraban entre Zawila y Barqa lo que, a su juicio, podían soportar."
  fr: "Zawila, une ville du Maghreb entre Barqa et Fazzan; Uqba ibn Nafi' al-Fihri l'atteignit lors de sa première charge sur le Maghreb depuis Amr ibn al-As, infligeant à ses habitants et à ceux situés entre elle et Barqa ce qu'il jugeait qu'ils pouvaient supporter."
  ur: "زاویلا، مغرب کا ایک قصبہ جو برقع اور فزان کے درمیان ہے۔ عقبہ بن نافع الفہری نے مغرب پر اپنے پہلے الزام میں عمرو بن العاص سے اس تک پہنچا، اس کے لوگوں اور اس کے درمیان رہنے والوں پر اور برقع کے درمیان جو فیصلہ کیا وہ برداشت کر سکتے تھے۔"
  tr: "Zuweila, Cyrenaica ile Fezzan arasında yer alan Fas'ın şehirlerinden biridir; Amr ibn al-As, Fas'ın ilk valiliği sırasında Uqba ibn Nafi' al-Fihri tarafından ulaşılmıştır; halkına ve Cyrenaica ile arasına dayanabileceklerini dayatmıştır."
  id: "Zuweila adalah salah satu kota di Maroko yang terletak di antara Cyrenaica dan Fezzan; kota ini dicapai oleh Uqba ibn Nafi' al-Fihri selama masa pemerintahan pertamanya di Maroko oleh Amr ibn al-As, yang memaksakan kepada rakyatnya dan antara Cyrenaica apa yang menurutnya mampu mereka tanggung."
