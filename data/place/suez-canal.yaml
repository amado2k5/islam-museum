label: { ar: "قناة السويس", en: "Suez Canal", ur: "نہرِ سویز" }
summary:
  ar: "قناة بحرية تربط البحر المتوسط بالبحر الأحمر عبر برزخ السويس. منح سعيد باشا الامتياز لفرديناند دي لسبس في 5 كانون الثاني 1856م، وتأسست شركة القناة في باريس سنة 1858م، وبدأ الحفر في 22 نيسان 1859م، وافتُتحت القناة في 16 تشرين الثاني 1869م بطول 164 كم وعرض 52 م. وباع الخديوي إسماعيل أسهمه لبريطانيا، وضمنت اتفاقية القسطنطينية سنة 1888م حرية الملاحة، وأممتها الحكومة المصرية في 26 تموز 1956م {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}."
  en: "A ship canal joining the Mediterranean to the Red Sea across the Isthmus of Suez. Sa'id Pasha signed the concession to Ferdinand de Lesseps on 5 January 1856, the Suez Canal Company was founded in Paris in 1858, digging began on 22 April 1859, and the canal opened on 16 November 1869 at 164 km long and 52 m wide. Khedive Ismail was forced to sell his shares to the British government, the Convention of Constantinople of 1888 guaranteed freedom of passage, and the Egyptian government nationalised the canal on 26 July 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}."
  ur: "ایک بحری نہر جو برزخِ سویز کے پار بحیرۂ روم کو بحیرۂ احمر سے ملاتی ہے۔ سعید پاشا نے 5 جنوری 1856ء کو فرڈیننڈ دی لیسپس کو امتیازی اجازت نامہ دیا، نہر کی کمپنی 1858ء میں پیرس میں قائم ہوئی، کھدائی 22 اپریل 1859ء کو شروع ہوئی، اور نہر 16 نومبر 1869ء کو 164 کلومیٹر لمبائی اور 52 میٹر چوڑائی کے ساتھ کھلی۔ خدیو اسماعیل کو اپنے حصص برطانوی حکومت کو بیچنا پڑے، 1888ء کے معاہدۂ قسطنطنیہ نے آمد و رفت کی آزادی کی ضمانت دی، اور مصری حکومت نے 26 جولائی 1956ء کو اسے قومیا لیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}۔"
