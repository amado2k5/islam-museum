label: { ar: "قناة السويس", en: "Suez Canal", ur: "نہرِ سویز", es: "Canal de Suez", fr: "Canal de Suez", tr: "Süveyş Kanalı", id: "Terusan Suez" }
summary:
  ar: "قناة بحرية تربط البحر المتوسط بالبحر الأحمر عبر برزخ السويس. منح سعيد باشا الامتياز لفرديناند دي لسبس في 5 كانون الثاني 1856م، وتأسست شركة القناة في باريس سنة 1858م، وبدأ الحفر في 22 نيسان 1859م، وافتُتحت القناة في 16 تشرين الثاني 1869م بطول 164 كم وعرض 52 م. وباع الخديوي إسماعيل أسهمه لبريطانيا، وضمنت اتفاقية القسطنطينية سنة 1888م حرية الملاحة، وأممتها الحكومة المصرية في 26 تموز 1956م {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}."
  en: "A ship canal joining the Mediterranean to the Red Sea across the Isthmus of Suez. Sa'id Pasha signed the concession to Ferdinand de Lesseps on 5 January 1856, the Suez Canal Company was founded in Paris in 1858, digging began on 22 April 1859, and the canal opened on 16 November 1869 at 164 km long and 52 m wide. Khedive Ismail was forced to sell his shares to the British government, the Convention of Constantinople of 1888 guaranteed freedom of passage, and the Egyptian government nationalised the canal on 26 July 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}."
  ur: "ایک بحری نہر جو برزخِ سویز کے پار بحیرۂ روم کو بحیرۂ احمر سے ملاتی ہے۔ سعید پاشا نے 5 جنوری 1856ء کو فرڈیننڈ دی لیسپس کو امتیازی اجازت نامہ دیا، نہر کی کمپنی 1858ء میں پیرس میں قائم ہوئی، کھدائی 22 اپریل 1859ء کو شروع ہوئی، اور نہر 16 نومبر 1869ء کو 164 کلومیٹر لمبائی اور 52 میٹر چوڑائی کے ساتھ کھلی۔ خدیو اسماعیل کو اپنے حصص برطانوی حکومت کو بیچنا پڑے، 1888ء کے معاہدۂ قسطنطنیہ نے آمد و رفت کی آزادی کی ضمانت دی، اور مصری حکومت نے 26 جولائی 1956ء کو اسے قومیا لیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}۔"
  es: "Un canal marítimo que unía el Mediterráneo con el Mar Rojo a través del istmo de Suez. Sa'id Pasha firmó la concesión a Ferdinand de Lesseps el 5 de enero de 1856, la Compañía del Canal de Suez se fundó en París en 1858, las excavaciones comenzaron el 22 de abril de 1859 y el canal se inauguró el 16 de noviembre de 1869 con 164 km de longitud y 52 m de ancho. El jedive Ismail se vio obligado a vender sus acciones al gobierno británico, la Convención de Constantinopla de 1888 garantizó la libertad de paso y el gobierno egipcio nacionalizó el canal el 26 de julio de 1956 {cite:encyclopaedia-of-islam-2 vol. 9 p. 938} {cite:encyclopaedia-of-islam-2 vol. 9 p. 939}."
  fr: "Le canal de Suez relie la Méditerranée à la mer Rouge en traversant l'isthme de Suez. Saïd Pacha signa la concession à Ferdinand de Lesseps le 5 janvier 1856. La Compagnie du canal de Suez fut fondée à Paris en 1858, les travaux de creusement commencèrent le 22 avril 1859 et le canal fut inauguré le 16 novembre 1869. Long de 164 km et large de 52 m, il fut contraint de vendre ses parts au gouvernement britannique. La Convention de Constantinople de 1888 garantit la liberté de passage et le gouvernement égyptien nationalisa le canal le 26 juillet 1956."
  tr: "Süveyş Boğazı üzerinden Akdeniz'i Kızıldeniz'e bağlayan bir deniz kanalı. Said Paşa, 5 Ocak 1856'da Ferdinand de Lesseps'e imtiyaz verdi. Kanal Şirketi 1858'de Paris'te kuruldu ve kazı çalışmaları 22 Nisan 1859'da başladı. Kanal, 16 Kasım 1869'da 164 km uzunluğunda ve 52 m genişliğinde açıldı. Hidiv İsmail hisselerini Britanya'ya sattı ve 1888'de Konstantinopolis Antlaşması ile seyir özgürlüğü garanti altına alındı; bu antlaşma 26 Temmuz 1956'da Mısır hükümeti tarafından kamulaştırıldı {cite:Encyclopaedia-of-Islam-2 cilt 9, s. 938}."
  id: "Sebuah kanal laut yang menghubungkan Laut Mediterania dengan Laut Merah melalui Tanah Genting Suez. Said Pasha memberikan konsesi tersebut kepada Ferdinand de Lesseps pada 5 Januari 1856. Perusahaan Kanal didirikan di Paris pada tahun 1858, dan penggalian dimulai pada 22 April 1859. Kanal ini diresmikan pada 16 November 1869, dengan panjang 164 km dan lebar 52 m. Khedive Ismail menjual sahamnya kepada Inggris, dan Perjanjian Konstantinopel tahun 1888 menjamin kebebasan navigasi, yang dinasionalisasi oleh pemerintah Mesir pada 26 Juli 1956 {cite:Encyclopaedia-of-Islam-2 vol. 9, hlm. 938}."
