label: { ar: "علي گڑه ⁦(ألِيغَرْ)⁩", en: "Aligarh (Uttar Pradesh)", es: "Aligarh (Uttar Pradesh)", fr: "Aligarh (Uttar Pradesh)", ur: "علی گڑھ ⁦(اتر پردیش)⁩", tr: "Ali Garh (Aligarh)", id: "Ali Garh (Aligarh)" }
summary:
  ar: "علي گڑه، مدينة ومقاطعة في شمال الهند بولاية أترابرديش، وتعود أهميتها الحديثة إلى الجامعة التي أسسها سيد أحمد خان سنة 1875م بوصفها مدرسة ثم كلية ثم جامعة سنة 1920م {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
  en: "Aligarh, a town and district in Uttar Pradesh in northern India. Its modern importance rests on the university that Sir Sayyid Ahmad Khan began to build in 1871 as a school, which became a college in 1878 and a university in 1920 {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
  es: "Aligarh, una ciudad y distrito en Uttar Pradesh, en el norte de la India. Su importancia moderna radica en la universidad que Sir Sayyid Ahmad Khan comenzó a construir en 1871 como escuela, que se convirtió en colegio en 1878 y en universidad en 1920 {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
  fr: "Aligarh, une ville et un district de l'Uttar Pradesh dans le nord de l'Inde. Son importance moderne repose sur l'université que Sir Sayyid Ahmad Khan a commencé à construire en 1871 comme une école, qui est devenue un collège en 1878 et une université en 1920 {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
  ur: "علی گڑھ، شمالی ہندوستان میں اتر پردیش کا ایک قصبہ اور ضلع۔ اس کی جدید اہمیت اس یونیورسٹی پر منحصر ہے جسے سر سید احمد خان نے 1871 میں ایک اسکول کے طور پر بنانا شروع کیا، جو 1878 میں کالج اور 1920 میں یونیورسٹی بن گیا۔ 1 ص۔ 425}۔"
  tr: "Aligarh, Hindistan'ın kuzeyinde, Uttar Pradesh eyaletinde bir şehir ve ilçedir. Modern önemi, 1875'te Syed Ahmad Khan tarafından okul, sonra kolej, ardından 1920'de üniversite olarak kurulan üniversiteye dayanır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 425}."
  id: "Aligarh adalah sebuah kota dan distrik di India utara di negara bagian Uttar Pradesh. Signifikansi modernnya bermula sejak universitas yang didirikan oleh Syed Ahmad Khan pada tahun 1875 sebagai sekolah, kemudian perguruan tinggi, dan kemudian universitas pada tahun 1920 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 425}."
