summary:
  ar: "علي گڑه، مدينة ومقاطعة في شمال الهند بولاية أترابرديش، وتعود أهميتها الحديثة إلى الجامعة التي أسسها سيد أحمد خان سنة 1875م بوصفها مدرسة ثم كلية ثم جامعة سنة 1920م {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
  en: "Aligarh, a town and district in Uttar Pradesh in northern India. Its modern importance rests on the university that Sir Sayyid Ahmad Khan began to build in 1871 as a school, which became a college in 1878 and a university in 1920 {cite:encyclopaedia-of-islam-2 vol. 1 p. 425}."
