  ur: "قسطنطین سے تقریباً چار دن کے فاصلے پر بسکرا ضلع میں ایک آبادی والا قلعہ، عمارتوں کے ساتھ ایک عمدہ گڑھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 270}"
  tr: "Biskra yapılarıyla dolu bir kale ve binalarla dolu güzel bir kale, Konstantin'e yaklaşık dört gün uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 270}"
  id: "Benteng penuh dengan karya Biskra dan benteng indah, dengan bangunan, sekitar empat hari dari Konstantinus. {cite:nuzhat-al-mushtaq-2002 hlm. 270}"
