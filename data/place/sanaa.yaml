summary:
  ar: "صنعاء المدينة الرئيسة في اليمن منذ القدم وعاصمة الجمهورية اليمنية، وتقع على ارتفاع يزيد على 2200 متر بين نقم وعيبان. ترجح دائرة المعارف الإسلامية أن اسمها سبئي بمعنى المحصنة، وتذكرها نقوش ما قبل الإسلام مركزًا عسكريًا. وتداولتها بعد الإسلام اليعفريون والصليحيون وأسر همدان والأيوبيون والعثمانيون والأئمة الزيدية، وفيها مدينة قديمة من بيوت البرج وأكثر من مئة مسجد وحمامات عامة وسوق كبير ودار سك."
  en: "Sana'a has been the chief town of Yemen since ancient times and is the capital of the Republic of Yemen, standing above 2,200 metres between Djabal Nukum and Djabal 'Ayban. The Encyclopaedia of Islam judges its name probably Sabaic, meaning well fortified, and pre-Islamic inscriptions show it as a military centre. After the coming of Islam it passed between the Yu'furids, Sulayhids, Hamdan families, Ayyubids, Ottomans and Zaydi Imams, and its old town keeps tower houses, over a hundred mosques, public baths, a large market and a mint."
  ur: "صنعاء قدیم زمانے سے یمن کا مرکزی شہر اور جمہوریہ یمن کا دارالحکومت ہے، جو جبل نقم اور جبل عیبان کے درمیان 2200 میٹر سے زیادہ بلندی پر واقع ہے۔ انسائیکلوپیڈیا آف اسلام کی رائے میں اس کا نام غالباً سبائی ہے اور مطلب مضبوط قلعہ بند ہے، اور اسلام سے پہلے کے کتبے اسے فوجی مرکز دکھاتے ہیں۔ اسلام کے بعد یہ یعفریوں، صلیحیوں، ہمدان کی شاخوں، ایوبیوں، عثمانیوں اور زیدی ائمہ کے درمیان بدلتا رہا، اور اس کے قدیم شہر میں برج نما گھر، سو سے زیادہ مسجدیں، عوامی حمام، بڑا بازار اور ٹکسال ہیں۔"
