  en: "Capital of Yemen, an early centre of Islam in the south of Arabia with a UNESCO-listed old city and a very old Great Mosque."
  ar: "عاصمة اليمن، ومركز إسلامي مبكر في جنوب الجزيرة العربية، ومدينتها القديمة مدرجة في قائمة اليونسكو، ومسجدها الكبير من أقدم المساجد. وروى المقدسي عن أبي القاسم الزجاجي أن اسمها القديم أزال فلما وافتها الحبشة قالوا هذه صنعة أي حصينة فسميت صنعاء، وعدّها من طيبات الهواء {cite:ahsan-al-taqasim p. 31}."
