summary:
  ar: "صنعاء المدينة الرئيسة في اليمن منذ القدم وعاصمة الجمهورية اليمنية، وتقع على ارتفاع يزيد على 2200 متر بين نقم وعيبان. ترجح دائرة المعارف الإسلامية أن اسمها سبئي بمعنى المحصنة، وتذكرها نقوش ما قبل الإسلام مركزًا عسكريًا. وتداولتها بعد الإسلام اليعفريون والصليحيون وأسر همدان والأيوبيون والعثمانيون والأئمة الزيدية، وفيها مدينة قديمة من بيوت البرج وأكثر من مئة مسجد وحمامات عامة وسوق كبير ودار سك."
  en: "Sana'a has been the chief town of Yemen since ancient times and is the capital of the Republic of Yemen, standing above 2,200 metres between Djabal Nukum and Djabal 'Ayban. The Encyclopaedia of Islam judges its name probably Sabaic, meaning well fortified, and pre-Islamic inscriptions show it as a military centre. After the coming of Islam it passed between the Yu'furids, Sulayhids, Hamdan families, Ayyubids, Ottomans and Zaydi Imams, and its old town keeps tower houses, over a hundred mosques, public baths, a large market and a mint."
  ur: "صنعاء قدیم زمانے سے یمن کا مرکزی شہر اور جمہوریہ یمن کا دارالحکومت ہے، جو جبل نقم اور جبل عیبان کے درمیان 2200 میٹر سے زیادہ بلندی پر واقع ہے۔ انسائیکلوپیڈیا آف اسلام کی رائے میں اس کا نام غالباً سبائی ہے اور مطلب مضبوط قلعہ بند ہے، اور اسلام سے پہلے کے کتبے اسے فوجی مرکز دکھاتے ہیں۔ اسلام کے بعد یہ یعفریوں، صلیحیوں، ہمدان کی شاخوں، ایوبیوں، عثمانیوں اور زیدی ائمہ کے درمیان بدلتا رہا، اور اس کے قدیم شہر میں برج نما گھر، سو سے زیادہ مسجدیں، عوامی حمام، بڑا بازار اور ٹکسال ہیں۔"
  es: "Saná ha sido la ciudad principal de Yemen desde la antigüedad y es la capital de la República de Yemen, situada a más de 2200 metros de altitud entre Djabal Nukum y Djabal 'Ayban. La Enciclopedia del Islam considera que su nombre es probablemente sabeo, que significa «bien fortificada», y las inscripciones preislámicas la identifican como un centro militar. Tras la llegada del Islam, pasó por manos de los yufurís, los sulayhíes, las familias hamdan, los ayubíes, los otomanos y los imanes zaidíes, y su casco antiguo conserva casas-torre, más de cien mezquitas, baños públicos, un gran mercado y una casa de la moneda."
  fr: "Sanaa est la principale ville du Yémen depuis l'Antiquité et la capitale de la République du Yémen. Elle se dresse à plus de 2 200 mètres d'altitude, entre le Djabal Nukum et le Djabal Ayban. L'Encyclopédie de l'Islam attribue son nom à une origine probablement sabaïque, signifiant « bien fortifiée », et des inscriptions préislamiques attestent de son rôle de centre militaire. Après l'avènement de l'islam, la ville passa successivement sous la domination des Youfurides, des Sulayhides, des Hamdan, des Ayyoubides, des Ottomans et des imams zaïdites. Sa vieille ville conserve des maisons-tours, plus d'une centaine de mosquées, des bains publics, un grand marché et un atelier monétaire."
  tr: "Sana'a, eski çağlardan beri Yemen'in ana şehri olup, Yemen Cumhuriyeti'nin başkentidir; Nuqam ile Aiban arasında 2200 metreden fazla bir rakımda yer almaktadır. İslam Ansiklopedisi adının Sabai olduğunu, yani tahkimatlı olduğunu öne sürer ve İslam öncesi yazıtlarda burayı askeri bir merkez olarak belirtir. İslam'dan sonra, Ya'afriler, Süleyhiler, Hamdan aileleri, Eyyubiler, Osmanlılar ve Zeydi imamları tarafından kullanılmıştır. Ayrıca kule evlerinden oluşan eski bir şehir, yüzün üzerinde cami, halka açık hamamlar, büyük bir pazar ve darphaneyi de içerir."
  id: "Sana'a telah menjadi kota utama di Yaman sejak zaman kuno dan ibu kota Republik Yaman, terletak pada ketinggian lebih dari 2200 meter antara Nuqam dan Aiban. Ensiklopedia Islam menyatakan bahwa namanya adalah Sabai, yang berarti benteng, dan prasasti pra-Islam menyebutnya sebagai pusat militer. Setelah Islam, kota ini digunakan oleh Ya'afri, Sulayhid, keluarga Hamdan, Ayyubid, Ottoman, dan imam Zaydi. Kota ini juga mencakup kota tua dengan rumah menara, lebih dari seratus masjid, pemandian umum, pasar besar, dan sebuah percetakan uang (mint)."
