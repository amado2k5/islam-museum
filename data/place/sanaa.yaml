summary:
  en: "Capital of Yemen, an early centre of Islam in the south of Arabia with a UNESCO-listed old city and a very old Great Mosque. The native son al-Hamdani praised it in verse as 'Sana'a of the halls and towering clay towers', the abode of kingship whose twin wonders were Ghumdan and the Qalis {cite:sifat-jazirat-al-arab pp. 220-221}."
  ar: "عاصمة اليمن، ومركز إسلامي مبكر في جنوب الجزيرة العربية، ومدينتها القديمة مدرجة في قائمة اليونسكو، ومسجدها الكبير من أقدم المساجد. وروى المقدسي عن أبي القاسم الزجاجي أن اسمها القديم أزال فلما وافتها الحبشة قالوا هذه صنعة أي حصينة فسميت صنعاء، وعدّها من طيبات الهواء {cite:ahsan-al-taqasim p. 31}. ووصفها الهمداني، وهو ابن بلدها، في شعره بأنها «صنعاء ذات الدور والأطام» ودار الملك ومعدن حمير، وعدّ فيها غمدان والقليس آيتيها العظيمتين، وجبليها نقم وعيبان {cite:sifat-jazirat-al-arab pp. 220-221}."
