education:
  did_you_know:
    ar: "صنعاء عاصمة اليمن، اسمها القديم أزال عند الزجاجي، وعدّها المقدسي من طيبات الهواء، وذكر الهمداني فيها غمدان والقليس آيتيها العظيمتين."
    en: "Sana'a, Yemen's capital — its ancient name was Azal per al-Zajjaji — is counted by al-Muqaddasi among the sweetest of airs; al-Hamdani names Ghumdan and the Qalis its two great marvels."
    ur: "صنعاء، یمن کا دارالحکومت — زجاجی کے مطابق قدیم نام ازال تھا — مقدسی اسے پاکیزہ ہواؤں میں شمار کرتا ہے؛ ہمدانی اس کے دو عظیم آثار غمدان اور قلیس گنتا ہے۔"
    sources: [source/ahsan-al-taqasim, source/sifat-jazirat-al-arab]
