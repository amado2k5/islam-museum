  ur: "شُونیہ کی سرزمین میں ایک شہر؛ مصنف نے اقراء سے ایک سو میل اور ہالہ سے چالیس میل کا فاصلہ بیان کیا ہے۔ 890}۔"
  tr: "Şasuniya diyarından bir şehirdir ve yazar, Iqraku'dan yüz mil uzaklıkta, Hala ile arasında ise kırk mil olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 890}."
  id: "Sebuah kota dari tanah Shasuniya, dan penulis menyebutkan bahwa kota ini berjarak seratus mil dari Iqraku, dan antara kota itu dan Hala berjarak empat puluh mil {cite:Nuzhat-al-Mushtaq-2002, hlm. 890}."
