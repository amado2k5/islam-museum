  ar: "مدينة من أرض شصونية، ويذكر المؤلف أنها تبعد عن إقراقو مائة ميل، وبينها وبين هالة أربعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 890}."
  en: "A city in the land of Shuṣūniya; the author gives one hundred miles from Iqrāqū and forty miles from Hāla {cite:nuzhat-al-mushtaq-2002 p. 890}."
