  es: "Bardha'a (Partaw) en Arran, 'la ciudad fronteriza entera'; Qubadh ibn Fayruz la construyó cuando siguió a su general, que había tomado lo que se encontraba entre el río al-Rass y Shirwan."
  fr: "Bardha'a (Partaw) à Arran, « la ville entière de la frontière »; Qubadh ibn Fayruz l'a construite lorsqu'il a suivi son général qui avait pris ce qui se trouvait entre la rivière al-Rass et Shirwan."
  tr: "Arran'daki Bardha'a, Al-Thaghr şehrinin tamamı; Kabad ibn Fairuz tarafından, Ar-Rass Nehri ile Şirvan arasındaki bölgeyi fetheden komutanını takip ederek inşa edilmiştir."
  id: "Bardha'a di Arran, seluruh kota Al-Thaghr; kota ini dibangun oleh Qubad ibn Fairuz ketika ia mengikuti komandannya yang menaklukkan wilayah antara Sungai Ar-Rass dan Shirwan."
