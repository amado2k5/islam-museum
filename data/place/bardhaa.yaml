summary:
  ar: "برذعة بأران مدينة الثغر كله؛ بناها قباذ بن فيروز حين تبع قائده الذي فتح ما بين نهر الرس إلى شروان."
  en: "Bardha'a (Partaw) in Arran, 'the frontier's city entire'; Qubadh ibn Fayruz built it when he followed his general who had taken what lay between the river al-Rass and Shirwan."
