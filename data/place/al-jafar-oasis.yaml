label: { ar: "الجفار", en: "Al-Jafar (oasis)", es: "Al-Jafar (oasis)", fr: "Al-Jafar (oasis)", ur: "الجعفر ⁦(نخلستان)⁩", tr: "Al-Jaffar", id: "Al-Jaffar" }
summary:
  ar: "مدينة من مدينتين معمورتين في أسفل الواحات، وكانت أرضها معمورة فيما مضى بالزعفران والعصفر والنيلج وقصب السكر، ووصفها المؤلف بأنها قرية كالحصن محاطة بالنخل ذات ماء غزير {cite:nuzhat-al-mushtaq-2002 p. 123}."
  en: "One of two inhabited settlements at the lower end of the oases. The author says it once grew saffron, safflower, indigo and sugar cane, and now is a fortified-looking village ringed by palms with abundant sweet water {cite:nuzhat-al-mushtaq-2002 p. 123}."
  es: "Uno de los dos asentamientos habitados en el extremo inferior de los oasis. El autor dice que antiguamente se cultivaban azafrán, cártamo, índigo y caña de azúcar, y que ahora es un pueblo de aspecto fortificado rodeado de palmeras con abundante agua dulce {cite:nuzhat-al-mushtaq-2002 p. 123}."
  fr: "L'un des deux villages habités situés à l'extrémité inférieure des oasis. L'auteur indique qu'on y cultivait autrefois du safran, du carthame, de l'indigo et de la canne à sucre, et qu'il s'agit aujourd'hui d'un village fortifié entouré de palmiers et riche en eau douce {cite:nuzhat-al-mushtaq-2002 p. 123}."
  ur: "نخلستان کے نچلے سرے پر دو آباد بستیوں میں سے ایک۔ مصنف کا کہنا ہے کہ اس میں ایک زمانے میں زعفران، زعفران، نیل اور گنے اگے تھے، اور اب یہ ایک قلعہ نما گاؤں ہے جس میں کھجوروں سے بھرا ہوا میٹھا پانی ہے۔ 123}۔"
  tr: "Vahaların dibinde iki yerleşim kasabasından oluşan bir şehir olup, toprakları bir zamanlar safran, safran, nilaj ve şeker kamışı ile doluydu. Yazar, burayı palmiye ağaçlarıyla çevrili, bol su bulunan kale benzeri bir köy olarak tanımlamıştır {cite:Nuzhat-al-Mushtaq-2002, s. 123}."
  id: "Sebuah kota yang terdiri dari dua kota berpenghuni di dasar oasis, dan wilayahnya dulunya dihuni oleh saffron, saffron, nilaj, dan tebu. Penulis menggambarkannya sebagai desa mirip benteng yang dikelilingi pohon palem dengan air melimpah {cite:Nuzhat-al-Mushtaq-2002, hlm. 123}."
