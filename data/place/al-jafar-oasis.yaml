  ar: "مدينة من مدينتين معمورتين في أسفل الواحات، وكانت أرضها معمورة فيما مضى بالزعفران والعصفر والنيلج وقصب السكر، ووصفها المؤلف بأنها قرية كالحصن محاطة بالنخل ذات ماء غزير {cite:nuzhat-al-mushtaq-2002 p. 123}."
  en: "One of two inhabited settlements at the lower end of the oases. The author says it once grew saffron, safflower, indigo and sugar cane, and now is a fortified-looking village ringed by palms with abundant sweet water {cite:nuzhat-al-mushtaq-2002 p. 123}."
