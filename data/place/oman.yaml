summary:
  ar: "بلاد عمان، وصفها الإدريسي بأنها مستقلة بذاتها وعامرة بأهلها، وفيها الموز والرمان والتين والعنب وغيرها من الفواكه. {cite:nuzhat-al-mushtaq-2002 p. 155}"
  en: "The land of Oman, which al-Idrisi describes as self-contained and well peopled, with bananas, pomegranates, figs, grapes and other fruit. {cite:nuzhat-al-mushtaq-2002 p. 155}"
  es: "La tierra de Omán, que al-Idrisi describe como autosuficiente y bien poblada, con plátanos, granadas, higos, uvas y otras frutas. {cite:nuzhat-al-mushtaq-2002 p. 155}"
  fr: "Le pays d'Oman, qu'al-Idrisi décrit comme autosuffisant et densément peuplé, avec des bananes, des grenades, des figues, des raisins et d'autres fruits. {cite:nuzhat-al-mushtaq-2002 p. 155}"
  ur: "عمان کی سرزمین، جسے الادریسی نے خود ساختہ اور اچھی قوم کے طور پر بیان کیا ہے، جس میں کیلے، انار، انجیر، انگور اور دیگر پھل ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 155}"
  tr: "Al-İdrisi tarafından bağımsız ve halkı açısından zengin olarak tanımlanan Umman, muz, nar, incir, üzüm ve diğer meyvelerle dolu. {kaynak:nuzhat-al-mushtaq-2002 s. 155}"
  id: "Oman, yang digambarkan oleh Al-Idrisi sebagai mandiri dan kaya dengan rakyatnya, dengan pisang, delima, ara, anggur, dan buah-buahan lainnya. {cite:nuzhat-al-mushtaq-2002 hlm. 155}"
