summary:
  ar: "مرفأ صغير للصيد على ساحل فلسطين، على بعد نحو 10 أميال شمال يافا؛ يُرجَّح أن اسمه العربي يحفظ إهداءه الأصلي للإله السامي رشف. كان في أوائل الخلافة من أهم المدن المحصنة في فلسطين، واحتله الصليبيون بقيادة بلدوين الأول سنة 494هـ ⁦(1101م)⁩ وسموه أزوتوس، واستعاده صلاح الدين سنة 583هـ ⁦(1187م)⁩، ثم أعاده الصليبيون بهدنة مع ريتشارد الأول، وأخذه الظاهر بيبرس سنة 663هـ ⁦(1265م)⁩ بعد حصار دام أربعين يومًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 711}."
  en: "A small fishing port on the Palestinian coast, about ten miles north of Jaffa; its Arabic name probably preserves its original dedication to the Semitic god Reseph. In the early Caliphate it was one of the principal fortified cities of Filastin. The Crusaders under Baldwin I occupied it in 494 AH (1101), calling it Azotus; Saladin recaptured it in 583 AH (1187); it was restored to the Crusaders under the truce with Richard I in 588 AH (1192); and the sultan Baybars took it in 663 AH (1265) after a siege of forty days, leaving it in ruins {cite:encyclopaedia-of-islam-2 vol. 1 p. 711}."
  es: "Un pequeño puerto pesquero en la costa palestina, a unos dieciséis kilómetros al norte de Jaffa; su nombre árabe probablemente conserva su dedicación original al dios semita Reseph. En los inicios del Califato fue una de las principales ciudades fortificadas de Filastin. Los cruzados, bajo el mando de Balduino I, la ocuparon en el año 494 de la Hégira (1101), llamándola Azoto; Saladino la reconquistó en el año 583 de la Hégira (1187); fue devuelta a los cruzados en virtud de la tregua con Ricardo I en el año 588 de la Hégira (1192); y el sultán Baybars la tomó en el año 663 de la Hégira (1265) tras un asedio de cuarenta días, dejándola en ruinas {cite:encyclopaedia-of-islam-2 vol. 1 p. 711}."
  fr: "Petit port de pêche sur la côte palestinienne, à une quinzaine de kilomètres au nord de Jaffa, son nom arabe conserve probablement sa dédicace originelle au dieu sémitique Reseph. Au début du califat, c'était l'une des principales villes fortifiées de Philastin. Les croisés, sous Baudouin Ier, l'occupèrent en 494 AH (1101), la nommant Azot. Saladin la reprit en 583 AH (1187). Elle fut restituée aux croisés lors de la trêve avec Richard Ier en 588 AH (1192). Le sultan Baybars s'en empara en 663 AH (1265) après un siège de quarante jours, la laissant en ruines."
  ur: "فلسطین کے ساحل پر ماہی گیری کی ایک چھوٹی بندرگاہ، جفا سے تقریباً دس میل شمال میں؛ اس کا عربی نام شاید سامی دیوتا ریسیف کے لیے اپنی اصل لگن کو محفوظ رکھتا ہے۔ ابتدائی خلافت میں یہ فلاسٹن کے اہم قلعہ بند شہروں میں سے ایک تھا۔ بالڈون اول کے ماتحت صلیبیوں نے اس پر 494 ہجری (1101) میں قبضہ کیا، اسے ازوٹس کہتے تھے۔ صلاح الدین نے اسے 583ھ (1187) میں دوبارہ حاصل کیا۔ یہ 588 ہجری (1192) میں رچرڈ اول کے ساتھ جنگ بندی کے تحت صلیبیوں کو بحال کیا گیا تھا۔ اور سلطان بیبرس نے اسے 663ھ (1265) میں چالیس دن کے محاصرے کے بعد اپنے قبضے میں لے لیا اور اسے کھنڈرات میں چھوڑ دیا۔ 1 ص۔ 711}۔"
  tr: "Filistin kıyısında, Yafa'nın yaklaşık 10 mil kuzeyinde küçük bir balıkçı limanıdır; Arapça adının, Sami tanrısı Raşif'e olan orijinal adanmasını koruduğu düşünülmektedir. Erken halifelikte, Filistin'in en önemli tahkimatlı şehirlerinden biriydi. 494 Hicri (1101) yılında Baldwin I komutasındaki Haçlılar tarafından işgal edilmiş ve Azutus olarak adlandırılmıştır. Salah al-Din 583 Hicri (1187) yılında burayı geri almış, ardından Haçlılar I. Richard ile yapılan ateşkes yoluyla geri getirmiştir. 663 Hicri (1265) yılında, kırk gün süren bir kuşatmanın ardından el-Zahir Baybars tarafından ele geçirilmiştir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 711}."
  id: "Sebuah pelabuhan nelayan kecil di pesisir Palestina, sekitar 10 mil utara Jaffa; dipercaya bahwa nama Arabnya mempertahankan dedikasi aslinya kepada dewa Semit Rashif. Pada masa khalifah awal, kota ini merupakan salah satu kota benteng terpenting di Palestina. Pelabuhan ini diduduki oleh tentara salib di bawah Baldwin I pada tahun 494 H (1101 M) dan dinamai Azutus. Salah al-Din merebutnya kembali pada tahun 583 H (1187 M), kemudian Tentara Salib memulihkannya melalui gencatan senjata dengan Richard I. Kota ini direbut oleh al-Zahir Baybars pada tahun 663 H (1265 M) setelah pengepungan selama empat puluh hari {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 711}."
