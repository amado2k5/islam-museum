summary:
  ar: "مرفأ صغير للصيد على ساحل فلسطين، على بعد نحو 10 أميال شمال يافا؛ يُرجَّح أن اسمه العربي يحفظ إهداءه الأصلي للإله السامي رشف. كان في أوائل الخلافة من أهم المدن المحصنة في فلسطين، واحتله الصليبيون بقيادة بلدوين الأول سنة 494هـ (1101م) وسموه أزوتوس، واستعاده صلاح الدين سنة 583هـ (1187م)، ثم أعاده الصليبيون بهدنة مع ريتشارد الأول، وأخذه الظاهر بيبرس سنة 663هـ (1265م) بعد حصار دام أربعين يومًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 711}."
  en: "A small fishing port on the Palestinian coast, about ten miles north of Jaffa; its Arabic name probably preserves its original dedication to the Semitic god Reseph. In the early Caliphate it was one of the principal fortified cities of Filastin. The Crusaders under Baldwin I occupied it in 494 AH (1101), calling it Azotus; Saladin recaptured it in 583 AH (1187); it was restored to the Crusaders under the truce with Richard I in 588 AH (1192); and the sultan Baybars took it in 663 AH (1265) after a siege of forty days, leaving it in ruins {cite:encyclopaedia-of-islam-2 vol. 1 p. 711}."
