summary:
  ar: "جبل لأهل جرش باليمن عطف عنده صرد بن عبد الله الأزدي على أهل جرش حين طلبوه فقتلهم؛ كان أهل جرش يسمونه كَشْر فقال النبي لوافديهم: ليس بكشر ولكنه شكر، وأخبرهم في ساعة الوقعة أن «بُدن الله لتُنحر عنده الآن»."
  en: "A mountain of the people of Jurash in Yemen where Surad ibn Abdullah al-Azdi turned on his pursuers and slaughtered them; the people of Jurash called it Kashr, and the Prophet told their two envoys it was Shakar, not Kashr, announcing at the hour of the battle that God's sacrificial camels were being slaughtered there."
  es: "Una montaña del pueblo de Jurash en Yemen donde Surad ibn Abdullah al-Azdi se volvió contra sus perseguidores y los masacró; el pueblo de Jurash la llamó Kashr, y el Profeta les dijo a sus dos enviados que era Shakar, no Kashr, anunciando en el momento de la batalla que allí se estaban sacrificando los camellos de Dios."
  fr: "Une montagne appartenant aux habitants de Jurash au Yémen, où Surad ibn Abdullah al-Azdi se retourna contre ses poursuivants et les massacra; les habitants de Jurash l'appelaient Kashr, et le Prophète dit à leurs deux envoyés qu'il s'agissait de Shakar, et non de Kashr, annonçant à l'heure de la bataille que les chameaux sacrificiels de Dieu étaient abattus là."
  ur: "یمن میں جراش کے لوگوں کا ایک پہاڑ جہاں صورد بن عبداللہ العزدی نے اپنے تعاقب کرنے والوں پر حملہ کیا اور انہیں ذبح کیا۔ اہل جرش نے اسے کاشر کہا اور نبی نے اپنے دونوں ایلچیوں کو بتایا کہ یہ شکر ہے نہ کہ کاشر، جنگ کے وقت اعلان کیا کہ وہاں خدا کے قربانی کے اونٹ ذبح کیے جا رہے ہیں۔"
  tr: "Yemen'deki Cereş halkına ait bir dağ, Yeraş halkı için bir sempati oldu; Cerash halkı ona Kaşgar dedi ve Peygamber ziyaretçilerine: Kaşar değil, şükran veriyor ve olay anında onlara \"Allah'ın bedeni şimdi O'nunla birlikte katledilecek\" dedi."
  id: "Sebuah gunung milik rakyat Jerash di Yaman menjadi simpati bagi rakyat Jerash ketika mereka mencarinya dan membunuh mereka; orang-orang Jerash memanggilnya Kashgar, dan Nabi berkata kepada para tamu mereka: Bukan Kashar tetapi ucapan syukur, dan Dia memberitahu mereka pada saat kejadian itu bahwa \"Tubuh Allah akan dibantai bersama-Nya sekarang.\""
