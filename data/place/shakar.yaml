summary:
  ar: "جبل لأهل جرش باليمن عطف عنده صرد بن عبد الله الأزدي على أهل جرش حين طلبوه فقتلهم؛ كان أهل جرش يسمونه كَشْر فقال النبي لوافديهم: ليس بكشر ولكنه شكر، وأخبرهم في ساعة الوقعة أن «بُدن الله لتُنحر عنده الآن»."
  en: "A mountain of the people of Jurash in Yemen where Surad ibn Abdullah al-Azdi turned on his pursuers and slaughtered them; the people of Jurash called it Kashr, and the Prophet told their two envoys it was Shakar, not Kashr, announcing at the hour of the battle that God's sacrificial camels were being slaughtered there."
