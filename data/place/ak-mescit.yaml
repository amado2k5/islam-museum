label:
  ar: "آق مسجد"
  en: "Ak Mescit ('White Mosque', Crimean town later Simferopol, and a fortress on the Syr Darya)"
summary:
  ar: "آق مسجد، أي «المسجد الأبيض»، اسم لمكانين: بلدة في القرم أنشأها خانات القرم لحماية عاصمتهم بختشي سراي من غارات البدو، وكان فيها قصر ولي العهد (قلغاي سلطان)، وخربها الروس سنة 1736م، وأُعيد بناؤها سنة 1784م باسم سيمفيروبول. وحصن على نهر سيحون (سير داريا) تابع لخانية خوقند، استولى عليه الروس سنة 1853م وسمي فورت بيروفسكي {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  en: "Ak Mescit, 'White Mosque', is the name of two places. The first is a town in the Crimea, founded by the khans to protect their capital Bakhchisaray from nomad raids, where the crown prince (kalghay sultan) had his palace. It was destroyed by the Russians in 1736 and rebuilt in 1784 as Simferopol, though the local population kept the Turkish name. The second is a fortress on the Syr Darya that belonged to the khanate of Khokand; the Russians took it under Perovsky in 1853 and called it Fort Perovsky {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
