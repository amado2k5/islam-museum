label:
  ar: "آق مسجد"
  en: "Ak Mescit ('White Mosque', Crimean town later Simferopol, and a fortress on the Syr Darya)"
  es: "Ak Mescit ('Mezquita Blanca', ciudad de Crimea más tarde Simferopol, y fortaleza en el Syr Darya)"
  fr: "Ak Mescit (« Mosquée blanche », ville de Crimée devenue Simferopol, et forteresse sur le Syr-Daria)"
  ur: "اک میسکیٹ ⁦('سفید مسجد'، کریمین شہر بعد میں سمفروپول، اور سیر دریا پر ایک قلعہ)⁩"
  tr: "Aq Camii"
  id: "Masjid Aq"
summary:
  ar: "آق مسجد، أي «المسجد الأبيض»، اسم لمكانين: بلدة في القرم أنشأها خانات القرم لحماية عاصمتهم بختشي سراي من غارات البدو، وكان فيها قصر ولي العهد ⁦(قلغاي سلطان)⁩، وخربها الروس سنة 1736م، وأُعيد بناؤها سنة 1784م باسم سيمفيروبول. وحصن على نهر سيحون ⁦(سير داريا)⁩ تابع لخانية خوقند، استولى عليه الروس سنة 1853م وسمي فورت بيروفسكي {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  en: "Ak Mescit, 'White Mosque', is the name of two places. The first is a town in the Crimea, founded by the khans to protect their capital Bakhchisaray from nomad raids, where the crown prince (kalghay sultan) had his palace. It was destroyed by the Russians in 1736 and rebuilt in 1784 as Simferopol, though the local population kept the Turkish name. The second is a fortress on the Syr Darya that belonged to the khanate of Khokand; the Russians took it under Perovsky in 1853 and called it Fort Perovsky {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  es: "Ak Mescit, «Mezquita Blanca», es el nombre de dos lugares. El primero es una ciudad en Crimea, fundada por los kanes para proteger su capital, Bajchisarái, de las incursiones nómadas, donde el príncipe heredero (kalghay sultán) tenía su palacio. Fue destruida por los rusos en 1736 y reconstruida en 1784 como Simferópol, aunque la población local conservó el nombre turco. El segundo es una fortaleza en el Syr Darya que perteneció al kanato de Khokand; los rusos la tomaron bajo el mando de Perovsky en 1853 y la llamaron Fuerte Perovsky {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  fr: "Ak Mescit, « Mosquée Blanche », désigne deux lieux. Le premier est une ville de Crimée, fondée par les khans pour protéger leur capitale, Bakhtchissaraï, des raids nomades. Le prince héritier (kalghaï sultan) y avait son palais. Détruite par les Russes en 1736, elle fut reconstruite en 1784 sous le nom de Simferopol, bien que la population locale ait conservé son nom turc. Le second est une forteresse sur le Syr-Daria, ayant appartenu au khanat de Khokand. Les Russes s'en emparèrent sous le commandement de Perovsky en 1853 et la renommèrent Fort Perovsky (voir Encyclopaedia of Islam, vol. 1, p. 334)."
  ur: "Ak Mescit، 'سفید مسجد'، دو جگہوں کا نام ہے۔ پہلا کریمیا کا ایک قصبہ ہے، جس کی بنیاد خانوں نے اپنے دارالحکومت بخچیسرائے کو خانہ بدوشوں کے چھاپوں سے بچانے کے لیے رکھی تھی، جہاں ولی عہد شہزادہ ⁦(کلگھے سلطان)⁩ کا محل تھا۔ اسے 1736 میں روسیوں نے تباہ کر دیا تھا اور 1784 میں سمفروپول کے نام سے دوبارہ تعمیر کیا گیا تھا، حالانکہ مقامی آبادی نے ترک نام رکھا تھا۔ دوسرا سیر دریا پر ایک قلعہ ہے جو کھوکند کے خانوں سے تعلق رکھتا تھا۔ روسیوں نے اسے 1853 میں پیرووسکی کے ماتحت لے لیا اور اسے فورٹ پیرووسکی کہا۔ 1 ص۔ 334}۔"
  tr: "Aq Camii, \"Beyaz Camii\" anlamına gelir ve iki yerin adıdır: Kırım hanlıkları tarafından başkentleri Bahçısaray'ı bedevi akınlarından korumak amacıyla kurulan Kırım'da bir kasaba. Burada veliaht prens (Qalgay Sultan) sarayı bulunuyordu; bu saray 1736'da Ruslar tarafından yıkılmış ve 1784'te Simferopol olarak yeniden inşa edilmiştir. Seyhun Nehri (Sir Darya) üzerinde, Khokand Hanlığı'na ait bir kaleydi; 1853'te Ruslar tarafından ele geçirildi ve Fort Berovsky adı verildi {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 334} olarak adlandırıldı."
  id: "Masjid Aq, yang berarti \"Masjid Putih,\" adalah nama dari dua tempat: sebuah kota di Krimea yang didirikan oleh khanat Krimea untuk melindungi ibu kota mereka Bakhchisaray dari serangan Badui. Masjid ini menampung istana putra mahkota (Qalgay Sultan), yang dihancurkan oleh Rusia pada tahun 1736 dan dibangun kembali pada tahun 1784 sebagai Simferopol. Benteng ini adalah benteng di Sungai Seyhun (Sir Darya) milik Khanat Khokand, yang direbut oleh Rusia pada tahun 1853, dan dinamai Benteng Berovsky {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 334}."
