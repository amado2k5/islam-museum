summary:
  ar: "مدينة في تراقيا على ملتقى نهري التونجا والأردة بالمريج، فتحها العثمانيون في عهد مراد الأول فصارت عاصمتهم بعد بورصة حتى فتح القسطنطينية سنة 1453م {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}، وفيها جامع السليمية من بناء سنان (1569-1575م) {cite:freely-ottoman-architecture-2011 p. 73}."
  en: "Thracian city at the confluence of the Tunca and Arda with the Meriç, taken by the Ottomans under Murad I as their capital after Bursa until the conquest of Constantinople in 1453 {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}; it holds Sinan's Selimiye Mosque (1569-75) {cite:freely-ottoman-architecture-2011 p. 73}."
  ur: "تھریس کا شہر، دریائے تونجہ و اردہ کے مریج سے ملنے کی جگہ پر واقع؛ مراد اول کے عہد میں عثمانیوں کے ہاتھ آ کر بورصہ کے بعد ان کا دارالحکومت بنا، یہاں تک کہ 1453ء میں قسطنطنیہ فتح ہوا {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}؛ یہاں سنان کی سلیمیہ مسجد (1569-75ء) ہے {cite:freely-ottoman-architecture-2011 p. 73}۔"
