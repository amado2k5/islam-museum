summary:
  ar: "أدرنة، أدريانوپل قديماً، مدينة في تراقيا عند التقاء التونجا والأردة بالمريج، فتحها لالا شاهين باشا في عهد مراد الأول سنة 763هـ/1362م فصارت قاعدة التوسع العثماني في أوروبا ثم عاصمتهم بعد بورصة. تقع على الطريق من آسيا الصغرى إلى البلقان، وفيها جوامع عثمانية كبرى منها جامع الشرفات الثلاث ومجمع بايزيد الثاني وجامع السليمية من بناء سنان {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. وتراجعت مكانتها بانتقال العاصمة إلى إسطنبول وبالاحتلال الروسي سنة 1829م."
  en: "Edirne, the ancient Adrianople, is a Thracian city at the confluence of the Tunca and Arda with the Meriç, taken in 763/1362 under Murad I and made the forward base of Ottoman expansion in Europe and then their capital after Bursa. It lies on the road from Asia Minor to the Balkans and holds major Ottoman mosques, among them the Üç Şerefeli, the Bayezid II complex and Sinan's Selimiye. Its standing fell when the capital moved to Istanbul and with the Russian occupation of 1829. {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}"
  ur: "ادرنہ، قدیم اڈریانوپل، تھریس کا شہر ہے جو تونجہ اور اردہ کے مریج سے ملنے کی جگہ پر ہے؛ 763ھ/1362ء میں مراد اول کے عہد میں فتح ہوا اور یورپ میں عثمانی توسیع کا اڈا بنا، پھر بورصہ کے بعد دارالحکومت۔ یہ اناطولیہ سے بلقان کی شاہراہ پر ہے اور یہاں بڑی عثمانی مسجدیں ہیں، جن میں اوچ شرفہ لی، بایزید دوم کا مجموعہ اور سنان کی سلیمیہ شامل ہیں۔ دارالحکومت کے استنبول جانے اور 1829ء کے روسی قبضے سے اس کی حیثیت گھٹی۔ {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}"
  es: "Edirne, la antigua Adrianópolis, es una ciudad tracia situada en la confluencia de los ríos Tunca y Arda con el Meriç. Fue conquistada en 763/1362 bajo el reinado de Murad I y se convirtió en la base de operaciones de la expansión otomana en Europa, siendo posteriormente su capital tras Bursa. Se ubica en la ruta que une Asia Menor con los Balcanes y alberga importantes mezquitas otomanas, entre ellas la de Üç Şerefeli, el complejo de Bayezid II y la Selimiye de Sinan. Su importancia disminuyó con el traslado de la capital a Estambul y con la ocupación rusa de 1829. {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}"
  fr: "Edirne, l'antique Andrinople, est une ville thrace située au confluent de la Tunca, de l'Arda et du Meriç. Conquise en 763/1362 sous Murad Ier, elle devint la base avancée de l'expansion ottomane en Europe, puis la capitale de l'Empire ottoman après Bursa. Située sur la route reliant l'Asie Mineure aux Balkans, elle abrite d'importantes mosquées ottomanes, parmi lesquelles l'Üç Şerefeli, le complexe de Bayezid II et la Selimiye de Sinan. Son importance déclina lorsque la capitale fut transférée à Istanbul et lors de l'occupation russe de 1829."
  tr: "Edirne, eski adıyla Adrianople, Trakya'da Tonga ile Arda ve El-Merij'in kesişim noktasında yer alan bir şehirdi. 763 Hicri/1362 yılında Murad I döneminde Lala Şahin Paşa tarafından fethedilmiş ve Osmanlı'nın Avrupa'daki yayılmasının merkezi ve ardından Bursa'dan sonra başkentleri olmuştur. Anadolu'dan Balkanlar'a giden güzergah üzerinde yer alır ve Üç Teraslı Camii, Bayezid II Kompleksi ve Sinan tarafından inşa edilen Selimiye Camii gibi önemli Osmanlı camilerini barındırır {cite:Encyclopaedia-of-Islam-2 cilt 2, s. 710} {cite:Encyclopaedia-of-Islam-2 cilt 2, s. 712}. Başkentin İstanbul'a taşınması ve 1829'daki Rus işgali ile statüsü azalmıştır."
  id: "Edirne, yang sebelumnya dikenal sebagai Adrianople, adalah sebuah kota di Trakia di titik pertemuan Tonga dan Arda serta Al-Merij. Kota ini ditaklukkan oleh Lala Şahin Pasha selama masa pemerintahan Murad I pada tahun 763 H/1362 M, menjadi basis ekspansi Ottoman di Eropa dan kemudian menjadi ibu kota mereka setelah Bursa. Kota ini terletak di jalur dari Asia Kecil ke Balkan dan berisi masjid-masjid Ottoman utama termasuk Masjid Tiga Teras, Kompleks Bayezid II, dan Masjid Selimiye yang dibangun oleh Sinan {cite:Encyclopaedia-of-Islam-2 vol. 2, hlm. 710} {cite:Encyclopaedia-of-Islam-2 vol. 2, hlm. 712}. Statusnya menurun dengan perpindahan ibu kota ke Istanbul dan pendudukan Rusia pada tahun 1829."
