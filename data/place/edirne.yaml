label: { en: "Edirne", ar: "أدرنة", ur: "ادرنہ" }
summary:
  ar: "أدرنة، أدريانوپل قديماً، مدينة في تراقيا عند التقاء التونجا والأردة بالمريج، فتحها لالا شاهين باشا في عهد مراد الأول سنة 763هـ/1362م فصارت قاعدة التوسع العثماني في أوروبا ثم عاصمتهم بعد بورصة. تقع على الطريق من آسيا الصغرى إلى البلقان، وفيها جوامع عثمانية كبرى منها جامع الشرفات الثلاث ومجمع بايزيد الثاني وجامع السليمية من بناء سنان {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. وتراجعت مكانتها بانتقال العاصمة إلى إسطنبول وبالاحتلال الروسي سنة 1829م."
  en: "Edirne, the ancient Adrianople, is a Thracian city at the confluence of the Tunca and Arda with the Meriç, taken in 763/1362 under Murad I and made the forward base of Ottoman expansion in Europe and then their capital after Bursa. It lies on the road from Asia Minor to the Balkans and holds major Ottoman mosques, among them the Üç Şerefeli, the Bayezid II complex and Sinan's Selimiye. Its standing fell when the capital moved to Istanbul and with the Russian occupation of 1829. {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}"
  ur: "ادرنہ، قدیم اڈریانوپل، تھریس کا شہر ہے جو تونجہ اور اردہ کے مریج سے ملنے کی جگہ پر ہے؛ 763ھ/1362ء میں مراد اول کے عہد میں فتح ہوا اور یورپ میں عثمانی توسیع کا اڈا بنا، پھر بورصہ کے بعد دارالحکومت۔ یہ اناطولیہ سے بلقان کی شاہراہ پر ہے اور یہاں بڑی عثمانی مسجدیں ہیں، جن میں اوچ شرفہ لی، بایزید دوم کا مجموعہ اور سنان کی سلیمیہ شامل ہیں۔ دارالحکومت کے استنبول جانے اور 1829ء کے روسی قبضے سے اس کی حیثیت گھٹی۔ {cite:encyclopaedia-of-islam-2 vol. 2 p. 710} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}"
