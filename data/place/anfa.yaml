summary:
  ar: "مرسى على ساحل المغرب، يبعد عن فضالة نحو أربعين ميلاً، تُحمل منه الحنطة والشعير والغنم، ويقصده البربر من بني يفرن ودكالة. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  en: "A harbour on the Maghreb coast about forty miles from Fudala, which ships wheat, barley and sheep, and where Berbers of Banu Yafran and Dukkala gather. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  es: "Un puerto en la costa del Magreb, a unas cuarenta millas de Fudala, desde donde se exportan trigo, cebada y ovejas, y donde se reúnen los bereberes de Banu Yafran y Dukkala. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  fr: "Un port sur la côte maghrébine, à une quarantaine de kilomètres de Fudala, d'où sont exportés du blé, de l'orge et des moutons, et où se rassemblent les Berbères des Banu Yafran et des Dukkala. {cite:nuzhat-al-mushtaq-2002 p. 240}"
  ur: "فدالا سے تقریباً چالیس میل کے فاصلے پر مغرب کے ساحل پر ایک بندرگاہ، جہاں سے گندم، جو اور بھیڑیں بھیجی جاتی ہیں اور جہاں بنو یفران اور دوکالہ کے بربر جمع ہوتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 240}"
