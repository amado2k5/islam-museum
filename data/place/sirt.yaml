summary:
  ar: "مدينة في أرض رملية على ميلين من البحر، بها بقايا نخيل ولا زيتون، وفيها تين كثير، وآبارها قليلة فيعتمد أهلها على ماء المطر المخزون في المواجل. {cite:nuzhat-al-mushtaq-2002 p. 298}"
  en: "A town on sandy ground two miles from the sea, with remnants of palms but no olives and many figs; its wells are few, so the people rely on rain stored in cisterns. {cite:nuzhat-al-mushtaq-2002 p. 298}"
  es: "Un pueblo situado en terreno arenoso a dos millas del mar, con restos de palmeras pero sin olivos y con muchas higueras; sus pozos son escasos, por lo que la gente depende del agua de lluvia almacenada en cisternas. {cite:nuzhat-al-mushtaq-2002 p. 298}"
  fr: "Une ville construite sur un sol sablonneux à deux milles de la mer, avec des vestiges de palmiers mais pas d'oliviers et beaucoup de figuiers; ses puits sont peu nombreux, aussi les habitants dépendent-ils de l'eau de pluie stockée dans des citernes. {cite:nuzhat-al-mushtaq-2002 p. 298}"
  ur: "سمندر سے دو میل کے فاصلے پر ریتلی زمین پر ایک قصبہ جہاں کھجوروں کی باقیات ہیں لیکن زیتون اور بہت سے انجیر نہیں ہیں۔ اس کے کنویں کم ہیں، اس لیے لوگ حوضوں میں جمع بارش پر انحصار کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 298}"
  tr: "Denizden iki mil uzaklıkta, kumlu bir arazide yer alan bir şehir; palmiye ve zeytin kalıntıları, çok sayıda incir ve az sayıda kuyu bulunuyor; bu nedenle sakinleri rezervuarlarda depolanan yağmur suyuna güveniyor. {kaynak:nuzhat-al-mushtaq-2002 s. 298}"
  id: "Sebuah kota di tanah berpasir dua mil dari laut, dengan sisa-sisa pohon palem dan zaitun, banyak buah ara, dan sedikit sumur, sehingga penduduknya bergantung pada air hujan yang tersimpan di waduk. {cite:nuzhat-al-mushtaq-2002 hlm. 298}"
