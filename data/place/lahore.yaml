label: { ar: "لاهور", en: "Lahore" }
summary:
  ar: "مدينة كبرى في البنجاب على الضفة اليسرى لنهر راوري، أول ذكر باقٍ لها في «حدود العالم» سنة ٣٧٢هـ/٩٨٢م؛ صارت عاصمة الغزنويين بعد فقدان غزنة، ثم ازدهرت في العهد المغولي فاتخذها أكبر مركزًا لحملاته وجعلها جهانكير عاصمة سنة ١٠٣١هـ/١٦٢٣م {cite:encyclopaedia-of-islam-2 vol. 5.2 pp. 37-38}، وهي اليوم ثانية مدن باكستان {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "A major city of the Punjab on the left bank of the Ravi; its earliest surviving mention is in the Hudud al-'alam of 372/982. It became the Ghaznavid capital after the loss of Ghazna, flourished under the Mughals — Akbar's base of operations and Jahangir's capital from 1031/1623 {cite:encyclopaedia-of-islam-2 vol. 5.2 pp. 37-38} — and is today the second city of Pakistan {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "پنجاب کا ایک بڑا شہر جو دریائے راوی کے بائیں کنارے واقع ہے؛ اس کا پہلا تحریری ذکر 372ھ/982ء کی «حدود العالم» میں ہے۔ غزنہ کے ہاتھ سے نکل جانے کے بعد یہ غزنویوں کا دارالسلطنت بنا، مغلوں کے عہد میں عروج پر پہنچا — اکبر کا مرکزِ عمل اور 1031ھ/1623ء سے جہانگیر کا دارالسلطنت {cite:encyclopaedia-of-islam-2 vol. 5.2 pp. 37-38} — اور آج پاکستان کا دوسرا بڑا شہر ہے {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
