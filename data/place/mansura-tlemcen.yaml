summary:
  ar: "مدينة أسسها أبو يعقوب يوسف المريني قبالة تلمسان في حصاره لها؛ سجد لمصلاه وأدار عليها السور وأمر الناس بالبناء فبنوا الدور وأجروا المياه وابتنى بها مسجداً جامعاً ومأذنة رفيعة وحمامات وخانات ومارستاناً فكانت من أعظم أمصار مدائن المغرب اتساع خطة وكثرة عمران ونفاق أسواق، وخربها آل يغمراسن عند مهلكه وارتحال كتائبه بعد أن كان بنو عبد الواد أشرفوا على الهلاك {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  en: "The counter-city Abu Ya'qub Yusuf the Marinid built facing Tlemcen during his hundred-month siege — walls, a congregational mosque, baths, khans and a hospital, one of the great towns of the Maghreb until the Zayyanids razed it on his death {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  es: "La ciudad fortificada que Abu Ya'qub Yusuf el Mariní construyó frente a Tlemcen durante su asedio de cien meses: murallas, una mezquita congregacional, baños, khans y un hospital. 1938}."
  fr: "La ville contre-civile qu'Abu Ya'qub Yusuf le Mérinide fit construire face à Tlemcen pendant son siège de cent mois — des murs, une mosquée, des bains, des khans et un hôpital, l'une des grandes villes du Maghreb jusqu'à ce que les Zayyanides la rasent à sa mort {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  ur: "جوابی شہر ابو یعقوب یوسف مرنید نے اپنے سو ماہ کے محاصرے کے دوران تلمسن کی طرف تعمیر کیا - دیواریں، ایک اجتماعی مسجد، حمام، خان اور ایک ہسپتال، مغرب کے عظیم قصبوں میں سے ایک یہاں تک کہ زیانیوں نے اس کی موت پر اسے مسمار کر دیا۔ 1938}۔"
