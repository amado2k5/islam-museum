label: { ar: "المنصورة" }
summary:
  ar: "مدينة أسسها أبو يعقوب يوسف المريني قبالة تلمسان في حصاره لها؛ سجد لمصلاه وأدار عليها السور وأمر الناس بالبناء فبنوا الدور وأجروا المياه وابتنى بها مسجداً جامعاً ومأذنة رفيعة وحمامات وخانات ومارستاناً فكانت من أعظم أمصار مدائن المغرب اتساع خطة وكثرة عمران ونفاق أسواق، وخربها آل يغمراسن عند مهلكه وارتحال كتائبه بعد أن كان بنو عبد الواد أشرفوا على الهلاك {cite:tarikh-ibn-khaldun-ibar p. 1938}."
  en: "The counter-city Abu Ya'qub Yusuf the Marinid built facing Tlemcen during his hundred-month siege — walls, a congregational mosque, baths, khans and a hospital, one of the great towns of the Maghreb until the Zayyanids razed it on his death {cite:tarikh-ibn-khaldun-ibar p. 1938}."
