label: { ar: "البحر الشامي ⁦(البحر المتوسط)⁩", en: "The Syrian sea (Mediterranean)", es: "El mar de Siria (Mediterráneo)", fr: "La mer Syrienne (Méditerranée)", ur: "شامی سمندر ⁦(بحیرہ روم)⁩", tr: "Levant Denizi (Akdeniz)", id: "Laut Levant (Laut Mediterania)" }
summary:
  ar: "يخرج من البحر المظلم في المغرب عند الزقاق، وهو عرضه هناك نحو ثمانية عشر ميلاً، ويمر شرقاً بسواحل المغرب وإفريقية ومصر والشام وأنطاكية والقسطنطينية وصقلية وبلاد الروم والأندلس، وطوله نحو ألف فرسخ ومائة وستة وثلاثين فرسخاً، وفيه نحو مائة جزيرة {cite:nuzhat-al-mushtaq-2002 p. 11}."
  en: "Al-Idrisi's Syrian sea enters from the western dark sea at the strait of al-Zuqaq, eighteen miles wide there, and runs east past the Maghreb, Ifriqiya, Egypt, Syria, Antioch, Constantinople, Sicily and Andalusia; about 1,136 farsakhs long with some hundred islands {cite:nuzhat-al-mushtaq-2002 p. 11}."
  es: "El mar sirio de Al-Idrisi entra desde el mar oscuro occidental en el estrecho de al-Zuqaq, dieciocho millas de ancho allí, y corre hacia el este pasando por el Magreb, Ifriqiya, Egipto, Siria, Antioquía, Constantinopla, Sicilia y Andalucía; de unos 1.136 farsakhs de largo con un centenar de islas {cite:nuzhat-al-mushtaq-2002 p. 11}."
  fr: "La mer syrienne d'Al-Idrisi entre dans la mer sombre occidentale au niveau du détroit d'al-Zuqaq, large de dix-huit milles à cet endroit, et s'étend vers l'est en passant par le Maghreb, l'Ifriqiya, l'Égypte, la Syrie, Antioche, Constantinople, la Sicile et l'Andalousie; environ 1 136 farsakhs de long avec une centaine d'îles {cite:nuzhat-al-mushtaq-2002 p. 11}."
  ur: "الادریسی کا شامی سمندر مغربی تاریک سمندر سے آبنائے الزوق میں داخل ہوتا ہے، وہاں اٹھارہ میل چوڑا ہوتا ہے، اور مغرب، عفریقیہ، مصر، شام، انطاکیہ، قسطنطنیہ، سسلی اور اندلس سے گزرتا ہوا مشرق میں جاتا ہے۔ تقریباً 1,136 فرسخ جس میں کچھ سو جزیرے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 11}۔"
  tr: "Fas'taki Karanlık Deniz'den bu sokakta doğar ve yaklaşık on sekiz mil genişliğindedir. Doğuya doğru Fas, Afrika, Mısır, Şam, Antakya, Konstantinopolis, Sicilya, Romalıların toprakları ve Endülüs kıyıları boyunca geçer. Uzunluğu yaklaşık bin yüz otuz altı ligdir ve yaklaşık yüz ada içerir {cite:nuzhat-al-mushtaq-2002, s. 11}."
  id: "Sungai ini muncul dari Laut Gelap di Maroko di gang, di mana lebarnya sekitar delapan belas mil. Sungai ini mengalir ke timur sepanjang pesisir Maroko, Afrika, Mesir, Levant, Antiokhia, Konstantinopel, Sisilia, tanah Romawi, dan Andalusia. Panjangnya sekitar seribu seratus tiga puluh enam liga, dan mencakup sekitar seratus pulau {cite:nuzhat-al-mushtaq-2002, hlm. 11}."
