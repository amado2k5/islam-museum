summary:
  ar: "يخرج من البحر المظلم في المغرب عند الزقاق، وهو عرضه هناك نحو ثمانية عشر ميلاً، ويمر شرقاً بسواحل المغرب وإفريقية ومصر والشام وأنطاكية والقسطنطينية وصقلية وبلاد الروم والأندلس، وطوله نحو ألف فرسخ ومائة وستة وثلاثين فرسخاً، وفيه نحو مائة جزيرة {cite:nuzhat-al-mushtaq-2002 p. 11}."
  en: "Al-Idrisi's Syrian sea enters from the western dark sea at the strait of al-Zuqaq, eighteen miles wide there, and runs east past the Maghreb, Ifriqiya, Egypt, Syria, Antioch, Constantinople, Sicily and Andalusia; about 1,136 farsakhs long with some hundred islands {cite:nuzhat-al-mushtaq-2002 p. 11}."
