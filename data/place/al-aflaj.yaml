label: { ar: "الأفلاج", en: "al-Aflaj (Layla district, Nejd)", es: "al-Aflaj (distrito de Layla, Nejd)", fr: "al-Aflaj (district de Layla, Nejd)", ur: "الفلج ⁦(ضلع لیلیٰ، نجد)⁩" }
summary:
  ar: "إقليم في جنوب نجد، أكبر واحاته وعاصمته ليلى، ويعرف بعيون السيح وقنوات الري القديمة ⁦(الأفلاج)⁩، وكانت قبيلة جذام أقوى قبائله عند ظهور الإسلام، وانضم إلى الدعوة الوهابية سنة 1199 هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 255}."
  en: "A district of southern Nejd whose most populous oasis and capital is Layla. Its spring-fed pools 'Uyun al-Sayh and its old underground aqueducts (aflaj) are its chief features. The Dja'da tribe was dominant at the dawn of Islam, and the district joined the Wahhabi cause in 1199/1785 {cite:encyclopaedia-of-islam-2 vol. 1 p. 255}."
  es: "Distrito del sur de Nejd, cuya capital y oasis más poblado es Layla. Sus principales características son sus estanques de agua de manantial, 'Uyun al-Sayh, y sus antiguos acueductos subterráneos (aflaj). La tribu Dja'da fue dominante en los albores del Islam, y el distrito se unió a la causa wahabí en 1199/1785 {cite:encyclopaedia-of-islam-2 vol. 1 p. 255}."
  fr: "Le Nejd méridional est un district dont l'oasis la plus peuplée et la capitale est Layla. Ses bassins alimentés par des sources ('Uyun al-Sayh) et ses anciens aqueducs souterrains (aflaj) en sont les principaux attraits. La tribu Dja'da y était dominante à l'aube de l'islam, et le district a rejoint la cause wahhabite en 1199/1785 (voir Encyclopaedia of Islam, vol. 1, p. 255)."
  ur: "جنوبی نجد کا ایک ضلع جس کا سب سے زیادہ آبادی والا نخلستان اور دارالحکومت لیلیٰ ہے۔ اس کے موسم بہار سے کھلائے جانے والے تالاب 'عیون السیح' اور اس کے پرانے زیر زمین آبی ذخائر ⁦(افلج)⁩ اس کی اہم خصوصیات ہیں۔ دجادہ قبیلہ اسلام کے آغاز میں غالب تھا، اور ضلع 1199/1785 میں وہابی کاز میں شامل ہوا 1 ص۔ 255}۔"
