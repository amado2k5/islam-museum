label: { ar: "الأفلاج", en: "al-Aflaj (Layla district, Nejd)" }
summary:
  ar: "إقليم في جنوب نجد، أكبر واحاته وعاصمته ليلى، ويعرف بعيون السيح وقنوات الري القديمة (الأفلاج)، وكانت قبيلة جذام أقوى قبائله عند ظهور الإسلام، وانضم إلى الدعوة الوهابية سنة 1199 هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 255}."
  en: "A district of southern Nejd whose most populous oasis and capital is Layla. Its spring-fed pools 'Uyun al-Sayh and its old underground aqueducts (aflaj) are its chief features. The Dja'da tribe was dominant at the dawn of Islam, and the district joined the Wahhabi cause in 1199/1785 {cite:encyclopaedia-of-islam-2 vol. 1 p. 255}."
