  ar: "مدينة بالجبل؛ عند البلاذري أتت ليلى الأخيلية الحجاج فوصلها وسألته أن يكتب لها إلى عامله بالري فلما صارت بساوة ماتت فدفنت هناك."
  en: "a Jibal city; in al-Baladhuri, where Layla al-Akhyaliyya died and was buried on her way to al-Hajjaj's Rayy agent."
