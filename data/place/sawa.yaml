  ur: "جبل کا شہر؛ البلادوری میں، جہاں لیلۃ الاخیالیہ کا انتقال ہوا اور اسے الحجاج کے رے ایجنٹ کے راستے میں دفن کیا گیا۔"
  tr: "Dağlarda bir şehir; el-Baladhuri ile birlikte Leyla el-Akhiliye hacılara geldi, onlar onu yanına götürüp Rayy'deki valisine onun adına yazmasını istedi. Sasawa'ya geldiğinde öldü ve orada defnedildi."
  id: "Sebuah kota di pegunungan; bersama al-Baladhuri, Layla al-Akhiliyah datang kepada para peziarah, yang membawanya kepadanya dan memintanya menulis surat untuknya kepada gubernurnya di Rayy. Ketika dia tiba di Sasawa, dia meninggal dan dimakamkan di sana."
