summary:
  ar: "مدينة على نهر شريا، وهو نهر كثير الفوائد، منبعه من جبل اشلوب، ويصب في بحيرة غاغان، وهي من مدن الكيماك. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  en: "A town on the river Shurya, a river of many benefits rising in the Ashlub mountains and flowing into the lake of Ghaghan; one of the towns of the Kimak. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  es: "Un pueblo a orillas del río Shurya, un río de múltiples beneficios que nace en las montañas Ashlub y desemboca en el lago Ghaghan; uno de los pueblos de Kimak. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  fr: "Une ville située sur la rivière Shurya, une rivière aux multiples bienfaits prenant sa source dans les monts Ashlub et se jetant dans le lac Ghaghan; une des villes des Kimak. {cite:nuzhat-al-mushtaq-2002 p. 709}"
  ur: "دریائے شوریہ پر واقع ایک قصبہ، بہت سے فوائد کا ایک دریا جو اشلب کے پہاڑوں سے نکلتا ہے اور غغان کی جھیل میں بہتا ہے۔ کمک کے قصبوں میں سے ایک۔ {حوالہ: نزہت المشتاق-2002 ص۔ 709}"
  tr: "Shreya Nehri üzerinde bir şehir, birçok faydası olan bir nehir, Ashloob Dağı'ndan doğup Kimak şehirlerinden biri olan Gagan Gölü'ne dökülür. {cite:nuzhat-al-mushtaq-2002 s. 709}"
  id: "Sebuah kota di Sungai Shreya, sungai dengan banyak manfaat, berasal dari Gunung Ashloob dan bermuara ke Danau Gagan, yang merupakan salah satu kota di Kimak. {sitasi:Nuzhat-al-Mushtaq-2002 hlm. 709}"
