summary:
  ar: خلاط على بحيرة وان من مدن أرمينية؛ أناخ بطريقها على حبيب بن مسلمة بمريالا بكتاب إياد بن غنم وكان إياد قد أمّنه على نفسه
    وماله وبلاده وقاطعه على أتاوة فأنفذه حبيب له.
  en: Khilat (Akhlat) on Lake Van, of the Armenian cities; its patrikios came down to Habib ibn Maslama at Mariyala bearing
    Iyad ibn Ghanm's writ — Iyad having granted him aman on himself, his wealth and his lands for a tribute — and Habib conveyed
    it to him.
  es: "Khilat (Akhlat) en el lago Van, de las ciudades armenias; su patricio llegó a Habib ibn Maslama en Mariyala portando el edicto de Iyad ibn Ghanm —Iyad le había concedido un aman sobre sí mismo, su riqueza y sus tierras a cambio de un tributo— y Habib se lo transmitió."
  fr: "Khilat (Akhlat) sur le lac de Van, parmi les villes arméniennes; son patrikios est descendu à Habib ibn Maslama à Mariyala portant l'acte d'Iyad ibn Ghanm — Iyad lui ayant accordé un aman sur lui-même, ses richesses et ses terres en guise de tribut — et Habib le lui a transmis."
