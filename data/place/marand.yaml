  ar: "مدينة بأذربيجان كانت قرية صغيرة نزلها حلبس أبو البعيث ثم حصنها البعيث ثم ابنه محمد بن البعيث وبنى بها قصوراً فلما خالف في خلافة المتوكل حاربه بنا الصغير حتى ظفر به وهدم حائطها وقصره."
  en: "An Azerbaijani town, once a small village settled by Halbas Abu al-Ba'ith, fortified by al-Ba'ith then his son Muhammad who raised palaces; his Mutawakkil-era defiance ended with Buna al-Saghir razing wall and palace."
  es: "Una ciudad azerbaiyana, que en su día fue un pequeño pueblo fundado por Halbas Abu al-Ba'ith, fortificado por al-Ba'ith y luego por su hijo Muhammad, quien construyó palacios; su desafío durante la era de Mutawakkil terminó con la destrucción de la muralla y el palacio de Buna al-Saghir."
  fr: "Une ville azerbaïdjanaise, autrefois un petit village fondé par Halbas Abu al-Ba'ith, fortifiée par al-Ba'ith puis par son fils Muhammad qui y fit construire des palais; sa rébellion de l'ère Mutawakkil prit fin avec la destruction du mur et du palais par Buna al-Saghir."
