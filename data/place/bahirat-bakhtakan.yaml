summary:
  ar: "من أكبر بحيرات فارس، طولها نحو ستين ميلاً، وماؤها مالح، يقع فيها نهر كر، وحواليها رساتيق وقرى وعمارات متصلة. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  en: "One of the largest lakes of Fars, about sixty miles long with salt water; the river Kur falls into it, and villages and districts surround it. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  es: "Uno de los lagos más grandes de Fars, de unos sesenta kilómetros de longitud y con agua salada; el río Kur desemboca en él, y pueblos y distritos lo rodean. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  fr: "L'un des plus grands lacs du Fars, d'une longueur d'environ soixante milles, est un lac d'eau salée; la rivière Kour s'y jette et des villages et des districts l'entourent. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  ur: "فارس کی سب سے بڑی جھیلوں میں سے ایک، تقریباً ساٹھ میل لمبی کھارے پانی کے ساتھ؛ دریائے کُر اس میں گرتا ہے اور اس کے چاروں طرف گاؤں اور اضلاع ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 423}"
