summary:
  ar: "عند البلاذري: جزيرة بالقرب من القسطنطينية فتحها جنادة بن أبي أمية سنة أربع وخمسين وأسكنها معاوية المسلمين وكان من فاتحيها مجاهد وتبيع بن امرأة كعب الأحبار."
  en: "In al-Baladhuri: an island near Constantinople opened by Janada ibn Abi Umayya in year 54, settled with Muslims by Mu'awiya; among its openers Mujahid and Tubay' ibn imra'at Ka'b al-Ahbar."
  es: "En al-Baladhuri: una isla cercana a Constantinopla abierta por Janada ibn Abi Umayya en el año 54, habitada por musulmanes por Mu'awiya; entre sus abridores Mujahid y Tubay' ibn imra'at Ka'b al-Ahbar."
  fr: "A al-Baladhuri: une île proche de Constantinople ouverte par Janada ibn Abi Umayya en l'an 54, colonisée par les musulmans par Mu'awiya; parmi ses ouvreurs, Mujahid et Tubay' ibn imra'at Ka'b al-Ahbar."
  ur: "البلادوری میں: قسطنطنیہ کے قریب ایک جزیرہ جسے جنادہ ابن ابی امیہ نے سنہ 54 میں کھولا تھا، جسے معاویہ نے مسلمانوں کے ساتھ آباد کیا تھا۔ اس کے اوپنرز میں مجاہد اور طوبیٰ ابن عمرات کعب الاحبار شامل ہیں۔"
  tr: "el-Baladhuri'ye göre: 54 Hicri yılında Cunadah ibn Ebi Umeyye tarafından fethedilen ve Müslümanlar tarafından yerleşilen Konstantinopolis yakınlarındaki bir ada, fethedenler arasında Mücahid ve Ka'b al-Ahbar'ın kadını Tybi' ibn de vardı."
  id: "Menurut al-Baladhuri: sebuah pulau dekat Konstantinopel ditaklukkan oleh Junadah ibn Abi Umayyah pada tahun 54 H, dihuni oleh Muawiyah kaum Muslim, dan di antara penakluknya adalah Mujahid dan Tybi' ibn wanita Ka'b al-Ahbar."
