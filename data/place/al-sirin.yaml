  es: "Una sólida fortaleza costera a unos cinco días de Hulay, con abundante agua y un gobernador, donde se cobra un impuesto fijo a los barcos que transitan por la costa. {cite:nuzhat-al-mushtaq-2002 p. 138}"
  fr: "Une forteresse côtière imposante, située à environ cinq jours de Hulay, disposant d'eau en abondance et d'un gouverneur, où une taxe fixe est perçue sur les navires qui longent la côte. {cite:nuzhat-al-mushtaq-2002 p. 138}"
