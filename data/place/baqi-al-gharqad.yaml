summary:
  ar: "مقبرة المدينة الكبرى شرقي المسجد النبوي؛ كان أسعد بن زرارة أول من دُفن به من المسلمين على رواية أبي حاتم عند رزين — وعثمان بن مظعون أول المهاجرين — ويذكر السمهودي في فضائلها: بعث سبعين ألفاً منه على صورة القمر بغير حساب، ووكالة ملائكة به كلما امتلأ أخذوا بأطرافه فكفّوه في الجنة، وأن الدعاء مستجاب في زاوية دار عقيل به، وكان داخله على يمين الداخل من بابه مسجد بني حديلة {cite:samhudi-wafa-al-wafa p. 91, 271}."
  en: "Medina's great cemetery east of the Prophet's Mosque; As'ad ibn Zurara was the first Muslim buried there on Abu Hatim's account via Razin — 'Uthman ibn Maz'un the first of the Emigrants — and al-Samhudi lists among its merits the resurrection of seventy thousand from it in the image of the moon without reckoning, angels who whenever it fills take it by its edges and empty it into Paradise, answered prayer at the corner of Dar 'Aqil beside it, and the mosque of Banu Hudayla inside it right of its gate {cite:samhudi-wafa-al-wafa p. 91, 271}."
  es: "El gran cementerio de Medina, al este de la Mezquita del Profeta; As'ad ibn Zurara fue el primer musulmán enterrado allí según el relato de Abu Hatim a través de Razin — 'Uthman ibn Maz'un, el primero de los emigrantes — y al-Samhudi enumera entre sus méritos la resurrección de setenta mil personas de él a imagen de la luna sin contar, ángeles que cada vez que se llena lo toman por sus bordes y lo vacían en el Paraíso, la oración respondida en la esquina de Dar 'Aqil junto a él, y la mezquita de Banu Hudayla dentro de él, a la derecha de su puerta {cite:samhudi-wafa-al-wafa p. 91, 271}."
  fr: "Le grand cimetière de Médine à l'est de la Mosquée du Prophète; As'ad ibn Zurara fut le premier musulman à y être enterré selon le récit d'Abu Hatim via Razin — 'Uthman ibn Maz'un le premier des Émigrants — et al-Samhudi énumère parmi ses mérites la résurrection de soixante-dix mille personnes à partir de lui sous la forme de la lune sans compte, des anges qui, chaque fois qu'il est plein, le prennent par ses bords et le vident au Paradis, des prières exaucées au coin de Dar 'Aqil à côté de lui, et la mosquée de Banu Hudayla à l'intérieur, à droite de sa porte {cite:samhudi-wafa-al-wafa p. 91, 271}."
