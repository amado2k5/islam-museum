label: { ar: "البئر المعطّلة والقصر المشيد", en: "The Idle Well and the Lofty Palace", es: "El pozo ocioso y el palacio majestuoso", fr: "Le Puits Idle et le Palais Hautain", ur: "بیکار کنواں اور بلند و بالا محل", tr: "Kırık kuyu ve inşa edilmiş saray", id: "Sumur yang pecah dan istana yang dibangun" }
summary:
  ar: "الأثران اللذان اجتمعا في المثل المشهور؛ عند ابن فضل الله العمري هما قريب الفَجّ الحالي بمشارق اليمن — أي الربع الخالي في جنوب شرقي بلاد العرب {cite:umari-masalik-1924 p. 232}."
  en: "The paired ruins of proverb — the forsaken well and the high-built palace — which al-Umari places near al-Fajj in the eastern reaches of Yemen, today's Empty Quarter {cite:umari-masalik-1924 p. 232}."
  es: "Las ruinas gemelas del proverbio —el pozo abandonado y el palacio de gran altura— que al-Umari sitúa cerca de al-Fajj, en los confines orientales de Yemen, el actual Rub al-Jali {cite:umari-masalik-1924 p. 232}."
  fr: "Les ruines jumelées du proverbe — le puits abandonné et le palais haut construit — qu'al-Umari place près d'al-Fajj dans les confins orientaux du Yémen, aujourd'hui le Quart Vide {cite:umari-masalik-1924 p. 232}."
  ur: "کہاوت کے جوڑے ہوئے کھنڈرات — چھوڑا ہوا کنواں اور اونچا تعمیر شدہ محل — جسے العماری یمن کے مشرقی حصے میں الفج کے قریب رکھتا ہے، آج کا خالی کوارٹر {حوالہ: عمری-مسالک-1924 صفحہ۔ 232}۔"
  tr: "İbn Fadlallah al-Omari'ye göre ünlü atasözünde bir araya gelen iki eser, Yemen'in doğusundaki mevcut el-Fajj yakınındadır — yani Arap Toprakları'nın güneydoğusundaki Boş Mahalle'de {cite:umari-masalik-1924, s. 232}."
  id: "Dua artefak yang bersatu dalam peribahasa terkenal menurut Ibn Fadlallah al-Omari berada di dekat al-Fajj saat ini di Yaman timur — yaitu, Kawasan Kosong di tenggara Tanah Arab {cite:umari-masalik-1924, hlm. 232}."
