summary:
  ar: "موضع بين المدينة وجبل أحد على الطريق الشرقية مع الحرة إلى أحد؛ فيه أطمان سُمّيا به لأن شيخاً وشيخة كانا يتحدثان هناك في رواية. بات به النبي ليلة أحد وعرض الناس فأجاز من رأى وردّ من رأى — كان أبو سعيد الخدري ممن رُدّ — وكانت بيوت بني حارثة في ناحيته، وفيه المسجد الذي صلى فيه حين سار إلى أحد {cite:samhudi-wafa-al-wafa p. 202-203}."
  en: "A site between Medina and Mount Uhud on the eastern road along the Harra; it held two utum said to be named for an old man and woman who conversed there. The Prophet spent the eve of Uhud there, reviewed the men and sent back those too young — Abu Sa'id al-Khudri was among them — and Banu Haritha's houses stood in its quarter, with the mosque in which he prayed on the march to Uhud {cite:samhudi-wafa-al-wafa p. 202-203}."
  es: "Un sitio entre Medina y el monte Uhud en el camino oriental a lo largo del Harra; albergaba dos utum que, según se dice, recibieron su nombre de un anciano y una anciana que conversaban allí. El Profeta pasó la víspera de Uhud allí, pasó revista a los hombres y envió de regreso a los demasiado jóvenes —Abu Sa'id al-Khudri estaba entre ellos— y las casas de Banu Haritha se encontraban en ese barrio, con la mezquita en la que oró durante la marcha a Uhud {cite:samhudi-wafa-al-wafa p. 202-203}."
  fr: "Un site situé entre Médine et le mont Uhud, sur la route orientale longeant la Harra; il abritait deux utum, dont le nom prophétisé provient d'un vieil homme et d'une vieille femme qui s'y entretenaient. Le Prophète y passa la veille d'Uhud, passa en revue les hommes et renvoya ceux qui étaient trop jeunes – parmi lesquels Abu Sa'id al-Khudri – et les maisons des Banu Haritha se dressaient dans ce quartier, ainsi que la mosquée où il pria lors de sa marche vers Uhud (voir: Samhudi-Wafa-Al-Wafa, p. 202-203)."
