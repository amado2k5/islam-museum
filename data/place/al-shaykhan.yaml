  ar: الشيخان
  en: al-Shaykhan
summary:
  ar: "موضع بين المدينة وجبل أحد على الطريق الشرقية مع الحرة إلى أحد؛ فيه أطمان سُمّيا به لأن شيخاً وشيخة كانا يتحدثان هناك في رواية. بات به النبي ليلة أحد وعرض الناس فأجاز من رأى وردّ من رأى — كان أبو سعيد الخدري ممن رُدّ — وكانت بيوت بني حارثة في ناحيته، وفيه المسجد الذي صلى فيه حين سار إلى أحد {cite:samhudi-wafa-al-wafa p. 202-203}."
  en: "A site between Medina and Mount Uhud on the eastern road along the Harra; it held two utum said to be named for an old man and woman who conversed there. The Prophet spent the eve of Uhud there, reviewed the men and sent back those too young — Abu Sa'id al-Khudri was among them — and Banu Haritha's houses stood in its quarter, with the mosque in which he prayed on the march to Uhud {cite:samhudi-wafa-al-wafa p. 202-203}."
