summary:
  ar: موضع نزل به الهادي بعسكره في أيام ماضية من صفر سنة 286هـ ليقاتل الدعام بخيوان؛ يحيل المحقق في الهامش إلى صفة جزيرة العرب للهمداني ص83.
  en: A place where al-Hadi camped with his army in the days past of Safar 286 AH to face al-Da'am at Khiwan; the editor's footnote refers to al-Hamdani's Sifat Jazirat al-Arab, p. 83.
  ur: وہ مقام جہاں ہادی صفر 286ھ کے گزرے ہوئے چند دنوں میں اپنے لشکر کے ساتھ خیوان میں دعام کا مقابلہ کرنے کے لیے اترے؛ محقق حاشیے میں ہمدانی کی صفۃ جزیرۃ العرب صفحہ 83 کا حوالہ دیتے ہیں۔
  es: "Un lugar donde al-Hadi acampó con su ejército en los días pasados de Safar 286 AH para enfrentarse a al-Da'am en Khiwan; la nota al pie del editor se refiere a Sifat Jazirat al-Arab de al-Hamdani, pág. 83."
  fr: "Un lieu où al-Hadi a campé avec son armée dans les jours passés de Safar 286 AH pour affronter al-Da'am à Khiwan; la note de bas de page de l'éditeur fait référence à Sifat Jazirat al-Arab d'al-Hamdani, p. 83."
