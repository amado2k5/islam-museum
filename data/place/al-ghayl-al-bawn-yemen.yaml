summary:
  ar: "قرية بالبون هي حصن حصين كان فيها معسكر أبي زياد وصعصعة، وقاتلهم الهادي عندها حتى أمسى سنة 288هـ."
  en: "A village in al-Bawn that is a strong fort, where the camp of Abu Ziyad and Sa'sa'a was and where al-Hadi fought them until evening in 288 AH."
  ur: "البون کی ایک بستی جو مضبوط قلعہ ہے، جہاں ابو زیاد اور صعصعہ کا کیمپ تھا اور جہاں ہادی نے سنہ 288ھ میں شام تک ان سے جنگ کی۔"
  es: "Una aldea en al-Bawn que es una fortaleza sólida, donde se encontraba el campamento de Abu Ziyad y Sa'sa'a y donde al-Hadi luchó contra ellos hasta el anochecer del año 288 AH."
  fr: "Un village d'al-Bawn qui est une forteresse solide, où se trouvait le camp d'Abu Ziyad et de Sa'sa'a et où al-Hadi les a combattus jusqu'au soir de l'an 288 AH."
  tr: "Balbun köyü, Abu Ziyad ve Sa'sa'a kamplarının bulunduğu tahkim edilmiş bir kaledir ve el-Hadi burada 288 Hicri yılına kadar onlarla savaşmıştır."
  id: "Desa Balbun adalah benteng yang diperkuat di mana kamp Abu Ziyad dan Sa'sa'a berada, dan al-Hadi bertempur melawan mereka di sana hingga tahun 288 H."
