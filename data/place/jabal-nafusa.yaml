summary:
  ar: "جبل عال طوله نحو ثلاثة أيام، فيه قرى وزرع للشعير، وفيه مياه جارية، ويذكر الإدريسي أن قبائل المصامدة تسكنه. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  en: "A high mountain about three days long, with villages, barley fields and running water; al-Idrisi says the Masmuda tribes live there. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  es: "Una alta montaña de unos tres días de longitud, con aldeas, campos de cebada y agua corriente; al-Idrisi dice que allí viven las tribus Masmuda. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  fr: "Une haute montagne d'environ trois jours de marche, avec des villages, des champs d'orge et des cours d'eau; selon al-Idrisi, les tribus Masmuda y vivent. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  ur: "تقریباً تین دن لمبا ایک اونچا پہاڑ، جس میں دیہات، جو کے کھیت اور بہتے پانی ہیں۔ الادریسی کا کہنا ہے کہ وہاں مسمودہ قبائل رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 278}"
