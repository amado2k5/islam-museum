  en: "Al-'Aqaba (Jordan's Red Sea port)"
summary:
  ar: "العقبة، المرفأ الوحيد للمملكة الأردنية الهاشمية على البحر الأحمر، عند رأس خليج العقبة الشرقي وأسفل جبل أم نصيلة. هي خلف أيلة، واسمها اختصار «عقبة أيلة»، أي ممر أيلة الذي يعبر جبل أم نصيلة. وقد بنى السلطان قانصوه الغوري خانًا محصنًا فيها سنة 920هـ/1514–1515م لحماية الحجاج، وفي 1917م استولت عليها القوات الأنجلو-عربية {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
  en: "Al-'Aqaba, the only seaport of the Hashemite Kingdom of Jordan, at the eastern head of the Gulf of 'Aqaba at the foot of Jabal Umm Nusayla. It succeeded Ayla, and its name is a shortening of 'Aqabat Ayla, the pass of Ayla through Jabal Umm Nusayla. Sultan Qansuh al-Ghawri built a fortified khan there in 920/1514–15 to protect the pilgrims. It was captured by Anglo-Arab forces in July 1917 and was annexed to Transjordan in 1925 {cite:encyclopaedia-of-islam-2 vol. 1 p. 336}."
