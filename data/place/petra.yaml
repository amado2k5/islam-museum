    نقضها الرومان.
  es: "Capital de los nabateos —descendientes de Nabit ibn Ismail según la tradición— en el norte del Hiyaz, cuyo poderoso reino dominó las zonas periféricas hasta que los romanos lo quebrantaron."
  fr: "Capitale des Nabatéens — les descendants de Nabit ibn Ismail selon la tradition — dans le nord du Hedjaz, dont le puissant royaume dominait les confins jusqu'à ce que les Romains le détruisent."
