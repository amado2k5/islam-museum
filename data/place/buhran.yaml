summary:
  ar: "موضع بالحجاز في ناحية الفرع، ويذكر النص أنه معدن، وقد سار إليه النبي في ربيع الآخر سنة 3هـ، ثم رجع إلى المدينة دون حرب."
  en: "A place in the Hijaz, in the area of al-Fara', which the text describes as a mine. The Prophet set out for it in Rabi' al-Akhir of year 3 AH and returned to Medina without fighting."
  es: "Un lugar en el Hiyaz, en la zona de al-Fara', que el texto describe como una mina. El Profeta partió hacia allí en Rabi' al-Akhir del año 3 de la Hégira y regresó a Medina sin luchar."
  fr: "Un lieu du Hedjaz, dans la région d'al-Fara', décrit dans le texte comme une mine. Le Prophète s'y rendit en Rabi' al-Akhir de l'an 3 de l'Hégire et revint à Médine sans combat."
  ur: "حجاز میں الفارع کے علاقے میں ایک جگہ جسے متن میں ایک کان کے طور پر بیان کیا گیا ہے۔ رسول اللہ اس کے لیے ربیع الآخر 3 ہجری میں روانہ ہوئے اور بغیر لڑے مدینہ واپس آگئے۔"
  tr: "Hicaz bölgesinde Al-Far'a yakın bir yerdir ve metinde burası bir maden olarak geçer. Peygamber, 3 Hicri yılında Rabi'al-Thani ile oraya yürüdü, ardından savaşmadan Medine'ye döndü."
  id: "Sebuah tempat di daerah Hijaz dekat Al-Far', dan teks menyebutnya sebagai tambang. Nabi berbaris ke sana di Rabi' al-Thani pada tahun 3 H, lalu kembali ke Madinah tanpa perlawanan."
