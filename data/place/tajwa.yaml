summary:
  ar: "قاعدة بلاد التاجوين، وهم قوم يصفهم المؤلف بالمجوسية، وأرضهم متصلة بأرض النوبة. وتبعد عن الزغاوة ثلاث عشرة مرحلة {cite:nuzhat-al-mushtaq-2002 p. 30}."
  en: "The seat of the land of the Tajuwi, a people the author describes as Magian. Their land borders Nubia. Thirteen stages from Zaghawa {cite:nuzhat-al-mushtaq-2002 p. 30}."
  es: "Sede de la tierra de los Tajuwi, un pueblo que el autor describe como Magiano. Su territorio limita con Nubia. Trece etapas desde Zaghawa {cite:nuzhat-al-mushtaq-2002 p. 30}."
  fr: "Le siège du pays des Tajuwi, un peuple que l'auteur décrit comme mage. Leur territoire borde la Nubie. Treize étapes depuis Zaghawa {cite:nuzhat-al-mushtaq-2002 p. 30}."
  ur: "تاجوی کی سرزمین کی نشست، ایک ایسی قوم جسے مصنف نے مجوسی کے طور پر بیان کیا ہے۔ ان کی زمین نوبیا سے ملتی ہے۔ زاغوا سے تیرہ مراحل {حوالہ نزہت المشتاق-2002 ص۔ 30}۔"
  tr: "Yazarın Magi olarak tanımladığı ve toprakları Nubia topraklarıyla bağlantılı olan Tajuyun'un topraklarının temelidir. Zaghawa'dan on üç aşama uzaklıktadır {cite:Nuzhat-al-mushtaq-2002, s. 30}."
  id: "Dasar tanah Tajuyun, sebuah bangsa yang digambarkan oleh penulis sebagai Magi, yang tanahnya terhubung dengan tanah Nubia. Wilayah ini berjarak tiga belas tahap dari Zaghawa {cite:Nuzhat-al-mushtaq-2002, hlm. 30}."
