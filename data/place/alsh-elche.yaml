summary:
  ar: "ألش، وهي إلتشي اليوم، بلدة صغيرة في شرق إسبانيا (شرق الأندلس)، تبعد نحو اثني عشر ميلًا جنوب غرب أليكانتي، واشتهرت بغاباتها من النخيل التي ما زالت قائمة، ووصفها مؤرخون مسلمون مثل ابن سعيد والقزويني {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  en: "Alsh, now Elche, is a small town in the Spanish Levant, about twelve miles south-west of Alicante. It is noted for its palm groves, which still exist, and which Muslim authors such as Ibn Sa'id and al-Qazwini described {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
