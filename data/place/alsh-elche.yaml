label: { ar: "ألش ⁦(إلتشي)⁩", en: "Alsh (Elche, in the Spanish Levant)", es: "Alsh (Elche, en el Levante español)", fr: "Alsh (Elche, dans le Levant espagnol)", ur: "الش ⁦(ایلچے، ہسپانوی لیونٹ میں)⁩", tr: "Alch (Elche)", id: "Alch (Elche)" }
summary:
  ar: "ألش، وهي إلتشي اليوم، بلدة صغيرة في شرق إسبانيا ⁦(شرق الأندلس)⁩، تبعد نحو اثني عشر ميلًا جنوب غرب أليكانتي، واشتهرت بغاباتها من النخيل التي ما زالت قائمة، ووصفها مؤرخون مسلمون مثل ابن سعيد والقزويني {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  en: "Alsh, now Elche, is a small town in the Spanish Levant, about twelve miles south-west of Alicante. It is noted for its palm groves, which still exist, and which Muslim authors such as Ibn Sa'id and al-Qazwini described {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  es: "Alsh, ahora Elche, es una pequeña ciudad del Levante español, a unos veinte kilómetros al suroeste de Alicante. Es conocida por sus palmerales, que aún existen y que fueron descritos por autores musulmanes como Ibn Sa'id y al-Qazwini {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  fr: "Alsh, aujourd'hui Elche, est une petite ville du Levant espagnol, à une vingtaine de kilomètres au sud-ouest d'Alicante. Elle est réputée pour ses palmeraies, qui existent encore aujourd'hui et que des auteurs musulmans tels qu'Ibn Sa'id et al-Qazwini ont décrites {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  ur: "الش، اب ایلچے، ہسپانوی لیونٹ کا ایک چھوٹا سا شہر ہے، جو ایلیکینٹ سے تقریباً بارہ میل جنوب مغرب میں ہے۔ یہ اس کے کھجور کے درختوں کے لیے مشہور ہے، جو اب بھی موجود ہے، اور جسے ابن سعید اور القزوینی جیسے مسلم مصنفین نے بیان کیا ہے {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 444}۔"
  tr: "Bugün Elche olarak bilinen Alche, doğu İspanya'da (doğu Endülüs) küçük bir kasabadır; Alicante'nin yaklaşık on iki mil güneybatısında, hala ayakta olan palmiye ormanlarıyla ünlüdür; bu ormanlar İbn Sa'id ve al-Qazwini gibi Müslüman tarihçiler tarafından tanımlanmıştır {cite:Endyclopaedia-of-Islam-2 cilt 1, s. 444}."
  id: "Alche, yang sekarang menjadi Elche, adalah sebuah kota kecil di timur Spanyol (Andalusia timur), sekitar dua belas mil barat daya Alicante, terkenal dengan hutan kelapa sawitnya yang masih berdiri, seperti yang dijelaskan oleh sejarawan Muslim seperti Ibn Sa'id dan al-Qazwini {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 444}."
