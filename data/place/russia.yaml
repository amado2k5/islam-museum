label: { ar: "الروسية", en: "al-Rūsiyya (land)", es: "al-Rūsiyya (tierra)", fr: "al-Rūsiyya (terre)", ur: "الروسیہ ⁦(زمین)⁩", tr: "Rusça", id: "Rusia" }
summary:
  ar: "أرض كبيرة قليلة المدن، عماراتها متباعدة، ولهم مع جيرانهم حروب ومهارشات دائمة، ومن مدنها زاقة وتروبية وغليسية {cite:nuzhat-al-mushtaq-2002 p. 904}."
  en: "A large land with few towns and scattered settlements; the author says its people have constant raids and wars with their neighbours, and names Zāqa, Tarūbiyya and Ghalīsiya among its cities {cite:nuzhat-al-mushtaq-2002 p. 904}."
  es: "Una gran extensión de tierra con pocos pueblos y asentamientos dispersos; el autor dice que sus habitantes sufren constantes incursiones y guerras con sus vecinos, y nombra a Zāqa, Tarūbiyya y Ghalīsiya entre sus ciudades {cite:nuzhat-al-mushtaq-2002 p. 904}."
  fr: "Un vaste pays avec peu de villes et des hameaux dispersés; l'auteur dit que ses habitants ont des raids et des guerres constants avec leurs voisins, et cite Zāqa, Tarūbiyya et Ghalīsiya parmi ses villes {cite:nuzhat-al-mushtaq-2002 p. 904}."
  ur: "چند قصبوں اور بکھری ہوئی بستیوں کے ساتھ ایک بڑی زمین؛ مصنف کا کہنا ہے کہ اس کے لوگوں کے اپنے پڑوسیوں کے ساتھ مسلسل چھاپے اور جنگیں ہوتی ہیں، اور اس کے شہروں میں سے زقا، تروبیہ اور غلیسیہ کے نام ہیں۔ 904}۔"
  tr: "Az sayıda şehri olan büyük bir toprak olan bu toprak, binaları dağınık durumdadır ve komşularıyla sürekli savaşlar ve çatışmalar içindedir. Şehirleri arasında Zaqa, Turbiyyah ve Galiçya bulunmaktadır {cite:Nuzhat-al-Mushtaq-2002, s. 904}."
  id: "Sebuah tanah luas dengan sedikit kota, bangunannya tersebar, dan mereka terus-menerus mengalami perang dan konflik dengan tetangganya. Di antara kotanya adalah Zaqa, Turbiyyah, dan Galicia {cite:Nuzhat-al-Mushtaq-2002, hlm. 904}."
