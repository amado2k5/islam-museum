  en: "A large land with few towns and scattered settlements; the author says its people have constant raids and wars with their neighbours, and names Zāqa, Tarūbiyya and Ghalīsiya among its cities {cite:nuzhat-al-mushtaq-2002 p. 904}."
  es: "Una gran extensión de tierra con pocos pueblos y asentamientos dispersos; el autor dice que sus habitantes sufren constantes incursiones y guerras con sus vecinos, y nombra a Zāqa, Tarūbiyya y Ghalīsiya entre sus ciudades {cite:nuzhat-al-mushtaq-2002 p. 904}."
  fr: "Un vaste pays avec peu de villes et des hameaux dispersés; l'auteur dit que ses habitants ont des raids et des guerres constants avec leurs voisins, et cite Zāqa, Tarūbiyya et Ghalīsiya parmi ses villes {cite:nuzhat-al-mushtaq-2002 p. 904}."
