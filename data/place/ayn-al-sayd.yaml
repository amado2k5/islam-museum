summary:
  ar: "عين من عيون الطف؛ عند البلاذري سميت عين الصيد لأن السمك يجتمع فيها وكانت ممطومة فساخت قوائم فرس رجل من المسلمين فيها فحفر فظهر له الماء فجمع قوماً أعانوه على كشفها وتنقيتها حتى عادت ثم صارت إلى عيسى بن علي وكان عيسى ابتاعها من ولد حسن بن حسن بن علي بن أبي طالب وكانت عنده منهم أم كلثوم بنت حسن بن حسن وكان معاوية أقطع الحسن بن علي عين صيد هذه عوضاً من الخلافة مع غيرها."
  en: "A Taff spring; in al-Baladhuri named Ayn al-Sayd because fish gathered in it — once plugged, a Muslim's horse sank its legs into it, he dug, struck water and restored it with helpers; it then passed to Isa ibn Ali, who bought it from al-Hasan ibn al-Hasan's children — Umm Kulthum bint al-Hasan holding a share — Mu'awiya having granted it to al-Hasan ibn Ali as part of the caliphate settlement, with other springs."
  es: "Un manantial de Taff; en al-Baladhuri llamado Ayn al-Sayd porque en él se congregaban peces; una vez taponado, el caballo de un musulmán metió las patas en él, cavó, encontró agua y lo restauró con ayudantes; luego pasó a Isa ibn Ali, quien lo compró a los hijos de al-Hasan ibn al-Hasan —Umm Kulthum bint al-Hasan poseía una parte—, ya que Mu'awiya se lo había concedido a al-Hasan ibn Ali como parte del asentamiento del califato, junto con otros manantiales."
  fr: "Une source de Taff; à al-Baladhuri, nommée Ayn al-Sayd car les poissons s'y rassemblaient — une fois bouchée, le cheval d'un musulman y enfonça ses pattes, il creusa, trouva de l'eau et la remit en état avec des aides; elle passa ensuite à Isa ibn Ali, qui l'acheta aux enfants d'al-Hasan ibn al-Hasan — Umm Kulthum bint al-Hasan détenant une part — Mu'awiya l'ayant concédée à al-Hasan ibn Ali dans le cadre de l'accord du califat, avec d'autres sources."
  ur: "ایک ٹاف بہار؛ البلادوری میں اس کا نام عین السید رکھا گیا ہے کیونکہ اس میں مچھلیاں جمع ہوتی تھیں - ایک بار پلگ ہونے کے بعد، ایک مسلمان کے گھوڑے نے اس میں اپنی ٹانگیں دھنس لیں، اس نے پانی کھود کر پانی مارا اور اسے مددگاروں سے بحال کیا۔ اس کے بعد یہ عیسیٰ ابن علی کے پاس پہنچا، جس نے اسے حسن بن الحسن کے بچوں سے خریدا — ام کلثوم بنت الحسن کے پاس حصہ تھا — معاویہ نے اسے دوسرے چشموں کے ساتھ خلافت کے تصفیے کے حصے کے طور پر حسن ابن علی کو دیا تھا۔"
