summary:
  ar: "عين من عيون الطف؛ عند البلاذري سميت عين الصيد لأن السمك يجتمع فيها وكانت ممطومة فساخت قوائم فرس رجل من المسلمين فيها فحفر فظهر له الماء فجمع قوماً أعانوه على كشفها وتنقيتها حتى عادت ثم صارت إلى عيسى بن علي وكان عيسى ابتاعها من ولد حسن بن حسن بن علي بن أبي طالب وكانت عنده منهم أم كلثوم بنت حسن بن حسن وكان معاوية أقطع الحسن بن علي عين صيد هذه عوضاً من الخلافة مع غيرها."
  en: "A Taff spring; in al-Baladhuri named Ayn al-Sayd because fish gathered in it — once plugged, a Muslim's horse sank its legs into it, he dug, struck water and restored it with helpers; it then passed to Isa ibn Ali, who bought it from al-Hasan ibn al-Hasan's children — Umm Kulthum bint al-Hasan holding a share — Mu'awiya having granted it to al-Hasan ibn Ali as part of the caliphate settlement, with other springs."
