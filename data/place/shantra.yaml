summary:
  ar: "مدينة أندلسية؛ قال ابن اليسع إن من خواصها أن القمح والشعير يزرعان فيها ويحصدان عند مضي أربعين يوماً من زراعتهما وأن التفاح فيها دور كل واحدة ثلاثة أشبار وأكثر، وأبصر أبو عبد الله الباكوري عند المعتمد بن عباد رجلاً من أهلها أهدى إليه أربعاً من التفاح {cite:nafh-tib-maqqari p. 200}."
  en: "Xativa — whose wheat and barley, says Ibn al-Yasa', are reaped forty days after sowing and whose apples span three handbreadths {cite:nafh-tib-maqqari p. 200}."
  es: "Xativa — cuyo trigo y cebada, dice Ibn al-Yasa', se cosechan cuarenta días después de la siembra y cuyas manzanas abarcan tres palmos {cite:nafh-tib-maqqari p. 200}."
  fr: "Xativa — dont le blé et l'orge, selon Ibn al-Yasa', sont récoltés quarante jours après les semailles et dont les pommes s'étendent sur trois largeurs de main {cite:nafh-tib-maqqari p. 200}."
  ur: "Xativa - جس کی گندم اور جو، ابن الیسع کہتے ہیں، بوائی کے چالیس دن بعد کاٹے جاتے ہیں اور جس کے سیب تین ہاتھ چوڑائی کے ہوتے ہیں۔ 200}۔"
  tr: "Endülüs'te bir şehir; İbn el-Yasa, özel özelliklerinden birinin orada buğday ve arpa ekilip kırk gün sonra hasat edilmesi olduğunu, elmanın ise her yerde üç inç küp veya daha fazla olduğunu söylemiştir. Ebu Abdullah el-Bakuri, el-Mu'tamid bin 'Abbad ile birlikte halkından bir adam gördü ve ona dört elma hediye etti {atıf:nafh-tib-maqqari, s. 200}."
  id: "Sebuah kota Andalusia; Ibn al-Yasa mengatakan bahwa salah satu ciri khasnya adalah gandum dan jelai ditanam di sana dan dipanen setelah empat puluh hari penanaman, dan apel berukuran tiga inci kubik atau lebih di setiap tempat. Abu Abdullah al-Bakuri melihat bersama al-Mu'tamid ibn 'Abbad seorang pria dari kaumnya yang memberinya empat apel {kutip: nafh-tib-maqqari, hlm. 200}."
