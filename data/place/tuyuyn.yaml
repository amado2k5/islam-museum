summary:
  ar: "مدينة في بلاد السوس، بين تارودنت وتويوين أسواق وكروم وأشجار وأنواع من الفواكه. {cite:nuzhat-al-mushtaq-2002 p. 228}"
  en: "A town in the Sus lands, with vineyards, trees and many kinds of fruit, between Tarudant and the other settlements of the region. {cite:nuzhat-al-mushtaq-2002 p. 228}"
  es: "Un pueblo en las tierras de Sus, con viñedos, árboles y muchas clases de fruta, entre Tarudant y los demás asentamientos de la región. {cite:nuzhat-al-mushtaq-2002 p. 228}"
  fr: "Une ville des terres du Sous, avec des vignobles, des arbres et de nombreux fruits, située entre Tarudant et les autres localités de la région. {cite:nuzhat-al-mushtaq-2002 p. 228}"
  ur: "سس سرزمین کا ایک قصبہ جس میں انگور کے باغات، درخت اور بہت سے قسم کے پھل ہیں، تارودنٹ اور اس علاقے کی دوسری بستیوں کے درمیان۔ {حوالہ: نزہت المشتاق-2002 ص۔ 228}"
  tr: "Souss bölgesinde, Taroudant ile Touyine arasında, pazarlar, bağlar, ağaçlar ve çeşitli meyve türlerine sahip bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 228}"
  id: "Sebuah kota di wilayah Souss, di antara Taroudant dan Touyine dengan pasar, kebun anggur, pohon, dan berbagai jenis buah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 228}"
