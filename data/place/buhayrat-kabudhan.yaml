summary:
  ar: "بحيرة طولها نحو أربع مراحل بين الشمال والجنوب، وعرضها بضعة أميال، وفيها أمواج عظام في الشتاء، ويذكر الإدريسي أنه ليس فيها دابة ولا سمك. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  en: "A lake about four stages long from north to south and a few miles wide, with great waves in winter; al-Idrisi says it holds no animals and no fish. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  es: "Un lago de aproximadamente cuatro niveles de largo de norte a sur y de unos pocos kilómetros de ancho, con grandes olas en invierno; al-Idrisi dice que no alberga animales ni peces. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  fr: "Un lac d'environ quatre étapes de long du nord au sud et de quelques kilomètres de large, avec de fortes vagues en hiver; al-Idrisi dit qu'il n'y a ni animaux ni poissons. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  ur: "شمال سے جنوب تک تقریباً چار مراحل لمبی اور چند میل چوڑی ایک جھیل، سردیوں میں بڑی لہروں کے ساتھ۔ الادریسی کا کہنا ہے کہ اس میں کوئی جانور یا مچھلی نہیں ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 682}"
