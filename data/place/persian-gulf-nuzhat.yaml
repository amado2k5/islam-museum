label: { ar: "الخليج الأخضر ⁦(بحر فارس)⁩", en: "The Green Gulf (Persian Gulf)", es: "El Golfo Verde (Golfo Pérsico)", fr: "Le Golfe Vert (Golfe Persique)", ur: "گرین گلف ⁦(خلیج فارس)⁩", tr: "Yeşil Körfez (Basra Denizi)", id: "Teluk Hijau (Laut Persia)" }
summary:
  ar: "يتفرع من البحر الهندي والصيني، ويمر بغربي السند ومكران وكرمان وفارس إلى الأبلة، ثم ينعطف جنوباً عبر البحرين واليمامة ويتصل بعمان وأرض الشحر، وطوله نحو أربع مائة فرسخ وأربعين فرسخاً {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
  en: "A branch of the Indian and Chinese sea that runs past western Sind, Makran, Kirman and Fars to al-Ubulla, then turns south past Bahrain, al-Yamama and Oman; about 440 farsakhs long {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
  es: "Un brazo del mar de la India y China que pasa por el oeste de Sind, Makrán, Kirman y Fars hasta al-Ubulla, luego gira hacia el sur pasando por Bahréin, al-Yamama y Omán; de unos 440 farsakhs de longitud {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
  fr: "Une branche de la mer Indienne et chinoise qui passe devant l'ouest du Sind, le Makran, le Kirman et le Fars jusqu'à al-Ubulla, puis tourne vers le sud en passant devant Bahreïn, al-Yamama et Oman; environ 440 farsakhs de long {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
  ur: "ہندوستانی اور چینی سمندر کی ایک شاخ جو مغربی سندھ، مکران، کرمان اور فارس سے گزر کر الابلہ تک جاتی ہے، پھر بحرین، ال یمامہ اور عمان سے گزر کر جنوب میں مڑتی ہے۔ تقریباً 440 فرسخ طویل {حوالہ: نزہت المشتاق-2002 ص۔ 9-10}۔"
  tr: "Hint ve Çin Denizleri'nden ayrılır, batı Sind, Makran, Kirman ve Fars'tan geçerek Al-Ablah'a ulaşır, ardından Bahreyn ve Al-Yamama üzerinden güneye dönerek Umman ve Al-Shahr topraklarına bağlanır. Uzunluğu yaklaşık dört yüz kırk farsakh'tır {cite:Nuzhat-al-Mushtaq-2002, s. 9-10}."
  id: "Jalan ini bercabang dari Laut India dan Laut Cina, melewati Sindh barat, Makran, Kerman, dan Fars ke Al-Ablah, kemudian berbelok ke selatan melalui Bahrain dan Al-Yamama, terhubung ke Oman dan tanah Al-Shahr. Panjangnya sekitar empat ratus empat puluh farsakh {cite:Nuzhat-al-Mushtaq-2002, hlm. 9-10}."
