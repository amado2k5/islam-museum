summary:
  ar: "يتفرع من البحر الهندي والصيني، ويمر بغربي السند ومكران وكرمان وفارس إلى الأبلة، ثم ينعطف جنوباً عبر البحرين واليمامة ويتصل بعمان وأرض الشحر، وطوله نحو أربع مائة فرسخ وأربعين فرسخاً {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
  en: "A branch of the Indian and Chinese sea that runs past western Sind, Makran, Kirman and Fars to al-Ubulla, then turns south past Bahrain, al-Yamama and Oman; about 440 farsakhs long {cite:nuzhat-al-mushtaq-2002 p. 9-10}."
