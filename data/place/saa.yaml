summary:
  ar: "مدينة لطيفة صغيرة بأسفل كدية، مطلة على نهر كبير يشق أرباضها، وهي الآن مهدمة خربة، بحسب الإدريسي. {cite:nuzhat-al-mushtaq-2002 p. 247}"
  en: "A small, pleasant town at the foot of a hill, overlooking a great river that cuts through its suburbs; al-Idrisi says it is now ruined. {cite:nuzhat-al-mushtaq-2002 p. 247}"
  es: "Un pequeño y agradable pueblo al pie de una colina, con vistas a un gran río que atraviesa sus alrededores; al-Idrisi afirma que ahora está en ruinas. {cite:nuzhat-al-mushtaq-2002 p. 247}"
  fr: "Une petite ville agréable au pied d'une colline, surplombant un grand fleuve qui traverse sa périphérie; al-Idrisi dit qu'elle est aujourd'hui en ruines. {cite:nuzhat-al-mushtaq-2002 p. 247}"
  ur: "ایک پہاڑی کے دامن میں ایک چھوٹا، خوشگوار شہر، ایک عظیم دریا کو نظر انداز کرتا ہے جو اپنے مضافات میں سے گزرتا ہے۔ الادریسی کا کہنا ہے کہ یہ اب تباہ ہوچکا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 247}"
  tr: "Kdiya'nın eteğinde, nehirlerini kesen büyük bir nehre bakan güzel küçük bir kasaba ve Al-Idrissi'ye göre şimdi harabe durumda. {kaynak:nuzhat-al-mushtaq-2002 s. 247}"
  id: "Sebuah kota kecil yang indah di kaki Kdiya, menghadap sungai besar yang membelah sungai-sungainya, dan kini telah hancur, menurut Al-Idrissi. {cite:nuzhat-al-mushtaq-2002 hlm. 247}"
