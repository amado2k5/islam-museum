label: { ar: "جزيرة بوصا", en: "Bausa island", es: "Isla Bausa", fr: "Île de Bausa", ur: "باؤسا جزیرہ", tr: "Bosa Adası", id: "Pulau Bosa" }
summary:
  ar: "جزيرة من جزيرتين تابعتين لملك قامرون، أهلها بيض البشرة، ونساؤهم جميلات، وفيهم نجدة وبأس، ويذكر المؤلف أنهم كانوا يقطعون الطريق على الناس بمراكب سريعة {cite:nuzhat-al-mushtaq-2002 p. 90}."
  en: "One of two islands under the king Qamrun. Its people are fair-skinned and its women handsome. The author says they are bold and that they once raided passing ships with fast boats {cite:nuzhat-al-mushtaq-2002 p. 90}."
  es: "Una de las dos islas bajo el dominio del rey Qamrun. Sus habitantes son de tez clara y sus mujeres hermosas. El autor afirma que son audaces y que en una ocasión asaltaron barcos que pasaban con lanchas rápidas {cite:nuzhat-al-mushtaq-2002 p. 90}."
  fr: "L'une des deux îles sous le règne du roi Qamrun. Ses habitants ont le teint clair et ses femmes sont belles. L'auteur les décrit comme audacieux et affirmant qu'ils pillaient autrefois les navires de passage à bord de vedettes rapides {cite:nuzhat-al-mushtaq-2002 p. 90}."
  ur: "قمرون بادشاہ کے زیرِ انتظام دو جزیروں میں سے ایک۔ اس کے لوگ خوبصورت ہیں اور اس کی عورتیں خوبصورت ہیں۔ مصنف کا کہنا ہے کہ وہ دلیر ہیں اور انہوں نے ایک بار تیز کشتیوں کے ساتھ گزرنے والے بحری جہازوں پر چھاپہ مارا تھا۔ 90}۔"
  tr: "Qamrun kralına ait iki kişilik bir ada, sakinleri açık tenli, kadınları güzeldi ve güç ve kuvvete sahiptiler. Yazar, hızlı teknelerle insanların yolunu kapattıklarını belirtir {cite:nuzhat-al-mushtaq-2002, s. 90}."
  id: "Sebuah pulau berisi dua pulau milik raja Qamrun, penduduknya berkulit cerah, wanita-wanitanya cantik, dan mereka memiliki kekuatan serta kekuatan. Penulis menyebutkan bahwa mereka biasa menghalangi jalan bagi orang-orang dengan perahu cepat {cite:nuzhat-al-mushtaq-2002, hlm. 90}."
