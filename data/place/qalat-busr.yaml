summary:
  ar: "قلعة بسر قلعة بالقرب من مدينة تدعى مجّانة عند معدن الفضة من أعمال القيروان؛ فتحها بسر بن أبي أرطاة في ولاية عقبة بن نافع — وقيل وجّهه إليها موسى بن نصير وعمره اثنتان وثمانون سنة — وقتل وسبى فسُمّيت به إلى اليوم."
  en: "Qal'at Busr, a castle near a town called Majjana by the silver mine, among Qayrawan's works; Busr ibn Abi Artat opened it in Uqba ibn Nafi's governorship — or, some say, Musa ibn Nusayr sent him to it aged eighty-two — killing and capturing, whence it bears his name to this day."
