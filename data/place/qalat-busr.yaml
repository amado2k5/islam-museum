label: { ar: "قلعة بسر", en: "Qal'at Busr", es: "Qal'at Busr", fr: "Qal'at Busr", ur: "قلعت بسر", tr: "Basr Kalesi", id: "Kastil Basr" }
summary:
  ar: "قلعة بسر قلعة بالقرب من مدينة تدعى مجّانة عند معدن الفضة من أعمال القيروان؛ فتحها بسر بن أبي أرطاة في ولاية عقبة بن نافع — وقيل وجّهه إليها موسى بن نصير وعمره اثنتان وثمانون سنة — وقتل وسبى فسُمّيت به إلى اليوم."
  en: "Qal'at Busr, a castle near a town called Majjana by the silver mine, among Qayrawan's works; Busr ibn Abi Artat opened it in Uqba ibn Nafi's governorship — or, some say, Musa ibn Nusayr sent him to it aged eighty-two — killing and capturing, whence it bears his name to this day."
  es: "Qal'at Busr, un castillo cerca de una ciudad llamada Majjana, junto a la mina de plata, se encuentra entre las obras de Qayrawan; Busr ibn Abi Artat lo abrió durante el gobierno de Uqba ibn Nafi —o, según algunos, Musa ibn Nusayr lo envió allí a la edad de ochenta y dos años— matando y capturando, de ahí que lleve su nombre hasta el día de hoy."
  fr: "Qal'at Busr, un château près d'une ville appelée Majjana, près de la mine d'argent, parmi les œuvres de Qayrawan; Busr ibn Abi Artat l'a ouvert pendant le gouvernorat d'Uqba ibn Nafi — ou, selon certains, Musa ibn Nusayr l'y a envoyé à l'âge de quatre-vingt-deux ans — tuant et capturant, d'où il porte son nom jusqu'à ce jour."
  ur: "قلات بسر، چاندی کی کان کے پاس مجانا نامی قصبے کے قریب ایک قلعہ، قاراوان کے کاموں میں سے؛ بسر بن ابی ارطاط نے اسے عقبہ بن نافع کی گورنری میں کھولا یا بعض کہتے ہیں کہ موسیٰ بن نصیر نے اسے بیاسی سال کی عمر میں اس کے پاس بھیجا تھا - قتل اور گرفتاری، جہاں سے آج تک اس کا نام ہے۔"
  tr: "Basr Kalesi, Kairouan'daki gümüş madeni yakınındaki Majana adlı bir şehrin yakınında bir kaledir; Uqba ibn Nafi' eyaletinde Basr ibn Abi Arta'ah tarafından fethedilmiştir — ve Musa ibn Nusayr'ın seksen iki yaşındayken oraya yönlendirildiği söylenir — öldürülüp esir alınmıştır; bugün hâlâ onun adını taşımaktadır."
  id: "Kastil Basr adalah sebuah benteng dekat sebuah kota bernama Majana dekat tambang perak di Kairouan; benteng ini ditaklukkan oleh Basr ibn Abi Arta'ah di provinsi Uqba ibn Nafi' — dan dikatakan bahwa Musa ibn Nusayr diarahkan ke sana saat berusia delapan puluh dua tahun — dan dibunuh serta ditangkap, dan benteng ini masih dinamai menurut namanya hingga hari ini."
