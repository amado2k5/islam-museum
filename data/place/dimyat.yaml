summary:
  ar: "دمياط من مدن الوجه البحري على ثغر النيل؛ وجّه إليها عمرو بن العاص عمير بن وهب الجمحي مع تنّيس وتونة ودميرة وشطا ودقهلة وبنا وبوصير فصالح أهل قراها على مثل حكم الفسطاط."
  en: "Damietta, a lower-Egypt city on the Nile's mouth; Amr ibn al-As sent Umayr ibn Wahb al-Jumahi to it with Tinnis, Tuna, Damira, Shata, Diqahla, Bana and Busir — their villages compounding on Fustat's terms."
  es: "Damietta, una ciudad del Bajo Egipto situada en la desembocadura del Nilo; Amr ibn al-As envió a Umayr ibn Wahb al-Jumahi a ella con Tinnis, Tuna, Damira, Shata, Diqahla, Bana y Busir, cuyas aldeas se unieron según las condiciones de Fustat."
  fr: "Damiette, une ville de Basse-Égypte à l'embouchure du Nil; Amr ibn al-As y envoya Umayr ibn Wahb al-Jumahi avec Tinnis, Tuna, Damira, Shata, Diqahla, Bana et Busir — leurs villages regroupés selon les conditions de Fustat."
  ur: "Damietta، نیل کے منہ پر ایک زیریں مصر کا شہر؛ عمرو بن العاص نے عمیر بن وھب الجماحی کو تنیس، تونا، دمیرا، شطا، دقاہلہ، بانا اور بصیر کے ساتھ اس پر بھیجا - ان کے گاؤں فوستات کی شرائط پر ملتے ہیں۔"
