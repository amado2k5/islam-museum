summary:
  ar: "مدينة صغيرة كالقرية الجامعة، ليست بمسورة، تقع على تل رملي. أهلها قليلو الترحال، وتجارتها مجالبة، وتبعد عن اقنت خمسة أيام. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  en: "A small town like a village gathered around a market, without walls, on a sand hill. Its people travel little and its trade is by import. Five days from Iqnat. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  es: "Un pequeño pueblo, parecido a una aldea, agrupado alrededor de un mercado, sin murallas, sobre una duna de arena. Sus habitantes viajan poco y su comercio se basa en la importación. A cinco días de Iqnat. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  fr: "Une petite ville, semblable à un village, construite autour d'un marché, sans remparts, sur une dune de sable. Ses habitants voyagent peu et son commerce repose sur l'importation. À cinq jours d'Iqnat. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  ur: "ایک گاؤں جیسا چھوٹا سا قصبہ بازار کے گرد، بغیر دیواروں کے، ریت کی پہاڑی پر جمع تھا۔ اس کے لوگ بہت کم سفر کرتے ہیں اور اس کی تجارت درآمد سے ہوتی ہے۔ اقنت سے پانچ دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 45}"
  tr: "Üniversitenin köyü gibi küçük bir kasaba, çitlerle çevrili değil, kumlu bir tepe üzerinde yer alıyor. Halkı daha az seyahat ediyor, ticareti mütevazı ve Aknent'e beş gün uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 45}"
  id: "Sebuah kota kecil seperti desa universitas, tidak berpagar, terletak di atas bukit berpasir. Penduduknya jarang bepergian, perdagangannya sederhana, dan berjarak lima hari dari Aknent. {cite:Nuzhat-al-Mushtaq-2002 hlm. 45}"
