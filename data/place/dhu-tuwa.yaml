label: { en: "Dhu Tuwa", ar: "ذي طوى" }
summary:
  en: "A valley in lower Mecca where the Prophet halted the army, bowed his head in humility on his mount until his beard nearly touched the saddle, divided the columns for entry, and where Abu Quhafa was brought to embrace Islam."
  ar: "وادٍ بأسفل مكة نزل به النبي معسكرًا، ووضع رأسه تواضعًا لله حتى كاد عثنونه يمس واسطة الرحل، وقسم الجيوش لدخول مكة، وفيه جيء بأبي قحافة فأسلم."
