summary:
  en: "A valley in lower Mecca where the Prophet halted the army, bowed his head in humility on his mount until his beard nearly touched the saddle, divided the columns for entry, and where Abu Quhafa was brought to embrace Islam."
  ar: "وادٍ بأسفل مكة نزل به النبي معسكرًا، ووضع رأسه تواضعًا لله حتى كاد عثنونه يمس واسطة الرحل، وقسم الجيوش لدخول مكة، وفيه جيء بأبي قحافة فأسلم."
  es: "Un valle en la parte baja de La Meca donde el Profeta detuvo al ejército, inclinó su cabeza con humildad sobre su montura hasta que su barba casi tocó la silla de montar, dividió las columnas para la entrada y donde Abu Quhafa fue llevado a abrazar el Islam."
  fr: "Une vallée de la basse Mecque où le Prophète arrêta l'armée, inclina humblement la tête sur sa monture jusqu'à ce que sa barbe touche presque la selle, sépara les colonnes pour l'entrée et où Abou Quhafa fut amené à embrasser l'islam."
  ur: "مکہ کے نچلے حصے میں ایک وادی جہاں نبی نے فوج کو روکا، اپنے پہاڑ پر عاجزی کے ساتھ اپنا سر جھکایا یہاں تک کہ اس کی داڑھی تقریباً زین کو چھو گئی، داخلے کے لیے کالم تقسیم کیے، اور جہاں ابو قحافہ کو اسلام قبول کرنے کے لیے لایا گیا۔"
  tr: "Mekke'nin dibinde bir vadi, Peygamber'in kamp kurduğu ve başını alçakgönüllülükle Allah'a indirdiği yer, külleri neredeyse yolcuların kaynaklarına değiyordu. Orduları bölerek Mekke'ye girdi, burada Ebu Quhafa getirildi ve İslam'ı benimsedi."
  id: "Sebuah lembah di kaki Mekah tempat Nabi berkemah dan menundukkan kepalanya dengan rendah hati di hadapan Tuhan hingga abunya hampir menyentuh jalan para pelancong. Ia membagi pasukan untuk memasuki Mekah, tempat Abu Quhafa dibawa dan memeluk Islam."
