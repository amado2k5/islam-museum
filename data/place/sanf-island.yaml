label: { ar: "جزيرة صنف", en: "Sanf island", es: "Isla Sanf", fr: "Île de Sanf", ur: "سانف جزیرہ", tr: "Sassaf Adası", id: "Pulau Sassaf" }
summary:
  ar: "جزيرة قريبة من الساحل تبعد عن قمار بضعة أميال، وفيها يوجد العود الصنفي وهو أفضل من العود المعتاد، ومنها البقر والنارجيل والموز والقصب والأرز، ويأكل أهلها البقر فقط إذا ماتت، ولا يقتلون البقر بل يتركونه حتى يموت {cite:nuzhat-al-mushtaq-2002 p. 83}."
  en: "An island near the coast a few miles from Qumar, where the best kind of oud is found. It has cattle, coconuts, bananas, cane and rice. Its people eat cattle only when they die naturally and do not kill them {cite:nuzhat-al-mushtaq-2002 p. 83}."
  es: "Una isla cercana a la costa, a pocos kilómetros de Qumar, donde se encuentra el mejor tipo de oud. Cuenta con ganado, cocos, plátanos, caña de azúcar y arroz. Sus habitantes solo consumen ganado cuando muere de forma natural y no lo matan {cite:nuzhat-al-mushtaq-2002 p. 83}."
  fr: "Une île proche de la côte, à quelques kilomètres de Qumar, où l'on trouve le meilleur oud. On y trouve du bétail, des cocotiers, des bananiers, de la canne à sucre et du riz. Ses habitants ne consomment de bétail que lorsqu'il meurt de mort naturelle et ne le tuent pas (Nuzhat al-Mushtaq, 2002, p. 83)."
  ur: "قمر سے چند میل کے فاصلے پر ساحل کے قریب ایک جزیرہ جہاں بہترین قسم کا عود پایا جاتا ہے۔ اس میں مویشی، ناریل، کیلے، گنے اور چاول ہیں۔ اس کے لوگ مویشی اسی وقت کھاتے ہیں جب وہ قدرتی طور پر مر جائیں اور انہیں قتل نہیں کرتے۔ 83}۔"
  tr: "Gomar'a birkaç mil uzaklıkta, kıyıya yakın bir adada, inekler, hindistancevizi, muz, şeker kamışı ve pirinç dahil olmak üzere sıradan uddan daha iyi olan sabun ud bulunur. Sakinleri sadece inekler ölürse yer ve inekleri öldürmez, ölünceye kadar bırakırlar {cite:nuzhat-al-mushtaq-2002, s. 83}."
  id: "Sebuah pulau dekat pantai, beberapa mil dari Gomar, berisi sabun oud, yang lebih baik dari oud biasanya, termasuk sapi, kelapa, pisang, tebu, dan beras. Penduduknya hanya memakan sapi jika sapi mati, dan mereka tidak membunuh sapi tetapi membiarkannya sampai mati {cite:nuzhat-al-mushtaq-2002, hlm. 83}."
