summary:
  ar: "جزيرة قريبة من الساحل تبعد عن قمار بضعة أميال، وفيها يوجد العود الصنفي وهو أفضل من العود المعتاد، ومنها البقر والنارجيل والموز والقصب والأرز، ويأكل أهلها البقر فقط إذا ماتت، ولا يقتلون البقر بل يتركونه حتى يموت {cite:nuzhat-al-mushtaq-2002 p. 83}."
  en: "An island near the coast a few miles from Qumar, where the best kind of oud is found. It has cattle, coconuts, bananas, cane and rice. Its people eat cattle only when they die naturally and do not kill them {cite:nuzhat-al-mushtaq-2002 p. 83}."
