summary:
  ar: "مدينة خوارزم القديمة على الضفة اليمنى لجيحون قرب طورتكول الحالية، عاصمة الأفريغيين منذ أن بنى أفريغ قصره فيها بحسب البيروني، ودار ضرب لنقودهم ونقود المأمونيين، وفيها ولد البيروني {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 158} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 159}."
  en: "Old city of Khwarazm on the right bank of the Oxus near modern Turtkul, capital of the Afrighids since Afrigh built his palace there according to al-Biruni, a mint for Afrighid and Ma'munid coins, and the birthplace of al-Biruni {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 158} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 159}."
  ur: "دریائے آمو کے دائیں کنارے پر موجودہ تورتکول کے قریب خوارزم کا قدیم شہر، بیرونی کے مطابق آفریغ کے وہاں محل بنانے سے آفریغیوں کا دارالحکومت، آفریغی اور مامونی سکوں کی ٹکسال، اور بیرونی کی جائے پیدائش {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 158} {cite:ismoilov-xorazmshohlar-tangalari-2025 p. 159}۔"
