  fr: "Une rivière prenant sa source dans les zones frontalières kurdes, traversant la vallée de Bawan, irriguant les districts de Fars et se jetant dans le lac de Bakhtakan. {cite:nuzhat-al-mushtaq-2002 p. 422}"
  ur: "کرد سرحدوں میں اٹھنے والا ایک دریا جو وادی باوان سے گزرتا ہے، فارس کے اضلاع کو پانی دیتا ہے اور بختکان کی جھیل میں بہتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 422}"
