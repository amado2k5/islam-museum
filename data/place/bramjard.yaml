summary:
  ar: "برامجرد موضع قرب أصطخر؛ استقبل فيه أهلها عبيد الله بن معتر التيمي قائد مقدمة ابن عامر فقاتلهم فقتلوه فدفن في بستان برامجرد."
  en: "Bramjard near Istakhr; there the townsmen met and killed Ibn Amir's vanguard Ubaydallah ibn Ma'tar — buried in Bramjard's garden."
  es: "Bramjard, cerca de Istakhr, fue el lugar donde los habitantes del pueblo se encontraron con Ubaydallah ibn Ma'tar, vanguardia de Ibn Amir, y lo mataron; fue enterrado en el jardín de Bramjard."
  fr: "Bramjard près d'Istakhr; c'est là que les habitants se rencontrèrent et tuèrent l'avant-garde d'Ibn Amir, Ubaydallah ibn Ma'tar — enterré dans le jardin de Bramjard."
  ur: "استخارہ کے قریب براجرد؛ وہاں کے شہر والوں نے ابن عامر کے سرغنہ عبیداللہ ابن معطر سے ملاقات کی اور اسے مار ڈالا - جسے برامجرد کے باغ میں دفن کیا گیا تھا۔"
  tr: "Baramjerd, Astakhir yakınlarında bir yerdir; halkı İbn Emir Cephesi komutanı Ubayd Allah ibn Mu'tar al-Taymi'yi kabul etti, o da onlarla savaştı, onu öldürdü ve Baramjerd bahçesine gömüldü."
  id: "Baramjerd adalah sebuah tempat dekat Astakhir; penduduknya menerima Ubayd Allah ibn Mu'tar al-Taymi, komandan Front Ibn Amir, yang melawan mereka, membunuhnya, dan dimakamkan di kebun Baramjerd."
