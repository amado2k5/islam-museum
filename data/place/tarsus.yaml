summary:
  ar: "طرسوس أعظم مدن الثغور الشامية؛ كانت خراباً بعد جلاء أهلها أيام الفتح حتى وصفها الحسن بن قحطبة للمهدي سنة 162 فأوصى ببنائها، ولما بلغ الرشيد سنة 171 أن الروم ائتمروا لتحصينها سبقهم هرثمة بن أعين فعمّرها على يد فرج بن سليم وسكنتها ندبتا خراسان والشام سنة 172 ومسح خططها أربعة آلاف خطة عشرين ذراعاً في مثلها؛ وصارت منطلق الصوائف وباب الجهاد وأعظم عواصم المسلمين."
  en: "Tarsus, greatest city of the Syrian marches; it lay in ruins after its people's evacuation in the conquest until al-Hasan ibn Qahtaba described it to al-Mahdi in year 162, who bequeathed its building, and when word reached al-Rashid in year 171 that the Byzantines had conspired to fortify it, Harthama ibn A'yan forestalled them, rebuilding it under Faraj ibn Sulaym's hand; the Khurasani and Syrian levies settled it in year 172 across four thousand surveyed lots of twenty cubits each; it became the launching-point of the summer raids, the Jihad gate and the greatest of the Muslims' border strongholds."
