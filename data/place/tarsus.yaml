label:
  ar: طرسوس
  en: Tarsus
  es: "Tarso"
summary:
  ar: طرسوس أعظم مدن الثغور الشامية؛ كانت خراباً بعد جلاء أهلها أيام الفتح حتى وصفها الحسن بن قحطبة للمهدي سنة 162 فأوصى ببنائها،
    ولما بلغ الرشيد سنة 171 أن الروم ائتمروا لتحصينها سبقهم هرثمة بن أعين فعمّرها على يد فرج بن سليم وسكنتها ندبتا خراسان
    والشام سنة 172 ومسح خططها أربعة آلاف خطة عشرين ذراعاً في مثلها؛ وصارت منطلق الصوائف وباب الجهاد وأعظم عواصم المسلمين.
  en: Tarsus, greatest city of the Syrian marches; it lay in ruins after its people's evacuation in the conquest until al-Hasan
    ibn Qahtaba described it to al-Mahdi in year 162, who bequeathed its building, and when word reached al-Rashid in year
    171 that the Byzantines had conspired to fortify it, Harthama ibn A'yan forestalled them, rebuilding it under Faraj ibn
    Sulaym's hand; the Khurasani and Syrian levies settled it in year 172 across four thousand surveyed lots of twenty cubits
    each; it became the launching-point of the summer raids, the Jihad gate and the greatest of the Muslims' border strongholds.
  es: "Tarso, la ciudad más importante de las marcas sirias, quedó en ruinas tras la evacuación de sus habitantes durante la conquista, hasta que al-Hasan ibn Qahtaba se la describió a al-Mahdi en el año 162, quien legó su construcción. Cuando al-Rashid se enteró en el año 171 de que los bizantinos habían conspirado para fortificarla, Harthama ibn A'yan se les adelantó y la reconstruyó bajo la dirección de Faraj ibn Sulaym. Las tropas de Jorasán y Siria se asentaron en ella en el año 172, en cuatro mil parcelas catastradas de veinte codos cada una. Se convirtió en el punto de partida de las incursiones de verano, la puerta de la yihad y la mayor de las fortalezas fronterizas musulmanas."
