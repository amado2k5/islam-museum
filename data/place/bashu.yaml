summary:
  ar: "جزيرة مباركة طيبة الأرض، فيها بساتين وزيتون ومياه آبار، ولم يبق من مدينتها إلا آثار. {cite:nuzhat-al-mushtaq-2002 p. 293}"
  en: "A blessed island with good soil, orchards, olives and well water; only traces of its town remain. {cite:nuzhat-al-mushtaq-2002 p. 293}"
  es: "Una isla bendecida con buena tierra, huertos, olivos y agua de pozo; solo quedan vestigios de su antiguo pueblo. {cite:nuzhat-al-mushtaq-2002 p. 293}"
  fr: "Une île bénie, dotée d'une terre fertile, de vergers, d'oliviers et d'eau de source; il ne reste que des vestiges de sa ville. {cite:nuzhat-al-mushtaq-2002 p. 293}"
  ur: "ایک مبارک جزیرہ جس میں اچھی مٹی، باغات، زیتون اور کنویں کا پانی ہے۔ اس کے شہر کے صرف نشانات باقی ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 293}"
  tr: "Meyve bahçeleri, zeytinler ve kuyu suyu ile dolu kutsanmış bir ada, geriye sadece şehrinin kalıntıları kaldı. {kaynak:nuzhat-al-mushtaq-2002 s. 293}"
  id: "Pulau yang diberkati dengan tanah yang baik, dengan kebun buah, zaitun, dan air sumur, hanya menyisakan reruntuhan kotanya. {cite:nuzhat-al-mushtaq-2002 hlm. 293}"
