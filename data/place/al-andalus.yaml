  ar: "عند البلاذري عن الواقدي: غزاها طارق بن زياد عامل موسى بن نصير أولاً في سنة اثنتين وتسعين فلقيه أليان والي مجازها فآمنه على الحمل في السفن فحاربه أهلها ففتحها وكان ملكها فيما يزعمون من الأشبان وأصلهم من أصبهان."
  en: "In al-Baladhuri via al-Waqidi: Tariq ibn Ziyad, Musa ibn Nusayr's agent, raided it first in year 92; Alyan, governor of its strait, met him and was granted safety for ferrying him and his companions over in ships — its people fought him and he opened it; its king, they allege, was of the Ashban whose origin is Isfahan."
