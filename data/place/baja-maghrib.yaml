summary:
  ar: "مدينة كثيرة شجر التين، يُعمل بها من التين ما يُحمل إلى كثير من الأقطار، وتبعد عن سوق إبراهيم مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 251}"
  en: "A town rich in fig trees whose dried figs are carried to many lands, one stage from Suq Ibrahim. {cite:nuzhat-al-mushtaq-2002 p. 251}"
  es: "Un pueblo rico en higueras cuyos higos secos se transportan a muchas tierras, a una etapa de Suq Ibrahim. {cite:nuzhat-al-mushtaq-2002 p. 251}"
  fr: "Une ville riche en figuiers dont les figues séchées sont exportées vers de nombreuses régions, à une étape de Suq Ibrahim. {cite:nuzhat-al-mushtaq-2002 p. 251}"
  ur: "انجیر کے درختوں سے مالا مال ایک قصبہ جس کے خشک انجیر بہت سی زمینوں پر لے جایا جاتا ہے، سق ابراہیم سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 251}"
  tr: "Birçok incir ağacının bulunduğu bir şehir, birçok ülkeye incir yetiştirilir ve Souk Ibrahim'e bir adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 251}"
  id: "Sebuah kota dengan banyak pohon ara, tempat buah ara dibudidayakan ke banyak negara, dan jaraknya hanya selangkah dari Souk Ibrahim. {cite:nuzhat-al-mushtaq-2002 hlm. 251}"
