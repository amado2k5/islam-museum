label: { ar: "أفيون قره حصار", en: "Afyon (Afyonkarahisar)" }
summary:
  ar: "مدينة في غرب الأناضول، كانت تُسمى قره حصار الصاحب، وسُمّيت أفيون قره حصار لوفرة إنتاج الأفيون؛ كانت قاعدة سنجق في إيالة الأناضول، وأخضعها العثمانيون سنة 832 هـ، وكانت ساحة للحروب مع القرمانيين والمماليك وفي حرب 1921–1922 {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  en: "A town of western Anatolia, formerly Kara Hisar-i Sahib, called Afyon Kara Hisar from its rich opium production. It was the seat of a sanjak of the Anatolian eyalet, annexed by the Ottomans in 832/1428–9, and fought over in the wars with the Karamanids and in the Greek occupation of 1921–1922 {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
