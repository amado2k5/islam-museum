summary:
  ar: مدينة في غرب الأناضول، كانت تُسمى قره حصار الصاحب، وسُمّيت أفيون قره حصار لوفرة إنتاج الأفيون؛ كانت قاعدة سنجق في إيالة الأناضول، وأخضعها العثمانيون سنة 832 هـ، وكانت ساحة للحروب مع القرمانيين والمماليك وفي حرب 1921–1922 {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}.
  en: A town of western Anatolia, formerly Kara Hisar-i Sahib, called Afyon Kara Hisar from its rich opium production. It was the seat of a sanjak of the Anatolian eyalet, annexed by the Ottomans in 832/1428–9, and fought over in the wars with the Karamanids and in the Greek occupation of 1921–1922 {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}.
  es: "Afyon Kara Hisar, una ciudad del oeste de Anatolia, antiguamente Kara Hisar-i Sahib, llamada Afyon Kara Hisar por su rica producción de opio. Fue sede de un sanjacado del eyalato de Anatolia, anexionado por los otomanos en 832/1428–9, y disputado en las guerras contra los karamánidas y durante la ocupación griega de 1921–1922 {cite:encyclopaedia-of-islam-2 vol. 1 p. 265}."
  fr: "Afyon Kara Hisar, ville d'Anatolie occidentale, anciennement Kara Hisar-i Sahib, ainsi nommée en raison de sa riche production d'opium, fut le siège d'un sandjak de l'eyalet anatolien. Annexée par les Ottomans en 832/1428-1429, elle fut le théâtre de nombreux affrontements lors des guerres contre les Karamanides et durant l'occupation grecque de 1921-1922 (voir Encyclopaedia of Islam, vol. 2, p. 265)."
