summary:
  ar: "مدينة صغيرة متحضرة كثيرة الأهل، واسعة الخيرات، جامعة للزراعات، وكل ما يؤكل فيها كثير رخيص. وأسواقها ومتاجرها مريحة. تقع على الخليج الذي ينزل شمالا من معظم النيل. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  en: "A small, well-ordered town with many inhabitants and wide resources. It has many crops, plentiful and cheap food, and comfortable markets. It lies on the branch canal that flows north from the main Nile. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  es: "Una pequeña ciudad bien organizada, con muchos habitantes y amplios recursos. Cuenta con diversos cultivos, alimentos abundantes y baratos, y mercados cómodos. Se ubica en el canal secundario que fluye hacia el norte desde el Nilo principal. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  fr: "Une petite ville bien organisée, peuplée et riche en ressources. On y cultive de nombreuses plantes, la nourriture y est abondante et bon marché, et les marchés sont agréables. Elle est située sur le canal secondaire qui coule vers le nord depuis le Nil principal. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  ur: "بہت سے باشندوں اور وسیع وسائل کے ساتھ ایک چھوٹا، اچھی ترتیب والا شہر۔ اس میں بہت سی فصلیں، وافر اور سستی خوراک اور آرام دہ بازار ہیں۔ یہ شاخ کی نہر پر واقع ہے جو مرکزی نیل سے شمال کی طرف بہتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 130}"
  tr: "Çok sayıda insana sahip, kaynaklara sahip, tarım merkezi ve yiyecek her şey çok ucuz, küçük, medeni bir şehir. Pazarları ve dükkanları konforludur. Nil'in büyük kısmının kuzeyine akan koyda yer alır. {cite:nuzhat-al-mushtaq-2002 s. 130}"
  id: "Kota kecil yang beradab dengan banyak penduduk, kaya sumber daya, pusat pertanian, dan segala makanan di sana sangat murah. Pasar dan toko-tokonya nyaman. Kota ini terletak di teluk yang mengalir di utara sebagian besar Sungai Nil. {cite:nuzhat-al-mushtaq-2002 hlm. 130}"
