summary:
  ar: "مدينة صغيرة متحضرة كثيرة الأهل، واسعة الخيرات، جامعة للزراعات، وكل ما يؤكل فيها كثير رخيص. وأسواقها ومتاجرها مريحة. تقع على الخليج الذي ينزل شمالا من معظم النيل. {cite:nuzhat-al-mushtaq-2002 p. 130}"
  en: "A small, well-ordered town with many inhabitants and wide resources. It has many crops, plentiful and cheap food, and comfortable markets. It lies on the branch canal that flows north from the main Nile. {cite:nuzhat-al-mushtaq-2002 p. 130}"
