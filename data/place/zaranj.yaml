summary:
  ar: "زرنج مدينة سجستان الكبرى؛ حاصرها الربيع بن زياد فصالحه مرزبانها أبرويز على ألف وضيف مع كل وصيف جام من ذهب بعد أن أجلسه على جثة قتيل وكانت ولاية الربيع بها سنتين ونصفاً سبى فيها أربعين ألف رأس ثم حصر ابن سمرة مرزبانها يوم عيدهم فصالحه على ألفي ألف درهم وألفي وصيف."
  en: "Zaranj, the great city of Sijistan; besieged by al-Rabi' ibn Ziyad its marzban Aparwiz truced for a thousand wadif with gold cups — seated on a corpse — in a two-and-a-half-year governorship that took forty thousand captives; then Ibn Samura besieged its marzban on their feast-day for two million dirhams and two thousand wadif."
