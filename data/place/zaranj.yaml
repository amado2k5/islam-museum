summary:
  ar: زرنج مدينة سجستان الكبرى؛ حاصرها الربيع بن زياد فصالحه مرزبانها أبرويز على ألف وضيف مع كل وصيف جام من ذهب بعد أن أجلسه
    على جثة قتيل وكانت ولاية الربيع بها سنتين ونصفاً سبى فيها أربعين ألف رأس ثم حصر ابن سمرة مرزبانها يوم عيدهم فصالحه على
    ألفي ألف درهم وألفي وصيف.
  en: Zaranj, the great city of Sijistan; besieged by al-Rabi' ibn Ziyad its marzban Aparwiz truced for a thousand wadif with
    gold cups — seated on a corpse — in a two-and-a-half-year governorship that took forty thousand captives; then Ibn Samura
    besieged its marzban on their feast-day for two million dirhams and two thousand wadif.
  es: "Zaranj, la gran ciudad de Sijistan; asediada por al-Rabi' ibn Ziyad, su marzban Aparwiz pagó una tregua por mil wadif con copas de oro —sentado sobre un cadáver— en un gobierno de dos años y medio que tomó cuarenta mil cautivos; luego Ibn Samura asedió a su marzban en su día festivo por dos millones de dirhams y dos mil wadif."
  fr: "Zaranj, la grande ville du Sijistan; assiégée par al-Rabi' ibn Ziyad, son marzban Aparwiz conclut une trêve pour mille wadifs avec des coupes en or — assis sur un cadavre — au cours d'un gouvernement de deux ans et demi qui fit quarante mille captifs; puis Ibn Samura assiégea son marzban le jour de leur fête pour deux millions de dirhams et deux mille wadifs."
  ur: "زرنج، سجستان کا عظیم شہر؛ ربیع ابن زیاد کا محاصرہ کر کے اس کے مرزبان اپرویز نے ایک ہزار ودیف کے لیے سونے کے پیالوں کے ساتھ - ایک لاش پر بٹھایا - ڈھائی سالہ گورنری میں جس نے چالیس ہزار قیدی بنائے۔ پھر ابن سمرہ نے ان کی عید کے دن اس کے مرزبان کا محاصرہ 20 لاکھ درہم اور دو ہزار ودیف کے لیے کیا۔"
  tr: "Zaranj, Sijistan'ın büyük şehriydi; Al-Rabi' ibn Ziyad tarafından kuşatılmıştı; binin üzerinde zaban Abrawiz ve her altın kupayla bir misafirle barış yaptı, bir ölü cesedinin üzerine oturdu. Al-Rabi'nin valiliği iki buçuk yıl sürdü ve kırk bin baş ele geçirildi. Sonra İbn Samura, bayram günü zabanını kuşattı ve onunla iki bin dirhem ve iki bin wasif karşılığında barış yaptı."
  id: "Zaranj adalah kota besar Sijistan; kota ini dikepung oleh Al-Rabi' ibn Ziyad, yang berdamai dengan zaban Abrawiz lebih dari seribu orang dan seorang tamu dengan setiap cawan emas setelah duduk di atas mayat seorang yang terbunuh. Kepemimpinan Al-Rabi berlangsung selama dua setengah tahun, di mana empat puluh ribu kepala ditangkap. Kemudian Ibn Samura mengepung zabannya pada hari perayaan mereka dan berdamai dengannya dengan dua ribu dirham dan dua ribu wasif."
