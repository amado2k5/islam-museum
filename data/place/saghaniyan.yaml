summary:
  ar: "الصغانيان بلاد في الجانب الشرقي من النهر؛ جاء أهلها إلى جموع طخارستان الثلاثين ألفاً على الأحنف فقصد ملكها للأحنف بالرمح فانتزعه من يده وقتله وكان قتل ثلاثة من أصحاب الطبول يقصد صاحب الطبل فيقتله."
  en: "al-Saghaniyan, the lands on the river's east bank; its folk joined the thirty-thousand Tukharistan mass against al-Ahnaf — its king's spear was wrenched from his hand and he was killed, after al-Ahnaf had slain three drum-bearers in turn."
  es: "Al-Saghaniyan, las tierras en la orilla este del río; sus habitantes se unieron a la masa de treinta mil tukharistan contra al-Ahnaf: a su rey le arrebataron la lanza de la mano y lo mataron, después de que al-Ahnaf hubiera asesinado a tres portadores de tambores."
  fr: "al-Saghaniyan, les terres de la rive est du fleuve; ses habitants ont rejoint la masse de trente mille Tukharistan contre al-Ahnaf — la lance de son roi lui a été arrachée des mains et il a été tué, après qu'al-Ahnaf eut tué trois porteurs de tambour à tour de rôle."
  ur: "الصغانیان، دریا کے مشرقی کنارے کی زمینیں؛ اس کے لوگ الاحناف کے خلاف تیس ہزار ترکستان کے عوام میں شامل ہوئے - اس کے بادشاہ کا نیزہ اس کے ہاتھ سے چھین لیا گیا اور وہ مارا گیا، جب الاحناف نے تین ڈھول برداروں کو باری باری مار ڈالا۔"
