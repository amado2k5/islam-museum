summary:
  ar: "بحيرة كبيرة في أرض التبت، طولها نحو أربعين فرسخاً، وعليها قلاع وحصون، ويصيد منها أهل بروان وأوج السمك. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  en: "A great lake in Tibet about forty farsakhs long, with forts and fortresses on it; the people of Buruan and Ujj fish in it. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  es: "Un gran lago en el Tíbet de unos cuarenta farsakhs de largo, con fuertes y fortalezas en sus orillas; los habitantes de Buruan y Ujj pescan en él. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  fr: "Un grand lac du Tibet, long d'environ quarante farsakhs, bordé de forts et de forteresses; les habitants de Buruan et d'Ujj y pêchent. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  ur: "تبت میں تقریباً چالیس فرسخ لمبی ایک عظیم جھیل جس پر قلعے اور قلعے ہیں۔ بروان اور عج کے لوگ اس میں مچھلیاں کھاتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 513}"
  tr: "Tibet topraklarında yaklaşık kırk lig uzunluğunda, kaleler ve kaleler bulunan büyük bir göl, Broan ve Ough halkı buradan balık tutar. {kaynak:nuzhat-al-mushtaq-2002 s. 513}"
  id: "Sebuah danau besar di tanah Tibet, sekitar empat puluh liga panjang, dengan kastil dan benteng, dan penduduk Broan serta Ough memancing dari situ. {cite:Nuzhat-al-Mushtaq-2002 hlm. 513}"
