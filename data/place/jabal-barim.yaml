summary:
  ar: "جبل أحمر في هذه الناحية، ويذكر المؤلف أنه يقال إن مسلتي الإسكندرية نحتتا منه، وهو قول يرويه ولا يؤكده {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "A red mountain in this region. The author reports the claim that the two obelisks of Alexandria were carved from it; he gives it as hearsay {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Una montaña roja en esta región. El autor menciona la afirmación de que los dos obeliscos de Alejandría fueron tallados en ella; lo cita como un rumor {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Une montagne rouge dans cette région. L'auteur rapporte l'affirmation selon laquelle les deux obélisques d'Alexandrie auraient été sculptés dans cette montagne; il la cite comme ouï-dire {cite: nuzhat-al-mushtaq-2002 p. 124}."
  ur: "اس علاقے میں ایک سرخ پہاڑ۔ مصنف نے دعویٰ کیا ہے کہ اسکندریہ کے دو اوبلیسک اس سے تراشے گئے تھے۔ اس نے اسے سنا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 124}۔"
