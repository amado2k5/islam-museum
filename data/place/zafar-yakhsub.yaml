summary:
  ar: "مدينة كانت ظفار قصبة يخصب في اليمن، وذكرها الإدريسي في سياق المسافات من سوق عكاظ إلى نجران وإلى صنعاء ⁦(نزهة المشتاق، الماسح ص 63)⁩."
  en: "A city that was Zafar, capital of Yakhsub in Yemen. Al-Idrisi mentions it in his account of distances from the Ukaz market to Najran and to Sanaa (Nuzhat al-mushtaq, al-Masih p. 63)."
  es: "La ciudad de Zafar, capital de Yakhsub en Yemen, es mencionada por Al-Idrisi en su relato de las distancias desde el mercado de Ukaz hasta Najran y Sanaa (Nuzhat al-mushtaq, al-Masih, pág. 63)."
  fr: "Il s'agit de la ville de Zafar, capitale de Yakhsub au Yémen. Al-Idrisi la mentionne dans son récit des distances entre le marché d'Ukaz et Najran, puis Sanaa (Nuzhat al-mushtaq, al-Masih p. 63)."
  ur: "ایک شہر جو یمن میں یخسوب کا دارالحکومت ظفر تھا۔ الادریسی نے اسے عکاز بازار سے نجران اور صنعاء تک کے فاصلوں کے حوالے سے ذکر کیا ہے ⁦(نزہت المشتاق، المسیح ص 63)⁩۔"
  tr: "Dhofar bir zamanlar Yemen'de verimli bir şehirdi ve Al-Idrisi, Souq Okas'tan Necran ve Sana'a'ya olan mesafeler bağlamında bahsetmiştir (Nuzhat al-Mushtaq, Al-Masih, s. 63)."
  id: "Dhofar dulunya merupakan kota subur di Yaman, dan Al-Idrisi menyebutkannya dalam konteks jarak dari Souq Okaz ke Najran dan ke Sana'a (Nuzhat al-Mushtaq, Al-Masih, hlm. 63)."
