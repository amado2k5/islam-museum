summary:
  ar: "مدينة على بعد من بحيرة كبوذان، فيها مراكب كثيرة تخترق البحيرة، وتبعد عن تبريز وداخرقان حواليهما مدن ومراع. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  en: "A town set back from Lake Kabudhan, with many boats crossing the lake, and with towns and pastures around it between Tabriz and Dakhraqan. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  es: "Un pueblo situado a orillas del lago Kabudhan, con numerosos barcos que lo cruzan, y rodeado de pueblos y pastos entre Tabriz y Dakhraqan. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  fr: "Une ville située en retrait du lac Kabudhan, traversée par de nombreux bateaux, et entourée de villages et de pâturages entre Tabriz et Dakhraqan. {cite:nuzhat-al-mushtaq-2002 p. 682}"
  ur: "ایک قصبہ کبودھن جھیل سے واپس نکلا، جس میں بہت سی کشتیاں جھیل کو عبور کرتی تھیں، اور تبریز اور دخرقان کے درمیان اس کے ارد گرد شہر اور چراگاہیں تھیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 682}"
  tr: "Kaboudan Gölü'nden uzakta, birçok teknenin gölü geçtiği bir şehir, ayrıca Tebriz ve Dakrakhan'dan uzakta çevredeki kasabalar ve meralar bulunmaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 682}"
  id: "Sebuah kota yang terletak jauh dari Danau Kaboudan, tempat banyak perahu menyeberangi danau, dan jauh dari Tabriz dan Dakhrakhan, terdapat kota-kota dan padang rumput di sekitarnya. {cite:nuzhat-al-mushtaq-2002 hlm. 682}"
