summary:
  ar: "موضع بين الطائف ومكة على طريق عودة النبي من حنين، ذكره ياقوت في سياق مروره على نخلة اليمانية ثم قرن ثم المايح ثم بحرة الرغاء."
  en: "A place between al-Taif and Makkah on the Prophet's return road from Hunayn. Yaqut mentions it in the course of passing Nakhla al-Yamaniya, then Qarn, then al-Mayh, then Bahrat al-Raghaa'."
  es: "Un lugar situado entre al-Taif y La Meca, en la ruta de regreso del Profeta desde Hunayn. Yaqut lo menciona al pasar por Nakhla al-Yamaniya, luego Qarn, después al-Mayh y finalmente Bahrat al-Raghaa'."
  fr: "Un lieu situé entre al-Taif et La Mecque, sur le chemin du retour du Prophète après Hunayn. Yaqut le mentionne en passant par Nakhla al-Yamaniya, puis Qarn, puis al-Mayh, puis Bahrat al-Raghaa'."
  ur: "حنین سے نبی کی واپسی کے راستے پر طائف اور مکہ کے درمیان ایک جگہ۔ یاقوت نے اس کا تذکرہ نخلہ یمنیہ، پھر قرن، پھر المیح، پھر بحرت الرضا میں کیا ہے۔"
  tr: "Peygamber'in Hunayn'dan dönüş yolu üzerinde Taif ile Mekke arasında bir yer. Yaqut, önce Yemeniya Palmiyesi, sonra Karn, sonra Al-Ma'ih ve ardından Bahrat Al-Ragha boyunca geçişi bağlamında bunu anmıştır."
  id: "Sebuah tempat antara Taif dan Mekah dalam rute pulang Nabi dari Hunayn. Yaqut menyebutkannya dalam konteks perjalanannya melewati Palm of Yemeniya, lalu Qarn, kemudian Al-Ma'ih, dan kemudian Bahrat Al-Ragha."
