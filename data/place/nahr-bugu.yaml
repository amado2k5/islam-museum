label: { ar: "نهر بوغو", en: "Bugu River", es: "Río Bugu", fr: "Rivière Bugu", ur: "دریائے بگو", tr: "Bogo Nehri", id: "Sungai Bogo" }
summary:
  ar: "نهر كبير تدخله المراكب والشواني، وعليه المدن والحصون، ويصب في البحر الغربي، وتبعد عن موقعه سبعون ميلاً عن حصن منت ميور. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  en: "A great river entered by boats and galleys, with towns and forts along it, flowing to the western sea; seventy miles from the Mount Miyur fort. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  es: "Un gran río navegable por barcos y galeras, con pueblos y fortalezas a lo largo de sus orillas, que desemboca en el mar occidental; a setenta millas de la fortaleza del monte Miyur. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  fr: "Un grand fleuve, emprunté par des bateaux et des galères, bordé de villes et de forts, se jette dans la mer à l'ouest; à soixante-dix milles du fort du mont Miyur. {cite:nuzhat-al-mushtaq-2002 p. 726}"
  ur: "ایک بڑا دریا جو کشتیوں اور گلیوں کے ذریعے داخل ہوتا ہے، اس کے ساتھ شہر اور قلعے تھے، مغربی سمندر کی طرف بہتا تھا۔ کوہ میور قلعہ سے ستر میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 726}"
  tr: "Büyük bir nehre tekneler ve teknelerle girilir, üzerinde kasabalar ve kaleler bulunur ve batı denizine akar. Mont Muir kalesinden yetmiş mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 726}"
  id: "Sungai besar dimasuki oleh perahu dan perahu, dengan kota dan benteng di atasnya, dan mengalir ke laut barat. Jaraknya tujuh puluh mil dari benteng Mont Muir. {cite:nuzhat-al-mushtaq-2002 hlm. 726}"
