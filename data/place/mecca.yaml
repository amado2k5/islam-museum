summary:
  ar: "أقدس مدن الإسلام، تقع في الحجاز على بعد نحو 72 كيلومترًا من جدة، وفيها وُلد النبي محمد وتقوم الكعبة ويؤدى الحج السنوي. وتصفها دائرة المعارف الإسلامية مركزًا تجاريًّا تسيطر عليه قريش قبل الإسلام، ثم مدينة حكمها الأمويون والعباسيون والأشراف والعثمانيون، إلى أن ضمها عبد العزيز آل سعود سنة 1924. ويصف ابن بطوطة المسجد الحرام في عهده فيعد أبوابه العشرة وقبابه ومصاطبه، ويقيس المسافة بين الصفا والمروة بالخطوات، ويذكر دار الندوة التي جُعلت مسجدًا جامعًا مضافًا إلى الحرم {cite:rihla-ibn-battuta-1958 p. 85-88}. وتحفظ قاعدة البرديات العربية وثيقتين أُرسلتا من مكة إلى معارف تجاريين بالفسطاط، رسالة تجارية عن الحج بين ٩٠١–١٠٠٠م وأخرى تحية خاصة من الحج بين ١١٠١–١٢٠٠م {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  en: "The most sacred city of Islam, in the Hejaz about 72 km inland from Jeddah, where the Prophet Muhammad was born, the Kaaba stands and the annual Hajj is held. The Encyclopaedia of Islam presents it as a trading centre dominated by Quraysh before Islam, then a city ruled by Umayyads, Abbasids, sharifs and Ottomans until Abd al-Aziz Al Saud took it in 1924. Ibn Battuta describes the Sacred Mosque in his day, counting its ten gates, domes and porticoes, measuring the distance between al-Safa and al-Marwa in steps, and noting that Dar al-Nadwa was made a congregational mosque attached to the haram {cite:rihla-ibn-battuta-1958 p. 85-88}. The Arabic Papyrology Database preserves two paper documents sent from Mecca to business friends in Fustat, a business letter about the pilgrimage dated 901-1000 CE and a private greeting from the pilgrimage dated 1101-1200 CE {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  ur: "اسلام کا مقدس ترین شہر، حجاز میں جدہ سے تقریباً 72 کلومیٹر اندر، جہاں نبی محمد پیدا ہوئے، کعبہ ہے اور سالانہ حج ہوتا ہے۔ انسائیکلو پیڈیا آف اسلام اسے اسلام سے پہلے قریش کے زیر اثر تجارتی مرکز، پھر امویوں، عباسیوں، شریفوں اور عثمانیوں کے زیر حکومت شہر کے طور پر پیش کرتا ہے، یہاں تک کہ 1924 میں عبدالعزیز آل سعود نے اسے لے لیا۔ ابن بطوطہ اپنے زمانے کی مسجد حرام کا حال بیان کرتے ہیں، اس کے دس دروازے، گنبد اور چبوترے گنتے ہیں، صفا اور مروہ کا فاصلہ قدموں سے ناپتے ہیں، اور دار الندوہ کا ذکر کرتے ہیں جسے جامع مسجد بنا کر حرم سے ملا دیا گیا {cite:rihla-ibn-battuta-1958 p. 85-88}۔ عربی پیپیرولوجی ڈیٹابیس دو کاغذی دستاویزات محفوظ رکھتی ہے جو مکہ سے فسطاط میں تجارتی جاننے والوں کو بھیجی گئیں، حج کے بارے میں ایک تجارتی خط 901 تا 1000 عیسوی کا اور حج سے ایک نجی سلام 1101 تا 1200 عیسوی کا {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
