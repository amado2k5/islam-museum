label: { en: Mecca, ar: مكة المكرمة }
summary:
  ar: مدينة في الحجاز، مسقط رأس النبي محمد وموضع الكعبة ومقصد الحج السنوي. ويصف ابن بطوطة المسجد الحرام في عهده فيعد أبوابه العشرة وقبابه ومصاطبه، ويقيس المسافة بين الصفا والمروة بالخطوات، ويذكر دار الندوة التي جُعلت مسجداً جامعاً مضافاً إلى الحرم {cite:rihla-ibn-battuta-1958 p. 85-88}. وتحفظ قاعدة البرديات العربية وثيقتين أُرسلتا من مكة إلى معارف تجاريين بالفسطاط — رسالة تجارية عن الحج بين ٩٠١–١٠٠٠م وأخرى تحية خاصة من الحج بين ١١٠١–١٢٠٠م {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}
  en: City in the Hejaz, birthplace of the Prophet Muhammad and site of the Kaaba and the annual Hajj. Ibn Battuta describes the Sacred Mosque in his day, counting its ten gates, domes and porticoes, measuring the distance between al-Safa and al-Marwa in steps, and noting that Dar al-Nadwa was made a congregational mosque attached to the haram {cite:rihla-ibn-battuta-1958 p. 85-88}. The Arabic Papyrology Database preserves two paper documents sent from Mecca to business friends in Fustat — a business letter about the pilgrimage dated 901–1000 CE and a private greeting from the pilgrimage dated 1101–1200 CE {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}
