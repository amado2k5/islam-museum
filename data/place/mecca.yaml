summary:
  ar: "أقدس مدن الإسلام، تقع في الحجاز على بعد نحو 72 كيلومترًا من جدة، وفيها وُلد النبي محمد وتقوم الكعبة ويؤدى الحج السنوي. وتصفها دائرة المعارف الإسلامية مركزًا تجاريًّا تسيطر عليه قريش قبل الإسلام، ثم مدينة حكمها الأمويون والعباسيون والأشراف والعثمانيون، إلى أن ضمها عبد العزيز آل سعود سنة 1924. ويصف ابن بطوطة المسجد الحرام في عهده فيعد أبوابه العشرة وقبابه ومصاطبه، ويقيس المسافة بين الصفا والمروة بالخطوات، ويذكر دار الندوة التي جُعلت مسجدًا جامعًا مضافًا إلى الحرم {cite:rihla-ibn-battuta-1958 p. 85-88}. وتحفظ قاعدة البرديات العربية وثيقتين أُرسلتا من مكة إلى معارف تجاريين بالفسطاط، رسالة تجارية عن الحج بين ٩٠١–١٠٠٠م وأخرى تحية خاصة من الحج بين ١١٠١–١٢٠٠م {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  en: "The most sacred city of Islam, in the Hejaz about 72 km inland from Jeddah, where the Prophet Muhammad was born, the Kaaba stands and the annual Hajj is held. The Encyclopaedia of Islam presents it as a trading centre dominated by Quraysh before Islam, then a city ruled by Umayyads, Abbasids, sharifs and Ottomans until Abd al-Aziz Al Saud took it in 1924. Ibn Battuta describes the Sacred Mosque in his day, counting its ten gates, domes and porticoes, measuring the distance between al-Safa and al-Marwa in steps, and noting that Dar al-Nadwa was made a congregational mosque attached to the haram {cite:rihla-ibn-battuta-1958 p. 85-88}. The Arabic Papyrology Database preserves two paper documents sent from Mecca to business friends in Fustat, a business letter about the pilgrimage dated 901-1000 CE and a private greeting from the pilgrimage dated 1101-1200 CE {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  ur: "اسلام کا مقدس ترین شہر، حجاز میں جدہ سے تقریباً 72 کلومیٹر اندر، جہاں نبی محمد پیدا ہوئے، کعبہ ہے اور سالانہ حج ہوتا ہے۔ انسائیکلو پیڈیا آف اسلام اسے اسلام سے پہلے قریش کے زیر اثر تجارتی مرکز، پھر امویوں، عباسیوں، شریفوں اور عثمانیوں کے زیر حکومت شہر کے طور پر پیش کرتا ہے، یہاں تک کہ 1924 میں عبدالعزیز آل سعود نے اسے لے لیا۔ ابن بطوطہ اپنے زمانے کی مسجد حرام کا حال بیان کرتے ہیں، اس کے دس دروازے، گنبد اور چبوترے گنتے ہیں، صفا اور مروہ کا فاصلہ قدموں سے ناپتے ہیں، اور دار الندوہ کا ذکر کرتے ہیں جسے جامع مسجد بنا کر حرم سے ملا دیا گیا {cite:rihla-ibn-battuta-1958 p. 85-88}۔ عربی پیپیرولوجی ڈیٹابیس دو کاغذی دستاویزات محفوظ رکھتی ہے جو مکہ سے فسطاط میں تجارتی جاننے والوں کو بھیجی گئیں، حج کے بارے میں ایک تجارتی خط 901 تا 1000 عیسوی کا اور حج سے ایک نجی سلام 1101 تا 1200 عیسوی کا {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  es: "La ciudad más sagrada del Islam, en el Hiyaz, a unos 72 km tierra adentro de Yeda, donde nació el profeta Mahoma, se encuentra la Kaaba y se celebra el Hajj anual. La Enciclopedia del Islam la presenta como un centro comercial dominado por los Quraysh antes del Islam, luego una ciudad gobernada por los Omeyas, los Abasíes, los sharifs y los Otomanos hasta que Abd al-Aziz Al Saud la conquistó en 1924. Ibn Battuta describe la Mezquita Sagrada en su época, contando sus diez puertas, cúpulas y pórticos, midiendo la distancia entre al-Safa y al-Marwa en escalones, y señalando que Dar al-Nadwa se convirtió en una mezquita congregacional anexa al haram {cite:rihla-ibn-battuta-1958 p. 85-88}. La base de datos de papirología árabe conserva dos documentos en papel enviados desde La Meca a amigos comerciantes en Fustat: una carta comercial sobre la peregrinación fechada entre 901 y 1000 d. C. y un saludo privado de la peregrinación fechado entre 1101 y 1200 d. C. {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  fr: "La ville la plus sacrée de l'islam, située dans le Hedjaz à environ 72 km à l'intérieur des terres depuis Djeddah, est le lieu de naissance du prophète Mahomet. La Kaaba s'y dresse et le pèlerinage annuel du Hajj y est célébré. L'Encyclopédie de l'Islam la présente comme un centre commercial dominé par les Qurayshites avant l'islam, puis comme une ville successivement gouvernée par les Omeyyades, les Abbassides, les chérifs et les Ottomans jusqu'à sa conquête par Abd al-Aziz Al Saoud en 1924. Ibn Battuta décrit la Mosquée sacrée de son époque, comptant ses dix portes, ses dômes et ses portiques, mesurant la distance entre al-Safa et al-Marwa en degrés, et notant que Dar al-Nadwa fut transformée en mosquée du vendredi, rattachée au Haram (cite: Rihla Ibn Battuta, 1958, p. 85-88). La base de données de papyrologie arabe conserve deux documents papier envoyés de La Mecque à des partenaires commerciaux à Fustat: une lettre commerciale relative au pèlerinage, datée de 901-1000 apr. J.-C., et une lettre de vœux privée relative au pèlerinage, datée de 1101-1200 apr. J.-C. {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  tr: "İslam'ın en kutsal şehri, Cidde'ye yaklaşık 72 kilometre uzaklıkta, Hecde'de yer alır; burada Peygamber Muhammed'in doğduğu, Kabe'nin dik durduğu ve yıllık hac ziyaretinin yapıldığı yer vardır. İslami Ansiklopedi, burayı İslam'dan önce Kureyşlerin kontrolündeki bir ticaret merkezi olarak tanımlar; ardından Emeviyeler, Abbasiler, Eşrefler ve Osmanlılar tarafından yönetilen bir şehir olarak tanımlanır; 1924'te Abdulaziz Al Saud tarafından ilhak edilmiştir. İbn Battuta, kendi döneminde Büyük Camii'yi anlatır; on kapı, kubbe ve teras sayar, Safa ile Merve arasındaki mesafeyi adım adım ölçer ve Haram'a eklenen bir cemaat camisi haline gelen Dar al-Nadwa'dan bahseder {cite:rihla-ibn-battuta-1958, s. 85-88}. Arap Papirüs Veritabanı, Fustat'taki tüccar tanıdıklara Mekke'den gönderilen iki belgeyi korur: 901–1000 yılları arasında Hac hakkında bir ticari mektup ve 1101–1200 yılları arasında Hac'dan gelen başka bir özel selam. {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
  id: "Kota paling suci dalam Islam terletak di Hijaz, sekitar 72 kilometer dari Jeddah, tempat Nabi Muhammad lahir, Ka'bah berdiri tegak, dan ziarah tahunan dilakukan. Ensiklopedia Islam menggambarkannya sebagai pusat perdagangan yang dikuasai oleh Quraisy sebelum Islam, kemudian sebagai kota yang diperintah oleh Umayyah, Abbasiyah, Ashraf, dan Ottoman, hingga dianeksasi oleh Abdulaziz Al Saud pada tahun 1924. Ibn Battuta menggambarkan Masjid Agung pada masanya, menghitung sepuluh gerbang, kubah, dan terasnya, mengukur jarak antara Safa dan Marwah secara bertahap, serta menyebutkan Dar al-Nadwa, yang menjadi masjid jamaah yang ditambahkan ke Haram {cite:rihla-ibn-battuta-1958, hlm. 85-88}. Database Papirus Arab menyimpan dua dokumen yang dikirim dari Mekah kepada kenalan pedagang di Fustat: surat komersial tentang Haji antara tahun 901–1000 M dan salam khusus lain dari Haji antara tahun 1101–1200 M {cite:apd P.Vind.inv. A.Ch. 36581} {cite:apd P.Vind.inv. A.Ch. 10354}"
