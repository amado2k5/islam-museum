summary:
  ar: "مدينة على خور يصل إليها من مدينة قشمير، فيها حبوب وأرز كثير، وتبعد عن كنجه نحو ثلاثين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 192}"
  en: "A city on a creek reached from Qashmir, with much grain and rice, about thirty miles from Kanja. {cite:nuzhat-al-mushtaq-2002 p. 192}"
  es: "Una ciudad a orillas de un arroyo conectado con Qashmir, con abundante producción de grano y arroz, a unos treinta kilómetros de Kanja. {cite:nuzhat-al-mushtaq-2002 p. 192}"
  fr: "Une ville située sur un bras de mer venant du Qashmir, riche en céréales et en riz, à une cinquantaine de kilomètres de Kanja. {cite:nuzhat-al-mushtaq-2002 p. 192}"
  ur: "کنجا سے تقریباً تیس میل کے فاصلے پر ایک ندی پر واقع ایک شہر کشمیر سے پہنچا، جس میں بہت سا غلہ اور چاول تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 192}"
  tr: "Qishmir şehrinden ulaşılan bir dere üzerindeki şehir, burada bol miktarda tahıl ve pirinç bulunur ve Ganjah'a yaklaşık otuz mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 192}"
  id: "Sebuah kota di tepi sungai kecil yang dijangkau dari kota Qishmir, di mana terdapat banyak biji-bijian dan beras, dan berjarak sekitar tiga puluh mil dari Ganjah. {cite:nuzhat-al-mushtaq-2002 hlm. 192}"
