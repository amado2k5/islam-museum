summary:
  ar: "مدينة كبيرة على ضفة النيل الشمالية، ومجتمع تجارة السودان، وأهلها أهل بأس، وهي من عمالة التكروري. ومن أوليل إليها ست عشرة مرحلة، وإلى مجلماسة أربعون يوماً بسير القوافل {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  en: "A large city on the north bank of the Nile and a meeting point for Sudan trade, under the ruler of Takrur. Sixteen stages from Awlil, and forty days by caravan to Sijilmasa {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  es: "Una gran ciudad en la orilla norte del Nilo y punto de encuentro para el comercio con Sudán, bajo el dominio de Takrur. Dieciséis etapas desde Awlil, y cuarenta días en caravana hasta Sijilmasa {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  fr: "Une grande ville située sur la rive nord du Nil et un point de rencontre pour le commerce soudanais, sous le souverain de Takrur. Seize étapes depuis Awlil, et quarante jours en caravane jusqu'à Sijilmasa {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  ur: "دریائے نیل کے شمالی کنارے پر ایک بڑا شہر اور تکرور کے حکمران کے تحت سوڈان کی تجارت کا ایک مقام۔ اولیل سے سولہ مراحل، اور چالیس دن قافلہ سجلمسہ تک۔ 18-19}۔"
