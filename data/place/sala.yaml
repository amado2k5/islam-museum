  ar: "مدينة كبيرة على ضفة النيل الشمالية، ومجتمع تجارة السودان، وأهلها أهل بأس، وهي من عمالة التكروري. ومن أوليل إليها ست عشرة مرحلة، وإلى مجلماسة أربعون يوماً بسير القوافل {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
  en: "A large city on the north bank of the Nile and a meeting point for Sudan trade, under the ruler of Takrur. Sixteen stages from Awlil, and forty days by caravan to Sijilmasa {cite:nuzhat-al-mushtaq-2002 p. 18-19}."
