  ur: "اردن کا عظیم شہر، جیسا کہ ادریسی کہتے ہیں، یروشلم سے نوے میل اور ایکڑ سے دو نوری دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 363}"
