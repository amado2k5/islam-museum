summary:
  ar: "مدينة في غاية الحسن لكثرة مياهها، والماء يشق بساتينها، ولها من الكروم والأشجار ما لا مزيد عليه، وتبعد عن الحصن المعروف بالقبذاق ثمانية عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 571}"
  en: "A town of great beauty for its abundant water, which runs through its gardens; it has vineyards and trees beyond compare, eighteen miles from the fortress called al-Qabdhaq. {cite:nuzhat-al-mushtaq-2002 p. 571}"
  es: "Una ciudad de gran belleza por su abundante agua, que corre por sus jardines; posee viñedos y árboles incomparables, a dieciocho millas de la fortaleza llamada al-Qabdhaq. {cite:nuzhat-al-mushtaq-2002 p. 571}"
  fr: "Ville d'une grande beauté grâce à ses abondantes sources d'eau qui irriguent ses jardins, elle possède des vignobles et des arbres incomparables, à dix-huit milles de la forteresse d'al-Qabdhaq. {cite:nuzhat-al-mushtaq-2002 p. 571}"
  ur: "اس کے پرچر پانی کے لئے بہت خوبصورتی کا ایک شہر، جو اس کے باغات سے گزرتا ہے؛ اس میں انگور کے باغ اور درخت ہیں جو کہ القبدق نامی قلعے سے اٹھارہ میل دور ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 571}"
