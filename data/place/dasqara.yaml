summary:
  ar: "مدينة صغيرة بها نخيل وزروع، ويذكر الإدريسي أن بها بناء كان للملك، وسميت بالدسكرة لذلك. {cite:nuzhat-al-mushtaq-2002 p. 669}"
  en: "A small town with palms and crops; al-Idrisi says it has a royal building from which it takes its name. {cite:nuzhat-al-mushtaq-2002 p. 669}"
  es: "Un pequeño pueblo con palmeras y cultivos; al-Idrisi dice que tiene un edificio real del que toma su nombre. {cite:nuzhat-al-mushtaq-2002 p. 669}"
  fr: "Une petite ville entourée de palmiers et de cultures; al-Idrisi affirme qu'elle possède un bâtiment royal dont elle tire son nom. {cite:nuzhat-al-mushtaq-2002 p. 669}"
  ur: "کھجوروں اور فصلوں کے ساتھ ایک چھوٹا سا شہر؛ الادریسی کا کہنا ہے کہ اس کی ایک شاہی عمارت ہے جس سے یہ نام لیتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 669}"
  tr: "Palmiye ağaçları ve ürünlerle dolu küçük bir şehir; Al-Idrisi, bunun krala ait bir bina olduğunu, bunun için Daskra adını verdiğini belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 669}"
  id: "Sebuah kota kecil dengan pohon palem dan tanaman, dan Al-Idrisi menyebutkan bahwa itu adalah bangunan milik raja, dinamai Daskra untuk itu. {cite:Nuzhat-al-Mushtaq-2002 hlm. 669}"
