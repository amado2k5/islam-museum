summary:
  ar: "مدينة رخيصة الأسعار كثيرة اللحوم والعسل، يربى بها دود الحرير، ولها مسجد جامع وقصبة منيعة يرتقى إليها، ويتصل بها جبل كور، وتبعد عن بياسة عشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  en: "A city of low prices and plenty of meat and honey, where silkworms are raised; a great mosque and a strong citadel up the slope, linked to the mountain of Kur, twenty miles from Bayyasa. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  es: "Una ciudad de precios bajos y abundancia de carne y miel, donde se crían gusanos de seda; una gran mezquita y una sólida ciudadela en la ladera, unida al monte Kur, a treinta kilómetros de Bayyasa. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  fr: "Une ville aux prix bas, où la viande et le miel abondent, et où l'on élève des vers à soie; une grande mosquée et une citadelle imposante à flanc de colline, reliée au mont Kur, à une trentaine de kilomètres de Bayyasa. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  ur: "کم قیمتوں اور بکثرت گوشت اور شہد کا شہر، جہاں ریشم کے کیڑے پالے جاتے ہیں۔ ایک عظیم مسجد اور ڈھلوان کے اوپر ایک مضبوط قلعہ جو کہ Bayyasa سے بیس میل دور کر کے پہاڑ سے جڑا ہوا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 568}"
  tr: "Bol et ve bal olan, ipekböceklerinin yetiştirildiği ucuz bir şehir, büyük bir cami ve ona yükselen güçlü bir kasbah vardır, Kor Dağı'na bağlıdır ve Piasa'dan yirmi mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 568}"
  id: "Kota murah dengan banyak daging dan madu, tempat ulat sutra dibesarkan, memiliki masjid megah dan kasbah kuat yang menjulang ke sana, terhubung ke Gunung Kor, dan berjarak dua puluh mil dari Piasa. {cite:nuzhat-al-mushtaq-2002 hlm. 568}"
