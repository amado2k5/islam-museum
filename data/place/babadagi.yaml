summary:
  ar: "مدينة في الدوبروجة، اسمها مأخوذ من الدرويش ساري صالتيق، وفتحها بايزيد الأول، وهي اليوم في رومانيا {cite:encyclopaedia-of-islam-2 vol. 1 p. 899-900}."
  en: "A town in the Dobruja named after the dervish Sari Saltik, taken for the Ottomans by Bayezid I and now in Romania {cite:encyclopaedia-of-islam-2 vol. 1 p. 899-900}."
  es: "Una ciudad en Dobruja que lleva el nombre del derviche Sari Saltik, tomada para los otomanos por Bayezid I y ahora en Rumania {cite:encyclopaedia-of-islam-2 vol. 1 p. 899-900}."
  fr: "Une ville de Dobroudja nommée d'après le derviche Sari Saltik, prise pour les Ottomans par Bayezid I et maintenant en Roumanie {cite:encyclopaedia-of-islam-2 vol. 1 p. 899-900}."
  ur: "ڈوبروجا میں ایک قصبہ جس کا نام درویش ساری سالتک کے نام پر رکھا گیا تھا جسے بایزید اول نے عثمانیوں کے لیے لیا تھا اور اب رومانیہ میں {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 899-900}۔"
  tr: "Dobruca'da bir şehir olan şehir, adı Bayezid I tarafından fethedilen derviş Sari Saltik'ten alınmıştır ve bugün Romanya'da bulunmaktadır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 899-900}."
  id: "Sebuah kota di Dobruja, namanya diambil dari dervish Sari Saltik, yang ditaklukkan oleh Bayezid I, dan kini berada di Rumania {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 899-900}."
