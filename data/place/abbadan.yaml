summary:
  ar: "عبادان جزيرة البصرة وحصنها البحري؛ كانت قطيعة لحمران بن أبان مولى عثمان من عبد الملك بن مروان وهو من سبي عين التمر يدعي أنه من النمر بن قاسط فهدده الحجاج على لسان عباد بن الحصين الحبطي فوهب له حمران غربي النهر فنسبت إلى عباد؛ وكان أول من رابط بها عباد بن الحصين ثم حصنها الربيع بن صبح الفقيه مولى بني سعد ورابط فيها وخرج غازياً إلى الهند في البحر فمات فدفن في جزيرة من الجراثر سنة ١٦٠."
  en: "Abbadan, Basra's island and sea-fortress; it was Humran ibn Aban's qati'a from Abd al-Malik — one of the Ayn al-Tamr captives claiming Namir ibn Qasit descent — until al-Hajjaj's threat, conveyed by Abbas ibn al-Husayn al-Hibati, moved Humran to gift him the west bank, which took Abbas's name. Abbas first garrisoned it, then al-Rabi' ibn Sabih the jurist fortified and raided from it, sailed for India and died at sea — buried on a Jarathir island in 160h."
