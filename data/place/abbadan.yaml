label: { ar: "عبادان", en: "Abbadan", es: "Abadán", fr: "Abadan" }
summary:
  ar: "عبادان جزيرة البصرة وحصنها البحري؛ كانت قطيعة لحمران بن أبان مولى عثمان من عبد الملك بن مروان وهو من سبي عين التمر يدعي أنه من النمر بن قاسط فهدده الحجاج على لسان عباد بن الحصين الحبطي فوهب له حمران غربي النهر فنسبت إلى عباد؛ وكان أول من رابط بها عباد بن الحصين ثم حصنها الربيع بن صبح الفقيه مولى بني سعد ورابط فيها وخرج غازياً إلى الهند في البحر فمات فدفن في جزيرة من الجراثر سنة ١٦٠."
  en: "Abbadan, Basra's island and sea-fortress; it was Humran ibn Aban's qati'a from Abd al-Malik — one of the Ayn al-Tamr captives claiming Namir ibn Qasit descent — until al-Hajjaj's threat, conveyed by Abbas ibn al-Husayn al-Hibati, moved Humran to gift him the west bank, which took Abbas's name. Abbas first garrisoned it, then al-Rabi' ibn Sabih the jurist fortified and raided from it, sailed for India and died at sea — buried on a Jarathir island in 160h."
  es: "Abbadan, isla y fortaleza marítima de Basora; fue la qati'a de Humran ibn Aban, procedente de Abd al-Malik —uno de los cautivos de Ayn al-Tamr que afirmaban descender de Namir ibn Qasit— hasta que la amenaza de al-Hajjaj, transmitida por Abbas ibn al-Husayn al-Hibati, obligó a Humran a cederle la orilla oeste, que pasó a llamarse Abbas. Abbas la guarneció primero, luego el jurista al-Rabi' ibn Sabih la fortificó y saqueó desde ella, zarpó hacia la India y murió en el mar, siendo enterrado en una isla de Jarathir en el año 160 de la Hégira."
  fr: "Abbadan, île et forteresse maritime de Bassora, était la qati'a d'Humran ibn Aban, captive d'Abd al-Malik – l'un des captifs d'Ayn al-Tamr se réclamant de la descendance de Namir ibn Qasit – jusqu'à ce que la menace d'al-Hajjaj, transmise par Abbas ibn al-Husayn al-Hibati, contraigne Humran à lui offrir la rive ouest, qui prit le nom d'Abbas. Ce dernier y installa d'abord une garnison, puis le juriste al-Rabi' ibn Sabih la fortifia et y mena des raids, avant de faire voile vers l'Inde où il mourut en mer – enterré sur une île de Jarathir en 160 de l'Hégire."
