summary:
  ar: 'عند البلاذري: جزيرة في البحر غزاها أولاً معاوية بن حديج الكندي أيام معاوية بن أبي سفيان ولم تزل تُغزى بعد ذلك وفتح آل الأغلب بن سالم منها نيفاً وعشرين مدينة وهي في أيدي المسلمين.'
  en: 'In al-Baladhuri: an island in the sea first raided by Mu''awiya ibn Khudayj al-Kindi in Mu''awiya ibn Abi Sufyan''s days and raided ever since; the house of al-Aghlab ibn Salim opened over twenty of its cities, in Muslim hands.'
  es: "En al-Baladhuri: una isla en el mar asaltada por primera vez por Mu'awiya ibn Khudayj al-Kindi en tiempos de Mu'awiya ibn Abi Sufyan y asaltada desde entonces; la casa de al-Aghlab ibn Salim abrió más de veinte de sus ciudades a manos musulmanas."
  fr: "À al-Baladhuri: une île de la mer pillée pour la première fois par Mu'awiya ibn Khudayj al-Kindi à l'époque de Mu'awiya ibn Abi Sufyan et pillée depuis; la maison d'al-Aghlab ibn Salim a ouvert plus de vingt de ses villes, aux mains des musulmans."
  ur: "البلادوری میں ہے: سمندر کے ایک جزیرے پر سب سے پہلے معاویہ بن خدیج الکندی نے معاویہ ابن ابی سفیان کے زمانے میں چھاپہ مارا اور تب سے چھاپہ مارا۔ اغلب بن سلیم کا گھر مسلمانوں کے ہاتھوں اپنے بیس سے زائد شہروں کو کھول دیا گیا۔"
