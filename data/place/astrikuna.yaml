summary:
  ar: "قاعدة بلاد بوامية، وأعظمها وأوسعها عمارة وأكثرها بشرا، ويذكر المؤلف أنها دار المملكة ومقام ملوك بوامية {cite:nuzhat-al-mushtaq-2002 p. 877}."
  en: "The capital of the land of Bawāmiya, the largest and most populous of its cities, which the author calls the seat of the realm and of the kings of Bawāmiya {cite:nuzhat-al-mushtaq-2002 p. 877}."
  es: "La capital de la tierra de Bawāmiya, la más grande y poblada de sus ciudades, a la que el autor llama sede del reino y de los reyes de Bawāmiya {cite:nuzhat-al-mushtaq-2002 p. 877}."
  fr: "La capitale du pays de Bawāmiya, la plus grande et la plus peuplée de ses villes, que l'auteur appelle le siège du royaume et des rois de Bawāmiya {cite:nuzhat-al-mushtaq-2002 p. 877}."
  ur: "باوامیہ کی سرزمین کا دار الحکومت، اس کے شہروں میں سب سے بڑا اور سب سے زیادہ آبادی والا، جسے مصنف نے باوامیہ کے بادشاہوں اور بادشاہوں کا مرکز کہا ہے۔ 877}۔"
  tr: "Bawamiya topraklarının temeli, en büyük, en geniş mimari ve en kalabalık olanıdır. Yazar, buranın krallığın başkenti ve Bawamiya krallarının ikametgahı olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 877}."
  id: "Dasar tanah Bawamiya adalah yang terbesar, paling luas dalam arsitektur, dan paling padat penduduk. Penulis menyebutkan bahwa ini adalah ibu kota kerajaan dan kediaman raja-raja Bawamiya {cite:Nuzhat-al-Mushtaq-2002, hlm. 877}."
