label: { ar: "طنجة", en: "Tangier", es: "Tánger", fr: "Tanger", ur: "تانگیر" }
summary:
  ar: "طنجة مدينة المغرب الأقصى على البحر؛ فتحها موسى بن نصير في ولايته لإفريقية ونزلها وهو أول من نزلها واختطّ فيها للمسلمين، وكان سلطان بطريق إفريقية يمتد من أطرابلس إليها."
  en: "Tangier, the far-Maghreb city on the sea; Musa ibn Nusayr opened it in his governorship of Ifriqiya and settled it — the first to lodge there — laying out khittas for the Muslims; and the patrikios's sultanate of Ifriqiya had run from Tripoli to it."
  es: "Tánger, la ciudad del Magreb lejano a orillas del mar; Musa ibn Nusayr la abrió durante su gobierno de Ifriqiya y se estableció allí —el primero en alojarse allí— estableciendo khittas para los musulmanes; y el sultanato de los patricios de Ifriqiya había huido desde Trípoli hasta allí."
  fr: "Tanger, ville du Maghreb lointain située sur la mer; Musa ibn Nusayr l'a fondée lorsqu'il était gouverneur d'Ifriqiya et s'y est installé — le premier à y séjourner — en aménageant des khittas pour les musulmans; et le sultanat d'Ifriqiya des patrikios s'était étendu de Tripoli jusqu'à elle."
  ur: "تانگیر، سمندر پر دور مغرب کا شہر؛ موسیٰ بن نصیر نے اسے افریقیہ کی اپنی گورنری میں کھولا اور اسے آباد کیا - وہاں قیام کرنے والے پہلے شخص نے - مسلمانوں کے لیے کھٹّے بچھائے۔ اور سلطنت آفریقیہ کی سلطنت طرابلس سے اس تک پہنچی تھی۔"
