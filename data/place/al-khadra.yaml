  ur: "ایک چھوٹی سی ندی پر ایک قصبہ جس میں مسلسل عمارتیں اور انگور کے باغ ہیں، بازار اور حمام کے ساتھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 253}"
  tr: "Küçük bir nehir üzerinde bir şehir, bağlı binalar ve bağlarla birlikte, bir pazar ve bir hamama sahiptir. {kaynak:nuzhat-al-mushtaq-2002 s. 253}"
