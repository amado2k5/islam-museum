  ar: "نهر بالسواد؛ عند البلاذري حفره خالد بن عبد الله القسري فقال فيه الفرزدق «إن المبارك كاسمه يسقى به نهراً يفيض له على الأنهاد حرث السواد وناعم الجبار»."
  en: "A canal in the Sawad; in al-Baladhuri dug by Khalid ibn Abdallah al-Qasri, praised by al-Farazdaq: 'al-Mubarak, like its name, waters the Sawad's ploughland and the tyrant's lush domain.'"
  es: "Un canal en el Sawad; en al-Baladhuri, excavado por Khalid ibn Abdallah al-Qasri, elogiado por al-Farazdaq: «Al-Mubarak, como su nombre indica, riega las tierras de cultivo del Sawad y el exuberante dominio del tirano»."
  fr: "Un canal dans le Sawad; à al-Baladhuri, creusé par Khalid ibn Abdallah al-Qasri, loué par al-Farazdaq: « al-Mubarak, comme son nom l'indique, irrigue les terres labourées du Sawad et le domaine luxuriant du tyran. »"
  ur: "سواد میں ایک نہر؛ البلادوری میں خالد بن عبداللہ القسری نے کھودا ہے، جس کی الفرازدق نے تعریف کی ہے: 'المبارک، اپنے نام کی طرح، سواد کے ہل اور ظالم کے سرسبز و شاداب علاقے کو پانی دیتا ہے۔'"
