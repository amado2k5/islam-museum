  ar: "بلدة بأذربيجان قنطرة كقنطرتي وحش وأرشف اللتين اتخذتا أيام بابك؛ بناها مروان بن محمد وأحيا أرضها وحصنها فصارت ضيعة له ثم قبضت مع ضياع بني أمية لزبيدة أم جعفر فهدم وكلاؤها سورها ثم رمّ وجدد قريباً وبها عسكر الأفشين حيدر بن كاوس أيام محاربة بابك وحصنها."
  en: "An Azerbaijani bridge-town like the Wahsh and Arshaf bridges of Babak's days; Marwan ibn Muhammad built and revived it as his estate, it fell with the Umayyad seizures to Zubayda umm Ja'far whose agents razed the wall — lately rebuilt — and there al-Afshin Haydar ibn Kawus camped and fortified during the Babak war."
