  es: "Un lugar al que al-Hadi se retiró tras la derrota en Atwa en el año 290 de la Hégira y donde permaneció animando a Hamdan y llamando al pueblo a reunirse, hasta que lo abandonó para dirigirse a Sa'da al enterarse de lo sucedido en Jaftam."
