summary:
  ar: "موضع انصرف إليه الهادي بعد هزيمة أتوة سنة 290هـ فأقام به يستنهض همدان ويحشد الناس، ثم تركه إلى صعدة لما بلغه خبر جفتم."
  en: "A place to which al-Hadi withdrew after the rout at Atwa in 290 AH and where he stayed rousing Hamdan and calling the people to muster, until he left it for Sa'da on news of Jaftam."
