summary:
  ar: "مدينة متحضرة حسنة في أرض لبان، عليها أقاليم وقرى وعمارات؛ يذكر المؤلف أنها تبعد عن قنط بين الغرب والجنوب ثلاثين ميلا {cite:nuzhat-al-mushtaq-2002 p. 870}، وعن شنت مير خمسة عشر ميلا {cite:nuzhat-al-mushtaq-2002 p. 871}."
  en: "A well-built, civilised city in the land of Lubān with districts, villages and settlements; the author gives thirty miles from Ghent to the south-west {cite:nuzhat-al-mushtaq-2002 p. 870} and fifteen miles from Shant Mīr {cite:nuzhat-al-mushtaq-2002 p. 871}."
  es: "Una ciudad civilizada y bien construida en la tierra de Lubān con distritos, aldeas y asentamientos; el autor indica treinta millas desde Gante hacia el suroeste {cite:nuzhat-al-mushtaq-2002 p. 870} y quince millas desde Shant Mīr {cite:nuzhat-al-mushtaq-2002 p. 871}."
  fr: "Une ville bien construite et civilisée dans le pays de Lubān avec des quartiers, des villages et des agglomérations; l'auteur donne trente miles de Gand au sud-ouest {cite:nuzhat-al-mushtaq-2002 p. 870} et quinze miles de Shant Mīr {cite:nuzhat-al-mushtaq-2002 p. 871}."
  ur: "لبان کی سرزمین میں اضلاع، دیہات اور بستیوں کے ساتھ ایک اچھی طرح سے تعمیر شدہ، مہذب شہر؛ مصنف نے گھنٹ سے جنوب مغرب کی طرف تیس میل کا فاصلہ بیان کیا ہے۔ 870} اور شانت میر سے پندرہ میل {حوالہ: نزہت المشتاق-2002 ص 871}۔"
