summary:
  ar: "جبل به معادن الفضة، يمتد على ظهر الشعب الخصيب المعروف بدرفارد، وتبعد عنه جيرفت مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 442}"
  en: "A mountain with silver mines, running along the back of the fertile valley of Darfard, one stage from Jiruft. {cite:nuzhat-al-mushtaq-2002 p. 442}"
  es: "Una montaña con minas de plata, que se extiende a lo largo de la parte posterior del fértil valle de Darfard, a una etapa de Jiruft. {cite:nuzhat-al-mushtaq-2002 p. 442}"
  fr: "Une montagne aux mines d'argent, s'étendant le long de la fertile vallée de Darfard, à une étape de Jiruft. {cite:nuzhat-al-mushtaq-2002 p. 442}"
  ur: "ایک پہاڑ جس میں چاندی کی کانیں ہیں، دارفرد کی زرخیز وادی کے پیچھے، جیروفٹ سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 442}"
  tr: "Dervard olarak bilinen verimli vadide gümüş mineralleri bulunan bir dağ uzanır ve ondan bir adım uzaklıkta Gervath bulunur. {kaynak:nuzhat-al-mushtaq-2002 s. 442}"
  id: "Sebuah gunung dengan mineral perak membentang di sepanjang lembah subur yang dikenal sebagai Dervard, dan hanya selangkah darinya terdapat Gervath. {cite:Nuzhat-al-Mushtaq-2002 hlm. 442}"
