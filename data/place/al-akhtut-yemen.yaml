summary:
  ar: "موضع في اليمن نزل به الهادي في ربيع الأول 288هـ بعد ذمار، وقال الراوي إنه كان فاسداً لإقامة إبراهيم بن خلف فيه."
  en: "A place in Yemen where al-Hadi halted in Rabi I 288 AH after Dhamar, which the narrator calls corrupt because Ibrahim ibn Khalaf had lived there."
  ur: "یمن کی ایک جگہ جہاں ہادی ربیع الاول 288ھ میں ذمار کے بعد اترے، جسے راوی ابراہیم بن خلف کے وہاں رہنے کی وجہ سے فاسد کہتا ہے۔"
  es: "Un lugar en Yemen donde al-Hadi se detuvo en Rabi I del año 288 AH después de Dhamar, al que el narrador llama corrupto porque Ibrahim ibn Khalaf había vivido allí."
  fr: "Un lieu du Yémen où al-Hadi s'arrêta en Rabi I 288 AH après Dhamar, que le narrateur qualifie de corrompu parce qu'Ibrahim ibn Khalaf y avait vécu."
  tr: "Yemen'de, el-Hadi'nin Dhamar'dan sonra 288 H.Y. Rabi' al-Awwal'da yerleştiği bir yer; anlatıcı, İbrahim bin Halef'in orada yaşaması nedeniyle oranın bozulduğunu söylemiştir."
  id: "Sebuah tempat di Yaman tempat al-Hadi menetap di Rabi' al-Awwal 288 H setelah Dhamar, dan narator mengatakan tempat itu telah dirusak karena Ibrahim ibn Khalaf tinggal di sana."
