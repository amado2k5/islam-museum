summary:
  ar: "توتس من مدن إفريقية؛ فتحها زهير بن قيس البلوي في ولايته لإفريقية من قبل عبد العزيز بن مروان ثم انصرف إلى برقة فاستُشهد في لقائه روماً نزلوا من مراكبهم وقبورهم تدعى قبور الشهداء."
  en: "Tutus, a town of Ifriqiya; Zuhayr ibn Qays al-Balawi opened it in his governorship for Abd al-Aziz ibn Marwan, then turned back to Barqa where he was martyred meeting Romans landed from their ships — their graves being called Qubur al-Shuhada."
  es: "Tutus, una ciudad de Ifriqiya; Zuhayr ibn Qays al-Balawi la abrió durante su gobierno para Abd al-Aziz ibn Marwan, luego regresó a Barqa donde fue martirizado al encontrarse con romanos que desembarcaron de sus barcos; sus tumbas se llaman Qubur al-Shuhada."
  fr: "Tutus, une ville d'Ifriqiya; Zuhayr ibn Qays al-Balawi l'ouvrit dans son gouvernorat pour Abd al-Aziz ibn Marwan, puis retourna à Barqa où il fut martyrisé en rencontrant des Romains débarqués de leurs navires — leurs tombes étant appelées Qubur al-Shuhada."
