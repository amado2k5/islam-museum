label:
  en: Granada
  ar: غرناطة
summary:
  en: "City in the high valley of the Genil in southern al-Andalus. It displaced nearby Elvira when the Zirids made it their capital in the early eleventh century, passed to the Almoravids and Almohads, and from 635/1238 to 897/1492 was the capital of the Nasrid kingdom, the last Muslim state in Spain, and the seat of the Alhambra."
  ar: "مدينة في أعالي وادي شنيل في جنوب الأندلس. حلت محل إلبيرة القريبة حين اتخذها بنو زيري عاصمة في أوائل القرن الخامس الهجري، ثم آلت إلى المرابطين والموحدين، وكانت من سنة 635هـ/1238م إلى سنة 897هـ/1492م عاصمة مملكة بني نصر، آخر دول المسلمين في إسبانيا، وفيها الحمراء."
  ur: "جنوبی اندلس میں دریائے شنیل کی بالائی وادی کا شہر۔ پانچویں صدی ہجری کے اوائل میں بنو زیری نے اسے دارالحکومت بنایا تو اس نے قریبی البیرہ کی جگہ لے لی، پھر مرابطین اور موحدین کے پاس گیا، اور 635ھ/1238ء سے 897ھ/1492ء تک بنو نصر کی مملکت کا دارالحکومت رہا، جو سپین میں مسلمانوں کی آخری ریاست تھی، اور یہیں الحمراء ہے۔"
