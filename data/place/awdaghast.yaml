summary:
  ar: "مدينة صغيرة في صحراء قليلة الماء، بين جبلين، ويصفها المؤلف بأنها شبيهة بمكة في شكلها، وتجارتها ضعيفة، ويعيش أهلها على الإبل، وذكر المؤلف أن الطريق منها إلى غانة اثنتا عشرة مرحلة، وإلى وارقلان إحدى وثلاثون، وإلى جرمة نحو خمس وعشرين {cite:nuzhat-al-mushtaq-2002 p. 108}."
  en: "A small city in a dry desert, set between two hills, which the author compares in shape to Mecca. Its trade is weak and its people live from camels. He gives twelve stages to Ghana, thirty-one to Wargla and about twenty-five to Jarma {cite:nuzhat-al-mushtaq-2002 p. 108}."
  es: "Una pequeña ciudad en un desierto árido, situada entre dos colinas, cuya forma el autor compara con la de La Meca. Su comercio es escaso y sus habitantes viven de los camellos. Le atribuye doce etapas a Ghana, treinta y una a Wargla y unas veinticinco a Jarma {cite:nuzhat-al-mushtaq-2002 p. 108}."
  fr: "Une petite ville située dans un désert aride, entre deux collines, dont l'auteur compare la forme à celle de La Mecque. Son commerce est rudimentaire et ses habitants vivent de l'élevage à dos de chameau. Il attribue douze étapes à Ghana, trente et une à Wargla et environ vingt-cinq à Jarma (voir: Nuzhat al-Mushtaq, 2002, p. 108)."
  ur: "خشک ریگستان میں ایک چھوٹا سا شہر، جو دو پہاڑیوں کے درمیان واقع ہے، جس کا مصنف مکہ سے موازنہ کرتا ہے۔ اس کی تجارت کمزور ہے اور اس کے لوگ اونٹوں سے گزارہ کرتے ہیں۔ وہ گھانا کو بارہ، وارگلہ کو اکتیس اور جرما کو تقریباً پچیس مراحل بتاتا ہے۔ 108}۔"
  tr: "Yazarın Mekke'ye benzeyen, zayıf ticarete sahip ve halkı develerle geçindiği, seyrek sulu bir çölde yer alan küçük bir şehirdir. Yazar, oradan Gana'ya giden yolun on iki aşama, Waraqlan'a otuz bir ve Jarmah'a yaklaşık yirmi beş aşama olduğunu belirtmiştir {cite:nuzhat-al-mushtaq-2002, s. 108}."
  id: "Sebuah kota kecil di gurun yang jarang air, di antara dua gunung, yang oleh penulis digambarkan mirip dengan Mekah, dengan perdagangan yang lemah, dan penduduknya hidup dengan unta. Penulis menyebutkan bahwa rute dari sana ke Ghana adalah dua belas tahap, ke Waraqlan tiga puluh satu, dan ke Jarmah sekitar dua puluh lima {cite:nuzhat-al-mushtaq-2002, hlm. 108}."
