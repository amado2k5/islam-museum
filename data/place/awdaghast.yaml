summary:
  ar: "مدينة صغيرة في صحراء قليلة الماء، بين جبلين، ويصفها المؤلف بأنها شبيهة بمكة في شكلها، وتجارتها ضعيفة، ويعيش أهلها على الإبل، وذكر المؤلف أن الطريق منها إلى غانة اثنتا عشرة مرحلة، وإلى وارقلان إحدى وثلاثون، وإلى جرمة نحو خمس وعشرين {cite:nuzhat-al-mushtaq-2002 p. 108}."
  en: "A small city in a dry desert, set between two hills, which the author compares in shape to Mecca. Its trade is weak and its people live from camels. He gives twelve stages to Ghana, thirty-one to Wargla and about twenty-five to Jarma {cite:nuzhat-al-mushtaq-2002 p. 108}."
