summary:
  ar: "مدينة صغيرة يُعمل فيها ثياب حسنة يُتجهز بها إلى الآفاق، وفيها صناع كثيرون وتجار يقصدونها، وتبعد عن الموضع السابق عشرة أميال. {cite:nuzhat-al-mushtaq-2002 p. 339}"
  en: "A small town where fine cloth is made for export, with many craftsmen and merchants; ten miles from the previous point on the river. {cite:nuzhat-al-mushtaq-2002 p. 339}"
  es: "Un pequeño pueblo donde se confeccionan telas finas para la exportación, con numerosos artesanos y comerciantes; a diez millas del punto anterior en el río. {cite:nuzhat-al-mushtaq-2002 p. 339}"
  fr: "Une petite ville où l'on fabrique des tissus fins destinés à l'exportation, avec de nombreux artisans et marchands; à dix milles du point précédent sur la rivière. {cite:nuzhat-al-mushtaq-2002 p. 339}"
  ur: "ایک چھوٹا سا شہر جہاں بہت سے کاریگر اور تاجروں کے ساتھ برآمد کے لیے باریک کپڑا بنایا جاتا ہے۔ دریا پر پچھلے نقطہ سے دس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 339}"
  tr: "Ufka hazırlanmak için ince giysiler dikildiği, birçok zanaatkâr ve tüccarın buraya geldiği küçük bir kasaba; önceki konumundan on mil uzakta. {cite:nuzhat-al-mushtaq-2002 s. 339}"
  id: "Sebuah kota kecil di mana pakaian mewah dibuat untuk mempersiapkan cakrawala, dan banyak pengrajin serta pedagang datang ke sana, dan lokasinya sepuluh mil dari lokasi sebelumnya. {cite:nuzhat-al-mushtaq-2002 hlm. 339}"
