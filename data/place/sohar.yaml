summary:
  ar: "مدينة على ضفة البحر الفارسي، من أكثر مدن عمان أموالاً قديماً وحديثاً، يقصدها التجار، ويُجلب إليها بضائع اليمن. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  en: "A city on the shore of the Gulf, among the wealthiest in Oman both in the past and in al-Idrisi's day; merchants visit it and the goods of Yemen are brought there. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  es: "Una ciudad a orillas del Golfo, una de las más ricas de Omán tanto en el pasado como en la época de al-Idrisi; los comerciantes la visitan y allí se traen las mercancías de Yemen. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  fr: "Ville située sur la rive du Golfe, parmi les plus riches d'Oman, tant par le passé qu'à l'époque d'al-Idrisi; les marchands s'y rendent et les marchandises du Yémen y sont acheminées. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  ur: "خلیج کے ساحل پر واقع ایک شہر، ماضی میں اور ادریسی کے زمانے میں عمان کے امیر ترین لوگوں میں سے ایک شہر؛ یہاں کے تاجر آتے ہیں اور یمن کا سامان وہاں لایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 156}"
  tr: "Basra Denizi kıyısında yer alan bir şehir, Umman'ın hem antik hem de modern en zengin şehirlerinden biri, Yemenli malları getiren tüccarlar tarafından ziyaret edilir. {kaynak:nuzhat-al-mushtaq-2002 s. 156}"
  id: "Sebuah kota di tepi Laut Persia, salah satu kota terkaya di Oman, baik yang kuno maupun modern, dikunjungi oleh para pedagang yang membawa barang-barang Yaman ke sana. {cite:Nuzhat-al-Mushtaq-2002 hlm. 156}"
