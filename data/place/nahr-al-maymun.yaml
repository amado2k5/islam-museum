  en: "A Sawad canal; in al-Baladhuri first dug by Sa'id ibn Zayd, agent of Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, its mouth at a village called Qaryat Maymun — redirected under al-Wathiq by Umar ibn Faraj al-Rukhji — named al-Maymun lest the name of felicity be lost from it."
