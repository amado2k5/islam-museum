label: { ar: "نهر الميمون", en: "Nahr al-Maymun", es: "Nahr al-Maymun", fr: "Nahr al-Maymun", ur: "نہر المیمون", tr: "Al-Maimun Nehri", id: "Sungai Al-Maimun" }
summary:
  ar: "نهر بالسواد؛ عند البلاذري أول من حفره وكيل لأم جعفر زبيدة بنت جعفر بن المنصور يقال له سعيد بن زيد وكانت فوهته عند قرية تدعى قرية ميمون فحولت في أيام الواثق على يدي عمر بن فرج الرخجي وسمي الميمون لئلا يسقط عنه ذكر اليمن."
  en: "A Sawad canal; in al-Baladhuri first dug by Sa'id ibn Zayd, agent of Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, its mouth at a village called Qaryat Maymun — redirected under al-Wathiq by Umar ibn Faraj al-Rukhji — named al-Maymun lest the name of felicity be lost from it."
  es: "Un canal Sawad; en al-Baladhuri excavado por primera vez por Sa'id ibn Zayd, agente de Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, su desembocadura en una aldea llamada Qaryat Maymun -redireccionada bajo al-Wathiq por Umar ibn Faraj al-Rukhji- llamada al-Maymun para que no se pierda el nombre de felicidad."
  fr: "Un canal Sawad; à al-Baladhuri, creusé pour la première fois par Sa'id ibn Zayd, agent d'Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, son embouchure dans un village appelé Qaryat Maymun — redirigé sous al-Wathiq par Umar ibn Faraj al-Rukhji — nommé al-Maymun de peur que le nom de félicité n'en soit perdu."
  ur: "ایک سواد نہر؛ البلادوری میں سب سے پہلے سعید ابن زید نے کھودا، جو ام جعفر زبیدہ بنت جعفر ابن المنصور کے ایجنٹ تھے، اس کا منہ قریت میمون نامی گاؤں میں تھا - جسے عمر بن فراج الرخجی نے الواثق کے تحت ری ڈائریکٹ کیا تھا - المیمون کا نام رکھا گیا تھا کہ کہیں اس سے خوشی کا نام نہ نکل جائے۔"
  tr: "Siyah renkli bir nehir; Al-Baladhuri'ye göre, ilk kazan Um Ja'far Zubaydah bint Ja'far ibn al-Mansur'un ajanı olan Saeed ibn Zayd'dı. Ağzı Maimun adlı bir köyün yakınındaydı, ancak al-Wathiq döneminde Umar ibn Faraj al-Rukhji tarafından taşındı ve Yemen'in adı atlanmasın diye el-Maymun olarak adlandırıldı."
  id: "Sebuah sungai berwarna hitam; menurut Al-Baladhuri, yang pertama menggali sungai itu adalah seorang agen untuk um Ja'far Zubaydah bint Ja'far ibn al-Mansur, bernama Saeed ibn Zayd. Muaranya dekat dengan sebuah desa bernama Maimun, tetapi dipindahkan pada masa al-Wathiq oleh Umar ibn Faraj al-Rukhji, dan ia dinamai al-Maymun agar tidak disebutkan Yaman."
