summary:
  ar: "خاخيط بلدة بأعمال أرمينية؛ أسكنها مروان بن محمد عشرة آلاف أهل بيت من الصقالبة سباهم من أرض الخزر فقتلوا أميرهم وهربوا فلحقهم وقتلهم."
  en: "Khakhit, a town of Armenia's district; Marwan ibn Muhammad settled there ten thousand households of Slavs he had carried off from the Khazar land — who then killed their amir and fled, and he overtook and slew them."
  es: "Khakhit, una ciudad del distrito de Armenia; Marwan ibn Muhammad asentó allí a diez mil familias de eslavos que había traído de la tierra jázara, quienes luego mataron a su emir y huyeron, y él los alcanzó y los mató."
  fr: "Khakhit, une ville du district d'Arménie; Marwan ibn Muhammad y installa dix mille familles de Slaves qu'il avait emmenées du pays khazar — qui tuèrent ensuite leur émir et s'enfuirent, et il les rattrapa et les tua."
  ur: "خاخیت، آرمینیا کے ضلع کا ایک قصبہ؛ مروان بن محمد نے وہاں غلاموں کے دس ہزار گھرانوں کو آباد کیا جو اس نے خزر کی سرزمین سے نکالے تھے - جنہوں نے پھر ان کے امیر کو قتل کر دیا اور فرار ہو گئے اور اس نے ان کو پکڑ کر قتل کر دیا۔"
  tr: "Khahit, Ermeni kolonilerinde bir kasabadır; Mervan ibn Muhammed, Hazarlardan alınan on bin Slav aşireti tarafından yerleşilmiş, emirlerini öldürmüş, kaçmış ve ardından peşlerinden giderek öldürmüştür."
  id: "Khakhit adalah sebuah kota di koloni Armenia; Marwan ibn Muhammad dihuni oleh sepuluh ribu klan Slavia yang ditangkap dari Khazar, membunuh emir mereka, melarikan diri, lalu mengejar dan membunuh mereka."
