summary:
  ar: "مدينة الحكم التي أنشأها أحمد بن طولون عند سفح جبل المقطم بجوار الفسطاط على مثال سامراء، فيها جامعه وقصره وميدانه، ودُمّرت سنة 905م إلا الجامع {cite:yeomans-islamic-cairo-2006 p.29} {cite:yeomans-islamic-cairo-2006 p.41}."
  en: "The seat of government Ahmad ibn Tulun laid out at the foot of the Muqattam beside Fustat on the model of Samarra, with his mosque, palace and hippodrome; destroyed in 905 except for the mosque {cite:yeomans-islamic-cairo-2006 p.29} {cite:yeomans-islamic-cairo-2006 p.41}."
  es: "La sede del gobierno que Ahmad ibn Tulun estableció al pie del Muqattam junto a Fustat, siguiendo el modelo de Samarra, con su mezquita, palacio e hipódromo; destruida en 905 excepto la mezquita {cite:yeomans-islamic-cairo-2006 p.29} {cite:yeomans-islamic-cairo-2006 p.41}."
  fr: "Le siège du gouvernement d'Ahmad ibn Tulun, situé au pied du Muqattam, près de Fustat, sur le modèle de Samarra, avec sa mosquée, son palais et son hippodrome; détruit en 905, à l'exception de la mosquée {cite:yeomans-islamic-cairo-2006 p.29} {cite:yeomans-islamic-cairo-2006 p.41}."
  ur: "احمد بن طولون کی حکومت کی نشست مقطم کے دامن میں سامرا کے ماڈل پر فوستات کے ساتھ اس کی مسجد، محل اور ہپوڈروم کے ساتھ رکھی گئی تھی۔ مسجد کے علاوہ 905 میں تباہ کر دیا گیا {حوالہ:یومان-اسلامی-قاہرہ-2006 صفحہ 29}"
  tr: "Ahmad ibn Tulun tarafından Fustat'ın yanındaki Mokattam Dağı'nın eteğinde kurulan ve Samarra'dan esinlenen yönetim şehri, bir cami, saray ve meydan içerir ve 905 yılında yıkılmıştır, ancak cami hariç {cite:yeomans-islamic-cairo-2006 s.29} {cite:yeomans-islamic-cairo-2006 s.41} bulunmaktadır."
  id: "Kota pemerintahan yang didirikan oleh Ahmad ibn Tulun di kaki Gunung Mokattam di sebelah Fustat, yang dimodelkan dari Samarra, memiliki masjid, istana, dan alun-alun, dan dihancurkan pada tahun 905 M kecuali masjid {cite:yeomans-islamic-cairo-2006 hlm.29} {cite:yeomans-islamic-cairo-2006 hlm.41}."
