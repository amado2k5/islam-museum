summary:
  ar: 'عند البلاذري: جزيرة غزاها جنادة ثم فتح بعضها في زمن الوليد فأُغلقت وغزاها حميد بن معيوف في خلافة الرشيد ففتح بعضها ثم أتم فتحها أبو حفص عمر بن عيسى الأندلسي الإقريطشي في خلافة المأمون حتى لم يبق فيها من الروم أحد وأخرب حصونهم.'
  en: 'In al-Baladhuri: an island raided by Janada, partly opened in al-Walid''s time then closed; Humayd ibn Ma''yuf opened part under al-Rashid, and Abu Hafs Umar ibn Isa al-Andalusi al-Iqritishi completed its conquest under al-Ma''mun until no Romans remained and he ruined their fortresses.'
  es: "En al-Baladhuri: una isla saqueada por Janada, parcialmente abierta en tiempos de al-Walid y luego cerrada; Humayd ibn Ma'yuf abrió parte bajo al-Rashid, y Abu Hafs Umar ibn Isa al-Andalusi al-Iqritishi completó su conquista bajo al-Ma'mun hasta que no quedaron romanos y arruinó sus fortalezas."
  fr: "À al-Baladhuri: une île pillée par Janada, partiellement ouverte à l'époque d'al-Walid puis fermée; Humayd ibn Ma'yuf en ouvrit une partie sous al-Rashid, et Abu Hafs Umar ibn Isa al-Andalusi al-Iqritishi acheva sa conquête sous al-Ma'mun jusqu'à ce qu'il ne reste plus aucun Romain et qu'il ruine leurs forteresses."
  ur: "البلادوری میں: ایک جزیرہ پر جنادا نے حملہ کیا، جو الولید کے زمانے میں جزوی طور پر کھولا گیا پھر بند کر دیا گیا۔ حمید ابن مایوف نے الرشید کے ماتحت حصہ کھولا اور ابو حفص عمر بن عیسیٰ الاندلسی العقریتشی نے المامون کے ماتحت اپنی فتح مکمل کی یہاں تک کہ رومی باقی نہ رہے اور اس نے ان کے قلعوں کو تباہ کردیا۔"
