  en: "In al-Baladhuri: an island raided by Janada, partly opened in al-Walid's time then closed; Humayd ibn Ma'yuf opened part under al-Rashid, and Abu Hafs Umar ibn Isa al-Andalusi al-Iqritishi completed its conquest under al-Ma'mun until no Romans remained and he ruined their fortresses."
