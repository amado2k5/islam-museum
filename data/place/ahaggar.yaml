summary:
  ar: "هضبة جبلية في الصحراء الجزائرية الوسطى، تسمى باسم قبيلة الكل أهقار من التوارق التي تحكمها، وخضعت للسيطرة الفرنسية بعد بعثة فلاتر وحملة فورو لامي والتعامل مع الأمينوكال سنة 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
  en: "A mountain massif of the central Algerian Sahara, named after the Kel Ahaggar Tuareg confederacy that ruled it. It was visited by the Flatters mission (1880) and the Foureau-Lamy expedition (1898), and placed under French control after dealings with its amenokal and Laperrine in 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
