label: { ar: "الهقار", en: "Ahaggar (Hoggar)", es: "Ahaggar (Hoggar)", fr: "Ahaggar (Hoggar)", ur: "احگر ⁦(ہوگر)⁩", tr: "Al, Haggar", id: "Al, Haggar" }
summary:
  ar: "هضبة جبلية في الصحراء الجزائرية الوسطى، تسمى باسم قبيلة الكل أهقار من التوارق التي تحكمها، وخضعت للسيطرة الفرنسية بعد بعثة فلاتر وحملة فورو لامي والتعامل مع الأمينوكال سنة 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
  en: "A mountain massif of the central Algerian Sahara, named after the Kel Ahaggar Tuareg confederacy that ruled it. It was visited by the Flatters mission (1880) and the Foureau-Lamy expedition (1898), and placed under French control after dealings with its amenokal and Laperrine in 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
  es: "Un macizo montañoso del Sahara argelino central, que recibe su nombre de la confederación tuareg Kel Ahaggar que lo gobernaba. Fue visitado por la misión Flatters (1880) y la expedición Foureau-Lamy (1898), y puesto bajo control francés tras negociaciones con su amenokal y Laperrine en 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
  fr: "Massif montagneux du Sahara algérien central, il tire son nom de la confédération touareg Kel Ahaggar qui le gouvernait. Il fut visité par la mission Flatters (1880) et l'expédition Foureau-Lamy (1898), et placé sous contrôle français après des négociations avec son amenokal et Laperrine en 1904 {cite:encyclopaedia-of-islam-2 vol. 1 p. 277}."
  ur: "وسطی الجزائر صحارا کا ایک پہاڑی ماسیف، جس کا نام کیل احگر تواریگ کنفیڈریسی کے نام پر رکھا گیا جس نے اس پر حکومت کی۔ اس کا دورہ فلیٹرز مشن (1880) اور Foureau-Lamy مہم (1898) نے کیا تھا، اور 1904 میں اس کے امینوکل اور Laperrine کے ساتھ معاملات کرنے کے بعد اسے فرانسیسی کنٹرول میں رکھا گیا تھا۔ 1 ص۔ 277}۔"
  tr: "Orta Cezayir çölünde, Tuareglerin Kul Ahagar kabilesinden adını alan dağlık bir plato, Flutter seferi, Forou Lami seferi ve Aminocal ile ilgili 1904 sonrası Fransız kontrolüne geçti {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 277}."
  id: "Sebuah dataran tinggi pegunungan di gurun tengah Aljazair, yang dinamai menurut suku Kul Ahagar dari suku Tuareg yang memerintahnya, berada di bawah kendali Prancis setelah ekspedisi Flutter, kampanye Forou Lami, dan menangani Aminocal pada tahun 1904 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 277}."
