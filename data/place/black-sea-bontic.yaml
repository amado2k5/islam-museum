summary:
  ar: "بحر خليجي كبير يتصل بالبحر المظلم، تطل عليه بلاد هرقل والبنطيم والخزرية والقمانية والروسية، ومبدؤه من جوار القسطنطينة {cite:nuzhat-al-mushtaq-2002 p. 905}."
  en: "A large gulf-like sea joined to the Dark Sea, bordered by the lands of Heraclius, the Bentim, the Khazars, the Qumans and the Rus, beginning near Constantinople {cite:nuzhat-al-mushtaq-2002 p. 905}."
  es: "Un gran mar con forma de golfo unido al Mar Oscuro, bordeado por las tierras de Heraclio, los Bentim, los jázaros, los Qumanos y los Rus, comenzando cerca de Constantinopla {cite:nuzhat-al-mushtaq-2002 p. 905}."
  fr: "Une grande mer semblable à un golfe reliée à la Mer Sombre, bordée par les terres d'Héraclius, des Bentim, des Khazars, des Qumans et des Rus, commençant près de Constantinople {cite:nuzhat-al-mushtaq-2002 p. 905}."
  ur: "ایک بڑا خلیج جیسا سمندر بحیرہ تاریک سے مل گیا، جس کی سرحدیں ہیراکلئس، بینٹیم، خزر، قمان اور روس کی سرزمینوں سے ملتی ہیں، قسطنطنیہ کے قریب سے شروع ہوتی ہیں۔ 905}۔"
  tr: "Karanlık Deniz'e bağlı büyük bir Körfez denizi, Herakleios, Pontifum, Hazarlar, Kamanidler ve Ruslar toprakları tarafından gözetlenir ve kökeni Konstantinopolis yakınlarındadır {cite:Nuzhat-al-Mushtaq-2002, s. 905}."
  id: "Sebuah laut Teluk yang luas terhubung ke Laut Gelap, diawasi oleh tanah Heraclius, Pontifum, Khazar, Qamanid, dan Rusia, dan asalnya dekat Konstantinopel {cite:Nuzhat-al-Mushtaq-2002, hlm. 905}."
