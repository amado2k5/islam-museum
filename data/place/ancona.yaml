summary:
  ar: "مدينة كبيرة من قواعد إقليم، على نهر أزموم، وتبعد عن البحر تسعة أميال، وفيها سوق ومراكب. {cite:nuzhat-al-mushtaq-2002 p. 753}"
  en: "A large city of a district on the Azmum river, nine miles from the sea, with a market and ships. {cite:nuzhat-al-mushtaq-2002 p. 753}"
