  fr: "Une grande ville d'un district situé sur le fleuve Azmum, à neuf milles de la mer, avec un marché et des navires. {cite:nuzhat-al-mushtaq-2002 p. 753}"
  ur: "دریائے ازمم پر ایک ضلع کا ایک بڑا شہر، سمندر سے نو میل دور، بازار اور بحری جہاز۔ {حوالہ: نزہت المشتاق-2002 ص۔ 753}"
  tr: "Bölgenin eteğinde, Azum Nehri kıyısında, denizden dokuz mil uzaklıkta büyük bir şehirdir ve pazarı ile tekneleri vardır. {kaynak:nuzhat-al-mushtaq-2002 s. 753}"
  id: "Sebuah kota besar di kaki wilayah, di Sungai Azu, sembilan mil dari laut, dan memiliki pasar serta perahu. {cite:nuzhat-al-mushtaq-2002 hlm. 753}"
