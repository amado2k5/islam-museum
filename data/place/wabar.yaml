label: { ar: "أرض وبار", en: "The land of Wabar" }
summary:
  ar: "الأرض المعروفة برمل عالج التي نزلها وبار بن أميم وقومه فأهلكوا ببغيهم، وعند الأخباريين كانت أخصب بلاد الله وأكثرها شجراً وأطيبها ثمراً وعنباً وثخلاً وموزاً، وكانت الجن تسكن ديارهم وتحميها من كل من قصدها من الإنس فإن دنا أحد حثت في وجهه التراب وسفت عليه سوافي الرمل وأثارت الزوابع وربما خبلته وتيهته أو قتلته، وليس بها اليوم إلا الجن والإبل الوحشية التي ضربت فيها فحول الجن فالوحشية من نسل إبل الجن وضربت فيها العبدية والعسجدية والعمانية، وهذا الموضع عند كثير من ذوي الحجى باطل {cite:muruj-al-dhahab p. 456-457}."
  en: "The lost land in the sands of 'Alij where Wabar's people perished — in the tellers' account once earth's most fertile ground, then guarded by jinn who hurl sand and whirlwinds at intruders and sire the wild-camel herds upon their camels, though al-Mas'udi notes sober men call it vain {cite:muruj-al-dhahab p. 456-457}."
