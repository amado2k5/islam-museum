label: { ar: "أرض وبار", en: "The land of Wabar", es: "La tierra de Wabar", fr: "Le pays de Wabar" }
summary:
  ar: "الأرض المعروفة برمل عالج التي نزلها وبار بن أميم وقومه فأهلكوا ببغيهم، وعند الأخباريين كانت أخصب بلاد الله وأكثرها شجراً وأطيبها ثمراً وعنباً وثخلاً وموزاً، وكانت الجن تسكن ديارهم وتحميها من كل من قصدها من الإنس فإن دنا أحد حثت في وجهه التراب وسفت عليه سوافي الرمل وأثارت الزوابع وربما خبلته وتيهته أو قتلته، وليس بها اليوم إلا الجن والإبل الوحشية التي ضربت فيها فحول الجن فالوحشية من نسل إبل الجن وضربت فيها العبدية والعسجدية والعمانية، وهذا الموضع عند كثير من ذوي الحجى باطل {cite:muruj-al-dhahab p. 456-457}."
  en: "The lost land in the sands of 'Alij where Wabar's people perished — in the tellers' account once earth's most fertile ground, then guarded by jinn who hurl sand and whirlwinds at intruders and sire the wild-camel herds upon their camels, though al-Mas'udi notes sober men call it vain {cite:muruj-al-dhahab p. 456-457}."
  es: "La tierra perdida en las arenas de 'Alij donde pereció el pueblo de Wabar, según el relato de los narradores, fue una vez el terreno más fértil de la tierra, luego custodiado por genios que arrojan arena y torbellinos a los intrusos y engendran manadas de camellos salvajes sobre sus camellos, aunque al-Mas'udi señala que los hombres sobrios lo consideran vano {cite:muruj-al-dhahab p. 456-457}."
  fr: "La terre perdue dans les sables d'Alij où le peuple de Wabar a péri — selon le récit des conteurs, autrefois la terre la plus fertile de la terre, alors gardée par des djinns qui jettent du sable et des tourbillons sur les intrus et engendrent les troupeaux de chameaux sauvages sur leurs chameaux, bien qu'al-Mas'udi note que les hommes sobres la qualifient de vaine {cite:muruj-al-dhahab p. 456-457}."
