label:
  ar: "أنهلواره (باتن)"
  en: "Anhalwara (Patan, Gujarat)"
summary:
  ar: "مدينة في غجرات على ضفاف السرسوتي، كانت عاصمة إقليم غجرات الإسلامي من سنة 699هـ (1299م) إلى 816هـ (1413م)، حين جعل أحمد شاه أحمد آباد عاصمته، وكانت قبل ذلك عاصمة سلالة تشاوكيا-سولنكي الهندوسية {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  en: "A city of Gujarat on the Saraswati, capital of the Muslim province of Gujarat from 699/1299 to 816/1413, when Ahmad Shah made Ahmadabad his capital; before that it was the capital of the Hindu Chaulukya-Solanki dynasty {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
