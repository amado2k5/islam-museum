label:
  ar: "أنهلواره ⁦(باتن)⁩"
  en: "Anhalwara (Patan, Gujarat)"
  es: "Anhalwara (Patan, Gujarat)"
  fr: "Anhalwara (Patan, Gujarat)"
  ur: "انہلواڑہ ⁦(پٹن، گجرات)⁩"
summary:
  ar: "مدينة في غجرات على ضفاف السرسوتي، كانت عاصمة إقليم غجرات الإسلامي من سنة 699هـ ⁦(1299م)⁩ إلى 816هـ ⁦(1413م)⁩، حين جعل أحمد شاه أحمد آباد عاصمته، وكانت قبل ذلك عاصمة سلالة تشاوكيا-سولنكي الهندوسية {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  en: "A city of Gujarat on the Saraswati, capital of the Muslim province of Gujarat from 699/1299 to 816/1413, when Ahmad Shah made Ahmadabad his capital; before that it was the capital of the Hindu Chaulukya-Solanki dynasty {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  es: "Ciudad de Gujarat en el Saraswati, capital de la provincia musulmana de Gujarat desde 699/1299 hasta 816/1413, cuando Ahmad Shah convirtió a Ahmadabad en su capital; antes de eso fue la capital de la dinastía hindú Chaulukya-Solanki {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  fr: "Une ville du Gujarat sur la Saraswati, capitale de la province musulmane du Gujarat de 699/1299 à 816/1413, lorsque Ahmad Shah fit d'Ahmadabad sa capitale; avant cela, c'était la capitale de la dynastie hindoue Chaulukya-Solanki {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  ur: "699/1299 سے 816/1413 تک مسلم صوبہ گجرات کے دارالحکومت سرسوتی پر گجرات کا ایک شہر، جب احمد شاہ نے احمد آباد کو اپنا دارالحکومت بنایا۔ اس سے پہلے یہ ہندو چلوکیا-سولنکی خاندان کا دارالحکومت تھا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 530}۔"
