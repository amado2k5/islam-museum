summary:
  ar: "مدينة كبيرة عامرة كثيرة الأهل، أهلها أهل صناعات، ولها مزارع وأقاليم متصلة، ويذكر المؤلف أنها تبعد عن أيلوغيس شرقا خمسين ميلا {cite:nuzhat-al-mushtaq-2002 p. 895}."
  en: "A large, populous city whose people are craftsmen, with farms and connected districts; the author gives fifty miles east of Aylūghīs {cite:nuzhat-al-mushtaq-2002 p. 895}."
  es: "Una ciudad grande y populosa cuyos habitantes son artesanos, con granjas y distritos conectados; el autor indica cincuenta millas al este de Aylūghīs {cite:nuzhat-al-mushtaq-2002 p. 895}."
  fr: "Une grande ville peuplée dont les habitants sont des artisans, avec des fermes et des quartiers reliés; l'auteur indique cinquante miles à l'est d'Aylūghīs {cite:nuzhat-al-mushtaq-2002 p. 895}."
  ur: "ایک بڑا، آبادی والا شہر جس کے لوگ کاریگر ہیں، کھیت اور منسلک اضلاع کے ساتھ؛ مصنف نے عیالوی سے پچاس میل مشرق کی طرف اشارہ کیا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 895}۔"
  tr: "Büyük, hareketli ve çok sayıda insanın bulunduğu bir şehir; halkı sanayici, çiftlikleri ve bağlı eyaletleri var. Yazar, Aylogis'in elli mil doğusunda olduğunu belirtiyor {cite:nuzhat-al-mushtaq-2002, s. 895}."
  id: "Kota besar dan ramai dengan banyak penduduk, penduduknya adalah para industrialis, memiliki pertanian dan provinsi yang terhubung. Penulis menyebutkan bahwa kota ini berjarak lima puluh mil sebelah timur Aylogis {cite:nuzhat-al-mushtaq-2002, hlm. 895}."
