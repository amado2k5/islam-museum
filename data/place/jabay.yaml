summary:
  ar: "مدينة مشتبكة العمارة بالنخل وقصب السكر، وفيها خصب وغلة، ويبعد عن الباسيان اثني عشر ميلاً، وعن سليمانان خمسة عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 399}"
  en: "A town densely built among palms and sugar cane, rich in produce, twelve miles from Basyan and fifteen from Sulaymanan. {cite:nuzhat-al-mushtaq-2002 p. 399}"
  es: "Un pueblo densamente poblado de palmeras y caña de azúcar, rico en productos agrícolas, situado a doce millas de Basyan y a quince de Sulaymanan. {cite:nuzhat-al-mushtaq-2002 p. 399}"
  fr: "Une ville densément bâtie au milieu de palmiers et de canne à sucre, riche en produits agricoles, à douze milles de Basyan et à quinze de Sulaymanan. {cite:nuzhat-al-mushtaq-2002 p. 399}"
  ur: "کھجوروں اور گنے کے درمیان ایک گنجان آباد بستی، پیداوار سے مالا مال، باسیان سے بارہ میل اور سلیمان سے پندرہ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 399}"
  tr: "Şehir, palmiye ağaçları ve şeker kamışı ile iç içe geçmiş, verimli ve bol bir yere sahiptir; Al-Basyan'a on iki mil, Süleymanan'a ise on beş mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 399}"
  id: "Kota ini berjalin erat dengan pohon palem dan tebu, subur dan melimpah, serta berjarak dua belas mil dari Al-Basyan dan lima belas mil dari Suleimanan. {cite:nuzhat-al-mushtaq-2002 hlm. 399}"
