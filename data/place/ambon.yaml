summary:
  ar: "أمبون، جزيرة في جزر الملوك في إندونيسيا، نحو نصف سكانها مسلمون، وخاصة في شمالها، وكان الإسلام قد دخل إلى «هيتو» قبل وصول البرتغاليين سنة 1512م {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  en: "Ambon, an island of the Moluccas in Indonesia, where nearly half the population (about 25,000) is Muslim, especially in the north. Islam had reached Hitu, a supply station for the East Javanese spice trade, before the Portuguese arrived in 1512 {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
