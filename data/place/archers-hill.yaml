summary:
  ar: تلة تقع جنوب شرق معسكر المسلمين في أحد، كلف النبي خمسين رامياً بحمايتها لمنع التفاف فرسان المشركين.
  en: A hill southeast of the Muslim camp at Uhud, where the Prophet stationed fifty archers to prevent the Meccan cavalry from flanking them.
  es: "Una colina al sureste del campamento musulmán de Uhud, donde el Profeta apostó cincuenta arqueros para impedir que la caballería de La Meca los flanqueara."
  fr: "Une colline au sud-est du camp musulman d'Uhud, où le Prophète avait posté cinquante archers pour empêcher la cavalerie mecquoise de les prendre à revers."
  ur: "احد میں مسلمانوں کے کیمپ کے جنوب مشرق میں ایک پہاڑی، جہاں نبی نے پچاس تیر اندازوں کو تعینات کیا تاکہ مکہ کے گھڑ سواروں کو ان کے ساتھ لگنے سے روکا جا سکے۔"
  tr: "Müslüman kampının güneydoğusunda Uhud'da yer alan bir tepe, Peygamber'in çok tanrılı süvarilerin etrafını sarmasını önlemek için elli okçunu koruması için görevlendirdi."
  id: "Sebuah bukit yang terletak di tenggara perkemahan Muslim di Uhud, yang ditugaskan oleh Nabi untuk melindungi lima puluh pemanah guna mencegah para penunggang kuda politeis mengepung."
