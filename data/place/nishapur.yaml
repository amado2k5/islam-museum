summary:
  ar: "مدينة في خراسان بشمال شرق إيران، ومدينتها أبرشهر من كور خراسان؛ كانت مركزًا مهمًّا لعلم الحديث، ويُنسب إليها الإمام مسلم صاحب الصحيح. حصرها عبد الله بن عامر أشهراً فطلب صاحب أحد أرباعها الأمان فأدخل المسلمين ليلاً فتحصن مرزبانها في القهندز ثم صالح عن جميعها على ألف ألف درهم ويقال سبعمائة ألف، ووليها قيس بن الهيثم السلمي، ومن روساطيقها زام وباخرز وجوين وبيهق وبشت ورخ وخواف وأرغيان {cite:futuh-buldan-maarif-1407}. وعند المسعودي أن زرادشت بن أسبيمان اتخذ بها بيتاً للنيران في جملة بيوت النار {cite:muruj-al-dhahab p. 548}. وعند المقدسي: لا نظير لريباس نيسابور ولا لهريس أهلها، وبرستاقها معدن الفيروزج، وفيها مجلس المظالم كل أحد وأربعاء بحضرة صاحب الجيش ومجلس الحكم بمسجد رجاء لا يرى في الإسلام مثله {cite:ahsan-al-taqasim pp. 247-248}."
  en: A city in Khurasan in northeastern Iran; it was an important centre of hadith scholarship, and Imam Muslim, author of the Sahih, is ascribed to it.
