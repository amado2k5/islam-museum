    ar: "نيسابور مدينة أبرشهر في خراسان، كانت مركزاً لعلم الحديث يُنسب إليها الإمام مسلم صاحب الصحيح."
    en: "Nishapur, the city of Abarshahr in Khurasan, was a centre of hadith scholarship — Imam Muslim, author of the Sahih, takes his nisba from it."
