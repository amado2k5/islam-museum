summary:
  ar: نيسابور مدينة في خراسان بشمال شرق إيران، وهي عند دائرة المعارف الإسلامية أهم مدن خراسان الكبرى الأربع في العصور الوسطى، وعاصمة ولاية أبرشهر. فتحها عبد الله بن عامر سنة 30هـ أو 31هـ، وصارت عاصمة الطاهريين ثم من حواضر السامانيين، وكانت مركزاً لعلم الحديث ومنبتاً لعلماء كبار، ويُنسب إليها الإمام مسلم صاحب الصحيح. نهبها الغز سنة 548هـ ثم المغول سنة 618هـ/1221م، وتراجعت بعد ذلك ببطء.
  en: A city in Khurasan in north-eastern Iran, ranked by the Encyclopaedia of Islam as the most important of the four great cities of Khurasan in the Middle Ages and capital of the province of Abarshahr. Abd Allah ibn Amir took it in 30 or 31 AH; it became the Tahirid capital and a prosperous Samanid city, a centre of hadith scholarship and home to many notable scholars, and Imam Muslim, author of the Sahih, is ascribed to it. The Ghuzz sacked it in 548 AH and the Mongols in 618 AH, 1221 CE, after which it declined slowly.
  ur: نیشاپور خراسان میں، ایران کے شمال مشرق میں واقع ایک شہر ہے، جسے انسائیکلوپیڈیا آف اسلام قرونِ وسطیٰ میں خراسان کے چار بڑے شہروں میں سب سے اہم اور ابرشہر کے صوبے کا دارالحکومت قرار دیتا ہے۔ عبداللہ بن عامر نے اسے 30ھ یا 31ھ میں لیا، یہ طاہریوں کا دارالحکومت اور سامانیوں کے دور میں خوش حال شہر بنا، علمِ حدیث کا مرکز اور بڑے علما کا وطن رہا، اور امام مسلم، صاحبِ صحیح، اسی کی طرف منسوب ہیں۔ غزوں نے 548ھ میں اور منگولوں نے 618ھ/1221ء میں اسے لوٹا، جس کے بعد یہ آہستہ آہستہ زوال پذیر ہوا۔
