summary:
  ar: "مدينة في خراسان بشمال شرق إيران، كانت مركزًا مهمًّا لعلم الحديث، ويُنسب إليها الإمام مسلم صاحب الصحيح. وعند المقدسي: لا نظير لريباس نيسابور ولا لهريس أهلها، وبرستاقها معدن الفيروزج، وفيها مجلس المظالم كل أحد وأربعاء بحضرة صاحب الجيش ومجلس الحكم بمسجد رجاء لا يرى في الإسلام مثله {cite:ahsan-al-taqasim pp. 247-248}."
  en: A city in Khurasan in northeastern Iran; it was an important centre of hadith scholarship, and Imam Muslim, author of the Sahih, is ascribed to it.
