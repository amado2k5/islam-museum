  ur: "الاجانہ، بصرہ سے تین فرسخ کے فاصلے پر دجلۃ الاورہ چینل کے کنارے پر وسیع طاس - جہاں سے ابو موسی نے نہر ابلہ شروع کی تھی۔"
  tr: "El-İcanah, Basra'nın aşağısında yer alan Dicle Diğli Nehri kıyısında uzanan geniş bir kanyudur. İslam öncesi dönemde buraya El-İjanah denirken, Araplar da Basra'dan üç farsakhı kapsayan El-Karzan derdi. Buradan Abu Musa, Abla Nehri'ni kazmaya başladı."
  id: "Al-Ijanah adalah sebuah ngarai luas di sepanjang tepi Sungai Tigris Tigris, yang terletak di bawah Basra. Dulu disebut Al-Ijanah pada era pra-Islam, dan orang Arab menyebutnya Al-Qassara, yang mencakup tiga farsakh dari Basra. Dari sana, Abu Musa mulai menggali Sungai Abla."
