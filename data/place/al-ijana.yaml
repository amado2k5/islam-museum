summary:
  ar: "الإجانة غورة وسعة على حد خور دجلة العوراء مما يلي البصرة سمتها الجاهلية الإجانة وسمته العرب في الإسلام الجزارة على ثلاثة فراسخ من البصرة ومنه ابتدأ أبو موسى حفر نهر الأبلة."
  en: "al-Ijana, the wide basin at the Dijlat al-Awra channel's edge three farsakhs from Basra — Jahiliyya named it, Islam's Arabs called it al-Jazara — where Abu Musa began the Ubulla canal."
  es: "Al-Ijana, la amplia dársena en el borde del canal Dijlat al-Awra, a tres farsakhs de Basora, donde Abu Musa comenzó la construcción del canal Ubulla."
