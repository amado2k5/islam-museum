label: { ar: "دار ابن يوسف بمكة", en: "The house of Ibn Yusuf at Mecca" }
summary:
  ar: "الدار بمكة التي كان فيها مولد النبي لثمان خلون من ربيع الأول، وقد كان قدوم أصحاب الفيل مكة يوم الاثنين لثلاث عشرة ليلة بقيت من المحرم وكان مولده بعد قدومهم بخمسين يوماً في سنة ثمانمائة واثنتين وثمانين من عهد ذي القرنين ومائتين وست عشرة من تاريخ العرب الذي أوله حجة الغدر وسنة أربعين من ملك أنوشروان، ثم بعد ذلك بنتها الخيزران أم الهادي والرشيد مسجداً {cite:muruj-al-dhahab p. 571}."
  en: "The Meccan house where the Prophet was born on 8 Rabi' I — fifty days after the Elephant men's arrival — later made a mosque by al-Khayzuran, mother of al-Hadi and al-Rashid {cite:muruj-al-dhahab p. 571}."
