label: { ar: "دار ابن يوسف بمكة", en: "The house of Ibn Yusuf at Mecca", es: "La casa de Ibn Yusuf en La Meca", fr: "La maison d'Ibn Yusuf à La Mecque", ur: "مکہ میں ابن یوسف کا گھر" }
summary:
  ar: "الدار بمكة التي كان فيها مولد النبي لثمان خلون من ربيع الأول، وقد كان قدوم أصحاب الفيل مكة يوم الاثنين لثلاث عشرة ليلة بقيت من المحرم وكان مولده بعد قدومهم بخمسين يوماً في سنة ثمانمائة واثنتين وثمانين من عهد ذي القرنين ومائتين وست عشرة من تاريخ العرب الذي أوله حجة الغدر وسنة أربعين من ملك أنوشروان، ثم بعد ذلك بنتها الخيزران أم الهادي والرشيد مسجداً {cite:muruj-al-dhahab p. 571}."
  en: "The Meccan house where the Prophet was born on 8 Rabi' I — fifty days after the Elephant men's arrival — later made a mosque by al-Khayzuran, mother of al-Hadi and al-Rashid {cite:muruj-al-dhahab p. 571}."
  es: "La casa de La Meca donde nació el Profeta el 8 de Rabi' I —cincuenta días después de la llegada de los Hombres Elefante— fue convertida más tarde en mezquita por al-Khayzuran, madre de al-Hadi y al-Rashid {cite:muruj-al-dhahab p. 571}."
  fr: "La maison mecquoise où le Prophète est né le 8 Rabi' I — cinquante jours après l'arrivée des hommes à l'éléphant — a ensuite été transformée en mosquée par al-Khayzuran, mère d'al-Hadi et d'al-Rashid {cite:muruj-al-dhahab p. 571}."
  ur: "مکہ کے وہ گھر جہاں نبی کریم 8 ربیع الثانی کو پیدا ہوئے تھے - ہاتھیوں کی آمد کے پچاس دن بعد - بعد میں الہادی اور الرشید کی والدہ الخیزوران نے اسے مسجد بنایا۔ 571}۔"
