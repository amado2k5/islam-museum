summary:
  ar: "موضع بالشام؛ يؤرّخ ابن إسحاق به مقتل عبد الله بن سفيان المخزومي وسعيد بن الحارث السهمي بقوله «عام اليرموك» في خلافة عمر. وكانت ديار ملوك غسان باليرموك والجولان وغيرهما من غوطة دمشق وأعمالها {cite:muruj-al-dhahab p. 427}"
  en: A place in al-Sham; Ibn Ishaq dates the deaths of Abdullah ibn Sufyan al-Makhzumi and Sa'id ibn al-Harith al-Sahmi to it with the phrase 'the year of the Yarmuk', in Umar's caliphate.
