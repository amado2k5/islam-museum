summary:
  ar: "موضع بالشام؛ يؤرّخ ابن إسحاق به مقتل عبد الله بن سفيان المخزومي وسعيد بن الحارث السهمي بقوله «عام اليرموك» في خلافة عمر. وكانت ديار ملوك غسان باليرموك والجولان وغيرهما من غوطة دمشق وأعمالها {cite:muruj-al-dhahab p. 427}"
  en: A place in al-Sham; Ibn Ishaq dates the deaths of Abdullah ibn Sufyan al-Makhzumi and Sa'id ibn al-Harith al-Sahmi to it with the phrase 'the year of the Yarmuk', in Umar's caliphate.
  es: "Un lugar en al-Sham; Ibn Ishaq fecha las muertes de Abdullah ibn Sufyan al-Makhzumi y Sa'id ibn al-Harith al-Sahmi en este lugar con la frase 'el año del Yarmuk', en el califato de Umar."
  fr: "Un lieu du Levant; Ibn Ishaq situe la mort d'Abdullah ibn Sufyan al-Makhzumi et de Sa'id ibn al-Harith al-Sahmi à cet endroit, avec l'expression « l'année du Yarmouk », sous le califat d'Umar."
  ur: "الشام میں ایک جگہ؛ ابن اسحاق نے عمر کی خلافت میں عبداللہ بن سفیان المخزومی اور سعید بن حارث الصہمی کی موت کو 'یرموک کا سال' کے فقرے سے نقل کیا ہے۔"
