summary:
  ar: "جزيرة في الخليج، عرضها نحو تسعة أميال، وأهلها من الشراة الإباضية، ويراها من يمر بها جبال اليمن. {cite:nuzhat-al-mushtaq-2002 p. 164}"
  en: "An island in the Gulf about nine miles across, whose people are Ibadi Kharijis, and from which the mountains of Yemen can be seen. {cite:nuzhat-al-mushtaq-2002 p. 164}"
  es: "Una isla en el Golfo de aproximadamente nueve millas de ancho, cuyos habitantes son ibadíes jariyíes, y desde la cual se pueden ver las montañas de Yemen. {cite:nuzhat-al-mushtaq-2002 p. 164}"
  fr: "Une île du golfe d'environ neuf milles de diamètre, peuplée de Kharijites ibadites, et d'où l'on peut apercevoir les montagnes du Yémen. {cite:nuzhat-al-mushtaq-2002 p. 164}"
  ur: "خلیج میں تقریباً نو میل کا ایک جزیرہ جس کے لوگ عبادی خارجی ہیں اور جہاں سے یمن کے پہاڑ نظر آتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 164}"
  tr: "Körfez'de yaklaşık dokuz mil genişliğinde bir ada ve sakinleri İbadi Şerat'tır; buradan geçenler Yemen dağlarında da görebilirler. {kaynak:nuzhat-al-mushtaq-2002 s. 164}"
  id: "Sebuah pulau di Teluk, selebar sekitar sembilan mil, dan penduduknya adalah Ibadi Sharat, dan siapa pun yang melaluinya dapat melihatnya di pegunungan Yaman. {cite:Nuzhat-al-Mushtaq-2002 hlm. 164}"
