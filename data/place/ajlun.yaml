label: { ar: "عجلون", en: "Ajlun" }
summary:
  ar: "إقليم جبلي في شرق الأردن، بين اليرموك والحماد ووادي الزرقاء والغور، يقابل جلعاد القديمة؛ بنى فيه أسامة بن منقذ حصن عجلون في عهد الملك العادل، وصار في العصر المملوكي من أقضية دمشق {cite:encyclopaedia-of-islam-2 vol. 1 p. 227}."
  en: "A mountainous district of Transjordan, between the Yarmuk, the Hamad, the Wadi al-Zarqa' and the Ghawr, partly the old Gilead. The amir Izz al-Din Usama built the fortress Kal'at 'Ajlun on land granted by al-Malik al-'Adil, and in the Mamluk period it was a district of Damascus {cite:encyclopaedia-of-islam-2 vol. 1 p. 227}."
