summary:
  ar: "وادٍ في نفود، من أشد الأودية التي تشق الحافة الغربية لجُرف طويق شمالًا، يجري بقوة عند الأمطار، ويفصل بين منطقة سُدَيْر شمالًا ومنطقة المحمل جنوبًا. فيه آبار حفر العتك العذبة، وهي أكثر من عشرة آبار مبطنة بالحجارة، وكان الرحّل يجتمعون عليها في الصيف {cite:encyclopaedia-of-islam-2 vol. 1 p. 796}."
  en: "A valley in Nadid, one of the largest cutting through the western wall of the Tuwayk escarpment. It is a true wadi, flooding strongly when rain falls, and divides the district of Sudayr to the north from al-Mahmal to the south. Its sweet-water wells, Hafar al-'Atk, number over a dozen, all lined with stone, and several thousand Bedouins may gather there in summer {cite:encyclopaedia-of-islam-2 vol. 1 p. 796}."
