summary:
  ar: "وادٍ في نفود، من أشد الأودية التي تشق الحافة الغربية لجُرف طويق شمالًا، يجري بقوة عند الأمطار، ويفصل بين منطقة سُدَيْر شمالًا ومنطقة المحمل جنوبًا. فيه آبار حفر العتك العذبة، وهي أكثر من عشرة آبار مبطنة بالحجارة، وكان الرحّل يجتمعون عليها في الصيف {cite:encyclopaedia-of-islam-2 vol. 1 p. 796}."
  en: "A valley in Nadid, one of the largest cutting through the western wall of the Tuwayk escarpment. It is a true wadi, flooding strongly when rain falls, and divides the district of Sudayr to the north from al-Mahmal to the south. Its sweet-water wells, Hafar al-'Atk, number over a dozen, all lined with stone, and several thousand Bedouins may gather there in summer {cite:encyclopaedia-of-islam-2 vol. 1 p. 796}."
  es: "Un valle en Nadid, uno de los más grandes que atraviesan la pared occidental del escarpe de Tuwayk. Es un verdadero uadi, que se inunda con fuerza cuando llueve, y divide el distrito de Sudayr al norte de al-Mahmal al sur. Sus pozos de agua dulce, Hafar al-'Atk, son más de una docena, todos revestidos de piedra, y varios miles de beduinos pueden reunirse allí en verano {cite:encyclopaedia-of-islam-2 vol. 1 p. 796}."
  fr: "Une vallée de Nadid, l'une des plus vastes, qui entaille la paroi ouest de l'escarpement de Tuwayk. Véritable oued, elle est sujette à de fortes crues lors des pluies et sépare le district de Sudayr au nord de celui d'al-Mahmal au sud. Ses puits d'eau douce, les Hafar al-'Atk, sont au nombre d'une douzaine, tous revêtus de pierre, et plusieurs milliers de Bédouins peuvent s'y rassembler en été (voir: Encyclopaedia of Islam, vol. 1, p. 796)."
  ur: "نادید کی ایک وادی، جو تووک کے اسکارپمنٹ کی مغربی دیوار سے گزرنے والی سب سے بڑی وادی میں سے ایک ہے۔ یہ ایک حقیقی وادی ہے، جب بارش ہوتی ہے تو شدید سیلاب آتا ہے، اور ضلع سودیر کو شمال میں المحمل سے جنوب میں تقسیم کرتا ہے۔ اس کے میٹھے پانی کے کنویں، حفر العطک، ایک درجن سے زیادہ ہیں، سبھی پتھروں سے جڑے ہوئے ہیں، اور کئی ہزار بدو موسم گرما میں وہاں جمع ہو سکتے ہیں۔ 1 ص۔ 796}۔"
  tr: "Nafud'da bir vadi, Tuwaiq uçurumunun batı kenarını kuzeyde kesen, yağışlarda güçlü bir şekilde akan en güçlü vadilerden biridir ve kuzeydeki Sudair bölgesini güneydeki Mahmal bölgesinden ayırır. Al-Atsabah'ın taze kuyularını içerir; bu kuyular taşlarla kaplı ondan fazla kuyudan oluşur ve göçebelerin yazın burada toplandığı {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 796}."
  id: "Lembah di Nafud, salah satu lembah terkuat yang membelah tepi barat tebing Tuwaiq di utara, mengalir deras saat hujan, memisahkan daerah Sudair di utara dari daerah Mahmal di selatan. Lembah ini berisi sumur segar Al-Atsabah, yang terdiri dari lebih dari sepuluh sumur yang dilapisi batu, tempat para nomaden biasa berkumpul di musim panas {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 796}."
