label: { ar: "برغونية الإفرنجيين", en: "Burgundy of the Franks", es: "Borgoña de los francos", fr: "Bourgogne des Francs", ur: "فرانکس کی برگنڈی", tr: "Frankların Burgonya'sı", id: "Burgundy milik bangsa Franka" }
summary:
  ar: "أرض كثيرة القرى والمزارع، أهلها رجال حروب وأرباب همم، وسلاطينها أكبر السلاطين، ويتصل بها إقليم برغونية اللمانيين، ويحيط بها جبل منت جون. {cite:nuzhat-al-mushtaq-2002 p. 743}"
  en: "A land of many villages and farms, whose people are warriors and men of spirit and whose rulers are the greatest of rulers; it adjoins the Burgundy of the Lombards and is ringed by Mont Jun. {cite:nuzhat-al-mushtaq-2002 p. 743}"
  es: "Una tierra de muchos pueblos y granjas, cuyos habitantes son guerreros y hombres de espíritu, y cuyos gobernantes son los más grandes entre los gobernantes; limita con la Borgoña de los lombardos y está rodeada por el Mont Jun. {cite:nuzhat-al-mushtaq-2002 p. 743}"
  fr: "Terre de nombreux villages et fermes, peuplée de guerriers et d'hommes de courage, et dont les souverains sont les plus grands des souverains; elle jouxte la Bourgogne des Lombards et est entourée par le Mont Jun. {cite:nuzhat-al-mushtaq-2002 p. 743}"
  ur: "بہت سے گاؤں اور کھیتوں کی سرزمین، جس کے لوگ جنگجو اور روح پرست ہیں اور جن کے حکمران سب سے بڑے حکمران ہیں۔ یہ لومبارڈز کے برگنڈی سے ملحق ہے اور اسے مونٹ جون نے رنگ دیا ہے۔ 743}"
  tr: "Burası birçok köy ve çiftliğe sahip, sakinleri savaşçılar ve hırslı adamlardır, sultanları ise en büyük sultanlardır. Almanlar tarafından Burgonya bölgesine bağlıdır ve Mont-John Dağı ile çevrilidir. {cite:nuzhat-al-mushtaq-2002 s. 743}"
  id: "Ini adalah tanah dengan banyak desa dan pertanian, penduduknya adalah pejuang dan pria ambisius, dan para sultannya adalah sultan terbesar. Wilayah ini terhubung ke wilayah Burgundy oleh Jerman, dan dikelilingi oleh Gunung Mont-John. {cite:nuzhat-al-mushtaq-2002 hlm. 743}"
