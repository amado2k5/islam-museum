summary:
  ar: "نهر عند البطيحة؛ عند البلاذري حفره أبو الأسد مولى أمير المؤمنين قائد المنصور الذي وجه إلى البصرة أيام مقام عبد الله بن علي بها وهو الذي أدخل عبد الله بن علي الكوفة حين عسكر بينه وبين عسكر عيسى بن موسى وهو يحارب إبراهيم بن عبد الله بن الحسن وقيل أقام على فم النهر لأن السفن لم تدخله لضيقه فوسعه ونسب إليه."
  en: "A canal at the Batayih; in al-Baladhuri dug by Abu al-Asad, al-Mansur's mawla-commander sent to Basra during Abdallah ibn Ali's stay there — who also brought Abdallah ibn Ali into Kufa — while camped opposite Isa ibn Musa's force during the war on Ibrahim ibn Abdallah al-Hasani; or, he widened the canal's mouth for ships and it was named for him."
