label: { ar: "نهر أبي الأسد", en: "Nahr Abi al-Asad", es: "Nahr Abi al-Asad", fr: "Nahr Abi al-Asad", ur: "نہر ابی الاسد", tr: "Abi el-Asad Nehri", id: "Sungai Abi al-Asad" }
summary:
  ar: "نهر عند البطيحة؛ عند البلاذري حفره أبو الأسد مولى أمير المؤمنين قائد المنصور الذي وجه إلى البصرة أيام مقام عبد الله بن علي بها وهو الذي أدخل عبد الله بن علي الكوفة حين عسكر بينه وبين عسكر عيسى بن موسى وهو يحارب إبراهيم بن عبد الله بن الحسن وقيل أقام على فم النهر لأن السفن لم تدخله لضيقه فوسعه ونسب إليه."
  en: "A canal at the Batayih; in al-Baladhuri dug by Abu al-Asad, al-Mansur's mawla-commander sent to Basra during Abdallah ibn Ali's stay there — who also brought Abdallah ibn Ali into Kufa — while camped opposite Isa ibn Musa's force during the war on Ibrahim ibn Abdallah al-Hasani; or, he widened the canal's mouth for ships and it was named for him."
  es: "Un canal en Batayih; en al-Baladhuri excavado por Abu al-Asad, el mawla-comandante de al-Mansur enviado a Basora durante la estancia de Abdallah ibn Ali allí —quien también llevó a Abdallah ibn Ali a Kufa— mientras acampaba frente a las fuerzas de Isa ibn Musa durante la guerra contra Ibrahim ibn Abdallah al-Hasani; o bien, ensanchó la boca del canal para barcos y recibió su nombre."
  fr: "Un canal à Batayih; à al-Baladhuri creusé par Abu al-Asad, le mawla-commandant d'al-Mansur envoyé à Bassora pendant le séjour d'Abdallah ibn Ali là-bas — qui a également amené Abdallah ibn Ali à Kufa — alors qu'il était campé face à la force d'Isa ibn Musa pendant la guerre contre Ibrahim ibn Abdallah al-Hasani; ou, il a élargi l'embouchure du canal pour les navires et il a été nommé en son honneur."
  ur: "بطیح میں ایک نہر؛ ابو الاسد کے ذریعہ کھودی گئی البلادھوری میں، عبد اللہ ابن علی کے وہاں قیام کے دوران المنصور کے مولا کمانڈر نے بصرہ بھیجا - جو عبداللہ ابن علی کو بھی کوفہ لے آیا - جب کہ ابراہیم بن عبداللہ الحسنی کے خلاف جنگ کے دوران عیسیٰ ابن موسی کی فوج کے سامنے پڑاؤ ڈالا؛ یا، اس نے جہازوں کے لیے نہر کا منہ چوڑا کیا اور اس کا نام اس کے نام رکھا گیا۔"
  tr: "Al-Batiha yakınlarında bir nehir; Al-Baladhuri'ye göre, bu nehir, Sadıklar Komutanı ve Al-Mansur'un komutanı tarafından kurtarılan Ebu Al-Asad tarafından kazılmıştır; kendisi, Abdullah ibn Ali'nin türbesinde Basra'ya yönlendirilmiştir. Abdullah ibn Ali'yi, İbrahim ibn Abdullah ibn Hasan ile savaşırken İsa ibn Musa'nın ordusuna karşı savaşırken Kufa'ya getiren kişidir. Nehrin ağzında kaldığı söylenir; çünkü dar olduğu için nehrin ağzına gemiler giremezdi, bu yüzden burayı genişletmiş ve ona atfedilmiştir."
  id: "Sebuah sungai dekat Al-Batiha; menurut Al-Baladhuri, sungai ini digali oleh Abu Al-Asad, mantan Komandan Orang Beriman dan komandan Al-Mansur, yang diarahkan ke Basra saat makam Abdullah ibn Ali di sana. Dialah yang membawa Abdullah ibn Ali ke Kufa ketika ia bertempur melawan pasukan Isa ibn Musa dan melawan Ibrahim ibn Abdullah ibn al-Hasan. Konon ia tinggal di muara sungai karena kapal tidak dapat masuk ke sana akibat sempitnya, sehingga ia memperluasnya dan dikaitkan dengan sungai tersebut."
