summary:
  ar: "مدينة من الحواضر بين مالقة وقرطبة، يبعد عنها وعن مالقة خمسة وثلاثون ميلا؛ ويذكر المؤلف أنها ومدينة انتقيرة أخلاهما الثوار بالأندلس بعد دولة ابن أبي عامر. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  en: "A town between Malaga and Cordoba, thirty-five miles from Malaga; the author says it and Antequera were emptied by the rebels of al-Andalus after the rule of Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  es: "Un pueblo situado entre Málaga y Córdoba, a cincuenta y seis kilómetros de Málaga; el autor afirma que tanto este pueblo como Antequera fueron desalojados por los rebeldes de al-Ándalus tras el reinado de Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  fr: "Ville située entre Malaga et Cordoue, à 56 kilomètres de Malaga; l’auteur indique qu’elle et Antequera furent vidées de leurs habitants par les rebelles d’al-Andalus après le règne d’Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  ur: "ملاگا اور قرطبہ کے درمیان ایک قصبہ، ملاگا سے پینتیس میل؛ مصنف کا کہنا ہے کہ ابن ابی عامر کی حکومت کے بعد اسے اور انٹیکرا کو اندلس کے باغیوں نے خالی کر دیا تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 570}"
