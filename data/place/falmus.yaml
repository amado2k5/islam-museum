label: { ar: "حصن فلموس", en: "Ḥiṣn Falmūs", es: "Ḥiṣn Falmūs", fr: "Ḥiṣn Falmūs", ur: "حسن فلموس", tr: "Fort Philmos", id: "Benteng Philmos" }
summary:
  ar: "حصن يذكر المؤلف أنه يخرب في الشتاء، فيفر أهله إلى كهوف بعيدة يوقدون فيها النيران، ثم يعودون إليه في الصيف {cite:nuzhat-al-mushtaq-2002 p. 954}."
  en: "A fortress which the author says is deserted in winter, when its people flee to distant caves to keep fires, and return in summer {cite:nuzhat-al-mushtaq-2002 p. 954}."
  es: "Una fortaleza que, según el autor, queda desierta en invierno, cuando sus habitantes huyen a cuevas lejanas para mantener el fuego encendido, y regresan en verano {cite:nuzhat-al-mushtaq-2002 p. 954}."
  fr: "Une forteresse que l'auteur dit désertée en hiver, lorsque ses habitants fuient vers des grottes éloignées pour entretenir des feux, et reviennent en été {cite:nuzhat-al-mushtaq-2002 p. 954}."
  ur: "ایک قلعہ جسے مصنف کہتے ہیں کہ سردیوں میں ویران ہوتا ہے، جب اس کے لوگ آگ لگانے کے لیے دور دراز کے غاروں کی طرف بھاگتے ہیں، اور گرمیوں میں واپس لوٹتے ہیں۔ 954}۔"
  tr: "Yazarın kışın harabe olduğu belirttiği bir kale, bu yüzden halkı uzak mağaralara kaçıp ateş yakıyor, yazın geri dönüyor {cite:Nuzhat-al-Mushtaq-2002 s. 954}."
  id: "Sebuah benteng yang disebut oleh penulis sebagai runtuh di musim dingin, sehingga penduduknya melarikan diri ke gua-gua jauh di mana mereka menyalakan api, lalu kembali ke sana pada musim panas {cite:Nuzhat-al-Mushtaq-2002 hlm. 954}."
