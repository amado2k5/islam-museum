summary:
  ar: "مدينة عامرة الديار، لها سور من تراب وربض عامر، وشرب أهلها من مياه نهرية، وتبعد عن ديواره مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 692}"
  en: "A populous town with an earthen wall and a great suburb, watered by a river; two stages from Diwarah. {cite:nuzhat-al-mushtaq-2002 p. 692}"
  es: "Una ciudad populosa con murallas de tierra y un gran suburbio, regada por un río; a dos etapas de Diwarah. {cite:nuzhat-al-mushtaq-2002 p. 692}"
  fr: "Une ville populeuse, entourée de remparts de terre et dotée d'une vaste faubourg, irriguée par une rivière; à deux étapes de Diwarah. {cite:nuzhat-al-mushtaq-2002 p. 692}"
  ur: "ایک آبادی والا شہر جس میں مٹی کی دیوار اور ایک عظیم مضافاتی علاقہ ہے، جسے دریا سے سیراب کیا گیا ہے۔ دیوارہ سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 692}"
  tr: "Topraklarla dolu, toz duvarı ve gelişen bir banliyösü olan bir şehir, halkı nehir suyundan içiyordu ve surlarına iki aşama uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 692}"
  id: "Sebuah kota penuh tanah, dengan tembok debu dan pinggiran kota yang subur, dan penduduknya minum air sungai, dan jaraknya dua tahap dari temboknya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 692}"
