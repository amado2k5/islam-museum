summary:
  ar: "مدينة في مالي على نهر النيجر، كانت عاصمة إمبراطورية سنغاي. ويذكر ابن بطوطة أنه بلغ مدينة مالي التي هي حضرة ملك السودان وأقام بها نحو أربعة أشهر، ويصف سلطانها منسى سليمان بأنه ملك بخيل لا يُرجى منه عطاء كبير، ويذكر قاضيها علي بن عبد الرحمن الجامعي وترجمانها دوغا وما وهب له من مثاقيل الذهب عند الوداع {cite:rihla-ibn-battuta-1958 p. 197-198}"
  en: A city in Mali on the Niger River; it was the capital of the Songhai Empire. Ibn Battuta records reaching the city of Mali, seat of the king of the Sudan, and staying there about four months; he describes its sultan Mansa Sulayman as a stingy ruler not to be expected to give much, names its qadi Ali ibn Abd al-Rahman al-Jami'i and interpreter Dogha, and records the gold mithqals given him at parting {cite:rihla-ibn-battuta-1958 p. 197-198}"
  es: "Una ciudad de Malí a orillas del río Níger; fue la capital del Imperio Songhai. Ibn Battuta relata su llegada a Malí, sede del rey de Sudán, y su estancia de unos cuatro meses; describe a su sultán, Mansa Sulayman, como un gobernante tacaño del que no se podía esperar mucho, menciona a su cadí, Ali ibn Abd al-Rahman al-Jami'i, y a su intérprete, Dogha, y registra los mithqals de oro que le dieron al despedirse {cite:rihla-ibn-battuta-1958 p. 197-198}."
  fr: "Ville du Mali située sur le fleuve Niger, elle fut la capitale de l'empire songhaï. Ibn Battuta relate son arrivée à Mali, siège du roi du Soudan, où il séjourna environ quatre mois. Il décrit son sultan, Mansa Sulayman, comme un souverain avare, nomme son cadi Ali ibn Abd al-Rahman al-Jami'i et son interprète Dogha, et mentionne les mithqals d'or qui lui furent offerts à son départ."
  ur: "دریائے نائجر پر مالی میں ایک شہر؛ یہ سونگھائی سلطنت کا دارالحکومت تھا۔ ابن بطوطہ نے سوڈان کے بادشاہ کے شہر مالی تک پہنچنے اور وہاں تقریباً چار ماہ قیام کرنے کا ریکارڈ بنایا ہے۔ وہ اس کے سلطان منسا سلیمان کو ایک کنجوس حکمران کے طور پر بیان کرتا ہے جس سے زیادہ دینے کی توقع نہیں کی جاتی ہے، اس کے قاضی علی بن عبدالرحمٰن الجامعی اور مترجم دوغا کا نام لیا جاتا ہے، اور اس کو جدائی کے وقت دیے گئے سونے کے متکلم کو ریکارڈ کیا جاتا ہے۔ 197-198}\""
