summary:
  ar: مدينة الشام على نهر العاصي؛ صالح أهلها أبا عبيدة بن الجراح بعد فتح دمشق على الأمان على أنفسهم وأموالهم وسور مدينتهم
    وكنائسهم وأرحائهم واستُثنى ربع كنيسة يوحنا للمسجد على مائة ألف وسبعين ألف دينار؛ ولما جمع هرقل لليرموك رد المسلمون على
    أهلها ما أخذوا من خراجهم فآثروا ولايتهم على الظلم والغشم وأغلقوا أبوابها دون جند هرقل هو ويهودها؛ ثم صارت هي وقنسرين جنداً
    واحداً، وهدم مروان بن محمد سورها لخلافهم عليه، وكانت مفروشة بالصخر فأمر المعتصم بقلع الفرش أيام الفضل بن قارن ثم أظهر
    أهلها المعصية وقتلوه وصلبوه فافتتحها موسى بن بغا الكبير عنوة سنة 250.
  en: A city of Syria on the Orontes; its people compounded with Abu Ubayda ibn al-Jarrah after Damascus's fall for safety
    of lives, wealth, wall, churches and mills — a quarter of St John's church excepted for the mosque — at a hundred and
    seventy thousand dinars; when Heraclius massed for the Yarmuk the Muslims returned to its people the kharaj taken, and
    they preferred Muslim rule to the injustice they had known, shutting the gates against Heraclius's army as did its Jews;
    afterwards Hims and Qinnasrin became a single jund; Marwan ibn Muhammad demolished its wall for their defection, and its
    stone pavement was lifted at al-Mu'tasim's order in the days of al-Fadl ibn Qarin, then the people rebelled, killed and
    crucified him, and Musa ibn Bugha the Elder took the city by force in year 250.
  es: "Una ciudad de Siria en el Orontes; sus habitantes se aliaron con Abu Ubayda ibn al-Jarrah después de la caída de Damasco para salvar vidas, riquezas, murallas, iglesias y molinos —una cuarta parte de la iglesia de San Juan, a excepción de la mezquita— por ciento setenta mil dinares; cuando Heraclio reunió tropas para el Yarmuk, los musulmanes devolvieron a sus habitantes el kharaj tomado, y ellos prefirieron el gobierno musulmán a la injusticia que habían conocido, cerrando las puertas al ejército de Heraclio como lo hicieron sus judíos; después Hims y Qinnasrin se convirtieron en un solo jund; Marwan ibn Muhammad demolió su muralla por su deserción, y su pavimento de piedra fue levantado por orden de al-Mu'tasim en los días de al-Fadl ibn Qarin, entonces el pueblo se rebeló, lo mató y crucificó, y Musa ibn Bugha el Viejo tomó la ciudad por la fuerza en el año 250."
  fr: "Hims, une ville de Syrie située sur l'Oronte, s'allia à Abu Ubayda ibn al-Jarrah après la chute de Damas pour assurer la sécurité de ses vies, de ses biens, de ses remparts, de ses églises et de ses moulins – un quart de l'église Saint-Jean, à l'exception de la mosquée – pour la somme de cent soixante-dix mille dinars. Lorsque Héraclius se rassembla pour le Yarmouk, les musulmans restituèrent aux habitants le kharaj conquis, et ces derniers préférèrent la domination musulmane à l'injustice qu'ils avaient subie, fermant les portes de la ville à l'armée d'Héraclius, tout comme les Juifs. Par la suite, Hims et Qinnasrin ne formèrent plus qu'un seul jund. Marwan ibn Muhammad fit démolir les remparts suite à leur défection, et le pavage de pierre fut enlevé sur ordre d'al-Mu'tasim sous le règne d'al-Fadl ibn Qarin. Le peuple se révolta alors, le tua et le crucifia, et Musa ibn Bugha l'Ancien s'empara de la ville par la force en l'an 250."
  ur: "اورونٹس پر شام کا ایک شہر؛ اس کے لوگ جان، مال، دیوار، گرجا گھر اور ملوں کی حفاظت کے لیے دمشق کے زوال کے بعد ابو عبیدہ بن الجراح کے ساتھ مل گئے - مسجد کے علاوہ سینٹ جان کے چرچ کا ایک چوتھائی حصہ - ایک لاکھ ستر ہزار دینار میں؛ جب ہیرکلیس نے یرموک کے لیے جمع کیا تو مسلمانوں نے اپنے لوگوں کو کھراج واپس لوٹا دیا، اور انہوں نے مسلمانوں کی حکومت کو اس ناانصافی پر ترجیح دی جو وہ جانتے تھے، ہرقل کی فوج کے خلاف دروازے بند کر دیے تھے جیسا کہ اس کے یہودیوں نے کیا تھا۔ اس کے بعد ہمس اور کناسرین ایک ہی جنڈ بن گئے۔ مروان بن محمد نے ان کے انحراف کی وجہ سے اس کی دیوار کو گرا دیا، اور الفضل بن قرین کے زمانے میں المعتصم کے حکم پر اس کا پتھر کا فرش اٹھا دیا گیا، پھر لوگوں نے بغاوت کی، اسے قتل کر دیا اور سولی پر چڑھا دیا، اور موسیٰ ابن بوغہ بزرگ نے سنہ 250 میں شہر پر زبردستی قبضہ کر لیا۔"
  tr: "Orontes Nehri üzerindeki el-Şam şehri; halkı Şam'ın fethinden sonra Ebu Ubeyde bin el-Cerraha tarafından kendileri, servetleri, şehir surları, kiliseleri ve sokakları üzerinde güvenlik için uzlaştırıldı. Yuhanna Kilisesi'nin dörtte biri camiden yüz yetmiş bin dinar karşılığında dışlandı. Herakleios Yermuk'a toplandığında, Müslümanlar vergi aldıkları parayı halkına geri verdi ve baskı yerine yönetimlerini tercih ettiler ve zulüm, Herakleios'un ve Yahudilerin askerleri olmadan kapılarını kapattı. Sonra o ve Kasrin tek bir ordu oldular. Mervan bin Muhammed, aralarındaki anlaşmazlık nedeniyle duvarını yıktı. Duvar kayayla kaplıydı, bu yüzden el-Mutasim el-Fadl bin Qaran döneminde halıların kaldırılmasını emretti. Sonra halkı açıkça günah işledi, onu öldürdü ve çarmıha gerdi. Musa ibn Bagha el-Kabir 250 yılında burayı zorla fethetti."
  id: "Kota al-Sham di Sungai Orontes; penduduknya didamaikan oleh Abu Ubaidah ibn al-Jarrah setelah penaklukan Damaskus demi keselamatan atas diri mereka sendiri, kekayaan mereka, tembok kota, gereja, dan gang-gang mereka. Seperempat Gereja Yohanes dikeluarkan dari masjid dengan harga seratus tujuh puluh ribu dinar. Ketika Heraclius berkumpul untuk Yarmouk, umat Muslim mengembalikan kepada rakyatnya apa yang telah mereka ambil dari pajak mereka, lebih memilih pemerintahan daripada penindasan dan kekejaman, menutup pintunya tanpa tentara Heraclius dan orang Yahudinya. Kemudian mereka dan Qasrin menjadi satu pasukan. Marwan ibn Muhammad menghancurkan temboknya karena perselisihan mereka atasnya. Masjid itu ditutupi batu, sehingga al-Mu'tasim memerintahkan penghapusan karpet pada masa al-Fadl ibn Qaran. Kemudian rakyatnya secara terbuka berbuat dosa, membunuhnya, dan menyalibkannya. Musa ibn Bagha al-Kabir menaklukkannya secara paksa pada tahun 250."
