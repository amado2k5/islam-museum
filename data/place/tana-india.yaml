label: { ar: "تانه ⁦(الهند)⁩", en: "Tana (India)", es: "Tana (India)", fr: "Tana (Inde)", ur: "تانا ⁦(بھارت)⁩", tr: "Thana (Hindistan)", id: "Thana (India)" }
summary:
  ar: "مدينة على الساحل، على ضفة خور كبير تدخله السفن، وأرضها تنبت القنا، ويصنعون فيها الطباشير الذي يُحمل إلى البلاد. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  en: "A coastal town on a large creek entered by ships, whose land yields cane and chalk-like product carried to many lands. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  es: "Un pueblo costero situado en una gran ensenada a la que acceden los barcos, cuyas tierras producen caña de azúcar y un producto similar a la tiza que se exporta a muchas tierras. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  fr: "Ville côtière située sur un large bras de mer accessible par les navires, dont les terres produisent de la canne à sucre et un produit crayeux exporté vers de nombreuses régions. {cite:nuzhat-al-mushtaq-2002 p. 191}"
  ur: "بحری جہازوں کے ذریعے داخل ہونے والی ایک بڑی کریک پر واقع ایک ساحلی شہر، جس کی زمین سے گنے اور چاک جیسی پیداوار بہت سی زمینوں تک پہنچائی جاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 191}"
  tr: "Kıyıda, gemilerin girdiği büyük bir dere kıyısında, topraklarında kana yetişiyor ve tebeşir yapıp ülkeye taşınıyorlar. {cite:nuzhat-al-mushtaq-2002 s. 191}"
  id: "Sebuah kota di pesisir, di tepi sungai besar yang dimasuki kapal, dan tanahnya tumbuh cana, dan mereka membuat kapur yang dibawa ke pedesaan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 191}"
