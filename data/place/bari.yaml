summary:
  ar: مدينة كبيرة عامرة، من بلاد الأنكبرديين، وبها إنشاء مراكب، وهي على الساحل، وتبعد عن ابرندس نحو اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 763}
  en: A large, populous city of the Lombard lands with ship-building on the coast, about twelve miles from Brindisi. {cite:nuzhat-al-mushtaq-2002 p. 763}
  es: "Una ciudad grande y populosa de las tierras lombardas, con astilleros en la costa, a unas doce millas de Brindisi. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  fr: "Une grande ville peuplée des terres lombardes, avec des chantiers navals sur la côte, à environ douze milles de Brindisi. {cite:nuzhat-al-mushtaq-2002 p. 763}"
  ur: "لومبارڈ کا ایک بڑا، آبادی والا شہر برنڈیسی سے تقریباً بارہ میل کے فاصلے پر ساحل پر جہاز سازی کے ساتھ اترتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 763}"
  tr: "Ankaberdililerin topraklarından çıkan, tersaneleri olan, kıyıda, Aberlandes'e yaklaşık on iki mil uzaklıkta bulunan büyük ve hareketli bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 763}"
  id: "Sebuah kota besar yang sibuk dari tanah Ankaberdian, dengan galangan kapal, terletak di pantai, sekitar dua belas mil dari Aberlandes. {cite:Nuzhat-al-Mushtaq-2002 hlm. 763}"
