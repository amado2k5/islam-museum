label: { ar: "الديارات السبع (وادي النطرون)", en: "the Seven Monasteries (Wadi al-Natrun)" }
summary:
  ar: "الديارات السبع في الوجه البحري ممتدة غرباً على جانب البِطِّية القاطعة بين بلاد البحيرة والفيوم — ديارات وادي النطرون؛ مرّ بها ابن فضل الله العمري في الصحبة الشريفة الناصرية، وهي في رمال منقطعة وسباخ مالحة وشرب سكانها من جفارات، وهم في قشف عيش وشظف قوت، ويحمل النصارى إليهم جلائل النذور، ويتخذ كتبة القبط وخدم السلطان منهم أيادٍ يكونون لهم لجأً من الدولة إذا جارت عليهم صروفها {cite:umari-masalik-1924 p. 374}."
  en: "The Seven Monasteries of Lower Egypt stretched west along the ridge dividing Buhayra from the Fayyum — Wadi al-Natrun's houses; al-Umari passed them in Sultan al-Nasir's entourage through salt-marshes and barren sands where the monks drink from seep-holes in utter austerity; Christians bear them great votive offerings, and Coptic chancery scribes and royal servants keep favours with them as refuge when fortune turns {cite:umari-masalik-1924 p. 374}."
