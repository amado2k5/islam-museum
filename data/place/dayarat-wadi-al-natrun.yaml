summary:
  ar: "الديارات السبع في الوجه البحري ممتدة غرباً على جانب البِطِّية القاطعة بين بلاد البحيرة والفيوم — ديارات وادي النطرون؛ مرّ بها ابن فضل الله العمري في الصحبة الشريفة الناصرية، وهي في رمال منقطعة وسباخ مالحة وشرب سكانها من جفارات، وهم في قشف عيش وشظف قوت، ويحمل النصارى إليهم جلائل النذور، ويتخذ كتبة القبط وخدم السلطان منهم أيادٍ يكونون لهم لجأً من الدولة إذا جارت عليهم صروفها {cite:umari-masalik-1924 p. 374}."
  en: "The Seven Monasteries of Lower Egypt stretched west along the ridge dividing Buhayra from the Fayyum — Wadi al-Natrun's houses; al-Umari passed them in Sultan al-Nasir's entourage through salt-marshes and barren sands where the monks drink from seep-holes in utter austerity; Christians bear them great votive offerings, and Coptic chancery scribes and royal servants keep favours with them as refuge when fortune turns {cite:umari-masalik-1924 p. 374}."
  es: "Los Siete Monasterios del Bajo Egipto se extendían hacia el oeste a lo largo de la cresta que separaba Buhayra del Fayyum: las casas de Wadi al-Natrun; al-Umari pasó por ellas en el séquito del sultán al-Nasir a través de marismas y arenas estériles donde los monjes beben de manantiales con absoluta austeridad; los cristianos les llevan grandes ofrendas votivas, y los escribas coptos de la cancillería y los sirvientes reales les guardan favores como refugio cuando la fortuna cambia {cite:umari-masalik-1924 p. 374}."
  fr: "Les Sept Monastères de Basse-Égypte s'étendaient vers l'ouest le long de la crête séparant Buhayra du Fayoum — les maisons de Wadi al-Natrun; al-Umari les a traversés dans l'entourage du sultan al-Nasir à travers des marais salants et des sables arides où les moines boivent à des sources dans une austérité absolue; les chrétiens leur apportent de grandes offrandes votives, et les scribes de la chancellerie copte et les serviteurs royaux gardent des faveurs auprès d'eux comme refuge lorsque la fortune tourne {cite:umari-masalik-1924 p. 374}."
