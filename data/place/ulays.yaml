summary:
  ar: "عند البلاذري: بلدة في السواد — وفي نسخة اللّيس — خرج إليها جابان عظيم الجمع فلقيه المثنى بن حارثة بنهر الدم وصالح خالد أهلها على أن يكونوا عيوناً للمسلمين على الفرس وأدلاء وأعواناً."
  en: "In al-Baladhuri: a Sawad town — one copy reads al-Lays — against which a great host came out, met by al-Muthanna ibn Haritha at Nahr al-Damm; Khalid made peace with its people on being the Muslims' eyes on the Persians, guides and helpers."
  es: "En al-Baladhuri: una ciudad de Sawad —una copia dice al-Lays— contra la cual salió un gran ejército, recibido por al-Muthanna ibn Haritha en Nahr al-Damm; Khalid hizo las paces con su gente por ser los ojos de los musulmanes sobre los persas, guías y ayudantes."
  fr: "Dans al-Baladhuri: une ville de Sawad — une copie dit al-Lays — contre laquelle une grande armée est sortie, rencontrée par al-Muthanna ibn Haritha à Nahr al-Damm; Khalid a fait la paix avec ses habitants en leur promettant d'être les yeux des musulmans sur les Perses, des guides et des aides."
  ur: "البلادوری میں: ایک سواد شہر - ایک نسخہ اللیس پڑھتا ہے - جس کے خلاف ایک عظیم میزبان نکلا، جس کی ملاقات المثنا ابن حارثہ نے نہر الدم میں کی۔ خالد نے اپنے لوگوں سے صلح کر لی کیونکہ مسلمانوں کی نگاہیں فارسیوں، رہنما اور مددگار ہیں۔"
  tr: "Al-Baladhuri'ye göre: siyah giysili bir kasaba — ve Al-Isn versiyonunda — büyük bir insan grubu buraya gelmiş, Al-Muthanna ibn Haritha onu Kan Nehri'nde karşılamış ve Saleh Halid, halkını Müslümanların Persler üzerinde gözleri ve rehber ve yardımcılar olmaları şartıyla karşılamıştır."
  id: "Menurut Al-Baladhuri: sebuah kota berpakaian hitam — dan dalam versi Al-Isn — sekelompok besar orang datang ke sana, di mana Al-Muthanna ibn Haritha bertemu dengannya di Sungai Darah dan Saleh Khalid menemani penduduknya dengan syarat mereka menjadi mata Muslim atas Persia, pembimbing, dan pembantu."
