summary:
  ar: "فاس من أمصار المغرب وقواعده؛ فرض عليها عثمان بن عبد الحق المريني ضريبة معلومة على أن يكف الغارة عنها، ثم صارت دار مُلك بني مرين اختط إلى جانبها السلطان أبو يوسف البلد الجديد لنزله وعساكره."
  en: "Fes, among Morocco's metropolises; taxed yearly by Uthman ibn Abd al-Haqq in return for sparing it his raids, then the Marinids' royal seat beside which Abu Yusuf laid out the New Town for his court and armies."
  es: "Fez, una de las metrópolis de Marruecos, era gravada anualmente por Uthman ibn Abd al-Haqq a cambio de que este la librara de sus incursiones. En aquel entonces, era la sede real de los Mariníes, junto a la cual Abu Yusuf diseñó la Ciudad Nueva para su corte y sus ejércitos."
  fr: "Fès, l'une des métropoles du Maroc; taxée chaque année par Uthman ibn Abd al-Haqq en échange de la protection qu'il lui accordait lors de ses raids, puis siège royal des Mérinides à côté duquel Abu Yusuf aménagea la Ville Nouvelle pour sa cour et ses armées."
  ur: "Fes, مراکش کے شہروں کے درمیان; عثمان بن عبد الحق کی طرف سے سالانہ ٹیکس وصول کیا جاتا تھا اس کے بدلے میں اس کے چھاپوں سے بچا جاتا تھا، پھر میرینیڈز کی شاہی نشست جس کے ساتھ ابو یوسف نے اپنے دربار اور فوجوں کے لیے نیو ٹاؤن بنایا تھا۔"
  tr: "Fes, Mağrip'in vilayetlerinden ve merkezlerinden biridir; Osman bin Abdülhak el-Marini, baskınları durdurmak için bilinen bir vergi koymuş, ardından Marinid hükümdarının ikametgahı olmuş ve Sultan Ebu Yusuf yeni şehri ikametgahı ve askerleri için planlamıştır."
  id: "Fez adalah salah satu provinsi dan pusat Maghreb; Uthman ibn Abd al-Haqq al-Marini memberlakukan pajak yang diketahui untuk menghentikan serangan, kemudian kota ini menjadi kediaman penguasa Marinid, bersama dengan itu Sultan Abu Yusuf merencanakan kota baru untuk kediaman dan pasukannya."
