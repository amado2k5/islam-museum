  ar: "من الجزائر الخالدات في البحر الغربي، ذكر المؤلف عن صاحب كتاب العجائب أن فيها صنما عاليا متين البناء لا طريق إليه، وأن الباني، وهو تبع ذو المرائد، دفن فيها في هيكل من المرمر والزجاج الملون {cite:nuzhat-al-mushtaq-2002 p. 104}."
  en: "One of the Fortunate Isles in the western sea. Citing the Book of Wonders, al-Idrisi reports a tall, sturdy idol on it that cannot be climbed, and says its builder, Tubba' Dhu al-Marathid, was buried in a marble and coloured-glass shrine there {cite:nuzhat-al-mushtaq-2002 p. 104}."
