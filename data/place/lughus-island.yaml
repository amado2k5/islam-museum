summary:
  ar: "من الجزائر الخالدات في البحر الغربي، ذكر المؤلف عن صاحب كتاب العجائب أن فيها صنما عاليا متين البناء لا طريق إليه، وأن الباني، وهو تبع ذو المرائد، دفن فيها في هيكل من المرمر والزجاج الملون {cite:nuzhat-al-mushtaq-2002 p. 104}."
  en: "One of the Fortunate Isles in the western sea. Citing the Book of Wonders, al-Idrisi reports a tall, sturdy idol on it that cannot be climbed, and says its builder, Tubba' Dhu al-Marathid, was buried in a marble and coloured-glass shrine there {cite:nuzhat-al-mushtaq-2002 p. 104}."
  es: "Una de las Islas Afortunadas del Mar Occidental. Citando el Libro de las Maravillas, al-Idrisi informa de un ídolo alto y robusto en ella al que no se puede escalar, y dice que su constructor, Tubba' Dhu al-Marathid, fue enterrado allí en un santuario de mármol y vidrieras de colores. 104}."
  fr: "L'une des îles Fortunées de la mer Occidentale. Citant le Livre des Merveilles, al-Idrisi rapporte la présence d'une idole haute et robuste, impossible à escalader, et affirme que son constructeur, Tubba' Dhu al-Marathid, y fut enterré dans un sanctuaire de marbre et de verre coloré. 104}."
