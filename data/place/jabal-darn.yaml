summary:
  ar: "جبل درن الأعظم، وهو سلسلة جبلية طويلة تمتد من البحر في الغرب، ويصفها الإدريسي بالحصون والقلاع على قمته، وبأن فيه الزيتون والتين والعنب والجوز واللوز. {cite:nuzhat-al-mushtaq-2002 p. 229}"
  en: "The great Atlas range, a long chain running from the Atlantic; al-Idrisi describes forts on its heights and figs, grapes, walnuts and almonds on its slopes. {cite:nuzhat-al-mushtaq-2002 p. 229}"
  es: "La gran cordillera del Atlas, una larga cadena que se extiende desde el Atlántico; al-Idrisi describe fortalezas en sus alturas e higueras, vides, nueces y almendras en sus laderas. {cite:nuzhat-al-mushtaq-2002 p. 229}"
  fr: "La grande chaîne de l'Atlas, longue chaîne s'étendant depuis l'Atlantique; al-Idrisi décrit des forts sur ses hauteurs et des figuiers, des vignes, des noyers et des amandiers sur ses pentes. {cite:nuzhat-al-mushtaq-2002 p. 229}"
  ur: "عظیم اٹلس رینج، بحر اوقیانوس سے چلنے والی ایک لمبی زنجیر؛ الادریسی نے اس کی بلندیوں پر قلعے اور اس کی ڈھلوان پر انجیر، انگور، اخروٹ اور بادام کا ذکر کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 229}"
