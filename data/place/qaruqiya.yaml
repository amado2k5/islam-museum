summary:
  ar: "مدينة حسنة مبانيها قائمة، ويذكر المؤلف أنها تبعد عن بسجرت الخارجة شمالا عشر مراحل {cite:nuzhat-al-mushtaq-2002 p. 924} {cite:nuzhat-al-mushtaq-2002 p. 925}."
  en: "A fine city with standing buildings; the author gives ten stages north of Bsjrt al-Kharija {cite:nuzhat-al-mushtaq-2002 p. 924} {cite:nuzhat-al-mushtaq-2002 p. 925}."
  es: "Una hermosa ciudad con edificios en pie; el autor da diez etapas al norte de Bsjrt al-Kharija {cite:nuzhat-al-mushtaq-2002 p. 924} {cite:nuzhat-al-mushtaq-2002 p. 925}."
  fr: "Une belle ville avec des bâtiments encore debout; l'auteur donne dix étapes au nord de Bsjrt al-Kharija {cite:nuzhat-al-mushtaq-2002 p. 924} {cite:nuzhat-al-mushtaq-2002 p. 925}."
  ur: "کھڑی عمارتوں کے ساتھ ایک عمدہ شہر؛ مصنف نے بصرۃ الخریجہ کے شمال میں دس مراحل بتائے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 924} {حوالہ: نزہت المشتاق-2002 ص۔ 925}۔"
  tr: "Mevcut binaları olan güzel bir şehirdir ve yazar, Bisjert al-Kharja'nın on aşama kuzeyinde olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 924} {cite:Nuzhat-al-Mushtaq-2002 s. 925}."
  id: "Sebuah kota yang indah dengan bangunan yang sudah ada, dan penulis menyebutkan bahwa kota ini terletak sepuluh tahap di utara Bisjert al-Kharja {cite:Nuzhat-al-Mushtaq-2002 hlm. 924} {cite:Nuzhat-al-Mushtaq-2002 hlm. 925}."
