summary:
  ar: "مدينة صينية على نهر يمد نهر خمدان، تبعد عن خيغون أربع مراحل، وإليها تُجمع أموال الصين بعد تخليصها، وتُودع في خزائن الملك الأعظم. {cite:nuzhat-al-mushtaq-2002 p. 205}"
  en: "A Chinese city on a river feeding the Khamdan, four stages from Khaygun, where the revenues of China are gathered and stored in the treasuries of the great king. {cite:nuzhat-al-mushtaq-2002 p. 205}"
  es: "Ciudad china a orillas de un río que desemboca en el Khamdan, a cuatro etapas de Khaygun, donde se recogen y almacenan los ingresos de China en los tesoros del gran rey. {cite:nuzhat-al-mushtaq-2002 p. 205}"
  fr: "Une ville chinoise située sur un fleuve affluent du Khamdan, à quatre étapes de Khaygun, où les revenus de la Chine étaient collectés et stockés dans les trésors du grand roi. {cite:nuzhat-al-mushtaq-2002 p. 205}"
  ur: "خمدان سے چار مرحلوں پر خمدان کو پانی فراہم کرنے والے دریا پر واقع ایک چینی شہر، جہاں چین کی آمدنی کو عظیم بادشاہ کے خزانوں میں جمع کر کے محفوظ کیا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 205}"
  tr: "Xigon'a dört adım uzaklıkta, Khumdan Nehri'nden akan bir nehir üzerinde yer alan bir Çin şehri; burada Çin'in paraları kurtuluştan sonra toplanır ve Büyük Kral'ın hazinesine yatırılır. {cite:nuzhat-al-mushtaq-2002 s. 205}"
  id: "Sebuah kota Tiongkok di tepi sungai yang mengalir ke Sungai Khumdan, empat langkah dari Xigon, tempat dana Tiongkok dikumpulkan setelah pembebasan dan disimpan di kas Raja Agung. {cite:nuzhat-al-mushtaq-2002 hlm. 205}"
