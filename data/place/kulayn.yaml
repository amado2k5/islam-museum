summary:
  ar: "قرية على بعد ٣٨ كم جنوب غرب [[place/rayy|الري]] في ناحية بشابويه؛ اسمها الفارسي «كولن» فعربت بإمالة «كلين» و«كولين»، ومنها نسبة [[person/al-kulayni|الكليني]] {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401}."
  en: "A village 38 km south-west of [[place/rayy|Rayy]] in the Pashapuya district; its Persian name Kolen was arabicised with imala as Kulayn and Kulin, the nisba of [[person/al-kulayni|al-Kulayni]] {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401}."
  ur: "[[place/rayy|رے]] سے 38 کلومیٹر جنوب مغرب میں بشاپویہ علاقے کا ایک گاؤں؛ فارسی نام «کولن» سے امالے کے ساتھ «کلین» و «کولین» عربی شکل پائی، اور یہیں سے [[person/al-kulayni|کلینی]] کی نسبت ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 400-401}۔"
  es: "Un pueblo a 38 km al suroeste de [[place/rayy|Rayy]] en el distrito de Pashapuya; su nombre persa Kolen fue arabizado con imala como Kulayn y Kulin, la nisba de [[persona/al-kulayni|al-Kulayni]] {cita:encyclopaedia-of-islam-2 vol. 5p. 400-401}."
  fr: "Un village à 38 km au sud-ouest de [[place/rayy|Rayy]] dans le district de Pashapuya; son nom persan Kolen a été arabisé avec imala comme Kulay et Kulin, la nisba de [[person/al-kulayni|al-Kulayni]] {cite:encyclopaedia-of-islam-2 vol. 17h. 400-401}."
  tr: "Bashbuyeh ilçesinde, [[place/rayy|al-irai]]'nin 38 km güneybatısında bulunan bir köydür; Farsça adı 'Kulan'dır, 'Kleen' ve 'Kulin' telaffuzuyla Araplaştırılmıştır ve buradan [[kişi/al-kulayni|al-Kulayni]] {atıf:Encyclopaedia-of-Islam-2 cilt 5, s. 400-401} olarak adlandırılmıştır."
  id: "Sebuah desa yang terletak 38 km barat daya [[place/rayy|al-irai]] di distrik Bashbuyeh; nama Persianya adalah 'Kulan', yang diarabadikan dengan pengucapan 'Kleen' dan 'Kulin', dan dari desa tersebut berasal atribusi [[person/al-kulayni|al-Kulayni]] {cite:Encyclopaedia-of-Islam-2 vol. 5, hlm. 400-401}."
