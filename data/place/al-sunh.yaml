summary:
  ar: "محلة من عوالي المدينة سُميت بأطم «السنح» الذي ابتناه بنو الحارث بن الخزرج، وهي إحدى محال المدينة كما عند ياقوت؛ كان فيها منزل أبي بكر حين تزوج مليكة — وقيل حبيبة — بنت خارجة بن زيد، وبينها وبين منزل النبي نحو ميل {cite:samhudi-wafa-al-wafa p. 210-211}."
  en: "A quarter of the 'Awali (upper Medina) named for the utm 'al-Sunh' built by Banu al-Harith ibn al-Khazraj, counted by Yaqut among Medina's quarters; Abu Bakr had his residence there when he married Malika — or Habiba — bint Kharija ibn Zayd, about a mile from the Prophet's house {cite:samhudi-wafa-al-wafa p. 210-211}."
