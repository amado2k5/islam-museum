label: { ar: "السنح", en: "al-Sunh", es: "al-Sunh", fr: "al-Sunh", ur: "السنہ" }
summary:
  ar: "محلة من عوالي المدينة سُميت بأطم «السنح» الذي ابتناه بنو الحارث بن الخزرج، وهي إحدى محال المدينة كما عند ياقوت؛ كان فيها منزل أبي بكر حين تزوج مليكة — وقيل حبيبة — بنت خارجة بن زيد، وبينها وبين منزل النبي نحو ميل {cite:samhudi-wafa-al-wafa p. 210-211}."
  en: "A quarter of the 'Awali (upper Medina) named for the utm 'al-Sunh' built by Banu al-Harith ibn al-Khazraj, counted by Yaqut among Medina's quarters; Abu Bakr had his residence there when he married Malika — or Habiba — bint Kharija ibn Zayd, about a mile from the Prophet's house {cite:samhudi-wafa-al-wafa p. 210-211}."
  es: "Un barrio de 'Awali (Medina alta) llamado así por el utm 'al-Sunh construido por Banu al-Harith ibn al-Khazraj, contado por Yaqut entre los barrios de Medina; Abu Bakr tenía su residencia allí cuando se casó con Malika —o Habiba— bint Kharija ibn Zayd, a aproximadamente una milla de la casa del Profeta {cite:samhudi-wafa-al-wafa p. 210-211}."
  fr: "Un quart de l'Awali (haute Médine) nommé d'après l'utm 'al-Sunh' construit par Banu al-Harith ibn al-Khazraj, compté par Yaqut parmi les quartiers de Médine; Abu Bakr y avait sa résidence lorsqu'il épousa Malika — ou Habiba — bint Kharija ibn Zayd, à environ un mile de la maison du Prophète {cite:samhudi-wafa-al-wafa p. 210-211}."
  ur: "عوالی ⁦(اوپری مدینہ)⁩ کا ایک چوتھائی حصہ بنو الحارث ابن الخزرج کے ذریعہ تعمیر کردہ امت 'السنہ' کے نام سے منسوب ہے، جسے یاقوت نے مدینہ کے حلقوں میں شمار کیا ہے۔ ابوبکر کی رہائش تھی جب انہوں نے ملیکہ — یا حبیبہ — بنت خارجہ بن زید سے شادی کی تھی، جو رسول اللہ کے گھر سے تقریباً ایک میل کے فاصلے پر تھی۔ 210-211}۔"
