summary:
  en: "The lands north of Arabia where Qudaʾa’s Salihids then the Ghassanids ruled as Rome’s client kings, and to which Harran-bound Ibrahim had earlier passed through Palestine. Writing c. 375 AH, the native son al-Muqaddasi called Sham 'the abode of the prophets', home of the first qibla, the ribats and the holy mountains — though its marches were already ruined and its people lived in fear of the Byzantines {cite:ahsan-al-taqasim pp. 132-133}."
  ar: "البلاد شمال الجزيرة؛ ملك فيها الضجاعمة ثم الغساسنة وكلاء للروم، وكان مورد تجارة قريش وباب الجزيرة إلى أوربا. ووصفها المقدسي نحو 375هـ بأنها ديار النبيين ومعدن البدلاء وفيها القبلة الأولى والرباطات الفاضلة والثغور الجليلة والجبال الشريفة، غير أن أطرافها قد خربت وأهلها على خوف من الروم {cite:ahsan-al-taqasim pp. 132-133}."
