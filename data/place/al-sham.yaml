summary:
  en: "The lands north of Arabia where Qudaʾa’s Salihids then the Ghassanids ruled as Rome’s client kings, and to which Harran-bound Ibrahim had earlier passed through Palestine. Writing c. 375 AH, the native son al-Muqaddasi called Sham 'the abode of the prophets', home of the first qibla, the ribats and the holy mountains — though its marches were already ruined and its people lived in fear of the Byzantines {cite:ahsan-al-taqasim pp. 132-133}."
  ar: "البلاد شمال الجزيرة؛ ملك فيها الضجاعمة ثم الغساسنة وكلاء للروم، وكان مورد تجارة قريش وباب الجزيرة إلى أوربا. ووصفها المقدسي نحو 375هـ بأنها ديار النبيين ومعدن البدلاء وفيها القبلة الأولى والرباطات الفاضلة والثغور الجليلة والجبال الشريفة، غير أن أطرافها قد خربت وأهلها على خوف من الروم {cite:ahsan-al-taqasim pp. 132-133}."
  es: "Las tierras al norte de Arabia donde los salihidas de Qudaʾa gobernaron luego los gasánidas como reyes vasallos de Roma, y a las que Ibrahim, rumbo a Harran, había pasado anteriormente a través de Palestina. Escribiendo hacia el año 375 AH, el hijo nativo al-Muqaddasi llamó a Sham 'la morada de los profetas', hogar de la primera qibla, los ribats y las montañas sagradas, aunque sus fronteras ya estaban arruinadas y su gente vivía con miedo a los bizantinos {cite:ahsan-al-taqasim pp. 132-133}."
  fr: "Les terres au nord de l'Arabie où les Salihides de Quda'a, puis les Ghassanides, régnèrent en tant que rois clients de Rome, et où Ibrahim, en route pour Harran, avait auparavant traversé la Palestine. Écrivant vers 375 AH, l'enfant du pays al-Muqaddasi qualifiait le Sham de « demeure des prophètes », berceau de la première qibla, des ribats et des montagnes sacrées — bien que ses marches fussent déjà en ruines et que ses habitants vivent dans la crainte des Byzantins {cite: ahsan-al-taqasim pp. 132-133}."
  ur: "عرب کے شمال میں وہ سرزمین جہاں قدعہ کے صالحین پھر غسانیوں نے روم کے مؤکل بادشاہوں کے طور پر حکومت کی اور جہاں سے حران سے تعلق رکھنے والا ابراہیم پہلے فلسطین سے گزرا تھا۔ تحریر c. 375ھ، آبائی فرزند مقدّسی نے شام کو 'انبیاء کا ٹھکانہ'، قبلہ اول کا گھر، رباط اور مقدس پہاڑ کہا - حالانکہ اس کے مارچ پہلے ہی برباد ہو چکے تھے اور اس کے لوگ بازنطینیوں کے خوف سے زندگی گزار رہے تھے۔"
