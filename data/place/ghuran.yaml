summary:
  ar: "مدينة صغيرة يسكن بها ملك صنف من الترك، ويذكر المؤلف أنها تبعد عن دندرة أربع مراحل على جبال شاهقة {cite:nuzhat-al-mushtaq-2002 p. 927}."
  en: "A small town where the ruler of a Turkish group lives; the author gives four stages over high mountains from Dandara {cite:nuzhat-al-mushtaq-2002 p. 927}."
  es: "Un pequeño pueblo donde vive el gobernante de un grupo turco; el autor da cuatro etapas a través de altas montañas desde Dandara {cite:nuzhat-al-mushtaq-2002 p. 927}."
  fr: "Une petite ville où vit le chef d'un groupe turc; l'auteur décrit quatre étapes à travers de hautes montagnes depuis Dandara {cite:nuzhat-al-mushtaq-2002 p. 927}."
  ur: "ایک چھوٹا سا قصبہ جہاں ایک ترک گروہ کا حکمران رہتا ہے۔ مصنف نے ڈنڈارا سے بلند پہاڑوں پر چار مراحل بتائے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 927}۔"
  tr: "Türk kökenli bir kralın yaşadığı küçük bir şehirdir ve yazar, Dandira'ya dört adım uzaklıkta, yüksek dağlarda olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 927}."
  id: "Sebuah kota kecil yang dihuni oleh seorang raja keturunan Turkik, dan penulis menyebutkan bahwa kota ini berjarak empat langkah dari Dandira di pegunungan tinggi {cite:Nuzhat-al-Mushtaq-2002, hlm. 927}."
