summary:
  ar: "مدينة عكا على ساحل الشام من جند الأردن، أمُّ ثغر الساحل وحصن الإسلام المنيع في عصر الحروب الصليبية؛ فتحها صلاح الدين يوسف بن أيوب يوم الأربعاء بعد وقعة حطين سنة ثلاث وثمانين وخمسمائة {cite:kamil-ibn-al-athir p. 149}، ثم حاصرها الفرنج سنتين واستولوا عليها يوم الجمعة سابع عشر جمادى الآخرة سنة سبع وثمانين وقتلوا أسرى المسلمين فيها يوم الثلاثاء سابع وعشرين رجب {cite:kamil-ibn-al-athir p. 205-207}."
  en: "Acre on the Syrian coast in jund al-Urdunn — the chief maritime fortress of the Crusader wars; Salah al-Din took it the Wednesday after Hattin (583), and the Franks retook it on Friday 17 Jumada II 587 after a two-year siege, killing the Muslim prisoners on 27 Rajab {cite:kamil-ibn-al-athir p. 149, 205-207}."
  ur: "شام کے ساحل پر ایک بندرگاہ اور قلعہ بند شہر؛ ابن اثیر کے مطابق صلاح الدین نے 583ھ میں اسے لیا، جبکہ فرنگیوں نے طویل محاصرے کے بعد 587ھ میں اس پر قبضہ کیا۔ {cite:kamil-ibn-al-athir p. 149} {cite:kamil-ibn-al-athir p. 205-207}"
