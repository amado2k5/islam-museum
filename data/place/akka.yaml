summary:
  ar: مدينة عكا على ساحل الشام من جند الأردن، أمُّ ثغر الساحل وحصن الإسلام المنيع في عصر الحروب الصليبية؛ فتحها صلاح الدين يوسف بن أيوب يوم الأربعاء بعد وقعة حطين سنة ثلاث وثمانين وخمسمائة {cite:kamil-ibn-al-athir p. 149}، ثم حاصرها الفرنج سنتين واستولوا عليها يوم الجمعة سابع عشر جمادى الآخرة سنة سبع وثمانين وقتلوا أسرى المسلمين فيها يوم الثلاثاء سابع وعشرين رجب {cite:kamil-ibn-al-athir p. 205-207}.
  en: Acre on the Syrian coast in jund al-Urdunn — the chief maritime fortress of the Crusader wars; Salah al-Din took it the Wednesday after Hattin (583), and the Franks retook it on Friday 17 Jumada II 587 after a two-year siege, killing the Muslim prisoners on 27 Rajab {cite:kamil-ibn-al-athir p. 149, 205-207}.
  ur: شام کے ساحل پر ایک بندرگاہ اور قلعہ بند شہر؛ ابن اثیر کے مطابق صلاح الدین نے 583ھ میں اسے لیا، جبکہ فرنگیوں نے طویل محاصرے کے بعد 587ھ میں اس پر قبضہ کیا۔ {cite:kamil-ibn-al-athir p. 149} {cite:kamil-ibn-al-athir p. 205-207}
  es: "Acre, en la costa siria, en Jund al-Urdunn, fue la principal fortaleza marítima de las guerras de las Cruzadas; Saladino la tomó el miércoles después de Hattin (583), y los francos la reconquistaron el viernes 17 de Jumada II de 587 después de un asedio de dos años, matando a los prisioneros musulmanes el 27 de Rajab {cite:kamil-ibn-al-athir p. 149, 205-207}."
  fr: "Acre sur la côte syrienne dans le jund al-Urdunn — la principale forteresse maritime des guerres croisées; Salah al-Din la prit le mercredi après Hattin (583), et les Francs la reprirent le vendredi 17 Jumada II 587 après un siège de deux ans, tuant les prisonniers musulmans le 27 Rajab {cite:kamil-ibn-al-athir p. 149, 205-207}."
  tr: "Şam kıyısındaki Akka şehri, Haçlı Seferleri sırasında kıyının sınırının ana ve İslam kalesi olan Ürdün ordusunun bir parçasıydı; 583 Hicri yılında Hattin Muharebesi'nden sonra Çarşamba günü Salah al-Din Yusuf bin Ayyub tarafından ele geçirildi {atıf:kamil-ibn-al-athir s. 149}, ardından Franklar iki yıl boyunca kuşattı ve 87 Hicri yılının 17'si Cuma günü ele geçirdi, 27 Recep Salı günü orada Müslüman esirleri öldürdü {cite:kamil-ibn-al-athir s. 205-207}."
  id: "Kota Acre di pesisir Levant adalah bagian dari tentara Yordania, ibu dari perbatasan pesisir dan benteng Islam selama Perang Salib; kota ini direbut oleh Salah al-Din Yusuf ibn Ayyub pada hari Rabu setelah Pertempuran Hattin tahun 583 H {cite:kamil-ibn-al-athir hlm. 149}, kemudian orang Franka mengepungnya selama dua tahun dan merebutnya pada Jumat, tanggal 17 Jumada al-Akhirah tahun 87 H, membunuh tawanan Muslim di sana pada hari Selasa, tanggal 27 Rajab {cite:kamil-ibn-al-athir hlm. 205-207}."
