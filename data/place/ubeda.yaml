summary:
  ar: "مدينة صغيرة قرب النهر الكبير، تقع شرقي بياسة بسبعة أميال، لها مزارع وغلات قمح وشعير كثيرة. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  en: "A small city near the great river, seven miles east of Baeza, with farms and large crops of wheat and barley. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  es: "Una pequeña ciudad cerca del gran río, a siete millas al este de Baeza, con granjas y grandes cosechas de trigo y cebada. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  fr: "Une petite ville près du grand fleuve, à sept milles à l'est de Baeza, avec des fermes et d'importantes récoltes de blé et d'orge. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  ur: "عظیم دریا کے قریب ایک چھوٹا شہر، بیزا سے سات میل مشرق میں، کھیتوں اور گندم اور جو کی بڑی فصلوں کے ساتھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 569}"
  tr: "Büyük Nehir yakınında, Biasa'nın yedi mil doğusunda küçük bir kasaba olan bu kasaba, çiftlikleri ve birçok buğday ile arpa tanesi vardır. {cite:nuzhat-al-mushtaq-2002 s. 569}"
  id: "Sebuah kota kecil dekat Sungai Besar, terletak tujuh mil di sebelah timur Biasa, kota ini memiliki lahan pertanian dan banyak biji gandum serta jelai. {cite:Nuzhat-al-Mushtaq-2002 hlm. 569}"
