summary:
  ar: "مدينة أزلية لها سور منيع، وأكثر فواكهها الكروم وشجر الزيتون، وتبعد عن قنطرة السيف مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 547}"
  en: "An ancient town with a strong wall, where vines and olive trees are most common; two stages from the Sayf bridge. {cite:nuzhat-al-mushtaq-2002 p. 547}"
  es: "Un pueblo antiguo con una sólida muralla, donde abundan las vides y los olivos; a dos etapas del puente de Sayf. {cite:nuzhat-al-mushtaq-2002 p. 547}"
  fr: "Une ville ancienne entourée de remparts imposants, où les vignes et les oliviers sont très répandus; à deux étapes du pont de Sayf. {cite:nuzhat-al-mushtaq-2002 p. 547}"
  ur: "ایک قدیم شہر جس کی دیوار مضبوط ہے، جہاں انگور اور زیتون کے درخت سب سے زیادہ عام ہیں۔ سیف پل سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 547}"
  tr: "Güçlü bir duvara sahip ebedi bir şehirdir; meyvelerinin çoğu bağlar ve zeytin ağaçlarıdır ve Seif köprüsüne iki aşama uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 547}"
  id: "Kota abadi dengan tembok yang kuat, sebagian besar buahnya adalah kebun anggur dan pohon zaitun, dan berjarak dua tahap dari jembatan Seif. {cite:nuzhat-al-mushtaq-2002 hlm. 547}"
