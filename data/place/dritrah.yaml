summary:
  ar: "مدينة فسيحة عامرة الأسواق كثيرة الأرزاق جليلة المباني، ويذكر المؤلف أنها تبعد شرقا يوما ونصفا عن سبست قسترو {cite:nuzhat-al-mushtaq-2002 p. 897}."
  en: "A wide city with busy markets, abundant provisions and notable buildings; the author gives one and a half days east of Sabst Qastro {cite:nuzhat-al-mushtaq-2002 p. 897}."
  es: "Una ciudad extensa con mercados bulliciosos, provisiones abundantes y edificios notables; el autor indica que se encuentra a un día y medio al este de Sabst Qastro {cite:nuzhat-al-mushtaq-2002 p. 897}."
  fr: "Une grande ville avec des marchés animés, des provisions abondantes et des bâtiments remarquables; l'auteur donne un jour et demi à l'est de Sabst Qastro {cite:nuzhat-al-mushtaq-2002 p. 897}."
  ur: "ایک وسیع شہر جس میں مصروف بازار، وافر سامان اور قابل ذکر عمارتیں ہیں۔ مصنف سبست قسطرو کے مشرق میں ڈیڑھ دن بتاتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 897}۔"
  tr: "Bol geçim kaynakları ve görkemli binalarla dolu geniş, hareketli bir şehir. Yazar, Sebast Castro'nun bir buçuk gün doğusunda olduğunu belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 897}."
  id: "Kota yang luas dan ramai dengan pasar dengan mata pencaharian yang melimpah dan bangunan megah. Penulis menyebutkan bahwa kota ini berjarak satu setengah hari di sebelah timur Sebast Castro {cite:Nuzhat-al-Mushtaq-2002, hlm. 897}."
