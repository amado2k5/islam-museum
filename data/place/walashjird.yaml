  ar: "مدينة عامرة صغيرة القدر كثيرة العمارة، ويذكرها الإدريسي على طريق هرمز، وتبعد عن مغون مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 439}"
  en: "A small, populous and densely built town on the Hormuz road, one stage from Mughun. {cite:nuzhat-al-mushtaq-2002 p. 439}"
