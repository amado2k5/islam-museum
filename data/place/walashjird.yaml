  ur: "ہرمز روڈ پر ایک چھوٹا، آبادی والا اور گنجان تعمیر شدہ قصبہ، موگن سے ایک مرحلے پر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 439}"
  tr: "Hürmüz güzergahı üzerinde al-Idrisi tarafından bahsedilen, küçük büyüklükte ve çok sayıda binaya sahip, Maghoun'dan bir aşamada uzakta yer alan zengin bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 439}"
  id: "Kota yang makmur dengan ukuran kecil dan banyak bangunan, yang disebutkan oleh al-Idrisi di rute Hormuz, terletak jauh dari Maghoun dalam fase tertentu. {cite:nuzhat-al-mushtaq-2002 hlm. 439}"
