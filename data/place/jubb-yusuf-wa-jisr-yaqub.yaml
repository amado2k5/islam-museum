summary:
  ar: "معْلمان متجاوران ببلاد صفد: جبّ يوسف قرب قرية شورا، ويدانيه جسر يعقوب المعروف المشهور — عدّهما ابن فضل الله العمري في آثار الشام {cite:umari-masalik-1924 p. 231}."
  en: "Twin landmarks of the Safed country — Joseph's Pit by the village of Shura and, beside it, the famous Jacob's Bridge — both counted by al-Umari among the monuments of Syria {cite:umari-masalik-1924 p. 231}."
  es: "Dos lugares emblemáticos del país de Safed —el Pozo de José, cerca del pueblo de Shura, y, junto a él, el famoso Puente de Jacob— fueron incluidos por al-Umari entre los monumentos de Siria {cite:umari-masalik-1924 p. 231}."
  fr: "Deux sites emblématiques de la région de Safed — la fosse de Joseph près du village de Shura et, à côté, le célèbre pont de Jacob — tous deux comptés par al-Umari parmi les monuments de Syrie {cite:umari-masalik-1924 p. 231}."
  ur: "سفید ملک کے جڑواں نشانات - شوری گاؤں کے پاس جوزف کا گڑھا اور اس کے ساتھ ہی مشہور یعقوب کا پل - دونوں کو العماری نے شام کی یادگاروں میں شمار کیا ہے۔ 231}۔"
  tr: "Safad topraklarında bitişik iki simge yapı: Şura köyü yakınlarındaki Jeb Yusuf, ünlü Yakup Köprüsü'nün yanında — İbn Fadlallah el-Omari tarafından Levant Antikaları'nda sayılmıştır {cite:umari-masalik-1924, s. 231}."
  id: "Dua landmark yang berdekatan di tanah Safad: Jeb Yusuf dekat desa Shura, bersebelahan dengan Jembatan Jacob yang terkenal — dihitung oleh Ibn Fadlallah al-Omari dalam Antiquities of the Levant {cite:umari-masalik-1924, hlm. 231}."
