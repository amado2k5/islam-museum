summary:
  ar: "مدينة ليست كبيرة تقع على بعد يومين جنوب القصبة، أهلها ميسورون ولهم إبل يسافرون بها، وأهم بضاعتهم الشب {cite:nuzhat-al-mushtaq-2002 p. 117}."
  en: "A town not large, two days south of al-Qasaba. Its people are prosperous, keep camels for travel, and their main trade is alum {cite:nuzhat-al-mushtaq-2002 p. 117}."
  es: "Un pueblo pequeño, situado a dos días al sur de al-Qasaba. Sus habitantes son prósperos, crían camellos para viajar y su principal actividad comercial es el alumbre {cite:nuzhat-al-mushtaq-2002 p. 117}."
  fr: "Une petite ville, à deux jours au sud d'al-Qasaba. Ses habitants sont prospères, élèvent des chameaux pour voyager et leur principal commerce est l'alun {cite:nuzhat-al-mushtaq-2002 p. 117}."
  ur: "القصبہ سے دو دن جنوب میں ایک قصبہ بڑا نہیں ہے۔ اس کے لوگ خوشحال ہیں، سفر کے لیے اونٹ رکھتے ہیں، اور ان کی اصل تجارت پھٹکڑی ہے۔ 117}۔"
