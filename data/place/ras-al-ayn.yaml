summary:
  ar: "رأس العين — وهي عين الوردة — من مدن الجزيرة على الخابور؛ امتنعت على إياد بن غنم ففتحها عمير بن سعد عنوة بعد قتال شديد بالعرادات ثم صالح أهلها على الأرض لهم والجزية على الرؤوس أربعة دنانير ولم تسب نساؤهم ولا أولادهم وصاح بهم «لا بأس إليّ إليّ» أماناً؛ وجلا خلق من أهلها فاعتمل المسلمون أواضيهم وازدروها بإقطاع."
  en: "Ra's al-Ayn — that is Ayn al-Warda — of the Jazira cities on the Khabur; it resisted Iyad ibn Ghanm, and Umayr ibn Sa'd took it by force after bitter fighting under mangonels, then compounded with its people — the land theirs, four dinars' jizya on each head, no women or children taken — crying 'no harm, to me, to me' as their aman; a body of them departed and the Muslims worked and sowed their fields by land-grant."
  es: "Ra's al-Ayn — es decir, Ayn al-Warda — de las ciudades de Jazira en el Khabur; resistió a Iyad ibn Ghanm, y Umayr ibn Sa'd la tomó por la fuerza después de una dura lucha bajo mangoneles, luego llegó a un acuerdo con su gente — la tierra para ellos, cuatro dinares de jizya por cada cabeza, sin tomar mujeres ni niños — gritando 'no me harán daño, a mí, a mí' como su aman; un grupo de ellos partió y los musulmanes trabajaron y sembraron sus campos por concesión de tierras."
  fr: "Ra's al-Ayn — c'est-à-dire Ayn al-Warda — des villes de la Jazira sur le Khabur; elle résista à Iyad ibn Ghanm, et Umayr ibn Sa'd la prit par la force après de violents combats sous les mangonneaux, puis conclut un pacte avec ses habitants — la terre leur appartenait, quatre dinars de jizya par tête, aucune femme ni enfant n'était emmené — criant « pas de mal, à moi, à moi » comme leur aman; une partie d'entre eux partit et les musulmans travaillèrent et semèrent leurs champs grâce à une concession de terres."
  ur: "راس العین — یعنی عین الوردہ — خبور پر جزیرہ کے شہروں کا۔ اس نے عیاض بن غنم کی مزاحمت کی، اور عمیر بن سعد نے منگولوں کے نیچے تلخ لڑائی کے بعد اسے زبردستی لے لیا، پھر اس کے لوگوں کے ساتھ گھل مل گئے - زمین ان کی، ہر ایک کے سر پر چار دینار جزیہ، کوئی عورت یا بچہ نہیں لیا گیا - اپنی امان کے طور پر 'مجھے کوئی نقصان نہیں پہنچا'۔ ان میں سے ایک لاش چلی گئی اور مسلمانوں نے زمین دے کر کام کیا اور اپنے کھیت بوئے۔"
  tr: "Ras al-'Ain — Ain al-Warda olarak da bilinir — Cazire'nin Khabur Nehri üzerindeki şehirlerinden biridir; Iyad bin Ghanam tarafından direnildi, ancak Umayr bin Sa'd Al-Aradat'taki şiddetli çatışmalardan sonra zorla ele geçirdi. Sonra halkı topraklarıyla barıştı ve başlarındaki cizye dört dinar oldu. Kadınlarına ya da çocuklarına hakaret etmediler ve o da güvenlikten dolayı 'Bana zarar yok' diye bağırdı. Halkı arasında büyük bir kalabalık oluştu, bu yüzden Müslümanlar tam anlamıyla yıkanıp toprakları küçümsediler."
  id: "Ras al-'Ain — juga dikenal sebagai Ain al-Warda — adalah salah satu kota di Jazira di Sungai Khabur; kota ini ditentang oleh Iyad ibn Ghanam, tetapi Umayr ibn Sa'd merebutnya secara paksa setelah pertempuran sengit di Al-Aradat. Kemudian rakyatnya berdamai dengan tanah mereka, dan jizya di kepala adalah empat dinar. Mereka tidak menghina wanita atau anak-anak mereka, dan dia berteriak kepada mereka, 'Tidak ada bahaya bagi saya,' demi keamanan. Sebuah kerumunan besar terbentuk di antara rakyatnya, sehingga umat Muslim mandi penuh dan meremehkannya dengan wilayah."
