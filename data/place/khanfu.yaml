summary:
  ar: "مدينة في أقصى بلاد الصين، تبعد عن مدينة خانكو مسيرة ثمانية أيام، ويذكر المؤلف أنه سيصفها في الجزء العاشر {cite:nuzhat-al-mushtaq-2002 p. 85}. وعند ابن خرداذبه: خانفو المرقى الأكبر لسفن الصين فيها الفواكه كلها والبقول والحنطة والشعير والأرز وقصب السكر، وكل مرقى من مراقي الصين نهر عظيم تدخله السفن فيه المد والجزر، والصين ثلاثمائة مدينة عامرة منها تسعون مشهورة {cite:masalik-mamalik-ibn-khurdadhbih p. 77}."
  en: "A city at the far edge of China, eight days' journey from Khanku. The author says he will describe it in the tenth section {cite:nuzhat-al-mushtaq-2002 p. 85}."
