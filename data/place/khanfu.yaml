summary:
  ar: "مدينة في أقصى بلاد الصين، تبعد عن مدينة خانكو مسيرة ثمانية أيام، ويذكر المؤلف أنه سيصفها في الجزء العاشر {cite:nuzhat-al-mushtaq-2002 p. 85}. وعند ابن خرداذبه: خانفو المرقى الأكبر لسفن الصين فيها الفواكه كلها والبقول والحنطة والشعير والأرز وقصب السكر، وكل مرقى من مراقي الصين نهر عظيم تدخله السفن فيه المد والجزر، والصين ثلاثمائة مدينة عامرة منها تسعون مشهورة {cite:masalik-mamalik-ibn-khurdadhbih p. 77}."
  en: "A city at the far edge of China, eight days' journey from Khanku. The author says he will describe it in the tenth section {cite:nuzhat-al-mushtaq-2002 p. 85}."
  es: "Una ciudad en el extremo más alejado de China, a ocho días de viaje desde Khanku. El autor dice que la describirá en la décima sección {cite:nuzhat-al-mushtaq-2002 p. 85}."
  fr: "Une ville située à l'extrême périphérie de la Chine, à huit jours de voyage de Khanku. L'auteur indique qu'il la décrira dans la dixième section {cite:nuzhat-al-mushtaq-2002 p. 85}."
  ur: "چین کے دور دراز کا ایک شہر، خانکو سے آٹھ دن کا سفر۔ مصنف کا کہنا ہے کہ وہ اسے دسویں حصے میں بیان کریں گے۔ 85}۔"
  tr: "Çin'in en uç noktasında, Khankou şehrine sekiz günlük yolculuk mesafesinde bir şehirdir ve yazar burayı onuncu bölümde anlatacağını belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 85}. İbn Khordadbeh'e göre: Çin gemilerinin en büyük limanı olan Khanfu, tüm meyveler, baklagiller, buğday, arpa, pirinç ve şeker kamışı içerir. Çin limanlarının her limanı, gelgitlerle girilen gemilerle girilen büyük bir nehirdir. Çin'in üç yüz zengin şehri vardır ve bunların doksanı ünlüdür {cite:masalik-mamalik-ibn-khurdadhbih s. 77}."
  id: "Sebuah kota di ujung jauh Tiongkok, delapan hari perjalanan dari kota Khankou, dan penulis menyebutkan bahwa ia akan menggambarkannya di bagian kesepuluh {cite:Nuzhat-al-Mushtaq-2002 hlm. 85}. Menurut Ibn Khordadbeh: Khanfu, pelabuhan terbesar kapal Tiongkok, berisi semua buah, kacang-kacangan, gandum, jelai, beras, dan tebu. Setiap pelabuhan di pelabuhan Tiongkok adalah sungai besar yang dimasuki oleh kapal dengan pasang surut. Tiongkok memiliki tiga ratus kota makmur, sembilan puluh di antaranya terkenal {cite:masalik-mamalik-ibn-khurdadhbih hlm. 77}."
