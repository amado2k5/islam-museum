summary:
  ar: "مدينة على ضفة المفازة الكبيرة، بها خصب وزراعات ومدابغ للجلود، وتصنع بها البطائن الزرندية التي تُحمل إلى العراق وربما إلى مصر. {cite:nuzhat-al-mushtaq-2002 p. 439}"
  en: "A town on the edge of the great desert, with fertility, farming and tanneries, where the Zarandi linings are made and carried to Iraq and sometimes to Egypt. {cite:nuzhat-al-mushtaq-2002 p. 439}"
  es: "Un pueblo al borde del gran desierto, fértil, con agricultura y curtidurías, donde se fabrican los forros Zarandi que se exportan a Irak y, en ocasiones, a Egipto. {cite:nuzhat-al-mushtaq-2002 p. 439}"
  fr: "Une ville en bordure du grand désert, prospère grâce à ses terres fertiles, son agriculture et ses tanneries, où sont fabriqués les tissus Zarandi, exportés ensuite vers l'Irak et parfois vers l'Égypte. {cite:nuzhat-al-mushtaq-2002 p. 439}"
  ur: "عظیم صحرا کے کنارے پر واقع ایک قصبہ، جس میں زرخیزی، کھیتی باڑی اور ٹینریز ہیں، جہاں زرندی استر بنائے جاتے ہیں اور عراق اور کبھی کبھی مصر لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 439}"
