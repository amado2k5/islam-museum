summary:
  ar: "بيمنذ بلد بكرمان؛ هلك به جيش مجاشع بن مسعود أولاً ثم فتحه عنوة واستبقى أهله وأعطاهم أماناً وبها قصر يعرف بقصر مجاشع."
  en: "Bimand of Kirman; Mujashi's army first perished there, then he took it by force, spared its folk on aman — Qasr Mujashi' stands in it."
  es: "Bimand de Kirman; el ejército de Mujashi pereció allí primero, luego él lo tomó por la fuerza, perdonó a su gente en aman; Qasr Mujashi' se encuentra allí."
  fr: "Bimand de Kirman; l'armée de Mujashi y périt d'abord, puis il s'en empara par la force, épargnant ses habitants sur aman — Qasr Mujashi s'y tient."
  ur: "کرمان کا بیمند؛ مجاشی کا لشکر پہلے وہاں مارا گیا، پھر اس نے اسے زبردستی چھین لیا، اس کے لوگوں کو امان پر چھوڑ دیا - اس میں قصر مجاشی کھڑا ہے۔"
  tr: "Bakraman kasabası, Majasha bin Mas'ud'un ordusu yok edildikten sonra zorla fethedildi, halkı tutuldu ve onlara güvenlik sağlandı. Burası aynı zamanda Majasha Sarayı olarak da bilinir."
  id: "Karena kota Bakraman, pasukan Majasha bin Mas'ud dihancurkan di sana, maka kota ini ditaklukkan secara paksa, penduduknya dipertahankan, dan kota ini memberikan keamanan bagi mereka. Istana ini juga dikenal sebagai Istana Majasha."
