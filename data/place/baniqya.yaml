summary:
  ar: "عند البلاذري: بلدة في السواد صالحها جرير بن عبد الله البجلي على ألف درهم وطيلسان وهي — مع الحيرة وأليس — إحدى البلدان الثلاث التي لأهل السواد فيها عهد بقول ابن مغفل المزني وقال ضرار بن الأزور فيها شعراً."
  en: "In al-Baladhuri: a Sawad town Jarir ibn Abdallah al-Bajali pacified on a thousand dirhams and a taylasan; with al-Hira and Ulays one of the only three Sawad towns holding a covenant, per Ibn Mughaffal al-Muzani; Dirar ibn al-Azwar versified on it."
  es: "En al-Baladhuri: la ciudad de Sawad, Jarir ibn Abdallah al-Bajali, pacificada con mil dirhams y un taylasan; siendo al-Hira y Ulays una de las tres únicas ciudades de Sawad que tienen un pacto, según Ibn Mughaffal al-Muzani; Dirar ibn al-Azwar versificó sobre ello."
  fr: "A al-Baladhuri: une ville Sawad Jarir ibn Abdallah al-Bajali pacifiée avec mille dirhams et un taylasan; avec al-Hira et Ulays, l'une des trois seules villes de Sawad à détenir une alliance, selon Ibn Mughaffal al-Muzani; Dirar ibn al-Azwar a fait des versifications à ce sujet."
  ur: "البلادوری میں ہے: ایک سواد ٹاؤن جریر ابن عبداللہ البجلی نے ایک ہزار درہم اور ایک طیلسان پر تسلی دی۔ الحیرہ اور الیاس کے ساتھ صرف تین سواد قصبوں میں سے ایک ہے جس میں ایک عہد ہے، فی ابن مغفل المزانی؛ درار بن الازور نے اس کی تصدیق کی ہے۔"
  tr: "Al-Baladhuri'ye göre: Jarir ibn Abdullah Al-Bajali tarafından bin dirhem ve Tilsan karşılığında yerleşimi yapılan Al-Sawad'da bir kasaba ve Al-Hirah ile Alis ile birlikte Al-Sawad halkının bir antlaşma yaptığı üç kasabadan biridir; burada şiir yazan İbn Muğfal El-Muzani'nin sözlerine göre."
  id: "Menurut Al-Baladhuri: sebuah kota di Al-Sawad yang pemukimannya dibuat oleh Jarir ibn Abdullah Al-Bajali seharga seribu dirham dan Tilsan, dan ini — bersama Al-Hirah dan Alis — adalah salah satu dari tiga kota di mana masyarakat Al-Sawad memiliki perjanjian, menurut kata-kata Ibn Mughafal Al-Muzani, yang menulis puisi di sana."
