  ar: "مدينة صغيرة من أرض كوار على تل صغير في جبل منيع، لها نخيل ومواش، ولا سور لها، وشربهم من آبار عميقة الماء."
  en: "A small town in the land of Kawar on a small hill within a rugged mountain. It has palms and livestock, no wall, and its people drink from deep wells."
  es: "Un pequeño pueblo en la tierra de Kawar, en una pequeña colina en medio de una escarpada montaña. Tiene palmeras y ganado, no tiene murallas y sus habitantes beben de pozos profundos."
  fr: "Un petit village du pays de Kawar, perché sur une colline au cœur d'une montagne escarpée. On y trouve des palmiers et du bétail, aucun mur d'enceinte, et ses habitants s'abreuvent à des puits profonds."
