summary:
  ar: "أرّان من بلاد أرمينية الأولى وكانت في أيدي الخزر؛ وطئها قائد قباذ بن فيروز في اثني عشر ألفاً وفتح ما بين نهر الرس إلى شروان وبنى فيها قباذ البيلقان وبرذعة وقبلة وسد اللبن؛ وكان سلمان بن ربيعة الباهلي مأموراً بغزوها من عثمان بعد أمر الغنيمة بقاليقلا."
  en: "Arran, of the first Armenia's lands and then in Khazar hands; Qubadh ibn Fayruz's general trod it with twelve thousand, taking what lay between the river al-Rass and Shirwan, where Qubadh built al-Baylaqan, Bardha'a, Qabala and the wall of al-Lubn; Salman ibn Rabi'a al-Bahili was ordered by Uthman to raid it after the spoils affair at Qaliqala."
