summary:
  ar: "أرّان من بلاد أرمينية الأولى وكانت في أيدي الخزر؛ وطئها قائد قباذ بن فيروز في اثني عشر ألفاً وفتح ما بين نهر الرس إلى شروان وبنى فيها قباذ البيلقان وبرذعة وقبلة وسد اللبن؛ وكان سلمان بن ربيعة الباهلي مأموراً بغزوها من عثمان بعد أمر الغنيمة بقاليقلا."
  en: "Arran, of the first Armenia's lands and then in Khazar hands; Qubadh ibn Fayruz's general trod it with twelve thousand, taking what lay between the river al-Rass and Shirwan, where Qubadh built al-Baylaqan, Bardha'a, Qabala and the wall of al-Lubn; Salman ibn Rabi'a al-Bahili was ordered by Uthman to raid it after the spoils affair at Qaliqala."
  es: "Arran, que perteneció primero a Armenia y luego estuvo en manos jázaras; el general de Qubadh ibn Fayruz la recorrió con doce mil hombres, tomando lo que se extendía entre los ríos al-Rass y Shirwan, donde Qubadh construyó al-Baylaqan, Bardha'a, Qabala y la muralla de al-Lubn; Uthman ordenó a Salman ibn Rabi'a al-Bahili que la saqueara después del asunto del botín en Qaliqala."
  fr: "Arran, qui faisait partie des premières terres arméniennes puis était aux mains des Khazars; le général de Qubadh ibn Fayruz la parcourut avec douze mille hommes, prenant ce qui se trouvait entre le fleuve al-Rass et Shirwan, où Qubadh construisit al-Baylaqan, Bardha'a, Qabala et le mur d'al-Lubn; Salman ibn Rabi'a al-Bahili reçut l'ordre d'Uthman de la piller après l'affaire du butin à Qaliqala."
  ur: "اران، پہلے آرمینیا کی سرزمین اور پھر خزر کے ہاتھ میں؛ قبادہ بن فیروز کے جرنیل نے اسے بارہ ہزار کے ساتھ پیدل کیا، جو دریائے الراس اور شیروان کے درمیان پڑا تھا، جہاں قباد نے البیلقان، بردعا، قبلہ اور اللبن کی دیوار بنائی۔ سلمان بن ربیعہ الباہلی کو عثمان نے قلیقلہ میں لوٹ مار کے بعد اس پر چھاپہ مارنے کا حکم دیا تھا۔"
  tr: "Aran, erken Ermeni topraklarından biriydi ve Hazar kontrolündeydi; Kaid Qubad bin Fairuz on iki bin kişiyle geçti ve Ars Nehri ile Şirvan arasındaki bölgeyi fethetti; burada Qobad al-Bilqan, Bardha'a, Qiblah ve Luban Barajı'nı inşa etti. Salman ibn Rabi'ah al-Bahili, Kaliqla'nın ganimetlerini emrettikten sonra Osman tarafından burayı işgal etmesi emredildi."
  id: "Aran adalah salah satu wilayah Armenia awal dan berada di bawah kendali Khazar; Qaid Qubad ibn Fairuz menyeberanginya dalam dua belas ribu tahun dan menaklukkan wilayah antara Sungai Ars dan Shirwan, di mana ia membangun Qobad al-Bilqan, Bardha'a, Qiblah, dan Bendungan Luban. Salman ibn Rabi'ah al-Bahili diperintahkan oleh Uthman untuk menyerbu wilayah tersebut setelah memerintahkan rampasan Qaliqla."
