summary:
  ar: "إقليم في غرب أفريقيا سُمّي بالقائد الفولاني مودبو آدم الذي قاد الجهاد الفولاني سنة 1809؛ يشمل شمال شرق نيجيريا وأجزاء من الكاميرون، وبنى فيه الفولانيون إمارات تابعة ليولا، وأصبح بريطانيا وألمانيا الحكم فيه بداية القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 198}."
  en: "A region of West Africa named after the Fulani leader Modibbo Adama, who led the Fulani jihad there in 1809. It covers north-east Nigeria and parts of Cameroon. The Fulani built a system of fiefs with Yola as the capital, and the British and German occupations came early in the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 198}."
