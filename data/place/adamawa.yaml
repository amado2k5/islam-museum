  ur: "ادماوا"
summary:
  ar: "إقليم في غرب أفريقيا سُمّي بالقائد الفولاني مودبو آدم الذي قاد الجهاد الفولاني سنة 1809؛ يشمل شمال شرق نيجيريا وأجزاء من الكاميرون، وبنى فيه الفولانيون إمارات تابعة ليولا، وأصبح بريطانيا وألمانيا الحكم فيه بداية القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 198}."
  en: "A region of West Africa named after the Fulani leader Modibbo Adama, who led the Fulani jihad there in 1809. It covers north-east Nigeria and parts of Cameroon. The Fulani built a system of fiefs with Yola as the capital, and the British and German occupations came early in the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 198}."
  es: "Una región de África Occidental que recibe su nombre del líder fulani Modibbo Adama, quien dirigió la yihad fulani allí en 1809. Abarca el noreste de Nigeria y partes de Camerún. Los fulani establecieron un sistema de feudos con Yola como capital, y las ocupaciones británica y alemana llegaron a principios del siglo XX {cite:encyclopaedia-of-islam-2 vol. 1 p. 198}."
  fr: "Une région d'Afrique de l'Ouest qui porte le nom du chef peul Modibbo Adama, qui y mena le djihad peul en 1809. Elle couvre le nord-est du Nigéria et une partie du Cameroun. Les Peuls y établirent un système de fiefs avec Yola pour capitale. Les occupations britannique et allemande eurent lieu au début du XXe siècle."
  ur: "مغربی افریقہ کا ایک خطہ جس کا نام فولانی رہنما موڈیبو اداما کے نام پر رکھا گیا، جس نے وہاں 1809 میں فولانی جہاد کی قیادت کی۔ یہ شمال مشرقی نائیجیریا اور کیمرون کے کچھ حصوں پر محیط ہے۔ فولانی نے یولا کو دار الحکومت کے طور پر جاگیروں کا ایک نظام بنایا، اور برطانوی اور جرمن قبضے 20ویں صدی کے اوائل میں آئے۔ 1 ص۔ 198}۔"
