label: { ar: "النيل", en: "al-Nil", es: "al-Nil", fr: "al-Nil", ur: "النیل", tr: "Nil", id: "Nil" }
summary:
  ar: "مدينة بالسواد؛ عند البلاذري احتفر الحجاج نهر النيل والزابي وسماه زابياً لأخذه من الزابي القديم وأحيا ما عليهما من الأرضين وأحدث المدينة التي تعرف بالنيل ومصرها."
  en: "A town in the Sawad; in al-Baladhuri al-Hajjaj dug the Nil and Zabi canals — naming the latter for the old Zabi — revived their lands, and founded and garrisoned the city called al-Nil."
  es: "Una ciudad en Sawad; en al-Baladhuri al-Hajjaj excavó los canales Nil y Zabi —nombrando este último en honor al antiguo Zabi— revitalizó sus tierras y fundó y guarneció la ciudad llamada al-Nil."
  fr: "Une ville du Sawad; à al-Baladhuri, al-Hajjaj creusa les canaux du Nil et du Zabi — nommant ce dernier d'après l'ancien Zabi — revitalisa ses terres et fonda et garnit la ville appelée al-Nil."
  ur: "سواد کا ایک قصبہ؛ البلادھوری میں الحجاج نے نیل اور زابی نہریں کھودیں - جسے بعد میں پرانے زبی کا نام دیا گیا - اپنی زمینوں کو زندہ کیا، اور النیل نامی شہر کی بنیاد رکھی اور اس کی حفاظت کی۔"
  tr: "Siyah renkli bir şehir; al-Baladhuri'ye göre, hacılar Nil ve Zabi nehirlerini kazıp eski Zabi'den almak için Zabiya adını verdiler, üzerlerindeki toprakları canlandırdılar ve Nil ile Mısır olarak bilinen şehri yenilediler."
  id: "Sebuah kota berwarna hitam; menurut al-Baladhuri, para peziarah menggali sungai Nil dan Zabi dan menamainya Zabiya untuk diambil dari Zabi lama, menghidupkan kembali tanah di sekitarnya dan merenovasi kota yang dikenal sebagai Sungai Nil dan Mesirnya."
