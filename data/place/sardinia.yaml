summary:
  ar: "جزيرة كبيرة القطر كثيرة الجبال والمعادن، فيها مدن منها مدينة عامرة في جنوبها، وفيها معادن الفضة، ويذكرها الإدريسي بين جزيرة منورقة وجزيرة قرشقة. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  en: "A large island of many mountains and mines, with a populous city in its south and silver deposits; al-Idrisi places it between Minorca and Corsica. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  es: "Una gran isla con numerosas montañas y minas, una ciudad populosa en su sur y yacimientos de plata; al-Idrisi la sitúa entre Menorca y Córcega. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  fr: "Une grande île montagneuse et minière, abritant une ville importante au sud et des gisements d'argent; al-Idrisi la situe entre Minorque et la Corse. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  ur: "بہت سے پہاڑوں اور کانوں کا ایک بڑا جزیرہ، جس کے جنوب میں ایک آبادی والا شہر اور چاندی کے ذخائر۔ الادریسی اسے منورکا اور کورسیکا کے درمیان رکھتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 584}"
  tr: "Çapı büyük, dağlar ve mineraller açısından zengin, güneyinde gelişen bir şehir bulunan şehirler bulunan ve gümüş mineralleri barındıran bir adadır. Al-Idrisi, burayı Menora Adası ile Qarshaqa Adası arasında bir bağlantı olarak tanımlar. {cite:nuzhat-al-mushtaq-2002 s. 584}"
  id: "Pulau ini adalah pulau besar berdiameter, kaya akan pegunungan dan mineral, dengan kota-kota termasuk kota yang berkembang di sebelah selatannya, dan mengandung mineral perak. Al-Idrisi menyebutnya sebagai penghubung antara Pulau Menora dan Pulau Qarshaqa. {cite:Nuzhat-al-Mushtaq-2002 hlm. 584}"
