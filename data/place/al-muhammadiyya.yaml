summary:
  ar: "المدينة التي بناها المهدي بالري سنة ثمان وخمسين ومائة وأحاطها بخندق وجمل لها فصيلاً بطيف به فارقين أجر وسمّاها المحمدية فصار أهل الري يدعون المدينة الداخلة والفصيل المدينة الخارجة ودخل فيها حصن الزنبدي ونزل بعد بنائها آل لحريش وكان الري القديمة تدعى في الجاهلية أرازي ويقال إنه خسف بها وهي على ست فراسخ من المحمدية وبها سمّيت الري."
  en: "The city al-Mahdi built at Rayy in 158 AH, moated and girded with a fired-brick suburb, which Rayy's people then called the inner city versus the outer walled town; Hisn al-Zaynabi fell inside it and the Lahirish family settled after its building; the old Rayy, called Arazi in Jahiliyya and said to have been swallowed, lay six farsakhs off and gave Rayy its name."
  es: "La ciudad que al-Mahdi construyó en Rayy en el año 158 de la Hégira, rodeada por un foso y un suburbio de ladrillo cocido, al que los habitantes de Rayy llamaban entonces la ciudad interior, en contraposición a la ciudad amurallada exterior; Hisn al-Zaynabi quedó dentro de ella y la familia Lahirish se estableció allí después de su construcción; la antigua Rayy, llamada Arazi en la época preislámica y que se decía que había sido engullida, se extendía a seis farsakhs de distancia y dio nombre a Rayy."
  fr: "La ville qu'al-Mahdi fit construire à Rayy en 158 AH, entourée de douves et d'une banlieue en briques cuites, que les habitants de Rayy appelaient alors la ville intérieure par opposition à la ville fortifiée extérieure; Hisn al-Zaynabi se trouvait à l'intérieur et la famille Lahirish s'y installa après sa construction; l'ancien Rayy, appelé Arazi à l'époque préislamique et que l'on disait avoir été englouti, s'étendait sur six farsakhs et donna son nom à Rayy."
