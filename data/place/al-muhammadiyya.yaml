summary:
  ar: "المدينة التي بناها المهدي بالري سنة ثمان وخمسين ومائة وأحاطها بخندق وجمل لها فصيلاً بطيف به فارقين أجر وسمّاها المحمدية فصار أهل الري يدعون المدينة الداخلة والفصيل المدينة الخارجة ودخل فيها حصن الزنبدي ونزل بعد بنائها آل لحريش وكان الري القديمة تدعى في الجاهلية أرازي ويقال إنه خسف بها وهي على ست فراسخ من المحمدية وبها سمّيت الري."
  en: "The city al-Mahdi built at Rayy in 158 AH, moated and girded with a fired-brick suburb, which Rayy's people then called the inner city versus the outer walled town; Hisn al-Zaynabi fell inside it and the Lahirish family settled after its building; the old Rayy, called Arazi in Jahiliyya and said to have been swallowed, lay six farsakhs off and gave Rayy its name."
