summary:
  ar: "مدينة في أرض فزان، ويذكر المؤلف أن الطريق منها إلى أودغست نحو خمس وعشرين مرحلة، وأن السودان يسمون تساوة الصغرى بجرمي الصغرى، وأن مياهها من الآبار، ويزرعون فيها الذرة والشعير {cite:nuzhat-al-mushtaq-2002 p. 108}، {cite:nuzhat-al-mushtaq-2002 p. 112}."
  en: "A city in Fezzan. The author gives about twenty-five stages from it to Awdaghast. Its water comes from wells, and its people grow millet and barley. It stands near Tasawa {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
