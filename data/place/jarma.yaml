summary:
  ar: "مدينة في أرض فزان، ويذكر المؤلف أن الطريق منها إلى أودغست نحو خمس وعشرين مرحلة، وأن السودان يسمون تساوة الصغرى بجرمي الصغرى، وأن مياهها من الآبار، ويزرعون فيها الذرة والشعير {cite:nuzhat-al-mushtaq-2002 p. 108}، {cite:nuzhat-al-mushtaq-2002 p. 112}."
  en: "A city in Fezzan. The author gives about twenty-five stages from it to Awdaghast. Its water comes from wells, and its people grow millet and barley. It stands near Tasawa {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
  es: "Una ciudad en Fezzan. El autor indica que hay aproximadamente veinticinco etapas desde allí hasta Awdaghast. Su agua proviene de pozos y sus habitantes cultivan mijo y cebada. Se encuentra cerca de Tasawa {cite:nuzhat-al-mushtaq-2002 p. 108}, {cite:nuzhat-al-mushtaq-2002 p. 112}."
  fr: "Une ville du Fezzan. L'auteur décrit une vingtaine d'étapes pour atteindre Awdaghast. Son eau provient de puits et ses habitants cultivent le millet et l'orge. Elle se situe près de Tasawa (voir nuzhat-al-mushtaq, 2002, p. 108 et 112)."
  ur: "فیضان کا ایک شہر۔ مصنف نے اس سے اوداغست تک تقریباً پچیس مراحل بتائے ہیں۔ اس کا پانی کنوؤں سے آتا ہے، اور اس کے لوگ باجرا اور جو اگاتے ہیں۔ یہ تسوا کے قریب کھڑا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 108}، {حوالہ: نزہت المشتاق-2002 ص۔ 112}۔"
  tr: "Fezzan diyarında bir şehir. Yazar, oradan Odghast'a giden yolun yaklaşık yirmi beş aşama olduğunu, Sudan'ın Jurmi al-Sughra tarafından Küçük Ekinoks olarak adlandırıldığını, sularının ise mısır ve arpa yetiştirilen kuyulardan geldiğini belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 108}, {cite:Nuzhat-al-Mushtaq-2002, s. 112}."
  id: "Sebuah kota di tanah Fezzan. Penulis menyebutkan bahwa jalan dari sana ke Odghast memiliki sekitar dua puluh lima tahap, dan Sudan disebut Ekuinoks Kecil oleh Jurmi al-Sughra, dan airnya berasal dari sumur, tempat jagung dan jelai ditanam {cite:Nuzhat-al-Mushtaq-2002, hlm. 108}, {cite:Nuzhat-al-Mushtaq-2002, hlm. 112}."
