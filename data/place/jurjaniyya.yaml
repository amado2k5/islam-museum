summary:
  ar: "جرجانية التي سماها العربُ جرجانية ووُصفت نحو سنة ٦٠٠هـ/١٢٠٠م بأنها «خوارزم» مثل الإقليم نفسه: المركز الاقتصادي لخوارزم وعاصمتها السياسية زماناً طويلاً، غرب أسفل مجرى جيحون (آمو دريا). فتحها العرب سنة ٩٣هـ/٧١٢م، وبعد إسقاط السلاجقة خلفاء المأمونيين سنة ٤٣٤هـ/١٠٤٣م فاقت كث أهميةً وصارت مركز الإقليم الحقيقي وواسطة تجارته مع الأتراك الشماليين. هاجمها المغول سنة ٦١٨هـ/١٢٢١م ودمّروها بعد حصار طويل {cite:encyclopaedia-of-islam-2 vol. 2 p. 1192-1193}. إليها انتقل الزمخشري من بلدته زمخشر فكانت داره الدائمة، وفيها توفي سنة ٥٣٨هـ/١١٤٤م ودُفن قربها {cite:encyclopaedia-of-islam-2 vol. 12 p. 917-918}."
  en: "Jurjaniyya — Gurgandj to the Persians and, around 600/1200, simply 'Khwarazm' like the surrounding country — was the economic centre of Khwarazm and for long its political capital, lying west of the lowest reaches of the Oxus (Amu Darya). Captured by the Arabs in 93/712, it outstripped Kath in importance after the Seljuks overthrew the Ma'munid shahs in 434/1043, becoming the real centre of the territory and its commercial intermediary with the northern Turkish tribes. The Mongols attacked it in 618/1221 and razed it after a siege of many months {cite:encyclopaedia-of-islam-2 vol. 2 p. 1192-1193}. Al-Zamakhshari moved here from Zamakhshar and it became his permanent home; he died there in 538/1144 and was buried near the town {cite:encyclopaedia-of-islam-2 vol. 12 p. 917-918}."
  ur: "جرجانیہ — جسے فارسیوں نے گرگانج اور عربوں نے جرجانیہ کہا، اور 600ھ/1200ء کے قریب اسے اقليم خوارزم کی طرح «خوارزم» ہی کہا جانے لگا — خوارزم کا معاشی مرکز اور طویل عرصے تک اس کا سیاسی دارالحکومت تھا، جو دریائے جیحون (آمو دریا) کے زیریں بہاؤ کے مغرب میں واقع تھا۔ 93ھ/712ء میں عربوں نے اسے فتح کیا؛ 434ھ/1043ء میں سلجوقیوں کے مامونی شاہوں کو گرانے کے بعد یہ کث سے بڑھ کر اہمیت حاصل کر گیا اور شمالی ترک قبائل سے تجارت کا واسطہ بنا۔ 618ھ/1221ء میں منگولوں نے اس پر حملہ کیا اور طویل محاصرے کے بعد اسے زمین بوس کر دیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 1192-1193}۔ زمخشری زمخشر سے یہاں منتقل ہوئے اور یہ ان کا مستقل گھر بنا؛ 538ھ/1144ء میں یہیں ان کی وفات ہوئی اور انہیں شہر کے قریب دفنایا گیا {cite:encyclopaedia-of-islam-2 vol. 12 p. 917-918}۔"
