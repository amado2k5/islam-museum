label: { ar: "إرنيي (أرنيدو)", en: "Arnedo (Irniy)" }
summary:
  ar: "بلدة صغيرة في إقليم لوغرونيو، على نهر سيداكوس أحد روافد نهر إبرو، تبعد نحو 35 كم عن لوغرونيو، ويبلغ عدد سكانها نحو 10,000 نسمة. وعدّها الإدريسي من أقاليم الأندلس، وفي سنة 308هـ (920م) اضطر شانجه بن غرسية إلى الاحتماء بها حين احتل عبد الرحمن الثالث كالاهورّا {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  en: "A small town in the province of Logroño, on the Cidacos, a tributary of the Ebro, about 35 km from Logroño, with about 10,000 inhabitants. Its Arabic form is Irniy. Al-Idrisi counted it among the climes of Muslim Spain, and in 308/920 'Abd al-Rahman III occupied Calahorra and forced Sancho Garces to take refuge in Arnedo {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
