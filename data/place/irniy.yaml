summary:
  ar: "بلدة صغيرة في إقليم لوغرونيو، على نهر سيداكوس أحد روافد نهر إبرو، تبعد نحو 35 كم عن لوغرونيو، ويبلغ عدد سكانها نحو 10,000 نسمة. وعدّها الإدريسي من أقاليم الأندلس، وفي سنة 308هـ ⁦(920م)⁩ اضطر شانجه بن غرسية إلى الاحتماء بها حين احتل عبد الرحمن الثالث كالاهورّا {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  en: "A small town in the province of Logroño, on the Cidacos, a tributary of the Ebro, about 35 km from Logroño, with about 10,000 inhabitants. Its Arabic form is Irniy. Al-Idrisi counted it among the climes of Muslim Spain, and in 308/920 'Abd al-Rahman III occupied Calahorra and forced Sancho Garces to take refuge in Arnedo {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  es: "Un pequeño pueblo de la provincia de Logroño, a orillas del Cidacos, afluente del Ebro, a unos 35 km de Logroño, con aproximadamente 10.000 habitantes. Su nombre en árabe es Irniy. Al-Idrisi lo incluyó entre los territorios de la España musulmana, y en el año 308/920, Abd al-Rahman III ocupó Calahorra y obligó a Sancho Garces a refugiarse en Arnedo {cite:encyclopaedia-of-islam-2 vol. 1 p. 707}."
  fr: "Calahorra est une petite ville de la province de Logroño, située sur le Cidacos, un affluent de l'Èbre, à environ 35 km de Logroño. Elle compte environ 10 000 habitants. Son nom arabe est Irniy. Al-Idrisi la comptait parmi les territoires de l'Espagne musulmane, et en 308/920, 'Abd al-Rahman III occupa Calahorra et contraignit Sancho Garces à se réfugier à Arnedo (source: Encyclopaedia of Islam, vol. 2, p. 707)."
  ur: "لوگروانو صوبے کا ایک چھوٹا سا قصبہ، سیڈاکوس پر، ایبرو کی ایک معاون ندی، لوگروانو سے تقریباً 35 کلومیٹر دور، جس میں تقریباً 10,000 باشندے ہیں۔ اس کی عربی شکل ارنی ہے۔ الادریسی نے اسے مسلم اسپین کے موسموں میں شمار کیا، اور 308/920 میں عبدالرحمٰن سوم نے کلہوررہ پر قبضہ کر لیا اور سانچو گارسز کو آرنیڈو میں پناہ لینے پر مجبور کر دیا۔ 1 ص۔ 707}۔"
  tr: "Logroño bölgesinde, Sidakos Nehri üzerinde, Ebru Nehri'nin bir kolu üzerinde, Logroño'ya yaklaşık 35 km uzaklıkta, yaklaşık 10.000 nüfuslu küçük bir kasabadır. İdrisiler burayı Endülüs'ün eyaletlerinden biri olarak görürlerdi ve 308 Hicri (M.S. 920) yılında, Abd al-Rahman III Calahura'yı işgal ettiğinde Changa ibn Garcia buraya sığınmak zorunda kalmıştır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 707}."
  id: "Sebuah kota kecil di wilayah Logroño, di Sungai Sidakos, anak sungai Sungai Ebru, sekitar 35 km dari Logroño, dengan populasi sekitar 10.000 jiwa. Orang Idrisi menganggapnya sebagai salah satu provinsi Andalusia, dan pada tahun 308 H (920 M), Changa ibn Garcia terpaksa berlindung di sana ketika Abd al-Rahman III menduduki Calahura {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 707}."
