summary:
  ar: "قبر منسوب إلى يونس بن متى بقرية حلحول على يسار الذاهب من القدس إلى الخليل؛ عليه بناء وقبة وله خادم، ويعرّج الزائر إليه؛ زاره ابن فضل الله العمري مرات آخرها في ذي الحجة سنة 745هـ {cite:umari-masalik-1924 p. 176}."
  en: "The tomb ascribed to Yunus ibn Matta at Halhul village, left of the Jerusalem-Hebron road, under a domed building with a keeper; pilgrims turn aside to it, and al-Umari visited repeatedly, last in Dhu al-Hijja 745 {cite:umari-masalik-1924 p. 176}."
  es: "La tumba atribuida a Yunus ibn Matta en la aldea de Halhul, a la izquierda del camino Jerusalén-Hebrón, bajo un edificio abovedado con un guardián; los peregrinos se desvían hacia ella, y al-Umari la visitó repetidamente, la última vez en Dhu al-Hijja 745 {cite:umari-masalik-1924 p. 176}."
  fr: "Le tombeau attribué à Yunus ibn Matta au village de Halhul, à gauche de la route Jérusalem-Hébron, sous un bâtiment à coupole gardé par un gardien; les pèlerins s'y dirigent, et al-Umari l'a visité à plusieurs reprises, la dernière fois en Dhu al-Hijja 745 {cite:umari-masalik-1924 p. 176}."
  ur: "یونس ابن متہ کی قبر حلول گاؤں میں، یروشلم-ہبرون روڈ کے بائیں طرف، ایک گنبد والی عمارت کے نیچے ایک محافظ کے ساتھ؛ حجاج اس کی طرف پلٹ جاتے ہیں، اور عمری بار بار تشریف لائے، آخری ذی الحجہ 745 میں 176}۔"
  tr: "Yunus ibn Mata'ya atfedilen bir mezar, Kudüs'ten Hebron'a giden köyün sol tarafında, Halhul köyünde; bir binası ve kubbesi vardır, bir hizmetçisi vardır ve ziyaretçiler ziyaret eder. İbn Fadlallah al-Umari burayı birkaç kez ziyaret etmiştir; sonuncusu Hicce 745 Hicce'de olmuştur {cite:umari-masalik-1924, s. 176}."
  id: "Sebuah makam yang dikaitkan dengan Yunus ibn Mata di desa Halhul di sisi kiri makam yang sedang berjalan dari Yerusalem ke Hebron; makam ini memiliki bangunan dan kubah, serta memiliki pelayan, dan pengunjung mengunjunginya. Ibn Fadlallah al-Umari mengunjunginya beberapa kali, yang terakhir adalah pada Dhu al-Hijjah 745 H {cite:umari-masalik-1924, hlm. 176}."
