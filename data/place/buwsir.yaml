summary:
  ar: "مدينة صغيرة على الشمال من النيل، ويحكى أن أكثر محرة فرعون كانوا منها، وذكر المؤلف أن بقية من طلاب السحر ما زالت فيها {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "A small town north of the Nile. The author reports that many of Pharaoh's magicians were said to come from it, and that remnants of students of magic remained there {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Un pequeño pueblo al norte del Nilo. El autor informa que muchos de los magos del faraón provenían de allí, y que aún quedaban allí vestigios de estudiantes de magia {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Une petite ville au nord du Nil. L'auteur rapporte que de nombreux magiciens du pharaon en seraient originaires, et que des vestiges d'étudiants en magie y subsistaient {cite:nuzhat-al-mushtaq-2002 p. 124}."
