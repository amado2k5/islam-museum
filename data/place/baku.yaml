summary:
  ar: عاصمة أذربيجان على شبه جزيرة أبشرون في بحر قزوين؛ مدينة شروانشاه المسوّرة من العصور الوسطى، ثم مدينة نفط في العهدين الروسي والسوفييتي.
  en: Capital of Azerbaijan on the Caspian's Absheron peninsula; the medieval Shirvanshah walled city, later an oil-boom town of the Russian empire and the Soviet Union.
  ur: آذربائیجان کا دارالحکومت بحرِ قزوین کے جزیرہ نما آبشرون پر؛ شیروان شاہوں کا قرونِ وسطی کا شہر، بعد میں روسی اور سوویت دور کا تیل کا شہر۔
  es: "Capital de Azerbaiyán en la península de Absheron, en el mar Caspio; la ciudad amurallada medieval de Shirvanshah, que más tarde se convirtió en una ciudad petrolera durante el auge del imperio ruso y la Unión Soviética."
  fr: "Capitale de l'Azerbaïdjan sur la péninsule d'Absheron, en mer Caspienne; ville fortifiée médiévale des Chirvanchahs, devenue plus tard une ville prospère grâce au boom pétrolier de l'empire russe et de l'Union soviétique."
  tr: "Azerbaycan'ın başkenti, Hazar Denizi'ndeki Abşerun Yarımadası'nda yer alır; Orta Çağ'dan kalma surlarla çevrili Şirvanşah şehri, o zamanlar Rus ve Sovyet dönemlerinde petrol şehriydi."
  id: "Ibu kota Azerbaijan terletak di Semenanjung Absherun di Laut Kaspia; kota bertembok Shirvanshah dari Abad Pertengahan, yang kemudian merupakan kota minyak pada era Rusia dan Soviet."
