summary:
  ar: "مرسى على ساحل البحر المحيط قرب سلا، يُحمل منه الحنطة والشعير والفول والحمص، وتبعد عنها إلى الجنوب نحو اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 239}"
  en: "A harbour on the Atlantic coast near Sala, twelve miles to the south, from which wheat, barley, beans and chickpeas are shipped. {cite:nuzhat-al-mushtaq-2002 p. 239}"
  es: "Un puerto en la costa atlántica cerca de Sala, a doce millas al sur, desde donde se exportan trigo, cebada, frijoles y garbanzos. {cite:nuzhat-al-mushtaq-2002 p. 239}"
  fr: "Un port sur la côte atlantique près de Sala, à douze milles au sud, d'où sont expédiés du blé, de l'orge, des haricots et des pois chiches. {cite:nuzhat-al-mushtaq-2002 p. 239}"
  ur: "جنوب میں بارہ میل دور سالا کے قریب بحر اوقیانوس کے ساحل پر ایک بندرگاہ جہاں سے گندم، جو، پھلیاں اور چنے بھیجے جاتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 239}"
  tr: "Salé yakınlarındaki kıyıda bir liman, buğday, arpa, bakla ve nohut taşıyor, yaklaşık on iki mil güneyde. {cite:nuzhat-al-mushtaq-2002 s. 239}"
  id: "Sebuah pelabuhan di pantai dekat Salé, mengangkut gandum, jelai, kacang fava, dan kacang arab, sekitar dua belas mil di selatan. {cite:nuzhat-al-mushtaq-2002 hlm. 239}"
