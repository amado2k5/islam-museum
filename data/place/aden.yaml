summary:
  ar: 'ميناء في جنوب اليمن على المحيط الهندي، كان محطة كبرى في طرق التجارة البحرية. وسمّاها المقدسي «دهليز الصين» وقال: من
    أراد التجارة فعليه بعدن أو عمان أو مصر {cite:ahsan-al-taqasim pp. 31-32}. وعدّها الهمداني من أقدم أسواق العرب، ووصفها
    مدينة يحيط بها جبل لم يكن فيه طريق حتى قُطع في الجبل باب بزُبّر الحديد فصار لها درباً إلى البر، ومورد مائها من رمل ناحية
    فلاة، وساكنها المربّون والحماحميون والملاحيون، ويدّعي المربّون النسب إلى ولد هارون {cite:sifat-jazirat-al-arab p. 36}.'
  en: 'A port in southern Yemen on the Indian Ocean, a major station on the maritime trade routes — al-Muqaddasi''s ''vestibule
    of China'' {cite:ahsan-al-taqasim pp. 31-32}. Al-Hamdani counts it among the oldest Arab fairs: a town ringed by trackless
    mountain until a gate was hammered through the rock with iron, drinking from a sand-well toward the waste, inhabited by
    the Maribiyyun, Hamahimiyyun and seafarers, the Maribiyyun claiming Aaronide descent {cite:sifat-jazirat-al-arab p. 36}.'
  es: "Un puerto en el sur de Yemen, en el Océano Índico, una importante estación en las rutas comerciales marítimas: el \"vestíbulo de China\" de al-Muqaddasi {cite:ahsan-al-taqasim pp. 31-32}. Al-Hamdani lo cuenta entre las ferias árabes más antiguas: una ciudad rodeada de montañas sin caminos hasta que se abrió una puerta a través de la roca con hierro, bebiendo de un pozo de arena hacia el desierto, habitada por los Maribiyyun, los Hamahimiyyun y marineros, los Maribiyyun afirmando descender de los Aarónidas {cite:sifat-jazirat-al-arab p. 36}."
  fr: "Port du sud du Yémen sur l'océan Indien, étape majeure sur les routes commerciales maritimes – le « vestibule de la Chine » selon al-Muqaddasi {cite:ahsan-al-taqasim pp. 31-32}. Al-Hamdani le compte parmi les plus anciennes foires arabes: une ville cernée de montagnes impénétrables jusqu'à ce qu'une porte soit percée dans la roche avec du fer, s'abreuvant d'un puits de sable vers le désert, habitée par les Maribiyyun, les Hamahimiyyun et des marins, les Maribiyyun se réclamant d'une descendance aaronide {cite:sifat-jazirat-al-arab p. 36}."
