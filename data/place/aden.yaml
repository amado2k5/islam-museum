summary:
  ar: "ميناء في جنوب اليمن على المحيط الهندي، كان محطة كبرى في طرق التجارة البحرية. وسمّاها المقدسي «دهليز الصين» وقال: من أراد التجارة فعليه بعدن أو عمان أو مصر {cite:ahsan-al-taqasim pp. 31-32}. وعدّها الهمداني من أقدم أسواق العرب، ووصفها مدينة يحيط بها جبل لم يكن فيه طريق حتى قُطع في الجبل باب بزُبّر الحديد فصار لها درباً إلى البر، ومورد مائها من رمل ناحية فلاة، وساكنها المربّون والحماحميون والملاحيون، ويدّعي المربّون النسب إلى ولد هارون {cite:sifat-jazirat-al-arab p. 36}."
  en: "A port in southern Yemen on the Indian Ocean, a major station on the maritime trade routes — al-Muqaddasi's 'vestibule of China' {cite:ahsan-al-taqasim pp. 31-32}. Al-Hamdani counts it among the oldest Arab fairs: a town ringed by trackless mountain until a gate was hammered through the rock with iron, drinking from a sand-well toward the waste, inhabited by the Maribiyyun, Hamahimiyyun and seafarers, the Maribiyyun claiming Aaronide descent {cite:sifat-jazirat-al-arab p. 36}."
