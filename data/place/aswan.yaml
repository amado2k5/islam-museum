  ar: "مدينة صغيرة عامرة كثيرة الحنطة والبقول واللحوم، وهي آخر ما يُصعد إليه في النيل من أرض مصر، وتقع عند جبل الجنادل، وتبعد عنه نحو اثني عشر مرحلة. وهي من ثغور النوبة. {cite:nuzhat-al-mushtaq-2002 p. 39-40}"
  en: "A small, prosperous town with plenty of wheat, vegetables and meat. It is the furthest point up the Nile that boats from Egypt reach, lying about twelve stages from the cataract, and is one of the frontier towns of Nubia. {cite:nuzhat-al-mushtaq-2002 p. 39-40}"
