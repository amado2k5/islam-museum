summary:
  ar: "قنطرة قرة بالبصرة نسبت إلى قرة بن حبان الباهلي؛ وكان عندها نهر قديم ثم اشترته أم عبد الله بن عامر فتصدقت به مغيضاً لأهل البصرة وابتاع عبد الله بن عامر السوق فتصدق به."
  en: "Qantarat Qurra at Basra, named for Qurra ibn Habban al-Bahili; Umm Abdallah ibn Amir bought the old canal there and gave it in sadaqa as the town's drainage, and Ibn Amir bought the market and gave it likewise."
  es: "Qantarat Qurra en Basora, que lleva el nombre de Qurra ibn Habban al-Bahili; Umm Abdallah ibn Amir compró el antiguo canal y lo donó como sadaqa para el drenaje de la ciudad, e Ibn Amir compró el mercado y lo donó de la misma manera."
  fr: "Qantarat Qurra à Bassora, nommé d'après Qurra ibn Habban al-Bahili; Umm Abdallah ibn Amir a acheté l'ancien canal et l'a donné en sadaqa pour le drainage de la ville, et Ibn Amir a acheté le marché et l'a donné de même."
  ur: "بصرہ میں قنطارت قرہ، قرہ ابن حبان الباہلی کے نام سے منسوب؛ ام عبد اللہ ابن عامر نے وہاں پرانی نہر خریدی اور اسے شہر کے نکاسی کے طور پر صدقہ میں دے دیا اور ابن عامر نے بازار خرید کر اسی طرح دے دیا۔"
