  tr: "Levant'taki Balqa topraklarında bir köy olan bu köy, Müslüman ordusunun Herakleios'un ordusu ve Arap müttefikleriyle Mu'tah Savaşı'nda ilk karşılaştığı yerdi; ardından Müslümanlar Mu'tah köyünün tarafını tuttu."
  id: "Sebuah desa di tanah Balqa di Levant, tempat ini merupakan tempat pertama di mana tentara Muslim bertemu dengan pasukan Heraclius dan sekutu Arab dalam Pertempuran Mu'tah, sebelum Muslim berpihak pada desa Mu'tah."
