  ar: "قرية في أرض البلقاء بالشام، كانت أول موضع التقى فيه جيش المسلمين بجيش هرقل والحلفاء العرب في غزوة مؤتة، قبل أن ينحاز المسلمون إلى قرية مؤتة."
