summary:
  ar: "مدينة في أرض حضرموت، ومعها مدينة أخرى، تبعدان عن بعضهما مقدار مرحلة، وتقعان في طريق الصعود من عدن {cite:nuzhat-al-mushtaq-2002 p. 56}. ويشتق الهمداني اسمها من أهل شبوة الذين خرجوا فسكنوا حضرموت حين احتربت حمير ومذحج: «وكان الأصل شباه فأبدلت الميم من الهاء» {cite:sifat-jazirat-al-arab p. 70}."
  en: "A city in the Hadramawt land, with another town about one stage away. Both lie along the route inland from Aden {cite:nuzhat-al-mushtaq-2002 p. 56}. Al-Hamdani derives its very name from the refugees of Shabwa who settled Hadramawt when Himyar and Madhhij warred — 'the original was Shabah, the mim replacing the ha' {cite:sifat-jazirat-al-arab p. 70}."
