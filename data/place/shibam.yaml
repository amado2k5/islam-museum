summary:
  ar: "مدينة في أرض حضرموت، ومعها مدينة أخرى، تبعدان عن بعضهما مقدار مرحلة، وتقعان في طريق الصعود من عدن {cite:nuzhat-al-mushtaq-2002 p. 56}. ويشتق الهمداني اسمها من أهل شبوة الذين خرجوا فسكنوا حضرموت حين احتربت حمير ومذحج: «وكان الأصل شباه فأبدلت الميم من الهاء» {cite:sifat-jazirat-al-arab p. 70}."
  en: "A city in the Hadramawt land, with another town about one stage away. Both lie along the route inland from Aden {cite:nuzhat-al-mushtaq-2002 p. 56}. Al-Hamdani derives its very name from the refugees of Shabwa who settled Hadramawt when Himyar and Madhhij warred — 'the original was Shabah, the mim replacing the ha' {cite:sifat-jazirat-al-arab p. 70}."
  es: "Una ciudad en la región de Hadramawt, con otra localidad a una etapa de distancia. Ambas se encuentran a lo largo de la ruta hacia el interior desde Adén {cite:nuzhat-al-mushtaq-2002 p. 56}. Al-Hamdani deriva su nombre de los refugiados de Shabwa que se asentaron en Hadramawt cuando Himyar y Madhhij entraron en guerra: «el nombre original era Shabah, donde la mim reemplaza a la ha» {cite:sifat-jazirat-al-arab p. 70}."
  fr: "Al-Hamdani est une ville du Hadramaout, une autre ville se trouvant à une étape de là. Toutes deux sont situées sur la route intérieure depuis Aden (voir: nuzhat-al-mushtaq-2002, p. 56). Al-Hamdani tire son nom des réfugiés de Shabwa qui s'installèrent au Hadramaout lors de la guerre entre Himyar et Madhhij: « le nom d'origine était Shabah, le mim remplaçant le ha » (voir: sifat-jazirat-al-arab, p. 70)."
  ur: "حضرموت سرزمین میں ایک شہر، جس میں ایک اور شہر تقریباً ایک مرحلے کے فاصلے پر ہے۔ دونوں عدن سے اندرون ملک راستے پر پڑے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 56}۔ الحمدانی کا نام شبوہ کے مہاجرین سے لیا گیا ہے جنہوں نے حضرموت کو اس وقت آباد کیا جب ہمیار اور مدحج نے جنگ کی تھی - 'اصل شبہ تھا، میم نے ح کی جگہ لی'۔ 70}۔"
