summary:
  ar: "نهر في شمال خراسان، ينبع من جبل الحزار قرب مسجد على سلسلة جولستان في كوبيت داغ، ويجري نحو 320 ميلًا غالبًا نحو الغرب، ويصب في خليج حسن قلي جنوب شرق بحر قزوين. وكان الحد بين روسيا وإيران منذ 1882م {cite:encyclopaedia-of-islam-2 vol. 1 p. 798}."
  en: "A river in the north of Khurasan, rising on the Hazar Masjid mountain of the Gulistan ridge of the Kopet Dagh, running some 320 miles mainly westwards into the bay of Hasan Quli at the south-east of the Caspian Sea. It has been the frontier between Russia and Iran since 1882 {cite:encyclopaedia-of-islam-2 vol. 1 p. 798}."
