summary:
  ar: "موضع نزل به النبي والمسلمون وهم في طريقهم إلى تبوك؛ استقوا من بئره ثم نُهوا عن الشرب منها. ونزل ثمود بن عابر بن إرم الحجر إلى فرع نحو وادي القرى بين الشام والحجاز {cite:muruj-al-dhahab p. 449-450}. وعند ابن فضل الله العمري أن بيوت ثمود المنحوتة في الجبال باقية إلى زمانه، وبها البئران: بئر الناقة وبئر ثمود يُقسم بينهما الشرب؛ ولما مر النبي بأرض ثمود في غزوة تبوك وجد بعض أصحابه قد ملأ من بئر الحجر فأمر بإراقة الماء، فلما قالوا إنهم عجنوا منه أمر بإطعام العجين الإبل وبالشرب من بئر الناقة {cite:umari-masalik-1924 p. 231}. وفي الصحيح رواية ابن عمر أن النبي لما مرّ بالحجر أمر من ملأ من بئرها أن يريقوا الماء وأن يطعموا العجين الإبل وأن يشربوا من بئر الناقة، وقال «لا تدخلوا على هؤلاء المعذبين إلا أن تكونوا باكين» {cite:sahih-al-bukhari 3380}."
  en: A place where the Prophet and the Muslims stopped on their way to Tabuk; they drew from its well and were then forbidden to drink from it.
  es: "Un lugar donde el Profeta y los musulmanes se detuvieron de camino a Tabuk; sacaron agua de su pozo y luego se les prohibió beber de él."
  fr: "Un lieu où le Prophète et les musulmans s'arrêtèrent sur le chemin de Tabuk; ils puisèrent de l'eau à son puits et il leur fut ensuite interdit d'en boire."
  ur: "وہ جگہ جہاں نبی اور مسلمان تبوک جاتے ہوئے رکے تھے۔ انہوں نے اس کے کنویں سے پانی نکالا اور پھر اس سے پانی پینے سے منع کر دیا گیا۔"
  tr: "Peygamber ve Müslümanların Tabuk'a giderken kaldıkları bir yer; kuyulardan su çekerler ve sonra içmeyi yasakladılar. Temud ibn Abir ibn İram el-Hijar, Levant ile Hicaz arasında Vadi el-Kura yakınlarında bir kola yerleşti {alıntı:] Muruj-al-Dhahab s. 449-450}. İbn Fadlallah al-Umari'ye göre, Thamud dağlarına oyulmuş evler onun zamanına kadar ayakta kalmıştır ve içinde iki kuyu vardır: dişi deve kuyusu ve su ile ayrılmış Thamud kuyusu. Peygamber, Tabuk seferi sırasında Thamud'un topraklarından geçerken, bazı yoldaşlarının taş kuyuyla dolu olduğunu gördü ve su dökülmesini emretti. Onlar yoğurduklarını söylediklerinde, develere hamuru beslemelerini ve dişi deve kuyusundan içmelerini emretti {cite:umari-masalik-1924, s. 231}. İbn Ömer'in gerçek rivayetinde, Peygamber, kuyuyu dolduranlara su dökmelerini, develere hamur vermelerini ve deve kuyusundan içmelerini emretmiş, \"Bu eziyet görenlerin yanına sadece ağlayarak girin.\" {kaynak:sahih-al-bukhari 3380}"
  id: "Tempat di mana Nabi dan umat Muslim tinggal dalam perjalanan mereka ke Tabuk; mereka mengambil dari sumur itu lalu melarang minum dari sana. Thamud ibn Abir ibn Iram al-Hijar menetap di sebuah cabang dekat Wadi al-Qura antara Levant dan Hijaz {cite:muruj-al-dhahab hlm. 449-450}. Menurut Ibn Fadlallah al-Umari, rumah-rumah yang dipahat di pegunungan Thamud tetap ada hingga waktunya, dan di dalamnya terdapat dua sumur: sumur unta betina dan sumur Thamud, yang dipisahkan oleh minuman. Ketika Nabi melewati tanah Thamud dalam ekspedisi Tabuk, ia menemukan beberapa sahabatnya diisi dengan sumur batu dan memerintahkan air dituangkan. Ketika mereka mengatakan telah mengulen, ia memerintahkan unta-unta itu memberi makan adonan dan minum dari sumur unta betina {cite:umari-masalik-1924, hlm. 231}. Dalam riwayat otentik Ibn Umar, Nabi memerintahkan mereka yang mengisi sumur untuk menuangkan air, memberi adonan kepada unta, dan minum dari sumur unta, dan berkata: \"Jangan masuk ke atas orang-orang yang tersiksa ini kecuali dengan menangis.\" {cite:sahih-al-bukhari 3380}."
