summary:
  ar: "موضع نزل به النبي والمسلمون وهم في طريقهم إلى تبوك؛ استقوا من بئره ثم نُهوا عن الشرب منها. ونزل ثمود بن عابر بن إرم الحجر إلى فرع نحو وادي القرى بين الشام والحجاز {cite:muruj-al-dhahab p. 449-450}. وعند ابن فضل الله العمري أن بيوت ثمود المنحوتة في الجبال باقية إلى زمانه، وبها البئران: بئر الناقة وبئر ثمود يُقسم بينهما الشرب؛ ولما مر النبي بأرض ثمود في غزوة تبوك وجد بعض أصحابه قد ملأ من بئر الحجر فأمر بإراقة الماء، فلما قالوا إنهم عجنوا منه أمر بإطعام العجين الإبل وبالشرب من بئر الناقة {cite:umari-masalik-1924 p. 231}. وفي الصحيح رواية ابن عمر أن النبي لما مرّ بالحجر أمر من ملأ من بئرها أن يريقوا الماء وأن يطعموا العجين الإبل وأن يشربوا من بئر الناقة، وقال «لا تدخلوا على هؤلاء المعذبين إلا أن تكونوا باكين» {cite:sahih-al-bukhari 3380}."
  en: A place where the Prophet and the Muslims stopped on their way to Tabuk; they drew from its well and were then forbidden to drink from it.
