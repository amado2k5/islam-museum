label: { ar: "جزيرة مسفهان", en: "Masfahan island", es: "Isla de Masfahan", fr: "Île de Maspahan", ur: "جزیرہ مصفاہان" }
summary:
  ar: "جزيرة في البحر الغربي عند الجزائر الخالدات، ذكر المؤلف عن صاحب كتاب العجائب أن في وسطها تلا مستديرا عليه صنم أحمر بناه أسعد أبو كرب الحميري علامة لمن يقصد تلك الناحية، وأن فيها دواب هائلة {cite:nuzhat-al-mushtaq-2002 p. 103}، {cite:nuzhat-al-mushtaq-2002 p. 104}."
  en: "An island in the western sea among the Fortunate Isles. Citing the author of the Book of Wonders, al-Idrisi reports a round hill in its centre with a red idol set up by Asad Abu Karib al-Himyari as a sea-mark, and fearsome animals {cite:nuzhat-al-mushtaq-2002 p. 103}, {cite:nuzhat-al-mushtaq-2002 p. 104}."
  es: "Una isla en el mar occidental entre las Islas Afortunadas. Citando al autor del Libro de las Maravillas, al-Idrisi informa de una colina redonda en su centro con un ídolo rojo erigido por Asad Abu Karib al-Himyari como señal marítima, y animales temibles {cite:nuzhat-al-mushtaq-2002 p. 103}, {cite: Nuzhat-al-Mushtaq-2002 p. 104}."
  fr: "Une île de la mer occidentale parmi les Îles Fortunées. Citant l'auteur du Livre des Merveilles, al-Idrisi rapporte une colline ronde en son centre avec une idole rouge placée par Asad Abu Karib al-Himyari comme marque de mer, et des animaux redoutables {cite:nuzhat-al-mushtaq-2002 p. 103}, {cite: Nuzhat-al-Mushtaq-2002 p. 104}."
  ur: "خوش قسمتی جزائر کے درمیان مغربی سمندر میں ایک جزیرہ۔ عجائبات کی کتاب کے مصنف کا حوالہ دیتے ہوئے، الادریسی نے اس کے مرکز میں ایک گول پہاڑی کی اطلاع دی ہے جس میں اسد ابو کریب الحمیری نے سمندری نشان کے طور پر ایک سرخ بت بنایا ہے، اور خوفناک جانور {حوالہ: نزہت المشتاق-2002 صفحہ۔ 103}، {حوالہ: نزہت المشتاق 2002 ص۔ 104}۔"
