summary:
  ar: "جزيرة في البحر الغربي عند الجزائر الخالدات، ذكر المؤلف عن صاحب كتاب العجائب أن في وسطها تلا مستديرا عليه صنم أحمر بناه أسعد أبو كرب الحميري علامة لمن يقصد تلك الناحية، وأن فيها دواب هائلة {cite:nuzhat-al-mushtaq-2002 p. 103}، {cite:nuzhat-al-mushtaq-2002 p. 104}."
  en: "An island in the western sea among the Fortunate Isles. Citing the author of the Book of Wonders, al-Idrisi reports a round hill in its centre with a red idol set up by Asad Abu Karib al-Himyari as a sea-mark, and fearsome animals {cite:nuzhat-al-mushtaq-2002 p. 103}, {cite:nuzhat-al-mushtaq-2002 p. 104}."
