summary:
  ar: "مدينة بقرب البحر، يذكر الإدريسي أن فيها ما يُعرف بالسينيزي، وهو شيء لا يعدله غيره في الجودة، وتقع في الجوار من جنابة. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  en: "A town near the sea, where al-Idrisi says a product called al-Sinizi is made; nothing equals it in quality. It lies near Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  es: "Un pueblo cercano al mar, donde, según al-Idrisi, se elabora un producto llamado al-Sinizi; no hay nada que lo iguale en calidad. Se encuentra cerca de Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  fr: "Une ville proche de la mer, où, selon al-Idrisi, est fabriqué un produit appelé al-Sinizi; sa qualité est inégalée. Elle se situe près de Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  ur: "سمندر کے قریب ایک قصبہ جہاں الادریسی کا کہنا ہے کہ السنیزی نامی ایک پروڈکٹ بنائی جاتی ہے۔ معیار میں کچھ بھی نہیں ہے. یہ جنابت کے قریب واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 412}"
  tr: "Deniz kenarında bir şehir olan Al-Idrisi, 'sinizi' olarak bilinen bir şeye sahip olduğunu ve bunun kalitesinin kimsenin ulaşamayacağını belirtir ve Janaba'ya yakın bir konumda yer almaktadır. {cite:nuzhat-al-mushtaq-2002 s. 412}"
  id: "Sebuah kota dekat laut, Al-Idrisi menyebutkan bahwa kota ini memiliki apa yang dikenal sebagai 'sinizi,' sesuatu yang tidak bisa ditandingi oleh orang lain dalam kualitas, dan terletak di dekat Janaba. {cite:nuzhat-al-mushtaq-2002 hlm. 412}"
