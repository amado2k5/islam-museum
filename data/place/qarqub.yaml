summary:
  ar: "مدينة يُعمل بها ديباج معين بالذهب، يحمل منه إلى الآفاق ويُعرف بالديباج القرقوبي، وتبعد عن السوس مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  en: "A city producing gold-threaded silk brocade known as Qarqubi, carried to distant lands; one stage from Sus. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  es: "Ciudad productora de brocado de seda con hilos de oro conocido como Qarqubi, que se exportaba a tierras lejanas; a una etapa de Sus. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  fr: "Une ville produisant du brocart de soie à fils d'or connu sous le nom de Qarqubi, exporté vers des contrées lointaines; à une étape de Sus. {cite:nuzhat-al-mushtaq-2002 p. 396}"
  ur: "ایک شہر جو سونے کے دھاگے والے سلک بروکیڈ تیار کرتا ہے جسے قرقوبی کہا جاتا ہے، دور دراز علاقوں تک لے جایا جاتا ہے۔ سوس سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 396}"
  tr: "Belirli bir brokarın altından yapıldığı, ufuklara taşındığı, Qarqoubi brokarı olarak bilinen ve Souss'a bir adım uzaklıkta olan bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 396}"
  id: "Sebuah kota di mana brokat tertentu terbuat dari emas, dibawa ke cakrawala, dikenal sebagai brokat Qarqoubi, dan hanya selangkah dari Souss. {cite:nuzhat-al-mushtaq-2002 hlm. 396}"
