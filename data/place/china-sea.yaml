summary:
  ar: "ذكر المؤلف أن البحر الصيني، مع ما يليه من بحر الصنف وبحر دارلاروى وبحر هركند وبحر عمان، تعرف فيه حركة المد والجزر {cite:nuzhat-al-mushtaq-2002 p. 92}."
  en: "The author reports that the Chinese sea, together with the seas of Sanf, Darlarawi, Harkand and Oman, has tides {cite:nuzhat-al-mushtaq-2002 p. 92}."
  es: "El autor informa que el mar chino, junto con los mares de Sanf, Darlarawi, Harkand y Omán, tiene mareas {cite:nuzhat-al-mushtaq-2002 p. 92}."
  fr: "L'auteur rapporte que la mer de Chine, ainsi que les mers de Sanf, Darlarawi, Harkand et Oman, ont des marées {cite:nuzhat-al-mushtaq-2002 p. 92}."
  ur: "مصنف نے رپورٹ کیا ہے کہ چینی سمندر، صانف، دارلراوی، ہرقند اور عمان کے سمندروں کے ساتھ مل کر سمندروں میں لہراتا ہوا ہے۔ 92}۔"
  tr: "Yazar, Çin Denizi'nin Al-Sanf, Dar al-Ruwa, Harkand Denizi ve Umman Denizi gibi aşağıdaki denizlerle birlikte gelgit hareketi yaşadığını belirtmiştir {cite:Nuzhat-al-Mushtaq-2002, s. 92}."
  id: "Penulis menyebutkan bahwa Laut Tiongkok, bersama dengan laut-laut berikut seperti Al-Sanf, Dar Al-Ruwa, Laut Harkand, dan Laut Oman, mengalami pergerakan pasang surut {cite:Nuzhat-al-Mushtaq-2002, hlm. 92}."
