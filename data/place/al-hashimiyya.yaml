label: { ar: "المدينة الهاشمية", en: "the Hashimite City", es: "la ciudad hachemita", fr: "la ville hachémite", ur: "ہاشمی شہر" }
summary:
  ar: "مدينة على الفرات قرب الكوفة؛ عند البلاذري بدأها يزيد بن عمر بن هبيرة ثم تركها بكتاب مروان فنزلها أبو العباس واستتمها وسماها الهاشمية ثم رذها لبقاء اسم ابن هبيرة عليها وبنى بحيالها مدينة هاشمية أخرى فنزلها المنصور وأتمها وزاد فيها ثم تحول إلى بغداد وبها حبس عبد الله بن حسن وبها قبره وبنى المنصور بالكوفة الرصافة."
  en: "A city on the Euphrates near Kufa; in al-Baladhuri begun by Yazid ibn Umar ibn Hubayra, abandoned on Marwan's letter, completed and named by Abu al-Abbas — who then forsook it for a second Hashimite city beside it when Ibn Hubayra's name clung — dwelt in and expanded by al-Mansur before his move to Baghdad; Abdallah ibn al-Hasan was imprisoned and buried there, and al-Mansur built al-Rusafa at Kufa."
  es: "Una ciudad a orillas del Éufrates, cerca de Kufa; en al-Baladhuri, iniciada por Yazid ibn Umar ibn Hubayra, abandonada por carta de Marwan, completada y nombrada por Abu al-Abbas —quien luego la abandonó para fundar una segunda ciudad hachemita al lado cuando el nombre de Ibn Hubayra se mantuvo vigente—, habitada y ampliada por al-Mansur antes de su traslado a Bagdad; Abdallah ibn al-Hasan fue encarcelado y enterrado allí, y al-Mansur construyó al-Rusafa en Kufa."
  fr: "Une ville sur l'Euphrate près de Kufa; à al-Baladhuri, commencée par Yazid ibn Umar ibn Hubayra, abandonnée sur la lettre de Marwan, achevée et nommée par Abu al-Abbas — qui l'abandonna ensuite pour une deuxième ville hachémite à côté d'elle lorsque le nom d'Ibn Hubayra persista — habitée et agrandie par al-Mansur avant son départ pour Bagdad; Abdallah ibn al-Hasan y fut emprisonné et enterré, et al-Mansur construisit al-Rusafa à Kufa."
  ur: "کوفہ کے قریب فرات پر ایک شہر؛ البلادوری میں یزید ابن عمر بن ہبیرہ کے ذریعہ شروع کیا گیا، مروان کے خط پر ترک کیا گیا، مکمل کیا گیا اور اس کا نام ابو العباس نے رکھا - جس نے اسے اس کے ساتھ ہی ایک دوسرے ہاشمی شہر کے لئے چھوڑ دیا جب ابن ہبیرہ کا نام چپک گیا - اس کے منتقل ہونے سے پہلے المنصور نے اس میں رہائش اختیار کی اور اسے پھیلایا۔ عبداللہ بن الحسن کو قید کیا گیا اور وہیں دفن کیا گیا، اور المنصور نے کوفہ میں الرصافہ تعمیر کیا۔"
