label: { ar: "المدينة الهاشمية", en: "the Hashimite City" }
summary:
  ar: "مدينة على الفرات قرب الكوفة؛ عند البلاذري بدأها يزيد بن عمر بن هبيرة ثم تركها بكتاب مروان فنزلها أبو العباس واستتمها وسماها الهاشمية ثم رذها لبقاء اسم ابن هبيرة عليها وبنى بحيالها مدينة هاشمية أخرى فنزلها المنصور وأتمها وزاد فيها ثم تحول إلى بغداد وبها حبس عبد الله بن حسن وبها قبره وبنى المنصور بالكوفة الرصافة."
  en: "A city on the Euphrates near Kufa; in al-Baladhuri begun by Yazid ibn Umar ibn Hubayra, abandoned on Marwan's letter, completed and named by Abu al-Abbas — who then forsook it for a second Hashimite city beside it when Ibn Hubayra's name clung — dwelt in and expanded by al-Mansur before his move to Baghdad; Abdallah ibn al-Hasan was imprisoned and buried there, and al-Mansur built al-Rusafa at Kufa."
