label: { ar: "هيكل الجوهرة بأقاصي الصين", en: "The jewel-temple of farthest China" }
summary:
  ar: "هيكل مدور بأقاصي بلاد الصين له سبعة أبواب في داخله قبة مسبعة عظيمة عالية السمك في أعلاها شبه الجوهرة يزيد على رأس العجل تضيء جميع أقطار الهيكل، حاولت ملوك أخذها فلم يدن أحد منها على مقدار عشرة أذرع إلا انعكست الآلات وعطلت لقوة دافعة منفردة من أنواع الأحجار المغناطيسية، ومن رام هدم الهيكل مات، وفيه بئر مسبعة الرأس مكتوب على طوقها بقلم المسند هذه بئر تؤدي إلى مخزن الكتب وتاريخ الدنيا وعلوم السماء وما كان وما يكون وخزائن رغائب هذا العالم لا يصل إليها إلا من وازت قدرته قدرتنا واتصل علمه بعلمنا {cite:muruj-al-dhahab p. 548}."
  en: "The seven-gated round temple of farthest China whose dome shelters a jewel larger than a bull's head lighting the whole — kings' tools snapping within ten cubits of it by the magnet-stones' repulsion — and a seven-mouthed well whose Musnad inscription promises the storehouse of books, the world's history and its rarest treasures to the man whose power equals the builders' {cite:muruj-al-dhahab p. 548}."
