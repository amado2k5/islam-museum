label: { ar: "هيكل الجوهرة بأقاصي الصين", en: "The jewel-temple of farthest China", es: "El templo joya de la más lejana China", fr: "Le temple-joyau de la Chine la plus reculée", ur: "دور دراز چین کا زیور مندر" }
summary:
  ar: "هيكل مدور بأقاصي بلاد الصين له سبعة أبواب في داخله قبة مسبعة عظيمة عالية السمك في أعلاها شبه الجوهرة يزيد على رأس العجل تضيء جميع أقطار الهيكل، حاولت ملوك أخذها فلم يدن أحد منها على مقدار عشرة أذرع إلا انعكست الآلات وعطلت لقوة دافعة منفردة من أنواع الأحجار المغناطيسية، ومن رام هدم الهيكل مات، وفيه بئر مسبعة الرأس مكتوب على طوقها بقلم المسند هذه بئر تؤدي إلى مخزن الكتب وتاريخ الدنيا وعلوم السماء وما كان وما يكون وخزائن رغائب هذا العالم لا يصل إليها إلا من وازت قدرته قدرتنا واتصل علمه بعلمنا {cite:muruj-al-dhahab p. 548}."
  en: "The seven-gated round temple of farthest China whose dome shelters a jewel larger than a bull's head lighting the whole — kings' tools snapping within ten cubits of it by the magnet-stones' repulsion — and a seven-mouthed well whose Musnad inscription promises the storehouse of books, the world's history and its rarest treasures to the man whose power equals the builders' {cite:muruj-al-dhahab p. 548}."
  es: "El templo circular de siete puertas de la China más lejana, cuya cúpula alberga una joya más grande que la cabeza de un toro que ilumina todo el conjunto —las herramientas de los reyes se rompen a menos de diez codos de ella por la repulsión de las piedras magnéticas— y un pozo de siete bocas cuya inscripción Musnad promete el depósito de libros, la historia del mundo y sus tesoros más raros al hombre cuyo poder iguale al de los constructores {cite:muruj-al-dhahab p. 548}."
  fr: "Le temple rond à sept portes de la Chine la plus reculée, dont le dôme abrite un joyau plus gros qu'une tête de taureau illuminant le tout — les outils des rois se brisant à moins de dix coudées de celui-ci par la répulsion des pierres magnétiques — et un puits à sept bouches dont l'inscription du Musnad promet le dépôt de livres, l'histoire du monde et ses trésors les plus rares à l'homme dont le pouvoir égale celui des bâtisseurs {cite:muruj-al-dhahab p. 548}."
  ur: "دور دراز چین کا سات دروازوں والا گول مندر جس کا گنبد بیل کے سر سے بڑے زیور کو پناہ دیتا ہے - بادشاہوں کے اوزار اس کے دس ہاتھ کے اندر مقناطیسی پتھروں کے پیچھے ہٹ جاتے ہیں - اور ایک سات منہ والا کنواں جس کی مسند نوشتہ کتابوں کے گودام کا وعدہ کرتا ہے، دنیا کی تاریخ اور اس کے حکمرانوں کی طاقت کے مساوی تعمیرات۔ {حوالہ: مروج الذہب ص۱۴۲۔ 548}۔"
