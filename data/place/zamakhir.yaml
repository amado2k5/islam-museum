summary:
  ar: "مدينة على الضفة الغربية للنيل، فوق مصب خليج المنهى، حسنة البناء كثيرة البساتين، غزيرة الفواكه وضروب من الحبوب. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  en: "A city on the west bank of the Nile, above the mouth of the al-Manhi branch. The author describes it as well built, with many orchards, abundant fruit and several kinds of grain. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  es: "Una ciudad situada en la margen occidental del Nilo, sobre la desembocadura del brazo al-Manhi. El autor la describe como bien construida, con numerosos huertos, abundante fruta y diversos tipos de grano. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  fr: "Une ville située sur la rive ouest du Nil, en amont de l'embouchure du bras d'al-Manhi. L'auteur la décrit comme bien construite, avec de nombreux vergers, des fruits en abondance et plusieurs sortes de céréales. {cite:nuzhat-al-mushtaq-2002 p. 127}"
  ur: "المنحی شاخ کے منہ کے اوپر دریائے نیل کے مغربی کنارے پر ایک شہر۔ مصنف نے اسے بہت سے باغات، وافر پھل اور کئی قسم کے اناج کے ساتھ بنایا ہوا بیان کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 127}"
