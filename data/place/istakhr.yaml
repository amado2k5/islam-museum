summary:
  ar: "مدينة فارس العظيمة؛ عند البلاذري عاناها أبو موسى فلم يمكنه وعاناها عثمان بن أبي العاص فلم يقدر عليها وبقيت هي وجور آخر مفتوحات فارس قبل قدوم عبد الله بن عامر سنة 29. وعلى نحو فرسخ منها البناء العظيم المعروف عند الناس بمسجد سليمان وكان بيتاً للنار أخرجته حماية بنت بهمن فتخرب حين نقلت عنه النار، وقد دخله المسعودي فرأى أساطين صخر وصوراً يزعمون أنها صور الأنبياء والريح لا تسكن فيه ليلاً ولا نهاراً {cite:muruj-al-dhahab p. 550}"
  en: "Fars's great city; in al-Baladhuri, assaulted vainly by Abu Musa and Uthman ibn Abi al-As — it and Jur the last of Fars untaken at Abdallah ibn Amir's arrival in 29."
