summary:
  ar: مدينة فارس العظيمة؛ عند البلاذري عاناها أبو موسى فلم يمكنه وعاناها عثمان بن أبي العاص فلم يقدر عليها وبقيت هي وجور آخر
    مفتوحات فارس قبل قدوم عبد الله بن عامر سنة 29. وعلى نحو فرسخ منها البناء العظيم المعروف عند الناس بمسجد سليمان وكان بيتاً
    للنار أخرجته حماية بنت بهمن فتخرب حين نقلت عنه النار، وقد دخله المسعودي فرأى أساطين صخر وصوراً يزعمون أنها صور الأنبياء
    والريح لا تسكن فيه ليلاً ولا نهاراً {cite:muruj-al-dhahab p. 550}
  en: Fars's great city; in al-Baladhuri, assaulted vainly by Abu Musa and Uthman ibn Abi al-As — it and Jur the last of Fars
    untaken at Abdallah ibn Amir's arrival in 29.
  es: "La gran ciudad de Fars; en al-Baladhuri, asaltada en vano por Abu Musa y Uthman ibn Abi al-As — ella y Jur fueron las últimas de Fars que no fueron tomadas a la llegada de Abdallah ibn Amir en el año 29."
  fr: "La grande ville de Fars; à al-Baladhuri, assailli vainement par Abu Musa et Uthman ibn Abi al-As — elle et Jur sont les dernières villes de Fars non prises à l'arrivée d'Abdallah ibn Amir en 29."
  ur: "فارس کا عظیم شہر؛ البلادھوری میں، ابو موسیٰ اور عثمان ابن ابی العاص کی طرف سے بیہودہ حملہ کیا گیا - یہ اور جور آخری فارس ہے جو عبداللہ ابن عامر کی 29 میں آمد کے وقت لیا گیا تھا۔"
  tr: "Fars'ın büyük şehri; el-Baladhuri'ye göre, Ebu Musa buna maruz kaldı ama başaramadı, Osman bin Ebi el-As ise bunu aşamadı. 29. yılda Abdullah ibn Amir'in gelişinden önce Fars'ın diğer açık evleriyle birlikte kaldı. Farsakh, halk arasında Süleyman Camii olarak bilinen büyük binadır; bint Bahman'ın korumasıyla sökülen ateşli bir evdi, ancak yangın oradan taşındığında yok oldu. El-Mes'udi içeri girdi ve peygamberlerin ve rüzgarın heykeli olduğu iddia edilen taş sütunlar ve heykeller gördü; bunlar gece gündüz içinde durmadı {atıf:Muruj-al-Dhahab s. 550}"
  id: "Kota besar Fars; menurut al-Baladhuri, Abu Musa menanggungnya tetapi tidak mampu, dan Uthman ibn Abi al-As tidak dapat mengatasinya. Bangunan itu tetap bersama rumah terbuka Fars lainnya sebelum kedatangan Abdullah ibn Amir pada tahun 29. Farsakh dari sana adalah bangunan besar yang dikenal di kalangan masyarakat sebagai Masjid Sulayman, yang merupakan rumah api yang dihancurkan oleh perlindungan bint Bahman, tetapi hancur ketika api dipindahkan dari sana. Al-Mas'udi masuk dan melihat tiang-tiang batu serta gambar yang diklaim sebagai patung nabi dan angin, yang tidak tinggal di dalamnya siang atau malam {cite:muruj-al-dhahab hlm. 550}"
