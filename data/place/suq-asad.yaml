summary:
  ar: "قرية وسوق بالكوفة؛ عند البلاذري اتخذها أسد بن عبد الله القسري أخو خالد ونقل الناس إليها فقيل سوق أسد وكان معسكره حين شخص إلى خراسان والياً عليها عند سوقه هذا."
  en: "Village and market at Kufa; in al-Baladhuri founded by Asad ibn Abdallah al-Qasri, Khalid's brother, who moved people into it — whence 'Suq Asad' — his camp when he set out for Khurasan as its governor being by this market."
  es: "Pueblo y mercado en Kufa; en al-Baladhuri fundado por Asad ibn Abdallah al-Qasri, hermano de Khalid, quien trasladó gente allí —de ahí el nombre de 'Suq Asad'—, su campamento cuando partió hacia Jorasán como su gobernador estaba junto a este mercado."
  fr: "Village et marché à Kufa; à al-Baladhuri fondé par Asad ibn Abdallah al-Qasri, le frère de Khalid, qui y installa des gens — d'où le nom « Suq Asad » — son camp lorsqu'il partit pour le Khorasan en tant que gouverneur se trouvant près de ce marché."
  ur: "کوفہ میں گاؤں اور بازار؛ البلادوری میں خالد کے بھائی اسد بن عبداللہ القسری نے قائم کیا تھا، جس نے لوگوں کو اس میں منتقل کیا - جہاں سے 'سوق اسد' - اس کا کیمپ جب وہ خراسان کے گورنر کے طور پر اس بازار کے پاس سے روانہ ہوا۔"
  tr: "Kufe'de bir köy ve pazar; El-Baladhuri'ye göre, Halid'in kardeşi Esed ibn Abdullah el-Kasri tarafından ele geçirilmiş ve insanlar oraya nakledilmiştir. Esad Pazarı'nın Horasan valisi olarak atandığında kampı olduğu söylenir."
  id: "Sebuah desa dan pasar di Kufa; menurut Al-Baladhuri, pasar ini diambil alih oleh Asad ibn Abdullah al-Qasri, saudara Khalid, dan orang-orang dipindahkan ke sana. Dikatakan bahwa Pasar Asad adalah kampnya ketika ia diangkat sebagai gubernur Khorasan di pasar ini."
