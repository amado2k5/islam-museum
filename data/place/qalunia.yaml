summary:
  ar: "مدينة على غربي نهر رين، كبيرة القطر عامرة الجوانب، متصلة الغلات، ويذكر المؤلف أن بينها وبين مبانصة ستين ميلا {cite:nuzhat-al-mushtaq-2002 p. 872} {cite:nuzhat-al-mushtaq-2002 p. 873}."
  en: "A large city on the western bank of the Rhine with settled outskirts and regular harvests; the author gives sixty miles from Mabānisa {cite:nuzhat-al-mushtaq-2002 p. 872} {cite:nuzhat-al-mushtaq-2002 p. 873}."
  es: "Una gran ciudad en la orilla occidental del Rin con suburbios poblados y cosechas regulares; el autor indica sesenta millas desde Mabānisa {cite:nuzhat-al-mushtaq-2002 p. 872} {cite:nuzhat-al-mushtaq-2002 p. 873}."
  fr: "Une grande ville sur la rive ouest du Rhin avec une périphérie établie et des récoltes régulières; l'auteur donne soixante milles de Mabānisa {cite:nuzhat-al-mushtaq-2002 p. 872} {cite:nuzhat-al-mushtaq-2002 p. 873}."
  ur: "رائن کے مغربی کنارے پر ایک بڑا شہر جس میں آباد مضافات اور باقاعدہ فصلیں ہوتی ہیں۔ مصنف مبانیسا سے ساٹھ میل بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 872} {حوالہ: نزہت المشتاق-2002 ص۔ 873}۔"
  tr: "Ren Nehri'nin batı yakasında, çapı büyük, çok sayıda yamacı olan, ekinlerle bağlantılı bir şehirdir ve yazar, Mabansa'ya altmış mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002 s. 872} {cite:Nuzhat-al-Mushtaq-2002 s. 873}."
  id: "Sebuah kota di sisi barat Sungai Rhein, berdiameter besar, dengan banyak sisi, terhubung dengan tanaman, dan penulis menyebutkan bahwa kota ini berjarak enam puluh mil dari Mabansa {cite:Nuzhat-al-Mushtaq-2002 hlm. 872} {cite:Nuzhat-al-Mushtaq-2002 hlm. 873}."
