summary:
  ar: "مدينة كبيرة على ساحل البحر في بلاد الزنج، يعيش أهلها من الصيد براً وبحراً، ويستخرجون الحديد ويعملونه، ويزعم أهلها أنهم يسحرون الحيوان المؤذي فلا يؤذي إلا من أرادوا ضره، وعندهم أن الساحر يُسمّى بلغتهم المقنقا {cite:nuzhat-al-mushtaq-2002 p. 59}."
  en: "A large town on the coast of the Zanj lands. Its people live by hunting on land and sea and work iron they mine. They claim to charm dangerous animals so that they harm only those they choose, and they have a word in their language for a sorcerer {cite:nuzhat-al-mushtaq-2002 p. 59}."
  es: "Una gran ciudad en la costa de las tierras de Zanj. Sus habitantes viven de la caza terrestre y marítima y trabajan el hierro que extraen. Afirman tener la capacidad de encantar a los animales peligrosos para que solo dañen a los que ellos eligen, y poseen una palabra en su idioma para referirse a un hechicero {cite:nuzhat-al-mushtaq-2002 p. 59}."
  fr: "Une grande ville côtière du pays Zanj. Ses habitants vivent de la chasse terrestre et maritime et travaillent le fer qu'ils extraient. Ils prétendent charmer les animaux dangereux afin qu'ils ne blessent que ceux qu'ils choisissent, et ils ont un mot dans leur langue pour désigner un sorcier {cite:nuzhat-al-mushtaq-2002 p. 59}."
