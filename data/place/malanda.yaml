summary:
  ar: "مدينة كبيرة على ساحل البحر في بلاد الزنج، يعيش أهلها من الصيد براً وبحراً، ويستخرجون الحديد ويعملونه، ويزعم أهلها أنهم يسحرون الحيوان المؤذي فلا يؤذي إلا من أرادوا ضره، وعندهم أن الساحر يُسمّى بلغتهم المقنقا {cite:nuzhat-al-mushtaq-2002 p. 59}."
  en: "A large town on the coast of the Zanj lands. Its people live by hunting on land and sea and work iron they mine. They claim to charm dangerous animals so that they harm only those they choose, and they have a word in their language for a sorcerer {cite:nuzhat-al-mushtaq-2002 p. 59}."
