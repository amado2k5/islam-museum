label: { ar: "قرليون", en: "Qarliyun (Corleone)", es: "Qarliyun (Corleone)", fr: "Qarliyun (Corleone)", ur: "قرلیون ⁦(کورلیون)⁩", tr: "Qarleon", id: "Qarleon" }
summary:
  ar: "حصن حصين منيع ومعقل مشيد رفيع، بقربه نهر منسوب إليه، ويصفه الإدريسي بالمنعة، وتبعد عن جاطوا خمسة أميال. {cite:nuzhat-al-mushtaq-2002 p. 605}"
  en: "A strong, unassailable fortress and tall stronghold beside a river named after it; five miles from Jatawa, in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 605}"
  es: "Una fortaleza sólida e inexpugnable, un alto baluarte junto a un río que lleva su nombre; a cinco millas de Jatawa, según el relato de al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 605}"
  fr: "Une forteresse imprenable et un haut lieu de pouvoir, situés au bord d'une rivière qui porte son nom; à cinq milles de Jatawa, selon le récit d'al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 605}"
  ur: "ایک مضبوط، ناقابل تسخیر قلعہ اور اس کے نام سے منسوب ایک ندی کے کنارے لمبا قلعہ؛ جاتاوا سے پانچ میل، الادریسی کے کھاتے میں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 605}"
  tr: "Güçlü bir kale ve yüksek inşa edilmiş bir kale, yakınında ona atfedilen bir nehir bulunur; al-Idrisi tarafından 'al-Man'a'ah' olarak tanımlanır ve Jatoua'ya beş mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 605}"
  id: "Sebuah benteng yang kuat, dan sangat kuat, di dekatnya terdapat sungai yang dikaitkan dengannya, yang digambarkan oleh al-Idrisi sebagai 'al-Man'a'ah,' dan terletak lima mil dari Jatoua. {cite:Nuzhat-al-Mushtaq-2002 hlm. 605}"
