summary:
  en: "Village in southern Jordan, near which the Muslims fought a Byzantine-led force in 629 CE."
  ar: "قرية في جنوب الأردن من أعمال كرك الشوبك، قرب موضعها قاتل المسلمون جيشًا بيزنطيًا سنة 629م؛ وبها عند ابن فضل الله العمري قبور شهداء مؤتة: جعفر الطيار وزيد بن حارثة وعبد الله بن رواحة والحارث بن النعمان وعبد الله بن سهل وسعد بن عامر القيسي ودجانة الأنصاري {cite:umari-masalik-1924 p. 218}."
  es: "Aldea en el sur de Jordania, cerca de la cual los musulmanes lucharon contra una fuerza liderada por los bizantinos en el año 629 d.C."
  fr: "Village du sud de la Jordanie, près duquel les musulmans ont combattu une armée byzantine en 629 après J.-C."
  ur: "جنوبی اردن کا ایک گاؤں، جس کے قریب مسلمانوں نے 629 عیسوی میں بازنطینی قیادت والی فوج سے جنگ کی۔"
  tr: "Güney Ürdün'de, Karak al-Shoubak bölgesinde, 629 yılında Müslümanların Bizans ordusuyla savaştığı bir köy; Mu'tah şehitlerinin mezarlarını barındırır; bunlar arasında Ja'far al-Tayyar, Zayd bin Haritha, Abdullah ibn Rawaha, al-Harith ibn al-Nu'man, Abdullah ibn Sahl, Sa'd ibn Amir al-Qaisi ve Dajana al-Ansari bulunmaktadır {cite:umari-masalik-1924, s. 218}."
  id: "Sebuah desa di selatan Yordania di distrik Karak al-Shoubak, dekat tempat Muslim melawan tentara Bizantium pada tahun 629 M; di dalamnya terdapat makam para syuhada Mu'tah, termasuk Ja'far al-Tayyar, Zayd ibn Haritha, Abdullah ibn Rawaha, al-Harith ibn al-Nu'man, Abdullah ibn Sahl, Sa'd ibn Amir al-Qaisi, dan Dajana al-Ansari {cite:umari-masalik-1924, hlm. 218}."
