summary:
  ar: "مدينة حسنة عامرة آهلة، أهلها صقالبة، وهم أهل غزو ومراكب، وهي آخر بلاد الصقالبة من ناحية الغرب، وتبعد عن شئغنو ثلاثين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  en: "A fine, populous, inhabited city of Slavs who are raiders with ships; the last Slav land toward the west, thirty miles from Shighnu. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  es: "Una hermosa y populosa ciudad habitada por eslavos que se dedican al saqueo con barcos; el último territorio eslavo hacia el oeste, a treinta millas de Shighnu. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  fr: "Une belle ville, peuplée et animée, habitée par des Slaves pillards possédant des navires; la dernière terre slave à l’ouest, à trente milles de Shighnu. {cite:nuzhat-al-mushtaq-2002 p. 769}"
  ur: "ایک عمدہ، آبادی والا، سلاووں کا آباد شہر جو بحری جہازوں پر حملہ آور ہوتے ہیں۔ آخری سلاو سرزمین مغرب کی طرف، شگنو سے تیس میل دور ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 769}"
