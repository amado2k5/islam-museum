summary:
  ar: بلدة في اليمن كان أهلها قد كاتبوا الهادي وكانت في يد الدعام، دخلها الهادي في جمادى الأولى 286هـ فبايعه أهلها.
  en: A town in Yemen whose notables had written to al-Hadi and which was in al-Da'am's hand; al-Hadi entered it in Jumada I 286 AH and its people pledged to him.
  ur: یمن کا ایک قصبہ جس کے معززین نے ہادی کو لکھا تھا اور جو دعام کے ہاتھ میں تھا؛ ہادی جمادی الاولیٰ 286ھ میں اس میں داخل ہوئے اور اس کے لوگوں نے بیعت کی۔
  es: "Una ciudad de Yemen cuyos notables habían escrito a al-Hadi y que estaba en manos de al-Da'am; al-Hadi entró en ella en Jumada I de 286 AH y su gente le juró lealtad."
  fr: "Une ville du Yémen dont les notables avaient écrit à al-Hadi et qui était aux mains d'al-Da'am; al-Hadi y entra en Jumada I 286 AH et ses habitants lui prêtèrent allégeance."
