summary:
  ar: "بلدة صغيرة على ساحل اليمن، يسكنها جماعة من أولاد الهلبي، وهم طائفة من تجار اليمن أكثرهم ساكنون بصنعاء، ومعروفون بالإطعام وإعانة الحجاج وتزويدهم. أقام بها ابن بطوطة ليلة واحدة في ضيافتهم ⁦(الرحلة، الطبعة 1958م، ص 156)⁩."
  en: "A small town on the Yemeni coast, inhabited by a group of the Awlad al-Halbi, who are Yemeni merchants most of whom live in Sanaa, known for hospitality, for aiding pilgrims and for supplying them. Ibn Battuta spent one night there as their guest (the Rihla, 1958 edition, p. 156)."
  es: "Un pequeño pueblo en la costa yemení, habitado por un grupo de los Awlad al-Halbi, comerciantes yemeníes, la mayoría residentes en Saná, conocidos por su hospitalidad, por ayudar a los peregrinos y por abastecerlos. Ibn Battuta pasó una noche allí como huésped (Rihla, edición de 1958, pág. 156)."
  fr: "Une petite ville côtière du Yémen, habitée par les Awlad al-Halbi, des marchands yéménites dont la plupart résident à Sanaa, réputés pour leur hospitalité, leur aide aux pèlerins et leur approvisionnement. Ibn Battuta y passa une nuit en leur compagnie (Rihla, édition de 1958, p. 156)."
  ur: "یمنی ساحل پر ایک چھوٹا سا قصبہ، جس میں اولاد الحلبی کا ایک گروہ آباد ہے، جو یمنی تاجر ہیں جن میں سے زیادہ تر صنعا میں رہتے ہیں، جو مہمان نوازی، حاجیوں کی مدد اور ان کی فراہمی کے لیے جانا جاتا ہے۔ ابن بطوطہ نے وہاں ایک رات ان کے مہمان کے طور پر گزاری ⁦(رحلہ، 1958 ایڈیشن، صفحہ 156)⁩۔"
  tr: "Yemen kıyısında küçük bir kasaba, çoğunluğu Sana'a'da yaşayan ve hacılara yiyecek ve yardım sağlamasıyla tanınan Yemenli tüccarlardan oluşan Awlad al-Hilbi grubunun yaşadığı küçük bir kasabadır. İbn Battuta burada bir gece misafir olarak kalmıştır (Al-Rihla, 1958 baskısı, s. 156)."
  id: "Sebuah kota kecil di pesisir Yaman, dihuni oleh sekelompok Awlad al-Hilbi, sekelompok pedagang Yaman, sebagian besar tinggal di Sana'a, dikenal karena menyediakan makanan dan bantuan bagi para peziarah. Ibn Battuta menginap di sana selama satu malam sebagai tamu mereka (Al-Rihla, edisi 1958, hlm. 156)."
