summary:
  ar: "مدينة متحضرة بها أسواق قائمة وعمارات دائمة، على ساحل البحر، ويذكر المؤلف أنها على يسار الداخل من فم النهر {cite:nuzhat-al-mushtaq-2002 p. 949}."
  en: "A civilised city with standing markets and permanent buildings on the sea coast, on the left as one enters from the river mouth {cite:nuzhat-al-mushtaq-2002 p. 949}."
  es: "Una ciudad civilizada con mercados permanentes y edificios establecidos en la costa, a la izquierda al entrar desde la desembocadura del río {cite:nuzhat-al-mushtaq-2002 p. 949}."
  fr: "Une ville civilisée avec des marchés permanents et des bâtiments permanents sur la côte maritime, à gauche lorsqu'on entre par l'embouchure du fleuve {cite:nuzhat-al-mushtaq-2002 p. 949}."
  ur: "ایک مہذب شہر جس میں دریا کے منہ سے داخل ہوتے ہی بائیں طرف سمندر کے ساحل پر منڈیاں اور مستقل عمارتیں کھڑی ہیں۔ 949}۔"
  tr: "Mevcut pazarları ve deniz kıyısında kalıcı binaları olan medeni bir şehirdir ve yazar, nehrin ağzından girişin solunda olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 949}."
  id: "Sebuah kota yang beradab dengan pasar yang sudah ada dan bangunan permanen di tepi pantai, dan penulis menyebutkan bahwa kota ini berada di sebelah kiri pintu masuk dari muara sungai {cite:Nuzhat-al-mushtaq-2002, hlm. 949}."
