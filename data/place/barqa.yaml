summary:
  ar: "برقة إقليم المغرب الأدنى بين مصر وإفريقية ومدينتها أنطابلس؛ صالحها عمرو بن العاص بعد فتح الإسكندرية على ثلاثة عشر ألف دينار جزية يبيعون فيها من أبنائهم من أحبّوا، وكان أهلها يبعثون بخراجهم إلى والي مصر من غير حاثّ فكانوا أخصب قوم بالمغرب ولم تدخلها فتنة؛ وبها قرية لواتة من البربر أهل العهد ومنها زويلة منقطع عقبة بن نافع الأول."
  en: "Barqa (Cyrenaica), the nearer Maghreb between Egypt and Ifriqiya, its city Antabulus; Amr ibn al-As compounded with it after Alexandria's fall for a thirteen-thousand-dinar jizya in which they might sell whom they wished of their children; its people sent their kharaj to Egypt's governor unpressed — the most prosperous folk of the Maghreb, untouched by fitna — and among it the covenant-holding Berber village of Lawata, and Zawila whence Uqba ibn Nafi's first charge began."
  ur: "مصر اور افریقیہ کے درمیان واقع خطہ؛ بلاذری اس کے باشندوں کی عمرو بن عاص کے ساتھ صلح اور مصر کے والی کو خراج بھیجنے کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "Barqa (Cirenaica), el Magreb más cercano entre Egipto e Ifriqiya, su ciudad Antabulus; Amr ibn al-As se asoció con ella después de la caída de Alejandría por una jizya de trece mil dinares en la que podían vender a quien quisieran de sus hijos; su gente envió a su kharaj al gobernador de Egipto sin presión —la gente más próspera del Magreb, intacta por la fitna— y entre ellos la aldea bereber de Lawata, que mantenía un pacto, y Zawila, de donde comenzó el primer encargo de Uqba ibn Nafi."
  fr: "Barqa (Cyrénaïque), le Maghreb le plus proche entre l'Égypte et l'Ifriqiya, sa ville Antabulus; Amr ibn al-As s'allia avec elle après la chute d'Alexandrie pour une jizya de treize mille dinars dans laquelle ils pouvaient vendre qui ils voulaient de leurs enfants; ses habitants envoyèrent leur kharaj au gouverneur d'Égypte sans pression — le peuple le plus prospère du Maghreb, non touché par la fitna — et parmi eux le village berbère de Lawata, qui tenait une alliance, et Zawila d'où partit la première charge d'Uqba ibn Nafi."
