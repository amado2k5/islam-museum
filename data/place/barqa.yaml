summary:
  ar: "برقة إقليم المغرب الأدنى بين مصر وإفريقية ومدينتها أنطابلس؛ صالحها عمرو بن العاص بعد فتح الإسكندرية على ثلاثة عشر ألف دينار جزية يبيعون فيها من أبنائهم من أحبّوا، وكان أهلها يبعثون بخراجهم إلى والي مصر من غير حاثّ فكانوا أخصب قوم بالمغرب ولم تدخلها فتنة؛ وبها قرية لواتة من البربر أهل العهد ومنها زويلة منقطع عقبة بن نافع الأول."
  en: "Barqa (Cyrenaica), the nearer Maghreb between Egypt and Ifriqiya, its city Antabulus; Amr ibn al-As compounded with it after Alexandria's fall for a thirteen-thousand-dinar jizya in which they might sell whom they wished of their children; its people sent their kharaj to Egypt's governor unpressed — the most prosperous folk of the Maghreb, untouched by fitna — and among it the covenant-holding Berber village of Lawata, and Zawila whence Uqba ibn Nafi's first charge began."
  ur: "مصر اور افریقیہ کے درمیان واقع خطہ؛ بلاذری اس کے باشندوں کی عمرو بن عاص کے ساتھ صلح اور مصر کے والی کو خراج بھیجنے کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
