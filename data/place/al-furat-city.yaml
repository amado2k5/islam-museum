summary:
  ar: "مدينة الفرات من كور دجلة؛ فتحها مجاشع بن مسعود السلمي عنوة وخرج أهلها إلى المسلمين بمساحيهم فظفروا بهم وفيها قالت أردة بنت الحارث بيتها المشهور تحرض للقتال."
  en: "The town of al-Furat in the Tigris districts; Mujashi' ibn Mas'ud took it by force, its folk coming out with their spades — where Arda bint al-Harith sang her famous goading verse."
  es: "La ciudad de al-Furat, en la región del Tigris; Mujashi' ibn Mas'ud la tomó por la fuerza, y sus habitantes salieron con sus palas, donde Arda bint al-Harith cantó su famoso verso de incitación."
  fr: "La ville d'al-Furat dans les districts du Tigre; Mujashi' ibn Mas'ud l'a prise par la force, ses habitants sortant avec leurs pelles — où Arda bint al-Harith a chanté son célèbre verset provocateur."
  ur: "دجلہ کے اضلاع میں الفرات کا قصبہ؛ مجاشی ابن مسعود نے اسے زبردستی لے لیا، اس کے لوگ اپنے کودوں کے ساتھ باہر نکل آئے - جہاں اردہ بنت الحارث نے اپنی مشہور غزل گائی۔"
  tr: "Fırat şehri Diğle Sırtı'ndan gelir; Mücashi bin Mes'ud el-Sulami tarafından zorla fethedilmiş ve halkı topraklarıyla birlikte Müslümanlara karşı yürümüş, onlar da onları yenmiştir. Burada Ardah bint al-Harith, ünlü evinin kavgayı kışkırttığını söylemiştir."
  id: "Kota Efrat berasal dari Punggungan Tigris; kota ini ditaklukkan secara paksa oleh Mujashi' ibn Mas'ud al-Sulami, dan penduduknya berbaris melawan Muslim dengan wilayah mereka, yang kemudian mengalahkan mereka. Dalam cerita itu, Ardah bint al-Harith mengatakan bahwa rumah terkenalnya memicu pertempuran."
