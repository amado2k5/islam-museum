summary:
  ar: "حصن على البحر الأسود قرب مصب نهر الكوبان، بناه مهندسون فرنسيون للسلطان عبد الحميد الأول سنة 1781م، وتداولته الدولة العثمانية وروسيا حتى ضُمت إلى روسيا بمعاهدة أدرنة سنة 1829م {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  en: "A former fortress on the Black Sea, on the Bugur river some 40 km south-west of the Kuban estuary, built by French engineers for Sultan Abd al-Hamid I in 1781. It passed between Turkey and Russia until the treaty of Adrianople (1829) ceded it to Russia {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
