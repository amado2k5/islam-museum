summary:
  ar: "حصن على البحر الأسود قرب مصب نهر الكوبان، بناه مهندسون فرنسيون للسلطان عبد الحميد الأول سنة 1781م، وتداولته الدولة العثمانية وروسيا حتى ضُمت إلى روسيا بمعاهدة أدرنة سنة 1829م {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  en: "A former fortress on the Black Sea, on the Bugur river some 40 km south-west of the Kuban estuary, built by French engineers for Sultan Abd al-Hamid I in 1781. It passed between Turkey and Russia until the treaty of Adrianople (1829) ceded it to Russia {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  es: "Antigua fortaleza en el Mar Negro, en el río Bugur, a unos 40 km al suroeste del estuario del Kubán, construida por ingenieros franceses para el sultán Abd al-Hamid I en 1781. Pasó de manos de Turquía a Rusia hasta que el Tratado de Adrianópolis (1829) la cedió a Rusia {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  fr: "Une ancienne forteresse sur la mer Noire, sur la rivière Bugur à quelque 40 km au sud-ouest de l'estuaire du Kouban, construite par des ingénieurs français pour le sultan Abd al-Hamid Ier en 1781. Elle est passée entre la Turquie et la Russie jusqu'à ce que le traité d'Andrinople (1829) la cède à la Russie {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  ur: "بحیرہ اسود پر ایک سابقہ قلعہ، دریائے بگور پر، کوبان کے ساحل سے 40 کلومیٹر جنوب مغرب میں، جسے فرانسیسی انجینئروں نے 1781 میں سلطان عبد الحمید اول کے لیے تعمیر کیا تھا۔ یہ ترکی اور روس کے درمیان اس وقت تک گزرا جب تک کہ ایڈریانوپل (1829) کے معاہدے نے اسے روس کے حوالے نہ کر دیا۔ 1 ص۔ 504}۔"
  tr: "Kuban Nehri'nin ağzına yakın Karadeniz kıyısında, 1781 yılında Fransız mühendisler tarafından Sultan I. Abdülhamid için inşa edilen ve Osmanlı İmparatorluğu ile Rusya tarafından takas edilen, 1829'da Edirne Antlaşması ile ilhak edilen bir kaledir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 504}."
  id: "Sebuah benteng di Laut Hitam dekat muara Sungai Kuban, dibangun oleh insinyur Prancis untuk Sultan Abdul Hamid I pada tahun 1781 M, dan dipertukarkan oleh Kekaisaran Ottoman dan Rusia hingga dianeksasi oleh Perjanjian Edirne pada tahun 1829 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 504}."
