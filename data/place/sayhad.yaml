summary:
  ar: "فلاة اليمن التي تسمى الغائط؛ عند الهمداني تتغرّف من الدهناء من ناحية اليمامة والعلج وتشرع عليها جُزُر اليمن، وتتسع فيما بين نجران وبيحان وحضرموت أربعاً وخمس مراحل، وأكثرها خلف نجران إلى الشمال حيث تقبل من فرعي الدهناء، وهي فلاء لا ماء فيها إلا عند المناهل كالعَبْر {cite:sifat-jazirat-al-arab p. 67}."
  en: "The great waste of Yemen also called al-Gha'it — al-Hamdani traces it branching off the Dahna by the Yamama and 'Alj side, pressed by the peninsula's highlands, widening between Najran, Bayhan and Hadramawt to four or five stages, waterless save at its few road-wells like al-'Abr {cite:sifat-jazirat-al-arab p. 67}."
