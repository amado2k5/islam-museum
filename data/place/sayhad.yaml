summary:
  ar: "فلاة اليمن التي تسمى الغائط؛ عند الهمداني تتغرّف من الدهناء من ناحية اليمامة والعلج وتشرع عليها جُزُر اليمن، وتتسع فيما بين نجران وبيحان وحضرموت أربعاً وخمس مراحل، وأكثرها خلف نجران إلى الشمال حيث تقبل من فرعي الدهناء، وهي فلاء لا ماء فيها إلا عند المناهل كالعَبْر {cite:sifat-jazirat-al-arab p. 67}."
  en: "The great waste of Yemen also called al-Gha'it — al-Hamdani traces it branching off the Dahna by the Yamama and 'Alj side, pressed by the peninsula's highlands, widening between Najran, Bayhan and Hadramawt to four or five stages, waterless save at its few road-wells like al-'Abr {cite:sifat-jazirat-al-arab p. 67}."
  es: "El gran desierto de Yemen, también llamado al-Gha'it, según al-Hamdani, se ramifica desde el río Dahna por el lado de Yamama y 'Alj, presionado por las tierras altas de la península, ensanchándose entre Najran, Bayhan y Hadramawt en cuatro o cinco etapas, sin agua salvo en sus pocos pozos de carretera como al-'Abr {cite:sifat-jazirat-al-arab p. 67}."
  fr: "Le grand désert du Yémen, également appelé al-Gha'it, est décrit par al-Hamdani comme se détachant du Dahna du côté de Yamama et 'Alj, pressé par les hauts plateaux de la péninsule, s'élargissant entre Najran, Bayhan et Hadramawt en quatre ou cinq étapes, sans eau sauf à ses quelques puits routiers comme al-'Abr {cite:sifat-jazirat-al-arab p. 67}."
  ur: "یمن کے عظیم فضلے کو الغیط بھی کہا جاتا ہے - الحمدانی نے اسے یمامہ اور الجز کی طرف سے دہنا سے شاخیں نکالتے ہوئے، جزیرہ نما کی بلندیوں سے دبایا، نجران، بیہان اور حضرموت کے درمیان چار یا پانچ مرحلوں تک چوڑا، اس کے چند سڑکوں کے کنوؤں پر پانی سے پاک ہے جیسا کہ التحفظات۔ 67}۔"
  tr: "Yemen'in ovaları, Al-Gha'it olarak adlandırılır; Al-Hamdani'ye göre, Al-Dahna yönüne ve Al-Alaj yönünden gelen bir sulama sistemidir ve Yemen adaları onun üzerinde kuruludur. Nejran, Bihan ve Hadramawt arasında dört veya beş aşamada uzanır; bunların çoğu kuzeyde Necran'ın arkasında yer alır ve Al-Dahna'nın iki kolundan kabul edilir. Al-Abr gibi kaynaklar dışında suyu olmayan bir ovadır {cite:sifat-jazirat-al-Arab, s. 67}."
  id: "Dataran Yaman yang disebut Al-Gha'it; menurut Al-Hamdani, ini adalah penyiram dari Al-Dahna ke arah Al-Yamamah dan Al-Alaj, dan pulau-pulau Yaman terbentuk di atasnya. Dataran ini membentang antara Najran, Bihan, dan Hadramawt dalam empat atau lima tahap, sebagian besar terletak di belakang Najran di utara, di mana ia diterima dari dua cabang Al-Dahna. Ini adalah dataran yang tidak memiliki air kecuali di mata air seperti Al-Abr {cite:sifat-jazirat-al-Arab, hlm. 67}."
