summary:
  ar: "بلاد الجبل جنوب بحر الخزر غرب طبرستان؛ كسر عروة بن زيد الديلم مع أهل الري يوم الفتح وغزاهم كثير بن شهاب من الري فأوقع بهم وغزا سعد بن أبي وقاص الديلم عام ولايته الثانية وظل أهل الري يغزونهم من دستبى."
  en: "The mountain country south of the Caspian west of Tabaristan; Urwa ibn Zayd broke Daylam with the Rayy host on conquest day, Kathir ibn Shihab raided them from Rayy and routed them, Sa'd raided them in his second governorship, and Rayy's amils kept raiding Daylam from Dastaba."
  es: "La región montañosa al sur del Caspio, al oeste de Tabaristán; Urwa ibn Zayd quebró Daylam con el ejército de Rayy el día de la conquista, Kathir ibn Shihab los asaltó desde Rayy y los derrotó, Sa'd los asaltó en su segundo gobierno, y los amils de Rayy continuaron asaltando Daylam desde Dastaba."
  fr: "La région montagneuse au sud de la Caspienne à l'ouest du Tabaristan; Urwa ibn Zayd a vaincu Daylam avec l'armée de Rayy le jour de la conquête, Kathir ibn Shihab les a attaqués depuis Rayy et les a mis en déroute, Sa'd les a attaqués lors de son deuxième gouvernement, et les amils de Rayy ont continué à attaquer Daylam depuis Dastaba."
  ur: "طبرستان کے مغرب میں کیسپین کے جنوب میں پہاڑی ملک؛ عروہ بن زید نے فتح کے دن رے کے لشکر کے ساتھ دیلام کو توڑا، کثیر ابن شہاب نے ان پر رے سے چھاپہ مارا اور ان کو بھگا دیا، سعد نے اپنی دوسری گورنری میں ان پر چھاپہ مارا اور رے کے عامل دستبہ سے دیلام پر چھاپہ مارتے رہے۔"
  tr: "Dağ, Hazar Denizi'nin güneyinde, Tabaristan'ın batısında; Urwah ibn Zaid, fetih gününde Rayy halkıyla birlikte Daylam'ı yendi ve Rayy'den Kathir ibn Shihab tarafından saldırdı; bu da onların düşmesine ve ikinci saltanatının yılında Sa'd ibn Abi Wakkas al-Daylam'a baskın yapmasına neden oldu. Rayy halkı, Dastaba'dan onları yağmalamaya devam etti."
  id: "Tanah pegunungan di selatan Laut Kaspia di barat Tabaristan; Urwah ibn Zaid mengalahkan Daylam bersama orang-orang Rayy pada hari penaklukan dan menyerang mereka oleh Kathir ibn Shihab dari Rayy, menyebabkan mereka jatuh dan menyerang Sa'd ibn Abi Waqqas al-Daylam pada tahun pemerintahan keduanya. Penduduk Rayy terus menyerang mereka dari Dastaba."
