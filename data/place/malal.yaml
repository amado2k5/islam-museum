summary:
  ar: "مدينة صغيرة لا سور لها، أشبه بقرية كبيرة، على تل من تراب أحمر يحميها، ويتحصن أهلها فيه من غارات السودان الآخرين. يشربون من عين تخرج من جبل جنوبها، ماؤها مالح. ومن أهلها من يُسبى ويُباع، ويُوسم الجميع بالنار في وجوههم {cite:nuzhat-al-mushtaq-2002 p. 22}."
  en: "A small town without walls, like a large village, on a hill of red earth that protects its people from raids. They drink from a spring that rises in the mountain to the south, and its water is brackish. Its people are raided and sold, and everyone there is marked with a burn on the face {cite:nuzhat-al-mushtaq-2002 p. 22}."
  es: "Un pequeño pueblo sin murallas, como una aldea grande, en una colina de tierra roja que protege a sus habitantes de las incursiones. Beben de un manantial que brota en la montaña al sur, y su agua es salobre. Sus habitantes son asaltados y vendidos, y todos quedan marcados con una quemadura en el rostro {cite:nuzhat-al-mushtaq-2002 p. 22}."
  fr: "Une petite ville sans remparts, semblable à un grand village, perchée sur une colline de terre rouge qui protège ses habitants des raids. Ils s'abreuvent à une source jaillissant de la montagne au sud, dont l'eau est saumâtre. Ses habitants sont victimes de pillages et de vente, et tous portent la marque d'une brûlure au visage {cite:nuzhat-al-mushtaq-2002 p. 22}."
  ur: "دیواروں کے بغیر ایک چھوٹا سا شہر، ایک بڑے گاؤں کی طرح، سرخ زمین کی ایک پہاڑی پر جو اپنے لوگوں کو چھاپوں سے بچاتا ہے۔ وہ ایک چشمے سے پیتے ہیں جو پہاڑ سے جنوب کی طرف نکلتا ہے اور اس کا پانی کھارا ہے۔ اس کے لوگوں پر چھاپہ مار کر فروخت کیا جاتا ہے، اور وہاں موجود ہر شخص کے چہرے پر جلنے کے نشانات ہیں۔ 22}۔"
