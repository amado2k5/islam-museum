label: { ar: "ملل", en: "Malal" }
summary:
  ar: "مدينة صغيرة لا سور لها، أشبه بقرية كبيرة، على تل من تراب أحمر يحميها، ويتحصن أهلها فيه من غارات السودان الآخرين. يشربون من عين تخرج من جبل جنوبها، ماؤها مالح. ومن أهلها من يُسبى ويُباع، ويُوسم الجميع بالنار في وجوههم {cite:nuzhat-al-mushtaq-2002 p. 22}."
  en: "A small town without walls, like a large village, on a hill of red earth that protects its people from raids. They drink from a spring that rises in the mountain to the south, and its water is brackish. Its people are raided and sold, and everyone there is marked with a burn on the face {cite:nuzhat-al-mushtaq-2002 p. 22}."
