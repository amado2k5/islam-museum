summary:
  ar: "موضع فيه كنيسة متقنة البناء، ويذكر الإدريسي أنه المكان الذي ولد فيه المسيح، وفيه قبر راحيل على الطريق، وتبعد عن بيت المقدس نحو ستة أميال. {cite:nuzhat-al-mushtaq-2002 p. 362}"
  en: "A place with a finely built church, which al-Idrisi says marks where Jesus was born; Rachel's tomb lies on the road, and it is about six miles from Jerusalem. {cite:nuzhat-al-mushtaq-2002 p. 362}"
  es: "Un lugar con una iglesia de hermosa construcción, que según al-Idrisi marca el lugar de nacimiento de Jesús; la tumba de Raquel se encuentra en el camino, y está a unos seis kilómetros de Jerusalén. {cite:nuzhat-al-mushtaq-2002 p. 362}"
  fr: "Un lieu abritant une église à l'architecture raffinée, qui, selon al-Idrisi, marque l'endroit de naissance de Jésus; le tombeau de Rachel se trouve sur la route, et le site est à environ six milles de Jérusalem. {cite:nuzhat-al-mushtaq-2002 p. 362}"
