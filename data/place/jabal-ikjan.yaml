label: { ar: "جبل ايكجان", en: "Jabal Ikjan", es: "Jabal Ikjan", fr: "Jabal Ikjan", ur: "جبل اکجان", tr: "Ikejan Dağı", id: "Gunung Ikejan" }
summary:
  ar: "جبل قرب سطيف فيه قبائل كتامة، ويذكر الإدريسي أنهم يبذلون الطعام للضيف ويكرمونه كرامة بالغة. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  en: "A mountain near Setif inhabited by the Kutama tribes, who, al-Idrisi says, give food freely to guests and honour them greatly. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  es: "Una montaña cerca de Setif habitada por las tribus Kutama, quienes, según al-Idrisi, ofrecen comida generosamente a los huéspedes y los honran enormemente. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  fr: "Une montagne près de Sétif habitée par les tribus Kutama qui, selon al-Idrisi, offrent généreusement à manger aux invités et les honorent grandement. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  ur: "سیٹف کے قریب ایک پہاڑ جس میں کوٹامہ قبائل آباد ہیں، جو الادریسی کا کہنا ہے کہ مہمانوں کو کھلا کھانا دیتے ہیں اور ان کی بہت عزت کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 269}"
  tr: "Sétif yakınlarındaki bir dağ Katama kabilelerine ev sahipliği yapar ve El-İdrisi, misafire yiyecek sunduklarını ve onu büyük bir onurla onurlandırdıklarını belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 269}"
  id: "Sebuah gunung dekat Sétif menjadi rumah bagi suku Katama, dan Al-Idrisi menyebutkan bahwa mereka menawarkan makanan kepada tamu dan menghormatinya dengan martabat yang tinggi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 269}"
