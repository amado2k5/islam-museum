label: { ar: "تكرور", en: "Takrur" }
summary:
  ar: "مدينة جنوب النيل، تبعد عن سلى نحو يومين في النيل وفي البر، وهي أكبر من سلى وأكثر تجارة. يصلها تجار المغرب الأقصى بالصوف والنحاس والخرز، ويخرجون منها الذهب والعبيد. وكان حاكمها، التكروري، ذا جند وعدل معروف {cite:nuzhat-al-mushtaq-2002 p. 18}."
  en: "A city south of the Nile, about two days from Sala, larger and busier than Sala. Merchants from the far Maghreb bring wool, copper and beads, and carry out gold and slaves. Its ruler, the Takruri, had soldiers and was known for justice {cite:nuzhat-al-mushtaq-2002 p. 18}."
