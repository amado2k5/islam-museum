summary:
  ar: "مدينة على نهر جيحان، بينها وبين مدينة الملون قنطرة من حجارة، وبالرومية اسمها مامسترة، وبها بساتين وزروع متصلة. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  en: "A town on the Jayhan river, with a stone bridge to al-Mulan; its Greek name is Mamstra; orchards and fields surround it. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  es: "Un pueblo a orillas del río Jayhan, con un puente de piedra que lo conecta con al-Mulan; su nombre griego es Mamstra; está rodeado de huertos y campos. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  fr: "Une ville située sur la rivière Jayhan, reliée à al-Mulan par un pont de pierre; son nom grec est Mamstra; elle est entourée de vergers et de champs. {cite:nuzhat-al-mushtaq-2002 p. 646}"
  ur: "دریائے جیہان پر ایک قصبہ، المولان تک پتھر کا پل کے ساتھ؛ اس کا یونانی نام Mamstra ہے۔ اس کے چاروں طرف باغات اور کھیت۔ {حوالہ: نزہت المشتاق-2002 ص۔ 646}"
