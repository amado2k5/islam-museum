id: place/jazirat-sanji
class: place
kind: island
label: { ar: "جزيرة صنجى", en: "Sanji island", es: "Isla Sanji", fr: "Île de Sanji", ur: "سانجی جزیرہ", tr: "Sanji Adası", id: "Pulau Sanji" }
summary:
  ar: "جزيرة عامرة فيها خصب ومياه عذبة، وأهلها بين البياض والسمرة، ويضعون أقراط النحاس في آذانهم، وفيها معادن ذهب، وفي ساحلها أصنام لها يد مرفوعة، ذكر المؤلف أنها تشير إلى من يراها بالرجوع {cite:nuzhat-al-mushtaq-2002 p. 92}."
  en: "A populated island with fertile land and fresh water, whose people are between fair and dark in complexion and wear copper earrings. The author reports gold mines there and idols on the shore, one with a raised hand, which he says seem to tell the viewer to turn back {cite:nuzhat-al-mushtaq-2002 p. 92}."
  es: "Una isla poblada con tierras fértiles y agua dulce, cuyos habitantes tienen tez entre clara y oscura y usan pendientes de cobre. El autor menciona minas de oro e ídolos en la orilla, uno de ellos con la mano levantada, que, según él, parece indicar al espectador que retroceda {cite:nuzhat-al-mushtaq-2002 p. 92}."
  fr: "Une île habitée aux terres fertiles et à l'eau douce, dont les habitants ont le teint clair à foncé et portent des boucles d'oreilles en cuivre. L'auteur mentionne des mines d'or et des idoles sur le rivage, dont une avec une main levée, qui, selon lui, semble inviter le spectateur à rebrousser chemin {cite:nuzhat-al-mushtaq-2002 p. 92}."
  ur: "زرخیز زمین اور میٹھے پانی کے ساتھ ایک آبادی والا جزیرہ، جس کے لوگ رنگت میں میلے اور سیاہ کے درمیان ہوتے ہیں اور تانبے کی بالیاں پہنتے ہیں۔ مصنف نے وہاں سونے کی کانوں اور ساحل پر بتوں کی اطلاع دی ہے، جس میں سے ایک ہاتھ اٹھائے ہوئے ہے، جس کے بارے میں وہ کہتا ہے کہ دیکھنے والے کو پیچھے ہٹنے کو کہتے ہیں۔ 92}۔"
  tr: "Bereketli suyu ve tatlı suyu olan canlı bir ada olan bu ada, halkı beyaz ile koyu renk arasında değişir, kulaklarında altın mineralleri bulunan bakır küpeler takar ve kıyısında elleri kaldırılmış putlar vardır. Yazar, bunları görenlere çevirerek gösterdiğini belirtmiştir {cite:Nuzhat-al-mushtaq-2002, s. 92}."
  id: "Sebuah pulau yang subur dengan air subur dan air tawar, penduduknya berada di antara putih dan gelap, mengenakan anting tembaga di telinga mereka, mengandung mineral emas, dan di pesisirnya terdapat patung dengan tangan terangkat. Penulis menyebutkan bahwa patung-patung itu menunjukkan kepada mereka yang melihatnya dengan membalik {cite:Nuzhat-al-mushtaq-2002, hlm. 92}."
