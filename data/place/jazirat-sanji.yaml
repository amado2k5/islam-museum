summary:
  ar: "جزيرة عامرة فيها خصب ومياه عذبة، وأهلها بين البياض والسمرة، ويضعون أقراط النحاس في آذانهم، وفيها معادن ذهب، وفي ساحلها أصنام لها يد مرفوعة، ذكر المؤلف أنها تشير إلى من يراها بالرجوع {cite:nuzhat-al-mushtaq-2002 p. 92}."
  en: "A populated island with fertile land and fresh water, whose people are between fair and dark in complexion and wear copper earrings. The author reports gold mines there and idols on the shore, one with a raised hand, which he says seem to tell the viewer to turn back {cite:nuzhat-al-mushtaq-2002 p. 92}."
