summary:
  ar: "مدينة من مدن ملوك الكيماكية الست عشرة، يذكرها الإدريسي مع بوراغ ومنان ومستناح، وتبعد عن أسطور اثني عشر يوماً. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  en: "One of the sixteen cities of the Kimak kings, which al-Idrisi names with Buragh, Manan and Mustanah; twelve days from Astur. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  es: "Una de las dieciséis ciudades de los reyes Kimak, a las que al-Idrisi nombra junto con Buragh, Manan y Mustanah; a doce días de Astur. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  fr: "L'une des seize villes des rois Kimak, qu'al-Idrisi cite avec Buragh, Manan et Mustanah; à douze jours d'Astur. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  ur: "کیمک بادشاہوں کے سولہ شہروں میں سے ایک، جسے الادریسی نے براغ، منان اور مستانہ کے نام سے موسوم کیا ہے۔ استور سے بارہ دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 716}"
  tr: "Kimakia'nın on altı kralından biri olan bu şehir, el-İdrisi tarafından Buragh, Manan ve Mustanah ile birlikte bahsedilir ve efsanelerden on iki gün uzaklıktadır. {alıntı:nuzhat-al-mushtaq-2002 s. 716}"
  id: "Sebuah kota di antara enam belas raja Kimakia, disebutkan oleh al-Idrisi bersama Buragh, Manan, dan Mustanah, dan masih dua belas hari lagi dari legenda. {cite:Nuzhat-al-Mushtaq-2002 hlm. 716}"
