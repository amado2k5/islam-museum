label: { ar: "مغارة الدم", en: "the Cave of Blood", es: "La cueva de sangre", fr: "la grotte du sang", ur: "خون کی غار", tr: "Kan Mağarası", id: "Gua Darah" }
summary:
  ar: "مغارة بجبل قاسيون بدمشق تسمى مغارة الدم، يُزعم أن فيه قتل ابن آدم أخاه؛ وكان موضع استسقاء: صعد إليها مكحول مع عمر بن عبد العزيز يسأل السقيا، وخرج إليها معاوية والمسلمون فلم يبرحوا حتى سالت الأودية، وصعد إليها أهل دمشق في خلافة هشام فأقاموا في الغار الذي تحتها ثلاثة أيام للمطر {cite:umari-masalik-1924 p. 205-206}."
  en: "The cave on Damascus's Mount Qasyun said to be where Adam's son killed his brother; it served as the city's rain-prayer ground — Makhul climbed it with Umar ibn Abd al-Aziz, Mu'awiya and the Muslims camped there until the wadis flowed, and under Hisham supplicants weathered three days' rain in the cave beneath it {cite:umari-masalik-1924 p. 205-206}."
  es: "La cueva en el monte Qasyun de Damasco, donde se dice que el hijo de Adán mató a su hermano, servía como lugar de oración para pedir lluvia en la ciudad. Makhul la escaló con Umar ibn Abd al-Aziz, Mu'awiya y los musulmanes acamparon allí hasta que los wadis tuvieron agua, y bajo Hisham los suplicantes soportaron tres días de lluvia en la cueva que se encontraba debajo {cite:umari-masalik-1924 p. 205-206}."
  fr: "La grotte du mont Qasyun à Damas, où l'on dit que le fils d'Adam a tué son frère; elle servait de lieu de prière pour la pluie à la ville — Makhul l'a escaladée avec Umar ibn Abd al-Aziz, Mu'awiya et les musulmans y ont campé jusqu'à ce que les oueds coulent, et sous Hisham, les suppliants ont résisté à trois jours de pluie dans la grotte en dessous {cite:umari-masalik-1924 p. 205-206}."
  ur: "دمشق کے پہاڑ قصیون پر غار کہا جاتا ہے جہاں آدم کے بیٹے نے اپنے بھائی کو قتل کیا تھا۔ یہ شہر کی بارش کی نماز کے میدان کے طور پر کام کرتا تھا - مکول نے عمر بن عبد العزیز، معاویہ کے ساتھ اس پر چڑھا اور مسلمانوں نے وہاں ڈیرے ڈالے یہاں تک کہ وادیوں میں پانی بہہ گیا، اور ہشام کے ماتحتوں نے اس کے نیچے غار میں تین دن کی بارش کا سامنا کیا۔ 205-206}۔"
  tr: "Şam'daki Kasyon Dağı'nda bir mağara Kan Mağarası olarak adlandırılır. Adem'in oğlunun kardeşini orada öldürdüğü iddia edilir; orası yağmur yeriydi: Makhoul, Ömer bin Abdülaziz su istemek için oraya çıktı. Muaviye ve Müslümanlar oraya çıktı ama vadiler akana kadar ayrılmadılar. Şam halkı, Hişam halifeliği sırasında oraya çıktı ve yağmur sırasında üç gün boyunca mağaranın altındaki yerde kaldı {cite:umari-masalik-1924, s. 205-206}."
  id: "Sebuah gua di Gunung Qasioun di Damaskus disebut Gua Darah. Dikatakan bahwa putra Adam membunuh saudaranya di sana; tempat itu adalah tempat hujan: Makhoul naik ke sana bersama Umar ibn Abd al-Aziz meminta air. Muawiyah dan umat Muslim pergi ke sana tetapi tidak pergi sampai lembah-lembah itu mengalir. Orang-orang Damaskus naik ke sana selama masa kekhalifahan Hisham dan tinggal di gua di bawahnya selama tiga hari saat hujan {cite:umari-masalik-1924, hlm. 205-206}."
