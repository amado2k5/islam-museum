label: { ar: "مغارة الدم", en: "the Cave of Blood" }
summary:
  ar: "مغارة بجبل قاسيون بدمشق تسمى مغارة الدم، يُزعم أن فيه قتل ابن آدم أخاه؛ وكان موضع استسقاء: صعد إليها مكحول مع عمر بن عبد العزيز يسأل السقيا، وخرج إليها معاوية والمسلمون فلم يبرحوا حتى سالت الأودية، وصعد إليها أهل دمشق في خلافة هشام فأقاموا في الغار الذي تحتها ثلاثة أيام للمطر {cite:umari-masalik-1924 p. 205-206}."
  en: "The cave on Damascus's Mount Qasyun said to be where Adam's son killed his brother; it served as the city's rain-prayer ground — Makhul climbed it with Umar ibn Abd al-Aziz, Mu'awiya and the Muslims camped there until the wadis flowed, and under Hisham supplicants weathered three days' rain in the cave beneath it {cite:umari-masalik-1924 p. 205-206}."
