summary:
  ar: "جبل وموضع كان به عسكر للقوم هجم عليه الهادي ليلة الجمعة في صفر سنة 289هـ، والتقى عنده عبد الله بن الحسين وأبو القاسم بالقوم بعد ذلك."
  en: "A mountain and place where the men had a camp, which al-Hadi's army fell on in the night of Friday in Safar 289 AH, and where Abdullah ibn al-Husayn and Abu al-Qasim later met the men."
  ur: "ایک پہاڑ اور جگہ جہاں مخالفوں کا پڑاؤ تھا جس پر ہادی کے لشکر نے صفر 289ھ میں جمعے کی رات حملہ کیا، اور جہاں عبداللہ بن الحسین اور ابو القاسم بعد میں مخالفوں سے ملے۔"
  es: "Una montaña y un lugar donde los hombres tenían un campamento, sobre el cual el ejército de al-Hadi cayó la noche del viernes de Safar del año 289 de la Hégira, y donde Abdullah ibn al-Husayn y Abu al-Qasim se reunieron posteriormente con los hombres."
  fr: "Une montagne et un lieu où les hommes avaient un camp, sur lequel l'armée d'al-Hadi est tombée dans la nuit du vendredi de Safar 289 AH, et où Abdullah ibn al-Husayn et Abu al-Qasim ont rencontré plus tard les hommes."
