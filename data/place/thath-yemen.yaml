summary:
  ar: "موضع في اليمن نزل به الهادي في ربيع الأول 288هـ وأقام فيه أياماً، وولى عليه محمد بن أبي الزبير اليرسمي، ويقول المحقق إنه يعرف الآن ثاه قرب رداع."
  en: "A place in Yemen where al-Hadi halted in Rabi I 288 AH and stayed some days, and over which he put Muhammad ibn Abi al-Zubayr al-Yarsami; the editor says it is now known as Thah, near Rada'."
  ur: "یمن کی ایک جگہ جہاں ہادی ربیع الاول 288ھ میں اترے اور چند دن رہے، اور جہاں محمد بن ابی زبیر یرسمی کو والی بنایا؛ مدیر کہتا ہے کہ اب یہ رداع کے قریب ثاہ کہلاتا ہے۔"
  es: "Un lugar en Yemen donde al-Hadi se detuvo en Rabi I de 288 AH y permaneció algunos días, y sobre el cual colocó a Muhammad ibn Abi al-Zubayr al-Yarsami; el editor dice que ahora se conoce como Thah, cerca de Rada'."
  fr: "Un lieu au Yémen où al-Hadi s'arrêta en Rabi I 288 AH et resta quelques jours, et sur lequel il plaça Muhammad ibn Abi al-Zubayr al-Yarsami; l'éditeur dit qu'il est maintenant connu sous le nom de Thah, près de Rada'."
