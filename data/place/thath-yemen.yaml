  ar: "موضع في اليمن نزل به الهادي في ربيع الأول 288هـ وأقام فيه أياماً، وولى عليه محمد بن أبي الزبير اليرسمي، ويقول المحقق إنه يعرف الآن ثاه قرب رداع."
  en: "A place in Yemen where al-Hadi halted in Rabi I 288 AH and stayed some days, and over which he put Muhammad ibn Abi al-Zubayr al-Yarsami; the editor says it is now known as Thah, near Rada'."
