summary:
  ar: "مدينة تبعد عن قرطبة خمسة وثلاثين ميلاً، وعلى الطريق منها إلى حصن أشونة وقرية كثيرة الساكن. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  en: "A town thirty-five miles from Cordoba, on the road toward the fortress of Ashuna and a populous village. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  es: "Un pueblo situado a cincuenta y seis kilómetros de Córdoba, en la carretera que conduce a la fortaleza de Ashuna y a una aldea populosa. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  fr: "Une ville située à trente-cinq milles de Cordoue, sur la route menant à la forteresse d'Achouna, et un village peuplé. {cite:nuzhat-al-mushtaq-2002 p. 572}"
  ur: "قرطبہ سے پینتیس میل دور ایک قصبہ، اشونا کے قلعے کی طرف سڑک پر اور ایک آبادی والا گاؤں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 572}"
  tr: "Córdoba'ya otuz beş mil uzaklıkta, Ashuna kalesine ve yoğun nüfuslu bir köye giden yolda bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 572}"
  id: "Sebuah kota yang terletak tiga puluh lima mil dari Córdoba, dan berada di jalur menuju benteng Ashuna serta sebuah desa yang padat penduduk. {cite:Nuzhat-al-Mushtaq-2002 hlm. 572}"
