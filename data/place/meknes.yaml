  ar: "مدينة حسنة مرتفعة على الأرض يجري في شرقها ماء، عامرة بالأسواق والحمامات والديار، وتتصل بها الجنات والزروع، سُميت باسم قبيلة مكناس. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  en: "A handsome city on high ground with water running to its east, with markets, baths and houses, and gardens and fields around it; named after the Miknasa tribe. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  es: "Una hermosa ciudad situada en una colina, con un río que fluye hacia el este, rodeada de mercados, baños, casas, jardines y campos; nombrada en honor a la tribu Miknasa. {cite:nuzhat-al-mushtaq-2002 p. 244}"
  fr: "Une belle ville située sur une hauteur, traversée par un cours d'eau à l'est, avec des marchés, des bains publics, des maisons, des jardins et des champs tout autour; elle tire son nom de la tribu Miknasa. {cite:nuzhat-al-mushtaq-2002 p. 244}"
