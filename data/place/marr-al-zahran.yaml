summary:
  en: "A major valley stage one stage north of Mecca (modern Wadi Fatima); there the ten-thousand-strong Muslim army encamped and lit ten thousand fires, Abu Sufyan was brought in by al-Abbas, and the tribes paraded in iron before the entry."
  ar: "وادٍ فسيح على مرحلة شمال مكة (وادي فاطمة اليوم)؛ عسكر فيه جيش الفتح بعشرة آلاف مقاتل وأوقدوا عشرة آلاف نار، وفيه أتى العباس بأبي سفيان واستعرضت القبائل بالسلاح قبيل دخول مكة."
