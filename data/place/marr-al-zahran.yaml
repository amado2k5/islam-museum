summary:
  en: "A major valley stage one stage north of Mecca (modern Wadi Fatima); there the ten-thousand-strong Muslim army encamped and lit ten thousand fires, Abu Sufyan was brought in by al-Abbas, and the tribes paraded in iron before the entry."
  ar: "وادٍ فسيح على مرحلة شمال مكة ⁦(وادي فاطمة اليوم)⁩؛ عسكر فيه جيش الفتح بعشرة آلاف مقاتل وأوقدوا عشرة آلاف نار، وفيه أتى العباس بأبي سفيان واستعرضت القبائل بالسلاح قبيل دخول مكة."
  es: "Un importante valle situado una etapa al norte de La Meca (el actual Wadi Fatima); allí acampó el ejército musulmán de diez mil hombres y encendió diez mil hogueras, Abu Sufyan fue traído por al-Abbas, y las tribus desfilaron con armaduras de hierro ante la entrada."
  fr: "Une importante vallée, une étape au nord de La Mecque (l'actuelle Wadi Fatima), où l'armée musulmane de dix mille hommes campa et alluma dix mille feux, Abu Sufyan fut amené par al-Abbas, et les tribus défilèrent en fer avant l'entrée."
  ur: "مکہ کے شمال میں ایک اہم وادی کا مرحلہ ⁦(جدید وادی فاطمہ)⁩؛ وہاں دس ہزار پر مشتمل مسلم فوج نے ڈیرے ڈالے اور دس ہزار آگ جلائی، ابو سفیان کو العباس لے آیا اور قبائل نے داخلے سے پہلے لوہے کی پریڈ کی۔"
