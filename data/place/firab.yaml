summary:
  ar: "مدينة عامرة حسنة المباني ظريفة الشوارع، حصينة في نفسها، وتقع على الضفة الغربية للنهر، ويعبر إليها من الضفة الأخرى بالمراكب. {cite:nuzhat-al-mushtaq-2002 p. 493}"
  en: "A populous town of handsome buildings and neat streets, strong in itself, on the far bank of the river, reached by boat. {cite:nuzhat-al-mushtaq-2002 p. 493}"
  es: "Una ciudad populosa de hermosos edificios y calles ordenadas, fuerte en sí misma, situada en la otra orilla del río, a la que se accede en barco. {cite:nuzhat-al-mushtaq-2002 p. 493}"
  fr: "Une ville populeuse aux beaux bâtiments et aux rues soignées, forte en elle-même, sur la rive opposée du fleuve, accessible par bateau. {cite:nuzhat-al-mushtaq-2002 p. 493}"
  ur: "خوبصورت عمارتوں اور صاف ستھری گلیوں کا ایک آبادی والا شہر، اپنے آپ میں مضبوط، دریا کے دور کنارے پر، کشتی کے ذریعے پہنچا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 493}"
  tr: "Güzel binaları, şirin sokakları ve kendi içinde tahkimatlı hareketli bir şehir. Nehrin batı kıyısında yer alır ve diğer tarafından teknelerle ulaşılır. {cite:nuzhat-al-mushtaq-2002 s. 493}"
  id: "Kota yang ramai dengan bangunan-bangunan indah, jalan-jalan yang menawan, dan benteng tersendiri. Kota ini terletak di tepi barat sungai, dan dapat diakses dengan perahu dari sisi lain. {cite:nuzhat-al-mushtaq-2002 hlm. 493}"
