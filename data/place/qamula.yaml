summary:
  ar: "قرية على الضفة الغربية للنيل تبعد عن دماميل خمسة أميال، وهي عند المؤلف كالمدينة في جمعها كل نعمة. ويذكر المؤلف، نقلا عن ثقة في عصره، أنها تُنتج أنواعا من الفواكه والثمر، ومنها ثمرة عظيمة الحجم. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A village about five miles from Damamil, which the author says is as rich as a town, gathering every kind of produce. Citing a trusted informant of his time, he reports varieties of fruit there, including one of unusual size. {cite:nuzhat-al-mushtaq-2002 p. 129}"
