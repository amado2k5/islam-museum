label: { ar: "قمولة", en: "Qamula", es: "Qamula", fr: "Qamula", ur: "قمولہ" }
summary:
  ar: "قرية على الضفة الغربية للنيل تبعد عن دماميل خمسة أميال، وهي عند المؤلف كالمدينة في جمعها كل نعمة. ويذكر المؤلف، نقلا عن ثقة في عصره، أنها تُنتج أنواعا من الفواكه والثمر، ومنها ثمرة عظيمة الحجم. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A village about five miles from Damamil, which the author says is as rich as a town, gathering every kind of produce. Citing a trusted informant of his time, he reports varieties of fruit there, including one of unusual size. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  es: "Un pueblo a unos ocho kilómetros de Damamil, que según el autor es tan próspero como una ciudad, donde se cultiva todo tipo de productos. Citando a un informante de confianza de su época, menciona variedades de fruta, incluyendo una de tamaño inusual. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  fr: "Un village situé à environ huit kilomètres de Damamil, que l'auteur décrit comme aussi riche qu'une ville, où l'on trouve toutes sortes de produits. Citant un informateur fiable de son époque, il mentionne la variété des fruits qui y poussent, dont un d'une taille inhabituelle. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  ur: "دامامل سے تقریباً پانچ میل کے فاصلے پر ایک گاؤں، جسے مصنف کا کہنا ہے کہ ایک قصبے کی طرح امیر ہے، ہر قسم کی پیداوار جمع کرتا ہے۔ اپنے وقت کے ایک بااعتماد مخبر کا حوالہ دیتے ہوئے، وہ وہاں مختلف قسم کے پھلوں کی اطلاع دیتا ہے، جس میں ایک غیر معمولی سائز کا ہوتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 129}"
