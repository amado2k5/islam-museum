summary:
  ar: "بلد جليل ومنزل حفيل ذو أسواق عامرة وصنائع مشهودة، وله مزارع متصلة، وتبعد عن كركنت اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 610}"
  en: "A great town and well-filled stop with busy markets and famous crafts, and joined farms; twelve miles from Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 610}"
  es: "Una gran ciudad y una parada muy animada con mercados bulliciosos, artesanías famosas y granjas adosadas; a doce millas de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 610}"
  fr: "Une ville agréable et une étape incontournable avec ses marchés animés, son artisanat réputé et ses fermes regroupées; à douze miles de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 610}"
  ur: "ایک عظیم شہر اور مصروف بازاروں اور مشہور دستکاریوں کے ساتھ اچھی طرح سے بھرا ہوا اسٹاپ، اور فارموں میں شامل ہوئے؛ کرکنٹ سے بارہ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 610}"
  tr: "Asil bir kasaba ve gelişen pazarlar ile ünlü zanaatlara sahip bir Hafil evi, bağlı çiftlikleri vardır ve Karkent'e on iki mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 610}"
  id: "Sebuah kota bangsawan dan rumah Hafil dengan pasar yang berkembang dan kerajinan terkenal, dengan pertanian yang terhubung, dan berjarak dua belas mil dari Karkent. {cite:Nuzhat-al-Mushtaq-2002 hlm. 610}"
