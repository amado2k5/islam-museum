summary:
  ar: "عاصمة تونس، مر بها ابن بطوطة في طريقه من المغرب إلى المشرق. ذكر الكتاب أن حسان بن النعمان اختطّها سنة 82هـ قاعدة بحرية تحول دون تكرار هجمات البيزنطيين على قرطاجة، وأنه حفر قناة تصلها بالبحر، وأن عبد الملك أرسل إليها من مصر ألفي قبطي من مهرة الصناع لإقامة صناعة المراكب. {cite:salabi-umayyad-state-2020 p.20-21}"
  en: "Capital of Tunisia, passed through by Ibn Battuta on his journey from the Maghrib to the East. The book reports that Hassan ibn al-Nu'man founded it in 82 AH as a naval base to prevent repeated Byzantine attacks on Carthage, that he dug a canal linking it to the sea, and that 'Abd al-Malik sent two thousand skilled Coptic craftsmen from Egypt to set up shipbuilding there. {cite:salabi-umayyad-state-2020 p.20-21}"
