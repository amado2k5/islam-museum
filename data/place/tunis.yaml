summary:
  ar: "تونس عاصمة تونس الحديثة، أسسها العرب في نهاية القرن السابع الميلادي على موضع مدينة أقدم تُسمى تونس القديمة، داخل البر قرب بحيرة، وهي غير قرطاج التي كانت على الساحل. تذكر دائرة المعارف الإسلامية أن المؤرخين العرب ينسبون تأسيسها إلى حسان بن النعمان سنة 80هـ، وأنه أنشأ فيها دار صناعة للسفن. ظلت زمنًا تابعة للقيروان، ثم صارت عاصمة تحت العثمانيين والبايات المراديين والحسينيين، ثم في عهد الحماية الفرنسية وبعد الاستقلال."
  en: "Tunis is the capital of modern Tunisia, founded by the Arabs at the end of the seventh century on the site of an older city called Tunes, inland beside a lagoon and distinct from coastal Carthage. The Encyclopaedia of Islam reports that Arab historians credit Hassan ibn al-Nu'man with founding it in 80 AH and with setting up a shipbuilding arsenal there. It stayed subordinate to al-Kayrawan for a long time, then served as capital under the Ottomans and the Muradi and Husaynid beys, through the French protectorate and into the independent republic."
  ur: "تیونس جدید تیونس کا دارالحکومت ہے، جس کی بنیاد عربوں نے ساتویں صدی کے آخر میں تونس قدیم نامی ایک پرانے شہر کی جگہ رکھی، اندرون میں ایک جھیل کے کنارے، اور یہ ساحلی قرطاج سے الگ ہے۔ انسائیکلوپیڈیا آف اسلام کے مطابق عرب مؤرخین اس کی بنیاد حسان بن نعمان سے 80ھ میں منسوب کرتے ہیں اور بتاتے ہیں کہ اس نے وہاں جہاز سازی کا اسلحہ خانہ بنایا۔ یہ ایک طویل عرصہ قیروان کے تابع رہا، پھر عثمانیوں اور مرادی و حسینی بے حکمرانوں کے تحت، فرانسیسی سرپرستی کے دور میں اور آزادی کے بعد دارالحکومت رہا۔"
