summary:
  ar: "جزيرة طولها نحو مائة وخمسين ميلاً وعرضها سبعة وعشرون ميلاً، فيها مدن، ويصفها الإدريسي بأن أهلها متوحشون من أجناس الروم. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  en: "An island about 150 miles long and 27 wide, with towns; al-Idrisi describes its people as wild folk of the Roman stock. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  es: "Una isla de aproximadamente 240 kilómetros de largo y 43 de ancho, con poblaciones; al-Idrisi describe a sus habitantes como gente salvaje de ascendencia romana. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  fr: "Une île d'environ 240 kilomètres de long et 43 de large, parsemée de villes; al-Idrisi décrit ses habitants comme un peuple sauvage d'origine romaine. {cite:nuzhat-al-mushtaq-2002 p. 584}"
  ur: "تقریباً 150 میل لمبا اور 27 چوڑا ایک جزیرہ جس میں قصبے ہیں۔ الادریسی نے اپنے لوگوں کو رومن اسٹاک کے جنگلی لوگوں کے طور پر بیان کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 584}"
