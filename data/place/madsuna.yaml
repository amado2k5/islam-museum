summary:
  ar: "مدينة كبيرة جامعة عامرة كثيرة البشر، وأهلها مجوس يعبدون النار، ويذكر المؤلف أنها تبعد عن حصن فلموس ثلاثمائة ميل {cite:nuzhat-al-mushtaq-2002 p. 954}."
  en: "A large, populous city whose people are fire-worshipping Magians, three hundred miles from the fortress of Falmūs {cite:nuzhat-al-mushtaq-2002 p. 954}."
  es: "Una ciudad grande y populosa cuyos habitantes son magos que adoran el fuego, a trescientas millas de la fortaleza de Falmūs {cite:nuzhat-al-mushtaq-2002 p. 954}."
  fr: "Une grande ville peuplée dont les habitants sont des mages adorateurs du feu, à trois cents miles de la forteresse de Falmūs {cite:nuzhat-al-mushtaq-2002 p. 954}."
  ur: "ایک بڑا، آبادی والا شہر جس کے لوگ آگ کی پرستش کرنے والے مجوسی ہیں، قلعہ فلموس سے تین سو میل کے فاصلے پر۔ 954}۔"
  tr: "Büyük ve kapsamlı bir şehir, çok sayıda insanla dolu; sakinleri ateşe tapan Magi'lerdir. Yazar, buranın Philmus kalesine üç yüz mil uzaklıkta olduğunu belirtir {cite:nuzhat-al-mushtaq-2002, s. 954}."
  id: "Sebuah kota besar dan komprehensif yang dipenuhi banyak orang, dan penduduknya adalah Majus yang menyembah api. Penulis menyebutkan bahwa kota ini berjarak tiga ratus mil dari benteng Philmus {cite:nuzhat-al-mushtaq-2002, hlm. 954}."
