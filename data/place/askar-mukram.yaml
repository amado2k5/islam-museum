summary:
  ar: "عسكر مكرم مدينة بالأهواز؛ نسبت إلى مكرم بن مطرف بن سيدان الباهلي الذي بعثه مصعب بن الزبير في طلب قاتل أبيه فسار حتى عسكر بها وقيل نسبت إلى مكرم بن الفرز."
  en: "Askar Mukram in al-Ahwaz, named for Mukram ibn Mutarrif who camped there hunting his father's killer on Mus'ab's charge — or, as also said, for Mukram ibn al-Farz."
  es: "Askar Mukram en al-Ahwaz, llamado así por Mukram ibn Mutarrif, quien acampó allí buscando al asesino de su padre por encargo de Mus'ab, o, como también se dice, por Mukram ibn al-Farz."
  fr: "Askar Mukram à al-Ahwaz, nommé d'après Mukram ibn Mutarrif qui y campa à la recherche du meurtrier de son père sur l'accusation de Mus'ab — ou, comme dit aussi, d'après Mukram ibn al-Farz."
  ur: "الاہواز میں عسکر مکرم کا نام مکرم ابن مطرف کے نام پر رکھا گیا ہے جس نے مصعب کے الزام میں اپنے والد کے قاتل کا شکار کرنے کے لیے وہاں ڈیرہ ڈالا تھا - یا جیسا کہ یہ بھی کہا جاتا ہے، مکرم ابن الفرز کے لیے۔"
  tr: "Askar Makram, Ahvaz'da bir şehirdir; babasını öldürmek için Mus'ab bin al-Zubayr tarafından gönderilen Makram bin Mutarif bin Saydan al-Bahili'ye atfedilir. Orada yürüyerek kamp kurdu ve bunun Makram bin al-Faraz'a atfedildiği söylenir."
  id: "Askar Makram adalah sebuah kota di Ahvaz; kota ini dikaitkan dengan Makram bin Mutarif bin Saydan al-Bahili, yang dikirim oleh Mus'ab bin al-Zubayr untuk membunuh ayahnya. Ia berjalan hingga berkemah di sana, dan dikatakan bahwa kota ini dikaitkan dengan Makram bin al-Faraz."
