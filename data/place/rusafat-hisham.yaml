summary:
  ar: "رصافة هشام بن عبد الملك من أعمال الرقة؛ أحدثها هشام وكان ينزل قبلها الزيتونة وحفر الهني والمري وأحدث فيها واسط الرقة، ثم قبضت في أول الدولة فصارت لأم جعفر زبيدة بنت جعفر بن المنصور فابتنت فيها القطيعة التي تنسب إليها."
  en: "Rusafat Hisham, Hisham ibn Abd al-Malik's estate in the Raqqa district; he founded it having earlier dwelt at al-Zaytuna, dug the al-Hani and al-Mari canals and laid out Wasit al-Raqqa there; the estate was seized at the dynasty's opening and passed to Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, who built the estate named for her."
  es: "Rusafat Hisham, la finca de Hisham ibn Abd al-Malik en el distrito de Raqqa; la fundó tras haber vivido anteriormente en al-Zaytuna, donde excavó los canales al-Hani y al-Mari y diseñó Wasit al-Raqqa. La finca fue confiscada al inicio de la dinastía y pasó a manos de Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, quien construyó la finca que lleva su nombre."
  fr: "Rusafat Hisham, le domaine de Hisham ibn Abd al-Malik dans le district de Raqqa; il l'a fondé après avoir habité auparavant à al-Zaytuna, a creusé les canaux al-Hani et al-Mari et y a aménagé Wasit al-Raqqa; le domaine a été saisi à l'ouverture de la dynastie et est passé à Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, qui a construit le domaine qui porte son nom."
  ur: "رسفت ہشام، رقہ ضلع میں ہشام بن عبد الملک کی جاگیر؛ اس نے اس کی بنیاد رکھی جو پہلے الزیتونہ میں مقیم تھا، الحانی اور الماری نہریں کھودیں اور وہاں وصیت الرقہ کو بچھایا۔ سلطنت کے آغاز پر جائیداد پر قبضہ کر لیا گیا اور ام جعفر زبیدہ بنت جعفر ابن المنصور کو دے دیا گیا، جنہوں نے اس کے نام کی جائیداد بنائی۔"
