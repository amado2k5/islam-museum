summary:
  ar: "رصافة هشام بن عبد الملك من أعمال الرقة؛ أحدثها هشام وكان ينزل قبلها الزيتونة وحفر الهني والمري وأحدث فيها واسط الرقة، ثم قبضت في أول الدولة فصارت لأم جعفر زبيدة بنت جعفر بن المنصور فابتنت فيها القطيعة التي تنسب إليها."
  en: "Rusafat Hisham, Hisham ibn Abd al-Malik's estate in the Raqqa district; he founded it having earlier dwelt at al-Zaytuna, dug the al-Hani and al-Mari canals and laid out Wasit al-Raqqa there; the estate was seized at the dynasty's opening and passed to Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, who built the estate named for her."
