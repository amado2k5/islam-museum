label: { ar: "باب الفيل", en: "Bab al-Fil (the Elephant Gate)" }
summary:
  ar: "باب مسجد الكوفة؛ عند البلاذري أصاب المسلمون فيلاً بفتح المدائن فكتبوا فيه إلى عمر فأمرهم ببيعه فاشتراه رجل من أهل الحيرة يطوف به القرى فأحبت أم أيوب بنت عمارة بن عقبة امرأة المغيرة بن شعبة النظر إليه فوقف على باب المسجد فجعلت تنظر إليه ووهبت لصاحبه شيئاً وصرفته فلم يخط الخطا يسيرة حتى سقط ميتاً فسمي الباب باب الفيل وقيل الناظرة امرأة الوليد بن عقبة وقيل ساحر أرى الناس أنه أخرج من الباب فيلاً على حمار وذلك باطل وقيل الأجانة التي في المسجد حملت على فيل فأدخلت من هذا الباب وقيل إن فيلاً لبعض الولاة اقتحم الباب والخبر الأول أثبتها."
  en: "A gate of Kufa's mosque; in al-Baladhuri the Muslims took an elephant at al-Mada'in's conquest, wrote Umar who ordered it sold — a Hira man bought and toured it through the villages, and Umm Ayyub bint Umara ibn Uqba, al-Mughira's wife, wished to see it; it stopped at the mosque gate while she looked and gifted its keeper, then a few steps on fell dead — hence the Elephant Gate. It is also said the viewer was al-Walid ibn Uqba's wife, that a magician conjured an elephant on a donkey from the gate — dismissed as false — that the mosque's basin was carried in on an elephant, or that a governor's elephant breached it; the first account is the firmest."
