  ar: "السبيطية ضيعة استخرجها المنصور من بطيحة البصرة على كره أهلها؛ وكان بها أجمة لرجل من الدهاقين يقال له سبيط فحبس عنه الوكيل بعض ثمنها وضربه فلم يزل على باب المنصور يطالب بما بقي له حتى مات فنسبت الضيعة إليه."
  en: "al-Subaytiyya, the estate al-Mansur cut from Basra's batiha over the town's objection; a dahqan named Subayt's reedbed was in it — the agent withheld part of its price and beat him, and he haunted al-Mansur's gate claiming the balance till he died, so the estate took his name."
