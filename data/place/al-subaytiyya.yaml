summary:
  ar: "السبيطية ضيعة استخرجها المنصور من بطيحة البصرة على كره أهلها؛ وكان بها أجمة لرجل من الدهاقين يقال له سبيط فحبس عنه الوكيل بعض ثمنها وضربه فلم يزل على باب المنصور يطالب بما بقي له حتى مات فنسبت الضيعة إليه."
  en: "al-Subaytiyya, the estate al-Mansur cut from Basra's batiha over the town's objection; a dahqan named Subayt's reedbed was in it — the agent withheld part of its price and beat him, and he haunted al-Mansur's gate claiming the balance till he died, so the estate took his name."
  es: "al-Subaytiyya, la finca que al-Mansur separó de la batiha de Basora a pesar de la objeción de la ciudad; en ella había un cañaveral llamado el cañaveral de Subayt. El agente retuvo parte del precio y lo golpeó, y este rondó la puerta de al-Mansur reclamando el resto hasta que murió, por lo que la finca tomó su nombre."
  fr: "al-Subaytiyya, le domaine qu'al-Mansur a coupé de la batiha de Basra malgré l'objection de la ville; le lit de roseaux d'un dahqan nommé Subayt s'y trouvait — l'agent a retenu une partie de son prix et l'a battu, et il a hanté la porte d'al-Mansur en réclamant le solde jusqu'à sa mort, de sorte que le domaine a pris son nom."
  ur: "السبیطیہ، املاک المنصور نے قصبے کے اعتراض پر بصرہ کے بطحاء سے کاٹا۔ ایک دہقان جس کا نام سبیط کا سرکنڈہ تھا اس میں تھا - ایجنٹ نے اس کی قیمت کا کچھ حصہ روک لیا اور اسے مارا پیٹا اور اس نے المنصور کے گیٹ پر اس کی موت تک بقایا کا دعویٰ کیا، چنانچہ اس اسٹیٹ نے اس کا نام لے لیا۔"
