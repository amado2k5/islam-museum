label: { ar: "قبرس", en: "Cyprus", es: "Chipre", fr: "Chypre", ur: "قبرص", tr: "Kıbrıs", id: "Siprus" }
summary:
  ar: "جزيرة قبرس في بحر الروم يقال ثمانون فرسخاً في مثلها؛ أول ما ركبها المسلمون غزوة معاوية سنة 28 فصالح أهلها على سبعة آلاف ومائتي دينار سنوياً — ويؤدون للروم مثلها — على أن لا يقاتلوا عنهم ويؤذنوا المسلمين بسير عدوهم، فكانوا أهل فدية لا أهل ذمة؛ ولما أعانوا الروم سنة 32 فتحها معاوية عنوة سنة 33 ثم أقرهم على صلحهم وبنى بها مدينة ومساجد حتى أقفلها يزيد؛ وأجلهم الوليد بن يزيد فردّهم يزيد بن الوليد؛ وصار حكم عهدها مثالاً فقهياً استشير فيه الليث ومالك وسفيان بن عيينة وغيرهم في ولاية عبد الملك بن صالح، وبها قبر أم حرام بنت ملحان المعروف بقبر المرأة الصالحة."
  en: "The island of Cyprus in the Byzantine sea, some eighty farsakhs square by report; first sailed by the Muslims on Mu'awiya's raid of year 28, its people compounding for seven thousand two hundred dinars yearly — paying the like to the Byzantines — on condition of not being made to fight for them and of warning the Muslims of enemy movements, making them a ransom-people rather than dhimmis; when they aided the Byzantines in year 32 Mu'awiya took it by force in year 33 then restored their treaty, building a city and mosques there until Yazid withdrew the garrison; al-Walid ibn Yazid exiled a body of them and Yazid ibn al-Walid returned them; its covenant became a juristic test-case on which al-Layth, Malik, Sufyan ibn Uyayna and others were consulted under Abd al-Malik ibn Salih; and it holds the grave of Umm Haram bint Milhan, called the grave of the righteous woman."
  es: "La isla de Chipre en el mar bizantino, de unos ochenta farsakhs cuadrados según los informes; navegada por primera vez por los musulmanes en la incursión de Mu'awiya en el año 28, sus habitantes pagaron siete mil doscientos dinares anuales —pagando lo mismo a los bizantinos— con la condición de no ser obligados a luchar por ellos y de advertir a los musulmanes de los movimientos enemigos, convirtiéndolos en un pueblo de rescate en lugar de dhimmis; cuando ayudaron a los bizantinos en el año 32, Mu'awiya la tomó por la fuerza en el año 33 y luego restauró su tratado, construyendo una ciudad y mezquitas allí hasta que Yazid retiró la guarnición; al-Walid ibn Yazid exilió a un grupo de ellos y Yazid ibn al-Walid los devolvió; su pacto se convirtió en un caso de prueba jurídica sobre el cual al-Layth, Malik, Sufyan ibn Uyayna y otros fueron consultados bajo Abd al-Malik ibn Salih; y alberga la tumba de Umm Haram bint Milhan, llamada la tumba de la mujer justa."
  fr: "L'île de Chypre, dans la mer Byzantine, d'une superficie d'environ quatre-vingts farsakhs carrés selon les rapports, fut d'abord explorée par les musulmans lors du raid de Mu'awiya en l'an 28. Ses habitants payaient un tribut annuel de sept mille deux cents dinars – une somme équivalente aux Byzantins – à condition de ne pas être contraints de combattre pour eux et d'avertir les musulmans des mouvements ennemis, ce qui faisait d'eux un peuple à rançon plutôt que des dhimmis. Lorsqu'ils aidèrent les Byzantins en l'an 32, Mu'awiya s'en empara par la force en l'an 33, puis rétablit leur traité, y construisant une ville et des mosquées jusqu'au retrait de la garnison par Yazid. Al-Walid ibn Yazid exila une partie de ses habitants, puis Yazid ibn al-Walid les fit revenir. Son pacte devint un cas d'espèce juridique sur lequel al-Layth, Malik, Sufyan ibn Uyayna et d'autres furent consultés sous Abd al-Malik ibn Salih. et elle abrite la tombe d'Umm Haram bint Milhan, appelée la tombe de la femme vertueuse."
  ur: "بازنطینی سمندر میں قبرص کا جزیرہ، رپورٹ کے مطابق تقریباً اسی فرسخ مربع؛ 28 کے معاویہ کے حملے پر مسلمانوں کی طرف سے سب سے پہلے جہاز اڑایا گیا، اس کے لوگ سالانہ سات ہزار دو سو دینار جمع کرتے تھے - بازنطینیوں کی طرح ادا کرتے تھے - اس شرط پر کہ ان سے لڑنے پر مجبور نہ کیا جائے اور مسلمانوں کو دشمن کی حرکات سے خبردار کیا جائے، انہیں ذمی کی بجائے فدیہ دینے والے لوگ بنایا جائے۔ جب انہوں نے سن 32 میں بازنطینیوں کی مدد کی تو 33 میں معاویہ نے اسے زبردستی لے لیا پھر اپنا معاہدہ بحال کیا، وہاں ایک شہر اور مساجد تعمیر کیں یہاں تک کہ یزید نے چھاؤنی واپس لے لی۔ ولید بن یزید نے ان میں سے ایک لاش کو جلاوطن کر دیا اور یزید بن الولید نے انہیں واپس کر دیا۔ اس کا عہد ایک فقہی امتحان بن گیا جس پر عبد الملک بن صالح کی قیادت میں لیث، مالک، سفیان بن عیینہ اور دیگر سے مشورہ کیا گیا۔ اور اس میں ام حرام بنت ملحان کی قبر ہے جسے نیک عورت کی قبر کہا جاتا ہے۔"
  tr: "Roma Denizi'ndeki Kıbrıs adası, onun gibi seksen farsakh olduğu söyleniyor; Müslümanların ilk kez 28 yılında Muawiya seferi sırasında bindi; Muawiya halkını yılda yedi bin iki yüz dinar karşılığında uzlaştırdı ve Romalılara da aynı parayı ödedi, ancak onların adına savaşmamaları ve düşmanlarının ilerleyişi konusunda Müslümanları uyarmaları şartıyla geldi. Onlar fidye halkıydı, zimmi değil. 32 Hicri'de Bizanslılara yardım ettiklerinde, Muaviye zorla 33 Hicri'de fethetti, ardından barışlarını teyit etti ve orada bir şehir ile camiler inşa etti, ta ki Yazid onları kapatana kadar. El-Velid bin Yezid onları geri aldı, ancak Yezid bin Vid onları geri verdi. Yönetiminin yönetimi, Abd al-Malik bin Salih'in valiliği sırasında Layth, Malik, Sufyan ibn Uyaynah ve diğerlerinin danışıldığı bir hukuk örneği haline geldi. Ayrıca burada doğru kadının mezarı olarak bilinen um Haram bint Milhan'ın mezarı da bulunur."
  id: "Pulau Siprus di Laut Romawi, yang dikatakan delapan puluh farsakh serupa; pertama kali Muslim menaikinya adalah ekspedisi Muawiya pada tahun 28, ketika ia mendamaikan rakyatnya dengan tujuh ribu dua ratus dinar setiap tahun—dan membayar jumlah yang sama kepada Romawi—dengan syarat mereka tidak akan berperang atas nama mereka dan memperingatkan Muslim tentang kemajuan musuh mereka. Mereka adalah orang tebusan, bukan dhimmi. Ketika mereka membantu Bizantium pada tahun 32 H, Muawiya menaklukkannya secara paksa pada tahun 33 H, kemudian menegaskan perdamaian mereka dan membangun kota serta masjid di sana hingga Yazid menutupnya. Al-Walid ibn Yazid mengambilnya, tetapi Yazid ibn Al-Walid mengembalikannya. Kekuasaan pemerintahannya menjadi contoh yurisprudensi di mana Layth, Malik, Sufyan ibn Uyaynah, dan lainnya dikonsultasikan selama masa pemerintahan Abd al-Malik ibn Salih. Makam ini juga berisi makam um Haram bint Milhan, yang dikenal sebagai makam wanita benar."
