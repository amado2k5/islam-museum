summary:
  ar: "كبرى مدن ما وراء النهر في أوزبكستان الحالية، على طريق القوافل بين خراسان والصين؛ يصفها ياقوت بأنها أعظم مدن ما وراء النهر وأعمها وأحسنها {cite:mujam-al-buldan-sader-1995}، وبها حمل الأسرى المسلمون صناعة الورق من الصين فصارت سمرقند دار الورق {cite:encyclopaedia-of-islam-2}."
  en: "The chief city of Transoxiana, in present-day Uzbekistan, on the caravan road between Khurasan and China; Yaqut calls it the greatest and most flourishing of the cities beyond the Oxus {cite:mujam-al-buldan-sader-1995}, and Muslim captives carried papermaking there from China, making Samarkand the city of paper {cite:encyclopaedia-of-islam-2}."
  ur: "ماوراء النہر کا سب سے بڑا شہر، موجودہ ازبکستان میں، خراسان اور چین کے قافلہ راستے پر؛ یعقوت اسے دریائے جیحوں کے پار کے شہروں میں عظیم ترین اور آباد ترین کہتا ہے {cite:mujam-al-buldan-sader-1995}، اور مسلمان قیدی چین سے کاغذ سازی یہاں لائے جس سے سمرقند کاغذ کا شہر بنا {cite:encyclopaedia-of-islam-2}."
