summary:
  ar: "مدينة جليلة عامرة ذات أسواق وصناعات وأرزاق واسعة، على نهر سيحان، وبينها وبين طرسوس اثنا عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  en: "A great, populous city with markets, crafts and wide livelihoods on the Sayhan river, twelve miles from Tarsus. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  es: "Una gran ciudad populosa con mercados, artesanías y una amplia oferta económica a orillas del río Sayhan, a doce millas de Tarso. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  fr: "Une grande ville peuplée, avec des marchés, de l'artisanat et de nombreuses activités économiques, située sur le fleuve Sayhan, à douze milles de Tarse. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  ur: "ترسس سے بارہ میل دور سیہان ندی پر بازاروں، دستکاریوں اور وسیع ذرائع معاش کے ساتھ ایک عظیم، آبادی والا شہر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 647}"
  tr: "Seyhan Nehri üzerinde, Tarsus ile arasında on iki mil uzaklıkta, pazarlar, sanayiler ve geniş geçim kaynaklarıyla dolu soylu bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 647}"
  id: "Kota mulia yang sibuk dengan pasar, industri, dan mata pencaharian luas, di Sungai Seyhan, dan dua belas mil di antara Sungai Seyhan dan Tarsus. {cite:Nuzhat-al-Mushtaq-2002 hlm. 647}"
