summary:
  ar: "إقليم بالجبل؛ عند البلاذري لم يقاتل أهلها أبا موسى وصالحه أهل السيروان على مثل صلح الدينور فبث السرايا وغلب على أرضها ومنهم من قال فتحها قبل نهاوند وفيها قصر كثير بن شهاب وضياع زهرة بن الحارث ونزلتها الخشارمة آخر أيام بني أمية."
  en: "a Jibal province; in al-Baladhuri unconquered by fight — al-Sirwan's people treated on al-Dinawar's terms; held Kathir ibn Shihab's palace, Zuhra ibn al-Harith's estates, and the Khasharima's late-Umayyad settlement."
  es: "la provincia de Jibal; en al-Baladhuri, no vencido por la lucha: el pueblo de al-Sirwan fue tratado en los términos de al-Dinawar; ocupó el palacio de Kathir ibn Shihab, las propiedades de Zuhra ibn al-Harith y el asentamiento omeya tardío de Khasharima."
  fr: "la province de Jibal; à al-Baladhuri, invaincu par les combats – le peuple d'al-Sirwan a été traité selon les conditions d'al-Dinawar; détenait le palais de Kathir ibn Shihab, les domaines de Zuhra ibn al-Harith et la colonie omeyyade tardive de Khasharima."
