summary:
  ar: "الاسم الذي أطلقه المؤرخون العرب على مدينة نربون. وصلتها الحملات الإسلامية الأولى، وفتحها عبد العزيز بن موسى بن نصير سنة 96هـ (715م)، ثم استعادها السمح بن مالك الخولاني سنة 100هـ (719م)، وانتزعها بيبين القصير من المسلمين بعد حصار طويل سنة 142هـ (759م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
  en: "The name by which Arab historians designated the town of Narbonne. Early Muslim expeditions reached it; 'Abd al-'Aziz ibn Musa ibn Nusayr took it in 96/715, al-Samh ibn Malik al-Khawlani retook it in 100/719, and Pepin the Short finally took it from the Muslims in 142/759 after a long siege {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
