summary:
  ar: "الاسم الذي أطلقه المؤرخون العرب على مدينة نربون. وصلتها الحملات الإسلامية الأولى، وفتحها عبد العزيز بن موسى بن نصير سنة 96هـ ⁦(715م)⁩، ثم استعادها السمح بن مالك الخولاني سنة 100هـ ⁦(719م)⁩، وانتزعها بيبين القصير من المسلمين بعد حصار طويل سنة 142هـ ⁦(759م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
  en: "The name by which Arab historians designated the town of Narbonne. Early Muslim expeditions reached it; 'Abd al-'Aziz ibn Musa ibn Nusayr took it in 96/715, al-Samh ibn Malik al-Khawlani retook it in 100/719, and Pepin the Short finally took it from the Muslims in 142/759 after a long siege {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
  es: "El nombre con el que los historiadores árabes designaron la ciudad de Narbona. Las primeras expediciones musulmanas llegaron hasta allí; 'Abd al-'Aziz ibn Musa ibn Nusayr la tomó en el año 96/715, al-Samh ibn Malik al-Khawlani la reconquistó en el año 100/719, y Pipino el Breve finalmente se la arrebató a los musulmanes en el año 142/759 después de un largo asedio {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
  fr: "Le nom par lequel les historiens arabes désignaient la ville de Narbonne. Les premières expéditions musulmanes l'atteignirent; 'Abd al-'Aziz ibn Musa ibn Nusayr la prit en 96/715, al-Samh ibn Malik al-Khawlani la reprit en 100/719, et Pépin le Bref la prit finalement aux musulmans en 142/759 après un long siège {cite:encyclopaedia-of-islam-2 vol. 1 p. 633}."
  ur: "وہ نام جس سے عرب مورخین نے نربون شہر کو نامزد کیا تھا۔ ابتدائی مسلمانوں کی مہمات اس تک پہنچیں۔ عبدالعزیز ابن موسیٰ بن نصیر نے اسے 96/715 میں لے لیا، السام بن مالک الخولانی نے 100/719 میں اسے دوبارہ حاصل کیا، اور پیپین دی شارٹ نے ایک طویل محاصرے کے بعد آخر کار اسے 142/759 میں مسلمانوں سے لے لیا۔ 1 ص۔ 633}۔"
