summary:
  ar: "مدينة كبيرة أقطارها عامرة، حصينة، بها أسواق نافقة وصناعات دائمة، وتقع على البحر الملح، وتبعد عن شنت مجيال نحو ثمانين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  en: "A large city with populous land, strong, with brisk markets and standing crafts, on the salt sea; about eighty miles from Shant Majal. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  es: "Una gran ciudad con una población numerosa, fuerte, con mercados dinámicos y artesanía consolidada, a orillas del mar; a unas ochenta millas de Shant Majal. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  fr: "Une grande ville, densément peuplée et prospère, avec des marchés animés et une activité artisanale pérenne, située sur la mer salée; à environ 130 kilomètres de Shant Majal. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  ur: "ایک بڑا شہر جس میں آبادی والی زمین، مضبوط، تیز بازاروں اور کھڑے دستکاریوں کے ساتھ، نمکین سمندر پر۔ شانت مجل سے تقریباً اسی میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 856}"
  tr: "Tuzlu deniz kıyısında yer alan, zengin ve tahkim edilmiş bölgelere sahip, gelişen pazarları ve kalıcı sanayileriyle büyük bir şehirdir ve Shant Mejial'a yaklaşık seksen mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 856}"
  id: "Sebuah kota besar dengan wilayah yang makmur dan dipertahankan, dengan pasar yang berkembang pesat dan industri permanen, terletak di laut asin, dan sekitar delapan puluh mil dari Shant Mejial. {cite:nuzhat-al-mushtaq-2002 hlm. 856}"
