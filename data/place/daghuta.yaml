  ar: "مدينة على خور كبير، أهلها يسترون أيديهم عند لقاء التجار، ونساؤهن محتجبات بسبب عري الأهل، وفيها الذهب كما في غيرها، وتبعد عن جزيرة القمر مجرى واحداً {cite:nuzhat-al-mushtaq-2002 p. 79}."
  en: "A town on a large creek whose people go unclothed and cover their hands when they meet traders. Gold is found there as elsewhere in the area. One passage from the Island of the Moon {cite:nuzhat-al-mushtaq-2002 p. 79}."
