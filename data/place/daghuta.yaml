summary:
  ar: "مدينة على خور كبير، أهلها يسترون أيديهم عند لقاء التجار، ونساؤهن محتجبات بسبب عري الأهل، وفيها الذهب كما في غيرها، وتبعد عن جزيرة القمر مجرى واحداً {cite:nuzhat-al-mushtaq-2002 p. 79}."
  en: "A town on a large creek whose people go unclothed and cover their hands when they meet traders. Gold is found there as elsewhere in the area. One passage from the Island of the Moon {cite:nuzhat-al-mushtaq-2002 p. 79}."
  es: "Un pueblo a orillas de un gran arroyo cuyos habitantes van desnudos y se cubren las manos al encontrarse con comerciantes. Allí se encuentra oro, al igual que en otros lugares de la zona. Un fragmento de La Isla de la Luna {cite:nuzhat-al-mushtaq-2002 p. 79}."
  fr: "Une ville située sur un large cours d'eau, dont les habitants ne portent pas de vêtements et se couvrent les mains lorsqu'ils rencontrent des marchands. On y trouve de l'or, comme ailleurs dans la région. Extrait de L'Île de la Lune {cite:nuzhat-al-mushtaq-2002 p. 79}."
  ur: "ایک بڑی ندی پر واقع ایک قصبہ جس کے لوگ بغیر کپڑے کے جاتے ہیں اور جب وہ تاجروں سے ملتے ہیں تو اپنے ہاتھ ڈھانپ لیتے ہیں۔ سونا اس علاقے کی دوسری جگہوں کی طرح وہاں بھی پایا جاتا ہے۔ چاند کے جزیرے سے ایک حوالہ {حوالہ: نزہت المشتاق-2002 ص۔ 79}۔"
  tr: "Büyük bir dere üzerinde yer alan bu şehir, halkı tüccarlarla buluştuğunda ellerini kapatır ve kadınları ailelerinin çıplaklığı nedeniyle örtülür. Diğerlerinde olduğu gibi altın içerir ve Ay adasına sadece bir kanal uzaklıktadır {cite:nuzhat-al-mushtaq-2002, s. 79}."
  id: "Sebuah kota di atas sungai besar, penduduknya menutupi tangan saat bertemu pedagang, dan wanita mereka berjilbab karena keluarga mereka telanjang. Kota ini mengandung emas seperti di pulau lain, dan hanya satu saluran dari pulau Bulan {cite:nuzhat-al-mushtaq-2002, hlm. 79}."
