summary:
  ar: "المنكب من حصون ساحل شرق مالقة؛ إليه نزل السلطان أبو الحسن صاحب غرناطة بعد أن خلع نفسه لأخيه الزغل فأقام بها إلى أن مات {cite:nafh-tib-maqqari p. 519}."
  en: "Almunecar (al-Munkab) — the coastal fortress east of Malaga where the blinded ex-sultan Abu al-Hasan retired after abdicating to his brother al-Zaghal, and died {cite:nafh-tib-maqqari p. 519}."
  es: "Almuñécar (al-Munkab) — la fortaleza costera al este de Málaga donde el ex sultán ciego Abu al-Hasan se retiró después de abdicar en favor de su hermano al-Zaghal, y murió {cite:nafh-tib-maqqari p. 519}."
  fr: "Almunecar (al-Munkab) — la forteresse côtière à l'est de Malaga où l'ancien sultan aveugle Abu al-Hasan se retira après avoir abdiqué en faveur de son frère al-Zaghal, et mourut {cite:nafh-tib-maqqari p. 519}."
  ur: "المونکر ⁦(المنکب)⁩ - ملاگا کے مشرق میں ساحلی قلعہ جہاں نابینا سابق سلطان ابو الحسن اپنے بھائی الزغل سے دستبردار ہونے کے بعد سبکدوش ہو گئے اور انتقال کر گئے۔ 519}۔"
  tr: "Sandık, Malaga'nın doğu kıyısındaki kalelerden biridir; Granada hükümdarı Sultan Ebu el-Hasan, kardeşi el-Zaghl'dan feragat ettikten sonra oraya yerleşmiş ve ölümüne kadar orada kalmıştır {atıf:nafh-tib-maqqari s. 519}."
  id: "Tabut adalah salah satu benteng di pantai timur Malaga; Sultan Abu al-Hasan, penguasa Granada, menetap di sana setelah turun tahta dari saudaranya al-Zaghl dan tinggal di sana hingga kematiannya {cite:nafh-tib-maqqari hlm. 519}."
