summary:
  ar: "مدينة كبيرة فيها بشر كثير ولها عمل كبير وكروم وحروث، ومنها إلى شنت مجيال التي على البحر سبعون ميلاً، وهي من إقليم نيي. {cite:nuzhat-al-mushtaq-2002 p. 861}"
  en: "A large city with many people and a wide district, with vineyards and fields; seventy miles from Shant Majal on the sea; in the district of Ni. {cite:nuzhat-al-mushtaq-2002 p. 861}"
  es: "Una gran ciudad con muchos habitantes y un distrito extenso, con viñedos y campos; a setenta millas de Shant Majal, en la costa; en el distrito de Ni. {cite:nuzhat-al-mushtaq-2002 p. 861}"
  fr: "Une grande ville avec une population nombreuse et un vaste district, avec des vignobles et des champs; à soixante-dix milles de Shant Majal, sur la mer; dans le district de Ni. {cite:nuzhat-al-mushtaq-2002 p. 861}"
  ur: "بہت سے لوگوں کے ساتھ ایک بڑا شہر اور ایک وسیع ضلع، انگور کے باغات اور کھیتوں کے ساتھ؛ شانت مجل سے ستر میل سمندر پر۔ نی کے ضلع میں {حوالہ: نزہت المشتاق-2002 ص۔ 861}"
  tr: "Çok sayıda insanı, geniş çalışmaları, bağları ve ürünleriyle büyük bir şehirdir; buradan deniz yoluyla yetmiş mil uzaklıktaki Shant Megyal'a ulaşır ve Niyi bölgesinin bir parçasıdır. {cite:nuzhat-al-mushtaq-2002 s. 861}"
  id: "Ini adalah kota besar dengan banyak penduduk serta pekerjaan luas, kebun anggur, dan tanaman, dari mana ia mencapai Shant Megyal, yang berjarak tujuh puluh mil melalui laut, dan merupakan bagian dari wilayah Niyi. {cite:nuzhat-al-mushtaq-2002 hlm. 861}"
