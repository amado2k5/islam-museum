summary:
  ar: "مدينة قديمة، وهي الآن خراب، والبحر منها على ثلاثة أيام، ويذكرها الإدريسي في عمل الأفطي. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  en: "An old town, now in ruins, a three-day sea distance from the coast; al-Idrisi lists it in the district of Aftiy. {cite:nuzhat-al-mushtaq-2002 p. 802}"
  es: "Una antigua ciudad, ahora en ruinas, situada a tres días de viaje por mar desde la costa; al-Idrisi la incluye en el distrito de Aftiy. {cita: Nuzhat-al-Mushtaq-2002 p. 802}"
  fr: "Une ancienne ville, aujourd'hui en ruines, située à trois jours de mer de la côte; al-Idrisi la situe dans le district d'Aftiy. {cite: Nuzhat-al-Mushtaq-2002 p. 802}"
  ur: "ایک پرانا شہر، جو اب کھنڈرات میں ہے، ساحل سے تین دن کی دوری پر؛ الادریسی نے اسے ضلع عفتی میں درج کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 802}"
  tr: "Şimdi harabe halinde, denize üç gün uzaklıkta olan eski bir şehir ve Al-Idrisi bunu Al-Aftī'nin eserinde anıyor. {cite:nuzhat-al-mushtaq-2002 s. 802}"
  id: "Sebuah kota tua, kini dalam reruntuhan, dengan laut tiga hari lagi, dan Al-Idrisi menyebutkannya dalam karya Al-Aftī. {cite:nuzhat-al-mushtaq-2002 hlm. 802}"
