summary:
  ar: "قرية كبيرة عامرة على نهر ملح، يشرب أهلها من عيون محتفرة في بطن واد يأتيها من المشرق. {cite:nuzhat-al-mushtaq-2002 p. 262}"
  en: "A large, populated village on a salt river; its people drink from springs dug in a valley that comes from the east. {cite:nuzhat-al-mushtaq-2002 p. 262}"
  es: "Un pueblo grande y poblado a orillas de un río salado; sus habitantes beben de manantiales excavados en un valle que proviene del este. {cite:nuzhat-al-mushtaq-2002 p. 262}"
  fr: "Un grand village peuplé, situé sur une rivière salée; ses habitants s’abreuvent à des sources creusées dans une vallée qui provient de l’est. {cite:nuzhat-al-mushtaq-2002 p. 262}"
  ur: "نمک دریا پر ایک بڑا، آبادی والا گاؤں؛ اس کے لوگ مشرق سے آنے والی وادی میں کھودے ہوئے چشموں سے پیتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 262}"
  tr: "Tuzlu bir nehir üzerinde büyük bir köy olan bu köy, doğudan gelen vadide oyulmuş kaynaklardan su içir. {cite:nuzhat-al-mushtaq-2002 s. 262}"
  id: "Sebuah desa besar di tepi sungai asin, penduduknya minum dari mata air yang dipahat di lembah yang mengalir ke arahnya dari timur. {cite:Nuzhat-al-Mushtaq-2002 hlm. 262}"
