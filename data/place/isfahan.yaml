label: { en: Isfahan, ar: أصفهان }
summary:
  ar: "مدينة ومقاطعة في وسط إيران، قضى فيها ابن سينا سنواته الأخيرة في بلاط علاء الدولة. كانت عاصمة سلجوقية في عهد طغرل بك وملكشاه، ثم عاصمة صفوية جعلها الشاه عباس مدينة بميدان الشاه وجامعه ومساجده وقصوره. تعرضت للحصار والنهب على يد تيمور ثم الأفغان، وتحتفظ اليوم بمجمع من أهم المعالم الإسلامية المحفوظة في مدينة حديثة."
  en: "A city and province in central Iran, where Ibn Sina spent his last years at the court of Ala al-Dawla. It was a Seljuk capital under Tughril Beg and Malikshah, then the Safavid capital that Shah Abbas replanned around the Maydan-i Shah. It suffered massacre and siege under Timur and the Afghans, and today keeps one of the most significant complexes of Islamic monuments preserved in a modern city."
  ur: "وسطی ایران کا شہر اور صوبہ، جہاں ابن سینا نے اپنے آخری سال علاء الدولہ کے دربار میں گزارے۔ یہ طغرل بیگ اور ملک شاہ کے دور میں سلجوقی دارالحکومت رہا، پھر صفوی دارالحکومت بنا جسے شاہ عباس نے میدان شاہ کے گرد نئے سرے سے ترتیب دیا۔ اس نے تیمور اور افغانوں کے ہاتھوں قتل عام اور محاصرے سہے، اور آج ایک جدید شہر میں محفوظ اسلامی یادگاروں کے اہم ترین مجموعوں میں سے ایک رکھتا ہے۔"
