summary:
  ar: "ناحية أولى كور جيحون مما وراء النهر، وفيها مدن منها هلاورد ولاوكند ومنك، وأكبر مدنها منك، وبها معدن الفضة. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  en: "The first district on the Oxus beyond the river, with towns including Halawarid, Lawkand and Manak; its largest town is Manak. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  es: "El primer distrito a orillas del Oxus, más allá del río, incluye localidades como Halawarid, Lawkand y Manak; su ciudad más grande es Manak. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  fr: "Le premier district sur l'Oxus au-delà du fleuve, avec des villes comme Halawarid, Lawkand et Manak; sa plus grande ville est Manak. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  ur: "دریا سے پرے آکسس پر پہلا ضلع، جس میں حلوارید، لاکند اور مانک شامل ہیں۔ اس کا سب سے بڑا قصبہ مانک ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 487}"
  tr: "İlk ilçe nehrin ötesindeki Kor Jihon'dur ve Halavard, Lakand ve Manak gibi şehirleri içerir; en büyük şehir Nak'tır ve gümüş mineralleri içerir. {kaynak:Nuzhat-al-mushtaq-2002 s. 487}"
  id: "Distrik pertama adalah Kor Jihon di seberang sungai, dan mencakup kota-kota seperti Halavard, Lakand, dan Manak, dengan kota terbesar adalah Nak, dan mengandung mineral perak. {cite:Nuzhat-al-Mushtaq-2002 hlm. 487}"
