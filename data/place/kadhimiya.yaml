summary:
  ar: "محلة ببغداد عند مشهد موسى الكاظم؛ ياقوت يذكر المكان باسم باب التبن ومقابر قريش، ولا يذكر اسم الكاظمية. {cite:mujam-al-buldan-sader-1995 1 p.306}"
  en: "A quarter of Baghdad at the shrine of Musa al-Kazim. Yaqut describes the place as Bab al-Tibn with the Quraysh cemeteries and does not use the name Kadhimiya. {cite:mujam-al-buldan-sader-1995 1 p.306}"
  ur: "بغداد کا ایک محلہ، جو موسیٰ کاظم کے مزار کے پاس ہے؛ یاقوت اس جگہ کو باب التبن اور مقابر قریش کے نام سے بیان کرتے ہیں، کاظمیہ کا نام نہیں لیتے۔ {cite:mujam-al-buldan-sader-1995 1 p.306}"
  es: "Un barrio de Bagdad, en el santuario de Musa al-Kazim. Yaqut describe el lugar como Bab al-Tibn, con los cementerios de los Quraysh, y no utiliza el nombre de Kadhimiya. {cite:mujam-al-buldan-sader-1995 1 p.306}"
  fr: "Un quartier de Bagdad, au sanctuaire de Musa al-Kazim. Yaqut décrit ce lieu comme Bab al-Tibn, avec les cimetières qurayshites, et n'utilise pas le nom de Kadhimiya. {cite:mujam-al-buldan-sader-1995 1 p.306}"
