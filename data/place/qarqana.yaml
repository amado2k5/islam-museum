summary:
  ar: "جزيرة ليس بها مدينة، وإنما يسكن أهلها في أخصاص، فيها كروم وغلات الكمون والأنيسون، فتحها الملك رجار في سنة ثمان وأربعين وخمس مائة من الهجرة. {cite:nuzhat-al-mushtaq-2002 p. 304}"
  en: "An island with no town; its people live in reed huts and grow vines, cumin and anise. King Roger took it in the year 548 AH. {cite:nuzhat-al-mushtaq-2002 p. 304}"
  es: "Una isla sin poblado; sus habitantes viven en chozas de caña y cultivan vides, comino y anís. El rey Roger la conquistó en el año 548 AH. {cite:nuzhat-al-mushtaq-2002 p. 304}"
  fr: "Une île sans ville; ses habitants vivent dans des huttes de roseaux et cultivent de la vigne, du cumin et de l’anis. Le roi Roger s’en empara en l’an 548 de l’Hégire. {cite:nuzhat-al-mushtaq-2002 p. 304}"
  ur: "ایک جزیرہ جس میں کوئی شہر نہیں؛ اس کے لوگ سرکنڈوں کی جھونپڑیوں میں رہتے ہیں اور بیلیں، زیرہ اور سونف اگاتے ہیں۔ بادشاہ راجر نے اسے 548 ہجری میں لیا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 304}"
