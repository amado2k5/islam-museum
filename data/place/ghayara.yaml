summary:
  ar: "مدينة على ضفة النيل، عليها حفير دائر بها، وبها خلق كثير وأهلها ذوو نجدة ومعرفة، يغيرون على بلاد لملم فيسبون أهلها ويبيعونهم لتجار غانة. وتبعد عن غانة إحدى عشرة مرحلة، وعن لملم ثلاث عشرة مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 26}"
  en: "A town on the Nile with a ditch around it and many people. Its people are bold and skilled; they raid the Lamlam lands, take captives and sell them to Ghana's merchants. Eleven stages from Ghana and thirteen from Lamlam. {cite:nuzhat-al-mushtaq-2002 p. 26}"
