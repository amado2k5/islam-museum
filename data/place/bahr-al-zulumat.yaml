label: { ar: "بحر الظلمات ⁦(البحر المحيط بغربي الأندلس)⁩", en: "The Sea of Darkness (the Atlantic west of al-Andalus)", es: "El Mar de las Tinieblas (el Atlántico al oeste de al-Ándalus)", fr: "La Mer des Ténèbres (l'Atlantique à l'ouest d'al-Andalus)", ur: "تاریکی کا سمندر ⁦(اندلس کے مغرب میں بحر اوقیانوس)⁩" }
summary:
  ar: "البحر المحيط الواقع غربي الأندلس وبلاد برطانيه، وذكر المؤلف أن المد والجزر فيه يتبعان أوقاتا محددة من النهار والليل، وعلله بهيجان الريح مع الشمس، وأن أهل المغرب شاهدوا ذلك {cite:nuzhat-al-mushtaq-2002 p. 93}."
  en: "The Atlantic west of al-Andalus and the lands of Britain. The author reports that its tides follow set hours of day and night, which he attributes to the wind rising with the sun, and says the people of the Maghreb have observed this {cite:nuzhat-al-mushtaq-2002 p. 93}."
  es: "El Atlántico al oeste de al-Ándalus y las tierras de Gran Bretaña. El autor informa que sus mareas siguen horarios fijos del día y la noche, lo que atribuye a que el viento se levanta con el sol, y dice que los habitantes del Magreb han observado esto {cite:nuzhat-al-mushtaq-2002 p. 93}."
  fr: "L'océan Atlantique à l'ouest d'al-Andalus et des terres de Grande-Bretagne. L'auteur rapporte que ses marées suivent des heures fixes du jour et de la nuit, ce qu'il attribue au vent qui se lève avec le soleil, et affirme que les peuples du Maghreb ont observé ce phénomène {cite:nuzhat-al-mushtaq-2002 p. 93}."
  ur: "الاندلس کے مغرب میں بحر اوقیانوس اور برطانیہ کی سرزمین۔ مصنف نے رپورٹ کیا ہے کہ اس کی لہریں دن اور رات کے مقررہ اوقات کے بعد آتی ہیں، جسے وہ سورج کے ساتھ اٹھنے والی ہوا سے منسوب کرتا ہے، اور کہتا ہے کہ مغرب کے لوگوں نے اس کا مشاہدہ کیا ہے۔ 93}۔"
