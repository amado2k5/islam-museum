summary:
  ar: "برهمباذ العتيقة مدينة قديمة على فرسخين من موضع المنصورة؛ اجتمع بها فل داهر فقاتلوا محمد بن القاسم ففتحها عنوة وقتل بها ثمانية آلاف وقيل ستة وعشرون ألفاً وهي اليوم خراب."
  en: "Brahmanabadh al-Atiqa, two farsakhs from al-Mansura's later site; Dahir's remnant made its stand — stormed with eight or twenty-six thousand dead — a ruin today."
  es: "Brahmanabadh al-Atiqa, a dos farsakhs del emplazamiento posterior de al-Mansura; los restos de Dahir, que resistieron —atacados con entre ocho y veintiséis mil muertos— son hoy una ruina."
  fr: "Brahmanabadh al-Atiqa, à deux farsakhs du site ultérieur d'al-Mansura; le vestige de Dahir a résisté — pris d'assaut avec huit ou vingt-six mille morts — est aujourd'hui une ruine."
  ur: "برہمن آباد العتیقہ، المنصورہ کے بعد کے مقام سے دو فرسخ؛ داہر کی باقیات نے اپنا موقف بنایا - آٹھ یا چھبیس ہزار مرنے والوں کے ساتھ طوفان - آج ایک کھنڈر ہے۔"
  tr: "Eski Barhambadh, Mansoura'nın bulunduğu yerden iki farsakh uzaklıktaki eski bir şehirdir; bir grup insan burada toplanıp Muhammed ibn el-Qasim ile savaştı; o burayı zorla fethetti ve sekiz bin, bazılarına göre yirmi altı bin kişiyi öldürdü ve şimdi harabe halindedir."
  id: "Barhambadh Lama adalah kota kuno dua farsakh dari lokasi Mansoura; sekelompok orang berkumpul di sana dan melawan Muhammad ibn al-Qasim, yang dengan paksa menaklukkannya dan membunuh delapan ribu, dan beberapa mengatakan dua puluh enam ribu, dan kini kota itu hancur."
