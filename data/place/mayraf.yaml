summary:
  ar: "مدينة كبيرة على ساحل البحر، وبها تجار مياسير، وأهلها مولعون بالسفر والتجوال، يذكر الإدريسي أن بعضهم يتجول العام والعامين ولا يرجع إلى أهله. {cite:nuzhat-al-mushtaq-2002 p. 410}"
  en: "A large city on the coast with wealthy merchants; its people are fond of travel, and al-Idrisi says some roam for a year or two without returning home. {cite:nuzhat-al-mushtaq-2002 p. 410}"
  es: "Una gran ciudad costera con ricos comerciantes; sus habitantes son aficionados a viajar, y al-Idrisi afirma que algunos vagan durante uno o dos años sin regresar a casa. {cite:nuzhat-al-mushtaq-2002 p. 410}"
  fr: "Une grande ville côtière peuplée de riches marchands; ses habitants aiment voyager, et al-Idrisi rapporte que certains errent pendant un an ou deux sans rentrer chez eux. {cite:nuzhat-al-mushtaq-2002 p. 410}"
  ur: "دولت مند تاجروں کے ساتھ ساحل پر ایک بڑا شہر؛ اس کے لوگ سفر کے شوقین ہیں، اور الادریسی کا کہنا ہے کہ کچھ لوگ ایک یا دو سال تک گھر لوٹے بغیر گھومتے رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 410}"
  tr: "Deniz kıyısında büyük bir şehir, Mayasir'den tüccarların yaşadığı ve halkı seyahat etmeye ve dolaşmaya tutkuyla bağlı. El-İdrisi, bazılarının bir iki yıl seyahat ettiğini ve ailelerine dönmediğini belirtir. {alıntı:Nuzhat-al-mushtaq-2002 s. 410}"
  id: "Sebuah kota besar di tepi pantai, dengan para pedagang dari Mayasir, dan penduduknya bersemangat untuk bepergian dan pengembaraan. Al-Idrisi menyebutkan bahwa beberapa dari mereka melakukan perjalanan selama satu atau dua tahun dan tidak kembali ke keluarga mereka. {cite:Nuzhat-al-Mushtaq-2002 hlm. 410}"
