summary:
  ar: "مدينة تتصل عماراتها بعمارة فره، وفيها قرى كثيرة وعمارات وأنهار تدخل إليها، وتبعد عن سجستان نحو مرحلة على طريق خراسان. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  en: "A city whose buildings join those of Farah, with many villages and watercourses, about one stage from Sijistan on the road to Khurasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  es: "Una ciudad cuyos edificios se unen a los de Farah, con numerosos pueblos y cursos de agua, aproximadamente a una etapa de Sijistan en la carretera a Khurasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  fr: "Une ville dont les bâtiments rejoignent ceux de Farah, avec de nombreux villages et cours d'eau, à environ une étape de Sijistan sur la route du Khorasan. {cite:nuzhat-al-mushtaq-2002 p. 456}"
  ur: "ایک شہر جس کی عمارتیں فراہ سے ملتی ہیں، بہت سے دیہات اور آبی گزرگاہیں، سجستان سے خراسان کی سڑک پر تقریباً ایک مرحلے پر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 456}"
  tr: "Binaları Farah Mimarisi'ne bağlı, birçok köy, bina ve nehir giren bir şehirdir ve Sijistan'dan Horasan yolunda yaklaşık bir aşama uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 456}"
  id: "Sebuah kota yang bangunannya terhubung dengan Arsitektur Farah, dengan banyak desa, bangunan, dan sungai yang masuk ke dalamnya, dan berjarak sekitar satu fase dari Sijistan di jalan menuju Khorasan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 456}"
