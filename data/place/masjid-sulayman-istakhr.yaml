id: place/masjid-sulayman-istakhr
class: place
kind: site
label: { ar: "مسجد سليمان باصطخر", en: "The 'Mosque of Solomon' at Istakhr", es: "La 'Mezquita de Salomón' en Istakhr", fr: "La « Mosquée de Salomon » à Istakhr", ur: "استخارہ میں 'مسجد سلیمان'", tr: "İstaher'deki Süleyman Camii", id: "Masjid Suleiman di Istakher" }
summary:
  ar: "بناء عظيم على نحو فرسخ من مدينة اصطخر كان بيتاً للنار في قديم الزمان أخرجته حماية بنت بهمن بن اسفنديار وجعلته بيت نار ثم نقلت عنه النار فتخرب، والناس في زمن المسعودي يذكرون أنه مسجد سليمان بن داود وبه يعرف، وقد دخله المسعودي فرأى بنياناً عجيباً وهيكلاً عظيماً وأساطين صخر عليها صور من الصخر من الخيل وغيرها من الحيوان وصور أشخاص يزعم من جاور الموضع أنها صور الأنبياء، وهو في سفح جبل والريح لا تخرج من ذلك الهيكل ليلاً ولا نهاراً ولها هبوب ودوي يزعمون أن سليمان حبس الريح فيه، وأنه كان يتغدى ببعلبك ويتعشى بهذا المسجد وينزل بينهما بتدمر {cite:muruj-al-dhahab p. 550}."
  en: "A ruined fire-temple a farsakh from Istakhr — made a fire-house by Queen Humay, later stripped and ruined — which al-Mas'udi entered and found marvellous: rock pillars crowned with stone horses and statues locals called prophets, and a wind that never stops moaning through it, said to be Solomon's chained wind; folk add he lunched at Baalbek and dined here, stopping at Palmyra {cite:muruj-al-dhahab p. 550}."
  es: "Un templo de fuego en ruinas a un farsakh de Istakhr —convertido en casa de fuego por la reina Humay, luego despojado y arruinado— al que al-Mas'udi entró y encontró maravilloso: pilares de roca coronados con caballos de piedra y estatuas que los lugareños llamaban profetas, y un viento que nunca deja de gemir a través de él, que se dice que es el viento encadenado de Salomón; la gente añade que almorzó en Baalbek y cenó aquí, haciendo una parada en Palmira {cite:muruj-al-dhahab p. 550}."
  fr: "Un temple du feu en ruine à un farsakh d'Istakhr — transformé en foyer par la reine Humay, puis dépouillé et ruiné — dans lequel al-Mas'udi entra et qu'il trouva merveilleux: des piliers de pierre couronnés de chevaux de pierre et de statues que les locaux appelaient prophètes, et un vent qui ne cesse de gémir à travers lui, que l'on dit être le vent enchaîné de Salomon; les gens ajoutent qu'il déjeuna à Baalbek et dîna ici, s'arrêtant à Palmyre {cite:muruj-al-dhahab p. 550}."
  ur: "استخار سے فرسخ میں ایک تباہ شدہ آتش گیر مندر - ملکہ ہمے نے ایک آتش خانہ بنایا تھا، جسے بعد میں چھین کر برباد کر دیا گیا تھا - جس میں المسعودی داخل ہوا اور اسے شاندار پایا: پتھر کے ستونوں پر پتھر کے گھوڑے اور مجسمے جن کو مقامی لوگ نبی کہتے ہیں، اور ایک آندھی جو کبھی اس کے ذریعے آہ و بکا نہیں روکتی، سومنلو وِن نے کہا۔ لوگوں نے مزید کہا کہ اس نے بعلبیک میں دوپہر کا کھانا کھایا اور پالمیرا میں رک کر یہاں کھانا کھایا {حوالہ: مروج الذہاب صفحہ 550}۔"
  tr: "İstahr şehrine yakın bir farsakh civarında büyük bir yapı olan bu yapı, eski zamanlarda Bahman ibn İsfandiyar'ın koruması tarafından ateş evi olarak sökülmüş, ardından ateş taşınmış ve söndürülmüştür. El-Mes'ud zamanında insanlar burayı Süleyman bin Davud camisi olarak hatırlar ve bu adıyla bilinir. El-Mes'udi oraya girdiğinde harika bir yapı, büyük bir türbe, at ve diğer hayvanların heykellerinin olduğu kaya sütunları ile peygamberlerin heykelleri olduğu iddia edilen insan figürleri gördü. Bir dağın eteğinde yer alıyordu ve rüzgar tapınaktan gece gündüz çıkmaz, yüksek ve yankılı bir şekilde esirler. Süleyman'ın rüzgarı orada tuttuğu, Baalbek'te öğle yemeği yediği, bu camide akşam yemeği yediği ve Palmira'da aralarında yerleştiği söylenir. {alıntı:Muruj-al-Dhahab, s. 550}."
  id: "Sebuah bangunan besar sekitar farsakh dari kota Istakhr, dulunya merupakan rumah api pada zaman kuno yang dibongkar oleh perlindungan Bahman ibn Isfandiyar, yang menjadikannya rumah api, lalu api dipindahkan dan dihancurkan. Orang-orang pada masa al-Mas'ud mengingatnya sebagai masjid Sulayman ibn Dawud, yang dikenal sebagai masjid ini. Al-Mas'udi masuk ke dalamnya dan melihat sebuah bangunan menakjubkan, sebuah tempat suci besar, dan tiang-tiang batu yang memuat patung kuda dan hewan lain, serta gambar orang-orang di dekat situs tersebut yang diklaim sebagai gambar nabi. Masjid itu terletak di kaki gunung, dan angin tidak meninggalkan kuil itu siang maupun malam, dengan hembusan keras dan keras. Dikatakan bahwa Salomo menjebak angin di dalamnya, dan dia biasa makan siang di Baalbek, makan malam di masjid ini, dan menetap di antara mereka di Palmyra. {cite:Muruj-al-Dhahab, hlm. 550}."
