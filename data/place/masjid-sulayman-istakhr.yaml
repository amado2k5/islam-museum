id: place/masjid-sulayman-istakhr
class: place
kind: site
label: { ar: "مسجد سليمان باصطخر", en: "The 'Mosque of Solomon' at Istakhr" }
summary:
  ar: "بناء عظيم على نحو فرسخ من مدينة اصطخر كان بيتاً للنار في قديم الزمان أخرجته حماية بنت بهمن بن اسفنديار وجعلته بيت نار ثم نقلت عنه النار فتخرب، والناس في زمن المسعودي يذكرون أنه مسجد سليمان بن داود وبه يعرف، وقد دخله المسعودي فرأى بنياناً عجيباً وهيكلاً عظيماً وأساطين صخر عليها صور من الصخر من الخيل وغيرها من الحيوان وصور أشخاص يزعم من جاور الموضع أنها صور الأنبياء، وهو في سفح جبل والريح لا تخرج من ذلك الهيكل ليلاً ولا نهاراً ولها هبوب ودوي يزعمون أن سليمان حبس الريح فيه، وأنه كان يتغدى ببعلبك ويتعشى بهذا المسجد وينزل بينهما بتدمر {cite:muruj-al-dhahab p. 550}."
  en: "A ruined fire-temple a farsakh from Istakhr — made a fire-house by Queen Humay, later stripped and ruined — which al-Mas'udi entered and found marvellous: rock pillars crowned with stone horses and statues locals called prophets, and a wind that never stops moaning through it, said to be Solomon's chained wind; folk add he lunched at Baalbek and dined here, stopping at Palmyra {cite:muruj-al-dhahab p. 550}."
