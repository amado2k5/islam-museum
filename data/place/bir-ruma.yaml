summary:
  ar: "بئر بالعقيق قديمة كانت انطمت فحالف قوم من مزينة الأنصار وأصلحوها وسميت برومة امرأة منهم كانت تستقي منها للناس، ومر بها النبي فرأى رجلاً من مزينة يسقي عليها بأجر فقال «نعم هذه صدقة للمؤمن هذه» فاشتراها عثمان بن عفان بأربع مائة دينار فتصدق بها، ثم مر بها النبي فسأل عنها فأُخبر خبرها فقال «اللهم أوجب لعثمان الجنة» {cite:ansab-al-ashraf p. 536}."
  en: "The well of Ruma in al-Aqiq — revived by Muzayna allies of the Ansar and named for a woman who drew from it; when the Prophet saw a man selling its water he praised it as charity, and Uthman bought it for four hundred dinars and gave it away, earning the Prophet's prayer 'O God, guarantee Uthman the Garden' {cite:ansab-al-ashraf p. 536}."
  es: "El pozo de Ruma en al-Aqiq, revivido por los aliados muzayna de los Ansar y nombrado en honor a una mujer que sacaba agua de él; cuando el Profeta vio a un hombre vendiendo su agua, lo elogió como una obra de caridad, y Uthman la compró por cuatrocientos dinares y la regaló, ganándose así la oración del Profeta: «¡Oh Dios, garantiza a Uthman el Jardín!» {cita: ansab-al-ashraf p. 536}."
  fr: "Le puits de Ruma à al-Aqiq — remis en service par les Muzayna, alliés des Ansar, et nommé d'après une femme qui y puisait de l'eau; lorsque le Prophète vit un homme vendre son eau, il la loua comme une aumône, et Uthman l'acheta pour quatre cents dinars et la donna, ce qui lui valut la prière du Prophète: « Ô Dieu, garantis à Uthman le Jardin » {cite: ansab-al-ashraf p. 536}."
  ur: "العقیق میں روما کا کنواں — انصار کے مزینہ اتحادیوں نے دوبارہ زندہ کیا اور اسے ایک عورت کے نام سے موسوم کیا جو اس سے نکلی تھی۔ جب نبی کریم نے ایک آدمی کو پانی بیچتے ہوئے دیکھا تو آپ نے اس کی تعریف کی، اور عثمان نے اسے چار سو دینار میں خرید کر دے دیا، اور رسول اللہ کی دعا کی کہ اے اللہ، عثمان کو باغ کی ضمانت دے\"۔ 536}۔"
  tr: "Al-Aqiq'te kapalı olan eski bir kuyu vardı, bu yüzden bir grup Muzaynah al-Ansar ile ittifak kurup onardı. Adı Rummah'tı. Aralarından bir kadın insanlara su çekerdi. Peygamber yanından geçti ve Muzeyne'den bir adamın ona ücret karşılığında su verdiğini gördü. Osman ibn Affan kuyunu dört yüz dinara satın aldı ve sadaka olarak verdi. Sonra Peygamber yanından geçti, sordu ve 'Ey Allah, Osman Cennet'i ver' dedi."
  id: "Sebuah sumur tua di Al-Aqiq yang telah ditutup, maka sekelompok orang bersekutu dengan Muzaynah al-Ansar dan memperbaikinya. Sumur itu dinamai Rummah. Seorang wanita dari antara mereka biasa mengambil air dari sumur itu untuk orang-orang. Nabi lewat dan melihat seorang pria dari Muzaynah memberinya air dengan bayaran. Dia berkata, 'Ya, ini adalah sedekah untuk orang beriman.' Uthman ibn Affan membelinya seharga empat ratus dinar dan memberikannya sebagai sedekah. Kemudian Nabi melewatinya, menanyakan tentangnya, dan memberitahukan tentangnya, berkata, 'Ya Allah, berikan Langit kepada Utsman' {cite:ansab-al-ashraf, hlm. 536}."
