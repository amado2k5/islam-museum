label: { ar: "بئر رومة", en: "Bir Ruma" }
summary:
  ar: "بئر بالعقيق قديمة كانت انطمت فحالف قوم من مزينة الأنصار وأصلحوها وسميت برومة امرأة منهم كانت تستقي منها للناس، ومر بها النبي فرأى رجلاً من مزينة يسقي عليها بأجر فقال «نعم هذه صدقة للمؤمن هذه» فاشتراها عثمان بن عفان بأربع مائة دينار فتصدق بها، ثم مر بها النبي فسأل عنها فأُخبر خبرها فقال «اللهم أوجب لعثمان الجنة» {cite:ansab-al-ashraf p. 536}."
  en: "The well of Ruma in al-Aqiq — revived by Muzayna allies of the Ansar and named for a woman who drew from it; when the Prophet saw a man selling its water he praised it as charity, and Uthman bought it for four hundred dinars and gave it away, earning the Prophet's prayer 'O God, guarantee Uthman the Garden' {cite:ansab-al-ashraf p. 536}."
