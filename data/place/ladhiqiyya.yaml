summary:
  ar: "مدينة ساحلية من سواحل الشام؛ فتحها عبادة بن الصامت عنوة بمكيدة الحفائر إذ كان بها باب عظيم لا يفتحه الجماعة، فبنى بها المسلمون مسجداً جامعاً بأمره؛ وهدمها الروم في غارة بحرية سنة 100 وسبوا أهلها فأمر عمر بن عبد العزيز ببنائها وتحصينها فأتمها يزيد بن عبد الملك."
  en: "A coastal city of Syria's seaboard; Ubada ibn al-Samit took it by force through the trench ruse — it had a great gate a host could not open — and the Muslims built a congregational mosque at his command; the Byzantines demolished it in a sea-raid in year 100 carrying off its people, and Umar ibn Abd al-Aziz ordered it rebuilt and fortified, Yazid ibn Abd al-Malik completing it."
