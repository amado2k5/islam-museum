summary:
  ar: "مدينة ساحلية من سواحل الشام؛ فتحها عبادة بن الصامت عنوة بمكيدة الحفائر إذ كان بها باب عظيم لا يفتحه الجماعة، فبنى بها المسلمون مسجداً جامعاً بأمره؛ وهدمها الروم في غارة بحرية سنة 100 وسبوا أهلها فأمر عمر بن عبد العزيز ببنائها وتحصينها فأتمها يزيد بن عبد الملك."
  en: "A coastal city of Syria's seaboard; Ubada ibn al-Samit took it by force through the trench ruse — it had a great gate a host could not open — and the Muslims built a congregational mosque at his command; the Byzantines demolished it in a sea-raid in year 100 carrying off its people, and Umar ibn Abd al-Aziz ordered it rebuilt and fortified, Yazid ibn Abd al-Malik completing it."
  es: "Una ciudad costera de la costa de Siria; Ubada ibn al-Samit la tomó por la fuerza mediante la estratagema de la trinchera —tenía una gran puerta que ningún ejército podía abrir— y los musulmanes construyeron una mezquita congregacional por orden suya; los bizantinos la demolieron en una incursión marítima en el año 100, llevándose a su gente, y Umar ibn Abd al-Aziz ordenó su reconstrucción y fortificación, obra que Yazid ibn Abd al-Malik completó."
  fr: "Ville côtière du littoral syrien, Ubada ibn al-Samit s'en empara par la force grâce à la ruse du fossé — elle possédait une grande porte qu'une armée ne pouvait ouvrir — et les musulmans y construisirent une mosquée sur son ordre. Les Byzantins la détruisirent lors d'un raid maritime en l'an 100, emmenant ses habitants, et Umar ibn Abd al-Aziz ordonna sa reconstruction et sa fortification, Yazid ibn Abd al-Malik l'achevant."
