summary:
  ar: "حصن منيع حسن البنية متقن، على البحر، يجتمع عنده مصب الماء، ويبلغ عرضه نحو ثلاثة أميال. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  en: "A strong, well-built fortress on the sea where the river mouth gathers, about three miles across. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  es: "Una fortaleza sólida y bien construida en el mar, en la desembocadura del río, de aproximadamente tres millas de ancho. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  fr: "Une forteresse solide et bien construite sur la mer, à l'embouchure du fleuve, d'une largeur d'environ trois milles. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  ur: "سمندر پر ایک مضبوط، اچھی طرح سے بنایا ہوا قلعہ جہاں دریا کا منہ تقریباً تین میل کے فاصلے پر جمع ہوتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 398}"
  tr: "Deniz üzerinde, su ağzının birleştiği ve yaklaşık üç mil genişliğe ulaştığı yerde iyi inşa edilmiş ve iyi inşa edilmiş bir kale. {cite:nuzhat-al-mushtaq-2002 s. 398}"
  id: "Benteng, dibangun dengan baik, dan dibangun dengan baik di tepi laut, di tempat muara air bertemu dan lebarnya sekitar tiga mil. {cite:Nuzhat-al-Mushtaq-2002 hlm. 398}"
