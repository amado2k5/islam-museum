summary:
  ar: "أعظم مدن أشروسنة، مدينة كبيرة ذات سور وربض، فيها مسجد جامع وقهندز، وبها نهر كبير عليه أرحاء، ولها بساتين وزروع وكروم. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  en: "The largest city of Ushrusana, a great city with a wall and suburb, a congregational mosque and citadel, a large river with mills, orchards, fields and vineyards. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  es: "La ciudad más grande de Ushrusana, una gran ciudad con murallas y suburbios, una mezquita principal y una ciudadela, un gran río con molinos, huertos, campos y viñedos. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  fr: "La plus grande ville d'Ushrusana, une grande cité entourée de remparts et d'une banlieue, avec une mosquée et une citadelle, un grand fleuve traversé par des moulins, des vergers, des champs et des vignobles. {cite:nuzhat-al-mushtaq-2002 p. 504}"
  ur: "عشروسانہ کا سب سے بڑا شہر، ایک عظیم شہر جس کی دیوار اور مضافات ہیں، ایک اجتماعی مسجد اور قلعہ، ایک بڑا دریا جس میں ملیں، باغات، کھیت اور انگور کے باغ ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 504}"
