summary:
  ar: الفيوم من أعمال مصر العليا؛ وجّه إليها عمرو بن العاص خارجة بن حذافة العدوي مع الأشمونين وإخميم والبشرودات وقرى الصعيد فصالح أهل قراها على مثل حكم الفسطاط.
  en: Al-Fayyum, among Upper Egypt's districts; Amr ibn al-As sent Kharija ibn Hudhafa al-Adawi to it together with al-Ashmunayn, Ikhmim, al-Bashrudat and the Sa'id's villages — their people compounding on Fustat's terms.
  es: "Al-Fayyum, uno de los distritos del Alto Egipto; Amr ibn al-As envió a Kharija ibn Hudhafa al-Adawi allí junto con al-Ashmunayn, Ikhmim, al-Bashrudat y las aldeas de los Sa'id, cuyas personas se unieron bajo las condiciones de Fustat."
  fr: "Al-Fayyum, parmi les districts de Haute-Égypte; Amr ibn al-As y envoya Kharija ibn Hudhafa al-Adawi avec al-Ashmunayn, Ikhmim, al-Bashrudat et les villages des Sa'id — leurs habitants se regroupant selon les conditions de Fustat."
  ur: "الفیوم، بالائی مصر کے اضلاع میں سے؛ عمرو بن العاص نے خارجہ بن حذافہ العدوی کو اشمونین، اخمیم، البشردات اور سعید کے گاؤں کے ساتھ بھیجا - ان کے لوگ فسطاط کی شرائط پر متفق تھے۔"
  tr: "Fayoum, Yukarı Mısır'ın bir ilidir; Amr ibn al-As-Harica ibn Hudhafa al-Adawi, Ashmunayn, Akhmim, al-Bashrudat ve Yukarı Mısır köyleriyle birlikte burayı gönderdi; böylece köylerindeki insanları barıştırarak Fustat'ta hüküm sürdü."
  id: "Fayoum adalah salah satu provinsi di Mesir Hulu; Amr ibn al-As Kharija ibn Hudhafa al-Adawi mengirimnya bersama Ashmunayn, Akhmim, al-Bashrudat, dan desa-desa di Mesir Hulu, sehingga ia mendamaikan penduduk desa mereka saat ia memerintah di Fustat."
