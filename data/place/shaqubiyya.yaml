summary:
  ar: "قرى مجتمعة ليست بمدينة، أهلها يركبون الخيل، عمارتها متداخلة، وفيها بشر كثير، وأهلها أصحاب نتاج وسوائم، وتبعد عن طليطلة نحو خمسين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  en: "Joined villages rather than a city; its people ride horses, the buildings are close together, the people are many, and they breed livestock; about fifty miles from Toledo. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  es: "Más que una ciudad, es un conjunto de aldeas unidas; sus habitantes montan a caballo, los edificios están muy juntos, la población es numerosa y se dedican a la cría de ganado; se encuentra a unos ochenta kilómetros de Toledo. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  fr: "Il s'agit de villages accolés plutôt que d'une ville; ses habitants se déplacent à cheval, les bâtiments sont proches les uns des autres, la population est nombreuse et ils pratiquent l'élevage; à environ cinquante miles de Tolède. {cite:nuzhat-al-mushtaq-2002 p. 733}"
  ur: "شہر کے بجائے دیہاتوں میں شامل ہو گئے۔ اس کے لوگ گھوڑوں پر سوار ہیں، عمارتیں ایک دوسرے کے قریب ہیں، لوگ بہت ہیں، اور وہ مویشی پالتے ہیں۔ ٹولیڈو سے تقریباً پچاس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 733}"
  tr: "Bunlar sadece şehirler değil, köyler de toplanır; halkı at biner, mimarileri iç içe geçmiştir, çok sayıda insan vardır ve halkı zengin ve zengin olur, ayrıca Toledo'ya yaklaşık elli mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 733}"
  id: "Ini adalah desa-desa yang berkumpul, bukan hanya kota; penduduknya menunggang kuda, arsitektur mereka saling terkait, ada banyak orang, dan penduduknya kaya dan kaya, dan mereka sekitar lima puluh mil dari Toledo. {cite:Nuzhat-al-Mushtaq-2002 hlm. 733}"
