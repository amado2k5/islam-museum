summary:
  ar: "مدينة مملكة القوط بالأندلس على نهر تاجة؛ عند البلاذري افتتحها طارق بن زياد وأصاب بها مائدة عظيمة أهداها موسى بن نصير إلى الوليد بن عبد الملك بدمشق سنة 96هـ، وبقيت بيد المسلمين حتى سقطت سنة 478هـ وصارت لاحقاً مركزاً للترجمة عن العربية. وروى المقري عن ابن خلكان أن ملوك اليونان اتفقوا فجعلوا طلسمات في تابوت من الرخام وتركوه في بيت بطليطلة وركبوا على بابه قفلاً يزيد عليه كل ملك قفلاً حتى بلغت ستة وعشرين قفلاً، فلما ملك لذريق وهو السابع والعشرون فتح البيت فلم يجد فيه سوى رق وصور فرسان على أشكال العرب معتممين متقلدين السيوف، وفي الرق أن من فتح هذا البيت دخل القوم المصورون إلى جزيرة الأندلس وذهب ملك من فيها من أيديهم، فلم يلبث إلا قليلاً حتى سمع أن جيشاً وصل من المشرق ليفتح الأندلس {cite:nafh-tib-maqqari p. 283-284}."
  en: "Toledo, the Gothic capital of al-Andalus on the Tagus; Tariq ibn Ziyad took it and seized there the great table Musa ibn Nusayr presented to al-Walid at Damascus in 96. Ibn Khallikan's famous tale: each Gothic king added a lock to a sealed house until Roderic, the twenty-seventh, opened it and found only a scroll and painted Arab horsemen, prophesying that whoever opened it would see those pictured men enter al-Andalus {cite:nafh-tib-maqqari p. 283-284}."
