education:
  did_you_know:
    ar: "طليطلة عاصمة القوط على نهر تاجة، فتحها طارق بن زياد وأصاب بها المائدة المشهورة؛ وسقطت من أيدي المسلمين سنة ٤٧٨هـ وصارت مركزاً للترجمة عن العربية."
    en: "Toledo, the Goths' capital on the Tagus, was opened by Tariq ibn Ziyad — where he found the famous Table; it left Muslim hands in 478 AH and later became a centre of translation from Arabic."
    ur: "طليطلہ، گوتھوں کا دارالحکومت دریائے تاجہ پر، طارق بن زیاد نے فتح کیا — جہاں سے مشہور میز ملی؛ 478ھ میں مسلمانوں کے ہاتھ سے نکلا اور بعد میں عربی سے ترجمے کا مرکز بنا۔"
    sources: [source/futuh-buldan-maarif-1407, source/nafh-tib-maqqari]
