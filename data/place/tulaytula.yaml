summary:
  ar: "مدينة مملكة القوط بالأندلس على نهر تاجة؛ عند البلاذري افتتحها طارق بن زياد وأصاب بها مائدة عظيمة أهداها موسى بن نصير إلى الوليد بن عبد الملك بدمشق سنة 96هـ، وبقيت بيد المسلمين حتى سقطت سنة 478هـ وصارت لاحقاً مركزاً للترجمة عن العربية. وروى المقري عن ابن خلكان أن ملوك اليونان اتفقوا فجعلوا طلسمات في تابوت من الرخام وتركوه في بيت بطليطلة وركبوا على بابه قفلاً يزيد عليه كل ملك قفلاً حتى بلغت ستة وعشرين قفلاً، فلما ملك لذريق وهو السابع والعشرون فتح البيت فلم يجد فيه سوى رق وصور فرسان على أشكال العرب معتممين متقلدين السيوف، وفي الرق أن من فتح هذا البيت دخل القوم المصورون إلى جزيرة الأندلس وذهب ملك من فيها من أيديهم، فلم يلبث إلا قليلاً حتى سمع أن جيشاً وصل من المشرق ليفتح الأندلس {cite:nafh-tib-maqqari p. 283-284}."
  en: "Toledo, the Gothic capital of al-Andalus on the Tagus; Tariq ibn Ziyad took it and seized there the great table Musa ibn Nusayr presented to al-Walid at Damascus in 96. Ibn Khallikan's famous tale: each Gothic king added a lock to a sealed house until Roderic, the twenty-seventh, opened it and found only a scroll and painted Arab horsemen, prophesying that whoever opened it would see those pictured men enter al-Andalus {cite:nafh-tib-maqqari p. 283-284}."
  es: "Toledo, la capital gótica de al-Ándalus en el Tajo; Tariq ibn Ziyad la tomó y se apoderó de la gran mesa que Musa ibn Nusayr le había regalado a al-Walid en Damasco en el año 96. El famoso relato de Ibn Khallikan: cada rey godo añadió un candado a una casa sellada hasta que Rodrigo, el vigésimo séptimo, la abrió y encontró solo un pergamino y figuras pintadas de jinetes árabes, profetizando que quien lo abriera vería a esos hombres representados entrar en al-Ándalus {cite:nafh-tib-maqqari p. 283-284}."
  fr: "Tolède, capitale gothique d'al-Andalus sur le Tage; Tariq ibn Ziyad s'en empara et y saisit la grande table que Musa ibn Nusayr avait offerte à al-Walid à Damas en 96. Le célèbre récit d'Ibn Khallikan: chaque roi gothique ajouta une serrure à une maison scellée jusqu'à ce que Rodéric, le vingt-septième, l'ouvre et n'y trouve qu'un rouleau et des cavaliers arabes peints, prophétisant que quiconque l'ouvrirait verrait ces hommes représentés entrer en al-Andalus {cite: nafh-tib-maqqari p. 283-284}."
  ur: "ٹولیڈو، ٹیگس پر الاندلس کا گوتھک دارالحکومت؛ طارق ابن زیاد نے اسے لے لیا اور وہاں 96 میں موسیٰ بن نصیر نے دمشق میں الولید کو پیش کی گئی عظیم میز پر قبضہ کر لیا۔ ابن خلقان کی مشہور کہانی: ہر گوتھک بادشاہ نے ایک مہر بند مکان میں ایک تالہ جوڑا یہاں تک کہ ستائیسویں روڈریک نے اسے کھولا اور اسے صرف ایک طومار ملا، جو اس کو کھول کر تصویریں بناتے ہوئے گھوڑوں کو دیکھتا تھا۔ مرد اندلس میں داخل ہوتے ہیں۔ 283-284}۔"
  tr: "Got Krallığı'nın Endülüs'te, Taja Nehri üzerindeki şehri; el-Baladhuri tarafından Tariq ibn Ziyad tarafından açılmış ve 96 H yılında Şam'da Musa ibn Nusayr tarafından el-Velid bin Abdülmelik'e hediye edilen büyük bir masa ile kurulmuştur. 478 Hicri'de düşene kadar Müslümanların elinde kalmış, daha sonra Arapçadan çevirilerin merkezi olmuştur. El-Maqri, İbn Hallikan'dan Yunan krallarının kabul ettiğini, mermer bir tabutta tılsımlar koyup Toledo evinde bıraktığını ve kapısına kilit taktıklarını, her kralın sayı yirmi altıya ulaşana kadar bu kilit eklediğini anlatmıştır. Yirmi yedinci kral Huriq'in kralı olduğunda, evi açtı ve sadece parşömen ve kılıç takan Arap biçimli şövalyelerin heykellerinden başka bir şey bulmadı. El-Ruk'ta, bu evi açan halk Endülüs adasına girdi ve oradaki sakinlerin kralı ellerinden alındı. Kısa süre sonra, doğudan bir ordunun Endülüs'ü fethetmek için geldiğini duydu. {kaynak:nafh-tib-maqqari s. 283-284}."
  id: "Kota Kerajaan Gotik di al-Andalus di Sungai Taja; oleh al-Baladhuri, dibuka oleh Tariq ibn Ziyad dan didirikan oleh sebuah meja besar yang diberikan oleh Musa ibn Nusayr kepada al-Walid ibn Abd al-Malik di Damaskus pada tahun 96 H. Kota ini tetap berada di tangan Muslim hingga jatuh pada tahun 478 H, kemudian menjadi pusat terjemahan dari bahasa Arab. Al-Maqri menceritakan dari Ibn Khallikan bahwa para raja Yunani setuju dan meletakkan jimat di dalam peti marmer, meninggalkannya di rumah Toledo, dan memasang kunci di pintunya, yang kemudian ditambah oleh setiap raja hingga jumlahnya mencapai dua puluh enam. Ketika ia menjadi raja Dhuriq, raja kedua puluh tujuh, ia membuka rumah itu dan hanya menemukan perkamen dan gambar ksatria berwujud Arab yang membawa pedang. Di Al-Ruq, orang-orang yang membuka rumah ini memasuki pulau al-Andalus, dan raja penduduknya diambil dari tangan mereka. Tak lama kemudian, ia mendengar bahwa pasukan telah datang dari Timur untuk menaklukkan al-Andalus. {cite:nafh-tib-maqqari hlm. 283-284}."
