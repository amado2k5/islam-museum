summary:
  ar: "قلعة منيعة على الفرات مجاورة لقلعة البيرة، كانت داراً لكاثوليكوس الأرمن ومن تحت طاعة التتار؛ نازلها السلطان الملك الأشرف خليل ونصب عليها المجانيق حتى فُتحت بعد خمسة وعشرين يوماً في رجب سنة إحدى وتسعين وستمائة {cite:shadharat-dhahab p. 729}."
  en: "A strong fortress on the Euphrates beside the fortress of al-Bira. It had been a seat of the Catholicos of the Armenians and was under Tatar rule. The sultan al-Malik al-Ashraf Khalil besieged it and set up catapults against it until it was taken after twenty-five days, in Rajab 691 AH {cite:shadharat-dhahab p. 729}."
