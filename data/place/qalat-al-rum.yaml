summary:
  ar: "قلعة منيعة على الفرات مجاورة لقلعة البيرة، كانت داراً لكاثوليكوس الأرمن ومن تحت طاعة التتار؛ نازلها السلطان الملك الأشرف خليل ونصب عليها المجانيق حتى فُتحت بعد خمسة وعشرين يوماً في رجب سنة إحدى وتسعين وستمائة {cite:shadharat-dhahab p. 729}."
  en: "A strong fortress on the Euphrates beside the fortress of al-Bira. It had been a seat of the Catholicos of the Armenians and was under Tatar rule. The sultan al-Malik al-Ashraf Khalil besieged it and set up catapults against it until it was taken after twenty-five days, in Rajab 691 AH {cite:shadharat-dhahab p. 729}."
  es: "Una sólida fortaleza a orillas del Éufrates, junto a la fortaleza de al-Bira. Había sido sede del Catolicós de los armenios y estuvo bajo dominio tártaro. El sultán al-Malik al-Ashraf Khalil la asedió y emplazó catapultas contra ella hasta que fue tomada veinticinco días después, en Rajab del año 691 de la Hégira (cita: shadharat-dhahab, pág. 729)."
  fr: "Une puissante forteresse sur l'Euphrate, jouxtant celle d'al-Bira, avait été le siège du Catholicos des Arméniens et était alors sous domination tatare. Le sultan al-Malik al-Ashraf Khalil l'assiégea et y installa des catapultes jusqu'à sa prise, vingt-cinq jours plus tard, en Rajab 691 AH (source: shadharat-dhahab, p. 729)."
