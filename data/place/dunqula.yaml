summary:
  ar: "دار ملك النوبة وقراره، في غربي النيل على ضفته، وأهلها يشربون منه؛ وأهلها أحسن السودان وجوهاً وأجملهم شكلاً، وطعامهم الشعير والذرة {cite:nuzhat-al-mushtaq-2002 p. 37}."
  en: "The seat of the Nubian king, on the west bank of the Nile, where the residents drink from the river. The author says its people are the handsomest of the Sudan, and their food is barley and sorghum {cite:nuzhat-al-mushtaq-2002 p. 37}."
  es: "Sede del rey nubio, en la orilla occidental del Nilo, donde los habitantes beben del río. El autor afirma que su gente es la más hermosa de Sudán y que su alimento es la cebada y el sorgo {cite:nuzhat-al-mushtaq-2002 p. 37}."
  fr: "Siège du roi nubien, sur la rive ouest du Nil, où les habitants s'abreuvent à l'eau du fleuve. L'auteur affirme que ses habitants sont les plus beaux du Soudan et que leur nourriture est composée d'orge et de sorgho (Nuzhat al-Mushtaq, 2002, p. 37)."
  ur: "دریائے نیل کے مغربی کنارے پر نیوبین بادشاہ کی نشست، جہاں کے باشندے دریا سے پانی پیتے ہیں۔ مصنف کا کہنا ہے کہ اس کے لوگ سوڈان کے سب سے خوبصورت ہیں، اور ان کی خوراک جو اور جوار ہے۔ 37}۔"
