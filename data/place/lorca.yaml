summary:
  ar: "مدينة حصينة على ظهر جبل، لها أسواق وربض في أسفلها بسور، وفيها معادن تربة صفراء ومغرة؛ ويذكر المؤلف أنها تبعد عن مرسية أربعين ميلا. {cite:nuzhat-al-mushtaq-2002 p. 561}"
  en: "A fortified city on a mountain, with markets and a lower suburb walled below it, and with yellow earth and ochre deposits; the author gives its distance from Murcia as forty miles. {cite:nuzhat-al-mushtaq-2002 p. 561}"
  es: "Una ciudad fortificada en una montaña, con mercados y un suburbio amurallado a sus pies, y con tierra amarilla y depósitos de ocre; el autor indica que se encuentra a cuarenta millas de Murcia. {cite:nuzhat-al-mushtaq-2002 p. 561}"
  fr: "Une ville fortifiée sur une montagne, avec des marchés et une banlieue basse entourée de remparts, et caractérisée par une terre jaune et des gisements d'ocre; l'auteur indique une distance de quarante milles depuis Murcie. {cite:nuzhat-al-mushtaq-2002 p. 561}"
  ur: "ایک پہاڑ پر ایک قلعہ بند شہر، جس کے نیچے بازار اور ایک زیریں مضافاتی دیواریں، اور زرد زمین اور گیرو کے ذخائر کے ساتھ؛ مصنف مرسیا سے اس کا فاصلہ چالیس میل بتاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 561}"
  tr: "Dağın arkasında yer alan, pazarlar ve eteğinde bir duvar bulunan bir mahalle ile güçlendirilmiş bir şehir; yazar, Murcia'ya kırk mil uzaklıkta olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 561}"
  id: "Sebuah kota benteng di belakang gunung, dengan pasar dan sebuah kuartal di dasarnya yang berdinding berisi mineral tanah kuning dan oker; penulis menyebutkan bahwa kota ini berjarak empat puluh mil dari Murcia. {cite:nuzhat-al-mushtaq-2002 hlm. 561}"
