label:
  ar: الأناضول
  en: Anatolia (Asia Minor)
  es: "Anatolia (Asia Menor)"
  fr: "Anatolie (Asie Mineure)"
  ur: "اناطولیہ ⁦(ایشیا مائنر)⁩"
  tr: "Anadolu Ajansı"
  id: "Anadolu Agency"
summary:
  ar: شبه الجزيرة الجبلية الممتدة من الجنوب الآسيوي نحو أوروبا، وتُعرف في القديم بآسيا الصغرى؛ جسرٌ بين أوروبا الوسطى وغرب آسيا، سمّاها الجغرافيون العرب بلاد الروم، وتقع بين 36° و42° شمالًا و26° و45° شرقًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}.
  en: The mountainous peninsula projecting from Asia towards Europe, known in antiquity as Asia Minor and in Arab geography as Bilad al-Rum. It has been a bridge between Central Europe and Western Asia throughout its history {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}.
  es: "La península montañosa que se extiende desde Asia hacia Europa, conocida en la antigüedad como Asia Menor y en la geografía árabe como Bilad al-Rum. Ha sido un puente entre Europa Central y Asia Occidental a lo largo de su historia {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}."
  fr: "La péninsule montagneuse qui s'avance d'Asie vers l'Europe, connue dans l'Antiquité sous le nom d'Asie Mineure et en géographie arabe sous le nom de Bilad al-Rum, a constitué un pont entre l'Europe centrale et l'Asie occidentale tout au long de son histoire {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}."
  ur: "پہاڑی جزیرہ نما ایشیا سے یورپ کی طرف پیش قدمی کرتا ہے جسے قدیم زمانے میں ایشیا مائنر اور عرب جغرافیہ میں بلاد الروم کے نام سے جانا جاتا ہے۔ یہ اپنی پوری تاریخ میں وسطی یورپ اور مغربی ایشیا کے درمیان ایک پل رہا ہے۔ 1 ص۔ 483}۔"
  tr: "Güney Asya'dan Avrupa'ya uzanan dağlık yarımada, eskiden Anadolu; Orta Avrupa ile Batı Asya arasında bir köprü olan bu bölge, Arap coğrafyacılar tarafından Roma toprağı olarak adlandırılmıştır ve 36° ile 42° kuzey ile 26° ile 45° doğu arasında yer alır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 483}."
  id: "Semenanjung pegunungan yang membentang dari Asia Selatan menuju Eropa, sebelumnya dikenal sebagai Asia Kecil; sebuah jembatan antara Eropa Tengah dan Asia Barat, disebut tanah Roma oleh para ahli geografi Arab, dan terletak antara 36° dan 42° utara serta 26° dan 45° timur {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 483}."
