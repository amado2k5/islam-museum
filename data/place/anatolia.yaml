summary:
  ar: "شبه الجزيرة الجبلية الممتدة من الجنوب الآسيوي نحو أوروبا، وتُعرف في القديم بآسيا الصغرى؛ جسرٌ بين أوروبا الوسطى وغرب آسيا، سمّاها الجغرافيون العرب بلاد الروم، وتقع بين 36° و42° شمالًا و26° و45° شرقًا {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}."
  en: "The mountainous peninsula projecting from Asia towards Europe, known in antiquity as Asia Minor and in Arab geography as Bilad al-Rum. It has been a bridge between Central Europe and Western Asia throughout its history {cite:encyclopaedia-of-islam-2 vol. 1 p. 483}."
