  ur: "دور مغرب میں لامٹا، جو قرون وسطیٰ کے اسلامی دور میں کاغذ سازی کے لیے مشہور ہے - جو ملتان اور کابل کے درمیان لامٹا سے الگ ہے۔"
  tr: "Fas'ın en batısındaki Lamta, ortaçağ İslam döneminde kağıt üretimiyle ünlüydü ve Multan ile Kabil arasında yer alan Lamta'dan farklıdır."
  id: "Lamta di barat jauh Maroko terkenal dengan pembuatan kertas pada era Islam abad pertengahan, dan berbeda dengan Lamta yang terletak di antara Multan dan Kabul."
