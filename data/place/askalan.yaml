label: { ar: "عسقلان", en: "Ascalon", es: "Ascalón", fr: "Ascalon" }
summary:
  ar: "عسقلان من ساحل فلسطين؛ فتحها عمر بن الخطاب — وقيل عمرو بن العاص — صلحاً بعد كيد، ويقال إن عمرو كان فتحها ثم نقض أهلها وأمدّهم الروم ففتحها معاوية وأسكنها الروابط ووكّل بها الحفظة؛ وأخبر مشايخ من أهلها أن الروم أخربتها وأجلت أهلها عنها في أيام الزبير فلما ولي عبد الملك بن مروان بناها وحصنها؛ وبها قطائع أقطعت بأمر عمر وعثمان لو دخل فيها رجل لم يجد بذلك بأساً عند محمد بن يوسف الفاريابي، وأقطع عبد الملك رجلاً من العرب بها قطيعة ممن أقطع من المرابطة."
  en: "Ascalon on the Filastin coast; taken under Umar — some say by Amr ibn al-As — by treaty after stratagem, and it is said Amr had taken it before its people broke faith and the Byzantines reinforced them, so Mu'awiya retook it, settling ribat-fighters there and placing guards; shaykhs of its people reported the Byzantines ruined it and expelled its inhabitants in Ibn al-Zubayr's days, and Abd al-Malik rebuilt and fortified it; it holds land-grants made at Umar's and Uthman's command, which Muhammad ibn Yusuf al-Faryabi saw no harm in entering, and Abd al-Malik granted an Arab man an estate there among the murabita grants."
  es: "Ascalón, en la costa de Filastina, fue tomada bajo el reinado de Umar —algunos dicen que por Amr ibn al-As— mediante un tratado tras una estratagema. Se dice que Amr la había tomado antes de que su gente rompiera la fe y los bizantinos los reforzaran, por lo que Mu'awiya la retomó, asentando allí combatientes ribat y colocando guardias. Los jeques de su gente informaron que los bizantinos la arruinaron y expulsaron a sus habitantes en tiempos de Ibn al-Zubayr, y Abd al-Malik la reconstruyó y fortificó. Posee concesiones de tierras otorgadas por orden de Umar y Uthman, en las que Muhammad ibn Yusuf al-Faryabi no vio inconveniente en entrar, y Abd al-Malik otorgó a un hombre árabe una propiedad allí entre las concesiones murabita."
  fr: "Ascalon, sur la côte de Filastin, fut prise sous le règne d'Umar – certains disent par Amr ibn al-As – par traité après une ruse. On raconte qu'Amr s'en empara avant que ses habitants ne trahissent leur foi et que les Byzantins ne les renforcent. Mu'awiya la reprit alors, y installant des combattants du ribat et des gardes. Les cheikhs de sa population rapportèrent que les Byzantins la ravagèrent et en expulsèrent les habitants du temps d'Ibn al-Zubayr, et qu'Abd al-Malik la reconstruisit et la fortifia. Elle possédait des terres concédées sur ordre d'Umar et d'Uthman, que Muhammad ibn Yusuf al-Faryabi n'hésita pas à exploiter, et Abd al-Malik y octroya un domaine parmi les concessions de murabita."
