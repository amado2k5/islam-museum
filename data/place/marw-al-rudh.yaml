summary:
  ar: "مرو الروذ بلد في طغارستان من أعمال خراسان؛ حصرها الأحنف بن قيس بعد قتال شديد فاضطر أهلها إلى حصنهم وصالح مرزبانها وهو من ولد باذان صاحب اليمن أو ذا قرابة له على ستين ألفاً وقيل ستمائة ألف ومن حصونها قصر الأحنف الذي صالح أهله على ثلاثمائة ألف بشرط أن يدخل رجل من المسلمين القصر فيؤذن فيه ويقيم فيهم حتى ينصرف."
  en: "Marw al-Rudh of Tugharistan in Khurasan's works; besieged hard by al-Ahnaf till its folk took refuge in the fort and its marzban — of Badhan of Yemen's line — truced at sixty or six hundred thousand; its Qasr al-Ahnaf compounded at three hundred thousand on the clause that a Muslim enter, give the adhan, and stay till his return."
