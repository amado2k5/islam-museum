summary:
  ar: "مرو الروذ بلد في طغارستان من أعمال خراسان؛ حصرها الأحنف بن قيس بعد قتال شديد فاضطر أهلها إلى حصنهم وصالح مرزبانها وهو من ولد باذان صاحب اليمن أو ذا قرابة له على ستين ألفاً وقيل ستمائة ألف ومن حصونها قصر الأحنف الذي صالح أهله على ثلاثمائة ألف بشرط أن يدخل رجل من المسلمين القصر فيؤذن فيه ويقيم فيهم حتى ينصرف."
  en: "Marw al-Rudh of Tugharistan in Khurasan's works; besieged hard by al-Ahnaf till its folk took refuge in the fort and its marzban — of Badhan of Yemen's line — truced at sixty or six hundred thousand; its Qasr al-Ahnaf compounded at three hundred thousand on the clause that a Muslim enter, give the adhan, and stay till his return."
  es: "Marw al-Rudh de Tugharistán en las obras de Jorasán; asediado duramente por al-Ahnaf hasta que su gente se refugió en el fuerte y su marzban —de Badhan de la línea de Yemen— pactó una tregua de sesenta o seiscientos mil; su Qasr al-Ahnaf pagó un precio de trescientos mil con la condición de que un musulmán entrara, hiciera el adhan y permaneciera hasta su regreso."
  fr: "Marw al-Rudh de Tugharistan dans les œuvres de Khurasan; durement assiégé par al-Ahnaf jusqu'à ce que ses habitants se réfugient dans le fort et son marzban — de Badhan de la ligne du Yémen — trêve à soixante ou six cent mille; son Qasr al-Ahnaf a pactisé à trois cent mille sur la clause qu'un musulman entre, fasse l'adhan et reste jusqu'à son retour."
  ur: "خراسان کی تصانیف میں طغرستان کا مروۃ الرض؛ الاحناف کا سخت محاصرہ کیا یہاں تک کہ اس کے لوگوں نے قلعہ اور اس کے مرزبان میں پناہ لے لی - یمن کی لکیر کے بدھان - ساٹھ یا چھ لاکھ تک پہنچ گئے۔ اس کا قصر الاحناف اس شق پر تین لاکھ پر مشتمل ہے کہ مسلمان داخل ہو، اذان دے اور واپسی تک قیام کرے۔"
