summary:
  ar: "مدينة عامرة كبيرة، ذات كنائس معظمة، ويذكر المؤلف أنها تبعد عن قاون سبعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 887} {cite:nuzhat-al-mushtaq-2002 p. 888}."
  en: "A large, populous city with notable churches; the author gives seventy miles from Qāwun {cite:nuzhat-al-mushtaq-2002 p. 887} {cite:nuzhat-al-mushtaq-2002 p. 888}."
  es: "Una ciudad grande y populosa con iglesias notables; el autor da setenta millas de Qāwun {cite:nuzhat-al-mushtaq-2002 p. 887} {cite:nuzhat-al-mushtaq-2002 p. 888}."
  fr: "Une grande ville peuplée avec des églises remarquables; l'auteur donne soixante-dix miles de Qāwun {cite:nuzhat-al-mushtaq-2002 p. 887} {cite:nuzhat-al-mushtaq-2002 p. 888}."
  ur: "قابل ذکر گرجا گھروں کے ساتھ ایک بڑا، آبادی والا شہر؛ مصنف نے قوون سے ستر میل کا فاصلہ بیان کیا ہے۔ 887} {حوالہ: نزہت المشتاق-2002 ص۔ 888}۔"
  tr: "Büyük kiliselere sahip büyük ve refah içinde bir şehirdir ve yazar, Qawn'a yetmiş mil uzaklıkta olduğunu belirtmektedir {cite:nuzhat-al-mushtaq-2002 s. 887} {cite:nuzhat-al-mushtaq-2002 s. 888}."
  id: "Sebuah kota besar yang makmur dengan gereja-gereja besar, dan penulis menyebutkan bahwa kota ini berjarak tujuh puluh mil dari Qawn {cite:nuzhat-al-mushtaq-2002 hlm. 887} {cite:nuzhat-al-mushtaq-2002 hlm. 888}."
