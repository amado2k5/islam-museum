summary:
  ar: أردبيل من ممتلكات أذربيجان عند البلاذري؛ إليها انحازت الخزر بعد وقعة صحراء ورثان فواقعهم الجرّاح على أربعة فراسخ مما
    يلي أرمينية ثلاثة أيام حتى استشهد ومن معه فسُمّي نهرها نهر الجرّاح ونُسب جسر عليه إليه، وأتاه مسافر القصّاب مستخفياً فخرج
    معه قوم من الشراة.
  en: Ardabil, among Adharbayjan's holdings in al-Baladhuri; to it the Khazars withdrew after the Warthan-desert clash, and
    al-Jarrah fought them four farsakhs from Armenia's edge for three days until he was martyred with those with him — its
    river being named Nahr al-Jarrah and a bridge ascribed to him; and Musafir al-Qassab came to it in disguise, whence a
    body of Sharat went out with him.
  es: "Ardabil, una de las posesiones de Adharbayjan en al-Baladhuri; allí se retiraron los jázaros tras el enfrentamiento en el desierto de Warthan, y al-Jarrah luchó contra ellos a cuatro farsakhs del borde de Armenia durante tres días hasta que fue martirizado junto con los que estaban con él; su río recibió el nombre de Nahr al-Jarrah y un puente se le atribuye a él; y Musafir al-Qassab llegó allí disfrazado, desde donde salió con él un cuerpo de Sharat."
  fr: "Ardabil, parmi les possessions d'Adharbayjan dans al-Baladhuri; c'est là que les Khazars se retirèrent après l'affrontement du désert de Warthan, et al-Jarrah les combattit à quatre farsakhs de la frontière arménienne pendant trois jours jusqu'à ce qu'il soit martyrisé avec ses compagnons — sa rivière étant nommée Nahr al-Jarrah et un pont lui est attribué; et Musafir al-Qassab y vint déguisé, d'où un corps de Sharat sortit avec lui."
