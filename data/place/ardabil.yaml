summary:
  ar: أردبيل من ممتلكات أذربيجان عند البلاذري؛ إليها انحازت الخزر بعد وقعة صحراء ورثان فواقعهم الجرّاح على أربعة فراسخ مما يلي أرمينية ثلاثة أيام حتى استشهد ومن معه فسُمّي نهرها نهر الجرّاح ونُسب جسر عليه إليه، وأتاه مسافر القصّاب مستخفياً فخرج معه قوم من الشراة.
  en: Ardabil, among Adharbayjan's holdings in al-Baladhuri; to it the Khazars withdrew after the Warthan-desert clash, and al-Jarrah fought them four farsakhs from Armenia's edge for three days until he was martyred with those with him — its river being named Nahr al-Jarrah and a bridge ascribed to him; and Musafir al-Qassab came to it in disguise, whence a body of Sharat went out with him.
