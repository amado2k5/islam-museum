  ar: "مدينة مملكة الجلالقة وصفها المسعودي بجودة البنيان والأسوار، غزاها عبد الرحمن الناصر صاحب الأندلس في مائة ألف أو يزيدون فكانت الواقعة بينه وبين رذمير ملك الجلالقة في شوال سنة سبع وعشرين وثلاثمائة بعد الكسوف بثلاثة أيام، وكانت للمسلمين عليهم ثم أنابوا بعد أن حوصروا فقتل منهم نحو خمسين ألفاً {cite:muruj-al-dhahab p. 359-360}."
  en: "Chief town of the Jalaliqa realm, praised for its walls; al-Nasir's host of a hundred thousand met king Rudhmir there in Shawwal 327, three days after the eclipse — a Muslim victory turned rout costing some fifty thousand dead {cite:muruj-al-dhahab p. 359-360}."
