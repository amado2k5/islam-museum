summary:
  ar: "مدينة مملكة الجلالقة وصفها المسعودي بجودة البنيان والأسوار، غزاها عبد الرحمن الناصر صاحب الأندلس في مائة ألف أو يزيدون فكانت الواقعة بينه وبين رذمير ملك الجلالقة في شوال سنة سبع وعشرين وثلاثمائة بعد الكسوف بثلاثة أيام، وكانت للمسلمين عليهم ثم أنابوا بعد أن حوصروا فقتل منهم نحو خمسين ألفاً {cite:muruj-al-dhahab p. 359-360}."
  en: "Chief town of the Jalaliqa realm, praised for its walls; al-Nasir's host of a hundred thousand met king Rudhmir there in Shawwal 327, three days after the eclipse — a Muslim victory turned rout costing some fifty thousand dead {cite:muruj-al-dhahab p. 359-360}."
  es: "Ciudad principal del reino de Jalaliqa, elogiada por sus murallas; el ejército de al-Nasir, compuesto por cien mil hombres, se enfrentó allí al rey Rudhmir en Shawwal 327, tres días después del eclipse, una victoria musulmana que se convirtió en una derrota que costó unos cincuenta mil muertos {cite:muruj-al-dhahab p. 359-360}."
  fr: "Ville principale du royaume de Jalaliqa, louée pour ses murs; l'armée d'al-Nasir, forte de cent mille hommes, y rencontra le roi Rudhmir en Shawwal 327, trois jours après l'éclipse — une victoire musulmane transformée en déroute et coûtant quelque cinquante mille morts {cite:muruj-al-dhahab p. 359-360}."
  ur: "جلالیکہ دائرے کا چیف قصبہ، اس کی دیواروں کے لیے سراہا گیا؛ الناصر کے ایک لاکھ کے میزبان نے چاند گرہن کے تین دن بعد شوال 327 میں وہاں بادشاہ ردمیر سے ملاقات کی - مسلمانوں کی فتح میں تقریباً پچاس ہزار ہلاک ہوئے {حوالہ: مروج الذہب صفحہ۔ 359-360}۔"
