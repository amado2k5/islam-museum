id: place/jazirat-al-qamar
class: place
kind: island
label: { ar: "جزيرة القمر", en: "Island of the Moon", es: "Isla de la Luna", fr: "L'île de la Lune", ur: "چاند کا جزیرہ" }
summary:
  ar: "جزيرة طويلة تتصل بجزر الدبيحات، ويسكنها ملك يقيم في مدينة ملاي، ويذكر المؤلف أن طولها مع المشرق أربعة أشهر، ويتصل بجزر الصين من الجنوب، ويحجب الملك عن الناس إلا خدمه، وفيها زرع ونارجيل وقصب السكر {cite:nuzhat-al-mushtaq-2002 p. 71}."
  en: "A long island joined to the Dibihat group. Its king lives in the town of Malay. The author says it stretches four months' journey eastward, lies south of the Chinese islands, and that the king is seen only by his servants. It grows crops, coconuts and sugar cane {cite:nuzhat-al-mushtaq-2002 p. 71}."
  es: "Una isla alargada unida al grupo de islas Dibihat. Su rey reside en la ciudad de Malay. El autor afirma que se extiende cuatro meses de viaje hacia el este, se encuentra al sur de las islas chinas y que solo sus sirvientes pueden ver al rey. En ella se cultivan cereales, cocos y caña de azúcar {cite:nuzhat-al-mushtaq-2002 p. 71}."
  fr: "Une île allongée rattachée à l'archipel de Dibihat. Son roi réside dans la ville de Malay. L'auteur précise qu'elle s'étend sur quatre mois de voyage vers l'est, se situe au sud des îles chinoises, et que le roi n'est vu que par ses serviteurs. On y cultive des céréales, des noix de coco et de la canne à sucre (Nuzhat al-Mushtaq, 2002, p. 71)."
  ur: "ایک لمبا جزیرہ دبیہات گروپ میں شامل ہو گیا۔ اس کا بادشاہ مالے کے قصبے میں رہتا ہے۔ مصنف کا کہنا ہے کہ یہ مشرق کی طرف چار ماہ کا سفر طے کرتا ہے، چینی جزیروں کے جنوب میں واقع ہے، اور بادشاہ کو صرف اس کے نوکر ہی دیکھتے ہیں۔ یہ فصلیں، ناریل اور گنے اگاتا ہے {حوالہ: نزہت المشتاق-2002 ص 71}۔"
