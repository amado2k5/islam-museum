label: { ar: "جزيرة القمر", en: "Island of the Moon" }
summary:
  ar: "جزيرة طويلة تتصل بجزر الدبيحات، ويسكنها ملك يقيم في مدينة ملاي، ويذكر المؤلف أن طولها مع المشرق أربعة أشهر، ويتصل بجزر الصين من الجنوب، ويحجب الملك عن الناس إلا خدمه، وفيها زرع ونارجيل وقصب السكر {cite:nuzhat-al-mushtaq-2002 p. 71}."
  en: "A long island joined to the Dibihat group. Its king lives in the town of Malay. The author says it stretches four months' journey eastward, lies south of the Chinese islands, and that the king is seen only by his servants. It grows crops, coconuts and sugar cane {cite:nuzhat-al-mushtaq-2002 p. 71}."
