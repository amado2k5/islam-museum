label: { ar: "خليج البنادقة ⁦(الأدرياتيكي)⁩", en: "The Venetian gulf (Adriatic)", es: "El golfo de Venecia (Adriático)", fr: "Le golfe de Venise (Adriatique)", ur: "وینیشین خلیج (Adriatic)" }
summary:
  ar: "أحد خليجين يتفرعان من البحر الشامي، يبدأ من شرق قلورية عند أذرنت ويمر شمالاً ثم بساحل البنادقة، طوله نحو ألف ومائة ميل، وفيه نحو خمس عشرة جزيرة {cite:nuzhat-al-mushtaq-2002 p. 11}."
  en: "One of two gulfs branching from the Syrian sea. It starts east of Calabria near Adrat, runs north along the Venetian shore, and is about 1,100 miles long with some fifteen islands {cite:nuzhat-al-mushtaq-2002 p. 11}."
  es: "Uno de los dos golfos que se ramifican desde el mar de Siria. Comienza al este de Calabria, cerca de Adrat, se extiende hacia el norte a lo largo de la costa veneciana y tiene aproximadamente 1100 millas de largo con unas quince islas {cite:nuzhat-al-mushtaq-2002 p. 11}."
  fr: "L'un des deux golfes se ramifiant de la mer de Syrie. Il commence à l'est de la Calabre, près d'Adrat, s'étend vers le nord le long de la côte vénitienne et mesure environ 1 100 milles de long et compte une quinzaine d'îles {cite: nuzhat-al-mushtaq-2002 p. 11}."
  ur: "شام کے سمندر سے نکلنے والی دو خلیجوں میں سے ایک۔ یہ کلابریا کے مشرق میں ادرات کے قریب شروع ہوتا ہے، وینس کے ساحل کے ساتھ شمال میں چلتا ہے، اور تقریباً 1100 میل لمبا ہے جس میں تقریباً پندرہ جزائر ہیں۔ 11}۔"
