label: { ar: "إفريقية", en: "Ifriqiya", es: "Ifriqiya", fr: "Ifriqiya", ur: "افریقیہ", tr: "Afrikalı", id: "Afrika" }
summary:
  ar: "إفريقية إقليم المغرب بين أطرابلس وطنجة؛ قال ابن الكلبي كان إفريقيس بن قيس بن صيفي الحميري غلب عليها في الجاهلية فسمّيت به وهو قتل جرجير ملكها فقال للبرابرة ما أكثر بربرة هؤلاء فسُمّوا البرابرة؛ غزاها عبد الله بن سعد بن أبي سرح في خلافة عثمان فقتل بطريقها بمقوبة وصالحه عظماؤها على ثلاثمائة قنطار من ذهب، ثم افتتحها عقبة بن نافع واختطّ قيروانها."
  en: "Ifriqiya, the Maghreb province between Tripoli and Tangier; Ibn al-Kalbi says Ifriqis ibn Qays ibn Sayfi al-Himyari held it in the Jahiliyya and it was named for him — he killed its king Jurjir and said of the Barabira 'how barbarous these folk', whence they were called al-Barabira; Abdallah ibn Sa'd ibn Abi Sarh raided it under Uthman, killed its patrikios at Sbejtla and took its grandees' three hundred qintar of gold, then Uqba ibn Nafi' opened it and laid out its Qayrawan."
  es: "Ifriqiya, la provincia del Magreb entre Trípoli y Tánger; Ibn al-Kalbi dice que Ifriqis ibn Qays ibn Sayfi al-Himyari lo retuvo en la Jahiliyya y recibió su nombre: mató a su rey Jurjir y dijo de los Barabira \"qué bárbaros son estos pueblos\", de donde fueron llamados al-Barabira; Abdallah ibn Sa'd ibn Abi Sarh lo atacó bajo Uthman, mató a sus patrikios en Sbejtla y tomó los trescientos qintars de oro de sus grandes, luego Uqba ibn Nafi' lo abrió y dispuso su Qayrawan."
  fr: "l'Ifriqiya, la province du Maghreb entre Tripoli et Tanger; Ibn al-Kalbi dit que Ifriqis ibn Qays ibn Sayfi al-Himyari l'a détenu dans la Jahiliyya et qu'il a été nommé en son honneur - il a tué son roi Jurjir et a dit des Barabira \"comme ces gens sont barbares\", d'où ils ont été appelés al-Barabira; Abdallah ibn Sa'd ibn Abi Sarh l'a attaqué sous Uthman, a tué ses patrices à Sbejtla et a pris les trois cents quintars d'or de ses grands, puis Uqba ibn Nafi' l'a ouvert et a aménagé son Qayrawan."
  ur: "افریقیہ، طرابلس اور تانگیر کے درمیان مغرب کا صوبہ؛ ابن الکلبی کہتے ہیں کہ عفریقیس بن قیس بن سیفی الحمیری نے اسے جاہلیت میں رکھا تھا اور اس کا نام اس کے نام پر رکھا گیا تھا - اس نے اس کے بادشاہ جرجیر کو قتل کر دیا تھا اور بربیرا کے بارے میں کہا تھا کہ یہ لوگ کتنے وحشی ہیں، جہاں سے انہیں البرابیرہ کہا جاتا ہے۔ عبداللہ بن سعد ابن ابی سرح نے عثمان کی قیادت میں اس پر چڑھائی کی، سبجتلہ میں اس کے سرپرستوں کو قتل کیا اور اس کے بزرگوں کا تین سو قنطار سونا لے لیا، پھر عقبہ بن نافع نے اسے کھولا اور اس کا قیروان بچھا دیا۔"
  tr: "İfrikiye, Mağrip'in Trablus ile Tanca arasındaki bölgesidir; İbn el-Kalbi şöyle demiştir: İfrikisler ibn Kays ibn Seyfi el-Himyari, İslam öncesi dönemde buraya hükmetmişti, bu yüzden onun adını almıştır. Kral Cerrah'i öldürdü ve Berberile, 'Bunlar kaç Berberi' dedi, bu yüzden onlara 'Berberiler' dediler. Abdullah ibn Sa'd bin Ebi Sarh, Osman halifeliği sırasında buraya baskın düzenledi, Mavube'de yolda öldürüldü ve büyük adamları üç yüz sentil altınla barıştırdı. Sonra Uqbah bin Nafi' burayı fethetti ve Kairuan'ı fethetti."
  id: "Ifriqiya adalah wilayah Maghreb antara Tripoli dan Tangier; Ibn al-Kalbi berkata: Ifriqis ibn Qays ibn Saifi al-Himyari menguasainya pada era pra-Islam, sehingga wilayah itu dinamai menurut namanya. Ia membunuh rajanya, Jarjir, dan berkata kepada bangsa Berber, 'Berapa banyak orang Berber ini,' sehingga mereka menyebut mereka 'orang Berber.' Abdullah ibn Sa'd ibn Abi Sarh menyerbu wilayah ini selama kekhalifahan Uthman, terbunuh dalam perjalanan di Maqoubah, dan para tokohnya mendamaikannya dengan tiga ratus kuintal emas. Kemudian Uqbah ibn Nafi' menaklukkannya dan menaklukkan Kairouan."
