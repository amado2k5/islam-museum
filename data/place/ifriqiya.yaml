label: { ar: "إفريقية", en: "Ifriqiya" }
summary:
  ar: "إفريقية إقليم المغرب بين أطرابلس وطنجة؛ قال ابن الكلبي كان إفريقيس بن قيس بن صيفي الحميري غلب عليها في الجاهلية فسمّيت به وهو قتل جرجير ملكها فقال للبرابرة ما أكثر بربرة هؤلاء فسُمّوا البرابرة؛ غزاها عبد الله بن سعد بن أبي سرح في خلافة عثمان فقتل بطريقها بمقوبة وصالحه عظماؤها على ثلاثمائة قنطار من ذهب، ثم افتتحها عقبة بن نافع واختطّ قيروانها."
  en: "Ifriqiya, the Maghreb province between Tripoli and Tangier; Ibn al-Kalbi says Ifriqis ibn Qays ibn Sayfi al-Himyari held it in the Jahiliyya and it was named for him — he killed its king Jurjir and said of the Barabira 'how barbarous these folk', whence they were called al-Barabira; Abdallah ibn Sa'd ibn Abi Sarh raided it under Uthman, killed its patrikios at Sbejtla and took its grandees' three hundred qintar of gold, then Uqba ibn Nafi' opened it and laid out its Qayrawan."
