summary:
  ar: "مدينة في أرض برغونية اللمانيين، على غربي نهر رين، ويذكر المؤلف أن بينها وبين إشبيرة خمسين ميلا {cite:nuzhat-al-mushtaq-2002 p. 867}."
  en: "A city in the land of the Burgundians of the Germans, on the western bank of the Rhine; the author gives fifty miles between it and Ishbira {cite:nuzhat-al-mushtaq-2002 p. 867}."
  es: "Una ciudad en la tierra de los borgoñones de los alemanes, en la orilla occidental del Rin; el autor da cincuenta millas entre ella e Ishbira {cite:nuzhat-al-mushtaq-2002 p. 867}."
  fr: "Une ville située au pays des Bourguignons des Allemands, sur la rive ouest du Rhin; l'auteur indique cinquante milles entre elle et Ishbira {cite:nuzhat-al-mushtaq-2002 p. 867}."
  ur: "رائن کے مغربی کنارے پر جرمنوں کے برگنڈیوں کی سرزمین میں ایک شہر؛ مصنف نے اس کے اور اشبیرہ کے درمیان پچاس میل کا فاصلہ بتایا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 867}۔"
  tr: "Burgonya'da, Ren Nehri'nin batısında, Almanların topraklarında bir şehirdir ve yazar buranın Ishira'ya elli mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 867}."
  id: "Sebuah kota di tanah Jerman di Burgundy, sebelah barat Sungai Rhein, dan penulis menyebutkan bahwa kota ini berjarak lima puluh mil dari Ischira {cite:Nuzhat-al-mushtaq-2002, hlm. 867}."
