summary:
  ar: "من بلاد أرمينية الأولى؛ عاور أهلها حبيب بن مسلمة فهزمهم وغلب على ويص وصالح أهل قلاعها على خراج يؤدونه، ومنها سُبيت أم يزيد بنت أسيد بنت بطريقها في غزاة محمد بن مروان."
  en: "of the first Armenia's lands; its people fought Habib ibn Maslama, who routed them, took Ways and compounded with its castle-folk for kharaj; from it Umm Yazid bint Usid, daughter of its patrikios, was taken captive in Muhammad ibn Marwan's campaign."
  es: "de las tierras de la primera Armenia; su gente luchó contra Habib ibn Maslama, quien los derrotó, tomó Caminos y se unió a la gente de su castillo para formar un kharaj; de allí, Umm Yazid bint Usid, hija de su patricio, fue hecha cautiva en la campaña de Muhammad ibn Marwan."
  fr: "des terres de la première Arménie; son peuple combattit Habib ibn Maslama, qui les mit en déroute, prit Ways et s'allia avec les habitants de son château pour former le kharaj; de là, Umm Yazid bint Usid, fille de ses patrikios, fut faite captive lors de la campagne de Muhammad ibn Marwan."
  ur: "پہلے آرمینیا کی زمینوں میں سے؛ اس کے لوگوں نے حبیب بن مسلمہ سے جنگ کی، جنہوں نے ان کو شکست دی، راستے اختیار کیے اور اس کے قلعے والوں کے ساتھ خرج کے لیے مل گئے۔ اس میں سے ام یزید بنت اسید جو کہ اس کے سرپرستوں کی بیٹی تھیں، محمد بن مروان کی مہم میں اسیر ہو گئیں۔"
  tr: "Ermenistan'ın ilk topraklarından itibaren; halkı Habib ibn Maslama tarafından saldırıya uğradı; Habib onları yendi ve Weis'i mağlup etti; bu sırada kalelerindeki Saleh halkı vergi topladı. Bunlar arasında, Muhammed bin Mervan'ın seferleri sırasında yol alan um Yazid bint Asid bint Sabat da vardı."
  id: "Sejak tanah awal Armenia; rakyatnya diserang oleh Habib ibn Maslama, yang mengalahkan mereka dan mengalahkan Weis, sementara Saleh Saleh, penduduk benteng-bentengnya memungut pajak untuk membayar. Di antara mereka adalah um Yazid bint Asid bint Sabat dalam perjalanan selama ekspedisi Muhammad ibn Marwan."
