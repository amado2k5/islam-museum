  en: "A large town with a wide district, named for the whiteness of its palaces; its people are well off and dress like the Iraqis; twenty-four miles from Sahak. {cite:nuzhat-al-mushtaq-2002 p. 432}"
  es: "Una ciudad grande con un distrito extenso, llamada así por la blancura de sus palacios; sus habitantes son acomodados y visten como los iraquíes; a veinticuatro millas de Sahak. {cite:nuzhat-al-mushtaq-2002 p. 432}"
  fr: "Une grande ville dotée d'un vaste quartier, ainsi nommée en raison de la blancheur de ses palais; ses habitants sont aisés et s'habillent comme les Irakiens; à vingt-quatre milles de Sahak. {cite:nuzhat-al-mushtaq-2002 p. 432}"
