summary:
  ar: "شلب من مدن غرب الأندلس، وتسمى أعمالها كورة أكشونبة المتصلة بكورة أشبونة، وهي قاعدة جليلة لها مدن ومعاقل ودار ملكها قاعدة شلب {cite:nafh-tib-maqqari p. 200}."
  en: "Silves (Shalb) — capital of the Kura of Ossonoba in western al-Andalus, 'a fine seat with towns and strongholds' beside Lisbon's district {cite:nafh-tib-maqqari p. 200}."
  es: "Silves (Shalb) — capital de la Kura de Ossonoba en el oeste de al-Ándalus, 'un hermoso enclave con pueblos y fortalezas' junto al distrito de Lisboa {cite:nafh-tib-maqqari p. 200}."
  fr: "Silves (Shalb) — capitale de la Kura d'Ossonoba dans l'ouest d'al-Andalus, « un beau siège avec des villes et des forteresses » à côté du district de Lisbonne {cite:nafh-tib-maqqari p. 200}."
  ur: "سلوز ⁦(شلب)⁩ - مغربی الاندلس میں اوسونوبا کے کورا کا دارالحکومت، لزبن کے ضلع کے ساتھ 'شہروں اور مضبوط قلعوں کے ساتھ ایک عمدہ نشست' 200}۔"
  tr: "Shalb, batı Endülüs'ün şehirlerinden biridir ve binaları Kora Akshunba olarak adlandırılır, Kora Ashbona ile bağlantılıdır. Şehirleri ve kaleleri olan soylu bir üssüdür ve kralı Shalb'ın merkezidir {cite:nafh-tib-maqqari, s. 200}."
  id: "Shalb adalah salah satu kota di Andalusia barat, dan bangunannya disebut Kora Akshunba, yang terhubung dengan Kora Ashbona. Ini adalah markas bangsawan dengan kota dan benteng, dan rajanya adalah markas Shalb {cite:nafh-tib-maqqari, hlm. 200}."
