summary:
  ar: "مدينة كانت مشهورة قبل المرية، انتقل أهلها إلى المرية فعمرت هي وخربت بجانة، ولم يبق منها إلا آثار البنيان ومسجد جامعها القائم، وحولها جنات وبساتين. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  en: "A city that was famous before Almeria; its people moved to Almeria, which grew while Vera declined, leaving only traces of buildings and its standing congregational mosque, with gardens and orchards around it. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  es: "Una ciudad que fue famosa antes que Almería; sus habitantes se trasladaron a Almería, que creció mientras Vera declinaba, dejando solo vestigios de edificios y su mezquita congregacional en pie, rodeada de jardines y huertos. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  fr: "Une ville autrefois célèbre avant Almeria; ses habitants s’installèrent à Almeria, qui prospéra tandis que Vera déclinait, ne laissant derrière elle que des vestiges de bâtiments et sa mosquée du vendredi, entourée de jardins et de vergers. {cite:nuzhat-al-mushtaq-2002 p. 566}"
  ur: "ایک شہر جو المیریا سے پہلے مشہور تھا۔ اس کے لوگ المیریا منتقل ہو گئے، جو بڑھتا گیا جب کہ ویرا نے انکار کر دیا، صرف عمارتوں اور اس کی کھڑی اجتماعی مسجد کے نشانات رہ گئے، اس کے ارد گرد باغات اور باغات تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 566}"
  tr: "Almeria'dan önce ünlü olan bir şehir. Halkı Almeria'ya taşındı, burası yeniden inşa edildi ve harabe oldu. Sadece yapısının ve caminin kalıntıları, bahçeler ve meyve bahçeleriyle çevrili olarak kalmıştır. {kaynak:nuzhat-al-mushtaq-2002 s. 566}"
  id: "Sebuah kota yang terkenal sebelum Almeria. Penduduknya pindah ke Almeria, yang kemudian dibangun kembali dan hancur. Hanya sisa struktur dan masjidnya yang tersisa, dikelilingi oleh taman dan kebun buah. {cite:nuzhat-al-mushtaq-2002 hlm. 566}"
