summary:
  ar: مدينة عثمانية في الهرسك على نهر نيريتفا، اشتهرت بجسرها العتيق «ستاري موست» من القرن السادس عشر ومدارسها وأحيائها المسلمة؛ دُمرت في حرب التسعينيات ثم أُعيد بناؤها.
  en: Ottoman city of Herzegovina on the Neretva, famous for its sixteenth-century bridge Stari Most and its madrasas and Muslim quarters; devastated in the 1990s war and rebuilt.
