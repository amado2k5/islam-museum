summary:
  ar: مدينة عثمانية في الهرسك على نهر نيريتفا، اشتهرت بجسرها العتيق «ستاري موست» من القرن السادس عشر ومدارسها وأحيائها المسلمة؛ دُمرت في حرب التسعينيات ثم أُعيد بناؤها.
  en: Ottoman city of Herzegovina on the Neretva, famous for its sixteenth-century bridge Stari Most and its madrasas and Muslim quarters; devastated in the 1990s war and rebuilt.
  ur: ہرتسگوینا کا عثمانی شہر دریائے نیریتوا پر، اپنے سولہویں صدی کے پل ستاری موست اور مدارس کے لیے مشہور؛ نوے کی دہائی کی جنگ میں تباہ ہوا اور دوبارہ تعمیر ہوا۔
  es: "Ciudad otomana de Herzegovina a orillas del Neretva, famosa por su puente Stari Most del siglo XVI, sus madrasas y sus barrios musulmanes; devastada en la guerra de los años noventa y reconstruida."
  fr: "Ville ottomane d'Herzégovine sur la Neretva, célèbre pour son pont Stari Most du XVIe siècle, ses madrasas et ses quartiers musulmans; dévastée lors de la guerre des années 1990 et reconstruite."
  tr: "Hersek'te Neretva Nehri üzerinde yer alan Osmanlı şehri, antik 16. yüzyıl 'Stari Most' köprüsü, okulları ve Müslüman mahalleleriyle ünlü; 1990'lar savaşında yıkılmış ve ardından yeniden inşa edilmiştir."
  id: "Sebuah kota Ottoman di Herzegovina di Sungai Neretva, terkenal dengan jembatan kuno abad ke-16 'Stari Most', sekolah-sekolahnya, dan lingkungan Muslimnya; kota ini hancur dalam perang tahun 1990-an dan kemudian dibangun kembali."
