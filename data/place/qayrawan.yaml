education:
  did_you_know:
    ar: "اختطّ عقبة بن نافع القيروان في موضع غيضة ذات طرقاء، وبنى جامعها في موقف المؤذن الذي رآه في منامه كما يروي البلاذري."
    en: "Uqba ibn Nafi' laid out Kairouan on a site of thorny thicket, and built its congregational mosque where the muezzin he had seen in a dream was standing, al-Baladhuri relates."
    ur: "عقبہ بن نافع نے قیروان کو کانٹے دار جھاڑی کی جگہ پر آباد کیا اور اس کی جامع مسجد اس مقام پر بنائی جہاں خواب میں دیکھے مؤذن کھڑے تھے، جیسا کہ بلاذری روایت کرتا ہے۔"
    sources: [source/futuh-buldan-maarif-1407, source/ahsan-al-taqasim]
