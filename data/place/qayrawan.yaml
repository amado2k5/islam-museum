summary:
  ar: "القيروان مدينة في وسط تونس بدأت قاعدة عسكرية على يد العرب الفاتحين، ويُنسب تأسيسها إلى عقبة بن نافع سنة 50هـ/670م، وصارت حاضرة إفريقية وأقدم المدن الإسلامية وأعرقها في الغرب الإسلامي. بلغت ذروتها في عهد الأغالبة، وكان جامعها الكبير ومدرسة الفقه المالكي فيها، ومنها مدونة سحنون، من أبرز معالمها. ثم تراجعت تراجعاً حاداً بعد انتقال الخلافة الفاطمية إلى القاهرة وغزو بني هلال في منتصف القرن الخامس الهجري، وبقيت بلدة معظّمة."
  en: "Qayrawan is a town in central Tunisia that began as an Arab military base, traditionally founded by Uqba ibn Nafi' in 50/670, and became the capital of Ifriqiya and the oldest and most prestigious Muslim city of the Islamic West. It peaked under the Aghlabids, with its Great Mosque and a school of Maliki law that includes Sahnun's Mudawwana among its landmarks. It declined sharply after the Fatimid move to Cairo and the Banu Hilal invasion in the mid-5th/11th century, and remained a revered town."
  ur: "قیروان وسطی تونس کا ایک شہر ہے جو عرب فاتحین کی فوجی چھاؤنی کے طور پر شروع ہوا، روایت کے مطابق 50ھ/670ء میں عقبہ بن نافع نے اس کی بنیاد رکھی، اور یہ افریقیہ کا دارالحکومت اور اسلامی مغرب کا سب سے قدیم اور باوقار مسلم شہر بنا۔ اغلبی دور میں یہ عروج پر پہنچا، اس کی جامع مسجد اور مالکی فقہ کا مدرسہ، جس میں سحنون کی مدونہ شامل ہے، اس کی نمایاں علامتیں ہیں۔ فاطمی خلافت کے قاہرہ منتقل ہونے اور پانچویں صدی ہجری کے وسط میں بنو ہلال کے حملے کے بعد یہ تیزی سے زوال پذیر ہوا اور ایک محترم قصبہ بنا رہا۔"
