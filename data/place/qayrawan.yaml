label: { ar: "القيروان", en: "Qayrawan" }
summary:
  ar: "القيروان مصر إفريقية؛ اختطّها عقبة بن نافع الفهري وكان موضعها غيضة ذات طرقاء وشجر لا تُرام من السباع والحيات والمقارب القتالة فدعا ربه فأذهب ذلك كله ثم بنى وبنى الناس معه الدور والمساكن وبنى مسجدها الجامع وكان قد أُري في منامه كأن رجلاً أذّن في موضع مئذنته فبنى المنائر في موقف الرجل؛ ورمّها ورمّ مسجدها محمد بن الأشعث الخزاعي في ولايته لأبي العباس. ورأى المقدسي جامعها نحو 375هـ فعدّه أكبر من جامع ابن طولون مفروشاً بالرخام ومزاريبه رصاص، وللمدينة خمسة عشر درباً منها درب الربيع ودرب تونس ودرب نافع {cite:ahsan-al-taqasim pp. 180-181}."
  en: "Qayrawan, the garrison-city of Ifriqiya; Uqba ibn Nafi' al-Fihri laid it out on a thicket-site of trees unapproachable for beasts, snakes and deadly vermin — praying to his Lord until all that was removed, the very beasts fleeing with their young — then built, the people building houses and dwellings with him, and built its congregational mosque, having seen in a dream a man giving the call to prayer where its minaret stood, so he built the minarets on the man's station; and Muhammad ibn al-Ash'ath al-Khuza'i repaired the city and its mosque in his governorship for Abu al-Abbas."
