summary:
  ar: "سوق الأهواز مدينة بأرض الأهواز؛ غزاها المغيرة بن شعبة في ولايته فصالحه دهقانها بيروز على مال ثم نكث فافتتحها أبو موسى الأشعري عنوة سنة ١٧ وولاها سمرة بن جندب الفزاري."
  en: "Suq al-Ahwaz, the chief town of al-Ahwaz — al-Mughira ibn Shu'ba raided it, its dahqan Piruz truced on money then broke, and Abu Musa took it by force in 17h under Samura ibn Jundab al-Fazari."
  es: "Suq al-Ahwaz, la ciudad principal de al-Ahwaz: al-Mughira ibn Shu'ba la asaltó, su dahqan Piruz hizo una tregua sobre el dinero y luego se rompió, y Abu Musa la tomó por la fuerza en 17 h bajo el mando de Samura ibn Jundab al-Fazari."
  fr: "Suq al-Ahwaz, le chef-lieu d'al-Ahwaz — al-Mughira ibn Shu'ba l'a attaqué, son dahqan Piruz a conclu une trêve sur l'argent puis a fait faillite, et Abu Musa l'a pris de force en 17h sous Samura ibn Jundab al-Fazari."
  ur: "الاہواز کے اہم قصبے سق الاحواز - المغیرہ ابن شعبہ نے اس پر چھاپہ مارا، اس کے دہقان پیروز نے رقم پر اعتماد کیا اور پھر ٹوٹ گیا، اور ابو موسی نے سمرہ بن جندب الفزاری کے ماتحت 17ھ میں اسے زبردستی لے لیا۔"
  tr: "Ahvaz pazarı, Ahvaz topraklarında bir şehirdir; el-Muğira bin Şube tarafından onun yönetimi sırasında fethedilmiş ve köylüsü Bayruz tarafından servet yüzünden barıştırılmış, ardından o da kaçmıştır. Ebu Musa el-Eş'ari 17 Hicri yılında burayı zorla fethetmiş ve Samura ibn Jundub el-Fazari tarafından atamıştır."
  id: "Pasar Ahvaz adalah sebuah kota di tanah Ahvaz; kota ini ditaklukkan oleh al-Mughira ibn Shu'bah selama pemerintahannya, dan petaninya didamaikan oleh Bayruz atas kekayaan, lalu ia membelot. Abu Musa al-Ash'ari menaklukkannya secara paksa pada tahun 17 H, dan Samura ibn Jundub al-Fazari mengangkatnya."
