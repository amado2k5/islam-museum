summary:
  ar: "مدينة حصينة بالأندلس على نهر تاجه قرب مصبه، صارت بيد الإفرنج سنة 543 للهجرة بحسب ياقوت. {cite:mujam-al-buldan-sader-1995 3 p.367}"
  en: "A fortified city of al-Andalus on the Tagus near its mouth; Yaqut writes that it was held by the Franks from 543 AH. {cite:mujam-al-buldan-sader-1995 3 p.367}"
  es: "Una ciudad fortificada de al-Ándalus a orillas del Tajo, cerca de su desembocadura; Yaqut escribe que estuvo en manos de los francos desde el año 543 de la Hégira. {cite:mujam-al-buldan-sader-1995 3 p.367}"
  fr: "Ville fortifiée d'al-Andalus sur le Tage, près de son embouchure; Yaqut écrit qu'elle fut occupée par les Francs à partir de 543 AH. {cite:Mujam al-Buldan-Sader-1995 3 p.367}"
  ur: "اس کے منہ کے قریب Tagus پر الندلس کا ایک قلعہ بند شہر؛ یاقوت لکھتے ہیں کہ یہ 543ھ سے فرینکوں کے پاس تھا۔ {حوالہ: معجم البلدان الصدر 1995 3 صفحہ 367}"
  tr: "Endülüs'te, ağzına yakın Taja Nehri üzerinde surlu bir şehir olan bu şehir, Yaqut'a göre 543 Hicri yılında Frankların kontrolüne girmiştir. {kaynak:Mujam-al-Buldan-Sader-1995 3 s.367}"
  id: "Kota benteng ini terletak di al-Andalus di Sungai Taja dekat muaranya, kota ini berada di bawah kendali bangsa Franka pada tahun 543 H menurut Yaqut. {cite:mujam-al-buldan-sader-1995 3 hlm.367}"
