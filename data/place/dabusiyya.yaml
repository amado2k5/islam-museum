summary:
  ar: "مدينة حسنة كثيرة البساتين، عليها سور من تراب، وبها مياه جارية وعمارات حسنة، وتقع في طريق سمرقند. {cite:nuzhat-al-mushtaq-2002 p. 497}"
  en: "A fine town of many orchards with an earthen wall, running water and handsome buildings, on the road to Samarqand. {cite:nuzhat-al-mushtaq-2002 p. 497}"
  es: "Un hermoso pueblo con numerosos huertos, una muralla de tierra, agua corriente y edificios elegantes, en el camino a Samarcanda. {cite:nuzhat-al-mushtaq-2002 p. 497}"
  fr: "Une jolie ville aux nombreux vergers, entourée de remparts de terre, dotée d'eau courante et de beaux bâtiments, sur la route de Samarcande. {cite:nuzhat-al-mushtaq-2002 p. 497}"
  ur: "بہت سے باغات کا ایک عمدہ شہر جس میں مٹی کی دیوار، بہتا ہوا پانی اور خوبصورت عمارتیں، سمرقند کی سڑک پر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 497}"
  tr: "Bahçelerle dolu, toprak duvarı, akan su ve güzel binaları olan, Semerkand'daki yol üzerinde yer alan güzel bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 497}"
  id: "Sebuah kota indah penuh kebun buah, dengan tembok tanah, air mengalir, dan bangunan-bangunan indah, terletak di jalan Samarkand. {cite:nuzhat-al-mushtaq-2002 hlm. 497}"
