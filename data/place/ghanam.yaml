summary:
  ar: "جزيرة كبيرة في البحر الغربي، تليها جزر صغيرة لا يحصى عددها، يذكر الإدريسي أنها يعرفها المغررون الذين زاروها، وفيها طيور تأكلها الحيوانات البحرية. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  en: "A large island in the western sea, followed by countless small islands known to sailors who visited them; birds there are said to be eaten by sea creatures. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  es: "Una gran isla en el mar occidental, seguida de innumerables islas pequeñas conocidas por los marineros que las visitaron; se dice que las aves de allí son devoradas por criaturas marinas. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  fr: "Une grande île de la mer occidentale, suivie d'innombrables petites îles connues des marins qui les visitaient; on dit que les oiseaux qui y vivent sont la proie des créatures marines. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  ur: "مغربی سمندر میں ایک بڑا جزیرہ، اس کے بعد ان گنت چھوٹے جزیرے جو ملاحوں کے لیے جانا جاتا ہے جو ان کا دورہ کرتے تھے۔ کہا جاتا ہے کہ وہاں کے پرندے سمندری مخلوق کھاتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 220}"
