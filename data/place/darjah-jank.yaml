  tr: "Basra'daki Jink derecesi Thaqif'in zenginliğinden kaynaklanır, ancak ona içinde yaşanan anlaşmazlıklar nedeniyle söylenmiştir ve Farsça'da Jinak bir kargaşa olmuştu."
  id: "Derajat Jink di Basra berasal dari kekayaan Thaqif, tetapi dikatakan kepadanya karena perselisihan yang ada dalam dirinya, dan dalam bahasa Persia, Jinak menjadi keributan."
