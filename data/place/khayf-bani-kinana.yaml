  en: "The ravine (shi'b) of al-Safi in Makkah, also called Khayf Bani Kinana. There the Prophet said to the Quraysh: “Your meeting place is Khayf Bani Kinana.” It is the al-Muhassab, where pilgrims halt after Mina (al-Azraqi, pp. 743–744 and 920 of the scan)."
