summary:
  ar: "شعب الصفي بمكة، ويُسمّى أيضاً خيف بني كنانة، وفيه قال النبي لقريش: موعدكم خيف بني كنانة، وهو المحصّب الذي ينزله الحجاج بعد منى ⁦(الأزرقي، ص 743–744 و920 من الماسح)⁩."
  en: "The ravine (shi'b) of al-Safi in Makkah, also called Khayf Bani Kinana. There the Prophet said to the Quraysh: “Your meeting place is Khayf Bani Kinana.” It is the al-Muhassab, where pilgrims halt after Mina (al-Azraqi, pp. 743–744 and 920 of the scan)."
  es: "El barranco (shi'b) de al-Safi en La Meca, también llamado Khayf Bani Kinana. Allí, el Profeta dijo a los Quraysh: «Vuestro lugar de encuentro es Khayf Bani Kinana». Es al-Muhassab, donde los peregrinos se detienen después de Mina (al-Azraqi, págs. 743-744 y 920 del escaneo)."
  fr: "Le ravin (shi'b) d'al-Safi à La Mecque, également appelé Khayf Bani Kinana. C'est là que le Prophète dit aux Quraysh: « Votre lieu de rencontre est Khayf Bani Kinana. » Il s'agit d'al-Muhassab, où les pèlerins font halte après Mina (al-Azraqi, pp. 743-744 et 920 du scan)."
  ur: "مکہ مکرمہ میں الصفی کی گھاٹی ⁦(شعب)⁩ جسے خیف بنی کنانہ بھی کہا جاتا ہے۔ وہاں نبی نے قریش سے فرمایا: تمہاری ملاقات کی جگہ خیف بنی کنانہ ہے۔ یہ المحسب ہے، جہاں حجاج منیٰ کے بعد رکتے ہیں ⁦(الازراقی، صفحہ 743-744 اور اسکین کا 920)⁩۔"
  tr: "Mekke'deki Şa'b el-Safi, aynı zamanda Hayf Banu Kinanah olarak da bilinir ve Peygamber Kureyş'e şöyle demiştir: Atamanız Hayf Banu Kinanah'dır, yani Muhasib hacıların Mina'dan sonra karaya çıktığı (Al-Azraqi, s. 743–744 ve 920, El-Mesih'ten)."
  id: "Sha'b al-Safi di Mekah, juga disebut Khayf Banu Kinanah, di mana Nabi berkata kepada Quraish: Pengangkatanmu adalah Khayf Banu Kinanah, yaitu para peziarah Muhasib turun setelah Mina (Al-Azraqi, hlm. 743–744 dan 920 dari Al-Masih)."
