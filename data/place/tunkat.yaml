summary:
  ar: "مدينة كبيرة، هي قصبة إيلاق، ولها سوران حصينان وعدة أبواب وأسواق، والمياه تخترق أزقتها وتسقي رساتيقها، وهي أقل من نصف بنكث، ويفصلها عن بنكث تسعة أميال. {cite:nuzhat-al-mushtaq-2002 p. 704}"
  en: "A large city, the capital of Ilaq, with two strong walls, many gates and markets; water runs through its lanes and waters its districts; it is less than half the size of Binkat, nine miles away. {cite:nuzhat-al-mushtaq-2002 p. 704}"
  es: "Una gran ciudad, la capital de Ilaq, con dos sólidas murallas, numerosas puertas y mercados; el agua corre por sus calles y riega sus distritos; tiene menos de la mitad del tamaño de Binkat, situada a nueve millas de distancia. {cite:nuzhat-al-mushtaq-2002 p. 704}"
  fr: "Une grande ville, capitale d'Ilaq, entourée de deux solides murailles, de nombreuses portes et de marchés; l'eau sillonne ses ruelles et irrigue ses quartiers; sa superficie est inférieure à la moitié de celle de Binkat, située à neuf milles de là. {cite:nuzhat-al-mushtaq-2002 p. 704}"
  ur: "ایک بڑا شہر، الاق کا دار الحکومت، دو مضبوط دیواروں کے ساتھ، بہت سے دروازے اور بازار؛ پانی اپنی گلیوں سے گزرتا ہے اور اس کے اضلاع کو پانی دیتا ہے۔ یہ بنکٹ کے سائز کے نصف سے بھی کم ہے، نو میل دور۔ {حوالہ: نزہت المشتاق-2002 ص۔ 704}"
  tr: "İki surlu, birkaç kapısı ve pazarları olan büyük bir şehirdir, İlaq Kasbah'ıdır. Su sokaklarına sızar ve sazlıklarını sudur. Yarım banketten daha azdır ve banketten dokuz mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 704}"
  id: "Ini adalah kota besar, Kasbah Ilaq, dengan dua tembok benteng, beberapa gerbang, dan pasar. Air menembus gang-gangnya dan mengairi alang-alangnya. Kurang dari setengah banket, terpisah dari banket sejauh sembilan mil. {cite:nuzhat-al-mushtaq-2002 hlm. 704}"
