summary:
  ar: "موضع في اليمن ولّى عليه الهادي محمد بن عيسى التميمي، ووثب به صعصعة بن جعفر سنة 288هـ، وفيه موضع يقال له نجر وقرية الغيل، وعارضه أهله وهو يمر به."
  en: "A place in Yemen over which al-Hadi put Muhammad ibn Isa al-Tamimi and in which Sa'sa'a ibn Ja'far rose in 288 AH; it holds a spot called Najr and the village of al-Ghayl, and its people stood across al-Hadi's way as he passed."
  ur: "یمن کا ایک مقام جس پر ہادی نے محمد بن عیسیٰ تمیمی کو والی بنایا اور جہاں صعصعہ بن جعفر نے سنہ 288ھ میں سر اٹھایا؛ اس میں نجر نامی ایک جگہ اور الغیل کی بستی ہے، اور وہاں کے لوگوں نے گزرتے ہوئے ہادی کا راستہ روکا۔"
