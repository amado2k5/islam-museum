label: { ar: "جبال الألطاي", en: "Altai (mountain system of eastern Central Asia)", es: "Altai (sistema montañoso del este de Asia Central)", fr: "Altaï (chaîne montagneuse de l'Asie centrale orientale)", ur: "الٹائی ⁦(مشرقی وسطی ایشیا کا پہاڑی نظام)⁩" }
summary:
  ar: "جبال الألطاي، منظومة جبلية ضخمة في شرق آسيا الوسطى تمتد نحو ألف ميل من بحيرة زايسان جنوب غرب إلى أعالي السيلنغا وأورخون، وكانت أقدم موطن للأتراك والمغول؛ واسمه التركي القديم «ألتون يش» أي «الجبال الذهبية» {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  en: "The Altai is a mighty mountain system of eastern Central Asia, about a thousand miles long, stretching from Lake Zaysan in the south-west to the upper Selenga and Orkhon. It was the oldest home of the Turks and Mongols; the oldest Turkish name for its southern part, in the Orkhon inscriptions, is Altin-yish, 'gold mountains' {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  es: "El Altai es un imponente sistema montañoso del este de Asia Central, de aproximadamente mil millas de longitud, que se extiende desde el lago Zaysan en el suroeste hasta el alto Selenga y Orkhon. Fue el hogar más antiguo de los turcos y mongoles; el nombre turco más antiguo para su parte sur, en las inscripciones de Orkhon, es Altin-yish, 'montañas doradas' {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  fr: "L'Altaï est un vaste massif montagneux d'Asie centrale orientale, long d'environ mille kilomètres, s'étendant du lac Zaïssan au sud-ouest jusqu'au Haut-Selenga et à l'Orkhon. Il fut le plus ancien territoire des Turcs et des Mongols; le plus ancien nom turc de sa partie méridionale, dans les inscriptions de l'Orkhon, est Altin-yish, « montagnes d'or » (voir: Encyclopédie de l'Islam, vol. 1, p. 444)."
  ur: "الٹائی مشرقی وسطی ایشیا کا ایک طاقتور پہاڑی نظام ہے، جو تقریباً ایک ہزار میل لمبا ہے، جو جنوب مغرب میں جھیل زیسن سے بالائی سلینگا اور اورخون تک پھیلا ہوا ہے۔ یہ ترکوں اور منگولوں کا قدیم ترین گھر تھا۔ اورخون کے نوشتہ جات میں اس کے جنوبی حصے کا قدیم ترین ترک نام الٹین یش ہے، 'سونے کے پہاڑ' {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد 1 ص۔ 444}۔"
