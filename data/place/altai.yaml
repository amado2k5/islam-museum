summary:
  ar: "جبال الألطاي، منظومة جبلية ضخمة في شرق آسيا الوسطى تمتد نحو ألف ميل من بحيرة زايسان جنوب غرب إلى أعالي السيلنغا وأورخون، وكانت أقدم موطن للأتراك والمغول؛ واسمه التركي القديم «ألتون يش» أي «الجبال الذهبية» {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
  en: "The Altai is a mighty mountain system of eastern Central Asia, about a thousand miles long, stretching from Lake Zaysan in the south-west to the upper Selenga and Orkhon. It was the oldest home of the Turks and Mongols; the oldest Turkish name for its southern part, in the Orkhon inscriptions, is Altin-yish, 'gold mountains' {cite:encyclopaedia-of-islam-2 vol. 1 p. 444}."
