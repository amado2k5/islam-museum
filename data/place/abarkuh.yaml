summary:
  ar: "بلدة صغيرة تابعة ليزد على طريق شيراز ويزد، تحدّها طريق إلى أبادة. حكمها الكاكويهيون ثم الأتابكة، وكثر ذكرها في تاريخ المظفريين، وفيها أقدم آثارها ضريح بناه فيروزان سنة 448هـ، وضريح طاووس الحرمين الذي بُني أو أعيد بناؤه سنة 718هـ. {cite:encyclopaedia-of-islam-2 vol. 1 p. 22}"
  en: "A small town belonging to Yazd on the road from Shiraz to Yazd. It was granted to the Kakuyid Faramarz in 443/1051, its later rulers were atabegs, and it appears often in Muzaffarid history. Its oldest monument is a mausoleum built in 448/1056 by Firuzan; the so-called mausoleum of Ta'us al-Haramayn was built or rebuilt in 718/1318. {cite:encyclopaedia-of-islam-2 vol. 1 p. 22}"
  ur: "یزد کا ایک چھوٹا قصبہ، جو شیراز اور یزد کے راستے پر واقع ہے۔ 443/1051 میں کاکویہ فرامرز کو دیا گیا، اس کے بعد اتابک حکمراں رہے، اور مظفری تاریخ میں اکثر ذکر آتا ہے۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 22}"
