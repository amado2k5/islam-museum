summary:
  ar: "سدوسان مدينة بالسند؛ طلب أهلها الأمان من محمد بن مصعب الثقفي وسفرت بينه وبينهم السمنية فأمنهم ووظف عليهم خراجاً وأخذ رهناً وانصرف بأربعة آلاف من الزط إلى محمد بن القاسم."
  en: "Sadusan of Sind; its samaniyya-brokered aman gave Muhammad ibn al-Qasim kharaj, hostages, and four thousand Zutt auxiliaries."
  es: "Sadusan de Sind; su aman, mediado por samaniyya, entregó a Muhammad ibn al-Qasim kharaj, rehenes y cuatro mil auxiliares zutt."
  fr: "Sadusan du Sind; son aman négocié par la samaniyya a donné à Muhammad ibn al-Qasim kharaj, des otages et quatre mille auxiliaires Zutt."
  ur: "سندھ کے سادوسن؛ اس کے سامانیہ کی دلالی امان نے محمد بن القاسم کو خاراج، یرغمالی اور چار ہزار زٹ معاونین دیے۔"
  tr: "Sadusan, Sind'de bir şehirdir; halkı Muhammed bin Mus'ab el-Thaqafi'den sığınma aradı ve Samniye kabilesi onunla aralarında seyahat etti. Onları güvence altına aldı, onlardan bir vergi aldı, ipotek aldı ve Muhammed bin el-Kasım'a dört bin zat gönderdi."
  id: "Sadusan adalah sebuah kota di Sindh; penduduknya mencari perlindungan dari Muhammad ibn Mus'ab al-Thaqafi, dan suku Samniyah melakukan perjalanan antara dia dan mereka. Dia mengamankan mereka, menyewa upeti dari mereka, mengambil hipotek, dan mengirimkan empat ribu zat kepada Muhammad ibn al-Qasim."
