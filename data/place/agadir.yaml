summary:
  ar: "مدينة مغربية على ساحل الأطلسي عند ملتقى الأطلس الكبير مع سهل سوس، وكان فيها حصن برتغالي بُني سنة 1505 م باسم سانتا كروز، واستولى عليه السعديون سنة 1541 م، وصارت مرفأً تجاريًا حتى 1773 م، ثم نمت في القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  en: "A Moroccan town on the Atlantic coast at the junction of the High Atlas and the Sus plain. The Portuguese built a wooden castle there in 1505, called Santa Cruz; the Sa'dids took it in 1541 and it remained a trading port until 1773. It grew greatly in the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
