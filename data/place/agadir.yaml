summary:
  ar: "مدينة مغربية على ساحل الأطلسي عند ملتقى الأطلس الكبير مع سهل سوس، وكان فيها حصن برتغالي بُني سنة 1505 م باسم سانتا كروز، واستولى عليه السعديون سنة 1541 م، وصارت مرفأً تجاريًا حتى 1773 م، ثم نمت في القرن العشرين {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  en: "A Moroccan town on the Atlantic coast at the junction of the High Atlas and the Sus plain. The Portuguese built a wooden castle there in 1505, called Santa Cruz; the Sa'dids took it in 1541 and it remained a trading port until 1773. It grew greatly in the 20th century {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  es: "Ciudad marroquí situada en la costa atlántica, en la confluencia del Alto Atlas y la llanura del Sus. Los portugueses construyeron allí un castillo de madera en 1505, llamado Santa Cruz; los sadíes la conquistaron en 1541 y siguió siendo un puerto comercial hasta 1773. Experimentó un gran crecimiento en el siglo XX {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  fr: "Ville marocaine située sur la côte atlantique, au confluent du Haut Atlas et de la plaine du Sus. Les Portugais y construisirent un château en bois en 1505, nommé Santa Cruz; les Sa'didides s'en emparèrent en 1541 et elle demeura un port de commerce jusqu'en 1773. Elle connut un essor important au XXe siècle {cite:encyclopaedia-of-islam-2 vol. 1 p. 266}."
  ur: "ہائی اٹلس اور سوس کے میدان کے سنگم پر بحر اوقیانوس کے ساحل پر مراکش کا ایک قصبہ۔ پرتگالیوں نے 1505 میں وہاں ایک لکڑی کا قلعہ بنایا، جسے سانتا کروز کہا جاتا ہے۔ سعدیوں نے اسے 1541 میں لے لیا اور یہ 1773 تک تجارتی بندرگاہ بنا رہا۔ 20 ویں صدی میں اس نے بہت ترقی کی۔ 1 ص۔ 266}۔"
  tr: "Yüksek Atlas ile Souss ovasının birleştiği yerde Atlantik kıyısında bir Fas şehri. 1505 yılında Santa Cruz adında bir Portekiz kalesi inşa edilmiştir; bu kale 1541'de Saadianlar tarafından ele geçirilmiş ve 1773 yılına kadar ticari liman olmuştur, ardından yirminci yüzyılda büyümüştür {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 266}."
  id: "Sebuah kota Maroko di pesisir Atlantik di pertemuan Atlas Tinggi dengan dataran Souss. Kota ini memiliki benteng Portugis yang dibangun pada tahun 1505 M bernama Santa Cruz, yang direbut oleh Saadians pada tahun 1541 M dan menjadi pelabuhan komersial hingga tahun 1773 M, kemudian berkembang pada abad kedua puluh {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 266}."
