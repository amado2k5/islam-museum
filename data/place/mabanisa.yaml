summary:
  ar: "من قواعد بلاد اللمانية، مدينة جليلة عامرة وافرة الغلات، ويذكر المؤلف أن بينها وبين فرميزة ثلاثين ميلا جنوبا {cite:nuzhat-al-mushtaq-2002 p. 872}."
  en: "One of the principal cities of the land of the Germans, populous and rich in crops; the author gives thirty miles south to Furmīza {cite:nuzhat-al-mushtaq-2002 p. 872}."
  es: "Una de las principales ciudades de la tierra de los alemanes, populosa y rica en cosechas; el autor sitúa treinta millas al sur de Furmīza {cite:nuzhat-al-mushtaq-2002 p. 872}."
  fr: "L'une des principales villes du pays des Allemands, peuplée et riche en récoltes; l'auteur indique trente miles au sud jusqu'à Furmīza {cite:nuzhat-al-mushtaq-2002 p. 872}."
  ur: "جرمنوں کی سرزمین کے اہم شہروں میں سے ایک، آبادی والا اور فصلوں سے مالا مال؛ مصنف نے فرمیزہ کو تیس میل جنوب میں بتایا ہے {حوالہ: نزہت المشتاق-2002 ص 872}۔"
  tr: "Lamaniyah'ın topraklarının temellerinden biri olarak, soylu, müreffeh ve bol bir şehirdir. Yazar, şehrin Fermiza'nın otuz mil güneyinde olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 872}."
  id: "Di antara fondasi tanah Lamaniyah, sebuah kota yang mulia, makmur, dan melimpah. Penulis menyebutkan bahwa kota ini berjarak tiga puluh mil di selatan Fermiza {cite:Nuzhat-al-mushtaq-2002, hlm. 872}."
