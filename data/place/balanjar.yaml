summary:
  ar: "مدينة ببلاد الخزر خلف باب الأبواب؛ إليها غزا عبد الرحمن بن ربيعة سنة ٣٢هـ فقتل أمامها وأخذ أهلها جسده فجعلوه في تابوت يستسقون به {cite:kamil-ibn-al-athir p. 503 v.2}."
  en: "A Khazar city beyond Derbent — where Abd al-Rahman ibn Rabi'a fell in AH 32 and where his body was kept in a coffin for rain-prayers {cite:kamil-ibn-al-athir v.2 p. 503}."
  es: "Una ciudad jázara más allá de Derbent, donde Abd al-Rahman ibn Rabi'a cayó en el año 32 de la Hégira y donde su cuerpo fue guardado en un ataúd para las oraciones por la lluvia {cite:kamil-ibn-al-athir v.2 p. 503}."
  fr: "Une ville khazare au-delà de Derbent — où Abd al-Rahman ibn Rabi'a tomba en 32 AH et où son corps fut conservé dans un cercueil pour les prières de pluie {cite:kamil-ibn-al-athir v.2 p. 503}."
  ur: "دربنت سے آگے ایک خضر شہر — جہاں عبدالرحمٰن بن ربیعہ 32ھ میں گرا اور جہاں ان کی لاش بارش کی دعا کے لیے تابوت میں رکھی گئی تھی۔ 503}۔"
  tr: "Hazar topraklarında bir şehir, Bab al-Abwab'ın arkasında yer alır; Abd al-Rahman ibn Rabi'ah 32 Hicri yılında buraya saldırmış, önünde öldürülmüş ve halkı onun cesedini alıp yağmur yağdırmak için tabuta koymuş {cite:kamil-ibn-al-athir s. 503 v.2}."
  id: "Sebuah kota di tanah Khazar di belakang Bab al-Abwab; Abd al-Rahman ibn Rabi'ah menyerbu kota itu pada tahun 32 H, dibunuh di depannya, dan rakyatnya mengambil jenazahnya lalu meletakkannya di peti mati untuk menurunkan hujan {cite:kamil-ibn-al-athir hlm. 503 ayat 2}."
