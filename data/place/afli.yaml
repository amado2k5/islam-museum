summary:
  ar: "مدينة في بسيط من الأرض، فرجة الأمكنة، متصلة العمارات، شمالها جبال عالية ونهر دنو يجري خلفها، وفيها صناعة للحديد {cite:nuzhat-al-mushtaq-2002 p. 901}."
  en: "A city on a level plain with open spaces and connected buildings; high mountains lie to its north and the Danube runs behind it, and it has an iron industry {cite:nuzhat-al-mushtaq-2002 p. 901}."
  es: "Una ciudad en una llanura con espacios abiertos y edificios conectados; altas montañas se extienden al norte y el Danubio corre detrás de ella, y tiene una industria del hierro {cite:nuzhat-al-mushtaq-2002 p. 901}."
  fr: "Une ville située dans une plaine avec des espaces ouverts et des bâtiments reliés entre eux; de hautes montagnes se trouvent au nord et le Danube coule derrière elle, et elle possède une industrie du fer {cite:nuzhat-al-mushtaq-2002 p. 901}."
  ur: "کھلی جگہوں اور منسلک عمارتوں کے ساتھ سطح کے میدان پر ایک شہر؛ اس کے شمال میں اونچے پہاڑ ہیں اور ڈینیوب اس کے پیچھے بھاگتا ہے، اور اس میں لوہے کی صنعت ہے {حوالہ: نزہت المشتاق-2002 ص 901}۔"
  tr: "Küçük bir toprakta bir şehir, binalarla birbirine bağlı, kuzeyinde yüksek dağlar ve arkasında bir nehir akan bir yer manzarası ve demir endüstrisi vardır {cite:Nuzhat-al-Mushtaq-2002, s. 901}."
  id: "Sebuah kota di tanah kecil, sebuah pemandangan tempat, terhubung oleh bangunan, dengan pegunungan tinggi di utara dan sungai mengalir di belakangnya, serta memiliki industri besi {cite:Nuzhat-al-Mushtaq-2002, hlm. 901}."
