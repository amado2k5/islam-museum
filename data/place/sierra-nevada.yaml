label: { ar: "جبل شلير", en: "Sierra Nevada (Shilir)", es: "Sierra Nevada (Shilir)", fr: "Sierra Nevada (Shilir)", ur: "سیرا نیواڈا ⁦(شیلر)⁩", tr: "Shlir Dağı", id: "Gunung Shlir" }
summary:
  ar: "جبل الثلج الذي يحمل اسم شلير؛ يذكر المؤلف أن طوله يومان وأن الثلج به دائم في الشتاء والصيف، ومنه يجري نهر شنيل تحت غرناطة. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  en: "The snowy mountain called Shilir; the author says it is two days long, holds snow in winter and summer, and feeds the river that runs below Granada. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  es: "La montaña nevada llamada Shilir; el autor dice que tiene dos días de largo, conserva la nieve en invierno y verano, y alimenta el río que corre bajo Granada. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  fr: "La montagne enneigée appelée Shilir; l’auteur dit qu’elle mesure deux jours de long, qu’elle est enneigée en hiver comme en été et qu’elle alimente la rivière qui coule en contrebas de Grenade. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  ur: "برفانی پہاڑ جسے شلیر کہتے ہیں؛ مصنف کا کہنا ہے کہ یہ دو دن لمبا ہے، سردیوں اور گرمیوں میں برف رکھتا ہے، اور گراناڈا کے نیچے سے گزرنے والے دریا کو کھاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 569}"
  tr: "Schlier adını taşıyan kar dağı, yazar tarafından iki gün sürdüğünü ve oradaki karın kış ve yaz aylarında sürekli olduğunu, buradan Schnel Nehri'nin Granada'nın altından aktığını belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 569}"
  id: "Gunung salju yang dinamai Schlier disebutkan oleh penulis berdurasi dua hari dan salju di sana konstan pada musim dingin dan musim panas, dari mana Sungai Schnel mengalir di bawah Granada. {cite:nuzhat-al-mushtaq-2002 hlm. 569}"
