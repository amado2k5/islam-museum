summary:
  ar: "مدينة كبيرة على ساحل بحر القلزم، يذكر الإدريسي أنها مدينة شعيب، وأن بها بيتاً وماءً من عين تجري، ومعايشها ضيقة، وتبعد عن أيلة خمس مراحل. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  en: "A large town on the Red Sea coast which al-Idrisi identifies as the town of Shu'ayb, with a house and water from a flowing spring; its livelihood is narrow, five stages from Ayla. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  es: "Una gran ciudad en la costa del Mar Rojo que al-Idrisi identifica como la ciudad de Shu'ayb, con una casa y agua de un manantial; su subsistencia es estrecha, a cinco etapas de Ayla. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  fr: "Une grande ville sur la côte de la mer Rouge, qu'al-Idrisi identifie comme étant Shu'ayb, avec une maison et de l'eau provenant d'une source; ses moyens de subsistance sont limités, à cinq étapes d'Ayla. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  ur: "بحیرہ احمر کے ساحل پر ایک بڑا قصبہ جسے الادریسی شعیب کے قصبے کے نام سے شناخت کرتا ہے، جس میں ایک گھر اور بہتے چشمے سے پانی ہے۔ اس کا ذریعہ معاش تنگ ہے، عائلہ سے پانچ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 350}"
  tr: "Kalizm Denizi kıyısında büyük bir şehir. El-İdrisi, buranın Şuayb şehri olduğunu, bir evi ve akan bir pınardan suyu olduğunu, geçim kaynaklarının sınırlı olduğunu ve Ayla'ya beş adım uzaklıkta olduğunu belirtir. {cite:nuzhat-al-mushtaq-2002 s. 350}"
  id: "Sebuah kota besar di pesisir Laut Qalizm. Al-Idrisi menyebutkan bahwa kota ini adalah Shuayb, memiliki rumah dan air dari mata air yang mengalir, mata pencahariannya terbatas, dan berjarak lima langkah dari Ayla. {cite:Nuzhat-al-Mushtaq-2002 hlm. 350}"
