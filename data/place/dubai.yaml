summary:
  ar: مدينة على ساحل الخليج، مقر إمارة دبي التي يحكمها آل مكتوم؛ كانت ميناءً للغوص على اللؤلؤ ثم صارت المركز التجاري لدولة الإمارات.
  en: City on the Gulf coast, seat of the emirate of Dubai ruled by the Al Maktoum; a pearling port that became the commercial hub of the United Arab Emirates.
  ur: خلیج کے ساحل پر واقع شہر، آل مکتوم کے زیرِ حکومت امارتِ دبئی کا مرکز؛ پہلے موتی کے غوطہ خوری کا بندرگاہ، اب متحدہ عرب امارات کا تجارتی مرکز۔
  es: "Ciudad en la costa del Golfo, sede del emirato de Dubái gobernado por la dinastía Al Maktoum; un puerto perlero que se convirtió en el centro comercial de los Emiratos Árabes Unidos."
  fr: "Ville située sur la côte du Golfe, siège de l'émirat de Dubaï gouverné par les Al Maktoum; port perlier devenu le centre commercial des Émirats arabes unis."
  tr: "Körfez kıyısında bir şehir, Al Maktoum ailesinin yönettiği Dubai Emirliği'nin merkeziydi; inci dalış limanıydı ve daha sonra BAE'nin ticari merkezi haline geldi."
  id: "Sebuah kota di pesisir Teluk, pusat Emirat Dubai yang dikuasai oleh keluarga Al Maktoum; kota ini dulunya merupakan pelabuhan penyelaman mutiara dan kemudian menjadi pusat komersial UEA."
