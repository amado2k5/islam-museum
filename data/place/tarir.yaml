  ar: "بلدة بأذربيجان كانت قرية لها قصر قديم متشعث نزلها معاوية بن عمرو الموصلي الطائي فبنى بها وأسكنها ولده ثم بنوا بها قصوراً ومدّنوها وبنوا سوق باجروان وكبّروه وأفرده السلطان لهم فصاروا يتولونه دون عمال أذربيجان."
  en: "An Azerbaijani town, once a village with a crumbling old palace, settled by Mu'awiya ibn Amr al-Mawsili al-Ta'i who housed his sons there; they raised palaces, made it a town and built the Bajirwan Market, enlarged and set apart for them by the Sultan outside the Azerbaijan governors' charge."
  es: "Una ciudad azerbaiyana, antaño un pueblo con un antiguo palacio en ruinas, fundada por Mu'awiya ibn Amr al-Mawsili al-Ta'i, quien alojó allí a sus hijos; ellos erigieron palacios, la convirtieron en ciudad y construyeron el mercado de Bajirwan, ampliado y reservado para ellos por el sultán fuera de la jurisdicción de los gobernadores de Azerbaiyán."
