summary:
  ar: "بيكند مدينة ما وراء النهر على فرسخين من رامدين التابعة لها؛ أتاها عبيد الله بن زياد في أربعة وعشرين ألفاً فهزم جموع خاتون من الترك وصالحها على ألف ألف ودخلها."
  en: "Baykand beyond the river, two farsakhs from its dependency Ramadin; Ubaydallah ibn Ziyad's twenty-four thousand routed the Khatun's Turks and he entered at a million dirhams' sulh."
  es: "Baykand más allá del río, a dos farsakhs de su dependencia Ramadin; los veinticuatro mil de Ubaydallah ibn Ziyad derrotaron a los turcos de Khatun y entró por un millón de dirhams."
  fr: "Baykand au-delà du fleuve, à deux farsakhs de sa dépendance Ramadin; les vingt-quatre mille hommes d'Ubaydallah ibn Ziyad ont mis en déroute les Turcs de Khatun et il est entré à un million de dirhams sulh."
  ur: "دریا سے پرے Baykand، اس کے انحصار رمضان سے دو فرسخ؛ عبیداللہ ابن زیاد کے چوبیس ہزار نے خاتون کے ترکوں کو شکست دی اور وہ دس لاکھ درہم سلح پر داخل ہوا۔"
  tr: "Beikand, nehrin ötesinde, Ramdin'den iki farsakh uzaklıkta bir şehirdir ve onun yetkisi altındadır; Ubeydullah bin Ziyad yirmi dört bin adamla geldi, Türk Hatun gruplarını yendi, onu bin bin kişiyle barıştırdı ve şehre girdi."
  id: "Beikand adalah sebuah kota di seberang sungai dua farsakh dari Ramdin di bawah yurisdiksinya; Ubaydullah ibn Ziyad datang dengan dua puluh empat ribu orang dan mengalahkan kelompok Khatun Turkik, mendamaikannya dengan seribu ribu, dan memasuki kota tersebut."
