summary:
  ar: "بلدة قديمة صغيرة على الضفة الشمالية الشرقية لبحيرة وان، تشهد لها المصادر منذ العصر الأورارتي وجغرافيو اليونان والرومان. تداولها العرب والأمراء الأرمن والكيسيون والمروانيون والسلاجقة والأيوبيون، وحصّنها وزير الإلخانيين علي شاه، ثم هجرها أهلها في منتصف القرن التاسع عشر {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
  en: "A small ancient town on the north-eastern shore of Lake Van, attested from the Urartian period and in Graeco-Roman geography. It passed among Arabs, Armenian princes, the Kaysite emirate of Akhlat, the Marwanids, the Saljuqs and the Ayyubids; the Ilkhanid wazir 'Ali Shah fortified it, and its last inhabitants left about the middle of the nineteenth century, when its ruins came to lie largely under water {cite:encyclopaedia-of-islam-2 vol. 1 p. 675}."
