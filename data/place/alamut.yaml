summary:
  ar: "حصن الباطنية الإسماعيلية في الجبل قرب قزوين، دار الحسن بن الصباح زعيمهم؛ وفي سنة إحدى عشرة وخمس مئة نرحلت العساكر عن حصار الباطنية بالألموت لما بلغهم موت السلطان محمد بن ملكشاه {cite:shadharat-dhahab p. 505}."
  en: "The Batiniyya mountain-fortress near Qazwin, seat of Hasan-i Sabbah; in 511 the besieging armies struck camp from Alamut when Sultan Muhammad b. Malikshah's death reached them {cite:shadharat-dhahab p. 505}."
  es: "La fortaleza de montaña Batiniyya cerca de Qazwin, sede de Hasan-i Sabbah; en 511 los ejércitos sitiadores levantaron el campamento desde Alamut cuando les llegó la noticia de la muerte del sultán Muhammad b. Malikshah {cita:shadharat-dhahab p. 505}."
  fr: "La forteresse de montagne de Batiniyya près de Qazwin, siège de Hasan-i Sabbah; en 511, les armées assiégeantes ont levé le camp d'Alamut lorsque la mort du sultan Muhammad b. Malikshah leur est parvenue {cite:shadharat-dhahab p. 505}."
