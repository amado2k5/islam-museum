summary:
  ar: "موضع بين عسفان ومكة، ويقال له الهدأة، وفيه غدر عضل والقارة بخبيب بن عدي وأصحابه ⁦(معجم ما استعجم)⁩."
  en: "A site between Usfan and Makkah, also called al-Hada'ah, where Adal and al-Qara broke faith with Khubayb ibn Adi and his companions (Mu'jam ma sta'jam)."
  es: "Un lugar entre Usfan y La Meca, también llamado al-Hada'ah, donde Adal y al-Qara rompieron su promesa a Khubayb ibn Adi y sus compañeros (Mu'jam ma sta'jam)."
  fr: "Un site entre Usfan et La Mecque, également appelé al-Hada'ah, où Adal et al-Qara ont rompu la foi avec Khubayb ibn Adi et ses compagnons (Mu'jam ma sta'jam)."
  ur: "عثفان اور مکہ کے درمیان ایک جگہ جسے الہدایہ بھی کہا جاتا ہے، جہاں عادل اور القرا نے خبیب بن عدی اور ان کے ساتھیوں ⁦(معجم ما ستجم)⁩ کے ساتھ ایمان توڑا۔"
  tr: "Asfan ile Mekke arasında yer alan Al-Hada'ah adlı bir yerdir ve burada Khabib ibn 'Adi ve yoldaşlarının (Mu'jam Ma Ista'jam) 'Adil ve Al-Qarah'ın ihanetini barındırır."
  id: "Sebuah tempat di antara Asfan dan Mekah, disebut Al-Hada'ah, dan di sini terdapat pengkhianatan 'Adil dan Al-Qarah oleh Khabib ibn 'Adi dan para sahabatnya (Mu'jam Ma Ista'jam)."
