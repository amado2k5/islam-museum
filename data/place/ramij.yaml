summary:
  ar: "جزيرة كبيرة من جزائر الزنج، دورها أربعمائة ميل أو أكثر، فيها جبل عالٍ منيع يلجأ إليه المنقطعون، ومن أهلها من يُعرف بالسمرة، وفيها الأرز والسكر والموز، ويتجه إليها التجار كل سنة {cite:nuzhat-al-mushtaq-2002 p. 62}."
  en: "A large island in the Zanj archipelago, about four hundred miles around. It has a high, defended mountain where outlaws take refuge. Its people are dark-skinned; rice, sugar and bananas grow there, and merchants visit each year {cite:nuzhat-al-mushtaq-2002 p. 62}."
