summary:
  ar: "جزيرة كبيرة من جزائر الزنج، دورها أربعمائة ميل أو أكثر، فيها جبل عالٍ منيع يلجأ إليه المنقطعون، ومن أهلها من يُعرف بالسمرة، وفيها الأرز والسكر والموز، ويتجه إليها التجار كل سنة {cite:nuzhat-al-mushtaq-2002 p. 62}."
  en: "A large island in the Zanj archipelago, about four hundred miles around. It has a high, defended mountain where outlaws take refuge. Its people are dark-skinned; rice, sugar and bananas grow there, and merchants visit each year {cite:nuzhat-al-mushtaq-2002 p. 62}."
  es: "Una gran isla del archipiélago de Zanj, de unos cuatrocientos kilómetros de circunferencia. Posee una alta montaña fortificada donde se refugian los forajidos. Sus habitantes son de piel oscura; allí se cultivan arroz, azúcar y plátanos, y recibe la visita de comerciantes cada año {cite:nuzhat-al-mushtaq-2002 p. 62}."
  fr: "Une grande île de l'archipel de Zanj, d'environ 640 kilomètres de circonférence. Elle possède une haute montagne fortifiée où se réfugient les hors-la-loi. Ses habitants ont la peau foncée; on y cultive du riz, du sucre et des bananes, et des marchands s'y rendent chaque année {cite:nuzhat-al-mushtaq-2002 p. 62}."
  ur: "زنج جزیرہ نما میں ایک بڑا جزیرہ جس کے ارد گرد چار سو میل کا فاصلہ ہے۔ اس میں ایک اونچا، محفوظ پہاڑ ہے جہاں غیر قانونی پناہ گزین ہوتے ہیں۔ اس کے لوگ سیاہ فام ہیں۔ وہاں چاول، چینی اور کیلے اگتے ہیں، اور تاجر ہر سال یہاں آتے ہیں۔ 62}۔"
  tr: "Zanj bölgesinde yaklaşık dört yüz mil veya daha fazla büyüklükte, ulaşılmazların sığındığı dik yüksek bir dağa sahip büyük bir ada. Sakinleri arasında Samra denir ve her yıl tüccarlar buraya gider {cite:nuzhat-al-mushtaq-2002, s. 62}."
  id: "Sebuah pulau besar di wilayah Zanz, sekitar empat ratus mil atau lebih, dengan gunung tinggi yang curam tempat orang yang tak terjangkau mencari tempat berlindung. Di antara penduduknya dikenal sebagai Samra, dan terdapat padi, gula, dan pisang, dan para pedagang datang ke sana setiap tahun {cite:nuzhat-al-mushtaq-2002, hlm. 62}."
