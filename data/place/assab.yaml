summary:
  ar: "مرفأ وبلدة على الطرف الشمالي الغربي لخليج عصب على ساحل إريتريا، يحيط بها إقليم قاحل يسكنه عفر (الدنكالي)؛ وقد تُعرف بسبأ القديمة، ويرجع أهميتها إلى موقعها مقابل مخا وعند نهاية طريق قوافل يصعد إلى الهضبة الإثيوبية {cite:encyclopaedia-of-islam-2 vol. 1 p. 768}."
  en: "Town and port at the north-western end of the Bay of Assab on the coast of Eritrea, in arid country inhabited by the Afar (Danakil). It is generally identified with the ancient Sabae and its importance lies opposite Mukha, at the end of a caravan route to the Ethiopian plateau {cite:encyclopaedia-of-islam-2 vol. 1 p. 768}."
