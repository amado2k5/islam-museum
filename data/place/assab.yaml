summary:
  ar: "مرفأ وبلدة على الطرف الشمالي الغربي لخليج عصب على ساحل إريتريا، يحيط بها إقليم قاحل يسكنه عفر ⁦(الدنكالي)⁩؛ وقد تُعرف بسبأ القديمة، ويرجع أهميتها إلى موقعها مقابل مخا وعند نهاية طريق قوافل يصعد إلى الهضبة الإثيوبية {cite:encyclopaedia-of-islam-2 vol. 1 p. 768}."
  en: "Town and port at the north-western end of the Bay of Assab on the coast of Eritrea, in arid country inhabited by the Afar (Danakil). It is generally identified with the ancient Sabae and its importance lies opposite Mukha, at the end of a caravan route to the Ethiopian plateau {cite:encyclopaedia-of-islam-2 vol. 1 p. 768}."
  es: "Ciudad y puerto situado en el extremo noroccidental de la bahía de Assab, en la costa de Eritrea, en una zona árida habitada por los afar (danakil). Generalmente se la identifica con la antigua Sabae y su importancia radica frente a Mukha, al final de una ruta de caravanas hacia la meseta etíope {cite:encyclopaedia-of-islam-2 vol. 1 p. 768}."
  fr: "Ville et port situé à l'extrémité nord-ouest de la baie d'Assab, sur la côte érythréenne, dans une région aride habitée par les Afars (Danakils). Elle est généralement identifiée à l'ancienne Sabae et son importance réside face à Mukha, au terminus d'une route caravanière vers le plateau éthiopien (voir Encyclopaedia of Islam, vol. 1, p. 768)."
  ur: "اریٹیریا کے ساحل پر خلیج اساب کے شمال مغربی سرے پر واقع قصبہ اور بندرگاہ، افار ⁦(داناکیل)⁩ کے آباد خشک ملک میں۔ اس کی شناخت عام طور پر قدیم سبا کے ساتھ کی جاتی ہے اور اس کی اہمیت مکہ کے سامنے ہے، ایتھوپیا کے سطح مرتفع تک قافلے کے راستے کے آخر میں۔ 1 ص۔ 768}۔"
