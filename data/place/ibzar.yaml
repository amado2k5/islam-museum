summary:
  ar: "مدينة صغيرة على تل من تراب، حولها النخل وماؤها عذب، وقربها معدن شب جيد لكنه رخو، ويتاجر أهلها بالشب {cite:nuzhat-al-mushtaq-2002 p. 118}."
  en: "A small town on a mound of earth with palms and sweet water. Near it is a good but soft alum mine, and its people trade in alum {cite:nuzhat-al-mushtaq-2002 p. 118}."
  es: "Un pequeño pueblo sobre un montículo de tierra con palmeras y agua dulce. Cerca hay una buena mina de alumbre, aunque blanda, y sus habitantes comercian con alumbre {cite:nuzhat-al-mushtaq-2002 p. 118}."
  fr: "Un petit village bâti sur une butte de terre, avec des palmiers et de l'eau douce. À proximité se trouve une mine d'alun de bonne qualité mais tendre, et ses habitants en font le commerce {cite:nuzhat-al-mushtaq-2002 p. 118}."
  ur: "کھجوروں اور میٹھے پانی کے ساتھ زمین کے ٹیلے پر ایک چھوٹا سا شہر۔ اس کے قریب ہی ایک اچھی لیکن نرم پھٹکڑی کی کان ہے اور اس کے لوگ پھٹکری کی تجارت کرتے ہیں۔ 118}۔"
