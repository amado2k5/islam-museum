summary:
  ar: "مدينة حسنة كثيرة الخصب والعسل واللحوم، لها عيون جارية تحت سورها وقصبة منيعة؛ ويذكر المؤلف أن لها أكثر من ثلاثة آلاف قرية يربى فيها دود الحرير. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  en: "A fine city rich in fertile land, honey and meat, with running springs beneath its wall and a strong citadel; the author says more than three thousand villages around it raise silkworms. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  es: "Una hermosa ciudad rica en tierras fértiles, miel y carne, con manantiales que brotan bajo sus murallas y una sólida ciudadela; el autor afirma que más de tres mil aldeas a su alrededor crían gusanos de seda. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  fr: "Une belle cité, riche en terres fertiles, en miel et en viande, avec des sources jaillissant au pied de ses remparts et une citadelle imposante; l’auteur indique que plus de trois mille villages alentour élèvent des vers à soie. {cite:nuzhat-al-mushtaq-2002 p. 568}"
