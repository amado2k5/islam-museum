summary:
  ar: "مدينة عامرة كبيرة صالحة القدر، بها أسواق وتجارات وأحوال حسنة، ولها أقاليم وقرى عامرة، بحسب الإدريسي. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  en: "A large, populous city of fair size, with markets, trade and good conditions, and districts and villages that depend on it, according to al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  es: "Según al-Idrisi, una ciudad grande y populosa de tamaño considerable, con mercados, comercio y buenas condiciones, y distritos y aldeas que dependen de ella. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  fr: "Selon al-Idrisi, il s'agit d'une grande ville peuplée, de taille respectable, dotée de marchés, d'un commerce florissant et de conditions de vie favorables, ainsi que de quartiers et de villages qui en dépendent. {cite:nuzhat-al-mushtaq-2002 p. 175}"
  ur: "الادریسی کے مطابق، منصفانہ سائز کا ایک بڑا، آبادی والا شہر، جس میں بازار، تجارت اور اچھے حالات، اور اس پر منحصر اضلاع اور دیہات ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 175}"
  tr: "Al-Idrisi'ye göre, pazarları, ticareti ve iyi koşulları olan, ayrıca gelişen bölgeler ve köylerle zengin, büyük ve köklü bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 175}"
  id: "Sebuah kota yang makmur, besar, dan mapan dengan pasar, perdagangan, dan kondisi yang baik, serta wilayah dan desa yang makmur, menurut Al-Idrisi. {cite:nuzhat-al-mushtaq-2002 hlm. 175}"
