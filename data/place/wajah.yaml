  ar: "حصن بطبرستان تحصن به مرزبان جرجان حين نقضوا على يزيد بن المهلب وحوله غياض وأشب فنزل عليه يزيد سبعة أشهر ونصب المنجنيق حتى دلهم رجل على طريق بسلالم جلود فصعده جهم بن زحر وفتحه وقتل الأسرى بوادي جرجان حتى سالت الدماء."
  en: "A Tabaristan fortress where Jurjan's marzban fortified against Yazid, ringed by thickets and jungle; seven months and mangonels availed nothing till an informer showed a path and hide-ladders carried Jahm ibn Zahr up — the captives were slaughtered in Wadi Jurjan till the blood ran."
