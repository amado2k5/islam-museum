summary:
  ar: "مدينة حسنة ذات سور ونهر جارٍ، لها غلات الحناء والقطن والكمون، وفيها سوق وصناعات قائمة، وتبعد عن قسطيلية أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  en: "A fine walled city with a flowing river and crops of henna, cotton and cumin, with a market and standing crafts. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  es: "Una hermosa ciudad amurallada con un río caudaloso y cultivos de henna, algodón y comino, con un mercado y puestos de artesanía. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  fr: "Une belle ville fortifiée traversée par une rivière, où l'on cultive le henné, le coton et le cumin, avec un marché et des artisans installés sur place. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  ur: "بہتی ہوئی ندی اور مہندی، کپاس اور زیرہ کی فصلوں کے ساتھ ایک عمدہ دیواروں والا شہر، بازار اور کھڑے دستکاری کے ساتھ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 278}"
  tr: "Duvarı ve akan nehriyle güzel bir şehir, kına, pamuk ve kimyon verimleri var, pazarı ve mevcut sanayileri var ve Kastilya'ya dört adım uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 278}"
  id: "Kota yang indah dengan tembok dan sungai yang mengalir, memiliki hasil henna, kapas, dan jintan, serta pasar dan industri yang sudah ada, dan berjarak empat langkah dari Kastilya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 278}"
