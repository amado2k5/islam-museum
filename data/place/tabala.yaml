  fr: "Une petite ville des districts de La Mecque, avec des sources jaillissantes, de nombreux palmiers et des jardins, nichée dans un creux entre de basses collines. {cite:nuzhat-al-mushtaq-2002 p. 146}"
  ur: "مکہ کے اضلاع کا ایک چھوٹا سا قصبہ جس میں بہتے چشمے، بہت سے کھجوریں اور باغات ہیں، جو نیچی پہاڑیوں کے درمیان ایک کھوکھلے میں پڑے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 146}"
