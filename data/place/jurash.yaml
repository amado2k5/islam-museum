summary:
  ar: "مدينة مغلقة في مخلاف من مخاليف اليمن، حاصرها صرد بن عبد الله الأزدي نحو شهر ثم أوقع بأهلها عند جبل شكر فقدم وفدهم على النبي فأسلموا وحمى لهم حمى حول قريتهم؛ وعند البلاذري أسلم أهلها وأهل تبالة عن غير قتال فأقرهم النبي على ما أسلموا عليه وجعل على كل حالم ممن بهما من أهل الكتاب ديناراً واشترط عليهم ضيافة المسلمين، وولّى أبا سفيان بن حرب جُرَش."
  en: "A town in Yemen; its people and those of Tabala accepted Islam without fighting, so the Prophet confirmed them on what they had embraced, set a dinar on every hālim of the People of the Book there, stipulated hospitality for the Muslims, and appointed Abu Sufyan ibn Harb over Jurash."
  es: "Una ciudad en Yemen; sus habitantes y los de Tabala aceptaron el Islam sin luchar, por lo que el Profeta les confirmó lo que habían abrazado, fijó un dinar para cada hālim de la Gente del Libro que vivía allí, estipuló la hospitalidad para los musulmanes y nombró a Abu Sufyan ibn Harb al frente de Jurash."
  fr: "Une ville du Yémen; ses habitants et ceux de Tabala ont accepté l'islam sans combattre, le Prophète les a donc confirmés dans leur conversion, a fixé un dinar pour chaque hālim des Gens du Livre qui s'y trouvait, a stipulé l'hospitalité pour les musulmans et a nommé Abu Sufyan ibn Harb à la tête de Jurash."
  ur: "یمن کا ایک قصبہ؛ اس کے لوگوں نے اور طبلہ والوں نے بغیر لڑے اسلام قبول کیا تو نبی نے ان کی تصدیق کی جو انہوں نے قبول کیا تھا، وہاں اہل کتاب کے ہر حلیم پر ایک دینار مقرر کیا، مسلمانوں کی مہمان نوازی کی شرط رکھی اور ابو سفیان بن حرب کو جراش پر مقرر کیا۔"
