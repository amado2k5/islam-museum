summary:
  ar: "مدينة مغلقة في مخلاف من مخاليف اليمن، حاصرها صرد بن عبد الله الأزدي نحو شهر ثم أوقع بأهلها عند جبل شكر فقدم وفدهم على النبي فأسلموا وحمى لهم حمى حول قريتهم؛ وعند البلاذري أسلم أهلها وأهل تبالة عن غير قتال فأقرهم النبي على ما أسلموا عليه وجعل على كل حالم ممن بهما من أهل الكتاب ديناراً واشترط عليهم ضيافة المسلمين، وولّى أبا سفيان بن حرب جُرَش."
  en: "A town in Yemen; its people and those of Tabala accepted Islam without fighting, so the Prophet confirmed them on what they had embraced, set a dinar on every hālim of the People of the Book there, stipulated hospitality for the Muslims, and appointed Abu Sufyan ibn Harb over Jurash."
