summary:
  ar: "مدينة حسنة كثيرة الوارد والصادر، ولها قرى كثيرة، ومنها مدينتا دده وتته، وبين مالوه ودده أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  en: "A handsome city with much traffic in and out and many villages; from it lie Dadda and Tatta, with four stages between Malwa and Dadda. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  es: "Una hermosa ciudad con mucho tráfico de entrada y salida y muchos pueblos; desde ella parten Dadda y Tatta, con cuatro etapas entre Malwa y Dadda. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  fr: "Une belle ville, traversée par un trafic intense, et de nombreux villages; Dadda et Tatta en sont desservées, avec quatre étapes entre Malwa et Dadda. {cite:nuzhat-al-mushtaq-2002 p. 194}"
  ur: "ایک خوبصورت شہر جس کے اندر اور باہر بہت زیادہ ٹریفک ہے اور بہت سے گاؤں؛ اس میں سے دڈا اور تتہ ہے، جس میں مالوا اور ڈڈا کے درمیان چار مراحل ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 194}"
  tr: "Çok sayıda geliş ve ihracat yapan güzel bir şehirdir ve Dada ile Teh şehirleri dahil olmak üzere birçok köyü vardır ve Malwah ile Daddah arasında dört aşama vardır. {cite:nuzhat-al-mushtaq-2002 s. 194}"
  id: "Kota yang indah dengan banyak kedatangan dan ekspor, serta memiliki banyak desa, termasuk kota Dada dan Teh, dan antara Malwah dan Daddah terdapat empat tahap. {cite:Nuzhat-al-Mushtaq-2002 hlm. 194}"
