summary:
  ar: "مدينة جليلة متحضرة فيها إنشاء وعمارة، على نحر البحر، ويذكر المؤلف أنها تبعد عن هنتونة ستين ميلا {cite:nuzhat-al-mushtaq-2002 p. 945}."
  en: "A notable, civilised city with building and construction, on the sea; the author gives sixty miles from Hintūna {cite:nuzhat-al-mushtaq-2002 p. 945}."
  es: "Una ciudad notable y civilizada, con edificios y construcciones, a orillas del mar; el autor indica sesenta millas desde Hintūna {cite:nuzhat-al-mushtaq-2002 p. 945}."
  fr: "Une ville notable et civilisée, avec des bâtiments et des constructions, sur la mer; l'auteur donne soixante milles de Hintūna {cite:nuzhat-al-mushtaq-2002 p. 945}."
  ur: "عمارت اور تعمیر کے ساتھ ایک قابل ذکر، مہذب شہر، سمندر پر؛ مصنف نے Hintūna سے ساٹھ میل کا فاصلہ بیان کیا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 945}۔"
  tr: "Deniz kıyısında, inşaatı ve mimarisiyle asil ve medeni bir şehirdir ve yazar, Hantuna'dan altmış mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 945}."
  id: "Sebuah kota yang mulia dan beradab dengan konstruksi dan arsitektur, terletak di tepi laut, dan penulis menyebutkan bahwa kota ini berjarak enam puluh mil dari Hantuna {cite:Nuzhat-al-Mushtaq-2002, hlm. 945}."
