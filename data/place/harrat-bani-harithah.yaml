summary:
  ar: "موضع يُعرف بحرة بني حارثة، سلكه النبي في طريقه إلى أحد، ودلّه فيه أبو خيثمة الحارثي على طريق بعيد عن المشركين، وهو قرب أموال بني حارثة ⁦(ابن هشام، الجزء الأول القسم الثاني، ص 23؛ السمهودي، ص 296)⁩."
  en: "A place known as Harrat Bani Harithah, which the Prophet took on his way to Uhud. Abu Khaythama al-Harithi guided him there by a route far from the polytheists, and it lies near the properties of Banu Harithah (Ibn Hisham, vol. 1 part 2, p. 23; al-Samhudi, p. 296)."
  es: "Un lugar conocido como Harrat Bani Harithah, por donde pasó el Profeta en su camino a Uhud. Abu Khaythama al-Harithi lo guió hasta allí por una ruta alejada de los politeístas, y se encuentra cerca de las propiedades de Banu Harithah (Ibn Hisham, vol. 1 parte 2, pág. 23; al-Samhudi, pág. 296)."
  fr: "Un lieu connu sous le nom de Harrat Bani Harithah, que le Prophète emprunta sur son chemin vers Uhud. Abu Khaythama al-Harithi le guida vers cet endroit par une route loin des polythéistes, et il se situe près des propriétés de Banu Harithah (Ibn Hisham, vol. 1 partie 2, p. 23; al-Samhudi, p. 296)."
