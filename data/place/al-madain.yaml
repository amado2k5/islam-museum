summary:
  ar: مدينة كسرى على دجلة وهي قطسفون؛ عند البلاذري فتح المسلمون بهورسير بعد إقامة تسعة أشهر أو ثمانية عشر فهرب يزدجرد إلى حلوان فعبر المسلمون دجلة خوضاً وسباحة ففتحوا المدينة الشرقية سنة ست عشرة.
  en: the Khusraws' city on the Tigris — Ctesiphon; in al-Baladhuri the Muslims besieged Bahurasir nine or eighteen months till Yazdgard fled to Hulwan, then swam the Tigris to open the eastern city in year 16.
  es: "La ciudad de los Khusraws en el Tigris: Ctesifonte; en al-Baladhuri, los musulmanes sitiaron Bahurasir durante nueve o dieciocho meses hasta que Yazdgard huyó a Hulwan, y luego cruzaron a nado el Tigris para abrir la ciudad oriental en el año 16."
  fr: "la ville des Khusraws sur le Tigre — Ctésiphon; à al-Baladhuri, les musulmans assiégèrent Bahurasir pendant neuf ou dix-huit mois jusqu'à ce que Yazdgard s'enfuie à Hulwan, puis traversa le Tigre à la nage pour ouvrir la ville orientale en l'an 16."
  ur: "دجلہ پر خسرو کا شہر - Ctesiphon؛ البلادھوری میں مسلمانوں نے نو یا اٹھارہ ماہ تک بہوراشیر کا محاصرہ کیا یہاں تک کہ یزدگرد حلوان کی طرف بھاگ گیا، پھر 16 میں مشرقی شہر کو کھولنے کے لیے دجلہ تیرا۔"
