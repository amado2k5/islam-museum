summary:
  ar: "ثنية مشرفة على المدينة يطؤها من يريد مكة بحسب المحققين؛ ضرب النبي عليها عسكره لما خرج إلى تبوك."
  en: A mountain pass overlooking Medina trodden by anyone bound for Mecca, in the editors' reckoning; the Prophet pitched his army's camp on it when he set out for Tabuk.
  es: "Según los editores, se trata de un paso de montaña con vistas a Medina, transitado por cualquiera que se dirigiera a La Meca; el Profeta instaló allí el campamento de su ejército cuando partió hacia Tabuk."
  fr: "Un col de montagne surplombant Médine, emprunté par tous ceux qui se rendaient à La Mecque, selon les rédacteurs; le Prophète y installa le camp de son armée lorsqu'il partit pour Tabuk."
  ur: "ایڈیٹرز کے حساب سے مکہ جانے والے ہر شخص کو روندتے ہوئے مدینہ کا نظارہ کرنے والا پہاڑی درہ۔ جب آپ تبوک کے لیے روانہ ہوئے تو نبی نے اس پر اپنی فوج کا کیمپ لگایا۔"
  tr: "Araştırmacılara göre, Mekke'ye gitmek isteyenler tarafından Medine'ye bakan bir çadır kurulmuştur; Peygamber Tabuk'a gittiğinde orada kamp kurmuştur."
  id: "Sebuah tenda yang menghadap Madinah disediakan oleh mereka yang ingin ke Mekah, menurut para peneliti; Nabi berkemah di sana saat pergi ke Tabuk."
