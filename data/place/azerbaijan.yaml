  ar: "إقليم أذربيجان وعاصمته أردبيل وبها مرزبانها وإليها جباية خراجها؛ فتحها حذيفة بن اليمان بولاية من عمر نقلها إليه المغيرة بن شعبة فصالحه مرزبانها على ثمانمائة ألف درهم وزن ثمانية."
  en: "The province of Azerbaijan, whose seat Ardabil held its marzban and kharaj office; Hudhayfa ibn al-Yaman conquered it on Umar's writ delivered by al-Mughira, its marzban treating for eight hundred thousand dirhams weight-eight."
  es: "La provincia de Azerbaiyán, cuya sede Ardabil ostentaba el cargo de marzban y kharaj; Hudhayfa ibn al-Yaman la conquistó por orden de Umar entregada por al-Mughira, cuyo marzban negociaba por ochocientos mil dirhams de peso ocho."
  fr: "La province d'Azerbaïdjan, dont le siège était Ardabil, abritait le marzban et le kharaj; Hudhayfa ibn al-Yaman la conquit sur l'ordre d'Umar remis par al-Mughira, son marzban traitant pour huit cent mille dirhams poids-huit."
  ur: "آذربائیجان کا صوبہ، جس کی نشست اردبیل میں مرزبان اور خارج کا دفتر تھا۔ حذیفہ بن یمان نے اسے عمر کی تحریر المغیرہ کی طرف سے پہنچایا، اس کا مرزبان آٹھ لاکھ درہم وزن میں تھا۔"
