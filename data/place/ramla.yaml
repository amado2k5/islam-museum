summary:
  ar: "مدينة الرملة من جند فلسطين؛ لم تكن موجودة قبل سليمان بن عبد الملك — كان موضعها رملة — فأحدثها وهو والي الجند عن أخيه الوليد ومصّرها فبنى قصره ودار الصباغين بصهريج متوسطها ثم مسجد الجماعة وأذن للناس في البناء وحفر قناة بردة والآبار؛ وصارت دار الصباغين لورثة صالح بن علي بن عبد الله بن العباس لأنها قبضت مع أموال بني أمية؛ وبفلسطين فروز بسجلات منفردة من خراج العامة وبها التخفيف والردود لضياع رفضت في خلافة الرشيد فأعاد إليها هرثمة بن أعين أهلها على تخفيف الخراج. وشهد ابنها المقدسي نحو 375هـ أن ليس في الإسلام أبهى من جامعها الأبيض الذي بناه هشام بن عبد الملك — وروى عن عمّه أن هشاماً ألزم النصارى إظهار أعمدة رخام مدفونة تحت الرمل كانت أعدّت لكنيسة بالعة وإلا هدم كنيسة لدّ — غير أنها في الشتاء جزيرة من الوحل وفي الصيف ذريرة من الرمل وآبارها عميقة مالحة {cite:ahsan-al-taqasim pp. 141-142}."
  en: "The city of al-Ramla in the Filastin jund; it did not exist before Sulayman ibn Abd al-Malik — its site was a sandy tract — he founded it while governing the district for his brother al-Walid and made it an amsar, building his palace and the house of the dyers with its central cistern, then the congregational mosque, granting people leave to build and digging the Barada canal and wells; Dar al-Sabbaghin passed to the heirs of Salih ibn Ali ibn Abdullah ibn al-Abbas, seized with Umayyad wealth; Filastin holds fiefs under separate caliphal registers distinct from the common kharaj — the takhafif and rudud categories arising when al-Rashid had Harthama ibn A'yan restore estates abandoned in his reign, bringing back their people on lightened kharaj."
  es: "La ciudad de al-Ramla en el jund de Filastin; no existía antes de Sulayman ibn Abd al-Malik —su sitio era un terreno arenoso— la fundó mientras gobernaba el distrito para su hermano al-Walid y la convirtió en un amsar, construyendo su palacio y la casa de los tintoreros con su cisterna central, luego la mezquita congregacional, otorgando a la gente permiso para construir y excavando el canal de Barada y pozos; Dar al-Sabbaghin pasó a los herederos de Salih ibn Ali ibn Abdullah ibn al-Abbas, apoderados de la riqueza omeya; Filastin posee feudos bajo registros califales separados distintos del kharaj común —las categorías takhafif y rudud surgieron cuando al-Rashid hizo que Harthama ibn A'yan restaurara propiedades abandonadas en su reinado, trayendo de vuelta a su gente bajo un kharaj aligerado."
  fr: "La ville d'al-Ramla, dans le jund de Filastin, n'existait pas avant Sulayman ibn Abd al-Malik. Son emplacement était alors une étendue sablonneuse. Il la fonda lorsqu'il gouvernait le district pour son frère al-Walid et en fit un amsar, y construisant son palais et la maison des teinturiers avec sa citerne centrale, puis la mosquée du vendredi, accordant aux habitants l'autorisation de construire et creusant le canal de Barada et des puits. Dar al-Sabbaghin passa aux héritiers de Salih ibn Ali ibn Abdullah ibn al-Abbas, saisi avec la richesse omeyyade. Filastin possède des fiefs sous des registres califaux distincts du kharaj commun: les catégories takhafif et rudud apparaissent lorsque al-Rashid chargea Harthama ibn A'yan de restaurer les domaines abandonnés sous son règne, ramenant leurs habitants sous un kharaj allégé."
