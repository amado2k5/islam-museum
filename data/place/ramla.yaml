label: { ar: "الرملة", en: "al-Ramla" }
summary:
  ar: "مدينة الرملة من جند فلسطين؛ لم تكن موجودة قبل سليمان بن عبد الملك — كان موضعها رملة — فأحدثها وهو والي الجند عن أخيه الوليد ومصّرها فبنى قصره ودار الصباغين بصهريج متوسطها ثم مسجد الجماعة وأذن للناس في البناء وحفر قناة بردة والآبار؛ وصارت دار الصباغين لورثة صالح بن علي بن عبد الله بن العباس لأنها قبضت مع أموال بني أمية؛ وبفلسطين فروز بسجلات منفردة من خراج العامة وبها التخفيف والردود لضياع رفضت في خلافة الرشيد فأعاد إليها هرثمة بن أعين أهلها على تخفيف الخراج. وشهد ابنها المقدسي نحو 375هـ أن ليس في الإسلام أبهى من جامعها الأبيض الذي بناه هشام بن عبد الملك — وروى عن عمّه أن هشاماً ألزم النصارى إظهار أعمدة رخام مدفونة تحت الرمل كانت أعدّت لكنيسة بالعة وإلا هدم كنيسة لدّ — غير أنها في الشتاء جزيرة من الوحل وفي الصيف ذريرة من الرمل وآبارها عميقة مالحة {cite:ahsan-al-taqasim pp. 141-142}."
  en: "The city of al-Ramla in the Filastin jund; it did not exist before Sulayman ibn Abd al-Malik — its site was a sandy tract — he founded it while governing the district for his brother al-Walid and made it an amsar, building his palace and the house of the dyers with its central cistern, then the congregational mosque, granting people leave to build and digging the Barada canal and wells; Dar al-Sabbaghin passed to the heirs of Salih ibn Ali ibn Abdullah ibn al-Abbas, seized with Umayyad wealth; Filastin holds fiefs under separate caliphal registers distinct from the common kharaj — the takhafif and rudud categories arising when al-Rashid had Harthama ibn A'yan restore estates abandoned in his reign, bringing back their people on lightened kharaj."
