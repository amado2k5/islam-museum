label: { ar: "بئر غرس", en: "Bir Ghars", es: "Bir Ghars", fr: "Bir Ghars", ur: "بیر گھرس", tr: "dikim kuyusu.", id: "Sumur tanam" }
summary:
  ar: "بئر بالمدينة كان النبي يستعذب ماءها وكان رباح مولى رسول الله يستقي منها مرة، وقال رسول الله «بئر غرس من عيون الجنة» {cite:ansab-al-ashraf p. 536}."
  en: "A Medina well whose water the Prophet favoured; Rabah his mawla drew from it, and the Prophet said 'the well of Ghars is one of the springs of the Garden' {cite:ansab-al-ashraf p. 536}."
  es: "Un pozo de Medina cuyas aguas eran del agrado del Profeta; Rabah, su mawla, extrajo de él, y el Profeta dijo: \"El pozo de Ghars es uno de los manantiales del Jardín\" {cite:ansab-al-ashraf p. 536}."
  fr: "Un puits de Médine dont l'eau était appréciée du Prophète; Rabah, son maître, y puisait, et le Prophète a dit: « le puits de Ghars est l'une des sources du Jardin » {cite: ansab-al-ashraf p. 536}."
  ur: "مدینہ کا ایک کنواں جس کا پانی نبی نے دیا تھا۔ رباح ان کے مولا نے اس سے متوجہ کیا، اور نبی نے فرمایا کہ 'غرس کا کنواں باغ کے چشموں میں سے ایک چشمہ ہے'۔ 536}۔"
  tr: "Medine'de bir kuyu vardı; Peygamber'in suyu içtiği ve Allah'ın Resulef'inin özgür hizmetçisi Rabah'ın bir zamanlar ondan içerdi. Allah'ın Elçisi şöyle dedi: \"Cennet kaynaklarından dikilmiş bir kuyudur\" {atıf:ansab-al-ashraf, s. 536}."
  id: "Sebuah sumur di Madinah yang airnya biasa diminum oleh Nabi, dan Rabah, hamba Rasulullah yang telah dibebaskan, pernah minum dari sumur itu. Rasulullah berfirman: \"Sebuah sumur yang ditanam dari mata air Surga\" {cite:ansab-al-ashraf, hlm. 536}."
