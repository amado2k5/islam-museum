label: { ar: "الشوط", en: "al-Shawt" }
summary:
  ar: "موضع قرب المدينة، بين المدينة وأحد على طريق الخروج إلى أحد، وفيه سكن ناس من الأنصار وأطم يُعرف بالشرعي. وعنده انسحب عبد الله بن أبي بنحو ثلث الجيش يوم أحد (السمهودي، ص 177 و211 و296؛ ابن هشام، الجزء الأول القسم الثاني، ص 23)."
  en: "A site near Madinah, between Madinah and Uhud on the road out to Uhud, where some of the Ansar lived and where there was a fortified tower known as al-Shar'i. Near it 'Abd Allah ibn Ubayy withdrew with about a third of the army on the day of Uhud (al-Samhudi, pp. 177, 211 and 296; Ibn Hisham, vol. 1 part 2, p. 23)."
