label: { ar: "الشوط", en: "al-Shawt", es: "al-Shawt", fr: "al-Shawt" }
summary:
  ar: "موضع قرب المدينة، بين المدينة وأحد على طريق الخروج إلى أحد، وفيه سكن ناس من الأنصار وأطم يُعرف بالشرعي. وعنده انسحب عبد الله بن أبي بنحو ثلث الجيش يوم أحد ⁦(السمهودي، ص 177 و211 و296؛ ابن هشام، الجزء الأول القسم الثاني، ص 23)⁩."
  en: "A site near Madinah, between Madinah and Uhud on the road out to Uhud, where some of the Ansar lived and where there was a fortified tower known as al-Shar'i. Near it 'Abd Allah ibn Ubayy withdrew with about a third of the army on the day of Uhud (al-Samhudi, pp. 177, 211 and 296; Ibn Hisham, vol. 1 part 2, p. 23)."
  es: "Un sitio cerca de Medina, entre Medina y Uhud, en el camino hacia Uhud, donde vivían algunos de los Ansar y donde había una torre fortificada conocida como al-Shar'i. Cerca de allí, Abd Allah ibn Ubayy se retiró con aproximadamente un tercio del ejército el día de Uhud (al-Samhudi, págs. 177, 211 y 296; Ibn Hisham, vol. 1, parte 2, pág. 23)."
  fr: "Un site près de Médine, entre Médine et Uhud, sur la route menant à Uhud, où vivaient certains Ansar et où se trouvait une tour fortifiée connue sous le nom d'al-Shar'i. C'est près de là que 'Abd Allah ibn Ubayy se retira avec environ un tiers de son armée le jour d'Uhud (al-Samhudi, pp. 177, 211 et 296; Ibn Hisham, vol. 1 partie 2, p. 23)."
