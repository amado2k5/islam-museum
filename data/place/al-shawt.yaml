summary:
  ar: "موضع قرب المدينة، بين المدينة وأحد على طريق الخروج إلى أحد، وفيه سكن ناس من الأنصار وأطم يُعرف بالشرعي. وعنده انسحب عبد الله بن أبي بنحو ثلث الجيش يوم أحد (السمهودي، ص 177 و211 و296؛ ابن هشام، الجزء الأول القسم الثاني، ص 23)."
