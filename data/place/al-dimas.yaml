summary:
  ar: "هيكل أنطاكية يعرف بالديماس على يمين مسجدها الجامع مبني بالآجر العادي والحجر عظيم البنيان، وفي كل سنة يدخل القمر عند طلوعه من باب من أبوابه ومن أعاليه في بعض الأهلة الصيفية، وقد ذكر أنه من بناء الفرس حين ملكت أنطاكية وأنه بيت نار لها {cite:muruj-al-dhahab p. 556}."
