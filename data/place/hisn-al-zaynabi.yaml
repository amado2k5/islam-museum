label: { ar: "حصن الزينبدي", en: "Hisn al-Zaynabi" }
summary:
  ar: "حصن الري على ربضها ويقال له حصن الفرخان بن الزينبدي وكان يدعى عاريناً؛ صالح صاحبه ابن الزينبدي عروة بن زيد عن أهل الري وقومس على خمس مائة ألف درهم وأن لا يقتل منهم أحد ولا يسبى ولا يهدم لهم بيت نار وأن يكونوا أسوة أهل نهاوند في خراجهم فكان عمّال الري ينزلونه ويجتمعون في مسجد بحضرته ثم دخل في مدينة المهدي المحمدية فأمر المهدي بمرمّته ونزله وهو مطل على الجامع ودار الإمارة وجعل بعد سجناً وقال فيه الفطمش بن الأعور: على الجوسق الملعون بالري لا يني على رأسه داعي الأذانة يلمع."
  en: "Rayy's fortress above the town, called Hisn al-Furkhan ibn al-Zaynabi, formerly 'Arin; its lord Ibn al-Zaynabi made the treaty with Urwa ibn Zayd for Rayy and Qumis — five hundred thousand dirhams, no killing, no captives, no fire-temple razed, kharaj on Nihawand's terms — and Rayy's governors dwelt there gathering at the mosque beside it; it fell inside al-Mahdi's al-Muhammadiyya, he ordered its repair and lodged there overlooking the mosque and palace, and it was afterwards made a prison; al-Fatammash's verse curses its keep."
