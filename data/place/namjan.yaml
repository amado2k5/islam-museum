summary:
  ar: "مدينة صغيرة متحضرة يملكها رجل من الأتراك، على ضفة نهر يسمى سوقان، بحسب الإدريسي. {cite:nuzhat-al-mushtaq-2002 p. 923}"
  en: "A small, civilised town ruled by a Turkish man, on the bank of a river called Sūqān, according to al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 923}"
  es: "Según al-Idrisi, se trataba de una pequeña y civilizada ciudad gobernada por un turco, situada a orillas de un río llamado Sūqān. {cite:nuzhat-al-mushtaq-2002 p. 923}"
  fr: "Une petite ville civilisée, gouvernée par un Turc, située sur les rives d'une rivière appelée Sūqān, selon al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 923}"
  ur: "الادریسی کے مطابق، سقان نامی دریا کے کنارے، ایک چھوٹا، مہذب شہر جس پر ایک ترک شخص کی حکومت تھی۔ {حوالہ: نزہت المشتاق-2002 ص۔ 923}"
  tr: "El-İdrisi'ye göre, Sukan adlı bir nehrin kıyısında, Türk bir adama ait küçük, medeni bir şehir. {alıntı:nuzhat-al-mushtaq-2002 s. 923}"
  id: "Sebuah kota kecil yang beradab milik seorang pria Turki, di tepi sungai bernama Sukan, menurut al-Idrisi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 923}"
