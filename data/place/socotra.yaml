summary:
  ar: "جزيرة واسعة كثيرة الشجر، أكثر نباتها شجر الصبر، ويعيش أهلها من جمعه، ويذكر الإدريسي أن أهلها نصارى بسبب ما نُقل إليها من تقاليد قديمة، وأن الإسكندر قد أمر بنقل قوم من اليونانيين إليها لحفظ شجرة الصبر {cite:nuzhat-al-mushtaq-2002 p. 50-51}. وقبله عدّها الهمداني نحو ثمانين فرسخاً فيها نحو عشرة آلاف مقاتل من قبائل مَهْرة وهم نصارى، وروى أهلها أن قوماً من بلد الروم طُرحوا بها زمن كسرى فساكنتهم مَهْرة وتنصّر بعضهم، وبها نخل كثير والعنبر ودم الأخوين والصبر الكثير؛ ويقول أهل عدن أن الروم لم يدخلوها بل سكنتها الرهابنة ثم فنوا {cite:sifat-jazirat-al-arab p. 36}."
  en: "A large island with many trees, mostly aloe, which the islanders harvest. Al-Idrisi says its people are Christian, through an old tradition he attributes to Alexander's time, when Greeks were settled there to tend the aloe {cite:nuzhat-al-mushtaq-2002 p. 50-51}. Earlier, al-Hamdani counts the island near eighty farsakhs with some ten thousand Mahra fighting men, all Christians — its own tradition saying Romans were cast ashore there in Kisra's time, settled by Mahra who partly converted; rich in palms, cast-up amber, dragon's-blood and aloes. The Aden version denies the Romans ever entered, holding hermits inhabited it then died out {cite:sifat-jazirat-al-arab p. 36}."
  es: "Una gran isla con muchos árboles, principalmente aloe, que los isleños cosechan. Al-Idrisi dice que su gente es cristiana, por una antigua tradición que atribuye a la época de Alejandro, cuando los griegos se asentaron allí para cultivar el aloe {cite:nuzhat-al-mushtaq-2002 p. 50-51}. Anteriormente, al-Hamdani cuenta la isla con cerca de ochenta farsakhs con unos diez mil guerreros Mahra, todos cristianos; su propia tradición dice que los romanos desembarcaron allí en tiempos de Kisra, y que Mahra se pobló allí, convirtiéndose parcialmente; rica en palmeras, ámbar, sangre de drago y aloes. La versión de Adén niega que los romanos alguna vez entraran, afirmando que ermitaños la habitaron y luego se extinguieron {cite:sifat-jazirat-al-arab p. 36}."
  fr: "Une grande île boisée, principalement d'aloès, dont les habitants récoltent les fruits. Al-Idrisi affirme que ses habitants sont chrétiens, se basant sur une ancienne tradition qu'il attribue à l'époque d'Alexandre le Grand, lorsque des Grecs s'y étaient installés pour cultiver l'aloès (voir: Nuzhat al-Mushtaq, 2002, p. 50-51). Auparavant, al-Hamdani estimait la superficie de l'île à environ quatre-vingts farsakhs et sa population à quelque dix mille guerriers Mahra, tous chrétiens. Selon une autre tradition, des Romains y auraient débarqué à l'époque de Kisra, et l'île aurait été colonisée par des Mahra dont une partie se serait convertie. L'île serait riche en palmiers, en ambre, en sang-dragon et en aloès. La version d'Aden nie toute présence romaine, affirmant que l'île était habitée par des ermites qui finirent par disparaître (voir: Ifat Jazirat al-Arab, p. 36)."
