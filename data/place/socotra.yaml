summary:
  ar: "جزيرة واسعة كثيرة الشجر، أكثر نباتها شجر الصبر، ويعيش أهلها من جمعه، ويذكر المؤلف أن أهلها نصارى بسبب ما نُقل إليها من تقاليد قديمة، وأن الإسكندر قد أمر بنقل قوم من اليونانيين إليها لحفظ شجرة الصبر {cite:nuzhat-al-mushtaq-2002 p. 50-51}."
  en: "A large island with many trees, mostly aloe, which the islanders harvest. The author says its people are Christian, through an old tradition he attributes to Alexander's time, when Greeks were settled there to tend the aloe {cite:nuzhat-al-mushtaq-2002 p. 50-51}."
