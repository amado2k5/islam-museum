summary:
  ar: "جزيرة واسعة كثيرة الشجر، أكثر نباتها شجر الصبر، ويعيش أهلها من جمعه، ويذكر الإدريسي أن أهلها نصارى بسبب ما نُقل إليها من تقاليد قديمة، وأن الإسكندر قد أمر بنقل قوم من اليونانيين إليها لحفظ شجرة الصبر {cite:nuzhat-al-mushtaq-2002 p. 50-51}. وقبله عدّها الهمداني نحو ثمانين فرسخاً فيها نحو عشرة آلاف مقاتل من قبائل مَهْرة وهم نصارى، وروى أهلها أن قوماً من بلد الروم طُرحوا بها زمن كسرى فساكنتهم مَهْرة وتنصّر بعضهم، وبها نخل كثير والعنبر ودم الأخوين والصبر الكثير؛ ويقول أهل عدن أن الروم لم يدخلوها بل سكنتها الرهابنة ثم فنوا {cite:sifat-jazirat-al-arab p. 36}."
  en: "A large island with many trees, mostly aloe, which the islanders harvest. Al-Idrisi says its people are Christian, through an old tradition he attributes to Alexander's time, when Greeks were settled there to tend the aloe {cite:nuzhat-al-mushtaq-2002 p. 50-51}. Earlier, al-Hamdani counts the island near eighty farsakhs with some ten thousand Mahra fighting men, all Christians — its own tradition saying Romans were cast ashore there in Kisra's time, settled by Mahra who partly converted; rich in palms, cast-up amber, dragon's-blood and aloes. The Aden version denies the Romans ever entered, holding hermits inhabited it then died out {cite:sifat-jazirat-al-arab p. 36}."
