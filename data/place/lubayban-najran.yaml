summary:
  ar: قرية من قرى نجران من اليأميين قصدها الهادي في جمادى الآخرة 286هـ لطلب «المحدثين»؛ يكتبها المحقق «لبينان» عن صفة جزيرة العرب.
  en: A village of Najran among the Yam, to which al-Hadi went in Jumada II 286 AH to seek the "troublemakers"; the editor notes that Sifat Jazirat al-Arab writes "Lubaynan".
  ur: نجران میں یام کی ایک بستی جہاں ہادی جمادی الآخرہ 286ھ میں «فساد برپا کرنے والوں» کی تلاش میں گئے؛ محقق لکھتے ہیں کہ صفۃ جزیرۃ العرب میں «لبینان» ہے۔
  es: "Una aldea de Najran entre los Yam, a la que al-Hadi fue en Jumada II 286 AH para buscar a los \"alborotadores\"; el editor señala que Sifat Jazirat al-Arab escribe \"Lubaynan\"."
  fr: "Un village de Najran parmi les Yam, où al-Hadi se rendit en Jumada II 286 AH pour rechercher les « fauteurs de troubles »; l'éditeur note que Sifat Jazirat al-Arab écrit « Lubaynan »."
  tr: "Necran'a ait Yamayyin kabileleri arasında bir köy; el-Hadi, 286 Hicri yılında 'hadis âlimleri'ni aramak için Jumada al-Akhirah'da ziyaret etmiştir; editör 'Labinan' tarafından Arap Yarımadası'nın tasviri hakkında yazılmıştır."
  id: "Sebuah desa dari Najran di antara suku Yamayyin yang dikunjungi al-Hadi pada Jumada al-Akhirah tahun 286 H untuk mencari 'ulama hadis'; ditulis oleh editor 'Labinan' tentang deskripsi Semenanjung Arab."
