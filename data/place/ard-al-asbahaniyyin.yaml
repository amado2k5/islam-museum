  ur: "بصرہ میں اسبہانی کی زمین، جو عربوں سے خریدی گئی تھی - اصبہانی مذہب تبدیل کرنے والے تھے جو بصرہ ہجرت کر گئے تھے، کہا جاتا ہے کہ وہ وہاں آباد ہونے والے اساویرہ میں سے تھے۔"
