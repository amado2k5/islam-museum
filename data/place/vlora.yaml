summary:
  ar: "مدينة في جنوب ألبانيا على خليج فلورا، واسمها القديم أولون، وكانت بلدة لها دور مهم في البحر الأدرياتيكي. وقد دخلها العثمانيون سنة 1417م، وظلت ملكًا عثمانيًا وقاعدة لمهاجمة أبوليا في عهد محمد الفاتح، وانتزع الألبان استقلالها سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A town of southern Albania on the bay of the same name, called Aulon in antiquity and Awlonya by the Ottomans. The Ottomans occupied it in June 1417, and it remained Ottoman property and a base against the West; Mehmed II twice used it as a base for raids on Apulia. Albanian independence was declared there in 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  es: "Ciudad del sur de Albania, situada en la bahía del mismo nombre, llamada Aulon en la antigüedad y Awlonya por los otomanos. Los otomanos la ocuparon en junio de 1417 y permaneció bajo dominio otomano, sirviendo como base contra Occidente. Mehmed II la utilizó en dos ocasiones como base para incursiones en Apulia. La independencia de Albania se proclamó allí en 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  fr: "Ville du sud de l'Albanie située sur la baie du même nom, appelée Aulon dans l'Antiquité et Awlonya par les Ottomans. Occupée par ces derniers en juin 1417, elle demeura leur possession et leur servit de base contre l'Occident; Mehmed II l'utilisa à deux reprises comme camp de base pour des raids sur les Pouilles. L'indépendance de l'Albanie y fut proclamée en 1912."
  ur: "اسی نام کی خلیج پر جنوبی البانیہ کا ایک قصبہ جسے قدیم زمانے میں اولون کہا جاتا تھا اور عثمانیوں کا اولونیا۔ جون 1417 میں عثمانیوں نے اس پر قبضہ کر لیا، اور یہ عثمانیوں کی ملکیت اور مغرب کے خلاف ایک اڈہ بنا رہا۔ محمد دوم نے اسے دو بار اپولیا پر چھاپوں کے لیے اڈے کے طور پر استعمال کیا۔ البانوی آزادی کا اعلان وہاں 1912 میں کیا گیا تھا {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 816}۔"
  tr: "Güney Arnavutluk'ta, Flora Körfezi'nde, eskiden Ulun olarak bilinen bir şehir olan bu şehir, Adriyatik Denizi'nde önemli bir rol oynamıştır. Osmanlılar 1417 yılında buraya girmiş ve Fatih Mehmed'in saltanatı sırasında Osmanlı kralı ve Apulya'ya saldırı üssü olarak kalmıştır. Arnavutlar 1912'de bağımsızlıklarını kazanmıştır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 816}."
  id: "Sebuah kota di Albania selatan di Teluk Flora, sebelumnya dikenal sebagai Ulun, kota ini memainkan peran penting di Laut Adriatik. Ottoman memasukinya pada tahun 1417 M, dan kota ini tetap menjadi raja Ottoman serta basis untuk menyerang Apulia selama masa pemerintahan Mehmed Sang Penakluk. Orang Albania meraih kemerdekaannya pada tahun 1912 {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 816}."
