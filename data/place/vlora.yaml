label:
  ar: "فلورا (أولونيا)"
  en: "Vlora (Awlonya, Valona)"
summary:
  ar: "مدينة في جنوب ألبانيا على خليج فلورا، واسمها القديم أولون، وكانت بلدة لها دور مهم في البحر الأدرياتيكي. وقد دخلها العثمانيون سنة 1417م، وظلت ملكًا عثمانيًا وقاعدة لمهاجمة أبوليا في عهد محمد الفاتح، وانتزع الألبان استقلالها سنة 1912م {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A town of southern Albania on the bay of the same name, called Aulon in antiquity and Awlonya by the Ottomans. The Ottomans occupied it in June 1417, and it remained Ottoman property and a base against the West; Mehmed II twice used it as a base for raids on Apulia. Albanian independence was declared there in 1912 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
