summary:
  ar: "مدينة جليلة ضخمة الأسواق من كورة شريش في غرب الأندلس؛ قال الحجاري إنها بنت إشبيلية وواديها ابن واديها، ولأهلها همم وظرف في اللباس وإظهار الرفاهية وتخلق بالآداب، ولا تكاد ترى بها إلا عاشقاً ومعشوقاً، ولها من الفواكه ما يعم ويفضل، ومما اختصت به إحسان الصنعة في المجبنات وطيب جبنها، ويقول أهل الأندلس: من دخل شريش ولم يأكل بها المجبنات فهو محروم {cite:nafh-tib-maqqari p. 199}."
  en: "Jerez (Sharish) — 'daughter of Seville,' a city of broad markets whose people showed ambition, elegance in dress and polished manners; famous for its fruits, its cheese and above all its mujabbanat pastries — 'whoever enters Jerez without eating them is deprived' {cite:nafh-tib-maqqari p. 199}."
  es: "Jerez (Sharish) — 'hija de Sevilla', una ciudad de amplios mercados cuyos habitantes mostraban ambición, elegancia en el vestir y modales refinados; famosa por sus frutas, su queso y, sobre todo, por sus pasteles mujabbanat — 'quien entra en Jerez sin probarlos queda privado' {cite:nafh-tib-maqqari p. 199}."
  fr: "Jerez (Sharish) — « fille de Séville », une ville aux vastes marchés dont les habitants affichaient ambition, élégance vestimentaire et manières raffinées; célèbre pour ses fruits, son fromage et surtout ses pâtisseries mujabbanat — « quiconque entre à Jerez sans les avoir mangées est privé » {cite:nafh-tib-maqqari p. 199}."
  ur: "جیریز ⁦(شارش)⁩ - 'سیویل کی بیٹی'، وسیع بازاروں کا ایک شہر جس کے لوگوں نے عزائم، لباس میں خوبصورتی اور پالش آداب کا مظاہرہ کیا۔ اپنے پھلوں، اس کے پنیر اور سب سے بڑھ کر اس کی مجبّنات پیسٹری کے لیے مشہور ہے - 'جو کوئی ان کو کھائے بغیر جیریز میں داخل ہوا وہ محروم ہے'۔ 199}۔"
  tr: "Batı Endülüs'teki Kora Shreish gibi geniş pazarlara sahip soylu bir şehir; Al-Hajari bunun Sevilla'nın kızı olduğunu ve vadisinin vadisinin oğlu olduğunu söyledi. Halkının hırsları, giyim ve lüks göstermede bir tarzı vardır ve görgü kurallarıyla yaratılmışlardır. Orada neredeyse kimseyi göremezsiniz, sadece bir aşık ve aşık. Yaygın ve tercih edilen meyveleri vardır ve benzersiz özellikleri arasında peynir ustalığı ve peynirinin tadı bulunur. Endülüs halkı der ki: Shreish'e girip orada peynir yemeyen yoksundur. {cite:nafh-tib-maqqari s. 199}."
  id: "Sebuah kota bangsawan dengan pasar luas seperti Kora Shreish di Andalusia barat; Al-Hajari mengatakan bahwa kota ini adalah putri Sevilla dan lembahnya adalah anak lembahnya. Penduduknya memiliki ambisi dan rasa gaya dalam berpakaian serta menunjukkan kemewahan, dan mereka diciptakan dengan sopan santun. Anda hampir tidak bisa melihat siapa pun di sana kecuali seorang kekasih dan kekasih. Kota ini memiliki buah-buahan yang luas dan disukai, dan di antara keunikannya adalah kerajinan keju dan rasa kejunya. Orang-orang Andalusia berkata: Siapa pun yang masuk ke Shreish dan tidak makan keju di sana akan dirugikan. {cite:nafh-tib-maqqari hlm. 199}."
