summary:
  ar: "مدينة جليلة ضخمة الأسواق من كورة شريش في غرب الأندلس؛ قال الحجاري إنها بنت إشبيلية وواديها ابن واديها، ولأهلها همم وظرف في اللباس وإظهار الرفاهية وتخلق بالآداب، ولا تكاد ترى بها إلا عاشقاً ومعشوقاً، ولها من الفواكه ما يعم ويفضل، ومما اختصت به إحسان الصنعة في المجبنات وطيب جبنها، ويقول أهل الأندلس: من دخل شريش ولم يأكل بها المجبنات فهو محروم {cite:nafh-tib-maqqari p. 199}."
  en: "Jerez (Sharish) — 'daughter of Seville,' a city of broad markets whose people showed ambition, elegance in dress and polished manners; famous for its fruits, its cheese and above all its mujabbanat pastries — 'whoever enters Jerez without eating them is deprived' {cite:nafh-tib-maqqari p. 199}."
