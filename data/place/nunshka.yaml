summary:
  ar: "جزيرة في البحر قرب ساحل قمانية البيض، يصاد حولها نوع من السمك يذكر المؤلف ما حكاه المخبرون عنه {cite:nuzhat-al-mushtaq-2002 p. 921}."
  en: "An island off the coast of the White Qumans where a kind of fish is caught; the author records what informants told him about it {cite:nuzhat-al-mushtaq-2002 p. 920} {cite:nuzhat-al-mushtaq-2002 p. 921}."
  es: "Una isla frente a la costa de los Qumanes Blancos donde se pesca un tipo de pez; el autor registra lo que los informantes le contaron al respecto {cite:nuzhat-al-mushtaq-2002 p. 920} {cite:nuzhat-al-mushtaq-2002 p. 921}."
  fr: "Une île au large des côtes des Qumans Blancs où l'on pêche une sorte de poisson; l'auteur consigne ce que des informateurs lui ont dit à ce sujet {cite:nuzhat-al-mushtaq-2002 p. 920} {cite:nuzhat-al-mushtaq-2002 p. 921}."
  ur: "سفید Qumans کے ساحل سے دور ایک جزیرہ جہاں ایک قسم کی مچھلیاں پکڑی جاتی ہیں۔ مصنف نے درج کیا ہے کہ مخبروں نے اسے اس کے بارے میں کیا بتایا۔ 920} {حوالہ: نزہت المشتاق-2002 ص۔ 921}۔"
  tr: "Qumaniyat al-Bayd kıyısına yakın denizde bir ada, etrafında bir balık türü avlanıyor. Yazar, muhbirlerin bu ada hakkında anlattıklarını belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 921}."
  id: "Sebuah pulau di laut dekat pantai Qumaniyat al-Bayd, di sekitar mana jenis ikan ditangkap. Penulis menyebutkan apa yang dikatakan informan tentangnya {cite:Nuzhat-al-Mushtaq-2002, hlm. 921}."
