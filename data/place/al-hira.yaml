summary:
  en: "The Arab capital on the edge of Iraq’s Sawad, seat of the Lakhmid kings who guarded Persia’s frontier from Ardashir’s day until 632."
  ar: "عاصمة ملوك العرب على تخوم سواد العراق؛ مقر المناذرة ولاة فارس على البادية من عهد أردشير حتى سنة 632م. وعند البلاذري: صالحها خالد بن الوليد سنة اثنتي عشرة على مائة ألف درهم — ويُقال ثمانين ألفاً — وعلى أن يكونوا عيوناً للمسلمين على الفرس وأن لا يهدم لهم بيعة ولا قصر وهو أول مال حمل إلى المدينة من العراق؛ وتحصّن أهلها في القصر الأبيض وقصر ابن بقيلة وقصر المديسيين. وعند المسعودي أن أول من نزلها من الملوك واتخذها دار ملك عمرو بن عدي بن نصر ابن أخت جذيمة، وإليه تنسب الملوك النصرانية ملوك الحيرة {cite:muruj-al-dhahab p. 409}"
  ur: "عراق کے سواد کے کنارے عرب بادشاہوں کا مرکز اور مناذرہ کا دارالحکومت؛ بلاذری خالد بن ولید کے ساتھ اس کی صلح اور وہاں کے قلعوں کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
  es: "La capital árabe en los confines del Sawad iraquí, sede de los reyes Lakhmid que custodiaron la frontera de Persia desde la época de Ardashir hasta el año 632."
  fr: "La capitale arabe aux confins du Sawad irakien, siège des rois lakhmides qui gardèrent la frontière de la Perse depuis l'époque d'Ardashir jusqu'en 632."
  tr: "Kara Irak sınırlarındaki Arap krallarının başkenti; Erdeşir'den 632 yılına kadar çöl üzerindeki İran valileri olan El-Munadhiri'nin merkezi. El-Baladhuri'ye göre: Halid bin el-Velid, on ikinci yılda yüz bin dirhem ya da seksen bin dirhem karşılığında onunla barış yaptı; şartıyla, Müslümanların Persler üzerindeki gözü olmaları ve onlar için hiçbir bağlılık ya da saray yıkılmaması şartıyla barıştı; ve halkı Beyaz Saray, İbn Buqayla sarayı ve Madislerin sarayında tahkim etti. Al-Mas'udhi'ye göre, burayı yerleşen ve Amr bin Adi ibn Nasr'ın ikametgahı olarak kabul eden ilk kral, Cahmima'nın kız kardeşinin oğlu Amr bin Adi ibn Nasr'ın ikametgahı olarak kabul eden ve Hristiyan kralların el-Hirah kralları olarak atfedildiği yerdir. {cit:] Muruj-al-Dhahab, s. 409}"
  id: "Ibu kota raja-raja Arab di perbatasan Irak hitam; kediaman Al-Munadhiri, para gubernur Persia di atas gurun sejak masa pemerintahan Ardashir hingga 632 M. Menurut al-Baladhuri: Khalid ibn al-Walid berdamai dengannya pada tahun dua belas dengan harga seratus ribu dirham—atau dikatakan delapan puluh ribu—dengan syarat mereka menjadi mata Muslim atas Persia, dan tidak ada kesetiaan atau istana yang dihancurkan untuk mereka, yang merupakan ibu kota pertama yang dibawa ke kota dari Irak; dan rakyatnya memperkuat diri di Istana Putih, istana Ibn Buqayla, dan istana Madisi. Menurut al-Mas'udhi, raja pertama yang menetap dan menjadikannya kediaman Amr ibn Adi ibn Nasr, putra saudari Jadhima, yang menjadi raja Kristen yang dianggap raja al-Hirah. {cite:muruj-al-dhahab, hlm. 409}"
