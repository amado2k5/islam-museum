summary:
  en: "The Arab capital on the edge of Iraq’s Sawad, seat of the Lakhmid kings who guarded Persia’s frontier from Ardashir’s day until 632."
  ar: "عاصمة ملوك العرب على تخوم سواد العراق؛ مقر المناذرة ولاة فارس على البادية من عهد أردشير حتى سنة 632م. وعند البلاذري: صالحها خالد بن الوليد سنة اثنتي عشرة على مائة ألف درهم — ويُقال ثمانين ألفاً — وعلى أن يكونوا عيوناً للمسلمين على الفرس وأن لا يهدم لهم بيعة ولا قصر وهو أول مال حمل إلى المدينة من العراق؛ وتحصّن أهلها في القصر الأبيض وقصر ابن بقيلة وقصر المديسيين. وعند المسعودي أن أول من نزلها من الملوك واتخذها دار ملك عمرو بن عدي بن نصر ابن أخت جذيمة، وإليه تنسب الملوك النصرانية ملوك الحيرة {cite:muruj-al-dhahab p. 409}"
