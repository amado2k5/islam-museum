summary:
  ar: "مدينة كثيرة الخيرات، فيها حديد كثير يُتجهز به إلى سائر الآفاق من بلاد الترك، وملكها يوم خنيف. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  en: "A city of abundant produce with much iron that is shipped to every land from the Turkish country; its ruler holds a light audience. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  es: "Una ciudad de abundante producción agrícola y con mucho hierro que se exporta a todas partes desde Turquía; su gobernante tiene una audiencia reducida. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  fr: "Une ville prospère, riche en produits agricoles et en fer, exportée de Turquie vers le monde entier; son souverain reçoit en audience légère. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  ur: "بہت زیادہ لوہے کے ساتھ وافر پیداوار کا ایک شہر جو ترکی کے ملک سے ہر ملک میں بھیج دیا جاتا ہے۔ اس کا حکمران ہلکا سا سامعین رکھتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 521}"
  tr: "Kutsal dolu bir şehir, Türk topraklarının her köşesine ulaşmak için kullanılacak bol demirle dolu, kralı Khenif Günü'ydü. {cite:nuzhat-al-mushtaq-2002 s. 521}"
  id: "Sebuah kota yang penuh berkah, dengan besi melimpah untuk menjangkau seluruh cakrawala tanah Turkik, dan rajanya adalah Hari Khenif. {cite:nuzhat-al-mushtaq-2002 hlm. 521}"
