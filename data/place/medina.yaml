summary:
  ar: "مدينة في الحجاز هاجر إليها النبي سنة 622م، وفيها المسجد النبوي وأول مجتمع إسلامي. حرَّمها النبي كما حرَّم إبراهيم مكة، حدود حرمها «ما بين عير إلى ثور» — أو «إلى أحد» في تصحيح أبي عبيد والحازمي — و«ما بين لابتيها» أي حرَّتيها، فحرم فيها الصيد وقطع الشجر وغُلِّظت فيها دية الخطأ {cite:samhudi-wafa-al-wafa p. 92-118}. وعند السمهودي لها نحو خمسة وتسعين اسماً منها طيبة وطابة ويثرب {cite:samhudi-wafa-al-wafa p. 36}. وفي الصحيح «أُمرت بقرية تأكل القرى — يقولون يثرب وهي المدينة — تنفي الناس كما ينفي الكير خبث الحديد» {cite:sahih-al-bukhari 1871}، ولما أشرفوا عليها مقبلين من تبوك قال «هذه طابة» {cite:sahih-al-bukhari 1872}. وتصفها دائرة المعارف الإسلامية بأنها مقام النبي بعد الهجرة وإحدى مدن الإسلام المقدسة، واحة كانت قبل الإسلام مساكن متفرقة تتقاسمها عشائر عربية وجماعات يهودية، ثم مقرّ الخلفاء الأوائل حتى انتقل مركز الخلافة عنها سنة 656م، ثم مدينة أهدأ دخلت في الحكم السعودي في كانون الأول ديسمبر 1925م."
  en: "City in the Hejaz to which the Prophet migrated in 622 CE; site of the Prophet's Mosque and the first Muslim community. The Prophet declared it a sanctuary as Abraham declared Mecca — its bounds 'between 'Ayr and Thawr' (or 'to Uhud' in the reading Abu 'Ubayd and al-Hazimi preferred) and 'between its two lava fields'; within them hunting and tree-cutting are forbidden and the bloodwit for unintended killing is heavier {cite:samhudi-wafa-al-wafa p. 92-118}. Samhudi counts nearly ninety-five names for it, among them Tayba, Taba and Yathrib {cite:samhudi-wafa-al-wafa p. 36}. The Encyclopaedia of Islam describes it as the residence of the Prophet after the hijra and one of the sacred cities of Islam: before Islam an oasis of scattered settlements shared by Arab clans and Jewish groups, then the seat of the first caliphs until the centre of the caliphate moved away from it in 656 CE, and afterwards a quieter city that came under Saudi rule in December 1925."
  ur: "حجاز کا وہ شہر جہاں نبی 622ء میں ہجرت کر کے آئے، اور جہاں مسجدِ نبوی اور پہلا اسلامی معاشرہ وجود میں آیا۔ دائرۃ المعارف اسلامیہ اسے ہجرت کے بعد نبی کی قیام گاہ اور اسلام کے مقدس شہروں میں سے ایک بتاتا ہے: اسلام سے پہلے عرب قبائل اور یہودی گروہوں میں بٹا نخلستان، پھر ابتدائی خلفا کا مرکز یہاں تک کہ 656ء میں خلافت کا مرکز اس سے منتقل ہو گیا، اور بعد میں ایک پرسکون شہر جو دسمبر 1925ء میں سعودی حکومت کے تحت آیا۔"
