label: { en: Medina, ar: المدينة المنورة }
summary:
  ar: "مدينة في الحجاز هاجر إليها النبي سنة 622م، وفيها المسجد النبوي وأول مجتمع إسلامي. حرَّمها النبي كما حرَّم إبراهيم مكة، حدود حرمها «ما بين عير إلى ثور» — أو «إلى أحد» في تصحيح أبي عبيد والحازمي — و«ما بين لابتيها» أي حرَّتيها، فحرم فيها الصيد وقطع الشجر وغُلِّظت فيها دية الخطأ {cite:samhudi-wafa-al-wafa p. 92-118}. وعند السمهودي لها نحو خمسة وتسعين اسماً منها طيبة وطابة ويثرب {cite:samhudi-wafa-al-wafa p. 36}. وفي الصحيح «أُمرت بقرية تأكل القرى — يقولون يثرب وهي المدينة — تنفي الناس كما ينفي الكير خبث الحديد» {cite:sahih-al-bukhari 1871}، ولما أشرفوا عليها مقبلين من تبوك قال «هذه طابة» {cite:sahih-al-bukhari 1872}."
  en: "City in the Hejaz to which the Prophet migrated in 622 CE; site of the Prophet's Mosque and the first Muslim community. The Prophet declared it a sanctuary as Abraham declared Mecca — its bounds 'between 'Ayr and Thawr' (or 'to Uhud' in the reading Abu 'Ubayd and al-Hazimi preferred) and 'between its two lava fields'; within them hunting and tree-cutting are forbidden and the bloodwit for unintended killing is heavier {cite:samhudi-wafa-al-wafa p. 92-118}. Samhudi counts nearly ninety-five names for it, among them Tayba, Taba and Yathrib {cite:samhudi-wafa-al-wafa p. 36}."
