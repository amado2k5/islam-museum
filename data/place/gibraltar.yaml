label: { ar: "الزقاق وجبل طارق", en: "The Strait and Jabal Tariq", es: "El estrecho y Jabal Tariq", fr: "Le détroit et Jabal Tariq", ur: "آبنائے جبل طارق" }
summary:
  ar: "مضيق البحر بين الأندلس والمغرب؛ جبل طارق نسب إلى طارق بن زياد لنزوله به يوم السبت في شعبان سنة 92هـ ويعرفه العامة بجبل الفتح في قبلة الجزيرة الخضراء، وذكر بعض المؤرخين أن الإسكندر لما اجتاز بأهل الأندلس وشكوا إليه إضرار أهل المغرب الأقصى بهم أمر المهندسين بوزن سطح ماء المحيط والبحر الشامي فوجدوا المحيط يعلوه بشيء يسير فحفر ما بين طنجة والأندلس وبنى رصيفين بينهما سعة ستة أميال ثم أطلق فم الماء بينهما فدخل في البحر الشامي وأغرق مدناً كثيرة، وأهل الجزيرتين يسمون الرصيف الذي يلي بلاد الأندلس القنطرة {cite:nafh-tib-maqqari p. 171-172}."
  en: "The strait and Jabal Tariq, named for Tariq b. Ziyad's landing in Sha'ban 92; the chroniclers report that Alexander's engineers, finding the Ocean higher than the Mediterranean, dug the channel between Tangier and al-Andalus with twin causeways six miles apart — the northern one still shows at low water and is called al-Qantara {cite:nafh-tib-maqqari p. 171-172}."
  es: "El estrecho y Jabal Tariq, llamado así por el desembarco de Tariq b. Ziyad en Sha'ban 92; los cronistas informan que los ingenieros de Alejandro, al encontrar el océano más alto que el Mediterráneo, excavaron el canal entre Tánger y al-Ándalus con dos calzadas separadas por seis millas; la del norte todavía se ve con la marea baja y se llama al-Qantara {cite:nafh-tib-maqqari p. 171-172}."
  fr: "Le détroit et Jabal Tariq, nommé d'après le débarquement de Tariq b. Ziyad en Sha'ban 92; les chroniqueurs rapportent que les ingénieurs d'Alexandre, constatant que l'océan était plus haut que la Méditerranée, ont creusé le canal entre Tanger et al-Andalus avec deux chaussées jumelles distantes de six milles — la chaussée nord est toujours visible à marée basse et est appelée al-Qantara {cite:nafh-tib-maqqari p. 171-172}."
  ur: "آبنائے اور جبل طارق جس کا نام طارق ب کے لیے رکھا گیا ہے۔ شعبان میں زیاد کا اترنا 92; تاریخ نگاروں نے رپورٹ کیا ہے کہ سکندر کے انجینئروں نے بحیرہ روم سے اونچا سمندر تلاش کرتے ہوئے تانگیر اور الاندلس کے درمیان چھ میل کے فاصلے پر جڑواں کاز ویز کے ساتھ نالہ کھودا - شمالی حصہ اب بھی کم پانی پر دکھائی دیتا ہے اور اسے القنطارہ کہا جاتا ہے۔ 171-172}۔"
