label: { ar: "الزقاق وجبل طارق" }
summary:
  ar: "مضيق البحر بين الأندلس والمغرب؛ جبل طارق نسب إلى طارق بن زياد لنزوله به يوم السبت في شعبان سنة 92هـ ويعرفه العامة بجبل الفتح في قبلة الجزيرة الخضراء، وذكر بعض المؤرخين أن الإسكندر لما اجتاز بأهل الأندلس وشكوا إليه إضرار أهل المغرب الأقصى بهم أمر المهندسين بوزن سطح ماء المحيط والبحر الشامي فوجدوا المحيط يعلوه بشيء يسير فحفر ما بين طنجة والأندلس وبنى رصيفين بينهما سعة ستة أميال ثم أطلق فم الماء بينهما فدخل في البحر الشامي وأغرق مدناً كثيرة، وأهل الجزيرتين يسمون الرصيف الذي يلي بلاد الأندلس القنطرة {cite:nafh-tib-maqqari p. 171-172}."
  en: "The strait and Jabal Tariq, named for Tariq b. Ziyad's landing in Sha'ban 92; the chroniclers report that Alexander's engineers, finding the Ocean higher than the Mediterranean, dug the channel between Tangier and al-Andalus with twin causeways six miles apart — the northern one still shows at low water and is called al-Qantara {cite:nafh-tib-maqqari p. 171-172}."
