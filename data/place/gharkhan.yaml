  ar: "مدينة كبيرة عامرة بأهلها، يسكن بها ملك اسقوتيا، ويذكر المؤلف أنها تبعد عن نمجان ثماني مراحل {cite:nuzhat-al-mushtaq-2002 p. 924}."
  en: "A large, populous city where the king of Isqawtiya resides; the author gives eight stages from Namjān {cite:nuzhat-al-mushtaq-2002 p. 924}."
