  fr: "Une grande ville peuplée où réside le roi d'Isqawtiya; l'auteur donne huit étapes à partir de Namjān {cite:nuzhat-al-mushtaq-2002 p. 924}."
  ur: "ایک بڑا، آبادی والا شہر جہاں اسقوطیہ کا بادشاہ رہتا ہے۔ مصنف نے نمجان سے آٹھ مراحل بیان کیے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 924}۔"
  tr: "Halkıyla dolu büyük bir şehir, İsqotia kralı tarafından yaşanmıştır. Yazar, buranın Namjan'a sekiz aşama uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 924}."
  id: "Sebuah kota besar yang dipenuhi penduduknya, dihuni oleh raja Isqotia. Penulis menyebutkan bahwa kota ini berjarak delapan tahap dari Namjan {cite:Nuzhat-al-Mushtaq-2002, hlm. 924}."
