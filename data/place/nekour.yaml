summary:
  ar: "نكور، مدينة قديمة على ساحل الريف بالمغرب الأقصى بين نهرين أحدهما نكور ومخرجه من بلاد كزناية؛ كانت دار ملك بني صالح بن منصور من غمارة، وغزاها المجوس في أساطيلهم سنة 244هـ فاستباحوها ثمانية أيام، وخربها موسى بن أبي العافية سنة 317هـ فبقيت خلاء ولم تُعمر بعده {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  en: "Nekour, an ancient city on the Rif coast of the Far Maghreb between two rivers, one the Nekour rising in the Kaznaya lands; seat of the Banu Salih ibn Mansur kings of Ghumara — the Majus raiders sacked it for eight days in 244 AH, Musa ibn Abi al-Afiya destroyed it in 317, and Ibn Tashfin ruined it again so that it was never re-inhabited {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
