summary:
  ar: "نكور، مدينة قديمة على ساحل الريف بالمغرب الأقصى بين نهرين أحدهما نكور ومخرجه من بلاد كزناية؛ كانت دار ملك بني صالح بن منصور من غمارة، وغزاها المجوس في أساطيلهم سنة 244هـ فاستباحوها ثمانية أيام، وخربها موسى بن أبي العافية سنة 317هـ فبقيت خلاء ولم تُعمر بعده {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  en: "Nekour, an ancient city on the Rif coast of the Far Maghreb between two rivers, one the Nekour rising in the Kaznaya lands; seat of the Banu Salih ibn Mansur kings of Ghumara — the Majus raiders sacked it for eight days in 244 AH, Musa ibn Abi al-Afiya destroyed it in 317, and Ibn Tashfin ruined it again so that it was never re-inhabited {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  es: "Nekour, una antigua ciudad en la costa del Rif del Magreb lejano entre dos ríos, uno de ellos el Nekour que nace en las tierras de Kaznaya; sede de los reyes Banu Salih ibn Mansur de Ghumara: los asaltantes Majus la saquearon durante ocho días en el año 244 de la Hégira, Musa ibn Abi al-Afiya la destruyó en el año 317, e Ibn Tashfin la arruinó de nuevo, de modo que nunca más fue habitada {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  fr: "Nekour, une ancienne ville sur la côte rifaine du Maghreb lointain, entre deux rivières, dont la Nekour prenant sa source dans les terres de Kaznaya; siège des rois Banu Salih ibn Mansur de Ghumara — les pillards Majus la saccagèrent pendant huit jours en 244 AH, Musa ibn Abi al-Afiya la détruisit en 317, et Ibn Tashfin la ruina à nouveau de sorte qu'elle ne fut jamais réhabitée {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  ur: "نیکور، دو دریاؤں کے درمیان دور مغرب کے رف ساحل پر ایک قدیم شہر، ایک نیکور کازنیا کی سرزمین میں ابھرتا ہے۔ غمارہ کے بنو صالح بن منصور بادشاہوں کا تخت نشین - مجوس حملہ آوروں نے اسے 244 ہجری میں آٹھ دن تک برباد کیا، موسیٰ ابن ابی العفیہ نے اسے 317 میں تباہ کر دیا، اور ابن تاشفین نے اسے دوبارہ برباد کر دیا تاکہ یہ دوبارہ آباد نہ ہو سکے۔ 1662-1663}۔"
  tr: "Nakur, Fas'ın en batısında, Rif kıyısında yer alan eski bir şehirdir; iki nehir arasında yer alır; bunlardan biri Kaznaya'nın çıkış noktası olan Nakur'dur; Banu Salih bin Mansur'un Ghamara'dan ikametgahıydı. 244 Hicri yılında Magi filolarıyla sekiz gün boyunca bastına girmiştir. Musa bin Abi Al-Afiyah 317 Hicri'nde burayı yok etmiş, terk edilmiş ve sonrasında bir daha inşa edilmemiştir {cite:History-ibn-khaldun-ibar s. 1662-1663}."
  id: "Nakur adalah kota kuno di pesisir Rif di barat jauh Maroko, di antara dua sungai, salah satunya adalah Nakur, yang merupakan muara Kaznaya; kota ini adalah kediaman raja Banu Saleh bin Mansur dari Ghamara. Kota ini diserang oleh orang Majus dengan armada mereka pada tahun 244 H, yang menyerbu selama delapan hari. Musa bin Abi Al-Afiyah menghancurkannya pada tahun 317 H, meninggalkannya kosong dan tidak pernah dibangun kembali setelahnya {cite:History-ibn-khaldun-ibar hlm. 1662-1663}."
