summary:
  ar: "شعب بمكة حُبس فيه بنو هاشم وبنو المطلب مؤمنهم وكافرهم، ومعهم النبي، ثلاث سنين في المقاطعة التي فرضتها قريش، من ليلة هلال المحرم سنة سبع من البعثة."
  en: "A ravine at Mecca where Banu Hashim and Banu al-Muttalib, believers and unbelievers alike, were confined with the Prophet for three years under the boycott Quraysh imposed, from the night of the Muharram crescent in the seventh year of the mission."
  es: "Un barranco en La Meca donde Banu Hashim y Banu al-Muttalib, creyentes e incrédulos por igual, estuvieron confinados con el Profeta durante tres años bajo el boicot impuesto por los Quraysh, desde la noche de la luna creciente de Muharram en el séptimo año de la misión."
  fr: "Un ravin à La Mecque où les Banu Hashim et les Banu al-Muttalib, croyants et incroyants confondus, furent confinés avec le Prophète pendant trois ans en raison du boycott imposé par les Quraysh, à partir de la nuit du croissant de Muharram de la septième année de la mission."
  ur: "مکہ میں ایک گھاٹی جہاں بنو ہاشم اور بنو المطلب، مومن اور کافر یکساں طور پر، تین سال تک رسول اللہ کے ساتھ قریش کے بائیکاٹ کے تحت، مشن کے ساتویں سال محرم کے چاند کی رات سے قید رہے۔"
  tr: "Mekke'de bir halkı, Peygamber'in misyonundan yedinci yıl sonra Muharrem hilal gecesinden itibaren Kureyş'in uyguladığı boykot nedeniyle üç yıl hapsedildi."
  id: "Sebuah bangsa di Mekah dipenjara selama tiga tahun dalam boikot yang diberlakukan oleh Quraisy sejak malam bulan sabit Muharram pada tahun ketujuh setelah misi Nabi."
