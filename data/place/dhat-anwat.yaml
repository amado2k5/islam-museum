summary:
  ar: "شجرة عظيمة خضراء كانت قريش والعرب يعلقون عليها أسلحتهم ويذبحون عندها، مرّ بها الصحابة في طريقهم إلى حنين، فقال النبي: «هكذا فعل قوم موسى» ⁦(الأزرقي، ص 203–204 من الماسح)⁩."
  en: "A great green tree on which Quraysh and the Arabs would hang their weapons, and at which they would slaughter animals. When the Companions passed it on their way to Hunayn, the Prophet said: “Thus did the people of Moses act” (al-Azraqi, pp. 203–204 of the scan)."
  es: "Un gran árbol verde del que los Quraysh y los árabes colgaban sus armas y donde sacrificaban animales. Cuando los Compañeros pasaron junto a él camino a Hunayn, el Profeta dijo: «Así actuaba el pueblo de Moisés» (al-Azraqi, págs. 203-204 del escaneo)."
  fr: "Un grand arbre verdoyant où les Qurayshites et les Arabes suspendaient leurs armes et où ils abattaient des animaux. Lorsque les Compagnons passèrent devant cet arbre en se rendant à Hunayn, le Prophète dit: « C’est ainsi que le peuple de Moïse agissait » (al-Azraqi, pp. 203-204 du scan)."
  ur: "ایک بڑا سبز درخت جس پر قریش اور عرب اپنے ہتھیار لٹکا دیتے تھے اور جس پر جانور ذبح کرتے تھے۔ جب صحابہ کرام حنین کے راستے میں اس سے گزرے تو نبی نے فرمایا: \"اس طرح موسیٰ کی قوم نے عمل کیا\" ⁦(الازراقی، صفحہ 203-204 اسکین)⁩۔"
