summary:
  ar: "شجرة عظيمة خضراء كانت قريش والعرب يعلقون عليها أسلحتهم ويذبحون عندها، مرّ بها الصحابة في طريقهم إلى حنين، فقال النبي: «هكذا فعل قوم موسى» (الأزرقي، ص 203–204 من الماسح)."
  en: "A great green tree on which Quraysh and the Arabs would hang their weapons, and at which they would slaughter animals. When the Companions passed it on their way to Hunayn, the Prophet said: “Thus did the people of Moses act” (al-Azraqi, pp. 203–204 of the scan)."
