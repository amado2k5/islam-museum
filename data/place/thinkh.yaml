summary:
  ar: "مدينة في أرض التبت، حصينة عليها سور من حجارة، ولها باب واحد، وفيها أعمال وتجارات كثيرة مع من جاورهم. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  en: "A fortified town in Tibet with a stone wall and a single gate, with much trade with its neighbours. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  es: "Ciudad fortificada en el Tíbet con muralla de piedra y una sola puerta, con un intenso comercio con sus vecinos. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  fr: "Une ville fortifiée du Tibet, entourée de remparts de pierre et dotée d'une unique porte, qui entretenait d'importantes relations commerciales avec ses voisins. {cite:nuzhat-al-mushtaq-2002 p. 513}"
  ur: "تبت کا ایک قلعہ بند قصبہ جس میں پتھر کی دیوار اور ایک دروازہ ہے، جس کے پڑوسیوں کے ساتھ بہت زیادہ تجارت ہوتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 513}"
  tr: "Tibet'te taş duvarla tahkim edilmiş, tek kapılı ve yakında yaşayanlarla birçok iş ve ticaret bulunan bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 513}"
  id: "Sebuah kota di Tibet, diperkuat dengan tembok batu, dengan satu gerbang, dan banyak bisnis serta perdagangan dengan penduduk sekitar. {cite:Nuzhat-al-Mushtaq-2002 hlm. 513}"
