label: { en: "Cairo", ar: "القاهرة", es: "El Cairo", fr: "Caire" }
summary:
  ar: "عاصمة مصر وأحد أهم مراكز الحياة الدينية والثقافية والسياسية في العالم الإسلامي، على ضفتي النيل جنوبي الدلتا. أسس الفاطميون القاهرة سنة 969م بجوار الفسطاط، وفيها الأزهر، ونزل جوهر القائد مولى المعز العبيدي موضعها سنة ثمان وخمسين فاختطها وبنى دار الإمارة المعروفة بالقصرين {cite:tarikh-khulafa-minhaj-1434 p. 620-621}. ونمت المدينة شمالًا في العهود الأيوبية والمملوكية والعثمانية، وتشكلت القاهرة الحديثة منذ عهد محمد علي."
  en: "Capital of Egypt and one of the most important centres of religious, cultural and political life in the Muslim world, on both banks of the Nile south of the delta. The Fatimids founded al-Qahira in 969 CE beside Fustat, and it became home to al-Azhar. The city grew northward under the Ayyubids, Mamluks and Ottomans, and modern Cairo took shape from the reign of Muhammad Ali."
  ur: "مصر کا دارالحکومت اور مسلم دنیا کی مذہبی، ثقافتی اور سیاسی زندگی کے اہم ترین مراکز میں سے ایک، جو ڈیلٹا کے جنوب میں نیل کے دونوں کناروں پر واقع ہے۔ فاطمیوں نے 969ء میں فسطاط کے پاس قاہرہ کی بنیاد رکھی اور یہیں الازہر واقع ہے۔ ایوبی، مملوکی اور عثمانی ادوار میں شہر شمال کی طرف بڑھتا گیا، اور جدید قاہرہ محمد علی کے دور سے تشکیل پایا۔"
  es: "Capital de Egipto y uno de los centros más importantes de la vida religiosa, cultural y política del mundo musulmán, situada a orillas del Nilo, al sur del delta. Los fatimíes fundaron al-Qahira en el año 969 d. C. junto a Fustat, y allí se ubicó al-Azhar. La ciudad creció hacia el norte bajo el dominio de los ayubíes, los mamelucos y los otomanos, y el Cairo moderno tomó forma durante el reinado de Muhammad Ali."
  fr: "Capitale de l'Égypte et l'un des centres les plus importants de la vie religieuse, culturelle et politique du monde musulman, le Caire s'étend sur les deux rives du Nil, au sud du delta. Les Fatimides fondèrent al-Qahira en 969 apr. J.-C. près de Fustat, et cette ville devint le siège d'al-Azhar. Elle s'étendit vers le nord sous les Ayyoubides, les Mamelouks et les Ottomans, et le Caire moderne prit forme sous le règne de Muhammad Ali."
