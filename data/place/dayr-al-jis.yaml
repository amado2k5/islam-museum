summary:
  ar: "حصن حصين له سور مبني من جص وآجر، وهو منزل للمجتازين، وليس به زرع ولا شجر، ويتصل بمفازة تحيط به من الجانبين، وشرب أهله من مياه الأمطار. {cite:nuzhat-al-mushtaq-2002 p. 683}"
  en: "A strong fortified stopping place with a wall of plaster and brick, a rest for travellers with no crops or trees, surrounded by desert on both sides; its people drink rainwater. {cite:nuzhat-al-mushtaq-2002 p. 683}"
  es: "Un lugar de descanso fortificado con una muralla de yeso y ladrillo, un refugio para viajeros sin cultivos ni árboles, rodeado de desierto por ambos lados; sus habitantes beben agua de lluvia. {cite:nuzhat-al-mushtaq-2002 p. 683}"
  fr: "Un lieu de halte fortifié, entouré d'un mur de plâtre et de briques, un refuge pour les voyageurs, sans cultures ni arbres, cerné par le désert de part et d'autre; ses habitants boivent l'eau de pluie. {cite:nuzhat-al-mushtaq-2002 p. 683}"
  ur: "پلاسٹر اور اینٹوں کی دیوار کے ساتھ مضبوط قلعہ بند رکنے کی جگہ، بغیر فصلوں یا درختوں کے مسافروں کے لیے آرام کی جگہ، دونوں طرف سے صحرا میں گھرا ہوا؛ اس کے لوگ بارش کا پانی پیتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 683}"
