summary:
  ar: "سد عظيم في مجرى الماء قرب مدينة مأرب، أتقن أهلها صنعته، وكانت مساكنهم عليه، فيسقون منه مزارعهم. ويذكر الإدريسي أن سيلاً عظيماً جاء فهدم السد فتفرق أهل المدينة والعرب في الأرض. {cite:nuzhat-al-mushtaq-2002 p. 153}"
  en: "A great dam across the watercourse near the city of Marib, built with care by its people, who lived beside it and watered their fields from it. Al-Idrisi says a great flood broke the dam and scattered the people of the city and the Arabs across the land. {cite:nuzhat-al-mushtaq-2002 p. 153}"
