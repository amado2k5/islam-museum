label: { ar: "سد مأرب", en: "Sadd Marib", es: "Triste Marib", fr: "Sadd Marib", ur: "صد ماریب", tr: "Marib Barajı", id: "Bendungan Marib" }
summary:
  ar: "سد عظيم في مجرى الماء قرب مدينة مأرب، أتقن أهلها صنعته، وكانت مساكنهم عليه، فيسقون منه مزارعهم. ويذكر الإدريسي أن سيلاً عظيماً جاء فهدم السد فتفرق أهل المدينة والعرب في الأرض. {cite:nuzhat-al-mushtaq-2002 p. 153}"
  en: "A great dam across the watercourse near the city of Marib, built with care by its people, who lived beside it and watered their fields from it. Al-Idrisi says a great flood broke the dam and scattered the people of the city and the Arabs across the land. {cite:nuzhat-al-mushtaq-2002 p. 153}"
  es: "Una gran presa que cruzaba el curso de agua cerca de la ciudad de Marib, construida con esmero por sus habitantes, que vivían a su lado y regaban sus campos con ella. Al-Idrisi relata que una gran inundación rompió la presa y dispersó a los habitantes de la ciudad y a los árabes por toda la región. {cite:nuzhat-al-mushtaq-2002 p. 153}"
  fr: "Un grand barrage, construit avec soin par les habitants de Marib qui vivaient à proximité et irriguaient leurs champs grâce à cette source, enjambait le cours d'eau. Al-Idrisi rapporte qu'une crue dévastatrice rompit le barrage et dispersa les habitants de la ville et les Arabes à travers la région. {cite:nuzhat-al-mushtaq-2002 p. 153}"
  ur: "ماریب شہر کے قریب آبی گزرگاہ کے پار ایک عظیم ڈیم، جو اس کے لوگوں نے احتیاط سے بنایا، جو اس کے پاس رہتے تھے اور اس سے اپنے کھیتوں کو پانی دیتے تھے۔ الادریسی کا کہنا ہے کہ ایک زبردست سیلاب نے ڈیم کو توڑ دیا اور شہر کے لوگوں اور عربوں کو زمین پر بکھیر دیا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 153}"
  tr: "Marib şehrine yakın su yolunda büyük bir baraj vardı; halkı bu işte ustalaştı ve evleri bu barajın üzerinde bulunuyordu, çiftliklerini buradan sularlar. El-İdrisi, büyük bir sel gelip barajı yok ettiğini, bunun da Medine halkı ve Arapların ülkeye dağılmasına neden olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 153}"
  id: "Bendungan besar di aliran air dekat kota Marib, yang penduduknya menguasai keahliannya, dan rumah mereka berada di atasnya, menyiram lahan mereka dari bendungan tersebut. Al-Idrisi menyebutkan bahwa banjir besar datang dan menghancurkan bendungan itu, menyebabkan penduduk Madinah dan orang Arab tercerai-berai di seluruh negeri. {cite:Nuzhat-al-Mushtaq-2002 hlm. 153}"
