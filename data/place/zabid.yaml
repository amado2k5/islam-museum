summary:
  en: "Yemeni coastal town, a centre of Islamic learning in the later Middle Ages and a UNESCO World Heritage site since 1993."
  ar: "مدينة ساحلية يمنية، كانت مركزًا للعلم الإسلامي في أواخر العصور الوسطى، ومدرجة في قائمة التراث العالمي لليونسكو منذ 1993."
  ur: "یمن کا ساحلی شہر اور قرون وسطیٰ میں اسلامی تعلیم کا مرکز، جو ۱۹۹۳ء سے یونیسکو کے عالمی ورثے میں شامل ہے۔ {cite:geonames-gazetteer}"
  es: "Ciudad costera yemení, centro de aprendizaje islámico a finales de la Edad Media y Patrimonio de la Humanidad de la UNESCO desde 1993."
  fr: "Ville côtière yéménite, centre d'apprentissage islamique à la fin du Moyen Âge et site inscrit au patrimoine mondial de l'UNESCO depuis 1993."
  tr: "Yemen'in sahil kenti olan bu şehir, geç Orta Çağ'da İslami bilgi merkeziydi ve 1993'ten beri UNESCO Dünya Mirası Listesi'nde yer almaktadır."
  id: "Sebagai kota pesisir Yaman, kota ini pernah menjadi pusat pengetahuan Islam pada akhir Abad Pertengahan dan telah terdaftar sebagai Situs Warisan Dunia UNESCO sejak tahun 1993."
