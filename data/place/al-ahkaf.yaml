label: { ar: "الأحقاف", en: "Al-Ahkaf (Barr al-Ahkaf, southern Arabia)", es: "Al-Ahkaf (Barr al-Ahkaf, sur de Arabia)", fr: "Al-Ahkaf (Barr al-Ahkaf, sud de l'Arabie)", ur: "الاحکاف ⁦(بر الاحکاف، جنوبی عرب)⁩", tr: "El-Ahqaf", id: "Al-Ahqaf" }
summary:
  ar: "اسم سورة الأحقاف ⁦(السورة السادسة والأربعون)⁩ واسم إقليم في جنوب الجزيرة العربية. يفسره المعجم عادة بالكثبان الرملية المنحنية، والجغرافيون العرب يضعونه بين حضرموت وعُمان، وعند أهل البادية الجنوبية هو المنطقة الجبلية الممتدة خلف الساحل {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  en: "Al-Ahkaf is both the title of Sura 46 and the name of a region in southern Arabia. Dictionaries usually read it as curved sand dunes, medieval geographers placed it between Hadramawt and Oman, and for southern bedouin Barr al-Ahkaf is the mountainous area behind the coast {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  es: "Al-Ahkaf es tanto el título de la Sura 46 como el nombre de una región en el sur de Arabia. Los diccionarios suelen leerlo como dunas de arena curvas, los geógrafos medievales lo ubicaron entre Hadramawt y Omán, y para los beduinos del sur, Barr al-Ahkaf es la zona montañosa detrás de la costa {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  fr: "Al-Ahkaf est à la fois le titre de la sourate 46 et le nom d'une région du sud de l'Arabie. Les dictionnaires le traduisent généralement par « dunes de sable incurvées », les géographes médiévaux le situaient entre le Hadramaout et Oman, et pour les Bédouins du Sud, Barr al-Ahkaf désigne la zone montagneuse située derrière la côte {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  ur: "الاحکاف سورہ 46 کا عنوان اور جنوبی عرب کے ایک علاقے کا نام ہے۔ لغت میں اسے عام طور پر ریت کے ٹیلوں کے طور پر پڑھا جاتا ہے، قرون وسطی کے جغرافیہ دانوں نے اسے حضرموت اور عمان کے درمیان رکھا تھا، اور جنوبی اعرابی کے لیے بر الاحکاف ساحل کے پیچھے پہاڑی علاقہ ہے۔ 1 ص۔ 279}۔"
  tr: "El-Ahqaf suresinin (kırk altıncı sure) adı, güney Arabistan'da bir bölgenin adıdır. Sözlük genellikle kıvrımlı kum tepeleriyle açıklanır ve Arap coğrafyacılar bunu Hadramut ile Umman arasında konumlandırır. Güney çölü halkı arasında, kıyıdan öteye uzanan dağlık bölgeyi ifade eder {cite:encyclopaedia-of-islam-2 cilt 1, s. 279}."
  id: "Nama Surah Al-Ahqaf (surah keempat puluh enam) adalah nama sebuah wilayah di Arab selatan. Kamus ini biasanya dijelaskan dengan bukit pasir yang melengkung, dan ahli geografi Arab menempatkannya di antara Hadhramaut dan Oman. Di antara masyarakat gurun selatan, kamus ini merujuk pada wilayah pegunungan yang membentang melampaui pantai {cite:encyclopaedia-of-islam-2 vol. 1, hlm. 279}."
