summary:
  ar: "اسم سورة الأحقاف (السورة السادسة والأربعون) واسم إقليم في جنوب الجزيرة العربية. يفسره المعجم عادة بالكثبان الرملية المنحنية، والجغرافيون العرب يضعونه بين حضرموت وعُمان، وعند أهل البادية الجنوبية هو المنطقة الجبلية الممتدة خلف الساحل {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
  en: "Al-Ahkaf is both the title of Sura 46 and the name of a region in southern Arabia. Dictionaries usually read it as curved sand dunes, medieval geographers placed it between Hadramawt and Oman, and for southern bedouin Barr al-Ahkaf is the mountainous area behind the coast {cite:encyclopaedia-of-islam-2 vol. 1 p. 279}."
