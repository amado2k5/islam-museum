summary:
  ar: "قوهستان أقرب مدينة إلى الطبسين في باب خراسان؛ قدمها عبد الله بن عامر الأحنف بن قيس فلقيه الهياطلة وهم أتراك ويقال قوم من أهل فارس كانوا يلوطون فنفاهم فيروز إلى هراة فصاروا مع الأتراك معاونين لأهل قوهستان فهزمهم."
  en: "Quhistan, the nearest city to the Tabasayn at Khurasan's gate; led there by al-Ahnaf ibn Qays, its people and the Hayatila — Turks, some say Persian outcasts exiled by Fayruz to Herat — met him and were routed."
  es: "Quhistan, la ciudad más cercana al Tabasayn en la puerta de Jorasán; conducido allí por al-Ahnaf ibn Qays, sus habitantes y los Hayatila —turcos, algunos dicen que persas exiliados por Fayruz a Herat— le salieron al encuentro y fueron derrotados."
  fr: "Quhistan, la ville la plus proche des Tabasayn à la porte du Khorasan; menée là par al-Ahnaf ibn Qays, ses habitants et les Hayatila — des Turcs, certains disent des parias persans exilés par Fayruz à Hérat — l'ont rencontré et ont été mis en déroute."
  ur: "کوہستان، خراسان کے دروازے پر تباسین کے قریب ترین شہر؛ وہاں کی قیادت الاحنف ابن قیس، اس کے لوگ اور حیاتیلا - ترک، بعض کہتے ہیں کہ فارس سے نکالے گئے فارسیوں کو فیروز نے ہرات میں جلاوطن کیا تھا - اس سے ملے اور انہیں شکست دی گئی۔"
  tr: "Kohistan, Tabsinlere en yakın şehir olan Bab Horasan'dı; burası Abdullah ibn Amir al-Ahnaf ibn Qays tarafından tanıtıldı ve burada Hayatilalar tarafından kabul edildi; onlar Türk idi. Bazı Perslerin Lut'a seyahat ettiği söylenir, ancak Firuz onları Herat'a sürgün etti, burada Türklerle ittifak kurup onları yendiler."
  id: "Kohistan adalah kota terdekat dengan Tabsin di Bab Khorasan; kota ini diperkenalkan oleh Abdullah ibn Amir al-Ahnaf ibn Qays, di mana ia bertemu dengan Hayatilas, yang merupakan orang Turki. Dikatakan bahwa beberapa orang dari Persia sedang melakukan perjalanan ke Lut, tetapi Firuz mengasingkan mereka ke Herat, di mana mereka menjadi sekutu dengan Turki dan mengalahkan mereka."
