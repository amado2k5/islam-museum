label: { ar: "المسيلة", en: "al-Musayla", es: "al-Musayla", fr: "al-Musayla", ur: "المسیلہ", tr: "M'sila", id: "M'sila" }
summary:
  ar: "مدينة مستحدثة عامرة في بسيط من الأرض، ويذكر الإدريسي أنها أُنشئت في ولاية إدريس بن عبد الله، ولها مزارع ممتدة وخيل وأغنام وأبقار. {cite:nuzhat-al-mushtaq-2002 p. 254}"
  en: "A newly founded city on a level plain, which al-Idrisi says was established under Idris ibn Abdallah, with extensive farms, horses, sheep and cattle. {cite:nuzhat-al-mushtaq-2002 p. 254}"
  es: "Una ciudad recién fundada en una llanura, que según al-Idrisi fue establecida bajo el reinado de Idris ibn Abdallah, con extensas granjas, caballos, ovejas y ganado vacuno. {cite:nuzhat-al-mushtaq-2002 p. 254}"
  fr: "Une ville nouvellement fondée sur une plaine, que al-Idrisi attribue à Idris ibn Abdallah, avec de vastes exploitations agricoles, des chevaux, des moutons et du bétail. {cite:nuzhat-al-mushtaq-2002 p. 254}"
  ur: "ایک سطحی میدان پر ایک نیا قائم کیا گیا شہر، جس کے بارے میں الادریسی کا کہنا ہے کہ ادریس ابن عبداللہ کے دور میں قائم کیا گیا تھا، جس میں وسیع کھیت، گھوڑے، بھیڑیں اور مویشی تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 254}"
  tr: "Yeni kurulmuş bir şehir, bir arazi parçası üzerinde yerleşim görmüştür. Al-İdrisi, şehrin İdris bin Abdullah eyaletinde, geniş çiftlikler, atlar, koyunlar ve sığırlarla kurulduğunu belirtir. {cite:nuzhat-al-mushtaq-2002 s. 254}"
  id: "Sebuah kota baru yang didirikan dan dihuni di sebidang tanah. Al-Idrisi menyebutkan bahwa kota ini didirikan di provinsi Idris bin Abdullah, dengan lahan pertanian luas, kuda, domba, dan sapi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 254}"
