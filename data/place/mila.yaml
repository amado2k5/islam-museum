summary:
  ar: "مدينة حسنة كثيرة الأشجار، مياهها غدقة، وأهلها من أخلاط البربر، وكانت في طاعة صاحب بجاية. {cite:nuzhat-al-mushtaq-2002 p. 265}"
  en: "A handsome city of many trees and abundant water, whose people are a mix of Berbers; it once acknowledged the lord of Bijaya. {cite:nuzhat-al-mushtaq-2002 p. 265}"
  es: "Una hermosa ciudad de muchos árboles y agua abundante, cuyos habitantes son una mezcla de bereberes; en otro tiempo reconoció al señor de Bijaya. {cite:nuzhat-al-mushtaq-2002 p. 265}"
  fr: "Une belle cité arborée et riche en eau, dont les habitants sont un mélange de Berbères; elle reconnaissait autrefois le seigneur de Bijaya. {cite:nuzhat-al-mushtaq-2002 p. 265}"
  ur: "بہت سے درختوں اور وافر پانی کا ایک خوبصورت شہر، جس کے لوگ بربروں کا مرکب ہیں۔ اس نے ایک بار بیجیا کے رب کو تسلیم کیا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 265}"
  tr: "Çok sayıda ağaçlı, bol suları olan güzel bir şehir ve halkı Berberi karışımıydı ve Bejaia hükümdarının komutası altındaydı. {cite:nuzhat-al-mushtaq-2002 s. 265}"
  id: "Kota yang indah dengan banyak pohon, air yang melimpah, dan penduduknya adalah campuran Berber, serta berada di bawah komando penguasa Bejaia. {cite:Nuzhat-al-Mushtaq-2002 hlm. 265}"
