summary:
  ar: مدينة على البحر الفارسي، حسنة لكنها صغيرة، وذكر الإدريسي أن القرامطة كانوا فيها، وتبعد عن القطيف مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 386}
  en: A city on the Gulf coast, fine but small, which al-Idrisi says the Qaramita once held; two stages from al-Qatif. {cite:nuzhat-al-mushtaq-2002 p. 386}
  es: "Una ciudad en la costa del Golfo, hermosa pero pequeña, que según al-Idrisi estuvo bajo el dominio de los Qaramita; a dos etapas de al-Qatif. {cite:nuzhat-al-mushtaq-2002 p. 386}"
  fr: "Une ville de la côte du Golfe, belle mais petite, que les Qaramita contrôlaient autrefois selon al-Idrisi; à deux étapes d’al-Qatif. {cite:nuzhat-al-mushtaq-2002 p. 386}"
  ur: "خلیج کے ساحل پر ایک شہر، ٹھیک لیکن چھوٹا، جسے الادریسی کہتے ہیں کہ قرامیتا ایک بار منعقد ہوا تھا۔ القطیف سے دو مراحل {حوالہ: نزہت المشتاق-2002 ص۔ 386}"
