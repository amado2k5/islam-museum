summary:
  ar: "قلعة من كورة إصطخر في أعلى جبل، يصعد إليها في طريق صعب نحو ثلاثة أميال، ولا يستطيع أحد أن يرقى إليها بدابة، ومياهها من الأمطار. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  en: "A castle in the district of Istakhr on a high mountain, reached by a hard climb of about three miles; no beast can go up, and its water comes from rain. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  es: "Un castillo en el distrito de Istakhr, en una alta montaña, al que se accede tras una ardua ascensión de unos cinco kilómetros; ningún animal puede subir y su agua proviene de la lluvia. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  fr: "Un château du district d'Istakhr, sur une haute montagne, accessible après une ascension difficile d'environ cinq kilomètres; aucune bête ne peut y monter, et son eau provient de la pluie. {cite:nuzhat-al-mushtaq-2002 p. 420}"
  ur: "ضلع استخار میں ایک بلند پہاڑ پر ایک قلعہ، جو تقریباً تین میل کی سخت چڑھائی سے پہنچا۔ کوئی جانور اوپر نہیں جا سکتا، اور اس کا پانی بارش سے آتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 420}"
