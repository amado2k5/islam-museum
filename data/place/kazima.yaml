summary:
  ar: "مدينة تبعد عن طقجة أربع مراحل، ويقطع المسافرون هذه المراحل في الطريق إليها، وفيها عيون ومزارع. {cite:nuzhat-al-mushtaq-2002 p. 162}"
  en: "A city four stages from Tatja, which travellers cover in those stages on the way to it, with springs and farms. {cite:nuzhat-al-mushtaq-2002 p. 162}"
  es: "Una ciudad situada a cuatro etapas de Tatja, que los viajeros recorren en esas etapas camino a ella, con manantiales y granjas. {cite:nuzhat-al-mushtaq-2002 p. 162}"
  fr: "Une ville située à quatre étapes de Tatja, que les voyageurs traversent au fil des étapes sur le chemin qui y mène, avec des sources et des fermes. {cite:nuzhat-al-mushtaq-2002 p. 162}"
  ur: "تاتجا سے چار مراحل کا ایک شہر، جسے مسافر اس کے راستے میں ان مراحل میں چشموں اور کھیتوں کے ساتھ احاطہ کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 162}"
  tr: "Taqja'ya dört adım uzaklıktaki bir şehirde, yolcular bu aşamalardan geçer ve burada kaynaklar ve çiftlikler bulunur. {kaynak:nuzhat-al-mushtaq-2002 s. 162}"
  id: "Sebuah kota yang berjarak empat langkah dari Taqja, para pelancong melewati tahap-tahap ini dalam perjalanan, dan terdapat mata air serta pertanian. {cite:Nuzhat-al-Mushtaq-2002 hlm. 162}"
