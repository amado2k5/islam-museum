summary:
  ar: "جزيرة قريبة من جزيرة البينمان، أهلها يأكلون الناس، بحسب ما يذكره المؤلف عن بعض الرواة، ولا يُعرف لهم ملك، ويعيشون على جوز الهند وقصب السكر {cite:nuzhat-al-mushtaq-2002 p. 78}."
  en: "An island near the Binman islands. The author reports from informants that its people eat human flesh. They have no king and live on coconuts and sugar cane {cite:nuzhat-al-mushtaq-2002 p. 78}."
  es: "Una isla cercana a las islas Binman. El autor relata, basándose en información de sus informantes, que sus habitantes comen carne humana. No tienen rey y viven de cocos y caña de azúcar {cite:nuzhat-al-mushtaq-2002 p. 78}."
  fr: "Une île proche des îles Binman. L'auteur rapporte, d'après des informateurs, que ses habitants pratiquent le cannibalisme. Ils n'ont pas de roi et se nourrissent de noix de coco et de canne à sucre {cite:nuzhat-al-mushtaq-2002 p. 78}."
  ur: "بن مین جزائر کے قریب ایک جزیرہ۔ مصنف نے مخبروں سے اطلاع دی ہے کہ اس کے لوگ انسانی گوشت کھاتے ہیں۔ ان کا کوئی بادشاہ نہیں اور وہ ناریل اور گنے پر رہتے ہیں {حوالہ: نزہت المشتاق-2002 ص 78}۔"
