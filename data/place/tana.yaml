summary:
  ar: "تانه ثغر من ثغور الهند؛ أقطع إليها عثمان بن أبي العاص جيشاً من عمان فكتب عمر إليه يا أخا ثقيف حملت دوداً على عود وإني أحلف بالله لو أصيبوا لأخذت من قومك مثلهم."
  en: "Tana, an Indian seaboard post; raided from Uman under Uthman ibn Abi al-As — Umar's rebuke: 'you set worms upon wood; had they been struck I'd have taken their like from your people'."
  es: "Tana, un puesto costero indio, fue asaltado desde Uman bajo el mando de Uthman ibn Abi al-As. La reprimenda de Umar fue: \"Habéis puesto gusanos en la madera; si los hubieran golpeado, habría tomado a otros iguales de vuestro pueblo\"."
  fr: "Tana, un poste côtier indien; pillé depuis Uman sous Uthman ibn Abi al-As — Réprimande d'Umar: « Vous avez semé la zizanie dans le bois; si on les avait frappés, j'aurais pris leur semblable parmi votre peuple. »"
  ur: "تانا، ایک ہندوستانی سمندری چوکی؛ عثمان بن ابی العاص کے ماتحت عمان سے چھاپہ مارا گیا - عمر کی ڈانٹ: 'تم نے لکڑیوں پر کیڑے ڈالے۔ اگر وہ مارے جاتے تو میں ان کی طرح تم لوگوں سے چھین لیتا۔"
  tr: "Burası Hindistan'ın sınırıdır; Osman bin Ebi el-As Umman'dan bir ordu gönderdi ve Ömer ona şöyle yazdı: 'Ey kardeş Thaqif, solucanları bir çubukta taşıdım ve Allah'a yemin ederim, eğer vurulsalardı, senin halkından da onların halkını alırdım.'"
  id: "Ini adalah perbatasan India; Uthman ibn Abi al-As mengirim pasukan dari Oman ke sana, dan Umar menulis kepadanya, 'Wahai saudara Thaqif, aku membawa cacing di atas tongkat, dan aku bersumpah demi Allah, jika cacing-cacing itu dipukul, aku akan mengambil dari bangsamu yang sama seperti mereka.'"
