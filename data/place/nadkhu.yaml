label: { ar: "نضخو", en: "Nadkhu", es: "Nadkhu", fr: "Nadkhu", ur: "ندکھو", tr: "pompalıyoruz", id: "kami memompa" }
summary:
  ar: "مدينة على بحيرة حلوة الماء، فيها طير كثير شبيه بالهدهد، وتبعد عن خاقان أربع مراحل، ويقصدها كثير من الترك لكثرة ربيعها وعشبها. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  en: "A town on a lake of sweet water with many birds like hoopoes; four stages from Khaqan, visited by many Turks for its spring pasture. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  es: "Un pueblo a orillas de un lago de agua dulce con muchas aves como las abubillas; a cuatro etapas de Khaqan, visitado por muchos turcos por sus pastos primaverales. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  fr: "Une ville située au bord d'un lac d'eau douce peuplé de nombreux oiseaux, notamment des huppes; à quatre étapes de Khaqan, fréquentée par de nombreux Turcs pour ses pâturages printaniers. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  ur: "میٹھے پانی کی جھیل پر ایک قصبہ جس میں ہوپو جیسے بہت سے پرندے ہیں۔ خاقان سے چار مراحل، بہت سے ترک اس کی موسم بہار کی چراگاہ کے لیے تشریف لائے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 521}"
  tr: "Burası tatlı su gölü üzerinde yer alan bir şehirdir ve lehine gibi birçok kuşa ev sahipliği yapar. Kagan'a dört adım uzaklıktadır ve bol kaynak ve otları nedeniyle birçok Türk burayı ziyaret eder. {kaynak:nuzhat-al-mushtaq-2002 s. 521}"
  id: "Ini adalah sebuah kota di tepi danau air tawar, rumah bagi banyak burung yang menyerupai hoopoe. Kota ini berjarak empat langkah dari Khagan, dan banyak orang Turki mengunjunginya karena mata air dan rumputnya yang melimpah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 521}"
