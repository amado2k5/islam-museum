summary:
  ar: "مدينة من مدن الصعيد على الشرق من النيل، بيضاء أنيقة المنظر ذات مبان حفيلة، ويذكر ابن جبير أن نساءها يلزمن البيوت ⁦(الصفحة 370 من الماسح الضوئي للنسخة)⁩."
  en: "A city of Upper Egypt east of the Nile, white and elegant in appearance, with stately buildings; Ibn Jubayr notes that its women keep to their homes (page 370 of the scanned copy)."
  es: "Una ciudad del Alto Egipto al este del Nilo, de aspecto blanco y elegante, con edificios señoriales; Ibn Jubayr observa que sus mujeres permanecen en sus casas (página 370 de la copia escaneada)."
  fr: "Une ville de Haute-Égypte à l'est du Nil, blanche et élégante en apparence, avec des bâtiments majestueux; Ibn Jubayr note que ses femmes restent chez elles (page 370 de la copie numérisée)."
  ur: "دریائے نیل کے مشرق میں بالائی مصر کا ایک شہر، سفید اور خوبصورت، شاندار عمارتوں کے ساتھ؛ ابن جبیر نے نوٹ کیا کہ اس کی عورتیں اپنے گھروں میں رہتی ہیں ⁦(اسکین کاپی کا صفحہ 370)⁩۔"
  tr: "Yukarı Mısır'da, Nil'in doğusunda, beyaz ve zarif görünümlü, geniş binalara sahip bir şehirdir ve İbn Cubeyr, kadınlarının evde kaldığını belirtir (el yazmasının tarayıcısının 370. sayfası)."
  id: "Sebuah kota di Mesir Hulu di sebelah timur Sungai Nil, berwarna putih dan elegan dengan bangunan luas, dan Ibn Jubayr menyebutkan bahwa wanitanya terkurung di rumah (halaman 370 dari pemindai manuskrip)."
