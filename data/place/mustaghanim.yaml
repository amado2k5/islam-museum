  ar: "مدينة على البحر عند الجون، فيها أسواق وحمامات وجنات وبساتين ومياه كثيرة. {cite:nuzhat-al-mushtaq-2002 p. 271}"
  en: "A town on the sea by a bay, with markets, baths, gardens, orchards and plenty of water. {cite:nuzhat-al-mushtaq-2002 p. 271}"
  es: "Una ciudad costera junto a una bahía, con mercados, baños, jardines, huertos y abundante agua. {cite:nuzhat-al-mushtaq-2002 p. 271}"
  fr: "Une ville en bord de mer, au bord d'une baie, avec des marchés, des bains, des jardins, des vergers et de l'eau en abondance. {cite:nuzhat-al-mushtaq-2002 p. 271}"
  ur: "ایک خلیج کے کنارے سمندر پر واقع ایک قصبہ، جس میں بازار، حمام، باغات، باغات اور وافر پانی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 271}"
  tr: "El Gon yakınlarında deniz kenarında bir şehir; pazarlar, hamamlar, bahçeler, meyve bahçeleri ve birçok suyu vardır. {kaynak:nuzhat-al-mushtaq-2002 s. 271}"
  id: "Sebuah kota di tepi laut dekat El Gon, dengan pasar, pemandian, taman, kebun, dan banyak air. {cite:nuzhat-al-mushtaq-2002 hlm. 271}"
