summary:
  en: "Town in Anatolia named in the Juha introduction as the birthplace of Nasreddin Hoca; the edition gives it as his home, while other entries place him at Akşehir {cite:juha-nawadir-kubra-djuwaydi p. 7}."
  ar: "بلدة في الأناضول تذكرها مقدمة الكتاب مولداً لنصر الدين خوجة، بينما تذكره مصادر أخرى في آق شهر {cite:juha-nawadir-kubra-djuwaydi p. 7}."
  es: "Ciudad en Anatolia mencionada en la introducción de Juha como el lugar de nacimiento de Nasreddin Hoca; la edición la da como su hogar, mientras que otras entradas lo ubican en Akşehir {cite:juha-nawadir-kubra-djuwaydi p. 7}."
  fr: "La ville d'Anatolie mentionnée dans l'introduction de Juha comme lieu de naissance de Nasreddin Hoca; l'édition la donne comme son domicile, tandis que d'autres entrées le situent à Akşehir {cite:juha-nawadir-kubra-djuwaydi p. 7}."
  ur: "اناطولیہ کے قصبے کا نام جوہا تعارف میں نصرالدین ہوکا کی جائے پیدائش کے طور پر رکھا گیا ہے۔ ایڈیشن اسے اپنے گھر کے طور پر دیتا ہے، جب کہ دیگر اندراجات اسے اکشیر پر رکھتے ہیں 7}۔"
  tr: "Anadolu'da bir kasaba, kitabın girişinde Nasr al-Din Khoja'nın doğumu olarak anılmaktadır, diğer kaynaklarda ise ayın yılı olarak belirtilir {cite:juha-nawadir-kubra-djuwaydi s. 7}."
  id: "Sebuah kota di Anatolia disebutkan dalam pengantar buku sebagai kelahiran Nasr al-Din Khoja, sementara sumber lain menyebutnya sebagai tahun bulan {cite:juha-nawadir-kubra-djuwaydi hlm. 7}."
