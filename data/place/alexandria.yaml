summary:
  ar: "الإسكندرية الميناء الرئيس لمصر على البحر المتوسط عند الزاوية الغربية للدلتا، أسسها الإسكندر المقدوني سنة 332 ق.م، وسُلّمت إلى العرب سنة 21هـ/642م فبقيت مدينة عظيمة وإن تضاءل مجدها. كانت دار المملكة بمصر قبل الفسطاط، وكان لها مرفآن ومنارة فاروس وأسوار وأربعة أبواب رئيسة، وكانت مركزاً للمنسوجات والتجارة الدولية، وغلب عليها المذهب المالكي، وأقيمت فيها مدارس ورباطات منها مدرستان سنيتان في القرن السادس الهجري. وفي رواية كتاب عمرو بن العاص إلى عمر بن الخطاب فتحها عنوة بغير عهد ولا عقد، وفي قول يزيد بن أبي حبيب هي كلها صلح، واختطّ بها الزبير بن العوّام خطّة. وينقل المقريزي أنها ظلت دار العلم ومقر الحكمة إلى أن فتحها المسلمون {cite:khitat-maqrizi-1998 p.422}، وعند المقدسي نحو 375هـ قصبة نفيسة على بحر الروم عليها حصن منيع {cite:ahsan-al-taqasim p. 162}."
  en: "Alexandria is the principal seaport of Egypt, on the Mediterranean at the western angle of the Delta; Alexander the Great founded it in 332 BC, and it was surrendered to the Arabs in 21/642, still a great city though its glory had diminished. It was the seat of rule in Egypt before Fustat, with two harbours, the Pharos lighthouse, walls and four main gates, and it was a centre of textiles and international trade, where the Maliki school prevailed and where Sunni madrasas and ribats were founded. In the report of the letter of Amr ibn al-As to Umar ibn al-Khattab he took it by force with no treaty, while Yazid ibn Abi Habib held it was wholly a peace settlement, and al-Zubayr ibn al-Awwam marked out a plot there. Al-Maqrizi reports it stayed a house of learning and wisdom until the Muslims took it {cite:khitat-maqrizi-1998 p.422}; al-Maqdisi, around 375 AH, describes a fine town on the Mediterranean with a strong fortress {cite:ahsan-al-taqasim p. 162}."
  ur: "اسکندریہ بحیرہ روم پر دلتا کے مغربی کونے میں مصر کی سب سے اہم بندرگاہ ہے؛ اسے سکندر اعظم نے 332 ق م میں قائم کیا اور 21ھ/642ء میں یہ عربوں کے حوالے ہوا، تب بھی ایک عظیم شہر تھا اگرچہ اس کی شان کم ہو چکی تھی۔ فسطاط سے پہلے یہ مصر میں حکومت کا مرکز تھا؛ اس کی دو بندرگاہیں، فاروس کا روشن مینار، دیواریں اور چار بڑے دروازے تھے، یہ کپڑے اور بین الاقوامی تجارت کا مرکز تھا، یہاں مالکی مذہب غالب تھا اور سنی مدرسے اور رباط قائم ہوئے۔ عمرو بن العاص کے عمر بن خطاب کو خط کی روایت میں انہوں نے اسے بغیر عہد کے بزورِ شمشیر لیا، جبکہ یزید بن ابی حبیب کے قول میں یہ سب صلح سے ملا، اور زبیر بن العوام نے یہاں ایک خطہ مختص کیا۔ مقریزی بتاتے ہیں کہ مسلمانوں کے قبضے تک یہ علم اور حکمت کا گھر رہا {cite:khitat-maqrizi-1998 p.422}؛ مقدسی قریباً 375ھ میں اسے بحیرہ روم پر ایک نفیس قصبہ بتاتے ہیں جس پر مضبوط قلعہ ہے {cite:ahsan-al-taqasim p. 162}۔"
