summary:
  en: "Mediterranean port of Egypt, the seat of rule in Egypt before Fustat; al-Maqrizi reports it stayed a house of learning and wisdom until the Muslims took it."
  ar: "الإسكندرية فتحها عمرو بن العاص عنوة بغير عهد ولا عقد في رواية كتابه إلى عمر بن الخطاب — وهي كلها صلح في قول يزيد بن أبي حبيب — بعد أن رفض ملك الروم صلح الموقس فأغلقوا بابها وآذنوا بالحرب؛ واختطّ بها الزبير بن العوّام خطّة، وسأل الموقس عمرو أن يُدفن في كنيسة من كنائسها ذكرها. وعند المقدسي نحو 375هـ: قصبة نفيسة على بحر الروم عليها حصن منيع، بلد شريف كثير الصالحين والمتعبدين، شربهم من النيل يدخل عليهم أيام زيادته في قناة فيملأ صهاريجهم، شامية الهواء والرسوم كثيرة الأمطار، وبناهم من الحجارة البحرية وعلى جبابهم أبواب تُغلق بالليل كيلا يصعد منها اللصوص {cite:ahsan-al-taqasim p. 162}."
