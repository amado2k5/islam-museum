summary:
  ar: "الإسكندرية الميناء الرئيس لمصر على البحر المتوسط عند الزاوية الغربية للدلتا، أسسها الإسكندر المقدوني سنة 332 ق.م، وسُلّمت إلى العرب سنة 21هـ/642م فبقيت مدينة عظيمة وإن تضاءل مجدها. كانت دار المملكة بمصر قبل الفسطاط، وكان لها مرفآن ومنارة فاروس وأسوار وأربعة أبواب رئيسة، وكانت مركزاً للمنسوجات والتجارة الدولية، وغلب عليها المذهب المالكي، وأقيمت فيها مدارس ورباطات منها مدرستان سنيتان في القرن السادس الهجري. وفي رواية كتاب عمرو بن العاص إلى عمر بن الخطاب فتحها عنوة بغير عهد ولا عقد، وفي قول يزيد بن أبي حبيب هي كلها صلح، واختطّ بها الزبير بن العوّام خطّة. وينقل المقريزي أنها ظلت دار العلم ومقر الحكمة إلى أن فتحها المسلمون {cite:khitat-maqrizi-1998 p.422}، وعند المقدسي نحو 375هـ قصبة نفيسة على بحر الروم عليها حصن منيع {cite:ahsan-al-taqasim p. 162}."
  en: "Alexandria is the principal seaport of Egypt, on the Mediterranean at the western angle of the Delta; Alexander the Great founded it in 332 BC, and it was surrendered to the Arabs in 21/642, still a great city though its glory had diminished. It was the seat of rule in Egypt before Fustat, with two harbours, the Pharos lighthouse, walls and four main gates, and it was a centre of textiles and international trade, where the Maliki school prevailed and where Sunni madrasas and ribats were founded. In the report of the letter of Amr ibn al-As to Umar ibn al-Khattab he took it by force with no treaty, while Yazid ibn Abi Habib held it was wholly a peace settlement, and al-Zubayr ibn al-Awwam marked out a plot there. Al-Maqrizi reports it stayed a house of learning and wisdom until the Muslims took it {cite:khitat-maqrizi-1998 p.422}; al-Maqdisi, around 375 AH, describes a fine town on the Mediterranean with a strong fortress {cite:ahsan-al-taqasim p. 162}."
  ur: "اسکندریہ بحیرہ روم پر دلتا کے مغربی کونے میں مصر کی سب سے اہم بندرگاہ ہے؛ اسے سکندر اعظم نے 332 ق م میں قائم کیا اور 21ھ/642ء میں یہ عربوں کے حوالے ہوا، تب بھی ایک عظیم شہر تھا اگرچہ اس کی شان کم ہو چکی تھی۔ فسطاط سے پہلے یہ مصر میں حکومت کا مرکز تھا؛ اس کی دو بندرگاہیں، فاروس کا روشن مینار، دیواریں اور چار بڑے دروازے تھے، یہ کپڑے اور بین الاقوامی تجارت کا مرکز تھا، یہاں مالکی مذہب غالب تھا اور سنی مدرسے اور رباط قائم ہوئے۔ عمرو بن العاص کے عمر بن خطاب کو خط کی روایت میں انہوں نے اسے بغیر عہد کے بزورِ شمشیر لیا، جبکہ یزید بن ابی حبیب کے قول میں یہ سب صلح سے ملا، اور زبیر بن العوام نے یہاں ایک خطہ مختص کیا۔ مقریزی بتاتے ہیں کہ مسلمانوں کے قبضے تک یہ علم اور حکمت کا گھر رہا {cite:khitat-maqrizi-1998 p.422}؛ مقدسی قریباً 375ھ میں اسے بحیرہ روم پر ایک نفیس قصبہ بتاتے ہیں جس پر مضبوط قلعہ ہے {cite:ahsan-al-taqasim p. 162}۔"
  es: "Alejandría es el principal puerto marítimo de Egipto, en el Mediterráneo, en el extremo occidental del delta. Alejandro Magno la fundó en el 332 a. C. y fue entregada a los árabes en el 21/642, siendo aún una gran ciudad, aunque su gloria había disminuido. Fue la sede del gobierno de Egipto antes de Fustat, con dos puertos, el faro de Faros, murallas y cuatro puertas principales. Fue un centro de textiles y comercio internacional, donde prevaleció la escuela Maliki y donde se fundaron madrasas y ribats sunitas. En el informe de la carta de Amr ibn al-As a Umar ibn al-Khattab, este la tomó por la fuerza sin tratado, mientras que Yazid ibn Abi Habib sostuvo que se trató de un acuerdo de paz, y al-Zubayr ibn al-Awwam delimitó un terreno allí. Al-Maqrizi informa que siguió siendo una casa de aprendizaje y sabiduría hasta que los musulmanes la tomaron {cite:khitat-maqrizi-1998 p.422}; al-Maqdisi, alrededor del año 375 AH, describe una hermosa ciudad en el Mediterráneo con una fuerte fortaleza {cite:ahsan-al-taqasim p. 162}."
  fr: "Alexandrie est le principal port maritime d'Égypte, situé sur la Méditerranée à l'extrémité occidentale du delta du Nil. Fondée par Alexandre le Grand en 332 av. J.-C., elle fut livrée aux Arabes en 21/642, demeurant une grande ville malgré le déclin de sa gloire passée. Avant Fustat, elle fut le siège du pouvoir en Égypte, dotée de deux ports, du phare de Pharos, de remparts et de quatre portes principales. Centre névralgique du textile et du commerce international, elle était le foyer de l'école malikite et un lieu d'implantation de madrasas et de ribats sunnites. Selon la lettre d'Amr ibn al-As à Umar ibn al-Khattab, la ville fut prise par la force, sans traité. Yazid ibn Abi Habib, quant à lui, affirmait qu'il s'agissait d'un accord de paix, et al-Zubayr ibn al-Awwam y établit un projet de conquête. Al-Maqrizi rapporte qu'elle demeura un centre d'apprentissage et de sagesse jusqu'à sa prise par les musulmans (voir: Khitat-Maqrizi, 1998, p. 422). al-Maqdisi, vers 375 AH, décrit une belle ville sur la Méditerranée avec une forteresse solide {cite:ahsan-al-taqasim p. 162}."
  tr: "İskenderiye, deltanın batı köşesindeki Akdeniz'deki Mısır'ın ana limanıydı. MÖ 332'de Büyük İskender tarafından kurulmuş ve 21 Hicri/642 yılında Araplara devredilmiştir; görkemi azalsa da büyük bir şehir olarak kalmıştır. Fustat'tan önce Mısır'daki krallığın başkentiydi; iki limanı, bir Pharos deniz feneri, surları ve dört ana kapısı vardı. Tekstil ve uluslararası ticaret merkeziydi, ağırlıklı olarak Maliki okulunun bir merkeziydi ve 6. yüzyılda iki Sünni okul da dahil olmak üzere okullar ve ribatlar kuruldu. Amr ibn al-As'ın Ömer ibn el-Hattab'a yazdığı mektupta, herhangi bir antlaşma veya anlaşma olmadan zorla fethettiğini ve Yezid bin Ebu Habib'e göre hepsinin barışçıl olduğunu belirtir; Zubeyr ibn al-Awwam bunun için bir plan hazırlamıştır. El-Maqrizi, Müslümanlar tarafından fethedilene kadar buranın bilgi ve bilgelik merkezi olarak kaldığını bildirir {cit:khitat-maqrizi-1998 s.422} ve el-Maqdisi'ye göre, yaklaşık 375 Hicri civarında Roma Denizi'nde güçlü bir kaleye sahip değerli bir kasbah vardı {cite:ahsan-al-taqasim, s. 162}."
  id: "Alexandria adalah pelabuhan utama Mesir di Laut Mediterania di sudut barat delta. Pelabuhan ini didirikan oleh Alexander Agung pada tahun 332 SM dan diserahkan kepada bangsa Arab pada tahun 21 H/642 M, tetap menjadi kota besar meskipun kejayaannya berkurang. Kota ini adalah ibu kota Kerajaan Mesir sebelum Fustat, dengan dua pelabuhan, mercusuar Firaun, tembok, dan empat gerbang utama. Kota ini merupakan pusat tekstil dan perdagangan internasional, terutama dari mazhab Maliki, dan sekolah serta ribat didirikan di sana, termasuk dua aliran Sunni pada abad ke-6 H. Dalam narasi surat dari Amr ibn al-As kepada Umar ibn al-Khattab, ia menaklukkannya secara paksa tanpa perjanjian atau kontrak, dan menurut Yazid ibn Abi Habib, semuanya damai, dan Zubayr ibn al-Awwam merancang rencana untuk itu. Al-Maqrizi melaporkan bahwa kasta ini tetap menjadi pusat pengetahuan dan kebijaksanaan hingga Muslim menaklukkannya {cite:khitat-maqrizi-1998 hlm.422}, dan menurut al-Maqdisi, sekitar tahun 375 H, terdapat sebuah kasbah berharga di Laut Romawi dengan benteng kuat {cite:ahsan-al-taqasim, hlm. 162}."
