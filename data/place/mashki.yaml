  tr: "Kerman banliyölerine bağlı, dayanıklı ve güçlü, palmiye ağaçları, ürünler ve develerle dolu gelişen bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 174}"
  id: "Kota yang berkembang pesat yang terhubung dengan pinggiran Kerman, tangguh dan kuat, dengan pohon palem, tanaman, dan unta. {cite:Nuzhat-al-Mushtaq-2002 hlm. 174}"
