summary:
  ar: "مدينة بالجبل؛ عند البلاذري أتاها أبو موسى الأشعري وعبد الله بن قيس منصرفين من نهاوند فأقاما عليها أياماً ثم افتتحاها. وعند المقدسي نحو 375هـ: أهل قم شيعة غالية قد تركوا الجماعات وعطّلوا الجامع حتى ألزمهم ركن الدولة عمارتَه ولزومَه، ويُحمل منها الكراسي واللجم والركب والبر والزعفران {cite:ahsan-al-taqasim p. 292}."
  en: "a Jibal city; in al-Baladhuri reached by Abu Musa and Abdallah ibn Qays returning from Nihawand — stayed upon days, then opened."
  es: "una ciudad Jibal; en al-Baladhuri, al que llegaron Abu Musa y Abdallah ibn Qays que regresaban de Nihawand, permaneció varios días y luego abrió."
  fr: "une ville de Jibal; à al-Baladhuri atteint par Abu Musa et Abdallah ibn Qays revenant de Nihawand - y restèrent quelques jours, puis ouvrirent."
  ur: "جبل شہر؛ البلادوری میں ابو موسیٰ اور عبداللہ بن قیس نہاوند سے واپس آتے ہوئے پہنچے - دنوں پر ٹھہرے، پھر کھل گئے۔"
  tr: "Dağda bir şehir; el-Baladhuri'ye göre, Ebu Musa el-Eş'ari ve Abdullah bin Kays Nahavand'dan ayrılarak buraya gelmişler, günlerce orada kalmışlar ve sonra şehri fethetmişlerdir. El-Makdisi'ye göre, yaklaşık 375 Hicri: Kum halkı, cemaatleri terk eden ve camiyi bozan ağır bir Şiiydi; ancak devlet köşesi onları camiyi inşa etmeye ve bakıma zorlayıp sandalyeler, dizginler, dizler, toprak ve safran taşırdı {atıf:Ahsan-al-Taqasim, s. 292}."
  id: "Sebuah kota di pegunungan; menurut al-Baladhuri, Abu Musa al-Ash'ari dan Abdullah ibn Qays datang ke sana meninggalkan Nahavand, tinggal di sana selama beberapa hari, lalu menaklukkannya. Menurut al-Maqdisi, sekitar tahun 375 H: penduduk Qom adalah seorang Syiah berat yang meninggalkan jamaah dan mengacaukan masjid sampai sudut negara memaksa mereka membangun dan merawatnya, membawa kursi, tali kekang, lutut, tanah, dan safron {cite:ahsan-al-taqasim, hlm. 292}."
