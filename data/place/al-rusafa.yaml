summary:
  ar: "جانب بغداد الشرقي؛ عند البلاذري بناها المنصور للمهدي وكان يدعى عسكر المهدي لأنه عسكر فيه حين خرج إلى الري فنزلها لما قدم سنة 151."
  en: "Baghdad's east side — built by al-Mansur for al-Mahdi, called Askar al-Mahdi from his camp there bound for Rayy, occupied on his 151 return."
  es: "El lado este de Bagdad, construido por al-Mansur para al-Mahdi, llamado Askar al-Mahdi por su campamento allí con destino a Rayy, fue ocupado en su regreso en el año 151."
  fr: "Le côté est de Bagdad — construit par al-Mansur pour al-Mahdi, appelé Askar al-Mahdi d'après son camp là-bas en route pour Rayy, occupé à son retour de 151."
  ur: "بغداد کا مشرقی حصہ - المنصور نے المہدی کے لیے بنایا تھا، عسکر المہدی کو وہاں سے اپنے کیمپ سے رے کے لیے بلایا گیا، اس کی 151 واپسی پر قبضہ کر لیا گیا۔"
  tr: "Bağdat'ın doğu tarafı; el-Baladhuri tarafından, el-Mensur tarafından el-Mehdi için inşa edilmiştir ve Rayy'e gittiğinde orada kamp kurduğu için el-Mehdi Seferi olarak adlandırılmıştır; 151 yılında oraya vardığında yerleşmiştir."
  id: "Sisi timur Baghdad; oleh al-Baladhuri, dibangun oleh al-Mansur untuk al-Mahdi, dan disebut Ekspedisi al-Mahdi karena ia berkemah di sana saat pergi ke Rayy, dan ia menetap di sana saat tiba pada tahun 151."
