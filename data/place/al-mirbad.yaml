summary:
  ar: "المربد ساحة البصرة وسوقها ببابها الغربي؛ تحول إليها سليمان بن علي بن عبد الله بن العباس والي البصرة لأبي العباس فنزلها. وعند ابن الجوزي وفي سنة 311هـ أحرقه أبو طاهر الجنابي القرمطي يوم دخوله البصرة {cite:muntazam-ibn-al-jawzi p. 466}"
  en: "al-Mirbad, Basra's square and market at its western gate; the governor Sulayman ibn Ali moved his residence there under Abu al-Abbas."
  es: "Al-Mirbad, la plaza y el mercado de Basora situados en su puerta occidental; el gobernador Sulayman ibn Ali trasladó allí su residencia bajo el mandato de Abu al-Abbas."
  fr: "al-Mirbad, la place et le marché de Bassora à sa porte ouest; le gouverneur Sulayman ibn Ali y a transféré sa résidence sous Abu al-Abbas."
  ur: "المرباد، بصرہ کا چوک اور اس کے مغربی دروازے پر بازار؛ گورنر سلیمان ابن علی نے اپنی رہائش ابو العباس کے ماتحت وہاں منتقل کر دی۔"
  tr: "El-Murbad, Basra Meydanı ve batı kapısındaki pazarıydı; Basra valisi Süleyman bin Ali ibn Abdullah ibn el-Abbas buraya döndü ve oraya yerleşti. İbn el-Cevzi'ye göre, 311 Hicri yılında, Ebu Tahir el-Cenebi el-Karmati tarafından Basra'ya girdiği gün yakıldı {alıntı:Muntazam-ibn-al-Jawzi, s. 466}"
  id: "Al-Murbad adalah Alun-Alun Basra dan pasarnya di gerbang baratnya; Suleiman ibn Ali ibn Abdullah ibn al-Abbas, gubernur Basra, beralih ke sana dan menetap di sana. Menurut Ibn al-Jawzi, pada tahun 311 H, alun-alun itu dibakar oleh Abu Tahir al-Janabi al-Qarmati pada hari ia memasuki Basra {cite:muntazam-ibn-al-jawzi, hlm. 466}"
