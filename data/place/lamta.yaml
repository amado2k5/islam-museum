summary:
  ar: "مدينة على طرف المفازة الممتدة بين الملتان وبلاد أخرى، تبعد عن كابل أربع مراحل، وتقارب زويلة في القدر. {cite:nuzhat-al-mushtaq-2002 p. 197}"
  en: "A city on the edge of the desert that stretches between Multan and other lands, four stages from Kabul and similar in size to Zawila. {cite:nuzhat-al-mushtaq-2002 p. 197}"
  es: "Una ciudad en el límite del desierto que se extiende entre Multan y otras tierras, a cuatro etapas de Kabul y de tamaño similar a Zawila. {cite:nuzhat-al-mushtaq-2002 p. 197}"
  fr: "Une ville en bordure du désert qui s'étend entre Multan et d'autres régions, à quatre étapes de Kaboul et de taille comparable à Zawila. {cite:nuzhat-al-mushtaq-2002 p. 197}"
  ur: "ریگستان کے کنارے پر ایک شہر جو ملتان اور دوسری زمینوں کے درمیان پھیلا ہوا ہے، کابل سے چار مراحل اور جسامت میں ذویلہ کے برابر ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 197}"
  tr: "Multan ile diğer ülkeler arasındaki kavşağın kenarında, Kabil'e dört aşama uzaklıkta ve Zuweila'ya yakın Qadr'da bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 197}"
  id: "Sebuah kota di tepi persimpangan yang membentang antara Multan dan negara lain, empat tahap dari Kabul, dan dekat dengan Zuweila di Qadr. {cite:Nuzhat-al-Mushtaq-2002 hlm. 197}"
