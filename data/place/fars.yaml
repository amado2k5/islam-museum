summary:
  ar: "فارس الإقليم الكبير الذي سمي به أهله؛ فتحه المسلمون من جهة البحر في خلافة عمر بدءاً بجزيرة أبر كاوان ثم توج فريشهر التي قتل فيها مرزبانها شهرك فأرجان وشيراز وسابور ودارابجرد وغيرها."
  en: "Fars, the great province named for its people; the Muslims conquered it from the sea under Umar — Abr Kawan first, then Tawwaj and Rayshahr where its marzban Shahrak fell, then Arrajan, Shiraz, Sabur, Darabjird and the rest."
  es: "Fars, la gran provincia que lleva el nombre de su gente; los musulmanes la conquistaron desde el mar bajo el mando de Umar: primero Abr Kawan, luego Tawwaj y Rayshahr, donde cayó su marzban Shahrak, luego Arrajan, Shiraz, Sabur, Darabjird y el resto."
  fr: "Le Fars, la grande province qui tire son nom de ses habitants; les musulmans l'ont conquise par la mer sous Umar — d'abord Abr Kawan, puis Tawwaj et Rayshahr où tomba son marzban Shahrak, puis Arrajan, Shiraz, Sabur, Darabjird et le reste."
  ur: "فارس، اس کے لوگوں کے نام کا عظیم صوبہ؛ مسلمانوں نے اسے عمر کے تحت سمندر سے فتح کیا - پہلے ابر کاون، پھر تواج اور ریشہر جہاں اس کا مرزبن شہر گرا، پھر ارجان، شیراز، صبور، درابجرد اور باقی۔"
