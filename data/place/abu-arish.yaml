summary:
  ar: "بلدة في عسير على نحو ميلين من جيزان، كانت مركزًا لأشراف زيدية ثم خضعت للأتراك والإدريسيين وآل سعود، وفيها تجار من أصل حضرمي. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  en: "A town in 'Asir about two miles from Jizan, settled first by a shaykh in the seventh/thirteenth century, taken by the Zaydi imams in 1036/1627, held in turn by local ashraf, the Turks, the Idrisi and Ibn Saud, with Hadrami merchants. {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
  ur: "عسیر میں جیزان سے تقریباً دو میل کے فاصلے پر ایک قصبہ، جسے ساتویں/تیرہویں صدی میں ایک شیخ نے آباد کیا، 1036ھ/1627ء میں زیدی ائمہ نے فتح کیا، اور بعد میں مقامی اشراف، ترکوں، ادریسیوں اور ابن سعود کے زیر اثر رہا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 125}"
