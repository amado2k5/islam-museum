summary:
  ar: "ماء من مياه بني سليم في نجد، على الطريق التجارية الشرقية بين مكة والشام، وفيه كانت غزوة بني سليم سنة 2هـ، أقام فيها النبي ثلاثة أيام ثم رجع إلى المدينة."
  en: "A water source of Banu Sulaym in Najd, on the eastern trade road between Makkah and Syria, where the raid on Banu Sulaym took place in the 2nd year AH; the Prophet stayed there three days, then returned to Madinah."
  es: "Una fuente de agua de Banu Sulaym en Najd, en la ruta comercial oriental entre La Meca y Siria, donde tuvo lugar el ataque a Banu Sulaym en el año 2 de la Hégira; el Profeta permaneció allí tres días y luego regresó a Medina."
  fr: "Une source d'eau des Banu Sulaym à Najd, sur la route commerciale orientale entre La Mecque et la Syrie, où eut lieu le raid sur les Banu Sulaym la 2e année de l'Hégire; le Prophète y séjourna trois jours, puis retourna à Médine."
  ur: "مکہ اور شام کے درمیان مشرقی تجارتی راستے پر نجد میں بنو سلیم کا پانی کا ایک ذریعہ جہاں 2 ہجری میں بنو سلیم پر حملہ ہوا تھا۔ رسول اللہ وہاں تین دن رہے، پھر مدینہ واپس تشریف لے گئے۔"
  tr: "Mekke ile Şam arasındaki doğu ticaret yolu üzerinde, 2 Hicri yılında Banu Süleym Seferi'nin gerçekleştiği Najd'daki Banu Süleym sularından su alındı. Peygamber orada üç gün kaldıktan sonra Medine'ye döndü."
  id: "Air dari perairan Banu Sulaym di Najd, di jalur perdagangan timur antara Mekah dan Levant, tempat Ekspedisi Banu Sulaym berlangsung pada tahun 2 H. Nabi tinggal di sana selama tiga hari lalu kembali ke Madinah."
