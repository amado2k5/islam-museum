summary:
  ar: "المدينة التي في شق الكوفة من المدائن؛ عند البلاذري اجتمع بها المسلمون تسعة أشهر ويقال ثمانية عشر شهراً وأهلها يقاتلونهم حتى فتحوها."
  en: "the city on the Kufa side of al-Mada'in; in al-Baladhuri the Muslims camped against it nine or eighteen months, its people fighting them, till it was opened."
  es: "La ciudad en el lado de Kufa de al-Mada'in; en al-Baladhuri, los musulmanes acamparon frente a ella durante nueve o dieciocho meses, y sus habitantes lucharon contra ellos, hasta que fue abierta."
  fr: "la ville du côté de Kufa d'al-Mada'in; à al-Baladhuri, les musulmans campèrent contre elle pendant neuf ou dix-huit mois, ses habitants les combattant, jusqu'à ce qu'elle soit ouverte."
  ur: "المدائن کے کوفہ کی طرف شہر؛ البلادوری میں مسلمانوں نے اس کے خلاف نو یا اٹھارہ مہینے ڈیرے ڈالے، اس کے لوگ ان سے لڑتے رہے، یہاں تک کہ اسے کھول دیا گیا۔"
  tr: "Şehirlerin Kufa banliyösündeki şehir; Al-Baladhuri'ye göre, Müslümanlar dokuz ay boyunca orada toplanmış, on sekiz ay boyunca toplanmış, halkı onlarla savaşmış ve sonunda fethetmişlerdir."
  id: "Kota di pinggiran Kufa dari kota-kota tersebut; menurut Al-Baladhuri, umat Muslim berkumpul di sana selama sembilan bulan, dan dikatakan delapan belas bulan, dan penduduknya berperang melawan mereka hingga mereka menaklukkannya."
