summary:
  ar: "موضع نومة أصحاب الكهف؛ تدعي البلقاء أنه فيها والعمري يبطل ذلك، ونقل عن الهروي أنه زاره في بلاد الروم عند مدينة خربة يقال لها أبَسُس قريبة من أبلستين — أي أفسس — وقيل إن مدينة دقيانوس طليطلة، والصحيح عنده ما ببلاد الروم {cite:umari-masalik-1924 p. 217-218}."
  en: "The site of the Sleepers' slumber: al-Balqa's claim is rejected by al-Umari, who cites al-Harawi's own visit to it at the ruined city of Absus — Ephesus — near Abulustayn in Byzantine lands; a third claim makes Decius's city Toledo, but the soundest view locates it in the lands of Rum {cite:umari-masalik-1924 p. 217-218}."
  es: "El lugar del sueño de los Durmientes: la afirmación de al-Balqa es rechazada por al-Umari, quien cita la propia visita de al-Harawi a la ciudad en ruinas de Absus —Éfeso— cerca de Abulustayn en tierras bizantinas; una tercera afirmación sitúa la ciudad de Decio en Toledo, pero la opinión más sólida la ubica en las tierras de Rum {cite:umari-masalik-1924 p. 217-218}."
  fr: "Le site du sommeil des Dormants: l'affirmation d'al-Balqa est rejetée par al-Umari, qui cite la propre visite d'al-Harawi à la ville en ruines d'Absus — Éphèse — près d'Abulustayn en terres byzantines; une troisième affirmation situe la ville de Dèce à Tolède, mais l'avis le plus solide la situe dans les terres de Rum {cite:umari-masalik-1924 p. 217-218}."
