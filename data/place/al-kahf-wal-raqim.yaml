summary:
  ar: "موضع نومة أصحاب الكهف؛ تدعي البلقاء أنه فيها والعمري يبطل ذلك، ونقل عن الهروي أنه زاره في بلاد الروم عند مدينة خربة يقال لها أبَسُس قريبة من أبلستين — أي أفسس — وقيل إن مدينة دقيانوس طليطلة، والصحيح عنده ما ببلاد الروم {cite:umari-masalik-1924 p. 217-218}."
  en: "The site of the Sleepers' slumber: al-Balqa's claim is rejected by al-Umari, who cites al-Harawi's own visit to it at the ruined city of Absus — Ephesus — near Abulustayn in Byzantine lands; a third claim makes Decius's city Toledo, but the soundest view locates it in the lands of Rum {cite:umari-masalik-1924 p. 217-218}."
