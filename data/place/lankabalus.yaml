  ar: "جزيرة كبيرة عامرة، على بعد عشرة أيام من سرنديب، أهلها ذوو ألوان سوداء وأجسام عارية، والتجار يدخلون إليهم بالمراكب الصغيرة ليشتروا العنبر والنارجيل مقابل الحديد {cite:nuzhat-al-mushtaq-2002 p. 77-78}."
  en: "A large, populated island ten days from Sarandib. Its people are dark-skinned and go unclothed. Merchants come in small boats to buy ambergris and coconuts in exchange for iron {cite:nuzhat-al-mushtaq-2002 p. 77-78}."
