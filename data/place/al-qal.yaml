summary:
  ar: "قرية عامرة كانت في سالف الزمان مدينة، وهي الآن مرسى عليه عمارات والجبال تكتنفه، وتبعد عن جيجل سبعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  en: "A populated village that was a city in earlier times, now a harbour with buildings and mountains around it, seventy miles from Jijel. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  es: "Un pueblo poblado que en tiempos antiguos fue una ciudad, ahora un puerto rodeado de edificios y montañas, a setenta millas de Jijel. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  fr: "Un village peuplé qui était autrefois une ville, aujourd'hui un port entouré de bâtiments et de montagnes, à soixante-dix milles de Jijel. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  ur: "ایک آبادی والا گاؤں جو پہلے زمانے میں ایک شہر تھا، اب ایک بندرگاہ جس کے ارد گرد عمارتیں اور پہاڑ ہیں، جیجل سے ستر میل دور۔ {حوالہ: نزہت المشتاق-2002 ص۔ 269}"
  tr: "Bir zamanlar eski zamanlarda şehir olan canlı bir köy olan bu köy, şimdi dağlarla çevrili binalarla çevrili bir limandır ve Jijel'e yetmiş mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 269}"
  id: "Desa yang berkembang pesat yang dulunya merupakan kota di zaman kuno, kini menjadi pelabuhan dengan bangunan yang dikelilingi pegunungan, dan berjarak tujuh puluh mil dari Jijel. {cite:nuzhat-al-mushtaq-2002 hlm. 269}"
