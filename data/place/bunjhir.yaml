summary:
  ar: "مدينة تقع على جبل وعر، تبعد عن جاربابة يوماً، وأهلها يشتغلون باستخراج المعادن وسبكها، ويقول الإدريسي إن أهلها أشرار. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  en: "A town on a rugged mountain, one day from Jarbaniya, whose people work the mines and smelt the ores; al-Idrisi calls its people unruly. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  es: "Un pueblo en una escarpada montaña, a un día de Jarbaniya, cuyos habitantes trabajan en las minas y funden los minerales; al-Idrisi los describe como indisciplinados. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  fr: "Une ville perchée sur une montagne escarpée, à une journée de marche de Jarbaniya, dont les habitants travaillent dans les mines et fondent le minerai; al-Idrisi qualifie ses habitants d'indisciplinés. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  ur: "ایک ناہموار پہاڑ پر ایک قصبہ، جاربانیہ سے ایک دن، جس کے لوگ کانوں میں کام کرتے ہیں اور کچ دھاتیں سونگھتے ہیں۔ الادریسی اپنے لوگوں کو بے ضمیر کہتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 485}"
  tr: "Garbaba'dan bir gün uzaklıkta, Wa'ar Dağı'nda bulunan bu şehirde sakinler mineral çıkarımı ve döküm işleriyle uğraşmaktadır. El-İdrisi, halkının kötü olduğunu söyler. {kaynak:Nuzhat-al-mushtaq-2002 s. 485}"
  id: "Sebuah kota yang terletak di Gunung Wa'ar, satu hari dari Garbaba, penduduknya bekerja dalam ekstraksi dan pengecoran mineral. Al-Idrisi mengatakan penduduknya jahat. {cite:nuzhat-al-mushtaq-2002 hlm. 485}"
