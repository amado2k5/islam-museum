summary:
  ar: بلدة على الضفة البرية من دجلة؛ عند البلاذري أتاها النسير فأمّن أهلها وأخرجوا لمن معه طعاماً وعلفاً.
  en: Town on the Tigris; in al-Baladhuri its people were safe-conducted by al-Nusayr and brought food and fodder to his men.
  es: "Ciudad a orillas del Tigris; en al-Baladhuri, sus habitantes fueron protegidos por al-Nusayr y llevaron comida y forraje a sus hombres."
  fr: "Ville sur le Tigre; à al-Baladhuri, ses habitants furent mis en sécurité par al-Nusayr et apportèrent de la nourriture et du fourrage à ses hommes."
  ur: "دجلہ پر شہر؛ البلادوری میں اس کے لوگوں کو النصیر نے محفوظ رکھا اور اپنے آدمیوں کے لیے کھانا اور چارہ لایا۔"
  tr: "Dicle'in kuru kıyısında bir kasaba; el-Baladhuri onu Nasir'e getirdi, halkı güvendeydi ve yanındakilere yiyecek ve yem verildi."
  id: "Sebuah kota di tepi kering Sungai Tigris; al-Baladhuri membawanya ke Nasir, penduduknya aman, dan mereka yang bersamanya diberi makanan dan pakan."
