summary:
  ar: "الحصن بجبال درن من بلاد هرغة الذي اتخذه ابن تومرت وبايعه فيه المصامدة على التوحيد سنة 515هـ وصار عاصمته ومنه انطلقت دولة الموحدين {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  en: "Tinmal, the fortress in the Daran mountains where the Hargha pledged Ibn Tumart in 515 and from which the Almohad state sprang {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  es: "Tinmal, la fortaleza en las montañas de Daran donde los Hargha juraron lealtad a Ibn Tumart en 515 y de la cual surgió el estado almohade {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  fr: "Tinmal, la forteresse des montagnes de Daran où le Hargha a prêté allégeance à Ibn Tumart en 515 et d'où est né l'État almohade {cite:tarikh-ibn-khaldun-ibar p. 1669}."
  ur: "تنمل، داران کے پہاڑوں میں وہ قلعہ جہاں ہرثہ نے ابن تمرٹ کو 515 میں گروی رکھا تھا اور جہاں سے ریاست الموحد نے جنم لیا تھا۔ 1669}۔"
  tr: "İbn Tumart'ın 515 Hicri yılında, tek tanrıcılığa bağlılara bağlılık yemini ettiği ve Hargha topraklarındaki Dern dağlarındaki kale, başkenti olmuş ve Almohad devletinin başladığı {atıf:Tarih-ibn-haldun-ibar s. 1669}."
  id: "Benteng di pegunungan Dern di tanah Hargha, yang diambil Ibn Tumart dan bersumpah setia kepada kaum teguh monoteisme pada tahun 515 H, menjadi ibu kotanya, dari situlah negara Almohad dimulai {cite:History-ibn-khaldun-ibar hlm. 1669}."
