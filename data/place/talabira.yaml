summary:
  ar: "مدينة على ضفة نهر تاجه، هي أشرف البلاد حسناً، لها أسواق جميلة الترتيب وديار حسنة التركيب، وهي مدينة أزلية العمارة قديمة الآثار. {cite:nuzhat-al-mushtaq-2002 p. 551}"
  en: "A city on the bank of the Tagus, which al-Idrisi calls the most handsome of the lands, with well-arranged markets, fine houses and ancient buildings. {cite:nuzhat-al-mushtaq-2002 p. 551}"
  es: "Una ciudad a orillas del Tajo, que al-Idrisi considera la más hermosa de las tierras, con mercados bien organizados, casas elegantes y edificios antiguos. {cite:nuzhat-al-mushtaq-2002 p. 551}"
  fr: "Une ville située sur les rives du Tage, qu'al-Idrisi qualifie de plus belle des terres, avec ses marchés bien agencés, ses belles maisons et ses bâtiments anciens. {cite:nuzhat-al-mushtaq-2002 p. 551}"
  ur: "Tagus کے کنارے پر ایک شہر، جسے الادریسی زمینوں میں سب سے خوبصورت کہتا ہے، اچھی طرح سے منظم بازار، عمدہ مکانات اور قدیم عمارتیں ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 551}"
