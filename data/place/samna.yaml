summary:
  ar: "مدينة من بلاد التاجوين على حدود النوبة، حكى بعض المسافرين أن أميراً من قبل ملك النوبة حرقها وهدمها وشتت أهلها، فصارت خراباً {cite:nuzhat-al-mushtaq-2002 p. 30}."
  en: "A town in Tajuwi land on the Nubian border. Travellers report that a governor sent by the Nubian king burned and destroyed it and scattered its people, leaving it in ruins {cite:nuzhat-al-mushtaq-2002 p. 30}."
  es: "Un pueblo en la región de Tajuwi, en la frontera con Nubia. Los viajeros informan que un gobernador enviado por el rey de Nubia lo incendió y destruyó, dispersando a su población y dejándolo en ruinas {cite:nuzhat-al-mushtaq-2002 p. 30}."
  fr: "Une ville du pays Tajuwi, à la frontière nubienne. Des voyageurs rapportent qu'un gouverneur envoyé par le roi nubien l'a incendiée et détruite, puis a dispersé ses habitants, la laissant en ruines {cite:nuzhat-al-mushtaq-2002 p. 30}."
  ur: "تاجوی کا ایک قصبہ نیوبین کی سرحد پر واقع ہے۔ مسافر بتاتے ہیں کہ نیوبیا کے بادشاہ کے بھیجے گئے گورنر نے اسے جلا کر تباہ کر دیا اور اس کے لوگوں کو منتشر کر دیا اور اسے کھنڈرات میں چھوڑ دیا {حوالہ: نزہت المشتاق-2002 صفحہ۔ 30}۔"
