summary:
  ar: "موضع في اليمن جُعل فيه حبس لأبي الغشام وآل يعفر سنة 288هـ، وكان الهادي قد ولى عليه عبيد الله بن محمد، ففتح أهله الحبس بعد مقتل ابن أبي عباد."
  en: "A place in Yemen where Abu al-Ghasham and men of Al Ya'fur were jailed in 288 AH under Ubaydallah ibn Muhammad, al-Hadi's governor, and whose men opened the prison after Ibn Abi Abbad was killed."
  ur: "یمن کا ایک مقام جہاں سنہ 288ھ میں ہادی کے والی عبید اللہ بن محمد کے تحت ابو الغشام اور آل یعفر کے لوگ قید تھے، اور جس کے لوگوں نے ابن ابی عباد کے قتل کے بعد قید خانہ کھول دیا۔"
  es: "Un lugar en Yemen donde Abu al-Ghasham y los hombres de Al Ya'fur fueron encarcelados en el año 288 de la Hégira bajo el mando de Ubaydallah ibn Muhammad, gobernador de al-Hadi, y cuyos hombres abrieron la prisión después de que Ibn Abi Abbad fuera asesinado."
  fr: "Un lieu au Yémen où Abu al-Ghasham et les hommes d'Al Ya'fur furent emprisonnés en 288 AH sous Ubaydallah ibn Muhammad, le gouverneur d'al-Hadi, et dont les hommes ouvrirent la prison après la mort d'Ibn Abi Abbad."
  tr: "Yemen'de, 288 Hicri yılında Ebu el-Gazam ve Ya'far ailesi için bir hapishane kurulan bir yer. El-Hadi, Übeyd Allah ibn Muhammed'i bu yere atamış ve ailesi, İbn Ebi Abbad'ın öldürülmesinden sonra hapishaneye açmıştır."
  id: "Sebuah tempat di Yaman di mana penjara didirikan untuk Abu al-Ghasham dan keluarga Ya'far pada tahun 288 H. Al-Hadi telah menunjuk Ubayd Allah ibn Muhammad sebagai atasnya, dan keluarganya membuka penjara tersebut setelah pembunuhan Ibn Abi Abbad."
