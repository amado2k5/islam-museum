label: { ar: "حائط العجوز", en: "The Old Woman's Wall", es: "El muro de la anciana", fr: "Le mur de la vieille femme", ur: "بوڑھی عورت کی دیوار", tr: "Eski Duvar", id: "Tembok Tua" }
summary:
  ar: "حائط يستدير بالديار المصرية ممتداً على جانب المزدرع كأنه جُعل حاجزاً بين الرمل والزرع؛ مشى ابن فضل الله العمري معه حتى دندرة من الصعيد الأعلى فرآه مبنياً بالطوب قد دثر غالبه ومنقطعه أكثر من متصله، ووجد في كتب أخبار مصر أنه من بناء امرأة اسمها دلوك وأنه يصل إلى ما بين العريش ورفح — وقال إنه لا أثر له هناك ولا في أسافل مصر، ولم يُعرف بانيه على يقين {cite:umari-masalik-1924 p. 239}."
  en: "The wall that ringed Egypt's arable land along the desert edge like a dyke between sand and tilth — al-Umari walked beside it as far as Dendera and found it mudbrick, mostly buried or broken; the Egypt chronicles ascribe it to a queen named Diluk reaching to between al-Arish and Rafah, but he saw no trace there and no true builder is known {cite:umari-masalik-1924 p. 239}."
  es: "La muralla que rodeaba las tierras cultivables de Egipto a lo largo del borde del desierto como un dique entre la arena y la tierra fértil —al-Umari caminó junto a ella hasta Dendera y la encontró de adobe, en su mayoría enterrada o rota; las crónicas egipcias la atribuyen a una reina llamada Diluk que llegó hasta entre al-Arish y Rafah, pero él no vio rastro alguno allí y no se conoce a ningún verdadero constructor {cite:umari-masalik-1924 p. 239}."
  fr: "Le mur qui encerclait les terres arables d'Égypte le long de la lisière du désert comme une digue entre le sable et la terre labourée — al-Umari marcha à côté jusqu'à Dendera et le trouva en briques de terre crue, en grande partie enfoui ou brisé; les chroniques égyptiennes l'attribuent à une reine nommée Diluk s'étendant entre al-Arish et Rafah, mais il n'y vit aucune trace et aucun véritable constructeur n'est connu {cite:umari-masalik-1924 p. 239}."
  ur: "وہ دیوار جس نے مصر کی قابل کاشت زمین کو صحرا کے کنارے پر ریت اور کھیتی کے درمیان ایک بند کی طرح گھیر لیا تھا - العمری اس کے ساتھ ساتھ ڈینڈرا تک گیا اور اسے مٹی کی اینٹ ملی، زیادہ تر دبی ہوئی یا ٹوٹی ہوئی؛ مصر کی تواریخ میں اسے دلق نامی ملکہ سے منسوب کیا گیا ہے جو العریش اور رفح کے درمیان پہنچی تھی، لیکن اس نے وہاں کوئی نشان نہیں دیکھا اور نہ ہی کوئی حقیقی معمار معلوم ہوا {حوالہ: عمری مسالک-1924 ص۔ 239}۔"
  tr: "Mısır topraklarını çevreleyen, dikim alanının kenarı boyunca uzanan, sanki kum ile ürünler arasında bir bariyer oluşturmuş gibi uzanan bir duvar; İbn Fadlallah el-Omeri, Yukarı Mısır'dan Dendera'ya kadar onunla birlikte yürüdü ve tuğlanın tuğladan yapıldığını gördü; tuğlanın çoğu kapalıydı ve bölümleri sürekliliğinden daha parçalıydı. Mısır haberleri kitaplarında, Daluk adında bir kadın tarafından inşa edildiğini ve Ariş ile Rafah arasına uzandığını buldu — ve orada ya da Mısır'ın alt kesimlerinde bunun hiçbir izi olmadığını, inşaatçısının kesin olarak bilinmediğini söyledi {cite:umari-masalik-1924, s. 239}."
  id: "Sebuah tembok yang mengelilingi tanah Mesir, membentang di sisi lahan tanam, seolah-olah telah menciptakan penghalang antara pasir dan tanaman; Ibn Fadlallah al-Omari berjalan bersamanya sejauh Dendera dari Mesir Hulu dan melihatnya dibangun dari batu bata, sebagian besar tertutup dan bagian-bagiannya lebih terfragmentasi daripada kontinuitasnya. Ia menemukan dalam buku-buku berita Mesir bahwa tembok itu dibangun oleh seorang wanita bernama Daluk, dan bahwa tembok itu menjangkau antara Arish dan Rafah — dan ia mengatakan tidak ada jejaknya di sana maupun di bagian bawah Mesir, dan pembangunnya tidak diketahui dengan pasti {cite:umari-masalik-1924, hlm. 239}."
