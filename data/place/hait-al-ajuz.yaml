label: { ar: "حائط العجوز", en: "The Old Woman's Wall" }
summary:
  ar: "حائط يستدير بالديار المصرية ممتداً على جانب المزدرع كأنه جُعل حاجزاً بين الرمل والزرع؛ مشى ابن فضل الله العمري معه حتى دندرة من الصعيد الأعلى فرآه مبنياً بالطوب قد دثر غالبه ومنقطعه أكثر من متصله، ووجد في كتب أخبار مصر أنه من بناء امرأة اسمها دلوك وأنه يصل إلى ما بين العريش ورفح — وقال إنه لا أثر له هناك ولا في أسافل مصر، ولم يُعرف بانيه على يقين {cite:umari-masalik-1924 p. 239}."
  en: "The wall that ringed Egypt's arable land along the desert edge like a dyke between sand and tilth — al-Umari walked beside it as far as Dendera and found it mudbrick, mostly buried or broken; the Egypt chronicles ascribe it to a queen named Diluk reaching to between al-Arish and Rafah, but he saw no trace there and no true builder is known {cite:umari-masalik-1924 p. 239}."
