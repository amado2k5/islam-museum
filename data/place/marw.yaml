  ar: "مرو مدينة خراسان الكبرى؛ أرسل مرزبانها الشاهجان يسأل الصلح فوجه إليها ابن عامر حاتم بن النعمان الباهلي فصالحه على ألفي ألف ومائتي ألف درهم وروي ألف ألف ومائتا ألف جريب بر وشعير وقيل ألف ألف ومائة ألف أوقية وكان في صلحهم أن يوسعوا للمسلمين في منازلهم وكانت كلها صلحاً إلا قرية يقال لها السنج أخذت عنوة."
  en: "Marw, the great city of Khurasan; its marzban's envoy al-Shahijan sued for peace and Hatim ibn al-Nu'man compounded it at a million two hundred thousand — variants: a million dirhams with two hundred thousand jarib of grain, or a million one hundred thousand uqiyya — the terms widening Muslim housing, all of it sulh save the village al-Sanj taken by force."
