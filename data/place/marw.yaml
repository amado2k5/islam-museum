summary:
  ar: "مرو مدينة خراسان الكبرى؛ أرسل مرزبانها الشاهجان يسأل الصلح فوجه إليها ابن عامر حاتم بن النعمان الباهلي فصالحه على ألفي ألف ومائتي ألف درهم وروي ألف ألف ومائتا ألف جريب بر وشعير وقيل ألف ألف ومائة ألف أوقية وكان في صلحهم أن يوسعوا للمسلمين في منازلهم وكانت كلها صلحاً إلا قرية يقال لها السنج أخذت عنوة."
  en: "Marw, the great city of Khurasan; its marzban's envoy al-Shahijan sued for peace and Hatim ibn al-Nu'man compounded it at a million two hundred thousand — variants: a million dirhams with two hundred thousand jarib of grain, or a million one hundred thousand uqiyya — the terms widening Muslim housing, all of it sulh save the village al-Sanj taken by force."
  es: "Marw, la gran ciudad de Jorasán; su enviado marzban al-Shahijan pidió la paz y Hatim ibn al-Nu'man la compensó por un millón doscientos mil —variantes: un millón de dirhams con doscientos mil jarib de grano, o un millón cien mil uqiyya— los términos ampliaron la vivienda musulmana, toda ella sulh excepto la aldea al-Sanj tomada por la fuerza."
  fr: "Marw, la grande ville du Khorasan; l'envoyé de son marzban, al-Shahijan, a demandé la paix et Hatim ibn al-Nu'man a conclu une transaction d'un million deux cent mille — variantes: un million de dirhams avec deux cent mille jarib de grain, ou un million cent mille uqiyya — les termes élargissant le logement musulman, tout cela à l'exception du village d'al-Sanj pris par la force."
  ur: "مرو، خراسان کا عظیم شہر؛ اس کے مرزبان کے ایلچی الشاہیجان نے امن کے لیے مقدمہ دائر کیا اور حاتم ابن النعمان نے اسے ایک ملین دو لاکھ - مختلف قسموں پر مشتمل کیا: ایک ملین درہم جس میں دو لاکھ جریب اناج، یا ایک ملین ایک لاکھ اوقیہ - مسلمانوں کی رہائش کو وسیع کرنے کی شرائط، یہ سب کچھ سلج کے ذریعے گاؤں پر قبضہ کر لیا گیا۔"
