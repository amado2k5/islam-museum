summary:
  ar: "جزيرة ثانية من الجزيرتين التابعتين لملك قامرون، وأهلها يتنازعون مع الصينيين إذا لم تكن بينهم هدنة {cite:nuzhat-al-mushtaq-2002 p. 90}."
  en: "The second of the two islands under Qamrun. Its people fight the Chinese when there is no truce between them {cite:nuzhat-al-mushtaq-2002 p. 90}."
  es: "La segunda de las dos islas bajo Qamrun. Sus habitantes luchan contra los chinos cuando no hay tregua entre ellos {cite:nuzhat-al-mushtaq-2002 p. 90}."
  fr: "La seconde des deux îles sous l'autorité de Qamrun. Ses habitants combattent les Chinois lorsqu'il n'y a pas de trêve entre eux {cite:nuzhat-al-mushtaq-2002 p. 90}."
  ur: "قمرون کے نیچے دو جزیروں میں سے دوسرا۔ اس کے لوگ چینیوں سے اس وقت لڑتے ہیں جب ان کے درمیان کوئی جنگ بندی نہیں ہوتی۔ 90}۔"
  tr: "Qamrun Kralı'na ait ikinci bir ada, sakinleri aralarında ateşkes olmazsa Çinlilerle anlaşmazlık yaşamaktadır {cite:Nuzhat-al-Mushtaq-2002, s. 90}."
  id: "Pulau kedua milik Raja Qamrun, yang penduduknya berselisih dengan Tiongkok jika tidak ada gencatan senjata di antara mereka {cite:Nuzhat-al-Mushtaq-2002, hlm. 90}."
