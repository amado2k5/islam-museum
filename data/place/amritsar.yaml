summary:
  ar: "مدينة وعاصمة مقاطعة في البنجاب الهندي، أسسها الغورو الرابع للسيخ راما داس على أرض منحها الإمبراطور أكبر، وفيها الهيكل الذهبي، أهم أماكن عبادة السيخ، ودمّره أحمد شاه دراني سنة 1762م ثم أعاد السيخ بناءه {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
  en: "Capital of a district in the Punjab, India, founded by the fourth Sikh guru, Ram Das, on land granted by the emperor Akbar; it holds the Harmandir, the chief Sikh place of worship, which Ahmad Shah Durrani destroyed in 1762 and the Sikhs rebuilt {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
  es: "Capital de un distrito en el Punjab, India, fundado por el cuarto gurú sij, Ram Das, en tierras otorgadas por el emperador Akbar; alberga el Harmandir, el principal lugar de culto sij, que Ahmad Shah Durrani destruyó en 1762 y los sijs reconstruyeron {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
  fr: "Capitale d'un district du Pendjab, en Inde, fondée par le quatrième gourou sikh, Ram Das, sur des terres concédées par l'empereur Akbar; elle abrite le Harmandir, le principal lieu de culte sikh, qu'Ahmad Shah Durrani a détruit en 1762 et que les Sikhs ont reconstruit {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
  ur: "پنجاب، ہندوستان کے ایک ضلع کا دارالحکومت، جس کی بنیاد چوتھے سکھ گرو رام داس نے شہنشاہ اکبر کی عطا کردہ زمین پر رکھی تھی۔ اس میں سکھوں کی سب سے بڑی عبادت گاہ ہرمندر ہے جسے احمد شاہ درانی نے 1762 میں تباہ کر دیا تھا اور سکھوں نے دوبارہ تعمیر کیا تھا۔ 1 ص۔ 476}۔"
