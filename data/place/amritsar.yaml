summary:
  ar: "مدينة وعاصمة مقاطعة في البنجاب الهندي، أسسها الغورو الرابع للسيخ راما داس على أرض منحها الإمبراطور أكبر، وفيها الهيكل الذهبي، أهم أماكن عبادة السيخ، ودمّره أحمد شاه دراني سنة 1762م ثم أعاد السيخ بناءه {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
  en: "Capital of a district in the Punjab, India, founded by the fourth Sikh guru, Ram Das, on land granted by the emperor Akbar; it holds the Harmandir, the chief Sikh place of worship, which Ahmad Shah Durrani destroyed in 1762 and the Sikhs rebuilt {cite:encyclopaedia-of-islam-2 vol. 1 p. 476}."
