summary:
  ar: "بلدة على الشاطئ الغربي من نهر الفرات بالقرب من الكوفة، منها أصل إبراهيم جدّ العرب المستعربة في رواية الرحيق المختوم، وقد جاءت الحفريات بتفاصيل واسعة عنها وعن أسرة إبراهيم؛ وذُكر قوم سبأ في حفرياتها بخمسة وعشرين قرناً قبل الميلاد."
  en: "A town on the west bank of the Euphrates near Kufa, the origin of Ibrahim, ancestor of the Arabized Arabs, in al-Raheeq al-Makhtum's account; excavations there gave details of the town and Ibrahim's family, and mention the Sabaeans twenty-five centuries before the Common Era."
