summary:
  ar: "بلدة على الشاطئ الغربي من نهر الفرات بالقرب من الكوفة، منها أصل إبراهيم جدّ العرب المستعربة في رواية الرحيق المختوم، وقد جاءت الحفريات بتفاصيل واسعة عنها وعن أسرة إبراهيم؛ وذُكر قوم سبأ في حفرياتها بخمسة وعشرين قرناً قبل الميلاد."
  en: "A town on the west bank of the Euphrates near Kufa, the origin of Ibrahim, ancestor of the Arabized Arabs, in al-Raheeq al-Makhtum's account; excavations there gave details of the town and Ibrahim's family, and mention the Sabaeans twenty-five centuries before the Common Era."
  es: "Una ciudad en la orilla occidental del Éufrates, cerca de Kufa, lugar de origen de Ibrahim, antepasado de los árabes arabizados, según el relato de al-Raheeq al-Makhtum; las excavaciones realizadas allí proporcionaron detalles de la ciudad y de la familia de Ibrahim, y mencionan a los sabeos veinticinco siglos antes de nuestra era."
  fr: "Une ville située sur la rive ouest de l'Euphrate, près de Koufa, berceau d'Ibrahim, ancêtre des Arabes arabisés, selon le récit d'al-Raheeq al-Makhtum; les fouilles qui y ont été menées ont permis de recueillir des détails sur la ville et la famille d'Ibrahim, et mentionnent les Sabéens vingt-cinq siècles avant notre ère."
