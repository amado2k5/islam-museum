summary:
  ar: "ضيعة وقصور بعيدة من معظم النيل، عامرة بالناس، وفيها مزارع للقصب يُعمل منها السكر والفانيذ ما يكفي أكثر ديار مصر. وتبعد عن سمسطا وعن النيل مسافة قريبة. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  en: "An estate-village with palaces some distance from the main Nile, populated and with sugar-cane fields. Sugar and fanid are produced there in quantities that the author says would supply most of Egypt. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  es: "Un pueblo-finca con palacios, situado a cierta distancia del Nilo principal, poblado y con campos de caña de azúcar. Allí se produce azúcar y fanid en cantidades que, según el autor, abastecerían a la mayor parte de Egipto. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  fr: "Un village-domaine avec des palais, situé à une certaine distance du Nil principal, peuplé et parsemé de champs de canne à sucre. On y produit du sucre et du fanid en quantités qui, selon l'auteur, suffiraient à approvisionner la majeure partie de l'Égypte. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  ur: "مرکزی نیل سے کچھ فاصلے پر محلات کے ساتھ ایک اسٹیٹ گاؤں، آبادی والا اور گنے کے کھیت۔ چینی اور فینیڈ وہاں اتنی مقدار میں پیدا ہوتے ہیں جو مصنف کے بقول زیادہ تر مصر کو فراہم کرتی ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 131}"
  tr: "Nil'in çoğundan uzakta bir köy ve saraylar, insanlarla dolu, ve Mısır'ın çoğu anavatanına yetecek kadar şeker ve vanidh üreten şeker kamışı çiftlikleri vardır. Samasta ve Nil'e kısa bir mesafede yer almaktadır. {cite:nuzhat-al-mushtaq-2002 s. 131}"
  id: "Desa dan istana yang jauh dari sebagian besar Sungai Nil, dipenuhi orang, dan memiliki perkebunan tebu yang menghasilkan gula dan vanidh cukup untuk sebagian besar tanah air Mesir. Lokasinya tidak jauh dari Samasta dan Sungai Nil. {cite:nuzhat-al-mushtaq-2002 hlm. 131}"
