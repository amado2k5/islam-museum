summary:
  ar: "قصر المسيرين بالبصرة كان لعبد الرحمن بن زياد وكان الحجاج سير عيال من خرج مع عبد الرحمن بن محمد بن الأشعث إليه فحبسهم فيه وهو قصر في جوف قصر ويتلوه قصر عبيد الله بن زياد وإلى جانبه جوسق."
  en: "Qasr al-Musayyirin at Basra, Abd al-Rahman ibn Ziyad's, where al-Hajjaj jailed the families of Ibn al-Ash'ath's followers — a palace within a palace — beside Ubaydallah ibn Ziyad's palace and its jawsaq."
  es: "Qasr al-Musayyirin en Basora, la residencia de Abd al-Rahman ibn Ziyad, donde al-Hajjaj encarceló a las familias de los seguidores de Ibn al-Ash'ath —un palacio dentro de otro palacio— junto al palacio de Ubaydallah ibn Ziyad y su jawsaq."
  fr: "Qasr al-Musayyirin à Basra, le palais d'Abd al-Rahman ibn Ziyad, où al-Hajjaj a emprisonné les familles des partisans d'Ibn al-Ash'ath — un palais dans un palais — à côté du palais d'Ubaydallah ibn Ziyad et de son jawsaq."
  ur: "بصرہ میں قصر المسیرین، عبدالرحمٰن ابن زیاد کا، جہاں الحجاج نے ابن الاشعث کے پیروکاروں کے خاندانوں کو جیل میں ڈال دیا - ایک محل کے اندر ایک محل - عبیداللہ ابن زیاد کے محل اور اس کے جواسق کے ساتھ۔"
  tr: "Basra'daki yolcuların sarayı Abd al-Rahman ibn Ziyad'a aitti ve el-Hacac, Abd al-Rahman ibn Muhammed ibn al-Ash'ath ile birlikte ona gidenlerin ailesinin koruyucusuydu; burası bir saray içinde bir saray, ardından Ubeyd Allah ibn Ziyad'ın sarayı ve yanında bir 'Jawsaq' bulunmaktadır."
  id: "Istana para pelancong di Basra milik Abd al-Rahman ibn Ziyad, dan al-Hajjaj adalah wali keluarga mereka yang pergi bersama Abd al-Rahman ibn Muhammad ibn al-Ash'ath kepadanya, memenjarakan mereka di sana, yang merupakan istana di dalam istana, diikuti oleh istana Ubayd Allah ibn Ziyad, dan di sampingnya terdapat 'Jawsaq."
