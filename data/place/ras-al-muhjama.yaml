  ur: "ساحل پر ایک اونچی سر زمین، مسافروں کے درمیان سے گزرتی ہے، جس کے سرے پر موتیوں کے بستر تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 156}"
  tr: "Deniz kıyısında yüksek bir dağ, karada yolcular tarafından gezilir, denizde inciler bulunur. {cite:nuzhat-al-mushtaq-2002 s. 156}"
