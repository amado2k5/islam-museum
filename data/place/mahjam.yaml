summary:
  ar: "مدينة صغيرة كالحصن، يجتمع فيها أهلها، وتقع على الحد بين أرض داحس وأرض اليمن، وتبعد عن عدن ثماني مراحل، وعن صنعاء سبع مراحل {cite:nuzhat-al-mushtaq-2002 p. 55}."
  en: "A small, fort-like town where its people gather, on the border between Dahis land and Yemen. Eight stages from Aden and seven from Sanaa {cite:nuzhat-al-mushtaq-2002 p. 55}."
  es: "Un pequeño pueblo fortificado donde se reúnen sus habitantes, en la frontera entre la tierra de Dahis y Yemen. A ocho etapas de Adén y a siete de Saná {cite:nuzhat-al-mushtaq-2002 p. 55}."
  fr: "Une petite ville fortifiée, lieu de rassemblement de ses habitants, à la frontière entre le pays de Dahis et le Yémen. À huit étapes d'Aden et sept de Sanaa {cite:nuzhat-al-mushtaq-2002 p. 55}."
