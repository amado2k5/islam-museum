summary:
  ar: على الكُرّ من كورة جرزان القرمز؛ كتب حبيب بن مسلمة لأهلها صلحاً بالأمان على الأنفس والبيع والصوامع والدين على دينار
    عن كل بيت جزية مع شرائط القرى والنصح والإيصال ثم صادق الجرّاح بن عبد الله أمانهم على أرحائهم وكرومهم بمائة درهم في السنة.
  en: on the Kura in the district of Jurzan al-Qirmiz; Habib ibn Maslama wrote its people a peace securing selves, worship-houses,
    monasteries and religion for a dinar's jizya per house with terms of quartering, counsel and conveyance, and al-Jarrah
    ibn Abdallah later ratified their aman over their mills and vineyards at a hundred dirhams a year.
  ur: دریائے کر کے کنارے شہر؛ بلاذری حبیب بن مسلمہ کی صلح کا ذکر کرتے ہیں، جس میں لوگوں کی جان، مذہب اور عبادت گاہوں کے لیے
    امان درج تھی۔ {cite:futuh-buldan-maarif-1407}
  es: "En Kura, en el distrito de Jurzan al-Qirmiz, Habib ibn Maslama escribió a su gente un tratado de paz que garantizaba sus derechos, lugares de culto, monasterios y religión a cambio de una jizya de un dinar por casa, con condiciones de alojamiento, asesoramiento y transporte. Posteriormente, al-Jarrah ibn Abdallah ratificó su aman sobre sus molinos y viñedos a razón de cien dirhams al año."
  fr: "sur la Kura dans le district de Jurzan al-Qirmiz; Habib ibn Maslama a écrit à ses habitants une paix garantissant leurs personnes, leurs lieux de culte, leurs monastères et leur religion pour une jizya d'un dinar par maison avec des conditions de logement, de conseil et de transport, et al-Jarrah ibn Abdallah a ratifié plus tard leur aman sur leurs moulins et leurs vignobles à cent dirhams par an."
  tr: "Kırmızı halının tepesinde; Habib bin Maslama, halkına her ev için bir dinar için yaşam güvenliği, satış, silo ve borç, köy tahvilleri, tavsiye ve teslimat içeren bir barış anlaşması yazdı. Sonra Al-Jarrah ibn Abdullah, akrabaları ve bağları için yılda yüz dirhem karşılığında güvence bağladı."
  id: "Di bukit karpet merah; Habib ibn Maslama menulis kepada rakyatnya perjanjian damai tentang keselamatan nyawa, penjualan, silo, dan utang satu dinar untuk setiap rumah, beserta obligasi desa, nasihat, dan pengiriman. Kemudian Al-Jarrah ibn Abdullah berteman dengan kepercayaan mereka terhadap kerabat dan kebun anggur dengan biaya seratus dirham per tahun."
