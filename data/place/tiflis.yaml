summary:
  ar: على الكُرّ من كورة جرزان القرمز؛ كتب حبيب بن مسلمة لأهلها صلحاً بالأمان على الأنفس والبيع والصوامع والدين على دينار
    عن كل بيت جزية مع شرائط القرى والنصح والإيصال ثم صادق الجرّاح بن عبد الله أمانهم على أرحائهم وكرومهم بمائة درهم في السنة.
  en: on the Kura in the district of Jurzan al-Qirmiz; Habib ibn Maslama wrote its people a peace securing selves, worship-houses,
    monasteries and religion for a dinar's jizya per house with terms of quartering, counsel and conveyance, and al-Jarrah
    ibn Abdallah later ratified their aman over their mills and vineyards at a hundred dirhams a year.
  ur: دریائے کر کے کنارے شہر؛ بلاذری حبیب بن مسلمہ کی صلح کا ذکر کرتے ہیں، جس میں لوگوں کی جان، مذہب اور عبادت گاہوں کے لیے
    امان درج تھی۔ {cite:futuh-buldan-maarif-1407}
