  ar: "مجموعة جزر عامرة بالناس تكثر فيها النارجيل وقصب السكر، ويتجرون فيها بالودع، ويصنعون ثياباً وأدوات بالأيدي، وتبيض فيها السلاحف على البر. ويذكر المؤلف أن أهلها مجوس {cite:nuzhat-al-mushtaq-2002 p. 70}."
  en: "A group of populated islands with many coconut palms and sugar cane. Trade is in cowrie shells, and the people make crafts by hand. Turtles lay their eggs on the shore. The author says the people are Magians {cite:nuzhat-al-mushtaq-2002 p. 70}."
