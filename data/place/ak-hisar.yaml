label:
  ar: آق حصار
  en: Ak Hisar ('White Castle', a place name and a nisba)
  es: "Ak Hisar ('Castillo Blanco', un topónimo y un nisba)"
  fr: "Ak Hisar (« Château Blanc », un nom de lieu et une nisba)"
  ur: "اک حصار ⁦('سفید قلعہ'، ایک جگہ کا نام اور نسبہ)⁩"
summary:
  ar: آق حصار، أي «القلعة البيضاء»، اسم عدة أماكن، ومنه نسبة عدد من المؤلفين. ومن أشهرهم في البوسنة قلعة آق حصار، وقد بدأ فيها أحد علمائها كتابة تفسيره «نزول التنزيل» سنة 981هـ/1574م، وكان الحسن كافي قاضيًا فيها أكثر من عشرين سنة {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}.
  en: Ak Hisar, 'White Castle', is the name of several places, and gives the nisba of a number of authors. The best known is the castle in Bosnia, where the scholar Muhammad b. Badr al-Din began his popular Qur'an commentary Nazil al-tanzil in 981/1574, and where Hasan Kafi was qadi for more than twenty years. Other authors of the nisba are listed in the article {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}.
  es: "Ak Hisar, «Castillo Blanco», es el nombre de varios lugares y da origen a la nisba de varios autores. El más conocido es el castillo en Bosnia, donde el erudito Muhammad b. Badr al-Din comenzó su popular comentario del Corán, Nazil al-tanzil, en 981/1574, y donde Hasan Kafi fue cadí durante más de veinte años. Otros autores de la nisba se mencionan en el artículo {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}."
  fr: "Ak Hisar, « Château Blanc », désigne plusieurs lieux et est mentionné dans la nisba de nombreux auteurs. Le plus connu est le château de Bosnie, où le savant Muhammad b. Badr al-Din commença son commentaire coranique populaire, Nazil al-tanzil, en 981/1574, et où Hasan Kafi exerça la fonction de cadi pendant plus de vingt ans. D'autres auteurs de la nisba sont répertoriés dans l'article {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}."
  ur: "اک حصار، 'سفید قلعہ'، کئی جگہوں کا نام ہے، اور متعدد مصنفین کی نسبت دیتا ہے۔ سب سے زیادہ مشہور بوسنیا کا قلعہ ہے، جہاں عالم محمد بی۔ بدر الدین نے 981/1574 میں اپنی مقبول قرآن تفسیر نزل التنزیل کا آغاز کیا اور جہاں حسن کافی بیس سال سے زیادہ عرصہ تک قاضی رہے۔ نسبہ کے دیگر مصنفین مضمون {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 331}۔"
