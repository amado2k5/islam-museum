label:
  ar: "آق حصار"
  en: "Ak Hisar ('White Castle', a place name and a nisba)"
summary:
  ar: "آق حصار، أي «القلعة البيضاء»، اسم عدة أماكن، ومنه نسبة عدد من المؤلفين. ومن أشهرهم في البوسنة قلعة آق حصار، وقد بدأ فيها أحد علمائها كتابة تفسيره «نزول التنزيل» سنة 981هـ/1574م، وكان الحسن كافي قاضيًا فيها أكثر من عشرين سنة {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}."
  en: "Ak Hisar, 'White Castle', is the name of several places, and gives the nisba of a number of authors. The best known is the castle in Bosnia, where the scholar Muhammad b. Badr al-Din began his popular Qur'an commentary Nazil al-tanzil in 981/1574, and where Hasan Kafi was qadi for more than twenty years. Other authors of the nisba are listed in the article {cite:encyclopaedia-of-islam-2 vol. 1 p. 331}."
