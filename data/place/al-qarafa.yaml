label: { ar: "القرافة ⁦(المقبرة الجنوبية بالقاهرة)⁩", en: "al-Qarafa (Southern Cemetery of Cairo)", ur: "القرافہ ⁦(قاہرہ کا جنوبی قبرستان)⁩", es: "al-Qarafa (Cementerio del Sur de El Cairo)", fr: "al-Qarafa (Cimetière sud du Caire)", tr: "El-Karafa (Kahire'deki Güney Mezarlığı)", id: "Al-Qarafa (Pemakaman Selatan di Kairo)" }
summary:
  ar: "مقبرة القاهرة الجنوبية، فيها مشاهد آل البيت وضريح الشافعي، كانت ولا تزال مقصد الزيارة الفردية والجماعية، ووصفها ابن جبير سنة 1183م بأنها من عجائب الدنيا {cite:yeomans-islamic-cairo-2006 p.112}."
  en: "Cairo's Southern Cemetery, with the shrines of the Prophet's descendants and the tomb of al-Shafi'i, a place of individual and collective pilgrimage then and now, which Ibn Jubayr in 1183 called one of the wonders of the world {cite:yeomans-islamic-cairo-2006 p.112}."
  es: "El cementerio del sur de El Cairo, con los santuarios de los descendientes del Profeta y la tumba de al-Shafi'i, un lugar de peregrinación individual y colectiva entonces y ahora, que Ibn Jubayr en 1183 llamó una de las maravillas del mundo {cite:yeomans-islamic-cairo-2006 p.112}."
  fr: "Le cimetière sud du Caire, avec les sanctuaires des descendants du Prophète et le tombeau d'al-Shafi'i, un lieu de pèlerinage individuel et collectif hier comme aujourd'hui, qu'Ibn Jubayr qualifiait en 1183 de l'une des merveilles du monde {cite:yeomans-islamic-cairo-2006 p.112}."
  ur: "قاہرہ کا جنوبی قبرستان، جس میں پیغمبر کی اولاد کے مزارات اور الشافعی کی قبر ہے، اس وقت اور اب انفرادی اور اجتماعی زیارت کی جگہ ہے، جسے ابن جبیر نے 1183 میں دنیا کے عجائبات میں سے ایک قرار دیا تھا۔"
  tr: "Ehl-el-Beyt sahneleri ve El-Şafii'nin türbesinin bulunduğu Güney Kahire Mezarlığı, her zaman bireysel ve grup ziyaretleri için bir destinasyon olmuştur. İbn Cubeyr, 1183 yılında burayı dünyanın harikalarından biri olarak tanımlamıştır {cite:yeomans-Islamic-cairo-2006 s.112}."
  id: "Pemakaman Kairo Selatan, yang memuat adegan Ahl al-Bayt dan makam Al-Shafi'i, selalu menjadi tujuan kunjungan individu maupun kelompok. Ibn Jubayr menggambarkannya pada tahun 1183 M sebagai salah satu keajaiban dunia {cite:yeomans-Islamic-cairo-2006 hlm.112}."
