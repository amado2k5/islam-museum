summary:
  ar: "حصن يشبه المدينة الصغيرة، حسن، وأكثر نبات أرضه شجر الخرنوب، ويُتجهز منه بالخرنوب إلى البلاد. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  en: "A fortress resembling a small town, fine, whose land is mostly carob trees, from which carob is carried to other lands. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  es: "Una fortaleza que se asemeja a un pequeño pueblo, hermosa, cuyo terreno está compuesto principalmente de algarrobos, de los cuales se transporta la algarroba a otras tierras. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  fr: "Une forteresse ressemblant à une petite ville, bien construite, dont le territoire est principalement couvert de caroubiers, d'où la caroube est exportée vers d'autres contrées. {cite:nuzhat-al-mushtaq-2002 p. 371}"
  ur: "ایک چھوٹے سے قصبے سے مشابہ ایک قلعہ، ٹھیک ہے، جس کی زمین زیادہ تر کاروب کے درختوں پر مشتمل ہے، جہاں سے کاروب کو دوسری زمینوں میں لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 371}"
