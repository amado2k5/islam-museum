label: { ar: "آلاجا حصار", en: "Aladja Hisar (Krushevac, Serbia)" }
summary:
  ar: "آلاجا حصار، ومعناها «القلعة متعددة الألوان»، اسم تركي لمدينة كروشيفاتس على الضفة الجنوبية لموراغا الغربية، وكانت عاصمة الصرب في عهد لازار وابنه إستيفان، وأخضعها الأتراك سنة 1428م، ثم صارت لواء في إيالة رومللي، وانتقلت سنة 1833م إلى الإمارة الصربية المستقلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  en: "Aladja Hisar, 'the motley-coloured fortress', the Turkish name of Krushevac on the south bank of the Western Morava in Serbia. It was the Serbian capital under Lazar and his son Stephan, was occupied by the Turks in 1428, became a sanjak in the eyalet of Rumeli, and was ceded to the autonomous principality of Serbia in 1833 {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
