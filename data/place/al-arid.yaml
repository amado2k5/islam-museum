summary:
  ar: "المنطقة الوسطى من نجد في جزيرة العرب، تمتد على وادي حنيفة تحت حافة طويق. من بلداتها العيينة، مولد محمد بن عبد الوهاب، والدرعية أول عاصمة لآل سعود، والرياض عاصمتهم اليوم، وكانت معقل الإصلاح الديني منذ القرن الثاني عشر الهجري ⁦(الثامن عشر الميلادي)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 676}."
  en: "The central district of Najd in Arabia, centred on Wadi Hanifa below the Tuwayq escarpment. Its towns include al-'Uyayna, the birthplace of Muhammad ibn 'Abd al-Wahhab, al-Dir'iyya, the first capital of Al Sa'ud, and al-Riyad, their capital today. From the twelfth/eighteenth century the district was the great stronghold of the reform movement {cite:encyclopaedia-of-islam-2 vol. 1 p. 676}."
  es: "El distrito central de Najd en Arabia, centrado en Wadi Hanifa, bajo la escarpa de Tuwayq. Entre sus ciudades se encuentran al-'Uyayna, lugar de nacimiento de Muhammad ibn 'Abd al-Wahhab, al-Dir'iyya, la primera capital de Al Sa'ud, y al-Riyad, su capital actual. Desde el siglo XII/XVIII, el distrito fue el principal bastión del movimiento reformista {cite:encyclopaedia-of-islam-2 vol. 1 p. 676}."
  fr: "Le district central du Najd, en Arabie, s'étend autour du Wadi Hanifa, au pied de l'escarpement de Tuwayq. Ses villes comprennent al-'Uyayna, ville natale de Muhammad ibn 'Abd al-Wahhab, al-Dir'iyya, première capitale des Saoud, et al-Riyad, leur capitale actuelle. Du XIIe/XVIIIe siècle, ce district fut un bastion du mouvement réformateur (voir Encyclopaedia of Islam, vol. 1, p. 676)."
  ur: "عرب میں نجد کا مرکزی ضلع، طویق کے نیچے وادی حنیفہ پر مرکز ہے۔ اس کے قصبوں میں محمد بن عبد الوہاب کی جائے پیدائش العیینہ، آل سعود کا پہلا دارالحکومت الدریہ اور آج ان کا دارالحکومت الریاض شامل ہیں۔ بارہویں/اٹھارویں صدی سے یہ ضلع اصلاحی تحریک کا بڑا گڑھ تھا۔ 1 ص۔ 676}۔"
  tr: "Arap Yarımadası'ndaki Necd merkezi bölgesi, Tuwaiq'in sınırının altında Wadi Hanifa boyunca uzanır. Kasabaları arasında Muhammed bin Abd al-Wahhab'ın doğum yeri bulunur; Diriyah Al Saud'un ilk başkentidir ve bugün Riyad onların başkentidir. 12. yüzyıldan (18. yüzyıl) bu yana dini reformun kalesi olmuştur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 676}."
  id: "Wilayah tengah Najd di Semenanjung Arab membentang di atas Wadi Hanifa di bawah tepi Tuwaiq. Di antara kota-kotanya terdapat tempat kelahiran Muhammad ibn Abd al-Wahhab, Diriyah adalah ibu kota pertama Al Saud, dan Riyadh adalah ibu kota mereka saat ini. Kota ini telah menjadi benteng reformasi agama sejak abad ke-12 H (abad ke-18 M) {sitasi: Encyclopaedia-of-Islam-2 vol. 1, hlm. 676}."
