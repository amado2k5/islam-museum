label: { ar: "العارض", en: "Al-'Arid" }
summary:
  ar: "المنطقة الوسطى من نجد في جزيرة العرب، تمتد على وادي حنيفة تحت حافة طويق. من بلداتها العيينة، مولد محمد بن عبد الوهاب، والدرعية أول عاصمة لآل سعود، والرياض عاصمتهم اليوم، وكانت معقل الإصلاح الديني منذ القرن الثاني عشر الهجري (الثامن عشر الميلادي) {cite:encyclopaedia-of-islam-2 vol. 1 p. 676}."
  en: "The central district of Najd in Arabia, centred on Wadi Hanifa below the Tuwayq escarpment. Its towns include al-'Uyayna, the birthplace of Muhammad ibn 'Abd al-Wahhab, al-Dir'iyya, the first capital of Al Sa'ud, and al-Riyad, their capital today. From the twelfth/eighteenth century the district was the great stronghold of the reform movement {cite:encyclopaedia-of-islam-2 vol. 1 p. 676}."
