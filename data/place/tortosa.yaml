summary:
  ar: "مدينة حصينة على سفح جبل لها سور حصين، وفيها يُنشأ المراكب الكبار من خشب جبال المدينة، وخشب الصنوبر فيها لا يفعل فيه السوس شيئاً. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  en: "A strong city on a mountain slope with a sturdy wall, where large ships are built from the pine timber of its hills, which worms do not easily damage. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  es: "Una ciudad fuerte en la ladera de una montaña con una muralla robusta, donde se construyen grandes barcos con la madera de pino de sus colinas, que los gusanos no dañan fácilmente. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  fr: "Une ville fortifiée, bâtie à flanc de montagne et entourée de remparts robustes, où l'on construit de grands navires avec le bois de pin des collines environnantes, un bois que les vers ne peuvent facilement endommager. {cite:nuzhat-al-mushtaq-2002 p. 555}"
  ur: "ایک مضبوط دیوار کے ساتھ پہاڑی ڈھلوان پر ایک مضبوط شہر، جہاں اس کی پہاڑیوں کی دیودار کی لکڑی سے بڑے بڑے جہاز بنائے جاتے ہیں، جنہیں کیڑے آسانی سے نقصان نہیں پہنچاتے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 555}"
  tr: "Dağın yamacında, güçlü duvarlı tahkimatlı bir şehir; büyük tekneler şehrin dağlarının ormanlarından yapılır ve çam ağacı vahşi böcekler tarafından kullanılır. {cite:nuzhat-al-mushtaq-2002 s. 555}"
  id: "Sebuah kota benteng di lereng gunung dengan tembok kuat, di mana perahu besar dibangun dari kayu pegunungan kota, dan kayu pinus digunakan oleh kumbang weevil. {cite:nuzhat-al-mushtaq-2002 hlm. 555}"
