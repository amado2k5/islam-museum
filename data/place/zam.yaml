summary:
  ar: "مدينة تقارب آمل في الكبر، فيها عمارات وزروع وتجارات وصنائع، وعلى طريق مسافري خراسان؛ وتبعد عن الترمذ أربع مراحل. {cite:nuzhat-al-mushtaq-2002 p. 481}"
  en: "A town nearly as large as Amul, with buildings, fields, trade and crafts, on the road of travellers to Khurasan; four stages from Tirmidh. {cite:nuzhat-al-mushtaq-2002 p. 481}"
  es: "Una ciudad casi tan grande como Amul, con edificios, campos, comercio y artesanía, en la ruta de los viajeros a Jorasán; a cuatro etapas de Tirmidhi. {cite:nuzhat-al-mushtaq-2002 p. 481}"
  fr: "Une ville presque aussi grande qu'Amul, avec des bâtiments, des champs, du commerce et de l'artisanat, sur la route des voyageurs vers le Khorasan; à quatre étapes de Tirmidh. {cite:nuzhat-al-mushtaq-2002 p. 481}"
  ur: "ایک قصبہ تقریباً امول جتنا بڑا، جس میں عمارتیں، کھیت، تجارت اور دستکاری، خراسان جانے والے مسافروں کی سڑک پر۔ ترمذی سے چار مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 481}"
  tr: "Dönemi Amal'a yakın, binaları, çiftlikleri, ticareti ve sanayileriyle yakın, Horasan yolunda yer alan bir şehir; Tirmidh'e dört etap uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 481}"
  id: "Sebuah kota yang dekat dengan Amal pada zamannya, dengan bangunan, pertanian, perdagangan, dan industri, serta di jalan pelancong Khorasan; kota ini berjarak empat tahap dari Tirmidh. {cite:nuzhat-al-mushtaq-2002 hlm. 481}"
