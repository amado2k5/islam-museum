summary:
  ar: "مدينة متحضرة كبيرة القطر، في مستو من الأرض، ذات مياه جارية ومزارع وخيرات، ويذكر المؤلف أنها تبعد عن أقرة شمالا أربعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 883} {cite:nuzhat-al-mushtaq-2002 p. 884}."
  en: "A civilised, large city on level ground with running water, farms and abundant produce; the author gives forty miles north to Aqra {cite:nuzhat-al-mushtaq-2002 p. 883} {cite:nuzhat-al-mushtaq-2002 p. 884}."
  es: "Una ciudad grande y civilizada en terreno llano con agua corriente, granjas y abundante producción; el autor sitúa cuarenta millas al norte de Aqra {cite:nuzhat-al-mushtaq-2002 p. 883} {cite:nuzhat-al-mushtaq-2002 p. 884}."
  fr: "Une grande ville civilisée sur un terrain plat avec de l'eau courante, des fermes et des produits abondants; l'auteur donne quarante milles au nord d'Aqra {cite:nuzhat-al-mushtaq-2002 p. 883} {cite:nuzhat-al-mushtaq-2002 p. 884}."
  ur: "بہتے پانی، کھیتوں اور وافر پیداوار کے ساتھ سطح زمین پر ایک مہذب، بڑا شہر؛ مصنف نے اقرا کو شمال میں چالیس میل کا فاصلہ دیا ہے۔ 883} {حوالہ: نزہت المشتاق-2002 ص۔ 884}۔"
  tr: "Düz bir arazide büyük, medeni bir şehir, akan su, çiftlikler ve kaynaklara sahip. Yazar, buranın Aqra'nın kırk mil kuzeyinde olduğunu belirtiyor {cite:Nuzhat-al-Mushtaq-2002 s. 883} {cite:Nuzhat-al-Mushtaq-2002 s. 884}."
  id: "Sebuah kota besar dan beradab di tanah datar, dengan air mengalir, pertanian, dan sumber daya. Penulis menyebutkan bahwa kota ini berjarak empat puluh mil di utara Aqra {cite:Nuzhat-al-Mushtaq-2002 hlm. 883} {cite:Nuzhat-al-Mushtaq-2002 hlm. 884}."
