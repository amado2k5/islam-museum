summary:
  ar: "عند البلاذري: بلدة من كسكر — وفي نسخة زندرود — مرّ بها خالد بن الوليد في مسيره إلى الحيرة فافتتحها وافتتح درنى وذواتها بأمان بعد أن كانت من أهل زندورد ثم هرمزجرد فآمن أهلها وفتحها."
  en: "In al-Baladhuri: a town of Kaskar — one copy reads Zandarud — which Khalid ibn al-Walid passed and opened on the march to al-Hira, opening Durna and her daughter-towns — formerly of Zandaward's people — by aman, then Hurmuzjird whose people he safe-conducted and opened."
  es: "En al-Baladhuri: una ciudad de Kaskar —una copia dice Zandarud— que Khalid ibn al-Walid pasó y abrió en la marcha hacia al-Hira, abriendo Durna y sus ciudades hijas —anteriormente del pueblo de Zandaward— por aman, luego Hurmuzjird, cuyo pueblo él protegió y abrió."
  fr: "Dans al-Baladhuri: une ville de Kaskar — une copie dit Zandarud — que Khalid ibn al-Walid a traversée et ouverte sur la marche vers al-Hira, ouvrant Durna et ses villes filles — autrefois du peuple de Zandaward — par aman, puis Hurmuzjird dont il a mis le peuple en sécurité et ouvert."
