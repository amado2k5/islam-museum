label:
  ar: "العوالق"
  en: "'Awlaki (tribal confederation and territory)"
summary:
  ar: "اتحاد قبلي وإقليم في جنوب الجزيرة العربية، وهو أقصى المناطق شرقًا في محمية عدن الغربية، ينقسم بوادٍ كبير إلى قسمين: العوالق العليا، وهي أغنى المنطقتين وأقواهما، ومساحتها نحو 100,000 كيلومتر مربع وسكانها بين 30,000 و50,000، ومقر سلطانها أنصاب؛ والعوالق السفلى، وهي جافة في الغالب، ومقر سلطانها الأحور {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A tribal confederation and territory of south Arabia, the easternmost district of the Western Aden Protectorate, divided by the Kawr 'Awdhilla into Upper 'Awlaki, the richest and most powerful part, of about 100,000 square kilometres and 30,000 to 50,000 inhabitants, with its Sultan at Ansab, and Lower 'Awlaki, mostly arid, with its Sultan at Ahwar {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
