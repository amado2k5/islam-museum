summary:
  ar: "اتحاد قبلي وإقليم في جنوب الجزيرة العربية، وهو أقصى المناطق شرقًا في محمية عدن الغربية، ينقسم بوادٍ كبير إلى قسمين: العوالق العليا، وهي أغنى المنطقتين وأقواهما، ومساحتها نحو 100,000 كيلومتر مربع وسكانها بين 30,000 و50,000، ومقر سلطانها أنصاب؛ والعوالق السفلى، وهي جافة في الغالب، ومقر سلطانها الأحور {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A tribal confederation and territory of south Arabia, the easternmost district of the Western Aden Protectorate, divided by the Kawr 'Awdhilla into Upper 'Awlaki, the richest and most powerful part, of about 100,000 square kilometres and 30,000 to 50,000 inhabitants, with its Sultan at Ansab, and Lower 'Awlaki, mostly arid, with its Sultan at Ahwar {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  es: "Una confederación tribal y territorio del sur de Arabia, el distrito más oriental del Protectorado de Adén Occidental, dividido por el Kawr 'Awdhilla en Alto 'Awlaki, la parte más rica y poderosa, de unos 100.000 kilómetros cuadrados y entre 30.000 y 50.000 habitantes, con su sultán en Ansab, y Bajo 'Awlaki, mayormente árido, con su sultán en Ahwar {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  fr: "Une confédération tribale et un territoire du sud de l'Arabie, le district le plus oriental du protectorat d'Aden occidental, divisé par le Kawr 'Awdhilla en Haut 'Awlaki, la partie la plus riche et la plus puissante, d'environ 100 000 kilomètres carrés et de 30 000 à 50 000 habitants, avec son sultan à Ansab, et Bas 'Awlaki, principalement aride, avec son sultan à Ahwar {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  ur: "جنوبی عرب کا ایک قبائلی کنفیڈریشن اور علاقہ، مغربی عدن پروٹیکٹوریٹ کا سب سے مشرقی ضلع، جسے قاور عوضلہ نے بالائی 'اولکی' میں تقسیم کیا ہے، جو کہ سب سے امیر اور طاقتور حصہ ہے، تقریباً 100,000 مربع کلومیٹر اور 30,000 سے 50,000 آبادی کے ساتھ اس سے کم آبادی پر مشتمل ہے۔ 'اولکی، زیادہ تر بنجر، اہور میں اپنے سلطان کے ساتھ {حوالہ: انسائیکلوپیڈیا آف اسلام-2 جلد۔ 1 ص۔ 816}۔"
  tr: "Batı Aden Koruyuculuğu'nun en doğudaki bölgesi olan güney Arabistan'da kabile ve bölgesel bir birlik, büyük bir vadiyle ikiye ayrılmıştır: İkisi arasında en zengin ve en güçlü olanı olan üst Awa'aliq, yaklaşık 100.000 kilometrekarelik bir alanı kaplar, nüfusu 30.000 ile 50.000 arasında değişir, merkezi Ansab'dadır; ve çoğunlukla kuru olan Aşağı Plankton, sultanı el-Ahvar'ın bulunduğu {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 816}."
  id: "Sebuah persatuan suku dan regional di Arab selatan, yang merupakan wilayah paling timur di Protektorat Aden Barat, dibagi oleh sebuah lembah besar menjadi dua bagian: Awa'aliq atas, yang terkaya dan terkuat di antara keduanya, mencakup area sekitar 100.000 kilometer persegi dengan populasi antara 30.000 hingga 50.000 jiwa, dengan kedudukan di Ansab; dan Plankton Bawah, yang sebagian besar kering, dengan sultannya al-Ahwar {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 816}."
