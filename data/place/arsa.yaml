summary:
  ar: "مدينة حسنة على جبل حصين، ويذكر المؤلف، نقلا عن الحوقلي، أن الغرباء كانوا يُقتلون عند دخولها {cite:nuzhat-al-mushtaq-2002 p. 917} {cite:nuzhat-al-mushtaq-2002 p. 918}."
  en: "A fine city on a strong mountain; the author, citing al-Ḥawqalī, says strangers entering it were killed {cite:nuzhat-al-mushtaq-2002 p. 917} {cite:nuzhat-al-mushtaq-2002 p. 918}."
  es: "Una hermosa ciudad en una fuerte montaña; el autor, citando a al-Ḥawqalī, dice que los extranjeros que entraban en ella eran asesinados {cite:nuzhat-al-mushtaq-2002 p. 917} {cite:nuzhat-al-mushtaq-2002 p. 918}."
  fr: "Une belle ville sur une montagne robuste; l'auteur, citant al-Ḥawqalī, dit que les étrangers qui y entraient étaient tués {cite:nuzhat-al-mushtaq-2002 p. 917} {cite:nuzhat-al-mushtaq-2002 p. 918}."
  ur: "ایک مضبوط پہاڑ پر ایک عمدہ شہر؛ مصنف نے الحوقلی کا حوالہ دیتے ہوئے کہا ہے کہ اس میں داخل ہونے والے اجنبیوں کو قتل کر دیا گیا {حوالہ: نزہت المشتاق-2002 ص۔ 917} {حوالہ: نزہت المشتاق-2002 ص۔ 918}۔"
  tr: "Hüseyin Dağı'nda güzel bir şehir ve yazar, Al-Hawqali'den alıntı yaparak, buraya girerken yabancıların öldürüldüğünü belirtir {cite:nuzhat-al-mushtaq-2002 s. 917} {cite:nuzhat-al-mushtaq-2002 s. 918}."
  id: "Sebuah kota indah di Gunung Husain, dan penulisnya, mengutip Al-Hawqali, menyebutkan bahwa orang asing dibunuh saat memasuki kota tersebut {cite:nuzhat-al-mushtaq-2002 hlm. 917} {cite:nuzhat-al-mushtaq-2002 hlm. 918}."
