summary:
  ar: "مدينة على ساحل البحر في أرض الحبشة، تبعد عن زالغ خمسة أيام في البر، وفي الساحل جهة الجنوب. أهلها يعيشون من الصيد والصدف. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  en: "A town on the Abyssinian coast, five days by land from Zaila. Its people live from fishing and from the shellfish of the nearby reefs. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  es: "Un pueblo en la costa de Abisinia, a cinco días por tierra de Zaila. Sus habitantes viven de la pesca y de los mariscos de los arrecifes cercanos. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  fr: "Une ville de la côte abyssinienne, à cinq jours de route de Zaila. Ses habitants vivent de la pêche et des coquillages des récifs voisins. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  ur: "حبشہ کے ساحل پر ایک قصبہ، زائلہ سے پانچ دن کے فاصلے پر۔ اس کے لوگ ماہی گیری اور قریبی چٹانوں کی شیلفش سے گزارہ کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 45}"
  tr: "Habeşistan'da deniz kıyısında, Zalgh'dan karadan beş gün uzaklıkta ve güneyde kıyıda bir şehir. Halkı balıkçılık ve kabuklu deniz ürünleriyle geçinir. {cite:nuzhat-al-mushtaq-2002 s. 45}"
  id: "Sebuah kota di tepi laut di Abyssinia, lima hari dari Zalgh melalui darat, dan di pesisir di selatan. Penduduknya hidup dengan menangkap ikan dan kerang. {cite:Nuzhat-al-Mushtaq-2002 hlm. 45}"
