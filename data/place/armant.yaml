  ar: "مدينة على الضفة الشرقية للنيل، تبعد عن إسنا مجرى يوم. فيها نخيل وشجر يحمل أنواعا من الثمر، وبناؤها من القبط حسن، ويذكر المؤلف أن مثلها قليل في الأقطار. {cite:nuzhat-al-mushtaq-2002 p. 129}"
  en: "A town on the east bank of the Nile, a day's sail from Isna. It has palms and trees bearing several kinds of fruit, and the author says its Coptic-era construction is fine and rare in comparison with other regions. {cite:nuzhat-al-mushtaq-2002 p. 129}"
