summary:
  ar: "مدينة خصيبة عامرة تقع على الفرات في طريق البادية، وتبعد عن الدالية ثلاثين ميلاً، وينسب إليها مالك بن طوق. {cite:nuzhat-al-mushtaq-2002 p. 656}"
  en: "A fertile, populous town on the Euphrates at the edge of the desert, thirty miles from al-Dalia; named for Malik ibn Tawq. {cite:nuzhat-al-mushtaq-2002 p. 656}"
  es: "Una ciudad fértil y populosa a orillas del Éufrates, al borde del desierto, a cincuenta kilómetros de al-Dalia; nombrada en honor a Malik ibn Tawq. {cite:nuzhat-al-mushtaq-2002 p. 656}"
  fr: "Ville fertile et peuplée située sur l'Euphrate, en bordure du désert, à une cinquantaine de kilomètres d'al-Dalia; elle porte le nom de Malik ibn Tawq. {cite:nuzhat-al-mushtaq-2002 p. 656}"
  ur: "الدالیہ سے تیس میل کے فاصلے پر صحرا کے کنارے فرات کے کنارے ایک زرخیز، آبادی والا شہر؛ مالک ابن طوق کے نام سے منسوب {حوالہ: نزہت المشتاق-2002 ص۔ 656}"
  tr: "Fırat kıyısında, çöl yolu üzerinde, Malik ibn Tawq'un atfedildiği Daliyat'a otuz mil uzaklıkta bulunan verimli ve refah dolu bir şehirdir. {kaynak:nuzhat-al-mushtaq-2002 s. 656}"
  id: "Sebuah kota yang makmur dan subur yang terletak di tepi Sungai Efrat di jalan gurun, tiga puluh mil dari Daliyat, yang dikaitkan dengan Malik ibn Tawq. {cite:Nuzhat-al-Mushtaq-2002 hlm. 656}"
