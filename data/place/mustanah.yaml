summary:
  ar: "مدينة على نهر كبير ينحدر من جبال بنجار، تبعد عن مدينة الملك مسيرة ستة أيام، وفيها سمك كثير وحيتان عظيمة. {cite:nuzhat-al-mushtaq-2002 p. 717}"
  en: "A town on a great river descending from the Banjar mountains, six days' journey from the royal city, with much fish and great fishes. {cite:nuzhat-al-mushtaq-2002 p. 717}"
  es: "Un pueblo a orillas de un gran río que desciende de las montañas Banjar, a seis días de viaje de la ciudad real, con abundancia de peces y peces de gran tamaño. {cite:nuzhat-al-mushtaq-2002 p. 717}"
  fr: "Une ville située sur un grand fleuve descendant des monts Banjar, à six jours de marche de la ville royale, riche en poissons, notamment de gros poissons. {cite:nuzhat-al-mushtaq-2002 p. 717}"
  ur: "بنجر پہاڑوں سے اترتے ہوئے ایک عظیم دریا پر ایک قصبہ، شاہی شہر سے چھ دن کا سفر، بہت سی مچھلیاں اور بڑی بڑی مچھلیاں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 717}"
  tr: "Banjjar Dağları'ndan inen büyük bir nehir üzerinde, Kralın Şehri'ne altı günlük yolculuk mesafesinde, birçok balık ve büyük balina bulunan bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 717}"
  id: "Sebuah kota di sungai besar yang turun dari Pegunungan Banjjar, enam hari perjalanan dari Kota Raja, dan memiliki banyak ikan serta paus besar. {cite:nuzhat-al-mushtaq-2002 hlm. 717}"
