summary:
  ar: "مدينة على ساحل البحر، لها سور من تراب متقن، وأسواق معدودة وصنائع، وتقابل المرية من ساحل الأندلس عبر البحر. {cite:nuzhat-al-mushtaq-2002 p. 252}"
  en: "A city on the coast with a well-built earthen wall, set markets and crafts; it faces Almeria on the Andalusian shore across the sea. {cite:nuzhat-al-mushtaq-2002 p. 252}"
  es: "Una ciudad costera con una sólida muralla de tierra, mercados establecidos y talleres artesanales; se encuentra frente a Almería, en la costa andaluza, al otro lado del mar. {cite:nuzhat-al-mushtaq-2002 p. 252}"
  fr: "Une ville côtière dotée d'une solide muraille de terre, de marchés et d'ateliers d'artisanat; elle fait face à Almeria, sur la côte andalouse, de l'autre côté de la mer. {cite:nuzhat-al-mushtaq-2002 p. 252}"
  ur: "ساحل پر ایک شہر جس میں ایک اچھی طرح سے تعمیر شدہ مٹی کی دیوار ہے، بازار اور دستکاری قائم ہے؛ اس کا سامنا سمندر کے پار اندلس کے ساحل پر المیریا سے ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 252}"
  tr: "Deniz kıyısında bir şehir, ince toprak duvarı, az sayıda pazar ve el sanatları bulunuyor; deniz yoluyla Endülüs kıyısından Almería'ya bakıyor. {kaynak:nuzhat-al-mushtaq-2002 s. 252}"
  id: "Sebuah kota di tepi laut, dengan tembok tanah halus, sedikit pasar, dan kerajinan, dan menghadap Almería dari pantai Andalusia melalui laut. {cite:nuzhat-al-mushtaq-2002 hlm. 252}"
