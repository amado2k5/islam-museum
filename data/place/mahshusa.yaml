summary:
  ar: "موضع على البحر، مياهه في أحساء تُحفر في الرمل، وفي رماله أفاعٍ صغيرة تنهش من لا يعلم بأمرها. {cite:nuzhat-al-mushtaq-2002 p. 314}"
  en: "A place on the coast with water in pits dug in the sand; small vipers in the sand bite those who do not know of them. {cite:nuzhat-al-mushtaq-2002 p. 314}"
  es: "Un lugar en la costa con agua en pozos excavados en la arena; pequeñas víboras en la arena muerden a quienes no las conocen. {cite:nuzhat-al-mushtaq-2002 p. 314}"
  fr: "Un lieu côtier où l'eau s'écoule dans des puits creusés dans le sable; de petites vipères vivant dans le sable mordent ceux qui n'en ont pas connaissance. {cite:nuzhat-al-mushtaq-2002 p. 314}"
  ur: "ریت میں کھودے گڑھوں میں پانی کے ساتھ ساحل پر ایک جگہ؛ ریت میں چھوٹے سانپ ان لوگوں کو کاٹتے ہیں جو ان کے بارے میں نہیں جانتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 314}"
  tr: "Deniz kenarında bir yer, Ahsa'daki suları kumlara gömülür ve kumlarında kaderinden habersiz olanları kemiren küçük yılanlar vardır. {cite:nuzhat-al-mushtaq-2002 s. 314}"
  id: "Sebuah tempat di tepi laut, airnya di Ahsa menggali pasir, dan di pasirnya terdapat ular-ular kecil yang menggerogoti mereka yang tidak menyadari nasibnya. {cite:nuzhat-al-mushtaq-2002 hlm. 314}"
