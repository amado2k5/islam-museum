  ur: "کوہ کارمل کے سرے کے نیچے ایک قصبہ جس میں بحری بیڑوں کے لیے ایک اچھی بندرگاہ ہے، قیصریہ سے تین روشنی کے مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 365}"
  tr: "Carmel Sırtı'nın altında bir kasaba, filo yanaşması için Marsa Hassan ve diğerleri, Sezariye'ye üç adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 365}"
  id: "Sebuah kota di bawah Carmel Ridge, Marsa Hassan untuk docking armada, dan lainnya, terletak tiga langkah dari Kaisarea. {cite:Nuzhat-al-Mushtaq-2002 hlm. 365}"
