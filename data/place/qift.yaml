summary:
  ar: "مدينة على الضفة الشرقية للنيل، يُبلغ إليها من أخميم بنصف يوم. يصفها المؤلف بأنها ذات أهل مختلطين، ويقول إن أهلها شيعة بحسب قوله. وفيها تُزرع بذور البقول كاللفت والخس، فيُستخرج منها الدهن ويُصنع صابون يُحمل إلى أرض مصر كلها. {cite:nuzhat-al-mushtaq-2002 p. 128}"
  en: "A city on the east bank of the Nile, half a day from Akhmim. The author describes its population as mixed and says its people are Shia, as he states it. Seeds of greens such as turnip and lettuce are grown and pressed for oil, which is made into soap and carried throughout Egypt. {cite:nuzhat-al-mushtaq-2002 p. 128}"
  es: "Una ciudad en la orilla oriental del Nilo, a medio día de Akhmim. El autor describe su población como mixta y afirma que sus habitantes son chiítas. Se cultivan semillas de hortalizas como el nabo y la lechuga, que se prensan para obtener aceite, con el que se elabora jabón que se distribuye por todo Egipto. {cite:nuzhat-al-mushtaq-2002 p. 128}"
  fr: "Une ville située sur la rive orientale du Nil, à une demi-journée d'Akhmim. L'auteur décrit sa population comme mixte et précise qu'elle est chiite. On y cultive des graines de légumes verts comme le navet et la laitue, dont on extrait l'huile par pression. Cette huile sert à fabriquer du savon, qui est ensuite distribué dans tout l'Égypte. {cite:nuzhat-al-mushtaq-2002 p. 128}"
  ur: "دریائے نیل کے مشرقی کنارے پر ایک شہر، اخمیم سے آدھے دن کے فاصلے پر۔ مصنف نے اس کی آبادی کو مخلوط قرار دیا ہے اور کہا ہے کہ اس کے لوگ شیعہ ہیں، جیسا کہ وہ بیان کرتا ہے۔ شلجم اور لیٹش جیسی سبزیوں کے بیج اگائے جاتے ہیں اور تیل کے لیے دبایا جاتا ہے، جسے صابن بنا کر پورے مصر میں لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 128}"
