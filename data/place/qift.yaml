summary:
  ar: "مدينة على الضفة الشرقية للنيل، يُبلغ إليها من أخميم بنصف يوم. يصفها المؤلف بأنها ذات أهل مختلطين، ويقول إن أهلها شيعة بحسب قوله. وفيها تُزرع بذور البقول كاللفت والخس، فيُستخرج منها الدهن ويُصنع صابون يُحمل إلى أرض مصر كلها. {cite:nuzhat-al-mushtaq-2002 p. 128}"
  en: "A city on the east bank of the Nile, half a day from Akhmim. The author describes its population as mixed and says its people are Shia, as he states it. Seeds of greens such as turnip and lettuce are grown and pressed for oil, which is made into soap and carried throughout Egypt. {cite:nuzhat-al-mushtaq-2002 p. 128}"
