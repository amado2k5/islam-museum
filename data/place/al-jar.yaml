summary:
  ar: "الجار ميناء الحجاز الذي كانت ترد إليه أحمال طعام خراج مصر البحرية منذ سنة إحدى وعشرين فيتولى قبضها سعد الجار وتحمل إلى المدينة فتقسم بين الناس بمكيال في دار، ودام الحمل إلى خلافة أبي جعفر وقبيلها مع انقطاعات في الفتنة الأولى وزمن بني أمية."
  en: "Al-Jar, the Hijaz's port where Egypt's kharaj grain-ships landed from year 21 onward — Sa'd al-Jar taking charge there, the grain carried to Medina and dealt out by measure from a house; the service ran on to Abu Ja'far's caliphate and just before, with interruptions at the first fitna and in Umayyad times."
  es: "Al-Jar, el puerto del Hiyaz donde atracaban los barcos de grano kharaj de Egipto a partir del año 21 —Sa'd al-Jar se hizo cargo de él—, el grano se transportaba a Medina y se distribuía por medidas desde una casa; el servicio continuó durante el califato de Abu Ja'far e incluso justo antes, con interrupciones durante la primera fitna y en la época omeya."
  fr: "Al-Jar, le port du Hedjaz où les navires céréaliers égyptiens (kharaj) accostaient à partir de l'an 21 — Sa'd al-Jar en prenant la direction, le grain étant transporté à Médine et distribué au poids depuis une maison; ce service a perduré jusqu'au califat d'Abu Ja'far et juste avant, avec des interruptions lors de la première fitna et à l'époque omeyyade."
