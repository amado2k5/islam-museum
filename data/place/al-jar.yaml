summary:
  ar: "الجار ميناء الحجاز الذي كانت ترد إليه أحمال طعام خراج مصر البحرية منذ سنة إحدى وعشرين فيتولى قبضها سعد الجار وتحمل إلى المدينة فتقسم بين الناس بمكيال في دار، ودام الحمل إلى خلافة أبي جعفر وقبيلها مع انقطاعات في الفتنة الأولى وزمن بني أمية."
  en: "Al-Jar, the Hijaz's port where Egypt's kharaj grain-ships landed from year 21 onward — Sa'd al-Jar taking charge there, the grain carried to Medina and dealt out by measure from a house; the service ran on to Abu Ja'far's caliphate and just before, with interruptions at the first fitna and in Umayyad times."
