summary:
  ar: "مدينة في المغرب الأقصى يذكر المؤلف أن تجارها يسلكون الطريق الصحراوي مع جلماسة ودرعة إلى بلاد غانة {cite:nuzhat-al-mushtaq-2002 p. 105}."
  en: "A city in the far Maghreb. The author names its merchants as travellers on the desert road with Sijilmasa and Draa toward the land of Ghana {cite:nuzhat-al-mushtaq-2002 p. 105}."
  es: "Una ciudad en el lejano Magreb. El autor menciona a sus comerciantes como viajeros en el camino del desierto junto con Sijilmasa y Draa hacia la tierra de Ghana {cite:nuzhat-al-mushtaq-2002 p. 105}."
  fr: "Une ville du Maghreb lointain. L'auteur cite ses marchands comme des voyageurs sur la route du désert avec Sijilmasa et Draa en direction du pays du Ghana {cite:nuzhat-al-mushtaq-2002 p. 105}."
  ur: "مغرب کے دور میں ایک شہر۔ مصنف نے اپنے تاجروں کا نام صحرائی سڑک پر سفر کرنے والوں کے طور پر سجلماسا اور درعا کے ساتھ گھانا کی سرزمین کی طرف بتایا ہے۔ 105}۔"
  tr: "Fas'ın batısında yer alan bir şehir. Yazar, tüccarlarının Gilmasa ve Drâa ile birlikte çöl yolunu Gana topraklarına kadar takip ettiğini belirtir {cite:nuzhat-al-mushtaq-2002, s. 105}."
  id: "Sebuah kota di ujung barat Maroko. Penulis menyebutkan bahwa para pedagangnya mengambil jalur gurun bersama Gilmasa dan Drâa menuju tanah Ghana {cite:nuzhat-al-mushtaq-2002, hlm. 105}."
