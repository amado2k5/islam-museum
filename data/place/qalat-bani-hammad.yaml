label: { ar: "القلعة ⁦(قلعة بني حماد)⁩", en: "al-Qal'a (Qal'at Bani Hammad)", es: "al-Qal'a (Qal'at Bani Hammad)", fr: "al-Qal'a (Qal'at Bani Hammad)", ur: "القلع ⁦(قلعۃ بنی حماد)⁩", tr: "Kale (Bani Hammad Kalesi)", id: "Benteng (Kastil Bani Hammad)" }
summary:
  ar: "من أكبر البلاد قطراً وأكثرها أموالاً، سورها مستدير بجبل تاقرت، وعلى قمته قلعة عالية، ويصفها الإدريسي بالقصور والمساكن الحسنة. {cite:nuzhat-al-mushtaq-2002 p. 255}"
  en: "One of the largest lands and wealthiest towns, its wall encircling a mountain, with a high fortress on top and fine palaces and houses; al-Idrisi describes its abundance. {cite:nuzhat-al-mushtaq-2002 p. 255}"
  es: "Una de las tierras más extensas y una de las ciudades más ricas, con su muralla rodeando una montaña, coronada por una alta fortaleza y con magníficos palacios y casas; al-Idrisi describe su abundancia. {cite:nuzhat-al-mushtaq-2002 p. 255}"
  fr: "L'une des plus vastes régions et des villes les plus riches, ses remparts encerclant une montagne, surmontée d'une haute forteresse et ornée de magnifiques palais et demeures; al-Idrisi décrit son opulence. {cite:nuzhat-al-mushtaq-2002 p. 255}"
  ur: "سب سے بڑی زمینوں اور دولت مند شہروں میں سے ایک، اس کی دیوار ایک پہاڑ کو گھیرے ہوئے ہے، جس کے اوپر ایک اونچا قلعہ اور عمدہ محلات اور مکانات ہیں۔ ادریسی نے اس کی کثرت بیان کی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 255}"
  tr: "En büyük ve en zengin ülkelerden biri olan bu ülkenin duvarı Tagourt Dağı ile çevrilidir ve zirvesinde yüksek bir kale bulunur. Al-Idrisi, burayı saraylar ve iyi konutlar olarak tanımlar. {kaynak:Nuzhat-al-mushtaq-2002 s. 255}"
  id: "Salah satu negara terbesar dan terkaya, temboknya dibulatkan oleh Gunung Tagourt, dan di puncaknya terdapat benteng tinggi. Al-Idrisi menggambarkannya memiliki istana dan kediaman yang baik. {cite:Nuzhat-al-Mushtaq-2002 hlm. 255}"
