label: { ar: "المدرسة النظامية", en: "al-Nizamiyya Madrasa", es: "Madrasa al-Nizamiyya", fr: "Madrasa al-Nizamiyya", ur: "مدرسہ نظامیہ", tr: "Normal Okul", id: "Sekolah Reguler" }
summary:
  ar: "المدرسة النظامية ببغداد، بناها نظام الملك وزير ألب أرسلان وفرغت سنة تسع وخمسين وأربع مئة وقرر لتدريسها الشيخ أبو إسحاق الشيرازي وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 645-646}."
  en: "Baghdad's Nizamiyya school, built by Alp Arslan's vizier Nizam al-Mulk and finished in 459 with Abu Ishaq al-Shirazi named its teacher — 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 645-646}."
  es: "La escuela Nizamiyya de Bagdad, construida por el visir de Alp Arslan, Nizam al-Mulk, y terminada en 459 con Abu Ishaq al-Shirazi como su maestro, \"se dice que fue la primera escuela construida para los juristas\" {cite:tarikh-khulafa-minhaj-1434 p. 645-646}."
  fr: "L'école Nizamiyya de Bagdad, construite par le vizir Nizam al-Mulk d'Alp Arslan et achevée en 459 avec Abu Ishaq al-Shirazi comme professeur — « considérée comme la première école construite pour les juristes » {cite:tarikh-khulafa-minhaj-1434 p. 645-646}."
  ur: "بغداد کا نظامیہ اسکول، جسے الپ ارسلان کے وزیر نظام الملک نے بنایا تھا اور 459 میں ختم ہوا تھا اور ابو اسحاق الشیرازی نے اس کے استاد کا نام دیا تھا - کہا جاتا ہے کہ یہ پہلا اسکول ہے جو فقہاء کے لیے بنایا گیا تھا۔ 645-646}۔"
  tr: "Bağdat'taki Nizamiyya Okulu, Alp Arslan bakanı Nizam al-Mulk tarafından inşa edilmiş ve dört yüz elli dokuzuncu yılda tamamlanmıştır. Şeyh Ebu İshaq el-Şirazi tarafından öğretim görevlendirilmiş ve hukukçular için inşa edilen ilk okul olduğu söylenir {kaynak: Tarikh-khulafa-minhaj-1434, s. 645-646}."
  id: "Sekolah Nizamiyya di Baghdad dibangun oleh Nizam al-Mulk, menteri Alp Arslan, dan selesai pada tahun empat ratus lima puluh sembilan. Sheikh Abu Ishaq al-Shirazi ditunjuk untuk mengajarnya, dan dikatakan sebagai sekolah pertama yang dibangun untuk ahli hukum {kucitasi: Tarikh-khulafa-minhaj-1434, hlm. 645-646}."
