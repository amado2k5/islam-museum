summary:
  en: "Syrian city, capital of the Umayyad caliphate (661-750 CE) and home of the Umayyad Mosque. Ibn Battuta records reaching Damascus on 9 Ramadan 726 and lodging at the Maliki madrasa known as al-Sharbashiyya, quoting Ibn Jubayr's naming it 'the paradise of the East'; he calls its congregational mosque the finest of the world's mosques in construction, noting that al-Walid ibn Abd al-Malik undertook the building after the Byzantine king sent craftsmen {cite:rihla-ibn-battuta-1958 p. 50-52} The Encyclopaedia of Islam traces the city from the Bronze Age through Aramaean, Hellenistic, Roman and Byzantine rule to the Arab conquest of 14-15 AH (635-636 CE), then through Umayyad, Abbasid, Burid, Zengid, Ayyubid, Mamluk and Ottoman rule to the French mandate of 1920, describing the Great Mosque built by al-Walid I and the city's role as a centre of madrasas under Nur al-Din and the Ayyubids."
  ar: "مدينة سورية، عاصمة الخلافة الأموية ⁦(661-750م)⁩ وفيها الجامع الأموي. وكان مسجدها الجامع قبل النصرانية هيكلاً عظيماً فيه التماثيل والأصنام على رأس منارته تماثيل منصوبة وقد كان بني على اسم المشتري وطالع سعد، فجعلته النصارى كنيسة وجعله الإسلام مسجداً وأحكم بناءه الوليد بن عبد الملك ولم تغير الصوامع منه وهي منائر الأذان، وبها البريص البنيان العجيب الذي كان يجري فيه الخمر وهيكل جيرون {cite:muruj-al-dhahab p. 555} ويصف ابن بطوطة وصوله إلى دمشق في التاسع من رمضان سنة ست وعشرين ومبيتّه بمدرسة مالكية معروفة بالشربشية، ناقلاً عن ابن جبير تسميتها جنة المشرق، ويذكر أن جامعها أعظم مساجد الدنيا احتفالاً وأتقنها صناعة، وأن الوليد بن عبد الملك تولى بناءه بعد أن بعث إليه ملك الروم بصناع {cite:rihla-ibn-battuta-1958 p. 50-52} وتتتبع دائرة المعارف الإسلامية تاريخ المدينة من العصر البرونزي عبر الحكم الآرامي واليوناني والروماني والبيزنطي إلى الفتح العربي سنة 14 و15 للهجرة ⁦(635-636م)⁩، ثم الحكم الأموي والعباسي والبوري والزنكي والأيوبي والمملوكي والعثماني إلى الانتداب الفرنسي سنة 1920، وتصف الجامع الكبير الذي بناه الوليد الأول ودور المدينة مركزًا للمدارس في عهد نور الدين والأيوبيين."
  ur: "دمشق شام کا سب سے بڑا شہر ہے اور 661 سے 750ء تک اموی خلافت کا دارالحکومت رہا، جہاں جامع اموی واقع ہے۔ انسائیکلوپیڈیا آف اسلام اس کی تاریخ برنج کے دور سے آرامی، یونانی، رومی اور بازنطینی حکومت اور 14 اور 15 ہجری کی عرب فتح تک، پھر اموی، عباسی، بوری، زنگی، ایوبی، مملوک اور عثمانی ادوار سے 1920ء کے فرانسیسی انتداب تک بیان کرتا ہے۔ وہ ولید اول کی بنائی ہوئی عظیم مسجد اور نورالدین اور ایوبیوں کے دور میں مدارس کے مرکز کی حیثیت کا ذکر کرتا ہے۔"
  es: "Ciudad siria, capital del califato omeya (661-750 d. C.) y sede de la Mezquita Omeya. Ibn Battuta registra su llegada a Damasco el 9 de Ramadán de 726 y su alojamiento en la madrasa malikí conocida como al-Sharbashiyya, citando a Ibn Jubayr, quien la denominó \"el paraíso de Oriente\"; llama a su mezquita congregacional la más bella del mundo en cuanto a construcción, señalando que al-Walid ibn Abd al-Malik emprendió la construcción después de que el rey bizantino enviara artesanos {cite:rihla-ibn-battuta-1958 p. 50-52} La Enciclopedia del Islam traza la historia de la ciudad desde la Edad del Bronce, pasando por el dominio arameo, helenístico, romano y bizantino, hasta la conquista árabe de 14-15 AH (635-636 d. C.), luego a través del dominio omeya, abasí, burí, zéngido, ayubí, mameluco y otomano, hasta el mandato francés de 1920, describiendo la Gran Mezquita construida por al-Walid I y el papel de la ciudad como centro de madrasas bajo Nur al-Din y los ayubíes."
  fr: "Ville syrienne, capitale du califat omeyyade (661-750 ap. J.-C.) et siège de la mosquée des Omeyyades. Ibn Battuta relate son arrivée à Damas le 9 Ramadan 726 et son séjour à la madrasa malikite connue sous le nom d'al-Sharbashiyya, citant Ibn Jubayr qui la qualifie de « paradis de l'Orient »; il décrit sa mosquée du vendredi comme la plus belle mosquée du monde sur le plan architectural, notant qu'al-Walid ibn Abd al-Malik entreprit sa construction après que le roi byzantin eut envoyé des artisans {cite:rihla-ibn-battuta-1958 p. 50-52} L'Encyclopédie de l'Islam retrace l'histoire de la ville depuis l'âge du bronze à travers les dominations araméenne, hellénistique, romaine et byzantine jusqu'à la conquête arabe de 14-15 AH (635-636 CE), puis à travers les dominations omeyyade, abbasside, buride, zengide, ayyoubide, mamelouke et ottomane jusqu'au mandat français de 1920, décrivant la Grande Mosquée construite par al-Walid I et le rôle de la ville en tant que centre de madrasas sous Nur al-Din et les Ayyoubides."
  tr: "Suriye şehri, Emevi Halifeliği'nin (661-750 MS) başkenti olup, Emevi Camii'ni barındırır. Camisi, Hristiyanlıktan önce, minaresinin tepesinde heykeller ve putlar bulunan büyük bir yapıydı. Alıcı ve Saad ayaklanmasından sonra inşa edilmiştir. Hristiyanlar burayı kiliseye çevirmiş, İslam camiye çevirmiş, yapısını El-Velid bin Abdülmelik güçlendirmiş ve ezan minareleri değiştirilmemiştir. Ayrıca şarabın aktığı muhteşem yapı ve Jeroun Tapınağı da vardır {atı:muruj-al-dhahab, s. 555}. İbn Battuta, yirmi altı yılın Ramazan ayının dokuzuncusunda Şam'a gelişini ve geceyi Al-Sharabshiyya olarak bilinen bir Maliki okulunda geçirdiğini anlatır. İbn Cubeyr'den alıntı yaparak, caminin dünyanın en ünlü camisi olduğunu ve titizlikle inşa edildiğini belirten Doğu Bahçesi olarak adlandırılır. El-Velid ibn Abdül-Malik, Roma kralı tarafından zanaatkârlar gönderildikten sonra inşaatını devraldı {cite:rihla-ibn-battuta-1958, s. 50-52}. İslami Ansiklopedi, şehrin tarihini Tunç Çağı'ndan Aramedia, Yunan, Roma ve Bizans yönetimine kadar Arapların 14 ve 15 HIC (635-636) fetihlerine, ardından Emevili, Abbasi, Buri, Zengid, Eyyubi, Memlük ve Osmanlı dönemlerinden 1920'deki Fransız Mandası dönemine kadar izler ve Büyük Camii'yi anlatır El-Velid I tarafından inşa edilmiş ve Nur al-Din ile Eyyubiler döneminde okullar merkezi olarak hizmet vermiştir."
  id: "Kota Suriah, ibu kota Kekhalifahan Umayyah (661-750 M), yang berisi Masjid Umayyah. Masjidnya, sebelum Kristen, adalah bangunan besar dengan patung dan arca di atas menaranya. Masjid ini dibangun setelah pembeli dan kebangkitan Saad. Orang Kristen mengubahnya menjadi gereja, Islam menjadikannya masjid, dan strukturnya diperkuat oleh Al-Walid ibn Abd al-Malik, dan menara panggilan salat tidak diubah. Masjid ini juga memiliki struktur megah tempat anggur mengalir, dan Kuil Jeroun {cite:muruj-al-dhahab, hlm. 555}. Ibn Battuta menggambarkan kedatangannya di Damaskus pada tanggal sembilan Ramadan tahun dua puluh enam, di mana ia menginap di sekolah Maliki yang dikenal sebagai Al-Sharabshiyya. Mengutip Ibn Jubayr, masjid ini disebut Taman Timur, menyebutkan bahwa masjidnya adalah masjid paling terkenal di dunia dan dibuat dengan presisi. Al-Walid ibn Abd al-Malik mengambil alih pembangunannya setelah raja Romawi mengirimkan pengrajin kepadanya {cite:rihla-ibn-battuta-1958, hlm. 50-52}. Ensiklopedia Islam menelusuri sejarah kota ini dari Zaman Perunggu melalui pemerintahan Aramedia, Yunani, Romawi, dan Bizantium hingga penaklukan Arab pada tahun 14 dan 15 H (635-636 M), kemudian periode Umayyah, Abbasiyah, Buri, Zengid, Ayyubiyah, Mamluk, dan Ottoman hingga Mandat Prancis pada tahun 1920, serta menggambarkan Masjid Agung Kastil ini dibangun oleh Al-Walid I dan berfungsi sebagai pusat sekolah selama masa pemerintahan Nur al-Din dan kaum Ayyubid."
