summary:
  en: "Syrian city, capital of the Umayyad caliphate (661-750 CE) and home of the Umayyad Mosque. Ibn Battuta records reaching Damascus on 9 Ramadan 726 and lodging at the Maliki madrasa known as al-Sharbashiyya, quoting Ibn Jubayr's naming it 'the paradise of the East'; he calls its congregational mosque the finest of the world's mosques in construction, noting that al-Walid ibn Abd al-Malik undertook the building after the Byzantine king sent craftsmen {cite:rihla-ibn-battuta-1958 p. 50-52} The Encyclopaedia of Islam traces the city from the Bronze Age through Aramaean, Hellenistic, Roman and Byzantine rule to the Arab conquest of 14-15 AH (635-636 CE), then through Umayyad, Abbasid, Burid, Zengid, Ayyubid, Mamluk and Ottoman rule to the French mandate of 1920, describing the Great Mosque built by al-Walid I and the city's role as a centre of madrasas under Nur al-Din and the Ayyubids."
  ar: "مدينة سورية، عاصمة الخلافة الأموية ⁦(661-750م)⁩ وفيها الجامع الأموي. وكان مسجدها الجامع قبل النصرانية هيكلاً عظيماً فيه التماثيل والأصنام على رأس منارته تماثيل منصوبة وقد كان بني على اسم المشتري وطالع سعد، فجعلته النصارى كنيسة وجعله الإسلام مسجداً وأحكم بناءه الوليد بن عبد الملك ولم تغير الصوامع منه وهي منائر الأذان، وبها البريص البنيان العجيب الذي كان يجري فيه الخمر وهيكل جيرون {cite:muruj-al-dhahab p. 555} ويصف ابن بطوطة وصوله إلى دمشق في التاسع من رمضان سنة ست وعشرين ومبيتّه بمدرسة مالكية معروفة بالشربشية، ناقلاً عن ابن جبير تسميتها جنة المشرق، ويذكر أن جامعها أعظم مساجد الدنيا احتفالاً وأتقنها صناعة، وأن الوليد بن عبد الملك تولى بناءه بعد أن بعث إليه ملك الروم بصناع {cite:rihla-ibn-battuta-1958 p. 50-52} وتتتبع دائرة المعارف الإسلامية تاريخ المدينة من العصر البرونزي عبر الحكم الآرامي واليوناني والروماني والبيزنطي إلى الفتح العربي سنة 14 و15 للهجرة ⁦(635-636م)⁩، ثم الحكم الأموي والعباسي والبوري والزنكي والأيوبي والمملوكي والعثماني إلى الانتداب الفرنسي سنة 1920، وتصف الجامع الكبير الذي بناه الوليد الأول ودور المدينة مركزًا للمدارس في عهد نور الدين والأيوبيين."
  ur: "دمشق شام کا سب سے بڑا شہر ہے اور 661 سے 750ء تک اموی خلافت کا دارالحکومت رہا، جہاں جامع اموی واقع ہے۔ انسائیکلوپیڈیا آف اسلام اس کی تاریخ برنج کے دور سے آرامی، یونانی، رومی اور بازنطینی حکومت اور 14 اور 15 ہجری کی عرب فتح تک، پھر اموی، عباسی، بوری، زنگی، ایوبی، مملوک اور عثمانی ادوار سے 1920ء کے فرانسیسی انتداب تک بیان کرتا ہے۔ وہ ولید اول کی بنائی ہوئی عظیم مسجد اور نورالدین اور ایوبیوں کے دور میں مدارس کے مرکز کی حیثیت کا ذکر کرتا ہے۔"
