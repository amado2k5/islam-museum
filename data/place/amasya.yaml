label:
  ar: أماسيا
  en: Amasya (northern Anatolia)
  es: "Amasya (norte de Anatolia)"
  fr: "Amasya (nord de l'Anatolie)"
  ur: "اماسیا ⁦(شمالی اناطولیہ)⁩"
  tr: "Amasia"
