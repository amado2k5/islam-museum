summary:
  ar: "أماسيا، مدينة في شمال الأناضول وعاصمة ولاية، وكانت تُعرف في العصور القديمة بأماسيا، وقد حكمها الدانشمنديون ثم السلاجقة والمغول والإرتنيون والعثمانيون، وكانت من أهم مراكز التعليم في الأناضول، وفيها آثار سلجوقية وعثمانية كثيرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  en: "Amasya, a town in northern Anatolia and capital of a wilayet, known in antiquity as Amaseia. It passed from the Danishmendids to the Rum Seljuks, the Mongols, the Eretnids and the Ottomans. Under Ottoman rule it enjoyed the special favour of the ruling house and became one of the main seats of learning in Anatolia {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
