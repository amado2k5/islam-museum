summary:
  ar: أماسيا، مدينة في شمال الأناضول وعاصمة ولاية، وكانت تُعرف في العصور القديمة بأماسيا، وقد حكمها الدانشمنديون ثم السلاجقة والمغول والإرتنيون والعثمانيون، وكانت من أهم مراكز التعليم في الأناضول، وفيها آثار سلجوقية وعثمانية كثيرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}.
  en: Amasya, a town in northern Anatolia and capital of a wilayet, known in antiquity as Amaseia. It passed from the Danishmendids to the Rum Seljuks, the Mongols, the Eretnids and the Ottomans. Under Ottoman rule it enjoyed the special favour of the ruling house and became one of the main seats of learning in Anatolia {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}.
  es: "Amasya, ciudad del norte de Anatolia y capital de un wilayet, conocida en la antigüedad como Amaseia. Pasó por las manos de los Danishmendids a los Rum Seljuks, los mongoles, los Eretnids y los otomanos. Bajo el dominio otomano gozó del favor especial de la casa reinante y se convirtió en uno de los principales centros de aprendizaje de Anatolia {cite:encyclopaedia-of-islam-2 vol. 1 p. 453}."
  fr: "Amasya, ville du nord de l'Anatolie et capitale d'un wilayet, connue dans l'Antiquité sous le nom d'Amaseia, passa successivement sous la domination des Danishmendides, des Seldjoukides de Roum, des Mongols, des Érétinides et des Ottomans. Sous domination ottomane, elle bénéficia d'une faveur particulière de la dynastie régnante et devint l'un des principaux centres intellectuels d'Anatolie (voir: Encyclopaedia of Islam, vol. 1, p. 453)."
