summary:
  ar: "بئر بالمدينة تعرف ببئر أنس؛ كان أبو أيوب حين نزل عنده رسول الله يستعذب له الماء منها، فلما صار النبي إلى منزله كان أنس وهند وحارثة بن أسماء الأسلميان يحملون قدور الماء إلى بيوت نسائه من بيوت السقيا {cite:ansab-al-ashraf p. 536}."
  en: "The Medina well known as Bir Anas; Abu Ayyub drew the Prophet's drinking water from it while he lodged with him, and afterwards Anas, Hind and Haritha bint Asma' carried pitchers from the saqaya houses to his wives' homes {cite:ansab-al-ashraf p. 536}."
  es: "La Medina, bien conocida como Bir Anas, Abu Ayyub sacó de ella el agua potable del Profeta mientras se hospedaba con él, y después Anas, Hind y Haritha bint Asma' llevaron cántaros desde las casas de saqaya hasta las casas de sus esposas {cite:ansab-al-ashraf p. 536}."
  fr: "La Médine bien connue sous le nom de Bir Anas; Abu Ayyub y puisa l'eau potable du Prophète pendant qu'il logeait chez lui, et par la suite Anas, Hind et Haritha bint Asma' transportèrent des cruches des maisons de la saqaya jusqu'aux maisons de ses épouses {cite: ansab-al-ashraf p. 536}."
