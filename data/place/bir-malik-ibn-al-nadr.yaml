  en: "The Medina well known as Bir Anas; Abu Ayyub drew the Prophet's drinking water from it while he lodged with him, and afterwards Anas, Hind and Haritha bint Asma' carried pitchers from the saqaya houses to his wives' homes {cite:ansab-al-ashraf p. 536}."
