summary:
  ar: "إمارة في وسط الهند، يحكمها سلطان مسلم بتحالف مع الإنكليز، أهلها نحو 13 مليوناً أكثرهم من الهندوس، وعاصمتها ذات أغلبية مسلمة، وفيها جيش نحو 30 ألف جندي أكثرهم من العرب الحضارمة، وفق ما يذكره شكيب أرسلان في تعليقه على حاضر العالم الإسلامي. ويذكر أن الحكم الداخلي للإمارة محدود، وأن الوزير المقيم الإنكليزي له نفوذ محدود على الإمارة."
  en: "A princely state in central India, ruled by a Muslim sultan under British protection, with about 13 million people, mostly Hindu, though its capital is mostly Muslim. Its army of about 30,000 was largely Hadrami Arab, per Arslan's commentary on Stoddard. The British resident had limited influence over the state's internal rule {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 351–353}."
  es: "Un estado principesco en el centro de la India, gobernado por un sultán musulmán bajo protección británica, con aproximadamente 13 millones de habitantes, en su mayoría hindúes, aunque su capital era mayoritariamente musulmana. Su ejército, de unos 30 000 hombres, estaba compuesto principalmente por árabes hadramíes, según el comentario de Arslan sobre Stoddard. El residente británico tenía una influencia limitada sobre el gobierno interno del estado {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 351–353}."
  fr: "État princier du centre de l'Inde, gouverné par un sultan musulman sous protectorat britannique, il comptait environ 13 millions d'habitants, majoritairement hindous, bien que sa capitale soit principalement musulmane. Son armée, forte d'environ 30 000 hommes, était en grande partie composée d'Arabes hadramites, d'après le commentaire d'Arslan sur Stoddard. Le résident britannique n'exerçait qu'une influence limitée sur l'administration intérieure de l'État (voir Stoddard, Arslan Hadir, 1923, vol. 1, scan, p. 351-353)."
  ur: "وسطی ہندوستان کی ایک شاہی ریاست جس پر برطانوی تحفظ میں ایک مسلمان سلطان کی حکومت تھی، جس میں تقریباً 13 ملین افراد تھے، جن میں زیادہ تر ہندو تھے، حالانکہ اس کا دارالحکومت زیادہ تر مسلمان ہے۔ سٹوڈارڈ پر ارسلان کی تفسیر کے مطابق اس کی تقریباً 30,000 کی فوج زیادہ تر حدرامی عرب تھی۔ برطانوی باشندے کا ریاست کی داخلی حکمرانی پر محدود اثر و رسوخ تھا۔ 1، اسکین پی پی 351–353}۔"
  tr: "Orta Hindistan'da bir emirlik, İngilizlerle müttefik bir Müslüman sultan tarafından yönetilen bir emirliktir; nüfusu yaklaşık 13 milyondur; bunların çoğu Hindu'dur, başkenti Müslüman çoğunlukta ve yaklaşık 30.000 askerden oluşan bir orduya sahiptir; bunların çoğu Hadrami Araptır; bu durum Shakib Arslan'ın İslam dünyasının günümüzü üzerine yaptığı yorumunda belirtmiştir. Emirliğin iç yönetiminin sınırlı olduğu ve İngiliz yerleşik bakanın emirlik üzerindeki etkisinin sınırlı olduğu belirtilmektedir."
  id: "Sebuah emirat di India tengah, diperintah oleh seorang sultan Muslim yang bersekutu dengan Inggris, populasinya sekitar 13 juta, sebagian besar beragama Hindu, ibu kotanya mayoritas Muslim, dan memiliki tentara sekitar 30.000 tentara, sebagian besar adalah Arab Hadrami, menurut komentar Shakib Arslan tentang dunia Islam saat ini. Perlu dicatat bahwa pemerintahan internal emirat terbatas, dan menteri residen Inggris memiliki pengaruh terbatas atas emirat tersebut."
