summary:
  ar: "إمارة في وسط الهند، يحكمها سلطان مسلم بتحالف مع الإنكليز، أهلها نحو 13 مليوناً أكثرهم من الهندوس، وعاصمتها ذات أغلبية مسلمة، وفيها جيش نحو 30 ألف جندي أكثرهم من العرب الحضارمة، وفق ما يذكره شكيب أرسلان في تعليقه على حاضر العالم الإسلامي. ويذكر أن الحكم الداخلي للإمارة محدود، وأن الوزير المقيم الإنكليزي له نفوذ محدود على الإمارة."
  en: "A princely state in central India, ruled by a Muslim sultan under British protection, with about 13 million people, mostly Hindu, though its capital is mostly Muslim. Its army of about 30,000 was largely Hadrami Arab, per Arslan's commentary on Stoddard. The British resident had limited influence over the state's internal rule {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 351–353}."
