summary:
  ar: "مدينة كبيرة عامرة آهلة ذات أسواق، فيها ثياب الكتان الفاخرة على ضروب شتى، وتشتمل على أنواع من الأشياء المصنوعة. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  en: "A large, populous, inhabited city with markets, known for fine linen cloth in many kinds and a range of manufactured goods. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  es: "Una ciudad grande, populosa y habitada, con mercados, conocida por sus finos tejidos de lino de diversos tipos y una amplia gama de productos manufacturados. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  fr: "Une grande ville peuplée et habitée, dotée de marchés, réputée pour ses tissus de lin de grande qualité et sa gamme de produits manufacturés. {cite:nuzhat-al-mushtaq-2002 p. 412}"
  ur: "بازاروں کے ساتھ ایک بڑا، آبادی والا، آباد شہر، کئی قسم کے باریک کتان کے کپڑے اور تیار کردہ سامان کی ایک رینج کے لیے جانا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 412}"
