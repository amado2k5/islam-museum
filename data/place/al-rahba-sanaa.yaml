label:
  ar: الرحبة من صنعاء
  en: al-Rahba, on the approach to Sana'a
  ur: رحبہ، صنعاء کے راستے پر
summary:
  ar: موضع قاتل عنده الهادي إبراهيم بن خلف بن طريف وهزمه في رجب سنة 288هـ قبل دخوله صنعاء؛ وحاشية المحقق عن معجم البلدان تذكر «رحبة صنعاء» دون بيان واضح لمسافتها في النص المقروء.
  en: The place where al-Hadi fought and routed Ibrahim ibn Khalaf ibn Tarif in Rajab 288 AH before entering Sana'a; the editor's footnote from Mu'jam al-Buldan speaks of the "rahba of Sana'a", with the distance unclear in the machine-read text.
  ur: وہ مقام جہاں ہادی نے رجب 288ھ میں صنعاء میں داخل ہونے سے پہلے ابراہیم بن خلف بن طریف سے جنگ کی اور اسے شکست دی؛ مرتب کا حاشیہ معجم البلدان سے «رحبۃ صنعاء» کا ذکر کرتا ہے، مشینی قراءت میں فاصلہ واضح نہیں۔
