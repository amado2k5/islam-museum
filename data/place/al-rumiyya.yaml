summary:
  ar: "موضع على دجلة قرب المدائن؛ عند البلاذري أقام عليها سعد حتى صالح أهلها على أن يجلو من أحب ويقيم من أقام على الطاعة وأداء الخراج ودلالة المسلمين."
  en: "place on the Tigris near al-Mada'in; in al-Baladhuri Sa'd camped there till its people made peace — whoever wished departing, who stayed on obedience, kharaj and guiding the Muslims."
  es: "lugar en el Tigris cerca de al-Mada'in; en al-Baladhuri Sa'd acampó allí hasta que su gente hizo la paz; quien deseaba partir, quien se quedaba por obediencia, kharaj y guiar a los musulmanes."
  fr: "lieu sur le Tigre près d'al-Mada'in; à al-Baladhuri, Sa'd campa là jusqu'à ce que son peuple fasse la paix — ceux qui souhaitaient partir, ceux qui restaient par obéissance, kharaj et guidage des musulmans."
  ur: "المدائن کے قریب دجلہ پر جگہ؛ البلادوری میں سعد نے وہیں ڈیرہ ڈالا یہاں تک کہ اس کے لوگوں نے صلح کر لی - جو بھی جانا چاہتا تھا، جو اطاعت، خارج اور مسلمانوں کی رہنمائی پر قائم رہا۔"
  tr: "Dicle kıyısında, şehirlere yakın bir yer; el-Baladhuri'ye göre, Sa'd orada kaldı ve sevdiği herkes kovulacak, kalanlar itaat edecek, vergi ödeyecek ve Müslümanları destekleyecekti."
  id: "Sebuah tempat di Sungai Tigris dekat kota-kota; menurut al-Baladhuri, Sa'd tinggal di sana sampai ia mendamaikan rakyatnya, dengan syarat siapa pun yang dicintainya akan diusir dan yang tinggal harus patuh, membayar pajak, dan mendukung umat Muslim."
