summary:
  ar: "قرية كبيرة تصاقب شنطوف، وتبعد عن شلقان نحو خمسة عشر ميلاً، وفيها سوق يُذكر أنها تعمّر بالقرى المجاورة. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  en: "A large village adjoining Shantuf, fifteen miles from Shalaqan, with a market serving the villages around it. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  es: "Un pueblo grande contiguo a Shantuf, a quince millas de Shalaqan, con un mercado que abastece a los pueblos de los alrededores. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  fr: "Un grand village limitrophe de Shantuf, à quinze milles de Shalaqan, avec un marché desservant les villages environnants. {cite:nuzhat-al-mushtaq-2002 p. 330}"
  ur: "شالقان سے پندرہ میل کے فاصلے پر شانتف سے ملحق ایک بڑا گاؤں، جس کے اردگرد کے دیہاتوں کی خدمت کرتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 330}"
  tr: "Shantouf yakınlarında, Shalqan'a yaklaşık on beş mil uzaklıkta büyük bir köy ve komşu köylerde inşa edildiği söylenen bir pazara sahiptir. {cite:nuzhat-al-mushtaq-2002 s. 330}"
  id: "Sebuah desa besar dekat Shantouf, sekitar lima belas mil dari Shalqan, dan memiliki pasar yang konon dibangun di desa-desa tetangga. {cite:Nuzhat-al-Mushtaq-2002 hlm. 330}"
