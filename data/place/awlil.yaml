summary:
  ar: "جزيرة قريبة من الساحل في البحر، بها ملاحة الملح المشهورة، ومنها يُحمل الملح إلى بلاد السودان كلها؛ إذ تأتي المراكب إليها فتُحمّل الملح ثم تسير به إلى النيل {cite:nuzhat-al-mushtaq-2002 p. 17}."
  en: "An island port off the coast with the best-known salt works in the Sudan lands. Ships load salt there and sail it to the Nile, from which it is carried to the whole region {cite:nuzhat-al-mushtaq-2002 p. 17}."
  es: "Un puerto insular frente a la costa con las salinas más conocidas de Sudán. Allí se carga sal y se transporta por mar hasta el Nilo, desde donde se distribuye a toda la región {cite:nuzhat-al-mushtaq-2002 p. 17}."
  fr: "Un port insulaire au large des côtes, abritant les salines les plus réputées du Soudan. Les navires y chargent le sel et le transportent jusqu'au Nil, d'où il est acheminé vers toute la région {cite:nuzhat-al-mushtaq-2002 p. 17}."
