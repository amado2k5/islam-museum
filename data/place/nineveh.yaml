summary:
  ar: "حصنا نينوى قبالة الموصل على دجلة؛ قاتل أهلها عتبة بن فرقد فأخذ الحصن الشرقي عنوة وعبر دجلة فصالحه أهل الحصن الآخر على الجزية والإذن لمن أراد الجلاء."
  en: "The twin forts of Nineveh facing Mosul across the Tigris; their people fought Utba ibn Farqad, he took the eastern fort by storm, crossed the river, and the other fort's people treated for jizya with leave for whoever wished to quit."
  es: "Las fortalezas gemelas de Nínive, frente a Mosul al otro lado del Tigris; su gente luchó contra Utba ibn Farqad, quien tomó la fortaleza oriental por asalto, cruzó el río y la gente de la otra fortaleza pagó la jizya, con permiso para que cualquiera que quisiera marcharse pudiera hacerlo."
  fr: "Les forteresses jumelles de Ninive faisant face à Mossoul de l'autre côté du Tigre; leurs habitants ont combattu Utba ibn Farqad, il a pris d'assaut la forteresse orientale, a traversé le fleuve, et les habitants de l'autre forteresse ont négocié la jizya avec une permission pour ceux qui souhaitaient partir."
