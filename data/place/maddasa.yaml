summary:
  ar: "مدينة متوسطة كثيرة العمارة على النيل، شربها منه، يكثر فيها الأرز والذرة، ويتجرون بالتبر، ويصيدون الحوت. تبعد عن تيرقى ستة أيام. {cite:nuzhat-al-mushtaq-2002 p. 25}"
  en: "A medium-sized, well-settled town on the Nile, drinking from it. Rice and sorghum are plentiful, trade is in gold, and fish are caught there. Six days from Tirqa. {cite:nuzhat-al-mushtaq-2002 p. 25}"
  es: "Una ciudad mediana y bien poblada a orillas del Nilo, que se abastece de sus aguas. Abundan el arroz y el sorgo, se comercia con oro y se pesca. Se encuentra a seis días de Tirqa. {cite:nuzhat-al-mushtaq-2002 p. 25}"
  fr: "Une ville de taille moyenne, bien établie, située sur les rives du Nil et s'approvisionnant en eau. Le riz et le sorgho y abondent, le commerce se fait en or et on y pratique la pêche. À six jours de Tirqa. {cite:nuzhat-al-mushtaq-2002 p. 25}"
  ur: "دریائے نیل پر ایک درمیانے درجے کا، اچھی طرح سے آباد شہر، اس سے پیتا ہے۔ چاول اور جوار بہت زیادہ ہیں، تجارت سونے کی ہے، اور مچھلی وہاں پکڑی جاتی ہے۔ ترکہ سے چھ دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 25}"
  tr: "Nil üzerinde inşa edilmiş orta büyüklükte bir şehir, buradan su içiyor, pirinç ve mısır açısından bol miktarda bulunuyor, hurma ticareti yapıyor ve balina avlıyor. Tirqi'ye altı gün uzaklıkta. {cite:nuzhat-al-mushtaq-2002 s. 25}"
  id: "Sebuah kota berukuran sedang yang dibangun di tepi Sungai Nil, minum dari sana, kaya beras dan jagung, berdagang kurma, dan menangkap paus. Kota ini berjarak enam hari dari Tirqi. {cite:nuzhat-al-mushtaq-2002 hlm. 25}"
