  fr: "Ville où se dresse le palais du roi de Baghbugh et sa cour; à quatre étapes d’Isnakhwa, sur la rivière Khamdan. {cite:nuzhat-al-mushtaq-2002 p. 212}"
  ur: "ایک شہر جہاں باغبغ بادشاہ کا محل اس کے گھر والوں کے ساتھ کھڑا ہے۔ خمدان ندی پر اسناخواہ سے چار مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 212}"
  tr: "Domuzbogh Kralı, eşi ve çocuklarının evinin bulunduğu bir şehir, Assenkhwa'dan dört adım uzaklıkta, Hamdan Nehri kıyısında yer almaktadır. {cite:nuzhat-al-mushtaq-2002 s. 212}"
  id: "Sebuah kota dengan rumah Raja Pigbogh, istrinya, dan anak-anaknya, terletak empat langkah dari Assenkhwa, di tepi Sungai Khamdan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 212}"
