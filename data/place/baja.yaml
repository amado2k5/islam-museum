summary:
  ar: "مدينة فيها دار ملك البغبوغ وحرمه وعياله، وتبعد عن اسنخوا أربع مراحل، وعلى ضفة نهر خمدان. {cite:nuzhat-al-mushtaq-2002 p. 212}"
  en: "A city where the palace of the Baghbugh king stands, with his household; four stages from Isnakhwa on the Khamdan river. {cite:nuzhat-al-mushtaq-2002 p. 212}"
