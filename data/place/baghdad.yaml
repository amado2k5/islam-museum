summary:
  en: "Capital of the Abbasid caliphate, founded by al-Mansur in 762 CE and a great centre of learning."
  ar: "عاصمة الخلافة العباسية، أسسها المنصور سنة 762م، وكانت مركزًا كبيرًا للعلم.، وعند المسعودي بنى المنصور على كل باب من أبواب مدينته الأربعة مجلساً يشرف منه على ما يليه من البلاد وهي شوارع محدقة وطاقات معقودة باقية إلى سنة اثنتين وثلاثين وثلثمائة، أولها باب خراسان وكان يسمى باب الدولة لإقبال الدولة العباسية من خراسان ثم باب الشام فباب الكوفة فباب البصرة، وبينما هو في مجلس باب خراسان سقط بين يديه سهم مكتوب عليه أبيات في الوعظ وهمذان منها رجل مظلوم في حبسك، ففتشوا الحبوس فوجدوا شيخاً موثقاً بالحديد منذ أربعة أعوام أخذ الوالي ضيعته، فأطلقه ورد عليه ضيعته بخراجها وعرض عليه ولاية همذان فأباها وعفا عن الوالي {cite:muruj-al-dhahab p. 276-278}"
