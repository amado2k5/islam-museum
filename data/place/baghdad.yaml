summary:
  en: "Baghdad lies on both banks of the Tigris. Founded by al-Mansur in the eighth century as his Round City and called Madinat al-Salam, it stayed the centre of the Abbasid caliphate until the Mongol conquest of 656/1258 and was for centuries the cultural metropolis of the Muslim world. It later became a provincial centre under the Ilkhanids and the Ottomans, and in 1921 the capital of modern Iraq."
  ar: "تقع بغداد على ضفتي دجلة. أسسها المنصور في القرن الثامن الميلادي مدينةً مدورة وسماها مدينة السلام، وظلت مركز الخلافة العباسية حتى الغزو المغولي سنة 656هـ/1258م، وكانت قرونًا العاصمة الثقافية للعالم الإسلامي. ثم صارت مركزًا إقليميًا في عهد الإلخانيين والعثمانيين، وفي سنة 1921م عاصمة العراق الحديث."
  ur: "بغداد دجلہ کے دونوں کناروں پر واقع ہے۔ منصور نے اسے آٹھویں صدی عیسوی میں اپنے گول شہر کے طور پر بسایا اور مدینۃ السلام کہا، اور یہ 656ھ/1258ء کی مغل یلغار تک عباسی خلافت کا مرکز رہا اور صدیوں مسلم دنیا کا ثقافتی دارالحکومت تھا۔ بعد میں ایلخانیوں اور عثمانیوں کے تحت یہ صوبائی مرکز بنا، اور 1921ء میں جدید عراق کا دارالحکومت۔"
