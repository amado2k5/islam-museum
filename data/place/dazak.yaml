summary:
  ar: "مدينة عامرة فيها تجارات كثيرة وبضائع نافقة، وقريبة من الجبل الملح الذي سُمي بذلك لملوحة أكثر مياهه. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  en: "A populated city with much trade and brisk goods, near a salt mountain named for the saltiness of most of its water. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  es: "Una ciudad poblada con mucho comercio y mercancías en auge, cerca de una montaña de sal que debe su nombre a la salinidad de la mayor parte de su agua. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  fr: "Une ville peuplée, où le commerce et les marchandises florissants étaient monnaie courante, située près d'une montagne de sel ainsi nommée en raison de la forte salinité de la majeure partie de son eau. {cite:nuzhat-al-mushtaq-2002 p. 174}"
  ur: "ایک آبادی والا شہر جس میں بہت زیادہ تجارت اور تیز سامان موجود ہے، ایک نمک کے پہاڑ کے قریب جس کا نام اس کے زیادہ تر پانی کی نمکینیت ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 174}"
  tr: "Birçok ticaret ve süresi geçmiş malların olduğu hareketli bir şehir, en tuzlu sularından adını alan Tuz Dağı'na yakın. {kaynak:nuzhat-al-mushtaq-2002 s. 174}"
  id: "Kota yang ramai dengan banyak perdagangan dan barang kadaluarsa, serta dekat dengan Gunung Garam, dinamai dari airnya yang paling asin. {cite:Nuzhat-al-Mushtaq-2002 hlm. 174}"
