summary:
  ar: "بلدة في شرقي تركيا، على نهر كوروجاي الذي يصير نهر الكُر، على ارتفاع نحو 1800م؛ كانت قاعدة سنجق في إيالة قارص، وضمتها معاهدة سان ستيفانو سنة 1878م إلى روسيا، ثم ردّتها جورجيا سنة 1921م، ومنذ ذلك الحين قاعدة قضاء في ولاية قارص {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
  en: "A town in eastern Turkey on the Kuručay, which becomes the Kura, at about 1,800 m. It was once the capital of a sandjak in the iyalet of Kars; the treaty of San Stefano (1878) ceded it to Russia, Georgia returned it on 23 February 1921, and it is now the capital of a kaza in the vilayet of Kars {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
