summary:
  ar: "بلدة في شرقي تركيا، على نهر كوروجاي الذي يصير نهر الكُر، على ارتفاع نحو 1800م؛ كانت قاعدة سنجق في إيالة قارص، وضمتها معاهدة سان ستيفانو سنة 1878م إلى روسيا، ثم ردّتها جورجيا سنة 1921م، ومنذ ذلك الحين قاعدة قضاء في ولاية قارص {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
  en: "A town in eastern Turkey on the Kuručay, which becomes the Kura, at about 1,800 m. It was once the capital of a sandjak in the iyalet of Kars; the treaty of San Stefano (1878) ceded it to Russia, Georgia returned it on 23 February 1921, and it is now the capital of a kaza in the vilayet of Kars {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
  es: "Una ciudad en el este de Turquía en el Kuručay, que se convierte en el Kura, a unos 1.800 m. Fue en su día la capital de un sandjak en el iyalet de Kars; el tratado de San Stefano (1878) la cedió a Rusia, Georgia la devolvió el 23 de febrero de 1921, y ahora es la capital de un kaza en el vilayet de Kars {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
  fr: "Une ville de l'est de la Turquie sur le Kuručay, qui devient le Kura, à environ 1 800 m. Elle fut autrefois la capitale d'un sandjak dans l'iyalet de Kars; le traité de San Stefano (1878) la céda à la Russie, la Géorgie la restitua le 23 février 1921, et elle est maintenant la capitale d'un kaza dans le vilayet de Kars {cite:encyclopaedia-of-islam-2 vol. 1 p. 674}."
  ur: "مشرقی ترکی کا ایک قصبہ Kuručay پر، جو Kura بنتا ہے، تقریباً 1,800 میٹر۔ یہ کبھی کارس کے آئیلیٹ میں سینڈجک کا دارالحکومت تھا۔ سان سٹیفانو کے معاہدے (1878) نے اسے روس کے حوالے کر دیا، جارجیا نے اسے 23 فروری 1921 کو واپس کر دیا، اور اب یہ کارس کے ولایت میں ایک قازہ کا دارالحکومت ہے۔ 1 ص۔ 674}۔"
