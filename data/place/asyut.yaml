summary:
  ar: "مدينة في صعيد مصر على الشط الغربي من النيل، على نحو ثلاثة أميال منه، حولها بساتين النخل وسورها سور عتيق؛ ذكرها ابن جبير في طريقه صاعداً إلى قوص ⁦(الصفحة 374 من الماسح الضوئي للنسخة)⁩."
  en: "A city in Upper Egypt on the west bank of the Nile, about three miles from it, with palm groves around it and an old wall. Ibn Jubayr mentioned it on his way upstream to Qus (page 374 of the scan of the copy)."
  es: "Una ciudad del Alto Egipto, en la margen occidental del Nilo, a unos cinco kilómetros del río, rodeada de palmerales y con una antigua muralla. Ibn Jubayr la mencionó en su viaje río arriba hacia Qus (página 374 del escaneo de la copia)."
  fr: "Une ville de Haute-Égypte, située sur la rive ouest du Nil, à environ cinq kilomètres de la ville, entourée de palmeraies et ceinte d'une ancienne muraille. Ibn Jubayr la mentionne lors de son voyage en amont vers Qus (page 374 de la version numérisée)."
  ur: "دریائے نیل کے مغربی کنارے پر بالائی مصر کا ایک شہر، اس سے تقریباً تین میل دور، اس کے ارد گرد کھجور کے باغ اور ایک پرانی دیوار۔ ابن جبیر نے اس کا تذکرہ قس کی طرف جاتے ہوئے کیا ہے ⁦(کاپی کے اسکین کا صفحہ 374)⁩۔"
