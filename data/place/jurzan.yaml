summary:
  ar: "جرزان من بلاد أرمينية الثانية وكانت في أيدي الخزر؛ بنى فيها أنوشروان مدينة سغدبيل فأنزلها قوماً من الصغد وأبناء فارس وجعلها مسلحة وبنى مما يلي الروم بأرضها باب فيروزقباذ وباب لاذقة وباب بارقة على بحر طرابزندة."
  en: "Jurzan (Kartli, Iberia), of the second Armenia's lands and then in Khazar hands; in it Anushirwan built the city of Sughdabil settling Sughdians and sons of Persians as a muslaha, and toward the Romans in its land Bab Fayruzqubadh, Bab Ladhiqa and Bab Bariqa on the sea of Trebizond."
  es: "Jurzan (Kartli, Iberia), de tierras de la segunda Armenia y luego en manos jázaras; en ella Anushirwan construyó la ciudad de Sughdabil asentando a los sugdianos y a los hijos de persas como muslaha, y hacia los romanos en su tierra Bab Fayruzqubadh, Bab Ladhiqa y Bab Bariqa en el mar de Trebisonda."
  fr: "Jurzan (Kartli, Ibérie), des terres de la seconde Arménie puis aux mains des Khazars; Anushirwan y construisit la ville de Sughdabil, installant les Sughdiens et les fils des Perses comme muslaha, et vers les Romains sur ses terres Bab Fayruzqubadh, Bab Ladhiqa et Bab Bariqa sur la mer de Trébizonde."
  ur: "جورزان ⁦(کارتلی، آئبیریا)⁩، دوسری آرمینیا کی سرزمین اور پھر خزر کے ہاتھ میں؛ اس میں انوشیروان نے صغدبیل شہر تعمیر کیا جس میں صغدیوں اور فارسیوں کے بیٹوں کو ایک مصلح کے طور پر آباد کیا اور رومیوں کی طرف اس کی سرزمین باب فیروزقبد، باب لدھیقہ اور باب بریقہ میں ٹریبیزنڈ کے سمندر پر۔"
  tr: "Jazan, II. Ermenistan topraklarından geliyordu ve Hazarların kontrolü altındaydı; Anuşirvan burada Sugdbil şehrini kurdu, bir grup Sogd'u yerleştirdi ve Pers oğulları onu silahlandırdı ve topraklarında Trebzind Denizi'nde Bab Firuzqabad, Bab Lataka ve Bab Barqa'yı inşa etti."
  id: "Jarzan berasal dari tanah Armenia II dan berada di bawah kendali Khazar; Anushirvan membangun kota Sugdbil di sana, menetap sekelompok Sogdian, dan putra-putra Persia, mempersenjatainya, dan membangun di tanahnya Bab Firuzqabad, Bab Lataka, dan Bab Barqa di Laut Trebzind."
