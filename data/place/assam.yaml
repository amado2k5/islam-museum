summary:
  ar: "أقصى الأقاليم الشرقية للهند وبورما، تضم وادي البراهمابوترا والتلال المحيطة به؛ ودخلها الإسلام مع حملات سلاطين البنغال منذ بختيار الخلجي ⁦(1206م)⁩، وكان المسلمون نحو خُمس سكانه سنة 1951م، وكان الأهوم، الذين أسسوا مملكتهم في الوادي، يكتبون حوليات تسمى البورانجي {cite:encyclopaedia-of-islam-2 vol. 1 p. 768-769}."
  en: "The easternmost province of India and Burma, comprising the Brahmaputra valley and the hills around it. Muslim advance into Kamrup began with Bakhtiyar Khalji in 1206 and went through three stages, the last after 1612 under Islam Khan, the Mughal governor of Bengal; the Ahom kingdom, whose first known king Sukapha occupied part of the upper valley in 1228, ruled the valley from 1682 until the British intervention in 1824. In 1951 the Muslims numbered 1,996,456 of a population of 9,043,707 {cite:encyclopaedia-of-islam-2 vol. 1 p. 768-769}."
  es: "La provincia más oriental de India y Birmania, que comprende el valle del Brahmaputra y las colinas que lo rodean. El avance musulmán en Kamrup comenzó con Bakhtiyar Khalji en 1206 y pasó por tres etapas, la última después de 1612 bajo Islam Khan, el gobernador mogol de Bengala; el reino Ahom, cuyo primer rey conocido, Sukapha, ocupó parte del valle superior en 1228, gobernó el valle desde 1682 hasta la intervención británica en 1824. En 1951, los musulmanes sumaban 1.996.456 de una población de 9.043.707 {cite:encyclopaedia-of-islam-2 vol. 1 p. 768-769}."
  fr: "Province la plus orientale de l'Inde et de la Birmanie, elle comprend la vallée du Brahmapoutre et les collines environnantes. L'avancée musulmane dans le Kamrup commença avec Bakhtiyar Khalji en 1206 et se déroula en trois phases, la dernière après 1612 sous Islam Khan, gouverneur moghol du Bengale. Le royaume Ahom, dont le premier roi connu, Sukapha, occupa une partie de la haute vallée en 1228, régna sur la vallée de 1682 jusqu'à l'intervention britannique en 1824. En 1951, les musulmans étaient au nombre de 1 996 456 sur une population totale de 9 043 707 (voir: Encyclopaedia of Islam, vol. 1, p. 768-769)."
  ur: "ہندوستان اور برما کا سب سے مشرقی صوبہ، برہمپترا وادی اور اس کے ارد گرد کی پہاڑیوں پر مشتمل ہے۔ کامروپ میں مسلمانوں کی پیش قدمی 1206 میں بختیار خلجی کے ساتھ شروع ہوئی اور تین مراحل سے گزری، آخری 1612 کے بعد بنگال کے مغل گورنر اسلام خان کے تحت۔ آہوم سلطنت، جس کے پہلے مشہور بادشاہ سوکافا نے 1228 میں بالائی وادی کے ایک حصے پر قبضہ کیا، 1682 سے لے کر 1824 میں برطانوی مداخلت تک وادی پر حکومت کی۔ 1951 میں مسلمانوں کی آبادی 9,043,707 کی آبادی میں سے 1,996,456 تھی۔ 1 ص۔ 768-769}۔"
  tr: "Hindistan ve Burma'nın en doğudaki bölgeleri Brahmaputra Vadisi ve çevresindeki tepeleri içerir; İslam, Bakhtiar Haliji'den (1206) itibaren Bengal sultanlarının seferleriyle buraya girdi ve 1951'de nüfusun yaklaşık beşte biri Müslümanlardı. Vadide krallıklarını kuran Ahomlar, Boranji adlı yıllıklar yazdılar {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 768-769}."
  id: "Wilayah paling timur India dan Burma meliputi Lembah Brahmaputra dan perbukitan sekitarnya; Islam masuk ke sana melalui kampanye para sultan Bengal sejak Bakhtiar Khaliji (1206 M), dan Muslim sekitar seperlima dari populasinya pada tahun 1951. Keluarga Ahom, yang mendirikan kerajaan mereka di lembah ini, menulis catatan sejarah bernama Boranji {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 768-769}."
