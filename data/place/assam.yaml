summary:
  ar: "أقصى الأقاليم الشرقية للهند وبورما، تضم وادي البراهمابوترا والتلال المحيطة به؛ ودخلها الإسلام مع حملات سلاطين البنغال منذ بختيار الخلجي (1206م)، وكان المسلمون نحو خُمس سكانه سنة 1951م، وكان الأهوم، الذين أسسوا مملكتهم في الوادي، يكتبون حوليات تسمى البورانجي {cite:encyclopaedia-of-islam-2 vol. 1 p. 768-769}."
  en: "The easternmost province of India and Burma, comprising the Brahmaputra valley and the hills around it. Muslim advance into Kamrup began with Bakhtiyar Khalji in 1206 and went through three stages, the last after 1612 under Islam Khan, the Mughal governor of Bengal; the Ahom kingdom, whose first known king Sukapha occupied part of the upper valley in 1228, ruled the valley from 1682 until the British intervention in 1824. In 1951 the Muslims numbered 1,996,456 of a population of 9,043,707 {cite:encyclopaedia-of-islam-2 vol. 1 p. 768-769}."
