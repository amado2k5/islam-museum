summary:
  ar: "بلدة في موريتانيا، عاصمة دائرة آدرار، على ارتفاع نحو 230 مترًا، وعلى بعد نحو 420 كيلومترًا شرق بورت-إتيان، وسكانها في معظمهم من السماكيين. نشأت في القرن السادس عشر أو السابع عشر الميلادي بانشقاق جماعة من السماكيين عن شنقيط، فصارت المركز التجاري الرئيس لآدرار، وبقيت شنقيط عاصمتها الروحية والدينية؛ ودخلها الكولونيل غورو سنة 1909م {cite:encyclopaedia-of-islam-2 vol. 1 p. 782}."
  en: "A town in Mauritania, chief place of the Adrar circle, at about 230 m above sea level and about 420 km east of Port-Etienne, with about 4,500 inhabitants, mostly Smacids, a tribe of marabouts. It was founded in the sixteenth or seventeenth century CE, when a group of Smacids broke away from Chinguetti. Chinguetti remained the spiritual and religious capital of the Adrar, while Atar became the principal commercial centre; Colonel Gouraud entered the town in January 1909 {cite:encyclopaedia-of-islam-2 vol. 1 p. 782}."
