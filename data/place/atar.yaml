summary:
  ar: بلدة في موريتانيا، عاصمة دائرة آدرار، على ارتفاع نحو 230 مترًا، وعلى بعد نحو 420 كيلومترًا شرق بورت-إتيان، وسكانها في معظمهم من السماكيين. نشأت في القرن السادس عشر أو السابع عشر الميلادي بانشقاق جماعة من السماكيين عن شنقيط، فصارت المركز التجاري الرئيس لآدرار، وبقيت شنقيط عاصمتها الروحية والدينية؛ ودخلها الكولونيل غورو سنة 1909م {cite:encyclopaedia-of-islam-2 vol. 1 p. 782}.
  en: A town in Mauritania, chief place of the Adrar circle, at about 230 m above sea level and about 420 km east of Port-Etienne, with about 4,500 inhabitants, mostly Smacids, a tribe of marabouts. It was founded in the sixteenth or seventeenth century CE, when a group of Smacids broke away from Chinguetti. Chinguetti remained the spiritual and religious capital of the Adrar, while Atar became the principal commercial centre; Colonel Gouraud entered the town in January 1909 {cite:encyclopaedia-of-islam-2 vol. 1 p. 782}.
  es: "Ciudad de Mauritania, centro principal del círculo de Adrar, situada a unos 230 m sobre el nivel del mar y a unos 420 km al este de Port-Étienne, con unos 4500 habitantes, en su mayoría smacídes, una tribu de marabúes. Fue fundada en el siglo XVI o XVII d. C., cuando un grupo de smacídes se separó de Chinguetti. Chinguetti siguió siendo la capital espiritual y religiosa de Adrar, mientras que Atar se convirtió en el principal centro comercial; el coronel Gouraud entró en la ciudad en enero de 1909 {cite:encyclopaedia-of-islam-2 vol. 1 p. 782}."
  fr: "Ville de Mauritanie, chef-lieu du cercle de l'Adrar, située à environ 230 m d'altitude et à quelque 420 km à l'est de Port-Étienne, elle compte environ 4 500 habitants, principalement des Smacides, une tribu de marabouts. Elle fut fondée au XVIe ou XVIIe siècle, lorsqu'un groupe de Smacides se sépara de Chinguetti. Chinguetti demeura la capitale spirituelle et religieuse de l'Adrar, tandis qu'Atar devint le principal centre commercial; le colonel Gouraud y entra en janvier 1909."
  ur: "موریطانیہ کا ایک قصبہ، ادرار دائرے کا مرکزی مقام، سطح سمندر سے تقریباً 230 میٹر بلندی پر اور پورٹ-ایٹین سے تقریباً 420 کلومیٹر مشرق میں، جس میں تقریباً 4,500 باشندے ہیں، جن میں زیادہ تر سماکیڈز، ماراباؤٹس کا ایک قبیلہ ہے۔ اس کی بنیاد سولہویں یا سترھویں صدی عیسوی میں رکھی گئی تھی، جب سماکڈز کا ایک گروپ چنگیٹی سے الگ ہو گیا۔ چنگوئٹی ادرار کا روحانی اور مذہبی دارالحکومت رہا، جبکہ عطار بنیادی تجارتی مرکز بن گیا۔ کرنل گوراڈ جنوری 1909 میں شہر میں داخل ہوا 1 ص۔ 782}۔"
