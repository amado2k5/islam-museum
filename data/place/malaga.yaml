summary:
  ar: مالقة مدينة ساحلية كبرى بالأندلس على البحر الأبيض، من كورة رية، حكمها بنو حمود ثم الغرناطيون النصريون، وحاصرها النصارى
    براً وبحراً سنة اثنتين وتسعين وثمانمائة فقاتل أهلها بالمدافع والخيل والرجل حتى فنيت الميرة وأكلوا المواشي والخيل والحمير
    وبعثوا الكتب للعدوتين فلم يأتهم أحد، ولم يظهروا ملعاً ولا ضعفاً حتى أُخذوا أسرى في أواخر شعبان {cite:nafh-tib-maqqari
    p. 520-521}.
  en: Malaga, the great Andalusi port on the Mediterranean in the kura of Rayya; besieged by land and sea in 892, its people
    fought with cannon and cavalry until the stores ran out and they ate beasts, horses and donkeys — taken captive in late
    Sha'ban {cite:nafh-tib-maqqari p. 520-521}.
  es: "Málaga, el gran puerto andalusí del Mediterráneo en la kura de Rayya; asediada por tierra y mar en 892, su gente luchó con cañones y caballería hasta que se agotaron las provisiones y comieron bestias, caballos y asnos; fueron hechos prisioneros a finales de Sha'ban {cite:nafh-tib-maqqari p. 520-521}."
  fr: "Malaga, le grand port andalou de la Méditerranée dans la koura de Rayya; assiégé par terre et par mer en 892, ses habitants se sont battus avec des canons et de la cavalerie jusqu'à épuisement des stocks et ils ont mangé des bêtes, des chevaux et des ânes — faits prisonniers à la fin de Sha'ban {cite:nafh-tib-maqqari p. 520-521}."
  ur: "ملاگا، بحیرہ روم کی عظیم اندلس بندرگاہ رییا کے کورا میں؛ 892 میں خشکی اور سمندر کے ذریعے محاصرہ کیا گیا، اس کے لوگ توپوں اور گھڑ سواروں سے لڑتے رہے یہاں تک کہ دکانیں ختم ہو گئیں اور وہ درندے، گھوڑے اور گدھے کھا گئے - شعبان کے اواخر میں اسیر ہو گئے۔ 520-521}۔"
  tr: "Malaga, Kora Rayya'dan Akdeniz kıyısındaki Endülüs'te önemli bir kıyı şehridir. Banu Hamud ve ardından Granada Nasranlıları tarafından yönetilmiştir. Hristiyanlar 892 yılında kara ve denizden kuşatmıştır. Halkları toplar, atlar ve insanlarla savaşmıştır, ta ki Meera yok edilene kadar. Hayvan, at ve eşek yediler, düşmanlara mektuplar gönderdiler, ancak kimse gelmedi. Geç Şa'ban'da esir alınana kadar zayıflık veya zayıflık belirtisi göstermediler {cite:nafh-tib-maqqari s. 520-521}."
  id: "Malaga adalah kota pesisir utama di Andalusia di Laut Mediterania, dari Kora Rayya. Kota ini diperintah oleh Banu Hamud dan kemudian Nasranid Granada. Orang Kristen mengepungnya melalui darat dan laut pada tahun 892. Rakyat mereka bertempur dengan meriam, kuda, dan manusia hingga Meera hancur. Mereka makan ternak, kuda, dan keledai, serta mengirim surat kepada musuh, tetapi tidak ada yang datang. Mereka tidak menunjukkan tanda-tanda kelemahan atau kelemahan sampai mereka ditawan pada akhir Sha'ban {cite:nafh-tib-maqqari hlm. 520-521}."
