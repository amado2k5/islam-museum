summary:
  ar: مالقة مدينة ساحلية كبرى بالأندلس على البحر الأبيض، من كورة رية، حكمها بنو حمود ثم الغرناطيون النصريون، وحاصرها النصارى
    براً وبحراً سنة اثنتين وتسعين وثمانمائة فقاتل أهلها بالمدافع والخيل والرجل حتى فنيت الميرة وأكلوا المواشي والخيل والحمير
    وبعثوا الكتب للعدوتين فلم يأتهم أحد، ولم يظهروا ملعاً ولا ضعفاً حتى أُخذوا أسرى في أواخر شعبان {cite:nafh-tib-maqqari
    p. 520-521}.
  en: Malaga, the great Andalusi port on the Mediterranean in the kura of Rayya; besieged by land and sea in 892, its people
    fought with cannon and cavalry until the stores ran out and they ate beasts, horses and donkeys — taken captive in late
    Sha'ban {cite:nafh-tib-maqqari p. 520-521}.
