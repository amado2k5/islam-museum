summary:
  ar: "مدينة متحصنة على شرف لها سور حصين وديار ومتنزهات، والأسعار والمطاعم والمشارب فيها كثيرة الرخص، وتبعد عن مرسى الدجاج أربعة وعشرين ميلًا. {cite:nuzhat-al-mushtaq-2002 p. 259}"
  en: "A fortified city on a height with a strong wall, houses and gardens; prices and food are cheap there. Twenty-four miles from Marsa al-Dajaj. {cite:nuzhat-al-mushtaq-2002 p. 259}"
  es: "Una ciudad fortificada en lo alto de una colina, con una sólida muralla, casas y jardines; los precios y la comida son baratos. A veinticuatro millas de Marsa al-Dajaj. {cite:nuzhat-al-mushtaq-2002 p. 259}"
  fr: "Ville fortifiée perchée sur une hauteur, entourée d'une solide muraille, avec des maisons et des jardins; les prix et la nourriture y sont bon marché. À 39 kilomètres de Marsa al-Dajaj. {cite:nuzhat-al-mushtaq-2002 p. 259}"
  ur: "ایک مضبوط فصیل، مکانات اور باغات کے ساتھ بلندی پر قلعہ بند شہر؛ قیمتیں اور کھانے وہاں سستے ہیں۔ مرسہ الدجاج سے چوبیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 259}"
  tr: "Güçlü duvarları, evleri ve parkları, birçok uygun fiyatı, restoranı ve içeceği olan tahkim edilmiş bir şehirdir ve Marsa Al-Dajaj'a yirmi dört mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 259}"
  id: "Sebuah kota benteng dengan tembok kuat, rumah, dan taman, dengan banyak harga terjangkau, restoran, dan minuman, dan berjarak dua puluh empat mil dari Marsa Al-Dajaj. {cite:nuzhat-al-mushtaq-2002 hlm. 259}"
