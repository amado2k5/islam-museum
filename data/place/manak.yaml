  fr: "Ville de taille moyenne, construite en pierre et en plâtre, avec des bâtiments, des marchés et une population nombreuse; la plus grande ville d’al-Khuttal, à deux étapes de Hulbak. {cite:nuzhat-al-mushtaq-2002 p. 487}"
  ur: "عمارتوں، بازاروں اور بہت سے لوگوں کے ساتھ پتھر اور پلاسٹر کا ایک درمیانے درجے کا شہر؛ الخطل کا سب سے بڑا شہر، ہلبک سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 487}"
