label: { ar: "بلش مالقة", en: "Velez-Malaga", es: "Vélez-Málaga", fr: "Vélez-Malaga" }
summary:
  ar: "بلش ⁦(بلش مالقة)⁩ من مدن شرق مالقة؛ دخلت في دعوة السلطان المأسور أبي عبد الله فنودي فيها بالصلح {cite:nafh-tib-maqqari p. 520}، ثم حاصرها صاحب قشتالة براً وبحراً في ربيع الثاني سنة 892 فانهزم جيش إغاثتها قبل الالتحام لخبر ثورة غرناطة، وخرج أهلها على الأمان يوم الجمعة عاشر جمادى الأولى وأطاعت البلاد التي بشرقي مالقة وحصن قمارش {cite:nafh-tib-maqqari p. 523-524}."
  en: "Velez-Malaga — first of the east-Malaga cities to fall in the final war; it went over to the captive sultan's peace-party, then surrendered on Friday 10 Jumada I 892 when the relief army broke before contact on the rumour Granada had risen {cite:nafh-tib-maqqari p. 523-524}."
  es: "Vélez-Málaga — la primera de las ciudades del este de Málaga en caer en la guerra final; se unió al partido de paz del sultán cautivo y luego se rindió el viernes 10 de Jumada I de 892 cuando el ejército de socorro se retiró antes de establecer contacto debido al rumor de que Granada había resurgido {cite:nafh-tib-maqqari p. 523-524}."
  fr: "Vélez-Malaga — première des villes de l'est de Malaga à tomber lors de la guerre finale; elle passa au parti de paix du sultan captif, puis se rendit le vendredi 10 Jumada I 892 lorsque l'armée de secours rompit les rangs avant le contact sur la rumeur que Grenade s'était soulevée {cite:nafh-tib-maqqari p. 523-524}."
