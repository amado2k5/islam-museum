summary:
  ar: "بلش (بلش مالقة) من مدن شرق مالقة؛ دخلت في دعوة السلطان المأسور أبي عبد الله فنودي فيها بالصلح {cite:nafh-tib-maqqari p. 520}، ثم حاصرها صاحب قشتالة براً وبحراً في ربيع الثاني سنة 892 فانهزم جيش إغاثتها قبل الالتحام لخبر ثورة غرناطة، وخرج أهلها على الأمان يوم الجمعة عاشر جمادى الأولى وأطاعت البلاد التي بشرقي مالقة وحصن قمارش {cite:nafh-tib-maqqari p. 523-524}."
  en: "Velez-Malaga — first of the east-Malaga cities to fall in the final war; it went over to the captive sultan's peace-party, then surrendered on Friday 10 Jumada I 892 when the relief army broke before contact on the rumour Granada had risen {cite:nafh-tib-maqqari p. 523-524}."
