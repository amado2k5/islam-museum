  ar: "موضع نزل به عبد الله بن الحسين وربيع بن الروية في صفر سنة 289هـ مقابلين لعسكر غيمان، وخرج إليه جيش للهادي وأقام أهله به وفيه درب قاتل القوم عليه."
  en: "A place where Abdullah ibn al-Husayn and Rabi' ibn al-Ruwayya camped in Safar 289 AH facing the camp at Ghayman; an army of al-Hadi's went out to it and its people stayed there, and its road was fought over."
  ur: "ایسی جگہ جہاں عبداللہ بن الحسین اور ربیع بن الرویہ نے صفر 289ھ میں غیمان کے پڑاؤ کے سامنے پڑاؤ ڈالا؛ ہادی کا ایک لشکر وہاں نکلا اور وہاں کے لوگ وہیں رہے، اور اس کے راستے پر لڑائی ہوئی۔"
