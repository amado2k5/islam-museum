  es: "Una ciudad poblada y civilizada con casas en pie, granjas y cultivos a orillas de un río; a setenta millas de Tours, una de las ciudades de Francia mencionadas por al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 862}"
  fr: "Une ville peuplée et civilisée, avec des maisons, des fermes et des cultures, au bord d'une rivière; à soixante-dix milles de Tours, l'une des villes de France mentionnées dans le récit d'al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 862}"
