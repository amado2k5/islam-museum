summary:
  ar: "مدينة عامرة متحضرة ذات دور عامرة ومزارع وغلات، وتقع على نهر، وتبعد عن طرش سبعين ميلاً، ويذكر الإدريسي أنها من مدن إفرنسية. {cite:nuzhat-al-mushtaq-2002 p. 862}"
  en: "A populated, civilised city with standing houses, farms and crops on a river; seventy miles from Tours, one of the cities of France in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 862}"
  es: "Una ciudad poblada y civilizada con casas en pie, granjas y cultivos a orillas de un río; a setenta millas de Tours, una de las ciudades de Francia mencionadas por al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 862}"
  fr: "Une ville peuplée et civilisée, avec des maisons, des fermes et des cultures, au bord d'une rivière; à soixante-dix milles de Tours, l'une des villes de France mentionnées dans le récit d'al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 862}"
  ur: "ایک آبادی والا، مہذب شہر جس میں دریا پر کھڑے مکانات، کھیت اور فصلیں ہیں۔ ٹورز سے ستر میل دور، الادریسی کے کھاتے میں فرانس کے شہروں میں سے ایک ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 862}"
  tr: "Zengin evleri, çiftlikleri ve ürünleriyle zengin ve medeni bir şehir, Tarash'a yetmiş mil uzaklıkta, bir nehir kenarında yer alır. El-İdrisi, buranın Fransız şehirlerinden biri olduğunu belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 862}"
  id: "Sebuah kota yang makmur dan beradab dengan rumah, pertanian, dan tanaman yang makmur, terletak di tepi sungai, tujuh puluh mil dari Tarash. Al-Idrisi menyebutkan bahwa kota ini adalah salah satu kota Prancis. {cite:nuzhat-al-mushtaq-2002 hlm. 862}"
