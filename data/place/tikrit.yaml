summary:
  ar: مدينة على الفرات؛ عند البلاذري أغار عليها النسير وحذيفة بن محصن بعد يوم الجسر فأصابا نعماً وشاء وعن أبي مسعود أن التسير وحذيفة آمنوا أهلها وكتبا لهم كتاباً أنفذه عتبة بن فرقد السلمي حين فتح الطيرهان والموصل.
  en: Town on the Tigris; in al-Baladhuri raided by al-Nusayr and Hudhayfa ibn Mihsan after the Day of the Bridge, its people then safe-conducted with a written document that Utba ibn Farqad al-Sulami enforced when opening al-Tirhan and Mosul.
  es: "Ciudad a orillas del Tigris; en al-Baladhuri, asaltada por al-Nusayr y Hudhayfa ibn Mihsan después del Día del Puente, sus habitantes fueron puestos a salvo con un documento escrito que Utba ibn Farqad al-Sulami hizo cumplir al abrir al-Tirhan y Mosul."
  fr: "Ville sur le Tigre; à al-Baladhuri, pillée par al-Nusayr et Hudhayfa ibn Mihsan après le Jour du Pont, ses habitants furent ensuite mis en sécurité grâce à un document écrit qu'Utba ibn Farqad al-Sulami fit appliquer lors de l'ouverture d'al-Tirhan et de Mossoul."
  ur: "دجلہ پر شہر؛ البلادوری میں برج کے دن کے بعد النصیر اور حذیفہ ابن محصن نے چھاپہ مارا، اس کے بعد اس کے لوگوں نے ایک تحریری دستاویز کے ساتھ محفوظ طریقے سے کام کیا جسے عتبہ بن فرقد السلمی نے الطرحان اور موصل کو کھولتے وقت نافذ کیا تھا۔"
  tr: "Fırat kıyısında bir şehir; el-Baladhuri'ye göre, el-Nasir ve Hudhayfah ibn Muhsin Köprü Günü'nden sonra buraya baskın düzenlemiş ve bereket ve iradeyle etkilenmişlerdir. Ebu Mes'ud'a göre, el-Tasir ve Hudhayfah halkına inanmış ve Utbah ibn Farcad el-Sulami tarafından el-Tirhan ve Musul'u fethettiğinde onlara bir mektup yazmışlardır."
  id: "Sebuah kota di tepi Sungai Efrat; menurut al-Baladhuri, al-Nasir dan Hudhayfah ibn Muhsin menyerbu kota itu setelah Hari Jembatan, dan mereka terkena berkah dan kehendak. Menurut Abu Mas'ud, al-Tasir dan Hudhayfah mempercayai rakyatnya dan menulis surat yang dieksekusi oleh Utbah ibn Farqad al-Sulami ketika ia menaklukkan al-Tyrhan dan Mosul."
