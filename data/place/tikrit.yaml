summary:
  ar: مدينة على الفرات؛ عند البلاذري أغار عليها النسير وحذيفة بن محصن بعد يوم الجسر فأصابا نعماً وشاء وعن أبي مسعود أن التسير وحذيفة آمنوا أهلها وكتبا لهم كتاباً أنفذه عتبة بن فرقد السلمي حين فتح الطيرهان والموصل.
  en: Town on the Tigris; in al-Baladhuri raided by al-Nusayr and Hudhayfa ibn Mihsan after the Day of the Bridge, its people then safe-conducted with a written document that Utba ibn Farqad al-Sulami enforced when opening al-Tirhan and Mosul.
