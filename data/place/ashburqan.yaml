summary:
  ar: "مدينة في الجوزجان، تبعد عن الطالقان أربعة وخمسين ميلاً، وعليها زروع وبساتين وماء جار قليل. {cite:nuzhat-al-mushtaq-2002 p. 478}"
  en: "A town in al-Jawzjan, fifty-four miles from Talaqan, with fields, orchards and little running water. {cite:nuzhat-al-mushtaq-2002 p. 478}"
  es: "Un pueblo en al-Jawzjan, a cincuenta y cuatro millas de Talaqan, con campos, huertos y poca agua corriente. {cite:nuzhat-al-mushtaq-2002 p. 478}"
  fr: "Une ville d'al-Jawzjan, à cinquante-quatre milles de Talaqan, avec des champs, des vergers et peu d'eau courante. {cite:nuzhat-al-mushtaq-2002 p. 478}"
  ur: "الجوزجان کا ایک قصبہ، طلقان سے چون میل دور، جس میں کھیت، باغات اور بہتے ہوئے پانی ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 478}"
  tr: "Jowzjan'da, Talqan'a elli dört mil uzaklıkta, ekinleri, meyve bahçeleri ve az akan suyu olan bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 478}"
  id: "Sebuah kota di Jowzjan, lima puluh empat mil dari Talqan, dengan tanaman, kebun buah, dan sedikit air mengalir. {cite:nuzhat-al-mushtaq-2002 hlm. 478}"
