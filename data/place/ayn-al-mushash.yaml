summary:
  ar: "العين التي حفرتها أم جعفر زبيدة بالحجاز ومهدت الطريق لمائها في كل خفض ورفع وسهل وجبل ووعر حتى أخرجتها من مسافة اثني عشر ميلاً إلى مكة، وكان جملة ما أنفقت عليها مما ذكر وأحصى ألف ألف وسبعمائة ألف دينار كما عند المسعودي {cite:muruj-al-dhahab p. 671}."
  en: "The spring Zubayda dug in the Hijaz and channelled over twelve miles of hill and wadi into Mecca at a reckoned cost of 1,700,000 dinars {cite:muruj-al-dhahab p. 671}."
  es: "El manantial Zubayda excavó en el Hiyaz y canalizó más de doce millas de colinas y uadis hasta La Meca a un costo estimado de 1.700.000 dinares {cite:muruj-al-dhahab p. 671}."
  fr: "La source que Zubayda a creusée dans le Hedjaz et a canalisé plus de douze miles de collines et de oueds jusqu'à La Mecque pour un coût estimé à 1 700 000 dinars {cite:muruj-al-dhahab p. 671}."
  ur: "موسم بہار زبیدہ نے حجاز میں کھدائی کی اور بارہ میل سے زیادہ پہاڑی اور وادی کو 1,700,000 دینار کے حساب سے مکہ میں منتقل کیا۔ 671}۔"
  tr: "Um Ca'fer Zubeyda'nın Hicaz'da kazdığı kaynak, her vadi, yükseklik, ova, dağ ve engebeli arazide suyunun yolunu açtı ve onu on iki mil mesafeden Mekke'ye getirdi. Al-Mas'udi tarafından kaydedildiği üzere toplam harcanan miktar bin yedi yüz bin dinar olarak tahmin edilmiştir {cite:muruj-al-dhahab, s. 671}."
  id: "Mata air yang digali oleh um Ja'far Zubaydah di Hijaz, membuka jalan untuk airnya di setiap lembah, ketinggian, dataran, gunung, dan medan terjal, hingga ia membawanya keluar dari jarak dua belas mil ke Mekah. Total pengeluaran untuk itu diperkirakan seribu tujuh ratus ribu dinar, sebagaimana dicatat oleh al-Mas'udi {cite:muruj-al-dhahab, hlm. 671}."
