summary:
  ar: "مدينة أسسها إبراهيم بن الأغلب سنة 184هـ قرب القيروان، وكانت مقر الأغالبة قبل أن ينتقل الحكم إلى رقادة سنة 264هـ، ثم تراجعت إلى بلدة صغيرة. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  en: "A town Ibrahim ibn al-Aghlab founded near Kairouan in 184/800, when he was appointed amir of Ifriqiya. It was the Aghlabid residence until the rulers moved to Raqqada in 264/877; afterwards it sank to a township and disappeared in the mid-fifth/eleventh century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  ur: "ابراہیم بن الاغلب نے 184/800 میں قیروان کے قریب یہ شہر بسایا، جب انہیں افریقیہ کا امیر مقرر کیا گیا۔ 264/877 میں رقادہ منتقل ہونے تک یہ اغالبہ کی رہائش گاہ رہا، پھر بستی بن گیا اور پانچویں/گیارہویں صدی کے وسط میں ختم ہو گیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
