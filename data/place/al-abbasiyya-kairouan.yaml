summary:
  ar: "مدينة أسسها إبراهيم بن الأغلب سنة 184هـ قرب القيروان، وكانت مقر الأغالبة قبل أن ينتقل الحكم إلى رقادة سنة 264هـ، ثم تراجعت إلى بلدة صغيرة. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  en: "A town Ibrahim ibn al-Aghlab founded near Kairouan in 184/800, when he was appointed amir of Ifriqiya. It was the Aghlabid residence until the rulers moved to Raqqada in 264/877; afterwards it sank to a township and disappeared in the mid-fifth/eleventh century. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  ur: "ابراہیم بن الاغلب نے 184/800 میں قیروان کے قریب یہ شہر بسایا، جب انہیں افریقیہ کا امیر مقرر کیا گیا۔ 264/877 میں رقادہ منتقل ہونے تک یہ اغالبہ کی رہائش گاہ رہا، پھر بستی بن گیا اور پانچویں/گیارہویں صدی کے وسط میں ختم ہو گیا۔ {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  es: "Ciudad fundada por Ibrahim ibn al-Aghlab cerca de Kairouan en el año 184/800, cuando fue nombrado emir de Ifriqiya. Fue la residencia de los aglabíes hasta que los gobernantes se trasladaron a Raqqada en el año 264/877; posteriormente, se redujo a un pueblo y desapareció a mediados del siglo V/XI. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  fr: "Une ville fondée par Ibrahim ibn al-Aghlab près de Kairouan en 184/800, lorsqu'il fut nommé émir d'Ifriqiya. Elle servit de résidence aux Aghlabides jusqu'à leur installation à Raqqada en 264/877; elle devint ensuite un bourg et disparut au milieu du Ve/XIe siècle. {cite:encyclopaedia-of-islam-2 vol. 1 p. 43}"
  tr: "İbrahim bin el-Aglab tarafından 184 Hicri yılında, Kairouan yakınlarında kurulan bir şehir olup, 264 H yılında hüküm Rakkad'a taşınmadan önce Ağlabıların merkezi olmuştur, ardından küçük bir kasabaya çekilmiştir. {atıf:İslam Ansiklopedisi-2 cilt 1 s. 43}"
  id: "Sebuah kota yang didirikan oleh Ibrahim ibn al-Aghlab pada tahun 184 H dekat Kairouan, dan merupakan pusat kaum Aghlabid sebelum pemerintahan pindah ke Raqqad pada tahun 264 H, setelah itu mundur ke sebuah kota kecil. {cite:Encyclopaedia-of-Islam-2 vol. 1 hlm. 43}"
