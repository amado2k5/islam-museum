summary:
  ar: "جبل بربري يسكن حوله بنو هلال، وذكر المؤلف أنه سمي بذلك لأن جالوت هزم جيشه عنده ولجأ هو وخيله إليه {cite:nuzhat-al-mushtaq-2002 p. 121}."
  en: "A Berber mountain near the settlements of the Banu Hilal. The author says it takes its name from Goliath, whose army was defeated there and who fled to it with his horsemen {cite:nuzhat-al-mushtaq-2002 p. 121}."
  es: "Una montaña bereber cerca de los asentamientos de los Banu Hilal. El autor dice que toma su nombre de Goliat, cuyo ejército fue derrotado allí y que huyó a ella con sus jinetes {cite:nuzhat-al-mushtaq-2002 p. 121}."
  fr: "Une montagne berbère près des villages des Banu Hilal. L'auteur affirme qu'elle tire son nom de Goliath, dont l'armée y fut vaincue et qui s'y réfugia avec sa cavalerie {cite:nuzhat-al-mushtaq-2002 p. 121}."
  ur: "بنو ہلال کی بستیوں کے قریب ایک بربر پہاڑ۔ مصنف کا کہنا ہے کہ اس کا نام جالوت سے لیا گیا ہے، جس کی فوج کو وہاں شکست ہوئی اور وہ اپنے سواروں کے ساتھ اس کی طرف بھاگا۔ 121}۔"
