label:
  ar: خطط الفسطاط
  en: The Khitat (plots) of al-Fustat
  ur: خططِ فسطاط
summary:
  ar: الأحياء القبلية التي اختطها الفاتحون حول المسجد الجامع ودار عمرو بن العاص في الفسطاط، كما يصفها ابن عبد الحكم في باب الخطط من فتوح مصر، وهو الباب الذي قلّما ذكر فيه الأسانيد لأنه مما شاع بين أهل الفسطاط {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 intro p. ل}.
  en: The tribal quarters laid out by the conquerors around the congregational mosque and Amr ibn al-As's house in al-Fustat, as Ibn Abd al-Hakam describes them in the chapter on the plots in Futuh Misr, a chapter in which he seldom gives chains because it was common knowledge in al-Fustat {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 intro p. ل}.
  ur: وہ قبائلی محلے جو فاتحین نے فسطاط میں جامع مسجد اور عمرو بن العاص کے گھر کے گرد بسائے، جیسا کہ ابن عبد الحکم فتوح مصر کے باب الخطط میں بیان کرتے ہیں؛ اس باب میں وہ کم ہی اسناد دیتے ہیں کیونکہ یہ فسطاط میں عام معروف تھا {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 intro p. ل}۔
