  ar: "مدينة الفيل أحصن مدائن خوارزم وقال علي بن مجاهد هي سمرقند؛ فتحها أمية بن عبد الله بن خالد بن أسيد ثم نكثوا ورامها يزيد بن المهلب فلم يقدر عليها وفتحها قتيبة بن مسلم فقال كعب الأشثري أعطتك فيل بأيديها وحق لها."
  en: "Madinat al-Fil, strongest of Khwarizm's cities — Ali ibn Mujahid calls it Samarqand; opened by Umayya ibn Abdallah, breached, beyond Yazid ibn al-Muhallab's reach, and taken by Qutayba — 'Fil gave herself to you with her own hands'."
