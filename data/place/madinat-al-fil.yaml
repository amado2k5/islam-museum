summary:
  ar: "مدينة الفيل أحصن مدائن خوارزم وقال علي بن مجاهد هي سمرقند؛ فتحها أمية بن عبد الله بن خالد بن أسيد ثم نكثوا ورامها يزيد بن المهلب فلم يقدر عليها وفتحها قتيبة بن مسلم فقال كعب الأشثري أعطتك فيل بأيديها وحق لها."
  en: "Madinat al-Fil, strongest of Khwarizm's cities — Ali ibn Mujahid calls it Samarqand; opened by Umayya ibn Abdallah, breached, beyond Yazid ibn al-Muhallab's reach, and taken by Qutayba — 'Fil gave herself to you with her own hands'."
  es: "Madinat al-Fil, la más fuerte de las ciudades de Corasmia — Ali ibn Mujahid la llama Samarcanda; abierta por Umayya ibn Abdallah, conquistada, fuera del alcance de Yazid ibn al-Muhallab, y tomada por Qutayba — 'Fil se entregó a ti con sus propias manos'."
  fr: "Madinat al-Fil, la plus forte des villes du Khwarezm — Ali ibn Mujahid l'appelle Samarcande; ouverte par Umayya ibn Abdallah, percée, hors de portée de Yazid ibn al-Muhallab, et prise par Qutayba — 'Fil s'est donnée à vous de ses propres mains'."
  ur: "مدینۃ الفیل، خوارزم کے شہروں میں سب سے مضبوط - علی ابن مجاہد اسے سمرقند کہتے ہیں۔ امیہ بن عبداللہ نے کھولا، توڑا، یزید بن المحلب کی پہنچ سے باہر، اور قطیبہ نے لے لیا - 'فل نے خود کو اپنے ہاتھوں سے آپ کے حوالے کردیا'۔"
  tr: "Fil şehri, tahkimatlı olarak inşa edilmiş Harezm şehridir. Ali bin Mücahid bunun Semerkant olduğunu söyledi; burası Umeyye ibn Abdullah ibn Halid bin Asid tarafından fethedildi, sonra kuşatmalarını kırdılar ve Yezid bin el-Muhallab onu yendi ama aşamadı. Qutaybah ibn Muslim şehri ele geçirdi ve Ka'b al-Ashthari, 'Sana onun elinde bir fil ve ona bir hak vereceğim' dedi."
  id: "Kota gajah adalah kota benteng Khwarezm. Ali ibn Mujahid mengatakan itu adalah Samarkand; kota itu ditaklukkan oleh Umayyah ibn Abdullah ibn Khalid ibn Asid, kemudian mereka membongkar pengepungan dan Yazid ibn al-Muhallab mengalahkannya, tetapi ia tidak mampu mengatasinya. Qutaybah ibn Muslim merebutnya, dan Ka'b al-Ashthari berkata, 'Aku akan memberimu seekor gajah di tangannya dan hak untuknya.'"
