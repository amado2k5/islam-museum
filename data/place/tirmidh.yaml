summary:
  ar: "الترمذ مدينة على جيحون؛ حملت خاتون الصلح إلى سعيد بن عثمان بها فأقام عليها حتى فتحها صلحاً ثم أجار ملكها موسى بن عبد الله بن خازم فأخرجه عنها وغلب عليها وهو مخالف ثم صارت للولاة فانتقض أهلها ففتحها قتيبة بن مسلم."
  en: "al-Tirmidh on the Jayhun; the Khatun's sulh won from Sa'id ibn Uthman sitting on it, then its king's shelter of Musa ibn Abdallah ibn Khazim — who cast him out and held it in rebellion — then the governors', breached, and retaken by Qutayba ibn Muslim."
  ur: "دریائے جیحون کے کنارے شہر؛ بلاذری سعید بن عثمان، موسیٰ بن عبد اللہ بن خازم اور قتیبہ بن مسلم کے عہد میں اس کی صلح اور اقتدار کی تبدیلیوں کا ذکر کرتے ہیں۔ {cite:futuh-buldan-maarif-1407}"
