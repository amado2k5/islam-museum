summary:
  ar: "مدينة من مدن أرض بابير، كثيرة الدور عامرة القطر، متصلة البساتين والكروم، وموقعها جنوبي نهر دنو، ويذكر المؤلف أن بينها وبين بتصوة سبعين ميلا شرقا {cite:nuzhat-al-mushtaq-2002 p. 876}."
  en: "A city in the land of Bābīr, with many houses, settled country, gardens and vineyards, set south of the Danube; the author gives seventy miles east to Batsawa {cite:nuzhat-al-mushtaq-2002 p. 876}."
  es: "Una ciudad en la tierra de Bābīr, con muchas casas, campo poblado, jardines y viñedos, situada al sur del Danubio; el autor sitúa setenta millas al este de Batsawa {cite:nuzhat-al-mushtaq-2002 p. 876}."
  fr: "Une ville du pays de Bābīr, avec de nombreuses maisons, des terres habitées, des jardins et des vignobles, située au sud du Danube; l'auteur indique soixante-dix milles à l'est de Batsawa {cite:nuzhat-al-mushtaq-2002 p. 876}."
  ur: "بابیر کی سرزمین کا ایک شہر، جس میں بہت سے مکانات، آباد ملک، باغات اور انگور کے باغ ہیں، جو ڈینیوب کے جنوب میں واقع ہے۔ مصنف بطسوا کو ستر میل مشرق بتاتا ہے۔ 876}۔"
  tr: "Babir topraklarında, çok katlı ve tam çaplı, meyve bahçeleri ve bağlarla birbirine bağlı, Danu Nehri'nin güneyinde yer alan bir şehirdir. Yazar, şehrin yetmiş mil doğuda olduğunu belirtmektedir {cite:Nuzhat-al-mushtaq-2002, s. 876}."
  id: "Sebuah kota di tanah Babir, dengan banyak lantai dan diameter penuh, dihubungkan oleh kebun buah dan kebun anggur, terletak di selatan Sungai Danu. Penulis menyebutkan bahwa kota ini terletak tujuh puluh mil ke timur {cite:Nuzhat-al-mushtaq-2002, hlm. 876}."
