summary:
  ar: "عند البلاذري: من أخصب الجزائر وهي نحو من ستين ميلاً فيها الزيتون والكروم والثمار والمياه العذبة؛ فتحها جنادة بن أبي أمية سنة ثلاث وخمسين وأقام بها المسلمون سبع سنين في حصن حتى أمر يزيد بهدمه والقفل وكان مجاهد بن جبر مقيماً بها يقرئ القرآن."
  en: "In al-Baladhuri: among the most fertile islands, about sixty miles, with olives, vines, fruits and sweet waters; Janada ibn Abi Umayya opened it in year 53, the Muslims staying seven years in a fort until Yazid ordered its demolition and return — Mujahid ibn Jabr residing there teaching Qur'an."
  es: "En al-Baladhuri: entre las islas más fértiles, a unos sesenta kilómetros de distancia, con olivos, vides, frutas y aguas dulces; Janada ibn Abi Umayya la abrió en el año 53, los musulmanes permanecieron siete años en una fortaleza hasta que Yazid ordenó su demolición y regreso; Mujahid ibn Jabr residía allí enseñando el Corán."
  fr: "À al-Baladhuri: parmi les îles les plus fertiles, d'une soixantaine de kilomètres, avec des oliviers, des vignes, des fruits et des eaux douces; Janada ibn Abi Umayya l'ouvrit en l'an 53, les musulmans séjournant sept ans dans un fort jusqu'à ce que Yazid ordonne sa démolition et le retour — Mujahid ibn Jabr y résidant et enseignant le Coran."
  ur: "البلادوری میں: سب سے زیادہ زرخیز جزیروں میں سے، تقریباً ساٹھ میل، زیتون، بیلیں، پھل اور میٹھے پانی کے ساتھ؛ جنادہ ابن ابی امیہ نے اسے سنہ 53 میں کھولا، مسلمان سات سال ایک قلعے میں رہے یہاں تک کہ یزید نے اسے گرانے اور واپسی کا حکم دیا — مجاہد ابن جبر وہاں مقیم قرآن پڑھ رہے تھے۔"
  tr: "Al-Baladhuri'ye göre: Cezayir'in en verimli bölgelerinden biridir, yaklaşık altmış mil uzunluğunda zeytin, bağ, meyve ve tatlı su vardır; 53 Hile yılında Cunadah ibn Ebi Umeyye tarafından fethedilmiş ve Müslümanlar yedi yıl boyunca bir kalede kalmış, ta ki Yezid kalenin yıkılıp kilidi kaldırılmasını emredene kadar. Mücahit ibn Jabr orada Kur'an okuyordu."
  id: "Menurut Al-Baladhuri: Wilayah ini adalah salah satu wilayah paling subur di Aljazair, sekitar enam puluh mil dengan buah zaitun, kebun anggur, buah-buahan, dan air tawar; wilayah ini ditaklukkan oleh Junadah ibn Abi Umayyah pada tahun 53 H, dan umat Muslim tinggal di sana selama tujuh tahun di sebuah benteng sampai Yazid memerintahkan pembongkaran dan kunci benteng. Mujahid ibn Jabr tinggal di sana sambil membaca Al-Qur'an."
