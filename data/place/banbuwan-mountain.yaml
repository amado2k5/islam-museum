label: { ar: "جبل بنبوان", en: "Mount Banbuwan", es: "Monte Banbuwan", fr: "Mont Banbuwan", ur: "ماؤنٹ بنبوان", tr: "Benbuwan Dağı", id: "Gunung Benbuwan" }
summary:
  ar: "جبل شرقي مدينة نغيرا مع ميل إلى الجنوب، وذكر المؤلف أنه من أعلى جبال الأرض، أبيض التربة لا ينبت فيه إلا الشيح والغاسول {cite:nuzhat-al-mushtaq-2002 p. 106}."
  en: "A mountain east of Nughayra, tilting south. The author calls it one of the highest mountains on earth, bare and white-soiled, where only wormwood and saltwort grow {cite:nuzhat-al-mushtaq-2002 p. 106}."
  es: "Una montaña al este de Nughayra, inclinada hacia el sur. El autor la describe como una de las montañas más altas de la Tierra, árida y de suelo blanco, donde solo crecen ajenjo y salicornia {cite:nuzhat-al-mushtaq-2002 p. 106}."
  fr: "Une montagne à l'est de Nughayra, inclinée vers le sud. L'auteur la décrit comme l'une des plus hautes montagnes du monde, aride et recouverte d'un sol blanc, où ne poussent que l'absinthe et la salicorne {cite:nuzhat-al-mushtaq-2002 p. 106}."
  ur: "نغیرہ کے مشرق میں ایک پہاڑ جو جنوب کی طرف جھکا ہوا ہے۔ مصنف نے اسے زمین کے سب سے اونچے پہاڑوں میں سے ایک، ننگے اور سفید مٹی کے پہاڑوں میں سے ایک کہا ہے، جہاں صرف کیڑے کی لکڑی اور نمکین پودے ہی اگتے ہیں۔ 106}۔"
  tr: "Ngheira şehrinin doğusunda, güneye doğru eğimli bir dağdır. Yazar, buranın dünyanın en yüksek dağlarından biri olduğunu, toprak olarak beyaz, sadece pelin otu ve gasus yetiştirdiğini belirtmiştir {cite:Nuzhat-al-Mushtaq-2002, s. 106}."
  id: "Sebuah gunung di sebelah timur kota Ngheira dengan lereng ke selatan. Penulis menyebutkan bahwa ini adalah salah satu gunung tertinggi di dunia, berwarna putih, tempat hanya tumbuh wormwood dan gas {cite:Nuzhat-al-Mushtaq-2002, hlm. 106}."
