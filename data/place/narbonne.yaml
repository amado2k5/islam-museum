summary:
  ar: "أربونة عند ياقوت بلد في طرف الثغر من أرض الأندلس صار في زمانه بيد الإفرنج، ويقرأها المتحف ناربون في جنوب فرنسا {cite:mujam-al-buldan-sader-1995 1 p.140}."
  en: "Arbuna in Yaqut: a town at the edge of the frontier of al-Andalus, in Frankish hands in his day, which the museum reads as Narbonne in southern France {cite:mujam-al-buldan-sader-1995 1 p.140}."
  es: "Arbuna en Yaqut: una ciudad en el límite de la frontera de al-Ándalus, en manos francas en su época, que el museo interpreta como Narbona en el sur de Francia {cite:mujam-al-buldan-sader-1995 1 p.140}."
  fr: "Arbuna à Yaqut: une ville à la limite de la frontière d'al-Andalus, aux mains des Francs à son époque, que le musée décrit comme Narbonne dans le sud de la France {cite:mujam-al-buldan-sader-1995 1 p.140}."
  ur: "یاقوت میں اربونہ: الاندلس کی سرحد کے کنارے پر واقع ایک قصبہ، اس کے زمانے میں فرینکش ہاتھوں میں، جسے میوزیم جنوبی فرانس میں ناربون کے نام سے پڑھتا ہے۔"
  tr: "Yaqut'taki Arbonne, Endülüs topraklarında sınırın kenarında yer alan ve zamanında Frankların kontrolünde olan bir kasabadır ve güney Fransa'daki Narbonne Müzesi tarafından okunmaktadır {cite:mujam-al-buldan-sader-1995 1 s.140}."
  id: "Arbonne di Yaqut adalah sebuah kota di tepi perbatasan di tanah Andalusia yang pada masanya berada di bawah kendali bangsa Franka, dan dibaca oleh Museum Narbonne di Prancis selatan {cite:mujam-al-buldan-sader-1995 1 hlm.140}."
