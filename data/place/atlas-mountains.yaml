  ar: "جبال الأطلس"
  en: "Atlas Mountains"
summary:
  ar: "سلاسل الجبال الكبرى في شمال إفريقيا، في المغرب والجزائر وتونس، تكسر رتابة هضبة الصحراء وتتباين تكويناتها بين الأطلس الكبير والصغير والريف والتل. وقد عرفها اليونان، وكان الجغرافيون العرب يطلقون اسم الأطلس أحيانًا على سلاسل تُسمى «أدرار ن درن»، وهو اسم خاص بالأطلس الكبير المغربي وأطلس الصحراء الجزائري {cite:encyclopaedia-of-islam-2 vol. 1 p. 797}."
  en: "The mountains of North Africa, in Morocco, Algeria and Tunisia, which give variety to the monotonous Sahara platform. The Greeks knew the name. The Arab geographers often applied it to chains otherwise called Adrar n-Deren, a Berber term reserved in fact for the High Moroccan Atlas and the Saharan Atlas of Algeria; some extended the name much further. The High Atlas rises above 4,000 metres (Tubkal 4,165 m) {cite:encyclopaedia-of-islam-2 vol. 1 p. 797}."
