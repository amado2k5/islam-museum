  ar: "مدينة على الضفة الشرقية من معظم النيل، يذكر المؤلف أن الدروع الدلاصية المنسوبة إلى صناعتها عرفت بها. ويذكر أن البرابر وشرار العرب أفسدوا عمارتها فقل ساكنوها، وهذا قول المؤلف عن تاريخها. {cite:nuzhat-al-mushtaq-2002 p. 131}"
  en: "A town on the east bank of the main Nile, known for the dalasi armour attributed to its craft. The author says Berber and other raiding groups damaged its settlement, so fewer people remained there. {cite:nuzhat-al-mushtaq-2002 p. 131}"
