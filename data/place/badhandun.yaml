summary:
  ar: "موضع من أدنى الروم ببلاد الثغور، فيه عين باردة صافية، نزل بها المأمون فاشتهاها وأعجبته سمكة فيها فلما اصطيدت لم يذقها وأصابته رعدة، ومات بها سنة ثمان عشرة ومئتين ونقل إلى طرسوس فدفن بها {cite:tarikh-khulafa-minhaj-1434 p. 494}."
  en: "A Byzantine frontier spot with a cold clear spring; al-Ma'mun camped there, admired a silvery fish in the water, took a chill as it was caught and never tasted it — dying there in 218 and carried to Tarsus for burial {cite:tarikh-khulafa-minhaj-1434 p. 494}."
  es: "Un lugar fronterizo bizantino con un manantial frío y cristalino; al-Ma'mun acampó allí, admiró un pez plateado en el agua, sintió escalofríos al ser capturado y nunca lo probó; murió allí en el año 218 y fue llevado a Tarso para ser enterrado {cite:tarikh-khulafa-minhaj-1434 p. 494}."
  fr: "Un lieu frontalier byzantin avec une source froide et claire; al-Ma'mun y campa, admira un poisson argenté dans l'eau, eut froid lorsqu'il fut pêché et ne le goûta jamais — mourant là en 218 et transporté à Tarse pour y être enterré {cite:tarikh-khulafa-minhaj-1434 p. 494}."
  ur: "ایک بازنطینی سرحدی جگہ جس میں ٹھنڈا صاف چشمہ ہے۔ المامون نے وہاں ڈیرہ ڈالا، پانی میں ایک چاندی کی مچھلی کی تعریف کی، جب اسے پکڑا گیا تو اسے ٹھنڈا لگا اور اس نے کبھی اس کا ذائقہ نہیں چکھا - وہیں 218 میں مر گیا اور تدفین کے لیے ترسوس لے جایا گیا۔ 494}۔"
