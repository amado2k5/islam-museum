summary:
  ar: "الحصن المعروف بالحضر في رستاق أياجر من بلاد الموصل، كان للساطرون بن أسيطرون ملك السريانيين، ذكره الشعراء لعظم ملكه وحسن بنائه منهم أبو داود جارية بن حجاج الأيادي، ثم تملكه الضيزن بن جبهلة بن معاوية من تنوخ، فنزل عليه سابور الجنود فتحصن فيه شهراً لا يجد سبيلاً إلى فتحه حتى دلته النضيرة بنت الضيزن على مأخذه من نهر الثرثار فهدمه بعد أن قتل الضيزن ومن معه {cite:muruj-al-dhahab p. 552-554}."
  en: "The famed desert fortress Hatra in the Ayajir district of Mosul — seat of the Arab king al-Dayzan which Shapur I failed to take for a month until al-Nadira betrayed its water-ingress; poets sang its fall {cite:muruj-al-dhahab p. 552-554}."
