summary:
  ar: "مملكة البحرين، دولة جزرية ذات سيادة وملكية دستورية على الخليج، مستقلة في 14 أغسطس 1971 ومملكة منذ 14 فبراير 2002، عاصمتها المنامة، لغتها الرسمية العربية."
  en: "The Kingdom of Bahrain, a sovereign island country and constitutional monarchy in the Gulf, independent on 14 August 1971 and a kingdom since 14 February 2002, with Manama as its capital and Arabic as its official language."
  ur: "مملکت بحرین، خلیج میں ایک خودمختار جزیرہ ملک اور آئینی بادشاہت، 14 اگست 1971 کو آزاد اور 14 فروری 2002 سے مملکت، دارالحکومت منامہ، سرکاری زبان عربی۔"
  fr: "Le Royaume de Bahreïn, pays insulaire souverain et monarchie constitutionnelle du Golfe, indépendant le 14 août 1971 et royaume depuis le 14 février 2002, avec Manama pour capitale et l'arabe pour langue officielle."
  es: "El Reino de Baréin, país insular soberano y monarquía constitucional del Golfo, independiente el 14 de agosto de 1971 y reino desde el 14 de febrero de 2002, con Manama como capital y el árabe como lengua oficial."
  tr: "Bahreyn Krallığı, Körfez üzerinde egemenlik ve anayasal monarşiye sahip bir ada devletidir; 14 Ağustos 1971'de bağımsızdır, 14 Şubat 2002'den beri başkenti Manama'da olan ve resmi dili Arapça olan bir krallıktır."
  id: "Kerajaan Bahrain adalah negara pulau dengan kedaulatan dan monarki konstitusional atas Teluk, merdeka pada 14 Agustus 1971, dan menjadi kerajaan sejak 14 Februari 2002, dengan ibu kota di Manama, dengan bahasa Arab sebagai bahasa resmi."
