summary:
  ar: "حصن في إقليم نيمار بولاية مدهيا براديش الهندية، على ارتفاع نحو 2200 قدم، يسيطر على الممر الوحيد عبر سلسلة جبال ناربادا وتابتي؛ كان معقلًا لفرع تاك من الراجبوت الشوهان من القرن الثالث الهجري ⁦(التاسع الميلادي)⁩، وفتحه خلجي سنة 695هـ ⁦(1295-1296م)⁩، واستولى عليه الفاروقيون سنة 802هـ ⁦(1400م)⁩ وجعلوه معقل سلاطين خاندش {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
  en: "A fortress in the Nimar district of Madhya Pradesh, about 2,200 feet above sea level, commanding the only route through the range between the Narbada and the Tapti. A stronghold of the Tak branch of the Chauhan Rajputs from the third/ninth century, it was stormed by Khalji's forces in 695 AH (1295-1296) and taken permanently by the Faruqi sultans of Khandesh about 802 AH (1400) {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
  es: "Una fortaleza en el distrito de Nimar de Madhya Pradesh, a unos 2200 pies sobre el nivel del mar, que domina la única ruta a través de la cordillera entre Narbada y Tapti. Un bastión de la rama Tak de los rajputs Chauhan desde el siglo III/IX, fue asaltada por las fuerzas de Khalji en el año 695 AH (1295-1296) y tomada definitivamente por los sultanes Faruqi de Khandesh alrededor del año 802 AH (1400) {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
  fr: "Une forteresse du district de Nimar, dans le Madhya Pradesh, culminant à environ 670 mètres d'altitude, contrôlant la seule voie de passage à travers la chaîne entre la Narbada et la Tapti. Bastion de la branche Tak des Rajputs Chauhan depuis le IIIe/IXe siècle, elle fut prise d'assaut par les troupes de Khalji en 695 AH (1295-1296) et conquise définitivement par les sultans Faruqi de Khandesh vers 802 AH (1400) {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
  ur: "مدھیہ پردیش کے نیمار ضلع میں ایک قلعہ، جو سطح سمندر سے تقریباً 2,200 فٹ بلند ہے، جو نربدا اور تپتی کے درمیان واحد راستہ ہے۔ تیسری / نویں صدی سے چوہان راجپوتوں کی ٹاک شاخ کا ایک مضبوط گڑھ، اس پر خلجی کی فوجوں نے 695 ہجری (1295-1296) میں حملہ کیا اور 802 ہجری (1400) کے قریب خاندیش کے فاروقی سلاطین نے مستقل طور پر قبضہ کر لیا۔ 1 ص۔ 759}۔"
  tr: "Hindistan'ın Madhya Pradesh eyaletindeki Nimar bölgesinde, yaklaşık 2200 feet yükseklikte bulunan bir kale, Narpada ve Tapiti dağ sıralarından geçen tek geçişe hakimdir; 3. yüzyıldan itibaren Shauhan Rajput hanedanının Tak kolunun kalesi olmuş, 695 Hicri (1295-1296) yılında Haliji tarafından fethedilmiş ve 802 Hicri (1400 M.S.) yılında Faruklar tarafından ele geçirilmiş ve Khandeş sultanlarının kalesi olmuştur {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 759}."
  id: "Benteng ini terletak di wilayah Nimar, Madhya Pradesh, India, pada ketinggian sekitar 2200 kaki, mendominasi satu-satunya jalur melalui pegunungan Narpada dan Tapiti; benteng ini merupakan benteng cabang Tak dari dinasti Shauhan Rajput dari abad ke-3 H (abad ke-9 M), ditaklukkan oleh Khaliji pada tahun 695 H (1295-1296 M), dan direbut oleh Farooq pada tahun 802 H (1400 M) dan menjadikannya benteng para sultan Khandesh {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 759}."
