label:
  ar: "آسيركره"
  en: "Asirgarh"
summary:
  ar: "حصن في إقليم نيمار بولاية مدهيا براديش الهندية، على ارتفاع نحو 2200 قدم، يسيطر على الممر الوحيد عبر سلسلة جبال ناربادا وتابتي؛ كان معقلًا لفرع تاك من الراجبوت الشوهان من القرن الثالث الهجري (التاسع الميلادي)، وفتحه خلجي سنة 695هـ (1295-1296م)، واستولى عليه الفاروقيون سنة 802هـ (1400م) وجعلوه معقل سلاطين خاندش {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
  en: "A fortress in the Nimar district of Madhya Pradesh, about 2,200 feet above sea level, commanding the only route through the range between the Narbada and the Tapti. A stronghold of the Tak branch of the Chauhan Rajputs from the third/ninth century, it was stormed by Khalji's forces in 695 AH (1295-1296) and taken permanently by the Faruqi sultans of Khandesh about 802 AH (1400) {cite:encyclopaedia-of-islam-2 vol. 1 p. 759}."
