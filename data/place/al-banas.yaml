summary:
  ar: "قرية جامعة آهلة بالناس على الساحل في بلاد الزنج، وهي آخر بلاد الزنج، وفيها طبل كبير يُضرب فيُسمع من مسافة بعيدة، وتبعد عن منبسة مسيرة ستة أيام في البر {cite:nuzhat-al-mushtaq-2002 p. 60}."
  en: "A populous village on the Zanj coast and the last of their lands. It has a large drum whose sound carries a long way, and it lies six days by land from Manbasa {cite:nuzhat-al-mushtaq-2002 p. 60}."
  es: "Un poblado en la costa de Zanj y el último de sus territorios. Posee un gran tambor cuyo sonido se escucha a gran distancia, y se encuentra a seis días por tierra de Manbasa {cite:nuzhat-al-mushtaq-2002 p. 60}."
  fr: "Un village peuplé sur la côte du Zanj, dernier bastion de leurs terres. Il possède un grand tambour dont le son porte loin, et se situe à six jours de route de Manbasa {cite:nuzhat-al-mushtaq-2002 p. 60}."
  ur: "زنج کے ساحل پر ایک آبادی والا گاؤں اور ان کی زمینوں میں سے آخری۔ اس میں ایک بڑا ڈھول ہے جس کی آواز لمبا سفر کرتی ہے، اور یہ منبسہ سے چھ دن تک زمینی راستے پر ہے۔ 60}۔"
  tr: "Zanj topraklarında, kıyıda iyi yerleşim gören bir köy, Zanj'ın son toprakıdır ve uzaktan duyulabilir büyük bir davulu vardır, Manbasa'dan kara yoluyla altı günlük bir yolculuktur {cite:Nuzhat-al-Mushtaq-2002, s. 60}."
  id: "Sebuah desa yang padat penduduk di pesisir di tanah Zanj, yang merupakan tanah terakhir Zanj, memiliki sebuah drum besar yang dipukul dan terdengar dari kejauhan, serta perjalanan darat dari Manbasa selama enam hari {cite:Nuzhat-al-Mushtaq-2002, hlm. 60}."
