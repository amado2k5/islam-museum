summary:
  ar: "مدينة على ساحل أرض حضرموت، جبالها تنبت شجر اللبان، ومنها يُتجهّز به إلى البلاد، وأهلها خليط من قبائل اليمن وغيرها، وتبعد عن حاسك أربعة أيام في البر {cite:nuzhat-al-mushtaq-2002 p. 56}."
  en: "A town on the Hadramawt coast whose hills grow frankincense, which is shipped out from there. Its people are a mixture of Yemeni and other tribes, four days by land from Hasik {cite:nuzhat-al-mushtaq-2002 p. 56}."
  es: "Un pueblo en la costa de Hadramawt cuyas colinas producen incienso, que se exporta desde allí. Sus habitantes son una mezcla de yemeníes y otras tribus, a cuatro días por tierra de Hasik {cite:nuzhat-al-mushtaq-2002 p. 56}."
  fr: "Une ville de la côte d'Hadramaout, dont les collines produisent de l'encens qui est ensuite exporté. Ses habitants sont un mélange de Yéménites et d'autres tribus. Elle se trouve à quatre jours de route de Hasik {cite:nuzhat-al-mushtaq-2002 p. 56}."
  ur: "حدراموت کے ساحل پر ایک قصبہ جس کی پہاڑیوں پر لوبان اگتا ہے، جسے وہاں سے بھیج دیا جاتا ہے۔ اس کے لوگ یمنی اور دیگر قبائل کا مرکب ہیں، حاسک سے زمین کے ذریعے چار دن کے فاصلے پر۔ 56}۔"
