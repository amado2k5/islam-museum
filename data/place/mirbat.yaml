summary:
  ar: "مدينة على ساحل أرض حضرموت، جبالها تنبت شجر اللبان، ومنها يُتجهّز به إلى البلاد، وأهلها خليط من قبائل اليمن وغيرها، وتبعد عن حاسك أربعة أيام في البر {cite:nuzhat-al-mushtaq-2002 p. 56}."
  en: "A town on the Hadramawt coast whose hills grow frankincense, which is shipped out from there. Its people are a mixture of Yemeni and other tribes, four days by land from Hasik {cite:nuzhat-al-mushtaq-2002 p. 56}."
