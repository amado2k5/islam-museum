summary:
  ar: "جبل في المدينة؛ ابتنى كعب بن مالك خيمة في ظهره أثناء المقاطعة، وصعد عليه الصارخ الذي بشره بقبول التوبة."
  en: A mountain in Medina; Ka'b ibn Malik pitched a tent on its back during the boycott, and the caller who brought him the news of the accepted repentance climbed it.
  es: "Una montaña en Medina; Ka'b ibn Malik instaló una tienda de campaña en su ladera durante el boicot, y el mensajero que le trajo la noticia del arrepentimiento aceptado la escaló."
  fr: "Une montagne à Médine; Ka'b ibn Malik y dressa une tente pendant le boycott, et celui qui lui apporta la nouvelle du repentir accepté l'escalada."
  ur: "مدینہ میں ایک پہاڑ؛ کعب بن مالک نے بائیکاٹ کے دوران اس کی پشت پر ایک خیمہ لگایا اور جو پکارنے والا اسے قبول توبہ کی خبر پہنچاتا تھا وہ اس پر چڑھ گیا۔"
  tr: "Medine'de bir dağ; Ka'b ibn Malik kesinti sırasında sırtına bir çadır kurdu ve ona seslenen kişi, tövbesini kabul ettiğini haberlenerek çadıra tırmandı."
  id: "Sebuah gunung di Madinah; Ka'b ibn Malik membangun tenda di punggungnya saat gangguan itu, dan orang yang memanggilnya mendakinya dengan kabar penerimaannya akan bertobat."
