summary:
  ar: "سندان ناحية على ساحل الهند؛ فتحها الفضل بن ماهان مولى بني سامة وغلب عليها واتخذ بها مسجداً جامعاً يدعو فيه للخليفة ثم غلب عليها أخوه ماهان بن الفضل، فقتله الهنود الذين كانوا معه وصلبوه، ثم غلبت الهند عليها بعد."
  en: "Sindan on India's coast; al-Fadl ibn Mahan's conquest and Muslim seat with its caliph-praising jami' — his brother Mahan ibn al-Fadl seized it, was killed by the Indians who had sided with him and crucified, and Hind reconquered it."
  es: "Sindan, en la costa de la India; conquista de al-Fadl ibn Mahan y sede musulmana con su jami' que alababa al califa; su hermano Mahan ibn al-Fadl la tomó, fue asesinado por los indios que se habían aliado con él y crucificado, y Hind la reconquistó."
  fr: "Le Sindan, sur la côte indienne; la conquête d'al-Fadl ibn Mahan et son siège musulman avec son jami' louant le calife — son frère Mahan ibn al-Fadl s'en empara, fut tué et crucifié par les Indiens qui avaient pris son parti, et l'Inde le reconquit."
  ur: "ہندوستان کے ساحل پر سنڈان؛ الفضل بن مہان کی فتح اور اس کے خلیفہ کی تعریف کرنے والے جامع کے ساتھ مسلمانوں کی نشست - اس کے بھائی ماہان بن الفضل نے اس پر قبضہ کر لیا، ان ہندوستانیوں کے ہاتھوں مارا گیا جنہوں نے اس کا ساتھ دیا تھا اور صلیب پر چڑھایا گیا تھا، اور ہند نے اسے دوبارہ فتح کر لیا تھا۔"
