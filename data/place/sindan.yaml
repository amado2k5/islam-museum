  ar: "سندان ناحية على ساحل الهند؛ فتحها الفضل بن ماهان مولى بني سامة وغلب عليها واتخذ بها مسجداً جامعاً يدعو فيه للخليفة ثم غلب عليها أخوه ماهان بن الفضل، فقتله الهنود الذين كانوا معه وصلبوه، ثم غلبت الهند عليها بعد."
  en: "Sindan on India's coast; al-Fadl ibn Mahan's conquest and Muslim seat with its caliph-praising jami' — his brother Mahan ibn al-Fadl seized it, was killed by the Indians who had sided with him and crucified, and Hind reconquered it."
