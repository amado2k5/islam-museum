summary:
  ar: "بلد حسن في رأس جبل من أمنع قلل الجزيرة، فيه زكاة وزراعات فاخرة نامية، وقريب منه الوادي الملح، وتبعد عن كركنت مائة ميل تقريباً. {cite:nuzhat-al-mushtaq-2002 p. 612}"
  en: "A fine town on the top of a mountain, among the strongest heights of the island, with good crops and farming; near the salt river, about a hundred miles from Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 612}"
  es: "Un hermoso pueblo en la cima de una montaña, entre las cumbres más altas de la isla, con buenas cosechas y agricultura; cerca del río Salado, a unas cien millas de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 612}"
  fr: "Une belle ville perchée au sommet d'une montagne, parmi les plus hauts sommets de l'île, où l'agriculture est florissante; près de la rivière salée, à environ cent milles de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 612}"
  ur: "ایک پہاڑ کی چوٹی پر ایک عمدہ شہر، جزیرے کی مضبوط ترین اونچائیوں میں، اچھی فصلوں اور کاشتکاری کے ساتھ؛ دریائے نمک کے قریب، کرکانت سے تقریباً سو میل دور۔ {حوالہ: نزہت المشتاق-2002 ص۔ 612}"
