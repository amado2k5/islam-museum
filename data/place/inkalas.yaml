  ar: "من أكبر مدن كوار مساحة وأكثرها تجارة، وفيها معادن شب خالص، ويذكر المؤلف أن أهلها يتجولون شرقا حتى مصر وغربا حتى وارقلان وأرض المغرب الأقصى {cite:nuzhat-al-mushtaq-2002 p. 117}، {cite:nuzhat-al-mushtaq-2002 p. 118}."
