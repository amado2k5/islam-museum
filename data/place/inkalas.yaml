summary:
  ar: "من أكبر مدن كوار مساحة وأكثرها تجارة، وفيها معادن شب خالص، ويذكر المؤلف أن أهلها يتجولون شرقا حتى مصر وغربا حتى وارقلان وأرض المغرب الأقصى {cite:nuzhat-al-mushtaq-2002 p. 117}، {cite:nuzhat-al-mushtaq-2002 p. 118}."
  en: "One of the largest and busiest cities of Kawar, with pure alum mines. The author says its people travel east as far as Egypt and west to Wargla and the far Maghreb {cite:nuzhat-al-mushtaq-2002 p. 117}, {cite:nuzhat-al-mushtaq-2002 p. 118}."
  es: "Una de las ciudades más grandes y concurridas de Kawar, con minas de alumbre puro. El autor dice que sus habitantes viajan hacia el este hasta Egipto y hacia el oeste hasta Wargla y el lejano Magreb {cite:nuzhat-al-mushtaq-2002 p. 117}, {cite:nuzhat-al-mushtaq-2002 p. 118}."
