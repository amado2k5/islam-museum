summary:
  en: Spanish city, capital of the Umayyad emirate and then caliphate of al-Andalus, with its Great Mosque.
  ar: 'مدينة إسبانية، عاصمة الإمارة ثم الخلافة الأموية في الأندلس، وفيها المسجد الجامع. قال الحجاري في المسهب: كانت قرطبة
    في الدولة المروانية قبّة الإسلام ومجتمع أعلام الأنام بها استقر سرير الخلافة المروانية وإليها كانت الرحلة في الرواية إذ
    كانت مركز الكرماء ومعدن العلماء وهي من الأندلس بمنزلة الرأس من الجسد، وبها الجامع المشهور والقنطرة المعروفة بالجسر الذي
    قال ابن حيان إنه بُني على أمر عمر بن عبد العزيز وقام على النهر الأعظم؛ وقيل فيها: بأربع فاقت الأمصار قرطبة منهن قنطرة
    الوادي وجامعها هاتان ثنتان والزهراء ثالثة والعلم أعظم شيء وهو رابعها {cite:nafh-tib-maqqari p. 189-190}، وعند ابن سعيد
    في المغرب أن سلاطين الأندلس تقلبوا في ثلاثة أقطاب أداروا فيها خلافتهم: قرطبة والزهراء والزاهرة، وأن العمارة اتصلت في مبانيها
    بحيث كان يُمشى فيها لضوء السرج المتصلة عشرة أميال حسبما ذكر الشقندي في رسالته، وأن قرطبة أعظم ممالك الأندلس علماً وأكثرها
    فضلاً لاتصال الحضارة العظيمة والدولة المتوارثة فيها {cite:nafh-tib-maqqari p. 491-492}، وذكر ابن بشكوال أن أبواب قرطبة
    سبعة: باب القنطرة إلى جهة القبلة يعرف بباب الوادي وبباب الجزيرة الخضراء وهو على النهر وباب الحديد يعرف بباب سرقسطة وباب
    ابن عبد الجبار وهو باب طليطلة وباب رومية وفيه تجتمع الثلاثة الرصف من جزيرة قادس إلى قرمونة إلى قرطبة إلى سرقسطة إلى طراكونة
    إلى أربونة، وباب طكبيرة وهو باب ليون وباب عامر القرشي وقدامه مقبرته وباب الجوز يعرف بباب بطليوس وباب العطارين وهو باب
    إشبيلية، وأن أرباض قرطبة عند انتهائها في التوسيع والعمارة واحد وعشرون ربضاً منها القبلية بضواحي النهر ربض شقندة وربض منية
    عجب {cite:nafh-tib-maqqari p. 501-502} وعند البلاذري أمر موسى بن نصير طارق بن زياد ألا يجاوزها في غزوته وسار موسى إليها
    فترضاه طارق عندها فرضي عنه، عند البلاذري.'
  es: "Ciudad española, capital del emirato omeya y posteriormente del califato de al-Ándalus, con su Gran Mezquita."
  fr: "Ville espagnole, capitale de l'émirat omeyyade puis du califat d'al-Andalus, avec sa Grande Mosquée."
  ur: "ہسپانوی شہر، اموی امارت کا دارالحکومت اور اس کے بعد الاندلس کی خلافت، اس کی عظیم مسجد کے ساتھ۔"
  tr: "Emirliğin başkenti ve ardından Endülüs'teki Emevi Halifeliği'nin başkenti olan İspanyol şehri ve Büyük Camii'ni barındırır. El-Hiccari El-Müşab'ta şöyle demiştir: Mervani devletindeki Kordoba, İslam'ın kubbesi ve insanlığın seçkinlerinin toplandığı yerdi. Merwani Halifeliği'nin tahtı burada yerleşti ve oraya yapılan yolculuk başlangıçta cömertlik merkezi ve alimlerin kaynağıydı. Endülüs'ten gelmiş, bedenin başı gibi, ayrıca ünlü cami ve köprü olarak bilinen köprüye ev sahipliği yapmaktadır; İbn Hayyan, Ömer bin Abdülaziz'in emriyle inşa edildiğini ve Büyük Nehir üzerinde yer aldığını söylemiştir; orada şöyle denir: Dört şehir farkla Kordoba, vadi köprüsü ve iki camisi dahil olmak üzere Córdoba'yı geride bıraktı; bunlardan ikisi ikidir, üçüncü, bilgi en büyük ve dördüncüsüdür {cite:nafh-tib-maqqari s. 189-190}. Fas'taki İbn Sa'id'e göre, el-Endülüs sultanları halifeliklerini yönettiği üç kutba ayrıldılar: Cordoba, Zehra ve al-Zahira. Mimari, binalarında birbirine bağlanmıştı; böylece kesintisiz eyerin ışığında on mil yürümek mümkündü; bu, al-Shaqindi'nin mektubunda belirttiği gibi. Cordoba, büyük uygarlık ile miras kalan devletin bağlantısı nedeniyle el-Endülüs'ün en bilgili ve seçkin krallığıdır {atıf: nafh-tib-maqqari s. 491-492} ve İbn Başkuwal, Kordoba'nın yedi kapısından bahsetmiştir: kıbleye bakan köprü kapısı, Bab al-Wadi olarak bilinir; nehir üzerindeki Bab al-Jazeera; Bab al-Hadid, Bab Zaragoza olarak bilinir; Bab ibn Abd al-Jabbar (Toledo'nun kapısı; ve üçünün birleştiği yer olan Bab Rumiyya, Cádiz adasından Karamouna'ya, Córdoba'ya, Zaragoza'ya, Taracona'ya, Arbonna'ya; Bab Takira, yani Bab León; türbesi önünde bulunan Bab Amer al-Qurashi; Bab al-Joz, Bab Badajūs olarak bilinir; ve Bab al-Attarin, yani bir kapı. Sevilla ve Kordoba'nın mahalleleri, genişletme ve inşaat tamamlandığında, nehrin kenarındaki kabile mahallesi de dahil olmak üzere yirmi bir mahalleden oluşuyordu: Şaqenda banliyösü ve Minya Ajab banliyösü {cite:nafh-tib-maqqari s. 501-502}. al-Baladhuri'ye göre, Musa ibn Nusair, Tariq ibn Ziyad'a seferinde bu bölgeyi geçmemesini emretti, Musa oraya yürüdü, Tariq kabul etti ve ardından el-Baladhuri tarafından atandı."
  id: "Sebuah kota Spanyol, ibu kota emirat dan kemudian Kekhalifahan Umayyah di Andalusia, dan di sini terdapat Masjid Agung. Al-Hijjari berkata dalam Al-Mushab: Cordoba di negara Marwanid adalah kubah Islam dan pertemuan para tokoh kehormatan umat manusia. Takhta Khalifah Marwanid menetap di sana, dan perjalanan ke sana awalnya menjadi pusat kemurahan hati dan sumber para ulama. Kota ini berasal dari Andalusia, seperti kepala tubuh, dan juga menjadi rumah bagi masjid terkenal serta jembatan yang dikenal sebagai jembatan, yang menurut Ibn Hayyan dibangun atas perintah Umar ibn Abd al-Aziz dan berdiri di atas Sungai Besar; dikatakan di sana: Dengan empat kota, Cordoba melampaui Córdoba, termasuk jembatan lembah dan dua masjidnya, dua di antaranya dua, dan Al-Zahra adalah yang ketiga, dan pengetahuan adalah yang terbesar dan keempat {cite:nafh-tib-maqqari hlm. 189-190}. Menurut Ibn Sa'id di Maroko, para sultan al-Andalus berpindah ke tiga kutub di mana mereka memerintah kekhalifahan mereka: Cordoba, Zahra, dan al-Zahira. Arsitekturnya terhubung dalam bangunannya sehingga seseorang dapat berjalan sepuluh mil dengan cahaya pelana yang berkesinambungan, seperti yang disebutkan oleh al-Shaqindi dalam suratnya. Cordoba adalah kerajaan al-Andalus yang paling berpengetahuan dan terhormat, karena hubungan antara peradaban besar dan negara warisan {cite: nafh-tib-maqqari hlm. 491-492}, dan Ibn Bashkuwal menyebutkan bahwa gerbang Cordoba ada tujuh: gerbang jembatan yang menghadap qibla, dikenal sebagai Bab al-Wadi; Bab al-Jazeera, yang berada di tepi sungai; Bab al-Hadid, dikenal sebagai Bab Zaragoza; Bab Ibn Abd al-Jabbar, yang merupakan gerbang Toledo; dan Bab Rumiyya, tempat ketiganya bertemu, dari pulau Cádiz ke Qaramouna, ke Córdoba, ke Zaragoza, ke Taracona, ke Arbonna; Bab Takira, yang merupakan Bab León; Bab Amer al-Qurashi, dengan makamnya di depan; Bab al-Joz, dikenal sebagai Bab Badajūs; dan Bab al-Attarin, yang merupakan gerbang. Seville, dan bahwa kawasan Cordoba, ketika selesai diperluas dan dibangun, terdiri dari dua puluh satu perempat, termasuk kawasan suku di pinggiran sungai: pinggiran Shaqenda dan pinggiran Minya Ajab {cite:nafh-tib-maqqari hlm. 501-502}. Menurut al-Baladhuri, Musa ibn Nusayr memerintahkan Tariq ibn Ziyad untuk tidak menyeberanginya dalam kampanyenya, dan Musa berbaris ke sana, dan Tariq menerimanya, lalu ia diangkat oleh al-Baladhuri."
