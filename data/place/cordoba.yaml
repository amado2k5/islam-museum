summary:
  en: "Spanish city, capital of the Umayyad emirate and then caliphate of al-Andalus, with its Great Mosque."
  ar: "مدينة إسبانية، عاصمة الإمارة ثم الخلافة الأموية في الأندلس، وفيها المسجد الجامع.، قال الحجاري في المسهب: كانت قرطبة في الدولة المروانية قبّة الإسلام ومجتمع أعلام الأنام بها استقر سرير الخلافة المروانية وإليها كانت الرحلة في الرواية إذ كانت مركز الكرماء ومعدن العلماء وهي من الأندلس بمنزلة الرأس من الجسد، وبها الجامع المشهور والقنطرة المعروفة بالجسر الذي قال ابن حيان إنه بُني على أمر عمر بن عبد العزيز وقام على النهر الأعظم؛ وقيل فيها: بأربع فاقت الأمصار قرطبة منهن قنطرة الوادي وجامعها هاتان ثنتان والزهراء ثالثة والعلم أعظم شيء وهو رابعها {cite:nafh-tib-maqqari p. 189-190}، وعند ابن سعيد في المغرب أن سلاطين الأندلس تقلبوا في ثلاثة أقطاب أداروا فيها خلافتهم: قرطبة والزهراء والزاهرة، وأن العمارة اتصلت في مبانيها بحيث كان يُمشى فيها لضوء السرج المتصلة عشرة أميال حسبما ذكر الشقندي في رسالته، وأن قرطبة أعظم ممالك الأندلس علماً وأكثرها فضلاً لاتصال الحضارة العظيمة والدولة المتوارثة فيها {cite:nafh-tib-maqqari p. 491-492}"
