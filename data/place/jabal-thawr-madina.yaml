label: { ar: "جبل ثور بالمدينة", en: "Jabal Thawr of Medina", es: "Jabal Thawr de Medina", fr: "Jabal Thawr de Médine", ur: "مدینہ کا جبل ثور", tr: "Medine'deki Thawr Dağı", id: "Gunung Thawr di Madinah" }
summary:
  ar: "جبل صغير بأرض المدينة خلاف أحد، ذُكر في روايات تحريم المدينة «ما بين عير إلى ثور حرام» حداً شمالياً للحرم؛ خفي على بعض المحدثين حتى قال مصعب الزبيري «لا يُعرف بالمدينة عير ولا ثور» وذهب أبو عبيد القاسم بن سلام والحازمي إلى أن الأصل «من عير إلى أحد»، بينما رأى آخرون أن الغموض في الاسم لا يوهّم الرواة {cite:samhudi-wafa-al-wafa p. 105-106}. يغاير جبل ثور بمكة."
  en: "A small mountain in Medina near Uhud, named in the haram hadith 'between 'Ayr and Thawr is inviolable' as the northern limit; it was obscure enough that Mus'ab al-Zubayri declared 'Medina knows no 'Ayr and no Thawr', and Abu 'Ubayd al-Qasim ibn Sallam and al-Hazimi held the original reading to be 'from 'Ayr to Uhud', while others argued an unknown name does not impugn the transmitters {cite:samhudi-wafa-al-wafa p. 105-106}. Distinct from Mecca's Jabal Thawr."
  es: "Una pequeña montaña en Medina cerca de Uhud, nombrada en el hadiz haram \"entre 'Ayr y Thawr es inviolable\" como el límite norte; era tan oscura que Mus'ab al-Zubayri declaró \"Medina no conoce ni 'Ayr ni Thawr\", y Abu 'Ubayd al-Qasim ibn Sallam y al-Hazimi sostuvieron que la lectura original era \"desde 'Ayr hasta Uhud\", mientras que otros argumentaron que un nombre desconocido no impugna a los transmisores {cite:samhudi-wafa-al-wafa p. 105-106}. Distinta de Jabal Thawr de La Meca."
  fr: "Une petite montagne à Médine, près d'Uhud, est mentionnée dans le hadith haram « entre Ayr et Thawr est inviolable » comme limite nord. Son emplacement était si obscur que Mus'ab al-Zubayri déclara: « Médine ne connaît ni Ayr ni Thawr », et Abu 'Ubayd al-Qasim ibn Sallam et al-Hazimi considéraient que la lecture originale était « d'Ayr à Uhud », tandis que d'autres soutenaient qu'un nom inconnu n'incriminait pas les transmetteurs (voir Samhudi-Wafa-Al-Wafa, p. 105-106). À ne pas confondre avec le Jabal Thawr de La Mecque."
  ur: "احد کے قریب مدینہ میں ایک چھوٹا سا پہاڑ جس کا نام حرام حدیث میں 'عیر اور ثور کے درمیان ناقابل تسخیر ہے' شمالی حد کے طور پر؛ یہ بات کافی مبہم تھی کہ مصعب الزبیری نے اعلان کیا کہ 'مدینہ کوئی 'عیر اور کوئی ثور نہیں جانتا'، اور ابو عبید القاسم ابن سلام اور الہیثمی نے اصل قراءت کو 'عیر سے احد تک' قرار دیا، جب کہ دوسروں نے استدلال کیا کہ ایک نامعلوم نام ٹرانسمیٹر کو غلط نہیں سمجھتا ہے 105-106}۔ مکہ کے جبل ثور سے ممتاز۔"
  tr: "Medine diyarında, Uhud'dan farklı olarak küçük bir dağ, rivayetlerde Medine'nin \"'Ir' ile 'Thawr arasında' kutsal alanın kuzey sınırı olarak yasaklandığını belirtir; bazı hadis âlimlerinden gizlenmiştir; ta ki Mus'ab al-Zubeyri 'Medine'de ne deve ne de öküz bilinmez' denene kadar. Ebu Ubeyd el-Kasim bin Salam ve el-Hazmi, orijinalinin 'Ayr'dan Uhud'a' ait olduğunu savunurken, diğerleri isimdeki belirsizliğin rivayetçileri yanıltmadığını savunur. {atıf:samhudi-wafa-al-wafa, s. 105-106}. Mekke'deki Tevir Dağı'ndan farklıdır."
  id: "Sebuah gunung kecil di tanah Madinah, berbeda dari Uhud, disebutkan dalam riwayat yang melarang Madinah, \"antara 'Ir' dan 'Thawr,\" sebagai batas utara tempat suci; gunung ini disembunyikan dari beberapa ulama hadis sampai Mus'ab al-Zubayri berkata, 'Tidak ada unta atau sapi yang diketahui di Madinah.' Abu Ubaid al-Qasim ibn Salam dan al-Hazmi berpendapat bahwa aslinya adalah 'dari 'Ayr ke Uhud,' sementara yang lain percaya bahwa ambiguitas dalam nama tidak menipu para narator. {cite:samhudi-wafa-al-wafa, hlm. 105-106}. Itu berbeda dengan Gunung Thawr di Mekah."
