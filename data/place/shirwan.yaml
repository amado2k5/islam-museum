summary:
  ar: "شروان من بلاد القوقاز ما وراء أران؛ وطىء قائد قباذ ما بين نهر الرس إلى شروان وبنى قباذ سد اللبن بين أرض شروان وباب اللان، ومن ملوك الجبل الذين أقرّهم أنوشروان على ممالكهم ملك شروان ويدعى شروانشاه."
  en: "Shirwan of the Caucasian lands beyond Arran; Qubadh's general trod what lay between the river al-Rass and Shirwan, and Qubadh built the wall of al-Lubn between Shirwan's land and Bab al-Lan; among the mountain kings Anushirwan confirmed on their kingdoms is the king of Shirwan, called the Shirwanshah."
  es: "Shirwan de las tierras caucásicas más allá de Arran; el general de Qubadh pisó lo que se extendía entre el río al-Rass y Shirwan, y Qubadh construyó la muralla de al-Lubn entre la tierra de Shirwan y Bab al-Lan; entre los reyes de las montañas, Anushirwan confirmó en sus reinos al rey de Shirwan, llamado Shirwanshah."
  fr: "Shirwan des terres caucasiennes au-delà d'Arran; le général de Qubadh a foulé ce qui se trouvait entre la rivière al-Rass et Shirwan, et Qubadh a construit le mur d'al-Lubn entre le pays de Shirwan et Bab al-Lan; parmi les rois de montagne qu'Anushirwan a confirmés sur leurs royaumes se trouve le roi de Shirwan, appelé le Shirwanshah."
