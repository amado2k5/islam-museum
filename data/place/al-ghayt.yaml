summary:
  ar: "مرسى حسن يحميه من بعض الرياح، تُخرج منه الحنطة والشعير، ويتصل به الرخص من قبيلة المصامدة. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  en: "A good harbour sheltered from some winds, from which wheat and barley are exported, and linked with the Masmuda tribes. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  es: "Un buen puerto resguardado de algunos vientos, desde donde se exportan trigo y cebada, y vinculado con las tribus Masmuda. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  fr: "Un bon port abrité de certains vents, d'où l'on exporte du blé et de l'orge, et qui est lié aux tribus Masmuda. {cite:nuzhat-al-mushtaq-2002 p. 241}"
  ur: "ایک اچھی بندرگاہ کچھ ہواؤں سے محفوظ ہے، جہاں سے گندم اور جو برآمد کیے جاتے ہیں، اور مسمودا قبائل سے منسلک ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 241}"
  tr: "Marsa Hassan, bazı rüzgarlardan korur ve bu rüzgarlardan buğday ve arpa çıkar ve Masamada kabilesinin ruhsatlarına bağlıdır. {kaynak:nuzhat-al-mushtaq-2002 s. 241}"
  id: "Marsa Hassan melindunginya dari beberapa angin, dari mana gandum dan jelai berasal, dan ia terhubung dengan lisensi suku Masamada. {cite:nuzhat-al-mushtaq-2002 hlm. 241}"
