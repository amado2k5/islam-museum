summary:
  ar: "مدينة على البحر، تبعد عن قطيغورا ست مراحل، وعلى ضفة ماء ملح، ويقابلها في البحر جزيرة سناسا. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  en: "A city on the sea facing the island of Sanasa, on a salt-water channel, six stages from Qatighura. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  es: "Una ciudad a orillas del mar, frente a la isla de Sanasa, en un canal de agua salada, a seis etapas de Qatighura. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  fr: "Une ville en bord de mer, face à l'île de Sanasa, sur un chenal d'eau salée, à six étapes de Qatighura. {cite:nuzhat-al-mushtaq-2002 p. 203}"
  ur: "سمندر پر واقع شہر سناسا کے جزیرے کی طرف، کھارے پانی کے چینل پر، قتیغورا سے چھ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 203}"
  tr: "Deniz kenarında, Qatigora'ya altı adım uzaklıkta, tuzlu su kıyısında, denizin karşısında, Sanasa adasının yanında bir şehir. {kaynak:nuzhat-al-mushtaq-2002 s. 203}"
  id: "Sebuah kota di tepi laut, enam langkah dari Qatigora, di tepi air asin, berseberangan dengan laut dekat pulau Sanasa. {cite:Nuzhat-al-Mushtaq-2002 hlm. 203}"
