label: { ar: "بحر جرجان والديلم ⁦(بحر قزوين)⁩", en: "The sea of Jurjan and al-Daylam (Caspian Sea)", es: "El mar de Jurjan y al-Daylam (Mar Caspio)", fr: "La mer de Jurjan et d'al-Daylam (mer Caspienne)", ur: "جرجان اور الدیلام کا سمندر ⁦(کیسپین سمندر)⁩", tr: "Gorgan Denizi ve Al-Daylam (Hazar Denizi)", id: "Laut Gorgan dan Al-Daylam (Laut Kaspia)" }
summary:
  ar: "بحر منقطع لا يتصل بالبحار الأخرى، تصب فيه أنهار وعيون كثيرة، يحيط به من الشرق الأغزاز، ومن الشمال الخزر، ومن الغرب أذربيجان والديلم، ومن الجنوب طبرستان، وطوله نحو ألف ميل، وعرضه نحو ست مائة وخمسين ميلاً {cite:nuzhat-al-mushtaq-2002 p. 12}."
  en: "An enclosed sea not joined to the others, fed by many rivers and springs. The Ghuzz lie to the east, the Khazars to the north, Azerbaijan and al-Daylam to the west and Tabaristan to the south. About 1,000 miles long and 650 miles wide {cite:nuzhat-al-mushtaq-2002 p. 12}."
  es: "Un mar cerrado, aislado de los demás, alimentado por numerosos ríos y manantiales. Los ghuzz se encuentran al este, los jázaros al norte, Azerbaiyán y al-Daylam al oeste y Tabaristán al sur. Tiene aproximadamente 1000 millas de largo y 650 millas de ancho {cite:nuzhat-al-mushtaq-2002 p. 12}."
  fr: "Une mer fermée, non reliée aux autres, alimentée par de nombreux fleuves et sources. Les Ghuzz se situent à l'est, les Khazars au nord, l'Azerbaïdjan et al-Daylam à l'ouest et le Tabaristan au sud. Environ 1 600 kilomètres de long et 1 050 kilomètres de large {cite: nuzhat-al-mushtaq-2002 p. 12}."
  ur: "ایک بند سمندر جو دوسروں کے ساتھ نہیں جڑا، بہت سے دریاؤں اور چشموں سے کھلتا ہے۔ غزوہ مشرق میں، شمال میں خزر، مغرب میں آذربائیجان اور الدیلم اور جنوب میں طبرستان واقع ہے۔ تقریباً 1,000 میل لمبا اور 650 میل چوڑا {حوالہ: نزہت المشتاق-2002 ص۔ 12}۔"
  tr: "Diğer denizlerle bağlantısı olmayan, birçok nehir ve kaynak akan sürekli bir denizdir. Doğuda Ağaz, kuzeyde Hazarlar, batıda Azerbaycan ve Daylam, güneyde ise Tabaristan ile çevrilidir. Uzunluğu yaklaşık bin mil, genişliği ise yaklaşık altı yüz elli mildir {cite:Nuzhat-al-Mushtaq-2002, s. 12}."
  id: "Laut ini berkesinambungan dan tidak terhubung dengan laut lain, dengan banyak sungai dan mata air mengalir ke dalamnya. Laut ini dikelilingi di timur oleh Aghaz, di utara oleh Khazar, di barat oleh Azerbaijan dan Daylam, dan di selatan oleh Tabaristan. Panjangnya sekitar seribu mil dan lebarnya sekitar enam ratus lima puluh mil {cite:Nuzhat-al-Mushtaq-2002, hlm. 12}."
