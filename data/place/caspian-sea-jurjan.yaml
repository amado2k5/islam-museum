summary:
  ar: "بحر منقطع لا يتصل بالبحار الأخرى، تصب فيه أنهار وعيون كثيرة، يحيط به من الشرق الأغزاز، ومن الشمال الخزر، ومن الغرب أذربيجان والديلم، ومن الجنوب طبرستان، وطوله نحو ألف ميل، وعرضه نحو ست مائة وخمسين ميلاً {cite:nuzhat-al-mushtaq-2002 p. 12}."
  en: "An enclosed sea not joined to the others, fed by many rivers and springs. The Ghuzz lie to the east, the Khazars to the north, Azerbaijan and al-Daylam to the west and Tabaristan to the south. About 1,000 miles long and 650 miles wide {cite:nuzhat-al-mushtaq-2002 p. 12}."
