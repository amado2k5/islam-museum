summary:
  ar: "مدينة حسنة على ضفة نهر، فسيحة الأقطار كثيرة العمارات، قائمة الجبايات، ويذكر المؤلف أنها تقع على نهر يسميه باسم مورين {cite:nuzhat-al-mushtaq-2002 p. 872}."
  en: "A fine city on the bank of a river, with wide territory, many buildings and collected revenues; the author names the river Mūrīn {cite:nuzhat-al-mushtaq-2002 p. 872}."
  es: "Una hermosa ciudad a orillas de un río, con un amplio territorio, muchos edificios e ingresos recaudados; el autor nombra al río Mūrīn {cite:nuzhat-al-mushtaq-2002 p. 872}."
  fr: "Une belle ville sur la rive d'un fleuve, avec un vaste territoire, de nombreux bâtiments et des revenus collectés; l'auteur nomme le fleuve Mūrīn {cite:nuzhat-al-mushtaq-2002 p. 872}."
  ur: "دریا کے کنارے ایک عمدہ شہر، وسیع علاقہ، بہت سی عمارتیں اور جمع شدہ محصولات۔ مصنف نے دریا کا نام مورین رکھا ہے۔ 872}۔"
  tr: "Nehir kıyısında güzel bir şehir, birçok binası, vergi listesi ve yazarın Moraine adını verdiği bir nehir üzerinde yer aldığını belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 872}."
  id: "Sebuah kota yang indah di tepi sungai, luas dengan banyak bangunan, daftar pajak, dan penulis menyebutkan bahwa kota ini terletak di sungai yang ia sebut Moraine {cite:Nuzhat-al-Mushtaq-2002, hlm. 872}."
