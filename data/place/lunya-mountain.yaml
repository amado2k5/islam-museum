label: { ar: "جبل لونيا", en: "Mount Lunya", es: "Monte Lunya", fr: "Mont Lunya", ur: "ماؤنٹ لونیا" }
summary:
  ar: "جبل عالٍ في أرض زغاوة، تربته بيضاء رخوة، وفيه كهف يذكر المؤلف أن الناس يتجنبونه لخبر عن ثعبان كبير فيه، وفي أصله مياه تجري قليلا ثم تنقطع {cite:nuzhat-al-mushtaq-2002 p. 111}، {cite:nuzhat-al-mushtaq-2002 p. 116}."
  en: "A high mountain in Zaghawa country with soft white soil. A cave on it is avoided, the author reports, because of a great snake said to be inside. Springs at its foot run briefly and then stop {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  es: "Una alta montaña en el país de Zaghawa con suelo blanco y blando. Según el autor, se evita una cueva en ella debido a una gran serpiente que supuestamente habita en su interior. Los manantiales a sus pies fluyen brevemente y luego se secan {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  fr: "Une haute montagne du pays de Zaghawa, au sol blanc et fin. L'auteur rapporte qu'une grotte qui s'y trouve est évitée à cause d'un grand serpent qui y serait caché. Des sources jaillissent à son pied, brièvement, puis s'assèchent {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
  ur: "زغاوا ملک کا ایک اونچا پہاڑ جس میں نرم سفید مٹی ہے۔ اس پر ایک غار سے گریز کیا جاتا ہے، مصنف کی رپورٹ کے مطابق، ایک عظیم سانپ کے اندر ہونے کی وجہ سے کہا جاتا ہے۔ اس کے دامن میں چشمے تھوڑی دیر چلتے ہیں اور پھر رک جاتے ہیں {حوالہ: نزہت المشتاق-2002 ص 111}، {حوالہ: نزہت المشتاق-2002 ص۔ 116}۔"
