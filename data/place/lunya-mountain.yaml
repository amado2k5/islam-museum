summary:
  ar: "جبل عالٍ في أرض زغاوة، تربته بيضاء رخوة، وفيه كهف يذكر المؤلف أن الناس يتجنبونه لخبر عن ثعبان كبير فيه، وفي أصله مياه تجري قليلا ثم تنقطع {cite:nuzhat-al-mushtaq-2002 p. 111}، {cite:nuzhat-al-mushtaq-2002 p. 116}."
  en: "A high mountain in Zaghawa country with soft white soil. A cave on it is avoided, the author reports, because of a great snake said to be inside. Springs at its foot run briefly and then stop {cite:nuzhat-al-mushtaq-2002 p. 111}, {cite:nuzhat-al-mushtaq-2002 p. 116}."
