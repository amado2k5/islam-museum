  ar: "مدينة على البحر لها سور من حجر حصين، ولها كورة واسعة فيها أشجار، وتبعد عن نهر إبراهيم خمسة أميال، ويشرب أهلها من آبار. {cite:nuzhat-al-mushtaq-2002 p. 372}"
  en: "A city on the coast with a strong stone wall and a wide district of trees, five miles from the river of Ibrahim; its people drink from wells. {cite:nuzhat-al-mushtaq-2002 p. 372}"
  es: "Una ciudad costera con una sólida muralla de piedra y una amplia zona arbolada, a cinco millas del río Ibrahim; sus habitantes beben de pozos. {cite:nuzhat-al-mushtaq-2002 p. 372}"
  fr: "Une ville côtière, entourée d'une solide muraille de pierre et d'une vaste zone boisée, à cinq milles du fleuve Ibrahim; ses habitants s'abreuvent aux puits. {cite:nuzhat-al-mushtaq-2002 p. 372}"
