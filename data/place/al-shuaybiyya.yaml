summary:
  ar: "الشعيبية بالبصرة؛ كان أهلها من الفرات حملوها لعلي بن أمير المؤمنين الرشيد في خلافة الرشيد على أن يكونوا مزارعين له فيها ويخفف مقاسمتهم فتكلم فيها فجعلت عشرية من الصدقة وقاسم أهلها على ما رضوا به وقام له بأمرها نعيب بن زياد الواسطي."
  en: "al-Shu'aybiyya at Basra; its Euphrates folk carried it to Ali ibn al-Rashid as his sharecroppers on lightened terms — he made it ushr-sadaqa land and shared them as they accepted, Na'ib ibn Ziyad al-Wasiti managing it."
  es: "al-Shu'aybiyya en Basora; sus habitantes del Éufrates se la llevaron a Ali ibn al-Rashid como aparceros suyos en condiciones más favorables; él la convirtió en tierra ushr-sadaqa y la compartió según la aceptaron, administrándola Na'ib ibn Ziyad al-Wasiti."
  fr: "al-Shu'aybiyya à Basra; ses habitants de l'Euphrate l'ont apporté à Ali ibn al-Rashid comme ses métayers à des conditions allégées — il en a fait une terre ushr-sadaqa et l'a partagée comme ils l'acceptaient, Na'ib ibn Ziyad al-Wasiti la gérant."
  ur: "الشعبیہ بصرہ؛ فرات کے لوگ اسے ہلکی شرائط پر اپنے حصہ دار کے طور پر علی بن الرشید کے پاس لے گئے - انہوں نے اسے عشر صدقہ کی زمین بنا دیا اور جیسا کہ انہوں نے قبول کیا ان میں اشتراک کیا، نائب ابن زیاد الوصطی اس کا انتظام کر رہے تھے۔"
  tr: "Basra'daki El-Şaibiye; Fırat Nehri halkı el-Reşid'in halifeliği sırasında Ali bin Emir el-Mu'minin el-Raşid'den miras almıştı; bunun şartıyla orada çiftçi olacaklar ve bölünmelerini hafifleteceklerdi. Ondan bahsetti, bu yüzden sadaka olarak bir ondalık verildi ve halkı arasında istedikleri şekilde paylaştırıldı, Nu'ayb bin Ziyad el-Vesti ise sorumluluğunu üstlendi."
  id: "Al-Sha'ibiyah di Basra; rakyatnya dari Sungai Efrat mewarisinya dari Ali ibn Amir al-Mu'minin al-Rashid selama masa kekhalifahan al-Rashid dengan syarat mereka menjadi petani di sana dan untuk meringankan pembagian mereka. Ia membicarakannya, sehingga diberikan persepuluhan sebagai amal dan dibagi di antara rakyatnya sesuai keinginan mereka, dan Nu'ayb ibn Ziyad al-Wasti mengambil alihnya."
