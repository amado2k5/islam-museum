summary:
  ar: "مدينة على كدية مرتفعة تظهر من بعيد، وتقع على نهر، وتبعد عن جيان عشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  en: "A town set on a raised mound visible from far off, on a river, twenty miles from Jayyan. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  es: "Un pueblo situado sobre un montículo elevado, visible desde lejos, a orillas de un río, a veinte millas de Jayyan. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  fr: "Une ville située sur une butte surélevée, visible de loin, au bord d'une rivière, à vingt milles de Jayyan. {cite:nuzhat-al-mushtaq-2002 p. 568}"
  ur: "جیان سے بیس میل کے فاصلے پر ایک دریا پر دور سے نظر آنے والے ایک اونچے ٹیلے پر آباد ایک قصبہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 568}"
  tr: "Jayenne'den yirmi mil uzaklıkta, bir nehir kenarında yer alan, uzaklara bakan yüksek bir tepe üzerindeki şehir. {cite:nuzhat-al-mushtaq-2002 s. 568}"
  id: "Sebuah kota di atas bukit tinggi yang menghadap ke kejauhan, terletak di tepi sungai, dua puluh mil dari Jayenne. {cite:nuzhat-al-mushtaq-2002 hlm. 568}"
