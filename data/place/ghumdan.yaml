label: { ar: "غمدان", en: "Ghumdan" }
summary:
  ar: "قصر بمدينة صنعاء بناه الضحاك على اسم الزهرة، وخربه عثمان بن عفان فصار خراباً قد هدم فضار تلاً عظيماً، وبنى فيه الوزير علي بن عيسى بن الجراح حين نفي إلى اليمن سقاية وحفر بئراً، ورآه المسعودي ردماً وتلاً كأنه لم يكن سنة ٣٣٢هـ، وأراد أسعد بن يعفر صاحب قلعة كحلان ومخاليف اليمن بناءه فأشار عليه يحيى بن الحسين الحسني ألا يتعرض لشيء من ذلك إذ كان بناؤه على يدي غلام يخرج من أرض سبأ ومأرب {cite:muruj-al-dhahab p. 539-540}. وفي أخبار أهل اليمن التي أوردها الهمداني في «صفة جزيرة العرب» أن غمدان والقليس بنتهما بلقيس {cite:sifat-jazirat-al-arab p. 221}. ويعدّه ابن فضل الله العمري من أشهر الآثار وأظهر المعالم؛ كان مسكن التبابعة من حمير ومنهم شرحبيل بن مالك وأسعد أبو كرب «طافا الأرض وبلغا الآفاق»، وهو المذكور في الأشعار وفيه قال أمية بن أبي الصلت بيته المشهور {cite:umari-masalik-1924 p. 232-233}."
  en: "The San'a' castle built by al-Dahhak for Venus — levelled in Uthman's caliphate into a great mound where the exiled vizier Ibn al-Jarrah dug a well — seen by al-Mas'udi in 332 AH as dust; As'ad ibn Ya'fur's plan to rebuild was checked by Yahya ibn al-Husayn's warning that a Sabaean youth was destined to raise it {cite:muruj-al-dhahab p. 539-540}."
