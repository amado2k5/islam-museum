summary:
  ar: "قصر بمدينة صنعاء بناه الضحاك على اسم الزهرة، وخربه عثمان بن عفان فصار خراباً قد هدم فضار تلاً عظيماً، وبنى فيه الوزير علي بن عيسى بن الجراح حين نفي إلى اليمن سقاية وحفر بئراً، ورآه المسعودي ردماً وتلاً كأنه لم يكن سنة ٣٣٢هـ، وأراد أسعد بن يعفر صاحب قلعة كحلان ومخاليف اليمن بناءه فأشار عليه يحيى بن الحسين الحسني ألا يتعرض لشيء من ذلك إذ كان بناؤه على يدي غلام يخرج من أرض سبأ ومأرب {cite:muruj-al-dhahab p. 539-540}. وفي أخبار أهل اليمن التي أوردها الهمداني في «صفة جزيرة العرب» أن غمدان والقليس بنتهما بلقيس {cite:sifat-jazirat-al-arab p. 221}. ويعدّه ابن فضل الله العمري من أشهر الآثار وأظهر المعالم؛ كان مسكن التبابعة من حمير ومنهم شرحبيل بن مالك وأسعد أبو كرب «طافا الأرض وبلغا الآفاق»، وهو المذكور في الأشعار وفيه قال أمية بن أبي الصلت بيته المشهور {cite:umari-masalik-1924 p. 232-233}."
  en: "The San'a' castle built by al-Dahhak for Venus — levelled in Uthman's caliphate into a great mound where the exiled vizier Ibn al-Jarrah dug a well — seen by al-Mas'udi in 332 AH as dust; As'ad ibn Ya'fur's plan to rebuild was checked by Yahya ibn al-Husayn's warning that a Sabaean youth was destined to raise it {cite:muruj-al-dhahab p. 539-540}."
  es: "El castillo de Sana' construido por al-Dahhak para Venus —arrasado durante el califato de Uthman hasta convertirlo en un gran montículo donde el visir exiliado Ibn al-Jarrah cavó un pozo— fue visto por al-Mas'udi en el año 332 AH como polvo; el plan de As'ad ibn Ya'fur para reconstruirlo fue frenado por la advertencia de Yahya ibn al-Husayn de que un joven sabeo estaba destinado a levantarlo {cite:muruj-al-dhahab p. 539-540}."
  fr: "Le château de San'a, construit par al-Dahhak pour Vénus, fut rasé sous le califat d'Uthman et transformé en un grand monticule où le vizir exilé Ibn al-Jarrah creusa un puits. Il fut vu par al-Mas'udi en 332 AH comme de la poussière; le projet de reconstruction d'As'ad ibn Ya'fur fut contrarié par l'avertissement de Yahya ibn al-Husayn selon lequel un jeune Sabéen était destiné à le reconstruire {cite:muruj-al-dhahab p. 539-540}."
  ur: "زہرہ کے لیے الضحاک کی طرف سے تعمیر کردہ صنعاء کا قلعہ - عثمان کی خلافت میں ایک عظیم ٹیلے میں برابر کیا گیا تھا جہاں جلاوطن وزیر ابن الجراح نے ایک کنواں کھودا تھا - جسے المسعودی نے 332 ہجری میں مٹی کے طور پر دیکھا تھا۔ اسعد بن یعفور کے دوبارہ تعمیر کرنے کے منصوبے کو یحییٰ بن الحسین کے انتباہ کے ذریعے جانچا گیا کہ ایک سبای نوجوان اس کی پرورش کا مقدر تھا۔ 539-540}۔"
  tr: "San şehrinde bir saray inşa etti El-Dahhak tarafından El-Zehra adına yapıldı. Osman bin Affan onu yıktı ve büyük bir höyüğü yıkan bir harabe haline geldi. Vezir Ali bin İsa ibn el-Cerre Yemen'e sürgün edildiğinde bir su çeşmesi yaptı ve bir kuyu kazdı. El-Mes'udi, 332 H yılında kuyunun hiç var olmamış gibi gördü. Kahlan Kalesi'nin sahibi ve Yemen halifeleri As'ad ibn Ya'far onu inşa etmek istedi, ancak Yahya ibn al-Hüseyin el-Hasani ona müdahale etmemesini tavsiye etti; çünkü kuyu Saba ve Merib topraklarından gelen bir hizmetçi tarafından yapılmıştı {alıntı: Muric-al-Dhahab, s. 539-540}. El-Hamdani'nin 'Sifat al-Jazirat al-Arab' adlı eserinde bahsettiği Yemen halkının raporlarında, Ghamdan ve al-Qallis'in Bilqis tarafından inşa edildiği belirtilir {cite:sifat-jazirat-al-Arab, s. 221}. İbn Fadlallah al-'Umari burayı en ünlü ve en önemli anıtlardan biri olarak kabul eder; Himyar'dan Tababa'a'ların, aralarında Şürhabil ibn Malik ve As'ad Abu Karb'ın da bulunduğu kişilerin ikametgahıydı; onlar 'yeryüzünde dolaşıp ufuklara ulaştılar.' Şiirlerde bahsedilir ve Umayyah ibn Ebi el-Salt onun ünlü evini anlatmıştır {cite:umari-masalik-1924, s. 232-233}."
  id: "Sebuah istana di kota Sana'a dibangun oleh Al-Dahhak atas nama Al-Zahra. Uthman ibn Affan menghancurkannya dan menjadi reruntuhan yang menghancurkan sebuah gundukan besar. Ketika wazir Ali ibn Isa ibn al-Jarrah diasingkan ke Yaman, ia membangun air mancur dan menggali sumur. Al-Mas'udi melihatnya seolah-olah tidak pernah ada pada tahun 332 H. As'ad ibn Ya'far, pemilik Kastil Kahlan dan para khalifah Yaman, ingin membangunnya, tetapi Yahya ibn al-Husayn al-Hasani menasihatinya untuk tidak ikut campur dalam hal itu, karena bangunan itu dibangun oleh seorang pelayan yang berasal dari tanah Saba dan Marib {cite:Muruj-al-Dhahab, hlm. 539-540}. Dalam laporan rakyat Yaman yang disebutkan oleh al-Hamdani dalam 'Sifat al-Jazirat al-Arab,' disebutkan bahwa Ghamdan dan al-Qallis dibangun oleh Bilqis {cite:sifat-jazirat-al-Arab, hlm. 221}. Ibn Fadlallah al-'Umari menganggapnya sebagai salah satu monumen paling terkenal dan menonjol; ini adalah kediaman Tababa'a dari Himyar, termasuk Shurhabil ibn Malik dan As'ad Abu Karb, yang 'mengembara di bumi dan mencapai cakrawala.' Rumah ini disebutkan dalam puisi, dan Umayyah ibn Abi al-Salt menyebutkan rumah terkenalnya {cite:umari-masalik-1924, hlm. 232-233}."
