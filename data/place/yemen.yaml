summary:
  ar: الركن الجنوبي الغربي من جزيرة العرب، مهد العرب العاربة ⁦(قحطان)⁩ ومسرح ممالك سبأ وحمير ثم الاحتلالين الحبشي والفارسي في مقدمة السيرة.
  en: The southwest corner of Arabia, homeland of the Qahtani Arabs and seat of the successive Sabaean, Himyarite, Abyssinian and Persian powers narrated in the sira's prologue.
  es: "El extremo suroeste de Arabia, patria de los árabes qahtaníes y sede de los sucesivos poderes sabeo, himyarita, abisinio y persa, narrado en el prólogo de la sira."
  fr: "Le coin sud-ouest de l'Arabie, patrie des Arabes Qahtaniens et siège des puissances successives sabéennes, himyarites, abyssiniennes et perses relatées dans le prologue de la sira."
  ur: "عرب کا جنوب مغربی گوشہ، قحطانی عربوں کا وطن اور یکے بعد دیگرے سبعین، حمیری، حبشی اور فارسی طاقتوں کی نشستیں سیرت کے تمثیل میں بیان کی گئی ہیں۔"
  tr: "Arap Yarımadası'nın güneybatı köşesi, Arap topraklarının (Qahtan) Araplarının beşiği, Seba ve Himyar krallıklarının dönemi, ardından Habeşistan ve Pers işgalleri biyografinin ön planındadır."
  id: "Sudut barat daya Semenanjung Arab, tempat lahir bangsa Arab di tanah Arab (Qahtan), tahap kerajaan Sheba dan Himyar, kemudian pendudukan Abyssinia dan Persia, menjadi pusat perhatian dalam biografi ini."
