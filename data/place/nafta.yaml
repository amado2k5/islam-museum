  fr: "Une petite ville avec des marchés, du commerce, des palmiers, des cultures et de l'eau courante, à deux étapes de Qafsa. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  ur: "ایک چھوٹا سا قصبہ جس میں بازار، تجارت، کھجوریں، فصلیں اور بہتے ہوئے پانی ہیں، قفس سے دو منزلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 278}"
  tr: "Pazarlar, ticaretler, palmiye ağaçları, ürünler ve akan suyu olan, Gafsa'dan iki aşama uzaklıkta bulunan küçük bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 278}"
  id: "Sebuah kota kecil dengan pasar, perdagangan, pohon palem, tanaman, dan air mengalir, terletak dua tahap dari Gafsa. {cite:nuzhat-al-mushtaq-2002 hlm. 278}"
