  ar: "مدينة صغيرة لها أسواق وتجارات ونخل وغلات ومياه جارية، وتبعد عن قفصة مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 278}"
  en: "A small town with markets, trade, palms, crops and running water, two stages from Qafsa. {cite:nuzhat-al-mushtaq-2002 p. 278}"
