summary:
  ar: "بحيرة كبيرة مالحة قليلًا في تركستان الغربية، بلغت مساحتها نحو 66,458 كم² سنة 1942م، منها 2,345 كم² جزر. وصفها الجغرافيون المسلمون بحيرة مالحة مغلقة، واختلفت رواياتهم عن علاقتها بنهري آمو داريا وسير داريا وببحر قزوين {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  en: "A large, slightly salty lake in western Turkestan, with an area of 66,458 sq km in 1942, of which 2,345 sq km are islands. Islamic geographers described it as a closed salt lake, and their accounts of its links with the Amu Darya, the Sir Darya and the Caspian disagree {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  es: "Un gran lago ligeramente salado en el oeste de Turkestán, con una superficie de 66.458 km² en 1942, de los cuales 2.345 km² son islas. Los geógrafos islámicos lo describieron como un lago salado cerrado, y sus relatos sobre sus conexiones con el Amu Darya, el Sir Darya y el Caspio difieren {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  fr: "Un grand lac légèrement salé du Turkestan occidental, d'une superficie de 66 458 km² en 1942, dont 2 345 km² d'îles. Les géographes musulmans le décrivaient comme un lac salé fermé, et leurs récits de ses liens avec l'Amou-Daria, le Sir Darya et la mer Caspienne divergent {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  ur: "مغربی ترکستان میں ایک بڑی، قدرے نمکین جھیل جس کا رقبہ 1942 میں 66,458 مربع کلومیٹر تھا، جس میں سے 2,345 مربع کلومیٹر جزیرے ہیں۔ اسلامی جغرافیہ دانوں نے اسے ایک بند نمکین جھیل کے طور پر بیان کیا، اور آمو دریا، سر دریا اور کیسپین کے ساتھ اس کے روابط کے بارے میں ان کے اکاؤنٹس متفق نہیں ہیں۔ 1 ص۔ 631}۔"
  tr: "1942'de yaklaşık 66.458 km² alana sahip, Batı Türkistan'da hafif tuzlu büyük bir göl olup, bunun 2.345 km²'si adalardan oluşuyordu. Müslüman coğrafyacılar burayı kapalı tuzlu bir göl olarak tanımlamış ve anlatımları, Amuderya ve Sür-Derya nehirleri ile Hazar Denizi ile ilişkisi konusunda farklılık göstermektedir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 631}."
  id: "Sebuah danau besar yang agak asin di Turkestan Barat, dengan luas sekitar 66.458 km² pada tahun 1942, di mana 2.345 km² merupakan pulau. Ahli geografi Muslim menggambarkannya sebagai danau garam tertutup, dan catatan mereka berbeda terkait hubungannya dengan sungai Amu Darya dan Syr Darya serta Laut Kaspia {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 631}."
