  ar: "بحيرة كبيرة مالحة قليلًا في تركستان الغربية، بلغت مساحتها نحو 66,458 كم² سنة 1942م، منها 2,345 كم² جزر. وصفها الجغرافيون المسلمون بحيرة مالحة مغلقة، واختلفت رواياتهم عن علاقتها بنهري آمو داريا وسير داريا وببحر قزوين {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  en: "A large, slightly salty lake in western Turkestan, with an area of 66,458 sq km in 1942, of which 2,345 sq km are islands. Islamic geographers described it as a closed salt lake, and their accounts of its links with the Amu Darya, the Sir Darya and the Caspian disagree {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
