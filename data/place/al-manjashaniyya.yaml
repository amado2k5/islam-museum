summary:
  ar: "المنجشانية على ستة أميال من البصرة؛ اتخذها قيس بن مسعود الشيباني وهو على الطف من قبل كسرى وجرت على يد منجشان فنسبت إليه وفوقها روضة الخيل كانت مهارته ترعى فيها."
  en: "al-Manjashaniyya, six miles from Basra — the estate Qays ibn Mas'ud al-Shaybani, Kisra's warden of the Taff, made through his agent Manjashan; above it Rawdat al-Khayl where his horses grazed."
  es: "al-Manjashaniyya, a seis millas de Basora: la propiedad que Qays ibn Mas'ud al-Shaybani, guardián del Taff de Kisra, hizo a través de su agente Manjashan; encima, Rawdat al-Khayl, donde pastaban sus caballos."
  fr: "al-Manjashaniyya, à six milles de Bassorah — le domaine de Qays ibn Mas'ud al-Shaybani, le gardien du Taff de Kisra, réalisé par l'intermédiaire de son agent Manjashan; au-dessus, Rawdat al-Khayl où paissaient ses chevaux."
  ur: "المنجشنیہ، بصرہ سے چھ میل کے فاصلے پر — جائیداد قیس بن مسعود الشیبانی، کسریٰ کے طاف کے وارڈن نے اپنے ایجنٹ منجشن کے ذریعے بنائی تھی۔ اس کے اوپر رودۃ الخیل جہاں اس کے گھوڑے چرتے تھے۔"
  tr: "El-Mancashaniyya, Basra'ya altı mil uzaklıktadır; Kays bin Mes'ud el-Şeybani tarafından Al-Taff'tayken Hosrov tarafından ele geçirilmiş ve ona atfedilen Manjashan tarafından inşa edilmiştir. Üstünde, onun becerisinin otladığı at bahçesi vardır."
  id: "Al-Manjashaniyya berjarak enam mil dari Basra; tempat ini diambil oleh Qays ibn Mas'ud al-Shaybani saat ia berada di Al-Taff oleh Khosrow, dan dibangun oleh Manjashan, yang dianggap miliknya. Di atasnya terdapat kebun kuda tempat keahliannya merumput."
