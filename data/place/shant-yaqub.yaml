summary:
  ar: "كنيسة عظمى يقصدها الروم من كل جهة، في حسن البناء وسعة الفناء، فيها أموال كثيرة من الذهب والفضة المرصعة بالياقوت، وفيها نحو ثلاثمائة صليب مصوغ، وصور إقونات من الذهب والفضة، ويصفها الإدريسي بأنها من أعظم الكنائس بعد بيت المقدس. {cite:nuzhat-al-mushtaq-2002 p. 728}"
  en: "A great church visited by Christians from every side, fine in build and wide in its courts, with much gold and silver set with rubies, about three hundred crosses and icons of gold and silver; al-Idrisi calls it the greatest church after Jerusalem. {cite:nuzhat-al-mushtaq-2002 p. 728}"
  es: "Una gran iglesia visitada por cristianos de todas partes, de hermosa construcción y amplios patios, con abundante oro y plata engastados con rubíes, cerca de trescientas cruces e iconos de oro y plata; al-Idrisi la considera la iglesia más grande después de Jerusalén. {cite:nuzhat-al-mushtaq-2002 p. 728}"
  fr: "Une grande église visitée par des chrétiens de tous horizons, d'une construction remarquable et aux vastes cours, ornée d'or et d'argent sertis de rubis, abritant environ trois cents croix et icônes d'or et d'argent; al-Idrisi la qualifie de plus grande église après Jérusalem. {cite:nuzhat-al-mushtaq-2002 p. 728}"
