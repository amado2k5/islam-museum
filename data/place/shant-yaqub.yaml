summary:
  ar: "كنيسة عظمى يقصدها الروم من كل جهة، في حسن البناء وسعة الفناء، فيها أموال كثيرة من الذهب والفضة المرصعة بالياقوت، وفيها نحو ثلاثمائة صليب مصوغ، وصور إقونات من الذهب والفضة، ويصفها الإدريسي بأنها من أعظم الكنائس بعد بيت المقدس. {cite:nuzhat-al-mushtaq-2002 p. 728}"
  en: "A great church visited by Christians from every side, fine in build and wide in its courts, with much gold and silver set with rubies, about three hundred crosses and icons of gold and silver; al-Idrisi calls it the greatest church after Jerusalem. {cite:nuzhat-al-mushtaq-2002 p. 728}"
