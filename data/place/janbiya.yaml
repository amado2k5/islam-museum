summary:
  ar: "مدينة في البرية الداخلية من أرض الحبشة، بعيدة عن العمارة، شربها من الآبار يجف أكثر الأوقات، وأهلها طلاب معادن الفضة والذهب. وتبعد عن النجاغة ثماني مراحل {cite:nuzhat-al-mushtaq-2002 p. 43-44}."
  en: "A town in the inner desert of Abyssinia, far from settled land. Its wells often run dry, and its people mainly seek silver and gold. Eight stages from Najagha {cite:nuzhat-al-mushtaq-2002 p. 43-44}."
  es: "Un pueblo en el desierto interior de Abisinia, lejos de las tierras habitadas. Sus pozos suelen secarse y sus habitantes buscan principalmente plata y oro. Ocho etapas desde Najagha {cite:nuzhat-al-mushtaq-2002 p. 43-44}."
  fr: "Une ville située au cœur du désert abyssinien, loin des terres habitées. Ses puits sont souvent à sec et ses habitants recherchent principalement l'argent et l'or. Huit étapes depuis Najagha {cite:nuzhat-al-mushtaq-2002 p. 43-44}."
  ur: "آباد زمین سے بہت دور حبشہ کے اندرونی صحرا میں ایک قصبہ۔ اس کے کنویں اکثر خشک رہتے ہیں، اور اس کے لوگ بنیادی طور پر چاندی اور سونا تلاش کرتے ہیں۔ نجاغہ سے آٹھ مراحل {حوالہ: نزہت المشتاق-2002 ص۔ 43-44}۔"
