summary:
  ar: "موضع قرب المدينة نزل فيه المتمردون من أهل مصر والعراق قبل مقتل عثمان بنحو شهر ونصف، وفيه صالحهم عثمان على خمسة أمور بعد أن أرسل إليهم عليّاً ⁦(ص163-164)⁩. لم يذكر الكتاب في الصفحات المقروءة إحداثيات الموضع."
  tr: "Mısır ve Irak'tan gelen isyancıların, Osman'ın ölümünden yaklaşık bir buçuk ay önce yerleştiği Medine yakınlarındaki bir yer; Osman, Ali'yi onlara gönderdikten sonra beş konuda onlarla barıştı (s. 163-164). Kitapta okunan sayfalarda konumun koordinatları belirtilmemiştir."
  id: "Sebuah tempat dekat Madinah tempat para pemberontak dari Mesir dan Irak menetap sekitar satu setengah bulan sebelum kematian Uthman, dan Uthman berdamai dengan mereka dalam lima hal setelah mengirim Ali kepada mereka (hlm. 163-164). Buku tersebut tidak menyebutkan koordinat lokasi tersebut dalam halaman-halaman yang dibaca."
