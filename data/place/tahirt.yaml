summary:
  ar: "عند البلاذري: مدينة بالمغرب أحدث محمد بن الأغلب بن إبراهيم قربها سنة تسع وثلاثين ومائتين مدينة سماها العباسية فأخربها أفلح بن عبد الوهاب الإياضي."
  en: "In al-Baladhuri: a Maghreb city near which Muhammad ibn al-Aghlab ibn Ibrahim founded in year 239 a city he likewise named al-Abbasiyya — Aflah ibn Abd al-Wahhab al-Iyadi destroyed it."
  es: "En al-Baladhuri: ciudad magrebí cerca de la cual Muhammad ibn al-Aghlab ibn Ibrahim fundó en el año 239 una ciudad a la que también llamó al-Abbasiyya; Aflah ibn Abd al-Wahhab al-Iyadi la destruyó."
  fr: "A al-Baladhuri: ville du Maghreb près de laquelle Muhammad ibn al-Aghlab ibn Ibrahim fonda en l'an 239 une ville qu'il nomma également al-Abbasiyya — Aflah ibn Abd al-Wahhab al-Iyadi la détruisit."
  ur: "البلادھوری میں ہے: مغرب کا ایک شہر جس کے قریب محمد ابن الغلاب ابن ابراہیم نے 239 میں ایک شہر کی بنیاد رکھی جس کا نام اس نے العباسیہ رکھا - افلح ابن عبد الوہاب العیادی نے اسے تباہ کردیا۔"
  tr: "Al-Baladhuri'ye göre: Muhammed bin el-Aglab bin İbrahim tarafından Fas'ta kurulmuş bir şehirdir; 239 H yılında Abbasi şehrine adını vermiştir, ancak Aflah ibn Abd al-Wahhab al-Iyadi burayı yıkmıştır."
  id: "Menurut Al-Baladhuri: sebuah kota di Maroko yang didirikan oleh Muhammad ibn al-Aghlab ibn Ibrahim, di dekatnya ia menamai kota Abbasiyah pada tahun 239 H, namun Aflah ibn Abd al-Wahhab al-Iyadi menghancurkannya."
