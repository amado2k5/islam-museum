label:
  ar: "أوليا أتا (جامبول)"
  en: "Awliya Ata (Djambul)"
summary:
  ar: "مدينة في قازاقستان على الضفة اليسرى لنهر تلاس، سُمّيت أوليا أتا («الأب المقدس») نسبة إلى قبر الولي كارا خان، وأُعيد تسميتها سنة 1938م جامبول تكريمًا للشاعر القازاقي جامبول جابايف (1846-1945م). كانت عاصمة مقاطعة سير داريا في تركستان الروسية حتى سنة 1917م، وفتحها الروس سنة 1864م {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A city of the Kazakh SSR on the left bank of the Talas, called Awliya Ata, 'holy father', after the grave of the holy man Kara Khan. It was renamed Djambul in 1938 after the Kazakh poet Dzhambul Dzhabaev (1846-1945). It was the capital of the Sir Darya district of Russian Turkistan until 1917, and was conquered by the Russians in 1864 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
