summary:
  ar: "مدينة في قازاقستان على الضفة اليسرى لنهر تلاس، سُمّيت أوليا أتا ⁦(«الأب المقدس»)⁩ نسبة إلى قبر الولي كارا خان، وأُعيد تسميتها سنة 1938م جامبول تكريمًا للشاعر القازاقي جامبول جابايف ⁦(1846-1945م)⁩. كانت عاصمة مقاطعة سير داريا في تركستان الروسية حتى سنة 1917م، وفتحها الروس سنة 1864م {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  en: "A city of the Kazakh SSR on the left bank of the Talas, called Awliya Ata, 'holy father', after the grave of the holy man Kara Khan. It was renamed Djambul in 1938 after the Kazakh poet Dzhambul Dzhabaev (1846-1945). It was the capital of the Sir Darya district of Russian Turkistan until 1917, and was conquered by the Russians in 1864 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  es: "Ciudad de la RSS de Kazajistán situada en la margen izquierda del Talas, llamada Awliya Ata, «padre santo», en honor a la tumba del santo Kara Khan. En 1938, pasó a llamarse Djambul en honor al poeta kazajo Dzhambul Dzhabaev (1846-1945). Fue la capital del distrito de Sir Darya del Turquestán ruso hasta 1917, y fue conquistada por los rusos en 1864 {cite:encyclopaedia-of-islam-2 vol. 1 p. 816}."
  fr: "Ville de la RSS du Kazakhstan située sur la rive gauche du Talas, elle s'appelait Awliya Ata (« saint père »), en référence au tombeau du saint homme Kara Khan. Elle fut rebaptisée Djambul en 1938 en l'honneur du poète kazakh Dzhambul Dzhabaev (1846-1945). Capitale du district de Sir Darya au Turkestan russe jusqu'en 1917, elle fut conquise par les Russes en 1864 (source: Encyclopaedia of Islam, vol. 1, p. 816)."
