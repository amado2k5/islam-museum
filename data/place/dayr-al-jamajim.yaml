label: { ar: "دير الجماجم", en: "Dayr al-Jamajim" }
summary:
  ar: "دير في نواحي الكوفة؛ عند البلاذري رواية الشرقي بن القطامي كانت بين إياد وبين بني بهراء بن عمرو بن الحاف بن قضاعة وبين بني القين بن جسر حرب فقتل فيها من إياد خلق فلما انقضت الوقعة دفنوا قتلاهم عند الدير وكان الناس بعد ذلك يحفرون فيخرج جماجم فسمي دير الجماجم وقال محمد بن السائب الكلبي كان مالك الرماح بن مخرز الإيادي قتل قوماً من الفرس ونصب جماجمهم عند الدير فسمي دير الجماجم."
  en: "Monastery near Kufa; in al-Baladhuri — per al-Sharqi ibn al-Qatami — Iyad fought Bahra' ibn Amr ibn al-Haf of Quda'a and Banu al-Qayn ibn Jassr, many of Iyad falling; they buried their slain by the monastery, and later diggers kept turning up skulls, hence 'the Monastery of Skulls' — while Muhammad ibn al-Sa'ib al-Kalbi holds Malik al-Rammah ibn Mukhriz al-Iyadi killed Persians and set their skulls by it."
