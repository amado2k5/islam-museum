label: { ar: "دير الجماجم", en: "Dayr al-Jamajim", es: "Dayr al-Jamajim", fr: "Dayr al-Jamajim", ur: "دیار الجامع", tr: "Kafatasları Manastırı", id: "Biara Tengkorak" }
summary:
  ar: "دير في نواحي الكوفة؛ عند البلاذري رواية الشرقي بن القطامي كانت بين إياد وبين بني بهراء بن عمرو بن الحاف بن قضاعة وبين بني القين بن جسر حرب فقتل فيها من إياد خلق فلما انقضت الوقعة دفنوا قتلاهم عند الدير وكان الناس بعد ذلك يحفرون فيخرج جماجم فسمي دير الجماجم وقال محمد بن السائب الكلبي كان مالك الرماح بن مخرز الإيادي قتل قوماً من الفرس ونصب جماجمهم عند الدير فسمي دير الجماجم."
  en: "Monastery near Kufa; in al-Baladhuri — per al-Sharqi ibn al-Qatami — Iyad fought Bahra' ibn Amr ibn al-Haf of Quda'a and Banu al-Qayn ibn Jassr, many of Iyad falling; they buried their slain by the monastery, and later diggers kept turning up skulls, hence 'the Monastery of Skulls' — while Muhammad ibn al-Sa'ib al-Kalbi holds Malik al-Rammah ibn Mukhriz al-Iyadi killed Persians and set their skulls by it."
  es: "Monasterio cerca de Kufa; en al-Baladhuri — según al-Sharqi ibn al-Qatami — Iyad luchó contra Bahra' ibn Amr ibn al-Haf de Quda'a y Banu al-Qayn ibn Jassr, muchos de los Iyad cayeron; enterraron a sus muertos junto al monasterio, y más tarde los excavadores siguieron desenterrando cráneos, de ahí el nombre de 'Monasterio de los Cráneos' — mientras que Muhammad ibn al-Sa'ib al-Kalbi sostiene que Malik al-Rammah ibn Mukhriz al-Iyadi mató a persas y colocó sus cráneos junto a él."
  fr: "Monastère près de Kufa; à al-Baladhuri — selon al-Sharqi ibn al-Qatami — Iyad a combattu Bahra' ibn Amr ibn al-Haf de Quda'a et Banu al-Qayn ibn Jassr, beaucoup d'Iyad tombant; ils ont enterré leurs morts près du monastère, et plus tard, des fouilles ont continué à déterrer des crânes, d'où le nom de « Monastère des Crânes » — tandis que Muhammad ibn al-Sa'ib al-Kalbi affirme que Malik al-Rammah ibn Mukhriz al-Iyadi a tué des Perses et a déposé leurs crânes près du monastère."
  ur: "کوفہ کے قریب خانقاہ؛ البلادوری میں - فی الشرقی ابن القطامی - عیاض نے قدعہ کے بہرہ بن عمرو بن الحف اور بنو القین ابن جسر سے جنگ کی، بہت سے عیاض گر پڑے۔ انہوں نے اپنے مقتولوں کو خانقاہ کے پاس دفن کیا، اور بعد میں کھودنے والے کھوپڑیوں کو تبدیل کرتے رہے، اس لیے 'کھوپڑیوں کی خانقاہ' - جب کہ محمد بن السائب الکلبی نے مالک الرمہ بن مخریز العیادی کو فارسیوں کو قتل کیا اور ان کی کھوپڑیاں اس کے پاس رکھ دیں۔"
  tr: "Küfe yakınlarında bir manastır; el-Baladhuri'ye göre, el-Şerqi ibn el-Katemi'nin rivayeti İyad' ile Banu Bahra ibn Amr ibn al-Haf ibn Quda'ah arasında ve Banu el-Qayn ibn Cisr Harb arasında yer almaktadır. Burada bazı İyadlılar öldürülmüştür. Savaş sona erdiğinde, ölülerini manastırın yakınında gömmüşlerdir. Bundan sonra insanlar kazır ve kafatasları çıkarılırdı, bu yüzden buraya Kafatası Manastırı denmiştir. Muhammed ibn el-Saib el-Kalbi şöyle demiştir: Malik el-Rimah ibn Mukhraz el-Ayadi bazı Persleri öldürdü ve kafataslarını manastırın yakınına diktirdi, bu yüzden Manastır Kafatası olarak adlandırıldı."
  id: "Sebuah biara dekat Kufa; menurut al-Baladhuri, kisah al-Sharqi ibn al-Qatami adalah antara Iyad dan Banu Bahra' ibn Amr ibn al-Haf ibn Quda'ah, dan antara Banu al-Qayn ibn Jisr Harb. Beberapa orang Iyad terbunuh di sana. Ketika pertempuran berakhir, mereka menguburkan mayat mereka di dekat biara. Orang-orang menggali setelah itu, dan tengkorak-tengkorak pun muncul, sehingga biara itu disebut Biara Tengkorak. Muhammad ibn al-Sa'ib al-Kalbi berkata: Malik al-Rimah ibn Mukhraz al-Ayadi membunuh beberapa orang Persia dan mendirikan tengkorak mereka di dekat biara, sehingga disebut Biara Tengkorak."
