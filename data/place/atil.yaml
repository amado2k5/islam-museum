summary:
  ar: "مدينة الخزر وقصبتها، وهما مدينتان على الضفتين، والملك يسكن المدينة التي في الضفة الغربية، والناس يسكنون التي في الشرقية، وبينهما نحو ميلين، ويحيط بهما سور منيع. {cite:nuzhat-al-mushtaq-2002 p. 834}"
  en: "The city of the Khazars and their capital; two cities on the two banks of the river, the king living on the western bank and the people on the eastern, about two miles apart, both walled. {cite:nuzhat-al-mushtaq-2002 p. 834}"
  es: "La ciudad de los jázaros y su capital; dos ciudades situadas en las dos orillas del río, el rey residiendo en la orilla occidental y el pueblo en la oriental, separadas por unos tres kilómetros, ambas amuralladas. {cite:nuzhat-al-mushtaq-2002 p. 834}"
  fr: "La ville des Khazars et leur capitale; deux villes sur les deux rives du fleuve, le roi résidant sur la rive occidentale et le peuple sur la rive orientale, distantes d’environ trois kilomètres, toutes deux fortifiées. {cite:nuzhat-al-mushtaq-2002 p. 834}"
  ur: "خزروں کا شہر اور ان کا دارالحکومت؛ دریا کے دونوں کناروں پر دو شہر، مغربی کنارے پر رہنے والا بادشاہ اور مشرقی طرف کے لوگ، تقریباً دو میل کے فاصلے پر، دونوں دیواروں والے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 834}"
