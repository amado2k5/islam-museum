summary:
  ar: "مدينة ومقاطعة في ولاية بومباي الهندية، وكانت قبل ذلك تُسمى خِرْكي، ثم كانت عاصمة سلطنة أحمد نكر في عهد الملك العنبر، فأحرقها المغول سنة 1612م، ثم أعادوا بناءها وسمّوها أورنغ آباد تكريمًا للإمبراطور أورنغزيب، الذي أقام فيها أثناء ولايته الثانية على الدكن {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
  en: "A town and district of the state of Bombay, with 1,179,404 inhabitants in 1951. Previously called Khirki, it was the capital of the Ahmadnagar sultanate under Malik 'Ambar, was burned by the Mughals in 1612, and was rebuilt and renamed in honour of Aurangzib, who lived there during his second viceroyalty of the Deccan {cite:encyclopaedia-of-islam-2 vol. 1 p. 817}."
