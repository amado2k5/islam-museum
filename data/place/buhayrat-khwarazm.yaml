label: { ar: "بحيرة خوارزم", en: "Lake of Khwarazm", es: "Lago de Khwarazm", fr: "Lac de Khwarezm", ur: "خوارزم کی جھیل" }
summary:
  ar: "بحيرة تحيط بها المفاوز، ويذكر الإدريسي أن دورها نحو ثلاث مائة ميل، ويصب فيها أنهار، وبينها وبين البحر نحو ثماني عشرة مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 699}"
  en: "A lake ringed by desert; al-Idrisi says its circuit is about three hundred miles, several rivers flow into it, and it lies about eighteen stages from the sea. {cite:nuzhat-al-mushtaq-2002 p. 699}"
  es: "Un lago rodeado de desierto; al-Idrisi dice que su perímetro es de aproximadamente trescientas millas, varios ríos desembocan en él y se encuentra a unos dieciocho kilómetros del mar. {cite:nuzhat-al-mushtaq-2002 p. 699}"
  fr: "Un lac cerné par le désert; selon al-Idrisi, son périmètre est d'environ trois cents milles, plusieurs rivières s'y jettent et il se situe à environ dix-huit étapes de la mer. {cite:nuzhat-al-mushtaq-2002 p. 699}"
  ur: "صحرا کی طرف سے گھنٹی ہوئی ایک جھیل؛ الادریسی کا کہنا ہے کہ اس کا دائرہ تقریباً تین سو میل ہے، اس میں کئی دریا بہتے ہیں اور یہ سمندر سے اٹھارہ منزلوں پر واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 699}"
