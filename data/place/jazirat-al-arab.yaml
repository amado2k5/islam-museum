summary:
  ar: "شبه الجزيرة العربية؛ حدّها الهمداني في مقدمة «صفة جزيرة العرب»: غربها شرم أيلة وما طردته السواحل إلى القلزم وفُسطاط مصر، وشرقها عُمان إلى البحرين وكاظمة والبصرة، ورأسها الحجاز ونجد والعروض، وجنوبها عدن على عرض اثنتي عشرة درجة؛ وسماها جزيرة العرب «لأن اللسان العربي في كلها شائع وإن تفاضل»، وقدّر طولها بألف وخمسمائة وثلاثة وثلاثين ميلاً أي ست وسبعين مرحلة وثلثين {cite:sifat-jazirat-al-arab pp. 4-5}؛ وعدّ من ممالكها القديمة وآثارها العظيمة نامط وغمدان وهَكَر ورَيْدان وبَيْنون وقَيْمان وبرك العماد وإرم ذات العماد {cite:sifat-jazirat-al-arab p. 6}."
  en: "The Arabian Peninsula — bounded by al-Hamdani in his Sifa's preamble: Sharm Ayla, the coasts and the Qulzum to Fustat in the west; 'Uman, Bahrayn, Kazima and Basra in the east; Hijaz, Najd and the 'Arud at its head; Aden at 12° south latitude — named Jazirat al-Arab 'because the Arabic tongue is common throughout it', its length reckoned at 1,533 miles or 76⅓ stages {cite:sifat-jazirat-al-arab pp. 4-5} — its ancient monuments, in his register: Na'mit, Ghumdan, Hakar, Raydan, Baynun, Qayman, Bark al-'Imad and Iram Dhat al-'Imad {cite:sifat-jazirat-al-arab p. 6}."
  es: "La península arábiga — delimitada por al-Hamdani en el preámbulo de su Sifa: Sharm Ayla, las costas y el Qulzum hasta Fustat en el oeste; 'Uman, Bahrayn, Kazima y Basora en el este; Hijaz, Najd y el 'Arud en su cabecera; Adén a 12° de latitud sur — llamada Jazirat al-Arab 'porque la lengua árabe es común en toda ella', su longitud calculada en 1533 millas o 76⅓ etapas {cite:sifat-jazirat-al-arab pp. 4-5} — sus monumentos antiguos, en su registro: Na'mit, Ghumdan, Hakar, Raydan, Baynun, Qayman, Bark al-'Imad e Iram Dhat al-'Imad {cite:sifat-jazirat-al-arab p. 6}."
  fr: "La péninsule arabique — délimitée par al-Hamdani dans le préambule de son Sifa: Charm el-Cheikh, les côtes et le Qulzum jusqu’à Fustat à l’ouest; Ouman, Bahreïn, Kazima et Bassora à l’est; le Hedjaz, le Najd et l’Arud à son extrémité; Aden à 12° de latitude sud — nommée Jazirat al-Arab « parce que la langue arabe y est répandue », sa longueur étant estimée à 1 533 milles ou 76⅓ étapes {cite: sifa-jazirat-al-arab pp. 4-5} — ses monuments antiques, dans son registre: Na’mit, Ghumdan, Hakar, Raydan, Baynun, Qayman, Bark al-'Imad et Iram Dhat al-'Imad {cite: sifa-jazirat-al-arab p. 6}."
  ur: "جزیرہ نما عرب — الحمدانی نے اپنے سیفہ کی تمہید میں گھیر رکھا ہے: شرم عائلہ، ساحل اور قلزم سے فوستات مغرب میں؛ مشرق میں عمان، بحرین، کاظمہ اور بصرہ؛ حجاز، نجد اور اس کے سر پر ارود؛ عدن 12° جنوبی عرض البلد پر - جس کا نام جزیرۃ العرب ہے 'کیونکہ اس میں عربی زبان عام ہے'، اس کی لمبائی 1,533 میل یا 76⅓ مراحل میں شمار کی گئی ہے {حوالہ دیں:صفات جزیرۃ العرب صفحہ 4-5} - اس کی قدیم یادگاریں، اس کے رجسٹر، بقرعون، نعمان: قائم، برک العماد اور ارم ذات العماد {حوالہ:صفات جزیرۃ العرب ص۔ 6}۔"
  tr: "Arap Yarımadası; sınırı 'Arap Yarımadası'nın Tanımı' kitabının girişinde El-Hamdani ile sınırlandırılmıştır: batısı Şarm Ayla ve kıyıları Mısır'daki Qulzam ve Fustat'a kadar uzanan bölgedir; doğusunda Amman'dan Bahreyn, Kazmah ve Basra'ya; başı Hicaz, Necd ve El-Arud'dur; güneyi ise on iki derece enlemde Aden'dir; buraya Arap Yarımadası adını verdi çünkü Arapça hepsinde yaygındır, ancak farklılık gösterir.' Uzunluğu bin beş yüz otuz üç mil olarak tahmin edilmiştir, yani yetmiş altı aşama ve üçte iki {alıntı:] Sifat-jazirat-al-Arab, ss. 4-5}; eski krallıkları ve büyük kalıntıları arasında Namat, Ghamdan, Hakar, Ridan, Baynoun, Qayman, Birk al-İmad ve Iram Dhat al-Imad bulunmaktadır. {cite:Sifat-jazirat-al-Arab, s. 6}."
  id: "Semenanjung Arab; batasnya adalah oleh Al-Hamdani dalam pengantar 'Deskripsi Semenanjung Arab': wilayah baratnya adalah Sharm Ayla dan apa yang didorong oleh pantai-pantai hingga Qulzam dan Fustat di Mesir; timurnya adalah Amman ke Bahrain, Kazmah, dan Basra; kepalanya adalah Hejaz, Najd, dan Al-Arud; dan di selatannya adalah Aden pada lintang dua belas derajat; ia menyebutnya Semenanjung Arab 'karena bahasa Arabnya umum di semuanya, meskipun berbeda.' Panjangnya diperkirakan seribu lima ratus tiga puluh tiga mil, yaitu tujuh puluh enam tahap dua pertiga {cite:Sifat-jazirat-al-Arab, hlm. 4-5}; di antara kerajaan kuno dan peninggalan besarnya adalah Namat, Ghamdan, Hakar, Ridan, Baynoun, Qayman, Birk al-Imad, dan Iram Dhat al-Imad. {cite:Sifat-jazirat-al-Arab, hlm. 6}."
