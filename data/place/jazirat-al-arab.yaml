summary:
  ar: "شبه الجزيرة العربية؛ حدّها الهمداني في مقدمة «صفة جزيرة العرب»: غربها شرم أيلة وما طردته السواحل إلى القلزم وفُسطاط مصر، وشرقها عُمان إلى البحرين وكاظمة والبصرة، ورأسها الحجاز ونجد والعروض، وجنوبها عدن على عرض اثنتي عشرة درجة؛ وسماها جزيرة العرب «لأن اللسان العربي في كلها شائع وإن تفاضل»، وقدّر طولها بألف وخمسمائة وثلاثة وثلاثين ميلاً أي ست وسبعين مرحلة وثلثين {cite:sifat-jazirat-al-arab pp. 4-5}."
  en: "The Arabian Peninsula — bounded by al-Hamdani in his Sifa's preamble: Sharm Ayla, the coasts and the Qulzum to Fustat in the west; 'Uman, Bahrayn, Kazima and Basra in the east; Hijaz, Najd and the 'Arud at its head; Aden at 12° south latitude — named Jazirat al-Arab 'because the Arabic tongue is common throughout it', its length reckoned at 1,533 miles or 76⅓ stages {cite:sifat-jazirat-al-arab pp. 4-5}."
