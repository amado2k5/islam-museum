  ar: "نهر بالسواد؛ عند البلاذري أمر المهدي بحفره فحفروا وأحيوا ما عليه من الأرضين وجعلت غلته لصلات أهل الحرمين والنفقة هناك على شرط خمسين سنة ثم مقاسمة النصف."
  en: "A Sawad canal; in al-Baladhuri dug at al-Mahdi's command, its lands revived and its revenue assigned to the sila of the two sanctuaries' people, on a fifty-year compact followed by half-sharecropping."
  es: "Un canal de Sawad, excavado en al-Baladhuri por orden de al-Mahdi, cuyas tierras fueron revitalizadas y sus ingresos asignados a la sila de la gente de los dos santuarios, mediante un pacto de cincuenta años seguido de un sistema de aparcería a medias."
  fr: "Un canal de Sawad; à al-Baladhuri creusé sur ordre d'al-Mahdi, ses terres revitalisées et ses revenus attribués à la sila des habitants des deux sanctuaires, sur un pacte de cinquante ans suivi d'un demi-métayage."
  ur: "ایک سواد نہر؛ البلادھوری میں المہدی کے حکم پر کھدائی کی گئی، اس کی زمینیں دوبارہ زندہ ہوئیں اور اس کی آمدنی دو مقدس مقامات کے لوگوں کے سائلہ کو تفویض کی گئی، پچاس سال کے معاہدے پر جس کے بعد آدھے حصے کی فصل کی گئی۔"
