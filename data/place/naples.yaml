summary:
  ar: "مدينة حسنة أزلية عامرة ذات بضائع وأمتعة، ومنها إلى مرسى أسطابة الماء الكثير، وبينها وبين جبل النار مسافة، ويصفها الإدريسي بالشهرة وكثرة الأسواق. {cite:nuzhat-al-mushtaq-2002 p. 757}"
  en: "A fine, ancient, populous city with goods and wares, with a harbour of abundant water; al-Idrisi describes its markets and fame. {cite:nuzhat-al-mushtaq-2002 p. 757}"
  es: "Una hermosa, antigua y populosa ciudad con bienes y mercancías, y un puerto de abundante agua; al-Idrisi describe sus mercados y su fama. {cite:nuzhat-al-mushtaq-2002 p. 757}"
  fr: "Une belle et ancienne ville peuplée, riche en marchandises et en produits, dotée d'un port aux eaux abondantes; al-Idrisi décrit ses marchés et sa renommée. {cite:nuzhat-al-mushtaq-2002 p. 757}"
  ur: "ایک عمدہ، قدیم، آبادی والا شہر جس میں سامان اور سامان، وافر پانی کی بندرگاہ کے ساتھ؛ الادریسی اس کے بازاروں اور شہرت کو بیان کرتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 757}"
