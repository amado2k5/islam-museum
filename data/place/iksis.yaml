summary:
  ar: "قرية بغياض فيها أسود ظاهرة تعدو على الناس، ويذكر الإدريسي صيد الأسود فيها، وتبعد عن سلا مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 238}"
  en: "A village with thickets where lions are seen and attack people, according to al-Idrisi, who also describes lion hunting there; one stage from Sala. {cite:nuzhat-al-mushtaq-2002 p. 238}"
  es: "Un pueblo con matorrales donde se ven leones que atacan a la gente, según al-Idrisi, quien también describe la caza de leones en el lugar; una etapa desde Sala. {cite:nuzhat-al-mushtaq-2002 p. 238}"
  fr: "Un village aux fourrés denses où l'on aperçoit des lions qui attaquent les habitants, selon al-Idrisi, qui décrit également la chasse au lion dans ce lieu; à une étape de Sala. {cite:nuzhat-al-mushtaq-2002 p. 238}"
  ur: "الادریسی کے مطابق، جو وہاں شیر کے شکار کو بھی بیان کرتا ہے، کے مطابق ایک گاؤں جہاں شیر نظر آتے ہیں اور لوگوں پر حملہ کرتے ہیں۔ سالا سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 238}"
  tr: "Bağiad'da bir köy, aslanların görünür ve insanlara karşı saldırgandır; Al-Idrisi orada aslanların avlandığını belirtir, bu da Salé'ye bir adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 238}"
  id: "Sebuah desa di Baghiad, di mana singa terlihat dan agresif terhadap orang-orang, dan Al-Idrisi menyebutkan bahwa singa diburu di sana, dan itu hanya selangkah dari Salé. {cite:Nuzhat-al-Mushtaq-2002 hlm. 238}"
