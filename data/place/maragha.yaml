summary:
  ar: "مدينة بأذربيجان كانت تدعى أفراهروذ فعسكر مروان بن محمد بالقرب منها منصرفه من غزوة موقان وجيلان وكان فيها سرجين كثير فكانت دوابه ودواب أصحابه تمرغ فيها فجعلوا يقولون ائتوا قرية المراغة ثم حذف الناس قرية وقالوا مراغة وكان أهلها ألجأوها إلى مروان فابتاعها وتآلف وكلا الناس فكثروا فيها للتعزز وعمروها ثم قبضت مع ضياع بني أمية فصارت لبعض بنات الرشيد ولما عاث الوجناء الأزدي وصدقة بن علي ولى خزيمة بن خازم أرمينية وأذربيجان في خلافة الرشيد فبنى سورها ومصّرها وأنزلها جنداً كثيفاً ولما ظهر بابك لجأ الناس إليها ورمّ سورها عمال المأمون منهم أحمد بن الجنيد وعلي بن هشام ثم نزل الناس ربضها وحصن."
  en: "A city of Azerbaijan once called Afrahruudh; Marwan ibn Muhammad camped near it returning from the Muqan-Jilan raid, its great dung-pits gave his mules their rolling-ground — 'the maragha village', then the word village dropped — its people commended it to Marwan who bought and peopled it; seized among Umayyad estates for a daughter of al-Rashid; after al-Wajna' al-Azdi and Sadaqa ibn Ali's ravaging, Khuzayma ibn Khazim walled and garrisoned it under al-Rashid, Babak's rise made it a refuge, and al-Ma'mun's agents Ahmad ibn al-Junayd and Ali ibn Hisham repaired the wall while its suburb was fortified."
  es: "Una ciudad de Azerbaiyán que una vez se llamó Afrahruudh; Marwan ibn Muhammad acampó cerca de ella al regresar de la incursión de Muqan-Jilan, sus grandes fosas de estiércol proporcionaron a sus mulas su terreno de rodadura — 'la aldea maragha', luego se eliminó la palabra aldea - su gente se la recomendó a Marwan, quien la compró y la pobló; tomada entre las propiedades omeyas para una hija de al-Rashid; después de la devastación de al-Wajna' al-Azdi y Sadaqa ibn Ali, Khuzayma ibn Khazim la amuralló y la guarneció bajo al-Rashid, el ascenso de Babak la convirtió en un refugio, y los agentes de al-Ma'mun, Ahmad ibn al-Junayd y Ali ibn Hisham, repararon la muralla mientras se fortificaba su suburbio."
  fr: "Afrahruudh était une ville d'Azerbaïdjan. Marwan ibn Muhammad y campa à son retour du raid de Muqan-Jilan. Ses vastes fosses à fumier offraient à ses mules un terrain de pâturage. Afrahruudh était alors appelée « le village maragha », puis le mot « village » disparut. Ses habitants la recommandèrent à Marwan, qui l'acheta et la peupla. Elle fut saisie parmi les domaines omeyyades pour une fille d'al-Rashid. Après les ravages d'al-Wajna' al-Azdi et de Sadaqa ibn Ali, Khuzayma ibn Khazim l'entoura de murs et la garnit sous al-Rashid. L'ascension de Babak en fit un refuge, et les agents d'al-Ma'mun, Ahmad ibn al-Junayd et Ali ibn Hisham, réparèrent les murs tandis que sa banlieue était fortifiée."
  ur: "آذربائیجان کا ایک شہر جو کبھی افرودھ کہلاتا تھا۔ مروان ابن محمد نے مقن جیلان کے حملے سے واپس آتے ہوئے اس کے قریب ڈیرہ ڈالا، اس کے بڑے بڑے گوبر کے گڑھوں نے اس کے خچروں کو اپنی لپیٹ میں لے لیا - 'مراگہ گاؤں'، پھر گاؤں کا لفظ گرا - اس کے لوگوں نے مروان کو اس کی تعریف کی جس نے اسے خریدا اور آباد کیا۔ اموی جاگیروں میں الرشید کی بیٹی کے لیے قبضہ وجنا العزدی اور صدقہ ابن علی کی تباہی کے بعد، خزیمہ بن خزیم نے اسے الرشید کے زیر سایہ دیوار بنالیا، بابک کے عروج نے اسے پناہ گاہ بنا دیا، اور الممون کے ایجنٹوں احمد بن الجنید اور علی ابن ہشام نے دیوار کی مرمت کی جب کہ اس کی ذیلی دیوار کی مرمت کی گئی۔"
  tr: "Azerbaycan'da Afrahrud adında bir şehir. Mervan ibn Muhammed, Muqan ve Cilen savaşlarından sonra oradan ayrılarak yakınında kamp kurdu. Orada birçok eyerci vardı, atları ve arkadaşlarının hayvanları orada dolaşıyor, 'Maragha köyüne gelin.' diyordu. Sonra halk başka bir köyü dışlayıp Maragha adını verdi. Halkı Marwan'a sığındı, o da köyü satın aldı ve halkla ittifak kurdu, halkın sayısı artarak onu güçlendirdi ve geliştirdi. Sonra U'nun kaybıyla ele geçirildi Mayyadlar ve burası el-Reşid'in bazı kızlarının mülkü oldu. Al-Wajna'al-Azdi ve Sadaqah ibn Ali, el-Reşid'in halifeliği sırasında Ermenistan ve Azerbaycan'ı yönettiğinde, surlarını ve şehrini inşa etti ve büyük bir ordu konuşlandırdı. Kapınız ortaya çıktığında, insanlar oraya sığındı ve el-Me'mun'un komutanları, aralarında Ahmed bin el-Cunayd ve Ali bin Hişam da vardı, onun banliyösünde ve kalesinde yerleştiler."
  id: "Sebuah kota di Azerbaijan bernama Afrahrud. Marwan ibn Muhammad berkemah di dekatnya, meninggalkan kota setelah pertempuran Muqan dan Jilan. Ada banyak tukang pelana di sana, dan kuda-kudanya serta hewan milik teman-temannya berkeliaran di sana, berkata, 'Datanglah ke desa Maragha.' Kemudian orang-orang mengusir desa lain dan menamainya Maragha. Penduduknya berlindung pada Marwan, yang membelinya, dan orang-orang itu bersekutu dengan rakyat, yang jumlahnya bertambah untuk memperkuat dan mengembangkannya. Kemudian desa itu diambil alih dengan hilangnya suku Umaja yyad, dan menjadi milik beberapa putri al-Rashid. Ketika al-Wajna' al-Azdi dan Sadaqah ibn Ali memerintah Armenia dan Azerbaijan selama kekhalifahan al-Rashid, ia membangun tembok dan kotanya serta menempatkan pasukan besar. Ketika gerbangmu muncul, orang-orang mencari perlindungan di sana, dan para komandan al-Ma'mun, termasuk Ahmad ibn al-Junayd dan Ali ibn Hisham, menetap di pinggiran dan bentengnya."
