summary:
  ar: "مدينة بأذربيجان كانت تدعى أفراهروذ فعسكر مروان بن محمد بالقرب منها منصرفه من غزوة موقان وجيلان وكان فيها سرجين كثير فكانت دوابه ودواب أصحابه تمرغ فيها فجعلوا يقولون ائتوا قرية المراغة ثم حذف الناس قرية وقالوا مراغة وكان أهلها ألجأوها إلى مروان فابتاعها وتآلف وكلا الناس فكثروا فيها للتعزز وعمروها ثم قبضت مع ضياع بني أمية فصارت لبعض بنات الرشيد ولما عاث الوجناء الأزدي وصدقة بن علي ولى خزيمة بن خازم أرمينية وأذربيجان في خلافة الرشيد فبنى سورها ومصّرها وأنزلها جنداً كثيفاً ولما ظهر بابك لجأ الناس إليها ورمّ سورها عمال المأمون منهم أحمد بن الجنيد وعلي بن هشام ثم نزل الناس ربضها وحصن."
  en: "A city of Azerbaijan once called Afrahruudh; Marwan ibn Muhammad camped near it returning from the Muqan-Jilan raid, its great dung-pits gave his mules their rolling-ground — 'the maragha village', then the word village dropped — its people commended it to Marwan who bought and peopled it; seized among Umayyad estates for a daughter of al-Rashid; after al-Wajna' al-Azdi and Sadaqa ibn Ali's ravaging, Khuzayma ibn Khazim walled and garrisoned it under al-Rashid, Babak's rise made it a refuge, and al-Ma'mun's agents Ahmad ibn al-Junayd and Ali ibn Hisham repaired the wall while its suburb was fortified."
