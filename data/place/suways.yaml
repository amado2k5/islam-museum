summary:
  ar: مدينتان كانتا على القلزم، وهما الآن أكثرهما خراب، ويذكر الإدريسي أن أهلهما كانوا يشربون من عين السويس، وهي عين زعاق لا يسيغها الشارب. {cite:nuzhat-al-mushtaq-2002 p. 348}
  en: Two towns that stood at Qulzum, now mostly in ruins; al-Idrisi says their people drank from the Suways spring, a brackish spring hard to drink. {cite:nuzhat-al-mushtaq-2002 p. 348}
  es: "Dos pueblos que se alzaban en Qulzum, ahora en su mayoría en ruinas; al-Idrisi dice que sus habitantes bebían del manantial de Suways, un manantial de agua salobre de difícil consumo. {cite:nuzhat-al-mushtaq-2002 p. 348}"
  fr: "Deux villes qui se dressaient à Qulzum, aujourd'hui pour la plupart en ruines; al-Idrisi rapporte que leurs habitants buvaient l'eau de la source de Suways, une source saumâtre difficile à boire. {cite:nuzhat-al-mushtaq-2002 p. 348}"
  ur: "دو قصبے جو قلزم پر کھڑے تھے، اب زیادہ تر کھنڈرات میں۔ الادریسی کا کہنا ہے کہ ان کے لوگوں نے سوئیس کے چشمے سے پیا تھا، ایک نمکین چشمہ جسے پینا مشکل تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 348}"
  tr: "Qalzam'da iki şehir bulunuyordu ve bunlar şimdi en harabe olmuş şehirlerdir. El-İdrisi, halklarının İçenlerin tahammül etmediği Ayn Süveyş pınarından su içtiğini belirtir. {kaynak:Nuzhat-al-mushtaq-2002 s. 348}"
  id: "Dua kota terletak di Qalzam, yang kini menjadi yang paling rusak. Al-Idrisi menyebutkan bahwa orang-orang mereka minum dari Ain Suez, yang merupakan mata air yang tidak ditoleransi oleh peminumnya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 348}"
