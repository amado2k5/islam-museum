summary:
  ar: "سرخس مدينة بخراسان؛ قاتلها عبد الله بن خازم ثم طلب مرزبانها زاذويه الصلح على إيمان مائة رجل وتسليم النساء فصارت ابنته في سهم ابن خازم وسماها ميشاء ويقال إنه سمى المائة ولم يسم نفسه فقتل ودخلت عنوة وغلب ابن خازم على أرضها."
  en: "Sarakhs of Khurasan; fought by Ibn Khazim till its marzban Zadhuya truced on a hundred men's aman and the surrender of its women — his daughter becoming Ibn Khazim's Maysha' — or, in the other telling, killed for excluding himself, the town then taken by force."
  es: "Sarakhs de Jorasán; combatida por Ibn Khazim hasta que su marzban Zadhuya pactó una tregua tras la rendición de cien hombres y sus mujeres —su hija se convirtió en la Maysha' de Ibn Khazim— o, según otra versión, fue asesinado por excluirse a sí mismo, y la ciudad fue tomada por la fuerza."
  fr: "Les Sarakhs du Khorasan; combattus par Ibn Khazim jusqu'à ce que son marzban Zadhuya fasse trêve sur un aman de cent hommes et la reddition de ses femmes — sa fille devenant la Maysha' d'Ibn Khazim — ou, selon une autre version, tué pour s'être exclu, la ville ensuite prise par la force."
  ur: "خراسان کے سرخ؛ ابن خزیم سے لڑا یہاں تک کہ اس کے مرزبن زدھویہ نے سو مردوں کی امان اور اس کی عورتوں کے ہتھیار ڈال دیے - اس کی بیٹی ابن خزیم کی مائیشہ بن گئی - یا دوسری بات میں، اپنے آپ کو چھوڑنے کی وجہ سے قتل کر دیا گیا، پھر اس شہر کو زبردستی لے لیا گیا۔"
