summary:
  ar: "مدينة عامرة بالأتراك ممتدة البساط، فيها الحنطة والأرز، وبها معادن الحديد، وهي على نهر غماش، وأهلها أنجد الأتراك وأشجعهم، وتبعد عن بنجار ست مراحل. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  en: "A populous town of Turks with wide plains, wheat and rice, iron mines, on the Ghamash river; its people are the bravest Turks; six stages from Banjar. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  es: "Una populosa ciudad turca con extensas llanuras, trigo y arroz, minas de hierro, a orillas del río Ghamash; sus habitantes son los turcos más valientes; a seis etapas de Banjar. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  fr: "Ville turque peuplée, entourée de vastes plaines, de blé et de riz, de mines de fer, sur les rives du fleuve Ghamash; ses habitants sont les Turcs les plus courageux; à six étapes de Banjar. {cite:nuzhat-al-mushtaq-2002 p. 716}"
  ur: "ترکوں کا ایک آبادی والا قصبہ جس میں دریائے گھمش پر وسیع میدانی علاقے، گندم اور چاول، لوہے کی کانیں ہیں۔ اس کے لوگ سب سے بہادر ترک ہیں۔ بنجر سے چھ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 716}"
  tr: "Geniş bir halıyla kaplı, buğday ve pirinç, demir cevheri içeren ve Ghamash Nehri üzerinde yer alan Türklerle dolu bir şehir. Halkı en cesur ve en cesur Türklerdir ve Banjar'a altı adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 716}"
  id: "Sebuah kota yang penuh dengan orang Turki, terbentang dengan karpet lebar, berisi gandum dan padi, bijih besi, dan terletak di Sungai Ghamash. Penduduknya adalah orang Turki paling berani dan berani, dan jaraknya enam langkah dari Banjar. {cite:Nuzhat-al-Mushtaq-2002 hlm. 716}"
