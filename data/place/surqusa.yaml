summary:
  ar: "من مشاهير مدن صقلية وأعيانها، يقصدها التجار من كل بلد، وفيها مرسيان أحدهما شمالي وأشهر، والآخر جنوبي، ولها إقليم طائل. {cite:nuzhat-al-mushtaq-2002 p. 597}"
  en: "One of the famous cities of Sicily, visited by merchants from every land; it has two harbours, the northern one more famous, and a rich district around it. {cite:nuzhat-al-mushtaq-2002 p. 597}"
  es: "Una de las ciudades más famosas de Sicilia, visitada por mercaderes de todas partes; cuenta con dos puertos, el norteño el más conocido, y un rico distrito a su alrededor. {cite:nuzhat-al-mushtaq-2002 p. 597}"
  fr: "L'une des villes les plus célèbres de Sicile, visitée par des marchands venus de tous les pays; elle possède deux ports, celui du nord étant le plus renommé, et un riche quartier qui l'entoure. {cite:nuzhat-al-mushtaq-2002 p. 597}"
  ur: "سسلی کے مشہور شہروں میں سے ایک، ہر ملک کے تاجروں نے دورہ کیا؛ اس کے دو بندرگاہیں ہیں، شمالی ایک زیادہ مشہور، اور اس کے آس پاس ایک امیر ضلع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 597}"
  tr: "Sicilya'nın ünlü şehirlerinden ve önemli figürlerinden biri olan bu bölge, her ülkeden tüccarları çeker; iki marinası vardır: biri kuzeyde, diğeri en ünlüsü, diğeri ise güneyde; ayrıca geniş bir bölgeye sahiptir. {kaynak:nuzhat-al-mushtaq-2002 s. 597}"
  id: "Salah satu kota terkenal dan tokoh penting di Sisilia, menarik pedagang dari berbagai negara, kota ini memiliki dua marina: satu di utara, yang paling terkenal, dan satu lagi di selatan, serta memiliki wilayah yang luas. {cite:Nuzhat-al-Mushtaq-2002 hlm. 597}"
