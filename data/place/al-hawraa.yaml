summary:
  ar: "قرية لها معدن يقطعون فيه الأبارم ⁦(أحجار الرحى)⁩، تُحمل إلى أقطار الأرض، وشرب أهلها من آبار عذبة. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  en: "A village with a quarry of millstones carried to the far lands; its people drink from sweet wells. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  es: "Un pueblo con una cantera de piedras de molino transportadas a tierras lejanas; sus habitantes beben de pozos de agua dulce. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  fr: "Un village possédant une carrière de meules dont la production était transportée jusqu'aux contrées lointaines; ses habitants s'abreuvent à des puits d'eau douce. {cite:nuzhat-al-mushtaq-2002 p. 350}"
  ur: "ایک گاؤں جس میں چکی کے پتھروں کی کھدائی دور دراز کی زمینوں تک جاتی ہے۔ اس کے لوگ میٹھے کنوؤں سے پیتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 350}"
  tr: "Değirmen taşlarının kesildiği, dünyanın uçlarına taşındığı ve sakinlerinin taze kuyulardan su içtiği bir maden köyü. {kaynak:nuzhat-al-mushtaq-2002 s. 350}"
  id: "Sebuah desa dengan mineral di mana batu penggilingan dipotong, dibawa ke ujung bumi, dan penduduknya minum dari sumur segar. {cite:nuzhat-al-mushtaq-2002 hlm. 350}"
