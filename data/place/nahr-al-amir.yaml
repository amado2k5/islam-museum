summary:
  ar: "نهر الأمير بالبصرة حفره المنصور ثم وهبه لابنه جعفر وكان يقال نهر أمير المؤمنين ثم قيل نهر الأمير ثم ابتاعه الرشيد وأقطع منه وباع."
  en: "Nahr al-Amir at Basra, dug by al-Mansur and gifted to his son Ja'far — first 'the Commander of the Faithful's canal', then 'the prince's'; al-Rashid bought it, parcelled grants from it and sold."
  es: "El Nahr al-Amir en Basora, excavado por al-Mansur y regalado a su hijo Ja'far —primero \"el canal del Comandante de los Creyentes\", luego \"el del príncipe\"—, fue comprado por al-Rashid, quien repartió concesiones provenientes del mismo y lo vendió."
  fr: "Le Nahr al-Amir à Bassora, creusé par al-Mansur et offert à son fils Ja'far — d'abord « le canal du Commandeur des Croyants », puis « celui du prince »; al-Rashid l'acheta, en préleva des donations et le vendit."
  ur: "بصرہ میں نہر الامیر، المنصور نے کھودا اور اپنے بیٹے جعفر کو تحفے میں دیا - پہلے 'وفادار کی نہر کا کمانڈر'، پھر 'شہزادوں کا'؛ الرشید نے اسے خریدا، اس سے گرانٹ پارسل کی اور بیچ دیا۔"
  tr: "Basra'daki Amir Nehri el-Mansur tarafından kazıldı, sonra oğlu Ja'far'a verildi. Nehre Müminlerin Komutanı Nehri denildi, sonra Emir Nehri olarak adlandırıldı, ardından el-Reşid satın aldı, kesti ve sattı."
  id: "Sungai Amir di Basra digali oleh al-Mansur, kemudian diberikan kepada putranya Ja'far. Sungai ini disebut Sungai Komandan Orang Beriman, kemudian disebut Sungai Amir, kemudian al-Rashid membelinya, memotongnya, dan menjualnya."
