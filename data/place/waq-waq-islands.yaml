label: { ar: "جزائر الواق واق", en: "The Waq Waq islands", es: "Las islas Waq Waq", fr: "Les îles Waq Waq", ur: "وقوق جزائر", tr: "Cezayir El-Vak", id: "Aljazair Al-Waq" }
summary:
  ar: "سلسلة جزر يصفها الإدريسي بأنها متصلة بجزر السيلا، وأن أحدا لا يعرف ما وراءها، وأن الذهب فيها كثير والأبنوس فيها من أجود ما يُعرف، وأن التجار يدخلون إليها ويسبكون الذهب فيها {cite:nuzhat-al-mushtaq-2002 p. 91}، {cite:nuzhat-al-mushtaq-2002 p. 92}. وعند ابن خرداذبه: بلاد الواقواق كثيرة الذهب حتى إن أهلها يتخذون سلاسل كلابهم وأطواق قرودهم من ذهب ويأتون بالقمص المنسوجة بالذهب للبيع وبها الأبنوس الجيد {cite:masalik-mamalik-ibn-khurdadhbih p. 77}."
  en: "A chain of islands which al-Idrisi says connects with the Sila islands, beyond which no one knows. He reports much gold there and ebony of unmatched quality, and that merchants enter to smelt gold {cite:nuzhat-al-mushtaq-2002 p. 91}, {cite:nuzhat-al-mushtaq-2002 p. 92}."
  es: "Una cadena de islas que, según al-Idrisi, conecta con las islas Sila, más allá de las cuales nadie sabe. Informa que allí hay mucho oro y ébano de calidad inigualable, y que los comerciantes entran para fundir oro {cite:nuzhat-al-mushtaq-2002 p. 91}, {cite:nuzhat-al-mushtaq-2002 p. 92}."
  fr: "Une chaîne d'îles qui, selon al-Idrisi, est reliée aux îles de Sila, au-delà de laquelle nul ne sait rien. Il rapporte la présence d'or en abondance et d'ébène d'une qualité incomparable, et que des marchands s'y rendent pour fondre l'or {cite:nuzhat-al-mushtaq-2002 p. 91}, {cite:nuzhat-al-mushtaq-2002 p. 92}."
  ur: "جزائر کی ایک زنجیر جس کے بارے میں الادریسی کا کہنا ہے کہ سیلا کے جزیروں سے جوڑتا ہے، جس سے آگے کوئی نہیں جانتا۔ وہ وہاں بہت زیادہ سونا اور بے مثال معیار کے آبنوس کی اطلاع دیتا ہے، اور یہ کہ سوداگر سونا گلانے کے لیے داخل ہوتے ہیں۔ 91}، {حوالہ: نزہت المشتاق-2002 ص۔ 92}۔"
  tr: "El-İdrisi tarafından Sila Adaları'na bağlı olarak tanımlanan, kimsenin ötesinde ne olduğunu bilmediği, en iyi bilinen altın ve abanoz bol miktarda bulunduğu, tüccarların buraya girip altın bastığı bir ada zinciri {cite:nuzhat-al-mushtaq-2002 s. 91}, {cite:Nuzhat-al-mushtaq-2002 s. 92}. İbn Khordadbeh'e göre: Vakvaq toprakları altın açısından öyle zengindir ki, sakinleri köpek zincirlerini ve maymun tasmalarını altından yapar ve ince abanoz içeren altın dokuma gömlekler getirirler {cite:masalik-mamalik-ibn-khurdadhbih s. 77}."
  id: "Rangkaian pulau yang digambarkan oleh al-Idrisi sebagai terhubung dengan Kepulauan Sila, yang tidak diketahui apa yang ada di baliknya, bahwa terdapat emas dan ebony yang melimpah di antara yang terbaik yang diketahui, dan bahwa para pedagang masuk ke sana dan mencetak emas {cite:nuzhat-al-mushtaq-2002 hlm. 91}, {cite:Nuzhat-al-mushtaq-2002 hlm. 92}. Menurut Ibn Khordadbeh: Tanah Waqwaq kaya akan emas, sehingga penduduknya membuat rantai anjing dan kalung monyet dari emas dan menjual kemeja anyaman emas yang berisi ebony halus {cite:masalik-mamalik-ibn-khurdadhbih hlm. 77}."
