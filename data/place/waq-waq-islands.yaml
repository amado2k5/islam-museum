label: { ar: "جزائر الواق واق", en: "The Waq Waq islands" }
summary:
  ar: "سلسلة جزر يصفها الإدريسي بأنها متصلة بجزر السيلا، وأن أحدا لا يعرف ما وراءها، وأن الذهب فيها كثير والأبنوس فيها من أجود ما يُعرف، وأن التجار يدخلون إليها ويسبكون الذهب فيها {cite:nuzhat-al-mushtaq-2002 p. 91}، {cite:nuzhat-al-mushtaq-2002 p. 92}. وعند ابن خرداذبه: بلاد الواقواق كثيرة الذهب حتى إن أهلها يتخذون سلاسل كلابهم وأطواق قرودهم من ذهب ويأتون بالقمص المنسوجة بالذهب للبيع وبها الأبنوس الجيد {cite:masalik-mamalik-ibn-khurdadhbih p. 77}."
  en: "A chain of islands which al-Idrisi says connects with the Sila islands, beyond which no one knows. He reports much gold there and ebony of unmatched quality, and that merchants enter to smelt gold {cite:nuzhat-al-mushtaq-2002 p. 91}, {cite:nuzhat-al-mushtaq-2002 p. 92}."
