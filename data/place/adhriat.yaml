label: { ar: "درعا", en: "Adhriat (Der'a)", es: "Adhriat (Der'a)", fr: "Adhriat (Der'a)" }
summary:
  ar: "مدينة حوران الرئيسية في جنوب سوريا، تبعد نحو مئة كيلومتر جنوب دمشق، وهي أدرعات الكتاب المقدس؛ مر بها الفرس والصليبيون والحجاج، وصارت بعد السكة الحديد الحجازية محطة مهمة، واحتلها البريطانيون سنة 1918 {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  en: "The chief town of the Hawran in southern Syria, about 106 km south of Damascus and the Edrei of the Bible. It was sacked by the Persians around 613-614, had a Jewish colony before the hijra, was called the City of Bernard d'Etampes by the Crusaders, and became a railway junction on the Hijaz line; the British occupied it on 28 September 1918 {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  es: "La ciudad principal de Hawran, en el sur de Siria, a unos 106 km al sur de Damasco y de Edrei, mencionada en la Biblia. Fue saqueada por los persas alrededor del 613-614, albergó una colonia judía antes de la Hégira, fue llamada Ciudad de Bernardo de Étampes por los cruzados y se convirtió en un nudo ferroviario en la línea del Hiyaz; los británicos la ocuparon el 28 de septiembre de 1918 {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  fr: "Ville principale du Hawran, dans le sud de la Syrie, à environ 106 km au sud de Damas et d'Edrei (mentionnée dans la Bible), elle fut pillée par les Perses vers 613-614. Elle abritait une colonie juive avant l'Hégire, fut appelée « Cité de Bernard d'Étampes » par les Croisés et devint un nœud ferroviaire sur la ligne du Hedjaz. Les Britanniques l'occupèrent le 28 septembre 1918 (source: Encyclopaedia of Islam, vol. 1, p. 213)."
