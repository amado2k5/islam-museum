label: { ar: "درعا", en: "Adhriat (Der'a)" }
summary:
  ar: "مدينة حوران الرئيسية في جنوب سوريا، تبعد نحو مئة كيلومتر جنوب دمشق، وهي أدرعات الكتاب المقدس؛ مر بها الفرس والصليبيون والحجاج، وصارت بعد السكة الحديد الحجازية محطة مهمة، واحتلها البريطانيون سنة 1918 {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
  en: "The chief town of the Hawran in southern Syria, about 106 km south of Damascus and the Edrei of the Bible. It was sacked by the Persians around 613-614, had a Jewish colony before the hijra, was called the City of Bernard d'Etampes by the Crusaders, and became a railway junction on the Hijaz line; the British occupied it on 28 September 1918 {cite:encyclopaedia-of-islam-2 vol. 1 p. 213}."
