label: { ar: "جزيرة النمنج", en: "Namnaj Island", es: "Isla Namnaj", fr: "Île de Namnaj", ur: "نامنج جزیرہ", tr: "Al-Namang Adası", id: "Pulau Al-Namang" }
summary:
  ar: "جزيرة في البحر الشرقي، يذكر الإدريسي عن صاحب كتاب العجائب أن فيها قوماً لهم أذناب، ولهم ملك منهم. {cite:nuzhat-al-mushtaq-2002 p. 214}"
  en: "An island in the eastern sea, where, according to al-Idrisi's source in the Book of Marvels, a people with tails live under a king of their own. {cite:nuzhat-al-mushtaq-2002 p. 214}"
  es: "Una isla en el mar oriental, donde, según la fuente de al-Idrisi en el Libro de las Maravillas, vive un pueblo con colas bajo el reinado de un rey propio. {cite:nuzhat-al-mushtaq-2002 p. 214}"
  fr: "Une île de la mer orientale où, selon la source d'al-Idrisi dans le Livre des Merveilles, vit un peuple doté de queues, gouverné par son propre roi. {cite:nuzhat-al-mushtaq-2002 p. 214}"
  ur: "مشرقی سمندر میں ایک جزیرہ، جہاں، بُک آف مارولز میں الادریسی کے ماخذ کے مطابق، دم والے لوگ اپنے ہی بادشاہ کے ماتحت رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 214}"
  tr: "Doğu denizinde bir ada. El-İdrisi, El-Acayib kitabının yazarından, aralarında kuyruklu ve kral olan insanlar olduğunu belirtir. {alıntı:Nuzhat-al-mushtaq-2002 s. 214}"
  id: "Sebuah pulau di laut timur. Al-Idrisi menyebutkan dari penulis buku Al-Ajaib bahwa ada orang-orang yang memiliki ekor dan raja di antara mereka. {cite:nuzhat-al-mushtaq-2002 hlm. 214}"
