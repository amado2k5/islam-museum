label: { ar: "سمندر ⁦(بحر الخزر)⁩", en: "Samandar (Caspian)", es: "Samandar (Caspio)", fr: "Samandar (Caspienne)", ur: "سمندر ⁦(کیسپیئن)⁩" }
summary:
  ar: "مدينة كانت فيما سلف مدينة عظيمة من بناء أنوشروان، وكان بها من الأشجار والكروم والزراعات ما يقصر الوصف عنه، ثم غيرتها قبيلة الروس فأهلكتها، ومن سمندر إلى باب الأبواب أربعة أيام. {cite:nuzhat-al-mushtaq-2002 p. 835}"
  en: "Once a great city built by Anushirwan with trees, vines and fields beyond description; the Rus tribe later destroyed and changed it. Four days from the Gate of the Gates. {cite:nuzhat-al-mushtaq-2002 p. 835}"
  es: "Antaño una gran ciudad construida por Anushirwan, con árboles, vides y campos indescriptibles; la tribu Rus la destruyó y transformó posteriormente. A cuatro días de la Puerta de las Puertas. {cite:nuzhat-al-mushtaq-2002 p. 835}"
  fr: "Jadis une grande cité bâtie par Anushirwan, entourée d'arbres, de vignes et de champs à perte de vue, elle fut ensuite détruite et transformée par la tribu Rus. À quatre jours de marche de la Porte des Portes. {cite:nuzhat-al-mushtaq-2002 p. 835}"
  ur: "ایک بار ایک عظیم شہر جو انوشیروان نے درختوں، بیلوں اور کھیتوں کے ساتھ تعمیر کیا تھا جس کی تفصیل نہیں ہے۔ بعد میں روسی قبیلے نے اسے تباہ کر دیا اور اسے تبدیل کر دیا۔ گیٹ آف دی گیٹ سے چار دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 835}"
