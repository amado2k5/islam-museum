summary:
  ar: "مدينة كانت من أحسن البلاد منظراً وأطيبها هواءً وثرى، فيها بساتين وجنات، فتحها المسلمون وقتلوا بها ملكها العظيم، وتبعد عن القيروان مراحل. {cite:nuzhat-al-mushtaq-2002 p. 283}"
  en: "Once among the most pleasing cities of the region, with fine air, soil, gardens and orchards; al-Idrisi says Muslims took it and killed its great king. Several stages from Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 283}"
  es: "Antaño una de las ciudades más agradables de la región, con aire puro, tierra fértil, jardines y huertos; al-Idrisi afirma que los musulmanes la conquistaron y asesinaron a su gran rey. Varias etapas desde Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 283}"
  fr: "Autrefois l'une des villes les plus agréables de la région, avec son air pur, son sol fertile, ses jardins et ses vergers, elle fut conquise par les musulmans qui tuèrent son grand roi, selon al-Idrisi. Elle se situe à plusieurs étapes de Qayrawan. {cite:nuzhat-al-mushtaq-2002 p. 283}"
