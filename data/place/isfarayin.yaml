summary:
  ar: "مدينة في خراسان بين نيسابور وجرجان، منها الأستاذ أبو إسحاق الإسفراييني الذي دُفن بمشهدها المعروف، وإليها فرّ تلميذه أبو منصور البغدادي فمات بها سنة ٤٢٩هـ ودُفن إلى جانب شيخه {cite:shadharat-dhahab p. 210} {cite:tabaqat-shafiiyya-subki pp. 238-239}."
  en: "A town of Khurasan between Nishapur and Gurgan; the home of Abu Ishaq al-Isfarayini, and the refuge of his pupil Abd al-Qahir al-Baghdadi, who died there in 429/1038 and was buried beside his teacher {cite:shadharat-dhahab p. 210} {cite:tabaqat-shafiiyya-subki pp. 238-239}."
  ur: "خراسان کا ایک شہر نیشاپور اور جرجان کے درمیان؛ ابو اسحاق اسفرائینی کا وطن اور ان کے شاگرد عبدالقاہر بغدادی کی پناہ گاہ جہاں وہ 429ھ میں فوت ہوئے اور اپنے استاد کے پہلو میں دفن ہوئے {cite:shadharat-dhahab p. 210} {cite:tabaqat-shafiiyya-subki pp. 238-239}۔"
