id: place/al-hadath
class: place
kind: city
label: { ar: "الحدث", en: "al-Hadath (al-Mahdiyya)" }
summary:
  ar: "الحدث ثغر جُزري عند درب الحدث الذي سمّاه بنو أمية السلامة تطيّراً؛ حصنها القديم فتحه حبيب بن مسلمة أيام عمر، وارتاد الحسن بن قحطبة موضع مدينتها عائداً من غزاة سنة 162 فأمر المهدي ببنائها قبل طرسوس فأنشأها علي بن سليمان بن علي بلبن فسُمّيت المحمدية ثم المهدية والحمدية لوفاة المهدي عند فراغها سنة 169، وفرض لها أربعة آلاف مقاتل من الشام والجزيرة وخراسان بأربعين دينار عطاء وثلاثمائة درهم للرجل ونُقل إليها ألفا رجل من ملطية وشمشاط وسميساط وكيسوم ودلوك ورعبان؛ انهار بناؤها بالثلوج فاحتلّها الروم ثم أعاد بناءها وتحصينها وشحنها الرشيد."
  en: "al-Hadath, the Jaziran frontier-city at the Darb al-Hadath which Banu Umayya called al-Salama out of omen; its old fortress was taken by Habib ibn Maslama in Umar's days, and al-Hasan ibn Qahtaba chose its city-site returning from the raid of year 162 — al-Mahdi ordering it built before Tarsus — and Ali ibn Sulayman ibn Ali founded it in mud brick, named al-Muhammadiyya then al-Mahdiyya and al-Hamadiyya for al-Mahdi's death at its completion in year 169; four thousand fighters were levied for it from Syria, the Jazira and Khurasan at forty dinars' pay and three hundred dirhams a man, with two thousand transferred from Malatya, Shimshat, Sumaysat, Kaysum, Duluk and Ra'ban; its unsound brick fell to the snows and the Romans occupied it until al-Rashid rebuilt, fortified and garrisoned it."
