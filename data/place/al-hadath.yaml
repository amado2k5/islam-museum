label: { ar: "الحدث", en: "al-Hadath (al-Mahdiyya)", es: "al-Hadath (al-Mahdiyya)", fr: "al-Hadath (al-Mahdiyya)", ur: "الحدیث ⁦(المہدیہ)⁩", tr: "Etkinlik", id: "Acara" }
summary:
  ar: "الحدث ثغر جُزري عند درب الحدث الذي سمّاه بنو أمية السلامة تطيّراً؛ حصنها القديم فتحه حبيب بن مسلمة أيام عمر، وارتاد الحسن بن قحطبة موضع مدينتها عائداً من غزاة سنة 162 فأمر المهدي ببنائها قبل طرسوس فأنشأها علي بن سليمان بن علي بلبن فسُمّيت المحمدية ثم المهدية والحمدية لوفاة المهدي عند فراغها سنة 169، وفرض لها أربعة آلاف مقاتل من الشام والجزيرة وخراسان بأربعين دينار عطاء وثلاثمائة درهم للرجل ونُقل إليها ألفا رجل من ملطية وشمشاط وسميساط وكيسوم ودلوك ورعبان؛ انهار بناؤها بالثلوج فاحتلّها الروم ثم أعاد بناءها وتحصينها وشحنها الرشيد."
  en: "al-Hadath, the Jaziran frontier-city at the Darb al-Hadath which Banu Umayya called al-Salama out of omen; its old fortress was taken by Habib ibn Maslama in Umar's days, and al-Hasan ibn Qahtaba chose its city-site returning from the raid of year 162 — al-Mahdi ordering it built before Tarsus — and Ali ibn Sulayman ibn Ali founded it in mud brick, named al-Muhammadiyya then al-Mahdiyya and al-Hamadiyya for al-Mahdi's death at its completion in year 169; four thousand fighters were levied for it from Syria, the Jazira and Khurasan at forty dinars' pay and three hundred dirhams a man, with two thousand transferred from Malatya, Shimshat, Sumaysat, Kaysum, Duluk and Ra'ban; its unsound brick fell to the snows and the Romans occupied it until al-Rashid rebuilt, fortified and garrisoned it."
  es: "al-Hadath, la ciudad fronteriza de Jazira en Darb al-Hadath que Banu Umayya llamó al-Salama por presagio; su antigua fortaleza fue tomada por Habib ibn Maslama en los días de Umar, y al-Hasan ibn Qahtaba eligió su emplazamiento al regresar de la incursión del año 162 —al-Mahdi ordenó construirla antes de Tarso— y Ali ibn Sulayman ibn Ali la fundó con ladrillos de barro, llamada al-Muhammadiyya, luego al-Mahdiyya y al-Hamadiyya por la muerte de al-Mahdi al completarse en el año 169; se reclutaron cuatro mil combatientes de Siria, Jazira y Jorasán a cambio de cuarenta dinares y trescientos dirhams por hombre, con dos mil transferidos de Malatya, Shimshat, Sumaysat, Kaysum, Duluk y Ra'ban; Sus frágiles ladrillos se derrumbaron bajo la nieve y los romanos la ocuparon hasta que al-Rashid la reconstruyó, fortificó y la guarneció."
  fr: "al-Hadath, la ville frontière de Jazira au Darb al-Hadath que les Banu Umayya appelèrent al-Salama par présage; son ancienne forteresse fut prise par Habib ibn Maslama à l'époque d'Umar, et al-Hasan ibn Qahtaba choisit son emplacement à son retour du raid de l'an 162 — al-Mahdi ayant ordonné sa construction avant Tarse — et Ali ibn Sulayman ibn Ali la fonda en briques de terre crue, la nomma al-Muhammadiyya puis al-Mahdiyya et al-Hamadiyya pour la mort d'al-Mahdi à son achèvement en l'an 169; quatre mille combattants furent levés pour elle en Syrie, en Jazira et au Khorasan à un salaire de quarante dinars et trois cents dirhams par homme, avec deux mille transférés de Malatya, Shimshat, Sumaysat, Kaysum, Duluk et Ra'ban; Ses briques fragiles tombèrent sous la neige et les Romains l'occupèrent jusqu'à ce qu'al-Rashid la reconstruise, la fortifie et y installe une garnison."
  ur: "الحدث، جزیران کا سرحدی شہر دارب الحدیث میں جسے بنو امیہ نے سلامہ کہا تھا۔ اس کا پرانا قلعہ حبیب ابن مسلمہ نے عمر کے دنوں میں لے لیا تھا، اور الحسن بن قحطابہ نے سنہ 162 کے حملے سے واپسی پر اس کے شہر کے مقام کا انتخاب کیا - المہدی نے اسے ترسوس سے پہلے تعمیر کرنے کا حکم دیا - اور علی ابن سلیمان ابن علی نے اس کی بنیاد مٹی کی اینٹوں سے رکھی، جس کا نام المحمدیہ المحمدیہ رکھا گیا۔ المہدی کی وفات سنہ 169 میں مکمل ہوئی۔ اس کے لیے شام، جزیرہ اور خراسان سے چالیس دینار کی تنخواہ پر چار ہزار جنگجو اور تین سو درہم ایک آدمی کے لیے مقرر کیے گئے، جن میں دو ہزار ملاتیہ، شمشات، سمیسات، کیسم، دولک اور ربان سے منتقل کیے گئے۔ اس کی ناکارہ اینٹ برف میں گر گئی اور رومیوں نے اس پر قبضہ کر لیا یہاں تک کہ الرشید نے اسے دوبارہ تعمیر کیا، قلعہ بند کر دیا اور اسے گھیرے میں لے لیا۔"
  tr: "El-Hadath, Emeviyelerin Al-Salama Tayrir adını verdiği Hadas Geçidi'nde bir cazlı sınırdır; eski kalesi Ömer zamanında Habib ibn Maslama tarafından ele geçirilmiştir. El-Hasan ibn Kahtaba, 162 Hicri yılında akıncılardan dönerken şehrin bulunduğu yeri ziyaret etmiştir. El-Mehdi, Tarsus'tan önce şehrin yeniden inşasını emretti, bu yüzden Ali bin Süleyman ibn Ali Balan'da inşa etti ve kaleye El-Muhammediye adı verildi, ardından Al-Mahdiyya ve Al-Mahdi'nin 169 Hicri'deki ölümünden sonra Al-Hamdiyya. Levant, Cazire ve Horasan'dan dört bin savaşçıyı kişi başı kırk dinar ve üç yüz dirhem karşılığında görevlendirdi. Malatya, Şashat, Samisat, Kisum, Duluk ve Ra'ban'dan iki bin adam buraya getirildi. İnşaat karla yıkıldı, Romalılar burayı işgal etti, sonra yeniden inşa etti, tahkim etti ve akıllıca bir şekilde gönderdi."
  id: "Al-Hadath adalah perbatasan jazzi di Gerbang Hadath, yang dinamai oleh Umayyah sebagai Al-Salama Tayrir; benteng lamanya direbut oleh Habib ibn Maslama pada masa pemerintahan Umar. Al-Hasan ibn Qahtaba mengunjungi lokasi kotanya, setelah kembali dari serangan pada tahun 162 H. Al-Mahdi memerintahkan rekonstruksinya sebelum Tarsus, sehingga Ali ibn Sulayman ibn Ali membangunnya di Balan, dan menamai Al-Muhammadiyah., kemudian Al-Mahdiyya, dan Al-Hamdiyya setelah kematian al-Mahdi pada tahun 169 H. Ia menugaskan empat ribu pejuang dari Levant, Jazira, dan Khorasan dengan bayaran empat puluh dinar tiga ratus dirham per orang. Dua ribu orang dari Malatya, Shashat, Samisat, Kisum, Duluk, dan Ra'ban dibawa ke sana. Pembangunannya runtuh karena salju, Romawi mendudukinya, lalu membangun kembali, memperkuat, dan mengirimkannya dengan bijaksana."
