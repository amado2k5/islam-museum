summary:
  ar: "مدينة صغيرة متحضرة، ويذكر المؤلف أنها تبعد عن مصب نهر برتانو خمسة وثمانين ميلا {cite:nuzhat-al-mushtaq-2002 p. 906}."
  en: "A small, civilised town; the author gives eighty-five miles from the mouth of the river Bartanū {cite:nuzhat-al-mushtaq-2002 p. 906}."
  es: "Un pueblo pequeño y civilizado; el autor indica que está a ochenta y cinco millas de la desembocadura del río Bartanū {cite:nuzhat-al-mushtaq-2002 p. 906}."
  fr: "Une petite ville civilisée; l'auteur donne quatre-vingt-cinq milles de l'embouchure du fleuve Bartanū {cite:nuzhat-al-mushtaq-2002 p. 906}."
  ur: "ایک چھوٹا، مہذب شہر؛ مصنف نے دریائے برطانو کے منہ سے پچاسی میل کا فاصلہ بیان کیا ہے۔ 906}۔"
  tr: "Küçük, medeni bir şehir olan yazar, Bretano Nehri'nin ağzından seksen beş mil uzaklıkta olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 906}."
  id: "Sebuah kota kecil yang beradab, penulis menyebutkan bahwa kota ini berjarak delapan puluh lima mil dari muara Sungai Bretano {cite:Nuzhat-al-Mushtaq-2002, hlm. 906}."
