label: { ar: "بياض", en: "Bayad", es: "Bayad", fr: "Bayad", ur: "بیاد", tr: "Beyazlık", id: "Keputihan" }
summary:
  ar: "بياض، ضيعة في الفيوم؛ يصل إليها الماء من الخليج الأعظم فيملأ بركها، ولبركها مقاسم توزع الماء على كل بركة بقدر حاجتها {cite:khitat-maqrizi-1998 p.731}."
  en: "Bayad, a village of the Fayyum; water reaches it from the great canal and fills its ponds, which have distribution outlets to give each one its share {cite:khitat-maqrizi-1998 p.731}."
  es: "Bayad, una aldea del Fayyum; el agua le llega desde el gran canal y llena sus estanques, que tienen salidas de distribución para dar a cada uno su parte {cite:khitat-maqrizi-1998 p.731}."
  fr: "Bayad, un village du Fayoum; l'eau y parvient du grand canal et remplit ses étangs, qui ont des points de distribution pour donner à chacun sa part {cite:khitat-maqrizi-1998 p.731}."
  ur: "بیاد، فیوم کا ایک گاؤں؛ پانی بڑی نہر سے اس تک پہنچتا ہے اور اپنے تالابوں کو بھر دیتا ہے، جس میں ہر ایک کو اس کا حصہ دینے کے لیے ڈسٹری بیوشن آؤٹ لیٹس ہوتے ہیں۔"
  tr: "Bayad, Fayoum'da bir köydür; su Büyük Körfez'den buraya ulaşır ve göletlerini doldurur. Göletleri, suyu ihtiyaçlarına göre her gölete dağıtılmış bölümlere ayırmıştır {cite:khitat-maqrizi-1998 s.731}."
  id: "Bayad, sebuah desa di Fayoum; air mengalir dari Teluk Besar dan mengisi kolam-kolamnya. Kolam-kolam di sana telah membagi air menjadi beberapa bagian yang didistribusikan ke setiap kolam sesuai kebutuhan {cite:khitat-maqrizi-1998 hlm.731}."
