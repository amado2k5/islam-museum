  ar: "مدينة كبيرة ذات أسواق عامرة وتجارات، تقع على ترعة بلقينة، ويذكر الإدريسي أنها تقابل مدينة أخرى في الشرق. {cite:nuzhat-al-mushtaq-2002 p. 340}"
  en: "A large town with busy markets and trade on the Balqina canal, facing another town to the east, in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 340}"
  es: "Según la descripción de al-Idrisi, se trataba de una gran ciudad con mercados bulliciosos y actividad comercial en el canal de Balqina, frente a otra ciudad al este. {cite:nuzhat-al-mushtaq-2002 p. 340}"
  fr: "D'après le récit d'al-Idrisi, il s'agissait d'une grande ville aux marchés animés et au commerce florissant sur le canal de Balqina, faisant face à une autre ville à l'est. {cite:nuzhat-al-mushtaq-2002 p. 340}"
  ur: "نہر بلقینا پر مصروف بازاروں اور تجارت کے ساتھ ایک بڑا قصبہ، مشرق کی طرف ایک اور شہر کا سامنا، الادریسی کے کھاتے میں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 340}"
