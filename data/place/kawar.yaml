summary:
  ar: "أرض مشهورة مقصودة متصلة بأرض كوكو من الشرق، ويخرج منها الشب الذي يعرف بالشب الكواري {cite:nuzhat-al-mushtaq-2002 p. 116}."
  en: "A well-known land that lies east of Kawkaw and is visited for trade. Alum known as Kawari alum comes from it {cite:nuzhat-al-mushtaq-2002 p. 116}."
  es: "Una tierra muy conocida situada al este de Kawkaw y frecuentada por motivos comerciales. De allí procede el alumbre conocido como alumbre de Kawari {cite:nuzhat-al-mushtaq-2002 p. 116}."
  fr: "Une région réputée située à l'est de Kawkaw, où le commerce est florissant. On y produit notamment de l'alun connu sous le nom d'alun de Kawari {cite:nuzhat-al-mushtaq-2002 p. 116}."
  ur: "ایک معروف سرزمین جو کوکاو کے مشرق میں واقع ہے اور تجارت کے لیے اس کا دورہ کیا جاتا ہے۔ پھٹکڑی جسے کاواری پھٹکری کے نام سے جانا جاتا ہے اس سے نکلتا ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 116}۔"
  tr: "Doğudan Koko topraklarına bağlanması amaçlanan iyi bilinen bir toprak, buradan Kuari al-Shab olarak bilinen alümün ortaya çıktığı {atıf:Nuzhat-al-Mushtaq-2002, s. 116}."
  id: "Sebuah tanah terkenal yang dimaksudkan untuk dihubungkan dengan tanah Koko dari timur, dari mana alum yang dikenal sebagai Kuari al-Shab muncul {cite:Nuzhat-al-Mushtaq-2002, hlm. 116}."
