label: { ar: "سقيفة بني ساعدة", en: "Saqifa of Banu Sa'ida", es: "Saqifa de Banu Sa'ida", fr: "Saqifa de Banu Sa'ida", ur: "بنو ساعدہ کا سقیفہ", tr: "Bani Saada Saqqa", id: "Bani Saada Saqqa" }
summary:
  ar: "السقيفة الظليلة لبني ساعدة حيث اجتمع الأنصار بعد وفاة النبي فبُويع فيها أبو بكر؛ والسمهودي يرجّح أنها كانت مما يلي سوق المدينة عند ما يُعرف بدرب السويقة — في حيّ جرار سعد منزل رهط سعد بن عبادة — لا في قرية بني ساعدة عند بئر بضاعة كما ظن المطري؛ لأن سعداً كان مع رهطه، والسقيفة عند منزله {cite:samhudi-wafa-al-wafa p. 221}. وتثبت السقيفة مكاناً للاجتماع في رواية عمر عند البخاري {cite:sahih-al-bukhari 2462}."
  en: "The roofed hall of Banu Sa'ida where the Ansar met after the Prophet's death and Abu Bakr was acclaimed; al-Samhudi argues it stood by the market of Medina at what is now Darb al-Suwayqa — in the Jirar Sa'd quarter where Sa'd ibn Ubada's sept lived — not at the Banu Sa'ida village by Bi'r Buda'a as al-Matari held, for Sa'd was among his own sept and the saqifa stood by his house {cite:samhudi-wafa-al-wafa p. 221}."
  es: "El salón techado de Banu Sa'ida donde se reunieron los Ansar después de la muerte del Profeta y Abu Bakr fue aclamado; al-Samhudi sostiene que estaba junto al mercado de Medina en lo que ahora es Darb al-Suwayqa, en el barrio de Jirar Sa'd donde vivía el clan de Sa'd ibn Ubada, no en la aldea de Banu Sa'ida junto a Bi'r Buda'a como sostenía al-Matari, ya que Sa'd estaba entre su propio clan y la saqifa estaba junto a su casa {cite:samhudi-wafa-al-wafa p. 221}."
  fr: "La salle couverte de Banu Sa'ida où les Ansar se sont réunis après la mort du Prophète et où Abu Bakr a été acclamé; al-Samhudi soutient qu'elle se trouvait près du marché de Médine à l'emplacement actuel de Darb al-Suwayqa — dans le quartier de Jirar Sa'd où vivait le clan de Sa'd ibn Ubada — et non au village de Banu Sa'ida près de Bi'r Buda'a comme le soutenait al-Matari, car Sa'd était parmi son propre clan et la saqifa se trouvait près de sa maison {cite:samhudi-wafa-al-wafa p. 221}."
  ur: "بنو ساعدہ کا چھت والا ہال جہاں رسول اللہ کی وفات کے بعد انصار آپس میں ملے اور ابوبکر کی تعریف کی گئی۔ السمھودی کا استدلال ہے کہ یہ مدینہ کے بازار کے ساتھ کھڑا تھا جو اب درب السویقہ ہے - جرار سعد کوارٹر میں جہاں سعد ابن عبادہ کے سپاہی رہتے تھے - بنو ساعدہ گاؤں میں بئر بدعہ کے پاس المطاری کے طور پر نہیں تھا، کیونکہ سعد ان کے اپنے گھر کے صفات میں سے تھا۔ {حوالہ: سمہدی وفا الوفاء ص۔ 221}۔"
  tr: "Peygamber'in ölümünden sonra Ensar'ın toplandığı ve Ebu Bekir'in orada itaat yemini ettiği gölgeli Banu Sa'idah'ın seyifesi; Al-Samhudi, buranın şehir pazarının yakınında, Derb al-Suwayqah olarak bilinen yerde—Jarrar Sa'd mahallesinde, Saad ibn Ubadah kabilesinin evinde—Al-Matari'nin varsaydığı gibi mal kuyusuna yakın Bani Sa'idah köyünde değil, çünkü Sa'd grubuyla birlikteydi ve sakibe evinin yakınındaydı {cite:samhudi-wafa-al-wafa, s. 221}. Saqifah, Umar'ın rivayetinde al-Buhari'ye göre bir buluşma yeri olarak belirlenmiştir {atıf:sahih-al-bukhari 2462}."
  id: "Saqifah yang teduh di Banu Sa'idah, tempat para Ansar berkumpul setelah wafatnya Nabi, dan Abu Bakr bersumpah setia di sana; Al-Samhudi menyatakan bahwa saqifah itu terletak dekat pasar kota di tempat yang dikenal sebagai Darb al-Suwayqah—di lingkungan Jarrar Sa'd, rumah suku Saad ibn Ubadah—bukan di desa Bani Sa'idah dekat sumur barang seperti yang diasumsikan al-Matiri, karena Sa'd bersama kelompoknya, dan saqifah berada di dekat rumahnya {cite:samhudi-wafa-al-wafa, hlm. 221}. Saqifah ditetapkan sebagai tempat pertemuan dalam riwayat Umar menurut al-Bukhari {cite:sahih-al-bukhari 2462}."
