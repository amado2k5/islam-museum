summary:
  ar: "واحة يهودية شمال الحجاز قرب خيبر؛ صالح أهلها رسول الله منصرفه من خيبر على نصف الأرض بتربتها، فكان النصف الخالص فيئاً للنبي يصرفه إلى أبناء السبيل، ولم يزل أهلها بها حتى أجلاهم عمر بن الخطاب في خلافته مع يهود خيبر إلى الشام بعد تقويم نصيبهم من النخل والأرض بقيمة عدل."
  en: "A Jewish oasis in the northern Hijaz near Khaybar; its people made peace with the Prophet on his return from Khaybar for half the land with its soil, the surrendered half becoming the Prophet's own fay' which he spent on wayfarers, and they remained there until Umar ibn al-Khattab exiled them in his caliphate together with the Jews of Khaybar to Syria, after their share of palms and land was valued at a fair price paid to them."
