summary:
  ar: "واحة يهودية شمال الحجاز قرب خيبر؛ صالح أهلها رسول الله منصرفه من خيبر على نصف الأرض بتربتها، فكان النصف الخالص فيئاً للنبي يصرفه إلى أبناء السبيل، ولم يزل أهلها بها حتى أجلاهم عمر بن الخطاب في خلافته مع يهود خيبر إلى الشام بعد تقويم نصيبهم من النخل والأرض بقيمة عدل. وفي صحيح البخاري ضمن تقرير عمر لصفايا النبي: «وكانت فدك لأبناء السبيل» {cite:sahih-al-bukhari 4033}."
  en: "A Jewish oasis in the northern Hijaz near Khaybar; its people made peace with the Prophet on his return from Khaybar for half the land with its soil, the surrendered half becoming the Prophet's own fay' which he spent on wayfarers, and they remained there until Umar ibn al-Khattab exiled them in his caliphate together with the Jews of Khaybar to Syria, after their share of palms and land was valued at a fair price paid to them."
  es: "Un oasis judío en el norte del Hiyaz, cerca de Khaybar; sus habitantes hicieron las paces con el Profeta a su regreso de Khaybar a cambio de la mitad de la tierra con sus suelos, la mitad entregada se convirtió en el propio fay' del Profeta, que gastó en viajeros, y permanecieron allí hasta que Umar ibn al-Khattab los exilió en su califato junto con los judíos de Khaybar a Siria, después de que su parte de palmeras y tierras fuera valorada a un precio justo que se les pagó."
  fr: "Une oasis juive dans le nord du Hedjaz, près de Khaybar; ses habitants firent la paix avec le Prophète à son retour de Khaybar en échange de la moitié du territoire et de sa terre, la moitié cédée devenant le fay' personnel du Prophète qu'il dépensa pour les voyageurs, et ils restèrent là jusqu'à ce qu'Umar ibn al-Khattab les exile dans son califat avec les Juifs de Khaybar en Syrie, après que leur part de palmiers et de terre ait été évaluée à un prix équitable qui leur ait été versé."
