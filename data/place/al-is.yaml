summary:
  ar: "مكان بين ينبع والمروة قرب ساحل البحر الأحمر، بلغته سرية حمزة بن عبد المطلب في رمضان سنة 1هـ، فالتقى بعير قريش هناك ⁦(الرحيق ص197 وحاشيته)⁩."
  en: "A place between Yanbu and al-Marwa near the Red Sea coast, reached by Hamza ibn Abd al-Muttalib's expedition in Ramadan of the 1st year AH, where it met the Quraysh caravan (al-Raheeq, p. 197 and its footnote)."
  es: "Un lugar entre Yanbu y al-Marwa cerca de la costa del Mar Rojo, al que llegó la expedición de Hamza ibn Abd al-Muttalib en Ramadán del año 1 de la Hégira, donde se encontró con la caravana de los Quraysh (al-Raheeq, pág. 197 y su nota al pie)."
  fr: "Un lieu entre Yanbu et al-Marwa près de la côte de la mer Rouge, atteint par l'expédition de Hamza ibn Abd al-Muttalib au Ramadan de la 1ère année AH, où elle rencontra la caravane des Quraysh (al-Raheeq, p. 197 et sa note de bas de page)."
