  id: "Yabara di Yaqut adalah sebuah kota di Andalusia barat yang dikaitkan dengan dua ulama hadis dan sastra, dan dibaca oleh Museum Évora di Portugal {cite:mujam-al-buldan-sader-1995 5 hlm.424}."
