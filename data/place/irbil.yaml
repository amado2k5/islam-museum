summary:
  ar: "مدينة الجزيرة على سفح جبل مقلوب، تحيط بها قلعة عالية على أكمة؛ كانت دار مملكة بني بكتكين في القرنين السادس والسابع الهجريين وأشهر ملوكها مظفر الدين كوكبوري، وأخذها التتار بالسيف سنة أربع وثلاثين وستمائة {cite:shadharat-dhahab p. 162}."
  en: "The Jaziran city beneath Mount Maqlub, crowned by its citadel — seat of the Begteginid kingdom in the sixth and seventh centuries AH, most famously under Muzaffar al-Din Kokburi; the Tatars took it by the sword in 634 {cite:shadharat-dhahab p. 162}."
  es: "La ciudad de Jaziran, al pie del monte Maqlub, coronada por su ciudadela, fue sede del reino Begteginid en los siglos VI y VII de la Hégira, siendo el período más famoso el reinado de Muzaffar al-Din Kokburi; los tártaros la tomaron por la espada en el año 634 {cita: shadharat-dhahab p. 162}."
  fr: "La ville de Jaziran au pied du mont Maqlub, couronnée par sa citadelle — siège du royaume des Begteginides aux VIe et VIIe siècles AH, notamment sous Muzaffar al-Din Kokburi; les Tatars la prirent par l'épée en 634 {cite:shadharat-dhahab p. 162}."
