  fr: "Une ville peuplée du pays de Samrīqī avec des troupes; l'auteur donne deux étapes et demie à partir d'Arṣāh {cite:nuzhat-al-mushtaq-2002 p. 931}."
  ur: "سمریقی کی سرزمین میں فوجوں کے ساتھ ایک آبادی والا شہر؛ مصنف نے ارسہ سے ڈھائی مراحل بیان کیے ہیں {حوالہ: نزہت المشتاق-2002 ص۔ 931}۔"
  tr: "Sümer topraklarından çok sayıda insanın olduğu hareketli bir şehir ve askerleri var. Yazar, kuruluşu ile arasında iki buçuk aşama olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 931}."
  id: "Sebuah kota yang ramai dengan banyak penduduk, dari tanah Sumeria, dan memiliki tentara. Penulis menyebutkan bahwa antara kota ini dan pendiriannya terdapat dua setengah tahap {cite:Nuzhat-al-mushtaq-2002, hlm. 931}."
