summary:
  ar: "مدينة عامرة فيها بشر كثير، من بلاد سمريقي، وفيها أجناد، ويذكر المؤلف أن بينها وبين ارصاه مرحلتين ونصفا {cite:nuzhat-al-mushtaq-2002 p. 931}."
  en: "A populous city in the land of Samrīqī with troops; the author gives two and a half stages from Arṣāh {cite:nuzhat-al-mushtaq-2002 p. 931}."
