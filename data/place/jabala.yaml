summary:
  ar: مدينة ساحلية من سواحل الشام؛ أنشأها معاوية بن أبي سفيان وشحنها بعد أن فتح المسلمون مدينة بلدة على فرسخين منها عنوة فخربت وجلا عنها أهلها، وكانت حصناً للروم جلوا عنه عند فتح حمص.
  en: A coastal city of Syria's seaboard; Mu'awiya ibn Abi Sufyan founded and garrisoned it after the Muslims took the town of Balda two farsakhs away by force — it fell ruined and its people departed — a Roman fortress its people had evacuated at the conquest of Hims.
  es: "Una ciudad costera de la costa de Siria; Mu'awiya ibn Abi Sufyan la fundó y la guarneció después de que los musulmanes tomaran por la fuerza la ciudad de Balda, a dos farsakhs de distancia (quedó en ruinas y sus habitantes la abandonaron), una fortaleza romana que sus habitantes habían evacuado tras la conquista de Hims."
  fr: "Une ville côtière du littoral syrien; Mu'awiya ibn Abi Sufyan la fonda et la garnit après que les musulmans eurent pris de force la ville de Balda, située à deux farsakhs de là — elle tomba en ruine et ses habitants partirent — une forteresse romaine que ses habitants avaient évacuée lors de la conquête de Hims."
  ur: "شام کے سمندری کنارے کا ایک ساحلی شہر؛ معاویہ ابن ابی سفیان نے اس کی بنیاد رکھی اور اس کی حفاظت کی جب مسلمانوں نے بلدہ شہر کو طاقت سے دو فرسخ دور لے لیا - یہ تباہ ہوگیا اور اس کے لوگ چلے گئے - ایک رومی قلعہ جسے اس کے لوگوں نے ہمس کی فتح پر خالی کردیا تھا۔"
