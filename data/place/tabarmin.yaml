summary:
  ar: "بلد شامخ رفيع من عيون الحصون الأزلية، فيه مصائد التن الكثيرة، ويبعد عن مسينى مرحلة على الساحل. {cite:nuzhat-al-mushtaq-2002 p. 595}"
  en: "A lofty town among the old famous forts, with many tuna fisheries; one stage from Messina along the coast. {cite:nuzhat-al-mushtaq-2002 p. 595}"
  es: "Una ciudad elevada entre antiguas y famosas fortalezas, con numerosas pesquerías de atún; a una etapa de Messina a lo largo de la costa. {cite:nuzhat-al-mushtaq-2002 p. 595}"
  fr: "Ville perchée parmi les anciennes forteresses renommées, réputée pour ses nombreuses pêcheries de thon; à une étape de Messine en longeant la côte. {cite:nuzhat-al-mushtaq-2002 p. 595}"
  ur: "پرانے مشہور قلعوں کے درمیان ایک بلند شہر، جس میں بہت سی ٹونا مچھلیاں ہیں۔ ساحل کے ساتھ میسینا سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 595}"
  tr: "Sonsuz kalelerin kaynaklarından yükselen, birçok ton balığı kapanı ve Messina kıyılarında bir sahne bulunan yüksek bir ülke. {kaynak:nuzhat-al-mushtaq-2002 s. 595}"
  id: "Sebuah negara yang menjulang tinggi dari mata air benteng abadi, dengan banyak perangkap tuna, dan sebuah panggung di lepas pantai Messina. {cite:nuzhat-al-mushtaq-2002 hlm. 595}"
