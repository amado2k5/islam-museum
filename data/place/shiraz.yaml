summary:
  ar: "شيراز عاصمة إقليم فارس في جنوب إيران ولقبها دار العلم، وهي تأسيس إسلامي على موقع مأهول قديم، ربما أسسها أو جددها سنة 74هـ/693م محمد أخو الحجاج أو محمد بن القاسم. صارت مركزًا اقتصاديًا وثقافيًا في عهد عضد الدولة البويهي، ثم مرت بأيدي السلاجقة والمظفريين والتيموريين والصفويين وكريم خان زند والقاجاريين. وبلغ عدد سكانها نحو 325 ألفًا بحلول 1972م."
  en: Shiraz, titled dar al-ilm, is the capital of Fars in southern Iran, an Islamic foundation on a long-inhabited site, probably founded or restored in 74/693 by Muhammad, brother of al-Hajjaj, or by Muhammad ibn al-Qasim. It became an economic and cultural centre under the Buyid ruler Adud al-Dawla, and later passed through Seljuk, Muzaffarid, Timurid, Safavid, Zand and Qajar rule. Its population reached about 325,000 by 1972.
  ur: "شیراز جنوبی ایران میں فارس کا دارالحکومت اور دارالعلم کے لقب سے معروف ہے، ایک قدیم آباد مقام پر اسلامی بنیاد، جسے غالباً 74ھ/693ء میں حجاج کے بھائی محمد یا محمد بن قاسم نے قائم یا بحال کیا۔ یہ بویہی حکمران عضد الدولہ کے دور میں معاشی اور ثقافتی مرکز بنا، اور بعد میں سلجوقی، مظفری، تیموری، صفوی، زند اور قاجاری حکومتوں سے گزرا۔ 1972ء تک اس کی آبادی تقریباً 325 ہزار تھی۔"
  es: "Shiraz, conocida como dar al-ilm, es la capital de Fars, en el sur de Irán. Se trata de una ciudad islámica fundada en un emplazamiento históricamente habitado, probablemente fundada o restaurada en el año 74/693 por Muhammad, hermano de al-Hajjaj, o por Muhammad ibn al-Qasim. Se convirtió en un centro económico y cultural bajo el gobernante buyí Adud al-Dawla, y posteriormente pasó por los dominios selyúcida, muzaffarí, timúrida, safávida, zand y qajar. Su población alcanzó aproximadamente los 325 000 habitantes en 1972."
  fr: "Chiraz, également appelée Dar al-Ilm, est la capitale du Fars, dans le sud de l'Iran. Fondée sur un site habité de longue date, elle fut probablement établie ou restaurée en 74/693 par Muhammad, frère d'al-Hajjaj, ou par Muhammad ibn al-Qasim. Elle devint un centre économique et culturel sous le souverain bouyide Adud al-Dawla, puis passa successivement sous les dominations seldjoukide, muzaffaride, timouride, safavide, zande et qajare. Sa population atteignait environ 325 000 habitants en 1972."
  tr: "Şiraz, İran'ın güneyindeki Fars bölgesinin başkentidir ve Dar al-Ilm olarak bilinir. Eski bir yerleşim alanı üzerinde kurulmuş İslami bir kuruluştur; muhtemelen 74 H/693 yılında el-Hacı ya da Muhammed bin el-Kasim kardeşi Muhammed tarafından kurulmuş veya yenilenmiş olabilir. Adud al-Dawla al-Buyahid döneminde ekonomik ve kültürel bir merkez haline gelmiş, ardından Selçuklular, Muzafferiler, Timuriler, Safeviler, Kerim Han Zand ve Kacerlerin eline geçmiştir. Nüfusu 1972 yılına gelindiğinde yaklaşık 325.000'e ulaşmıştır."
  id: "Shiraz adalah ibu kota wilayah Fars di Iran selatan dan dikenal sebagai Dar al-Ilm. Ini adalah sebuah yayasan Islam di situs yang telah lama dihuni, kemungkinan didirikan atau diperbarui pada tahun 74 H/693 M oleh Muhammad, saudara al-Hajjaj, atau Muhammad ibn al-Qasim. Kota ini menjadi pusat ekonomi dan budaya selama masa pemerintahan Adud al-Dawla al-Buyahid, kemudian berpindah ke tangan Seljuk, Muzaffarid, Timurid, Safavid, Karim Khan Zand, dan Qajar. Populasinya mencapai sekitar 325.000 jiwa pada tahun 1972."
