label: { ar: "شيراز", en: "Shiraz" }
summary:
  ar: "شيراز عاصمة إقليم فارس في جنوب إيران ولقبها دار العلم، وهي تأسيس إسلامي على موقع مأهول قديم، ربما أسسها أو جددها سنة 74هـ/693م محمد أخو الحجاج أو محمد بن القاسم. صارت مركزًا اقتصاديًا وثقافيًا في عهد عضد الدولة البويهي، ثم مرت بأيدي السلاجقة والمظفريين والتيموريين والصفويين وكريم خان زند والقاجاريين. وبلغ عدد سكانها نحو 325 ألفًا بحلول 1972م."
  en: Shiraz, titled dar al-ilm, is the capital of Fars in southern Iran, an Islamic foundation on a long-inhabited site, probably founded or restored in 74/693 by Muhammad, brother of al-Hajjaj, or by Muhammad ibn al-Qasim. It became an economic and cultural centre under the Buyid ruler Adud al-Dawla, and later passed through Seljuk, Muzaffarid, Timurid, Safavid, Zand and Qajar rule. Its population reached about 325,000 by 1972.
  ur: "شیراز جنوبی ایران میں فارس کا دارالحکومت اور دارالعلم کے لقب سے معروف ہے، ایک قدیم آباد مقام پر اسلامی بنیاد، جسے غالباً 74ھ/693ء میں حجاج کے بھائی محمد یا محمد بن قاسم نے قائم یا بحال کیا۔ یہ بویہی حکمران عضد الدولہ کے دور میں معاشی اور ثقافتی مرکز بنا، اور بعد میں سلجوقی، مظفری، تیموری، صفوی، زند اور قاجاری حکومتوں سے گزرا۔ 1972ء تک اس کی آبادی تقریباً 325 ہزار تھی۔"
