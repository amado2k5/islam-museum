summary:
  ar: "موضع بناحية ينبع، بلغه النبي في جمادى الأولى سنة 2هـ يعترض عير قريش العائدة من الشام، فاتته بأيام."
  en: "A place in the district of Yanbu'. In Jumada al-Ula of year 2 AH the Prophet reached it, seeking to intercept the Quraysh caravan returning from Syria, but the caravan had escaped him by some days."
  es: "Un lugar en el distrito de Yanbu'. En Jumada al-Ula del año 2 AH, el Profeta llegó allí, buscando interceptar la caravana de los Quraysh que regresaba de Siria, pero la caravana se le había escapado por algunos días."
  fr: "Un lieu du district de Yanbu'. En Jumada al-Ula de l'an 2 AH, le Prophète s'y rendit, cherchant à intercepter la caravane des Quraysh revenant de Syrie, mais celle-ci lui avait échappé de quelques jours."
  ur: "یانبو ضلع میں ایک جگہ۔ سنہ 2 ہجری کے جمادی الاول میں رسول اللہ شام سے واپس آنے والے قریش کے قافلے کو روکنے کے لیے وہاں پہنچے، لیکن قافلہ کچھ دنوں تک آپ سے بچ نکلا۔"
  tr: "Peygamber, Yanbu yakınlarındaki bir yerde, 2 Hicri yılında, Şam'dan dönen Qureyş kabilesi onu durdururken Cumedül-Avvel'e ulaştı ve o da birkaç gün kaçırdı."
  id: "Sebuah tempat dekat Yanbu, Nabi sampai kepadanya di Jumada al-Awwal pada tahun ke-2 H ketika suku Quraisy yang kembali dari Levant sedang mencegatnya, dan dia melewatkannya berhari-hari."
