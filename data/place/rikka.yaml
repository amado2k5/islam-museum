summary:
  ar: "مدينة أسفل جبل درن قرب أغمات، طيبة التراب كثيرة النبات، يشق المدينة فيها نهر ليس بالكبير، وتحيط بها الجنات. {cite:nuzhat-al-mushtaq-2002 p. 226}"
  en: "A town at the foot of the Atlas, near Aghmat, with good soil and plenty of plants; a modest river crosses the town and gardens surround it. {cite:nuzhat-al-mushtaq-2002 p. 226}"
  es: "Un pueblo al pie del Atlas, cerca de Aghmat, con tierra fértil y abundante vegetación; un río de tamaño moderado lo atraviesa y está rodeado de jardines. {cite:nuzhat-al-mushtaq-2002 p. 226}"
  fr: "Ville située au pied de l'Atlas, près d'Aghmat, au sol fertile et à la végétation abondante; une rivière modeste la traverse et des jardins l'entourent. {cite:nuzhat-al-mushtaq-2002 p. 226}"
  ur: "اطلس کے دامن میں واقع ایک قصبہ، اخمت کے قریب، اچھی مٹی اور کافی پودوں کے ساتھ؛ ایک معمولی دریا شہر سے گزرتا ہے اور اس کے چاروں طرف باغات ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 226}"
  tr: "Agmat yakınlarındaki Darn Dağı'nın eteğinde bir şehir, bol bitki ile dolu hoş toprak. Şehir, büyük olmayan bir nehirle kesilir ve bahçelerle çevrilidir. {kaynak:nuzhat-al-mushtaq-2002 s. 226}"
  id: "Sebuah kota di kaki Gunung Darn dekat Aghmat, tanah yang menyenangkan dengan tanaman yang melimpah. Kota ini dipotong oleh sungai yang tidak besar, dan dikelilingi oleh taman-taman. {cite:nuzhat-al-mushtaq-2002 hlm. 226}"
