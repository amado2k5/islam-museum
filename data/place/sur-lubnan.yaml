summary:
  ar: "مدينة على ضفة البحر، بها للمراكب إرساء وإقلاع، لها سور أحاط به من ثلاثة أركان. {cite:nuzhat-al-mushtaq-2002 p. 365}"
  en: "A city on the coast with anchorage and departure for ships, walled on three sides. {cite:nuzhat-al-mushtaq-2002 p. 365}"
  es: "Una ciudad costera con fondeadero y punto de partida para barcos, amurallada por tres lados. {cite:nuzhat-al-mushtaq-2002 p. 365}"
  fr: "Une ville côtière dotée d'un mouillage et d'un port de départ pour les navires, entourée de remparts sur trois côtés. {cite:nuzhat-al-mushtaq-2002 p. 365}"
  ur: "ساحل پر ایک شہر جس میں بحری جہازوں کے لیے لنگر انداز اور روانگی ہے، تین اطراف سے دیوار۔ {حوالہ: نزہت المشتاق-2002 ص۔ 365}"
  tr: "Deniz kıyısında bir şehir; teknelerin yanaşma ve kalkış yaptığı yer, üç tarafı bir duvarla çevrili. {cite:nuzhat-al-mushtaq-2002 s. 365}"
  id: "Sebuah kota di tepi laut, di mana kapal dapat berlabuh dan lepas landas, dan dikelilingi oleh tembok di tiga sisi. {cite:nuzhat-al-mushtaq-2002 hlm. 365}"
