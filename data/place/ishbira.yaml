summary:
  ar: "مدينة كبيرة عامرة على نهر رين، وبزلة على غربي هذا النهر أيضا، ويذكر المؤلف أن بينها وبين بردون غربا أربعين ميلا {cite:nuzhat-al-mushtaq-2002 p. 867}."
  en: "A large, populous city on the Rhine, with Bazla on the western bank of the same river; the author gives forty miles west to Bardūn {cite:nuzhat-al-mushtaq-2002 p. 867}."
  es: "Una ciudad grande y populosa a orillas del Rin, con Bazla en la margen occidental del mismo río; el autor sitúa a cuarenta millas al oeste de Bardūn {cite:nuzhat-al-mushtaq-2002 p. 867}."
  fr: "Une grande ville peuplée sur le Rhin, avec Bazla sur la rive ouest du même fleuve; l'auteur indique quarante milles à l'ouest jusqu'à Bardūn {cite:nuzhat-al-mushtaq-2002 p. 867}."
  ur: "رائن پر ایک بڑا، آبادی والا شہر، اسی دریا کے مغربی کنارے پر بازلہ کے ساتھ؛ مصنف نے باردون کو چالیس میل مغرب کی طرف اشارہ کیا ہے۔ 867}۔"
  tr: "Ren Nehri üzerinde gelişen büyük bir şehir ve bu nehrin batı tarafında bir bataklık da vardır. Yazar, şehrin Bardoun'un kırk mil batısında olduğunu belirtir {cite:Nuzhat-al-mushtaq-2002, s. 867}."
  id: "Sebuah kota besar yang berkembang di Sungai Rhein, dan juga sebuah rawa di sisi barat sungai ini. Penulis menyebutkan bahwa kota ini terletak empat puluh mil di sebelah barat Bardoun {cite:Nuzhat-al-mushtaq-2002, hlm. 867}."
