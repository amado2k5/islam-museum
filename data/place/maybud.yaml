summary:
  ar: "مدينة من كورة كثة، صغيرة متحضرة، لها سوق عامرة، وأهلها أكياس، وتبعد عن الفهرج نحو خمسة عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  en: "A small, civilised town of the Kath district with a busy market and shrewd people, about fifteen miles from al-Fahraj. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  es: "Una pequeña y civilizada ciudad del distrito de Kath, con un mercado bullicioso y gente astuta, a unos veinticuatro kilómetros de al-Fahraj. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  fr: "Une petite ville civilisée du district de Kath, avec un marché animé et des habitants avisés, à une quinzaine de kilomètres d'al-Fahraj. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  ur: "الفراج سے تقریباً پندرہ میل کے فاصلے پر، ایک مصروف بازار اور ہوشیار لوگوں کے ساتھ ضلع کاٹھ کا ایک چھوٹا، مہذب قصبہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 431}"
  tr: "Kora'nın bir şehri, yoğun, küçük ve medeni bir şehir, hareketli bir pazarı var, halkı sürü halinde ve Al-Fahraj'a yaklaşık on beş mil uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 431}"
  id: "Sebuah kota Kora, kota kecil yang padat, beradab dengan pasar yang ramai, penduduknya adalah kelompok besar, dan berjarak sekitar lima belas mil dari Al-Fahraj. {cite:nuzhat-al-mushtaq-2002 hlm. 431}"
