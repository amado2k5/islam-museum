summary:
  ar: "السغد بلاد ما وراء النهر وأعظم مدنها سمرقند؛ أقبل أهلها مع الترك وأهل كش ونسف إلى سعيد بن عثمان في مائة ألف وعشرين ألفاً فالتقوا ببخارا فانكسروا."
  en: "al-Sughd, the Transoxanian land whose greatest city is Samarqand; its folk joined the Turks, Kish and Nasaf against Sa'id ibn Uthman at a hundred and twenty thousand, broken before Bukhara."
  es: "al-Sughd, la tierra de Transoxiana cuya ciudad más grande es Samarcanda; sus habitantes se unieron a los turcos, Kish y Nasaf contra Sa'id ibn Uthman, con ciento veinte mil hombres, pero fueron derrotados ante Bujará."
  fr: "al-Sughd, le pays transoxanien dont la plus grande ville est Samarcande; ses habitants se sont joints aux Turcs, à Kish et à Nasaf contre Sa'id ibn Uthman à cent vingt mille hommes, et ont été vaincus devant Boukhara."
  ur: "الصغد، ٹرانسکسانیائی سرزمین جس کا سب سے بڑا شہر سمرقند ہے۔ اس کے لوگ ایک لاکھ بیس ہزار کی تعداد میں سعید بن عثمان کے خلاف ترک، کیش اور ناصف کے ساتھ شامل ہوئے، بخارا سے پہلے ٹوٹ گئے۔"
  tr: "Nehrin ötesinde yer alan Sogdias, en büyük şehri Semerkant; halkı Türkler, Kiş halkı ve Nasf ile birlikte 120.000 yılında Said ibn Osman ile birlikte geldi, böylece Buhara'yla karşılaştılar ve yenildiler."
  id: "Sogdias, sebuah tanah di seberang sungai dan kota terbesarnya, Samarkand; penduduknya datang bersama orang Turki, suku Kish, dan Nasf kepada Sa'id ibn Uthman pada tahun 120.000, sehingga mereka bertemu Bukhara dan dikalahkan."
