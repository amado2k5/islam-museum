  es: "Un pueblo no muy grande, situado en la orilla occidental del Oxus, después de al-Tahiriyya, con un arroyo que desciende de sus colinas y desemboca en el río. {cite:nuzhat-al-mushtaq-2002 p. 697}"
  fr: "Une petite ville, située sur la rive ouest de l'Oxus après al-Tahiriyya, traversée par un ruisseau descendant de ses collines et se jetant dans le fleuve. {cite:nuzhat-al-mushtaq-2002 p. 697}"
  ur: "الطاہریہ کے بعد آکسس کے مغربی کنارے پر ایک قصبہ بڑا نہیں ہے، جس کی پہاڑیوں سے بہتی ندی دریا کی طرف بہتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 697}"
