  ar: "مدينة ليست بكبيرة، تقع على الضفة الغربية من جيحون بعد الطاهرية، ويجري منها نهر ناشع إلى جيحون من جبلها. {cite:nuzhat-al-mushtaq-2002 p. 697}"
