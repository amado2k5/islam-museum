  id: "Sebuah kota yang ramai dengan diameter kecil di lereng gunung, penulis menyebutkan bahwa kota ini berjarak sembilan puluh mil di sebelah timur Atropi dan kemudian sembilan puluh mil ke utara {cite:Nuzhat-al-mushtaq-2002, hlm. 894}."
