id: place/nahr-barada
class: place
kind: river
label: { ar: "نهر بردى", en: "Barada River", es: "Río Barada", fr: "Rivière Barada", ur: "دریائے بڑدہ", tr: "Barada Nehri", id: "Sungai Barada" }
summary:
  ar: "نهر يتفرع في المدينة إلى أنهار وقنوات تجري إلى دورها وحماماتها وبساتينها، ويصفه الإدريسي بأنه يُسمع من بعيد لعظم جريانه، وأنه ليس مشروباً لأن عليه مصبات الغسالات. {cite:nuzhat-al-mushtaq-2002 p. 367}"
  en: "A river that splits within the city into channels running to its houses, baths and gardens. Al-Idrisi says its flow can be heard from far off, and that it is not drunk because washing places drain into it. {cite:nuzhat-al-mushtaq-2002 p. 367}"
  es: "Un río que se divide dentro de la ciudad en canales que llegan a sus casas, baños y jardines. Al-Idrisi dice que su caudal se oye desde lejos y que no es potable porque las aguas residuales de los lavaderos desembocan en él. {cite:nuzhat-al-mushtaq-2002 p. 367}"
  fr: "Une rivière qui se divise à l'intérieur de la ville en plusieurs canaux alimentant les maisons, les bains et les jardins. Al-Idrisi affirme que l'on entend son murmure de loin et que son eau n'est pas consommée car les eaux des lavoirs s'y déversent. {cite:nuzhat-al-mushtaq-2002 p. 367}"
  ur: "ایک دریا جو شہر کے اندر اپنے گھروں، حماموں اور باغات کو بہنے والے نالیوں میں تقسیم ہو جاتا ہے۔ الادریسی کا کہنا ہے کہ اس کے بہاؤ کو دور سے سنا جا سکتا ہے، اور یہ کہ یہ نشے میں نہیں ہے کیونکہ دھونے کی جگہ اس میں بہہ جاتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 367}"
  tr: "Şehirde nehirlere ve kanallara ayrılan bir nehir, evlerine, hamamlarına ve meyve bahçelerine akıyor. El-İdrisi, kemiklerinin akması nedeniyle uzaktan duyulduğunu ve çamaşır makinesi giderleri olduğu için içecek olmadığını belirtiyor. {kaynak:Nuzhat-al-mushtaq-2002 s. 367}"
  id: "Sebuah sungai yang bercabang di kota menjadi sungai dan kanal yang mengalir ke rumah, pemandian, dan kebun buahnya. Al-Idrisi menggambarkan sungai ini terdengar dari kejauhan karena tulangnya yang mengalir, dan bahwa itu bukan minuman karena memiliki saluran pembuangan mesin cuci. {cite:Nuzhat-al-Mushtaq-2002 hlm. 367}"
