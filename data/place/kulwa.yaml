summary:
  ar: "مدينة ساحلية عظيمة، أكثر أهلها من الزنوج، وبيوتها من الخشب، وأهلها شافعية المذهب. يذكر ابن بطوطة أن سفالة على مسيرة نصف شهر منها ⁦(الرحلة، الطبعة 1958م، ص 163)⁩، وأنه ركب البحر منها إلى ظفار الحموض."
  en: "A great coastal city. Most of its people are Zunuj (Black Africans), its houses are of wood, and its people follow the Shafi'i school. Ibn Battuta says Sofala lies half a month's journey from it (al-Rihla, 1958 edition, p. 163), and that he took ship from it to Zafar al-Hamus."
  es: "Una gran ciudad costera. La mayoría de sus habitantes son zunuj (africanos negros), sus casas son de madera y sus habitantes siguen la escuela shafi'í. Ibn Battuta afirma que Sofala se encuentra a medio mes de viaje de ella (al-Rihla, edición de 1958, p. 163), y que desde allí viajó en barco hasta Zafar al-Hamus."
  fr: "Une grande ville côtière. La plupart de ses habitants sont des Zunuj (Africains noirs), ses maisons sont en bois et ses habitants suivent l'école chaféite. Ibn Battuta dit que Sofala se trouve à une demi-journée de voyage de là (al-Rihla, édition de 1958, p. 163) et qu'il a pris un bateau de là pour Zafar al-Hamus."
  ur: "ایک عظیم ساحلی شہر۔ اس کے زیادہ تر لوگ زنوج ⁦(سیاہ افریقی)⁩ ہیں، اس کے گھر لکڑی کے ہیں، اور اس کے لوگ شافعی مکتب کی پیروی کرتے ہیں۔ ابن بطوطہ کا کہنا ہے کہ سفالہ اس سے آدھے مہینے کی مسافت پر ہے ⁦(الرحلہ، 1958 ایڈیشن، صفحہ 163)⁩، اور یہ کہ اس نے اس سے ظفر الحمس تک جہاز لیا۔"
  tr: "Büyük bir kıyı şehri olan bu şehir, sakinlerinin çoğu siyahi, evleri ahşaptan yapılmış ve halkı Şafii takipçileridir. İbn Battuta, Safela'nın oradan yarım aylık bir yolculukta olduğunu (Al-Rihlah, 1958 baskısı, s. 163) ve oradan Dhofar al-Hamud'a yelken açtığını belirtir."
  id: "Kota pesisir yang besar, sebagian besar penduduknya adalah orang Negro, rumahnya terbuat dari kayu, dan penduduknya adalah penganut Syaf'i. Ibn Battuta menyebutkan bahwa Safala menempuh perjalanan setengah bulan dari sana (Al-Rihlah, edisi 1958, hlm. 163), dan bahwa ia berlayar dari sana ke Dhofar al-Hamud."
