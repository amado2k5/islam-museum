summary:
  ar: "نيسابور ومدينتها أبرشهر من كور خراسان؛ حصرها ابن عامر أشهراً فطلب صاحب أحد أرباعها الأمان فأدخل المسلمين ليلاً ففتحوا الباب وتحصن مرزبانها في القهندز ثم صالح عن جميعها على ألف ألف درهم ويقال سبعمائة ألف ووليها قيس بن الهيثم السلمي ومن روساطيقها زام وباخرز وجوين وبيهق وبشت وأشبند ورخ وزاوة وخواف وأسبرائن وأرغيان."
  en: "Naysabur, whose city is Abarshahr, of Khurasan's kuwar; besieged months by Ibn Amir, a quarter-warden's night aman let the Muslims open its gate, the marzban compounding from the qahandaz for the whole at a million — some say seven hundred thousand — and Qays ibn al-Haytham governed it; its rustaqs include Zam, Bakharz, Juwayn, Bayhaq, Basht, Ashband, Rukh, Zawa, Khuwaf, Asbara'in and Arghiyan."
