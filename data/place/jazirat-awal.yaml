label: { ar: "جزيرة أوال", en: "Awal Island", es: "Isla Awal", fr: "Île d'Awal", ur: "اوول جزیرہ", tr: "Awal Adası", id: "Pulau Awal" }
summary:
  ar: "جزيرة حسنة بها مدينة كبيرة، وفيها نخل وأراض زراعية وعيون كثيرة، منها عين بو زيدان وعين غذار، وفيها أمير مستقل بنفسه، ويقصدها رؤساء الغواصين للؤلؤ من كل الأقطار. {cite:nuzhat-al-mushtaq-2002 p. 387}"
  en: "A fine island with a large town, palms, fields and many springs, among them Ayn Bu Zaydan and Ayn Ghadhar. It has its own ruler, and the heads of the pearl divers gather there from every land. {cite:nuzhat-al-mushtaq-2002 p. 387}"
  es: "Una hermosa isla con una gran ciudad, palmeras, campos y numerosos manantiales, entre ellos Ayn Bu Zaydan y Ayn Ghadhar. Tiene su propio gobernante, y allí se reúnen los jefes de los buceadores de perlas procedentes de todas partes. {cite:nuzhat-al-mushtaq-2002 p. 387}"
  fr: "Une île magnifique avec une grande ville, des palmiers, des champs et de nombreuses sources, parmi lesquelles Ayn Bu Zaydan et Ayn Ghadhar. Elle possède son propre souverain, et les chefs des pêcheurs de perles s'y rassemblent de tous les pays. {cite:nuzhat-al-mushtaq-2002 p. 387}"
  ur: "ایک عمدہ جزیرہ جس میں ایک بڑا قصبہ، کھجوریں، کھیتیاں اور بہت سے چشمے ہیں، جن میں عین بو زیدان اور عین غدر ہیں۔ اس کا اپنا حکمران ہے، اور موتیوں کے غوطہ خوروں کے سر ہر ملک سے وہاں جمع ہوتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 387}"
  tr: "Hasna Adası'nın büyük bir şehri vardır; palmiye ağaçları, tarım arazileri ve Ain Bou Zidane ile Ain Gazar dahil birçok pınarı vardır. Kendisi bağımsız bir prensi vardır ve tüm ülkelerden baş inci dalgıçları burayı ziyaret eder. {cite:nuzhat-al-mushtaq-2002 s. 387}"
  id: "Pulau Hasna memiliki kota besar, dengan pohon palem, lahan pertanian, dan banyak mata air, termasuk Ain Bou Zidane dan Ain Ghazar. Pulau ini memiliki pangeran merdeka sendiri, dan para penyelam mutiara utama dari berbagai negara mengunjunginya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 387}"
