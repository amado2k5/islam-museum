summary:
  ar: "جزيرة تُسمّى بالسحاب لأن سحاباً أبيض يظهر فوقها ويمتد منه لسان ريح يلتصق بالماء فيثور كالزوبعة، فيمطر من السحاب مطر فيه قذى البحر، وتبعد عن جزيرة الموجه أربعة أيام {cite:nuzhat-al-mushtaq-2002 p. 90}."
  en: "An island named for the white cloud that hangs over it. A wind-driven column from the cloud meets the water and churns like a whirlwind, and rain falls with sea debris. Four days from the island of al-Muwajjah {cite:nuzhat-al-mushtaq-2002 p. 90}."
  es: "Una isla que debe su nombre a la nube blanca que la cubre. Una columna de agua, impulsada por el viento, choca con el agua y se agita como un torbellino, y la lluvia cae con restos marinos. Cuatro días desde la isla de al-Muwajjah {cite:nuzhat-al-mushtaq-2002 p. 90}."
  fr: "Une île ainsi nommée en raison du nuage blanc qui la surplombe. Une colonne d'air, poussée par le vent depuis ce nuage, rencontre l'eau et tourbillonne comme un ouragan, provoquant une pluie chargée de débris marins. À quatre jours de l'île d'al-Muwajjah {cite:nuzhat-al-mushtaq-2002 p. 90}."
