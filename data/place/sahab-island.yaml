summary:
  ar: "جزيرة تُسمّى بالسحاب لأن سحاباً أبيض يظهر فوقها ويمتد منه لسان ريح يلتصق بالماء فيثور كالزوبعة، فيمطر من السحاب مطر فيه قذى البحر، وتبعد عن جزيرة الموجه أربعة أيام {cite:nuzhat-al-mushtaq-2002 p. 90}."
  en: "An island named for the white cloud that hangs over it. A wind-driven column from the cloud meets the water and churns like a whirlwind, and rain falls with sea debris. Four days from the island of al-Muwajjah {cite:nuzhat-al-mushtaq-2002 p. 90}."
