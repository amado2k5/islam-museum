summary:
  ar: "أرض نخلها متصل نحو الغرب والشمال، وكانت عامرة، ثم هرب أهلها في الصحراء بعد مجيء الإسلام، ولم يبق فيها إلا بقايا قوم، والمدينة القديمة داود خراب، وأكثر أهلها يحفرون أصول النبات للطعام، وفيها ما يعتمدون عليه من الإبل {cite:nuzhat-al-mushtaq-2002 p. 115}."
  en: "A land of palm groves stretching west and north. The author says it was once thickly settled, but after Islam arrived its people fled into the desert. Only remnants are left, and the old town of Dawud is in ruins {cite:nuzhat-al-mushtaq-2002 p. 115}."
  es: "Una tierra de palmerales que se extiende hacia el oeste y el norte. El autor afirma que antaño estuvo densamente poblada, pero tras la llegada del Islam, sus habitantes huyeron al desierto. Solo quedan vestigios, y la antigua ciudad de Dawud está en ruinas {cite:nuzhat-al-mushtaq-2002 p. 115}."
  fr: "Une région de palmeraies s'étendant vers l'ouest et le nord. L'auteur indique qu'elle était autrefois densément peuplée, mais qu'après l'arrivée de l'islam, ses habitants ont fui vers le désert. Il n'en reste que des vestiges, et la vieille ville de Dawud est en ruines {cite:nuzhat-al-mushtaq-2002 p. 115}."
  ur: "کھجور کے باغات کی زمین جو مغرب اور شمال میں پھیلی ہوئی ہے۔ مصنف کا کہنا ہے کہ یہ ایک بار بہت گہرا آباد تھا، لیکن اسلام کے آنے کے بعد اس کے لوگ صحرا کی طرف بھاگ گئے۔ صرف باقیات باقی ہیں، اور داؤد کا پرانا شہر کھنڈرات میں ہے {حوالہ: نزہت المشتاق-2002 صفحہ۔ 115}۔"
  tr: "Palmiye ağaçları batı ve kuzeye bağlıdır ve gelişiyordu. Sonra İslam'ın gelişinden sonra halkı çöle kaçtı ve geriye sadece bir halkın kalıntıları kaldı. Davud'un eski şehri harabe oldu, sakinlerinin çoğu yiyecek için bitki kökleri kazıyor ve güvendikleri develer de var {cite:nuzhat-al-mushtaq-2002, s. 115}."
  id: "Pohon palemnya terhubung ke barat dan utara, dan kota ini berkembang pesat. Kemudian penduduknya melarikan diri ke gurun setelah datangnya Islam, meninggalkan hanya sisa-sisa sebuah bangsa. Kota tua Dawood hancur, dan sebagian besar penduduknya menggali akar tanaman untuk makanan, dan ada unta yang mereka andalkan {cite:nuzhat-al-mushtaq-2002, hlm. 115}."
