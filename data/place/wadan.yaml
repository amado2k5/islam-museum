summary:
  ar: "أرض نخلها متصل نحو الغرب والشمال، وكانت عامرة، ثم هرب أهلها في الصحراء بعد مجيء الإسلام، ولم يبق فيها إلا بقايا قوم، والمدينة القديمة داود خراب، وأكثر أهلها يحفرون أصول النبات للطعام، وفيها ما يعتمدون عليه من الإبل {cite:nuzhat-al-mushtaq-2002 p. 115}."
  en: "A land of palm groves stretching west and north. The author says it was once thickly settled, but after Islam arrived its people fled into the desert. Only remnants are left, and the old town of Dawud is in ruins {cite:nuzhat-al-mushtaq-2002 p. 115}."
