summary:
  ar: "ميقات أهل المدينة، عند مسجدها يحرم الحجاج من المدينة؛ يُعرف موضعها اليوم بأبيار علي، وذكره ابن بطوطة في طريقه إلى مكة."
  en: "The miqat of the people of Madina: pilgrims from Madina enter the state of ihram at its mosque. Its site is known today as Abyar Ali, and Ibn Battuta mentions it on his way to Makkah."
  es: "El miqat de la gente de Medina: los peregrinos de Medina entran en estado de ihram en su mezquita. Su emplazamiento se conoce hoy como Abyar Ali, e Ibn Battuta lo menciona en su camino a La Meca."
  fr: "Le miqat des habitants de Médine: les pèlerins de Médine entrent en état d’ihram à sa mosquée. Ce lieu est aujourd’hui connu sous le nom d’Abyar Ali, et Ibn Battuta le mentionne lors de son voyage vers La Mecque."
  ur: "اہل مدینہ کا میقات: مدینہ سے آنے والے حجاج اس کی مسجد میں احرام کی حالت میں داخل ہوتے ہیں۔ اس کا مقام آج ابیار علی کے نام سے جانا جاتا ہے، اور ابن بطوطہ نے مکہ جاتے ہوئے اس کا ذکر کیا ہے۔"
  tr: "Medine halkının miqatı, hacıların şehre ihram yoluyla girdiği camide bulunur; bugün burası Abyar Ali olarak bilinir ve İbn Battuta Mekke'ye giderken bahsetmiştir."
  id: "Miqat masyarakat Madinah berada di masjidnya, tempat para peziarah memasuki kota dalam ihram; lokasinya kini dikenal sebagai Abyar Ali, dan Ibn Battuta menyebutkannya dalam perjalanannya ke Mekah."
