label: { ar: "باب اللان", en: "Bab al-Lan (Darial)", ur: "باب اللان ⁦(دریال)⁩", es: "Bab al-Lan (Darial)", fr: "Bab al-Lan (Darial)" }
summary:
  ar: "باب اللان ثغر بأعالي القوقاز تجاوره أرض شروان وإليه سد اللبن الذي بناه قباذ؛ دخل منه مروان بن محمد أرض الخزر يدلّه أسيد بن زافر السلمي ومعه ملوك الجبال من ناحية الباب والأبواب، وفتحه يزيد بن أسيد السلمي في ولايته لأرمينية ورتّب فيه رابطة من أهل الديوان."
  en: "Bab al-Lan, a pass of the upper Caucasus adjoining Shirwan's land, near the wall of al-Lubn that Qubadh built; through it Marwan ibn Muhammad entered the Khazar land, guided by Asid ibn Zafir al-Sulami with the mountain kings by way of Bab wa-l-Abwab, and Yazid ibn Asid al-Sulami opened it in his governorship of Armenia, stationing there a ribat of diwan men."
  es: "Bab al-Lan, un paso del Alto Cáucaso contiguo a la tierra de Shirwan, cerca de la muralla de al-Lubn que construyó Qubadh; a través de él, Marwan ibn Muhammad entró en la tierra jázara, guiado por Asid ibn Zafir al-Sulami con los reyes de las montañas por el camino de Bab wa-l-Abwab, y Yazid ibn Asid al-Sulami lo abrió en su gobierno de Armenia, estacionando allí un ribat de hombres del diwan."
  fr: "Bab al-Lan, un col du Haut-Caucase jouxtant le pays de Shirwan, près du mur d'al-Lubn que Qubadh a construit; par lui Marwan ibn Muhammad est entré au pays Khazar, guidé par Asid ibn Zafir al-Sulami avec les rois de la montagne par Bab wa-l-Abwab, et Yazid ibn Asid al-Sulami l'a ouvert dans son gouvernement d'Arménie, y stationnant un ribat d'hommes diwan."
  ur: "باب الان، شیروان کی سرزمین سے متصل بالائی قفقاز کا ایک درہ، لبن کی دیوار کے قریب جسے قباد نے تعمیر کیا تھا۔ اس کے ذریعے مروان بن محمد اسید بن ظفر السلمی کی رہنمائی میں پہاڑی بادشاہوں کے ساتھ باب و الابواب کے راستے خزر سرزمین میں داخل ہوا اور یزید بن اسید السلمی نے اسے آرمینیا کی اپنی گورنری میں کھولا اور وہاں دیوانوں کا ایک رباط تعینات کیا۔"
