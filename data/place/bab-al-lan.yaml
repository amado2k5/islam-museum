summary:
  ar: "باب اللان ثغر بأعالي القوقاز تجاوره أرض شروان وإليه سد اللبن الذي بناه قباذ؛ دخل منه مروان بن محمد أرض الخزر يدلّه أسيد بن زافر السلمي ومعه ملوك الجبال من ناحية الباب والأبواب، وفتحه يزيد بن أسيد السلمي في ولايته لأرمينية ورتّب فيه رابطة من أهل الديوان."
  en: "Bab al-Lan, a pass of the upper Caucasus adjoining Shirwan's land, near the wall of al-Lubn that Qubadh built; through it Marwan ibn Muhammad entered the Khazar land, guided by Asid ibn Zafir al-Sulami with the mountain kings by way of Bab wa-l-Abwab, and Yazid ibn Asid al-Sulami opened it in his governorship of Armenia, stationing there a ribat of diwan men."
