label: { ar: "حلب", en: "Aleppo" }
summary:
  ar: "حلب مدينة في شمال سورية على نهر قويق، من أقدم المدن المأهولة في العالم، ذُكرت منذ القرن العشرين قبل الميلاد. صارت عاصمة للحمدانيين على يد سيف الدولة سنة 333هـ، ثم ازدهرت في العهدين الزنكي والأيوبي حتى اقتحمها المغول سنة 658هـ. وكانت مدينة مملوكية ثم عثمانية، وبلغت في العهد العثماني أهم أسواق بلاد الشام."
  en: "Aleppo is a city in northern Syria on the river Kuwayk, among the oldest inhabited cities in the world, first mentioned in the twentieth century BC. It became a Hamdanid capital under Sayf al-Dawla in 333 AH, prospered under the Zangids and Ayyubids, and was stormed by the Mongols in 658 AH. It was then Mamluk and later Ottoman, and in Ottoman times became the principal market of the Levant."
  ur: "حلب شمالی شام میں دریا قویق پر واقع ہے اور دنیا کے قدیم ترین آباد شہروں میں سے ہے، جس کا ذکر پہلی بار بیسویں صدی قبل مسیح میں ملتا ہے۔ یہ 333ھ میں سیف الدولہ کے ہاتھوں حمدانیوں کا دار الحکومت بنا، زنگی اور ایوبی ادوار میں پھلا پھولا، اور 658ھ میں مغلوں نے اس پر یلغار کی۔ پھر یہ مملوک اور بعد میں عثمانی رہا اور عثمانی دور میں مشرق وسطیٰ کی اہم ترین منڈی بنا۔"
