summary:
  ar: "معقل ومدينة صغيرة ذات خصب وحصانة، وبينها وبين البحر اثنا عشر ميلاً، ويلتقي بها وادي موسى من مياه عدة أنهار. {cite:nuzhat-al-mushtaq-2002 p. 617}"
  en: "A stronghold and small town of fertility and strong defences, twelve miles from the sea, where the river of Musa gathers the waters of several streams. {cite:nuzhat-al-mushtaq-2002 p. 617}"
  es: "Un bastión y pequeño pueblo fértil y con fuertes defensas, a doce millas del mar, donde el río Musa recoge las aguas de varios arroyos. {cite:nuzhat-al-mushtaq-2002 p. 617}"
  fr: "Une place forte et une petite ville fertile et bien défendue, à douze milles de la mer, où le fleuve Musa rassemble les eaux de plusieurs ruisseaux. {cite:nuzhat-al-mushtaq-2002 p. 617}"
  ur: "زرخیزی اور مضبوط دفاع کا ایک مضبوط گڑھ اور چھوٹا شہر، سمندر سے بارہ میل دور، جہاں موسیٰ کا دریا کئی ندیوں کے پانی کو جمع کرتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 617}"
  tr: "Verimli ve dayanıklılığa sahip küçük bir kale ve küçük bir şehir olan bu şehir, denizden on iki mil uzaklıkta yer alır ve Wadi Musa, birkaç nehrin sularıyla buluşur. {kaynak:nuzhat-al-mushtaq-2002 s. 617}"
  id: "Sebuah benteng dan kota kecil yang subur serta kuat, terletak dua belas mil dari laut, dan Wadi Musa bertemu dengannya dengan air beberapa sungai. {cite:nuzhat-al-mushtaq-2002 hlm. 617}"
