summary:
  ar: مدينة في شمال الهند، كانت عاصمة المغول في عهد أكبر، وفيها تاج محل.
  en: A city in northern India; it was the Mughal capital in the reign of Akbar and holds the Taj Mahal.
  es: "Ciudad situada en el norte de la India; fue la capital mogol durante el reinado de Akbar y alberga el Taj Mahal."
  fr: "Une ville du nord de l'Inde; elle fut la capitale moghole sous le règne d'Akbar et abrite le Taj Mahal."
  ur: "شمالی ہندوستان کا ایک شہر؛ یہ اکبر کے دور میں مغلوں کا دارالحکومت تھا اور تاج محل رکھتا ہے۔"
  tr: "Kuzey Hindistan'da bir şehir olan bu şehir, Akbar'ın saltanatı sırasında Babürlerin başkentiydi ve Tac Mahal'i barındırır."
  id: "Sebagai kota di India utara, kota ini merupakan ibu kota Mughal pada masa pemerintahan Akbar, dan memiliki Taj Mahal."
