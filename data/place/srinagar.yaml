summary:
  ar: قلب وادي كشمير على بحيرة دال، بنى حولها أباطرة المغول بساتينهم، وأقام أكبر فوقها قلعة هري پربت {cite:brookes-gardens-of-paradise-1987 p.136} {cite:brookes-gardens-of-paradise-1987 p.141}.
  en: The heart of the Vale of Kashmir on Lake Dal, round which the Mughal emperors built their gardens, overlooked by Akbar's fortress of Hari Parbat {cite:brookes-gardens-of-paradise-1987 p.136} {cite:brookes-gardens-of-paradise-1987 p.141}.
  es: "El corazón del Valle de Cachemira en el lago Dal, alrededor del cual los emperadores mogoles construyeron sus jardines, dominado por la fortaleza de Akbar de Hari Parbat {cite:brookes-gardens-of-paradise-1987 p.136} {cite:brookes-gardens-of-paradise-1987 p.141}."
  fr: "Le cœur de la vallée du Cachemire sur le lac Dal, autour duquel les empereurs moghols ont construit leurs jardins, surplombé par la forteresse d'Akbar, Hari Parbat {cite:brookes-gardens-of-paradise-1987 p.136} {cite:brookes-gardens-of-paradise-1987 p.141}."
  ur: "جھیل ڈل پر وادی کشمیر کا دل، جس کے گرد مغل بادشاہوں نے اپنے باغات بنائے تھے، اکبر کے قلعہ ہری پربت سے نظر انداز کیا گیا تھا"
  tr: "Keşmir Vadisi'nin kalbi, Babür imparatorlarının bahçelerini inşa ettiği Dal Gölü üzerindedir ve Akbar Hari Parbit kalesini inşa etmiştir {cite:brookes-gardens-of-paradise-1987 s.136} {cite:brookes-gardens-of-paradise-1987 s.141}."
  id: "Jantung Lembah Kashmir terletak di Danau Dal, di sekitar mana kaisar Mughal membangun kebun buah mereka, dan Akbar membangun benteng Hari Parbit di atasnya {cite:brookes-gardens-of-paradise-1987 hlm.136} {cite:brookes-gardens-of-paradise-1987 hlm.141}."
