label: { ar: "أرمينية", en: "Armenia" }
summary:
  ar: "أرمينية عند البلاذري على تقسيمين: فشمشاط وقاليقلا وخلاط وأرجيش وباجنيس أرمينية الرابعة، وكورة البسفرجان ودبيل وسراج طير وبغروند الثالثة، وجرزان الثانية، والسيسجان وأران الأولى — ويقال شمشاط وحدها الرابعة، وقاليقلا وخلاط وأرجيش وباجنيس الثالثة، وسراج طير وبغروند ودبيل والبسفرجان الثانية، والسيسجان وأران وتفليس الأولى؛ وكانت جرزان وأران في أيدي الخزر وسائر أرمينية في أيدي الروم يتولاها صاحب أرميناقس، وكانت في أيدي الفرس حتى ظهر الإسلام وقد أقرّ أنوشروان ملوك جبل القبق على ممالكهم على الأتاوة."
  en: "Armenia in al-Baladhuri on two schemata: Shimshat, Qaliqala, Khilat, Arjish and Bajunays as the fourth Armenia; the Busfurrajan district, Dabil, Siraj Tayr and Baghrawand the third; Jurzan the second; and Sisajan and Arran the first — or, it is said, Shimshat alone the fourth; Qaliqala, Khilat, Arjish and Bajunays the third; Siraj Tayr, Baghrawand, Dabil and Busfurrajan the second; and Sisajan, Arran and Tiflis the first; Jurzan and Arran were in Khazar hands and the rest of Armenia in Roman hands under the lord of the Armeniakoi, while it had lain in Persian hands until Islam appeared, Anushirwan having confirmed the kings of Jabal al-Qabq on their kingdoms for tribute."
