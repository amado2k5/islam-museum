label:
  ar: أرمينية
  en: Armenia
  es: "Armenia"
  fr: "Arménie"
summary:
  ar: 'أرمينية عند البلاذري على تقسيمين: فشمشاط وقاليقلا وخلاط وأرجيش وباجنيس أرمينية الرابعة، وكورة البسفرجان ودبيل وسراج طير وبغروند الثالثة، وجرزان الثانية، والسيسجان وأران الأولى — ويقال شمشاط وحدها الرابعة، وقاليقلا وخلاط وأرجيش وباجنيس الثالثة، وسراج طير وبغروند ودبيل والبسفرجان الثانية، والسيسجان وأران وتفليس الأولى؛ وكانت جرزان وأران في أيدي الخزر وسائر أرمينية في أيدي الروم يتولاها صاحب أرميناقس، وكانت في أيدي الفرس حتى ظهر الإسلام وقد أقرّ أنوشروان ملوك جبل القبق على ممالكهم على الأتاوة.'
  en: 'Armenia in al-Baladhuri on two schemata: Shimshat, Qaliqala, Khilat, Arjish and Bajunays as the fourth Armenia; the Busfurrajan district, Dabil, Siraj Tayr and Baghrawand the third; Jurzan the second; and Sisajan and Arran the first — or, it is said, Shimshat alone the fourth; Qaliqala, Khilat, Arjish and Bajunays the third; Siraj Tayr, Baghrawand, Dabil and Busfurrajan the second; and Sisajan, Arran and Tiflis the first; Jurzan and Arran were in Khazar hands and the rest of Armenia in Roman hands under the lord of the Armeniakoi, while it had lain in Persian hands until Islam appeared, Anushirwan having confirmed the kings of Jabal al-Qabq on their kingdoms for tribute.'
  es: "Armenia en al-Baladhuri según dos esquemas: Shimshat, Qaliqala, Khilat, Arjish y Bajunays como la cuarta Armenia; el distrito de Busfurrajan, Dabil, Siraj Tire y Baghrawand el tercero; Jurzán el segundo; y Sisajan y Arran el primero, o, se dice, solo Shimshat el cuarto; Qaliqala, Khilat, Arjish y Bajunays el tercero; Siraj Tire, Baghrawand, Double y Busfurrajan el segundo; y Sisajan, Arran y Tbilisi los primeros; Jurzan y Arran estaban en manos jázaras y el resto de Armenia en manos romanas bajo el señor de Armeniakoi, mientras que había estado en manos persas hasta que apareció el Islam, habiendo Anushirwan confirmado a los reyes de Jabal al-Qabq en sus reinos para recibir tributo."
  fr: "L'Arménie à al-Baladhuri sur deux projets: Shimshat, Qaliqala, Khilat, Arjish et Bajunays comme quatrième Arménie; le district de Busfurrajan, Dabil, Siraj Tire et Baghrawand le troisième; Jurzan le second; et Sisajan et Arran le premier — ou, dit-on, Shimshat seul le quatrième; Qaliqala, Khilat, Arjish et Bajunays le troisième; Siraj Tire, Baghrawand, Double et Busfurrajan le deuxième; et Sisajan, Arran et Tbilissi les premiers; Jurzan et Arran étaient aux mains des Khazars et le reste de l'Arménie aux mains des Romains sous le seigneur de l'Armenikoi, alors qu'elle était aux mains des Perses jusqu'à l'apparition de l'Islam, Anushirwan ayant confirmé les rois de Jabal al-Qabq sur leurs royaumes pour tribut."
