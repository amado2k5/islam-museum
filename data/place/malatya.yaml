label: { ar: "ملطية", en: "Malatya (Melitene)", es: "Malatya (Melitene)", fr: "Malatya (Mélitène)", ur: "ملاتیا (Melitene)", tr: "Malatya", id: "Malatya" }
summary:
  ar: "ملطية من ثغور الجزيرة وطريق الصوائف؛ فتحها حبيب بن مسلمة عنوة أيام معاوية ورتّب فيها رابطة وشحنها معاوية بجماعة من أهل الشام والجزيرة، ثم هجّرها عمر بن عبد العزيز أهل طرندة إليها وولاّها جموّنة بن الحارث؛ صمدت لحصار عشرين ألفاً سنة 123 وفيه قاتلت نساؤها على السور، وسقطت لقسطنطين سنة 133 بهدنة الجلاء بين صفّي السيوف فهُدمت، ثم بناها المنصور سنة 140 في ستة أشهر على يدي عبد الوهاب بن إبراهيم والحسن بن قحطبة وأسكنها أربعة آلاف مقاتل جُزَري بزيادة عطاء وبنى لها مسلحتين وحصن قلوذية، وردّ إليها باقي أهلها سنة 141 برابطة محمد بن إبراهيم."
  en: "Malatya (Melitene) of the Jaziran frontier, the summer-expedition road; Habib ibn Maslama took it by force in Mu'awiya's days, who garrisoned it with Syrians and Jazirans — later Umar ibn Abd al-Aziz moved Taranda's people into it under Jamwana ibn al-Harith; it held against a twenty-thousand-man siege in year 123 when its women fought atop the wall, fell to Constantine in year 133 by the evacuation truce between the sword-ranks and was demolished, then al-Mansur rebuilt it in six months in year 140 under Abd al-Wahhab ibn Ibrahim and al-Hasan ibn Qahtaba, settling four thousand Jaziran fighters on increased pay with two muslaha posts and the fortress of Qaludhiya; its remaining people returned in year 141 behind Muhammad ibn Ibrahim's garrison."
  es: "Malatya (Melitene) de la frontera de Jazira, la ruta de la expedición de verano; Habib ibn Maslama la tomó por la fuerza en tiempos de Mu'awiya, quien la guarneció con sirios y jaziranos; más tarde Umar ibn Abd al-Aziz trasladó a la gente de Taranda a ella bajo el mando de Jamwana ibn al-Harith; resistió un asedio de veinte mil hombres en el año 123 cuando sus mujeres lucharon en lo alto de la muralla, cayó en manos de Constantino en el año 133 por la tregua de evacuación entre las filas de espadachines y fue demolida, luego al-Mansur la reconstruyó en seis meses en el año 140 bajo el mando de Abd al-Wahhab ibn Ibrahim y al-Hasan ibn Qahtaba, asentando a cuatro mil combatientes jaziranos con un salario aumentado con dos puestos de muslaha y la fortaleza de Qaludhiya; Los supervivientes regresaron en el año 141 tras la guarnición de Muhammad ibn Ibrahim."
  fr: "Malatya (Mélitène), sur la frontière jaziréenne, était une route d'expédition estivale. Habib ibn Maslama s'en empara par la force sous le règne de Mu'awiya, qui y installa une garnison de Syriens et de Jazirans. Plus tard, Umar ibn Abd al-Aziz y transféra les habitants de Taranda sous Jamwana ibn al-Harith. La ville résista à un siège de vingt mille hommes en l'an 123, lorsque ses femmes combattirent sur les remparts. Elle tomba aux mains de Constantin en l'an 133, suite à une trêve d'évacuation conclue entre les armées, et fut démolie. Al-Mansur la reconstruisit en six mois en l'an 140 sous Abd al-Wahhab ibn Ibrahim et al-Hasan ibn Qahtaba, y installant quatre mille combattants jazirans mieux payés, avec deux postes de muslaha et la forteresse de Qaludhiya. Ses habitants restants revinrent en l'an 141 derrière la garnison de Muhammad ibn Ibrahim."
  ur: "جزیران فرنٹیئر کا ملاتیا (Melitene)، موسم گرما کی مہم کی سڑک؛ حبیب ابن مسلمہ نے معاویہ کے دنوں میں اسے زبردستی لے لیا، جس نے اسے شامیوں اور جزیریوں کے ساتھ گھیر لیا - بعد میں عمر بن عبد العزیز نے ترنڈہ کے لوگوں کو جموانہ بن الحارث کے تحت اس میں منتقل کیا۔ اس نے سنہ 123 میں بیس ہزار آدمیوں کے محاصرے کے خلاف اس وقت منعقد کیا جب اس کی عورتیں دیوار کے اوپر سے لڑیں، 133 میں تلواروں کی صفوں کے درمیان انخلاء کی جنگ بندی کے ذریعے قسطنطنیہ پر گر گئی اور اسے منہدم کر دیا گیا، پھر المنصور نے اسے چھ ماہ میں سنہ 140 میں عبد الوہابن الاحباب الذہب الاحباب کے تحت دوبارہ تعمیر کیا۔ چار ہزار جزیران جنگجوؤں کو دو مصلح پوسٹوں اور قلعہ قلعہ کے ساتھ زیادہ تنخواہ پر آباد کرنا۔ اس کے باقی ماندہ لوگ 141 میں محمد ابن ابراہیم کی چھاؤنی کے پیچھے واپس آئے۔"
  tr: "Malatya, Cizre ve Suwaif yollarının sınırlarından biridir; Muaviye döneminde Habib ibn Maslamah tarafından zorla fethedildi, bir eşkıya kurdu ve Muaviye, Levant ve Arap Yarımadası'ndan bir grupla birlikte burayı yönetti. Daha sonra Taranda'lı Ömer ibn Abdülaziz tarafından terk edildi ve Cumuna bin el-Haris valisi olarak atandı. 123 Hicri'de yirmi bin kişilik kuşatmaya dayandı ve kadınları savaştı duvarın üzerinde. 133 Hicri'de iki kılıç arasındaki tahliye ateşkesi sırasında Konstantin'in eline geçti ve yıkıldı. Sonra el-Mansur, 140 Hicri'de Abd al-Wahhab ibn İbrahim ve el-Hasan ibn Kahtaba tarafından altı ayda yeniden inşa etti. Dört bin Cazari savaşçısı ek bir bağışla buraya yerleşti, iki silahlı adam ve bir kale inşa edildi. Diğer sakinler 141 Hicri'de Muhammed bin İbrahim'in Rabata'sı aracılığıyla buraya geri döndü."
  id: "Malatya adalah salah satu perbatasan Jazira dan jalur Suwaif; wilayah ini ditaklukkan secara paksa oleh Habib ibn Maslamah pada masa Muawiya, membentuk bandit, dan Muawiyah memimpinnya bersama sekelompok orang dari Levant dan Semenanjung Arab. Kemudian wilayah ini ditinggalkan oleh Umar ibn Abd al-Aziz dari Taranda, yang mengangkatnya sebagai gubernur Jumuna ibn al-Harith. Wilayah ini bertahan dari pengepungan dua puluh ribu orang pada tahun 123 H, di mana para wanitanya bertempur di tembok. Kota ini jatuh ke tangan Konstantinus pada tahun 133 H selama gencatan senjata evakuasi antara dua pedang, dan dihancurkan. Kemudian al-Mansur membangunnya kembali pada tahun 140 H dalam enam bulan oleh Abd al-Wahhab ibn Ibrahim dan al-Hasan ibn Qahtaba. Empat ribu pejuang Jazari menetapkannya dengan sumbangan tambahan, dan dua orang bersenjata serta sebuah benteng dibangun untuknya. Sisa penduduknya kembali ke sana pada tahun 141 H melalui Rabata Muhammad ibn Ibrahim."
