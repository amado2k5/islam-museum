summary:
  ar: "مدينة ساحلية على طريق الحج من المدينة ومكة، تمر بها القوافل بين بدر وخليص، وذكرها ابن بطوطة في طريقه إلى مكة."
  en: "A coastal town on the pilgrimage road between Medina and Mecca, through which caravans pass between Badr and Khulays; Ibn Battuta mentions it on his way to Mecca."
  es: "Una ciudad costera situada en la ruta de peregrinación entre Medina y La Meca, por donde pasan las caravanas entre Badr y Khulays; Ibn Battuta la menciona en su camino a La Meca."
  fr: "Ville côtière située sur la route de pèlerinage entre Médine et La Mecque, par laquelle passent les caravanes entre Badr et Khulays; Ibn Battuta la mentionne sur son chemin vers La Mecque."
  ur: "مدینہ اور مکہ کے درمیان حج کی سڑک پر ایک ساحلی شہر، جس سے بدر اور خلیص کے درمیان قافلے گزرتے ہیں۔ ابن بطوطہ نے مکہ جاتے ہوئے اس کا ذکر کیا ہے۔"
  tr: "Medine'den Mekke'ye giden hac güzergahında bir kıyı şehri olan bu şehir, Badr ile Hulais arasında kervanlar geçmektedir ve İbn Battuta Mekke'ye giderken burayı anmıştır."
  id: "Sebuah kota pesisir di jalur ziarah dari Madinah ke Mekah, karavan melintasinya antara Badr dan Khulais, dan Ibn Battuta menyebutkannya dalam perjalanannya ke Mekah."
