label: { ar: "عَفْراء", en: "Afra'", es: "Afra'", fr: "Afra'", ur: "افرا'" }
summary:
  ar: "ماء للروم بفلسطين صلبوا عليه فروة بن عمرو الجذامي وضربوا عنقه؛ ذكره فروة في بيتيه، وفي شرح المواهب للزرقاني أنه ممدود وقصره في الشعر ضرورة، وفي أصول السيرة «عفرا» بالقصر."
  en: "A water of the Romans in Palestine where Farwa ibn Amr al-Judhami was crucified and beheaded; he names it in his two verses, and al-Zurqani's commentary on al-Mawahib reads it with the long ending, shortened in the verse by licence, while the sira's manuscripts have the short form."
  es: "Un río de los romanos en Palestina donde Farwa ibn Amr al-Judhami fue crucificado y decapitado; él lo nombra en sus dos versos, y el comentario de al-Zurqani sobre al-Mawahib lo lee con el final largo, acortado en el verso por licencia, mientras que los manuscritos de la sira tienen la forma corta."
  fr: "Une source romaine en Palestine où Farwa ibn Amr al-Judhami fut crucifié et décapité; il la nomme dans ses deux versets, et le commentaire d'al-Zurqani sur al-Mawahib la lit avec la longue terminaison, abrégée dans le verset par licence, tandis que les manuscrits de la sira ont la forme courte."
  ur: "فلسطین میں رومیوں کا ایک پانی جہاں فروا ابن عمرو الجھمی کو سولی پر چڑھا کر سر قلم کیا گیا تھا۔ اس نے اس کا نام اپنی دو آیات میں رکھا ہے، اور المواہب پر الزرقانی کی تفسیر اسے طویل اختتام کے ساتھ پڑھتی ہے، آیت میں لائسنس کے ذریعے مختصر کیا گیا ہے، جب کہ سیرت کے نسخوں کی مختصر شکل ہے۔"
