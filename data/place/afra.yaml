summary:
  ar: "ماء للروم بفلسطين صلبوا عليه فروة بن عمرو الجذامي وضربوا عنقه؛ ذكره فروة في بيتيه، وفي شرح المواهب للزرقاني أنه ممدود وقصره في الشعر ضرورة، وفي أصول السيرة «عفرا» بالقصر."
  en: "A water of the Romans in Palestine where Farwa ibn Amr al-Judhami was crucified and beheaded; he names it in his two verses, and al-Zurqani's commentary on al-Mawahib reads it with the long ending, shortened in the verse by licence, while the sira's manuscripts have the short form."
