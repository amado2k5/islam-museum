summary:
  ar: قرية قرب صعدة على نحو نصف ميل منها لبني حمزة وبني سعد وفيها الفطيميون، حُبس فيها المحدثون المنفيون من نجران في رجب 286هـ.
  en: A village about half a mile from Sa'da, of Banu Hamza and Banu Sa'd with the Futaymis among them, where the men put out of Najran were jailed in Rajab 286 AH.
  ur: صعدہ سے تقریباً آدھے میل پر ایک بستی، بنو حمزہ اور بنو سعد کی، جس میں فطیمی ہیں، جہاں رجب 286ھ میں نجران سے نکالے گئے لوگ قید کیے گئے۔
  es: "Una aldea situada a aproximadamente media milla de Sa'da, perteneciente a las tribus Banu Hamza y Banu Sa'd, con los Futaymis entre sus habitantes, donde los hombres expulsados de Najran fueron encarcelados en Rajab 286 AH."
  fr: "Un village à environ un demi-mile de Sa'da, des Banu Hamza et des Banu Sa'd avec les Futaymis parmi eux, où les hommes chassés de Najran furent emprisonnés en Rajab 286 AH."
