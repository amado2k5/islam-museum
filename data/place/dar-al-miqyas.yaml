summary:
  ar: "دار كبيرة في جزيرة الروضة يُقاس فيها ارتفاع ماء النيل، بسقية عميقة وعمود رخام قائم في وسطها، ويصف الإدريسي أن زيادة النيل تكون في شهر أغشت، وأن بلوغه عشرين ذراعاً يكفي لري الأرض. {cite:nuzhat-al-mushtaq-2002 p. 325}"
  en: "A large building on Rawda Island where the Nile's rise is measured in a deep basin around a standing marble column. Al-Idrisi says the flood comes in August and that a rise of twenty cubits waters the land well. {cite:nuzhat-al-mushtaq-2002 p. 325}"
