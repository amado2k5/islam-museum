summary:
  ar: "دار كبيرة في جزيرة الروضة يُقاس فيها ارتفاع ماء النيل، بسقية عميقة وعمود رخام قائم في وسطها، ويصف الإدريسي أن زيادة النيل تكون في شهر أغشت، وأن بلوغه عشرين ذراعاً يكفي لري الأرض. {cite:nuzhat-al-mushtaq-2002 p. 325}"
  en: "A large building on Rawda Island where the Nile's rise is measured in a deep basin around a standing marble column. Al-Idrisi says the flood comes in August and that a rise of twenty cubits waters the land well. {cite:nuzhat-al-mushtaq-2002 p. 325}"
  es: "Un gran edificio en la isla de Rawda donde se mide la crecida del Nilo en una profunda cuenca alrededor de una columna de mármol. Al-Idrisi afirma que la inundación llega en agosto y que una crecida de veinte codos riega bien la tierra. {cite:nuzhat-al-mushtaq-2002 p. 325}"
  fr: "Un grand bâtiment sur l'île de Rawda où la crue du Nil est mesurée dans un bassin profond entourant une colonne de marbre. Al-Idrisi affirme que la crue a lieu en août et qu'une montée de vingt coudées suffit à bien irriguer les terres. {cite:nuzhat-al-mushtaq-2002 p. 325}"
  ur: "راودا جزیرے پر ایک بڑی عمارت جہاں نیل کے عروج کو سنگ مرمر کے کھڑے کالم کے گرد گہرے بیسن میں ناپا جاتا ہے۔ الادریسی کا کہنا ہے کہ سیلاب اگست میں آتا ہے اور بیس ہاتھ کا اضافہ زمین کو اچھی طرح سے پانی میں ڈال دیتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 325}"
  tr: "Al-Rawda Adası'nda, Nil'in su seviyesinin derin bir sulama kanalı ve ortasında duran bir mermer sütunla ölçüldüğü büyük bir ev. Al-Idrisi, Ağustos ayında Nil'in yükselişini ve yirmi arşına ulaşmanın toprağın sulaması için yeterli olduğunu anlatır. {kaynak:nuzhat-al-mushtaq-2002 s. 325}"
  id: "Sebuah rumah besar di Pulau Al-Rawda di mana permukaan air Sungai Nil diukur dengan kanal irigasi yang dalam dan kolom marmer berdiri di tengahnya. Al-Idrisi menggambarkan peningkatan Sungai Nil pada bulan Agustus, dan mencapai dua puluh hasta sudah cukup untuk mengairi tanah. {cite:nuzhat-al-mushtaq-2002 hlm. 325}"
