summary:
  ar: مدينة في جنوب شرق تركيا على طريق الجزيرة، ذكرها ابن بطوطة في طريقه. وفي سنة إحدى وثمانين ومائتين عمد إليها المعتضد فحارب
    من في قلعتها يومه وصعد حتى قرُب من الباب فصاح باسم حمدان بن حمدون فأُجيب فقال افتح الباب ففُتح فقعد فيه ونُقل ما في القلعة
    ثم أمر بهدمها فهُدمت {cite:muntazam-ibn-al-jawzi p. 147}.
  en: A city in south-eastern Turkey on the Jazira road, which Ibn Battuta mentions on his journey. In the year 281 AH al-Mu'tadid
    set out against it and fought those in its citadel all day; he climbed until he came near the gate and called out the
    name of Hamdan ibn Hamdun, who answered him. He told him to open the gate, and it was opened; he sat in it, the contents
    of the citadel were removed, and then he ordered the citadel demolished, and it was demolished {cite:muntazam-ibn-al-jawzi
    p. 147}.
  es: "Una ciudad en el sureste de Turquía, en la ruta de Jazira, que Ibn Battuta menciona en su viaje. En el año 281 AH, al-Mu'tadid partió contra ella y luchó contra los que se encontraban en su ciudadela durante todo el día; ascendió hasta acercarse a la puerta y llamó a Hamdan ibn Hamdun, quien le respondió. Le ordenó que abriera la puerta, y así fue; se sentó dentro, se saquearon los objetos de la ciudadela y luego ordenó su demolición, la cual se llevó a cabo {cite:muntazam-ibn-al-jawzi p. 147}."
  fr: "Une ville du sud-est de la Turquie, sur la route de Jazira, mentionnée par Ibn Battuta lors de son voyage. En 281 AH, al-Mu'tadid partit à son assaut et combattit toute la journée les habitants de sa citadelle. Il gravit la ville jusqu'à la porte et appela Hamdan ibn Hamdun, qui lui répondit. Il lui ordonna d'ouvrir la porte, ce qui fut fait; Hamdan s'y installa, le contenu de la citadelle fut vidé, puis il ordonna sa démolition, qui fut effectuée (cf. Muntazam ibn al-Jawzi, p. 147)."
