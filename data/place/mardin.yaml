  ar: "مدينة في جنوب شرق تركيا على طريق الجزيرة، ذكرها ابن بطوطة في طريقه. وفي سنة إحدى وثمانين ومائتين عمد إليها المعتضد فحارب من في قلعتها يومه وصعد حتى قرُب من الباب فصاح باسم حمدان بن حمدون فأُجيب فقال افتح الباب ففُتح فقعد فيه ونُقل ما في القلعة ثم أمر بهدمها فهُدمت {cite:muntazam-ibn-al-jawzi p. 147}."
