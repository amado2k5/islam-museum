summary:
  ar: "مدينة في جنوب شرق تركيا على طريق الجزيرة، ذكرها ابن بطوطة في طريقه. وفي سنة إحدى وثمانين ومائتين عمد إليها المعتضد فحارب من في قلعتها يومه وصعد حتى قرُب من الباب فصاح باسم حمدان بن حمدون فأُجيب فقال افتح الباب ففُتح فقعد فيه ونُقل ما في القلعة ثم أمر بهدمها فهُدمت {cite:muntazam-ibn-al-jawzi p. 147}."
  en: "A city in south-eastern Turkey on the Jazira road, which Ibn Battuta mentions on his journey. In the year 281 AH al-Mu'tadid set out against it and fought those in its citadel all day; he climbed until he came near the gate and called out the name of Hamdan ibn Hamdun, who answered him. He told him to open the gate, and it was opened; he sat in it, the contents of the citadel were removed, and then he ordered the citadel demolished, and it was demolished {cite:muntazam-ibn-al-jawzi p. 147}."
