summary:
  ar: "مدينة عظيمة الدور، سورها من حجر وفيها نهر مغطى ببلاطات نحاس، وفيها كنيسة عظيمة، وقصر الملك المسمى البابة، ويصفها الإدريسي بأنها ركن من أركان النصارى، وتبعد عن بيش بنحو خمسين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 751}"
  en: "A great city with a stone wall, a river covered with copper slabs and a great church, and a palace of the king called the Papa; al-Idrisi calls it a pillar of the Christians, about fifty miles from Pisa. {cite:nuzhat-al-mushtaq-2002 p. 751}"
  es: "Una gran ciudad con muralla de piedra, un río cubierto de losas de cobre y una gran iglesia, y un palacio del rey llamado Papa; al-Idrisi la llama un pilar de los cristianos, a unas cincuenta millas de Pisa. {cite:nuzhat-al-mushtaq-2002 p. 751}"
  fr: "Une grande ville entourée de remparts de pierre, traversée par une rivière bordée de dalles de cuivre, dotée d'une église imposante et d'un palais royal appelé le Papa; al-Idrisi la qualifie de pilier des chrétiens, à environ quatre-vingts kilomètres de Pise. {cite:nuzhat-al-mushtaq-2002 p. 751}"
