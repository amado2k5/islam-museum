summary:
  ar: "مدينة تُسمى توزر، ولها سور حصين، وبها نخل كثير، والأترج الكبير الحسن، وأجود بقولها ما يعم بلاد إفريقية. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  en: "A city also called Tuzar, with a strong wall, many palms and large citrons; its vegetables are among the best in the Ifriqiya lands. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  es: "Una ciudad también llamada Tuzar, con una sólida muralla, muchas palmeras y grandes limones; sus verduras se encuentran entre las mejores de las tierras de Ifriqiya. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  fr: "Une ville également appelée Tuzar, dotée d'une solide muraille, de nombreux palmiers et de grands citronniers; ses légumes comptent parmi les meilleurs des terres d'Ifriqiya. {cite:nuzhat-al-mushtaq-2002 p. 277}"
  ur: "ایک شہر جسے توزار بھی کہا جاتا ہے، ایک مضبوط دیوار، بہت سی کھجوریں اور بڑے لیموں کے ساتھ؛ اس کی سبزیاں افریقیہ زمینوں میں بہترین ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 277}"
  tr: "Tozeur adında, sağlam duvarı, çok sayıda palmiye ağacı ve büyük, güzel portakal ağaçları olan, en iyi yetiştiricisi Afrika topraklarında yaygın değildir. {cite:nuzhat-al-mushtaq-2002 s. 277}"
  id: "Sebuah kota bernama Tozeur, yang memiliki tembok kuat, banyak pohon palem, dan pohon jeruk besar yang indah, serta yang terbaik dalam budidayanya tidak umum di tanah Afrika. {cite:nuzhat-al-mushtaq-2002 hlm. 277}"
