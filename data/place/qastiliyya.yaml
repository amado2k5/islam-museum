  fr: "Une ville également appelée Tuzar, dotée d'une solide muraille, de nombreux palmiers et de grands citronniers; ses légumes comptent parmi les meilleurs des terres d'Ifriqiya. {cite:nuzhat-al-mushtaq-2002 p. 277}"
