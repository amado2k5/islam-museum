label: { ar: "مدينة الزهراء" }
summary:
  ar: "الزهراء بفتح الزاي وسكون الهاء وفتح الراء وبعدها همزة ممدودة، من عجائب أبنية الدنيا أنشأها الناصر عبد الرحمن بالقرب من قرطبة في أول سنة خمس وعشرين وثلاثمائة على بعد أربعة أميال وثلثي ميل منها، طولها من الشرق إلى الغرب ألفان وسبعمائة ذراع وعرضها ألف وخمسمائة ذراع وفيها أربعة آلاف سارية وثلاثمائة سارية وأبوابها تزيد على خمسة عشر ألف باب، وكان الناصر يقسم جباية البلاد أثلاثاً فثلث للجند وثلث مدخر وثلث ينفقه على عمارتها، وكانت جباية الأندلس خمسة آلاف ألف وأربعمائة وثمانين ألف دينار ومن السوق والمستخلص سبعمائة وخمسة وستون ألفاً؛ أخباره كلها ابن بشكوال نقلها ابن خلكان {cite:nafh-tib-maqqari p. 560-561}."
  en: "Madīnat al-Zahrāʾ, 'one of the wonders of the world's buildings' in Ibn Khallikan's citation of Ibn Bashkuwal: begun by al-Nasir in early 325, four and two-thirds miles from Cordoba, 2,700 by 1,500 cubits, holding 4,300 columns and more than 15,000 doors; al-Nasir split the land revenue three ways — army, reserve, and the works — from a kharaj of 5,480,000 dinars plus 765,000 in market dues {cite:nafh-tib-maqqari p. 560-561}."
