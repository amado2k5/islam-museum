label: { ar: "مدينة الزهراء", en: "Madinat al-Zahra'", es: "Madinat al-Zahra'", fr: "Madinat al-Zahra'", ur: "مدینۃ الزہراء", tr: "El-Zahraa Şehri", id: "Kota Al-Zahraa" }
summary:
  ar: "الزهراء بفتح الزاي وسكون الهاء وفتح الراء وبعدها همزة ممدودة، من عجائب أبنية الدنيا أنشأها الناصر عبد الرحمن بالقرب من قرطبة في أول سنة خمس وعشرين وثلاثمائة على بعد أربعة أميال وثلثي ميل منها، طولها من الشرق إلى الغرب ألفان وسبعمائة ذراع وعرضها ألف وخمسمائة ذراع وفيها أربعة آلاف سارية وثلاثمائة سارية وأبوابها تزيد على خمسة عشر ألف باب، وكان الناصر يقسم جباية البلاد أثلاثاً فثلث للجند وثلث مدخر وثلث ينفقه على عمارتها، وكانت جباية الأندلس خمسة آلاف ألف وأربعمائة وثمانين ألف دينار ومن السوق والمستخلص سبعمائة وخمسة وستون ألفاً؛ أخباره كلها ابن بشكوال نقلها ابن خلكان {cite:nafh-tib-maqqari p. 560-561}، وحكى ابن حيان أنه كان يتصرف في عمارتها كل يوم من الخدام والفعلة عشرة آلاف رجل ومن الدواب ألف وخمسمائة دابة ويُصرف فيها كل يوم من الصخر المنحوت المعدل ستة آلاف صخرة سوى الآجر والصخر غير المعدل، وكان يثيب على كل رخامة كبيرة أو صغيرة عشرة دنانير سوى النفقة على قطعها ونقلها، وجُلب إليها الرخام الأبيض من المرية والمجزع من رية والوردي والأخضر من إفريقية من إسفاقس وقرطاجنة والحوض المنقوش المذهب من الشام وقيل من القسطنطينية، وبنى فيها المجلس المسمى قصر الخلافة وكان سقفه من الذهب والرخام وحيطانه مثل ذلك وجُعلت في وسطه اليتيمة التي أتحف بها الناصرَ ليون ملك القسطنطينية، وكانت قرامد القصر من الذهب والفضة وفي وسط المجلس صهريج عظيم مملوء بالزئبق وفي كل جانب ثمانية أبواب على حنايا من العاج والآبنوس المرصع بالذهب على سوار من الرخام الملون والبلور الصافي، وكان الناصر إذا أراد أن يفزع أحداً من أهل مجلسه أومأ إلى أحد صقالبته فيحرك الزئبق فيظهر في المجلس كلمعان البرق ويخيل لكل من فيه أن المجلس قد طار بهم، وهدمت في الفتنة وقعد المعتمد بن عباد ووزراؤه وكتابه بالزهراء الخراب يوماً يتعاطون الكؤوس بين آثارها فوافاهم رسول المعتمد بدعوته إلى قصر البستان {cite:nafh-tib-maqqari p. 563, 660}."
  en: "Madīnat al-Zahrāʾ, 'one of the wonders of the world's buildings' in Ibn Khallikan's citation of Ibn Bashkuwal: begun by al-Nasir in early 325, four and two-thirds miles from Cordoba, 2,700 by 1,500 cubits, holding 4,300 columns and more than 15,000 doors; al-Nasir split the land revenue three ways — army, reserve, and the works — from a kharaj of 5,480,000 dinars plus 765,000 in market dues {cite:nafh-tib-maqqari p. 560-561}."
  es: "Madīnat al-Zahrāʾ, iniciada por al-Nasir a principios del 325, a cuatro millas y dos tercios de Córdoba, 2700 por 1500 codos, con 4300 columnas y más de 15 000 puertas; al-Nasir dividió los ingresos de la tierra en tres partes: ejército, reserva y obras, de un kharaj de 5 480 000 dinares más 765 000 en derechos de mercado {cite:nafh-tib-maqqari p. 560-561}."
  fr: "Madīnat al-Zahrāʾ, commencée par al-Nasir au début de 325, à quatre milles et deux tiers de Cordoue, 2 700 coudées sur 1 500, avec 4 300 colonnes et plus de 15 000 portes; al-Nasir a divisé les revenus fonciers en trois parts — armée, réserve et travaux — à partir d'un kharaj de 5 480 000 dinars plus 765 000 de droits de marché {cite:nafh-tib-maqqari p. 560-561}."
  ur: "مدینۃ الزہراء، 'دنیا کی عجائبات میں سے ایک' ابن خلقان کے ابن بشکوال کے حوالے سے: النصیر نے 325 کے اوائل میں قرطبہ سے چار اور دو تہائی میل کے فاصلے پر، 2,700 بائی 1,500 ہاتھ اور 4001 لمبے لمبے لمبے لمبے لمبے لمبے لمبے لمبے 325 میں شروع کی دروازے الناصر نے زمین کی آمدنی کو تین طریقوں سے تقسیم کیا - فوج، ریزرو اور کام - 5,480,000 دینار اور 765,000 بازار کے واجبات سے۔ 560-561}۔"
  tr: "Zay'de bir fetha, h üzerinde sukun, r üzerinde fetha ve ardından uzatılmış bir hamza bulunan Al-Zehra, dünyanın binalarının harikalarından biridir. Üç yüz yirmi beş yüz hicri yılın ilk yılında El-Nasir Abd al-Rahman tarafından Cordoba yakınlarında, dört üçte iki mil uzaklıkta inşa edilmiştir. Doğudan batıya uzunluğu iki bin yedi yüz arşın, genişliği bin beş yüz arşın, dört bin sütun ve üç yüz direğe sahiptir ve kapıları on beş bini aşmaktadır. Al-Nasir şehrin vergi tahsilatını üçte üçe bölmüştür: üçte biri askerler için, üçte biri tasarruf edilmiş ve üçte biri inşaat için harcanmıştır. Bu bir tahsilattı Endülüs beş bin dört yüz seksen bin dinardı, pazarda ve çıkarıldığında ise yedi yüz altmış beş bin dinardı; tüm raporları İbn Hallikan tarafından aktarılan İbn Başkuwal'dan alınmıştır {atıf:nafh-tib-maqqari s. 560-561}. İbn Hayyan, inşaatını her gün hizmetçiler ve işçilerden, on bin adamdan ve hayvanlardan yönettiğini, modifiye kayadan oyulmuş kayadan günde altı bin taş harcadığını, tuğla ve değiştirilmemiş taş hariç aktardığını bildirmiştir. Her büyük ya da küçük mermer parçası için on dinar ödüllendirilmiştir, ancak Onları kesip taşımak için harcadı. Almeria'dan beyaz mermer, Raya'dan majza', Ifriqiya'dan, İsfagh ve Kartagena'dan pembe ve yeşil, Levant'tan ve bazılarına göre İstanbul'dan altın oymalı leğen getirdi. Orada, altın, mermer çatılı ve benzer duvarlarla Halifelik Sarayı olarak adlandırılan konseyi inşa etti ve ortasına, Konstantinopolis Kralı Nasir Leon'un hediyesiyle süslenmiş yetimi yerleştirdi. Sarayın tonozları altın ve gümüşten yapılmıştı; ortasında cıva dolu büyük bir sarnıç ve her iki yanında sekiz kapı fildişi kılıflarla donatılmıştı Abanoz, renkli mermer ve şeffaf kristalden yapılmış bir bilezikte altınla süslenmişti. Al-Nasir konsey üyelerinden herhangi birini korkutmak istediğinde, birine parlatmasını işaret eder, cıva hareketlenir, bu da toplanmada yıldırım gibi belirir ve içerideki herkes toplanmanın uçup gittiğini sanırdı. Kargaşa içinde yok olurdu. Bir gün, al-Mu'tamid ibn Abbad, bakanları ve katipleri al-Zahra al-Rubar'da oturup bardaklar arasında değiş tokuş ederlerdi; bu yüzden el-Mu'tamid'in elçisi onları al-Bustan sarayına davet eder {cite:nafh-tib-maqqari, s. 563, 660}."
  id: "Al-Zahra, dengan fatha di zay, sukun di h, fatha di h, diikuti hamza yang diperpanjang, adalah salah satu keajaiban bangunan dunia. Bangunan ini dibangun oleh Al-Nasir Abd al-Rahman dekat Cordoba pada tahun pertama tiga ratus dua puluh lima ratus H, terletak empat dua pertiga mil jauhnya. Panjangnya dari timur ke barat adalah dua ribu tujuh ratus hasta, lebarnya seribu lima ratus hasta, memiliki empat ribu tiang dan tiga ratus tiang, dan gerbangnya melebihi lima belas ribu. Al-Nasir membagi pungutan pajak kota menjadi tiga perempat: sepertiga untuk tentara, sepertiga untuk tabungan, dan sepertiga untuk pembangunannya. Ini adalah pengumpulan Al-Andalus adalah lima ribu empat ratus delapan puluh ribu dinar, dan di pasar dan mengambilnya tujuh ratus enam puluh lima ribu; semua laporannya berasal dari Ibn Bashkuwal, yang dilaporkan oleh Ibn Khallikan {cite:nafh-tib-maqqari hlm. 560-561}. Ibn Hayyan melaporkan bahwa ia mengelola pembangunannya setiap hari dari pelayan dan pekerja, sepuluh ribu orang, dan dari hewan seribu lima ratus hewan, menghabiskan enam ribu batu setiap hari dari batu ukir dari batu modifikasi, tidak termasuk batu bata dan batu yang tidak dimodifikasi. Ia diberi hadiah sepuluh dinar untuk setiap keping marmer besar atau kecil, kecuali Ia menghabiskan waktu untuk memotong dan memindahkannya. Ia membawa marmer putih dari Almeria, majza' dari Raya, dan merah muda dan hijau dari Ifriqiya, dari Isfagh dan Cartagena, serta baskom berukir emas dari Levant, dan beberapa orang mengatakan dari Konstantinopel. Ia membangun dewan di sana, yang disebut Istana Khalifah, dengan atap emas dan marmer serta dinding serupa, dan menempatkan di tengahnya yatim piatu yang dihiasi hadiah dari Nasir Leon, Raja Konstantinopel. Kubah istana terbuat dari emas dan perak, dengan sebuah penampungan besar berisi merkuri di tengah dan delapan pintu di setiap sisi dengan sarung gading Kayu ebony itu dihiasi emas pada gelang marmer berwarna dan kristal bening. Ketika al-Nasir ingin menakuti anggota dewan mana pun, ia akan memberi isyarat kepada seseorang untuk memolesnya, mengaduk merkuri yang akan muncul di pertemuan seperti petir, dan semua orang di dalamnya mengira pertemuan itu telah terbawa angin. Istana itu hancur dalam kekacauan. Suatu hari, al-Mu'tamid ibn Abbad, para menterinya, dan para penulisnya duduk di al-Zahra al-Rubar, bertukar cangkir di antara jejaknya, sehingga utusan al-Mu'tamid mengundang mereka ke istana al-Bustan {cite:nafh-tib-maqqari, hlm. 563, 660}."
