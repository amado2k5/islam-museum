label: { ar: "مدينة الزهراء" }
summary:
  ar: "الزهراء بفتح الزاي وسكون الهاء وفتح الراء وبعدها همزة ممدودة، من عجائب أبنية الدنيا أنشأها الناصر عبد الرحمن بالقرب من قرطبة في أول سنة خمس وعشرين وثلاثمائة على بعد أربعة أميال وثلثي ميل منها، طولها من الشرق إلى الغرب ألفان وسبعمائة ذراع وعرضها ألف وخمسمائة ذراع وفيها أربعة آلاف سارية وثلاثمائة سارية وأبوابها تزيد على خمسة عشر ألف باب، وكان الناصر يقسم جباية البلاد أثلاثاً فثلث للجند وثلث مدخر وثلث ينفقه على عمارتها، وكانت جباية الأندلس خمسة آلاف ألف وأربعمائة وثمانين ألف دينار ومن السوق والمستخلص سبعمائة وخمسة وستون ألفاً؛ أخباره كلها ابن بشكوال نقلها ابن خلكان {cite:nafh-tib-maqqari p. 560-561}، وحكى ابن حيان أنه كان يتصرف في عمارتها كل يوم من الخدام والفعلة عشرة آلاف رجل ومن الدواب ألف وخمسمائة دابة ويُصرف فيها كل يوم من الصخر المنحوت المعدل ستة آلاف صخرة سوى الآجر والصخر غير المعدل، وكان يثيب على كل رخامة كبيرة أو صغيرة عشرة دنانير سوى النفقة على قطعها ونقلها، وجُلب إليها الرخام الأبيض من المرية والمجزع من رية والوردي والأخضر من إفريقية من إسفاقس وقرطاجنة والحوض المنقوش المذهب من الشام وقيل من القسطنطينية، وبنى فيها المجلس المسمى قصر الخلافة وكان سقفه من الذهب والرخام وحيطانه مثل ذلك وجُعلت في وسطه اليتيمة التي أتحف بها الناصرَ ليون ملك القسطنطينية، وكانت قرامد القصر من الذهب والفضة وفي وسط المجلس صهريج عظيم مملوء بالزئبق وفي كل جانب ثمانية أبواب على حنايا من العاج والآبنوس المرصع بالذهب على سوار من الرخام الملون والبلور الصافي، وكان الناصر إذا أراد أن يفزع أحداً من أهل مجلسه أومأ إلى أحد صقالبته فيحرك الزئبق فيظهر في المجلس كلمعان البرق ويخيل لكل من فيه أن المجلس قد طار بهم، وهدمت في الفتنة وقعد المعتمد بن عباد ووزراؤه وكتابه بالزهراء الخراب يوماً يتعاطون الكؤوس بين آثارها فوافاهم رسول المعتمد بدعوته إلى قصر البستان {cite:nafh-tib-maqqari p. 563, 660}."
  en: "Madīnat al-Zahrāʾ, 'one of the wonders of the world's buildings' in Ibn Khallikan's citation of Ibn Bashkuwal: begun by al-Nasir in early 325, four and two-thirds miles from Cordoba, 2,700 by 1,500 cubits, holding 4,300 columns and more than 15,000 doors; al-Nasir split the land revenue three ways — army, reserve, and the works — from a kharaj of 5,480,000 dinars plus 765,000 in market dues {cite:nafh-tib-maqqari p. 560-561}."
