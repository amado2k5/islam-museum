summary:
  ar: "بلدة في أفغانستان بالإقليم الشمالي الغربي حول مزار شريف، على السهوب، قرب نهر أندخوي، ومعروفة بتجارة جلود الكركول {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  en: "A town of about 25,000 in north-western Afghanistan, near Mazar-i Sharif, on the steppe north of the Oxus, known as a centre of the karakul lambskin trade {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  es: "Una ciudad de unos 25.000 habitantes en el noroeste de Afganistán, cerca de Mazar-i Sharif, en la estepa al norte del Oxus, conocida como centro del comercio de pieles de cordero karakul {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  fr: "Une ville d'environ 25 000 habitants dans le nord-ouest de l'Afghanistan, près de Mazar-i Sharif, dans la steppe au nord de l'Oxus, connue comme un centre du commerce de la peau d'agneau karakul {cite:encyclopaedia-of-islam-2 vol. 1 p. 530}."
  ur: "شمال مغربی افغانستان میں تقریباً 25,000 پر مشتمل ایک قصبہ، مزار شریف کے قریب، آکسس کے شمال میں اسٹیپ پر، جو قراقل میمن کی کھال کی تجارت کے مرکز کے طور پر جانا جاتا ہے۔ 1 ص۔ 530}۔"
