  fr: "Une ville de marchés, de commerce et de richesse en circulation, construite en terre, à soixante-quinze milles d'Aqda. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  ur: "عقدہ سے پچھتر میل کے فاصلے پر منڈیوں، تجارت اور دولت کی گردش کا ایک قصبہ جو مٹی سے بنا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 431}"
  tr: "Pazarları, dükkanları ve yönetilen mülkleri olan, kilden inşa edilmiş ve Kent'e yetmiş beş mil uzaklıkta bulunan bir şehir. {cite:nuzhat-al-mushtaq-2002 s. 431}"
  id: "Sebuah kota dengan pasar, toko, dan properti yang dikelola, dibangun dari tanah liat, dan terletak tujuh puluh lima mil dari Kent. {cite:Nuzhat-al-Mushtaq-2002 hlm. 431}"
