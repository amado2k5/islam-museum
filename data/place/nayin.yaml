  ar: "مدينة لها أسواق ومتاجر وأموال متصرفة، بناؤها من الطين، وتبعد عن عقدة خمسة وسبعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 431}"
  en: "A town of markets, trade and circulating wealth, built of mud, seventy-five miles from Aqda. {cite:nuzhat-al-mushtaq-2002 p. 431}"
