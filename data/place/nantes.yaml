summary:
  ar: "مدينة كبيرة عامرة آهلة ذات حروث وخارج، وهي مدينة حصينة رائقة، ومنها يتجهز التجار، وتقع في قعر جون خارج من البحر، وتبعد عن بلفير نحو خمسين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  en: "A large, populous, inhabited city with fields and outlying land; a strong and pleasing city from which merchants fit out, in a bay that opens from the sea; about fifty miles from Belfer. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  es: "Una ciudad grande, populosa y habitada, con campos y terrenos aledaños; una ciudad fuerte y agradable desde donde parten los comerciantes, situada en una bahía que se abre al mar; a unas cincuenta millas de Belfer. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  fr: "Une grande ville, peuplée et habitée, entourée de champs et de terres environnantes; une ville prospère et agréable d'où partaient les marchands, située dans une baie ouverte sur la mer; à environ cinquante milles de Belfer. {cite:nuzhat-al-mushtaq-2002 p. 856}"
  ur: "ایک بڑا، آبادی والا، کھیتوں اور باہر کی زمین کے ساتھ آباد شہر؛ ایک مضبوط اور خوشنما شہر جہاں سے تاجر فٹ بیٹھتے ہیں، ایک خلیج میں جو سمندر سے کھلتی ہے۔ بیلفر سے تقریباً پچاس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 856}"
