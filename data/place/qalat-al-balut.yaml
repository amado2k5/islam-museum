summary:
  ar: "حصن منيع ومعقل شامخ عالي الذروة، بواد شريفة خصيبة وضياع طيبة، تحيط به أودية عليها كثير من الأرحاء، وتبعد عن الشاقة نحو اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  en: "A strong fortress and a lofty stronghold, with noble valleys, fertile estates and many mills on its streams, about twelve miles from al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  es: "Una fortaleza sólida y un elevado bastión, con valles nobles, fincas fértiles y numerosos molinos en sus arroyos, a unas doce millas de al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  fr: "Une forteresse imposante et un haut lieu, avec de nobles vallées, des terres fertiles et de nombreux moulins sur ses cours d'eau, à environ douze milles d'al-Shaqqa. {cite:nuzhat-al-mushtaq-2002 p. 600}"
  ur: "ایک مضبوط قلعہ اور ایک اونچا مضبوط قلعہ، جس میں عظیم وادیاں، زرخیز جاگیریں اور اس کی ندیوں پر بہت سی چکیاں، الشقا سے تقریباً بارہ میل کے فاصلے پر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 600}"
