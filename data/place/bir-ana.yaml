summary:
  ar: "بئر من آبار بني قريظة، في ناحية أموالهم بالمدينة؛ نزل عليها النبي حين أتى بني قريظة ⁦(ابن هشام، الجزء الأول القسم الثاني، ص 149)⁩."
  en: "A well among the wells of the Banu Qurayza, in the area of their properties in Medina. The Prophet halted by it when he came to the Banu Qurayza (Ibn Hisham, vol. 1 part 2, p. 149)."
  es: "Un pozo entre los pozos de los Banu Qurayza, en la zona de sus propiedades en Medina. El Profeta se detuvo junto a él cuando llegó a Banu Qurayza (Ibn Hisham, vol. 1, parte 2, pág. 149)."
  fr: "Un puits parmi les puits des Banu Qurayza, dans la zone de leurs propriétés à Médine. Le Prophète s'y arrêta lorsqu'il arriva chez les Banu Qurayza (Ibn Hisham, vol. 1 partie 2, p. 149)."
  ur: "بنو قریظہ کے کنوؤں میں سے ایک کنواں، مدینہ میں ان کی جائیدادوں کے علاقے میں۔ جب آپ بنو قریظہ کے پاس آئے تو نبی نے اسے روک دیا ⁦(ابن ہشام، جلد 1 حصہ 2، صفحہ 149)⁩۔"
  tr: "Banu Kureyze kuyuları arasında, Medine'deki servetlerine yakın bir kuyu; Peygamber Banu Kurayza'yı ziyaret ettiğinde orada kalmıştır (İbn Hişem, Birinci Cilt, İkinci Bölüm, s. 149)."
  id: "Sebuah sumur di antara sumur Banu Qurayza, terletak dekat kekayaan mereka di Madinah; Nabi tinggal di sana saat mengunjungi Banu Qurayza (Ibn Hisham, Jilid Satu, Bagian Dua, hlm. 149)."
