summary:
  ar: "جزيرة بها مرسى مأمون يكن من كل ريح، وتبعد عن أقرب بر فيها مسافة معلومة، ويحمل إليها الأسطول. {cite:nuzhat-al-mushtaq-2002 p. 588}"
  en: "An island with a sheltered harbour that protects from every wind; the fleet is carried there from the nearest shore. {cite:nuzhat-al-mushtaq-2002 p. 588}"
  es: "Una isla con un puerto resguardado que protege de todo viento; la flota es transportada allí desde la costa más cercana. {cite:nuzhat-al-mushtaq-2002 p. 588}"
  fr: "Une île dotée d'un port abrité de tous les vents; la flotte y est transportée depuis la côte la plus proche. {cite:nuzhat-al-mushtaq-2002 p. 588}"
  ur: "ایک پناہ گاہ والا جزیرہ جو ہر ہوا سے بچاتا ہے۔ بیڑے کو قریب ترین ساحل سے وہاں لے جایا جاتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 588}"
  tr: "Rüzgarlardan arınmış, güvenli limana sahip bir ada ve filonun taşındığı en yakın karadan bilinen bir mesafede. {cite:nuzhat-al-mushtaq-2002 s. 588}"
  id: "Sebuah pulau dengan pelabuhan yang aman yang bebas dari segala angin, dan jarak yang diketahui dari daratan terdekat tempat armada dibawa. {cite:nuzhat-al-mushtaq-2002 hlm. 588}"
