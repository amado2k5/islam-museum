label: { ar: "ألبة والقلاع", en: "Alaba wa l-Kila' ('Alava and the forts', northern Spain)", es: "Alaba wa l-Kila' ('Álava y las fortalezas', norte de España)", fr: "Alaba wa l-Kila' (« Alava et les forts », nord de l'Espagne)" }
summary:
  ar: "ألبة والقلاع، اسم جغرافي استعمله المؤرخون العرب في القرنين الثاني والثالث الهجريين لذلك الجزء من إسبانيا النصرانية الأكثر تعرضًا لغارات الصوائف التي كانت تُرسل من قرطبة، وكان يدل خاصة على الشمال وراء الضفة اليسرى لأعالي وادي إبرو، وتحدّه من الغرب بوربورة وقشتالة القديمة؛ وإقليم ألبة اليوم، عاصمته فيتوريا {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  en: "Alaba wa l-Kila' ('Alava and the forts'), a geographical term used by Arab chroniclers of the 2nd and 3rd centuries AH for the part of Christian Spain most exposed to the summer raids sent out from Cordova. It denoted especially the north beyond the upper Ebro; Alava is today a Spanish province whose capital is Vitoria {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  es: "Alaba wa l-Kila' ('Álava y las fortalezas'), término geográfico utilizado por los cronistas árabes de los siglos II y III d. H. para referirse a la parte de la España cristiana más expuesta a las incursiones estivales enviadas desde Córdoba. Designaba especialmente el norte, más allá del curso superior del Ebro; Álava es hoy una provincia española cuya capital es Vitoria {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  fr: "Alaba wa l-Kila' (« Alava et les forteresses »), terme géographique employé par les chroniqueurs arabes des IIe et IIIe siècles de l'Hégire pour désigner la partie de l'Espagne chrétienne la plus exposée aux raids estivaux lancés depuis Cordoue. Il désignait plus particulièrement le nord, au-delà du cours supérieur de l'Èbre; l'Alava est aujourd'hui une province espagnole dont la capitale est Vitoria (voir: Encyclopaedia of Islam, vol. 1, p. 370)."
