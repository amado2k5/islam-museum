label: { ar: "ألبة والقلاع", en: "Alaba wa l-Kila' ('Alava and the forts', northern Spain)" }
summary:
  ar: "ألبة والقلاع، اسم جغرافي استعمله المؤرخون العرب في القرنين الثاني والثالث الهجريين لذلك الجزء من إسبانيا النصرانية الأكثر تعرضًا لغارات الصوائف التي كانت تُرسل من قرطبة، وكان يدل خاصة على الشمال وراء الضفة اليسرى لأعالي وادي إبرو، وتحدّه من الغرب بوربورة وقشتالة القديمة؛ وإقليم ألبة اليوم، عاصمته فيتوريا {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
  en: "Alaba wa l-Kila' ('Alava and the forts'), a geographical term used by Arab chroniclers of the 2nd and 3rd centuries AH for the part of Christian Spain most exposed to the summer raids sent out from Cordova. It denoted especially the north beyond the upper Ebro; Alava is today a Spanish province whose capital is Vitoria {cite:encyclopaedia-of-islam-2 vol. 1 p. 370}."
