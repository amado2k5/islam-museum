label: { ar: "جزيرة جابة", en: "Jaba island", es: "Isla de Jaba", fr: "Île de Jaba" }
summary:
  ar: "جزيرة من جزر متقاربة، بينها فرسخان تقريباً، وكلها لملك واحد اسمه جابة، يلبس الذهب ويتزين بالدر والياقوت، ودراهمه مطبوعة بصورته. ويذكر المؤلف أن هذه الجزر فيها الكافور الجيد وشجر الخيزران {cite:nuzhat-al-mushtaq-2002 p. 81}."
  en: "One of a cluster of close islands, about two farsakhs apart, all ruled by a single king named Jaba. He wears gold, decorates himself with pearls and rubies, and his coins bear his image. The author notes good camphor and bamboo there {cite:nuzhat-al-mushtaq-2002 p. 81}."
  es: "Una de un grupo de islas cercanas, separadas por unos dos farsakhs, todas gobernadas por un solo rey llamado Jaba. Viste oro, se adorna con perlas y rubíes, y sus monedas llevan su imagen. El autor menciona la presencia de buen alcanfor y bambú {cite:nuzhat-al-mushtaq-2002 p. 81}."
  fr: "L'une des îles d'un archipel proche, distantes d'environ deux farsakhs, toutes gouvernées par un seul roi nommé Jaba. Il porte de l'or, se pare de perles et de rubis, et ses pièces de monnaie portent son effigie. L'auteur mentionne la présence de camphre et de bambou de bonne qualité dans cette région {cite:nuzhat-al-mushtaq-2002 p. 81}."
