label: { ar: "جزيرة جابة", en: "Jaba island" }
summary:
  ar: "جزيرة من جزر متقاربة، بينها فرسخان تقريباً، وكلها لملك واحد اسمه جابة، يلبس الذهب ويتزين بالدر والياقوت، ودراهمه مطبوعة بصورته. ويذكر المؤلف أن هذه الجزر فيها الكافور الجيد وشجر الخيزران {cite:nuzhat-al-mushtaq-2002 p. 81}."
  en: "One of a cluster of close islands, about two farsakhs apart, all ruled by a single king named Jaba. He wears gold, decorates himself with pearls and rubies, and his coins bear his image. The author notes good camphor and bamboo there {cite:nuzhat-al-mushtaq-2002 p. 81}."
