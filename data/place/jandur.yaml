summary:
  ar: "قصور مجتمعة محكمة البناء شاهقة الذرى، تخترقها مياه عذبة، ينزلها الوالي في أيام الربيع، وكان الوالي في عهد سابق يركب منها فيلاً في كل جمعة. {cite:nuzhat-al-mushtaq-2002 p. 177}"
  en: "A cluster of tall, solidly built palaces pierced by fresh water, where the governor stayed in spring; al-Idrisi says an earlier governor rode out from them on an elephant each Friday. {cite:nuzhat-al-mushtaq-2002 p. 177}"
  es: "Un conjunto de palacios altos y de sólida construcción, atravesados por agua dulce, donde el gobernador se alojaba en primavera; al-Idrisi afirma que un gobernador anterior salía de allí montado en un elefante cada viernes. {cite:nuzhat-al-mushtaq-2002 p. 177}"
  fr: "Un ensemble de palais imposants et robustes, traversés par des cours d'eau douce, où le gouverneur résidait au printemps; al-Idrisi rapporte qu'un gouverneur précédent en partait chaque vendredi à dos d'éléphant. {cite:nuzhat-al-mushtaq-2002 p. 177}"
  ur: "لمبے، پختہ محلات کا ایک جھرمٹ جو تازہ پانی سے چھید ہوا تھا، جہاں گورنر موسم بہار میں ٹھہرے تھے۔ الادریسی کا کہنا ہے کہ ایک سابق گورنر ہر جمعہ کو ہاتھی پر سوار ہو کر ان کے پاس سے نکل جاتا تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 177}"
