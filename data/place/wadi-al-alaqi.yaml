summary:
  ar: "وادٍ في أرض البجة فيه خلق كثير وجمع من الناس، يجلب إليه أهل الصعيد والبجة، وفيه آبار عذبة، وأهله يطلبون الذهب في الرمال ليلاً. {cite:nuzhat-al-mushtaq-2002 p. 46}"
  en: "A valley in Beja land with many people, to which the Upper Egyptians and the Beja come. It has sweet wells, and its people search the sands at night for gold. {cite:nuzhat-al-mushtaq-2002 p. 46}"
  es: "Un valle en la tierra de los Beja, habitado por muchos, al que acuden tanto los egipcios del Alto Egipto como los Beja. Posee pozos de agua dulce, y sus habitantes buscan oro en las arenas por la noche. {cite:nuzhat-al-mushtaq-2002 p. 46}"
  fr: "Une vallée du pays Beja, densément peuplée, où se rendent les Hauts-Égyptiens et les Beja. On y trouve des puits d'eau douce, et ses habitants cherchent de l'or dans le sable la nuit. {cite:nuzhat-al-mushtaq-2002 p. 46}"
  ur: "بیجا میں ایک وادی بہت سے لوگوں کے ساتھ ہے، جس میں بالائی مصری اور بیجا آتے ہیں۔ اس میں میٹھے کنویں ہیں، اور اس کے لوگ سونے کے لیے رات کو ریت تلاش کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 46}"
