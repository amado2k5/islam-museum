  fr: "Une petite ville près du grand fleuve, entre Jayyan et Basta, avec des terres fertiles et des cultures utiles. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  ur: "جیان اور بستہ کے درمیان عظیم دریا کے قریب ایک چھوٹا سا قصبہ، جس میں زرخیز زمین اور مفید فصلیں ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 569}"
  tr: "Büyük Nehir yakınında, Jian ile Basta ile kasabası arasında küçük bir kasaba verimli ve faydalıdır. {cit:nuzhat-al-mushtaq-2002 s. 569}"
  id: "Sebuah kota kecil dekat Sungai Besar, dan di antara Jian dan Basta serta kotanya, subur dan bermanfaat. {cite:Nuzhat-al-Mushtaq-2002 hlm. 569}"
