  ar: "مدينة صغيرة على مقربة من النهر الكبير، وفيما بين جيان وبسطة وبلدها خصب وغلل نافعة. {cite:nuzhat-al-mushtaq-2002 p. 569}"
  en: "A small town near the great river, between Jayyan and Basta, with fertile land and useful crops. {cite:nuzhat-al-mushtaq-2002 p. 569}"
