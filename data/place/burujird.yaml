summary:
  ar: "مدينة أكبر من رامن وأحسن حالاً، وكثيرة العمارة، ويُحمل منها إلى الكرج وغيرها، وتبعد عن رامن نحو أربعة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 675}"
  en: "A city larger than Ramin and better off, densely built, from which goods are carried to Karaj and beyond; about twenty-four miles from Ramin. {cite:nuzhat-al-mushtaq-2002 p. 675}"
  es: "Una ciudad más grande y próspera que Ramin, densamente construida, desde donde se transportan mercancías a Karaj y más allá; a unos veinticuatro kilómetros de Ramin. {cite:nuzhat-al-mushtaq-2002 p. 675}"
  fr: "Une ville plus grande et plus prospère que Ramin, densément bâtie, d'où les marchandises sont acheminées vers Karaj et au-delà; à environ 38 kilomètres de Ramin. {cite:nuzhat-al-mushtaq-2002 p. 675}"
  ur: "رامین سے بڑا اور بہتر شہر، گنجان بنا ہوا، جہاں سے سامان کاراج اور اس سے آگے لے جایا جاتا ہے۔ رامین سے تقریباً چوبیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 675}"
