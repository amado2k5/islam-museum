label:
  ar: كابل
  en: Kabul
  es: "Kabul"
  fr: "Kaboul"
summary:
  ar: كابل مدينة عظيمة في ثغور الهند؛ حاصرها عبد الرحمن بن سمرة أشهراً بالمنجنيق حتى ثلمها فسقط فيل المشركين على بابها عاقره
    ابن خازم أو المهلب فدخلها المسلمون عنوة ثم نكث أهلها ففتحها وأخرج كابل شاه المسلمين منها فجاء رتبيل فغلب إلى بست وكان
    صلح عبيد الله بن أبي بكرة معه عن بلاده وبلاد كابل بألف ألف درهم.
  en: Kabul, the great city of India's marches; besieged by Ibn Samura for months under mangonels till breached — the foe's
    hamstrung elephant blocking their gate, by Ibn Khazim's stroke or al-Muhallab's — entered by force, breached again and
    retaken; then the Kabul Shah expelled its Muslims and Rutbil overran to Bust, till Ubaydallah ibn Abi Bakra's million-dirham
    sulh covered Kabul's lands.
  es: "Kabul, la gran ciudad de las fronteras de la India; sitiada por Ibn Samura durante meses bajo mangoneles hasta que fue abierta —el elefante paralizado del enemigo bloqueaba su puerta, por el golpe de Ibn Khazim o de al-Muhallab— entró por la fuerza, fue abierta de nuevo y retomada; entonces el Shah de Kabul expulsó a sus musulmanes y Rutbil invadió hasta Bust, hasta que el sulh de un millón de dirhams de Ubaydallah ibn Abi Bakra cubrió las tierras de Kabul."
  fr: "Kaboul, la grande ville des marches de l'Inde; assiégée pendant des mois par Ibn Samura sous les mangonneaux jusqu'à ce que, grâce à l'éléphant ennemi aux jarrets mutilés bloquant leur porte, par le coup d'Ibn Khazim ou d'al-Muhallab, elle fut prise par la force, puis reprise; alors le Shah de Kaboul expulsa ses musulmans et Rutbil fut envahie jusqu'à Bust, jusqu'à ce que le sulh d'un million de dirhams d'Ubaydallah ibn Abi Bakra couvre les terres de Kaboul."
