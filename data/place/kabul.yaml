summary:
  ar: "كابل مدينة عظيمة في ثغور الهند؛ حاصرها عبد الرحمن بن سمرة أشهراً بالمنجنيق حتى ثلمها فسقط فيل المشركين على بابها عاقره ابن خازم أو المهلب فدخلها المسلمون عنوة ثم نكث أهلها ففتحها وأخرج كابل شاه المسلمين منها فجاء رتبيل فغلب إلى بست وكان صلح عبيد الله بن أبي بكرة معه عن بلاده وبلاد كابل بألف ألف درهم."
  en: "Kabul, the great city of India's marches; besieged by Ibn Samura for months under mangonels till breached — the foe's hamstrung elephant blocking their gate, by Ibn Khazim's stroke or al-Muhallab's — entered by force, breached again and retaken; then the Kabul Shah expelled its Muslims and Rutbil overran to Bust, till Ubaydallah ibn Abi Bakra's million-dirham sulh covered Kabul's lands."
