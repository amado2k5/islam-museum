label: { ar: "وادي آش", en: "Wadi Ash (Guadix)", es: "Wadi Ash (Guadix)", fr: "Wadi Ash (Guadix)", ur: "وادی ایش ⁦(گواڈکس)⁩", tr: "Ash Valley", id: "Lembah Ash" }
summary:
  ar: "مدينة متوسطة المقدار لها أسوار محدقة، وفي وسطها نهر صغير دائم الجري، وتقع على نحو ثمانية أميال من غرناطة في الطريق. {cite:nuzhat-al-mushtaq-2002 p. 567}"
  en: "A medium-sized town with a ring of walls and a small year-round stream running through it, on the road about eight miles from Granada. {cite:nuzhat-al-mushtaq-2002 p. 567}"
  es: "Un pueblo de tamaño mediano, rodeado por una muralla y con un pequeño arroyo que fluye durante todo el año, situado en la carretera a unos ocho kilómetros de Granada. {cite:nuzhat-al-mushtaq-2002 p. 567}"
  fr: "Une ville de taille moyenne, entourée de remparts et traversée par un petit ruisseau permanent, située à environ treize kilomètres de Grenade. {cite:nuzhat-al-mushtaq-2002 p. 567}"
  ur: "گراناڈا سے تقریباً آٹھ میل کے فاصلے پر ایک درمیانے درجے کا قصبہ جس میں دیواروں کا ایک حلقہ ہے اور اس میں سے ایک چھوٹا سا سال بھر کا ندی گزرتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 567}"
  tr: "Orta büyüklükte, surlarla çevrili bir şehir, ortasında sürekli akan küçük bir nehir bulunuyor, yol boyunca Granada'ya yaklaşık sekiz mil uzaklıkta. {cite:nuzhat-al-mushtaq-2002 s. 567}"
  id: "Sebuah kota berukuran sedang dengan tembok bertembok, dengan sungai kecil yang terus mengalir di tengahnya, terletak sekitar delapan mil dari Granada di sepanjang jalan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 567}"
