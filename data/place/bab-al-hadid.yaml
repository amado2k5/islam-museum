label: { ar: "باب الحديد", en: "Bāb al-Ḥadīd", es: "Bāb al-Ḥadīd", fr: "Bāb al-Ḥadīd", ur: "باب الحدید", tr: "Demir Kapı", id: "pintu besi" }
summary:
  ar: "حصن وباب حديد في جبل مقطوع بواد، ينقل المؤلف، عن سلام الترجمان، وصفه بأنه باب بمصراعين، وفيه أقفال وأغلاق، وأن الحراس يضربون عليه ليسمعوا ما وراءه {cite:nuzhat-al-mushtaq-2002 p. 936} {cite:nuzhat-al-mushtaq-2002 p. 937}."
  en: "A fortress and iron gate cut into a mountain by a valley; the author, citing the interpreter Sallām, describes a double gate with locks and bolts that guards strike to listen for what lies beyond {cite:nuzhat-al-mushtaq-2002 p. 936} {cite:nuzhat-al-mushtaq-2002 p. 937}."
  es: "Una fortaleza y una puerta de hierro excavadas en una montaña por un valle; el autor, citando al intérprete Sallām, describe una puerta doble con cerraduras y cerrojos que los guardias golpean para escuchar lo que hay más allá {cite:nuzhat-al-mushtaq-2002 p. 936} {cite:nuzhat-al-mushtaq-2002 p. 937}."
  fr: "Une forteresse et une porte en fer taillées dans une montagne par une vallée; l'auteur, citant l'interprète Sallām, décrit une double porte avec des serrures et des verrous que les gardes frappent pour écouter ce qui se trouve au-delà {cite:nuzhat-al-mushtaq-2002 p. 936} {cite:nuzhat-al-mushtaq-2002 p. 937}."
  ur: "ایک قلعہ اور لوہے کا دروازہ جو ایک وادی سے پہاڑ میں کاٹا جاتا ہے۔ مصنف، مترجم سلام کا حوالہ دیتے ہوئے، تالے اور بولٹ کے ساتھ ایک دوہرے گیٹ کی وضاحت کرتا ہے جو گارڈز کو سننے کے لیے ہڑتال کرتے ہیں {حوالہ: نزہت المشتاق-2002 صفحہ۔ 936} {حوالہ: نزہت المشتاق-2002 ص۔ 937}۔"
  tr: "Bir vadi tarafından kesilmiş bir dağda bir kale ve demir bir kapı. Yazar, Salam al-Tarjuman'dan alıntı yapar; burayı iki pencereli, kilitli ve kilitli bir kapı olarak tanımlar; muhafızlar arkasında ne olduğunu duymak için kapıyı döverler {cite:Nuzhat-al-Mushtaq-2002 s. 936} {cite:Nuzhat-al-Mushtaq-2002 s. 937}."
  id: "Sebuah benteng dan gerbang besi di atas gunung yang terputus oleh lembah. Penulis mengutip Salam al-Tarjuman, menggambarkannya sebagai gerbang dengan dua jendela, dengan kunci dan kunci, dan para penjaga memukulnya untuk mendengar apa yang ada di baliknya {cite:Nuzhat-al-Mushtaq-2002 hlm. 936} {cite:Nuzhat-al-Mushtaq-2002 hlm. 937}."
