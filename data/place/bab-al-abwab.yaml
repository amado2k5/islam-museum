summary:
  ar: "الباب والأبواب مدينة بناها أنوشروان كسرى بن قباذ وسمّيت أبواباً لأنها بنيت على مضايق؛ وبنى قبلها أبوه قباذ سد اللبن بين أرض شروان وباب اللان وعليه ثلاثمائة وستين مدينة خربت بعد بناء الباب والأبواب؛ وحائط أنوشروان بُني بالصخر والرصاص من قبل البحر عرضه ثلاثمائة ذراع ملحق برؤوس الجبال وقاد في البحر ثلاثة أميال على حجارة أُغرقت في سفن وعلى مدخله أبواب حديد ووُكّل به مائة فارس بعد خمسين ألف جند وعليه دبّابة — وذلك بحيلة سلام على ملك الترك."
  en: "Bab wa-l-Abwab (Derbent), the city Anushirwan Kisra ibn Qubadh built, named 'gates' for the narrows on which it stands; before it his father Qubadh had built the wall of al-Lubn between Shirwan's land and Bab al-Lan with three hundred and sixty cities upon it, ruined after Bab wa-l-Abwab's building; Anushirwan's wall was built of rock and lead at the sea's edge, three hundred cubits wide, joined to the mountain-tops, running three miles into the sea over ship-sunk stones, iron gates hung at its entry, a hundred riders posted where fifty thousand soldiers had been needed, with an armoured redoubt upon it — all through the peace he feigned with the Turk king."
  es: "Bab wa-l-Abwab (Derbent), la ciudad que construyó Anushirwan Kisra ibn Qubadh, llamada 'puertas' por el desfiladero sobre el que se asienta; antes de ella, su padre Qubadh había construido la muralla de al-Lubn entre la tierra de Shirwan y Bab al-Lan con trescientas sesenta ciudades sobre ella, arruinada después de la construcción de Bab wa-l-Abwab; la muralla de Anushirwan estaba construida de roca y plomo en la orilla del mar, de trescientos codos de ancho, unida a las cimas de las montañas, extendiéndose tres millas hacia el mar sobre piedras hundidas por barcos, puertas de hierro colgaban en su entrada, cien jinetes apostados donde se habían necesitado cincuenta mil soldados, con un reducto blindado sobre ella, todo durante la paz que fingió con el rey turco."
  fr: "Bab wa-l-Abwab (Derbent), la ville qu'Anushirwan Kisra ibn Qubadh fit construire, nommée « portes » en raison du détroit sur lequel elle se dresse; avant elle, son père Qubadh avait fait bâtir le mur d'al-Lubn entre les terres de Shirwan et Bab al-Lan, qui abritait trois cent soixante villes, ruiné après la construction de Bab wa-l-Abwab; le mur d'Anushirwan était construit en pierre et en plomb au bord de la mer, large de trois cents coudées, rattaché aux sommets des montagnes, s'avançant sur trois milles dans la mer sur des pierres coulées par des navires, des portes de fer étaient suspendues à son entrée, une centaine de cavaliers postés là où cinquante mille soldats avaient été nécessaires, avec une redoute blindée sur le mur — tout cela pendant la paix qu'il feignit avec le roi turc."
