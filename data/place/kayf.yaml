summary:
  ar: "مدينة حسنة بنيانها باللبن والطين، عامرة كثيرة التجارات، ويصفها الإدريسي بأنها ذات أحوال صالحة وأموال متصرفة. {cite:nuzhat-al-mushtaq-2002 p. 475}"
  en: "A handsome town built of mud brick and clay, busy with trade, which al-Idrisi describes as prosperous with circulating wealth. {cite:nuzhat-al-mushtaq-2002 p. 475}"
  es: "Una hermosa ciudad construida con adobe y arcilla, bulliciosa en el comercio, que al-Idrisi describe como próspera y con una gran riqueza en circulación. {cite:nuzhat-al-mushtaq-2002 p. 475}"
  fr: "Une belle ville construite en briques de terre crue et en argile, animée par le commerce, qu'al-Idrisi décrit comme prospère grâce à la circulation des richesses. {cite:nuzhat-al-mushtaq-2002 p. 475}"
  ur: "گارے کی اینٹوں اور مٹی سے بنا ایک خوبصورت شہر، تجارت میں مصروف، جسے الادریسی گردش کرنے والی دولت سے خوشحال قرار دیتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 475}"
  tr: "Çamur ve çamurdan oluşan, birçok ticaretle dolu, iyi inşa edilmiş bir şehir. El-İdrisi, iyi koşullara ve iyi yönetilen zenginliğe sahip olarak tanımlar. {kaynak:Nuzhat-al-mushtaq-2002 s. 475}"
  id: "Kota yang dibangun dengan baik terbuat dari lumpur dan lumpur, ramai dengan berbagai perdagangan. Al-Idrisi menggambarkannya sebagai kota yang memiliki kondisi yang baik dan kekayaan yang dikelola dengan baik. {cite:Nuzhat-al-Mushtaq-2002 hlm. 475}"
