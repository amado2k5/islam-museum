summary:
  ar: "مدينة صغيرة يُعمل بها الستور المنسوبة إليها، ويصفها الإدريسي بأنها حسنة الجهات كثيرة المتنزهات. {cite:nuzhat-al-mushtaq-2002 p. 397}"
  en: "A small town where curtains bearing its name are made; al-Idrisi describes it as pleasant with many gardens. {cite:nuzhat-al-mushtaq-2002 p. 397}"
