  fr: "Une petite ville où l'on fabrique des rideaux portant son nom; al-Idrisi la décrit comme agréable et riche en jardins. {cite:nuzhat-al-mushtaq-2002 p. 397}"
  ur: "ایک چھوٹا سا شہر جہاں اس کے نام کے پردے بنائے جاتے ہیں۔ الادریسی نے اسے بہت سے باغات کے ساتھ خوشگوار قرار دیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 397}"
  tr: "Al-İdrisi tarafından birçok güzel parka sahip olarak tanımlanan, sturun ona atfedildiği küçük bir şehir. {alıntı:nuzhat-al-mushtaq-2002 s. 397}"
  id: "Sebuah kota kecil di mana stur dikaitkan dengannya, digambarkan oleh Al-Idrisi memiliki banyak taman indah. {cite:Nuzhat-al-Mushtaq-2002 hlm. 397}"
