  ar: "القيقان من بلاد السند مما يلي خراسان؛ غزاها المهلب بن أبي صفرة سنة ٤٤ وقتل بها الحارث بن مرة سنة ٤٢ وعبد الله بن سوار وراشد بن عمرو."
  en: "al-Qiqan of the Sind lands adjoining Khurasan; raided by al-Muhallab in 44h — the grave of al-Harith ibn Murra, Abdallah ibn Sawar and Rashid ibn Amr."
  es: "al-Qiqan de las tierras Sind contiguas a Khurasan; asaltada por al-Muhallab en 44 horas: la tumba de al-Harith ibn Murra, Abdallah ibn Sawar y Rashid ibn Amr."
  fr: "al-Qiqan des terres du Sind adjacentes au Khurasan; attaqué par al-Muhallab en 44h — la tombe d'al-Harith ibn Murra, Abdallah ibn Sawar et Rashid ibn Amr."
  ur: "خراسان سے ملحقہ سندھ کی سرزمین القیقان؛ 44ھ میں المحلب نے حارث بن مرہ، عبداللہ بن سوار اور راشد بن عمرو کی قبر پر چھاپہ مارا۔"
  tr: "El-Qayqan, Horasan yakınlarındaki Sind topraklarından gelir; 444 yılında El-Muhalip bin Ebi Safra tarafından işgal edilmiştir; burada El-Harit ibn Murrah, Abdullah ibn Suwar ve Raşid ibn Amr öldürülmüştür."
  id: "Al-Qayqan berasal dari tanah Sindh dekat Khorasan; mereka diserang oleh Al-Muhallab ibn Abi Safra pada tahun 444, di mana Al-Harith ibn Murrah, Abdullah ibn Suwar, dan Rashid ibn Amr dibunuh."
