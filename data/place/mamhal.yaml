summary:
  ar: "مدينة تقع بين الهند والسند، والطريق إليها من كنبايه على البحر يمر بمفازة قليلة الأنيس. {cite:nuzhat-al-mushtaq-2002 p. 170}"
  en: "A city between India and Sind; the road to it from the coastal town of Kanbaya crosses a sparsely inhabited desert. {cite:nuzhat-al-mushtaq-2002 p. 170}"
  es: "Una ciudad entre India y Sind; el camino que la conecta con la ciudad costera de Kanbaya atraviesa un desierto escasamente habitado. {cite:nuzhat-al-mushtaq-2002 p. 170}"
  fr: "Ville située entre l'Inde et le Sind, elle est accessible par la route qui la relie à la ville côtière de Kanbaya, traversant un désert peu peuplé. {cite:nuzhat-al-mushtaq-2002 p. 170}"
  ur: "ہندوستان اور سندھ کے درمیان ایک شہر؛ کنبایا کے ساحلی قصبے سے اس تک جانے والی سڑک ایک بہت کم آباد صحرا کو عبور کرتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 170}"
  tr: "Hindistan ile Sindh arasında yer alan bir şehirdir ve deniz üzerindeki Kanpai'den buraya giden yol birkaç hoş geçitten geçer. {cite:nuzhat-al-mushtaq-2002 s. 170}"
  id: "Sebuah kota yang terletak di antara India dan Sindh, dan jalan menuju kota tersebut dari Kanpai di tepi laut melewati beberapa jalur yang menyenangkan. {cite:Nuzhat-al-Mushtaq-2002 hlm. 170}"
