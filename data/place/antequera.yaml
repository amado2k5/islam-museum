summary:
  ar: "مدينة قرب ارشذونة وبينهما وبين مالقة خمسة وثلاثون ميلا؛ ويذكر المؤلف أنها أخلاها الثوار بالأندلس بعد دولة ابن أبي عامر. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  en: "A town near Archidona, thirty-five miles from Malaga; the author says the rebels of al-Andalus emptied it after the rule of Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  es: "Un pueblo cercano a Archidona, a cincuenta y seis kilómetros de Málaga; el autor afirma que los rebeldes de al-Ándalus lo vaciaron tras el gobierno de Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  fr: "Une ville près d'Archidona, à cinquante-six kilomètres de Malaga; l'auteur affirme que les rebelles d'al-Andalus l'ont vidée de ses habitants après le règne d'Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 p. 570}"
  ur: "آرکیڈونا کے قریب ایک قصبہ، ملاگا سے پینتیس میل؛ مصنف کا کہنا ہے کہ ابن ابی عامر کی حکومت کے بعد اندلس کے باغیوں نے اسے خالی کر دیا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 570}"
  tr: "Archiduna yakınlarında bir şehirdir ve Malaga ile aralarında otuz beş mil uzaklıktadır; yazar, İbn Ebi Amir'in devletinden sonra Endülüs'teki isyancılar tarafından tahliye edildiğini belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 570}"
  id: "Ini adalah sebuah kota dekat Archiduna, dan antara mereka dan Malaga, tiga puluh lima mil; penulis menyebutkan bahwa kota ini dievakuasi oleh para pemberontak di al-Andalus setelah pemerintahan Ibn Abi Amir. {cite:nuzhat-al-mushtaq-2002 hlm. 570}"
