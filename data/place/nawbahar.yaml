label: { ar: "النوبهار", en: "the Nawbahar", es: "el Nawbahar", fr: "le Nawbahar", ur: "نوبہار", tr: "İlkbahar", id: "Musim Semi" }
summary:
  ar: "النوبهار بناء عظيم ببلخ؛ خربه عطاء بن السائب مولى بني الليث في حملة قيس بن الهيثم على بلخ لما نكث أهلها. وعند المسعودي بناه منوشهر على اسم القمر وكان من يلي سدانته تعظمه الملوك في ذلك الصقع وتنقاد إلى أمره وتحمل إليه الأموال وكانت عليه وقوف، وكان الموكل بسدانته يدعى البرمك وهي سمة عامة لكل من يليها ومن أجل ذلك سميت البرامكة لأن خالد بن برمك من ولد من كان على هذا البيت، وكان بنيانه من أعلى البنيان تنصب على أعلاه الرماح عليها شقاق الحرير الأخضر طول الشقة مائة ذراع فأصيبت بعضها منقذفة بالريح على مسافة خمسين فرسخاً {cite:muruj-al-dhahab p. 539}. وروى ابن فضل الله العمري أنه كُتب على بابه بالفارسية «قال سوراشف الملك: أبواب الملوك تحتاج إلى ثلاث خصال: عقل وصبر ومال»، فلما ملك الإسلام بلخ كُتب تحتها بالعربية «كذب سوراشف؛ الواجب على الحرّ إذا كان معه واحدة من هذه الخصال أن لا يلزم باب السلطان» {cite:umari-masalik-1924 p. 224}."
  en: "The Nawbahar, Balkh's great edifice; ruined by Ata ibn al-Sa'ib in Qays ibn al-Haytham's campaign when its people broke."
  es: "El Nawbahar, el gran edificio de Balkh, fue destruido por Ata ibn al-Sa'ib durante la campaña de Qays ibn al-Haytham cuando su pueblo se desmoronó."
  fr: "Le Nawbahar, le grand édifice de Balkh; ruiné par Ata ibn al-Sa'ib lors de la campagne de Qays ibn al-Haytham lorsque son peuple s'est révolté."
  ur: "نوبہار، بلخ کی عظیم عمارت؛ قیس بن الہیثم کی مہم میں عطا بن السائب نے تباہ کر دیا جب اس کے لوگ ٹوٹ گئے۔"
  tr: "Al-Nawbahar, Balkh'ta büyük bir yapıydı; Banu el-Leyth'in özgür adamı Ata ibn al-Sa'ib tarafından, Qays ibn al-Haytham'ın Balkh'a karşı yürüttüğü sefer sırasında, halkı yenildiğinde yıkıldı. al-Mas'udi'ye göre, Manushahr ay sonrası inşa etti ve onu yönetenler, o soğukta krallar tarafından saygı gördü; krallar onun emrine itaat eder, servet taşır ve ayakta durmak zorunda kalırdılar. Efendisine atanan kişiye Al-Barmak denirdi; bu, onu takip eden herkesin ortak özelliğidir. Bu nedenle, Barmakka olarak adlandırıldı çünkü Halid bin Barmak bu evde yaşayanların torunuydu. Yapı, yapının tepesinden başlamış, üzerinde mızraklar bulunmuş, yüz arşın kadar uzanan yeşil ipek çatlaklarla kaplıydı; bazıları elli farsakh mesafeden rüzgarla vurulmuştu {cite:Muric-al-Dhahab, s. 539}. İbn Fadlallah al-'Umari, kapısına Farsça yazdığını anlattı: 'Kral Sorasif dedi ki: Kralların kapıları üç özellik gerektirir: zekâ, sabır ve zenginlik.' İslam Balkh'a hükmederken, Arapça olarak şöyle yazdı: 'Soraşif yalan söyledi; özgür adamın bu özelliklerden birine sahipse, sultanın kapısına bağlı kalmaması zorunludur.' {cite:umari-masalik-1924, s. 224}."
  id: "Al-Nawbahar adalah bangunan besar di Balkh; bangunan ini dihancurkan oleh Ata ibn al-Sa'ib, mantan Banu al-Layth, selama kampanye Qays ibn al-Haytham melawan Balkh ketika rakyatnya dikalahkan. Menurut al-Mas'udi, Manushahr membangunnya setelah bulan, dan mereka yang mengawasinya dihormati oleh raja-raja di dingin itu, yang akan mematuhi perintahnya, membawa kekayaan, dan diwajibkan berdiri. Orang yang ditunjuk untuk tuannya disebut Al-Barmak, ciri umum bagi semua pengikutnya. Karena alasan ini, disebut Barmakkah karena Khalid ibn Barmak adalah keturunan dari mereka yang tinggal di rumah ini. Strukturnya berasal dari atas bangunan, dengan tombak di atasnya, ditutupi retakan sutra hijau, membentang seratus hasta, beberapa di antaranya tertiup angin dari jarak lima puluh farsakh {cite:muruj-al-dhahab, hlm. 539}. Ibn Fadlallah al-'Umari menceritakan bahwa ia menulis di pintunya dalam bahasa Persia: 'Sorashif sang raja berkata: Gerbang raja membutuhkan tiga kualitas: kecerdasan, kesabaran, dan kekayaan.' Ketika Islam memerintah Balkh, ia menulis di bawahnya dalam bahasa Arab: 'Sorashif berbohong; adalah wajib bagi orang merdeka jika ia memiliki salah satu sifat ini untuk tidak melekat pada pintu sultan' {cite:umari-masalik-1924, hlm. 224}."
