label: { ar: "النوبهار", en: "the Nawbahar" }
summary:
  ar: "النوبهار بناء عظيم ببلخ؛ خربه عطاء بن السائب مولى بني الليث في حملة قيس بن الهيثم على بلخ لما نكث أهلها.، وعند المسعودي بناه منوشهر على اسم القمر وكان من يلي سدانته تعظمه الملوك في ذلك الصقع وتنقاد إلى أمره وتحمل إليه الأموال وكانت عليه وقوف، وكان الموكل بسدانته يدعى البرمك وهي سمة عامة لكل من يليها ومن أجل ذلك سميت البرامكة لأن خالد بن برمك من ولد من كان على هذا البيت، وكان بنيانه من أعلى البنيان تنصب على أعلاه الرماح عليها شقاق الحرير الأخضر طول الشقة مائة ذراع فأصيبت بعضها منقذفة بالريح على مسافة خمسين فرسخاً {cite:muruj-al-dhahab p. 539}. وروى ابن فضل الله العمري أنه كُتب على بابه بالفارسية «قال سوراشف الملك: أبواب الملوك تحتاج إلى ثلاث خصال: عقل وصبر ومال»، فلما ملك الإسلام بلخ كُتب تحتها بالعربية «كذب سوراشف؛ الواجب على الحرّ إذا كان معه واحدة من هذه الخصال أن لا يلزم باب السلطان» {cite:umari-masalik-1924 p. 224}."
  en: "The Nawbahar, Balkh's great edifice; ruined by Ata ibn al-Sa'ib in Qays ibn al-Haytham's campaign when its people broke."
