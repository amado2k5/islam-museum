summary:
  ar: الطرف الشمالي لجزيرة سومطرة، كانت فيه سلطنة إسلامية قوية، وهو اليوم مقاطعة من جمهورية إندونيسيا. وكانت عاصمته كوتا رادجا ⁦(حصن الأمير)⁩، وميناؤه عاصمة أمرائه، وكان أمراؤه يحكمون عبر زعماء محليين يسمون «الأوليبالانغ» ⁦(قادة الجيش)⁩، ويعتمدون على الجزية من المناطق الساحلية والمجاورة {cite:encyclopaedia-of-islam-2 vol. 1 p. 789}.
  en: The northernmost part of the island of Sumatra, once the seat of a powerful Muslim empire and now a province of the Indonesian Republic. Its capital was Kuta Radja, 'fort of the prince', and the port of Atjeh was the former residence of its princes. The princes ruled through hereditary ulebalangs, and their wealth came from the tribute of coastal regions {cite:encyclopaedia-of-islam-2 vol. 1 p. 789}.
  es: "La parte más septentrional de la isla de Sumatra, otrora sede de un poderoso imperio musulmán y ahora provincia de la República de Indonesia. Su capital era Kuta Radja, «fortaleza del príncipe», y el puerto de Atjeh fue la antigua residencia de sus príncipes. Estos gobernaban mediante ulebalangs hereditarios, y su riqueza provenía del tributo de las regiones costeras {cite:encyclopaedia-of-islam-2 vol. 1 p. 789}."
  fr: "La partie la plus septentrionale de l'île de Sumatra, jadis siège d'un puissant empire musulman, est aujourd'hui une province de la République d'Indonésie. Sa capitale était Kuta Radja, « forteresse du prince », et le port d'Atjeh était l'ancienne résidence de ses princes. Ces derniers régnaient par l'intermédiaire d'ulebalangs héréditaires, et leur richesse provenait du tribut des régions côtières (voir: Encyclopaedia of Islam, vol. 1, p. 789)."
