label:
  ar: "آتشيه"
  en: "Aceh (Atjeh)"
summary:
  ar: "الطرف الشمالي لجزيرة سومطرة، كانت فيه سلطنة إسلامية قوية، وهو اليوم مقاطعة من جمهورية إندونيسيا. وكانت عاصمته كوتا رادجا (حصن الأمير)، وميناؤه عاصمة أمرائه، وكان أمراؤه يحكمون عبر زعماء محليين يسمون «الأوليبالانغ» (قادة الجيش)، ويعتمدون على الجزية من المناطق الساحلية والمجاورة {cite:encyclopaedia-of-islam-2 vol. 1 p. 789}."
  en: "The northernmost part of the island of Sumatra, once the seat of a powerful Muslim empire and now a province of the Indonesian Republic. Its capital was Kuta Radja, 'fort of the prince', and the port of Atjeh was the former residence of its princes. The princes ruled through hereditary ulebalangs, and their wealth came from the tribute of coastal regions {cite:encyclopaedia-of-islam-2 vol. 1 p. 789}."
