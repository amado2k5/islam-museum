summary:
  ar: "مدينة عامرة على البحر، فيها مرافئ للإرساء والإقلاع وصناعة المراكب للسفر، ويذكر المؤلف أنها تبعد عن رطوماغش عشرين ميلا {cite:nuzhat-al-mushtaq-2002 p. 865}."
  en: "A populous coastal city with harbours for anchoring, sailing and building ships for voyages; the author gives twenty miles from Rouen {cite:nuzhat-al-mushtaq-2002 p. 865}."
  es: "Una populosa ciudad costera con puertos para fondear, navegar y construir barcos para viajes; el autor indica veinte millas de Rouen {cite:nuzhat-al-mushtaq-2002 p. 865}."
  fr: "Une ville côtière peuplée avec des ports pour l'ancrage, la navigation et la construction de navires pour les voyages; l'auteur donne vingt milles de Rouen {cite:nuzhat-al-mushtaq-2002 p. 865}."
  ur: "ایک آبادی والا ساحلی شہر جس میں لنگر انداز ہونے، بحری جہاز چلانے اور سفر کے لیے بحری جہاز بنانے کے لیے بندرگاہیں ہیں۔ مصنف روین سے بیس میل بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 865}۔"
  tr: "Deniz kenarında hareketli bir şehir; limanlar, denize indirme ve seyahat için tekne yapımı için limanlar var. Yazar, buranın Ratumagh'a yirmi mil uzaklıkta olduğunu belirtiyor {cite:Nuzhat-al-Mushtaq-2002, s. 865}."
  id: "Sebuah kota yang ramai di tepi laut, dengan pelabuhan untuk berlabuh, meluncurkan, dan pembuatan kapal untuk perjalanan. Penulis menyebutkan bahwa kota ini berjarak dua puluh mil dari Ratumagh {cite:Nuzhat-al-Mushtaq-2002, hlm. 865}."
