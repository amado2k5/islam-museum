  tr: "Gelişen bir şehir olan Aran kenarındaki Bilad Şirvan'ın Kasbahı, Bab al-Abwab'ın eserlerinden biri olarak kabul edilir. {kaynak:Mujam-al-Buldan-Sader-1995 3 s.361}"
