summary:
  ar: "قطيعة في السواد؛ عند البلاذري أقطعها عثمان الأشعث بن قيس الكندي وكانت تدعى دير ناباذ فغيّروا اسمها وإنما نسبت إلى الضيزن بن معاوية بن العبيد السليحي واسم سليح عمرو بن طريف بن عمران بن الحاف بن قضاعة."
  en: "Estate in the Sawad; in al-Baladhuri granted by Uthman to al-Ash'ath ibn Qays al-Kindi."
  es: "Finca en Sawad; en al-Baladhuri otorgado por Uthman a al-Ash'ath ibn Qays al-Kindi."
  fr: "Domaine dans le Sawad; à al-Baladhuri accordé par Uthman à al-Ash'ath ibn Qays al-Kindi."
  ur: "سواد میں جائیداد؛ البلادوری میں جو عثمان نے اشعث بن قیس الکندی کو عطا کیا تھا۔"
  tr: "Karanlıkta bir kopuk; El-Baladhuri'ye göre, bu kopu Osman el-Eşas ibn Kays el-Kindi tarafından kesilmiştir. Adı Deir Nabadh idi, ancak adı değiştirildi. El-Dhaizan ibn Muaviye ibn el-Ubeyd el-Süleyhi'ye atfedildi ve Süleyh adı Amr ibn Tarif ibn İmran ibn el-Haf ibn Quda'ah'dı."
  id: "Sebuah pecahan dalam kegelapan; menurut Al-Baladhuri, itu diputuskan oleh Uthman al-Ash'ath ibn Qays al-Kindi. Namanya Deir Nabadh, tetapi mereka mengganti namanya. Nama ini dikaitkan dengan al-Dhaizan ibn Muawiyah ibn al-Ubayd al-Sulayhi, dan nama Sulayh adalah Amr ibn Tarif ibn Imran ibn al-Haf ibn Quda'ah."
