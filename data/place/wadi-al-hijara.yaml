summary:
  ar: "مدينة حصينة حسنة الأسواق والمباني، بها مسجد جامع، وفي غربها نهر صغير عليه بساتين، ويتجهز منها بغلات الزعفران الكثير، وتبعد عن طليطلة مرحلتين. {cite:nuzhat-al-mushtaq-2002 p. 553}"
  en: "A strong, pleasant town with fine markets and buildings, a congregational mosque, and a small river to its west with gardens; much saffron is sent out from it. Two stages from Toledo. {cite:nuzhat-al-mushtaq-2002 p. 553}"
  es: "Una ciudad fuerte y agradable con hermosos mercados y edificios, una mezquita principal y un pequeño río al oeste con jardines; de él se exporta mucho azafrán. A dos etapas de Toledo. {cite:nuzhat-al-mushtaq-2002 p. 553}"
  fr: "Une ville agréable et prospère, dotée de beaux marchés et édifices, d'une mosquée et d'une petite rivière bordée de jardins à l'ouest; on y exporte une grande quantité de safran. À deux étapes de Tolède. {cite:nuzhat-al-mushtaq-2002 p. 553}"
  ur: "ایک مضبوط، خوشگوار شہر جس میں عمدہ بازار اور عمارتیں، ایک اجتماعی مسجد، اور اس کے مغرب میں باغات کے ساتھ ایک چھوٹا دریا؛ اس سے بہت زیادہ زعفران بھیجا جاتا ہے۔ ٹولیڈو سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 553}"
  tr: "İyi pazarlar ve binalarla güçlendirilmiş bir şehir olan bu şehirde cemaat camisi vardır ve batısında, bol safran ürünleri bulunan meyve bahçeleriyle küçük bir nehir bulunur. Toledo'ya iki adım uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 553}"
  id: "Kota benteng dengan pasar dan bangunan yang bagus, memiliki masjid jemaat, dan di sebelah baratnya terdapat sungai kecil dengan kebun buah, yang dipenuhi hasil panen saffron yang melimpah. Lokasinya hanya dua langkah dari Toledo. {cite:nuzhat-al-mushtaq-2002 hlm. 553}"
