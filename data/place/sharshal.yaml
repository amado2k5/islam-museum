  ar: "مدينة قديمة تقابل مليانة بالغرب الأوسط على ساحل البحر؛ يُقال إنها كانت مدينة الملك الغاصب للسفن، وهي عند العمري تزيد على الوصف في اتساع الأفنية وارتفاع الأبنية وعظم القناطر والأقبية المعقودة والجدر السميكة {cite:umari-masalik-1924 p. 244-245}."
  en: "The ancient city facing Milyana on the mid-western coast, said to be the ship-seizing king's own; al-Umari says it surpasses description for the span of its courts, the height of its buildings, its great arches, vaulted cellars and thick walls {cite:umari-masalik-1924 p. 244-245}."
