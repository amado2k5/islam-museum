summary:
  ar: "مدينة قديمة تقابل مليانة بالغرب الأوسط على ساحل البحر؛ يُقال إنها كانت مدينة الملك الغاصب للسفن، وهي عند العمري تزيد على الوصف في اتساع الأفنية وارتفاع الأبنية وعظم القناطر والأقبية المعقودة والجدر السميكة {cite:umari-masalik-1924 p. 244-245}."
  en: "The ancient city facing Milyana on the mid-western coast, said to be the ship-seizing king's own; al-Umari says it surpasses description for the span of its courts, the height of its buildings, its great arches, vaulted cellars and thick walls {cite:umari-masalik-1924 p. 244-245}."
  es: "La antigua ciudad frente a Milyana en la costa centro-occidental, que se dice que perteneció al rey que capturó los barcos; al-Umari dice que supera toda descripción por la extensión de sus patios, la altura de sus edificios, sus grandes arcos, bodegas abovedadas y gruesos muros {cite:umari-masalik-1924 p. 244-245}."
  fr: "L'ancienne cité faisant face à Milyana sur la côte centre-ouest, que l'on dit être celle du roi qui s'empare des navires; al-Umari dit qu'elle dépasse toute description par l'étendue de ses cours, la hauteur de ses bâtiments, ses grandes arches, ses caves voûtées et ses murs épais {cite:umari-masalik-1924 p. 244-245}."
  ur: "وسط مغربی ساحل پر ملیانا کا سامنا کرنے والا قدیم شہر، جسے جہاز پر قبضہ کرنے والا بادشاہ کا اپنا کہا جاتا ہے۔ العماری کہتے ہیں کہ یہ اپنے درباروں کے دورانیے، اس کی عمارتوں کی اونچائی، اس کے عظیم محرابوں، محراب زدہ تہہ خانوں اور موٹی دیواروں کی تفصیل سے بالاتر ہے۔ 244-245}۔"
  tr: "Miliana'nın karşısında, orta batıda, deniz kıyısında yer alan antik bir şehir; gemileri gasp eden kralın şehri olduğu söylenir. al-Umari'ye göre, avluların genişliği, binaların yüksekliği, kemerlerin büyüklüğü, kemerli tonozlar ve kalın duvarlar açısından tarifleri aşmaktadır {cite:umari-masalik-1924, s. 244-245}."
  id: "Sebuah kota kuno yang terletak di seberang Miliana di tengah barat di tepi pantai; dikatakan bahwa kota ini adalah kota raja yang merebut kapal. Menurut al-Umari, kota ini melebihi deskripsi dalam lebar halaman, tinggi bangunan, ukuran lengkungan, kubah lengkung, dan dinding tebal {cite:umari-masalik-1924, hlm. 244-245}."
