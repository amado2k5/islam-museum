summary:
  ar: "بلدة وميناء صغير على الساحل الجنوبي للأناضول، قاعدة قضاء في ولاية إجل، وتقع عند رأس أنامور جنوب أقصى نقطة في الأناضول، وفيها أطلال أنيموريوم، المدينة المسيحية المبكرة، وقلعة مملوكية-عثمانية من سنة 874هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  en: "A small town and harbour on the southern coast of Anatolia, capital of a kaza in the vilayet of Icel, on a plain at the foot of Cape Anamur, the southernmost point of Anatolia. It has the ruins of the early Christian town of Anemurium and the Ottoman-repaired fortress of Ma'muriyye {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  es: "Un pequeño pueblo y puerto en la costa sur de Anatolia, capital de un kaza en el vilayato de Icel, en una llanura al pie del cabo Anamur, el punto más meridional de Anatolia. Conserva las ruinas de la antigua ciudad cristiana de Anemurium y la fortaleza de Ma'muriyye, restaurada por los otomanos {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  fr: "Petite ville portuaire de la côte sud de l'Anatolie, chef-lieu d'un kaza du vilayet d'Icel, située dans une plaine au pied du cap Anamur, point le plus méridional de l'Anatolie. On y trouve les ruines de la ville paléochrétienne d'Anemurium et la forteresse de Ma'muriyye, restaurée par les Ottomans (source: Encyclopaedia of Islam, vol. 1, p. 504)."
  ur: "اناطولیہ کے جنوبی ساحل پر ایک چھوٹا سا قصبہ اور بندرگاہ، اناطولیہ کے سب سے جنوبی نقطہ کیپ انامور کے دامن میں ایک میدان میں، آئسیل کے ولایت میں ایک کازا کا دارالحکومت۔ اس میں ابتدائی عیسائی قصبے انیموریم اور معموریہ کے عثمانی مرمت شدہ قلعے کے کھنڈرات ہیں۔ 1 ص۔ 504}۔"
  tr: "Anadolu'nun güney kıyısında küçük bir kasaba ve liman, Igil eyaletinde bir ilçe üssü, Ras Anamur'da, Anadolu'nun en uzak noktasının güneyinde yer alır; erken Hristiyan şehri Animorium kalıntılarını ve 874 Hicri'den kalma Memlük-Osmanlı kalesini barındırır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 504}."
  id: "Sebuah kota kecil dan pelabuhan di pesisir selatan Anatolia, sebuah basis distrik di provinsi Igil, terletak di Ras Anamur, di selatan titik terjauh di Anatolia, yang berisi reruntuhan Animorium, kota Kristen awal, dan benteng Mamluk-Ottoman dari tahun 874 H {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 504}."
