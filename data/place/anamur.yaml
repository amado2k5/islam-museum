  ar: "أنامور"
  en: "Anamur"
summary:
  ar: "بلدة وميناء صغير على الساحل الجنوبي للأناضول، قاعدة قضاء في ولاية إجل، وتقع عند رأس أنامور جنوب أقصى نقطة في الأناضول، وفيها أطلال أنيموريوم، المدينة المسيحية المبكرة، وقلعة مملوكية-عثمانية من سنة 874هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
  en: "A small town and harbour on the southern coast of Anatolia, capital of a kaza in the vilayet of Icel, on a plain at the foot of Cape Anamur, the southernmost point of Anatolia. It has the ruins of the early Christian town of Anemurium and the Ottoman-repaired fortress of Ma'muriyye {cite:encyclopaedia-of-islam-2 vol. 1 p. 504}."
