summary:
  ar: "إسطنبول عاصمة الدولة العثمانية من فتحها سنة 857هـ/1453م إلى 1342هـ/1923م، وكان اسمها في الاستعمال العثماني الدقيق يخص المنطقة بين القرن الذهبي وساحل مرمرة والسور البري. نمت المدينة بمجمعات وقفية أقامها السلاطين والوزراء، مثل الفاتح والسليمانية، وبمحلات تتكون حول المساجد، وسكنها مسلمون ومسيحيون ويهود، وأصابتها حرائق وزلازل وأوبئة متكررة."
  en: "Istanbul was the capital of the Ottoman Empire from its conquest on 20 Jumada I 857/29 May 1453 until 1342/1923. In strict Ottoman usage the name covered only the area between the Golden Horn, the Marmara coast and the land wall. The city grew through endowed complexes built by sultans and viziers, such as the Fatih and the Suleymaniye, and through quarters formed around mosques; Muslims, Christians and Jews lived there, and fires, earthquakes and plague struck it repeatedly."
  ur: "استنبول 20 جمادی الاولیٰ 857ھ/1453ء کی فتح سے 1342ھ/1923ء تک سلطنت عثمانیہ کا دارالحکومت رہا، اور سخت عثمانی استعمال میں یہ نام صرف شاخ زریں، ساحل مرمرہ اور خشکی کی فصیل کے درمیانی علاقے کے لیے تھا۔ شہر سلاطین اور وزراء کے وقفی مجموعوں جیسے فاتح اور سلیمانیہ سے، اور مساجد کے گرد بننے والے محلوں سے پھیلا؛ یہاں مسلمان، مسیحی اور یہودی بستے تھے اور آگ، زلزلے اور وبائیں بار بار آئیں۔"
  es: "Estambul fue la capital del Imperio Otomano desde su conquista el 20 de Jumada I de 857/29 de mayo de 1453 hasta 1342/1923. En el uso estricto del término otomano, este abarcaba únicamente la zona comprendida entre el Cuerno de Oro, la costa de Mármara y la muralla terrestre. La ciudad creció gracias a complejos construidos por sultanes y visires, como el Fatih y el Süleymaniye, y a barrios formados alrededor de mezquitas. Allí convivían musulmanes, cristianos y judíos, y sufrió repetidos incendios, terremotos y plagas."
  fr: "Istanbul fut la capitale de l'Empire ottoman depuis sa conquête le 20 Jumada Ier 857/29 mai 1453 jusqu'en 1342/1923. Dans l'usage ottoman strict, le nom désignait uniquement la zone située entre la Corne d'Or, la côte de Marmara et les remparts terrestres. La ville s'étendit grâce aux complexes fortifiés construits par les sultans et les vizirs, tels que les palais Fatih et Süleymaniye, et aux quartiers formés autour des mosquées; musulmans, chrétiens et juifs y vivaient, et elle fut ravagée à plusieurs reprises par des incendies, des tremblements de terre et la peste."
  tr: "İstanbul, Osmanlı İmparatorluğu'nun 857 Hicri/1453 yılındaki fethi ile 1342 H 1923 yılına kadar başkentti. Osmanlı kullanımında adı, Haliç, Mermera Denizi ve kara duvarı arasındaki bölgeyi ifade ederdi. Şehir, Fatih ve Süleymaniye gibi sultanlar ve bakanlar tarafından kurulan vakıf kompleksleriyle ve camilerin etrafında dükkanlar kurulmasıyla büyüdü. Müslümanlar, Hristiyanlar ve Yahudiler tarafından yaşanmıştı ve tekrarlanan yangınlar, depremler ve salgınlardan muzdarip oldu."
  id: "Istanbul adalah ibu kota Kekaisaran Ottoman sejak penaklukannya pada tahun 857 H/1453 M hingga 1342 H/1923 M. Namanya dalam penggunaan Ottoman yang tepat merujuk pada wilayah antara Tanduk Emas, Laut Marmara, dan tembok daratan. Kota ini berkembang dengan kompleks wakaf yang didirikan oleh para sultan dan menteri, seperti Fatih dan Suleymaniyah, serta toko-toko yang dibentuk di sekitar masjid. Kota ini dihuni oleh Muslim, Kristen, dan Yahudi, serta mengalami kebakaran, gempa bumi, dan wabah berulang kali."
