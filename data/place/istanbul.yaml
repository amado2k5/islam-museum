summary:
  ar: "إسطنبول عاصمة الدولة العثمانية من فتحها سنة 857هـ/1453م إلى 1342هـ/1923م، وكان اسمها في الاستعمال العثماني الدقيق يخص المنطقة بين القرن الذهبي وساحل مرمرة والسور البري. نمت المدينة بمجمعات وقفية أقامها السلاطين والوزراء، مثل الفاتح والسليمانية، وبمحلات تتكون حول المساجد، وسكنها مسلمون ومسيحيون ويهود، وأصابتها حرائق وزلازل وأوبئة متكررة."
  en: "Istanbul was the capital of the Ottoman Empire from its conquest on 20 Jumada I 857/29 May 1453 until 1342/1923. In strict Ottoman usage the name covered only the area between the Golden Horn, the Marmara coast and the land wall. The city grew through endowed complexes built by sultans and viziers, such as the Fatih and the Suleymaniye, and through quarters formed around mosques; Muslims, Christians and Jews lived there, and fires, earthquakes and plague struck it repeatedly."
  ur: "استنبول 20 جمادی الاولیٰ 857ھ/1453ء کی فتح سے 1342ھ/1923ء تک سلطنت عثمانیہ کا دارالحکومت رہا، اور سخت عثمانی استعمال میں یہ نام صرف شاخ زریں، ساحل مرمرہ اور خشکی کی فصیل کے درمیانی علاقے کے لیے تھا۔ شہر سلاطین اور وزراء کے وقفی مجموعوں جیسے فاتح اور سلیمانیہ سے، اور مساجد کے گرد بننے والے محلوں سے پھیلا؛ یہاں مسلمان، مسیحی اور یہودی بستے تھے اور آگ، زلزلے اور وبائیں بار بار آئیں۔"
