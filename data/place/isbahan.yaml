summary:
  ar: "إقليم عظيم بالجبل؛ عند البلاذري فتح أرضه عبد الله بن بديل سنة 23 و24 فأخذ جي صلحاً بعد مبارزة الفادوسفان مرزبانها وصلح اليهودية وغلب على سهلها وجبلها وعاملهم في الخراج نحو معاملة أهل الأهواز ودخل أشرافها في الطاعة بالخراج وأنفوا من الجزية فأسلموا."
  en: "the great Jibal province; in al-Baladhuri its land conquered by Abdallah ibn Budayl in 23–24 — Jayy by treaty after al-Fadhusfan's duel, al-Yahudiyya likewise — plain and mountain mastered, kharaj modeled on al-Ahwaz, its nobles preferring Islam to the jizya's indignity."
  es: "la gran provincia de Jibal; en al-Baladhuri su tierra fue conquistada por Abdallah ibn Budayl en 23-24 — Jayy por tratado después del duelo de al-Fadhusfan, al-Yahudiyya igualmente — llanura y montaña dominadas, kharaj modelado a partir de al-Ahwaz, sus nobles prefirieron el Islam a la indignidad de la jizya."
  fr: "la grande province de Jibal; à al-Baladhuri, ses terres conquises par Abdallah ibn Budayl en 23-24 — Jayy par traité après le duel d'al-Fadhusfan, al-Yahudiyya de même — plaines et montagnes maîtrisées, kharaj modelé sur al-Ahwaz, ses nobles préférant l'Islam à l'indignité de la jizya."
  ur: "عظیم صوبہ جبل؛ البلادھوری میں اس کی سرزمین عبداللہ ابن بدیل نے 23-24 میں فتح کی تھی - الفدسفان کے جھگڑے کے بعد معاہدے کے ذریعے جئے، اسی طرح الیہودیہ - میدانی اور پہاڑی مالک، الاحواز کی طرز پر خراج، اس کے امرا نے جزیہ پر اسلام کو ترجیح دی۔"
  tr: "Büyük bir dağlık bölge; el-Baladhuri'nin döneminde, Abdullah ibn Babil 23 ve 24 yıllarında topraklarını fethetti. Ji, lider Fadosfan ile yaptığı düellodan sonra barış yaptı ve Yahudi devletini barıştırdı; ovalarını ve dağlarını domine etti, Ahwaz halkına yaptıkları gibi vergi uyguladı. Soyluları vergiye itaat etti, cizye ödemekten kaçındı ve böylece İslam'ı benimsedi."
  id: "Wilayah pegunungan yang luas; di bawah al-Baladhuri, Abdullah ibn Babil menaklukkan tanahnya pada tahun 23 dan 24. Ji berdamai setelah duel dengan Fadosfan, kepala sukunya, dan mendamaikan negara Yahudi, menguasai dataran dan pegunungannya, memperlakukan mereka dengan pajak seperti mereka memperlakukan rakyat Ahwaz. Para bangsawannya menjadi taat pada pajak, menghindari membayar jizya, dan dengan demikian memeluk Islam."
