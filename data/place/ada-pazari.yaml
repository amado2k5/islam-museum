  en: Adapazari
summary:
  ar: "مدينة تجارية مزدهرة في إقليم كوجه إيلي بتركيا، على السهل الخصيب على مجرى نهر سقاريا السفلي؛ وردت أول مرة في وقف عثماني، وكان سكانها نحو 36 ألف نسمة سنة 1950، وتشتهر بتجارة التبغ والخضر والفاكهة {cite:encyclopaedia-of-islam-2 vol. 1 p. 194}."
  en: "A flourishing trading town in the province of Kocaeli, Turkey, on the fertile plain of the lower Sakarya river. It is first mentioned in a waqf of Orkhan, became a town in 1852-3, and had 36,210 inhabitants in 1950. Its trade is in tobacco, vegetables and fruit, and it has no major Islamic monuments {cite:encyclopaedia-of-islam-2 vol. 1 p. 194}."
