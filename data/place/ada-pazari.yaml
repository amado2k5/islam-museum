summary:
  ar: "مدينة تجارية مزدهرة في إقليم كوجه إيلي بتركيا، على السهل الخصيب على مجرى نهر سقاريا السفلي؛ وردت أول مرة في وقف عثماني، وكان سكانها نحو 36 ألف نسمة سنة 1950، وتشتهر بتجارة التبغ والخضر والفاكهة {cite:encyclopaedia-of-islam-2 vol. 1 p. 194}."
  en: "A flourishing trading town in the province of Kocaeli, Turkey, on the fertile plain of the lower Sakarya river. It is first mentioned in a waqf of Orkhan, became a town in 1852-3, and had 36,210 inhabitants in 1950. Its trade is in tobacco, vegetables and fruit, and it has no major Islamic monuments {cite:encyclopaedia-of-islam-2 vol. 1 p. 194}."
  es: "Una próspera ciudad comercial en la provincia de Kocaeli, Turquía, en la fértil llanura del curso inferior del río Sakarya. Se menciona por primera vez en un waqf de Orkhan, se convirtió en ciudad en 1852-1853 y tenía 36 210 habitantes en 1950. Su comercio se centra en el tabaco, las verduras y las frutas, y no posee monumentos islámicos importantes {cite:encyclopaedia-of-islam-2 vol. 1 p. 194}."
  fr: "Ville commerçante prospère de la province de Kocaeli, en Turquie, située dans la plaine fertile du cours inférieur de la rivière Sakarya. Mentionnée pour la première fois dans un waqf d'Orkhan, elle obtint le statut de ville en 1852-1853 et comptait 36 210 habitants en 1950. Son commerce porte sur le tabac, les légumes et les fruits, et elle ne possède aucun monument islamique majeur (voir: Encyclopaedia of Islam, vol. 1, p. 194)."
  ur: "ترکی کے صوبے کوکیلی کا ایک پھلتا پھولتا تجارتی قصبہ جو دریائے ساکریہ کے زیریں زرخیز میدان میں واقع ہے۔ اس کا ذکر سب سے پہلے اورخان کے وقف میں ملتا ہے، 1852-3 میں ایک قصبہ بنا، اور 1950 میں اس کی آبادی 36,210 تھی۔ اس کی تجارت تمباکو، سبزیوں اور پھلوں میں ہوتی ہے، اور اس میں کوئی بڑی اسلامی یادگار نہیں ہے۔ 1 ص۔ 194}۔"
