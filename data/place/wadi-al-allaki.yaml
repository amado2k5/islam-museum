label: { ar: "وادي العلاقي", en: "Wadi al-Allaki (gold valley in Lower Nubia)", es: "Wadi al-Allaki (valle del oro en la Baja Nubia)", fr: "Wadi al-Allaki (vallée de l'or en Basse Nubie)", ur: "وادی الالکی ⁦(لوئر نوبیا میں سونے کی وادی)⁩", tr: "Wadi Al-Alaqi", id: "Wadi Al-Alaqi" }
summary:
  ar: "وادي العلّاقي، واد في النوبة السفلى بين النيل وساحل البحر الأحمر، على بعد 62 ميلًا جنوب أسوان، وكان في العصور الوسطى منطقة لاستخراج الذهب بعمالة من السود، وصار كأنه مدينة عامرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  en: "Wadi al-Allaki, a valley in Lower Nubia between the Nile and the Red Sea coast, 62 miles south of Aswan. In the Middle Ages it was a gold-mining area worked by black slave labour and looked like a large, populous town {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  es: "Wadi al-Allaki, un valle en la Baja Nubia entre el Nilo y la costa del Mar Rojo, a 62 millas al sur de Asuán. En la Edad Media era una zona minera de oro trabajada por mano de obra esclava negra y parecía una ciudad grande y populosa {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  fr: "Wadi al-Allaki, une vallée de Basse-Nubie située entre le Nil et la côte de la mer Rouge, à 100 km au sud d'Assouan. Au Moyen Âge, c'était une région aurifère exploitée par des esclaves noirs et qui ressemblait à une grande ville densément peuplée {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
  ur: "وادی الالکی، زیریں نوبیا میں نیل اور بحیرہ احمر کے ساحل کے درمیان ایک وادی، اسوان سے 62 میل جنوب میں۔ قرون وسطی میں یہ سونے کی کان کنی کا علاقہ تھا جو سیاہ فام غلاموں کی محنت سے کام کرتا تھا اور یہ ایک بڑے، آبادی والے شہر کی طرح لگتا تھا۔ 1 ص۔ 440}۔"
  tr: "Wadi Al-Alaqi, Aşağı Nubya bölgesinde, Nil ile Kızıldeniz kıyısı arasında, Asvan'ın 62 mil güneyinde yer alan bir vadidir. Orta Çağ'da, siyahların emeğiyle altın madenciliği yapılan bir bölgeydi ve neredeyse gelişen bir şehir gibi bir yer haline gelmiştir {cite:encyclopaedia-of-Islam-2 cilt 1, s. 440}."
  id: "Wadi Al-Alaqi adalah sebuah lembah di Nubia Bawah antara Sungai Nil dan pantai Laut Merah, terletak 62 mil di selatan Aswan. Pada Abad Pertengahan, wilayah ini merupakan tempat penambangan emas oleh tenaga kerja orang kulit hitam, dan menjadi hampir seperti kota yang berkembang {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 440}."
