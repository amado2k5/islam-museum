  en: "Wadi al-Allaki, a valley in Lower Nubia between the Nile and the Red Sea coast, 62 miles south of Aswan. In the Middle Ages it was a gold-mining area worked by black slave labour and looked like a large, populous town {cite:encyclopaedia-of-islam-2 vol. 1 p. 440}."
