label: { ar: "شمشاط", en: "Shimshat (Arsamosata)", es: "Shimshat (Arsamosata)", fr: "Shimshat (Arsamosata)", ur: "شمشت ⁦(ارساموستا)⁩", tr: "Shambat", id: "Shambat" }
summary:
  ar: "شمشاط — وهي أرمينية الرابعة — من ثغور الجزيرة؛ فتحها حبيب بن مسلمة الفهري وصفوان بن المعطل السلمي بإمرة معاوية أيام عثمان على مثل صلح الرها وأوطنها صفوان وتوفي بها؛ أناخ عليها قسطنطين سنة 133 فلم يمكنه شيئاً؛ ولم تزل خراجية حتى صيّرها المتوكل عشرية أسوة الثغور؛ ومنها خرج مالك بن عبد الله الخثعمي الملقب مالك الصوائف غازياً سنة 46، ومن قراها وما حواليها تدور فتوح كمخ ويغرا وخلاط."
  en: "Shimshat (Arsamosata) — the fourth Armenia — of the Jaziran frontier; Habib ibn Maslama al-Fihri and Safwan ibn al-Mu'attal al-Sulami took it under Mu'awiya in Uthman's days on the like of al-Ruha's treaty, Safwan settling and dying there; Constantine camped on it in year 133 gaining nothing; it stayed kharaj-land until al-Mutawakkil made it tithe-land like the rest of the thughur; from it Malik al-Sawa'if rode raiding in year 46, and around it turn the fortunes of Kamkh, Yaghra and Khilat."
  es: "Shimshat (Arsamosata) — la cuarta Armenia — de la frontera de Jaziran; Habib ibn Maslama al-Fihri y Safwan ibn al-Mu'attal al-Sulami la tomaron bajo el mando de Mu'awiya en tiempos de Uthman en virtud de un tratado similar al de al-Ruha, Safwan se estableció y murió allí; Constantino acampó allí en el año 133 sin obtener nada; permaneció como tierra de kharaj hasta que al-Mutawakkil la convirtió en tierra de diezmo como el resto de thughur; desde allí Malik al-Sawa'if salió a saquear en el año 46, y alrededor de ella giraron las fortunas de Kamkh, Yaghra y Khilat."
  fr: "Shimshat (Arsamosata) — la quatrième Arménie — de la frontière jazirane; Habib ibn Maslama al-Fihri et Safwan ibn al-Mu'attal al-Sulami la prirent sous Mu'awiya à l'époque d'Uthman, sur la base d'un traité similaire à celui d'al-Ruha, Safwan s'y installant et y mourant; Constantin y campa en l'an 133 sans rien obtenir; elle resta une terre kharaj jusqu'à ce qu'al-Mutawakkil en fasse une terre de dîme comme le reste du thughur; c'est de là que Malik al-Sawa'if partit en raid en l'an 46, et autour d'elle tournèrent les fortunes de Kamkh, Yaghra et Khilat."
  ur: "شمشات ⁦(ارساموستا)⁩ — چوتھا آرمینیا — جزیران سرحد کا؛ حبیب بن مسلمہ الفہری اور صفوان بن المطل السلمی نے اسے معاویہ کے عہد میں عثمان کے دور میں روحہ کے معاہدے کی طرح لے لیا، صفوان کا وہیں آباد ہونا اور مرنا۔ قسطنطین نے 133 میں اس پر ڈیرے ڈالے اور کچھ حاصل نہ کیا۔ یہ خوارج کی زمین ہی رہی یہاں تک کہ متوکل نے اسے باقی ثغور کی طرح دسواں حصہ بنا دیا۔ اس سے ملک السویف نے سن 46 میں چھاپہ مار کر حملہ کیا اور اس کے ارد گرد کامخ، یثرہ اور خلعت کا رخ موڑ دیا۔"
  tr: "Şamşat — dördüncü Ermeni şehri — yarımadanın sınırlarından biriydi; Osman'ın hükümdarlığı sırasında, Muaviye komutası altında Habib ibn Maslama el-Fihri ve Safvan ibn el-Mu'athil el-Sulami tarafından fethedildi; Edessa Antlaşması'na benzer şekilde, anavatanı Safvan idi ve orada öldü; Konstantin 133 Hicri'de burayı fethetti ancak hiçbir şey yapamadı; el-Mutavakkil sınırlar için bir model olana kadar Harici olarak kaldı; buradan, Malik ibn Abdullah al-Khath'emi, lakaplı Malik al-Sawaif, 46 Hicri'de fatih olarak ortaya çıktı. Köylerinden ve çevresinden makh, gri ve karışım gibi fetihler dolaşır."
  id: "Shamshat — kota Armenia keempat — adalah salah satu perbatasan semenanjung; kota ini ditaklukkan oleh Habib ibn Maslama al-Fihri dan Safwan ibn al-Mu'athil al-Sulami di bawah komando Muawiya selama masa pemerintahan Uthman, mirip dengan Perjanjian Edessa, yang tanah kelahirannya adalah Safwan, dan ia meninggal di sana; Konstantinus menaklukkannya pada tahun 133 H tetapi tidak bisa berbuat apa-apa; kota ini tetap menjadi Kharij hingga al-Mutawakkil menjadi model perbatasan; dari sana, Malik ibn Abdullah al-Khath'ami, yang dijuluki Malik al-Sawaif, muncul sebagai penakluk pada tahun 46 H. Dari desa-desa dan sekitarnya, penaklukan seperti makh, abu-abu, dan campuran beredar."
