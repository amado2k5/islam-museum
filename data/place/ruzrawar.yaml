  tr: "Hassan bölgesi ve Al-Idrisi tarafından Hamadan, Havand ve Borujerd ile birlikte dağlık ilçelerden bahsedilen zengin bir alt ilçe. {cite:nuzhat-al-mushtaq-2002 s. 675}"
