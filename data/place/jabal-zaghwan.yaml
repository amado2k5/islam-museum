summary:
  ar: "جبل عال بين تونس والقيروان، يُرى من ظهر البحر لعلوه، وفيه خصب ومزارع وعمارة، وتعمره قبائل متفرقة. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  en: "A high mountain between Tunis and Qayrawan, visible from the sea, with fertile slopes, farms and settled tribes. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  es: "Una alta montaña entre Túnez y Qayrawan, visible desde el mar, con laderas fértiles, granjas y tribus asentadas. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  fr: "Une haute montagne entre Tunis et Qayrawan, visible depuis la mer, aux pentes fertiles, parsemée de fermes et peuplée de tribus sédentaires. {cite:nuzhat-al-mushtaq-2002 p. 294}"
  ur: "تیونس اور قاراوان کے درمیان ایک اونچا پہاڑ، سمندر سے نظر آتا ہے، جس میں زرخیز ڈھلوانیں، کھیت اور آباد قبائل ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 294}"
  tr: "Tunus ile Kairouan arasında, yüksekliği sayesinde deniz ufkundan görülebilen, verimli topraklar, çiftlikler ve mimari barındıran, çeşitli kabilelerin yaşadığı yüksek bir dağdır. {kaynak:nuzhat-al-mushtaq-2002 s. 294}"
  id: "Sebuah gunung tinggi di antara Tunis dan Kairouan, terlihat dari cakrawala laut karena ketinggiannya, berisi tanah subur, pertanian, dan arsitektur, dihuni oleh berbagai suku. {cite:Nuzhat-al-Mushtaq-2002 hlm. 294}"
