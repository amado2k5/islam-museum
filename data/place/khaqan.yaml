summary:
  ar: "مدينة كبيرة في جهة الشمال، على نهر كبير خصيب الضفتين، فيها تجارات وصناعات، ومواشي أهل تلك النواحي، وتبعد عن نضخو ست مراحل. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  en: "A large city to the north on a great river with fertile banks, with trade and crafts, and the herds of the district; six stages from Nadkhu. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  es: "Una gran ciudad al norte, a orillas de un gran río con riberas fértiles, centro de comercio y artesanía, y hogar de los rebaños de la región; a seis etapas de Nadkhu. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  fr: "Une grande ville au nord, sur un grand fleuve aux rives fertiles, où le commerce et l'artisanat étaient florissants, et où paissaient les troupeaux de la région; à six étapes de Nadkhu. {cite:nuzhat-al-mushtaq-2002 p. 521}"
  ur: "ایک عظیم دریا پر شمال کی طرف ایک بڑا شہر جس میں زرخیز کنارے، تجارت اور دستکاری اور ضلع کے ریوڑ ہیں۔ ندخو سے چھ مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 521}"
  tr: "Kuzeyde büyük bir şehir, her iki kıyısında büyük verimli bir nehir üzerinde, o bölgelerin ticareti, sanayisi ve hayvancılığını yaşayan bir şehirdir ve Nakhukhu'ya altı adım uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 521}"
  id: "Sebuah kota besar di utara, di atas sungai subur yang besar di kedua tepi kali, dengan perdagangan, industri, dan peternakan penduduk di wilayah tersebut, dan berjarak enam langkah dari Nakhukhu. {cite:nuzhat-al-mushtaq-2002 hlm. 521}"
