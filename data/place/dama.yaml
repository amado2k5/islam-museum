summary:
  ar: "قرية على الساحل تكون عامرة في الشتاء وتقل في الصيف، وفيها مغاص لؤلؤ جيد جداً مشهور بجودته. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  en: "A coastal village that is busy in winter and quieter in summer, with a famous pearl bed of very fine quality. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  es: "Un pueblo costero muy concurrido en invierno y más tranquilo en verano, con un famoso yacimiento de perlas de excelente calidad. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  fr: "Un village côtier animé en hiver et plus calme en été, réputé pour ses perles de très haute qualité. {cite:nuzhat-al-mushtaq-2002 p. 156}"
  ur: "ایک ساحلی گاؤں جو سردیوں میں مصروف اور گرمیوں میں پرسکون ہوتا ہے، جس میں موتیوں کا ایک مشہور بستر بہت عمدہ ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 156}"
  tr: "Kıyıda kışın gelişen, yazın daha az gelişen bir köy ve kalitesiyle ünlü çok iyi inci balıklarına sahip. {kaynak:nuzhat-al-mushtaq-2002 s. 156}"
  id: "Sebuah desa di pesisir yang berkembang pesat di musim dingin dan lebih sedikit di musim panas, serta memiliki ikan mutiara yang sangat baik yang terkenal dengan kualitasnya. {cite:Nuzhat-al-Mushtaq-2002 hlm. 156}"
