summary:
  ar: "الجرجومة مدينة على جبل اللكام عند معدن الزاج فيما بين بياس وبوقا من أعمال أنطاكية؛ دار الجراجمة الذين صالحهم المسلمون على المسالح والأعوان، وأخربها الوليد بن عبد الملك سنة 88 بعد أن فتحها مسلمة بن عبد الملك على شروط الإجلاء فأسكن أهلها جبل الموار وسنح اللولون وعمق تيزين وفرّقهم في الشام."
  en: "al-Jurjuma, a city on Jabal al-Lukkam by the vitriol mine between Bayyas and Buqa in the Antioch district; home of the Jarajima who compounded with the Muslims as watchmen and auxiliaries, and which al-Walid ibn Abd al-Malik razed in year 88 after Maslama ibn Abd al-Malik took it on evacuation terms, settling its people at Jabal al-Mawar, Sanh al-Lulun and the Tizin vale and scattering them through Syria."
  es: "al-Jurjuma, una ciudad en Jabal al-Lukkam, junto a la mina de vitriolo entre Bayyas y Buqa, en el distrito de Antioquía; hogar de los Jarajima, que se aliaron con los musulmanes como centinelas y auxiliares, y que al-Walid ibn Abd al-Malik arrasó en el año 88 después de que Maslama ibn Abd al-Malik la tomara en condiciones de evacuación, asentando a su gente en Jabal al-Mawar, Sanh al-Lulun y el valle de Tizin, y dispersándolos por toda Siria."
  fr: "al-Jurjuma, une ville située sur le Jabal al-Lukkam, près de la mine de vitriol entre Bayyas et Buqa, dans le district d'Antioche; foyer des Jarajima qui s'allièrent aux musulmans en tant que gardiens et auxiliaires, et qu'al-Walid ibn Abd al-Malik rasa en l'an 88 après que Maslama ibn Abd al-Malik l'eut prise en échange d'une évacuation, installant ses habitants au Jabal al-Mawar, à Sanh al-Lulun et dans la vallée de Tizin et les dispersant à travers la Syrie."
  ur: "الجرجمہ، ضلع انطاکیہ میں بیاس اور بوکا کے درمیان وٹریول کان کے ذریعے جبل لکم پر ایک شہر؛ جراجیما کا گھر جس نے مسلمانوں کے ساتھ چوکیدار اور معاون کے طور پر اتحاد کیا، اور جسے الولید ابن عبد الملک نے سال 88 میں مسلمہ بن عبد الملک کے انخلاء کی شرائط پر لے جانے کے بعد مسمار کر دیا، جبل الموار، سنہ لولون اور شام کے راستے تیزین وادی میں اپنے لوگوں کو آباد کیا۔"
  tr: "Al-Jarjouma, Bias ile Buqa arasında, Zaj madeni yakınlarındaki Lakam Dağı'nda, Antakya'nın bir parçasıdır; Müslümanların yerleşimler ve destekçileri üzerinde uzlaştığı Al-Jarajma'nın evidir. Maslama ibn Abd al-Malik'in tahliye koşullarında fethetmesinin ardından 88 Hicri yılında, Al-Walid ibn Abd al-Malik tarafından yıkıldı. Sakinleri El-Mawar Dağı'na, Sanh al-Lulun'a, Tizin'in derinliklerine yerleşti ve Levant'a yayıldılar."
  id: "Al-Jarjouma adalah sebuah kota di Gunung Lakam dekat tambang Zaj antara Bias dan Buqa, bagian dari Antiokhia; kota ini adalah rumah Al-Jarajma, yang diajak damai oleh umat Muslim atas pemukiman dan pendukungnya. Kota ini dihancurkan oleh Al-Walid ibn Abd al-Malik pada tahun 88 H setelah Maslama ibn Abd al-Malik menaklukkannya dengan syarat evakuasi. Penduduknya menetap di Gunung Al-Mawar, Sanh al-Lulun, kedalaman Tizin, dan penyebaran mereka di Levant."
