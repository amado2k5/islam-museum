summary:
  ar: "مدينة متحضرة على البحر، تبعد عنه نحو ميل ونصف، فرضة من فرض الهند، وبها مصائد ومغايص اللؤلؤ، وعليها جزيرة ثارة. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  en: "A civilised city about a mile and a half from the sea, a port of India with fisheries and pearl beds; the island of Thara lies off it. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  es: "Una ciudad civilizada a aproximadamente una milla y media del mar, puerto de la India con pesquerías y yacimientos de perlas; la isla de Thara se encuentra frente a ella. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  fr: "Ville civilisée à environ deux kilomètres et demi de la mer, port de l'Inde réputé pour ses pêcheries et ses gisements de perles; l'île de Thara se trouve au large. {cite:nuzhat-al-mushtaq-2002 p. 182}"
  ur: "سمندر سے ڈیڑھ میل کے فاصلے پر ایک مہذب شہر، ماہی گیری اور موتیوں کے بستروں والی ہندوستان کی بندرگاہ؛ تھرا کا جزیرہ اس سے دور ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 182}"
