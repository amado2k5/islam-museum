summary:
  ar: "عند البلاذري: مدينة على شاطئ البحر في الأرض الكبيرة بالمغرب بينها وبين برقة نحو خمسة عشر يوماً وكان أهلها نصارى وليسوا بروم فتحها خلفون البربري في أول خلافة المتوكل."
  en: "In al-Baladhuri: a sea-shore city in the Great Land of the Maghreb, about fifteen days from Barqa; its people were Christians though not Romans — Khalafun al-Barbari opened it at the start of al-Mutawakkil's caliphate."
  es: "En al-Baladhuri: ciudad costera en la Gran Tierra del Magreb, a unos quince días de Barqa; su gente era cristiana, aunque no romana: Khalafun al-Barbari la abrió al comienzo del califato de al-Mutawakkil."
  fr: "A al-Baladhuri: ville balnéaire du Grand Pays du Maghreb, à une quinzaine de jours de Barqa; son peuple était chrétien mais pas romain – Khalafun al-Barbari l'a ouvert au début du califat d'al-Mutawakkil."
  ur: "البلادھوری میں: مغرب کی عظیم سرزمین میں ایک سمندری ساحلی شہر، برقع سے تقریباً پندرہ دن کے فاصلے پر؛ اس کے لوگ عیسائی تھے حالانکہ رومی نہیں تھے۔"
  tr: "Al-Baladhuri'ye göre: Fas topraklarının geniş topraklarında, Cyrenaica'ya kadar yaklaşık on beş gün uzaklıkta, deniz kıyısında bir şehir ve sakinleri Hristiyandı, Brom değil. Al-Mutawakkil halifeliğinin başında Berber halifesi tarafından fethedildi."
  id: "Menurut Al-Baladhuri: sebuah kota di tepi laut di tanah luas Maroko, sekitar lima belas hari antara wilayah itu dan Cyrenaica, dan penduduknya adalah orang Kristen, bukan Brom. Kota ini ditaklukkan oleh khalifah Berber pada awal kekhalifahan al-Mutawakkil."
