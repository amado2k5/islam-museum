summary:
  en: "Port city in southern Iraq founded as a Muslim garrison town around 636 CE, a centre of grammar, theology and trade."
  ar: "مدينة ميناء في جنوب العراق أُسست حامية للمسلمين نحو سنة 636م، وكانت مركزًا للنحو والكلام والتجارة. وعند المسعودي في المناظرة مع أهل الكوفة قال الأحنف في البصرة إن أسفلها قصب وأوسطها خشب وأعلاها رطب نحن أكثر ساجاً وعاجاً وديباجاً وأكثر قنداً ونقداً، وطعن الكوفيون على مائها أنه كدر زهك زفر وعلى بلدها أنه أسرع الأرض خراباً وأبعدها من السماء، وأجاب أهل البصرة أن ماء البحر والبطيحة صافيان يمتزجان وسط بلادهم {cite:muruj-al-dhahab p. 320-321}، وعند ابن الجوزي وفي ربيع الآخر سنة 311هـ دخلها أبو طاهر الجنابي القرمطي سحراً بنصب السلالم على سورها ووضع السيف في أهلها وأحرق المربد ونقض الجامع ومسجد قبر طلحة وأقام بها سبعة عشر يوماً {cite:muntazam-ibn-al-jawzi p. 466}"
