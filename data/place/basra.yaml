label:
  en: Basra
  ar: البصرة
summary:
  ar: البصرة مدينة في جنوب بلاد الرافدين على شط العرب، نشأت من معسكر أسسه عتبة بن غزوان بأمر عمر بن الخطاب في أوائل الفتوح. صارت مدينة كبيرة ومركزًا تجاريًّا وصناعيًّا وزراعيًّا، ومهدًا للنحو العربي والاعتزال والتصوف والنثر العربي. ضعفت بعد قيام بغداد وبعد الغزو المغولي سنة 656هـ/1258م، ثم نمت من جديد ميناءً حديثًا للعراق مع اكتشاف النفط قرب الزبير سنة 1368هـ/1948م.
  en: Basra is a city of lower Mesopotamia on the Shatt al-Arab, grown from a military camp that Utba ibn Ghazwan set up on the orders of Umar ibn al-Khattab during the early conquests. It became a great commercial, industrial and agricultural city and a cradle of Arabic grammar, Mu'tazilism, mysticism and Arabic prose. It declined after the foundation of Baghdad and the Mongol conquest of 656/1258, then revived as Iraq's modern port, with oil found near Zubayr in 1368/1948.
  ur: بصرہ زیریں بین النہرین میں شط العرب پر واقع شہر ہے جو اس فوجی پڑاؤ سے بڑھا جو عتبہ بن غزوان نے عمر بن الخطاب کے حکم پر ابتدائی فتوحات کے دوران قائم کیا۔ یہ بڑا تجارتی، صنعتی اور زرعی شہر اور عربی نحو، اعتزال، تصوف اور عربی نثر کا گہوارہ بنا۔ بغداد کے قیام اور 656ھ/1258ء کی منگول فتح کے بعد کمزور ہوا، پھر 1368ھ/1948ء میں زبیر کے قریب تیل کی دریافت کے ساتھ عراق کی جدید بندرگاہ کے طور پر دوبارہ ابھرا۔
