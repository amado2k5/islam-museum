summary:
  ar: "قلعة على ضفة نهر يانة، يصفها الإدريسي بأنها حصن عامر منيع، وتبعد عن ماردة ثلاث مراحل. {cite:nuzhat-al-mushtaq-2002 p. 550}"
  en: "A fortress on the bank of the Yana river, which al-Idrisi calls a strong, populated stronghold three stages from Merida. {cite:nuzhat-al-mushtaq-2002 p. 550}"
  es: "Una fortaleza a orillas del río Yana, que al-Idrisi describe como un fuerte bastión poblado situado a tres etapas de Mérida. {cite:nuzhat-al-mushtaq-2002 p. 550}"
  fr: "Une forteresse sur les rives de la rivière Yana, qu'al-Idrisi décrit comme une place forte et peuplée, à trois étapes de Mérida. {cite:nuzhat-al-mushtaq-2002 p. 550}"
  ur: "یانا ندی کے کنارے ایک قلعہ جسے الادریسی مریڈا سے تین مراحل پر ایک مضبوط، آبادی والا قلعہ کہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 550}"
  tr: "Yana Nehri kıyısında, Al-Idrisi tarafından Marda'ya üç adım uzaklıkta bir kale ve bir kale olarak tanımlanan bir kale. {kaynak:nuzhat-al-mushtaq-2002 s. 550}"
  id: "Sebuah benteng di tepi Sungai Yana, yang digambarkan oleh Al-Idrisi sebagai benteng dan benteng tiga langkah dari Marda. {cite:Nuzhat-al-Mushtaq-2002 hlm. 550}"
