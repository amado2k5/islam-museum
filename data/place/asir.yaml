summary:
  ar: "إقليم في غرب الجزيرة العربية سُمّي باسم اتحاد من القبائل في السراة؛ تمتد مرتفعاته من النماص جنوبًا إلى نجران، وتهامة عسير على ساحل البحر الأحمر من القحمة إلى حدود اليمن، وعاصمة المرتفعات أبها {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
  en: "A region of western Arabia named after a confederation of tribes in al-Sarat. Its highlands run from al-Nimas south to Nadiran, and its Red Sea lowlands, Tihamat 'Asir, from al-Kahma to the Yemen frontier; the highland capital is Abha. The idea of a separate region developed in the nineteenth century and is now official Saudi usage {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
  es: "Región del oeste de Arabia, cuyo nombre proviene de una confederación de tribus en al-Sarat. Sus tierras altas se extienden desde al-Nimas hacia el sur hasta Nadiran, y sus tierras bajas del Mar Rojo, Tihamat 'Asir, desde al-Kahma hasta la frontera con Yemen; la capital de las tierras altas es Abha. La idea de una región separada se desarrolló en el siglo XIX y ahora es de uso oficial en Arabia Saudí {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
  fr: "Une région de l'ouest de l'Arabie, nommée d'après une confédération de tribus d'al-Sarat. Ses hauts plateaux s'étendent d'al-Nimas au sud jusqu'à Nadiran, et ses plaines de la mer Rouge, Tihamat 'Asir, d'al-Kahma jusqu'à la frontière yéménite; la capitale des hauts plateaux est Abha. L'idée d'une région distincte s'est développée au XIXe siècle et est aujourd'hui officiellement reconnue par l'Arabie saoudite (voir: Encyclopaedia of Islam, vol. 1, p. 756)."
  ur: "مغربی عرب کا ایک خطہ جس کا نام الصراط میں قبائل کے کنفیڈریشن کے نام پر رکھا گیا ہے۔ اس کے پہاڑی علاقے النمس سے جنوب میں نادران تک، اور اس کے بحیرہ احمر کے نشیبی علاقے تہامات عسیر، الکہمہ سے یمن کی سرحد تک؛ ہائی لینڈ کا دارالحکومت ابہا ہے۔ الگ علاقے کا خیال انیسویں صدی میں تیار ہوا اور اب یہ سرکاری سعودی استعمال ہے۔ 1 ص۔ 756}۔"
  tr: "Batı Arabistan'da Al-Sarat'taki bir kabileler konfederasyonundan adını alan bir bölge; yaylaları, güneyde Al-Namas'tan Najran'a ve Kızıldeniz kıyısındaki Tihama Asir'e, Al-Qahmah'tan Yemen sınırına kadar uzanır; Abha ise yaylaların başkentidir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 756}."
  id: "Sebuah wilayah di barat Arabia yang dinamai menurut konfederasi suku-suku di Al-Sarat; dataran tingginya membentang dari Al-Namas di selatan hingga Najran, dan Tihama Asir di pesisir Laut Merah dari Al-Qahmah hingga perbatasan Yaman, dengan Abha sebagai ibu kota dataran tinggi {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 756}."
