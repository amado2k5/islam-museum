label:
  ar: "عسير"
  en: "'Asir"
summary:
  ar: "إقليم في غرب الجزيرة العربية سُمّي باسم اتحاد من القبائل في السراة؛ تمتد مرتفعاته من النماص جنوبًا إلى نجران، وتهامة عسير على ساحل البحر الأحمر من القحمة إلى حدود اليمن، وعاصمة المرتفعات أبها {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
  en: "A region of western Arabia named after a confederation of tribes in al-Sarat. Its highlands run from al-Nimas south to Nadiran, and its Red Sea lowlands, Tihamat 'Asir, from al-Kahma to the Yemen frontier; the highland capital is Abha. The idea of a separate region developed in the nineteenth century and is now official Saudi usage {cite:encyclopaedia-of-islam-2 vol. 1 p. 756}."
