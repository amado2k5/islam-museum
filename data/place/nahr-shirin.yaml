label: { ar: "نهر شيرين", en: "Shirin River", es: "Río Shirin", fr: "Rivière Shirin", ur: "دریائے شیریں", tr: "Şirin Nehri", id: "Sungai Shirin" }
summary:
  ar: "نهر يخرج من جبل بازرنج، ويسقي رستاق فرزك والجلادجان، ثم يمر حتى يصب في البحر قرب جنابة. {cite:nuzhat-al-mushtaq-2002 p. 421}"
  en: "A river rising in the Bazarnaj range, watering the districts of Farzak and Jaladjan, and running to the sea near Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 421}"
  es: "Un río que nace en la sierra de Bazarnaj, riega los distritos de Farzak y Jaladjan, y desemboca en el mar cerca de Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 421}"
  fr: "Une rivière prenant sa source dans la chaîne de Bazarnaj, irriguant les districts de Farzak et de Jaladjan, et se jetant dans la mer près de Jannaba. {cite:nuzhat-al-mushtaq-2002 p. 421}"
  ur: "ایک دریا جو بازارنج کے سلسلے میں ابھرتا ہے، جو فرزاق اور جلادجان کے اضلاع کو پانی دیتا ہے، اور جنبہ کے قریب سمندر میں بہتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 421}"
  tr: "Bazranj Dağı'ndan çıkan bir nehir, Rustaq Farzak ve Jaladjan'ı sular, ardından Janaba yakınlarında denize dökülene kadar akar. {cite:nuzhat-al-mushtaq-2002 s. 421}"
  id: "Sebuah sungai yang muncul dari Gunung Bazranj, mengairi Rustaq Farzak dan Jaladjan, lalu mengalir hingga bermuara ke laut dekat Janaba. {cite:Nuzhat-al-Mushtaq-2002 hlm. 421}"
