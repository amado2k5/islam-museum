label: { ar: "أخلتسخه", en: "Akhaltsikhe (Akhiska)" }
summary:
  ar: "أخلتسخه، واسمها الفارسي والتركي «أخسكا»، وفي الجورجية «أخال تسيخه» أي «القلعة الجديدة»، تقع على نهر بوسخوف، وكانت مركز إقليم سمتسخه الجورجي، وظلت تابعة لحكامها الأتابكة تحت المغول، ثم دخلها العثمانيون سنة 987هـ/1579م، وضمها الروس سنة 1829م {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
  en: "Akhaltsikhe, called Akhiska in Persian and Turkish, 'New Fortress' in Georgian, lies on the Poskhov river and was the centre of the Georgian province of Samtskhe. It came under Ottoman control in 1579, and the Russians incorporated it in 1829 {cite:encyclopaedia-of-islam-2 vol. 1 p. 347}."
