label: { ar: "لنبياذة", en: "Lanbiyatha", es: "Lanbiyatha", fr: "Lanbiyatha", ur: "لانبیتھا", tr: "Innisada", id: "Lniyada" }
summary:
  ar: "حصن في أعلى حجر محدق به البحر من ثلاث جهات، وبه مرسى تسافر منه المراكب، وفيه عمارة وسوق، وأرضه زكية، وتبعد عن كركنت خمسة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  en: "A fort on a high rock surrounded by the sea on three sides, with a harbour from which ships sail, a population, a market and fertile land; twenty-five miles from Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  es: "Una fortaleza sobre una alta roca rodeada por el mar en tres lados, con un puerto desde donde zarpan los barcos, una población, un mercado y tierras fértiles; a veinticinco millas de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  fr: "Un fort perché sur un rocher élevé, entouré par la mer sur trois côtés, avec un port d'où partent les navires, une population, un marché et des terres fertiles; à vingt-cinq milles de Kirkant. {cite:nuzhat-al-mushtaq-2002 p. 599}"
  ur: "تین اطراف سے سمندر سے گھرا ہوا ایک اونچی چٹان پر ایک قلعہ، ایک بندرگاہ جس سے جہاز چلتے ہیں، آبادی، بازار اور زرخیز زمین؛ کرکانت سے پچیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 599}"
  tr: "Üç taraftan denize bakan, en yüksek kayada bir kale, teknelerin seyahat ettiği bir marina, bir bina ve bir pazar var, arazi temizdir ve Karkant'a yirmi beş mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 599}"
  id: "Benteng di atas batu tertinggi yang menghadap laut dari tiga sisi, dengan marina tempat perahu bepergian, sebuah bangunan dan pasar, tanahnya murni, dan berjarak dua puluh lima mil dari Karkant. {cite:nuzhat-al-mushtaq-2002 hlm. 599}"
