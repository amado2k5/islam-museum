summary:
  ar: "موضع نزل به عسكر القوم مقابلاً لعسكر الهادي بصبل في صفر سنة 289هـ، ثم نزل عسكر الهادي إلى جانبه، وجرى القتال بقربه في جمادى الآخرة."
  en: "A place where the men's camp stood facing al-Hadi's army at Sabal in Safar 289 AH; al-Hadi's army later settled beside it, and the fighting of Jumada II took place near it."
  ur: "ایسی جگہ جہاں صفر 289ھ میں صبل میں ہادی کے لشکر کے سامنے مخالفوں کا پڑاؤ تھا؛ بعد میں ہادی کا لشکر اس کے پہلو میں اترا اور جمادی الآخرہ کی لڑائی اس کے قریب ہوئی۔"
  es: "Un lugar donde se ubicaba el campamento de los hombres frente al ejército de al-Hadi en Sabal, en el año Safar 289 AH; el ejército de al-Hadi se asentó más tarde junto a él, y la batalla de Jumada II tuvo lugar cerca del mismo."
  fr: "Un lieu où se trouvait le camp des hommes face à l'armée d'al-Hadi à Sabal en Safar 289 AH; l'armée d'al-Hadi s'installa plus tard à côté, et les combats de Jumada II eurent lieu à proximité."
