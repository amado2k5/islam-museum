summary:
  ar: "جزيرة مستديرة الشكل رملية، فيها قواعد وقرى كثيرة ومراس مستورة معمورة، ويذكر المؤلف أن أولها من فم النهر إلى مدينة السيلة على يسار الداخل خمسة وعشرين ميلا {cite:nuzhat-al-mushtaq-2002 p. 949}."
  en: "A round, sandy island with many towns, villages and sheltered anchorages; the author gives twenty-five miles from the river mouth to al-Sayla {cite:nuzhat-al-mushtaq-2002 p. 949}."
  es: "Una isla redonda y arenosa con muchos pueblos, aldeas y fondeaderos protegidos; el autor indica veinticinco millas desde la desembocadura del río hasta al-Sayla {cite:nuzhat-al-mushtaq-2002 p. 949}."
  fr: "Une île ronde et sablonneuse avec de nombreuses villes, villages et mouillages abrités; l'auteur indique vingt-cinq milles de l'embouchure du fleuve à al-Sayla {cite:nuzhat-al-mushtaq-2002 p. 949}."
  ur: "ایک گول، ریتیلا جزیرہ جس میں بہت سے قصبات، دیہات اور پناہ گاہیں ہیں۔ مصنف نے دریا کے منہ سے السائلہ تک پچیس میل کا فاصلہ بیان کیا ہے۔ 949}۔"
  tr: "Birçok üs, köy ve yerleşik kapalı limanlara sahip yuvarlak, kumlu bir ada. Yazar, ilk adasının nehrin ağzından iç kesimlerin sol tarafındaki Sila şehrine kadar olduğunu belirtir {atıf:Nuzhat-al-Mushtaq-2002, s. 949}."
  id: "Sebuah pulau bulat berpasir dengan banyak basis, desa, dan pelabuhan tertutup yang dihuni. Penulis menyebutkan bahwa pulau pertama adalah dari muara sungai menuju kota Sila di sisi kiri pedalaman {cite:Nuzhat-al-Mushtaq-2002, hlm. 949}."
