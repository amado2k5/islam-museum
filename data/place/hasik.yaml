summary:
  ar: "قرية صغيرة متحضرة على البحر، أمامها جزيرتان، وفوقها جبل كبير، وفيها حوت كبير، وهي على جون يُسمى جون الحشيش يصعب الخروج منه إلا بريح مستعملة {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
  en: "A small, settled village on the sea, with two islands opposite and a large mountain above it. It sits on a shoal known as Jun al-Hashish, from which ships rarely escape without a particular wind {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
