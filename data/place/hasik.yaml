summary:
  ar: "قرية صغيرة متحضرة على البحر، أمامها جزيرتان، وفوقها جبل كبير، وفيها حوت كبير، وهي على جون يُسمى جون الحشيش يصعب الخروج منه إلا بريح مستعملة {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
  en: "A small, settled village on the sea, with two islands opposite and a large mountain above it. It sits on a shoal known as Jun al-Hashish, from which ships rarely escape without a particular wind {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
  es: "Un pequeño pueblo costero, con dos islas enfrente y una gran montaña que lo domina. Se asienta sobre un banco de arena conocido como Jun al-Hashish, del que los barcos rara vez logran escapar sin un viento particular {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
  fr: "Petit village établi en bord de mer, avec deux îles en face et une grande montagne au-dessus. Il est situé sur un banc de sable appelé Jun al-Hashish, d'où les navires s'échappent rarement sans un vent particulier {cite:nuzhat-al-mushtaq-2002 p. 56-57}."
  ur: "سمندر پر ایک چھوٹا سا آباد گاؤں جس کے سامنے دو جزیرے ہیں اور اس کے اوپر ایک بڑا پہاڑ ہے۔ یہ جون الہشیش کے نام سے جانے والی شاخ پر بیٹھتا ہے جہاں سے بحری جہاز کسی خاص ہوا کے بغیر شاذ و نادر ہی نکلتے ہیں۔ 56-57}۔"
