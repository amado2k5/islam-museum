label: { ar: "بحيرة طبرية", en: "Lake Tiberias", es: "Lago Tiberíades", fr: "Lac de Tibériade", ur: "جھیل Tiberias", tr: "Celile Denizi", id: "Laut Galilea" }
summary:
  ar: "بحيرة تأخذ مياهها من أنهار بيسان والبرموك والحد، ويصب منها الماء حتى يقع في بحيرة زغر، ويصفها الإدريسي بأنها بقعة بين جبلين. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  en: "A lake fed by the rivers of Bisan, the Yarmuk and al-Hadd, whose water flows on to the lake of Zughar; al-Idrisi describes it as lying between two mountains. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  es: "Un lago alimentado por los ríos Bisan, Yarmuk y al-Hadd, cuyas aguas desembocan en el lago Zughar; al-Idrisi lo describe como situado entre dos montañas. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  fr: "Un lac alimenté par les rivières Bisan, Yarmouk et al-Hadd, dont les eaux se jettent dans le lac Zughar; al-Idrisi le décrit comme étant situé entre deux montagnes. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  ur: "بسان، یرموک اور الحد کی ندیوں سے پلنے والی ایک جھیل جس کا پانی جھیل زغر تک جاتا ہے۔ ادریسی نے اسے دو پہاڑوں کے درمیان پڑا ہوا بیان کیا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 355}"
  tr: "Suları Bisan, Barmuk ve Al-Had nehirlerinden gelen ve suyu akarak Zagher Gölü'ne dökülen bir göl. El-İdrisi, burayı iki dağ arasında bir nokta olarak tanımlar. {kaynak:nuzhat-al-mushtaq-2002 s. 355}"
  id: "Sebuah danau yang airnya berasal dari sungai Bisan, Barmouk, dan Al-Had, dari mana airnya mengalir hingga bermuara ke Danau Zagher. Al-Idrisi menggambarkannya sebagai titik di antara dua gunung. {cite:nuzhat-al-mushtaq-2002 hlm. 355}"
