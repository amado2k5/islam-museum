summary:
  en: "A settlement two stages from Mecca on the Medina road; there Abu Sufyan met Budayl ibn Warqa' coming back from Medina, and there the Prophet's army passed on the march of the conquest."
  ar: "موضع على مرحلتين من مكة على طريق المدينة؛ لقي فيه أبو سفيان بديلَ بن ورقاء عائدًا من المدينة، ومرّ به جيش الفتح."
  es: "Un asentamiento situado a dos etapas de La Meca, en el camino a Medina; allí Abu Sufyan se encontró con Budayl ibn Warqa' cuando regresaba de Medina, y allí pasó el ejército del Profeta en su marcha de conquista."
  fr: "Un village situé à deux étapes de La Mecque sur la route de Médine; c'est là qu'Abu Sufyan rencontra Budayl ibn Warqa' revenant de Médine, et c'est là que passa l'armée du Prophète lors de sa marche vers la conquête."
  ur: "مکہ سے مدینہ روڈ پر ایک بستی دو مراحل؛ مدینہ سے واپس آتے ہوئے ابو سفیان کی ملاقات بدیل بن ورقہ سے ہوئی اور وہیں رسول اللہ کا لشکر فتح کے سفر پر گزرا۔"
  tr: "Mekke'nin iki aşamasında, Medine yolunda bir yer; burada Abu Sufyan, Medine'den dönen Badeel ibn Warqa ile karşılaştı ve fetih ordusu onun yanından geçti."
  id: "Sebuah tempat dalam dua tahap Mekah di jalan menuju Madinah; di sana Abu Sufyan bertemu Badeel ibn Warqa yang kembali dari Madinah, dan pasukan penakluk melewatinya."
