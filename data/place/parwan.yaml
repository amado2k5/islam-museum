summary:
  ar: "مدينة فيها أسواق وتجارات وناس مياسير، وبناؤها متقن، وتتصل بالهند عبر ممر؛ وهي فرضة لدخول التجار إلى الهند. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  en: "A town with markets, trade and wealthy people, well built, linked to India by a pass; a gateway for merchants entering India. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  es: "Una ciudad con mercados, comercio y gente adinerada, bien construida, conectada con la India por un paso; una puerta de entrada para los comerciantes que entraban a la India. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  fr: "Une ville prospère, dotée de marchés, d'un commerce florissant et d'une population aisée; bien construite et reliée à l'Inde par un col, elle constituait une porte d'entrée pour les marchands entrant en Inde. {cite:nuzhat-al-mushtaq-2002 p. 485}"
  ur: "بازاروں، تجارت اور مالدار لوگوں کے ساتھ ایک شہر، اچھی طرح سے بنایا گیا، ایک پاس سے ہندوستان سے جڑا ہوا؛ ہندوستان میں داخل ہونے والے تاجروں کے لیے ایک گیٹ وے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 485}"
  tr: "Pazarları, ticareti ve Mayaseer gibi insanları barındıran bir şehir olan bu şehir, mimarisi iyi inşa edilmiş olup, Hindistan'a bir koridor aracılığıyla bağlıdır; tüccarların Hindistan'a giriş kapısıdır. {cite:nuzhat-al-mushtaq-2002 s. 485}"
  id: "Sebuah kota dengan pasar, perdagangan, dan orang-orang seperti Mayaseer, arsitekturnya dibangun dengan baik, terhubung ke India melalui koridor; ini adalah gerbang bagi para pedagang untuk memasuki India. {cite:nuzhat-al-mushtaq-2002 hlm. 485}"
