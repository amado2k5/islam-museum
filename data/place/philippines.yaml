label: { ar: "جزائر الفيلبين", en: "The Philippine archipelago" }
summary:
  ar: "أرخبيل في المحيط الهادئ يضم نحو 1200 جزيرة، وفيه الجزر الجنوبية مثل مينداناو وسولو التي انتشر فيها الإسلام، بحسب ما يذكره شكيب أرسلان في تعليقه على حاضر العالم الإسلامي، لقربها من مسلمي شمال بورنيو. ويصف الكتاب تحوّل معظم السكان إلى الكاثوليكية في عهد الاستعمار الإسباني، وثورة عام 1896 ضد الإسبان، ومحاولة الدولة العثمانية إرسال مندوب لرعاية مسلمي الجزر."
  en: "A Pacific archipelago of about 1,200 islands. In Arslan's commentary on Stoddard, Islam reached the southern islands, Mindanao and Sulu, through contact with northern Borneo. Under Spanish rule most of the population became Catholic; a revolt in 1896 followed, and the Ottoman government sent an envoy to support the Muslims, who had little education {cite:stoddard-arslan-hadir-1923 vol. 1, scan pp. 375–378}."
