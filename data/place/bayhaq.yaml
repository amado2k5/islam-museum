summary:
  ar: "بيهق رستاق من نيسابور؛ دخله الأسود بن كلثوم العدوي عدي الرباب من ثلمة في حيطانه فقاتل حتى قتل ومن معه ثم قام بأمر الناس أدهم بن كاثوم فظفر وفتح بيهق."
  en: "Bayhaq, a rustaq of Naysabur; the ascetic al-Aswad ibn Kulthum breached its walls and fell with his band before Adham ibn Kathum won the town."
  es: "Bayhaq, un rustaq de Naysabur; el asceta al-Aswad ibn Kulthum rompió sus murallas y cayó con su banda antes de que Adham ibn Kathum conquistara la ciudad."
  fr: "Bayhaq, un rustaq de Naysabur; l'ascète al-Aswad ibn Kulthum a percé ses murs et est tombé avec sa bande avant qu'Adham ibn Kathum ne conquière la ville."
  ur: "بیہق، نیصابور کا ایک رستاق؛ اسود بن کلثوم اسود بن کلثوم نے اس کی دیواروں کو توڑا اور ادھم ابن کلثوم کے شہر پر فتح سے پہلے اپنے گروہ کے ساتھ گر گیا۔"
  tr: "Nişapur'dan Bayhaq Rustaq; El-Asvad bin Kultum el-Adawi, duvarlarındaki bir delikten ona girdi ve onunla birliktekilerle birlikte öldürülene kadar savaştı. Sonra Adham bin Kathoum halkı yönetti, zafer kazandı ve Bayhaq fethedildi."
  id: "Bayhaq Rustaq dari Nishapur; Al-Aswad ibn Kulthum al-Adawi masuk melalui lubang di temboknya dan bertempur hingga ia tewas bersama yang bersamanya. Kemudian Adham ibn Kathoum memimpin rakyat, menang, dan Bayhaq ditaklukkan."
