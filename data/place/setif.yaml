summary:
  ar: "حصن كبير القطر كثير الخلق، على مرحلتين جنوب بجاية، فيه شجر مثمر بضروب من الفواكه، ويباع فيه الطيب بثمن رخيص. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  en: "A large, populous fortress two stages south of Bijaya, with fruit trees of many kinds and fragrant produce sold cheaply. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  es: "Una gran fortaleza muy poblada, situada dos etapas al sur de Bijaya, con árboles frutales de muchas clases y productos aromáticos que se vendían a bajo precio. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  fr: "Une grande forteresse peuplée, située à deux étapes au sud de Bijaya, avec des arbres fruitiers de nombreuses espèces et des produits parfumés vendus à bas prix. {cite:nuzhat-al-mushtaq-2002 p. 269}"
  ur: "بیجیا کے جنوب میں ایک بڑا، آبادی والا قلعہ، جس میں کئی قسم کے پھل دار درخت اور خوشبودار پیداوار سستے داموں فروخت ہوتی ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 269}"
  tr: "Bejaia'nın güneyinde, iki aşamalı olarak yer alan, çeşitli meyve ağaçları ve kaliteli ürünler bulunan büyük çaplı ve iyi inşa edilmiş bir kale, düşük fiyatlarla satılmaktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 269}"
  id: "Benteng berdiameter besar yang dibangun dengan baik terletak dalam dua fase di selatan Bejaia, dengan pohon buah berbagai jenis, dan barang-barang baik dijual dengan harga rendah. {cite:nuzhat-al-mushtaq-2002 hlm. 269}"
