  en: "A large island off the Indian coast where elephants are hunted and their tusks traded. It has iron mines, rhubarb grows in its hills, and al-Idrisi describes a poisonous tree there called al-Shahkir. {cite:nuzhat-al-mushtaq-2002 p. 199}"
