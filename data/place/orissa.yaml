summary:
  ar: "جزيرة كبيرة على ساحل الهند، تصاد فيها الفيلة ويُتجهز منها بأنيابها، وفيها معادن حديد، وينبت في جبالها الراوند، ويذكر الإدريسي فيها شجراً سامّاً يُقال له الشهكير. {cite:nuzhat-al-mushtaq-2002 p. 199}"
  en: "A large island off the Indian coast where elephants are hunted and their tusks traded. It has iron mines, rhubarb grows in its hills, and al-Idrisi describes a poisonous tree there called al-Shahkir. {cite:nuzhat-al-mushtaq-2002 p. 199}"
  es: "Una gran isla frente a la costa india donde se cazan elefantes y se comercia con sus colmillos. Posee minas de hierro, en sus colinas crece ruibarbo, y al-Idrisi describe allí un árbol venenoso llamado al-Shahkir. {cite:nuzhat-al-mushtaq-2002 p. 199}"
  fr: "Une grande île au large des côtes indiennes où l'on chasse les éléphants et où l'on fait commerce de leurs défenses. On y trouve des mines de fer, la rhubarbe pousse sur ses collines et al-Idrisi y décrit un arbre vénéneux appelé al-Shahkir. {cite:nuzhat-al-mushtaq-2002 p. 199}"
