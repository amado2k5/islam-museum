summary:
  ar: "مدينة في فزان قريبة من جرمة، لها آبار ونخيل، ومن قربها معدن فضة في جبل يذكره المؤلف، ومن تساوة إلى قبيلة من البربر نحو اثني عشر يوما {cite:nuzhat-al-mushtaq-2002 p. 112}."
  en: "A town in Fezzan near Jarma, with wells and palms. The author notes a silver mine on a mountain some three stages away, which he says yields little, and places the Berber tribe of Azqar about twelve days away {cite:nuzhat-al-mushtaq-2002 p. 112}."
  es: "Un pueblo en Fezzan, cerca de Jarma, con pozos y palmeras. El autor menciona una mina de plata en una montaña a unos tres días de distancia, que según él produce poco, y sitúa a la tribu bereber de Azqar a unos doce días de viaje {cite:nuzhat-al-mushtaq-2002 p. 112}."
  fr: "Une ville du Fezzan, près de Jarma, avec des puits et des palmiers. L'auteur mentionne une mine d'argent sur une montagne à environ trois étapes de là, dont il dit qu'elle ne rapporte pas grand-chose, et situe la tribu berbère d'Azqar à environ douze jours de marche {cite:nuzhat-al-mushtaq-2002 p. 112}."
  ur: "جرما کے قریب فیضان کا ایک قصبہ جس میں کنویں اور کھجوریں ہیں۔ مصنف نے تین مراحل کے فاصلے پر ایک پہاڑ پر ایک چاندی کی کان نوٹ کی ہے، جس کی پیداوار بہت کم ہے، اور ازقر کے بربر قبیلے کو تقریباً بارہ دن کے فاصلے پر رکھتا ہے۔ 112}۔"
