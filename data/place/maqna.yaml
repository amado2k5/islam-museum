summary:
  ar: "موضع على ساحل برية الشام يسكنه يهود بنو حبيبة، يصطاد أهله بالعروك وتغزل نساؤه؛ صالح رسول الله أهلها في غزوة تبوك على ربع صيد العروك وربع الغزل وربع الثمار، وكتب لهم كتاب أمان وذمة قيل إنه بخط علي سنة 9هـ — وقد شكّك محققا الطبعة في نسبته لأن علياً لم يكن مع النبي في غزوة تبوك."
  en: "A locality on the Syrian coast inhabited by Jews of Banu Habiba, whose men fished with 'uruk rafts and whose women spun; the Prophet made peace with its people during the Tabuk campaign for a quarter of the 'uruk catch, a quarter of the spinning and a quarter of the fruits, writing them a letter of security and dhimma said to be in Ali's hand in 9 AH — though the edition's editors question its attribution since Ali was not with the Prophet on the Tabuk campaign."
