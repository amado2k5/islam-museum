summary:
  ar: "قلعة حسنة البناء مطلة على البحر، فيها أشجار وفواكه، وتبعد عن ناروا نحو إحدى وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 611}"
  en: "A fine-built castle overlooking the sea, with trees and fruit, about twenty-one miles from Naroa. {cite:nuzhat-al-mushtaq-2002 p. 611}"
  es: "Un castillo de excelente construcción con vistas al mar, rodeado de árboles frutales, a unos treinta y cuatro kilómetros de Naroa. {cite:nuzhat-al-mushtaq-2002 p. 611}"
  fr: "Un château de belle facture surplombant la mer, entouré d'arbres fruitiers, à environ 34 kilomètres de Naroa. {cite:nuzhat-al-mushtaq-2002 p. 611}"
  ur: "ناروا سے تقریباً اکیس میل کے فاصلے پر درختوں اور پھلوں کے ساتھ ایک عمدہ تعمیر شدہ قلعہ سمندر کو دیکھتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 611}"
  tr: "Denize bakan, ağaçlar ve meyvelerle dolu iyi inşa edilmiş bir kale, Narwa'ya yaklaşık yirmi bir mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 611}"
  id: "Sebuah kastil yang dibangun dengan baik menghadap laut, dengan pohon dan buah-buahan, dan berjarak sekitar dua puluh satu mil dari Narwa. {cite:Nuzhat-al-Mushtaq-2002 hlm. 611}"
