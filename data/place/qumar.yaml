summary:
  ar: "جزيرة يصل إليها تجار العود، وتتوفر فيها العود الصنفي وصندل وأرز. ويذكر المؤلف أن أهلها يلبسون الفوط، ويعرفون بالعدالة والإنصاف، ويحرقون موتاهم بالنار {cite:nuzhat-al-mushtaq-2002 p. 83}."
  en: "An island that traders visit for oud, with sandalwood and rice. The author says its people wear cloth wraps, are known for justice and fairness, and cremate their dead {cite:nuzhat-al-mushtaq-2002 p. 83}."
  es: "Una isla que los comerciantes visitan en busca de oud, sándalo y arroz. El autor afirma que sus habitantes visten túnicas de tela, son conocidos por su justicia y equidad, y creman a sus muertos {cite:nuzhat-al-mushtaq-2002 p. 83}."
  fr: "Une île fréquentée par les marchands venus chercher du oud, du bois de santal et du riz. L'auteur indique que ses habitants portent des pagnes, sont réputés pour leur justice et leur équité, et pratiquent la crémation."
  ur: "ایک جزیرہ جہاں تاجر عود کے لیے صندل اور چاول کے ساتھ آتے ہیں۔ مصنف کا کہنا ہے کہ اس کے لوگ کپڑے کی چادر پہنتے ہیں، عدل و انصاف کے لیے جانے جاتے ہیں، اور اپنے مُردوں کو جلاتے ہیں۔ 83}۔"
  tr: "Ud tüccarlarının ziyaret ettiği, alt tabaka ud, sandalet ve pirinç bulunan bir ada. Yazar, halkının havlu taktığını, adalet ve hakkaniyetle tanındığını ve ölülerini ateşle yaktığını belirtir {cite:nuzhat-al-mushtaq-2002 s. 83}."
  id: "Sebuah pulau yang dikunjungi oleh pedagang oud, di mana substrat oud, sandal, dan beras tersedia. Penulis menyebutkan bahwa penduduknya mengenakan handuk, dikenal akan keadilan dan keadilan, serta membakar mayat mereka dengan api {cite:nuzhat-al-mushtaq-2002 hlm. 83}."
