label: { ar: "قلعة بني سعيد", en: "Qal'at Banu Sa'id", es: "Qal'at Banu Sa'id", fr: "Qal'at Banu Sa'id", ur: "قلعت بنو سعید", tr: "Bani Said Kalesi", id: "Kastil Bani Said" }
summary:
  ar: "قلعة بالأندلس كانت تعرف قبل بقلعة أسطلير وقال الملاحي إنها تعرف بقلعة يحصب نزلها قبيل من اليمن عند فتح الأندلس، وبها صنف الحجاري كتاب المسهب لصاحبها عبد الملك بن سعيد؛ موطن بيت ابن سعيد صاحب المغرب {cite:nafh-tib-maqqari p. 332}."
  en: "The Banu Sa'id fortress — anciently Astulir or Qal'at Yahsub, where a Yemeni clan settled at the conquest — home of the historian's family and of the Musahhib's commissioning {cite:nafh-tib-maqqari p. 332}."
  es: "La fortaleza de Banu Sa'id — antiguamente Astulir o Qal'at Yahsub, donde se asentó un clan yemení tras la conquista — hogar de la familia del historiador y lugar donde se encargó la obra al Musahhib {cite:nafh-tib-maqqari p. 332}."
  fr: "La forteresse de Banu Sa'id — anciennement Astulir ou Qal'at Yahsub, où un clan yéménite s'est installé lors de la conquête — est la maison de la famille de l'historien et le lieu de la commission du Musahhib {cite:nafh-tib-maqqari p. 332}."
  ur: "بنو سعید کا قلعہ - قدیمی طور پر استولیر یا قلات یحسوب، جہاں ایک یمنی قبیلہ فتح کے وقت آباد ہوا تھا - مورخ کے خاندان اور مصاحب کی کمشن کا گھر {حوالہ: نفح تبع مقری ص۔ 332}۔"
  tr: "El-Endülüs'te daha önce Astlir Kalesi olarak bilinen bir kale. El-Mallahi, buranın Endülüs'ün fethi sırasında Yemen yakınlarında yerleşim gören bir kale olarak bilindiğini belirtmiştir. Al-Hajari, yazarı Abd al-Malik ibn Sa'id'in Al-Mushab kitabını burada yazmıştır; Fas hükümdarı İbn Sa'id'in evidir {cite:nafh-tib-maqqari, s. 332}."
  id: "Sebuah kastil di al-Andalus yang sebelumnya dikenal sebagai Kastil Astlir. Al-Mallahi mengatakan bahwa kastil ini dikenal sebagai kastil yang dihuni dekat Yaman selama penaklukan al-Andalus. Di sinilah Al-Hajari menulis buku Al-Mushab oleh penulisnya Abd al-Malik ibn Sa'id; ini adalah rumah bagi keluarga Ibn Sa'id, penguasa Maroko {cite:nafh-tib-maqqari, hlm. 332}."
