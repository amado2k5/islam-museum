summary:
  ar: "بحيرة طولها نحو ثلاثين ميلاً، وماؤها عذب، ويجف أكثرها في القيظ حتى لا يبقى منها إلا اليسير، وفيها زوارق يُصاد بها السمك. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  en: "A lake about thirty miles long with fresh water, most of which dries up in summer; boats fish on it. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  es: "Un lago de unos cincuenta kilómetros de largo con agua dulce, que se seca casi por completo en verano; en él se pesca en barco. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  fr: "Un lac d'une trentaine de kilomètres de long, rempli d'eau douce, qui s'assèche en grande partie en été; des bateaux y pratiquent la pêche. {cite:nuzhat-al-mushtaq-2002 p. 423}"
  ur: "تقریباً تیس میل لمبی ایک جھیل جس میں تازہ پانی ہے، جس میں سے اکثر گرمیوں میں سوکھ جاتے ہیں۔ اس پر کشتیاں مچھلیاں. {حوالہ: نزہت المشتاق-2002 ص۔ 423}"
  tr: "Yaklaşık otuz mil uzunluğunda, tatlı suyu olan bir göl, yazın çoğu kuruyor ve geriye sadece az miktarda kalıyor. Balıkçılık için kullanılan tekneler var. {cite:nuzhat-al-mushtaq-2002 s. 423}"
  id: "Danau sepanjang sekitar tiga puluh mil, dengan air tawar, dan sebagian besar kering di musim panas sehingga hanya sedikit yang tersisa. Di danau ini terdapat perahu yang digunakan untuk memancing. {cite:nuzhat-al-mushtaq-2002 hlm. 423}"
