summary:
  ar: "مدينة أندلسية على ساحل البحر؛ لها القلعة المنيعة المعروفة بقلعة خيران بناها عبد الرحمن الناصر وعظمت في دولة المنصور وولى عليها مولاه خيران، وبها من صنعة الديباج ما تفوق به على سائر البلاد وفيها دار الصناعة، وكان بها لنسج طرز الحرير ثمانمائة نول وللحلل النفيسة والديباج الفاخر والأسقلاطون والثياب الجرجانية والأصفهانية ألف ألف نول، ومن الحمامات والفنادق نحو الألف، وكورتها تشتمل على معدن الحديد والرخام، وألف فيها أبو جعفر ابن خاتمة تاريخاً سماه مزية المرية {cite:nafh-tib-maqqari p. 199-200}."
  en: "Almeria — Nasir's fortress city with Khayran's castle, a thousand silk looms and a thousand baths, an iron and marble countryside, and a lost history by Ibn Khatima {cite:nafh-tib-maqqari p. 199-200}."
