summary:
  ar: "مدينة أندلسية على ساحل البحر؛ لها القلعة المنيعة المعروفة بقلعة خيران بناها عبد الرحمن الناصر وعظمت في دولة المنصور وولى عليها مولاه خيران، وبها من صنعة الديباج ما تفوق به على سائر البلاد وفيها دار الصناعة، وكان بها لنسج طرز الحرير ثمانمائة نول وللحلل النفيسة والديباج الفاخر والأسقلاطون والثياب الجرجانية والأصفهانية ألف ألف نول، ومن الحمامات والفنادق نحو الألف، وكورتها تشتمل على معدن الحديد والرخام، وألف فيها أبو جعفر ابن خاتمة تاريخاً سماه مزية المرية {cite:nafh-tib-maqqari p. 199-200}."
  en: "Almeria — Nasir's fortress city with Khayran's castle, a thousand silk looms and a thousand baths, an iron and marble countryside, and a lost history by Ibn Khatima {cite:nafh-tib-maqqari p. 199-200}."
  es: "Almería: la ciudad fortaleza de Nasir con el castillo de Khayran, mil telares de seda y mil baños, un paisaje rural de hierro y mármol, y una historia perdida por Ibn Khatima {cite:nafh-tib-maqqari p. 199-200}."
  fr: "Almeria — la ville forteresse de Nasir avec le château de Khayran, mille métiers à tisser la soie et mille bains, une campagne de fer et de marbre, et une histoire perdue par Ibn Khatima {cite:nafh-tib-maqqari p. 199-200}."
  ur: "المیریا — ناصر کا قلعہ دار شہر جس میں خیران کا قلعہ، ایک ہزار ریشم کے کرگھے اور ایک ہزار حمام، لوہے اور سنگ مرمر کا دیہی علاقہ، اور ایک گمشدہ تاریخ از ابن خاتمہ۔ 199-200}۔"
  tr: "Deniz kıyısında bir Endülüs şehri; Abd al-Rahman al-Nasir tarafından inşa edilmiş, Al-Mansur devleti sırasında onurlandırılmış ve müvekkili Khairan tarafından atanan görkemli bir kale vardır. Tüm diğer ülkeleri aşan seçkin bir brokar sanatına sahiptir ve zanaatkarlık atölyesine ev sahipliği yapmaktadır. İpek nakış dokuma için sekiz yüz tezgah, değerli brokar, ince brokar, askelatun ve Jurcani ile İsfahani kostümlerinden yapılmış giysiler ile yaklaşık bin adet hamam ve otel tezgahı bulunmaktadır. Alanı demir ve mermer cevheri içerir. Ebu Ca'far ibn Khatima, Miziyat al-Meriya adlı bir tarih yazmıştır {cite:nafh-tib-maqqari, s. 199-200}."
  id: "Sebuah kota Andalusia di tepi pantai; memiliki benteng megah yang dikenal sebagai Kastil Khairan, dibangun oleh Abd al-Rahman al-Nasir, yang dihormati selama masa pemerintahan Al-Mansur, dan kliennya Khairan ditunjuk sebagai atasnya. Kota ini memiliki kerajinan brokat yang unggul yang melampaui semua negara lain, dan memiliki bengkel kerajinan. Memiliki delapan ratus alat tenun untuk menenun sutra, brokat berharga, brokat halus, asqalatun, dan pakaian yang terbuat dari kostum Jurjani dan Isfahani, serta sekitar seribu alat tenun dari pemandian dan hotel. Wilayahnya mencakup bijih besi dan marmer. Abu Ja'far ibn Khatima menulis sejarah berjudul Miziyat al-Meriya {cite:nafh-tib-maqqari, hlm. 199-200}."
