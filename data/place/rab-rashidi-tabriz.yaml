label:
  ar: "الربع الرشيدي بتبريز"
  en: "Rab' al-Rashidi, Tabriz"
  ur: "ربع رشیدی، تبریز"
  fr: "Rab'-i Rashidi, Tabriz"
  es: "Rab'-i Rashidi, Tabriz"
  tr: "Tebriz'deki El-Reşidi Mahallesi"
  id: "Kawasan Al-Rashidi di Tabriz"
summary:
  ar: "ضاحية أنشأها رشيد الدين شرق تبريز، سمّاها باسمه، وتضم طائفة من العمائر المتسقة الجميلة {cite:jami-al-tawarikh-khashshab-1960 p. 49}. وفي سنة 710 هـ أنفق على قناة منقورة في الصخر تعبر جبلاً ثم السهول حتى تصل إلى الضاحية لتزويدها بالماء {cite:jami-al-tawarikh-khashshab-1960 p. 50}. وكان قد أنشأ من قبل ضاحية مماثلة بالسلطانية تضم نحو ألف بيت {cite:jami-al-tawarikh-khashshab-1960 p. 45}."
  en: "A suburb that Rashid al-Din built east of Tabriz and named after himself, containing a group of harmonious and handsome buildings {cite:jami-al-tawarikh-khashshab-1960 p. 49}. In 710 AH he paid for a channel cut through rock, across a mountain and then the plains, to bring water to the suburb {cite:jami-al-tawarikh-khashshab-1960 p. 50}. He had earlier built a similar suburb of about a thousand houses at Sultaniyya {cite:jami-al-tawarikh-khashshab-1960 p. 45}."
  es: "Un arrabal que Rashid al-Din construyó al este de Tabriz y llevó su nombre, con un conjunto de edificios armoniosos y hermosos {cite:jami-al-tawarikh-khashshab-1960 p. 49}. En 710 de la Hégira costeó un canal excavado en la roca, que atravesaba una montaña y luego la llanura, para llevar agua al arrabal {cite:jami-al-tawarikh-khashshab-1960 p. 50}. Antes había construido un arrabal similar de unas mil casas en Sultaniyya {cite:jami-al-tawarikh-khashshab-1960 p. 45}."
  fr: "Un faubourg que Rashid al-Din fit construire à l'est de Tabriz et qu'il nomma d'après lui, comprenant un ensemble de bâtiments harmonieux et beaux {cite:jami-al-tawarikh-khashshab-1960 p. 49}. En 710 de l'Hégire, il finança un canal creusé dans le roc, traversant une montagne puis la plaine, pour amener l'eau au faubourg {cite:jami-al-tawarikh-khashshab-1960 p. 50}. Il avait auparavant bâti un faubourg semblable d'environ mille maisons à Sultaniyya {cite:jami-al-tawarikh-khashshab-1960 p. 45}."
  ur: "تبریز کے مشرق میں رشید الدین کا بسایا ہوا محلہ، جس کا نام انہوں نے اپنے نام پر رکھا، اور جس میں خوبصورت اور ہم آہنگ عمارتوں کا ایک مجموعہ تھا {cite:jami-al-tawarikh-khashshab-1960 p. 49}۔ 710ھ میں انہوں نے چٹان کاٹ کر بنائی گئی ایک نہر پر رقم خرچ کی، جو ایک پہاڑ اور پھر میدانوں سے گزر کر محلے تک پانی لاتی تھی {cite:jami-al-tawarikh-khashshab-1960 p. 50}۔ اس سے پہلے سلطانیہ میں بھی تقریباً ایک ہزار گھروں کا ایسا ہی محلہ انہوں نے بسایا تھا {cite:jami-al-tawarikh-khashshab-1960 p. 45}۔"
  tr: "Tebriz'in doğusunda Raşiddin tarafından kurulan bir banliyö, onun adını taşıyor ve bir dizi güzel, uyumlu yapıyı içerir {cite:jami-al-tawarikh-khashshab-1960 s. 49}. 710 H.M.'de, bir dağı ve ardından ovaları geçen bir kayaya oyulmuş bir kanal üzerinde harcadı; bu kanal banliyöye ulaşarak su sağlamak için {cite:jami-al-tawarikh-khashshab-1960 s. 50}. Daha önce Sultaniya'da yaklaşık bin evden oluşan benzer bir banliyö kurmuştu {cite:jami-al-tawarikh-khashshab-1960 s. 45}."
  id: "Sebuah pinggiran kota yang didirikan oleh Rashid al-Din di sebelah timur Tabriz, dinamai menurut namanya, dan mencakup serangkaian bangunan indah dan harmonis {cite:jami-al-tawarikh-khashshab-1960 hlm. 49}. Pada tahun 710 H, ia menghabiskan waktu di kanal yang dipahat di batu, melintasi gunung dan kemudian dataran hingga mencapai pinggiran kota untuk memasok air {cite:jami-al-tawarikh-khashshab-1960 hlm. 50}. Sebelumnya, ia telah mendirikan pinggiran serupa di Kesultanan yang berisi sekitar seribu rumah {cite:jami-al-tawarikh-khashshab-1960 hlm. 45}."
