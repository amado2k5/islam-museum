summary:
  ar: "مرعش من ثغور الشام الجزرية عند الأعماق؛ فتح خالد بن الوليد حصنها بإرسال أبي عبيدة من منبج على شرط جلاء أهله فأخربه، ثم بناها معاوية مدينةً وأسكنها جنداً، وعمّرها العباس بن الوليد وحصّنها وبنى جامعها وقطع على قنسرين بعثاً سنوياً إليها، وتناوب عليها البناء والخراب بين مروان بن محمد والروم حتى بناها صالح بن علي في خلافة المنصور وزاد المهدي شحنتها؛ وبها وقعت غارة ميخائيل سنة 161 على عمقها وواقعته مبادرة من موالي عيسى بن علي."
  en: "Mar'ash (Germanikeia) of the Syrian-Jaziran marchland at the A'maq; Khalid ibn al-Walid took its fortress at Abu Ubayda's dispatch from Manbij on its people's evacuation, demolishing it; Mu'awiya built it as a garrisoned city, al-Abbas ibn al-Walid rebuilt and fortified it, raised its congregational mosque and levied a yearly contingent on Qinnasrin for it, and it passed through building and ruin between Marwan ibn Muhammad and the Romans until Salih ibn Ali rebuilt it in al-Mansur's caliphate and al-Mahdi enlarged its garrison; on its depths fell Michael's incursion of year 161, met by the sortie of Isa ibn Ali's mawalis."
  es: "Mar'ash (Germanikeia) de la marca sirio-jaziran en A'maq; Khalid ibn al-Walid tomó su fortaleza por orden de Abu Ubayda desde Manbij durante la evacuación de su gente, demoliéndola; Mu'awiya la construyó como una ciudad guarnecida, al-Abbas ibn al-Walid la reconstruyó y fortificó, levantó su mezquita congregacional y reclutó un contingente anual en Qinnasrin para ella, y pasó por construcciones y ruinas entre Marwan ibn Muhammad y los romanos hasta que Salih ibn Ali la reconstruyó en el califato de al-Mansur y al-Mahdi amplió su guarnición; en sus profundidades cayó la incursión de Miguel en el año 161, recibida por la salida de los mawalis de Isa ibn Ali."
  fr: "Mar'ash (Germanikeia) des marches syro-jaziriennes à A'maq; Khalid ibn al-Walid s'empara de sa forteresse sur ordre d'Abu Ubayda de Manbij lors de l'évacuation de sa population, et la détruisit; Mu'awiya la construisit comme ville garnison, al-Abbas ibn al-Walid la reconstruisit et la fortifia, y fit construire sa mosquée et y leva un contingent annuel à Qinnasrin; elle connut des périodes de construction et de ruine entre Marwan ibn Muhammad et les Romains, jusqu'à ce que Salih ibn Ali la reconstruise sous le califat d'al-Mansur et qu'al-Mahdi y agrandisse sa garnison; c'est sur ses terres que tomba l'incursion de Michel en l'an 161, contrée par la sortie des mawalis d'Isa ibn Ali."
  ur: "عماق میں شامی-جزیران مارچ لینڈ کا ماراش ⁦(جرمنیکیا)⁩؛ منبج سے ابو عبیدہ کے بھیجے جانے پر خالد بن ولید نے اس کا قلعہ اپنے لوگوں کے انخلاء پر لے لیا، اسے منہدم کر دیا۔ معاویہ نے اسے ایک چوکیدار شہر کے طور پر تعمیر کیا، العباس ابن الولید نے اسے دوبارہ تعمیر کیا اور قلعہ بندی کی، اس کی جامع مسجد کی تعمیر کی اور اس کے لیے کنسرین پر سالانہ دستہ لگایا، اور یہ مروان بن محمد اور رومیوں کے درمیان عمارت اور کھنڈرات سے گزرتا رہا یہاں تک کہ صالح ابن علی المصطفیٰ نے اسے دوبارہ تعمیر کیا۔ اس کے گیریژن کو بڑھایا؛ اس کی گہرائیوں پر 161 میں مائیکل کا حملہ ہوا، جس کا سامنا عیسیٰ ابن علی کے موالیوں کے ساتھ ہوا۔"
  tr: "Maraş, Şam'ın derinliklerinde Jazari sınırlarından biriydi; Halid bin el-Velid, halkını tahliye etme şartıyla Ebu Ubeydah'ı Manbic'ten göndererek kalesini ele geçirdi, ancak o kaleyi yok etti. Sonra Muaviye burayı bir şehir olarak inşa etti ve askerlerini oraya konuşlandırdı. Abbas ibn al-Walid inşa etti ve mühimmat etti, camisini yaptı ve her yıl Qinnasreen'i buraya gönderdi. İnşaat ve yıkım, Mervan ibn Muhammed ile Romalılar arasında dönüşümlü olarak gerçekleşti; ta ki Salih ibn Ali el-Mensur halifeliği sırasında kaleyi yeniden inşa edene kadar; el-Mehdi ise saldırılarını artırdı. Mikail, 161 Hicri'de derinliklerine baskın düzenledi ve İsa bin Ali'nin özgürleştirilmişleri tarafından başlatıldı."
  id: "Marash adalah salah satu perbatasan Jazari di Levant yang terletak jauh di dalam kedalaman; Khalid ibn al-Walid merebut bentengnya dengan mengirim Abu Ubaidah dari Manbij dengan syarat mengevakuasi rakyatnya, tetapi ia menghancurkannya. Kemudian Muawiya membangunnya sebagai kota dan menempatkan tentara di sana. Abbas ibn al-Walid membangun dan memperkuatnya, membangun masjidnya, dan setiap tahun mengirim Qinnasreen ke sana. Pembangunan dan penghancuran bergantian antara Marwan ibn Muhammad dan bangsa Romawi hingga Saleh ibn Ali membangunnya kembali selama kekhalifahan al-Mansur, dan al-Mahdi meningkatkan serangannya. Di sanalah Michael menyerang kedalaman kota itu pada tahun 161 H dan diinisiasi oleh para mantan izin Isa ibn Ali."
