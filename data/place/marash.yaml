summary:
  ar: "مرعش من ثغور الشام الجزرية عند الأعماق؛ فتح خالد بن الوليد حصنها بإرسال أبي عبيدة من منبج على شرط جلاء أهله فأخربه، ثم بناها معاوية مدينةً وأسكنها جنداً، وعمّرها العباس بن الوليد وحصّنها وبنى جامعها وقطع على قنسرين بعثاً سنوياً إليها، وتناوب عليها البناء والخراب بين مروان بن محمد والروم حتى بناها صالح بن علي في خلافة المنصور وزاد المهدي شحنتها؛ وبها وقعت غارة ميخائيل سنة 161 على عمقها وواقعته مبادرة من موالي عيسى بن علي."
  en: "Mar'ash (Germanikeia) of the Syrian-Jaziran marchland at the A'maq; Khalid ibn al-Walid took its fortress at Abu Ubayda's dispatch from Manbij on its people's evacuation, demolishing it; Mu'awiya built it as a garrisoned city, al-Abbas ibn al-Walid rebuilt and fortified it, raised its congregational mosque and levied a yearly contingent on Qinnasrin for it, and it passed through building and ruin between Marwan ibn Muhammad and the Romans until Salih ibn Ali rebuilt it in al-Mansur's caliphate and al-Mahdi enlarged its garrison; on its depths fell Michael's incursion of year 161, met by the sortie of Isa ibn Ali's mawalis."
