summary:
  ar: "مدينة على ساحل البحر الهندي، وهي آخر بلاد قوم من السود الذين لا يعتقدون بدين ثابت، ويعبدون أحجاراً قائمة يدهنونها بدهن السمك، ويصفهم المؤلف بفساد الاعتقاد {cite:nuzhat-al-mushtaq-2002 p. 58}."
  en: "A town on the coast of the Indian Ocean, the last land of black peoples the author describes as having no fixed faith. They worship upright stones anointed with fish oil, which the author calls a corrupt belief {cite:nuzhat-al-mushtaq-2002 p. 58}."
  es: "Un pueblo en la costa del Océano Índico, la última tierra de los pueblos negros que el autor describe como carentes de una fe fija. Adoran piedras erguidas ungidas con aceite de pescado, lo que el autor califica de creencia corrupta {cite:nuzhat-al-mushtaq-2002 p. 58}."
  fr: "Une ville côtière de l'océan Indien, dernier bastion des peuples noirs, décrits par l'auteur comme dépourvus de foi fixe. Leurs habitants vénèrent des pierres dressées, ointes d'huile de poisson, ce que l'auteur qualifie de croyance corrompue {cite:nuzhat-al-mushtaq-2002 p. 58}."
