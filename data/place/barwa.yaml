  ar: "مدينة على ساحل البحر الهندي، وهي آخر بلاد قوم من السود الذين لا يعتقدون بدين ثابت، ويعبدون أحجاراً قائمة يدهنونها بدهن السمك، ويصفهم المؤلف بفساد الاعتقاد {cite:nuzhat-al-mushtaq-2002 p. 58}."
  en: "A town on the coast of the Indian Ocean, the last land of black peoples the author describes as having no fixed faith. They worship upright stones anointed with fish oil, which the author calls a corrupt belief {cite:nuzhat-al-mushtaq-2002 p. 58}."
