summary:
  ar: "عند البلاذري: بلاد بينها وبين بلاد الإسلام مسيرة شهر في أرض قفر وجبال وعرة بها معادن الذهب غزاها محمد القمي زمن المتوكل حتى قلعة ملكها وصلحوا سنة إحدى وأربعين ومائتين على الأتاوة والبقط وعدم منع المسلمين العمل في معدن الذهب."
  en: "In al-Baladhuri: lands a month's barren march of rugged mountains from the lands of Islam, holding the gold mines; Muhammad al-Qummi campaigned there in al-Mutawakkil's time to its king's fortress, and they made peace in year 241 on tribute and baqt and not barring Muslims from working the gold mine."
  es: "En al-Baladhuri: tierras a un mes de marcha árida de montañas escarpadas desde las tierras del Islam, donde se encuentran las minas de oro; Muhammad al-Qummi hizo campaña allí en tiempos de al-Mutawakkil hasta la fortaleza de su rey, y firmaron la paz en el año 241 sobre tributo y baqt y sin impedir que los musulmanes trabajaran la mina de oro."
  fr: "À al-Baladhuri: terres à un mois de marche aride de montagnes escarpées des terres de l'Islam, abritant les mines d'or; Muhammad al-Qummi y mena campagne à l'époque d'al-Mutawakkil jusqu'à sa forteresse royale, et ils conclurent la paix en l'an 241 sur le tribut et le baqt et sans interdire aux musulmans de travailler dans la mine d'or."
  ur: "البلادوری میں: زمین اسلام کی سرزمین سے ناہموار پہاڑوں کا ایک ماہ کا بنجر مارچ، سونے کی کانوں کو تھامے ہوئے؛ محمد القومی نے المتوکل کے زمانے میں وہاں اپنے بادشاہ کے قلعے تک مہم چلائی، اور انہوں نے سال 241 میں خراج اور بکت پر صلح کی اور مسلمانوں کو سونے کی کان میں کام کرنے سے روکا نہیں۔"
