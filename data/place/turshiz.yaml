  fr: "Ville du district de Nishapur, peuplée, fortifiée et entourée de fossés, avec des jardins et un commerce florissant; à deux étapes de Yanabadh. {cite:nuzhat-al-mushtaq-2002 p. 464}"
  ur: "نیشاپور ضلع کا ایک شہر، آبادی والا، دیواروں سے گھرا ہوا، باغات اور تجارت کے ساتھ؛ یان آباد سے دو مراحل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 464}"
  tr: "Nişapur'da, surları, hendekleri, meyve bahçeleri ve ticareti olan hareketli bir şehir, Yanabaz'dan iki aşama uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 464}"
  id: "Sebuah kota di Nishapur, kota yang ramai dengan tembok, parit, kebun buah, dan perdagangan, terletak dua fase dari Yanabaz. {cite:Nuzhat-al-Mushtaq-2002 hlm. 464}"
