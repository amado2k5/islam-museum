summary:
  ar: "مدينة مشهورة تقع أسفل الأشمونين، يصنع فيها ستور صوف وأكسية صوف منسوبة إليها، ويذكر المؤلف أن التمساح يضر بالضفة المقابلة للأشمونين ولا يضر بضفة أنصنا {cite:nuzhat-al-mushtaq-2002 p. 125}."
  en: "A well-known town below al-Ushmunayn, famous for woollen hangings and blankets named after it. The author reports that crocodiles harm the bank opposite al-Ushmunayn but not the bank of Ansina {cite:nuzhat-al-mushtaq-2002 p. 125}."
