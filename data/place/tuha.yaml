summary:
  ar: "مدينة مشهورة تقع أسفل الأشمونين، يصنع فيها ستور صوف وأكسية صوف منسوبة إليها، ويذكر المؤلف أن التمساح يضر بالضفة المقابلة للأشمونين ولا يضر بضفة أنصنا {cite:nuzhat-al-mushtaq-2002 p. 125}."
  en: "A well-known town below al-Ushmunayn, famous for woollen hangings and blankets named after it. The author reports that crocodiles harm the bank opposite al-Ushmunayn but not the bank of Ansina {cite:nuzhat-al-mushtaq-2002 p. 125}."
  es: "Un pueblo muy conocido situado debajo de al-Ushmunayn, famoso por sus tapices y mantas de lana, lleva su nombre. El autor informa que los cocodrilos dañan la orilla opuesta a al-Ushmunayn, pero no la de Ansina {cite:nuzhat-al-mushtaq-2002 p. 125}."
  fr: "Ansina est une ville réputée située en aval d'al-Ushmunayn, célèbre pour ses tentures et couvertures en laine qui portent son nom. L'auteur rapporte que les crocodiles causent des dégâts sur la rive opposée à al-Ushmunayn, mais pas sur celle d'Ansina (voir: Nuzhat al-Mushtaq, 2002, p. 125)."
  ur: "العشمونین کے نیچے ایک مشہور قصبہ جو اونی لٹکیوں اور کمبلوں کے لیے مشہور ہے اس کے نام سے منسوب ہے۔ مصنف نے رپورٹ کیا ہے کہ مگرمچھ العشمونین کے مخالف بینک کو نقصان پہنچاتے ہیں لیکن بینک آف انسینہ کو نہیں۔ 125}۔"
  tr: "Ashmonayn'ın aşağısında yer alan ünlü bir şehir; burada bir yün deposu ve adını taşıyan yün giysiler üretilmektedir. Yazar, timsahın Ashmonayn'ın karşısındaki kıyıya zarar verdiğini, ancak Ansana kıyısına zarar vermediğini belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 125}."
  id: "Sebuah kota terkenal yang terletak di bawah Ashmonayn, tempat sebuah toko wol dan pakaian wol yang dinamai menurut kota itu dibuat. Penulis menyebutkan bahwa buaya merusak tepi sungai di seberang Ashmonayn tetapi tidak merusak pantai Ansana {cite:Nuzhat-al-Mushtaq-2002, hlm. 125}."
