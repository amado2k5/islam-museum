summary:
  ar: "مدينة بناها أنوشروان؛ وصالح أهلها سلمان بن ربيعة ضمن ملوك الجبال بعد عبوره الكُرّ — وأيضاً لقب ملك مسقط من ملوك أنوشروان المعروفين وقد بطلت مملكته يوم البلاذري."
  en: "a city Anushirwan built; its people compounded with Salman ibn Rabi'a among the mountain kings after his crossing of the Kurr — its kingship, among the kings Anushirwan once confirmed, had lapsed by al-Baladhuri's day."
  es: "una ciudad construida por Anushirwan; sus habitantes se unieron a Salman ibn Rabi'a entre los reyes de las montañas después de que él cruzara el Kurr; su reinado, entre los reyes que Anushirwan confirmó en su momento, había caducado en la época de al-Baladhuri."
  fr: "une ville construite par Anushirwan; ses habitants se sont associés à Salman ibn Rabi'a parmi les rois de la montagne après sa traversée du Kurr — sa royauté, parmi les rois qu'Anushirwan avait autrefois confirmés, avait disparu à l'époque d'al-Baladhuri."
  ur: "ایک شہر انوشیروان بنایا گیا اس کے لوگ کر کے کراسنگ کے بعد پہاڑی بادشاہوں کے درمیان سلمان بن ربیعہ کے ساتھ مل گئے - اس کی بادشاہی، بادشاہوں کے درمیان، انوشیروان نے ایک بار تصدیق کی تھی، البلادھوری کے دن سے ختم ہو گئی تھی۔"
  tr: "Anuşirvan tarafından inşa edilen bir şehir; Dağların kralları arasında Saleh bin Rabi'ah, Kerem'i geçtikten sonra Saleh bin Rabi'ah'tı — ayrıca Anuşirvan'ın tanınmış kralları arasında Maskat Kralı unvanı verildi; bu krallığın krallığı el-Baladhuri döneminde kaldırıldı."
  id: "Sebuah kota yang dibangun oleh Anushirwan; Saleh Saleh di antara raja-raja pegunungan adalah Saleh bin Rabi'ah setelah menyeberangi Karam — dan ia juga diberi gelar Raja Muscat di antara raja-raja terkenal Anushirwan, yang kerajaannya dihapuskan pada masa al-Baladhuri."
