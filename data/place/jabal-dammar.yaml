summary:
  ar: "جبل يبعد عن جبل نفوسة ثلاث مراحل، وعلى أطرافه قوم من البربر يركبون خيلاً سريعة ويغيرون على إبل العرب المجاورين، ويذكر الإدريسي أن العرب يشكون من أذاهم. {cite:nuzhat-al-mushtaq-2002 p. 299}"
  en: "A mountain three stages from Jabal Nafusa. Berber people at its edges ride swift horses and raid the camels of neighbouring Arabs, and al-Idrisi says the Arabs complain of them. {cite:nuzhat-al-mushtaq-2002 p. 299}"
  es: "Una montaña situada a tres etapas de Jabal Nafusa. Los bereberes de sus laderas cabalgan veloces caballos y asaltan los camellos de los árabes vecinos, y al-Idrisi afirma que los árabes se quejan de ellos. {cite:nuzhat-al-mushtaq-2002 p. 299}"
  fr: "Une montagne à trois étapes du Jabal Nafusa. Des Berbères, installés à ses abords, montent des chevaux rapides et pillent les chameaux des Arabes voisins; al-Idrisi rapporte que ces derniers s’en plaignent. {cite:nuzhat-al-mushtaq-2002 p. 299}"
  ur: "ایک پہاڑ جبل نفوسہ سے تین مراحل۔ اس کے کناروں پر بربر لوگ تیز گھوڑوں پر سوار ہوتے ہیں اور پڑوسی عربوں کے اونٹوں پر حملہ کرتے ہیں، اور الادریسی کہتے ہیں کہ عرب ان کی شکایت کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 299}"
  tr: "Nafosa Dağı'na üç adım uzaklıkta bir dağ ve kenarlarında bir grup Berberi hızlı atlara binerek komşu Arapların develerine saldırıyor. El-İdrisi, Arapların zararlarından şikayet ettiğini belirtiyor. {kaynak:nuzhat-al-mushtaq-2002 s. 299}"
  id: "Sebuah gunung tiga langkah dari Gunung Nafusa, dan di tepinya sekelompok Berber menunggang kuda cepat dan menyerang unta orang Arab tetangga. Al-Idrisi menyebutkan bahwa orang Arab mengeluh tentang bahaya mereka. {cite:nuzhat-al-mushtaq-2002 hlm. 299}"
