summary:
  ar: "مدينة كبيرة مشهورة على ضفة نهر يجري من الشمال، ويختلف الناس في موضعها: قيل إنها على خليج، وقيل إن النهر يمر بها أياماً ثم يغوص في الرمال كما يغوص الفرات في البطائح. ملكها مستقل، يخطب لنفسه، وله حشم وجند كثير {cite:nuzhat-al-mushtaq-2002 p. 28}."
  en: "A famous large city on the bank of a river coming from the north. Some say it stands on a gulf; others say the river runs for many days past it and then sinks into sand. Its ruler is independent and has many followers and soldiers. {cite:nuzhat-al-mushtaq-2002 p. 28}"
