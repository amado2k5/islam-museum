summary:
  ar: "مدينة كبيرة مشهورة على ضفة نهر يجري من الشمال، ويختلف الناس في موضعها: قيل إنها على خليج، وقيل إن النهر يمر بها أياماً ثم يغوص في الرمال كما يغوص الفرات في البطائح. ملكها مستقل، يخطب لنفسه، وله حشم وجند كثير {cite:nuzhat-al-mushtaq-2002 p. 28}."
  en: "A famous large city on the bank of a river coming from the north. Some say it stands on a gulf; others say the river runs for many days past it and then sinks into sand. Its ruler is independent and has many followers and soldiers. {cite:nuzhat-al-mushtaq-2002 p. 28}"
  es: "Una famosa gran ciudad a orillas de un río que viene del norte. Algunos dicen que se asienta sobre un golfo; otros, que el río fluye durante muchos días a su lado y luego se hunde en la arena. Su gobernante es independiente y cuenta con numerosos seguidores y soldados. {cite:nuzhat-al-mushtaq-2002 p. 28}"
  fr: "Une grande ville célèbre, située sur la rive d'un fleuve venant du nord. Certains disent qu'elle se trouve sur un golfe; d'autres affirment que le fleuve coule à proximité pendant de nombreux jours avant de s'enfouir dans le sable. Son souverain est indépendant et dispose de nombreux partisans et soldats. {cite:nuzhat-al-mushtaq-2002 p. 28}"
  ur: "شمال سے آنے والے دریا کے کنارے ایک مشہور بڑا شہر۔ کچھ کہتے ہیں کہ یہ ایک خلیج پر کھڑا ہے۔ دوسروں کا کہنا ہے کہ دریا کئی دنوں تک بہتا ہے اور پھر ریت میں ڈوب جاتا ہے۔ اس کا حکمران آزاد ہے اور اس کے بہت سے پیروکار اور سپاہی ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 28}"
