summary:
  ar: "بأران بناها قباذ بن فيروز؛ فتحها سلمان بن ربيعة الباهلي صلحاً على أمان الدماء والأموال والحيطان بشرط الجزية والخراج، وجدّد بناءها عبد العزيز بن حاتم وشهدت متاركة وعمارين."
  en: "in Arran, built by Qubadh ibn Fayruz; Salman ibn Rabi'a al-Bahili took it by treaty securing blood, wealth and walls for jizya and kharaj, and Abd al-Aziz ibn Hatim renewed its building after decay."
  es: "En Arran, fue construida por Qubadh ibn Fayruz; Salman ibn Rabi'a al-Bahili la tomó mediante un tratado, asegurándose sangre, riquezas y murallas a cambio de jizya y kharaj, y Abd al-Aziz ibn Hatim renovó su construcción después de su deterioro."
  fr: "à Arran, construit par Qubadh ibn Fayruz; Salman ibn Rabi'a al-Bahili l'a pris par traité garantissant le sang, la richesse et les murs pour la jizya et le kharaj, et Abd al-Aziz ibn Hatim a renouvelé sa construction après la décrépitude."
  ur: "عران میں، قبادہ بن فیروز نے تعمیر کیا تھا۔ سلمان بن ربیعہ الباہلی نے جزیہ اور خراج کے لیے خون، مال اور دیواروں کے تحفظ کے معاہدے کے ذریعے اسے لے لیا، اور عبد العزیز ابن حاتم نے بوسیدہ ہونے کے بعد اس کی عمارت کی تجدید کی۔"
  tr: "Kubad bin Fairuz tarafından inşa edilmiştir; kan, mal ve duvarların güvenliği için Salman bin Rabi'ah Al-Bahili tarafından haraç ve vergi şartıyla bir barış anlaşması olarak açılmıştır. İnşası Abdul Aziz bin Hatim tarafından yenilenmiş ve hem Mutarkah hem de Amarin'e tanıklık etmiştir."
  id: "Bangunan ini dibangun oleh Qubad bin Fairuz; dibuka oleh Salman bin Rabi'ah Al-Bahili sebagai perjanjian damai demi keamanan darah, properti, dan tembok dengan syarat upeti dan pajak. Pembangunannya diperbarui oleh Abdul Aziz bin Hatim, dan menjadi lokasi Mutarkah dan Amarin."
