summary:
  ar: "أقصى أقسام بورما السفلى غربًا، بين سلسلة أراكان يوما وخليج البنغال. كانت مملكة مستقلة حتى سنة 1199هـ (1784م)، ثم صارت جزءًا من بورما، وارتبط تاريخها بالبنغال المسلمة ارتباطًا وثيقًا، وتولّى المسلمون فيها السلطة نحو عشرين عامًا بعد سنة 1103هـ (1692م) {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  en: "The most westerly division of Lower Burma, between the Arakan Yoma range and the Bay of Bengal. It was an independent kingdom until 1199/1784 and then became part of Burma; its history was closely bound up with that of Muslim Bengal, and from 1103/1692 Muslim soldiers held power in the capital for about twenty years {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
