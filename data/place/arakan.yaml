summary:
  ar: "أقصى أقسام بورما السفلى غربًا، بين سلسلة أراكان يوما وخليج البنغال. كانت مملكة مستقلة حتى سنة 1199هـ ⁦(1784م)⁩، ثم صارت جزءًا من بورما، وارتبط تاريخها بالبنغال المسلمة ارتباطًا وثيقًا، وتولّى المسلمون فيها السلطة نحو عشرين عامًا بعد سنة 1103هـ ⁦(1692م)⁩ {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  en: "The most westerly division of Lower Burma, between the Arakan Yoma range and the Bay of Bengal. It was an independent kingdom until 1199/1784 and then became part of Burma; its history was closely bound up with that of Muslim Bengal, and from 1103/1692 Muslim soldiers held power in the capital for about twenty years {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  es: "La división más occidental de la Baja Birmania, entre la cordillera Arakan Yoma y la bahía de Bengala. Fue un reino independiente hasta 1199/1784 y luego pasó a formar parte de Birmania; su historia estuvo estrechamente ligada a la de la Bengala musulmana, y desde 1103/1692 los soldados musulmanes detentaron el poder en la capital durante unos veinte años {cite:encyclopaedia-of-islam-2 vol. 1 p. 631}."
  fr: "La division la plus occidentale de la Basse-Birmanie, entre la chaîne de l'Arakan et le golfe du Bengale, fut un royaume indépendant jusqu'en 1199/1784, date à laquelle il fut intégré à la Birmanie. Son histoire est étroitement liée à celle du Bengale musulman, et de 1103 à 1692, des soldats musulmans exercèrent le pouvoir dans la capitale pendant une vingtaine d'années (voir: Encyclopaedia of Islam, vol. 1, p. 631)."
  ur: "اراکان یوما رینج اور خلیج بنگال کے درمیان زیریں برما کی سب سے مغربی تقسیم۔ یہ 1199/1784 تک ایک آزاد مملکت تھی اور پھر برما کا حصہ بن گئی۔ اس کی تاریخ مسلم بنگال کے ساتھ بہت قریب سے جڑی ہوئی تھی، اور 1103/1692 سے مسلمان سپاہیوں نے تقریباً بیس سال تک دارالحکومت میں اقتدار سنبھالا۔ 1 ص۔ 631}۔"
  tr: "Aşağı Burma'nın en batıdaki kısımları, bir zamanlar Arakan Sıradağları ile Bengal Körfezi arasında yer alır. 1199 Hicri'ye (1784 MS) kadar bağımsız bir krallıktı, ardından Burma'nın bir parçası oldu. Tarihi Müslüman Bengal ile yakından bağlantılıdır ve Müslümanlar 1103 Hicri (1692) sonrasında yaklaşık yirmi yıl boyunca burada hüküm sürmüştür. {atıf:Encyclopaedia-of-Islam-2 cilt 1, s. 631}."
  id: "Bagian paling barat Burma Bawah terletak di antara Pegunungan Arakan dan Teluk Bengal. Kerajaan ini merupakan kerajaan merdeka hingga tahun 1199 H (1784 M), kemudian menjadi bagian dari Burma. Sejarahnya sangat terkait dengan Bengal yang Muslim, dan Muslim memerintah di sana selama sekitar dua puluh tahun setelah 1103 H (1692 M) {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 631}."
