summary:
  ar: "مدينة حسنة كثيرة المياه صالحة المقدار، ويذكر المؤلف أنها تبعد شرقا نصف يوم عن كرنبي {cite:nuzhat-al-mushtaq-2002 p. 900}."
  en: "A fine city with abundant water and a reasonable size; the author gives half a day east of Karnabī {cite:nuzhat-al-mushtaq-2002 p. 900}."
  es: "Una ciudad hermosa con abundante agua y un tamaño razonable; el autor indica que está a medio día al este de Karnabī {cite:nuzhat-al-mushtaq-2002 p. 900}."
  fr: "Une belle ville avec de l'eau en abondance et une taille raisonnable; l'auteur indique une demi-journée à l'est de Karnabī {cite:nuzhat-al-mushtaq-2002 p. 900}."
  ur: "وافر پانی اور مناسب سائز کے ساتھ ایک عمدہ شہر؛ مصنف نے کرنبی کے مشرق میں آدھا دن بتایا ہے۔ 900}۔"
  tr: "Bol ve uygun suyu olan güzel bir şehir ve yazar, Karnabi'nin yarım gün doğusunda olduğunu belirtir {cite:Nuzhat-al-Mushtaq-2002, s. 900}."
  id: "Sebuah kota yang indah dengan air yang melimpah dan layak, dan penulis menyebutkan bahwa kota ini berjarak setengah hari di sebelah timur Karnabi {cite:Nuzhat-al-Mushtaq-2002, hlm. 900}."
