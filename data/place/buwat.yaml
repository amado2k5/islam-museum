summary:
  ar: "جبل من جبال جهينة مما يلي طريق الشام، بينه وبين المدينة نحو أربعة برد، وإليه خرج النبي لاعتراض عير قريش في ربيع الأول سنة 2هـ، وهو مع رضوى جبلان فرعان ⁦(الرحيق ص199 وحاشيته)⁩."
  en: "A mountain in Juhayna's country, on the side of the Syria road, about four barids from Medina. The Prophet went out to it in Rabi' al-Awwal of year 2 AH to intercept a Quraysh caravan. It and Radwa are two branch mountains (al-Raheeq, p. 199 and footnote)."
  es: "Una montaña en la región de Juhayna, junto al camino de Siria, a unos cuatro barids de Medina. El Profeta salió a ella en Rabi' al-Awwal del año 2 AH para interceptar una caravana de los Quraysh. Esta montaña y Radwa son dos montañas secundarias (al-Raheeq, pág. 199 y nota al pie)."
  fr: "Une montagne du pays de Juhayna, en bordure de la route de Syrie, à environ quatre barids de Médine. Le Prophète s'y rendit en Rabi' al-Awwal de l'an 2 de l'Hégire pour intercepter une caravane quraychite. Cette montagne et Radwa sont deux montagnes secondaires (al-Raheeq, p. 199 et note de bas de page)."
  ur: "ملک جہینہ کا ایک پہاڑ، شام کی سڑک کے کنارے، مدینہ سے چار بار کے فاصلے پر۔ رسول اللہ ربیع الاول سنہ 2 ہجری میں قریش کے ایک قافلے کو روکنے کے لیے اس کی طرف نکلے۔ یہ اور ردوا دو شاخیں پہاڑ ہیں ⁦(الرحیق، صفحہ 199 اور حاشیہ)⁩۔"
