summary:
  ar: "جبل ليس بالكبير تحيط به المفاوز، وفي وسطه مثل الساحة، ويُذكر أن الأودية فيه بعيدة عن العمارة وفيها للصوص أموال. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  en: "A small mountain surrounded by desert, with a flat open space at its centre; al-Idrisi says the robbers of the area hide their gains there. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  es: "Una pequeña montaña rodeada de desierto, con una llanura abierta en su centro; al-Idrisi afirma que los ladrones de la zona esconden allí sus ganancias. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  fr: "Une petite montagne entourée de désert, avec une plaine ouverte en son centre; selon al-Idrisi, les brigands de la région y cachent leur butin. {cite:nuzhat-al-mushtaq-2002 p. 443}"
  ur: "صحرا سے گھرا ہوا ایک چھوٹا سا پہاڑ، جس کے مرکز میں ایک ہموار کھلی جگہ ہے۔ الادریسی کا کہنا ہے کہ علاقے کے ڈاکو وہاں اپنی کمائی چھپاتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 443}"
  tr: "Büyük olmayan bir dağ, el-Mafaz ile çevrilidir ve ortasında bir avlu gibi yer alır. Oradaki vadilerin mimariden uzak olduğu ve hırsızların orada parası olduğu belirtilir. {alıntı:nuzhat-al-mushtaq-2002 s. 443}"
  id: "Sebuah gunung yang tidak besar dikelilingi oleh al-Mafaz, dan di tengahnya seperti halaman. Disebutkan bahwa lembah-lembah di sana jauh dari arsitektur dan para pencuri memiliki uang di sana. {cite:Nuzhat-al-Mushtaq-2002 hlm. 443}"
