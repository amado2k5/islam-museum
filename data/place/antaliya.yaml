summary:
  ar: "أنطالية الجديدة، وهي مدينة قليلة العامر، وكانت قبل ذلك مدينة عامرة، وبينها وبين المدينة القديمة يومان. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  en: "New Antalya, a sparsely settled town that was once a populous city; two days from the old one. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  es: "Nueva Antalya, una ciudad escasamente poblada que antaño fue una metrópolis populosa; a dos días de la antigua. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  fr: "Nouvelle Antalya, ville peu peuplée qui fut jadis une cité florissante; à deux jours de l’ancienne. {cite:nuzhat-al-mushtaq-2002 p. 647}"
  ur: "نیو انطالیہ، ایک بہت کم آباد شہر جو کبھی ایک آبادی والا شہر تھا۔ پرانے سے دو دن. {حوالہ: نزہت المشتاق-2002 ص۔ 647}"
  tr: "Yeni Antalya, daha önce hareketli bir şehir olan seyrek nüfuslu bir şehirdir ve eski şehirle birlikte iki günü kalır. {kaynak:nuzhat-al-mushtaq-2002 s. 647}"
  id: "New Antalya adalah kota yang jarang penduduknya yang sebelumnya merupakan kota yang ramai, dan hanya tinggal dua hari lagi bersama kota lama. {cite:nuzhat-al-mushtaq-2002 hlm. 647}"
