summary:
  ar: "بربشتر قصبة بلد برطانية تقرب من سرقسطة، تغلب عليها جيش الأردمانيين سنة ست وخمسين وأربعمائة بعد حصر أربعين يوماً وانهيار قناة الماء، فجرت فيها من الفتك والسبي أهوال نقلها ابن حيان حتى قال إنه لم يُشهد للمسلمين مثلها قط فيما مضى من الزمان، ثم استرجعها أحمد المقتدر بن هود في جمادى الأولى سنة ٤٥٧ وقتل من الكافرين فيها نحو ألف فارس وخمسة آلاف راجل {cite:nafh-tib-maqqari p. 449-454}."
  en: "Barbastro, chief town of the Burṭāniya country near Zaragoza; stormed by the Nordmanni host in 456 after forty days when its water channel collapsed — a massacre Ibn Hayyan said Muslims had never seen the like of — then retaken by Ahmad al-Muqtadir ibn Hud in Jumada I 457 {cite:nafh-tib-maqqari p. 449-454}."
