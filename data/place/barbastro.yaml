summary:
  ar: "بربشتر قصبة بلد برطانية تقرب من سرقسطة، تغلب عليها جيش الأردمانيين سنة ست وخمسين وأربعمائة بعد حصر أربعين يوماً وانهيار قناة الماء، فجرت فيها من الفتك والسبي أهوال نقلها ابن حيان حتى قال إنه لم يُشهد للمسلمين مثلها قط فيما مضى من الزمان، ثم استرجعها أحمد المقتدر بن هود في جمادى الأولى سنة ٤٥٧ وقتل من الكافرين فيها نحو ألف فارس وخمسة آلاف راجل {cite:nafh-tib-maqqari p. 449-454}."
  en: "Barbastro, chief town of the Burṭāniya country near Zaragoza; stormed by the Nordmanni host in 456 after forty days when its water channel collapsed — a massacre Ibn Hayyan said Muslims had never seen the like of — then retaken by Ahmad al-Muqtadir ibn Hud in Jumada I 457 {cite:nafh-tib-maqqari p. 449-454}."
  es: "Barbastro, la ciudad principal del país de Burṭāniya cerca de Zaragoza; asaltada por el ejército de Nordmanni en 456 después de cuarenta días cuando se derrumbó su canal de agua —una masacre que Ibn Hayyan dijo que los musulmanes nunca habían visto igual— luego retomada por Ahmad al-Muqtadir ibn Hud en Jumada I 457 {cite:nafh-tib-maqqari p. 449-454}."
  fr: "Barbastro, ville principale du pays Burṭāniya près de Saragosse; prise d'assaut par l'armée Nordmanni en 456 après quarante jours lorsque son canal d'eau s'est effondré — un massacre dont Ibn Hayyan a dit que les musulmans n'avaient jamais vu de pareil — puis reprise par Ahmad al-Muqtadir ibn Hud en Jumada I 457 {cite:nafh-tib-maqqari p. 449-454}."
  ur: "بارباسٹرو، زارگوزا کے قریب برطانیہ ملک کا اہم قصبہ؛ 456 میں نورڈمنی کے میزبان نے چالیس دن کے بعد حملہ کیا جب اس کا پانی کا نالہ ٹوٹ گیا - ایک قتل عام ابن حیان نے کہا کہ مسلمانوں نے ایسا کبھی نہیں دیکھا تھا - پھر احمد المقتدیر ابن ہود نے جمعہ اول 457 میں دوبارہ حاصل کیا۔ 449-454}۔"
  tr: "Barbiştar, Zaragoza yakınlarında bir İngiliz kasabasıdır. 456 Hicri yılında, kırk gün ve su kanalının çöküşünden sonra Ardmanlı ordu tarafından ele geçirilmiştir. Yıkım ve esaret korkularıyla doluydu; İbn Hayyan geçmişte Müslümanlar için böyle bir şey görmediğini bildirmiştir. Sonra Ahmed el-Muktadir bin Hud, 457 yılında Cumade'l-Avval'da şehri geri almış, yaklaşık bin süvari ve beş bin piyadeyi öldürmüştür {cite:nafh-tib-maqqari s. 449-454}."
  id: "Barbishtar adalah sebuah kota Inggris dekat Zaragoza. Kota ini direbut oleh pasukan Ardman pada tahun 456 H setelah empat puluh hari dan runtuhnya kanal air. Kota ini dipenuhi dengan kengerian kehancuran dan penahanan, dilaporkan oleh Ibn Hayyan bahwa ia belum pernah menyaksikan hal seperti itu bagi umat Muslim sebelumnya. Kemudian Ahmad al-Muqtadir ibn Hud merebutnya kembali pada Jumada al-Awwal 457, membunuh sekitar seribu penunggang kuda dan lima ribu infanteri di antara kafir {cite:nafh-tib-maqqari hlm. 449-454}."
