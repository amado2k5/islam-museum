summary:
  ar: "نهر المرأة من كور دجلة؛ فتح قصره شريح بن عامر صلحاً صالحه عنه النوشجان بن جسنسما والمرأة صاحبة القصر كامن دار بنت نرسى ابنة عم النوشجان وإنما سمي لأن أبا موسى الأشعري نزل بها فزودته خبيصاً فجعل يقول أطعمونا من دقيق المرأة."
  en: "The Woman's Canal of the Tigris districts; Shurayh ibn Amir took its palace by treaty from al-Nushajan ibn Jasnasima — the 'woman' its lady Kamandar bint Narsi, al-Nushajan's cousin — and it was named because Abu Musa al-Ash'ari lodged there, she provisioned him khabis, and he kept saying 'feed us the woman's flour'."
