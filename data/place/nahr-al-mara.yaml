summary:
  ar: "نهر المرأة من كور دجلة؛ فتح قصره شريح بن عامر صلحاً صالحه عنه النوشجان بن جسنسما والمرأة صاحبة القصر كامن دار بنت نرسى ابنة عم النوشجان وإنما سمي لأن أبا موسى الأشعري نزل بها فزودته خبيصاً فجعل يقول أطعمونا من دقيق المرأة."
  en: "The Woman's Canal of the Tigris districts; Shurayh ibn Amir took its palace by treaty from al-Nushajan ibn Jasnasima — the 'woman' its lady Kamandar bint Narsi, al-Nushajan's cousin — and it was named because Abu Musa al-Ash'ari lodged there, she provisioned him khabis, and he kept saying 'feed us the woman's flour'."
  es: "El Canal de la Mujer de los distritos del Tigris; Shurayh ibn Amir tomó su palacio por tratado de al-Nushajan ibn Jasnasima —la 'mujer' su señora Kamandar bint Narsi, prima de al-Nushajan— y fue nombrado así porque Abu Musa al-Ash'ari se hospedó allí, ella le proporcionó khabis, y él no dejaba de decir 'danos de comer la harina de la mujer'."
  fr: "Le Canal des Femmes des districts du Tigre; Shurayh ibn Amir prit son palais par traité à al-Nushajan ibn Jasnasima — la « femme » étant sa dame Kamandar bint Narsi, la cousine d'al-Nushajan — et il fut nommé ainsi parce qu'Abu Musa al-Ash'ari y logea, elle lui fournit du khabis, et il ne cessait de dire « donnez-nous la farine de la femme »."
  ur: "دجلہ کے اضلاع کی خواتین کی نہر؛ شریح ابن عامر نے اس کا محل النشاجان بن جسنسیمہ سے معاہدہ کے ذریعے لیا - یہ 'عورت' اس کی خاتون کمندر بنت نرسی، النشاجان کی کزن تھی - اور اس کا نام اس لیے رکھا گیا کہ ابو موسیٰ اشعری وہاں مقیم تھے، اس نے اسے خبیث مہیا کیا، اور وہ عورت کو کھلایا کہتا رہا۔"
  tr: "Dicle Nehri'nden Al-Mara Nehri; sarayı Şurayh bin Amir tarafından fethedildi, onun adına barış yaptı ve barıştı. Sarayın sahibi kadın, Al-Nushjan'ın kuzeni Dar bint Narsa'ya benziyordu. Abu Musa al-Ash'ari orada kaldığı için adı verildi ve ona bir demet sağladı, bu yüzden Ebu Musa el-Eş'ari ona bir demet sağladı, bu yüzden Emir sürekli 'Kadının unundan besle bize.' dedi."
  id: "Sungai Al-Mara dari Sungai Tigris; istananya ditaklukkan oleh Shurayh bin Amir, yang berdamai atas namanya dan berdamai atas namanya. Wanita pemilik istana itu seperti Dar bint Narsa, sepupu Al-Nushjan. Istana ini dinamai karena Abu Musa al-Ash'ari tinggal di sana, dan dia memberinya seikat, sehingga dia terus berkata, 'Beri kami makan dari tepung wanita itu.'"
