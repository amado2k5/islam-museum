label: { ar: "البطائح", en: "the Bata'ih (Great Swamp)", es: "el Bata'ih (Gran Pantano)", fr: "le Bata'ih (Grand Marais)" }
summary:
  ar: "أرض سبخة مائية واسعة في أسفل العراق؛ عند البلاذري حدثت بعد الهجرة إذ انبثقت بثوق عظام عجز كسرى أبرويز عن سدها وفاضت الأنهار ثم اتسعت أيام محاربة المسلمين الأعاجم لبثوق لم يعن أحد بسدها واستخرج منها عبد الله بن دراج لمعاوية أرضين بلغت غلتها خمسة آلاف ألف واستخرج حسان النبطي للحجاج ولهشام بن عبد الملك أرضين منها وكان بكسكر قبل حدوثها نهر الجب وطريق البريد إلى ميسان فلما تبطحت سمي ما استاجم من شق طريق البريد آجام البريد والشق الآخر آجام أغمر بثي وأهدى محمد بن القاسم إلى الحجاج فيلاً من السند فأجيز البطائح في سفينة فسميت مشرعة الفيل وفُرضة الفيل وأغرق الحجاج بعضها إذ انفجرت بثوق لم يعن سدها مضارة للدهاقين لاتهامه إياهم بممالأة ابن الأشعث."
  en: "A vast marshland in lower Iraq; in al-Baladhuri it formed after the Hijra when great breaches burst that Khosrow Aparviz could not dam, then widened during the Muslim-Persian wars. Abdallah ibn Darraj reclaimed lands there for Mu'awiya yielding five million, and Hassan al-Nabati reclaimed lands for al-Hajjaj and Hisham. Before it formed, Kaskar had the Jubb river and the barid road to Maysan — when swamped, its flooded tracts were named the Barid marshes and Aghmar Bithi marshes. Muhammad ibn al-Qasim's gift elephant to al-Hajjaj crossed it by ship, whence the landing called Musharra'at al-Fil. Al-Hajjaj let breaches drown it to spite the dihqans he accused of favoring Ibn al-Ash'ath."
  es: "Una vasta zona pantanosa en el bajo Irak; en al-Baladhuri se formó después de la Hégira cuando se abrieron grandes brechas que Khosrow Aparviz no pudo represar, y luego se ensanchó durante las guerras musulmán-persas. Abdallah ibn Darraj recuperó tierras allí para Mu'awiya, obteniendo cinco millones, y Hassan al-Nabati recuperó tierras para al-Hajjaj e Hisham. Antes de su formación, Kaskar tenía el río Jubb y el camino de Barid a Maysan; cuando se inundó, sus extensiones anegadas se denominaron marismas de Barid y marismas de Aghmar Bithi. El elefante que Muhammad ibn al-Qasim regaló a al-Hajjaj la cruzó en barco, de ahí que el desembarcadero se llamara Musharra'at al-Fil. Al-Hajjaj dejó que las brechas la inundaran para vengarse de los dihqans a quienes acusaba de favorecer a Ibn al-Ash'ath."
  fr: "Vaste zone marécageuse du Bas-Irak, la région d'al-Baladhuri se forma après l'Hégire, suite à l'ouverture de grandes brèches que Khosrow Aparviz ne put endiguer. Elle s'élargit ensuite durant les guerres perses-musulmanes. Abdallah ibn Darraj y fit gagner des terres pour Mu'awiya, rapportant cinq millions de shillings, et Hassan al-Nabati fit de même pour al-Hajjaj et Hisham. Avant sa formation, Kaskar était traversée par le fleuve Jubb et la route de Barid menant à Maysan. Inondées, ses zones submergées furent nommées marais de Barid et marais d'Aghmar Bithi. L'éléphant offert en cadeau à al-Hajjaj par Muhammad ibn al-Qasim traversa la région par bateau, donnant ainsi naissance au lieu de débarquement appelé Musharra'at al-Fil. Al-Hajjaj laissa les brèches l'inonder pour narguer les dihqans qu'il accusait de favoriser Ibn al-Ash'ath."
