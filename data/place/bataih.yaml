label: { ar: "البطائح", en: "the Bata'ih (Great Swamp)" }
summary:
  ar: "أرض سبخة مائية واسعة في أسفل العراق؛ عند البلاذري حدثت بعد الهجرة إذ انبثقت بثوق عظام عجز كسرى أبرويز عن سدها وفاضت الأنهار ثم اتسعت أيام محاربة المسلمين الأعاجم لبثوق لم يعن أحد بسدها واستخرج منها عبد الله بن دراج لمعاوية أرضين بلغت غلتها خمسة آلاف ألف واستخرج حسان النبطي للحجاج ولهشام بن عبد الملك أرضين منها وكان بكسكر قبل حدوثها نهر الجب وطريق البريد إلى ميسان فلما تبطحت سمي ما استاجم من شق طريق البريد آجام البريد والشق الآخر آجام أغمر بثي وأهدى محمد بن القاسم إلى الحجاج فيلاً من السند فأجيز البطائح في سفينة فسميت مشرعة الفيل وفُرضة الفيل وأغرق الحجاج بعضها إذ انفجرت بثوق لم يعن سدها مضارة للدهاقين لاتهامه إياهم بممالأة ابن الأشعث."
  en: "A vast marshland in lower Iraq; in al-Baladhuri it formed after the Hijra when great breaches burst that Khosrow Aparviz could not dam, then widened during the Muslim-Persian wars. Abdallah ibn Darraj reclaimed lands there for Mu'awiya yielding five million, and Hassan al-Nabati reclaimed lands for al-Hajjaj and Hisham. Before it formed, Kaskar had the Jubb river and the barid road to Maysan — when swamped, its flooded tracts were named the Barid marshes and Aghmar Bithi marshes. Muhammad ibn al-Qasim's gift elephant to al-Hajjaj crossed it by ship, whence the landing called Musharra'at al-Fil. Al-Hajjaj let breaches drown it to spite the dihqans he accused of favoring Ibn al-Ash'ath."
