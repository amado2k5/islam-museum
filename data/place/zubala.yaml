summary:
  ar: "كانت مدينة فيما مضى، ولم تبق اليوم مدينة ولا حصن، وإنما هي موضع يأوي إليه المسافرون في طريق الحجاز. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  en: "Once a town, now neither a city nor a fortress; a halt where travellers on the Hijaz road rest. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  es: "Lo que antes fue un pueblo, ahora ni ciudad ni fortaleza; una parada donde descansan los viajeros en la ruta del Hiyaz. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  fr: "Autrefois bourgade, aujourd'hui ni ville ni forteresse; une halte où se reposent les voyageurs sur la route du Hedjaz. {cite:nuzhat-al-mushtaq-2002 p. 381}"
  ur: "کبھی شہر تھا، اب نہ شہر ہے نہ قلعہ۔ ایک جگہ جہاں حجاز روڈ پر مسافر آرام کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 381}"
  tr: "Bir zamanlar şehirdi, bugün artık şehir ya da kale değil; daha çok Hicaz güzergahında yolcuların sığındığı bir yerdir. {cite:nuzhat-al-mushtaq-2002 s. 381}"
  id: "Dulunya kota ini adalah kota, dan kini bukan lagi kota atau benteng; melainkan, tempat di mana para pelancong berlindung di rute Hijaz. {cite:nuzhat-al-mushtaq-2002 hlm. 381}"
