label: { ar: "قبر هود بالأحقاف", en: "The tomb of Hud at the Ahqaf", es: "La tumba de Hud en Ahqaf", fr: "Le tombeau de Hud à l'Ahqaf", ur: "احقاف میں ہود کی قبر" }
summary:
  ar: "قبر يزوره أهل حضرموت ومهرة في كل وقت؛ يصفه الهمداني بأنه في الكثيب الأحمر منه في كهف مشرف، في أسفل وادي الأحقاف الواصل من بلد حضرموت إلى بلد مهرة مسيرة أيام {cite:sifat-jazirat-al-arab p. 70}."
  en: "A tomb visited continually by the people of Hadramawt and Mahra — al-Hamdani places it in the red sand-hill within an overlooking cave, at the lower end of the Ahqaf valley that runs from Hadramawt toward Mahra country over days' march {cite:sifat-jazirat-al-arab p. 70}."
  es: "Una tumba visitada continuamente por la gente de Hadramawt y Mahra: al-Hamdani la sitúa en la colina de arena roja dentro de una cueva con vistas, en el extremo inferior del valle de Ahqaf que se extiende desde Hadramawt hacia el país de Mahra a lo largo de varios días de marcha {cite:sifat-jazirat-al-arab p. 70}."
  fr: "Un tombeau visité continuellement par les habitants du Hadramawt et de Mahra — al-Hamdani le situe dans la colline de sable rouge à l'intérieur d'une grotte surplombant, à l'extrémité inférieure de la vallée d'Ahqaf qui s'étend du Hadramawt vers le pays de Mahra sur plusieurs jours de marche {cite:sifat-jazirat-al-arab p. 70}."
  ur: "ایک مقبرہ جسے حضرموت اور مہرہ کے لوگ مسلسل دیکھتے رہتے ہیں - الحمدانی اسے سرخ ریت کی پہاڑی میں ایک نظر آنے والے غار کے اندر، وادی احقاف کے نچلے سرے پر رکھتا ہے جو کہ حضرموت سے مہرہ ملک کی طرف کئی دنوں کے مارچ میں چلتی ہے۔ 70}۔"
