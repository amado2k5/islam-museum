summary:
  ar: "مدينة كبيرة في وطاء من الأرض، حسنة الجهات متصلة العمارات، كبيرة الأسواق، وهي عند المؤلف متوسطة أرض إفريزية، وتبعد عن أستريك غربا ثمانين ميلا {cite:nuzhat-al-mushtaq-2002 p. 879}."
  en: "A large city on low ground, with well-set quarters and busy markets, which the author places at the centre of the land of the Frisians, eighty miles west of Astrik {cite:nuzhat-al-mushtaq-2002 p. 879}."
  es: "Una gran ciudad en terreno bajo, con barrios bien establecidos y mercados bulliciosos, que el autor sitúa en el centro de la tierra de los frisones, a ochenta millas al oeste de Astrik {cite:nuzhat-al-mushtaq-2002 p. 879}."
  fr: "Une grande ville en plaine, avec des quartiers bien agencés et des marchés animés, que l'auteur place au centre du pays des Frisons, à quatre-vingts milles à l'ouest d'Astrik {cite:nuzhat-al-mushtaq-2002 p. 879}."
  ur: "نچلی زمین پر ایک بڑا شہر، جس میں اچھی طرح سے کوارٹر اور مصروف بازار ہیں، جسے مصنف نے آسٹریک سے اسّی میل مغرب میں، فریسیوں کی سرزمین کے مرکز میں رکھا ہے۔ 879}۔"
  tr: "Düz bir yüzeyde büyük bir şehir, güzel yanları, birbirine bağlı binaları, büyük pazarları var ve yazara göre, Astirik'in seksen mil batısında yer alan Frizya topraklarının orta bir arazisidir {cite:nuzhat-al-mushtaq-2002, s. 879}."
  id: "Sebuah kota besar di permukaan datar, dengan sisi-sisi yang indah, bangunan yang saling terhubung, pasar besar, dan menurut penulis, kota ini merupakan tanah tengah dari tanah Frisia, terletak delapan puluh mil di sebelah barat Astirik {cite:nuzhat-al-mushtaq-2002, hlm. 879}."
