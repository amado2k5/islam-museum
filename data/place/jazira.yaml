summary:
  ar: "الجزيرة الفراتية إقليم ما بين الفرات ودجلة؛ فتحها إياد بن غنم بعد وفاة أبي عبيدة — «الجزيرة كلها فتوح إياد بن غنم» عند ميمون بن مهران — خرج إليها للنصف من شعبان سنة 18 في خمسة آلاف؛ ومن مدنها الرها وحرّان والرقة ونصيبين وسنجار والموصل وكورة دجلة، وصارت مع الشام ميدان غزو الصوائف والشواتي على الروم."
  en: "The Euphratean Jazira, the land between the Euphrates and the Tigris; conquered by Iyad ibn Ghanm after Abu Ubayda's death — 'the whole Jazira is Iyad ibn Ghanm's conquest' in Maymun ibn Mihran's words — marching for it mid-Sha'ban year 18 in five thousand; its cities include al-Ruha, Harran, al-Raqqa, Nasibin, Sinjar, Mosul and the Tigris kuwar, and with Syria it became the field of the summer and winter raids on the Byzantines."
