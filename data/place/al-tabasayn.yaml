summary:
  ar: "الطبسين حصنان يقال لأحدهما طبس وللآخر قرين وهما جرم فيهما نخل وهما باب خراسان؛ بلغهما عبد الله بن بديل بن ورقاء الخزاعي غازياً من قبل أبي موسى فأصاب مغنماً وأتى قوم من أهلهما عمر فصالحوه على ستين ألفاً ويقال خمسة وسبعين ألفاً وكتب لهم كتاباً وأقر صلحهما عبد الله بن عامر لما غزا خراسان."
  en: "al-Tabasayn — the twin fortresses Tabas and Qurayn, a palm-bearing jurm that is the gate of Khurasan; raided by Abdallah ibn Budayl for Abu Musa, then truced before Umar at sixty or seventy-five thousand under a writ, a peace Ibn Amir confirmed when he marched on Khurasan."
