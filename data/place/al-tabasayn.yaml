summary:
  ar: "الطبسين حصنان يقال لأحدهما طبس وللآخر قرين وهما جرم فيهما نخل وهما باب خراسان؛ بلغهما عبد الله بن بديل بن ورقاء الخزاعي غازياً من قبل أبي موسى فأصاب مغنماً وأتى قوم من أهلهما عمر فصالحوه على ستين ألفاً ويقال خمسة وسبعين ألفاً وكتب لهم كتاباً وأقر صلحهما عبد الله بن عامر لما غزا خراسان."
  en: "al-Tabasayn — the twin fortresses Tabas and Qurayn, a palm-bearing jurm that is the gate of Khurasan; raided by Abdallah ibn Budayl for Abu Musa, then truced before Umar at sixty or seventy-five thousand under a writ, a peace Ibn Amir confirmed when he marched on Khurasan."
  es: "al-Tabasayn — las fortalezas gemelas de Tabas y Qurayn, un jurm con palmeras que es la puerta de Jorasán; saqueada por Abdallah ibn Budayl para Abu Musa, luego se firmó una tregua ante Umar por sesenta o setenta y cinco mil hombres bajo un edicto, una paz que Ibn Amir confirmó cuando marchó sobre Jorasán."
  fr: "al-Tabasayn — les forteresses jumelles de Tabas et Qurayn, un jurm orné de palmiers qui est la porte du Khorasan; pillées par Abdallah ibn Budayl pour Abu Musa, puis une trêve fut conclue devant Umar à soixante ou soixante-quinze mille hommes sous un mandat, une paix qu'Ibn Amir confirma lorsqu'il marcha sur le Khorasan."
  ur: "التباسین - جڑواں قلعے طبس اور قرائن، ایک کھجور والا جورم جو خراسان کا دروازہ ہے۔ عبداللہ ابن بدیل نے ابو موسیٰ کے لیے چھاپہ مارا، پھر ایک رٹ کے تحت عمر کے سامنے پینسٹھ یا پچھتر ہزار پر صلح کی، ایک امن ابن عامر نے تصدیق کی جب اس نے خراسان پر چڑھائی کی۔"
