summary:
  ar: "مدينة وجزيرة على ساحل المغرب الأقصى، يروي الإدريسي قصة تسميتها عن المغررين الذين أسقطوا إليها بمراكبهم، ويذكر قصة أحمد بن عمر المعروف بدقم الإوز، الذي كان على جملة من أسطول يوسف بن تاشفين. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  en: "A town and island on the Atlantic coast of the far Maghreb. Al-Idrisi relates its name through the story of sailors who landed there, and of Ahmad ibn Umar, known as Daqam al-Iwwaz, who had charge of part of Yusuf ibn Tashfin's fleet. {cite:nuzhat-al-mushtaq-2002 p. 220}"
