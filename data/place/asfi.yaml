summary:
  ar: "مدينة وجزيرة على ساحل المغرب الأقصى، يروي الإدريسي قصة تسميتها عن المغررين الذين أسقطوا إليها بمراكبهم، ويذكر قصة أحمد بن عمر المعروف بدقم الإوز، الذي كان على جملة من أسطول يوسف بن تاشفين. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  en: "A town and island on the Atlantic coast of the far Maghreb. Al-Idrisi relates its name through the story of sailors who landed there, and of Ahmad ibn Umar, known as Daqam al-Iwwaz, who had charge of part of Yusuf ibn Tashfin's fleet. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  es: "Un pueblo e isla en la costa atlántica del Magreb lejano. Al-Idrisi relata su nombre a través de la historia de los marineros que desembarcaron allí y de Ahmad ibn Umar, conocido como Daqam al-Iwwaz, quien estuvo al mando de parte de la flota de Yusuf ibn Tashfin. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  fr: "Une ville et une île de la côte atlantique du Maghreb lointain. Al-Idrisi relate son nom à travers l'histoire de marins qui y ont débarqué, et d'Ahmad ibn Umar, connu sous le nom de Daqam al-Iwwaz, qui commandait une partie de la flotte de Yusuf ibn Tashfin. {cite:nuzhat-al-mushtaq-2002 p. 220}"
  ur: "دور مغرب کے بحر اوقیانوس کے ساحل پر ایک قصبہ اور جزیرہ۔ الادریسی نے اس کا نام ملاحوں کی کہانی کے ذریعے بیان کیا ہے جو وہاں اترے تھے، اور احمد بن عمر، جسے دقم الاعواز کے نام سے جانا جاتا ہے، جو یوسف بن تاشفین کے بحری بیڑے کے کچھ حصے کا ذمہ دار تھا۔ {حوالہ: نزہت المشتاق-2002 ص۔ 220}"
  tr: "Fas kıyısında yer alan bir şehir ve ada olan Al-Idrisi, adını aldatıcıların tekneleriyle oraya indiği hikayeyi anlatır ve Yusuf ibn Tashfin'in filosunda yer alan Ahmad ibn Umar'ın, yani Kazların Dükmü'nün hikayesini anlatır. {cite:nuzhat-al-mushtaq-2002 s. 220}"
  id: "Sebuah kota dan pulau di pesisir Maroko, Al-Idrisi menceritakan kisah namanya tentang para penipu yang mendarat di sana dengan perahu mereka, dan ia menceritakan kisah Ahmad ibn Umar, yang dikenal sebagai Duqm Angsa, yang merupakan bagian dari armada Yusuf ibn Tashfin. {cite:Nuzhat-al-Mushtaq-2002 hlm. 220}"
