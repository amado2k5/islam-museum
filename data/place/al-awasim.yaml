label:
  ar: "العواصم"
  en: "Al-'Awasim (the Syrian frontier zone)"
summary:
  ar: "اسم الجزء من المنطقة الحدودية بين الدولة البيزنطية ودولة الخلافة في شمال شرق سوريا، وتُسمى حصونها الأمامية الثغور، والحصون الخلفية «العواصم» أي الحافظات. وفي عهد هارون الرشيد سنة 170هـ (786م) فُصلت حصونها عن جند قنسرين، ثم صارت ولاية، وكانت أنطاكية أكبر مدنها في القرن العاشر الميلادي {cite:encyclopaedia-of-islam-2 vol. 1 p. 810}."
  en: "The part of the frontier zone between the Byzantine Empire and the Caliphate in the north and north-east of Syria. Its forward strongholds were the thughur, and those further behind were the 'awasim, 'the protectresses'. In 170 AH (786) Harun al-Rashid detached its strongholds from the djund of Kinnasrin, and in the tenth century Antioch was its capital {cite:encyclopaedia-of-islam-2 vol. 1 p. 810}."
