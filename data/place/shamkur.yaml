label: { ar: "شمكور ⁦(المتوكلية)⁩", en: "Shamkur (al-Mutawakkiliyya)", es: "Shamkur (al-Mutawakkiliyya)", fr: "Shamkur (al-Mutawakkiliyya)", ur: "شمکور ⁦(المتوکلیہ)⁩", tr: "Şamkur (Al-Mutawakkiliya)", id: "Shamkur (Al-Mutawakkiliya)" }
summary:
  ar: "مدينة قديمة بأران فتحها رجل سلمان بن ربيعة وأخربتها الساوردية ثم عمّرها بُغا مولى المعتصم سنة 240 وسكنها قوماً من الخزر مستأمنين راغبين في الإسلام ونقل إليها تجار برذعة وسماها المتوكلية."
  en: "an ancient city of Arran taken by Salman's man, ruined by the Sawardiyya, then rebuilt by Bugha mawla of al-Mu'tasim in year 240, peopled with safe-conducted Khazars desiring Islam and Bardha'a's transferred merchants, and renamed al-Mutawakkiliyya."
  es: "una antigua ciudad de Arran tomada por el hombre de Salman, arruinada por Sawardiyya, luego reconstruida por Bugha mawla de al-Mu'tasim en el año 240, poblada de jázaros salvoconducidos que deseaban el Islam y comerciantes transferidos de Bardha'a, y rebautizada como al-Mutawakkiliyya."
  fr: "une ancienne ville d'Arran prise par l'homme de Salman, ruinée par les Sawardiyya, puis reconstruite par Bugha mawla d'al-Mu'tasim en l'an 240, peuplée de Khazars saufs désireux de l'Islam et de marchands transférés de Bardha'a, et rebaptisée al-Mutawakkiliyya."
  ur: "ارران کا ایک قدیم شہر جسے سلمان کے آدمی نے لے لیا، سواردیہ نے تباہ کر دیا، پھر المعتصم کے بوغہ مولا نے سن 240 میں دوبارہ تعمیر کیا، اسلام اور بردعہ کے منتقل شدہ تاجروں کے خواہش مند محفوظ خزروں کے ساتھ آباد، اور المتوکلیہ کا نام تبدیل کر دیا۔"
  tr: "Selman bin Rabi'ah'ın adamları tarafından fethedilmiş, Savardiya'lar tarafından yıkılmış ve 240 Hicri yılında el-Mu'tasim'in özgür kölesi Bugha tarafından inşa edilen Aran'da eski bir şehirdir. Burada güvenlik arayan ve İslam'ı arzulayan bir grup Hazar yaşamıştır. Bardha'a'dan tüccarlar buraya taşınmış ve Al-Mutawakkiliya adını vermiştir."
  id: "Sebuah kota tua di Aran yang ditaklukkan oleh orang-orang Salman ibn Rabi'ah, dihancurkan oleh Savardiya, lalu dibangun oleh Bugha, budak yang dibebaskan dari al-Mu'tasim, pada tahun 240 H. Kota ini dihuni oleh sekelompok Khazar yang mencari perlindungan dan menginginkan Islam. Para pedagang dari Bardha'a memindahkannya dan menamainya Al-Mutawakkiliya."
