label: { ar: "جيرون بدمشق", en: "Jirun of Damascus", es: "Jirun de Damasco", fr: "Jirun de Damas", ur: "دمشق کا جیرون", tr: "Şam'da Jeroun", id: "Jeroun di Damaskus" }
summary:
  ar: "هيكل عظيم البنيان في مدينة دمشق يعرف بجيرون بناه جيرون بن سعد العادي ونقل إليه عمد الرخام، وقيل إنه إرم ذات العماد المذكورة في القرآن، وذكر عن كعب الأحبار حين دخل على معاوية بن أبي سفيان فسأله عن خبرها فوصف عجيب بنيانها من الذهب والفضة والمسك والزعفران وأنه يدخلها أعرابي يتيه له جملان فيخرج في طلبهما فيقع إليها، ثم التفت كعب في مجلس معاوية فقال هذا هو الرجل وكان الأعرابي قد دخلها يطلب ما ندّ من إبله فأجاز معاوية كعباً، وقال المسعودي إن كان هذا الخبر عن كعب حقاً فهو حسن وهو خبر يدخله الفساد من جهات من النقل وهو من صنعة القصاص، وقد تنازع الناس في هذه المدينة وأين هي {cite:muruj-al-dhahab p. 554-555}."
  en: "Damascus's great temple, said to be Jayrun ibn Sa'd al-'Adi's marble-pillared building and by some Iram dhat al-'Imad — Ka'b al-Ahbar's famous verification before Mu'awiya of the strayed-camels Bedouin; al-Mas'udi notes the report is corrupted in transmission and is storytellers' craft {cite:muruj-al-dhahab p. 554-555}."
  es: "El gran templo de Damasco, que se dice que es el edificio con columnas de mármol de Jayrun ibn Sa'd al-'Adi y por algunos Iram dhat al-'Imad — la famosa verificación de Ka'b al-Ahbar ante Mu'awiya de los beduinos descarriados; al-Mas'udi señala que el informe se corrompe en la transmisión y es un oficio de narradores {cite:muruj-al-dhahab p. 554-555}."
  fr: "Le grand temple de Damas, que l'on dit être l'édifice aux colonnes de marbre de Jayrun ibn Sa'd al-'Adi et selon certains Iram dhat al-'Imad — la célèbre vérification de Ka'b al-Ahbar devant Mu'awiya du Bédouin aux chameaux égarés; al-Mas'udi note que le rapport est corrompu dans la transmission et qu'il s'agit d'un art de conteurs {cite:muruj-al-dhahab p. 554-555}."
  ur: "دمشق کا عظیم معبد، جسے جیرون بن سعد العدی کی سنگ مرمر سے بنی عمارت کہا جاتا ہے اور بعض ارم دات العماد - کعب الاحبار کی معاویہ سے پہلے بھٹکے ہوئے اونٹ بدوین کی مشہور تصدیق؛ المسعودی نے نوٹ کیا کہ رپورٹ ٹرانسمیشن میں خراب ہے اور کہانی سنانے والوں کا ہنر ہے 554-555}۔"
  tr: "Şam şehrinde Jiron ibn Sa'd al-'Aadi tarafından inşa edilen büyük bir tapınak olan Jirun adlı büyük bir tapınak, mermer sütunlar ona aktarıldı. Bu sütunun, Kur'an'da bahsedilen aynı sütuna sahip bir sütun olduğu söylenir. Ka'b, Muaviye ibn Ebi Sufyan'a gelip hikayesini sorduğunda bahsedilmiştir. Altından, gümüşten, miskten ve safrandan yapılmış olağanüstü yapısını anlatmış ve bir bedevi Girer ve iki deveyi içeri al, böylece onları aramaya çıkıp onlara düşerdi. Sonra Ka'b, Muaviye'nin toplantısına döndü ve dedi ki, 'İşte o adam.' Bedevi deve aramak için araya girmişti, bu yüzden Muaviye Ka'b'a izin verdi. Al-Mas'udi dedi ki: Eğer Ka'b hakkındaki bu haber doğruysa, iyidir ve onu çeşitli kaynaklardan yozlaştıran bir haberdir, bir tür intikamdır. Bu şehirde ve nerede olduğu konusunda insanlar tartıştı {alıntı:) Muruj-al-Dhahab, s. 554-555}."
  id: "Sebuah kuil besar di kota Damaskus yang dikenal sebagai Jirun dibangun oleh Jiron ibn Sa'd al-'Aadi, yang kemudian dipindahkan tiang marmer. Dikatakan bahwa itu adalah tiang dengan tiang yang sama seperti yang disebutkan dalam Al-Qur'an. Dikatakan tentang Ka'b para ahli kitab ketika ia memasuki Muawiyah ibn Abi Sufyan dan menanyakan kisah itu. Ia menggambarkan struktur luar biasa yang terbuat dari emas, perak, musk, dan saffron, dan bahwa seorang Badui akan masuk ke sana dan membiarkan dua unta masuk, sehingga ia pergi mencari unta dan jatuh hati pada mereka. Kemudian Ka'b berbalik kepada kumpulan Muawiya dan berkata, 'Inilah orangnya.' Orang Badui masuk mencari unta, jadi Muawiya mengizinkan Ka'b. Al-Mas'udi berkata: Jika laporan tentang Ka'b ini benar, itu baik, dan merupakan laporan yang merusak dirinya dari berbagai sumber dan merupakan bentuk pembalasan. Orang-orang berdebat di kota ini dan di mana lokasinya {cite:Muruj-al-Dhahab, hlm. 554-555}."
