label: { ar: "جيرون بدمشق", en: "Jirun of Damascus" }
summary:
  ar: "هيكل عظيم البنيان في مدينة دمشق يعرف بجيرون بناه جيرون بن سعد العادي ونقل إليه عمد الرخام، وقيل إنه إرم ذات العماد المذكورة في القرآن، وذكر عن كعب الأحبار حين دخل على معاوية بن أبي سفيان فسأله عن خبرها فوصف عجيب بنيانها من الذهب والفضة والمسك والزعفران وأنه يدخلها أعرابي يتيه له جملان فيخرج في طلبهما فيقع إليها، ثم التفت كعب في مجلس معاوية فقال هذا هو الرجل وكان الأعرابي قد دخلها يطلب ما ندّ من إبله فأجاز معاوية كعباً، وقال المسعودي إن كان هذا الخبر عن كعب حقاً فهو حسن وهو خبر يدخله الفساد من جهات من النقل وهو من صنعة القصاص، وقد تنازع الناس في هذه المدينة وأين هي {cite:muruj-al-dhahab p. 554-555}."
  en: "Damascus's great temple, said to be Jayrun ibn Sa'd al-'Adi's marble-pillared building and by some Iram dhat al-'Imad — Ka'b al-Ahbar's famous verification before Mu'awiya of the strayed-camels Bedouin; al-Mas'udi notes the report is corrupted in transmission and is storytellers' craft {cite:muruj-al-dhahab p. 554-555}."
