summary:
  ar: "مدينة في البرية بين العراق والشام بينها وبين الشام ستة أيام، عدّها ابن فضل الله العمري من الآثار المشهورة لما فيها من عجائب البناء وكبار العمل، وبها خلق من العرب من قضاعة {cite:umari-masalik-1924 p. 231}."
  en: "The desert city between Iraq and Sham, six days from Damascus side, counted by al-Umari among the famous monuments for its wondrous building and mighty works; Arabs of Quda'a still dwelt there {cite:umari-masalik-1924 p. 231}."
  es: "La ciudad desértica entre Irak y Siria, a seis días de Damasco, contada por al-Umari entre los monumentos famosos por su maravillosa construcción y sus poderosas obras; los árabes de Quda'a aún habitaban allí {cite:umari-masalik-1924 p. 231}."
  fr: "La ville désertique située entre l'Irak et le Sham, à six jours de Damas, est comptée par al-Umari parmi les monuments célèbres pour sa construction merveilleuse et ses ouvrages puissants; les Arabes de Quda'a y habitaient encore {cite:umari-masalik-1924 p. 231}."
  ur: "عراق اور شام کے درمیان صحرائی شہر، دمشق کی طرف سے چھ دن کے فاصلے پر، العماری نے اپنی شاندار عمارتوں اور شاندار کاموں کے لیے مشہور یادگاروں میں شمار کیا ہے۔ قدعہ کے عرب اب بھی وہاں مقیم تھے۔ 231}۔"
  tr: "Irak ile Levant arasında, Levant ile arasında altı gün uzaklıkta bulunan bir şehir. İbn Fadlallah el-Omeri, muhteşem yapısı ve büyük başarıları nedeniyle burayı ünlü anıtlardan biri olarak kabul ederdi. Ayrıca Kudü'ah'tan bir grup Arap'a da ev sahipliği yapmıştır {cite:umari-masalik-1924, s. 231}."
  id: "Sebuah kota di padang gurun antara Irak dan Levant, enam hari antara Irak dan Levant. Ibn Fadlallah al-Omari menganggapnya sebagai salah satu monumen terkenal karena konstruksinya yang luar biasa dan perbuatan besarnya. Kota ini juga menjadi rumah bagi sekelompok orang Arab dari Qud'ah {cite:umari-masalik-1924, hlm. 231}."
