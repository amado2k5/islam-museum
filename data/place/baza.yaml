summary:
  ar: "بسطة من مدن شرق الأندلس العتيدة؛ يعمل بمرسية البسط التي يغالى في ثمنها بالمشرق ويصنع في غرناطة وبسطة {cite:nafh-tib-maqqari p. ~198}. وصمدت لحصار صاحب قشتالة من رجب إلى ذي الحجة سنة 894 بجموع وادي آش والمرية والمنكب والبشرات حتى قل الطعام، فاحتال أهلها بإظهار الطعام في الأسواق وهم في غاية الضعف، ودخل النصارى قلعتها يوم الجمعة عاشر محرم سنة 895 {cite:nafh-tib-maqqari p. 525-526}."
  en: "Baza, the stout city of eastern al-Andalus known for its prized rugs; it endured the Castilian siege of 894 for six months until the staged-market deception failed, surrendering on Friday 10 Muharram 895 {cite:nafh-tib-maqqari p. 525-526}."
