summary:
  ar: "بسطة من مدن شرق الأندلس العتيدة؛ يعمل بمرسية البسط التي يغالى في ثمنها بالمشرق ويصنع في غرناطة وبسطة {cite:nafh-tib-maqqari p. ~198}. وصمدت لحصار صاحب قشتالة من رجب إلى ذي الحجة سنة 894 بجموع وادي آش والمرية والمنكب والبشرات حتى قل الطعام، فاحتال أهلها بإظهار الطعام في الأسواق وهم في غاية الضعف، ودخل النصارى قلعتها يوم الجمعة عاشر محرم سنة 895 {cite:nafh-tib-maqqari p. 525-526}."
  en: "Baza, the stout city of eastern al-Andalus known for its prized rugs; it endured the Castilian siege of 894 for six months until the staged-market deception failed, surrendering on Friday 10 Muharram 895 {cite:nafh-tib-maqqari p. 525-526}."
  es: "Baza, la robusta ciudad del este de al-Ándalus conocida por sus valiosas alfombras; soportó el asedio castellano de 894 durante seis meses hasta que fracasó el engaño del mercado simulado, rindiéndose el viernes 10 de Muharram de 895 {cite:nafh-tib-maqqari p. 525-526}."
  fr: "Baza, la robuste ville de l'est d'al-Andalus connue pour ses précieux tapis; elle a enduré le siège castillan de 894 pendant six mois jusqu'à ce que la supercherie du marché mis en scène échoue, se rendant le vendredi 10 Muharram 895 {cite:nafh-tib-maqqari p. 525-526}."
  ur: "بازا، مشرقی الاندلس کا مضبوط شہر جو اپنے قیمتی قالینوں کے لیے جانا جاتا ہے۔ اس نے 894 کے کاسٹیلین محاصرے کو چھ ماہ تک برداشت کیا جب تک کہ اسٹیجڈ مارکیٹ فریب ناکام ہو گیا، جمعہ 10 محرم 895 کو ہتھیار ڈال دیے گئے 525-526}۔"
