  ar: "قلعة من أجل القلاع، وبقعتها أفضل البقاع، وحالها أشرف الأحوال، آهلة عامرة، وبها جنات تحمل كل الثمرات، وفيها عين تُعرف بعين الأوقات. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  en: "One of the finest fortresses, on the best ground, populous and rich, with gardens bearing every fruit and a spring known as the spring of the hours, one stage from Nutas along the coast. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  es: "Una de las mejores fortalezas, en el mejor terreno, populosa y rica, con jardines que producen toda clase de frutas y un manantial conocido como el manantial de las horas, a una etapa de Nutas a lo largo de la costa. {cite:nuzhat-al-mushtaq-2002 p. 598}"
  fr: "L'une des plus belles forteresses, située sur un terrain exceptionnel, peuplée et riche, avec des jardins regorgeant de fruits et une source connue sous le nom de source des heures, à une étape de Nutas en longeant la côte. {cite:nuzhat-al-mushtaq-2002 p. 598}"
