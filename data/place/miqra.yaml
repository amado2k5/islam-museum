  ar: "مدينة فيها حبوب، وأهلها يزرعون الكتان ويعرفونه كثيراً، وتبعد عن المسيلة مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 263}"
  en: "A town with grain, whose people grow much flax; one stage from al-Musayla. {cite:nuzhat-al-mushtaq-2002 p. 263}"
