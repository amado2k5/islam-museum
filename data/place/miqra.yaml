  ur: "اناج کے ساتھ ایک شہر، جس کے لوگ بہت زیادہ سن اگاتے ہیں۔ المسیلہ سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 263}"
  tr: "Tahılları olan bir şehir, halkı keten yetiştirir ve iyi tanır, M'sila'dan bir adım uzaklıkta. {kaynak:nuzhat-al-mushtaq-2002 s. 263}"
  id: "Sebuah kota dengan biji-bijian, dan penduduknya menanam rami serta mengenalnya dengan baik, dan itu hanya selangkah dari M'sila. {cite:Nuzhat-al-Mushtaq-2002 hlm. 263}"
