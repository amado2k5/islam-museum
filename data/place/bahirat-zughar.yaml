summary:
  ar: "البحيرة الميتة التي يصفها الإدريسي بأنها لا يعيش فيها شيء، وكانت فيها مدينتان لقوم لوط، وتبعد عن ريحا وتسمى البحيرة الميتة. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  en: "The dead lake, which al-Idrisi describes as having no living thing in it; it is where two towns of Lot's people were sunk, and it lies near Riha. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  es: "El lago muerto, que al-Idrisi describe como desprovisto de vida, es donde se hundieron dos ciudades del pueblo de Lot y se encuentra cerca de Riha. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  fr: "Le lac mort, décrit par al-Idrisi comme dépourvu de toute vie, est le lieu où furent englouties deux villes du peuple de Lot, et il se situe près de Riha. {cite:nuzhat-al-mushtaq-2002 p. 355}"
  ur: "مردہ جھیل، جسے الادریسی نے بیان کیا ہے کہ اس میں کوئی جاندار چیز نہیں ہے۔ یہ وہ جگہ ہے جہاں لوط کی قوم کے دو قصبے ڈوب گئے تھے، اور یہ ریحا کے قریب واقع ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 355}"
