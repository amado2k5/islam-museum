summary:
  ar: "مدينة من قواعد بلاد الروم مشهورة، كثيرة الأسواق والديار، لها مراكب وخيل واستعداد، وهي على نهر يأتي إليها من جبل، وتبعد عن جنوة نحو أربعين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 750}"
  en: "A famous city of the Roman lands with many markets and houses, which has boats, horses and readiness, on a river that comes down from the hills; about forty miles from Genoa. {cite:nuzhat-al-mushtaq-2002 p. 750}"
  es: "Una famosa ciudad de la época romana con numerosos mercados y casas, que cuenta con barcos, caballos y una gran actividad, situada a orillas de un río que desciende de las colinas; a unos cuarenta kilómetros de Génova. {cite:nuzhat-al-mushtaq-2002 p. 750}"
  fr: "Une ville célèbre des territoires romains, avec ses nombreux marchés et maisons, ses bateaux, ses chevaux et son hospitalité, située sur une rivière descendant des collines; à une quarantaine de kilomètres de Gênes. {cite:nuzhat-al-mushtaq-2002 p. 750}"
  ur: "رومن کا ایک مشہور شہر جس میں بہت سے بازار اور مکانات ہیں، جس میں کشتیاں، گھوڑے اور تیاری ہے، پہاڑیوں سے نیچے آنے والے دریا پر۔ جینوا سے تقریباً چالیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 750}"
