summary:
  ar: بلدة في الأناضول يُنسب إليها ضريح نصر الدين خوجة الذي تذكره المقدمة، ويزوره الناس تبركاً {cite:juha-nawadir-kubra-djuwaydi p. 6}.
  en: Town in Anatolia where the anecdotal Nasreddin Hoca is said to be buried; the edition notes his tomb there and a custom of visiting it. Named as the seat of Juha's tomb in the introduction {cite:juha-nawadir-kubra-djuwaydi p. 6}.
  es: "Ciudad de Anatolia donde se dice que está enterrado el legendario Nasreddin Hoca; la edición menciona su tumba allí y la costumbre de visitarla. Se la nombra como el lugar de la tumba de Juha en la introducción {cite:juha-nawadir-kubra-djuwaydi p. 6}."
  fr: "Ville d'Anatolie où serait enterré le personnage légendaire de Nasreddin Hoca; l'édition mentionne son tombeau à cet endroit et la coutume de s'y recueillir. Elle est citée comme le lieu de sépulture de Juha dans l'introduction {cite:juha-nawadir-kubra-djuwaydi p. 6}."
  ur: "اناطولیہ کا قصبہ جہاں نصرالدین ہوکا کو دفن کیا جاتا ہے۔ ایڈیشن میں اس کی قبر اور اس کی زیارت کے رواج کو نوٹ کیا گیا ہے۔ تعارف میں جوہا کے مقبرے کی نشست کے طور پر نامزد کیا گیا ہے {حوالہ دیں:جوہا-نوادر-کبرہ-جویدی صفحہ۔ 6}۔"
  tr: "Anadolu'da, girişte bahsedilen Nasreddin Khoja'nın türbesinden adını alan ve insanlar tarafından kutsamalar için ziyaret edilen bir kasaba {cite:juha-nawadir-kubra-djuwaydi s. 6}."
  id: "Sebuah kota di Anatolia dinamai menurut makam Nasreddin Khoja, yang disebutkan dalam pengantar, dan dikunjungi oleh orang-orang untuk meminta berkah {cite:juha-nawadir-kubra-djuwaydi hlm. 6}."
