summary:
  ar: "مدينة حصينة خصيبة كثيرة الأشجار، عليها سور من تراب، وأكثر أبنيتها من اللبن، وأسعارها رخيصة، وتبعد عن كثة مائة وثلاثة وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 429}"
  en: "A strong, fertile city rich in trees, walled with earth, most buildings of mud brick, with cheap prices; 123 miles from Kath. {cite:nuzhat-al-mushtaq-2002 p. 429}"
  es: "Una ciudad fuerte y fértil, rica en árboles, amurallada con tierra, con la mayoría de los edificios de adobe y precios económicos; a 123 millas de Katham. {cite:nuzhat-al-mushtaq-2002 p. 429}"
  fr: "Une ville forte et fertile, riche en arbres, entourée de remparts de terre, la plupart des bâtiments étant en briques de terre crue, et où les prix sont bas; à 123 miles de Katmandou. {cite:nuzhat-al-mushtaq-2002 p. 429}"
  ur: "درختوں سے مالا مال ایک مضبوط، زرخیز شہر، زمین سے ڈھکی دیواریں، کچی اینٹوں کی زیادہ تر عمارتیں، سستے داموں؛ کاٹھ سے 123 میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 429}"
  tr: "Çok sayıda ağaç olan, toprak duvarı olan tahkimatlı, verimli bir şehir; binalarının çoğu çamurdan yapılmış, fiyatları ucuz ve yaklaşık yüz yirmi üç mil uzaklıktadır. {kaynak:nuzhat-al-mushtaq-2002 s. 429}"
  id: "Kota yang diperkuat dan subur dengan banyak pohon, dengan tembok tanah, sebagian besar bangunannya terbuat dari lumpur, harganya murah, dan terletak sekitar seratus dua puluh tiga mil jauhnya. {cite:nuzhat-al-mushtaq-2002 hlm. 429}"
