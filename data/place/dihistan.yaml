summary:
  ar: "مدينة خلف جرجان في بلاد الترك؛ بها نزل صول التركي فحصرها يزيد بن المهلب وقطع المواد عن أهلها حتى صالحه على الأمان وتسليم المدينة واستعمل عليها وعلى البياسان عبد الله بن معمر اليشكري."
  en: "A city beyond Jurjan in the Turks' country where Sul al-Turki sat; Yazid ibn al-Muhallab besieged it, cut its supplies, and took its treaty — aman for surrender — posting Abdallah ibn Ma'mar over it and al-Biyasan."
  es: "Una ciudad más allá de Jurjan, en territorio turco, donde se encontraba Sul al-Turki; Yazid ibn al-Muhallab la asedió, cortó sus suministros y se apoderó de su tratado —un aman que significa rendición—, nombrando a Abdallah ibn Ma'mar para que la administrara, al igual que a al-Biyasan."
  fr: "Une ville au-delà de Jurjan, dans le pays des Turcs, où se trouvait Sul al-Turki; Yazid ibn al-Muhallab l'assiégea, coupa ses approvisionnements et prit son traité — aman pour reddition — postant Abdallah ibn Ma'mar sur elle et al-Biyasan."
  ur: "ترکوں کے ملک میں جرجان سے آگے ایک شہر جہاں سل الترکی بیٹھا تھا۔ یزید ابن المحلب نے اس کا محاصرہ کیا، اس کا سامان کاٹ دیا، اور اس کا معاہدہ - ہتھیار ڈالنے کے لیے امان - عبداللہ ابن معمر کو اس پر اور البیاسان کو تعینات کیا۔"
