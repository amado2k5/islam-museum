  ur: "ایک شہر جس میں بہت سے انگور کے باغ اور دیہات ہیں۔ اس کے لوگ چشموں سے کھلائے جانے والے ایک بڑے ذخیرے سے پانی کھینچتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 147}"
