  ar: "جبل صغير قريب من الكعبة بمكة؛ صعد عليه النبي فنادى بطون قريش وأنذرهم، وعليه كانت دار الأرقم بن أبي الأرقم التي اتخذها النبي مركزاً لدعوته."
  en: "A small hill beside the Kaaba at Mecca; the Prophet climbed it to summon the clans of Quraysh and warn them, and the house of al-Arqam ibn Abi al-Arqam, his centre for the call, stood on it."
  es: "Una pequeña colina junto a la Kaaba en La Meca; el Profeta la escalaba para convocar a los clanes de Quraysh y advertirles, y la casa de al-Arqam ibn Abi al-Arqam, su centro para la llamada, se encontraba en ella."
  fr: "Une petite colline près de la Kaaba à La Mecque; le Prophète l'escalada pour convoquer les clans de Quraysh et les avertir, et la maison d'al-Arqam ibn Abi al-Arqam, son centre pour l'appel, se trouvait dessus."
  ur: "مکہ میں کعبہ کے پاس ایک چھوٹی سی پہاڑی؛ رسول اللہ قریش کے قبیلوں کو بلانے اور ان کو تنبیہ کرنے کے لیے اس پر چڑھے اور ارقم ابن ابی ارقم کا گھر جو کہ ان کے اذان کا مرکز تھا، اس پر کھڑا ہو گیا۔"
