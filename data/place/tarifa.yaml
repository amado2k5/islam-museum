summary:
  ar: "مدينة على المضيق تنسب إلى طريف البربري مولى موسى بن نصير الذي غزاها بمعونة صاحب سبتة يليان النصراني — وقيل إلى طريف بن مالك النخعي الذي نزل بها ضمن فتح طارق بن زياد — وهي أول ما وطئه المسلمون من الثغور الأندلسية قبل الفتح الكبير {cite:nafh-tib-maqqari}."
  en: "The city on the Strait named for Tarif — Musa ibn Nusayr's Berber client who raided the coast with Julian of Ceuta's ships, or Tarif ibn Malik who landed in Tariq's fleet — the first Andalusi shore trodden by the Muslims {cite:nafh-tib-maqqari}."
  es: "La ciudad en el estrecho que lleva el nombre de Tarif —el cliente bereber de Musa ibn Nusayr que asaltó la costa con los barcos de Juliano de Ceuta, o Tarif ibn Malik que desembarcó en la flota de Tariq— la primera costa andalusí pisada por los musulmanes {cite:nafh-tib-maqqari}."
  fr: "La ville du détroit nommée d'après Tarif — le client berbère de Musa ibn Nusayr qui a pillé la côte avec les navires de Julien de Ceuta, ou Tarif ibn Malik qui a débarqué dans la flotte de Tariq — le premier rivage andalou foulé par les musulmans {cite:nafh-tib-maqqari}."
  ur: "آبنائے پر شہر کا نام طارق کے نام پر رکھا گیا — موسیٰ بن نصیر کا بربر مؤکل جس نے سیوٹا کے بحری جہاز جولین کے ساتھ ساحل پر حملہ کیا، یا طارق کے بحری بیڑے میں اترنے والے طارق بن مالک — پہلا اندلس کا ساحل جسے مسلمانوں نے روند دیا {حوالہ: نفح تبمقاری}۔"
