summary:
  ar: "نهر قديم بالسواد؛ عند البلاذري كان يدعى بالنبطية «لبساق» أي الذي يقطع الماء عما يليه ويجره إليه وهو نهر يجتمع إليه فضول مياه آجام السيب وماء من ماء الفرات فقال الناس البزاق."
  en: "An old Sawad canal; in al-Baladhuri called in Nabataean 'la-Bassaq' — one that cuts water off its neighbour and draws it to itself — gathering surplus waters of al-Sib's marshes and Euphrates water, which the people corrupted to al-Bazzaq."
  es: "Un antiguo canal de Sawad; en al-Baladhuri llamado en nabateo 'la-Bassaq', que corta el agua de su vecino y la atrae hacia sí mismo, recogiendo las aguas sobrantes de los pantanos de al-Sib y del Éufrates, que la gente corrompió a al-Bazzaq."
  fr: "Un ancien canal de Sawad; à al-Baladhuri appelé en nabatéen « la-Bassaq » — celui qui coupe l'eau de son voisin et la tire vers lui — recueillant les eaux excédentaires des marais d'al-Sib et de l'Euphrate, que les gens ont corrompu en al-Bazzaq."
  ur: "ایک پرانی سواد نہر؛ البلادوری میں جسے نباطین 'لا-باسق' کہا جاتا ہے - ایک جو اپنے پڑوسی سے پانی کاٹ کر اسے اپنی طرف کھینچتا ہے - السب کی دلدل اور فرات کے پانی کے اضافی پانی کو جمع کرنا، جسے لوگوں نے البزاق کو خراب کر دیا۔"
  tr: "Siyah renkte eski bir nehir; Al-Baladhuri'ye göre, Nabatiye'de 'Labsaq' olarak adlandırılmıştır, yani suyu bir sonraki kısımdan kesip ona akan nehir. Seeb ve Fırat suyunun bolluğuyla buluşan bir nehirdir, insanlar buna göre salyangoz derler."
  id: "Sungai kuno berwarna hitam; menurut Al-Baladhuri, dalam Nabatieh disebut 'Labsaq,' yang berarti sungai yang memutus air dari bagian berikutnya dan mengalirkannya ke sana. Ini adalah sungai yang bertemu dengan kelimpahan air Seeb dan air dari Sungai Efrat, demikian kata orang sebagai siput."
