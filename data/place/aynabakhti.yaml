summary:
  ar: "بلدة على خليج كورنث في اليونان، هي ناوباكتوس وليبانتو، دخلت الحكم البندقي سنة 1407م وفتحها العثمانيون سنة 1499م، وقرب شواطئها جرت معركة ليبانتو سنة 1571م {cite:encyclopaedia-of-islam-2 vol. 1 p. 839}."
  en: "A town on the Gulf of Corinth in Greece, the ancient Naupaktos and Lepanto. It came under Venetian rule in 1407, was taken by the Ottomans in 1499, and off its coast the battle of Lepanto was fought in 1571 {cite:encyclopaedia-of-islam-2 vol. 1 p. 839}."
  es: "Ciudad situada en el golfo de Corinto, en Grecia, conocida antiguamente como Naupaktos o Lepanto. Cayó bajo dominio veneciano en 1407, fue tomada por los otomanos en 1499, y frente a sus costas se libró la batalla de Lepanto en 1571 {cite:encyclopaedia-of-islam-2 vol. 1 p. 839}."
  fr: "Ville située sur le golfe de Corinthe en Grèce, l'ancienne Naupaktos et Lépante. Elle passa sous domination vénitienne en 1407, fut prise par les Ottomans en 1499, et la bataille de Lépante eut lieu au large de ses côtes en 1571 {cite:encyclopaedia-of-islam-2 vol. 1 p. 839}."
  ur: "یونان میں خلیج کورنتھ پر واقع ایک قصبہ، قدیم نوپکتوس اور لیپینٹو۔ یہ 1407 میں وینیشین حکمرانی کے تحت آیا، 1499 میں عثمانیوں نے اس پر قبضہ کر لیا، اور اس کے ساحل پر لیپینٹو کی جنگ 1571 میں لڑی گئی۔ 1 ص۔ 839}۔"
