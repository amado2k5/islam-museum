  ar: "بلدة على خليج كورنث في اليونان، هي ناوباكتوس وليبانتو، دخلت الحكم البندقي سنة 1407م وفتحها العثمانيون سنة 1499م، وقرب شواطئها جرت معركة ليبانتو سنة 1571م {cite:encyclopaedia-of-islam-2 vol. 1 p. 839}."
