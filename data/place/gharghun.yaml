summary:
  ar: "بحيرة كبيرة طولها نحو مائة ميل، ماؤها حلو، وفيها سمك كثير، وعليها جبل من الثلج، وتقع بجملتها في مرغار، ويذكر الإدريسي أن أهلها يتحصنون. {cite:nuzhat-al-mushtaq-2002 p. 840}"
  en: "A great lake about a hundred miles long with sweet water and much fish, with a snowy mountain above it, in the Marghar district; its people are fortified, in al-Idrisi's account. {cite:nuzhat-al-mushtaq-2002 p. 840}"
  es: "Un gran lago de aproximadamente cien millas de largo, de agua dulce y con abundancia de peces, con una montaña nevada sobre él, en el distrito de Marghar; sus habitantes están fortificados, según relata al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 840}"
  fr: "Un grand lac d'une centaine de kilomètres de long, aux eaux douces et poissonneuses, surmonté d'une montagne enneigée, dans le district de Marghar; ses habitants vivent retranchés dans des forteresses, selon le récit d'al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 840}"
  ur: "تقریباً سو میل لمبی ایک عظیم جھیل جس میں میٹھے پانی اور بہت سی مچھلیاں ہیں، جس کے اوپر ایک برفانی پہاڑ ہے، ضلع مارگھر میں۔ الادریسی کے بیان میں اس کے لوگ مضبوط ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 840}"
