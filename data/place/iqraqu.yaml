summary:
  ar: "مدينة حسنة كثيرة الديار، من مدن أرض بلونية، تحيط بها جبال حاجزة بينها وبين بلاد الروسية، وفيها نهر شنت {cite:nuzhat-al-mushtaq-2002 p. 889}."
  en: "A fine city with many houses in the land of Bulūniya, surrounded by barrier mountains that separate it from the land of the Rus; the river Shant flows there {cite:nuzhat-al-mushtaq-2002 p. 889}."
  es: "Una hermosa ciudad con muchas casas en la tierra de Bulūniya, rodeada de montañas barrera que la separan de la tierra de los Rus; el río Shant fluye allí {cite:nuzhat-al-mushtaq-2002 p. 889}."
  fr: "Une belle ville avec de nombreuses maisons dans le pays de Bulūniya, entourée de montagnes barrières qui la séparent du pays des Rus; le fleuve Shant y coule {cite:nuzhat-al-mushtaq-2002 p. 889}."
  ur: "بلونیہ کی سرزمین میں بہت سے مکانات والا ایک عمدہ شہر، جس کے چاروں طرف رکاوٹیں پہاڑ ہیں جو اسے روس کی سرزمین سے الگ کرتے ہیں۔ وہاں دریائے شانت بہتا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 889}۔"
  tr: "Çok sayıda evi olan, renkli toprakların şehirlerinden biri, Rusya ile sınırı olan dağlarla çevrili ve akan bir nehre sahip {cite:Nuzhat-al-Mushtaq-2002, s. 889}."
  id: "Sebuah kota yang indah dengan banyak rumah, salah satu kota di tanah yang penuh warna, dikelilingi oleh pegunungan yang membatasinya dengan Rusia, dan memiliki sungai yang mengalir {cite:Nuzhat-al-Mushtaq-2002, hlm. 889}."
