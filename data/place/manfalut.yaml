summary:
  ar: "موضع بمقربة من الشط الغربي من النيل، فيه الأسواق وسائر المرافق، وقمحه يُجلب إلى مصر لطيبه ورزانة حبته ⁦(الصفحة 374 من الماسح الضوئي للنسخة)⁩."
  en: "A place close to the western bank of the Nile, with markets and all the amenities. Its wheat is brought to Egypt for its quality and the firmness of its grain (page 374 of the scanned copy)."
  es: "Un lugar cercano a la orilla occidental del Nilo, con mercados y todos los servicios. Su trigo se importa a Egipto por su calidad y la firmeza de su grano (página 374 de la copia escaneada)."
  fr: "Lieu situé près de la rive ouest du Nil, avec des marchés et toutes les commodités. Son blé est importé en Égypte pour sa qualité et la fermeté de son grain (page 374 de la copie numérisée)."
  ur: "نیل کے مغربی کنارے کے قریب ایک جگہ، بازار اور تمام سہولیات کے ساتھ۔ اس کی گندم کو اس کے معیار اور اس کے اناج کی مضبوطی کے لیے مصر لایا جاتا ہے ⁦(اسکین کاپی کا صفحہ 374)⁩۔"
  tr: "Nil'in batı kıyısına yakın, pazarlar ve tüm olanaklarla bir alan; buğdayı, tahılının iyiliği ve sertliği nedeniyle Mısır'a getirilir (el yazması tarayıcısının 374. sayfası)."
  id: "Sebuah lokasi dekat tepi barat Sungai Nil, dengan pasar dan semua fasilitas, serta gandumnya dibawa ke Mesir karena kebaikan dan kelembutan biji-bijinya (halaman 374 pada pemindai manuskrip)."
