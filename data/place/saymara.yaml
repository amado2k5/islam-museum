  ur: "مہراجن قدف کا شہر؛ البلادوری میں جو السائب ابن الاقراء نے ابو موسیٰ کے مشن پر لیا تھا — خون بہہ گیا، قیدیوں کو چھوڑ دیا گیا، صفرا اور بیضاء کو معاف کر دیا گیا — جزیہ اور خشکی پر۔"
