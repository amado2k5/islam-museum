summary:
  ar: "أرض يُروى زرعها من النيل من غير مطر، تتصل حدودها جنوباً ببلاد النوبة، وشمالاً بالبحر، وفيها بساتين وأشجار ونخل وقصب سكر، ويزرع أهلها على ماء الفيضان. {cite:nuzhat-al-mushtaq-2002 p. 322} وكلمة مصر في دائرة المعارف الإسلامية علمٌ على جدّ المصريين، واسم جنس لمستوطنة الفاتحين وقاعدة الولاية، وهي أرض مصر وعاصمتها. وتتبّع المقالة تاريخها من مصر البيزنطية والفتح العربي بقيادة عمرو بن العاص ثم العهود الأموي والعباسي والطولوني والفاطمي والأيوبي والمملوكي والعثماني، حتى الحملة الفرنسية وحكم محمد علي وثورة عرابي وهزيمتها سنة 1882م."
  en: "A land watered by the Nile without rain, with Nubia to the south and the sea to the north; it has orchards, trees, palms and sugar cane, and its people plant after the flood. {cite:nuzhat-al-mushtaq-2002 p. 322} In the Encyclopaedia of Islam, Misr is the eponym of the Egyptians, a common noun for a conquerors' settlement and provincial capital, and the land of Egypt with its capital. The article follows its history from Byzantine Egypt and the Arab conquest under Amr ibn al-As through Umayyad, Abbasid, Tulunid, Fatimid, Ayyubid, Mamluk and Ottoman rule, to the French expedition, Muhammad Ali and the Urabi movement, defeated in 1882."
  ur: "ایسی سرزمین جسے نیل بغیر بارش کے سیراب کرتا ہے، جس کے جنوب میں نوبیہ اور شمال میں سمندر ہے؛ اس میں باغات، درخت، کھجوریں اور گنا ہے، اور لوگ طغیانی کے پانی پر کاشت کرتے ہیں۔ اسلامی انسائیکلوپیڈیا میں مصر مصریوں کے جدِ اعلیٰ کا نام، فاتحین کی بستی اور صوبے کے دارالحکومت کے لیے اسمِ جنس، اور ملکِ مصر مع اس کے دارالحکومت ہے۔ مضمون اس کی تاریخ بازنطینی مصر اور عمرو بن العاص کی عرب فتح سے اموی، عباسی، طولونی، فاطمی، ایوبی، مملوک اور عثمانی ادوار تک، پھر فرانسیسی مہم، محمد علی اور عرابی کی تحریک تک، جو 1882ء میں ہار گئی، بیان کرتا ہے۔"
