summary:
  ar: "مدينة على ضفة النهر تدخلها المراكب، وبها قصبة في نهاية الحصانة، وأسواق وضياع، وتبعد عن البحر عشرين ميلاً، وعن مرسية اثني عشر ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  en: "A town on a river the boats enter, with a fortified citadel, markets and estates; twenty miles from the sea and twelve from Murcia. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  es: "Una ciudad a orillas de un río navegable, con una ciudadela fortificada, mercados y fincas; a veinte millas del mar y a doce de Murcia. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  fr: "Une ville fluviale accessible par bateau, avec une citadelle fortifiée, des marchés et des domaines; à vingt milles de la mer et à douze de Murcie. {cite:nuzhat-al-mushtaq-2002 p. 558}"
  ur: "ایک دریا پر ایک قصبہ جس میں کشتیاں داخل ہوتی ہیں، جس میں قلعہ بند، بازار اور جاگیر ہوتے ہیں۔ سمندر سے بیس میل اور مرسیا سے بارہ میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 558}"
