  tr: "Ege Denizi kıyısındaki Batı Anadolu'da bir kıyı kenti olan bu şehir, Osmanlı İmparatorluğu'nun en önemli limanlarından biriydi ve 1919'da Yunanlar tarafından işgal edildi."
  id: "Kota pesisir di Anatolia barat di Laut Aegea, kota ini merupakan salah satu pelabuhan terpenting di Kekaisaran Ottoman, dan diduduki oleh Yunani pada tahun 1919."
