summary:
  ar: "مدينة صغيرة متحضرة ذات أسواق للبيع والشراء، تبعد عن نوشى مائة ميل، بحسب الإدريسي. {cite:nuzhat-al-mushtaq-2002 p. 917}"
  en: "A small, civilised town with markets for buying and selling, one hundred miles from Nūshā, according to al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 917}"
  es: "Según al-Idrisi, se trata de una pequeña ciudad civilizada con mercados para comprar y vender, situada a cien millas de Nūshā. {cite:nuzhat-al-mushtaq-2002 p. 917}"
  fr: "Une petite ville civilisée, dotée de marchés pour l'achat et la vente, située à cent milles de Nūshā, selon al-Idrisi. {cite:nuzhat-al-mushtaq-2002 p. 917}"
  ur: "الادریسی کے مطابق، نوشا سے سو میل کے فاصلے پر، خرید و فروخت کے لیے بازاروں والا ایک چھوٹا، مہذب شہر۔ {حوالہ: نزہت المشتاق-2002 ص۔ 917}"
  tr: "Alım-satım pazarları olan küçük, medeni bir şehir olan İdrisi'ye göre, Nouchi'ye yüz mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 917}"
  id: "Menurut Idrissi, sebuah kota kecil yang beradab dengan pasar untuk membeli dan menjual, kota ini berjarak seratus mil dari Nouchi. {cite:Nuzhat-al-Mushtaq-2002 hlm. 917}"
