summary:
  en: "Anatolian city, capital of the Seljuk Sultanate of Rum from the reign of Mas'ud I (512-550/1118-1155) and the burial place of Rumi (d. 672/1273); definitively annexed to the Ottoman state in 880/1475 {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  ar: "مدينة في الأناضول، عاصمة سلطنة سلاجقة الروم منذ عهد مسعود الأول (٥١٢–٥٥٠هـ/١١١٨–١١٥٥م) وفيها مدفن جلال الدين الرومي (ت. ٦٧٢هـ/1273م)؛ ضُمت نهائيًا إلى الدولة العثمانية سنة ٨٨٠هـ/١٤٧٥م {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  ur: "اناطولیہ کا شہر جو مسعود اول (512–550ھ/1118–1155ء) کے عہد سے سلجوق سلطنتِ روم کا دارالحکومت رہا اور رومی (وفات 672ھ/1273ء) کی آرام گاہ ہے؛ 880ھ/1475ء میں عثمانی سلطنت میں حتمی طور پر شامل ہوا۔"
