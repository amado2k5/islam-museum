summary:
  ar: "موضع من أعمال جند قنسرين، توفي فيه سليمان بن عبد الملك يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين {cite:bakr-umayyad-state-1134715 p. 252}، وكان قد أقام بالمرج في عسكره غازياً، فكتب هناك وصيته بالخلافة إلى عمر بن عبد العزيز {cite:bakr-umayyad-state-1134715 p. 261-262}."
  en: "A place in the military district (jund) of Qinnasrin, where Sulayman ibn Abd al-Malik died on a Friday, ten days before the end of Safar in the year 99 AH {cite:bakr-umayyad-state-1134715 p. 252}. He had stayed at the marj on campaign with his army, and there he wrote his bequest of the caliphate to Umar ibn Abd al-Aziz {cite:bakr-umayyad-state-1134715 p. 261-262}."
