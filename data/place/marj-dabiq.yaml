summary:
  ar: "موضع من أعمال جند قنسرين، توفي فيه سليمان بن عبد الملك يوم الجمعة لعشر بقين من صفر سنة تسع وتسعين {cite:bakr-umayyad-state-1134715 p. 252}، وكان قد أقام بالمرج في عسكره غازياً، فكتب هناك وصيته بالخلافة إلى عمر بن عبد العزيز {cite:bakr-umayyad-state-1134715 p. 261-262}."
  en: "A place in the military district (jund) of Qinnasrin, where Sulayman ibn Abd al-Malik died on a Friday, ten days before the end of Safar in the year 99 AH {cite:bakr-umayyad-state-1134715 p. 252}. He had stayed at the marj on campaign with his army, and there he wrote his bequest of the caliphate to Umar ibn Abd al-Aziz {cite:bakr-umayyad-state-1134715 p. 261-262}."
  es: "Un lugar en el distrito militar (jund) de Qinnasrin, donde Sulayman ibn Abd al-Malik murió un viernes, diez días antes del final de Safar en el año 99 AH {cite:bakr-umayyad-state-1134715 p. 252}. Se había alojado en el marj en campaña con su ejército, y allí escribió su legado del califato a Umar ibn Abd al-Aziz {cite:bakr-umayyad-state-1134715 p. 261-262}."
  fr: "Un lieu du district militaire (jund) de Qinnasrin, où Sulayman ibn Abd al-Malik mourut un vendredi, dix jours avant la fin de Safar de l'an 99 AH {cite:bakr-umayyad-state-1134715 p. 252}. Il avait séjourné au marj lors d'une campagne avec son armée, et c'est là qu'il rédigea son legs du califat à Umar ibn Abd al-Aziz {cite:bakr-umayyad-state-1134715 p. 261-262}."
  ur: "قنصرین کے فوجی ضلع ⁦(جنڈ)⁩ میں ایک جگہ جہاں سلیمان بن عبد الملک کی وفات صفر کے اختتام سے دس دن پہلے سنہ 99 ہجری میں جمعہ کے دن ہوئی تھی۔ 252}۔ وہ اپنی فوج کے ساتھ مہم کے دوران مرج میں ٹھہرے تھے، اور وہاں اس نے عمر بن عبدالعزیز کو خلافت کی وصیت لکھی۔ 261-262}۔"
  tr: "Cund Qinnasrin'in eserlerinde bir yer; burada Süleyman bin Abdül-Malik, Cuma günü, Sefer'den on ay önce, doksan doksan dokuz yılında vefat etti {cite:bakr-umayyad-state-1134715, s. 252}. Kampında savaşçı olarak Al-Marj'da kalmış ve orada halifelik vasiyetini Ömer bin Abdülaziz'e yazmıştır {cite:bakr-umayyad-state-1134715, s. 261-262}."
  id: "Sebuah tempat dalam karya Jund Qinnasrin, tempat Sulayman ibn Abd al-Malik meninggal pada hari Jumat, sepuluh bulan sebelum Safar, tahun sembilan puluh sembilan {cite:bakr-umayyad-state-1134715, hlm. 252}. Ia tinggal di Al-Marj sebagai pejuang di kemahnya, dan di sana ia menulis surat wasiatnya untuk kekhalifahan kepada Umar ibn Abd al-Aziz {cite:bakr-umayyad-state-1134715, hlm. 261-262}."
