summary:
  ar: "مدينة في أرض النوبة على ضفة النيل، تقع أسفل من دنقلة بمسيرة خمسة أيام، ويعيش أهلها من الزراعة والصيد والتجارة. {cite:nuzhat-al-mushtaq-2002 p. 38}"
  en: "A town in Nubia on the bank of the Nile, five days' journey below Dunqula. Its people live by farming, fishing and trade. {cite:nuzhat-al-mushtaq-2002 p. 38}"
  es: "Un pueblo de Nubia a orillas del Nilo, a cinco días de viaje río abajo de Dunqula. Sus habitantes viven de la agricultura, la pesca y el comercio. {cite:nuzhat-al-mushtaq-2002 p. 38}"
  fr: "Une ville de Nubie, sur les rives du Nil, à cinq jours de voyage en aval de Dunqula. Ses habitants vivent de l'agriculture, de la pêche et du commerce. {cite:nuzhat-al-mushtaq-2002 p. 38}"
  ur: "دریائے نیل کے کنارے نوبیا کا ایک قصبہ، ڈنکولا سے نیچے پانچ دن کا سفر۔ اس کے لوگ کاشتکاری، ماہی گیری اور تجارت سے گزر بسر کرتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 38}"
