summary:
  ar: مدينة تُعرف بهرموز شهر، وهي قاعدة بلاد خوزستان، موضعها فسيح وهواؤها صحيح، وفيها أرزاق دارة وخيرات جمة، وأهلها من مياسير العرب المتحضرين. {cite:nuzhat-al-mushtaq-2002 p. 392}
  en: A city known as Hormuz-Shahr, the capital of Khuzistan, on a broad site with healthy air, abundant food and plenty; its people are wealthy and civilised. {cite:nuzhat-al-mushtaq-2002 p. 392}
  ur: خوزستان کا مرکزی شہر جسے ہرمز شہر بھی کہا جاتا تھا؛ ادریسی نے اس کی کشادگی، پیداوار اور خوش حال باشندوں کا ذکر کیا ہے۔ {cite:nuzhat-al-mushtaq-2002 p. 392}
  es: "Hormuz-Shahr, la capital de Juzestán, se encuentra en una amplia ensenada con aire puro, alimentos abundantes y prosperidad; sus habitantes son ricos y civilizados. {cite:nuzhat-al-mushtaq-2002 p. 392}"
  fr: "Hormuz-Shahr, capitale du Khuzistan, est une ville située sur un vaste territoire où règne un air pur, une nourriture abondante et une vie de prospérité; ses habitants sont riches et civilisés. {cite:nuzhat-al-mushtaq-2002 p. 392}"
  tr: "Bahramuz Şehr olarak bilinen bir şehir, Huzistan'ın başkenti olup, geniş konumu ve hoş iklimi ile bol geçim kaynakları ve bol mallara sahiptir; halkı medeni Arap gezginler arasındadır. {cite:nuzhat-al-mushtaq-2002 s. 392}"
  id: "Sebuah kota yang dikenal sebagai Bahramuz Shahr, yang merupakan ibu kota Khuzestan, dengan lokasi yang luas dan iklim yang menyenangkan, serta memiliki mata pencaharian yang melimpah dan barang-barang yang melimpah, serta penduduknya termasuk di antara pelancong Arab yang beradab. {cite:Nuzhat-al-Mushtaq-2002 hlm. 392}"
