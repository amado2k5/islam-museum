summary:
  ar: "موضع في اليمن نزل به الهادي في صفر 288هـ وأقام فيه حتى استهل ربيع الأول، وقضى فيه لامرأة على أبي العتاهية."
  en: "A place in Yemen where al-Hadi halted in Safar 288 AH and stayed until Rabi I began, and where he gave judgment for a woman against Abu al-Atahiya."
  ur: "یمن کی ایک جگہ جہاں ہادی صفر 288ھ میں اترے اور ربیع الاول شروع ہونے تک رہے، اور جہاں انہوں نے ابو العتاہیہ کے خلاف ایک عورت کے حق میں فیصلہ کیا۔"
  es: "Un lugar en Yemen donde al-Hadi se detuvo en Safar del año 288 de la Hégira y permaneció hasta que comenzó Rabi I, y donde dictó sentencia a favor de una mujer contra Abu al-Atahiya."
  fr: "Un lieu au Yémen où al-Hadi s'arrêta en Safar 288 AH et resta jusqu'au début de Rabi I, et où il rendit un jugement en faveur d'une femme contre Abu al-Atahiya."
  tr: "Yemen'de el-Hadi'nin 288 Hicri Sefer'inde yerleştiği ve Rabi'd-Awwal'ın başlangıcına kadar orada kaldığı, burada Ebu el-Atahiyye'ye karşı bir kadın için hüküm verdiği bir yer."
  id: "Sebuah tempat di Yaman tempat al-Hadi menetap di Safar 288 H dan tinggal di sana hingga awal Rabi' al-Awwal, di mana ia memerintah melawan Abu al-Atahiyah demi seorang wanita."
