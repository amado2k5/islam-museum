summary:
  ar: "مدينة أصبهان؛ عند البلاذري فتحها عبد الله بن بديل صلحاً بعد قتال على الخراج والجزية والأمان على الأنفس والأموال خلا ما في الأيدي من السلاح وسلمها إليه الفادوسفان بعد مبارزته."
  en: "Isbahan's city; in al-Baladhuri taken by Abdallah ibn Budayl by treaty after fighting — kharaj and jizya, safety of persons and wealth save arms in hand — surrendered by al-Fadhusfan after their duel."
  es: "La ciudad de Isbahan; en al-Baladhuri tomada por Abdallah ibn Budayl por tratado después de luchar —kharaj y jizya, seguridad de las personas y bienes excepto las armas en mano— se rindió por al-Fadhusfan después de su duelo."
  fr: "La ville d'Isbahan; à al-Baladhuri prise par Abdallah ibn Budayl par traité après un combat — kharaj et jizya, sécurité des personnes et des biens sauf les armes à la main — rendue par al-Fadhusfan après leur duel."
  ur: "اسبہان کا شہر؛ البلادوری میں عبداللہ ابن بدیل نے لڑائی کے بعد معاہدہ کے ذریعے لیا - خرج اور جزیہ، افراد کی حفاظت اور مال و دولت ہاتھ میں ہتھیار - الفدصوفان نے اپنی لڑائی کے بعد ہتھیار ڈال دیے۔"
  tr: "İsfahan şehri; el-Baladhuri tarafından, Abdullah ibn Babil vergiler, cizye ve can ve mal güvenliği için savaştıktan sonra elinde silah olmadan, Fadosufan tarafından elinde silah olmadan barışçıl bir şekilde ele geçirilmiştir."
  id: "Kota Isfahan; oleh al-Baladhuri, Abdullah ibn Babil merebutnya dengan damai setelah berperang tentang pajak, jizya, dan keselamatan atas nyawa serta harta benda, tanpa senjata di tangan, yang kemudian diserahkan Fadosufan kepadanya setelah duelnya."
