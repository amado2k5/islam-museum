summary:
  ar: "عاصمة أنشأها أكبر قرب آكره احتفاءً بمولد ابنه سليم، بدأ العمل فيها سنة 1571م، وهجرها البلاط سنة 1585م {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.135}."
  en: "A capital founded by Akbar near Agra to celebrate the birth of his son Salim, begun in 1571 and left by the court in 1585 {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.135}."
  es: "Una capital fundada por Akbar cerca de Agra para celebrar el nacimiento de su hijo Salim, iniciada en 1571 y abandonada por la corte en 1585 {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.135}."
  fr: "Une capitale fondée par Akbar près d'Agra pour célébrer la naissance de son fils Salim, commencée en 1571 et laissée par la cour en 1585 {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.135}."
  ur: "آگرہ کے قریب اکبر نے اپنے بیٹے سلیم کی پیدائش کا جشن منانے کے لیے ایک دارالحکومت قائم کیا تھا، جو 1571 میں شروع ہوا تھا اور 1585 میں عدالت نے چھوڑ دیا تھا"
  tr: "Akbar tarafından oğlu Selim'in doğumunu kutlamak için Akka yakınlarında kurulan bir başkent. Çalışmalar 1571 yılında başladı ve saray 1585'te burayı terk etti {cite:Brookes-gardens-of-paradise-1987 s.133} {cite:brookes-gardens-of-paradise-1987 s.135}."
  id: "Sebuah ibu kota yang didirikan oleh Akbar dekat Acre untuk merayakan kelahiran putranya Selim. Pekerjaan dimulai pada tahun 1571 M, dan istana meninggalkannya pada tahun 1585 {cite:Brookes-gardens-of-paradise-1987 hlm.133} {cite:brookes-gardens-of-paradise-1987 hlm.135}."
