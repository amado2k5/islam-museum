summary:
  ar: "موضع على طريق المدينة، يذكر الإدريسي أنه ميقات أهل المدينة، وفيه قوم قليل من العرب، ومنه إلى المدينة مسافة قريبة. {cite:nuzhat-al-mushtaq-2002 p. 142}"
  en: "A place on the Medina road that al-Idrisi names as the miqat for people of Medina, with a few Arabs living there, a short distance from the city. {cite:nuzhat-al-mushtaq-2002 p. 142}"
  es: "Un lugar en la carretera de Medina que al-Idrisi denomina el miqat para la gente de Medina, donde viven algunos árabes, a poca distancia de la ciudad. {cite:nuzhat-al-mushtaq-2002 p. 142}"
  fr: "Un lieu sur la route de Médine qu'al-Idrisi nomme le miqat des habitants de Médine, habité par quelques Arabes, à une courte distance de la ville. {cite:nuzhat-al-mushtaq-2002 p. 142}"
  ur: "مدینہ کی سڑک پر ایک جگہ جسے الادریسی نے مدینہ کے لوگوں کے لیے میقات کا نام دیا ہے، وہاں شہر سے تھوڑے فاصلے پر چند عرب رہتے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 142}"
  tr: "Medine yolunda bir yer, El-İdrisi'nin Medine halkının miqatı olarak bahsettiği bir yer, orada az sayıda Arap var ve oradan Medine'ye kısa bir mesafe vardır. {kaynak:nuzhat-al-mushtaq-2002 s. 142}"
  id: "Sebuah tempat di jalan menuju Madinah, yang disebut oleh Al-Idrisi sebagai miqat bagi masyarakat Madinah, dengan sejumlah kecil orang Arab di sana, dan dari sana ke Madinah jaraknya pendek. {cite:nuzhat-al-mushtaq-2002 hlm. 142}"
