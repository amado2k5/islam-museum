label: { ar: "المنصورة ⁦(السند)⁩", en: "al-Mansura (Sind)", es: "al-Mansura (Sind)", fr: "al-Mansura (Sind)", ur: "المنصورہ ⁦(سندھ)⁩", tr: "Mansoura (Sindh)", id: "Mansoura (Sindh)" }
summary:
  ar: "مدينة محدثة بناها المنصور من بني العباس فنُسبت إليه، وبناؤها من اللبن والآجر، فيها بساتين وزروع، وتجارها كثيرون، ودراهمها من الفضة والنحاس. {cite:nuzhat-al-mushtaq-2002 p. 169}"
  en: "A newly founded city built by al-Mansur of the Abbasids, who gave it his name. It is built of mud brick and fired brick, has gardens and fields, many merchants, and coins of silver and copper. {cite:nuzhat-al-mushtaq-2002 p. 169}"
  es: "Ciudad de reciente fundación, construida por al-Mansur de los abasíes, quien le dio su nombre. Está construida con adobe y ladrillo cocido, cuenta con jardines y campos, numerosos comerciantes y monedas de plata y cobre. {cite:nuzhat-al-mushtaq-2002 p. 169}"
  fr: "Une ville nouvellement fondée par al-Mansur, un Abbasside qui lui donna son nom. Elle est construite en briques de terre crue et en briques cuites, possède des jardins et des champs, de nombreux marchands et des pièces de monnaie en argent et en cuivre. {cite:nuzhat-al-mushtaq-2002 p. 169}"
  ur: "عباسیوں کے المنصور کا تعمیر کردہ ایک نیا شہر، جس نے اسے اپنا نام دیا۔ یہ مٹی کی اینٹوں اور فائر شدہ اینٹوں سے بنایا گیا ہے، اس میں باغات اور کھیت ہیں، بہت سے تاجر ہیں، اور چاندی اور تانبے کے سکے ہیں۔ {حوالہ: نزہت المشتاق-2002 ص۔ 169}"
  tr: "Abbasilerden al-Mansur tarafından inşa edilen, onun adını taşıyan yeni kurulan bir şehir. Yapımı çamur ve tuğladan yapılmıştır, meyve bahçeleri ve ürünleri, birçok tüccarı vardır ve dirhemleri gümüş ve bakırdır. {cite:nuzhat-al-mushtaq-2002 s. 169}"
  id: "Sebuah kota baru yang dibangun oleh al-Mansur dari Abbasiyah, dinamai menurut namanya. Bangunannya terbuat dari lumpur dan bata, memiliki kebun buah dan tanaman, banyak pedagang, dan dirhamnya dari perak dan tembaga. {cite:Nuzhat-al-Mushtaq-2002 hlm. 169}"
