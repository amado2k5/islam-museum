  ar: "بم بلد بكرمان؛ صالح أهلها الربيع بن زياد الحارثي ثم كفروا ونكثوا فافتتحها مجاشع بن مسعود."
  en: "Bamm of Kirman; its folk truced al-Rabi' ibn Ziyad, broke and apostatized, and Mujashi' ibn Mas'ud retook it."
