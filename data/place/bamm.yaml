  ur: "کرمان کا بام؛ اس کے لوگوں نے ربیع ابن زیاد کو توڑا اور مرتد کردیا اور مجاشی ابن مسعود نے اسے دوبارہ لے لیا۔"
  tr: "Bakman topraklarında; halkı El-Rabi bin Ziyad el-Harthi tarafından barıştırıldı, sonra inanmadılar ve verdikleri sözleri bozdular, böylece Mücashi bin Mes'ud burayı fethetti."
  id: "Di tanah Bakman; rakyatnya didamaikan oleh Al-Rabi' ibn Ziyad Al-Harthi, kemudian mereka tidak percaya dan mengingkari janji mereka, sehingga Mujashi' ibn Mas'ud menaklukkannya."
