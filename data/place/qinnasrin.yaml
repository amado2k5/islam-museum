label: { ar: "قنسرين", en: "Qinnasrin", es: "Qinnasrin", fr: "Qinnasrin", ur: "کناسرین" }
summary:
  ar: "قنسرين رأس جند قنسرين والعواصم؛ صالح أهلها أبا عبيدة على مثل صلح حمص ثم نقضوا ففتحها السمط بن الأسود الكندي؛ وكان بها حاضر تنوخ منذ أول نزولهم بالشام في خيم الشعر ثم ابتنوا المنازل فأسلم بعضهم وأقام على النصرانية بنو صالح بن حلوان من قضاعة ومنهم من أسلم أيام المهدي؛ وصارت هي وحمص جنداً واحداً، ومن كورها حلب ومنبج وحرّان وما والاها."
  en: "Qinnasrin, capital of the Qinnasrin-and-Awasim jund; its people compounded with Abu Ubayda on Hims's terms then broke faith, and al-Simt ibn al-Aswad al-Kindi retook it; it held the Tanukh hadir from their first settling in Syria in hair tents before they built houses — some converting while Banu Salih ibn Hulwan of Quda'a stayed Christian, some converting in al-Mahdi's days; it and Hims afterwards formed a single jund, its kuwar including Aleppo, Manbij, Harran and what adjoins them."
  es: "Qinnasrin, capital del jund de Qinnasrin y Awasim; su gente se alió con Abu Ubayda en los términos de Hims, luego rompió la promesa, y al-Simt ibn al-Aswad al-Kindi la reconquistó; mantuvo a los Tanukh hadir desde su primer asentamiento en Siria en tiendas de pelo antes de que construyeran casas; algunos se convirtieron mientras que Banu Salih ibn Hulwan de Quda'a permaneció cristiano, otros se convirtieron en los días de al-Mahdi; posteriormente, Qinnasrin y Hims formaron un único jund, cuyo kuwar incluía Alepo, Manbij, Harran y lo que colinda con ellos."
  fr: "Qinnasrin, capitale du jund de Qinnasrin et Awasim; ses habitants s'allièrent à Abu Ubayda selon les conditions de Hims, puis rompirent leur foi, et al-Simt ibn al-Aswad al-Kindi la reprit; elle abrita les Tanukh hadir depuis leur première installation en Syrie dans des tentes de poils avant qu'ils ne construisent des maisons — certains se convertissant tandis que les Banu Salih ibn Hulwan de Quda'a restaient chrétiens, d'autres se convertissant à l'époque d'al-Mahdi; elle et Hims formèrent ensuite un seul jund, son kuwar comprenant Alep, Manbij, Harran et ce qui les entoure."
  ur: "کناسرین، کناسرین اور اوسیم جنڈ کا دارالحکومت؛ اس کے لوگوں نے ابو عبیدہ کے ساتھ ہمس کی شرائط پر اتحاد کیا پھر ایمان توڑ دیا، اور السمط بن اسود الکندی نے اسے واپس لے لیا۔ اس نے تنوخ حدیر کو شام میں اپنے گھر بنانے سے پہلے ہی بالوں کے خیموں میں رکھا - کچھ نے مذہب تبدیل کیا جبکہ قدعہ کے بنو صالح بن حلوان عیسائی رہے، کچھ نے المہدی کے دنوں میں مذہب تبدیل کیا۔ اس کے اور اس کے بعد ہمس نے ایک واحد جنڈ تشکیل دیا، اس کے کوور بشمول حلب، منبج، حران اور ان سے ملحقہ چیزیں۔"
