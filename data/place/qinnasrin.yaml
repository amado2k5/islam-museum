summary:
  ar: "قنسرين رأس جند قنسرين والعواصم؛ صالح أهلها أبا عبيدة على مثل صلح حمص ثم نقضوا ففتحها السمط بن الأسود الكندي؛ وكان بها حاضر تنوخ منذ أول نزولهم بالشام في خيم الشعر ثم ابتنوا المنازل فأسلم بعضهم وأقام على النصرانية بنو صالح بن حلوان من قضاعة ومنهم من أسلم أيام المهدي؛ وصارت هي وحمص جنداً واحداً، ومن كورها حلب ومنبج وحرّان وما والاها."
  en: "Qinnasrin, capital of the Qinnasrin-and-Awasim jund; its people compounded with Abu Ubayda on Hims's terms then broke faith, and al-Simt ibn al-Aswad al-Kindi retook it; it held the Tanukh hadir from their first settling in Syria in hair tents before they built houses — some converting while Banu Salih ibn Hulwan of Quda'a stayed Christian, some converting in al-Mahdi's days; it and Hims afterwards formed a single jund, its kuwar including Aleppo, Manbij, Harran and what adjoins them."
