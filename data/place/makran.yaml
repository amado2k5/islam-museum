summary:
  ar: "مكران بلاد الساحل بين فارس والسند؛ فتحها سنان بن سلمة بن المحبق الهذلي عنوة ومصرها وقال ابن الكلبي فاتحها حكيم بن جبلة وفيها قال أعشى همدان وأنت تسير إلى مكران فمد شحط الورد والمصدر لم تك حاجتي مكران ولا الغزو فيها ولا المتجر."
  en: "Makran, the coastal land between Fars and Sind; stormed and garrisoned by Sinan ibn Salama — Ibn al-Kalbi names Hakim ibn Jabala — and mourned in A'sha Hamdan's famous verses."
  es: "Makrán, la tierra costera entre Fars y Sind; asaltada y guarnecida por Sinan ibn Salama —Ibn al-Kalbi menciona a Hakim ibn Jabala— y llorada en los famosos versos de A'sha Hamdan."
  fr: "Makran, la région côtière entre le Fars et le Sind; prise d'assaut et occupée par Sinan ibn Salama — Ibn al-Kalbi cite Hakim ibn Jabala — et pleurée dans les célèbres vers d'A'sha Hamdan."
  ur: "مکران، فارس اور سندھ کے درمیان ساحلی زمین؛ سنان ابن سلامہ نے حملہ کیا اور اسے گھیرے میں لے لیا - ابن الکلبی نے حکیم ابن جبلہ کا نام لیا - اور عائشہ ہمدان کی مشہور آیات میں ماتم کیا۔"
  tr: "Makan, İran ile Sindh arasında bir kıyı toprakıdır; Sinan ibn Salamah ibn al-Muhabak al-Hudhali tarafından zorla fethedildi ve Mısır'ı fethedildi. İbn el-Kalbi şöyle dedi: Hakim ibn Ciblah burayı fethetti ve içinde şöyle dedi: 'Hamdan'ı Makran'a göndereceğim, bu yüzden gülü ve kaynağı uzattım. Makran benim ihtiyacım değildi, oradaki fetih de ticaret değildi.'"
  id: "Makran adalah tanah pesisir antara Persia dan Sindh; wilayah ini ditaklukkan oleh Sinan ibn Salamah ibn al-Muhabbaq al-Hudhali dengan paksa, dan Mesirnya pun ditaklukkan. Ibn al-Kalbi berkata: Hakim ibn Jiblah menaklukkannya, dan dalam surat itu ia berkata: 'Aku akan mengirim Hamdan ke Makran, maka aku mengulurkan mawar dan sumbernya. Makran bukanlah kebutuhanku, bukan penaklukan di sana, bukan perdagangan.'"
