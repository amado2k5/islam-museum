summary:
  ar: "مدينة صغيرة على أول الصحراء فيها منبر وبربر وعرب متحضرون، وشربها من آبار وعيون قليلة، وتبعد عن البحرين أربع مراحل {cite:nuzhat-al-mushtaq-2002 p. 123}، {cite:nuzhat-al-mushtaq-2002 p. 124}."
  en: "A small town on the edge of the desert, with a pulpit, Berbers and settled Arabs. It drinks from few wells and springs, four stages from al-Bahrayn oasis {cite:nuzhat-al-mushtaq-2002 p. 123}, {cite:nuzhat-al-mushtaq-2002 p. 124}."
  es: "Un pequeño pueblo al borde del desierto, con un púlpito, bereberes y árabes asentados. Se abastece de pocos pozos y manantiales, a cuatro etapas del oasis de al-Bahrayn {cite:nuzhat-al-mushtaq-2002 p. 123}, {cite:nuzhat-al-mushtaq-2002 p. 124}."
  fr: "Une petite ville en bordure du désert, avec une chaire, des Berbères et des Arabes sédentarisés. Elle s'approvisionne en eau à quelques puits et sources, à quatre étapes de l'oasis d'al-Bahrayn {cite:nuzhat-al-mushtaq-2002 p. 123}, {cite:nuzhat-al-mushtaq-2002 p. 124}."
  ur: "صحرا کے کنارے پر ایک چھوٹا سا قصبہ جس میں منبر، بربر اور آباد عرب آباد تھے۔ یہ چند کنوؤں اور چشموں سے پیتا ہے، البحرین نخلستان سے چار مراحل۔ 123}، {حوالہ: نزہت المشتاق-2002 ص۔ 124}۔"
  tr: "Çölün kenarında küçük bir şehir; vaaz kürsüsü, Berberiler ve medeni Araplar, birkaç kuyu ve kaynaktan su içiyorlar ve Bahreyn'e dört aşama uzaklıktadır {cite:Nuzhat-al-Mushtaq-2002 s. 123}, {cite:Nuzhat-al-Mushtaq-2002 s. 124}."
  id: "Sebuah kota kecil di tepi gurun dengan mimbar, Berber, dan orang Arab beradab, minum dari beberapa sumur dan mata air, dan berjarak empat tahap dari Bahrain {cite:Nuzhat-al-Mushtaq-2002 hlm. 123}, {cite:Nuzhat-al-Mushtaq-2002 hlm. 124}."
