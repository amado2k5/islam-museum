summary:
  ar: "رامهرمز مدينة من كور الأهواز؛ هادنها أبو موسى ثم نقضت فصالحها أبو مريم الحنفي على ثمانمائة ألف درهم ثم غدروا ففتحها أبو موسى عنوة في آخر أيامه."
  en: "Ramhurmuz of al-Ahwaz; twice truced — Abu Maryam's eight-hundred-thousand compact — twice betrayed, and taken by force in Abu Musa's last days."
  es: "Ramhurmuz de al-Ahwaz; dos veces pactado en una tregua —el pacto de ochocientos mil de Abu Maryam—, dos veces traicionado y tomado por la fuerza en los últimos días de Abu Musa."
  fr: "Ramhurmuz d'al-Ahwaz; deux fois en paix — le pacte des huit cent mille d'Abu Maryam — deux fois trahi et pris par la force dans les derniers jours d'Abu Musa."
  ur: "الاحواز کا رامہرمز؛ ابو مریم کا آٹھ لاکھ کا معاہدہ - دو بار دھوکہ دیا گیا، اور ابو موسیٰ کے آخری دنوں میں زبردستی لے لیا گیا۔"
  tr: "Ramhormoz, Ahvaz ilçesinde bir şehirdir; Ebu Musa onu yatıştırmış, sonra iptal edilmiş ve Ebu Maryam el-Hanafi sekiz yüz bin dirhem karşılığında barıştırmıştır. Sonra ihanet etmişler ve Ebu Musa son günlerinde zorla fethetmiştir."
  id: "Ramhormoz adalah sebuah kota di distrik Ahvaz; Abu Musa memuaskannya, lalu dibatalkan, dan Abu Maryam al-Hanafi mendamaikannya dengan delapan ratus ribu dirham. Kemudian mereka mengkhianati, dan Abu Musa menaklukkannya secara paksa di hari-hari terakhirnya."
