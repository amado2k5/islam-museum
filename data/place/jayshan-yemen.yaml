summary:
  ar: "موضع في اليمن ذكر الراوي أن رجال إبراهيم بن خلف كانوا ينهبون جيشان وغيرها، ثم نزل به الهادي في ربيع الأول 288هـ ثلاثة أيام ووجه منه عاملاً إلى عدن."
  en: "A place in Yemen that the narrator says the men of Ibrahim ibn Khalaf had plundered, and where al-Hadi halted for three days in Rabi I 288 AH and sent a governor to Aden."
  ur: "یمن کی ایک جگہ جسے راوی کے مطابق ابراہیم بن خلف کے آدمی لوٹتے رہے تھے، اور جہاں ہادی ربیع الاول 288ھ میں تین دن ٹھہرے اور یہاں سے عدن کی طرف عامل بھیجا۔"
  es: "Un lugar en Yemen que, según el narrador, los hombres de Ibrahim ibn Khalaf habían saqueado, y donde al-Hadi se detuvo durante tres días en Rabi I del año 288 AH y envió un gobernador a Adén."
  fr: "Un lieu du Yémen que le narrateur dit que les hommes d'Ibrahim ibn Khalaf avaient pillé, et où al-Hadi s'arrêta pendant trois jours en Rabi I 288 AH et envoya un gouverneur à Aden."
  tr: "Yemen'de bir yerde, anlatıcı, İbrahim bin Halef'ın adamlarının iki orduyu ve diğerlerini yağmaladığını, ardından el-Hadi'nin 288 Hicri Rabi'el-Avval'da üç gün kaldığını ve onu Aden'e vali olarak gönderdiğini belirtmiştir."
  id: "Di sebuah tempat di Yaman, narator menyebutkan bahwa orang-orang Ibrahim ibn Khalaf biasa menjarah dua pasukan dan lainnya, lalu al-Hadi tinggal di Rabi' al-Awwal tahun 288 H selama tiga hari dan mengirimnya sebagai gubernur ke Aden."
