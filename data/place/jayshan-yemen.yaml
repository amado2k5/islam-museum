coordinate_note: "Al-Hamdani counts Jayshan among the cities of Yemen (mukhlaf Jayshan, Dhu Jayshan among the Murad wadis); the modern Jayshan district of Abyan governorate is the received continuation of the medieval mukhlaf. GeoNames Jayshan PPLA2 (district seat) at 14°15'07N 46°10'45E; some scholars place the Qarmatian Jayshan further north in Khawlan — the district point is given as the locality."
