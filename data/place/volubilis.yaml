  ar: "وليلى عند ياقوت مدينة بالمغرب قرب طنجة دخلها إدريس بن عبد الله سنة 172هـ ومات بها سنة 174هـ، وفي مدخل فاس أن إدريس بن إدريس مات بها سنة 213هـ {cite:mujam-al-buldan-sader-1995 5 p.384}."
  en: "Walila in Yaqut: a town in the Maghrib, near Tangier by his first placing, which Idris ibn Abd Allah entered in 172 AH and where he died in 174; his entry on Fas has Idris ibn Idris dying there in 213 {cite:mujam-al-buldan-sader-1995 5 p.384}."
  es: "Walila en Yaqut: una ciudad en el Magreb, cerca de Tánger según su primera ubicación, a la que Idris ibn Abd Allah entró en 172 AH y donde murió en 174; su entrada en Fas dice que Idris ibn Idris murió allí en 213 {cite:mujam-al-buldan-sader-1995 5 p.384}."
  fr: "Walila à Yaqut: une ville du Maghreb, près de Tanger, d'après son premier lieu d'installation, où Idris ibn Abd Allah entra en 172 AH et où il mourut en 174; son entrée sur Fas indique qu'Idris ibn Idris y mourut en 213 {cite:mujam-al-buldan-sader-1995 5 p.384}."
  ur: "یاقوت میں ولیلہ: مغرب کا ایک قصبہ، تانگیر کے قریب اپنی پہلی جگہ سے، جس میں ادریس بن عبداللہ 172 ہجری میں داخل ہوئے اور جہاں ان کی وفات 174 میں ہوئی؛ فاس پر ان کے اندراج میں ادریس بن ادریس کی موت 213 میں ہے"
