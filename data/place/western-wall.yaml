label: { ar: "حائط البراق", en: "Western Wall (al-Buraq wall)", es: "Muro Occidental (Muro de Al-Buraq)", fr: "Mur occidental (mur d'al-Buraq)", ur: "مغربی دیوار ⁦(البراق وال)⁩" }
summary:
  ar: "الجدار الغربي للحرم الشريف ببيت المقدس، ويسميه المسلمون حائط البراق، ويسميه اليهود حائط المبكى. يعرض الكتاب تقرير لجنة عصبة الأمم سنة 1930م، الذي جعل الحائط جزءاً من ساحة الحرم وملكه للمسلمين وقفاً، وأبقى للمصلين اليهود حرية الصلاة عنده دون حق عيني، ويرى الكتاب أن النزاع قد حُسم بذلك القرار {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
  en: "The Western Wall of the Haram al-Sharif in Jerusalem, called al-Buraq wall by Muslims and the Wailing Wall by Jews. The book reprints the 1930 League of Nations commission's ruling, which held the wall part of the Haram and waqf property of Muslims and left Jewish worshippers free to pray there without a property right; the book holds that this settled the dispute {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
  es: "El Muro Occidental del Haram al-Sharif en Jerusalén, llamado muro de al-Buraq por los musulmanes y Muro de las Lamentaciones por los judíos. El libro reproduce el fallo de la comisión de la Liga de las Naciones de 1930, que sostuvo que el muro formaba parte del Haram y era propiedad de los musulmanes, y dejó a los fieles judíos libres para rezar allí sin derecho de propiedad; el libro sostiene que esto resolvió la disputa {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
  fr: "Le Mur occidental du Haram al-Sharif à Jérusalem, appelé Mur al-Buraq par les musulmans et Mur des Lamentations par les juifs. L'ouvrage reproduit la décision de la commission de la Société des Nations de 1930, qui reconnaissait le mur comme faisant partie du Haram et propriété waqf des musulmans, et laissait aux fidèles juifs la liberté d'y prier sans droit de propriété; l'ouvrage affirme que cette décision a réglé le différend {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
  ur: "یروشلم میں حرم الشریف کی مغربی دیوار جسے مسلمانوں نے البراق دیوار اور یہودیوں کی طرف سے نوحہ کی دیوار کہا جاتا ہے۔ کتاب میں 1930 کے لیگ آف نیشن کمیشن کے فیصلے کو دوبارہ پرنٹ کیا گیا ہے، جس میں مسلمانوں کی حرم اور وقف املاک کی دیوار کا حصہ تھا اور یہودی عبادت گزاروں کو بغیر کسی جائیداد کے وہاں نماز پڑھنے کے لیے آزاد چھوڑ دیا گیا تھا۔ کتاب کا خیال ہے کہ اس سے یہ تنازعہ طے ہو گیا {حوالہ: بیت المقدس فی الاسلام ازہر ص۔ 85-86، 122}۔"
