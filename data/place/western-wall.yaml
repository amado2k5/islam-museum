summary:
  ar: "الجدار الغربي للحرم الشريف ببيت المقدس، ويسميه المسلمون حائط البراق، ويسميه اليهود حائط المبكى. يعرض الكتاب تقرير لجنة عصبة الأمم سنة 1930م، الذي جعل الحائط جزءاً من ساحة الحرم وملكه للمسلمين وقفاً، وأبقى للمصلين اليهود حرية الصلاة عنده دون حق عيني، ويرى الكتاب أن النزاع قد حُسم بذلك القرار {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
  en: "The Western Wall of the Haram al-Sharif in Jerusalem, called al-Buraq wall by Muslims and the Wailing Wall by Jews. The book reprints the 1930 League of Nations commission's ruling, which held the wall part of the Haram and waqf property of Muslims and left Jewish worshippers free to pray there without a property right; the book holds that this settled the dispute {cite:bayt-al-maqdis-fi-al-islam-azhar p. 85-86, 122}."
