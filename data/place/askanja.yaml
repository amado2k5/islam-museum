summary:
  ar: "مدينة كبيرة تتاخم طرف جبل منت جون، على ضفة النهر من الناحية الشرقية، حسنة البقعة كثيرة العيون والأنهار، ويذكر المؤلف أن بينها وبين إكريزا خمسة وثلاثين ميلا {cite:nuzhat-al-mushtaq-2002 p. 875}."
  en: "A large city bordering the edge of the Mount Mont Jūn range, on the eastern bank of a river, with many springs and streams; the author gives thirty-five miles from Igriza {cite:nuzhat-al-mushtaq-2002 p. 875}."
  es: "Una gran ciudad que limita con el borde de la cordillera del Monte Mont Jūn, en la orilla oriental de un río, con muchos manantiales y arroyos; el autor indica treinta y cinco millas desde Igriza {cite:nuzhat-al-mushtaq-2002 p. 875}."
  fr: "Une grande ville bordant le massif du Mont Jūn, sur la rive orientale d'une rivière, avec de nombreuses sources et ruisseaux; l'auteur indique trente-cinq miles d'Igriza {cite:nuzhat-al-mushtaq-2002 p. 875}."
  ur: "دریا کے مشرقی کنارے پر پہاڑ مونٹ جون کی حد کے کنارے سے متصل ایک بڑا شہر، جس میں بہت سے چشمے اور ندیاں ہیں۔ مصنف ایگریزا سے پینتیس میل بتاتا ہے {حوالہ: نزہت المشتاق-2002 ص۔ 875}۔"
