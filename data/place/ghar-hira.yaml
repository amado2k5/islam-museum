label: { en: "Ghar Hira (Cave of Hira)", ar: "غار حراء", es: "Ghar Hira (Cueva de Hira)", fr: "Ghar Hira (Grotte de Hira)", ur: "غار حرا ⁦(غار حرا)⁩", tr: "Hira Mağarası", id: "Gua Hira" }
summary:
  en: "A small cave on Jabal al-Nur about two miles from Mecca — four cubits long and a cubit and three-quarters wide — where the Prophet used to retreat for worship during Ramadan before prophethood."
  ar: "غار صغير في جبل النور على نحو ميلين من مكة، طوله أربعة أذرع وعرضه ذراع وثلاثة أرباع ذراع؛ كان النبي يعتكف فيه في رمضان قبل النبوة، ومعه أهله قريباً منه."
  es: "Una pequeña cueva en Jabal al-Nur, a unos tres kilómetros de La Meca, de cuatro codos de largo y un codo y tres cuartos de ancho, donde el Profeta solía retirarse para orar durante el Ramadán antes de convertirse en profeta."
  fr: "Une petite grotte sur Jabal al-Nur à environ deux miles de La Mecque — quatre coudées de long et une coudée et trois quarts de large — où le Prophète avait l'habitude de se retirer pour prier pendant le Ramadan avant la prophétie."
  ur: "مکہ سے تقریباً دو میل کے فاصلے پر جبل النور پر ایک چھوٹی سی غار - چار ہاتھ لمبی اور ایک ہاتھ اور تین چوتھائی چوڑائی - جہاں نبی نبوت سے پہلے رمضان میں عبادت کے لیے اعتکاف کیا کرتے تھے۔"
  tr: "Mekke'den yaklaşık iki mil uzaklıktaki Nur Dağı'nda, dört arşın uzunluğunda, bir arşın genişliğinde ve üç çeyrek arşın küçük bir mağara; Peygamber, peygamberlikten önce Ramazan ayında ailesiyle birlikte orada i'tikaf yapardı."
  id: "Sebuah gua kecil di Gunung Noor sekitar dua mil dari Mekah, panjangnya empat hasta, lebar satu hasta, dan tiga perempat hasta; Nabi biasa melakukan i'tikaf di sana selama Ramadan sebelum kenabian, ditemani oleh keluarganya di dekatnya."
