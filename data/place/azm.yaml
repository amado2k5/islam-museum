summary:
  ar: "مدينة متحضرة على النهر لها سوق متحركة، وبها بيع وشراء لمن يأتي من فارس، وتبعد عن الأهواز مرحلة. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  en: "A civilised town on the river with a moving market for trade with those coming from Fars, one stage from al-Ahwaz. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  es: "Una ciudad civilizada a orillas del río, con un mercado ambulante para el comercio con quienes venían de Fars, a una etapa de al-Ahwaz. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  fr: "Une ville civilisée au bord du fleuve, dotée d'un marché ambulant pour le commerce avec les populations venant de Fars, à une étape d'al-Ahwaz. {cite:nuzhat-al-mushtaq-2002 p. 398}"
  ur: "دریا کے کنارے ایک مہذب قصبہ جس میں فارس سے آنے والوں کے ساتھ تجارت کے لیے ایک منڈی ہے، الاحواز سے ایک مرحلہ۔ {حوالہ: نزہت المشتاق-2002 ص۔ 398}"
  tr: "Nehir kenarında, hareketli bir pazarı olan, Pers'ten gelenlerin alım satım imkanı sunan medeni bir şehir ve Ahvaz'a bir adım uzaklıkta. {cite:nuzhat-al-mushtaq-2002 s. 398}"
  id: "Sebuah kota beradab di tepi sungai dengan pasar bergerak, di mana tersedia pembelian dan penjualan bagi mereka yang datang dari Persia, dan hanya selangkah dari Ahvaz. {cite:Nuzhat-al-Mushtaq-2002 hlm. 398}"
