summary:
  ar: "مدينة في الأندلس تبعد عن طليطلة شرقاً تسع مراحل، ويذكر الإدريسي أنها بين جنوب وشرق من طليطلة في طرق متعددة. {cite:nuzhat-al-mushtaq-2002 p. 536}"
  en: "A city of al-Andalus nine stages east of Toledo, which al-Idrisi places along several roads from Toledo. {cite:nuzhat-al-mushtaq-2002 p. 536}"
  es: "Una ciudad de al-Ándalus situada a nueve etapas al este de Toledo, que al-Idrisi ubica a lo largo de varias rutas desde Toledo. {cita: Nuzhat-al-Mushtaq-2002 p. 536}"
  fr: "Une ville d'al-Andalus située à neuf étapes à l'est de Tolède, qu'al-Idrisi situe le long de plusieurs routes partant de Tolède. {cite: Nuzhat-al-Mushtaq-2002 p. 536}"
  ur: "الاندلس کا ایک شہر ٹولیڈو کے مشرق میں نو مراحل پر ہے، جسے الادریسی ٹولیڈو سے کئی سڑکوں کے ساتھ رکھتا ہے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 536}"
  tr: "Al-Andalus'ta Toledo'nun dokuz basamak doğusunda bulunan bir şehir vardır ve Al-Idrisi, Toledo'nun güneyi ile doğusu arasında birden fazla güzergah üzerinde yer aldığını belirtir. {cite:nuzhat-al-mushtaq-2002 s. 536}"
  id: "Sebuah kota di Al-Andalus terletak sembilan langkah di timur Toledo, dan Al-Idrisi menyebutkan bahwa kota ini terletak di antara selatan dan timur Toledo melalui beberapa rute. {cite:nuzhat-al-mushtaq-2002 hlm. 536}"
