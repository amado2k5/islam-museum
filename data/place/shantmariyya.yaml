summary:
  ar: "مدينة متوسطة القدر على معظم البحر الأعظم، فيها مرسى يدخله المد، وفيها المراكب واردة وصادرة، وتبعد عن شلب ثمانية وعشرين ميلاً. {cite:nuzhat-al-mushtaq-2002 p. 543}"
  en: "A medium-sized town on the Atlantic coast with a harbour the tide enters, where ships come and go; about twenty-eight miles from Silves. {cite:nuzhat-al-mushtaq-2002 p. 543}"
  es: "Una ciudad de tamaño mediano en la costa atlántica con un puerto donde entra la marea y donde los barcos entran y salen; a unas veintiocho millas de Silves. {cite:nuzhat-al-mushtaq-2002 p. 543}"
  fr: "Ville de taille moyenne sur la côte atlantique, dotée d'un port où entrent et sortent les navires; à environ 45 kilomètres de Silves. {cite:nuzhat-al-mushtaq-2002 p. 543}"
  ur: "بحر اوقیانوس کے ساحل پر ایک درمیانے درجے کا قصبہ جس میں بندرگاہ کے ساتھ جوار داخل ہوتا ہے، جہاں بحری جہاز آتے جاتے ہیں۔ سلوز سے تقریباً اٹھائیس میل۔ {حوالہ: نزہت المشتاق-2002 ص۔ 543}"
  tr: "Büyük Deniz'in büyük bölümünde orta büyüklükte bir şehir olan bu şehir, gelgitle giren bir limana sahiptir, gemiler gelir ve gider ve Shalb'a yirmi sekiz mil uzaklıktadır. {cite:nuzhat-al-mushtaq-2002 s. 543}"
  id: "Kota berukuran sedang di sebagian besar Laut Besar, memiliki pelabuhan yang masuk ke air pasang, kapal-kapal datang dan pergi, dan berjarak dua puluh delapan mil dari Shalb. {cite:Nuzhat-al-Mushtaq-2002 hlm. 543}"
