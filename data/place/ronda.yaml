summary:
  ar: "رندة من مدن غرب مالقة الحصينة؛ في جمادى الأولى سنة تسعين وثمانمائة نازلها صاحب قشتالة وقد خرج أهلها إلى نصرة ذكوان فهدم أسوارها وخرجوا على الأمان وطاعت له جميع تلك البلاد ولم يبق بغربي مالقة إلا من دخل في طاعته وتحت ذمته {cite:nafh-tib-maqqari p. 520}."
  en: "Ronda, the strong city west of Malaga; besieged in Jumada I 890 while its men were away relieving Cartama, it surrendered on aman and the whole west-Malaga country followed {cite:nafh-tib-maqqari p. 520}."
  es: "Ronda, la ciudad fuerte al oeste de Málaga; sitiada en Jumada I 890 mientras sus hombres estaban fuera socorriendo a Cártama, se rindió el amán y todo el país del oeste de Málaga la siguió {cite:nafh-tib-maqqari p. 520}."
  fr: "Ronda, la ville forte à l'ouest de Malaga; assiégée en Jumada I 890 alors que ses hommes étaient partis secourir Cartama, elle se rendit à aman et tout le pays de l'ouest de Malaga suivit {cite:nafh-tib-maqqari p. 520}."
  ur: "رونڈا، ملاگا کے مغرب میں مضبوط شہر؛ جمعہ اول 890 میں اس کا محاصرہ کیا گیا جب اس کے آدمی کارٹاما سے فارغ ہو رہے تھے، اس نے امان پر ہتھیار ڈال دیے اور پورا مغربی ملاگا ملک اس کے پیچھے چل پڑا۔ 520}۔"
