summary:
  ar: "مدينة ليست كبيرة ولا كثيرة الخلق، وأكثرها خراب، وأهلها قليلون، يعيشون من الذرة والشعير والسمك واللحوم، وتبعد عن منقونة أربعة أيام في البر. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  en: "A town that is neither large nor populous, and mostly in ruins. Its few people live on sorghum, barley, fish and meat. Four days by land from Manquna. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  es: "Un pueblo que no es ni grande ni populoso, y que en su mayor parte está en ruinas. Sus pocos habitantes viven de sorgo, cebada, pescado y carne. A cuatro días por tierra desde Manquna. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  fr: "Une ville ni grande ni peuplée, et en grande partie en ruines. Ses quelques habitants vivent de sorgho, d'orge, de poisson et de viande. À quatre jours de route de Manquna. {cite:nuzhat-al-mushtaq-2002 p. 45}"
  ur: "ایک ایسا قصبہ جو نہ تو بڑا ہے اور نہ ہی آبادی والا، اور زیادہ تر کھنڈرات میں۔ اس کے چند لوگ جوار، جو، مچھلی اور گوشت پر گزارہ کرتے ہیں۔ منقونہ سے زمینی راستے سے چار دن۔ {حوالہ: نزہت المشتاق-2002 ص۔ 45}"
