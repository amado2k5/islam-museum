label: { ar: "بحيرة تنيس", en: "Lake Tinnis", es: "Lago Tinnis", fr: "Lac Tinnis", ur: "جھیل ٹینس", tr: "Tenis Gölü", id: "Danau Tenis" }
summary:
  ar: "بحيرة يصب فيها النيل، يكون ماؤها عذباً في الصيف إذا امتد النيل، ويغلب عليه ماء البحر في الشتاء، وفيها أنواع من السمك، ويذكر الإدريسي أن فيها قصة لجنتين لابني أتريب. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  en: "A lake fed by the Nile, sweet in summer when the flood spreads and salt in winter when sea water prevails; it holds many fish, and al-Idrisi tells of two gardens said to have belonged to the sons of Atrib. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  es: "Un lago alimentado por el Nilo, dulce en verano cuando la crecida se extiende y salado en invierno cuando predomina el agua de mar; alberga muchos peces, y al-Idrisi habla de dos jardines que, según se dice, pertenecieron a los hijos de Atrib. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  fr: "Un lac alimenté par le Nil, doux en été lors des crues et salé en hiver lorsque l'eau de mer prédomine; il abrite de nombreux poissons, et al-Idrisi mentionne deux jardins qui auraient appartenu aux fils d'Atrib. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  ur: "ایک جھیل جو نیل کی طرف سے پلائی جاتی ہے، گرمیوں میں میٹھی جب سیلاب پھیلتا ہے اور سردیوں میں نمکین جب سمندر کا پانی غالب ہوتا ہے۔ اس میں بہت سی مچھلیاں ہیں، اور ادریسی دو باغات کے بارے میں بتاتے ہیں جن کے بارے میں کہا جاتا ہے کہ یہ بنی عطریب کے تھے۔ {حوالہ: نزہت المشتاق-2002 ص۔ 338}"
  tr: "Nil Nehri'nin aktığı bir göldür, yazın Nil uzarken suyu taze olur ve kışın deniz suyu hakimdir. Çeşitli balık türleri içerir. El-İdrisi, Atrib'in oğullarına ait iki bahçenin hikayesini içerdiğini belirtir. {kaynak:nuzhat-al-mushtaq-2002 s. 338}"
  id: "Danau tempat Sungai Nil mengalir, airnya segar di musim panas saat Sungai Nil membentang, dan didominasi oleh air laut di musim dingin. Di sini terdapat berbagai jenis ikan. Al-Idrisi menyebutkan bahwa danau ini berisi kisah dua taman milik putra-putra Atrib. {cite:Nuzhat-al-Mushtaq-2002 hlm. 338}"
