summary:
  ar: "بحيرة يصب فيها النيل، يكون ماؤها عذباً في الصيف إذا امتد النيل، ويغلب عليه ماء البحر في الشتاء، وفيها أنواع من السمك، ويذكر الإدريسي أن فيها قصة لجنتين لابني أتريب. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  en: "A lake fed by the Nile, sweet in summer when the flood spreads and salt in winter when sea water prevails; it holds many fish, and al-Idrisi tells of two gardens said to have belonged to the sons of Atrib. {cite:nuzhat-al-mushtaq-2002 p. 338}"
  es: "Un lago alimentado por el Nilo, dulce en verano cuando la crecida se extiende y salado en invierno cuando predomina el agua de mar; alberga muchos peces, y al-Idrisi habla de dos jardines que, según se dice, pertenecieron a los hijos de Atrib. {cite:nuzhat-al-mushtaq-2002 p. 338}"
