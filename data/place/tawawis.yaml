summary:
  ar: "مدينة عامرة داخل حائط بخارا، أكبر منبراً في هذه الناحية، يقصدها الناس والتجار من كل مكان، ويُجلب إليها كثير من الأمتعة. {cite:nuzhat-al-mushtaq-2002 p. 495}"
  en: "A populous town inside the walls of Bukhara, with the largest pulpit in the district, visited by people and merchants from everywhere, with much goods brought in. {cite:nuzhat-al-mushtaq-2002 p. 495}"
  es: "Una ciudad populosa dentro de las murallas de Bujará, con el púlpito más grande del distrito, visitada por gente y comerciantes de todas partes, con gran cantidad de mercancías que llegaban. {cite:nuzhat-al-mushtaq-2002 p. 495}"
  fr: "Une ville populeuse à l'intérieur des remparts de Boukhara, avec la plus grande chaire du district, visitée par des gens et des marchands venus de partout, et d'où provenaient de nombreuses marchandises. {cite:nuzhat-al-mushtaq-2002 p. 495}"
  ur: "بخارا کی دیواروں کے اندر ایک آبادی والا قصبہ، جس میں ضلع کا سب سے بڑا منبر ہے، جس میں ہر جگہ سے لوگ اور تاجر آتے تھے، بہت سا سامان لایا جاتا تھا۔ 495}"
  tr: "Buhara'nın en büyük vaaz kürsüsü olan Buhara Duvarı'nın içinde hareketli bir şehir; her yerden gelen insanlar ve tüccarlar tarafından çekilir, birçok mal getirir. {kaynak:nuzhat-al-mushtaq-2002 s. 495}"
  id: "Sebuah kota yang ramai di dalam Tembok Bukhara, mimbar terbesar di daerah ini, menarik orang dan pedagang dari berbagai mana, membawa banyak barang. {cite:Nuzhat-al-Mushtaq-2002 hlm. 495}"
