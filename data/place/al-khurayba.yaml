summary:
  ar: "عند البلاذري: موضع مرّ به خالد بعد قتال الأبلة ففتحه وسبى من فيه واستخلف فيه — فيما ذكر الكلبي — شريح بن عامر بن قين من بني سعد بن بكر بن هوازن وكانت مسلحة للعجم."
  en: "In al-Baladhuri: a site Khalid passed after the Ubulla fight, opened and took captive those in it, leaving there — per al-Kalbi — Shurayh ibn Amir ibn Qayn of Banu Sa'd ibn Bakr ibn Hawazin; it had been a frontier post of the Persians."
  es: "En al-Baladhuri: un lugar por el que pasó Khalid después de la batalla de Ubulla, que abrió y capturó a quienes se encontraban allí, dejando allí —según al-Kalbi— a Shurayh ibn Amir ibn Qayn de Banu Sa'd ibn Bakr ibn Hawazin; había sido un puesto fronterizo de los persas."
  fr: "Dans al-Baladhuri: un site que Khalid a traversé après le combat d'Ubulla, a ouvert et a pris en otage ceux qui s'y trouvaient, laissant là — selon al-Kalbi — Shurayh ibn Amir ibn Qayn de Banu Sa'd ibn Bakr ibn Hawazin; c'était un poste frontière des Perses."
  ur: "البلادوری میں ہے: ابولہ کی لڑائی کے بعد خالد ایک جگہ سے گزرا، کھولا اور اس میں موجود لوگوں کو اسیر کر کے وہاں سے چلا گیا — فی الکلبی — بنو سعد بن بکر بن ہوازن کے شریح بن عامر بن قین؛ یہ فارسیوں کی سرحدی چوکی تھی۔"
  tr: "Al-Baladhuri'ye göre: Halid'in Al-Ablah Savaşı'ndan sonra geçtiği, ele geçirdiği, oradakileri yakaladığı ve — Al-Kalbi'nin belirttiği gibi — Banu Sa'd ibn Bakr ibn Hawazin'den Shurayh ibn Amir ibn Qayn'ı atadığı ve Arap olmayanlarla donatıldığı bir yer."
  id: "Menurut Al-Baladhuri: sebuah tempat yang dilalui Khalid setelah pertempuran Al-Ablah, merebutnya, menangkap mereka yang ada di sana, dan menunjuk — seperti yang disebutkan oleh Al-Kalbi — Shurayh ibn Amir ibn Qayn dari Banu Sa'd ibn Bakr ibn Hawazin, dan tempat itu dipersenjatai oleh non-Arab."
