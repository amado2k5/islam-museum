summary:
  ar: الرقة على الفرات من أعمال الجزيرة؛ فتحها إياد بن غنم صلحاً بعد خمسة أيام من الحصار على أنفسهم وأموالهم ومدينتهم وأقرّ
    الأرض في أيديهم على الخراج وكتب لهم كتاب الأمان بشروط عدم إحداث كنيسة ولا إظهار ناقوس ولا باعوث ولا صليب؛ وصار بجوارها
    الرافقة التي بنيت سنة 155 على بناء مدينة السلام فسكنها جند خراسان وبنى الرشيد قصورها ونقل إليها علي بن سليمان أسواق الرقة.
  en: al-Raqqa on the Euphrates in the Jazira; Iyad ibn Ghanm took it by treaty after five days of siege — lives, wealth and
    city secured, the land left in their hands on kharaj — writing them an aman forbidding new churches and the display of
    clapper, paschal or cross; beside it rose al-Rafiqa, built in year 155 on Madinat al-Salam's model for the Khurasani army,
    al-Rashid building its palaces while Ali ibn Sulayman moved al-Raqqa's markets into the space between.
  es: "Al-Raqqa, a orillas del Éufrates en la región de Jazira, fue tomada por tratado por Iyad ibn Ghanm tras cinco días de asedio, asegurando vidas, riquezas y la ciudad, y dejando la tierra en sus manos en kharaj. Iyad les redactó un aman que prohibía la construcción de nuevas iglesias y la exhibición de badajos, estandartes pascuales o cruces. Junto a ella se alzó Al-Rafiqa, construida en el año 155 según el modelo de Madinat al-Salam para el ejército de Jorasán, mientras Al-Rashid construía sus palacios y Ali ibn Sulayman trasladaba los mercados de Al-Raqqa al espacio intermedio."
  fr: "al-Raqqa sur l'Euphrate dans la Jazira; Iyad ibn Ghanm la prit par traité après cinq jours de siège — vies, richesses et ville assurées, la terre laissée entre leurs mains sur kharaj — leur rédigeant un aman interdisant de nouvelles églises et l'affichage de clapet, pascal ou croix; à côté d'elle s'éleva al-Rafiqa, construite en l'an 155 sur le modèle de Madinat al-Salam pour l'armée du Khorasan, al-Rashid construisant ses palais tandis qu'Ali ibn Sulayman déplaça les marchés d'al-Raqqa dans l'espace entre les deux."
  ur: "جزیرہ میں فرات پر الرقہ؛ عیاض بن غنم نے پانچ دن کے محاصرے کے بعد اسے معاہدہ کے ذریعے لے لیا — جان، مال اور شہر محفوظ ہو گئے، زمین ان کے ہاتھ میں خرج پر چھوڑ دی گئی — انہیں ایک امان لکھ کر نئے گرجا گھروں اور تالی بجانے، پاسچل یا صلیب کی نمائش سے منع کیا۔ اس کے ساتھ ہی گلاب الرفیقہ، جو خراسانی فوج کے لیے مدینۃ السلام کے ماڈل پر سال 155 میں تعمیر کیا گیا تھا، الرشید نے اس کے محلات تعمیر کیے جب کہ علی ابن سلیمان نے الرقہ کے بازاروں کو درمیان کی جگہ میں منتقل کیا۔"
  tr: "Fırat üzerindeki Rakka, adanın topraklarının bir parçasıdır; İyad bin Ghanam, kendilerine, servetlerine ve şehirlerine karşı beş gün süren kuşatmanın ardından burayı barışçıl bir şekilde fethetti. Onlara toprakları haraç olarak verdi ve kilise kurulmaması, çan çekilmemesi ve haç işareti yapılmaması şartıyla bir güvenlik mektubu yazdı. Yanında 155 Hicri yılında Barış Şehri'ni inşa etmek için inşa edilen Rafka geldi. Horasan'ın askerleri oraya yerleşti, El-Reşid saraylarını inşa etti ve Ali bin Süleyman Rakka pazarlarını buraya taşıdı."
  id: "Raqqa di Sungai Efrat merupakan bagian dari wilayah pulau tersebut; Iyad ibn Ghanam menaklukkannya dengan damai setelah lima hari pengepungan terhadap diri mereka sendiri, kekayaan mereka, dan kota mereka. Ia memberikan tanah tersebut sebagai upeti dan menulis surat keamanan dengan syarat bahwa tidak ada gereja yang didirikan, tidak ada lonceng dikibarkan, maupun tanda salib. Di sebelahnya terdapat Rafqa, yang dibangun pada tahun 155 H untuk membangun Kota Damai. Para tentara Khurasan menetap di sana, Al-Rashid membangun istana-istananya, dan Ali ibn Sulayman memindahkan pasar Raqqa ke sana."
