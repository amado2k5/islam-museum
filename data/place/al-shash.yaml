  ar: "الشاش بلاد ما وراء النهر وملكها بالطاربند؛ فتح قتيبة عامتها وبلغ أسبيجاب وكان فتح حصن أسبيجاب قديماً ثم غلب عليه الترك ومعهم قوم من أهل الشاش ثم فتحه نوح بن أسد في خلافة المعتصم وبنى حوله سوراً يحيط بكروم أهله ومزارعهم."
  en: "al-Shash beyond the river, its king at Tarband; Qutayba took most of it to Isbijab, whose old fort the Turks held with Shash folk till Nuh ibn Asad's conquest under al-Mu'tasim — he walled it round its people's vines and farms."
