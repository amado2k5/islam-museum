summary:
  ar: الشاش بلاد ما وراء النهر وملكها بالطاربند؛ فتح قتيبة عامتها وبلغ أسبيجاب وكان فتح حصن أسبيجاب قديماً ثم غلب عليه الترك
    ومعهم قوم من أهل الشاش ثم فتحه نوح بن أسد في خلافة المعتصم وبنى حوله سوراً يحيط بكروم أهله ومزارعهم.
  en: al-Shash beyond the river, its king at Tarband; Qutayba took most of it to Isbijab, whose old fort the Turks held with
    Shash folk till Nuh ibn Asad's conquest under al-Mu'tasim — he walled it round its people's vines and farms.
  es: "Al-Shash se encontraba al otro lado del río, con su rey en Tarband; Qutayba tomó la mayor parte del territorio y la trasladó a Isbijab, cuya antigua fortaleza fue controlada por los turcos junto con la gente de Shash hasta la conquista de Nuh ibn Asad bajo el mando de al-Mu'tasim, quien la amuralló alrededor de los viñedos y las granjas de su gente."
  fr: "al-Shash au-delà du fleuve, son roi à Tarband; Qutayba en prit la plus grande partie à Isbijab, dont l'ancien fort fut tenu par les Turcs avec les habitants de Shash jusqu'à la conquête de Nuh ibn Asad sous al-Mu'tasim — il l'entoura de murs autour des vignes et des fermes de ses habitants."
