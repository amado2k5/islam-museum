summary:
  ar: "آق سراي، أي «القصر الأبيض»، قصر قرب جرجانج ⁦(أورجنج)⁩ في خوارزم، ما زال يُذكر في «الشيبانيات»، وهو غير القصر الذي بُني لتيمور باسم مماثل في شهر سبز {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  en: "Ak Saray, 'White Palace', a palace near Gurgandj (Urgench) in Khwarazm, still mentioned in the Shaybaniade. It is not the palace of the same name built for Timur at Shahr-i Sabz {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  es: "Ak Saray, «Palacio Blanco», un palacio cerca de Gurgandj (Urgench) en Khwarazm, todavía mencionado en la Shaybaniade. No es el palacio del mismo nombre construido para Timur en Shahr-i Sabz {cite:encyclopaedia-of-islam-2 vol. 1 p. 334}."
  fr: "Ak Saray, ou « Palais Blanc », est un palais situé près de Gurgandj (Urgench) au Khwarezm, encore mentionné dans la Shaybaniade. Il ne s'agit pas du palais du même nom construit pour Tamerlan à Shahr-i Sabz (voir: Encyclopaedia of Islam, vol. 1, p. 334)."
  ur: "اک سراے، 'سفید محل'، خوارزم میں گرگنڈج ⁦(ارجینچ)⁩ کے قریب ایک محل، جس کا ذکر اب بھی شیبانی میں ملتا ہے۔ یہ اسی نام کا محل نہیں ہے جو تیمور کے لیے شہر سبز میں بنایا گیا تھا۔ 1 ص۔ 334}۔"
  tr: "Aq Sarai, yani \"Beyaz Saray\", Harezm'de Gircanj (Urang) yakınlarında bulunan bir saraydır ve hâlâ \"Şeybaniyat\"ta anılmaktadır; bu, Sabz ayında benzer isimle Timur için inşa edilen saraydan farklıdır {cite:encyclopaedia-of-Islam-2 cilt 1, s. 334}."
  id: "Aq Sarai, yang berarti \"Istana Putih,\" adalah sebuah istana dekat Girjanj (Urang) di Khwarezm, yang masih disebutkan dalam \"Shaybaniyat,\" yang berbeda dari istana yang dibangun untuk Timur dengan nama serupa pada bulan Sabz {cite:encyclopaedia-of-Islam-2 vol. 1, hlm. 334}."
