id: practice/dua-bedtime-core
class: practice
kind: ritual
label:
  ar: "عند النوم: الأصول"
  en: "At bedtime: the core reports"
  ur: "نیند کے وقت: بنیادی روایات"
  es: "A la hora de acostarse: los informes principales"
  fr: "Au coucher du soleil: les principaux rapports"
summary:
  ar: "أول ما أورده النووي في باب ما يقال إذا أراد النوم واضطجع: «باسمك اللهم أحيا وأموت»، والتسبيح والتحميد والتكبير، ونفض الفراش، والمعوذات، وآية الكرسي، ودعاء البراء. {cite:al-adhkar-nawawi-arnaut-1994 p. 89}"
  en: "The first part of what al-Nawawi gives in the chapter on what is said when going to sleep: the wording about life and death, glorifying, praising and magnifying, shaking out the bed, the refuge surahs, the verse of the Throne, and al-Bara's supplication. {cite:al-adhkar-nawawi-arnaut-1994 p. 89}"
  ur: "نیند کے باب میں نووی نے ابتدا میں جو ذکر کیا: زندگی اور موت کے الفاظ، تسبیح و تحمید و تکبیر، بستر جھاڑنا، معوذات، آیت الکرسی اور براء کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 89}"
  es: "La primera parte de lo que al-Nawawi ofrece en el capítulo sobre lo que se dice al irse a dormir: la formulación sobre la vida y la muerte, la glorificación, la alabanza y la magnificación, el sacudir la cama, las suras del refugio, el versículo del Trono y la súplica de al-Bara. {cite:al-adhkar-nawawi-arnaut-1994 p. 89}"
  fr: "La première partie du chapitre consacré aux invocations avant de s'endormir, selon al-Nawawi, comprend les formules relatives à la vie et à la mort, les glorifications, les louanges et les magnifications, le rituel de secouer le lit, les sourates de refuge, le verset du Trône et l'invocation d'al-Bara. {cite:al-adhkar-nawawi-arnaut-1994 p. 89}"
