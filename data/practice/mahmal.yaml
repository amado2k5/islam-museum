summary:
  ar: "هودج فارغ مزخرف كان يركب على جمل في مقدمة قافلة الحجاج، خالياً لا راكب فيه إذ هو رمز لا مركوب؛ أشهرها محمل مصر الذي كان يخرج من القاهرة حاملاً كسوة الكعبة إلى مكة بموكب عظيم حتى مطالع القرن العشرين، وله مثله في دمشق واليمن."
  en: "An empty decorated litter borne on a camel at the head of the Hajj caravan — a symbol, not a seat. The most famous was Egypt's mahmal, which left Cairo in a great procession carrying the kiswah to Mecca until the early twentieth century; Damascus and Yemen had their own."
  ur: "محمل، اونٹھ پر سوار خالی مزین محفل جو حج قافلے کی پیش بندی میں چلتی ہے — علامت ہے، سوار نہیں؛ سب سے مشہور مصر کا محمل تھا جو قاہرہ سے عظیم جلوس کے ساتھ کسوہ لے کر مکہ جاتا رہا اور بیسویں صدی کے آغاز تک چلا؛ دمشق اور یمن کے اپنے محمل تھے۔"
