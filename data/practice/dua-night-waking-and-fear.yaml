id: practice/dua-night-waking-and-fear
class: practice
kind: ritual
label:
  ar: "الاستيقاظ ليلا والأرق والفزع"
  en: "Waking in the night, sleeplessness and fright"
  ur: "رات کو جاگنا، بے خوابی اور گھبراہٹ"
  es: "Despertarse por la noche, insomnio y miedo"
  fr: "Réveil nocturne, insomnie et peur"
summary:
  ar: "ما جمعه النووي في ثلاثة أبواب: من استيقظ في الليل وأراد النوم بعده، ومن قلق في فراشه فلم ينم، ومن كان يفزع في منامه. {cite:al-adhkar-nawawi-arnaut-1994 p. 95}"
  en: "What al-Nawawi gathers in three chapters: for one who wakes in the night and means to sleep again, for one restless in bed who cannot sleep, and for one frightened in his sleep. {cite:al-adhkar-nawawi-arnaut-1994 p. 95}"
  ur: "تین ابواب میں نووی نے جو جمع کیا: جو رات کو جاگے اور پھر سونا چاہے، جو بستر میں بے چین ہو کر نہ سو سکے، اور جو نیند میں گھبرا جائے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 95}"
  es: "Lo que al-Nawawi reúne en tres capítulos: para quien se despierta por la noche y quiere volver a dormir, para quien está inquieto en la cama y no puede conciliar el sueño, y para quien se asusta mientras duerme. {cite:al-adhkar-nawawi-arnaut-1994 p. 95}"
  fr: "Al-Nawawi rassemble ces thèmes en trois chapitres: celui qui se réveille la nuit et souhaite se rendormir, celui qui est agité dans son lit et ne parvient pas à dormir, et celui qui est effrayé pendant son sommeil. {cite:al-adhkar-nawawi-arnaut-1994 p. 95}"
