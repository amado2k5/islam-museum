summary:
  ar: "ما يقوله المحرم بالحج أو العمرة كما أورده النووي في أول «كتاب أذكار الحج»: نية الإحرام بالقلب واللسان، ولفظ التلبية، وأحكامها وآدابها. {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
  en: "What the pilgrim says on entering the sacred state for hajj or umra, as al-Nawawi gives it at the head of his Book of the Remembrances of Hajj: the intention in the heart and on the tongue, the wording of the talbiya, and its rulings and etiquette. {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
  ur: "حج یا عمرے کا احرام باندھنے والا کیا کہے، جیسا کہ نووی نے «کتاب اذکار الحج» کے شروع میں ذکر کیا: دل اور زبان سے نیت، تلبیہ کے الفاظ، اور اس کے احکام و آداب۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
