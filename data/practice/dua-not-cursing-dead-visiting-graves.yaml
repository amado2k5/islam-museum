id: practice/dua-not-cursing-dead-visiting-graves
class: practice
kind: ritual
label:
  ar: "النهي عن سب الأموات وما يقوله زائر القبور"
  en: "Not reviling the dead, and what the visitor of graves says"
  ur: "مردوں کو برا کہنے کی ممانعت اور قبروں کی زیارت کرنے والے کے کلمات"
  es: "No insultar a los muertos, y lo que dice el visitante de tumbas."
  fr: "Ne pas injurier les morts, et ce que dit le visiteur des tombes"
  tr: "Ölüleri lanetlemenin ve mezar ziyaretçisinin söylediklerinin yasağı"
  id: "Larangan mengutuk orang mati dan apa yang dikatakan pengunjung makam"
summary:
  ar: "ما جمعه النووي في النهي عن سب الأموات واستثناءاته، وفي ما يقوله زائر القبور من سلام ودعاء، وما نهي عنه الزائر. {cite:al-adhkar-nawawi-arnaut-1994 p. 165}"
  en: "What al-Nawawi gathers on the prohibition of reviling the dead and its exceptions, on the greetings and prayers of one who visits graves, and on what a visitor is told to avoid. {cite:al-adhkar-nawawi-arnaut-1994 p. 165}"
  ur: "مردوں کو برا کہنے کی ممانعت اور اس کے استثناءات، قبروں کی زیارت کرنے والے کے سلام و دعا اور زائر کے لیے ممنوعات کے بارے میں نووی نے جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 165}"
  es: "Lo que Al-Nawawi recopila sobre la prohibición de insultar a los muertos y sus excepciones, sobre los saludos y oraciones de quien visita las tumbas, y sobre lo que se le recomienda evitar al visitante. {cite:al-adhkar-nawawi-arnaut-1994 p. 165}"
  fr: "Ce qu'al-Nawawi rassemble sur l'interdiction d'insulter les morts et ses exceptions, sur les salutations et les prières de celui qui se rend sur les tombes, et sur ce qu'il convient d'éviter pour le visiteur. {cite:al-adhkar-nawawi-arnaut-1994 p. 165}"
  tr: "el-Nawawi'nin ölülerin lanetlenmesinin yasaklanması ve istisnaları ile mezar ziyaretçisinin barış ve dua ile ilgili söyledikleri ve ziyaretçiye yasaklar hakkında derledikleri gibi. {cite:al-adhkar-nawawi-arnaut-1994 s. 165}"
  id: "Apa yang disusun al-Nawawi mengenai larangan mengutuk orang mati dan pengecualiannya, serta apa yang dikatakan pengunjung makam dalam istilah perdamaian dan permohonan, serta apa yang dilarang pengunjung. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 165}"
