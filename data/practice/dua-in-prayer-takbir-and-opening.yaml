id: practice/dua-in-prayer-takbir-and-opening
class: practice
kind: ritual
label:
  ar: "تكبيرة الإحرام ودعاء الاستفتاح"
  en: "The opening takbir and the opening supplication of the prayer"
  ur: "تکبیرِ تحریمہ اور دعائے استفتاح"
  es: "El takbir inicial y la súplica inicial de la oración."
  fr: "Le takbir d'ouverture et la supplication d'ouverture de la prière"
summary:
  ar: "ما جمعه النووي في بابي تكبيرة الإحرام وما يقال بعدها: لفظ التكبير وأحكامه، ثم أذكار الاستفتاح الواردة وما قيل في ضبطها وتخريجها. {cite:al-adhkar-nawawi-arnaut-1994 p. 42}"
  en: "What al-Nawawi gathers in the chapters on the opening takbir and on what is said after it: the wording of the takbir, then the opening supplications that are reported, with his remarks on their grading. {cite:al-adhkar-nawawi-arnaut-1994 p. 42}"
  ur: "جو نووی نے تکبیرِ تحریمہ اور اس کے بعد پڑھی جانے والی دعاؤں کے ابواب میں جمع کیا: تکبیر کے الفاظ، پھر منقول دعائے استفتاح اور ان کی سندوں پر ان کا کلام۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 42}"
  es: "Lo que al-Nawawi recopila en los capítulos sobre el takbir inicial y sobre lo que se dice después: la redacción del takbir, luego las súplicas iniciales que se recogen, con sus observaciones sobre su gradación. {cite:al-adhkar-nawawi-arnaut-1994 p. 42}"
  fr: "Dans les chapitres consacrés au takbir initial et à ce qui suit, al-Nawawi rassemble: le libellé du takbir, puis les invocations initiales rapportées, ainsi que ses remarques sur leur importance relative. {cite:al-adhkar-nawawi-arnaut-1994 p. 42}"
