label:
  ar: الأذان
  en: The call to prayer (adhan)
summary:
  ar: "النداء العلني إلى الصلاة بصيغة ثابتة: الله أكبر، الشهادتان، حي على الصلاة وحي على الفلاح، وتثويب في الفجر. تروي الرواية أنه أُقرّ في المدينة بعد رؤيا عبد الله بن زيد، وأن بلالاً كان يؤذن، وتختلف المذاهب في التكرار والترجيع وموضع التثويب، ويزيد الشيعة «حي على خير العمل»."
  en: "The public call to prayer in its fixed formula: Allahu akbar, the two testimonies, 'hurry to prayer' and 'hurry to success', with an added phrase at dawn. Tradition places its introduction at Madina after the dream of Abd Allah ibn Zayd, with Bilal as the caller. The schools differ on repetition, the tardji and the place of the tathwib, and the Shia add 'come to the best work'."
  ur: "نماز کے لیے مقررہ الفاظ میں عام اعلان: اللہ اکبر، دونوں شہادتیں، حی علی الصلاۃ اور حی علی الفلاح، اور فجر میں ایک اضافی جملہ۔ روایت کے مطابق یہ مدینہ میں عبداللہ بن زید کے خواب کے بعد جاری ہوئی اور بلال اذان دیتے تھے۔ مذاہب تکرار، ترجیع اور تثویب کے مقام میں مختلف ہیں، اور شیعہ حی علی خیر العمل کا اضافہ کرتے ہیں۔"
