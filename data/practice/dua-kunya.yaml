label:
  ar: "الكنى وآداب التكني"
  en: "Kunyas and the manners of using them"
  ur: "کنیتیں اور ان کے استعمال کے آداب"
  es: "Kunyas y las formas de utilizarlas"
  fr: "Les kunyas et les manières de les utiliser"
summary:
  ar: "ما جمعه النووي في «الأذكار» في أبواب الكنية: مخاطبة أهل الفضل بالكنية، وكنية الصغير ومن لم يولد له، والخلاف في التكني بأبي القاسم، وتكنية غير المسلم، والتكني بأبي فلانة. {cite:al-adhkar-nawawi-arnaut-1994 p. 294}"
  en: "What al-Nawawi gathers in al-Adhkar in the chapters on the kunya: addressing people of merit by it, the kunya of a child or of one with no child, the difference of view on taking the kunya Abu al-Qasim, giving a kunya to a non-Muslim, and kunyas of the Abu so-and-so and Umm so-and-so pattern. {cite:al-adhkar-nawawi-arnaut-1994 p. 294}"
  ur: "جو نووی نے «الاذکار» میں کنیت کے ابواب میں جمع کیا: اہل فضل کو کنیت سے مخاطب کرنا، بچے اور بے اولاد کی کنیت، ابو القاسم کنیت رکھنے میں اختلاف، غیر مسلم کی کنیت اور ابو فلانہ جیسی کنیتیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 294}"
  es: "Lo que al-Nawawi recopila en al-Adhkar en los capítulos sobre la kunya: dirigirse a personas de mérito mediante ella, la kunya de un niño o de quien no tiene hijos, la diferencia de opinión sobre tomar la kunya Abu al-Qasim, otorgar una kunya a un no musulmán y las kunyas del modelo de Abu tal y cual y Umm tal y cual. {cite:al-adhkar-nawawi-arnaut-1994 p. 294}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble les points suivants concernant la kunya: l’usage de la kunya pour s’adresser à des personnes méritantes, la kunya d’un enfant ou d’une personne sans enfant, les divergences d’opinions sur l’acquisition de la kunya d’Abu al-Qasim, l’attribution d’une kunya à un non-musulman, et les kunyas selon le modèle d’Abu untel et d’Umm untel. {cite:al-adhkar-nawawi-arnaut-1994 p. 294}"
