id: practice/dua-on-leaving-the-house
class: practice
kind: ritual
label:
  ar: "الدعاء عند الخروج من البيت"
  en: "Supplication on leaving the house"
  ur: "گھر سے نکلنے کی دعا"
summary:
  ar: "ما يقال عند الخروج من البيت كما جمعه النووي في «الأذكار»: حديث أم سلمة في الاستعاذة من الضلال والزلل والظلم والجهل، وحديث أنس «باسم الله، توكلت على الله»، وكلاهما في السنن. {cite:al-adhkar-nawawi-arnaut-1994 p. 22}"
  en: "What is said on leaving the house, as al-Nawawi gathers it in al-Adhkar: Umm Salama's report seeking refuge from straying, slipping, wronging and ignorance, and Anas's «باسم الله، توكلت على الله», both from the Sunan. {cite:al-adhkar-nawawi-arnaut-1994 p. 22}"
  ur: "گھر سے نکلتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: ام سلمہ کی روایت جس میں گمراہی، لغزش، ظلم اور جہالت سے پناہ ہے، اور انس کی روایت «باسم الله، توكلت على الله»، دونوں سنن سے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 22}"
