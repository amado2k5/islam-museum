  ar: قصد البيت الحرام بمكة لأداء مناسك مخصوصة، وهو أحد أركان الإسلام الخمسة؛ فرضه القرآن على الناس «لمن استطاع إليه سبيلاً» وجاء فيه الأمر بالأذان بالحج في الناس.
  en: The journey to the Sacred House at Mecca to perform prescribed rites, one of the five pillars; the Qur'an makes it a duty for those who are able to make the way there, and tells of the call to proclaim it to the people.
