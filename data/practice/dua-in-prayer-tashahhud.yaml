label:
  ar: "التشهد في الصلاة"
  en: "The tashahhud in the prayer"
  ur: "نماز میں تشہد"
  es: "El tashahhud en la oración"
  fr: "Le tashahhud dans la prière"
  tr: "Tashahhud Dua Ediyor"
  id: "Tashahhud dalam Doa"
summary:
  ar: "ما جمعه النووي في باب التشهد في الصلاة: عدد التشهدات، وصيغها الثابتة عن ابن مسعود وابن عباس وأبي موسى، وأحكام ألفاظه. {cite:al-adhkar-nawawi-arnaut-1994 p. 62}"
  en: "What al-Nawawi gathers in the chapter on the tashahhud in the prayer: how many there are, the wordings from Ibn Mas'ud, Ibn Abbas and Abu Musa, and the rulings on its words. {cite:al-adhkar-nawawi-arnaut-1994 p. 62}"
  ur: "جو نووی نے نماز میں تشہد کے باب میں جمع کیا: تشہدات کی تعداد، ابن مسعود، ابن عباس اور ابو موسیٰ کے الفاظ، اور اس کے الفاظ کے احکام۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 62}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre el tashahhud en la oración: cuántos tashahhud hay, las formulaciones de Ibn Mas'ud, Ibn Abbas y Abu Musa, y las normas sobre sus palabras. {cite:al-adhkar-nawawi-arnaut-1994 p. 62}"
  fr: "Dans le chapitre consacré aux tashahhud de la prière, al-Nawawi rassemble les informations suivantes: leur nombre, les formulations d’Ibn Mas’ud, d’Ibn Abbas et d’Abu Musa, ainsi que les règles relatives à leur signification. {cite:al-adhkar-nawawi-arnaut-1994 p. 62}"
  tr: "El-Nawavi'nin namazdaki taşahhud bölümünde derlediği şey: taşahhudların sayısı, İbn Mes'ud, İbn Abbas ve Ebu Musa'dan alınan yerleşik biçimleri ve metninin hükümleri. {cite:al-adhkar-nawawi-arnaut-1994 s. 62}"
  id: "Apa yang dikumpulkan al-Nawawi dalam bab tentang tashahhud dalam doa: jumlah tashahhud, bentuk-bentuk yang telah ditetapkan dari Ibn Mas'ud, Ibn Abbas, dan Abu Musa, serta ketentuan dalam redaksinya. {cite:al-Adhkar-Nawawi-Arnaut-1994 hlm. 62}"
