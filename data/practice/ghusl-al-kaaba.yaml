id: practice/ghusl-al-kaaba
class: practice
kind: ritual
label: {"ar": "غسل الكعبة", "en": "The washing of the Kaaba", "ur": "کعبہ کی غسل"}
summary:
  ar: "تُغسل الكعبة من الداخل بماء زمزم مخلوط بماء الورد مرتين في السنة بحضرة كبار الضيوف؛ يفتح الباب حارسه من بني شيبة، ويدخل الضيوف ويصلون ركعتين حيث صلى النبي. وفي يوم الفتح دخل النبي الكعبة ومعه بلال وأسامة بن زيد وعثمان بن طلحة."
  en: "The Kaaba's interior is washed with Zamzam water mixed with rose water twice a year in the presence of senior guests; the door is opened by its keeper from Banu Shaybah, and the guests enter and pray two rak'as where the Prophet prayed. On the day of the conquest of Mecca the Prophet entered the Kaaba with Bilal, Usama ibn Zayd and Uthman ibn Talha."
  ur: "کعبہ کو اندر سے زمزم اور گلاب کے پانی سے سال میں دو بار بڑے مہمانوں کی موجودگی میں دھویا جاتا ہے؛ دروازہ بنو شیبہ کے محافظ کھولتے ہیں اور مہمان اندر داخل ہو کر وہاں دو رکعت پڑھتے ہیں جہاں نبی کریم نے نماز پڑھی تھی؛ فتحِ مکہ کے دن آپ بلال، اسامہ بن زید اور عثمان بن طلحہ کے ساتھ کعبہ میں داخل ہوئے۔"
