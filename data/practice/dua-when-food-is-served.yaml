id: practice/dua-when-food-is-served
class: practice
kind: ritual
label:
  ar: "الدعاء عند تقديم الطعام"
  en: "Supplication when food is served"
  ur: "کھانا سامنے آنے کی دعا"
summary:
  ar: "ما يقال إذا قرب الطعام كما أورده النووي في أول «كتاب أذكار الأكل والشرب»: حديث عبد الله بن عمرو بن العاص من كتاب ابن السني، واستحباب قول صاحب الطعام لضيفانه كلوا. {cite:al-adhkar-nawawi-arnaut-1994 p. 228}"
  en: "What is said when food is brought, as al-Nawawi gives it at the head of his Book of the Remembrances of Eating and Drinking: Abd Allah ibn Amr ibn al-As's report from Ibn al-Sunni's book, and the recommendation that a host invite his guests to eat. {cite:al-adhkar-nawawi-arnaut-1994 p. 228}"
  ur: "کھانا قریب لایا جائے تو کیا کہا جائے، جیسا کہ نووی نے «کتاب اذکار الاکل والشرب» کے شروع میں ذکر کیا: ابن السنی کی کتاب سے عبد اللہ بن عمرو بن عاص کی روایت، اور میزبان کا مہمانوں سے کھانے کو کہنا مستحب ہے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 228}"
