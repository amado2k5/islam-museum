label:
  ar: "أذكار الذهاب إلى عرفات والوقوف بها"
  en: "Remembrances on the way to Arafat and at the standing there"
  ur: "عرفات کی طرف روانگی اور وہاں وقوف کے اذکار"
  es: "Recuerdos en el camino a Arafat y en el lugar de descanso."
  fr: "Souvenirs sur le chemin d'Arafat et au moment du rassemblement."
summary:
  ar: "ما جمعه النووي في «الأذكار» في الذهاب من منى إلى عرفات والأذكار والدعوات المستحبة بعرفات، وما يقال في الإفاضة منها إلى مزدلفة. {cite:al-adhkar-nawawi-arnaut-1994 p. 198}"
  en: "What al-Nawawi gathers in al-Adhkar on the way from Mina to Arafat, the remembrances and supplications recommended at Arafat, and what is said on setting out from there for Muzdalifa. {cite:al-adhkar-nawawi-arnaut-1994 p. 198}"
  ur: "جو نووی نے «الاذکار» میں منیٰ سے عرفات جاتے وقت، عرفات میں مستحب اذکار و دعاؤں اور وہاں سے مزدلفہ روانگی کے وقت کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 198}"
  es: "Lo que al-Nawawi recopila en al-Adhkar en el camino de Mina a Arafat, los recuerdos y súplicas recomendados en Arafat, y lo que se dice al partir de allí hacia Muzdalifa. {cite:al-adhkar-nawawi-arnaut-1994 p. 198}"
  fr: "Ce qu'al-Nawawi rassemble dans al-Adhkar sur le chemin de Mina à Arafat, les invocations et les supplications recommandées à Arafat, et ce qui est dit au moment de partir de là pour Muzdalifa. {cite:al-adhkar-nawawi-arnaut-1994 p. 198}"
