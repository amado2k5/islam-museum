id: practice/dua-bedtime-further
class: practice
kind: ritual
label:
  ar: "عند النوم: مزيد من المرويات"
  en: "At bedtime: further reports"
  ur: "نیند کے وقت: مزید روایات"
  es: "A la hora de acostarse: nuevos informes"
summary:
  ar: "ما أورده النووي بعد ذلك في باب النوم: قراءة سورة الكافرون والمسبحات، وحمد الله على النعم، وسؤال السمع والبصر، وآيات البقرة وآية الكرسي والمعوذتين، وكراهية النوم بلا ذكر. {cite:al-adhkar-nawawi-arnaut-1994 p. 92}"
  en: "What al-Nawawi gives next in the sleep chapter: reciting the Kafirun surah and the musabbihat, praise for God's favours, asking for hearing and sight, the last verses of al-Baqara, the verse of the Throne and the refuge surahs, and the dislike of sleeping without remembrance. {cite:al-adhkar-nawawi-arnaut-1994 p. 92}"
  ur: "نیند کے باب میں نووی نے اس کے بعد جو ذکر کیا: سورۂ کافرون اور مسبحات کی تلاوت، نعمتوں پر حمد، سماعت و بصارت کا سوال، سورۂ بقرہ کی آخری آیات، آیت الکرسی اور معوذتین، اور ذکر کے بغیر سونے کی کراہت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 92}"
  es: "Lo que Al-Nawawi expone a continuación en el capítulo sobre el sueño: la recitación de la sura Kafirun y las suras Musabbihat, la alabanza a los favores de Dios, la petición de oír y ver, los últimos versículos de Al-Baqara, el versículo del Trono y las suras del Refugio, y la aversión a dormir sin recordar. {cite:al-adhkar-nawawi-arnaut-1994 p. 92}"
