id: practice/dua-names-and-nicknames
class: practice
kind: ritual
label:
  ar: "تغيير الأسماء وترخيمها والألقاب"
  en: "Changing names, shortening them and nicknames"
  ur: "ناموں کی تبدیلی، ترخیم اور القاب"
  es: "Cambiar nombres, acortarlos y usar apodos."
  fr: "Changer de nom, le raccourcir et utiliser des surnoms"
summary:
  ar: "ما جمعه النووي في «الأذكار» من أمثلة تغيير النبي لأسماء، وجواز ترخيم الاسم، والنهي عن الألقاب التي يكرهها صاحبها، وجواز اللقب الذي يحبه صاحبه. {cite:al-adhkar-nawawi-arnaut-1994 p. 292}"
  en: "What al-Nawawi gathers in al-Adhkar of examples of the Prophet changing names, the permissibility of shortening a name, the prohibition on nicknames their bearer dislikes, and the permissibility of a nickname its bearer likes. {cite:al-adhkar-nawawi-arnaut-1994 p. 292}"
  ur: "جو نووی نے «الاذکار» میں نبی کے ناموں کی تبدیلی کی مثالوں، نام کی ترخیم کے جواز، ایسے القاب کی ممانعت جو صاحب لقب کو ناپسند ہوں اور پسندیدہ لقب کے جواز کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 292}"
  es: "Lo que al-Nawawi recopila en al-Adhkar son ejemplos de cómo el Profeta cambió de nombre, la permisibilidad de acortarlo, la prohibición de usar apodos que no le agradan a quien lo lleva y la permisibilidad de usar un apodo que sí le agrada. {cite:al-adhkar-nawawi-arnaut-1994 p. 292}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble des exemples du Prophète changeant de nom, la permission de raccourcir un nom, l'interdiction des surnoms que celui qui les porte n'apprécie pas et la permission d'un surnom que celui qui le porte apprécie. {cite:al-adhkar-nawawi-arnaut-1994 p. 292}"
