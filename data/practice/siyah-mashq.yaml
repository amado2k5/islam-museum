label: { ar: "السياه مشق ⁦(صفحة التمرين الخطي)⁩", en: "Siyah mashq (calligraphic practice sheet)", ur: "سیاہ مشق ⁦(خطاطی کی مشق کا ورق)⁩", es: "Siyah mashq (hoja de práctica de caligrafía)", fr: "Siyah mashq (feuille d'exercices de calligraphie)", tr: "Al-Siyah Egzersizi (Doğrusal Egzersiz Sayfası)", id: "Latihan Al-Siyah (Halaman Latihan Linear)" }
summary:
  ar: "صفحة تمرين يكرر فيها الخطاط الحروف حتى يسودّ سطحها، صارت فنًا مستقلًا يجمع ويهدى ويضم إلى الألبومات، ظهرت في إيران أواخر القرن العاشر الهجري وازدهرت في القرنين الثامن عشر والتاسع عشر في إيران والدولة العثمانية ⁦(قره لامه)⁩ {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  en: "A practice page on which the calligrapher repeats letters until the surface is blackened; it became an art form in its own right, collected, given as gifts and mounted in albums, emerging in Iran in the late sixteenth century and flourishing in the eighteenth and nineteenth centuries in Iran and Ottoman Turkey (karalama) {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  ur: "مشق کا ورق جس پر خطاط حروف بار بار لکھ کر سطح کو سیاہ کر دیتا؛ یہ بذاتِ خود فن بن گیا، جمع کیا گیا، تحفے میں دیا گیا اور البموں میں لگا؛ سولہویں صدی کے آخر میں ایران میں ابھرا اور اٹھارہویں و انیسویں صدی میں ایران اور عثمانی ترکی ⁦(قرہ لامہ)⁩ میں پھلا پھولا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}۔"
  es: "Una página de práctica en la que el calígrafo repite letras hasta que la superficie se ennegrece; se convirtió en una forma de arte por derecho propio, coleccionada, regalada y montada en álbumes, surgiendo en Irán a finales del siglo XVI y floreciendo en los siglos XVIII y XIX en Irán y la Turquía otomana (karalama) {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  fr: "Une page d'entraînement sur laquelle le calligraphe répète des lettres jusqu'à ce que la surface soit noircie; elle est devenue une forme d'art à part entière, collectionnée, offerte en cadeau et montée dans des albums, émergeant en Iran à la fin du XVIe siècle et s'épanouissant aux XVIIIe et XIXe siècles en Iran et en Turquie ottomane (karalama) {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  tr: "Hattatın harfleri yüzeyi domine edene kadar tekrar ettiği bir egzersiz sayfası. Bağımsız bir sanat formu haline geldi; toplar, rehberlik eder ve albümlere dahil eder. 10. yüzyıl Hicri İran'da ortaya çıktı ve 18. ve 19. yüzyıllarda İran ile Osmanlı İmparatorluğu'nda (Qaralama) gelişti {cite:ekhtiar-how-to-read-islamic-calligraphy-2018, s. 106}."
  id: "Halaman latihan di mana kaligrafer mengulang huruf-huruf tersebut hingga permukaannya didominasi. Menjadi bentuk seni independen yang mengumpulkan, membimbing, dan memasukkannya ke dalam album. Karya ini muncul di Iran pada akhir abad ke-10 AH dan berkembang pesat pada abad ke-18 dan ke-19 di Iran dan Kekaisaran Ottoman (Qaralama) {cite:ekhtiar-how-to-read-islamic-calligraphy-2018, hlm. 106}."
