summary:
  ar: "صفحة تمرين يكرر فيها الخطاط الحروف حتى يسودّ سطحها، صارت فنًا مستقلًا يجمع ويهدى ويضم إلى الألبومات، ظهرت في إيران أواخر القرن العاشر الهجري وازدهرت في القرنين الثامن عشر والتاسع عشر في إيران والدولة العثمانية ⁦(قره لامه)⁩ {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  en: "A practice page on which the calligrapher repeats letters until the surface is blackened; it became an art form in its own right, collected, given as gifts and mounted in albums, emerging in Iran in the late sixteenth century and flourishing in the eighteenth and nineteenth centuries in Iran and Ottoman Turkey (karalama) {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}."
  ur: "مشق کا ورق جس پر خطاط حروف بار بار لکھ کر سطح کو سیاہ کر دیتا؛ یہ بذاتِ خود فن بن گیا، جمع کیا گیا، تحفے میں دیا گیا اور البموں میں لگا؛ سولہویں صدی کے آخر میں ایران میں ابھرا اور اٹھارہویں و انیسویں صدی میں ایران اور عثمانی ترکی (قرہ لامہ) میں پھلا پھولا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 106}۔"
