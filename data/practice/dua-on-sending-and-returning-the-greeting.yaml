id: practice/dua-on-sending-and-returning-the-greeting
class: practice
kind: ritual
label:
  ar: "إرسال السلام ورده"
  en: "Sending the greeting and returning it"
  ur: "سلام بھیجنا اور اس کا جواب دینا"
summary:
  ar: "ما أورده النووي في «كتاب السلام» من باب حكم السلام: إجزاء سلام الواحد عن الجماعة، والسلام بالكتاب والرسول، وسلام الأصم والأخرس والصبي، وتكرار السلام عند اللقاء. {cite:al-adhkar-nawawi-arnaut-1994 p. 247}"
  en: "What al-Nawawi gathers in the Book of the Greeting on its ruling: one person's greeting for a group, the greeting sent by letter or messenger, the deaf, the mute and the child, and repeating the greeting on meeting again. {cite:al-adhkar-nawawi-arnaut-1994 p. 247}"
  ur: "جو نووی نے «کتاب السلام» میں سلام کے حکم کے باب میں جمع کیا: ایک شخص کا سلام جماعت کی طرف سے، خط اور قاصد کے ذریعے سلام، بہرے، گونگے اور بچے کا سلام، اور دوبارہ ملنے پر سلام دہرانا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 247}"
