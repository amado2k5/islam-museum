id: practice/dua-on-going-to-the-mosque
class: practice
kind: ritual
label:
  ar: "الدعاء عند التوجه إلى المسجد"
  en: "Supplication on going to the mosque"
  ur: "مسجد کی طرف جاتے وقت کی دعا"
  es: "Súplica al ir a la mezquita"
  fr: "Invocation avant d'aller à la mosquée"
  tr: "Camiye giderken dua"
  id: "Doa saat menuju masjid"
summary:
  ar: "ما يقال عند التوجه إلى المسجد كما جمعه النووي في «الأذكار»: دعاء النور من صحيح مسلم عن ابن عباس، وحديث بلال في كتاب ابن السني الذي يضعفه النووي. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  en: "What is said on the way to the mosque, as al-Nawawi gathers it in al-Adhkar: the supplication for light from Sahih Muslim, from Ibn Abbas, and Bilal's report in Ibn al-Sunni's book, which al-Nawawi calls weak. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  ur: "مسجد جاتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: دعائے نور صحیح مسلم سے ابن عباس کی روایت، اور ابن السنی کی کتاب میں بلال کی روایت جسے نووی ضعیف کہتے ہیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  es: "Lo que se dice camino a la mezquita, según lo recopila al-Nawawi en al-Adhkar: la súplica por la luz del Sahih Muslim, de Ibn Abbas, y el relato de Bilal en el libro de Ibn al-Sunni, que al-Nawawi considera débil. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  fr: "Voici ce qui est dit sur le chemin de la mosquée, tel que rassemblé par al-Nawawi dans al-Adhkar: l’invocation de la lumière tirée du Sahih Muslim, d’Ibn Abbas et du récit de Bilal dans l’ouvrage d’Ibn al-Sunni, qu’al-Nawawi juge faible. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  tr: "El-Nevevi tarafından 'El-Edhkar'da derlenen camiye giderken söylenenler: İbn Abbas'tan Sahih Müslüm'den gelen ışık duası ve İbn Sünni kitabındaki Bilal'in hadisi, el-Nevavi tarafından zayıflatılır. {atıf:al-adhkar-nawawi-arnaut-1994 s. 30}"
  id: "Apa yang dikatakan saat menuju masjid seperti yang disusun oleh al-Nawawi dalam 'Al-Adhkar': doa cahaya dari Sahih Muslim dari Ibn Abbas, dan hadis Bilal dalam kitab Ibn al-Sunni, yang dilemahkan oleh al-Nawawi. {sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 30}"
