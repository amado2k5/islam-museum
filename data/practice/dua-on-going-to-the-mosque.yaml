label:
  ar: "الدعاء عند التوجه إلى المسجد"
  en: "Supplication on going to the mosque"
  ur: "مسجد کی طرف جاتے وقت کی دعا"
summary:
  ar: "ما يقال عند التوجه إلى المسجد كما جمعه النووي في «الأذكار»: دعاء النور من صحيح مسلم عن ابن عباس، وحديث بلال في كتاب ابن السني الذي يضعفه النووي. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  en: "What is said on the way to the mosque, as al-Nawawi gathers it in al-Adhkar: the supplication for light from Sahih Muslim, from Ibn Abbas, and Bilal's report in Ibn al-Sunni's book, which al-Nawawi calls weak. {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
  ur: "مسجد جاتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: دعائے نور صحیح مسلم سے ابن عباس کی روایت، اور ابن السنی کی کتاب میں بلال کی روایت جسے نووی ضعیف کہتے ہیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 30}"
