id: practice/dua-istisqa
class: practice
kind: ritual
label:
  ar: "الأذكار في الاستسقاء"
  en: "Remembrances in the prayer for rain"
  ur: "استسقاء کے اذکار"
  es: "Recuerdos en la oración por la lluvia"
  fr: "Souvenirs dans la prière pour la pluie"
  tr: "Yağmurda Anmalar"
  id: "Kenangan di tengah hujan"
summary:
  ar: "ما جمعه النووي في «الأذكار» في باب الاستسقاء: الدعوات المشهورة، والاستسقاء بأهل الصلاح، وما روي من أدعية النبي، وهيئة الصلاة والخطبة، وقول الشافعي في الإكثار من الاستغفار. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  en: "What al-Nawawi gathers in al-Adhkar in the chapter on the prayer for rain: the well-known supplications, asking through a righteous man, the supplications reported of the Prophet, the form of the prayer and sermon, and al-Shafi'i on abundant forgiveness-seeking. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  ur: "جو نووی نے «الاذکار» میں استسقاء کے باب میں جمع کیا: مشہور دعائیں، نیک آدمی کے وسیلے سے استسقاء، نبی سے منقول دعائیں، نماز اور خطبے کی صورت اور شافعی کا کثرت استغفار کے بارے میں قول۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  es: "Lo que al-Nawawi recopila en al-Adhkar en el capítulo sobre la oración por la lluvia: las súplicas más conocidas, la petición a través de un hombre justo, las súplicas atribuidas al Profeta, la forma de la oración y el sermón, y al-Shafi'i sobre la búsqueda del perdón abundante. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  fr: "Dans son ouvrage al-Adhkar, au chapitre consacré à la prière pour la pluie, al-Nawawi rassemble les invocations bien connues, la possibilité de les demander par l'intermédiaire d'un homme pieux, les invocations rapportées du Prophète, la forme de la prière et du sermon, ainsi que les enseignements d'al-Shafi'i sur l'importance de rechercher abondamment le pardon. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  tr: "El-Nawawi'nin 'El-Adhkar'da yağmur arama bölümünde derlediği şey: bilinen dualar, doğrulardan yağmur istemek, Peygamber'in duaları, namaz ve vaazların şekli ve Şafi'i'nin artan bağışlama görüşü. {cite:al-adhkar-nawawi-arnaut-1994 s. 176}"
  id: "Apa yang disusun al-Nawawi dalam 'Al-Adhkar' dalam bab mencari hujan: doa yang terkenal, memohon hujan dari orang saleh, permohonan Nabi, cara shalat dan khotbah, serta pandangan Syafi'i tentang peningkatan pencarian pengampunan. {cite:al-Adhkar-Nawawi-Arnaut-1994 hlm. 176}"
