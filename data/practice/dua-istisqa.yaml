label:
  ar: "الأذكار في الاستسقاء"
  en: "Remembrances in the prayer for rain"
  ur: "استسقاء کے اذکار"
summary:
  ar: "ما جمعه النووي في «الأذكار» في باب الاستسقاء: الدعوات المشهورة، والاستسقاء بأهل الصلاح، وما روي من أدعية النبي، وهيئة الصلاة والخطبة، وقول الشافعي في الإكثار من الاستغفار. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  en: "What al-Nawawi gathers in al-Adhkar in the chapter on the prayer for rain: the well-known supplications, asking through a righteous man, the supplications reported of the Prophet, the form of the prayer and sermon, and al-Shafi'i on abundant forgiveness-seeking. {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
  ur: "جو نووی نے «الاذکار» میں استسقاء کے باب میں جمع کیا: مشہور دعائیں، نیک آدمی کے وسیلے سے استسقاء، نبی سے منقول دعائیں، نماز اور خطبے کی صورت اور شافعی کا کثرت استغفار کے بارے میں قول۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 176}"
