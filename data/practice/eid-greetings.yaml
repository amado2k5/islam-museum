label: {ar: "تهاني العيد", en: "Eid greetings", ur: "عید کی مبارکباد"}
summary:
  ar: "من أقدم التهاني ما كان يقوله أصحاب النبي إذا تلاقوا يوم العيد: «تقبّل الله منا ومنكم»، وفي مصر «عيد مبارك» وجوابها «خير مبارك»، وفي تركيا «Bayramınız mübarek olsun»، وفي جنوب آسيا «عید مبارک»، وفي ماليزيا وإندونيسيا «Selamat Hari Raya» مع «mohon maaf lahir dan batin» طلباً للصفح."
  en: "Among the oldest greetings is what the Companions said meeting on Eid day: 'Taqabbal Allahu minna wa minkum' — may God accept it from us and you. Egypt answers 'Eid mubarak' with 'khayr mubarak', Turkey says 'Bayramınız mübarek olsun', South Asia 'Eid Mubarak', and Malaysians and Indonesians 'Selamat Hari Raya' with 'mohon maaf lahir dan batin' — forgive me body and soul."
  ur: "عید کی مبارکباد کی قدیم ترین صورت وہ ہے جو صحابہ عید کے دن آپس میں کہتے تھے: «تقبل اللہ منا و منکم»؛ مصر میں «عید مبارک» کا جواب «خیر مبارک»، ترکی میں «بیرامنز مبارک اولسن»، جنوبی ایشیا میں «عید مبارک»، اور ملائیشیا و انڈونیشیا میں «سلامت ہاری رایا» کے ساتھ «معذرت لاحیر و باطن» کی استدعا۔"
