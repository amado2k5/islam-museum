  - tradition: sunni-maliki
    id: maliki-interlocutor
    stance: { ar: "عند الافتتاح فقط ⁦(كما يحكيه المحاور المالكي)⁩", en: "At the opening only (as the Maliki interlocutor states)", ur: "صرف تحریمہ کے وقت ⁦(جیسا مالکی مخاطب کہتا ہے)⁩" }
    summary:
      ar: "في الكتاب يقول محاور الشافعي من أصحاب مالك: نحن نقول يرفع يديه حين يفتتح الصلاة ثم لا يعود لرفعهما؛ فيرد الشافعي بأنهم يتركون ما رواه مالك نفسه عن النبي وعن ابن عمر. ولم يُنقل قول المالكية هنا من كتبهم. {cite:kitab-al-umm-wafa-v8 p.544}"
      en: "In the book al-Shafi'i's Maliki interlocutor says: we say he raises his hands at the opening of the prayer and does not repeat it; al-Shafi'i answers that they leave what Malik himself narrated from the Prophet and from Ibn Umar. The Maliki view is not given here from Maliki books."
      ur: "کتاب میں امام شافعی کا مالکی مخاطب کہتا ہے: ہم کہتے ہیں کہ نماز شروع کرتے وقت ہاتھ اٹھائے پھر دوبارہ نہیں؛ امام شافعی جواب دیتے ہیں کہ وہ اس کو چھوڑ دیتے ہیں جو خود امام مالک نے نبی سے اور ابن عمر سے روایت کیا۔ مالکیہ کا قول یہاں ان کی کتابوں سے نقل نہیں ہوا۔"
