issue:
  ar: "في أي مواضع الصلاة ترفع الأيدي؟"
  en: "At which points of the prayer are the hands raised?"
  ur: "نماز میں کن مقامات پر ہاتھ اٹھائے جاتے ہیں؟"
perspectives:
  - tradition: sunni-shafii
    id: shafii
    stance: { ar: "عند الافتتاح والركوع والرفع منه", en: "At the opening, at bowing and on rising from it", ur: "تحریمہ، رکوع اور رکوع سے اٹھتے وقت" }
    summary:
      ar: "الشافعي: يرفع في أول ركعة ثلاث مرات وفيما سواها مرتين، حذو منكبيه، ولا يرفع في السجود؛ وحجته حديث ابن عمر من رواية مالك ومن رواية ابن عيينة عن الزهري، وحديث وائل بن حجر. {cite:kitab-al-umm-wafa-v8 p.541} {cite:kitab-al-umm-wafa-v8 p.542} {cite:kitab-al-umm-wafa-v8 p.544}"
      en: "Al-Shafi'i: three times in the first rak'a and twice in each other, to the shoulders, not in prostration; his evidence is the hadith of Ibn Umar narrated by Malik and by Ibn Uyayna from al-Zuhri, and the hadith of Wa'il ibn Hujr."
      ur: "امام شافعی: پہلی رکعت میں تین بار اور باقی ہر رکعت میں دو بار، کندھوں تک، سجدے میں نہیں؛ ان کی دلیل ابن عمر کی حدیث ہے جو امام مالک اور ابن عیینہ عن الزہری سے مروی ہے، اور وائل بن حجر کی حدیث۔"
    holders: [person/al-shafii]
