id: practice/raf-al-yadayn-fil-salah
class: practice
kind: ritual
label:
  ar: "رفع اليدين في الصلاة"
  en: "Raising the hands in prayer"
  ur: "نماز میں رفع الیدین"
summary:
  ar: "رفع المصلي يديه حذو منكبيه عند التكبير. يصفه الشافعي في «اختلاف مالك والشافعي» من كتاب الأم: يرفع عند تكبيرة الافتتاح، وعند تكبيرة الركوع، وعند الرفع من الركوع، ولا يرفع في السجود، ويحتج بحديث مالك عن ابن شهاب عن سالم عن ابن عمر، وبأنه روي عن النبي من بضعة عشر رجلاً؛ ويحكي عن محاوره من أصحاب مالك أنهم يرفعون عند الافتتاح ثم لا يعودون. {cite:kitab-al-umm-wafa-v8 p.541} {cite:kitab-al-umm-wafa-v8 p.542} {cite:kitab-al-umm-wafa-v8 p.544}"
  en: "The worshipper's raising his hands to his shoulders with the takbir. Al-Shafi'i describes it in the Disagreement of Malik and al-Shafi'i in Kitab al-Umm: one raises them at the opening takbir, at the takbir for bowing and on rising from bowing, not in prostration, citing Malik's hadith from Ibn Shihab from Salim from Ibn Umar and saying it was narrated from the Prophet by more than ten men; he reports from his Maliki interlocutor that they raise the hands at the opening and do not repeat it."
  ur: "نمازی کا تکبیر کے ساتھ اپنے ہاتھ کندھوں تک اٹھانا۔ امام شافعی کتاب الام کی «اختلاف مالک و الشافعی» میں اس کی صورت بیان کرتے ہیں: تکبیرِ تحریمہ، رکوع کی تکبیر اور رکوع سے اٹھتے وقت ہاتھ اٹھائے، سجدے میں نہیں؛ وہ امام مالک کی ابن شہاب سے، سالم سے، ابن عمر سے حدیث سے استدلال کرتے ہیں اور کہتے ہیں کہ یہ نبی سے دس سے زیادہ صحابہ نے روایت کیا؛ اور اپنے مالکی مخاطب سے نقل کرتے ہیں کہ وہ تحریمہ کے وقت ہاتھ اٹھاتے ہیں پھر دوبارہ نہیں۔"
