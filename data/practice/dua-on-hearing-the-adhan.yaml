id: practice/dua-on-hearing-the-adhan
class: practice
kind: ritual
label:
  ar: "ما يقال عند سماع الأذان وبعده"
  en: "What is said on hearing the call to prayer and after it"
  ur: "اذان سننے پر اور اس کے بعد کی دعا"
summary:
  ar: "ما يقوله من سمع المؤذن والمقيم وما يدعو به بعد الأذان كما جمعه النووي في «الأذكار»: إجابة المؤذن بمثل قوله من الصحيحين، ودعاء الوسيلة من صحيح البخاري، وأن الدعاء بين الأذان والإقامة لا يرد. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  en: "What the hearer of the call to prayer and the iqama says, and the supplication after the call, as al-Nawawi gathers it in al-Adhkar: repeating the muezzin's words, from the two Sahihs; the supplication for the wasila, from Sahih al-Bukhari; and that supplication between the call and the iqama is not turned away. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  ur: "اذان اور اقامت سننے والا کیا کہے اور اذان کے بعد کیا دعا کرے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: مؤذن کے الفاظ دہرانا صحیحین سے، دعائے وسیلہ صحیح بخاری سے، اور یہ کہ اذان اور اقامت کے درمیان دعا رد نہیں ہوتی۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
