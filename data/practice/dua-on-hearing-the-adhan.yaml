id: practice/dua-on-hearing-the-adhan
class: practice
kind: ritual
label:
  ar: "ما يقال عند سماع الأذان وبعده"
  en: "What is said on hearing the call to prayer and after it"
  ur: "اذان سننے پر اور اس کے بعد کی دعا"
  es: "Lo que se dice al oír el llamado a la oración y después de él."
  fr: "Que dit-on en entendant l'appel à la prière et après ?"
  tr: "Ezan çağrısı duyulduğunda ve sonrasında ne söylenir"
  id: "Apa yang diucapkan saat mendengar panggilan doa dan setelahnya"
summary:
  ar: "ما يقوله من سمع المؤذن والمقيم وما يدعو به بعد الأذان كما جمعه النووي في «الأذكار»: إجابة المؤذن بمثل قوله من الصحيحين، ودعاء الوسيلة من صحيح البخاري، وأن الدعاء بين الأذان والإقامة لا يرد. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  en: "What the hearer of the call to prayer and the iqama says, and the supplication after the call, as al-Nawawi gathers it in al-Adhkar: repeating the muezzin's words, from the two Sahihs; the supplication for the wasila, from Sahih al-Bukhari; and that supplication between the call and the iqama is not turned away. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  ur: "اذان اور اقامت سننے والا کیا کہے اور اذان کے بعد کیا دعا کرے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: مؤذن کے الفاظ دہرانا صحیحین سے، دعائے وسیلہ صحیح بخاری سے، اور یہ کہ اذان اور اقامت کے درمیان دعا رد نہیں ہوتی۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  es: "Lo que dice quien escucha la llamada a la oración y la iqama, y la súplica posterior a la llamada, según lo recopila al-Nawawi en al-Adhkar: repetir las palabras del muecín, de los dos Sahihs; la súplica para la wasila, de Sahih al-Bukhari; y que la súplica entre la llamada y la iqama no se desvía. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  fr: "Ce que dit celui qui entend l'appel à la prière et l'iqama, ainsi que l'invocation qui suit l'appel, tels que les rassemble al-Nawawi dans al-Adhkar: la répétition des paroles du muezzin (d'après les deux Sahihs); l'invocation pour la wasila (d'après le Sahih al-Bukhari); et l'invocation entre l'appel et l'iqama ne doit pas être rejetée. {cite:al-adhkar-nawawi-arnaut-1994 p. 36}"
  tr: "Müezzinin ve sakinin söyledikleri ve azandan sonra söyledikleri, el-Nawawi'nin 'Adhkar'da derlediği gibi: müezzinin iki sahih'ten gelen sözlerine benzer bir söz ile yanıtı, Sahih al-Buhari'den alet dilemesi ve ezan ile ikama arasındaki dua reddedilmez. {cite:al-adhkar-nawawi-arnaut-1994 s. 36}"
  id: "Apa yang dikatakan muezzin dan residen serta apa yang dia katakan setelah adhan, sebagaimana dikumpulkan oleh al-Nawawi dalam 'Adhkar': jawaban muezzin dengan ucapan yang mirip dengan ucapannya dari dua Sahih, dan permohonan sarana dari Sahih al-Bukhari, dan doa antara adhan dan iqamah itu tidak ditolak. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 36}"
