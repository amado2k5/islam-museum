label:
  ar: "جوامع الدعاء"
  en: "The comprehensive supplications"
  ur: "جامع دعائیں"
summary:
  ar: "ما أورده النووي في أول «كتاب جامع الدعوات» من «الأذكار»: الدعوات المستحبة في جميع الأوقات غير المقيدة بوقت أو حال، من صحيح مسلم والصحيحين، مثل سؤال الهدى والتقى والعفاف والغنى. {cite:al-adhkar-nawawi-arnaut-1994 p. 387}"
  en: "What al-Nawawi gives at the head of the Book of Comprehensive Supplications in al-Adhkar: supplications recommended at all times and tied to no hour or state, from Sahih Muslim and the two Sahihs, such as the asking for guidance, piety, restraint and sufficiency. {cite:al-adhkar-nawawi-arnaut-1994 p. 387}"
  ur: "جو نووی نے «الاذکار» کی «کتاب جامع الدعوات» کے شروع میں ذکر کیا: وہ دعائیں جو ہر وقت مستحب ہیں اور کسی وقت یا حال سے مقید نہیں، صحیح مسلم اور صحیحین سے، جیسے ہدایت، تقویٰ، عفت اور غنا کا سوال۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 387}"
