  en: "Archery (al-rimaya)"
  ur: "تیر اندازی (الرمایہ)"
summary:
  ar: "الرماية بالسهام والرماح تدريبٌ على القوة وإعدادٌ للجهاد، وهي من ألوان اللهو المباح التي عدّها المسلمون الأوائل رياضة محمودة. ينقل السيد سابق عن النبي قوله: «كل لعب حرام إلا ثلاثة: ملاعبة الرجل أهله، ورميه عن قوسه، وتأديبه فرسه»، ويحرم في أثناء الرمي أن يُتخذ الحي غرضاً. {cite:sabiq-fiqh-al-sunnah p. 47} وأورد أبو نعيم في معرفة الصحابة حديث: «علّموا أبناءكم السباحة والرماية»، في إسناد يمر بسليم بن عمرو الأنصاري. {cite:marifat-sahaba-abu-nuaym entry 1276}"
  en: "Archery with bow, arrow and lance trained strength for the struggle and was among the permitted sports the early Muslims treated as praiseworthy exercise. Sayyid Sabiq quotes the Prophet: 'Every game is forbidden except three: a man's play with his wife, his shooting with his bow, and his training of his horse'; he also reports that it is forbidden in shooting practice to make a living creature the target. {cite:sabiq-fiqh-al-sunnah p. 47} Abu Nu'aym records 'Teach your children swimming and archery' in an entry whose chain passes through Sulaym ibn Amr al-Ansari. {cite:marifat-sahaba-abu-nuaym entry 1276}"
  ur: "کمان، تیر اور نیزے سے تیر اندازی، جہاد کی طاقت کی تربیت تھی، اور ابتدائی مسلمانوں کے مباح کھیلوں میں سے تھی جسے وہ قابلِ تعریف ورزش سمجھتے تھے۔ سید سابق نبی کا قول نقل کرتے ہیں: «ہر کھیل حرام ہے سوائے تین کے: آدمی کا اپنی بیوی سے کھیلنا، اپنی کمان سے تیر اندازی، اور اپنے گھوڑے کو سدھانا»، اور یہ بھی کہ تیر اندازی کی مشق میں کسی جاندار کو نشانہ بنانا حرام ہے۔ {cite:sabiq-fiqh-al-sunnah p. 47}"
