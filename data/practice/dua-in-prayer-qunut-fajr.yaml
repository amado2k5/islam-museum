id: practice/dua-in-prayer-qunut-fajr
class: practice
kind: ritual
label:
  ar: "القنوت في صلاة الصبح"
  en: "The qunut supplication in the dawn prayer"
  ur: "فجر کی نماز میں قنوت"
  es: "La súplica del qunut en la oración del amanecer"
  fr: "La supplication de qunut dans la prière de l'aube"
summary:
  ar: "ما جمعه النووي في باب القنوت في الصبح: مشروعيته ومحله، ودعاء الحسن بن علي المروي في القنوت، وقنوت عمر، وأحكام الإمام والمأموم فيه. {cite:al-adhkar-nawawi-arnaut-1994 p. 59}"
  en: "What al-Nawawi gathers in the chapter on the qunut in the dawn prayer: its standing and place, the supplication of al-Hasan ibn Ali reported for it, the qunut attributed to Umar, and the rulings for imam and follower. {cite:al-adhkar-nawawi-arnaut-1994 p. 59}"
  ur: "جو نووی نے فجر میں قنوت کے باب میں جمع کیا: اس کی مشروعیت اور مقام، حسن بن علی سے منقول دعا، عمر سے منقول قنوت، اور امام و مقتدی کے احکام۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 59}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre el qunut en la oración del amanecer: su posición y lugar, la súplica de al-Hasan ibn Ali que se narra al respecto, el qunut atribuido a Umar y las normas para el imán y el seguidor. {cite:al-adhkar-nawawi-arnaut-1994 p. 59}"
  fr: "Dans le chapitre consacré au qunut lors de la prière de l'aube, al-Nawawi rassemble les informations suivantes: sa position et son emplacement, l'invocation d'al-Hasan ibn Ali rapportée à son sujet, le qunut attribué à Umar, et les règles concernant l'imam et le fidèle. {cite:al-adhkar-nawawi-arnaut-1994 p. 59}"
