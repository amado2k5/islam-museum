label:
  ar: "دعاء الكرب"
  en: "Supplication in distress"
  ur: "کرب اور پریشانی کی دعا"
summary:
  ar: "دعاء الكرب والدعاء عند الأمور المهمة كما جمعه النووي في «الأذكار»: حديث ابن عباس في الصحيحين، و«يا حي يا قيوم برحمتك أستغيث» من كتاب الترمذي، ودعوات المكروب من سنن أبي داود، ودعوة ذي النون. {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
  en: "The supplication of distress and at grave matters, as al-Nawawi gathers it in al-Adhkar: Ibn Abbas's report in the two Sahihs, «يا حي يا قيوم برحمتك أستغيث» from al-Tirmidhi's book, the supplications of the distressed from Sunan Abi Dawud, and the supplication of Dhu al-Nun. {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
  ur: "کرب اور اہم معاملات کے وقت کی دعا، جیسا کہ نووی نے «الاذکار» میں جمع کیا: صحیحین میں ابن عباس کی روایت، ترمذی کی کتاب سے «يا حي يا قيوم برحمتك أستغيث»، سنن ابی داود سے مکروب کی دعائیں، اور ذو النون کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
