id: practice/dua-in-distress
class: practice
kind: ritual
label:
  ar: "دعاء الكرب"
  en: "Supplication in distress"
  ur: "کرب اور پریشانی کی دعا"
  es: "Súplica en la angustia"
  fr: "Supplication en détresse"
  tr: "Acı için dua"
  id: "Doa untuk kesedihan"
summary:
  ar: "دعاء الكرب والدعاء عند الأمور المهمة كما جمعه النووي في «الأذكار»: حديث ابن عباس في الصحيحين، و«يا حي يا قيوم برحمتك أستغيث» من كتاب الترمذي، ودعوات المكروب من سنن أبي داود، ودعوة ذي النون. {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
  en: "The supplication of distress and at grave matters, as al-Nawawi gathers it in al-Adhkar: Ibn Abbas's report in the two Sahihs, «يا حي يا قيوم برحمتك أستغيث» from al-Tirmidhi's book, the supplications of the distressed from Sunan Abi Dawud, and the supplication of Dhu al-Nun. {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
  ur: "کرب اور اہم معاملات کے وقت کی دعا، جیسا کہ نووی نے «الاذکار» میں جمع کیا: صحیحین میں ابن عباس کی روایت، ترمذی کی کتاب سے «يا حي يا قيوم برحمتك أستغيث»، سنن ابی داود سے مکروب کی دعائیں، اور ذو النون کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 121}"
  es: "La súplica de angustia y en asuntos graves, como la recoge al-Nawawi en al-Adhkar: el informe de Ibn Abbas en los dos Sahihs, «يا حي يا قيوم برحمتك أستغيث» del libro de al-Tirmidhi, las súplicas de los afligidos de Sunan Abi Dawud, y la súplica de Dhu al-Nun. {citar:al-adhkar-nawawi-arnaut-1994 p. 121}"
  fr: "La supplication de la détresse et des questions graves, comme al-Nawawi le rassemble dans al-Adhkar: le rapport d'Ibn Abbas dans les deux Sahihs, «يا حي يا قيوم برحمتك أستغيث» du livre d'al-Tirmidhi, les supplications des affligés de Sunan Abi Dawud et la supplication de Dhu al-Noun. { citer: al-adhkar-nawawi-arnaut-1994 p. 121}"
  tr: "En-Nevavi'nin \"El-Adhkar\"da derlediği gibi önemli konular için acı ve dua: İbn Abbas'ın iki Sahih'teki hadisi, \"Ey Yaşayan, Ey Sürdüren, Merhametinle yardım arıyorum\" Tirmizi kitabından ve Ebu Davud'un Süneni'nden mağdurların duaları ile Zhu'lu-Nun'un duası. {cite:al-adhkar-nawawi-arnaut-1994 s. 121}"
  id: "Doa untuk penderitaan dan permohonan untuk hal-hal penting, sebagaimana disusun oleh An-Nawawi dalam \"Al-Adhkar\": hadis Ibn Abbas dalam dua Sahih, \"Wahai Yang Hidup Selama, wahai Penopang, dengan rahmat-Mu aku memohon pertolongan\" dari kitab At-Tirmidhi, dan permohonan orang yang menderita dari Sunan Abu Dawood, dan permohonan Dhu al-Nun. {cite:Al-Adhkar-Nawawi-Arnaut-1994 hlm. 121}"
