label: {ar: "ثياب العيد", en: "New clothes for Eid", ur: "عید کے نئے کپڑے"}
summary:
  ar: "من سنن العيد لبس أجمل الثياب: جاء في دائرة المعارف الإسلامية أن الناس يلبسون في العيدين جديداً أو أفضل ما عندهم، ويُنقل عن ابن عمر أنه كان يلبس أجمل ثيابه يوم العيد. في بنغلاديش تعد ثياب العيد هدية السنة الأولى، وفي تركيا يقبّل الصغار أيدي الكبار تحت ثيابهم الجديدة."
  en: "Wearing one's finest on Eid is sunna: the Encyclopaedia of Islam records that on both festivals people put on new clothes or at least their best, and Ibn Umar is reported to have worn his finest on the day. In Bangladesh the year's first gift is often the Eid outfit; in Turkey children kiss elders' hands in their new clothes."
  ur: "عید کے دن اچھے کپڑے پہننا سنت ہے: انسائیکلوپیڈیا آف اسلام لکھتی ہے کہ دونوں عیدوں میں لوگ نئے یا بہترین کپڑے پہنتے ہیں اور ابن عمر سے منقول ہے کہ وہ عید کے دن اپنے سب سے اچھے کپڑے پہنتے تھے؛ بنگلہ دیش میں سال کا پہلا تحفہ عموماً عید کا جوڑا ہوتا ہے اور ترکی میں بچے نئے کپڑوں میں بزرگوں کے ہاتھ چومتے ہیں۔"
