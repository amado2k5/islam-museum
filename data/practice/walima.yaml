label:
  ar: الوليمة
  en: The wedding feast (walima)
  es: "El banquete de bodas (walima)"
  fr: "Le festin de mariage (walima)"
  ur: "شادی کی دعوت ⁦(ولیمہ)⁩"
  tr: "Ziyafet"
  id: "Jamuan"
summary:
  ar: "وليمة العرس؛ أمر بها النبي «أولم ولو بشاة»، وتتسع أعرافها بين البلدان من مائدة بيت إلى مواسم قوم كاملة."
  en: "The wedding feast; the Prophet commanded it — 'give a feast even with a single sheep' — and its scale ranges from a family table to whole-town festivals."
  es: "El banquete nupcial; el Profeta lo ordenó: \"Ofreced un banquete incluso con una sola oveja\", y su magnitud varía desde una mesa familiar hasta festivales de toda una ciudad."
  fr: "Le festin de noces; le Prophète l’a ordonné: « Donnez un festin même avec un seul mouton », et son ampleur varie d’une table familiale à des fêtes qui réunissent toute une ville."
  ur: "شادی کی دعوت؛ پیغمبر نے اسے حکم دیا - 'ایک بھیڑ کے ساتھ بھی دعوت دو' - اور اس کا پیمانہ خاندانی میز سے لے کر پورے شہر کے تہواروں تک ہے۔"
  tr: "Düğün ziyafeti; Peygamber ona \"koyun olsa bile\" emretti ve gelenekleri bir ev sofrasından tüm halkın mevsimlerine kadar ülkelere yayıldı."
  id: "Perayaan pernikahan; Nabi memerintahkannya \"meskipun itu seekor domba,\" dan adatnya menyebar ke berbagai negara mulai dari meja rumah tangga hingga musim seluruh orang."
