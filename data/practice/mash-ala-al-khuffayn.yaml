id: practice/mash-ala-al-khuffayn
class: practice
kind: ritual
label: { ar: "المسح على الخفين", en: "Wiping over leather socks (al-mash 'ala al-khuffayn)", ur: "موزوں پر مسح" }
summary:
  ar: "المسح على الخفين أن يمسح المتوضئ على خفّيه بدل غسل رجليه؛ عقد له أبو داود «باب المسح على الخفين» و«باب التوقيت في المسح» و«باب المسح على الجوربين»، وروى فيه حديث المغيرة بن شعبة في غزوة تبوك «دع الخفين فإني أدخلت القدمين الخفين وهما طاهرتان»، وحديث خزيمة بن ثابت «للمسافر ثلاثة أيام وللمقيم يوم وليلة»؛ ويستدل الخطابي بحديث جرير على أنه غير منسوخ، ويحكي أن عامة الفقهاء على التوقيت، وأن مالكاً قال يمسح من غير توقيت {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 79-86}."
  en: "Wiping over leather socks is passing wet hands over one's khuffs in ablution instead of washing the feet; Abu Dawud gives it chapters on wiping over khuffs, on its time limit and on wiping over woollen socks, with al-Mughira ibn Shu'ba's report from the Tabuk campaign, 'leave the khuffs, for I put my feet into them while they were pure', and Khuzayma ibn Thabit's, 'three days for the traveller, a day and a night for the resident'; al-Khattabi argues from Jarir's report that it was not abrogated, and relates that most jurists hold to the time limit while Malik said one may wipe without limit {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 79-86}."
  ur: "موزوں پر مسح یہ ہے کہ وضو کرنے والا پاؤں دھونے کے بجائے اپنے موزوں پر مسح کرے؛ ابو داؤد نے اس کے لیے «موزوں پر مسح»، «مسح کی مدت» اور «جرابوں پر مسح» کے ابواب باندھے، اور غزوۂ تبوک کی مغیرہ بن شعبہ والی حدیث «موزے رہنے دو، میں نے پاؤں پاکی کی حالت میں ان میں ڈالے تھے» اور خزیمہ بن ثابت کی حدیث «مسافر کے لیے تین دن اور مقیم کے لیے ایک دن رات» روایت کی؛ خطابی جریر کی حدیث سے استدلال کرتے ہیں کہ یہ منسوخ نہیں، اور بتاتے ہیں کہ عام فقہا مدت کے قائل ہیں جبکہ مالک نے کہا کہ بغیر مدت کے مسح کرے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 79-86}۔"
basis:
  - { tradition: sunni, value: prophetic-practice }
scriptural_basis: [passage/quran-5-6]
perspectives:
  - tradition: sunni
    id: timed-wiping
    standing: main
    stance: { ar: "المسح جائز غير منسوخ، مؤقت بيوم وليلة للمقيم وثلاثة أيام للمسافر", en: "Wiping is permitted and not abrogated, limited to a day and night for the resident and three days for the traveller" }
    summary: { ar: "يقول الخطابي إن الأصل في التوقيت يوم وليلة للمقيم وثلاثة أيام ولياليهن للمسافر كما في خبري خزيمة بن ثابت وصفوان بن عسال، وهو قول عامة الفقهاء؛ وينقل عن البخاري أنه ليس في التوقيت شيء أصح من حديث صفوان؛ ويشترط مع مالك والشافعي وأحمد وإسحاق أن يُلبس الخفان على كمال الطهارة. ويرى في قول جرير «ما أسلمت إلا بعد نزول المائدة» إثباتاً أن المسح غير منسوخ.", en: "Al-Khattabi says the basic rule is a day and night for the resident and three days and nights for the traveller, as in the reports of Khuzayma ibn Thabit and Safwan ibn 'Assal, and that this is the view of most jurists; he quotes al-Bukhari that nothing on the time limit is sounder than Safwan's report; with Malik, al-Shafi'i, Ahmad and Ishaq he requires that the khuffs be put on in a state of complete purity. He reads Jarir's words 'I became Muslim only after al-Ma'ida was revealed' as proof that wiping was not abrogated." }
    holders: [person/abu-sulayman-al-khattabi, person/al-shafii, person/ahmad-ibn-hanbal, person/ishaq-ibn-rahwayh, person/jarir-ibn-abd-allah-al-bajali]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-maliki
    id: malik-untimed
    standing: main
    stance: { ar: "يمسح من غير توقيت", en: "One may wipe without a time limit" }
    summary: { ar: "يحكي الخطابي أن مالكاً قال: يمسح من غير توقيت، أخذاً بظاهر حديث أُبيّ بن عمارة «نعم وما شئت»، ويقول أبو داود إن هذا الحديث اختُلف في إسناده وليس بالقوي.", en: "Al-Khattabi relates that Malik said one may wipe without a time limit, following the plain wording of Ubayy ibn 'Imara's report 'yes, as long as you wish'; Abu Dawud says the chain of that report is disputed and it is not strong." }
    holders: [person/malik-ibn-anas]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: other
    id: abrogation-claim-as-reported
    standing: other
    stance: { ar: "قول منسوب إلى علي في نسخ المسح بآية المائدة، كما يحكيه الخطابي عن قوم من الشيعة", en: "A saying ascribed to 'Ali that wiping was abrogated by the verse of al-Ma'ida, as al-Khattabi reports it from a group of the Shi'a" }
    summary: { ar: "يذكر الخطابي أن قوماً من الشيعة رووا عن علي أن المسح على الخفين كان قبل نزول المائدة ثم نُهي عنه، ويقول إنه لا يصح عن علي، وإن الثابت عنه قوله إنه لو كان الدين بالرأي لكان باطن الخف أولى بالمسح من ظاهره. هذا القول مذكور هنا بلسان ناقده، ولم يُنقل بعد من مصادر أصحابه.", en: "Al-Khattabi notes that a group of the Shi'a relate from 'Ali that wiping over khuffs was before al-Ma'ida was revealed and was then forbidden, and says this is not authentically from 'Ali, whose established saying is that if religion went by opinion the underside of the khuff would be more fit for wiping than the top. This view is given here in its critic's words; it has not yet been taken from its holders' own sources." }
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
