label:
  ar: "العطّار"
  en: "The 'attar (perfumer and druggist)"
summary:
  ar: "في الأصل بائع العطور والأدوية، ثم صار اللفظ يعني الصيدلي والمعالج بالأعشاب، وكان يجمع بين التجارة والطب، فعليه أن يعرف الأدوية وأصنافها وأحوالها وأنواعها الجيدة والرديئة وما يغشّ منها، وكيف يُحفظ دواؤه أو يُعاد تركيبه {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
  en: "Originally a dealer in perfumes and drugs, the 'attar came to mean a chemist and herbal practitioner. His trade combined commerce with medicine: he had to know the drugs, their good and bad varieties, what was adulterated, and how to preserve or reconstitute them {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
