id: practice/attar-druggist
class: practice
kind: craft
label:
  ar: "العطّار"
  en: "The 'attar (perfumer and druggist)"
  es: "El 'attar (perfumista y boticario)"
  fr: "L'attar (parfumeur et droguiste)"
  ur: "عطار ⁦(عطر اور دوا ساز)⁩"
  tr: "Parfümcü"
  id: "Pembuat parfum"
summary:
  ar: "في الأصل بائع العطور والأدوية، ثم صار اللفظ يعني الصيدلي والمعالج بالأعشاب، وكان يجمع بين التجارة والطب، فعليه أن يعرف الأدوية وأصنافها وأحوالها وأنواعها الجيدة والرديئة وما يغشّ منها، وكيف يُحفظ دواؤه أو يُعاد تركيبه {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
  en: "Originally a dealer in perfumes and drugs, the 'attar came to mean a chemist and herbal practitioner. His trade combined commerce with medicine: he had to know the drugs, their good and bad varieties, what was adulterated, and how to preserve or reconstitute them {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
  es: "Originalmente comerciante de perfumes y drogas, el término «attar» pasó a significar químico y herbolario. Su oficio combinaba el comercio con la medicina: debía conocer las drogas, sus variedades buenas y malas, cuáles estaban adulteradas y cómo conservarlas o reconstituirlas {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
  fr: "À l'origine marchand de parfums et de médicaments, l'attar en est venu à désigner un chimiste et un herboriste. Son métier alliait commerce et médecine: il devait connaître les médicaments, leurs bonnes et mauvaises variétés, ce qui était falsifié, et comment les conserver ou les reconstituer {cite:encyclopaedia-of-islam-2 vol. 1 p. 800}."
  ur: "اصل میں پرفیوم اور دوائیوں کا سوداگر، عطار کا مطلب کیمسٹ اور جڑی بوٹیوں کا پریکٹیشنر تھا۔ اس کی تجارت نے دوائیوں کے ساتھ تجارت کو جوڑ دیا: اسے دوائیوں، ان کی اچھی اور بری اقسام، ملاوٹ والی چیزوں اور ان کو کیسے محفوظ کرنا یا دوبارہ تشکیل دینا ہے یہ جاننا تھا {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 800}۔"
