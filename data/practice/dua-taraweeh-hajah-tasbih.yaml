id: practice/dua-taraweeh-hajah-tasbih
class: practice
kind: ritual
label:
  ar: "أذكار التراويح وصلاة الحاجة وصلاة التسبيح"
  en: "Remembrances in the Tarawih prayer, the prayer of need and the prayer of glorification"
  ur: "تراویح، صلاۃ الحاجۃ اور صلاۃ التسبیح کے اذکار"
  es: "Recuerdos en la oración de Tarawih, la oración de necesidad y la oración de glorificación."
summary:
  ar: "ما جمعه النووي في «الأذكار» عن أذكار صلاة التراويح، وصلاة الحاجة وما روي فيها من أدعية، وصلاة التسبيح وما قيل في أحاديثها ومن استحبها من الأئمة. {cite:al-adhkar-nawawi-arnaut-1994 p. 183}"
  en: "What al-Nawawi gathers in al-Adhkar on the remembrances in the Tarawih prayer, the prayer of need and the supplications reported for it, and the prayer of glorification with what is said of its reports and of the imams who held it recommended. {cite:al-adhkar-nawawi-arnaut-1994 p. 183}"
  ur: "جو نووی نے «الاذکار» میں تراویح کے اذکار، صلاۃ الحاجۃ اور اس کے بارے میں منقول دعاؤں، اور صلاۃ التسبیح، اس کی روایات پر کلام اور اسے مستحب کہنے والے ائمہ کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 183}"
  es: "Lo que al-Nawawi recopila en al-Adhkar sobre las oraciones de Tarawih, la oración de necesidad y las súplicas que se le atribuyen, y la oración de glorificación, con lo que se dice de sus relatos y de los imanes que la consideraron recomendable. {cite:al-adhkar-nawawi-arnaut-1994 p. 183}"
