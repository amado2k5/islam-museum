  en: "Sujud al-tilawa is a prostration made when reciting one of the Qur'an's prostration verses; the Kuwaiti Fiqh Encyclopedia devotes a section to its rulings and its repetition in a single sitting {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "Sujud al-tilawa es una postración que se realiza al recitar uno de los versículos de postración del Corán; la Enciclopedia de Fiqh de Kuwait dedica una sección a sus normas y a su repetición en una sola sesión {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Sujud al-tilawa est une prosternation effectuée lors de la récitation d'un des versets de prosternation du Coran; l'Encyclopédie Fiqh koweïtienne consacre une section à ses règles et à sa répétition en une seule séance {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
