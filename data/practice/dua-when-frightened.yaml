id: practice/dua-when-frightened
class: practice
kind: ritual
label:
  ar: "ما يقال عند الفزع"
  en: "What is said when startled or frightened"
  ur: "خوف اور گھبراہٹ کے وقت کی دعا"
summary:
  ar: "ما يقوله من راعه شيء أو فزع كما جمعه النووي في «الأذكار»: حديث ثوبان من كتاب ابن السني، والاستعاذة بكلمات الله التامة من سنن أبي داود والترمذي. {cite:al-adhkar-nawawi-arnaut-1994 p. 122}"
  en: "What is said by someone startled or frightened, as al-Nawawi gathers it in al-Adhkar: Thawban's report from Ibn al-Sunni's book, and the plea for refuge in God's complete words from the Sunan of Abu Dawud and al-Tirmidhi. {cite:al-adhkar-nawawi-arnaut-1994 p. 122}"
  ur: "گھبرانے یا ڈرنے والا کیا کہے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: ابن السنی کی کتاب سے ثوبان کی روایت، اور سنن ابی داود اور ترمذی سے اللہ کے کلماتِ تامہ کے ساتھ استعاذہ۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 122}"
