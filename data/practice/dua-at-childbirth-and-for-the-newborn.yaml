  en: "What al-Nawawi gathers at the close of the Book of the Remembrances of Marriage: what is said at childbirth, the call to prayer in the newborn's ear, and the tahnik with a prayer for the child. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
