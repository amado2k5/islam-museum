label:
  ar: "عند الولادة وللمولود"
  en: "At childbirth and for the newborn"
  ur: "ولادت کے وقت اور نومولود کے لیے"
  es: "En el parto y para el recién nacido"
  fr: "À l'accouchement et pour le nouveau-né"
  tr: "Doğumda ve yenidoğan için"
  id: "Saat lahir dan untuk bayi baru lahir"
summary:
  ar: "ما أورده النووي في ختام «كتاب أذكار النكاح» مما يقال عند الولادة والأذان في أذن المولود وتحنيكه والدعاء له. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
  en: "What al-Nawawi gathers at the close of the Book of the Remembrances of Marriage: what is said at childbirth, the call to prayer in the newborn's ear, and the tahnik with a prayer for the child. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
  ur: "جو نووی نے «کتاب اذکار النکاح» کے آخر میں جمع کیا: ولادت کے وقت کیا کہا جائے، نومولود کے کان میں اذان، اور تحنیک اور بچے کے لیے دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
  es: "Lo que al-Nawawi recopila al final del Libro de los Recuerdos del Matrimonio: lo que se dice en el parto, la llamada a la oración al oído del recién nacido y el tahnik con una oración por el niño. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
  fr: "Ce que rassemble al-Nawawi à la fin du Livre des Souvenirs du Mariage: les paroles prononcées lors de la naissance, l’appel à la prière à l’oreille du nouveau-né et le tahnik accompagné d’une prière pour l’enfant. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
  tr: "Al-Nawawi'nin 'Evlilik Anma Kitabı'nın sonunda doğumda söylenenler, yeni doğan bebeğin kulağında ezan çağrısı, yenidoğanın akortu ve onun için yapılan dua hakkında bahsettikleri. {cite:al-adhkar-nawawi-arnaut-1994 s. 285}"
  id: "Apa yang disebutkan Al-Nawawi di akhir 'Kitab Kenangan Pernikahan' mengenai apa yang dikatakan saat lahir, panggilan untuk berdoa di telinga bayi baru lahir, penyetelan bayi baru lahir, dan doa untuknya. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 285}"
