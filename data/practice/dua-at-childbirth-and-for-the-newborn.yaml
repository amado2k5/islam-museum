  es: "Lo que al-Nawawi recopila al final del Libro de los Recuerdos del Matrimonio: lo que se dice en el parto, la llamada a la oración al oído del recién nacido y el tahnik con una oración por el niño. {cite:al-adhkar-nawawi-arnaut-1994 p. 285}"
