label: {ar: "القرقيعان", en: "Gargee'an", ur: "قرقيعان"}
summary:
  ar: "ليلة أطفال الخليج في منتصف رمضان ⁦(13-15)⁩: يلبس الأولاد والبنات الثياب التقليدية ويطوفون على بيوت الجيران بعد المغرب يغنون أهازيج البركة مقابل الحلوى والمكسرات. تسمى في الإمارات «حق الليلة» وتُقام قبل أسبوعين من رمضان، وفي عُمان «قرنقشو»؛ بعض البيوت توزع أكثر من عشرة كيلوغرامات."
  en: "The Gulf's mid-Ramadan children's night (13th–15th): boys and girls in traditional dress go door to door after maghrib, singing blessing songs for sweets and nuts — the Gulf's own trick-or-treat. The UAE's haq al-layla comes two weeks before Ramadan, Oman calls it qaranqasho, and some houses give out more than ten kilograms of sweets."
  ur: "قرقيعان خلیج کی وسطِ رمضان کی بچوں کی رات ہے ⁦(13-15)⁩: لڑکے لڑکیاں روایتی لباس میں مغرب کے بعد ہمسائیوں کے دروازوں پر نغمے گا کر مٹھائی اور مویز لیتے ہیں — خلیجی طرز کی ٹرک اور ٹریٹ؛ متحدہ عرب امارات میں یہ حق اللیلہ کہلاتی ہے اور رمضان سے دو ہفتے پہلے منائی جاتی ہے، عمان میں قرنقشو، اور کچھ گھر دس کلوگرام سے زائد مٹھائی بانٹتے ہیں۔"
