label:
  ar: الدعاء
  en: Du'a (supplication)
  es: "Du'a (súplica)"
  fr: "Du'a (supplication)"
  ur: "دعا ⁦(دعا)⁩"
summary:
  ar: "التضرع إلى الله بالمسألة؛ ورد «ادعوني أستجب لكم»، ويجعله العلماء مخ العبادة، وله أداب من استقبال القبلة إلى رفع اليدين. ويجمع جامع الترمذي في أبواب الدعوات أن الدعاء هو العبادة وأن الله أكرم ما عنده الدعاء {cite:jami-al-tirmidhi p.770}، وأن من لم يسأل الله يغضب عليه {cite:jami-al-tirmidhi p.770}، وأن خير الأعمال وأزكاها عند الملك ذكر الله {cite:jami-al-tirmidhi p.771}، وأن القوم الذين يذكرون الله تحف بهم الملائكة وتنزل عليهم السكينة ويذكرهم الله عنده {cite:jami-al-tirmidhi p.771}، وأن دعوة المسلم مستجابة ما لم يدع بإثم أو قطيعة رحم {cite:jami-al-tirmidhi p.772}، وأن من سره أن يستجيب الله له عند الشدائد والكرب فليكثر الدعاء في الرخاء {cite:jami-al-tirmidhi p.772}، وأن رفع الأيدي في الدعاء من سنته حتى مسح بيديه وجهه {cite:jami-al-tirmidhi p.773}، وأن الدعاء لا يستجاب إن استعجل صاحبه فقال دعوت فلم يستجب لي {cite:jami-al-tirmidhi p.773}؛ ويجمع مشكاة المصابيح كتاب الدعوات أبوابه من باب ذكر الله والتقرب إليه وأسماء الله وثواب التسبيح والتحميد والتهليل والتكبير والاستغفار والتوبة وسعة رحمة الله وما يقول عند الصباح والمساء والدعوات في الأوقات والاستعاذة وجامع الدعاء {cite:mishkat-al-masabih p.698} إلى {cite:mishkat-al-masabih p.765}، وفي جامع الدعاء دعاء أبي موسى الأشعري: اللهم اغفر لي خطيئتي وجهلي وإسرافي في أمري وما أنت أعلم به مني {cite:mishkat-al-masabih p.765}، وأن أكثر دعاء النبي اللهم آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار {cite:mishkat-al-masabih p.766}، ودعاء ابن عباس رب أعنّي ولا تعن علي وانصرني ولا تنصر علي واهدني ويسر الهدى لي وصرني على من بغى علي واذكر بالهدى هدى الله من هديك {cite:mishkat-al-masabih p.766}، وأن رجلا سأل أي الدعاء أفضل فقال سل ربك العافية والمعافاة في الدنيا والآخرة {cite:mishkat-al-masabih p.767}، ودعاء عمر اللهم زدنا ولا تنقصنا وأكرمنا ولا تهنا وأعطنا ولا تحرمنا وآثرنا ولا تؤثر علينا وأرضنا وارض عنا حتى قال أنزلت علي عشر آيات من أقامهن دخل الجنة {cite:mishkat-al-masabih p.767} و{cite:mishkat-al-masabih p.768}. وتصف دائرة المعارف الإسلامية الدعاء بأنه نداء موجه إلى الله، وتلخص شروطه وآدابه كما عند الباجوري، وصوره الشعائرية كالاستسقاء، وخلاف المعتزلة والأشاعرة والفلاسفة في أثره."
  en: "Supplication to God; the Qur'an says 'call on Me, I answer you', scholars call it the marrow of worship, with etiquettes from facing the qibla to raising the hands. Jami' al-Tirmidhi's Book of Supplications gathers: that supplication is worship and that nothing is more honoured by God than supplication {cite:jami-al-tirmidhi p.770}; that whoever does not ask God earns His anger {cite:jami-al-tirmidhi p.770}; that the best and purest of deeds before one's King is the remembrance of God {cite:jami-al-tirmidhi p.771}; that when people sit remembering God the angels surround them, mercy descends, tranquillity settles and God mentions them before Him {cite:jami-al-tirmidhi p.771}; that the Muslim's supplication is answered provided he does not ask for sin or severing kinship {cite:jami-al-tirmidhi p.772}; that whoever wishes God to answer him in hardship and distress should multiply supplication in ease {cite:jami-al-tirmidhi p.772}; that raising the hands in supplication was his practice until he wiped his face with them {cite:jami-al-tirmidhi p.773}; and that a supplication is not answered if its petitioner hastens and says 'I supplicated and was not answered' {cite:jami-al-tirmidhi p.773}; and Mishkat al-Masabih's Book of Supplications gathers its chapters from the remembrance of God and drawing near to Him, the names of God, the reward of glorification and praise, seeking forgiveness and repentance, the breadth of God's mercy, the words for morning and evening, supplications at their times, seeking refuge and the comprehensive supplications {cite:mishkat-al-masabih p.698} to {cite:mishkat-al-masabih p.765}; in the comprehensive supplications, Abu Musa al-Ash'ari's prayer 'O God, forgive me my sin, my ignorance and my excess in my affair, and what You know best of it about me' {cite:mishkat-al-masabih p.765}; that the Prophet's most repeated supplication was 'O God, grant us good in this world and good in the Hereafter, and shield us from the punishment of the Fire' {cite:mishkat-al-masabih p.766}; Ibn Abbas's prayer 'O Lord, help me and do not forsake me, aid me and do not aid against me, guide me and ease guidance for me, support me against whoever oppresses me' {cite:mishkat-al-masabih p.766}; that a man asked which supplication is best and was told 'ask your Lord for well-being and safety in this world and the Hereafter' {cite:mishkat-al-masabih p.767}; and Umar's prayer 'O God, increase us and do not decrease us, honour us and do not humiliate us, give us and do not deprive us, prefer us and do not prefer others over us, satisfy us and be satisfied with us', until he said 'ten verses were revealed upon me, whoever upholds them enters Paradise' {cite:mishkat-al-masabih p.767} and {cite:mishkat-al-masabih p.768}. The Encyclopaedia of Islam describes it as an appeal addressed to God, sums up its conditions and manners as given by al-Bajuri and its set ritual forms such as the prayer for rain, and reports how the Mu'tazila, the Ash'aris and the philosophers differed on its effect."
  ur: "دعا اللہ سے خطاب کرتے ہوئے درخواست اور پکار ہے۔ انسائیکلوپیڈیا آف اسلام اس کی شرائط اور آداب کو باجوری کے بیان کے مطابق، اس کی مقررہ رسمی صورتوں جیسے بارش کی نماز کو، اور اس کے اثر کے بارے میں معتزلہ، اشاعرہ اور فلاسفہ کے اختلاف کو بیان کرتا ہے۔"
  es: "La súplica a Dios; el Corán dice 'invocadme, y yo os responderé', los eruditos la llaman la esencia de la adoración, con protocolos que van desde mirar hacia la qibla hasta levantar las manos. El Libro de las Súplicas de Jami' al-Tirmidhi reúne: que la súplica es adoración y que nada es más honrado por Dios que la súplica {cite:jami-al-tirmidhi p.770}; que quien no pide a Dios se gana Su ira {cite:jami-al-tirmidhi p.770}; que la mejor y más pura de las obras ante el Rey es el recuerdo de Dios {cite:jami-al-tirmidhi p.771}; que cuando la gente se sienta a recordar a Dios los ángeles los rodean, la misericordia desciende, la tranquilidad se instala y Dios los menciona ante Él {cite:jami-al-tirmidhi p.771}; que la súplica del musulmán es respondida siempre que no pida pecado o ruptura de parentesco {cite:jami-al-tirmidhi p.772}; que quien quiera que Dios le responda en la dificultad y la angustia debe multiplicar la súplica en la facilidad {cite:jami-al-tirmidhi p.772}; que levantar las manos en súplica era su práctica hasta que se frotó la cara con ellas {cite:jami-al-tirmidhi p.773}; y que una súplica no es respondida si su suplicante se apresura y dice 'Supliqué y no fui respondido' {cite:jami-al-tirmidhi p.773}; y el Libro de Súplicas de Mishkat al-Masabih reúne sus capítulos desde el recuerdo de Dios y el acercamiento a Él, los nombres de Dios, la recompensa de la glorificación y la alabanza, la búsqueda del perdón y el arrepentimiento, la amplitud de la misericordia de Dios, las palabras para la mañana y la tarde, las súplicas en sus momentos, la búsqueda de refugio y las súplicas completas {cite:mishkat-al-masabih p.698} a {cite:mishkat-al-masabih p.765}; en las súplicas completas, la oración de Abu Musa al-Ash'ari 'Oh Dios, perdóname mi pecado, mi ignorancia y mi exceso en mi asunto, y lo que Tú mejor sabes de mí' {cite:mishkat-al-masabih p.765}; que la súplica más repetida del Profeta fue 'Oh Dios, concédenos el bien en este mundo y el bien en el Más Allá, y protégenos del castigo del Fuego' {cite:mishkat-al-masabih p.766}; la oración de Ibn Abbas 'Oh Señor, ayúdame y no me abandones, ayúdame y no te opongas a mí, guíame y facilita mi guía, apóyame contra quien me oprime' {cite:mishkat-al-masabih p.766}; que un hombre preguntó cuál era la mejor súplica y se le dijo 'pide a tu Señor bienestar y seguridad en este mundo y en el Más Allá' {cite:mishkat-al-masabih p.767}; y la oración de Umar 'Oh Dios, auméntanos y no nos disminuyas, honranos y no nos humilles, danos y no nos prives, prefiéntenos y no prefieras a otros sobre nosotros, satisfácenos y complácete con nosotros', hasta que dijo 'diez versículos me fueron revelados, quien los sostiene entra en el Paraíso' {cite:mishkat-al-masabih p.767} y {cite:mishkat-al-masabih p.768}. La Enciclopedia del Islam la describe como una súplica dirigida a Dios, resume sus condiciones y maneras según lo dado por al-Bajuri y sus formas rituales establecidas como la oración para la lluvia, e informa cómo los Mu'tazila, los Ash'aris y los filósofos diferían sobre su efecto."
  fr: "L'invocation de Dieu; le Coran dit: « Invoquez-Moi, Je vous réponds ». Les savants la considèrent comme l'essence même de l'adoration, avec ses règles de bienséance, de l'orientation vers la qibla à l'élévation des mains. Le Livre des Invocations de Jami' al-Tirmidhi rassemble les points suivants: l'invocation est une forme d'adoration et rien n'est plus honoré par Dieu que l'invocation (Jami' al-Tirmidhi, p. 770); quiconque n'invoque pas Dieu s'attire Sa colère (Jami' al-Tirmidhi, p. 770); le meilleur et le plus pur des actes accomplis devant son Roi est l'évocation de Dieu (Jami' al-Tirmidhi, p. 771); lorsque les gens s'assoient pour invoquer Dieu, les anges les entourent, la miséricorde descend sur eux, la tranquillité s'installe et Dieu les mentionne auprès de Lui (Jami' al-Tirmidhi, p. 771). que la supplication du musulman est exaucée à condition qu'il ne demande pas de péché ni de rupture des liens de parenté {cite:jami-al-tirmidhi p.772}; que quiconque souhaite que Dieu lui réponde dans l'épreuve et la détresse doit multiplier les supplications dans l'aisance {cite:jami-al-tirmidhi p.772}; que lever les mains en supplication était sa pratique jusqu'à ce qu'il s'essuie le visage avec {cite:jami-al-tirmidhi p.773}; et qu'une supplication n'est pas exaucée si celui qui la demande se hâte de dire: « J'ai supplié et je n'ai pas été exaucé » {cite:jami-al-tirmidhi p.773}. et le Livre des Supplications de Mishkat al-Masabih rassemble ses chapitres à partir du souvenir de Dieu et du rapprochement de Lui, des noms de Dieu, de la récompense de la glorification et de la louange, de la recherche du pardon et du repentir, de l'étendue de la miséricorde de Dieu, des paroles pour le matin et le soir, des supplications à leurs moments, de la recherche de refuge et des supplications complètes {cite:mishkat-al-masabih p.698} à {cite:mishkat-al-masabih p.765}; dans les supplications complètes, la prière d'Abu Musa al-Ash'ari 'Ô Dieu, pardonne-moi mon péché, mon ignorance et mon excès dans ma vie, et ce que Tu sais le mieux de moi' {cite:mishkat-al-masabih p.765}; que la supplication la plus répétée du Prophète était: « Ô Dieu, accorde-nous le bien dans ce monde et le bien dans l’au-delà, et préserve-nous du châtiment du Feu » {cite: Mishkat al-Masabih, p. 766}; la prière d’Ibn Abbas: « Ô Seigneur, aide-moi et ne m’abandonne pas, soutiens-moi et ne me soutiens pas, guide-moi et facilite-moi le chemin, soutiens-moi contre quiconque m’opprime » {cite: Mishkat al-Masabih, p. 766}; qu’un homme demanda quelle était la meilleure supplication et qu’il lui fut répondu: « Demande à ton Seigneur le bien-être et la sécurité dans ce monde et dans l’au-delà » {cite: Mishkat al-Masabih, p. 767}. et la prière d'Umar: « Ô Dieu, accrois-nous et ne nous diminue pas, honore-nous et ne nous humilie pas, donne-nous et ne nous prive pas, préfère-nous et ne préfère personne à nous, satisfaits-nous et sois satisfait de nous », jusqu'à ce qu'il dise: « Dix versets m'ont été révélés. Quiconque les retient entrera au Paradis » (voir Mishkat al-Masabih, p. 767 et 768). L'Encyclopédie de l'Islam la décrit comme une invocation adressée à Dieu, en résume les conditions et les modalités selon al-Bajuri, ainsi que ses formes rituelles établies, comme la prière pour la pluie, et rapporte les divergences d'opinions entre les Mu'tazilites, les Ash'arites et les philosophes quant à son effet."
