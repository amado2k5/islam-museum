label:
  ar: الدعاء
  en: Du'a (supplication)
summary:
  ar: "التضرع إلى الله بالمسألة؛ ورد «ادعوني أستجب لكم»، ويجعله العلماء مخ العبادة، وله أداب من استقبال القبلة إلى رفع اليدين. ويجمع جامع الترمذي في أبواب الدعوات أن الدعاء هو العبادة وأن الله أكرم ما عنده الدعاء {cite:jami-al-tirmidhi p.770}، وأن من لم يسأل الله يغضب عليه {cite:jami-al-tirmidhi p.770}، وأن خير الأعمال وأزكاها عند الملك ذكر الله {cite:jami-al-tirmidhi p.771}، وأن القوم الذين يذكرون الله تحف بهم الملائكة وتنزل عليهم السكينة ويذكرهم الله عنده {cite:jami-al-tirmidhi p.771}، وأن دعوة المسلم مستجابة ما لم يدع بإثم أو قطيعة رحم {cite:jami-al-tirmidhi p.772}، وأن من سره أن يستجيب الله له عند الشدائد والكرب فليكثر الدعاء في الرخاء {cite:jami-al-tirmidhi p.772}، وأن رفع الأيدي في الدعاء من سنته حتى مسح بيديه وجهه {cite:jami-al-tirmidhi p.773}، وأن الدعاء لا يستجاب إن استعجل صاحبه فقال دعوت فلم يستجب لي {cite:jami-al-tirmidhi p.773}."
  en: "Supplication to God; the Qur'an says 'call on Me, I answer you', scholars call it the marrow of worship, with etiquettes from facing the qibla to raising the hands. Jami' al-Tirmidhi's Book of Supplications gathers: that supplication is worship and that nothing is more honoured by God than supplication {cite:jami-al-tirmidhi p.770}; that whoever does not ask God earns His anger {cite:jami-al-tirmidhi p.770}; that the best and purest of deeds before one's King is the remembrance of God {cite:jami-al-tirmidhi p.771}; that when people sit remembering God the angels surround them, mercy descends, tranquillity settles and God mentions them before Him {cite:jami-al-tirmidhi p.771}; that the Muslim's supplication is answered provided he does not ask for sin or severing kinship {cite:jami-al-tirmidhi p.772}; that whoever wishes God to answer him in hardship and distress should multiply supplication in ease {cite:jami-al-tirmidhi p.772}; that raising the hands in supplication was his practice until he wiped his face with them {cite:jami-al-tirmidhi p.773}; and that a supplication is not answered if its petitioner hastens and says 'I supplicated and was not answered' {cite:jami-al-tirmidhi p.773}."
