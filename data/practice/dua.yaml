label:
  ar: الدعاء
  en: Du'a (supplication)
summary:
  ar: "التضرع إلى الله بالمسألة؛ ورد «ادعوني أستجب لكم»، ويجعله العلماء مخ العبادة، وله أداب من استقبال القبلة إلى رفع اليدين. ويجمع جامع الترمذي في أبواب الدعوات أن الدعاء هو العبادة وأن الله أكرم ما عنده الدعاء {cite:jami-al-tirmidhi p.770}، وأن من لم يسأل الله يغضب عليه {cite:jami-al-tirmidhi p.770}، وأن خير الأعمال وأزكاها عند الملك ذكر الله {cite:jami-al-tirmidhi p.771}، وأن القوم الذين يذكرون الله تحف بهم الملائكة وتنزل عليهم السكينة ويذكرهم الله عنده {cite:jami-al-tirmidhi p.771}، وأن دعوة المسلم مستجابة ما لم يدع بإثم أو قطيعة رحم {cite:jami-al-tirmidhi p.772}، وأن من سره أن يستجيب الله له عند الشدائد والكرب فليكثر الدعاء في الرخاء {cite:jami-al-tirmidhi p.772}، وأن رفع الأيدي في الدعاء من سنته حتى مسح بيديه وجهه {cite:jami-al-tirmidhi p.773}، وأن الدعاء لا يستجاب إن استعجل صاحبه فقال دعوت فلم يستجب لي {cite:jami-al-tirmidhi p.773}؛ ويجمع مشكاة المصابيح كتاب الدعوات أبوابه من باب ذكر الله والتقرب إليه وأسماء الله وثواب التسبيح والتحميد والتهليل والتكبير والاستغفار والتوبة وسعة رحمة الله وما يقول عند الصباح والمساء والدعوات في الأوقات والاستعاذة وجامع الدعاء {cite:mishkat-al-masabih p.698} إلى {cite:mishkat-al-masabih p.765}، وفي جامع الدعاء دعاء أبي موسى الأشعري: اللهم اغفر لي خطيئتي وجهلي وإسرافي في أمري وما أنت أعلم به مني {cite:mishkat-al-masabih p.765}، وأن أكثر دعاء النبي اللهم آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار {cite:mishkat-al-masabih p.766}، ودعاء ابن عباس رب أعنّي ولا تعن علي وانصرني ولا تنصر علي واهدني ويسر الهدى لي وصرني على من بغى علي واذكر بالهدى هدى الله من هديك {cite:mishkat-al-masabih p.766}، وأن رجلا سأل أي الدعاء أفضل فقال سل ربك العافية والمعافاة في الدنيا والآخرة {cite:mishkat-al-masabih p.767}، ودعاء عمر اللهم زدنا ولا تنقصنا وأكرمنا ولا تهنا وأعطنا ولا تحرمنا وآثرنا ولا تؤثر علينا وأرضنا وارض عنا حتى قال أنزلت علي عشر آيات من أقامهن دخل الجنة {cite:mishkat-al-masabih p.767} و{cite:mishkat-al-masabih p.768}."
  en: "Supplication to God; the Qur'an says 'call on Me, I answer you', scholars call it the marrow of worship, with etiquettes from facing the qibla to raising the hands. Jami' al-Tirmidhi's Book of Supplications gathers: that supplication is worship and that nothing is more honoured by God than supplication {cite:jami-al-tirmidhi p.770}; that whoever does not ask God earns His anger {cite:jami-al-tirmidhi p.770}; that the best and purest of deeds before one's King is the remembrance of God {cite:jami-al-tirmidhi p.771}; that when people sit remembering God the angels surround them, mercy descends, tranquillity settles and God mentions them before Him {cite:jami-al-tirmidhi p.771}; that the Muslim's supplication is answered provided he does not ask for sin or severing kinship {cite:jami-al-tirmidhi p.772}; that whoever wishes God to answer him in hardship and distress should multiply supplication in ease {cite:jami-al-tirmidhi p.772}; that raising the hands in supplication was his practice until he wiped his face with them {cite:jami-al-tirmidhi p.773}; and that a supplication is not answered if its petitioner hastens and says 'I supplicated and was not answered' {cite:jami-al-tirmidhi p.773}; and Mishkat al-Masabih's Book of Supplications gathers its chapters from the remembrance of God and drawing near to Him, the names of God, the reward of glorification and praise, seeking forgiveness and repentance, the breadth of God's mercy, the words for morning and evening, supplications at their times, seeking refuge and the comprehensive supplications {cite:mishkat-al-masabih p.698} to {cite:mishkat-al-masabih p.765}; in the comprehensive supplications, Abu Musa al-Ash'ari's prayer 'O God, forgive me my sin, my ignorance and my excess in my affair, and what You know best of it about me' {cite:mishkat-al-masabih p.765}; that the Prophet's most repeated supplication was 'O God, grant us good in this world and good in the Hereafter, and shield us from the punishment of the Fire' {cite:mishkat-al-masabih p.766}; Ibn Abbas's prayer 'O Lord, help me and do not forsake me, aid me and do not aid against me, guide me and ease guidance for me, support me against whoever oppresses me' {cite:mishkat-al-masabih p.766}; that a man asked which supplication is best and was told 'ask your Lord for well-being and safety in this world and the Hereafter' {cite:mishkat-al-masabih p.767}; and Umar's prayer 'O God, increase us and do not decrease us, honour us and do not humiliate us, give us and do not deprive us, prefer us and do not prefer others over us, satisfy us and be satisfied with us', until he said 'ten verses were revealed upon me, whoever upholds them enters Paradise' {cite:mishkat-al-masabih p.767} and {cite:mishkat-al-masabih p.768}."
