id: practice/dua-at-the-completion-of-the-quran
class: practice
kind: ritual
label:
  ar: "الدعاء عند ختم القرآن"
  en: "Supplication at the completion of the Qur'an"
  ur: "قرآن کے ختم پر دعا"
  es: "Súplica al finalizar la lectura del Corán"
  fr: "Supplication à la fin du Coran"
  tr: "Kur'an'ı tamamlarken dua"
  id: "Doa saat menyelesaikan Al-Qur'an"
summary:
  ar: "ما جمعه النووي في فصل آداب الختم: صيام يوم الختم، وحضور مجلسه، وآثار السلف في الدعاء عنده، والإلحاح في الدعاء عقب الختمة. {cite:al-adhkar-nawawi-arnaut-1994 p. 104}"
  en: "What al-Nawawi gathers in his section on the etiquette of completing the Qur'an: fasting on the day of completion, attending the gathering, the early scholars' reports on supplicating then, and persisting in supplication after the completion. {cite:al-adhkar-nawawi-arnaut-1994 p. 104}"
  ur: "نووی نے ختم قرآن کے آداب کی فصل میں جو جمع کیا: ختم کے دن کا روزہ، ختم کی مجلس میں حاضری، اس وقت دعا کے بارے میں سلف کے آثار، اور ختم کے بعد دعا میں الحاح۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 104}"
  es: "Lo que al-Nawawi recopila en su sección sobre la etiqueta para completar el Corán: el ayuno el día de la finalización, la asistencia a la reunión, los relatos de los primeros eruditos sobre las súplicas en ese momento y la perseverancia en la súplica después de la finalización. {cite:al-adhkar-nawawi-arnaut-1994 p. 104}"
  fr: "Dans sa section consacrée à l'étiquette de la lecture complète du Coran, al-Nawawi rassemble les points suivants: le jeûne le jour de la lecture complète, la participation à la réunion, les récits des premiers savants sur les invocations à faire à ce moment-là, et la persévérance dans les invocations après la lecture complète. {cite:al-adhkar-nawawi-arnaut-1994 p. 104}"
  tr: "Al-Nawawi'nin sonuç görgü kuralları bölümünde topladıkları: sonuca ilişkin gün oruç tutmak, toplantılarına katılmak, ona göre ilk nesillerin dua üzerindeki etkileri ve sonuç sonrası dua ısrarı. {cite:al-adhkar-nawawi-arnaut-1994 s. 104}"
  id: "Apa yang dikumpulkan al-Nawawi dalam bab tentang etiket penutup: puasa pada hari penutupan, menghadiri pertemuannya, dampak generasi awal dalam doa menurut beliau, dan ketegasan dalam doa setelah penutupan. {sitasi:al-adhkar-nawawi-arnaut-1994 hlm. 104}"
