label:
  ar: عيد الأضحى
  en: Eid al-Adha
summary:
  ar: عيد الأضحى، ويسمى أيضا عيد القربان وعيد النحر والعيد الكبير، يقع في العاشر من ذي الحجة يوم يذبح الحجاج بمنى، وهو أول أيام التشريق. تعرض دائرة المعارف الإسلامية الأضحية سنة مؤكدة على الكفاية لكل مسلم حر قادر، لا تجب إلا بنذر، وتصف صلاة العيد بلا أذان ولا إقامة وخطبة من جزأين.
  en: Eid al-Adha, also called Eid al-Qurban, Eid al-Nahr and the major festival, falls on 10 Dhu al-Hijjah, the day pilgrims sacrifice at Mina and the first of the tashriq days. The Encyclopaedia of Islam describes the sacrifice as a communally binding sunna for every free Muslim who can afford it, made necessary only by a vow, and the festival prayer as having no adhan or iqama and a two-part sermon.
  ur: عید الاضحیٰ، جسے عید القربان، عید النحر اور بڑی عید بھی کہتے ہیں، ذی الحجہ کی دسویں کو آتی ہے جب حاجی منیٰ میں قربانی کرتے ہیں، اور یہ ایامِ تشریق کا پہلا دن ہے۔ انسائیکلوپیڈیا آف اسلام قربانی کو ہر آزاد صاحبِ استطاعت مسلمان پر سنتِ مؤکدہ بتاتا ہے جو صرف نذر سے لازم ہوتی ہے، اور نمازِ عید کو بغیر اذان اور اقامت کے دو حصوں کے خطبے کے ساتھ بیان کرتا ہے۔
