summary:
  ar: عيد الأضحى، ويسمى أيضا عيد القربان وعيد النحر والعيد الكبير، يقع في العاشر من ذي الحجة يوم يذبح الحجاج بمنى، وهو أول أيام التشريق. تعرض دائرة المعارف الإسلامية الأضحية سنة مؤكدة على الكفاية لكل مسلم حر قادر، لا تجب إلا بنذر، وتصف صلاة العيد بلا أذان ولا إقامة وخطبة من جزأين.
  en: Eid al-Adha, also called Eid al-Qurban, Eid al-Nahr and the major festival, falls on 10 Dhu al-Hijjah, the day pilgrims sacrifice at Mina and the first of the tashriq days. The Encyclopaedia of Islam describes the sacrifice as a communally binding sunna for every free Muslim who can afford it, made necessary only by a vow, and the festival prayer as having no adhan or iqama and a two-part sermon.
  ur: عید الاضحیٰ، جسے عید القربان، عید النحر اور بڑی عید بھی کہتے ہیں، ذی الحجہ کی دسویں کو آتی ہے جب حاجی منیٰ میں قربانی کرتے ہیں، اور یہ ایامِ تشریق کا پہلا دن ہے۔ انسائیکلوپیڈیا آف اسلام قربانی کو ہر آزاد صاحبِ استطاعت مسلمان پر سنتِ مؤکدہ بتاتا ہے جو صرف نذر سے لازم ہوتی ہے، اور نمازِ عید کو بغیر اذان اور اقامت کے دو حصوں کے خطبے کے ساتھ بیان کرتا ہے۔
  es: "Eid al-Adha, también llamado Eid al-Qurban, Eid al-Nahr y la fiesta principal, se celebra el 10 de Dhu al-Hijjah, día en que los peregrinos realizan el sacrificio en Mina y el primero de los días de tashriq. La Enciclopedia del Islam describe el sacrificio como una sunna de obligado cumplimiento para todo musulmán libre que pueda permitírselo, necesaria únicamente mediante un voto, y la oración festiva como una práctica sin adhan ni iqama, con un sermón dividido en dos partes."
  fr: "L'Aïd al-Adha, également appelé Aïd al-Qurban, Aïd al-Nahr ou fête majeure, a lieu le 10 Dhu al-Hijjah, jour du sacrifice du pèlerinage à Mina et premier jour des jours de Tashriq. L'Encyclopédie de l'Islam décrit le sacrifice comme une sunna obligatoire pour tout musulman libre et capable de l'accomplir, rendue nécessaire uniquement par un vœu. La prière de cette fête se déroule sans adhan ni iqama et comprend un sermon en deux parties."
  tr: "Ramazan Bayramı, aynı zamanda Raban Adha, Kurban Bayramı ve Ramazan Bayramı olarak da adlandırılır, Mina'da hacıların katledildiği Zulhiccâ'nın onuncusuna, yani Taşrik'in ilk gününe denk gelir. İslami Ansiklopedi, her özgür ve yetenekli Müslüman için yeterli olan bir kurban sünnetini sunar; bu sadece bir yemin ile zorunludur ve ezan çağrısı, ikama veya vaaz olmadan Bayram namazını iki bölüm halinde tanımlar."
  id: "Idul Fitri, juga disebut Idul Fitri, Idul Fitri, dan Idul Fitri, jatuh pada tanggal sepuluh Dhu al-Hijjah, hari para jamaah dibantai di Mina, yang merupakan hari pertama Tashreeq. Ensiklopedia Islam menyajikan Sunnah pengorbanan sebagai cukup untuk setiap Muslim yang bebas dan mampu, yang hanya wajib dengan janji, dan menggambarkan shalat Idul Fitri tanpa panggilan shalat, iqama, atau khotbah dalam dua bagian."
