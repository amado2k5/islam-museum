summary:
  ar: احتفالات ذكرى مولد النبي في الثاني عشر من ربيع الأول في معظم العالم الإسلامي — مواكب ومدائح وأسواق؛ يقرّها أغلب العلماء
    عرفاً ويعترض عليها آخرون.
  en: Public celebrations of the Prophet's birth on 12 Rabi al-Awwal across most of the Muslim world — processions, praise-chants
    and fairs; customary to many, disputed by some.
  es: "Las celebraciones públicas del nacimiento del Profeta el 12 de Rabi al-Awwal tienen lugar en la mayor parte del mundo musulmán: procesiones, cánticos de alabanza y ferias; una costumbre para muchos, cuestionada por algunos."
  fr: "Les célébrations publiques de la naissance du Prophète le 12 Rabi al-Awwal ont lieu dans la majeure partie du monde musulman — processions, chants de louange et foires; coutume pour beaucoup, contestée par certains."
  ur: "12 ربیع الاول کو تمام مسلم دنیا میں نبی کی ولادت کی عوامی تقریبات — جلوس، حمد و ثناء اور میلے؛ بہت سے لوگوں کے لیے رواج ہے، کچھ لوگوں کے درمیان اختلاف ہے۔"
