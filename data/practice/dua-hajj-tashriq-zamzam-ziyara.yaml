id: practice/dua-hajj-tashriq-zamzam-ziyara
class: practice
kind: ritual
label:
  ar: "أيام التشريق وزمزم ووداع البيت وزيارة المدينة"
  en: "The days of Tashriq, Zamzam, the farewell to the House and the visit to Medina"
  ur: "ایام تشریق، زمزم، بیت کا الوداع اور مدینہ کی زیارت"
summary:
  ar: "ما جمعه النووي في «الأذكار» من أذكار أيام التشريق بمنى، وشرب ماء زمزم، ووداع البيت، وزيارة قبر النبي والمسجد بالمدينة، وخاتمة أذكار الحج. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  en: "What al-Nawawi gathers in al-Adhkar on the remembrances of the days of Tashriq at Mina, drinking Zamzam, the farewell to the House, the visit to the Prophet's grave and mosque in Medina, and the close of the pilgrimage remembrances. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  ur: "جو نووی نے «الاذکار» میں ایام تشریق میں منیٰ کے اذکار، زمزم پینے، بیت کے الوداع، مدینہ میں نبی کی قبر اور مسجد کی زیارت اور حج کے اذکار کے اختتام کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
