id: practice/dua-hajj-tashriq-zamzam-ziyara
class: practice
kind: ritual
label:
  ar: "أيام التشريق وزمزم ووداع البيت وزيارة المدينة"
  en: "The days of Tashriq, Zamzam, the farewell to the House and the visit to Medina"
  ur: "ایام تشریق، زمزم، بیت کا الوداع اور مدینہ کی زیارت"
  es: "Los días de Tashriq, Zamzam, la despedida de la Casa y la visita a Medina."
  fr: "Les jours de Tashriq, de Zamzam, les adieux à la Maison et la visite à Médine"
  tr: "Taşreeq, Zemzem, Ev'e Veda ve Medine'yi ziyaret etme günleri"
  id: "Hari-hari Tashreeq, Zamzam, Perpisahan dengan Rumah, dan mengunjungi Madinah"
summary:
  ar: "ما جمعه النووي في «الأذكار» من أذكار أيام التشريق بمنى، وشرب ماء زمزم، ووداع البيت، وزيارة قبر النبي والمسجد بالمدينة، وخاتمة أذكار الحج. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  en: "What al-Nawawi gathers in al-Adhkar on the remembrances of the days of Tashriq at Mina, drinking Zamzam, the farewell to the House, the visit to the Prophet's grave and mosque in Medina, and the close of the pilgrimage remembrances. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  ur: "جو نووی نے «الاذکار» میں ایام تشریق میں منیٰ کے اذکار، زمزم پینے، بیت کے الوداع، مدینہ میں نبی کی قبر اور مسجد کی زیارت اور حج کے اذکار کے اختتام کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  es: "Lo que al-Nawawi recopila en al-Adhkar sobre los recuerdos de los días de Tashriq en Mina, el consumo de agua de Zamzam, la despedida de la Casa del Profeta, la visita a la tumba y mezquita del Profeta en Medina, y el cierre de los recuerdos de la peregrinación. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  fr: "Ce qu'al-Nawawi rassemble dans al-Adhkar concernant les commémorations des jours de Tashriq à Mina, la consommation de l'eau de Zamzam, les adieux à la Maison sacrée, la visite du tombeau du Prophète et de la mosquée à Médine, et la conclusion du pèlerinage. {cite:al-adhkar-nawawi-arnaut-1994 p. 202}"
  tr: "El-Nawavi'nin Mina'daki Taşreeq günlerinin 'Adhkar'ında derlediği şey, zamzam suyu içmek, Ev'e veda etmek, Peygamber'in mezarını ve Medine'deki camiyi ziyaret etmek ve Hac anmalarının sona ermesi. {alıntı:al-adhkar-nawawi-arnaut-1994 s. 202}"
  id: "Apa yang disusun al-Nawawi dalam 'Adhkar' pada masa Tashreeq di Mina, minum air Zamzam, mengucapkan selamat tinggal kepada Rumah, mengunjungi makam Nabi dan masjid di Madinah, serta penutupan peringatan Haji. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 202}"
