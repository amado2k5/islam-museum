id: practice/dua-bier-grave-burial
class: practice
kind: ritual
label:
  ar: "السير مع الجنازة والدفن وما بعده"
  en: "Walking with the bier, laying in the grave, and after the burial"
  ur: "جنازے کے ساتھ چلنا، قبر میں اتارنا اور تدفین کے بعد"
  es: "Caminando con el féretro, acostado en la tumba y después del entierro"
summary:
  ar: "ما جمعه النووي فيما يقال ويفعل عند السير مع الجنازة، ومرورها، وإدخال الميت القبر، وبعد الدفن، وتلقينه. {cite:al-adhkar-nawawi-arnaut-1994 p. 160}"
  en: "What al-Nawawi gathers on what is said and done in walking with the bier, on seeing it pass, in laying the dead in the grave, after the burial, and in prompting him. {cite:al-adhkar-nawawi-arnaut-1994 p. 160}"
  ur: "جنازے کے ساتھ چلنے، اسے گزرتے دیکھنے، میت کو قبر میں اتارنے، تدفین کے بعد اور تلقین کے بارے میں نووی نے جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 160}"
  es: "Lo que Al-Nawawi recopila sobre lo que se dice y se hace al acompañar el féretro, al verlo pasar, al depositar al difunto en la tumba, después del entierro y al incitarlo. {cite:al-adhkar-nawawi-arnaut-1994 p. 160}"
