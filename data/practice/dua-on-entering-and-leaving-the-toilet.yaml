id: practice/dua-on-entering-and-leaving-the-toilet
class: practice
kind: ritual
label:
  ar: "الدعاء عند دخول الخلاء والخروج منه"
  en: "Supplication on entering and leaving the toilet"
  ur: "بیت الخلا میں داخل ہونے اور نکلنے کی دعا"
summary:
  ar: "ما يقال عند دخول الخلاء والخروج منه كما جمعه النووي في «الأذكار»: الاستعاذة من الخبث والخبائث في الصحيحين، و«غفرانك» عند الخروج في السنن، وكراهة الذكر والكلام حال قضاء الحاجة. {cite:al-adhkar-nawawi-arnaut-1994 p. 25}"
  en: "What is said on entering and leaving the toilet, as al-Nawawi gathers it in al-Adhkar: the plea for refuge in the two Sahihs, «غفرانك» on leaving in the Sunan, and the dislike of remembrance and speech while relieving oneself. {cite:al-adhkar-nawawi-arnaut-1994 p. 25}"
  ur: "بیت الخلا میں داخل ہوتے اور نکلتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: صحیحین کا استعاذہ، نکلتے وقت «غفرانك» سنن سے، اور قضائے حاجت کے دوران ذکر اور کلام کی کراہت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 25}"
