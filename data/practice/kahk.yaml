summary:
  ar: "قرص العيد المصري: عجينة سمنة محشوة تمراً أو مكسرات أو عجوة تُرشّ بالسكر المطحون؛ تجتمع الأسرة آخر رمضان على «صناعة الكحك»، ويرجع المؤرخون أصله إلى الفطائر الفرعونية والفاطمية، وما زال بلا منازع ملك موائد عيد الفطر."
  en: "Egypt's Eid cookie: ghee pastry stuffed with dates, nuts or agameya and dusted with powdered sugar; families gather at the end of Ramadan for the kahk-baking, and historians trace its line to pharaonic and Fatimid pastry. It remains the uncontested king of the Eid al-Fitr table."
  ur: "کحک، مصر کی عید کی مٹھی: گھی کی لونٹ میں کھجور، مویز یا اگامیہ بھر کر باریک چینی چھڑکی جاتی ہے؛ رمضان کے آخر میں خاندان کحک سازی پر جمع ہوتے ہیں اور مورخ اس کا نسب فرعونی اور فاطمی پیسٹری تک پہنچاتے ہیں — عید الفطر کی دسترخوان کا بلامقابلہ بادشاہ۔"
