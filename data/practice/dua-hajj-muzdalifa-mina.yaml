label:
  ar: "أذكار مزدلفة والمشعر الحرام ومنى يوم النحر"
  en: "Remembrances at Muzdalifa, the Sacred Monument and Mina on the day of sacrifice"
  ur: "مزدلفہ، مشعر حرام اور یوم النحر کو منیٰ کے اذکار"
  es: "Conmemoraciones en Muzdalifa, el Monumento Sagrado y Mina en el día del sacrificio."
summary:
  ar: "ما جمعه النووي في «الأذكار» من أذكار الليلة بمزدلفة، والوقوف عند المشعر الحرام، والدفع إلى منى، ثم الرمي والنحر والحلق يوم النحر. {cite:al-adhkar-nawawi-arnaut-1994 p. 200}"
  en: "What al-Nawawi gathers in al-Adhkar on the night at Muzdalifa, the halt at the Sacred Monument, the setting out for Mina, and then the stoning, the sacrifice and the shaving on the day of sacrifice. {cite:al-adhkar-nawawi-arnaut-1994 p. 200}"
  ur: "جو نووی نے «الاذکار» میں مزدلفہ کی رات، مشعر حرام پر ٹھہرنے، منیٰ روانگی اور پھر یوم النحر کی رمی، قربانی اور حلق کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 200}"
  es: "Lo que al-Nawawi recoge en al-Adhkar sobre la noche en Muzdalifa, la parada en el Monumento Sagrado, la partida hacia Mina, y luego la lapidación, el sacrificio y el afeitado el día del sacrificio. {cite:al-adhkar-nawawi-arnaut-1994 p. 200}"
