label:
  ar: "أذكار الركوع"
  en: "What is said in bowing"
  ur: "رکوع کے اذکار"
  es: "Lo que se dice al hacer una reverencia"
  fr: "Que dit-on en s'inclinant ?"
summary:
  ar: "ما جمعه النووي في باب أذكار الركوع: التكبير للركوع وتسبيح الركوع والأذكار الواردة فيه من الصحيحين وغيرهما، وكراهة القراءة فيه. {cite:al-adhkar-nawawi-arnaut-1994 p. 51}"
  en: "What al-Nawawi gathers in the chapter on the words of bowing: the takbir for it, the glorification of the bowing and the reports from the two Sahihs and elsewhere, and the dislike of reciting in it. {cite:al-adhkar-nawawi-arnaut-1994 p. 51}"
  ur: "جو نووی نے رکوع کے اذکار کے باب میں جمع کیا: رکوع کی تکبیر، رکوع کی تسبیح، صحیحین وغیرہ سے وارد اذکار، اور رکوع میں قرأت کی کراہت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 51}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre las palabras de la reverencia: el takbir para ella, la glorificación de la reverencia y los relatos de los dos Sahihs y otras fuentes, y la aversión a recitar en ella. {cite:al-adhkar-nawawi-arnaut-1994 p. 51}"
  fr: "Dans le chapitre consacré aux paroles de l'inclinaison, al-Nawawi rassemble: le takbir correspondant, la glorification de l'inclinaison, les récits tirés des deux Sahihs et d'autres sources, ainsi que la réticence à réciter en suivant ce rite. {cite:al-adhkar-nawawi-arnaut-1994 p. 51}"
