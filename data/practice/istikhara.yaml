id: practice/istikhara
class: practice
kind: ritual
label: { ar: "صلاة الاستخارة", en: "Istikhara (prayer for guidance)" }
summary:
  ar: "ركعتان من غير الفريضة يصليهما من همّ بأمر، ثم يدعو بدعاء الاستخارة طالباً من الله الخير فيه؛ يذكر منتخب «إغاثة اللهفان» أن النبي علّمها أصحابه في الأمور كلها، وأنها بديل مشروع عن الكهانة والتنجيم والضرب بالحصى."
  en: "Two rak'as outside the obligatory prayers, performed by someone resolving on a matter, followed by a supplication asking God for what is good in it. The extract reports that the Prophet taught it for all matters, and presents it as the lawful alternative to divination, astrology and casting pebbles."
