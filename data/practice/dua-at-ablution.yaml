label:
  ar: "أذكار الوضوء"
  en: "Remembrances at ablution"
  ur: "وضو کے اذکار"
summary:
  ar: "ما يقال عند الوضوء وبعده كما جمعه النووي في «الأذكار»: التسمية أوله، والشهادتان بعده من صحيح مسلم، وما نقله عن السلف من أدعية الأعضاء مع قوله إنه لم يجئ فيها شيء عن النبي. {cite:al-adhkar-nawawi-arnaut-1994 p. 27}"
  en: "What is said at ablution and after it, as al-Nawawi gathers it in al-Adhkar: naming God at the start, the two testimonies afterwards from Sahih Muslim, and the limb-by-limb supplications he reports from the early generations while saying nothing of them comes from the Prophet. {cite:al-adhkar-nawawi-arnaut-1994 p. 27}"
  ur: "وضو کے وقت اور اس کے بعد کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: ابتدا میں تسمیہ، بعد میں شہادتین صحیح مسلم سے، اور اعضا کی وہ دعائیں جو وہ سلف سے نقل کرتے ہیں اور کہتے ہیں کہ ان میں نبی سے کچھ ثابت نہیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 27}"
