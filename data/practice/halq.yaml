summary:
  ar: "الحلق أو التقصير آخر مناسك يوم النحر بعد رمي جمرة العقبة والذبح: يحلق الرجال رؤوسهم أو يقصرون، وتقصر المرأة طرف شعرها قدر أنملة، وبه يحلّ التحلل الأكبر ويباح ما كان حراماً على المحرم."
  en: "Shaving or shortening the hair is the last rite of the Day of Sacrifice, after stoning Jamrat al-Aqaba and the offering: men shave or shorten their heads, women cut a fingertip's length, and with it comes the greater release from ihram, making lawful again what ihram had forbidden."
  ur: "حلق یا تقصیر یومِ نحر کی آخری رسم ہے — جمرۂ عقبہ کے رمی اور قربانی کے بعد: مرد سر مونڈتے یا بال کاٹتے ہیں اور عورت اپنی انگلی بھر بال کاٹتی ہے، اس کے ساتھ احرام کی بڑی تحلیل آتی ہے اور حرام شدہ چیزیں جائز ہو جاتی ہیں۔"
