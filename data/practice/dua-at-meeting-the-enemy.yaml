label:
  ar: "الدعاء عند لقاء العدو"
  en: "Supplication at meeting the enemy"
  ur: "دشمن سے آمنا سامنا ہونے کے وقت کی دعا"
  es: "Súplica al encontrarse con el enemigo"
summary:
  ar: "ما أورده النووي في «كتاب أذكار الجهاد» من الأدعية والأذكار المأثورة عند التقاء الصفين وخوف قوم، ومن كراهة رفع الصوت عند القتال. {cite:al-adhkar-nawawi-arnaut-1994 p. 209}"
  en: "What al-Nawawi gathers in the Book of the Remembrances of the Campaign on the supplications and remembrances reported for the meeting of two ranks and for fearing a people, and on disliking a raised voice in fighting. {cite:al-adhkar-nawawi-arnaut-1994 p. 209}"
  ur: "جو نووی نے «کتاب اذکار الجہاد» میں دو صفوں کے آمنے سامنے ہونے اور کسی قوم سے خوف کے وقت منقول دعاؤں اور اذکار کے بارے میں جمع کیا، اور لڑائی میں آواز بلند کرنے کی کراہت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 209}"
  es: "Lo que al-Nawawi recopila en el Libro de los Recuerdos de la Campaña sobre las súplicas y recuerdos que se recogen para el encuentro de dos filas y para temer a un pueblo, y sobre la aversión a alzar la voz en la batalla. {cite:al-adhkar-nawawi-arnaut-1994 p. 209}"
