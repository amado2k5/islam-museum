id: practice/dua-food-host-and-guest
class: practice
kind: ritual
label:
  ar: "دعاء الضيف لأهل الطعام وأذكار الضيافة"
  en: "The guest's supplication for the hosts and the remembrances of hospitality"
  ur: "میزبان کے لیے مہمان کی دعا اور مہمان نوازی کے اذکار"
  es: "La súplica del huésped a los anfitriones y el recuerdo de la hospitalidad."
  fr: "Les supplications de l'invité envers ses hôtes et les souvenirs de l'hospitalité"
  tr: "Misafirin yiyecek insanları ve misafirperverlik anma duası"
  id: "Doa tamu untuk makanan, orang-orang, dan kenangan keramahan"
summary:
  ar: "ما جمعه النووي في «الأذكار» من دعاء الضيف لأهل الطعام، والدعاء لمن سقى، وتحريض الناس على الضيافة، والثناء على من أكرم ضيفه، وما يقال بعد الانصراف عن الطعام. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  en: "What al-Nawawi gathers in al-Adhkar on the guest's supplication for the hosts, supplication for one who gave drink, urging people to hospitality, praise of one who honours his guest, and what is said after leaving the meal. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  ur: "جو نووی نے «الاذکار» میں مہمان کی میزبانوں کے لیے دعا، پانی پلانے والے کے لیے دعا، مہمان نوازی کی ترغیب، مہمان کی عزت کرنے والے کی تعریف اور کھانے سے اٹھنے کے بعد کے اذکار کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  es: "Lo que al-Nawawi recopila en al-Adhkar sobre la súplica del huésped a los anfitriones, la súplica a quien ofreció la bebida, la exhortación a la hospitalidad, el elogio a quien honra a su huésped y lo que se dice después de la comida. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble les prières de l'invité pour ses hôtes, les prières pour celui qui a offert à boire, l'exhortation à l'hospitalité, les éloges de celui qui honore son invité et les paroles prononcées après le repas. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  tr: "El-Newavi'nin \"El-Adhkar\"da topladığı bilgiler, misafirin yiyecek için yaptığı yalvarış, su verenlere yapılan dua, insanları misafirperver olmaya teşvik etmesi, misafirini onurlandıranı övmesi ve yemeği bıraktıktan sonra söylenenleri içerir. {cite:al-adhkar-nawawi-arnaut-1994 s. 237}"
  id: "Apa yang dikumpulkan al-Nawawi dalam \"Al-Adhkar\" meliputi permohonan tamu untuk makanan, permohonan kepada mereka yang memberi air, mendorong orang untuk bersikap ramah, memuji orang yang menghormati tamunya, dan apa yang dikatakan setelah meninggalkan makanan. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 237}"
