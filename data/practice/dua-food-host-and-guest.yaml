id: practice/dua-food-host-and-guest
class: practice
kind: ritual
label:
  ar: "دعاء الضيف لأهل الطعام وأذكار الضيافة"
  en: "The guest's supplication for the hosts and the remembrances of hospitality"
  ur: "میزبان کے لیے مہمان کی دعا اور مہمان نوازی کے اذکار"
summary:
  ar: "ما جمعه النووي في «الأذكار» من دعاء الضيف لأهل الطعام، والدعاء لمن سقى، وتحريض الناس على الضيافة، والثناء على من أكرم ضيفه، وما يقال بعد الانصراف عن الطعام. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  en: "What al-Nawawi gathers in al-Adhkar on the guest's supplication for the hosts, supplication for one who gave drink, urging people to hospitality, praise of one who honours his guest, and what is said after leaving the meal. {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
  ur: "جو نووی نے «الاذکار» میں مہمان کی میزبانوں کے لیے دعا، پانی پلانے والے کے لیے دعا، مہمان نوازی کی ترغیب، مہمان کی عزت کرنے والے کی تعریف اور کھانے سے اٹھنے کے بعد کے اذکار کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 237}"
