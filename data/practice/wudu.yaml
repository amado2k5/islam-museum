label:
  ar: الوضوء
  en: Wudu (ablution)
summary:
  ar: "الطهارة المائية الصغرى قبل الصلاة وبعض العبادات: غسل الوجه واليدين ومسح الرأس وغسل الرجلين، وردت في سورة المائدة. ويعرض الموطأ في كتاب الصلاة حديث عبد الله بن زيد بن عاصم الذي يصف فيه كيف كان النبي يتوضأ، فغسل يديه مرتين والتمضمض والاستنشاق ثلاثاً وغسل وجهه ثلاثاً ومسح رأسه ثم غسل رجليه، وأورد قوله «إذا توضأ أحدكم فليجعل في أنفه ماء» {cite:muwatta-maruf-1997 p. 50-51}"
  en: "The minor water ablution before prayer and some rites: washing face and hands, wiping the head, washing the feet — set out in Sura al-Ma'ida. The Muwatta's Book of Prayer presents the report of Abdullah ibn Zayd ibn Asim describing the Prophet's own ablution — washing the hands twice, rinsing the mouth and nose thrice, washing the face thrice, wiping the head and washing the feet — and records his words that whoever performs wudu should put water in the nose {cite:muwatta-maruf-1997 p. 50-51}"
