label:
  ar: الوضوء
  en: Wudu (ablution)
summary:
  ar: "الوضوء هو الطهارة الصغرى من الحدث الأصغر، ويلزم قبل الصلاة وبعض الأعمال الدينية، ويُعد الفقهاء الطهارة من العبادات الخمس التي تقوم عليها أصول الإسلام. وتبين المقالة أن أصله في الآية السادسة من المائدة، وأن المذاهب تختلف في أسباب الحدث والنية وأعمال الوضوء، وأن السنة والشيعة يختلفون في مسح الخف. ويعرض الموطأ في كتاب الصلاة حديث عبد الله بن زيد بن عاصم الذي يصف فيه وضوء النبي {cite:muwatta-maruf-1997 p. 50-51}"
  en: "Wudu is the minor ablution, the purification from minor impurity, required before prayer and some other religious acts; the jurists count purification among the five cultic acts on which Islam rests. The Encyclopaedia of Islam article places its basis in Qur'an 5:6 and records the schools' differences over the causes of impurity, intention and the acts of wudu, and the Sunni and Shi'i disagreement over wiping footwear. The Muwatta's Book of Prayer presents the report of Abdullah ibn Zayd ibn Asim describing the Prophet's own ablution {cite:muwatta-maruf-1997 p. 50-51}"
  ur: "وضو طہارتِ صغریٰ ہے، یعنی حدثِ اصغر سے پاکی، جو نماز اور بعض دوسرے دینی اعمال سے پہلے لازم ہے، اور فقہاء طہارت کو ان پانچ عبادتوں میں گنتے ہیں جن پر اسلام قائم ہے۔ انسائیکلوپیڈیا آف اسلام کا مضمون اس کی بنیاد سورۂ مائدہ کی چھٹی آیت میں بتاتا ہے اور حدث کے اسباب، نیت اور وضو کے اعمال میں مذاہب کے فرق اور موزوں پر مسح میں سنی اور شیعہ اختلاف درج کرتا ہے۔ موطا کے کتاب الصلاۃ میں عبد اللہ بن زید بن عاصم کی روایت ہے جس میں نبی کے وضو کا بیان ہے {cite:muwatta-maruf-1997 p. 50-51}"
