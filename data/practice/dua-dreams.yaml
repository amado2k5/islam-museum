id: practice/dua-dreams
class: practice
kind: ritual
label:
  ar: "عند الرؤيا"
  en: "On seeing and hearing of dreams"
  ur: "خواب دیکھنے اور سنانے پر"
  es: "Al ver y oír sueños"
  fr: "En voyant et en entendant des rêves"
summary:
  ar: "ما جمعه النووي في بابي ما يقول إذا رأى في منامه ما يحب أو يكره وما يقول إذا قصت عليه رؤيا: الحمد على الرؤيا الحسنة، والنفث والاستعاذة من المكروهة، وقول «خيرا رأيت». {cite:al-adhkar-nawawi-arnaut-1994 p. 98}"
  en: "What al-Nawawi gathers in the chapters on what to say after seeing in a dream what one likes or dislikes, and on being told a dream: praising God for a good dream, blowing lightly and seeking refuge from a disliked one, and the reply to the teller. {cite:al-adhkar-nawawi-arnaut-1994 p. 98}"
  ur: "نووی نے دو ابواب میں جو جمع کیا: خواب میں پسندیدہ یا ناپسندیدہ چیز دیکھنے پر کیا کہا جائے، اور جب کسی کو خواب سنایا جائے: اچھے خواب پر حمد، ناپسندیدہ پر ہلکا پھونک اور پناہ، اور سنانے والے کو جواب۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 98}"
  es: "Lo que Al-Nawawi recopila en los capítulos sobre qué decir después de ver en un sueño algo que agrada o desagrada, y sobre cuando se cuenta un sueño: alabar a Dios por un buen sueño, soplar suavemente y buscar refugio de uno desagradable, y la respuesta al narrador. {cite:al-adhkar-nawawi-arnaut-1994 p. 98}"
  fr: "Dans les chapitres consacrés aux paroles à prononcer après avoir vu en rêve ce que l'on aime ou ce que l'on n'aime pas, et à la narration d'un rêve, al-Nawawi rassemble les conseils suivants: louer Dieu pour un bon rêve, souffler légèrement dessus et chercher refuge contre un rêve désagréable, et répondre au narrateur. {cite:al-adhkar-nawawi-arnaut-1994 p. 98}"
