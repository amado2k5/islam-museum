label:
  ar: "أقوال وآداب عند الطعام: المدح والدعوة وتأديب الآكل"
  en: "Sayings and manners at the meal: praise, the invitation and correcting the eater"
  ur: "کھانے کے وقت اقوال و آداب: تعریف، دعوت اور کھانے والے کی تادیب"
  es: "Palabras y modales en la comida: elogios, la invitación y cómo corregir al comensal."
  fr: "Formules de politesse et usages à table: compliments, invitation et corrections envers celui qui mange."
summary:
  ar: "ما جمعه النووي في «الأذكار» في أبواب الطعام من قول لا أشتهي هذا الطعام، ومدح الطعام، وإجابة الصائم الدعوة، ومن تبع المدعو، ووعظ من يسيء في أكله. {cite:al-adhkar-nawawi-arnaut-1994 p. 232}"
  en: "What al-Nawawi gathers in al-Adhkar in the chapters on food: saying one does not care for a dish, praising the food, the fasting guest, one who follows the invited, and counsel to one who eats badly. {cite:al-adhkar-nawawi-arnaut-1994 p. 232}"
  ur: "جو نووی نے «الاذکار» میں کھانے کے ابواب میں جمع کیا: کسی کھانے کی خواہش نہ ہونے کا کہنا، کھانے کی تعریف، روزہ دار مہمان، مدعو کے پیچھے آنے والا اور برے طریقے سے کھانے والے کو نصیحت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 232}"
  es: "Lo que al-Nawawi recopila en al-Adhkar en los capítulos sobre la comida: decir que no le gusta un plato, elogiar la comida, el huésped que ayuna, quien sigue al invitado y consejos para quien come mal. {cite:al-adhkar-nawawi-arnaut-1994 p. 232}"
  fr: "Dans son ouvrage al-Adhkar, et plus particulièrement dans les chapitres consacrés à la nourriture, al-Nawawi rassemble les points suivants: le fait de ne pas apprécier un plat, les éloges de la nourriture, l’attention portée à l’invité qui jeûne, le respect dû à celui qui suit l’invité, et les conseils donnés à celui qui mange mal. {cite:al-adhkar-nawawi-arnaut-1994 p. 232}"
