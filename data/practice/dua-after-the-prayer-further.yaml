id: practice/dua-after-the-prayer-further
class: practice
kind: ritual
label:
  ar: "أذكار أخرى بعد الصلاة"
  en: "Further remembrances after the prayer"
  ur: "نماز کے بعد کے مزید اذکار"
  es: "Más recuerdos después de la oración"
  fr: "Autres souvenirs après la prière"
summary:
  ar: "ما أتمّ به النووي «باب الأذكار بعد الصلاة»: التسبيح والتحميد والتكبير عشرا، والمعوذات، ودعاء معاذ، وأدعية من كتاب ابن السني، والثناء والصلاة على النبي قبل الدعاء. {cite:al-adhkar-nawawi-arnaut-1994 p. 72}"
  en: "What al-Nawawi adds to finish the chapter on remembrances after the prayer: the tens of glorifying, praising and takbir, the two refuge suras, the supplication taught to Mu'adh, supplications from Ibn al-Sunni's book, and the praise of God and the blessing on the Prophet before asking. {cite:al-adhkar-nawawi-arnaut-1994 p. 72}"
  ur: "جو نووی نے «نماز کے بعد کے اذکار» کے باب کو مکمل کرنے کے لیے ذکر کیا: دس دس بار تسبیح و تحمید و تکبیر، معوذتین، معاذ کو بتائی گئی دعا، ابن السنی کی کتاب کی دعائیں، اور دعا سے پہلے اللہ کی حمد اور نبی پر درود۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 72}"
  es: "Lo que al-Nawawi añade para finalizar el capítulo sobre los recuerdos después de la oración: las decenas de glorificación, alabanza y takbir, las dos suras de refugio, la súplica enseñada a Mu'adh, las súplicas del libro de Ibn al-Sunni, y la alabanza a Dios y la bendición sobre el Profeta antes de pedir. {cite:al-adhkar-nawawi-arnaut-1994 p. 72}"
  fr: "Pour conclure le chapitre sur les invocations après la prière, al-Nawawi ajoute: les dizaines de glorifications, de louanges et de takbir, les deux sourates de refuge, l’invocation enseignée à Mu’adh, les invocations tirées du livre d’Ibn al-Sunni, ainsi que la louange à Dieu et la bénédiction sur le Prophète avant la demande. {cite:al-adhkar-nawawi-arnaut-1994 p. 72}"
