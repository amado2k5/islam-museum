id: practice/dua-on-seeing-the-new-moon
class: practice
kind: ritual
label:
  ar: "الدعاء عند رؤية الهلال"
  en: "Supplication on seeing the new moon"
  ur: "نیا چاند دیکھنے کی دعا"
summary:
  ar: "ما يقال عند رؤية الهلال كما جمعه النووي في أول «كتاب أذكار الصيام»: حديث طلحة بن عبيد الله من مسند الدارمي وكتاب الترمذي، وحديث ابن عمر، وما رواه أبو داود مرسلا. {cite:al-adhkar-nawawi-arnaut-1994 p. 188}"
  en: "What is said on seeing the new moon, as al-Nawawi gathers it at the head of his Book of the Remembrances of Fasting: Talha ibn Ubayd Allah's report from al-Darimi's Musnad and al-Tirmidhi's book, Ibn Umar's, and what Abu Dawud relates without a full chain. {cite:al-adhkar-nawawi-arnaut-1994 p. 188}"
  ur: "نیا چاند دیکھ کر کیا کہا جائے، جیسا کہ نووی نے «کتاب اذکار الصیام» کے شروع میں جمع کیا: مسند دارمی اور ترمذی کی کتاب سے طلحہ بن عبید اللہ کی روایت، ابن عمر کی روایت، اور وہ جو ابو داود نے مرسلاً روایت کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 188}"
