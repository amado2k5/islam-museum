label:
  ar: "المصارعة"
  en: "Wrestling (al-musara'a)"
  ur: "کشتی (المصارعہ)"
summary:
  ar: "المصارعة مسابقة بالجسد، وأشهر ما ورد فيها في السيرة خبر ركانة بن عبد يزيد المطلبي. يروي القسطلاني في المواهب اللدنية أن ركانة وقف على جلد بقرة فجذبه عشرة رجال فلم يتزحزح، فدعاه النبي إلى المصارعة وقال: «إن صرعتني آمنت بك»، فصرعه، فلم يؤمن. {cite:al-mawahib-al-laduniyya p. 308} وروى أبو نعيم في معرفة الصحابة رواية فيها أن ركانة طلب المصارعة على شاة، وأنه صارع النبي ثلاث مرات فصرعه النبي في كل مرة. {cite:marifat-sahaba-abu-nuaym entry 979} وأورد البيهقي الخبر في دلائل النبوة في باب «ما جاء في استنصار رسول الله على ركانة في المصارعة». {cite:dalail-al-nubuwwa-bayhaqi chapter heading} وينقل رفيق يونس المصري أن المصارعة من المسابقات التي تجوز بلا جعل. {cite:usul-iqtisad-islami-0660 p. 229} وترجمة ركانة في [[person/rukana|ركانة]]، وفيها بيان ما في إسناد الخبر من اضطراب. {cite:ibn-hajar-isaba p. 531}"
  en: "Wrestling is a bodily contest. The best-known case in the sira is the bout between the Prophet and Rukana ibn Abd Yazid of Banu al-Muttalib. Al-Qastallani's al-Mawahib al-Laduniyya reports that Rukana stood on a cowhide that ten men could not move, and that the Prophet invited him to wrestle on the terms 'if you throw me, you believe'; the Prophet threw him, and he did not believe. {cite:al-mawahib-al-laduniyya p. 308} Abu Nu'aym's Ma'rifat al-Sahaba has a report in which Rukana asked for a bout for a sheep, and in which the Prophet threw him in each of three bouts. {cite:marifat-sahaba-abu-nuaym entry 979} Al-Bayhaqi places the report in his Dala'il al-Nubuwwa under the heading on the Prophet's appeal to God against Rukana in wrestling. {cite:dalail-al-nubuwwa-bayhaqi chapter heading} Rafiq Yunus al-Misri records wrestling among the contests permitted without a stake. {cite:usul-iqtisad-islami-0660 p. 229} For the chain of narration, see [[person/rukana|Rukana]]; Ibn Hajar judges it disputed. {cite:ibn-hajar-isaba p. 531}"
  ur: "کشتی جسمانی مقابلہ ہے۔ سیرت میں اس کا سب سے معروف واقعہ نبی اور بنو المطلب کے رکانہ بن عبد یزید کے درمیان کشتی ہے۔ القسطلانی کی المواہب اللدنیہ کے مطابق رکانہ ایک گائے کی کھال پر کھڑا ہوا جسے دس آدمی بھی نہ ہلا سکے، پھر نبی نے کشتی کی دعوت دی اور کہا کہ اگر تم مجھے پچھاڑ دو تو ایمان لے آنا؛ نبی نے انہیں پچھاڑ دیا، مگر وہ ایمان نہ لائے۔ {cite:al-mawahib-al-laduniyya p. 308} رکانہ کے اسناد پر ابن حجر کا فیصلہ ہے کہ اس میں اضطراب ہے۔ {cite:ibn-hajar-isaba p. 531}"
