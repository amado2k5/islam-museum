id: practice/dua-travel-arrival-return
class: practice
kind: ritual
label:
  ar: "أذكار المسافر عند الوصول والنزول والرجوع"
  en: "The traveller's remembrances on arriving, alighting and returning"
  ur: "مسافر کے اذکار: پہنچنے، ٹھہرنے اور لوٹنے پر"
  es: "Los recuerdos del viajero al llegar, al bajar y al regresar."
  fr: "Souvenirs du voyageur à son arrivée, à son débarquement et à son retour"
summary:
  ar: "ما جمعه النووي في «الأذكار» من أذكار المسافر عند إشرافه على أرض، وعند الخوف، وعند النزول، وعند الرجوع ورؤية بلده ودخول بيته، وما يقال لمن قدم من سفر. {cite:al-adhkar-nawawi-arnaut-1994 p. 225}"
  en: "What al-Nawawi gathers in al-Adhkar of the traveller's remembrances on drawing near a land, in fear, on alighting, on returning, on seeing his town and entering his house, and what is said to one who has come back. {cite:al-adhkar-nawawi-arnaut-1994 p. 225}"
  ur: "جو نووی نے «الاذکار» میں مسافر کے اذکار کے بارے میں جمع کیا: کسی زمین کے قریب پہنچنے پر، خوف کے وقت، ٹھہرنے پر، واپسی پر، اپنے شہر کو دیکھنے اور گھر میں داخل ہونے پر، اور لوٹنے والے سے کہی جانے والی بات۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 225}"
  es: "Lo que al-Nawawi recopila en al-Adhkar de los recuerdos del viajero al acercarse a una tierra, con temor, al desembarcar, al regresar, al ver su ciudad y entrar en su casa, y lo que se le dice a quien ha vuelto. {cite:al-adhkar-nawawi-arnaut-1994 p. 225}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble les souvenirs du voyageur à l'approche d'une terre, lorsqu'il craint son arrivée, lorsqu'il y débarque, lorsqu'il revient, lorsqu'il aperçoit sa ville et lorsqu'il entre dans sa maison, ainsi que les paroles adressées à celui qui est rentré. {cite:al-adhkar-nawawi-arnaut-1994 p. 225}"
