perspectives:
- tradition: sunni
  id: sunni-fast
  stance:
    ar: يوم صيام مشروع شكرًا لله على نجاة موسى
    en: A recommended fast of gratitude for the rescue of Moses
  summary:
    ar: "روى البخاري عن ابن عباس أن النبي قدم المدينة فرأى اليهود يصومون يوم عاشوراء فقالوا: هذا يوم صالح، نجّى الله فيه بني إسرائيل من عدوهم فصامه موسى، فقال «أنا أحق بموسى منكم» فصامه وأمر بصيامه {cite:sahih-al-bukhari}؛ وروى مسلم أن قريشًا كانت تصومه في الجاهلية، وأنه لما فرض رمضان خيّر النبي فيه {cite:sahih-muslim}."
    en: "Bukhari reports from Ibn Abbas that the Prophet found the Jews of Medina fasting Ashura because God rescued the Israelites on it and Moses fasted it; he said 'I am worthier of Moses than you' and fasted it {cite:sahih-al-bukhari}. Muslim adds that Quraysh fasted it in the Jahiliyya and that after Ramadan was prescribed the Prophet left its fast optional {cite:sahih-muslim}."
  sources: [source/sahih-al-bukhari, source/sahih-muslim]
- tradition: academic
  id: academic-history
  stance:
    en: A pre-Islamic fast day absorbed into the Islamic calendar, then overlaid by Karbala memory
  summary:
    en: "Historians note Ashura was observed before Islam — Quraysh fasted it in the Jahiliyya — and that the Medinan adoption was followed after 61 AH by the Karbala mourning layer, producing today's dual character of the day."
  sources: [source/al-bidaya-wal-nihaya, source/sahih-al-bukhari]
- tradition: shia-twelver
  id: shia-mourning
  stance:
    ar: يوم عزاء على الحسين بن علي المقتول بكربلاء سنة 61هـ
    en: A day of mourning for Husayn ibn Ali, killed at Karbala in 61 AH
  summary:
    ar: "سجّل ابن كثير في حوادث سنة 61هـ مقتل الحسين بن علي بكربلاء يوم عاشوراء {cite:al-bidaya-wal-nihaya}؛ ومن هنا جعلته الشيعة موسم العزاء الأكبر بالمجالس والزيارات والشعائر."
    en: "Ibn Kathir records under the events of 61 AH the killing of Husayn ibn Ali at Karbala on Ashura {cite:al-bidaya-wal-nihaya}; the Shi'a made it their greatest season of mourning with gatherings, visitations and rituals."
  sources: [source/al-bidaya-wal-nihaya, source/salabi-umayyad-state-2020]
