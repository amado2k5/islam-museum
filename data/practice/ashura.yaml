kind: festival
label:
  ar: عاشوراء
  en: Ashura
  ur: عاشورا
summary:
  ar: "اليوم العاشر من محرم؛ كان يومًا تصومه قريش في الجاهلية فصامه النبي وأمر بصيامه، حتى فرض رمضان فصار صيامه تطوعًا {cite:sahih-al-bukhari} {cite:sahih-muslim}؛ وفي سنة 61هـ قُتل فيه الحسين بن علي بكربلاء فاتخذه الشيعة يوم عزاء {cite:al-bidaya-wal-nihaya}."
  en: "The tenth of Muharram; Quraysh fasted it in the Jahiliyya and the Prophet fasted it and ordered its fast until Ramadan made it voluntary {cite:sahih-al-bukhari} {cite:sahih-muslim}; in 61 AH Husayn ibn Ali was killed at Karbala on this day, and the Shi'a adopted it as a day of mourning {cite:al-bidaya-wal-nihaya}."
