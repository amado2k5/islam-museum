label:
  ar: عيد الفطر
  en: Eid al-Fitr
summary:
  ar: عيد الفطر هو عيد انقضاء الصيام، ويُحتفل به في أول شوال والأيام التي تليه، ويسمى العيد الصغير. تذكر دائرة المعارف الإسلامية أن زكاة الفطر تُؤدى في أول شوال على الأكثر ويُنصح بأدائها قبل صلاة العيد، وأن الاحتفال به أكثر فرحاً من عيد الأضحى.
  en: Eid al-Fitr is the festival of breaking the fast, celebrated on 1 Shawwal and the days after, and also called the minor festival. The Encyclopaedia of Islam says zakat al-fitr is due by 1 Shawwal at the latest and is advised before the festival prayer, and that the day is celebrated with more joy than Eid al-Adha.
  ur: عید الفطر روزہ کھولنے کی عید ہے جو یکم شوال اور اس کے بعد کے دنوں میں منائی جاتی ہے اور چھوٹی عید بھی کہلاتی ہے۔ اسلامی انسائیکلوپیڈیا کے مطابق زکوٰۃ الفطر یکم شوال تک ادا کرنا لازم ہے اور نمازِ عید سے پہلے ادا کرنے کا مشورہ ہے، اور یہ دن عید الاضحیٰ سے زیادہ خوشی سے منایا جاتا ہے۔
