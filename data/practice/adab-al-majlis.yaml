label:
  ar: "آداب المجلس"
  en: "Manners of the gathering (adab al-majlis)"
  ur: "مجلس کے آداب (adab al-majlis)"
summary:
  ar: "آداب المجلس كما يعرضها الشيخ عمر عبد الكافي: كتمان ما يُقال في المجلس أمانة، وحسن الإنصات والكلام، وترك الغيبة، وآداب الزيارة وحسن المكث، مع أحاديث وأقوال منها ما لم يُعرف قائله."
  en: "Manners of the gathering as Sheikh Omar Abdelkafy presents them: keeping what is said in a gathering as a trust, good listening and speech, avoiding backbiting, and the manners of visiting and of staying, with sayings, some of them unattributed."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق مجلس کے آداب: مجلس میں کہی گئی بات کا امانت ہونا، اچھا سننا اور بولنا، غیبت سے اجتناب، اور ملاقات و قیام کے آداب، کچھ اقوال جن کے قائل معلوم نہیں۔"
