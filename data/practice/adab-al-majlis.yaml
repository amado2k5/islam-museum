label:
  ar: "آداب المجلس"
  en: "Manners of the gathering (adab al-majlis)"
  ur: "مجلس کے آداب (adab al-majlis)"
  es: "Modales en la reunión (adab al-majlis)"
  fr: "Les usages de l'assemblée (adab al-majlis)"
  tr: "Konsey Görgü Kuralları"
  id: "Etiket Dewan"
summary:
  ar: "آداب المجلس كما يعرضها الشيخ عمر عبد الكافي: كتمان ما يُقال في المجلس أمانة، وحسن الإنصات والكلام، وترك الغيبة، وآداب الزيارة وحسن المكث، مع أحاديث وأقوال منها ما لم يُعرف قائله."
  en: "Manners of the gathering as Sheikh Omar Abdelkafy presents them: keeping what is said in a gathering as a trust, good listening and speech, avoiding backbiting, and the manners of visiting and of staying, with sayings, some of them unattributed."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق مجلس کے آداب: مجلس میں کہی گئی بات کا امانت ہونا، اچھا سننا اور بولنا، غیبت سے اجتناب، اور ملاقات و قیام کے آداب، کچھ اقوال جن کے قائل معلوم نہیں۔"
  es: "Las normas de convivencia en las reuniones, tal como las presenta el jeque Omar Abdelkafy, incluyen: guardar como un mero testimonio lo que se dice en una reunión, escuchar y hablar con atención, evitar la calumnia y las maneras de visitar y de hospedarse, con dichos, algunos de ellos anónimos."
  fr: "Les usages en réunion tels que les présente le cheikh Omar Abdelkafy: considérer les propos tenus lors d’une réunion comme une confidence, bien écouter et parler, éviter les médisances, et les manières de rendre visite et de séjourner, avec des dictons, dont certains ne sont pas attribués."
  tr: "Şeyh Ömer Abdul Kafi tarafından sunulan toplantının görgü kuralları: toplantıda söylenenleri korumak, iyi dinlemek ve konuşmak, laf atmaktan kaçınmak, ziyaret görgü kuralları ve konuşmacı bilinmez diyen hadisler ve sözler ile birlikte ilerlemek."
  id: "Etiket pertemuan yang disampaikan oleh Sheikh Omar Abdul Kafi: menjaga apa yang dikatakan dalam pertemuan adalah sebuah kepercayaan, mendengarkan dengan baik dan berbicara, menghindari fitnah, etiket kunjungan dan menjaga kesehatan, bersama dengan hadits dan pepatah bahwa pembicara tidak diketahui."
