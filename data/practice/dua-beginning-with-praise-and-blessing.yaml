summary:
  ar: "ما جمعه النووي في باب افتتاح الدعاء بالحمد لله والصلاة على النبي، وفي باب الصلاة على الأنبياء وآلهم تبعا لهم. {cite:al-adhkar-nawawi-arnaut-1994 p. 117}"
  en: "What al-Nawawi gathers in the chapter on opening a supplication with praise of God and the blessing on the Prophet, and in the chapter on blessing the prophets and their families as followers. {cite:al-adhkar-nawawi-arnaut-1994 p. 117}"
  ur: "نووی نے دعا کو حمد الٰہی اور نبی پر درود سے شروع کرنے کے باب، اور انبیاء اور ان کی آل پر تبعاً درود کے باب میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 117}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre cómo iniciar una súplica con alabanzas a Dios y bendiciones sobre el Profeta, y en el capítulo sobre cómo bendecir a los profetas y a sus familias como seguidores. {cite:al-adhkar-nawawi-arnaut-1994 p. 117}"
