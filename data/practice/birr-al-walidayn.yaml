id: practice/birr-al-walidayn
class: practice
kind: etiquette
label:
  ar: "بر الوالدين"
  en: "Honouring one's parents (birr al-walidayn)"
  ur: "والدین کے ساتھ نیکی (بر الوالدین)"
summary:
  ar: "بر الوالدين عند الشيخ عمر عبد الكافي صورة من صور الرحمة، تجب في حياتهما وبعد وفاتهما. يرى أن حق الأم أعظم من حق الأب، ويروي قول عمر لمن حمل أمه حول الكعبة، ويعدّد من حقوق الوالد بعد موته أن يُحج عنه، ويُكرم صديقه، ويدعو له الولد الصالح."
  en: "In Sheikh Omar Abdelkafy's lessons, honouring one's parents is a form of mercy, owed in their life and after their death. He holds that a mother's right is greater than a father's, recounts Umar's words to a man who carried his mother around the Kaaba, and lists duties after a father's death: hajj on his behalf, honouring his friends, and prayer for him by a righteous child."
  ur: "شیخ عمر عبدالکافی کے درسوں میں والدین کے ساتھ نیکی رحمت کی ایک صورت ہے، جو ان کی زندگی میں بھی واجب ہے اور ان کی وفات کے بعد بھی۔ ان کے نزدیک ماں کا حق باپ کے حق سے بڑا ہے۔ وہ عمر کا وہ واقعہ بیان کرتے ہیں جس میں ایک شخص کو، جو اپنی ماں کو کندھے پر اٹھا کر کعبہ کا طواف کر رہا تھا، حق ادا نہ ہونے کی بات کہی گئی، اور وفات کے بعد والد کے حقوق میں ان کی طرف سے حج، ان کے دوست کا اکرام اور نیک اولاد کی دعا شامل ہیں۔"
