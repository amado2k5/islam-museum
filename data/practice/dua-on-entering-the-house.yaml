id: practice/dua-on-entering-the-house
class: practice
kind: ritual
label:
  ar: "الدعاء عند دخول البيت"
  en: "Supplication on entering the house"
  ur: "گھر میں داخل ہونے کی دعا"
summary:
  ar: "ما يقال عند دخول البيت كما جمعه النووي في «الأذكار»: التسمية والسلام على أهله، ودعاء «اللهم إني أسألك خير المولج وخير المخرج» من سنن أبي داود، وما يقال عند دخول بيت خال من الموطأ. {cite:al-adhkar-nawawi-arnaut-1994 p. 23}"
  en: "What is said on entering the house, as al-Nawawi gathers it in al-Adhkar: naming God and greeting the household, the supplication «اللهم إني أسألك خير المولج وخير المخرج» from Sunan Abi Dawud, and what is said on entering an empty house, from the Muwatta. {cite:al-adhkar-nawawi-arnaut-1994 p. 23}"
  ur: "گھر میں داخل ہوتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: اللہ کا نام لینا اور گھر والوں کو سلام، سنن ابی داود سے دعا «اللهم إني أسألك خير المولج وخير المخرج»، اور خالی گھر میں داخل ہونے کے الفاظ موطا سے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 23}"
