label:
  ar: الخطبة
  en: The sermon (khutba)
  es: "El sermón (khutba)"
  fr: "Le sermon (khutba)"
  ur: "خطبہ ⁦(خطبہ)⁩"
  tr: "Vaaz"
  id: "Khotbah"
summary:
  ar: "الخطبتان قبل صلاة الجمعة وفي العيدين؛ شرط صحة الجمعة عند الجمهور، تتضمن حمد الله ووعظًا ودعاءً."
  en: "The sermon(s) before Friday and Eid prayers; a condition of the Friday prayer for most schools, containing praise of God, exhortation and supplication."
  es: "El sermón o los sermones previos a las oraciones del viernes y del Eid; una condición de la oración del viernes para la mayoría de las escuelas, que contiene alabanzas a Dios, exhortaciones y súplicas."
  fr: "Le ou les sermons précédant les prières du vendredi et de l'Aïd; une condition de la prière du vendredi pour la plupart des écoles, contenant des louanges à Dieu, des exhortations et des supplications."
  ur: "نماز جمعہ اور عیدین سے پہلے خطبہ؛ زیادہ تر اسکولوں کے لیے جمعہ کی نماز کی شرط، خدا کی حمد، نصیحت اور دعا پر مشتمل ہے۔"
