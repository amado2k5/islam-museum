label:
  ar: "أسماء الله الحسنى"
  en: "The most beautiful names of God"
  ur: "اللہ کے اسمائے حسنیٰ"
  es: "Los nombres más hermosos de Dios"
  fr: "Les plus beaux noms de Dieu"
  tr: "Allah'ın Güzel İsimleri"
  id: "Nama-nama Indah Allah"
summary:
  ar: "ما أورده النووي في باب أسماء الله الحسنى: الآية، وحديث أبي هريرة في تسعة وتسعين اسما، وسرد الأسماء مع بيان من رواه. {cite:al-adhkar-nawawi-arnaut-1994 p. 100}"
  en: "What al-Nawawi gives in the chapter on the most beautiful names of God: the verse, Abu Hurayra's report of ninety-nine names, and the list of names, with who transmitted it. {cite:al-adhkar-nawawi-arnaut-1994 p. 100}"
  ur: "اسمائے حسنیٰ کے باب میں نووی نے جو ذکر کیا: آیت، ابو ہریرہ کی روایت کہ ننانوے نام ہیں، اور ناموں کی فہرست، اور اس کے راویوں کا بیان۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 100}"
  es: "Lo que al-Nawawi ofrece en el capítulo sobre los nombres más bellos de Dios: el versículo, el relato de Abu Hurayra sobre los noventa y nueve nombres y la lista de nombres, con su respectivo autor. {cite:al-adhkar-nawawi-arnaut-1994 p. 100}"
  fr: "Dans le chapitre consacré aux plus beaux noms de Dieu, al-Nawawi cite le verset, le hadith rapporté par Abou Hourayra concernant les quatre-vingt-dix-neuf noms, ainsi que la liste de ces noms et le nom de celui qui l'a transmis. {cite:al-adhkar-nawawi-arnaut-1994 p. 100}"
