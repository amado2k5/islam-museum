label:
  ar: "الدعاء في الحجر والبيت والسعي"
  en: "Supplication in the Hijr, inside the House and at the sa'y"
  ur: "حجر، بیت اور سعی میں دعا"
  es: "Súplica en el Hijr, dentro de la Casa y en el sa'y"
  fr: "Supplication dans le Hijr, à l'intérieur de la Maison et au sa'y"
  tr: "Taşta ve Evde Dua ve Arama"
  id: "Doa di Batu dan Rumah serta Mencari"
summary:
  ar: "ما جمعه النووي في «الأذكار» من دعاء الحجر والدعاء داخل البيت وأذكار السعي بين الصفا والمروة، وأدعية مختارة، وما يقال عند الخروج من مكة إلى منى. {cite:al-adhkar-nawawi-arnaut-1994 p. 196}"
  en: "What al-Nawawi gathers in al-Adhkar on supplication in the Hijr and inside the House, the remembrances of the sa'y between Safa and Marwa, chosen supplications, and what is said on leaving Mecca for Mina. {cite:al-adhkar-nawawi-arnaut-1994 p. 196}"
  ur: "جو نووی نے «الاذکار» میں حجر اور بیت کے اندر کی دعا، صفا و مروہ کے درمیان سعی کے اذکار، منتخب دعاؤں اور مکہ سے منیٰ روانگی کے وقت کی دعا کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 196}"
  es: "Lo que al-Nawawi recopila en al-Adhkar sobre la súplica en el Hijr y dentro de la Casa, los recuerdos del sa'y entre Safa y Marwa, súplicas selectas y lo que se dice al partir de La Meca hacia Mina. {cite:al-adhkar-nawawi-arnaut-1994 p. 196}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble des informations sur les invocations lors de l'Hégire et à l'intérieur de la Maison sacrée, les souvenirs du sa'y entre Safa et Marwa, des invocations choisies et les formules prononcées lors du départ de La Mecque pour Mina. {cite:al-adhkar-nawawi-arnaut-1994 p. 196}"
  tr: "El-Newavi'nin 'Adhkar'da derlediği şey, Hicr duası, Evin içindeki duası, Safa ile Merve arasında Sa'i için yapılan duaları, seçilmiş duaları ve Mekke'den Mina'ya giderken söylenenleri içerir. {atıf:al-adhkar-nawawi-arnaut-1994 s. 196}"
  id: "Apa yang disusun al-Nawawi dalam 'Adhkar' meliputi doa Hijr, doa di dalam Rumah, permohonan untuk Sa'i antara Safa dan Marwah, permohonan terpilih, dan apa yang diucapkan saat meninggalkan Mekah ke Mina. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 196}"
