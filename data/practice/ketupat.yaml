  ar: "أرز يُغلى في غلاف منسوج من ورق النخل حتى يتماسك مكعباً: طبق «ليبران» و«هاري رايا» في إندونيسيا وماليزيا وبروناي وسنغافورة وجنوب الفلبين، يُقدَّم مع الرندانغ والساتيه، ونسج ورقه فنّ تتعلمه الصغيرات قبل العيد."
