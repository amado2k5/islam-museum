id: practice/dua-bequests-benefit-to-dead
class: practice
kind: ritual
label:
  ar: "وصايا الميت وما ينفعه من غيره والثناء عليه"
  en: "The dead person's bequests, what benefits him from others, and praising him"
  ur: "میت کی وصیتیں، دوسروں کی طرف سے اسے کیا نفع دے اور اس کی تعریف"
  es: "Los legados del difunto, lo que le beneficia de los demás y elogiarlo."
  fr: "Les legs du défunt, ce dont il a bénéficié grâce à autrui, et les éloges qui lui ont été adressés."
  tr: "Ölenin vasiyetleri ve başkalarından ona neyin fayda sağladığı, onu öven"
  id: "Kehendak almarhum dan apa yang menguntungkannya dari orang lain serta memujinya"
summary:
  ar: "ما جمعه النووي في وصية الميت بشأن كفنه ودفنه والصلاة عليه، وفي نفع الدعاء للأموات ووصول القراءة، والثناء على الميت. {cite:al-adhkar-nawawi-arnaut-1994 p. 163}"
  en: "What al-Nawawi gathers on a dying person's wishes about his shroud, burial and prayer, on whether prayers and recitation reach the dead, and on praising the dead. {cite:al-adhkar-nawawi-arnaut-1994 p. 163}"
  ur: "کفن، دفن اور نماز کے بارے میں مرنے والے کی وصیتیں، مرحومین کو دعا اور تلاوت کے نفع اور میت کی تعریف کے بارے میں نووی نے جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 163}"
  es: "Lo que Al-Nawawi recopila sobre los deseos de una persona moribunda respecto a su mortaja, entierro y oración, sobre si las oraciones y la recitación llegan al difunto, y sobre la alabanza a los muertos. {cite:al-adhkar-nawawi-arnaut-1994 p. 163}"
  fr: "Ce qu'al-Nawawi a recueilli sur les souhaits d'une personne mourante concernant son linceul, son enterrement et la prière, sur la question de savoir si les prières et les récitations parviennent aux morts, et sur la manière de louer les défunts. {cite:al-adhkar-nawawi-arnaut-1994 p. 163}"
  tr: "al-Nawawi'nin, merhumun vasiyetinde kefenlenmesi, gömülmesi ve üzerine dua etmesi, ayrıca merhum için dua etmenin, okunmanın iletilmesi ve merhumun övülmesinin faydası hakkında topladıkları. {cite:al-adhkar-nawawi-arnaut-1994 s. 163}"
  id: "Apa yang dikumpulkan al-Nawawi dalam wasiat almarhum mengenai kain kabin, pemakaman, dan doa-doa untuknya, serta manfaat berdoa untuk almarhum, penyampaian bacaan, dan pujian kepada almarhum. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 163}"
