summary:
  ar: "الألوان المعدنية في التصوير الفارسي والمغولي: تطحن وتغسل وتخلط بزلال البيض أو الغراء أو الصمغ العربي، ومنها اللازورد للأزرق والزنجار المدمر للورق، وورق الذهب المحضر بالدق بين طبقات الجلد {cite:titley-persian-miniature-painting-1983 p. 244} {cite:titley-persian-miniature-painting-1983 p. 245}."
  en: "Mineral pigments of Persian and Mughal painting, ground, washed and bound with egg-white, glue or gum arabic — lapis lazuli for blue, paper-destroying verdigris for green — and gold leaf beaten between layers of skin {cite:titley-persian-miniature-painting-1983 p. 244} {cite:titley-persian-miniature-painting-1983 p. 245}."
  ur: "فارسی اور مغل مصوری کے معدنی رنگ، جو پیسے، دھوئے اور انڈے کی سفیدی، سریش یا گوند سے ملائے جاتے — نیلے کے لیے لاجورد، کاغذ گلانے والا زنگار سبز کے لیے — اور کھال کی تہوں میں کوٹ کر بنایا گیا سونے کا ورق {cite:titley-persian-miniature-painting-1983 p. 244}."
