summary:
  ar: "العقيقة الذبيحة التي تذبح عن المولود؛ يقول فقه السنة إنها سنة مؤكدة فعلها النبي وأصحابه {cite:sabiq-fiqh-al-sunnah}."
  en: "Aqiqah is the animal slaughtered for the newborn; Fiqh al-Sunna calls it a confirmed sunna that the Prophet and his Companions performed {cite:sabiq-fiqh-al-sunnah}."
  es: "Aqiqah es el animal sacrificado para el recién nacido; Fiqh al-Sunna lo llama una sunna confirmada que el Profeta y sus Compañeros realizaron {cite:sabiq-fiqh-al-sunnah}."
  fr: "L'Aqiqah est l'animal sacrifié pour le nouveau-né; Fiqh al-Sunna la qualifie de sunna confirmée que le Prophète et ses Compagnons ont pratiquée {cite:sabiq-fiqh-al-sunnah}."
  ur: "عقیقہ وہ جانور ہے جسے نومولود کے لیے ذبح کیا جاتا ہے۔ فقہ السنۃ اس کو ثابت سنت کہتے ہیں کہ نبی اور آپ کے صحابہ نے {سبق فقہ السنۃ} کو انجام دیا۔"
  tr: "Yeni doğan adına yapılan akikah kurbanı; sünnetin fihhi, bunun Peygamber ve sahabeleri tarafından uygulanan onaylanmış bir sünnet olduğunu söyler {atıf:sabiq-fiqh-al-sünnah}."
  id: "Korban 'aqiqah dilakukan untuk bayi yang baru lahir; hukum Sunnah mengatakan ini adalah Sunnah yang dikonfirmasi dan dipraktikkan oleh Nabi dan para sahabatnya {cite:sabiq-fiqh-al-sunnah}."
