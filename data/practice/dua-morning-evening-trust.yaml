summary:
  ar: "ما ختم به النووي باب الصباح والمساء: دعاء الهم والدين، وسؤال صلاح النهار، والاستغاثة بالحي القيوم، وأذكار التوكل، وقصة أبي الدرداء حين قيل له احترق بيتك. {cite:al-adhkar-nawawi-arnaut-1994 p. 82}"
  en: "How al-Nawawi closes the morning and evening chapter: the supplication against worry and debt, asking for a good day, calling on the Living, the Self-Sustaining, wordings of reliance, and the story of Abu al-Darda when told his house had burned. {cite:al-adhkar-nawawi-arnaut-1994 p. 82}"
  ur: "نووی نے صبح و شام کے باب کو جس پر ختم کیا: غم اور قرض کی دعا، دن کی بھلائی کا سوال، حی قیوم سے فریاد، توکل کے کلمات، اور ابو الدرداء کا واقعہ جب انہیں بتایا گیا کہ ان کا گھر جل گیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 82}"
