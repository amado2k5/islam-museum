summary:
  ar: "وجبة الإفطار عند غروب الشمس في رمضان، تجمع الأسرة والجيران وتقوم على الصدقة والتكافل؛ يفطر كثيرون على تمر وشاي في بلدان عدة، وتختلف الأطباق من بلد إلى آخر. أدرجت اليونسكو الإفطار في قائمة التراث الثقافي غير المادي سنة 2023 بترشيح من أذربيجان وإيران وتركيا وأوزبكستان {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}."
  en: "The meal that breaks the fast at sunset in Ramadan, gathering family and neighbours and built on charity and solidarity; many open the fast with dates and tea, and dishes differ from country to country. UNESCO inscribed iftar on its intangible cultural heritage list in 2023, nominated by Azerbaijan, Iran, Türkiye and Uzbekistan {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}."
