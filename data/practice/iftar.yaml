label: { ar: "الإفطار", en: "Iftar", es: "Iftar", fr: "Iftar", ur: "افطار" }
summary:
  ar: "وجبة الإفطار عند غروب الشمس في رمضان، تجمع الأسرة والجيران وتقوم على الصدقة والتكافل؛ يفطر كثيرون على تمر وشاي في بلدان عدة، وتختلف الأطباق من بلد إلى آخر. أدرجت اليونسكو الإفطار في قائمة التراث الثقافي غير المادي سنة 2023 بترشيح من أذربيجان وإيران وتركيا وأوزبكستان {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}."
  en: "The meal that breaks the fast at sunset in Ramadan, gathering family and neighbours and built on charity and solidarity; many open the fast with dates and tea, and dishes differ from country to country. UNESCO inscribed iftar on its intangible cultural heritage list in 2023, nominated by Azerbaijan, Iran, Türkiye and Uzbekistan {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}."
  es: "La comida con la que se rompe el ayuno al atardecer durante el Ramadán, que reúne a familiares y vecinos y se basa en la caridad y la solidaridad; muchos rompen el ayuno con dátiles y té, y los platos varían de un país a otro. La UNESCO incluyó el iftar en su lista de patrimonio cultural inmaterial en 2023, a propuesta de Azerbaiyán, Irán, Turquía y Uzbekistán {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}."
  fr: "Le repas qui rompt le jeûne au coucher du soleil pendant le Ramadan, réunissant famille et voisins dans un esprit de charité et de solidarité, est souvent consommé avec des dattes et du thé. Les plats varient selon les pays. L'UNESCO a inscrit l'iftar sur sa liste du patrimoine culturel immatériel en 2023, suite à la candidature de l'Azerbaïdjan, de l'Iran, de la Turquie et de l'Ouzbékistan."
  ur: "وہ کھانا جو رمضان المبارک میں غروب آفتاب کے وقت افطار کرتا ہے، خاندان اور پڑوسیوں کو جمع کرتا ہے اور صدقہ اور یکجہتی پر تیار ہوتا ہے۔ بہت سے لوگ کھجور اور چائے سے روزہ کھولتے ہیں، اور پکوان دوسرے ملک سے مختلف ہوتے ہیں۔ یونیسکو نے افطار کو 2023 میں اپنے غیر محسوس ثقافتی ورثے کی فہرست میں شامل کیا، جسے آذربائیجان، ایران، ترکی اور ازبکستان نے نامزد کیا {cite:gulfnews-unesco-iftar} {cite:hurriyet-unesco-iftar}"
