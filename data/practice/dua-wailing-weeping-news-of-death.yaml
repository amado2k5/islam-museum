  en: "What al-Nawawi gathers on the prohibition of wailing and the cries of the pre-Islamic age, the allowance of tearful weeping, and what was said on the news of Abu Jahl's death. {cite:al-adhkar-nawawi-arnaut-1994 p. 146}"
  ur: "نووی نے نوحے اور جاہلیت کی پکار کی حرمت، آنسو بہانے کے جواز اور ابو جہل کی موت کی خبر پر کیا کہا گیا، اس کے بارے میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 146}"
