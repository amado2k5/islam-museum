id: practice/dua-reciter-forgetting-etiquette
class: practice
kind: ritual
label:
  ar: "التحذير من نسيان القرآن وآداب القارئ"
  en: "The warning against forgetting the Qur'an and the reciter's manners"
  ur: "قرآن بھلانے کی تنبیہ اور تلاوت کرنے والے کے آداب"
  es: "La advertencia contra el olvido del Corán y las normas de cortesía del recitador."
  fr: "La mise en garde contre l'oubli du Coran et des bonnes manières du récitant"
  tr: "Kur'an'ı ve okuyan görgü kurallarını unutmamak için uyarı"
  id: "Peringatan agar tidak lupa Al-Qur'an dan etiket pembaca"
summary:
  ar: "ما ختم به النووي فصل فضل القرآن من أحاديث التحذير من نسيانه، ثم فصول آداب القارئ: الإخلاص والسواك والخشوع والمصحف والجهر وتحسين الصوت. {cite:al-adhkar-nawawi-arnaut-1994 p. 106}"
  en: "The hadiths with which al-Nawawi closes the merit of the Qur'an, warning against forgetting it, then his sections on the reciter's manners: sincerity, the toothstick, humility, the written copy, reciting aloud and beautifying the voice. {cite:al-adhkar-nawawi-arnaut-1994 p. 106}"
  ur: "قرآن کی فضیلت کے آخر میں بھول جانے سے تنبیہ کی احادیث، پھر قاری کے آداب: اخلاص، مسواک، خشوع، مصحف، جہر اور آواز سنوارنا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 106}"
  es: "Los hadices con los que al-Nawawi concluye el mérito del Corán, advirtiendo contra el olvido, seguidos de sus secciones sobre los modales del recitador: sinceridad, el palillo dental, humildad, la copia escrita, la recitación en voz alta y el embellecimiento de la voz. {cite:al-adhkar-nawawi-arnaut-1994 p. 106}"
  fr: "Les hadiths par lesquels al-Nawawi conclut son ouvrage sur les mérites du Coran, mettant en garde contre son oubli, puis ses sections sur les bonnes manières du récitant: la sincérité, le bâtonnet de dentition, l’humilité, le manuscrit, la récitation à haute voix et l’embellissement de la voix. {cite:al-adhkar-nawawi-arnaut-1994 p. 106}"
  tr: "El-Nevavi'nin sonunda, Kur'an'ın erdemi üzerine olan bölüm, hadislerden onu unutmama uyarısı ve ardından okavın görgü kuralları üzerine bölümler: samimiyet, misvak, alçakgönüllülük, Kur'an, yüksek sesle ve sesi geliştirme. {cite:al-adhkar-nawawi-arnaut-1994 s. 106}"
  id: "Kesimpulan Al-Nawawi adalah bab tentang kebajikan Al-Qur'an dari hadits yang memperingatkan agar tidak melupakannya, lalu bab tentang etiket pembaca: ketulusan, kesalahan, kerendahan hati, Al-Qur'an dengan lantang, dan meningkatkan suara. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 106}"
