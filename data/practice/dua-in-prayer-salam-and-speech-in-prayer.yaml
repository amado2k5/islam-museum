label:
  ar: "السلام من الصلاة وما يقال إذا عرض أمر فيها"
  en: "The salam ending the prayer, and what is said if something arises during it"
  ur: "نماز کا سلام اور نماز میں کوئی بات پیش آنے پر"
  es: "El salam con el que finaliza la oración, y qué se dice si surge algo durante la misma."
  fr: "Le salam qui termine la prière, et ce qu'on dit si quelque chose survient pendant celle-ci."
  tr: "Barış, duanın ve bir konuda sunulduğunda söylenenlerin bir parçasıdır"
  id: "Damai adalah bagian dari doa dan apa yang diucapkan ketika suatu hal disampaikan di dalamnya"
summary:
  ar: "ما جمعه النووي في باب السلام للتحلل من الصلاة وباب ما يقوله المصلي إذا عرض له أمر: صيغة السلام وحكمه، وتسبيح الرجال. {cite:al-adhkar-nawawi-arnaut-1994 p. 69}"
  en: "What al-Nawawi gathers in the chapter on the salam that releases one from the prayer and the chapter on what a worshipper says if something befalls him: the wording and ruling of the salam, and the glorification said by men. {cite:al-adhkar-nawawi-arnaut-1994 p. 69}"
  ur: "جو نووی نے نماز سے نکلنے کے سلام اور نماز میں کوئی بات پیش آنے پر کہے جانے والے الفاظ کے ابواب میں جمع کیا: سلام کے الفاظ اور حکم، اور مردوں کی تسبیح۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 69}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre el saludo que libera de la oración y en el capítulo sobre lo que dice un creyente si le sucede algo: la formulación y la norma del saludo, y la glorificación pronunciada por los hombres. {cite:al-adhkar-nawawi-arnaut-1994 p. 69}"
  fr: "Dans le chapitre consacré au salam qui libère de la prière et dans celui sur les paroles du fidèle en cas d'événement, al-Nawawi rassemble la formulation et la portée du salam, ainsi que les glorifications prononcées par les hommes. {cite:al-adhkar-nawawi-arnaut-1994 p. 69}"
  tr: "al-Nawawi'nin duadan muaf olmak için selamlama ve bir mesele ortaya çıktığında ibadet edenin söyledikleri bölümünde derlediği şey: selamlaşmanın biçimi ve kuralı ile insanların yüceltilmesi. {cite:al-adhkar-nawawi-arnaut-1994 s. 69}"
  id: "Apa yang disusun al-Nawawi dalam bab tentang salam untuk pembebasan dari doa dan apa yang dikatakan penyembah ketika suatu masalah muncul: bentuk dan aturan salam, serta pemuliaan manusia. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 69}"
