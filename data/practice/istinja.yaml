  - tradition: sunni-shafii
    id: khattabi-three-stones
    standing: main
    stance: { ar: "لا يجزئ أقل من ثلاثة أحجار وإن وقع الإنقاء", en: "Fewer than three stones do not suffice, even if the place is clean" }
    summary: { ar: "يقرأ الخطابي حديث سلمان «وأن لا يستنجي أحدنا بأقل من ثلاثة أحجار» بياناً واضحاً أن الاقتصار على أقل من ثلاثة لا يجوز وإن وقع الإنقاء بما دونها، وأن الاستنجاء بالأحجار أحد الطهورين، فإذا لم يُستعمل الماء لم يكن بد من الحجارة أو ما يقوم مقامها، وينسب ذلك إلى سفيان الثوري ومالك والشافعي وأحمد.", en: "Al-Khattabi reads Salman's report 'that none of us cleanse himself with fewer than three stones' as a clear statement that fewer than three do not suffice even when they clean the place, and holds that stones are one of the two means of purity, so that without water stones or their equivalent are needed; he ascribes this to Sufyan al-Thawri, Malik, al-Shafi'i and Ahmad." }
    holders: [person/abu-sulayman-al-khattabi, person/al-shafii, person/ahmad-ibn-hanbal, person/malik-ibn-anas, person/sufyan-al-thawri]
