id: practice/istinja
class: practice
kind: ritual
label: { ar: "الاستنجاء", en: "Istinja' (cleansing after relieving oneself)", ur: "استنجا" }
summary:
  ar: "الاستنجاء إزالة الأذى عن موضع الخروج بعد قضاء الحاجة، بالماء أو بالأحجار؛ يسمّيه الحديث «الاستطابة»، والاستنجاء بالأحجار «الاستجمار». عقد له أبو داود أبواباً في كتاب الطهارة: ما يُنهى عنه أن يُستنجى به ⁦(العظم والروث والحممة)⁩، والاستنجاء بثلاثة أحجار، والاستبراء، والاستنجاء بالماء؛ ويرى الخطابي أن الحجارة رخصة والماء هو الأصل، وأن الاقتصار على أقل من ثلاثة أحجار لا يجزئ وإن حصل الإنقاء {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}."
  en: "Istinja' is removing filth from the private parts after relieving oneself, with water or with stones; the reports call it istitaba ('making clean'), and cleansing with stones istijmar. Abu Dawud gives it several chapters in the Book of Purification: what may not be used (bone, dung, charcoal), cleansing with three stones, making sure of the last drops (istibra'), and cleansing with water; al-Khattabi holds that stones are a concession and water the original means, and that fewer than three stones do not suffice even if the place is clean {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}."
  ur: "استنجا قضائے حاجت کے بعد نجاست کے مقام سے گندگی دور کرنا ہے، پانی یا پتھروں سے؛ احادیث میں اسے «استطابہ» اور پتھروں سے استنجا کو «استجمار» کہا گیا ہے۔ ابو داؤد نے کتاب الطہارۃ میں اس کے کئی ابواب باندھے: جن چیزوں سے استنجا منع ہے ⁦(ہڈی، لید، کوئلہ)⁩، تین پتھروں سے استنجا، استبرا، اور پانی سے استنجا؛ خطابی کے نزدیک پتھر رخصت ہیں اور پانی اصل، اور تین سے کم پتھر کافی نہیں چاہے صفائی ہو جائے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}۔"
