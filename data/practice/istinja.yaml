  - tradition: sunni
    id: salaf-disliked-water
    standing: secondary
    stance: { ar: "كره قوم من السلف الاستنجاء بالماء", en: "Some early authorities disliked cleansing with water" }
    summary: { ar: "يحكي الخطابي أن قوماً من السلف كرهوا الاستنجاء بالماء، وأن بعض المتأخرين زعم أن الماء نوع من المطعوم فكرهه لذلك، ويقول إن السنة تقضي على قوله وتبطله، مستدلاً بحديث أنس أن النبي خرج وقد استنجى بالماء.", en: "Al-Khattabi relates that some early authorities disliked cleansing with water, and that a later author claimed water is a kind of food and disliked it on that ground; he says the Sunna overrules and refutes that view, citing Anas's report that the Prophet came out having cleansed himself with water." }
