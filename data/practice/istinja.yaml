label: { ar: "الاستنجاء", en: "Istinja' (cleansing after relieving oneself)", ur: "استنجا", es: "Istinja' (limpieza después de hacer sus necesidades)", fr: "Istinja' (nettoyage après avoir fait ses besoins)", tr: "Istinja (Ritual Pur", id: "Istinja (Ritual Pur" }
summary:
  ar: "الاستنجاء إزالة الأذى عن موضع الخروج بعد قضاء الحاجة، بالماء أو بالأحجار؛ يسمّيه الحديث «الاستطابة»، والاستنجاء بالأحجار «الاستجمار». عقد له أبو داود أبواباً في كتاب الطهارة: ما يُنهى عنه أن يُستنجى به ⁦(العظم والروث والحممة)⁩، والاستنجاء بثلاثة أحجار، والاستبراء، والاستنجاء بالماء؛ ويرى الخطابي أن الحجارة رخصة والماء هو الأصل، وأن الاقتصار على أقل من ثلاثة أحجار لا يجزئ وإن حصل الإنقاء {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}."
  en: "Istinja' is removing filth from the private parts after relieving oneself, with water or with stones; the reports call it istitaba ('making clean'), and cleansing with stones istijmar. Abu Dawud gives it several chapters in the Book of Purification: what may not be used (bone, dung, charcoal), cleansing with three stones, making sure of the last drops (istibra'), and cleansing with water; al-Khattabi holds that stones are a concession and water the original means, and that fewer than three stones do not suffice even if the place is clean {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}."
  ur: "استنجا قضائے حاجت کے بعد نجاست کے مقام سے گندگی دور کرنا ہے، پانی یا پتھروں سے؛ احادیث میں اسے «استطابہ» اور پتھروں سے استنجا کو «استجمار» کہا گیا ہے۔ ابو داؤد نے کتاب الطہارۃ میں اس کے کئی ابواب باندھے: جن چیزوں سے استنجا منع ہے ⁦(ہڈی، لید، کوئلہ)⁩، تین پتھروں سے استنجا، استبرا، اور پانی سے استنجا؛ خطابی کے نزدیک پتھر رخصت ہیں اور پانی اصل، اور تین سے کم پتھر کافی نہیں چاہے صفائی ہو جائے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}۔"
  es: "Istinja' es la eliminación de la suciedad de las partes íntimas después de orinar o defecar, con agua o con piedras; los relatos lo llaman istitaba ('limpiar'), y la limpieza con piedras istijmar. Abu Dawud le dedica varios capítulos en el Libro de la Purificación: lo que no se puede usar (hueso, estiércol, carbón), la limpieza con tres piedras, asegurarse de las últimas gotas (istibra'), y la limpieza con agua; al-Khattabi sostiene que las piedras son una concesión y el agua el medio original, y que menos de tres piedras no bastan incluso si el lugar está limpio {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 30-35}."
  fr: "L'istinja' consiste à se débarrasser des impuretés des parties intimes après avoir déféqué, soit avec de l'eau, soit avec des pierres. Les sources parlent d'istitaba (« nettoyer ») et de istijmar pour le nettoyage avec des pierres. Abou Dawoud y consacre plusieurs chapitres dans le Livre de la Purification: ce qui ne peut être utilisé (os, excréments, charbon), le nettoyage avec trois pierres, l'élimination complète des dernières gouttes (istibra') et le nettoyage à l'eau. Al-Khattabi considère que les pierres sont une solution de facilité et l'eau la méthode originelle, et que moins de trois pierres ne suffisent pas, même si l'endroit est propre (Sunan Abou Dawoud ibn Hazm, 1997, vol. 1, p. 19-20; Sunan Abou Dawoud ibn Hazm, 1997, vol. 1, p. 30-35)."
  tr: "İstince, su veya taşlarla kendini kurtardıktan sonra çıkış yerinden zararın kaldırılmasıdır; hadis buna 'istibābah' der, taşla temizleme ise 'istijmar'dır. Ebu Davud, Arınma Kitabı'nda kendisi için şu bölümler kurdu: temizlik için (kemik, gübre ve sıcak su), üç taşla temizlik, istibrā ve su ile temizlik; el-Hattabi, taşların bir taviz, suyun ana kaynak olduğunu, arınma gerçekleşse bile kendini üç taştan az kullanmanın yeterli olmadığını savunur {atıf:sunan-abi-davud-ibn-hazm-1997-v1 s. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 s. 30-35}."
  id: "Istinja adalah penghilangan kerusakan dari tempat keluar setelah buang air dengan air atau batu; hadits menyebutnya 'istibābah,' dan membersihkan dengan batu disebut 'istijmar.' Abu Dawood menetapkan bab-bab untuknya dalam Kitab Pemurnian: apa yang dilarang digunakan untuk membersihkan (tulang, kotoran, dan air panas), membersihkan dengan tiga batu, istibrā, dan membersihkan dengan air; al-Khattabi berpendapat bahwa batu adalah konsesi dan air adalah sumber utama, dan membatasi diri kurang dari tiga batu tidak cukup meskipun penyucian terjadi {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 19-20} {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 30-35}."
