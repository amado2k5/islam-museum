id: practice/dua-after-fajr-remembrance
class: practice
kind: ritual
label:
  ar: "الذكر بعد صلاة الصبح"
  en: "Remembrance after the dawn prayer"
  ur: "صبح کی نماز کے بعد ذکر"
  es: "Recuerdo tras la oración del amanecer"
  fr: "Souvenir après la prière de l'aube"
summary:
  ar: "ما جمعه النووي في باب الحث على ذكر الله بعد صلاة الصبح: فضل الجلوس للذكر إلى طلوع الشمس، وتهليل عشر مرات، ودعوات مروية بعد الفجر. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  en: "What al-Nawawi gathers in the chapter urging remembrance of God after the dawn prayer: the merit of sitting in remembrance until sunrise, ten tahlils, and supplications reported after the dawn prayer. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  ur: "نووی نے صبح کی نماز کے بعد ذکر کی ترغیب کے باب میں جو جمع کیا: طلوع آفتاب تک ذکر میں بیٹھنے کی فضیلت، دس بار تہلیل، اور فجر کے بعد منقول دعائیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  es: "Lo que al-Nawawi recopila en el capítulo que exhorta al recuerdo de Dios después de la oración del amanecer: el mérito de permanecer sentado en recuerdo hasta la salida del sol, diez tahlils y súplicas recitadas después de la oración del amanecer. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  fr: "Dans le chapitre exhortant à l'invocation de Dieu après la prière de l'aube, al-Nawawi rassemble les mérites suivants: la méditation jusqu'au lever du soleil, les dix tahlils et les invocations rapportées après la prière de l'aube. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
