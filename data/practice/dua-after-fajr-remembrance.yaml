summary:
  ar: "ما جمعه النووي في باب الحث على ذكر الله بعد صلاة الصبح: فضل الجلوس للذكر إلى طلوع الشمس، وتهليل عشر مرات، ودعوات مروية بعد الفجر. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  en: "What al-Nawawi gathers in the chapter urging remembrance of God after the dawn prayer: the merit of sitting in remembrance until sunrise, ten tahlils, and supplications reported after the dawn prayer. {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
  ur: "نووی نے صبح کی نماز کے بعد ذکر کی ترغیب کے باب میں جو جمع کیا: طلوع آفتاب تک ذکر میں بیٹھنے کی فضیلت، دس بار تہلیل، اور فجر کے بعد منقول دعائیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 74}"
