id: practice/dua-on-waking
class: practice
kind: ritual
label:
  ar: "الدعاء عند الاستيقاظ من النوم"
  en: "Supplication on waking from sleep"
  ur: "نیند سے بیدار ہونے کی دعا"
summary:
  ar: "ما يقال عند الاستيقاظ من النوم كما جمعه النووي في «الأذكار»: حمد الله على الإحياء بعد الإماتة من صحيح البخاري، وأدعية أخرى من كتاب ابن السني وسنن أبي داود. {cite:al-adhkar-nawawi-arnaut-1994 p. 19}"
  en: "What is said on waking from sleep, as al-Nawawi gathers it in al-Adhkar: praise of God for giving life after death, from Sahih al-Bukhari, with further wordings from Ibn al-Sunni's book and Sunan Abi Dawud. {cite:al-adhkar-nawawi-arnaut-1994 p. 19}"
  ur: "نیند سے بیدار ہونے پر کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: موت کے بعد زندگی دینے پر اللہ کی حمد صحیح بخاری سے، اور مزید الفاظ ابن السنی کی کتاب اور سنن ابی داود سے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 19}"
