label:
  ar: العمرة
  en: Umrah
summary:
  ar: "العمرة هي الحج الصغير: يطوف المعتمر بالكعبة سبعاً بإحرام ويسعى سبعاً بين الصفا والمروة ثم يحلق أو يقصر. وترى دائرة المعارف الإسلامية أن أعمالها مأخوذة في معظمها من العصر السابق للإسلام، وأن منزلتها الفقهية موضع خلاف، فبعض الفقهاء يوجبها وبعضهم يراها تطوعاً."
  en: "Umrah is the lesser pilgrimage: in ihram the pilgrim circumambulates the Kaaba seven times, runs seven times between Safa and Marwa, and has the hair cut or shaved. The Encyclopaedia of Islam treats its rites as largely taken over from pre-Islamic practice and its legal status as disputed, some jurists holding it obligatory and others voluntary."
  ur: "عمرہ حجِ اصغر ہے: احرام میں معتمر کعبہ کے گرد سات چکر لگاتا ہے، صفا و مروہ کے درمیان سات بار سعی کرتا ہے اور بال کٹواتا یا مونڈتا ہے۔ دائرۃ المعارف الاسلامیہ کے مطابق اس کے اعمال بڑی حد تک اسلام سے پہلے کے رواج سے لیے گئے ہیں اور اس کی فقہی حیثیت میں اختلاف ہے، بعض فقہاء اسے واجب اور بعض نفل مانتے ہیں۔"
