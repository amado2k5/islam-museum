id: practice/dua-morning-evening-wellbeing
class: practice
kind: ritual
label:
  ar: "أذكار الصباح والمساء: الشكر والعافية"
  en: "Morning and evening: gratitude and well-being"
  ur: "صبح و شام: شکر اور عافیت"
  es: "Mañana y tarde: gratitud y bienestar"
  fr: "Matin et soir: gratitude et bien-être"
  tr: "Sabah ve akşam anmaları: şükran ve sağlık"
  id: "Kenangan pagi dan sore: rasa syukur dan kesejahteraan"
summary:
  ar: "ما أورده النووي بعد ذلك في باب الصباح والمساء: الرضا بالله ربا، وأذكار الشكر، وسؤال العافية، وخير اليوم، مع ما قاله في إسناد كل منها. {cite:al-adhkar-nawawi-arnaut-1994 p. 79}"
  en: "What al-Nawawi gives next in the morning and evening chapter: contentment with God as Lord, wordings of thanks, asking for well-being, and asking for the good of the day, with what he says of the chain of each. {cite:al-adhkar-nawawi-arnaut-1994 p. 79}"
  ur: "صبح و شام کے باب میں نووی نے اس کے بعد جو ذکر کیا: اللہ کو رب ماننے پر رضا، شکر کے کلمات، عافیت کا سوال اور دن کی خیر کی دعا، ہر ایک کی سند پر ان کے کلام کے ساتھ۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 79}"
  es: "Lo que Al-Nawawi presenta a continuación en los capítulos de la mañana y la tarde es: la satisfacción con Dios como Señor, expresiones de agradecimiento, la petición de bienestar y la petición de un buen día, junto con lo que dice sobre la cadena de cada una. {cite:al-adhkar-nawawi-arnaut-1994 p. 79}"
  fr: "Dans les chapitres consacrés aux prières du matin et du soir, al-Nawawi aborde ensuite le contentement envers Dieu comme Seigneur, les formules de remerciement, les demandes de bien-être et les invocations pour une journée faste, en détaillant la chaîne de transmission de chaque pratique. {cite:al-adhkar-nawawi-arnaut-1994 p. 79}"
  tr: "El-Nawawi'nin sabah ve akşam bölümünde bahsettiği şey: Allah'ın Rab olarak huzuru, şükran anmaları, iyi haller dilemek ve günün en iyisini dilemek ile birlikte her birinin zinciri hakkında söyledikleri. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 79}"
  id: "Apa yang kemudian disebutkan al-Nawawi dalam bab pagi dan sore: kepuasan dengan Allah sebagai Tuhan, kenangan syukur, memohon kesejahteraan, dan yang terbaik dari hari itu, beserta apa yang dia katakan tentang rantai masing-masing dari mereka. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 79}"
