summary:
  ar: "موكب العرس المصري والشامي: تُحمَل العروس بين النساء بالأغاني والزغاريد والطبول من بيت أهلها إلى بيت زوجها، وفي المدن تقود فرقة شعبية الموكب بالعصي واللهب. اختلفت صوره عبر الزمان — من مواكب القرى بالفوانيس إلى دخلات الفنادق الحديثة — وظل لحن الزفة توقيع الفرح."
  en: "The Egyptian and Levantine wedding procession: the bride is walked to the groom's house amid women singing, ululations and drums, with folk troupes leading city processions with canes and fire. Its form has changed — from lantern-lit village walks to hotel entrances — but the zaffa tune remains the signature of joy."
  ur: "زفہ، مصر اور شام کی بارات: دلہن عورتوں کے نغموں، کلکاریاں اور ڈھول کے ساتھ سسرال لی جاتی ہے اور شہری جلوس میں لوک دستہ لاٹھی اور آگ کے ساتھ آگے چلتا ہے؛ صورتیں بدلیں — دیہات کی فانوس والی بارات سے ہوٹل کی داخلہ رسی تک — مگر زفے کی دھن خوشی کی پہچان رہی۔"
