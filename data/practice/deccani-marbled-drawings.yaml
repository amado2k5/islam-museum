  en: "Drawings whose figures are made of marbled paper, outlined in gold; F. R. Martin attributed them to Ottoman Turkey, but Zebrowski argues that most survivors were made at Bijapur in the mid-seventeenth century {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}."
