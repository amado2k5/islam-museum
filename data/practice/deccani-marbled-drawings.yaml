label: { ar: "الرسوم بالورق المجزّع في الدكن", en: "Deccani marbled-paper drawings", ur: "دکن میں ابری کاغذ کی تصاویر", es: "Dibujos sobre papel marmolado de Deccan", fr: "Dessins sur papier marbré du Deccan", tr: "Dükkanda kazıma kağıtla çizimler", id: "Gambar dengan kertas yang dikikis di toko" }
summary:
  ar: "رسوم تُصنع أشكالها من ورق مجزّع ⁦(إبرو)⁩ بخطوط ذهبية، نسبها ف. ر. مارتن إلى الدولة العثمانية، ويرجح زبروفسكي أن أكثر الباقي منها صُنع في بيجاپور منتصف القرن السابع عشر {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}."
  en: "Drawings whose figures are made of marbled paper, outlined in gold; F. R. Martin attributed them to Ottoman Turkey, but Zebrowski argues that most survivors were made at Bijapur in the mid-seventeenth century {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}."
  ur: "ایسی تصاویر جن کے پیکر ابری کاغذ سے بنے اور سنہری لکیروں سے گھرے ہوں؛ ایف آر مارٹن نے انہیں عثمانی ترکی سے منسوب کیا، مگر زیبروسکی کے نزدیک زیادہ تر باقی نمونے سترہویں صدی کے وسط میں بیجاپور میں بنے {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}۔"
  es: "Dibujos cuyas figuras están hechas de papel jaspeado, delineadas en oro; FR Martin los atribuyó a la Turquía otomana, pero Zebrowski argumenta que la mayoría de los que se conservan fueron hechos en Bijapur a mediados del siglo XVII {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}."
  fr: "Dessins dont les figures sont faites de papier marbré, soulignées d'or; FR Martin les a attribués à la Turquie ottomane, mais Zebrowski soutient que la plupart des survivants ont été réalisés à Bijapur au milieu du XVIIe siècle {cite:zebrowski-deccani-painting-1983 p. 13} {cite:zebrowski-deccani-painting-1983 p. 132} {cite:zebrowski-deccani-painting-1983 p. 134}."
  tr: "F. R. Martin tarafından Osmanlı İmparatorluğu'na atfedilen altın çizgili kaş kağıdından yapılmış çizimler. Zebrowski, kalan eserlerin çoğunun 17. yüzyıl ortalarında Bijapur'da yapıldığını öne sürer {cite:Zebrowski-deccani-painting-1983 s. 13} {cite:Zebrowski-deccani-painting-1983 s. 132} {cite:Zebrowski-deccani-painting-1983 s. 134}."
  id: "Gambar yang dibuat dari kertas alis dengan garis emas, yang dikaitkan oleh F. R. Martin dengan Kekaisaran Ottoman. Zebrowski menyarankan bahwa sebagian besar karya yang tersisa dibuat di Bijapur pada pertengahan abad ke-17 {cite:Zebrowski-deccani-painting-1983 hlm. 13} {cite:Zebrowski-deccani-painting-1983 hlm. 132} {cite:Zebrowski-deccani-painting-1983 hlm. 134}."
