id: practice/dua-food-after-meal
class: practice
kind: ritual
label:
  ar: "ما يقال إذا فرغ من الطعام وما يتصل به من أحوال الأكل"
  en: "What is said on finishing the meal and related situations at table"
  ur: "کھانے سے فارغ ہونے پر کہے جانے والے اذکار اور دسترخوان کے متعلقہ احوال"
  es: "Lo que se dice al terminar la comida y situaciones relacionadas en la mesa."
  fr: "Ce qui se dit à la fin du repas et les situations connexes à table"
summary:
  ar: "ما جمعه النووي في «الأذكار» من الكلام على الطعام، والأكل بلا شبع، والأكل مع صاحب عاهة، وقول «كل» للضيف، ثم أذكار الفراغ من الطعام وما يروى فيها. {cite:al-adhkar-nawawi-arnaut-1994 p. 234}"
  en: "What al-Nawawi gathers in al-Adhkar on talk at the meal, eating without being satisfied, eating with one who has an affliction, the host's urging a guest to eat, and then the remembrances on finishing the meal and what is reported for them. {cite:al-adhkar-nawawi-arnaut-1994 p. 234}"
  ur: "جو نووی نے «الاذکار» میں کھانے پر گفتگو، پیٹ نہ بھرنے، معذور کے ساتھ کھانے، میزبان کے مہمان کو کھانے کا کہنے، اور پھر کھانے سے فارغ ہونے پر اذکار اور ان کے بارے میں منقول روایات کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 234}"
  es: "Lo que al-Nawawi recopila en al-Adhkar trata sobre la conversación durante la comida, comer sin quedar satisfecho, comer con alguien que padece una aflicción, la insistencia del anfitrión en que el invitado coma, y luego las reflexiones al terminar la comida y lo que se narra sobre ellas. {cite:al-adhkar-nawawi-arnaut-1994 p. 234}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble des réflexions sur les conversations à table, le fait de manger sans être rassasié, de manger avec une personne souffrante, les incitations de l'hôte à manger pour son invité, ainsi que les souvenirs qui accompagnent le repas et les enseignements qui en découlent. {cite:al-adhkar-nawawi-arnaut-1994 p. 234}"
