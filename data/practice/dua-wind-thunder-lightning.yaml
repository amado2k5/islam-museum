  en: "What al-Nawawi gathers in al-Adhkar of supplications and manners at a rising wind, a falling star, flashing lightning and the sound of thunder, from reports, early sayings and al-Shafi'i. {cite:al-adhkar-nawawi-arnaut-1994 p. 178}"
  ur: "جو نووی نے «الاذکار» میں تیز ہوا، ٹوٹتے ستارے، چمکتی بجلی اور گرج سن کر دعاؤں اور آداب کے بارے میں روایات، آثار اور شافعی کے اقوال سے جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 178}"
