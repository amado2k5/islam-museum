label:
  ar: "ما يقال عند الريح والكوكب المنقض والبرق والرعد"
  en: "What is said at the wind, a falling star, lightning and thunder"
  ur: "ہوا، ٹوٹتے ستارے، بجلی اور گرج کے وقت کے اذکار"
summary:
