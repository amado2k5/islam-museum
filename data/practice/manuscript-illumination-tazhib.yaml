label: { ar: "تذهيب المخطوطات", en: "Manuscript illumination (tadhhib)", ur: "مخطوطات کی تذہیب" }
summary:
  ar: "فن زخرفة صفحات العناوين والرؤوس والفواصل والحواشي والأغلفة بالذهب والألوان، نشأ من زخرفة علامات الشكل ودوائر الفصل بين الآيات في مصاحف القرنين السابع والثامن، وبلغ ذروته عند المزخرفين الفرس {cite:titley-persian-miniature-painting-1983 p. 228}."
  en: "The art of decorating title pages, headings, verse divisions, borders and covers with gold and colours, arising from the ornamentation of vowel marks and verse-dividing circles in seventh- and eighth-century Qur'ans, and brought to a peak by Persian illuminators {cite:titley-persian-miniature-painting-1983 p. 228}."
  ur: "سرورق، عنوانات، فواصل، حاشیوں اور جلدوں کو سونے اور رنگوں سے آراستہ کرنے کا فن، جو ساتویں آٹھویں صدی کے مصاحف میں اعراب اور آیات کے فاصل دائروں کی آرائش سے پیدا ہوا اور فارسی مذہّبوں کے ہاں عروج کو پہنچا {cite:titley-persian-miniature-painting-1983 p. 228}."
