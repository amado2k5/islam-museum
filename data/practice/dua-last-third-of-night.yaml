label:
  ar: "الدعاء في الليل: النصف الثاني وساعة الإجابة"
  en: "Supplication in the night: its later part and the hour of answer"
  ur: "رات میں دعا: بعد کا حصہ اور قبولیت کی گھڑی"
  es: "Súplica en la noche: su última parte y la hora de la respuesta."
  fr: "La supplication nocturne: sa dernière partie et l'heure de la réponse"
  tr: "Gece Yalvarış: İkinci Yarı ve Yanıt Saati"
  id: "Doa di Malam Hari: Paruh Kedua dan Jam Respons"
summary:
  ar: "ما جمعه النووي في بابين: الحث على الدعاء والاستغفار في النصف الثاني من كل ليلة، والدعاء في جميع ساعات الليل رجاء أن يصادف ساعة الإجابة. {cite:al-adhkar-nawawi-arnaut-1994 p. 99}"
  en: "What al-Nawawi gathers in two chapters: the urging to supplicate and seek forgiveness in the later half of every night, and supplication through all the hours of the night in hope of meeting the hour of answer. {cite:al-adhkar-nawawi-arnaut-1994 p. 99}"
  ur: "نووی نے دو ابواب میں جو جمع کیا: ہر رات کے دوسرے نصف میں دعا اور استغفار کی ترغیب، اور رات کی تمام گھڑیوں میں دعا اس امید پر کہ قبولیت کی گھڑی مل جائے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 99}"
  es: "Lo que al-Nawawi reúne en dos capítulos: la exhortación a suplicar y buscar el perdón en la segunda mitad de cada noche, y la súplica durante todas las horas de la noche con la esperanza de encontrar la hora de la respuesta. {cite:al-adhkar-nawawi-arnaut-1994 p. 99}"
  fr: "Ce qu'al-Nawawi rassemble en deux chapitres: l'exhortation à implorer le pardon et à demander grâce durant la seconde moitié de chaque nuit, et l'invocation tout au long de la nuit dans l'espoir d'atteindre l'heure de la réponse. {cite:al-adhkar-nawawi-arnaut-1994 p. 99}"
  tr: "El-Nawawi'nin iki bölümde topladığı şey: her gece ikinci yarısında dua etmek ve af dilemek ve gecenin her saatinde dua etmek, bunun yanıt saatiyle çakışmasını umarak. {cite:al-adhkar-nawawi-arnaut-1994 s. 99}"
  id: "Apa yang dirangkum al-Nawawi dalam dua bab: mendesak permohonan dan memohon pengampunan di paruh kedua setiap malam, serta memohon di setiap jam malam, berharap itu bertepatan dengan jam jawaban. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 99}"
