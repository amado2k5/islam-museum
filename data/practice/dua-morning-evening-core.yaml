label:
  ar: "أذكار الصباح والمساء: أصول الباب"
  en: "Morning and evening: the core reports"
  ur: "أذکار صبح و شام: بنیادی روایات"
  es: "Mañana y tarde: los informes principales"
  fr: "Matin et soir: les principaux rapports"
summary:
  ar: "أول ما أورده النووي في باب ما يقال عند الصباح والمساء، وهو أوسع أبواب الكتاب: سيد الاستغفار، والتسبيح مائة مرة، والسور الثلاث، والتعوذ بكلمات الله التامات. {cite:al-adhkar-nawawi-arnaut-1994 p. 76}"
  en: "The first part of what al-Nawawi gives in the chapter on what is said at morning and evening, the widest chapter of the book: the master of seeking forgiveness, a hundred glorifications, three short surahs, and refuge in God's perfect words. {cite:al-adhkar-nawawi-arnaut-1994 p. 76}"
  ur: "صبح و شام کے باب کا ابتدائی حصہ جو نووی نے ذکر کیا، جو کتاب کا سب سے وسیع باب ہے: سید الاستغفار، سو بار تسبیح، تین چھوٹی سورتیں اور اللہ کے کامل کلمات کی پناہ۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 76}"
  es: "La primera parte de lo que al-Nawawi ofrece en el capítulo sobre lo que se dice por la mañana y por la tarde, el capítulo más extenso del libro: el maestro de la búsqueda del perdón, cien glorificaciones, tres suras breves y el refugio en las palabras perfectas de Dios. {cite:al-adhkar-nawawi-arnaut-1994 p. 76}"
  fr: "La première partie du chapitre consacré aux prières du matin et du soir, le plus vaste de l'ouvrage, selon al-Nawawi, aborde la maîtrise de la recherche du pardon, les cent louanges, les trois courtes sourates et le refuge dans la Parole parfaite de Dieu. {cite:al-adhkar-nawawi-arnaut-1994 p. 76}"
