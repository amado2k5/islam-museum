  tr: "El-Nevavi'nin Kabe'yi gördükten sonra derlediği dua, Tevaf'ın ayrı anmaları ve namaz kılan için yapılan dua. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 194}"
  id: "Apa yang disusun al-Nawawi dalam doa saat melihat Ka'bah, kenangan terpisah Tawaf, dan doa untuk orang yang berdoa. {sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 194}"
