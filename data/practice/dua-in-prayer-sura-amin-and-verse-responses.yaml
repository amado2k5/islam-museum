class: practice
kind: ritual
label:
  ar: "آمين وإجابة الآيات في الصلاة"
  en: "Amin and the answers to verses during the recitation"
  ur: "آمین اور آیات کے جواب"
  es: "Amin y las respuestas a los versículos durante la recitación"
  fr: "Amin et les réponses aux versets pendant la récitation"
summary:
  ar: "ما جمعه النووي في تتمة باب القراءة: السورة بعد الفاتحة، ثم التأمين، ثم ما يقوله القارئ عند آية رحمة أو عذاب أو تسبيح. {cite:al-adhkar-nawawi-arnaut-1994 p. 48}"
  en: "What al-Nawawi gathers in the rest of the chapter on recitation: the sura after the Fatiha, then saying amin, then what a reader says on meeting a verse of mercy, of punishment or of glorification. {cite:al-adhkar-nawawi-arnaut-1994 p. 48}"
  ur: "جو نووی نے قرأت کے باب کے باقی حصے میں جمع کیا: فاتحہ کے بعد سورت، پھر آمین، پھر رحمت، عذاب یا تسبیح کی آیت پر قاری کیا کہے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 48}"
  es: "Lo que al-Nawawi recopila en el resto del capítulo sobre la recitación: la sura después de la Fatiha, luego decir amén, y finalmente lo que dice el lector al encontrarse con un versículo de misericordia, castigo o glorificación. {cite:al-adhkar-nawawi-arnaut-1994 p. 48}"
  fr: "Dans le reste du chapitre consacré à la récitation, al-Nawawi rassemble les éléments suivants: la sourate après la Fatiha, puis la formule « Amin », et enfin les paroles prononcées par le lecteur lorsqu’il rencontre un verset de miséricorde, de châtiment ou de glorification. {cite:al-adhkar-nawawi-arnaut-1994 p. 48}"
