id: practice/dua-at-sea-and-on-the-road
class: practice
kind: ritual
label:
  ar: "ما يقوله المسافر في السفينة وعلى الطريق"
  en: "What the traveller says on a ship and on the road"
  ur: "مسافر جہاز پر اور راستے میں کیا کہتا ہے"
  es: "Lo que dice el viajero en un barco y en la carretera."
  fr: "Ce que dit le voyageur sur un bateau et sur la route"
  tr: "Yolcunun gemide ve yolda söyledikleri"
  id: "Apa yang dikatakan pelancong di kapal dan di jalan"
summary:
  ar: "ما أورده النووي في «كتاب أذكار المسافر» من ركوب السفينة ودعاء المسافر والتكبير عند الصعود والتسبيح عند الهبوط وما يقال إذا انفلتت الدابة أو رؤيت قرية. {cite:al-adhkar-nawawi-arnaut-1994 p. 221}"
  en: "What al-Nawawi gathers in the Book of the Traveller's Remembrances on boarding a ship, the traveller's supplication, takbir on ascending and tasbih on descending, and what is said when a beast runs loose or a village comes in sight. {cite:al-adhkar-nawawi-arnaut-1994 p. 221}"
  ur: "جو نووی نے «کتاب اذکار المسافر» میں کشتی پر سوار ہونے، مسافر کی دعا، چڑھائی پر تکبیر اور اترائی پر تسبیح، اور جانور کے بھاگ نکلنے یا بستی نظر آنے پر کہی جانے والی باتوں کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 221}"
  es: "Lo que Al-Nawawi recopila en el Libro de las Memorias del Viajero sobre el embarque, la súplica del viajero, el takbir al ascender y el tasbih al descender, y lo que se dice cuando una bestia se escapa o se divisa un pueblo. {cite:al-adhkar-nawawi-arnaut-1994 p. 221}"
  fr: "Dans son ouvrage intitulé « Souvenirs du voyageur », al-Nawawi rassemble des éléments relatifs à l’embarquement sur un navire, à la supplication du voyageur, au takbir lors de la montée et au tasbih lors de la descente, ainsi qu’aux paroles prononcées lorsqu’une bête s’échappe ou qu’un village apparaît. {cite:al-adhkar-nawawi-arnaut-1994 p. 221}"
  tr: "El-Nawavi'nin 'Kitab Adhkar al-Musafir'de gemiye binmek, yolcunun duası, gemiye binerken tekbir söylemek, inerken Allah'ı yüceltmek ve bir hayvan serbest kaldığında ya da bir köy göründüğünde ne söylendiği hakkında bahsettikleri. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 221}"
  id: "Apa yang disebutkan al-Nawawi dalam 'Kitab Adhkar al-Musafir' tentang naik kapal, permohonan pengembara, mengucapkan takbir saat naik, memuliakan Allah saat turun, dan apa yang dikatakan ketika binatang lepas atau desa terlihat. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 221}"
