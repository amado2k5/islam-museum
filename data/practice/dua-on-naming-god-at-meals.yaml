id: practice/dua-on-naming-god-at-meals
class: practice
kind: ritual
label:
  ar: "التسمية عند الأكل والشرب"
  en: "Naming God at eating and drinking"
  ur: "کھانے اور پینے کے وقت اللہ کا نام لینا"
  es: "Nombrar a Dios al comer y beber."
  fr: "Nommer Dieu en mangeant et en buvant"
summary:
  ar: "ما أورده النووي في «كتاب أذكار الأكل والشرب» من باب التسمية عند الأكل والشرب وصفتها وما يقال إذا نسيها، وباب أن لا يعيب الطعام. {cite:al-adhkar-nawawi-arnaut-1994 p. 229}"
  en: "What al-Nawawi gathers in the Book of the Remembrances of Eating and Drinking on naming God at meals, its wording, what is said if it is forgotten, and the chapter on not finding fault with food. {cite:al-adhkar-nawawi-arnaut-1994 p. 229}"
  ur: "جو نووی نے «کتاب اذکار الاکل والشرب» میں کھانے پینے کے وقت اللہ کا نام لینے، اس کے الفاظ، بھول جانے پر کیا کہا جائے، اور کھانے میں عیب نہ نکالنے کے باب کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 229}"
  es: "Lo que al-Nawawi recopila en el Libro de los Recuerdos de Comer y Beber sobre la invocación de Dios en las comidas, su formulación, qué se dice si se olvida y el capítulo sobre no criticar la comida. {cite:al-adhkar-nawawi-arnaut-1994 p. 229}"
  fr: "Dans son ouvrage intitulé « Les Souvenirs des Repas et des Boissons », al-Nawawi rassemble des informations sur l’invocation de Dieu pendant les repas, sa formulation, les paroles prononcées en cas d’oubli, ainsi que le chapitre sur l’absence de reproches à formuler à l’égard de la nourriture. {cite:al-adhkar-nawawi-arnaut-1994 p. 229}"
