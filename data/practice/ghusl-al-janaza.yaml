label:
  ar: غسل الميت
  en: Washing the deceased
summary:
  ar: "تغسيل المسلم الميت قبل التكفين والصلاة؛ فرض كفاية عند جميع المذاهب. ويذكر الموطأ في كتاب الجنائز أن النبي أمر أم عطية حين توفيت ابنته أن تغسلها ثلاثاً أو خمساً أو أكثر بماء وسدر وتجعل في الآخرة كافوراً، وأعطاها إزاره لكفنها، ويذكر مالك أن من ماتت ولا امرأة تغسلها ولا ذو محرم ولا زوج يممها، وأن غسل الميت عنده ليس له صفة معلومة وإنما يُغسَّل فيُطهَّر {cite:muwatta-maruf-1997 p. 305-307}"
  en: "Washing the deceased. The Muwatta's Book of Funerals records that the Prophet told Umm Atiyya, when his daughter died, to wash her three, five or more times with water and lote leaves, to put camphor in the last washing, and gave her his waist-wrapper for her shroud; Malik adds that one who dies with no woman to wash her, no kinsman and no husband is given tayammum, and that in his view the washing of the dead has no prescribed formula — he is washed simply to be purified {cite:muwatta-maruf-1997 p. 305-307}"
