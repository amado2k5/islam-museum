kind: rite_of_passage
label:
  ar: غسل الميت
  en: Washing the deceased
  es: "Lavando al difunto"
  fr: "Laver le défunt"
  ur: "میت کو غسل دینا"
  tr: "Ölüleri yıkamak"
  id: "Mencuci orang mati"
summary:
  ar: "تغسيل المسلم الميت قبل التكفين والصلاة؛ فرض كفاية عند جميع المذاهب. ويذكر الموطأ في كتاب الجنائز أن النبي أمر أم عطية حين توفيت ابنته أن تغسلها ثلاثاً أو خمساً أو أكثر بماء وسدر وتجعل في الآخرة كافوراً، وأعطاها إزاره لكفنها، ويذكر مالك أن من ماتت ولا امرأة تغسلها ولا ذو محرم ولا زوج يممها، وأن غسل الميت عنده ليس له صفة معلومة وإنما يُغسَّل فيُطهَّر {cite:muwatta-maruf-1997 p. 305-307}"
  en: "Washing the deceased. The Muwatta's Book of Funerals records that the Prophet told Umm Atiyya, when his daughter died, to wash her three, five or more times with water and lote leaves, to put camphor in the last washing, and gave her his waist-wrapper for her shroud; Malik adds that one who dies with no woman to wash her, no kinsman and no husband is given tayammum, and that in his view the washing of the dead has no prescribed formula — he is washed simply to be purified {cite:muwatta-maruf-1997 p. 305-307}"
  es: "El lavado del difunto. El Libro de Funerales del Muwatta registra que el Profeta le dijo a Umm Atiyya, cuando murió su hija, que la lavara tres, cinco o más veces con agua y hojas de loto, que pusiera alcanfor en el último lavado y le dio su faja para que la envolviera en su mortaja; Malik añade que a quien muere sin mujer que lo lave, sin pariente ni esposo se le da el tayammum, y que, en su opinión, el lavado del difunto no tiene una fórmula prescrita; se le lava simplemente para purificarlo {cite:muwatta-maruf-1997 p. 305-307}."
  fr: "Le lavage du défunt. Le Livre des funérailles de Muwatta rapporte que le Prophète a dit à Umm Atiyya, à la mort de sa fille, de la laver trois, cinq fois ou plus avec de l'eau et des feuilles de lotus, d'ajouter du camphre au dernier lavage, et lui a donné son pagne comme linceul. Malik ajoute que celui qui meurt sans femme pour le laver, sans parent ni époux, reçoit le tayammum, et que, selon lui, le lavage du défunt ne suit aucune formule prescrite: il est simplement lavé pour être purifié. {cite:muwatta-maruf-1997 p. 305-307}"
  ur: "میت کو غسل دینا۔ موطا کی کتاب جنازہ میں درج ہے کہ نبی نے ام عطیہ ا سے فرمایا کہ جب ان کی بیٹی فوت ہو گئی تو اسے تین، پانچ یا اس سے زیادہ بار پانی اور لوٹے کے پتوں سے نہلائیں، آخری غسل میں کافور ڈالیں، اور اس کے کفن کے لیے اپنی کمر پر لپیٹ دیں۔ مالک کا مزید کہنا ہے کہ جو شخص فوت ہو جائے اس کے ساتھ نہ کوئی عورت اسے غسل دیتی ہے، نہ رشتہ دار اور نہ شوہر کو تیمم دیا جاتا ہے، اور اس کے خیال میں میت کے غسل کا کوئی طریقہ نہیں ہے - اسے صرف پاک کرنے کے لیے غسل دیا جاتا ہے۔ 305-307}"
  tr: "Ölen Müslüman'ı kefen ve namazdan önce yıkamak, tüm düşünce mezheblerine göre ortak bir yükümlülüktür. Cenaze Kitabı'ndaki Muwatta, Peygamber'in kızı öldüğünde Um Atiyyah'a üç-beş kez ya da daha fazla kez su ve lote lote ile yıkamasını ve ahirette kafur yapmasını emrettiğini ve ona kefen örtmesi için giysisini verdiğini belirtir. Malik, biri ölürse hiçbir kadının onu yıkamadığını, hiçbir mahramın velisi veya namaz kılacak bir kocası olmadığını ve ölen kişinin yıkanmasının bilinen bir statüsü olmadığını; aksine, kendini yıkayıp arındırdığını belirtir {cite:muwatta-maruf-1997, s. 305-307}"
  id: "Mencuci Muslim yang telah meninggal sebelum mengenakan kain kafan dan shalat adalah kewajiban kolektif menurut semua aliran pemikiran. Muwatta dalam Kitab Pemakaman menyebutkan bahwa Nabi memerintahkan um Atiyyah, ketika putrinya meninggal, untuk mencucinya tiga atau lima kali atau lebih dengan air dan lote lote serta membuat kafur di akhirat, dan ia memberikan pakaiannya sebagai penutup kain kepadanya. Malik menyebutkan bahwa jika seseorang meninggal, tidak ada wanita yang membasuhnya, tidak ada mahram yang memiliki wali, maupun suami untuk melakukan shalat itu, dan bahwa mencuci almarhum tidak memiliki status yang diketahui baginya; sebaliknya, ia mencuci dan menyucikan dirinya {cite:muwatta-maruf-1997, hlm. 305-307}"
