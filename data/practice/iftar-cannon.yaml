label: {ar: "مدفع الإفطار", en: "The iftar cannon", ur: "توپِ افطار"}
summary:
  ar: "مدفع يُطلق عند الغروب في رمضان إيذاناً بالإفطار، نشأت قصته في القاهرة: يُروى أن سلطاناً مملوكياً جرّب مدفعاً فأطلقه وقت المغرب، فظن الناسه إعلاناً مقصوداً فاستحسنه وأمر بإطلاقه يومياً. ثم انتقلت العادة إلى الشام وبغداد ثم الخليج والمغرب، وتطلق اليوم مدافع الإفطار في أبوظبي ودبي وجدة وعمّان وبيروت والقدس."
  en: "A cannon fired at sunset in Ramadan to announce iftar. Its story begins in Cairo: a Mamluk sultan testing a gifted cannon at maghrib led Cairenes to take the shot as an intentional iftar signal; he ordered it fired daily, blanks replacing live shot in 1859. The custom spread to the Levant, Baghdad by the late nineteenth century, then the Gulf and North Africa; iftar cannons still sound in Abu Dhabi, Dubai, Jeddah, Amman, Beirut and Jerusalem."
  ur: "افطار کی توپ جو رمضان میں غروبِ آفتاب پر افطار کے اعلان کے لیے داغی جاتی ہے؛ قصہ قاہرہ سے شروع ہوتا ہے: ایک مملوک سلطان نے تحفے میں ملی توپ غروب کے وقت آزمائی تو شہریوں نے اسے افطار کا اعلان سمجھا، سلطان کو پسند آیا اور روزانہ فائرنگ کا حکم دیا، 1859 میں خولی گولے مستقر ہوئے۔ رسم شام اور بغداد، پھر خلیج اور شمالی افریقہ تک پہنچی؛ آج بھی ابوظہبی، دبی، جدہ، عمان، بیروت اور بیت المقدس میں افطار کی توپیں گونجتی ہیں۔"
