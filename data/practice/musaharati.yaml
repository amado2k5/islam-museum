label: {ar: "المسحراتي", en: "The musaharati", ur: "مسحراتی"}
summary:
  ar: "المسحراتي هو من يوقظ الناس للسحور في رمضان بالطبل والنداء؛ يُروى أن أول مسحراتي عُرف كان عتبة بن إسحاق والي مصر يطوف ليلاً منادياً «يا عباد الله تسحروا فإن في السحور بركة». وللعادة أسماء في البلدان: النفار في المغرب ينفخ البوق، والمطرّق في تركيا بلباس عثماني يضرب الدول، ويطرق اليمني الأبواب."
  en: "The caller who wakes neighbourhoods for the suhur meal in Ramadan, drumming and singing through the streets before dawn; the tradition is traced to Utba ibn Ishaq, governor of Egypt, who walked Cairo at night calling 'Servants of God, take suhur, for in suhur is blessing'. Names differ by country: Morocco's naffar blows a trumpet, the Ottoman-costumed davul player drums in Turkey, and the Yemeni knocks on doors."
  ur: "مسحراتی وہ شخص ہے جو رمضان میں سحری کے لیے گلیوں میں ڈھول بجا کر اور نداء لگا کر لوگوں کو جگاتا ہے؛ روایت اسے مصر کے گورنر عتبہ بن اسحاق تک پہنچاتی ہے جو قاہرہ میں رات گھوم کر پکارتے تھے: «اے بندو سحری کرو کہ سحری میں برکت ہے»۔ ملک بدلتے نام بدلتے ہیں: مراکش میں نفار بگل پھونکتا ہے، ترکی میں سلطنت عثمانیہ کے لباس میں ڈول بجانے والا، اور یمن میں دروازہ کھٹکھٹانے والا۔"
