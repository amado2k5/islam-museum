label: {ar: "تكبير العيد", en: "The Eid takbir", ur: "تکبیرِ عید"}
summary:
  ar: "التكبير المطلق والمقيد في العيدين: يجهر الناس «الله أكبر الله أكبر لا إله إلا الله، والله أكبر الله أكبر ولله الحمد» من غروب ليلة العيد حتى صلاة الصباح في عيد الفطر، ومن فجر يوم عرفة إلى عصر آخر أيام التشريق في الأضحى؛ تجوب التكبيرات الأسواق والبيوت في إندونيسيا بمسيرات ليلية."
  en: "The festival glorification in both Eids: people chant 'Allahu akbar, Allahu akbar, la ilaha illa Allah; Allahu akbar, Allahu akbar, wa lillah al-hamd' from the sunset before Eid al-Fitr until the morning prayer, and from the dawn of Arafah day until the last tashriq afternoon for Eid al-Adha; in Indonesia takbir rounds fill the night streets."
  ur: "تکبیرِ عید دونوں عیدوں میں: عید الفطر کی شام سے نمازِ عید تک اور عید الاضحیٰ میں فجرِ عرفہ سے آخری عصرِ تشریق تک «اللہ اکبر اللہ اکبر لا الٰہ الا اللہ واللہ اکبر اللہ اکبر وللہ الحمد» کی صدا اٹھتی ہے؛ انڈونیشیا میں تکبیر کے جلوس رات بھر بازاروں میں گھومتے ہیں۔"
