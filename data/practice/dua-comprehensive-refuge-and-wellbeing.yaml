  es: "Lo que al-Nawawi recopila en el Libro de las Súplicas Completas sobre la búsqueda de refugio y la petición de bienestar y firmeza, proviene de los Sunan de Abu Dawud, al-Tirmidhi y al-Nasa'i, así como de los dos Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 390}"
