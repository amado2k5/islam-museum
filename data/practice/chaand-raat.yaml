  ar: "«ليلة القمر» في جنوب آسيا ليلة العيد: بعد ثبوت هلال شوال تفتح الأسواق أبوابها حتى الفجر، تكتسح النساء أكشاك الحناء لنقش الأيدي، وتكتمل مشتريات العيد والحلويات؛ من أكثر ليالي السنة اكتظاظاً في باكستان والهند وبنغلاديش."
  en: "The 'night of the moon' in South Asia on the eve of Eid al-Fitr: once the Shawwal crescent is announced the bazaars stay open till dawn, henna stalls decorate hands, and last Eid outfits and sweets are bought — among the busiest nights of the year in Pakistan, India and Bangladesh."
