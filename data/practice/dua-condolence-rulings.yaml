  en: "What al-Nawawi gathers in the chapter on condolence: its merit, its time, whom it includes, the dislike of sitting for it, its wording and the best words with which to console. {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  ur: "نووی نے تعزیت کے باب میں جو جمع کیا: اس کی فضیلت، وقت، کن کو شامل ہو، اس کے لیے بیٹھنے کی کراہت، اس کے الفاظ اور بہترین تعزیتی کلمات۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
