label:
  ar: "التعزية وأحكامها وألفاظها"
  en: "Condolence: its merit, timing, manner and words"
  ur: "تعزیت: فضیلت، وقت، طریقہ اور الفاظ"
  es: "Condolencias: su mérito, momento oportuno, forma y palabras"
  fr: "Les condoléances: leur mérite, leur moment, leur manière et leurs mots"
  tr: "Başsağlığı dilekçeleri, kararları ve metni"
  id: "Ucapan belasungkawa, putusan, dan kata-katanya"
summary:
  ar: "ما جمعه النووي في باب التعزية: فضلها، ووقتها، ومن تشمل، وكراهة الجلوس لها، وألفاظها، وأحسن ما يعزى به. {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  en: "What al-Nawawi gathers in the chapter on condolence: its merit, its time, whom it includes, the dislike of sitting for it, its wording and the best words with which to console. {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  ur: "نووی نے تعزیت کے باب میں جو جمع کیا: اس کی فضیلت، وقت، کن کو شامل ہو، اس کے لیے بیٹھنے کی کراہت، اس کے الفاظ اور بہترین تعزیتی کلمات۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  es: "Lo que Al-Nawawi recopila en el capítulo sobre el pésame: su mérito, el momento oportuno, a quién incluye, la aversión a sentarse a darlo, su formulación y las mejores palabras para consolar. {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  fr: "Dans le chapitre consacré aux condoléances, al-Nawawi aborde les points suivants: leur importance, le moment opportun, les personnes concernées, la réticence à y participer, les termes employés et les mots les plus appropriés pour consoler. {cite:al-adhkar-nawawi-arnaut-1994 p. 148}"
  tr: "El-Nawawi'nin başsağlığı bölümünde topladıkları: erdemleri, zamanlaması, kimlerin dahil etmesi, oturmaktan hoşlanmaması, ifadeleri ve ona atfedilme şekli. {cite:al-adhkar-nawawi-arnaut-1994 s. 148}"
  id: "Apa yang dikumpulkan al-Nawawi dalam bab tentang belasungkawa: kebajikan, waktunya, siapa yang memasukkannya, ketidaksukaan duduk untuknya, kata-katanya, dan cara terbaik untuk mengaitkannya. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 148}"
