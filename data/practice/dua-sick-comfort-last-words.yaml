kind: ritual
label:
  ar: "مواساة المريض وما يقوله المحتضر ووصاياه"
  en: "Comforting the sick, and what the dying say and bequeath"
  ur: "مریض کی دل جوئی اور مرنے والے کے کلمات اور وصیتیں"
  es: "Cómo consolar a los enfermos, y qué dicen y dejan los moribundos."
  fr: "Réconforter les malades, et ce que disent et lèguent les mourants"
  tr: "Hastayı Teselli Etmek, Ölmekte Olan Kişinin Söyledikleri ve Tavsiyeleri"
  id: "Menghibur orang sakit dan apa yang dikatakan orang yang sekarat serta nasihatnya"
summary:
  ar: "ما جمعه النووي في تطييب نفس المريض وما يقال له بعد العافية وما يقوله من أيس من حياته وما يوصي به أهله. {cite:al-adhkar-nawawi-arnaut-1994 p. 139}"
  en: "What al-Nawawi gathers on cheering the sick, reminding the recovered of their promises, what a person says who has given up hope of life, and what he asks of his family. {cite:al-adhkar-nawawi-arnaut-1994 p. 139}"
  ur: "نووی نے مریض کی دل جوئی، صحت کے بعد وعدے یاد دلانے، زندگی سے مایوس شخص کے کلمات اور اپنے اہل کو وصیت کے بارے میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 139}"
  es: "Lo que Al-Nawawi recoge sobre cómo animar a los enfermos, recordar a los recuperados sus promesas, lo que dice una persona que ha perdido la esperanza de vivir y lo que pide a su familia. {cite:al-adhkar-nawawi-arnaut-1994 p. 139}"
  fr: "Ce qu'al-Nawawi recueille sur les encouragements prodigués aux malades, le rappel des promesses faites aux guéris, les paroles d'une personne ayant perdu tout espoir de vivre et ses demandes à sa famille. {cite:al-adhkar-nawawi-arnaut-1994 p. 139}"
  tr: "Al-Nawawi'nin hastaların ruhunu iyileştirme hakkında topladıkları, iyileştikten sonra ona neler söylendiği, hayatındaki umutsuzluk hakkında söyledikleri ve ailesine ne yapmalarını tavsiye ettiği. {cite:al-adhkar-nawawi-arnaut-1994 s. 139}"
  id: "Apa yang dikumpulkan al-Nawawi tentang penyembuhan jiwa orang sakit, apa yang dikatakan kepadanya setelah pemulihan, apa yang dia katakan tentang keputusasaan dalam hidupnya, dan apa yang dia sarankan keluarganya lakukan. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 139}"
