id: practice/dua-of-the-traveller
class: practice
kind: ritual
label:
  ar: "أذكار المسافر عند الخروج والوداع"
  en: "The traveller's remembrances at setting out and farewell"
  ur: "روانگی اور رخصت کے وقت مسافر کے اذکار"
  es: "Recuerdos del viajero al partir y despedirse"
  fr: "Souvenirs du voyageur au départ et adieu"
  tr: "Yolcunun ayrılışında anılması ve veda"
  id: "Kenangan pelancong saat keberangkatan dan perpisahan"
summary:
  ar: "ما أورده النووي في «كتاب أذكار المسافر» من «الأذكار» مما يقال عند إرادة الخروج وعند الوداع: الاستخارة والاستشارة، وركعتا السفر، وقول المودع «أستودع الله دينك وأمانتك وخواتيم عملك»، والدعاء للمسافر بالتقوى. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  en: "What al-Nawawi gives in the Book of the Traveller's Remembrances in al-Adhkar for setting out and for farewell: seeking counsel and istikhara, the two units of prayer before a journey, the words of the one who sees a traveller off, «أستودع الله دينك وأمانتك وخواتيم عملك», and the supplication for the traveller's piety. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  ur: "جو نووی نے «الاذکار» کی «کتاب اذکار المسافر» میں روانگی اور رخصت کے وقت کے لیے ذکر کیا: مشورہ اور استخارہ، سفر کی دو رکعتیں، رخصت کرنے والے کے الفاظ «أستودع الله دينك وأمانتك وخواتيم عملك»، اور مسافر کے لیے تقویٰ کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  es: "Lo que al-Nawawi ofrece en el Libro de las Memorias del Viajero en al-Adhkar para la partida y la despedida: la búsqueda de consejo y la istikhara, las dos unidades de oración antes de un viaje, las palabras de piedad de quien despide al viajero. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  fr: "Dans son ouvrage « Les Souvenirs du Voyageur » (al-Adhkar), al-Nawawi donne des conseils pour le départ et les adieux: la consultation et l’istikhara, les deux unités de prière avant le voyage, et les paroles pieuses de celui qui accompagne le voyageur. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  tr: "El-Nawavi'nin 'Adhkar el-Musafir Kitabı'nda 'Adhkar' ile ilgili olarak ayrılırken ve veda sırasında söylenenler: istikhara ve danışma, yolculukta iki rek'et, veda sözü: 'Dinini, güvenini ve yaptıklarının sonuçlarını Allah'a emanet ediyorum' ve yolcunun dindar olması için dua. {cite:al-adhkar-nawawi-arnaut-1994 s. 214}"
  id: "Apa yang disebutkan al-Nawawi dalam 'Kitab Adhkar al-Musafir' mengenai 'Adhkar' mengenai apa yang dikatakan saat berangkat dan saat perpisahan: istikhara dan konsultasi, dua rak'ah perjalanan, ucapan perpisahan, 'Aku mempercayakan agamamu, kepercayaanmu, dan kesimpulan perbuatanmu kepada Allah,' serta doa agar pengembara menjadi saleh. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 214}"
