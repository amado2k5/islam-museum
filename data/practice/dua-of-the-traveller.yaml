id: practice/dua-of-the-traveller
class: practice
kind: ritual
label:
  ar: "أذكار المسافر عند الخروج والوداع"
  en: "The traveller's remembrances at setting out and farewell"
  ur: "روانگی اور رخصت کے وقت مسافر کے اذکار"
summary:
  ar: "ما أورده النووي في «كتاب أذكار المسافر» من «الأذكار» مما يقال عند إرادة الخروج وعند الوداع: الاستخارة والاستشارة، وركعتا السفر، وقول المودع «أستودع الله دينك وأمانتك وخواتيم عملك»، والدعاء للمسافر بالتقوى. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  en: "What al-Nawawi gives in the Book of the Traveller's Remembrances in al-Adhkar for setting out and for farewell: seeking counsel and istikhara, the two units of prayer before a journey, the words of the one who sees a traveller off, «أستودع الله دينك وأمانتك وخواتيم عملك», and the supplication for the traveller's piety. {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
  ur: "جو نووی نے «الاذکار» کی «کتاب اذکار المسافر» میں روانگی اور رخصت کے وقت کے لیے ذکر کیا: مشورہ اور استخارہ، سفر کی دو رکعتیں، رخصت کرنے والے کے الفاظ «أستودع الله دينك وأمانتك وخواتيم عملك»، اور مسافر کے لیے تقویٰ کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 214}"
