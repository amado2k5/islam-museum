label: {ar: "الفانوس", en: "The fanous lantern", ur: "فانوسِ رمضان"}
summary:
  ar: "مصباح رمضان في مصر والشام: فانوس من معدن وزجاج ملون يُعلّق على الأبواب وتحمله الصبية ليلاً وهم يرددون المواويل. تُروى قصص فاطمية عن استقبال المصريين للمعز لدين الله بالفوانيس ليلة دخوله القاهرة، وعن فانوس كبير في المساجد أطول من رجل؛ وصار الفانوس أيقونة الشهر في الشوارع والبيوت."
  en: "The Ramadan lantern of Egypt and the Levant: a metal-and-coloured-glass lamp hung on doors and carried by singing children at night. Fatimid stories tell of Cairenes greeting al-Mu'izz li-Din Allah with lanterns as he entered the city in Ramadan, and of a mosque lantern taller than a man; the fanous has become the month's emblem in streets and homes."
  ur: "فانوس، مصر اور شام کا رمضان چراغ: دھات اور رنگین شیشے کا لالٹین جو دروازوں پر لٹکتی ہے اور بچے رات کو نغمے گاتے ہوئے اٹھاتے ہیں؛ فاطمی قصے بتاتے ہیں کہ قاہریوں نے رمضان میں المعز لدین اللہ کا استقبال فانوسوں سے کیا اور ایک مسجد کا فانوس انسان سے بھی بڑا تھا۔ آج فانوس گلیوں اور گھروں میں ماہِ صیام کی پہچان ہے۔"
