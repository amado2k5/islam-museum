label:
  ar: صيام رمضان
  en: Fasting in Ramadan
summary:
  ar: صيام شهر رمضان، وهو الركن الرابع من أركان الإسلام عند دائرة المعارف الإسلامية؛ فرضه القرآن ببيان أن الشهر الذي أُنزل فيه القرآن يصومه من شهده، وللمريض والمسافر عدة من أيام أخر. وتعرض المقالة أحكامه عند الشافعية من نية وإمساك عن المفطرات وقضاء وكفارة ورخص، وصوم التطوع، ومخالفات الشيعة في التفاصيل، ومعنى الصيام عند الغزالي.
  en: Fasting through the month of Ramadan, called the fourth pillar of Islam by the Encyclopaedia of Islam; the Qur'an prescribes it and says that whoever witnesses the month should fast it, with a number of other days for the sick and the traveller. The article sets out its law in the Shafi'i school, covering intention, abstinence, making up days, compensation and relaxations, then voluntary fasting, the Shi'i differences of detail, and al-Ghazali's view of the fast's meaning.
  ur: ماہِ رمضان کا روزہ، جسے انسائیکلوپیڈیا آف اسلام اسلام کا چوتھا رکن کہتی ہے؛ قرآن نے اسے فرض کیا اور بتایا کہ جو اس مہینے کو پائے وہ روزہ رکھے، اور بیمار و مسافر کے لیے دوسرے دنوں کی گنتی ہے۔ مضمون شافعی مذہب میں اس کے احکام بیان کرتا ہے، یعنی نیت، مفطرات سے پرہیز، قضا، کفارہ اور رخصتیں، پھر نفلی روزہ، شیعی تفصیلی اختلافات، اور غزالی کے نزدیک روزے کا مفہوم۔
