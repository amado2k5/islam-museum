education:
  did_you_know:
    ar: "أُعفي من صيام رمضان المريضُ والمسافر على أن يقضيا ما فاتهما، وكانت رخصة الفطر للمسافر قبل الأمر بالإمساك."
    en: "The sick and the traveller are excused from Ramadan's fast on condition of making it up; the travel concession came before the command itself."
