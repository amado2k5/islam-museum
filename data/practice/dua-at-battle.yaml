id: practice/dua-at-battle
class: practice
kind: ritual
label:
  ar: "الدعاء عند القتال"
  en: "Supplication at battle"
  ur: "لڑائی کے وقت کی دعا"
  es: "Súplica en la batalla"
  fr: "Supplication au combat"
  tr: "Çatışma sırasında dua"
  id: "Doa saat bertarung"
summary:
  ar: "ما أورده النووي في أول «كتاب أذكار الجهاد» من «الأذكار»: سؤال الشهادة بصدق، ودعاء النبي لأصحابه يوم الخندق، ومناشدته ربه في العريش كما في الصحيحين. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  en: "What al-Nawawi gives at the head of the Book of the Remembrances of the Campaign in al-Adhkar: asking sincerely for martyrdom, the Prophet's supplication for his Companions at the digging of the Trench, and his pleading with his Lord in the shelter, as in the two Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  ur: "جو نووی نے «الاذکار» کی «کتاب اذکار الجہاد» کے شروع میں ذکر کیا: صدق کے ساتھ شہادت کا سوال، خندق کے دن نبی کی اپنے اصحاب کے لیے دعا، اور سائبان میں اپنے رب سے ان کی التجا جیسا کہ صحیحین میں ہے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  es: "Lo que al-Nawawi ofrece al comienzo del Libro de los Recuerdos de la Campaña en al-Adhkar: la sincera petición del martirio, la súplica del Profeta por sus Compañeros al cavar la trinchera y su ruego a su Señor en el refugio, como en los dos Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  fr: "Ce qu'al-Nawawi rapporte en tête du Livre des Souvenirs de la Campagne dans al-Adhkar: la demande sincère du martyre, la supplication du Prophète pour ses Compagnons lors du creusement du Fossé, et son appel à son Seigneur dans l'abri, comme dans les deux Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  tr: "El-Nawavi'nin 'Adhkar'dan 'Cihad Anma Kitabı'nın başında bahsettikleri: şehitliğin samimi sorgulaması, Peygamber'in Hendek Günü'nde sahabeleri için duası ve iki Sahih'te olduğu gibi El-Ariş'te Rab'be duası. {cite:al-adhkar-nawawi-arnaut-1994 s. 206}"
  id: "Apa yang disebutkan al-Nawawi di awal 'Kitab Kenangan Jihad' dari 'Adhkar': pertanyaan tulus tentang syahid, doa Nabi untuk sahabatnya pada Hari Parit, dan doanya kepada Tuhannya dalam Al-Arish, seperti dalam dua Sahih. {cite:al-Adhkar-Nawawi-Arnaut-1994 hlm. 206}"
