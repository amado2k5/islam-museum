id: practice/dua-at-battle
class: practice
kind: ritual
label:
  ar: "الدعاء عند القتال"
  en: "Supplication at battle"
  ur: "لڑائی کے وقت کی دعا"
summary:
  ar: "ما أورده النووي في أول «كتاب أذكار الجهاد» من «الأذكار»: سؤال الشهادة بصدق، ودعاء النبي لأصحابه يوم الخندق، ومناشدته ربه في العريش كما في الصحيحين. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  en: "What al-Nawawi gives at the head of the Book of the Remembrances of the Campaign in al-Adhkar: asking sincerely for martyrdom, the Prophet's supplication for his Companions at the digging of the Trench, and his pleading with his Lord in the shelter, as in the two Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
  ur: "جو نووی نے «الاذکار» کی «کتاب اذکار الجہاد» کے شروع میں ذکر کیا: صدق کے ساتھ شہادت کا سوال، خندق کے دن نبی کی اپنے اصحاب کے لیے دعا، اور سائبان میں اپنے رب سے ان کی التجا جیسا کہ صحیحین میں ہے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 206}"
