summary:
  ar: "صناعة الزجاج من القرن السابع إلى الثاني عشر في البلاد الإسلامية، التي تحولت من زجاج النطرون في مراكز مصر والشام القديمة إلى زجاج رماد النباتات، وتعددت مراكزها وصغر حجم إنتاجها، واستعمل الزجاج في الأواني وزخارف العمارة كالفسيفساء والبلاطات {cite:schibille-islamic-glass-2022 p. 20} {cite:schibille-islamic-glass-2022 p. 22}."
  en: "Glass production in Islamic lands from the seventh to the twelfth century, which moved from natron glass in the old Egyptian and Levantine centres to plant-ash glass, with more and smaller primary centres, glass serving for vessels and architectural decoration such as mosaics and tiles {cite:schibille-islamic-glass-2022 p. 20} {cite:schibille-islamic-glass-2022 p. 22}."
  ur: "ساتویں سے بارہویں صدی تک اسلامی ممالک میں شیشہ سازی، جو مصر و شام کے قدیم مراکز کے نیٹرون شیشے سے پودوں کی راکھ والے شیشے کی طرف گئی؛ مراکز بڑھے اور پیداوار چھوٹی ہوئی؛ شیشہ برتنوں اور پچی کاری و ٹائلوں جیسی تعمیری آرائش میں استعمال ہوا {cite:schibille-islamic-glass-2022 p. 20}."
