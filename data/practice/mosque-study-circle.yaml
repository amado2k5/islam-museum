label:
  ar: الحلقة العلمية في المسجد
  en: The study circle in the mosque
  es: "El círculo de estudio en la mezquita"
  fr: "Le cercle d'étude dans la mosquée"
  ur: "مسجد میں اسٹڈی سرکل"
  tr: "Camiideki Bilimsel Çember"
  id: "Lingkaran Ilmiah di Masjid"
summary:
  ar: "جلوس المعلّم وحوله الطلبة في ساحة المسجد لتلاوة القرآن وشرح الحديث والفقه؛ كانت المساجد الكبرى مدارس الإسلام الأولى، وفي مكة والمدينة تبدأ بمجالس الصحابة وتمتد إلى موسم الحج."
  en: "Teacher and students sitting in the mosque courtyard to recite the Qur'an and explain hadith and jurisprudence; the great mosques were the first schools of Islam, and in Mecca and Medina the circles began with the Companions and ran into the season of the Hajj."
  es: "Maestros y alumnos sentados en el patio de la mezquita recitando el Corán y explicando hadices y jurisprudencia; las grandes mezquitas fueron las primeras escuelas del Islam, y en La Meca y Medina los círculos comenzaron con los Compañeros y se extendieron hasta la temporada del Hajj."
  fr: "Enseignants et élèves assis dans la cour de la mosquée pour réciter le Coran et expliquer les hadiths et la jurisprudence; les grandes mosquées furent les premières écoles de l'islam, et à La Mecque et à Médine, les cercles commencèrent avec les Compagnons et se prolongèrent jusqu'à la saison du Hajj."
  ur: "استاد اور طلباء مسجد کے صحن میں قرآن کی تلاوت کرنے اور حدیث اور فقہ کی وضاحت کرنے کے لیے بیٹھے ہوئے ہیں۔ عظیم مساجد اسلام کی پہلی درسگاہیں تھیں، اور مکہ اور مدینہ میں حلقے صحابہ کے ساتھ شروع ہوئے اور حج کے موسم میں چلے گئے۔"
  tr: "Öğretmen, öğrencilerle birlikte cami avlusunda oturtulup Kur'an okunuyor, hadis açıklıyor ve fıkıh anlıyordu; büyük camiler İslam'ın en eski okullarıydı ve Mekke ile Medine'de sahabelerin toplantılarıyla başlayıp Hac mevsimine kadar uzanıyordu."
  id: "Guru duduk bersama murid-murid di halaman masjid untuk membaca Al-Qur'an, menjelaskan hadis, dan memahami firisprudensi; masjid utama adalah mazhab Islam paling awal, dan di Mekah serta Madinah, mereka dimulai dengan pertemuan para Sahabat dan berlanjut hingga musim Haji."
