summary:
  ar: "ما جمعه النووي في أبواب أذان المغرب وبعد صلاة المغرب وصلاة الوتر: دعاء سماع الأذان، والتهليل عشرا، وما يقرأ في الوتر وما يقال بعد السلام وفي آخره. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  en: "What al-Nawawi gathers in the chapters on the sunset call, after the sunset prayer and the witr prayer: the wording at the call, ten tahlils, what is recited in witr and what is said after its greeting and at its end. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  ur: "اذان مغرب، نماز مغرب کے بعد اور نماز وتر کے ابواب میں نووی نے جو جمع کیا: اذان پر دعا، دس بار تہلیل، وتر میں کیا پڑھا جائے اور اس کے سلام کے بعد اور آخر میں کیا کہا جائے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
