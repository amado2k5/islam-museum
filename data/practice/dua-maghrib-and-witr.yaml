id: practice/dua-maghrib-and-witr
class: practice
kind: ritual
label:
  ar: "المغرب والوتر"
  en: "The sunset prayer and the witr prayer"
  ur: "مغرب اور وتر"
  es: "La oración del atardecer y la oración del witr"
  fr: "La prière du coucher du soleil et la prière de Witr"
summary:
  ar: "ما جمعه النووي في أبواب أذان المغرب وبعد صلاة المغرب وصلاة الوتر: دعاء سماع الأذان، والتهليل عشرا، وما يقرأ في الوتر وما يقال بعد السلام وفي آخره. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  en: "What al-Nawawi gathers in the chapters on the sunset call, after the sunset prayer and the witr prayer: the wording at the call, ten tahlils, what is recited in witr and what is said after its greeting and at its end. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  ur: "اذان مغرب، نماز مغرب کے بعد اور نماز وتر کے ابواب میں نووی نے جو جمع کیا: اذان پر دعا، دس بار تہلیل، وتر میں کیا پڑھا جائے اور اس کے سلام کے بعد اور آخر میں کیا کہا جائے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  es: "Lo que al-Nawawi recopila en los capítulos sobre la llamada a la puesta del sol, después de la oración de la puesta del sol y la oración del witr: la formulación de la llamada, los diez tahlils, lo que se recita en el witr y lo que se dice después de su saludo y al final del mismo. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
  fr: "Dans les chapitres consacrés à l'appel au coucher du soleil, à la prière après le coucher du soleil et à la prière du witr, al-Nawawi rassemble les éléments suivants: les paroles de l'appel, les dix tahlils, les invocations du witr, ainsi que les formules prononcées après la salutation et à la fin de la prière. {cite:al-adhkar-nawawi-arnaut-1994 p. 88}"
