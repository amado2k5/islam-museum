summary:
  ar: "ما يدعى به إذا صودفت ليلة القدر كما أورده النووي في «الأذكار»: حديث عائشة «اللهم إنك عفو تحب العفو فاعف عني» من كتب الترمذي والنسائي وابن ماجه. {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
  en: "What is asked on the Night of Power, as al-Nawawi gives it in al-Adhkar: Aisha's report, «اللهم إنك عفو تحب العفو فاعف عني», from the books of al-Tirmidhi, al-Nasa'i and Ibn Majah. {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
  ur: "شبِ قدر مل جائے تو کیا دعا کی جائے، جیسا کہ نووی نے «الاذکار» میں ذکر کیا: عائشہ کی روایت «اللهم إنك عفو تحب العفو فاعف عني» ترمذی، نسائی اور ابن ماجہ کی کتابوں سے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 191}"
