id: practice/ziyarat-al-qubur
class: practice
kind: custom
label:
  ar: زيارة القبور
  en: Visiting graves
  es: "Visitar tumbas"
  fr: "Visiter les tombes"
  ur: "قبروں کی زیارت کرنا"
  tr: "Mezarları ziyaret etmek"
  id: "Mengunjungi makam"
summary:
  ar: "زيارة المقابر للدعاء والتذكر؛ أباحها النبي بعد أن نهى عنها أولًا، وتختلف الأعراف فيها بين البلدان — وفي بعضها تجاوزات ينكرها العلماء."
  en: "Visiting graveyards for prayer and remembrance; permitted by the Prophet after an earlier prohibition, with practices that differ by country — some forms scholars reject."
  es: "Visitar cementerios para orar y recordar; permitido por el Profeta después de una prohibición anterior, con prácticas que difieren según el país; algunos estudiosos rechazan algunas formas."
  fr: "La visite des cimetières pour la prière et le recueillement; autorisée par le Prophète après une interdiction antérieure, avec des pratiques qui diffèrent selon les pays — certaines formes sont rejetées par les érudits."
  ur: "نماز اور ذکر کے لیے قبرستان جانا؛ پہلے کی ممانعت کے بعد نبی کی طرف سے اجازت دی گئی، ان طریقوں کے ساتھ جو ملک کے لحاظ سے مختلف ہیں - کچھ شکلیں علماء مسترد کرتے ہیں۔"
  tr: "Peygamber, mezarları ilk kez yasakladıktan sonra dua ve anma için ziyaret etmeye izin vermiştir ve ülkeler arasında gelenekler farklılık gösterir — bazılarında alimler tarafından reddedilen ihlaller vardır."
  id: "Mengunjungi makam untuk memohon dan mengenang diizinkan oleh Nabi setelah ia pertama kali melarangnya, dan adat istiadat berbeda antar negara — beberapa memiliki pelanggaran yang dibantah oleh para ulama."
