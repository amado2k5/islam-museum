id: practice/dua-friday-dawn-and-sunrise
class: practice
kind: ritual
label:
  ar: "صباح الجمعة وعند طلوع الشمس"
  en: "Friday morning and sunrise"
  ur: "جمعہ کی صبح اور طلوع آفتاب"
summary:
  ar: "ما جمعه النووي في بابي صبيحة الجمعة وطلوع الشمس: كثرة الذكر والصلاة على النبي يوم الجمعة، والاستغفار قبل الصبح، وساعة الإجابة، وما يقال إذا طلعت الشمس. {cite:al-adhkar-nawawi-arnaut-1994 p. 85}"
  en: "What al-Nawawi gathers in the chapters on Friday morning and sunrise: more remembrance and blessing on the Prophet on Fridays, seeking forgiveness before the dawn prayer, the hour of answer, and what is said when the sun rises. {cite:al-adhkar-nawawi-arnaut-1994 p. 85}"
  ur: "جمعہ کی صبح اور طلوع آفتاب کے ابواب میں نووی نے جو جمع کیا: جمعہ کے دن ذکر اور نبی پر درود کی کثرت، فجر سے پہلے استغفار، قبولیت کی گھڑی، اور سورج نکلنے پر کیا کہا جائے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 85}"
