label:
  ar: "خاتمة كتاب الاستغفار والأحاديث التي مدار الإسلام عليها"
  en: "The close of the Book of Forgiveness and the hadiths on which Islam turns"
  ur: "کتاب الاستغفار کا اختتام اور وہ احادیث جن پر اسلام کا مدار ہے"
  es: "El final del Libro del Perdón y los hadices en los que se basa el Islam"
summary:
  ar: "ما أورده النووي في آخر «كتاب الاستغفار» من أقوال في الاستغفار، والنهي عن صمت يوم إلى الليل، وما ضمه إلى الكتاب من الأحاديث التي عليها مدار الإسلام. {cite:al-adhkar-nawawi-arnaut-1994 p. 405}"
  en: "What al-Nawawi gathers at the end of the Book of Forgiveness: sayings on asking forgiveness, the prohibition of a whole day's silence, and the hadiths on which Islam turns, which he appends to the book. {cite:al-adhkar-nawawi-arnaut-1994 p. 405}"
  ur: "جو نووی نے «کتاب الاستغفار» کے آخر میں جمع کیا: استغفار کے بارے میں اقوال، پورے دن کی خاموشی کی ممانعت، اور وہ احادیث جن پر اسلام کا مدار ہے اور جو انھوں نے کتاب کے ساتھ شامل کیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 405}"
  es: "Lo que al-Nawawi reúne al final del Libro del Perdón: dichos sobre pedir perdón, la prohibición de guardar silencio durante todo un día y los hadices en los que se basa el Islam, que añade al libro. {cite:al-adhkar-nawawi-arnaut-1994 p. 405}"
