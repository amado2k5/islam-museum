id: practice/dua-in-prayer-taawwudh-and-fatiha
class: practice
kind: ritual
label:
  ar: "التعوذ والفاتحة في الصلاة"
  en: "Seeking refuge and reciting the Fatiha in the prayer"
  ur: "نماز میں تعوذ اور سورۂ فاتحہ"
  es: "Buscar refugio y recitar la Fatiha en la oración"
  fr: "Chercher refuge et réciter la Fatiha dans la prière"
summary:
  ar: "ما جمعه النووي في بابي التعوذ بعد دعاء الاستفتاح ومطلع باب القراءة: صيغة التعوذ وما ورد فيها، ثم وجوب الفاتحة وما يتعلق بها. {cite:al-adhkar-nawawi-arnaut-1994 p. 45}"
  en: "What al-Nawawi gathers in the chapter on seeking refuge after the opening supplication and the start of the chapter on recitation: the wording of the refuge and what is reported on it, then the Fatiha as a required recitation. {cite:al-adhkar-nawawi-arnaut-1994 p. 45}"
  ur: "جو نووی نے دعائے استفتاح کے بعد تعوذ کے باب اور قرأت کے باب کے آغاز میں جمع کیا: تعوذ کے الفاظ اور اس میں وارد روایت، پھر فاتحہ کی لازمی قرأت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 45}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre la búsqueda de refugio después de la súplica inicial y el comienzo del capítulo sobre la recitación: la formulación del refugio y lo que se ha narrado al respecto, y luego la Fatiha como recitación obligatoria. {cite:al-adhkar-nawawi-arnaut-1994 p. 45}"
  fr: "Dans le chapitre consacré à la recherche de refuge après l'invocation initiale et au début du chapitre sur la récitation, al-Nawawi rassemble: le libellé de la demande de refuge et ce qui est rapporté à ce sujet, puis la Fatiha comme récitation obligatoire. {cite:al-adhkar-nawawi-arnaut-1994 p. 45}"
