id: practice/dua-hard-matters-livelihood-debt
class: practice
kind: ritual
label:
  ar: "ما يقال عند الأمر الغالب وعسر المعيشة والدين"
  en: "When a matter overcomes one, in hard livelihood and in debt"
  ur: "جب کوئی معاملہ غالب آئے، معاش تنگ ہو اور قرض ہو"
  es: "Cuando una situación te supera, en medio de una vida difícil y endeudado."
  fr: "Quand une situation vous submerge, dans une vie difficile et endettée."
summary:
  ar: "ما جمعه النووي من أبواب الضيق: ما يقال إذا غلبه أمر أو استصعب عليه، وعند عسر المعيشة ودفع الآفات والمصيبة والدين والوحشة. {cite:al-adhkar-nawawi-arnaut-1994 p. 125}"
  en: "What al-Nawawi gathers for times of strain: what is said when a matter overcomes a person or proves hard, in hard livelihood, to ward off afflictions, in calamity, in debt and in loneliness. {cite:al-adhkar-nawawi-arnaut-1994 p. 125}"
  ur: "نووی نے تنگی کے احوال کے ابواب میں جو جمع کیا: جب کوئی معاملہ غالب آئے یا دشوار ہو، معاش تنگ ہو، آفات سے بچاؤ ہو، مصیبت ہو، قرض ہو اور وحشت ہو۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 125}"
  es: "Lo que Al-Nawawi recopila para momentos de tensión: lo que se dice cuando una situación abruma a una persona o resulta difícil, en tiempos de penuria, para alejar las aflicciones, en la calamidad, en las deudas y en la soledad. {cite:al-adhkar-nawawi-arnaut-1994 p. 125}"
  fr: "Ce qu'al-Nawawi rassemble pour les moments difficiles: les paroles prononcées lorsqu'une épreuve accable une personne ou se révèle ardue, en cas de pénibilité du travail, pour conjurer les afflictions, en cas de calamité, d'endettement et de solitude. {cite:al-adhkar-nawawi-arnaut-1994 p. 125}"
