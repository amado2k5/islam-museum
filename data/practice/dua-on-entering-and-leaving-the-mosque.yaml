id: practice/dua-on-entering-and-leaving-the-mosque
class: practice
kind: ritual
label:
  ar: "الدعاء عند دخول المسجد والخروج منه"
  en: "Supplication on entering and leaving the mosque"
  ur: "مسجد میں داخل ہونے اور نکلنے کی دعا"
summary:
  ar: "ما يقال عند دخول المسجد والخروج منه كما جمعه النووي في «الأذكار»: سؤال أبواب الرحمة عند الدخول والفضل عند الخروج من صحيح مسلم والسنن، والاستعاذة التي رواها أبو داود. {cite:al-adhkar-nawawi-arnaut-1994 p. 31}"
  en: "What is said on entering and leaving the mosque, as al-Nawawi gathers it in al-Adhkar: asking for the gates of mercy on entering and for God's bounty on leaving, from Sahih Muslim and the Sunan, and the plea for refuge related by Abu Dawud. {cite:al-adhkar-nawawi-arnaut-1994 p. 31}"
  ur: "مسجد میں داخل ہوتے اور نکلتے وقت کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں جمع کیا: داخل ہوتے وقت رحمت کے دروازوں اور نکلتے وقت فضل کا سوال صحیح مسلم اور سنن سے، اور ابو داود کا روایت کردہ استعاذہ۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 31}"
