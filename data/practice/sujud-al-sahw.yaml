id: practice/sujud-al-sahw
class: practice
kind: ritual
label: { ar: "سجود السهو", en: "Prostrations of forgetfulness (sujud al-sahw)", ur: "سجدۂ سہو" }
summary:
  ar: "سجود السهو سجدتان يسجدهما المصلي لما يقع في صلاته من زيادة أو نقص أو شك؛ عقد له أبو داود أبواباً تبدأ بـ«باب السهو في السجدتين» وفيه حديث ذي اليدين، ثم أبواب من صلى خمساً، ومن شك في الثنتين والثلاث، ومن قام من ثنتين ولم يتشهد؛ ويحكي الخطابي أن مذاهب الفقهاء تشعّبت على أحاديث ابن مسعود وأبي سعيد الخدري وذي اليدين وابن بحينة: فأصحاب الرأي يسجدون بعد السلام، ومالك قبله للنقص وبعده للزيادة، وأحمد يستعمل كل حديث في موضعه، والشافعي يرد المجمل إلى حديث أبي سعيد فيسجد قبل السلام {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 427-438}."
  en: "The prostrations of forgetfulness are two prostrations a worshipper makes for an addition, omission or doubt in the prayer; Abu Dawud gives them a run of chapters beginning with 'forgetfulness in the two prostrations', which holds the report of Dhu al-Yadayn, then chapters on one who prays five units, one who doubts between two and three, and one who rises after two without the testimony; al-Khattabi relates that the schools branched out over the reports of Ibn Mas'ud, Abu Sa'id al-Khudri, Dhu al-Yadayn and Ibn Buhayna: the Hanafis prostrate after the salam, Malik before it for an omission and after it for an addition, Ahmad uses each report in its own case, and al-Shafi'i reads the general reports through Abu Sa'id's and prostrates before the salam {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 427-438}."
  ur: "سجدۂ سہو وہ دو سجدے ہیں جو نمازی نماز میں کمی، زیادتی یا شک پر کرتا ہے؛ ابو داؤد نے اس کے ابواب «دو سجدوں میں سہو» سے شروع کیے، جس میں ذو الیدین کی حدیث ہے، پھر جس نے پانچ رکعتیں پڑھیں، جسے دو اور تین میں شک ہوا، اور جو دو رکعت پر تشہد کیے بغیر کھڑا ہو گیا؛ خطابی بتاتے ہیں کہ فقہا کے مذاہب ابن مسعود، ابو سعید خدری، ذو الیدین اور ابن بحینہ کی احادیث پر بٹ گئے: اصحاب الرائے سلام کے بعد سجدہ کرتے ہیں، مالک کمی کے لیے سلام سے پہلے اور زیادتی کے لیے بعد، احمد ہر حدیث کو اس کے موقع پر استعمال کرتے ہیں، اور شافعی مجمل کو ابو سعید کی حدیث کی طرف لوٹا کر سلام سے پہلے سجدہ کرتے ہیں {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 427-438}۔"
basis:
  - { tradition: sunni, value: prophetic-practice }
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-after-salam
    standing: main
    stance: { ar: "يتحرى ويسجد بعد السلام", en: "One weighs the likelier case and prostrates after the salam" }
    summary: { ar: "على حديث ابن مسعود: يتحرى في صلاته ويسجد سجدتين بعد السلام، والتحري عندهم غالب الظن وأكبر الرأي؛ وهذا إذا كان الشك يعتريه مرة بعد أخرى، فإن كان أول ما سها فعليه عندهم أن يستأنف الصلاة. ويرى أصحاب الرأي أن الكلام في الصلاة ناسياً يقطعها كالعمل.", en: "On Ibn Mas'ud's report: one weighs the matter in his prayer and makes two prostrations after the salam, weighing meaning for them the stronger likelihood; this applies to one who is often beset by doubt, whereas one doubting for the first time must, in their view, start the prayer again. The Hanafis also hold that speaking in prayer by mistake breaks it, like any action." }
    holders: [person/abu-hanifa]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-maliki
    id: maliki-before-omission-after-addition
    standing: main
    stance: { ar: "قبل السلام للنقص، وبعده للزيادة", en: "Before the salam for an omission, after it for an addition" }
    summary: { ar: "اعتبر مالك حديثي ذي اليدين وابن بحينة جميعاً: فإن كان السهو زيادة في صلب الصلاة سجد بعد السلام، لأن في خبر ذي اليدين أن النبي سلّم عن ثنتين وهو زيادة؛ وإن كان نقصاً سجد قبل السلام، لأن في حديث ابن بحينة أنه قام عن ثنتين ولم يتشهد. ويُحكى عن الماجشون صاحب مالك ومعه الأوزاعي أن لكل سهو سجدتين.", en: "Malik took both the report of Dhu al-Yadayn and that of Ibn Buhayna into account: for an addition within the prayer he prostrated after the salam, since in Dhu al-Yadayn's report the Prophet gave the salam after two units, which is an addition; for an omission, before the salam, since in Ibn Buhayna's report he rose after two without the testimony. Al-Majishun, Malik's companion, and al-Awza'i are reported to have held that each lapse requires its own two prostrations." }
    holders: [person/malik-ibn-anas]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-hanbali
    id: hanbali-each-in-its-place
    standing: main
    stance: { ar: "كل حديث يُستعمل في موضعه", en: "Each report is used in its own case" }
    summary: { ar: "ذهب أحمد إلى أن كل حديث منها يُتأمل صفته ويُستعمل في موضعه ولا يُحمل على الخلاف: فمن رجع إلى اليقين ألقى الشك وسجد قبل السلام على حديث أبي سعيد، ومن رجع إلى التحري سجد بعد التسليم على حديث ابن مسعود.", en: "Ahmad held that each report is examined for its circumstances and applied in its own case rather than treated as conflicting: one who falls back on certainty discards the doubt and prostrates before the salam, following Abu Sa'id's report; one who falls back on weighing the likelier case prostrates after the salam, following Ibn Mas'ud's." }
    holders: [person/ahmad-ibn-hanbal]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-shafii
    id: shafii-before-salam
    standing: main
    stance: { ar: "يبني على اليقين ويسجد قبل السلام", en: "One builds on certainty and prostrates before the salam" }
    summary: { ar: "مذهب الشافعي الجمع بين الأخبار ورد المجمل منها إلى المفسّر، والتفسير في حديث أبي سعيد «فليلق الشك وليبن على اليقين… ويسجد سجدتين وهو جالس قبل السلام»، لأن فيه زيادات حفظها أبو سعيد وقبول الزيادة واجب؛ والتحري في حديث ابن مسعود عند أصحابه هو البناء على اليقين؛ ويُحمل سجوده بعد السلام في خبر ذي اليدين على السهو. ويحكي الخطابي عن الزهري أن تقديم السجود قبل السلام آخر الأمرين.", en: "Al-Shafi'i reconciles the reports by reading the general ones through the explicit one, Abu Sa'id's: 'let him discard the doubt and build on what is certain… and make two prostrations sitting, before the salam', since it holds details Abu Sa'id preserved and an added detail must be accepted; for his followers the weighing in Ibn Mas'ud's report means building on certainty, and the prostration after the salam in Dhu al-Yadayn's report is put down to forgetfulness. Al-Khattabi relates from al-Zuhri that prostrating before the salam was the later practice." }
    holders: [person/al-shafii, person/abu-sulayman-al-khattabi]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
