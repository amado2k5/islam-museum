label:
  ar: "الصلاة على النبي والدعاء بعد التشهد"
  en: "The blessing on the Prophet and the supplication after the last tashahhud"
  ur: "تشہد کے بعد درود اور دعا"
  es: "La bendición sobre el Profeta y la súplica después del último tashahhud"
  fr: "La bénédiction sur le Prophète et l'invocation après le dernier tashahhud"
  tr: "Peygamber'e bereket göndermek ve Taşahhud'dan sonra dua etmek"
  id: "Mengirimkan berkat kepada Nabi dan doa setelah Tashahhud"
summary:
  ar: "ما جمعه النووي في بابي الصلاة على النبي بعد التشهد والدعاء بعد التشهد الأخير: أفضل صيغة، والاستعاذات والأدعية المروية في الصحيحين ومسلم. {cite:al-adhkar-nawawi-arnaut-1994 p. 66}"
  en: "What al-Nawawi gathers in the chapters on the blessing on the Prophet after the tashahhud and on the supplication after the last tashahhud: the best form, and the refuges and supplications from the two Sahihs and Muslim. {cite:al-adhkar-nawawi-arnaut-1994 p. 66}"
  ur: "جو نووی نے تشہد کے بعد نبی پر درود اور آخری تشہد کے بعد دعا کے ابواب میں جمع کیا: افضل صورت، اور صحیحین اور مسلم کی پناہیں اور دعائیں۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 66}"
  es: "Lo que al-Nawawi reúne en los capítulos sobre la bendición del Profeta después del tashahhud y sobre la súplica después del último tashahhud: la mejor forma, y los refugios y súplicas de los dos Sahihs y Muslim. {cite:al-adhkar-nawawi-arnaut-1994 p. 66}"
  fr: "Dans les chapitres consacrés à la bénédiction sur le Prophète après le tashahhud et à l'invocation après le dernier tashahhud, al-Nawawi rassemble les éléments suivants: la meilleure forme de bénédiction, ainsi que les invocations et les recours tirés des deux Sahihs et de Muslim. {cite:al-adhkar-nawawi-arnaut-1994 p. 66}"
  tr: "El-Nevavi'nin Peygamber'e Taşahhud'dan sonra bereket gönderme ve son Taşahhud'dan sonra dua etme bölümlerinde derlediği şeyler: en iyi formül, iki Sahih ve Müslüman'da anlatılan sığınak arama ve dualar. {Cite:al-Adhkar-Nawawi-Arnaut-1994 s. 66}"
  id: "Apa yang dikumpulkan al-Nawawi dalam bab-bab mengirimkan berkat kepada Nabi setelah Tashahhud dan doa setelah Tashahhud terakhir: rumus terbaik, serta pencarian perlindungan dan permohonan yang diceritakan dalam dua Sahih dan Muslim. {Sitasi: al-Adhkar-Nawawi-Arnaut-1994 hlm. 66}"
