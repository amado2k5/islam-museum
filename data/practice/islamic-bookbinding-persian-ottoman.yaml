summary:
  ar: "تجليد المخطوطات في إيران وتركيا والهند: لسان مثلث يطوى على حافة الأوراق، وزخارف مضغوطة ومذهبة، وبطانات داخلية بالتخريم الورقي الملون، والأغلفة الملكية المؤرخة، والأغلفة المطلية بالورنيش التي بدأت في هراة على عهد السلطان حسين {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  en: "Manuscript binding in Iran, Turkey and India: the triangular fore-edge flap, tooled and gilt stamped covers, filigree doublures of coloured paper, dated royal covers, and painted lacquer covers first made at Herat under Sultan Husayn {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  ur: "ایران، ترکی اور ہند میں مخطوطات کی جلد سازی: اوراق پر لپیٹنے والا مثلث نما فلیپ، ٹھپے دار اور مطلا جلدیں، رنگین کاغذ کی جالی دار اندرونی جلدیں، مؤرخ شاہی جلدیں، اور روغنی جلدیں جو سلطان حسین کے ہرات میں شروع ہوئیں {cite:titley-persian-miniature-painting-1983 p. 247}."
  es: "Encuadernación de manuscritos en Irán, Turquía e India: la solapa triangular del borde delantero, cubiertas repujadas y estampadas en oro, dobles de filigrana de papel de color, cubiertas reales fechadas y cubiertas lacadas pintadas, realizadas por primera vez en Herat bajo el sultán Husayn {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  fr: "Reliure de manuscrits en Iran, en Turquie et en Inde: le rabat triangulaire sur le bord avant, les couvertures estampées et dorées, les doublures en filigrane de papier coloré, les couvertures royales datées et les couvertures en laque peinte réalisées pour la première fois à Hérat sous le sultan Hussein {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  tr: "İran, Türkiye ve Hindistan'da el yazması cilt: yaprakların kenarına katlanan üçgen dil, sıkıştırılmış ve altın kaplama süslemeler, renkli kağıt delikli iç astarlar, tarihli kraliyet kapakları ve vernik kaplı kapaklar, Sultan Hüseyin döneminde Herat'ta başlayan {cite:titley-persian-miniature-painting-1983 s. 245} {cite:titley-persian-miniature-painting-1983 s. 247}."
  id: "Penjilidan manuskrip di Iran, Turki, dan India: lidah segitiga yang melipat di tepi daun, dekorasi yang dipadatkan dan berlapis emas, lapisan dalam dengan perforasi kertas berwarna, sampul kerajaan yang bertanggal, dan sampul berlapis pernis yang dimulai di Herat pada masa pemerintahan Sultan Hussein {cite:titley-persian-miniature-painting-1983 hlm. 245} {cite:titley-persian-miniature-painting-1983 hlm. 247}."
