summary:
  ar: "تجليد المخطوطات في إيران وتركيا والهند: لسان مثلث يطوى على حافة الأوراق، وزخارف مضغوطة ومذهبة، وبطانات داخلية بالتخريم الورقي الملون، والأغلفة الملكية المؤرخة، والأغلفة المطلية بالورنيش التي بدأت في هراة على عهد السلطان حسين {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  en: "Manuscript binding in Iran, Turkey and India: the triangular fore-edge flap, tooled and gilt stamped covers, filigree doublures of coloured paper, dated royal covers, and painted lacquer covers first made at Herat under Sultan Husayn {cite:titley-persian-miniature-painting-1983 p. 245} {cite:titley-persian-miniature-painting-1983 p. 247}."
  ur: "ایران، ترکی اور ہند میں مخطوطات کی جلد سازی: اوراق پر لپیٹنے والا مثلث نما فلیپ، ٹھپے دار اور مطلا جلدیں، رنگین کاغذ کی جالی دار اندرونی جلدیں، مؤرخ شاہی جلدیں، اور روغنی جلدیں جو سلطان حسین کے ہرات میں شروع ہوئیں {cite:titley-persian-miniature-painting-1983 p. 247}."
