id: practice/dua-after-the-prayer
class: practice
kind: ritual
label:
  ar: "الأذكار بعد الصلاة"
  en: "Remembrances after the prayer"
  ur: "نماز کے بعد کے اذکار"
  es: "Recuerdos después de la oración"
  fr: "Souvenirs après la prière"
summary:
  ar: "ما جمعه النووي في أول «باب الأذكار بعد الصلاة»: إجماع العلماء على استحباب الذكر بعد الصلاة، والتكبير ورفع الصوت، والاستغفار، والتهليل، والتسبيح والتحميد والتكبير ثلاثا وثلاثين، والتعوذ. {cite:al-adhkar-nawawi-arnaut-1994 p. 70}"
  en: "What al-Nawawi gathers at the start of the chapter on remembrances after the prayer: the scholars' agreement that remembrance after the prayer is recommended, the takbir and raised voice, the seeking of forgiveness, the declaration of oneness, the thirty-three glorifications, praises and takbirs, and the seeking of refuge. {cite:al-adhkar-nawawi-arnaut-1994 p. 70}"
  ur: "جو نووی نے «نماز کے بعد کے اذکار» کے باب کے شروع میں جمع کیا: نماز کے بعد ذکر کے مستحب ہونے پر علما کا اجماع، تکبیر اور آواز بلند کرنا، استغفار، تہلیل، تینتیس تسبیح و تحمید و تکبیر اور پناہ مانگنا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 70}"
  es: "Lo que al-Nawawi reúne al comienzo del capítulo sobre las reflexiones después de la oración: el consenso de los eruditos sobre la recomendación de reflexionar después de la oración, el takbir y la elevación de la voz, la búsqueda del perdón, la declaración de la unidad, las treinta y tres glorificaciones, alabanzas y takbirs, y la búsqueda de refugio. {cite:al-adhkar-nawawi-arnaut-1994 p. 70}"
  fr: "Au début du chapitre consacré aux invocations après la prière, al-Nawawi rassemble les points suivants: le consensus des savants sur la recommandation de ces invocations, le takbir et l’élévation de la voix, la demande de pardon, la profession de foi, les trente-trois glorifications, louanges et takbirs, et la recherche de refuge. {cite:al-adhkar-nawawi-arnaut-1994 p. 70}"
