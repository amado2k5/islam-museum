summary:
  ar: "طريقة لنقل التكوينات في التصوير الفارسي والمغولي، يُرسم فيها الخط على جلد غزال شفاف ثم يثقب بإبرة ويُذر عليه الفحم، فتتكرر بها الأشكال عبر المدارس والقرون {cite:titley-persian-miniature-painting-1983 p. 215}."
  en: "A method of copying compositions in Persian and Mughal painting: the outline was traced on transparent deerskin, pricked with a needle and dusted with charcoal, so that figures were repeated across schools and centuries {cite:titley-persian-miniature-painting-1983 p. 215}."
  ur: "فارسی اور مغل مصوری میں ترکیبیں نقل کرنے کا طریقہ: خاکہ شفاف ہرن کی کھال پر بنا کر سوئی سے چھیدا جاتا اور کوئلہ چھڑکا جاتا، جس سے شکلیں مکاتب اور صدیوں میں دہرائی گئیں {cite:titley-persian-miniature-painting-1983 p. 215}."
