label: { ar: "النقل بالتثقيب ⁦(البُنس)⁩ في التصوير الفارسي", en: "Pouncing in Persian painting", ur: "فارسی مصوری میں سوراخ دار خاکے سے نقل ⁦(پاؤنسنگ)⁩", es: "El abalanzamiento en la pintura persa", fr: "Le bond dans la peinture persane" }
summary:
  ar: "طريقة لنقل التكوينات في التصوير الفارسي والمغولي، يُرسم فيها الخط على جلد غزال شفاف ثم يثقب بإبرة ويُذر عليه الفحم، فتتكرر بها الأشكال عبر المدارس والقرون {cite:titley-persian-miniature-painting-1983 p. 215}."
  en: "A method of copying compositions in Persian and Mughal painting: the outline was traced on transparent deerskin, pricked with a needle and dusted with charcoal, so that figures were repeated across schools and centuries {cite:titley-persian-miniature-painting-1983 p. 215}."
  ur: "فارسی اور مغل مصوری میں ترکیبیں نقل کرنے کا طریقہ: خاکہ شفاف ہرن کی کھال پر بنا کر سوئی سے چھیدا جاتا اور کوئلہ چھڑکا جاتا، جس سے شکلیں مکاتب اور صدیوں میں دہرائی گئیں {cite:titley-persian-miniature-painting-1983 p. 215}."
  es: "Un método para copiar composiciones en la pintura persa y mogol: el contorno se trazaba sobre piel de ciervo transparente, se pinchaba con una aguja y se espolvoreaba con carbón, de modo que las figuras se repetían a través de las escuelas y los siglos {cite:titley-persian-miniature-painting-1983 p. 215}."
  fr: "Une méthode de copie de compositions dans la peinture persane et moghole: le contour était tracé sur de la peau de daim transparente, piquée avec une aiguille et saupoudrée de charbon de bois, de sorte que les figures étaient répétées à travers les écoles et les siècles {cite:titley-persian-miniature-painting-1983 p. 215}."
