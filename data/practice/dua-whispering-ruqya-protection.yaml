id: practice/dua-whispering-ruqya-protection
class: practice
kind: ritual
label:
  ar: "ما يقال عند الوسوسة وللمعتوه والملدوغ وتعويذ الصبيان"
  en: "Against whispering doubts, over the afflicted and the bitten, and protecting children"
  ur: "وسوسے کے وقت، آسیب زدہ اور ڈسے ہوئے پر اور بچوں کی پناہ"
  es: "Contra las dudas susurrantes, sobre los afligidos y los mordidos, y protegiendo a los niños."
  fr: "Contre les murmures du doute, sur les affligés et les mordus, et en protégeant les enfants"
summary:
  ar: "ما جمعه النووي في الوسوسة والرقية بالفاتحة وما يقرأ على المعتوه والملدوغ وتعويذ الحسن والحسين والدعاء عند الخراج. {cite:al-adhkar-nawawi-arnaut-1994 p. 127}"
  en: "What al-Nawawi gathers on whispering doubts, the recitation over the bitten and the afflicted, the protection recited over al-Hasan and al-Husayn, and a supplication for a boil. {cite:al-adhkar-nawawi-arnaut-1994 p. 127}"
  ur: "نووی نے وسوسے، ڈسے ہوئے اور آسیب زدہ پر قرأت، حسن و حسین کے لیے تعویذ اور پھوڑے پر دعا کے باب میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 127}"
  es: "Lo que al-Nawawi reúne sobre las dudas susurradas, la recitación sobre los mordidos y los afligidos, la protección recitada sobre al-Hasan y al-Husayn, y una súplica para un forúnculo. {cite:al-adhkar-nawawi-arnaut-1994 p. 127}"
  fr: "Ce qu'al-Nawawi rassemble sur les doutes murmurés, la récitation pour les mordus et les affligés, la protection récitée pour al-Hasan et al-Husayn, et une supplication pour un furoncle. {cite:al-adhkar-nawawi-arnaut-1994 p. 127}"
