id: practice/dua-on-guarding-the-tongue-from-backbiting
class: practice
kind: ritual
label:
  ar: "حفظ اللسان وتحريم الغيبة والنميمة"
  en: "Guarding the tongue: backbiting and tale-bearing"
  ur: "زبان کی حفاظت: غیبت اور چغلی"
  es: "Controlar la lengua: la calumnia y el chisme."
  fr: "Préserver sa langue: médisance et délation"
  tr: "Dili koruyup sırtüstü iğnemeyi ve dedikoduyu yasaklamak"
  id: "Menjaga lidah dan melarang cacian dan gosip"
summary:
  ar: "ما أورده النووي في ختام باب فضل الصمت من آثار السلف، وفي باب تحريم الغيبة والنميمة من تعريفهما وحكمهما والأحاديث فيهما. {cite:al-adhkar-nawawi-arnaut-1994 p. 335}"
  en: "What al-Nawawi gathers at the close of the chapter on silence, from the early scholars, and in the chapter on the prohibition of backbiting and tale-bearing: their definitions, their ruling and the reports on them. {cite:al-adhkar-nawawi-arnaut-1994 p. 335}"
  ur: "جو نووی نے خاموشی کے باب کے آخر میں اسلاف کے اقوال سے، اور غیبت و چغلی کی حرمت کے باب میں ان کی تعریف، حکم اور روایات کے بارے میں جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 335}"
  es: "Lo que al-Nawawi recopila al final del capítulo sobre el silencio, de los primeros eruditos, y en el capítulo sobre la prohibición de la calumnia y el chisme: sus definiciones, su dictamen y los informes al respecto. {cite:al-adhkar-nawawi-arnaut-1994 p. 335}"
  fr: "Ce qu'al-Nawawi rassemble à la fin du chapitre sur le silence, d'après les premiers savants, et dans le chapitre sur l'interdiction de la médisance et du calomnie: leurs définitions, leurs décisions et les hadiths s'y rapportant. {cite:al-adhkar-nawawi-arnaut-1994 p. 335}"
  tr: "El-Nawavi'nin, ilk kuşakların geleneklerinden sessizliğin erdemi üzerine bölümün sonunda ve arkadan iğrenmenin ve dedikodunun yasaklanması bölümünün sonunda bunların tanımları, hükümleri ve hadisleri hakkında bahsettikleri. {cite:al-adhkar-nawawi-arnaut-1994 s. 335}"
  id: "Apa yang disebutkan al-Nawawi di akhir bab tentang kebajikan diam dari tradisi generasi awal, dan dalam bab tentang larangan fitnah dan gosip, termasuk definisi, keputusan, dan hadits tentang mereka. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 335}"
