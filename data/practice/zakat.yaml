label:
  ar: الزكاة
  en: Zakat (obligatory alms)
summary:
  ar: "الزكاة دفعة واجبة تُؤدّى من أنواع معينة من المال إلى الفقراء وسائر الأصناف المسماة في آية الصدقات، وهي من أركان الإسلام. وتعرض مقالة دائرة المعارف الإسلامية أصل اللفظ وأحكامها في القرآن والحديث، ثم اختلاف المذاهب في الماشية والزروع والذهب والفضة وعروض التجارة والمستحقين وطريقة الجباية، وزكاة الفطر، وتاريخ الجباية الرسمية، وإعادة النظر فيها في العصر الحديث. ويذكر الموطأ قول النبي أنه ليس فيما دون خمس ذود صدقة ولا فيما دون خمس أواق من الورق ولا فيما دون خمسة أوسق من التمر {cite:muwatta-maruf-1997 p. 333-335}"
  en: "Zakat is the obligatory payment made from set kinds of property to the poor and the other classes named in the verse on alms, and it is one of the pillars of Islam. The Encyclopaedia of Islam article covers the word's origin, its place in the Qur'an and hadith, and the schools' differences on livestock, crops, gold and silver, trade goods, recipients and collection, along with zakat al-fitr, the history of state collection and the modern re-examination of the duty. The Muwatta records the Prophet's saying that there is no alms on fewer than five camels, five uqiyya of silver or five wasqs of dates {cite:muwatta-maruf-1997 p. 333-335}"
  ur: "زکوٰۃ وہ لازمی ادائیگی ہے جو مال کی مخصوص اقسام میں سے غریبوں اور آیتِ صدقات میں مذکور دیگر طبقوں کو دی جاتی ہے، اور یہ اسلام کے ارکان میں سے ہے۔ دائرۃ المعارف اسلامیہ کا مضمون لفظ کی اصل، قرآن و حدیث میں اس کا مقام، اور مویشی، فصلوں، سونے چاندی، تجارتی مال، مستحقین اور وصولی میں مذاہب کے اختلاف، نیز زکوٰۃ الفطر، سرکاری وصولی کی تاریخ اور جدید دور میں اس پر نظرِ ثانی بیان کرتا ہے۔ موطا میں نبی کا یہ قول نقل ہے کہ پانچ اونٹوں، پانچ اوقیہ چاندی اور پانچ وسق کھجور سے کم میں صدقہ نہیں {cite:muwatta-maruf-1997 p. 333-335}"
