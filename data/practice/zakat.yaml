label:
  ar: الزكاة
  en: Zakat (obligatory alms)
summary:
  ar: الصدقة المفروضة، وهي من أركان الإسلام الخمسة؛ ذكرها القرآن مقرونة بالصلاة وحدّد مصارفها في آية الصدقات، ومنها المؤلفة قلوبهم، ووصفها حديث جبريل بأنها «المفروضة» تمييزاً لها عن صدقة التطوع. ويذكر الموطأ في أول كتاب الزكاة قول النبي أنه ليس فيما دون خمس ذود صدقة ولا فيما دون خمس أواق من الورق ولا فيما دون خمسة أوسق من التمر، ويذكر أن عمر بن عبد العزيز كتب إلى عامله على دمشق أن الصدقة إنما هي في الحرث والعين والماشية، وأن مالكاً قال لا تكون الصدقة إلا في ثلاثة أشياء {cite:muwatta-maruf-1997 p. 333-335}
  en: The obligatory alms, one of the five pillars; the Qur'an pairs it with prayer and names its recipients in the verse on alms, among them those whose hearts are to be reconciled, and the hadith of Jibril calls it the 'obligatory' alms to
    set it apart from voluntary giving. The Muwatta opens its Book of Zakat with the Prophet's saying that there is no alms on fewer than five camels, five uqiyya of silver or five wasqs of dates; it also records that Umar ibn Abd al-Aziz wrote to his governor of Damascus that alms is only on crops, specie and livestock, and Malik's statement that sadaqa exists only in three things {cite:muwatta-maruf-1997 p. 333-335}
