summary:
  ar: "رمي الحصى على الجمرات الثلاث بمنى: سبع حصيات على جمرة العقبة يوم النحر، ثم على الجمرات الثلاث كل يوم من أيام التشريق، تذكاراً لموقف إبراهيم من الشيطان وتجسيداً للإعلان أن الشيطان عدو."
  en: "Throwing pebbles at the three pillars at Mina: seven at Jamrat al-Aqaba on the Day of Sacrifice, then seven at each of the three on every tashriq day — in remembrance of Ibrahim's stand against the devil and as a declaration that evil is to be repelled."
  ur: "منی میں تین جمرات پر کنکریاں مارنا: یومِ نحر کو جمرۂ عقبہ پر سات کنکریاں، پھر ایامِ تشریق میں ہر دن تینوں پر سات سات — ابراہیم علیہ السلام کے شیطان کے سامنے کھڑے ہونے کی یاد اور اعلانِ عداوتِ شیطان۔"
