id: practice/dua-congratulating-the-parents-and-calling-by-name
class: practice
kind: ritual
label:
  ar: "تهنئة المولود له وآداب الأسماء والنداء"
  en: "Congratulating the parents and the manners of names and calling"
  ur: "مبارک باد اور ناموں اور پکارنے کے آداب"
  es: "Felicitando a los padres y los modales de nombres y llamadas"
  fr: "Félicitations aux parents pour les bonnes manières et les noms et appels"
  tr: "Yeni doğanlara ve isimler ile çağrılma görgü kurallarına tebrikler"
  id: "Selamat untuk bayi baru lahir dan etiket dalam menyebut nama dan panggilan"
summary:
  ar: "ما أورده النووي في «كتاب الأسماء» من تهنئة المولود له وجواب المهنأ، والنهي عن بعض الأسماء، ونداء من لا يعرف اسمه، وتغيير الاسم إلى أحسن منه. {cite:al-adhkar-nawawi-arnaut-1994 p. 289}"
  en: "What al-Nawawi gathers in the Book of Names on congratulating one who has been given a child and the reply, the names forbidden or disliked, calling someone whose name is not known, and changing a name to a better one. {cite:al-adhkar-nawawi-arnaut-1994 p. 289}"
  ur: "جو نووی نے «کتاب الاسماء» میں جمع کیا: جس کے ہاں بچہ ہوا اسے مبارک باد اور اس کا جواب، ناپسندیدہ نام، جس کا نام معلوم نہ ہو اسے پکارنا، اور نام کو بہتر نام سے بدلنا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 289}"
  es: "Lo que Al-Nawawi recopila en el Libro de los Nombres sobre felicitar a quien ha tenido un hijo y la respuesta, los nombres prohibidos o desaconsejados, llamar a alguien cuyo nombre se desconoce y cambiar un nombre por uno mejor. {cite:al-adhkar-nawawi-arnaut-1994 p. 289}"
  fr: "Dans son ouvrage intitulé « Le Livre des Noms », al-Nawawi rassemble des informations sur les félicitations à formuler à la personne qui vient d'avoir un enfant, les noms interdits ou déconseillés, la manière d'appeler une personne dont on ignore le nom, et le changement de nom pour un nom plus approprié. {cite:al-adhkar-nawawi-arnaut-1994 p. 289}"
  tr: "Al-Nawawi'nin 'İsimler Kitabı'nda yeni doğanı tebrik etmek, tebriklere yanıt vermek, bazı isimleri yasaklamak, adı bilinmeyenlere seslenmek ve ismi daha iyi bir isme çevirmek hakkında bahsettikleri. {cite:al-adhkar-nawawi-arnaut-1994 s. 289}"
  id: "Apa yang disebutkan al-Nawawi dalam 'Kitab Nama' tentang mengucapkan selamat kepada bayi yang baru lahir, menanggapi ucapan selamat, melarang nama tertentu, memanggil mereka yang namanya tidak diketahui, dan mengubah nama menjadi nama yang lebih baik. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 289}"
