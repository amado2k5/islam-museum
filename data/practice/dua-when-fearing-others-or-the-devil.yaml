  es: "Lo que Al-Nawawi recopila en los capítulos sobre qué decir cuando se teme a un pueblo o a un gobernante, cuando se mira a un enemigo y cuando aparece un demonio. {cite:al-adhkar-nawawi-arnaut-1994 p. 123}"
