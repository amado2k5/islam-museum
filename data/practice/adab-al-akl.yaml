summary:
  ar: "آداب الطعام في تعليم الشيخ عمر عبد الكافي أن يُسمّى الله عند الأكل، وأنها من الآداب الإسلامية التي يعدّها الشيخ عظيمة. وقد وردت هذه الإشارة في حديث الشيخ دون تفصيل كامل."
  en: "In Sheikh Omar Abdelkafy's lessons, the etiquette of eating includes naming God at the start of the meal, and he counts these among great Islamic etiquettes. The points are given without full detail in his talk."
  ur: "شیخ عمر عبدالکافی کے درسوں میں کھانے کے آداب میں کھانے کے وقت اللہ کا نام لینا شامل ہے، اور وہ انہیں عظیم اسلامی آداب میں شمار کرتے ہیں۔ یہ باتیں ان کی گفتگو میں مکمل تفصیل کے بغیر آئی ہیں۔"
