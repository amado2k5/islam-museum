summary:
  ar: "ختان الذكور؛ فطرة عند الفقهاء وعادة مؤكدة في الشرع والعرف، تختلف أعماره وصور احتفاله بين البلدان."
  en: "Male circumcision; counted among the fitra by jurists and a firmly rooted practice in law and custom, with ages and celebrations varying by country."
  es: "La circuncisión masculina, considerada entre las fitra por los juristas, es una práctica firmemente arraigada en la ley y la costumbre, cuyas edades y celebraciones varían según el país."
  fr: "La circoncision masculine; considérée comme faisant partie de la fitra par les juristes et une pratique fermement ancrée dans le droit et la coutume, avec des âges et des célébrations variant selon les pays."
  ur: "مردانہ ختنہ؛ فقہاء کے فطرہ میں شمار کیا جاتا ہے اور قانون اور رواج میں مضبوطی سے جڑا ہوا عمل ہے، جس کی عمریں اور تقریبات ملک کے لحاظ سے مختلف ہوتی ہیں۔"
  tr: "Erkek sünneti hukukçulara göre doğal bir eğilimdir ve hem İslam hukukunda hem de gelenekte onaylanmış bir gelenektir. Yaşları ve kutlama biçimleri ülkelerden ülkelere değişiklik gösterir."
  id: "Sunat laki-laki adalah sifat alami menurut para ahli hukum dan merupakan kebiasaan yang telah dikonfirmasi baik dalam hukum maupun kebiasaan Islam. Usia dan bentuk perayaannya berbeda-beda antar negara."
