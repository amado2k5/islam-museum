id: practice/dua-on-dressing
class: practice
kind: ritual
label:
  ar: "الدعاء عند لبس الثوب"
  en: "Supplication on putting on a garment"
  ur: "لباس پہننے کی دعا"
  es: "Súplica al ponerse una prenda"
  fr: "Supplication pour enfiler un vêtement"
  tr: "Elbise giyerken dua"
  id: "Permohonan saat mengenakan gaun"
summary:
  ar: "ما يقال عند لبس الثوب والثوب الجديد وعند خلعه، وما يقال لمن لبس جديدا، كما جمعه النووي في «الأذكار» من كتاب ابن السني والسنن وصحيح البخاري. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  en: "What is said on putting on a garment or a new one and on taking it off, and what is said to someone seen in new clothes, as al-Nawawi gathers it in al-Adhkar from Ibn al-Sunni's book, the Sunan and Sahih al-Bukhari. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  ur: "لباس یا نیا لباس پہنتے اور اتارتے وقت کیا کہا جائے، اور نیا لباس پہننے والے سے کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں ابن السنی کی کتاب، سنن اور صحیح بخاری سے جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  es: "Lo que se dice al ponerse una prenda o una nueva y al quitársela, y lo que se le dice a alguien que lleva ropa nueva, según lo recopila al-Nawawi en al-Adhkar del libro de Ibn al-Sunni, el Sunan y el Sahih al-Bukhari. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  fr: "Ce que l'on dit lorsqu'on enfile un vêtement, surtout un vêtement neuf, et lorsqu'on l'enlève, ainsi que ce que l'on dit à une personne vue en vêtements neufs, tel que compilé par al-Nawawi dans al-Adhkar à partir du livre d'Ibn al-Sunni, le Sunan et le Sahih al-Bukhari. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  tr: "Yeni bir giysi giyerken veya çıkarıldığında ve yeni giysi giyen birine ne denir, el-Nawawi'nin 'Al-Adhkar' adlı eserinde İbn al-Sunni, Sünan ve Sahih al-Bukhari kitabından derlendiği gibi. {cite:al-adhkar-nawawi-arnaut-1994 s. 20}"
  id: "Apa yang dikatakan saat mengenakan pakaian baru atau melepasnya, dan apa yang dikatakan kepada seseorang yang mengenakan pakaian baru, seperti yang disusun oleh al-Nawawi dalam 'Al-Adhkar' dari kitab Ibn al-Sunni, Sunan, dan Sahih al-Bukhari. {Sitasi: Al-Adhkar-Nawawi-Arnaut-1994 hlm. 20}"
