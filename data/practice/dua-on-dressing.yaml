id: practice/dua-on-dressing
class: practice
kind: ritual
label:
  ar: "الدعاء عند لبس الثوب"
  en: "Supplication on putting on a garment"
  ur: "لباس پہننے کی دعا"
summary:
  ar: "ما يقال عند لبس الثوب والثوب الجديد وعند خلعه، وما يقال لمن لبس جديدا، كما جمعه النووي في «الأذكار» من كتاب ابن السني والسنن وصحيح البخاري. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  en: "What is said on putting on a garment or a new one and on taking it off, and what is said to someone seen in new clothes, as al-Nawawi gathers it in al-Adhkar from Ibn al-Sunni's book, the Sunan and Sahih al-Bukhari. {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
  ur: "لباس یا نیا لباس پہنتے اور اتارتے وقت کیا کہا جائے، اور نیا لباس پہننے والے سے کیا کہا جائے، جیسا کہ نووی نے «الاذکار» میں ابن السنی کی کتاب، سنن اور صحیح بخاری سے جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 20}"
