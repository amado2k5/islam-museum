summary:
  ar: "«عيد التكليف» عند الشيعة الإثني عشرية في إيران: احتفال مدرسي وعائلي ببلوغ الفتاة تسع سنين قمرية والفتى خمس عشرة — صلاة جماعية، صيام أول يوم كامل، هدايا، وتهنئة بدخول سن المسؤولية عن الصلاة والعمل. وهو عادة لا ركن، ويُمارَس اليوم في المدارس والبيوت."
  en: "The 'celebration of accountability' among Twelver Shia in Iran: a school and family ceremony marking religious majority — nine lunar years for girls, fifteen for boys — with congregational prayer, a first full fast, gifts and congratulations on entering the age of responsibility for prayer and deeds. A custom, not a pillar, kept today in schools and homes."
  ur: "جشن تکلیف، ایران کے اثنا عشری مسلمانوں کی تقریب: لڑکی کی نو اور لڑکے کی پندرہ قمری برس کی سنِ تکلیف پر اسکول اور گھر کی محفل — اجتماعی نماز، پہلا مکمل روزہ، تحائف اور عبادت و عمل کی ذمہ داری کے داخلے پر مبارکباد؛ یہ عادت ہے، رکن نہیں، اور آج بھی اسکولوں اور گھروں میں رائج ہے۔"
