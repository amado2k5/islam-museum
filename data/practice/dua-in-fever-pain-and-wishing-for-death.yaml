id: practice/dua-in-fever-pain-and-wishing-for-death
class: practice
kind: ritual
label:
  ar: "في الحمى والوجع وتمني الموت"
  en: "In fever, pain and the wish for death"
  ur: "بخار، درد اور موت کی تمنا کے وقت"
  es: "En la fiebre, el dolor y el deseo de morir"
  fr: "Dans la fièvre, la douleur et le désir de mourir"
summary:
  ar: "ما جمعه النووي في أبواب ما يقوله من به صداع أو حمى، وقول المريض إنه شديد الوجع، وكراهة تمني الموت لضر، ودعاء الموت في البلد الشريف. {cite:al-adhkar-nawawi-arnaut-1994 p. 137}"
  en: "What al-Nawawi gathers in the chapters on what one with a headache or fever says, on a patient saying he is in severe pain, on disliking the wish for death because of harm, and on praying to die in the noble city. {cite:al-adhkar-nawawi-arnaut-1994 p. 137}"
  ur: "نووی نے ان ابواب میں جو جمع کیا: سر درد یا بخار والا کیا کہے، مریض کا شدید تکلیف بیان کرنا، تکلیف کی وجہ سے موت کی تمنا کا ناپسند ہونا، اور مقدس شہر میں موت کی دعا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 137}"
  es: "Lo que Al-Nawawi recopila en los capítulos sobre lo que dice alguien con dolor de cabeza o fiebre, sobre un paciente que dice sentir un dolor intenso, sobre el rechazo al deseo de morir por daño y sobre la oración por morir en la ciudad noble. {cite:al-adhkar-nawawi-arnaut-1994 p. 137}"
  fr: "Ce qu'al-Nawawi rassemble dans les chapitres consacrés aux paroles d'une personne souffrant de maux de tête ou de fièvre, à celles d'un patient se plaignant de fortes douleurs, au refus de souhaiter la mort par crainte du mal, et à la prière pour mourir dans la cité noble. {cite:al-adhkar-nawawi-arnaut-1994 p. 137}"
