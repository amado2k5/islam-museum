id: practice/dua-rain
class: practice
kind: ritual
label:
  ar: "ما يقال عند نزول المطر وبعده وعند كثرته"
  en: "What is said when rain falls, after it, and when it is excessive"
  ur: "بارش کے وقت، اس کے بعد اور اس کی کثرت پر اذکار"
  es: "¿Qué se dice cuando llueve, después de llover y cuando llueve mucho?"
  fr: "Que dit-on quand il pleut, après la pluie et quand il pleut abondamment ?"
  tr: "Yağmur yağdığında, yağmurdan sonra ve bol olduğunda ne denir"
  id: "Apa yang dikatakan saat hujan turun, setelahnya, dan ketika hujan melimpah"
summary:
  ar: "ما جمعه النووي في «الأذكار» من أذكار نزول المطر وبعده، وكلامه على قول مطرنا بنوء كذا، وما يقال إذا كثر المطر وخيف ضرره، من الصحيحين وغيرهما. {cite:al-adhkar-nawawi-arnaut-1994 p. 181}"
  en: "What al-Nawawi gathers in al-Adhkar on the remembrances when rain falls and after it, his discussion of the saying that rain came by such-and-such a star, and what is said when rain is so heavy that harm is feared, from the two Sahihs and other books. {cite:al-adhkar-nawawi-arnaut-1994 p. 181}"
  ur: "جو نووی نے «الاذکار» میں بارش کے وقت اور بعد کے اذکار، «فلاں ستارے کے سبب بارش ہوئی» کہنے پر اپنی بحث، اور بارش کی کثرت اور نقصان کے خوف پر کہی جانے والی دعا کے بارے میں صحیحین اور دوسری کتب سے جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 181}"
  es: "Lo que al-Nawawi recopila en al-Adhkar sobre los recuerdos que se hacen al llover y después de la lluvia, su análisis del dicho de que la lluvia vino por tal o cual estrella, y lo que se dice cuando la lluvia es tan intensa que se teme algún daño, a partir de los dos Sahihs y otros libros. {cite:al-adhkar-nawawi-arnaut-1994 p. 181}"
  fr: "Dans son ouvrage al-Adhkar, al-Nawawi rassemble des extraits des deux recueils authentiques (Sahihs) et d'autres livres, notamment des récits relatifs aux invocations pendant et après la pluie, ainsi que des informations sur le dicton selon lequel la pluie est venue par telle ou telle étoile, et sur les paroles prononcées lorsque la pluie est si abondante qu'on craint un danger. {cite:al-adhkar-nawawi-arnaut-1994 p. 181}"
  tr: "Al-Nawawi'nin 'Al-Adhkar'da yağmur ve sonrasını anma anılarını derlediği ve 'Yağmurumuz' söylendiği şu ve şöyle söylendiği ve yağmur şiddetli olduğunda ve zararından korkulan durumlarda söylenenler, iki Sahih ve diğerlerinden gelmektedir. {cite:al-adhkar-nawawi-arnaut-1994 s. 181}"
  id: "Apa yang dikumpulkan al-Nawawi dalam 'Al-Adhkar' tentang kenangan hujan dan akibatnya, serta kata-katanya tentang ucapan 'Hujan kami' dengan si anu, dan apa yang dikatakan ketika hujan deras dan kerugiannya ditakuti, berasal dari kedua Sahih dan lainnya. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 181}"
