id: practice/sayyid-al-istighfar
class: practice
kind: ritual
label:
  ar: "سيد الاستغفار"
  en: "The chief supplication for forgiveness"
  ur: "سید الاستغفار"
  es: "La principal súplica de perdón"
  fr: "La principale supplication pour le pardon"
  tr: "Affetme ustası"
  id: "Ahli dalam mencari pengampunan"
summary:
  ar: "ما أورده النووي في أول «كتاب الاستغفار» من «الأذكار»: سيد الاستغفار من صحيح البخاري عن شداد بن أوس، واستغفار النبي في اليوم من الصحيحين، وصيغ الاستغفار في السنن. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  en: "What al-Nawawi gives at the head of the Book of Seeking Forgiveness in al-Adhkar: the chief supplication for forgiveness from Sahih al-Bukhari, from Shaddad ibn Aws; the Prophet's daily seeking of forgiveness, from the two Sahihs; and the wordings found in the Sunan. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  ur: "جو نووی نے «الاذکار» کی «کتاب الاستغفار» کے شروع میں ذکر کیا: صحیح بخاری سے شداد بن اوس کی روایت میں سید الاستغفار، صحیحین سے نبی کا روزانہ استغفار، اور سنن میں وارد استغفار کے صیغے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  es: "Lo que al-Nawawi presenta al inicio del Libro de la Búsqueda del Perdón en al-Adhkar: la principal súplica de perdón de Sahih al-Bukhari, de Shaddad ibn Aws; la búsqueda diaria de perdón del Profeta, de los dos Sahihs; y las formulaciones que se encuentran en el Sunan. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  fr: "Ce qu'al-Nawawi présente en tête du Livre de la demande de pardon dans al-Adhkar: la principale invocation de pardon tirée du Sahih al-Bukhari, rapportée par Shaddad ibn Aws; la demande de pardon quotidienne du Prophète, tirée des deux Sahihs; et les formulations trouvées dans les Sunan. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  tr: "El-Nevavi'nin 'El-Adhkar'dan 'Bağışlama Kitabı'nın başında bahsettikleri: Sahih el-Buhari'den Bağışlanma Dileme Ustası, Peygamber'in iki Sahih'ten bir günde af dilemesi ve Sünnet'te bağışlama biçimleri. {cite:al-Adhkar-Nawawi-Arnaut-1994 s. 402}"
  id: "Apa yang disebutkan al-Nawawi di awal 'Kitab Mencari Pengampunan' dari 'Al-Adhkar': Guru Mencari Pengampunan dari Sahih al-Bukhari dari Shaddad ibn Aws, Nabi yang memohon pengampunan pada hari dari dua Sahih, dan bentuk-bentuk mencari pengampunan dalam Sunnah. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 402}"
