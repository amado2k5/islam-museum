label:
  ar: "سيد الاستغفار"
  en: "The chief supplication for forgiveness"
  ur: "سید الاستغفار"
summary:
  ar: "ما أورده النووي في أول «كتاب الاستغفار» من «الأذكار»: سيد الاستغفار من صحيح البخاري عن شداد بن أوس، واستغفار النبي في اليوم من الصحيحين، وصيغ الاستغفار في السنن. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  en: "What al-Nawawi gives at the head of the Book of Seeking Forgiveness in al-Adhkar: the chief supplication for forgiveness from Sahih al-Bukhari, from Shaddad ibn Aws; the Prophet's daily seeking of forgiveness, from the two Sahihs; and the wordings found in the Sunan. {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
  ur: "جو نووی نے «الاذکار» کی «کتاب الاستغفار» کے شروع میں ذکر کیا: صحیح بخاری سے شداد بن اوس کی روایت میں سید الاستغفار، صحیحین سے نبی کا روزانہ استغفار، اور سنن میں وارد استغفار کے صیغے۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 402}"
