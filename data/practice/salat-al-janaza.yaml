label:
  ar: صلاة الجنازة
  en: The funeral prayer
summary:
  ar: "صلاة الجنازة فرض كفاية يصليها الإمام والصفوف خلفه وقوفا بأربع تكبيرات وبلا ركوع ولا سجود، وبعد الأولى ثناء وبعد الثانية صلاة على النبي وبعد الثالثة دعاء للميت وبعد الرابعة تسليم. وتصف دائرة المعارف الإسلامية خلاف المذاهب في قراءة الفاتحة وفي حضور الميت، وتذكر ما قيل في الصلاة على المذنبين ومنهم من قتل نفسه، دون حكم من المتحف."
  en: "The funeral prayer is a communal duty performed standing by the imam and the rows behind him, with four takbirs and no bowing or prostration: praise after the first, blessing on the Prophet after the second, supplication for the deceased after the third and the salutation after the fourth. The Encyclopaedia of Islam describes the schools' differences on the Fatiha and on the presence of the body, and reports what jurists said about praying over sinners, including a person who killed himself, without a verdict from the museum."
  ur: "نمازِ جنازہ فرضِ کفایہ ہے جو امام اور اس کے پیچھے صفیں کھڑے ہو کر چار تکبیروں کے ساتھ ادا کرتی ہیں، بغیر رکوع اور سجدے کے: پہلی کے بعد ثنا، دوسری کے بعد نبی پر درود، تیسری کے بعد میت کے لیے دعا اور چوتھی کے بعد سلام۔ اسلامی انسائیکلوپیڈیا فاتحہ اور میت کی موجودگی پر مذاہب کا اختلاف بیان کرتا ہے اور گناہگاروں، بشمول خودکشی کرنے والے، پر نماز کے بارے میں فقہاء کے اقوال نقل کرتا ہے، میوزیم کی طرف سے کوئی فیصلہ نہیں۔"
