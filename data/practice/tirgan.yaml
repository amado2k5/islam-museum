  ar: "عيد من أعياد الفرس في مجوسيتهم يسميه البيروني «عيد الاغتسال»، يغتسلون فيه ويكنسون المطابخ والكوانين، ويعلل ذلك بقصص من أخبار كيخسرو وأفراسياب، كما ينقل محقق القانون المسعودي {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 266}."
  en: "A feast of the Persians of the Zoroastrian era that al-Biruni calls 'the feast of washing', when they bathed and swept kitchens and hearths, explained by stories of Kaykhusraw and Afrasiyab, as the editor of the Qanun quotes {cite:qanun-masudi-jundi-v1 p. 39} {cite:qanun-masudi-jundi-v1 p. 266}."
  ur: "مجوسی دور کے فارسیوں کی ایک عید جسے بیرونی «عیدِ غسل» کہتے ہیں، جس میں وہ نہاتے اور باورچی خانے اور چولہے صاف کرتے تھے؛ اس کی وجہ کیخسرو اور افراسیاب کی کہانیوں سے بیان کی گئی ہے {cite:qanun-masudi-jundi-v1 p. 39}."
