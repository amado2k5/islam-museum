label:
  ar: صلاة الخوف
  en: Prayer in fear (salat al-khawf)
summary:
  ar: "صلاة الخوف في تفسير الشعراوي لآيات النساء 101 إلى 102: تُقصر الصلاة في السفر، وتُصلّى في القتال بطائفتين، وللنبي صور متعددة عرضها الشعراوي، مع تأكيد أخذ السلاح والحذر، والإتيان بالصلاة في وقتها {cite:tafsir-sharawi-khawatir-scan p.2589}{cite:tafsir-sharawi-khawatir-scan p.2592}."
  en: "Prayer in fear in Sha'rawi's commentary on Q. 4:101 and 4:102: prayer is shortened on a journey, and in battle it is prayed by two groups; he sets out several forms reported from the Prophet's practice, and stresses carrying arms and caution, and keeping the prayer to its time {cite:tafsir-sharawi-khawatir-scan p.2589}{cite:tafsir-sharawi-khawatir-scan p.2592}."
