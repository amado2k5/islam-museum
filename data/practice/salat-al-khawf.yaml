perspectives:
  - tradition: sunni
    id: sunni-sharawi-own-view-imam
    stance: { ar: "بعد وفاة النبي يصح أن يكون لكل طائفة إمامها", en: "After the Prophet's death, each group may have its own imam", ur: "نبی کی وفات کے بعد ہر گروہ کا اپنا امام ہو سکتا ہے" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقول الشعراوي «لي رأي» في المسألة: أن تقسيم الجماعة في صلاة الخوف كان لأن الإمام هو النبي، فلم يشأ الله أن يحجب قوماً عن الصلاة خلفه، أما بعد وفاته فيجوز أن تصلي كل طائفة بإمامها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
      en: "Sha'rawi states his own view: the division of the congregation in fear prayer was because the imam was the Prophet, so that no group was kept from praying behind him. After his death each group may pray behind its own imam {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-described-forms
    stance: { ar: "صورتان لتقسيم الجماعة طائفتين، تصلي الأولى ركعة ثم تحرس، وتأتي الثانية فتتم", en: "The congregation is split into two groups: the first prays one rak'a and then stands guard while the second joins and completes", ur: "جماعت کو دو گروہوں میں بانٹا جاتا ہے؛ پہلا ایک رکعت پڑھ کر پہرہ دیتا ہے اور دوسرا آ کر مکمل کرتا ہے" }
    holders: []
    summary:
      ar: "يصف الشعراوي صورة صلاة الخوف التي فعلها النبي في غزوة ذات الرقاع: تصلي طائفة معه ركعة ثم تتم وحدها وتقف حارسة، وتأتي الطائفة الأخرى فتصلي الركعة التالية معه ثم تتم وحدها، ولم يُفصّل الشعراوي مذاهب الفقهاء في هذا الموضع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026}."
      en: "Sha'rawi describes the fear prayer the Prophet performed at the battle of Dhat al-Riqa': one group prays a rak'a with him and completes alone while the other stands guard; the second group then prays the next rak'a with him and completes alone. He does not set out the schools' differences on this page {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-no-standing-no-prayer
    stance: { ar: "إن لم يستطع الصلاة على وجهها صلى راجلاً أو راكباً، ومن لم يستطع فيكبّر تكبيرتين", en: "If one cannot pray in the full form, one prays on foot or mounted, and one who cannot even do that says the takbir twice", ur: "اگر مکمل نماز نہ ہو سکے تو پیدل یا سواری پر، اور جو یہ بھی نہ کر سکے وہ دو تکبیریں کہے" }
    holders: []
    summary:
      ar: "يذكر الشعراوي أن المؤمن يصلي راجلاً أو راكباً، وأن المريض يصلي قائماً فإن لم يستطع فقاعداً فإن لم يستطع فمضطجعاً، وأن من لم يستطع الصلاة في الخوف يكبّر تكبيرتين {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
      en: "Sha'rawi says the believer prays on foot or mounted, the sick person prays standing, then seated, then lying down, and one who cannot pray in fear says the takbir twice {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
  - tradition: sunni
    id: sunni-sharawi-forms-2501-3000
    stance:
      ar: "تُصلى الصلاة في الخوف بطائفتين مع أخذ السلاح والحذر، فإن كان القادة خلفاء للنبي أُقيمت الصورة القرآنية، وإن كان لكل جماعة إمام صلت كل جماعة صلاة القصر كاملة خلفه"
      en: "In fear the prayer is held by two groups, with arms and caution; if the leaders are successors of the Prophet the Qur'anic form applies, and if each group has its own imam each prays the shortened prayer complete behind it"
    summary:
      ar: "يرى الشعراوي أن الآية تقسم الطائفة المؤمنة إلى قسمين: قسم يصلي مع النبي وقسم يرقب العدو، ثم يأتي القسم الآخر فيصلي {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2592}. ويعرض ثلاث صور من صلاة النبي في الخوف {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2592}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2593}، وينقل عن العلماء أن الصورة القرآنية تُقام إن كان القائمون بالقيادة خلفاء للنبي، وأن كل جماعة تصلي صلاة القصر كاملة خلف إمامها إن كان لكل جماعة إمام {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2593}. ولم يسمِّ الشعراوي هؤلاء العلماء (needs_source)."
      en: "Sha'rawi reads the verse as dividing the believing group in two: one part prays with the Prophet while the other keeps watch, and then the other part prays {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2592}. He sets out three forms of the Prophet's prayer in fear {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2592}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2593}, and reports the scholars' view that the Qur'anic form applies if the leaders are successors of the Prophet, and that each group prays the shortened prayer complete behind its own imam if each has one {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2593}. He does not name these scholars (needs_source)."
    holders: [person/muhammad-mutawalli-al-shaarawi]
    sources: [source/tafsir-sharawi-khawatir-scan-pp-2501-3000]
