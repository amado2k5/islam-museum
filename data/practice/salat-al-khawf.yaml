perspectives:
- tradition: sunni
  id: sunni-sharawi-forms
  stance:
    ar: "تُصلّى الصلاة في الخوف بطائفتين مع أخذ الأسلحة والحذر، وإن كان لكل جماعة إمام صلت كل جماعة صلاتها كاملة"
    en: "In fear the prayer is held by two groups, with arms and caution; if each group has its own imam, each prays its prayer complete"
  summary:
    ar: "يرى الشعراوي أن الآية تأمر بأن تنقسم الطائفة المؤمنة إلى قسمين: قسم يصلي مع النبي وقسم يرقب العدو، ثم يأتي الآخرون ليصلوا {cite:tafsir-sharawi-khawatir-scan p.2592}. ويعرض ثلاث صور من صلاة النبي في الخوف، منها أن يصلي بكل فرقة ركعتين، ومنها أن تصلي كل طائفة ركعة ثم تكمل بنفسها، ومنها أن تصلي الطائفة الأولى ركعة ويبقى النبي قائماً حتى تكمل {cite:tafsir-sharawi-khawatir-scan p.2592}{cite:tafsir-sharawi-khawatir-scan p.2593}. وينقل أن العلماء قالوا: إن كان القائمون بالقيادة خلفاء للنبي في الولاية فتُقام الصلاة كما جاءت، وإن كان لكل جماعة إمام فتصلي كل جماعة صلاة القصر كاملة خلف إمامها {cite:tafsir-sharawi-khawatir-scan p.2593}. ويؤكد أن الحذر والسلاح واجبان على المصلّين، وأن الصلاة لا تُترك في الحرب {cite:tafsir-sharawi-khawatir-scan p.2593}{cite:tafsir-sharawi-khawatir-scan p.2594}. ولم يسمِّ الشعراوي العلماء الذين نقل قولهم (needs_source)."
    en: "Sha'rawi reads the verse as dividing the believing group in two: one part prays with the Prophet while the other keeps watch on the enemy, and then the other part comes to pray {cite:tafsir-sharawi-khawatir-scan p.2592}. He sets out three forms from the Prophet's practice: two rak'as with each group; each group prays one rak'a and then completes alone; and the first group prays one rak'a while the Prophet stands until it finishes {cite:tafsir-sharawi-khawatir-scan p.2592}{cite:tafsir-sharawi-khawatir-scan p.2593}. He reports the scholars' view that if the leaders are successors of the Prophet the form in the Qur'an applies, and if each group has its own imam each prays the shortened prayer complete behind it {cite:tafsir-sharawi-khawatir-scan p.2593}. He stresses that arms and caution are required, and that prayer is not abandoned in war {cite:tafsir-sharawi-khawatir-scan p.2593}{cite:tafsir-sharawi-khawatir-scan p.2594}. The scholars he cites are not named (needs_source)."
