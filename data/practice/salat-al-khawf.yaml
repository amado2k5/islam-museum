id: practice/salat-al-khawf
class: practice
kind: ritual
label:
  ar: "صلاة الخوف"
  en: "Prayer in fear (salat al-khawf)"
  ur: "صلاۃ الخوف"
summary:
  ar: "صلاة يصليها المؤمن في حال الخوف من العدو، ويقرر الشعراوي أنها لا تسقط عند لقاء العدو، وأن صورها التي ذكرها الفقهاء كانت لأجل المعارك التي يقود فيها النبي الجيش، ويرى أن الإمام بعد وفاته يصح أن يكون لكل طائفة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
  en: "Prayer performed in fear of an enemy. Sha'rawi holds that the prayer does not lapse at the meeting with the enemy. He reads the detailed forms the jurists describe as belonging to battles that the Prophet led, and in his own view, after the Prophet's death each group may have its own imam {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
  ur: "دشمن کے خوف کے وقت ادا کی جانے والی نماز۔ شعراوی کے نزدیک دشمن سے سامنا ہونے پر بھی نماز ساقط نہیں ہوتی۔ وہ فقہاء کی بیان کردہ تفصیلی صورتوں کو ان جنگوں سے منسوب کرتے ہیں جن میں نبی کریم خود قیادت کرتے تھے، اور اپنی رائے کے طور پر کہتے ہیں کہ ان کی وفات کے بعد ہر گروہ کا اپنا امام ہو سکتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1026} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1027}."
issue:
  ar: "كيف تُصلى الصلاة عند الخوف من العدو، وهل تحتاج صورتها إلى إمام واحد؟"
  en: "How is prayer performed in fear of an enemy, and does its form require a single imam?"
  ur: "دشمن کے خوف میں نماز کیسے ادا ہو، اور کیا اس کی صورت کے لیے ایک ہی امام ضروری ہے؟"
