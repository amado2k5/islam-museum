summary:
  ar: "مال يُعطى للصغار صبيحة العيد: عيدية في مصر والعالم العربي، عيدي في جنوب آسيا وتركيا، و«duit raya» في لفتات خضراء في ماليزيا وإندونيسيا وسنغافورة. تجمع العادة إكرام الصغار وتعليم الكرم، وتكملها التهاني والزيارات."
  en: "Cash given to children on Eid morning: eidiya in Egypt and the Arab world, eidi in South Asia and Turkey, and duit raya in green envelopes in Malaysia, Indonesia and Singapore. The custom joins honouring the young with teaching generosity, alongside greetings and visits."
  ur: "عیدی، عید کی صبح بچوں کو دی گئی رقم: مصر اور عرب دنیا میں عیدیہ، جنوبی ایشیا اور ترکی میں عیدی، اور ملائیشیا، انڈونیشیا اور سنگاپور میں سبز لفافوں میں دؤت رایا۔ یہ رسم ننھوں کی عزت اور سخاوت کی تعلیم کو جوڑتی ہے اور مبارکباد اور ملاقاتوں کے ساتھ پوری ہوتی ہے۔"
