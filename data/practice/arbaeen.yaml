summary:
  ar: "اليوم الأربعون بعد الوفاة: عند الشيعة الإثني عشرية أعظم مشهد هو أربعين الإمام الحسين في كربلاء في 20 صفر، حيث تمشي ملايين الزوار أياماً؛ وفي جنوب آسيا «چہلم» تجتمع فيه الأسرة على ختم القرآن والدعاء للميت. عادة لا فرض، وتختلف المذاهب فيها."
  en: "The fortieth day after a death: for Twelver Shia the greatest observance is Arba'een of Imam Husayn at Karbala on 20 Safar, drawing millions who walk for days; in South Asia the chehlum gathers the family for a Qur'an completion and prayer for the deceased. A custom, not an obligation, and the schools differ on it."
  ur: "اربعین، وفات کے چالیسویں دن کی رسم: اثنا عشریوں کے نزدیک سب سے بڑا منظر کربلا میں امام حسین کی اربعین ہے 20 صفر کو، جہاں لاکھوں زائر پیدل جاتے ہیں؛ جنوبی ایشیا میں چہلم پر خاندان ختمِ قرآن اور مرحوم کے لیے دعا پر جمع ہوتا ہے؛ عادت ہے، فرض نہیں، اور مذاہب اس میں مختلف ہیں۔"
