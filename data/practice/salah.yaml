label:
  ar: الصلاة
  en: Salah (the prescribed prayer)
summary:
  ar: "الصلاة المفروضة خمس مرات في اليوم والليلة، وهي من أركان الإسلام الخمسة؛ ورد الأمر بإقامتها في القرآن وبأنها كتاب موقوت على المؤمنين، وفي الحديث أن ما عداها من الصلوات تطوع. وتصفها دائرة المعارف الإسلامية بأنها الصلاة الرئيسة في الإسلام، ثبتت أوقاتها وهيئتها بحلول القرن الثالث الهجري، وتعرض أوقاتها الخمس وركعاتها وشروطها وما يختلف فيه الحنفية والمالكية والشافعية والحنابلة، وصلوات الجمعة والعيدين والوتر والسفر والجنازة."
  en: "The prescribed prayer, five times in the day and night, one of the five pillars of Islam; the Qur'an commands establishing it and calls it a timed obligation on the believers, and the hadith adds that other prayers are voluntary. The Encyclopaedia of Islam describes it as the principal prayer of Islam, its times and form fixed by the third/ninth century, and sets out the five times, the rak'as, the conditions, the points on which the Hanafi, Maliki, Shafi'i and Hanbali schools differ, and the Friday, feast, witr, travel and funeral prayers."
  ur: "دن رات میں پانچ بار فرض نماز، جو اسلام کے پانچ ارکان میں سے ہے؛ قرآن اس کے قائم کرنے کا حکم دیتا ہے اور اسے مومنوں پر وقت کی پابندی والا فریضہ کہتا ہے، اور حدیث میں ہے کہ اس کے علاوہ دوسری نمازیں نفل ہیں۔ دائرۃ المعارفِ اسلامیہ اسے اسلام کی بنیادی نماز بتاتا ہے جس کے اوقات اور طریقہ تیسری صدی ہجری تک طے ہو چکے تھے، اور وہ پانچ اوقات، رکعات، شرائط، حنفی، مالکی، شافعی اور حنبلی مذاہب کے اختلافی نکات، اور جمعہ، عیدین، وتر، سفر اور جنازے کی نمازیں بیان کرتا ہے۔"
