  en: Salah (the prescribed prayer)
summary:
  ar: الصلاة المفروضة خمس مرات في اليوم والليلة، وهي من أركان الإسلام الخمسة؛ ورد الأمر بإقامتها في القرآن وبأنها كتاب موقوت على المؤمنين، وفي الحديث أن ما عداها من الصلوات تطوع.
  en: The prescribed prayer, five times in the day and night, one of the five pillars of Islam; the Qur'an commands establishing it and calls it a timed obligation on the believers, and the hadith adds that other prayers are voluntary.
