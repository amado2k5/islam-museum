id: practice/dua-in-prayer-rising-from-ruku
class: practice
kind: ritual
label:
  ar: "ما يقال عند الرفع من الركوع"
  en: "What is said on rising from bowing"
  ur: "رکوع سے اٹھتے وقت کے اذکار"
  es: "¿Qué se dice al levantarse de la reverencia?"
  fr: "Que dit-on en se relevant après avoir incliné la tête ?"
summary:
  ar: "ما جمعه النووي في باب ما يقوله المصلي في رفع رأسه من الركوع واعتداله: التسميع والتحميد والدعاء الأطول، وما روي في ذلك من الصحيحين. {cite:al-adhkar-nawawi-arnaut-1994 p. 54}"
  en: "What al-Nawawi gathers in the chapter on what is said on lifting the head from bowing and standing upright: the words «سمع الله لمن حمده», the praise and the longer form, with the reports from the two Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 54}"
  ur: "جو نووی نے رکوع سے سر اٹھانے اور سیدھا کھڑے ہونے پر کہی جانے والی دعا کے باب میں جمع کیا: «سمع الله لمن حمده»، حمد اور طویل صورت، صحیحین کی روایات کے ساتھ۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 54}"
  es: "Lo que al-Nawawi recopila en el capítulo sobre lo que se dice acerca de levantar la cabeza de la inclinación y ponerse de pie: las palabras «سمع الله لمن حمده», la alabanza y la forma más extensa, con los relatos de los dos Sahihs. {cite:al-adhkar-nawawi-arnaut-1994 p. 54}"
  fr: "Dans le chapitre consacré au relèvement de la tête après la prosternation, al-Nawawi rassemble les paroles « سمع الله لمن حمده », la louange et sa version longue, ainsi que les hadiths rapportés dans les deux recueils authentiques (Sahihs). {cite:al-adhkar-nawawi-arnaut-1994 p. 54}"
