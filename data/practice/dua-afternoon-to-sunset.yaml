id: practice/dua-afternoon-to-sunset
class: practice
kind: ritual
label:
  ar: "من الزوال إلى غروب الشمس"
  en: "From noon to sunset"
  ur: "زوال سے غروب آفتاب تک"
  es: "Desde el mediodía hasta la puesta del sol."
summary:
  ar: "ما جمعه النووي في بابي ما يقال بعد الزوال إلى العصر وما يقال بعد العصر إلى الغروب: كثرة الذكر بعد الزوال وبعد العصر، وفضل الجلوس مع الذاكرين. {cite:al-adhkar-nawawi-arnaut-1994 p. 86}"
  en: "What al-Nawawi gathers in the chapters on what is said from noon to the afternoon prayer and from the afternoon prayer to sunset: more remembrance after noon and after the afternoon prayer, and the merit of sitting with those who remember God. {cite:al-adhkar-nawawi-arnaut-1994 p. 86}"
  ur: "زوال سے عصر تک اور عصر سے غروب تک کے ابواب میں نووی نے جو جمع کیا: زوال اور عصر کے بعد ذکر کی کثرت، اور ذاکرین کے ساتھ بیٹھنے کی فضیلت۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 86}"
  es: "Lo que Al-Nawawi recopila en los capítulos sobre lo que se dice desde el mediodía hasta la oración de la tarde y desde la oración de la tarde hasta la puesta del sol: mayor recuerdo después del mediodía y después de la oración de la tarde, y el mérito de sentarse con aquellos que recuerdan a Dios. {cite:al-adhkar-nawawi-arnaut-1994 p. 86}"
