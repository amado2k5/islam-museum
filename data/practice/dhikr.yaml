id: practice/dhikr
class: practice
kind: ritual
label:
  ar: الذكر
  en: Dhikr (remembrance of God)
  es: "Dhikr (recuerdo de Dios)"
  fr: "Dhikr (souvenir de Dieu)"
  ur: "ذکر ⁦(خدا کی یاد)⁩"
summary:
  ar: "تكرار أسماء الله والتسبيح والاستغفار، فرديًا وجماعيًا؛ «ألا بذكر الله تطمئن القلوب»، وتطورت له صيغ ومجالس في الطرق الصوفية."
  en: "Repeating God's names, tasbih and istighfar, alone and in gatherings — 'in the remembrance of God hearts find rest'; the Sufi orders built litanies and assemblies on it."
  es: "Repetir los nombres de Dios, el tasbih y el istighfar, solos y en reuniones —'en el recuerdo de Dios los corazones encuentran descanso'—; las órdenes sufíes construyeron letanías y asambleas sobre ello."
  fr: "Répéter les noms de Dieu, le tasbih et l'istighfar, seul et en groupe — « dans le souvenir de Dieu, les cœurs trouvent le repos »; les ordres soufis ont bâti leurs litanies et leurs assemblées sur ce principe."
  ur: "خدا کے نام، تسبیح اور استغفار، اکیلے اور محفلوں میں دہرانا - 'خدا کے ذکر سے دلوں کو سکون ملتا ہے'؛ صوفی حکم نے اس پر لٹیاں اور مجلسیں بنائیں۔"
