id: practice/dua-when-angry
class: practice
kind: ritual
label:
  ar: "ما يقال عند الغضب"
  en: "What is said when angry"
  ur: "غصے کے وقت کیا کہا جائے"
  es: "¿Qué se dice cuando uno está enojado?"
  fr: "Que dit-on quand on est en colère ?"
  tr: "Öfkeyle söylenenler"
  id: "Apa yang dikatakan dalam kemarahan"
summary:
  ar: "ما أورده النووي في «كتاب الأذكار المتفرقة» في باب ما يقول إذا غضب: الآيتان اللتان يوردهما، وأحاديث ملك النفس عند الغضب، والاستعاذة، والدعاء، والوضوء. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  en: "What al-Nawawi gathers in the Book of Miscellaneous Remembrances in the chapter on what is said when angry: the two verses he cites, the reports on self-control in anger, the seeking of refuge, a supplication and ablution. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  ur: "جو نووی نے «کتاب الاذکار المتفرقہ» میں غصے کے وقت کیا کہا جائے کے باب میں جمع کیا: دو آیتیں، غصے میں خود پر قابو کی روایات، پناہ مانگنا، ایک دعا اور وضو۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  es: "Lo que al-Nawawi recopila en el Libro de Recuerdos Varios, en el capítulo sobre qué decir cuando uno está enojado: los dos versículos que cita, los relatos sobre el autocontrol en la ira, la búsqueda de refugio, una súplica y la ablución. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  fr: "Dans le chapitre consacré aux paroles prononcées en colère, le Livre des Souvenirs Divers rassemble les deux versets cités par al-Nawawi, les enseignements sur la maîtrise de soi dans la colère, la recherche de refuge, une invocation et les ablutions. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  tr: "El-Nawavi'nin \"Çeşitli Anma Kitabı\"nda öfkelendiğinde ne söyleneceği bölümünde bahsettiği iki ayet: öfkeyle kendini kontrol etme, sığınak arama, yalvarma ve abdest alma hakkındaki hadisler. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 300}"
  id: "Apa yang disebutkan al-Nawawi dalam \"Kitab Kenangan Lain-lain\" dalam bab tentang apa yang harus dikatakan saat marah: dua ayat yang ia sebutkan, hadits tentang pengendalian diri dalam kemarahan, mencari perlindungan, permohonan, dan wudhu. {sitasi: al-adhkar-nawawi-arnaut-1994 hlm. 300}"
