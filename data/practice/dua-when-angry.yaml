  en: "What is said when angry"
  ur: "غصے کے وقت کیا کہا جائے"
summary:
  ar: "ما أورده النووي في «كتاب الأذكار المتفرقة» في باب ما يقول إذا غضب: الآيتان اللتان يوردهما، وأحاديث ملك النفس عند الغضب، والاستعاذة، والدعاء، والوضوء. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  en: "What al-Nawawi gathers in the Book of Miscellaneous Remembrances in the chapter on what is said when angry: the two verses he cites, the reports on self-control in anger, the seeking of refuge, a supplication and ablution. {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
  ur: "جو نووی نے «کتاب الاذکار المتفرقہ» میں غصے کے وقت کیا کہا جائے کے باب میں جمع کیا: دو آیتیں، غصے میں خود پر قابو کی روایات، پناہ مانگنا، ایک دعا اور وضو۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 300}"
