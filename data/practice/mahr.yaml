id: practice/mahr
class: practice
kind: rite_of_passage
label:
  ar: المهر
  en: Mahr (bridal gift)
  ur: مہر
summary:
  ar: "المهر في تفسير الشعراوي حقّ للمرأة وأجر البُضع في عقد الزواج؛ ويفسّر النحلة في آية النساء بأنها وازع دين لا حكم قضاء، ويحذّر الولي من أخذ شيء منه بسبب الحياء {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2009}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2010}."
  en: "Mahr, the bridal gift, is for al-Sha'rawi a right of the wife and the wage for intimacy in marriage. He reads the word nihla in the Qur'anic verse as a matter of religious conscience rather than a judicial ruling, and warns a guardian against taking any of it out of shame {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2009}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2010}."
  ur: "شعراوی کے نزدیک مہر عورت کا حق اور نکاح میں بُضع کی اجرت ہے۔ وہ آیت میں نِحلہ کے لفظ کو قضا کا حکم نہیں بلکہ دینی ضمیر کی بات قرار دیتے ہیں، اور ولی کو شرم کی وجہ سے اس میں سے کچھ لینے سے خبردار کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2009}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2010}۔"
