issue:
  ar: "هل المهر حق المرأة أم عطية منها، وما حكم تنازلها عنه؟"
  en: "Is the mahr the wife's right or a gift from her, and what follows if she waives part of it?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-right-and-wage
    stance:
      ar: "المهر حق للمرأة وأجر البُضع، والتنازل عنه بطيب نفس جائز"
      en: "The mahr is the wife's right and the wage for intimacy; waiving part of it willingly is permitted"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن المهر حق وأجر بُضع يجب للمرأة، وأن النحلة تفيد الوازع الديني، وأن تنازل الزوجة عنه عن طيب نفس يؤصل العلاقة الزوجية، ويجب الحذر من أخذ الولي منه بسبب الحياء {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2009}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2010}."
      en: "Sha'rawi holds that the mahr is a right and a wage for intimacy owed to the wife, that the word nihla denotes a religious obligation of conscience, and that a wife's willing waiver strengthens the marriage. A guardian must not take any of it out of shame {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2009}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2010}."
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
