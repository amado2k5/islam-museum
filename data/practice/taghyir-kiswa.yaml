summary:
  ar: "تُبدّل كسوة الكعبة مرة في السنة: كساء من حرير أسود يُطرَّز بالآيات بخيوط ذهبية وفضية، وكان يُستبدل يوم عرفة ثم صار في أول المحرم؛ يُفكَّك الكساء القديم ويُقسَّم هدايا للوفود والجهات، وتنسجه دار كسوة الكعبة في مكة."
  en: "The Kaaba's covering is renewed once a year: black silk embroidered with Qur'anic calligraphy in gold and silver thread, changed on the Day of Arafah in earlier practice and now on the first of Muharram; the old kiswah is dismantled and cut into gifts for delegations, and the cloth is woven at the Kiswa Factory in Mecca."
  ur: "کعبہ کا کسوہ سال میں ایک بار بدلا جاتا ہے: کالا ریشم جس پر آیات سونے اور چاندی کے تار سے کڑھی گئیں؛ پہلے یومِ عرفہ اور اب یکم محرم کو تبدیل ہوتا ہے؛ پرانا کسوہ اتار کر وفود کو تحفے میں تقسیم ہوتا ہے اور کپڑا مکہ کی کسوہ فیکٹری میں بنا جاتا ہے۔"
