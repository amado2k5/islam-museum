summary:
  ar: "مجلدات تجمع صورًا وقطعًا خطية أمر بها أو جمعها جهانگير وشاه جهان، بحواش مذهبة، تتعاقب فيها صفحتا صور متقابلتان ثم صفحتا خط، وفيها أعمال إيرانية وتركية ودكنية ومطبوعات أوروبية إلى جانب المغولية {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  en: "Bound volumes of paintings and calligraphies commissioned or collected by Jahangir and Shah Jahan, with gold-painted borders, in which two facing picture pages alternate with two of calligraphy, and Iranian, Turkish, Deccani and European works sit beside Mughal ones {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  ur: "تصاویر اور خطاطی کے قطعات کی جلدیں جو جہانگیر اور شاہ جہان نے بنوائیں یا جمع کیں، سنہری حاشیوں کے ساتھ، جن میں آمنے سامنے تصویروں کے دو صفحات کے بعد خطاطی کے دو صفحات آتے، اور مغل کے ساتھ ایرانی، ترکی، دکنی اور یورپی کام بھی ہیں {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}۔"
