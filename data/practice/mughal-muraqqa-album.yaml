label: { ar: "الألبوم المغولي ⁦(المرقّع)⁩", en: "The Mughal album (muraqqa')", ur: "مغل مرقع ⁦(البم)⁩", es: "El álbum mogol (muraqqa')", fr: "L'album moghol (muraqqa')", tr: "Moğol Albümü (The Patchwork)", id: "Album Mongolia (The Patchwork)" }
summary:
  ar: "مجلدات تجمع صورًا وقطعًا خطية أمر بها أو جمعها جهانگير وشاه جهان، بحواش مذهبة، تتعاقب فيها صفحتا صور متقابلتان ثم صفحتا خط، وفيها أعمال إيرانية وتركية ودكنية ومطبوعات أوروبية إلى جانب المغولية {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  en: "Bound volumes of paintings and calligraphies commissioned or collected by Jahangir and Shah Jahan, with gold-painted borders, in which two facing picture pages alternate with two of calligraphy, and Iranian, Turkish, Deccani and European works sit beside Mughal ones {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  ur: "تصاویر اور خطاطی کے قطعات کی جلدیں جو جہانگیر اور شاہ جہان نے بنوائیں یا جمع کیں، سنہری حاشیوں کے ساتھ، جن میں آمنے سامنے تصویروں کے دو صفحات کے بعد خطاطی کے دو صفحات آتے، اور مغل کے ساتھ ایرانی، ترکی، دکنی اور یورپی کام بھی ہیں {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}۔"
  es: "Volúmenes encuadernados de pinturas y caligrafías encargadas o coleccionadas por Jahangir y Shah Jahan, con bordes pintados en oro, en los que dos páginas de imágenes enfrentadas se alternan con dos de caligrafía, y obras iraníes, turcas, deccanas y europeas se encuentran junto a las mogolas {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  fr: "Volumes reliés de peintures et de calligraphies commandées ou collectionnées par Jahangir et Shah Jahan, avec des bordures peintes à l'or, dans lesquels deux pages d'images en vis-à-vis alternent avec deux de calligraphie, et des œuvres iraniennes, turques, du Deccan et européennes côtoient des œuvres mogholes {cite:beach-grand-mogul-1978 p. 23} {cite:beach-grand-mogul-1978 p. 40}."
  tr: "Jahangir ve Shah Cihan tarafından sipariş edilen veya toplanan görseller ve el yazması eserleri toplayan ciltler, altın kenarlı kenarlar, karşılıklı iki sayfa görüntüler ve ardından İran, Türk ve Dekkan eserlerini içeren iki hat sayfası ile birlikte Moğol baskıları {cite:beach-grand-mogul-1978 s. 23} {cite:beach-grand-mogul-1978 s. 40} ile birlikte Avrupa baskıları yer almaktadır."
  id: "Volume yang mengumpulkan gambar dan naskah yang dipesan atau dikumpulkan oleh Jahangir dan Shah Jahan, dengan margin berlapis emas, dua halaman gambar yang berlawanan dan kemudian dua halaman kaligrafi, berisi karya Iran, Turki, dan Deccan, serta cetakan Eropa di samping karya Mongolia {cite:beach-grand-mogul-1978 hlm. 23} {cite:beach-grand-mogul-1978 hlm. 40}."
