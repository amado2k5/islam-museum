id: practice/dua-at-an-eclipse
class: practice
kind: ritual
label:
  ar: "الأذكار المشروعة في الكسوف"
  en: "Remembrance prescribed at an eclipse"
  ur: "گرہن کے وقت مشروع اذکار"
  es: "Recuerdo prescrito en un eclipse"
  fr: "Souvenir prescrit lors d'une éclipse"
  tr: "Tutulma sırasında öngörülen anma"
  id: "Kenangan yang ditentukan selama gerhana"
summary:
  ar: "ما جمعه النووي في باب الأذكار المشروعة في كسوف الشمس والقمر: الذكر والدعاء والصدقة، وصلاة الكسوف وخطبتها والعتق. {cite:al-adhkar-nawawi-arnaut-1994 p. 174}"
  en: "What al-Nawawi gathers in the chapter on remembrance prescribed at an eclipse of the sun or moon: remembrance, supplication and charity, the eclipse prayer and its address, and the freeing of slaves. {cite:al-adhkar-nawawi-arnaut-1994 p. 174}"
  ur: "نووی نے سورج یا چاند گرہن کے وقت مشروع اذکار کے باب میں جو جمع کیا: ذکر، دعا اور صدقہ، نماز کسوف اور اس کا خطبہ، اور غلام آزاد کرنا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 174}"
  es: "Lo que Al-Nawawi reúne en el capítulo sobre el recuerdo prescrito durante un eclipse solar o lunar: el recuerdo, la súplica y la caridad, la oración del eclipse y su mensaje, y la liberación de los esclavos. {cite:al-adhkar-nawawi-arnaut-1994 p. 174}"
  fr: "Dans le chapitre consacré aux rites prescrits lors d'une éclipse de soleil ou de lune, al-Nawawi rassemble les éléments suivants: le souvenir, la supplication et la charité, la prière de l'éclipse et son adressage, ainsi que l'affranchissement des esclaves. {cite:al-adhkar-nawawi-arnaut-1994 p. 174}"
  tr: "al-Nawawi'nin güneş ve ay tutulmaları için öngörülen anmalarla ilgili bölümde derlediği şey: anma, yalvarış, hayırseverlik, tutulma duası, vaazı ve kurtuluş. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 174}"
  id: "Apa yang disusun al-Nawawi dalam bab tentang peringatan yang ditetapkan untuk gerhana matahari dan bulan: peringatan, permohonan, amal, doa gerhana, khotbahnya, dan pembebasan. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 174}"
