id: practice/dua-talqin-closing-eyes-bereaved
class: practice
kind: ritual
label:
  ar: "تلقين المحتضر وتغميض الميت وما يقال عند المصيبة"
  en: "Prompting the dying, closing the eyes, and what the bereaved say"
  ur: "محتضر کو تلقین، آنکھیں بند کرنا اور مصیبت پر کلمات"
summary:
  ar: "ما جمعه النووي في تلقين المحتضر كلمة التوحيد، وتغميض الميت، وما يقال عنده، وما يقوله من مات له ميت أو بلغه موت صاحبه. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  en: "What al-Nawawi gathers on prompting the dying with the declaration of oneness, closing the eyes of the dead, what is said at his side, and what the bereaved say on a death or on news of a friend's. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  ur: "نووی نے محتضر کو کلمۂ توحید کی تلقین، میت کی آنکھیں بند کرنے، اس کے پاس کیا کہا جائے اور مصیبت یا دوست کی موت کی خبر پر کیا کہا جائے، کے بارے میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
