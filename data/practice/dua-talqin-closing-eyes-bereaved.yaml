id: practice/dua-talqin-closing-eyes-bereaved
class: practice
kind: ritual
label:
  ar: "تلقين المحتضر وتغميض الميت وما يقال عند المصيبة"
  en: "Prompting the dying, closing the eyes, and what the bereaved say"
  ur: "محتضر کو تلقین، آنکھیں بند کرنا اور مصیبت پر کلمات"
  es: "Incitar a los moribundos, cerrar los ojos y lo que dicen los deudos"
  fr: "Les paroles des mourants, la fermeture des yeux et les témoignages des proches"
  tr: "Ölenlere öğretmek ve ölülerin gözlerini kapatmak ve felaket zamanında neler söylendiğini"
  id: "Mengajarkan orang yang sekarat dan menutup mata orang mati serta apa yang dikatakan di masa bencana"
summary:
  ar: "ما جمعه النووي في تلقين المحتضر كلمة التوحيد، وتغميض الميت، وما يقال عنده، وما يقوله من مات له ميت أو بلغه موت صاحبه. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  en: "What al-Nawawi gathers on prompting the dying with the declaration of oneness, closing the eyes of the dead, what is said at his side, and what the bereaved say on a death or on news of a friend's. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  ur: "نووی نے محتضر کو کلمۂ توحید کی تلقین، میت کی آنکھیں بند کرنے، اس کے پاس کیا کہا جائے اور مصیبت یا دوست کی موت کی خبر پر کیا کہا جائے، کے بارے میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  es: "Lo que Al-Nawawi recopila sobre cómo incitar a los moribundos a declarar la unidad, cerrar los ojos de los muertos, lo que se dice a su lado y lo que dicen los deudos ante una muerte o la noticia del fallecimiento de un amigo. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  fr: "Al-Nawawi a recueilli des informations sur les pratiques suivantes: inciter le mourant à la paix par la déclaration d’unité, fermer les yeux du défunt, les paroles prononcées à son chevet et les réactions des proches lors d’un décès ou de l’annonce de la mort d’un ami. {cite:al-adhkar-nawawi-arnaut-1994 p. 143}"
  tr: "El-Nawavi'nin, ölmekte olan kişiye tek tanrıcılık sözünü öğretmek, ölenin gözlerini kapatmak, ona ne söylendiği ve onun için ölen, ölen ya da arkadaşının ölümüne ulaşan kişinin söyledikleri hakkında derlediği şeyler. {cite:al-adhkar-nawawi-arnaut-1994 s. 143}"
  id: "Apa yang disusun al-Nawawi mengenai mengajarkan orang yang sekarat tentang kata-kata monoteisme, menutup mata almarhum, apa yang dikatakan kepadanya, dan apa yang dikatakan oleh orang yang telah mati untuknya atau yang telah meninggal atau yang telah mencapai kematian sahabatnya. {cite:al-adhkar-nawawi-arnaut-1994 hlm. 143}"
