id: practice/greeting-salam
class: practice
kind: etiquette
label: { ar: "التحية بالسلام", en: "Greeting with peace (salam)" }
summary:
  ar: "آداب التحية بالسلام عند اللقاء. عرض الشعراوي في تفسير آية سورة النساء الواردة في التحية أن تُرد التحية بمثلها أو بأحسن منها، وفصّل من يبدأ ومن يرد على من {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}."
  en: "The etiquette of greeting with peace on meeting. In his commentary on the Surat al-Nisa passage about greetings, Sha'rawi says a greeting is returned with its like or something better, and sets out who begins and who answers. {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}"
wings: [living]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف تُرد التحية، ومن يبدأ بها، وكيف يُرد على من يحيي بكلام يحتمل معنى غير الدعاء بالسلامة؟"
  en: "How is a greeting returned, who begins it, and how is a greeting that may carry another meaning answered?"
relations:
  - { type: based_on, target: passage/quran-4-86, sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000, source/fiqh-mawsua-kuwaitiyya-noor-v3] }
perspectives:
  - tradition: sunni
    id: sunni-sharawi-rules
    stance:
      ar: "رد التحية بمثلها أو بأحسن منها، مع أحكام الشعراوي في من يبدأ وفي تحية غير المؤمن"
      en: "Return the greeting with its like or better, with Sha'rawi's rules on who begins and on a greeting from a non-believer"
    summary:
      ar: "يرى الشعراوي أن الآية تأمر برد التحية بمثلها أو بأحسن منها، ويذكر أن العلماء صنّفوا الأحوال: الماشي يسلم على القاعد، والراكب على الماشي، والصغير على الكبير، والمبصر على الكفيف، والقليل على الكثير {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}. ويقول إن النساء يحيين النساء والزوج والمحارم، وإن المرأة الشابة لا تبدأ بالسلام ولا ترد عليه إلا مع من يحفظها، وإن العجوز التي لا إربة لها تبدأ وترد {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2502}. وينقل أن من قال «السلام» من غير المؤمنين يُرد عليه بقول «وعليكم»، وأن من قال كلمة يحتمل معناها السوء يُرد عليه بالمثل حتى لا يُستهزأ بالمسلم {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2502}. ويذكر الشعراوي أن هذه الأحكام من أقوال العلماء ومن بيانه هو، ولم تُعرض بعد أدلتها من مصدر فقهي محدد (needs_source)."
      en: "Sha'rawi reads the verse as ordering a return of greeting with its like or better. He reports that scholars classed the cases: the walker greets the seated, the rider the walker, the young the old, the sighted the blind, the few the many {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}. He says women greet women, a husband and close kin, that a young woman does not begin greeting men, and that an elderly woman past desire may begin and return it {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2501}{cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2502}. He reports that a non-believer's greeting is answered with the words 'and upon you' and that an ambiguous phrase is answered in kind {cite:tafsir-sharawi-khawatir-scan-pp-2501-3000 p.2502}. These rules are his report of the scholars' classes and his own explanation; their legal sources are not yet set out here (needs_source)."
    holders: [person/muhammad-mutawalli-al-shaarawi]
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: academic
