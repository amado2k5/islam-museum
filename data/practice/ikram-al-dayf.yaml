label:
  ar: "إكرام الضيف"
  en: "Honouring the guest (ikram al-dayf)"
  ur: "مہمان کی تکریم (ikram al-dayf)"
  es: "Honrar al huésped (ikram al-dayf)"
  fr: "Honorer l'invité (ikram al-dayf)"
  tr: "Konuk Onur Ödülü"
  id: "Penghormatan Tamu"
summary:
  ar: "إكرام الضيف عند العرب كما يعرضه الشيخ عمر عبد الكافي: الترحيب دون سؤال، والكرم بلا تكلف، وأن يشاركه المضيف طعامه، مع قصص وأقوال منها ما لم يُعرف قائله."
  en: "Honouring the guest among the Arabs as Sheikh Omar Abdelkafy presents it: welcome without questioning, generosity without pretence, and the host sharing his food with the guest, with stories and sayings, some of them unattributed."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق عرب میں مہمان کی تکریم: بغیر سوال کے خیر مقدم، بے تکلف سخاوت، اور میزبان کا مہمان کے ساتھ کھانا، کچھ قصے اور اقوال جن کے قائل معلوم نہیں۔"
  es: "Entre los árabes, honrar al huésped es como lo presenta el jeque Omar Abdelkafy: una bienvenida sin cuestionamientos, generosidad sin pretensiones, y el anfitrión compartiendo su comida con el invitado, con historias y dichos, algunos de ellos anónimos."
  fr: "L’accueil de l’invité chez les Arabes, tel que le présente le cheikh Omar Abdelkafy: un accueil sans questionnement, une générosité sans prétention, et l’hôte partageant sa nourriture avec l’invité, avec des histoires et des dictons, dont certains ne sont pas attribués."
  tr: "Şeyh Ömer Abdul Kafi tarafından sunulan Araplar arasında misafiri onurlandırmak: sormadan karşılamak, gösterişsiz cömertlik ve ev sahibinin yemeğini, konuşmacının bilmediği hikaye ve sözlerle birlikte paylaşmasını sağlamak."
  id: "Menghormati tamu di antara orang Arab, seperti yang disampaikan oleh Sheikh Omar Abdul Kafi: menyambut tanpa meminta, kemurahan hati tanpa pura-pura, dan meminta tuan rumah membagikan makanannya, beserta cerita dan ungkapan yang tidak diketahui pembicara."
