summary:
  ar: "إكرام الضيف عند العرب كما يعرضه الشيخ عمر عبد الكافي: الترحيب دون سؤال، والكرم بلا تكلف، وأن يشاركه المضيف طعامه، مع قصص وأقوال منها ما لم يُعرف قائله."
  en: "Honouring the guest among the Arabs as Sheikh Omar Abdelkafy presents it: welcome without questioning, generosity without pretence, and the host sharing his food with the guest, with stories and sayings, some of them unattributed."
  ur: "شیخ عمر عبدالکافی کے بیان کے مطابق عرب میں مہمان کی تکریم: بغیر سوال کے خیر مقدم، بے تکلف سخاوت، اور میزبان کا مہمان کے ساتھ کھانا، کچھ قصے اور اقوال جن کے قائل معلوم نہیں۔"
