  ur: "سعی ⁦(صفا اور مروہ کے درمیان چلنا)⁩"
summary:
  ar: "السعي بين الصفا والمروة سبعًا في الحج والعمرة، إحياءً لذكرى هاجر وهي تطلب الماء لابنها إسماعيل."
  en: "Walking seven times between Safa and Marwa in hajj and umrah, in memory of Hagar seeking water for her son Ishmael."
  es: "Caminar siete veces entre Safa y Marwa durante el Hajj y la Umrah, en memoria de Agar buscando agua para su hijo Ismael."
  fr: "Effectuant sept allers-retours entre Safa et Marwa lors du hajj et de l'umra, en mémoire d'Agar cherchant de l'eau pour son fils Ismaël."
  ur: "حج اور عمرہ میں صفا اور مروہ کے درمیان سات بار چلنا، ہاجرہ کی یاد میں اپنے بیٹے اسماعیل کے لیے پانی مانگنا۔"
