summary:
  ar: "ما جمعه النووي في الإعلام بالموت والنهي عن النعي، وما يقال في غسل الميت وتكفينه، وأحكام صلاة الجنازة وأذكارها الأولى. {cite:al-adhkar-nawawi-arnaut-1994 p. 154}"
  en: "What al-Nawawi gathers on announcing a death and the forbidden pre-Islamic announcing, what is done while washing and shrouding, and the first rules and words of the funeral prayer. {cite:al-adhkar-nawawi-arnaut-1994 p. 154}"
  ur: "نووی نے موت کی اطلاع اور ممنوعہ نعی، غسل و کفن کے وقت کے آداب اور نماز جنازہ کے ابتدائی احکام و اذکار کے بارے میں جو جمع کیا۔ {cite:al-adhkar-nawawi-arnaut-1994 p. 154}"
  es: "Lo que Al-Nawawi recopila sobre el anuncio de una muerte y el anuncio preislámico prohibido, lo que se hace al lavar y amortajar, y las primeras reglas y palabras de la oración fúnebre. {cite:al-adhkar-nawawi-arnaut-1994 p. 154}"
  fr: "Ce qu'al-Nawawi rassemble sur l'annonce d'un décès et l'interdiction de cette annonce avant l'islam, les rites funéraires (lavage et linceul), ainsi que les premières règles et les premières paroles de la prière funéraire. {cite:al-adhkar-nawawi-arnaut-1994 p. 154}"
  tr: "El-Nawawi'nin ölüm ilan ederken ve ölüm ilanlarının yasaklanmasında, ölenin yıkanması ve örtülmesiyle ilgili söyledikleri, cenaze namazının ve ilk anmalarının kurallarını derledikleri. {kaynak:al-adhkar-nawawi-arnaut-1994 s. 154}"
  id: "Apa yang disusun al-Nawawi dalam mengumumkan kematian dan larangan obituari, apa yang dikatakan tentang mencuci dan menyelimuti almarhum, serta putusan doa pemakaman dan peringatan awalnya. {Sitasi:al-Adhkar-Nawawi-Arnaut-1994 hlm. 154}"
