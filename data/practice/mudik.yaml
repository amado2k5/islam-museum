summary:
  ar: "العودة الجماعية إلى القرى قبل عيد الفطر في إندونيسيا: يترك عشرات الملايين المدن الكبرى لقضاء «ليبران» مع أهلهم، فيشكل أكبر تنقلات البشر السنوية في العالم؛ توزع الحكومة مواعيد القطارات وتسير قوافل العودة لأيام. في ماليزيا مقابلتها «balik kampung»."
