summary:
  ar: "شركة تسجيلات وإنتاج موسيقي مقرها إنجلترا، أسسها سنة 2000 أربعة رواد أعمال من إنجلترا والولايات المتحدة، ولها مكاتب في لندن والقاهرة وكاليفورنيا؛ أطلقت مسيرة سامي يوسف وماهر زين ومسعود كرتس وهاريس جي، وأصدرت «المعلم» 2003 و«أمتي» 2005 و«الحمد لله» 2009 و«سامحني» 2012، واستحوذت بي فور يو على حصة الأغلبية فيها سنة 2018."
  en: "An England-based record label and music production company founded in 2000 by four entrepreneurs from England and the United States, with offices in London, Cairo and California; it launched the careers of Sami Yusuf, Maher Zain, Mesut Kurtis and Harris J, released Al-Mu'allim (2003), My Ummah (2005), Thank You Allah (2009) and Forgive Me (2012), and passed to a majority stake held by B4U in 2018."
  ur: "انگلینڈ میں قائم ریکارڈ لیبل اور موسیقی پروڈکشن کمپنی، جسے 2000 میں انگلینڈ اور امریکہ کے چار کاروباری افراد نے قائم کیا اور جس کے دفاتر لندن، قاہرہ اور کیلیفورنیا میں ہیں؛ اس نے سامی یوسف، ماہر زین، مسعود کرتس اور ہیرس جے کے کیریئر کا آغاز کیا اور «المعلم»، «مائی اُمّہ»، «تھینک یو اللہ» اور «فارگیو می» جاری کیے۔"
  es: "Sello discográfico y productora musical con sede en Inglaterra, fundado en 2000 por cuatro emprendedores de Inglaterra y Estados Unidos, con oficinas en Londres, El Cairo y California; impulsó las carreras de Sami Yusuf, Maher Zain, Mesut Kurtis y Harris J, lanzó Al-Mu'allim (2003), My Ummah (2005), Thank You Allah (2009) y Forgive Me (2012), y pasó a manos de B4U, que ostentaba una participación mayoritaria, en 2018."
  fr: "Label discographique et société de production musicale basé en Angleterre, fondé en 2000 par quatre entrepreneurs anglais et américains, avec des bureaux à Londres, au Caire et en Californie; il a lancé les carrières de Sami Yusuf, Maher Zain, Mesut Kurtis et Harris J, a sorti Al-Mu'allim (2003), My Ummah (2005), Thank You Allah (2009) et Forgive Me (2012), et est passé à une participation majoritaire détenue par B4U en 2018."
  tr: "İngiltere merkezli bir kayıt ve müzik prodüksiyon şirketi olan ve 2000 yılında İngiltere ve Amerika Birleşik Devletleri'nden dört girişimci tarafından kurulan şirket, Londra, Kahire ve Kaliforniya'da ofisleri bulunmaktadır; Sami Yusuf, Maher Zain, Mesut Kurtis ve Harris G'nin kariyerlerini başlatmış ve 2003'te \"The Teacher\", 2005'te \"My Nation\", 2009'da \"Alhamdulillah\" ve 2012'de \"Forgive Me\" albümlerini yayınlamıştır ve B4U 2018'de şirketin çoğunluk hissesini satın almıştır."
  id: "Sebuah perusahaan rekaman dan produksi musik yang berbasis di Inggris, didirikan pada tahun 2000 oleh empat pengusaha dari Inggris dan Amerika Serikat, dengan kantor di London, Kairo, dan California; meluncurkan karier Sami Yusuf, Maher Zain, Mesut Kurtis, dan Harris G, serta merilis \"The Teacher\" (2003), \"My Nation\" (2005), \"Alhamdulillah\" (2009), dan \"Forgive Me\" (2012), dan B4U mengakuisisi saham mayoritas di perusahaan tersebut pada tahun 2018."
