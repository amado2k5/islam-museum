summary:
  ar: "شركة تسجيلات وإنتاج موسيقي مقرها إنجلترا، أسسها سنة 2000 أربعة رواد أعمال من إنجلترا والولايات المتحدة، ولها مكاتب في لندن والقاهرة وكاليفورنيا؛ أطلقت مسيرة سامي يوسف وماهر زين ومسعود كرتس وهاريس جي، وأصدرت «المعلم» 2003 و«أمتي» 2005 و«الحمد لله» 2009 و«سامحني» 2012، واستحوذت بي فور يو على حصة الأغلبية فيها سنة 2018."
  en: "An England-based record label and music production company founded in 2000 by four entrepreneurs from England and the United States, with offices in London, Cairo and California; it launched the careers of Sami Yusuf, Maher Zain, Mesut Kurtis and Harris J, released Al-Mu'allim (2003), My Ummah (2005), Thank You Allah (2009) and Forgive Me (2012), and passed to a majority stake held by B4U in 2018."
  ur: "انگلینڈ میں قائم ریکارڈ لیبل اور موسیقی پروڈکشن کمپنی، جسے 2000 میں انگلینڈ اور امریکہ کے چار کاروباری افراد نے قائم کیا اور جس کے دفاتر لندن، قاہرہ اور کیلیفورنیا میں ہیں؛ اس نے سامی یوسف، ماہر زین، مسعود کرتس اور ہیرس جے کے کیریئر کا آغاز کیا اور «المعلم»، «مائی اُمّہ»، «تھینک یو اللہ» اور «فارگیو می» جاری کیے۔"
