label:
  ar: بنك المعاملات الإندونيسي
  en: Bank Muamalat Indonesia
  ur: بینک معاملات انڈونیشیا
summary:
  ar: بنك تجاري إندونيسي في جاكرتا يعمل وفق مبادئ الصيرفة الإسلامية، تأسس في 1 نوفمبر 1991 بمبادرة من مجلس العلماء الإندونيسي
    برعاية الحكومة، وبدأ العمل في 1 مايو 1992؛ تملك هيئة إدارة صندوق الحج الإندونيسية أغلب أسهمه.
  en: An Indonesian commercial bank in Jakarta operating on Islamic banking principles, founded on 1 November 1991 on the
    initiative of the Indonesian Council of Ulama under the auspices of the government, and operating from 1 May 1992; Indonesia's
    Hajj Fund Management Agency holds most of its shares.
  ur: جکارتہ کا انڈونیشیائی تجارتی بینک جو اسلامی بینکاری کے اصولوں پر چلتا ہے؛ یکم نومبر 1991 کو حکومت کی سرپرستی میں انڈونیشیائی
    مجلسِ علماء کی تحریک پر قائم ہوا اور یکم مئی 1992 سے کام کر رہا ہے؛ انڈونیشیا کی حج فنڈ مینجمنٹ ایجنسی اس کے زیادہ تر
    حصص کی مالک ہے۔
