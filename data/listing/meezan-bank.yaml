label:
  ar: بنك ميزان
  en: Meezan Bank
  ur: میزان بینک
summary:
  ar: بنك إسلامي باكستاني مقره كراتشي، أُسس سنة 1997 بنكا استثماريا إسلاميا باسم الميزان للاستثمار، وصار بنكا تجاريا بعد شرائه
    أعمال سوسيتيه جنرال في باكستان سنة 2002؛ هو أكبر بنك إسلامي في باكستان وثاني أكبر بنوكها بالقيمة السوقية.
  en: A Pakistani Islamic bank based in Karachi, founded in 1997 as an Islamic investment bank, Al-Meezan Investment Bank,
    which became a commercial bank after buying Société Générale's Pakistan operations in 2002; it is Pakistan's largest Islamic
    bank and its second-largest bank by market capitalisation.
  ur: کراچی میں قائم پاکستانی اسلامی بینک، جو 1997 میں المیزان انویسٹمنٹ بینک کے نام سے اسلامی سرمایہ کاری بینک کے طور پر
    قائم ہوا اور 2002 میں سوسیئتے جنرال کے پاکستانی کاروبار کی خریداری کے بعد تجارتی بینک بنا؛ پاکستان کا سب سے بڑا اسلامی
    بینک اور مارکیٹ سرمایہ کاری کے لحاظ سے دوسرا بڑا بینک۔
