summary:
  ar: بنك إسلامي باكستاني مقره كراتشي، أُسس سنة 1997 بنكا استثماريا إسلاميا باسم الميزان للاستثمار، وصار بنكا تجاريا بعد شرائه
    أعمال سوسيتيه جنرال في باكستان سنة 2002؛ هو أكبر بنك إسلامي في باكستان وثاني أكبر بنوكها بالقيمة السوقية.
  en: A Pakistani Islamic bank based in Karachi, founded in 1997 as an Islamic investment bank, Al-Meezan Investment Bank,
    which became a commercial bank after buying Société Générale's Pakistan operations in 2002; it is Pakistan's largest Islamic
    bank and its second-largest bank by market capitalisation.
  ur: کراچی میں قائم پاکستانی اسلامی بینک، جو 1997 میں المیزان انویسٹمنٹ بینک کے نام سے اسلامی سرمایہ کاری بینک کے طور پر
    قائم ہوا اور 2002 میں سوسیئتے جنرال کے پاکستانی کاروبار کی خریداری کے بعد تجارتی بینک بنا؛ پاکستان کا سب سے بڑا اسلامی
    بینک اور مارکیٹ سرمایہ کاری کے لحاظ سے دوسرا بڑا بینک۔
  es: "Al-Meezan Investment Bank, un banco islámico pakistaní con sede en Karachi, fue fundado en 1997 como banco de inversión islámico y se convirtió en banco comercial tras adquirir las operaciones de Société Générale en Pakistán en 2002. Es el mayor banco islámico de Pakistán y el segundo banco más grande del país por capitalización bursátil."
  fr: "Al-Meezan Investment Bank est une banque islamique pakistanaise basée à Karachi, fondée en 1997 en tant que banque d'investissement islamique, devenue banque commerciale après le rachat des activités pakistanaises de Société Générale en 2002; c'est la plus grande banque islamique du Pakistan et sa deuxième banque en termes de capitalisation boursière."
  tr: "Merkezi Karaçi'de bulunan Pakistanlı bir İslami banka olan Al Mizan Investment, 1997 yılında İslami yatırım bankası olarak kurulmuş ve 2002 yılında Societe Generale'nin Pakistan'daki faaliyetlerini devraldıktan sonra ticari banka haline gelmiştir; Pakistan'ın en büyük İslami bankası ve piyasa değeri bakımından ikinci büyük bankasıdır."
  id: "Sebuah bank Islam Pakistan yang berbasis di Karachi, didirikan pada tahun 1997 sebagai bank investasi Islam bernama Al Mizan Investment, dan menjadi bank komersial setelah mengakuisisi bisnis Societe Generale di Pakistan pada tahun 2002; bank ini merupakan bank Islam terbesar di Pakistan dan bank terbesar kedua berdasarkan kapitalisasi pasarnya."
