summary:
  ar: "معهد بحثي أمريكي مستقل غير ربحي أسسه عمر سليمان سنة 2016 في إرفنغ بتكساس، يقدّم موضوعات إسلامية دقيقة لجمهور من خارج الأوساط الأكاديمية في بحوث ورسوم ومقاطع مرئية، ولقناته على يوتيوب أكثر من 1.7 مليون مشترك؛ وأطلق سنة 2021 منهجًا مدرسيًا للمدارس الإسلامية في أمريكا الشمالية."
  en: "An independent American non-profit research institute founded by Omar Suleiman in 2016 in Irving, Texas, presenting complex Islamic topics to audiences outside academia in research papers, infographics and videos; its YouTube channel has more than 1.7 million subscribers, and in 2021 it launched a curriculum for North American Islamic schools."
  ur: "آزاد امریکی غیر منافع بخش تحقیقی ادارہ جسے عمر سلیمان نے 2016 میں ارونگ، ٹیکساس میں قائم کیا؛ پیچیدہ اسلامی موضوعات کو غیر علمی حلقوں کے لیے تحقیقی مقالات، انفوگرافکس اور ویڈیوز میں پیش کرتا ہے؛ یوٹیوب پر 17 لاکھ سے زیادہ سبسکرائبر؛ 2021 میں شمالی امریکا کے اسلامی اسکولوں کے لیے نصاب جاری کیا۔"
