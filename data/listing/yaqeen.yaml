label:
  ar: "معهد يقين للبحوث الإسلامية"
  en: "Yaqeen Institute for Islamic Research"
  ur: "یقین انسٹی ٹیوٹ برائے اسلامی تحقیق"
  es: "Instituto Yaqeen para la Investigación Islámica"
  fr: "Institut Yaqeen de recherche islamique"
  tr: "Yaqeen İslam Araştırmaları Enstitüsü"
  id: "Institut Yaqeen untuk Penelitian Islam"
summary:
  ar: "معهد بحثي أمريكي مستقل غير ربحي أسسه عمر سليمان سنة 2016 في إرفنغ بتكساس، يقدّم موضوعات إسلامية دقيقة لجمهور من خارج الأوساط الأكاديمية في بحوث ورسوم ومقاطع مرئية، ولقناته على يوتيوب أكثر من 1.7 مليون مشترك؛ وأطلق سنة 2021 منهجًا مدرسيًا للمدارس الإسلامية في أمريكا الشمالية."
  en: "An independent American non-profit research institute founded by Omar Suleiman in 2016 in Irving, Texas, presenting complex Islamic topics to audiences outside academia in research papers, infographics and videos; its YouTube channel has more than 1.7 million subscribers, and in 2021 it launched a curriculum for North American Islamic schools."
  ur: "آزاد امریکی غیر منافع بخش تحقیقی ادارہ جسے عمر سلیمان نے 2016 میں ارونگ، ٹیکساس میں قائم کیا؛ پیچیدہ اسلامی موضوعات کو غیر علمی حلقوں کے لیے تحقیقی مقالات، انفوگرافکس اور ویڈیوز میں پیش کرتا ہے؛ یوٹیوب پر 17 لاکھ سے زیادہ سبسکرائبر؛ 2021 میں شمالی امریکا کے اسلامی اسکولوں کے لیے نصاب جاری کیا۔"
  es: "Instituto de investigación estadounidense independiente y sin ánimo de lucro, fundado por Omar Suleiman en 2016 en Irving, Texas, que presenta temas islámicos complejos a un público ajeno al ámbito académico mediante artículos de investigación, infografías y vídeos; su canal de YouTube cuenta con más de 1,7 millones de suscriptores y, en 2021, lanzó un programa de estudios para escuelas islámicas norteamericanas."
  fr: "Un institut de recherche américain indépendant à but non lucratif, fondé par Omar Suleiman en 2016 à Irving, au Texas, qui présente des sujets islamiques complexes à un public non universitaire à travers des articles de recherche, des infographies et des vidéos; sa chaîne YouTube compte plus de 1,7 million d'abonnés et, en 2021, il a lancé un programme d'études pour les écoles islamiques nord-américaines."
  tr: "Omar Souleyman tarafından 2016 yılında Irving, Teksas'ta kurulan bağımsız, kar amacı gütmeyen bir Amerikan araştırma enstitüsü olan bu kurum, araştırma, illüstrasyon ve videolar aracılığıyla akademik olmayan bir kitleye doğru İslami konuları sunmaktadır. YouTube kanalının 1,7 milyondan fazla abonesi bulunmaktadır; ve 2021 yılında Kuzey Amerika'daki İslami okullar için bir okul müfredatı başlatmıştır."
  id: "Lembaga penelitian independen nirlaba Amerika yang didirikan oleh Omar Souleyman pada tahun 2016 di Irving, Texas, ini menyajikan topik-topik Islam yang akurat kepada khalayak non-akademik melalui penelitian, ilustrasi, dan video. Saluran YouTube-nya memiliki lebih dari 1,7 juta pelanggan; dan pada tahun 2021 meluncurkan kurikulum sekolah untuk sekolah-sekolah Islam di Amerika Utara."
