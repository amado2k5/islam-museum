summary:
  ar: بنك إسلامي كامل في سلطنة عمان، بدأ العمل في 30 سبتمبر 2013 بعد المرسوم السلطاني رقم 69/2012 الذي أدخل الصيرفة الإسلامية
    في قانون البنوك؛ رأس ماله المدفوع 100 مليون ريال عماني.
  en: A full-fledged Islamic bank in Oman, launched on 30 September 2013 after Royal Decree No. 69/2012 brought Islamic banking
    into the banking law; its paid-up capital is 100 million Omani rials.
  ur: عمان کا مکمل اسلامی بینک، جس نے 30 ستمبر 2013 کو کام شروع کیا، شاہی فرمان نمبر 69/2012 کے بعد جس نے بینکاری قانون میں
    اسلامی بینکاری شامل کی؛ اس کا ادا شدہ سرمایہ 10 کروڑ عمانی ریال ہے۔
