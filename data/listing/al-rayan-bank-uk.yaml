summary:
  ar: بنك تجاري بريطاني في لندن، أُسس في أغسطس 2004 باسم بنك بريطانيا الإسلامي ليقدّم منتجات متوافقة مع الشريعة لعملاء من
    كل الأديان، وصار جزءا من مجموعة مصرف الريان القطري سنة 2014.
  en: A British commercial bank in London, established in August 2004 as the Islamic Bank of Britain to offer Sharia-compliant
    products to customers of any faith; it became part of Qatar's Masraf Al Rayan group in 2014.
  ur: لندن کا برطانوی تجارتی بینک، جو اگست 2004 میں اسلامک بینک آف برٹن کے نام سے ہر مذہب کے صارفین کو شریعت کے مطابق مصنوعات
    دینے کے لیے قائم ہوا؛ 2014 میں قطر کے مصرف الریان گروپ کا حصہ بنا۔
