summary:
  ar: بنك إسلامي بنغلاديشي في دكا قائم على الشريعة، بدأ العمل في 22 نوفمبر 1995 باسم بنك الاستثمار الاجتماعي وتغيّر اسمه سنة
    2009؛ تغيّر مجلس إدارته سنة 2017 بعد أن اشترت مجموعة إس عالم نصف أسهمه، وواجه أزمة سنة 2022.
  en: A Shari'ah-based Islamic bank in Dhaka, Bangladesh, operating from 22 November 1995 as Social Investment Bank and renamed
    in 2009; its board changed in 2017 after S. Alam Group bought half its shares, and it faced a crisis in 2022.
  ur: ڈھاکہ کا شریعت پر مبنی بنگلہ دیشی اسلامی بینک، جو 22 نومبر 1995 کو سوشل انویسٹمنٹ بینک کے نام سے شروع ہوا اور 2009 میں
    نام بدلا؛ 2017 میں ایس عالم گروپ کے آدھے حصص خریدنے کے بعد بورڈ بدلا، اور 2022 میں بحران آیا۔
  es: "Un banco islámico basado en la Sharia, con sede en Dhaka, Bangladesh, que opera desde el 22 de noviembre de 1995 como Social Investment Bank y que cambió de nombre en 2009; su junta directiva cambió en 2017 después de que S. Alam Group comprara la mitad de sus acciones, y se enfrentó a una crisis en 2022."
  fr: "Une banque islamique basée sur la charia à Dhaka, au Bangladesh, opérant depuis le 22 novembre 1995 sous le nom de Social Investment Bank et renommée en 2009; son conseil d'administration a changé en 2017 après que le groupe S. Alam a acheté la moitié de ses actions, et elle a fait face à une crise en 2022."
  tr: "Bangladeş'in Dakka şehrinde Şeriat hukukuna dayalı bir İslami banka olan kuruluş, 22 Kasım 1995'te Sosyal Yatırım Bankası adıyla faaliyete başladı ve 2009'da adını değiştirdi; S Alam Grubu'nun hisselerinin yarısını satın almasının ardından 2017'de yönetim kurulu değişti ve 2022'de bir krizle karşı karşıya kaldı."
  id: "Sebuah bank Islam Bangladesh di Dhaka yang berbasis pada hukum Syariah, mulai beroperasi pada 22 November 1995 dengan nama Social Investment Bank dan mengganti namanya pada tahun 2009; dewan direksinya berubah pada tahun 2017 setelah S Alam Group membeli setengah dari sahamnya, dan menghadapi krisis pada tahun 2022."
