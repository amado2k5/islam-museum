summary:
  ar: بنك إسلامي بنغلاديشي في دكا قائم على الشريعة، بدأ العمل في 22 نوفمبر 1995 باسم بنك الاستثمار الاجتماعي وتغيّر اسمه سنة
    2009؛ تغيّر مجلس إدارته سنة 2017 بعد أن اشترت مجموعة إس عالم نصف أسهمه، وواجه أزمة سنة 2022.
  en: A Shari'ah-based Islamic bank in Dhaka, Bangladesh, operating from 22 November 1995 as Social Investment Bank and renamed
    in 2009; its board changed in 2017 after S. Alam Group bought half its shares, and it faced a crisis in 2022.
  ur: ڈھاکہ کا شریعت پر مبنی بنگلہ دیشی اسلامی بینک، جو 22 نومبر 1995 کو سوشل انویسٹمنٹ بینک کے نام سے شروع ہوا اور 2009 میں
    نام بدلا؛ 2017 میں ایس عالم گروپ کے آدھے حصص خریدنے کے بعد بورڈ بدلا، اور 2022 میں بحران آیا۔
