label:
  ar: بنك سلام الصومالي
  en: Salaam Somali Bank
  ur: سلام صومالی بینک
summary:
  ar: بنك إسلامي كامل في مقديشو، أُسس في أكتوبر 2009 أولَ بنك يعمل في الصومال منذ 1991، وأدخل إليها الخدمات المصرفية عبر الهاتف
    وأول صرّافات آلية؛ نال جائزة «ذا بانكر» لبنك العام الإسلامي الدولي سنة 2024.
  en: A fully fledged Islamic bank in Mogadishu, established in October 2009 as the first bank to operate in Somalia since
    1991, which brought mobile banking and the first cash machines to the country; it received The Banker's international
    Islamic Bank of the Year award in 2024.
  ur: موغادیشو کا مکمل اسلامی بینک، جو اکتوبر 2009 میں 1991 کے بعد صومالیہ میں کام کرنے والے پہلے بینک کے طور پر قائم ہوا
    اور ملک میں موبائل بینکاری اور پہلی اے ٹی ایم مشینیں لایا؛ 2024 میں دی بینکر کا بین الاقوامی اسلامی بینک آف دی ایئر ایوارڈ
    ملا۔
