summary:
  ar: "مؤسسة أمريكية غير ربحية لتعليم العلوم الإسلامية بالإنجليزية، أسسها محمد الشريف في هيوستن بتكساس سنة 2002، تقدّم دورات مكثفة في عطلتي نهاية أسبوع أو في عطلة واحدة، وأكثر مدرّسيها من خريجي الجامعة الإسلامية بالمدينة المنورة، ومنهم ياسر قاضي وعمر سليمان؛ واجهت تدقيقًا علنيًا بعد 2009 وردّت عليه بإدانة التطرف."
  en: "An American non-profit teaching Islamic studies in English, founded by Muhammad AlShareef in Houston, Texas, in 2002, offering intensive two-weekend and one-weekend seminars; most of its instructors are graduates of the Islamic University of Madinah, among them Yasir Qadhi and Omar Suleiman; it faced public scrutiny after 2009 and answered it by condemning extremism."
  ur: "انگریزی میں اسلامی علوم پڑھانے والا امریکی غیر منافع بخش ادارہ، جسے محمد الشریف نے 2002 میں ہیوسٹن، ٹیکساس میں قائم کیا؛ دو یا ایک ویک اینڈ کے گہرے سیمینار؛ اکثر اساتذہ جامعہ اسلامیہ مدینہ منورہ کے فاضل، جن میں یاسر قاضی اور عمر سلیمان ہیں؛ 2009 کے بعد عوامی جانچ کا سامنا کیا اور انتہا پسندی کی مذمت سے جواب دیا۔"
