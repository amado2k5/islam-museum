label:
  ar: مصرف الإنماء
  en: Alinma Bank
  ur: مصرف الانماء
summary:
  ar: بنك سعودي مساهم مقره الرياض، أُسس بالمرسوم الملكي رقم م/15 في 28 مارس 2006 برأس مال قدره 20 مليار ريال، ويقدّم خدمات
    مصرفية واستثمارية متوافقة مع الشريعة؛ جاء العاشر في قائمة فوربس الشرق الأوسط لأعلى 30 بنكا قيمة لسنة 2025.
  en: A Saudi joint-stock bank based in Riyadh, formed under Royal Decree No. M/15 of 28 March 2006 with share capital of
    SAR 20 billion, offering Shariah-compliant banking and investment services; it was 10th on Forbes Middle East's 30 Most
    Valuable Banks 2025.
  ur: ریاض میں قائم سعودی مشترکہ سرمایہ بینک، جو 28 مارچ 2006 کے شاہی فرمان نمبر م/15 سے 20 ارب ریال کے سرمائے سے قائم ہوا
    اور شریعت کے مطابق بینکاری و سرمایہ کاری کی خدمات دیتا ہے؛ فوربس مڈل ایسٹ کی 2025 کی 30 سب سے قیمتی بینکوں کی فہرست میں
    دسواں رہا۔
