label:
  ar: بنك الشريعة الإندونيسي
  en: Bank Syariah Indonesia
  ur: بینک شریعہ انڈونیشیا
summary:
  ar: بنك إسلامي حكومي إندونيسي مقره جاكرتا، بدأ في 1 فبراير 2021 بدمج ثلاثة بنوك شريعة تابعة لبنوك الدولة ⁦(بنك شريعة مانديري
    وبي إن آي شريعة وبي آر آي شريعة)⁩؛ عُدّ في يونيو 2024 أكبر بنك إسلامي في العالم بعدد العملاء، وصار شركة دولة ⁦(برسيرو)⁩
    في يناير 2026.
  en: A state-owned Indonesian Islamic bank based in Jakarta, which began on 1 February 2021 by merging the sharia banks of
    three state banks (Bank Syariah Mandiri, BNI Syariah and BRI Syariah); in June 2024 it was the world's largest Islamic
    bank by customer numbers, and it became a state-owned Persero in January 2026.
  ur: جکارتہ میں قائم انڈونیشیا کا سرکاری اسلامی بینک، جو 1 فروری 2021 کو تین سرکاری بینکوں کے شریعہ بینکوں کے انضمام سے شروع
    ہوا؛ جون 2024 میں صارفین کی تعداد کے لحاظ سے دنیا کا سب سے بڑا اسلامی بینک تھا، اور جنوری 2026 میں سرکاری ادارہ (پرسیرو)
    بنا۔
