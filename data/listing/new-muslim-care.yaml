summary:
  ar: "موقع لدعم المسلمين الجدد فيه مقاطع مصورة عن أساسيات الإسلام وكيفية أداء الصلاة وجولة في القرآن وأحكام استقبال رمضان، وصفحات للموارد و«نادي الشهادة»."
  en: "A support site for new Muslims with videos on the fundamentals of Islam, what to say in prayer, a tour of the Qur'an and welcoming Ramadan, plus a resources page and a 'Shahadah Club' page."
  ur: "نئے مسلمانوں کے لیے معاونتی سائٹ جس میں اسلام کی بنیادی باتوں، نماز میں کیا پڑھا جائے، قرآن کے تعارف اور رمضان کے استقبال پر ویڈیوز ہیں، ساتھ وسائل اور «شہادہ کلب» کے صفحات بھی ہیں۔"
  fr: "Un site de soutien aux nouveaux musulmans, avec des vidéos sur les fondements de l'islam, ce qu'on dit dans la prière, un tour du Coran et l'accueil du Ramadan, ainsi qu'une page de ressources et une page « Shahadah Club »."
  es: "Un sitio de apoyo a los nuevos musulmanes con vídeos sobre los fundamentos del islam, qué se dice en la oración, un recorrido por el Corán y la bienvenida al Ramadán, además de una página de recursos y otra del «Shahadah Club»."
  tr: "Yeni Müslümanlar için bir destek sitesi: İslam'ın temelleri, namazda ne söylenir, Kur'an'a genel bakış ve Ramazan'ı karşılama konularında videolar; ayrıca kaynaklar ve «Shahadah Club» sayfaları."
  id: "Situs dukungan untuk Muslim baru dengan video tentang dasar-dasar Islam, bacaan dalam salat, tur Al-Qur'an dan menyambut Ramadan, serta halaman sumber daya dan halaman «Shahadah Club»."
