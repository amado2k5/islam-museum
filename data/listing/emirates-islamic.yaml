id: listing/emirates-islamic
class: listing
kind: company
label:
  ar: الإمارات الإسلامي
  en: Emirates Islamic
  ur: امارات اسلامی
summary:
  ar: بنك إماراتي في دبي أُسس سنة 2004 لتقديم الخدمات المصرفية وفق أحكام الشريعة، وهو أحد أربعة بنوك إسلامية في الإمارة؛ شُطب
    من سوق دبي المالي سنة 2025 بعد أن تملّك بنك الإمارات دبي الوطني بقية أسهمه، وسمّته يوروموني أفضل بنك إسلامي رقمي في العالم
    لسنة 2025.
  en: An Emirati bank in Dubai, established in 2004 to provide banking in line with Shari'a principles, one of the emirate's
    four Islamic banks; it was delisted from the Dubai Financial Market in 2025 after Emirates NBD acquired its remaining
    shares, and Euromoney named it the world's best Islamic digital bank for 2025.
  ur: دبئی کا اماراتی بینک، جو 2004 میں شریعت کے اصولوں کے مطابق بینکاری کے لیے قائم ہوا اور امارت کے چار اسلامی بینکوں میں
    سے ایک ہے؛ 2025 میں امارات این بی ڈی کے باقی حصص خرید لینے کے بعد دبئی فنانشل مارکیٹ سے خارج ہوا، اور یورومنی نے اسے 2025
    کا دنیا کا بہترین اسلامی ڈیجیٹل بینک قرار دیا۔
