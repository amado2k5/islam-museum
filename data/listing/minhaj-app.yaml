label:
  ar: "منهاج ⁦(تطبيق رابطة العالم الإسلامي)⁩"
  en: "Minhaj (Muslim World League app)"
  ur: "منہاج ⁦(رابطہ عالمِ اسلامی کی ایپ)⁩"
summary:
  ar: "تطبيق ومنصة رقمية لرابطة العالم الإسلامي طُوّر مع شركة عِلم ودُشّن في مكة في 27 نوفمبر 2025، بعد أن أجاز المجمع الفقهي الإسلامي فكرته بقراره رقم 23 في 13 شوال 1445هـ؛ يجمع المصحف ومواقيت الصلاة والقبلة والأذكار والاستشارات الشرعية والتعليم وحاسبتي الزكاة والميراث والمجتمعات الافتراضية، بسبع لغات، ويخاطب المسلمين في بلاد الأقليات خاصة."
  en: "An app and digital platform of the Muslim World League, built with the Elm company and launched in Mecca on 27 November 2025 after the Islamic Fiqh Council approved the idea in its resolution 23 of 13 Shawwal 1445 AH; it gathers the mushaf, prayer times, qibla, adhkar, religious consultations, courses, zakat and inheritance calculators and virtual communities, in seven languages, and addresses Muslims in minority countries in particular."
  ur: "رابطہ عالمِ اسلامی کی ایپ اور ڈیجیٹل پلیٹ فارم، کمپنی عِلم کے ساتھ تیار کیا گیا اور 27 نومبر 2025 کو مکہ میں افتتاح ہوا، جب مجمع فقہی اسلامی نے 13 شوال 1445ھ کی اپنی قرارداد 23 سے اس کے خیال کی منظوری دی تھی؛ مصحف، اوقاتِ نماز، قبلہ، اذکار، شرعی مشاورت، تعلیم، زکوٰۃ اور میراث کے حساب کار اور ورچوئل برادریاں، سات زبانوں میں، خاص طور پر اقلیتی ممالک کے مسلمانوں کے لیے۔"
