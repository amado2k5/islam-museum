id: listing/iium
class: listing
kind: university
label:
  ar: الجامعة الإسلامية العالمية بماليزيا
  en: International Islamic University Malaysia (IIUM)
  ur: بین الاقوامی اسلامی یونیورسٹی ملائیشیا
summary:
  ar: جامعة حكومية ماليزية تأسست في 23 مايو 1983 برعاية ثماني حكومات ومنظمة التعاون الإسلامي، مقرها غومباك قرب كوالالمبور
    ولها ستة فروع أخرى؛ تدرّس بالإنجليزية والعربية في أربع عشرة كلية \u2066\u2066⁦(«كلّية»)⁩\u2069\u2069، وتخرّج فيها منذ 1987 أكثر من سبعين ألفا من
    أكثر من مئة بلد.
  en: A Malaysian public university established on 23 May 1983 under the sponsorship of eight governments and the Organisation
    of Islamic Cooperation, headquartered at Gombak near Kuala Lumpur with six other campuses; it teaches in English and Arabic
    across fourteen faculties ("kulliyyah"), and since 1987 has produced more than 70,000 graduates from over a hundred countries.
  ur: ملائیشیا کی سرکاری یونیورسٹی جو 23 مئی 1983 کو آٹھ حکومتوں اور اسلامی تعاون تنظیم کی سرپرستی میں قائم ہوئی؛ صدر مقام
    کوالالمپور کے قریب گومباک میں اور چھ دیگر کیمپس؛ چودہ کلیات میں انگریزی اور عربی میں تعلیم، اور 1987 سے سو سے زیادہ ممالک
    کے ستر ہزار سے زیادہ فارغ التحصیل۔
