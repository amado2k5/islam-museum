summary:
  ar: "منصة رقمية وتطبيق جوال سعودي أطلقته وزارة الحج والعمرة في 26 سبتمبر 2022 خلفًا لتطبيق «اعتمرنا»، لتصاريح العمرة وحجز زيارة الروضة الشريفة وتسجيل الحج وتأشيرات العمرة والسكن والنقل، بخمس وعشرين لغة؛ أعلنت الوزارة 30 مليون تنزيل في سبتمبر 2025، وقال الوزير في مارس 2026 إن مستخدميه تجاوزوا 51 مليونًا."
  en: "A Saudi digital platform and mobile app launched by the Ministry of Hajj and Umrah on 26 September 2022 as the successor of the Eatmarna app, for Umrah permits, bookings to visit al-Rawda al-Sharifa, Hajj registration, Umrah visas, lodging and transport, in twenty-five languages; the ministry announced 30 million downloads in September 2025, and the minister said in March 2026 that it had passed 51 million users."
  ur: "سعودی ڈیجیٹل پلیٹ فارم اور موبائل ایپ جسے وزارتِ حج و عمرہ نے 26 ستمبر 2022 کو «اعتمرنا» ایپ کی جگہ جاری کیا؛ عمرہ پرمٹ، روضۂ شریفہ کی زیارت کی بکنگ، حج رجسٹریشن، عمرہ ویزا، رہائش اور سفر کے لیے، پچیس زبانوں میں۔ وزارت نے ستمبر 2025 میں 3 کروڑ ڈاؤن لوڈ کا اعلان کیا، اور وزیر نے مارچ 2026 میں کہا کہ صارفین 5 کروڑ 10 لاکھ سے بڑھ گئے۔"
