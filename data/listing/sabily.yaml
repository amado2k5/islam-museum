summary:
  ar: "توزيعة لينكس مبنية على أوبونتو صُمّمت لمستخدميها المسلمين، صدرت أولًا باسم «أوبونتو الإصدار الإسلامي» في أكتوبر 2007 ثم باسم «سبيلي» من مايو 2009، وكان آخر إصداراتها «أحد» في ديسمبر 2011؛ جاءت بدعم العربية وبرامج إسلامية جاهزة منها برنامج «ذكر» لدراسة القرآن و«منبر» لمواقيت الصلاة وتقويم هجري وحاسبة للزكاة."
  en: "An Ubuntu-based Linux distribution designed for Muslim users, first released as Ubuntu Muslim Edition in October 2007 and as Sabily from May 2009, its last release, 'Uhud', coming in December 2011; it shipped with Arabic support and Islamic software out of the box, among them the Qur'an study tool Zekr, the prayer-times program Minbar, a Hijri calendar and a zakat calculator."
  ur: "اوبنٹو پر مبنی لینکس ڈسٹری بیوشن جو مسلمان صارفین کے لیے بنائی گئی؛ پہلے اکتوبر 2007 میں «اوبنٹو مسلم ایڈیشن» اور مئی 2009 سے «سبیلی» کے نام سے آئی، آخری اجرا «احد» دسمبر 2011 میں؛ عربی سہولت اور اسلامی پروگرام ساتھ تھے، جیسے قرآن کے مطالعے کا «ذکر»، اوقاتِ نماز کا «منبر»، ہجری تقویم اور زکوٰۃ کا حساب کار۔"
