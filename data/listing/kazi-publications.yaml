summary:
  ar: "ناشر وموزع إسلامي في شيكاغو، يقدّم نفسه أقدم ناشر إسلامي في أمريكا الشمالية؛ بدأت بذوره نحو 1970 في متجر محمود كازي، وتولّاه لياقت علي منذ 1972، ونشر أول كتبه «كتاب الأسماء الإسلامية» سنة 1974، وأول طبعة لترجمة الهلالي وخان للقرآن سنة 1977، و«القرآن السامي» لليلى بختيار سنة 2007، وله سلسلة «الكتب الكبرى في العالم الإسلامي»."
  en: "An Islamic publisher and distributor in Chicago that calls itself the oldest in North America; its seeds were planted around 1970 in Mahmoud Kazi's shop, Liaquat Ali ran it from 1972, and it published its first book, Book of Muslim Names, in 1974, the first edition of the Hilali–Khan Qur'an translation in 1977 and Laleh Bakhtiar's Sublime Quran in 2007, with a Great Books of the Islamic World series."
  ur: "شکاگو کا اسلامی ناشر و تقسیم کار جو خود کو شمالی امریکہ کا قدیم ترین قرار دیتا ہے؛ اس کی ابتدا تقریباً 1970 میں محمود کازی کی دکان سے ہوئی، 1972 سے لیاقت علی نے اسے چلایا، 1974 میں پہلی کتاب «بک آف مسلم نیمز»، 1977 میں ہلالی و خان کے ترجمۂ قرآن کی پہلی اشاعت اور 2007 میں لیلیٰ بختیار کا «دی سبلائم قرآن» شائع کیا، اور «گریٹ بکس آف دی اسلامک ورلڈ» سلسلہ اس کا ہے۔"
