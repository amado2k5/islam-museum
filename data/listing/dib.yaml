label:
  ar: بنك دبي الإسلامي
  en: Dubai Islamic Bank
  ur: دبئی اسلامک بینک
summary:
  ar: بنك إماراتي مقره دبي، أسسه سعيد بن أحمد لوتاه سنة 1975، يتبع أحكام الشريعة في كل أنشطته، وهو أكبر بنك إسلامي في الإمارات
    بالأصول ومدرج في سوق دبي المالي؛ استحوذ على نور بنك سنة 2020، وله أذرع في البوسنة وباكستان وكينيا وإندونيسيا والسودان.
  en: An Emirati bank based in Dubai, founded by Saeed bin Ahmed Lootah in 1975, which follows Sharia principles across all
    its activities; it is the UAE's largest Islamic bank by assets and is listed on the Dubai Financial Market, acquired Noor
    Bank in 2020, and has operations in Bosnia, Pakistan, Kenya, Indonesia and Sudan.
  ur: دبئی میں قائم اماراتی بینک، جسے سعید بن احمد لوتاہ نے 1975 میں قائم کیا؛ اپنی تمام سرگرمیوں میں شریعت کے اصولوں پر چلتا
    ہے، اثاثوں کے لحاظ سے امارات کا سب سے بڑا اسلامی بینک ہے اور دبئی فنانشل مارکیٹ میں درج ہے؛ 2020 میں نور بینک حاصل کیا،
    اور بوسنیا، پاکستان، کینیا، انڈونیشیا اور سوڈان میں کام کرتا ہے۔
