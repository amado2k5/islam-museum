label:
  ar: بنك البحرين الإسلامي
  en: Bahrain Islamic Bank
  ur: بحرین اسلامی بینک
  es: "Banco Islámico de Baréin"
  fr: "Banque islamique de Bahreïn"
  tr: "Bahreyn İslami Bankası"
  id: "Bank Islam Bahrain"
summary:
  ar: بنك تجاري في المنامة، تأسس في 7 مارس 1979 وبدأ العمل في 2 محرم 1400 الموافق 22 نوفمبر 1979، وهو أول بنك إسلامي في البحرين،
    يخضع لرقابة مصرف البحرين المركزي ومدرج في بورصة البحرين.
  en: A commercial bank in Manama, founded on 7 March 1979 and operating from 2 Muharram 1400, 22 November 1979; it is the
    first Islamic bank in Bahrain, supervised by the Central Bank of Bahrain and listed on the Bahrain Bourse.
  ur: منامہ کا تجارتی بینک، جو 7 مارچ 1979 کو قائم ہوا اور 2 محرم 1400، یعنی 22 نومبر 1979 سے کام کر رہا ہے؛ بحرین کا پہلا
    اسلامی بینک، جو مرکزی بینک بحرین کی نگرانی میں ہے اور بحرین بورس میں درج ہے۔
  es: "Banco comercial en Manama, fundado el 7 de marzo de 1979 y en funcionamiento desde el 2 de Muharram de 1400 (22 de noviembre de 1979); es el primer banco islámico de Bahréin, supervisado por el Banco Central de Bahréin y cotizado en la Bolsa de Bahréin."
  fr: "Banque commerciale à Manama, fondée le 7 mars 1979 et en activité depuis le 2 Muharram 1400 (22 novembre 1979); il s'agit de la première banque islamique de Bahreïn, supervisée par la Banque centrale de Bahreïn et cotée à la Bourse de Bahreïn."
  tr: "Manama'da bulunan, 7 Mart 1979'da kurulan ve 2 Muharrem 1400 (22 Kasım 1979) tarihinde faaliyetlerine başlayan bir ticari bankadır. Bahreyn'in ilk İslami bankası olup, Bahreyn Merkez Bankası tarafından denetlenmekte ve Bahreyn Borsası'nda işlem görmektedir."
  id: "Sebuah bank komersial di Manama, didirikan pada tanggal 7 Maret 1979 dan mulai beroperasi pada tanggal 2 Muharram 1400, yang bertepatan dengan tanggal 22 November 1979. Bank ini merupakan bank Islam pertama di Bahrain, diatur oleh Bank Sentral Bahrain dan terdaftar di Bursa Efek Bahrain."
