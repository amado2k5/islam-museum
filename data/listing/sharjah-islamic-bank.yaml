summary:
  ar: بنك إماراتي إسلامي متوسط الحجم في الشارقة، كان اسمه بنك الشارقة الوطني، ويقدّم للأفراد والشركات والمؤسسات منتجات متوافقة
    مع الشريعة ويعمل وفق أحكامها؛ أطلق حسابه الرقمي سنة 2021.
  en: A medium-sized Emirati Islamic bank in Sharjah, formerly the National Bank of Sharjah, which offers Sharia-compliant
    products to individuals, companies and institutions and operates according to Sharia; it launched its digital account
    in 2021.
  ur: شارجہ کا درمیانے درجے کا اماراتی اسلامی بینک، جو پہلے نیشنل بینک آف شارجہ کہلاتا تھا؛ افراد، کمپنیوں اور اداروں کو شریعت
    کے مطابق مصنوعات دیتا ہے؛ 2021 میں اس نے ڈیجیٹل اکاؤنٹ شروع کیا۔
