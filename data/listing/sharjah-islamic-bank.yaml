label:
  ar: مصرف الشارقة الإسلامي
  en: Sharjah Islamic Bank
  ur: شارجہ اسلامی بینک
  es: "Banco Islámico de Sharjah"
  fr: "Banque islamique de Sharjah"
  tr: "Şarjah İslami Bankası"
  id: "Bank Islam Sharjah"
summary:
  ar: بنك إماراتي إسلامي متوسط الحجم في الشارقة، كان اسمه بنك الشارقة الوطني، ويقدّم للأفراد والشركات والمؤسسات منتجات متوافقة
    مع الشريعة ويعمل وفق أحكامها؛ أطلق حسابه الرقمي سنة 2021.
  en: A medium-sized Emirati Islamic bank in Sharjah, formerly the National Bank of Sharjah, which offers Sharia-compliant
    products to individuals, companies and institutions and operates according to Sharia; it launched its digital account
    in 2021.
  ur: شارجہ کا درمیانے درجے کا اماراتی اسلامی بینک، جو پہلے نیشنل بینک آف شارجہ کہلاتا تھا؛ افراد، کمپنیوں اور اداروں کو شریعت
    کے مطابق مصنوعات دیتا ہے؛ 2021 میں اس نے ڈیجیٹل اکاؤنٹ شروع کیا۔
  es: "Un banco islámico emiratí de tamaño mediano en Sharjah, anteriormente conocido como National Bank of Sharjah, que ofrece productos que cumplen con la Sharia a particulares, empresas e instituciones y opera de acuerdo con la Sharia; lanzó su cuenta digital en 2021."
  fr: "Une banque islamique émiratie de taille moyenne à Sharjah, anciennement la Banque nationale de Sharjah, qui propose des produits conformes à la charia aux particuliers, aux entreprises et aux institutions et opère selon la charia; elle a lancé son compte numérique en 2021."
  tr: "Şarjah'ta bulunan, eskiden Şarjah Ulusal Bankası olarak bilinen orta ölçekli bir İslami banka; bireylere, şirketlere ve kurumlara Şeriat'a uygun ürünler sunmaktadır; dijital hesap hizmetini 2021 yılında başlatmıştır."
  id: "Sebuah bank Islam berukuran menengah di Sharjah, yang sebelumnya dikenal sebagai National Bank of Sharjah, menawarkan produk yang sesuai dengan syariah kepada individu, perusahaan, dan lembaga; bank ini meluncurkan rekening digitalnya pada tahun 2021."
