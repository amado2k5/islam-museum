summary:
  ar: مؤسسة حكومية تايلاندية في بانكوك، أُسست سنة 2002 بقانون البنك الإسلامي التايلاندي، تعمل وفق مبادئ الشريعة وتخدم العملاء
    من كل الأديان، وتملك الدولة أكثر من 98% منها.
  en: A Thai state enterprise in Bangkok, established in 2002 under the Islamic Bank of Thailand Act, which operates by Sharia
    principles and serves customers of every religion; the state controls more than 98% of it.
  ur: بینکاک کا تھائی سرکاری ادارہ، جو 2002 میں اسلامک بینک آف تھائی لینڈ ایکٹ کے تحت قائم ہوا؛ شریعت کے اصولوں پر چلتا ہے
    اور ہر مذہب کے صارفین کی خدمت کرتا ہے؛ ریاست اس کے 98 فیصد سے زیادہ حصص کی مالک ہے۔
