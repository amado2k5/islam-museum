id: listing/digital-quran-player
class: listing
kind: device
label:
  ar: "مشغلات المصحف الرقمي ⁦(أجهزة «إقرأ» وأمثالها)⁩"
  en: "Digital Qur'an players (Iqra'a and similar devices)"
  ur: "ڈیجیٹل قرآن پلیئر ⁦(«اقرأ» اور اس جیسے آلات)⁩"
summary:
  ar: "أجهزة إلكترونية مخصصة لعرض نص القرآن وتشغيل تلاواته المسجلة متزامنة مع النص، مع ترجمات وأدعية ومواقيت صلاة واتجاه القبلة؛ انتشرت في إندونيسيا خاصة، وذكرت رويترز في سبتمبر 2007 أن كثيرًا منها تصنعه شركة كورية جنوبية باسم «إقرأ» بأسعار بين 900 ألف و1.9 مليون روبية، ثم انتقل الاهتمام إلى تطبيقات الهواتف الذكية."
  en: "Electronic devices dedicated to showing the text of the Qur'an and playing recorded recitations in step with it, with translations, prayers, prayer times and the qibla; they spread above all in Indonesia, where Reuters reported in September 2007 that many were made by a South Korean company under the brand Iqra'a, priced from 900,000 to 1.9 million rupiah, before attention moved to smartphone apps."
  ur: "قرآن کا متن دکھانے اور اس کے ساتھ ریکارڈ شدہ تلاوت چلانے کے مخصوص برقی آلات، تراجم، دعاؤں، اوقاتِ نماز اور قبلے کے ساتھ؛ خاص طور پر انڈونیشیا میں پھیلے، جہاں رائٹرز نے ستمبر 2007 میں بتایا کہ ان میں سے بہت سے جنوبی کوریا کی ایک کمپنی «اقرأ» کے نام سے بناتی ہے، قیمت 9 لاکھ سے 19 لاکھ روپیہ؛ بعد میں توجہ سمارٹ فون ایپس کی طرف چلی گئی۔"
