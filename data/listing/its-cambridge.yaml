summary:
  ar: "دار نشر بريطانية في كامبريدج مسجلة جمعية خيرية تعليمية، أسستها سنة 1981 جماعة من العلماء منهم عائشة غراي هنري، تنشر كتبًا أكاديمية وعامة عن الإسلام، منها سيرة النبي لمارتن لينغز، وسلسلة الغزالي التي نال مجلدان منها جائزة التصميم والإنتاج البريطانية في 1991 و1993، وسلسلة الحقوق والحريات الأساسية في الإسلام لمحمد هاشم كمالي."
  en: "A British publishing house in Cambridge, registered as an educational charity, founded in 1981 by a group of scholars including Aisha Gray Henry; it publishes academic and general books on Islam, among them Martin Lings's biography of the Prophet, the Ghazali Series, two volumes of which won the British Book Design and Production Award in 1991 and 1993, and Mohammad Hashim Kamali's Fundamental Rights and Liberties in Islam series."
  ur: "کیمبرج کا برطانوی اشاعتی ادارہ، جو تعلیمی خیراتی ادارے کے طور پر رجسٹرڈ ہے، 1981 میں علما کی ایک جماعت نے قائم کیا جن میں عائشہ گرے ہنری شامل تھیں؛ اسلام پر علمی اور عمومی کتابیں شائع کرتا ہے، جن میں مارٹن لنگز کی سیرت، غزالی سلسلہ، جس کی دو جلدوں نے 1991 اور 1993 میں برطانوی کتاب ڈیزائن و پروڈکشن انعام جیتا، اور محمد ہاشم کمالی کا بنیادی حقوق و آزادیوں کا سلسلہ ہیں۔"
