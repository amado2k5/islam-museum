label: { ar: "جمعية النصوص الإسلامية", en: "Islamic Texts Society", ur: "اسلامک ٹیکسٹس سوسائٹی", es: "Sociedad de Textos Islámicos", fr: "Société des textes islamiques", tr: "İslami Metinler Derneği", id: "Asosiasi Teks Islam" }
summary:
  ar: "دار نشر بريطانية في كامبريدج مسجلة جمعية خيرية تعليمية، أسستها سنة 1981 جماعة من العلماء منهم عائشة غراي هنري، تنشر كتبًا أكاديمية وعامة عن الإسلام، منها سيرة النبي لمارتن لينغز، وسلسلة الغزالي التي نال مجلدان منها جائزة التصميم والإنتاج البريطانية في 1991 و1993، وسلسلة الحقوق والحريات الأساسية في الإسلام لمحمد هاشم كمالي."
  en: "A British publishing house in Cambridge, registered as an educational charity, founded in 1981 by a group of scholars including Aisha Gray Henry; it publishes academic and general books on Islam, among them Martin Lings's biography of the Prophet, the Ghazali Series, two volumes of which won the British Book Design and Production Award in 1991 and 1993, and Mohammad Hashim Kamali's Fundamental Rights and Liberties in Islam series."
  ur: "کیمبرج کا برطانوی اشاعتی ادارہ، جو تعلیمی خیراتی ادارے کے طور پر رجسٹرڈ ہے، 1981 میں علما کی ایک جماعت نے قائم کیا جن میں عائشہ گرے ہنری شامل تھیں؛ اسلام پر علمی اور عمومی کتابیں شائع کرتا ہے، جن میں مارٹن لنگز کی سیرت، غزالی سلسلہ، جس کی دو جلدوں نے 1991 اور 1993 میں برطانوی کتاب ڈیزائن و پروڈکشن انعام جیتا، اور محمد ہاشم کمالی کا بنیادی حقوق و آزادیوں کا سلسلہ ہیں۔"
  es: "Editorial británica con sede en Cambridge, registrada como organización benéfica educativa, fundada en 1981 por un grupo de académicos, entre ellos Aisha Gray Henry; publica libros académicos y de divulgación sobre el Islam, como la biografía del Profeta escrita por Martin Lings, la serie Ghazali, dos de cuyos volúmenes ganaron el Premio Británico de Diseño y Producción de Libros en 1991 y 1993, y la serie Derechos Fundamentales y Libertades en el Islam de Mohammad Hashim Kamali."
  fr: "Maison d'édition britannique basée à Cambridge, enregistrée comme organisme de bienfaisance éducatif, fondée en 1981 par un groupe d'universitaires dont Aisha Gray Henry, elle publie des ouvrages universitaires et généraux sur l'islam, parmi lesquels la biographie du Prophète par Martin Lings, la série Ghazali, dont deux volumes ont remporté le British Book Design and Production Award en 1991 et 1993, et la série « Droits et libertés fondamentaux en islam » de Mohammad Hashim Kamali."
  tr: "Cambridge'de bulunan ve eğitim amaçlı bir hayır kurumu olarak kayıtlı olan, 1981 yılında Aisha Gray Henry de dahil olmak üzere bir grup akademisyen tarafından kurulan bir İngiliz yayınevi, Martin Lings'in Peygamberin Biyografisi, iki cildi 1991 ve 1993 yıllarında İngiliz Tasarım ve Üretim Ödülü'nü kazanan Al-Ghazali serisi ve Muhammed Hashim Kamali'nin İslam'da Temel Haklar ve Özgürlükler serisi de dahil olmak üzere İslam hakkında akademik ve genel kitaplar yayınlamaktadır."
  id: "Sebuah penerbit Inggris di Cambridge, yang terdaftar sebagai badan amal pendidikan, didirikan pada tahun 1981 oleh sekelompok cendekiawan termasuk Aisha Gray Henry, menerbitkan buku-buku akademis dan umum tentang Islam, termasuk Biografi Nabi karya Martin Lings, seri Al-Ghazali, yang dua jilidnya memenangkan Penghargaan Desain dan Produksi Inggris pada tahun 1991 dan 1993, dan seri Hak dan Kebebasan Fundamental dalam Islam karya Muhammad Hashim Kamali."
