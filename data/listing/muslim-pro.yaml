label:
  ar: "مسلم برو"
  en: "Muslim Pro"
  ur: "مسلم پرو"
summary:
  ar: "تطبيق لمواقيت الصلاة والأذان والقبلة والقرآن تنشره شركة بِتس ميديا في سنغافورة، صدر على iOS سنة 2010 وعلى أندرويد سنة 2011؛ استحوذت عليه سنة 2017 شركتا استثمار ماليزية وسنغافورية، وأضاف خدمة البث «قلب بوكس» سنة 2022، وتقول الشركة إن تنزيلاته تجاوزت 190 مليونًا بحلول رمضان 2026. كشف تحقيق لمجلة مذربورد في نوفمبر 2020 أنه كان يرسل بيانات الموقع إلى وسيط يبيعها لمتعاقدين مع الجيش الأمريكي، فأعلن وقف ذلك."
  en: "A prayer-times, adhan, qibla and Qur'an app published by Bitsmedia in Singapore, released on iOS in 2010 and on Android in 2011; it was acquired in 2017 by a Malaysian and a Singaporean investment firm, added the streaming service Qalbox in 2022, and the company says its downloads passed 190 million by Ramadan 2026. A Motherboard investigation of November 2020 found it sending location data to a broker that sold data to US military contractors, after which it said it would stop."
  ur: "نماز کے اوقات، اذان، قبلہ اور قرآن کی ایپ جسے سنگاپور میں بِٹس میڈیا شائع کرتی ہے؛ 2010 میں iOS اور 2011 میں اینڈرائیڈ پر آئی؛ 2017 میں ایک ملائیشیائی اور ایک سنگاپوری سرمایہ کار ادارے نے اسے حاصل کیا، 2022 میں اسٹریمنگ سروس «قلب باکس» شامل کی، اور کمپنی کے مطابق رمضان 2026 تک ڈاؤن لوڈ 19 کروڑ سے بڑھ گئے۔ نومبر 2020 میں مدر بورڈ کی تحقیق نے پایا کہ یہ مقام کا ڈیٹا ایک ایسے دلال کو بھیجتی تھی جو امریکی فوج کے ٹھیکیداروں کو ڈیٹا بیچتا تھا، جس کے بعد اس نے یہ بند کرنے کا اعلان کیا۔"
