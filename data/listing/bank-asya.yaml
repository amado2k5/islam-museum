summary:
  ar: بنك مشاركة تركي سابق في إسطنبول، عمل من 1996 إلى 2016، ويُعدّ على نطاق واسع مرتبطا بحركة غولن؛ ألغت هيئة تنظيم الأعمال
    المصرفية ترخيصه في 22 يوليو 2016، وأُعلن إفلاسه في 16 نوفمبر 2017.
  en: A former Turkish participation bank in Istanbul that operated from 1996 to 2016 and is widely considered tied to the
    Gülen movement; the banking regulator cancelled its licence on 22 July 2016, and it was declared bankrupt on 16 November
    2017.
  ur: استنبول کا سابق ترک شراکتی بینک، جو 1996 سے 2016 تک کام کرتا رہا اور جسے بڑے پیمانے پر گولن تحریک سے وابستہ سمجھا جاتا
    ہے؛ بینکاری نگران ادارے نے 22 جولائی 2016 کو اس کا لائسنس منسوخ کیا، اور 16 نومبر 2017 کو اسے دیوالیہ قرار دیا گیا۔
