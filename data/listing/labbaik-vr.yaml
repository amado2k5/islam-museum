  ar: "لبيك في آر ⁦(محاكي الحج بالواقع الافتراضي)⁩"
  en: "Labbaik VR (virtual-reality Hajj simulator)"
  ur: "لبیک وی آر ⁦(ورچوئل رئیلٹی حج سمیولیٹر)⁩"
summary:
  ar: "تطبيق باكستاني لمحاكاة الحج والعمرة بالواقع الافتراضي من شركة في كراتشي، يعرض المشاعر في مكة والمدينة بزاوية 360 درجة اعتمادًا على قياسات دقيقة و80 ألف صورة بدقة 8K، لتدريب الحجاج على المناسك قبل السفر؛ قالت الشركة لعرب نيوز في يوليو 2019 إنها درّبت به 30 ألف حاج مع شركات الحج، وتصفه بأنه «أول محاكٍ للحج والعمرة بالواقع الافتراضي في العالم»."
  en: "A Pakistani virtual-reality Hajj and Umrah simulator app by a Karachi company, showing the holy sites of Mecca and Medina in 360 degrees from exact measurements and 80,000 8K photographs, to train pilgrims in the rites before they travel; the company told Arab News in July 2019 that it had trained 30,000 pilgrims with it through Hajj operators, and calls it 'the world's first virtual reality Hajj and Umrah simulator'."
  ur: "کراچی کی کمپنی کی پاکستانی ورچوئل رئیلٹی حج و عمرہ سمیولیٹر ایپ، جو مکہ اور مدینہ کے مقدس مقامات کو 360 درجے میں درست پیمائشوں اور 80 ہزار 8K تصاویر سے دکھاتی ہے تاکہ حاجی سفر سے پہلے مناسک کی تربیت لیں؛ کمپنی نے جولائی 2019 میں عرب نیوز کو بتایا کہ اس نے حج آپریٹرز کے ساتھ 30 ہزار حاجیوں کو تربیت دی، اور اسے «دنیا کا پہلا ورچوئل رئیلٹی حج و عمرہ سمیولیٹر» کہتی ہے۔"
