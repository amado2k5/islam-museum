summary:
  ar: بنك خاص بنغلاديشي متوافق مع الشريعة في دكا، أُسس في 25 يوليو 2013 باسم بنك إن آر بي غلوبال للبنغلاديشيين المقيمين في
    الخارج، وصار بنكا إسلاميا كاملا باسمه الحالي في 3 يناير 2021.
  en: A Bangladeshi sharia-compliant private bank in Dhaka, founded on 25 July 2013 as NRB Global Bank for non-resident Bangladeshis,
    which became a full Islamic bank under its present name on 3 January 2021.
  ur: ڈھاکہ کا شریعت کے مطابق نجی بنگلہ دیشی بینک، جو 25 جولائی 2013 کو بیرونِ ملک مقیم بنگلہ دیشیوں کے لیے این آر بی گلوبل
    بینک کے نام سے قائم ہوا اور 3 جنوری 2021 کو موجودہ نام کے ساتھ مکمل اسلامی بینک بنا۔
