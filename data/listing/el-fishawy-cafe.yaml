  tr: "Khan al-Khalili'deki en eski kafe (yaklaşık 1773) - iki buçuk yüzyıldır gece gündüz hizmet veriyor; Kahire'nin kalbinde yazarlar ve ziyaretçiler için bir uğrak noktası."
  id: "Kafe tertua di Khan al-Khalili (sekitar tahun 1773) — beroperasi siang dan malam selama dua setengah abad; sebuah tempat persinggahan bagi para penulis dan pengunjung di jantung kota Kairo."
