label:
  ar: بنك جائز
  en: Jaiz Bank
  ur: جائز بینک
summary:
  ar: بنك نيجيري مقره أبوجا يعمل وفق مبادئ الصيرفة الإسلامية دون فائدة، وهو أول بنك لا ربوي في نيجيريا؛ أُسس سنة 2003 باسم
    جائز إنترناشونال، ونال ترخيصه الإقليمي في 11 نوفمبر 2011 وبدأ العمل في 6 يناير 2012، ثم الترخيص الوطني سنة 2016.
  en: A Nigerian bank headquartered in Abuja that operates on Islamic, non-interest banking principles, the first non-interest
    bank in Nigeria; founded in 2003 as Jaiz International, it was licensed as a regional bank on 11 November 2011, opened
    on 6 January 2012 and received a national licence in 2016.
  ur: ابوجا میں قائم نائیجیریائی بینک جو اسلامی، بلا سود بینکاری کے اصولوں پر چلتا ہے اور نائیجیریا کا پہلا بلا سود بینک ہے؛
    2003 میں جائز انٹرنیشنل کے نام سے قائم ہوا، 11 نومبر 2011 کو علاقائی لائسنس ملا، 6 جنوری 2012 کو کام شروع کیا اور 2016
    میں قومی لائسنس ملا۔
