  en: A Shariah-based Islamic bank in Dhaka, Bangladesh, founded on 27 September 1995, whose shariah council checks its compliance;
    Bangladesh Bank dissolved its board in 2024.
  ur: ڈھاکہ کا شریعت پر مبنی بنگلہ دیشی اسلامی بینک، جو 27 ستمبر 1995 کو قائم ہوا؛ اس کی شرعی کونسل اس کے کاموں کی جانچ کرتی
    ہے؛ 2024 میں بنگلہ دیش بینک نے اس کا بورڈ تحلیل کیا۔
