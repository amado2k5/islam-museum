  en: A Pakistani Islamic bank in Karachi, which grew in 2006 out of Rupali Bank's Pakistan operations, traded as Arif Habib
    Bank and then Summit Bank, and was converted into an Islamic bank as Bank Makramah in November 2023.
  ur: کراچی کا پاکستانی اسلامی بینک، جو 2006 میں روپالی بینک کے پاکستانی کاروبار سے بنا، پہلے عارف حبیب بینک اور پھر سمٹ بینک
    کہلایا، اور نومبر 2023 میں بینک مکرمہ کے نام سے اسلامی بینک بنا۔
