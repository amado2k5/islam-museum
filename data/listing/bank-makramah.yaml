summary:
  ar: بنك إسلامي باكستاني في كراتشي، نشأ سنة 2006 من أعمال بنك روبالي في باكستان، وحمل اسمَي بنك عارف حبيب ثم بنك سميت، وتحوّل
    إلى بنك إسلامي باسم بنك مكرمة في نوفمبر 2023.
  en: A Pakistani Islamic bank in Karachi, which grew in 2006 out of Rupali Bank's Pakistan operations, traded as Arif Habib
    Bank and then Summit Bank, and was converted into an Islamic bank as Bank Makramah in November 2023.
  ur: کراچی کا پاکستانی اسلامی بینک، جو 2006 میں روپالی بینک کے پاکستانی کاروبار سے بنا، پہلے عارف حبیب بینک اور پھر سمٹ بینک
    کہلایا، اور نومبر 2023 میں بینک مکرمہ کے نام سے اسلامی بینک بنا۔
  es: "Un banco islámico pakistaní en Karachi, que surgió en 2006 de las operaciones de Rupali Bank en Pakistán, operó bajo los nombres de Arif Habib Bank y luego Summit Bank, y se convirtió en un banco islámico con el nombre de Bank Makramah en noviembre de 2023."
  fr: "Une banque islamique pakistanaise basée à Karachi, qui s'est développée en 2006 à partir des opérations pakistanaises de Rupali Bank, a opéré sous le nom d'Arif Habib Bank puis de Summit Bank, et a été convertie en banque islamique sous le nom de Bank Makramah en novembre 2023."
  tr: "Pakistan'da Rupali Bank'ın faaliyetleri kapsamında 2006 yılında kurulan ve Karaçi'de bulunan bu İslami banka, önce Arif Habib Bank, ardından Smith Bank adını aldı ve Kasım 2023'te Makrama Bank adıyla İslami banka haline geldi."
  id: "Sebuah bank Islam Pakistan di Karachi, didirikan pada tahun 2006 dari bisnis Rupali Bank di Pakistan, awalnya bernama Arif Habib Bank dan kemudian Smith Bank, dan menjadi bank Islam bernama Makrama Bank pada November 2023."
