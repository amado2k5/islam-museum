label:
  ar: "إسلاميك فايندر ⁦(وتطبيق «أذان»)⁩"
  en: "IslamicFinder (and the Athan app)"
  ur: "اسلامک فائنڈر ⁦(اور «اذان» ایپ)⁩"
summary:
  ar: "موقع وتطبيق لمواقيت الصلاة والأذان والقبلة والتقويم الهجري، بدأ على الشبكة قبل ديسمبر 1998 دليلًا للمراكز الإسلامية والمساجد في الولايات المتحدة مع مواقيت الصلاة المحلية، وكانت تديره سنة 2001 مؤسسة Wasat.com غير الربحية؛ تطبيقه «أذان» يعرض في جوجل بلاي أكثر من 10 ملايين تنزيل، ويقول الموقع إنه موثوق لدى 55 مليون مؤمن."
  en: "A website and app for prayer times, the adhan, the qibla and the Hijri calendar, online before December 1998 as a directory of Islamic centres and mosques in the United States with local prayer times, and maintained in 2001 by the non-profit Wasat.com; its Athan app shows 10M+ downloads on Google Play, and the site calls it 'trusted by 55 million believers'."
  ur: "نماز کے اوقات، اذان، قبلہ اور ہجری تقویم کی ویب سائٹ اور ایپ؛ دسمبر 1998 سے پہلے امریکا کے اسلامی مراکز اور مساجد کی فہرست اور مقامی اوقاتِ نماز کے طور پر آن لائن آئی، اور 2001 میں غیر منافع بخش ادارہ Wasat.com اسے چلاتا تھا؛ اس کی «اذان» ایپ گوگل پلے پر 1 کروڑ سے زائد ڈاؤن لوڈ دکھاتی ہے۔"
