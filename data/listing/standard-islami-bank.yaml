summary:
  ar: بنك تجاري خاص في دكا، أُسس في 3 يونيو 1999 بنكا تقليديا باسم ستاندرد بنك، وتحوّل في ديسمبر 2020 إلى الصيرفة المتوافقة
    مع الشريعة، وصار اسمه بنك ستاندرد الإسلامي في فبراير 2026.
  en: A private commercial bank in Dhaka, founded on 3 June 1999 as the conventional Standard Bank, which switched to Shariah-compliant
    banking in December 2020 and was renamed Standard Islami Bank in February 2026.
  ur: ڈھاکہ کا نجی تجارتی بینک، جو 3 جون 1999 کو روایتی اسٹینڈرڈ بینک کے طور پر قائم ہوا، دسمبر 2020 میں شریعت کے مطابق بینکاری
    پر منتقل ہوا اور فروری 2026 میں اس کا نام اسٹینڈرڈ اسلامی بینک ہوا۔
