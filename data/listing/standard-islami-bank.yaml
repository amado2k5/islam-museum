label:
  ar: بنك ستاندرد الإسلامي
  en: Standard Islami Bank
  ur: اسٹینڈرڈ اسلامی بینک
  es: "Banco Islámico Estándar"
  fr: "Standard Islami Bank"
  tr: "Standart İslami Banka"
  id: "Bank Islam Standar"
summary:
  ar: بنك تجاري خاص في دكا، أُسس في 3 يونيو 1999 بنكا تقليديا باسم ستاندرد بنك، وتحوّل في ديسمبر 2020 إلى الصيرفة المتوافقة
    مع الشريعة، وصار اسمه بنك ستاندرد الإسلامي في فبراير 2026.
  en: A private commercial bank in Dhaka, founded on 3 June 1999 as the conventional Standard Bank, which switched to Shariah-compliant
    banking in December 2020 and was renamed Standard Islami Bank in February 2026.
  ur: ڈھاکہ کا نجی تجارتی بینک، جو 3 جون 1999 کو روایتی اسٹینڈرڈ بینک کے طور پر قائم ہوا، دسمبر 2020 میں شریعت کے مطابق بینکاری
    پر منتقل ہوا اور فروری 2026 میں اس کا نام اسٹینڈرڈ اسلامی بینک ہوا۔
  es: "Un banco comercial privado en Dhaka, fundado el 3 de junio de 1999 como el Standard Bank convencional, que se adaptó a la banca conforme a la Sharia en diciembre de 2020 y pasó a llamarse Standard Islami Bank en febrero de 2026."
  fr: "Une banque commerciale privée de Dhaka, fondée le 3 juin 1999 sous le nom de Standard Bank, qui est passée à une banque conforme à la charia en décembre 2020 et a été rebaptisée Standard Islami Bank en février 2026."
  tr: "3 Haziran 1999'da Standard Bank adıyla geleneksel bir banka olarak kurulan ve Aralık 2020'de Şeriat uyumlu bankacılığa dönüşen özel bir ticari banka, Şubat 2026'da Standard Islamic Bank adını aldı."
  id: "Sebuah bank komersial swasta di Dhaka, didirikan pada 3 Juni 1999 sebagai bank konvensional bernama Standard Bank, dan diubah pada Desember 2020 menjadi bank yang sesuai dengan syariah, dan dikenal sebagai Standard Islamic Bank pada Februari 2026."
