label:
  ar: بنك بوبيان
  en: Boubyan Bank
  ur: بوبیان بینک
summary:
  ar: بنك إسلامي كويتي مدرج، أُسس بالمرسوم الأميري رقم 88 في 21 سبتمبر 2004 بعد قانون البنوك الإسلامية لسنة 2003، فكان أول
    بنك إسلامي يُنشأ في ظله؛ بنك الكويت الوطني أكبر مساهميه منذ 2009، واستحوذ على بنك لندن والشرق الأوسط سنة 2020.
  en: A listed Kuwaiti Islamic bank, established by Amiri Decree No. 88 of 21 September 2004 after the Islamic Banks Law of
    2003, the first Islamic bank created under it; the National Bank of Kuwait has been its largest shareholder since 2009,
    and it acquired the Bank of London and the Middle East in 2020.
  ur: کویت کا درج اسلامی بینک، جو 2003 کے اسلامی بینک قانون کے بعد 21 ستمبر 2004 کے امیری فرمان نمبر 88 سے قائم ہوا اور اس
    قانون کے تحت بننے والا پہلا اسلامی بینک تھا؛ نیشنل بینک آف کویت 2009 سے اس کا سب سے بڑا حصہ دار ہے، اور 2020 میں اس نے
    بینک آف لندن اینڈ دی مڈل ایسٹ حاصل کیا۔
