label:
  ar: بنك فيصل الإسلامي المصري
  en: Faisal Islamic Bank of Egypt
  ur: بنک فیصل اسلامی مصری
  es: "Banco Islámico Faisal de Egipto"
  fr: "Banque islamique Faisal d'Égypte"
  tr: "Faisal Mısır İslami Bankası"
  id: "Bank Islam Faisal Mesir"
summary:
  ar: بنك مصري مساهم مقره القاهرة، تأسس سنة 1977 وافتتح أبوابه للعملاء في 5 يوليو 1979، ويصف نفسه بأنه أول بنك تجاري إسلامي
    مصري؛ ارتبط تأسيسه بالأمير محمد الفيصل، وبلغ 43 فرعا ونحو 2.5 مليون حساب جار سنة 2025.
  en: An Egyptian joint-stock bank based in Cairo, incorporated in 1977 and opened to customers on 5 July 1979, which describes
    itself as the first Egyptian Islamic commercial bank; its founding is linked with Prince Mohammed al-Faisal, and in 2025
    it had 43 branches and about 2.5 million current accounts.
  ur: قاہرہ میں قائم مصری مشترکہ سرمایہ بینک، جو 1977 میں رجسٹر ہوا اور 5 جولائی 1979 کو صارفین کے لیے کھلا؛ خود کو پہلا مصری
    اسلامی تجارتی بینک کہتا ہے؛ اس کی تاسیس شہزادہ محمد الفیصل سے وابستہ ہے، اور 2025 میں اس کی 43 شاخیں اور تقریباً 25 لاکھ
    کرنٹ اکاؤنٹ تھے۔
  es: "Un banco egipcio por acciones con sede en El Cairo, constituido en 1977 y abierto al público el 5 de julio de 1979, que se describe a sí mismo como el primer banco comercial islámico egipcio; su fundación está vinculada al príncipe Mohammed al-Faisal, y en 2025 contaba con 43 sucursales y alrededor de 2,5 millones de cuentas corrientes."
  fr: "Banque égyptienne par actions basée au Caire, constituée en 1977 et ouverte aux clients le 5 juillet 1979, qui se décrit comme la première banque commerciale islamique égyptienne; sa fondation est liée au prince Mohammed al-Faisal, et en 2025, elle comptait 43 succursales et environ 2,5 millions de comptes courants."
  tr: "Kahire merkezli bir Mısır anonim şirket bankası olan bu kuruluş, 1977 yılında kurulmuş ve 5 Temmuz 1979'da müşterilerine kapılarını açmıştır. Kendisini ilk Mısır İslami ticari bankası olarak tanımlayan bankanın kuruluşu Prens Muhammed el-Faysal ile bağlantılıdır ve 2025 yılında 43 şubesi ve yaklaşık 2,5 milyon cari hesabı bulunmaktaydı."
  id: "Bank perseroan terbatas Mesir yang berbasis di Kairo ini didirikan pada tahun 1977 dan mulai melayani nasabah pada tanggal 5 Juli 1979. Bank ini menyebut dirinya sebagai bank komersial Islam pertama di Mesir; pendiriannya terkait dengan Pangeran Mohammed Al-Faisal, dan pada tahun 2025 memiliki 43 cabang dan sekitar 2,5 juta rekening giro."
