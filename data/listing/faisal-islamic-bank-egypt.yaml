label:
  ar: بنك فيصل الإسلامي المصري
  en: Faisal Islamic Bank of Egypt
  ur: بنک فیصل اسلامی مصری
summary:
  ar: بنك مصري مساهم مقره القاهرة، تأسس سنة 1977 وافتتح أبوابه للعملاء في 5 يوليو 1979، ويصف نفسه بأنه أول بنك تجاري إسلامي
    مصري؛ ارتبط تأسيسه بالأمير محمد الفيصل، وبلغ 43 فرعا ونحو 2.5 مليون حساب جار سنة 2025.
  en: An Egyptian joint-stock bank based in Cairo, incorporated in 1977 and opened to customers on 5 July 1979, which describes
    itself as the first Egyptian Islamic commercial bank; its founding is linked with Prince Mohammed al-Faisal, and in 2025
    it had 43 branches and about 2.5 million current accounts.
  ur: قاہرہ میں قائم مصری مشترکہ سرمایہ بینک، جو 1977 میں رجسٹر ہوا اور 5 جولائی 1979 کو صارفین کے لیے کھلا؛ خود کو پہلا مصری
    اسلامی تجارتی بینک کہتا ہے؛ اس کی تاسیس شہزادہ محمد الفیصل سے وابستہ ہے، اور 2025 میں اس کی 43 شاخیں اور تقریباً 25 لاکھ
    کرنٹ اکاؤنٹ تھے۔
