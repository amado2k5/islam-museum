label:
  ar: بنك آي سي بي الإسلامي
  en: ICB Islamic Bank
  ur: آئی سی بی اسلامی بینک
summary:
  ar: بنك تجاري إسلامي بنغلاديشي من الجيل الثاني في دكا، بدأ العمل في 20 مايو 1987 باسم بنك البركة، وصار بنك أورينتال سنة
    2004، ثم اشترته مجموعة آي سي بي المصرفية سنة 2008 وأعادت تسميته؛ تراكمت خسائره إلى نحو 20 مليار تاكا سنة 2022.
  en: A second-generation commercial Islamic bank in Dhaka, Bangladesh, which began operating on 20 May 1987 as Al-Baraka
    Bank, became Oriental Bank in 2004, and was bought and renamed by the ICB Banking Group in 2008; its accumulated losses
    reached nearly 20 billion taka in 2022.
  ur: ڈھاکہ کا دوسری نسل کا تجارتی اسلامی بینک، جس نے 20 مئی 1987 کو البرکہ بینک کے نام سے کام شروع کیا، 2004 میں اورینٹل
    بینک بنا اور 2008 میں آئی سی بی بینکنگ گروپ نے اسے خرید کر نیا نام دیا؛ 2022 میں اس کا جمع شدہ خسارہ تقریباً 20 ارب ٹکا
    تھا۔
