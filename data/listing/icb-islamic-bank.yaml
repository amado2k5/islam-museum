summary:
  ar: بنك تجاري إسلامي بنغلاديشي من الجيل الثاني في دكا، بدأ العمل في 20 مايو 1987 باسم بنك البركة، وصار بنك أورينتال سنة
    2004، ثم اشترته مجموعة آي سي بي المصرفية سنة 2008 وأعادت تسميته؛ تراكمت خسائره إلى نحو 20 مليار تاكا سنة 2022.
  en: A second-generation commercial Islamic bank in Dhaka, Bangladesh, which began operating on 20 May 1987 as Al-Baraka
    Bank, became Oriental Bank in 2004, and was bought and renamed by the ICB Banking Group in 2008; its accumulated losses
    reached nearly 20 billion taka in 2022.
  ur: ڈھاکہ کا دوسری نسل کا تجارتی اسلامی بینک، جس نے 20 مئی 1987 کو البرکہ بینک کے نام سے کام شروع کیا، 2004 میں اورینٹل
    بینک بنا اور 2008 میں آئی سی بی بینکنگ گروپ نے اسے خرید کر نیا نام دیا؛ 2022 میں اس کا جمع شدہ خسارہ تقریباً 20 ارب ٹکا
    تھا۔
  es: "Un banco comercial islámico de segunda generación en Dhaka, Bangladesh, que comenzó a operar el 20 de mayo de 1987 como Al-Baraka Bank, se convirtió en Oriental Bank en 2004 y fue comprado y renombrado por el Grupo Bancario ICB en 2008; sus pérdidas acumuladas alcanzaron casi 20 mil millones de takas en 2022."
  fr: "Banque commerciale islamique de deuxième génération à Dhaka, au Bangladesh, qui a commencé ses activités le 20 mai 1987 sous le nom d'Al-Baraka Bank, est devenue Oriental Bank en 2004, puis a été rachetée et renommée par le groupe bancaire ICB en 2008; ses pertes cumulées ont atteint près de 20 milliards de taka en 2022."
  tr: "Bangladeş'in başkenti Dakka'da bulunan ikinci nesil İslami ticari bankası, 20 Mayıs 1987'de Al Baraka Bank adıyla faaliyete başladı ve 2004 yılında Oriental Bank adını aldı. Daha sonra 2008 yılında ICB Banking Group tarafından satın alındı ve yeniden adlandırıldı; 2022 yılında yaklaşık 20 milyar taka zarara ulaştı."
  id: "Bank komersial Islam generasi kedua Bangladesh di Dhaka ini mulai beroperasi pada 20 Mei 1987 dengan nama Al Baraka Bank, dan menjadi Oriental Bank pada tahun 2004. Kemudian diakuisisi oleh ICB Banking Group pada tahun 2008 dan berganti nama; kerugiannya terakumulasi hingga sekitar 20 miliar taka pada tahun 2022."
