  en: "IslamQA (Islam Question & Answer)"
  ur: "اسلام سوال و جواب (IslamQA)"
summary:
  ar: "موقع فتاوى وأسئلة وأجوبة على الإنترنت بدأه محمد صالح المنجد سنة 1996 ويعمل تحت إشرافه العام، ويُعدّ من أوائل خدمات الفتوى على الشبكة؛ يجيب بست عشرة لغة عن أسئلة المسلمين وغيرهم على منهج أهل السنة والجماعة كما يصف نفسه، وحُجب في السعودية سنة 2010 بعد قصر الفتوى على هيئة كبار العلماء."
  en: "An online fatwa and question-and-answer website begun by Muhammad Salih al-Munajjid in 1996 and run under his general supervision, counted among the first online fatwa services; it answers questions from Muslims and others in sixteen languages on the method of Ahl al-Sunna wa-l-Jama'a, as it describes itself, and was blocked in Saudi Arabia in 2010 after fatwas were reserved to the Council of Senior Scholars."
  ur: "فتووں اور سوال و جواب کی ایک آن لائن ویب سائٹ جسے محمد صالح المنجد نے 1996 میں شروع کیا اور جو انہی کی عمومی نگرانی میں چلتی ہے؛ اسے انٹرنیٹ کی اولین فتویٰ خدمات میں شمار کیا جاتا ہے۔ اپنے بیان کے مطابق اہلِ سنت والجماعت کے منہج پر سولہ زبانوں میں مسلمانوں اور غیر مسلموں کے سوالوں کا جواب دیتی ہے، اور 2010 میں سعودی عرب میں فتویٰ ہیئت کبار العلماء تک محدود کیے جانے کے بعد وہاں بلاک کی گئی۔"
