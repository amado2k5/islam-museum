summary:
  ar: "تطبيق من كراتشي للبحث في القرآن والحديث بالكلمة والآية والموضوع، مع التلاوات والتراجم والتفاسير ومواقيت الصلاة والقبلة، بالأردية والهندية والعربية والأردية بالحروف اللاتينية؛ بدأ برنامجًا حاسوبيًا باسم «Search Quran» سنة 2009 أعدّه زاهد حسين چھیپا، ثم صار تطبيقًا مجانيًا يموّله الإعلان والمتبرعون، وتنشره في جوجل بلاي مؤسسة Islam360 Foundation Trust."
  en: "A Karachi app for searching the Qur'an and hadith by word, verse and subject, with recitations, translations, tafsir, prayer times and the qibla, in Urdu, Hindi, Arabic and Romanised Urdu; it began as a desktop program, 'Search Quran', made by Zahid Hussain Chhipa in 2009, then became a free app funded by advertising and donors, published on Google Play by the Islam360 Foundation Trust."
  ur: "کراچی کی ایپ جس میں قرآن و حدیث کو لفظ، آیت اور موضوع سے تلاش کیا جا سکتا ہے، تلاوت، تراجم، تفاسیر، اوقاتِ نماز اور قبلے کے ساتھ، اردو، ہندی، عربی اور رومن اردو میں؛ 2009 میں زاہد حسین چھیپا کے ڈیسک ٹاپ پروگرام «Search Quran» سے شروع ہوئی، پھر اشتہارات اور عطیہ دہندگان کے سہارے مفت ایپ بنی؛ گوگل پلے پر ناشر Islam360 Foundation Trust۔"
