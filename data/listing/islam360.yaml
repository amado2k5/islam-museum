summary:
  ar: "تطبيق من كراتشي للبحث في القرآن والحديث بالكلمة والآية والموضوع، مع التلاوات والتراجم والتفاسير ومواقيت الصلاة والقبلة، بالأردية والهندية والعربية والأردية بالحروف اللاتينية؛ بدأ برنامجًا حاسوبيًا باسم «Search Quran» سنة 2009 أعدّه زاهد حسين چھیپا، ثم صار تطبيقًا مجانيًا يموّله الإعلان والمتبرعون، وتنشره في جوجل بلاي مؤسسة Islam360 Foundation Trust."
  en: "A Karachi app for searching the Qur'an and hadith by word, verse and subject, with recitations, translations, tafsir, prayer times and the qibla, in Urdu, Hindi, Arabic and Romanised Urdu; it began as a desktop program, 'Search Quran', made by Zahid Hussain Chhipa in 2009, then became a free app funded by advertising and donors, published on Google Play by the Islam360 Foundation Trust."
  ur: "کراچی کی ایپ جس میں قرآن و حدیث کو لفظ، آیت اور موضوع سے تلاش کیا جا سکتا ہے، تلاوت، تراجم، تفاسیر، اوقاتِ نماز اور قبلے کے ساتھ، اردو، ہندی، عربی اور رومن اردو میں؛ 2009 میں زاہد حسین چھیپا کے ڈیسک ٹاپ پروگرام «Search Quran» سے شروع ہوئی، پھر اشتہارات اور عطیہ دہندگان کے سہارے مفت ایپ بنی؛ گوگل پلے پر ناشر Islam360 Foundation Trust۔"
  es: "Una aplicación de Karachi para buscar el Corán y los hadices por palabra, versículo y tema, con recitaciones, traducciones, tafsir, horarios de oración y la qibla, en urdu, hindi, árabe y urdu romanizado; comenzó como un programa de escritorio, 'Search Quran', creado por Zahid Hussain Chhipa en 2009, luego se convirtió en una aplicación gratuita financiada por publicidad y donantes, publicada en Google Play por la Fundación Islam360 Trust."
  fr: "Une application de Karachi permettant de rechercher le Coran et les hadiths par mot, verset et sujet, avec récitations, traductions, tafsir, horaires de prière et la qibla, en ourdou, hindi, arabe et ourdou romanisé; elle a commencé comme un programme de bureau, « Search Quran », créé par Zahid Hussain Chhipa en 2009, puis est devenue une application gratuite financée par la publicité et les donateurs, publiée sur Google Play par la fondation Islam360."
  tr: "Karaçi'den geliştirilen bu uygulama, Kur'an ve Hadisleri kelime, ayet ve konu bazında aramanıza olanak tanıyor; okuma, tercüme, yorum, namaz vakitleri ve kıble bilgilerini Urduca, Hintçe, Arapça ve Latin alfabesiyle yazılmış Urduca dillerinde sunuyor. 2009 yılında Zahid Hussain Chheepa tarafından hazırlanan \"Kur'an Ara\" adlı bir bilgisayar programı olarak başlayan uygulama, daha sonra reklamlar ve bağışçılar tarafından finanse edilen ve Islam360 Foundation Trust tarafından Google Play'de yayınlanan ücretsiz bir uygulama haline geldi."
  id: "Sebuah aplikasi dari Karachi untuk mencari Al-Quran dan Hadits berdasarkan kata, ayat, dan topik, dengan bacaan, terjemahan, interpretasi, waktu shalat, dan arah kiblat, dalam bahasa Urdu, Hindi, Arab, dan Urdu dalam aksara Latin; aplikasi ini dimulai sebagai program komputer bernama \"Search Quran\" pada tahun 2009, yang dibuat oleh Zahid Hussain Chheepa, dan kemudian menjadi aplikasi gratis yang didanai oleh iklan dan donatur, serta diterbitkan di Google Play oleh Islam360 Foundation Trust."
