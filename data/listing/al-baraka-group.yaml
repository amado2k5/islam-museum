label:
  ar: مجموعة البركة
  en: Al Baraka Group
  ur: البرکہ گروپ
summary:
  ar: مجموعة مالية إسلامية دولية مقرها المنامة، يرخّصها مصرف البحرين المركزي شركةَ استثمار تعمل وفق المبادئ الإسلامية، ولها
    مصارف تابعة في 13 بلدا؛ سُجّلت سنة 2002، وطرحت أسهمها للاكتتاب سنة 2006، ثم شُطبت من بورصة البحرين سنة 2024.
  en: An international Islamic financial group based in Manama, licensed by the Central Bank of Bahrain as an investment firm
    under Islamic principles, with banking subsidiaries in 13 countries; registered in 2002, it floated in 2006 and was delisted
    from the Bahrain Bourse in 2024.
  ur: منامہ میں قائم بین الاقوامی اسلامی مالیاتی گروپ، جسے مرکزی بینک بحرین نے اسلامی اصولوں کے تحت سرمایہ کاری فرم کا لائسنس
    دیا ہے اور جس کے بینکاری ذیلی ادارے 13 ملکوں میں ہیں؛ 2002 میں رجسٹر ہوا، 2006 میں حصص عوام کو پیش کیے اور 2024 میں بحرین
    بورس سے خارج ہوا۔
