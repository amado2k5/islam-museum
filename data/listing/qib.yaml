summary:
  ar: مصرف قطري مقره الدوحة، تأسس سنة 1982 وتشرف على أعماله هيئة شرعية؛ جهاز قطر للاستثمار أكبر مساهميه، وجاء الخامس عشر في
    قائمة فوربس الشرق الأوسط لأعلى 30 بنكا قيمة لسنة 2025.
  en: A Qatari bank based in Doha, founded in 1982, whose operations are supervised by a Shari'a board; the Qatar Investment
    Authority is its largest shareholder, and it was 15th on Forbes Middle East's 30 Most Valuable Banks 2025.
  ur: دوحہ میں قائم قطری بینک، جو 1982 میں قائم ہوا اور جس کے کاموں کی نگرانی ایک شرعی بورڈ کرتا ہے؛ قطر انویسٹمنٹ اتھارٹی
    اس کی سب سے بڑی حصہ دار ہے، اور فوربس مڈل ایسٹ کی 2025 کی 30 سب سے قیمتی بینکوں کی فہرست میں پندرہواں رہا۔
