summary:
  ar: "شركة تسجيلات بريطانية للموسيقى العالمية أسسها بيتر غابرييل وأعضاء مهرجان ووماد سنة 1989 في بوكس بمقاطعة ويلتشير، لتتيح لموسيقيي العالم استوديوهات حديثة وجمهورا أوسع؛ أصدرت ألبومات نصرت فتح علي خان «مست مست» و«Night Song» و«The Last Prophet» و«Dust to Gold»، وباعت أكثر من ثلاثة ملايين تسجيل حتى 1999."
  en: "A British world-music label founded in 1989 by Peter Gabriel and WOMAD's original members at Box, Wiltshire, to give musicians from around the world modern studios and wider audiences; it released Nusrat Fateh Ali Khan's Mustt Mustt, Night Song, The Last Prophet and Dust to Gold, and had sold over 3 million records by 1999."
  ur: "عالمی موسیقی کا برطانوی لیبل جسے پیٹر گیبریل اور ووماڈ کے ابتدائی ارکان نے 1989 میں باکس، ولٹ شائر میں قائم کیا؛ اس نے نصرت فتح علی خان کے «مست مست»، «نائٹ سونگ»، «دی لاسٹ پرافٹ» اور «ڈسٹ ٹو گولڈ» جاری کیے۔"
