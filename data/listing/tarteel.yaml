summary:
  ar: "تطبيق قرآني يستمع إلى تلاوة القارئ ويصحح أخطاءه بالذكاء الاصطناعي، بدأ مشروعًا سنة 2018 وجمع أكثر من 80 ألف تسجيل تلاوة، ودخل برنامج تسريع الشركات في معهد ماساتشوستس للتقنية في خريف 2019، وصدر تطبيقًا على iOS وأندرويد في 9 يناير 2020 بعد أن استحوذ على تطبيق «اقرأ»؛ يعرض في جوجل بلاي أكثر من 10 ملايين تنزيل."
  en: "A Qur'an app that listens to a reader's recitation and corrects mistakes with AI; it began as a project in 2018, collected more than 80,000 recitation recordings, joined MIT's Sandbox accelerator in autumn 2019, and launched as an app on iOS and Android on 9 January 2020 after acquiring the Iqra app; it shows 10M+ downloads on Google Play."
  ur: "قرآن کی ایپ جو پڑھنے والے کی تلاوت سن کر مصنوعی ذہانت سے غلطیاں درست کرتی ہے؛ 2018 میں منصوبہ بنا، 80 ہزار سے زیادہ تلاوتیں جمع کیں، خزاں 2019 میں ایم آئی ٹی کے سینڈ باکس ایکسلریٹر میں شامل ہوا، اور «اقرأ» ایپ کے حصول کے بعد 9 جنوری 2020 کو iOS اور اینڈرائیڈ پر ایپ جاری ہوئی؛ گوگل پلے پر 1 کروڑ سے زائد ڈاؤن لوڈ۔"
