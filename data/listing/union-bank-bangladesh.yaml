summary:
  ar: بنك إسلامي خاص بنغلاديشي من الجيل الرابع، أُسس في 7 مارس 2013 متوافقا مع الشريعة ومدرج في بورصة دكا؛ كشفت مراجعات البنك
    المركزي سنتي 2022 و2024 ارتفاع قروضه المتعثرة، وصار تحت إشرافه.
  en: A fourth-generation private Islamic bank in Bangladesh, established on 7 March 2013 as a sharia-compliant bank and listed
    on the Dhaka Stock Exchange; central-bank inspections in 2022 and 2024 found a sharp rise in bad loans, and it came under
    central-bank supervision.
  ur: بنگلہ دیش کا چوتھی نسل کا نجی اسلامی بینک، جو 7 مارچ 2013 کو شریعت کے مطابق قائم ہوا اور ڈھاکہ اسٹاک ایکسچینج میں درج
    ہے؛ 2022 اور 2024 میں مرکزی بینک کی جانچ میں خراب قرضوں میں تیز اضافہ سامنے آیا۔
