summary:
  ar: بنك تجاري متوافق مع الشريعة في نيروبي، أسسه سنة 2007 باسم فيرست كوميونيتي بنك مستثمرون مسلمون من الكويت وكينيا وتنزانيا،
    وبدأ العمل في 1 يونيو 2008 أول بنك شرعي كامل في كينيا.
  en: A Shari'ah-compliant commercial bank in Nairobi, founded in 2007 as First Community Bank by private Muslim investors
    in Kuwait, Kenya and Tanzania, which opened on 1 June 2008 as the first fully fledged Shari'ah bank in Kenya.
  ur: نیروبی کا شریعت کے مطابق تجارتی بینک، جو 2007 میں کویت، کینیا اور تنزانیہ کے نجی مسلمان سرمایہ کاروں نے فرسٹ کمیونٹی
    بینک کے نام سے قائم کیا اور یکم جون 2008 کو کینیا کے پہلے مکمل شرعی بینک کے طور پر کھلا۔
