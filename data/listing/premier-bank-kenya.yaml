label:
  ar: بنك بريمير كينيا
  en: Premier Bank Kenya
  ur: پریمیئر بینک کینیا
  es: "Banco Premier de Kenia"
  fr: "Premier Bank Kenya"
summary:
  ar: بنك تجاري متوافق مع الشريعة في نيروبي، أسسه سنة 2007 باسم فيرست كوميونيتي بنك مستثمرون مسلمون من الكويت وكينيا وتنزانيا،
    وبدأ العمل في 1 يونيو 2008 أول بنك شرعي كامل في كينيا.
  en: A Shari'ah-compliant commercial bank in Nairobi, founded in 2007 as First Community Bank by private Muslim investors
    in Kuwait, Kenya and Tanzania, which opened on 1 June 2008 as the first fully fledged Shari'ah bank in Kenya.
  ur: نیروبی کا شریعت کے مطابق تجارتی بینک، جو 2007 میں کویت، کینیا اور تنزانیہ کے نجی مسلمان سرمایہ کاروں نے فرسٹ کمیونٹی
    بینک کے نام سے قائم کیا اور یکم جون 2008 کو کینیا کے پہلے مکمل شرعی بینک کے طور پر کھلا۔
  es: "Un banco comercial que cumple con la ley islámica (Sharia) en Nairobi, fundado en 2007 como First Community Bank por inversores privados musulmanes de Kuwait, Kenia y Tanzania, que abrió sus puertas el 1 de junio de 2008 como el primer banco que cumple plenamente con la ley islámica en Kenia."
  fr: "Une banque commerciale conforme à la charia à Nairobi, fondée en 2007 sous le nom de First Community Bank par des investisseurs musulmans privés du Koweït, du Kenya et de Tanzanie, qui a ouvert ses portes le 1er juin 2008 en tant que première banque entièrement conforme à la charia au Kenya."
