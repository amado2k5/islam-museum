id: listing/al-amanah-islamic-bank
class: listing
kind: company
label:
  ar: بنك الأمانة الإسلامي للاستثمار الفلبيني
  en: Al-Amanah Islamic Investment Bank of the Philippines
  ur: الامانہ اسلامی سرمایہ کاری بینک فلپائن
summary:
  ar: أول بنك إسلامي في الفلبين وأوحدها، يعود إلى بنك الأمانة الفلبيني الذي أُسس بمرسوم رئاسي سنة 1973 لخدمة أقاليم مينداناو
    ذات الأغلبية المسلمة، وصار يعمل وفق المبادئ الإسلامية منذ 1974 وباسمه الحالي منذ 1989؛ وافقت الحكومة سنة 2024 على شراء
    حكومة بانغسامورو 80% منه.
  en: The first and only Islamic bank in the Philippines, descended from the Philippine Amanah Bank set up by presidential
    decree in 1973 to serve Mindanao's Muslim-majority provinces; it has operated on Islamic principles since 1974 and under
    its present name since 1989, and in 2024 the Bangsamoro government's purchase of 80% of it was approved.
  ur: فلپائن کا پہلا اور واحد اسلامی بینک، جو 1973 میں صدارتی فرمان سے مینڈاناؤ کے مسلم اکثریتی صوبوں کے لیے قائم فلپائن امانہ
    بینک کا تسلسل ہے؛ 1974 سے اسلامی اصولوں پر اور 1989 سے موجودہ نام سے کام کر رہا ہے؛ 2024 میں حکومتِ بنگسامورو کی جانب
    سے اس کے 80 فیصد حصص کی خریداری منظور ہوئی۔
