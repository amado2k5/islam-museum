label:
  ar: بنك إسلامي بنغلاديش
  en: Islami Bank Bangladesh
  ur: اسلامی بینک بنگلہ دیش
summary:
  ar: بنك بنغلاديشي في دكا، سُجّل في 13 مارس 1983 وبدأ العمل في 30 مارس 1983 أولَ بنك متوافق مع الشريعة في بنغلاديش، بمشاركة
    البنك الإسلامي للتنمية ومستثمرين سعوديين وكويتيين؛ أكبر شبكة مصرفية خاصة في البلاد، وتغيّرت ملكيته سنة 2017 ثم واجه أزمة
    قروض سنة 2022.
  en: A Bangladeshi bank in Dhaka, incorporated on 13 March 1983 and operating from 30 March 1983 as the first shari'ah-compliant
    bank in Bangladesh, with the Islamic Development Bank and Saudi and Kuwaiti investors among its founders; it is the country's
    largest private banking network, changed ownership in 2017 and faced a loan crisis in 2022.
  ur: ڈھاکہ کا بنگلہ دیشی بینک، جو 13 مارچ 1983 کو رجسٹر ہوا اور 30 مارچ 1983 سے بنگلہ دیش کے پہلے شریعت کے مطابق بینک کے
    طور پر کام کر رہا ہے؛ اس کے بانیوں میں اسلامی ترقیاتی بینک اور سعودی و کویتی سرمایہ کار شامل تھے؛ ملک کا سب سے بڑا نجی
    بینکاری نیٹ ورک، 2017 میں ملکیت بدلی اور 2022 میں قرضوں کے بحران کا سامنا کیا۔
