label:
  ar: بنك إسلامي بنغلاديش
  en: Islami Bank Bangladesh
  ur: اسلامی بینک بنگلہ دیش
  es: "Banco Islámico de Bangladesh"
  fr: "Banque islamique du Bangladesh"
  tr: "Bangladeş İslami Bankası"
  id: "Bank Islam Bangladesh"
summary:
  ar: بنك بنغلاديشي في دكا، سُجّل في 13 مارس 1983 وبدأ العمل في 30 مارس 1983 أولَ بنك متوافق مع الشريعة في بنغلاديش، بمشاركة
    البنك الإسلامي للتنمية ومستثمرين سعوديين وكويتيين؛ أكبر شبكة مصرفية خاصة في البلاد، وتغيّرت ملكيته سنة 2017 ثم واجه أزمة
    قروض سنة 2022.
  en: A Bangladeshi bank in Dhaka, incorporated on 13 March 1983 and operating from 30 March 1983 as the first shari'ah-compliant
    bank in Bangladesh, with the Islamic Development Bank and Saudi and Kuwaiti investors among its founders; it is the country's
    largest private banking network, changed ownership in 2017 and faced a loan crisis in 2022.
  ur: ڈھاکہ کا بنگلہ دیشی بینک، جو 13 مارچ 1983 کو رجسٹر ہوا اور 30 مارچ 1983 سے بنگلہ دیش کے پہلے شریعت کے مطابق بینک کے
    طور پر کام کر رہا ہے؛ اس کے بانیوں میں اسلامی ترقیاتی بینک اور سعودی و کویتی سرمایہ کار شامل تھے؛ ملک کا سب سے بڑا نجی
    بینکاری نیٹ ورک، 2017 میں ملکیت بدلی اور 2022 میں قرضوں کے بحران کا سامنا کیا۔
  es: "Un banco bangladesí con sede en Dhaka, constituido el 13 de marzo de 1983 y en funcionamiento desde el 30 de marzo de 1983 como el primer banco que cumple con la ley islámica (sharia) en Bangladesh, con el Banco Islámico de Desarrollo e inversores saudíes y kuwaitíes entre sus fundadores; es la mayor red bancaria privada del país, cambió de propietario en 2017 y se enfrentó a una crisis crediticia en 2022."
  fr: "Une banque bangladaise basée à Dhaka, constituée le 13 mars 1983 et opérant depuis le 30 mars 1983 en tant que première banque conforme à la charia au Bangladesh, avec la Banque islamique de développement et des investisseurs saoudiens et koweïtiens parmi ses fondateurs; il s'agit du plus grand réseau bancaire privé du pays, a changé de propriétaire en 2017 et a été confronté à une crise des prêts en 2022."
  tr: "Bangladeş'in Dakka şehrinde bulunan, 13 Mart 1983'te tescil edilen ve 30 Mart 1983'te faaliyete başlayan, İslam Kalkınma Bankası ve Suudi ve Kuveytli yatırımcıların katılımıyla kurulan ilk Şeriat uyumlu banka; ülkenin en büyük özel bankacılık ağıdır. 2017'de sahipliği değişen banka, 2022'de kredi kriziyle karşı karşıya kaldı."
  id: "Sebuah bank Bangladesh di Dhaka, terdaftar pada 13 Maret 1983 dan mulai beroperasi pada 30 Maret 1983, merupakan bank syariah pertama di Bangladesh, dengan partisipasi Bank Pembangunan Islam serta investor Saudi dan Kuwait; jaringan perbankan swasta terbesar di negara tersebut, kepemilikannya berubah pada tahun 2017 dan kemudian menghadapi krisis pinjaman pada tahun 2022."
