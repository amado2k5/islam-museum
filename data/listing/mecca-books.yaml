  ar: "متجر كتب إسلامية تقليدية لطلاب العلم، وفيه مجموعة بعنوان «المسلمون الجدد» من المداخل التمهيدية إلى العقيدة والصلاة والممارسة."
  en: "A shop of traditional Islamic books for knowledge seekers, with a 'New Muslims' collection of introductory books on belief, prayer and practice."
