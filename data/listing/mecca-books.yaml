  es: "Una tienda de libros islámicos tradicionales para buscadores de conocimiento, con una colección «Nuevos musulmanes» de libros introductorios sobre la creencia, la oración y la práctica."
  tr: "İlim talipleri için geleneksel İslami kitaplar satan bir mağaza; inanç, namaz ve uygulama üzerine giriş kitaplarından oluşan «Yeni Müslümanlar» koleksiyonu var."
  id: "Toko buku Islam tradisional untuk para penuntut ilmu, dengan koleksi «Muslim Baru» berisi buku pengantar tentang akidah, salat dan amalan."
