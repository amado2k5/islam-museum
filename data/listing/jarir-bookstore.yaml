  tr: "1974'te Riyad'da kurulan, Suudi Arabistan'ın önde gelen kitapçı zincirlerinden biri; Körfez bölgesinin en büyük kitap, okul malzemesi ve elektronik eşya satıcılarından biri."
  id: "Sebuah jaringan toko buku besar Arab Saudi yang dimulai di Riyadh (1974); salah satu penjual buku, perlengkapan sekolah, dan elektronik terbesar di Teluk."
