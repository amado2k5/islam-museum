  tr: "Körfez Afrika Bankası"
  id: "Bank Teluk Afrika"
summary:
  ar: بنك تجاري كيني في نيروبي يعمل وفق نظام الصيرفة الإسلامية، بدأ سنة 2008 ثاني بنك تجاري مرخّص له بالصيرفة الشرعية في كينيا،
    بمساهمين من الخليج وكينيا ومؤسسة التمويل الدولية.
  en: A Kenyan commercial bank in Nairobi operating under an Islamic banking regime, which opened in 2008 as the second commercial
    bank in Kenya authorised for Sharia banking, with shareholders from the Gulf and Kenya and the International Finance Corporation.
  ur: نیروبی کا کینیائی تجارتی بینک جو اسلامی بینکاری کے نظام کے تحت کام کرتا ہے؛ 2008 میں کینیا میں شرعی بینکاری کی اجازت
    پانے والے دوسرے تجارتی بینک کے طور پر کھلا؛ اس کے حصہ دار خلیج، کینیا اور بین الاقوامی مالیاتی کارپوریشن سے ہیں۔
  es: "Un banco comercial keniano con sede en Nairobi que opera bajo un régimen bancario islámico, inaugurado en 2008 como el segundo banco comercial en Kenia autorizado para la banca islámica (Sharia), con accionistas del Golfo Pérsico y Kenia, y la Corporación Financiera Internacional."
  fr: "Une banque commerciale kényane à Nairobi, opérant sous un régime bancaire islamique, qui a ouvert ses portes en 2008 en tant que deuxième banque commerciale du Kenya autorisée à pratiquer la finance islamique, avec des actionnaires du Golfe, du Kenya et de la Société financière internationale."
  tr: "Nairobi'de İslami bankacılık sistemine göre faaliyet gösteren bir Kenya ticari bankası olan bu kuruluş, 2008 yılında Kenya'da Şeriat uyumlu bankacılık için lisans alan ikinci ticari banka olarak kuruldu ve Körfez ülkeleri, Kenya ve Uluslararası Finans Kurumu'ndan hissedarları bulunmaktadır."
  id: "Sebuah bank komersial Kenya di Nairobi yang beroperasi sesuai dengan sistem perbankan Islam, bank ini mulai beroperasi pada tahun 2008 sebagai bank komersial berlisensi kedua untuk perbankan yang sesuai dengan syariah di Kenya, dengan pemegang saham dari negara-negara Teluk, Kenya, dan International Finance Corporation."
