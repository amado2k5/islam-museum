summary:
  ar: بنك تجاري كيني في نيروبي يعمل وفق نظام الصيرفة الإسلامية، بدأ سنة 2008 ثاني بنك تجاري مرخّص له بالصيرفة الشرعية في كينيا،
    بمساهمين من الخليج وكينيا ومؤسسة التمويل الدولية.
  en: A Kenyan commercial bank in Nairobi operating under an Islamic banking regime, which opened in 2008 as the second commercial
    bank in Kenya authorised for Sharia banking, with shareholders from the Gulf and Kenya and the International Finance Corporation.
  ur: نیروبی کا کینیائی تجارتی بینک جو اسلامی بینکاری کے نظام کے تحت کام کرتا ہے؛ 2008 میں کینیا میں شرعی بینکاری کی اجازت
    پانے والے دوسرے تجارتی بینک کے طور پر کھلا؛ اس کے حصہ دار خلیج، کینیا اور بین الاقوامی مالیاتی کارپوریشن سے ہیں۔
