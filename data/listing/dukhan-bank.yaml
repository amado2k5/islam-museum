summary:
  ar: بنك قطري متوافق مع الشريعة في الدوحة، كان اسمه بنك بروة، أُسس سنة 2008 وصار بنك دخان سنة 2020 بعد اندماجه مع بنك قطر
    الدولي، وهو ثالث أكبر بنك إسلامي في قطر؛ أُدرج في بورصة قطر سنة 2023.
  en: A Sharia-compliant Qatari bank in Doha, formerly Barwa Bank, founded in 2008 and renamed Dukhan Bank in 2020 after its
    merger with International Bank of Qatar; it is the third-largest Islamic bank in Qatar and was listed in 2023.
  ur: دوحہ کا شریعت کے مطابق قطری بینک، جو پہلے بروہ بینک تھا؛ 2008 میں قائم ہوا اور 2020 میں انٹرنیشنل بینک آف قطر کے ساتھ
    انضمام کے بعد دخان بینک بنا؛ قطر کا تیسرا بڑا اسلامی بینک ہے۔
