summary:
  ar: "لعبة حاسوب تعليمية دينية للأطفال صدرت سنة 1999 عن شركة إنوفاتيف مايندز البريطانية، تضم ست ألعاب مصغرة قائمة على أسئلة اختيار من متعدد في موضوعات إسلامية بثلاثة مستويات عمرية؛ أثارت إحداها، «المقاومة»، جدلًا واسعًا في الصحافة الغربية منذ 2002، فرأى فيها منتقدون تحريضًا، وقال صانعوها إنها ردّ على الاحتلال."
  en: "A religious educational computer game for children released in 1999 by the UK firm Innovative Minds, made of six minigames built on multiple-choice questions on Islamic themes at three age levels; one of them, 'The Resistance', drew wide controversy in the Western press from 2002, critics seeing incitement in it and its makers calling it a response to occupation."
  ur: "بچوں کے لیے دینی تعلیمی کمپیوٹر کھیل جو 1999 میں برطانوی کمپنی انوویٹو مائنڈز نے جاری کیا؛ چھ چھوٹے کھیل، اسلامی موضوعات پر کثیر انتخابی سوالات، تین عمری سطحیں؛ ان میں سے ایک، «مزاحمت»، پر 2002 سے مغربی صحافت میں بڑا تنازع ہوا: ناقدین نے اسے اشتعال انگیزی کہا اور بنانے والوں نے قبضے کا جواب۔"
