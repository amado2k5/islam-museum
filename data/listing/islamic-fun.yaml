summary:
  ar: "لعبة حاسوب تعليمية دينية للأطفال صدرت سنة 1999 عن شركة إنوفاتيف مايندز البريطانية، تضم ست ألعاب مصغرة قائمة على أسئلة اختيار من متعدد في موضوعات إسلامية بثلاثة مستويات عمرية؛ أثارت إحداها، «المقاومة»، جدلًا واسعًا في الصحافة الغربية منذ 2002، فرأى فيها منتقدون تحريضًا، وقال صانعوها إنها ردّ على الاحتلال."
  en: "A religious educational computer game for children released in 1999 by the UK firm Innovative Minds, made of six minigames built on multiple-choice questions on Islamic themes at three age levels; one of them, 'The Resistance', drew wide controversy in the Western press from 2002, critics seeing incitement in it and its makers calling it a response to occupation."
  ur: "بچوں کے لیے دینی تعلیمی کمپیوٹر کھیل جو 1999 میں برطانوی کمپنی انوویٹو مائنڈز نے جاری کیا؛ چھ چھوٹے کھیل، اسلامی موضوعات پر کثیر انتخابی سوالات، تین عمری سطحیں؛ ان میں سے ایک، «مزاحمت»، پر 2002 سے مغربی صحافت میں بڑا تنازع ہوا: ناقدین نے اسے اشتعال انگیزی کہا اور بنانے والوں نے قبضے کا جواب۔"
  es: "Un videojuego educativo religioso para niños, lanzado en 1999 por la empresa británica Innovative Minds, consta de seis minijuegos basados en preguntas de opción múltiple sobre temas islámicos para tres edades diferentes; uno de ellos, 'La Resistencia', generó una gran controversia en la prensa occidental a partir de 2002, ya que los críticos lo consideraron una incitación a la violencia y sus creadores lo calificaron como una respuesta a la ocupación."
  fr: "Un jeu informatique éducatif religieux pour enfants, sorti en 1999 par la société britannique Innovative Minds, composé de six mini-jeux basés sur des questions à choix multiples portant sur des thèmes islamiques et adaptés à trois niveaux d'âge; l'un d'eux, « La Résistance », a suscité une vive controverse dans la presse occidentale à partir de 2002, les critiques y voyant une incitation à la haine et ses créateurs le qualifiant de réponse à l'occupation."
  tr: "1999 yılında İngiliz şirketi Innovative Minds tarafından piyasaya sürülen, çocuklar için dini eğitim amaçlı bir bilgisayar oyunu, üç yaş seviyesine yönelik İslami konular üzerine çoktan seçmeli sorulara dayalı altı mini oyun içermektedir; bunlardan biri olan \"Direniş\", 2002'den beri Batı basınında geniş çaplı tartışmalara yol açmıştır; eleştirmenler bunu kışkırtma olarak görürken, yaratıcıları bunun işgale bir yanıt olduğunu savunmuştur."
  id: "Sebuah permainan komputer edukatif keagamaan untuk anak-anak, yang dirilis pada tahun 1999 oleh perusahaan Inggris Innovative Minds, mencakup enam permainan mini berdasarkan pertanyaan pilihan ganda tentang topik Islam pada tiga tingkatan usia; salah satunya, \"Resistance,\" telah memicu kontroversi luas di pers Barat sejak tahun 2002, dengan para kritikus melihatnya sebagai hasutan, sementara para penciptanya mengatakan itu adalah tanggapan terhadap pendudukan."
