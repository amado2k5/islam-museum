label:
  ar: مصرف أبوظبي الإسلامي
  en: Abu Dhabi Islamic Bank
  ur: ابوظبی اسلامی بینک
summary:
  ar: مصرف إماراتي في أبوظبي، أُسس شركة مساهمة عامة بالمرسوم الأميري رقم 9 في 20 مايو 1997 وبدأ أعماله التجارية في 11 نوفمبر
    1998، وتجري كل عقوده وفق أحكام الشريعة؛ له فروع في مصر وقطر والعراق والسودان والسعودية، وجاء الثاني عشر في قائمة فوربس
    الشرق الأوسط لأعلى 30 بنكا قيمة لسنة 2025.
  en: An Emirati bank in Abu Dhabi, established as a public joint-stock company by Amiri Decree No. 9 on 20 May 1997, which
    began commercial operations on 11 November 1998 and carries out all its contracts according to Shari'a principles; it
    has operations in Egypt, Qatar, Iraq, Sudan and Saudi Arabia, and was 12th on Forbes Middle East's 30 Most Valuable Banks
    2025.
  ur: ابوظبی کا اماراتی بینک، جو 20 مئی 1997 کو امیری فرمان نمبر 9 سے پبلک جوائنٹ اسٹاک کمپنی کے طور پر قائم ہوا اور 11 نومبر
    1998 کو تجارتی کام شروع کیا؛ اس کے تمام معاہدے شریعت کے اصولوں کے مطابق ہوتے ہیں؛ مصر، قطر، عراق، سوڈان اور سعودی عرب
    میں کام کرتا ہے، اور فوربس مڈل ایسٹ کی 2025 کی 30 سب سے قیمتی بینکوں کی فہرست میں بارہواں رہا۔
