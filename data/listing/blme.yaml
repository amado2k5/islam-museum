label:
  ar: بنك لندن والشرق الأوسط
  en: Bank of London and The Middle East (BLME)
  ur: بینک آف لندن اینڈ دی مڈل ایسٹ
summary:
  ar: بنك بريطاني متوافق مع الشريعة مقره لندن، تأسس في 7 أغسطس 2006 ورُخّص له في يوليو 2007، وكان سنة 2013 أكبر بنك إسلامي
    في أوروبا؛ تشرف على عقوده هيئة رقابة شرعية، وبنك بوبيان الكويتي مساهمه الأكبر.
  en: A British Sharia-compliant bank based in London, incorporated on 7 August 2006 and authorised in July 2007, which was
    the largest Islamic bank in Europe in 2013; a Sharia Supervisory Board reviews its contracts, and Kuwait's Boubyan Bank
    is its majority shareholder.
  ur: لندن میں قائم شریعت کے مطابق برطانوی بینک، جو 7 اگست 2006 کو رجسٹر ہوا اور جولائی 2007 میں اسے اجازت ملی؛ 2013 میں یورپ
    کا سب سے بڑا اسلامی بینک تھا؛ ایک شرعی نگران بورڈ اس کے معاہدوں کا جائزہ لیتا ہے، اور کویت کا بوبیان بینک اس کا اکثریتی
    حصہ دار ہے۔
