label:
  ar: بنك فيصل الإسلامي السوداني
  en: Faisal Islamic Bank of Sudan
  ur: بنک فیصل اسلامی سوڈان
  es: "Banco Islámico Faisal de Sudán"
  fr: "Banque islamique Faisal du Soudan"
  tr: "Faisal Sudan İslami Bankası"
  id: "Bank Islam Faisal Sudan"
summary:
  ar: بنك إسلامي في الخرطوم، أُسس في مايو 1977 على يد 86 مؤسسا سودانيا وسعوديا ومن دول إسلامية أخرى، ويصف نفسه بأنه ذو توجه
    إسلامي وملامح سودانية؛ وصف سنة 2016 بأنه أكبر مقرض في السودان.
  en: An Islamic bank in Khartoum, founded in May 1977 by 86 Sudanese, Saudi and other founders from Islamic states, which
    describes itself as having an Islamic orientation and Sudanese features; in 2016 it was described as Sudan's largest lender.
  ur: خرطوم کا اسلامی بینک، جو مئی 1977 میں 86 سوڈانی، سعودی اور دیگر اسلامی ملکوں کے بانیوں نے قائم کیا؛ خود کو اسلامی رجحان
    اور سوڈانی خصوصیات والا بینک کہتا ہے؛ 2016 میں اسے سوڈان کا سب سے بڑا قرض دہندہ کہا گیا۔
  es: "Un banco islámico en Jartum, fundado en mayo de 1977 por 86 fundadores sudaneses, saudíes y de otros estados islámicos, que se describe a sí mismo como de orientación islámica y con características sudanesas; en 2016 fue descrito como el mayor prestamista de Sudán."
  fr: "Une banque islamique à Khartoum, fondée en mai 1977 par 86 Soudanais, Saoudiens et autres fondateurs issus d'États islamiques, qui se décrit comme ayant une orientation islamique et des caractéristiques soudanaises; en 2016, elle était décrite comme le plus grand prêteur du Soudan."
  tr: "Hartum'da bulunan ve Mayıs 1977'de 86 Sudanlı, Suudi ve diğer İslamcı kurucu tarafından kurulan İslami banka, kendisini İslami yönelimli ve Sudan'a özgü özelliklere sahip bir banka olarak tanımlıyor; 2016 yılında Sudan'ın en büyük kredi kuruluşu olarak nitelendirilmişti."
  id: "Sebuah bank Islam di Khartoum, yang didirikan pada Mei 1977 oleh 86 pendiri asal Sudan, Saudi, dan Islam lainnya, menggambarkan dirinya sebagai bank yang berorientasi Islami dan memiliki ciri khas Sudan; pada tahun 2016 bank ini disebut sebagai pemberi pinjaman terbesar di Sudan."
