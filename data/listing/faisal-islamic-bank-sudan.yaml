summary:
  ar: بنك إسلامي في الخرطوم، أُسس في مايو 1977 على يد 86 مؤسسا سودانيا وسعوديا ومن دول إسلامية أخرى، ويصف نفسه بأنه ذو توجه
    إسلامي وملامح سودانية؛ وصف سنة 2016 بأنه أكبر مقرض في السودان.
  en: An Islamic bank in Khartoum, founded in May 1977 by 86 Sudanese, Saudi and other founders from Islamic states, which
    describes itself as having an Islamic orientation and Sudanese features; in 2016 it was described as Sudan's largest lender.
  ur: خرطوم کا اسلامی بینک، جو مئی 1977 میں 86 سوڈانی، سعودی اور دیگر اسلامی ملکوں کے بانیوں نے قائم کیا؛ خود کو اسلامی رجحان
    اور سوڈانی خصوصیات والا بینک کہتا ہے؛ 2016 میں اسے سوڈان کا سب سے بڑا قرض دہندہ کہا گیا۔
