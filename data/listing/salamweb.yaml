label:
  ar: "سلام ويب ⁦(متصفح)⁩"
  en: "SalamWeb (browser)"
  ur: "سلام ویب ⁦(براؤزر)⁩"
summary:
  ar: "متصفح إنترنت مبني على كروميوم أطلقته في يناير 2019 شركة سلام ويب للتقنيات في ماليزيا، موجّه إلى المسلمين: يحجب ما يعدّه محتوى محرّمًا بثلاث طبقات تصفية، ويضم مواقيت الصلاة والقبلة والمساجد القريبة ومجلة «سلام توداي»؛ كان أول متصفح تعتمده هيئة أماني الشرعية الخاصة، وتصفه ويكيبيديا اليوم بأنه متوقف."
  en: "A Chromium-based web browser launched in January 2019 by Salam Web Technologies in Malaysia for Muslim users: it filtered what it deemed haram content through three layers, and carried prayer times, qibla, nearby mosques and the magazine SalamToday; it was the first browser certified by the private Amanie Shariah Supervisory Board, and Wikipedia now describes it as discontinued."
  ur: "کرومیم پر مبنی ویب براؤزر جو جنوری 2019 میں ملائیشیا میں سلام ویب ٹیکنالوجیز نے مسلمان صارفین کے لیے جاری کیا: تین تہوں کی چھلنی سے وہ مواد روکتا تھا جسے حرام سمجھتا، اور نماز کے اوقات، قبلہ، قریبی مساجد اور میگزین «سلام ٹوڈے» رکھتا تھا؛ نجی امانی شریعہ سپروائزری بورڈ سے سند پانے والا پہلا براؤزر تھا، اور ویکیپیڈیا اب اسے بند قرار دیتا ہے۔"
