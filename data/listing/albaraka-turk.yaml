summary:
  ar: بنك مشاركة تركي في إسطنبول، أُسس سنة 1984 وبدأ العمل سنة 1985 مؤسسةَ تمويل خاصة، ويُعرف بأنه أول بنك مشاركة في تركيا؛
    مجموعة البركة أكبر مساهميه.
  en: A Turkish participation bank in Istanbul, founded in 1984 and active from 1985 as a special finance house, known as
    the first participation bank in Turkey; Al Baraka Group is its largest shareholder.
  ur: استنبول کا ترک شراکتی بینک، جو 1984 میں قائم ہوا اور 1985 سے فعال ہے؛ ترکی کا پہلا شراکتی بینک کہلاتا ہے؛ البرکہ گروپ
    اس کا سب سے بڑا حصہ دار ہے۔
  es: "Banco turco de participación con sede en Estambul, fundado en 1984 y en funcionamiento desde 1985 como entidad financiera especializada, conocido como el primer banco de participación en Turquía; el Grupo Al Baraka es su mayor accionista."
  fr: "Une banque participative turque à Istanbul, fondée en 1984 et active depuis 1985 en tant qu'établissement de financement spécialisé, connue comme la première banque participative de Turquie; le groupe Al Baraka en est le principal actionnaire."
  tr: "İstanbul merkezli, 1984 yılında kurulan ve 1985 yılında özel bir finans kuruluşu olarak faaliyete başlayan Türk iştirak bankası, Türkiye'nin ilk iştirak bankası olarak bilinmektedir; Al Baraka Grubu en büyük hissedarıdır."
  id: "Bank partisipasi Turki di Istanbul, didirikan pada tahun 1984 dan mulai beroperasi pada tahun 1985 sebagai lembaga pembiayaan swasta, dikenal sebagai bank partisipasi pertama di Turki; Al Baraka Group adalah pemegang saham terbesarnya."
