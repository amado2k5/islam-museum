summary:
  ar: "تطبيق تعارف وزواج موجّه إلى المسلمين أسسه شهزاد يونس في لندن سنة 2015 باسم «موزماتش»، ودخل برنامج واي كومبينيتر سنة 2017، وغيّر اسمه إلى «موز» في مايو 2022 بعد أن كسبت مجموعة ماتش دعوى العلامة التجارية ضده أمام محكمة بريطانية؛ أعلن عشرة ملايين عضو سنة 2024."
  en: "A matchmaking and marriage app for Muslims founded by Shahzad Younas in London in 2015 as Muzmatch; it joined Y Combinator in 2017 and renamed itself Muzz in May 2022 after Match Group won a trademark case against it in a British court; it announced ten million members in 2024."
  ur: "مسلمانوں کے لیے رشتے اور شادی کی ایپ جسے شہزاد یونس نے 2015 میں لندن میں «مزمیچ» کے نام سے قائم کیا؛ 2017 میں وائی کومبی نیٹر میں شامل ہوئی، اور مئی 2022 میں برطانوی عدالت میں میچ گروپ کے ٹریڈ مارک مقدمہ جیتنے کے بعد نام «موز» رکھا؛ 2024 میں ایک کروڑ اراکین کا اعلان کیا۔"
