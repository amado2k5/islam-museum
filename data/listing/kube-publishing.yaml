summary:
  ar: "دار نشر بريطانية مستقلة تأسست سنة 2007، تنشر كتبًا عامة وأكاديمية وكتب أطفال عن الإسلام وتجربة المسلمين، وتتولى علامة المؤسسة الإسلامية القائمة منذ 1973، وتوزّع كتب ناشرين مسلمين آخرين، وتبيع كتب الناشرين العامّين لباعة الكتب المسلمين."
  en: "An independent British publishing house established in 2007 that publishes general-interest, academic and children's books on Islam and the Muslim experience, handles the imprint of the Islamic Foundation (established 1973), distributes for other Muslim publishers and wholesales mainstream publishers' titles to Muslim booksellers."
  ur: "2007 میں قائم آزاد برطانوی اشاعتی ادارہ جو اسلام اور مسلم تجربے پر عمومی، علمی اور بچوں کی کتابیں شائع کرتا ہے، 1973 سے قائم اسلامک فاؤنڈیشن کی اشاعتی علامت سنبھالتا ہے، دوسرے مسلم ناشرین کی تقسیم کرتا ہے اور عام ناشرین کی کتابیں مسلم کتب فروشوں تک پہنچاتا ہے۔"
