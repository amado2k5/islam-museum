summary:
  ar: شركة تقنية مالية أمريكية في نيويورك تقدم استثمارات آلية متوافقة مع المبادئ الإسلامية، أطلقت سنة 2017 منصة استثمار إسلامي
    آلية، وفي يوليو 2019 أول صندوق مؤشرات متداول متوافق مع الشريعة في الولايات المتحدة؛ تعمل في 130 بلدا.
  en: An American fintech company in New York offering automated investment aligned with Islamic principles; it launched an
    automated Islamic investment platform in 2017 and, in July 2019, the first Sharia-compliant exchange-traded fund in the
    United States; it operates in 130 countries.
  ur: نیویارک کی امریکی مالیاتی ٹیکنالوجی کمپنی جو اسلامی اصولوں کے مطابق خودکار سرمایہ کاری پیش کرتی ہے؛ جولائی 2019 میں
    امریکہ کا پہلا شریعت کے مطابق ایکسچینج ٹریڈڈ فنڈ شروع کیا؛ 130 ملکوں میں کام کرتی ہے۔
