label:
  ar: بنك فيصل
  en: Faysal Bank
  ur: فیصل بینک
summary:
  ar: بنك إسلامي باكستاني في كراتشي، بدأ في باكستان في أكتوبر 1987 فرعا لبنك فيصل الإسلامي البحريني المملوك للأمير محمد بن
    فيصل، وصار بنكا تقليديا ثم تحوّل بالكامل إلى بنك إسلامي في ديسمبر 2022؛ يملك بنك إثمار البحريني أغلب أسهمه.
  en: A Pakistani Islamic bank in Karachi, which began in Pakistan in October 1987 as a branch of Bahrain's Faysal Islamic
    Bank, owned by Prince Mohammed bin Faisal; it became a conventional bank and converted fully to Islamic banking in December
    2022; Bahrain's Ithmaar Bank holds most of it.
  ur: کراچی کا پاکستانی اسلامی بینک، جو اکتوبر 1987 میں شہزادہ محمد بن فیصل کے بحرینی فیصل اسلامک بینک کی شاخ کے طور پر پاکستان
    میں شروع ہوا؛ بعد میں روایتی بینک بنا اور دسمبر 2022 میں مکمل اسلامی بینک بن گیا؛ بحرین کا اثمار بینک اس کا بڑا مالک ہے۔
