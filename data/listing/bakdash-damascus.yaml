  tr: "Şam'daki El-Hamidiye çarşısında bulunan en ünlü Arap dondurma dükkanı (1885); fıstıklı dondurması Şam'ın popüler simgelerinden biridir."
  id: "Toko es krim Arab paling terkenal di pasar Al-Hamidiyah di Damaskus (1885); es krim rasa pistachio-nya adalah salah satu ikon populer Damaskus."
