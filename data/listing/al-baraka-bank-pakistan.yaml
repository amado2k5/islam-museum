summary:
  ar: بنك إسلامي باكستاني في كراتشي، تابع لمجموعة البركة البحرينية؛ بدأ في باكستان سنة 1991 فرعا لبنك البركة الإسلامي البحريني،
    وسُجّل شركة مساهمة سنة 2004، واندمج سنة 2010 مع بنك الإمارات العالمي الإسلامي في أول اندماج للمصارف الإسلامية في باكستان.
  en: A Pakistani Islamic bank in Karachi, a subsidiary of Bahrain's Al Baraka group; it began in Pakistan in 1991 as a branch
    of Al Baraka Islamic Bank Bahrain, was incorporated in 2004, and in 2010 merged with Emirates Global Islamic Bank in the
    first merger in Pakistan's Islamic banking.
  ur: کراچی کا پاکستانی اسلامی بینک، بحرین کے البرکہ گروپ کا ذیلی ادارہ؛ 1991 میں البرکہ اسلامک بینک بحرین کی شاخ کے طور پر
    شروع ہوا، 2004 میں پبلک کمپنی بنا، اور 2010 میں امارات گلوبل اسلامک بینک کے ساتھ ضم ہوا۔
