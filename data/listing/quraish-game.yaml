summary:
  ar: "لعبة استراتيجية في الزمن الحقيقي ثلاثية الأبعاد من إنتاج استوديو أفكار ميديا في دمشق ونشر دار الفكر، صدرت في 2 أغسطس 2005 بحسب ويكيبيديا الإنجليزية ⁦(والعربية تذكر 2007)⁩، تدور حول حروب القبائل العربية قبل الإسلام وحروب الردة وحملات الخلافة الراشدة على الروم والفرس."
  en: "A 3D real-time strategy game by the Damascus studio Afkar Media, published by Dar al-Fikr and released on 2 August 2005 by the English Wikipedia (the Arabic gives 2007), about the pre-Islamic Arab tribal wars, the Ridda wars and the Rashidun Caliphate's campaigns against the Byzantines and the Sasanians."
  ur: "دمشق کے اسٹوڈیو افکار میڈیا کا سہ جہتی حکمتِ عملی کا کھیل، ناشر دار الفکر؛ انگریزی ویکیپیڈیا کے مطابق 2 اگست 2005 کو جاری ہوا ⁦(عربی میں 2007)⁩؛ قبل از اسلام عرب قبائل کی جنگیں، جنگ ہائے ردہ اور خلافتِ راشدہ کی روم و فارس کے خلاف مہمات۔"
