summary:
  ar: تكتل سعودي خاص مقره جدة، بدأه صالح عبد الله كامل سنة 1969 مؤسسةً للبريد، وصار شركة قابضة سنة 1984 تستثمر في المصارف
    والصحة والعقار والصناعة والنقل في نحو 40 بلدا، ومنها مجموعة البركة المصرفية.
  en: A private Saudi conglomerate based in Jeddah, begun by Saleh Abdullah Kamel in 1969 as a courier business and formed
    as a holding company in 1984, with investments in banking, health care, real estate, manufacturing and transport in some
    40 countries, among them the Al Baraka banking group.
  ur: جدہ میں قائم نجی سعودی گروپ، جسے صالح عبداللہ کامل نے 1969 میں ڈاک کے کاروبار کے طور پر شروع کیا اور جو 1984 میں ہولڈنگ
    کمپنی بنا؛ تقریباً 40 ملکوں میں سرمایہ کاری کرتا ہے، جن میں البرکہ بینکاری گروپ شامل ہے۔
