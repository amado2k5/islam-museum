summary:
  ar: "دار نشر إسلامية في لندن أسسها في مارس 1980 الزوجان أفسر صديقي والدكتورة جمال النساء رفاعي، من الجيل الأول من الناشرين الإسلاميين في بريطانيا؛ بدأت في غرفة خلفية في مطبعة بشمال لندن، وانتقلت إلى بريكستون سنة 1984 حيث بقيت 23 سنة، وأسس صديقي سنة 1994 رابطة الناشرين الإسلاميين، ونشرت سنة 2022 ترجمة كياني الإنجليزية الميسّرة للقرآن."
  en: "An Islamic publisher in London founded in March 1980 by the husband-and-wife team Afsar Siddiqui and Dr Jamal-un-Nisa Rafai, among the first generation of Islamic publishers in Britain; it began in the back room of a North London print shop, moved to Brixton in 1984, where it stayed for 23 years, Siddiqui set up the Islamic Publishers Association in 1994, and in 2022 it published Tahir Mahmood Kiani's Easy Quran."
  ur: "لندن کا اسلامی اشاعتی ادارہ جو مارچ 1980 میں میاں بیوی افسر صدیقی اور ڈاکٹر جمال النساء رفاعی نے قائم کیا، برطانیہ کے اسلامی ناشرین کی پہلی نسل میں سے؛ شمالی لندن کے ایک چھاپہ خانے کے پچھلے کمرے سے آغاز، 1984 میں بریکسٹن منتقلی جہاں 23 سال رہا، 1994 میں صدیقی نے اسلامک پبلشرز ایسوسی ایشن قائم کی، اور 2022 میں طاہر محمود کیانی کا «دی ایزی قرآن» شائع کیا۔"
  es: "Una editorial islámica con sede en Londres, fundada en marzo de 1980 por el matrimonio formado por Afsar Siddiqui y el Dr. Jamal-un-Nisa Rafai, pertenecientes a la primera generación de editores islámicos en Gran Bretaña; comenzó en la trastienda de una imprenta del norte de Londres, se trasladó a Brixton en 1984, donde permaneció durante 23 años, Siddiqui fundó la Asociación de Editores Islámicos en 1994 y en 2022 publicó el libro Easy Quran de Tahir Mahmood Kiani."
  fr: "Maison d'édition islamique londonienne fondée en mars 1980 par Afsar Siddiqui et le Dr Jamal-un-Nisa Rafai, un couple faisant partie de la première génération d'éditeurs islamiques en Grande-Bretagne; elle a débuté dans l'arrière-boutique d'une imprimerie du nord de Londres, a déménagé à Brixton en 1984, où elle est restée pendant 23 ans, Siddiqui a créé l'Association des éditeurs islamiques en 1994, et en 2022, elle a publié le Coran facile de Tahir Mahmood Kiani."
  tr: "Londra'da bulunan bir İslami yayınevi, Mart 1980'de İngiltere'deki ilk kuşak İslami yayıncılardan Afsar Siddiqui ve Dr. Jamal-un-Nisaa Rifai çifti tarafından kurulmuştur; Kuzey Londra'daki bir matbaanın arka odasında faaliyetine başlamış ve 1984'te Brixton'a taşınarak 23 yıl boyunca orada kalmıştır. 1994 yılında Siddiqui, İslami Yayıncılar Birliği'ni kurmuş ve 2022'de Kiani'nin Kur'an'ın sadeleştirilmiş İngilizce çevirisini yayınlamıştır."
  id: "Sebuah penerbit Islam di London, didirikan pada Maret 1980 oleh pasangan Afsar Siddiqui dan Dr. Jamal-un-Nisaa Rifai, dari generasi pertama penerbit Islam di Inggris; awalnya beroperasi di sebuah ruangan belakang di percetakan di London Utara, dan pindah ke Brixton pada tahun 1984 di mana ia menetap selama 23 tahun. Pada tahun 1994, Siddiqui mendirikan Asosiasi Penerbit Islam, dan pada tahun 2022 menerbitkan terjemahan Al-Qur'an dalam bahasa Inggris yang disederhanakan karya Kiani."
