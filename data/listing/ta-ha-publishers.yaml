summary:
  ar: "دار نشر إسلامية في لندن أسسها في مارس 1980 الزوجان أفسر صديقي والدكتورة جمال النساء رفاعي، من الجيل الأول من الناشرين الإسلاميين في بريطانيا؛ بدأت في غرفة خلفية في مطبعة بشمال لندن، وانتقلت إلى بريكستون سنة 1984 حيث بقيت 23 سنة، وأسس صديقي سنة 1994 رابطة الناشرين الإسلاميين، ونشرت سنة 2022 ترجمة كياني الإنجليزية الميسّرة للقرآن."
  en: "An Islamic publisher in London founded in March 1980 by the husband-and-wife team Afsar Siddiqui and Dr Jamal-un-Nisa Rafai, among the first generation of Islamic publishers in Britain; it began in the back room of a North London print shop, moved to Brixton in 1984, where it stayed for 23 years, Siddiqui set up the Islamic Publishers Association in 1994, and in 2022 it published Tahir Mahmood Kiani's Easy Quran."
  ur: "لندن کا اسلامی اشاعتی ادارہ جو مارچ 1980 میں میاں بیوی افسر صدیقی اور ڈاکٹر جمال النساء رفاعی نے قائم کیا، برطانیہ کے اسلامی ناشرین کی پہلی نسل میں سے؛ شمالی لندن کے ایک چھاپہ خانے کے پچھلے کمرے سے آغاز، 1984 میں بریکسٹن منتقلی جہاں 23 سال رہا، 1994 میں صدیقی نے اسلامک پبلشرز ایسوسی ایشن قائم کی، اور 2022 میں طاہر محمود کیانی کا «دی ایزی قرآن» شائع کیا۔"
