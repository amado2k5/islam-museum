summary:
  ar: بنك تجاري خاص متوافق مع الشريعة في دكا، سُجّل في 10 مايو 2001؛ رفعت لجنة مكافحة الفساد في بنغلاديش بين 2012 و2016 قضايا
    على موظفين ومديرين سابقين ومقترضين بتهمة اختلاس أموال منه.
  en: A shariah-compliant private commercial bank in Dhaka, incorporated on 10 May 2001; between 2012 and 2016 Bangladesh's
    Anti-Corruption Commission brought cases against former officers, directors and borrowers for embezzling from it.
  ur: ڈھاکہ کا شریعت کے مطابق نجی تجارتی بینک، جو 10 مئی 2001 کو رجسٹر ہوا؛ 2012 سے 2016 کے درمیان بنگلہ دیش کے انسدادِ بدعنوانی
    کمیشن نے سابق افسروں، ڈائریکٹروں اور قرض داروں پر اس سے غبن کے مقدمات کیے۔
