label:
  ar: بنك شاه جلال الإسلامي
  en: Shahjalal Islami Bank
  ur: شاہ جلال اسلامی بینک
  es: "Banco Islámico Shahjalal"
  fr: "Banque Shahjalal Islami"
  tr: "Şah Celal İslami Bankası"
  id: "Bank Islam Shah Jalal"
summary:
  ar: بنك تجاري خاص متوافق مع الشريعة في دكا، سُجّل في 10 مايو 2001؛ رفعت لجنة مكافحة الفساد في بنغلاديش بين 2012 و2016 قضايا
    على موظفين ومديرين سابقين ومقترضين بتهمة اختلاس أموال منه.
  en: A shariah-compliant private commercial bank in Dhaka, incorporated on 10 May 2001; between 2012 and 2016 Bangladesh's
    Anti-Corruption Commission brought cases against former officers, directors and borrowers for embezzling from it.
  ur: ڈھاکہ کا شریعت کے مطابق نجی تجارتی بینک، جو 10 مئی 2001 کو رجسٹر ہوا؛ 2012 سے 2016 کے درمیان بنگلہ دیش کے انسدادِ بدعنوانی
    کمیشن نے سابق افسروں، ڈائریکٹروں اور قرض داروں پر اس سے غبن کے مقدمات کیے۔
  es: "Un banco comercial privado que cumple con la ley islámica (sharia) en Dhaka, constituido el 10 de mayo de 2001; entre 2012 y 2016, la Comisión Anticorrupción de Bangladesh presentó denuncias contra exfuncionarios, directores y prestatarios por malversación de fondos."
  fr: "Une banque commerciale privée conforme à la charia à Dhaka, constituée le 10 mai 2001; entre 2012 et 2016, la Commission anti-corruption du Bangladesh a intenté des poursuites contre d'anciens dirigeants, administrateurs et emprunteurs pour détournement de fonds."
  tr: "10 Mayıs 2001'de tescil edilmiş, Dakka'da faaliyet gösteren özel bir Şeriat uyumlu ticari banka; 2012 ile 2016 yılları arasında Bangladeş Yolsuzlukla Mücadele Komisyonu tarafından eski çalışanları, yöneticileri ve borçluları hakkında, bankadan fonları zimmete geçirdikleri iddiasıyla davalar açılmıştır."
  id: "Sebuah bank komersial swasta yang berprinsip syariah di Dhaka, terdaftar pada 10 Mei 2001; antara tahun 2012 dan 2016, Komisi Anti Korupsi Bangladesh mengajukan kasus terhadap mantan karyawan, manajer, dan peminjam karena diduga menggelapkan dana dari bank tersebut."
