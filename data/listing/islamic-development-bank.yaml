label:
  ar: البنك الإسلامي للتنمية
  en: Islamic Development Bank (IsDB)
  ur: اسلامی ترقیاتی بینک
summary:
  ar: مؤسسة تمويل إنمائي متعددة الأطراف مقرها جدة، تركز على التمويل الإسلامي لتنمية البنية التحتية؛ أُسست سنة 1973 وبدأت نشاطها
    في 3 أبريل 1975، ولها 57 دولة عضوا أكبرها حصة السعودية، وضاعفت رأس مالها المرخص به ثلاث مرات إلى 150 مليار دولار سنة 2013.
  en: A multilateral development finance institution in Jeddah focused on Islamic finance for infrastructure development;
    founded in 1973, it began operating on 3 April 1975, has 57 member states with Saudi Arabia the largest shareholder, and
    tripled its authorised capital to US$150 billion in 2013.
  ur: جدہ میں قائم کثیر الفریقی ترقیاتی مالیاتی ادارہ جو بنیادی ڈھانچے کے لیے اسلامی مالیات پر مرکوز ہے؛ 1973 میں قائم ہوا
    اور 3 اپریل 1975 سے کام کر رہا ہے؛ 57 رکن ملک ہیں، اور 2013 میں اس نے اپنا منظور شدہ سرمایہ تین گنا کر کے 150 ارب ڈالر
    کیا۔
