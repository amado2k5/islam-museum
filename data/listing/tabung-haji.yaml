label:
  ar: صندوق الحج الماليزي ⁦(تابونغ حاجي)⁩
  en: Tabung Haji (Lembaga Tabung Haji)
  ur: تابونگ حاجی
summary:
  ar: هيئة صندوق الحجاج الماليزية، مؤسسة حكومية تيسّر للمسلمين الادخار للحج عبر استثمارات متوافقة مع الشريعة وتتولى شؤون حجاجهم؛
    بدأت بإيداعات سنة 1963 وتكوّنت سنة 1969، ومرّت بأزمة مالية سنة 2018 حققت فيها لجنة ملكية.
  en: Malaysia's hajj pilgrims fund board, a state-owned body that helps Muslims save for the pilgrimage through Shariah-compliant
    investment and manages their hajj; it began taking deposits in 1963, was formed in 1969, and went through a financial
    crisis in 2018 that a royal commission investigated.
  ur: ملائیشیا کا حج فنڈ بورڈ، ایک سرکاری ادارہ جو مسلمانوں کو شریعت کے مطابق سرمایہ کاری سے حج کے لیے بچت میں مدد دیتا اور
    ان کے حج کا انتظام کرتا ہے؛ 1963 میں ڈپازٹ لینا شروع کیا، 1969 میں بنا، اور 2018 کے مالی بحران سے گزرا جس کی شاہی کمیشن
    نے تحقیق کی۔
