summary:
  ar: "دار نشر وتوزيع إسلامية دولية أسسها سنة 1986 العالم الباكستاني المقيم في مكة عبد المالك مجاهد، بدأت متجرًا واحدًا في السعودية ثم امتدت إلى 35 بلدًا، وتطبع أساسًا في شيخوبورة بباكستان؛ نشرت أكثر من 1500 كتاب، وترجمات للقرآن وتفسيره بـ29 لغة، والكتب الستة في الحديث بالإنجليزية في 38 مجلدًا، وصارت سنة 2020 ثاني أكبر ناشر لترجمات النصوص الإسلامية بعد مجمع الملك فهد."
  en: "An international Islamic publishing and distribution house founded in 1986 by the Mecca-based Pakistani scholar Abdul Malik Mujahid, which grew from a single shop in Saudi Arabia to 35 countries and prints mainly in Sheikhupura, Pakistan; it has published over 1,500 books, translations and interpretations of the Qur'an in 29 languages and the six hadith collections in English in 38 volumes, and by 2020 was the second-largest publisher of translations of Islamic scripture after the King Fahd Complex."
  ur: "بین الاقوامی اسلامی اشاعتی و تقسیمی ادارہ جو 1986 میں مکہ میں مقیم پاکستانی عالم عبد المالک مجاہد نے قائم کیا؛ سعودی عرب کی ایک دکان سے 35 ممالک تک پھیلا اور زیادہ تر شیخوپورہ، پاکستان میں چھپائی کرتا ہے؛ 1500 سے زیادہ کتابیں، 29 زبانوں میں قرآن کے تراجم و تفاسیر، اور صحاحِ ستہ کا انگریزی ترجمہ 38 جلدوں میں شائع کیا، اور 2020 میں شاہ فہد کمپلیکس کے بعد اسلامی متون کے تراجم کا دوسرا بڑا ناشر بنا۔"
