label:
  ar: مؤشر داو جونز للسوق الإسلامية
  en: Dow Jones Islamic Market Index (DJIM)
  ur: ڈاؤ جونز اسلامک مارکیٹ انڈیکس
  es: "Índice del Mercado Islámico Dow Jones (DJIM)"
  fr: "Indice Dow Jones du marché islamique (DJIM)"
  tr: "Dow Jones İslami Piyasa Endeksi"
  id: "Indeks Pasar Islam Dow Jones"
summary:
  ar: مؤشر لسوق الأسهم أُطلق سنة 1999 للمستثمرين الباحثين عن استثمارات متوافقة مع الشريعة، تديره إس آند بي داو جونز للمؤشرات،
    وتفحص شركاته هيئة رقابة شرعية مستقلة.
  en: A stock-market index launched in 1999 for investors seeking Sharia-compliant investments, operated by S&P Dow Jones
    Indices; an independent Shariah Supervisory Board screens its companies.
  ur: اسٹاک مارکیٹ کا اشاریہ جو 1999 میں شریعت کے مطابق سرمایہ کاری کے لیے شروع ہوا؛ اسے ایس اینڈ پی ڈاؤ جونز انڈیسز چلاتا
    ہے، اور ایک آزاد شرعی نگران بورڈ اس کی کمپنیوں کی جانچ کرتا ہے۔
  es: "Un índice bursátil lanzado en 1999 para inversores que buscan inversiones que cumplan con la ley islámica (Sharia), gestionado por S&P Dow Jones Indices; una Junta de Supervisión Islámica independiente examina a las empresas que lo componen."
  fr: "Un indice boursier lancé en 1999 pour les investisseurs recherchant des placements conformes à la charia, géré par S&P Dow Jones Indices; un conseil de surveillance de la charia indépendant examine ses sociétés."
  tr: "1999 yılında Şeriat uyumlu yatırımlar arayan yatırımcılar için piyasaya sürülen, S&P Dow Jones Indices tarafından yönetilen ve şirketlerinin bağımsız bir Şeriat denetleme kurulu tarafından incelendiği bir borsa endeksi."
  id: "Indeks pasar saham yang diluncurkan pada tahun 1999 untuk investor yang mencari investasi yang sesuai dengan syariah, dikelola oleh S&P Dow Jones Indices, dan perusahaan-perusahaannya diperiksa oleh dewan pengawas syariah independen."
