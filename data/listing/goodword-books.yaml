summary:
  ar: "دار نشر هندية في دلهي أسسها ثنية السنين خان سنة 1996، امتدادًا للمركز الإسلامي الذي أسسه أبوه العالم وحيد الدين خان في دلهي سنة 1976؛ تُعنى بكتب الأطفال المصوّرة عن القيم الإسلامية، وتنشر كذلك للكبار في التاريخ والدين والفلسفة والدعوة وتعلّم العربية، وأعادت طبع ترجمة إيرفنغ الأمريكية للقرآن."
  en: "An Indian publisher in Delhi founded in 1996 by Saniyasnain Khan as an outgrowth of the Islamic Centre his father, the scholar Maulana Wahiduddin Khan, founded in Delhi in 1976; it concentrates on illustrated children's books on Islamic values, also publishes for adults in history, religion, philosophy, da'wa and Arabic learning, and reissued T. B. Irving's American translation of the Qur'an."
  ur: "دہلی کا ہندوستانی اشاعتی ادارہ جو 1996 میں ثنیہ السنین خان نے اپنے والد مولانا وحید الدین خان کے 1976 میں دہلی میں قائم کردہ اسلامی مرکز کے تسلسل میں قائم کیا؛ اسلامی اقدار پر بچوں کی مصور کتابوں پر توجہ دیتا ہے، بڑوں کے لیے تاریخ، دین، فلسفہ، دعوت اور عربی سیکھنے کی کتابیں بھی شائع کرتا ہے، اور اس نے اروِنگ کا امریکی ترجمۂ قرآن دوبارہ شائع کیا۔"
