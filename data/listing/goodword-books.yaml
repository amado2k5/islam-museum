summary:
  ar: "دار نشر هندية في دلهي أسسها ثنية السنين خان سنة 1996، امتدادًا للمركز الإسلامي الذي أسسه أبوه العالم وحيد الدين خان في دلهي سنة 1976؛ تُعنى بكتب الأطفال المصوّرة عن القيم الإسلامية، وتنشر كذلك للكبار في التاريخ والدين والفلسفة والدعوة وتعلّم العربية، وأعادت طبع ترجمة إيرفنغ الأمريكية للقرآن."
  en: "An Indian publisher in Delhi founded in 1996 by Saniyasnain Khan as an outgrowth of the Islamic Centre his father, the scholar Maulana Wahiduddin Khan, founded in Delhi in 1976; it concentrates on illustrated children's books on Islamic values, also publishes for adults in history, religion, philosophy, da'wa and Arabic learning, and reissued T. B. Irving's American translation of the Qur'an."
  ur: "دہلی کا ہندوستانی اشاعتی ادارہ جو 1996 میں ثنیہ السنین خان نے اپنے والد مولانا وحید الدین خان کے 1976 میں دہلی میں قائم کردہ اسلامی مرکز کے تسلسل میں قائم کیا؛ اسلامی اقدار پر بچوں کی مصور کتابوں پر توجہ دیتا ہے، بڑوں کے لیے تاریخ، دین، فلسفہ، دعوت اور عربی سیکھنے کی کتابیں بھی شائع کرتا ہے، اور اس نے اروِنگ کا امریکی ترجمۂ قرآن دوبارہ شائع کیا۔"
  es: "Una editorial india con sede en Delhi, fundada en 1996 por Saniyasnain Khan como una extensión del Centro Islámico que su padre, el erudito Maulana Wahiduddin Khan, fundó en Delhi en 1976; se centra en libros infantiles ilustrados sobre valores islámicos, también publica para adultos sobre historia, religión, filosofía, da'wa y aprendizaje del árabe, y reeditó la traducción estadounidense del Corán de TB Irving."
  fr: "Maison d'édition indienne basée à Delhi, fondée en 1996 par Saniyasnain Khan dans le prolongement du Centre islamique que son père, l'érudit Maulana Wahiduddin Khan, avait fondé à Delhi en 1976, elle se concentre sur les livres illustrés pour enfants sur les valeurs islamiques, publie également pour adultes des ouvrages d'histoire, de religion, de philosophie, de da'wa et d'apprentissage de la langue arabe, et a réédité la traduction américaine du Coran par TB Irving."
  tr: "Hindistan'ın Delhi şehrinde bulunan ve 1996 yılında Thaniya Sanin Khan tarafından, babası alim Wahiduddin Khan'ın 1976'da Delhi'de kurduğu İslam Merkezi'nin bir uzantısı olarak kurulan bir yayınevi; İslami değerler hakkında çocuk resimli kitapları yayınlamanın yanı sıra, yetişkinler için tarih, din, felsefe, savunuculuk ve Arapça öğrenimi konularında da yayınlar yapıyor ve Irving'in Kur'an'ın Amerikan çevirisini yeniden bastı."
  id: "Sebuah penerbit India di Delhi, didirikan oleh Thaniya Sanin Khan pada tahun 1996, sebagai perluasan dari Pusat Islam yang didirikan oleh ayahnya, cendekiawan Wahiduddin Khan, di Delhi pada tahun 1976; penerbit ini berfokus pada buku bergambar anak-anak tentang nilai-nilai Islam, dan juga menerbitkan buku untuk orang dewasa tentang sejarah, agama, filsafat, advokasi, dan pembelajaran bahasa Arab, serta mencetak ulang terjemahan Al-Qur'an karya Irving dari Amerika."
