summary:
  ar: بنك سعودي إسلامي مساهم مقره الرياض، أُسس سنة 2004 ويقدّم منتجات متوافقة مع الشريعة بإشراف لجنة شرعية؛ ذراعه للحوالات
    «إنجاز»، وجاء السادس عشر في قائمة فوربس الشرق الأوسط لأعلى 30 بنكا قيمة لسنة 2025.
  en: A Saudi Islamic joint-stock bank based in Riyadh, established in 2004, offering Sharia-compliant products under a Sharia
    Committee; its remittance arm is Enjaz, and it was 16th on Forbes Middle East's 30 Most Valuable Banks 2025.
  ur: ریاض میں قائم سعودی اسلامی مشترکہ سرمایہ بینک، جو 2004 میں قائم ہوا اور ایک شرعی کمیٹی کی نگرانی میں شریعت کے مطابق
    مصنوعات پیش کرتا ہے؛ اس کا ترسیلاتِ زر کا شعبہ انجاز ہے، اور فوربس مڈل ایسٹ کی 2025 کی 30 سب سے قیمتی بینکوں کی فہرست
    میں سولہواں رہا۔
