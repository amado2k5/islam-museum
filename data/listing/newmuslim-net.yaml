summary:
  ar: "دليل إلكتروني للمسلمين الجدد ومن يفكر في اعتناق الإسلام: أبجديات الإسلام وأركانه والعبادات والنبي ونمط الحياة المسلم وقصص الاعتناق، بلغات كثيرة."
  en: "An online guide for new Muslims and people considering conversion: the ABCs of Islam, the pillars, acts of worship, the Prophet, Muslim lifestyle and conversion stories, offered in many languages."
  ur: "نئے مسلمانوں اور اسلام قبول کرنے پر غور کرنے والوں کے لیے آن لائن رہنما: اسلام کے بنیادی تعارف، ارکان، عبادات، نبی، مسلم طرزِ زندگی اور قبولِ اسلام کی کہانیاں، کئی زبانوں میں۔"
  fr: "Un guide en ligne pour les nouveaux musulmans et ceux qui envisagent la conversion : l'abc de l'islam, les piliers, les actes d'adoration, le Prophète, le mode de vie musulman et des récits de conversion, dans de nombreuses langues."
  es: "Una guía en línea para nuevos musulmanes y para quienes consideran convertirse: el abecé del islam, los pilares, los actos de culto, el Profeta, el estilo de vida musulmán y relatos de conversión, en muchos idiomas."
  tr: "Yeni Müslümanlar ve Müslüman olmayı düşünenler için çevrimiçi rehber: İslam'ın ABC'si, şartlar, ibadetler, Peygamber, Müslümanca yaşam ve Müslüman olma hikâyeleri; birçok dilde."
  id: "Panduan daring untuk Muslim baru dan mereka yang mempertimbangkan masuk Islam: dasar-dasar Islam, rukun, ibadah, Nabi, gaya hidup Muslim dan kisah para mualaf, dalam banyak bahasa."
