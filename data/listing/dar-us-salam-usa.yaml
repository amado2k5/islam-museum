  fr: "Une librairie islamique à Houston, aux États-Unis, qui vend des livres en anglais sur le credo, le hadith, le droit, la vie du Prophète, l'exégèse, la prédication et la vie de famille, dont des titres pour les nouveaux musulmans."
  es: "Una librería islámica en Houston, Estados Unidos, que vende libros en inglés sobre credo, hadices, jurisprudencia, la vida del Profeta, exégesis, divulgación y vida familiar, incluidos títulos para nuevos musulmanes."
  tr: "ABD'nin Houston kentinde, akaid, hadis, fıkıh, siyer, tefsir, davet ve aile hayatı üzerine İngilizce kitaplar satan, yeni Müslümanlara yönelik başlıkları da bulunan bir İslami kitabevi."
