  ar: "متجر كتب إسلامية بالإنجليزية في هيوستن بالولايات المتحدة: العقيدة والحديث والفقه والسيرة والتفسير والدعوة وكتب الأسرة، ومنها عناوين للمسلمين الجدد."
  en: "An Islamic bookstore in Houston, USA, selling English books on creed, hadith, jurisprudence, the Prophet's life, commentary, outreach and family life, including titles for new Muslims."
