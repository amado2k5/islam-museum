summary:
  ar: "منظمة خيرية في المملكة المتحدة تصف رسالتها بأنها مركز جامع لدعم من يعتنقون الإسلام عبر بناء القدرات والبحث والتمثيل والمناصرة، وفيها رعاية للمعتنقين وموارد وفعاليات."
  en: "A charitable organisation in the United Kingdom that describes its mission as the central hub for supporting those embracing Islam, through capacity building, research, representation and advocacy, with convert-care pages, resources and events."
  ur: "برطانیہ کی ایک خیراتی تنظیم جو اپنے مشن کو اسلام قبول کرنے والوں کی معاونت کا مرکزی مرکز بتاتی ہے، صلاحیت سازی، تحقیق، نمائندگی اور وکالت کے ذریعے؛ اس میں نو مسلموں کی نگہداشت کے صفحات، وسائل اور تقریبات ہیں۔"
  fr: "Une organisation caritative du Royaume-Uni qui décrit sa mission comme le pôle central de soutien à celles et ceux qui embrassent l'islam, par le renforcement des capacités, la recherche, la représentation et le plaidoyer, avec des pages d'accompagnement des convertis, des ressources et des événements."
  es: "Una organización benéfica del Reino Unido que describe su misión como el centro de apoyo a quienes abrazan el islam, mediante el desarrollo de capacidades, la investigación, la representación y la defensa de derechos, con páginas de acompañamiento a conversos, recursos y eventos."
  tr: "Birleşik Krallık'ta, misyonunu İslam'ı kabul edenlere destek veren merkezî bir yapı olarak tanımlayan hayır kurumu: kapasite geliştirme, araştırma, temsil ve savunuculuk yoluyla; yeni Müslümanlara destek sayfaları, kaynaklar ve etkinlikler sunar."
  id: "Organisasi amal di Britania Raya yang menggambarkan misinya sebagai pusat dukungan bagi mereka yang memeluk Islam, melalui pengembangan kapasitas, penelitian, representasi dan advokasi, dengan halaman pendampingan mualaf, sumber daya dan acara."
