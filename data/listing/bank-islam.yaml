label:
  ar: بنك إسلام ماليزيا
  en: Bank Islam Malaysia
  ur: بینک اسلام ملائیشیا
summary:
  ar: بنك ماليزي مقره كوالالمبور، بدأ العمل في 1 يوليو 1983 أولَ بنك إسلامي في ماليزيا، برأس مال مدفوع قدره 80 مليون رينغيت؛
    صندوق الحج الماليزي ⁦(تابونغ حاجي)⁩ كان مساهمه الرئيس، ومرّ بخطة إنقاذ بعد خسائر 2005 و2006.
  en: A Malaysian bank based in Kuala Lumpur that began operating on 1 July 1983 as Malaysia's first Islamic bank, with paid-up
    capital of RM80 million; Lembaga Tabung Haji, the pilgrims' fund, was its main shareholder, and it went through a recovery
    plan after the losses of 2005 and 2006.
  ur: کوالالمپور میں قائم ملائیشیائی بینک، جس نے 1 جولائی 1983 کو ملائیشیا کے پہلے اسلامی بینک کے طور پر 8 کروڑ رنگٹ کے ادا
    شدہ سرمائے سے کام شروع کیا؛ حج فنڈ لمباگا تابونگ حاجی اس کا بڑا حصہ دار تھا، اور 2005 اور 2006 کے خسارے کے بعد بحالی کے
    منصوبے سے گزرا۔
