label:
  ar: مصرف الراجحي
  en: Alrajhi Bank
  ur: مصرف الراجحی
summary:
  ar: بنك سعودي مقره الرياض يعمل وفق أحكام الشريعة، يعود تأسيسه إلى 1957، وكان اسمه شركة الراجحي المصرفية للاستثمار حتى 2006؛
    عدّته بيانات 2015 أكبر بنك إسلامي في العالم برأس المال، وجاء أول قائمة فوربس الشرق الأوسط لأعلى 30 بنكا قيمة لسنة 2025.
  en: A Saudi bank based in Riyadh that operates according to Sharia, founded in 1957 and known as Al Rajhi Banking and Investment
    Corporation until 2006; 2015 data made it the world's largest Islamic bank by capital, and it was first on Forbes Middle
    East's 30 Most Valuable Banks 2025.
  ur: ریاض میں قائم سعودی بینک جو شریعت کے مطابق کام کرتا ہے؛ 1957 میں قائم ہوا اور 2006 تک الراجحی بینکنگ اینڈ انویسٹمنٹ
    کارپوریشن کہلاتا تھا؛ 2015 کے اعداد کے مطابق سرمائے کے لحاظ سے دنیا کا سب سے بڑا اسلامی بینک، اور فوربس مڈل ایسٹ کی 2025
    کی 30 سب سے قیمتی بینکوں کی فہرست میں پہلے نمبر پر۔
