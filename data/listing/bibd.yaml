label:
  ar: بنك إسلام بروناي دار السلام
  en: Bank Islam Brunei Darussalam (BIBD)
  ur: بینک اسلام برونائی دارالسلام
summary:
  ar: أكبر بنك في بروناي ومؤسستها المالية الإسلامية الرئيسة، نشأ سنة 2005 باندماج بنك بروناي الإسلامي وبنك بروناي الإسلامي
    للتنمية، ومقره بندر سري بكاوان؛ تملكه في الغالب الدولة عبر وكالة الاستثمار البروناوية.
  en: The largest bank in Brunei and its main Islamic financial institution, formed in 2005 by merging the Islamic Bank of
    Brunei and the Islamic Development Bank of Brunei, headquartered in Bandar Seri Begawan; the state, through the Brunei
    Investment Agency, holds most of it.
  ur: برونائی کا سب سے بڑا بینک اور اس کا بڑا اسلامی مالیاتی ادارہ، جو 2005 میں اسلامک بینک آف برونائی اور اسلامک ڈیولپمنٹ
    بینک آف برونائی کے انضمام سے بنا؛ صدر دفتر بندر سری بیگوان میں ہے، اور ریاست برونائی انویسٹمنٹ ایجنسی کے ذریعے اس کی بڑی
    مالک ہے۔
