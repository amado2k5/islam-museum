summary:
  ar: "دار نشر بريطانية تأسست سنة 1997 في جنوب لندن، أسسها يحيى باثا امتدادًا لعمل أبيه الشيخ محمد بن أحمد باثا بردولي، بتشجيع من محمد تقي العثماني؛ بدأت بمشروع خمس سنوات لترجمة «موطأ الإمام محمد»، ولها أكثر من ستين عنوانًا من ترجمات الكتب الكلاسيكية والمؤلفات المعاصرة والمخطوطات، ومنها طبعة 2020 من ترجمة العثماني للقرآن."
  en: "A British publisher established in 1997 in South London by Yahya Batha as a continuation of the work of his father, Shaykh Muhammad ibn Ahmad Batha Bardoli, with the encouragement of Muhammad Taqi Usmani; it began with a five-year project to translate the Muwatta of Imam Muhammad and has over sixty titles of classical translations, contemporary works and manuscripts, including the 2020 edition of Usmani's Qur'an translation."
  ur: "برطانوی اشاعتی ادارہ جو 1997 میں جنوبی لندن میں یحییٰ باثا نے اپنے والد شیخ محمد بن احمد باثا بردولی کے کام کے تسلسل میں مفتی محمد تقی عثمانی کی حوصلہ افزائی سے قائم کیا؛ «موطا امام محمد» کے ترجمے کے پانچ سالہ منصوبے سے آغاز کیا اور کلاسیکی کتب کے تراجم، معاصر تصانیف اور مخطوطات کے ساٹھ سے زیادہ عنوانات شائع کیے، جن میں عثمانی کے ترجمۂ قرآن کی 2020 کی اشاعت بھی ہے۔"
  es: "Editorial británica fundada en 1997 en el sur de Londres por Yahya Batha como continuación del trabajo de su padre, Shaykh Muhammad ibn Ahmad Batha Bardoli, con el apoyo de Muhammad Taqi Usmani; comenzó con un proyecto de cinco años para traducir el Muwatta del Imam Muhammad y cuenta con más de sesenta títulos de traducciones clásicas, obras contemporáneas y manuscritos, incluida la edición de 2020 de la traducción del Corán de Usmani."
  fr: "Maison d'édition britannique fondée en 1997 dans le sud de Londres par Yahya Batha, dans la continuité de l'œuvre de son père, le cheikh Muhammad ibn Ahmad Batha Bardoli, avec le soutien de Muhammad Taqi Usmani, elle a débuté par un projet de cinq ans visant à traduire le Muwatta de l'imam Muhammad et compte plus de soixante titres de traductions classiques, d'œuvres contemporaines et de manuscrits, dont l'édition 2020 de la traduction du Coran par Usmani."
  tr: "1997 yılında Güney Londra'da kurulan İngiliz yayınevi, Yahya Batha tarafından babası Şeyh Muhammed bin Ahmed Batha Bardouli'nin çalışmalarının bir uzantısı olarak ve Muhammed Taqi Usmani'nin teşvikiyle kurulmuştur; \"İmam Muhammed'in Muwatta'sı\"nın çevirisi için beş yıllık bir projeyle başlamış ve Usmani'nin Kur'an çevirisinin 2020 baskısı da dahil olmak üzere altmıştan fazla klasik kitap, çağdaş eser ve el yazması çevirisine sahiptir."
  id: "Sebuah penerbit Inggris yang didirikan pada tahun 1997 di London Selatan, didirikan oleh Yahya Batha sebagai kelanjutan dari karya ayahnya, Sheikh Muhammad bin Ahmad Batha Bardouli, dengan dorongan dari Muhammad Taqi Usmani; dimulai dengan proyek lima tahun untuk menerjemahkan “Muwatta’ karya Imam Muhammad”, dan telah menerbitkan lebih dari enam puluh judul terjemahan buku-buku klasik, karya kontemporer, dan manuskrip, termasuk edisi 2020 terjemahan Al-Qur'an karya Usmani."
