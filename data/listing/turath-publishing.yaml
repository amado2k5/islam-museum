summary:
  ar: "دار نشر بريطانية تأسست سنة 1997 في جنوب لندن، أسسها يحيى باثا امتدادًا لعمل أبيه الشيخ محمد بن أحمد باثا بردولي، بتشجيع من محمد تقي العثماني؛ بدأت بمشروع خمس سنوات لترجمة «موطأ الإمام محمد»، ولها أكثر من ستين عنوانًا من ترجمات الكتب الكلاسيكية والمؤلفات المعاصرة والمخطوطات، ومنها طبعة 2020 من ترجمة العثماني للقرآن."
  en: "A British publisher established in 1997 in South London by Yahya Batha as a continuation of the work of his father, Shaykh Muhammad ibn Ahmad Batha Bardoli, with the encouragement of Muhammad Taqi Usmani; it began with a five-year project to translate the Muwatta of Imam Muhammad and has over sixty titles of classical translations, contemporary works and manuscripts, including the 2020 edition of Usmani's Qur'an translation."
  ur: "برطانوی اشاعتی ادارہ جو 1997 میں جنوبی لندن میں یحییٰ باثا نے اپنے والد شیخ محمد بن احمد باثا بردولی کے کام کے تسلسل میں مفتی محمد تقی عثمانی کی حوصلہ افزائی سے قائم کیا؛ «موطا امام محمد» کے ترجمے کے پانچ سالہ منصوبے سے آغاز کیا اور کلاسیکی کتب کے تراجم، معاصر تصانیف اور مخطوطات کے ساٹھ سے زیادہ عنوانات شائع کیے، جن میں عثمانی کے ترجمۂ قرآن کی 2020 کی اشاعت بھی ہے۔"
