label:
  ar: بيت التمويل الكويتي ⁦(بيتك)⁩
  en: Kuwait Finance House (KFH)
  ur: بیت التمویل الکویتی (KFH)
summary:
  ar: بنك كويتي تأسس سنة 1977 أولَ بنك في الكويت يعمل وفق أحكام الشريعة، بدأ العمل في 31 أغسطس 1978، وأُدرج في سوق الكويت
    للأوراق المالية سنة 1984؛ له فروع وشركات تابعة في البحرين وتركيا ومصر والعراق والسعودية والإمارات، واستحوذ على البنك الأهلي
    المتحد سنة 2022، وتملك صناديق حكومية كويتية أكبر حصصه.
  en: A Kuwaiti bank founded in 1977 as Kuwait's first bank operating according to Sharia rulings; it opened on 31 August
    1978 and was listed on the Kuwait Stock Exchange in 1984; it has branches and subsidiaries in Bahrain, Turkey, Egypt,
    Iraq, Saudi Arabia and the UAE, completed its acquisition of Ahli United Bank in 2022, and Kuwaiti state funds hold its
    largest stakes.
  ur: کویتی بینک جو 1977 میں کویت کے پہلے شریعت کے مطابق کام کرنے والے بینک کے طور پر قائم ہوا؛ 31 اگست 1978 کو کام شروع کیا
    اور 1984 میں کویت اسٹاک ایکسچینج میں درج ہوا؛ بحرین، ترکی، مصر، عراق، سعودی عرب اور امارات میں شاخیں اور ذیلی ادارے ہیں،
    2022 میں اہلی یونائیٹڈ بینک کا حصول مکمل کیا، اور کویتی سرکاری فنڈز اس کے سب سے بڑے حصہ دار ہیں۔
