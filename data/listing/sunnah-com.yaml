summary:
  ar: "موقع لنشر كتب الحديث بنصوصها العربية وترجماتها، أساسه الكتب الستة ومعها موطأ مالك ومسند أحمد ورياض الصالحين وغيرها؛ يذكر أنه أخذ النص العربي من موقع الإيمان ومصادر أخرى متوقفة، وأن ترجماته الإنجليزية لمترجمين عدة، ويعرض أحكام الألباني ودار السلام على أحاديث غير الصحيحين، ويسعى إلى ترقيم موحد؛ وكان يقدّم سنة 2021 الإنجليزية والعربية والأردية."
  en: "A website publishing the books of hadith in their Arabic texts and translations, built on the Six Books with the Muwatta of Malik, the Musnad of Ahmad, Riyad al-Salihin and others; it says its Arabic text comes from al-eman.com and other defunct sources and its English from several translators, shows al-Albani's and Darussalam's grades for hadith outside the two Sahihs, and is moving to unified numbering; in 2021 it offered English, Arabic and Urdu."
  ur: "حدیث کی کتابیں عربی متن اور تراجم کے ساتھ شائع کرنے والی ویب سائٹ، جس کی بنیاد کتبِ ستہ ہیں، ساتھ مؤطا امام مالک، مسند احمد اور ریاض الصالحین؛ اس کے بقول عربی متن الایمان ڈاٹ کام اور دیگر بند ذرائع سے لیا گیا اور انگریزی کئی مترجمین کی ہے؛ صحیحین کے علاوہ احادیث پر البانی اور دار السلام کے احکام دکھاتی ہے؛ 2021 میں انگریزی، عربی اور اردو میں تھی۔"
