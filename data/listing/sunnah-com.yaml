summary:
  ar: "موقع لنشر كتب الحديث بنصوصها العربية وترجماتها، أساسه الكتب الستة ومعها موطأ مالك ومسند أحمد ورياض الصالحين وغيرها؛ يذكر أنه أخذ النص العربي من موقع الإيمان ومصادر أخرى متوقفة، وأن ترجماته الإنجليزية لمترجمين عدة، ويعرض أحكام الألباني ودار السلام على أحاديث غير الصحيحين، ويسعى إلى ترقيم موحد؛ وكان يقدّم سنة 2021 الإنجليزية والعربية والأردية."
  en: "A website publishing the books of hadith in their Arabic texts and translations, built on the Six Books with the Muwatta of Malik, the Musnad of Ahmad, Riyad al-Salihin and others; it says its Arabic text comes from al-eman.com and other defunct sources and its English from several translators, shows al-Albani's and Darussalam's grades for hadith outside the two Sahihs, and is moving to unified numbering; in 2021 it offered English, Arabic and Urdu."
  ur: "حدیث کی کتابیں عربی متن اور تراجم کے ساتھ شائع کرنے والی ویب سائٹ، جس کی بنیاد کتبِ ستہ ہیں، ساتھ مؤطا امام مالک، مسند احمد اور ریاض الصالحین؛ اس کے بقول عربی متن الایمان ڈاٹ کام اور دیگر بند ذرائع سے لیا گیا اور انگریزی کئی مترجمین کی ہے؛ صحیحین کے علاوہ احادیث پر البانی اور دار السلام کے احکام دکھاتی ہے؛ 2021 میں انگریزی، عربی اور اردو میں تھی۔"
  es: "Un sitio web que publica los libros de hadices en sus textos árabes y traducciones, basado en los Seis Libros con el Muwatta de Malik, el Musnad de Ahmad, Riyad al-Salihin y otros; afirma que su texto árabe proviene de al-eman.com y otras fuentes desaparecidas, y su inglés de varios traductores, muestra las clasificaciones de al-Albani y Darussalam para los hadices fuera de los dos Sahihs, y está adoptando una numeración unificada; en 2021 ofrecía inglés, árabe y urdu."
  fr: "Un site web publiant les recueils de hadiths dans leurs textes arabes et leurs traductions, s'appuyant sur les Six Livres avec la Muwatta de Malik, le Musnad d'Ahmad, Riyad al-Salihin et d'autres; il indique que son texte arabe provient d'al-eman.com et d'autres sources aujourd'hui disparues, et son texte anglais de plusieurs traducteurs, présente les classifications d'al-Albani et de Darussalam pour les hadiths ne figurant pas dans les deux Sahihs, et est en voie d'adopter une numérotation unifiée; en 2021, il proposait des versions anglaise, arabe et ourdou."
  tr: "Altı Kitap'a dayalı olarak, Arapça metinleri ve çevirileriyle birlikte Hadis kitaplarını yayınlamak için bir web sitesi; Malik'in Muvattası, Ahmed'in Musnadı, Riyad-ı Salihin ve diğerlerini de içeriyor; Arapça metinleri Al-Iman web sitesinden ve artık aktif olmayan diğer kaynaklardan aldığını ve İngilizce çevirilerinin çeşitli çevirmenler tarafından yapıldığını belirtiyor. İki Sahih dışındaki Hadisler hakkında Al-Albani ve Dar-es-Salam'ın hükümlerini sunuyor ve birleşik bir numaralandırma sistemi arıyor; ve 2021'de İngilizce, Arapça ve Urduca dillerinde hizmet veriyordu."
  id: "Sebuah situs web untuk menerbitkan kitab-kitab Hadits beserta teks dan terjemahan bahasa Arabnya, berdasarkan Enam Kitab, bersama dengan Muwatta Malik, Musnad Ahmad, Riyad as-Salihin, dan lainnya; situs ini menyatakan bahwa teks bahasa Arab diambil dari situs web Al-Iman dan sumber-sumber lain yang sudah tidak aktif, dan terjemahan bahasa Inggrisnya dilakukan oleh beberapa penerjemah. Situs ini menyajikan fatwa Al-Albani dan Dar as-Salam tentang Hadits selain dua kitab Sahih, dan berupaya untuk menciptakan sistem penomoran yang terpadu; dan pada tahun 2021 situs ini menawarkan terjemahan dalam bahasa Inggris, Arab, dan Urdu."
