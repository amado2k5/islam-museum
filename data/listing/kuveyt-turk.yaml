label:
  ar: كويت ترك
  en: Kuveyt Türk Participation Bank
  ur: کویت ترک شراکتی بینک
  es: "Banco de Participación Kuveyt Türk"
  fr: "Banque de participation Kuveyt Türk"
  tr: "Kuveyt Türkü"
