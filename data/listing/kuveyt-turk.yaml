label:
  ar: كويت ترك
  en: Kuveyt Türk Participation Bank
  ur: کویت ترک شراکتی بینک
summary:
  ar: بنك مشاركة تركي مقره إسطنبول، أُسس سنة 1989 مؤسسةَ تمويل خاصة وفق قرار مجلس الوزراء التركي رقم 831/7506 لسنة 1983، وخضع
    لقانون البنوك منذ 1999، وصار اسمه كويت ترك بنك المشاركة في مايو 2006؛ بيت التمويل الكويتي أكبر مساهميه.
  en: A Turkish participation bank based in Istanbul, founded in 1989 as a special finance house under Turkish Council of
    Ministers Decision No. 831/7506 of 1983, subject to the Banking Law from 1999 and named Kuveyt Türk Katılım Bankası in
    May 2006; Kuwait Finance House is its largest shareholder.
  ur: استنبول میں قائم ترک شراکتی بینک، جو 1989 میں 1983 کے ترک وزرا کونسل کے فیصلے نمبر 831/7506 کے تحت قائم ہوا، 1999 سے
    بینکاری قانون کے تابع ہے اور مئی 2006 میں اس کا موجودہ نام ہوا؛ بیت التمویل الکویتی اس کا سب سے بڑا حصہ دار ہے۔
