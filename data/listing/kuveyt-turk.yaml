summary:
  ar: بنك مشاركة تركي مقره إسطنبول، أُسس سنة 1989 مؤسسةَ تمويل خاصة وفق قرار مجلس الوزراء التركي رقم 831/7506 لسنة 1983، وخضع
    لقانون البنوك منذ 1999، وصار اسمه كويت ترك بنك المشاركة في مايو 2006؛ بيت التمويل الكويتي أكبر مساهميه.
  en: A Turkish participation bank based in Istanbul, founded in 1989 as a special finance house under Turkish Council of
    Ministers Decision No. 831/7506 of 1983, subject to the Banking Law from 1999 and named Kuveyt Türk Katılım Bankası in
    May 2006; Kuwait Finance House is its largest shareholder.
  ur: استنبول میں قائم ترک شراکتی بینک، جو 1989 میں 1983 کے ترک وزرا کونسل کے فیصلے نمبر 831/7506 کے تحت قائم ہوا، 1999 سے
    بینکاری قانون کے تابع ہے اور مئی 2006 میں اس کا موجودہ نام ہوا؛ بیت التمویل الکویتی اس کا سب سے بڑا حصہ دار ہے۔
  es: "Banco de participación turca con sede en Estambul, fundado en 1989 como entidad financiera especial en virtud de la Decisión n.º 831/7506 del Consejo de Ministros turco de 1983, sujeto a la Ley Bancaria desde 1999 y denominado Kuveyt Türk Katılım Bankası en mayo de 2006; Kuwait Finance House es su mayor accionista."
  fr: "Une banque de participation turque basée à Istanbul, fondée en 1989 en tant qu'établissement financier spécial en vertu de la décision n° 831/7506 de 1983 du Conseil des ministres turc, soumise à la loi bancaire à partir de 1999 et nommée Kuveyt Türk Katılım Bankası en mai 2006; Kuwait Finance House est son principal actionnaire."
  tr: "İstanbul merkezli, 1989 yılında Türkiye Cumhuriyeti Bakanlar Kurulu'nun 831/7506 sayılı kararıyla özel finans kuruluşu olarak kurulan ve 1999 yılından itibaren Bankacılık Kanunu'na tabi olan Kuveyt Türk Katılım Bankası, Mayıs 2006'da adını almıştır; en büyük hissedarı Kuveyt Finans Evi'dir."
  id: "Sebuah bank partisipasi Turki yang berbasis di Istanbul, didirikan pada tahun 1989 sebagai lembaga pembiayaan swasta sesuai dengan Keputusan Kabinet Turki No. 831/7506 tahun 1983, dan tunduk pada Undang-Undang Perbankan sejak tahun 1999, dan namanya berubah menjadi Kuveyt Türk Participation Bank pada Mei 2006; Kuwait Finance House adalah pemegang saham terbesarnya."
