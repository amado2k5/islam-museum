summary:
  ar: أول شركة تكافل ⁦(تأمين إسلامي)⁩ في ماليزيا، أُسست في 29 نوفمبر 1984 في سنة صدور قانون التكافل، وأُدرجت في بورصة ماليزيا
    سنة 1996؛ صندوق الحج الماليزي أكبر مساهميها.
  en: Malaysia's first takaful (Islamic insurance) operator, established on 29 November 1984, the year of the Takaful Act,
    and listed on Bursa Malaysia in 1996; Lembaga Tabung Haji, the pilgrims' fund, is its largest shareholder.
  ur: ملائیشیا کا پہلا تکافل یعنی اسلامی بیمہ ادارہ، جو 29 نومبر 1984 کو، تکافل ایکٹ کے سال، قائم ہوا اور 1996 میں بورسا ملائیشیا
    میں درج ہوا؛ حج فنڈ لمباگا تابونگ حاجی اس کا سب سے بڑا حصہ دار ہے۔
