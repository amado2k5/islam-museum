summary:
  ar: "قناة تلفزيونية دينية إسلامية سعودية أسسها صالح عبد الله كامل وانطلقت في 1 رجب 1419هـ (21 أكتوبر 1998) ضمن شبكة راديو وتلفزيون العرب، بالعربية ثم بالإنجليزية من 2011، ببرامج للأسرة والطفل والمرأة والشباب؛ توقف بثها الفضائي في 1 يناير 2025 واستمرت على الإنترنت ومواقع التواصل."
  en: "A Saudi Islamic religious television channel founded by Saleh Abdullah Kamel and launched on 1 Rajab 1419 (21 October 1998) within the Arab Radio and Television network, in Arabic and, from 2011, in English, with programmes for the family, children, women and young people; its satellite broadcasts ended on 1 January 2025, and it continues online and on social media."
  ur: "سعودی اسلامی دینی ٹیلی وژن چینل جسے صالح عبداللہ کامل نے قائم کیا اور جو عرب ریڈیو اینڈ ٹیلی وژن نیٹ ورک کے تحت 1 رجب 1419ھ (21 اکتوبر 1998) کو شروع ہوا؛ عربی میں اور 2011 سے انگریزی میں بھی، خاندان، بچوں، خواتین اور نوجوانوں کے پروگراموں کے ساتھ۔ 1 جنوری 2025 کو سیٹلائٹ نشریات بند ہوئیں اور یہ انٹرنیٹ اور سوشل میڈیا پر جاری ہے۔"
