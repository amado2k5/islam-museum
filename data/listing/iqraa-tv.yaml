label: { ar: "قناة اقرأ الفضائية", en: "Iqraa TV", ur: "اقرأ ٹی وی", es: "Televisión Iqraa", fr: "Iqraa TV", tr: "Iqraa TV Kanalı", id: "Saluran TV Iqraa" }
summary:
  ar: "قناة تلفزيونية دينية إسلامية سعودية أسسها صالح عبد الله كامل وانطلقت في 1 رجب 1419هـ ⁦(21 أكتوبر 1998)⁩ ضمن شبكة راديو وتلفزيون العرب، بالعربية ثم بالإنجليزية من 2011، ببرامج للأسرة والطفل والمرأة والشباب؛ توقف بثها الفضائي في 1 يناير 2025 واستمرت على الإنترنت ومواقع التواصل."
  en: "A Saudi Islamic religious television channel founded by Saleh Abdullah Kamel and launched on 1 Rajab 1419 (21 October 1998) within the Arab Radio and Television network, in Arabic and, from 2011, in English, with programmes for the family, children, women and young people; its satellite broadcasts ended on 1 January 2025, and it continues online and on social media."
  ur: "سعودی اسلامی دینی ٹیلی وژن چینل جسے صالح عبداللہ کامل نے قائم کیا اور جو عرب ریڈیو اینڈ ٹیلی وژن نیٹ ورک کے تحت 1 رجب 1419ھ ⁦(21 اکتوبر 1998)⁩ کو شروع ہوا؛ عربی میں اور 2011 سے انگریزی میں بھی، خاندان، بچوں، خواتین اور نوجوانوں کے پروگراموں کے ساتھ۔ 1 جنوری 2025 کو سیٹلائٹ نشریات بند ہوئیں اور یہ انٹرنیٹ اور سوشل میڈیا پر جاری ہے۔"
  es: "Canal de televisión religioso islámico saudí fundado por Saleh Abdullah Kamel y lanzado el 1 de Rajab de 1419 (21 de octubre de 1998) dentro de la red de Radio y Televisión Árabe, en árabe y, desde 2011, en inglés, con programas para la familia, los niños, las mujeres y los jóvenes; sus emisiones vía satélite finalizaron el 1 de enero de 2025 y continúa en línea y en las redes sociales."
  fr: "Une chaîne de télévision religieuse islamique saoudienne fondée par Saleh Abdullah Kamel et lancée le 1er Rajab 1419 (21 octobre 1998) au sein du réseau de la radio et de la télévision arabes, en arabe et, à partir de 2011, en anglais, avec des programmes pour la famille, les enfants, les femmes et les jeunes; ses diffusions par satellite ont pris fin le 1er janvier 2025, et elle continue en ligne et sur les médias sociaux."
  tr: "Salih Abdullah Kamel tarafından kurulan ve 1 Receb 1419 Hicri (21 Ekim 1998) tarihinde Arap Radyo ve Televizyon Ağı'nın bir parçası olarak Arapça ve daha sonra 2011'den itibaren İngilizce olarak yayın hayatına başlayan Suudi Arabistan merkezli İslami dini televizyon kanalı; aile, çocuk, kadın ve gençler için programlar sunuyordu; uydu yayını 1 Ocak 2025'te sona erdi ve internet ve sosyal medya siteleri üzerinden yayınlarına devam etti."
  id: "Sebuah saluran televisi keagamaan Islam Saudi yang didirikan oleh Saleh Abdullah Kamel dan diluncurkan pada 1 Rajab 1419 H (21 Oktober 1998) sebagai bagian dari Jaringan Radio dan Televisi Arab, dalam bahasa Arab dan kemudian dalam bahasa Inggris mulai tahun 2011, dengan program untuk keluarga, anak-anak, wanita, dan pemuda; siaran satelitnya dihentikan pada 1 Januari 2025 dan berlanjut di internet dan situs jejaring sosial."
