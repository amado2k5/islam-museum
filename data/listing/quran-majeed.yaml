label:
  ar: "القرآن المجيد ⁦(تطبيق باكداتا)⁩"
  en: "Quran Majeed (Pakdata app)"
  ur: "قرآن مجید ⁦(پاک ڈیٹا کی ایپ)⁩"
summary:
  ar: "تطبيق لقراءة القرآن والاستماع إليه من شركة باكداتا في كراتشي، يضم تلاوات أكثر من ثلاثين قارئًا وترجمات وتفاسير بأكثر من خمسين لغة ومواقيت الصلاة والأذان والقبلة وأدوات للحفظ، على iOS وأندرويد وهواوي وماك؛ يقول موقعه إنه يعمل منذ 2010، وتعرض صفحته في جوجل بلاي أكثر من 10 ملايين تنزيل."
  en: "A Qur'an reading and listening app by Pakdata of Karachi, with recitations by more than thirty reciters, translations and tafsir in more than fifty languages, prayer times, the adhan, the qibla and memorisation tools, on iOS, Android, Huawei and macOS; its site says it has been in use since 2010, and its Google Play page shows 10M+ downloads."
  ur: "کراچی کی کمپنی پاک ڈیٹا کی قرآن پڑھنے اور سننے کی ایپ؛ تیس سے زیادہ قراء کی تلاوت، پچاس سے زیادہ زبانوں میں تراجم و تفاسیر، اوقاتِ نماز، اذان، قبلہ اور حفظ کے اوزار، iOS، اینڈرائیڈ، ہواوے اور میک پر؛ ویب سائٹ کے مطابق 2010 سے، اور گوگل پلے پر 1 کروڑ سے زائد ڈاؤن لوڈ۔"
