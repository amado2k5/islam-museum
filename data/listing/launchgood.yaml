summary:
  ar: منصة تمويل جماعي مقرها ديترويت تركز على المجتمع المسلم في العالم، انطلقت في أكتوبر 2013، وتصفها الصحافة بأنها منصة يديرها
    مسلمون؛ جمعت أكثر من 688 مليون دولار من 2.1 مليون متبرع في 155 بلدا.
  en: A crowdfunding platform based in Detroit focused on the Muslim community worldwide, live since October 2013 and described
    by the press as Muslim-run; it has raised more than US$688 million from 2.1 million donors in 155 countries.
  ur: ڈیٹرائٹ میں قائم کراؤڈ فنڈنگ پلیٹ فارم جو دنیا بھر کی مسلم برادری پر مرکوز ہے؛ اکتوبر 2013 سے فعال، اور پریس اسے مسلمانوں
    کا چلایا ہوا پلیٹ فارم کہتا ہے۔
  es: "Plataforma de financiación colectiva con sede en Detroit, centrada en la comunidad musulmana mundial, activa desde octubre de 2013 y descrita por la prensa como gestionada por musulmanes; ha recaudado más de 688 millones de dólares estadounidenses de 2,1 millones de donantes en 155 países."
  fr: "Une plateforme de financement participatif basée à Détroit et axée sur la communauté musulmane mondiale, active depuis octobre 2013 et décrite par la presse comme étant gérée par des musulmans; elle a levé plus de 688 millions de dollars auprès de 2,1 millions de donateurs dans 155 pays."
  tr: "Merkezi Detroit'te bulunan ve küresel Müslüman topluluğuna odaklanan, Ekim 2013'te kurulan ve basın tarafından Müslümanlar tarafından yönetilen bir platform olarak tanımlanan kitlesel fonlama platformu, 155 ülkeden 2,1 milyon bağışçıdan 688 milyon dolardan fazla para toplamıştır."
  id: "Sebuah platform penggalangan dana berbasis di Detroit yang berfokus pada komunitas Muslim global, diluncurkan pada Oktober 2013, dan digambarkan oleh pers sebagai platform yang dikelola oleh Muslim; platform ini telah mengumpulkan lebih dari $688 juta dari 2,1 juta donor di 155 negara."
