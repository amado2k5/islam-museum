summary:
  ar: "لعبة مغامرات وحركة من استوديو سيمافور السعودي ونشر شركته الأم سمانور الدولية، صدرت حلقتها الأولى في 29 مايو 2013 على بلايستيشن 3 وiOS ثم على الحاسوب والأندرويد، يتتبع فيها صائد كنوز عربي وأخته عالمة الآثار أثر الرحالة ابن بطوطة؛ قُدّمت بوصفها أول لعبة سعودية متعددة المنصات، ولقيت نقدًا شديدًا ⁦(11 من 100 في ميتاكريتك)⁩، وأُعلن جزء ثانٍ باسم «الركاز» سنة 2018."
  en: "An action-adventure game by the Saudi studio Semaphore, published by its parent Semanoor International, whose first episode came out on 29 May 2013 on PlayStation 3 and iOS and later on PC and Android, in which an Arab treasure hunter and his archaeologist sister follow the trail of the traveller Ibn Battuta; billed as Saudi Arabia's first multiplatform game, it was panned (11 out of 100 on Metacritic), and a sequel, Al Rekaz, was announced in 2018."
  ur: "سعودی اسٹوڈیو سیمافور کا مہم جوئی کا کھیل، ناشر اس کی مادر کمپنی سمانور انٹرنیشنل؛ پہلی قسط 29 مئی 2013 کو پلے اسٹیشن 3 اور iOS پر، پھر کمپیوٹر اور اینڈرائیڈ پر آئی؛ ایک عرب خزانہ جو اور اس کی ماہرِ آثار بہن سیاح ابن بطوطہ کے نقشِ قدم ڈھونڈتے ہیں؛ اسے سعودی عرب کا پہلا کثیر پلیٹ فارم کھیل کہا گیا، ناقدین نے سخت تنقید کی ⁦(میٹا کریٹک پر 100 میں 11)⁩، اور 2018 میں دوسرے حصے «الرکاز» کا اعلان ہوا۔"
