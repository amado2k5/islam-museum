summary:
  ar: بنك بنغلاديشي في دكا، سُجّل في 29 أغسطس 1999 وبدأ العمل في 25 أكتوبر 1999، ويقدّم الصيرفة المتوافقة مع الشريعة منذ 2009؛
    ترأّسه رئيس مجموعة إس عالم، وواجه أزمة سيولة سنة 2022.
  en: A Bangladeshi bank in Dhaka, incorporated on 29 August 1999 and operating from 25 October 1999, which has provided sharia-compliant
    banking since 2009; the chairman of S. Alam Group chaired it, and it faced a liquidity crisis in 2022.
  ur: ڈھاکہ کا بنگلہ دیشی بینک، جو 29 اگست 1999 کو رجسٹر ہوا اور 25 اکتوبر 1999 سے کام کر رہا ہے؛ 2009 سے شریعت کے مطابق بینکاری
    کرتا ہے؛ ایس عالم گروپ کے سربراہ اس کے چیئرمین رہے، اور 2022 میں اسے نقدی کے بحران کا سامنا ہوا۔
  es: "Un banco bangladesí con sede en Dhaka, constituido el 29 de agosto de 1999 y en funcionamiento desde el 25 de octubre de 1999, que ofrece servicios bancarios conformes a la sharia desde 2009; presidido por el presidente del Grupo S. Alam, se enfrentó a una crisis de liquidez en 2022."
  fr: "Une banque bangladaise à Dhaka, constituée le 29 août 1999 et en activité depuis le 25 octobre 1999, qui propose des services bancaires conformes à la charia depuis 2009; le président du groupe S. Alam la présidait, et elle a été confrontée à une crise de liquidités en 2022."
  tr: "Bangladeş'in Dakka şehrinde bulunan, 29 Ağustos 1999'da tescil edilen ve 25 Ekim 1999'da faaliyetlerine başlayan, 2009'dan beri Şeriat uyumlu bankacılık hizmeti sunan bir banka; S Alam Grubu'nun başkanı tarafından yönetiliyor ve 2022'de likidite kriziyle karşı karşıya kaldı."
  id: "Sebuah bank Bangladesh di Dhaka, terdaftar pada 29 Agustus 1999 dan mulai beroperasi pada 25 Oktober 1999, menawarkan layanan perbankan yang sesuai dengan syariah sejak tahun 2009; dipimpin oleh ketua S Alam Group, bank ini menghadapi krisis likuiditas pada tahun 2022."
