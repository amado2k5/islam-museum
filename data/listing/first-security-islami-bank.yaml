summary:
  ar: بنك بنغلاديشي في دكا، سُجّل في 29 أغسطس 1999 وبدأ العمل في 25 أكتوبر 1999، ويقدّم الصيرفة المتوافقة مع الشريعة منذ 2009؛
    ترأّسه رئيس مجموعة إس عالم، وواجه أزمة سيولة سنة 2022.
  en: A Bangladeshi bank in Dhaka, incorporated on 29 August 1999 and operating from 25 October 1999, which has provided sharia-compliant
    banking since 2009; the chairman of S. Alam Group chaired it, and it faced a liquidity crisis in 2022.
  ur: ڈھاکہ کا بنگلہ دیشی بینک، جو 29 اگست 1999 کو رجسٹر ہوا اور 25 اکتوبر 1999 سے کام کر رہا ہے؛ 2009 سے شریعت کے مطابق بینکاری
    کرتا ہے؛ ایس عالم گروپ کے سربراہ اس کے چیئرمین رہے، اور 2022 میں اسے نقدی کے بحران کا سامنا ہوا۔
