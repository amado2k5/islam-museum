  ar: بنك فيرست سكيوريتي الإسلامي
  en: First Security Islami Bank
  ur: فرسٹ سیکیورٹی اسلامی بینک
  es: "Banco Islámico de Primera Seguridad"
  fr: "Banque islamique de sécurité de première classe"
