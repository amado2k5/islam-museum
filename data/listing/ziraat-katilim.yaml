summary:
  ar: بنك مشاركة حكومي تركي أُسس في 12 مايو 2015 ويملكه صندوق الثروة السيادي التركي، وهو من مجموعة زراعت المالية، ويحمل تراخيص
    الصيرفة الإسلامية للمشاركة في الربح والخسارة وتمويل الأفراد وبطاقات الائتمان.
  en: A Turkish public participation bank founded on 12 May 2015 and owned by the Turkey Wealth Fund, part of the Ziraat Finance
    Group, holding Islamic banking licences for profit-and-loss sharing, consumer finance and credit cards.
  ur: ترکی کا سرکاری شراکتی بینک، جو 12 مئی 2015 کو قائم ہوا اور ترکی ویلتھ فنڈ اس کا مالک ہے؛ زراعت فنانس گروپ کا حصہ ہے
    اور منافع و نقصان میں شراکت، صارف مالیات اور کریڈٹ کارڈ کے اسلامی لائسنس رکھتا ہے۔
