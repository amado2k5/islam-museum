summary:
  ar: "مسجد قديم على القرن الذهبي أسسه آخي جلبي بن كمال طبيب مستشفى جامع الفاتح المتوفى 1523م؛ رممه سنان وهبوطه البحري جعل سون جماعت يري منخفضاً كهفياً فريداً."
  en: "An ancient Golden Horn mosque founded by Ahi Çelebi ibni Kemal, chief physician of the Fatih hospital, d. 1523; restored by Sinan, its seawater subsidence left a unique cave-low son cemaat yeri."
  fr: "Ancienne mosquée de la Corne d’Or fondée par Ahi Çelebi ibni Kemal, médecin-chef de l’hôpital de Fatih, mort en 1523 ; restaurée par Sinan, elle conserve un son cemaat yeri singulier, aussi bas qu’une grotte, à la suite des affaissements dus à l’eau de mer."
  es: "Una antigua mezquita del Cuerno de Oro fundada por Ahi Çelebi ibni Kemal, médico jefe del hospital Fatih, fallecido en 1523; restaurada por Sinan, su hundimiento del agua de mar dejó un nártex único a ras de suelo."
  ur: "ایک قدیم گولڈن ہارن مسجد جس کی بنیاد فاتح ہسپتال کے چیف فزیشن آہی سلبی ابنی کمال نے رکھی تھی۔ 1523; سینان کے ذریعے بحال کیا گیا، اس کے سمندری پانی کی کمی نے ایک منفرد غار سے کم نارتھیکس چھوڑا۔"
  tr: "Haliç'teki eski bir cami, 1523 yılında ölen Al-Fateh Camii Hastanesi'nin doktoru kardeşim Çalbi bin Kamal tarafından kuruldu; dişleri onarıldı ve deniz çökmesi Son Jamaat'ı eşsiz, mağarası bir çukur haline getirdi."
  id: "Sebuah masjid tua di Golden Horn didirikan oleh saudara saya Çalbi bin Kamal, dokter Rumah Sakit Masjid Al-Fateh, yang meninggal pada tahun 1523 M; giginya dipulihkan, dan penurunan lautnya membuat Son Jamaat menjadi cekungan gua yang unik."
