label: { ar: "الدير الأبيض", en: "the White Monastery (Dayr al-Abyad)" }
summary:
  ar: "دير جليل البناء أبيض كما سُمّي، بالحجر الأبيض غربي النيل في طرف الحاجر المطل على المزدرع فيما يقابل أخميم — وهو دير بو شنودة؛ وصفه ابن فضل الله العمري بعينه إذ مرّ به صحبة السلطان: يجري من النيل خليج طويل ينتهي إلى ملقة متسعة شرقي الدير، ويطل عليها رابية من فضلات الترع، ولا يُرى مثل نزاهته في الشتاء والربيع {cite:umari-masalik-1924 p. 374-375}."
  en: "The great white-built monastery west of the Nile opposite Akhmim — Shenoute's house — which al-Umari saw himself riding with the sultan: a long Nile canal ends at a broad pool east of it, a mound of canal-spoil overlooks the water, and in winter and spring its beauty, he says, has no peer {cite:umari-masalik-1924 p. 374-375}."
