label: { ar: "الدير الأبيض", en: "the White Monastery (Dayr al-Abyad)", fr: "Monastère blanc (Dayr al-Abyad)", es: "El Monasterio Blanco (Dayr al-Abyad)", ur: "سفید خانقاہ ⁦(دیر العبیاد)⁩" }
summary:
  ar: "دير جليل البناء أبيض كما سُمّي، بالحجر الأبيض غربي النيل في طرف الحاجر المطل على المزدرع فيما يقابل أخميم — وهو دير بو شنودة؛ وصفه ابن فضل الله العمري بعينه إذ مرّ به صحبة السلطان: يجري من النيل خليج طويل ينتهي إلى ملقة متسعة شرقي الدير، ويطل عليها رابية من فضلات الترع، ولا يُرى مثل نزاهته في الشتاء والربيع {cite:umari-masalik-1924 p. 374-375}."
  en: "The great white-built monastery west of the Nile opposite Akhmim — Shenoute's house — which al-Umari saw himself riding with the sultan: a long Nile canal ends at a broad pool east of it, a mound of canal-spoil overlooks the water, and in winter and spring its beauty, he says, has no peer {cite:umari-masalik-1924 p. 374-375}."
  fr: "Le grand monastère de pierre blanche à l’ouest du Nil face à Akhmim, maison de Shenoute, qu’al-Umari vit lui-même en chevauchant avec le sultan : un long canal du Nil aboutit à un vaste bassin à l’est, dominé par un amas de déblais des canaux ; sa beauté en hiver et au printemps, dit-il, est sans pareille {cite:umari-masalik-1924 p. 374-375}."
  es: "El gran monasterio de construcción blanca al oeste del Nilo, frente a Akhmim —la casa de Shenoute—, en el que al-Umari se vio a sí mismo cabalgando con el sultán: un largo canal del Nilo termina en una amplia poza al este del mismo, un montículo de escombros del canal domina el agua, y en invierno y primavera su belleza, dice, no tiene igual {cite:umari-masalik-1924 p. 374-375}."
  ur: "اکمیم کے سامنے دریائے نیل کے مغرب میں سفید بنی ہوئی عظیم خانقاہ - شیناؤت کا گھر - جس میں العماری نے خود کو سلطان کے ساتھ سوار ہوتے دیکھا: نیل کی ایک لمبی نہر اس کے مشرق میں ایک وسیع تالاب پر ختم ہوتی ہے، نہر کی خرابی کا ایک ٹیلا پانی کو دیکھتا ہے، اور موسم سرما اور بہار میں اس کی خوبصورتی نہیں ہوتی، وہ کہتا ہے: {101} ص 374-375}۔"
