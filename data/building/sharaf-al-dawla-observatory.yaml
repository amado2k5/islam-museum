label:
  ar: رصد شرف الدولة ببغداد
  en: Sharaf al-Dawla's observatory at Baghdad
  fr: "Observatoire de Sharaf al-Dawla, Bagdad"
  es: "Observatorio de Sharaf al-Dawla en Bagdad"
  ur: "بغداد میں شرف الدولہ کی رصد گاہ"
summary:
  ar: "الرصد الذي أقامه السلطان البويهي شرف الدولة ببغداد سنة ثمان وسبعين وثلثمائة؛ تقدّم برصد الكواكب السبعة في مسيرها وتنقلها في بروجها على مثل ما كان المأمون فعله في أيامه، فبُني بيت في دار الملكة في آخر البستان محكماً، ورُصد وكُتب به محضر أُخذ فيه بخطوط من يعرف الهندسة بحسن صناعة هذا الموضع لهذا البيت {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  en: "The observatory the Buyid sultan Sharaf al-Dawla commissioned at Baghdad in 378: he ordered the observation of the seven planets in their courses and zodiacal transits on the model of what al-Ma'mun had done, and a well-built observing house went up at the back of the garden in Dar al-Mamlaka, its sightings written into a register drawn up by those who knew geometry {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  fr: "Observatoire bouyide commandé en 378 : sept planètes et zodiaque suivis sur le modèle d’al-Ma’mun ; maison solide au fond du jardin de Dar al-Mamlaka, relevés au registre des connaisseurs de géométrie. {cite:muntazam-ibn-al-jawzi j.7 p.145}"
  es: "El observatorio que el sultán buyí Sharaf al-Dawla encargó en Bagdad en 378: ordenó la observación de los siete planetas en sus cursos y tránsitos zodiacales según el modelo de lo que había hecho al-Ma'mun, y se levantó una casa de observación bien construida en la parte trasera del jardín en Dar al-Mamlaka, y sus avistamientos se escribieron en un registro elaborado por aquellos que conocían la geometría {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  ur: "بعید سلطان شرف الدولہ نے 378 میں بغداد میں رصد گاہ قائم کی تھی: اس نے سات سیاروں کو ان کے نصاب اور رقم کی منتقلی میں المامون کے نمونے کے مطابق دیکھنے کا حکم دیا، اور دار المملکہ میں باغ کے عقب میں ایک اچھی طرح سے تعمیر شدہ مشاہداتی گھر بنایا گیا، جس نے اس کے لکھے ہوئے نقشوں کو دوبارہ ترتیب دیا تھا۔ جیومیٹری {حوالہ:منتظم ابن الجوزی ج7 ص145}۔"
