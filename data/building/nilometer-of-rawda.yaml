label: { ar: "مقياس النيل بجزيرة الروضة", en: "Nilometer of Rawda Island, Cairo", fr: "Nilomètre de l’île de Rawda, Le Caire", ur: "جزیرۂ روضہ کا مقیاسِ نیل", es: "Nilómetro de la isla de Rawda, El Cairo", tr: "Al-Rawda Adası'nda Nil ölçeği", id: "Lebar Nil di Pulau Al-Rawda" }
summary:
  ar: "بئر حجرية لقياس فيضان النيل في جزيرة الروضة بالقاهرة، أمر بها الخليفة العباسي المتوكل وبناها أحمد بن محمد الحاسب سنة 862م، ويعدّها يومانز أقدم أثر إسلامي باقٍ في مصر {cite:yeomans-islamic-cairo-2006 p.29}."
  en: "The stone-lined pit for gauging the Nile flood on Rawda Island, Cairo, commissioned by the Abbasid caliph al-Mutawakkil and built by Ahmad ibn Muhammad al-Hasib in 862; Yeomans calls it the earliest surviving Islamic monument in Egypt {cite:yeomans-islamic-cairo-2006 p.29}."
  fr: "Puits revêtu de pierre mesurant la crue du Nil à Rawda, commandé par al-Mutawakkil et bâti par Ahmad ibn Muhammad al-Hasib en 862 ; plus ancien monument islamique conservé d’Égypte selon Yeomans {cite:yeomans-islamic-cairo-2006 p.29}"
  es: "El foso revestido de piedra para medir la crecida del Nilo en la isla de Rawda, El Cairo, encargado por el califa abasí al-Mutawakkil y construido por Ahmad ibn Muhammad al-Hasib en 862; Yeomans lo llama el monumento islámico más antiguo que se conserva en Egipto {cite:yeomans-islamic-cairo-2006 p.29}."
  ur: "قاہرہ کے راودا جزیرہ پر نیل کے سیلاب کا اندازہ لگانے کے لیے پتھر سے جڑا گڑھا جو عباسی خلیفہ المتوکل نے بنایا تھا اور احمد بن محمد الحسیب نے 862 میں تعمیر کیا تھا۔ یومان اسے مصر میں قدیم ترین اسلامی یادگار کہتے ہیں {حوالہ: yeomans-islamic-cairo-2006 p.29}۔"
  tr: "Kahire'deki El-Rawda Adası'nda Nil'in taşkınını ölçmek için yapılmış taş bir kuyu, Abbasi Halifesi el-Mutavəkil tarafından yaptırılmış ve 862 yılında Ahmed ibn Muhammed el-Hasib tarafından inşa edilmiştir. Mısır'daki en eski hayatta kalan İslami anıt olarak kabul edilir {cite:yeomans-islamic-cairo-2006 s.29}."
  id: "Sumur batu untuk mengukur banjir Sungai Nil di Pulau Al-Rawda di Kairo, yang dipesan oleh Khalifah Abbasiyah al-Mutawakkil dan dibangun oleh Ahmad ibn Muhammad al-Hasib pada tahun 862 M. Sumur ini dianggap sebagai monumen Islam tertua yang masih ada di Mesir {cite:yeomans-islamic-cairo-2006 hlm.29}."
