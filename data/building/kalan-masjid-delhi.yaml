summary:
  ar: "جامع من طابقين على قاعدة عالية قرب بوابة تركمان في دلهي القديمة، بناه الوزير خان جهان جونان شاه وأتمه في 10 جمادى الآخرة 789هـ/1387 بحسب نقش بوابته الشرقية {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  en: "A congregational mosque raised on a high basement storey near Turkman Gate in Old Delhi, built by the vizier Khan-i Jahan Junan Shah and finished on 10 Jumada II 789/1387 according to the inscription on its east gate {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  ur: "پرانی دہلی میں ترکمان دروازے کے قریب اونچی تہ خانہ دار کرسی پر جامع مسجد، جو مشرقی دروازے کے کتبے کے مطابق وزیر خانِ جہاں جونان شاہ نے بنوائی اور 10 جمادی الآخر 789ھ/1387ء کو مکمل ہوئی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}۔"
