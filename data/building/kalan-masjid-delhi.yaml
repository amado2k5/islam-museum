label: { ar: "المسجد الكبير ⁦(كلان مسجد)⁩ عند بوابة تركمان، دلهي", en: "Kalan Masjid, Turkman Gate, Delhi", fr: "Kalan Masjid, Turkman Gate, Delhi", ur: "کلاں مسجد، ترکمان دروازہ، دہلی", es: "Kalan Masjid, Puerta Turca, Delhi", tr: "Delhi'deki Türkmen Kapısı'ndaki Büyük Camii (Kalan Camii)", id: "Masjid Agung (Masjid Kalan) di Gerbang Turkmen, Delhi" }
summary:
  ar: "جامع من طابقين على قاعدة عالية قرب بوابة تركمان في دلهي القديمة، بناه الوزير خان جهان جونان شاه وأتمه في 10 جمادى الآخرة 789هـ/1387 بحسب نقش بوابته الشرقية {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  en: "A congregational mosque raised on a high basement storey near Turkman Gate in Old Delhi, built by the vizier Khan-i Jahan Junan Shah and finished on 10 Jumada II 789/1387 according to the inscription on its east gate {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  fr: "Mosquée du vendredi sur un haut étage de soubassement près de Turkman Gate dans le Vieux Delhi, construite par le vizir Khan-i Jahan Junan Shah et achevée le 10 jumada II 789/1387 selon l’inscription de sa porte est {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  ur: "پرانی دہلی میں ترکمان دروازے کے قریب اونچی تہ خانہ دار کرسی پر جامع مسجد، جو مشرقی دروازے کے کتبے کے مطابق وزیر خانِ جہاں جونان شاہ نے بنوائی اور 10 جمادی الآخر 789ھ/1387ء کو مکمل ہوئی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}۔"
  es: "Una mezquita congregacional elevada sobre un alto sótano cerca de la Puerta Turkman en la Vieja Delhi, construida por el visir Khan-i Jahan Junan Shah y terminada el 10 de Jumada II de 789/1387 según la inscripción en su puerta este {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 82}."
  tr: "Eski Delhi'de Türkmen Kapısı yakınında yüksek bir kaidede bulunan iki katlı bir cami, bakan Khan Jahan Junan Shah tarafından inşa edilmiş ve doğu kapısındaki yazıta yer aldığı üzere 10 Jumada al-Akhirah 789 Hicri / 1387 H tarihinde tamamlanmıştır {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 82}."
  id: "Sebuah masjid dua lantai di atas dasar tinggi dekat Gerbang Turkmen di Delhi Lama, dibangun oleh menteri Khan Jahan Junan Shah dan selesai pada 10 Jumada al-Akhirah 789 AH / 1387 H menurut prasasti di gerbang timurnya {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 80} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 82}."
