label:
  ar: المسجد الأقصى
  en: Masjid Al-Aqsa
summary:
  ar: "المسجد الأقصى هو الجامع الكبير في الحرم القدسي. تذكر دائرة المعارف الإسلامية أن أول مسجد أقصى موثق بوضوح يعود إلى الوليد بن عبد الملك، وأنه وُضع على محور قبة الصخرة، وأن المنصور والمهدي أعادا بناءه إعادة كبيرة، وأن الفاطميين في عهد الظاهر أعادوا بناءه فصغر إلى أبعاده الحالية تقريباً وزُيّن بالفسيفساء، وأن صلاح الدين أقام فيه محراباً جديداً ونقل إليه منبر نور الدين الذي دُمّر سنة 1969. ووصف المقدسي المغطّى وأبوابه الستة والعشرين وصحنه وقبابه وصفاً مفصلاً {cite:ahsan-al-taqasim p. 143-144}."
  en: "The Aqsa mosque is the large congregational mosque of the Haram in Jerusalem. The Encyclopaedia of Islam says the first clearly documented Aqsa dates to al-Walid ibn Abd al-Malik and was set on the axis of the Dome of the Rock; al-Mansur and al-Mahdi rebuilt it extensively; under the Fatimid al-Zahir it was rebuilt, shrinking to roughly its present size and receiving mosaics; and Saladin built a new mihrab and brought Nur al-Din's minbar, destroyed in 1969. Al-Muqaddasi described the covered hall, its twenty-six doors, courtyard and domes in detail {cite:ahsan-al-taqasim p. 143-144}."
  ur: "مسجدِ اقصیٰ حرمِ قدسی کی بڑی جامع مسجد ہے۔ اسلامی انسائیکلوپیڈیا کے مطابق اقصیٰ کی پہلی واضح طور پر مستند عمارت الولید بن عبدالملک کی ہے اور اسے قبۃ الصخرہ کے محور پر رکھا گیا؛ المنصور اور المہدی نے اسے بڑے پیمانے پر دوبارہ بنایا؛ فاطمی الظاہر کے دور میں یہ دوبارہ بنی اور تقریباً موجودہ پیمائش تک سکڑ گئی اور موزیک سے سجی؛ اور صلاح الدین نے نیا محراب بنوایا اور نور الدین کا منبر وہاں منتقل کیا جو 1969ء میں تباہ ہوا۔ المقدسی نے ڈھکے ہوئے حصے، اس کے چھبیس دروازوں، صحن اور گنبدوں کو تفصیل سے بیان کیا ہے {cite:ahsan-al-taqasim p. 143-144}۔"
