label:
  ar: المسجد الأقصى
  en: Masjid Al-Aqsa
summary:
  ar: "المسجد الأقصى، المغطّى الواقع على قرنة القدس الشرقية نحو القبلة؛ أساسه من عمل داود بالحجارة الكبار المنقوشة، وبنى عليه عبد الملك بن مروان بحجارة صغار حسان شرّفوها فكان أحسن من جامع دمشق، حتى جاءت زلزلة في دولة بني العباس فطرحت المغطّى إلا ما حول المحراب، فلما قيل للخليفة إن بيت مال المسلمين لا يفي بردّه كتب إلى أمراء الأطراف أن يبني كل واحد رواقاً فبنوه أوثق وأغلظ صناعة مما كان وبقيت تلك القطعة شامة فيه إلى أعمدة الرخام، وأحدث عبد الله بن طاهر خمسة عشر رواقاً على أعمدة رخام؛ للمغطّى ستة وعشرون باباً أعظمها باب النحاس المصفّح بالصفر المذهب الذي لا يفتحه إلا شديد الباع، وفي صحنه ركّة تصعد إليها من الجوانب الأربع وعليها قباب السلسلة والمعراج والنبي، وطول المسجد ألف ذراع بذراع الملك وعرضه سبعمائة، ولا يتصل مغطّاه بالحائط الشرقي ولذلك قيل لا يتم فيه صف أبداً — وصف المقدسي لعين رأت {cite:ahsan-al-taqasim p. 143-144}."
  en: "The Aqsa mosque on Jerusalem's south-east corner as al-Muqaddasi saw it: Davidic foundations of ten-cubit carved blocks, Abd al-Malik's superstructure 'finer than the Damascus mosque' until an Abbasid-era earthquake felled the roofed part save the mihrab; too costly for the treasury, the caliph had each provincial amir rebuild one arcade — leaving a visible 'seam' — and Abdallah ibn Tahir added fifteen marble arcades; twenty-six doors, the greatest plated in gilded brass, the domes of the Chain, the Ascension and the Prophet on its platform {cite:ahsan-al-taqasim p. 143-144}."
