summary:
  ar: "المسجد الأقصى هو الجامع الكبير في الحرم القدسي. تذكر دائرة المعارف الإسلامية أن أول مسجد أقصى موثق بوضوح يعود إلى الوليد بن عبد الملك، وأنه وُضع على محور قبة الصخرة، وأن المنصور والمهدي أعادا بناءه إعادة كبيرة، وأن الفاطميين في عهد الظاهر أعادوا بناءه فصغر إلى أبعاده الحالية تقريباً وزُيّن بالفسيفساء، وأن صلاح الدين أقام فيه محراباً جديداً ونقل إليه منبر نور الدين الذي دُمّر سنة 1969. ووصف المقدسي المغطّى وأبوابه الستة والعشرين وصحنه وقبابه وصفاً مفصلاً {cite:ahsan-al-taqasim p. 143-144}."
  en: "The Aqsa mosque is the large congregational mosque of the Haram in Jerusalem. The Encyclopaedia of Islam says the first clearly documented Aqsa dates to al-Walid ibn Abd al-Malik and was set on the axis of the Dome of the Rock; al-Mansur and al-Mahdi rebuilt it extensively; under the Fatimid al-Zahir it was rebuilt, shrinking to roughly its present size and receiving mosaics; and Saladin built a new mihrab and brought Nur al-Din's minbar, destroyed in 1969. Al-Muqaddasi described the covered hall, its twenty-six doors, courtyard and domes in detail {cite:ahsan-al-taqasim p. 143-144}."
  fr: "La mosquée Aqsa est la grande mosquée du vendredi du Haram de Jérusalem. L’Encyclopédie de l’Islam dit que la première Aqsa clairement documentée remonte à al-Walid ibn Abd al-Malik et fut placée sur l’axe du Dôme du Rocher ; al-Mansur et al-Mahdi la reconstruisirent largement ; sous le Fatimide al-Zahir, elle fut reconstruite, réduite à peu près à sa taille actuelle et ornée de mosaïques ; Saladin y bâtit un nouveau mihrab et fit apporter le minbar de Nur al-Din, détruit en 1969. Al-Muqaddasi décrivit en détail la salle couverte, ses vingt-six portes, sa cour et ses coupoles {cite:ahsan-al-taqasim p. 143-144}."
  ur: "مسجدِ اقصیٰ حرمِ قدسی کی بڑی جامع مسجد ہے۔ اسلامی انسائیکلوپیڈیا کے مطابق اقصیٰ کی پہلی واضح طور پر مستند عمارت الولید بن عبدالملک کی ہے اور اسے قبۃ الصخرہ کے محور پر رکھا گیا؛ المنصور اور المہدی نے اسے بڑے پیمانے پر دوبارہ بنایا؛ فاطمی الظاہر کے دور میں یہ دوبارہ بنی اور تقریباً موجودہ پیمائش تک سکڑ گئی اور موزیک سے سجی؛ اور صلاح الدین نے نیا محراب بنوایا اور نور الدین کا منبر وہاں منتقل کیا جو 1969ء میں تباہ ہوا۔ المقدسی نے ڈھکے ہوئے حصے، اس کے چھبیس دروازوں، صحن اور گنبدوں کو تفصیل سے بیان کیا ہے {cite:ahsan-al-taqasim p. 143-144}۔"
  es: "La mezquita de Al-Aqsa es la gran mezquita congregacional del Haram en Jerusalén. La Enciclopedia del Islam afirma que la primera Al-Aqsa claramente documentada data de la época de al-Walid ibn Abd al-Malik y se ubicaba sobre el eje de la Cúpula de la Roca; al-Mansur y al-Mahdi la reconstruyeron extensamente; bajo el fatimí al-Zahir fue reconstruida, reduciéndose a su tamaño actual y recibiendo mosaicos; y Saladino construyó un nuevo mihrab y trajo el minbar de Nur al-Din, destruido en 1969. Al-Muqaddasi describió con detalle la sala cubierta, sus veintiséis puertas, el patio y las cúpulas {cite:ahsan-al-taqasim p. 143-144}."
  tr: "El-Aksa Camii, Yüce Türbesi'nin büyük camidir. İslami Ansiklopedi, ilk açıkça belgelenmiş Aksa Camii'nin El-Velid bin Abdülmelik'e tarihlendiğini, Kaya Kubbesi'nin eksenine yerleştirildiğini, El-Mensur ve el-Mehdi'nin onu kapsamlı şekilde yeniden inşa ettiğini, Fatımilerin el-Zahir döneminde onu yeniden inşa edip bugünkü boyutuna küçülttüğünü ve mozaiklerle süslediğini, Salah-al-Din'in orada yeni bir mihrap inşa ettiğini ve 1969'da yıkılan Nur al-Din minbarını buraya taşıdığını belirtir. Kapalı el-Makdisi'yi, yirmi altı kapısını, avlusunu ve kubbelerini ayrıntılı olarak tanımlamıştır {cite:ahsan-al-taqasim s. 143-144}."
  id: "Masjid Al-Aqsa adalah masjid besar di Tempat Suci Mulia. Ensiklopedia Islam menyebutkan bahwa masjid Al-Aqsa pertama yang terdokumentasi dengan jelas berasal dari Al-Walid ibn Abd al-Malik, bahwa masjid ini ditempatkan di sumbu Kubah Batu, bahwa Al-Mansur dan al-Mahdi membangunnya kembali secara besar-besaran, bahwa Fatimiyah pada masa pemerintahan al-Zahir membangunnya kembali dan mengecilnya menjadi ukuran saat ini serta menghiasnya dengan mozaik, dan bahwa Salah al-Din membangun mihrab baru di sana dan memindahkan minbar Nur al-Din ke sana, yang dihancurkan pada tahun 1969. Ia menggambarkan al-Maqdisi yang tertutup, dua puluh enam gerbangnya, halaman dan kubahnya secara rinci {cite:ahsan-al-taqasim hlm. 143-144}."
