education:
  did_you_know:
    ar: "المسجد الأقصى المغطّى على قرنة القدس الشرقية؛ أساسه من عمل داود بالحجارة الكبار المنقوشة، وبنى عليه عبد الملك بن مروان فكان عند الواصفين أحسن من جامع دمشق."
    en: "The roofed al-Aqsa on Jerusalem's eastern ridge: its foundation is ascribed to Dawud's huge carved stones, and Abd al-Malik ibn Marwan built upon it so finely that describers deemed it fairer than Damascus's mosque."
    ur: "مسجدِ اقصیٰ بیت المقدس کی مشرقی چوٹی پر؛ اس کی بنیاد داؤد کے کندہ بڑے پتھروں سے منسوب ہے اور عبدالملک بن مروان نے اس پر اتنی خوبصورت تعمیر کی کہ اسے دمشق کی جامع سے افضل کہا گیا۔"
