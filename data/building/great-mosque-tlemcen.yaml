summary:
  ar: "جامع تلمسان الكبير، يؤرخه نيوكومب بسنة 1136م، مئذنته الآجرية بارتفاع 112 قدماً مكسوة بفسيفساء الخزف، وفي صحنه فوّارة من المرمر الجزائري {cite:newcomb-decorative-tiles-north-africa-1929 p.27} {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  en: "The Great Mosque of Tlemcen, dated by Newcomb to 1136, whose 112-foot brick minaret is cased in faience mosaic and whose court holds an Algerian onyx fountain {cite:newcomb-decorative-tiles-north-africa-1929 p.27} {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  fr: "La Grande Mosquée de Tlemcen, datée de 1136 par Newcomb, dont le minaret de brique de 112 pieds est revêtu de mosaïque de faïence et dont la cour abrite une fontaine d’onyx d’Algérie {cite:newcomb-decorative-tiles-north-africa-1929 p.27} {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  es: "La Gran Mezquita de Tlemcen, datada por Newcomb en 1136, cuyo minarete de ladrillo de 112 pies está revestido de mosaico de loza y cuyo patio alberga una fuente de ónix argelino {cite:newcomb-decorative-tiles-north-africa-1929 p.27} {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  ur: "Tlemcen کی عظیم مسجد، جس کی تاریخ نیوکومب نے 1136 کو دی، جس کا 112 فٹ اینٹوں کا مینار فاینس موزیک میں ہے اور جس کی عدالت میں الجزائر کا سُلیمانی چشمہ ہے {حوالہ: نیوکومب-ڈیکوریٹو-ٹائلز-شمالی-افریقہ-1929 p.28}۔"
