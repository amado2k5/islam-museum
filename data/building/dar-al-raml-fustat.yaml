label:
  ar: دار الرمل بالفسطاط
  en: Dar al-Raml, al-Fustat
  fr: "Dar al-Raml, Fustat"
  ur: دار الرمل، فسطاط
  es: "Dar al-Raml, al-Fustat"
  tr: "Fustat'taki Dar Al-Raml"
  id: "Dar Al-Raml di Fustat"
summary:
  ar: دار بالفسطاط اختطها مسلمة بن مخلد ومعه أبو رافع وعقبة بن عامر، ثم صارت داراً للمسلمين ينزلها ولاتهم في عهد معاوية؛ وسُمّيت برملة ابنة معاوية، أو بالرمل الذي كان يُنقل إليها لدار الضرب {cite:futuh-misr-amir-1999 p. 143} {cite:futuh-misr-amir-1999 p. 144} {cite:futuh-misr-amir-1999 p. 145}.
  en: A house in al-Fustat laid out by Maslama ibn Mukhallad with Abu Rafi' and Uqba ibn Amir, which under Mu'awiya became a house for the Muslims where their governors lodged; named after Ramla daughter of Mu'awiya, or after the sand carried there for the mint {cite:futuh-misr-amir-1999 p. 143} {cite:futuh-misr-amir-1999 p. 144} {cite:futuh-misr-amir-1999 p. 145}.
  fr: "Maison de Fustat délimitée par Maslama ibn Mukhallad avec Abu Rafi’ et Uqba ibn Amir, devenue sous Mu’awiya une maison pour les musulmans où logeaient leurs gouverneurs ; nommée d’après Ramla, fille de Mu’awiya, ou le sable apporté pour l’atelier monétaire {cite:futuh-misr-amir-1999 p. 143} {cite:futuh-misr-amir-1999 p. 144} {cite:futuh-misr-amir-1999 p. 145}."
  ur: فسطاط میں ایک گھر جس کا خطہ مسلمہ بن مخلد نے ابو رافع اور عقبہ بن عامر کے ساتھ لیا؛ معاویہ کے دور میں یہ مسلمانوں کا گھر بنا جہاں ان کے والی اترتے تھے؛ اس کا نام معاویہ کی بیٹی رملہ کے نام پر، یا ٹکسال کے لیے لائی جانے والی ریت ⁦(رمل)⁩ کی وجہ سے پڑا {cite:futuh-misr-amir-1999 p. 143} {cite:futuh-misr-amir-1999 p. 144} {cite:futuh-misr-amir-1999 p. 145}۔
  es: "Una casa en al-Fustat diseñada por Maslama ibn Mukhallad con Abu Rafi' y Uqba ibn Amir, que bajo Mu'awiya se convirtió en una casa para los musulmanes donde se alojaban sus gobernadores; nombrada en honor a Ramla, hija de Mu'awiya, o en honor a la arena que se llevaba allí para la casa de la moneda {cite:futuh-misr-amir-1999 p. 143} {cite:futuh-misr-amir-1999 p. 144} {cite:futuh-misr-amir-1999 p. 145}."
  tr: "Fustat'ta bir ev, Maslama ibn Mukhlad tarafından Abu Rafi' ve Uqbah ibn Amir ile birlikte tasarlanmış, ardından Muaviye döneminde Müslümanlar ve valileri için bir konut olmuştur; Muawiyah'ın kızı Barmala olarak adlandırılmıştır; buraya madencilik evi için aktarılan kum Muawiyah'ın kızıdır. {cite:Futu-misr-amir-1999, s. 143} {cite:futuh-misr-amir-1999, s. 144} {cite:futuh-misr-amir-1999, s. 145}."
  id: "Sebuah rumah di Fustat dirancang oleh Maslama ibn Mukhlad bersama Abu Rafi' dan Uqbah ibn Amir, kemudian menjadi tempat tinggal bagi Muslim dan gubernur mereka selama masa pemerintahan Muawiya; rumah ini dinamai Barmala, putri Muawiyah, atau pasir yang dipindahkan ke sana untuk rumah pertambangan. {cite:futuh-misr-amir-1999, hlm. 143} {cite:futuh-misr-amir-1999, hlm. 144} {cite:futuh-misr-amir-1999, hlm. 145}."
