  es: "Ficha de proyecto para la Mezquita Atik Mustafa Pasha de Estambul, la iglesia bizantina convertida bajo Bayezid II; un edificio de la época de la conquista según el estudio citado, página aún no verificada."
  ur: "استنبول کی عتیق مصطفی پاشا مسجد کے لیے ڈرافٹ کارڈ، بازنطینی چرچ بایزید ثانی کے تحت تبدیل کیا گیا؛ حوالہ کردہ سروے کے مطابق فتح کے دور کی عمارت، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "İstanbul'daki Atiq Mustafa Paşa Camii için ön kart, Bayezid II döneminde camiye dönüştürülen Bizans kilisesi; fetih binalarından biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Atiq Mustafa Pasha di Istanbul, gereja Bizantium yang diubah menjadi masjid pada masa pemerintahan Bayezid II; salah satu bangunan penaklukan, dan halamannya belum ditinjau."
