  ar: "بطاقة أولية لجامع عتيق مصطفى باشا بإسطنبول، الكنيسة البيزنطية التي حوّلها إلى جامع في عهد بايزيد الثاني؛ من مباني الفتح ولم تُراجع الصفحة بعد."
  en: "Draft card for the Atik Mustafa Pasha Mosque of Istanbul, the Byzantine church converted under Bayezid II; a conquest-era building per the cited survey, the page not yet checked."
