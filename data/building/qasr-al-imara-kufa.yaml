label: { ar: "قصر الكوفة", en: "the palace of Kufa" }
summary:
  ar: "قصر الإمارة بالكوفة، وقد هُدم فلم تبق منه باقية؛ وله الحكاية المشهورة التي رواها عبد الملك بن عمير: كنت مع عبد الملك بن مروان بهذا القصر حين جيء برأس مصعب بن الزبير، فأخبرته أني كنت فيه مع عبيد الله بن زياد حين أُتي برأس الحسين، ثم مع المختار بن أبي عبيد ورأس ابن زياد بين يديه، ثم مع مصعب ورأس المختار بين يديه — فقام عبد الملك من مقامه وأمر بهدم ذلك الطاق {cite:umari-masalik-1924 p. 248-249}. وتذكر «موسوعة العتبات» أن سعد بن أبي وقاص أول من شرع في بنائه بمحاذاة الضلع الجنوبي لمسجد الكوفة، وأن التنقيبات الأثرية العراقية بيّنت اتصال المسجد به بباب في جداره الجنوبي، وقاست ضلع القصر نحو ١٧٧ م بمعدل سمك جدران ٣٫٦٠ م وقطر أبراج ٣٫٣٠ م {cite:musawat-atabat}."
  en: "Kufa's governor's palace, demolished without remains; famed for Abd al-Malik ibn Umayr's tale — in this very hall he had seen Husayn's head before Ibn Ziyad, Ibn Ziyad's before al-Mukhtar, al-Mukhtar's before Mus'ab, and now Mus'ab's before Abd al-Malik ibn Marwan, who rose and ordered that arch torn down {cite:umari-masalik-1924 p. 248-249}. The Mawsu'at al-Atabat records that Sa'd ibn Abi Waqqas first began it alongside the mosque's south side, and Iraqi excavations showed the mosque joined it through a door in the south wall — the palace side measuring some 177 m, walls averaging 3.60 m thick and towers 3.30 m in diameter {cite:musawat-atabat}."
