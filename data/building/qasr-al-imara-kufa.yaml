class: building
kind: palace
label: { ar: "قصر الكوفة", en: "the palace of Kufa", fr: "Palais de Kufa", es: "el palacio de Kufa", ur: "کوفہ کا محل" }
summary:
  ar: "قصر الإمارة بالكوفة، وقد هُدم فلم تبق منه باقية؛ وله الحكاية المشهورة التي رواها عبد الملك بن عمير: كنت مع عبد الملك بن مروان بهذا القصر حين جيء برأس مصعب بن الزبير، فأخبرته أني كنت فيه مع عبيد الله بن زياد حين أُتي برأس الحسين، ثم مع المختار بن أبي عبيد ورأس ابن زياد بين يديه، ثم مع مصعب ورأس المختار بين يديه — فقام عبد الملك من مقامه وأمر بهدم ذلك الطاق {cite:umari-masalik-1924 p. 248-249}. وتذكر «موسوعة العتبات» أن سعد بن أبي وقاص أول من شرع في بنائه بمحاذاة الضلع الجنوبي لمسجد الكوفة، وأن التنقيبات الأثرية العراقية بيّنت اتصال المسجد به بباب في جداره الجنوبي، وقاست ضلع القصر نحو ١٧٧ م بمعدل سمك جدران ٣٫٦٠ م وقطر أبراج ٣٫٣٠ م {cite:musawat-atabat}."
  en: "Kufa's governor's palace, demolished without remains; famed for Abd al-Malik ibn Umayr's tale — in this very hall he had seen Husayn's head before Ibn Ziyad, Ibn Ziyad's before al-Mukhtar, al-Mukhtar's before Mus'ab, and now Mus'ab's before Abd al-Malik ibn Marwan, who rose and ordered that arch torn down {cite:umari-masalik-1924 p. 248-249}. The Mawsu'at al-Atabat records that Sa'd ibn Abi Waqqas first began it alongside the mosque's south side, and Iraqi excavations showed the mosque joined it through a door in the south wall — the palace side measuring some 177 m, walls averaging 3.60 m thick and towers 3.30 m in diameter {cite:musawat-atabat}."
  fr: "Palais du gouverneur, démoli sans vestiges, célèbre pour le récit d’Abd al-Malik ibn Umayr : tête d’al-Husayn devant Ibn Ziyad, celle d’Ibn Ziyad devant al-Mukhtar, celle d’al-Mukhtar devant Mus’ab, enfin celle de Mus’ab devant Abd al-Malik ibn Marwan qui fit abattre l’arc. Selon la Mawsu’at al-Atabat, Sa’d ibn Abi Waqqas le commença au sud de la mosquée ; les fouilles montrèrent une porte commune au sud, côté du palais d’environ 177 m, murs de 3,60 m d’épaisseur moyenne et tours de 3,30 m de diamètre {cite:umari-masalik-1924 p. 248-249} {cite:musawat-atabat}"
  es: "El palacio del gobernador de Kufa, demolido sin dejar restos; famoso por el relato de Abd al-Malik ibn Umayr: en esta misma sala había visto la cabeza de Husayn ante Ibn Ziyad, la de Ibn Ziyad ante al-Mukhtar, la de al-Mukhtar ante Mus'ab, y ahora la de Mus'ab ante Abd al-Malik ibn Marwan, quien se levantó y ordenó derribar ese arco {cite:umari-masalik-1924 p. 248-249}. El Mawsu'at al-Atabat registra que Sa'd ibn Abi Waqqas comenzó su construcción junto al lado sur de la mezquita, y las excavaciones iraquíes mostraron que la mezquita se unía a ella a través de una puerta en el muro sur; el lado del palacio medía unos 177 m, con muros de un promedio de 3,60 m de espesor y torres de 3,30 m de diámetro {cite:musawat-atabat}."
  ur: "کوفہ کے گورنر کا محل، بغیر باقیات کے منہدم؛ عبد الملک ابن عمیر کی کہانی کے لئے مشہور تھا - اسی ہال میں اس نے حسین کا سر ابن زیاد سے پہلے، ابن زیاد کا المختار سے پہلے، المختار کا مصعب سے پہلے اور اب مصعب کا عبد الملک ابن مروان سے پہلے دیکھا تھا، جو نیچے اترا اور نیچے اترا۔ {حوالہ:عمری مسالک-1924 ص۔ 248-249}۔ موصوف الاطابات میں درج ہے کہ سعد ابن ابی وقاص نے سب سے پہلے اسے مسجد کے جنوبی حصے کے ساتھ شروع کیا تھا، اور عراقی کھدائیوں سے معلوم ہوا ہے کہ مسجد اس کے ساتھ جنوبی دیوار کے ایک دروازے سے ملتی ہے - محل کی طرف کی پیمائش تقریباً 177 میٹر، دیواروں کی اوسط موٹی 3.60 میٹر اور ٹاورز کا قطر 3.30 میٹر ہے۔"
