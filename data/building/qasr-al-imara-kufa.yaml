summary:
  ar: "قصر الإمارة بالكوفة، وقد هُدم فلم تبق منه باقية؛ وله الحكاية المشهورة التي رواها عبد الملك بن عمير: كنت مع عبد الملك بن مروان بهذا القصر حين جيء برأس مصعب بن الزبير، فأخبرته أني كنت فيه مع عبيد الله بن زياد حين أُتي برأس الحسين، ثم مع المختار بن أبي عبيد ورأس ابن زياد بين يديه، ثم مع مصعب ورأس المختار بين يديه — فقام عبد الملك من مقامه وأمر بهدم ذلك الطاق {cite:umari-masalik-1924 p. 248-249}."
  en: "Kufa's governor's palace, demolished without remains; famed for Abd al-Malik ibn Umayr's tale — in this very hall he had seen Husayn's head before Ibn Ziyad, Ibn Ziyad's before al-Mukhtar, al-Mukhtar's before Mus'ab, and now Mus'ab's before Abd al-Malik ibn Marwan, who rose and ordered that arch torn down {cite:umari-masalik-1924 p. 248-249}."
