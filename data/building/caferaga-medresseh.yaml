summary:
  ar: "مدرسة جعفر آغا قرب آيا صوفيا؛ بناها سنان لكبير الخصيان البيض جعفر آغا وأتمت سنة 967هـ/1559-1560م فوق بنيات تحتية مقببة {cite:freely-ottoman-architecture-2011 p.299}."
  en: "Cafer Ağa Medresesi near Haghia Sophia; built by Sinan for the chief white eunuch Cafer Ağa and completed in AH 967 (1559-60) over vaulted shop substructures {cite:freely-ottoman-architecture-2011 p.299}."
  fr: "Cafer Ağa Medresesi près de Sainte-Sophie ; construite par Sinan pour le chef des eunuques blancs Cafer Ağa et achevée en 967 H (1559-1560) au-dessus de soubassements voûtés abritant des boutiques {cite:freely-ottoman-architecture-2011 p.299}."
  es: "La madraza Cafer Ağa, cerca de Santa Sofía, fue construida por Sinan para el eunuco blanco principal Cafer Ağa y se completó en el año 967 de la Hégira (1559-60) sobre subestructuras de tiendas abovedadas {cite:freely-ottoman-architecture-2011 p.299}."
  ur: "Haghia صوفیہ کے قریب کیفر Ağa Medresesi؛ سینان کی طرف سے چیف سفید فام خواجہ سرا کیفر آغا کے لیے بنایا گیا تھا اور 967 (1559-60) میں مکمل کیا گیا تھا۔"
  tr: "Ayasofya yakınlarındaki Jaafar Ağa Okulu; Sinan tarafından baş beyaz hadım Ca'far Ağa için inşa edilmiş ve 967 Hicri / 1559-1560 yıllarında kubbeli altyapı üzerine tamamlanmıştır {atıf:freely-osmanlı-mimari-2011 s.299}."
  id: "Sekolah Jaafar Agha dekat Hagia Sophia; dibangun oleh Sinan untuk kepala kasim kulit putih Ja'far Agha dan selesai dibangun pada tahun 967 H / 1559-1560 M di atas infrastruktur berkubah {cite: freely-ottoman-architecture-2011 hlm.299}."
