label: { ar: "مشهد خالد خارج حمص", en: "the Khalid shrine outside Homs", fr: "Sanctuaire de Khalid près de Homs", es: "El santuario de Khalid en las afueras de Homs", ur: "حمص کے باہر خالد کا مزار", tr: "Khalid'in Homs dışındaki sahnesi", id: "Adegan Khalid di luar Homs" }
summary:
  ar: "مشهد خارج حمص يُنسب في العامة إلى خالد بن الوليد؛ ويُبطل ابن فضل الله العمري ذلك جزماً، فخالد عزله عمر بن الخطاب عن حمص وأشخصه إلى المدينة فمات بها ووجد عليه عمر بعد موته، والقبر لخالد بن يزيد بن معاوية {cite:umari-masalik-1924 p. 219}."
  en: "The shrine outside Homs popularly ascribed to Khalid ibn al-Walid; al-Umari rejects the ascription decisively — Khalid was dismissed by Umar, taken to Medina and died there — and assigns the tomb to Khalid ibn Yazid ibn Mu'awiya {cite:umari-masalik-1924 p. 219}."
  fr: "Sanctuaire hors de Homs populairement attribué à Khalid ibn al-Walid ; al-Umari rejette nettement cette attribution — Khalid fut destitué par Umar, emmené à Médine et y mourut — et l’assigne à Khalid ibn Yazid ibn Mu’awiya {cite:umari-masalik-1924 p. 219}"
  es: "El santuario a las afueras de Homs se atribuye popularmente a Khalid ibn al-Walid; al-Umari rechaza categóricamente esta atribución —Khalid fue despedido por Umar, llevado a Medina y murió allí— y asigna la tumba a Khalid ibn Yazid ibn Mu'awiya {cite:umari-masalik-1924 p. 219}."
  ur: "حمص کے باہر مزار خالد بن الولید سے منسوب ہے۔ العمری نے اس تحریر کو فیصلہ کن طور پر مسترد کر دیا — خالد کو عمر نے برطرف کر دیا، مدینہ لے گئے اور وہیں انتقال کر گئے — اور قبر خالد بن یزید بن معاویہ کو سونپ دی۔ 219}۔"
  tr: "Hums dışındaki bir sahne genellikle Halid bin el-Velid'e atfedilir; İbn Fadlallah el-Umari bunu kesin olarak çürütmektedir; çünkü Halid, Ömer bin el-Hattab tarafından Hums'tan görevden alınmış, Medine'ye atanmış ve orada ölmüş, Ömer ise ölümünden sonra üzerinde bulunmuştur. Mezar, Halid bin Yezid ibn Muaviye'ye aittir {cite:umari-masalik-1924, s. 219}."
  id: "Sebuah adegan di luar Homs umumnya dikaitkan dengan Khalid ibn al-Walid; Ibn Fadlallah al-Umari membantah hal ini dengan pasti, karena Khalid dipecat oleh Umar ibn al-Khattab dari Homs, yang ditugaskan ke Madinah, di mana ia meninggal, dan Umar ditemukan di atasnya setelah kematiannya. Makam itu milik Khalid ibn Yazid ibn Muawiyah {cite:umari-masalik-1924, hlm. 219}."
