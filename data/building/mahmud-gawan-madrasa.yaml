summary:
  ar: "بطاقة أولية لمدرسة محمود گاوان في بيدار كارناتاكا — المدرسة البهمنية الشهيرة التي بناها الوزير محمود گاوان سنة ٨٧٧هـ/1472؛ ثلاثة نقوش قرآنية ونص بناء مسجلة في قاموس النقوش الإسلامية بنفس التاريخ."
  en: "Draft card for the Mahmud Gawan Madrasa of Bidar, Karnataka — the celebrated Bahmani foundation built by the minister Mahmud Gawan in 877 AH / 1472 CE; three Qur'anic-inscription records and a construction text in the Islamic Epigraphy Thesaurus share that date."
  fr: "Notice provisoire : madrasa Mahmud Gawan de Bidar, Karnataka, célèbre fondation bahmanide bâtie par le ministre Mahmud Gawan en 877 H / 1472 ap. J.-C. ; trois notices d’inscriptions coraniques et un texte de construction de l’Islamic Epigraphy Thesaurus portent cette date."
  es: "Ficha de borrador para la madrasa Mahmud Gawan de Bidar, Karnataka, la célebre fundación Bahmani construida por el ministro Mahmud Gawan en 877 AH / 1472 CE; tres registros de inscripciones coránicas y un texto constructivo en el Tesauro de Epigrafía Islámica comparten esa fecha."
  ur: "بیدر، کرناٹک کے محمود گاون مدرسہ کے لیے ڈرافٹ کارڈ - مشہور بہمنی فاؤنڈیشن جسے وزیر محمود گاوان نے 877ھ / 1472 عیسوی میں تعمیر کیا تھا۔ تین قرآنی نوشتہ جات کے ریکارڈ اور اسلامی ایپی گرافی تھیسورس میں ایک تعمیراتی متن اس تاریخ میں شریک ہے۔"
