summary:
  ar: "المدرسة السعدية بنيسابور، بناها الأمير نصر بن سُبُكْتَكين أخو السلطان محمود الغزنوي، واستشهد بها السبكي والسيوطي مع البيهقية على أن المدارس كانت قبل نظام الملك."
  en: "The Sa'diyya of Nishapur, built by the amir Nasr ibn Sabuktegin, brother of Sultan Mahmud of Ghazna — cited with the Bayhaqiyya by al-Subki and al-Suyuti as proof that madrasas stood before Nizam al-Mulk."
  fr: "La Sadiyya de Nishapur, construite par l’émir Nasr ibn Sabuktegin, frère du sultan Mahmud de Ghazna — citée avec la Bayhaqiyya par al-Subki et al-Suyuti comme preuve de l’existence de madrasas avant Nizam al-Mulk."
  es: "La Sa'diyya de Nishapur, construida por el emir Nasr ibn Sabuktegin, hermano del sultán Mahmud de Ghazna, citada con la Bayhaqiyya por al-Subki y al-Suyuti como prueba de que antes de Nizam al-Mulk había madrasas."
