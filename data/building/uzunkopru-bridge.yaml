summary:
  ar: "«الجسر الطويل» الذي سُميت المدينة باسمه، بناه حاجي عوض باشا لمراد الثاني سنة 1444م على نهر أرغنة؛ طوله 1392 متراً على 173 قوساً."
  en: "The 'Long Bridge' that names the town, built for Murat II in 1444 by Hacı Ivaz Pasha across the Ergene: 1,392 metres carried on 173 arches."
  fr: "Long pont donnant nom à la ville, Hacı Ivaz Pacha pour Murat II en 1444, Ergene, 1 392 m sur 173 arches."
  es: "El \"Puente Largo\", que da nombre a la ciudad, fue construido para Murad II en 1444 por Hacı Ivaz Pasha sobre el río Ergene: 1.392 metros de longitud sostenidos por 173 arcos."
  ur: "'لانگ برج' جو اس قصبے کا نام رکھتا ہے، جسے 1444 میں ہکی ایواز پاشا نے ارجین کے پار مرات II کے لیے بنایا تھا: 1,392 میٹر 173 محرابوں پر چلائے گئے تھے۔"
  tr: "Şehrin adını aldığı 'Uzun Köprü', 1444 yılında Hacı Awad Paşa tarafından II. Murad için Argana Nehri üzerinde inşa edilmiştir; uzunluğu 1.392 metredir ve 173 kemerlidir."
  id: "'Jembatan Panjang,' yang menjadi asal nama kota ini, dibangun oleh Haji Awad Pasha untuk Murad II pada tahun 1444 M di atas Sungai Argan; panjangnya 1.392 meter dengan 173 lengkungan."
