  en: "Draft card for the Şehzade Mahmud Türbesi in Bursa's Muradiye complex — an Ottoman prince's mausoleum whose dated inscriptions of 912-913 AH / 1506-08 CE appear in the Islamic Epigraphy Thesaurus."
