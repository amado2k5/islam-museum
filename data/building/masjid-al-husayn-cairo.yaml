label:
  ar: "مسجد الإمام الحسين بالقاهرة"
  en: "Al-Hussein Mosque, Cairo"
  fr: "Mosquée al-Husayn, Le Caire"
  es: "Mezquita Al-Hussein, El Cairo"
  ur: "الحسین مسجد، قاہرہ"
summary:
  ar: "مشهد الإمام الحسين بالقاهرة؛ قابله دار الفطرة، وجعل فيه السلطان الناصر حلقة تدريس، ثم بنى الوزير معين الدين ايوان التدريس من أوقافه، واحترق المشهد في الأيام الصالحية ⁦(المقريزي، ص 1178، 1181)⁩."
  en: "The shrine of al-Husayn in Cairo, opposite Dar al-Fitra; al-Nasir set up a teaching circle in it, and the vizier Mu'in al-Din later built its teaching iwan from its endowments; it burned in the Salihi years (al-Maqrizi, pp. 1178, 1181)."
  fr: "Sanctuaire d’al-Husayn au Caire, face à Dar al-Fitra ; al-Nasir y établit un cercle d’enseignement et le vizir Mu’in al-Din fit ensuite bâtir son iwan d’enseignement sur ses revenus de fondation ; il brûla dans les années salihies (al-Maqrizi, pp. 1178, 1181)."
  es: "El santuario de al-Husayn en El Cairo, frente a Dar al-Fitra; al-Nasir estableció un círculo de enseñanza en él, y el visir Mu'in al-Din construyó más tarde su iwan de enseñanza con sus donaciones; se incendió en los años de Salihi (al-Maqrizi, págs. 1178, 1181)."
  ur: "قاہرہ میں حسین کا مزار، دار الفطرہ کے سامنے؛ الناصر نے اس میں ایک تدریسی حلقہ قائم کیا، اور وزیر معین الدین نے بعد میں اپنے اوقاف سے اس کا تدریسی ایوان بنایا۔ یہ صالحی سالوں میں جل گیا ⁦(المقرزی، صفحہ 1178، 1181)⁩۔"
