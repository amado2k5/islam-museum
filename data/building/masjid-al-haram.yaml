summary:
  ar: "مسجد في مكة المكرمة. ووصفه المقدسي نحو 375هـ بأنه من بناء المهدي، حُملت أعمدته الرخام من الإسكندرية في البحر إلى جدة، وأُلبست حيطان أروقته الثلاثة بالفسيفساء التي صنعها صنّاع الشام ومصر وأسماؤهم عليها، وله تسعة عشر باباً منها باب بني شيبة وباب الصفا وباب الندوة، وبالطواف أميال من الصفر فيها قناديل معلقة يوقَّد فوقها الشمع لملوك مصر واليمن والشار صاحب غرجستان، وبمكة ثلاث برك تملأ قناة شفَّتها زبيدة من بستان بني عامر {cite:ahsan-al-taqasim pp. 81-82}. وبعد أربعة قرون سجّل ابن فضل الله العمري مقاسم الكعبة ذرعاً: ما بين الباب والحجر الأسود أربعة أذرع وهو المُلتزم، وفي ظهرها باب مسدود يسمى المستجار من الذنوب، وجدد بابها المذهب في الأيام الناصرية بعد أن قُلعت صفائحه وقُدّرت بثمانية عشر ألف دينار {cite:umari-masalik-1924 pp. 137, 141-142}."
  en: "The mosque in Mecca. Al-Muqaddasi's eyewitness portrait c. 375 AH — marble columns carried by the Mahdi's order from Alexandria to Jeddah by sea, three marble-pillared arcades clad in mosaics made by Syrian and Egyptian craftsmen whose names he could still read, nineteen gates including Bab Bani Shayba and Bab al-Nadwa, brass lamp-rings around the tawaf fed with candles by the kings of Egypt and Yemen, and three basins filled by Zubayda's channel {cite:ahsan-al-taqasim pp. 81-82}. Four centuries on, Ibn Fadl Allah al-Umari measures the Kaaba cubit by cubit — four cubits from door to Black Stone, the Multazam; the sealed door in its back called 'the refuge from sins'; its gilded door renewed under the Nasiri sultans after the old plates were valued at eighteen thousand dinars {cite:umari-masalik-1924 pp. 137, 141-142}."
