education:
  did_you_know:
    ar: "وصف المقدسي المسجد الحرام نحو سنة ٣٧٥هـ: أعمدته الرخام حُملت من الإسكندرية في البحر إلى جدة، وحيطان أروقته لُبّست بالفسيفساء، وله تسعة عشر باباً."
    en: "Al-Muqaddasi described the Sacred Mosque around 375 AH: its marble columns shipped from Alexandria by sea to Jeddah, its arcades' walls faced with mosaic made by Syrian and Egyptian craftsmen, and nineteen gates."
    ur: "مقدسی نے تقریباً 375ھ میں مسجدِ حرام بیان کیا: اس کے سنگِ مرمر کے ستون اسکندریہ سے سمندری راہ جدہ پہنچے، راہداریوں کی دیواریں موزائیک سے مزین، اور انیس دروازے۔"
