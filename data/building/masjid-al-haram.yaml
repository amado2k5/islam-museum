summary:
  ar: "مسجد في مكة المكرمة. ووصفه المقدسي نحو 375هـ بأنه من بناء المهدي، حُملت أعمدته الرخام من الإسكندرية في البحر إلى جدة، وأُلبست حيطان أروقته الثلاثة بالفسيفساء التي صنعها صنّاع الشام ومصر وأسماؤهم عليها، وله تسعة عشر باباً منها باب بني شيبة وباب الصفا وباب الندوة، وبالطواف أميال من الصفر فيها قناديل معلقة يوقَّد فوقها الشمع لملوك مصر واليمن والشار صاحب غرجستان، وبمكة ثلاث برك تملأ قناة شفَّتها زبيدة من بستان بني عامر {cite:ahsan-al-taqasim pp. 81-82}. وبعد أربعة قرون سجّل ابن فضل الله العمري مقاسم الكعبة ذرعاً: ما بين الباب والحجر الأسود أربعة أذرع وهو المُلتزم، وفي ظهرها باب مسدود يسمى المستجار من الذنوب، وجدد بابها المذهب في الأيام الناصرية بعد أن قُلعت صفائحه وقُدّرت بثمانية عشر ألف دينار {cite:umari-masalik-1924 pp. 137, 141-142}. وتروي دائرة المعارف الإسلامية أن الفضاء حول الكعبة اتسع على مر القرون حتى صار المسجد، وتنسب إلى الوليد الأول الأروقة المحيطة بالصحن، وتصف التوسعة السعودية الكبرى التي بدأت سنة 1375هـ/1955م وانتهت سنة 1398هـ/1978م، وأبقت المسجد القديم وأدخلت المسعى فيه، وقُدرت سعتها بنحو 300 ألف مصلٍّ."
  en: "The mosque in Mecca. Al-Muqaddasi's eyewitness portrait c. 375 AH — marble columns carried by the Mahdi's order from Alexandria to Jeddah by sea, three marble-pillared arcades clad in mosaics made by Syrian and Egyptian craftsmen whose names he could still read, nineteen gates including Bab Bani Shayba and Bab al-Nadwa, brass lamp-rings around the tawaf fed with candles by the kings of Egypt and Yemen, and three basins filled by Zubayda's channel {cite:ahsan-al-taqasim pp. 81-82}. Four centuries on, Ibn Fadl Allah al-Umari measures the Kaaba cubit by cubit — four cubits from door to Black Stone, the Multazam; the sealed door in its back called 'the refuge from sins'; its gilded door renewed under the Nasiri sultans after the old plates were valued at eighteen thousand dinars {cite:umari-masalik-1924 pp. 137, 141-142}. The Encyclopaedia of Islam says the open space round the Kaaba was enlarged over the centuries into the mosque, credits al-Walid I with the galleries round the courtyard, and describes the great Saudi enlargement begun in 1375/1955 and completed in 1398/1978, which kept the old mosque and brought al-Mas'a inside, with an estimated capacity of about 300,000 worshippers."
  fr: "Mosquée de La Mecque. Vers 375 H, al-Muqaddasi décrit les colonnes de marbre transportées d’Alexandrie à Djeddah par mer sur ordre d’al-Mahdi, trois portiques à mosaïques d’artisans syriens et égyptiens dont il lisait les noms, dix-neuf portes dont Banu Shayba et Nadwa, des supports de laiton à bougies offertes par les rois d’Égypte et du Yémen autour du tawaf et trois bassins alimentés par le canal de Zubayda. Quatre siècles après, Ibn Fadl Allah al-Umari mesure la Kaaba : quatre coudées de la porte à la Pierre noire, le Multazam ; porte arrière scellée dite refuge contre les péchés ; porte dorée renouvelée sous les sultans nasirides après estimation des anciennes plaques à dix-huit mille dinars. Selon l’Encyclopédie de l’Islam, l’espace libre autour de la Kaaba fut agrandi au fil des siècles ; al-Walid Ier ajouta les galeries de cour. Le grand agrandissement saoudien de 1375/1955–1398/1978 conserva l’ancienne mosquée, engloba al-Mas’a et porta la capacité estimée à environ 300 000 fidèles. {cite:ahsan-al-taqasim pp. 81-82} {cite:umari-masalik-1924 pp. 137, 141-142}"
  ur: "مسجد حرام مکہ مکرمہ کی مسجد ہے۔ انسائیکلو پیڈیا آف اسلام کے مطابق کعبہ کے گرد کی کھلی جگہ صدیوں میں پھیل کر مسجد بنی، ولید اول کی طرف صحن کے گرد رواقوں کی تعمیر منسوب ہے، اور سنہ 1375ھ/1955ء میں شروع ہو کر 1398ھ/1978ء میں مکمل ہونے والی بڑی سعودی توسیع نے پرانی مسجد کو برقرار رکھا اور مسعیٰ کو اندر لے لیا، جس کی گنجائش کا اندازہ تقریباً تین لاکھ نمازی ہے۔"
  es: "La mezquita en La Meca. Retrato de Al-Muqaddasi, testigo ocular, c. 375 AH: columnas de mármol llevadas por orden del Mahdi desde Alejandría a Yeda por mar, tres arcadas con pilares de mármol revestidas de mosaicos hechos por artesanos sirios y egipcios cuyos nombres aún podía leer, diecinueve puertas, incluidas Bab Bani Shayba y Bab al-Nadwa, anillos de lámparas de latón alrededor del tawaf alimentados con velas por los reyes de Egipto y Yemen, y tres pilas llenas por el canal de Zubayda {cite:ahsan-al-taqasim pp. 81-82}. Cuatro siglos después, Ibn Fadl Allah al-Umari mide la Kaaba codo por codo: cuatro codos desde la puerta hasta la Piedra Negra, el Multazam; la puerta sellada en su parte posterior llamada 'el refugio de los pecados'; Su puerta dorada fue renovada bajo los sultanes Nasiri después de que los antiguos platos fueran valorados en dieciocho mil dinares {cite:umari-masalik-1924 pp. 137, 141-142}. La Enciclopedia del Islam dice que el espacio abierto alrededor de la Kaaba se amplió a lo largo de los siglos hasta convertirse en la mezquita, atribuye a al-Walid I las galerías alrededor del patio y describe la gran ampliación saudí iniciada en 1375/1955 y completada en 1398/1978, que conservó la antigua mezquita y trajo al-Mas'a en su interior, con una capacidad estimada de unos 300.000 fieles."
