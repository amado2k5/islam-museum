summary:
  ar: "بطاقة أولية لجامع العرب بإسطنبول بمحلة غلطة، الكنيسة اللاتينية القديمة التي حُوّلت إلى مسجد واشتهرت بالمئذنة المعلّقة على دعائم؛ تذكره مصادر تاريخ العمارة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for Arap Camii (the Arab Mosque) in Galata, Istanbul, the former Latin church converted to a mosque and known for its pier-supported minaret; per the cited architecture survey, the page not yet checked."
  fr: "Notice provisoire : Arap Camii (mosquée des Arabes) à Galata, Istanbul, ancienne église latine convertie en mosquée, connue pour son minaret porté par des piliers selon l’étude architecturale citée. La page n’est pas encore vérifiée."
  es: "Ficha preliminar de la Mezquita Árabe (Arap Camii) en Galata, Estambul, la antigua iglesia latina convertida en mezquita y conocida por su minarete sostenido por pilares; según el estudio arquitectónico citado, la página aún no ha sido revisada."
  ur: "گالاٹا، استنبول میں ارپ کامی ⁦(عرب مسجد)⁩ کے لیے ڈرافٹ کارڈ، سابق لاطینی چرچ کو مسجد میں تبدیل کر دیا گیا اور اس کے گھاٹ سے چلنے والے مینار کے لیے جانا جاتا ہے۔ حوالہ کردہ آرکیٹیکچر سروے کے مطابق، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'daki Galata semtindeki Arap Camii için ön kart, eski Latin kilisesi camiye dönüştürülmüş ve sütunlara asılı minaresiyle ünlüdür; Osmanlı mimarisi tarihindeki kaynaklarda bahsedilmekte ve henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Masjid Arab di Istanbul di distrik Galata, gereja Latin tua yang diubah menjadi masjid dan terkenal dengan menara yang digantung di pilar; gereja ini disebutkan oleh sumber dalam sejarah arsitektur Ottoman dan belum pernah ditinjau."
