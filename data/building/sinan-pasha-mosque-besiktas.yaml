summary:
  ar: "بطاقة أولية لجامع سنان باشا ببشكتاش إسطنبول، الجامع الذي صممه المعمار سنان لأميرالأسطول سنان باشا في منتصف القرن السادس عشر؛ تذكره مصادر تاريخ العمارة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Sinan Pasha Mosque of Besiktas, Istanbul, designed by the architect Sinan for the kapudan Sinan Pasha in the mid-sixteenth century; per the cited architecture survey, the page not yet checked."
  fr: "Notice provisoire de la mosquée de Beşiktaş, conçue par Sinan pour le kapudan Sinan Pacha au milieu du XVIe siècle selon l’étude citée ; page non encore vérifiée."
  es: "Boceto de la Mezquita Sinan Pasha de Besiktas, Estambul, diseñada por el arquitecto Sinan para el cacique Sinan Pasha a mediados del siglo XVI; según el estudio arquitectónico citado, la página aún no ha sido revisada."
  ur: "بیسکٹاس، استنبول کی سنان پاشا مسجد کے لیے ڈرافٹ کارڈ، جو معمار سینان نے سولہویں صدی کے وسط میں کپوڈن سنان پاشا کے لیے ڈیزائن کیا تھا۔ حوالہ کردہ آرکیٹیکچر سروے کے مطابق، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'un Beşiktaş kentindeki Sinan Paşa Camii'nin ön kartı; 16. yüzyıl ortalarında mimar Sinan tarafından Amiral Sinan Paşa için tasarlanmıştı; Osmanlı mimari tarihi kaynaklarında bahsedilmekte ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan Masjid Sinan Pasha di Beşiktaş, Istanbul, masjid yang dirancang oleh arsitek Sinan untuk Laksamana Sinan Pasha pada pertengahan abad ke-16; ini disebutkan dalam sumber sejarah arsitektur Ottoman dan halamannya belum pernah ditinjau."
