summary:
  ar: "المسجد العتيق ⁦(جامع حمزة بك)⁩ بستارا زاغورا؛ بُني سنة 811هـ/1408-09م بقبة 17.50م، وهو آخر مسجد باقٍ من سبعة عشر وصفها أوليا جلبي سنة 1652م {cite:yilmaz-turkish-monuments-churches-2023 pp.79-80}."
  en: "The Old Mosque (Hamza Bey) of Stara Zagora, built AH 811/1408-09 under a 17.50 m dome; the last survivor of the seventeen mosques Evliya Çelebi saw in 1652 {cite:yilmaz-turkish-monuments-churches-2023 pp.79-80}."
  fr: "Vieille Mosquée Hamza Bey de Stara Zagora, bâtie en 811 H/1408–1409 sous coupole de 17,50 m ; seule conservée des dix-sept mosquées vues par Evliya Çelebi en 1652 {cite:yilmaz-turkish-monuments-churches-2023 pp.79-80}"
  es: "La Mezquita Vieja (Hamza Bey) de Stara Zagora, construida en el año 811 de la Hégira (1408-09) bajo una cúpula de 17,50 m; la última superviviente de las diecisiete mezquitas que Evliya Çelebi vio en 1652 {cite:yilmaz-turkish-monuments-churches-2023 pp.79-80}."
  ur: "ستارہ زگورہ کی پرانی مسجد ⁦(حمزہ بے)⁩، 17.50 میٹر کے گنبد کے نیچے 811/1408-09 AH میں تعمیر کی گئی۔ آخری زندہ بچ جانے والی سترہ مساجد ایولیا سلبی نے 1652 میں دیکھی تھیں۔"
