summary:
  ar: "المسجد الجامع الكبير في شاه جهان آباد (دلهي القديمة)، بناه الإمبراطور المغولي شاه جهان بين 1644 و1656 وافتتحه إمامه الأول سيد عبد الغفور شاه البخاري؛ ظل المسجد الإمبراطوري للمغول حتى سقوط الدولة سنة 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
  en: "The great congregational mosque of Shahjahanabad (Old Delhi), built by the Mughal emperor Shah Jahan between 1644 and 1656 and inaugurated by its first imam Syed Abdul Ghafoor Shah Bukhari; it served as the Mughal imperial mosque until 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
