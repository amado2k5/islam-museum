summary:
  ar: "المسجد الجامع الكبير في شاه جهان آباد ⁦(دلهي القديمة)⁩، بناه الإمبراطور المغولي شاه جهان بين 1644 و1656 وافتتحه إمامه الأول سيد عبد الغفور شاه البخاري؛ ظل المسجد الإمبراطوري للمغول حتى سقوط الدولة سنة 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
  en: "The great congregational mosque of Shahjahanabad (Old Delhi), built by the Mughal emperor Shah Jahan between 1644 and 1656 and inaugurated by its first imam Syed Abdul Ghafoor Shah Bukhari; it served as the Mughal imperial mosque until 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
  fr: "Grande mosquée du vendredi de Shahjahanabad (Vieux Delhi), construite par l’empereur moghol Shah Jahan de 1644 à 1656 et inaugurée par son premier imam Syed Abdul Ghafoor Shah Bukhari ; elle servit de mosquée impériale moghole jusqu’en 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
  es: "La gran mezquita congregacional de Shahjahanabad (Vieja Delhi), construida por el emperador mogol Shah Jahan entre 1644 y 1656 e inaugurada por su primer imán, Syed Abdul Ghafoor Shah Bukhari; sirvió como mezquita imperial mogol hasta 1857 {cite:asher-mughal-india-1992 p. 193} {cite:ahmed-mosque-monument-2013}."
  ur: "شاہجہاں آباد ⁦(پرانی دہلی)⁩ کی عظیم اجتماعی مسجد، جسے مغل بادشاہ شاہ جہاں نے 1644 اور 1656 کے درمیان تعمیر کیا تھا اور اس کا افتتاح پہلے امام سید عبدالغفور شاہ بخاری نے کیا تھا۔ اس نے 1857 تک مغل شاہی مسجد کے طور پر کام کیا۔ 193} {حوالہ:احمد-مسجد-یادگار-2013}۔"
  tr: "Şah Jahanabad'daki (Eski Delhi) Büyük Cema Camii, Babür İmparatoru Şah Cihan tarafından 1644-1656 yılları arasında inşa edilmiş ve ilk imamı Seyyid Abdul Ghafoor Şah Buhari tarafından açılmıştır; imparatorluk camisi, devletin 1857'deki çöküşüne kadar Babür İmparatorluğu olarak kalmıştır {cite:Asher-Mughal-India-1992, s. 193} {cite:ahmed-camii-anıt-2013}."
  id: "Masjid Jama Agung di Shah Jahanabad (Delhi Lama) dibangun oleh Kaisar Mughal Shah Jahan antara tahun 1644 dan 1656 dan diresmikan oleh imam pertamanya, Syed Abdul Ghafoor Shah Bukhari; masjid kekaisaran tetap menjadi milik Kekaisaran Mughal hingga jatuhnya negara bagian pada tahun 1857 {cite:asher-mughal-india-1992, hlm. 193} {cite:ahmed-mosque-monument-2013}."
