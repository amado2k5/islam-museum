summary:
  ar: "ضريح مثمن مقبب من الآجر خارج أسوار پيچ في مقبرة إسلامية قديمة، أحد ضريحين بكتاشيين باقيين في المجر مع ضريح گل بابا، صار مصلى بعد 1693 وأعيد ضريحاً في الستينيات {cite:yilmaz-ottoman-architecture-hungary-2024 p. 121}."
  en: "An octagonal domed brick tomb outside the walls of Pécs in a former Muslim cemetery, one of two surviving Bektashi tombs in Hungary with Gül Baba's; a chapel after 1693, restored as a tomb in the 1960s {cite:yilmaz-ottoman-architecture-hungary-2024 p. 121}."
  ur: "پیچ کی فصیل کے باہر ایک پرانے مسلم قبرستان میں اینٹ کا ہشت پہلو گنبد دار مقبرہ، گل بابا کے مقبرے کے ساتھ ہنگری کے دو باقی بکتاشی مزاروں میں سے ایک؛ 1693ء کے بعد چیپل، 1960 کی دہائی میں پھر مزار {cite:yilmaz-ottoman-architecture-hungary-2024 p. 121}۔"
