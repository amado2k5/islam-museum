summary:
  ar: "بطاقة أولية لقصر قباد آباد على بحيرة بياض شهر، قصر علاء الدين كيقباد السلجوقي المكتشف أطلاله؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Kubadabad Palace on Lake Beyşehir, Ala al-Din Kayqubad's Seljuk lakeside palace whose ruins were excavated; its sources are not yet checked on the page."
  fr: "Notice provisoire : Palais de Kubadabad, Lake Beyşehir, palais seldjoukide d’Ala al-Din Kayqubad au bord du lac, dont les ruines ont été fouillées. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha del Palacio de Kubadabad en el lago Beyşehir, el palacio selyúcida a orillas del lago de Ala al-Din Kayqubad cuyas ruinas fueron excavadas; sus fuentes aún no han sido verificadas en la página."
  ur: "جھیل Beyşehir پر کباد آباد محل کے لیے ڈرافٹ کارڈ، علاء الدین کیقباد کا سلجوک جھیل کے کنارے محل جس کے کھنڈرات کھدائی گئے تھے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bayadşehir Gölü üzerindeki Qobadabad Sarayı için ön kart, kalıntıları keşfedilen Selçuklu Aladdin Kayqubad'ın sarayı; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Istana Qobadabad di Danau Bayadşehir, istana Aladdin Kayqubad si Seljuk yang reruntuhannya ditemukan; sumber-sumbernya di halaman belum ditinjau."
