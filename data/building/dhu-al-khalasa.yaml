label: { en: "Dhu al-Khalasa (the 'Ka'ba of Yemen')", ar: "ذو الخلصة (الكعبة اليمانية)" }
summary:
  ar: "بيت للأصنام كانت تعظمه خثعم وبجيلة ومن داناهم من أهل تهامة ويحجون إليه، وكان يُسمى «الكعبة اليمانية» و«الكعبة الشامية» تمييزاً له عن بيت مكة. وفي الصحيح أن النبي قال لجرير بن عبد الله البجلي «ألا تريني من ذي الخلصة؟» فانطلق في خمسين ومائة فارس من أحمس فكسره وقتل من وجد عنده، فدعا النبي لهم ولأحمس {cite:sahih-al-bukhari 3823}."
  en: "A pagan sanctuary venerated by Khath'am, Bajila and the neighbouring tribes of Tihama, who made pilgrimage to it; it was called the 'Ka'ba of Yemen' or the 'Ka'ba of the north' in contrast to the house of Mecca. In the Sahih the Prophet asked Jarir ibn 'Abdallah al-Bajali 'will you not relieve me of Dhu al-Khalasa?' — he rode out with a hundred and fifty horsemen of Ahmas, broke it and killed those he found there, and the Prophet prayed for them and for Ahmas {cite:sahih-al-bukhari 3823}."
