label: { en: "Dhu al-Khalasa (the 'Ka'ba of Yemen')", fr: "Dhu al-Khalasa (« Kaaba du Yémen »)", ar: "ذو الخلصة ⁦(الكعبة اليمانية)⁩", es: "Dhu al-Khalasa (la 'Ka'ba de Yemen')", ur: "ذو الخالصہ ⁦(یمن کا کعبہ)⁩", tr: "Dhu al-Khalasa (Yemen Kabesi)", id: "Dhu al-Khalasa (Ka'bah Yaman)" }
summary:
  ar: "بيت للأصنام كانت تعظمه خثعم وبجيلة ومن داناهم من أهل تهامة ويحجون إليه، وكان يُسمى «الكعبة اليمانية» و«الكعبة الشامية» تمييزاً له عن بيت مكة. وفي الصحيح أن النبي قال لجرير بن عبد الله البجلي «ألا تريني من ذي الخلصة؟» فانطلق في خمسين ومائة فارس من أحمس فكسره وقتل من وجد عنده، فدعا النبي لهم ولأحمس {cite:sahih-al-bukhari 3823}."
  en: "A pagan sanctuary venerated by Khath'am, Bajila and the neighbouring tribes of Tihama, who made pilgrimage to it; it was called the 'Ka'ba of Yemen' or the 'Ka'ba of the north' in contrast to the house of Mecca. In the Sahih the Prophet asked Jarir ibn 'Abdallah al-Bajali 'will you not relieve me of Dhu al-Khalasa?' — he rode out with a hundred and fifty horsemen of Ahmas, broke it and killed those he found there, and the Prophet prayed for them and for Ahmas {cite:sahih-al-bukhari 3823}."
  fr: "Sanctuaire païen vénéré par Khath’am, Bajila et les tribus voisines de Tihama, qui y faisaient pèlerinage ; appelé « Kaaba du Yémen » ou « Kaaba du nord » par opposition à la maison de La Mecque. Dans le Sahih, le Prophète demanda à Jarir ibn Abdallah al-Bajali : « Ne me débarrasseras-tu pas de Dhu al-Khalasa ? » Il partit avec cent cinquante cavaliers d’Ahmas, le détruisit et tua ceux qu’il y trouva ; le Prophète pria pour eux et pour Ahmas {cite:sahih-al-bukhari 3823}."
  es: "Un santuario pagano venerado por Khath'am, Bajila y las tribus vecinas de Tihama, que peregrinaban a él; se le llamaba la 'Kaaba de Yemen' o la 'Kaaba del norte' en contraste con la casa de La Meca. En el Sahih, el Profeta le preguntó a Jarir ibn 'Abdallah al-Bajali: '¿No me librarás de Dhu al-Khalasa?' — salió con ciento cincuenta jinetes de Ahmas, la asaltó y mató a los que encontró allí, y el Profeta oró por ellos y por los Ahmas {cite:sahih-al-bukhari 3823}."
  ur: "خثعم، بجیلہ اور تہامہ کے پڑوسی قبائل، جنہوں نے اس کی زیارت کی تھی، کی طرف سے پوجا کی جانے والی ایک کافر پناہ گاہ؛ اسے مکہ کے گھر کے برعکس 'یمن کا کعبہ' یا 'شمال کا کعبہ' کہا جاتا تھا۔ صحیح میں نبی نے جریر بن عبداللہ البجلی سے پوچھا کہ کیا آپ مجھے ذوالخلصہ سے فارغ نہیں کریں گے؟ وہ احمس کے ایک سو پچاس گھڑ سواروں کے ساتھ نکلا، اسے توڑ دیا اور جن کو وہاں پایا اسے قتل کر دیا، اور نبی نے ان کے لیے اور احمس کے لیے دعا فرمائی۔"
  tr: "Putlar için bir ev, Hath', Bacila ve Tihama halkından yakınları tarafından saygı görürdü; bu evler oraya hac yapacaklardır. Mekke Evi'nden ayırt etmek için 'Yemen Kabe'si ve 'Şam Kabe' olarak adlandırılmıştır. Gerçek rivayette Peygamber, Cerrah bin Abdullah el-Bacali'ye şöyle demiştir: 'Bana Zhu'l-Halasa kim göstermez misin?' Ahms'tan elli yüz süvari ile yola çıktı, onları kırdı ve bulduğu herkesi öldürdü. Peygamber onları ve Ahmus'u çağırdı {atı:sahih-al-bukhari 3823}."
  id: "Sebuah rumah untuk berhala dihormati oleh Khath'am, Bajila, dan orang-orang terdekat mereka dari masyarakat Tihama yang akan melakukan ziarah ke sana. Rumah ini disebut 'Ka'bah Yaman' dan 'Ka'bah Palsu' untuk membedakannya dari Rumah Mekah. Dalam riwayat yang asli, Nabi berkata kepada Jarir ibn Abdullah al-Bajali, 'Tidakkah engkau menunjukkan siapa Dhu al-Khalasa?' Ia berangkat dengan lima puluh seratus penunggang kuda dari Ahm, memecahkan mereka, dan membunuh siapa pun yang ditemuinya. Nabi memanggil mereka dan Ahmose {cite:sahih-al-bukhari 3823}."
