  en: "Draft card for the mausoleum of Sultan Tekesh (also called the mausoleum of Shaykh Sharaf) at the site of old Taš Kala near Kunya-Urgench — two Qur'anic-inscription records in the Islamic Epigraphy Thesaurus dated 1203-1204 and 1397-1398 CE."
