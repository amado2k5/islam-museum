label:
  ar: "مسجد جنين الكبير ⁦(مسجد فاطمة خاتون)⁩"
  en: "Great Mosque of Jenin (Fatima Khatun Mosque)"
  ur: "جنین کی عظیم مسجد ⁦(فاطمہ خاتون مسجد)⁩"
  fr: "Grande Mosquée de Jénine (mosquée Fatima Khatun)"
  es: "Gran Mezquita de Yenín (mezquita Fatima Khatun)"
  tr: "Cenin Ulu Camii (Fatıma Hatun Camii)"
