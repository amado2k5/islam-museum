summary:
  ar: "المسجد الكبير بجنين، وهو مجمع فاطمة خاتون الديني المعروف بالجنينة. تنسبه الرواية المحلية إلى عمر بن الخطاب، لكن الدراسة الأثرية تبيّن أنه أُسس في العصر المملوكي وجُدّد في العصر العثماني، ويضم قبة وصحنًا ومئذنة {cite:marom-lajjun-2023}{cite:mwnf-explore}."
  en: "Jenin’s Great Mosque, the religious complex of Fatima Khatun known locally as al-Junayniyya. Local tradition ascribes it to Umar ibn al-Khattab, but archaeological study dates the surviving building to the Mamluk period with Ottoman renewals; it comprises a dome, courtyard and minaret {cite:marom-lajjun-2023}{cite:mwnf-explore}."
  ur: "جنین کی عظیم مسجد، فاطمہ خاتون کا مذہبی مجمع جسے مقامی طور پر جنینیہ کہا جاتا ہے۔ مقامی روایت اسے عمر بن الخطاب سے جوڑتی ہے، مگر آثارِ قدیمہ کے مطابق موجودہ عمارت مملوک دور کی ہے جس پر عثمانی تجدیدیں ہوئیں؛ اس میں گنبد، صحن اور مینار شامل ہیں {cite:marom-lajjun-2023}{cite:mwnf-explore}۔"
  fr: "La Grande Mosquée de Jenin, complexe religieux de Fatima Khatun appelé localement al-Junayniyya. La tradition locale l’attribue à Omar ibn al-Khattab, mais l’étude archéologique date le bâtiment de l’époque mamelouke avec des remaniements ottomans ; il comprend un dôme, une cour et un minaret {cite:marom-lajjun-2023}{cite:mwnf-explore}."
  es: "La Gran Mezquita de Yenín, complejo religioso de Fatima Khatun llamado localmente al-Junayniyya. La tradición local lo atribuye a Umar ibn al-Jattab, pero el estudio arqueológico data el edificio en la época mameluca con reformas otomanas; consta de cúpula, patio y minarete {cite:marom-lajjun-2023}{cite:mwnf-explore}."
  tr: "Cenin Ulu Camii, yerel olarak el-Cüneyhiyye denen Fatıma Hatun külliyesi. Yerel gelenek onu Ömer bin el-Hattab’a atfeder, ancak arkeolojik çalışma mevcut yapıyı Memlük dönemine tarihler ve Osmanlı onarımları ekler; kubbe, avlu ve minareden oluşur {cite:marom-lajjun-2023}{cite:mwnf-explore}."
  id: "Masjid Agung Jenin, kompleks keagamaan Fatima Khatun yang disebut al-Junayniyya. Tradisi lokal mengaitkannya dengan Umar bin Khattab, tetapi kajian arkeologi menaruh bangunan yang ada pada masa Mamluk dengan pembaruan Utsmaniyah; terdiri dari kubah, halaman dan menara {cite:marom-lajjun-2023}{cite:mwnf-explore}."
