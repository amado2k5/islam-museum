label: { ar: "جامع السلطان سليمان في قلعة بودا ⁦(كنيسة ماتياس)⁩", en: "Sultan Süleyman Mosque, Buda Castle (Matthias Church)", fr: "Mosquée Sultan Soliman, château de Buda (église Matthias)", ur: "سلطان سلیمان مسجد، قلعۂ بودا ⁦(میتھیاس گرجا)⁩", es: "Mezquita del Sultán Solimán, Castillo de Buda (Iglesia de Matías)", tr: "Buda Kalesi'ndeki Sultan Süleyman Camii (Matthias Kilisesi)", id: "Masjid Sultan Suleiman di Kastil Buda (Gereja Matthias)" }
summary:
  ar: "كنيسة ماتياس في قلعة بودا، حُوّلت بعد الفتح العثماني سنة 1541 إلى الجامع الكبير ⁦(جامع الخنكار)⁩، وفيها صُليت أول جمعة في 2 سبتمبر 1541 وصلاة الجنازة على گل بابا {cite:yilmaz-ottoman-architecture-hungary-2024 p. 61}."
  en: "The Matthias Church in Buda Castle, made the Great (Hünkar) Mosque after the Ottoman conquest of 1541, where the first Friday prayer was held on 2 September 1541 and the funeral prayer of Gül Baba was performed {cite:yilmaz-ottoman-architecture-hungary-2024 p. 61}."
  fr: "Église Matthias devenue Grande Mosquée Hünkar après 1541 ; première prière du vendredi le 2 septembre, funérailles de Gül Baba. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 61}"
  ur: "قلعۂ بودا کا میتھیاس گرجا، 1541ء کی عثمانی فتح کے بعد بڑی ⁦(ہنکار)⁩ مسجد بنا؛ یہاں 2 ستمبر 1541ء کو پہلا جمعہ اور گل بابا کی نمازِ جنازہ ہوئی {cite:yilmaz-ottoman-architecture-hungary-2024 p. 61}۔"
  es: "La iglesia de Matías en el castillo de Buda, convertida en la Gran Mezquita (Hünkar) después de la conquista otomana de 1541, donde se celebró la primera oración del viernes el 2 de septiembre de 1541 y se realizó la oración fúnebre de Gül Baba {cite:yilmaz-ottoman-architecture-hungary-2024 p. 61}."
  tr: "Buda Kalesi'ndeki Matthias Kilisesi, 1541'deki Osmanlı fethi sonrası Büyük Camii'ye (Al-Khankar Camii) dönüştürülmüştür; ilk cuma namazı 2 Eylül 1541'de yapılmış ve cenaze namazı Gul Baba için kılınmıştır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 61}."
  id: "Gereja Matthias di Kastil Buda diubah setelah penaklukan Ottoman pada tahun 1541 menjadi Masjid Agung (Masjid Al-Khankar), di mana shalat Jumat pertama diadakan pada 2 September 1541, dan doa pemakaman dilakukan untuk Gul Baba {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 61}."
