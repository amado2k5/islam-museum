summary:
  ar: "جناح الجلالة المكسو بالقيشاني بناه الفاتح سنة 1472م ضمن طوب قابي سرايي؛ تصميم فارسي مخططه صليبي واليوم يعرض مقتنيات القيشاني."
  en: "The Tiled Pavilion built by Fatih in 1472 as an outer kiosk of Topkapı Sarayı; Persian in design, cruciform in plan, now housing the museum's tile collection."
  fr: "Le Pavillon des faïences construit par Fatih en 1472 comme kiosque extérieur de Topkapı Sarayı ; de conception persane et de plan cruciforme, il abrite aujourd’hui la collection de céramiques du musée."
  es: "El Pabellón de Azulejos, construido por Fatih en 1472 como un quiosco exterior del Palacio Topkapı Sarayı; de diseño persa, con planta cruciforme, alberga actualmente la colección de azulejos del museo."
  ur: "ٹائلڈ پویلین جو فتح نے 1472 میں Topkapı Sarayı کے بیرونی کیوسک کے طور پر بنایا تھا۔ ڈیزائن میں فارسی، منصوبہ بندی میں مصلوب، اب میوزیم کے ٹائلوں کا مجموعہ ہے۔"
  tr: "Qayshani ile kaplı kraliyet köşkü, fatih tarafından 1472 yılında Qabi Sarai tuğlasının içinde inşa edilmiştir; Haç desenli bir Pers tasarımıdır ve bugün Qaishani koleksiyonları sergilenmektedir."
  id: "Paviliun kerajaan yang dilapisi Qayshani dibangun oleh penakluk pada tahun 1472 M di dalam bata Qabi Sarai; sebuah desain Persia dengan pola salib, dan kini menampilkan koleksi Qaishani."
