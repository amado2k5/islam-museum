  tr: "Üst Mısır'daki Sohag'daki Sidi Aref Camii'nin ön kartı; Sohag şehrinin arkeolojik simgelerinden biri olan ve yirminci yüzyılda yeniden inşa edilen bu camiye; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Masjid Sidi Aref di Sohag, Mesir Hulu, salah satu landmark arkeologi di kota Sohag, yang dibangun kembali pada abad kedua puluh; sumber-sumbernya di halaman belum ditinjau."
