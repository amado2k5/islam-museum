  en: "A five-arched mosque in the village of Kachhpura on the east bank of the Yamuna opposite the Taj Mahal, dated by its two inscriptions to AH 937/1530, the year of Humayun's accession, and paid for by Shaykh Zain of Khwaf {cite:nath-history-of-mughal-architecture-1-1982 p. 133} {cite:nath-history-of-mughal-architecture-1-1982 p. 134}."
  ur: "تاج محل کے سامنے جمنا کے مشرقی کنارے گاؤں کچھپورہ میں پانچ محرابوں کی مسجد، جس کے دو کتبے اسے 937ھ/1530ء، ہمایوں کی تخت نشینی کا سال، کی بتاتے ہیں؛ خرچ شیخ زین خوافی کا تھا {cite:nath-history-of-mughal-architecture-1-1982 p. 134}۔"
