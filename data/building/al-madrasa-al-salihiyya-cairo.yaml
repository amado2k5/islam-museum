summary:
  ar: "المدارس الصالحية بين القصرين بالقاهرة، عمّرها الملك الصالح نجم الدين أيوب، وقرر فيها دروساً للمذاهب الأربعة ⁦(المقريزي، ص 1061–1062 و1912)⁩."
  en: "The Salihiyya madrasas between the two palaces in Cairo, built by al-Salih Najm al-Din Ayyub, with four teaching posts for the four schools (al-Maqrizi, pp. 1061–1062, 1912)."
  fr: "Les madrasas Salihiyya entre les deux palais au Caire, construites par al-Salih Najm al-Din Ayyub, avec quatre chaires pour les quatre écoles juridiques (al-Maqrizi, p. 1061–1062, 1912)."
  es: "Las madrasas Salihiyya, situadas entre los dos palacios de El Cairo, fueron construidas por al-Salih Najm al-Din Ayyub y contaban con cuatro puestos docentes para las cuatro escuelas (al-Maqrizi, págs. 1061-1062, 1912)."
  ur: "قاہرہ میں دو محلوں کے درمیان صالحیہ مدارس، جسے الصالح نجم الدین ایوب نے بنایا تھا، جس میں چار مکاتب کے لیے چار تدریسی عہدے ہیں ⁦(المقریضی، صفحہ 1061–1062، 1912)⁩۔"
  tr: "Kahire'deki Kasrayn arasındaki Salihiye okulları Kral el-Salih Necmeddin Eyyub tarafından kurulmuş ve oradaki dört mezhebe için dersler hazırlamıştır (el-Maqrizi, ss. 1061–1062 ve 1912)."
  id: "Sekolah-sekolah Salihiya di antara Qasrayn di Kairo didirikan oleh Raja al-Salih Najm al-Din Ayyub, dan ia menetapkan pelajaran untuk empat aliran pemikiran di sana (al-Maqrizi, hlm. 1061–1062 dan 1912)."
