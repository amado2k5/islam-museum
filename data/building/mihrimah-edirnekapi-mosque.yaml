summary:
  ar: "جامع مهرماه سلطان على التل السادس من إسطنبول القديمة قرب باب أدرنة؛ ثاني كليتين بناهما سنان لمهرماه ابنة سليمان القانوني، أُتم سنة 1565م {cite:freely-ottoman-architecture-2011}."
  en: "The Mihrimah Sultan Mosque on Istanbul's Sixth Hill by the Edirne Gate; the second of the two complexes Sinan built for Mihrimah, Suleyman the Magnificent's daughter, completed in 1565 CE {cite:freely-ottoman-architecture-2011}."
  fr: "Mosquée de Mihrimah sur la sixième colline d’Istanbul près de la porte d’Edirne ; second des deux complexes de Sinan pour la fille de Soliman le Magnifique, achevé en 1565 {cite:freely-ottoman-architecture-2011}"
  es: "La Mezquita de Mihrimah Sultan en la Sexta Colina de Estambul, junto a la Puerta de Edirne; el segundo de los dos complejos que Sinan construyó para Mihrimah, hija de Solimán el Magnífico, se completó en 1565 d. C. {cite:freely-ottoman-architecture-2011}."
  ur: "ایڈرن گیٹ کے پاس استنبول کی چھٹی پہاڑی پر واقع مہریمہ سلطان مسجد؛ دو کمپلیکس میں سے دوسرا سنان نے مہریمہ، سلیمان دی میگنیفیشنٹ کی بیٹی کے لیے بنایا تھا، جو 1565 عیسوی میں مکمل ہوا تھا۔"
  tr: "Mehrehe Sultan Camii, eski İstanbul'un altıncı tepesinde, Edirne Kapısı yakınında; Sinan tarafından Mehrema tarafından inşa edilen iki fakültenin ikincisi, Süleyman Mütehemen'in kızı ve 1565 yılında tamamlanmıştır {atıf:özgür-osmanlı-mimari-2011}."
  id: "Masjid Mehrehe Sultan di gundukan keenam Istanbul lama dekat Gerbang Edirne; fakultas kedua dari dua fakultas yang dibangun oleh Sinan oleh Mehrema, putri Suleiman yang Agung, selesai pada tahun 1565 M {cite:freely-ottoman-architecture-2011}."
