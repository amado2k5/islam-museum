  ur: "جونپور، اتر پردیش کی حمام دروازہ مسجد کے لیے ڈرافٹ کارڈ - ایک مقامی اجتماعی مسجد جسے اس نام سے جانا جاتا ہے۔ 975 ہجری / 1567-1568 عیسوی کے دو تعمیراتی نوشتہ جات اسلامی ایپی گرافی تھیسورس میں درج ہیں۔"
  tr: "Uttar Pradesh, Jaunpur'daki Hammam Darwaza Camii'nin ön kartı — bu isimle bilinen yerel bir camidir; İslami Yazıtlar Sözlüğü'nde 975 Hicri / 1567-1568 tarihli iki bina yazıtı."
  id: "Kartu pendahuluan Masjid Hammam Darwaza di Jaunpur, Uttar Pradesh — sebuah masjid lokal yang dikenal dengan nama ini; dua prasasti bangunan bertanggal 975 AH / 1567-1568 yang tercatat dalam Kamus Prasasti Islam."
