  en: "Draft card for the Hammam Darwaza Mosque of Jaunpur, Uttar Pradesh — a local congregational mosque known by this name; two construction inscriptions dated 975 AH / 1567-1568 CE are recorded in the Islamic Epigraphy Thesaurus."
