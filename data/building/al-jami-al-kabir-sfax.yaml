summary:
  ar: "بطاقة أولية للجامع الكبير بصفاقس بتونس، جامع المدينة العتيقة الذي أسس الأغالبة سنة ٢٣٤هـ/٨٤٩م تقريباً؛ من أقدم مساجد المغرب ولم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Great Mosque of Sfax, founded about 234 AH/849 CE under the Aghlabids and among the oldest mosques of the Maghreb; its sources are not yet checked on the page."
  fr: "Notice provisoire : Grande Mosquée de Sfax, fondée vers 234 H/849 sous les Aghlabides, parmi les plus anciennes du Maghreb. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la Gran Mezquita de Sfax, fundada alrededor del año 234 AH/849 d. C. bajo el dominio de los aglabíes y una de las mezquitas más antiguas del Magreb; sus fuentes aún no han sido verificadas en la página."
  ur: "Sfax کی عظیم مسجد کے لیے ڈرافٹ کارڈ، جس کی بنیاد تقریباً 234 ہجری/849 عیسوی میں اغلابیوں کے تحت اور مغرب کی قدیم ترین مساجد میں سے تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Tunus'taki Sfax Büyük Camii için ön kart, Ağlabidler tarafından yaklaşık 234 Hicri / 849 yılında kurulan Eski Şehir Camii; Fas'ın en eski camilerinden biridir ve kaynakları henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Besar Sfax, Tunisia, Masjid Kota Tua, yang didirikan oleh Aghlabid sekitar tahun 234 H / 849 M; salah satu masjid tertua di Maroko, yang sumbernya belum ditinjau di halaman tersebut."
