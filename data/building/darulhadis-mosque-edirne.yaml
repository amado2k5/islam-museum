  es: "Fundada por Murat II en 1434 como escuela de tradición sagrada, luego convertida en mezquita por el arquitecto Koçu Ahmet; detrás de él, Açık Türbe y Şehzadeler Türbesi tienen a los hijos de Murat, Hasan y Orhan."
  ur: "مورات II کے ذریعہ 1434 میں ایک مقدس روایت کے اسکول کے طور پر قائم کیا گیا تھا، پھر معمار کوکو احمد نے اسے مسجد میں تبدیل کیا تھا۔ اس کے پیچھے Açık Türbe اور Şehzadeler Türbesi نے مرات کے بیٹے حسن اور اورحان کو پکڑ رکھا ہے۔"
