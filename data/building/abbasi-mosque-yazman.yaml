summary:
  ar: "بطاقة أولية للمسجد العباسي في يزمان بالبنجاب، جامع نواب بهاولبور من سنة ١٨٤٩م المشابه لمسجد الشاه بدلهي؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Abbasi Mosque of Yazman in Punjab, the Bahawalpur nawabs' 1849 mosque modelled on Delhi's Shahi Masjid; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Abbasi de Yazman au Pendjab, bâtie en 1849 par les nawabs de Bahawalpur sur le modèle de la Shahi Masjid de Delhi. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la Mezquita Abbasi de Yazman en Punjab, la mezquita de los nawabs de Bahawalpur de 1849, modelada a partir de la Shahi Masjid de Delhi; sus fuentes aún no han sido verificadas en la página."
  ur: "پنجاب میں یزمان کی عباسی مسجد کے لیے ڈرافٹ کارڈ، بہاولپور کے نوابوں کی 1849 کی مسجد جو دہلی کی شاہی مسجد پر بنائی گئی تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Pencap'taki Yazman'daki Abbasi Camii'nin ön kartı, 1849 yılında Hawalpur'daki Nawab Camii'nin Delhi'deki Şah Camii'ne benzer; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal Masjid Abbasi di Yazman, Punjab, Masjid Nawab di Hawalpur dari tahun 1849 M, mirip dengan Masjid Shah di Delhi; sumber-sumbernya di halaman tersebut belum ditinjau."
