label: { ar: "جامع الوزير ⁦(فاضل أحمد باشا)⁩ في كانديا ⁦(هيراكليون)⁩", en: "Vezir Mosque of Köprülü Fazıl Ahmed Pasha, Heraklion", fr: "Mosquée Vezir de Köprülü Fazıl Ahmed Pacha, Héraklion", ur: "وزیر مسجد ⁦(کوپریلی فاضل احمد پاشا)⁩، ہیراکلیون", es: "Mezquita Vezir de Köprülü Fazıl Ahmed Pasha, Heraklion", tr: "Kandiya'daki El-Vezir Camii (Fadil Ahmed Paşa) (Heraklion)", id: "Masjid Al-Wazir (Fadil Ahmed Pasha) di Kandia (Heraklion)" }
summary:
  ar: "جامع بناه فاتح كانديا الصدر الأعظم كوبريلي فاضل أحمد باشا سنة 1678، هدمه زلزال 1856، فأعيد بناؤه بين 1869 و1871، وحُوّل سنة 1924 إلى كنيسة القديس تيطس {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1042}."
  en: "The mosque built in 1678 by the conqueror of Candia, the grand vizier Köprülü Fazıl Ahmed Pasha, destroyed by the earthquake of 1856, rebuilt in 1869-71 and turned in 1924 into the church of St Titus {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1042}."
  fr: "Fondation du conquérant de Candie en 1678, détruite en 1856, rebâtie en 1869–1871, Saint-Tite en 1924. {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1042}"
  ur: "کانڈیا کے فاتح صدرِ اعظم کوپریلی فاضل احمد پاشا کی 1678ء میں بنوائی مسجد، 1856ء کے زلزلے میں منہدم، 1869–71ء میں دوبارہ بنی، اور 1924ء میں سینٹ ٹائٹس گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1042}۔"
  es: "La mezquita construida en 1678 por el conquistador de Candia, el gran visir Köprülü Fazıl Ahmed Pasha, destruida por el terremoto de 1856, reconstruida entre 1869 y 1871 y convertida en 1924 en la iglesia de San Tito {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1042}."
  tr: "Kandia Fatih Camii, Sadrazam Koprilı Fadil Ahmed Paşa tarafından 1678 yılında inşa edilmiştir. 1856 depreminde yıkılmış, ardından 1869-1871 yılları arasında yeniden inşa edilmiş ve 1924'te Aziz Titus Kilisesi'ne dönüştürülmüştür {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023, s. 1042}."
  id: "Masjid Penakluk Kandia dibangun oleh Wazir Agung Koprilı Fadil Ahmed Pasha pada tahun 1678. Masjid ini hancur akibat gempa bumi tahun 1856, kemudian dibangun kembali antara tahun 1869 dan 1871, dan diubah pada tahun 1924 menjadi Gereja Santo Titus {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023, hlm. 1042}."
