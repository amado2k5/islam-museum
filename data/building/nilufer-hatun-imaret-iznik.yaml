summary:
  ar: "بناها مراد الأول سنة 1388م لوالدته نيلوفر خاتون؛ نزل لإخوة الآخي ثم عمارة تطعيم للفقراء واليوم متحف إزنيق."
  en: "Built by Murat I in 1388 for his mother Nilüfer Hatun; first an Ahi brotherhood hostel, then a public soup kitchen, today the İznik Museum."
  fr: "Bâti par Murat Ier en 1388 pour sa mère Nilüfer Hatun ; hospice ahi puis cuisine publique, aujourd’hui musée d’İznik."
  es: "Construido por Murat I en 1388 para su madre, Nilüfer Hatun; primero fue un albergue de la hermandad Ahi, luego un comedor social público y hoy es el Museo de İznik."
  ur: "مورات اول نے 1388 میں اپنی والدہ نیلوفر ہاتون کے لیے بنایا تھا۔ پہلے آہی برادرہڈ ہاسٹل، پھر عوامی سوپ کچن، آج ازنک میوزیم۔"
  tr: "1388 yılında Murad I tarafından annesi Nilüfer Hatun için inşa edilmiştir; kardeşler için bir misafirhane, ardından yoksullar için aşı binası ve bugün İznik Müzesi olarak kullanılmaktadır."
  id: "Bangunan ini dibangun oleh Murad I pada tahun 1388 M untuk ibunya, Nilüfer Khatun; dulu menjadi rumah tamu bagi para saudara, kemudian bangunan vaksinasi bagi kaum miskin, dan kini menjadi Museum Iznik."
