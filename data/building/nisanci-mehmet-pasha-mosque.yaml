  ur: "فائفتھ ہل پر عمدہ کلاسیکی مسجد لارڈ پریوی سیل کے لیے 1584-88 میں تعمیر کی گئی۔ مشہور طور پر سینان سے منسوب کیا گیا لیکن اس کے Tezkere میں نہیں۔"
  tr: "Beşinci Tepe'deki Camii, 1584-1588 yılları arasında Nashanji Muhammad Paşa tarafından inşa edilmiştir; mimarisi bilinmeyen ancak Sinan tarafından yapılmamış en güzel klasik camilerden biridir."
  id: "Masjid di Bukit Kelima, dibangun antara tahun 1584-1588 M oleh Nashanji Muhammad Pasha, adalah salah satu masjid klasik terindah, dengan arsitektur yang tidak dikenal namun bukan karya Sinan."
