  ar: "مسجد وحيد الوحدة بُني سنة 1468م لعائشة خاتون ابنة محمد الأول؛ قبة نصف كروية قطرها نحو أحد عشر متراً على ركنيات."
  en: "A single-unit mosque built in 1468 for Ayşe Kadın, daughter of Mehmet I; a hemispherical dome of nearly eleven metres on squinches over an octagonal drum."
  fr: "Mosquée à unité unique construite en 1468 pour Ayşe Kadın, fille de Mehmet Ier ; une coupole hémisphérique de près de onze mètres sur trompes au-dessus d’un tambour octogonal."
  es: "Una mezquita de una sola unidad construida en 1468 para Ayşe Kadın, hija de Mehmet I; una cúpula hemisférica de casi once metros sobre pechinas que se asienta sobre un tambor octogonal."
  ur: "ایک اکائی والی مسجد 1468 میں مہمت اول کی بیٹی Ayşe Kadın کے لیے بنائی گئی تھی۔ ایک آکٹونل ڈرم پر squinches پر تقریبا گیارہ میٹر کا ایک نصف کرہ دار گنبد۔"
  tr: "Wahid Al-Wahda Camii, 1468 yılında Mehmed I'in kızı Aisha Khatoun tarafından inşa edilmiştir; köşeleri yaklaşık on bir metre çapında yarım küre şeklinde bir kubbedir."
  id: "Masjid Wahid Al-Wahda dibangun pada tahun 1468 M oleh Aisha Khatoun, putri Mehmed I; sebuah kubah berbentuk hemisfer berdiameter sekitar sebelas meter di sudut-sudutnya."
