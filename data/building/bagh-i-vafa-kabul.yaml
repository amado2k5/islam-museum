summary:
  ar: "بستان رباعي أنشأه بابر في كابل سنة 1504م ووصفه في مذكراته، على ربوة تواجه الجنوب فيها البرتقال والأترج والرمان وحوض عشرة في عشرة {cite:brookes-gardens-of-paradise-1987 p.125} {cite:brookes-gardens-of-paradise-1987 p.127}."
  en: "A four-part garden laid out by Babur at Kabul in 1504 and described in his memoirs, on rising ground facing south, with oranges, citrons, pomegranates and a ten-by-ten tank {cite:brookes-gardens-of-paradise-1987 p.125} {cite:brookes-gardens-of-paradise-1987 p.127}."
  fr: "Jardin en quatre parties aménagé par Babur à Kaboul en 1504 et décrit dans ses mémoires, sur un terrain montant exposé au sud, avec des oranges, des cédrats, des grenades et un bassin de dix sur dix {cite:brookes-gardens-of-paradise-1987 p.125} {cite:brookes-gardens-of-paradise-1987 p.127}."
  es: "Un jardín de cuatro partes diseñado por Babur en Kabul en 1504 y descrito en sus memorias, en un terreno elevado orientado al sur, con naranjos, cidros, granados y un estanque de diez por diez {cite:brookes-gardens-of-paradise-1987 p.125} {cite:brookes-gardens-of-paradise-1987 p.127}."
  ur: "ایک چار حصوں پر مشتمل ایک باغ جسے بابر نے 1504 میں کابل میں بچھایا تھا اور اپنی یادداشتوں میں بیان کیا ہے کہ جنوب کی طرف بڑھتی ہوئی زمین پر، جس میں سنتری، لیموں، انار اور ایک دس بائی دس ٹینک {حوالہ: بروکس-گارڈنز-آف-پیراڈائز-1987 صفحہ 125} صفحہ 127}۔"
  tr: "Babur tarafından 1504 yılında Kabil'de kurulan ve anılarında anlatılan dört yönlü bir meyve bahçesi, güneye bakan bir tepede, portakal, portakal, nar ve on tanelik bir havuz {cite:brookes-gardens-of-paradise-1987 s.125} {cite:brookes-gardens-of-paradise-1987 s.127}."
  id: "Kebun empat arah yang didirikan oleh Babur di Kabul pada tahun 1504 M dan dijelaskan dalam memoarnya, di atas bukit yang menghadap ke selatan dengan jeruk, jeruk, delima, dan sebuah cekungan sepuluh {cite:brookes-gardens-of-paradise-1987 hlm.125} {cite:brookes-gardens-of-paradise-1987 hlm.127}."
