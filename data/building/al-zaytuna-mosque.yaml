summary:
  ar: "بطاقة أولية لجامع الزيتونة بتونس، الجامع الأموي الأغلبي الذي صار مقصد العلم والفقه المالكي في إفريقية؛ يصفه المقدسي في جملة معالم المدينة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Zaytuna Mosque of Tunis, the Umayyad-Aghlabid congregational mosque that became the seat of Maliki learning in Ifriqiya; al-Muqaddasi describes it among the city's landmarks, the page not yet checked."
  fr: "Notice provisoire pour la mosquée Zaytuna de Tunis, grande mosquée omeyyade-aghlabide devenue le siège de l’enseignement malikite en Ifriqiya ; al-Muqaddasi la décrit parmi les monuments de la ville, mais la page n’a pas encore été vérifiée."
  es: "Boceto de ficha para la Mezquita Zaytuna de Túnez, la mezquita congregacional omeya-aglábida que se convirtió en la sede del saber malikí en Ifriqiya; al-Muqaddasi la describe entre los monumentos de la ciudad, página aún sin revisar."
  ur: "تیونس کی زیتونہ مسجد کے لیے ڈرافٹ کارڈ، اموی-اغلبید اجتماعی مسجد جو عفریقیہ میں مالکی تعلیم کا مرکز بنی تھی۔ المقدسی نے اسے شہر کے اہم مقامات میں بیان کیا ہے، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
