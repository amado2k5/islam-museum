  es: "El palacio más grande que jamás construyeron los otomanos, erigido por Süleyman hacia 1520 y entregado al gran vezir İbrahim Pasha en 1524; desde su restauración en la década de 1960 alberga el Museo de Arte Turco e Islámico."
  ur: "عثمانیوں کا اب تک کا سب سے بڑا محل جسے سلیمان نے 1520 میں تعمیر کیا تھا اور 1524 میں عظیم الشان وزیر ابراہیم پاشا کو دیا تھا۔ 1960 کی دہائی کی بحالی کے بعد سے اس میں ترک اور اسلامی فن کا میوزیم موجود ہے۔"
