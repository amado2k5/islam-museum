label: { ar: "بيت كأوسان بفرغانة", en: "the Ka'usan temple of Farghana", fr: "Temple Ka’usan de Farghana", es: "El templo Ka'usan de Farghana", ur: "فرغانہ کا کاؤسان مندر", tr: "Fergana'daki Kausan Evi", id: "Rumah Kausan di Fergana" }
summary:
  ar: "بيت بناه كاوس الملك بمدينة فرغانة، كان يأتيه عباد الكواكب ممن يتقرب بالشمس؛ وعند أبي عبيد البكري أن المعتصم هدمه، ولهدمه خبر ظريف ذُكر في كتاب الزمان {cite:umari-masalik-1924 p. 223}."
  en: "The house King Kawus built at Farghana, visited by planet-worshippers devoted to the Sun; Abu Ubayd al-Bakri says al-Mu'tasim demolished it, its demolition's tale told in the Book of Time {cite:umari-masalik-1924 p. 223}."
  fr: "Maison construite par le roi Kawus à Farghana, visitée par les adorateurs des planètes voués au Soleil ; Abu Ubayd al-Bakri dit qu’al-Mu’tasim la démolit, récit raconté dans le Livre du Temps {cite:umari-masalik-1924 p. 223}."
  es: "La casa que el rey Kawus construyó en Farghana, visitada por adoradores de los planetas devotos del Sol; Abu Ubayd al-Bakri dice que al-Mu'tasim la demolió, y la historia de su demolición se cuenta en el Libro del Tiempo {cite:umari-masalik-1924 p. 223}."
  ur: "فرغانہ میں شاہ کاوش کا بنایا ہوا گھر، جس کا دورہ سورج کے لیے وقف سیارے کے پرستار کرتے تھے۔ ابو عبید البکری کہتے ہیں کہ معتصم نے اسے منہدم کیا، اس کی مسماری کی کہانی کتاب وقت میں بیان کی گئی ہے۔ 223}۔"
  tr: "Kawus al-Malik tarafından Fergana şehrinde inşa edilen ve güneşe yaklaşan yıldızlara tapanlar tarafından ziyaret edilen bir ev; Ebu Ubeyd el-Bekri, el-Mu'tasim'in onu yıktığını bildirmiştir ve yıkımına dair hoş bir anlatım Zaman Kitabı'nda (atı:umari-masalik-1924, s. 223} yer almaktadır."
  id: "Sebuah rumah yang dibangun oleh Kawus al-Malik di kota Fergana, yang dikunjungi oleh para pemuja bintang yang mendekati matahari; Abu Ubayd al-Bakri melaporkan bahwa al-Mu'tasim telah merobohkannya, dan ada kisah menarik tentang pembongkarannya yang disebutkan dalam Kitab Waktu {cite:umari-masalik-1924, hlm. 223}."
