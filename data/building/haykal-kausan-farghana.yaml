summary:
  ar: "بيت بناه كاوس الملك بمدينة فرغانة، كان يأتيه عباد الكواكب ممن يتقرب بالشمس؛ وعند أبي عبيد البكري أن المعتصم هدمه، ولهدمه خبر ظريف ذُكر في كتاب الزمان {cite:umari-masalik-1924 p. 223}."
  en: "The house King Kawus built at Farghana, visited by planet-worshippers devoted to the Sun; Abu Ubayd al-Bakri says al-Mu'tasim demolished it, its demolition's tale told in the Book of Time {cite:umari-masalik-1924 p. 223}."
  fr: "Maison construite par le roi Kawus à Farghana, visitée par les adorateurs des planètes voués au Soleil ; Abu Ubayd al-Bakri dit qu’al-Mu’tasim la démolit, récit raconté dans le Livre du Temps {cite:umari-masalik-1924 p. 223}."
  es: "La casa que el rey Kawus construyó en Farghana, visitada por adoradores de los planetas devotos del Sol; Abu Ubayd al-Bakri dice que al-Mu'tasim la demolió, y la historia de su demolición se cuenta en el Libro del Tiempo {cite:umari-masalik-1924 p. 223}."
