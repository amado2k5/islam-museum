label: { ar: "قصر قباذ (قصر الحجاج) بالبصرة", en: "Qasr Qubadh / the Hajjaj palace at Basra" }
summary:
  ar: "قصر بالبصرة كان قبل أن تُختط المدينة منزلاً تنزله الأكاسرة في متصيداتهم وتخرج إليه الأساورة في متنزهاتهم، فتهدم حتى جدده الحجاج فعُرف به وقيل قصر الحجاج وكان يعرف بقصر قباذ؛ وفيه دارت المفاخرة المشهورة حين قال الحجاج لجرير والفرزدق ائتياني في لباس آبائكما في الجاهلية فلبس الفرزدق الديباج والخز وقعد في قبة ولبس جرير الدرع وتقلد السيف وتأبط الرمح وأقبل في أربعين فارساً من بني يربوع {cite:umari-masalik-1924 p. 248}."
  en: "The Basran palace that was a Khosrow hunting-lodge before the city was founded, ruined until al-Hajjaj rebuilt it and gave it his name — earlier it was Qubadh's. In it ran the famous boasting match when al-Hajjaj bade Jarir and al-Farazdaq appear in their fathers' jahiliyya dress: al-Farazdaq came in brocade under a dome, Jarir in mail and spear with forty horsemen of Banu Yarbu {cite:umari-masalik-1924 p. 248}."
