label: { ar: "قصر قباذ ⁦(قصر الحجاج)⁩ بالبصرة", en: "Qasr Qubadh / the Hajjaj palace at Basra", fr: "Qasr Qubadh / palais d’al-Hajjaj à Bassora", es: "Qasr Qubadh / el palacio Hajjaj en Basora" }
summary:
  ar: "قصر بالبصرة كان قبل أن تُختط المدينة منزلاً تنزله الأكاسرة في متصيداتهم وتخرج إليه الأساورة في متنزهاتهم، فتهدم حتى جدده الحجاج فعُرف به وقيل قصر الحجاج وكان يعرف بقصر قباذ؛ وفيه دارت المفاخرة المشهورة حين قال الحجاج لجرير والفرزدق ائتياني في لباس آبائكما في الجاهلية فلبس الفرزدق الديباج والخز وقعد في قبة ولبس جرير الدرع وتقلد السيف وتأبط الرمح وأقبل في أربعين فارساً من بني يربوع {cite:umari-masalik-1924 p. 248}."
  en: "The Basran palace that was a Khosrow hunting-lodge before the city was founded, ruined until al-Hajjaj rebuilt it and gave it his name — earlier it was Qubadh's. In it ran the famous boasting match when al-Hajjaj bade Jarir and al-Farazdaq appear in their fathers' jahiliyya dress: al-Farazdaq came in brocade under a dome, Jarir in mail and spear with forty horsemen of Banu Yarbu {cite:umari-masalik-1924 p. 248}."
  fr: "Palais de chasse des Khosroès avant la fondation de Bassora, ruiné puis rebâti par al-Hajjaj qui lui donna son nom, auparavant celui de Qubadh. Al-Hajjaj y fit rivaliser Jarir et al-Farazdaq en habits préislamiques de leurs pères : brocart sous coupole pour al-Farazdaq, cotte de mailles et lance avec quarante cavaliers des Banu Yarbu’ pour Jarir {cite:umari-masalik-1924 p. 248}"
  es: "El palacio de Basora, que fue un pabellón de caza de los Cosroes antes de la fundación de la ciudad, quedó en ruinas hasta que al-Hajjaj lo reconstruyó y le dio su nombre; anteriormente pertenecía a Qubadh. En él tuvo lugar el famoso duelo de jactancia en el que al-Hajjaj ordenó a Jarir y al-Farazdaq que aparecieran con la vestimenta de la época preislámica de sus padres: al-Farazdaq apareció con brocado bajo una cúpula, Jarir con cota de malla y lanza, acompañado de cuarenta jinetes de Banu Yarbu {cite:umari-masalik-1924 p. 248}."
