label:
  ar: جامع القطيعة ببغداد
  en: The Jami' al-Qati'a of Baghdad
  fr: "La Jami’ al-Qati’a de Bagdad"
  es: "El Jami' al-Qati'a de Bagdad"
  ur: "جامع القطیہ بغداد"
summary:
  ar: "الجامع الذي بناه مهذب الدولة علي بن نصر في قطيعة ببغداد سنة تسع وسبعين وثلثمائة، في السنة التي عمّر فيها أيضاً سقايات بواسط ففرُغ منها على ستة آلاف {cite:muntazam-ibn-al-jawzi j.7 p.149}."
  en: "The congregational mosque built by Muhdhib al-Dawla 'Ali b. Nasr at the Qati'a in Baghdad in 379 — the same year he also restored the watering-places at Wasit at a cost of six thousand {cite:muntazam-ibn-al-jawzi j.7 p.149}."
  fr: "Mosquée du vendredi construite par Muhdhib al-Dawla Ali ibn Nasr à la Qati’a de Bagdad en 379 — année où il restaura aussi les points d’eau de Wasit pour un coût de six mille {cite:muntazam-ibn-al-jawzi j.7 p.149}."
  es: "La mezquita congregacional construida por Muhdhib al-Dawla 'Ali b. Nasr en Qati'a en Bagdad en 379, el mismo año en que también restauró los balnearios en Wasit a un costo de seis mil {cite:muntazam-ibn-al-jawzi j.7 p.149}."
  ur: "اجتماعی مسجد جسے محذیب الدولہ علی بن الدعوۃ نے تعمیر کیا تھا۔ نصر نے 379 میں بغداد میں قطعہ میں - اسی سال اس نے چھ ہزار کی لاگت سے وصیت میں پانی دینے کی جگہوں کو بھی بحال کیا۔"
