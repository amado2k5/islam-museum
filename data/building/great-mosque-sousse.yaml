  es: "Boceto para la Gran Mezquita de Sousse, la mezquita aglabí construida por Abu al-Abbas Muhammad I alrededor del año 851; un hito temprano de Ifriqiya según la enciclopedia citada, página aún no verificada."
  ur: "سوس کی عظیم مسجد کے لیے ڈرافٹ کارڈ، 851 کے قریب ابو العباس محمد اوّل کی طرف سے تعمیر کی گئی اغلبید مسجد؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق ایک ابتدائی افریقیہ نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
