  ur: "دہلی میں بستی نظام الدین کے مشرقی کنارے پر چار صحنوں والی مسجد، جو مشرقی دروازے کے کتبے کے مطابق وزیر خانِ جہاں جونان شاہ نے 772ھ/1370–71ء میں بنوائی، اور جدید دور میں بڑی حد تک ازسرِ نو تعمیر ہوئی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}۔"
