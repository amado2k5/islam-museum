label: { ar: "المسجد الأسود ⁦(كالي مسجد)⁩ في نظام الدين، دلهي", en: "Kali Masjid, Nizamuddin, Delhi", fr: "Kali Masjid, Nizamuddin, Delhi", ur: "کالی مسجد، نظام الدین، دہلی", es: "Kali Masjid, Nizamuddin, Delhi", tr: "Nizamuddin, Delhi'deki Kara Camii (Kali Camii)", id: "Masjid Hitam (Masjid Kali) di Nizamuddin, Delhi" }
summary:
  ar: "مسجد ذو أفنية أربعة في الطرف الشرقي من بستي نظام الدين بدلهي، بناه الوزير خان جهان جونان شاه سنة 772هـ/1370–1371 بحسب نقش بوابته الشرقية، وأعيد بناؤه حديثًا {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}."
  en: "A four-court mosque on the eastern edge of Basti Nizamuddin in Delhi, built by the vizier Khan-i Jahan Junan Shah in AH 772/1370-71 according to the inscription on its east gate, and largely rebuilt in modern times {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}."
  fr: "Mosquée à quatre cours à l’est de Basti Nizamuddin à Delhi, construite par le vizir Khan-i Jahan Junan Shah en 772 H/1370–1371 selon l’inscription de sa porte est, et largement reconstruite à l’époque moderne {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}."
  ur: "دہلی میں بستی نظام الدین کے مشرقی کنارے پر چار صحنوں والی مسجد، جو مشرقی دروازے کے کتبے کے مطابق وزیر خانِ جہاں جونان شاہ نے 772ھ/1370–71ء میں بنوائی، اور جدید دور میں بڑی حد تک ازسرِ نو تعمیر ہوئی {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}۔"
  es: "Una mezquita de cuatro patios en el extremo oriental de Basti Nizamuddin en Delhi, construida por el visir Khan-i Jahan Junan Shah en AH 772/1370-71 según la inscripción en su puerta este, y reconstruida en gran parte en tiempos modernos {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}."
  tr: "Delhi'deki Nizamuddin Basti'nin doğu ucunda, vezir Khan Jahan Junan Shah tarafından 772 Hic / 1370–1371 yıllarında doğu kapısının yazıtına göre inşa edilmiş ve yakın zamanda yeniden inşa edilmiştir {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 70}."
  id: "Sebuah masjid dengan empat halaman di ujung timur Nizamuddin Basti di Delhi, dibangun oleh wazir Khan Jahan Junan Shah pada tahun 772 H / 1370–1371 sesuai prasasti gerbang timurnya, dan baru-baru ini dibangun kembali {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 70}."
