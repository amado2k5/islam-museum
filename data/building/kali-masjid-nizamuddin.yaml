summary:
  ar: "مسجد ذو أفنية أربعة في الطرف الشرقي من بستي نظام الدين بدلهي، بناه الوزير خان جهان جونان شاه سنة 772هـ/1370–1371 بحسب نقش بوابته الشرقية، وأعيد بناؤه حديثًا {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 69} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 70}."
