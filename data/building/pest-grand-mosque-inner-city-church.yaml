label: { ar: "الجامع الكبير في بِشت ⁦(كنيسة العذراء)⁩", en: "Grand Mosque of Pest (Inner City Church of the Virgin Mary)", fr: "Grande Mosquée de Pest (église de la Vierge Marie)", ur: "پیشت کی بڑی مسجد ⁦(کنواری مریم کا گرجا)⁩", es: "Gran Mezquita de Pest (Iglesia de la Virgen María en el centro de la ciudad)", tr: "Bişt'teki Büyük Cami (Meryem Ana Kilisesi)", id: "Masjid Agung di Bisht (Gereja Perawan Maria)" }
summary:
  ar: "كنيسة العذراء قرب جسر إليزابيث في بِشت، جُعلت بعد الفتح جامعاً باسم سليمان القانوني وأضيفت إليها مئذنة، وأعيدت كنيسة بعد العثمانيين، وما زال فيها محراب ونقش «الله، محمد، علي» {cite:yilmaz-ottoman-architecture-hungary-2024 p. 71}."
  en: "The church of the Virgin Mary by the Elizabeth Bridge in Pest, made a mosque in Süleyman's name after the conquest with an added minaret, a church again after Ottoman rule, still keeping a mihrab and a painted inscription 'Allah, Muhammad, Ali' {cite:yilmaz-ottoman-architecture-hungary-2024 p. 71}."
  fr: "Église de la Vierge Marie près du pont Élisabeth, convertie au nom de Soliman après la conquête avec ajout d’un minaret ; redevenue église après les Ottomans, elle conserve mihrab et inscription peinte « Allah, Muhammad, Ali » {cite:yilmaz-ottoman-architecture-hungary-2024 p. 71}"
  ur: "پیشت میں الزبتھ پل کے پاس کنواری مریم کا گرجا، فتح کے بعد سلیمان قانونی کے نام مسجد بنا اور مینار جوڑا گیا، عثمانی دور کے بعد پھر گرجا؛ اس میں اب بھی محراب اور «اللہ، محمد، علی» کی تحریر ہے {cite:yilmaz-ottoman-architecture-hungary-2024 p. 71}۔"
  es: "La iglesia de la Virgen María junto al puente de Isabel en Pest, convertida en mezquita en nombre de Süleyman después de la conquista con un minarete añadido, y de nuevo iglesia después del dominio otomano, conservando aún un mihrab y una inscripción pintada 'Allah, Muhammad, Ali' {cite:yilmaz-ottoman-architecture-hungary-2024 p. 71}."
  tr: "Bişt'teki Elizabeth Köprüsü yakınındaki Meryem Ana Kilisesi, Süleyman Yüce'nin adını taşıyan bir cami haline getirildi ve üzerine bir minare eklendi. Osmanlılardan sonra bir kilise restore edildi ve hâlâ bir mihrap ile \"Allah, Muhammed, Ali\" yazısı durmaktadır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 71}."
  id: "Gereja Perawan Maria dekat Jembatan Elizabeth di Bisht dijadikan masjid yang dinamai menurut Suleiman yang Agung, dan menara masjid ditambahkan di atasnya. Sebuah gereja dipugar setelah era Ottoman, dan masih memiliki mihrab serta tulisan \"Allah, Muhammad, Ali\" {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 71}."
