  ur: "لاہور میں میاں میر کے مزار کے لیے ڈرافٹ کارڈ، قادری شیخ کا مقبرہ جس نے گولڈن ٹیمپل کا سنگ بنیاد رکھا تھا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Lahor'daki Mian Mir türbesi için ön kart, Altın Tapınak'ın temel taşını atan Şeyh Qadri'nin türbesi; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk makam Mian Mir di Lahore, makam Sheikh Qadri yang meletakkan batu fondasi Kuil Emas; sumber-sumbernya di halaman belum ditinjau."
