summary:
  ar: "جامع عيسى بك بسلجوق قرب أفسس، وقف سنة 1375م/777هـ؛ من أوائل الجوامع الكبرى ذات فناء النافورة عند كوران {cite:kuran-mosque-early-ottoman pp.160,176}."
  en: "The Isa Bey Mosque of Selçuk near Ephesus, dedicated 1375/AH 777; one of the earliest great mosques with a fountain court in Kuran's account {cite:kuran-mosque-early-ottoman pp.160,176}."
  fr: "Mosquée Isa Bey de Selçuk près d’Éphèse, dédiée en 1375/777 H ; l’une des premières grandes mosquées à cour avec fontaine selon Kuran {cite:kuran-mosque-early-ottoman pp.160,176}."
  es: "La mezquita Isa Bey de Selçuk, cerca de Éfeso, dedicada en 1375/AH 777; una de las primeras grandes mezquitas con un patio con fuente en el relato del Corán {cite:kuran-mosque-early-ottoman pp.160,176}."
  ur: "Ephesus کے قریب Selçuk کی عیسیٰ بے مسجد، وقف 1375/ھ 777؛ قرآن کے کھاتے میں فاؤنٹین کورٹ والی قدیم ترین مساجد میں سے ایک"
  tr: "Selçuklu'da, Efes yakınlarında bulunan İsa Bey Camii, 1375 M.S. / 777 Hicri yılında kurulmuştur; Kuran yakınlarında çeşmeli avlusu olan en eski büyük camilerden biridir {atıf:kuran-caci-erken-osmanlı-s.160,176}."
  id: "Masjid Isa Bey di Seljuk dekat Efesus, didirikan pada tahun 1375 M / 777 H; ini adalah salah satu masjid besar tertua dengan halaman air mancur dekat Kuran {cite:kuran-mosque-early-ottoman hlm.160,176}."
