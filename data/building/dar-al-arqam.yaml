summary:
  ar: "دار الأرقم بن أبي الأرقم المخزومي على الصفا بمكة، اتخذها النبي مركزاً لدعوته ولاجتماعه بالمسلمين سراً من السنة الخامسة من النبوة."
  en: "The house of al-Arqam ibn Abi al-Arqam on al-Safa at Mecca, which the Prophet made the centre of his call and his meetings with the Muslims in secret from the fifth year of prophethood."
  fr: "La maison d’al-Arqam ibn Abi al-Arqam sur al-Safa à La Mecque, dont le Prophète fit le centre de son appel et de ses réunions secrètes avec les musulmans à partir de la cinquième année de la prophétie."
  es: "La casa de al-Arqam ibn Abi al-Arqam en al-Safa, en La Meca, que el Profeta convirtió en el centro de su llamado y de sus encuentros secretos con los musulmanes desde el quinto año de su profecía."
  ur: "مکہ میں الصفا پر ارقم ابن ابی ارقم کا گھر، جسے نبی نے اپنی دعوت کا مرکز بنایا اور نبوت کے پانچویں سال سے خفیہ طور پر مسلمانوں سے ملاقاتیں کیں۔"
  tr: "Mekke'deki Al-Safa bölgesindeki El-Arqam ibn Ebi Arakam el-Makhzumi'nin evi, Peygamber tarafından peygamberliğin beşinci yılında Müslümanlarla yaptığı çağrı ve gizli görüşmeler için bir merkez olarak yapılmıştır."
  id: "Rumah Al-Arqam ibn Abi Al-Arqam Al-Makhzumi di Al-Safa, Mekah dijadikan oleh Nabi sebagai pusat panggilan dan pertemuan rahasia dengan umat Muslim sejak tahun kelima kenabian."
