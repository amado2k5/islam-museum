summary:
  ar: "مجمع من الضريح والمسجد وقاعة الاستقبال وبوابة القوس والسور في حي هاجيغنج بنارايانغنج، يُنسب إلى أواخر القرن السابع عشر ويُعدّ مثالاً مغولياً في البنغال، وحاله اليوم متردٍّ."
  en: "A tomb, mosque, guest hall, arcade gate and enclosure wall in Hajiganj, Narayanganj, attributed to the late seventeenth century and described as a Mughal-style example in Bengal; now in poor condition."
  ur: "حاجی گنج، نارائن گنج میں ایک مقبرہ، مسجد، مہمان خانہ، محراب دار دروازہ اور احاطے کی دیوار؛ اسے سترہویں صدی کے اواخر سے منسوب کیا جاتا ہے، اور اس کی حالت اب خستہ ہے۔"
  es: "Una tumba, mezquita, sala de huéspedes, puerta con arcadas y muro de cerramiento en Hajiganj, Narayanganj, atribuidos a finales del siglo XVII y descritos como un ejemplo de estilo mogol en Bengala; actualmente en mal estado."
  fr: "Un tombeau, une mosquée, une salle des hôtes, une porte à arcades et un mur d'enceinte à Hajiganj, Narayanganj, attribués à la fin du XVIIe siècle et décrits comme un exemple de style moghol au Bengale; aujourd'hui en mauvais état."
  tr: "Narayangang'ın Hajigang bölgesinde, on yedinci yüzyılın sonlarına atfedilen türbe, cami, kabul salonu, kemer kapı ve duvar kompleksi, Bengal'de Babür örneği olarak kabul edilir, ancak bugün durumu kötüleşmektedir."
  id: "Kompleks makam, masjid, aula resepsi, gerbang lengkung, dan tembok di distrik Hajigang, Narayangang, yang dikaitkan dengan akhir abad ketujuh belas, dianggap sebagai contoh Mughal di Bengal, namun kondisinya saat ini semakin memburuk."
