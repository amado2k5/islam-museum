id: building/timurtas-mosque-istanbul
class: building
kind: mosque
label:
  ar: "جامع تيمورطاش، إسطنبول"
  en: "Timurtaş Mosque, Istanbul"
  fr: "Mosquée Timurtaş, Istanbul"
  es: "Mezquita de Timurtaş, Estambul"
  ur: "تیمورتاش مسجد، استنبول"
  tr: "Teymurtaş Camii, İstanbul"
  id: "Masjid Teymurtaş, Istanbul"
summary:
  ar: "توأم جامع سامان ورن تقريباً من عهد الفاتح؛ فوق طابق مقبو ومنارته المغلقة بلا شرفة تنفتح بأربع فتحات مسيجبة للمؤذن."
  en: "Near-twin of Samanveren Camii from Fatih's age; built over a vaulted ground floor, its enclosed balcony-less minaret has four grilled openings for the müezzin."
  fr: "Presque jumelle de Samanveren du temps de Fatih, sur rez-de-chaussée voûté ; minaret clos sans balcon, quatre baies grillées pour le muezzin."
  es: "Es casi idéntica a la Mezquita de Samanveren de la época de Fatih; construida sobre una planta baja abovedada, su minarete cerrado y sin balcón tiene cuatro aberturas enrejadas para el muecín."
  ur: "Fatih کی عمر سے Samanveren Camii کے قریب جڑواں؛ والٹڈ گراؤنڈ فلور پر بنایا گیا، اس کے منسلک بالکونی سے کم مینار میں موزین کے لیے چار گرل شدہ سوراخ ہیں۔"
  tr: "Aynı ve Şan Camii'nin ikizi olup, neredeyse fatih döneminden kalmadır; balkonsuz, kapalı minaresi olan tonozlu bir zeminin üzerinde, dört açıklıkla müezzin'e bakmaktadır."
  id: "Masjid ini merupakan kembar dari Masjid Saman dan Şan, hampir dari era sang penakluk; di atas lantai berkubah dengan menara tertutup tanpa balkon, terbuka dengan empat bukaan menghadap ke muezzin."
