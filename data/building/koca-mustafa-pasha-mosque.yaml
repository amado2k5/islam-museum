summary:
  ar: "بطاقة أولية لجامع خوجة مصطفى باشا بإسطنبول، دير كنيسة بيزنطية ⁦(يُقال أندراوس في كريسي)⁩ حُوّل مسجداً بعد الفتح في أواخر القرن الخامس عشر؛ من عمائر تحويل الأديرة في المدينة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Koca Mustafa Pasha Mosque of Istanbul, a Byzantine church-monastery (said to be St Andrew in Krisei) converted after the conquest in the late fifteenth century, per the cited survey; the page not yet checked."
  fr: "Notice provisoire : Mosquée de Koca Mustafa Pacha, Istanbul, église-monastère byzantine, identifiée à Saint-André-en-Krisei, convertie après la conquête à la fin du XVe siècle, selon l’étude citée. La page n’est pas encore vérifiée."
  es: "Ficha de borrador para la mezquita Koca Mustafa Pasha de Estambul, una iglesia-monasterio bizantino (que se dice que es San Andrés en Krisei) convertida después de la conquista a finales del siglo XV, según el estudio citado; la página aún no ha sido revisada."
  ur: "استنبول کی کوکا مصطفی پاشا مسجد کے لیے ڈرافٹ کارڈ، ایک بازنطینی چرچ-خانقاہ ⁦(جسے کریسی میں سینٹ اینڈریو کہا جاتا ہے)⁩ پندرہویں صدی کے آخر میں فتح کے بعد تبدیل کیا گیا، حوالہ کردہ سروے کے مطابق؛ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "İstanbul'daki Hoca Mustafa Paşa Camii için ön kart, 15. yüzyılın sonlarında fetih sonrası bir caminin etrafında Bizans kilise manastırı (Chrysis'te Andrew olarak adlandırılır) yer almaktadır; şehirdeki manastır dönüşüm binalarından biri ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Khoja Mustafa Pasha di Istanbul, sebuah biara gereja Bizantium (disebut Andrew in Chrysis) di sekitar masjid setelah penaklukan pada akhir abad ke-15; salah satu bangunan transformasi biara di kota dan halamannya belum ditinjau."
