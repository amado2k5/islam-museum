  ar: "بطاقة أولية لجامع امارة العتيق بإسطنبول، الكنيسة البيزنطية ⁦(المعروفة بكنيسة بانتيبوبتيس)⁩ التي حُوّلت إلى مسجد في العهد العثماني الباكر؛ تذكره مصادر تاريخ العمارة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for Eski Imaret Mosque in Istanbul, the Byzantine church identified with Pantepoptes that was converted to a mosque under the early Ottomans; per the cited architecture survey, the page not yet checked."
  fr: "Notice provisoire : Mosquée Eski Imaret d’Istanbul, église byzantine identifiée à Pantepoptes et convertie en mosquée sous les premiers Ottomans selon l’étude architecturale citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la mezquita Eski Imaret en Estambul, la iglesia bizantina asociada con Pantepopte que fue convertida en mezquita bajo el dominio otomano temprano; según el estudio arquitectónico citado, la página aún no ha sido revisada."
  ur: "استنبول میں Eski Imaret مسجد کے لیے ڈرافٹ کارڈ، بازنطینی چرچ کی شناخت پینٹی پوپٹس سے کی گئی تھی جسے ابتدائی عثمانیوں کے دور میں مسجد میں تبدیل کیا گیا تھا۔ حوالہ کردہ آرکیٹیکچر سروے کے مطابق، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
