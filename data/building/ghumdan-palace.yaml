summary:
  ar: "قصر غمدان بصنعاء؛ أشهر قصور اليمن القديمة بناه ليشرح بن يحصب على رواية الكلبي وهُدم في أيام عثمان {cite:mujam-al-buldan v4}."
  en: "Ghumdan palace of Sanaa, the most famous of ancient Yemen's palaces, built by Yashrah ibn Yahsub on al-Kalbi's account and demolished in Uthman's days {cite:mujam-al-buldan v4}."
  fr: "Palais de Ghumdan à Sanaa, le plus célèbre des palais de l’ancien Yémen, construit par Yashrah ibn Yahsub selon al-Kalbi et démoli au temps d’Uthman {cite:mujam-al-buldan v4}."
  es: "El palacio de Ghumdan de Sanaa, el más famoso de los palacios del antiguo Yemen, fue construido por Yashrah ibn Yahsub por encargo de al-Kalbi y demolido en tiempos de Uthman {cite:mujam-al-buldan v4}."
  ur: "صنعا کا گھمدان محل، قدیم یمن کے محلات میں سب سے مشہور، جسے یشرہ ابن یعسوب نے الکلبی کے حساب سے بنایا تھا اور عثمان کے زمانے میں منہدم کر دیا گیا تھا۔"
  tr: "Sana'a'daki Ghamdan Sarayı; eski Yemen'in en ünlü sarayı, El-Kalbi'nin rivayetine göre İbn Yahsub'u açıklamak için inşa edilmiş ve Osman zamanında yıkılmıştır {atıf:mucam-al-buldan v4}."
  id: "Istana Ghamdan di Sana'a; istana paling terkenal di Yaman kuno dibangun untuk menjelaskan Ibn Yahsub menurut narasi Al-Kalbi dan dihancurkan pada masa Uthman {cite:mujam-al-buldan v4}."
