summary:
  ar: "حمّام في حي الدباغين ⁦(تبان)⁩ ببودا بني في ستينيات القرن السادس عشر، اشتراه صوقوللي مصطفى باشا من قاضي بِشت مولانا حسن أفندي ووقفه، مرتب حول حوض مثمن، ويعرف اليوم بحمّام راتش {cite:yilmaz-ottoman-architecture-hungary-2024 p. 43}."
  en: "A bath in the tanners' quarter (Tabán) of Buda built in the 1560s, bought by Sokollu Mustafa Pasha from the Pest qadi Mevlana Hasan Efendi and endowed, laid out round an octagonal pool, now the Rác Bath {cite:yilmaz-ottoman-architecture-hungary-2024 p. 43}."
  fr: "Bains des années 1560 au quartier des tanneurs Tabán, achetés au cadi Mevlana Hasan Efendi de Pest et dotés par Sokollu Mustafa Pacha, autour d’un bassin octogonal ; actuels bains Rác. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 43}"
  ur: "بودا کے دباغوں کے محلے ⁦(تابان)⁩ میں 1560 کی دہائی کا حمام، جسے صوقوللو مصطفیٰ پاشا نے پیشت کے قاضی مولانا حسن آفندی سے خرید کر وقف کیا؛ ہشت پہلو حوض کے گرد، آج راچ حمام {cite:yilmaz-ottoman-architecture-hungary-2024 p. 43}۔"
  es: "Un baño en el barrio de los curtidores (Tabán) de Buda construido en la década de 1560, comprado por Sokollu Mustafa Pasha al cadí de Pest, Mevlana Hasan Efendi, y dotado, dispuesto alrededor de una piscina octogonal, ahora el Baño Rác {cite:yilmaz-ottoman-architecture-hungary-2024 p. 43}."
  tr: "Buda'nın Teban (Tabakhane) semtinde 1660'larda bir hamam inşa edildi; Soqolli Mustafa Paşa tarafından Bişt Kazı Mawlana Hassan Effendi'den satın alındı ve bu vakıf edildi. Sekizgen bir havuz etrafında düzenlenmiştir ve bugün Bath Rach olarak bilinmektedir {cite:yilmaz-ottoman-architecture-hungary-2024, s. 43}."
  id: "Sebuah pemandian di distrik Penyamakan Kulit (Teban) Buda dibangun pada tahun 1660-an, dibeli oleh Soqolli Mustafa Pasha dari Qazi Bisht, Mawlana Hassan Effendi, dan diberikan bakat. Pemandian ini disusun mengelilingi cekungan segi delapan, dan saat ini dikenal sebagai Bath Rach {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 43}."
