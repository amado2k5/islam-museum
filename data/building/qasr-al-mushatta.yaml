label: { ar: "قصر المشتى", en: "Qasr al-Mushatta", fr: "Qasr al-Mushatta", es: "Qasr al-Mushatta", ur: "قصر المشتہ", tr: "Al-Mushta Sarayı", id: "Istana Al-Mushta" }
summary:
  ar: "قصر صحراوي غير تام البناء، يُنسب إلى الخليفة الوليد بن يزيد بن عبد الملك ⁦(125–126هـ)⁩، وقد تهدم معظمه. نُقلت أهم زخارف واجهته الجنوبية المنحوتة في الحجر الجيري إلى برلين، إذ أهداها السلطان العثماني عبد الحميد إلى الإمبراطور الألماني غليوم الثاني، ووُضعت في متحف برلين من سنة 1903م. وصف الكتاب تخطيطه: بناء مستطيل تكتنفه أبراج نصف دائرية، ومدخل يفضي إلى فناء، ثم فناء أكبر يليه الجناح الملكي وقاعة العرش ذات الحنيات الثلاث، ويرى الباحثون أن إحدى الحجرات كانت مسجد القصر {cite:umayyad-birth-to-fall-2006 p. 160}{cite:umayyad-birth-to-fall-2006 p. 161}."
  en: "A desert palace, unfinished in its construction, attributed to the caliph al-Walid ibn Yazid ibn Abd al-Malik (125-126 AH), most of which has collapsed. The most important of the carved decorations of its southern façade, carved in limestone, was taken to Berlin: the Ottoman sultan Abdulhamid gave it to the German emperor Wilhelm II, and it has been in the Berlin Museum since 1903. The book describes its plan: a rectangular building flanked by semicircular towers, an entrance leading to a courtyard, then a larger courtyard followed by the royal wing and a throne hall with three niches; researchers consider one of the rooms to have been the palace mosque {cite:umayyad-birth-to-fall-2006 p. 160}{cite:umayyad-birth-to-fall-2006 p. 161}."
  fr: "Palais du désert inachevé et largement effondré, attribué à al-Walid ibn Yazid ibn Abd al-Malik (125–126 H). Les principales sculptures de calcaire de la façade sud furent offertes par Abdülhamid à Guillaume II et sont au musée de Berlin depuis 1903. Plan décrit : rectangle à tours semi-circulaires, entrée vers une cour puis une plus grande, aile royale et salle du trône à trois niches ; une pièce serait la mosquée palatiale {cite:umayyad-birth-to-fall-2006 p. 160} {cite:umayyad-birth-to-fall-2006 p. 161}"
  es: "Un palacio en el desierto, de construcción inacabada, atribuido al califa al-Walid ibn Yazid ibn Abd al-Malik (125-126 AH), la mayor parte del cual se ha derrumbado. La más importante de las decoraciones talladas de su fachada sur, esculpida en piedra caliza, fue llevada a Berlín: el sultán otomano Abdulhamid se la regaló al emperador alemán Guillermo II, y se encuentra en el Museo de Berlín desde 1903. El libro describe su planta: un edificio rectangular flanqueado por torres semicirculares, una entrada que conduce a un patio, luego un patio más grande seguido del ala real y una sala del trono con tres nichos; los investigadores consideran que una de las habitaciones era la mezquita del palacio {cite:umayyad-birth-to-fall-2006 p. 160}{cite:umayyad-birth-to-fall-2006 p. 161}."
  ur: "ایک صحرائی محل، اپنی تعمیر میں نامکمل، خلیفہ الولید ابن یزید ابن عبد الملک ⁦(125-126 ہجری)⁩ سے منسوب ہے، جس کا بیشتر حصہ منہدم ہو چکا ہے۔ چونے کے پتھر میں کھدی ہوئی اس کے جنوبی اگواڑے کی سب سے اہم سجاوٹ کو برلن لے جایا گیا: عثمانی سلطان عبدالحمید نے اسے جرمن شہنشاہ ولہیم دوم کو دیا، اور یہ 1903 سے برلن کے عجائب گھر میں موجود ہے۔ کتاب اس کے منصوبے کی وضاحت کرتی ہے: ایک مستطیل عمارت جس کے پیچھے ایک صحن کی طرف سیمیکیولر، ایک صحن کی طرف لے جایا گیا تھا۔ بڑا صحن جس کے بعد شاہی بازو اور تین طاقوں کے ساتھ ایک تخت ہال۔ محققین ان کمروں میں سے ایک کو محل کی مسجد سمجھتے ہیں 160}{حوالہ:امیاد-پیدائش سے زوال-2006 صفحہ۔ 161}۔"
  tr: "Halife al-Walid ibn Yazid ibn Abd al-Malik'e (125–126 Hicri) atfedilen tamamlanmamış bir çöl sarayı, çoğu yıkılmıştır. Güney cephesinin en önemli süslemeleri, kireçtaşından oyulmuş olup, Berlin'e taşınmış, Sultan Abdul Hamid tarafından Alman İmparatoru II. William'a hediye edilmiş ve 1903'te Berlin Müzesi'ne yerleştirilmiştir. Kitap, yerleşimini anlatmıştır: yarım daire kulelerle çevrili dikdörtgen bir bina, bir avluya açılan bir giriş, ardından kraliyet kanadı ve üç nişli taht salonu. Araştırmacılar, odalardan birinin saray camisi olduğuna inanmaktadır {cite:umayyad-birth-to-fall-2006 s. 160}{cite:umayyad-birth-to-fall-2006 s. 161}."
  id: "Sebuah istana gurun yang belum selesai, yang dikaitkan dengan Khalifah al-Walid ibn Yazid ibn Abd al-Malik (125–126 H), sebagian besar telah dihancurkan. Dekorasi terpenting dari fasad selatannya, yang dipahat dari batu kapur, dipindahkan ke Berlin, di mana Sultan Abdul Hamid memberikannya kepada Kaisar Jerman William II dan ditempatkan di Museum Berlin pada tahun 1903. Buku tersebut menggambarkan tata letaknya: sebuah bangunan persegi panjang yang dikelilingi oleh menara setengah lingkaran, pintu masuk menuju halaman, kemudian halaman yang lebih besar diikuti oleh sayap kerajaan dan aula tahta dengan tiga ceruk. Para peneliti percaya bahwa salah satu kamar tersebut adalah masjid istana {cite:umayyad-birth-to-fall-2006 hlm. 160}{cite:umayyad-birth-to-fall-2006 hlm. 161}."
