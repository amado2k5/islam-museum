label: { ar: "قصر المشتى", en: "Qasr al-Mushatta" }
summary:
  ar: "قصر صحراوي غير تام البناء، يُنسب إلى الخليفة الوليد بن يزيد بن عبد الملك (125–126هـ)، وقد تهدم معظمه. نُقلت أهم زخارف واجهته الجنوبية المنحوتة في الحجر الجيري إلى برلين، إذ أهداها السلطان العثماني عبد الحميد إلى الإمبراطور الألماني غليوم الثاني، ووُضعت في متحف برلين من سنة 1903م. وصف الكتاب تخطيطه: بناء مستطيل تكتنفه أبراج نصف دائرية، ومدخل يفضي إلى فناء، ثم فناء أكبر يليه الجناح الملكي وقاعة العرش ذات الحنيات الثلاث، ويرى الباحثون أن إحدى الحجرات كانت مسجد القصر {cite:umayyad-birth-to-fall-2006 p. 160}{cite:umayyad-birth-to-fall-2006 p. 161}."
  en: "A desert palace, unfinished in its construction, attributed to the caliph al-Walid ibn Yazid ibn Abd al-Malik (125-126 AH), most of which has collapsed. The most important of the carved decorations of its southern façade, carved in limestone, was taken to Berlin: the Ottoman sultan Abdulhamid gave it to the German emperor Wilhelm II, and it has been in the Berlin Museum since 1903. The book describes its plan: a rectangular building flanked by semicircular towers, an entrance leading to a courtyard, then a larger courtyard followed by the royal wing and a throne hall with three niches; researchers consider one of the rooms to have been the palace mosque {cite:umayyad-birth-to-fall-2006 p. 160}{cite:umayyad-birth-to-fall-2006 p. 161}."
