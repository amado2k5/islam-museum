summary:
  ar: "قصر بالعراق قريب النيل بأرض الأزير على نهر سنداد، كان مسكن آل محرق؛ وفيه قال الأسود بن يعفر قصيدته المشهورة «ما ذا أومل بعد آل محرق تركوا منازلهم وبعد إياد؟ أهل الخورنق والسدير ومأرب والقصر ذي الشرفات من سنداد» {cite:umari-masalik-1924 p. 229}."
  en: "The palace of Iraq near al-Nil on the Sindad river in al-Uzayr's land, seat of the Al Muharriq; for it al-Aswad ibn Ya'fur made his famous elegy — 'what can I hope for after the house of Muharriq left their dwellings, and after Iyad? — the folk of al-Khawarnaq and al-Sadir, of Marib and the balconied palace of Sindad' {cite:umari-masalik-1924 p. 229}."
