summary:
  ar: "قصر بالعراق قريب النيل بأرض الأزير على نهر سنداد، كان مسكن آل محرق؛ وفيه قال الأسود بن يعفر قصيدته المشهورة «ما ذا أومل بعد آل محرق تركوا منازلهم وبعد إياد؟ أهل الخورنق والسدير ومأرب والقصر ذي الشرفات من سنداد» {cite:umari-masalik-1924 p. 229}."
  en: "The palace of Iraq near al-Nil on the Sindad river in al-Uzayr's land, seat of the Al Muharriq; for it al-Aswad ibn Ya'fur made his famous elegy — 'what can I hope for after the house of Muharriq left their dwellings, and after Iyad? — the folk of al-Khawarnaq and al-Sadir, of Marib and the balconied palace of Sindad' {cite:umari-masalik-1924 p. 229}."
  fr: "Palais d’Irak près d’al-Nil sur le Sindad, terres d’al-Uzayr, siège des Al Muharriq ; al-Aswad ibn Ya’fur composa sa célèbre élégie : que reste-t-il à espérer après le départ des maisons de Muharriq et Iyad, gens d’al-Khawarnaq, al-Sadir, Ma’rib et du palais à balcons de Sindad {cite:umari-masalik-1924 p. 229}"
  es: "El palacio de Irak cerca de al-Nil en el río Sindad en la tierra de al-Uzayr, sede de Al Muharriq; para él al-Aswad ibn Ya'fur escribió su famosa elegía: «¿Qué puedo esperar después de que la casa de Muharriq abandonara sus moradas, y después de Iyad? — la gente de al-Khawarnaq y al-Sadir, de Marib y el palacio balconado de Sindad» {cite:umari-masalik-1924 p. 229}."
