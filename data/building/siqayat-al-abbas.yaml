label: { ar: "سقاية العباس بن عبد المطلب بالمسجد الحرام", en: "Siqaya of al-Abbas ibn Abd al-Muttalib, Masjid al-Haram", fr: "Siqaya d’al-Abbas ibn Abd al-Muttalib, Masjid al-Haram", ur: "سقایۂ عباس بن عبدالمطلب، مسجد حرام", es: "Siqaya de al-Abbas ibn Abd al-Muttalib, Masjid al-Haram", tr: "El-Abbas bin Abdülmuttalib'in Mescami Büyük Su Kaynağı", id: "Pasokan air Al-Abbas ibn Abdul Muttalib di Masjid Agung" }
summary:
  ar: "سقاية بين بئر زمزم والكعبة، عمرت في خلافة المهدي العباسي ⁦(158-169هـ)⁩ وجُددت مراراً، يعدّها الحداد طرازاً فريداً في عمارة الأسبلة {cite:haddad-asbila-makka-madina-2004 p.18} {cite:haddad-asbila-makka-madina-2004 p.52}."
  en: "A water house between the well of Zamzam and the Kaaba, built under the Abbasid caliph al-Mahdi (158-169 AH) and repeatedly renewed, which al-Haddad counts a unique type of sabil {cite:haddad-asbila-makka-madina-2004 p.18} {cite:haddad-asbila-makka-madina-2004 p.52}."
  fr: "Maison d’eau entre Zamzam et Kaaba, bâtie sous al-Mahdi, 158–169 H, souvent renouvelée, type unique de sabil selon al-Haddad. {cite:haddad-asbila-makka-madina-2004 p.18} {cite:haddad-asbila-makka-madina-2004 p.52}"
  es: "Una casa de agua entre el pozo de Zamzam y la Kaaba, construida bajo el califa abasí al-Mahdi (158-169 d. H.) y renovada repetidamente, que al-Haddad considera un tipo único de sabil {cita:haddad-asbila-makka-madina-2004 p.18} {cita:haddad-asbila-makka-madina-2004 p.52}."
  ur: "زمزم اور کعبہ کے درمیان ایک آبی گھر جو عباسی خلیفہ المہدی ⁦(158-169 ہجری)⁩ کے دور میں تعمیر کیا گیا اور بار بار تجدید کیا گیا، جسے الحداد نے سبیل کی ایک منفرد قسم شمار کیا ہے۔ صفحہ 52}۔"
  tr: "Zamzam kuyusu ile Kabe arasında, el-Mehdi el-Abbasi (158-169 H) halifeliği sırasında inşa edilmiş ve defalarca yenilenmiş bir su çeşmesi. Al-Haddad, bunu sabils mimarisinde benzersiz bir stil olarak kabul eder {cite:haddad-asbila-makka-madina-2004 s.18} {cite:haddad-asbila-makka-medina-2004 s.52}."
  id: "Sebuah air mancur di antara sumur Zamzam dan Ka'bah, dibangun pada masa kekhalifahan al-Mahdi al-Abbasi (158-169 H) dan telah direnovasi berulang kali. Al-Haddad menganggapnya sebagai gaya unik dalam arsitektur sabil {cite:haddad-asbila-makka-madina-2004 hlm.18} {cite:haddad-asbila-makka-madina-2004 hlm.52}."
