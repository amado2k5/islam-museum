summary:
  ar: "«مسجد الثلاثة محاريب» أسسه خواجة خير الدين 1475م ووسعه الفاتح ثم زوجة ابن الباني حتى صار ثلاثة محاريب؛ قبة على أسطوانة مثلثية عمياء."
  en: "The 'Mosque with Three Mihrabs', founded by Hoca Hayrettin in 1475, enlarged by Fatih and the founder's daughter-in-law till it had three mihrabs; dome on a high blind triangular-worked drum."
  fr: "La mosquée aux trois mihrabs, fondée par Hoca Hayrettin en 1475, agrandie par Fatih puis par la belle-fille du fondateur jusqu’à compter trois mihrabs ; coupole sur haut tambour aveugle traité en triangles."
  es: "La 'Mezquita de los Tres Mihrabs', fundada por Hoca Hayrettin en 1475, fue ampliada por Fatih y la nuera del fundador hasta tener tres mihrabs; la cúpula se asienta sobre un alto tambor triangular ciego trabajado."
  ur: "1475 میں Hoca Hayrettin کی طرف سے قائم 'تین محرابوں والی مسجد'، جسے فاتح اور بانی کی بہو نے بڑھایا یہاں تک کہ اس کے تین محراب تھے۔ ایک اونچے اندھے تکون سے کام کرنے والے ڈھول پر گنبد۔"
  tr: "'Üç Mihrib Camii', 1475 yılında Khawaja Khair al-Din tarafından kurulmuş ve fatih, ardından İbn al-Bani'nin eşi tarafından genişletilerek üç mihraba dönüşmüştür; kör üçgen silindir üzerinde bir kubbe."
  id: "'Tiga Masjid Mihrib' didirikan oleh Khawaja Khair al-Din pada tahun 1475 M dan diperluas oleh penakluk lalu istri Ibn al-Bani hingga menjadi tiga mihrab; sebuah kubah di atas silinder segitiga buta."
