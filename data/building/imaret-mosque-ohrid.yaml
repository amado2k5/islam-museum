summary:
  ar: "جامع من القرن الخامس عشر بناه سنان چلبي على تل العمارة في أوهريد، وقفيته مؤرخة 896هـ/1491، قام فوق أطلال كنيسة القديس بانتيليمون، هُدم أكثره سنة 1999 وقامت في موضعه كنيسة القديسين كليمنت وبانتيليمون {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  en: "A fifteenth-century mosque built by Sinan Çelebi on Imaret Hill in Ohrid, with an endowment deed of AH 896/1491, standing over the ruins of the church of St Panteleimon; largely demolished in 1999, its site is now the church of Sts Clement and Panteleimon {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  ur: "اوہرید میں عمارت ٹیلے پر سنان چلبی کی بنوائی پندرھویں صدی کی مسجد، 896ھ/1491ء کا وقف نامہ، سینٹ پینٹیلیمون گرجا کے کھنڈر پر قائم؛ 1999ء میں بیشتر ڈھا دی گئی اور اب اس جگہ سینٹ کلیمنٹ و پینٹیلیمون کا گرجا ہے {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}۔"
