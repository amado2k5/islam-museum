label: { ar: "جامع العمارة ⁦(جامع الفاتح)⁩ في أوهريد", en: "Imaret (Fatih Sultan Mehmed) Mosque, Ohrid", fr: "Mosquée Imaret (Fatih Sultan Mehmed), Ohrid", ur: "عمارت ⁦(فاتح سلطان محمد)⁩ مسجد، اوہرید", es: "Mezquita Imaret (Fatih Sultan Mehmed), Ohrid", tr: "Ohrid'deki El-Amara Camii (El-Fateh Camii)", id: "Masjid Al-Amara (Masjid Al-Fateh) di Ohrid" }
summary:
  ar: "جامع من القرن الخامس عشر بناه سنان چلبي على تل العمارة في أوهريد، وقفيته مؤرخة 896هـ/1491، قام فوق أطلال كنيسة القديس بانتيليمون، هُدم أكثره سنة 1999 وقامت في موضعه كنيسة القديسين كليمنت وبانتيليمون {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  en: "A fifteenth-century mosque built by Sinan Çelebi on Imaret Hill in Ohrid, with an endowment deed of AH 896/1491, standing over the ruins of the church of St Panteleimon; largely demolished in 1999, its site is now the church of Sts Clement and Panteleimon {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  fr: "Mosquée du XVe siècle construite par Sinan Çelebi sur la colline d’Imaret à Ohrid, avec un acte de fondation de 896 H/1491, sur les ruines de l’église Saint-Pantéleimon ; largement démolie en 1999, son emplacement accueille aujourd’hui l’église Saints-Clément-et-Pantéleimon {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  ur: "اوہرید میں عمارت ٹیلے پر سنان چلبی کی بنوائی پندرھویں صدی کی مسجد، 896ھ/1491ء کا وقف نامہ، سینٹ پینٹیلیمون گرجا کے کھنڈر پر قائم؛ 1999ء میں بیشتر ڈھا دی گئی اور اب اس جگہ سینٹ کلیمنٹ و پینٹیلیمون کا گرجا ہے {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}۔"
  es: "Una mezquita del siglo XV construida por Sinan Çelebi en la colina Imaret en Ohrid, con una escritura de donación de AH 896/1491, que se alza sobre las ruinas de la iglesia de San Panteleimón; demolida en gran parte en 1999, su sitio ahora es la iglesia de los Santos Clemente y Panteleimón {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 387}."
  tr: "Sinan Çelebi tarafından Ohrid'deki Tell Al-Amara'da inşa edilmiş 15. yüzyıldan kalma bir camidir ve vakıf 896 Hicri / 1491 M.S. tarihlidir. Aziz Panteleimon Kilisesi'nin kalıntılarının üzerine inşa edilmiştir, çoğu 1999'da yıkılmış ve yerine Aziz Klement ve Panteleimon Kilisesi (cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 387} yapılmıştır."
  id: "Sebuah masjid abad ke-15 yang dibangun oleh Sinan Çelebi di Tell Al-Amara, Ohrid, dengan dana bertanggal 896 H / 1491 M. Masjid ini dibangun di atas reruntuhan Gereja Santo Panteleimon, sebagian besar dihancurkan pada tahun 1999, dan di tempatnya terdapat Gereja Santo Klemens dan Panteleimon {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 386} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 387}."
