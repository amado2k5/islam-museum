summary:
  ar: "بطاقة أولية لمسجد مختاروف بفلاديقفقاز، الجامع الذي بناه التاجر التتري مرتضى مختاروف على الطراز القاهري أوائل القرن العشرين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Mukhtarov Mosque of Vladikavkaz, the early-twentieth-century mosque built by the Tatar merchant Murtaza Mukhtarov in Cairene style; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée de Mukhtarov, Vladikavkaz, mosquée du début du XXe siècle bâtie dans le style cairote par le marchand tatar Murtaza Mukhtarov. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la Mezquita Mukhtarov de Vladikavkaz, mezquita de principios del siglo XX construida por el comerciante tártaro Murtaza Mukhtarov en estilo cairota; sus fuentes aún no han sido verificadas en la página."
  ur: "ولادیکاوکاز کی مختاروف مسجد کے لیے ڈرافٹ کارڈ، بیسویں صدی کے اوائل میں تاتاری تاجر مرتضیٰ مختاروف کی طرف سے کیرین کے انداز میں تعمیر کردہ مسجد؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Vladikavkaz'daki Muhtarov Camii'nin ön kartı; Tatar tüccar Murtada Mukhtarov tarafından 20. yüzyıl başlarında Kahire tarzında inşa edilen camii; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Mukhtarov di Vladikavkaz, masjid yang dibangun oleh pedagang Tatar Murtada Mukhtarov dalam gaya Kairo awal abad ke-20; sumber-sumbernya di halaman belum ditinjau."
