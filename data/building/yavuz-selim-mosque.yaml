summary:
  ar: "بطاقة أولية لمسجد ياووز سليم بإسطنبول، الجامع السلطاني على التل الخامس المنسوب إلى سليم الأول وأُتم في عهد سليمان؛ من معالم العمارة العثمانية الكلاسيكية الباكرة كما تذكرها المصادر ولم تُراجع الصفحة بعد."
  en: "Draft card for the Yavuz Selim Mosque on Istanbul's fifth hill, the sultanic mosque associated with Selim I and finished under Suleiman; an early landmark of classical Ottoman architecture per the cited survey, the page not yet checked."
  fr: "Notice provisoire de la mosquée de Selim Ier sur la cinquième colline, achevée sous Soliman ; monument classique ottoman précoce selon l’étude citée, page non encore vérifiée."
  es: "Boceto de la Mezquita Yavuz Selim en la quinta colina de Estambul, la mezquita sultánica asociada con Selim I y terminada bajo el reinado de Solimán; un hito temprano de la arquitectura otomana clásica según el estudio citado, página aún no verificada."
  ur: "استنبول کی پانچویں پہاڑی پر واقع یاوز سلیم مسجد کے لیے ڈرافٹ کارڈ، جو سلیمان اول سے منسلک اور سلیمان کے تحت ختم ہونے والی سلطانی مسجد؛ حوالہ کردہ سروے کے مطابق کلاسیکی عثمانی فن تعمیر کا ایک ابتدائی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'daki Yavuz Selim Camii için ön kart, Süleyman döneminde tamamlanan ve Selim I'e atfedilen beşinci höyükteki Sultan Camii'nin ön kartı; kaynaklarda ve sayfada belirtilen erken klasik Osmanlı mimari yapılarından biridir."
  id: "Kartu pendahuluan untuk Masjid Yavuz Selim di Istanbul, Masjid Sultan di gundukan kelima yang dikaitkan dengan Selim I dan selesai pada masa pemerintahan Suleiman; salah satu landmark arsitektur klasik awal Ottoman seperti yang disebutkan dalam sumber dan halaman tersebut belum ditinjau."
