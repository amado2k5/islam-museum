summary:
  ar: "غالباً أقدم مسجد في المدينة، أسسه 1455م ياووز أرسينان حامل راية الفاتح وجد إوليا جلبي الذي ولد في البيت الملاصق؛ بجواره قبر خروز دده."
  en: "Probably Istanbul's oldest mosque, founded 1455 by Yavuz Ersinan, Fatih's standard-bearer and ancestor of Evliya Çelebi, born in the adjoining house; beside it the folk-saint Horoz Dede's grave."
  fr: "Probablement la plus ancienne mosquée d’Istanbul, fondée en 1455 par Yavuz Ersinan, porte-étendard de Fatih et ancêtre d’Evliya Çelebi né dans la maison voisine ; tombe du saint populaire Horoz Dede à côté."
  es: "Probablemente la mezquita más antigua de Estambul, fundada en 1455 por Yavuz Ersinan, portaestandarte de Fatih y antepasado de Evliya Çelebi, nacido en la casa contigua; junto a ella se encuentra la tumba del santo popular Horoz Dede."
  ur: "غالباً استنبول کی سب سے قدیم مسجد، جس کی بنیاد 1455 میں یاوز ایرسینان نے رکھی تھی، فاتح کے معیار کے علمبردار اور ایولیا چیلیبی کے آباؤ اجداد، ملحقہ گھر میں پیدا ہوئے تھے۔ اس کے ساتھ ہی لوک سنت ہوروز ڈیڈے کی قبر ہے۔"
  tr: "Muhtemelen şehrin en eski camisi, 1455 yılında fatih ve Ulya Çelebi'nin büyükbabası Yavuz Arsinan tarafından kurulmuştur; yanında Khoroz Dede'nin türbesi bulunmaktadır."
  id: "Kemungkinan masjid tertua di kota ini, didirikan pada tahun 1455 M oleh Yavuz Arsinan, pembawa panji penakluk dan kakek Ulya Çelebi, yang lahir di rumah sebelah; di sebelahnya terdapat makam Khoroz Dede."
