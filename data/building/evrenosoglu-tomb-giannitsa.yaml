label: { ar: "ضريح آل أفرنوس في يڭيجه وردار ⁦(يانيتسا)⁩", en: "Evrenosoğlu Tomb, Giannitsa", ur: "اورنوس اوغلو مقبرہ، یانیتسا" }
summary:
  ar: "ضريح مربع بقبة على رقبة مثمنة من القرن الخامس عشر في يڭيجه وردار ⁦(يانيتسا)⁩، أحسن الآثار العثمانية حفظاً في المدينة، ينسبه هيث لوري إلى علي بك أو يعقوب بك من آل أفرنوس، حُوّل كنيسة القديسة باراسكيفي سنة 1948 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1340} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1341}."
  en: "A fifteenth-century square tomb with a dome on an octagonal drum at Giannitsa (Yenice-i Vardar), the best-preserved Ottoman monument in the town, ascribed by Heath Lowry to Ali Bey or Yakub Bey of the Evrenos family, made the church of St Paraskevi in 1948 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1340} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1341}."
  ur: "یانیتسا (ینیجۂ وردار) میں پندرھویں صدی کا مربع مقبرہ جس کا گنبد ہشت پہلو گردن پر ہے، شہر کی سب سے محفوظ عثمانی یادگار؛ ہیتھ لاؤری اسے اورنوس خاندان کے علی بے یا یعقوب بے سے منسوب کرتے ہیں؛ 1948ء میں سینٹ پاراسکیوی گرجا بنا {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1341}۔"
