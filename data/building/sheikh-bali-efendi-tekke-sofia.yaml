summary:
  ar: "زاوية من جامع وتكية وعمارة وضريح في صالحية ⁦(كنيازيفو)⁩ بصوفيا، بناها قاضي صوفيا عبد الرحمن أفندي سنة 960هـ/1553 للشيخ البيرامي بالي أفندي؛ هُدمت مبانيها سنة 1879 وبُنيت مكان الجامع كنيسة النبي إيليا سنة 1893، وبقي الضريح يزوره المسلمون والمسيحيون {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 156} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 157}."
  en: "A zawiya of mosque, lodge, imaret and tomb at Salihiye (Knyazhevo) in Sofia, built by the Sofia qadi Abd al-Rahman Efendi in AH 960/1553 for the Bayrami shaykh Bali Efendi; its buildings were demolished in 1879 and the church of the Prophet Elijah built on the mosque's site in 1893, while the tomb, visited by Muslims and Christians, survives {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 156} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 157}."
  ur: "صوفیہ کے صالحیہ ⁦(کنیازیوو)⁩ میں مسجد، تکیہ، عمارت اور مزار پر مشتمل زاویہ جو قاضیِ صوفیہ عبدالرحمن آفندی نے 960ھ/1553ء میں بیرامی شیخ بالی آفندی کے لیے بنوایا؛ 1879ء میں عمارتیں ڈھائی گئیں اور 1893ء میں مسجد کی جگہ پیغمبر الیاس کا گرجا بنا؛ مزار باقی ہے {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 157}۔"
