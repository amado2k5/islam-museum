label:
  ar: "جامع إبراهيم باشا، إسطنبول"
  en: "İbrahim Pasha Mosque, Istanbul"
  fr: "Mosquée İbrahim Pasha, Istanbul"
  es: "Mezquita de Ibrahim Pasha, Estambul"
  ur: "ابراہیم پاشا مسجد، استنبول"
  tr: "İbrahim Paşa Camii, İstanbul"
  id: "Masjid Ibrahim Pasha, Istanbul"
summary:
  ar: "بحسب حديقة الجوامع أسسه 1478م جندرلي إبراهيم باشا وزير بايزيد الثاني الأعظم؛ فقد ملحقاته وهدم كثيراً ورُمم في الستينات."
  en: "Per the Hadikat-ül Cevami founded in A.H. 883 (1478) by Çandarlı İbrahim Pasha, Beyazit II's grand vezir; its medrese/mektep/hamam lost, the mosque long ruined then restored in the 1960s."
  fr: "Selon le Hadikat-ül Cevami, fondée en 883 H (1478) par Çandarlı İbrahim Pasha, grand vizir de Beyazit II ; medrese, mektep et hammam disparus, mosquée longtemps ruinée puis restaurée dans les années 1960."
  es: "Según el Hadikat-ül Cevami, fundado en el año 883 de la Hégira (1478) por Çandarlı İbrahim Pasha, gran vezir de Beyazit II; su madraza/mektep/hamam se perdió, la mezquita estuvo en ruinas durante mucho tiempo y luego fue restaurada en la década de 1960."
  ur: "حدیث ال سیوامی کے مطابق 883 ہجری (1478) میں چاندرلی ابراہیم پاشا کی طرف سے قائم کیا گیا تھا، بیاضیت II کے عظیم وزیر؛ اس کا میڈریس/مکتپ/حمام کھو گیا، مسجد طویل عرصے سے تباہ ہو گئی پھر 1960 کی دہائی میں بحال ہوئی۔"
  tr: "Camiler Bahçesi'ne göre, 1478 yılında Bayezid II'nin veziri Jandarlı İbrahim Paşa tarafından kurulmuştur; ek binaları kaybolmuş, birçoğu yıkılmış ve 1960'larda yenilenmiştir."
  id: "Menurut Taman Masjid, taman ini didirikan pada tahun 1478 M oleh Jandarli Ibrahim Pasha, wazir Bayezid II yang Agung; aneks-aneksnya hilang, banyak yang dihancurkan, dan direnovasi pada tahun 1960-an."
