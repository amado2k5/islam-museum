summary:
  ar: "دير على جبل الطور المستدير المتسع أسفله الذي لا يتعلق به شيء من الجبال بين طبرية والجون، مشرف على الغور والمرج وطبرية، فيه عين غزيرة ودير مبني بالحجر في القبلة وحوله كروم كثيرة يعتصرونها؛ ويعرف بدير التجلى لأنهم يزعمون أن عيسى تجلى فيه لتلامذته {cite:umari-masalik-1924 p. 337}."
  en: "The monastery on Mount al-Tur — a round mountain broad at its foot between Tiberias and al-Jun overlooking the Ghor and the meadow — stone-built with an abundant spring and many pressed vineyards; called Dayr al-Tajalli, for they hold that Isa was transfigured there before his disciples {cite:umari-masalik-1924 p. 337}."
  fr: "Monastère du mont al-Tur, montagne ronde à large base entre Tibériade et al-Jun dominant le Ghor et la prairie ; construit de pierre avec une source abondante et de nombreux vignobles dont on presse le raisin ; appelé Dayr al-Tajalli parce que l’on y situe la transfiguration de Jésus devant ses disciples {cite:umari-masalik-1924 p. 337}."
