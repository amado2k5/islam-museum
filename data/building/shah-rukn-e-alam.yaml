summary:
  ar: "بطاقة أولية لضريح شاه ركن عالم بملتان، الضريح السلطاني الثماني الذي يُعَدّ أول مثل لعمارة تغلق؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Tomb of Shah Rukn-e-Alam at Multan, the octagonal sultanic tomb held as the first model of Tughluq architecture; its sources are not yet checked on the page."
  fr: "Notice provisoire : Tombeau de Shah Rukn-e-Alam à Multan, tombeau sultanien octogonal considéré comme le premier modèle de l’architecture tughluq. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la tumba de Shah Rukn-e-Alam en Multan, la tumba sultánica octogonal considerada el primer modelo de la arquitectura Tughluq; sus fuentes aún no han sido verificadas en la página."
  ur: "ملتان میں شاہ رکن عالم کے مقبرے کے لیے ڈرافٹ کارڈ، تغلق فن تعمیر کے پہلے نمونے کے طور پر رکھے جانے والے آکٹونل سلطانی مقبرے؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Multan'daki Şah Rukn Alam türbesi için ön kart, sekizinci kraliyet türbesi, kapalı mimarinin ilk örneği olarak kabul edilir; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk makam Shah Rukn Alam di Multan, mausoleum kerajaan kedelapan, dianggap sebagai contoh pertama arsitektur tertutup; sumbernya di halaman belum ditinjau."
