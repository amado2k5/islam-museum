label: { ar: "شير منڈل في القلعة القديمة بدلهي", en: "Sher Mandal, Purana Qila, Delhi", ur: "شیر منڈل، پرانا قلعہ دہلی" }
summary:
  ar: "برج مثمن من طبقتين من الحجر الأحمر تعلوه چهتري في أعلى نقطة من القلعة القديمة بدلهي، ومنه سقط همايون فمات في ربيع الأول 963هـ ⁦(يناير 1556)⁩، ويرى ناث أنه بُني مرصداً فلكياً لهمايون {cite:nath-history-of-mughal-architecture-1-1982 p. 150} {cite:nath-history-of-mughal-architecture-1-1982 p. 153} {cite:nath-history-of-mughal-architecture-1-1982 p. 160}."
  en: "A two-storeyed octagonal red sandstone tower crowned by a chhatri at the highest point of the Purana Qila, Delhi, from whose stair Humayun fell to his death in Rabi' I 963 (January 1556); Nath argues it was built as Humayun's astronomical observatory {cite:nath-history-of-mughal-architecture-1-1982 p. 150} {cite:nath-history-of-mughal-architecture-1-1982 p. 153} {cite:nath-history-of-mughal-architecture-1-1982 p. 160}."
  ur: "پرانے قلعے دہلی کے بلند ترین مقام پر سرخ پتھر کا دو منزلہ ہشت پہلو برج جس پر چھتری ہے؛ اس کی سیڑھی سے ربیع الاول 963ھ (جنوری 1556) میں ہمایوں گر کر فوت ہوئے؛ ناتھ کے نزدیک یہ ہمایوں کی رصدگاہ تھی {cite:nath-history-of-mughal-architecture-1-1982 p. 153}۔"
