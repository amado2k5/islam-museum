summary:
  ar: "بطاقة أولية لجامع حضرت سليمان بديار بكر، الجامع الأرتوقي أسس في القرن الثاني عشر وفي ضريحه صحابة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Hazreti Süleyman Mosque of Diyarbakır, a twelfth-century Artuqid foundation whose tomb holds companions' remains by tradition; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Hazreti Süleyman de Diyarbakır, fondation artuqide du XIIe siècle dont la tombe abrite selon la tradition des restes de Compagnons. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Ficha de borrador para la Mezquita Hazreti Süleyman de Diyarbakır, una fundación artúquida del siglo XII cuya tumba alberga, según la tradición, los restos de sus compañeros; sus fuentes aún no han sido verificadas en la página."
  ur: "دیار بقر کی حضرت سلیمان مسجد کے لیے ڈرافٹ کارڈ، بارہویں صدی کی آرتوقید فاؤنڈیشن جس کے مقبرے میں روایت کے مطابق صحابہ کی باقیات موجود ہیں۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Diyarbakır'daki Hazret Süleyman Camii için ön kart olan Ortodoks Camii, 12. yüzyılda kurulmuş ve sahabelerin türbesi bulunmaktadır; kaynakları henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Hazrat Suleiman di Diyarbakir, Masjid Ortodoks didirikan pada abad ke-12 dan memiliki tempat suci para sahabat; sumbernya belum ditinjau di halaman tersebut."
