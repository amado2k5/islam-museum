  en: The Nizamiyya Madrasa of Baghdad
summary:
  ar: "المدرسة النظامية ببغداد، أولى وأشهر المدارس التي أنشأها الوزير نظام الملك الطوسي، أخذ في بنائها سنة 457هـ وتفرع عنها نظائر في نيسابور وأصفهان وهراة والبصرة والموصل وأمد، وقد عُهد فيها بالتدريس إلى إمام الحرمين الجويني ثم إلى أبي إسحاق الشيرازي، وصارت أمهات المعاهد السنية التي احتذتها المدارس التالية في بغداد وغيرها، حتى صلّى فيها الخلفاء وزارها الوزير نظام الملك بنفسه متفقداً خزانتها."
  en: "The Nizamiyya of Baghdad, first and most famous of the madrasas founded by the vizier Nizam al-Mulk al-Tusi: building began in 457 and sisters rose at Nishapur, Isfahan, Herat, Basra, Mosul and Amid; the Imam al-Haramayn al-Juwayni then Abu Ishaq al-Shirazi taught in it, and it mothered the Sunni institutional model that the later madrasas of Baghdad followed — the caliphs prayed there and Nizam al-Mulk himself visited to inspect its library."
