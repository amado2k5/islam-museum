label:
  ar: المدرسة النظامية ببغداد
  en: The Nizamiyya Madrasa of Baghdad
summary:
  ar: "مدرسة نظامية رعاها الوزير نظام الملك على الضفة الشرقية لدجلة؛ بدأ بناؤها سنة 457هـ/1065م وافتتحت سنة 459هـ/1067م. سبقتها نظامية نيسابور التي درّس فيها الجويني، أما افتتاح بغداد فدرّس فيه ابن الصباغ، ثم تولى أبو إسحاق الشيرازي التدريس بعد عشرين يوماً. خصص وقفها أراضي وأسواقاً وحوانيت للمدرسين والطلبة والعاملين بشروط شافعية {cite:tdv-nizamiye-medresesi pp. 188–191}."
  en: "Nizam al-Mulk's madrasa on the east bank of the Tigris, begun in 457/1065 and opened in 459/1067. Nishapur's Nizamiyya, where al-Juwayni taught, preceded it. Ibn al-Sabbagh gave Baghdad's opening lesson; Abu Ishaq al-Shirazi took over twenty days later. Endowed land, markets and shops supported teachers, students and staff under Shafi'i conditions {cite:tdv-nizamiye-medresesi pp. 188–191}."
  ur: "دجلہ کے مشرقی کنارے پر نظام الملک کا مدرسہ؛ تعمیر 457ھ/1065ء میں شروع، افتتاح 459ھ/1067ء میں ہوا۔ نیشاپور کا نظامیہ، جہاں جوینی پڑھاتے تھے، پہلے تھا۔ بغداد میں ابن الصباغ نے افتتاحی درس دیا؛ بیس دن بعد ابو اسحاق شیرازی نے منصب سنبھالا۔ زمین، بازار اور دکانوں کے وقف سے شافعی شرطوں کے تحت اساتذہ، طلبہ اور عملے کی کفالت ہوتی تھی {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
