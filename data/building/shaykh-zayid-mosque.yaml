id: building/shaykh-zayid-mosque
class: building
kind: mosque
label:
  ar: جامع الشيخ زايد الكبير
  en: Sheikh Zayed Grand Mosque
  fr: "Grande mosquée Cheikh Zayed"
  ur: شیخ زاید گرینڈ مسجد
  es: "Gran Mezquita Sheikh Zayed"
  tr: "Şeyh Zayed Büyük Camii"
  id: "Masjid Agung Sheikh Zayed"
summary:
  ar: أكبر جوامع الإمارات، في أبوظبي، بُني بين 1994 و2007 بتوجيه من الشيخ زايد بن سلطان آل نهيان الذي دُفن في صحنه سنة 2004،
    وافتُتح في ديسمبر 2007؛ صممه المعماري السوري يوسف عبدلكي، وله 82 قبة وأربع مآذن، ويتسع لأكثر من أربعين ألف مصلٍّ، وفيه
    سجادة يدوية مساحتها 5,627 مترا مربعا.
  en: The largest mosque in the United Arab Emirates, in Abu Dhabi, built between 1994 and 2007 under the guidance of Sheikh
    Zayed bin Sultan Al Nahyan, who was buried in its courtyard in 2004, and inaugurated in December 2007; designed by the
    Syrian architect Yusef Abdelki, it has 82 domes and four minarets, holds more than 40,000 worshippers, and has a hand-knotted
    carpet of 5,627 square metres.
  fr: "Plus grande mosquée émiratie, Abou Dhabi, bâtie en 1994–2007 sous l’impulsion de Zayed ben Sultan Al Nahyane, enterré dans la cour en 2004, inaugurée en décembre 2007. Conçue par Yusef Abdelki, 82 coupoles, quatre minarets, plus de 40 000 fidèles et tapis noué de 5 627 m²."
  ur: متحدہ عرب امارات کی سب سے بڑی مسجد، ابوظبی میں، جو 1994 سے 2007 تک شیخ زاید بن سلطان آل نہیان کی رہنمائی میں بنی ⁦(وہ
    2004 میں اس کے صحن میں دفن ہوئے)⁩ اور دسمبر 2007 میں افتتاح ہوا؛ شامی معمار یوسف عبدلکی کا ڈیزائن، 82 گنبد اور چار مینار،
    چالیس ہزار سے زیادہ نمازیوں کی گنجائش، اور 5,627 مربع میٹر کا ہاتھ سے بنا قالین۔
  es: "La mezquita más grande de los Emiratos Árabes Unidos, en Abu Dabi, fue construida entre 1994 y 2007 bajo la dirección del jeque Zayed bin Sultan Al Nahyan, quien fue enterrado en su patio en 2004, e inaugurada en diciembre de 2007. Diseñada por el arquitecto sirio Yusef Abdelki, cuenta con 82 cúpulas y cuatro minaretes, tiene capacidad para más de 40.000 fieles y posee una alfombra anudada a mano de 5.627 metros cuadrados."
  tr: "BAE'nin en büyük cami, Abu Dabi'de yer almakta olup, 1994-2007 yılları arasında 2004 yılında avlusuna defnedilen ve Aralık 2007'de açılan Şeyh Zayed bin Sultan Al Nahyan'ın rehberliğinde inşa edilmiştir. Suriyeli mimar Youssef Abdalki tarafından tasarlanmıştır. 82 kubbe ve dört minareye sahiptir, kırk binden fazla ibadet edeni ağırlayabilir ve 5.627 metrekarelik el yapımı bir halıya sahiptir."
  id: "Masjid terbesar di UEA, yang terletak di Abu Dhabi, dibangun antara tahun 1994 dan 2007 di bawah bimbingan Sheikh Zayed bin Sultan Al Nahyan, yang dimakamkan di halaman rumahnya pada tahun 2004 dan diresmikan pada Desember 2007. Masjid ini dirancang oleh arsitek Suriah Youssef Abdalki. Masjid ini memiliki 82 kubah dan empat menara, menampung lebih dari empat puluh ribu jamaah, serta memiliki karpet buatan tangan seluas 5.627 meter persegi."
