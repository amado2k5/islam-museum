id: building/shaykh-zayid-mosque
class: building
kind: mosque
label:
  ar: جامع الشيخ زايد الكبير
  en: Sheikh Zayed Grand Mosque
  ur: شیخ زاید گرینڈ مسجد
summary:
  ar: أكبر جوامع الإمارات، في أبوظبي، بُني بين 1994 و2007 بتوجيه من الشيخ زايد بن سلطان آل نهيان الذي دُفن في صحنه سنة 2004،
    وافتُتح في ديسمبر 2007؛ صممه المعماري السوري يوسف عبدلكي، وله 82 قبة وأربع مآذن، ويتسع لأكثر من أربعين ألف مصلٍّ، وفيه
    سجادة يدوية مساحتها 5,627 مترا مربعا.
  en: The largest mosque in the United Arab Emirates, in Abu Dhabi, built between 1994 and 2007 under the guidance of Sheikh
    Zayed bin Sultan Al Nahyan, who was buried in its courtyard in 2004, and inaugurated in December 2007; designed by the
    Syrian architect Yusef Abdelki, it has 82 domes and four minarets, holds more than 40,000 worshippers, and has a hand-knotted
    carpet of 5,627 square metres.
  ur: متحدہ عرب امارات کی سب سے بڑی مسجد، ابوظبی میں، جو 1994 سے 2007 تک شیخ زاید بن سلطان آل نہیان کی رہنمائی میں بنی ⁦(وہ
    2004 میں اس کے صحن میں دفن ہوئے)⁩ اور دسمبر 2007 میں افتتاح ہوا؛ شامی معمار یوسف عبدلکی کا ڈیزائن، 82 گنبد اور چار مینار،
    چالیس ہزار سے زیادہ نمازیوں کی گنجائش، اور 5,627 مربع میٹر کا ہاتھ سے بنا قالین۔
