summary:
  ar: "بطاقة أولية لمجموعة السلطان فرج بن برقوق بقرافة القاهرة، الجامع والخانقاه من سنة ١٣٩٩م؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for Sultan Farag ibn Barquq's complex in Cairo's City of the Dead, the 1399 mosque-khanqah; its sources are not yet checked on the page."
