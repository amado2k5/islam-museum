  ur: "قاہرہ کے مردہ شہر میں سلطان فراغ بن برقوق کے کمپلیکس کے لیے ڈرافٹ کارڈ، 1399 کی مسجد خانقاہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Karafa Kahire'deki Sultan Faraj bin Barquq koleksiyonu için ön kart, 1399 yılına ait cami ve hanka için hazırlanmış bir kart; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk koleksi Sultan Faraj bin Barquq di Qarafa Kairo, masjid dan khanqah dari tahun 1399 M; sumber-sumbernya di halaman tersebut belum ditinjau."
