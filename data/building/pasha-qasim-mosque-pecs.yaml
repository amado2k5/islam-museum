summary:
  ar: "جامع غازي قاسم باشا في بيتش بالمجر ⁦(1548-1552م)⁩؛ أكبر جامع عثماني باقٍ في المجر بقبة 16 متراً، حُوّل كنيسة سنة 1776م وما يزال {cite:yilmaz-ottoman-architecture-hungary-2024 pp.106-107}."
  en: "The Gâzi Kasım Paşa Mosque of Pécs (1548-52), Hungary's largest surviving Ottoman mosque with a 16-metre dome, made a church in 1776 and still one {cite:yilmaz-ottoman-architecture-hungary-2024 pp.106-107}."
  fr: "Mosquée Gâzi Kasım Paşa de Pécs (1548–1552), plus grande mosquée ottomane conservée de Hongrie, coupole de 16 m ; église depuis 1776 {cite:yilmaz-ottoman-architecture-hungary-2024 pp.106-107}"
  es: "La mezquita Gâzi Kasım Paşa de Pécs (1548-52), la mezquita otomana más grande que se conserva en Hungría, con una cúpula de 16 metros, se convirtió en iglesia en 1776 y aún lo es {cite:yilmaz-ottoman-architecture-hungary-2024 pp.106-107}."
  ur: "Gâzi Kasım Paşa Mosque of Pécs (1548-52)، ہنگری کی سب سے بڑی زندہ بچ جانے والی عثمانی مسجد جس میں 16 میٹر کا گنبد ہے، 1776 میں ایک چرچ بنایا گیا تھا اور اب بھی ایک {حوالہ: yilmaz-otoman-architecture-hungary-2024-pp. 1010}"
  tr: "Macaristan'ın Peć kentindeki Gazi Kasım Paşa Camii (1548-1552); 16 metrelik kubbesiyle Macaristan'da kalan en büyük Osmanlı camidi, 1776 yılına ait bir kilisenin etrafında yer almaktadır ve hâlâ {cite:yilmaz-ottoman-architecture-hungary-2024 s.106-107}."
  id: "Masjid Gazi Kasım Pasha di Peć, Hungaria (1548-1552 M); masjid Ottoman terbesar yang masih ada di Hungaria dengan kubah setinggi 16 meter, mengelilingi sebuah gereja dari tahun 1776 M, dan masih {cite:yilmaz-ottoman-architecture-hungary-2024 hlm.106-107}."
