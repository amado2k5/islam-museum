summary:
  ar: "أول كُلّية ضخمة بنائها سنان في إسطنبول لزوجة سليمان خاصكي خُرّم ⁦(روكسلانا)⁩؛ المسجد والمدرسة والمكتب 1538–9م والعمارة 1548–9م والمستشفى حتى 1558م."
  en: "Sinan's first monumental Istanbul complex, built for Süleyman's wife Haseki Hürrem (Roxelana): mosque, medrese and mektep 1538–9, imaret 1548–9, hospital completed 1558."
  fr: "Premier complexe monumental de Sinan à Istanbul, construit pour Haseki Hürrem, Roxelane, épouse de Soliman : mosquée, medrese et mektep en 1538–1539, imaret en 1548–1549, hôpital achevé en 1558."
  es: "El primer complejo monumental de Sinan en Estambul, construido para la esposa de Solimán, Haseki Hürrem (Roxelana): mezquita, medrese y mektep 1538–9, imaret 1548–9, hospital terminado en 1558."
  ur: "سینان کا پہلا یادگار استنبول کمپلیکس، جو سلیمان کی بیوی ہسیکی حریم ⁦(روکسیلانا)⁩ کے لیے بنایا گیا تھا: مسجد، میڈریس اور میکٹیپ 1538-9، امامت 1548-9، ہسپتال 1558 میں مکمل ہوا۔"
  tr: "İstanbul'da Sinan tarafından inşa edilen ilk büyük kolej, Süleyman Haseki Hürrem'in eşi (Rokslana) tarafından inşa edilmiştir; cami, okul, ofis, 1538–9 yılları arasında, mimarlık 1548–9 yılları arasında ve hastane 1558 yılına kadar hizmet vermiştir."
  id: "Perguruan tinggi besar pertama yang dibangun Sinan di Istanbul dibangun oleh istri Suleiman Khaseki Hurrem (Rokslana); masjid, sekolah, kantor, 1538–9 M, arsitektur 1548–9 M, dan rumah sakit hingga 1558 M."
