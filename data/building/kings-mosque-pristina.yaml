summary:
  ar: "جامع السلطان ⁦(جامع الفاتح)⁩ ببريشتينا؛ بناه محمد الفاتح سنة 865هـ/1461م، حُوّل كنيسة كاثوليكية 1689-1690م ثم عاد مسجداً {cite:yilmaz-turkish-monuments-churches-2023 pp.355-356}."
  en: "The King's (Imperial/Fâtih) Mosque of Pristina, built by Mehmet the Conqueror in AH 865/1461, made a Catholic church in 1689-90 and a mosque again {cite:yilmaz-turkish-monuments-churches-2023 pp.355-356}."
  fr: "Mosquée du Roi (impériale/Fâtih) de Pristina, construite par Mehmet le Conquérant en 865 H/1461, devenue église catholique en 1689–1690 puis de nouveau mosquée {cite:yilmaz-turkish-monuments-churches-2023 pp.355-356}."
  es: "La Mezquita del Rey (Imperial/Fâtih) de Pristina, construida por Mehmet el Conquistador en el año 865 de la Hégira/1461, se convirtió en iglesia católica en 1689-90 y nuevamente en mezquita {cite:yilmaz-turkish-monuments-churches-2023 pp.355-356}."
  ur: "پرسٹینا کی بادشاہ کی ⁦(امپیریل/فاتح)⁩ مسجد، جسے مہمت فاتح نے AH 865/1461 میں تعمیر کیا، 1689-90 میں ایک کیتھولک چرچ اور دوبارہ ایک مسجد بنائی۔"
  tr: "Priştine'deki Sultan Camii (Al-Fatih Camii); Fatih Mehmed tarafından 865 Hicri / 1461 yılında, 1689-1690 yıllarında bir Katolik kilisesinin etrafında inşa edilmiştir, ardından cami olarak geri dönmüştür {kaynak:Yılmaz-türk-anıtlar-kiliseler-2023 s.355-356}."
  id: "Masjid Sultan (Masjid Al-Fatih) di Pristina; dibangun oleh Mehmed Sang Penakluk pada tahun 865 H / 1461 M, mengelilingi gereja Katolik pada tahun 1689-1690 M, kemudian dikembalikan sebagai masjid {cite:yilmaz-turkish-monuments-churches-2023 hlm.355-356}."
