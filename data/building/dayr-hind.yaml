label: { ar: "دير هند", en: "Dayr Hind" }
summary:
  ar: "دير بناه النعمان بن المنذر لابنته هند لتتعبد فيه؛ خرجت إليه من قصر أبيها فأقامت في الطريق سنةً تنزل المضارب في نزه وصيد والمسافة نحو فرسخ، وشق لها بشر بن فروان نهراً من الفرات ظل يجري حتى خرب الدير؛ وكان النعمان يصلي به ويتقرب فيه وعلق في هيكله خمسمائة قنديل من ذهب وفضة، وفيه دارت الحكاية المشهورة بين النعمان وعدي بن زيد وامرأة حكم بن عمرو اللخمي {cite:umari-masalik-1924 p. 322-323}."
  en: "The monastery al-Nu'man ibn al-Mundhir built for his daughter Hind's devotion; she took a year to cross the farsakh from her father's palace, camping in pavilions for sport, and Bashir ibn Farwan cut her a canal from the Euphrates that ran until the monastery fell; five hundred gold and silver lamps hung in its sanctuary, and there unfolded the famous tale of al-Nu'man, Adi ibn Zayd and the wife of Hakam ibn Amr al-Lakhmi {cite:umari-masalik-1924 p. 322-323}."
