summary:
  ar: "دير بناه النعمان بن المنذر لابنته هند لتتعبد فيه؛ خرجت إليه من قصر أبيها فأقامت في الطريق سنةً تنزل المضارب في نزه وصيد والمسافة نحو فرسخ، وشق لها بشر بن فروان نهراً من الفرات ظل يجري حتى خرب الدير؛ وكان النعمان يصلي به ويتقرب فيه وعلق في هيكله خمسمائة قنديل من ذهب وفضة، وفيه دارت الحكاية المشهورة بين النعمان وعدي بن زيد وامرأة حكم بن عمرو اللخمي {cite:umari-masalik-1924 p. 322-323}."
  en: "The monastery al-Nu'man ibn al-Mundhir built for his daughter Hind's devotion; she took a year to cross the farsakh from her father's palace, camping in pavilions for sport, and Bashir ibn Farwan cut her a canal from the Euphrates that ran until the monastery fell; five hundred gold and silver lamps hung in its sanctuary, and there unfolded the famous tale of al-Nu'man, Adi ibn Zayd and the wife of Hakam ibn Amr al-Lakhmi {cite:umari-masalik-1924 p. 322-323}."
  fr: "Monastère construit par al-Nu’man ibn al-Mundhir pour la dévotion de sa fille Hind ; elle mit un an à parcourir le farsakh depuis le palais de son père, campant dans des pavillons pour se divertir ; Bashir ibn Farwan lui creusa depuis l’Euphrate un canal qui coula jusqu’à la ruine du monastère ; cinq cents lampes d’or et d’argent pendaient dans son sanctuaire, où se déroula l’histoire célèbre d’al-Nu’man, Adi ibn Zayd et la femme de Hakam ibn Amr al-Lakhmi {cite:umari-masalik-1924 p. 322-323}."
  es: "El monasterio que al-Nu'man ibn al-Mundhir construyó para la devoción de su hija Hind; ella tardó un año en cruzar el Farsakh desde el palacio de su padre, acampando en pabellones por diversión, y Bashir ibn Farwan le excavó un canal desde el Éufrates que corría hasta donde caía el monasterio; quinientas lámparas de oro y plata colgaban en su santuario, y allí se desarrolló la famosa historia de al-Nu'man, Adi ibn Zayd y la esposa de Hakam ibn Amr al-Lakhmi {cite:umari-masalik-1924 p. 322-323}."
  ur: "خانقاہ النعمان ابن المنذر نے اپنی بیٹی ہند کی عقیدت کے لیے بنائی تھی۔ اسے اپنے والد کے محل سے فرسخ عبور کرنے میں ایک سال لگا، کھیل کود کے لیے منڈپوں میں ڈیرے ڈالے، اور بشیر ابن فروان نے اسے فرات سے ایک نہر کاٹ دی جو خانقاہ کے گرنے تک بہتی تھی۔ اس کے حرم میں سونے اور چاندی کے پانچ سو چراغ لٹکائے گئے اور وہاں سے النعمان عدی بن زید اور حکم بن عمرو لقمی کی بیوی کی مشہور کہانی سامنے آئی۔ 322-323}۔"
  tr: "Al-Nu'man ibn al-Mundhir tarafından kızı Hind'in ibadet etmesi için inşa edilen bir manastır; Hind, babasının sarayından ayrıldı ve bir yıl boyunca yürüyüş ve avlanma için yolda kaldı, yaklaşık bir farsakh mesafede. Bishr ibn Farwan, bunun için Fırat'tan bir nehir oydu, bu nehir manastır yıkılana kadar aktı. Al-Nu'man oraya dua eder ve yaklaşırdı, tapınağına beş yüz altın ve gümüş fener asıldı. Ünlü hikaye burada al-Nu'man, Uday ibn Zayd ile Hakam ibn Amr al-Lakhmi'nin eşi arasında yaşanmıştır {cite:umari-masalik-1924, s. 322-323}."
  id: "Sebuah biara dibangun oleh al-Nu'man ibn al-Mundhir untuk putrinya Hind beribadah di sana; ia meninggalkan istana ayahnya dan tinggal di jalan selama setahun, berkemah untuk berjalan kaki dan berburu, sejauh sekitar satu farsakh. Bishr ibn Farwan mengukir sungai dari Sungai Efrat untuk itu, yang mengalir hingga biara itu hancur. Al-Nu'man biasa berdoa dan mendekati tempat itu, dan lima ratus lentera emas dan perak digantung di kuilnya. Di sanalah kisah terkenal terjadi antara al-Nu'man, Uday ibn Zayd, dan istri Hakam ibn Amr al-Lakhmi {cite:umari-masalik-1924, hlm. 322-323}."
