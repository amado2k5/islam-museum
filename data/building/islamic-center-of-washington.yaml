summary:
  ar: "أول المساجد الكبيرة على الطراز التقليدي في الولايات المتحدة، صممه المعماري الإيطالي المقيم في القاهرة ماريو روسي على إلهام العمارة المملوكية، ومسجل في سجل المباني الأمريكية التاريخية {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  en: "The first large traditionally designed mosque in the United States, by Mario Rossi, an Italian architect working in Cairo, inspired by the Mamluk architecture of Cairo and listed in the Historic American Buildings Survey {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  ur: "امریکہ میں روایتی طرز کی پہلی بڑی مسجد، جسے قاہرہ میں کام کرنے والے اطالوی معمار ماریو روسی نے قاہرہ کی مملوک معماری سے متاثر ہو کر بنایا، اور جو تاریخی امریکی عمارتوں کے سروے میں درج ہے {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}۔"
