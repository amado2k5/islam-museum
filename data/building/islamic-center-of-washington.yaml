label: { ar: "المركز الإسلامي في واشنطن", en: "Islamic Center of Washington, D.C.", fr: "Centre islamique de Washington, D.C.", ur: "اسلامک سینٹر، واشنگٹن ڈی سی", es: "Centro Islámico de Washington, D.C.", tr: "Washington'daki İslami Merkez", id: "Pusat Islam di Washington" }
summary:
  ar: "أول المساجد الكبيرة على الطراز التقليدي في الولايات المتحدة، صممه المعماري الإيطالي المقيم في القاهرة ماريو روسي على إلهام العمارة المملوكية، ومسجل في سجل المباني الأمريكية التاريخية {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  en: "The first large traditionally designed mosque in the United States, by Mario Rossi, an Italian architect working in Cairo, inspired by the Mamluk architecture of Cairo and listed in the Historic American Buildings Survey {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  fr: "Première grande mosquée de conception traditionnelle aux États-Unis, œuvre de Mario Rossi, architecte italien travaillant au Caire, inspirée de l’architecture mamelouke du Caire et inscrite au Historic American Buildings Survey {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  ur: "امریکہ میں روایتی طرز کی پہلی بڑی مسجد، جسے قاہرہ میں کام کرنے والے اطالوی معمار ماریو روسی نے قاہرہ کی مملوک معماری سے متاثر ہو کر بنایا، اور جو تاریخی امریکی عمارتوں کے سروے میں درج ہے {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}۔"
  es: "La primera gran mezquita de diseño tradicional en los Estados Unidos, obra de Mario Rossi, un arquitecto italiano que trabajaba en El Cairo, inspirada en la arquitectura mameluca de El Cairo y catalogada en el Historic American Buildings Survey {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 10-11}."
  tr: "Amerika Birleşik Devletleri'ndeki geleneksel tarzda ilk büyük camiler, Kahire merkezli İtalyan mimar Mario Rossi tarafından Memlük mimarisinden esinlenerek tasarlanmış ve Amerikan Tarihi Yapı Sicili'nde kayıtlıdır {cite:khalidi-donnellon-mosques-usa-canada-catalogue s. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue s. 10-11}."
  id: "Masjid besar pertama dengan gaya tradisional di Amerika Serikat dirancang oleh arsitek Italia yang berbasis di Kairo, Mario Rossi, yang terinspirasi oleh arsitektur Mamluk, dan terdaftar dalam American Historic Building Register {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 10-11}."
