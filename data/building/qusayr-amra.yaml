label: { ar: "قصير عمرة" }
summary:
  ar: "قصر صحراوي اكتشفه موزيل سنة 1898م بحسب الكتاب، على نحو خمسين ميلاً شرقي عمّان، ويرجح الباحثون نسبته إلى الخليفة الوليد بن عبد الملك. يتكون من قسمين: قاعة استقبال مغطاة بثلاثة أقبية نصف أسطوانية وفيها حنية العرش، وحمام ساخن بثلاث غرف. يذكر الكتاب أن صوراً لستة أشخاص على جدرانه اشتهرت بأنها تمثل «أعداء الإسلام»، ويرى الباحثون أنها تمثل ملوك القوى المجاورة: قيصر الروم، ورذريق ملك القوط، وكسرى، والنجاشي، وملك الصين، وملك الترك {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
