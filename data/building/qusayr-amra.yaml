label: { ar: "قصير عمرة", en: "Qusayr Amra" }
summary:
  ar: "قصر صحراوي اكتشفه موزيل سنة 1898م بحسب الكتاب، على نحو خمسين ميلاً شرقي عمّان، ويرجح الباحثون نسبته إلى الخليفة الوليد بن عبد الملك. يتكون من قسمين: قاعة استقبال مغطاة بثلاثة أقبية نصف أسطوانية وفيها حنية العرش، وحمام ساخن بثلاث غرف. يذكر الكتاب أن صوراً لستة أشخاص على جدرانه اشتهرت بأنها تمثل «أعداء الإسلام»، ويرى الباحثون أنها تمثل ملوك القوى المجاورة: قيصر الروم، ورذريق ملك القوط، وكسرى، والنجاشي، وملك الصين، وملك الترك {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
  en: "A desert palace that the book says Musil discovered in 1898, about fifty miles east of Amman; researchers favour attributing it to the caliph al-Walid ibn Abd al-Malik. It has two parts: a reception hall covered by three half-cylindrical vaults with a throne niche, and a hot bath of three rooms. The book notes that images of six figures on its walls became famous as representing 'the enemies of Islam', while researchers consider them to depict the rulers of neighbouring powers: the Caesar of the Romans, Roderic king of the Visigoths, Khosrow, the Negus, the king of China and the king of the Turks {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
