summary:
  ar: "قصر صحراوي اكتشفه موزيل سنة 1898م بحسب الكتاب، على نحو خمسين ميلاً شرقي عمّان، ويرجح الباحثون نسبته إلى الخليفة الوليد بن عبد الملك. يتكون من قسمين: قاعة استقبال مغطاة بثلاثة أقبية نصف أسطوانية وفيها حنية العرش، وحمام ساخن بثلاث غرف. يذكر الكتاب أن صوراً لستة أشخاص على جدرانه اشتهرت بأنها تمثل «أعداء الإسلام»، ويرى الباحثون أنها تمثل ملوك القوى المجاورة: قيصر الروم، ورذريق ملك القوط، وكسرى، والنجاشي، وملك الصين، وملك الترك {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
  en: "A desert palace that the book says Musil discovered in 1898, about fifty miles east of Amman; researchers favour attributing it to the caliph al-Walid ibn Abd al-Malik. It has two parts: a reception hall covered by three half-cylindrical vaults with a throne niche, and a hot bath of three rooms. The book notes that images of six figures on its walls became famous as representing 'the enemies of Islam', while researchers consider them to depict the rulers of neighbouring powers: the Caesar of the Romans, Roderic king of the Visigoths, Khosrow, the Negus, the king of China and the king of the Turks {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
  fr: "Palais du désert à cinquante milles à l’est d’Amman, découvert selon le livre par Musil en 1898, attribué par les chercheurs à al-Walid ibn Abd al-Malik. Salle à trois voûtes et niche du trône, bains chauds à trois pièces. Les six figures dites dans le livre « ennemis de l’islam » sont plutôt pour les chercheurs les souverains voisins : César, Rodrigue, Khosro, Négus, rois de Chine et des Turcs. {cite:umayyad-birth-to-fall-2006 p. 157} {cite:umayyad-birth-to-fall-2006 p. 158} {cite:umayyad-birth-to-fall-2006 p. 159}"
  es: "Un palacio en el desierto que, según el libro, Musil descubrió en 1898, a unos ochenta kilómetros al este de Amán; los investigadores prefieren atribuirlo al califa al-Walid ibn Abd al-Malik. Consta de dos partes: una sala de recepción cubierta por tres bóvedas semicilíndricas con un nicho para el trono, y un baño termal de tres habitaciones. El libro señala que las imágenes de seis figuras en sus muros se hicieron famosas por representar a \"los enemigos del Islam\", mientras que los investigadores consideran que representan a los gobernantes de potencias vecinas: César de los romanos, Rodrigo, rey de los visigodos, Cosroes, el Negus, el rey de China y el rey de los turcos {cite:umayyad-birth-to-fall-2006 p. 157}{cite:umayyad-birth-to-fall-2006 p. 158}{cite:umayyad-birth-to-fall-2006 p. 159}."
  ur: "ایک صحرائی محل جسے کتاب کہتی ہے کہ مسیل نے 1898 میں عمان سے پچاس میل مشرق میں دریافت کیا تھا۔ محققین اسے خلیفہ الولید بن عبد الملک کی طرف منسوب کرنے کے حق میں ہیں۔ اس کے دو حصے ہیں: ایک استقبالیہ ہال جس میں تین آدھے بیلناکار والٹ ہیں جس میں تخت طاق ہے، اور تین کمروں کا گرم غسل۔ کتاب نوٹ کرتی ہے کہ اس کی دیواروں پر چھ شخصیات کی تصاویر 'اسلام کے دشمنوں' کی نمائندگی کے طور پر مشہور ہوئیں، جب کہ محققین انھیں پڑوسی طاقتوں کے حکمرانوں کی تصویر کشی کے لیے سمجھتے ہیں: رومیوں کا قیصر، ویزگوتھس کا بادشاہ روڈرک، خسرو، نیگس، چین کا بادشاہ اور ترکوں کا بادشاہ۔ 157}{حوالہ دیں:امیاد-پیدائش سے زوال-2006 صفحہ۔ 158}{حوالہ:امیاد-پیدائش سے زوال-2006 صفحہ۔ 159}۔"
  tr: "Moselle tarafından 1898'de Amman'ın yaklaşık elli mil doğusunda keşfedilen bir çöl sarayıdır ve araştırmacılar bunun Halife Al-Walid ibn Abd al-Malik'e atfedildiğine inanır. İki bölümden oluşur: taht kabı içeren üç yarım silindirik tonozla kaplı bir kabul salonu ve üç odalı sıcak banyo. Kitap, duvarlarında altı kişinin 'İslam'ın düşmanlarını' temsil ettiği için ünlü olduğunu belirtir ve araştırmacılar bunların komşu güçlerin krallarını temsil ettiğine inanır: Roma Sezarı, Gotların Drake'i, Hosrov, Negus, Çin Kralı ve Türklerin Kralı {cite:Umayyad-birth-to-fall-2006 s. 157}{cite:Umayyad-birth-to-fall-2006 s. 158}{cite:Umayyad-birth-to-fall-2006 s. 159}."
  id: "Sebuah istana gurun yang ditemukan oleh Moselle pada tahun 1898, sekitar lima puluh mil sebelah timur Amman, dan para peneliti percaya bahwa istana ini dikaitkan dengan Khalifah Al-Walid ibn Abd al-Malik. Istana ini terdiri dari dua bagian: aula resepsi yang ditutupi dengan tiga kubah semi-silinder yang berisi wadah tahta, dan sebuah pemandian air panas dengan tiga ruangan. Buku ini menyebutkan bahwa gambar enam orang di dindingnya terkenal sebagai simbol 'musuh Islam,' dan para peneliti percaya bahwa mereka mewakili raja-raja dari kekuatan tetangga: Caesar Roma, Drake dari bangsa Goth, Khosrow, Negus, Raja Tiongkok, dan Raja Turki {cite:Umayyad-birth-to-fall-2006 hlm. 157}{cite:Umayyad-birth-to-fall-2006 hlm. 158}{cite:Umayyad-birth-to-fall-2006 hlm. 159} {cite:Umayyad-birth-to-fall-2006 hlm. 158}"
