summary:
  ar: "ضريح مربع مشطوف الزوايا بقبة مزدوجة على رقبة مثمنة عالية في ساحة ضريح همايون بدلهي، على مصطبة يشاركه فيها مسجد أفسروالي، وأحد شواهده يحمل الرقم 974 (1566–1567) {cite:nath-history-of-mughal-architecture-1-1982 p. 196} {cite:nath-history-of-mughal-architecture-1-1982 p. 197}."
  en: "A square tomb with chamfered angles and a double dome on a high octagonal drum in the compound of Humayun's tomb, Delhi, on a platform shared with the Afsarwali mosque; one of its tombstones bears the figure 974 (1566-67) {cite:nath-history-of-mughal-architecture-1-1982 p. 196} {cite:nath-history-of-mughal-architecture-1-1982 p. 197}."
  ur: "مقبرۂ ہمایوں کے احاطے میں مربع، کٹے کونوں والا مقبرہ جس کا دوہرا گنبد بلند ہشت پہلو گردن پر ہے، افسر والی مسجد کے ساتھ ایک ہی چبوترے پر؛ ایک قبر پر 974 (1566–67) کا عدد ہے {cite:nath-history-of-mughal-architecture-1-1982 p. 197}۔"
