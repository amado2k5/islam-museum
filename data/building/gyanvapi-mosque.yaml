  ur: "وارانسی کی گیانواپی مسجد کے لیے ڈرافٹ کارڈ، سترہویں صدی کی اورنگ زیب دور کی مسجد کاشی وشواناتھ تنازعہ کے مرکز میں؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Banaras'taki Gyanfabi Camii'nin ön kartı, Kashi tapınağı anlaşmazlığının merkezindeki on yedinci yüzyıl Aurangzepe Camii'nin ön kartı; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Gyanfabi di Banaras, Masjid Aurangzepe abad ketujuh belas yang menjadi pusat perselisihan kuil Kashi; sumber-sumbernya di halaman tersebut belum ditinjau."
