summary:
  ar: "سبيل مستقل بمنى أنشئ سنة 1340هـ/1921-1922م، بالحجر المشهّر ومدخل بارز ودعامات مسدسة، يراه الحداد خاتمة رائعة لعمارة الأسبلة في الحجاز {cite:haddad-asbila-makka-madina-2004 p.46} {cite:haddad-asbila-makka-madina-2004 p.51}."
  en: "A free-standing sabil at Mina built in 1340 AH / 1921-22, of striped stone with a projecting entrance and hexagonal piers, which al-Haddad sees as a splendid finale to sabil architecture in the Hijaz {cite:haddad-asbila-makka-madina-2004 p.46} {cite:haddad-asbila-makka-madina-2004 p.51}."
  fr: "Sabil autonome de pierre rayée à entrée saillante et piliers hexagonaux, splendide finale de l’architecture des sabils du Hedjaz pour al-Haddad. {cite:haddad-asbila-makka-madina-2004 p.46} {cite:haddad-asbila-makka-madina-2004 p.51}"
  es: "Un sabil independiente en Mina, construido en 1340 AH / 1921-22, de piedra rayada con una entrada saliente y pilares hexagonales, que al-Haddad considera un espléndido broche de oro para la arquitectura sabil en el Hiyaz. {cite:haddad-asbila-makka-medina-2004 p.51}."
  ur: "منی میں ایک آزادانہ سبیل جو 1340 ہجری / 1921-22 میں تعمیر کیا گیا تھا، دھاری دار پتھر سے بنایا گیا تھا جس میں ایک پراجیکٹنگ دروازے اور مسدس گھاٹ ہیں، جسے الحداد حجاز میں سبیل فن تعمیر کے شاندار اختتام کے طور پر دیکھتا ہے۔ {حوالہ:حداد-اسبیلہ-مکہ-مدینہ-2004 صفحہ 51}۔"
