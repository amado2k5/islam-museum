summary:
  ar: "قلعة آكره التي بنى أكبر سورها من الحجر الأحمر بارتفاع عشرين متراً على هيئة قوس يواجه نهر جمنا، واستبدل شاه جهان بقصور أكبر فيها قصوراً من الرخام الأبيض، وفيها حديقة أنگوري باغ {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  en: "The fort of Agra, whose bow-shaped red sandstone wall twenty metres high facing the Yamuna was built by Akbar, and whose palaces Shah Jahan replaced with white marble pavilions round the Anguri Bagh {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  fr: "Le fort d’Agra, dont l’enceinte de grès rouge haute de vingt mètres, en forme d’arc face à la Yamuna, fut bâtie par Akbar, et dont Shah Jahan remplaça les palais par des pavillons de marbre blanc autour de l’Anguri Bagh {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
