label: { ar: "القلعة الحمراء في آكره", en: "Agra Fort (Red Fort of Agra)", fr: "Fort d’Agra (Fort rouge d’Agra)", ur: "آگرہ کا لال قلعہ", es: "Fuerte de Agra (Fuerte Rojo de Agra)", tr: "Accra'daki Kızıl Kale", id: "Kastil Merah di Accra" }
summary:
  ar: "قلعة آكره التي بنى أكبر سورها من الحجر الأحمر بارتفاع عشرين متراً على هيئة قوس يواجه نهر جمنا، واستبدل شاه جهان بقصور أكبر فيها قصوراً من الرخام الأبيض، وفيها حديقة أنگوري باغ {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  en: "The fort of Agra, whose bow-shaped red sandstone wall twenty metres high facing the Yamuna was built by Akbar, and whose palaces Shah Jahan replaced with white marble pavilions round the Anguri Bagh {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  fr: "Le fort d’Agra, dont l’enceinte de grès rouge haute de vingt mètres, en forme d’arc face à la Yamuna, fut bâtie par Akbar, et dont Shah Jahan remplaça les palais par des pavillons de marbre blanc autour de l’Anguri Bagh {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  es: "El fuerte de Agra, cuya muralla de arenisca roja en forma de arco de veinte metros de altura frente al Yamuna fue construida por Akbar, y cuyos palacios Shah Jahan reemplazó con pabellones de mármol blanco alrededor del Anguri Bagh {cite:brookes-gardens-of-paradise-1987 p.133} {cite:brookes-gardens-of-paradise-1987 p.154}."
  ur: "آگرہ کا قلعہ، جس کی کمان کی شکل والی سرخ ریتیلی پتھر کی دیوار 20 میٹر اونچی جمنا کی طرف ہے، اکبر نے تعمیر کیا تھا، اور جس کے محلات شاہ جہاں نے انگوری باغ کے گرد سفید سنگ مرمر کے پویلین سے بدل دیے تھے۔ صفحہ 154}۔"
  tr: "Kırmızı taştan yapılmış en büyük duvarı, yirmi metre yüksekliğinde, Jamna Nehri'ne bakan kemer şeklinde inşa edilmiş olan Akra Kalesi, beyaz mermer saraylara sahip daha büyük saraylarla Şah Cihan'a dönüştürülmüş ve içinde Angori Bagh {cite:brookes-gardens-of-paradise-1987 s.133} {cite:brookes-gardens-of-paradise-1987 s.154} bulunmaktadır."
  id: "Benteng Akra, yang temboknya terbesar dibangun dari batu merah setinggi dua puluh meter berbentuk lengkungan menghadap Sungai Jamna, digantikan oleh Shah Jahan dengan istana yang lebih besar dengan istana marmer putih, dan berisi Angori Bagh {cite:brookes-gardens-of-paradise-1987 hlm.133} {cite:brookes-gardens-of-paradise-1987 hlm.154}."
