label: { ar: "مسجد خركي، دلهي", en: "Khirki Masjid, Delhi", ur: "کھڑکی مسجد، دہلی" }
summary:
  ar: "مسجد من طابقين ذو أفنية أربعة في قرية خركي جنوب دلهي، ينسب إلى الوزير خان جهان في عهد فيروز شاه تغلق، اختلف في تاريخه بين ما قبل 1354 و1375 و1387، وسمي بنوافذه الحجرية المخرمة {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 76} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 77}."
  en: "A two-storey four-court mosque at Khirki village in south Delhi, attributed to Firuz Shah Tughluq's vizier Khan-i Jahan, dated variously before 1354, to 1375 and to 1387, and named after its pierced stone windows {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 76} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 77}."
  ur: "جنوبی دہلی کے گاؤں کھڑکی میں دو منزلہ چار صحنوں والی مسجد، جو فیروز شاہ تغلق کے وزیر خانِ جہاں سے منسوب ہے، جس کی تاریخ 1354ء سے پہلے، 1375ء اور 1387ء مختلف بتائی گئی ہے، اور جس کا نام اس کی جالی دار پتھر کی کھڑکیوں سے پڑا {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 76} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 77}۔"
