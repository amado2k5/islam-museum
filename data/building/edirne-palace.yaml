summary:
  ar: "قصر أدرنة القديم حيث ولد محمد الفاتح 1432م ووسّعه سلطاناً؛ أقام فيه محمد الرابع أكثر عهده ودُمّر 1877م إثر الاحتلال الروسي، ولم يبق منه سوى أربعة أنقاض بينها عدلت قصري المرمم."
  en: "The old palace of Edirne where Mehmet the Conqueror was born in 1432 and which he enlarged as sultan; Mehmet IV spent most of his reign there, it was destroyed in the 1877 Russian occupation, and only four ruins survive including the restored Adalet Kasrı."
  fr: "Ancien palais d’Edirne où Mehmet le Conquérant naquit en 1432 et qu’il agrandit comme sultan ; Mehmet IV y passa la plupart de son règne ; détruit pendant l’occupation russe de 1877, il n’en reste que quatre ruines, dont l’Adalet Kasrı restauré."
  es: "El antiguo palacio de Edirne, donde nació Mehmed el Conquistador en 1432 y que amplió como sultán (Mehmed IV pasó allí la mayor parte de su reinado), fue destruido durante la ocupación rusa de 1877 y solo sobreviven cuatro ruinas, entre ellas la restaurada Adalet Kasrı."
  ur: "ایڈرن کا پرانا محل جہاں مہمت فاتح 1432 میں پیدا ہوا تھا اور جسے اس نے سلطان کے طور پر بڑھایا تھا۔ مہمت چہارم نے اپنی حکومت کا بیشتر حصہ وہیں گزارا، یہ 1877 کے روسی قبضے میں تباہ ہو گیا تھا، اور صرف چار کھنڈرات باقی ہیں جن میں بحال شدہ عدلت کسری بھی شامل ہے۔"
