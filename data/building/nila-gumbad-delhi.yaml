label: { ar: "نيلا گنبد ⁦(القبة الزرقاء)⁩ قرب ضريح همايون", en: "Nila Gumbad (Blue Dome), by Humayun's tomb, Delhi", fr: "Nila Gumbad (coupole bleue), près du tombeau de Humayun, Delhi", ur: "نیلا گنبد، مقبرۂ ہمایوں کے پاس، دہلی", es: "Nila Gumbad (Cúpula Azul), junto a la tumba de Humayun, Delhi", tr: "Humayun türbesi yakınındaki Nila Gonbad (Mavi Kubbe)", id: "Nila Gonbad (Kubah Biru) dekat mausoleum Humayun" }
summary:
  ar: "ضريح مربع مشطوف الزوايا في الركن الجنوبي الشرقي خارج ساحة ضريح همايون، قبته المفردة مكسوة بالقيشاني الأزرق، وداخله جص منقوش ملون، ويؤرخه ناث أسلوبياً بنحو 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}."
  en: "A square tomb with chamfered angles just outside the south-east corner of Humayun's compound, its single dome covered in blue tile and its interior in incised coloured stucco, dated by Nath on style to about 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}."
  fr: "Tombe carrée à angles chanfreinés hors de l’angle sud-est de l’enceinte de Humayun, coupole simple à carreaux bleus et intérieur de stuc coloré incisé, datée stylistiquement vers 1560 par Nath {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}"
  ur: "مقبرۂ ہمایوں کے احاطے کے جنوب مشرقی کونے کے باہر کٹے کونوں والا مربع مقبرہ، جس کا اکہرا گنبد نیلی کاشی سے ڈھکا اور اندرون کندہ رنگین گچ کاری سے مزین ہے؛ ناتھ اسلوب کی بنا پر اسے تقریباً 1560ء کا بتاتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 198}۔"
  es: "Una tumba cuadrada con ángulos achaflanados justo fuera de la esquina sureste del recinto de Humayun, su única cúpula cubierta de azulejos azules y su interior en estuco de colores incisos, datada por Nath por su estilo alrededor de 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}."
  tr: "Humayun'un mezarının avlusunun dışında, güneydoğu köşesinde köşeleri eğimli kare bir mezar, tek kubbesi mavi karolarla kaplıdır ve içi renkli oyma sıvadan oluşmaktadır. Stil olarak Nath'a yaklaşık 1560 yılına tarihlendirilmektedir {cite:nath-history-of-mughal-architecture-1-1982 s. 197} {cite:nath-history-of-mughal-architecture-1-1982 s. 198}."
  id: "Makam persegi dengan sudut miring di sudut tenggara di luar halaman makam Humayun, kubah tunggalnya ditutupi ubin biru, dan di dalamnya dihiasi plester berwarna. Secara gaya, makam ini berasal dari Nath sekitar tahun 1560 {cite:nath-history-of-mughal-architecture-1-1982 hlm. 197} {cite:nath-history-of-mughal-architecture-1-1982 hlm. 198}."
