label: { ar: "نيلا گنبد (القبة الزرقاء) قرب ضريح همايون", en: "Nila Gumbad (Blue Dome), by Humayun's tomb, Delhi", ur: "نیلا گنبد، مقبرۂ ہمایوں کے پاس، دہلی" }
summary:
  ar: "ضريح مربع مشطوف الزوايا في الركن الجنوبي الشرقي خارج ساحة ضريح همايون، قبته المفردة مكسوة بالقيشاني الأزرق، وداخله جص منقوش ملون، ويؤرخه ناث أسلوبياً بنحو 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}."
  en: "A square tomb with chamfered angles just outside the south-east corner of Humayun's compound, its single dome covered in blue tile and its interior in incised coloured stucco, dated by Nath on style to about 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 197} {cite:nath-history-of-mughal-architecture-1-1982 p. 198}."
  ur: "مقبرۂ ہمایوں کے احاطے کے جنوب مشرقی کونے کے باہر کٹے کونوں والا مربع مقبرہ، جس کا اکہرا گنبد نیلی کاشی سے ڈھکا اور اندرون کندہ رنگین گچ کاری سے مزین ہے؛ ناتھ اسلوب کی بنا پر اسے تقریباً 1560ء کا بتاتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 198}۔"
