summary:
  ar: "مسجد صغيرة أنيقة مربعة بقبة في غور، جنوب شرق باب الكوتوالي، اسمها «السيدة الملكية»، لا نقش لها، يضعها المؤلف في عهد الإلياسشاهيين المستعادين ⁦(841–893هـ/1437–1487)⁩ {c(117)} {c(118)} {c(119)}."
  en: "A small, elegant square domed mosque at Gaur south-east of the Kotwali Gate, its name meaning 'Royal Lady'; without inscription, it is placed by the author in the period of the restored Ilyas Shahis (AH 841-893/1437-87) {c(117)} {c(118)} {c(119)}."
  fr: "Petite mosquée élégante carrée à coupole au sud-est de la porte Kotwali, « dame royale ». Sans inscription, datée par l’auteur de la restauration Ilyas Shahi, 841–893 H/1437–1487. {c(117)} {c(118)} {c(119)}"
  ur: "گوڑ میں کوتوالی دروازے کے جنوب مشرق میں ایک گنبد والی چھوٹی خوش نما مربع مسجد، نام کا مطلب «شاہی خاتون»؛ بے کتبہ؛ مصنف اسے بحال شدہ الیاس شاہیوں کے دور ⁦(841–893ھ/1437–87)⁩ میں رکھتے ہیں {c(119)}۔"
  es: "Una pequeña y elegante mezquita cuadrada con cúpula en Gaur, al sureste de la Puerta Kotwali, cuyo nombre significa 'Dama Real'; sin inscripción, el autor la sitúa en el período de los Ilyas Shahis restaurados (AH 841-893/1437-87) {c(117)} {c(118)} {c(119)}."
  tr: "Bab al-Kotwali'nin güneydoğusunda, Ghor'da kubbeli küçük, zarif ve kare bir cami inşa edilmiştir; üzerinde yazıt bulunmamış, üzerinde yazıt yoktur; yazar tarafından geri kazanılan Elyashahian döneminde (841–893 Hic/1437–1487) {c(117)} {c(118)} {c(119)} olarak yapılmıştır."
  id: "Sebuah masjid kecil, elegan, persegi dengan kubah di Ghor, tenggara Bab al-Kotwali, bernama 'Nyonya Kerajaan,' tanpa prasasti, didirikan oleh penulis selama periode Elyashahian yang direklamasi (841–893 H/1437–1487) {c(117)} {c(118)} {c(119)}."
