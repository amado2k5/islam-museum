summary:
  ar: "بطاقة أولية لجهار منار بمدينة حيدرآباد الدكن، مسجد ونصب تذكاري بناه السلطان محمد قلي قطب شاه سنة ١٥٩١م في قلب المدينة الجديدة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Charminar of Hyderabad Deccan, the mosque and monument built by Sultan Muhammad Quli Qutb Shah in 1591 at the heart of the new city; its sources are not yet checked on the page."
  fr: "Notice provisoire : Charminar d’Hyderabad, au Deccan, mosquée et monument bâtis par le sultan Muhammad Quli Qutb Shah en 1591 au cœur de la ville nouvelle. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para el Charminar de Hyderabad Deccan, la mezquita y monumento construido por el sultán Muhammad Quli Qutb Shah en 1591 en el corazón de la nueva ciudad; sus fuentes aún no han sido verificadas en la página."
  ur: "حیدرآباد دکن کے چارمینار کے لیے ڈرافٹ کارڈ، نئے شہر کے مرکز میں 1591 میں سلطان محمد قلی قطب شاہ کی تعمیر کردہ مسجد اور یادگار؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Hyderabad Deccan şehrinde, Sultan Muhammed Kudü Şah tarafından 1591 yılında yeni şehrin kalbinde inşa edilen cami ve anıt olan Jahar Minar için ön kart; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Jahar Minar di kota Hyderabad Deccan, sebuah masjid dan monumen yang dibangun oleh Sultan Muhammad Quli Qutb Shah pada tahun 1591 M di jantung kota baru; sumber-sumbernya di halaman tersebut belum ditinjau."
