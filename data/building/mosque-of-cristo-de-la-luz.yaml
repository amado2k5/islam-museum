  ar: "بطاقة أولية لمسجد باب المردوم بطليطلة، الجامع الأموي الصغير الذي بُني سنة ٩٩٩م تقريباً وصار لاحقاً كنيسة «نور المسيح»؛ من أوعى آثار العمارة الأندلسية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Bab Mardum mosque of Toledo ('Cristo de la Luz'), the small late-tenth-century mosque later converted to a church; among the best-preserved Andalusi monuments per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée de Bab Mardum, Tolède ('Cristo de la Luz'), petite mosquée de la fin du Xe siècle ensuite convertie en église ; parmi les monuments andalous les mieux conservés selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto para la mezquita Bab Mardum de Toledo ('Cristo de la Luz'), la pequeña mezquita de finales del siglo X convertida posteriormente en iglesia; según la enciclopedia citada, página aún no revisada, se encuentra entre los monumentos andaluces mejor conservados."
  ur: "ٹولیڈو ⁦('کرسٹو ڈی لا لوز')⁩ کی باب مردم مسجد کے لیے ڈرافٹ کارڈ، جو دسویں صدی کے اواخر کی چھوٹی مسجد بعد میں چرچ میں تبدیل ہو گئی۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق اندلس کی بہترین محفوظ یادگاروں میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
