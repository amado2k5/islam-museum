summary:
  ar: "مسجد جامع برواقين وعشر قباب على بعد 35 ميلاً جنوب شرق راجشاهي، بناه السلطان نصرة شاه ابن حسين شاه سنة 930هـ/1523–1524 بحسب نقشه، سقطت قبابه في زلزال 1897 {c(136)} {c(137)}."
  en: "A two-aisled, ten-domed congregational mosque 35 miles south-east of Rajshahi, built by Sultan Nusrat Shah son of Husain Shah in AH 930/1523-24 according to its inscription; its domes fell in the earthquake of 1897 {c(136)} {c(137)}."
  fr: "Grande mosquée à deux nefs et dix coupoles, à 35 milles au sud-est de Rajshahi, construite selon son inscription par le sultan Nusrat Shah, fils de Husain Shah, en 930 H/1523-1524 ; ses coupoles s’effondrèrent lors du séisme de 1897 {c(136)} {c(137)}."
  ur: "راجشاہی سے 35 میل جنوب مشرق میں دو صفوں اور دس گنبدوں والی جامع مسجد، کتبے کے مطابق سلطان نصرت شاہ بن حسین شاہ نے 930ھ/1523–24ء میں بنوائی؛ اس کے گنبد 1897ء کے زلزلے میں گرے {c(136)}۔"
  es: "Una mezquita congregacional de dos naves y diez cúpulas, a 35 millas al sureste de Rajshahi, construida por el sultán Nusrat Shah, hijo de Husain Shah, en el año AH 930/1523-24 según su inscripción; sus cúpulas se derrumbaron en el terremoto de 1897 {c(136)} {c(137)}."
  tr: "Rajshahi'nin 35 mil güneydoğusunda yer alan, iki portikosu ve on kubbesi olan bir cami, Sultan Nusra Şah bin Hüseyin Şah tarafından 930 Hicri / 1523–1524 yıllarında inşa edilmiştir. Kubbeleri 1897 depremi {c(136)} {c(137)} sırasında çökmüştür."
  id: "Sebuah masjid dengan dua portiko dan sepuluh kubah terletak 35 mil tenggara Rajshahi, dibangun oleh Sultan Nusra Shah ibn Hussain Shah pada tahun 930 H / 1523–1524 menurut prasasti beliau. Kubahnya runtuh dalam gempa bumi tahun 1897 {c(136)} {c(137)}."
