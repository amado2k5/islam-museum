  tr: "Golan'daki Subaiba (Nimrud) Kalesi için ön hazırlık kartı; Aziz Osman tarafından Banias üzerinde inşa edilen Eyyubi Memlük kalesi; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Benteng Subaiba (Nimrud) di Golan, benteng Mamluk Ayyubiyah yang dibangun oleh Aziz Uthman di atas Banias; sumber-sumbernya di halaman tersebut belum ditinjau."
