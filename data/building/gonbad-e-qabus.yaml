  ar: "بطاقة أولية لبرج قنبد قابوس بشمال إيران، برج الضريح المبكر سنة ١٠٠٦م للأمير الزياري قابوس بن وشمكير؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Gonbad-e Qabus tower in northern Iran, the early tomb tower of 1006 for the Ziyarid prince Qabus ibn Vushmgir; its sources are not yet checked on the page."
