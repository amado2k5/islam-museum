  ur: "شمالی ایران میں گونبادِ قابوس ٹاور کے لیے ڈرافٹ کارڈ، زیارد شہزادے قابوس ابن وشمگیر کے لیے 1006 کا ابتدائی مقبرہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kuzey İran'daki Qobbad Qabus Kulesi için ön kart, 1006 yılında Prens Ziyari Qabus bin Vashmkir tarafından hazırlanmış erken anıt türbe kulesi; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Menara Qobbad Qabus di Iran utara, menara mausoleum awal tahun 1006 M oleh Pangeran Ziyari Qabus bin Vashmkir; sumbernya di halaman tersebut belum ditinjau."
