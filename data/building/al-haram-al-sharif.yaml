summary:
  ar: "بطاقة أولية للحرم القدسي الشريف، صحن المسجد الأقصى وقبة الصخرة وقبابه وأروقته في القدس، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. وصفه المقدسي في أحسن التقاسيم، ولم تُراجع تفاصيله على الصفحة بعد."
  en: "Draft card for al-Haram al-Sharif, the Jerusalem sanctuary esplanade holding the Aqsa mosque, the Dome of the Rock and its domes and arcades, named from an open reference description (Wikidata); al-Muqaddasi describes it in Ahsan al-Taqasim but the details are not yet checked on the page."
  fr: "Fiche provisoire d’al-Haram al-Sharif, l’esplanade sacrée de Jérusalem abritant la mosquée Aqsa, le Dôme du Rocher, ses coupoles et ses arcades, nommée d’après une description de référence ouverte (Wikidata) ; al-Muqaddasi la décrit dans Ahsan al-Taqasim, mais les détails ne sont pas encore vérifiés sur la page."
  es: "Boceto de ficha para al-Haram al-Sharif, la explanada del santuario de Jerusalén que alberga la mezquita de Aqsa, la Cúpula de la Roca y sus cúpulas y arcadas, nombrada a partir de una descripción de referencia abierta (Wikidata); al-Muqaddasi la describe en Ahsan al-Taqasim, pero los detalles aún no se han verificado en la página."
  ur: "الحرام الشریف کے لیے ڈرافٹ کارڈ، یروشلم کی مقدس پناہ گاہ جس میں مسجد اقصیٰ، ڈوم آف دی راک اور اس کے گنبد اور آرکیڈز ہیں، جن کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکیڈیٹا)⁩ سے رکھا گیا ہے۔ المقدسی نے اسے احسن التقاسم میں بیان کیا ہے لیکن اس کی تفصیل ابھی تک صفحہ پر نہیں دیکھی گئی ہے۔"
  tr: "Asil Türbesi, Mescid-i Mescid'in avlusu, Kaya Kubbesi, kubbeleri ve Kudüs'teki kemerler için ön kart, açık bir referans açıklamasında (Wikidata) bahsedilmiştir. Kudüslüler bunu en iyi bölümlerde tanımlamış, detayları henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Tempat Suci Bangsawan, halaman Masjid Al-Aqsa, Kubah Batu, kubahnya, dan lengkungan-lengkungan di Yerusalem, disebutkan dalam deskripsi referensi terbuka (Wikidata). Yerusalem mendeskripsikannya di bagian terbaik, dan detailnya belum ditinjau di halaman tersebut."
