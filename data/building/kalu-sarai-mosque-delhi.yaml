label: { ar: "مسجد كالو سراي، دلهي", en: "Kalu Sarai Mosque, Delhi", fr: "Mosquée de Kalu Sarai, Delhi", ur: "کالو سرائے مسجد، دہلی", es: "Mezquita Kalu Sarai, Delhi", tr: "Kalu Sarai Camii, Delhi", id: "Masjid Kalu Sarai, Delhi" }
summary:
  ar: "مسجد خرب على طريق مهرولي قرب مسجد بيگم پور في دلهي، بلا نقش، ينسب إلى الوزير خان جهان في عهد فيروز شاه تغلق، ويؤرخ بالقياس نحو 789هـ/1387 {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 90}."
  en: "A ruined mosque on the Mehrauli road near the Begumpur mosque in Delhi, without an inscription, attributed to Firuz Shah Tughluq's vizier Khan-i Jahan and dated by analogy to about AH 789/1387 {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 90}."
  fr: "Mosquée ruinée sur la route de Mehrauli près de celle de Begumpur à Delhi, sans inscription, attribuée au vizir de Firuz Shah Tughluq, Khan-i Jahan, et datée par analogie vers 789 H/1387 {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 90}."
  ur: "دہلی میں مہرولی روڈ پر بیگم پور مسجد کے قریب ایک کھنڈر مسجد، بغیر کتبے کے، جو فیروز شاہ تغلق کے وزیر خانِ جہاں سے منسوب ہے اور قیاساً تقریباً 789ھ/1387ء کی بتائی جاتی ہے {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 90}۔"
  es: "Una mezquita en ruinas en la carretera de Mehrauli, cerca de la mezquita de Begumpur en Delhi, sin inscripción, atribuida al visir de Firuz Shah Tughluq, Khan-i Jahan, y datada por analogía en torno al año 789 de la Hégira/1387 {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 90}."
  tr: "Delhi'deki Begumpur Camii yakınlarındaki Mehroli yolu üzerinde, yazıt olmadan, Firuz Şah Tughlaq döneminde Wazir Khan Jahan'a atfedilen, yaklaşık 789 Hicri/1387 yılına benzetme yoluyla tarihlendirilen bir cami {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 90}."
  id: "Sebuah masjid yang hancur di jalan Mehroli dekat Masjid Begumpur di Delhi, tanpa prasasti, dikaitkan dengan Wazir Khan Jahan pada masa pemerintahan Firuz Shah Tughlaq, dengan tanggalan analogi sekitar tahun 789 H/1387 {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 90}."
