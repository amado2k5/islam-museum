summary:
  ar: "بطاقة أولية لمسجد حبيب النجار بأنطاكية، من أقدم مساجد المدينة ويعود إنشاؤه الأول إلى الفتوح في القرن السابع وقد جُدد مرات؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Habib al-Najjar Mosque of Antakya, among the city's oldest mosques whose first foundation is traced to the seventh-century conquests; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Habib al-Najjar d’Antakya, parmi les plus anciennes mosquées de la ville, dont la première fondation remonte aux conquêtes du VIIe siècle. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Ficha preliminar de la mezquita Habib al-Najjar de Antakya, una de las mezquitas más antiguas de la ciudad, cuya fundación se remonta a las conquistas del siglo VII; sus fuentes aún no han sido verificadas en la página."
  ur: "انطاکیہ کی حبیب النجار مسجد کے لیے ڈرافٹ کارڈ، شہر کی قدیم ترین مساجد میں سے جس کی پہلی بنیاد ساتویں صدی کی فتوحات سے ملتی ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Şehrin en eski camilerinden biri olan Antakya'daki Habib el-Neccar Camii için ön kart, aslen yedinci yüzyılda inşa edilmiştir. Birkaç kez yenilenmiştir; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Habib al-Najjar di Antiokhia, salah satu masjid tertua di kota ini, yang awalnya dibangun pada abad ketujuh H. Kartu ini telah diperbarui beberapa kali; sumber-sumbernya di halaman belum ditinjau."
