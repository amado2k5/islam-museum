summary:
  ar: "مسجد الحنانة بالنجف؛ تذكر «موسوعة العتبات» أنه من أشهر مساجد النجف المقصودة للتبرك، موقعه شمال المدينة على يسار الذاهب إلى الكوفة، وبالقرب منه «الثوية» مدفن كثير من خواص الإمام علي {cite:musawat-atabat}."
  en: "The al-Hannanah Mosque of Najaf; the Mawsu'at al-Atabat lists it among Najaf's most-visited mosques of blessing, sited north of the city on the left of the road to Kufa, near al-Thawiyya — the burial place of many of Imam Ali's intimates {cite:musawat-atabat}."
  fr: "La mosquée al-Hannanah de Najaf ; la Mawsu’at al-Atabat la classe parmi les mosquées de bénédiction les plus visitées de Najaf, au nord de la ville, à gauche de la route de Kufa, près d’al-Thawiyya — lieu de sépulture de nombreux proches de l’imam Ali {cite:musawat-atabat}."
  es: "La mezquita al-Hannanah de Najaf; el Mawsu'at al-Atabat la incluye entre las mezquitas de bendición más visitadas de Najaf, situada al norte de la ciudad a la izquierda del camino a Kufa, cerca de al-Thawiyya, lugar de entierro de muchos de los íntimos del Imam Ali {cite:musawat-atabat}."
  ur: "نجف کی الحنانہ مسجد؛ موصوف الاطابات نے اسے نجف کی سب سے زیادہ دیکھی جانے والی مساجد میں شامل کیا ہے، جو شہر کے شمال میں کوفہ جانے والی سڑک کے بائیں جانب الثویہ کے قریب واقع ہے - یہ امام علی کے بہت سے مقربوں کی تدفین کی جگہ ہے۔"
