summary:
  ar: "بطاقة أولية لجامع مهرماه سلطان بأُسكدار قبالة إسطنبول، من تصميم المعمار سنان في أربعينيات القرن السادس عشر لابنة سليمان القانوني؛ من عيون العمارة العثمانية الكلاسيكية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Mihrimah Sultan Mosque at Uskudar opposite Istanbul, designed by Sinan in the 1540s for the daughter of Suleiman; a landmark of classical Ottoman architecture per the cited survey, the page not yet checked."
  fr: "Notice provisoire de la mosquée Mihrimah à Üsküdar face à Istanbul, conçue par Sinan dans les années 1540 pour la fille de Soliman ; jalon classique ottoman selon l’étude citée, page non encore vérifiée."
  es: "Boceto de ficha técnica para la Mezquita Mihrimah Sultan en Uskudar, frente a Estambul, diseñada por Sinan en la década de 1540 para la hija de Solimán; un hito de la arquitectura otomana clásica según el estudio citado, cuya página aún no ha sido revisada."
  ur: "استنبول کے سامنے اسکودر میں واقع مظہریہ سلطان مسجد کے لیے ڈرافٹ کارڈ، جسے سنان نے 1540 کی دہائی میں سلیمان کی بیٹی کے لیے ڈیزائن کیا تھا۔ حوالہ کردہ سروے کے مطابق کلاسیکی عثمانی فن تعمیر کا ایک تاریخی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'un karşısındaki İskedar'daki Mehrema Sultan Camii'nin ön kartı, 1640'larda mimar Sinan tarafından Süleyman Muhteşem'in kızı tarafından tasarlanmış; klasik Osmanlı mimarisi açısından sayfa henüz incelenmemiştir."
  id: "Kartu awal Masjid Mehrema Sultan di Iskedar, berseberangan dengan Istanbul, dirancang oleh arsitek Sinan pada tahun 1640-an oleh putri Suleiman yang Agung; dari sudut pandang arsitektur klasik Ottoman, halaman ini belum pernah ditinjau."
