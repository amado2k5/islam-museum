summary:
  ar: جامع إسطنبول ذو المآذن الست (1616) أمام آيا صوفيا — سمّي الأزرق لعشرين ألف قطعة خزف إزنيقي تكسو جدرانه.
  en: Istanbul's six-minaret mosque (1616) facing Hagia Sophia — 'blue' for the twenty thousand Iznik tiles lining its walls.
  fr: "Mosquée d’Istanbul de 1616 à six minarets face à Sainte-Sophie, bleue par ses vingt mille carreaux d’Iznik."
  es: "La mezquita de seis minaretes de Estambul (1616), frente a Santa Sofía, cuyo nombre en inglés se debe a los veinte mil azulejos de Iznik que recubren sus paredes."
  ur: "استنبول کی چھ مینار والی مسجد (1616) جس کا رخ ہاگیا صوفیہ ہے - بیس ہزار ایزنک ٹائلوں کے لیے 'نیلا' اس کی دیواروں پر لگی ہوئی ہے۔"
