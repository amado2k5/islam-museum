summary:
  ar: "جامع من القرن الخامس عشر يُنسب إلى السلطان محمد چلبي في منطقة الميناء القديم بيرگوگي ⁦(جورجو)⁩ على الدانوب، حُوّل كنيسة القديس نيقولا الأرثوذكسية سنة 1830 بعد تسليم المدينة للروس {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 674}."
  en: "A fifteenth-century mosque ascribed to Sultan Mehmed Çelebi in the old port quarter of Giurgiu on the Danube, made the Orthodox church of St Nicholas in 1830 after the town was ceded to the Russians {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 674}."
  fr: "Mosquée du XVe siècle attribuée au sultan Mehmed Çelebi dans l’ancien quartier portuaire de Giurgiu sur le Danube, devenue l’église orthodoxe Saint-Nicolas en 1830 après la cession de la ville aux Russes {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 674}."
  ur: "ڈینیوب پر جورجیو کے پرانے بندرگاہی علاقے میں سلطان محمد چلبی سے منسوب پندرھویں صدی کی مسجد، جو 1830ء میں شہر روسیوں کے حوالے ہونے کے بعد سینٹ نکولس کا آرتھوڈوکس گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 674}۔"
  es: "Una mezquita del siglo XV atribuida al sultán Mehmed Çelebi en el antiguo barrio portuario de Giurgiu, en el Danubio, se convirtió en la iglesia ortodoxa de San Nicolás en 1830 después de que la ciudad fuera cedida a los rusos {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 674}."
