label: { ar: "حمّام والدة السلطان في إگر", en: "Valide Sultan Bath, Eger", fr: "Bains Valide Sultan, Eger", ur: "والدہ سلطان حمام، ایگر", es: "Valide Sultan Bath, Eger" }
summary:
  ar: "حمّام عند الباب الجنوبي لقلعة إگر بنته صفية سلطان أم محمد الثالث فاتح إگر، تهدّم بعد 1856، ورُمم بين 1958 و1988 فكُشفت أنظمة التدفئة والتهوية تحت أرضه {cite:yilmaz-ottoman-architecture-hungary-2024 p. 165}."
  en: "A bath by the south gate of Eger castle built by Safiye Sultan, mother of Mehmed III, conqueror of Eger; ruined after 1856 and restored in 1958-88, revealing the heating and ventilation systems beneath its floor {cite:yilmaz-ottoman-architecture-hungary-2024 p. 165}."
  fr: "Près de la porte sud du château, Safiye Sultan mère du conquérant Mehmed III ; ruinés après 1856, restaurés en 1958–1988, chauffage et ventilation de sol dégagés. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 165}"
  ur: "ایگر قلعے کے جنوبی دروازے کے پاس حمام جو فاتحِ ایگر محمد ثالث کی والدہ صفیہ سلطان نے بنوایا؛ 1856ء کے بعد کھنڈر، 1958–88ء کی مرمت میں فرش کے نیچے حرارت اور ہوا کے نظام سامنے آئے {cite:yilmaz-ottoman-architecture-hungary-2024 p. 165}۔"
  es: "Un baño junto a la puerta sur del castillo de Eger, construido por Safiye Sultan, madre de Mehmed III, conquistador de Eger; en ruinas después de 1856 y restaurado entre 1958 y 1988, revelando los sistemas de calefacción y ventilación bajo su suelo {cite:yilmaz-ottoman-architecture-hungary-2024 p. 165}."
