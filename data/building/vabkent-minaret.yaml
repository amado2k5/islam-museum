summary:
  ar: "بطاقة أولية لمنارة واجبكنت ⁦(منارة عبد العزيز)⁩ شمال غرب بخارى — منارة مسجد جامع كان يُوصل إلى المصلى بجسر؛ نقشا بناء مسجلان في قاموس النقوش الإسلامية يعيدانها إلى أواخر القرن السادس الهجري."
  en: "Draft card for the Vabkent minaret (the Minaret of Abd al-Aziz) north-west of Bukhara — the minaret of a congregational mosque once linked to the prayer hall by a bridge; two construction inscriptions recorded in the Islamic Epigraphy Thesaurus date it to the late sixth century AH."
  fr: "Notice provisoire : minaret de Vabkent (minaret d’Abd al-Aziz), au nord-ouest de Boukhara, minaret d’une mosquée de prière collective autrefois relié à la salle de prière par un pont ; deux inscriptions de construction enregistrées dans l’Islamic Epigraphy Thesaurus le datent de la fin du VIe siècle H."
  es: "Boceto para el minarete de Vabkent (el minarete de Abd al-Aziz) al noroeste de Bujará: el minarete de una mezquita congregacional que antiguamente estaba conectada a la sala de oración por un puente; dos inscripciones de construcción registradas en el Tesauro de Epigrafía Islámica lo datan a finales del siglo VI AH."
  ur: "بخارا کے شمال مغرب میں وابکینٹ مینار ⁦(عبد العزیز کا مینار)⁩ کے لیے ڈرافٹ کارڈ - ایک اجتماعی مسجد کا مینار جو کبھی ایک پل کے ذریعے نماز کے ہال سے منسلک ہوتا تھا۔ اسلامی ایپی گرافی تھیسورس میں درج دو تعمیراتی نوشتہ اس کی تاریخ چھٹی صدی ہجری کے اواخر سے ہے۔"
