summary:
  ar: "ضريح مربع من الحجر الأحمر في حديقة ضريح همايون يعرف شعبياً بضريح الحلاق، تحمل قبته المزدوجة أربعة عقود متقاطعة من الأضلاع الحجرية، ويؤرخه ناث بنحو 1570 {cite:nath-history-of-mughal-architecture-1-1982 p. 193} {cite:nath-history-of-mughal-architecture-1-1982 p. 194} {cite:nath-history-of-mughal-architecture-1-1982 p. 195}."
  en: "A square red sandstone tomb in the garden of Humayun's tomb, popularly called the Barber's Tomb, whose double dome rests on four intersecting stone-ribbed arches, dated by Nath to about 1570 {cite:nath-history-of-mughal-architecture-1-1982 p. 193} {cite:nath-history-of-mughal-architecture-1-1982 p. 194} {cite:nath-history-of-mughal-architecture-1-1982 p. 195}."
  ur: "باغِ مقبرۂ ہمایوں میں سرخ پتھر کا مربع مقبرہ جو عوام میں نائی کا مقبرہ کہلاتا ہے؛ اس کا دوہرا گنبد سنگی پسلیوں کی چار متقاطع محرابوں پر ہے؛ ناتھ اسے تقریباً 1570ء کا بتاتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 195}۔"
