summary:
  ar: "مسجد صغير قرب الشاهزاده بناه نحو 1550م قاضي مصر أمين نور الدين عثمان أفندي؛ اشتهر بمنارته الطوبية الملتوية الفريدة في إسطنبول."
  en: "A small mosque near the Şehzade built c.1550 by the kadi of Egypt Emin Nurettin Osman Efendi; famous for its spirally-ribbed brick minaret, unique in Istanbul."
  fr: "Petite mosquée près de Şehzade, construite vers 1550 par le cadi d’Égypte Emin Nurettin Osman Efendi ; célèbre pour son minaret de brique à nervures spiralées, unique à Istanbul."
  es: "Una pequeña mezquita cerca de Şehzade, construida alrededor de 1550 por el cadí de Egipto Emin Nurettin Osman Efendi; famosa por su minarete de ladrillo con nervaduras en espiral, único en Estambul."
  ur: "شہزادے کے قریب ایک چھوٹی مسجد مصری ایمن نوریطین عثمان افندی کے قادی نے c.1550 میں بنائی تھی۔ استنبول میں منفرد اینٹوں کے مینار کے لیے مشہور ہے۔"
  tr: "Prensin yakınındaki küçük bir cami yaklaşık 1550 yılında Mısırlı yargıç Emin Nur al-Din Osman Efendi tarafından inşa edilmiştir; İstanbul'daki benzersiz kıvrımlı tuğla minaresiyle ünlüydü."
  id: "Sebuah masjid kecil di dekat pangeran dibangun sekitar tahun 1550 M oleh hakim Mesir Emin Nur al-Din Osman Efendi; masjid ini terkenal dengan menara bata yang unik dan terpintal di Istanbul."
