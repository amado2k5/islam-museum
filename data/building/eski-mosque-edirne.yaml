summary:
  ar: "بطاقة أولية للجامع القديم بأدرنة، الجامع الذي بُني في عهد محمد الأول وأدرنة دار السلطنة العثمانية؛ تذكره مصادر تاريخ العمارة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Eski (Old) Mosque of Edirne, built under Mehmed I when Edirne was the Ottoman capital; per the cited architecture survey, the page not yet checked."
  fr: "Ébauche de notice pour la mosquée Eski, ou Vieille Mosquée, d’Edirne, construite sous Mehmed Ier lorsque la ville était capitale ottomane ; selon l’étude architecturale citée, page non encore vérifiée."
  es: "Boceto de ficha para la Mezquita Antigua (Eski) de Edirne, construida bajo Mehmed I cuando Edirne era la capital otomana; según el estudio arquitectónico citado, la página aún no ha sido revisada."
  ur: "ایڈرن کی ایسکی ⁦(پرانی)⁩ مسجد کے لیے ڈرافٹ کارڈ، جو محمود اول کے تحت تعمیر کیا گیا تھا جب ایڈرن عثمانی دارالحکومت تھا۔ حوالہ کردہ آرکیٹیکچر سروے کے مطابق، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Edirne'deki eski cami için ön kart, Mehmed I döneminde inşa edilen cami ve Edirne, Osmanlı İmparatorluk Evi; Osmanlı mimarisi tarihine dair kaynaklarda bahsedilmekte ve sayfa henüz incelenmemiştir."
  id: "Kartu awal untuk masjid tua di Edirne, masjid yang dibangun pada masa pemerintahan Mehmed I dan Edirne, adalah Rumah Kekaisaran Ottoman; disebutkan dalam sumber sejarah arsitektur Ottoman dan halamannya belum ditinjau."
