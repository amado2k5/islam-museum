label: { ar: "مئذنة جامع حمزة بك في إيرد", en: "Minaret of the Hamza Bey Mosque, Érd", fr: "Minaret de la mosquée Hamza Bey, Érd", ur: "حمزہ بے مسجد کا مینار، ایرد", es: "Minarete de la mezquita Hamza Bey, Érd", tr: "Erid'deki Hamza Bek Camii minaresi", id: "Menara masjid Hamza Bek di Erid" }
summary:
  ar: "مئذنة من الحجر المنحوت في إيرد، كل ما بقي من جامع بُني في عهد سليمان القانوني في حصن حمزة بك ورممه إسماعيل باشا والي بودا في الستينيات من القرن السابع عشر، هدمه سيل 1838 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 189}."
  en: "A minaret of cut stone at Érd, all that remains of a mosque built under Süleyman in the palanka of Hamza Bey and repaired by İsmail Pasha, governor of Buda, in the 1660s; the mosque fell in the flood of 1838 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 189}."
  fr: "Minaret de pierre de taille à Érd, seul vestige d’une mosquée construite sous Soliman dans la palanka de Hamza Bey et réparée dans les années 1660 par İsmail Pasha, gouverneur de Buda ; la mosquée s’effondra lors de la crue de 1838 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 189}."
  ur: "ایرد میں تراشیدہ پتھر کا مینار، سلیمان قانونی کے عہد میں حمزہ بے کے قلعچے میں بنی مسجد کی واحد نشانی جس کی 1660 کی دہائی میں بودا کے حاکم اسماعیل پاشا نے مرمت کی؛ مسجد 1838ء کے سیلاب میں گری {cite:yilmaz-ottoman-architecture-hungary-2024 p. 189}۔"
  es: "Un minarete de piedra labrada en Érd, todo lo que queda de una mezquita construida bajo el mandato de Süleyman en la palanka de Hamza Bey y reparada por İsmail Pasha, gobernador de Buda, en la década de 1660; la mezquita se derrumbó en la inundación de 1838 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 189}."
  tr: "Erd'de oyulmuş taş bir minare. Süleyman Muhteşem döneminde Hamza Bey Kalesi'nde inşa edilen ve 1760'larda Buda valisi İsmail Paşa tarafından restore edilen bir caminin kalıntıları, 1838 selinde yıkıldı {cite:yilmaz-ottoman-architecture-hungary-2024, s. 189}."
  id: "Sebuah menara batu yang dipahat dari Erd. Semua sisa masjid yang dibangun pada masa pemerintahan Suleiman yang Agung di Benteng Hamza Bey dan dipugar oleh Ismail Pasha, gubernur Buda pada tahun 1760-an, dihancurkan dalam banjir tahun 1838 {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 189}."
