summary:
  ar: "مسجد مستطيل طوله 231 قدماً بثلاثة أروقة وثلاث وستين قبة متهدمة غرب المنارة في چهوتو پاندوا بإقليم هوگلي، من القرن الرابع عشر، أعمدته من البازلت المأخوذ من مبانٍ أقدم، وفي جدار قبلته واحد وعشرون محراباً {c(144)} {c(145)}."
  en: "An oblong mosque 231 feet long with three aisles and sixty-three fallen domes west of the minar at Chhoto Pandua in Hooghly district, of the fourteenth century, on basalt pillars from older buildings, with twenty-one mihrabs in its qibla wall {c(144)} {c(145)}."
  fr: "Mosquée oblongue de 231 pieds de long à trois nefs et soixante-trois coupoles effondrées, à l’ouest du minar de Chhoto Pandua dans le district de Hooghly, du XIVe siècle, sur des piliers de basalte provenant de bâtiments plus anciens, avec vingt et un mihrabs dans le mur de la qibla {c(144)} {c(145)}."
  ur: "ضلع ہگلی کے چھوٹو پنڈوا میں مینار کے مغرب میں 231 فٹ لمبی مستطیل مسجد، تین صفیں اور تریسٹھ گرے ہوئے گنبد، چودھویں صدی کی، پرانی عمارتوں کے بسالٹ ستونوں پر، قبلہ دیوار میں اکیس محرابیں {c(145)}۔"
  es: "Una mezquita oblonga de 231 pies de largo con tres naves y sesenta y tres cúpulas caídas al oeste del minarete en Chhoto Pandua en el distrito de Hooghly, del siglo XIV, sobre pilares de basalto de edificios más antiguos, con veintiún mihrabs en su muro de qibla {c(144)} {c(145)}."
