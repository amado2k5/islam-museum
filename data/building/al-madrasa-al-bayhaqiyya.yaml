label:
  ar: المدرسة البيهقية بنيسابور
  en: The Bayhaqiyya Madrasa of Nishapur
summary:
  ar: "المدرسة البيهقية بنيسابور، أول مدرسة حُفظ عنها خبرها في الإسلام؛ قال المقريزي إن أول من حُفظ عنه أنه بنى مدرسة أهل نيسابور فبُنيت بها البيهقية، وردّ بها السبكي والسيوطي على قول الذهبي إن نظام الملك أول من أنشأ المدارس، إذ كانت قائمة قبل أن يولد نظام الملك، وبناها أهل المدينة أو بعضهم على شرف بيهق ابن أبي بيهق الحاكم الذي كان له فيها وجاهة."
  en: "The Bayhaqiyya of Nishapur, the earliest madrasa whose report is preserved in Islam: al-Maqrizi holds that the people of Nishapur were the first recorded as building a madrasa; al-Subki and al-Suyuti cited it to rebut al-Dhahabi's claim that Nizam al-Mulk founded the first madrasas, for it stood before Nizam al-Mulk was born."
