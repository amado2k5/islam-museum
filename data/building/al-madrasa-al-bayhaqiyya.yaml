label:
  ar: المدرسة البيهقية بنيسابور
  en: The Bayhaqiyya Madrasa of Nishapur
  fr: "Madrasa Bayhaqiyya de Nishapur"
  es: "La madrasa Bayhaqiyya de Nishapur"
  ur: "نیشاپور کا بیہقیہ مدرسہ"
summary:
  ar: "المدرسة البيهقية بنيسابور، أول مدرسة حُفظ عنها خبرها في الإسلام؛ قال المقريزي إن أول من حُفظ عنه أنه بنى مدرسة أهل نيسابور فبُنيت بها البيهقية، وردّ بها السبكي والسيوطي على قول الذهبي إن نظام الملك أول من أنشأ المدارس، إذ كانت قائمة قبل أن يولد نظام الملك، وبناها أهل المدينة أو بعضهم على شرف بيهق ابن أبي بيهق الحاكم الذي كان له فيها وجاهة."
  en: "The Bayhaqiyya of Nishapur, the earliest madrasa whose report is preserved in Islam: al-Maqrizi holds that the people of Nishapur were the first recorded as building a madrasa; al-Subki and al-Suyuti cited it to rebut al-Dhahabi's claim that Nizam al-Mulk founded the first madrasas, for it stood before Nizam al-Mulk was born."
  fr: "La Bayhaqiyya de Nishapur, la plus ancienne madrasa dont le témoignage soit conservé dans l’islam : al-Maqrizi affirme que les habitants de Nishapur sont les premiers dont il soit rapporté qu’ils construisirent une madrasa ; al-Subki et al-Suyuti la citèrent pour réfuter l’affirmation d’al-Dhahabi selon laquelle Nizam al-Mulk aurait fondé les premières madrasas, puisqu’elle existait avant sa naissance."
  es: "La Bayhaqiyya de Nishapur, la madrasa más antigua de la que se conserva un relato en el Islam: al-Maqrizi sostiene que los habitantes de Nishapur fueron los primeros en construir una madrasa; al-Subki y al-Suyuti la citaron para refutar la afirmación de al-Dhahabi de que Nizam al-Mulk fundó las primeras madrasas, ya que existía antes de que Nizam al-Mulk naciera."
  ur: "نیشاپور کی بیہقیہ، قدیم ترین مدرسہ جس کی رپورٹ اسلام میں محفوظ ہے: المقرزی کا خیال ہے کہ نیشاپور کے لوگ سب سے پہلے مدرسہ بنانے کے لیے درج تھے۔ السبکی اور السیوطی نے الذہبی کے اس دعوے کی تردید کے لیے اس کا حوالہ دیا کہ نظام الملک نے پہلے مدارس کی بنیاد رکھی، کیونکہ یہ نظام الملک کی پیدائش سے پہلے قائم تھا۔"
