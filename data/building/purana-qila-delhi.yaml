summary:
  ar: "قلعة على نهر جمنا في دلهي يعرّفها ناث بأنها «دين پناه» التي أسسها همايون في محرم 940هـ ⁦(أغسطس 1533)⁩ وتمت أسوارها وأبوابها نحو 1534، وتنسب عادة إلى شير شاه {cite:nath-history-of-mughal-architecture-1-1982 p. 134} {cite:nath-history-of-mughal-architecture-1-1982 p. 136}."
  en: "A citadel on the Yamuna at Delhi which Nath identifies with Din-panah, founded by Humayun in Muharram 940 (August 1533) with its walls and gates nearly finished by May 1534, and which is usually ascribed to Sher Shah {cite:nath-history-of-mughal-architecture-1-1982 p. 134} {cite:nath-history-of-mughal-architecture-1-1982 p. 136}."
  ur: "دہلی میں جمنا کنارے قلعہ جسے ناتھ ہمایوں کی «دین پناہ» قرار دیتے ہیں، جس کی بنیاد محرم 940ھ ⁦(اگست 1533)⁩ میں پڑی اور فصیل و دروازے مئی 1534ء تک قریب التکمیل تھے؛ عموماً شیر شاہ سے منسوب {cite:nath-history-of-mughal-architecture-1-1982 p. 136}۔"
