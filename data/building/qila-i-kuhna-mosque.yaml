id: building/qila-i-kuhna-mosque
class: building
kind: mosque
label: { ar: "مسجد قلعة كهنه", en: "Qila-i-Kuhna Mosque, Delhi", ur: "قلعۂ کہنہ مسجد، دہلی" }
summary:
  ar: "مسجد ذو خمسة عقود في القلعة القديمة بدلهي، ينسب عادة إلى شير شاه، ويرى ناث أن همايون بدأه مع دين پناه سنة 1533 وأنه أُتم في أوائل عهد أكبر؛ تميزه التطعيمات الملونة بالرخام والحجر الأحمر والنقوش القرآنية الكثيرة {cite:nath-history-of-mughal-architecture-1-1982 p. 160} {cite:nath-history-of-mughal-architecture-1-1982 p. 169} {cite:nath-history-of-mughal-architecture-1-1982 p. 171}."
  en: "A five-arched mosque in the Purana Qila, Delhi, usually ascribed to Sher Shah; Nath argues that Humayun began it with Din-panah in 1533 and that it was finished early in Akbar's reign; it is marked by coloured inlay of marble and red stone and abundant Qur'anic inscriptions {cite:nath-history-of-mughal-architecture-1-1982 p. 160} {cite:nath-history-of-mughal-architecture-1-1982 p. 169} {cite:nath-history-of-mughal-architecture-1-1982 p. 171}."
  ur: "پرانے قلعے دہلی میں پانچ محرابوں کی مسجد، عموماً شیر شاہ سے منسوب؛ ناتھ کے نزدیک ہمایوں نے 1533ء میں دین پناہ کے ساتھ اسے شروع کیا اور یہ اکبر کے ابتدائی عہد میں مکمل ہوئی؛ رنگین پچی کاری اور کثیر قرآنی کتبے اس کی پہچان ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 169} {cite:nath-history-of-mughal-architecture-1-1982 p. 171}۔"
