summary:
  ar: "حمّام حراري على ضفة الدانوب تحت تل گلرت ببودا، بناه صوقوللي مصطفى باشا سنة 1556 بقبة قطرها عشرة أمتار، وهو أفخم الحمّامات التركية في المجر، وما زال عاملاً {cite:yilmaz-ottoman-architecture-hungary-2024 p. 45}."
  en: "A thermal bath on the Danube below Gellért Hill in Buda, built by Sokollu Mustafa Pasha in 1556 under a dome ten metres across, the most sumptuous Turkish bath in Hungary and still in use {cite:yilmaz-ottoman-architecture-hungary-2024 p. 45}."
  fr: "Bains thermaux du Danube sous Gellért, bâtis en 1556 par Sokollu Mustafa Pacha, coupole de dix mètres ; les plus somptueux bains turcs de Hongrie, toujours actifs. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 45}"
  ur: "بودا میں گیلرٹ پہاڑی کے نیچے دریائے ڈینیوب کے کنارے گرم پانی کا حمام، صوقوللو مصطفیٰ پاشا نے 1556ء میں دس میٹر قطر کے گنبد کے ساتھ بنوایا؛ ہنگری کا شاندار ترین ترکی حمام، اب بھی چالو {cite:yilmaz-ottoman-architecture-hungary-2024 p. 45}۔"
  es: "Un baño termal en el Danubio, debajo de la colina Gellért en Buda, construido por Sokollu Mustafa Pasha en 1556 bajo una cúpula de diez metros de diámetro, el baño turco más suntuoso de Hungría y que todavía está en uso {cite:yilmaz-ottoman-architecture-hungary-2024 p. 45}."
