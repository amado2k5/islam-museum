summary:
  ar: "بطاقة أولية لجامع جزره الكبير ومدرسته في جنوب شرق تركيا — مجمع جامع ومدرسة تنسبه نقوشه المسجلة في قاموس النقوش الإسلامية إلى القرن السادس الهجري ⁦(نقش المنارة نحو ٥٥٠هـ ونقش البوابة ٥٥٥هـ)⁩ مع نص تأسيس مؤرخ ٧٣٠هـ."
  en: "Draft card for the Great Mosque and Madrasa of Cizre in south-eastern Turkey — a mosque-madrasa complex whose inscriptions recorded in the Islamic Epigraphy Thesaurus date its minaret to c. 550 AH / 1155-1156 CE, its portal to 555 AH / 1160 CE, and carry a foundation text of 730 AH / 1329-1330 CE."
  fr: "Notice provisoire : Grande Mosquée et madrasa de Cizre, dans le sud-est de la Turquie, complexe de mosquée-madrasa dont les inscriptions enregistrées dans l’Islamic Epigraphy Thesaurus datent le minaret d’environ 550 H / 1155-1156 ap. J.-C. et le portail de 555 H / 1160 ap. J.-C., et comportent un texte de fondation de 730 H / 1329-1330 ap. J.-C."
  es: "Boceto de ficha para la Gran Mezquita y Madrasa de Cizre, en el sureste de Turquía: un complejo de mezquita y madrasa cuyas inscripciones registradas en el Tesauro de Epigrafía Islámica datan su minarete en c. 550 AH / 1155-1156 d. C., su portal en 555 AH / 1160 d. C., y contienen un texto fundacional de 730 AH / 1329-1330 d. C."
  ur: "جنوب مشرقی ترکی میں عظیم مسجد اور سیزر کے مدرسے کے لیے ڈرافٹ کارڈ - ایک مسجد-مدرسہ کمپلیکس جس کے نوشتہ جات اسلامی ایپی گرافی تھیسورس میں درج ہیں اس کے مینار کی تاریخ سی۔ 550 ہجری / 1155-1156 عیسوی، اس کا پورٹل 555 ہجری / 1160 عیسوی تک، اور 730 ہجری / 1329-1330 عیسوی کی بنیاد کا متن رکھتا ہے۔"
  tr: "Türkiye'nin güneydoğusundaki Gezer Büyük Camii ve okulunun ön kartı — İslami Yazıtlar Sözlüğü'nde yazıtlarıyla 6. yüzyıla (minare yazıtı yaklaşık 550 H ve kapı yazıtı 555 Hicri) atfedilen ve kurucu metni 730 H tarihli bir komplekstir."
  id: "Kartu pendahuluan Masjid Agung Gezer dan sekolahnya di tenggara Turki — sebuah kompleks masjid dan sekolah yang diatributkan melalui prasasti yang tercatat dalam Kamus Prasasti Islam pada abad ke-6 H (prasasti menara sekitar 550 H dan prasasti gerbang 555 H) dengan teks pendirian bertanggal 730 H."
