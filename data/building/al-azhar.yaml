summary:
  ar: "الجامع الأزهر بالقاهرة، أرساه الفاطميون جامعاً لدعوتهم ثم حوّله الوزير يعقوب بن كلس في سنة 378هـ إلى جامعة تدرس فيها العلوم والآداب بعد أن كان مقصوراً على إقامة الدعوة الفاطمية، فصار من أهم مراكز الثقافة في مصر مع مسجدي عمرو وابن طولون والحاكم."
  en: "Al-Azhar at Cairo: founded by the Fatimids as the mosque of their da'wa, then turned by the vizier Ya'qub ibn Killis in 378 into a university teaching the sciences and letters — from a pulpit reserved for the Fatimid call into one of Egypt's foremost centres of learning beside the mosques of Amr, Ibn Tulun and al-Hakim."
