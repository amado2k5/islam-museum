id: building/dar-al-fulful-fustat
class: building
kind: other
label:
  ar: دار الفلفل بالفسطاط
  en: The Pepper House (Dar al-Fulful), al-Fustat
  fr: "Maison du poivre (Dar al-Fulful), Fustat"
  ur: دار الفلفل، فسطاط
  es: "La Casa de la Pimienta (Dar al-Fulful), al-Fustat"
  tr: "Fustat'taki Dar Al-Filf"
  id: "Dar Al-Filf di Fustat"
summary:
  ar: دار بالفسطاط في قبلة المسجد، تُنسب إلى قيس بن سعد في ولايته لعلي، ويقال كانت لنافع بن عبد القيس أو لسعد بن أبي وقاص؛ وسُمّيت دار الفلفل لأن أسامة بن زيد التنوخي خزن فيها فلفلاً بعشرين ألف دينار أراد الوليد بن عبد الملك أن يهديه إلى صاحب الروم {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}.
  en: A house in al-Fustat on the qibla side of the mosque, attributed to Qays ibn Sa'd during his governorship for Ali, or else to Nafi' ibn Abd al-Qays or Sa'd ibn Abi Waqqas; named the Pepper House because Usama ibn Zayd al-Tanukhi stored in it pepper worth twenty thousand dinars that al-Walid ibn Abd al-Malik meant as a gift to the Byzantine ruler {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}.
  fr: "Maison de Fustat du côté de la qibla de la mosquée, attribuée à Qays ibn Sa’d pendant son gouvernement pour Ali, ou à Nafi’ ibn Abd al-Qays ou Sa’d ibn Abi Waqqas ; nommée Maison du poivre parce qu’Usama ibn Zayd al-Tanukhi y entreposa du poivre d’une valeur de vingt mille dinars qu’al-Walid ibn Abd al-Malik destinait au souverain byzantin {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}."
  ur: فسطاط میں مسجد کی قبلہ کی جانب ایک گھر، جو علی کی طرف سے قیس بن سعد کی ولایت سے منسوب ہے، یا نافع بن عبد القیس یا سعد بن ابی وقاص سے؛ دار الفلفل اس لیے کہلایا کہ اسامہ بن زید تنوخی نے اس میں بیس ہزار دینار کی کالی مرچ رکھی جو ولید بن عبد الملک رومی بادشاہ کو تحفہ بھیجنا چاہتے تھے {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}۔
  es: "Una casa en al-Fustat en el lado de la qibla de la mezquita, atribuida a Qays ibn Sa'd durante su gobierno para Ali, o bien a Nafi' ibn Abd al-Qays o Sa'd ibn Abi Waqqas; llamada la Casa de la Pimienta porque Usama ibn Zayd al-Tanukhi almacenó en ella pimienta por valor de veinte mil dinares que al-Walid ibn Abd al-Malik pretendía regalar al gobernante bizantino {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}."
  tr: "Caminin kıblesine yakın Fustat'ta bir ev, Ali valiliği döneminde Qays ibn Sa'd'a atfedilen bir evdir. Ayrıca Nafi' ibn Abd al-Kais veya Sa'd ibn Abi Waqqas'a ait olduğu söylenir; Dar al-Filf olarak adlandırılmıştır çünkü Usama ibn Zayd al-Tanukhi orada yirmi bin dinar değerinde karabiber depolamıştır ve al-Walid ibn Abd al-Malik, bunu Romalıların hükümdarına hediye etmek istemiştir {cite:futuh-misr-amir-1999, s. 141} {cite:futuh-misr-amir-1999, s. 142}."
  id: "Sebuah rumah di Fustat dekat qibla masjid, yang dikaitkan dengan Qays ibn Sa'd selama masa pemerintahannya di Ali. Rumah ini juga dikatakan milik Nafi' ibn Abd al-Qais atau Sa'd ibn Abi Waqqas; rumah ini disebut Dar al-Filf karena Usama ibn Zayd al-Tanukhi menyimpan lada senilai dua puluh ribu dinar di sana, yang ingin diberikan al-Walid ibn Abd al-Malik kepada penguasa bangsa Romawi {cite:futuh-misr-amir-1999, hlm. 141} {cite:futuh-misr-amir-1999, hlm. 142}."
