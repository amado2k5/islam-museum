id: building/dar-al-fulful-fustat
class: building
kind: other
label:
  ar: دار الفلفل بالفسطاط
  en: The Pepper House (Dar al-Fulful), al-Fustat
  ur: دار الفلفل، فسطاط
summary:
  ar: دار بالفسطاط في قبلة المسجد، تُنسب إلى قيس بن سعد في ولايته لعلي، ويقال كانت لنافع بن عبد القيس أو لسعد بن أبي وقاص؛ وسُمّيت دار الفلفل لأن أسامة بن زيد التنوخي خزن فيها فلفلاً بعشرين ألف دينار أراد الوليد بن عبد الملك أن يهديه إلى صاحب الروم {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}.
  en: A house in al-Fustat on the qibla side of the mosque, attributed to Qays ibn Sa'd during his governorship for Ali, or else to Nafi' ibn Abd al-Qays or Sa'd ibn Abi Waqqas; named the Pepper House because Usama ibn Zayd al-Tanukhi stored in it pepper worth twenty thousand dinars that al-Walid ibn Abd al-Malik meant as a gift to the Byzantine ruler {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}.
  ur: فسطاط میں مسجد کی قبلہ کی جانب ایک گھر، جو علی کی طرف سے قیس بن سعد کی ولایت سے منسوب ہے، یا نافع بن عبد القیس یا سعد بن ابی وقاص سے؛ دار الفلفل اس لیے کہلایا کہ اسامہ بن زید تنوخی نے اس میں بیس ہزار دینار کی کالی مرچ رکھی جو ولید بن عبد الملک رومی بادشاہ کو تحفہ بھیجنا چاہتے تھے {cite:futuh-misr-amir-1999 p. 141} {cite:futuh-misr-amir-1999 p. 142}۔
