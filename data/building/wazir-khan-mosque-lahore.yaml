  ur: "لاہور کی وزیر خان مسجد کے لیے ڈرافٹ کارڈ، مغل اجتماعی مسجد جو اپنی سجاوٹ کے لیے مشہور ہے، جسے گورنر وزیر خان نے 1641 میں تعمیر کیا تھا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Lahor'daki Wazir Khan Camii'nin ön kartı, seramik süslemeleriyle ünlü Babür Camii, 1641 yılında Lahor hükümdarı Vezir Han tarafından inşa edilmiştir; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan Masjid Wazir Khan di Lahore, masjid Mughal yang terkenal dengan dekorasi keramiknya, dibangun oleh penguasa Lahore, Wazir Khan pada tahun 1641 M; sumber-sumbernya di halaman tersebut belum ditinjau."
