id: building/shaykh-al-tusi-mosque-najaf
class: building
kind: mosque
label:
  ar: "مسجد الشيخ الطوسي"
  en: "Shaykh al-Tusi Mosque, Najaf"
  fr: "Mosquée Shaykh al-Tusi, Najaf"
  es: "Mezquita Shaykh al-Tusi, Nayaf"
  ur: "شیخ الطوسی مسجد، نجف"
summary:
  ar: "مسجد الشيخ الطوسي بالنجف؛ تذكر «موسوعة العتبات» أن باب الطوسي — الباب الشمالي لصحن العتبة العلوية — سُمّي باسم شيخ الطائفة أبي جعفر محمد الطوسي المتوفى سنة ٤٦٠هـ، ويؤدي إلى شارع الطوسي وفيه مسجد الطوسي الذي يضم قبر الشيخ {cite:musawat-atabat}."
  en: "The Shaykh al-Tusi Mosque of Najaf; the Mawsu'at al-Atabat records that the Bab al-Tusi — the north gate of the Imam Ali shrine's court — is named for Shaykh al-Ta'ifa Abu Ja'far Muhammad al-Tusi (d. 460 AH), and leads into Tusi street where the Tusi mosque holds the Shaykh's tomb {cite:musawat-atabat}."
  fr: "Selon la Mawsu’at al-Atabat, Bab al-Tusi, porte nord de la cour du sanctuaire de l’imam Ali, nommée pour Abu Ja’far Muhammad al-Tusi mort en 460 H, mène à la rue et mosquée contenant sa tombe. {cite:musawat-atabat}"
  es: "La mezquita Shaykh al-Tusi de Najaf; el Mawsu'at al-Atabat registra que el Bab al-Tusi —la puerta norte del patio del santuario del Imam Ali— lleva el nombre de Shaykh al-Ta'ifa Abu Ja'far Muhammad al-Tusi (m. 460 AH) y conduce a la calle Tusi donde la mezquita Tusi alberga la tumba del Shaykh {cite:musawat-atabat}."
  ur: "نجف کی شیخ الطوسی مسجد؛ موصوف الاطباط نے ریکارڈ کیا ہے کہ باب الطوسی — امام علی کے مزار کا شمالی دروازہ — کا نام شیخ الطائفہ ابو جعفر محمد الطوسی ⁦(متوفی 460 ہجری)⁩ کے نام پر رکھا گیا ہے اور یہ طوسی گلی کی طرف جاتا ہے جہاں طوسی مسجد میں شیخ کا مقبرہ ہے۔"
