summary:
  ar: "مسجد الشيخ الطوسي بالنجف؛ تذكر «موسوعة العتبات» أن باب الطوسي — الباب الشمالي لصحن العتبة العلوية — سُمّي باسم شيخ الطائفة أبي جعفر محمد الطوسي المتوفى سنة ٤٦٠هـ، ويؤدي إلى شارع الطوسي وفيه مسجد الطوسي الذي يضم قبر الشيخ {cite:musawat-atabat}."
  en: "The Shaykh al-Tusi Mosque of Najaf; the Mawsu'at al-Atabat records that the Bab al-Tusi — the north gate of the Imam Ali shrine's court — is named for Shaykh al-Ta'ifa Abu Ja'far Muhammad al-Tusi (d. 460 AH), and leads into Tusi street where the Tusi mosque holds the Shaykh's tomb {cite:musawat-atabat}."
