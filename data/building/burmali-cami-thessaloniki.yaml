summary:
  ar: "مسجد من القرن الخامس عشر بقبة واحدة عند باب وردار في سالونيك، بناها بحسب وثيقة 1784 الحاج علي ابن مشّاط السلطان مراد، صودرت وجُعلت كنيسة سنة 1912، ثم هُدمت بعد حريق 1917 وبني مكانها فندق {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  en: "A fifteenth-century single-domed mosque at the Vardar Gate of Thessaloniki, built according to a document of 1784 by Hajji Ali, son of Sultan Murad's comb-maker; seized and made a church in 1912, then demolished after the fire of 1917 and replaced by a hotel {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  ur: "سالونیکا کے وردار دروازے پر پندرھویں صدی کی ایک گنبد والی مسجد، 1784ء کی دستاویز کے مطابق سلطان مراد کے کنگھی ساز کے بیٹے حاجی علی کی بنوائی؛ 1912ء میں ضبط ہو کر گرجا بنی، پھر 1917ء کی آگ کے بعد ڈھا کر ہوٹل بنا {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}۔"
