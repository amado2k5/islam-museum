label: { ar: "الجامع البرمالي عند باب وردار في سالونيك", en: "Burmalı Cami, Vardar Gate, Thessaloniki", fr: "Burmalı Cami, porte du Vardar, Thessalonique", ur: "برمالی جامع، وردار دروازہ، سالونیکا", es: "Burmalı Cami, Puerta Vardar, Salónica", tr: "Selanik'teki Bab Wardar'daki Barmali Camii", id: "Masjid Barmali di Bab Wardar, Thessaloniki" }
summary:
  ar: "مسجد من القرن الخامس عشر بقبة واحدة عند باب وردار في سالونيك، بناها بحسب وثيقة 1784 الحاج علي ابن مشّاط السلطان مراد، صودرت وجُعلت كنيسة سنة 1912، ثم هُدمت بعد حريق 1917 وبني مكانها فندق {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  en: "A fifteenth-century single-domed mosque at the Vardar Gate of Thessaloniki, built according to a document of 1784 by Hajji Ali, son of Sultan Murad's comb-maker; seized and made a church in 1912, then demolished after the fire of 1917 and replaced by a hotel {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  fr: "Mosquée du XVe siècle à coupole unique à la porte du Vardar de Thessalonique, construite selon un document de 1784 par Hajji Ali, fils du fabricant de peignes du sultan Murad ; saisie et transformée en église en 1912, puis démolie après l’incendie de 1917 et remplacée par un hôtel {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  ur: "سالونیکا کے وردار دروازے پر پندرھویں صدی کی ایک گنبد والی مسجد، 1784ء کی دستاویز کے مطابق سلطان مراد کے کنگھی ساز کے بیٹے حاجی علی کی بنوائی؛ 1912ء میں ضبط ہو کر گرجا بنی، پھر 1917ء کی آگ کے بعد ڈھا کر ہوٹل بنا {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}۔"
  es: "Una mezquita de una sola cúpula del siglo XV en la Puerta Vardar de Tesalónica, construida según un documento de 1784 por Hajji Ali, hijo del fabricante de peines del sultán Murad; confiscada y convertida en iglesia en 1912, luego demolida después del incendio de 1917 y reemplazada por un hotel {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1293}."
  tr: "Selanik'teki Bab Wardar'da, 1784 tarihli Hac Ali bin Meşet Sultan Murad belgesine göre inşa edilmiş, tek kubbeli 15. yüzyıldan kalma bir cami 1912'de el konulmuş ve kiliseye dönüştürülmüş, 1917'de çıkan yangından sonra yıkılmış ve yerine bir otel yapılmıştır {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 s. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 s. 1293}."
  id: "Sebuah masjid abad ke-15 dengan satu kubah di Bab Wardar, Thessaloniki, dibangun sesuai dokumen tahun 1784 oleh Hajj Ali ibn Mashat Sultan Murad, disita dan diubah menjadi gereja pada tahun 1912, kemudian dihancurkan setelah kebakaran pada tahun 1917 dan digantikan oleh hotel {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 hlm. 1292} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 hlm. 1293}."
