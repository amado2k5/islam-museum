label:
  ar: حائط البراق (الحائط الغربي)
  en: The Western Wall (Buraq Wall)
summary:
  ar: "الحائط الغربي للحرم الشريف في القدس، يسميه المسلمون حائط البراق ويسميه اليهود حائط المبكى، وهو جزء من جدار الحرم لا يتجزأ، وطوله يزيد على مئة متر وعلوه نحو عشرين مترا؛ ويرجع أغلب علماء الآثار أسفله إلى زمن هيكل هيرودس، كما عرضته لجنة 1930م {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 77}. وظلت إدارة فلسطين تنظم الصلاة اليهودية عنده بإجراءات محدودة في السنوات 1925 و1928 و1929م، وتكررت الشكاوى من المقاعد والستائر والمصابيح، وفي 1928م صدر الكتاب الأبيض الذي يقرر الحالة الراهنة {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 141}{cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 168}."
  en: "The western wall of the Haram al-Sharif in Jerusalem, called the Buraq Wall by Muslims and the Wailing Wall by Jews; over 100 m long and some 20 m high, its lowest courses attributed by most archaeologists to the Herodian period (per the 1930 report). Worship there was regulated by the Mandate administration from 1925 to 1929, under the status quo of the 1928 White Paper. Source: Imara's book, quoting the report."
