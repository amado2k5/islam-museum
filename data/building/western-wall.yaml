label:
  ar: حائط البراق ⁦(الحائط الغربي)⁩
  en: The Western Wall (Buraq Wall)
  fr: "Mur occidental (mur al-Buraq)"
  es: "El Muro Occidental (Muro de Buraq)"
  ur: "مغربی دیوار ⁦(دیوار براق)⁩"
  tr: "Buraq Duvarı (Batı Duvarı)"
  id: "Tembok Buraq (Tembok Barat)"
summary:
  ar: "الحائط الغربي للحرم الشريف في القدس، يسميه المسلمون حائط البراق ويسميه اليهود حائط المبكى، وهو جزء من جدار الحرم لا يتجزأ، وطوله يزيد على مئة متر وعلوه نحو عشرين مترا؛ ويرجع أغلب علماء الآثار أسفله إلى زمن هيكل هيرودس، كما عرضته لجنة 1930م {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 77}. وظلت إدارة فلسطين تنظم الصلاة اليهودية عنده بإجراءات محدودة في السنوات 1925 و1928 و1929م، وتكررت الشكاوى من المقاعد والستائر والمصابيح، وفي 1928م صدر الكتاب الأبيض الذي يقرر الحالة الراهنة {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 141}{cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 168}."
  en: "The western wall of the Haram al-Sharif in Jerusalem, called the Buraq Wall by Muslims and the Wailing Wall by Jews; over 100 m long and some 20 m high, its lowest courses attributed by most archaeologists to the Herodian period (per the 1930 report). Worship there was regulated by the Mandate administration from 1925 to 1929, under the status quo of the 1928 White Paper. Source: Imara's book, quoting the report."
  fr: "Mur du Haram al-Sharif de Jérusalem, al-Buraq musulman, Lamentations juif ; plus de cent mètres sur vingt, assises basses hérodiennes pour la plupart des archéologues selon le rapport de 1930 cité par Imara. Prière réglementée en 1925–1929 sous le statu quo du Livre blanc de 1928."
  es: "El muro occidental del Haram al-Sharif en Jerusalén, conocido como el Muro de Buraq por los musulmanes y el Muro de las Lamentaciones por los judíos, mide más de 100 metros de largo y unos 20 metros de alto. La mayoría de los arqueólogos atribuyen sus tramos inferiores al período herodiano (según el informe de 1930). El culto en este lugar estuvo regulado por la administración del Mandato Británico entre 1925 y 1929, bajo el statu quo del Libro Blanco de 1928. Fuente: Libro de Imara, citando el informe."
  ur: "یروشلم میں حرم الشریف کی مغربی دیوار جسے مسلمان براق دیوار کہتے ہیں اور یہودیوں کی طرف سے نوحہ کناں دیوار؛ 100 میٹر سے زیادہ لمبا اور کچھ 20 میٹر اونچا، اس کے سب سے نچلے کورس کو زیادہ تر ماہرین آثار قدیمہ نے ہیروڈین دور سے منسوب کیا ہے ⁦(1930 کی رپورٹ کے مطابق)⁩۔ وہاں کی عبادت کو مینڈیٹ انتظامیہ نے 1925 سے 1929 تک 1928 کے وائٹ پیپر کے جمود کے تحت منظم کیا تھا۔ ماخذ: امارا کی کتاب، رپورٹ کے حوالے سے۔"
  tr: "Kudüs'teki Asil Kutsal Yer'in Batı Duvarı, Müslümanlar ve Yahudiler tarafından Ağıt Duvarı olarak Buraq Duvarı olarak adlandırılır. Haram duvarının ayrılmaz bir parçasıdır; uzunluğu yüz metreden fazla ve yüksekliği yaklaşık yirmi metredir; çoğu arkeolog, bodrumunu 1930 komitesi tarafından sunulan Hirodes Tapınağı zamanına kadar izler {cite:al-quds-bayn-al-yahudiyya-wal-Islam-azhar, s. 77}. Filistin yönetimi, 1925, 1928 ve 1929 yıllarında sınırlı önlemlerle burada Yahudi dualarını düzenlemeye devam etti; koltuklar, perdeler ve lambalarla ilgili tekrar eden şikayetler oldu. 1928'de Beyaz Kitap yayımlandı ve mevcut durumu ortaya koydu {cite:al-quds-bayn-al-yahudiyya-wal-islam-ezhar s. 141} {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar s. 168}."
  id: "Tembok Barat Tempat Suci Mulia di Yerusalem disebut Tembok Buraq oleh Muslim dan Yahudi oleh Tembok Ratapan. Tembok ini merupakan bagian integral dari Tembok Haram, berukuran lebih dari seratus meter panjang dan sekitar dua puluh meter tinggi; sebagian besar arkeolog menelusuri ruang bawah tanahnya ke masa Bait Herodes, sebagaimana disajikan oleh komite tahun 1930 {cite:al-quds-bayn-al-yahudiyya-wal-Islam-azhar, hlm. 77}. Pemerintahan Palestina terus mengorganisir doa Yahudi di sana dengan langkah-langkah terbatas pada tahun 1925, 1928, dan 1929, dengan keluhan berulang tentang kursi, tirai, dan lampu. Pada tahun 1928, Buku Putih diterbitkan, yang menetapkan situasi saat ini {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar hlm. 141} {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar hlm. 168}."
