summary:
  ar: "بطاقة أولية لمسجد شيرامان جمعة بكودونغلور في كيرلا، الجامع الذي يروى أنه أول مسجد في الهند وأسسه تلاميذ مالك بن دينار في القرن السابع؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Cheraman Juma Masjid of Kodungallur in Kerala, held to be the first mosque of India and founded by disciples of Malik ibn Dinar in the seventh century; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Cheraman Juma de Kodungallur, au Kerala, tenue pour la première d’Inde, fondée au VIIe siècle par des disciples de Malik ibn Dinar. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la mezquita Cheraman Juma Masjid de Kodungallur en Kerala, considerada la primera mezquita de la India y fundada por discípulos de Malik ibn Dinar en el siglo VII; sus fuentes aún no han sido verificadas en la página."
  ur: "کیرالہ میں کوڈنگلور کی چیرامن جمعہ مسجد کے لیے ڈرافٹ کارڈ، جسے ہندوستان کی پہلی مسجد سمجھا جاتا ہے اور ساتویں صدی میں مالک ابن دینار کے شاگردوں نے اس کی بنیاد رکھی تھی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kerala, Codungalur'daki Shiraman Juma Camii için ön kart, Hindistan'ın ilk camisi olduğu söylenen ve yedinci yüzyılda Malik bin Dinar'ın öğrencileri tarafından kurulmuştur; sayfadaki kaynaklar henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Masjid Shiraman Juma di Codungalur, Kerala, masjid yang dikatakan sebagai masjid pertama di India dan didirikan oleh murid-murid Malik bin Dinar pada abad ketujuh; sumber-sumbernya di halaman tersebut belum ditinjau."
