label: { ar: "سبز برج في دلهي", en: "Sabz Burj (Green Tower), Delhi", ur: "سبز برج، دہلی" }
summary:
  ar: "ضريح ذو مسقط مربع مثمن الزوايا وقبة بصلية عالية مزدوجة مكسوة بالقيشاني الأزرق والأخضر عند تقاطع طريقي متهرا ولودي في دلهي، يراه ناث أول مثال مكتمل في الهند لهذا المسقط وللقبة البصلية العالية، ويؤرخه بنحو 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 198} {cite:nath-history-of-mughal-architecture-1-1982 p. 199} {cite:nath-history-of-mughal-architecture-1-1982 p. 200} {cite:nath-history-of-mughal-architecture-1-1982 p. 201}."
  en: "A tomb of octagonalised-square plan with a high bulbous double dome covered in blue and green tile, at the crossing of the Mathura and Lodi roads in Delhi; for Nath the first fully developed Indian example of that plan and of the high bulbous dome, of about 1560 {cite:nath-history-of-mughal-architecture-1-1982 p. 198} {cite:nath-history-of-mughal-architecture-1-1982 p. 199} {cite:nath-history-of-mughal-architecture-1-1982 p. 200} {cite:nath-history-of-mughal-architecture-1-1982 p. 201}."
  ur: "دہلی میں متھرا روڈ اور لودی روڈ کے سنگم پر ہشت پہلو مربع نقشے کا مقبرہ جس کا اونچا پیازی دوہرا گنبد نیلی اور سبز کاشی سے ڈھکا ہے؛ ناتھ کے نزدیک اس نقشے اور اونچے پیازی گنبد کی ہندوستان میں پہلی مکمل مثال، تقریباً 1560ء {cite:nath-history-of-mughal-architecture-1-1982 p. 200}۔"
