  en: The Mu'ayyadi Bimaristan of Wasit
summary:
  ar: "بيمارستان افتُتح بواسط يوم الثلاثاء لخمس عشرة ليلة بقيت من ذي القعدة سنة ٤١٣، بناه مؤيد الملك أبو علي الحسن الراكجي وزير مشرف الدولة؛ وحُملت إليه الأدوية والأشربة، وجُعل فيه خازن وأطباء ووكلاء، ووقفت عليه أوقاف {cite:muntazam-ibn-al-jawzi j.8 p.350}. وفي وفاة مؤسسه سنة ٤٣٤ ذُكر أنه أحدث هذا البيمارستان وأنكر عليه كثيرون وقالوا يُهلك الأموال في غير طائل، وكان عاقلًا جامعًا للعلم والأدب {cite:muntazam-ibn-al-jawzi j.8 p.458}."
  en: "A hospital opened in Wasit on a Tuesday, with fifteen nights of Dhu al-Qa'da 413 remaining, built by Mu'ayyad al-Mulk Abu Ali al-Hasan al-Rakiji, vizier of Musharraf al-Dawla. Medicines and syrups were brought to it, a storekeeper, physicians and agents were assigned to it, and endowments were set aside for it {cite:muntazam-ibn-al-jawzi j.8 p.350}. On the death of its founder in 434 it is recorded that he had founded this hospital, that many objected and said he was squandering money to no purpose, and that he was a sensible man who combined learning and letters {cite:muntazam-ibn-al-jawzi j.8 p.458}."
