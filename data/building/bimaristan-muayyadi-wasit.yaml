label:
  ar: البيمارستان المؤيدي بواسط
  en: The Mu'ayyadi Bimaristan of Wasit
  fr: "Bimaristan Mu’ayyadi de Wasit"
  es: "El Mu'ayyadi Bimaristan de Wasit"
  ur: "وصیت کا معیادی بیمارستان"
  tr: "Al-Bimaristan Al-Muayyadi tarafından"
  id: "Al-Bimaristan Al-Muayyadi oleh"
summary:
  ar: "بيمارستان افتُتح بواسط يوم الثلاثاء خامس عشر ذي القعدة سنة 413، بناه مؤيد الملك أبو علي الحسن الرخجي وزير مشرف الدولة؛ وحُملت إليه الأدوية والأشربة، ورُتّب له خُزّان وأطباء ووكلاء، ووُقفت عليه أوقاف، وجُعلت له مشاهرة على المعاملات السلطانية {cite:muntazam-ibn-al-jawzi j.8 p.350}."
  en: "A hospital opened in Wasit on Tuesday, the fifteenth of Dhu al-Qa'da 413 AH, built by Mu'ayyad al-Mulk Abu 'Ali al-Hasan al-Rukhkhi, vizier of Musharraf al-Dawla. Medicines and syrups were brought to it, a storekeeper, physicians and agents were assigned to it, endowments were set aside for it, and a monthly allowance was set on the sultan's accounts {cite:muntazam-ibn-al-jawzi j.8 p.350}."
  fr: "Hôpital ouvert à Wasit le mardi 15 dhou al-qa’da 413 H, construit par Mu’ayyad al-Mulk Abu Ali al-Hasan al-Rukhkhi, vizir de Musharraf al-Dawla. Médicaments et sirops y furent apportés, un magasinier, des médecins et des agents y furent affectés, des biens furent constitués en waqf pour lui et une allocation mensuelle inscrite dans les comptes du sultan {cite:muntazam-ibn-al-jawzi j.8 p.350}."
  es: "El martes quince de Dhu al-Qa'da del año 413 de la Hégira, se inauguró un hospital en Wasit, construido por Mu'ayyad al-Mulk Abu 'Ali al-Hasan al-Rukhkhi, visir de Musharraf al-Dawla. Se le trajeron medicamentos y jarabes, se le asignó un encargado de almacén, médicos y agentes, se le destinaron fondos y se estableció una asignación mensual en las cuentas del sultán {cite:muntazam-ibn-al-jawzi j.8 p.350}."
  ur: "وصیت میں ایک ہسپتال کا آغاز منگل، ذی القعدہ 413 ہجری کی پندرہویں تاریخ کو ہوا، جسے مشرف الدولہ کے وزیر معایۃ الملک ابو علی الحسن الرخی نے تعمیر کیا تھا۔ اس کے لیے دوائیں اور شربت لائے گئے، ایک دکاندار، طبیب اور عامل اس کے لیے مقرر کیے گئے، اس کے لیے اوقاف مقرر کیے گئے، اور سلطان کے حسابات پر ماہانہ الاؤنس مقرر کیا گیا۔"
  tr: "Wasit'te, 413 Hicri yılının on beşinci Džüdah ayının on beşinci günü Wasit'te bir hastane açıldı. Hastane, devlet denetçisi Mu'ayyad al-Malik Abu al-Hasan al-Rukhji tarafından inşa edildi; ona ilaç ve içecek sağlandı, bir rezervuar, doktorlar ve temsilciler ayarlandı, üzerine vakıflar kuruldu ve kraliyet işlemleri için bir kraliyet yetkisi kuruldu {cite:muntazam-ibn-al-jawzi j.8 s.350}."
  id: "Sebuah rumah sakit dibuka di Wasit pada hari Selasa, tanggal lima belas Dhu al-Qi'dah tahun 413 H. Rumah sakit ini dibangun oleh Mu'ayyad al-Malik Abu Ali al-Hasan al-Rukhji, pengawas negara; obat-obatan dan minuman disediakan kepadanya, sebuah waduk, dokter, dan agen diatur untuknya, dana abadi didirikan di atasnya, dan otoritas kerajaan didirikan untuknya atas transaksi kerajaan {cite:muntazam-ibn-al-jawzi j.8 hlm.350}."
