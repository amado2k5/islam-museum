summary:
  ar: "بيمارستان افتُتح بواسط يوم الثلاثاء خامس عشر ذي القعدة سنة 413، بناه مؤيد الملك أبو علي الحسن الرخجي وزير مشرف الدولة؛ وحُملت إليه الأدوية والأشربة، ورُتّب له خُزّان وأطباء ووكلاء، ووُقفت عليه أوقاف، وجُعلت له مشاهرة على المعاملات السلطانية {cite:muntazam-ibn-al-jawzi j.8 p.350}."
  en: "A hospital opened in Wasit on Tuesday, the fifteenth of Dhu al-Qa'da 413 AH, built by Mu'ayyad al-Mulk Abu 'Ali al-Hasan al-Rukhkhi, vizier of Musharraf al-Dawla. Medicines and syrups were brought to it, a storekeeper, physicians and agents were assigned to it, endowments were set aside for it, and a monthly allowance was set on the sultan's accounts {cite:muntazam-ibn-al-jawzi j.8 p.350}."
