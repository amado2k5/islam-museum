  ur: "قاہرہ کی السیدہ نفیسہ مسجد کے لیے ڈرافٹ کارڈ، عباس حلمی کی طرف سے دوبارہ تعمیر کردہ عظیم علید خاتون کا مقبرہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kahire'deki Seyyida Nafisa Camii için ön kart, soylu Alevi türbesi ve yenileyicisi Abbas Helmy'yi içeren sahne; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Sayyida Nafisa di Kairo, adegan yang mencakup makam Alawit yang mulia dan renovatornya Abbas Helmy; sumber-sumbernya di halaman tersebut belum ditinjau."
