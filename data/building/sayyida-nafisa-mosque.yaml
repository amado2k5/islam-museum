  ar: "بطاقة أولية لجامع السيدة نفيسة بالقاهرة، المشهد الذي يضم ضريح العلوية الكريمة ومجدده عباس حلمي؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the al-Sayyida Nafisa Mosque of Cairo, the shrine holding the noble Alid lady's tomb rebuilt by Abbas Hilmi; its sources are not yet checked on the page."
