summary:
  ar: "بطاقة أولية للجامع الأعظم بتينمل في الأطلس الكبير، الجامع الذي بُني على قبر ابن تومرت في القرن الثاني عشر وقاعدة الدعوة الموحدية؛ من روائع العمارة المغربية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Great Mosque of Tinmel in the High Atlas, the mosque built over Ibn Tumart's grave in the twelfth century and cradle of the Almohad call; a masterwork of Maghrebi architecture per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Grande Mosquée de Tinmel, dans le Haut Atlas, bâtie sur la tombe d’Ibn Tumart au XIIe siècle et berceau de l’appel almohade, chef-d’œuvre de l’architecture maghrébine selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la Gran Mezquita de Tinmel en el Alto Atlas, la mezquita construida sobre la tumba de Ibn Tumart en el siglo XII y cuna de la llamada almohade; una obra maestra de la arquitectura magrebí según la enciclopedia citada, página aún no revisada."
  ur: "ہائی اٹلس میں ٹنمیل کی عظیم مسجد کے لیے ڈرافٹ کارڈ، بارہویں صدی میں ابن تمرٹ کی قبر پر تعمیر کی گئی مسجد اور الموحد کال کا گہوارہ؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق مغربی فن تعمیر کا ایک شاہکار، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Yüksek Atlas'taki Tinmel Büyük Camii için ön kart, on ikinci yüzyılda İbn Tumart'ın türbesi üzerine inşa edilen ve Almohad misyonunun kası olan camidir; Fas mimarisinin başyapıtlarından biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Agung Tinmel di Atlas Tinggi, masjid yang dibangun di atas makam Ibn Tumart pada abad kedua belas dan dasar misi Almohad; salah satu mahakarya arsitektur Maroko dan halamannya belum pernah ditinjau."
