label: { ar: "جامع قرطبة", en: "Great Mosque of Córdoba" }
summary:
  ar: "جامع قرطبة، المعروف بلا مثكيتا، هو الجامع الكبير في عاصمة أمويي الأندلس. بدأه عبد الرحمن الداخل سنة 171-172هـ/787-788م، وأتمّه ابنه هشام الأول وبنى مئذنته، ثم وسّعه عبد الرحمن الثاني ومحمد الأول وعبد الرحمن الثالث الناصر، وتبعهم الحكم الثاني بتوسعة كادت تضاعف مساحته وبالمحراب الثالث الباقي كاملاً، وختم المنصور التوسعات بإضافة سبعة أروقة شرقية رفعت عدد البلاطات من أحد عشر إلى تسعة عشر. صار كاتدرائية مسيحية بعد فتح قشتالة قرطبة سنة 1236، وحافظ في الجملة على طابعه العربي. وفي روايات المتحف الأقدم نقل المقري خبر ثريا من النحاس تحمل ألف مصباح {cite:nafh-tib-maqqari p. 556}، ووصف العمري الجامع وصفاً مفصلاً {cite:umari-masalik-1924 p. 212-214}."
  en: "The Great Mosque of Cordoba, known as La Mezquita, is the cathedral mosque of the Umayyad capital of al-Andalus. Begun by Abd al-Rahman I in 171-172/787-788, it was completed with its minaret by Hisham I, enlarged by Abd al-Rahman II, Muhammad I and Abd al-Rahman III, nearly doubled by al-Hakam II, who also added the third mihrab, the only one to survive whole, and finally extended by al-Mansur with seven eastern colonnades that raised the naves from eleven to nineteen. It became a Christian cathedral after the Castilian conquest of 1236 and has largely kept its Arabic character. The museum's older accounts record al-Maqqari's report of a brass candelabrum of a thousand lamps {cite:nafh-tib-maqqari p. 556} and al-Umari's detailed description {cite:umari-masalik-1924 p. 212-214}."
  ur: "جامع قرطبہ، جو لا مثکیتا کے نام سے معروف ہے، اندلس کے اموی دارالحکومت کی جامع مسجد ہے۔ عبد الرحمن الداخل نے 171-172ھ/787-788ء میں اس کی بنیاد رکھی، ہشام اول نے اسے مکمل کیا اور مینار بنایا، پھر عبد الرحمن ثانی، محمد اول اور عبد الرحمن ثالث الناصر نے اسے وسیع کیا، الحکم ثانی نے اسے تقریباً دوگنا کیا اور تیسرا محراب بنایا جو اکیلا مکمل باقی ہے، اور المنصور نے سات مشرقی صفیں بڑھا کر راہداریاں گیارہ سے انیس کر دیں۔ 1236 میں قشتالہ کی فتح کے بعد یہ عیسائی گرجا بنی اور مجموعی طور پر اپنا عربی مزاج برقرار رکھا۔ میوزیم کے پرانے بیانات میں المقری کی ہزار چراغوں والے پیتل کے جھاڑ کی روایت اور العمری کا تفصیلی بیان درج ہے۔"
