summary:
  ar: "الجامع المشهور بقرطبة؛ ذكر المقري عن صاحب نشق الأزهار أن فيه تتّوراً من نحاس أصفر يحمل ألف مصباح وفيه أشياء غريبة من الصنائع الوجيبة وقيل أحكم عمله في سبع سنين وفيه ثلاثة أعمدة من رخام أحمر مكتوب على الواحد اسم محمد وعلى الآخر صورة عصا موسى وأهل الكهف وعلى الثالث صورة غراب نوح، وعلق المقري بأنه لم يجد ذلك عند محققي مؤرخي الأندلس وهو عنده بعيد {cite:nafh-tib-maqqari p. 556}."
  en: "The Great Mosque of Cordoba; al-Maqqari transmits the report of a brass candelabrum of a thousand lamps and three red-marble columns bearing the name of Muhammad, Moses' staff and Noah's raven — noting himself that the sound Andalusian historians did not mention it {cite:nafh-tib-maqqari p. 556}."
