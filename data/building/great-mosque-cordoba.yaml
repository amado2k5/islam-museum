label: { ar: "جامع قرطبة", en: "Great Mosque of Córdoba" }
summary:
  ar: "الجامع المشهور بقرطبة؛ ذكر المقري عن صاحب نشق الأزهار أن فيه تتّوراً من نحاس أصفر يحمل ألف مصباح وفيه أشياء غريبة من الصنائع الوجيبة وقيل أحكم عمله في سبع سنين وفيه ثلاثة أعمدة من رخام أحمر مكتوب على الواحد اسم محمد وعلى الآخر صورة عصا موسى وأهل الكهف وعلى الثالث صورة غراب نوح، وعلق المقري بأنه لم يجد ذلك عند محققي مؤرخي الأندلس وهو عنده بعيد {cite:nafh-tib-maqqari p. 556}. ووصفه ابن فضل الله العمري وصفاً مفصلاً: طوله مائة باع وعرضه ثمانون، نصفه مسقف ونصفه صحن، في مسقفه تسعة عشر قوساً ومن سواريه صغاراً وكباراً ألف سارية، وسماوات سقفه من صنوبر طرطوشي بصنعة الفص والدوائر، وفي مخزنه مصحف يرفعه رجلان لثقله فيه أربع أوراق من مصحف عثمان الذي كتبه بيمينه وفيه نقط من دمه، ومنبره من آبنوس وبقس ومجمر عمل فيه ستة صناع سبع سنين على نصف مثقال لكل صانع في اليوم — وليس في معمور الأرض مثله صنعة عنده — وصومعته تُصعد بدرجين متخالفين لا يجتمع الصاعدان إلا في أعلاها، وفيها ثلاثمائة عمود وثلاث تفاحات إحداهن من ذهب واثنتان من فضة، ويخدم الجامع ستون رجلاً {cite:umari-masalik-1924 p. 212-214}."
  en: "The Great Mosque of Cordoba; al-Maqqari transmits the report of a brass candelabrum of a thousand lamps and three red-marble columns bearing the name of Muhammad, Moses' staff and Noah's raven — noting himself that the sound Andalusian historians did not mention it {cite:nafh-tib-maqqari p. 556}."
