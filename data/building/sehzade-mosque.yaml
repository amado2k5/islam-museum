summary:
  ar: "جامع شاهزاده بإسطنبول؛ كلية أمر بها سليمان القانوني ذكرى لابنه شاهزاده محمد المتوفى بالجدري سنة 1543م؛ عهد سنان ببنائها فبدأها سنة 1544م وأتمها سنة 1548م وسمّاها «عمل تلمذته» {cite:freely-ottoman-architecture-2011}."
  en: "The Shehzade Mosque of Istanbul; a complex Suleyman the Magnificent ordered in memory of his son Shehzade Mehmet, who died of smallpox in 1543; Sinan built it 1544-1548 and called it his 'apprentice work' {cite:freely-ottoman-architecture-2011}."
  fr: "Complexe d’Istanbul commandé par Soliman en souvenir de Mehmet mort de variole en 1543 ; Sinan le bâtit en 1544–1548, son « œuvre d’apprenti ». {cite:freely-ottoman-architecture-2011}"
  es: "La Mezquita Shehzade de Estambul; un complejo que Solimán el Magnífico ordenó en memoria de su hijo Shehzade Mehmet, quien murió de viruela en 1543; Sinan la construyó entre 1544 y 1548 y la llamó su \"obra de aprendizaje\" {cite:freely-ottoman-architecture-2011}."
  ur: "استنبول کی شہزادی مسجد؛ ایک پیچیدہ سلیمان دی میگنیفیکیشن نے اپنے بیٹے شہزاد مہمت کی یاد میں آرڈر کیا، جو 1543 میں چیچک سے مر گیا تھا۔ سنان نے اسے 1544-1548 میں بنایا تھا اور اسے اپنا 'اپرنٹس ورک' کہا تھا"
  tr: "İstanbul'daki Prenses Camii; Süleyman Yüce tarafından, 1543 yılında çiçek hastalığından ölen oğlu Mehmed'in anısına yaptırılan bir kolej; Sinan inşaatını emanet etti, 1544'te başlattı ve 1548'de tamamladı, \"Çıraklığının Çalışması\" adını verdi {cite:freely-osmanlı-architecture-2011}."
  id: "Masjid Putri di Istanbul; sebuah perguruan tinggi yang dipesan oleh Suleiman yang Agung, untuk mengenang putranya Mehmed, yang meninggal karena cacar pada tahun 1543 M; Sinan mempercayakan pembangunannya, memulainya pada tahun 1544 M dan menyelesaikannya pada tahun 1548 M, menamainya \"Karya Magangnya\" {cite:freely-ottoman-architecture-2011}."
