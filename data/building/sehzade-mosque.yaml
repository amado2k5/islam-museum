  es: "La Mezquita Shehzade de Estambul; un complejo que Solimán el Magnífico ordenó en memoria de su hijo Shehzade Mehmet, quien murió de viruela en 1543; Sinan la construyó entre 1544 y 1548 y la llamó su \"obra de aprendizaje\" {cite:freely-ottoman-architecture-2011}."
