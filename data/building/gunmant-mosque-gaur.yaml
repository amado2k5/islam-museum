summary:
  ar: "مسجد مستطيل في غور بين باب الكوتوالي وقرية مهدي پور، ذو رواق أوسط مقبى تحف به جناحان في كل منهما اثنتا عشرة قبة، يشبه مسجد آدينه، وينسب إليه كننغهام نقشاً مؤرخاً 889هـ/1484 {c(98)} {c(103)}."
  en: "An oblong mosque at Gaur between the Kotwali Gate and Mahdipur, with a vaulted central nave flanked by two wings of twelve domes each, close to the Adina mosque, to which Cunningham assigned an inscription dated AH 889/1484 {c(98)} {c(103)}."
  fr: "Mosquée oblongue de Gaur entre la porte Kotwali et Mahdipur, à nef centrale voûtée flanquée de deux ailes de douze coupoles chacune, proche de la mosquée Adina, à laquelle Cunningham attribua une inscription de 889 H/1484 {c(98)} {c(103)}."
  ur: "گوڑ میں کوتوالی دروازے اور مہدی پور کے درمیان مستطیل مسجد، جس کے محراب دار مرکزی ایوان کے دونوں طرف بارہ بارہ گنبدوں کے بازو ہیں؛ آدینہ مسجد سے مشابہ؛ کننگھم نے اس سے 889ھ/1484ء کا کتبہ منسوب کیا {c(98)}۔"
  es: "Una mezquita oblonga en Gaur entre la Puerta Kotwali y Mahdipur, con una nave central abovedada flanqueada por dos alas de doce cúpulas cada una, cerca de la mezquita Adina, a la que Cunningham asignó una inscripción fechada en AH 889/1484 {c(98)} {c(103)}."
