label: { ar: "جامع البصرة", en: "Great Mosque of Basra", fr: "Grande Mosquée de Bassora", es: "Gran Mezquita de Basora", ur: "بصرہ کی عظیم مسجد" }
summary:
  ar: "جامع البصرة؛ بناه عتبة بن غزوان من قصب سنة أربع عشرة واختطاطه منازع فيه بين عتبة نفسه ونافع بن الأذرع البهزي ونافع بن الحارث بن كلدة والأسود بن سريع أول من قضى فيه ثم بناه أبو موسى الأشعري بلبن وطين وسقفه بالمشب ثم زاد فيه زياد زيادة كثيرة وبناه بالآجر والجص وسقفه بالساج وجعل منارته بالحجارة وهو أول من عمل المقصورة وأحضر سواريه من جبل الأهواز قطعها الحجاج بن عتيك وابنه وأمر بجمع الحصى وإلقائه في المسجد حتى لا يظن نفض الأيدي في الصلاة سنة فاشتد الموكلون على الناس وتعنتوهم وارتشوا فقال القائل حبذا الإمارة ولو على الحجارة واشترى المهدي دار نافع بن الحارث ودار عبيد الله بن أبي بكرة ودار ربيعة بن كلدة فأدخلها في المسجد وأدخلت فيه دار الإمارة في خلافة الرشيد."
  en: "Basra's congregational mosque; Utba ibn Ghazwan built it of reeds in 14 AH — its layout claimed for himself, Nafi' ibn al-Adhra' al-Bahzi, Nafi' ibn al-Harith, and al-Aswad ibn Sari' who first judged in it — Abu Musa rebuilt it in mud-brick with mushab roofing, then Ziyad enlarged and rebuilt it in fired brick and gypsum with teak roofing, a stone minaret, the first maqsura, and columns hauled from Ahwaz's mountain by al-Hajjaj ibn Utayk and his son; he had pebbles strewn lest hand-dusting pass for sunnah, and the enforcers' harshness bred the saying 'lovely the governorship, even over stones'. Al-Mahdi bought the houses of Nafi' ibn al-Harith, Ubaydallah ibn Abi Bakra and Rabi'a ibn Kallada into it, and the governor's palace was taken in under al-Rashid."
  fr: "Grande mosquée de Bassora ; Utba ibn Ghazwan la construisit en roseaux en 14 H ; son tracé est attribué à lui-même, Nafi ibn al-Adhra al-Bahzi, Nafi ibn al-Harith ou al-Aswad ibn Sari’, premier à y juger. Abu Musa la reconstruisit en briques crues avec couverture de mushab, puis Ziyad l’agrandit et la rebâtit en briques cuites et plâtre, avec toit de teck, minaret de pierre, première maqsura et colonnes apportées de la montagne d’Ahwaz par al-Hajjaj ibn Utayk et son fils ; il fit répandre des cailloux pour que s’épousseter les mains ne passe pas pour une sunna ; la dureté des exécutants inspira le dicton « Que le gouvernement est bon, même sur des pierres ». Al-Mahdi y incorpora les maisons de Nafi ibn al-Harith, Ubaydallah ibn Abi Bakra et Rabi’a ibn Kallada ; le palais du gouverneur y fut intégré sous al-Rashid."
  es: "La mezquita congregacional de Basora; Utba ibn Ghazwan la construyó con cañas en el año 14 de la Hégira —su diseño fue reclamado para sí mismo, Nafi' ibn al-Adhra' al-Bahzi, Nafi' ibn al-Harith y al-Aswad ibn Sari', quien fue el primero en juzgar en ella— Abu Musa la reconstruyó con ladrillos de barro y techo de mushab, luego Ziyad la amplió y reconstruyó con ladrillos cocidos y yeso con techo de teca, un minarete de piedra, la primera maqsura y columnas traídas de la montaña de Ahwaz por al-Hajjaj ibn Utayk y su hijo; hizo esparcir guijarros para que el empolvado de manos no se considerara sunnah, y la dureza de los ejecutores dio origen al dicho \"encantador el gobierno, incluso sobre piedras\". Al-Mahdi adquirió las casas de Nafi' ibn al-Harith, Ubaydallah ibn Abi Bakra y Rabi'a ibn Kallada, y el palacio del gobernador fue incorporado bajo el mandato de al-Rashid."
  ur: "بصرہ کی جامع مسجد؛ عتبہ بن غزوان نے اسے 14 ہجری میں سرکنڈوں سے تعمیر کیا تھا - اس کی ترتیب کا دعویٰ اپنے لیے کیا تھا، نافع ابن الاضحی، نافع ابن حارث اور اسود بن ساری نے جو پہلے اس میں فیصلہ کرتے تھے - ابو موسیٰ نے اسے مٹی سے دوبارہ تعمیر کیا اور پھر اس کی اینٹوں سے مٹی سے بنوایا۔ ساگوان کی چھت والی اینٹوں اور جپسم میں، ایک پتھر کا مینار، پہلا مقصورہ، اور کالم جو اہواز کے پہاڑ سے الحجاج ابن عتیق اور اس کے بیٹے نے اٹھائے تھے۔ اس نے کنکریاں بکھیر رکھی تھیں تاکہ ہاتھ سے دھول سنت کے لیے نہ گزر جائے، اور نافذ کرنے والوں کی سختی نے کہاوت کو جنم دیا کہ 'گورنر شپ، پتھروں پر بھی پیاری'۔ المہدی نے اس میں نافع بن حارث، عبیداللہ ابن ابی بکرہ اور ربیعہ ابن کلدہ کے مکانات خریدے اور گورنر کا محل الرشید کے ماتحت لے لیا گیا۔"
