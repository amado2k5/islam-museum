label: { ar: "جامع البصرة", en: "Great Mosque of Basra" }
summary:
  ar: "جامع البصرة؛ بناه عتبة بن غزوان من قصب سنة أربع عشرة واختطاطه منازع فيه بين عتبة نفسه ونافع بن الأذرع البهزي ونافع بن الحارث بن كلدة والأسود بن سريع أول من قضى فيه ثم بناه أبو موسى الأشعري بلبن وطين وسقفه بالمشب ثم زاد فيه زياد زيادة كثيرة وبناه بالآجر والجص وسقفه بالساج وجعل منارته بالحجارة وهو أول من عمل المقصورة وأحضر سواريه من جبل الأهواز قطعها الحجاج بن عتيك وابنه وأمر بجمع الحصى وإلقائه في المسجد حتى لا يظن نفض الأيدي في الصلاة سنة فاشتد الموكلون على الناس وتعنتوهم وارتشوا فقال القائل حبذا الإمارة ولو على الحجارة واشترى المهدي دار نافع بن الحارث ودار عبيد الله بن أبي بكرة ودار ربيعة بن كلدة فأدخلها في المسجد وأدخلت فيه دار الإمارة في خلافة الرشيد."
  en: "Basra's congregational mosque; Utba ibn Ghazwan built it of reeds in 14 AH — its layout claimed for himself, Nafi' ibn al-Adhra' al-Bahzi, Nafi' ibn al-Harith, and al-Aswad ibn Sari' who first judged in it — Abu Musa rebuilt it in mud-brick with mushab roofing, then Ziyad enlarged and rebuilt it in fired brick and gypsum with teak roofing, a stone minaret, the first maqsura, and columns hauled from Ahwaz's mountain by al-Hajjaj ibn Utayk and his son; he had pebbles strewn lest hand-dusting pass for sunnah, and the enforcers' harshness bred the saying 'lovely the governorship, even over stones'. Al-Mahdi bought the houses of Nafi' ibn al-Harith, Ubaydallah ibn Abi Bakra and Rabi'a ibn Kallada into it, and the governor's palace was taken in under al-Rashid."
