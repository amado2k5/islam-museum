summary:
  ar: "بطاقة أولية لجامع حمودة باشا بمدينة تونس، الذي بناه الباي المرادي سنة ١٦٥٥م وألحقت به التربة والمدرسة؛ من معالم المدينة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Hammouda Pacha Mosque of Tunis, built by the Muradid bey in 1655 with its turba and madrasa; a landmark of the old city per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée Hammouda Pacha de Tunis, bâtie par le bey mouradite en 1655 avec son mausolée et sa madrasa, monument majeur de la vieille ville selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la Mezquita Hammouda Pacha de Túnez, construida por el bey Muradid en 1655 con su turba y madrasa; un monumento de la ciudad vieja según la enciclopedia citada, página aún no verificada."
  ur: "تیونس کی حمودہ پاچا مسجد کے لیے ڈرافٹ کارڈ، جسے مراد بے نے 1655 میں اس کے تربہ اور مدرسے کے ساتھ بنایا تھا۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق پرانے شہر کا ایک نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Tunus şehrindeki Hammuda Paşa Camii için ön kart, 1655 yılında Bey Al-Muradi tarafından inşa edilmiş ve toprak ile okul ona eklenmiştir; bunlar şehrin simge yapılarıdır ve sayfa henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Masjid Hammouda Pasha di kota Tunis, yang dibangun oleh Bey Al-Muradi pada tahun 1655 M, dan tanah serta sekolahnya ditempelkan; ini adalah landmark kota dan halamannya belum ditinjau."
