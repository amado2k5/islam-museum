  ur: "قم کے قریب مسجد جمکران کے لیے ڈرافٹ کارڈ، بارہویں روایت میں مہدی سے منسلک مسجد اور دسویں صدی سے اکثر آتی جاتی ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kum'daki Camkaran Camii için ön kart, Şii geleneğinde İmam Mehdi'ye atfedilen ve onuncu yüzyıldan beri kurulmuş olan camidir; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Masjid Jamkaran di Qom, masjid yang dikaitkan dengan Imam Mahdi dalam tradisi Syiah dan telah berdiri sejak abad kesepuluh; sumber-sumbernya di halaman tersebut belum ditinjau."
