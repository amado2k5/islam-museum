summary:
  ar: "بطاقة أولية لمسجد جمكران بقم، المسجد المنسوب إلى الإمام المهدي في التقليد الشيعي والمزروع منذ القرن العاشر؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Jamkaran Mosque near Qom, the mosque associated with the Mahdi in the Twelver tradition and frequented since the tenth century; its sources are not yet checked on the page."
