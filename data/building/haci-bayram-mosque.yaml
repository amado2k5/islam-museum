summary:
  ar: "بطاقة أولية لجامع حاجي بيرام بأنقرة، الجامع الذي بُني بجانب تربة حاجي بيرام ولي في القرن الخامس عشر وجاور معبد أغسطس؛ من معالم أنقرة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Haci Bayram Mosque of Ankara, the fifteenth-century mosque beside the turba of Haji Bayram Veli next to the Temple of Augustus; a landmark of Ankara per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée Haci Bayram d’Ankara, mosquée du XVe siècle auprès du mausolée de Haji Bayram Veli et du temple d’Auguste, monument majeur d’Ankara selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la Mezquita Haci Bayram de Ankara, la mezquita del siglo XV situada junto al turba de Haji Bayram Veli, al lado del Templo de Augusto; un lugar emblemático de Ankara según la enciclopedia citada, página aún no revisada."
  ur: "انقرہ کی Haci Bayram مسجد کے لیے ڈرافٹ کارڈ، پندرہویں صدی کی مسجد، حاجی بیرام ویلی کے تربہ کے پاس آگسٹس کے مندر کے ساتھ؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق انقرہ کا ایک تاریخی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
