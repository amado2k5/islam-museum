  ar: "السوق الجديد الذي أقامه بايزيد الثاني في السوق المغطى إثر انتعاش عهده الاقتصادي؛ عشرون قبة في خمسة صفوف على اثنتي عشرة دعامة، أكبر من بدستان الفاتح."
  en: "The new market hall Beyazit II added to the Covered Bazaar amid his reign's economic growth; twenty domes in five rows on twelve piers, larger than Fatih's Old Bedesten."
