  es: "El nuevo mercado cubierto que Beyazit II añadió al Bazar Cubierto en medio del crecimiento económico de su reinado; veinte cúpulas en cinco filas sobre doce pilares, más grande que el antiguo Bedesten de Fatih."
  ur: "نیا مارکیٹ ہال بیازیت II نے اپنے دور حکومت کی اقتصادی ترقی کے درمیان احاطہ بازار میں شامل کیا؛ بارہ ستونوں پر پانچ قطاروں میں بیس گنبد، فاتح کے پرانے بیڈسٹن سے بڑے۔"
  tr: "II. Bayezid tarafından hükümdarlığının ekonomik toparlanmasının ardından kapalı pazarda kurulan yeni pazar; on iki sütun üzerinde beş sıra halinde yirmi kubbe, Fatih'in Bedistan'ından daha büyüktü"
  id: "Pasar baru yang didirikan oleh Bayezid II di pasar tertutup setelah pemulihan ekonomi pemerintahannya; dua puluh kubah dalam lima baris di atas dua belas pilar, lebih besar dari Bedistan Sang Penakluk"
