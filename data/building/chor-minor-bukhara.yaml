  ur: "بخارا کے چور مائنر کے لیے ڈرافٹ کارڈ، 1807 میں بخارا کے ایک تاجر کے ذریعہ چار برج والا مدرسہ گیٹ ہاؤس؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Buhara'daki Chor Minor'un ön kartı, 1807'de bir Buhari tüccarı tarafından inşa edilen Dört Minare Okulu'nun kapısı; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Chor Minor di Bukhara, gerbang Sekolah Empat Menara yang dibangun oleh seorang pedagang Bukhari pada tahun 1807; sumber-sumbernya di halaman tersebut belum ditinjau."
