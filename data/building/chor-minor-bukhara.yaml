  ar: "بطاقة أولية لتشور مينور ببخارى، بوابة المدرسة الأربع المنارات التي بناها تاجر بخاري سنة ١٨٠٧م؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Chor Minor of Bukhara, the four-turreted madrasa gatehouse built by a Bukharan merchant in 1807; its sources are not yet checked on the page."
