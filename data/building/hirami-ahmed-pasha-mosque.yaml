summary:
  ar: "بطاقة أولية لمسجد هيرامي أحمد باشا بإسطنبول، كنيسة بيزنطية صغيرة حُوّلت مسجداً على يد الصدر الأعظم هيرامي أحمد باشا في القرن السادس عشر؛ من عمائر تحويل الكنائس في المدينة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Hirami Ahmed Pasha Mosque of Istanbul, a small Byzantine church converted to a mosque by the grand vizier in the sixteenth century, per the cited survey; the page not yet checked."
  fr: "Notice provisoire : Mosquée Hirami Ahmed Pacha d’Istanbul, petite église byzantine convertie en mosquée par le grand vizir au XVIe siècle selon l’étude citée. La page n’est pas encore vérifiée."
  es: "Ficha preliminar de la mezquita Hirami Ahmed Pasha de Estambul, una pequeña iglesia bizantina convertida en mezquita por el gran visir en el siglo XVI, según el estudio citado; la página aún no ha sido revisada."
  ur: "استنبول کی حرامی احمد پاشا مسجد کے لیے ڈرافٹ کارڈ، ایک چھوٹا بازنطینی کلیسا جسے سولہویں صدی میں عظیم الشان وزیر نے مسجد میں تبدیل کیا، حوالہ کردہ سروے کے مطابق؛ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "İstanbul'daki Hirami Ahmed Paşa Camii için ön kart, on altıncı yüzyılda Sadrazam Hirami Ahmed Paşa tarafından camiye dönüştürülen küçük bir Bizans kilisesi; şehirdeki dönüştürülmüş kilise binalarından biri ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Hirami Ahmed Pasha di Istanbul, sebuah gereja kecil bergaya Bizantium yang diubah menjadi masjid oleh Grand Vizier Hirami Ahmed Pasha pada abad keenam belas; salah satu bangunan gereja yang telah diubah di kota dan halamannya belum ditinjau."
