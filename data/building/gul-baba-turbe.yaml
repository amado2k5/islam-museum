summary:
  ar: "تربة غول بابا ببودابست؛ بناؤها مثمّن مقبّب على الطراز العثماني الكلاسيكي أقامه يحيى باشا زاده محمد باشا 1543-1548م، نجت مصلّىً ثم عادت تربة سنة 1867م {cite:yilmaz-ottoman-architecture-hungary-2024 pp.26-27}."
  en: "The octagonal domed Tomb of Gül Baba in Budapest, built 1543-48 by Yahyâ Pashazâde Mehmed Pasha, chapel then tomb again after 1867 {cite:yilmaz-ottoman-architecture-hungary-2024 pp.26-27}."
  fr: "Tombeau octogonal à coupole de Gül Baba à Budapest, construit en 1543-1548 par Yahyâ Pashazâde Mehmed Pasha, devenu chapelle puis de nouveau tombeau après 1867 {cite:yilmaz-ottoman-architecture-hungary-2024 pp.26-27}."
  es: "La tumba octogonal con cúpula de Gül Baba en Budapest, construida entre 1543 y 1548 por Yahyâ Pashazâde Mehmed Pasha, capilla y luego tumba nuevamente después de 1867 {cite:yilmaz-ottoman-architecture-hungary-2024 pp.26-27}."
  ur: "بڈاپیسٹ میں گل بابا کا آکٹونل گنبد والا مقبرہ، 1543-48 میں یحییٰ پاشازادے محمد پاشا نے تعمیر کیا، چیپل پھر 1867 کے بعد دوبارہ مقبرہ {حوالہ: yilmaz-otoman-architecture-hungary-2024 pp.26-27}۔"
  tr: "Budapeşte'deki Turbah Gul Baba; yapısı, Yahya Paşadeh Muhammed Paşa (1543-1548) tarafından inşa edilmiş klasik Osmanlı tarzında sekizgen kubbeli bir yapıdır. Namaz salonu ayakta kalmış, ancak Turbah 1867'de geri dönmüştür {kaynak:yilmaz-osmanlı-mimari-macaristan-2024 s.26-27}."
  id: "Turbah Gul Baba di Budapest; konstruksinya adalah struktur berkubah oktagonal dengan gaya klasik Ottoman, dibangun oleh Yahya Pashazadeh Muhammad Pasha (1543-1548 M). Aula doa tersebut bertahan, tetapi Turbah kembali pada tahun 1867 {cite:yilmaz-ottoman-architecture-hungary-2024 hlm.26-27}."
