summary:
  ar: "بطاقة أولية لمجمع پای کلین في بخارى — الجامع الكبير ومنارة کلین؛ نقوشه المسجلة في قاموس النقوش الإسلامية تشمل نص بناء للمنارة سنة ٥١٥هـ ومرسوم سلطاني على مدخل الجامع سنة ٩٤٨هـ."
  en: "Draft card for the Po-i-Kalyan complex in Bukhara — the great Jami' mosque and the Kalyan minaret; its inscriptions recorded in the Islamic Epigraphy Thesaurus include a 515 AH / 1121-1122 CE construction text on the minaret and a 948 AH / 1541-1542 CE decree on the mosque portal."
  fr: "Notice provisoire : complexe Po-i-Kalyan de Boukhara, comprenant la grande mosquée du vendredi et le minaret Kalyan ; ses inscriptions enregistrées dans l’Islamic Epigraphy Thesaurus comprennent un texte de construction de 515 H / 1121-1122 ap. J.-C. sur le minaret et un décret de 948 H / 1541-1542 ap. J.-C. sur le portail de la mosquée."
  es: "Boceto del complejo Po-i-Kalyan en Bujará: la gran mezquita Jami' y el minarete Kalyan; sus inscripciones registradas en el Tesauro de Epigrafía Islámica incluyen un texto de construcción del 515 AH / 1121-1122 CE en el minarete y un decreto del 948 AH / 1541-1542 CE en el portal de la mezquita."
  ur: "بخارا میں پو کلیان کمپلیکس کے لیے ڈرافٹ کارڈ - عظیم جامع مسجد اور کلیان مینار؛ اسلامی ایپی گرافی تھیسورس میں درج اس کے نوشتہ جات میں مینار پر 515 ہجری / 1121-1122 عیسوی کی تعمیر کا متن اور مسجد کے پورٹل پر 948 ہجری / 1541-1542 عیسوی کا فرمان شامل ہے۔"
