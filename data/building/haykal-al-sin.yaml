summary:
  ar: "هيكل في أقاصي الصين وصفه أبو عبيد البكري: بيت مدور له ستور وأبواب في داخله قبة مسبعة عظيمة البنيان، وبه بئر مسبعة الرأس متى أكبّ إنسان على رأسها تهور على رأسه فيها، وعلى رأسها شبه طوق مكتوب بقلم السندهند أنها تؤدي إلى مخزن الكتب الأولى وتاريخ الدنيا وعلوم السماء وإلى خزائن رغائب هذا العالم {cite:umari-masalik-1924 p. 226}."
  en: "A temple in farthest China as Abu Ubayd al-Bakri describes: a round curtained house holding a vast seven-sided dome and a seven-mouthed well that swallows whoever leans over it; on its rim, in the Sindhind script, an inscription declares it leads to the storehouse of the first books, the history of the world, the sciences of heaven, and the treasuries of this world's marvels {cite:umari-masalik-1924 p. 226}."
