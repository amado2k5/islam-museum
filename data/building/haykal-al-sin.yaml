label: { ar: "هيكل أقاصي الصين", en: "the temple of farthest China", fr: "Temple des confins de la Chine", es: "el templo de la China más lejana", ur: "دور دراز چین کا مندر" }
summary:
  ar: "هيكل في أقاصي الصين وصفه أبو عبيد البكري: بيت مدور له ستور وأبواب في داخله قبة مسبعة عظيمة البنيان، وبه بئر مسبعة الرأس متى أكبّ إنسان على رأسها تهور على رأسه فيها، وعلى رأسها شبه طوق مكتوب بقلم السندهند أنها تؤدي إلى مخزن الكتب الأولى وتاريخ الدنيا وعلوم السماء وإلى خزائن رغائب هذا العالم {cite:umari-masalik-1924 p. 226}."
  en: "A temple in farthest China as Abu Ubayd al-Bakri describes: a round curtained house holding a vast seven-sided dome and a seven-mouthed well that swallows whoever leans over it; on its rim, in the Sindhind script, an inscription declares it leads to the storehouse of the first books, the history of the world, the sciences of heaven, and the treasuries of this world's marvels {cite:umari-masalik-1924 p. 226}."
  fr: "Temple aux confins de la Chine décrit par Abu Ubayd al-Bakri : maison ronde à tentures abritant une vaste coupole à sept côtés et un puits à sept bouches qui engloutit quiconque s’y penche ; sur sa margelle, une inscription en écriture Sindhind déclare qu’il mène au dépôt des premiers livres, à l’histoire du monde, aux sciences célestes et aux trésors des merveilles de ce monde {cite:umari-masalik-1924 p. 226}."
  es: "Un templo en la China más remota, como lo describe Abu Ubayd al-Bakri: una casa redonda con cortinas que alberga una vasta cúpula de siete lados y un pozo de siete bocas que engulle a quien se inclina sobre él; en su borde, en escritura sindhind, una inscripción declara que conduce al depósito de los primeros libros, la historia del mundo, las ciencias del cielo y los tesoros de las maravillas de este mundo {cite:umari-masalik-1924 p. 226}."
  ur: "دور دراز چین میں ایک مندر جیسا کہ ابو عبید البکری بیان کرتے ہیں: ایک گول پردے والا گھر جس میں ایک وسیع سات رخا گنبد اور سات منہ والا کنواں ہے جو اس پر جھکنے والے کو نگل جاتا ہے۔ اس کے کنارے پر، سندھی رسم الخط میں، ایک نوشتہ بیان کرتا ہے کہ یہ پہلی کتابوں، تاریخ عالم، آسمانی علوم اور اس دنیا کے عجائبات کے خزانوں کی طرف لے جاتا ہے۔ 226}۔"
