label: { ar: "أبو الهول", en: "Abu'l-Hawl (the Sphinx)" }
summary:
  ar: "تمثال ضخم يقارب الهرم الكبير في وحدة منخفضة من جهة المشرق، يصفه ابن فضل الله العمري مشاهدةً: لا يبين فوق سطح الأرض إلا رأسه وعنقه أشبه شيء برأس راهب حبشي عليه غفّارة، وعلى وجهه صباغ أحمر إلى حُوَّة لم يحُل على طول الأزمان، ولو قام لما قصّر طوله عن عشرين ذراعاً؛ ويُقال إنه طِلسم يمنع الرمل عن المزدرع لأنه على نهاية الرمل إلى جهة الزرع {cite:umari-masalik-1924 p. 238}."
  en: "The colossal statue beside the Great Pyramid in a sunken depression eastward — al-Umari's eyewitness description: only its head and neck show above the ground, like a tonsured Abyssinian monk's head, its face painted red to the ears, unchanged through the ages; standing it would be a good twenty cubits — held to be a talisman keeping the sand off the tilled land {cite:umari-masalik-1924 p. 238}."
