summary:
  ar: "مسجد من منتصف القرن الخامس عشر أسسه حمزة بك المتوفى 1461م؛ مخطط الإيوانات المتعامدة وتربتان لحمزة بك ولزوجته وابنتيه."
  en: "A mid-15th-century Bursa mosque founded by Hamza Bey (d. 1461); cross-axial eyvan plan with the founder's octagonal türbe and a family türbe beside it."
  fr: "Mosquée de Bursa du milieu du XVe siècle fondée par Hamza Bey, mort en 1461 ; plan à eyvans sur axes croisés avec türbe octogonal du fondateur et türbe familial voisin."
  es: "Mezquita de Bursa de mediados del siglo XV fundada por Hamza Bey (fallecido en 1461); planta eyvan de ejes cruzados con la türbe octogonal del fundador y una türbe familiar a su lado."
  ur: "15ویں صدی کے وسط کی برسا مسجد جسے حمزہ بے ⁦(متوفی 1461)⁩ نے قائم کیا تھا۔ بانی کے آکٹاگونل ٹربی اور اس کے ساتھ ایک فیملی ٹربی کے ساتھ کراس محوری ایوان پلان۔"
  tr: "Hamza Bey tarafından kurulan ve 1461 yılında ölen 15. yüzyıl ortalarından kalma bir cami; Hamza Bey, eşi ve iki kızı için dik ivanlar ve iki teras planı."
  id: "Sebuah masjid dari pertengahan abad kelima belas yang didirikan oleh Hamza Bey, yang meninggal pada tahun 1461 M; denah iwan-iwan tegak lurus dan dua teras untuk Hamza Bey, istrinya, dan dua putrinya."
