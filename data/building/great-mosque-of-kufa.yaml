summary:
  ar: "مسجد الكوفة الجامع؛ شبه مربع الأضلاع (نحو ١١٦×١٠٩×١١٦×١١٠ م)، في رواقه الجنوبي مشهد الإمام علي وتنتشر فيه محاريب تُعرف بالمقامات (الخضر، زين العابدين، جبرائيل، إبراهيم)، وفيه «السفينة»/التنّور — صحن مثمّن منخفض يُنزل إليه بدرج — وبيت الطشت؛ ويذكر «موسوعة العتبات» أنه اتصل بقصر الإمارة — الذي شرع في بنائه سعد بن أبي وقاص — بباب في جداره الجنوبي، وقد قاست التنقيبات الأثرية ضلع القصر نحو ١٧٧ م {cite:musawat-atabat}."
  en: "The Great Mosque of Kufa; near-square with slightly unequal sides (~116×109×116×110 m), its south riwaq holding the mashhad of Imam Ali and scattered prayer-niches known as maqams (al-Khidr, Zayn al-Abidin, Jibril, Ibrahim), plus the 'Safina'/Tannur — a sunken octagonal court reached by stairs — and the bayt al-tasht; the Mawsu'at al-Atabat records that it joined the Qasr al-Imara, begun by Sa'd ibn Abi Waqqas, through a door in its south wall, and Iraqi excavations measured the palace's side at some 177 m {cite:musawat-atabat}."
