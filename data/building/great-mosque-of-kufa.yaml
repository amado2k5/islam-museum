summary:
  ar: "مسجد الكوفة الجامع؛ شبه مربع الأضلاع ⁦(نحو ١١٦×١٠٩×١١٦×١١٠ م)⁩، في رواقه الجنوبي مشهد الإمام علي وتنتشر فيه محاريب تُعرف بالمقامات ⁦(الخضر، زين العابدين، جبرائيل، إبراهيم)⁩، وفيه «السفينة»/التنّور — صحن مثمّن منخفض يُنزل إليه بدرج — وبيت الطشت؛ ويذكر «موسوعة العتبات» أنه اتصل بقصر الإمارة — الذي شرع في بنائه سعد بن أبي وقاص — بباب في جداره الجنوبي، وقد قاست التنقيبات الأثرية ضلع القصر نحو ١٧٧ م {cite:musawat-atabat}."
  en: "The Great Mosque of Kufa; near-square with slightly unequal sides (~116×109×116×110 m), its south riwaq holding the mashhad of Imam Ali and scattered prayer-niches known as maqams (al-Khidr, Zayn al-Abidin, Jibril, Ibrahim), plus the 'Safina'/Tannur — a sunken octagonal court reached by stairs — and the bayt al-tasht; the Mawsu'at al-Atabat records that it joined the Qasr al-Imara, begun by Sa'd ibn Abi Waqqas, through a door in its south wall, and Iraqi excavations measured the palace's side at some 177 m {cite:musawat-atabat}."
  fr: "La Grande Mosquée de Koufa, presque carrée aux côtés légèrement inégaux (environ 116×109×116×110 m), dont le riwaq sud abrite le mashhad de l’imam Ali et des niches de prière dispersées appelées maqams (al-Khidr, Zayn al-Abidin, Jibril, Ibrahim), ainsi que la « Safina » ou Tannur, cour octogonale en contrebas accessible par escalier, et le bayt al-tasht ; la Mawsu’at al-Atabat rapporte qu’une porte du mur sud la reliait au Qasr al-Imara commencé par Sa’d ibn Abi Waqqas ; les fouilles irakiennes ont mesuré le côté du palais à quelque 177 m {cite:musawat-atabat}."
  es: "La Gran Mezquita de Kufa; casi cuadrada con lados ligeramente desiguales (~116×109×116×110 m), su riwaq sur alberga el mashhad del Imam Ali y nichos de oración dispersos conocidos como maqams (al-Khidr, Zayn al-Abidin, Jibril, Ibrahim), además del 'Safina'/Tannur —un patio octogonal hundido al que se accede por escaleras— y el bayt al-tasht; el Mawsu'at al-Atabat registra que se unió al Qasr al-Imara, iniciado por Sa'd ibn Abi Waqqas, a través de una puerta en su muro sur, y las excavaciones iraquíes midieron el lado del palacio en unos 177 m {cite:musawat-atabat}."
  ur: "کوفہ کی عظیم مسجد؛ قدرے غیر مساوی اطراف کے ساتھ قریب مربع (~116×109×116×110m)، اس کا جنوبی ریواق جس میں امام علی کا مشہد ہے اور بکھرے ہوئے نمازی طاق جو مقام کے نام سے مشہور ہیں ⁦(الخضر، زین العابدین، جبریل، ابراہیم)⁩، علاوہ ازیں 'سفینہ عقبہ' اور طوافِ عدن تک پہنچا۔ بیت التشط؛ مسوّت العتاب نے ریکارڈ کیا ہے کہ یہ قصر الامارہ میں شامل ہوا، جسے سعد ابن ابی وقاص نے اس کی جنوبی دیوار کے ایک دروازے سے شروع کیا تھا، اور عراقی کھدائیوں نے محل کے اطراف کی پیمائش تقریباً 177 میٹر کی تھی۔"
