label: { ar: "الچوبرج وباغ زر افشان في آكره", en: "Chauburj and the Bagh-i Zar Afshan, Agra", ur: "چوبرج اور باغِ زر افشاں، آگرہ" }
summary:
  ar: "بناء مربع ذو أبراج مثمنة في أركانه الأربعة على الضفة الشرقية لنهر جمنا قرب ضريح اعتماد الدولة، يعرّفه ناث بأنه «چوكندي» بابر في وسط باغ زر افشان، ويرجح أنه كان ضريح بابر الأول في آكره {cite:nath-history-of-mughal-architecture-1-1982 p. 117} {cite:nath-history-of-mughal-architecture-1-1982 p. 118} {cite:nath-history-of-mughal-architecture-1-1982 p. 119}."
  en: "A square building with octagonal corner towers on the east bank of the Yamuna near the tomb of I'timad al-Dawla, which Nath identifies as Babur's 'Chaukandi' at the centre of his Bagh-i Zar Afshan and argues was Babur's first tomb at Agra {cite:nath-history-of-mughal-architecture-1-1982 p. 117} {cite:nath-history-of-mughal-architecture-1-1982 p. 118} {cite:nath-history-of-mughal-architecture-1-1982 p. 119}."
  ur: "جمنا کے مشرقی کنارے اعتماد الدولہ کے مقبرے کے قریب مربع عمارت جس کے چاروں کونوں پر ہشت پہلو برج ہیں؛ ناتھ اسے باغِ زر افشاں کے وسط میں بابر کی «چوکنڈی» اور آگرہ میں بابر کا پہلا مقبرہ قرار دیتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 119}۔"
