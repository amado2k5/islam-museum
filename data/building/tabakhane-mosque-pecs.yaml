label: { ar: "جامع الدباغين في پيچ ⁦(كنيسة القديس أوغسطين)⁩", en: "Tabakhane Mosque, Pécs (St Augustine's Church)", fr: "Mosquée Tabakhane, Pécs (Saint-Augustin)", ur: "تبخانہ مسجد، پیچ ⁦(سینٹ آگسٹین گرجا)⁩", es: "Mezquita de Tabakhane, Pécs (Iglesia de San Agustín)", tr: "Pić'teki Tanner Camii (St. Augustinus Kilisesi)", id: "Masjid Penyamak di Pić (Gereja St. Agustinus)" }
summary:
  ar: "جامع خارج أسوار پيچ قرب جدول تيتيه، بُنيت على جدرانه الرئيسة كنيسة القديس أوغسطين سنة 1712، وما زالت نوافذه ورواقه ظاهرة في جدرانها {cite:yilmaz-ottoman-architecture-hungary-2024 p. 119}."
  en: "A mosque outside the walls of Pécs by the Tettye brook, on whose main walls St Augustine's Church was built in 1712, its windows and portico still visible in the church walls {cite:yilmaz-ottoman-architecture-hungary-2024 p. 119}."
  fr: "Mosquée hors les murs près de Tettye, murs repris pour Saint-Augustin en 1712, fenêtres et portique encore visibles. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 119}"
  ur: "پیچ کی فصیل کے باہر تیتیے ندی کے پاس مسجد، جس کی بڑی دیواروں پر 1712ء میں سینٹ آگسٹین گرجا بنا؛ اس کی کھڑکیاں اور برآمدہ گرجا کی دیواروں میں اب بھی نظر آتے ہیں {cite:yilmaz-ottoman-architecture-hungary-2024 p. 119}۔"
  es: "Una mezquita fuera de las murallas de Pécs, junto al arroyo Tettye, sobre cuyas murallas principales se construyó la iglesia de San Agustín en 1712, cuyas ventanas y pórtico aún son visibles en las murallas de la iglesia {cite:yilmaz-ottoman-architecture-hungary-2024 p. 119}."
  tr: "Pich surlarının dışında, Tietet deresi yakınında bir cami vardır; ana duvarlarında 1712'de Aziz Augustinus Kilisesi inşa edilmiştir ve pencereleri ile portikosu hâlâ duvarlarında görülebilmektedir {cite:yilmaz-ottoman-architecture-hungary-2024, s. 119}."
  id: "Sebuah masjid di luar tembok Pich dekat aliran Tietet, di atas dinding utamanya dibangun Gereja Santo Agustinus pada tahun 1712, dan jendela serta portiko masih terlihat di dindingnya {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 119}."
