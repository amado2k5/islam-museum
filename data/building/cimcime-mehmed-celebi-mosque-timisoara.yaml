label: { ar: "جامع جمجمه محمد چلبي في تمشوار", en: "Cimcime Mehmed Çelebi Mosque, Timişoara", fr: "Mosquée Cimcime Mehmed Çelebi, Timişoara", ur: "جمجمہ محمد چلبی مسجد، تیمیشوارا", es: "Mezquita Cimcime Mehmed Çelebi, Timişoara", tr: "Muhammed Çelabi'nin kafatası bir yolculukta.", id: "Tengkorak Mohammed Chelabi sedang dalam perjalanan." }
summary:
  ar: "جامع داخل أسوار تمشوار بناه الدفتردار محمد چلبي قبل 1569 ووقف عليه طاحونين وسبعة دكاكين، أُعطي لليسوعيين سنة 1716 وصار كنيسة سنة 1718، وهُدم سنة 1913 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 662}."
  en: "A mosque within the walls of Timişoara built before 1569 by the treasurer Mehmed Çelebi, who endowed it with two mills and seven shops; given to the Jesuits in 1716, a church from 1718, demolished in 1913 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 662}."
  fr: "Mosquée à l’intérieur des murs de Timişoara construite avant 1569 par le trésorier Mehmed Çelebi, qui la dota de deux moulins et de sept boutiques ; donnée aux jésuites en 1716, église à partir de 1718, démolie en 1913 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 662}."
  ur: "تیمیشوارا کی فصیل کے اندر دفتردار محمد چلبی کی 1569ء سے پہلے بنوائی مسجد جس پر انہوں نے دو چکیاں اور سات دکانیں وقف کیں؛ 1716ء میں یسوعیوں کو ملی، 1718ء سے گرجا، 1913ء میں منہدم {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 662}۔"
  es: "Una mezquita dentro de las murallas de Timișoara construida antes de 1569 por el tesorero Mehmed Çelebi, quien la dotó con dos molinos y siete tiendas; entregada a los jesuitas en 1716, una iglesia de 1718, demolida en 1913 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 662}."
  tr: "Tamshwar surları içinde bir cami 1569'dan önce noter dar Mehmet Çelebi tarafından inşa edilmiştir; üzerinde iki değirmen ve yedi dükkan bulunmaktadır. 1716'da Cizvitlere verilmiş, 1718'de kilise olmuş ve 1913'te yıkılmıştır {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023, s. 662}."
  id: "Sebuah masjid di dalam tembok Tamshwar dibangun oleh notaris dar Mehmet Çelebi sebelum tahun 1569, dengan dua pabrik dan tujuh toko berdiri di atasnya. Masjid ini diberikan kepada Jesuit pada tahun 1716, menjadi gereja pada tahun 1718, dan dihancurkan pada tahun 1913 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023, hlm. 662}."
