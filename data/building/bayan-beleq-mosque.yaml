summary:
  ar: "بطاقة أولية لمسجد بيان بليق بلومبوك بإندونيسيا، من أقدم مساجد جزيرة لومبوك ويعود إلى القرن السابع عشر تقريباً؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Bayan Beleq Mosque on Lombok, Indonesia, among the island's oldest mosques, dating to about the seventeenth century; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Bayan Beleq de Lombok, en Indonésie, parmi les plus anciennes de l’île, datant approximativement du XVIIe siècle. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha de la mezquita Bayan Beleq en Lombok, Indonesia, una de las mezquitas más antiguas de la isla, que data aproximadamente del siglo XVII; sus fuentes aún no han sido verificadas en la página."
  ur: "جزیرے کی قدیم ترین مساجد میں سے لومبوک، انڈونیشیا میں واقع بایان بلیق مسجد کے لیے ڈرافٹ کارڈ، جو سترھویں صدی کے قریب ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Lombok, Endonezya'daki Bayan Baliq Camii için ön kart, Lombok Adası'ndaki en eski camilerden biri olan ve yaklaşık on yedinci yüzyıla dayanan bir kart; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Bayan Baliq di Lombok, Indonesia, salah satu masjid tertua di Pulau Lombok yang berasal dari sekitar abad ketujuh belas; sumber-sumbernya di halaman tersebut belum ditinjau."
