summary:
  ar: "جامع صقللي محمد باشا بإسطنبول على سفح التل الأول المطل على مرمرة بقاديرغا ليمان، من أجمل جوامع سنان الصغيرة؛ بناه الوزير الأعظم صقللي محمد باشا وزوجه إسمهان سلطان ابنة سليم الثاني سنة 979هـ/1571-1572م {cite:freely-ottoman-architecture-2011}."
  en: "The Sokollu Mehmed Pasha Mosque of Istanbul on the Marmara slope of the First Hill at Kadirga Limani, among the most beautiful of Sinan's smaller mosques; built in 979 AH/1571-1572 CE by the grand vezir Sokollu Mehmed Pasha and his wife Esma Han Sultan, daughter of Selim II {cite:freely-ottoman-architecture-2011}."
  fr: "Mosquée de Kadirga Limani, pente de Marmara à Istanbul, parmi les plus belles petites mosquées de Sinan ; bâtie en 979 H/1571–1572 par le grand vizir et Esma Han Sultan, fille de Selim II. {cite:freely-ottoman-architecture-2011}"
  es: "La mezquita Sokollu Mehmed Pasha de Estambul, en la ladera de Mármara de la Primera Colina en Kadirga Limani, una de las mezquitas más bellas de Sinan; construida en 979 AH/1571-1572 CE por el gran visir Sokollu Mehmed Pasha y su esposa Esma Han Sultan, hija de Selim II {cite:freely-ottoman-architecture-2011}."
  ur: "سنان کی چھوٹی مساجد میں سب سے خوبصورت، قادرگا لیمانی کی پہلی پہاڑی کی مارمارا ڈھلوان پر استنبول کی سوکولو محمد پاشا مسجد؛ 979 ہجری / 1571-1572 عیسوی میں عظیم وزیر سوکولو محمد پاشا اور ان کی اہلیہ اسما ہان سلطان، سلیم II کی بیٹی نے تعمیر کیا تھا۔"
