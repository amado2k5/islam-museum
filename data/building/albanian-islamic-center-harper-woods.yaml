  id: "Sebuah masjid yang didirikan oleh imigran Muslim Albania di Harper Woods, Michigan, dibangun oleh Frank Beamer pada tahun 1962 dengan fasad Ottoman dan kubah yang menyatakan karakter nasionalnya {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 12-13}."
