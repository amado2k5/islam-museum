summary:
  ar: "بطاقة أولية لجامع أمير سلطان ببورصة، المسجد المنسوب إلى شيخ أمير سلطان البخاري صهر بايزيد الأول وأعيدت عمارته بعد الزلازل؛ من معالم بورصة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Emir Sultan Mosque of Bursa, associated with the shaykh Emir Sultan al-Bukhari, son-in-law of Bayezid I, and repeatedly rebuilt; an Ottoman landmark of Bursa per the cited survey, the page not yet checked."
  fr: "Ébauche de notice pour la mosquée Emir Sultan de Bursa, associée au cheikh Emir Sultan al-Bukhari, gendre de Bayezid Ier, et reconstruite à plusieurs reprises ; monument ottoman de Bursa selon l’étude citée, la page n’étant pas encore vérifiée."
  es: "Boceto de ficha para la Mezquita del Emir Sultan de Bursa, asociada con el jeque Emir Sultan al-Bukhari, yerno de Bayezid I, y reconstruida en repetidas ocasiones; un monumento otomano de Bursa según el estudio citado, página aún no verificada."
  ur: "برسا کی امیر سلطان مسجد کے لیے ڈرافٹ کارڈ، جو شیخ امیر سلطان البخاری، بایزید اول کے داماد سے منسلک ہے، اور بار بار دوبارہ تعمیر کیا گیا ہے۔ حوالہ کردہ سروے کے مطابق برسا کا ایک عثمانی نشان، صفحہ ابھی تک چیک نہیں کیا گیا۔"
