label: { ar: "حمّام كيرالي ⁦(حمّام باب الديك)⁩ في بودا", en: "Király Bath (Horoz Kapı Bath), Buda", fr: "Bain Király (bain Horoz Kapı), Buda", ur: "کیرالی حمام ⁦(خروس دروازہ حمام)⁩، بودا", es: "Baño Király (Baño Horoz Kapı), Buda", tr: "Buda'daki Kirali Hamamı (Bab Al-Dik Hamamı)", id: "Pemandian Kirali (Bak Bab Al-Dik) di Buda" }
summary:
  ar: "حمّام في بودا بدأه أرسلان باشا سنة 1565 وأتمه صوقوللي مصطفى باشا، عرف في العهد العثماني بحمّام باب الديك، وسمي «الملك» نسبة إلى أسرة كيرالي التي ملكته في القرن التاسع عشر {cite:yilmaz-ottoman-architecture-hungary-2024 p. 35}."
  en: "A bath in Buda begun by Arslan Pasha in 1565 and completed by Sokollu Mustafa Pasha, known under the Ottomans as the Rooster Gate Bath and now as the King's Bath after the Király family who owned it in the nineteenth century {cite:yilmaz-ottoman-architecture-hungary-2024 p. 35}."
  fr: "Bain de Buda commencé par Arslan Pasha en 1565 et achevé par Sokollu Mustafa Pasha, connu sous les Ottomans comme bain de la porte du Coq, aujourd’hui bain du Roi d’après la famille Király, propriétaire au XIXe siècle {cite:yilmaz-ottoman-architecture-hungary-2024 p. 35}."
  ur: "بودا میں حمام جو ارسلان پاشا نے 1565ء میں شروع اور صوقوللو مصطفیٰ پاشا نے مکمل کیا؛ عثمانی دور میں «خروس دروازہ حمام» اور اب انیسویں صدی کے مالک کیرالی خاندان کے نام پر «بادشاہ کا حمام» کہلاتا ہے {cite:yilmaz-ottoman-architecture-hungary-2024 p. 35}۔"
  es: "Un baño en Buda iniciado por Arslan Pasha en 1565 y completado por Sokollu Mustafa Pasha, conocido bajo el dominio otomano como el Baño de la Puerta del Gallo y ahora como el Baño del Rey en honor a la familia Király que lo poseyó en el siglo XIX {cite:yilmaz-ottoman-architecture-hungary-2024 p. 35}."
  tr: "Buda'da bir hamam 1565'te Arslan Paşa tarafından başlatılmış ve Soqolli Mustafa Paşa tarafından tamamlanmıştır. Osmanlı döneminde Bab al-Dik Hamamı olarak bilinmekte olup, 19. yüzyılda hüküm süren Kirali ailesinin adını taşıyan 'Kral' olarak adlandırılmıştır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 35}."
  id: "Pemandian di Buda didirikan oleh Arslan Pasha pada tahun 1565 dan diselesaikan oleh Soqolli Mustafa Pasha. Pada era Ottoman, pemandian ini dikenal sebagai Pemandian Bab al-Dik, dan dinamai 'Raja' sesuai keluarga Kirali yang memerintahnya pada abad kesembilan belas {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 35}."
