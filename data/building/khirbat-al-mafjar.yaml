summary:
  ar: "قصر يُنسب في الكتاب إلى الخليفة هشام بن عبد الملك، يقع على نحو ثلاثة أميال شمالي أريحا، وكان قصراً شتوياً. وصف الكتاب جدرانه المزينة بصور آدمية وحيوانية، وباسم الخليفة هشام مسجلاً على أحد جدرانه، وبلوحات من الرسوم النباتية والحيوانية، ومن صور لفتيات يرقصن {cite:umayyad-birth-to-fall-2006 p. 159}."
  en: "A palace which the book attributes to the caliph Hisham ibn Abd al-Malik, lying about three miles north of Jericho; it was a winter palace. The book describes its walls decorated with human and animal figures, with the name of the caliph Hisham inscribed on one of them, with panels of plant and animal designs, and with images of dancing girls {cite:umayyad-birth-to-fall-2006 p. 159}."
  fr: "Palais d’hiver que le livre attribue au calife Hisham ibn Abd al-Malik, à environ trois milles au nord de Jéricho. Le livre décrit ses murs ornés de figures humaines et animales, le nom du calife Hisham inscrit sur l’un d’eux, des panneaux de motifs végétaux et animaux et des images de jeunes filles dansant {cite:umayyad-birth-to-fall-2006 p. 159}."
  es: "Un palacio que el libro atribuye al califa Hisham ibn Abd al-Malik, situado a unos cinco kilómetros al norte de Jericó; era un palacio de invierno. El libro describe sus muros decorados con figuras humanas y animales, con el nombre del califa Hisham inscrito en una de ellas, con paneles de diseños vegetales y animales, y con imágenes de bailarinas {cite:umayyad-birth-to-fall-2006 p. 159}."
  ur: "ایک محل جسے کتاب نے خلیفہ ہشام بن عبد الملک سے منسوب کیا ہے، جو جیریکو سے تقریباً تین میل شمال میں واقع ہے۔ یہ موسم سرما کا محل تھا۔ کتاب میں اس کی دیواروں کو انسانی اور حیوانی شکلوں سے مزین کیا گیا ہے، ان میں سے ایک پر خلیفہ ہشام کا نام کندہ ہے، جس میں پودوں اور جانوروں کے ڈیزائن کے پینل ہیں، اور رقص کرنے والی لڑکیوں کی تصویریں ہیں۔ 159}۔"
  tr: "Kitapta Halife Hisham ibn Abd al-Malik'e atfedilen ve Eriha'nın yaklaşık üç mil kuzeyinde bulunan bir saray kışlık saraydı. Kitap, duvarlarının insan ve hayvan heykelleriyle süslendiğini, Halife Hisham'ın adının bir duvarında yazılı olduğunu, bitki ve hayvan çizimlerinin resimleri ile dans eden kızların resimlerini anlatıyordu {cite:umayyad-birth-to-autumn-2006, s. 159}."
  id: "Sebuah istana yang dalam buku tersebut dikaitkan dengan Khalifah Hisham ibn Abd al-Malik, terletak sekitar tiga mil di utara Yerikho, adalah istana musim dingin. Buku tersebut menggambarkan dindingnya yang dihiasi dengan gambar manusia dan hewan, dengan nama Khalifah Hisham terukir di salah satu dindingnya, dengan lukisan gambar tumbuhan dan hewan, serta gambar gadis menari {cite:umayyad-birth-to-fall-2006, hlm. 159}."
