label:
  ar: "الحجرة النبوية: بيت عائشة وقبر النبي وصاحبيه"
  en: "The Prophet's chamber (al-Hujra): 'A'isha's room and the graves of the Prophet and his two companions"
  fr: "La chambre du Prophète (al-Hujra) : la pièce d’Aïcha et les tombes du Prophète et de ses deux compagnons"
  ur: "حجرۂ نبوی: عائشہ کا کمرہ اور نبی اور آپ کے دو رفیقوں کی قبریں"
  es: "La cámara del Profeta (al-Hujra): la habitación de Aisha y las tumbas del Profeta y sus dos compañeros."
  tr: "Peygamberin Odası: Aişa'nın Evi, Peygamber'in Mezarı ve Yoldaşları"
  id: "Kamar Nabi: Rumah Aisha, Makam Nabi, dan Rekan-Rekannya"
summary:
  ar: "الحجرة النبوية هي بيت عائشة الذي توفي فيه النبي ودُفن، ثم دُفن فيه أبو بكر وعمر، فكشفت عائشة للقاسم بن محمد عن ثلاثة قبور لا مشرفة ولا لاطئة مبطوحة ببطحاء حمراء {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. وتروي كتب الدلائل أن عائشة رأت ثلاثة أقمار وقعن في حجرها فقال لها أبوها إن صدقت رؤياك دفن في بيتك خير أهل الأرض ثلاثة {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3389}. وفي ولاية الوليد بن عبد الملك هُدمت بيوت أزواج النبي وأُدخلت حجرة عائشة في المسجد، وأنكر سعيد بن المسيب ذلك {cite:al-bidaya-wal-nihaya scan vol. 5 p. 87} {cite:subul-huda-salihi scan vol. 4 p. 2006}."
  en: "The Prophet's chamber is 'A'isha's house, where the Prophet died and was buried and where Abu Bakr and 'Umar were later buried; 'A'isha uncovered for al-Qasim ibn Muhammad three graves neither raised nor flat, spread with red gravel {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. The books on the signs of prophethood report 'A'isha's dream of three moons falling in her lap, and her father's reply that if her dream was true, three of the best people on earth would be buried in her house {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3389}. In the time of al-Walid ibn 'Abd al-Malik the houses of the Prophet's wives were pulled down and 'A'isha's chamber was taken into the mosque, which Sa'id ibn al-Musayyab objected to {cite:al-bidaya-wal-nihaya scan vol. 5 p. 87} {cite:subul-huda-salihi scan vol. 4 p. 2006}."
  fr: "La chambre du Prophète est la maison d’Aïcha, où le Prophète mourut et fut inhumé et où Abu Bakr et Umar furent ensuite enterrés ; Aïcha découvrit pour al-Qasim ibn Muhammad trois tombes ni surélevées ni plates, couvertes de gravier rouge {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. Les livres sur les signes de la prophétie rapportent le rêve d’Aïcha de trois lunes tombant sur ses genoux et la réponse de son père : si son rêve était vrai, trois des meilleures personnes sur terre seraient inhumées dans sa maison {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3389}. Au temps d’al-Walid ibn Abd al-Malik, les maisons des épouses du Prophète furent démolies et la chambre d’Aïcha fut intégrée à la mosquée, ce à quoi Sa’id ibn al-Musayyab s’opposa {cite:al-bidaya-wal-nihaya scan vol. 5 p. 87} {cite:subul-huda-salihi scan vol. 4 p. 2006}."
  ur: "حجرۂ نبوی عائشہ کا گھر ہے جہاں نبی کی وفات ہوئی اور آپ کی تدفین، اور بعد میں ابوبکر اور عمر بھی وہیں دفن ہوئے؛ عائشہ نے قاسم بن محمد کے لیے تین قبریں کھول کر دکھائیں جو نہ اونچی تھیں نہ زمین سے لگی ہوئی، اور سرخ کنکریوں سے ڈھکی تھیں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}۔ دلائل کی کتابیں عائشہ کا وہ خواب بیان کرتی ہیں جس میں تین چاند ان کی گود میں گرے، اور ان کے والد کا جواب کہ اگر تمہارا خواب سچا ہوا تو تمہارے گھر میں روئے زمین کے بہترین تین افراد دفن ہوں گے {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3389}۔ ولید بن عبدالملک کے دور میں ازواجِ نبی کے گھر ڈھائے گئے اور عائشہ کا حجرہ مسجد میں شامل کر لیا گیا، جس پر سعید بن مسیب نے اعتراض کیا {cite:al-bidaya-wal-nihaya scan vol. 5 p. 87} {cite:subul-huda-salihi scan vol. 4 p. 2006}۔"
  es: "La cámara del Profeta es la casa de Aisha, donde el Profeta murió y fue enterrado, y donde Abu Bakr y Umar fueron enterrados posteriormente; Aisha descubrió para al-Qasim ibn Muhammad tres tumbas que no eran ni elevadas ni planas, cubiertas de grava roja {cite:al-bidaya-wal-nihaya scan vol. 3 p. 300}. Los libros sobre los signos de la profecía relatan el sueño de Aisha de tres lunas cayendo en su regazo, y la respuesta de su padre de que si su sueño era cierto, tres de las mejores personas de la tierra serían enterradas en su casa {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 3389}. En tiempos de al-Walid ibn 'Abd al-Malik, las casas de las esposas del Profeta fueron derribadas y la habitación de 'Aisha fue llevada a la mezquita, a lo que Sa'id ibn al-Musayyab se opuso {cite:al-bidaya-wal-nihaya scan vol. 5 p. 87} {cite:subul-huda-salihi scan vol. 4 p. 2006}."
  tr: "Peygamber'in odası, Peygamber'in öldüğü ve gömüldüğü Aişe'nin evidir; ardından Ebu Bekir ve Ömer orada gömülmüştür. Aişe, el-Kasım bin Muhammed'e, ne onurlandırılmış ne de eğimli, kırmızı çamurla kaplı üç mezar vahy etti {cite:al-bidaya-wal-nihaya tarama cilt 3, s. 300}. Kanıt kitapları, Aişe'nin kucağına üç ayın düştüğünü gördüğünü ve babasının ona, 'Eğer vizyonun doğruysa, yeryüzündeki en iyi insanlar senin evinde gömülecek {atıf:dalail-al-nubuwwa-bayhaqi taraması cilt 1, s. 3389} dediğini anlatır. El-Velid bin Abdülmelik'in valiliği sırasında, Peygamber'in eşlerinin evleri yıkıldı ve Aişe'nin odası camiye yerleştirildi. Seyid bin Musayyib bunu reddetti {atıf:al-bidaya-wal-nihaya taraması cilt 5 s. 87} {cite:subul-huda-salihi taraması cilt 4 s. 2006}."
  id: "Kamar Nabi adalah rumah Aisha tempat Nabi wafat dan dimakamkan, kemudian Abu Bakr dan Umar dimakamkan di sana. Aisha memahamikan kepada al-Qasim ibn Muhammad tiga makam, tidak dihormati maupun miring, ditutupi lumpur merah {cite:al-bidaya-wal-nihaya scan vol. 3, hlm. 300}. Buku-buku bukti menceritakan bahwa Aisha melihat tiga bulan jatuh di pangkuannya, dan ayahnya berkata kepadanya, 'Jika penglihatanmu benar, yang terbaik di dunia akan dimakamkan di rumahmu {cite:dalail-al-nubuwwa-bayhaqi scan vol. 1, hlm. 3389}. Selama masa pemerintahan Al-Walid ibn Abd al-Malik, rumah-rumah istri Nabi dihancurkan dan kamar Aisha dimasukkan ke dalam masjid. Sa'id ibn al-Musayyib membantah hal ini {cite:al-bidaya-wal-nihaya scan vol. 5 hlm. 87} {cite:subul-huda-salihi scan vol. 4 hlm. 2006}."
