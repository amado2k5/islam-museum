summary:
  ar: "مسجد ذات ثلاثة عقود في الجانب الغربي من الساحة المثمنة لضريح عيسى خان نيازي قرب نظام الدين بدلهي، بنيت مع الضريح سنة 954هـ/1547–1548، يعدها ناث أول مثال ناجح لهذا الطراز {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  en: "A three-arched mosque on the west side of the octagonal enclosure of Isa Khan Niyazi's tomb near Nizamuddin, Delhi, built with the tomb in AH 954/1547-48, which Nath calls the first successful example of the type {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  ur: "دہلی میں نظام الدین کے قریب عیسیٰ خان نیازی کے مقبرے کے ہشت پہلو احاطے کے مغربی جانب سہ محرابی مسجد، جو 954ھ/1547–48ء میں مقبرے کے ساتھ بنی؛ ناتھ اسے اس قسم کی پہلی کامیاب مثال کہتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 235}۔"
