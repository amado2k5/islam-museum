label: { ar: "مسجد عيسى خان نيازي في دلهي", en: "Mosque of Isa Khan Niyazi, Delhi", fr: "Mosquée d’Isa Khan Niyazi, Delhi", ur: "عیسیٰ خان نیازی کی مسجد، دہلی", es: "Mezquita de Isa Khan Niyazi, Delhi", tr: "Delhi'deki Isa Khan Niazi Camii", id: "Masjid Isa Khan Niazi di Delhi" }
summary:
  ar: "مسجد ذات ثلاثة عقود في الجانب الغربي من الساحة المثمنة لضريح عيسى خان نيازي قرب نظام الدين بدلهي، بنيت مع الضريح سنة 954هـ/1547–1548، يعدها ناث أول مثال ناجح لهذا الطراز {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  en: "A three-arched mosque on the west side of the octagonal enclosure of Isa Khan Niyazi's tomb near Nizamuddin, Delhi, built with the tomb in AH 954/1547-48, which Nath calls the first successful example of the type {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  fr: "Mosquée à trois arcs à l’ouest de l’enceinte octogonale du tombeau d’Isa Khan Niyazi près de Nizamuddin, Delhi, construite avec le tombeau en 954 H/1547–1548, que Nath qualifie de premier exemple réussi de ce type {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  ur: "دہلی میں نظام الدین کے قریب عیسیٰ خان نیازی کے مقبرے کے ہشت پہلو احاطے کے مغربی جانب سہ محرابی مسجد، جو 954ھ/1547–48ء میں مقبرے کے ساتھ بنی؛ ناتھ اسے اس قسم کی پہلی کامیاب مثال کہتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 235}۔"
  es: "Una mezquita de tres arcos en el lado oeste del recinto octogonal de la tumba de Isa Khan Niyazi cerca de Nizamuddin, Delhi, construida junto con la tumba en AH 954/1547-48, que Nath llama el primer ejemplo exitoso de este tipo {cite:nath-history-of-mughal-architecture-1-1982 p. 235} {cite:nath-history-of-mughal-architecture-1-1982 p. 236}."
  tr: "Delhi'deki Nizamuddin yakınlarındaki Isa Khan Niazi'nin türbesinin sekizgen avlusunun batı tarafında yer alan üç kemerli bir cami olan bu cami, 954 Hicri / 1547–1548 yıllarında kutsal alanın yanında inşa edilmiştir ve Nath bunu bu tarzın ilk başarılı örneği olarak kabul eder {cite:nath-history-of-mughal-architecture-1-1-1982 s. 235} {cite:nath-history-of-mughal-architecture-1-1-1982 s. 236}."
  id: "Sebuah masjid tiga lengkungan di sisi barat halaman segi delapan makam Isa Khan Niazi dekat Nizamuddin di Delhi, dibangun di samping makam pada tahun 954 H / 1547–1548 M, Nath menganggapnya sebagai contoh pertama yang sukses dari gaya ini {cite:nath-history-of-mughal-architecture-1-1-1982 hlm. 235} {cite:nath-history-of-mughal-architecture-1-1-1982 hlm. 236}."
