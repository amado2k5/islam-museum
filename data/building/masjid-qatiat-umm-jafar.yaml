label:
  ar: جامع قطيعة أم جعفر
  en: The mosque of Qati'at Umm Ja'far
  fr: "Mosquée de Qati’at Umm Ja’far"
  es: "La mezquita de Qati'at Umm Ja'far"
  ur: "مسجد قتیط ام جعفر"
  tr: "Um Jaafar Camii"
  id: "Masjid um Jaafar"
summary:
  ar: "مسجد بقطيعة أم جعفر في الجانب الغربي من بغداد؛ تحدث الناس سنة تسع وسبعين وثلثمائة بأن امرأة من أهل الجانب الشرقي رأت في منامها أنه يصلي فيه ووضع كفه في حائط القبلة، فقصدت الموضع ووجدت أثر الكف وماتت في ذلك الوقت كما أُخبرت، فعُمر المسجد ووسّعه الشريف أبو أحمد الموسوي وبناه، واستأذن الطائع لله في أن يجعله جامعاً تُصلى فيه الجمعات واحتج بأنه من وراء خندق يقطع بينه وبين البلد فيصير بذلك الموضع بلداً آخر، فأذن له فصار جامعاً يُصلى فيه الجمعات {cite:muntazam-ibn-al-jawzi j.7 p.152-153}."
  en: "A mosque at Qati'at Umm Ja'far in western Baghdad: in 379 a woman of the eastern side dreamt that she would die the next afternoon and that the mosque stood in that quarter with a handprint set in its qibla wall; they went to the spot, found the trace of the palm, and she died as foretold. The mosque was then built and enlarged by the sharif Abu Ahmad al-Musawi, who obtained al-Ta'i''s leave to make it a congregational mosque — arguing that the moat made the place a separate town — and Friday prayers were established there {cite:muntazam-ibn-al-jawzi j.7 p.152-153}."
  fr: "Mosquée de l’ouest de Bagdad : en 379, une femme de la rive est rêva qu’elle mourrait le lendemain après-midi et qu’une empreinte de main marquait le mur de qibla de cette mosquée. On trouva l’empreinte sur place et elle mourut à l’heure annoncée. Abu Ahmad al-Musawi reconstruisit et agrandit la mosquée, obtenant d’al-Ta’i la permission d’y célébrer le vendredi en soutenant que le fossé en faisait une ville distincte {cite:muntazam-ibn-al-jawzi j.7 p.152-153}"
  es: "Una mezquita en Qati'at Umm Ja'far, en el oeste de Bagdad: en el año 379, una mujer del lado oriental soñó que moriría a la tarde siguiente y que la mezquita se alzaba en ese barrio con la huella de una mano grabada en su muro de la qibla; fueron al lugar, encontraron la huella de la palma y ella murió como se había predicho. La mezquita fue construida y ampliada por el sharif Abu Ahmad al-Musawi, quien obtuvo el permiso de al-Ta'i para convertirla en una mezquita congregacional —argumentando que el foso hacía del lugar una ciudad aparte— y allí se establecieron las oraciones del viernes {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 152-153}."
  ur: "مغربی بغداد میں قتیط ام جعفر کی ایک مسجد: 379 میں مشرقی جانب کی ایک عورت نے خواب دیکھا کہ وہ اگلی سہ پہر مر جائے گی اور مسجد اس چوتھائی میں کھڑی ہے جس کی قبلہ دیوار میں ہاتھ کا نشان لگا ہوا ہے۔ وہ موقع پر گئے، کھجور کا نشان پایا، اور وہ پیشین گوئی کے مطابق مر گئی۔ اس کے بعد اس مسجد کو شریف ابو احمد الموسوی نے بنایا اور بڑھایا، جس نے الطائی سے اجازت حاصل کی کہ اسے ایک اجتماعی مسجد بنایا جائے - یہ دلیل دیتے ہوئے کہ کھائی نے اس جگہ کو ایک الگ شہر بنا دیا ہے - اور وہاں جمعہ کی نماز قائم کی گئی تھی۔"
  tr: "Bağdat'ın batı tarafındaki Bakti'a um Ca'far camidi; 379 H.M. yılında doğu tarafından bir kadının rüyasında onun orada namaz kıldığını gördüğünü ve elini kıble duvarına koyduğunu anlattı. Kadın oraya uğradı ve elin izini buldu, o sırada öldü, bildirdi. Cami Sharif Ebu Ahmed el-Musavi tarafından yenilendi, genişletildi ve yeniden inşa edildi. İtaatkar kişi, caminin cuma namazı yapılabileceği bir cami yapmak için Allah'tan izin istedi; bunun kasabadan ayrılan bir hendekte olduğunu ve başka bir şehir yaptığını savundu. İzin verdi ve cuma namazı yapılacak bir cami oldu. {cite:muntazam-ibn-al-jawzi J.7, s.152-153}."
  id: "Masjid Bakti'a um Ja'far di sisi barat Baghdad; orang-orang menceritakan pada tahun 379 H bahwa seorang wanita dari sisi timur melihat dalam mimpinya bahwa dia sedang shalat di sana dan meletakkan tangannya di dinding kibla. Dia mengunjungi tempat itu dan menemukan jejak tangan itu, dan dia meninggal pada saat itu, seperti yang dia laporkan. Masjid itu direnovasi, diperluas oleh Sharif Abu Ahmad al-Mousawi, dan dibangun kembali. Orang yang taat meminta izin dari Tuhan untuk menjadikannya masjid tempat salat Jumat dapat diadakan, dengan alasan bahwa masjid itu berada di balik parit yang memisahkannya dari kota, menjadikannya kota lain. Dia memberikan izin dan menjadi masjid tempat salat Jumat diadakan. {cite:muntazam-ibn-al-jawzi J.7, hlm.152-153}."
