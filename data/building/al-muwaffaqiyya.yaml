summary:
  ar: "المدينة العسكرية التي أنشأها أبو أحمد الموفق مقابل مدينة صاحب الزنج «المختارة» في حربه عليه سنة سبع وستين ومائتين: عسكر بها لما علم أنه لا بد من المصابرة، فجهّز التجار إليها واتُّخذت بها الأسواق، وبنى أبو أحمد فيها الجامع، واتُّخذت بها دور الضرب فضُربت الدنانير والدراهم، وأُجرى للناس العطاء. ومنها عبر أبو أحمد بنفسه إلى مدينة القوم في ذي الحجة سنة ٢٦٧ فغلب على ركن من أركانها وأشعل النار فيما على سورهم من منجنيق وعرادة {cite:muntazam-ibn-al-jawzi p. 59-60}."
  en: "The counter-city al-Muwaffaq built facing the Zanj capital al-Mukhtara in 267: once he saw the siege would be long he moved the merchants in, founded markets and a congregational mosque, and struck dinars and dirhams in its own mint — the staging point for the crossing into the rebels' town {cite:muntazam-ibn-al-jawzi p. 59-60}."
