summary:
  ar: "ضريح زوج أورنگزيب الأولى في أورنگ‌آباد على مثال تاج محل، بُني في الغالب بالجص، وينسبه بروكس إلى أورنگزيب {cite:brookes-gardens-of-paradise-1987 p.160} {cite:brookes-gardens-of-paradise-1987 p.161}."
  en: "The tomb of Aurangzeb's first wife at Aurangabad, modelled on the Taj Mahal and built largely in plaster, which Brookes attributes to Aurangzeb {cite:brookes-gardens-of-paradise-1987 p.160} {cite:brookes-gardens-of-paradise-1987 p.161}."
  fr: "Le tombeau de la première épouse d’Aurangzeb à Aurangabad, inspiré du Taj Mahal et construit en grande partie en plâtre, que Brookes attribue à Aurangzeb {cite:brookes-gardens-of-paradise-1987 p.160} {cite:brookes-gardens-of-paradise-1987 p.161}."
  es: "La tumba de la primera esposa de Aurangzeb en Aurangabad, modelada a imagen del Taj Mahal y construida en gran parte en yeso, que Brookes atribuye a Aurangzeb {cite:brookes-gardens-of-paradise-1987 p.160} {cite:brookes-gardens-of-paradise-1987 p.161}."
  ur: "اورنگ آباد میں اورنگ زیب کی پہلی بیوی کا مقبرہ، جو تاج محل کی طرز پر بنایا گیا تھا اور بڑے پیمانے پر پلاسٹر میں بنایا گیا تھا، جسے بروکس نے اورنگ زیب سے منسوب کیا ہے {حوالہ: بروکس-گارڈنز-آف-پیراڈائز-1987 صفحہ 160}"
  tr: "Aurangzeb'in ilk eşinin Aurangabad'daki mezarı, Tac Mahal örnek alınarak inşa edilmiştir ve büyük ölçüde alçıdan yapılmıştır; Brookes bunu Aurangzeb'e atfetmiştir {cite:Brookes-gardens-of-paradise-1987 s.160} {cite:Brookes-gardens-of-paradise-1987 s.161}."
  id: "Makam istri pertama Aurangzeb di Aurangabad, yang dimodelkan dari Taj Mahal, sebagian besar dibangun dari plester, dan Brookes mengaitkannya dengan Aurangzeb {cite:Brookes-gardens-of-paradise-1987 hlm.160} {cite:Brookes-gardens-of-paradise-1987 hlm.161}."
