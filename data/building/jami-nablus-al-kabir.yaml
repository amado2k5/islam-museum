label:
  ar: "الجامع الصلاحي الكبير"
  en: "Great (Salahi) Mosque of Nablus"
  ur: "نابلس کی عظیم ⁦(صلاحی)⁩ مسجد"
  fr: "Grande Mosquée (Salahi) de Naplouse"
  es: "Gran Mezquita (Salahi) de Nablus"
  tr: "Nablus Ulu (Salahi) Camii"
  id: "Masjid Agung (Salahi) Nablus"
summary:
  ar: "الجامع الكبير بقلب نابلس القديمة، أعظم مساجد المدينة. يقوم على بقايا كنيسة بيزنطية من القرن السادس أُعيد بناؤها جامعاً في العصر الأيوبي، ويُنسب إصلاحه إلى صلاح الدين بعد ١١٨٧م ولذلك يلقّب بالصلاحي؛ جُدّد ووُسّع مراراً في العصرين المملوكي والعثماني {cite:unesco-tl-6956-nablus}{cite:archnet}."
  en: "The Great Mosque in the heart of old Nablus, the city’s largest mosque. It stands on the remains of a sixth-century Byzantine basilica and was rebuilt as a congregational mosque in the Ayyubid period; tradition links its restoration to Salah al-Din after 1187, hence its name "al-Salahi". It was renewed and enlarged repeatedly under the Mamluks and Ottomans {cite:unesco-tl-6956-nablus}{cite:archnet}."
  ur: "قدیم نابلس کے مرکز میں واقع جامع کبیر، شہر کی سب سے بڑی مسجد۔ یہ چھٹی صدی کی بازنطینی باسیلیکا کی باقیات پر کھڑی ہے اور ایوبی دور میں جامع کے طور پر دوبارہ تعمیر ہوئی؛ روایت اس کی مرمت صلاح الدین سے 1187ء کے بعد منسوب کرتی ہے، اسی لیے اسے صلاحی کہا جاتا ہے۔ مملوک اور عثمانی دور میں بار بار توسیع ہوئی {cite:unesco-tl-6956-nablus}{cite:archnet}۔"
  fr: "La Grande Mosquée au cœur de la vieille Naplouse, la plus grande mosquée de la ville. Elle s’élève sur les vestiges d’une basilique byzantine du VIe siècle et fut rebâtie en mosquée à l’époque ayyoubide ; la tradition rattache sa restauration à Saladin après 1187, d’où son nom d’al-Salahi. Elle fut remaniée et agrandie sous les Mamelouks et les Ottomans {cite:unesco-tl-6956-nablus}{cite:archnet}."
  es: "La Gran Mezquita en el corazón del casco antiguo de Nablus, la mayor mezquita de la ciudad. Se alza sobre los restos de una basílica bizantina del siglo VI y fue reconstruida como mezquita congregacional en época ayubí; la tradición vincula su restauración con Saladino tras 1187, de ahí su nombre al-Salahi. Fue renovada y ampliada bajo los mamelucos y los otomanos {cite:unesco-tl-6956-nablus}{cite:archnet}."
  tr: "Eski Nablus’un merkezindeki Ulu Cami, şehrin en büyük camisi. Altıncı yüzyıldan kalma bir Bizans bazilikasının kalıntıları üzerinde durur ve Eyyubi döneminde cami olarak yeniden inşa edildi; gelenek onarımını 1187 sonrası Selahaddin’e bağlar, bu yüzden "Salahi" denir. Memlük ve Osmanlı dönemlerinde tekrar tekrar genişletildi {cite:unesco-tl-6956-nablus}{cite:archnet}."
  id: "Masjid Agung di jantung kota tua Nablus, masjid terbesar kota itu. Berdiri di atas sisa basilika Bizantium abad keenam dan dibangun kembali sebagai masjid pada masa Ayyubiyah; tradisi mengaitkan restorasinya dengan Salahuddin setelah 1187, sehingga disebut al-Salahi. Dipugar dan diperluas berulang kali pada masa Mamluk dan Utsmaniyah {cite:unesco-tl-6956-nablus}{cite:archnet}."
