summary:
  ar: "حصن الأبراج السبعة عند مرمرة: أربعة أبراج ثيودوسية وثلاثة أضافها الفاتح، يضم الباب الذهبي؛ سجن عثماني أُعدم فيه عثمان الثاني 1622م."
  en: "The Castle of the Seven Towers on the Marmara walls: four Theodosian towers plus three added by the Conqueror, enclosing the Golden Gate; Ottoman state prison where Osman II was executed in 1622."
  fr: "Château des Sept Tours aux remparts de Marmara, quatre théodosiennes et trois du Conquérant, Porte Dorée ; prison d’État où Osman II fut exécuté en 1622."
  es: "El Castillo de las Siete Torres en las murallas de Mármara: cuatro torres teodosianas más tres añadidas por el Conquistador, que rodean la Puerta Dorada; prisión estatal otomana donde Osman II fue ejecutado en 1622."
  ur: "مارمارا کی دیواروں پر سات ٹاورز کا قلعہ: گولڈن گیٹ کو گھیرے ہوئے، فاتح کے ذریعے چار تھیوڈوسیئن ٹاورز اور تین شامل کیے گئے؛ عثمانی ریاست کی جیل جہاں عثمان ثانی کو 1622 میں پھانسی دی گئی۔"
  tr: "Marmara'daki Yedi Kule kalesi: dört Theodosian kulesi ve fatih tarafından eklenen üç kule, bunlar arasında Altın Kapı da var; 1622 yılında II. Osmanlı'nın idam edildiği bir hapishanesi."
  id: "Benteng Tujuh Menara di Marmara: empat menara Theodosian dan tiga yang ditambahkan oleh penakluk, termasuk Gerbang Emas; sebuah penjara Ottoman tempat Osman II dieksekusi pada tahun 1622 M."
