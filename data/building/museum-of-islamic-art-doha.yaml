summary:
  ar: "متحف الفن الإسلامي في الدوحة، صممه المعماري آي إم باي على جزيرة اصطناعية عند طرف كورنيش الدوحة، وافتتحه أمير قطر الشيخ حمد في 22 نوفمبر 2008؛ تملكه متاحف قطر، ويعرض فنونا إسلامية من ثلاث قارات عبر أربعة عشر قرنا، وأُعيد افتتاحه بعد تجديد في أكتوبر 2022."
  en: "The Museum of Islamic Art in Doha, designed by I. M. Pei on an artificial island at one end of the Doha Corniche and opened by the Emir of Qatar, Sheikh Hamad, on 22 November 2008; owned by Qatar Museums, it shows Islamic art from three continents across fourteen centuries and reopened after a renovation in October 2022."
  ur: "دوحہ کا عجائب گھرِ اسلامی فن، جسے آئی ایم پے نے دوحہ کورنیش کے سرے پر ایک مصنوعی جزیرے پر ڈیزائن کیا اور امیرِ قطر شیخ حمد نے 22 نومبر 2008 کو کھولا؛ قطر میوزیمز کی ملکیت، تین براعظموں اور چودہ صدیوں کا اسلامی فن، اور اکتوبر 2022 میں تزئین کے بعد دوبارہ کھلا۔"
