  en: Dar al-'Ilm of Baghdad (Sabur's library)
summary:
  ar: "دار علم أسّسها أبو نصر سابور بن أردشير وزير بهاء الدولة؛ اشترى دارًا بين السورين سنة ٣٨١ وحمل إليها كتبًا من كل علم فبلغت أكثر من عشرة آلاف مجلد ووقفها على طلاب العلم، وبقيت نحو سبعين سنة حتى احترقت حين قدم طغرلبك بغداد سنة ٤٥٠ {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
  en: "A house of learning founded by Abu Nasr Sabur ibn Ardashir, vizier of Baha' al-Dawla. In 381 he bought a house between the two walls, brought into it books of every discipline, more than ten thousand volumes, and endowed it for students of knowledge. It stood for about seventy years, until it burned when Tughril Beg entered Baghdad in 450 {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
