label:
  ar: دار العلم ببغداد ⁦(دار العلم السابورية)⁩
  en: Dar al-'Ilm of Baghdad (Sabur's library)
  fr: "Dar al-Ilm de Bagdad (bibliothèque de Sabur)"
  es: "Dar al-'Ilm de Bagdad (biblioteca de Sabur)"
  ur: "دار العلم بغداد ⁦(صبور کی لائبریری)⁩"
  tr: "Bağdat'taki Dar Al-Ilm (Dar al-Ilm al-Sabouriya)"
  id: "Dar Al-Ilm di Baghdad (Dar Al-Ilm Al-Sabouriya)"
summary:
  ar: "دار علم أسّسها أبو نصر سابور بن أردشير وزير بهاء الدولة؛ اشترى دارًا بين السورين سنة ٣٨١ وحمل إليها كتبًا من كل علم فبلغت أكثر من عشرة آلاف مجلد ووقفها على طلاب العلم، وبقيت نحو سبعين سنة حتى احترقت حين قدم طغرلبك بغداد سنة ٤٥٠ {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
  en: "A house of learning founded by Abu Nasr Sabur ibn Ardashir, vizier of Baha' al-Dawla. In 381 he bought a house between the two walls, brought into it books of every discipline, more than ten thousand volumes, and endowed it for students of knowledge. It stood for about seventy years, until it burned when Tughril Beg entered Baghdad in 450 {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
  fr: "Maison du savoir fondée par Abu Nasr Sabur ibn Ardashir, vizir de Baha al-Dawla. En 381, il acheta une maison entre les deux murailles, y réunit des livres de toutes disciplines, plus de dix mille volumes, et la constitua en waqf pour les étudiants. Elle subsista environ soixante-dix ans, jusqu’à son incendie lors de l’entrée de Tughril Beg à Bagdad en 450 {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
  es: "Una casa de aprendizaje fundada por Abu Nasr Sabur ibn Ardashir, visir de Baha' al-Dawla. En 381 compró una casa entre dos muros, la llenó con libros de todas las disciplinas, más de diez mil volúmenes, y la dotó para estudiantes del saber. Permaneció en pie durante unos setenta años, hasta que se incendió cuando Tughril Beg entró en Bagdad en 450 {cite:muntazam-ibn-al-jawzi j.8 p.364-365}."
  ur: "بہاء الدولہ کے وزیر ابو نصر صبور ابن اردشیر کے ذریعہ تعلیم کا گھر۔ 381 میں اس نے دو دیواروں کے درمیان ایک مکان خریدا، اس میں ہر شعبہ کی کتابیں، دس ہزار سے زائد جلدیں، اور علم کے طلبا کے لیے وقف کر دیں۔ یہ تقریباً ستر سال تک کھڑا رہا، یہاں تک کہ جب طغرل بیگ 450 میں بغداد میں داخل ہوا تو یہ جل گیا۔"
  tr: "Dar Alam, Baha' al-Dawla'nın veziri Ebu Nasr Sabur ibn Ardaşir tarafından kurulmuştur; 381 Hicri yılında, iki Suriyeli arasında bir Dar satın almış ve onlara tüm bilimlerden kitaplar getirmiştir; toplamda on binden fazla cilt, bunları bilgi öğrencilerine bağışlamıştır. Yaklaşık yetmiş yıl boyunca kalmıştır; ta ki 450 yılında Tuğril Beg Bağdat'a geldiğinde yanarak yok olana kadar {atıf:Muntazam-ibn-al-jawzi J.8 s.364-365}."
  id: "Dar Alam didirikan oleh Abu Nasr Sabur ibn Ardashir, wazir Baha' al-Dawla; ia membeli sebuah Dar di antara kedua orang Suriah pada tahun 381 H dan membawa ke sana buku-buku dari semua ilmu pengetahuan, dengan total lebih dari sepuluh ribu jilid, yang ia bagikan kepada para pelajar ilmu. Dar itu bertahan selama sekitar tujuh puluh tahun hingga terbakar ketika Tughril Beg tiba di Baghdad pada tahun 450 {cite:Muntazam-ibn-al-jawzi J.8 hlm.364-365}."
