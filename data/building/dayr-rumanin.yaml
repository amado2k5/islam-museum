summary:
  ar: "دير كبير حسن بالشام، يُروى فيه أن عمر بن الخطاب في الجاهلية قتل بطريقاً من بطارقة أنطاكية وهرب فصبّح هذا الدير، فاستضافه راهبه وقرأ في كتاب عنده أن رجلاً اسمه عمر سيملك أكثر الأرض ويخرج هرقل من الشام، فأخذ منه كتاب أمان على أدم؛ فلما جاء عمر بيت المقدس لقيه الراهب شيخاً بالكتاب فقال له عمر إنه كتبه في الجاهلية ولا يحل تضييع فيء المسلمين ولكنه قاطعه على خراجه بما فيه رفق، ويقال إن الرهبان يتوارثون الكتاب وإن الولاة يمضونه لهم {cite:umari-masalik-1924 p. 342-343}."
  en: "A great thriving monastery of Syria, in which runs the famous tale: young Umar ibn al-Khattab, fleeing after killing a Byzantine patrolman at Antioch, was sheltered by its monk, whose book foretold a man named Umar would rule most of the earth and drive Heraclius from Syria; he took Umar's written pledge on a strip of leather, and when the caliph later came to Jerusalem the old monk met him with it — Umar would not squander the Muslims' fay', but commuted the pledge into a gentle kharaj the monks' heirs still hold and governors still honour {cite:umari-masalik-1924 p. 342-343}."
  fr: "Grand monastère prospère de Syrie où se déroule un récit célèbre : jeune, Umar ibn al-Khattab, fuyant après avoir tué un patrouilleur byzantin à Antioche, fut accueilli par un moine dont le livre annonçait qu’un Umar gouvernerait la plupart de la terre et chasserait Héraclius de Syrie ; il obtint d’Umar un engagement écrit sur une bande de cuir ; lorsque le calife vint à Jérusalem, le vieux moine le lui présenta ; Umar refusa de dissiper le fay’ des musulmans mais convertit l’engagement en kharaj modéré, transmis aux héritiers des moines et toujours respecté des gouverneurs {cite:umari-masalik-1924 p. 342-343}."
  es: "Un gran y próspero monasterio de Siria, donde se desarrolla la famosa historia: el joven Umar ibn al-Khattab, huyendo tras matar a un patrullero bizantino en Antioquía, fue acogido por su monje, cuyo libro predijo que un hombre llamado Umar gobernaría la mayor parte de la tierra y expulsaría a Heraclio de Siria; tomó la promesa escrita de Umar en una tira de cuero, y cuando el califa llegó más tarde a Jerusalén, el viejo monje lo recibió con ella: Umar no malgastó el fay' de los musulmanes, sino que conmutó la promesa por un gentil kharaj que los herederos de los monjes aún conservan y que los gobernadores aún honran {cite:umari-masalik-1924 p. 342-343}."
