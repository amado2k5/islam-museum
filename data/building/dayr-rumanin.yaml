summary:
  ar: "دير كبير حسن بالشام، يُروى فيه أن عمر بن الخطاب في الجاهلية قتل بطريقاً من بطارقة أنطاكية وهرب فصبّح هذا الدير، فاستضافه راهبه وقرأ في كتاب عنده أن رجلاً اسمه عمر سيملك أكثر الأرض ويخرج هرقل من الشام، فأخذ منه كتاب أمان على أدم؛ فلما جاء عمر بيت المقدس لقيه الراهب شيخاً بالكتاب فقال له عمر إنه كتبه في الجاهلية ولا يحل تضييع فيء المسلمين ولكنه قاطعه على خراجه بما فيه رفق، ويقال إن الرهبان يتوارثون الكتاب وإن الولاة يمضونه لهم {cite:umari-masalik-1924 p. 342-343}."
  en: "A great thriving monastery of Syria, in which runs the famous tale: young Umar ibn al-Khattab, fleeing after killing a Byzantine patrolman at Antioch, was sheltered by its monk, whose book foretold a man named Umar would rule most of the earth and drive Heraclius from Syria; he took Umar's written pledge on a strip of leather, and when the caliph later came to Jerusalem the old monk met him with it — Umar would not squander the Muslims' fay', but commuted the pledge into a gentle kharaj the monks' heirs still hold and governors still honour {cite:umari-masalik-1924 p. 342-343}."
