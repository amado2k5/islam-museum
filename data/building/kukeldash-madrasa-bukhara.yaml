summary:
  ar: "بطاقة أولية لمدرسة كوكلداش في بخارى، المدرسة التي بناها الأمير قلب بابا كوكلداش نحو سنة ١٥٦٩م؛ من أكبر مدارس آسيا الوسطى ولم تُراجع الصفحة بعد."
  en: "Draft card for the Kukeldash Madrasa in Bukhara, built by the amir Qul Baba Kukeldash about 1569; among the largest madrasas of Central Asia per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Madrasa de Kukeldash, Boukhara, bâtie par l’émir Qul Baba Kukeldash vers 1569 ; l’une des plus grandes madrasas d’Asie centrale selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la madrasa Kukeldash en Bujará, construida por el emir Qul Baba Kukeldash alrededor de 1569; una de las madrasas más grandes de Asia Central según la enciclopedia citada, página aún no verificada."
  ur: "بخارا میں کوکل داش مدرسہ کے لیے ڈرافٹ کارڈ، جسے امیر قل بابا کوکلداش نے تقریباً 1569 میں بنایا تھا۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق وسطی ایشیا کے سب سے بڑے مدارس میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Buhara'daki Kukaldaş Okulu için ön kart, Prens Qalba Baba Kukaldaş tarafından yaklaşık 1569 yılında inşa edilmiş; Orta Asya'nın en büyük okullarından biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Sekolah Kukaldash di Bukhara, sekolah yang dibangun oleh Pangeran Qalba Baba Kukaldash sekitar tahun 1569 M; salah satu sekolah terbesar di Asia Tengah, dan halaman ini belum ditinjau."
