summary:
  ar: "أول مسجد بُني لغرضه في الولايات المتحدة، أُتم في سيدار رابيدز بولاية آيوا سنة 1934، بناء مستطيل بسيط من ألواح خشبية بيضاء على أساس من الطوب الإسمنتي تعلو بابه قبة {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5}."
  en: "The first purpose-built mosque in the United States, completed at Cedar Rapids, Iowa, in 1934: a simple rectangular building of white clapboard on a cinder-block foundation with a dome over the front door {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5}."
  ur: "امریکہ میں مسجد کے طور پر بنائی گئی پہلی عمارت، جو 1934ء میں سیڈر ریپڈز، آیووا میں مکمل ہوئی: سفید لکڑی کے تختوں کی سادہ مستطیل عمارت، سیمنٹ بلاک کی بنیاد پر، صدر دروازے کے اوپر گنبد کے ساتھ {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5}۔"
