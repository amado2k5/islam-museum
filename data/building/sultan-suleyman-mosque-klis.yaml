label: { ar: "جامع السلطان سليمان في قلعة كليس", en: "Sultan Süleyman Mosque, Klis fortress", fr: "Mosquée Sultan Soliman, forteresse de Klis", ur: "سلطان سلیمان مسجد، قلعۂ کلیس", es: "Mezquita del Sultán Solimán, fortaleza de Klis", tr: "Kalis Kalesi'ndeki Sultan Süleyman Camii", id: "Masjid Sultan Suleiman di Kastil Kalis" }
summary:
  ar: "مسجد مربع بقبة واحدة في أعلى قلعة كليس قرب سبليت في كرواتيا، بني بعد الفتح العثماني سنة 1537، وصار كنيسة القديس فيتوس بعد خروج العثمانيين سنة 1648، وهو اليوم متحف {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 301}."
  en: "A square single-domed mosque at the top of Klis fortress near Split, Croatia, built after the Ottoman conquest of 1537, made the church of St Vitus after the Ottomans lost the fortress in 1648, and now a museum {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 301}."
  fr: "Mosquée carrée à coupole au sommet du fort près de Split en Croatie, après 1537 ; Saint-Guy après 1648, aujourd’hui musée. {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 301}"
  ur: "کروشیا میں سپلٹ کے قریب قلعۂ کلیس کی چوٹی پر ایک گنبد والی مربع مسجد، 1537ء کی عثمانی فتح کے بعد بنی، 1648ء میں قلعہ ہاتھ سے نکلنے کے بعد سینٹ وائٹس کا گرجا بنی، اب عجائب گھر {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 300}۔"
  es: "Una mezquita cuadrada de una sola cúpula en la cima de la fortaleza de Klis cerca de Split, Croacia, construida después de la conquista otomana de 1537, se convirtió en la iglesia de San Vito después de que los otomanos perdieran la fortaleza en 1648, y ahora es un museo {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 301}."
  tr: "Hırvatistan'da Split yakınlarındaki Klis Kalesi'nin tepesinde, 1537'de Osmanlı fethi sonrası inşa edilen tek kubbeli kare bir cami olup, 1648'de Osmanlıların çekilmesinden sonra Aziz Vitus Kilisesi olmuştur. Bugün bir müze {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 301} olarak hizmet vermektedir."
  id: "Sebuah masjid persegi dengan satu kubah di puncak Kastil Klis dekat Split di Kroasia, dibangun setelah penaklukan Ottoman pada tahun 1537, menjadi Gereja Santo Vitus setelah penarikan Ottoman pada tahun 1648. Saat ini, masjid tersebut menjadi museum {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 300} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 301}."
