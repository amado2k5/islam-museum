label:
  ar: دار الحكمة بالقاهرة
  en: The Dar al-Hikma of Cairo
summary:
  ar: "دار الحكمة بالقاهرة، أنشأها الخليفة الفاطمي الحاكم بأمر الله سنة 395هـ، وهي أشهر مدارس الحكمة الفاطمية التي نهض بها المذهب الإسماعيلي لنشر عقائده بين الأشياع — بدأت بمدارس الدعوة في المهدية في عهد عبيد الله المهدي ثم راجت في المنصورية في عهد المنصور ثم في القاهرة من عهد المعز، ولم تكن مقصورة على القاهرة بل جاوزت إلى أقاليم الدعوة الرئيسية وجزرها، وكانت متصلة بمكتبة دار العلم التي جمعت كثيراً من المؤلفات للاطلاع والنسخ، وأغلقها الوزير الأفضل ثم أعادها الخليفة الآمر."
  en: "The Dar al-Hikma of Cairo, founded by the Fatimid caliph al-Hakim bi-Amr Allah in 395 — the most famous of the Fatimid 'madaris al-hikma' through which the Ismaili da'wa spread its doctrines among its adherents. The institution began with the da'wa-schools al-Mahdi Ubayd Allah opened at Mahdiyya, flourished at Mansuriyya under al-Mansur, then at Cairo from al-Mu'izz's reign, reaching the chief 'islands' of the da'wa beyond Egypt. Attached to it was the Dar al-Ilm library holding many works for reading and copying; the vizier al-Afdal closed it and the caliph al-Amir reopened it."
