label:
  ar: دار الحكمة بالقاهرة
  en: The Dar al-Hikma of Cairo
summary:
  ar: "دار الحكمة بالقاهرة فتحها الخليفة الفاطمي الحاكم بأمر الله سنة 395هـ، وأُحضرت إليها الكتب من خزائن القصور، وجلس فيها الفقهاء والقراء والمنجمون والأطباء وأصحاب النحو واللغة. وكانت متصلة بدار العلم، فأغلقها الأفضل بن أمير الجيوش، ثم أُعيدت في موضع آخر سنة 517هـ في أيام الآمر. وهي من مدارس الحكمة الفاطمية التي نهض بها المذهب الإسماعيلي لنشر عقائده بين أتباعه."
  en: "The Dar al-Hikma of Cairo was opened by the Fatimid caliph al-Hakim bi-Amr Allah in 395 AH. Books were brought to it from the palace libraries, and jurists, readers, astrologers, physicians and grammarians sat in it. It was tied to the Dar al-Ilm; the vizier al-Afdal closed it, and it was reopened at another site in 517 AH under al-Amir. It was among the Fatimid centres of wisdom through which the Ismaili mission spread its teachings among its followers."
