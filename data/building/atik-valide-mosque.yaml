  es: "El külliye imperial Sinan construido para la validez del sultán Nurbanu sobre Üsküdar, comenzó en el año 978 de la Hégira y terminó en el año 991 (1583); su complejo más amplio en Estambul después del Süleymaniye."
  ur: "امپیریل کُلیے سنان درست سلطان نوربانو کے لیے Üsküdar کے اوپر بنایا گیا، 978ھ میں شروع ہوا اور 991 (1583) میں ختم ہوا۔ سلیمانی کے بعد اس کا سب سے وسیع استنبول کمپلیکس۔"
