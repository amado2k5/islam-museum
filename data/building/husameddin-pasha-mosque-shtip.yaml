label: { ar: "جامع حسام الدين باشا في شتيب", en: "Hüsameddin Pasha Mosque, Shtip", ur: "حسام الدین پاشا مسجد، شتیپ" }
summary:
  ar: "جامع مربع بقبة واحدة في شتيب بمقدونيا الشمالية، بانيه حسام الدين باشا فاتح المورة، يرجح أنه من القرن الخامس عشر، حُوّل كنيسة القديس إيليا سنة 1973، وأعيد إلى مفتية مقدونيا الشرقية سنة 2006 بعد قضاء طويل {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 370} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 371}."
  en: "A square single-domed mosque in Shtip, North Macedonia, founded by Hüsameddin Pasha, conqueror of the Morea, probably of the fifteenth century; used as the church of St Ilija from 1973 and returned to the Mufti's office of Eastern Macedonia in 2006 after long litigation {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 370} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 371}."
  ur: "شمالی مقدونیہ کے شہر شتیپ میں ایک گنبد والی مربع مسجد جس کے بانی فاتحِ موریا حسام الدین پاشا تھے، غالباً پندرھویں صدی کی؛ 1973ء سے سینٹ ایلیا گرجا رہی اور طویل مقدمے کے بعد 2006ء میں مشرقی مقدونیہ کی مفتی شپ کو واپس ملی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 371}۔"
