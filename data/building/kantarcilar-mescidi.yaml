summary:
  ar: "«مسجد صناع الموازين الصغير» من عهد الفاتح أسسه ساري دميرجي مولانا محمد محيي الدين؛ سمي بنقابة موثقة عند إوليا جلبي 1636م."
  en: "The 'Scale-Makers' mescit' of Fatih's reign, founded by Sarı Demirci Mevlana Mehmet Muhittin; named for the guild Evliya Çelebi records marching from here in 1636."
  fr: "La petite mosquée des fabricants de balances du règne de Fatih, fondée par Sarı Demirci Mevlana Mehmet Muhittin ; nommée d’après la corporation qu’Evliya Çelebi décrit défilant d’ici en 1636."
  es: "El mescit 'de los creadores de escalas' del reinado de Fatih, fundado por Sarı Demirci Mevlana Mehmet Muhittin; lleva el nombre del gremio que Evliya Çelebi registra marchando desde aquí en 1636."
  ur: "فاتح کے دور حکومت کا 'پیمانہ بنانے والے' میسکٹ، جس کی بنیاد Sarı Demirci Mevlana Mehmet Muhittin نے رکھی تھی۔ 1636 میں یہاں سے مارچ کرنے والے گلڈ Evliya Çelebi کے ریکارڈ کے لیے نامزد کیا گیا۔"
  tr: "Fatih döneminden kalma 'Pulların Küçük Camii', Sari Demirci, Mawlana Muhammad Muhyiddin tarafından kurulmuştur; adını 1636 yılında Ulya Çelebi tarafından belgelenen bir örgütten almıştır."
  id: "'Masjid Kecil Para Pembuat' Sisik' dari era penakluk didirikan oleh Sari Demirci, Mawlana Muhammad Muhyiddin; masjid ini dinamai menurut sebuah sindikat yang didokumentasikan oleh Ulya Çelebi pada tahun 1636 M."
