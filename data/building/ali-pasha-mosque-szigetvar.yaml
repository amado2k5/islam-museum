summary:
  ar: "جامع في ساحة زريني بسگتوار أسسه مؤذن زاده علي باشا، عليه نقش مؤرخ 997هـ/1589–1590، بقبة قطرها 13 متراً، جُعل كنيسة سنة 1712 وهو اليوم كنيسة القديس روخ {cite:yilmaz-ottoman-architecture-hungary-2024 p. 141}."
  en: "A mosque on Zrínyi Square in Szigetvár founded by Müezzinzade Ali Pasha, with an inscription of AH 997/1589-90 and a dome 13 metres across; made a church in 1712, it is now St Roch's Church {cite:yilmaz-ottoman-architecture-hungary-2024 p. 141}."
  fr: "Mosquée place Zrínyi à Szigetvár, fondée par Müezzinzade Ali Pacha, avec une inscription de 997 H/1589-1590 et une coupole de 13 mètres de diamètre ; devenue église en 1712, c’est aujourd’hui l’église Saint-Roch {cite:yilmaz-ottoman-architecture-hungary-2024 p. 141}."
  ur: "سگتوار کے زرینی چوک پر مؤذن زادہ علی پاشا کی بنیاد رکھی مسجد، 997ھ/1589–90ء کا کتبہ، 13 میٹر قطر کا گنبد؛ 1712ء میں گرجا بنی، اب سینٹ روخ گرجا {cite:yilmaz-ottoman-architecture-hungary-2024 p. 141}۔"
  es: "Una mezquita en la plaza Zrínyi en Szigetvár fundada por Müezzinzade Ali Pasha, con una inscripción de AH 997/1589-90 y una cúpula de 13 metros de diámetro; convertida en iglesia en 1712, ahora es la iglesia de San Roque {cite:yilmaz-ottoman-architecture-hungary-2024 p. 141}."
