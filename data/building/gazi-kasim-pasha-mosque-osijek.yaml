summary:
  ar: "جامع بناه أمين بناء قلعة أوسييك غازي قاسم باشا سنة 966هـ/1558–1559 في الحصن الأوسط، حوّله اليسوعيون إلى كنيسة بعد 1687، وهُدم سنة 1734 لتبنى مكانه كنيسة القديس ميخائيل الباروكية {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 312} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 313}."
