summary:
  ar: "بطاقة أولية لمسجد تاريخانه في دامغان، المبنى المقبب ذو الأعمدة الساسانية الذي حُوّل إلى جامع في القرن التاسع؛ من أقدم جوامع إيران الباقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Tarikhaneh of Damghan, the Sasanian-columned building converted into a mosque in the ninth century; among Iran's oldest surviving mosques per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Tarikhaneh, Damghan, édifice aux colonnes sassanides transformé en mosquée au IXe siècle ; l’une des plus anciennes mosquées subsistantes de l’Iran selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Ficha de borrador para la Tarikhaneh de Damghan, el edificio con columnas sasánidas convertido en mezquita en el siglo IX; una de las mezquitas más antiguas que se conservan en Irán según la enciclopedia citada, página aún no verificada."
  ur: "دمغان کے تاریخانہ کے لیے ڈرافٹ کارڈ، ساسانی کالم والی عمارت جو نویں صدی میں مسجد میں تبدیل ہو گئی تھی۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق ایران کی قدیم ترین زندہ بچ جانے والی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Damghan'daki Tarikhaneh Camii için ön kart, dokuzuncu yüzyılda camiye dönüştürülen Sasani sütunlu kubbeli bina ve İran'daki ayakta kalan en eski camilerden biri olup sayfası henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Tarikhaneh di Damghan, bangunan berkubah dengan kolom Sasanian yang diubah menjadi masjid pada abad kesembilan; salah satu masjid tertua yang masih ada di Iran dan halamannya belum ditinjau."
