summary:
  ar: "مرصد أمر هولاكو ببنائه على تل محصّن غربي مدينة مراغة بأذربيجان بعد أخذ بغداد، وفق تصميم نصير الدين الطوسي الذي كان أول مديريه. أُسس سنة 657هـ/1259م، وهو بحسب دائرة المعارف الإسلامية أول مرصد إسلامي كبير يُعرف تنظيمه وبناؤه بالتفصيل، فضمّ مسكناً لهولاكو ومسجداً ومكتبة غنية وآلات ضخمة، وموّلته الأوقاف. أنتج الزيج الإلخاني وبقي عمله زهاء خمس وخمسين أو ستين سنة، وكان خراباً سنة 740هـ/1339م {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  en: "The observatory Hulagu ordered built on a fortified hill west of the town of Maragha in Azerbaijan after the fall of Baghdad, to the plans of Nasir al-Din al-Tusi, who became its first director. Founded in 657/1259, it is, in the Encyclopaedia of Islam's account, the first large-scale Islamic observatory whose organisation and structure are known in detail: it had a residence for Hulagu, a mosque, a rich library and large instruments, and was paid for by pious endowments. It gave rise to the Zij-i Ilkhani, worked for some 55 or 60 years, and lay in ruins by 740/1339 {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  fr: "Observatoire ordonné par Hulagu après la chute de Bagdad sur une colline fortifiée à l’ouest de Maragha en Azerbaïdjan, selon les plans de Nasir al-Din al-Tusi, premier directeur. Fondé en 657/1259, premier grand observatoire islamique d’organisation et structure bien connues selon l’Encyclopédie de l’Islam, il comprenait résidence de Hulagu, mosquée, riche bibliothèque et grands instruments, financés par des fondations pieuses. Il donna naissance au Zij-i Ilkhani, fonctionna quelque 55 ou 60 ans et était ruiné en 740/1339 {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}"
  ur: "یہ رصدگاہ ہلاکو نے بغداد کے سقوط کے بعد آذربائیجان کے شہر مراغہ کے مغرب میں ایک مضبوط ٹیلے پر نصیر الدین طوسی کے نقشے کے مطابق بنوائی، جو اس کے پہلے ناظم بنے۔ یہ 657ھ/1259ء میں قائم ہوئی اور دائرۃ المعارف الاسلامیہ کے بیان میں پہلی بڑی اسلامی رصدگاہ ہے جس کی تنظیم اور ساخت تفصیل سے معلوم ہے: اس میں ہلاکو کی رہائش، مسجد، بھرپور کتب خانہ اور بڑے آلات تھے، اور اخراجات اوقاف سے پورے ہوتے تھے۔ اس سے زیجِ ایلخانی نکلی، یہ تقریباً پچپن یا ساٹھ سال کام کرتی رہی، اور 740ھ/1339ء میں کھنڈر تھی {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  es: "Tras la caída de Bagdad, Hulagu mandó construir el observatorio en una colina fortificada al oeste de la ciudad de Maragha, en Azerbaiyán, según los planos de Nasir al-Din al-Tusi, quien se convirtió en su primer director. Fundado en 657/1259, según la Enciclopedia del Islam, fue el primer observatorio islámico de gran envergadura cuya organización y estructura se conocen con detalle: contaba con una residencia para Hulagu, una mezquita, una rica biblioteca y grandes instrumentos, y se financiaba con donaciones piadosas. Dio origen al Zij-i Ilkhani, funcionó durante unos 55 o 60 años y quedó en ruinas en 740/1339 {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  tr: "Bağdat'ın ele geçirilmesinden sonra Azerbaycan'da Maragha'nın batısındaki tahkim edilmiş bir tepede, ilk yöneticisi Nasir al-Din al-Tusi'nin tasarımına göre Hulagu tarafından inşa edilmesi için bir gözlemevi. 657 Hicri / 1259 yılında kurulmuş olup, İslam Ansiklopedisi'ne göre, organizasyonu ve inşasıyla ayrıntılı olarak bilinen ilk büyük İslami gözlemevidir. Hulagu'nun ikametgahı, bir camii, zengin bir kütüphane ve vakıflarla finanse edilen devasa makineler içeriyordu. İhkhani Zij üretildi ve yaklaşık elli beş ya da altmış yıl boyunca yürürlükte kaldı ve 740 Hicri / 1339 M.S. yıllarında harap oldu {cite:Encyclopaedia-of-Islam-2 cilt 6 s. 628}."
  id: "Sebuah observatorium yang diperintahkan oleh Hulagu untuk dibangun di atas bukit benteng di barat Maragha di Azerbaijan setelah penaklukan Baghdad, sesuai desain Nasir al-Din al-Tusi, yang merupakan direktur pertamanya. Observatorium ini didirikan pada tahun 657 H / 1259 M, dan menurut Ensiklopedia Islam, ini adalah observatorium Islam besar pertama yang dikenal secara rinci karena organisasi dan pembangunannya. Observatorium ini mencakup kediaman Hulagu, masjid, perpustakaan kaya, dan mesin besar yang didanai oleh dana abadi. Ikhkhani Zij diproduksi dan tetap berlaku selama sekitar lima puluh lima atau enam puluh tahun, dan hancur pada tahun 740 H / 1339 M {cite:Encyclopaedia-of-Islam-2 vol. 6 hlm. 628}."
