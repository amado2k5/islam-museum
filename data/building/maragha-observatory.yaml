label: { ar: "مرصد مراغة", en: "Maragha Observatory", ur: "مراغہ رصدگاہ" }
summary:
  ar: "مرصد أمر هولاكو ببنائه على تل محصّن غربي مدينة مراغة بأذربيجان بعد أخذ بغداد، وفق تصميم نصير الدين الطوسي الذي كان أول مديريه. أُسس سنة 657هـ/1259م، وهو بحسب دائرة المعارف الإسلامية أول مرصد إسلامي كبير يُعرف تنظيمه وبناؤه بالتفصيل، فضمّ مسكناً لهولاكو ومسجداً ومكتبة غنية وآلات ضخمة، وموّلته الأوقاف. أنتج الزيج الإلخاني وبقي عمله زهاء خمس وخمسين أو ستين سنة، وكان خراباً سنة 740هـ/1339م {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  en: "The observatory Hulagu ordered built on a fortified hill west of the town of Maragha in Azerbaijan after the fall of Baghdad, to the plans of Nasir al-Din al-Tusi, who became its first director. Founded in 657/1259, it is, in the Encyclopaedia of Islam's account, the first large-scale Islamic observatory whose organisation and structure are known in detail: it had a residence for Hulagu, a mosque, a rich library and large instruments, and was paid for by pious endowments. It gave rise to the Zij-i Ilkhani, worked for some 55 or 60 years, and lay in ruins by 740/1339 {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
  ur: "یہ رصدگاہ ہلاکو نے بغداد کے سقوط کے بعد آذربائیجان کے شہر مراغہ کے مغرب میں ایک مضبوط ٹیلے پر نصیر الدین طوسی کے نقشے کے مطابق بنوائی، جو اس کے پہلے ناظم بنے۔ یہ 657ھ/1259ء میں قائم ہوئی اور دائرۃ المعارف الاسلامیہ کے بیان میں پہلی بڑی اسلامی رصدگاہ ہے جس کی تنظیم اور ساخت تفصیل سے معلوم ہے: اس میں ہلاکو کی رہائش، مسجد، بھرپور کتب خانہ اور بڑے آلات تھے، اور اخراجات اوقاف سے پورے ہوتے تھے۔ اس سے زیجِ ایلخانی نکلی، یہ تقریباً پچپن یا ساٹھ سال کام کرتی رہی، اور 740ھ/1339ء میں کھنڈر تھی {cite:encyclopaedia-of-islam-2 vol. 6 p. 628}."
