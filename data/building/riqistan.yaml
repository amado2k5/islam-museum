  ar: ساحة سمرقند المحاطة بثلاث مدارس تيمورية ⁦(الخامس عشر–السابع عشر)⁩ — أشهر مجموعة مدارس مغطاة بالفسيفساء في آسيا الوسطى.
  en: Samarkand's square ringed by three Timurid madrasas (15th–17th c.) — Central Asia's most famous tile-covered scholastic
    ensemble.
  fr: "Place aux trois madrasas timourides des XVe–XVIIe siècles, plus célèbre ensemble d’enseignement couvert de carreaux d’Asie centrale."
  es: "La plaza de Samarcanda rodeada por tres madrasas timúridas (siglos XV-XVII) — el conjunto académico revestido de azulejos más famoso de Asia Central."
  ur: "سمرقند کا مربع تین تیموری مدارس (15th-17th c.) سے گھیرے ہوئے ہے - وسطی ایشیا کا سب سے مشہور ٹائلوں سے ڈھکا تعلیمی جوڑا۔"
  tr: "Semerkand Meydanı, üç Timuri okulu (on beşinci–on yedinci) ile çevrili olup, Orta Asya'daki en ünlü mozaik kaplı okullar grubudur."
  id: "Alun-alun Samarkand, yang dikelilingi oleh tiga sekolah Timurid (kelima belas–ketujuh belas), adalah kelompok sekolah yang tertutup mozaik paling terkenal di Asia Tengah."
