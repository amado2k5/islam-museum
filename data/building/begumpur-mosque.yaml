id: building/begumpur-mosque
class: building
kind: mosque
label: { ar: "مسجد بيگم پور، دلهي", en: "Begumpur Mosque, Delhi", ur: "بیگم پور مسجد، دہلی" }
summary:
  ar: "جامع كبير من طابق واحد على قاعدة عالية في قرية بيگم پور جنوب دلهي، بلا نقش، ينسب إلى عهد فيروز شاه تغلق أو إلى محمد بن تغلق، ويعده ر. ناث أول مسجد هندي ذي إيوان كامل {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  en: "A large single-storey congregational mosque on a high plinth in Begumpur village in south Delhi, without an inscription, attributed to Firuz Shah Tughluq's reign or to Muhammad ibn Tughluq, and held by R. Nath to be the first Indian mosque with a fully formed iwan {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  ur: "جنوبی دہلی کے گاؤں بیگم پور میں اونچی کرسی پر ایک منزلہ بڑی جامع مسجد، بغیر کتبے کے، جو فیروز شاہ تغلق کے عہد یا محمد بن تغلق سے منسوب ہے، اور آر۔ ناتھ اسے پہلی ہندوستانی مسجد مانتے ہیں جس میں مکمل ایوان ہے {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}۔"
