label: { ar: "مسجد بيگم پور، دلهي", en: "Begumpur Mosque, Delhi", fr: "Mosquée de Begumpur, Delhi", ur: "بیگم پور مسجد، دہلی", es: "Mezquita de Begumpur, Delhi", tr: "Begumpur Camii, Delhi", id: "Masjid Begumpur, Delhi" }
summary:
  ar: "جامع كبير من طابق واحد على قاعدة عالية في قرية بيگم پور جنوب دلهي، بلا نقش، ينسب إلى عهد فيروز شاه تغلق أو إلى محمد بن تغلق، ويعده ر. ناث أول مسجد هندي ذي إيوان كامل {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  en: "A large single-storey congregational mosque on a high plinth in Begumpur village in south Delhi, without an inscription, attributed to Firuz Shah Tughluq's reign or to Muhammad ibn Tughluq, and held by R. Nath to be the first Indian mosque with a fully formed iwan {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  fr: "Grande mosquée de plain-pied sur un haut soubassement dans le village de Begumpur au sud de Delhi, sans inscription, attribuée au règne de Firuz Shah Tughluq ou à Muhammad ibn Tughluq, et considérée par R. Nath comme la première mosquée indienne dotée d’un iwan pleinement développé {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  ur: "جنوبی دہلی کے گاؤں بیگم پور میں اونچی کرسی پر ایک منزلہ بڑی جامع مسجد، بغیر کتبے کے، جو فیروز شاہ تغلق کے عہد یا محمد بن تغلق سے منسوب ہے، اور آر۔ ناتھ اسے پہلی ہندوستانی مسجد مانتے ہیں جس میں مکمل ایوان ہے {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}۔"
  es: "Una gran mezquita congregacional de una sola planta sobre un alto pedestal en la aldea de Begumpur, en el sur de Delhi, sin inscripción, atribuida al reinado de Firuz Shah Tughluq o a Muhammad ibn Tughluq, y considerada por R. Nath como la primera mezquita india con un iwan completamente formado {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 89}."
  tr: "Güney Delhi'deki Begumpur köyünde, yazıtsız, yüksek bir kaide üzerinde büyük tek katlı bir cami, Firuz Şah Taghlaq veya Muhammed bin Tughlaq dönemine atfedilir ve R. Nath tarafından tam bir ivana sahip ilk Hint camisi olarak kabul edilir {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 s. 89}."
  id: "Sebuah masjid besar satu lantai di atas alas tinggi di desa Begumpur, Delhi selatan, tanpa prasasti, yang dikaitkan dengan masa pemerintahan Firuz Shah Taghlaq atau Muhammad bin Tughlaq, dan dianggap oleh R. Nath sebagai masjid India pertama dengan iwan lengkap {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 85} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 88} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 89}."
