label: { ar: "جامع المنصورة ومئذنته ⁦(تلمسان)⁩", en: "Mosque and minaret of al-Mansura, Tlemcen", fr: "Mosquée et minaret d’al-Mansura, Tlemcen", ur: "منصورہ کی مسجد اور مینار ⁦(تلمسان)⁩", es: "Mezquita y minarete de al-Mansura, Tlemcen" }
summary:
  ar: "أطلال جامع في المنصورة غربي تلمسان، تقوم مئذنته الحجرية على محور البناء وكانت مدخله الرئيس، ارتفاعها 125 قدماً، ونقش يذكر أنها بنيت بأمر أبي يعقوب يوسف {cite:newcomb-decorative-tiles-north-africa-1929 p.28} {cite:newcomb-decorative-tiles-north-africa-1929 p.30}."
  en: "The ruined mosque of al-Mansura west of Tlemcen, whose hewn-stone minaret, 125 feet high, stands on the building's axis and served as its main entrance; an inscription records that it was built by order of Abu Ya'qub Yusuf {cite:newcomb-decorative-tiles-north-africa-1929 p.28} {cite:newcomb-decorative-tiles-north-africa-1929 p.30}."
  fr: "Mosquée ruinée à l’ouest de Tlemcen ; son minaret de pierre de taille de 125 pieds, dans l’axe, servait d’entrée principale. Une inscription attribue sa construction à l’ordre d’Abu Ya’qub Yusuf {cite:newcomb-decorative-tiles-north-africa-1929 p.28} {cite:newcomb-decorative-tiles-north-africa-1929 p.30}"
  es: "La mezquita en ruinas de al-Mansura, al oeste de Tlemcen, cuyo minarete de piedra labrada, de 125 pies de altura, se alza sobre el eje del edificio y servía como su entrada principal; una inscripción registra que fue construida por orden de Abu Ya'qub Yusuf {cite:newcomb-decorative-tiles-north-africa-1929 p.28} {cite:newcomb-decorative-tiles-north-africa-1929 p.30}."
  ur: "تلمسن کے مغرب میں المنصورہ کی تباہ شدہ مسجد، جس کے تراشے ہوئے پتھر کا مینار، 125 فٹ اونچا ہے، عمارت کے محور پر کھڑا ہے اور اس کے مرکزی دروازے کے طور پر کام کرتا ہے۔ ایک نوشتہ میں درج ہے کہ اسے ابو یعقوب یوسف کے حکم سے تعمیر کیا گیا تھا {حوالہ: نیوکومب-ڈیکوریٹو-ٹائل-شمالی-افریقہ-1929 صفحہ 28}"
