  ar: "أسسته سلجوق خاتون ابنة محمد الأول وعمة الفاتح توفيت 1485م؛ أعاد بناءها الوزير عباس آغا بعد حريق ثم هُدمت وأُعيدت 1956م عند توسيع شارع ملت."
  en: "Founded by Selçuk Hatun, daughter of Mehmet I and aunt of the Conqueror, who died 1485; rebuilt by chief eunuch Abbas Ağa after a fire, demolished and re-erected nearby when Millet Caddesi was widened in 1956."
  fr: "Fondation de la fille de Mehmet Ier, tante du Conquérant morte en 1485 ; rebâtie par Abbas Ağa après incendie, démolie et déplacée lors de l’élargissement de Millet Caddesi en 1956."
  es: "Fundada por Selçuk Hatun, hija de Mehmet I y tía del Conquistador, que murió en 1485; reconstruida por el eunuco principal Abbas Ağa después de un incendio, demolida y reconstruida en las cercanías cuando se amplió la calle Millet Caddesi en 1956."
  ur: "مہمت اول کی بیٹی اور فاتح کی خالہ، جو 1485 میں مر گئی، سیلوک ہاتون نے قائم کیا۔ چیف خواجہ سرا عباس آغا نے آگ لگنے کے بعد دوبارہ تعمیر کیا، جسے 1956 میں ملٹ کڈسی کو چوڑا کرنے کے بعد قریب ہی منہدم اور دوبارہ تعمیر کیا گیا۔"
