class: building
kind: mosque
label:
  ar: جامع السليمانية
  en: Süleymaniye Mosque
summary:
  ar: "جامع السليمانية في إسطنبول مجمع أمر به السلطان سليمان القانوني وبناه سنان على تل يشرف على الميناء، وبدئ به سنة 957هـ/1550م وانتهى سنة 964هـ/1557م. يضم الجامع وضريحين وأربع مدارس ودار حديث ومستشفى ومكتبة وصيدلية ومكتبًا للأطفال وغيرها، ويعده مقال سنان في دائرة المعارف الإسلامية أطمح مجمع عثماني منفرد، وهو ما زال يهيمن على أفق المدينة."
  en: "The Süleymaniye Mosque in Istanbul is a complex commissioned by Sultan Süleyman the Magnificent and built by Sinan on a hill overlooking the harbour, begun in 957/1550 and completed in 964/1557. It includes the mosque, two tombs, four madrasas, a dar al-hadith, a hospital, a library, a pharmacy and a children's school, and the Encyclopaedia of Islam article on Sinan calls it the most ambitious single Ottoman complex, still dominating the city's skyline."
  ur: "استنبول کی جامع سلیمانیہ سلطان سلیمان القانونی کے حکم پر سنان کا بنایا ہوا مجموعہ ہے جو بندرگاہ کو دیکھتی پہاڑی پر 957ھ/1550ء میں شروع ہو کر 964ھ/1557ء میں مکمل ہوا۔ اس میں مسجد، دو مقبرے، چار مدارس، دارالحدیث، ہسپتال، کتب خانہ، دوا خانہ اور بچوں کا مکتب شامل ہیں، اور دائرۃ المعارف اسلامیہ میں سنان کا مضمون اسے سب سے پرعزم واحد عثمانی مجموعہ کہتا ہے جو آج بھی شہر کے افق پر چھایا ہوا ہے۔"
