summary:
  ar: "جامع رستم باشا بإسطنبول، من أجمل جوامع الوزراء لسنان، يقوم وسط ربع السوق القديم فوق جسر غلطة؛ يسجل وقفه بناءه سنة 968هـ/1561م وهي سنة وفاة رستم باشا {cite:freely-ottoman-architecture-2011}."
  en: "The Rustem Pasha Mosque of Istanbul, one of the most beautiful of Sinan's vezirial mosques, standing in the ancient market quarter above the Galata Bridge; its foundation charter records its building in 968 AH/1561 CE, the year Rustem Pasha died {cite:freely-ottoman-architecture-2011}."
  fr: "L’une des plus belles mosquées vizirales de Sinan, au vieux marché d’Istanbul au-dessus du pont de Galata ; l’acte date la construction de 968 H/1561, année de mort du fondateur. {cite:freely-ottoman-architecture-2011}"
  es: "La mezquita Rustem Pasha de Estambul, una de las mezquitas vesiriales más bellas de Sinan, se alza en el antiguo barrio del mercado sobre el puente de Galata; su acta fundacional registra su construcción en el año 968 AH/1561 CE, año en que murió Rustem Pasha {cite:freely-ottoman-architecture-2011}."
  ur: "استنبول کی رستم پاشا مسجد، سنان کی سب سے خوبصورت مساجد میں سے ایک، گالاتا پل کے اوپر قدیم بازار کے کوارٹر میں کھڑی ہے۔ اس کے فاؤنڈیشن چارٹر میں اس کی عمارت 968 ہجری / 1561 عیسوی میں درج ہے، جس سال رستم پاشا کی وفات ہوئی تھی۔"
  tr: "İstanbul'daki Rüstem Paşa Camii, Sinan bakanlarının en güzel camilerinden biridir. Galata Köprüsü'nün üzerindeki eski pazar mahallesinin ortasında yer almaktadır; vakıfının 968 Hicri / 1561 yılında inşa edildiği kaydedilmiştir; bu yıl Rüstem Paşa'nın ölüm yılı {atıf:özgürlük-osmanlı-mimarisi-2011} olarak kaydedilmiştir."
  id: "Masjid Rustam Pasha di Istanbul adalah salah satu masjid terindah milik para menteri Sinan. Masjid ini berdiri di tengah kawasan pasar tua di atas Jembatan Galata; wakafnya tercatat dibangun pada tahun 968 H / 1561 M, yang merupakan tahun kematian Rustam Pasha {cite:freely-ottoman-architecture-2011}."
