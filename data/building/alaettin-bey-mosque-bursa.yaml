summary:
  ar: "أقدم مسجد مؤرخ في بورصة، بُني سنة 1335م لعلاء الدين بك أخي أورهان وأول وزير عثماني؛ مربع مسقوف بقبة ومنارة يعدّها كوران أقدم منارة عثمانية."
  en: "Bursa's oldest dated mosque (1335), honouring Orhan's brother and first vezir Alaettin Bey; a single-unit domed square whose minaret Kuran reckons the earliest in Ottoman architecture."
  fr: "La plus ancienne mosquée datée de Bursa (1335), en l’honneur d’Alaettin Bey, frère d’Orhan et premier vizir ; un carré à coupole à unité unique dont Kuran considère le minaret comme le plus ancien de l’architecture ottomane."
  es: "La mezquita más antigua de Bursa (1335), en honor al hermano de Orhan y primer vezir, Alaettin Bey; una plaza con cúpula de una sola unidad cuyo minarete Kuran considera el más antiguo de la arquitectura otomana."
  ur: "برسا کی قدیم ترین مسجد (1335)، اورحان کے بھائی اور پہلے وزیر علطین بی کا اعزاز ایک واحد گنبد والا مربع جس کے مینار کوران کو عثمانی فن تعمیر میں قدیم ترین مانا جاتا ہے۔"
  tr: "Bursa'nın en eski tarihi cami, 1335 yılında Orhan'ın kardeşi ve ilk Osmanlı veziri Aladdin Bey tarafından inşa edilmiştir; kubbeli ve minareli kapalı bir meydandır ve Kuran tarafından en eski Osmanlı minaresi olarak kabul edilir."
  id: "Masjid bersejarah tertua di Bursa, dibangun pada tahun 1335 M oleh Aladdin Bey, saudara Orhan dan wazir Ottoman pertama; sebuah alun-alun tertutup dengan kubah dan menara, yang dianggap Kuran sebagai menara Ottoman tertua."
