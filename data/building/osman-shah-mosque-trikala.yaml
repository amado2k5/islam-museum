  ur: "تریکلا کی عثمان شاہ مسجد کے لیے ڈرافٹ کارڈ، سولہویں صدی کے وسط کی عثمانی مسجد جو ابتدائی سلجوک-عثمانی محاورے سے منسوب ہے۔ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "Yunanistan'ın Trikala kentindeki Osman Şah Camii'nin ön kartı; 16. yüzyıl ortalarında inşa edilen ve erken Selçuklu-Osmanlı tarzına atfedilen Osmanlı camidi; sayfa henüz incelenmemiştir."
  id: "Kartu awal Masjid Osman Shah di Trikala, Yunani, masjid Ottoman yang dibangun pada pertengahan abad ke-16 dan dikaitkan dengan gaya Seljuk-Ottoman awal; halamannya belum ditinjau."
