summary:
  ar: "أكبر بساتين بحيرة دال في كشمير وأشدها انحداراً، يُنسب إلى آصف خان أخي نورجهان نحو 1625م، وكان في الأصل اثنتي عشرة مصطبة {cite:brookes-gardens-of-paradise-1987 p.143} {cite:brookes-gardens-of-paradise-1987 p.145}."
  en: "The largest and steepest of the Lake Dal gardens in Kashmir, attributed to Asaf Khan, Nur Jahan's brother, c. 1625, originally laid out in twelve terraces {cite:brookes-gardens-of-paradise-1987 p.143} {cite:brookes-gardens-of-paradise-1987 p.145}."
  fr: "Plus grand et plus escarpé jardin du lac Dal au Cachemire, attribué à Asaf Khan, frère de Nur Jahan, vers 1625 ; douze terrasses à l’origine {cite:brookes-gardens-of-paradise-1987 p.143} {cite:brookes-gardens-of-paradise-1987 p.145}"
  es: "El más grande y empinado de los jardines del lago Dal en Cachemira, atribuido a Asaf Khan, hermano de Nur Jahan, c. 1625, originalmente diseñado en doce terrazas {cite:brookes-gardens-of-paradise-1987 p.143} {cite:brookes-gardens-of-paradise-1987 p.145}."
  ur: "کشمیر میں جھیل ڈل باغات کا سب سے بڑا اور سب سے بڑا باغ، نور جہاں کے بھائی آصف خان سے منسوب ہے۔ 1625، اصل میں بارہ چھتوں میں بچھایا گیا تھا {حوالہ: بروکس-گارڈنز-آف-پیراڈائز-1987 صفحہ 143}"
  tr: "Keşmir'deki Dal Gölü'nün en büyük ve en dik meyve bahçeleri, yaklaşık 1625 yılında Nur Jahan'ın kardeşi Asaf Khan'a atfedilir. Başlangıçta on iki platform vardı {cite:brookes-gardens-of-paradise-1987 s.143} {cite:brookes-gardens-of-paradise-1987 s.145}."
  id: "Kebun buah terbesar dan tercuram di Danau Dal di Kashmir dikaitkan dengan Asaf Khan, saudara Nur Jahan, sekitar tahun 1625 M. Awalnya, terdapat dua belas platform {cite:brookes-gardens-of-paradise-1987 hlm.143} {cite:brookes-gardens-of-paradise-1987 hlm.145}."
