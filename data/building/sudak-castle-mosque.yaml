summary:
  ar: "مسجد من القرن الثالث عشر في قلعة سوداق الجنوية على ساحل القرم، يُنسب إلى حسام الدين چوبان بك صاحب قسطموني أو إلى السلطان السلجوقي عز الدين كيكاوس الثاني، تعاقب عليه الاستعمال كنيسةً ومسجداً، وهو اليوم متحف {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}."
  en: "A thirteenth-century mosque in the Genoese castle of Sudak on the Crimean coast, ascribed either to Hüsameddin Çoban Bey of Kastamonu or to the Seljuk sultan Izz al-Din Kaykawus II, used in turn as church and mosque, and now a museum {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}."
  ur: "کریمیا کے ساحل پر جنیوائی قلعۂ سوداق میں تیرھویں صدی کی مسجد، جو قسطمونی کے حسام الدین چوبان بے یا سلجوقی سلطان عز الدین کیکاؤس دوم سے منسوب ہے؛ باری باری گرجا اور مسجد رہی، اب عجائب گھر {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840}۔"
