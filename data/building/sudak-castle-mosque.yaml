kind: mosque
label: { ar: "جامع قلعة سوداق في القرم", en: "Sudak Castle Mosque, Crimea", fr: "Mosquée du château de Sudak, Crimée", ur: "قلعۂ سوداق کی مسجد، کریمیا", es: "Mezquita del Castillo de Sudak, Crimea", tr: "Kırım'daki Qalaat Sawdaq Camii", id: "Masjid Qalaat Sawdaq di Krimea" }
summary:
  ar: "مسجد من القرن الثالث عشر في قلعة سوداق الجنوية على ساحل القرم، يُنسب إلى حسام الدين چوبان بك صاحب قسطموني أو إلى السلطان السلجوقي عز الدين كيكاوس الثاني، تعاقب عليه الاستعمال كنيسةً ومسجداً، وهو اليوم متحف {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}."
  en: "A thirteenth-century mosque in the Genoese castle of Sudak on the Crimean coast, ascribed either to Hüsameddin Çoban Bey of Kastamonu or to the Seljuk sultan Izz al-Din Kaykawus II, used in turn as church and mosque, and now a museum {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}."
  fr: "Mosquée du XIIIe siècle du château génois, attribuée à Hüsameddin Çoban Bey ou Izz al-Din Kaykawus II, alternativement église et mosquée, aujourd’hui musée. {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}"
  ur: "کریمیا کے ساحل پر جنیوائی قلعۂ سوداق میں تیرھویں صدی کی مسجد، جو قسطمونی کے حسام الدین چوبان بے یا سلجوقی سلطان عز الدین کیکاؤس دوم سے منسوب ہے؛ باری باری گرجا اور مسجد رہی، اب عجائب گھر {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840}۔"
  es: "Mezquita del siglo XIII en el castillo genovés de Sudak en la costa de Crimea, atribuida a Hüsameddin Çoban Bey de Kastamonu o al sultán selyúcida Izz al-Din Kaykawus II, utilizada a su vez como iglesia y mezquita, y ahora museo {cita:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 840} {cita:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 841}."
  tr: "Kırım kıyısındaki Ceneviz kalesi Sudaq'ta bulunan 13. yüzyıla ait bir camidir; Kastamuni hükümdarı Hüsameddin Guban Beg'e veya Selçuklu Sultanı İzzeddin Keykaus II'ye atfedilir. Sırasıyla kilise ve cami olarak kullanılmıştır ve bugün bir müze olarak kullanılmaktadır {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023, s. 841}."
  id: "Sebuah masjid abad ke-13 di benteng Genoa Sudaq di pesisir Krimea, yang dikaitkan dengan Hussam al-Din Guban Beg, penguasa Qastamuni, atau Sultan Seljuk Izz al-Din Keykaus II. Masjid ini digunakan secara berturut-turut sebagai gereja dan masjid, dan saat ini menjadi museum {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023, hlm. 841}."
