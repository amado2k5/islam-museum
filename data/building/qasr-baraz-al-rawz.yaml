label: { ar: "قصر براز الروز", en: "Baraz al-Rawz palace" }
summary:
  ar: "في سنة سبع وثمانين ومائتين دخل المعتضد من متنزهه ببراز الروز وأمر بإنشاء قصر في موضع اختاره من براز الروز فحُملت إليه الآلات وابتُدئ بعمله، ثم أخرج من كان له دار وحانوت بباب الشماسية عن داره وحانوته وقيل لهم خذوا أنقاضكم واخرجوا، وخطّ موضع السور وابتدأ في بناء دكة على دجلة لينتقل فيقيم بها إلى أن يفرغ من بناء الدار والقصر، فمرض المعتضد باتفاق فمات قبل إتمامه {cite:muntazam-ibn-al-jawzi p. 316, 322-323}."
  en: "In 287 al-Mu'tadid ordered a palace at his chosen spot in Baraz al-Rawz; the householders of Bab al-Shammasiyya were bought out to clear the site, the wall traced, and a river-dais begun for him to occupy until the palace finished — but his illness struck and he died before its completion {cite:muntazam-ibn-al-jawzi p. 316, 322-323}."
