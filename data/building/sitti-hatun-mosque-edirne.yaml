summary:
  ar: "مسجد أُقيم سنة 1482م لستي خاتون الأميرة التركمانية زوجة محمد الفاتح التي بقيت في أدرنة ودُفنت خلف مسجدها سنة 1485م."
  en: "A single-unit mosque erected 1482 for Sitti Hatun, the Turcoman princess married to the future Mehmet II, who stayed behind in Edirne and was buried behind her mosque in 1485."
  fr: "Mosquée à unité unique bâtie en 1482 pour la princesse turcomane épouse du futur Mehmet II, restée à Edirne et enterrée derrière sa mosquée en 1485."
  es: "Una mezquita de una sola unidad erigida en 1482 para Sitti Hatun, la princesa turcomana casada con el futuro Mehmet II, quien permaneció en Edirne y fue enterrada detrás de su mezquita en 1485."
  ur: "ایک اکائی والی مسجد 1482 میں سیتی ہاتون کے لیے بنائی گئی تھی، ترکمان کی شہزادی نے مستقبل کے مہمت دوم سے شادی کی تھی، جو ایڈرن میں پیچھے رہ گئی تھی اور اسے 1485 میں اپنی مسجد کے پیچھے دفن کیا گیا تھا۔"
  tr: "1482 yılında, Edirne'de kalan ve 1485 yılında camisinin arkasına gömülen Türkmen prensesi ve Fatih Mehmed'in eşi Siti Hatun için bir cami inşa edilmiştir."
  id: "Sebuah masjid didirikan pada tahun 1482 M untuk Siti Khatun, putri Turkmen dan istri Mehmed Sang Penakluk, yang tetap tinggal di Edirne dan dimakamkan di belakang masjidnya pada tahun 1485 M."
