summary:
  ar: "بطاقة أولية لجامع أصفهان، الجامع الكبير الذي نما على القرون من العصر البويهي إلى الصفوي، ورد في وصف مرجعي مفتوح ⁦(ويكي البيانات)⁩. لم يُراجع نص معجم البلدان في أصفهان على الصفحة بعد."
  en: "Draft card for the Jameh Mosque of Isfahan, the great congregational mosque that grew across centuries from the Buyid to the Safavid eras, named from an open reference description (Wikidata); its Mujam al-Buldan coverage is not yet read on the page."
  fr: "Notice provisoire : Mosquée du vendredi de Ispahan, grande mosquée du vendredi développée au fil des siècles, des Bouyides aux Safavides, nommée d’après une description de référence ouverte (Wikidata). Son traitement dans le Mujam al-Buldan n’a pas encore été lu sur la page."
  es: "Ficha preliminar de la Mezquita Jameh de Isfahán, la gran mezquita congregacional que creció a lo largo de los siglos desde la era Buyí hasta la Safávida, cuyo nombre proviene de una descripción de referencia abierta (Wikidata); su cobertura de Mujam al-Buldan aún no se puede leer en la página."
  ur: "اصفہان کی جامع مسجد کے لیے ڈرافٹ کارڈ، ایک عظیم اجتماعی مسجد جو صدیوں میں بیعد سے صفوی دور تک پروان چڑھی، جس کا نام ایک کھلے حوالہ کی تفصیل ⁦(وکی ڈیٹا)⁩ سے رکھا گیا؛ اس کی معجم البلدان کی کوریج ابھی تک صفحہ پر نہیں پڑھی گئی۔"
