summary:
  ar: "مسجد علي بتشين بالجزائر العاصمة؛ بُني سنة 1623م وحُوّل كنيسة نوتردام 1843-1962م ثم عاد مسجداً بعد الاستقلال {cite:yilmaz-turkish-monuments-churches-2023 p.218}."
  en: "The Ali Bitchin Mosque of Algiers, built 1623, made the church of Notre Dame 1843-1962 and a mosque again after independence {cite:yilmaz-turkish-monuments-churches-2023 p.218}."
  fr: "La mosquée Ali Bitchin d’Alger, construite en 1623, devenue l’église Notre-Dame de 1843 à 1962 et redevenue mosquée après l’indépendance {cite:yilmaz-turkish-monuments-churches-2023 p.218}."
  es: "La mezquita Ali Bitchin de Argel, construida en 1623, fue la iglesia de Notre Dame entre 1843 y 1962 y nuevamente una mezquita después de la independencia {cite:yilmaz-turkish-monuments-churches-2023 p.218}."
  ur: "الجزائر کی علی بیچن مسجد، جو 1623 میں بنائی گئی تھی، نے نوٹر ڈیم کے چرچ کو 1843-1962 میں بنایا اور آزادی کے بعد دوبارہ ایک مسجد بنائی۔"
  tr: "Cezayir'deki Ali Betchin Camii; 1623 yılında inşa edilmiş ve 1843-1962 yılları arasında Notre-Dame Kilisesi yenilenmiş, bağımsızlıktan sonra cami olarak geri dönmüştür {cite:yilmaz-turkish-monuments-churches-2023 s.218}."
  id: "Masjid Ali Betchin di Algiers; dibangun pada tahun 1623 M dan direnovasi Gereja Notre-Dame dari tahun 1843 hingga 1962, kemudian kembali menjadi masjid setelah kemerdekaan {cite:yilmaz-turkish-monuments-churches-2023 hlm.218}."
