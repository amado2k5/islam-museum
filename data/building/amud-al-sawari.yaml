summary:
  ar: "عمود مرتفع في الهواء بظاهر الإسكندرية، تحته قاعدة وفوقه قاعدة؛ يقال إنه لا نظير له من العمد في علوه ولا في استدارته، وتُحكى عنه حكايات مسطورة ومستفيضة على الألسنة {cite:umari-masalik-1924 p. 240}."
  en: "The lofty column outside Alexandria, a base beneath it and a base above, said to have no equal among columns for height or roundness; tales about it are written in books and current on every tongue {cite:umari-masalik-1924 p. 240}."
  fr: "La haute colonne hors d’Alexandrie, avec une base au-dessous et une base au-dessus, dont on dit qu’aucune colonne ne l’égale en hauteur ni en rondeur ; les récits à son sujet figurent dans les livres et courent sur toutes les lèvres {cite:umari-masalik-1924 p. 240}."
  es: "La alta columna a las afueras de Alejandría, con una base debajo y otra encima, se dice que no tiene igual entre las columnas por su altura o redondez; se cuentan historias sobre ella en libros y son de dominio público {cite:umari-masalik-1924 p. 240}."
  ur: "اسکندریہ کے باہر اونچا کالم، اس کے نیچے ایک بنیاد اور اوپر ایک بنیاد، کہا جاتا ہے کہ اونچائی یا گول پن کے لیے کالموں کے درمیان کوئی برابر نہیں ہے۔ اس کے بارے میں کہانیاں کتابوں میں لکھی ہوئی ہیں اور ہر ایک کی زبان پر چل رہی ہیں۔ 240}۔"
