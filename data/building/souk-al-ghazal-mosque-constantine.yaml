summary:
  ar: "مسجد بجوار قصر الباي في قسنطينة، بناه حسين باي الكلياني سنة 1143هـ/1731 بحسب نقشه، حوّله الفرنسيون إلى كنيسة نوتردام بعد احتلال المدينة في 13 أكتوبر 1837، وعاد مسجداً بعد الاستقلال {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 230}."
  en: "A mosque beside the Bey's palace in Constantine, built by Kelyani Hüseyin Bey in AH 1143/1731 according to its inscription, made into the church of Notre-Dame after the French took the city on 13 October 1837, and a mosque again after independence {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 230}."
  ur: "قسنطینہ میں بے کے محل کے پہلو میں مسجد، جو کتبے کے مطابق 1143ھ/1731ء میں کلیانی حسین بے نے بنوائی؛ 13 اکتوبر 1837ء کو فرانسیسی قبضے کے بعد نوتر دام گرجا بنی اور آزادی کے بعد پھر مسجد {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 230}۔"
