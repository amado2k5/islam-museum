summary:
  ar: "بطاقة أولية للجامع الأخضر ببورصة، المسجد الذي بناه السلطان محمد الأول واشتهر بزخارفه الخزفية الخضراء؛ من أعلام العمارة العثمانية الباكرة كما تفصّلها مصادر تاريخ العمارة العثمانية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Yesil (Green) Mosque of Bursa, built for Sultan Mehmed I and famed for its green tilework; a landmark of early Ottoman architecture per the cited survey, the page not yet checked."
  fr: "Notice provisoire de Yeşil, mosquée de Mehmed Ier célèbre pour ses carreaux verts, monument ottoman ancien selon l’étude citée ; page non encore vérifiée."
  es: "Boceto de ficha para la Mezquita Yesil (Verde) de Bursa, construida para el sultán Mehmed I y famosa por sus azulejos verdes; un hito de la arquitectura otomana temprana según el estudio citado, página aún no verificada."
  ur: "برسا کی یسیل ⁦(سبز)⁩ مسجد کے لیے ڈرافٹ کارڈ، جو سلطان محمد اول کے لیے بنائی گئی تھی اور اس کے سبز ٹائل ورک کے لیے مشہور تھی۔ حوالہ کردہ سروے کے مطابق ابتدائی عثمانی فن تعمیر کا ایک تاریخی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "Bursa'daki Yeşil Camii için ön kart; Sultan I Mehmed tarafından inşa edilen ve yeşil seramik süslemeleriyle ünlü; erken dönem Osmanlı mimarisinin önde gelen figürlerinden biridir, henüz gözden geçirilmemiş Osmanlı mimarisi tarihî kaynaklarında detaylandırılmıştır."
  id: "Kartu pendahuluan untuk Masjid Hijau di Bursa, masjid yang dibangun oleh Sultan Mehmed I dan terkenal dengan dekorasi keramik hijaunya; salah satu tokoh terkemuka arsitektur Ottoman awal, sebagaimana dijelaskan oleh sumber sejarah arsitektur Ottoman, yang belum ditinjau."
