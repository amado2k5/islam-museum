summary:
  ar: "بطاقة أولية للمسجد الكبير في كلوة بتنزانيا، جامع القرن الحادي عشر الموسع في القرن الثالث عشر وأقدم المساجد الباقية على الساحل السواحلي؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Great Mosque of Kilwa in Tanzania, the eleventh-century mosque extended in the thirteenth century and the oldest standing mosque on the Swahili coast; the encyclopedia page not yet checked."
  fr: "Notice provisoire : Grande Mosquée de Kilwa, en Tanzanie, mosquée du XIe siècle agrandie au XIIIe siècle et plus ancienne mosquée encore debout de la côte swahilie. La page n’est pas encore vérifiée."
  es: "Ficha de borrador para la Gran Mezquita de Kilwa en Tanzania, la mezquita del siglo XI ampliada en el siglo XIII y la mezquita más antigua que se conserva en la costa suajili; la página de la enciclopedia aún no ha sido revisada."
  ur: "تنزانیہ میں کیلوا کی عظیم مسجد کے لیے ڈرافٹ کارڈ، گیارہویں صدی کی مسجد جس کو تیرہویں صدی میں توسیع دی گئی اور سواحلی ساحل پر سب سے قدیم کھڑی مسجد؛ انسائیکلوپیڈیا کا صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Tanzanya'nın Kelwa kentindeki Büyük Cami için ön kart, 11. yüzyıla ait cami 13. yüzyılda genişletilmiş ve Svahili kıyısındaki ayakta kalan en eski camidir; sayfa henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Besar di Kelwa, Tanzania, masjid abad ke-11 yang diperluas pada abad ke-13 dan merupakan masjid tertua yang masih ada di pesisir Swahili; halamannya belum ditinjau."
