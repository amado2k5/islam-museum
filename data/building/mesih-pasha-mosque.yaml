  ur: "1585 خواجہ سرا مسیح پاشا کے لیے چوتھی پہاڑی پر مسجد؛ کوران کا استدلال ہے کہ داوت آغا نے اسے سنان کے کمیشن کے تحت بنایا تھا۔"
  tr: "Dördüncü tepede 1585 yılında Mesih Muhammed Paşa için bir cami inşa edilmiştir; Kuran, bunun Sinan tarafından Davud Ağa tarafından sipariş edilen bir eseri olduğunu savunur."
  id: "Sebuah masjid di gundukan keempat dibangun pada tahun 1585 M untuk Masih Muhammad Pasha; Kuran berpendapat bahwa masjid itu adalah karya Dawood Agha yang dipesan oleh Sinan."
