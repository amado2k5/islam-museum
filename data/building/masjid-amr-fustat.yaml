id: building/masjid-amr-fustat
class: building
kind: mosque
label: { ar: "مسجد عمرو بن العاص", en: "the Mosque of Amr ibn al-As" }
summary:
  ar: "مسجد عظيم بمدينة الفسطاط بناه عمرو بن العاص موضع فسطاطه وما جاوره، وصلّى فيه نحو ثمانين من الصحابة {cite:umari-masalik-1924 p. 209}. تصفه دائرة المعارف الإسلامية بأنه أول مسجد بُني في مصر، وكانت مساحته أول الأمر خمسين ذراعاً في ثلاثين، وبلغ حجمه الحالي سنة 212هـ/827م بعد إعادات بناء متكررة. كان موضع صلاة ومجلس ومحكمة ومبيتاً للمسافرين، وحوله خطط القبائل."
  en: "The great mosque of Fustat built by Amr ibn al-As on his camp's ground, where some eighty Companions prayed {cite:umari-masalik-1924 p. 209}. The Encyclopaedia of Islam calls it the first mosque built in Egypt, at first fifty by thirty cubits, reaching its present size in 212/827 after repeated rebuilding. It served as a place of prayer, council, court and lodging for travellers, with the tribal quarters of the settlement laid out around it."
  ur: "فسطاط کی عظیم مسجد جو عمرو بن العاص نے اپنی لشکرگاہ کی زمین پر بنائی اور جس میں تقریباً اسی صحابہ نے نماز پڑھی {cite:umari-masalik-1924 p. 209}۔ دائرۃ المعارف اسلامیہ اسے مصر کی پہلی مسجد بتاتی ہے، جو شروع میں پچاس ضرب تیس ذراع تھی اور بار بار کی تعمیرِ نو کے بعد 212ھ/827ء میں موجودہ حجم کو پہنچی۔ یہ عبادت، مشاورت، عدالت اور مسافروں کی قیام گاہ کا کام دیتی تھی، اور اس کے گرد بستی کے قبائلی محلے تھے۔"
