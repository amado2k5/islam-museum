summary:
  ar: "جامع قلعة فيروز آباد في دلهي، بني سنة 755هـ/1354 على طابق سفلي من الحجرات قرب النهر، وصلى فيه تيمور سنة 1398، ولم يبق منه إلا البوابة الشمالية وثلاثة جدران {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  en: "The congregational mosque of Firuz Shah's citadel of Firuzabad in Delhi, built in AH 755/1354 over a basement of cells beside the river, where Timur prayed in 1398; only its north gateway and three walls survive {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  ur: "دہلی میں فیروز شاہ کے قلعے فیروز آباد کی جامع مسجد، جو 755ھ/1354ء میں دریا کے کنارے حجروں کی نچلی منزل پر بنی اور جہاں تیمور نے 1398ء میں نماز پڑھی؛ اب صرف شمالی دروازہ اور تین دیواریں باقی ہیں {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}۔"
