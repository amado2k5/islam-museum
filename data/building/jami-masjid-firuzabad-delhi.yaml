label: { ar: "الجامع في كوتلا فيروز شاه ⁦(فيروز آباد)⁩", en: "Jami Masjid, Kotla Firuz Shah (Firuzabad)", fr: "Jami Masjid, Kotla Firuz Shah (Firuzabad)", ur: "جامع مسجد، کوٹلہ فیروز شاہ ⁦(فیروز آباد)⁩", tr: "Kotla Firoz Shah'taki cami (Firozabad)", id: "Masjid di Kotla Firoz Shah (Firozabad)" }
summary:
  ar: "جامع قلعة فيروز آباد في دلهي، بني سنة 755هـ/1354 على طابق سفلي من الحجرات قرب النهر، وصلى فيه تيمور سنة 1398، ولم يبق منه إلا البوابة الشمالية وثلاثة جدران {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  en: "The congregational mosque of Firuz Shah's citadel of Firuzabad in Delhi, built in AH 755/1354 over a basement of cells beside the river, where Timur prayed in 1398; only its north gateway and three walls survive {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  fr: "Mosquée du vendredi de la citadelle de Firuzabad de Firuz Shah à Delhi, construite en 755 H/1354 au-dessus d’un sous-sol de cellules près du fleuve, où Timur pria en 1398 ; seuls son portail nord et trois murs subsistent {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  ur: "دہلی میں فیروز شاہ کے قلعے فیروز آباد کی جامع مسجد، جو 755ھ/1354ء میں دریا کے کنارے حجروں کی نچلی منزل پر بنی اور جہاں تیمور نے 1398ء میں نماز پڑھی؛ اب صرف شمالی دروازہ اور تین دیواریں باقی ہیں {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}۔"
  es: "La mezquita congregacional de la ciudadela de Firuz Shah en Firuzabad, Delhi, construida en AH 755/1354 sobre un sótano de celdas junto al río, donde Timur oró en 1398; solo sobreviven su puerta norte y tres muros {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 p. 68}."
  tr: "Delhi'deki Firuzabad Kalesi Camii, 755 H/1354 Hicri yıllarında nehir kenarındaki alt kattaki odalara inşa edilmiştir. Timur, 1398 Hicri'de burada namaz kılmıştır; geriye sadece kuzey kapısı ve üç duvar kalır; {cite:seema-khan-camii-mimarisi-firuzshah-tughlaq-2011 s. 63} {cite:seema-khan-camii-mimarisi-firuzshah-tughlaq-2011 s. 64} {cite:seema-khan-camii-mimarisi-firuzshah-tughlaq-2011 s. 68}."
  id: "Masjid Benteng Firuzabad di Delhi dibangun pada tahun 755 H/1354 H, di lantai bawah ruangan dekat sungai. Timur berdoa di sana pada tahun 1398 H, menyisakan hanya gerbang utara dan tiga dinding {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 63} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 64} {cite:seema-khan-mosque-architecture-firuzshah-tughlaq-2011 hlm. 68}."
