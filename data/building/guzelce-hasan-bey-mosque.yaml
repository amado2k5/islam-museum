summary:
  ar: "بُني سنة 1406م لصهر بايزيد الأول؛ يتقدمه أفلول مروّق من أقدم أفنية الجوامع العثمانية بمدخل مغطى بمظلة مقببة فريد."
  en: "Built 1406 for a son-in-law of Beyazit I; preceded by one of the earliest avlus in Ottoman architecture, its domed entrance canopy unique per Kuran."
  fr: "Construite en 1406 pour un gendre de Beyazit Ier ; précédée d’un des premiers avlus de l’architecture ottomane, avec un auvent d’entrée sous coupole jugé unique par Kuran."
  es: "Construido en 1406 para un yerno de Beyazit I; precedido por uno de los primeros avlus de la arquitectura otomana, su marquesina de entrada abovedada es única según el Corán."
  ur: "بیاضیت اول کے داماد کے لیے 1406 میں بنایا گیا؛ اس سے پہلے عثمانی فن تعمیر میں قدیم ترین avlus میں سے ایک ہے، اس کا گنبد والا داخلی دروازہ قرآن کے مطابق منفرد ہے۔"
  tr: "1406 yılında Bayezid I'in damadı tarafından inşa edilmiştir; öncesinde Osmanlı camilerinin en eski avlularından birinin süslü avlusu bulunur ve girişi benzersiz kubbeli bir tente ile kaplıdır."
  id: "Bangunan ini dibangun pada tahun 1406 M oleh menantu Bayezid I; didahului oleh halaman yang dihias di salah satu halaman tertua masjid Ottoman, dengan pintu masuk yang ditutupi oleh kanopi berkubah unik."
