summary:
  ar: "بستان بابر المنحوت في الصخر قرب سد سكندر لودي على بعد ميلين غرب دهولپور، وصفه بابر في مذكراته سنة 1527–1529، وبقيت منه بركة مثمنة على هيئة اللوتس منحوتة في الصخر؛ يعده ناث أول عمارة منحوتة في الصخر في الهند الإسلامية {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  en: "Babur's rock-cut garden by Sikandar Lodi's dam two miles west of Dholpur, described in his memoirs for 1527-29, of which a lotus-shaped octagonal pond cut in the living rock survives; Nath calls it the first rock-cut architecture of Muslim India {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  ur: "دھولپور سے دو میل مغرب میں سکندر لودی کے بند کے پاس بابر کا چٹان تراش باغ، جس کا ذکر ان کی یادداشتوں میں 1527–29ء کا ہے؛ چٹان میں تراشا کنول نما ہشت پہلو حوض باقی ہے؛ ناتھ اسے مسلم ہند کی پہلی چٹان تراش عمارت کہتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 100}۔"
