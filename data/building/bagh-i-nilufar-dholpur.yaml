label: { ar: "باغ نيلوفر ⁦(بستان اللوتس)⁩ في دهولپور", en: "Bagh-i Nilufar (Lotus Garden), Dholpur", fr: "Bagh-i Nilufar (jardin du Lotus), Dholpur", ur: "باغِ نیلوفر، دھولپور", es: "Bagh-i Nilufar (Jardín del Loto), Dholpur", tr: "Dholpur'daki Lotus Bahçesi (Lotus Bahçesi)", id: "Taman Teratai (Kebun Teratai) di Dholpur" }
summary:
  ar: "بستان بابر المنحوت في الصخر قرب سد سكندر لودي على بعد ميلين غرب دهولپور، وصفه بابر في مذكراته سنة 1527–1529، وبقيت منه بركة مثمنة على هيئة اللوتس منحوتة في الصخر؛ يعده ناث أول عمارة منحوتة في الصخر في الهند الإسلامية {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  en: "Babur's rock-cut garden by Sikandar Lodi's dam two miles west of Dholpur, described in his memoirs for 1527-29, of which a lotus-shaped octagonal pond cut in the living rock survives; Nath calls it the first rock-cut architecture of Muslim India {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  fr: "Jardin de Babur taillé dans la roche près du barrage de Sikandar Lodi à deux milles à l’ouest de Dholpur, décrit dans ses mémoires pour 1527-1529, dont subsiste un bassin octogonal en forme de lotus creusé dans la roche vive ; Nath y voit le premier exemple d’architecture rupestre de l’Inde musulmane {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  ur: "دھولپور سے دو میل مغرب میں سکندر لودی کے بند کے پاس بابر کا چٹان تراش باغ، جس کا ذکر ان کی یادداشتوں میں 1527–29ء کا ہے؛ چٹان میں تراشا کنول نما ہشت پہلو حوض باقی ہے؛ ناتھ اسے مسلم ہند کی پہلی چٹان تراش عمارت کہتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 100}۔"
  es: "El jardín excavado en la roca de Babur junto a la presa de Sikandar Lodi, a dos millas al oeste de Dholpur, descrito en sus memorias de 1527-29, del cual sobrevive un estanque octogonal en forma de loto excavado en la roca viva; Nath lo llama la primera arquitectura excavada en la roca de la India musulmana {cite:nath-history-of-mughal-architecture-1-1982 p. 96} {cite:nath-history-of-mughal-architecture-1-1982 p. 98} {cite:nath-history-of-mughal-architecture-1-1982 p. 100}."
  tr: "Babur'un meyve bahçesi, Dholpur'un iki mil batısında, Sikandar Lodi Barajı yakınlarındaki kayaya oyulmuştur; Babur tarafından 1527–1529 yılları arasında yazdığı anılarında anlatılmıştır ve kayaya oyulmuş lotus şeklinde sekizgen bir gölet olarak kalmıştır; Nath bunu İslam Hindistanı'ndaki ilk kaya oyma mimarisi olarak kabul eder {cite:nath-history-of-mughal-architecture-1-1-1982 s. 96} {cite:nath-history-of-mughal-architecture-1-1982 s. 98} {cite:nath-history-of-mughal-architecture-1-1-1982 s. 100}."
  id: "Kebun Babur yang dipahat di batu dekat Bendungan Sikandar Lodi, dua mil sebelah barat Dholpur, dijelaskan oleh Babur dalam memoarnya dari tahun 1527–1529, dan tetap menjadi kolam segi delapan berbentuk teratai yang diukir di batu; Nath menganggapnya sebagai arsitektur pertama yang dipahat di batu India Islam {cite:nath-history-of-mughal-architecture-1-1-1982 hlm. 96} {cite:nath-history-of-mughal-architecture-1-1982 hlm. 98} {cite:nath-history-of-mughal-architecture-1-1-1982 hlm. 100}."
