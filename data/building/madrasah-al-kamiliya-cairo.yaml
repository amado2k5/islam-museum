summary:
  ar: "المدرسة الكاملية بالقاهرة، المعروفة بدار الحديث، ملاصقة للمدرسة الظاهرية الجديدة، ولها وقف من الأرباع ⁦(المقريزي، ص 1032، 1062، 1063)⁩."
  en: "The Kamiliya madrasa in Cairo, known as Dar al-Hadith, beside the new Zahiriyya madrasa, with a shop-block in its endowment (al-Maqrizi, pp. 1032, 1062, 1063)."
  fr: "Madrasa Kamiliya du Caire, dite Dar al-Hadith, près de la nouvelle madrasa Zahiriyya ; son waqf comprend un îlot de boutiques (al-Maqrizi, pp. 1032, 1062, 1063)."
  es: "La madrasa Kamiliya en El Cairo, conocida como Dar al-Hadith, junto a la nueva madrasa Zahiriyya, con un bloque de tiendas en su patrimonio (al-Maqrizi, pp. 1032, 1062, 1063)."
  ur: "قاہرہ میں کاملیہ مدرسہ، جسے دار الحدیث کہا جاتا ہے، نئے مدرسہ ظاہریہ کے ساتھ، اس کے اوقاف میں ایک دکان والا بلاک ہے ⁦(المقریضی، صفحہ 1032، 1062، 1063)⁩۔"
  tr: "Kahire'deki El-Kamiliye Okulu, Dar Al-Hadis olarak bilinir, yeni Zahiri Okulu'nun bitişiğinde yer almakta olup dört bölümden oluşan bir bağışı vardır (Al-Maqrizi, ss. 1032, 1062, 1063)."
  id: "Sekolah Al-Kamiliya di Kairo, yang dikenal sebagai Dar Al-Hadith, bersebelahan dengan Sekolah Zahiri yang baru dan memiliki dana abadi empat kuartal (Al-Maqrizi, hlm. 1032, 1062, 1063)."
