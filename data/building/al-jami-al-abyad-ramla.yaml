summary:
  ar: "بطاقة أولية للجامع الأبيض بالرملة، جامع الأمويين في المدينة التي أسسها سليمان بن عبد الملك؛ بقيت منارته البيضاء من معالم الرملة إلى اليوم ولم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the White Mosque of Ramla, the Umayyad congregational mosque of the city founded by Sulayman ibn Abd al-Malik, whose white minaret still stands; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée Blanche de Ramla, mosquée du vendredi omeyyade de la ville fondée par Sulayman ibn Abd al-Malik, dont le minaret blanc subsiste. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la Mezquita Blanca de Ramla, la mezquita congregacional omeya de la ciudad fundada por Sulayman ibn Abd al-Malik, cuyo minarete blanco aún se conserva; sus fuentes aún no han sido verificadas en la página."
  ur: "رملہ کی سفید مسجد کے لیے ڈرافٹ کارڈ، شہر کی اموی اجتماعی مسجد جسے سلیمان بن عبد الملک نے قائم کیا تھا، جس کا سفید مینار اب بھی کھڑا ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Süleyman bin Abdülmelik tarafından kurulan şehirdeki Emevi Camii Ramla'daki Beyaz Camii için ön kart; beyaz minaresi günümüzde Ramla'nın simgesi olarak kalmakta ve kaynakları henüz sayfada incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Putih di Ramla, Masjid Umayyah di kota yang didirikan oleh Suleiman ibn Abd al-Malik; menara putihnya tetap menjadi landmark Ramla hingga hari ini, dan sumbernya belum ditinjau di halaman tersebut."
