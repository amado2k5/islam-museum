summary:
  ar: "المسجد الكبير بديوريغي في الأناضول؛ يؤرخه كوران سنة 1230م/628هـ ويعده مع أولو جامع أرضروم من نماذج ما قبل العمارة العثمانية الكلاسيكية {cite:kuran-mosque-early-ottoman}."
  en: "The Great Mosque of Divrigi in Anatolia; Kuran dates it to 1230 CE/AH 628 and counts it with the Ulucami of Erzurum among the monuments preceding classical Ottoman architecture {cite:kuran-mosque-early-ottoman}."
  fr: "La Grande Mosquée de Divriği en Anatolie ; Kuran la date de 1230 ap. J.-C./628 H et la compte, avec l’Ulucami d’Erzurum, parmi les monuments précédant l’architecture ottomane classique {cite:kuran-mosque-early-ottoman}."
  es: "La Gran Mezquita de Divrigi en Anatolia; Kuran la fecha en 1230 d. C./628 d. H. y la incluye junto con los Ulucami de Erzurum entre los monumentos que preceden a la arquitectura otomana clásica {cite:kuran-mosque-early-ottoman}."
  ur: "اناطولیہ میں Divrigi کی عظیم مسجد؛ قرآن کی تاریخ 1230 CE/AH 628 ہے اور اس کا شمار کلاسیکی عثمانی فن تعمیر سے پہلے کی یادگاروں میں ایرزورم کے Ulucami کے ساتھ ہوتا ہے۔"
  tr: "Anadolu'daki Diyuriği'deki Büyük Camii; Kuran tarafından 1230 M.S. / 628 Hicri yılına tarihlendirilmiş olup, Ulu Erzurum Camii ile birlikte pre-klasik Osmanlı mimarisinin bir modeli olarak kabul edilir {atıf:kuran-cami-erç-osmanlı}."
  id: "Masjid Agung di Diyuriği, Anatolia; diperkirakan berasal dari Kuran pada tahun 1230 M / 628 H dan dianggap bersama dengan Masjid Ulu Erzurum sebagai model arsitektur pra-klasik Ottoman {cite:kuran-mosque-early-Ottoman}."
