label:
  ar: "ضريح همايون ⁦(دلهي)⁩"
  en: "Humayun's Tomb"
summary:
  ar: "ضريح الإمبراطور المغولي همايون في دلهي، ويصفه المعجم المرجعي بأنه أول بناء مغولي كبير في المدينة، بدأته أرملته نحو 976هـ/1568م بمعمار فارسي اسمه غياث، وصممه ميرزا غياث على المخطط التساعي التيموري وسط جهاربغ. قبته بصلية مزدوجة على رقبة عالية، وجدرانه من الحجر الرملي الأحمر المطعّم بالرخام، وحوله بستان طول ضلعه 340 متراً ومبانٍ مجاورة منها قبر عيسى خان ونيلا گنبد. ويعدّه رضوي مع تاج محل أشهر مباني هذا المخطط {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  en: "The mausoleum of the Mughal emperor Humayun at Delhi, called by the Encyclopaedia of Islam the first major Mughal building in the city, begun by his widow about 976/1568 with the Persian architect Ghiyath and set in a chaharbagh enclosure 340 metres on a side. It has a bulbous double dome on a high drum, red sandstone walls inlaid with marble, and neighbouring buildings including the tomb of Isa Khan and the Nila Gumbad. Rezavi ranks it with the Taj Mahal as the best-known building on the Timurid nine-part plan {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  ur: "دہلی میں مغل بادشاہ ہمایوں کا مقبرہ، جسے انسائیکلوپیڈیا آف اسلام شہر میں مغلوں کی پہلی بڑی عمارت کہتی ہے؛ اسے اس کی بیوہ نے تقریباً 976ھ/1568ء میں فارسی معمار غیاث کے ذریعے شروع کرایا اور یہ 340 میٹر کے ہر ضلع والے چہار باغ احاطے میں ہے۔ اس کا گنبد اونچی گردن پر دہرا پیازی ہے، دیواریں سنگ مرمر کی جڑائی والے سرخ ریتلے پتھر کی ہیں، اور آس پاس عیسیٰ خان کا مقبرہ اور نیلا گنبد جیسی عمارتیں ہیں۔ رضوی اسے تاج محل کے ساتھ تیموری نو حصوں والے نقشے کی سب سے مشہور عمارت مانتے ہیں {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
