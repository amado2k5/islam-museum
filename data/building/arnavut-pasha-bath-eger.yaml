label: { ar: "حمّام أرناؤوط باشا الحراري في إگر", en: "Arnavut Pasha Thermal Bath, Eger", fr: "Bain thermal Arnavut Pacha, Eger", ur: "ارناؤوط پاشا گرم حمام، ایگر", es: "Baños termales Arnavut Pasha, Eger", tr: "Iger'deki Arnaout Paşa Termal Hamamı", id: "Pemandian Air Panas Arnaout Pasha di Iger" }
summary:
  ar: "حمّام حراري جنوب قلعة إگر بنحو 500 متر، بناه في أوائل القرن السابع عشر عبد الرحمن عبدي باشا آخر ولاة بودا، قاعته مثمنة مقببة فيها حوض حار، وما زال عاملاً {cite:yilmaz-ottoman-architecture-hungary-2024 p. 168}."
  en: "A thermal bath some 500 metres south of Eger castle, founded in the early seventeenth century by Abdurrahman Abdi Pasha, later the last governor of Buda; its octagonal domed hall holds a hot pool and it is still in use {cite:yilmaz-ottoman-architecture-hungary-2024 p. 168}."
  fr: "Bain thermal à quelque 500 mètres au sud du château d’Eger, fondé au début du XVIIe siècle par Abdurrahman Abdi Pacha, qui devint le dernier gouverneur de Buda ; sa salle octogonale à coupole abrite un bassin chaud et reste utilisée {cite:yilmaz-ottoman-architecture-hungary-2024 p. 168}."
  ur: "ایگر قلعے سے تقریباً 500 میٹر جنوب میں گرم پانی کا حمام، سترھویں صدی کے اوائل میں بودا کے آخری حاکم عبدالرحمن عبدی پاشا کا بنوایا؛ ہشت پہلو گنبد والے ہال میں گرم حوض؛ اب بھی چالو {cite:yilmaz-ottoman-architecture-hungary-2024 p. 168}۔"
  es: "Un balneario termal situado a unos 500 metros al sur del castillo de Eger, fundado a principios del siglo XVII por Abdurrahman Abdi Pasha, posteriormente último gobernador de Buda; su sala octogonal con cúpula alberga una piscina de agua caliente y todavía está en uso {cite:yilmaz-ottoman-architecture-hungary-2024 p. 168}."
  tr: "Eger Kalesi'nin yaklaşık 500 metre güneyinde, Buda'nın son valisi Abd al-Rahman Abdi Paşa tarafından on yedinci yüzyılın başlarında inşa edilen termal banyo. Salonu sekizgen şeklindedir ve bir jakuzi ile kubbelidir, hâlâ faaliyette {cite:yilmaz-ottoman-architecture-hungary-2024, s. 168}."
  id: "Pemandian air panas sekitar 500 meter di selatan Kastil Eger, dibangun pada awal abad ketujuh belas oleh Abd al-Rahman Abdi Pasha, gubernur terakhir Buda. Aulanya berbentuk segi delapan dan berkubah dengan bak air panas, dan masih beroperasi {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 168}."
