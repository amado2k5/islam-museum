summary:
  ar: "بطاقة أولية لجامع غازي عتيق علي باشا بإسطنبول، الجامع السلطاني الذي بناه الصدر الأعظم عتيق علي باشا أواخر القرن الخامس عشر؛ من معالم العمارة العثمانية الباكرة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Gazi Atik Ali Pasha Mosque of Istanbul, the sultanic mosque founded by the grand vizier in the late fifteenth century; an early Ottoman landmark per the cited survey, the page not yet checked."
  fr: "Notice provisoire pour la mosquée Gazi Atik Ali Pacha d’Istanbul, mosquée sultanienne fondée par le grand vizir à la fin du XVe siècle ; monument ottoman ancien selon l’étude citée, dont la page n’a pas encore été vérifiée."
  es: "Ficha de diseño para la Mezquita Gazi Atik Ali Pasha de Estambul, la mezquita sultánica fundada por el gran visir a finales del siglo XV; un hito otomano temprano según el estudio citado, página aún no verificada."
  ur: "استنبول کی غازی عتیق علی پاشا مسجد کے لیے ڈرافٹ کارڈ، سلطانی مسجد جس کی بنیاد وزیر اعظم نے پندرہویں صدی کے آخر میں رکھی تھی۔ حوالہ کردہ سروے کے مطابق ایک ابتدائی عثمانی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'daki Gazi Atiq Ali Paşa Camii'nin ön kartı, 15. yüzyılın sonlarında Sadrazam Atık Ali Paşa tarafından inşa edilen Sultan Camii'nin ön kartı; erken Osmanlı mimarisinin simgelerinden biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan Masjid Gazi Atiq Ali Pasha di Istanbul, Masjid Sultan yang dibangun oleh Grand Vizier Atık Ali Pasha pada akhir abad ke-15; salah satu landmark arsitektur Ottoman awal, dan halamannya belum pernah ditinjau."
