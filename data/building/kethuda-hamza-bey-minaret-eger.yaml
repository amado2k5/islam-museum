summary:
  ar: "مئذنة بارتفاع 35 متراً و97 درجة في قلب إگر، كل ما بقي من جامع الكتخدا حمزة بك الذي صار كنيسة نحو 150 سنة وهُدم سنة 1841 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 167}."
  en: "A minaret 35 metres high with 97 steps in the heart of Eger, all that remains of the Kethüda Hamza Bey mosque, a church for some 150 years and demolished in 1841 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 167}."
  fr: "Minaret de 35 mètres et 97 marches au cœur d’Eger, seul vestige de la mosquée Kethüda Hamza Bey, église pendant environ 150 ans puis démolie en 1841 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 167}."
  ur: "ایگر کے قلب میں 35 میٹر اونچا، 97 سیڑھیوں کا مینار، کتخدا حمزہ بے مسجد کی واحد نشانی جو تقریباً 150 برس گرجا رہی اور 1841ء میں ڈھا دی گئی {cite:yilmaz-ottoman-architecture-hungary-2024 p. 167}۔"
  es: "Un minarete de 35 metros de altura con 97 escalones en el corazón de Eger, todo lo que queda de la mezquita Kethüda Hamza Bey, que fue iglesia durante unos 150 años y fue demolida en 1841 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 167}."
  tr: "Eger'in kalbinde 35 metre yüksekliğinde ve 97 derece eğimde bir minare, yaklaşık 150 yıl önce kiliseye dönüşen ve 1841'de yıkılan Katkhuda Hamza Bey Camii'nin geriye kalan tek parçasıdır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 167}."
  id: "Sebuah menara setinggi 35 meter dan berketinggian 97 derajat di jantung Eger, yang merupakan sisa Masjid Katkhuda Hamza Bey, yang menjadi gereja sekitar 150 tahun lalu dan dihancurkan pada tahun 1841 {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 167}."
