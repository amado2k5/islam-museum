  ar: "سوق مصر جارشسي ⁦(سوق التوابل)⁩ بإسطنبول؛ سوق كلية الجامع الجديد على شكل حرف L بثمان وثمانين حجرة مقببة، اشتهرت ببيع التوابل والأعشاب {cite:freely-ottoman-architecture-2011 p.339}."
  en: "The Mısır Çarşısı (Spice Bazaar) of Istanbul; the L-shaped market of the Yeni Camii külliye with 88 vaulted rooms, famed for spices and medicinal herbs {cite:freely-ottoman-architecture-2011 p.339}."
