  es: "El Mısır Çarşısı (Bazar de las Especias) de Estambul; el mercado en forma de L de Yeni Camii külliye con 88 salas abovedadas, famoso por sus especias y hierbas medicinales {cita:freely-ottoman-architecture-2011 p.339}."
  ur: "استنبول کا مسالا بازار؛ ینی کامی کلیے کا ایل سائز کا بازار جس میں 88 کمروں والے کمرے ہیں، جو مصالحوں اور دواؤں کی جڑی بوٹیوں کے لیے مشہور ہیں"
