summary:
  ar: "ضريح في آكره بنته نورجهان لأبويها، سبق تاج محل في التطعيم بالرخام الأبيض، ويقوم في جهاربغ {cite:brookes-gardens-of-paradise-1987 p.154} {cite:rezavi-iranian-influence-indian-architecture-2002 p.129}."
  en: "A tomb at Agra built by Nur Jahan for her parents, which used white marble inlay before the Taj Mahal and stands in a chaharbagh {cite:brookes-gardens-of-paradise-1987 p.154} {cite:rezavi-iranian-influence-indian-architecture-2002 p.129}."
  fr: "Tombeau d’Agra construit par Nur Jahan pour ses parents, utilisant l’incrustation de marbre blanc avant le Taj Mahal et situé dans un chaharbagh {cite:brookes-gardens-of-paradise-1987 p.154} {cite:rezavi-iranian-influence-indian-architecture-2002 p.129}."
  es: "Una tumba en Agra construida por Nur Jahan para sus padres, que utilizó incrustaciones de mármol blanco antes del Taj Mahal y se encuentra en un chaharbagh {cite:brookes-gardens-of-paradise-1987 p.154} {cite:rezavi-iranian-influence-indian-architecture-2002 p.129}."
  ur: "آگرہ میں ایک مقبرہ جسے نورجہاں نے اپنے والدین کے لیے بنایا تھا، جس میں تاج محل سے پہلے سفید سنگ مرمر کی جڑی ہوئی تھی اور چہار باغ میں کھڑا ہے"
  tr: "Kızı Nurjehan'ın Akra'daki anıt mezarı olan Tac Mahal, daha önce beyaz mermerle kakılmıştı ve Jharbagh'da durmaktadır {cite:brookes-gardens-of-paradise-1987 s.154} {cite:rezavi-iranian-influence-indian-architecture-2002 s.129} bulunmaktadır."
  id: "Sebuah mausoleum di Akra milik putrinya Nurjehan untuk orang tuanya, Taj Mahal sebelumnya dihiasi dengan marmer putih, dan berdiri di Jharbagh {cite:brookes-gardens-of-paradise-1987 hlm.154} {cite:rezavi-iranian-influence-indian-architecture-2002 hlm.129}."
