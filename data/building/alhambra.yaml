label: { ar: "قصر الحمراء", en: "The Alhambra" }
summary:
  ar: "حصن الحمراء بغرناطة؛ عند ابن خلدون أن محمد بن يوسف بن نصر الشيخ ابن الأحمر لما تغلب على غرناطة سنة خمس وثلاثين وستمائة ونزلها ابتنى بها حصن الحمراء لنزوله، فصار دار مُلك بني نصر قاعدتهم الأولى وقصورهم الأنيقة التي شيدها يوسف الغني بالله واسطة عقدهم ومشيد مبانيهم؛ ومنها سلمها آخرهم أبو عبد الله محمد للنصارى في ثاني ربيع الأول سنة سبع وتسعين وثمانمائة بعد أن استوثقوا من أهل غرناطة بنحو خمسمائة من الأعيان، فعمّرها الطاغية وجدد بناء قصورها وصار يختلف إليها نهاراً ويبيت بمحلته ليلاً حتى اطمأن من خوف الغدر فدخل {cite:nafh-tib-maqqari p. 484, 523-527}."
  en: "The Alhambra of Granada: Ibn al-Ahmar built the fortress as his residence when he took the city in 635, and it became the Nasrids' seat — the elegant palaces raised by Yusuf 'al-Ghani billah' — until the last sultan surrendered it to the Christians on 2 Rabi I 897 after five hundred hostages secured the entry {cite:nafh-tib-maqqari p. 484, 523-527}."
