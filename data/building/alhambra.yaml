label: { ar: "قصر الحمراء", en: "The Alhambra" }
summary:
  ar: "قصر الحمراء مدينة ملكية محصنة بناها محمد ابن الأحمر على هضبة السبيكة المشرفة على غرناطة بعد دخوله إياها سنة 635هـ، وتشمل القصبة العسكرية والقصور وأقساماً للدواوين والمدينة، وأقام يوسف الأول مجموعة قمارش ومحمد الخامس مجموعة الأسود. سُلّمت للنصارى في ربيع الأول سنة 897هـ، وهي عند دائرة المعارف الإسلامية القصر الوحيد من العصور الوسطى الإسلامية الذي وصل كاملاً حسن الحفظ؛ وعند ابن خلدون أن ابن الأحمر ابتناها لنزوله، وعند المقري أنها صارت دار ملك بني نصر وقاعدتهم الأولى {cite:nafh-tib-maqqari p. 484, 523-527}."
  en: "The Alhambra is the fortified palace-city that Muhammad Ibn al-Ahmar began on the Sabika hill above Granada after taking the city in 635 AH, with an Alcazaba, palaces, offices and a town; Yusuf I added the Comares group and Muhammad V the Court of the Lions group. It was surrendered to the Christians in Rabi I 897 AH, and the Encyclopaedia of Islam calls it the only palace of the Muslim Middle Ages to survive whole and well preserved. Ibn Khaldun, relayed by al-Maqqari, says Ibn al-Ahmar built it as his residence and that it became the Nasrids' seat {cite:nafh-tib-maqqari p. 484, 523-527}."
  ur: "الحمراء ایک قلعہ بند شاہی شہر ہے جسے محمد ابن الاحمر نے 635ھ میں غرناطہ پر غلبہ پانے کے بعد سبیکہ کی پہاڑی پر شروع کیا؛ اس میں قصبہ، محلات، دفاتر اور شہر شامل تھے، اور یوسف اول نے قمارش کا مجموعہ اور محمد پنجم نے شیروں کا مجموعہ بنایا۔ یہ ربیع الاول 897ھ میں عیسائیوں کے حوالے ہوا، اور انسائیکلوپیڈیا آف اسلام اسے قرونِ وسطیٰ کے مسلم دور کا واحد محل کہتا ہے جو مکمل اور اچھی حالت میں باقی رہا۔ ابن خلدون کے مطابق، جسے المقری نقل کرتے ہیں، ابن الاحمر نے اسے اپنی رہائش کے لیے بنایا اور یہ بنو نصر کا مرکز بنا {cite:nafh-tib-maqqari p. 484, 523-527}."
