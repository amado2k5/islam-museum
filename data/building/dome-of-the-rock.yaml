    ar: "وصف المقدسي قبة الصخرة نحو سنة ٣٧٥هـ: بيت مثمّن بأربعة أبواب، وداخله ثلاثة أروقة على أعمدة قال إنها أجلّ من الرخام، وقبة ملبسة بالصفر المذهب."
    en: "Al-Muqaddasi described the Dome of the Rock around 375 AH: an octagon with four doors and, inside, three arcades on columns he deemed nobler than marble, capped by a gilt-brass dome."
    ur: "مقدسی نے تقریباً 375ھ میں قبۃ الصخرہ بیان کیا: چار دروازوں والا ایک ہشت پہلو عمارت، اندر تین راہداریوں کے ستون جو اس کے نزدیک سنگِ مرمر سے افضل، اور اوپر سونے کا گنبد۔"
    sources: [source/ahsan-al-taqasim, source/umari-masalik-1924]
