summary:
  ar: "قبة الصخرة في الحرم الشريف بالقدس، وتصفها دائرة المعارف الإسلامية بأنها أقدم أثر باقٍ من العمارة الإسلامية. يؤرخها نقشها الطويل بسنة 72هـ/691-692م في عهد عبد الملك بن مروان، وهي قبة تحيط بها رواقان مثمنان وتغطي فسيفساؤها داخلها. وتذكر الموسوعة ثلاثة تفسيرات لغرضها، هي تذكار الإسراء والمعراج، وبديل عن الحج إلى مكة، وإعلان الدين الجديد في مدينة الديانتين الأقدم، وتعرض كلاً منها دون حسم، وتقول إن النقاش لم يُغلق. ووصفها المقدسي نحو سنة 375هـ وذرعها العمري في العهد المملوكي."
  en: "The Dome of the Rock stands on a platform in the Haram al-Sharif at Jerusalem; the Encyclopaedia of Islam calls it the oldest surviving monument of Islamic architecture. Its long inscription dates it to 72/691-2 under Abd al-Malik ibn Marwan, and it is a dome ringed by two octagonal ambulatories with an interior covered in mosaic. The encyclopaedia reports three explanations of its purpose, a memorial of the Night Journey and Ascension, a substitute for the pilgrimage to Mecca, and a proclamation of the new faith in the city of the two older religions, sets each out without settling it, and says the debate is not closed. Al-Muqaddasi described it about 375 AH and al-Umari measured it in the Mamluk period."
  ur: "قبۃ الصخرہ بیت المقدس میں حرم شریف کے ایک چبوترے پر ہے، اور اسلامی دائرۃ المعارف اسے اسلامی فنِ تعمیر کی سب سے قدیم باقی یادگار کہتی ہے۔ اس کا طویل کتبہ اسے عبدالملک بن مروان کے عہد میں 72ھ/691-692ء کا بتاتا ہے؛ یہ ایک گنبد ہے جس کے گرد دو ہشت پہلو راہداریاں ہیں اور اندر موزیک ہے۔ دائرۃ المعارف اس کے مقصد کی تین توجیہات بتاتی ہے، معراج اور اسراء کی یادگار، حجِ مکہ کا بدل، اور دو قدیم تر مذاہب کے شہر میں نئے دین کا اعلان، ہر ایک کو بغیر فیصلے کے بیان کرتی ہے اور کہتی ہے کہ بحث ختم نہیں ہوئی۔ مقدسی نے اسے تقریباً 375 ہجری میں بیان کیا اور مملوک دور میں عمری نے اس کی پیمائش کی۔"
