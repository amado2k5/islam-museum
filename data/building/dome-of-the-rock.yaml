summary:
  ar: "قبة الصخرة في صحن المسجد الأقصى؛ وصفها المقدسي لعين رأت نحو سنة 375هـ: بيت مثمّن بأربعة أبواب كلها مقابلة مراقي — القبلي وإسرافيل والصور والنساء — وفي وجه كل باب باب ظريف من خشب التوب أمرت به أم المقتدر، وداخله ثلاثة أروقة دائرة على أعمدة معجونة قال إنها أجلّ من الرخام لا نظير لها، وفوق منطقتها طيقان كبار وقبة ملبسة بالصفر المذهب يبلغ طولها مع السقود مائة ذراع، والقبة ثلاث سافات: ألواح مزوقة ثم أعمدة حديد مشبكة لئلا تميلها الرياح ثم خشب عليه الصفائح، قال إذا بزغت عليها الشمس أشرقت وتلألأت المنطقة، ولم ير في الشرق مثلها {cite:ahsan-al-taqasim p. 144}."
  en: "The Dome of the Rock in the Aqsa's court as al-Muqaddasi saw it c. 375 AH: an octagon of four gilded doors facing the stairways — Qibli, Israfil, al-Sur, al-Nisa' — ringed by arcades on piers 'nobler than marble, peerless', a hundred-cubit dome sheathed in gilded brass built in three shells (painted boards, an iron lattice against the wind, timber plate), so that sunrise made it blaze; 'I saw nothing like this dome in all the East' {cite:ahsan-al-taqasim p. 144}."
