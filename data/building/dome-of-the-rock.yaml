summary:
  ar: "قبة الصخرة في صحن المسجد الأقصى؛ وصفها المقدسي لعين رأت نحو سنة 375هـ: بيت مثمّن بأربعة أبواب كلها مقابلة مراقي — القبلي وإسرافيل والصور والنساء — وفي وجه كل باب باب ظريف من خشب التوب أمرت به أم المقتدر، وداخله ثلاثة أروقة دائرة على أعمدة معجونة قال إنها أجلّ من الرخام لا نظير لها، وفوق منطقتها طيقان كبار وقبة ملبسة بالصفر المذهب يبلغ طولها مع السقود مائة ذراع، والقبة ثلاث سافات: ألواح مزوقة ثم أعمدة حديد مشبكة لئلا تميلها الرياح ثم خشب عليه الصفائح، قال إذا بزغت عليها الشمس أشرقت وتلألأت المنطقة، ولم ير في الشرق مثلها {cite:ahsan-al-taqasim p. 144}. وفي عهد المماليك ذرعه ابن فضل الله العمري باباً باباً: فالباب الشرقي مضاعف بينهما عقد بفص مذهّب، والشمالي يسمى باب الجنة والغربي على مثالهما، ومصراعاها ملبّسان بالنحاس الأصفر المنقوش، مع مساحة القبة والأروقة والصحن بالأذرع {cite:umari-masalik-1924 pp. 181-186}."
  en: "The Dome of the Rock in the Aqsa's court as al-Muqaddasi saw it c. 375 AH: an octagon of four gilded doors facing the stairways — Qibli, Israfil, al-Sur, al-Nisa' — ringed by arcades on piers 'nobler than marble, peerless', a hundred-cubit dome sheathed in gilded brass built in three shells (painted boards, an iron lattice against the wind, timber plate), so that sunrise made it blaze; 'I saw nothing like this dome in all the East' {cite:ahsan-al-taqasim p. 144}. In the Mamluk age Ibn Fadl Allah al-Umari measured it again door by door — the eastern gate doubled with a gilded arch between, the northern called Bab al-Janna, the western like it, each leaf sheathed in chased yellow brass, with the cubit-survey of dome, drum and court {cite:umari-masalik-1924 pp. 181-186}."
