  en: Küçük Ayasofya Mosque (Saints Sergius and Bacchus)
  fr: "Mosquée Küçük Ayasofya (Saints-Serge-et-Bacchus)"
  ur: مسجد کوچک ایاصوفیہ
  es: "Mezquita Küçük Ayasofya (Santos Sergio y Baco)"
