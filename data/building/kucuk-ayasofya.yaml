summary:
  ar: "جامع كوتشوك آيا صوفيا بإسطنبول؛ الكنيسة البيزنطية للقديسين سرجيوس وباخوس التي بناها جوستينيان قبل آيا صوفيا بقليل، وحُوّلت جامعًا بعد الفتح العثماني؛ أصّل مخططها المثمّن المحاط لمخطط الجوامع العثمانية {cite:freely-ottoman-architecture-2011}."
  en: "The Kucuk Ayasofya Mosque of Istanbul; the Byzantine church of Saints Sergius and Bacchus erected by Justinian shortly before Haghia Sophia, converted into a mosque after the Ottoman conquest; its inscribed-octagon plan was a prototype for Ottoman mosque plans {cite:freely-ottoman-architecture-2011}."
  fr: "Mosquée Küçük Ayasofya d’Istanbul ; église byzantine Saints-Serge-et-Bacchus élevée par Justinien peu avant Sainte-Sophie, convertie en mosquée après la conquête ottomane ; son plan à octogone inscrit servit de prototype aux mosquées ottomanes {cite:freely-ottoman-architecture-2011}."
  es: "La mezquita de Kucuk Ayasofya de Estambul; la iglesia bizantina de los santos Sergio y Baco erigida por Justiniano poco antes de Santa Sofía, convertida en mezquita después de la conquista otomana; su planta octogonal inscrita fue un prototipo para los planos de las mezquitas otomanas {cite:freely-ottoman-architecture-2011}."
  ur: "استنبول کی کوکوک ایاسوفیہ مسجد؛ بازنطینی چرچ آف سینٹس سرجیئس اور باچس جسٹینین نے ہاگیا صوفیہ سے کچھ دیر پہلے تعمیر کیا تھا، عثمانی فتح کے بعد مسجد میں تبدیل ہو گیا تھا۔ اس کا کندہ شدہ آکٹون پلان عثمانی مسجد کے منصوبوں کا ایک نمونہ تھا"
  tr: "İstanbul'daki Küçük Ayasofya Camii; Justinianus tarafından Ayasofya'dan kısa süre önce inşa edilen Bizans Aziz Sergius ve Bacchus kilisesi, Osmanlı fethi sonrası camiye dönüştürülmüştür; Osmanlı cami düzenini çevreleyen sekizgen planının kökeni {cite:freely-ottoman-architecture-2011}."
  id: "Masjid Küçük Hagia Sophia di Istanbul; gereja Bizantium Santo Sergius dan Bacchus, dibangun oleh Justinian tak lama sebelum Hagia Sophia, yang diubah menjadi masjid setelah penaklukan Ottoman; asal mula denah oktagonalnya yang mengelilingi tata letak masjid Ottoman {cite:freely-ottoman-architecture-2011}."
