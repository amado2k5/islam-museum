summary:
  ar: "مسجد صغيرة مربعة عند الباب الجنوبي للقلعة الداخلية في سالونيك، تنسبها بطاقة الكتاب إلى چلبي حسين بك بعد 1429، استُعملت موقتخانة أيضاً، وحُوّلت سنة 1922 إلى كنيسة القديسين الأنارجيروي {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1296}."
  en: "A small square mosque at the southern gate of the inner citadel of Thessaloniki, ascribed in the book to Çelebi Hüseyin Bey after 1429, also used as a time-keeper's house, and turned in 1922 into the church of the Holy Anargyroi {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1296}."
  ur: "سالونیکا کے اندرونی قلعے کے جنوبی دروازے پر چھوٹی مربع مسجد، کتاب میں 1429ء کے بعد چلبی حسین بے سے منسوب، موقت خانہ بھی رہی، اور 1922ء میں مقدس اناریگیروئی کا گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1296}۔"
