label: { ar: "مسجد لتن ⁦(الجامع الملوّن)⁩ في غور", en: "Lattan (Painted) Mosque, Gaur", fr: "Mosquée Lattan (peinte), Gaur", ur: "لٹن ⁦(رنگین)⁩ مسجد، گوڑ", es: "Mezquita Lattan (pintada), Gaur" }
summary:
  ar: "مسجد مربعة بقبة ودهليز أمامي ذي سقف بنغالي في غور، كانت مكسوة داخلاً وخارجاً بالقيشاني الأزرق والأخضر والأبيض والأصفر، يؤرخها المؤلف بعهد الحسين شاهيين ⁦(899–925هـ/1493–1519)⁩ ويعدها جوهرة الزخرفة الإسلامية في بنغال {c(119)} {c(120)} {c(123)}."
  en: "A square domed mosque with a front vestibule under a Bengali roof at Gaur, once sheathed inside and out in blue, green, white and yellow glazed tile, dated by the author to the Husain Shahi period (AH 899-925/1493-1519) and called a gem of Muslim ornament in Bengal {c(119)} {c(120)} {c(123)}."
  fr: "Mosquée carrée à coupole et vestibule sous toit bengali à Gaur, autrefois revêtue à l’intérieur et à l’extérieur de carreaux émaillés bleus, verts, blancs et jaunes ; datée par l’auteur de la période Husain Shahi (899–925 H/1493–1519) et qualifiée de joyau de l’ornement musulman au Bengale {c(119)} {c(120)} {c(123)}"
  ur: "گوڑ میں ایک گنبد اور بنگالی چھت والی اگلی ڈیوڑھی کی مربع مسجد جو اندر باہر نیلی، سبز، سفید اور زرد کاشی سے ڈھکی تھی؛ مصنف اسے حسین شاہی دور ⁦(899–925ھ/1493–1519)⁩ کی اور بنگال میں اسلامی آرائش کا جوہر کہتے ہیں {c(123)}۔"
  es: "Una mezquita cuadrada con cúpula y un vestíbulo frontal bajo un techo bengalí en Gaur, que alguna vez estuvo revestida por dentro y por fuera con azulejos vidriados azules, verdes, blancos y amarillos, datada por el autor en el período Husain Shahi (AH 899-925/1493-1519) y llamada una joya del ornamento musulmán en Bengala {c(119)} {c(120)} {c(123)}."
