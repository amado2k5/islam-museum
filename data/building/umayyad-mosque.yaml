summary:
  ar: "شرع الوليد بن عبد الملك في بنائه سنة سبع وثمانين، وهو من أعظم ما بني في عهده؛ يذكر ابن أبي عبلة افتتح الوليد الهند والأندلس وبنى مسجد دمشق {cite:tarikh-khulafa-minhaj-1434 p. 367}. ويذكر الكتاب أن الوليد بنى الجامع الأموي في دمشق، وأنه حوّل الكنيسة التي كانت فيه بعد أن تفاوض مع النصارى، وأنه أنفق فيه أموالاً جليلة، وأن البناء تكامل سنة 96هـ. {cite:salabi-umayyad-state-2020 p.131-132} وعند ابن فضل الله العمري أن باب الساعات سُمي لأنه عُمل هناك بيكار الساعات يُعلم بها كل ساعة تمضي، عليها عصافير من نحاس وحية من نحاس وغراب من نحاس فإذا تمت الساعة خرجت الحية وصفرت العصافير وصاح الغراب وسقطت حصاة في الطست؛ وكان في الجامع قبل حريقه طلسمات معلقة في السقف لسائر الحشرات والصنونات والفأر والحيات والعقارب والعنكبوت فلم يكن يوجد فيه منها شيء حتى احترقت في الحريق فوُجدت {cite:umari-masalik-1924 p. 197-198}."
  en: "Begun by al-Walid ibn Abd al-Malik in year 87 — among the greatest works of his reign; Ibn Abi Abla names it beside the conquests of India and al-Andalus {cite:tarikh-khulafa-minhaj-1434 p. 367}."
