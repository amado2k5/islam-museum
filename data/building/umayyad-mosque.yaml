summary:
  ar: "الجامع الأموي بدمشق أول روائع العمارة الإسلامية وأحد أبهرها بحسب دائرة المعارف الإسلامية، وقد نسبته إلى الوليد الأول. بُني داخل سور المعبد القديم بعد هدم كنيسة القديس يوحنا، في إطار نحو 120 في 80 متراً، وفيه صحن شمالي وقاعة صلاة جنوبية تعلوها قبة، وزُينت جدرانه بالرخام والفسيفساء. وتذكر المقالة أن البناء استغرق ست سنوات، وأن قسمة الكنيسة بين النصارى والمسلمين أسطورة نشأت من خطأ في الترجمة. ويذكر السيوطي والصلابي أن الوليد شرع فيه سنة 87هـ وتكامل سنة 96هـ."
  en: "According to the Encyclopaedia of Islam, the Umayyad Mosque of Damascus is the first and one of the most impressive masterpieces of Muslim architecture, the work of al-Walid I. It was built inside the old temple enclosure after the Church of St. John was pulled down, in a frame of about 120 by 80 metres with a northern courtyard and a southern prayer hall under a dome, its walls covered with marble and mosaic. The article says it took six years, and calls the story of the church being shared between Christians and Muslims a legend born of a translation error. Al-Suyuti and al-Sallabi say al-Walid began it in 87 AH and it was complete in 96."
  ur: "دائرۃ المعارف اسلامیہ کے مطابق دمشق کی جامع اموی اسلامی فن تعمیر کا پہلا اور نہایت شاندار شاہکار ہے، جو ولید اول کی تعمیر ہے۔ یہ قدیم معبد کی فصیل کے اندر سینٹ جان کا گرجا ڈھانے کے بعد تقریباً 120 در 80 میٹر کے احاطے میں بنی، جس میں شمالی صحن اور گنبد والی جنوبی نماز گاہ ہے اور دیواریں سنگ مرمر اور موزائیک سے آراستہ ہیں۔ مقالہ کہتا ہے کہ تعمیر چھ سال میں ہوئی اور گرجے کی عیسائیوں اور مسلمانوں میں تقسیم کی روایت ترجمے کی غلطی سے پیدا ہونے والی داستان ہے۔ سیوطی اور الصلابی کے مطابق ولید نے 87ھ میں آغاز کیا اور 96ھ میں تکمیل ہوئی۔"
