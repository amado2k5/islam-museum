education:
  did_you_know:
    ar: "شرع الوليد بن عبد الملك في بناء الجامع الأموي بدمشق سنة ٨٧هـ وتكامل سنة ٩٦هـ؛ ويذكر ابن فضل الله أن باب الساعات سُمي لساعة نحاسية كانت تُعلم بها كل ساعة."
    en: "Al-Walid ibn Abd al-Malik began Damascus's Umayyad Mosque in 87 AH, completed in 96; Ibn Fadl Allah says its 'Gate of the Hours' took its name from a brass water-clock that marked each hour."
    ur: "ولید بن عبدالملک نے دمشق کی اموی جامع مسجد کی بنیاد 87ھ میں رکھی اور 96ھ میں مکمل ہوئی؛ ابن فضل اللہ کہتا ہے اس کا «باب الساعات» ایک پیتل کی پانی گھڑی کے نام پر رکھا گیا۔"
    sources: [source/salabi-umayyad-state-2020, source/umari-masalik-1924]
