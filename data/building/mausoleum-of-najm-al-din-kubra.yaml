summary:
  ar: "بطاقة أولية لضريح منسوب إلى نجم الدين الكبرى في موقع المدينة القديمة تاش كاله قرب كاهنة قره — المؤسس الصوفي التجسيدي؛ ثلاثة نقوش مسجلة في قاموس النقوش الإسلامية، منها نص قبري سنة ٧٣٤هـ."
  en: "Draft card for a mausoleum attributed to the Kubrawi master Najm al-Din al-Kubra at the site of old Taš Kala near Kunya-Urgench — the attribution is that of the epigraphic record itself; three inscriptions recorded in the Islamic Epigraphy Thesaurus include a 734 AH / 1333-1334 CE funerary text."
  fr: "Notice provisoire : mausolée attribué au maître kubrawi Najm al-Din al-Kubra sur le site de l’ancienne Taš Kala près de Kunya-Urgench ; cette attribution est celle de la notice épigraphique elle-même. Trois inscriptions enregistrées dans l’Islamic Epigraphy Thesaurus comprennent un texte funéraire de 734 H / 1333-1334 ap. J.-C."
  es: "Boceto de ficha para un mausoleo atribuido al maestro kubrawi Najm al-Din al-Kubra en el sitio de la antigua Taš Kala cerca de Kunya-Urgench; la atribución es la del propio registro epigráfico; tres inscripciones registradas en el Tesauro de Epigrafía Islámica incluyen un texto funerario del año 734 AH / 1333-1334 CE."
  ur: "کُنیا اُرگینچ کے قریب پرانے طاؤ کلا کے مقام پر کبروی ماسٹر نجم الدین الکبری سے منسوب ایک مقبرے کے لیے ڈرافٹ کارڈ — انتساب خود ایپیگرافک ریکارڈ کا ہے۔ اسلامی ایپی گرافی تھیسورس میں درج تین نوشتہ جات میں 734ھ / 1333-1334 عیسوی کے جنازے کا متن شامل ہے۔"
