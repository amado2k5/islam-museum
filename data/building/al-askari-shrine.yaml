summary:
  ar: "العتبة العسكرية بسامراء، الضريح الذي يضم قبر علي الهادي والحسن العسكري؛ تروي «موسوعة العتبات» ⁦(قسم سامراء)⁩ عُمارة المقام: كسّا ناصر الدولة الحمداني الضريح سنة ٣٣٣هـ، وعمّر معز الدولة البويهي القبة والسرداب، وسيّج عضد الدولة الروضة سنة ٣٦٨هـ، ورمم الأمير أرسلان القبة سنة ٤٤٥هـ، وجدد بركياروق السلجوقي الأبواب سنة ٤٩٥هـ، وعمّر الناصر العباسي القبة والمآذن وكتب أسماء الأئمة الاثني عشر على نطاق العقد سنة ٦٠٦هـ، واستُكملت زخرفته في العهدين الجلائري والصفوي {cite:musawat-atabat}."
  en: "The al-Askari shrine at Samarra, holding the graves of Ali al-Hadi and Hasan al-Askari; the Mawsu'at al-Atabat (Samarra section) records its building history: Nasir al-Dawla the Hamdanid covered the grave in 333, Mu'izz al-Dawla the Buyid raised the dome and sirdab, Adud al-Dawla fenced the rawda in 368, Amir Arslan restored the dome in 445, Barkyaruq the Seljuk renewed the doors in 495, and the Abbasid al-Nasir rebuilt dome and minarets, inscribing the Twelve Imams' names on the arch ring in 606 — ornamentation continued under the Jalayirids and Safavids {cite:musawat-atabat}."
  fr: "Le sanctuaire al-Askari de Samarra abrite les tombes d’Ali al-Hadi et de Hasan al-Askari ; la Mawsu’at al-Atabat (section de Samarra) rapporte l’histoire de sa construction : le Hamdanide Nasir al-Dawla couvrit la tombe en 333, le Bouyide Mu’izz al-Dawla éleva la coupole et le sirdab, Adud al-Dawla clôtura la rawda en 368, l’émir Arslan restaura la coupole en 445, le Seldjoukide Barkyaruq renouvela les portes en 495 et l’Abbasside al-Nasir reconstruisit la coupole et les minarets, inscrivant les noms des douze imams sur la voussure en 606 — l’ornementation se poursuivit sous les Jalayirides et les Safavides {cite:musawat-atabat}."
  es: "El santuario de al-Askari en Samarra, que alberga las tumbas de Ali al-Hadi y Hasan al-Askari; el Mawsu'at al-Atabat (sección de Samarra) registra su historia de construcción: Nasir al-Dawla el Hamdaní cubrió la tumba en 333, Mu'izz al-Dawla el Buyí levantó la cúpula y el sirdab, Adud al-Dawla cercó la rawda en 368, Amir Arslan restauró la cúpula en 445, Barkyaruq el Seljuk renovó las puertas en 495, y el abasí al-Nasir reconstruyó la cúpula y los minaretes, inscribiendo los nombres de los Doce Imames en el anillo del arco en 606; la ornamentación continuó bajo los Jalayíridas y los Safávidas {cite:musawat-atabat}."
