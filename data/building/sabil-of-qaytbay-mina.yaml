summary:
  ar: "سبيل ملاصق لمسجد الخيف بمنى أمر به السلطان الأشرف قايتباي سنة 874هـ/1469م، بأربع واجهات من الرخام الأصفر في كل منها شباك، مثال نادر عند الحداد {cite:haddad-asbila-makka-madina-2004 p.42} {cite:haddad-asbila-makka-madina-2004 p.43} {cite:haddad-asbila-makka-madina-2004 p.50}."
  en: "A sabil adjoining Masjid al-Khayf at Mina, ordered by Sultan al-Ashraf Qaytbay in 874 AH / 1469, with four faces of yellow marble each pierced by a window, a rare example in al-Haddad's view {cite:haddad-asbila-makka-madina-2004 p.42} {cite:haddad-asbila-makka-madina-2004 p.43} {cite:haddad-asbila-makka-madina-2004 p.50}."
  fr: "Sabil accolé à al-Khayf, ordonné en 874 H/1469, quatre faces de marbre jaune à fenêtre, rare exemple selon al-Haddad. {cite:haddad-asbila-makka-madina-2004 p.42} {cite:haddad-asbila-makka-madina-2004 p.43} {cite:haddad-asbila-makka-madina-2004 p.50}"
  es: "Un sabil contiguo a la Masjid al-Khayf en Mina, encargado por el sultán al-Ashraf Qaytbay en 874 d. H./1469, con cuatro caras de mármol amarillo, cada una atravesada por una ventana, es un raro ejemplo en opinión de al-Haddad. {cita:haddad-asbila-makka-medina-2004 p.43} {cita:haddad-asbila-makka-medina-2004 p.50}."
  ur: "منیٰ میں مسجد الخیف سے متصل ایک سبیل، جس کا حکم سلطان الاشرف قطبی نے 874ھ/1469 میں دیا تھا، جس میں پیلے رنگ کے سنگ مرمر کے چار چہرے تھے، جن میں سے ہر ایک کھڑکی سے سوراخ کیا گیا تھا، الحداد کی نظر میں ایک نادر مثال ہے۔ {حوالہ:حداد-اسبیلہ-مکہ-مدینہ-2004 صفحہ 43} {حوالہ:حداد-اسبیلہ-مکہ-مدینہ-2004 صفحہ 50}۔"
