summary:
  ar: "جامع ذو قبة مركزية على أربع دعامات في قلعة كيليا على الدانوب، بني بعد دخولها الحكم العثماني سنة 1484، حُوّل كنيسة أرثوذكسية مكرسة للعذراء سنة 1810، وغُيّرت عمارته في 1823–1825 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-2-2023 p. 824}."
