label:
  ar: جامع سليمية
  en: Selimiye Mosque, Edirne
summary:
  ar: "جامع السليمية مجمع مسجدي سلطاني بناه سنان في أدرنة للسلطان سليم الثاني، وتؤرخه دائرة المعارف الإسلامية بسنة 982هـ/1574م. تعدّه تحفة سنان الأخيرة وذروة العمارة العثمانية الناضجة، وقطر قبته 31.28 متراً وهي أكبر القباب المركزية العثمانية، وحولها أربع مآذن بارتفاع 70.89 متراً. وهو مع مدرسته ودار قرائه ومكتبته وسوق الأراستا كلّ معماري واحد."
  en: "The Selimiye is the imperial mosque complex that Sinan built at Edirne for Sultan Selim II; the Encyclopaedia of Islam dates it to 982/1574. It calls the building Sinan's final masterpiece and the climax of mature Ottoman architecture, with the largest Ottoman central dome, 31.28 metres across, and four minarets 70.89 metres high. It forms one architectural whole with its medrese, reciters' house, library and the Arasta market that supported it."
  ur: "سلیمیہ ایک شاہی مسجدی مجموعہ ہے جو سنان نے ادرنہ میں سلطان سلیم دوم کے لیے بنایا؛ دائرۃ المعارف اسلامیہ اس کی تاریخ 982ھ/1574ء بتاتی ہے۔ وہ اسے سنان کا آخری شاہکار اور پختہ عثمانی فن تعمیر کی چوٹی کہتی ہے، جس کا گنبد 31.28 میٹر قطر کے ساتھ عثمانی مرکزی گنبدوں میں سب سے بڑا ہے اور چار مینار 70.89 میٹر بلند ہیں۔ یہ اپنے مدرسے، دار القراء، کتب خانے اور اراستہ بازار کے ساتھ ایک ہی تعمیراتی اکائی ہے۔"
