  tr: "Şiraz'daki Nasir al-Mulk Camii'nin ön kartı; on dokuzuncu yüzyılın sonlarında inşa edilen, Pembe Camii olarak bilinen renkli Kaçar Camii'nin ön kartı; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Nasir al-Mulk di Shiraz, masjid Qajar yang penuh warna dan terkenal sebagai Masjid Merah Muda, dibangun pada akhir abad kesembilan belas; sumber-sumbernya di halaman tersebut belum ditinjau."
