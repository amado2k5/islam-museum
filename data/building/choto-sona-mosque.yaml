summary:
  ar: "مسجد مستطيل من الحجر في فيروزپور جنوب غور، سمي «الذهبي» لما كان عليه من التذهيب، ينسب إلى ولي محمد في عهد حسين شاه ⁦(899–925هـ/1493–1519)⁩، برواق أوسط تغطيه سقوف چو چالا وجناحين بست قباب لكل منهما {c(160)} {c(161)} {c(162)}."
  en: "An oblong stone mosque in Firuzpur, the southernmost quarter of Gaur, called 'golden' from its gilding, ascribed to Wali Muhammad in the reign of Husain Shah (AH 899-925/1493-1519), with a central nave under chau-chala roofs and two wings of six domes each {c(160)} {c(161)} {c(162)}."
  ur: "گوڑ کے جنوبی ترین محلے فیروز پور میں پتھر کی مستطیل مسجد، سنہری کام کی وجہ سے «سونا» کہلائی؛ حسین شاہ کے عہد (899–925ھ/1493–1519) میں ولی محمد سے منسوب؛ مرکزی ایوان پر چو چالا چھتیں اور دونوں بازوؤں پر چھ چھ گنبد {c(160)}۔"
