summary:
  ar: "بطاقة أولية لجامع فيروز آغا بإسطنبول، الجامع الصغير الذي بناه مدير خزانة بايزيد الثاني سنة ١٤٩١م قرب آيا صوفيا؛ من معالم العمارة العثمانية الباكرة ولم تُراجع الصفحة بعد."
  en: "Draft card for the Firuz Aga Mosque of Istanbul, the small mosque built by Bayezid II's treasurer near Hagia Sophia in 1491; an early Ottoman landmark per the cited survey, the page not yet checked."
  fr: "Ébauche de notice pour la mosquée Firuz Ağa d’Istanbul, petite mosquée construite en 1491 par le trésorier de Bayezid II près de Sainte-Sophie ; monument ottoman ancien selon l’étude citée, page non encore vérifiée."
  es: "Boceto para la Mezquita Firuz Aga de Estambul, la pequeña mezquita construida por el tesorero de Bayezid II cerca de Santa Sofía en 1491; un hito otomano temprano según el estudio citado, página aún no verificada."
  ur: "استنبول کی فیروز آغا مسجد کے لیے ڈرافٹ کارڈ، 1491 میں ہاگیا صوفیہ کے قریب بایزید ثانی کے خزانچی کی طرف سے بنائی گئی چھوٹی مسجد؛ حوالہ کردہ سروے کے مطابق ایک ابتدائی عثمانی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
