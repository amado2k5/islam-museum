summary:
  ar: "آيا صوفيا إزنيق؛ أهم أثر بيزنطي باقٍ في نيقية، حُوّل مسجداً بعد الفتح التركي وهو اليوم موقع أثري {cite:freely-ottoman-architecture-2011 p.55}."
  en: "Hagia Sophia of Iznik, the most important surviving Byzantine monument of Nicaea, converted to a mosque after the Turkish conquest and now an archaeological site {cite:freely-ottoman-architecture-2011 p.55}."
  fr: "Sainte-Sophie d’Iznik, principal monument byzantin subsistant de Nicée, transformée en mosquée après la conquête turque et aujourd’hui site archéologique {cite:freely-ottoman-architecture-2011 p.55}."
  es: "Santa Sofía de Iznik, el monumento bizantino más importante que se conserva de Nicea, convertido en mezquita tras la conquista turca y ahora un yacimiento arqueológico {cite:freely-ottoman-architecture-2011 p.55}."
  ur: "ازنک کی ہاگیا صوفیہ، جو کہ نِیسیا کی سب سے اہم زندہ بچ جانے والی بازنطینی یادگار ہے، جو ترکی کی فتح کے بعد ایک مسجد میں تبدیل ہو گئی اور اب ایک آثار قدیمہ کی جگہ ہے"
  tr: "Ayasofya İznik; Türk fethi sonrası bir caminin çevresinde bulunan İznik'teki en önemli Bizans anıtı; bugün arkeolojik bir alan {cite:freely-ottoman-architecture-2011 s.55}."
  id: "Hagia Sophia Iznik; monumen Bizantium terpenting yang masih ada di Nicaea, di sekitar sebuah masjid setelah penaklukan Turki, yang kini menjadi situs arkeologi {cite:freely-ottoman-architecture-2011 hlm.55}."
