summary:
  ar: "تكية وضريح للولي آق يازيلي سلطان في قرية أوبروتشيشته قرب بالتشيك على البحر الأسود في بلغاريا، تُنسب إلى غازي ميخال أوغلو أرسلان بك في القرن الخامس عشر، ووصفها أوليا چلبي سنة 1652، وجُعلت بعد خروج العثمانيين مقام القديس أثناسيوس {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
  en: "The lodge and tomb of the saint Akyazılı Sultan at Obrochishte near Balchik on the Bulgarian Black Sea coast, ascribed to Gazi Mihaloğlu Arslan Bey in the fifteenth century, described by Evliya Çelebi in 1652, and made a shrine of St Athanasius after Ottoman rule ended {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
  ur: "بلغاریہ میں بحیرۂ اسود کے کنارے بالچک کے قریب گاؤں اوبروچیشتے میں ولی آق یازیلی سلطان کا تکیہ و مزار، پندرھویں صدی میں غازی میخال اوغلو ارسلان بے سے منسوب، 1652ء میں اولیا چلبی نے بیان کیا؛ عثمانی دور کے بعد سینٹ اتھاناسیوس کا مقام بنا {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}۔"
