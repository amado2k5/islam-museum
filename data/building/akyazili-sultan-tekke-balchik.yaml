label: { ar: "تكية آق يازيلي سلطان قرب بالتشيك", en: "Akyazılı Sultan Tekke, near Balchik", fr: "Tekke d’Akyazılı Sultan, près de Balchik", ur: "آق یازیلی سلطان تکیہ، بالچک کے قریب", es: "Akyazılı Sultan Tekke, cerca de Balchik" }
summary:
  ar: "تكية وضريح للولي آق يازيلي سلطان في قرية أوبروتشيشته قرب بالتشيك على البحر الأسود في بلغاريا، تُنسب إلى غازي ميخال أوغلو أرسلان بك في القرن الخامس عشر، ووصفها أوليا چلبي سنة 1652، وجُعلت بعد خروج العثمانيين مقام القديس أثناسيوس {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
  en: "The lodge and tomb of the saint Akyazılı Sultan at Obrochishte near Balchik on the Bulgarian Black Sea coast, ascribed to Gazi Mihaloğlu Arslan Bey in the fifteenth century, described by Evliya Çelebi in 1652, and made a shrine of St Athanasius after Ottoman rule ended {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
  fr: "Le couvent et le tombeau du saint Akyazılı Sultan à Obrochishte, près de Balchik sur la côte bulgare de la mer Noire, attribués à Gazi Mihaloğlu Arslan Bey au XVe siècle, décrits par Evliya Çelebi en 1652 et transformés en sanctuaire de saint Athanase après la fin de la domination ottomane {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
  ur: "بلغاریہ میں بحیرۂ اسود کے کنارے بالچک کے قریب گاؤں اوبروچیشتے میں ولی آق یازیلی سلطان کا تکیہ و مزار، پندرھویں صدی میں غازی میخال اوغلو ارسلان بے سے منسوب، 1652ء میں اولیا چلبی نے بیان کیا؛ عثمانی دور کے بعد سینٹ اتھاناسیوس کا مقام بنا {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}۔"
  es: "La logia y la tumba del santo Sultán Akyazılı en Obrochishte, cerca de Balchik, en la costa búlgara del Mar Negro, atribuidas a Gazi Mihaloğlu Arslan Bey en el siglo XV, descritas por Evliya Çelebi en 1652 y convertidas en un santuario de San Atanasio después de que terminó el dominio otomano. {citar:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 64} {citar:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 65}."
