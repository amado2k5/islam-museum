summary:
  ar: "بطاقة أولية لجامع قلج علي باشا بطوبهانة في إسطنبول، الذي أتمه المعمار سنان للأميرال قلج علي باشا سنة ١٥٨٠م؛ من عيون العمارة العثمانية الكلاسيكية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Kilic Ali Pasha Mosque at Tophane, Istanbul, completed by Sinan for the admiral in 1580; a landmark of classical Ottoman architecture per the cited survey, the page not yet checked."
  fr: "Notice provisoire de la mosquée Kılıç Ali Pasha à Tophane, Istanbul, achevée par Sinan pour l’amiral en 1580 ; repère de l’architecture ottomane classique selon l’étude citée, dont la page n’a pas encore été vérifiée."
  es: "Boceto de la mezquita Kilic Ali Pasha en Tophane, Estambul, terminada por Sinan para el almirante en 1580; un hito de la arquitectura otomana clásica según el estudio citado, página aún no verificada."
  ur: "توفانے، استنبول میں کلیک علی پاشا مسجد کے لیے ڈرافٹ کارڈ، سنان نے ایڈمرل کے لیے 1580 میں مکمل کیا۔ حوالہ کردہ سروے کے مطابق کلاسیکی عثمانی فن تعمیر کا ایک تاریخی نشان، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
  tr: "İstanbul'un Tubhane kentindeki Kılıç Ali Paşa Camii'nin ön kartı, Tınanım tarafından Amiral Kılıç Ali Paşa tarafından 1580 yılında tamamlanmıştır; klasik Osmanlı mimarisi açısından sayfa henüz incelenmemiştir."
  id: "Kartu awal Masjid Kılıç Ali Pasha di Tubhane, Istanbul, yang diselesaikan oleh Tınanım oleh Laksamana Kılıç Ali Pasha pada tahun 1580 M; dari sudut pandang arsitektur klasik Ottoman, halaman ini belum pernah ditinjau."
