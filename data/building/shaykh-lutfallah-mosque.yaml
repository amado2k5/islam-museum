  tr: "Şah Abbas'ın İsfahan Özel Camii (1619) — Minaresi olmayan, gündüz ışığıyla renklendirilen kubbe; Safevi mimarisinin en güzel örneği."
  id: "Masjid Pribadi Isfahan oleh Shah Abbas (1619) — Sebuah kubah tanpa menara yang mewarnai cahaya matahari; contoh terbaik arsitektur Safavid."
