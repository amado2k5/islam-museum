summary:
  ar: "ضريح مربع للصوفي الشطاري محمد غوث ⁦(ت 970هـ/1562)⁩ في غواليور، بأبراج سداسية في أركانه ورواق من المشبكات حول قاعته وقبة على رقبة مربعة بين الچهتريات، يؤرخه ناث بنحو 1565 ويرجح أن بانيه تلميذه الموسيقي تانسين {cite:nath-history-of-mughal-architecture-1-1982 p. 218} {cite:nath-history-of-mughal-architecture-1-1982 p. 219} {cite:nath-history-of-mughal-architecture-1-1982 p. 223}."
  en: "The square tomb of the Shattari Sufi Muhammad Ghawth (d. AH 970/1562) at Gwalior, with hexagonal corner towers, a jali-screened verandah round its hall and a dome on a square drum amid chhatris, dated by Nath to about 1565 and attributed by him to the saint's disciple, the musician Tansen {cite:nath-history-of-mughal-architecture-1-1982 p. 218} {cite:nath-history-of-mughal-architecture-1-1982 p. 219} {cite:nath-history-of-mughal-architecture-1-1982 p. 223}."
  ur: "گوالیار میں شطاری صوفی محمد غوث ⁦(وفات 970ھ/1562)⁩ کا مربع مقبرہ، کونوں پر شش پہلو برج، ہال کے گرد جالی دار برآمدہ اور چھتریوں کے بیچ مربع گردن پر گنبد؛ ناتھ اسے تقریباً 1565ء کا بتاتے اور بانی ان کے مرید موسیقار تان سین کو قرار دیتے ہیں {cite:nath-history-of-mughal-architecture-1-1982 p. 223}۔"
