summary:
  ar: "بطاقة أولية لمنارة الملوية في جامع سامراء الكبير، المئذنة الحلزونية التي بناها المعتصم في القرن التاسع؛ من أشهر معالم العمارة العباسية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Malwiya Minaret of the Great Mosque of Samarra, the spiral minaret built by al-Mu'tasim in the ninth century; among the most famous monuments of Abbasid architecture per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Minaret Malwiya, Grande Mosquée de Samarra, minaret hélicoïdal bâti par al-Mu’tasim au IXe siècle ; l’un des monuments les plus célèbres de l’architecture abbasside selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha del minarete de Malwiya de la Gran Mezquita de Samarra, el minarete en espiral construido por al-Mu'tasim en el siglo IX; uno de los monumentos más famosos de la arquitectura abasí según la enciclopedia citada, página aún no revisada."
  ur: "سمارا کی عظیم مسجد کے مالویہ مینار کے لیے ڈرافٹ کارڈ، نویں صدی میں المعتصم کی طرف سے تعمیر کردہ سرپل مینار؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق عباسی فن تعمیر کی سب سے مشہور یادگاروں میں سے، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
