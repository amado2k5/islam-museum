summary:
  ar: "قصر الباشا في قلب غزة القديمة، قصر الحكم العثماني الوحيد الباقي في المدينة. نشأ حوالي ١٧٤٠-١٧٨٠م مقراً للوالي وبوابته تحفظ شارة مملوكية؛ استُخدم لاحقاً سجناً ثم متحفاً للمدينة، وتضرر في حرب غزة وأُدرج في مراقبة الآثار العالمية ٢٠٢٥ {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
  en: "Qasr al-Basha in the heart of old Gaza, the city’s surviving Ottoman governor’s palace. Built around 1740-1780 as a governor’s residence, its gate bearing a Mamluk emblem; later a prison, then Gaza’s museum. It was damaged in the Gaza war — a loss verified by UNESCO’s satellite assessment — and inscribed on the 2025 World Monuments Watch {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
  ur: "قدیم غزہ کے قلب میں قصر الباشا، شہر کا بچا ہوا عثمانی گورنر محل۔ تقریباً 1740-1780ء میں گورنر کی رہائش گاہ کے طور پر بنا، اس کی باب پر مملوک نشان محفوظ ہے؛ بعد میں جیل، پھر غزہ کا میوزیم رہا۔ غزہ جنگ میں متاثر ہوا — یونیسکو کی سیٹلائٹ جائزہ نے تصدیق کی — اور 2025 ورلڈ منیومنٹس واچ میں شامل ہوا {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}۔"
  fr: "Qasr al-Basha au cœur de la vieille Gaza, le palais de gouverneur ottoman subsistant de la ville. Construit vers 1740-1780 comme résidence du gouverneur, sa porte porte un emblème mamelouk ; puis prison, puis musée de Gaza. Endommagé pendant la guerre de Gaza — perte vérifiée par l’évaluation satellitaire de l’UNESCO — il figure au World Monuments Watch 2025 {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
  es: "Qasr al-Basha en el corazón del casco antiguo de Gaza, el palacio de gobernador otomano superviviente de la ciudad. Construido hacia 1740-1780 como residencia del gobernador, con un emblema mameluco en su puerta; luego cárcel y después museo de Gaza. Resultó dañado en la guerra de Gaza — pérdida verificada por la evaluación satelital de la UNESCO — e inscrito en el World Monuments Watch 2025 {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
  tr: "Eski Gazze’nin merkezindeki Kasr el-Başa, kentin ayakta kalan Osmanlı vali sarayı. 1740-1780 dolaylarında vali konutu olarak yapıldı; kapısında Memlük arması taşır; sonra hapishane, ardından Gazze müzesi oldu. Gazze savaşında hasar gördü — UNESCO’nun uydu değerlendirmesiyle doğrulandı — ve 2025 Dünya Anıtlar İzleme listesine girdi {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
  id: "Qasr al-Basha di jantung Gaza tua, istana gubernur Utsmaniyah yang masih tersisa di kota itu. Dibangun sekitar 1740-1780 sebagai kediaman gubernur, dengan lambang Mamluk pada gerbangnya; kemudian penjara, lalu museum Gaza. Rusak dalam perang Gaza — terverifikasi oleh penilaian satelit UNESCO — dan masuk World Monuments Watch 2025 {cite:aldohdar-pasha-palace-2020}{cite:cnrs-gaza-histoire}{cite:unesco-gaza-assessment}{cite:wmf-gaza-watch-2025}."
