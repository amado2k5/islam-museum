label: { ar: "قبة المظالم للمهتدي", en: "Dome of Redress of al-Muhtadi", fr: "Coupole des plaintes d’al-Muhtadi", es: "Cúpula de la Reparación de al-Muhtadi", ur: "المحتدی کا گنبد", tr: "Dönenler için Şikayetler Kubbesi.", id: "Kubah Keluhan untuk yang Bertobat." }
summary:
  ar: "قبة المظالم قبة بناها الخليفة المهتدي ⁦(٢٥٥-٢٥٦هـ)⁩ لها أربعة أبواب، كان يجلس فيها للعام والخاص للنظر في المظالم، وذلك ضمن برنامجه الإصلاحي الذي بدأه بنفسه حين تجرد من أبهة الحياة وزخرفها وأمر بالمعروف ونهى عن المنكر وحضر كل جمعة إلى المسجد الجامع فيخطب بالناس ويؤمهم وأشرف على الدواوين؛ وثقلت وطأته على العامة والخاصة حتى اعتراهم الضجر {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  en: "al-Muhtadi's Dome of Redress — the four-doored dome he built at Samarra where he sat for commoner and notable alike to hear petitions of injustice, part of his austere reform programme in 255-256 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  fr: "Coupole à quatre portes de Samarra où al-Muhtadi entendait les plaintes de tous, peuple et notables, dans son programme austère de réformes de 255–256 H. {cite:tarikh-dawla-abbasiyya-taqqush p. 166}"
  es: "La Cúpula de la Reparación de al-Muhtadi: la cúpula de cuatro puertas que construyó en Samarra, donde se sentaba para que tanto plebeyos como notables escucharan peticiones de injusticia, como parte de su austero programa de reformas en 255-256 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  ur: "المحتدی کا گنبد ازالہ - وہ چار دروازوں والا گنبد جو اس نے سامرا میں بنایا تھا جہاں وہ ناانصافی کی درخواستیں سننے کے لیے عام اور قابل ذکر لوگوں کے لیے بیٹھا تھا، 255-256 ہجری میں اس کے سخت اصلاحی پروگرام کا حصہ تھا۔ 166}۔"
  tr: "Şikayetler Kubbesi, Halife al-Muhtadi (255-256 H) tarafından inşa edilmiş, dört kapılı bir kubbedir ve hem halkın hem de seçkinlerin şikayetlerini burada değerlendirirdi. Bu, kendisinin başlattığı reform programının bir parçasıydı; hayatın ihtişamı ve süsünü elinden çıkardı, iyiliği ve kötülüğü yasakladı, her Cuma Mescid'e gidip halka vaaz etti, namaz kıldı ve diwanları gözetledi. Hem halk hem de seçkinler üzerindeki yükü o kadar ağırlaştı ki, onlar yoruldular {cite:Tarikh-dawla-abbasiyya-taqqush s. 166}."
  id: "Kubah Keluhan adalah kubah yang dibangun oleh Khalifah al-Muhtadi (255-256 H) dengan empat pintu, tempat publik dan elit duduk untuk mempertimbangkan keluhan. Ini adalah bagian dari program reformasinya yang ia mulai sendiri ketika ia melepaskan kemegahan dan hiasan hidup, memerintah kebaikan dan melarang kejahatan, menghadiri Masjid Agung setiap Jumat untuk berkhotbah kepada orang-orang, memimpin doa, dan mengawasi para diwan. Bebannya pada publik dan elit menjadi begitu berat sehingga mereka menjadi lelah {cite:Tarikh-dawla-abbasiyya-taqqush hlm. 166}."
