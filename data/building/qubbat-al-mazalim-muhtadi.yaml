summary:
  ar: "قبة المظالم قبة بناها الخليفة المهتدي (٢٥٥-٢٥٦هـ) لها أربعة أبواب، كان يجلس فيها للعام والخاص للنظر في المظالم، وذلك ضمن برنامجه الإصلاحي الذي بدأه بنفسه حين تجرد من أبهة الحياة وزخرفها وأمر بالمعروف ونهى عن المنكر وحضر كل جمعة إلى المسجد الجامع فيخطب بالناس ويؤمهم وأشرف على الدواوين؛ وثقلت وطأته على العامة والخاصة حتى اعتراهم الضجر {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
  en: "al-Muhtadi's Dome of Redress — the four-doored dome he built at Samarra where he sat for commoner and notable alike to hear petitions of injustice, part of his austere reform programme in 255-256 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 166}."
