  es: "Ficha de referencia para Masjid al-Abbasa, una mezquita histórica en la gobernación de Abu Arish, Jazan, documentada en el atlas saudí de mezquitas históricas; sus fuentes aún no han sido verificadas en la página."
  ur: "ابو عریش گورنری، جازان کی ایک تاریخی مسجد، مسجد العباسہ کے لیے ڈرافٹ کارڈ، تاریخی مساجد کے سعودی اٹلس میں دستاویزی؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Cazan'daki Abu Ariş Vilayeti'nde tarihi bir cami olan El-Abbasa Camii için ön kart, Tarihi Camiler Atlası'nda belgelenmiştir; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Al-Abbasa, sebuah masjid bersejarah di Gubernur Abu Arish di Jazan, didokumentasikan dalam Atlas Masjid Bersejarah; sumber-sumbernya di halaman tersebut belum ditinjau."
