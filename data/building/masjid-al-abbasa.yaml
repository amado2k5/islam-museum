summary:
  ar: "بطاقة أولية لمسجد العباسة، مسجد تاريخي في محافظة أبو عريش بجازان، موثق في أطلس المساجد التاريخية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Masjid al-Abbasa, a historic mosque in Abu Arish governorate, Jazan, documented in the Saudi atlas of historic mosques; its sources are not yet checked on the page."
