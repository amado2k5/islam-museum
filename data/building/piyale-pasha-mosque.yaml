  tr: "İstanbul'daki Kasım Paşa Camii, filonun komutanı Mehmed Paşa'nın piyalası için 1573 yılında inşa edilmiştir; çok kubbeli Büyük Camii tarzına dönüşüyle benzersizdir."
  id: "Masjid Kasım Pasha di Istanbul dibangun pada tahun 1573 M untuk piyala Mehmed Pasha, komandan armada; masjid ini unik karena kembali ke gaya Masjid Agung dengan beberapa kubah."
