summary:
  ar: "خان ضخم بناه سنان 1560–1561م لرستم باشا صهر سليمان؛ جناحان: «الخان الكبير» مخزن تجار بثلاث وسبعين غرفة و«الخان الصغير» نزل مسافرين."
  en: "Sinan's vast 1560–1 han for Süleyman's grand vezir and son-in-law Rüstem Pasha: the 73-room Büyük Han warehouse plus the Küçük Han travellers' hospice, both two-storeyed around porticoed courts."
  fr: "Vaste han de Sinan de 1560–1561 pour le grand vizir et gendre de Soliman : entrepôt Büyük Han de 73 pièces et hospice Küçük Han, deux niveaux autour de cours à portiques."
  es: "El vasto han que Sinan construyó entre 1560 y 1561 para el gran vezir y yerno de Süleyman, Rüstem Pasha: el almacén Büyük Han de 73 habitaciones, además del hospicio para viajeros Küçük Han, ambos de dos plantas alrededor de patios con pórticos."
  ur: "سلیمان کے عظیم وزیر اور داماد رستم پاشا کے لیے سنان کا وسیع 1560–1 ہان: 73 کمروں پر مشتمل بیوک ہان گودام کے علاوہ کوک ہان مسافروں کی ہاسپیس، دونوں پورٹیکوڈ کورٹس کے ارد گرد دو منزلہ ہیں۔"
  tr: "Sinan tarafından 1560–1561 yılları arasında Süleyman'ın damadı Rustam Paşa için inşa edilen büyük bir han; iki kanat: 'Büyük Han', yetmiş üç odalı tüccar deposu ve 'Küçük Han', bir gezgin kulübesi."
  id: "Sebuah penginapan besar yang dibangun oleh Sinan antara tahun 1560–1561 M untuk Rustam Pasha, menantu Suleiman; dua sayap: 'Great Khan,' gudang pedagang dengan tujuh puluh tiga kamar, dan 'Small Khan,' pondok para pelancong."
