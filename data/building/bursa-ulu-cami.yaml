  fr: "La Grande Mosquée de Bursa, Ulu Cami ; construite par Bayezid Ier en 1396-1399 ap. J.-C., parmi les plus grandes mosquées anatoliennes de son époque, avec sa salle de prière à multiples coupoles {cite:freely-ottoman-architecture-2011}."
  es: "La Gran Mezquita de Bursa (Ulu Cami); construida por Bayezid I entre 1396 y 1399 d. C., es una de las mezquitas más grandes de Anatolia de su época, con su sala de oración de múltiples cúpulas {cite:freely-ottoman-architecture-2011}."
  ur: "برسا گرینڈ مسجد ⁦(اولو کامی)⁩؛ بایزید اول نے 1396-1399 عیسوی میں تعمیر کیا، اپنے دور کی عظیم ترین اناطولیہ مساجد میں سے اس کے کئی گنبد والے عبادت گاہ کے ساتھ"
