  ar: "الجامع الكبير ⁦(أولو جامع)⁩ ببورصة؛ بناه بايزيد الأول في السنوات 1396-1399م، وهو من أعظم المساجد الأناضولية في عصره بقاعته المصلاة ذات القباب {cite:freely-ottoman-architecture-2011}."
