summary:
  ar: "بناه سنة 1548م غازي سليمان باشا وزير سليمان القانوني؛ مربع مقبب ومنارته المفقودة ورواقه الثلاثي بقي منه الأعمدة والعقود."
  en: "Built 1548 by Gazi Süleyman Pasha, a vezir of Süleyman the Magnificent; domed-square mosque whose minaret has vanished, leaving the porch's red-and-white voussoired columns and arches."
  fr: "Fondation de Gazi Süleyman Pacha, vizir de Soliman, en 1548 ; salle carrée à coupole, minaret disparu, colonnes et arcs rouges et blancs du porche conservés."
  es: "Construida en 1548 por Gazi Süleyman Pasha, un lugarteniente de Solimán el Magnífico; mezquita cuadrada con cúpula cuyo minarete ha desaparecido, dejando en pie las columnas y arcos con dovelas rojas y blancas del pórtico."
  ur: "غازی سلیمان پاشا کے ذریعہ 1548 میں تعمیر کیا گیا، جو سلیمان دی میگنیفیشنٹ کے ایک وزیر ہے۔ گنبد والی مربع مسجد جس کا مینار غائب ہو گیا ہے، برآمدے کے سرخ اور سفید رنگ کے کالم اور محراب کو چھوڑ کر۔"
  tr: "1548 yılında Süleyman Müstefaze'nin bakanı Gazi Süleyman Paşa tarafından inşa edilmiştir; kubbeli bir meydan, eksik minaresi ve sütunları ile kemerleri kalan üçgen revandır."
  id: "Bangunan ini dibangun pada tahun 1548 M oleh Gazi Suleiman Pasha, menteri Suleiman yang Agung; bangunan ini berbentuk persegi berkubah, menara yang hilang, dan portiko segitiga yang kolom dan lengkungannya masih tersisa."
