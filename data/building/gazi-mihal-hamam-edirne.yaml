summary:
  ar: "أقدم حمام في أدرنة، مؤرخ بنقش سنة 1406م، بناه غازي مهال النبيل اليوناني المتحول للإسلام عند جسره على تونجة؛ اليوم خراب."
  en: "Edirne's oldest hamam, inscription-dated 1406, built by the converted Greek nobleman Gazi Mihal at the east approach of his Tunca bridge; now a ruin."
  fr: "Plus ancien hammam d’Edirne, daté par inscription de 1406, construit par le noble grec converti Gazi Mihal à l’approche orientale de son pont sur la Tunca ; aujourd’hui ruiné."
  es: "El hammam más antiguo de Edirne, fechado en 1406 según una inscripción, fue construido por el noble griego converso Gazi Mihal en el acceso oriental de su puente de Tunca; actualmente está en ruinas."
  ur: "ایڈرن کا قدیم ترین حمام، نوشتہ تاریخ 1406، جسے تبدیل شدہ یونانی رئیس غازی میہل نے اپنے ٹنکا پل کے مشرقی نقطہ نظر پر بنایا تھا۔ اب ایک کھنڈر."
  tr: "Edirne'deki en eski hamam, 1406 yılına tarihlenmiştir ve İslam'a geçen Yunan soylusu Gazi Mahal tarafından Tonca üzerindeki köprüsünde inşa edilmiştir; bugün harabe halindedir."
  id: "Pemandian tertua di Edirne, yang diperkirakan berasal dari tahun 1406 M, dibangun oleh Gazi Mahal, bangsawan Yunani yang memeluk Islam, di jembatannya di atas Tonca; saat ini bangunan tersebut telah hancur."
