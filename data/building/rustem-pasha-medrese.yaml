summary:
  ar: "مدرسة صممها سنان لرستم باشا على منحدر التل الثاني نحو القرن الذهبي، أُتمت سنة 1550–1551م؛ فريدة التخطيط بصحن ثماني الأضلاع تلفّه أربع وعشرون قبة."
  en: "A medrese designed by Sinan for Rüstem Pasha on the slope of the Second Hill toward the Golden Horn, completed 1550–1; unique plan with an octagonal domed courtyard of twenty-four bays."
  fr: "Collège de Sinan pour Rüstem Pacha sur la deuxième colline vers la Corne d’Or, achevé en 1550–1551 ; cour octogonale unique, portique de vingt-quatre travées à coupoles."
  es: "Una madraza diseñada por Sinan para Rüstem Pasha en la ladera de la Segunda Colina, en dirección al Cuerno de Oro, terminada entre 1550 y 1551; de planta singular con un patio octogonal abovedado de veinticuatro tramos."
  ur: "سنان کی طرف سے گولڈن ہارن کی طرف دوسری پہاڑی کی ڈھلوان پر رستم پاشا کے لیے ڈیزائن کیا گیا ایک میڈریس، 1550-1 میں مکمل ہوا۔ چوبیس خلیجوں کے آکٹونل گنبد والے صحن کے ساتھ منفرد منصوبہ۔"
  tr: "Sinan tarafından Rustam Paşa için ikinci höyüğün Altın Boynuz'a doğru yamaçlarında tasarlanan bir okul, 1550–1551 yılları arasında tamamlanmıştır; sekizgen avlusuyla ve yirmi dört kubbeyle çevrili benzersizdir."
  id: "Sebuah sekolah yang dirancang oleh Sinan untuk Rustam Pasha di lereng gundukan kedua menuju Tanduk Emas, selesai dibangun pada tahun 1550–1551 M; unik dalam tata letak dengan halaman segi delapan yang dikelilingi oleh dua puluh empat kubah."
