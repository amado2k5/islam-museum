summary:
  ar: "باب القاهرة الفاطمية الشمالي، بُني في تجديد بدر الجمالي لأسوارها بالحجر بين 1087 و1092م، ببرجين مستطيلين وكتابة كوفية للشهادة على الطريقة الشيعية {cite:yeomans-islamic-cairo-2006 p.46} {cite:yeomans-islamic-cairo-2006 p.47}."
  en: "Northern gate of Fatimid Cairo, built in Badr al-Jamali's stone rebuilding of the walls in 1087-1092, with two rectangular towers and a Kufic inscription of the Shi'i profession of faith {cite:yeomans-islamic-cairo-2006 p.46} {cite:yeomans-islamic-cairo-2006 p.47}."
  fr: "Porte nord du Caire fatimide, construite lors de la reconstruction en pierre des murailles par Badr al-Jamali en 1087-1092, avec deux tours rectangulaires et une inscription coufique de la profession de foi chiite {cite:yeomans-islamic-cairo-2006 p.46} {cite:yeomans-islamic-cairo-2006 p.47}."
  es: "Puerta norte del Cairo fatimí, construida en la reconstrucción de piedra de las murallas por Badr al-Jamali en 1087-1092, con dos torres rectangulares y una inscripción cúfica de la profesión de fe chiíta {cite:yeomans-islamic-cairo-2006 p.46} {cite:yeomans-islamic-cairo-2006 p.47}."
  ur: "فاطمی قاہرہ کا شمالی دروازہ، جو 1087-1092 میں بدر الجمالی کے پتھر کی دیواروں کی تعمیر نو میں تعمیر کیا گیا تھا، جس میں دو مستطیل برج اور شیعہ مسلک کا ایک کوفی لکھا ہوا تھا۔ {حوالہ:یومانس-اسلامی-قاہرہ-2006 صفحہ 47}۔"
