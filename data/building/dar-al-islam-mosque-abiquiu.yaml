summary:
  ar: "مسجد بناه المعماري المصري حسن فتحي سنة 1981 في أبيكيو بنيو مكسيكو بالبناء الترابي الذي استعمله في القرنة الجديدة، بقبة وأقبية وعقود مدببة، يرتاده أكثر المسلمين المولودين في أمريكا {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
  en: "A mosque built in 1981 at Abiquiu, New Mexico, by the Egyptian architect Hassan Fathy in the earthen construction of his New Gourna, with dome, barrel vaults and pointed arches, used mainly by American-born Muslims {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
  ur: "ابیکیو، نیو میکسیکو میں مصری معمار حسن فتحی کی 1981ء میں بنائی ہوئی مسجد، نئے قرنہ والی مٹی کی تعمیر میں، گنبد، ڈاٹ دار چھتوں اور نوک دار محرابوں کے ساتھ، جہاں زیادہ تر امریکہ میں پیدا ہونے والے مسلمان آتے ہیں {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}۔"
