label: { ar: "مسجد دار الإسلام، أبيكيو ⁦(نيو مكسيكو)⁩", en: "Dar al-Islam Mosque, Abiquiu, New Mexico", fr: "Mosquée Dar al-Islam, Abiquiu, Nouveau-Mexique", ur: "دار الاسلام مسجد، ابیکیو، نیو میکسیکو", es: "Mezquita Dar al-Islam, Abiquiu, Nuevo México" }
summary:
  ar: "مسجد بناه المعماري المصري حسن فتحي سنة 1981 في أبيكيو بنيو مكسيكو بالبناء الترابي الذي استعمله في القرنة الجديدة، بقبة وأقبية وعقود مدببة، يرتاده أكثر المسلمين المولودين في أمريكا {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
  en: "A mosque built in 1981 at Abiquiu, New Mexico, by the Egyptian architect Hassan Fathy in the earthen construction of his New Gourna, with dome, barrel vaults and pointed arches, used mainly by American-born Muslims {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
  fr: "Mosquée construite en 1981 à Abiquiu, Nouveau-Mexique, par l’architecte égyptien Hassan Fathy selon les techniques de construction en terre de son New Gourna, avec coupole, voûtes en berceau et arcs brisés, fréquentée surtout par des musulmans nés aux États-Unis {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
  ur: "ابیکیو، نیو میکسیکو میں مصری معمار حسن فتحی کی 1981ء میں بنائی ہوئی مسجد، نئے قرنہ والی مٹی کی تعمیر میں، گنبد، ڈاٹ دار چھتوں اور نوک دار محرابوں کے ساتھ، جہاں زیادہ تر امریکہ میں پیدا ہونے والے مسلمان آتے ہیں {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}۔"
  es: "Una mezquita construida en 1981 en Abiquiu, Nuevo México, por el arquitecto egipcio Hassan Fathy en la construcción de tierra de su New Gourna, con cúpula, bóvedas de cañón y arcos apuntados, utilizada principalmente por musulmanes nacidos en Estados Unidos {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 20-21}."
