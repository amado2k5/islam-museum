label: { ar: "جامع درويش محمد باشا ⁦(الجامع الأسود)⁩ في صوفيا", en: "Mosque of Derviş Mehmed Pasha (Kara Cami), Sofia", fr: "Mosquée de Derviş Mehmed Pasha (Kara Cami), Sofia", ur: "درویش محمد پاشا مسجد ⁦(کالی مسجد)⁩، صوفیہ", es: "Mezquita de Derviş Mehmed Pasha (Kara Cami), Sofía", tr: "Sofya'daki Darwish Muhammed Paşa Camii (Kara Camii)", id: "Masjid Darwish Muhammad Pasha (Masjid Hitam) di Sofia" }
summary:
  ar: "جامع بناه الوزير البوسني درويش محمد باشا في حي العمارة بصوفيا ضمن مجمع وُقف سنة 954هـ/1547–1548، وهو بحسب تذاكر سنان مسجد المعمار سنان الوحيد في بلغاريا؛ غُيّر شكله سنة 1901 وصار كنيسة القديسين السبعة سنة 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  en: "The mosque of the Bosnian vizier Derviş Mehmed Pasha in the Imaret quarter of Sofia, centre of a complex endowed in AH 954/1547-48 and, by the lists of Sinan's works, the architect Sinan's only mosque in Bulgaria; recased in 1901 and opened as the Church of the Seven Saints in 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  fr: "Mosquée du vizir bosnien Derviş Mehmed Pasha dans le quartier d’Imaret à Sofia, centre d’un complexe doté en 954 H/1547-1548 et, d’après les listes des œuvres de Sinan, sa seule mosquée en Bulgarie ; rhabillée en 1901 et ouverte comme église des Sept-Saints en 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  ur: "صوفیہ کے محلہ عمارت میں بوسنیائی وزیر درویش محمد پاشا کی مسجد، 954ھ/1547–48ء میں وقف ہونے والے مجموعے کا مرکز، اور سنان کی فہرستوں کے مطابق بلغاریہ میں معمار سنان کی واحد مسجد؛ 1901ء میں ڈھانچا بدلا گیا اور 1903ء میں سات ولیوں کا گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}۔"
  es: "La mezquita del visir bosnio Derviş Mehmed Pasha en el barrio de Imaret de Sofía, centro de un complejo dotado en AH 954/1547-48 y, según las listas de obras de Sinan, la única mezquita del arquitecto Sinan en Bulgaria; revestida en 1901 e inaugurada como la Iglesia de los Siete Santos en 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  tr: "Camii, Bosnalı bakan Darviş Mehmet Paşa tarafından Sofya'nın Amara ilçesinde, 954 Hicri / 1547–1548 yıllarında karmaşık bir vakıf içinde inşa edilmiştir. Sinan belgelerine göre, Bulgaristan'daki tek Memar Sinan Camii'dir; 1901'de şeklini değiştirmiş ve 1903'te Yedi Azizler Kilisesi olmuştur {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 s. 135}."
  id: "Masjid ini dibangun oleh menteri Bosnia Darviş Mehmet Pasha di distrik Amara, Sofia, dalam sebuah wakaf kompleks pada tahun 954 H / 1547–1548 M. Menurut dokumen Sinan, ini adalah satu-satunya Masjid Memar Sinan di Bulgaria; bentuknya berubah pada tahun 1901 dan menjadi Gereja Tujuh Orang Kudus pada tahun 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 hlm. 135}."
