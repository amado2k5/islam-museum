label: { ar: "جامع درويش محمد باشا (الجامع الأسود) في صوفيا", en: "Mosque of Derviş Mehmed Pasha (Kara Cami), Sofia", ur: "درویش محمد پاشا مسجد (کالی مسجد)، صوفیہ" }
summary:
  ar: "جامع بناه الوزير البوسني درويش محمد باشا في حي العمارة بصوفيا ضمن مجمع وُقف سنة 954هـ/1547–1548، وهو بحسب تذاكر سنان مسجد المعمار سنان الوحيد في بلغاريا؛ غُيّر شكله سنة 1901 وصار كنيسة القديسين السبعة سنة 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  en: "The mosque of the Bosnian vizier Derviş Mehmed Pasha in the Imaret quarter of Sofia, centre of a complex endowed in AH 954/1547-48 and, by the lists of Sinan's works, the architect Sinan's only mosque in Bulgaria; recased in 1901 and opened as the Church of the Seven Saints in 1903 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 134} {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}."
  ur: "صوفیہ کے محلہ عمارت میں بوسنیائی وزیر درویش محمد پاشا کی مسجد، 954ھ/1547–48ء میں وقف ہونے والے مجموعے کا مرکز، اور سنان کی فہرستوں کے مطابق بلغاریہ میں معمار سنان کی واحد مسجد؛ 1901ء میں ڈھانچا بدلا گیا اور 1903ء میں سات ولیوں کا گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 135}۔"
