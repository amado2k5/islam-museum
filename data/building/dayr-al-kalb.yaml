summary:
  ar: "دير قرب مَعْلُنايا في سفح جبل ينحدر عليه الماء وقلاليه مبنية بعضها فوق بعض في صعود الجبل، وفيه زيتون ورمان وآس وكرم وزعفران ونرجس كثير ولرهبانه مزارع في السهل؛ عده يعقوب في عجائب الدنيا الثلاث، وكان له خاصية في برء عضة الكلب الكَلِب، وله عيد يجتمع إليه النصارى إقامة والمسلمون للنظر والتنزه {cite:umari-masalik-1924 p. 254}."
  en: "The monastery near Ma'lunaya terraced up a mountainside with water descending on it, rich in olives, pomegranates, myrtle, vines, saffron and narcissus; Yaqut counted it among the three wonders of the world. It was famed for curing the bite of a rabid dog, and its yearly feast drew Christians to keep vigil and Muslims to sightsee {cite:umari-masalik-1924 p. 254}."
  fr: "Monastère près de Ma’lunaya étagé sur une montagne où descend l’eau, riche en oliviers, grenadiers, myrtes, vignes, safran et narcisses ; Yaqut le comptait parmi les trois merveilles du monde. Réputé guérir les morsures de chiens enragés, sa fête annuelle attirait des chrétiens pour veiller et des musulmans pour visiter {cite:umari-masalik-1924 p. 254}."
  es: "El monasterio cercano a Ma'lunaya, aterrazado en la ladera de una montaña, con agua que descendía sobre él, era rico en olivos, granados, mirto, vides, azafrán y narcisos; Yaqut lo consideraba una de las tres maravillas del mundo. Era famoso por curar la mordedura de un perro rabioso, y su fiesta anual atraía a cristianos que velaban allí y a musulmanes que acudían a visitarlo {cite:umari-masalik-1924 p. 254}."
  ur: "مالونیا کے قریب خانقاہ ایک پہاڑی کی چھت پر چڑھی ہوئی تھی جس پر پانی اترتا تھا، زیتون، انار، مرٹل، بیلیں، زعفران اور نرگس سے مالا مال تھا۔ یاقوت نے اسے دنیا کے تین عجائبات میں شمار کیا۔ یہ ایک پاگل کتے کے کاٹنے کے علاج کے لیے مشہور تھا، اور اس کی سالانہ دعوت نے عیسائیوں کو چوکنا رہنے اور مسلمانوں کو سیر و تفریح کی طرف راغب کیا۔ 254}۔"
  tr: "Ma'alnaya yakınlarındaki bir manastır, suyun aktığı bir dağın yamacında ve dağ yükselirken üst üste inşa edilen kaleler vardır. Burada zeytin, nar, mersin ağaçları, bağlar, safran ve birçok narsis bulunur. Rahiplerinin ovalarda çiftlikleri vardır; Yakup burayı dünyanın üç harikasından biri saymış ve köpek ısırıklarını iyileştirme özel özelliğine sahiptir. Hristiyanların ikamet etmek için toplandığı ve Müslümanların izleyip gezdiği bir festivali vardır {cite:umari-masalik-1924, s. 254}."
  id: "Sebuah biara dekat Ma'alnaya di lereng gunung tempat air mengalir, dan benteng-bentengnya dibangun satu di atas yang lain saat gunung naik. Biara ini berisi zaitun, delima, pohon mur, kebun anggur, saffron, dan banyak narsis. Para biksunya memiliki pertanian di dataran; Yakub menganggapnya sebagai salah satu dari tiga keajaiban dunia, dan memiliki ciri khas menyembuhkan gigitan anjing. Ada festival di mana umat Kristen berkumpul untuk tinggal dan umat Muslim untuk memandang dan berjalan-jalan {cite:umari-masalik-1924, hlm. 254}."
