summary:
  ar: "دير قرب مَعْلُنايا في سفح جبل ينحدر عليه الماء وقلاليه مبنية بعضها فوق بعض في صعود الجبل، وفيه زيتون ورمان وآس وكرم وزعفران ونرجس كثير ولرهبانه مزارع في السهل؛ عده يعقوب في عجائب الدنيا الثلاث، وكان له خاصية في برء عضة الكلب الكَلِب، وله عيد يجتمع إليه النصارى إقامة والمسلمون للنظر والتنزه {cite:umari-masalik-1924 p. 254}."
  en: "The monastery near Ma'lunaya terraced up a mountainside with water descending on it, rich in olives, pomegranates, myrtle, vines, saffron and narcissus; Yaqut counted it among the three wonders of the world. It was famed for curing the bite of a rabid dog, and its yearly feast drew Christians to keep vigil and Muslims to sightsee {cite:umari-masalik-1924 p. 254}."
