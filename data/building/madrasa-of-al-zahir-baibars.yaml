  ar: "المدرسة الظاهرية الركنية البيبرسية البندقدارية بالقاهرة، بين القصرين؛ أصلها قاعة السدرة وقاعة الخيم اللتان صارتا لبيبرس سنة 660هـ ⁦(المقريزي، ص 1061، 1194، 1343)⁩."
  en: "The Zahiriyya madrasa of Rukn al-Din Baybars al-Bunduqdari, Cairo, between the two palaces; its origin was the Hall of the Lote Tree and the Hall of the Tents, which passed to Baybars in 660 AH (al-Maqrizi, pp. 1061, 1194, 1343)."
  fr: "Madrasa Zahiriyya de Rukn al-Din Baybars al-Bunduqdari, au Caire, entre les deux palais ; issue de la salle du Jujubier et de celle des Tentes, passées à Baybars en 660 H (al-Maqrizi, pp. 1061, 1194, 1343)."
  es: "La madrasa Zahiriyya de Rukn al-Din Baybars al-Bunduqdari, El Cairo, entre los dos palacios; su origen fue el Salón del Árbol de Loto y el Salón de las Tiendas, que pasaron a Baybars en el año 660 AH (al-Maqrizi, págs. 1061, 1194, 1343)."
