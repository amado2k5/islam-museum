  ar: "أقدم خان في المدينة، جزء من وقف محمود باشا معاصر لجامعه؛ صناع الفرو ما زالوا في مدخله وفيه صحنان كان أولهما يتسع لنحو 45 غرفة في طابقين ومسجد وسطه."
  en: "The city's oldest han, part of Mahmut Pasha's foundation contemporary with his mosque; furriers still keep shops at its entrance; two courtyards, the first with c.45 rooms per floor and a central mosque."
  fr: "Plus ancien han de la ville, appartenant à la fondation de Mahmut Pasha contemporaine de sa mosquée ; les fourreurs gardent des boutiques à l’entrée ; deux cours, dont la première avait environ 45 pièces par étage et une mosquée centrale."
  es: "El han más antiguo de la ciudad, parte de la fundación de Mahmut Pasha, contemporánea a su mezquita; los peleteros aún mantienen tiendas en su entrada; dos patios, el primero con aproximadamente 45 habitaciones por piso y una mezquita central."
  ur: "شہر کا سب سے قدیم ہان، محمود پاشا کی فاؤنڈیشن کا حصہ جو اس کی مسجد کے ساتھ ہم عصر ہے۔ فریئرز اب بھی اس کے دروازے پر دکانیں رکھتے ہیں۔ دو صحن، پہلا c.45 کمرے فی منزل اور ایک مرکزی مسجد۔"
