summary:
  ar: "بناه سنة 1478م أوليا قاسم باشا وزير مراد الثاني ومحمد الفاتح؛ مربع من حجر منحوت بقبة أحد عشر متراً على ركنيات مرتفعة."
  en: "Built 1478 by Evliya Kasım Pasha, vezir under Murat II and Mehmet II; a dressed-stone single unit with an 11-metre dome on high squinches, partially restored in 1964."
  fr: "Construite en 1478 par Evliya Kasım Pasha, vizir sous Murat II et Mehmet II ; unité unique en pierre de taille avec coupole de onze mètres sur hautes trompes, partiellement restaurée en 1964."
  es: "Construido en 1478 por Evliya Kasım Pasha, vezir bajo Murat II y Mehmet II; una sola unidad de piedra labrada con una cúpula de 11 metros sobre altas trompas, parcialmente restaurada en 1964."
  ur: "1478 میں ایولیا قاسم پاشا نے تعمیر کیا، وزیر مرات II اور مہمت دوم کے تحت؛ 1964 میں جزوی طور پر بحال ہونے والی اونچی جگہوں پر 11 میٹر کے گنبد کے ساتھ ملبوس پتھر کا واحد یونٹ۔"
  tr: "1478 yılında II. Murad ve Fatih Mehmed'in bakanı Ulia Qasim Paşa tarafından inşa edilmiştir; yükseltilmiş köşeleri on bir metre yüksekliğinde kubbeye sahip taş bir meydandır."
  id: "Bangunan ini dibangun pada tahun 1478 M oleh Ulia Qasim Pasha, menteri Murad II dan Mehmed Sang Penakluk; sebuah persegi batu yang dipahat dengan kubah setinggi sebelas meter di sudut-sudut yang terangkat."
