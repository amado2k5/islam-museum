summary:
  ar: "جامع تشينيلي بأسكودار؛ كلية صغيرة بناها الوالدة السلطانة كوسم سنة 1640م واشتهرت بخزفها الذي يغطي واجهتها وداخلها {cite:freely-ottoman-architecture-2011 p.344}."
  en: "Çinili Mosque of Üsküdar; a small külliye built in 1640 by the valide sultan Kösem, named for the tiles covering its façade and interior {cite:freely-ottoman-architecture-2011 p.344}."
  fr: "Mosquée Çinili d’Üsküdar ; petit külliye construit en 1640 par la valide sultan Kösem, nommé d’après les carreaux couvrant sa façade et son intérieur {cite:freely-ottoman-architecture-2011 p.344}."
  es: "Mezquita Çinili de Üsküdar; un pequeño külliye construido en 1640 por la valide sultana Kösem, llamado así por los azulejos que cubren su fachada e interior {cite:freely-ottoman-architecture-2011 p.344}."
  ur: "Üsküdar کی Çinili مسجد؛ ایک چھوٹی کلی 1640 میں درست سلطان کوسم نے تعمیر کی تھی، جس کا نام اس کے اگواڑے اور اندرونی حصے کو ڈھانپنے والی ٹائلوں کے لیے رکھا گیا تھا"
  tr: "Üsküdar'daki Çinli Camii; anne Sultan Kösem tarafından 1640 yılında inşa edilmiş küçük bir kolej, cephesini ve iç kısmını kaplayan seramikleriyle ünlü {cite:freely-ottoman-architecture-2011 s.344}."
  id: "Masjid Çinlı di Üsküdar; sebuah perguruan tinggi kecil yang dibangun oleh ibu Sultan Kösem pada tahun 1640 M, terkenal dengan keramiknya yang menutupi fasad dan interiornya {cite:freely-ottoman-architecture-2011 hlm.344}."
