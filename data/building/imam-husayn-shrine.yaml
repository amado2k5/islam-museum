label:
  ar: مرقد الحسين بكربلاء
  en: Imam Husayn Shrine, Karbala
  ur: روضہ امام حسین کربلا
summary:
  ar: "مرقد الحسين بن علي بكربلاء فوق موضع قتله سنة 61هـ؛ سجّل ابن كثير مقتله بها يوم عاشوراء، وصار المرقد مركز زيارة عظيما عند الشيعة الإثني عشرية {cite:al-bidaya-wal-nihaya} {cite:momen-1985}. وتروي «موسوعة العتبات» عمارته: اعتنى به عضد الدولة البويهي، وزار ملكشاه السلجوقي كربلاء ورمّم سنة ٤٧٩هـ، والعمارة القائمة على القبر أصلها عمارة السلطان أويس الجلائري سنة ٧٦٧هـ أتمها ولداه حسين وأحمد سنة ٧٨٦هـ؛ وذهّب إسماعيل الصفوي حواشي الضريح وأهدى اثني عشر قنديلاً من ذهب سنة ٩١٤هـ، وأمر مراد الرابع ببناء القبة، وجدد فتح علي شاه القاجاري المشهد وبدّل صفائح الذهب سنة ١٢٢٧هـ وشيّد قبتي الحسين والعباس سنة ١٢٥٠هـ، والقبة يبلغ ارتفاعها ٢٧ متراً مغشاة بالذهب {cite:musawat-atabat}."
  en: "The shrine of Husayn ibn Ali at Karbala, over the place of his killing in 61 AH; Ibn Kathir records his death there on Ashura, and the shrine became a major pilgrimage centre for the Twelver Shi'a {cite:al-bidaya-wal-nihaya} {cite:momen-1985}. The Mawsu'at al-Atabat records its building: Adud al-Dawla the Buyid built over the grave, Malik Shah restored the enclosure in 479, and the standing structure is essentially Sultan Uways the Jalayirid's 767 work completed by his sons Husayn and Ahmad in 786; Ismail the Safavid gilded the grave's surrounds and gifted twelve gold lamps in 914, Murad IV ordered the dome, and Fath Ali Shah renewed the shrine, replated it in gold and built the Husayn and Abbas domes in 1227 and 1250 — the dome rising 27 m, plated in gold {cite:musawat-atabat}."
