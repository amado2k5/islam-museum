summary:
  ar: "بطاقة أولية لجامع محمود باشا بإسطنبول، مجمع الصدر الأعظم محمود باشا أنجلوفيتش أسس سنة ١٤٦٤م من أقدم جامعات الفاتح؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Mahmut Pasha Mosque of Istanbul, the 1464 complex of the grand vizier Mahmud Pasha Angelović and among the oldest post-conquest mosques of the city; its sources are not yet checked on the page."
  fr: "Notice provisoire de la mosquée Mahmut Pacha d’Istanbul, complexe de 1464 du grand vizir Mahmud Pacha Angelović, parmi les plus anciennes mosquées de la ville après la conquête ; ses sources ne sont pas encore vérifiées sur cette page."
  es: "Ficha preliminar de la Mezquita Mahmut Pasha de Estambul, complejo de 1464 del gran visir Mahmud Pasha Angelović y una de las mezquitas más antiguas de la ciudad construidas después de la conquista normanda; sus fuentes aún no han sido verificadas en la página."
  ur: "استنبول کی محمود پاشا مسجد کے لیے ڈرافٹ کارڈ، عظیم وزیر محمود پاشا اینجلوویچ کا 1464 کا کمپلیکس اور شہر کی فتح کے بعد کی قدیم ترین مساجد میں سے؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "İstanbul'daki Mahmud Paşa Camii'nin ön kartı, 1464 yılında kurulan ve Fatih'in en eski üniversitelerinden biri olan Sadrazam Mahmud Paşa Angelović'in kompleksi; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan Masjid Mahmud Pasha di Istanbul, kompleks Wazir Agung Mahmud Pasha Angelović, yang didirikan pada tahun 1464 M, salah satu universitas tertua di Fatih; sumber-sumbernya di halaman tersebut belum ditinjau."
