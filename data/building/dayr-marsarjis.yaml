summary:
  ar: "دير فوق بلد بثلاثة فراسخ على قلة جبل عالٍ يُبين للناظر من عدة فراسخ؛ على بابه شجرة لا يعرف أحد ما هي لا يسقط ورقها ولها ثمرة يشبه اللوز — ولعلها التي ذكر ابن وحشية أنها في الدنيا واحدة لا ثاني لها — وفي جبله زرازير لا تفارقه ولا تُصاد وفي شعابه أفاعٌ كثيرة تمنع من صيدها ليلاً {cite:umari-masalik-1924 p. 304}."
  en: "The monastery three farsakhs above Balad on a high summit visible for leagues; at its gate grew an unnamed tree whose leaves never fell and whose fruit resembled the almond — perhaps the unique tree of the world that Ibn Wahshiyya recorded — while starlings held its mountain untrapped, guarded by night-snakes {cite:umari-masalik-1924 p. 304}."
  fr: "Monastère à trois farsakhs au-dessus de Balad sur un haut sommet visible de loin ; un arbre sans nom poussait à sa porte, sans perdre ses feuilles et portant des fruits semblables à des amandes, peut-être l’arbre unique au monde décrit par Ibn Wahshiyya ; les étourneaux occupaient sa montagne sans être piégés, protégés par des serpents nocturnes {cite:umari-masalik-1924 p. 304}."
  es: "El monasterio, situado a tres farsakhs por encima de Balad, en una alta cumbre visible a leguas de distancia, crecía en su puerta un árbol sin nombre cuyas hojas nunca caían y cuyo fruto se parecía a la almendra —quizás el único árbol del mundo que Ibn Wahshiyya registró—, mientras que los estorninos mantenían su montaña sin trampas, custodiada por serpientes nocturnas {cite:umari-masalik-1924 p. 304}."
  ur: "خانقاہ بلاد سے تین فرسخ اوپر ایک اونچی چوٹی پر لیگوں کے لیے دکھائی دیتی ہے۔ اس کے دروازے پر ایک بے نام درخت اُگ آیا جس کے پتے کبھی نہیں گرے اور جس کا پھل بادام سے ملتا جلتا تھا - شاید دنیا کا وہ منفرد درخت جسے ابن وحشیہ نے درج کیا ہے - جب کہ ستاروں نے اس پہاڑ کو پکڑے بغیر رات کے سانپوں کی حفاظت کی تھی۔ 304}۔"
  tr: "Bir manastır, bir dağın küçük yamacında, üç farsakh yukarıda yer alır ve gözlemcinin birkaç farsakh'tan görebileceği bir manastır vardır; kapısında yaprakları dökülmeyen bir ağaç vardır ve meyvesi badem benzeri — ve belki de İbn Vahşiyya'nın bahsettiği bu dünyada eşsizdir — ve dağında hiç ayrılmayan ya da avlanmayan sığırcıklar bulunur, vadilerinde ise gece avlanmayı engelleyen birçok yılan bulunur {cite:Umari-Masalik-1924, s. 304}."
  id: "Sebuah biara terletak tiga farsakh di atas sebuah gunung di sisi kecil sebuah gunung, yang terlihat oleh pengamat dari beberapa farsakh; di gerbangnya terdapat sebuah pohon yang daunnya tidak gugur, dan buahnya menyerupai almond — dan mungkin yang disebutkan oleh Ibn Wahshiyya adalah unik di dunia ini dan tiada tandingannya — dan di gunungnya terdapat burung jalak yang tidak pernah pergi atau diburu, dan di jurangnya terdapat banyak ular yang mencegah berburu di malam hari {cite:umari-masalik-1924, hlm. 304}."
