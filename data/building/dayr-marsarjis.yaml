summary:
  ar: "دير فوق بلد بثلاثة فراسخ على قلة جبل عالٍ يُبين للناظر من عدة فراسخ؛ على بابه شجرة لا يعرف أحد ما هي لا يسقط ورقها ولها ثمرة يشبه اللوز — ولعلها التي ذكر ابن وحشية أنها في الدنيا واحدة لا ثاني لها — وفي جبله زرازير لا تفارقه ولا تُصاد وفي شعابه أفاعٌ كثيرة تمنع من صيدها ليلاً {cite:umari-masalik-1924 p. 304}."
  en: "The monastery three farsakhs above Balad on a high summit visible for leagues; at its gate grew an unnamed tree whose leaves never fell and whose fruit resembled the almond — perhaps the unique tree of the world that Ibn Wahshiyya recorded — while starlings held its mountain untrapped, guarded by night-snakes {cite:umari-masalik-1924 p. 304}."
