summary:
  ar: "بطاقة أولية لقصر الجعفرية بسرقسطة، قصر بني هود من طائفة سرقسطة في القرن الحادي عشر ثم قصر ملوك أراغون؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Aljafería of Zaragoza, the eleventh-century palace of the Banu Hud taifa kings, later the palace of Aragon's kings; its sources are not yet checked on the page."
  fr: "Notice provisoire : Aljafería, Zaragoza, palais du XIe siècle des rois de la taifa des Banu Hud, puis des rois d’Aragon. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la Aljafería de Zaragoza, palacio del siglo XI de los reyes de la taifa Banu Hud, posteriormente palacio de los reyes de Aragón; sus fuentes aún no han sido verificadas en la página."
  ur: "زارگوزا کے الجفیریا کے لیے ڈرافٹ کارڈ، گیارہویں صدی کے بنو ہود طائفہ کے بادشاہوں کا محل، بعد میں آراگون کے بادشاہوں کا محل؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "On birinci yüzyılda Zaragoza mezhebinin Banu Hud sarayı olan Zaragoza'daki Ja'fari Sarayı için ön hazırlık kartı, o zamanlar Aragon Krallarının sarayı olarak kullanılmıştır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Istana Ja'fari di Zaragoza, istana Banu Hud dari sekte Zaragoza pada abad kesebelas, kemudian istana Raja Aragon; sumber-sumbernya di halaman belum ditinjau."
