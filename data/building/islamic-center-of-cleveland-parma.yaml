  id: "Sebuah masjid di Parma, Ohio, dibangun oleh Gerald M. Rembovsky antara tahun 1989 dan 1995, kubah berlapis emasnya adalah replika dari Dome of the Rock di Yerusalem {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 12-13}."
