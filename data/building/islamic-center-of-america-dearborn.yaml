label: { ar: "المركز الإسلامي الأمريكي، ديربورن", en: "Islamic Center of America, Dearborn", fr: "Centre islamique d’Amérique, Dearborn", ur: "اسلامک سینٹر آف امریکہ، ڈیئربورن", es: "Centro Islámico de América, Dearborn", tr: "Amerikan İslam Merkezi, Dearborn", id: "American Islamic Center, Dearborn" }
summary:
  ar: "أكبر مسجد في الولايات المتحدة بحسب الكتالوج، بُني سنة 2005 في ديربورن بميشيغان، صممه پول برتين وديفيد دونيلون، بقباب ذهبية وعقود مغربية ومئذنتين {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  en: "The largest mosque in the United States according to the catalogue, built in 2005 at Dearborn, Michigan, to designs by Paul Bertin and David Donnellon, with golden domes, Moorish arches and two minarets {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  fr: "La plus grande mosquée des États-Unis selon le catalogue, construite en 2005 à Dearborn, Michigan, sur les plans de Paul Bertin et David Donnellon, avec des coupoles dorées, des arcs mauresques et deux minarets {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  ur: "کیٹلاگ کے مطابق امریکہ کی سب سے بڑی مسجد، جو 2005ء میں ڈیئربورن، مشی گن میں پال برٹن اور ڈیوڈ ڈونیلن کے ڈیزائن پر بنی، سنہری گنبدوں، مراکشی محرابوں اور دو میناروں کے ساتھ {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}۔"
  es: "La mezquita más grande de los Estados Unidos, según el catálogo, construida en 2005 en Dearborn, Michigan, según diseños de Paul Bertin y David Donnellon, con cúpulas doradas, arcos moriscos y dos minaretes {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  tr: "Kataloğa göre Amerika Birleşik Devletleri'nin en büyük camisi, 2005 yılında Dearborn, Michigan'da inşa edilmiştir, Paul Bertin ve David Donnellon tarafından tasarlanmıştır; altın kubbeler, Fas kemerleri ve iki minareye ile {cite:khalidi-donnellon-mosques-usa-canada-catalogue s. 8-9}."
  id: "Masjid terbesar di Amerika Serikat menurut katalog, dibangun pada tahun 2005 di Dearborn, Michigan, dirancang oleh Paul Bertin dan David Donnellon, dengan kubah emas, lengkungan Maroko, dan dua menara {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 8-9}."
