summary:
  ar: "جامع بناه طويغون باشا والي بودا (1553–1558) وأتمه ابنه أحمد بك، الوحيد في بودا المعروفة أبعاده ومسقطه، أُعطي للرهبان الكبوشيين بعد 1686، وبُنيت على جدرانه كنيسة القديسة إليزابيث سنة 1770 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}."
  en: "A mosque built by Toygun Pasha, governor of Buda (1553-58), and completed by his son Ahmed Bey, the only Buda mosque whose dimensions and plan are known; given to the Capuchins after 1686, its walls carry St Elizabeth's Church of 1770 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}."
  ur: "بودا کے حاکم طوئیغون پاشا (1553–58) کی بنوائی اور ان کے بیٹے احمد بے کی مکمل کی ہوئی مسجد، بودا کی واحد مسجد جس کی پیمائش اور نقشہ معلوم ہے؛ 1686ء کے بعد کیپوچن راہبوں کو ملی، اور اس کی دیواروں پر 1770ء میں سینٹ الزبتھ گرجا بنا {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}۔"
