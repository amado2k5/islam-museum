label: { ar: "جامع طويغون باشا في بودا ⁦(كنيسة القديسة إليزابيث)⁩", en: "Toygun Pasha Mosque, Buda (St Elizabeth's Church)", fr: "Mosquée Toygun Pacha, Buda (Sainte-Élisabeth)", ur: "طوئیغون پاشا مسجد، بودا ⁦(سینٹ الزبتھ گرجا)⁩", es: "Mezquita de Toygun Pasha, Buda (Iglesia de Santa Isabel)" }
summary:
  ar: "جامع بناه طويغون باشا والي بودا (1553–1558) وأتمه ابنه أحمد بك، الوحيد في بودا المعروفة أبعاده ومسقطه، أُعطي للرهبان الكبوشيين بعد 1686، وبُنيت على جدرانه كنيسة القديسة إليزابيث سنة 1770 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}."
  en: "A mosque built by Toygun Pasha, governor of Buda (1553-58), and completed by his son Ahmed Bey, the only Buda mosque whose dimensions and plan are known; given to the Capuchins after 1686, its walls carry St Elizabeth's Church of 1770 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}."
  fr: "Fondation du gouverneur de 1553–1558, achevée par Ahmed Bey ; seule mosquée de Buda au plan et dimensions connus selon le résumé. Donnée aux capucins après 1686, ses murs portent Sainte-Élisabeth de 1770. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}"
  ur: "بودا کے حاکم طوئیغون پاشا (1553–58) کی بنوائی اور ان کے بیٹے احمد بے کی مکمل کی ہوئی مسجد، بودا کی واحد مسجد جس کی پیمائش اور نقشہ معلوم ہے؛ 1686ء کے بعد کیپوچن راہبوں کو ملی، اور اس کی دیواروں پر 1770ء میں سینٹ الزبتھ گرجا بنا {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}۔"
  es: "Mezquita construida por Toygun Pasha, gobernador de Buda (1553-58), y completada por su hijo Ahmed Bey, la única mezquita de Buda cuyas dimensiones y planta se conocen; entregada a los capuchinos después de 1686, sus muros albergan la iglesia de Santa Isabel de 1770 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 37}."
