summary:
  ar: "جامع أسكدار سنة 1471م بناه روم محمد باشا الوزير الأعظم المتحول للإسلام الذي أعدمه الفاتح 1472م؛ أبزنطي الهيئة بين جوامع المدينة المبكرة."
  en: "1471 Üsküdar mosque by Rum Mehmet Pasha, the converted grand vezir executed by the Conqueror in 1472; most Byzantine-looking of the city's early mosques."
  fr: "Mosquée de 1471 du grand vizir converti Rum Mehmet Pacha, exécuté en 1472 ; la plus byzantine des premières mosquées d’Istanbul."
  es: "Mezquita de Üsküdar, construida en 1471 por Rum Mehmet Pasha, el gran visir convertido y ejecutado por el Conquistador en 1472; la mezquita más bizantina de las primeras construidas en la ciudad."
  ur: "1471 Üsküdar مسجد بذریعہ رم مہمت پاشا، 1472 میں فاتح کے ذریعہ تبدیل شدہ عظیم الشان وزیر؛ شہر کی ابتدائی مساجد میں سے زیادہ تر بازنطینی نظر آتے ہیں۔"
  tr: "Askdar Camii, 1471 yılında İslam'a geçen Sadrazam Rum Muhammed Paşa tarafından inşa edilmiştir; Paşa, 1472 yılında fatih tarafından idam edilmiştir; şehrin erken camileri arasında Bazanti tarzında inşa edilmiştir."
  id: "Masjid Askdar dibangun pada tahun 1471 M oleh Rum Muhammad Pasha, Wazir Agung yang memeluk Islam, yang dieksekusi oleh penakluk pada tahun 1472 M; masjid ini dibangun dengan gaya Bazanti di antara masjid-masjid awal di kota tersebut."
