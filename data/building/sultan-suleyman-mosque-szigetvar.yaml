class: building
kind: mosque
label: { ar: "جامع السلطان سليمان في قلعة سگتوار", en: "Sultan Süleyman Mosque, Szigetvár Castle", fr: "Mosquée Sultan Soliman, château de Szigetvár", ur: "سلطان سلیمان مسجد، قلعۂ سگتوار", es: "Mezquita del Sultán Solimán, Castillo de Szigetvár", tr: "Segtowar Kalesi'ndeki Sultan Süleyman Camii", id: "Masjid Sultan Suleiman di Kastil Segtowar" }
summary:
  ar: "جامع متواضع مستطيل بسقف خشبي بناه صوقوللي محمد باشا سنة 1566 في قلعة سگتوار باسم سليمان القانوني الذي مات في الحملة، تعاقب عليه السكن والمستشفى والمخزن والكنيسة، وهو اليوم متحف {cite:yilmaz-ottoman-architecture-hungary-2024 p. 137}."
  en: "A modest rectangular mosque with a wooden roof built by Sokollu Mehmed Pasha in 1566 in Szigetvár Castle in the name of Süleyman, who died during the campaign; later a residence, hospital, granary and church, now a museum {cite:yilmaz-ottoman-architecture-hungary-2024 p. 137}."
  fr: "Modeste rectangle à toit de bois de Sokollu Mehmed Pacha en 1566 pour Soliman mort en campagne ; résidence, hôpital, grenier, église puis musée. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 137}"
  ur: "قلعۂ سگتوار میں صوقوللو محمد پاشا کی 1566ء میں سلیمان قانونی کے نام، جو مہم میں فوت ہوئے، بنوائی سادہ مستطیل مسجد، لکڑی کی چھت؛ بعد میں رہائش، اسپتال، غلہ گھر اور گرجا، اب عجائب گھر {cite:yilmaz-ottoman-architecture-hungary-2024 p. 137}۔"
  es: "Una modesta mezquita rectangular con techo de madera construida por Sokollu Mehmed Pasha en 1566 en el castillo de Szigetvár en nombre de Süleyman, quien murió durante la campaña; más tarde fue residencia, hospital, granero e iglesia, y ahora es un museo {cite:yilmaz-ottoman-architecture-hungary-2024 p. 137}."
  tr: "Soqolli Mehmed Paşa tarafından 1566 yılında Segetowar Kalesi'nde, sefer sırasında ölen Süleyman Muhteşem'in adını taşıyan ahşap çatılı mütevazı, dikdörtgen bir cami inşa edilmiştir. Sırasıyla ev, hastane, depo ve kilise tarafından kullanılmıştır. Bugün bir müze olarak hizmet vermektedir {cite:yilmaz-ottoman-architecture-hungary-2024, s. 137}."
  id: "Sebuah masjid sederhana berbentuk persegi panjang dengan atap kayu yang dibangun oleh Soqolli Mehmed Pasha pada tahun 1566 di Kastil Segetowar yang dinamai menurut Suleiman yang Agung, yang meninggal selama kampanye. Masjid ini secara berurutan ditempati oleh rumah, rumah sakit, gudang, dan gereja. Saat ini, museum ini menjadi {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 137}."
