  tr: "\"Qasr al-Janiyat\", Dara Shikhouh tarafından inşa edilen kraliyet sarayının üzerindeki dağ yamacında yer almaktadır; bu okul ise şeyhi Akhund Mela Şah için astronomi okulu {cite:brookes-gardens-of-paradise-1987 s.157} {cite:brookes-gardens-of-paradise-1987 s.159}."
