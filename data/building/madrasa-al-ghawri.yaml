summary:
  ar: "بطاقة أولية لمجمع المدرسة الغورية بين الموسكي وباب الزويلة بالقاهرة — مدرسة وجامع ومقبرة للسلطان الأشرف قنصوه الغوري، الأخر من سلاطين المماليك؛ نقوشها المسجلة في قاموس النقوش الإسلامية تعود إلى ٩٠٩ و٩٢٢هـ."
  en: "Draft card for the al-Ghawri madrasa complex between al-Moski and Bab Zuwayla in Cairo — the madrasa, mosque and mausoleum of Sultan al-Ashraf Qansuh al-Ghawri, last of the Mamluk sultans; its inscriptions recorded in the Islamic Epigraphy Thesaurus date to 909 and 922 AH."
  fr: "Notice provisoire : complexe de la madrasa al-Ghawri entre al-Moski et Bab Zuwayla au Caire, réunissant madrasa, mosquée et mausolée du sultan al-Ashraf Qansuh al-Ghawri, dernier des sultans mamelouks ; ses inscriptions enregistrées dans l’Islamic Epigraphy Thesaurus datent de 909 et 922 H."
  es: "Boceto de ficha del complejo de la madrasa de al-Ghawri, situado entre al-Moski y Bab Zuwayla en El Cairo: la madrasa, mezquita y mausoleo del sultán al-Ashraf Qansuh al-Ghawri, último de los sultanes mamelucos; sus inscripciones, registradas en el Tesauro de Epigrafía Islámica, datan de los años 909 y 922 de la Hégira."
  ur: "قاہرہ میں الموسکی اور باب زوویلہ کے درمیان الغوری مدرسہ کمپلیکس کے لیے ڈرافٹ کارڈ - مملوک سلاطین کے آخری سلطان الاشرف قنسوح الغویری کا مدرسہ، مسجد اور مقبرہ؛ اس کے نوشتہ جات اسلامی ایپی گرافی تھیسورس میں 909 اور 922 ہجری میں درج ہیں۔"
  tr: "Kahire'de Al-Muski ile Bab Al-Zuwaila arasında yer alan Ghuriya Okulu kompleksi için ön kart — Memlük sultanlarından bir diğer Sultan Al-Ashraf Qansuh Al-Ghuri'ye ait bir okul, cami ve mezarlık; İslami Yazıtlar Sözlüğü'nde kaydedilen yazıtları 909 ve 922 H.H yıllarına tarihlenmektedir."
  id: "Kartu pendahuluan untuk kompleks Sekolah Ghuriya antara Al-Muski dan Bab Al-Zuwaila di Kairo — sebuah sekolah, masjid, dan pemakaman milik Sultan Al-Ashraf Qansuh Al-Ghuri, salah satu sultan Mamluk; prasasti-prasasti yang tercatat dalam Kamus Prasasti Islam berasal dari tahun 909 dan 922 H."
