  en: "al-Ghawri Madrasa-Mausoleum Complex, Cairo"
  fr: "Complexe de la madrasa et du mausolée d’al-Ghawri, Le Caire"
  es: "Complejo de la madrasa y el mausoleo de al-Ghawri, El Cairo"
  ur: "الغاوری مدرسہ مزار کمپلیکس، قاہرہ"
