summary:
  ar: "قصر مشهور بمدينة ظفار باليمن قصبة يحصب؛ وفي مسالك الأبصار أن المدينة كانت تسمى قديماً باسمه {cite:umari-masalik-1924 p. 233}. ولعله قصر ريدان الذي يذكره الإدريسي بظفار {cite:nuzhat-al-mushtaq-2002 p. 152}."
  en: "The famous palace of Zafar in Yemen, capital of Yuhasib — al-Umari says the city itself was anciently named for it {cite:umari-masalik-1924 p. 233}; likely the Raydan palace al-Idrisi records at Zafar {cite:nuzhat-al-mushtaq-2002 p. 152}."
  fr: "Palais célèbre de Zafar au Yémen, capitale des Yuhasib ; al-Umari dit que la ville en portait anciennement le nom. Probablement le palais de Raydan qu’al-Idrisi situe à Zafar. {cite:umari-masalik-1924 p. 233} {cite:nuzhat-al-mushtaq-2002 p. 152}"
  es: "El famoso palacio de Zafar en Yemen, capital de Yuhasib; al-Umari dice que la ciudad misma recibió su nombre en la antigüedad {cita:umari-masalik-1924 p. 233}; probablemente los registros del palacio Raydan al-Idrisi en Zafar {cita:nuzhat-al-mushtaq-2002 p. 152}."
  ur: "یمن میں ظفر کا مشہور محل، یوحاسب کے دار الحکومت العمری کا کہنا ہے کہ اس شہر کا نام قدیم طور پر اسی کے لیے رکھا گیا تھا۔ 233}; غالباً ریدان محل الادریسی نے ظفر میں ریکارڈ کیا ہے 152}۔"
