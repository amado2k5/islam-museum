summary:
  ar: "بطاقة أولية للعتبة الفاطمية بقم، مشهد فاطمة المعصومة بنت موسى الكاظم الذي حوله صار قم مدينة مقدسة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Fatima Masumeh shrine of Qom, the sanctuary of Fatima al-Masuma, sister of al-Ridha, which made Qom a holy city; its sources are not yet checked on the page."
  fr: "Notice provisoire : Sanctuaire Fatima Masumeh de Qom, sanctuaire de Fatima al-Masuma, sœur d’al-Ridha, qui fit de Qom une ville sainte. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para el santuario de Fátima Masumeh de Qom, el santuario de Fátima al-Masuma, hermana de al-Ridha, que convirtió a Qom en una ciudad santa; sus fuentes aún no han sido verificadas en la página."
  ur: "قم کے فاطمہ معصومہ کے مزار کے لیے کارڈ کا مسودہ، الرضا کی بہن فاطمہ معصومہ کا حرم، جس نے قم کو ایک مقدس شہر بنایا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kum'daki Fatimi türbesi için ön kart, Fatıme el-Ma'sumah bint Musa al-Kadhim'in türbesi ve etrafında kutsal bir şehir haline gelmiştir; sayfadaki kaynaklar henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Makam Fatimiyah di Qom, makam Fatimah al-Ma'sumah bint Musa al-Kadhim, di sekitarnya Qom telah menjadi kota suci; sumber-sumbernya di halaman belum ditinjau."
