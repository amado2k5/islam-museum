summary:
  ar: "بقية كُلّية الشيخ مصلح الدين وفاء العالم الذي وقف نفسه للفقراء؛ تربته مؤرخة 1491م وضريحه مزار شعبي أعطى حي وفاء اسمه."
  en: "Survival of Şeyh Muslihiddin Vefa's külliye — the scholar who devoted himself to the poor; his 1491-dated türbe is a still-venerated shrine that gave the Vefa district its name."
  fr: "Vestige du külliye du savant dévoué aux pauvres ; türbe daté de 1491 encore vénéré, à l’origine du nom du quartier Vefa."
  es: "La supervivencia del kulliye de Şeyh Muslihiddin Vefa, el erudito que se dedicó a los pobres; su mausoleo, que data de 1491, es un santuario aún venerado que dio nombre al distrito de Vefa."
  ur: "Şeyh Muslihiddin Vefa's Kulliye کی بقا - وہ عالم جس نے اپنے آپ کو غریبوں کے لیے وقف کر دیا؛ اس کا 1491 کا مقبرہ ایک اب بھی قابل احترام مزار ہے جس نے ضلع ویفا کو اس کا نام دیا۔"
  tr: "Şeyh Musleh al-Din Koleji'nin geri kalanı ise fakirlere kendini adamış olan Wafaa Al-Alam'dır; mezarı 1491 yılına dayanır ve türbesi Wafaa mahallesine adını veren popüler bir türbedir."
  id: "Sisa Sheikh Musleh al-Din College adalah Wafaa Al-Alam, yang mendedikasikan dirinya untuk kaum miskin; makamnya berasal dari tahun 1491 M, dan makamnya adalah tempat suci populer yang memberi nama lingkungan Wafaa tersebut."
