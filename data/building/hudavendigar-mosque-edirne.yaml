summary:
  ar: "أقدم الجوامع السلطانية في أدرنة؛ رجّح كوران أن مراد الأول بناه بعد فتح المدينة 1369م على أطلال كنيسة يونانية."
  en: "Earliest of Edirne's imperial mosques; Kuran argues Murat I Hüdavendigâr built it soon after the 1369 capture of Adrianople, on and from the ruins of a Greek church."
  fr: "Plus ancienne mosquée impériale d’Edirne ; selon Kuran, Murat Ier Hüdavendigâr la construisit peu après la prise d’Andrinople de 1369, sur et avec les ruines d’une église grecque."
  es: "La más antigua de las mezquitas imperiales de Edirne; Kuran sostiene que Murat I Hüdavendigâr la construyó poco después de la conquista de Adrianópolis en 1369, sobre las ruinas de una iglesia griega."
  ur: "ایڈرن کی شاہی مساجد میں سے ابتدائی؛ کوران کا استدلال ہے کہ مرات اول ہوداوینڈیگر نے اسے 1369 میں ایڈریانوپل پر قبضے کے فوراً بعد، ایک یونانی چرچ کے کھنڈرات پر اور وہاں سے بنایا تھا۔"
  tr: "Edirne'deki en eski kraliyet cami; Kuran, Murad I'in şehri 1369 yılında fethettikten sonra bir Yunan kilisesinin kalıntıları üzerine inşa ettiğini öne sürer."
  id: "Masjid kerajaan tertua di Edirne; Kuran menyatakan bahwa Murad I membangunnya setelah penaklukan kota pada tahun 1369 M di atas reruntuhan gereja Yunani."
