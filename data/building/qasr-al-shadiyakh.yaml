label: { ar: "قصر الشاذياخ", en: "Qasr al-Shadiyakh", fr: "Qasr al-Shadiyakh", es: "Qasr al-Shadiyakh", ur: "قصر الشدیخ", tr: "El-Şadiyakh Sarayı", id: "Istana Al-Shadiyakh" }
summary:
  ar: "قصر بباب نيسابور من خراسان كان دار السلطنة لبعض ملوكها، وشُبّه بناؤه بغمدان حتى قيل «اشرب هنيئاً عليك التاج مرتفقاً بالشاذياخ ودع غمدان لليمن»؛ وعلى بابه صُلب الشاعر علي بن الجهم {cite:umari-masalik-1924 p. 233}."
  en: "The palace at Nishapur's gate that was the seat of rule for some of its kings, its building likened to Ghumdan itself — 'drink your crown's ease at al-Shadiyakh and leave Ghumdan to Yemen'; at its gate the poet Ali ibn al-Jahm was crucified {cite:umari-masalik-1924 p. 233}."
  fr: "Palais de la porte de Nishapur, siège de certains rois, comparé à Ghumdan — « bois dans l’aisance de ta couronne à al-Shadiyakh, laisse Ghumdan au Yémen » ; le poète Ali ibn al-Jahm fut crucifié à sa porte {cite:umari-masalik-1924 p. 233}"
  es: "El palacio en la puerta de Nishapur que fue sede del gobierno de algunos de sus reyes, su edificio comparado con el propio Ghumdan: \"bebe la tranquilidad de tu corona en al-Shadiyakh y deja Ghumdan a Yemen\"; en su puerta fue crucificado el poeta Ali ibn al-Jahm {cite:umari-masalik-1924 p. 233}."
  ur: "نیشاپور کے دروازے پر وہ محل جو اس کے کچھ بادشاہوں کے لیے حکمرانی کا مرکز تھا، اس کی عمارت کو خود گھمدان سے تشبیہ دی گئی تھی - 'الشدیخ میں اپنے تاج کی آسانی پیو اور گھمدان کو یمن کے لیے چھوڑ دو'؛ اس کے دروازے پر شاعر علی ابن الجہم کو مصلوب کیا گیا 233}۔"
  tr: "Horasan'daki Nişapur kapısındaki bir saray, bazı krallarının ikametgahıydı ve yapısı bir kınına benzetilirdi; öyle ki, \"Tacın üzerinde sapkınlarla birlikte iyi iç ve Yemen için kınına veda et\" denirdi; kapısında şair Ali ibn al-Jahm'ın çarmıha gerilmesi yer alırdı {cite:umari-masalik-1924, s. 233}."
  id: "Sebuah istana di gerbang Nishapur di Khorasan menjadi kediaman beberapa rajanya, dan pembangunannya disamakan dengan sarung hingga terucap, \"Minumlah dengan baik di atas mahkota, ditemani oleh yang menyimpang, dan ucapkan selamat tinggal pada sarung untuk Yaman\"; dan di pintunya terdapat penyaliban penyair Ali ibn al-Jahm {cite:umari-masalik-1924, hlm. 233}."
