summary:
  ar: "قصر بباب نيسابور من خراسان كان دار السلطنة لبعض ملوكها، وشُبّه بناؤه بغمدان حتى قيل «اشرب هنيئاً عليك التاج مرتفقاً بالشاذياخ ودع غمدان لليمن»؛ وعلى بابه صُلب الشاعر علي بن الجهم {cite:umari-masalik-1924 p. 233}."
  en: "The palace at Nishapur's gate that was the seat of rule for some of its kings, its building likened to Ghumdan itself — 'drink your crown's ease at al-Shadiyakh and leave Ghumdan to Yemen'; at its gate the poet Ali ibn al-Jahm was crucified {cite:umari-masalik-1924 p. 233}."
