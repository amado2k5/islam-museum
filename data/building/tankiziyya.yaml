summary:
  ar: "التنكزية في القدس، مدرسة الأمير سيف الدين تنكز الناصري نائب الشام، أسسها سنة ٧٢٨-٧٢٩هـ ⁦(١٣٢٨-١٣٢٩م)⁩ فوق باب الناظر بالحائط الغربي للحرم، وجمعت مدرسة ومحكمة ودار حديث ومكتبة. يمرّ تحتها اليوم النفق المحفور على امتداد الحائط الغربي، كما وصفه تقرير اليونسكو سنة ١٩٨٦ {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
  en: "The Tankiziyya in Jerusalem, the college of the amir Sayf al-Din Tankiz al-Nasiri, governor of Damascus, founded 728-729 AH ⁦(1328-1329)⁩ above Bab al-Nazir on the Haram\u2019s western wall, combining a madrasa, law court, hadith house and library. The Western Wall tunnel dug along the wall now passes beneath it, as the UNESCO mission described in 1986 {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
  ur: "یروشلم میں تنکیزیہ، امیر سیف الدین تنکز ناصری، نائبِ شام کا مدرسہ، جسے 728-729ھ ⁦(1328-1329ء)⁩ میں حرم کی مغربی دیوار پر باب الناظر کے اوپر قائم کیا گیا اور جس میں مدرسہ، عدالت، دارالحدیث اور کتب خانہ شامل تھے۔ آج مغربی دیوار کے ساتھ کھودی گئی سرنگ اس کے نیچے سے گزرتی ہے، جیسا کہ یونیسکو کے 1986 مشن نے بیان کیا {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}۔"
  fr: "La Tankiziyya à Jérusalem, collège de l\u2019émir Sayf al-Din Tankiz al-Nasiri, gouverneur de Damas, fondé en 728-729 H. ⁦(1328-1329)⁩ au-dessus de Bab al-Nazir sur le mur occidental du Haram, réunissant madrasa, tribunal, maison du hadith et bibliothèque. Le tunnel creusé le long du mur occidental passe désormais sous le bâtiment, comme le décrivit la mission de l\u2019UNESCO en 1986 {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
  es: "La Tankiziyya en Jerusalén, colegio del emir Sayf al-Din Tankiz al-Nasiri, gobernador de Damasco, fundado en 728-729 H. ⁦(1328-1329)⁩ sobre Bab al-Nazir en el muro occidental del Haram, reuniendo madraza, tribunal, casa de hadices y biblioteca. El túnel excavado junto al muro occidental pasa hoy bajo el edificio, como describió la misión de la UNESCO en 1986 {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
  tr: "Kudüs\u2019teki Tenkiziyye, Şam naibi Emir Seyfüddin Tenkiz en-Nasıri\u2019nin 728-729 ⁦(1328-1329)⁩ yılında Harem\u2019in batı duvarında Bab-ı Nazır üzerine kurduğu külliye; medrese, mahkeme, darü\u2019l-hadis ve kütüphaneyi birleştirir. Batı duvarı boyunca kazılan tünel bugün binanın altından geçer; UNESCO misyonu bunu 1986\u2019da tarif etti {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
  id: "Tankiziyya di Yerusalem, perguruan Amir Sayf al-Din Tankiz al-Nasiri, gubernur Damaskus, didirikan 728-729 H ⁦(1328-1329)⁩ di atas Bab al-Nazir di tembok barat Haram, menggabungkan madrasah, pengadilan, dar al-hadits dan perpustakaan. Terowongan yang digali di sepanjang tembok barat kini melintas di bawahnya, sebagaimana dilaporkan misi UNESCO pada 1986 {cite:meoc-mamluk-emblems}{cite:unesco-lemaire-jerusalem-1986}."
