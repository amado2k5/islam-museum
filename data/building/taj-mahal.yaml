label:
  ar: تاج محل
  en: Taj Mahal
summary:
  ar: "ضريح بناه شاه جهان في آكره لزوجه ممتاز محل، بدئ سنة 1632م وتم سنة 1654م بحسب بروكس، ويقوم على طرف بستانه المطل على نهر جمنا {cite:brookes-gardens-of-paradise-1987 p.152} {cite:brookes-gardens-of-paradise-1987 p.154}. وتصفه دائرة المعارف الإسلامية بأنه أعظم الأضرحة الأسرية المغولية، مبنيًا من الآجر ومكسوًّا بالرخام الأبيض المطعّم، وتذكر أن الضريح الرئيس اكتمل سنة 1638-1639م وأن المجمع كله انتهى سنة 1643م."
  en: "The mausoleum built by Shah Jahan at Agra for his wife Mumtaz Mahal, begun in 1632 and completed in 1654 according to Brookes, standing at the river edge of its garden above the Yamuna {cite:brookes-gardens-of-paradise-1987 p.152} {cite:brookes-gardens-of-paradise-1987 p.154}. The Encyclopaedia of Islam calls it the grandest of the Mughal dynastic mausoleums, a brick structure faced in inlaid white marble, and reports the main tomb finished in 1638-1639 and the whole complex in 1643."
  ur: "مقبرہ جسے شاہ جہاں نے آگرہ میں اپنی بیگم ممتاز محل کے لیے بنایا، بروکس کے مطابق 1632ء میں شروع اور 1654ء میں مکمل ہوا، اور جمنا کے اوپر اپنے باغ کے کنارے پر قائم ہے۔ دائرۃ المعارف اسلامیہ اسے مغل خاندانی مقبروں میں سب سے عظیم کہتی ہے، جو اینٹ کا ڈھانچہ ہے اور جڑاؤ سفید سنگ مرمر سے ڈھکا ہے، اور بتاتی ہے کہ مرکزی مقبرہ 1638-1639ء میں اور پورا احاطہ 1643ء میں مکمل ہوا۔"
