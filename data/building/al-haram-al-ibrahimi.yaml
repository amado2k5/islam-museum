label:
  ar: "الحرم الإبراهيمي"
  en: "the Ibrahimi Sanctuary (Haram al-Khalil)"
  ur: "ابراہیمی حرم ⁦(حرم الخلیل)⁩"
  fr: "Sanctuaire d’Ibrahim (Haram al-Khalil)"
  es: "el Santuario de Ibrahimi (Haram al-Khalil)"
  tr: "İbrahimî Harem (Haremü\u2019l-Halil)"
  id: "Haram Ibrahimi (Haram al-Khalil)"
summary:
  ar: "الحير العظيم على مغارة المكفيلة بالخليل؛ في خبر ابن فضل الله العمري أن إبراهيم اشترى الموضع من حبرى بخمسين درهماً فدفنت فيه سارة ثم إبراهيم لصيقها ثم رفقة وإسحاق ثم يعقوب وليقة، وأن سليمان بناه حين دلّه عمود نور من السماء إلى الأرض؛ ولم يكن له باب حتى فتحه المسلمون بعد الفتح، وبناؤه محكم في حائطه حجارة هائلة منها ما طوله سبعة وثلاثون شبراً. وفي قبلته باب ينزل منه بدرج كثيرة إلى سرداب ضيق تحت الأرض زحف فيه المؤلف بنفسه حتى انتهى إلى فجوة فيها ثلاث نصائب قبور يقال إنها قبر الخليل وزوجته وإسحاق، وقبور المشاهد فوق: قبرا إسحاق وزوجته في القبلة، وقبرا إبراهيم وسارة في الشمالي بقبتين متقابلتين، وقبر يعقوب في قبة مفردة. وحكى الهروي أنه في زمن الملك بردويل انخسف موضع في المغارة سنة 513هـ فدخلها فرنج بإذن الملك فوجدوا الأنبياء الثلاثة بأكفان بالية مستندين إلى حائط فجدد الملك أكفانهم وسد الموضع؛ ووراء الحرم قبر ينسب إلى يوسف قيل إن صوتاً نادى «دعوه خارج الحرم فعليه خراج مصر». ويُمد فيه كل يوم بعد العصر سماط يُفرق فيه الخبز على الواردين، وزاره المؤلف سنة 745هـ فأخبره المباشرون أنهم فرقوا في بعض ليالي العشر من ذي الحجة زيادة على ثلاثة عشر ألف رغيف، وله خدام لغربلة القمح وطحنه وعجنه وخبزه لا يبطلون ليلاً ولا نهاراً، وأهراء وطاحون وفرن متصلة، وقد أجرى الفرنج هذا السماط أيام احتلالهم وزادوا عليه {cite:umari-masalik-1924 p. 168-172}."
  en: "The great walled sanctuary over the Machpelah cave at Hebron; al-Umari records Abraham buying the plot from Habri for fifty dirhams, then Sarah, Abraham, Rebecca, Isaac, Jacob and Leah buried within, and Solomon raising the enclosure where a pillar of light touched down. It had no door until the Muslims opened one after the conquest; its masonry holds stones thirty-seven spans long. From a door in the qibla, steps descend to a cramped underground passage the author himself crawled through, ending at a chamber with three grave-markers said to be Abraham, his wife and Isaac; the shrine tombs above stand paired — Isaac and Rebecca in the qibla, Abraham and Sarah under facing domes to the north, Jacob under a lone dome. Al-Harawi tells that in King Baldwin's day a spot collapsed in 513 and Franks entered to find the three prophets' bodies leaning against a wall in worn shrouds with lamps at their heads; the king renewed the shrouds and sealed it. Behind the sanctuary lies a grave ascribed to Joseph, kept outside since a voice cried 'he bears Egypt's tribute'. Every afternoon a simat feeds all comers — over thirteen thousand loaves in one night of 745 — the Crusaders having kept and even enlarged the endowment {cite:umari-masalik-1924 p. 168-172}."
  fr: "La grande enceinte sacrée au-dessus de la grotte de Machpéla à Hébron ; al-Umari rapporte qu’Abraham acheta le terrain à Habri pour cinquante dirhams, que Sarah, Abraham, Rebecca, Isaac, Jacob et Léa y furent ensuite inhumés et que Salomon éleva l’enceinte là où une colonne de lumière avait touché terre. Elle n’avait pas de porte avant que les musulmans n’en ouvrent une après la conquête ; sa maçonnerie comprend des pierres longues de trente-sept empans. Depuis une porte du côté de la qibla, des marches descendent vers un étroit passage souterrain que l’auteur parcourut lui-même en rampant, jusqu’à une chambre contenant trois marqueurs de tombes attribuées à Abraham, son épouse et Isaac ; les tombeaux du sanctuaire au-dessus sont disposés par paires — Isaac et Rebecca du côté de la qibla, Abraham et Sarah sous des coupoles se faisant face au nord, Jacob sous une coupole isolée. Al-Harawi raconte qu’au temps du roi Baudouin, une partie s’effondra en 513 et que des Francs entrèrent et trouvèrent les corps des trois prophètes appuyés contre un mur dans des linceuls usés, avec des lampes à leurs têtes ; le roi renouvela les linceuls et fit sceller le lieu. Derrière le sanctuaire se trouve une tombe attribuée à Joseph, maintenue à l’extérieur depuis qu’une voix s’écria : « il doit le tribut de l’Égypte ». Chaque après-midi, un simat nourrit tous les arrivants — plus de treize mille pains en une nuit de 745 —, les croisés ayant maintenu et même accru la fondation {cite:umari-masalik-1924 p. 168-172}."
  es: "El gran santuario amurallado sobre la cueva de Machpelah en Hebrón; al-Umari registra que Abraham compró el terreno a Habri por cincuenta dirhams, luego Sara, Abraham, Rebeca, Isaac, Jacob y Lea fueron enterrados allí, y Salomón levantó el recinto donde tocó un pilar de luz. No tuvo puerta hasta que los musulmanes abrieron una después de la conquista; su mampostería sostiene piedras de treinta y siete tramos de largo. Desde una puerta en la qibla, escalones descienden a un estrecho pasaje subterráneo por el que el propio autor se arrastró, terminando en una cámara con tres lápidas que se dice que son Abraham, su esposa e Isaac; las tumbas del santuario arriba están emparejadas: Isaac y Rebeca en la qibla, Abraham y Sara bajo cúpulas enfrentadas al norte, Jacob bajo una cúpula solitaria. Al-Harawi dice que en tiempos del rey Balduino un lugar se derrumbó en 513 y Franks entró para encontrar los cuerpos de los tres profetas apoyados contra una pared en sudarios desgastados con lámparas en sus cabezas; El rey renovó las mortajas y lo selló. Detrás del santuario se encuentra una tumba atribuida a José, que permanece afuera desde que una voz clamó: «Él lleva el tributo de Egipto». Cada tarde, un simat alimenta a todos los que llegan; más de trece mil panes en una sola noche del año 745, ya que los cruzados mantuvieron e incluso aumentaron la dotación {cite:umari-masalik-1924 p. 168-172}."
  ur: "حبرون میں مکفیلہ غار کے اوپر دیواروں والا بڑا مقدس مقام۔ العمری ریکارڈ کرتا ہے کہ ابراہیم نے ہبری سے پچاس درہم میں پلاٹ خریدا، پھر سارہ، ابراہیم، ربیکا، اسحاق، یعقوب اور لیہ اس کے اندر دفن ہوئے، اور سلیمان اس دیوار کو اٹھا رہے تھے جہاں روشنی کا ایک ستون نیچے گرا تھا۔ اس کا کوئی دروازہ نہیں تھا جب تک کہ مسلمانوں نے فتح کے بعد ایک دروازہ نہ کھولا۔ اس کی چنائی میں سینتیس لمبے پتھر رکھے ہوئے ہیں۔ قبلہ کے ایک دروازے سے، سیڑھیاں اترتی ہیں ایک تنگ زیر زمین راستے کی طرف جو مصنف خود رینگتا ہے، ایک حجرے پر ختم ہوتا ہے جس میں تین قبروں کے نشانات ابراہیم، اس کی بیوی اور اسحاق تھے۔ اوپر مزار کے مقبرے جوڑے ہوئے ہیں — قبلہ میں اسحاق اور ربیکا، شمال کی طرف منہ والے گنبد کے نیچے ابراہیم اور سارہ، ایک تنہا گنبد کے نیچے جیکب۔ الحروی بتاتا ہے کہ بادشاہ بالڈون کے زمانے میں 513 میں ایک جگہ گر گئی تھی اور فرینکس تینوں انبیاء کی لاشوں کو دیوار سے ٹیک لگائے ہوئے کفنوں میں سروں پر چراغوں سے ٹیک لگائے ہوئے تھے۔ بادشاہ نے کفنوں کی تجدید کی اور اس پر مہر لگا دی۔ حرم کے پیچھے جوزف سے منسوب ایک قبر ہے جو باہر رکھی گئی تھی جب سے ایک آواز آئی کہ 'وہ مصر کا خراج پیش کرتا ہے'۔ ہر دوپہر ایک سمات تمام آنے والوں کو کھلاتی ہے — 745 کی ایک رات میں تیرہ ہزار سے زیادہ روٹیاں — صلیبیوں نے وقف رکھا اور بڑھا بھی دیا 168-172}۔"
  tr: "el-Halil\u2019de Makpelah mağarasının üzerindeki büyük surlu mabet; el-Ömeri, İbrahim\u2019in araziyi Habri\u2019den elli dirheme satın aldığını, ardından Sare, İbrahim, Rebeka, İshak, Yakub ve Lea\u2019nın oraya gömüldüğünü ve Süleyman\u2019ın gökten yere inen nur sütununun gösterdiği yerde haremi yükselttiğini kaydeder. Fethe kadar kapısı yoktu; taş işçiliğinde otuz yedi karış uzunluğunda taşlar vardır. Kıbledaki kapıdan merdivenler, yazarın bizzat sürünerek geçtiği dar bir yeraltı geçidine iner ve İbrahim, eşi ve İshak\u2019a ait olduğu söylenen üç mezar işaretiyle biten bir hücreye ulaşır; yukarıdaki mazar kabirleri çiftler hâlindedir — kıblede İshak ve Rebeka, kuzeyde karşılıklı kubbeler altında İbrahim ve Sare, tek kubbe altında Yakub. el-Haravi, Kral Baudouin zamanında 513\u2019te bir yerin çöktüğünü ve Frankların üç peygamberin bedenlerini yıpranmış kefenler içinde, başlarında kandillerle bulduklarını, kralın kefenleri yenileyip mühürlettiğini anlatır. Haremin arkasında Yusuf\u2019a atfedilen bir kabir vardır, 'Mısır\u2019ın haracını taşır' sesi duyulduğundan beri dışarıda tutulur. Her ikindi bir sımat gelen herkesi doyurur — 745\u2019te bir gecede on üç bin ekmekten fazlası — Haçlılar vakfı korumuş, hatta genişletmiştir {cite:umari-masalik-1924 p. 168-172}."
  id: "Kuil berdinding besar di atas gua Machpelah di Hebron; al-Umari mencatat Ibrahim membeli tanah itu dari Habri seharga lima puluh dirham, lalu Sarah, Ibrahim, Rebecca, Ishak, Yakub dan Lea dimakamkan di dalamnya, dan Sulaiman mendirikan pagarnya di mana tiang cahaya menyentuh bumi. Ia tak berpintu hingga kaum muslim membukanya setelah penaklukan; dindingnya memuat batu sepanjang tiga puluh tujuh jengkal. Dari pintu di sisi kiblat, tangga turun ke lorong bawah tanah sempit yang dirangkaki penulis sendiri, berakhir di ruang berisi tiga penanda makam yang dikatakan Ibrahim, istrinya dan Ishak; makam-makam di atas tersusun berpasangan — Ishak dan Rebecca di kiblat, Ibrahim dan Sarah di bawah kubah berhadapan di utara, Yakub di bawah kubah sendiri. Al-Harawi mengisahkan pada zaman Raja Baldwin sebuah titik runtuh pada 513 dan kaum Franka menemukan jenazah tiga nabi bersandar ke dinding dalam kain kafan usang dengan pelita di kepala mereka; raja memperbarui kain itu dan menyegel tempatnya. Di belakang kuil ada makam yang dinisbatkan kepada Yusuf, dibiarkan di luar sejak terdengar suara 'ia menanggung upeti Mesir'. Setiap sore simat memberi makan semua yang datang — lebih dari tiga belas ribu roti dalam satu malam tahun 745 — para Tentara Salib mempertahankan bahkan memperbesar wakafnya {cite:umari-masalik-1924 p. 168-172}."
