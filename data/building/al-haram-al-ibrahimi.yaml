label: { ar: "الحرم الإبراهيمي", en: "the Ibrahimi Sanctuary (Haram al-Khalil)" }
summary:
  ar: "الحير العظيم على مغارة المكفيلة بالخليل؛ في خبر ابن فضل الله العمري أن إبراهيم اشترى الموضع من حبرى بخمسين درهماً فدفنت فيه سارة ثم إبراهيم لصيقها ثم رفقة وإسحاق ثم يعقوب وليقة، وأن سليمان بناه حين دلّه عمود نور من السماء إلى الأرض؛ ولم يكن له باب حتى فتحه المسلمون بعد الفتح، وبناؤه محكم في حائطه حجارة هائلة منها ما طوله سبعة وثلاثون شبراً. وفي قبلته باب ينزل منه بدرج كثيرة إلى سرداب ضيق تحت الأرض زحف فيه المؤلف بنفسه حتى انتهى إلى فجوة فيها ثلاث نصائب قبور يقال إنها قبر الخليل وزوجته وإسحاق، وقبور المشاهد فوق: قبرا إسحاق وزوجته في القبلة، وقبرا إبراهيم وسارة في الشمالي بقبتين متقابلتين، وقبر يعقوب في قبة مفردة. وحكى الهروي أنه في زمن الملك بردويل انخسف موضع في المغارة سنة 513هـ فدخلها فرنج بإذن الملك فوجدوا الأنبياء الثلاثة بأكفان بالية مستندين إلى حائط فجدد الملك أكفانهم وسد الموضع؛ ووراء الحرم قبر ينسب إلى يوسف قيل إن صوتاً نادى «دعوه خارج الحرم فعليه خراج مصر». ويُمد فيه كل يوم بعد العصر سماط يُفرق فيه الخبز على الواردين، وزاره المؤلف سنة 745هـ فأخبره المباشرون أنهم فرقوا في بعض ليالي العشر من ذي الحجة زيادة على ثلاثة عشر ألف رغيف، وله خدام لغربلة القمح وطحنه وعجنه وخبزه لا يبطلون ليلاً ولا نهاراً، وأهراء وطاحون وفرن متصلة، وقد أجرى الفرنج هذا السماط أيام احتلالهم وزادوا عليه {cite:umari-masalik-1924 p. 168-172}."
  en: "The great walled sanctuary over the Machpelah cave at Hebron; al-Umari records Abraham buying the plot from Habri for fifty dirhams, then Sarah, Abraham, Rebecca, Isaac, Jacob and Leah buried within, and Solomon raising the enclosure where a pillar of light touched down. It had no door until the Muslims opened one after the conquest; its masonry holds stones thirty-seven spans long. From a door in the qibla, steps descend to a cramped underground passage the author himself crawled through, ending at a chamber with three grave-markers said to be Abraham, his wife and Isaac; the shrine tombs above stand paired — Isaac and Rebecca in the qibla, Abraham and Sarah under facing domes to the north, Jacob under a lone dome. Al-Harawi tells that in King Baldwin's day a spot collapsed in 513 and Franks entered to find the three prophets' bodies leaning against a wall in worn shrouds with lamps at their heads; the king renewed the shrouds and sealed it. Behind the sanctuary lies a grave ascribed to Joseph, kept outside since a voice cried 'he bears Egypt's tribute'. Every afternoon a simat feeds all comers — over thirteen thousand loaves in one night of 745 — the Crusaders having kept and even enlarged the endowment {cite:umari-masalik-1924 p. 168-172}."
