  tr: "Halep kırsalındaki el-Ansari köyündeki Saad el-Ensari türbesinin ön kartı — bir türbe ve Memlük yazıtı, İslami Yazıtlar Sözlüğü'ne göre 748 ile 920 Hicri yılları arasında tarihlenmektedir."
  id: "Kartu awal makam Saad al-Ansari di desa al-Ansari di pedesaan Aleppo — sebuah makam dan prasasti Mamluk-nya—mencakup antara tahun 748 dan 920 H, menurut Kamus Prasasti Islam."
