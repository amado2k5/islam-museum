summary:
  ar: "بطاقة أولية لجامع الكتبية بالمرابطين في مراكش — الجامع الموحدي الكبير الذي شيّدته الدولة الموحدية في القرن الثاني عشر؛ نقوشه المسجلة في قاموس النقوش الإسلامية تشمل نصاً دينياً ونعوتاً ونص ترميم."
  en: "Draft card for the Kutubiyya Mosque of Marrakesh — the great Almohad congregational mosque built in the twelfth century; its inscriptions recorded in the Islamic Epigraphy Thesaurus include a religious text, votive texts and a restoration inscription."
  fr: "Notice provisoire : mosquée Kutubiyya de Marrakech, grande mosquée du vendredi almohade bâtie au XIIe siècle ; ses inscriptions enregistrées dans l’Islamic Epigraphy Thesaurus comprennent un texte religieux, des textes votifs et une inscription de restauration."
  es: "Ficha de borrador para la Mezquita Kutubiyya de Marrakech, la gran mezquita congregacional almohade construida en el siglo XII; sus inscripciones registradas en el Tesauro de Epigrafía Islámica incluyen un texto religioso, textos votivos y una inscripción de restauración."
  ur: "مراکش کی کتوبیہ مسجد کے لیے ڈرافٹ کارڈ - بارہویں صدی میں تعمیر ہونے والی عظیم الموحد اجتماعی مسجد؛ اسلامی ایپی گرافی تھیسورس میں درج اس کے نوشتہ جات میں ایک مذہبی متن، ووٹی متن اور ایک بحالی نوشتہ شامل ہے۔"
  tr: "Marakeş'teki Almoravid Almoravid Camii'nin ön kartı — on ikinci yüzyılda Almohad devleti tarafından inşa edilen Büyük Almohad Camii; İslami Yazıtlar Sözlüğü'nde kaydedilen yazıtlar dini metin, tanımlar ve restorasyon metinlerini içermektedir."
  id: "Kartu pendahuluan Masjid Almoravid Almoravid di Marrakech — Masjid Almohad Besar yang dibangun oleh negara Almohad pada abad kedua belas; prasasti-prasasti yang tercatat dalam Kamus Prasasti Islam mencakup teks keagamaan, deskripsi, dan teks restorasi."
