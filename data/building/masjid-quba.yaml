summary:
  ar: "مسجد في قباء، قرية من أرض المدينة، تؤرخ ويكيداتا بناءه بسنة 622م. تنقل دائرة المعارف الإسلامية رواية أنه أول مسجد أسسه المسلمون، وتعرض روايتين في تأسيسه: أن النبي وجده قائماً عند نزوله في قباء في هجرته، أو أنه أسسه بنفسه. وتذكر أن النبي كان يزوره كل سبت."
  en: "A mosque in Quba, a village in the territory of Medina, dated by Wikidata to 622 CE. The Encyclopaedia of Islam records the tradition that it was the first mosque founded by Muslims and sets out two accounts of its founding: that the Prophet found it already built when he stopped at Quba on his hijra, or that he founded it himself. It adds that he is said to have visited it every Saturday."
  ur: "قبا کی ایک مسجد، جو مدینہ کی سرزمین کا ایک گاؤں تھا؛ ویکی ڈیٹا اس کی تعمیر 622ء بتاتا ہے۔ انسائیکلوپیڈیا آف اسلام یہ روایت نقل کرتا ہے کہ یہ مسلمانوں کی پہلی قائم کردہ مسجد تھی اور تاسیس کی دو روایتیں بیان کرتا ہے: یا نبی نے ہجرت میں قبا پہنچ کر اسے بنی ہوئی پایا، یا انہوں نے خود اسے قائم کیا۔ روایت ہے کہ وہ ہر ہفتے وہاں جاتے تھے۔"
