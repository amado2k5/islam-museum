label: { ar: "الضريح التذكاري لسليمان القانوني في سگتوار", en: "Memorial Tomb of Süleyman the Magnificent, Szigetvár", fr: "Tombe commémorative de Soliman, Szigetvár", ur: "سلیمان قانونی کا یادگاری مقبرہ، سگتوار", es: "Tumba conmemorativa de Solimán el Magnífico, Szigetvár" }
summary:
  ar: "ضريح تذكاري أقيم بعد فتح سگتوار سنة 1566 حيث دُفنت أحشاء سليمان القانوني، ومعه مسجد وتكايا وثكنات، هدمه النمساويون بعد 1683، وكشفت حفريات تركية مجرية بين 2015 و2017 أسسه على تل الكروم {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}."
  en: "A memorial tomb raised after the fall of Szigetvár in 1566 where Süleyman's entrails were buried, with a mosque, lodges and barracks; demolished by the Austrians after 1683, its foundations were found by Turkish-Hungarian excavations on Vineyard Hill in 2015-17 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}."
  fr: "Élevée après 1566 sur ses entrailles, avec mosquée, couvents et casernes ; détruite après 1683, fondations retrouvées aux fouilles turco-hongroises de Vineyard Hill en 2015–2017. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}"
  ur: "1566ء میں سگتوار کی فتح کے بعد جہاں سلیمان قانونی کی آنتیں دفن ہوئیں وہاں بنا یادگاری مقبرہ، ساتھ مسجد، تکیے اور بیرکیں؛ 1683ء کے بعد آسٹریائیوں نے ڈھایا؛ 2015–17ء کی ترک ہنگری کھدائیوں میں انگوری پہاڑی پر بنیادیں ملیں {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}۔"
  es: "Una tumba conmemorativa erigida tras la caída de Szigetvár en 1566, donde fueron enterradas las entrañas de Süleyman, con una mezquita, logias y cuarteles; demolida por los austriacos después de 1683, sus cimientos fueron encontrados por excavaciones turco-húngaras en Vineyard Hill en 2015-17 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}."
