summary:
  ar: "ضريح تذكاري أقيم بعد فتح سگتوار سنة 1566 حيث دُفنت أحشاء سليمان القانوني، ومعه مسجد وتكايا وثكنات، هدمه النمساويون بعد 1683، وكشفت حفريات تركية مجرية بين 2015 و2017 أسسه على تل الكروم {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}."
  en: "A memorial tomb raised after the fall of Szigetvár in 1566 where Süleyman's entrails were buried, with a mosque, lodges and barracks; demolished by the Austrians after 1683, its foundations were found by Turkish-Hungarian excavations on Vineyard Hill in 2015-17 {cite:yilmaz-ottoman-architecture-hungary-2024 p. 155}."
