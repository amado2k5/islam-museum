summary:
  ar: "البيمارستان العضدي ببغداد، المستشفى الذي بناه عضد الدولة الديلمي؛ افتُتح في بداية ربيع الآخر سنة ثنتين وسبعين وثلثمائة وأُنفق عليه كل ما يصلحه، وجُمع فيه الأطباء والأدوية والقوّام والخدم والأواني والثياب وكل ما يحتاج إليه المرضى {cite:muntazam-ibn-al-jawzi j.7 p.118-119}. وقفت على من أسود من أهل البيمارستان وحسن الرعاية لهم؛ وأعطى الفقراء ما يخرج منه من الثياب والأواني {cite:muntazam-ibn-al-jawzi j.7 p.119}."
  en: "The 'Adudi Bimaristan of Baghdad, the hospital 'Adud al-Dawla built: opened at the start of Rabi' II 372 with everything spent that could perfect it — physicians gathered in it, medicines, wardens, servants, vessels and clothes, all that the sick need — and the poor were given the clothes and vessels that came out of it {cite:muntazam-ibn-al-jawzi j.7 p.118-119}."
  fr: "Le bimaristan Adudi de Bagdad, hôpital construit par Adud al-Dawla : ouvert au début de rabi II 372, avec toutes les dépenses nécessaires à son perfectionnement — médecins réunis, médicaments, gardiens, serviteurs, ustensiles et vêtements, tout ce dont les malades ont besoin — et dont les vêtements et ustensiles sortants étaient donnés aux pauvres {cite:muntazam-ibn-al-jawzi j.7 p.118-119}."
  es: "El 'Adudi Bimaristan de Bagdad, el hospital construido por 'Adud al-Dawla: se inauguró a principios de Rabi' II 372 con todo lo necesario para perfeccionarlo: médicos reunidos en él, medicinas, guardianes, sirvientes, recipientes y ropa, todo lo que los enfermos necesitaban; y a los pobres se les daba la ropa y los recipientes que salían de él {cite:muntazam-ibn-al-jawzi j.7 p.118-119}."
  ur: "بغداد کا عدودی بیمارستان، ہسپتال 'عود الدولہ نے تعمیر کیا: ربیع دوم کے آغاز میں کھولا گیا' ہر اس چیز سے خرچ کیا گیا جو اسے مکمل کر سکتا تھا - اس میں طبیب جمع تھے، دوائیں، وارڈن، نوکر، برتن اور کپڑے، وہ سب کچھ جو بیماروں کو درکار ہوتا تھا- اور غریبوں کو کپڑے اور برتن اس میں سے دیے جاتے تھے۔ {حوالہ:منتظم ابن الجوزی ج7 ص118-119}۔"
  tr: "Bağdat'taki El-Adhudi Hastanesi, Adud el-Devle el-Daylami tarafından inşa edilen hastane, 372 Hicri yılında Rabi'el-Tani döneminin başında açıldı ve tüm onarımlar buraya harcandı. Doktorları, ilaçları, bakıcıları, hizmetçileri, çatal gereçlerini, giysileri ve hastaların ihtiyaç duyduğu her şeyi topladı {cite:Muntazam-ibn-al-jawzi J.7 s.118-119}. Hastanedeki siyahi insanları ziyaret ettim ve onlara iyi baktım; fakirlere çıkan kıyafet ve gereçleri verdi {cite:Muntazam-ibn-al-jawzi J.7 s.119}."
  id: "Rumah Sakit Al-'Adhudi di Baghdad, rumah sakit yang dibangun oleh Adud al-Dawla al-Daylami, diresmikan pada awal Rabi' al-Thani pada tahun 372 H, dan semua perbaikan dihabiskan untuk itu. Ia mengumpulkan dokter, obat-obatan, perawat, pelayan, peralatan, pakaian, dan segala yang dibutuhkan pasien {cite:Muntazam-ibn-al-jawzi J.7 hlm.118-119}. Saya mengunjungi orang-orang kulit hitam di rumah sakit dan merawat mereka dengan baik; ia memberikan pakaian dan peralatan yang keluar dari rumah sakit kepada orang miskin {cite:Muntazam-ibn-al-jawzi J.7 hlm.119}."
