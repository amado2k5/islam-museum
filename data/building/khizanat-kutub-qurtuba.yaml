id: building/khizanat-kutub-qurtuba
class: building
kind: library
label: { ar: "خزانة كتب قصر قرطبة", en: "Library of the Córdoba Palace", fr: "Bibliothèque du palais de Cordoue", es: "Biblioteca del Palacio de Córdoba", ur: "قرطبہ محل کی لائبریری", tr: "Córdoba Sarayı Kitap Kütüphanesi", id: "Perpustakaan Buku Istana Córdoba" }
summary:
  ar: "خزانة العلوم والكتب بدار بني مروان بقرطبة؛ بلغت في أيام الحكم المستنصر ما لم تجمعه مكتبة ملك قبله — أربع وأربعون فهرسة في كل فهرسة عشرون ورقة ليس فيها إلا أسماء الدواوين — وكان يبعث رجالاً من التجار بأموال إلى الأقطار لشرائها حتى جلب ما لم يعهده الأندلسيون، وجمع بداره الحذاق في صناعة النسخ والمهرة في الضبط والإجادة في التجليد؛ ولم تزل الكتب بالقصر إلى أن بيع أكثرها في حصار البربر بأمر الحاجب واضح مولى المنصور ونهب ما بقي عند اقتحامهم قرطبة {cite:nafh-tib-maqqari pp. 421–422}."
  en: "The royal library of Córdoba's palace: under al-Hakam II its catalogues alone filled forty-four volumes of twenty folios each — titles only; agents bought manuscripts in every land, and the palace kept guilds of copyists, collators and binders. It stood until the Berber siege, when the hajib Wadih had most of it sold and the rest looted {cite:nafh-tib-maqqari pp. 421–422}."
  fr: "Bibliothèque royale du palais de Cordoue : sous al-Hakam II, ses seuls catalogues remplissaient quarante-quatre volumes de vingt feuillets chacun, contenant uniquement les titres ; des agents achetaient des manuscrits dans tous les pays, et le palais entretenait des corps de copistes, collationneurs et relieurs. Elle subsista jusqu’au siège berbère, quand le hajib Wadih en fit vendre la plupart des livres, le reste étant pillé {cite:nafh-tib-maqqari pp. 421–422}."
  es: "La biblioteca real del palacio de Córdoba: bajo el reinado de al-Hakam II, sus catálogos ocupaban cuarenta y cuatro volúmenes de veinte folios cada uno —solo los títulos—; agentes compraban manuscritos en todas partes, y el palacio mantenía gremios de copistas, cotejadores y encuadernadores. Permaneció en pie hasta el asedio bereber, cuando el hajib Wadih vendió la mayor parte y saqueó el resto {cite:nafh-tib-maqqari pp. 421–422}."
  ur: "قرطبہ کے محل کی شاہی لائبریری: الحکم دوم کے تحت اس کے کیٹلاگوں نے اکیلے بیس فولیو کی 44 جلدیں بھری ہیں - صرف عنوانات؛ ایجنٹوں نے ہر ملک میں مخطوطات خریدے، اور محل میں نقل کرنے والوں، جمع کرنے والوں اور باندنے والوں کی جماعتیں رکھی گئیں۔ یہ بربر کے محاصرے تک قائم رہا، جب حاجب ودیہ نے اس کا بیشتر حصہ بیچ دیا تھا اور باقی نے لوٹ لیا تھا {حوالہ: نفح تبع مقری صفحہ 421-422}۔"
  tr: "Cordoba'daki Banu Marwan Hanedanı'ndaki bilim ve kitap hazinesi; el-Mustansir döneminde, kendisinden önceki bir kralın kütüphanesinin toplamadığı şeylere ulaştı—her katalogda kırk dört katalog, yirmi sayfa, sadece diwanların isimlerini içeren. Parayla diğer topraklara tüccarlar göndererek onu satın almak için gönderdi, Endülüslülerin alışık olmadığı şeyleri geri getirdi. Ciltlemede ve ciltlemede ustaca yetenekli kopyalama profesyonelleri topladı; kitapların çoğu, Berberilerin kuşatması sırasında el-Mansur'un özgürleştirilmiş kölesi Wadih odasının emriyle satılana kadar sarayda kaldı; geriye kalanlar ise Cordoba'yı bastığında kaldı. {cite:nafh-tib-maqqari, s. 421–422}."
  id: "Perbendaharaan ilmu pengetahuan dan buku di Rumah Banu Marwan di Cordoba; pada masa al-Mustansir, jumlahnya tidak dikumpulkan oleh perpustakaan raja sebelumnya—empat puluh empat katalog dalam setiap katalog, dua puluh halaman, hanya berisi nama-nama para diwan. Ia mengirim pedagang dengan uang ke negeri lain untuk membelinya, membawa pulang apa yang tidak biasa diterima orang Andalusia. Ia mengumpulkan para ahli penyalin, ahli dalam penjilidan, dan penguasaan penjilidan; sebagian besar buku tetap berada di istana hingga sebagian besar dijual selama pengepungan Berber atas perintah kamar Wadih, budak yang dibebaskan dari al-Mansur, dan sisa yang tersisa saat mereka menyerbu Cordoba {cite:nafh-tib-maqqari, hlm. 421–422}."
