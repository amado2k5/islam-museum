label: { ar: "خزانة كتب قصر قرطبة", en: "Library of the Córdoba Palace" }
summary:
  ar: "خزانة العلوم والكتب بدار بني مروان بقرطبة؛ بلغت في أيام الحكم المستنصر ما لم تجمعه مكتبة ملك قبله — أربع وأربعون فهرسة في كل فهرسة عشرون ورقة ليس فيها إلا أسماء الدواوين — وكان يبعث رجالاً من التجار بأموال إلى الأقطار لشرائها حتى جلب ما لم يعهده الأندلسيون، وجمع بداره الحذاق في صناعة النسخ والمهرة في الضبط والإجادة في التجليد؛ ولم تزل الكتب بالقصر إلى أن بيع أكثرها في حصار البربر بأمر الحاجب واضح مولى المنصور ونهب ما بقي عند اقتحامهم قرطبة {cite:nafh-tib-maqqari pp. 421–422}."
  en: "The royal library of Córdoba's palace: under al-Hakam II its catalogues alone filled forty-four volumes of twenty folios each — titles only; agents bought manuscripts in every land, and the palace kept guilds of copyists, collators and binders. It stood until the Berber siege, when the hajib Wadih had most of it sold and the rest looted {cite:nafh-tib-maqqari pp. 421–422}."
