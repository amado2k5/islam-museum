id: building/bayt-al-hikma
class: building
kind: library
label:
  ar: بيت الحكمة ⁦(خزانة الحكمة)⁩
  en: Bayt al-Hikma — the House of Wisdom
  fr: "Bayt al-Hikma — la Maison de la Sagesse"
  es: "Bayt al-Hikma — la Casa de la Sabiduría"
  ur: "بیت الحکمہ - حکمت کا گھر"
summary:
  ar: "خزانة الحكمة أو بيت الحكمة ببغداد، أكبر مكتبة نُقل خبرها من العصر العباسي الأول؛ وضع الرشيد نواتها ونمّاها المأمون وقوّاها، وقد ولى الرشيد يوحنا بن ماسويه ترجمة الكتب الطبية القديمة التي وُجدت في بلاد الروم ورتب له كتاباً حذاقاً يكتبون بين يديه، وكان في خزانته أبو سهل الفضل بن نوبخت ينقل من الفارسية إلى العربية كتب الحكمة، وعلان الشعوبي ينسخ للرشيد والمأمون والبرامكة، ثم وسّعها المأمون فبعث إلى ملك الروم يستأذنه في إنفاذ ما يختار من العلوم القديمة فأخرج في طلبها الحجاج بن مطر وابن البطريق وسلماً صاحب بيت الحكمة، وجعل سهل بن هارون خازناً لخزائنها، وقد بقي نظامها وموضعها على وجه التعيين محفوفين بالغموض."
  en: "The House of Wisdom at Baghdad, the greatest library whose report survives from the first Abbasid age: al-Rashid laid its nucleus and al-Ma'mun enlarged and strengthened it. Al-Rashid put Yuhanna ibn Masawayh over the translation of the ancient medical books found in Byzantine lands with skilled scribes writing before him; Abu Sahl al-Fadl ibn Nawbakht rendered Persian wisdom-books into Arabic in its khizana, and Allan al-Shu'ubi copied for al-Rashid, al-Ma'mun and the Barmakids. Al-Ma'mun widened it, sending to the Byzantine emperor for the ancient sciences an embassy of al-Hajjaj ibn Matar, Ibn al-Bitriq and Salm the master of the House, and making Sahl ibn Harun keeper of its treasuries — though its precise organisation and site remain wrapped in obscurity."
  fr: "La Maison de la Sagesse à Bagdad, la plus grande bibliothèque dont le témoignage nous soit parvenu de la première période abbasside : al-Rashid en posa le noyau, al-Ma'mun l'agrandit et la renforça. Al-Rashid confia à Yuhanna ibn Masawayh la traduction des anciens livres de médecine trouvés en terre byzantine, avec d'habiles scribes écrivant sous sa dictée ; Abu Sahl al-Fadl ibn Nawbakht y rendait en arabe les livres de sagesse persans, et Allan al-Shu'ubi copiait pour al-Rashid, al-Ma'mun et les Barmakides. Al-Ma'mun l'élargit, envoyant auprès de l'empereur byzantin, en quête des sciences anciennes, une ambassade formée d'al-Hajjaj ibn Matar, d'Ibn al-Bitriq et de Salm, maître de la Maison, et fit de Sahl ibn Harun le gardien de ses trésors — même si son organisation exacte et son emplacement restent enveloppés d'obscurité."
  es: "La Casa de la Sabiduría en Bagdad, la mayor biblioteca de la que se conservan registros de la primera época abasí: al-Rashid sentó sus bases y al-Ma'mun la amplió y consolidó. Al-Rashid puso a Yuhanna ibn Masawayh a cargo de la traducción de los antiguos libros de medicina hallados en tierras bizantinas, con escribas expertos trabajando ante él; Abu Sahl al-Fadl ibn Nawbakht tradujo libros de sabiduría persas al árabe en su biblioteca, y Allan al-Shu'ubi copió para al-Rashid, al-Ma'mun y los Barmakids. Al-Ma'mun la amplió aún más, enviando al emperador bizantino para las ciencias antiguas una embajada de al-Hajjaj ibn Matar, Ibn al-Bitriq y Salm como maestro de la Casa, y nombrando a Sahl ibn Harun custodio de sus tesoros, aunque su organización y ubicación exactas siguen siendo un misterio."
  ur: "بغداد میں ہاؤس آف وزڈم، سب سے بڑا کتب خانہ جس کی رپورٹ پہلے عباسی دور سے موجود ہے: الرشید نے اس کا مرکز بنایا اور المامون نے اسے بڑھایا اور مضبوط کیا۔ الرشید نے یوحنا بن مساویہ کو بازنطینی سرزمینوں میں پائی جانے والی قدیم طبی کتابوں کے ترجمے پر ڈالا جو اس سے پہلے ماہر کاتب لکھتے تھے۔ ابو سہل الفضل بن نوبخت نے اپنے خزانہ میں فارسی حکمت کی کتابوں کو عربی میں ترجمہ کیا، اور علان الشوبی نے الرشید، المامون اور برمکوں کے لیے نقل کیا۔ المامون نے اسے وسیع کیا، بازنطینی شہنشاہ کو قدیم علوم کے لیے الحجاج ابن مطر، ابن البیترک اور سالم کا سفارت خانہ بھیجا، اور سہل بن ہارون کو اس کے خزانوں کا نگران بنایا - حالانکہ اس کی قطعی تنظیم اور جگہ مخفی ہے۔"
