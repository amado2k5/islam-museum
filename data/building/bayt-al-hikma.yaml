label:
  ar: بيت الحكمة (خزانة الحكمة)
  en: Bayt al-Hikma — the House of Wisdom
summary:
  ar: "خزانة الحكمة أو بيت الحكمة ببغداد، أكبر مكتبة نُقل خبرها من العصر العباسي الأول؛ وضع الرشيد نواتها ونمّاها المأمون وقوّاها، وقد ولى الرشيد يوحنا بن ماسويه ترجمة الكتب الطبية القديمة التي وُجدت في بلاد الروم ورتب له كتاباً حذاقاً يكتبون بين يديه، وكان في خزانته أبو سهل الفضل بن نوبخت ينقل من الفارسية إلى العربية كتب الحكمة، وعلان الشعوبي ينسخ للرشيد والمأمون والبرامكة، ثم وسّعها المأمون فبعث إلى ملك الروم يستأذنه في إنفاذ ما يختار من العلوم القديمة فأخرج في طلبها الحجاج بن مطر وابن البطريق وسلماً صاحب بيت الحكمة، وجعل سهل بن هارون خازناً لخزائنها، وقد بقي نظامها وموضعها على وجه التعيين محفوفين بالغموض."
  en: "The House of Wisdom at Baghdad, the greatest library whose report survives from the first Abbasid age: al-Rashid laid its nucleus and al-Ma'mun enlarged and strengthened it. Al-Rashid put Yuhanna ibn Masawayh over the translation of the ancient medical books found in Byzantine lands with skilled scribes writing before him; Abu Sahl al-Fadl ibn Nawbakht rendered Persian wisdom-books into Arabic in its khizana, and Allan al-Shu'ubi copied for al-Rashid, al-Ma'mun and the Barmakids. Al-Ma'mun widened it, sending to the Byzantine emperor for the ancient sciences an embassy of al-Hajjaj ibn Matar, Ibn al-Bitriq and Salm the master of the House, and making Sahl ibn Harun keeper of its treasuries — though its precise organisation and site remain wrapped in obscurity."
