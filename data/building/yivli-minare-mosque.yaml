summary:
  ar: "بطاقة أولية لجامع المنارة المجدوّلة ⁦(يفلي منارة)⁩ بأنطاليا، المسجد السلجوقي الذي بناه علاء الدين كيقباد في القرن الثالث عشر وتشتهر مئذنته المضلعة بالطوب الأزرق؛ من معالم العمارة السلجوقية في الأناضول ولم تُراجع الصفحة بعد."
  en: "Draft card for the Yivli Minare (fluted-minaret) Mosque of Antalya, the Seljuk foundation of Ala al-Din Kayqubad in the thirteenth century famed for its brick fluted minaret, per the cited survey; the page not yet checked."
  fr: "Notice provisoire : Mosquée d’Yivli Minare (minaret cannelé), Antalya, fondation seldjoukide d’Ala al-Din Kayqubad au XIIIe siècle, célèbre pour son minaret cannelé en brique, selon l’étude citée. La page n’est pas encore vérifiée."
  es: "Ficha preliminar de la mezquita Yivli Minare (minarete estriado) de Antalya, fundada por los selyúcidas en el siglo XIII por Ala al-Din Kayqubad, famosa por su minarete estriado de ladrillo, según el estudio citado; la página aún no ha sido revisada."
  ur: "انطالیہ کی مسجد Yivli Minare ⁦(بانسری مینار)⁩ کے لیے ڈرافٹ کارڈ، تیرہویں صدی میں علاء الدین کیقباد کی سلجوک فاؤنڈیشن جو اینٹوں والے مینار کے لیے مشہور تھی، حوالہ کردہ سروے کے مطابق؛ صفحہ ابھی تک چیک نہیں ہوا ہے۔"
  tr: "Antalya'daki Elmas Biçimli Minare'nin (Yevli Minaresi) ön kartı; 13. yüzyılda Aladdin Kaykubad tarafından inşa edilen Selçuklu camisi, mavi tuğlalarıyla ünlüdür; Anadolu'daki Selçuklu mimarisinin simgelerinden biridir ve henüz gözden geçirilmemiştir."
  id: "Kartu awal Masjid Menara Berbentuk Berlian (Yevli Menaret) di Antalya, masjid Seljuk yang dibangun oleh Aladdin Kaykubad pada abad ke-13, yang menara beralur terkenal dengan batu bata birunya; masjid ini merupakan landmark arsitektur Seljuk di Anatolia dan belum pernah ditinjau."
