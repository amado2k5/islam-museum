summary:
  ar: "مسجد بناه اثنا عشر رجلاً سمّاهم ابن إسحاق قرب المدينة، وطلبوا من النبي وهو يتجهز إلى تبوك أن يصلي فيه فأجّلهم إلى عودته؛ فلما نزل بذي أوان قافلاً أمر بهدمه وإحراقه، ونزل فيهم قرآن. ويُعرف أيضاً بمسجد الشقاق."
  en: A mosque near Medina built by twelve men named by Ibn Ishaq; they asked the Prophet, then preparing for Tabuk, to pray in it, and he put them off until his return. On his way back he stopped at Dhi Awan and ordered it demolished and burned, and Qur'an was revealed about them. It is also called Masjid al-Shiqaq.
