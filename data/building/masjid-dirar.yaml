summary:
  ar: "مسجد بناه اثنا عشر رجلاً سمّاهم ابن إسحاق قرب المدينة، وطلبوا من النبي وهو يتجهز إلى تبوك أن يصلي فيه فأجّلهم إلى عودته؛ فلما نزل بذي أوان قافلاً أمر بهدمه وإحراقه، ونزل فيهم قرآن. ويُعرف أيضاً بمسجد الشقاق."
  en: A mosque near Medina built by twelve men named by Ibn Ishaq; they asked the Prophet, then preparing for Tabuk, to pray in it, and he put them off until his return. On his way back he stopped at Dhi Awan and ordered it demolished and burned, and Qur'an was revealed about them. It is also called Masjid al-Shiqaq.
  fr: "Mosquée près de Médine bâtie par douze hommes nommés par Ibn Ishaq ; ils demandèrent au Prophète préparant Tabuk d’y prier, mais il reporta à son retour. Sur le chemin du retour, arrêté à Dhi Awan, il ordonna sa démolition et son incendie, et une révélation coranique les concerna. Elle est aussi dite Masjid al-Shiqaq."
  es: "Una mezquita cerca de Medina, construida por doce hombres mencionados por Ibn Ishaq, le pidió al Profeta, que se preparaba para ir a Tabuk, que rezara en ella. Él les pidió permiso para esperar hasta su regreso. De camino, se detuvo en Dhi Awan y ordenó que la demolieran e incendiaran, y el Corán reveló información sobre ella. También se la conoce como Masjid al-Shiqaq."
  ur: "مدینہ کے قریب ایک مسجد جسے بارہ آدمیوں نے ابن اسحاق کے نام سے بنایا تھا۔ انہوں نے نبی سے تبوک کی تیاری کی، اس میں نماز پڑھنے کو کہا، اور آپ نے انہیں واپس آنے تک روک دیا۔ واپسی میں وہ ذی اعوان پر رکا اور اسے گرانے اور جلانے کا حکم دیا اور ان کے بارے میں قرآن نازل ہوا۔ اسے مسجد الشیق بھی کہا جاتا ہے۔"
  tr: "Medine yakınlarında on iki kişi olan İbn İshaq tarafından inşa edilen bir cami. Peygamber, Tabuk'a gitmeye hazırlanırken orada namaz kılmasını istediler, o da onları geri dönene kadar erteledi; kervanla Dhu Awan'a vardığında yıkılıp yakılmasını emretti, aralarında bir Kur'an okundu. Burası aynı zamanda Çekingen Camii olarak da bilinir."
  id: "Sebuah masjid dibangun oleh dua belas orang bernama Ibn Ishaq dekat Madinah. Mereka meminta Nabi, saat ia bersiap pergi ke Tabuk, untuk shalat di sana, sehingga ia menunda mereka sampai kembali; ketika tiba di Dhu Awan dengan sebuah karavan, ia memerintahkan pembongkaran dan pembakarannya, dan sebuah Al-Qur'an dibacakan di antara mereka. Masjid ini juga dikenal sebagai Masjid Perpecahan."
