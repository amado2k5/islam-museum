    summary: { ar: "يروي ابن إسحاق أن أصحاب المسجد أتوا النبي وهو يتجهز إلى تبوك وقالوا إنهم بنوه لذي العلة والحاجة والليلة المطيرة والشاتية، فأجّلهم إلى عودته، ثم لما بلغه خبره أمر بهدمه وإحراقه، ونزل فيهم قرآن (9:107). ويفصّل المفسرون السنة غرض الباني ونيته؛ وهذا التفصيل يحتاج إلى مراجعة تفاسير بعينها (needs_source).", en: "Ibn Ishaq relates that the mosque's people came to the Prophet while he was preparing for Tabuk saying they had built it for the sick and needy and for rainy and wintry nights, and he put them off until his return; then when news of it reached him he ordered it demolished and burned, and Qur'an was revealed about them (9:107). Sunni exegetes detail the builder's purpose and intention — this detailing needs review of specific tafsir works (needs_source)." }
