summary:
  ar: "بستان صغير على سفح جبل فوق بحيرة دال، بُني حول نبع مشهور سنة 1632م ويُنسب إلى شاه جهان، تنحدر مياهه على ثلاث مصاطب {cite:brookes-gardens-of-paradise-1987 p.146} {cite:brookes-gardens-of-paradise-1987 p.147}."
  en: "A small hillside garden above Lake Dal built round a famous spring in 1632 and attributed to Shah Jahan, its water descending over three levels {cite:brookes-gardens-of-paradise-1987 p.146} {cite:brookes-gardens-of-paradise-1987 p.147}."
  fr: "Petit jardin à flanc de montagne au-dessus du lac Dal, aménagé autour d’une source célèbre en 1632 et attribué à Shah Jahan, dont l’eau descend sur trois niveaux {cite:brookes-gardens-of-paradise-1987 p.146} {cite:brookes-gardens-of-paradise-1987 p.147}."
  es: "Un pequeño jardín en la ladera de una colina sobre el lago Dal construido alrededor de un famoso manantial en 1632 y atribuido a Shah Jahan, cuyas aguas descienden en tres niveles {cite:brookes-gardens-of-paradise-1987 p.146} {cite:brookes-gardens-of-paradise-1987 p.147}."
  ur: "جھیل ڈل کے اوپر ایک چھوٹا سا پہاڑی باغ 1632 میں ایک مشہور چشمے کے گرد تعمیر کیا گیا تھا اور اسے شاہ جہاں سے منسوب کیا گیا تھا، اس کا پانی تین سطحوں پر اترتا تھا"
  tr: "Dal Gölü'nün üzerindeki bir dağın yamacında yer alan küçük bir meyve bahçesi, 1632 yılında ünlü bir pınarın etrafında inşa edilmiş ve Şah Jahan'a atfedilen, suları üç terastan aşağıya dökülür {cite:brookes-gardens-of-paradise-1987 s.146} {cite:brookes-gardens-of-paradise-1987 s.147}."
  id: "Sebuah kebun kecil di lereng gunung di atas Danau Dal, dibangun di sekitar mata air terkenal pada tahun 1632 M dan dikaitkan dengan Shah Jahan, airnya mengalir deras di tiga teras {cite:brookes-gardens-of-paradise-1987 hlm.146} {cite:brookes-gardens-of-paradise-1987 hlm.147}."
