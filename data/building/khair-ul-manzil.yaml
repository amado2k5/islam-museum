summary:
  ar: "مسجد ومدرسة قبالة البوابة الغربية للقلعة القديمة بدلهي، بنتها ماهم أنگه مرضعة أكبر سنة 969هـ/1561–1562 بإشراف شهاب الدين أحمد خان، واسمها «خير المنازل» تاريخ بنائها بحساب الجمّل {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  en: "A mosque and madrasa opposite the western gate of the Purana Qila, Delhi, built by Akbar's wet-nurse Maham Anaga in AH 969/1561-62 under the superintendence of Shihab al-Din Ahmad Khan; its name 'Khair al-Manazil' is the chronogram of its foundation {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  fr: "Mosquée et madrasa face à la porte occidentale du Purana Qila, Delhi, construites par Maham Anaga, nourrice d’Akbar, en 969 H/1561–1562 sous la direction de Shihab al-Din Ahmad Khan ; le nom « Khair al-Manazil » est le chronogramme de sa fondation {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  ur: "پرانے قلعے دہلی کے مغربی دروازے کے سامنے مسجد و مدرسہ جو اکبر کی دایہ ماہم انگہ نے 969ھ/1561–62ء میں شہاب الدین احمد خان کی نگرانی میں بنوایا؛ نام «خیر المنازل» اس کا مادۂ تاریخ ہے {cite:nath-history-of-mughal-architecture-1-1982 p. 238}۔"
  es: "Una mezquita y madrasa frente a la puerta occidental del Purana Qila, Delhi, construida por la nodriza de Akbar, Maham Anaga, en el año 969 de la Hégira (1561-62) bajo la supervisión de Shihab al-Din Ahmad Khan; su nombre 'Khair al-Manazil' es el cronograma de su fundación {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  tr: "Eski Delhi Kalesi'nin batı kapısının karşısında yer alan bir cami ve okul, Maham Anga Akbar tarafından 969 Hicri Hicri / 1561–1562 yıllarında Shihabuddin Ahmad Khan gözetiminde inşa edilmiştir ve adı 'Khair al-Manazil'dir. İnşaat tarihi deve sayımlarıyla hesaplanmıştır {cite:nath-history-of-mughal-architecture-1-1982 s. 237} {cite:nath-history-of-mughal-architecture-1-1982 s. 238}."
  id: "Sebuah masjid dan sekolah di seberang gerbang barat Benteng Delhi lama, dibangun oleh Maham Anga Akbar pada tahun 969 H / 1561–1562 di bawah pengawasan Shihabuddin Ahmad Khan, dan namanya adalah 'Khair al-Manazil'. Tanggal pembangunannya dihitung dalam hitungan unta {cite:nath-history-of-mughal-architecture-1-1982 hlm. 237} {cite:nath-history-of-mughal-architecture-1-1982 hlm. 238}."
