summary:
  ar: "مسجد ومدرسة قبالة البوابة الغربية للقلعة القديمة بدلهي، بنتها ماهم أنگه مرضعة أكبر سنة 969هـ/1561–1562 بإشراف شهاب الدين أحمد خان، واسمها «خير المنازل» تاريخ بنائها بحساب الجمّل {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  en: "A mosque and madrasa opposite the western gate of the Purana Qila, Delhi, built by Akbar's wet-nurse Maham Anaga in AH 969/1561-62 under the superintendence of Shihab al-Din Ahmad Khan; its name 'Khair al-Manazil' is the chronogram of its foundation {cite:nath-history-of-mughal-architecture-1-1982 p. 237} {cite:nath-history-of-mughal-architecture-1-1982 p. 238}."
  ur: "پرانے قلعے دہلی کے مغربی دروازے کے سامنے مسجد و مدرسہ جو اکبر کی دایہ ماہم انگہ نے 969ھ/1561–62ء میں شہاب الدین احمد خان کی نگرانی میں بنوایا؛ نام «خیر المنازل» اس کا مادۂ تاریخ ہے {cite:nath-history-of-mughal-architecture-1-1982 p. 238}۔"
