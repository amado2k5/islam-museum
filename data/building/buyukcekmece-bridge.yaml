  ur: "مارمارا پر Büyükçekmece inlet کے پار سلیمان دی میگنیفیسنٹ کے لیے سینان کا 1566–7 پل: چار منسلک اسپین جن کی کل 28 محرابیں ہیں۔"
  tr: "Sinan tarafından 1566–1567 yılları arasında Marmara'daki Büyükçekmece Gölü'nün ağzında Süleyman Muhteşem için inşa edilen bir köprü; yirmi sekiz kemerle birbirine bağlı dört sektör."
  id: "Sebuah jembatan yang dibangun oleh Sinan untuk Suleiman yang Agung pada tahun 1566–1567 di muara Danau Büyükçekmece di Marmara; empat sektor dihubungkan oleh dua puluh delapan lengkungan."
