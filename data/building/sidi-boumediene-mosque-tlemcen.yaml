label: { ar: "جامع سيدي أبي مدين ⁦(العباد، تلمسان)⁩", en: "Mosque of Sidi Bou Medine, Tlemcen", fr: "Mosquée Sidi Boumédiène, Tlemcen", ur: "مسجد سیدی ابو مدین ⁦(تلمسان)⁩", es: "Mezquita de Sidi Bou Medine, Tlemcen", tr: "Sidi Abi Madyan Camii (Al-Abbad, Tlemcen)", id: "Masjid Madyan Sidi Abi (Al-Abbad, Tlemcen)" }
summary:
  ar: "جامع على نحو ميل جنوب شرقي تلمسان، يؤرخه نيوكومب بسنة 1337م، مدخله الرئيس مكسو بفسيفساء الخزف وأبوابه من خشب الأرز المغشّى بالبرونز المطروق {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  en: "A mosque about a mile south-east of Tlemcen, dated by Newcomb to 1337, its main portal faced with faience mosaic and its cedar doors sheathed in repoussé bronze {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  fr: "À un mille au sud-est de Tlemcen, datée de 1337 par Newcomb ; portail à mosaïque de faïence, portes de cèdre à bronze repoussé. {cite:newcomb-decorative-tiles-north-africa-1929 p.28}"
  es: "Una mezquita situada a aproximadamente una milla al sureste de Tlemcen, datada por Newcomb en 1337, cuyo portal principal está revestido con mosaico de loza y cuyas puertas de cedro están revestidas de bronce repujado {cite:newcomb-decorative-tiles-north-africa-1929 p.28}."
  ur: "Tlemcen کے جنوب مشرق میں تقریباً ایک میل کے فاصلے پر ایک مسجد، جس کی تاریخ نیوکومب نے 1337 میں بنائی تھی، اس کے مرکزی پورٹل کا سامنا فاینس موزیک سے تھا اور اس کے دیودار کے دروازے repoussé کانسی میں لپٹے ہوئے تھے۔"
  tr: "Tlemcen'in yaklaşık bir mil güneydoğusunda, Newcomb'da bulunan bir cami olan bu cami 1337 yılına tarihlendirmektedir. Ana girişi seramik mozaiklerle kaplıdır ve kapıları sedir ağacından yapılmış olup dövme bronzla kaplıdır {cite:Newcomb-decorative-tiles-north-africa-1929 s.28}."
  id: "Sebuah masjid sekitar satu mil tenggara Tlemcen, Newcomb memperkirakan masjid ini berasal dari tahun 1337 M. Pintu utamanya dipenuhi mosaik keramik, dan pintunya terbuat dari kayu cedar yang dilapisi perunggu palu {cite:Newcomb-decorative-tiles-north-africa-1929 hlm.28}."
