summary:
  ar: "المسجد الذي أسسه النبي بالمدينة بعد الهجرة، في موضع بركت عنده ناقته وكان مربداً لغلامين يتيمين اشتراه منهما، وبناه المسلمون باللبن على أساس من الحجر وسقفوا جانب القبلة بجذوع النخل والجريد {cite:samhudi-wafa-al-wafa p. 334-349}. وتذكر دائرة المعارف الإسلامية روايتين في كفيل اليتيمين، وتصف تخطيطه فناءً ذا ثلاثة مداخل في أحد أقسامها ومدخل واحد في قسم العمارة، وصفة لفقراء الصحابة وأكواخاً لزوجات النبي. وتعده نموذجاً لتطور المسجد، وتبين أنه كان أيضاً مركز الجماعة السياسي والاجتماعي، ثم وسعه عمر وعثمان وأعاد بناءه الوليد بن عبد الملك."
  en: "The mosque the Prophet founded in Medina after the Hijra, on a date-drying yard of two orphans where his camel knelt and which he bought from them; the Muslims built it of mudbrick on a stone foundation, with palm-trunk and frond shelter on the qibla side {cite:samhudi-wafa-al-wafa p. 334-349}. The Encyclopaedia of Islam reports two traditions about the orphans' guardian and describes a courtyard with three entrances in one section and a single entrance in its architecture section, with the Suffa shelter for poor Companions and huts for the Prophet's wives. It treats the building as the model from which the mosque developed and as the community's political and social centre, enlarged by Umar and Uthman and rebuilt by al-Walid ibn Abd al-Malik."
  ur: "وہ مسجد جو نبی نے ہجرت کے بعد مدینہ میں قائم کی، دو یتیموں کی کھجور سکھانے کی جگہ پر جہاں ان کی اونٹنی بیٹھی اور جو آپ نے ان سے خریدی؛ مسلمانوں نے اسے پتھر کی بنیاد پر کچی اینٹ سے بنایا اور قبلے کی جانب کھجور کے تنوں اور پتوں کا سائبان ڈالا {cite:samhudi-wafa-al-wafa p. 334-349}۔ انسائیکلوپیڈیا آف اسلام یتیموں کے سرپرست کے بارے میں دو روایتیں نقل کرتا ہے اور ایک حصے میں تین داخلی راستوں اور فن تعمیر کے حصے میں ایک راستے والا صحن بیان کرتا ہے، جس میں غریب صحابہ کا صفہ اور ازواج کی جھونپڑیاں تھیں۔ وہ اسے مسجد کے ارتقا کا نمونہ اور جماعت کا سیاسی و سماجی مرکز قرار دیتا ہے، جسے عمر اور عثمان نے وسیع کیا اور ولید بن عبد المالک نے دوبارہ بنایا۔"
