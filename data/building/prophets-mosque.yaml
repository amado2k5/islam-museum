summary:
  ar: "المسجد الذي أسسه النبي بالمدينة بعد الهجرة؛ بركت ناقته عند موضعه فقال «هذا المنزل إن شاء الله»، وكان مربداً للتمر لغلامين يتيمين سهل وسهيل ابني عمرو في حِجْر أسعد بن زرارة، فأبى أن يقبله هبة حتى ابتاعه — وعند الواقدي بعشرة دنانير أداها أبو بكر. بنوه باللبن على أساس نحو ثلاثة أذرع بالحجارة، وفي ذرعه روايات: سبعون ذراعاً في ستين، أو مائة في مائة فهو مربع، أو أقل من مائة، وكانت قبلته إلى بيت المقدس فلما حُوّلت سُدّ الباب الخلفي وفُتح محاذيه، وله ثلاثة أبواب عرف منها باب عاتكة — باب الرحمة — وباب آل عثمان، ولم يُسقَّف أولاً فلما اشتد الحر ظُلِّل بالجذوع والجريد ثم طُيِّن بالطين، وقال النبي «لا، عريش كعريش موسى» {cite:samhudi-wafa-al-wafa p. 334-349}. وفي الصحيح: قال لبني النجار «ثامنوني» فقالوا لا نطلب ثمنه إلا إلى الله، فأُمر بقبور المشركين فنُبشت وبالخِرَب فسُوّيت وبالنخل فقُطع فصُفّت النخل قبلة المسجد {cite:sahih-al-bukhari 1868}."
  en: "The mosque the Prophet founded in Medina after the Hijra; his camel knelt at the spot and he said 'this is the lodging, God willing', and it was the date-drying yard (mirbad) of two orphans, Sahl and Suhayl ibn 'Amr, in the care of As'ad ibn Zurara — he refused it as a gift until he bought it, ten dinars paid by Abu Bakr in al-Waqidi's account. They built it of mudbrick on a stone foundation of about three cubits; its measure is reported as seventy by sixty cubits, or a hundred square, or less than a hundred; its qibla first faced Jerusalem, and when it was turned the rear door was sealed and its opposite opened; of its three doors Bab 'Atika — the Door of Mercy — and Bab Al 'Uthman are named; it stood unroofed until the heat drove them to shade it with palm trunks and fronds then clay, the Prophet saying 'no — a shelter like the shelter of Moses' {cite:samhudi-wafa-al-wafa p. 334-349}."
