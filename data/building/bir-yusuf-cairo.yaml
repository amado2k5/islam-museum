summary:
  ar: "بئر مزدوجة الجذع محفورة في الصخر الجيري سبعة وثمانين متراً حتى منسوب الماء في القلعة، تُنسب إلى صلاح الدين، ويُرجّح أنها أقدم ووسّعها هو {cite:yeomans-islamic-cairo-2006 p.108}."
  en: "A double-shafted well cut 87 metres through the limestone to the water table in the Citadel, attributed to Salah al-Din though probably older and enlarged by him {cite:yeomans-islamic-cairo-2006 p.108}."
  fr: "Puits à deux conduits creusé sur 87 mètres dans le calcaire jusqu’à la nappe phréatique de la Citadelle, attribué à Saladin mais probablement plus ancien et agrandi par lui {cite:yeomans-islamic-cairo-2006 p.108}."
  es: "Un pozo de doble pozo que atravesaba 87 metros a través de la piedra caliza hasta el nivel freático en la Ciudadela, atribuido a Salah al-Din aunque probablemente más antiguo y ampliado por él {cite:yeomans-islamic-cairo-2006 p.108}."
  ur: "قلعہ میں پانی کی میز تک چونے کے پتھر سے 87 میٹر کا ایک ڈبل شافٹ والا کنواں، جو صلاح الدین سے منسوب ہے اگرچہ شاید اس سے بڑا اور اس نے بڑا کیا تھا۔"
  tr: "Kalede su seviyesine kadar yükselen seksen yedi metre yükseklikte kireçtaşı kayasına kazılmış çift saplı bir kuyunun daha eski olduğuna inanılmaktadır ve kapsamı {cite:yeomans-Islamic-Cairo-2006 s.108}."
  id: "Sebuah sumur berbatang ganda yang digali ke dalam batu kapur setinggi delapan puluh tujuh meter hingga permukaan air di benteng, yang dikaitkan dengan Saladin, diyakini lebih tua dan luasnya {cite:yeomans-Islamic-Cairo-2006 hlm.108}."
