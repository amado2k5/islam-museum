summary:
  ar: "مسجد جامع في عمرپور بغور، بناه السلطان شمس الدين يوسف شاه سنة 884هـ/1479 بحسب نقشه بالطغراء، برواق أوسط تغطيه سقوف بنغالية ذات أربعة جوانب، وإلى جانبه مدرسة اسمها منه {c(155)} {c(156)} {c(158)}."
  en: "A congregational mosque at Umarpur in Gaur, built according to its tughra inscription by Sultan Shams al-Din Yusuf Shah in AH 884/1479, with a central nave under four-sided Bengali roofs and an adjoining madrasa from which it takes its name {c(155)} {c(156)} {c(158)}."
  fr: "Grande mosquée à Umarpur, Gaur, construite selon son inscription en tughra par le sultan Shams al-Din Yusuf Shah en 884 H/1479, avec une nef centrale sous des toits bengalis à quatre pans et une madrasa attenante dont elle tire son nom {c(155)} {c(156)} {c(158)}."
  ur: "گوڑ کے عمر پور میں جامع مسجد، طغرائی کتبے کے مطابق سلطان شمس الدین یوسف شاہ نے 884ھ/1479ء میں بنوائی؛ مرکزی ایوان پر چار رخی بنگالی چھتیں، اور ساتھ کا مدرسہ جس سے نام پڑا {c(155)}۔"
  es: "Una mezquita congregacional en Umarpur en Gaur, construida según su inscripción tughra por el sultán Shams al-Din Yusuf Shah en AH 884/1479, con una nave central bajo techos bengalíes de cuatro lados y una madrasa contigua de la que toma su nombre {c(155)} {c(156)} {c(158)}."
  tr: "Baghor'daki Umerpur'daki Büyük Camii, Sultan Şemsuddin Yusuf Şah tarafından 884 H/1479 yılında Tughra üzerindeki yazıtına göre inşa edilmiştir; merkezi bir revak dört tarafı Bengal tavanlarıyla kaplıdır ve yanında Minh {c(156)} {c(158)} adlı bir okul bulunmaktadır."
  id: "Masjid Agung di Umerpur, Baghor, dibangun oleh Sultan Shamsuddin Yusuf Shah pada tahun 884 H/1479 M sesuai dengan prasasti beliau di Tughra, dengan portiko tengah yang ditutupi langit-langit Bengali di empat sisi, dan di sebelahnya sebuah sekolah bernama Minh {c(156)} {c(158)}."
