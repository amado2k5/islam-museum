summary:
  ar: "بقايا حمّام مزدوج داخل قلعة سيكيشفهيرفار، تنسبه وقفيته إلى الصدر الأعظم رستم باشا، وقاعته الدافئة سداسية نادرة في حمّامات الأناضول والروملي {cite:yilmaz-ottoman-architecture-hungary-2024 p. 177}."
  en: "The remains of a double bath within the castle of Székesfehérvár, ascribed by its endowment deed to the grand vizier Rüstem Pasha, with a hexagonal warm room rare in the baths of Anatolia and Rumelia {cite:yilmaz-ottoman-architecture-hungary-2024 p. 177}."
  fr: "Vestiges de bains doubles au château, attribués par l’acte au grand vizir Rüstem Pacha, à rare salle tiède hexagonale. {cite:yilmaz-ottoman-architecture-hungary-2024 p. 177}"
  ur: "سیکیشفہیروار کے قلعے کے اندر ایک دوہرے حمام کی باقیات، جو وقف نامے کے مطابق صدرِ اعظم رستم پاشا کا ہے؛ اس کا شش پہلو گرم کمرہ اناطولیہ اور روم ایلی کے حماموں میں نادر ہے {cite:yilmaz-ottoman-architecture-hungary-2024 p. 177}۔"
  es: "Los restos de un baño doble dentro del castillo de Székesfehérvár, atribuido por su escritura de donación al gran visir Rüstem Pasha, con una sala cálida hexagonal poco común en los baños de Anatolia y Rumelia {cite:yilmaz-ottoman-architecture-hungary-2024 p. 177}."
  tr: "Sekseşevhirvar Kalesi içindeki çift hamam kalıntıları, Sadrazam Rustam Paşa'ya bağışlandığı ve Anadolu ile Rumeli hamamlarında nadir bulunan sıcak altıgen salonu {cite:yilmaz-ottoman-architecture-hungary-2024, s. 177}."
  id: "Sisa-sisa pemandian ganda di dalam Kastil Sekseşevhirvar, yang dikaitkan dengan anugerahnya kepada Grand Vizier Rustam Pasha, dan aula heksagonalnya yang hangat, yang jarang ditemukan di pemandian Anatolia dan Rumelian {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 177}."
