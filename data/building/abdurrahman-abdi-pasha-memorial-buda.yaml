label: { ar: "شاهد عبد الرحمن عبدي باشا في قلعة بودا", en: "Memorial of Abdurrahman Abdi Pasha, Buda Castle", fr: "Mémorial d’Abdurrahman Abdi Pacha, château de Buda", ur: "عبدالرحمن عبدی پاشا کی یادگار، قلعۂ بودا", es: "Memorial de Abdurrahman Abdi Pasha, Castillo de Buda", tr: "Buda Kalesi'nde Abd al-Rahman Abdi Paşa'yı izleyin", id: "Tonton Abd al-Rahman Abdi Pasha di Kastil Buda" }
summary:
  ar: "شاهد تذكاري وضعه المجريون سنة 1926 في حصن أنجو بقلعة بودا حيث قُتل آخر ولاة بودا العثمانيين عبد الرحمن عبدي باشا في 2 سبتمبر 1686، بتصميم كالمان جيله على طراز الشواهد التركية {cite:yilmaz-ottoman-architecture-hungary-2024 p. 55}."
  en: "A memorial stone set up by the Hungarians in 1926 on the Anjou Bastion of Buda Castle, where Abdurrahman Abdi Pasha, last Ottoman governor of Buda, fell on 2 September 1686; designed by Kálmán Zsille after Turkish gravestones {cite:yilmaz-ottoman-architecture-hungary-2024 p. 55}."
  fr: "Pierre commémorative érigée par les Hongrois en 1926 sur le bastion d’Anjou du château de Buda, où Abdurrahman Abdi Pacha, dernier gouverneur ottoman de Buda, tomba le 2 septembre 1686 ; conçue par Kálmán Zsille sur le modèle des pierres tombales turques {cite:yilmaz-ottoman-architecture-hungary-2024 p. 55}."
  ur: "قلعۂ بودا کے انجو برج پر 1926ء میں ہنگریوں کی نصب کردہ یادگاری لوح، جہاں بودا کے آخری عثمانی حاکم عبدالرحمن عبدی پاشا 2 ستمبر 1686ء کو مارے گئے؛ کالمان ژیلے کا ترکی لوحوں کے طرز پر ڈیزائن {cite:yilmaz-ottoman-architecture-hungary-2024 p. 55}۔"
  es: "Una piedra conmemorativa colocada por los húngaros en 1926 en el Bastión de Anjou del Castillo de Buda, donde Abdurrahman Abdi Pasha, último gobernador otomano de Buda, cayó el 2 de septiembre de 1686; diseñada por Kálmán Zsille a partir de lápidas turcas {cite:yilmaz-ottoman-architecture-hungary-2024 p. 55}."
  tr: "Macarlar tarafından 1926'da Buda Kalesi'ndeki Anjou Kalesi'nde, Buda'nın son Osmanlı valisi Abdurrahman Abdi Paşa'nın 2 Eylül 1686'da öldürüldüğü anıt anıt, Kalman Gülle tarafından Türk anıtları tarzında tasarlanmıştır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 55}."
  id: "Sebuah monumen peringatan yang didirikan oleh orang Hungaria pada tahun 1926 di Benteng Anjou di Kastil Buda, tempat gubernur Ottoman terakhir Buda, Abdurrahman Abdi Pasha, dibunuh pada 2 September 1686, dirancang oleh Kalman Gülle dengan gaya monumen Turki {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 55}."
