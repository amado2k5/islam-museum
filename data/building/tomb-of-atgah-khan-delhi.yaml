label: { ar: "ضريح شمس الدين محمد أتكه خان في دلهي", en: "Tomb of Shams al-Din Muhammad Atgah Khan, Delhi", fr: "Tombeau de Shams al-Din Muhammad Atgah Khan, Delhi", ur: "مقبرۂ شمس الدین محمد اتگہ خان، دہلی", es: "Tumba de Shams al-Din Muhammad Atgah Khan, Delhi", tr: "Delhi'deki Şemsuddin Muhammed Atka Han'ın türbesi", id: "Makam Shamsuddin Muhammad Atka Khan di Delhi" }
summary:
  ar: "ضريح مربع صغير بقبة رخامية قرب درگاه نظام الدين أولياء في دلهي، بُني سنة 974هـ/1566–1567م بإشراف الأستاذ خدا قلي، وخطاط نقوشه باقي محمد البخاري، وفيه استعمال واسع للرخام الأبيض والتطعيم والقيشاني {cite:nath-history-of-mughal-architecture-1-1982 p. 190} {cite:nath-history-of-mughal-architecture-1-1982 p. 191}."
  en: "A small square tomb with a marble dome near the dargah of Nizam al-Din Awliya at Delhi, built in AH 974/1566-67 under the superintendence of Ustad Khuda Quli, its inscriptions written by Baqi Muhammad of Bukhara, with lavish white marble, inlay and glazed tile {cite:nath-history-of-mughal-architecture-1-1982 p. 190} {cite:nath-history-of-mughal-architecture-1-1982 p. 191}."
  fr: "Petit carré à coupole de marbre près du dargah de Nizam al-Din Awliya, bâti en 974 H/1566–1567 sous Ustad Khuda Quli, inscriptions de Baqi Muhammad de Boukhara, riche marbre blanc, incrustations et carreaux. {cite:nath-history-of-mughal-architecture-1-1982 p. 190} {cite:nath-history-of-mughal-architecture-1-1982 p. 191}"
  ur: "دہلی میں درگاہِ نظام الدین اولیا کے قریب سنگِ مرمر کے گنبد والا چھوٹا مربع مقبرہ، 974ھ/1566–67ء میں استاد خدا قلی کی نگرانی میں بنا، کتبے باقی محمد بخاری کے لکھے؛ سفید سنگِ مرمر، پچی کاری اور کاشی کی فراوانی {cite:nath-history-of-mughal-architecture-1-1982 p. 191}۔"
  es: "Una pequeña tumba cuadrada con una cúpula de mármol cerca del dargah de Nizam al-Din Awliya en Delhi, construida en AH 974/1566-67 bajo la supervisión de Ustad Khuda Quli, con inscripciones escritas por Baqi Muhammad de Bukhara, con lujoso mármol blanco, incrustaciones y azulejos vidriados {cite:nath-history-of-mughal-architecture-1-1982 p. 190} {cite:nath-history-of-mughal-architecture-1-1982 p. 191}."
  tr: "Delhi'deki Nizamuddin Auliya Dargahı yakınında, 974 Hicri / 1566–1567 yıllarında Profesör Khuda Quli ve hattatı Baqi Muhammed el-Buhari'nin gözetiminde inşa edilmiş, mermer kubbeli küçük bir kare türbe. Beyaz mermer, kakma ve fayansların yoğun kullanımı vardır {cite:nath-history-of-mughal-architecture-1-1982 s. 190} {cite:nath-history-of-mughal-architecture-1-1982 s. 191}."
  id: "Makam kecil berbentuk persegi dengan kubah marmer dekat Dargah Nizamuddin Auliya di Delhi, dibangun pada tahun 974 H / 1566–1567 M di bawah pengawasan Profesor Khuda Quli, dan kaligrafernya Baqi Muhammad al-Bukhari. Makam ini menggunakan banyak marmer putih, inlay, dan ubin {cite:nath-history-of-mughal-architecture-1-1982 hlm. 190} {cite:nath-history-of-mughal-architecture-1-1982 hlm. 191}."
