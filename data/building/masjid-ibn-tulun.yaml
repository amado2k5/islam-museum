id: building/masjid-ibn-tulun
class: building
kind: mosque
label:
  ar: جامع ابن طولون
  en: Mosque of Ibn Tulun
summary:
  ar: "جامع أقامه أحمد بن طولون في العسكر بحي القطائع شمال الفسطاط، وهو أقدم جامع قائم بكامله في القاهرة، من الآجر المكسو بالجص، له صحن مربع تحيط به أربعة أروقة وزيادة وسور خارجي، ومئذنة حجرية حلزونية تتصل جذورها بمآذن سامراء. أعاد السلطان لاجين ترميمه سنة 696هـ/1296-7م وفاءً بنذر، واختلف الباحثون في ما يعود إليه من المئذنة. تتناوله دائرة المعارف الإسلامية عرَضاً في مقالات ابن طولون والطولونيين والقاهرة والمسجد."
  en: "A congregational mosque built by Ahmad ibn Tulun at al-Askar in the new quarter of al-Qata'i, north of Fustat, and the oldest mosque standing intact in Cairo. It is of brick faced with stucco, with a square courtyard ringed by four arcaded halls, an outer enclosure called the ziyada, and a stone spiral minaret rooted in the minarets of Samarra. Sultan Lajin restored it in 696/1296-7 in fulfilment of a vow, and scholars disagree on how much of the minaret is his. The Encyclopaedia of Islam treats it in passing, in its articles on Ibn Tulun, the Tulunids, Cairo and the mosque as a type."
  ur: "یہ جامع مسجد احمد بن طولون نے فسطاط کے شمال میں القطائع کے نئے محلے میں العسکر کے مقام پر بنوائی، اور یہ قاہرہ کی سب سے قدیم مکمل قائم مسجد ہے۔ یہ گچ چڑھی اینٹ سے بنی ہے، اس کا صحن مربع ہے جسے چار دالان گھیرتے ہیں، گرد زیادہ نامی بیرونی احاطہ ہے، اور اس کا پیچ دار پتھر کا مینار سامرا کے میناروں سے نسبت رکھتا ہے۔ سلطان لاجین نے نذر پوری کرنے کے لیے 696ھ/1296-7ء میں اس کی مرمت کی، اور محققین مینار کے بارے میں اختلاف کرتے ہیں کہ اس میں کتنا حصہ اس کا ہے۔ دائرۃ المعارف اسلامیہ اس کا ذکر ضمناً ابن طولون، طولونیوں، قاہرہ اور مسجد بطور عمارتی نمونہ کے مقالوں میں کرتی ہے۔"
