label: { ar: "مدرسة الناصر محمد بن قلاوون وقبته", en: "Madrasa and Mausoleum of al-Nasir Muhammad, Cairo", fr: "Madrasa et mausolée d’al-Nasir Muhammad, Le Caire", ur: "الناصر محمد کا مدرسہ اور مقبرہ، قاہرہ", es: "Madrasa y Mausoleo de al-Nasir Muhammad, El Cairo" }
summary:
  ar: "مدرسة وقبة في شارع المعز بين مجمع قلاوون ومدرسة برقوق ⁦(1295-1303م)⁩، بدأها كتبغا وأتمها الناصر محمد، بابها القوطي غنيمة من كنيسة القديس جورج في عكا {cite:yeomans-islamic-cairo-2006 p.138} {cite:yeomans-islamic-cairo-2006 p.140}."
  en: "Madrasa and mausoleum on al-Mu'izz street between the Qalawun complex and Barquq's madrasa (1295-1303), begun by Kitbugha and completed by al-Nasir Muhammad, its Gothic doorway a trophy from the church of St George at Acre {cite:yeomans-islamic-cairo-2006 p.138} {cite:yeomans-islamic-cairo-2006 p.140}."
  fr: "Madrasa et mausolée de la rue al-Mu’izz entre les complexes de Qalawun et Barquq (1295–1303), commencés par Kitbugha et achevés par al-Nasir Muhammad ; le portail gothique est un trophée de l’église Saint-Georges d’Acre {cite:yeomans-islamic-cairo-2006 p.138} {cite:yeomans-islamic-cairo-2006 p.140}"
  es: "Madrasa y mausoleo en la calle al-Mu'izz entre el complejo Qalawun y la madrasa de Barquq (1295-1303), iniciada por Kitbugha y completada por al-Nasir Muhammad, su puerta gótica es un trofeo de la iglesia de San Jorge en Acre {cite:yeomans-islamic-cairo-2006 p.138} {cite:yeomans-islamic-cairo-2006 p.140}."
  ur: "مدرسہ اور مقبرہ المعز اسٹریٹ پر قلعہون کمپلیکس اور برقوق کے مدرسہ (1295-1303) کے درمیان، جو کتبوغہ سے شروع ہوا اور الناصر محمد نے مکمل کیا، اس کا گوتھک دروازہ ایکڑ میں سینٹ جارج کے چرچ سے ایک ٹرافی {حوالہ: yeomans-islamic-p206} {حوالہ:یومانس-اسلامی-قاہرہ-2006 صفحہ 140}۔"
