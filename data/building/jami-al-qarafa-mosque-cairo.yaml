summary:
  ar: "جامع القرافة، ويُعرف اليوم بجامع الأولياء، ويُنسب إلى بني عبد الله بن مانع بن مزروع، ويُعرف أيضاً بمسجد القبة ⁦(المقريزي، ص 2437، 2456)⁩."
  en: "Jami al-Qarafa, today called Jami al-Awliya, named after the Banu Abd Allah ibn Manih ibn Mazrub and also known as the Mosque of the Dome (al-Maqrizi, pp. 2437, 2456)."
  fr: "Jami al-Qarafa, aujourd’hui appelée Jami al-Awliya, nommée d’après les Banu Abd Allah ibn Manih ibn Mazrub et également connue comme mosquée de la Coupole (al-Maqrizi, p. 2437, 2456)."
  es: "Jami al-Qarafa, hoy llamada Jami al-Awliya, lleva el nombre de Banu Abd Allah ibn Manih ibn Mazrub y también conocida como la Mezquita de la Cúpula (al-Maqrizi, págs. 2437, 2456)."
  ur: "جامع القرافہ، جسے آج جامع الاولیاء کہا جاتا ہے، جسے بنو عبد اللہ ابن منح ابن مزروب کے نام سے موسوم کیا گیا ہے اور اسے مسجد گنبد کے نام سے بھی جانا جاتا ہے ⁦(المقریضی، صفحہ 2437، 2456)⁩۔"
