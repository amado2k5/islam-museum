  ur: "مسوا میں صحابہ کی مسجد کے لیے ڈرافٹ کارڈ، یہ مسجد حبشہ اور افریقہ کے قدیم ترین ہجرت کرنے والوں سے منسوب ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Eritre'nin Masoua kentindeki Sahaba Camii için ön kart, Habeşistan'a ilk göç edenlere atfedilen ve Afrika'nın en eski camisi olan camidir; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Sahaba di Masoua, Eritrea, masjid yang dikaitkan dengan imigran pertama ke Abyssinia dan masjid tertua di Afrika; sumber-sumbernya di halaman tersebut belum ditinjau."
