summary:
  ar: "مسجد الحمراء بالكوفة؛ تعدّه «موسوعة العتبات» — في رواية يرويها المجلسي عن محمد بن مسلم عن أبي جعفر — واحداً من مساجد الكوفة «المباركة» إلى جانب مساجد غني وبني ظفر والسهلة وجعفي {cite:musawat-atabat}."
  en: "The al-Hamra Mosque of Kufa; the Mawsu'at al-Atabat — in a report al-Majlisi transmits from Muhammad ibn Muslim from Abu Ja'far — counts it among Kufa's 'blessed' mosques alongside those of Ghani, Bani Zafar, al-Sahlah and Ja'fi {cite:musawat-atabat}."
  fr: "La mosquée al-Hamra de Kufa ; la Mawsu’at al-Atabat — dans un récit qu’al-Majlisi transmet de Muhammad ibn Muslim, d’après Abu Ja’far — la compte parmi les mosquées « bénies » de Kufa aux côtés de celles de Ghani, Bani Zafar, al-Sahlah et Ja’fi {cite:musawat-atabat}."
  es: "La Mezquita al-Hamra de Kufa; el Mawsu'at al-Atabat —en un informe que al-Majlisi transmite de Muhammad ibn Muslim de Abu Ja'far— la cuenta entre las mezquitas 'bendecidas' de Kufa junto con las de Ghani, Bani Zafar, al-Sahlah y Ja'fi {cita:musawat-atabat}."
  ur: "کوفہ کی الحمرا مسجد؛ موصوف الاطابات - المجلسی کی ایک رپورٹ میں جو محمد بن مسلم نے ابو جعفر سے نقل کی ہے - اسے غنی، بنی ظفر، السحلہ اور جعفی کی مساجد کے ساتھ کوفہ کی 'مبارک' مساجد میں شمار کرتا ہے۔"
  tr: "Kufa'daki El-Hamra Camii; \"Türbeler Ansiklopedisi\" — El-Majlisi'nin Ebu Ca'fer'den Muhammed ibn Müslim'den anlattığı bir anlatıma göre — Kufe'nin \"mübarek\" camilerinden biridir; yanında Ghani, Bani Zafar, Al-Sahla ve Ja'fi camileri {atıf: musawat-atabat} bulunmaktadır."
  id: "Masjid Al-Hamra di Kufa; \"Ensiklopedia Makam\" — menurut narasi yang diceritakan oleh Al-Majlisi dari Muhammad ibn Muslim dari Abu Ja'far — adalah salah satu masjid \"diberkati\" di Kufa, berdampingan dengan masjid Ghani, Bani Zafar, Al-Sahla, dan Ja'fi {cite:musawat-atabat}."
