summary:
  ar: "جامع القيروان الأعظم في موضع يسمى السماط الكبير وسط الأسواق؛ رآه المقدسي نحو 375هـ فعدّه أكبر من جامع ابن طولون، بأعمدة من الرخام وأرض مفروشة بالرخام ومزاريبه من الرصاص، وله أبواب عدة {cite:ahsan-al-taqasim pp. 180-181}. وتصفه دائرة المعارف الإسلامية بأنه أقدم المباني الدينية في الغرب الإسلامي، وتذكر أنه جُدد على يد حسان بن النعمان، وأعاده يزيد بن حاتم سنة 157هـ، ثم هدمه زيادة الله الأول وبناه سنة 221هـ مراعياً خط جدار القبلة الذي رسمه عقبة بن نافع، ووسّعه أبو إبراهيم أحمد سنة 248هـ، وجعل له المعز بن باديس المقصورة الحالية، وكان آخر ترميم بين 1970 و1972."
  en: "The Great Mosque of Qayrawan stands on the Great Market amid the markets; al-Muqaddasi saw it around 375 AH and counted it larger than Ibn Tulun's mosque, with marble columns and paving and lead gutters, and several named gates {cite:ahsan-al-taqasim pp. 180-181}. The Encyclopaedia of Islam calls it the oldest religious building of the Muslim West and lists its works: renovation by Hassan ibn al-Nu'man, reconstruction by Yazid ibn Hatim in 157 AH, demolition and rebuilding by Ziyadat Allah I in 221 AH on the qibla line drawn by Uqba ibn Nafi, enlargement by Abu Ibrahim Ahmad in 248 AH, the present maqsura given by al-Mu'izz ibn Badis, and a last restoration in 1970-2."
  ur: "جامع القیروان الاعظم «السماط الکبیر» پر بازاروں کے درمیان واقع ہے؛ المقدسی نے اسے سنہ 375ھ کے لگ بھگ دیکھا اور ابن طولون کی مسجد سے بڑا قرار دیا، رخام کے ستونوں اور فرش اور سیسے کی نالیوں اور کئی نامزد دروازوں کے ساتھ {cite:ahsan-al-taqasim pp. 180-181}۔ دائرۃ المعارف الاسلامیہ اسے مغربِ اسلامی کی قدیم ترین دینی عمارت کہتی ہے اور اس کے کام گنواتی ہے: حسان بن النعمان کی تجدید، یزید بن حاتم کی تعمیر 157ھ میں، زیادۃ اللہ اول کا انہدام اور تعمیرِ نو 221ھ میں عقبہ بن نافع کی کھینچی ہوئی قبلہ لکیر پر، ابو ابراہیم احمد کی توسیع 248ھ میں، المعز بن بادیس کا دیا ہوا موجودہ مقصورہ، اور آخری مرمت 1970 سے 1972 تک۔"
