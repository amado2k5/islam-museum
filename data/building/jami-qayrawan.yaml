summary:
  ar: "جامع القيروان الأعظم في موضع يسمى السماط الكبير وسط الأسواق؛ رآه المقدسي نحو 375هـ فعدّه أكبر من جامع ابن طولون، بأعمدة من الرخام وأرض مفروشة بالرخام وناره من الرخام ومزاريبه من الرصاص، وله أبواب: باب السماط وباب الصرافين وباب الرهادئة وباب الفضوليين وباب الماذنة وباب الصباغين وباب الحواريين وباب سوق الخميس وباب الميضاة وباب الخاصة في التمارين {cite:ahsan-al-taqasim pp. 180-181}."
  en: "The Great Mosque of Qayrawan, on the Simat al-Kabir amid the markets; al-Muqaddasi saw it c. 375 AH and reckoned it bigger than Ibn Tulun's mosque — marble columns, marble paving, a marble brazier and lead gutters, with named gates: Bab al-Sarraf in, Bab al-Rahadiyya, Bab al-Mi'da and Bab al-Khassa {cite:ahsan-al-taqasim pp. 180-181}."
