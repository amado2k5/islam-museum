summary:
  ar: "بطاقة أولية لجامع الجمعة بدربند، الجامع الذي يُنسب تأسيسه إلى القرن الثامن فتحت إليه المسلمين المدينة؛ من أقدم مساجد القوقاز الباقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Juma Mosque of Derbent, attributed to an eighth-century foundation after the Muslim capture of the city; among the oldest surviving mosques of the Caucasus per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée Juma de Derbent, attribuée à une fondation du VIIIe siècle après la prise musulmane de la ville, parmi les plus anciennes mosquées conservées du Caucase selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Ficha de diseño para la Mezquita Juma de Derbent, atribuida a una fundación del siglo VIII tras la conquista musulmana de la ciudad; según la enciclopedia citada, página aún no verificada, se encuentra entre las mezquitas más antiguas que se conservan en el Cáucaso."
  ur: "Derbent کی جمعہ مسجد کے لیے ڈرافٹ کارڈ، جو شہر پر مسلمانوں کے قبضے کے بعد آٹھویں صدی کی بنیاد سے منسوب ہے۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق قفقاز کی قدیم ترین زندہ بچ جانے والی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
