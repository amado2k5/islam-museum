summary:
  ar: "الكعبة أشهر مقدسات الإسلام وهي بيت الله في وسط المسجد الحرام بمكة، ويتجه إليها المسلمون في صلاتهم ويطوف بها الحجاج. يرى المسلمون أن إبراهيم وإسماعيل رفعا قواعدها، وتقول دائرة المعارف الإسلامية إن المعروف تاريخياً عنها قليل خارج الروايات الإسلامية، وإن التاريخ الأوضح يبدأ بإعادة بناء قريش، ثم بناء ابن الزبير سنة 64هـ/683م، ثم ردّ الحجاج لها إلى شكلها السابق سنة 74هـ/693م. وتعرض المقالة كذلك حجرها الأسود وكسوتها وحرمها ومكانتها عند المتصوفة وقراءة تاريخية لدين مكة قبل الإسلام."
  en: "The Kaaba is the most famous sanctuary of Islam, the House of God at the centre of the great mosque of Mecca, toward which Muslims pray and around which pilgrims circle. Muslims understand Ibrahim and Ismail to have raised its foundations; the Encyclopaedia of Islam says little is known historically outside Muslim tradition, with firmer history beginning with the Quraysh rebuilding, then Ibn al-Zubayr's rebuilding in 64/683 and al-Hajjaj's return to the earlier form in 74/693. The article also covers its Black Stone, covering, sacred zone, Sufi views and a historical reading of Mecca's religion before Islam."
  ur: "کعبہ اسلام کا سب سے مشہور مقدس مقام اور مکہ کی بڑی مسجد کے وسط میں بیت اللہ ہے، جس کی طرف مسلمان نماز پڑھتے ہیں اور جس کا طواف حاجی کرتے ہیں۔ مسلمان سمجھتے ہیں کہ ابراہیم اور اسماعیل نے اس کی بنیادیں اٹھائیں؛ دائرۃ المعارف اسلامیہ کہتی ہے کہ مسلم روایات کے باہر تاریخی طور پر کم معلوم ہے، اور واضح تاریخ قریش کی تعمیر نو سے، پھر سنہ 64ھ/683ء میں ابن زبیر کی تعمیر اور سنہ 74ھ/693ء میں حجاج کی سابقہ شکل کی بحالی سے شروع ہوتی ہے۔ مقالہ حجر اسود، غلاف، حرم، صوفیہ کے خیالات اور اسلام سے پہلے مکہ کے دین کی تاریخی قراءت بھی بیان کرتا ہے۔"
