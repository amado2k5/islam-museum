summary:
  en: "The House whose foundations Ibrahim and Ismail raised at Mecca; it was a raised mound before the building, then the sanctuary toward which Arabia’s tribes came — custodied successively by Ismail’s line, Jurhum, Khuzaʾa and finally Quraysh under Qusayy."
  ar: "البيت الذي رفع إبراهيم وإسماعيل قواعده بمكة؛ كان مرتفعاً كالرابية قبل البناء، ثم صار حرماً تفد إليه قبائل الجزيرة، تولّت سدانته ذرية إسماعيل ثم جرهم ثم خزاعة ثم قريش منذ قصي."
