  did_you_know:
    ar: "كانت الكعبة قبل بنائها رابيةً مرتفعة، ورفع إبراهيم وإسماعيل قواعدها بمكة، فصارت حرماً تفد إليه قبائل الجزيرة، وتعاقبت على سدانتها ذرية إسماعيل ثم جرهم ثم خزاعة ثم قريش."
    en: "Before building, the Kaaba stood as a raised mound; Ibrahim and Isma'il raised its foundations in Mecca, making it a sanctuary for the peninsula's tribes — keepership passing from Isma'il's line to Jurhum, Khuza'a, then Quraysh."
    ur: "کعبہ بنائی سے پہلے ایک بلند ٹیلہ تھا؛ ابراہیم اور اسماعیل نے مکہ میں اس کی بنیادیں اٹھائیں اور یہ جزیرہ کے قبائل کی زیارت گاہ بنا — سدانت اسماعیل کی اولاد، جُرہم، خزاعہ، پھر قریش کے پاس رہی۔"
    sources: [source/tabaqat-ibn-sad, source/muruj-al-dhahab]
