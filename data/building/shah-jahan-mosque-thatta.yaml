  es: "Boceto de ficha para la Mezquita Shah Jahan de Thatta en Sindh, la mezquita mogol del siglo XVII famosa por su mampostería y mosaicos de azulejos; sus fuentes aún no han sido verificadas en la página."
  ur: "سندھ میں ٹھٹھہ کی شاہ جہاں مسجد کے لیے ڈرافٹ کارڈ، سترہویں صدی کی مغل مسجد جو اینٹوں اور ٹائلوں کے موزیک کے لیے مشہور ہے۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Sindh'teki Tahtha'daki Şah Cihan Camii için ön kart, on yedinci yüzyıldan kalma tuğla ve mozaiğiyle ünlü Babür camidi; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Masjid Shah Jahan di Tahtha, Sindh, masjid Mughal yang terkenal dengan bata dan mosaiknya dari abad ketujuh belas; sumber-sumbernya di halaman tersebut belum ditinjau."
