summary:
  ar: "بستان مغولي عند نبع مقدس جنوبي سرينغار، يُنسب إلى نورجهان وكان يسمى «بيگم‌آباد»، تجري فيه قناتان جانبيتان موازيتان للقناة الوسطى {cite:brookes-gardens-of-paradise-1987 p.148} {cite:brookes-gardens-of-paradise-1987 p.149}."
  en: "A Mughal garden at a sacred spring south of Srinagar, attributed to Nur Jahan and once called Begumabad, with two side channels running parallel to the main one {cite:brookes-gardens-of-paradise-1987 p.148} {cite:brookes-gardens-of-paradise-1987 p.149}."
  fr: "Jardin moghol auprès d’une source sacrée au sud de Srinagar, attribué à Nur Jahan et autrefois appelé Begumabad, avec deux canaux latéraux parallèles au canal principal {cite:brookes-gardens-of-paradise-1987 p.148} {cite:brookes-gardens-of-paradise-1987 p.149}."
  es: "Un jardín mogol en un manantial sagrado al sur de Srinagar, atribuido a Nur Jahan y antiguamente llamado Begumabad, con dos canales laterales que corren paralelos al principal {cite:brookes-gardens-of-paradise-1987 p.148} {cite:brookes-gardens-of-paradise-1987 p.149}."
  ur: "سری نگر کے جنوب میں ایک مقدس چشمہ پر ایک مغل باغ، جسے نور جہاں سے منسوب کیا گیا تھا اور کبھی بیگم آباد کہا جاتا تھا، جس کے دو سائیڈ چینلز مرکزی ایک کے متوازی چل رہے ہیں"
