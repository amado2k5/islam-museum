summary:
  ar: "بطاقة أولية للجامع الكبير بالمهدية، الجامع الفاطمي الذي بُني سنة ٩١٦م في عاصمة الدولة الفاطمية الأولى؛ من أقدم مساجد أفريقية الباقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Great Mosque of Mahdia, the Fatimid mosque built in 916 in the dynasty's first capital; among Ifriqiya's oldest surviving mosques per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Grande Mosquée de Mahdia, mosquée fatimide bâtie en 916 dans la première capitale de la dynastie, parmi les plus anciennes mosquées conservées d’Ifriqiya selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto para la Gran Mezquita de Mahdia, la mezquita fatimí construida en 916 en la primera capital de la dinastía; según la enciclopedia citada, una de las mezquitas más antiguas que aún se conservan en Ifriqiya (página aún no verificada)."
  ur: "مہدیہ کی عظیم مسجد کے لیے ڈرافٹ کارڈ، خاندان کے پہلے دارالحکومت میں 916 میں تعمیر کی گئی فاطمی مسجد؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق عفریقیہ کی قدیم ترین بچ جانے والی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
