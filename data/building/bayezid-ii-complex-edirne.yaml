summary:
  ar: "كُلّية بايزيد الثاني على الضفة الغربية لتونجة، بناها المعمار خير الدين 1484–1488م؛ مسجد وعمارة ومخبز ومستشفى وملاذ مجانين ومدرسة طب كان يعزف فيها الموسيقى علاجاً للمرضى."
  en: "Bayezid II's vast külliye on the west bank of the Tunca, built by the architect Hayrettin in 1484–8: mosque, imaret, bakery, hospital, insane asylum and medical school where music was played to heal the sick."
  fr: "Vaste külliye de Bayezid II sur la rive ouest de la Tunca, construit par l’architecte Hayrettin en 1484–1488 : mosquée, imaret, boulangerie, hôpital, asile psychiatrique et école de médecine où l’on jouait de la musique pour soigner les malades."
  es: "El vasto complejo de Bayezid II en la orilla oeste del Tunca, construido por el arquitecto Hayrettin entre 1484 y 1488: mezquita, imaret, panadería, hospital, manicomio y escuela de medicina donde se tocaba música para curar a los enfermos."
  ur: "ٹنکا کے مغربی کنارے پر بایزید دوم کی وسیع کلی، جسے معمار ہیریٹین نے 1484-8 میں تعمیر کیا تھا: مسجد، امامت، بیکری، ہسپتال، پاگلوں کی پناہ گاہ اور میڈیکل اسکول جہاں بیماروں کو شفا دینے کے لیے موسیقی چلائی جاتی تھی۔"
  tr: "Tunca'nın batı kıyısındaki Bayezid Koleji, mimar Hayreddin tarafından 1484–1488 yılları arasında inşa edilmiştir; bir cami, bir bina, fırın, hastane, akıl hastaları için sığınak ve hastaların tedavisinde müzik çalınan bir tıp fakültesi."
  id: "Bayezid II College di tepi barat Sungai Tunca, dibangun oleh arsitek Khair al-Din 1484–1488 M; sebuah masjid, sebuah bangunan, toko roti, rumah sakit, tempat perlindungan bagi orang gila, dan sekolah kedokteran di mana musik dimainkan sebagai pengobatan bagi orang sakit."
