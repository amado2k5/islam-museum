summary:
  ar: "جامع نور عثمانية بإسطنبول على التل الثاني شرق البازار المسقوف؛ أول المساجد العثمانية الكبرى على الطراز الباروكي، بدأه محمود الأول سنة 1748م وأتمه خليفته سنة 1755م {cite:freely-ottoman-architecture-2011}."
  en: "The Nuruosmaniye Mosque of Istanbul on the Second Hill east of the Covered Bazaar; the first great Ottoman mosque in the baroque style, begun by Mahmut I in 1748 and finished by his successor in 1755 CE {cite:freely-ottoman-architecture-2011}."
  fr: "Mosquée de la deuxième colline d’Istanbul à l’est du Grand Bazar ; première grande mosquée ottomane baroque, commencée par Mahmut Ier en 1748, achevée par son successeur en 1755 {cite:freely-ottoman-architecture-2011}"
  es: "La Mezquita Nuruosmaniye de Estambul, en la Segunda Colina al este del Bazar Cubierto; la primera gran mezquita otomana de estilo barroco, iniciada por Mahmut I en 1748 y terminada por su sucesor en 1755 d. C. {cite:freely-ottoman-architecture-2011}."
  ur: "ڈھکے ہوئے بازار کے مشرق میں دوسری پہاڑی پر استنبول کی نوروسمانیہ مسجد؛ باروک طرز کی پہلی عظیم عثمانی مسجد، جس کا آغاز محمود اول نے 1748 میں کیا اور 1755 عیسوی میں اس کے جانشین نے ختم کیا۔"
  tr: "İstanbul'daki Nur Osmaniye Camii, kapalı çarşının doğusundaki ikinci höyükte yer alır; Barok tarzda inşa edilen ilk büyük Osmanlı camidi, 1748'de Mahmud I tarafından başlatılmış ve halefi tarafından 1755'te tamamlanmıştır {cite:freely-osman-architecture-2011}."
  id: "Masjid Nur Osmaniye di Istanbul di gundukan kedua sebelah timur pasar tertutup; masjid besar Ottoman pertama bergaya Barok, didirikan oleh Mahmud I pada tahun 1748 dan diselesaikan oleh penerusnya pada tahun 1755 {cite:freely-ottoman-architecture-2011}."
