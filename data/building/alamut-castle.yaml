  tr: "İran'daki Albert Dağları'ndaki Alamut Kalesi, İsmailiye Nizari kalesi ve ünlü Hasan Al-Sabah kalesi için ön hazırlık kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Kastil Alamut di Pegunungan Albert di Iran, benteng Ismailia Nizari, dan benteng terkenal Hassan Al-Sabah; sumber-sumbernya di halaman tersebut belum ditinjau."
