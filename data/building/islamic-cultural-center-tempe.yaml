summary:
  ar: "مسجد في تمپي بأريزونا بناه م. أفضل إبراهيم سنة 1984 بإلهام من قبة الصخرة، ذو مئذنة وقبة ذهبية ملحقتين ببناء مثمن مزين بالبلاط {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  en: "A mosque at Tempe, Arizona, built in 1984 by M. Afzal Ibrahim and inspired by the Dome of the Rock, with a minaret and golden dome attached to an eight-sided tiled structure {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  fr: "Mosquée de Tempe, Arizona, construite en 1984 par M. Afzal Ibrahim et inspirée du Dôme du Rocher, avec un minaret et une coupole dorée rattachés à une structure octogonale revêtue de carreaux {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  ur: "ٹیمپی، ایریزونا کی مسجد جو 1984ء میں ایم۔ افضل ابراہیم نے قبۃ الصخرہ سے متاثر ہو کر بنائی، جس کا مینار اور سنہری گنبد ایک ہشت پہلو ٹائل دار عمارت سے ملحق ہیں {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}۔"
  es: "Una mezquita en Tempe, Arizona, construida en 1984 por M. Afzal Ibrahim e inspirada en la Cúpula de la Roca, con un minarete y una cúpula dorada unida a una estructura de azulejos octogonal {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 8-9}."
  tr: "Arizona, Tempe'de inşa edilen bir cami, 1984'te Mühimmat Afzal İbrahim tarafından inşa edilmiş, Kaya Kubbesi'nden esinlenmiştir; minare ve altın kubbe, kiremitlerle süslenmiş sekizgen bir yapıya bağlıdır {cite:khalidi-donnellon-mosques-usa-canada-catalogue s. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue s. 8-9}."
  id: "Sebuah masjid di Tempe, Arizona, dibangun oleh Eng. Afzal Ibrahim pada tahun 1984, terinspirasi oleh Dome of the Rock, menampilkan menara dan kubah emas yang melekat pada struktur oktagonal yang dihiasi ubin {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue hlm. 8-9}."
