label:
  ar: مسجد ومدرسة السلطان حسن
  en: Mosque-Madrasa of Sultan Hasan
summary:
  ar: مسجد ومدرسة بالقاهرة بدأ السلطان حسن عمارته سنة 757هـ، ويصفه المقريزي بأنه لا يُعرف في بلاد الإسلام معبد يحكيه. وتصفه دائرة المعارف الإسلامية بأنه مدرسة صليبية الشكل واسعة للمذاهب الأربعة متصلة بجامع وبقاعة ضريح خلف إيوان القبلة، بارزة بضخامتها وعلوها بين عمائر القرن الثامن الهجري. وتذكر أن بوابته ذات أصل أناضولي على نمط المدرسة الزرقاء في سيواس، وأنه بقي غير مكتمل عند مقتل السلطان سنة 763هـ/1362م.
  en: A mosque and madrasa in Cairo; Sultan Hasan began building it in 757 AH, and al-Maqrizi says no mosque of the Muslims is known to resemble it. The Encyclopaedia of Islam describes a vast cruciform madrasa for the four schools of law, joined to a congregational mosque and a tomb chamber behind the qibla iwan, outstanding for its scale and height among fourteenth-century buildings. It reports an Anatolian origin for the portal, after the Gok Medrese at Sivas, and that the building was unfinished when the sultan was murdered in 763 AH/1362 CE.
  ur: قاہرہ کی ایک مسجد اور مدرسہ جس کی تعمیر سلطان حسن نے 757ھ میں شروع کی، اور مقریزی کے بقول اسلامی ممالک میں اس جیسی کوئی عبادت گاہ معروف نہیں۔ دائرۃ المعارف اسلامیہ اسے چاروں فقہی مذاہب کے لیے ایک وسیع صلیب نما مدرسہ بتاتی ہے جو جامع مسجد اور قبلہ ایوان کے پیچھے مقبرے کے کمرے سے جڑا ہے، اور جو اپنی وسعت اور بلندی میں چودھویں صدی عیسوی کی عمارتوں میں نمایاں ہے۔ وہ دروازے کا اناطولی اصل سیواس کے گوک مدرسہ کے نمونے پر بتاتی ہے، اور یہ کہ سلطان کے قتل 763ھ/1362ء کے وقت عمارت نامکمل تھی۔
