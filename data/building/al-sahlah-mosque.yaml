label:
  ar: "مسجد السهلة"
  en: "Al-Sahlah Mosque, Kufa"
summary:
  ar: "مسجد السهلة بالكوفة؛ تروي «موسوعة العتبات» أنه «البقية الباقية من المساجد التي اختطّتها القبائل بعد مسجد الجامع» وأشهر المساجد المباركة عند الشيعة إلى جانب مساجد غني وبني ظفر والحمراء وجعفي، وهو اليوم في ظاهر الكوفة شمال غرب الجامع على نحو كيلومترين. ويرجّح المصدر أنه شُيّد قبل مجيء علي إلى الكوفة، ويذكر نقلاً عن ابن الفقيه أن «مسجد ظفر» الذي عدّه علي من بقاع الكوفة المقدسة هو مسجد السهلة؛ مساحته ١٢٥×١٤٠ م وترتفع جدرانه نحو ٢٢ م ويدعم كل ضلع أبراج نصف دائرية على أبعاد متساوية، وأرضية بيت الصلاة مفروشة بآجرّ ٢٤×٢٤ سم {cite:musawat-atabat}."
  en: "The al-Sahlah Mosque of Kufa; the Mawsu'at al-Atabat calls it 'the surviving remnant of the mosques the tribes staked out after the Jami'' and the most renowned of the mosques the Shi'a hold blessed, alongside the mosques of Ghani, Bani Zafar, al-Hamra and Ja'fi — today in Kufa's outskirts about two kilometres northwest of the Great Mosque. The source surmises it predates Ali's arrival at Kufa and cites Ibn al-Faqih's report identifying Ali's 'masjid Zafar' as al-Sahlah; it measures 125×140 m with walls some 22 m high, each side reinforced by equally-spaced semicircular towers, the prayer hall paved in 24×24 cm brick {cite:musawat-atabat}."
