summary:
  ar: "مسجد السهلة بالكوفة؛ تروي «موسوعة العتبات» أنه «البقية الباقية من المساجد التي اختطّتها القبائل بعد مسجد الجامع» وأشهر المساجد المباركة عند الشيعة إلى جانب مساجد غني وبني ظفر والحمراء وجعفي، وهو اليوم في ظاهر الكوفة شمال غرب الجامع على نحو كيلومترين {cite:musawat-atabat}."
  en: "The al-Sahlah Mosque of Kufa; the Mawsu'at al-Atabat calls it 'the surviving remnant of the mosques the tribes staked out after the Jami'' and the most renowned of the mosques the Shi'a hold blessed, alongside the mosques of Ghani, Bani Zafar, al-Hamra and Ja'fi — today in Kufa's outskirts about two kilometres northwest of the Great Mosque {cite:musawat-atabat}."
