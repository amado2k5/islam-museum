summary:
  ar: "مسجد السهلة بالكوفة؛ تروي «موسوعة العتبات» أنه «البقية الباقية من المساجد التي اختطّتها القبائل بعد مسجد الجامع» وأشهر المساجد المباركة عند الشيعة إلى جانب مساجد غني وبني ظفر والحمراء وجعفي، وهو اليوم في ظاهر الكوفة شمال غرب الجامع على نحو كيلومترين. ويرجّح المصدر أنه شُيّد قبل مجيء علي إلى الكوفة، ويذكر نقلاً عن ابن الفقيه أن «مسجد ظفر» الذي عدّه علي من بقاع الكوفة المقدسة هو مسجد السهلة؛ مساحته ١٢٥×١٤٠ م وترتفع جدرانه نحو ٢٢ م ويدعم كل ضلع أبراج نصف دائرية على أبعاد متساوية، وأرضية بيت الصلاة مفروشة بآجرّ ٢٤×٢٤ سم {cite:musawat-atabat}."
  en: "The al-Sahlah Mosque of Kufa; the Mawsu'at al-Atabat calls it 'the surviving remnant of the mosques the tribes staked out after the Jami'' and the most renowned of the mosques the Shi'a hold blessed, alongside the mosques of Ghani, Bani Zafar, al-Hamra and Ja'fi — today in Kufa's outskirts about two kilometres northwest of the Great Mosque. The source surmises it predates Ali's arrival at Kufa and cites Ibn al-Faqih's report identifying Ali's 'masjid Zafar' as al-Sahlah; it measures 125×140 m with walls some 22 m high, each side reinforced by equally-spaced semicircular towers, the prayer hall paved in 24×24 cm brick {cite:musawat-atabat}."
  fr: "La mosquée al-Sahlah de Kufa ; la Mawsu’at al-Atabat la qualifie de « vestige subsistant des mosquées dont les tribus délimitèrent les emplacements après la grande mosquée » et de plus renommée des mosquées tenues pour bénies par les chiites, aux côtés de celles de Ghani, Bani Zafar, al-Hamra et Ja’fi — aujourd’hui à la périphérie de Kufa, environ deux kilomètres au nord-ouest de la Grande Mosquée. La source suppose qu’elle précède l’arrivée d’Ali à Kufa et cite le récit d’Ibn al-Faqih identifiant le « masjid Zafar » d’Ali à al-Sahlah ; elle mesure 125 × 140 m, avec des murs d’environ 22 m de haut, chaque côté renforcé de tours semi-circulaires régulièrement espacées, et une salle de prière pavée de briques de 24 × 24 cm {cite:musawat-atabat}."
  es: "La mezquita al-Sahlah de Kufa; el Mawsu'at al-Atabat la llama \"el vestigio superviviente de las mezquitas que las tribus establecieron después del Jami\" y la más renombrada de las mezquitas que los chiítas consideran benditas, junto con las mezquitas de Ghani, Bani Zafar, al-Hamra y Ja'fi, hoy en las afueras de Kufa, a unos dos kilómetros al noroeste de la Gran Mezquita. La fuente supone que es anterior a la llegada de Ali a Kufa y cita el informe de Ibn al-Faqih que identifica la \"masjid Zafar\" de Ali como al-Sahlah; mide 125 × 140 m con muros de unos 22 m de altura, cada lado reforzado por torres semicirculares igualmente espaciadas, la sala de oración pavimentada con ladrillos de 24 × 24 cm {cite:musawat-atabat}."
  ur: "کوفہ کی الصلاح مسجد؛ موصوف الاطباط اسے 'جامع کے بعد قبائل کی جانب سے داؤ پر لگا دی گئی مساجد کی باقی ماندہ باقیات' کہتا ہے اور ان مساجد میں سے سب سے مشہور جنہیں شیعوں نے برکت دی، غنی، بنی ظفر، الحمرا اور جعفی کی مساجد کے ساتھ - آج کوفہ کے مضافات میں تقریباً دو کلومیٹر شمال میں واقع ہے۔ ماخذ نے قیاس کیا ہے کہ یہ علی کی کوفہ آمد سے پہلے کی ہے اور ابن الفقیہ کی رپورٹ کا حوالہ دیا ہے جس میں علی کی 'مسجد ظفر' کو الصحلہ کہا گیا ہے۔ اس کی پیمائش 125×140 میٹر ہے جس کی دیواریں کچھ 22 میٹر اونچی ہیں، ہر طرف برابر فاصلے پر نیم سرکلر ٹاورز سے مضبوط کیا گیا ہے، نماز کا ہال 24×24 سینٹی میٹر اینٹوں سے بنا ہوا ہے۔"
  tr: "Kufe'deki El-Sahla Camii; \"Türbeler Ansiklopedisi\"ne göre, \"camideki camiden sonra kabileler tarafından inşa edilen kalan camii\" ve Şiiler arasında en ünlü mübarek cami olarak yer alır; Gani, Bani Zafar, Al-Hamra ve Ja'fi camileriyle birlikte. Bugün Kufe'nin dışında, caminin yaklaşık iki kilometre kuzeybatısında yer almaktadır. Kaynak, Ali Kufe'ye gelmeden önce inşa edildiğini öne sürmektedir. İbn el-Fakih, İbn al-Faqih'i \"Zafar Camii\" olarak aktarır; Ali burayı Kufe'nin kutsal yerlerinden biri olan Al-Sahla Camii olarak kabul eder; alanı 125×140 metre, duvarları yaklaşık 22 metre yükselir, her iki tarafı eşit boyutlarda yarım daire kulelerle desteklenir ve ibadet evinin zemini 24×24 cm tuğlalarla döşenmiştir."
  id: "Masjid Al-Sahla di Kufa; \"Ensiklopedia Makam\" menceritakan bahwa masjid ini adalah \"masjid yang tersisa yang dibangun oleh suku-suku setelah masjid masjid,\" dan merupakan masjid terberkati paling terkenal di kalangan Syiah, bersama masjid Ghani, Bani Zafar, Al-Hamra, dan Ja'fi. Saat ini, masjid ini terletak di pinggiran Kufa, sekitar dua kilometer barat laut masjid. Sumber tersebut menyebutkan masjid ini dibangun sebelum Ali datang ke Kufa. Ibn al-Faqih mengutip Ibn al-Faqih sebagai \"Masjid Zafar,\" yang dianggap Ali sebagai salah satu situs suci Kufa, yaitu Masjid Al-Sahla; luasnya 125×140 meter, dindingnya menjulang sekitar 22 meter, setiap sisinya didukung oleh menara setengah lingkaran dengan dimensi yang sama, dan lantai rumah doa dilapisi bata setinggi 24×24 cm."
