summary:
  ar: "أقدم مبنيين تجاريين على شاطئ القرن الذهبي يُظن أنهما بيزنطيان؛ تحت بلقابان أقبية طوبية واسعة نحو ألفي متر مربع من مخازن القرن الرابع أو الخامس."
  en: "The two oldest commercial buildings on the Golden Horn shore, believed Byzantine; beneath Balkapan Han lie great herringbone brick vaults of c.2,000 m² — ancient granaries of the old market quarter."
  fr: "Les deux plus anciens édifices commerciaux du rivage de la Corne d’Or, présumés byzantins ; sous Balkapan Han s’étendent de grandes voûtes de brique en arêtes de poisson d’environ 2 000 m², anciens greniers du vieux quartier marchand."
  es: "Los dos edificios comerciales más antiguos de la costa del Cuerno de Oro, que se cree que son bizantinos; bajo Balkapan Han se encuentran grandes bóvedas de ladrillo en espiga de unos 2.000 m², antiguos graneros del antiguo barrio del mercado."
  ur: "گولڈن ہارن ساحل پر دو قدیم ترین تجارتی عمارات، بازنطینی کے خیال میں؛ بالکاپن ہان کے نیچے c.2,000 m² کے عظیم ہیرنگ بون اینٹوں کے والٹس پڑے ہیں - پرانے بازار کے کوارٹر کے قدیم اناج کے ذخیرے۔"
  tr: "Altın Boynuzlu kıyısındaki en eski ticari binaların Bizans dönemine ait olduğuna inanılmaktadır; iki balkabanın altında, 4. veya 5. yüzyıl depolarından yaklaşık iki bin metrekarelik geniş tobe tonozları bulunmaktadır."
  id: "Bangunan komersial tertua di pantai Golden Horn diyakini berasal dari Bizantium; di bawah dua balqaban terdapat kubah besar sekitar dua ribu meter persegi dari gudang-gudang abad ke-4 atau ke-5."
