label: { ar: "الكهف بقاسيون ⁦(كهف جبريل)⁩", en: "the Cave of Qasyun (Jibril's Cave)", fr: "La grotte de Qasyun (grotte de Jibril)", es: "La cueva de Qasyun (Cueva de Jibril)", ur: "غارِ قصیون ⁦(غار جبریل)⁩" }
summary:
  ar: "مسجد بالكهف على جبل قاسيون بدمشق ابتدأ ببنائه أبو الفرج محمد بن عبد الله بن المعلم سنة سبعين وثلثمائة بعد أن رأى في النوم جبريل يأمره أن يبني مسجداً يصلّى فيه ويُذكر اسم الله؛ سماه كهف جبريل، وهو مسجد فسيح مفروش بالرخام الأبيض وأعمدته كلها رخام، ولا يخلو من سكنى الصلحاء معموراً بالذكر {cite:umari-masalik-1924 p. 209}."
  en: "The mosque raised inside the cave of Mount Qasyun by Abu al-Faraj Muhammad ibn Abd Allah ibn al-Mu'allim beginning in 370, after a dream in which Jibril bade him build a mosque where God's name would be remembered — he called it Jibril's Cave; a broad prayer-hall floored in white marble, its columns all marble, never empty of the pious at remembrance {cite:umari-masalik-1924 p. 209}."
  fr: "Mosquée élevée dans la grotte du mont Qasyun par Abu al-Faraj Muhammad ibn Abd Allah ibn al-Mu’allim à partir de 370, après un rêve où Jibril lui demanda de bâtir une mosquée où serait rappelé le nom de Dieu — il la nomma grotte de Jibril ; vaste salle de prière pavée de marbre blanc, aux colonnes toutes de marbre, toujours fréquentée par des fidèles au rappel de Dieu {cite:umari-masalik-1924 p. 209}."
  es: "La mezquita erigida dentro de la cueva del monte Qasyun por Abu al-Faraj Muhammad ibn Abd Allah ibn al-Mu'allim a partir del año 370, después de un sueño en el que Jibril le ordenó construir una mezquita donde se recordara el nombre de Dios; la llamó la Cueva de Jibril; una amplia sala de oración con suelo de mármol blanco, sus columnas también de mármol, nunca vacía de piadosos en recuerdo {cite:umari-masalik-1924 p. 209}."
  ur: "ابو الفراج محمد بن عبد اللہ ابن المعلم کی طرف سے کوہ قصیون کے غار کے اندر تعمیر کی گئی مسجد 370 میں شروع ہوئی، ایک خواب کے بعد جس میں جبریل نے انہیں ایک مسجد بنانے کا کہا جہاں خدا کا نام یاد کیا جائے گا - انہوں نے اسے جبریل کا غار کہا۔ سفید سنگ مرمر سے فرش والا ایک وسیع نماز گاہ، اس کے تمام کالم سنگ مرمر کے، یاد میں کبھی بھی متقیوں سے خالی نہیں ہوتے۔ 209}۔"
