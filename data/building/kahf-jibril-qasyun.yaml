summary:
  ar: "مسجد بالكهف على جبل قاسيون بدمشق ابتدأ ببنائه أبو الفرج محمد بن عبد الله بن المعلم سنة سبعين وثلثمائة بعد أن رأى في النوم جبريل يأمره أن يبني مسجداً يصلّى فيه ويُذكر اسم الله؛ سماه كهف جبريل، وهو مسجد فسيح مفروش بالرخام الأبيض وأعمدته كلها رخام، ولا يخلو من سكنى الصلحاء معموراً بالذكر {cite:umari-masalik-1924 p. 209}."
  en: "The mosque raised inside the cave of Mount Qasyun by Abu al-Faraj Muhammad ibn Abd Allah ibn al-Mu'allim beginning in 370, after a dream in which Jibril bade him build a mosque where God's name would be remembered — he called it Jibril's Cave; a broad prayer-hall floored in white marble, its columns all marble, never empty of the pious at remembrance {cite:umari-masalik-1924 p. 209}."
