summary:
  ar: "«مسجد اليمامة» على التل الخامس بناه عتيق سنان مهندس الفاتح الأكبر ومصمم جامع الفاتح الأصلي؛ في حديقته قبره المؤرخ 1471م."
  en: "The 'Turtle Dove' mescit on the Fifth Hill built by Atik Sinan, Fatih's Chief Architect and designer of the original Fatih Camii; his tombstone dated 1471 stands in its garden."
  fr: "La petite mosquée de la tourterelle sur la Cinquième Colline, construite par Atik Sinan, architecte en chef de Fatih et concepteur de la première Fatih Camii ; sa pierre tombale datée de 1471 se dresse dans le jardin."
  es: "El mescito 'Tórtola' en la Quinta Colina fue construido por Atik Sinan, arquitecto jefe de Fatih y diseñador de la Mezquita de Fatih original; su lápida, fechada en 1471, se encuentra en su jardín."
  ur: "پانچویں پہاڑی پر 'ٹرٹل ڈو' میسکیٹ جو فاتح کے چیف آرکیٹیکٹ اور اصلی فاتح کامی کے ڈیزائنر اتیک سینان نے بنایا تھا۔ اس کا 1471 کا مقبرہ اس کے باغ میں کھڑا ہے۔"
  tr: "Beşinci tepedeki \"Al-Yamamah Camii\", Büyük Fatih'in mimarı ve orijinal Al-Fateh Camii'nin orijinal tasarımcısı Atiq Sinan tarafından inşa edilmiştir; bahçesinde 1471 yılına tarihlenen mezarı bulunmaktadır."
  id: "\"Masjid Al-Yamamah\" di gundukan kelima dibangun oleh Atiq Sinan, arsitek Sang Penakluk Agung dan perancang asli Masjid Al-Fateh asli; di tamannya, makamnya yang bertanggal 1471 M ditemukan."
