  ar: "بناه 1486م إسحاق باشا وزير الفاتح ووزير بايزيد الثاني الأعظم خارج أسوار طوب قابي؛ مربع مقبب وحمامه الضخم المقابل خراب جزئياً."
  en: "Built 1486 by İshak Pasha, vezir of Fatih and grand vezir of Beyazit II, just outside Topkapı's walls; a simple domed square whose once-grand double hamam across the street is partly ruined."
  fr: "Construite en 1486 par İshak Pasha, vizir de Fatih et grand vizir de Beyazit II, juste hors des murs de Topkapı ; un simple carré à coupole dont le double hammam autrefois imposant, de l’autre côté de la rue, est partiellement ruiné."
  es: "Construida en 1486 por İshak Pasha, vezir de Fatih y gran vezir de Beyazit II, justo a las afueras de las murallas de Topkapi; una sencilla plaza con cúpula cuyo otrora grandioso hammam doble, al otro lado de la calle, está parcialmente en ruinas."
  ur: "1486 میں فتح کے وزیر اشک پاشا اور بیازیت II کے عظیم وزیر نے توپکاپی کی دیواروں کے بالکل باہر تعمیر کیا تھا۔ ایک سادہ گنبد والا چوک جس کی سڑک کے پار ایک بار عظیم الشان ڈبل حمام جزوی طور پر تباہ ہو چکا ہے۔"
