kids:
  ar: "زمزم بئر ماء مقدسة في مكة قرب الكعبة، يشرب منها الحجاج ويحملون ماءها إلى بلادهم."
  en: "Zamzam is a holy well in Mecca beside the Kaaba; pilgrims drink its water and carry some home."
  ur: "زمزم مکہ میں کعبہ کے پاس مقدس کنواں ہے، حاجی اس کا پانی پیتے ہیں اور اپنے ساتھ گھر لے جاتے ہیں۔"
