label: { ar: "بئر زمزم", en: "Zamzam Well", ur: "چاہِ زمزم" }
summary:
  ar: "زمزم هي البئر المقدسة في طرف الحرم بمكة المكرمة، شرق الكعبة بجانب الجدار الذي فيه الحجر الأسود وأبعد قليلاً عن الوسط من مقام إبراهيم. وتقول دائرة المعارف الإسلامية إن الاسم من نوع محاكاة الصوت ويدل في المعاجم على الماء الكثير، وإن الروايات العباسية أدخلت البئر في خطاب أسطوري يتجاوز نص القرآن الذي لا يذكرها صراحة. ويقصدها الحجاج منذ صدر الإسلام ويعدّون ماءها بركة وشفاء {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  en: "Zamzam is the sacred well at the edge of the sanctuary at Mecca, east of the Kaaba beside the wall holding the Black Stone and a little farther from the centre than the Station of Abraham. The Encyclopaedia of Islam says the name is onomatopoeic and means abundant water in the medieval dictionaries, and that Abbasid-period accounts folded the well into a mythic discourse that goes beyond the Qur'anic text, which does not refer to it directly. Pilgrims have treasured its water as blessed and curative from early Islamic times to today {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  ur: "زمزم مکہ مکرمہ میں حرم کے کنارے کا مقدس کنواں ہے، کعبہ کے مشرق میں اس دیوار کے ساتھ جس میں حجر اسود نصب ہے، اور مقام ابراہیم سے مرکز کے ذرا زیادہ دور۔ دائرۃ المعارف الاسلامیہ کے مطابق یہ نام آواز کی نقل پر بنا ہے اور قدیم لغات میں کثیر پانی کے معنی میں آتا ہے، اور عباسی دور کی روایات نے کنویں کو ایک اساطیری بیانیے میں شامل کر دیا جو قرآنی متن سے آگے جاتا ہے، جو اس کا براہِ راست ذکر نہیں کرتا۔ حاجی اسلام کے ابتدائی دور سے آج تک اس کے پانی کو بابرکت اور شفا بخش سمجھتے آئے ہیں {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
