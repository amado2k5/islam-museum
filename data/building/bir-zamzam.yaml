summary:
  ar: "زمزم هي البئر المقدسة في طرف الحرم بمكة المكرمة، شرق الكعبة بجانب الجدار الذي فيه الحجر الأسود وأبعد قليلاً عن الوسط من مقام إبراهيم. وتقول دائرة المعارف الإسلامية إن الاسم من نوع محاكاة الصوت ويدل في المعاجم على الماء الكثير، وإن الروايات العباسية أدخلت البئر في خطاب أسطوري يتجاوز نص القرآن الذي لا يذكرها صراحة. ويقصدها الحجاج منذ صدر الإسلام ويعدّون ماءها بركة وشفاء {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  en: "Zamzam is the sacred well at the edge of the sanctuary at Mecca, east of the Kaaba beside the wall holding the Black Stone and a little farther from the centre than the Station of Abraham. The Encyclopaedia of Islam says the name is onomatopoeic and means abundant water in the medieval dictionaries, and that Abbasid-period accounts folded the well into a mythic discourse that goes beyond the Qur'anic text, which does not refer to it directly. Pilgrims have treasured its water as blessed and curative from early Islamic times to today {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  fr: "Zamzam est le puits sacré au bord du sanctuaire de La Mecque, à l’est de la Kaaba, près du mur portant la Pierre noire et un peu plus loin du centre que la station d’Abraham. L’Encyclopédie de l’Islam dit que son nom est une onomatopée et signifie une eau abondante dans les dictionnaires médiévaux ; les récits de l’époque abbasside intégrèrent le puits à un discours mythique dépassant le texte coranique, qui ne le mentionne pas directement. Depuis les débuts de l’islam jusqu’à nos jours, les pèlerins tiennent son eau pour bénie et curative {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  ur: "زمزم مکہ مکرمہ میں حرم کے کنارے کا مقدس کنواں ہے، کعبہ کے مشرق میں اس دیوار کے ساتھ جس میں حجر اسود نصب ہے، اور مقام ابراہیم سے مرکز کے ذرا زیادہ دور۔ دائرۃ المعارف الاسلامیہ کے مطابق یہ نام آواز کی نقل پر بنا ہے اور قدیم لغات میں کثیر پانی کے معنی میں آتا ہے، اور عباسی دور کی روایات نے کنویں کو ایک اساطیری بیانیے میں شامل کر دیا جو قرآنی متن سے آگے جاتا ہے، جو اس کا براہِ راست ذکر نہیں کرتا۔ حاجی اسلام کے ابتدائی دور سے آج تک اس کے پانی کو بابرکت اور شفا بخش سمجھتے آئے ہیں {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  es: "Zamzam es el pozo sagrado situado en el límite del santuario de La Meca, al este de la Kaaba, junto al muro que sostiene la Piedra Negra y un poco más alejado del centro que la Estación de Abraham. La Enciclopedia del Islam afirma que el nombre es onomatopéyico y significa «agua abundante» en los diccionarios medievales, y que los relatos del período abasí incorporaron el pozo a un discurso mítico que trasciende el texto coránico, el cual no lo menciona directamente. Los peregrinos han venerado sus aguas como benditas y curativas desde los inicios del Islam hasta la actualidad {cite:encyclopaedia-of-islam-2 vol. 11 p. 457}."
  tr: "Zemzem, Mekke'de Haram'ın kenarında, Kabe'nin doğusunda, Kara Taş'ı barındıran duvarın yanında ve İbrahim İstasyonu'ndan biraz daha uzakta bulunan kutsal kuyudur. İslam Ansiklopedisi, ismin bir tür ses taklidi olduğunu ve sözlüklerde bol suyu ifade ettiğini, Abbasiler rivayetlerinin ise kuyuyu Kur'an metninin ötesine geçen mitolojik bir söylemde tanıttığını belirtir; metin açıkça bahsetmez. Hacılar, İslam'ın ilk günlerinden beri burayı ziyaret etmiş, suyunu bir nimet ve şifa olarak görmüştür {cite:encyclopaedia-of-Islam-2 cilt 11, s. 457}."
  id: "Zamzam adalah sumur suci di tepi Haram di Mekah, sebelah timur Ka'bah, di sebelah tembok yang berisi Batu Hitam dan sedikit lebih jauh dari pusat daripada Stasiun Ibrahim. Ensiklopedia Islam menyatakan bahwa nama tersebut adalah jenis tiruan suara dan dalam kamus merujuk pada air yang melimpah, dan narasi Abbasiyah memperkenalkan sumur ini dalam wacana mitos yang melampaui teks Al-Qur'an, yang tidak secara eksplisit menyebutkannya. Para peziarah telah mengunjunginya sejak masa awal Islam, menganggap airnya sebagai berkah dan penyembuhan {cite:encyclopaedia-of-Islam-2 vol. 11, hlm. 457}."
