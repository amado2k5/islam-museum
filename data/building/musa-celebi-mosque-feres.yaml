label: { ar: "جامع موسى چلبي في فرجيك ⁦(فيريس)⁩", en: "Musa Çelebi Mosque, Feres (Ferecik)", fr: "Mosquée Musa Çelebi, Feres (Ferecik)", ur: "موسیٰ چلبی مسجد، فیریس", es: "Mezquita Musa Çelebi, Feres (Ferecik)", tr: "Ferjik (Ferris) Musa Çelebi Camii", id: "Masjid Musa Çelebi di Ferjik (Ferris)" }
summary:
  ar: "جامع بناه موسى چلبي ابن بايزيد الأول بين 1410 و1413 في فرجيك ⁦(فيريس)⁩ على الحدود اليونانية التركية، كان ذا مئذنة وسقف جملوني بلا قبة، وحُوّل كنيسة القديس نيقولا بعد التبادل السكاني سنة 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}."
  en: "A mosque built between 1410 and 1413 by Musa Çelebi, son of Bayezid I, at Feres (Ferecik) on the Greek-Turkish border; originally with a minaret and a gabled roof without a dome, it became the church of St Nicholas after the population exchange of 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}."
  fr: "Mosquée bâtie en 1410–1413 par Musa Çelebi, fils de Bayezid Ier, à la frontière gréco-turque ; initialement à minaret et toit à pignon sans coupole, devenue Saint-Nicolas après l’échange de populations de 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}"
  ur: "یونان ترکی سرحد پر فیریس ⁦(فرجک)⁩ میں بایزید اول کے بیٹے موسیٰ چلبی کی 1410 اور 1413ء کے درمیان بنوائی مسجد؛ اصل میں مینار اور گنبد کے بغیر ڈھلواں چھت والی، 1923ء کے تبادلۂ آبادی کے بعد سینٹ نکولس گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}۔"
  es: "Mezquita construida entre 1410 y 1413 por Musa Çelebi, hijo de Bayezid I, en Feres (Ferecik), en la frontera greco-turca; originalmente con un minarete y un tejado a dos aguas sin cúpula, se convirtió en la iglesia de San Nicolás después del intercambio de población de 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}."
  tr: "Cami, Bayezid I'in oğlu Musa Çelebi tarafından 1410-1413 yılları arasında Yunan-Türk sınırındaki Vercik (Ferris)'de inşa edilmiştir. Kubbesiz bir minare ve çatılı bir yapısı vardı ve 1923'teki nüfus değişiminden sonra Aziz Nikola Kilisesi'ne dönüştürüldü {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023, s. 1034}."
  id: "Masjid ini dibangun oleh Musa Çelebi, putra Bayezid I, antara tahun 1410 dan 1413 di Vercik (Ferris) di perbatasan Yunani-Turki. Masjid ini memiliki menara dan atap bertingkat tanpa kubah, dan diubah menjadi Gereja Santo Nikolas setelah pertukaran penduduk pada tahun 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023, hlm. 1034}."
