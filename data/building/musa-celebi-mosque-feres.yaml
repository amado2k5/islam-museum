summary:
  ar: "جامع بناه موسى چلبي ابن بايزيد الأول بين 1410 و1413 في فرجيك ⁦(فيريس)⁩ على الحدود اليونانية التركية، كان ذا مئذنة وسقف جملوني بلا قبة، وحُوّل كنيسة القديس نيقولا بعد التبادل السكاني سنة 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}."
  en: "A mosque built between 1410 and 1413 by Musa Çelebi, son of Bayezid I, at Feres (Ferecik) on the Greek-Turkish border; originally with a minaret and a gabled roof without a dome, it became the church of St Nicholas after the population exchange of 1923 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}."
  ur: "یونان ترکی سرحد پر فیریس (فرجک) میں بایزید اول کے بیٹے موسیٰ چلبی کی 1410 اور 1413ء کے درمیان بنوائی مسجد؛ اصل میں مینار اور گنبد کے بغیر ڈھلواں چھت والی، 1923ء کے تبادلۂ آبادی کے بعد سینٹ نکولس گرجا بنی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-3-2023 p. 1034}۔"
