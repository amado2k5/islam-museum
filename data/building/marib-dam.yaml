summary:
  en: "The great dam of the Sabaean kingdom whose construction began in the Mukarrib era; its repeated breaches, and final burst around 450 CE, are the Sayl al-Arim of Surat Saba in the sira’s account."
  fr: "Grand barrage du royaume de Saba dont la construction commença à l’époque des mukarribs ; ses ruptures répétées et sa rupture finale vers 450 ap. J.-C. sont le Sayl al-Arim de la sourate Saba dans le récit de la sira."
  ar: "السد العظيم لمملكة سبأ الذي بدأ بناؤه في عهد المكاربة؛ تتابعت ثلماته حتى انفجر انفجاراً كبرى نحو سنة 450م وهو سيل العرم في سورة سبأ."
  es: "La gran presa del reino sabeo, cuya construcción comenzó en la era Mukarrib, sus repetidas brechas y su rotura final alrededor del año 450 d.C., son el Sayl al-Arim de la Sura Saba en el relato de la sira."
  ur: "سبائی بادشاہت کا عظیم ڈیم جس کی تعمیر کا آغاز مکریب دور میں ہوا؛ اس کی بار بار خلاف ورزیاں، اور آخری پھٹ تقریباً 450 عیسوی، سیرت کے کھاتے میں سورت سبا کا سائل العریم ہے۔"
