summary:
  ar: "بطاقة أولية لمسجد الحديبية قرب مكة، المسجد الذي أقيم موضع مبايعة الصحابة تحت الشجرة وموضع صلح الحديبية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Masjid al-Hudaybiyya near Mecca, the mosque marking the site of the Bay'at al-Ridwan and the Treaty of Hudaybiyya; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée al-Hudaybiyya près de La Mecque, mosquée marquant le site du serment d’al-Ridwan et du traité d’al-Hudaybiyya. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la mezquita Masjid al-Hudaybiyya cerca de La Meca, la mezquita que marca el lugar de la Bay'at al-Ridwan y el Tratado de Hudaybiyya; sus fuentes aún no han sido verificadas en la página."
  ur: "مکہ کے قریب مسجد الحدیبیہ کے لیے ڈرافٹ کارڈ، بیت الرضوان کی جگہ کی نشاندہی کرنے والی مسجد اور معاہدہ حدیبیہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Mekke yakınlarındaki Hudeybiye Camii için ön kart, Sahabelerin ağaç altında bağlılık yemini ettiği yerde ve Hudeybiyyah Antlaşması'nın yapıldığı yerde kurulmuştur; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Masjid Hudaybiyyah dekat Mekah, masjid yang didirikan di tempat para Sahabat bersumpah setia di bawah pohon dan tempat Perjanjian Hudaybiyyah; sumber-sumbernya di halaman tersebut belum ditinjau."
