summary:
  ar: "بطاقة أولية لجامع أشرف أوغلي في بشهر قونية، الجامع الخشبي السقف الذي بناه سليمان بك الأشرفي سنة ١٢٩٩م؛ من أعظم مساجد الأناضول بالأعمدة الخشبية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Esrefoglu Mosque of Beysehir near Konya, the wooden-columned hypostyle mosque built by the Eshrefid emir Suleiman Beg in 1299; among the greatest wooden mosques of Anatolia per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée hypostyle Eşrefoğlu de Beyşehir, près de Konya, aux colonnes de bois, bâtie par l’émir eshréfide Suleiman Beg en 1299, parmi les plus grandes mosquées de bois d’Anatolie selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la mezquita Esrefoglu de Beysehir, cerca de Konya, la mezquita hipóstila de columnas de madera construida por el emir Eshrefid Suleiman Beg en 1299; una de las mezquitas de madera más grandes de Anatolia según la enciclopedia citada, página aún no revisada."
  ur: "قونیہ کے قریب بیشیر کی ایسریفوگلو مسجد کے لیے ڈرافٹ کارڈ، لکڑی کے کالم والی ہائپو اسٹائل مسجد جو 1299 میں اشریفڈ امیر سلیمان بیگ نے تعمیر کی تھی۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق اناطولیہ کی لکڑی کی سب سے بڑی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Bşehir, Konya'daki Ashrafoğlu Camii'nin ön kartı; Süleyman Bey el-Eşrafi tarafından 1299 yılında inşa edilen ahşap çatılı camii; Anadolu'nun en büyük camilerinden biri ve ahşap sütunlu bir sayfa henüz incelenmemiştir."
  id: "Kartu pendahuluan Masjid Ashrafoglu di Bşehir, Konya, masjid atap kayu yang dibangun oleh Suleiman Bey al-Ashrafi pada tahun 1299 M; salah satu masjid terbesar di Anatolia dengan kolom kayu, dan halamannya belum pernah ditinjau."
