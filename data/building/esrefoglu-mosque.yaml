  es: "Boceto de ficha para la mezquita Esrefoglu de Beysehir, cerca de Konya, la mezquita hipóstila de columnas de madera construida por el emir Eshrefid Suleiman Beg en 1299; una de las mezquitas de madera más grandes de Anatolia según la enciclopedia citada, página aún no revisada."
