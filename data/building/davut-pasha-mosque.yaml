summary:
  ar: "أقدم جامع باقٍ مؤرخ من عهد بايزيد الثاني على التل السابع؛ نقش عربي فوق بابه يؤرخه 480هـ/1485م، بناه الوزير الأعظم داود باشا."
  en: "Earliest dated extant mosque of Beyazit II's reign, Seventh Hill; Arabic inscription gives A.H. 480 (1485), built by grand vezir Davut Pasha."
  fr: "Plus ancienne mosquée conservée et datée du règne de Beyazit II, sur la Septième Colline ; l’inscription arabe donne 480 H (1485), construction du grand vizir Davut Pasha."
  es: "Mezquita más antigua que se conserva del reinado de Beyazit II, en la Séptima Colina; la inscripción en árabe indica el año 480 de la Hégira (1485), construida por el gran visir Davut Pasha."
  ur: "بیاضیت دوم کے دور کی قدیم ترین مسجد، ساتویں پہاڑی؛ عربی نوشتہ ہجری 480 (1485) دیتا ہے، جسے عظیم الشان وزیر داوت پاشا نے بنایا تھا۔"
  tr: "En eski Baq Camii, yedinci tepede II. Bayezid dönemine ait tarihi bir anıttır; kapısının üzerinde 480 Hicri / 1485 yılına tarihlenen Arapça bir yazıt vardır ve Sadrazam Davud Paşa tarafından inşa edilmiştir."
  id: "Masjid Baq tertua adalah monumen bersejarah dari era Bayezid II di gundukan ketujuh; sebuah prasasti Arab di atas pintunya bertanggal 480 H / 1485 M, dibangun oleh Wazir Agung Dawud Pasha."
