  ur: "ایرزورم میں سیفتے میناریلی ⁦(جڑواں مینار)⁩ مدرسہ کے لیے ڈرافٹ کارڈ، تیرہویں صدی کا سلجوک مدرسہ جو اپنے سجاوٹ والے جڑواں میناروں کے لیے جانا جاتا ہے۔ انسائیکلوپیڈیا کا صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Erzurum'daki Civeti Minarlı Okulu (iki minareli) için ön kart; 13. yüzyıl Selçuklu okulu ve iki süslü minaresiyle tanınır; sayfa henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Sekolah Civeti Minarlı (dengan dua menara) di Erzurum, sekolah Seljuk abad ke-13 yang dikenal dengan dua menara ornamennya; halamannya belum ditinjau."
