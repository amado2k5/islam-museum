summary:
  ar: "جامع الفاتح بإسطنبول؛ الكلية الكبرى التي بدأها محمد الفاتح على التل الرابع بعد نحو عقد من الفتح؛ بناها المعماري عتيق سنان، وهدم الأصل في زلزال 1766م فأُعيد بناؤه {cite:freely-ottoman-architecture-2011}. وعند الصلابي: أنشأ الفاتح بجانب مسجده بالقسطنطينية ثماني مدارس على كل جانب من جوانبه، فيها يقضي الطالب مرحلته الأخيرة، وألحق بها مساكن للطلبة ومنحة شهرية وكان الموسم الدراسي على طول السنة، وأنشأ بجانبها مكتبة شرط في أمينها أن يكون متبحراً في أسماء الكتب والمؤلفين، تُعير الطلبة والمدرسين ما يطلبون وتُفتش كل ثلاثة أشهر {cite:dawlat-uthmaniyya-salabi p. 138-139}."
  en: "The Fatih Mosque of Istanbul; the great complex Mehmet the Conqueror began on the Fourth Hill about a decade after the conquest, built by the architect Atik Sinan; the original was destroyed in the 1766 earthquake and rebuilt {cite:freely-ottoman-architecture-2011}."
