summary:
  ar: "جامع الفاتح بإسطنبول؛ الكلية الكبرى التي بدأها محمد الفاتح على التل الرابع بعد نحو عقد من الفتح؛ بناها المعماري عتيق سنان، وهدم الأصل في زلزال 1766م فأُعيد بناؤه {cite:freely-ottoman-architecture-2011}. وعند الصلابي: أنشأ الفاتح بجانب مسجده بالقسطنطينية ثماني مدارس على كل جانب من جوانبه، فيها يقضي الطالب مرحلته الأخيرة، وألحق بها مساكن للطلبة ومنحة شهرية وكان الموسم الدراسي على طول السنة، وأنشأ بجانبها مكتبة شرط في أمينها أن يكون متبحراً في أسماء الكتب والمؤلفين، تُعير الطلبة والمدرسين ما يطلبون وتُفتش كل ثلاثة أشهر {cite:dawlat-uthmaniyya-salabi p. 138-139}."
  en: "The Fatih Mosque of Istanbul; the great complex Mehmet the Conqueror began on the Fourth Hill about a decade after the conquest, built by the architect Atik Sinan; the original was destroyed in the 1766 earthquake and rebuilt {cite:freely-ottoman-architecture-2011}."
  fr: "La mosquée Fatih d’Istanbul ; grand complexe commencé par Mehmet le Conquérant sur la Quatrième Colline environ dix ans après la conquête, construit par l’architecte Atik Sinan ; l’original fut détruit par le séisme de 1766 puis reconstruit {cite:freely-ottoman-architecture-2011}."
  es: "La Mezquita Fatih de Estambul; el gran complejo Mehmet el Conquistador comenzó en la Cuarta Colina aproximadamente una década después de la conquista, construido por el arquitecto Atik Sinan; el original fue destruido en el terremoto de 1766 y reconstruido {cite:freely-ottoman-architecture-2011}."
  ur: "استنبول کی فاتح مسجد؛ عظیم کمپلیکس مہمت فاتح فتح کے تقریباً ایک دہائی بعد چوتھی پہاڑی پر شروع ہوا، جسے معمار اتیک سینان نے تعمیر کیا تھا۔ اصل 1766 کے زلزلے میں تباہ ہو گئی تھی اور اسے دوبارہ تعمیر کیا گیا تھا {cite:freely-ottoman-architecture-2011}۔"
  tr: "İstanbul'daki Fatih Camii; Fatih Mehmed'in fetihten yaklaşık on yıl sonra dördüncü tepede başladığı Büyük Koleji; mimar Atiq Sinan tarafından inşa edildi ve orijinali 1766 depreminde yıkıldı, ardından yeniden inşa edildi {cite:freely-ottoman-architecture-2011}. Al-Salabi'ye göre: Al-Fatih, Konstantinopolis'teki camisinin yanına her iki yanında sekiz okul kurdu; öğrenciler son aşamalarını tamamladı, öğrenciler için yurtlar ve aylık burs ekledi ve akademik yıl boyunca faaliyet gösteren bir kütüphane kurdu. Ayrıca, görevlinin kitap ve yazarların isimlerini iyice bilmesi, öğrencilere ve öğretmenlere istediklerini ödünç vermesi ve her üç ayda bir kontrol etmesi gereken bir kütüphane kurdu. {cite:dawlat-uthmaniyya-salabi s. 138-139}."
  id: "Masjid Fatih di Istanbul; Perguruan Tinggi Besar yang didirikan Mehmed Sang Penakluk di gundukan keempat sekitar satu dekade setelah penaklukan; dibangun oleh arsitek Atiq Sinan, dan yang asli dihancurkan dalam gempa bumi 1766 lalu dibangun kembali {cite:freely-ottoman-architecture-2011}. Menurut Al-Salabi: Al-Fatih mendirikan delapan sekolah di sebelah masjidnya di Konstantinopel di setiap sisi, di mana siswa menyelesaikan tahap akhir mereka, memasang asrama untuk siswa dan beasiswa bulanan, serta mendirikan perpustakaan yang beroperasi sepanjang tahun akademik. Ia juga mendirikan perpustakaan di sebelah mana penjaga harus sangat mengenal nama-nama buku dan penulis, meminjamkan apa yang diminta oleh siswa dan guru dan memeriksa setiap tiga bulan {cite:dawlat-uthmaniyya-salabi hlm. 138-139}."
