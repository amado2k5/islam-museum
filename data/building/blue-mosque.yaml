summary:
  ar: "جامع السلطان أحمد الأول بإسطنبول؛ أمر السلطان أحمد الأول سنة 1609م المعماري محمد آغا بالبدء فيه شرق الهيبودروم القديم، واكتمل سنة 1616م، وله ست مآذن {cite:freely-ottoman-architecture-2011}."
  en: "The Sultan Ahmed Mosque (Blue Mosque) of Istanbul; Ahmed I directed the architect Mehmet Agha to begin it in 1609 on the eastern side of the ancient Hippodrome, completed 1616, with six minarets {cite:freely-ottoman-architecture-2011}."
  fr: "La mosquée du sultan Ahmed, ou Mosquée bleue, d’Istanbul ; Ahmed Ier chargea l’architecte Mehmet Agha de la commencer en 1609 à l’est de l’ancien Hippodrome ; achevée en 1616, elle possède six minarets {cite:freely-ottoman-architecture-2011}."
  es: "La Mezquita del Sultán Ahmed (Mezquita Azul) de Estambul; Ahmed I ordenó al arquitecto Mehmet Agha que la comenzara en 1609 en el lado oriental del antiguo Hipódromo, se completó en 1616, con seis minaretes {cite:freely-ottoman-architecture-2011}."
  ur: "استنبول کی سلطان احمد مسجد ⁦(نیلی مسجد)⁩؛ احمد اول نے معمار مہمت آغا کو ہدایت کی کہ اسے 1609 میں قدیم ہپوڈروم کے مشرقی جانب سے شروع کیا جائے، جو 1616 میں مکمل ہوا، چھ میناروں کے ساتھ۔"
  tr: "İstanbul'daki Sultan Ahmed I Camii; 1609 yılında Sultan Ahmed I, mimar Mehmed Ağa'ya eski Hipodrom'un doğusunda inşa edilmesini emretmiş ve 1616 yılında tamamlanmıştır. Altı minaresi vardır {cite:freely-osmanlı-architecture-2011}."
  id: "Masjid Sultan Ahmed I di Istanbul; pada tahun 1609 M, Sultan Ahmed I memerintahkan arsitek Mehmed Agha untuk memulainya di timur Hippodrome lama, dan selesai dibangun pada tahun 1616 M. Masjid ini memiliki enam menara {cite:freely-ottoman-architecture-2011}."
