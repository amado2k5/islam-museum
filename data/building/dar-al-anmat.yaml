summary:
  ar: "دار بفسطاط مصر كانت تُباع فيها قماش النساء وفاخر اللباس والأمتعة يُجلب إليها من كل أرض، ويجلس على حوانيتها أهل الفراغ واللهو؛ عدّها ابن فضل الله العمري من عجائب المباني وغرائب الآثار {cite:umari-masalik-1924 p. 234}."
  en: "A Fustat emporium where women's fabrics and luxury dress were sold, drawn from every land, its benches sat by the leisured and the pleasure-seekers — counted by al-Umari among the marvels of building {cite:umari-masalik-1924 p. 234}."
  fr: "Un marché de Fustat où l’on vendait des tissus féminins et des vêtements luxueux venus de tous les pays, dont les bancs accueillaient les oisifs et amateurs de plaisirs — compté par al-Umari parmi les merveilles de l’architecture {cite:umari-masalik-1924 p. 234}."
  es: "Un emporio de Fustat donde se vendían telas y vestidos de lujo para mujeres, procedentes de todas partes, con bancos donde se sentaban los ociosos y los buscadores de placer, considerado por al-Umari entre las maravillas de la arquitectura {cite:umari-masalik-1924 p. 234}."
  ur: "ایک فوسٹیٹ ایمپوریم جہاں خواتین کے کپڑے اور پرتعیش لباس فروخت کیے جاتے تھے، ہر ملک سے تیار کیے جاتے تھے، اس کے بینچ تفریحی اور لذت کے متلاشی افراد کے لیے بیٹھتے تھے - جسے العماری نے عمارت کے عجائبات میں شمار کیا تھا۔ 234}۔"
  tr: "Mısır'ın Fustat kentinde, ülkenin dört bir yanından getirilen kadın giysileri, lüks giysiler ve eşyaların satıldığı, boş zamanları ve eğlence alanlarının dükkanlarında oturduğu bir ev; İbn Fadlallah Al-Omari burayı binaların harikalarından ve antikaların tuhaflıklarından biri olarak görmüştür {cite:umari-masalik-1924, s. 234}."
  id: "Sebuah rumah di Fustat, Mesir, tempat kain wanita, pakaian mewah, dan barang-barang dijual, dibawa dari seluruh negeri, serta orang-orang yang bersantai dan berhiburan duduk di toko-tokonya; Ibn Fadlallah Al-Omari menganggapnya sebagai salah satu keajaiban bangunan dan keanehan barang kuno {cite:umari-masalik-1924, hlm. 234}."
