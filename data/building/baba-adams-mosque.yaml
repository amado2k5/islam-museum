summary:
  ar: "مسجد برواقين وست قباب في رامپال بإقليم داكا، بناه الملك كافور في عهد السلطان جلال الدين فتح شاه في رجب 888هـ/أغسطس 1483 بحسب نقشه، وأعمدته من البازلت الأسود {c(138)}."
  en: "A two-aisled, six-domed mosque at Rampal in Dhaka district, built according to its inscription by Malik Kafur under Sultan Jalal al-Din Fath Shah in Rajab 888 (August 1483), on black basalt pillars {c(138)}."
  ur: "ضلع ڈھاکہ کے رامپال میں دو صفوں اور چھ گنبدوں کی مسجد، کتبے کے مطابق سلطان جلال الدین فتح شاہ کے عہد میں ملک کافور نے رجب 888ھ (اگست 1483) میں بنوائی، سیاہ بسالٹ کے ستونوں پر {c(138)}۔"
