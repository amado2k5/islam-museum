label: { ar: "مسجد بابا آدم في رامپال ⁦(داكا)⁩", en: "Mosque of Baba Adam, Rampal (Dhaka)", fr: "Mosquée de Baba Adam, Rampal (Dhaka)", ur: "بابا آدم مسجد، رامپال ⁦(ڈھاکہ)⁩", es: "Mezquita de Baba Adam, Rampal (Dhaka)", tr: "Rampal (Dakka) Baba Adam Camii", id: "Masjid Baba Adam di Rampal (Dhaka)" }
summary:
  ar: "مسجد برواقين وست قباب في رامپال بإقليم داكا، بناه الملك كافور في عهد السلطان جلال الدين فتح شاه في رجب 888هـ/أغسطس 1483 بحسب نقشه، وأعمدته من البازلت الأسود {c(138)}."
  en: "A two-aisled, six-domed mosque at Rampal in Dhaka district, built according to its inscription by Malik Kafur under Sultan Jalal al-Din Fath Shah in Rajab 888 (August 1483), on black basalt pillars {c(138)}."
  fr: "Mosquée à deux nefs et six coupoles à Rampal, dans le district de Dhaka, construite selon son inscription par Malik Kafur sous le sultan Jalal al-Din Fath Shah en rajab 888 (août 1483), sur des piliers de basalte noir {c(138)}."
  ur: "ضلع ڈھاکہ کے رامپال میں دو صفوں اور چھ گنبدوں کی مسجد، کتبے کے مطابق سلطان جلال الدین فتح شاہ کے عہد میں ملک کافور نے رجب 888ھ ⁦(اگست 1483)⁩ میں بنوائی، سیاہ بسالٹ کے ستونوں پر {c(138)}۔"
  es: "Una mezquita de dos naves y seis cúpulas en Rampal, en el distrito de Dhaka, construida según su inscripción por Malik Kafur bajo el sultán Jalal al-Din Fath Shah en Rajab 888 (agosto de 1483), sobre pilares de basalto negro {c(138)}."
  tr: "Buraqin Camii ve Rampal, Dakka bölgesindeki altı kubbe, Sultan Kafur tarafından Kral Kafur tarafından 888 Hicri Recep'te / Ağustos 1483'te inşa edilmiştir ve sütunları siyah bazalt {c(138)} ile yapılmıştır."
  id: "Masjid Buraqin dan enam kubah di Rampal, wilayah Dhaka, dibangun oleh Raja Kafur pada masa pemerintahan Sultan Jalaluddin Fath Shah pada Rajab 888 AH / Agustus 1483 menurut prasasti beliau, dan kolom-kolomnya terbuat dari basalt hitam {c(138)}."
