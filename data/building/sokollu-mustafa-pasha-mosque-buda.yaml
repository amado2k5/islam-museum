summary:
  ar: "جامع إبراهيم چاووش المتهدم في حي الدباغين ⁦(تبان)⁩ ببودا، رممه صوقوللي مصطفى باشا فحمل اسمه، وصار بعد العثمانيين كنيسة القديسة كاترين الإسكندرية، ومصحف وقفه سنة 1574 في مكتبة جامعة لايبزيغ {cite:yilmaz-ottoman-architecture-hungary-2024 p. 41}."
  en: "The ruinous mosque of İbrahim Çavuş in the tanners' quarter (Tabán) of Buda, restored by Sokollu Mustafa Pasha and named after him, later the church of St Catherine of Alexandria; the Qur'an he endowed in 1574 is in Leipzig University Library {cite:yilmaz-ottoman-architecture-hungary-2024 p. 41}."
  ur: "بودا کے دباغوں کے محلے (تابان) میں ابراہیم چاؤش کی خستہ مسجد جسے صوقوللو مصطفیٰ پاشا نے مرمت کیا اور اسی نام سے مشہور ہوئی؛ بعد میں سینٹ کیتھرین گرجا؛ ان کا 1574ء کا وقف کردہ قرآن لائپزگ یونیورسٹی لائبریری میں ہے {cite:yilmaz-ottoman-architecture-hungary-2024 p. 41}۔"
