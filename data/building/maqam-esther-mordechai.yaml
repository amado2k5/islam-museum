  tr: "Hamadan'daki Ester ve Mordechai türbesi için ön kart; İran'daki Ester Kitabı'nın kahramanlarına atfedilen Yahudi mezarı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk makam Esther dan Mordechai di Hamadan, makam Yahudi yang dikaitkan dengan para pahlawan Kitab Esther di Iran; sumber-sumbernya di halaman belum ditinjau."
