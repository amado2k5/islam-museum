label: { ar: "قبر أورنگزيب في خلدآباد", en: "Tomb of Aurangzeb, Khuldabad", fr: "Tombeau d’Aurangzeb, Khuldabad", ur: "مقبرۂ اورنگزیب، خلد آباد", es: "Tumba de Aurangzeb, Khuldabad" }
summary:
  ar: "قبر الإمبراطور أورنگزيب في خلدآباد قرب أورنگ‌آباد في الدكن، حظيرة مربعة صغيرة بسور رخامي بسيط، أوصى أن يُبنى من ثمن مصاحف نسخها بيده {cite:brookes-gardens-of-paradise-1987 p.160}."
  en: "The grave of the emperor Aurangzeb at Khuldabad near Aurangabad in the Deccan, a small square enclosure with a plain marble wall, which he directed be built only from the sale of Qur'an copies he wrote by hand {cite:brookes-gardens-of-paradise-1987 p.160}."
  fr: "Près d’Aurangabad au Deccan, petit enclos carré à simple mur de marbre ; Aurangzeb voulut le financer seulement par les copies du Coran de sa main vendues. {cite:brookes-gardens-of-paradise-1987 p.160}"
  es: "La tumba del emperador Aurangzeb en Khuldabad, cerca de Aurangabad en el Deccan, un pequeño recinto cuadrado con una pared lisa de mármol, que él ordenó que se construyera únicamente con la venta de copias del Corán que escribió a mano {cite:brookes-gardens-of-paradise-1987 p.160}."
  ur: "دکن میں اورنگ آباد کے قریب خلد آباد میں شہنشاہ اورنگزیب کی قبر، سنگ مرمر کی ایک سادہ دیوار کے ساتھ ایک چھوٹا مربع دیوار، جسے اس نے اپنے ہاتھ سے لکھے ہوئے قرآن کے نسخوں کی فروخت سے تعمیر کرنے کی ہدایت کی تھی۔"
