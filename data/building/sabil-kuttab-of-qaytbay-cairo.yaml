summary:
  ar: "أول سبيل وكتّاب قائم بذاته في القاهرة، بناه السلطان قايتباي سنة 1479م في شارع الصليبة بين جامع ابن طولون والقلعة، بواجهات أبلقاء مطعّمة بالرخام والخزف {cite:yeomans-islamic-cairo-2006 p.224}."
  en: "Cairo's first free-standing sabil-kuttab, built by Sultan Qaytbay in 1479 on Saliba street between the Mosque of Ibn Tulun and the Citadel, its façades of ablaq masonry inlaid with marble and ceramic {cite:yeomans-islamic-cairo-2006 p.224}."
  fr: "Premier sabil-kuttab autonome du Caire, bâti par Qaytbay en 1479 entre Ibn Tulun et la Citadelle, façades d’ablaq incrustées de marbre et céramique. {cite:yeomans-islamic-cairo-2006 p.224}"
  es: "El primer sabil-kuttab independiente de El Cairo, construido por el sultán Qaytbay en 1479 en la calle Saliba, entre la Mezquita de Ibn Tulun y la Ciudadela, tiene fachadas de mampostería ablaq incrustadas con mármol y cerámica {cite:yeomans-islamic-cairo-2006 p.224}."
  ur: "قاہرہ کا پہلا آزادانہ سبیل کتب، جسے سلطان قیتبے نے 1479 میں مسجد ابن طولون اور قلعہ کے درمیان سلیبہ سٹریٹ پر تعمیر کیا تھا، اس میں ابلاق کی چنائی کے اگلے حصے ماربل اور سیرامک سے جڑے ہوئے ہیں۔"
