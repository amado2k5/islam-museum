summary:
  ar: "المدرسة الصلاحية قرب الحرم الشريف بالقدس، أسسها صلاح الدين سنة ٥٨٨هـ ⁦(١١٩٢م)⁩ بعد استرداد المدينة، في كنيسة القديسة حنة وديرها الصليبيَّين، فصارت مدرسة للشافعية ومن أقدم مدارس القدس الأيوبية {cite:archnet}."
  en: "Al-Madrasa al-Salahiyya near the Haram al-Sharif in Jerusalem, founded by Salah al-Din in 588 AH ⁦(1192)⁩ after the city\u2019s recovery, inside the Crusader Church and convent of Saint Anne; it became a Shafi\u2018i college and one of Jerusalem\u2019s earliest Ayyubid madrasas {cite:archnet}."
  ur: "یروشلم میں حرم شریف کے قریب المدرسہ الصلاحیہ، جسے صلاح الدین نے 588ھ ⁦(1192ء)⁩ میں شہر کی واپسی کے بعد صلیبی چرچ و خانقاہِ سینٹ این میں قائم کیا؛ یہ شافعی مدرسہ اور یروشلم کے ابتدائی ایوبی مدارس میں سے بنا {cite:archnet}۔"
  fr: "La madrasa al-Salahiyya près du Haram al-Sharif à Jérusalem, fondée par Saladin en 588 H. ⁦(1192)⁩ après la reprise de la ville, dans l\u2019église et le couvent croisés de Sainte-Anne ; elle devint un collège shafiite et l\u2019une des premières madrasas ayyoubides de Jérusalem {cite:archnet}."
  es: "La madraza al-Salahiyya cerca del Haram al-Sharif en Jerusalén, fundada por Saladino en 588 H. ⁦(1192)⁩ tras la recuperación de la ciudad, dentro de la iglesia y el convento cruzados de Santa Ana; se convirtió en colegio shafií y en una de las primeras madrazas ayubíes de Jerusalén {cite:archnet}."
  tr: "Kudüs\u2019te Harem-i Şerif yakınındaki Salahiyye Medresesi; Selahaddin, şehri geri aldıktan sonra 588 ⁦(1192)⁩ yılında Haçlı Azize Anna kilisesi ve manastırının içinde kurdu; Şafii medresesi ve Kudüs\u2019ün ilk Eyyubi medreselerinden oldu {cite:archnet}."
  id: "Madrasah al-Salahiyya dekat Haram al-Sharif di Yerusalem, didirikan oleh Salahuddin pada 588 H ⁦(1192)⁩ setelah kota direbut kembali, di dalam gereja dan biara Tentara Salib Santa Anna; menjadi perguruan Syafii dan salah satu madrasah Ayyubiyah tertua di Yerusalem {cite:archnet}."
