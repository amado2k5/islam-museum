summary:
  ar: "بستان مغولي عند نبع في حوض مثمن جنوب شرقي سرينغار، وُضع مخططه سنة 1609م، تخرج منه قناة مستقيمة نحو ثلاثمئة متر {cite:brookes-gardens-of-paradise-1987 p.138} {cite:brookes-gardens-of-paradise-1987 p.139}."
  en: "A Mughal garden at a spring rising in an octagonal pool south-east of Srinagar, laid out in 1609, from which a straight canal runs some 300 metres {cite:brookes-gardens-of-paradise-1987 p.138} {cite:brookes-gardens-of-paradise-1987 p.139}."
  fr: "Jardin moghol de 1609 à source octogonale au sud-est de Srinagar, canal droit d’environ 300 m. {cite:brookes-gardens-of-paradise-1987 p.138} {cite:brookes-gardens-of-paradise-1987 p.139}"
  es: "Un jardín mogol en un manantial que brota en una piscina octogonal al sureste de Srinagar, diseñado en 1609, desde el cual un canal recto recorre unos 300 metros {cite:brookes-gardens-of-paradise-1987 p.138} {cite:brookes-gardens-of-paradise-1987 p.139}."
  ur: "سری نگر کے جنوب مشرق میں ایک آکٹونل تالاب میں ابھرتے ہوئے چشمے پر ایک مغل باغ، جو 1609 میں بچھایا گیا تھا، جہاں سے ایک سیدھی نہر تقریباً 300 میٹر گزرتی ہے"
  tr: "Srinagar'ın güneydoğusundaki sekizgen bir havzada bir pınarda bulunan bir Babür bahçesi, 1609 yılında tasarlanmış, yaklaşık üç yüz metre uzanan düz bir kanal {cite:brookes-gardens-of-paradise-1987 s.138} {cite:brookes-gardens-of-paradise-1987 s.139}."
  id: "Kebun Mughal di mata air di cekungan segi delapan tenggara Srinagar, dirancang pada tahun 1609 M, dari mana sebuah kanal lurus membentang sekitar tiga ratus meter {cite:brookes-gardens-of-paradise-1987 hlm.138} {cite:brookes-gardens-of-paradise-1987 hlm.139}."
