  es: "Ficha preliminar de la Mezquita Karadzozbey de Mostar, la mezquita otomana del siglo XVI construida por Mehmed Bey ibn Karagoz y la más conocida de las mezquitas de Bosnia; según el estudio arquitectónico citado, la página aún no ha sido revisada."
