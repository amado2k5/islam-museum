summary:
  en: "The council house founded by Qusayy on the north side of the mosque of the Kaaba, with its door into the mosque; Quraysh deliberated its grave matters and married off its daughters there."
  fr: "La maison du conseil fondée par Qusayy au nord de la mosquée de la Kaaba, avec une porte ouvrant sur celle-ci ; Quraysh y délibérait de ses affaires graves et y mariait ses filles."
  ar: "الدار التي أسسها قصي بالجانب الشمالي من المسجد الحرام وجعل بابها إليه؛ كانت مجمع قريش تُقضى فيه جسام أمورهم وتُزوَّج فيها بناتهم."
  es: "La casa del consejo fundada por Qusayy en el lado norte de la mezquita de la Kaaba, con su puerta de entrada a la mezquita; allí los Quraysh deliberaban sobre sus asuntos importantes y casaban a sus hijas."
  ur: "مسجد کعبہ کے شمال کی طرف قصیٰ کی طرف سے قائم کردہ کونسل ہاؤس، جس کا دروازہ مسجد میں ہے۔ قریش نے اس کے سنگین معاملات پر غور کیا اور وہاں اپنی بیٹیوں کی شادیاں کر دیں۔"
  tr: "Qusay'ın Kutsal Camii'nin kuzey tarafında kurduğu ve kapısı ona doğru olan ev, Kureyşlerin toplanma yeriydi; burada işlerini yönetiyor ve kızlarıyla evleniyorlardı."
  id: "Rumah yang didirikan Qusay di sisi utara Masjid Suci, dengan gerbang yang mengarah ke sana, adalah tempat berkumpulnya Quraysh di mana mereka mengatur urusan dan menikahi putri-putri mereka."
