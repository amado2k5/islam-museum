summary:
  ar: "البوابة الإمبراطورية، المدخل الرئيسي في السور الخارجي لقصر السلطان الجديد ⁦(طوب قاپو سرايي)⁩ في إسطنبول، بناها ضمن سور السراي محمد الثاني سنة 883هـ/1478م {cite:encyclopaedia-of-islam-2 vol. 1 p. 893}."
  en: "The Imperial Gate, the principal entrance in the outer wall of the Sultan's New Serail (Topkapi Sarayi) at Istanbul; the Serail wall was erected under Sultan Mehmed II in Ramadan 883/November-December 1478 {cite:encyclopaedia-of-islam-2 vol. 1 p. 893}."
  fr: "La Porte impériale, entrée principale de l’enceinte extérieure du Nouveau Sérail du sultan (Topkapi Sarayi) à Istanbul ; l’enceinte fut édifiée sous le sultan Mehmed II en Ramadan 883/novembre-décembre 1478 {cite:encyclopaedia-of-islam-2 vol. 1 p. 893}."
  es: "La Puerta Imperial, la entrada principal en la muralla exterior del Nuevo Serail del Sultán (Topkapi Sarayi) en Estambul; la muralla del Serail fue erigida bajo el sultán Mehmed II en Ramadán 883/noviembre-diciembre de 1478 {cite:encyclopaedia-of-islam-2 vol. 1 p. 893}."
  ur: "امپیریل گیٹ، استنبول میں سلطان کی نئی سیریل ⁦(ٹوپکاپی سرائی)⁩ کی بیرونی دیوار میں داخلی دروازہ؛ سیریل کی دیوار سلطان محمد ثانی کے دور میں رمضان 883/نومبر-دسمبر 1478 میں تعمیر کی گئی تھی۔ 1 ص۔ 893}۔"
  tr: "İstanbul'daki yeni Sultan Sarayı'nın (Topkapu Saray) dış duvarındaki ana giriş olan İmparatorluk Kapısı, 883 Hicri/1478 yılında II. Mehmed Serail duvarı içinde inşa edilmiştir {atıf:İslam Ansiklopedisi-2 cilt 1, s. 893}."
  id: "Gerbang Kekaisaran, pintu masuk utama di dinding luar istana Sultan baru (Topkapu Saray) di Istanbul, dibangun di dalam tembok Mehmed II Serail pada tahun 883 H/1478 M {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 893}."
