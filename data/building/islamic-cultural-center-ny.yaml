summary:
  ar: "جامع مانهاتن عند تقاطع الجادة الثالثة والشارع السادس والتسعين، صممه مكتب سكيدمور وأوينگز وميريل وأُتم سنة 1991 بعد نقاش طويل بين لجنة من وجهاء المسلمين ولجنة من المعماريين حول صورة المسجد {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 22-23}."
  en: "The Manhattan mosque at Third Avenue and 96th Street, designed by Skidmore, Owings & Merrill and completed in 1991 after a long debate between a committee of prominent Muslims and one of architects over what the mosque should look like {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 22-23}."
  ur: "مین ہیٹن میں تھرڈ ایونیو اور چھیانوے ویں سڑک پر مسجد، جسے اسکڈمور، اوونگز اینڈ میرل نے ڈیزائن کیا اور جو مسلمان معززین اور معماروں کی دو کمیٹیوں کی طویل بحث کے بعد 1991ء میں مکمل ہوئی {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 4-5} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 22-23}۔"
