summary:
  ar: "جامع جينيه الكبير بمالي، أعظم نماذج العمارة الطينية السودانية-الصحراوية؛ قام البناء القائم اليوم في مطلع القرن العشرين على موضع مسجد قديم {cite:prussin-hatumere-1986}."
  en: "The Great Mosque of Djenne in Mali, the largest example of Sudano-Sahelian mud-brick architecture; the present building stands from the early twentieth century on the site of an older mosque {cite:prussin-hatumere-1986}."
  fr: "La Grande Mosquée de Djenné au Mali, plus grand exemple d’architecture soudano-sahélienne en briques de terre crue ; l’édifice actuel date du début du XXe siècle, sur le site d’une mosquée plus ancienne {cite:prussin-hatumere-1986}."
  es: "La Gran Mezquita de Djenné en Malí, el mayor ejemplo de arquitectura sudano-saheliana de adobe; el edificio actual se alza desde principios del siglo XX en el emplazamiento de una mezquita más antigua {cite:prussin-hatumere-1986}."
  ur: "مالی میں جینی کی عظیم مسجد، سوڈانو-ساحلیان مٹی کی اینٹوں کے فن تعمیر کی سب سے بڑی مثال؛ موجودہ عمارت بیسویں صدی کے اوائل سے ایک پرانی مسجد کے مقام پر کھڑی ہے۔"
  tr: "Mali'deki Djeni Büyük Camii, Sudan-Sahra çamur mimarisinin en büyük örneği; yirminci yüzyılın başındaki mevcut yapı, eski bir caminin yerine inşa edilmiştir {cite:prussin-hatumere-1986}."
  id: "Masjid Besar Djeni di Mali, contoh terbesar arsitektur lumpur Sudan-Sahara; bangunan saat ini pada awal abad kedua puluh dibangun di lokasi masjid tua {cite:prussin-hatumere-1986}."
