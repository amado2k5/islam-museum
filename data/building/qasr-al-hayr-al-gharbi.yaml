summary:
  ar: "قصر أموي صحراوي بناه الخليفة هشام بن عبد الملك في سوريا؛ وتسجل قاعدة البرديات العربية شظية رخامية منقوشة بخمسة أسطر من رسالة للخليفة هشام، تعود إلى ٧٢٤–٧٤٣م {cite:apd P.SchlumbergerQasr}."
  en: "An Umayyad desert palace built by Caliph Hisham ibn Abd al-Malik in Syria; the Arabic Papyrology Database records a marble fragment bearing five lines of a letter of Caliph Hisham, dated 724–743 CE {cite:apd P.SchlumbergerQasr}."
  fr: "Palais omeyyade du désert bâti par le calife Hisham ibn Abd al-Malik en Syrie ; l’Arabic Papyrology Database enregistre un fragment de marbre portant cinq lignes d’une lettre du calife Hisham, datée de 724–743 ap. J.-C. {cite:apd P.SchlumbergerQasr}"
  es: "Un palacio omeya del desierto construido por el califa Hisham ibn Abd al-Malik en Siria; la base de datos de papirología árabe registra un fragmento de mármol con cinco líneas de una carta del califa Hisham, fechada entre 724 y 743 d. C. {cite:apd P.SchlumbergerQasr}."
  ur: "شام میں خلیفہ ہشام بن عبد الملک کا تعمیر کردہ اموی صحرائی محل؛ عربی پیپرولوجی ڈیٹا بیس میں ماربل کا ایک ٹکڑا ریکارڈ کیا گیا ہے جس میں خلیفہ ہشام کے خط کی پانچ سطریں ہیں، جس کی تاریخ 724-743 عیسوی {حوالہ: apd P.SchlumbergerQasr} ہے۔"
