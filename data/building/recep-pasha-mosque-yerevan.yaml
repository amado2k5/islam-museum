label: { ar: "جامع رجب باشا في قلعة يريفان", en: "Recep Pasha Mosque, Yerevan citadel", fr: "Mosquée Recep Pacha, citadelle d’Erevan", ur: "رجب پاشا مسجد، قلعۂ یریوان", es: "Mezquita de Recep Pasha, ciudadela de Ereván", tr: "Erivan Kalesi'ndeki Recep Paşa Camii", id: "Masjid Recep Pasha di Kastil Yerevan" }
summary:
  ar: "مسجد بناه رجب باشا حافظ تفليس في قلعة يريفان سنة 1725 بعد استعادة العثمانيين للمدينة، حوّله الروس إلى كنيسة بعد احتلالها سنة 1827، وهُدم كلياً سنة 1930 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 238}."
  en: "A mosque built in 1725 in the citadel of Yerevan by Recep Pasha, commander of Tbilisi, after the Ottoman reconquest; turned into a Russian Orthodox church after the Russian occupation of 1827 and entirely demolished in 1930 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 238}."
  fr: "Mosquée de 1725 bâtie par le commandant de Tbilissi Recep Pacha après la reconquête ottomane, devenue église orthodoxe russe après 1827, entièrement démolie en 1930. {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 238}"
  ur: "یریوان کے قلعے میں 1725ء میں تفلیس کے محافظ رجب پاشا کی بنوائی مسجد، 1827ء کے روسی قبضے کے بعد روسی آرتھوڈوکس گرجا بنی اور 1930ء میں مکمل منہدم کر دی گئی {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 238}۔"
  es: "Mezquita construida en 1725 en la ciudadela de Ereván por Recep Pasha, comandante de Tiflis, tras la reconquista otomana; convertida en iglesia ortodoxa rusa tras la ocupación rusa de 1827 y demolida por completo en 1930 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023 p. 238}."
  tr: "Osmanlıların şehri geri almasının ardından 1725'te Tiflisli Hafizi Recep Paşa tarafından Erivan Kalesi'nde inşa edilen bir cami. Ruslar, 1827'deki işgalinden sonra burayı kiliseye dönüştürdü ve 1930'da tamamen yıkıldı {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023, s. 238}."
  id: "Sebuah masjid yang dibangun oleh Rajab Pasha, Hafez Tbilisi, di Kastil Yerevan pada tahun 1725 setelah Ottoman merebut kembali kota tersebut. Orang Rusia mengubahnya menjadi gereja setelah pendudukannya pada tahun 1827, dan sepenuhnya dihancurkan pada tahun 1930 {cite:yilmaz-kiliseye-cevrilen-turk-eserleri-1-2023, hlm. 238}."
