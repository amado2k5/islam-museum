summary:
  ar: "بطاقة أولية لضريح سليمان شاه جد عثمان الأول على الفرات، المقام الذي رُعي بفرمان عثماني ثم نقل لتهديده؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Tomb of Suleyman Shah, grandfather of Osman I, on the Euphrates — guarded by Ottoman decree and later moved when threatened; its sources are not yet checked on the page."
  fr: "Notice provisoire : tombeau de Suleyman Shah, grand-père d’Osman Ier, sur l’Euphrate, gardé par décret ottoman puis déplacé face aux menaces ; ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la tumba de Suleyman Shah, abuelo de Osman I, en el Éufrates, custodiada por decreto otomano y posteriormente trasladada cuando se vio amenazada; sus fuentes aún no han sido verificadas en la página."
  ur: "فرات پر عثمان اول کے دادا، سلیمان شاہ کے مقبرے کے لیے ڈرافٹ کارڈ - عثمانی فرمان کے ذریعے حفاظت کیا گیا اور بعد میں دھمکی ملنے پر منتقل کر دیا گیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Osmanlı fermanıyla desteklenen ve ardından onu tehdit etmek için taşınan türbe, Osman I'in dedesi Süleyman Şah'ın türbesinin ön kartı; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu awal makam Suleiman Shah, kakek Osman I di Sungai Efrat, tempat suci yang disponsori oleh dekret Ottoman dan kemudian diusulkan untuk mengancamnya; sumber-sumbernya di halaman tersebut belum ditinjau."
