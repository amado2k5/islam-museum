summary:
  ar: "بطاقة أولية لمدرسة العطارين بفاس، المدرسة المرينية التي بناها السلطان أبو سعيد عثمان الثاني سنة ١٣٢٣م قرب القرويين؛ من روائع العمارة المرينية ولم تُراجع الصفحة بعد."
  en: "Draft card for the al-Attarine Madrasa of Fez, the Marinid college built by Sultan Abu Said Uthman II in 1323 near the Qarawiyyin; a masterwork of Marinid architecture per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Madrasa al-Attarine de Fès, collège mérinide bâti en 1323 par le sultan Abu Said Uthman II près de la Qarawiyyin, chef-d’œuvre mérinide selon l’encyclopédie citée. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto para la madrasa al-Attarine de Fez, el colegio mariní construido por el sultán Abu Said Uthman II en 1323 cerca de Qarawiyyin; una obra maestra de la arquitectura mariní según la enciclopedia citada, página aún no verificada."
  ur: "قراویین کے قریب 1323 میں سلطان ابو سعید عثمان دوم کی طرف سے تعمیر کردہ مرینیڈ کالج، فیز کے العطرین مدرسہ کے لیے ڈرافٹ کارڈ؛ حوالہ کردہ انسائیکلوپیڈیا کے مطابق میرینیڈ فن تعمیر کا ایک ماسٹر ورک، صفحہ ابھی تک چیک نہیں کیا گیا ہے۔"
