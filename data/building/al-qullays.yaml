label: { en: "al-Qullays (the Yemeni Kaaba)", ar: "القليس (الكعبة اليمانية)" }
summary:
  en: "The church Abraha built in Yemen to divert the Arabs’ pilgrimage from Mecca — the ambition that led to the elephant campaign. Al-Hamdani's native tradition names it, with Ghumdan, the twin monument of Sana'a and ascribes its building to Bilqis {cite:sifat-jazirat-al-arab p. 221}."
  ar: "الكنيسة التي بناها أبرهة باليمن ليصرف إليها حج العرب عن بيت الله بمكة؛ وهي الغاية التي قادته إلى حملة الفيل. وفي أخبار أهل اليمن عند الهمداني أن القليس وغمدان بنتهما بلقيس، وهما محفدا صنعاء العظيمان {cite:sifat-jazirat-al-arab p. 221}."
