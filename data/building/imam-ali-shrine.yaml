summary:
  ar: "العتبة العلوية بالنجف، الروضة الحيدرية على قبر علي بن أبي طالب؛ تذكر «موسوعة العتبات» أن صحنها يبلغ ضلعاه الشرقي والغربي ٨٤ م والشمالي ٧٤ م والجنوبي ٧٥ م، في كل من ضلعيه الشمالي والشرقي ١٥ إيواناً وفي كل من الغربي والجنوبي ١٤ إيواناً شُيّدت حجراتها مأوى لطلاب العلم، وللصحن خمسة أبواب أهمها الباب الكبير شرقاً قبالة السوق الكبير، وباب الطوسي شمالاً نسبة إلى الشيخ الطوسي ⁦(ت ٤٦٠هـ)⁩، وباب القبلة جنوباً، والباب السلطاني غرباً فُتح سنة ١٢٧٩هـ أيام السلطان عبد العزيز؛ وتعلو القبر قبة يرتفع بناؤها ٣٥ م بمحيط قاعدة نحو ٥٠ م وقطر نحو ١٦ م، وقد أمر شاه إيران محمد رضا بهلوي بتزجيج الروضة بالمرايا على نفقته بنحو ١٢ ألف دينار، ومن أبوابها باب الإيوان الذهبي المنصوب نحو سنة ١٢١٩هـ على نفقة الحاج محمد حسين خان الأصفهاني الصدر الأعظم وبابان ذهبيان سنة ١٣٧٦هـ بذلهما الحاج محمد تقي الطهراني {cite:musawat-atabat}."
  en: "The Imam Ali shrine at Najaf, the Haydariyya sanctuary over the grave of Ali ibn Abi Talib; the Mawsu'at al-Atabat records its court at 84 m on the east and west sides, 74 m north and 75 m south, with 15 iwans on the north and east sides and 14 on the west and south — their cells built as lodging for students — and five gates: the great east gate facing the Souk al-Kabir, the Bab al-Tusi to the north named for Shaykh al-Tusi (d. 460 AH), the Bab al-Qibla south, and the Bab al-Sultani opened in 1279 AH under Sultan Abdülaziz; the dome rises 35 m with a base circumference of some 50 m and diameter near 16 m, and Shah Muhammad Reza Pahlavi commissioned the sanctuary's mirror-work at his own expense for about 12,000 dinars; among its gates are the golden iwan door set up around 1219 AH at the cost of Haj Muhammad Husayn Khan al-Isfahani and two gold doors of 1376 AH funded by Haj Muhammad Taqi al-Tihrani {cite:musawat-atabat}."
  fr: "Le sanctuaire de l’imam Ali à Nadjaf, sanctuaire Haydariyya sur la tombe d’Ali ibn Abi Talib ; la Mawsu’at al-Atabat décrit une cour de 84 m à l’est et à l’ouest, 74 m au nord et 75 m au sud, avec 15 iwans au nord et à l’est et 14 à l’ouest et au sud, dont les cellules logeaient les étudiants, et cinq portes : grande porte orientale face au Souk al-Kabir, Bab al-Tusi au nord nommée d’après Shaykh al-Tusi (mort en 460 H), Bab al-Qibla au sud et Bab al-Sultani ouverte en 1279 H sous le sultan Abdülaziz ; la coupole s’élève à 35 m, avec une base d’environ 50 m de circonférence et près de 16 m de diamètre. Le shah Muhammad Reza Pahlavi commanda à ses frais le décor de miroirs pour environ 12 000 dinars ; les portes comprennent celle de l’iwan doré, installée vers 1219 H aux frais de Haj Muhammad Husayn Khan al-Isfahani, et deux portes d’or de 1376 H financées par Haj Muhammad Taqi al-Tihrani {cite:musawat-atabat}."
  es: "El santuario del Imam Ali en Najaf, el santuario Haydariyya sobre la tumba de Ali ibn Abi Talib; el Mawsu'at al-Atabat registra su patio en 84 m en los lados este y oeste, 74 m al norte y 75 m al sur, con 15 iwanes en los lados norte y este y 14 en el oeste y sur —sus celdas construidas como alojamiento para estudiantes— y cinco puertas: la gran puerta este frente al Souk al-Kabir, la Bab al-Tusi al norte llamada así por Shaykh al-Tusi (m. 460 AH), la Bab al-Qibla al sur y la Bab al-Sultani abierta en 1279 AH bajo el sultán Abdülaziz; La cúpula se eleva 35 m con una circunferencia de base de unos 50 m y un diámetro cercano a los 16 m, y Shah Muhammad Reza Pahlavi encargó la obra de espejos del santuario a su propio costo por unos 12.000 dinares; entre sus puertas se encuentran la puerta del iwan dorado, instalada alrededor del año 1219 AH a costa de Haj Muhammad Husayn Khan al-Isfahani, y dos puertas doradas del año 1376 AH financiadas por Haj Muhammad Taqi al-Tihrani {cite:musawat-atabat}."
  ur: "نجف میں امام علی کا مزار، علی ابن ابی طالب کی قبر کے اوپر حیدریہ حرم؛ موصوف الاطباط نے اپنے دربار کو 84 میٹر مشرق اور مغرب کی طرف، 74 میٹر شمال اور 75 میٹر جنوب میں، شمال اور مشرقی اطراف میں 15 آئیوان اور 14 مغرب اور جنوب میں - ان کے سیلز جو طلباء کے قیام کے لیے بنائے گئے ہیں - اور پانچ دروازے: عظیم مشرقی دروازہ جس کا سامنا ہے، شمال الشعبیۃ المعروف الشعبی الصبغۃ کے لیے۔ الطوسی ⁦(متوفی 460 ہجری)⁩، باب القبلہ جنوبی، اور باب السلطانی 1279 ہجری میں سلطان عبدالعزیز کے دور میں کھولا گیا۔ گنبد 35 میٹر بلند ہے جس کا بنیادی فریم تقریباً 50 میٹر ہے اور قطر 16 میٹر کے قریب ہے، اور شاہ محمد رضا پہلوی نے تقریباً 12,000 دینار میں اپنے خرچ پر حرم کے عکس کا کام شروع کیا تھا۔ اس کے دروازوں میں 1219 ہجری کے لگ بھگ حاجی محمد حسین خان اصفہانی کی لاگت سے نصب سنہری ایوان کا دروازہ اور 1376 ہجری کے دو سونے کے دروازے جو حاجی محمد تقی الطہرانی نے مالی اعانت فراہم کی تھی۔"
  tr: "Necef'teki Alevi Türbesi, Ali ibn Ebi Talib'in mezarındaki Haydari Rawdah; \"Türbeler Ansiklopedisi\"nde avlunun doğu ve batı tarafında 84 m, kuzeyde 74 m ve güney tarafında 75 m ölçüldüğünü belirtir. Kuzey ve doğu taraflarında 15 iwan, batı ve güney taraflarında ise 14 ivan bulunur. Odaları bilgi öğrencileri için sığınak olarak inşa edilmiştir. Avluda beş kapı vardır; bunların en önemlileri doğuda Büyük Pazar'ın karşısındaki Büyük Kapı, kuzeyde Şeyh al-Tusi'nin (ö. 460 H yılı) adını taşıyan Tusi Kapısı, güneyde Kıble Kapısı ve batıda Sultan'ın Bab'ı (Fath) kapısıdır. 1279 Hicri yılında, Sultan Abdülaziz döneminde; türbenin üzerinde 35 metre yüksekliğinde, yaklaşık 50 metre tabanı ve çapı yaklaşık 16 metre olan bir kubbe bulunmaktadır. İran Şahı Muhammed Rıza Pehlevi, türbenin kendi masraflarıyla yaklaşık 12.000 dinar karşılığında aynalarla camlanmasını emretti. Kapılar arasında, 1219 Hicri civarında Sadrazam Hac Muhammed Hüseyin Han El-İsfahani tarafından yapılan Altın İvan Kapısı ve 1376 Hicri'de Hac Muhammed Taqi Al-Tehrani tarafından bağışlanan iki altın kapı bulunmaktadır."
  id: "Kuil Alawi di Najaf, Haydari Rawdah di makam Ali ibn Abi Talib; \"Ensiklopedia Kuil\" menyebutkan bahwa halaman dalamnya berukuran 84 m di sisi timur dan barat, 74 m di utara, dan 75 m di sisi selatan. Masing-masing sisi utara dan timurnya memiliki 15 iwan, dan masing-masing sisi barat dan selatan 14 iwan. Ruangan-ruangannya dibangun sebagai tempat berlindung bagi para pelajar ilmu. Halaman ini memiliki lima pintu, yang terpenting adalah Gerbang Besar di sebelah timur yang berhadapan dengan Pasar Besar, Gerbang Tusi di utara yang dinamai menurut Sheikh al-Tusi (wafat 460 H), Gerbang Qibla di selatan, dan Bab Sultan di barat (Fath). Pada tahun 1279 H pada masa pemerintahan Sultan Abdulaziz; di atas makam terdapat kubah setinggi 35 meter dengan dasar sekitar 50 meter dan diameter sekitar 16 meter. Shah Iran, Mohammad Reza Pahlavi, memerintahkan agar makam ini dilapisi kaca dengan cermin atas biaya pribadinya sekitar 12.000 dinar. Di antara pintunya terdapat Pintu Iwan Emas, yang dipasang sekitar tahun 1219 H atas biaya Haj Mohammad Hossein Khan Al-Isfahani, Wazir Agung, dan dua pintu emas pada tahun 1376 H yang disumbangkan oleh Haj Muhammad Taqi Al-Tehrani {cite:musawat-atabat}."
