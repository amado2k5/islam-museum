  en: "Imam Ali shrine (Najaf)"
summary:
  ar: "العتبة العلوية بالنجف، الروضة الحيدرية على قبر علي بن أبي طالب؛ تذكر «موسوعة العتبات» أن صحنها يبلغ ضلعاه الشرقي والغربي ٨٤ م والشمالي ٧٤ م والجنوبي ٧٥ م، في كل من ضلعيه الشمالي والشرقي ١٥ إيواناً وفي كل من الغربي والجنوبي ١٤ إيواناً شُيّدت حجراتها مأوى لطلاب العلم، وللصحن خمسة أبواب أهمها الباب الكبير شرقاً قبالة السوق الكبير، وباب الطوسي شمالاً نسبة إلى الشيخ الطوسي (ت ٤٦٠هـ)، وباب القبلة جنوباً، والباب السلطاني غرباً فُتح سنة ١٢٧٩هـ أيام السلطان عبد العزيز؛ وتعلو القبر قبة يرتفع بناؤها ٣٥ م بمحيط قاعدة نحو ٥٠ م وقطر نحو ١٦ م، وقد أمر شاه إيران محمد رضا بهلوي بتزجيج الروضة بالمرايا على نفقته بنحو ١٢ ألف دينار، ومن أبوابها باب الإيوان الذهبي المنصوب نحو سنة ١٢١٩هـ على نفقة الحاج محمد حسين خان الأصفهاني الصدر الأعظم وبابان ذهبيان سنة ١٣٧٦هـ بذلهما الحاج محمد تقي الطهراني {cite:musawat-atabat}."
  en: "The Imam Ali shrine at Najaf, the Haydariyya sanctuary over the grave of Ali ibn Abi Talib; the Mawsu'at al-Atabat records its court at 84 m on the east and west sides, 74 m north and 75 m south, with 15 iwans on the north and east sides and 14 on the west and south — their cells built as lodging for students — and five gates: the great east gate facing the Souk al-Kabir, the Bab al-Tusi to the north named for Shaykh al-Tusi (d. 460 AH), the Bab al-Qibla south, and the Bab al-Sultani opened in 1279 AH under Sultan Abdülaziz; the dome rises 35 m with a base circumference of some 50 m and diameter near 16 m, and Shah Muhammad Reza Pahlavi commissioned the sanctuary's mirror-work at his own expense for about 12,000 dinars; among its gates are the golden iwan door set up around 1219 AH at the cost of Haj Muhammad Husayn Khan al-Isfahani and two gold doors of 1376 AH funded by Haj Muhammad Taqi al-Tihrani {cite:musawat-atabat}."
