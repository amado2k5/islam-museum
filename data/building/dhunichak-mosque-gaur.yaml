summary:
  ar: "مسجد مستطيل برواق واحد وثلاث قباب في حي مهدي پور بغور، سمي باسم حي ندّافي القطن، يضعه المؤلف في عهد الإلياسشاهيين المستعادين {c(126)}."
  en: "A single-aisled, three-domed oblong mosque in the Mahdipur area of Gaur, named after the quarter of cotton carders and placed by the author in the restored Ilyas Shahi period {c(126)}."
  fr: "Mosquée oblongue à nef unique et trois coupoles dans le secteur de Mahdipur à Gaur, nommée d’après le quartier des cardeurs de coton et située par l’auteur dans la période Ilyas Shahi restaurée {c(126)}."
  ur: "گوڑ کے مہدی پور علاقے میں ایک صف اور تین گنبدوں والی مستطیل مسجد، دھنیوں کے محلے کے نام سے؛ مصنف اسے بحال شدہ الیاس شاہی دور میں رکھتے ہیں {c(126)}۔"
  es: "Una mezquita oblonga de una sola nave y tres cúpulas en el área de Mahdipur de Gaur, que recibe su nombre del barrio de los cardadores de algodón y que el autor sitúa en el período restaurado de Ilyas Shahi {c(126)}."
  tr: "Baghur'un Mahdipur mahallesinde yer alan, bir kemer ve üç kubbeli dikdörtgen bir cami olan Nadafi Al-Qutn mahallesi; yazarın geri kazanılmış Elyashahian döneminde kurduğu {c(126)}."
  id: "Sebuah masjid persegi panjang dengan satu lengkungan dan tiga kubah di lingkungan Mahdipur, Baghur, yang dinamai lingkungan Nadafi Al-Qutn, yang didirikan oleh penulis pada era Elyashahian yang direklamasi {c(126)}."
