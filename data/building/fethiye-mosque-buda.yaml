summary:
  ar: "كنيسة من القرن الثالث عشر في قلعة بودا، أقدم مبانيها، حُوّلت بعد الفتح جامعاً وجُعل برجها مئذنة، وسُميت «ذات الساعة» لساعة برجها؛ دُمرت في الحرب العالمية الثانية وبقي برجها {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  en: "A thirteenth-century church, the oldest building in Buda Castle, made a mosque after the conquest with its bell tower as minaret and called the Clock Mosque after the tower clock; destroyed in the Second World War except for its tower {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  ur: "قلعۂ بودا کی سب سے پرانی عمارت، تیرھویں صدی کا گرجا، فتح کے بعد مسجد بنا اور برج مینار بنا؛ برج کی گھڑی کی وجہ سے «گھڑی والی مسجد»؛ دوسری جنگِ عظیم میں برج کے سوا تباہ {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}۔"
