class: building
kind: mosque
label: { ar: "جامع الفتحية ⁦(الجامع ذو الساعة)⁩ في قلعة بودا", en: "Fethiye (Saatli) Mosque, Buda Castle", fr: "Mosquée Fethiye (Saatli), château de Buda", ur: "فتحیہ ⁦(گھڑی والی)⁩ مسجد، قلعۂ بودا", es: "Mezquita Fethiye (Saatli), Castillo de Buda", tr: "Buda Kalesi'ndeki El-Fathiya Camii (Saat Camii)", id: "Masjid Al-Fathiya (Masjid Jam) di Kastil Buda" }
summary:
  ar: "كنيسة من القرن الثالث عشر في قلعة بودا، أقدم مبانيها، حُوّلت بعد الفتح جامعاً وجُعل برجها مئذنة، وسُميت «ذات الساعة» لساعة برجها؛ دُمرت في الحرب العالمية الثانية وبقي برجها {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  en: "A thirteenth-century church, the oldest building in Buda Castle, made a mosque after the conquest with its bell tower as minaret and called the Clock Mosque after the tower clock; destroyed in the Second World War except for its tower {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  fr: "Église du XIIIe siècle, plus ancien bâtiment du château de Buda, transformée en mosquée après la conquête, son clocher devenant minaret ; appelée mosquée de l’Horloge d’après l’horloge de la tour ; détruite pendant la Seconde Guerre mondiale, sauf sa tour {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  ur: "قلعۂ بودا کی سب سے پرانی عمارت، تیرھویں صدی کا گرجا، فتح کے بعد مسجد بنا اور برج مینار بنا؛ برج کی گھڑی کی وجہ سے «گھڑی والی مسجد»؛ دوسری جنگِ عظیم میں برج کے سوا تباہ {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}۔"
  es: "Una iglesia del siglo XIII, el edificio más antiguo del Castillo de Buda, se convirtió en mezquita después de la conquista, con su campanario como minarete, y se llamó Mezquita del Reloj por el reloj de la torre; destruida en la Segunda Guerra Mundial, excepto su torre {cite:yilmaz-ottoman-architecture-hungary-2024 p. 59}."
  tr: "Buda Kalesi'ndeki en eski binası olan 13. yüzyıldan kalma bir kilise, fetihten sonra camiye dönüştürülmüş ve kulesi minareye haline getirilmiştir. Kule saatinden dolayı 'Saat' olarak adlandırılmıştır; II. Dünya Savaşı sırasında yıkılmış ancak kulesi hâlâ durmaktadır {cite:yilmaz-ottoman-architecture-hungary-2024, s. 59}."
  id: "Sebuah gereja abad ke-13 di Kastil Buda, bangunan tertuanya, diubah menjadi masjid setelah penaklukan dan menaranya diubah menjadi menara. Menamai 'Jam' sesuai dengan jam menaranya; menara ini hancur selama Perang Dunia II tetapi menaranya tetap ada {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 59}."
