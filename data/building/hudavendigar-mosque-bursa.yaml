summary:
  ar: "بطاقة أولية لجامع خداوندكار ببورصة، مجمع السلطان مراد الأول الذي أسس سنة ١٣٦٦م وضم جامعاً ومدرسة وضريحه؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Hüdavendigar Mosque of Bursa, the complex of Sultan Murad I founded in 1366 combining mosque, madrasa and his tomb; its sources are not yet checked on the page."
  fr: "Ébauche de notice pour la mosquée Hüdavendigar de Bursa, complexe du sultan Murad Ier fondé en 1366 associant mosquée, madrasa et son tombeau ; sources non encore vérifiées sur la page."
  es: "Boceto de ficha para la Mezquita Hüdavendigar de Bursa, el complejo fundado por el sultán Murad I en 1366 que combina mezquita, madrasa y su tumba; sus fuentes aún no han sido verificadas en la página."
  ur: "مسجد، مدرسہ اور اس کے مقبرے کو ملا کر 1366 میں سلطان مراد اول کے کمپلیکس کی بنیاد برسا کی ہدوینڈیگر مسجد کے لیے ڈرافٹ کارڈ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bursa'daki Khodawandkar Camii için ön kart, 1366 yılında kurulan ve bir cami, okul ile türbeyi içeren Sultan I. Murad kompleksi için; sayfadaki kaynakları henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk Masjid Khodawandkar di Bursa, kompleks Sultan Murad I yang didirikan pada tahun 1366 M dan mencakup masjid, sekolah, dan mausoleum; sumber-sumbernya di halaman tersebut belum ditinjau."
