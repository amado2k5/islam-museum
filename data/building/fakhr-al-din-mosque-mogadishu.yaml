summary:
  ar: "بطاقة أولية لجامع فخر الدين زنكي بمقديشو، الجامع الذي بناه فخر الدين بن محمد سنة ١٢٦٩م؛ من أقدم مساجد الصومال الباقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Fakhr al-Din Zinki Mosque of Mogadishu, built by Fakhr al-Din ibn Muhammad in 1269; among Somalia's oldest surviving mosques per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée Fakhr al-Din Zinki de Mogadiscio, bâtie par Fakhr al-Din ibn Muhammad en 1269, parmi les plus anciennes mosquées conservées de Somalie selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la mezquita Fakhr al-Din Zinki de Mogadiscio, construida por Fakhr al-Din ibn Muhammad en 1269; una de las mezquitas más antiguas que aún se conservan en Somalia, según la enciclopedia citada, página aún no verificada."
  ur: "موغادیشو کی فخرالدین زنکی مسجد کے لیے ڈرافٹ کارڈ، جسے فخر الدین ابن محمد نے 1269 میں تعمیر کیا تھا۔ حوالہ کردہ انسائیکلوپیڈیا کے مطابق صومالیہ کی قدیم ترین بچ جانے والی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "Mogadişu'daki Fakhr al-Din Zenki Camii için ön kart, Fakhr al-Din bin Muhammed tarafından 1269 yılında inşa edilen camidir; Somali'nin en eski ayakta kalan camilerinden biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Fakhr al-Din Zenki di Mogadishu, masjid yang dibangun oleh Fakhr al-Din bin Muhammad pada tahun 1269 M; salah satu masjid tertua yang masih ada di Somalia dan halamannya belum ditinjau."
