summary:
  ar: "البلد الجديد بفاس؛ لما سكن غرب الثوار واستوسق ملك السلطان أبي يوسف يعقوب بن عبد الحق المريني وعظمت غاشيته وكثر وافده رأى أن يختط بلداً يتميز لنزله وعساكره إلى جانب فاس العتيقة، فاختط البلد الجديد دار ملك بني مرين ومنزل سلطانهم وجنده، وأوعز بعد ذلك ببناء قصبة مدينة مكناسة."
  en: "The New Town of Fes; when the rebellion's west subsided and Sultan Abu Yusuf Ya'qub ibn Abd al-Haqq's kingship ran steady with a great retinue and many incomers, he chose to lay out a separate city for his residence and armies beside old Fes — Fes Jdid, the Marinids' royal seat — and afterwards ordered the qasba of Miknasa built."
