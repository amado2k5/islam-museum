summary:
  ar: "البلد الجديد بفاس؛ لما سكن غرب الثوار واستوسق ملك السلطان أبي يوسف يعقوب بن عبد الحق المريني وعظمت غاشيته وكثر وافده رأى أن يختط بلداً يتميز لنزله وعساكره إلى جانب فاس العتيقة، فاختط البلد الجديد دار ملك بني مرين ومنزل سلطانهم وجنده، وأوعز بعد ذلك ببناء قصبة مدينة مكناسة."
  en: "The New Town of Fes; when the rebellion's west subsided and Sultan Abu Yusuf Ya'qub ibn Abd al-Haqq's kingship ran steady with a great retinue and many incomers, he chose to lay out a separate city for his residence and armies beside old Fes — Fes Jdid, the Marinids' royal seat — and afterwards ordered the qasba of Miknasa built."
  fr: "La ville nouvelle de Fès ; une fois l’ouest apaisé après la rébellion et le pouvoir du sultan Abu Yusuf Yaqub ibn Abd al-Haqq stabilisé, avec une grande suite et de nombreux arrivants, il décida de tracer une ville séparée pour sa résidence et ses armées à côté de l’ancienne Fès : Fès Jdid, siège royal mérinide ; il ordonna ensuite la construction de la qasba de Meknès."
  es: "La Ciudad Nueva de Fez; cuando la rebelión en el oeste amainó y el reinado del sultán Abu Yusuf Ya'qub ibn Abd al-Haqq se consolidó con un gran séquito y muchos inmigrantes, optó por construir una ciudad aparte para su residencia y sus ejércitos junto a la antigua Fez —Fez Jdid, la sede real de los Mariníes— y posteriormente ordenó la construcción de la qasba de Miknasa."
