summary:
  ar: "أقدم حمام عامل في إسطنبول، بناه نحو 1475م گدك أحمد باشا فاتح أوترانتو؛ سوغولوق فسيح وحرارة صليبية التخطيط."
  en: "Istanbul's oldest functioning bath, built c.1475 by Gedik Ahmet Pasha, captor of Otranto; spacious domed soğukluk and cruciform hararet, restored and still used."
  fr: "Plus ancien bain en activité d’Istanbul, construit vers 1475 par Gedik Ahmet Pasha, conquérant d’Otrante ; vaste soğukluk sous coupole et hararet cruciforme, restauré et toujours utilisé."
  es: "Los baños públicos en funcionamiento más antiguos de Estambul, construidos alrededor de 1475 por Gedik Ahmet Pasha, conquistador de Otranto; un espacioso soğukluk con cúpula y un hararet cruciforme, restaurados y aún en uso."
  ur: "استنبول کا سب سے قدیم کام کرنے والا حمام، جو اوٹرانٹو کے اسیر گیدک احمد پاشا نے c.1475 میں بنایا تھا۔ کشادہ گنبد والا soğukluk اور cruciform harret، بحال اور اب بھی استعمال کیا جاتا ہے۔"
