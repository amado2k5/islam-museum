  id: "Pengepungan Kastil Romeli"
summary:
  ar: "أقام السلطان محمد الفاتح قلعة روملي حصار في الجانب الأوروبي على مضيق البوسفور في أضيق نقطة منه، مقابل القلعة التي أسسها السلطان بايزيد في البر الآسيوي؛ حاول الإمبراطور البيزنطي إثناءه عن البناء بعروض مالية فأصرّ، حتى اكتملت قلعة عالية محصنة وصل ارتفاعها 82 متراً على ما في الصلابي، وصارت القلعتان متقابلتين لا يفصل بينهما سوى 660 متراً تتحكمان في عبور السفن وتستطيع نيران مدافعهما منع أي سفينة من الوصول إلى القسطنطينية من جهة البحر الأسود {cite:dawlat-uthmaniyya-salabi p. 92}."
  en: "Rumeli Hisarı, Mehmed II's castle on the European side of the Bosphorus at its narrowest point, opposite Bayezid's fortress on the Asian shore: the emperor's money could not buy it off, and when finished the two castles stood 660 m apart, their cannon able to bar any ship's passage toward Constantinople {cite:dawlat-uthmaniyya-salabi p. 92}. The book's 82-m height figure is reported as printed."
  fr: "Forteresse de Mehmed II au passage le plus étroit du Bosphore, face à celle de Bayezid en Asie. L’argent impérial ne détourna pas le projet ; les deux forts distants de 660 m barraient le passage à Constantinople par leurs canons. Hauteur de 82 m rapportée telle qu’imprimée. {cite:dawlat-uthmaniyya-salabi p. 92}"
  es: "Rumeli Hisarı, el castillo de Mehmed II en el lado europeo del Bósforo en su punto más angosto, frente a la fortaleza de Bayezid en la orilla asiática: el dinero del emperador no pudo comprarlo, y cuando se terminaron, los dos castillos se encontraban a 660 m de distancia, y sus cañones podían impedir el paso de cualquier barco hacia Constantinopla {cite:dawlat-uthmaniyya-salabi p. 92}. La cifra de 82 m de altura que aparece en el libro se cita tal como está impresa."
  ur: "رومیلی حصاری، محمود دوم کا قلعہ باسفورس کے یورپی جانب اس کے تنگ ترین مقام پر، ایشیائی ساحل پر بایزید کے قلعے کے سامنے: شہنشاہ کا پیسہ اسے خرید نہیں سکتا تھا، اور جب ختم ہوا تو دونوں قلعے 660 میٹر کے فاصلے پر کھڑے تھے، ان کی توپ کسی بھی بحری جہاز کے کانسٹینٹینو کے راستے کو روکنے کے قابل تھی۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 92}۔ کتاب کی 82-m اونچائی کے اعداد و شمار کو مطبوعہ بتایا گیا ہے۔"
  tr: "Fatih Sultan Mehmed, Sultan Bayezid'in Asya anakarasında kurduğu kalenin karşısında, Boğaziçi Avrupa tarafındaki Roman kalesini kuşattı. Bizans imparatoru, kaleyi inşa etmekten vazgeçirmeye çalıştı ve ısrar etti; ta ki Salabi bölgesinin 82 metre yüksekliğine ulaşan yüksek tahkimatlı bir kale tamamlanana kadar. İki kale karşılıklı oldu, aralarında sadece 660 metre mesafe vardı, gemi geçişini kontrol ediyordu ve top ateşi Karadeniz tarafından herhangi bir geminin Konstantinopolis'e ulaşmasını engelleyebiliyordu {cite:dawlat-uthmaniyya-salabi s. 92}."
  id: "Sultan Mehmed Sang Penakluk mengepung benteng Romani di sisi Eropa Selat Bosphorus di titik tersempitnya, berseberangan dengan benteng yang didirikan oleh Sultan Bayezid di daratan Asia. Kaisar Bizantium mencoba membujuknya untuk membangunnya dengan tawaran keuangan dan bersikeras, hingga benteng tinggi yang diperkuat selesai dibangun, mencapai ketinggian 82 meter di atas area Labii. Kedua benteng tersebut menjadi berlawanan, hanya dipisahkan 660 meter, mengendalikan jalur kapal, dan tembakan meriamnya dapat mencegah kapal apa pun mencapai Konstantinopel dari sisi Laut Hitam {cite:dawlat-uthmaniyya-salabi hlm. 92}."
