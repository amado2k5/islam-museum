label:
  ar: "قلعة روملي حصار"
  en: "Rumeli Hisarı"
summary:
  ar: "أقام السلطان محمد الفاتح قلعة روملي حصار في الجانب الأوروبي على مضيق البوسفور في أضيق نقطة منه، مقابل القلعة التي أسسها السلطان بايزيد في البر الآسيوي؛ حاول الإمبراطور البيزنطي إثناءه عن البناء بعروض مالية فأصرّ، حتى اكتملت قلعة عالية محصنة وصل ارتفاعها 82 متراً على ما في الصلابي، وصارت القلعتان متقابلتين لا يفصل بينهما سوى 660 متراً تتحكمان في عبور السفن وتستطيع نيران مدافعهما منع أي سفينة من الوصول إلى القسطنطينية من جهة البحر الأسود {cite:dawlat-uthmaniyya-salabi p. 92}."
  en: "Rumeli Hisarı, Mehmed II's castle on the European side of the Bosphorus at its narrowest point, opposite Bayezid's fortress on the Asian shore: the emperor's money could not buy it off, and when finished the two castles stood 660 m apart, their cannon able to bar any ship's passage toward Constantinople {cite:dawlat-uthmaniyya-salabi p. 92}. The book's 82-m height figure is reported as printed."
