summary:
  ar: "مسجد مقر الجمعية الإسلامية لأمريكا الشمالية في پلينفيلد بإنديانا، صممه گلزار حيدر بطابع معاصر متقشف خالٍ من الرموز التقليدية، وشكله المكعب تذكير بالكعبة، ويؤرخه المقال بسنة 1979 والتعليق بسنة 1981 {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 6-7} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 26-27}."
  en: "The mosque of the Islamic Society of North America's headquarters at Plainfield, Indiana, designed by Gulzar Haider in an austere contemporary manner without traditional iconography, its cubic form a reminder of the Ka'ba; the essay dates it 1979, the caption 1981 {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 6-7} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 26-27}."
  ur: "پلین فیلڈ، انڈیانا میں اسلامک سوسائٹی آف نارتھ امریکہ کے صدر دفتر کی مسجد، جسے گلزار حیدر نے روایتی علامتوں سے خالی سادہ جدید انداز میں ڈیزائن کیا، اور جس کی مکعب شکل کعبہ کی یاد دلاتی ہے؛ مضمون اسے 1979ء کی اور عنوان 1981ء کی بتاتا ہے {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 6-7} {cite:khalidi-donnellon-mosques-usa-canada-catalogue pp. 26-27}۔"
