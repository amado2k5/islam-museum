  es: "Boceto de ficha para la mezquita Abu Dulaf de Samarra, construida por el abasí al-Mu'tamid alrededor del año 860 con un minarete espiral más pequeño al estilo de al-Mutawakkil; la entrada de la enciclopedia aún no ha sido verificada en la página."
  ur: "سامرہ کی ابو دلف مسجد کے لیے ڈرافٹ کارڈ، جو تقریباً 860 میں عباسی المتمید نے المتوکل کے انداز میں ایک چھوٹے سرپل مینار کے ساتھ تعمیر کیا تھا۔ انسائیکلوپیڈیا کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
