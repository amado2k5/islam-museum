  ar: "بطاقة أولية لجامع أبو دلف بسامراء، الجامع الذي بناه المعتمد العباسي سنة ٨٦٠م بمئذنته الحلزونية على طراز جامع المتوكل الأصغر؛ لم تُراجع الصفحة بعد."
  en: "Draft card for the Abu Dulaf Mosque of Samarra, built by the Abbasid al-Mu'tamid about 860 with a smaller spiral minaret in the style of al-Mutawakkil's; the encyclopedia entry is not yet checked on the page."
