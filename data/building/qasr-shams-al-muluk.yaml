summary:
  ar: "القصر بالشرف الأعلى الشمالي بدمشق منسوباً إلى هرقل، وكان يُعرف في زمان ابن فضل الله العمري بقصر شمس الملوك؛ لم يبق منه إلا الجوسق والحمام، وصار الجوسق خانقاه للفقراء، وكان لا يزال منزلاً لملوك ومنتزهاً لأهل البلد لإشرافه على نهر بردى والوادي، وقد نزله السلطان صلاح الدين {cite:umari-masalik-1924 p. 250}."
  en: "The palace on Damascus's northern Height ascribed to Heraclius, known in al-Umari's day as Qasr Shams al-Muluk; only the jawsaq and bath survived — the jawsaq turned into a khanqah for the poor — yet it still lodged kings and pleasured the townsfolk above the Barada river, and Sultan Salah al-Din once stayed there {cite:umari-masalik-1924 p. 250}."
