label: { ar: "قصر هرقل ⁦(شمس الملوك)⁩", en: "Qasr Hiraql / Qasr Shams al-Muluk", fr: "Qasr Hiraql / Qasr Shams al-Muluk", ur: "قصر ہیراقل / قصر شمس الملوک", tr: "Herakleios Sarayı (Şems-Müluk)", id: "Istana Heraclius (Shams al-Muluk)" }
summary:
  ar: "القصر بالشرف الأعلى الشمالي بدمشق منسوباً إلى هرقل، وكان يُعرف في زمان ابن فضل الله العمري بقصر شمس الملوك؛ لم يبق منه إلا الجوسق والحمام، وصار الجوسق خانقاه للفقراء، وكان لا يزال منزلاً لملوك ومنتزهاً لأهل البلد لإشرافه على نهر بردى والوادي، وقد نزله السلطان صلاح الدين {cite:umari-masalik-1924 p. 250}."
  en: "The palace on Damascus's northern Height ascribed to Heraclius, known in al-Umari's day as Qasr Shams al-Muluk; only the jawsaq and bath survived — the jawsaq turned into a khanqah for the poor — yet it still lodged kings and pleasured the townsfolk above the Barada river, and Sultan Salah al-Din once stayed there {cite:umari-masalik-1924 p. 250}."
  fr: "Palais de la hauteur nord de Damas attribué à Héraclius, dit Shams al-Muluk chez al-Umari ; seuls pavillon et bains subsistaient, le pavillon devenu khanqah des pauvres. Il accueillait encore rois et citadins au-dessus du Barada ; Salah al-Din y séjourna {cite:umari-masalik-1924 p. 250}"
  es: "El palacio en la altura norte de Damasco, atribuido a Heraclio, conocido en la época de al-Umari como Qasr Shams al-Muluk; solo sobrevivieron el jawsaq y el baño —el jawsaq se convirtió en un khanqah para los pobres—, pero aún alojaba a reyes y deleitaba a los habitantes de la ciudad sobre el río Barada, y el sultán Saladino se hospedó allí una vez {cite:umari-masalik-1924 p. 250}."
  ur: "دمشق کی شمالی بلندی پر واقع محل ہرقل سے منسوب ہے جسے عمری کے زمانے میں قصر شمس الملوک کے نام سے جانا جاتا تھا۔ صرف جوساق اور حمام بچ گئے - جوساق غریبوں کے لیے خانقاہ میں تبدیل ہو گیا - پھر بھی اس نے بادشاہوں کو ٹھہرایا اور دریائے بردہ کے اوپر کے شہروں کے لوگوں کو خوش کیا، اور سلطان صلاح الدین ایک بار وہیں ٹھہرے تھے۔ 250}۔"
  tr: "Şam'ın kuzey yukarı Şeraf'ındaki saray Herakleios'a atfedilir. İbn Fadlallah el-Ömeri zamanında burası Kralın Güneşi Sarayı olarak bilinirdi; sadece Cevsek ve hamam kalmıştır. Cevsaq, yoksullar için bir hanka olmuştur. Barê Nehri ve vadinin gözetimi nedeniyle hâlâ bir kraliyet ikametgahı ve kasaba halkı için bir parktı. Sultan Salah al-Din buraya yerleşmiştir {cite:umari-masalik-1924, s. 250}."
  id: "Istana di Sharaf bagian utara atas di Damaskus dikaitkan dengan Heraclius. Pada masa Ibn Fadlallah al-Omari, istana ini dikenal sebagai Istana Matahari Raja; hanya Jawsaq dan pemandian yang tersisa. Jawsaq menjadi khanqah bagi orang miskin. Masih menjadi kediaman kerajaan dan taman bagi penduduk kota karena pengawasannya terhadap Sungai Barada dan lembahnya. Sultan Salah al-Din menetap di sana {cite:umari-masalik-1924, hlm. 250}."
