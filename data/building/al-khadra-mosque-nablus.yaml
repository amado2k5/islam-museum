summary:
  ar: "جامع الخضراء في البلدة القديمة بنابلس، من معالمها المملوكية. شُيّد في الأصل كنيسة صليبية ثم حوّله الأترابيون/الأيوبيون مسجداً، وحافظ مدخله على زخرفة أقواس متشابكة صليبية؛ لُقّب بالخضراء لشهرة نسبها إلى الخضر {cite:archnet}{cite:taawon-yalla-falasteen}."
  en: "Al-Khadra Mosque in the old town of Nablus, one of its Mamluk landmarks. First built as a Crusader church, it was converted into a mosque in the late twelfth century and keeps a Crusader chevron-carved portal; its name "the Green" is tied to the popular al-Khidr association {cite:archnet}{cite:taawon-yalla-falasteen}."
  ur: "قدیم نابلس کی الخدرہ مسجد، شہر کے مملوک آثار میں سے۔ اصل میں صلیبی گرجا تھا جسے بارہویں صدی کے آخر میں مسجد بنایا گیا اور اس کے دروازے پر صلیبی نقشِ زیگ زاگ باقی ہے؛ نام "خضرا" الخضر سے مشہور نسبت کے سبب ہے {cite:archnet}{cite:taawon-yalla-falasteen}۔"
  fr: "La mosquée al-Khadra dans la vieille ville de Naplouse, un de ses monuments mamelouks. Église croisée à l’origine, elle fut convertie en mosquée à la fin du XIIe siècle et conserve un portail croisé à chevrons ; son nom « la Verte » renvoie à l’association populaire avec al-Khidr {cite:archnet}{cite:taawon-yalla-falasteen}."
  es: "La mezquita al-Khadra en el casco antiguo de Nablus, uno de sus monumentos mamelucos. Construida como iglesia cruzada, fue convertida en mezquita a finales del siglo XII y conserva un portal cruzado de chevrones; su nombre, «la Verde», se asocia popularmente a al-Jidr {cite:archnet}{cite:taawon-yalla-falasteen}."
  tr: "Nablus eski şehrindeki el-Hadra Camii, kentin Memlük dönemi eserlerinden. Başlangıçta Haçlı kilisesi olarak inşa edildi, on ikinci yüzyılın sonunda camiye çevrildi ve Haçlı işi zikzak taş işlemeli portalını korur; "Yeşil" adı halk arasındaki Hızır çağrışımındandır {cite:archnet}{cite:taawon-yalla-falasteen}."
  id: "Masjid al-Khadra di kota tua Nablus, salah satu bangunan Mamluknya. Mulanya gereja Tentara Salib, diubah menjadi masjid akhir abad ke-12 dan mempertahankan portal ukiran chevron; nama "al-Khadra" terkait asosiasi populer dengan al-Khidir {cite:archnet}{cite:taawon-yalla-falasteen}."
