summary:
  ar: "بطاقة أولية لضريح شاه نعمة الله الولي بماهان في كرمان بإيران، الضريح والمزار التيموري لمؤسس الطريقة النعمة اللهية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Shah Nematollah Vali Shrine of Mahan near Kerman, Iran, the Timurid shrine of the founder of the Ni'matullahi order; its sources are not yet checked on the page."
