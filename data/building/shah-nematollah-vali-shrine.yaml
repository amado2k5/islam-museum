  es: "Boceto de ficha para el santuario Shah Nematollah Vali de Mahan, cerca de Kerman, Irán, santuario timúrida del fundador de la orden Ni'matullahi; sus fuentes aún no han sido verificadas en la página."
  ur: "کرمان، ایران کے قریب مہان کے شاہ نعمت اللہ ولی کے مزار کے لیے ڈرافٹ کارڈ، نعمت اللہی حکم کے بانی کے تیموری مزار؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "İran'ın Kirman kentindeki Mahan'daki Şah Ni'matollah al-Wali türbesi için ön kart, Timuri türbesi ve Ni'matullah tarikatının kurucusunun türbesi; sayfadaki kaynaklar henüz gözden geçirilmemiştir."
  id: "Kartu pendahuluan untuk makam Shah Ni'matollah al-Wali di Mahan, Kerman, Iran, makam Timurid dan makam pendiri tarekat Ni'matullah; sumber-sumbernya di halaman tersebut belum ditinjau."
