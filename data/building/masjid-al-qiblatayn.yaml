label: { ar: "مسجد القبلتين", en: "Mosque of the Two Qiblas" }
summary:
  ar: "مسجد بني سلمة بالمدينة، سُمي بالقبلتين لأن القبلة صُرفت فيه: نقل ابن زبالة أن بشراً من بني سلمة أتاهم وهم يصلون الفجر فأخبرهم بتحويل القبلة فاستداروا وقد صلوا ركعتين حتى جعلوا وجوههم إلى الكعبة — وفيه اختلف الرواة، فالزمخشري وأهل السير يجعلون التحويل فيه في صلاة الظهر حين صلى النبي بأصحابه ركعتين ثم استدار واستقبل الميزاب وتحوّل الرجال مكان النساء والنساء مكان الرجال، وردّ ابن حجر بالجمع بين الروايات، ولاحظ المجد أنه على رواية ابن زبالة كان مسجد قباء أولى بهذه التسمية {cite:samhudi-wafa-al-wafa p. 373-376}. وعند ابن زبالة كان المسجد لبني سواد بن غنم بن كعب بن سلمة في ناحية المذاد، وردّه المطري إلى بني حرام {cite:samhudi-wafa-al-wafa p. 213}."
  en: "The Banu Salama mosque of Medina, named 'of the two qiblas' because the qibla was turned in it: Ibn Zabala reports that a man of Banu Salama reached them at dawn prayer with word of the change and they turned mid-prayer to the Kaaba — while al-Zamakhshari and the sira tradition make the change fall at zuhr when the Prophet had prayed two rak'as with his Companions, then turned to face the Mizab, the men and women exchanging places; Ibn Hajar reconciles the reports, and al-Majd notes that on Ibn Zabala's version Quba mosque would better deserve the name {cite:samhudi-wafa-al-wafa p. 373-376}. Ibn Zabala ascribes the mosque to Banu Sawad ibn Ghanm of Banu Salama by al-Midhad, against al-Matari's ascription to Banu Haram {cite:samhudi-wafa-al-wafa p. 213}."
