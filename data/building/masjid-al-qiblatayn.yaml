id: building/masjid-al-qiblatayn
class: building
kind: mosque
label: { ar: "مسجد القبلتين", en: "Mosque of the Two Qiblas", fr: "Mosquée des Deux Qiblas", es: "Mezquita de las Dos Qiblas" }
summary:
  ar: "مسجد بني سلمة بالمدينة، سُمي بالقبلتين لأن القبلة صُرفت فيه: نقل ابن زبالة أن بشراً من بني سلمة أتاهم وهم يصلون الفجر فأخبرهم بتحويل القبلة فاستداروا وقد صلوا ركعتين حتى جعلوا وجوههم إلى الكعبة — وفيه اختلف الرواة، فالزمخشري وأهل السير يجعلون التحويل فيه في صلاة الظهر حين صلى النبي بأصحابه ركعتين ثم استدار واستقبل الميزاب وتحوّل الرجال مكان النساء والنساء مكان الرجال، وردّ ابن حجر بالجمع بين الروايات، ولاحظ المجد أنه على رواية ابن زبالة كان مسجد قباء أولى بهذه التسمية {cite:samhudi-wafa-al-wafa p. 373-376}. وعند ابن زبالة كان المسجد لبني سواد بن غنم بن كعب بن سلمة في ناحية المذاد، وردّه المطري إلى بني حرام {cite:samhudi-wafa-al-wafa p. 213}."
  en: "The Banu Salama mosque of Medina, named 'of the two qiblas' because the qibla was turned in it: Ibn Zabala reports that a man of Banu Salama reached them at dawn prayer with word of the change and they turned mid-prayer to the Kaaba — while al-Zamakhshari and the sira tradition make the change fall at zuhr when the Prophet had prayed two rak'as with his Companions, then turned to face the Mizab, the men and women exchanging places; Ibn Hajar reconciles the reports, and al-Majd notes that on Ibn Zabala's version Quba mosque would better deserve the name {cite:samhudi-wafa-al-wafa p. 373-376}. Ibn Zabala ascribes the mosque to Banu Sawad ibn Ghanm of Banu Salama by al-Midhad, against al-Matari's ascription to Banu Haram {cite:samhudi-wafa-al-wafa p. 213}."
  fr: "Mosquée des Banu Salama à Médine, nommée des Deux Qiblas en raison du changement de direction de prière. Ibn Zabala rapporte qu’un homme annonça ce changement à la prière de l’aube et que les fidèles se tournèrent alors vers la Kaaba ; al-Zamakhshari et la sira le placent à midi, le Prophète ayant prié deux rak’as avec ses compagnons avant de se tourner vers la gouttière, hommes et femmes échangeant leurs places. Ibn Hajar concilie les récits ; pour al-Majd, dans la version d’Ibn Zabala, Quba mériterait davantage le nom. Ibn Zabala l’attribue aux Banu Sawad ibn Ghanm des Banu Salama près d’al-Midhad, contre l’attribution d’al-Matari aux Banu Haram. {cite:samhudi-wafa-al-wafa p. 373-376} {cite:samhudi-wafa-al-wafa p. 213}"
  es: "La mezquita Banu Salama de Medina, llamada 'de las dos qiblas' porque la qibla estaba orientada en ella: Ibn Zabala relata que un hombre de Banu Salama llegó a ellos en la oración del amanecer con la noticia del cambio y ellos se volvieron a mitad de la oración hacia la Kaaba; mientras que al-Zamakhshari y la tradición sira hacen que el cambio ocurra en el zuhr, cuando el Profeta había rezado dos rak'as con sus Compañeros, y luego se volvió hacia el Mizab, intercambiando hombres y mujeres sus lugares; Ibn Hajar concilia los relatos, y al-Majd señala que, según la versión de Ibn Zabala, la mezquita Quba merecería mejor el nombre {cite:samhudi-wafa-al-wafa p. 373-376}. Ibn Zabala atribuye la mezquita a Banu Sawad ibn Ghanm de Banu Salama por al-Midhad, en contra de la adscripción de al-Matari a Banu Haram {cita:samhudi-wafa-al-wafa p. 213}."
