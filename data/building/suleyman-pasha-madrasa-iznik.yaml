summary:
  ar: "أول بناء عثماني صُمم أصلاً مدرسةً، بناها سليمان باشا بن أورهان بعد فتح إزنيق بقليل؛ صحن مسوّر بأروقة وحجرات ودرسخانة خارج المحور."
  en: "The first Ottoman building designed as a medrese, built by Orhan's son Süleyman Pasha soon after the conquest of Nicaea; a porticoed courtyard with cells and an off-centre dershane."
  fr: "Premier édifice ottoman conçu comme medrese, par le fils d’Orhan peu après Nicée ; cour à portiques, cellules et dershane décentré."
  es: "El primer edificio otomano diseñado como madraza, construido por el hijo de Orhan, Süleyman Pasha, poco después de la conquista de Nicea; un patio porticado con celdas y un dershane descentrado."
  ur: "پہلی عثمانی عمارت جسے میڈریس کے طور پر ڈیزائن کیا گیا تھا، جسے اورحان کے بیٹے سلیمان پاشا نے نیکیہ کی فتح کے فوراً بعد تعمیر کیا تھا۔ ایک پورٹی کوڈ صحن جس میں سیل اور ایک آف سینٹر درشن ہے۔"
  tr: "İlk Osmanlı binası, İznik'in fethinden kısa süre sonra Süleyman Paşa bin Orhan tarafından inşa edilen bir okuldu; eksen dışında kemerler, odalar ve bir çalışma salonu bulunan surlarla çevrili bir avlu."
  id: "Bangunan Ottoman pertama yang awalnya dirancang adalah sebuah sekolah, dibangun oleh Suleiman Pasha ibn Orhan tak lama setelah penaklukan Iznik; sebuah halaman berdinding dengan arkade, ruangan, dan ruang belajar di luar poros."
