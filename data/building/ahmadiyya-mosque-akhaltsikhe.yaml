  ar: "المسجد الأحمدي بأخالتسيخي بجورجيا؛ بناه والي جلدر أحمد باشا نحو 1749م وحُوّل كنيسة سنة 1828م وهو اليوم متحف القلعة {cite:yilmaz-turkish-monuments-churches-2023 pp.252-253}."
  en: "The Ahmadiyya (Ahmediye) Mosque of Akhaltsikhe, built c.1749 by the governor of Çıldır, a church since 1828 and today the Castle Museum {cite:yilmaz-turkish-monuments-churches-2023 pp.252-253}."
  fr: "La mosquée Ahmadiyya (Ahmediye) d’Akhaltsikhe, construite vers 1749 par le gouverneur de Çıldır, devenue église en 1828 et aujourd’hui musée du château {cite:yilmaz-turkish-monuments-churches-2023 pp.252-253}."
  es: "La Mezquita Ahmadiyya (Ahmediye) de Akhaltsikhe, construida alrededor de 1749 por el gobernador de Çıldır, iglesia desde 1828 y hoy Museo del Castillo {cite:yilmaz-turkish-monuments-churches-2023 pp.252-253}."
  ur: "احمدیہ ⁦(احمدیہ)⁩ مسجد اخلتشیخ، 1749ء میں چلڈر کے گورنر کے ذریعے تعمیر کی گئی، جو 1828 سے ایک چرچ ہے اور آج کیسل میوزیم {حوالہ: یلماز-ترکی-یادگار-چرچ-2023 صفحہ 252-253}۔"
