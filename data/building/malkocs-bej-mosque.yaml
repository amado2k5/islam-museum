summary:
  ar: "الجامع الوحيد الباقي في قلعة شيكلوش، بناه في أوائل القرن السادس عشر ملقوچ بك أخو قره علي بك من أسر الأقنجية، استعمل مسكناً في القرن التاسع عشر، ورُمم سنة 1993 فنال جائزة أوروبا نوسترا، وهو اليوم متحف {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}."
  en: "The only surviving mosque of Siklós castle, built in the early sixteenth century by Malkoç Bey, brother of the raider-family commander Kara Ali Bey; a dwelling in the nineteenth century, restored in 1993 with a Europa Nostra award, now a museum {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}."
  ur: "شیکلوش قلعے کی واحد باقی مسجد، سولھویں صدی کے اوائل میں اقنجی خاندان کے قرہ علی بے کے بھائی ملقوچ بے کی بنوائی؛ انیسویں صدی میں مکان، 1993ء میں مرمت پر یوروپا نوسترا انعام، اب عجائب گھر {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}۔"
