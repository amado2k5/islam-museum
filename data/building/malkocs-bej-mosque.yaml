label: { ar: "جامع ملقوچ بك في قلعة شيكلوش", en: "Malkoç Bey Mosque, Siklós", fr: "Mosquée Malkoç Bey, Siklós", ur: "ملقوچ بے مسجد، شیکلوش", es: "Mezquita de Malkoç Bey, Siklós", tr: "Şiklush Kalesi'ndeki Malkoj Bek Camii", id: "Masjid Malkoj Bek di Benteng Shiklush" }
summary:
  ar: "الجامع الوحيد الباقي في قلعة شيكلوش، بناه في أوائل القرن السادس عشر ملقوچ بك أخو قره علي بك من أسر الأقنجية، استعمل مسكناً في القرن التاسع عشر، ورُمم سنة 1993 فنال جائزة أوروبا نوسترا، وهو اليوم متحف {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}."
  en: "The only surviving mosque of Siklós castle, built in the early sixteenth century by Malkoç Bey, brother of the raider-family commander Kara Ali Bey; a dwelling in the nineteenth century, restored in 1993 with a Europa Nostra award, now a museum {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}."
  fr: "Seule mosquée conservée du château de Siklós, bâtie au début du XVIe siècle par Malkoç Bey, frère de Kara Ali Bey, commandant d’une famille de chefs de raids ; habitation au XIXe siècle, restaurée en 1993 avec prix Europa Nostra, aujourd’hui musée {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}"
  ur: "شیکلوش قلعے کی واحد باقی مسجد، سولھویں صدی کے اوائل میں اقنجی خاندان کے قرہ علی بے کے بھائی ملقوچ بے کی بنوائی؛ انیسویں صدی میں مکان، 1993ء میں مرمت پر یوروپا نوسترا انعام، اب عجائب گھر {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}۔"
  es: "La única mezquita que se conserva del castillo de Siklós, construida a principios del siglo XVI por Malkoç Bey, hermano del comandante de la familia de asaltantes Kara Ali Bey; una vivienda del siglo XIX, restaurada en 1993 con un premio Europa Nostra, ahora un museo {cite:yilmaz-ottoman-architecture-hungary-2024 p. 185}."
  tr: "Ciklós Kalesi'ndeki kalan tek cami, 16. yüzyılın başlarında Ağanji ailesinden Kara Ali Bey'in kardeşi Malkuj Beg tarafından inşa edilmiştir. 19. yüzyılda konut olarak kullanılmış, 1993'te restore edilmiş ve Europa Nostra Ödülü'nü kazanmıştır. Şu anda bir müze olarak hizmet vermektedir {cite:yilmaz-ottoman-architecture-hungary-2024, s. 185}."
  id: "Satu-satunya masjid yang tersisa di Kastil Ciklós dibangun pada awal abad ke-16 oleh Malkuj Beg, saudara Kara Ali Bey dari keluarga Ağanji. Masjid ini digunakan sebagai kediaman pada abad ke-19, dipugar pada tahun 1993, dan memenangkan Penghargaan Europa Nostra. Sekarang menjadi museum {cite:yilmaz-ottoman-architecture-hungary-2024, hlm. 185}."
