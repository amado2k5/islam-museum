id: building/dar-al-baida-fustat
class: building
kind: palace
label:
  ar: الدار البيضاء بالفسطاط
  en: The White House (al-Dar al-Bayda'), al-Fustat
  fr: "Maison blanche (al-Dar al-Bayda), Fustat"
  ur: دار البیضاء، فسطاط
  es: "La Casa Blanca (al-Dar al-Bayda'), al-Fustat"
  tr: "Fustat'ta Kazablanka"
  id: "Casablanca di Fustat"
summary:
  ar: دار بالفسطاط بين يدي المسجد الجامع، يقال إنها خطة عبد الرحمن بن عديس البلوي، ويقال كانت صحناً موقفاً لخيل المسلمين حتى بناها مروان بن الحكم داراً لنفسه حين قدم مصر سنة خمس وستين في شهرين {cite:futuh-misr-amir-1999 p. 152}.
  en: A house in al-Fustat facing the congregational mosque, said to be the plot of Abd al-Rahman ibn Udays al-Balawi, or else an open court where the Muslims' horses stood, until Marwan ibn al-Hakam built it as his own house in two months on coming to Egypt in the year 65 {cite:futuh-misr-amir-1999 p. 152}.
  fr: "Maison de Fustat face à la grande mosquée, qui aurait été le terrain d’Abd al-Rahman ibn Udays al-Balawi, ou une cour ouverte où stationnaient les chevaux des musulmans, jusqu’à ce que Marwan ibn al-Hakam y fasse construire sa maison en deux mois lors de sa venue en Égypte en l’an 65 {cite:futuh-misr-amir-1999 p. 152}."
  ur: فسطاط میں جامع مسجد کے سامنے ایک گھر، جس کے بارے میں کہا جاتا ہے کہ یہ عبد الرحمن بن عدیس بلوی کا خطہ تھا، یا ایک کھلا صحن جہاں مسلمانوں کے گھوڑے کھڑے ہوتے تھے، یہاں تک کہ مروان بن الحکم نے سنہ 65 میں مصر آ کر دو مہینے میں اسے اپنا گھر بنوایا {cite:futuh-misr-amir-1999 p. 152}۔
  es: "Una casa en al-Fustat frente a la mezquita congregacional, que se dice que era la parcela de Abd al-Rahman ibn Udays al-Balawi, o bien un patio abierto donde se encontraban los caballos de los musulmanes, hasta que Marwan ibn al-Hakam la construyó como su propia casa en dos meses al llegar a Egipto en el año 65 {cite:futuh-misr-amir-1999 p. 152}."
  tr: "Fustat'ta Büyük Camii yakınındaki bir ev; planının Abd al-Rahman ibn 'Adis al-Balawi'ye ait olduğu söylenir ve Marwan ibn al-Hakam'ın altmış beşinci yılında Mısır'a geldiğinde kendisi için ev yapmasına kadar Müslüman atlar için bir avlu olduğu söylenir {cite:futuh-misr-amir-1999, s. 152}."
  id: "Sebuah rumah di Fustat dekat Masjid Agung; konon merupakan rancangan Abd al-Rahman ibn 'Adis al-Balawi, dan dikatakan pernah menjadi halaman kuda Muslim sampai Marwan ibn al-Hakam membangunnya sebagai rumah untuk dirinya sendiri ketika ia tiba di Mesir pada tahun enam puluh lima {cite:futuh-misr-amir-1999, hlm. 152}."
