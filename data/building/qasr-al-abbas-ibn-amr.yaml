label: { ar: "قصر العباس بن عمرو الغنوي", en: "the palace of al-Abbas ibn Amr al-Ghanawi", fr: "Palais d’al-Abbas ibn Amr al-Ghanawi", es: "el palacio de al-Abbas ibn Amr al-Ghanawi", ur: "عباس ابن عمرو الغنوی کا محل", tr: "Abbas bin Amr Al-Ghanawi Sarayı", id: "Istana Abbas bin Amr Al-Ghanawi" }
summary:
  ar: "قصر بين سنجار ونصيبين بناه العباس بن عمرو الغنوي من أهل تل سيّار — باني الرقة ورأس عين من حصن مسلمة بن عبد الملك بن مروان وكان يتولى اليمامة والبحرين، وهو الذي سيره المعتضد لحرب القرامطة في عشرة آلاف فارس فقُتل الجميع وسلم وحده. صار القصر لوحة مواعظ: كتب عليه سيف الدولة بخطه سنة 331هـ، وتحته الغضنفر بن الحسن بن علي بن حمدان سنة 362هـ، وتحته المقلد بن المسيب بن رافع سنة 388هـ، ثم ابنه قرواش سنة 401هـ وقد عزم على هدمه وقال «هذا مشؤوم» ثم تركه {cite:umari-masalik-1924 p. 245-248}."
  en: "The palace between Sinjar and Nasibin built by al-Abbas ibn Amr al-Ghanawi of Tall Sayyar — builder of Raqqa and Ra's al-Ayn for Maslama ibn Abd al-Malik, governor of al-Yamama and Bahrayn, and the sole survivor when al-Mu'tadid sent him against the Qarmatians with ten thousand horse. Its wall became a chronicle of mutability: Sayf al-Dawla inscribed an elegy on it in 331, Ghadanfar ibn al-Hasan ibn Hamdan in 362, al-Muqallad ibn al-Musayyib in 388, and his son Qurwash in 401, who resolved to raze it as ill-omened, then spared it {cite:umari-masalik-1924 p. 245-248}."
  fr: "Palais entre Sinjar et Nasibin bâti par al-Abbas ibn Amr al-Ghanawi de Tall Sayyar, bâtisseur de Raqqa et Ras al-Ayn pour Maslama ibn Abd al-Malik, gouverneur d’al-Yamama et Bahrayn, seul survivant des dix mille cavaliers envoyés contre les Qarmates par al-Mu’tadid. Son mur devint chronique du changement : élégies de Sayf al-Dawla en 331, Ghadanfar ibn al-Hasan ibn Hamdan en 362, al-Muqallad ibn al-Musayyib en 388, puis son fils Qurwash en 401, qui voulut le raser comme mauvais présage puis l’épargna {cite:umari-masalik-1924 p. 245-248}"
  es: "El palacio entre Sinjar y Nasibin fue construido por al-Abbas ibn Amr al-Ghanawi de Tall Sayyar, constructor de Raqqa y Ra's al-Ayn para Maslama ibn Abd al-Malik, gobernador de al-Yamama y Bahrayn, y único superviviente cuando al-Mu'tadid lo envió contra los cármatas con diez mil jinetes. Su muro se convirtió en una crónica de mutabilidad: Sayf al-Dawla inscribió una elegía en él en 331, Ghadanfar ibn al-Hasan ibn Hamdan en 362, al-Muqallad ibn al-Musayyib en 388, y su hijo Qurwash en 401, quien decidió arrasarlo por considerarlo de mal agüero, pero luego lo perdonó {cite:umari-masalik-1924 p. 245-248}."
  ur: "سنجر اور ناصبین کے درمیان کا محل جو قد سیار کے العباس ابن عمرو الغنوی نے بنایا تھا - رقہ اور راع العین کے معمار، مسلمہ ابن عبد الملک کے لیے، یمامہ اور بحرین کے گورنر، اور واحد زندہ بچ جانے والا جب المتدید نے دس ہزار گھوڑوں کے ساتھ اس کے خلاف بھیجا۔ اس کی دیوار متغیر ہونے کی تاریخ بن گئی: سیف الدولہ نے 331 میں اس پر ایک افسانہ کندہ کیا، غضنفر ابن الحسن ابن حمدان نے 362 میں، المقلد ابن المسیب نے 388 میں، اور اس کے بیٹے قرواش نے 401 میں، اس کے بعد اس کا حل نکالا۔ {حوالہ:عمری مسالک-1924 ص۔ 245-248}۔"
  tr: "Sinjar ile Nisibiyyin arasında bir saray, Rakka'nın kurucusu ve Maslamah ibn Abdülmelik ibn Mervan kalesinden bir pınarın başı olan Tell Sayyar'dan el-Abbas ibn Amr el-Ganavi tarafından inşa edilmiştir. Yamama ve Bahreyn'i yönetmiş, al-Mu'tadid tarafından on bin süvariyle Karmaç savaşına götürülmüş, hepsini öldürmüş ve tek başına teslim olmuştur. Saray bir vaaz plaketi haline gelmiştir: Seyf al-Dawla 331 Hicri'nde kendi el yazısıyla üzerine yazmıştır, altında 362 H yılında el-Ghadanfar ibn al-Hasan ibn Ali ibn Hamdan, altında 388 Hicri el-Muqallid ibn Musayyib ibn Rafi', ardından 401 Hicri'nde oğlu Qurwash vardır; o da yıkmaya karar vermiş ve 'Bu uğursuzdur,' demiştir., ardından {cite:Umari-Masalik-1924, s. 245-248} bıraktı."
  id: "Sebuah istana antara Sinjar dan Nisibiyyin dibangun oleh al-Abbas ibn Amr al-Ghanawi dari Tell Sayyar — pembangun Raqqa dan kepala mata air dari benteng Maslamah ibn Abd al-Malik ibn Marwan. Ia memerintah al-Yamama dan Bahrain, dan dipimpin oleh al-Mu'tadid ke perang Qarmatia dengan sepuluh ribu penunggang kuda, membunuh semuanya dan menyerah sendirian. Istana itu menjadi plakat khotbah: Sayf al-Dawla menulis di atasnya dengan tulisan tangannya sendiri pada tahun 331 H, di bawahnya al-Ghadanfar ibn al-Hasan ibn Ali ibn Hamdan pada tahun 362 H, di bawahnya adalah al-Muqallid ibn al-Musayyib ibn Rafi' pada tahun 388 H, lalu putranya Qurwash pada tahun 401 H, yang memutuskan untuk membongkar dan berkata, 'Ini mengerikan,' lalu pergi {cite:Umari-Masalik-1924, hlm. 245-248}."
