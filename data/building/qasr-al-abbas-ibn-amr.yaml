label: { ar: "قصر العباس بن عمرو الغنوي", en: "the palace of al-Abbas ibn Amr al-Ghanawi" }
summary:
  ar: "قصر بين سنجار ونصيبين بناه العباس بن عمرو الغنوي من أهل تل سيّار — باني الرقة ورأس عين من حصن مسلمة بن عبد الملك بن مروان وكان يتولى اليمامة والبحرين، وهو الذي سيره المعتضد لحرب القرامطة في عشرة آلاف فارس فقُتل الجميع وسلم وحده. صار القصر لوحة مواعظ: كتب عليه سيف الدولة بخطه سنة 331هـ، وتحته الغضنفر بن الحسن بن علي بن حمدان سنة 362هـ، وتحته المقلد بن المسيب بن رافع سنة 388هـ، ثم ابنه قرواش سنة 401هـ وقد عزم على هدمه وقال «هذا مشؤوم» ثم تركه {cite:umari-masalik-1924 p. 245-248}."
  en: "The palace between Sinjar and Nasibin built by al-Abbas ibn Amr al-Ghanawi of Tall Sayyar — builder of Raqqa and Ra's al-Ayn for Maslama ibn Abd al-Malik, governor of al-Yamama and Bahrayn, and the sole survivor when al-Mu'tadid sent him against the Qarmatians with ten thousand horse. Its wall became a chronicle of mutability: Sayf al-Dawla inscribed an elegy on it in 331, Ghadanfar ibn al-Hasan ibn Hamdan in 362, al-Muqallad ibn al-Musayyib in 388, and his son Qurwash in 401, who resolved to raze it as ill-omened, then spared it {cite:umari-masalik-1924 p. 245-248}."
