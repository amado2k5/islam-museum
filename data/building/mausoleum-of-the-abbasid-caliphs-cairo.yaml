id: building/mausoleum-of-the-abbasid-caliphs-cairo
class: building
kind: tomb
label: { ar: "قبة الخلفاء العباسيين بالقاهرة", en: "Mausoleum of the Abbasid Caliphs, Cairo", fr: "Mausolée des califes abbassides, Le Caire", ur: "عباسی خلفا کا مقبرہ، قاہرہ", es: "Mausoleo de los califas abasíes, El Cairo", tr: "Kahire'deki Abbasi Halifelerinin Kubbesi", id: "Kubah Khalifah Abbasiyah di Kairo" }
summary:
  ar: "قبة أيوبية قرب مشهد السيدة نفيسة، أقدم شاهد مؤرخ فيها لأبي نضلة رسول الخليفة ⁦(ت 1242م)⁩، دُفن فيها ابنا بيبرس ثم خلفاء بني العباس في القاهرة، وزخرفتها الداخلية من أبهى زخارف العصر {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}."
  en: "An Ayyubid mausoleum near the shrine of Sayyida Nafisa; its oldest dated cenotaph is that of Abu Nadla, the caliph's envoy (d. 1242); Baybars's sons and later the Cairo Abbasid caliphs were buried there; its interior decoration is among the richest of its age {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}."
  fr: "Mausolée ayyoubide près de Sayyida Nafisa ; son plus ancien cénotaphe daté est celui d’Abu Nadla, envoyé du calife mort en 1242 ; les fils de Baybars puis les califes abbassides du Caire y furent enterrés. Son décor intérieur est parmi les plus riches de son époque {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}"
  es: "Un mausoleo ayubí cerca del santuario de Sayyida Nafisa; su cenotafio más antiguo datado es el de Abu Nadla, el enviado del califa (m. 1242); los hijos de Baybars y más tarde los califas abasíes de El Cairo fueron enterrados allí; su decoración interior se encuentra entre las más ricas de su época {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}."
  ur: "سیدہ نفیسہ کے مزار کے قریب ایوبی کا مقبرہ؛ اس کا سب سے قدیم تاریخی نشان ابو ندالہ کا ہے، جو خلیفہ کے ایلچی تھے ⁦(متوفی 1242)⁩؛ Baybars کے بیٹے اور بعد میں قاہرہ کے عباسی خلفاء کو وہیں دفن کیا گیا۔ اس کی اندرونی سجاوٹ اس کی عمر کے سب سے امیر ترین لوگوں میں سے ہے {حوالہ:یومانس-اسلامی-قاہرہ-2006 صفحہ 121} {حوالہ:یومانس-اسلامی-قاہرہ-2006 صفحہ 122}"
  tr: "Halife'nin elçisi Abu Nadlah'ın (ö. M.S. 1242) en eski tarihi kanıtı olan Lady Nafisa'nın türbesinin yakınındaki bir Eyyubi kubbesi. Baybars'ın oğullarını, ardından Abbasi halifelerini Kahire'de gömmüştür ve iç dekorasyonu dönemin en görkemli dekorasyonlarından biridir {cite:yeomans-islamic-cairo-2006 s.121} {cite:yeomans-islamic-cairo-2006 s.122} {cite:yeomans-islamic-cairo-2006 s.123}."
  id: "Sebuah kubah Ayyubiyah dekat makam Lady Nafisa, bukti sejarah tertua Abu Nadlah, utusan khalifah (wafat 1242 M). Kubah ini menguburkan putra-putra Baybars dan kemudian khalifah Abbasiyah di Kairo, dan dekorasi interiornya termasuk yang paling megah pada era tersebut {cite:yeomans-islamic-cairo-2006 hlm.121} {cite:yeomans-islamic-cairo-2006 hlm.122} {cite:yeomans-islamic-cairo-2006 hlm.123}."
