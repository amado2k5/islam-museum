summary:
  ar: "قبة أيوبية قرب مشهد السيدة نفيسة، أقدم شاهد مؤرخ فيها لأبي نضلة رسول الخليفة (ت 1242م)، دُفن فيها ابنا بيبرس ثم خلفاء بني العباس في القاهرة، وزخرفتها الداخلية من أبهى زخارف العصر {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}."
  en: "An Ayyubid mausoleum near the shrine of Sayyida Nafisa; its oldest dated cenotaph is that of Abu Nadla, the caliph's envoy (d. 1242); Baybars's sons and later the Cairo Abbasid caliphs were buried there; its interior decoration is among the richest of its age {cite:yeomans-islamic-cairo-2006 p.121} {cite:yeomans-islamic-cairo-2006 p.122} {cite:yeomans-islamic-cairo-2006 p.123}."
