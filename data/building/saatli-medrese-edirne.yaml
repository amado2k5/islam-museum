  es: "La \"Madrese del Reloj\" del reinado de Murad II; su enorme entrada recuerda a la Anatolia selyúcida del siglo XIII, con un dershane abovedado y un mescit alrededor de un patio porticado."
  ur: "مرات II کے دور حکومت کی 'میڈریس ود اے کلاک'؛ اس کا بہت بڑا داخلی راستہ تیرہویں صدی کے سلجوک اناطولیہ کو یاد کرتا ہے، جس میں گنبد نما درشنے اور ایک پورٹیکو صحن کے ارد گرد میسکیٹ ہے۔"
