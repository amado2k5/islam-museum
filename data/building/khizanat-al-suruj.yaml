  en: The Fatimid saddle treasury
summary:
  ar: "خزانة السروج في الدولة الفاطمية، خزانة خاصة بالسروج اتخذها الفاطميون دليلاً على عنايتهم بهذه الصناعة؛ وقد برع المصريون في صناعة السروج المحلاة بالذهب والفضة حتى كانت قيمة السرج الواحد تتراوح بين الألف دينار وسبعة آلاف دينار، وتبعتها صناعة اللجم من الذهب الخالص أو الفضة الخالصة وقلائد وأطواق لأعناق الخيل."
  en: "The khizanat al-suruj of the Fatimid state — a dedicated saddle treasury attesting the state's care for the craft: Egyptian saddlers excelled in gold- and silver-mounted saddles priced between one and seven thousand dinars, with pure gold or silver bits and chains and collars for the horses' necks."
