summary:
  ar: "بطاقة أولية للجامع الأخضر بإزنيق، الجامع الذي بناه الوزير جندرلي حيدر باشا سنة ١٣٩٢م بمنارته الفيروزية المزخرفة؛ من أقدم جوامع العثمانيين الباقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Yesil (Green) Mosque of Iznik, built by the vizier Candarli Haydar Pasha in 1392 with its famous turquoise-tiled minaret; among the earliest surviving Ottoman mosques per the cited encyclopedia, the page not yet checked."
  fr: "Notice provisoire : Mosquée d’Yeşil (Verte), Iznik, bâtie par le vizir Candarli Haydar Pacha en 1392 et dotée d’un célèbre minaret aux carreaux turquoise ; l’une des plus anciennes mosquées ottomanes subsistantes selon l’encyclopédie citée. La page n’est pas encore vérifiée."
  es: "Boceto de ficha para la Mezquita Yesil (Verde) de Iznik, construida por el visir Candarli Haydar Pasha en 1392 con su famoso minarete de azulejos turquesa; una de las mezquitas otomanas más antiguas que se conservan, según la enciclopedia citada, página aún no verificada."
  ur: "ایزنیک کی یسیل ⁦(سبز)⁩ مسجد کے لیے ڈرافٹ کارڈ، جسے وزیر کیندرلی حیدر پاشا نے 1392 میں اس کے مشہور فیروزی ٹائل والے مینار کے ساتھ تعمیر کیا تھا۔ نقل شدہ انسائیکلوپیڈیا کے مطابق قدیم ترین زندہ بچ جانے والی عثمانی مساجد میں سے، صفحہ ابھی تک چیک نہیں کیا گیا۔"
  tr: "1392 yılında Bakan Gəndarlı Haydar Paşa tarafından süslü turkuaz minaresiyle inşa edilen İznik'teki Yeşil Cami için ön kart; kalan en eski Osmanlı camilerinden biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu awal untuk Masjid Hijau di Iznik, masjid yang dibangun oleh Menteri Gandarli Haidar Pasha pada tahun 1392 M dengan menara turquoise yang dihias; salah satu masjid Ottoman tertua yang masih ada dan halamannya belum ditinjau."
