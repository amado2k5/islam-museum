summary:
  ar: "بطاقة أولية لمسجد محمود بك بقرية كسبة قرب قسطموني، من روائع المساجد الخشبية في الأناضول بُني في القرن الرابع عشر؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Mahmud Bey Mosque of Kasaba near Kastamonu, a masterpiece of fourteenth-century Anatolian timber mosque architecture; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée de Mahmud Bey, Kasaba près de Kastamonu, chef-d’œuvre de l’architecture des mosquées anatoliennes en bois du XIVe siècle. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Boceto de ficha para la mezquita Mahmud Bey de Kasaba, cerca de Kastamonu, una obra maestra de la arquitectura de mezquitas de madera de Anatolia del siglo XIV; sus fuentes aún no se han verificado en la página."
  ur: "کاسٹامونو کے قریب قصابہ کی محمود بے مسجد کے لیے ڈرافٹ کارڈ، چودھویں صدی کی اناطولیہ لکڑی کی مسجد کے فن تعمیر کا ایک شاہکار؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Kasmoni yakınlarındaki Kasba köyündeki Mahmud Bey Camii için ön kart, 14. yüzyılda Anadolu'nun ahşap camilerinin başyapıtlarından biri olarak inşa edilmiştir; sayfadaki kaynakları henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Mahmud Bey di desa Kasba dekat Kasmoni, salah satu mahakarya masjid kayu di Anatolia, dibangun pada abad ke-14; sumber-sumbernya di halaman belum ditinjau."
