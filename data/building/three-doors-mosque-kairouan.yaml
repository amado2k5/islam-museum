summary:
  ar: "بطاقة أولية لمسجد الأبواب الثلاثة ⁦(مسجد ابن خيرون)⁩ بالقيروان، الجامع الذي بناه محمد بن خيرون المعافري سنة ٨٦٦م بواجهته الحجرية المنقوشة؛ من أقدم مساجد أفريقية ولم تُراجع الصفحة بعد."
  en: "Draft card for the Three Doors (Ibn Khayrun) Mosque of Kairouan, built by Muhammad ibn Khayrun al-Mu'afiri in 866 with the earliest carved facade in Islamic architecture; the encyclopedia entry is not yet checked on the page."
  fr: "Notice provisoire : Mosquée des Trois Portes (Ibn Khayrun), Kairouan, bâtie par Muhammad ibn Khayrun al-Muafiri en 866 et dotée de la plus ancienne façade sculptée de l’architecture islamique. L’entrée encyclopédique n’est pas encore vérifiée sur la page."
  es: "Ficha de borrador para la Mezquita de las Tres Puertas (Ibn Khayrun) de Kairouan, construida por Muhammad ibn Khayrun al-Mu'afiri en 866 con la fachada tallada más antigua de la arquitectura islámica; la entrada de la enciclopedia aún no ha sido verificada en la página."
  ur: "کیروان کی تین دروازوں ⁦(ابن خیرون)⁩ مسجد کے لیے مسودہ کارڈ، جسے محمد بن خیرون المعفیری نے 866 میں تعمیر کیا تھا جس میں اسلامی فن تعمیر میں قدیم ترین نقش و نگار بنایا گیا تھا۔ انسائیکلوپیڈیا کے اندراج کو ابھی تک صفحہ پر چیک نہیں کیا گیا ہے۔"
  tr: "Kairouan'daki Üç Kapı Camii (İbn Khayrun Camii) için ön kart, 866 yılında Muhammed bin Khayrun el-Ma'afiri tarafından oyma taş cephesiyle inşa edilen camidir; Afrika'nın en eski camilerinden biridir ve sayfası henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Tiga Gerbang (Masjid Ibn Khayrun) di Kairouan, masjid yang dibangun oleh Muhammad bin Khayrun al-Ma'afiri pada tahun 866 M dengan fasad batu ukirnya; salah satu masjid tertua di Afrika dan halamannya belum ditinjau."
