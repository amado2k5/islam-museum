summary:
  ar: "مسجد مجهول في أسكدار غالباً من مطلع عهد بايزيد الثاني؛ قاعة صلاة عريضة واطئة بثلاث قباب متساوية القطر يكاد يكون فريد المخطط في إسطنبول."
  en: "A little-known Üsküdar mosque probably from the very start of Beyazit II's reign; a wide shallow prayer hall under three equal-diameter domes — a plan perhaps unique in Istanbul."
  fr: "Mosquée peu connue d’Üsküdar, probablement du tout début du règne de Beyazit II ; salle de prière large et peu profonde sous trois coupoles de même diamètre, plan peut-être unique à Istanbul."
  es: "Una mezquita poco conocida en Üsküdar, probablemente del comienzo del reinado de Beyazit II; una amplia y poco profunda sala de oración bajo tres cúpulas de igual diámetro, un diseño quizás único en Estambul."
  ur: "ایک غیر معروف Üsküdar مسجد غالباً بیاضیت دوم کے دور کے آغاز سے ہی۔ تین مساوی قطر کے گنبدوں کے نیچے ایک وسیع اتلی عبادت گاہ — استنبول میں شاید منفرد منصوبہ۔"
  tr: "Üsküder'de, muhtemelen II. Bayezid'in erken dönemlerinden kalma bilinmeyen bir cami; neredeyse İstanbul'da benzersiz şekilde tasarlanmış, eşit çapta üç kubbeli geniş alçak bir ibadet salonu."
  id: "Sebuah masjid yang tidak dikenal di Üsküder, kemungkinan dari awal pemerintahan Bayezid II; sebuah aula shalat rendah yang lebar dengan tiga kubah berdiameter sama, hampir dirancang secara unik di Istanbul."
