summary:
  ar: "بطاقة أولية لمسجد الفازة، مسجد تاريخي في اليمن تنسبه المصادر إلى معاذ بن جبل، موثق في أطلس المساجد التاريخية في اليمن؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for Masjid al-Faza, a historic mosque in Yemen attributed by the sources to Mu'adh ibn Jabal, documented in the Yemen atlas of historic mosques; its sources are not yet checked on the page."
  fr: "Notice provisoire : Mosquée al-Faza, mosquée historique du Yémen attribuée par les sources à Mu’adh ibn Jabal, documentée dans l’atlas des mosquées historiques du Yémen. Ses sources ne sont pas encore vérifiées sur la page."
  es: "Ficha de borrador para Masjid al-Faza, una mezquita histórica en Yemen atribuida por las fuentes a Mu'adh ibn Jabal, documentada en el atlas de mezquitas históricas de Yemen; sus fuentes aún no han sido verificadas en la página."
  ur: "مسجد الفضہ کے لیے مسودہ کارڈ، یمن کی ایک تاریخی مسجد، جسے ذرائع نے معاذ بن جبل سے منسوب کیا ہے، تاریخی مساجد کے یمن اٹلس میں دستاویزی دستاویز؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Yemen'deki tarihi Camii El-Faza Camii'nin ön kartı, kaynaklar tarafından Muadh bin Jabal'a atfedilen, Yemen Tarihi Camiler Atlası'nda belgelenmiştir; sayfadaki kaynaklar henüz gözden geçirilmemiştir."
  id: "Kartu awal untuk Masjid Al-Faza, sebuah masjid bersejarah di Yaman yang oleh sumber dikaitkan dengan Muadh bin Jabal, didokumentasikan dalam Atlas Masjid Bersejarah di Yaman; sumbernya di halaman tersebut belum ditinjau."
