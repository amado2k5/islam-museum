summary:
  ar: "دير بالشام خاص بالمجانين؛ روى المبرد أنه دخله وسأل رهبانه عن مجنون طيّب الكلام يضحكهم منه فأومؤوا إلى إيوان مرتفع فأمسى مع متولي أمورهم ورأى مراتبهم على قدر بلاياهم؛ وذكره دعبل بن علي في هجائه أبا عباد كاتب المأمون {cite:umari-masalik-1924 p. 344}."
  en: "A Syrian monastery given over to the mad; al-Mubarrad told how he entered it asking its monks for a lunatic of pleasant speech to laugh with his companions over, and was shown a raised iwan where they were graded each to the measure of his affliction; Di'bil ibn Ali named it in satire of Abu Ubbad, al-Ma'mun's secretary {cite:umari-masalik-1924 p. 344}."
  fr: "Monastère syrien accueillant des personnes atteintes de troubles mentaux ; al-Mubarrad raconte y être entré en demandant aux moines un homme au parler plaisant pour en rire avec ses compagnons, puis avoir vu un iwan surélevé où chacun était classé selon son affection ; Di’bil ibn Ali le nomma dans une satire d’Abu Ubbad, secrétaire d’al-Mamun {cite:umari-masalik-1924 p. 344}."
  es: "Un monasterio sirio dedicado a los locos; al-Mubarrad contó cómo entró en él pidiendo a sus monjes un lunático de habla agradable para reírse con sus compañeros, y le mostraron un iwan elevado donde los clasificaban a cada uno según la medida de su aflicción; Di'bil ibn Ali lo nombró en sátira de Abu Ubbad, el secretario de al-Ma'mun {cite:umari-masalik-1924 p. 344}."
  ur: "شام کی ایک خانقاہ پاگلوں کے حوالے کر دی گئی۔ المبراد نے بتایا کہ وہ کس طرح اپنے راہبوں سے اپنے ساتھیوں کے ساتھ ہنسنے کے لئے خوشگوار تقریر کرنے کے لئے اس میں داخل ہوا، اور اسے ایک اٹھا ہوا آئیوان دکھایا گیا جہاں ہر ایک کو اس کی تکلیف کے پیمانے پر درجہ بندی کیا گیا تھا۔ دیبل ابن علی نے اس کا نام المامون کے سکریٹری ابو عباد کے طنزیہ انداز میں رکھا ہے۔ 344}۔"
  tr: "Şam'da bir manastır akıl hastalarına ayrılmıştır; el-Mübarrad oraya girdiğini ve keşişlerine, nazikçe konuşan ve onları güldüren bir deli hakkında soru sorduğunu anlatmıştır. Onları yüksek bir iwan'a götürdüler; burada akşamı bakıcılarıyla geçirdi ve onların sıralarını felaketlerine göre gördü. Da'bal ibn Ali, onu al-Ma'mun'un katibi Abu Abbad adlı hicvinde anmıştır {cite:umari-masalik-1924, s. 344}."
  id: "Sebuah biara di Damaskus disediakan untuk orang gila; Al-Mubarrad menceritakan bahwa ia masuk ke sana dan bertanya kepada para biksu tentang seorang gila yang berbicara dengan baik dan membuat mereka menertawakannya. Mereka dibawa ke sebuah high iwan, di mana ia menghabiskan malam bersama pengasuh mereka dan melihat barisan mereka sebanding dengan bencana yang dihadapi. Da'bal ibn Ali menyebutkannya dalam satire Abu Abbad, juru tulis al-Ma'mun {cite:umari-masalik-1924, hlm. 344}."
