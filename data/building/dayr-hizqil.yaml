  ar: "دير بالشام خاص بالمجانين؛ روى المبرد أنه دخله وسأل رهبانه عن مجنون طيّب الكلام يضحكهم منه فأومؤوا إلى إيوان مرتفع فأمسى مع متولي أمورهم ورأى مراتبهم على قدر بلاياهم؛ وذكره دعبل بن علي في هجائه أبا عباد كاتب المأمون {cite:umari-masalik-1924 p. 344}."
  en: "A Syrian monastery given over to the mad; al-Mubarrad told how he entered it asking its monks for a lunatic of pleasant speech to laugh with his companions over, and was shown a raised iwan where they were graded each to the measure of his affliction; Di'bil ibn Ali named it in satire of Abu Ubbad, al-Ma'mun's secretary {cite:umari-masalik-1924 p. 344}."
