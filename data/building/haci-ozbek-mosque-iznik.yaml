  ar: "بطاقة أولية لمسجد حاجي أوزبك بإزنيق، المسجد العثماني المؤرخ الأقدم الباقي إذ بُني سنة ١٣٣٤م تقريباً؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Hacı Özbek Mosque of İznik, built about 1334 and the oldest surviving dated Ottoman mosque; its sources are not yet checked on the page."
