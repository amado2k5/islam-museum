  es: "Ficha de borrador para la Mezquita Hacı Özbek de İznik, construida alrededor de 1334 y la mezquita otomana fechada más antigua que se conserva; sus fuentes aún no han sido verificadas en la página."
  ur: "İznik کی Hacı Özbek مسجد کے لیے ڈرافٹ کارڈ، جو تقریباً 1334 میں تعمیر کی گئی تھی اور قدیم ترین قدیم عثمانی مسجد؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "İznik'teki Hacı Özbek Camii için ön kart, yaklaşık 1334 yılında inşa edilen en eski Osmanlı camii; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu pendahuluan untuk Masjid Hacı Uzbekistan di İznik, masjid Ottoman tertua yang masih ada yang dibangun sekitar tahun 1334 M; sumber-sumbernya di halaman tersebut belum ditinjau."
