summary:
  ar: "آخر الجوامع الفاطمية الكبرى ⁦(1160م)⁩، بناه الوزير الصالح طلائع بن رزيك خارج باب زويلة على صف من الحوانيت، وتميزه سقيفة مفتوحة بخمسة عقود في واجهته {cite:yeomans-islamic-cairo-2006 p.63} {cite:yeomans-islamic-cairo-2006 p.67}."
  en: "The last great Fatimid mosque (1160), built by the vizier al-Salih Tala'i ibn Ruzzik outside Bab Zuwayla over a row of shops, unique for the open five-arched portico on its façade {cite:yeomans-islamic-cairo-2006 p.63} {cite:yeomans-islamic-cairo-2006 p.67}."
  fr: "Dernière grande mosquée fatimide (1160), bâtie par le vizir al-Salih Tala’i ibn Ruzzik hors de Bab Zuwayla sur des boutiques ; façade unique à portique ouvert de cinq arcs {cite:yeomans-islamic-cairo-2006 p.63} {cite:yeomans-islamic-cairo-2006 p.67}"
  es: "La última gran mezquita fatimí (1160), construida por el visir al-Salih Tala'i ibn Ruzzik en las afueras de Bab Zuwayla sobre una hilera de tiendas, única por el pórtico abierto de cinco arcos en su fachada {cite:yeomans-islamic-cairo-2006 p.63} {cite:yeomans-islamic-cairo-2006 p.67}."
  ur: "آخری عظیم فاطمی مسجد (1160)، جسے وزیر الصالح طلعی ابن رزق نے باب زوائلہ کے باہر دکانوں کی ایک قطار پر تعمیر کیا، جو اس کے اگلے حصے پر کھلے پانچ محراب والے پورٹیکو کے لیے منفرد ہے"
