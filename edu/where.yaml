rounds:
- id: kaaba
  question:
    ar: أقف في المدينة التي وُلد فيها النبي، ويتجه إليّ الناس في صلاتهم. من أكون؟
    en: I stand in the city where the Prophet was born, and people turn toward me when they pray. Who am I?
    ur: میں اس شہر میں کھڑا ہوں جہاں نبی پیدا ہوئے، اور لوگ نماز میں میری طرف رخ کرتے ہیں۔ میں کون ہوں؟
    fr: Je me trouve dans la ville natale du Prophète, et les fidèles se tournent vers moi pour prier. Qui suis-je ?
    tr: Peygamber'in doğduğu şehirde duruyorum ve halk dualarında bana dönüyor. Ben kimim?
    id: Aku berdiri di kota tempat Nabi lahir, dan orang-orang menoleh kepadaku dalam doa mereka. Siapa aku?
  options:
  - building/kaaba
  - building/dome-of-the-rock
  answer: building/kaaba
- id: prophets-mosque
  question:
    ar: بُنيتُ أول الأمر من الطين والنخيل، وفوق قبرٍ كريمٍ عندي قبّة خضراء. من أكون؟
    en: I was first built of mud bricks and palm trunks, and a green dome rises above a blessed resting place beside me. Who am I?
    ur: میں سب سے پہلے مٹی کی اینٹوں اور کھجور کے تنوں سے بنا، اور میرے پاس ایک بابرکت آرام گاہ کے اوپر سبز گنبد ہے۔ میں کون ہوں؟
    fr: J’ai d’abord été bâtie en briques de terre et en troncs de palmiers ; un dôme vert s’élève près de moi au-dessus d’un lieu de repos béni. Qui suis-je ?
    tr: İlk başta kil ve palmiye ağaçlarından yapılmıştı, Karim'in mezarının üstünde yeşil bir kubbe var. Ben kimim?
    id: Awalnya, bangunan itu dibangun dari tanah liat dan pohon palem, dan di atas makam Karim aku memiliki kubah hijau. Siapa aku?
  options:
  - building/prophets-mosque
  - building/al-aqsa-mosque
  answer: building/prophets-mosque
- id: great-mosque-cordoba
  question:
    ar: أقف في قرطبة وتحت سقفي غابة من أعمدة وعقود حمراء وبيضاء. من أكون؟
    en: I stand in Cordoba, and beneath my roof a forest of columns and red-and-white arches grows. Who am I?
    ur: میں قرطبہ میں کھڑا ہوں، اور میری چھت کے نیچے ستونوں اور سرخ و سفید محرابوں کا جنگل ہے۔ میں کون ہوں؟
    fr: Je suis à Cordoue ; sous mon toit s’étend une forêt de colonnes et d’arcs rouges et blancs. Qui suis-je ?
    tr: Córdoba'da duruyorum ve çatımın altında kırmızı ve beyaz sütunlar ile kemerlerden oluşan bir orman var. Ben kimim?
    id: Aku berdiri di Córdoba dan di bawah atapku ada hutan kolom dan lengkungan merah dan putih. Siapa aku?
  options:
  - building/great-mosque-cordoba
  - building/alhambra
  answer: building/great-mosque-cordoba
- id: alhambra
  question:
    ar: قصرٌ أنا فوق هضبة غرناطة، تجري في صحوري المياه وعلى جدراني شعرٌ منقوش. من أكون؟
    en: I am a palace above Granada where water runs through courtyards and poetry is carved into my walls. Who am I?
    ur: میں غرناطہ کی پہاڑی پر ایک محل ہوں جہاں صحنوں میں پانی بہتا ہے اور میری دیواروں پر شاعری کندہ ہے۔ میں کون ہوں؟
    fr: Je suis un palais qui domine Grenade ; l’eau traverse mes cours et des poèmes sont sculptés sur mes murs. Qui suis-je ?
    tr: Ben Granada platosundaki bir sarayım, çölümde su akıyor ve duvarlarımda yazılı saçlar var. Ben kimim?
    id: Aku adalah istana di dataran Granada, air mengalir di gurunku dan di dindingku ada tulisan rambut. Siapa aku?
  options:
  - building/alhambra
  - building/great-mosque-cordoba
  answer: building/alhambra
- id: baghdad
  question:
    ar: مدينةٌ مدوّرة أنا بُنيت على دجلة، وفِيَ دارُ الحكمة التي ترجمت علوم الدنيا. من أكون؟
    en: I am a round city built on the Tigris, and my House of Wisdom translated the learning of the world. Who am I?
    ur: میں دجلہ کے کنارے بسا ایک گول شہر ہوں، اور میرے دارالحکمت نے دنیا کے علوم کا ترجمہ کیا۔ میں کون ہوں؟
    fr: Je suis une ville ronde bâtie au bord du Tigre ; ma Maison de la sagesse a traduit les savoirs du monde. Qui suis-je ?
    tr: Dicle Nehri'nde, dünyevi bilimleri çeviren bilgelik evinde yuvarlak bir şehir inşa ettim. Ben kimim?
    id: Sebuah kota bundar Aku dibangun di atas Sungai Tigris, di rumah kebijaksanaan yang menerjemahkan ilmu duniawi. Siapa aku?
  options:
  - place/baghdad
  - place/cairo
  answer: place/baghdad
- id: timbuktu
  question:
    ar: أقف على حافة الصحراء الكبرى، وحُفظت عندي كتبٌ لا تُحصى في بيوت أهلها. من أكون؟
    en: I stand at the edge of the great desert, and countless books were kept safe in the houses of my people. Who am I?
    ur: میں عظیم صحرا کے کنارے کھڑا ہوں، اور میرے لوگوں کے گھروں میں بے شمار کتابیں محفوظ رہیں۔ میں کون ہوں؟
    fr: Je me trouve aux portes du grand désert ; d’innombrables livres ont été préservés dans les maisons de mes habitants. Qui suis-je ?
    tr: Sahra Çölü'nün kenarında duruyorum ve halkının evlerinde sayısız kitap sakladım. Ben kimim?
    id: Aku berdiri di tepi Gurun Sahara, dan aku telah menyimpan banyak buku di rumah-rumah penduduknya. Siapa aku?
  options:
  - place/timbuktu
  - place/fez
  answer: place/timbuktu
- id: bukhara
  question:
    ar: مدينةٌ قديمة على طريق الحرير، هدى مئذنتي العالية القوافلَ مئاتِ السنين. من أكون؟
    en: I am an old Silk Road city whose tall minaret guided caravans for hundreds of years. Who am I?
    ur: میں شاہراہِ ریشم کا پرانا شہر ہوں جس کا اونچا مینار صدیوں تک قافلوں کی رہنمائی کرتا رہا۔ میں کون ہوں؟
    fr: Je suis une ancienne ville de la route de la soie ; mon haut minaret a guidé les caravanes pendant des siècles. Qui suis-je ?
    tr: İpek Yolu üzerindeki antik bir şehir, yüzlerce yıldır uzun minare rehberliğinde kervanlarım vardı. Ben kimim?
    id: Kota kuno di Jalur Sutra, karavan menara tinggi saya yang mengawal selama ratusan tahun. Siapa aku?
  options:
  - place/bukhara
  - place/delhi
  answer: place/bukhara
- id: umayyad-mosque
  question:
    ar: أقف في قلب دمشق القديمة، وفي صحني مآذنُ وقبة النسر. من أكون؟
    en: I stand in the heart of old Damascus; my courtyard holds tall minarets and the Dome of the Eagle. Who am I?
    ur: میں پرانے دمشق کے دل میں کھڑا ہوں؛ میرے صحن میں اونچے مینار اور عقاب کا گنبد ہیں۔ میں کون ہوں؟
    fr: Je suis au cœur du vieux Damas ; de hauts minarets et le dôme de l’Aigle dominent ma cour. Qui suis-je ?
    tr: Eski Şam'ın kalbinde duruyorum ve tabağımda minareler ve Kartal Kubbesi var. Ben kimim?
    id: Aku berdiri di jantung Damaskus Lama, dan di piringku ada menara dan Kubah Elang. Siapa aku?
  options:
  - building/umayyad-mosque
  - building/suleymaniye-mosque
  answer: building/umayyad-mosque
- id: dome-of-the-rock
  question:
    ar: قبّة ذهبية أنا فوق صخرةٍ في القدس، تُرى من كل مكان في البلدة القديمة. من أكون؟
    en: I am a golden dome over a rock in Jerusalem, seen from everywhere in the Old City. Who am I?
    ur: میں یروشلم میں ایک چٹان کے اوپر سنہری گنبد ہوں، جو پرانے شہر کی ہر جگہ سے نظر آتا ہے۔ میں کون ہوں؟
    fr: Je suis un dôme doré au-dessus d’un rocher à Jérusalem, visible de partout dans la vieille ville. Qui suis-je ?
    tr: Kudüs'te bir kayanın üzerinde altın bir kubbeyim, Eski Şehir'in her yerinden görünür. Ben kimim?
    id: Sebuah kubah emas Aku di atas batu di Yerusalem, terlihat dari mana-mana di Kota Tua. Siapa aku?
  options:
  - building/dome-of-the-rock
  - building/al-aqsa-mosque
  answer: building/dome-of-the-rock
- id: suleymaniye
  question:
    ar: بناني سنان المعمار فوق تلٍّ في إسطنبول، ومن مآذني الأربع ترى البوسفور. من أكون؟
    en: Sinan the architect built me on a hill in Istanbul, and from my four minarets you can see the Bosphorus. Who am I?
    ur: مجھے معمار سنان نے استنبول کی ایک پہاڑی پر بنایا، اور میرے چار میناروں سے باسفورس نظر آتا ہے۔ میں کون ہوں؟
    fr: L’architecte Sinan m’a bâtie sur une colline d’Istanbul ; depuis mes quatre minarets, on aperçoit le Bosphore. Qui suis-je ?
    tr: İstanbul'da bir tepenin tepesine Sinan Al-Mamar tarafından inşa edilmiş ve dört minaremden Boğaz'ı görebiliyorsunuz. Ben kimim?
    id: Dibangun oleh Sinan Al-Mamar di puncak bukit di Istanbul, dan dari empat menara saya kamu bisa melihat Bosphorus. Siapa aku?
  options:
  - building/suleymaniye-mosque
  - building/blue-mosque
  answer: building/suleymaniye-mosque
- id: al-aqsa
  question:
    ar: أنا المسجد الذي صلّى فيه الناس نحو القبلة الأولى، في نهاية الحرم الشريف. من أكون؟
    en: I am the mosque where people prayed toward the first qibla, at the far end of the Noble Sanctuary. Who am I?
    ur: میں وہ مسجد ہوں جہاں لوگ پہلے قبلے کی طرف نماز پڑھتے تھے، حرمِ شریف کے کنارے۔ میں کون ہوں؟
    fr: Je suis la mosquée où l’on priait vers la première qibla, à l’extrémité du Noble Sanctuaire. Qui suis-je ?
    tr: Ben, insanların ilk kıbleye dönük olarak namaz kıldığı camiiyim, Asil Türbe'nin sonunda. Ben kimim?
    id: Aku adalah masjid tempat orang-orang berdoa menghadap qibla pertama, di ujung Tempat Suci Mulia. Siapa aku?
  options:
  - building/al-aqsa-mosque
  - building/dome-of-the-rock
  answer: building/al-aqsa-mosque
- id: eyup-sultan
  question:
    ar: على ضفاف القرن الذهبي أقف، واسمي من صاحبٍ كريم آوى النبي في المدينة. من أكون؟
    en: I stand by the Golden Horn, named after a kind Companion who hosted the Prophet in Medina. Who am I?
    ur: میں گولڈن ہورن کے کنارے کھڑا ہوں، اور میرا نام اس مہربان صحابی پر ہے جس نے مدینہ میں نبی کی میزبانی کی۔ میں کون ہوں؟
    fr: Je me trouve près de la Corne d’Or ; je porte le nom d’un compagnon bienveillant qui a accueilli le Prophète à Médine. Qui suis-je ?
    tr: Altın Boynuz'un kıyısında duruyorum ve adım, Medine'de Peygamber'i koruyan cömert sahibinden geliyor. Ben kimim?
    id: Di tepi Tanduk Emas aku berdiri, dan namaku berasal dari pemilik murah hati yang melindungi Nabi di Madinah. Siapa aku?
  options:
  - building/eyup-sultan-mosque
  - building/prophets-mosque
  answer: building/eyup-sultan-mosque
