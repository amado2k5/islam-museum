# The 100 records proposed for leveled reading in phase E2 (docs/delegation/education-master-plan.md §5 E2,
# founder's decision 5 in §9.1): the agent proposes, the founder approves or edits this list, and only then is
# any leveled text written. Nothing on the site reads this file until it is approved; the status below says so.
#
# Selection, in the order the plan gives (a record is listed once, under the first rule that picks it):
#   topic    the 50 taught topics of appendix B, anchored on the real record that carries the topic (the `topic`
#            number is the topic's position in appendix B, 1-50). Four topics have no anchor record and are
#            listed under `unanchored` below instead of being forced onto a weak record.
#   prophet  the five prophets of the Prophet Quest (kids/quest-stops.yaml).
#   era      the 20 Time Machine events (kids/eras.yaml `source` ids), those not already picked.
#   city     the cities of the trail catalogue (docs/plan/19-tour-learn.md, "Places and cities"), those not already
#            picked; Kuala Lumpur has no place record yet and is left out.
#   rank     inbound-link rank for the rest: edges in data/ plus [[links]] in prose, counted on 23 October 2026
#            over 35,810 records, restricted to the classes a child or teen can read as a page (person, event,
#            place, building, group, polity, period, concept, practice), excluding passages, sources and works
#            (the hadith books and suras hold the top of the raw rank), the hadith transmitters whose links are
#            isnad edges (al-Zuhri, Nafi', Urwa, Hisham ibn Urwa, Sa'id ibn al-Musayyab and their peers), the
#            fiqh-technical concepts the kids rulebook keeps out of the wing (talaq, kaffara, riba, tahara), and
#            figures whose record is mainly the first fitna (Mu'awiya), which docs/agents/kids-content.md §4 age-gates.
#
# Per record: `inbound` is the raw count above (demand evidence); `prose` lists the languages that already have a
# prose file; `brief` says whether content/ar/<class>/<slug>.md already has the museum's Brief section, whose
# heading is `## نبذة` (site/src/lib/entity.ts; the exhibit records use `## موجز`, which is also accepted). A record
# with brief: true already has a short adult text the Scholar level can be cut from; brief: false means the Scholar
# level is new text as well (the plan assumed about 60 of 100).
#
# Totals: 100 records (49 topic, 5 prophet, 16 era, 8 city, 22 rank); 94 already have a Brief; all 100 have prose in ar, en
# and ur. By class: 25 person, 19 event, 14 place, 11 concept, 8 building, 8 practice, 6 polity, 4 period, 2 language,
# 1 group, 1 object, 1 work.
