slug: umars-jerusalem-walk
title:
  ar: "مشي عمر إلى بيت المقدس"
  en: "Umar's Jerusalem Walk"
  ur: "عمر کی بیت المقدس واپسی"
lede:
  ar: "الخليفة يمشي إلى بيت المقدس ليأخذ مفاتيحها بنفسه — في اثنتي عشرة بطاقة."
  en: "The caliph walks to Jerusalem to take its keys himself — in twelve cards."
  ur: "خلیفہ بیت المقدس کی چابیاں خود لینے پیدل گیا — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/futuh-buldan-maarif-1407, source/kamil-ibn-al-athir]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "تاريخ الطبري؛ فتوح البلدان للبلاذري؛ البدایہ والنہایہ — إعادة صياغة بأمانة."
cards:
  - title: { ar: "الحصار", en: "The siege", ur: "محاصرہ" }
    motif: city
    narration:
      ar: "حاصر المسلمون إيلياء (بيت المقدس) وصارت في أيديهم إلا داخلها."
      en: "The Muslims besieged Iliya (Jerusalem), and all but its heart came under them."
      ur: "مسلمانوں نے ایلیاء (بیت المقدس) کا محاصرہ کیا اور سوائے شہر کے سب ہاتھ میں آیا۔"
  - title: { ar: "الشرط", en: "The condition", ur: "شرط" }
    motif: manuscript
    narration:
      ar: "قال البطارقة: نسلّم المدينة إذا جاء أمير المؤمنين بنفسه وأخذ المفاتيح."
      en: "The patriarchs said: we hand over the city only if the commander of the faithful comes himself for the keys."
      ur: "پادریاں نے کہا: شہر اسی وقت دیں گے جب امیر المومنین خود چابیاں لینے آئے۔"
  - title: { ar: "القرار", en: "The decision", ur: "فیصلہ" }
    motif: compass
    narration:
      ar: "خرج عمر من المدينة على ناقة، لا جيش معه ولا حرس، ليأخذ المفاتيح."
      en: "Umar set out from Madinah on a single mount — no army, no guard — to collect the keys."
      ur: "عمر مدینہ سے ایک سواری پر نکلے — نہ لشکر نہ محافظ — چابیاں لینے۔"
  - title: { ar: "العبدة والسيد", en: "Servant and master", ur: "نوکر اور آقا" }
    motif: camel
    narration:
      ar: "كان معه غلامه؛ تناوبا الركوب: ساعة يركب وساعة يقود."
      en: "His servant rode with him; they took turns — an hour he rode, an hour he led."
      ur: "اس کا غلام ساتھ تھا؛ باری باری سواری کرتے — ایک گھڑی سوار، ایک گھڑی قائد۔"
  - title: { ar: "الرداء", en: "The patched robe", ur: "پیوند والا جبہ" }
    motif: star
    narration:
      ar: "دخل بيت المقدس برداءٍ مرقّع فيه رقع كثيرة، ولم يبدل ثوبه."
      en: "He entered Jerusalem in a robe with many patches, and did not change his clothes."
      ur: "وہ کئی پیوند والے جبے میں بیت المقدس داخل ہوئے اور کپڑے نہ بدلے۔"
  - title: { ar: "الأمان", en: "The covenant", ur: "عہدنامہ" }
    motif: manuscript
    narration:
      ar: "كتب لأهلها الأمان العُمَري: حفظ أموالهم وكنائسهم وصلبانهم وسائر دينهم."
      en: "He wrote them the Umari Covenant: their wealth, churches, crosses and faith all protected."
      ur: "انہوں نے ان کے لیے عمری عہدنامہ لکھا: ان کا مال، گرجے، صلیبیں اور دین سب محفوظ۔"
  - title: { ar: "الكنيسة", en: "The church", ur: "گرجا" }
    motif: mosque
    narration:
      ar: "دخل كنيسة القيامة، فحانت الصلاة فخرج وصلى خارجها حتى لا يصلي المسلمون داخلها بعده."
      en: "He entered the Church of the Resurrection; when prayer came he prayed outside, so Muslims after him would not pray inside."
      ur: "وہ گرجۂ قیامت میں گئے؛ نماز کا وقت آیا تو باہر نماز پڑھی تاکہ بعد کے مسلمان اندر نہ پڑھیں۔"
  - title: { ar: "الصليب", en: "The cross", ur: "صلیب" }
    motif: tree
    narration:
      ar: "لم يهدم صليباً ولا هدم كنيسة؛ احترم ما وجد."
      en: "He broke no cross and razed no church; he respected what he found."
      ur: "کوئی صلیب نہیں توڑی اور کوئی گرجا نہیں گرایا؛ جو ملا اس کا احترام کیا۔"
  - title: { ar: "المسجد", en: "The mosque", ur: "مسجد" }
    motif: mosque
    narration:
      ar: "أمر ببناء مسجد في الموضع الذي صلى فيه، وكان البقعة التي أشار إليها."
      en: "He ordered a mosque built at the spot he prayed, where he had marked the ground."
      ur: "انہوں نے جہاں نماز پڑھی وہاں مسجد بنوانے کا حکم دیا۔"
  - title: { ar: "الصخرة", en: "The Rock", ur: "صخرہ" }
    motif: mountain
    narration:
      ar: "وجد مسجد قبة الصخرة مطموراً فرفع عنه ما كان عليه بيديه."
      en: "He found the Rock's shrine buried in refuse and cleared it with his own hands."
      ur: "انہوں نے صخرۃ کی جگہ کوڑے سے بھری پائی تو اپنے ہاتھوں سے صاف کی۔"
  - title: { ar: "المفتاح", en: "The keys", ur: "چابیاں" }
    motif: compass
    narration:
      ar: "تسلم مفاتيح المدينة من بطريركها صفرونيوس، ففتحت له أبوابها."
      en: "He took the city's keys from Patriarch Sophronius, and its gates opened to him."
      ur: "انہوں نے بشپ صوفرونیوس سے شہر کی چابیاں لیں اور اس کے دروازے کھل گئے۔"
  - title: { ar: "الرجوع", en: "The return", ur: "واپسی" }
    motif: caravan
    narration:
      ar: "رجع إلى المدينة كما خرج: على ناقة، ومعه غلامه يقود."
      en: "He returned to Madinah as he had come: on one mount, with his servant leading."
      ur: "وہ جس طرح آئے تھے اسی طرح مدینہ لوٹے: ایک سواری پر، غلام آگے چل رہا تھا۔"
