cards:
  - title: { ar: "البصرة", en: "Basra", ur: "بصرہ" }
    motif: city
    narration:
      ar: "الحسن بن الهيثم من البصرة، عاش في القرن الحادي عشر بين العراق ومصر."
      en: "Al-Hasan ibn al-Haytham of Basra lived in the eleventh century between Iraq and Egypt."
      ur: "حسن بن ہیشم بصرہ کا تھا، گیارہویں صدی میں عراق اور مصر کے درمیان رہا۔"
  - title: { ar: "النيل", en: "The Nile promise", ur: "وعدۂ نیل" }
    motif: sea
    narration:
      ar: "أوحى للخليفة الحاكم أنه سينظم فيضان النيل، فدعاه إلى مصر."
      en: "He told Caliph al-Hakim he could regulate the Nile's flood, and was summoned to Egypt."
      ur: "اس نے خلیفہ الحاکم کو کہا کہ وہ نیل کے سیلاب کو قابو کر سکتا ہے، تو بلایا گیا۔"
  - title: { ar: "الفشل", en: "The failure", ur: "ناکامی" }
    motif: mountain
    narration:
      ar: "رأى النيل فعرف أن المشروع لا يمكن، فادعى الجنون خوفاً من الخليفة."
      en: "Seeing the Nile he knew the project impossible, so he feigned madness, fearing the caliph."
      ur: "نیل دیکھ کر جانا کہ منصوبہ ممکن نہیں، تو خلیفہ کے خوف سے پاگل پن کا بہانہ کیا۔"
  - title: { ar: "الحجرة", en: "The dark room", ur: "تاریک کمرہ" }
    motif: cave
    narration:
      ar: "عاش عشر سنين في حجرة قرب الأزهر يكتب وينسخ ويجرب بالضوء."
      en: "He lived ten years in a room near al-Azhar, writing, copying and testing light."
      ur: "وہ دس برس الازہر کے قریب ایک کمرے میں رہا، لکھتا، نقل کرتا اور روشنی آزماتا۔"
  - title: { ar: "البيت المظلم", en: "The camera", ur: "قمرہ" }
    motif: book
    narration:
      ar: "بنى بيتاً مظلماً وفي جداره ثقب صغير، فرأى صورة الشارع مقلوبة على الجدار."
      en: "He built a dark chamber with a small hole and saw the street's image inverted on the wall."
      ur: "اس نے تاریک کمرہ بنایا جس کی دیوار میں چھوٹا سوراخ تھا، اور گلی کی الٹی تصویر دیوار پر دیکھی۔"
  - title: { ar: "الدليل", en: "The proof", ur: "ثبوت" }
    motif: star
    narration:
      ar: "أثبت أن الضوء يسير في خطوط مستقيمة من الشيء إلى العين."
      en: "He proved light travels in straight lines from the thing to the eye."
      ur: "اس نے ثابت کیا کہ روشنی سیدھی لکیروں میں چیز سے آنکھ تک جاتی ہے۔"
  - title: { ar: "القدماء", en: "The ancients wrong", ur: "قدماء کی غلطی" }
    motif: book
    narration:
      ar: "كان قدماء العلماء يقولون: العين ترسل أشعة إلى الأشياء — فصححهم."
      en: "The ancients said the eye sends rays to things — he corrected them."
      ur: "قدماء کہتے تھے: آنکھ شعاعیں بھیجتی ہے — اس نے ان کی اصلاح کی۔"
  - title: { ar: "المناظر", en: "The Optics", ur: "المناظر" }
    motif: book
    narration:
      ar: "كتب كتاب المناظر في سبعة أجزاء: تشريح العين وسير الضوء والانعكاس."
      en: "He wrote the Book of Optics in seven parts: the eye's anatomy, light's path, and reflection."
      ur: "اس نے سات جلدوں میں کتاب المناظر لکھی: آنکھ کی تشریح، روشنی کا راستہ اور انعکاس۔"
  - title: { ar: "التجربة", en: "The experiment", ur: "تجربہ" }
    motif: compass
    narration:
      ar: "قال: إذا أردت الحق فجرب بنفسك، لا تصدّق ما يقوله المشايخ."
      en: "He said: if you want the truth, test it yourself — don't take the masters' word."
      ur: "اس نے کہا: سچ چاہیے تو خود آزماؤ، استادوں کی بات پر یقین نہ کرو۔"
  - title: { ar: "الزجاج", en: "The glass", ur: "شیشہ" }
    motif: star
    narration:
      ar: "درس العدسات والمرايا وكتب في الكرة المضيئة والانكسار."
      en: "He studied lenses and mirrors and wrote on the burning sphere and refraction."
      ur: "اس نے عدسے اور آئینے پڑھے اور جلانے والے گولے اور انکسار پر لکھا۔"
  - title: { ar: "كاميرا", en: "The camera's father", ur: "کیمرے کا باپ" }
    motif: city
    narration:
      ar: "بيته المظلم هو مبدأ الكاميرا — من ثقب في الجدار جاءت الصورة."
      en: "His dark chamber is the camera's principle — from a wall's hole came the picture."
      ur: "اس کا تاریک کمرہ کیمرے کا اصول ہے — دیوار کے سوراخ سے تصویر آئی۔"
  - title: { ar: "العالم", en: "The scientist", ur: "سائنسدان" }
    motif: star
    narration:
      ar: "يعده العلماء أول من اتبع المنهج العلمي الحديث: شك، جرب، قس."
      en: "Scientists count him the first to follow the modern method: doubt, test, measure."
      ur: "سائنسدان اسے جدید علمی طریقہ کا پہلا پیروکار مانتے ہیں: شک، آزمائش، پیمائش۔"
