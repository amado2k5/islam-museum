slug: the-house-of-wisdom
title:
  ar: "بيت الحكمة"
  en: "The House of Wisdom"
  ur: "بیت الحکمت"
lede:
  ar: "في بغداد بُنيت أكبر مكتبة ومركز ترجمة في عصرها — في اثنتي عشرة بطاقة."
  en: "In Baghdad rose the greatest library and translation centre of its age — in twelve cards."
  ur: "بغداد میں اپنے عہد کی سب سے بڑی لائبریری اور مرکزِ ترجمہ بنا — بارہ کارڈز میں۔"
status: { review: published }
provenance:
  generated_by: "Devin"
