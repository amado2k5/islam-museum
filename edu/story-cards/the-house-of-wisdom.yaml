  run: "education-E5-story-cards"
  source: "تاريخ بغداد للخطيب البغدادي؛ كتب حركة الترجمة — إعادة صياغة بأمانة."
cards:
  - title: { ar: "هارون", en: "Harun", ur: "ہارون" }
    motif: city
    narration:
      ar: "بدأ بيت الحكمة في عصر هارون الرشيد خزانة كتب للدولة العباسية."
      en: "The House of Wisdom began under Harun al-Rashid as the Abbasid state's library."
      ur: "بیت الحکمت ہارون الرشید کے زمانے میں عباسی حکومت کی کتب خانہ بنا۔"
  - title: { ar: "المأمون", en: "Al-Ma'mun", ur: "المامون" }
    motif: star
    narration:
      ar: "في عهد المأمون صار أكبر مركز للعلم والترجمة في الدنيا."
      en: "Under al-Ma'mun it became the world's greatest centre of learning and translation."
      ur: "المامون کے زمانے میں یہ دنیا کا سب سے بڑا علم و ترجمہ مرکز بنا۔"
  - title: { ar: "الرؤيا", en: "The dream", ur: "خواب" }
    motif: moon
    narration:
      ar: "يُروى أن المأمون رأى شيخاً أرسطو في المنام فأقبل على الفلسفة."
      en: "It is told that al-Ma'mun saw Aristotle in a dream and turned to philosophy."
      ur: "کہا جاتا ہے کہ مامون نے خواب میں ارسطو دیکھا اور فلسفہ کی طرف مائل ہوا۔"
  - title: { ar: "الترجمة", en: "The translation", ur: "ترجمہ" }
    motif: book
    narration:
      ar: "أمر بترجمة كتب اليونان والفرس والهند إلى العربية."
      en: "He ordered the books of the Greeks, Persians and Indians translated into Arabic."
      ur: "انہوں نے یونانی، فارسی اور ہندوستانی کتابوں کا عربی میں ترجمہ کرایا۔"
  - title: { ar: "حنين", en: "Hunayn", ur: "حنین" }
    motif: pen
    narration:
      ar: "حنين بن إسحاق أعظم المترجمين: يقرأ اليونانية ويكتبها عربية بلا خطأ."
      en: "Hunayn ibn Ishaq was the greatest translator — he read Greek and wrote flawless Arabic."
      ur: "حنین بن اسحاق عظیم ترین مترجم تھے — یونانی پڑھتے اور بے خطا عربی لکھتے۔"
  - title: { ar: "الذهب", en: "The gold", ur: "سونہ" }
    motif: coin
    narration:
      ar: "يُروى أنه كان يعطى وزن الكتب ذهباً أجراً للترجمة."
      en: "It is told that he was paid the weight of his books in gold for translations."
      ur: "کہا جاتا ہے کہ ترجمہ کے عوض کتابوں کے وزن برابر سونہ دیا جاتا۔"
  - title: { ar: "القانون", en: "The Canon", ur: "قانون" }
    motif: manuscript
    narration:
      ar: "ترجم أعمال جالينوس وأبقراط وأرسطو، فصار الطب والفلسفة عربية."
      en: "He translated Galen, Hippocrates and Aristotle, so medicine and philosophy became Arabic."
      ur: "انہوں نے جالینوس، بقراط اور ارسطو ترجمہ کیے تو طب اور فلسفہ عربی ہو گئے۔"
  - title: { ar: "الفلك", en: "The stars", ur: "فلکیات" }
    motif: compass
    narration:
      ar: "في بيت الحكمة قيسوا السماوات ورصدوا النجوم وصنعوا الأسطرلابات."
      en: "In the House they measured the heavens, observed the stars and built astrolabes."
      ur: "بیت الحکمت میں آسمان ناپے گئے، ستارے دیکھے گئے اور اسطرلاب بنے۔"
  - title: { ar: "الزيج", en: "The tables", ur: "زیج" }
    motif: book
    narration:
      ar: "كتب الخوارزمي الزيج الأول العربي: جداول السماوات."
      en: "Al-Khwarizmi wrote the first Arabic zij — tables of the heavens."
      ur: "خوارزمی نے پہلا عربی زیج لکھا — آسمانوں کی جدول۔"
  - title: { ar: "الدار", en: "The open house", ur: "کھلا گھر" }
    motif: mosque
    narration:
      ar: "لم تكن مكتبة حكومية فقط؛ كانت دار علم لمن جاء يتعلم ويترجم."
      en: "It was not only a state library — it was a house of learning open to every scholar."
      ur: "یہ صرف سرکاری کتب خانہ نہ تھا بلکہ ہر طالبِ علم کے لیے کھلا مرکز تھا۔"
  - title: { ar: "النار", en: "The burning", ur: "آگ" }
    motif: mountain
    narration:
      ar: "في عام 1258م دخل هولاكو بغداد فألقيت الكتب في دجلة فسودّ الماء بالحبر."
      en: "In 1258 Hulagu took Baghdad; the books were thrown into the Tigris until its water ran black with ink."
      ur: "1258ء میں ہلاکو بغداد میں داخل ہوا؛ کتابیں دجلہ میں ڈالی گئیں یہاں تک پانی سیاہ ہو گیا۔"
  - title: { ar: "الإرث", en: "The legacy", ur: "میراث" }
    motif: star
    narration:
      ar: "بقي نتاجها: مئات الكتب ترجمت وحرّكت علوم أوروبا قروناً بعدها."
      en: "Its legacy remains: hundreds of translated books that moved Europe's sciences for centuries."
      ur: "اس کی میراث باقی ہے: سیکڑوں ترجمہ کتابیں جنہوں نے صدیوں یورپ کے علوم چلائے۔"
