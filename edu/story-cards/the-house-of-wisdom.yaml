title:
  ar: بيت الحكمة
  en: The House of Wisdom
  ur: بیت الحکمت
  fr: La Maison de la sagesse
  tr: Bilgelik Evi
  id: Rumah Kebijaksanaan
lede:
  ar: في بغداد بُنيت أكبر مكتبة ومركز ترجمة في عصرها — في اثنتي عشرة بطاقة.
  en: In Baghdad rose the greatest library and translation centre of its age — in twelve cards.
  ur: بغداد میں اپنے عہد کی سب سے بڑی لائبریری اور مرکزِ ترجمہ بنا — بارہ کارڈز میں۔
  fr: À Bagdad s’éleva la plus grande bibliothèque et le plus grand centre de traduction de son époque. Son histoire en douze cartes.
  tr: Bağdat'ta, dönemin en büyük kütüphanesi ve çeviri merkezi on iki kartta inşa edildi.
  id: Di Baghdad, perpustakaan dan pusat terjemahan terbesar pada masanya dibangun—dalam dua belas kartu.
