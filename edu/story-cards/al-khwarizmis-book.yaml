  - title: { ar: "المشكلة", en: "The problem", ur: "مسئلہ" }
    motif: manuscript
    narration:
      ar: "كان الناس يضيعون في مسائل المواريث والبيع؛ أراد حلاً يعمل للجميع."
      en: "People stumbled over inheritance and trade sums; he wanted a method for everyone."
      ur: "لوگ وراثت اور بیع کے حساب میں الجھتے تھے؛ وہ سب کے لیے طریقہ چاہتا تھا۔"
  - title: { ar: "الكتاب", en: "The book", ur: "کتاب" }
    motif: book
    narration:
      ar: "كتب رسالة صغيرة سماها: المختصر في حساب الجبر والمقابلة."
      en: "He wrote a small treatise called: The Compendious Book on Calculation by Completion and Balancing."
      ur: "اس نے چھوٹی رسالہ لکھی جس کا نام رکھا: الجبر اور مقابلہ کے حساب کی مختصر کتاب۔"
  - title: { ar: "الجبر", en: "Al-jabr", ur: "الجبر" }
    motif: pen
    narration:
      ar: "الجبر: إكمال النقص — تنقل الكمية الناقصة إلى الجانب الآخر لتكتمل المعادلة."
      en: "Al-jabr means completion: move the missing term across so the equation is whole."
      ur: "الجبر یعنی تکمیل: ناقص رکن دوسری طرف لے جاؤ تاکہ مساوات مکمل ہو۔"
  - title: { ar: "المقابلة", en: "Al-muqabala", ur: "المقابلہ" }
    motif: compass
    narration:
      ar: "المقابلة: الموازنة — تحذف المثل من الطرفين حتى تبقى المعادلة بسيطة."
      en: "Al-muqabala means balancing: subtract like terms from both sides until the equation is simple."
      ur: "مقابلہ یعنی توازن: دونوں طرف سے یکساں ارکان ہٹاؤ یہاں تک مساوات سادہ رہ جائے۔"
  - title: { ar: "المعادلات", en: "The equations", ur: "مساواتیں" }
    motif: book
    narration:
      ar: "جمع معادلات الدرجة الأولى والثانية وصنّفها وشرح حلها."
      en: "He gathered the first- and second-degree equations, classified them and solved them."
      ur: "اس نے پہلی اور دوسری درجہ کی مساواتیں جمع کیں، درجہ بندی کی اور حل سکھایا۔"
  - title: { ar: "الأعداد", en: "The digits", ur: "اعداد" }
    motif: coin
    narration:
      ar: "كتب كتاباً آخر في الحساب الهندي، فتعلّمت أوروبا منه الأرقام 0 إلى 9."
      en: "He wrote another book on Hindu reckoning, from which Europe learned the digits 0–9."
      ur: "اس نے ہندوستانی حساب پر ایک اور کتاب لکھی جس سے یورپ نے 0 تا 9 کے ہندسے سیکھے۔"
  - title: { ar: "اللوغاريتم", en: "The algorithm", ur: "الگورتھم" }
    motif: star
    narration:
      ar: "حُرّف اسمه في اللاتينية إلى Algorithmus — ومنه جاءت كلمة الخوارزمية."
      en: "His name was twisted in Latin to Algorithmus — the source of the word algorithm."
      ur: "اس کا نام لاطینی میں بگڑ کر Algorithmus بنا — اور اسی سے algorithm لفظ آیا۔"
  - title: { ar: "الحاسوب", en: "The computer", ur: "کمپیوٹر" }
    motif: compass
    narration:
      ar: "كل خطوة ينفذها حاسوب اليوم تسمى خوارزمية، باسمه."
      en: "Every step a computer follows today is called an algorithm — named for him."
      ur: "کمپیوٹر آج جو ہر قدم چلاتا ہے وہ algorithm کہلاتا ہے — اسی کے نام پر۔"
  - title: { ar: "الجغرافيا", en: "The geography", ur: "جغرافیہ" }
    motif: map
    narration:
      ar: "وصحّح خريطة بطليموس وكتب صورة الأرض في بيت الحكمة."
      en: "He corrected Ptolemy's map and wrote The Image of the Earth at the House of Wisdom."
      ur: "انہوں نے بطلیموس کے نقشے کی اصلاح کی اور بیت الحکمت میں صورت الارض لکھی۔"
  - title: { ar: "الإرث", en: "The legacy", ur: "میراث" }
    motif: book
    narration:
      ar: "من كتاب صغير في بغداد جاء الجبر الذي تدرّسه مدارس الدنيا."
      en: "From a small book in Baghdad came the algebra every school in the world now teaches."
      ur: "بغداد کی چھوٹی کتاب سے وہ الجبرا آیا جو آج دنیا کی ہر مدرسہ پڑھاتی ہے۔"
