  en: A small book from Baghdad that changed the world's arithmetic — the story of algebra in twelve cards.
  ur: بغداد کی ایک چھوٹی کتاب جس نے دنیا کا حساب بدل دیا — الجبرا کی کہانی بارہ کارڈز میں۔
  fr: 'Un petit livre de Bagdad qui a changé la façon de calculer dans le monde : l’histoire de l’algèbre en douze cartes.'
  tr: Bağdat'tan küçük bir kitap, dünya genelinde aritmetiği değiştirdi — On iki kartta cebirin hikayesi.
  id: Sebuah buku kecil dari Baghdad yang mengubah aritmatika di seluruh dunia — Kisah aljabar dalam dua belas kartu.
