slug: ibn-battutas-first-journey
title:
  ar: رحلة ابن بطوطة الأولى
  en: Ibn Battuta's First Journey
  ur: ابن بطوطہ کا پہلا سفر
  fr: Le premier voyage d’Ibn Battuta
  tr: İbn Battuta'nın İlk Yolculuğu
  id: Perjalanan Pertama Ibn Battuta
lede:
  ar: شابّ من طنجة خرج للحج فصار أعظم رحالة في التاريخ — في اثنتي عشرة بطاقة.
  en: A young man from Tangier left for the Hajj and became history's greatest traveller — in twelve cards.
  ur: طنجہ کا نوجوان حج کے لیے نکا اور تاریخ کا عظیم ترین سیاح بنا — بارہ کارڈز میں۔
  fr: En douze cartes, suis un jeune homme de Tanger parti pour le pèlerinage et devenu le plus grand voyageur de l’histoire.
  tr: Tanca'dan genç bir adam hac yolculuğuna çıktı ve on iki kartla tarihin en büyük gezgini oldu.
  id: Seorang pemuda dari Tangier melakukan ziarah dan menjadi pelancong terbesar dalam sejarah — dengan dua belas kartu.
