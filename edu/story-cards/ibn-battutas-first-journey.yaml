slug: ibn-battutas-first-journey
title:
  ar: "رحلة ابن بطوطة الأولى"
  en: "Ibn Battuta's First Journey"
  ur: "ابن بطوطہ کا پہلا سفر"
lede:
  ar: "شابّ من طنجة خرج للحج فصار أعظم رحالة في التاريخ — في اثنتي عشرة بطاقة."
  en: "A young man from Tangier left for the Hajj and became history's greatest traveller — in twelve cards."
  ur: "طنجہ کا نوجوان حج کے لیے نکا اور تاریخ کا عظیم ترین سیاح بنا — بارہ کارڈز میں۔"
status: { review: published }
provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "تحفة النظار في غرائب الأمصار وعجائب الأسفار (رحلة ابن بطوطة) — إعادة صياغة."
cards:
  - title: { ar: "طنجة", en: "Tangier", ur: "طنجہ" }
    motif: city
    narration:
      ar: "في طنجة بالمغرب ولد ابن بطوطة عام 1304م لأسرة قضاة بربرية."
      en: "Ibn Battuta was born in Tangier in 1304 CE to a Berber family of judges."
      ur: "ابن بطوطہ 1304ء میں طنجہ میں بربر قاضیوں کے گھرانے میں پیدا ہوا۔"
  - title: { ar: "النيّة", en: "The resolve", ur: "ارادہ" }
    motif: compass
    narration:
      ar: "في سن الحادية والعشرين عقد النية على الحج إلى مكة، فخرج وحده."
      en: "At twenty-one he resolved on the Hajj to Makkah, and set out alone."
      ur: "اکیس برس کی عمر میں اس نے حج کی نیت کی اور تن تنہا نکل پڑا۔"
  - title: { ar: "البر", en: "Overland", ur: "زمینی راستہ" }
    motif: caravan
    narration:
      ar: "سار براً عبر تلمسان وبجاية وقسنطينة إلى تونس."
      en: "He travelled overland through Tlemcen, Bejaia and Constantine to Tunis."
      ur: "وہ زمینی راستے سے تلمسان، بجایہ اور قسنطینہ ہوتے ہوئے تونس گیا۔"
  - title: { ar: "الزواج", en: "The wedding", ur: "شادی" }
    motif: tree
    narration:
      ar: "في تونس تزوج من ابنة قاضٍ، وبقي عند حميه شهرين."
      en: "In Tunis he married a judge's daughter and stayed two months with his in-laws."
      ur: "تونس میں اس نے قاضی کی بیٹی سے شادی کی اور سسرال میں دو مہینے رہا۔"
  - title: { ar: "طرابلس", en: "Tripoli", ur: "طرابلس" }
    motif: sea
    narration:
      ar: "انضم إلى قافلة إلى طرابلس ثم إلى برقة، ومعه عروسه."
      en: "He joined a caravan to Tripoli then Cyrenaica, his bride with him."
      ur: "وہ طرابلس پھر برقہ جانے والے قافلے میں شامل ہوا، دلہن ساتھ۔"
  - title: { ar: "الإسكندرية", en: "Alexandria", ur: "اسکندریہ" }
    motif: city
    narration:
      ar: "وصل إلى الإسكندرية فرأى منارها ونخيلها ومدارسها العريقة."
      en: "He reached Alexandria and saw its lighthouse, palms and ancient schools."
      ur: "وہ اسکندریہ پہنچا اور اس کا مینار، کھجوریں اور قدیم مدارس دیکھے۔"
  - title: { ar: "الشيخ", en: "The saint", ur: "ولی" }
    motif: star
    narration:
      ar: "زار شيخاً صالحاً قال له: إني لأرى عليك حب الأسفار."
      en: "He visited a saintly man who said: I see the love of travel upon you."
      ur: "ایک صالح شخص نے اس سے کہا: میں تم پر سفر کی محبت دیکھتا ہوں۔"
  - title: { ar: "القاهرة", en: "Cairo", ur: "قاہرہ" }
    motif: city
    narration:
      ar: "أعجبته القاهرة حتى قال: أمّ البلاد ومشرق الدنيا."
      en: "Cairo amazed him — he called it the mother of cities and the east of the world."
      ur: "قاہرہ اسے بہت بھایا — اس نے اسے ام البلاد اور دنیا کا مشرق کہا۔"
  - title: { ar: "النيل", en: "The Nile", ur: "دریائے نیل" }
    motif: sea
    narration:
      ar: "أبحر في النيل إلى صعيد مصر ثم عاد ليلحق بقافلة الحجاج."
      en: "He sailed the Nile into Upper Egypt, then returned to join the pilgrims' caravan."
      ur: "وہ نیل پر صعید مصر تک گیا پھر حجاج کے قافلے سے ملنے لوٹا۔"
  - title: { ar: "عيذاب", en: "Aydhab", ur: "عیداب" }
    motif: sea
    narration:
      ar: "حاول العبور من عيذاب إلى جدة ففشل، فرجع إلى القاهرة وغيّر الطريق."
      en: "He tried crossing from Aydhab to Jeddah and failed, so returned and changed route."
      ur: "اس نے عیداب سے جدہ جانا چاہا مگر نہ ہوا، تو لوٹا اور راستہ بدلا۔"
  - title: { ar: "دمشق والمدينة", en: "Damascus and Madinah", ur: "دمشق اور مدینہ" }
    motif: mosque
    narration:
      ar: "مر بدمشق فزار مقاماتها، ثم إلى المدينة فرأى الحرم النبوي."
      en: "He passed through Damascus visiting its shrines, then Madinah and the Prophet's sanctuary."
      ur: "وہ دمشق سے گزرا وہاں کے مقامات دیکھے، پھر مدینہ اور مسجدِ نبوی۔"
  - title: { ar: "مكة", en: "Makkah at last", ur: "مکہ آخرکار" }
    motif: mosque
    narration:
      ar: "دخل مكة حاجاً، ومن يومها لم تنتهِ أسفاره — ثلاثون سنة وسبعون ألف ميل."
      en: "He entered Makkah a pilgrim, and his travels never ended — thirty years and seventy-five thousand miles."
      ur: "وہ حاجی بن کر مکہ داخل ہوا، اور اس کے سفر ختم نہ ہوئے — تیس برس اور پچہتر ہزار میل۔"
