cards:
  - title: { ar: "قرطبة", en: "Cordoba", ur: "قرطبہ", fr: "Cordoue" }
    motif: city
    narration:
      ar: "أبو القاسم الزهراوي طبيب في قرطبة الأندلس في القرن العاشر."
      en: "Abu al-Qasim al-Zahrawi was a physician in tenth-century Cordoba."
      ur: "ابو القاسم الزہراوی دسویں صدی میں قرطبہ کا طبیب تھا۔"
      fr: "Abou al-Qasim al-Zahrawi était médecin à Cordoue au Xe siècle."
  - title: { ar: "طبيب الملك", en: "The king's doctor", ur: "بادشاہ کا حکیم", fr: "Le médecin du calife" }
    motif: star
    narration:
      ar: "كان طبيب الخليفة الأموي عبد الرحمن الناصر، أكبر أطباء عصره."
      en: "He was physician to the Umayyad caliph Abd al-Rahman al-Nasir, the greatest doctor of his age."
      ur: "وہ اموی خلیفہ عبدالرحمن الناصر کا حکیم تھا، اپنے زمانے کا سب سے بڑا طبیب۔"
      fr: "Médecin du calife omeyyade Abd al-Rahman al-Nasir, il était le plus grand médecin de son époque."
  - title: { ar: "التصريف", en: "Al-Tasrif", ur: "التصریف", fr: "Al-Tasrif" }
    motif: book
    narration:
      ar: "كتب موسوعة التصريف في ثلاثين مقالة، آخرها في الجراحة."
      en: "He wrote the thirty-part encyclopedia al-Tasrif, the last on surgery."
      ur: "اس نے تیس مقالوں کی موسوعہ التصریف لکھی، آخری مقالہ سرجری پر۔"
      fr: "Il rédigea une encyclopédie en trente parties, Al-Tasrif, dont la dernière porte sur la chirurgie."
  - title: { ar: "الرسومات", en: "The drawings", ur: "نقشے", fr: "Les dessins" }
    motif: manuscript
    narration:
      ar: "رسم في كتابه أكثر من مئتي أداة جراحية لم يكن أحد رسمها قبله."
      en: "He drew over two hundred surgical instruments no one had drawn before."
      ur: "اس نے دو سو سے زائد سرجری کے اوزار بنائے جو پہلے کسی نے نہیں بنائے۔"
      fr: "Il dessina plus de deux cents instruments chirurgicaux que personne n’avait représentés avant lui."
  - title: { ar: "المشرط", en: "The scalpel", ur: "مشرط", fr: "Le bistouri" }
    motif: pen
    narration:
      ar: "المشرط: سكين دقيق يفتح الجلد للعمليات — وصفه الزهراوي وأدخله الطب."
      en: "The scalpel: a fine blade to open the skin — al-Zahrawi described it for surgery."
      ur: "مشرط: باریک چاقو جو جلد کاٹتا ہے — زہراوی نے سرجری کے لیے اسے بیان کیا۔"
      fr: "Al-Zahrawi décrivit l’usage chirurgical du bistouri, une lame fine qui sert à inciser la peau."
  - title: { ar: "الملقط", en: "The forceps", ur: "ملقط", fr: "Les pinces" }
    motif: pen
    narration:
      ar: "الملقط: يمسك الأشياء الصغيرة داخل الجرح — من أدواته التي بقيت."
      en: "The forceps: grippers for small things inside a wound — one of his lasting tools."
      ur: "ملقط: زخم کے اندر چھوٹی چیزیں پکڑنے والا اوزار — اس کی باقی ماندہ ایجاد۔"
      fr: "Les pinces servent à saisir de petits objets dans une plaie. Elles font partie des instruments qui lui ont survécu."
  - title: { ar: "الخيوط", en: "The sutures", ur: "ٹانکے", fr: "Les sutures" }
    motif: book
    narration:
      ar: "أول من خيّط الجروح بخيوط أمعاء القطط — غرز تذوب في الجسم."
      en: "He was first to sew wounds with catgut — stitches that dissolve inside the body."
      ur: "وہ پہلا تھا جس نے زخم کٹ کے رگوں سے سئے — ٹانکے جو جسم میں گل جاتے ہیں۔"
      fr: "Il fut le premier à refermer des plaies avec du catgut, un fil de suture qui se résorbe dans le corps."
  - title: { ar: "الكي", en: "The cautery", ur: "داغ", fr: "La cautérisation" }
    motif: star
    narration:
      ar: "الكي بالنار يوقف النزيف ويعقم الجرح — فصلٌ كامل في كتابه."
      en: "Cautery stops bleeding and cleans the wound — a whole chapter in his book."
      ur: "داغ خون بند کرتا ہے اور زخم صاف کرتا ہے — اس کی کتاب کا مکمل باب۔"
      fr: "La cautérisation arrête le saignement et nettoie la plaie. Il lui consacra un chapitre entier."
  - title: { ar: "الحجر", en: "The stone", ur: "پتھر", fr: "Le calcul de la vessie" }
    motif: mountain
    narration:
      ar: "وصف استخراج حصاة المثانة بطريقة ظلت مرجعاً قروناً."
      en: "He described removing bladder stones in a way that stayed the reference for centuries."
      ur: "اس نے مثانے کی پتھر نکالنے کا طریقہ لکھا جو صدیوں مرجع رہا۔"
      fr: "Il décrivit une méthode pour retirer les calculs de la vessie qui resta une référence pendant des siècles."
  - title: { ar: "الولادة", en: "The childbirth", ur: "زچگی", fr: "L’accouchement" }
    motif: tree
    narration:
      ar: "علّم القابلات ووصف الولادات المتعسرة بأدق التفاصيل."
      en: "He taught midwives and described difficult births in fine detail."
      ur: "اس نے قابلاؤں کو سکھایا اور مشکل زچگی کی تفصیل بیان کی۔"
      fr: "Il forma des sages-femmes et décrivit avec précision les accouchements difficiles."
  - title: { ar: "أوروبا", en: "Europe", ur: "یورپ", fr: "L’Europe" }
    motif: sea
    narration:
      ar: "ترجم التصريف إلى اللاتينية فصار مرجع الجراحة في أوروبا خمسة قرون."
      en: "Al-Tasrif was translated to Latin and stayed Europe's surgery textbook for five centuries."
      ur: "التصریف لاطینی میں ترجمہ ہوئی اور پانچ صدیوں یورپ کی سرجری کی مرجع رہی۔"
      fr: "Traduit en latin, Al-Tasrif resta pendant cinq siècles un manuel de chirurgie en Europe."
  - title: { ar: "اليوم", en: "Today", ur: "آج", fr: "Aujourd’hui" }
    motif: book
    narration:
      ar: "تسميه كليات الجراحة أبا الجراحة الحديثة — أدواته ما زالت تُصنع."
      en: "Surgery schools call him the father of modern surgery — his tools are still made."
      ur: "سرجری کالج اسے جدید سرجری کا باپ کہتے ہیں — اس کے اوزار آج بھی بنتے ہیں۔"
      fr: "Dans les écoles de chirurgie, on le surnomme le père de la chirurgie moderne. Certains de ses instruments sont encore fabriqués."
