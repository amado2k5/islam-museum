  ur: قرطبہ کا سرجن جس نے دنیا کو سرجری سکھائی — اس کے اوزار بارہ کارڈز میں۔
  fr: Douze cartes sur les instruments du médecin de Cordoue qui a enseigné la chirurgie au monde.
  tr: Dünyaya cerrahi öğreten Cordoba'lı doktor — aletlerini on iki kartta tasvir etti.
  id: Dokter dari Cordoba yang mengajarkan bedah kepada dunia — ia menggambarkan instrumennya dalam dua belas kartu.
