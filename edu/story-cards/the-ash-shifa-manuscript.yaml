cards:
  - title: { ar: "بخارى", en: "Bukhara", ur: "بخارا" }
    motif: city
    narration:
      ar: "أبو علي ابن سينا وُلد في أفشنة قرب بخارى عام 980م."
      en: "Abu Ali ibn Sina was born in Afshana near Bukhara in 980 CE."
      ur: "ابو علی ابن سینا 980ء میں بخارا کے قریب افشنہ میں پیدا ہوا۔"
  - title: { ar: "الطفل", en: "The child", ur: "بچہ" }
    motif: star
    narration:
      ar: "حفظ القرآن وهو دون العاشرة، وقرأ المنطق والفقه والطب صغيراً."
      en: "He memorized the Qur'an before ten and read logic, fiqh and medicine young."
      ur: "دس سال سے کم عمر میں قرآن حفظ کیا اور چھوٹی عمر میں منطق، فقہ اور طب پڑھا۔"
  - title: { ar: "المكتبة", en: "The library", ur: "کتاب خانہ" }
    motif: book
    narration:
      ar: "شفى أمير بخارى ففتح له مكتبة السامانيين يقرأ فيها كما يشاء."
      en: "He cured Bukhara's emir, who opened the Samanid library for him to read at will."
      ur: "اس نے بخارا کے امیر کو شفا دی تو اس نے سامانیوں کا کتاب خانہ اس کے لیے کھول دیا۔"
  - title: { ar: "النار", en: "The fire", ur: "آگ" }
    motif: star
    narration:
      ar: "أحرقت المكتبة يوماً فحزن عليها، لكنه حفظ ما قرأ في صدره."
      en: "The library burned one day and he grieved, but he kept what he read in his chest."
      ur: "ایک دن کتاب خانہ جل گیا تو اسے افسوس ہوا، مگر پڑھا ہوا سینے میں محفوظ تھا۔"
  - title: { ar: "الرحلات", en: "The wanderings", ur: "سفریں" }
    motif: caravan
    narration:
      ar: "تنقل بين جرجان والري وهمدان وأصبهان، طبيباً ووزيراً."
      en: "He moved between Jurjan, Rayy, Hamadan and Isfahan — physician and minister."
      ur: "وہ جرجان، رے، ہمدان اور اصبہان کے درمیان رہا — طبیب اور وزیر۔"
  - title: { ar: "الكتاب", en: "The book", ur: "کتاب" }
    motif: book
    narration:
      ar: "شرع في كتاب الشفاء: موسوعة في المنطق والطبيعيات والرياضيات والإلهيات."
      en: "He began the Book of Healing — an encyclopedia of logic, physics, mathematics and metaphysics."
      ur: "اس نے کتاب الشفا شروع کی — منطق، طبیعیات، ریاضی اور الٰہیات کی موسوعہ۔"
  - title: { ar: "الليل", en: "The nights", ur: "راتیں" }
    motif: moon
    narration:
      ar: "كان يكتب في الليل؛ يقول تلميذه: كان لا ينام حتى ينتهي ما بين يديه."
      en: "He wrote at night; his student said he would not sleep until his task was done."
      ur: "وہ رات کو لکھتا تھا؛ اس کا شاگرد کہتا ہے کہ جب تک کام نہ ہو سوتا نہ تھا۔"
  - title: { ar: "الحجم", en: "The size", ur: "حجم" }
    motif: manuscript
    narration:
      ar: "الشفاء في ثمانية عشر مجلداً، من أضخم ما كتبه شخص واحد."
      en: "Ash-Shifa runs to eighteen volumes — among the largest works a single person wrote."
      ur: "الشفا اٹھارہ جلدوں میں ہے — ایک شخص کی لکھی ہوئی سب سے بڑی تصانیف میں۔"
  - title: { ar: "القانون", en: "The Canon", ur: "قانون" }
    motif: book
    narration:
      ar: "وقبله كتب القانون في الطب: مرجع الطب في الشرق والغرب قروناً."
      en: "Before it he wrote the Canon of Medicine — medicine's reference east and west for centuries."
      ur: "اس سے پہلے اس نے قانون الطب لکھی — صدیوں مشرق و مغرب کی مرجع۔"
  - title: { ar: "الحفظ", en: "The preservation", ur: "حفاظت" }
    motif: manuscript
    narration:
      ar: "نسخت مخطوطات الشفاء بأيدٍ كثيرة، وحفظتها مكتبات من قرطبة إلى قونية."
      en: "The manuscripts of Ash-Shifa were copied by many hands, kept from Cordoba to Konya."
      ur: "الشفا کے مخطوطے کئی ہاتھوں سے نقل ہوئے اور قرطبہ تا قونیہ محفوظ رہے۔"
  - title: { ar: "الترجمة", en: "The translation", ur: "ترجمہ" }
    motif: pen
    narration:
      ar: "ترجم إلى اللاتينية في قرطبة فدرسته مدارس أوروبا إلى القرن السابع عشر."
      en: "Translated to Latin at Cordoba, it was studied in Europe's schools into the seventeenth century."
      ur: "قرطبہ میں لاطینی ترجمہ ہوا اور سترہویں صدی تک یورپ کے مدارس نے پڑھا۔"
  - title: { ar: "الشيخ الرئيس", en: "The master", ur: "شیخ الرئیس" }
    motif: star
    narration:
      ar: "لقبوه الشيخ الرئيس؛ توفي في همدان عام 1037م وما زال كتابه يُقرأ."
      en: "They called him the Chief Master; he died in Hamadan in 1037 — his book is still read."
      ur: "انھیں شیخ الرئیس کہتے تھے؛ 1037ء میں ہمدان میں گزرے اور ان کی کتاب آج بھی پڑھی جاتی ہے۔"
