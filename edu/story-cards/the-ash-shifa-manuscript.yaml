cards:
- title:
    ar: بخارى
    en: Bukhara
    ur: بخارا
    fr: Boukhara
    tr: Buhari
    id: Bukhari
  motif: city
  narration:
    ar: أبو علي ابن سينا وُلد في أفشنة قرب بخارى عام 980م.
    en: Abu Ali ibn Sina was born in Afshana near Bukhara in 980 CE.
    ur: ابو علی ابن سینا 980ء میں بخارا کے قریب افشنہ میں پیدا ہوا۔
    fr: Abou Ali ibn Sina naquit en 980 à Afshana, près de Boukhara.
    tr: Ebu Ali İbn Sina, 980 yılında Buhara'ya yakın Afşana'da doğdu.
    id: Abu Ali Ibn Sina lahir di Afshana dekat Bukhara pada tahun 980 M.
- title:
    ar: الطفل
    en: The child
    ur: بچہ
    fr: L’enfant
    tr: Çocuk
    id: Anak itu
  motif: star
  narration:
    ar: حفظ القرآن وهو دون العاشرة، وقرأ المنطق والفقه والطب صغيراً.
    en: He memorized the Qur'an before ten and read logic, fiqh and medicine young.
    ur: دس سال سے کم عمر میں قرآن حفظ کیا اور چھوٹی عمر میں منطق، فقہ اور طب پڑھا۔
    fr: Avant dix ans, il connaissait le Coran par cœur. Très jeune, il étudia aussi la logique, le droit musulman et la médecine.
    tr: On yaşından önce Kur'an'ı ezberledi ve küçük yaşta mantık, fıkıh ve tıp eğitimi aldı.
    id: Ia menghafal Al-Qur'an sebelum usia sepuluh tahun, dan belajar logika, hukum, serta kedokteran sejak usia muda.
- title:
    ar: المكتبة
    en: The library
    ur: کتاب خانہ
    fr: La bibliothèque
    tr: Kütüphane
    id: Perpustakaan
  motif: book
  narration:
    ar: شفى أمير بخارى ففتح له مكتبة السامانيين يقرأ فيها كما يشاء.
    en: He cured Bukhara's emir, who opened the Samanid library for him to read at will.
    ur: اس نے بخارا کے امیر کو شفا دی تو اس نے سامانیوں کا کتاب خانہ اس کے لیے کھول دیا۔
    fr: Il guérit l’émir de Boukhara, qui lui ouvrit les portes de la bibliothèque des Samanides pour qu’il y lise à son gré.
    tr: Buhara Emiri iyileşti ve Samani kütüphanesi onun istediği gibi okuyabilmesi için açıldı.
    id: Emir Bukhara pulih, dan perpustakaan Samanid dibuka untuknya membaca sesuai keinginannya.
- title:
    ar: النار
    en: The fire
    ur: آگ
    fr: L’incendie
    tr: Ateş
    id: Kebakaran
  motif: star
  narration:
    ar: أحرقت المكتبة يوماً فحزن عليها، لكنه حفظ ما قرأ في صدره.
    en: The library burned one day and he grieved, but he kept what he read in his chest.
    ur: ایک دن کتاب خانہ جل گیا تو اسے افسوس ہوا، مگر پڑھا ہوا سینے میں محفوظ تھا۔
    fr: Un jour, la bibliothèque brûla. Il en fut très triste, mais il garda en mémoire ce qu’il y avait lu.
    tr: Bir gün kütüphane yandı ve bu onu üzüyordu ama okuduklarını kalbinde ezberledi.
    id: Suatu hari, perpustakaan itu terbakar, dan dia sedih karenanya, tapi dia menghafal apa yang telah dia baca di hatinya.
- title:
    ar: الرحلات
    en: The wanderings
    ur: سفریں
    fr: Les voyages
    tr: Geziler
    id: Perjalanan
  motif: caravan
  narration:
    ar: تنقل بين جرجان والري وهمدان وأصبهان، طبيباً ووزيراً.
    en: He moved between Jurjan, Rayy, Hamadan and Isfahan — physician and minister.
    ur: وہ جرجان، رے، ہمدان اور اصبہان کے درمیان رہا — طبیب اور وزیر۔
    fr: Il passa par Gorgan, Ray, Hamadan et Ispahan, exerçant les fonctions de médecin et de ministre.
    tr: Jurjan, Rayy, Hamdan ve İsfahan arasında doktor ve din adamı olarak hareket etti.
    id: Ia berpindah-pindah antara Jurjan, Rayy, Hamdan, dan Isfahan sebagai dokter dan pendeta.
- title:
    ar: الكتاب
    en: The book
    ur: کتاب
    fr: Le livre
    tr: Kitap
    id: Buku
  motif: book
  narration:
    ar: 'شرع في كتاب الشفاء: موسوعة في المنطق والطبيعيات والرياضيات والإلهيات.'
    en: He began the Book of Healing — an encyclopedia of logic, physics, mathematics and metaphysics.
    ur: اس نے کتاب الشفا شروع کی — منطق، طبیعیات، ریاضی اور الٰہیات کی موسوعہ۔
    fr: Il entreprit le Livre de la guérison, une encyclopédie de logique, de physique, de mathématiques et de métaphysique.
    tr: 'Al-Shifa: mantık, doğa bilimleri, matematik ve teoloji ansiklopedisi adlı kitabı yazmaya başladı.'
    id: 'Ia memulai buku Al-Shifa: ensiklopedia logika, ilmu alam, matematika, dan teologi.'
- title:
    ar: الليل
    en: The nights
    ur: راتیں
    fr: Les nuits
    tr: Gece
    id: Malam
  motif: moon
  narration:
    ar: 'كان يكتب في الليل؛ يقول تلميذه: كان لا ينام حتى ينتهي ما بين يديه.'
    en: He wrote at night; his student said he would not sleep until his task was done.
    ur: وہ رات کو لکھتا تھا؛ اس کا شاگرد کہتا ہے کہ جب تک کام نہ ہو سوتا نہ تھا۔
    fr: Il écrivait la nuit. D’après son élève, il ne se couchait pas avant d’avoir achevé son travail.
    tr: 'Geceleri yazardı; öğrencisi şöyle der: Önündekini bitirene kadar uyumazdı.'
    id: 'Dia biasa menulis di malam hari; muridnya berkata: Dia tidak akan tidur sampai menyelesaikan apa yang ada di depannya.'
- title:
    ar: الحجم
    en: The size
    ur: حجم
    fr: Les dix-huit volumes
    tr: Boyut
    id: Ukuran
  motif: manuscript
  narration:
    ar: الشفاء في ثمانية عشر مجلداً، من أضخم ما كتبه شخص واحد.
    en: Ash-Shifa runs to eighteen volumes — among the largest works a single person wrote.
    ur: الشفا اٹھارہ جلدوں میں ہے — ایک شخص کی لکھی ہوئی سب سے بڑی تصانیف میں۔
    fr: Al-Shifa compte dix-huit volumes. C’est l’une des œuvres les plus vastes écrites par une seule personne.
    tr: Şifa on sekiz ciltlik bir bölüm, tek bir kişi tarafından yazılmış en büyük eserlerden biridir.
    id: The Healing dalam delapan belas volume, salah satu karya terbesar yang ditulis oleh satu orang.
- title:
    ar: القانون
    en: The Canon
    ur: قانون
    fr: Le Canon
    tr: Hukuk
    id: Hukum
  motif: book
  narration:
    ar: 'وقبله كتب القانون في الطب: مرجع الطب في الشرق والغرب قروناً.'
    en: Before it he wrote the Canon of Medicine — medicine's reference east and west for centuries.
    ur: اس سے پہلے اس نے قانون الطب لکھی — صدیوں مشرق و مغرب کی مرجع۔
    fr: Auparavant, il avait écrit le Canon de la médecine, qui fit référence en Orient comme en Occident pendant des siècles.
    tr: Bundan önce, Doğu ve Batı'da yüzyıllardır tıbbın referansı olan Law in Medicine kitapları.
    id: 'Sebelumnya, buku-buku Hukum dalam Kedokteran: referensi untuk kedokteran di Timur dan Barat selama berabad-abad.'
- title:
    ar: الحفظ
    en: The preservation
    ur: حفاظت
    fr: Les copies
    tr: Koruma
    id: Konservasi
  motif: manuscript
  narration:
    ar: نسخت مخطوطات الشفاء بأيدٍ كثيرة، وحفظتها مكتبات من قرطبة إلى قونية.
    en: The manuscripts of Ash-Shifa were copied by many hands, kept from Cordoba to Konya.
    ur: الشفا کے مخطوطے کئی ہاتھوں سے نقل ہوئے اور قرطبہ تا قونیہ محفوظ رہے۔
    fr: Copiés par de nombreuses mains, les manuscrits d’Al-Shifa furent conservés de Cordoue à Konya.
    tr: Birçok şifa el yazması el yazısı kopyalanarak Cordoba'dan Konya'ya kadar kütüphanelerde korundu.
    id: Banyak manuskrip penyembuhan disalin secara manual dan disimpan di perpustakaan dari Cordoba hingga Konya.
- title:
    ar: الترجمة
    en: The translation
    ur: ترجمہ
    fr: La traduction
    tr: Çeviri
    id: Terjemahan
  motif: pen
  narration:
    ar: ترجم إلى اللاتينية في قرطبة فدرسته مدارس أوروبا إلى القرن السابع عشر.
    en: Translated to Latin at Cordoba, it was studied in Europe's schools into the seventeenth century.
    ur: قرطبہ میں لاطینی ترجمہ ہوا اور سترہویں صدی تک یورپ کے مدارس نے پڑھا۔
    fr: Traduit en latin à Cordoue, l’ouvrage fut étudié dans les écoles d’Europe jusqu’au XVIIe siècle.
    tr: Córdoba'da Latince'ye çevrildi ve on yedinci yüzyıla kadar Avrupa okullarında eğitim gördü.
    id: Ia diterjemahkan ke dalam bahasa Latin di Córdoba dan belajar di sekolah-sekolah Eropa hingga abad ketujuh belas.
- title:
    ar: الشيخ الرئيس
    en: The master
    ur: شیخ الرئیس
    fr: Le maître
    tr: Baş Şeyh
    id: Kepala Sheikh
  motif: star
  narration:
    ar: لقبوه الشيخ الرئيس؛ توفي في همدان عام 1037م وما زال كتابه يُقرأ.
    en: They called him the Chief Master; he died in Hamadan in 1037 — his book is still read.
    ur: انھیں شیخ الرئیس کہتے تھے؛ 1037ء میں ہمدان میں گزرے اور ان کی کتاب آج بھی پڑھی جاتی ہے۔
    fr: On l’appelait le Maître par excellence. Il mourut à Hamadan en 1037, et son livre est encore lu aujourd’hui.
    tr: Adı Şeyh al-Ra'is idi; 1037 yılında Hamdan'da öldü ve kitabı hâlâ okunmaktadır.
    id: Ia bergelar Sheikh al-Ra'is; ia meninggal di Hamdan pada tahun 1037 M, dan bukunya masih dibaca hingga kini.
