cards:
- title:
    ar: الملك والساحر
    en: The king and the sorcerer
    ur: بادشاہ اور جادوگر
    fr: Le roi et le magicien
    tr: Kral ve Büyücü
    id: Raja dan Penyihir
  motif: city
  narration:
    ar: كان لملكٍ ساحرٌ يعلّمه الناس، فلما كبر طلب غلاماً ذكياً يتعلم السحر.
    en: A king had a sorcerer teaching the people; when he aged, he asked for a clever boy to learn his craft.
    ur: ایک بادشاہ کا جادوگر لوگوں کو سکھاتا تھا؛ بڑھا ہوا تو اس نے ہوشیار لڑکا مانگا۔
    fr: Un roi avait un magicien. En vieillissant, celui-ci demanda qu’on lui confie un garçon vif d’esprit pour lui transmettre son art.
    tr: İnsanlara ders veren bir büyücü kralı vardı ve büyüyünce sihir öğrenmesi için zeki bir çocuk istedi.
    id: Dia memiliki raja penyihir yang mengajar orang, dan ketika dewasa, dia meminta seorang anak pintar untuk belajar sihir.
- title:
    ar: الغلام
    en: The boy
    ur: لڑکا
    fr: Le garçon
    tr: Çocuk
    id: Anak laki-laki itu
  motif: star
  narration:
    ar: اختير غلامٌ لقيطٌ فذهب يتعلم عند الساحر، وفي طريقه راهب.
    en: A bright boy was chosen and sent to learn from the sorcerer, passing a monk on the way.
    ur: ایک ذہین لڑکا چنا گیا اور جادوگر کے پاس سیکھنے بھیجا، راستے میں راہب ملا۔
    fr: On choisit un garçon abandonné et on l’envoya apprendre auprès du magicien. En chemin, il rencontra un moine.
    tr: Bir gayrimeşru çocuk seçildi ve bir büyücüden öğrenmeye gitti, yolunda bir keşiş vardı.
    id: Seorang dipilih dan pergi belajar dari seorang penyihir, dan dalam perjalanannya dia menjadi seorang biksu.
- title:
    ar: الراهب
    en: The monk
    ur: راہب
    fr: Le moine
    tr: keşiş
    id: biksu
  motif: cave
  narration:
    ar: سمع الغلام كلام الراهب فأعجبه، وصار يقف عنده في طريقه ذهاباً وإياباً.
    en: The boy heard the monk's words and loved them, stopping with him going and coming.
    ur: لڑکے نے راہب کی باتیں سنیں تو پسند آئیں، اور وہ آتے جاتے اس کے پاس رکتا۔
    fr: Le garçon aima les paroles du moine et s’arrêta désormais chez lui à l’aller comme au retour.
    tr: Çocuk keşişin sözlerini duydu, etkilendi ve gidip gelirken yanına uğradı.
    id: Anak itu mendengar kata-kata biksu itu, terkesan, dan ia berhenti di dekat biksu itu dalam perjalanan bolak-balik.
- title:
    ar: الكلمات
    en: The words
    ur: الفاظ
    fr: Les paroles
    tr: Anahtar Kelimeler
    id: Kata kunci
  motif: book
  narration:
    ar: 'علّمه الراهب أن الله واحد لا شريك له، وأن يقول: يا الله.'
    en: 'The monk taught him that God is one without partner, and taught him to say: O God.'
    ur: 'راہب نے سکھایا کہ اللہ ایک ہے بےشریک، اور کہنا سکھایا: اے اللہ۔'
    fr: Le moine lui apprit que Dieu est unique et sans associé, et lui enseigna à l’invoquer.
    tr: 'Keşiş ona Tanrı''nın ortağı olmayan bir olduğunu ve şöyle demesini öğretti: Ey Tanrı.'
    id: 'Biarawan itu mengajarinya bahwa Tuhan itu satu tanpa pasangan, dan berkata: Ya Tuhan.'
- title:
    ar: الدابة
    en: The beast
    ur: جانور
    fr: La bête
    tr: Canavar
    id: Sang Binatang
  motif: camel
  narration:
    ar: اعترضت دابة عظيمة طريق الناس، فرفع الغلام حجراً ودعا الله فأصابها.
    en: A great beast blocked the people's road; the boy raised a stone, prayed, and it fell.
    ur: ایک بڑا جانور لوگوں کی راہ روکے تھا؛ لڑکے نے پتھر اٹھایا، دعا کی اور وہ گر گیا۔
    fr: Une énorme bête bloqua la route. Le garçon pria Dieu et lança une pierre qui atteignit la bête.
    tr: Büyük bir yaratık halkın yolunu kesti, bu yüzden çocuk bir taş kaldırıp Tanrı'ya dua etti ama taş ona çarptı.
    id: Seekor binatang besar menghalangi jalan orang-orang, jadi anak itu mengangkat sebuah batu dan berdoa kepada Tuhan, tapi batu itu menabraknya.
- title:
    ar: الشفاء
    en: The healing
    ur: شفا
    fr: Les guérisons
    tr: İyileşme
    id: Penyembuhan
  motif: tree
  narration:
    ar: 'صار يشفي الأكمه والأبرص بإذن الله، وقال: ربي يشفي، لا أشفي أنا.'
    en: 'He began healing the blind and the leper by God''s leave, saying: my Lord heals, not I.'
    ur: 'وہ اللہ کے اذن سے اندھوں اور کوڑھیوں کو شفا دینے لگا، اور کہتا: میرا رب شفا دیتا ہے، میں نہیں۔'
    fr: Avec la permission de Dieu, il se mit à guérir des personnes aveugles ou atteintes de la lèpre. Il disait que c’était son Seigneur qui guérissait, et non lui.
    tr: 'İnşallah körleri ve cüzamlıları iyileştirmeye başladı ve dedi ki: Tanrı beni iyileştirsin; kendimi iyileştirmeyeceğim.'
    id: 'Dia mulai menyembuhkan orang buta dan kusta, insya Allah, dan berkata: Semoga Allah menyembuhkan aku; aku tidak akan menyembuhkan diriku sendiri.'
- title:
    ar: الخبر يصل
    en: Word reaches the king
    ur: خبر بادشاہ تک
    fr: La nouvelle parvient au roi
    tr: Haber geliyor
    id: Berita itu tiba
  motif: city
  narration:
    ar: سمع الملك، فأمسك بالراهب فآمن الناس بما كان عليه، وأُخذ الغلام.
    en: The king heard, seized the monk, and the people believed; then the boy was taken.
    ur: بادشاہ نے سنا تو راہب کو پکڑا، لوگ اس پر ایمان لائے، اور لڑکا بھی پکڑا گیا۔
    fr: Le roi apprit ce qui se passait et fit arrêter le moine. Des gens adoptèrent sa foi, puis le garçon fut emmené à son tour.
    tr: Kral bunu duydu, keşişi yakaladı, halk onun ne olduğuna inandı ve çocuğu aldı.
    id: Raja mendengarnya, lalu ia menangkap biksu itu, dan rakyat percaya pada siapa dia, lalu mengambil anak itu.
- title:
    ar: أعلى الجبل
    en: On the mountain top
    ur: پہاڑ کی چوٹی
    fr: Au sommet de la montagne
    tr: dağ zirvesi
    id: puncak gunung
  motif: mountain
  narration:
    ar: أتوا به إلى أعلى الجبل ليرجع عن دينه، فأبى؛ فأنزل من الجبل سالمًا بإذن الله.
    en: They carried him to the mountain top to turn him back; he refused, and came down safe by God's leave.
    ur: اسے دین سے پھیرنے پہاڑ کی چوٹی پر لے گئے؛ اس نے انکار کیا اور اللہ کے اذن سے سلامت اترا۔
    fr: On l’emmena au sommet d’une montagne pour lui faire renier sa foi. Il refusa et, avec la permission de Dieu, redescendit sain et sauf.
    tr: Onu dağın zirvesine götürdüler ki dininden vazgeçsin, ama o reddetti; böylece Allah'ın izniyle, dağdan sağ salim indi.
    id: Mereka membawanya ke puncak gunung untuk berpaling dari agamanya, tetapi dia menolak; maka dia turun dari gunung dengan selamat, dengan izin Tuhan.
- title:
    ar: في البحر
    en: Into the sea
    ur: سمندر میں
    fr: Au large
    tr: Denizde
    id: Di laut
  motif: sea
  narration:
    ar: ثم حملوه في سفينة إلى وسط البحر، فدعا الله فنجّاه وأخذ البحر مطارديه.
    en: Then they took him to mid-sea; he prayed, God saved him, and the sea took his pursuers.
    ur: پھر انہوں نے اسے کشتی میں وسط سمندر لے گئے؛ اس نے دعا کی، اللہ نے بچایا اور سمندر نے تعاقب کرنے والوں کو لے لیا۔
    fr: Puis on l’emmena en bateau au large. Il pria Dieu, qui le sauva, tandis que la mer engloutit ceux qui le poursuivaient.
    tr: Sonra onu bir gemiyle denizin ortasına taşıdılar, o da Tanrı'ya dua etti, onu kurtardı ve deniz peşindekileri aldı.
    id: Kemudian mereka membawanya dengan kapal ke tengah laut, sehingga dia berdoa kepada Tuhan, menyelamatkannya, dan laut itu membawa para pengejarnya.
- title:
    ar: السر
    en: The secret
    ur: راز
    fr: Le secret
    tr: Sır
    id: Rahasianya
  motif: book
  narration:
    ar: 'عاد إلى الملك وقال: لا تستطيع قتلي حتى تفعل ما آمرك به — وعلّمه الطريقة.'
    en: 'He returned and told the king: you cannot end me unless you do as I say — and told him how.'
    ur: 'وہ بادشاہ کے پاس آیا اور کہا: تم مجھے نہیں مار سکتے جب تک جو کہوں نہ کرو — اور طریقہ بتا دیا۔'
    fr: De retour auprès du roi, le garçon lui dit qu’il ne pourrait le tuer qu’en suivant ses instructions, et les lui donna.
    tr: 'Kralın yanına döndü ve dedi ki: Beni öldüremezsin, sana emrettiğimi yapmadan önce — ve ona yolu öğretti.'
    id: 'Ia kembali kepada raja dan berkata: Kau tidak bisa membunuhku sampai kau melakukan apa yang kuperintahkan—dan ia mengajarinya jalan.'
- title:
    ar: النشابة
    en: The arrow
    ur: تیر
    fr: La flèche
    tr: haddehane
    id: pabrik penggilingan
  motif: compass
  narration:
    ar: 'جمع الناس، وأخذ نشابة من كنانة الغلام وقال: باسم الله رب الغلام.'
    en: 'He gathered the people, took an arrow from the boy''s quiver and said: in the name of the boy''s Lord.'
    ur: 'لوگ جمع ہوئے، اس نے لڑکے کے ترکش سے تیر لیا اور کہا: لڑکے کے رب کے نام سے۔'
    fr: Le roi rassembla le peuple, prit une flèche dans le carquois du garçon et invoqua le nom de Dieu, le Seigneur du garçon.
    tr: 'Halkı topladı, çocuğun bastonundan bir nefes aldı ve dedi ki: Çocuğun Rabbi Tanrı''nın adıyla.'
    id: 'Ia mengumpulkan orang-orang, mengisap tongkat anak itu, dan berkata: Dalam nama Tuhan, Tuhan anak itu.'
- title:
    ar: الإيمان
    en: The faith
    ur: ایمان
    fr: La foi
    tr: İnanç
    id: Iman
  motif: star
  narration:
    ar: 'أصابت النشابة الغلام فلقي ربه، وقال الناس: آمنا برب الغلام.'
    en: 'The arrow found the boy and he fell to his Lord, and the people said: we believe in the boy''s Lord.'
    ur: 'تیر لڑکے کو لگا اور وہ اپنے رب سے جا ملا، اور لوگوں نے کہا: ہم لڑکے کے رب پر ایمان لائے۔'
    fr: Le garçon fut atteint par la flèche et mourut. Les gens déclarèrent alors qu’ils croyaient au Seigneur du garçon.
    tr: 'Mızrak çocuğa isabet etti, böylece Rab''biyle karşılaştı ve halk dedi ki: Çocuğun Rabbine inanıyoruz.'
    id: 'Tombak itu mengenai anak itu, sehingga ia bertemu dengan Tuannya, dan orang-orang berkata: Kami percaya kepada Tuhan anak itu.'
