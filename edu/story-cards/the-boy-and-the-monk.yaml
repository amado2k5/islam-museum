slug: the-boy-and-the-monk
title:
  ar: "الغلام والراهب"
  en: "The Boy and the Monk"
  ur: "لڑکا اور راہب"
lede:
  ar: "غلام آمن بالله فعلّم الناس التوحيد حتى آمن به قوم كثير — في اثنتي عشرة بطاقة."
  en: "A boy who believed in God and taught his people tawhid — told in twelve cards."
  ur: "ایک لڑکا جس نے اللہ پر ایمان لایا اور اپنے لوگوں کو توحید سکھائی — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/sahih-muslim]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "صحيح مسلم، حديث الأخدود؛ تفسير سورة البروج — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "الملك والساحر", en: "The king and the sorcerer", ur: "بادشاہ اور جادوگر" }
    motif: city
    narration:
      ar: "كان لملكٍ ساحرٌ يعلّمه الناس، فلما كبر طلب غلاماً ذكياً يتعلم السحر."
      en: "A king had a sorcerer teaching the people; when he aged, he asked for a clever boy to learn his craft."
      ur: "ایک بادشاہ کا جادوگر لوگوں کو سکھاتا تھا؛ بڑھا ہوا تو اس نے ہوشیار لڑکا مانگا۔"
  - title: { ar: "الغلام", en: "The boy", ur: "لڑکا" }
    motif: star
    narration:
      ar: "اختير غلامٌ لقيطٌ فذهب يتعلم عند الساحر، وفي طريقه راهب."
      en: "A bright boy was chosen and sent to learn from the sorcerer, passing a monk on the way."
      ur: "ایک ذہین لڑکا چنا گیا اور جادوگر کے پاس سیکھنے بھیجا، راستے میں راہب ملا۔"
  - title: { ar: "الراهب", en: "The monk", ur: "راہب" }
    motif: cave
    narration:
      ar: "سمع الغلام كلام الراهب فأعجبه، وصار يقف عنده في طريقه ذهاباً وإياباً."
      en: "The boy heard the monk's words and loved them, stopping with him going and coming."
      ur: "لڑکے نے راہب کی باتیں سنیں تو پسند آئیں، اور وہ آتے جاتے اس کے پاس رکتا۔"
  - title: { ar: "الكلمات", en: "The words", ur: "الفاظ" }
    motif: book
    narration:
      ar: "علّمه الراهب أن الله واحد لا شريك له، وأن يقول: يا الله."
      en: "The monk taught him that God is one without partner, and taught him to say: O God."
      ur: "راہب نے سکھایا کہ اللہ ایک ہے بےشریک، اور کہنا سکھایا: اے اللہ۔"
  - title: { ar: "الدابة", en: "The beast", ur: "جانور" }
    motif: camel
    narration:
      ar: "اعترضت دابة عظيمة طريق الناس، فرفع الغلام حجراً ودعا الله فأصابها."
      en: "A great beast blocked the people's road; the boy raised a stone, prayed, and it fell."
      ur: "ایک بڑا جانور لوگوں کی راہ روکے تھا؛ لڑکے نے پتھر اٹھایا، دعا کی اور وہ گر گیا۔"
  - title: { ar: "الشفاء", en: "The healing", ur: "شفا" }
    motif: tree
    narration:
      ar: "صار يشفي الأكمه والأبرص بإذن الله، وقال: ربي يشفي، لا أشفي أنا."
      en: "He began healing the blind and the leper by God's leave, saying: my Lord heals, not I."
      ur: "وہ اللہ کے اذن سے اندھوں اور کوڑھیوں کو شفا دینے لگا، اور کہتا: میرا رب شفا دیتا ہے، میں نہیں۔"
  - title: { ar: "الخبر يصل", en: "Word reaches the king", ur: "خبر بادشاہ تک" }
    motif: city
    narration:
      ar: "سمع الملك، فأمسك بالراهب فآمن الناس بما كان عليه، وأُخذ الغلام."
      en: "The king heard, seized the monk, and the people believed; then the boy was taken."
      ur: "بادشاہ نے سنا تو راہب کو پکڑا، لوگ اس پر ایمان لائے، اور لڑکا بھی پکڑا گیا۔"
  - title: { ar: "أعلى الجبل", en: "On the mountain top", ur: "پہاڑ کی چوٹی" }
    motif: mountain
    narration:
      ar: "أتوا به إلى أعلى الجبل ليرجع عن دينه، فأبى؛ فأنزل من الجبل سالمًا بإذن الله."
      en: "They carried him to the mountain top to turn him back; he refused, and came down safe by God's leave."
      ur: "اسے دین سے پھیرنے پہاڑ کی چوٹی پر لے گئے؛ اس نے انکار کیا اور اللہ کے اذن سے سلامت اترا۔"
  - title: { ar: "في البحر", en: "Into the sea", ur: "سمندر میں" }
    motif: sea
    narration:
      ar: "ثم حملوه في سفينة إلى وسط البحر، فدعا الله فنجّاه وأخذ البحر مطارديه."
      en: "Then they took him to mid-sea; he prayed, God saved him, and the sea took his pursuers."
      ur: "پھر انہوں نے اسے کشتی میں وسط سمندر لے گئے؛ اس نے دعا کی، اللہ نے بچایا اور سمندر نے تعاقب کرنے والوں کو لے لیا۔"
  - title: { ar: "السر", en: "The secret", ur: "راز" }
    motif: book
    narration:
      ar: "عاد إلى الملك وقال: لا تستطيع قتلي حتى تفعل ما آمرك به — وعلّمه الطريقة."
      en: "He returned and told the king: you cannot end me unless you do as I say — and told him how."
      ur: "وہ بادشاہ کے پاس آیا اور کہا: تم مجھے نہیں مار سکتے جب تک جو کہوں نہ کرو — اور طریقہ بتا دیا۔"
  - title: { ar: "النشابة", en: "The arrow", ur: "تیر" }
    motif: compass
    narration:
      ar: "جمع الناس، وأخذ نشابة من كنانة الغلام وقال: باسم الله رب الغلام."
      en: "He gathered the people, took an arrow from the boy's quiver and said: in the name of the boy's Lord."
      ur: "لوگ جمع ہوئے، اس نے لڑکے کے ترکش سے تیر لیا اور کہا: لڑکے کے رب کے نام سے۔"
  - title: { ar: "الإيمان", en: "The faith", ur: "ایمان" }
    motif: star
    narration:
      ar: "أصابت النشابة الغلام فلقي ربه، وقال الناس: آمنا برب الغلام."
      en: "The arrow found the boy and he fell to his Lord, and the people said: we believe in the boy's Lord."
      ur: "تیر لڑکے کو لگا اور وہ اپنے رب سے جا ملا، اور لوگوں نے کہا: ہم لڑکے کے رب پر ایمان لائے۔"
