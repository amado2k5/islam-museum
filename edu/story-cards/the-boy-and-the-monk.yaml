slug: the-boy-and-the-monk
title:
  ar: الغلام والراهب
  en: The Boy and the Monk
  ur: لڑکا اور راہب
  fr: Le garçon et le moine
  tr: Çocuk ve Keşiş
  id: Anak dan Biksu
lede:
  ar: غلام آمن بالله فعلّم الناس التوحيد حتى آمن به قوم كثير — في اثنتي عشرة بطاقة.
  en: A boy who believed in God and taught his people tawhid — told in twelve cards.
  ur: ایک لڑکا جس نے اللہ پر ایمان لایا اور اپنے لوگوں کو توحید سکھائی — بارہ کارڈز میں۔
  fr: Un garçon crut en Dieu et enseigna à son peuple le tawhid, la croyance en l’unicité de Dieu. Son histoire en douze cartes.
  tr: Genç bir adam Tanrı'ya inanıyordu ve insanlara tektanrıcılığı öğretti, ta ki birçok kişi ona inanana kadar — on iki kartta.
  id: Seorang pemuda percaya kepada Tuhan dan mengajarkan monoteisme sampai banyak yang percaya kepada-Nya — dalam dua belas kartu.
