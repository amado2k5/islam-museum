title:
  ar: خطبة الوداع
  en: The Farewell Sermon
  ur: خطبہِ وداع
  fr: Le sermon d’adieu
  tr: Veda Konuşması
  id: Pidato Perpisahan
lede:
  ar: على جبل عرفات وقف النبي يودع الناس ويبيّن لهم دينهم — في اثنتي عشرة بطاقة.
  en: On Arafat's mount the Prophet bade the people farewell and set out their faith — in twelve cards.
  ur: عرفات کے پہاڑ پر نبی نے لوگوں کو الوداع کہا اور ان کا دین بیان کیا — بارہ کارڈز میں۔
  fr: Au mont Arafat, le prophète Muhammad fit ses adieux à la foule et lui rappela les enseignements de sa religion. En douze cartes.
  tr: Arafat Dağı'nda Peygamber, insanlara veda ediyor ve dinlerini gösteriyordu — on iki kart halinde.
  id: Di Gunung Arafat, Nabi berdiri mengucapkan selamat tinggal kepada umat dan menunjukkan agama mereka — dalam dua belas kartu.
