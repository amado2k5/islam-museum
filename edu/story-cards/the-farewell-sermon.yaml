slug: the-farewell-sermon
title:
  ar: "خطبة الوداع"
  en: "The Farewell Sermon"
  ur: "خطبہِ وداع"
lede:
  ar: "على جبل عرفات وقف النبي يودع الناس ويبيّن لهم دينهم — في اثنتي عشرة بطاقة."
  en: "On Arafat's mount the Prophet bade the people farewell and set out their faith — in twelve cards."
  ur: "عرفات کے پہاڑ پر نبی نے لوگوں کو الوداع کہا اور ان کا دین بیان کیا — بارہ کارڈز میں۔"
status: { review: published }
provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "سيرة ابن هشام، ج٤؛ صحيح مسلم، حج — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "حجة الوداع", en: "The farewell pilgrimage", ur: "حجۃ الوداع" }
    motif: caravan
    narration:
      ar: "في السنة العاشرة للهجرة حج النبي حجته الوحيدة، وخرج معه مئة ألف أو يزيدون."
      en: "In the tenth Hijri year the Prophet made his only Hajj, with a hundred thousand people or more."
      ur: "ہجری کے دسویں سال نبی نے اپنی واحد حج کی، اور لاکھوں لوگ ساتھ تھے۔"
  - title: { ar: "عرفات", en: "Arafat", ur: "عرفات" }
    motif: mountain
    narration:
      ar: "في اليوم التاسع من ذي الحجة وقف على جبل الرحمة وخطب الناس."
      en: "On the ninth of Dhu al-Hijjah he stood on the Mount of Mercy and addressed the people."
      ur: "ذوالحجہ کے نویں دن وہ کوہِ رحمت پر کھڑے ہوئے اور لوگوں سے خطاب کیا۔"
  - title: { ar: "الدماء", en: "The blood", ur: "خون" }
    motif: star
    narration:
      ar: "قال: إن دماءكم وأموالكم وأعراضكم عليكم حرام كحرمة يومكم هذا."
      en: "He said: your blood, your wealth and your honour are sacred to you, like this day's sanctity."
      ur: "انہوں نے کہا: تمہارا خون، مال اور عزت تم پر حرام ہیں جیسے آج کا دن حرمت والا ہے۔"
  - title: { ar: "الربا", en: "Usury ended", ur: "سود ختم" }
    motif: coin
    narration:
      ar: "أعلن أن ربا الجاهلية موضوع، وأول ربا يبدأ به ربا عمه العباس."
      en: "He declared the usury of the Jahiliyya abolished, starting with his uncle Abbas's."
      ur: "انہوں نے اعلان کیا کہ جاہلیت کا سود ختم، اور پہلا سود ان کے چچا عباس کا معاف ہے۔"
  - title: { ar: "دم الجاهلية", en: "Jahiliyya's blood", ur: "جاہلیت کا خون" }
    motif: moon
    narration:
      ar: "ودماء الجاهلية موضوعة، وأول دم يبدأ به دم ابن ربيعة بن الحارث."
      en: "And the blood of the Jahiliyya is abolished, beginning with the son of Rabi'a ibn al-Harith."
      ur: "اور جاہلیت کا خون موقوف، پہلا خون ربیعہ بن حارث کے بیٹے کا۔"
  - title: { ar: "النساء", en: "The women", ur: "عورتیں" }
    motif: tree
    narration:
      ar: "واستوصوا بالنساء خيراً — وصية بأن تُحسن معاملتهن."
      en: "Take care of women — a charge to treat them well."
      ur: "عورتوں کے بارے میں نیکی کی وصیت — ان کے ساتھ بھلا سلوک کرنا۔"
  - title: { ar: "الكتاب", en: "The Book", ur: "کتاب" }
    motif: book
    narration:
      ar: "تركت فيكم ما إن تمسكتم به لن تضلوا: كتاب الله."
      en: "I have left among you that which if you hold it you will not stray: God's Book."
      ur: "میں نے تم میں وہ چھوڑا جسے مضبوطی سے پکڑو تو کبھی بھٹکو گے نہیں: اللہ کی کتاب۔"
  - title: { ar: "المساواة", en: "Equality", ur: "برابری" }
    motif: star
    narration:
      ar: "لا فضل لعربي على عجمي ولا لأبيض على أسود إلا بالتقوى."
      en: "No Arab has merit over a non-Arab, no white over black, except by piety."
      ur: "کسی عرب کو عجمی پر اور کسی گورے کو کالے پر فضیلت نہیں مگر تقویٰ سے۔"
  - title: { ar: "أرحموا", en: "The message", ur: "پیغام" }
    motif: mosque
    narration:
      ar: "الناس من آدم وآدم من تراب — كلكم سواسية كأسنان المشط."
      en: "People are from Adam and Adam is from dust — you are all equal like a comb's teeth."
      ur: "لوگ آدم سے ہیں اور آدم مٹی سے — تم سب برابر ہو جیسے کنگھی کے داندے۔"
  - title: { ar: "ألّا ترجعوا", en: "Do not return", ur: "واپس نہ جانا" }
    motif: compass
    narration:
      ar: "لا ترجعوا بعدي كفاراً يضرب بعضكم رقاب بعض."
      en: "Do not return after me to disbelief, striking one another's necks."
      ur: "میرے بعد کافر نہ بنو کہ ایک دوسرے کی گردنیں مارو۔"
  - title: { ar: "اليوم أكملت", en: "Completion", ur: "تکمیل" }
    motif: book
    narration:
      ar: "وفي ذلك اليوم نزلت آية: اليوم أكملت لكم دينكم."
      en: "That day the verse came down: today I have completed your faith for you."
      ur: "اسی دن آیت اتری: آج میں نے تمھارا دین مکمل کر دیا۔"
  - title: { ar: "الوداع", en: "The farewell", ur: "الوداع" }
    motif: moon
    narration:
      ar: "قال: لعلي لا ألقاكم بعد عامي هذا — فكانت خطبة الوداع."
      en: "He said: perhaps I will not meet you after this year of mine — and it was the Farewell Sermon."
      ur: "انہوں نے کہا: شاید میں اس سال کے بعد تم سے نہ ملوں — اور یہ خطبۂ وداع تھا۔"
