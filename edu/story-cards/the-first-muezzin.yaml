title:
  ar: أول مؤذن
  en: The First Muezzin
  ur: پہلا موذن
  fr: Le premier muezzin
  tr: İlk müezzin
  id: Muezzin pertama
lede:
  ar: بلال بن رباح — صوته أول صوت رفع الأذان في الإسلام — في اثنتي عشرة بطاقة.
  en: Bilal ibn Rabah — the first voice to raise the call to prayer — in twelve cards.
  ur: بلال بن رباح — پہلی آواز جس نے اذان بلند کی — بارہ کارڈز میں۔
  fr: Bilal ibn Rabah, le premier à faire entendre l’appel à la prière, en douze cartes.
  tr: Bilal ibn Rabah — onun sesi İslam'da ilk ezan çağrısıydı — on iki kartta.
  id: Bilal ibn Rabah — suaranya adalah seruan salat pertama dalam Islam — dalam dua belas kartu.
