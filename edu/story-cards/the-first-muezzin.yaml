slug: the-first-muezzin
title:
  ar: "أول مؤذن"
  en: "The First Muezzin"
  ur: "پہلا موذن"
lede:
  ar: "بلال بن رباح — صوته أول صوت رفع الأذان في الإسلام — في اثنتي عشرة بطاقة."
  en: "Bilal ibn Rabah — the first voice to raise the call to prayer — in twelve cards."
  ur: "بلال بن رباح — پہلی آواز جس نے اذان بلند کی — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/ibn-hisham-saqqa, source/sahih-al-bukhari]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "سيرة ابن هشام؛ الإصابة في تمييز الصحابة — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "حبشي في مكة", en: "An Abyssinian in Makkah", ur: "مکہ میں حبشی" }
    motif: city
    narration:
      ar: "بلال بن رباح، مولى حبشيّ في مكة، كان من السابقين إلى الإسلام."
      en: "Bilal ibn Rabah, an Abyssinian freedman in Makkah, was among the first to enter Islam."
      ur: "بلال بن رباح، مکہ میں حبشی آزاد شدہ، پہلی جماعت میں اسلام میں داخل ہوئے۔"
  - title: { ar: "الصبر", en: "The patience", ur: "صبر" }
    motif: mountain
    narration:
      ar: "أخرجه سيده إلى رمضاء مكة ليرجع عن إيمانه، فما رجع."
      en: "His master took him to Makkah's burning sand to make him leave his faith; he did not."
      ur: "اس کے مالک نے ایمان چھڑوانے کو اسے مکہ کی تپتی ریت پر لایا؛ وہ نہ پھرا۔"
  - title: { ar: "أحد أحد", en: "One, One", ur: "ایک، ایک" }
    motif: star
    narration:
      ar: "كان يقول وهو تحت الصخرة: أحد أحد — حتى مرّ أبو بكر فاشتراه وأعتقه."
      en: "Under the rock he kept saying: One, One — until Abu Bakr passed, bought him and set him free."
      ur: "چٹان کے تلے وہ کہتا رہا: ایک، ایک — یہاں تک کہ ابو بکر گزرے، خریدا اور آزاد کیا۔"
  - title: { ar: "الصوت", en: "The voice", ur: "آواز" }
    motif: moon
    narration:
      ar: "كان لبلال صوتٌ حسنٌ جميل، يسمعه الناس فيرقّون."
      en: "Bilal had a beautiful voice; people heard it and their hearts softened."
      ur: "بلال کی آواز نہایت خوبصورت تھی؛ سننے والے کے دل نرم ہو جاتے۔"
  - title: { ar: "كيف ننادي؟", en: "How shall we call?", ur: "کیسے پکاریں؟" }
    motif: mosque
    narration:
      ar: "لما استقر المسلمون في المدينة سألوا: كيف نجمع الناس للصلاة؟"
      en: "When the Muslims settled in Madinah they asked: how shall we gather people for prayer?"
      ur: "جب مسلمان مدینہ میں بس گئے تو پوچھا: نماز کے لیے لوگوں کو کیسے جمع کریں؟"
  - title: { ar: "رؤيا عبد الله", en: "Abd Allah's dream", ur: "عبداللہ کا خواب" }
    motif: moon
    narration:
      ar: "رأى عبد الله بن زيد في المنام رجلاً يعلّمه كلمات الأذان، فقصها."
      en: "Abd Allah ibn Zayd saw a man in a dream teaching him the words of the call, and he told it."
      ur: "عبداللہ بن زید نے خواب میں شخص کو اذان کے کلمات سکھاتے دیکھا اور بیان کیا۔"
  - title: { ar: "الأذان", en: "The call", ur: "اذان" }
    motif: mosque
    narration:
      ar: "قال النبي: يا بلال، قم فنادِ بالناس بالصلاة — فكان أول أذان."
      en: "The Prophet said: Bilal, rise and call the people to prayer — and it was the first adhan."
      ur: "نبی نے فرمایا: بلال، اٹھو اور لوگوں کو نماز کی پکار دو — اور یہ پہلی اذان تھی۔"
  - title: { ar: "على سطح المسجد", en: "On the mosque roof", ur: "مسجد کی چھت پر" }
    motif: mosque
    narration:
      ar: "صعد بلال فوق بيتٍ بجوار المسجد فأذّن، فسمعه الناس واجتمعوا."
      en: "Bilal climbed a roof beside the mosque and called; the people heard and gathered."
      ur: "بلال مسجد کے پاس ایک چھت پر چڑھا اور اذان دی؛ لوگوں نے سنا اور جمع ہوئے۔"
  - title: { ar: "يوم الفتح", en: "The day of the conquest", ur: "فتح کا دن" }
    motif: city
    narration:
      ar: "يوم فتح مكة أذّن بلال فوق ظهر الكعبة، والناس من حولها يتذكرون."
      en: "On the day Makkah was opened Bilal called the adhan on the Ka'bah's back while the people remembered."
      ur: "مکہ کی فتح کے دن بلال نے کعبہ کی پشت پر اذان دی اور لوگ یاد کرتے رہے۔"
  - title: { ar: "الوزير", en: "The trusted", ur: "امانتدار" }
    motif: coin
    narration:
      ar: "كان بلال أميناً على بيت المال في المدينة، يصرفه على الفقراء."
      en: "Bilal kept the treasury's trust in Madinah, spending it on the poor."
      ur: "بلال مدینہ میں بیت المال کا امین تھا، اسے مسکینوں پر خرچ کرتا۔"
  - title: { ar: "بعد النبي", en: "After the Prophet", ur: "نبی کے بعد" }
    motif: tree
    narration:
      ar: "لما توفي النبي سألوه أن يؤذن، فأذن مرة أو مرتين ثم اعتذر: لا أستطيع."
      en: "After the Prophet's passing they asked him to call again; he called once or twice then excused himself."
      ur: "نبی کے وصال کے بعد انہوں نے اذان کی التجا کی؛ ایک دو بار دی پھر معذرت کی۔"
  - title: { ar: "في دمشق", en: "In Damascus", ur: "دمشق میں" }
    motif: mosque
    narration:
      ar: "توفي في دمشق، وقبره في مقبرة الباب الصغير يزوره الناس إلى اليوم."
      en: "He died in Damascus; his grave in Bab al-Saghir's cemetery is still visited today."
      ur: "وہ دمشق میں فوت ہوئے؛ باب صغیر کی قبرستان میں ان کی قبر آج بھی زیارت ہوتی ہے۔"
