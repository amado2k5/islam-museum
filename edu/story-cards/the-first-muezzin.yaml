cards:
- title:
    ar: حبشي في مكة
    en: An Abyssinian in Makkah
    ur: مکہ میں حبشی
    fr: Un Abyssin à La Mecque
    tr: Mekke'de Habeşli
    id: Abyssinian di Mekah
  motif: city
  narration:
    ar: بلال بن رباح، مولى حبشيّ في مكة، كان من السابقين إلى الإسلام.
    en: Bilal ibn Rabah, an Abyssinian freedman in Makkah, was among the first to enter Islam.
    ur: بلال بن رباح، مکہ میں حبشی آزاد شدہ، پہلی جماعت میں اسلام میں داخل ہوئے۔
    fr: Bilal ibn Rabah, un affranchi abyssin de La Mecque, fut parmi les premiers à embrasser l’islam.
    tr: Mekke'deki Habeşistan'da özgür bırakılmış bir Bilal ibn Rabah, İslam'a ilk geçenlerden biriydi.
    id: Bilal ibn Rabah, seorang mantan dari Abyssinia di Mekah, termasuk di antara para mualaf awal ke Islam.
- title:
    ar: الصبر
    en: The patience
    ur: صبر
    fr: La patience
    tr: Sabır
    id: Kesabaran
  motif: mountain
  narration:
    ar: أخرجه سيده إلى رمضاء مكة ليرجع عن إيمانه، فما رجع.
    en: His master took him to Makkah's burning sand to make him leave his faith; he did not.
    ur: اس کے مالک نے ایمان چھڑوانے کو اسے مکہ کی تپتی ریت پر لایا؛ وہ نہ پھرا۔
    fr: Son maître l’emmena sur le sable brûlant de La Mecque pour lui faire renier sa foi, mais Bilal ne céda pas.
    tr: Efendisi onu inancını terk etmesi için Mekke çölüne götürdü, ancak geri dönmedi.
    id: Gurunya membawanya ke gurun Mekah untuk meninggalkan imannya, tetapi ia tidak kembali.
- title:
    ar: أحد أحد
    en: One, One
    ur: ایک، ایک
    fr: Un, un
    tr: Pazar Pazar
    id: Minggu Minggu
  motif: star
  narration:
    ar: 'كان يقول وهو تحت الصخرة: أحد أحد — حتى مرّ أبو بكر فاشتراه وأعتقه.'
    en: 'Under the rock he kept saying: One, One — until Abu Bakr passed, bought him and set him free.'
    ur: 'چٹان کے تلے وہ کہتا رہا: ایک، ایک — یہاں تک کہ ابو بکر گزرے، خریدا اور آزاد کیا۔'
    fr: Sous le rocher, Bilal répétait que Dieu est unique. Abou Bakr passa, le racheta et l’affranchit.
    tr: Taşların altında 'Ahad Ahad, Ahad' derdi — ta ki Abu Bakr geçip onu satın alıp özgür bırakana kadar.
    id: 'Ia biasa berkata di bawah batu: ''Ahad Ahad, Ahad'' — sampai Abu Bakr lewat, membelinya, dan membebaskannya.'
- title:
    ar: الصوت
    en: The voice
    ur: آواز
    fr: La voix
    tr: Ses
    id: Audio
  motif: moon
  narration:
    ar: كان لبلال صوتٌ حسنٌ جميل، يسمعه الناس فيرقّون.
    en: Bilal had a beautiful voice; people heard it and their hearts softened.
    ur: بلال کی آواز نہایت خوبصورت تھی؛ سننے والے کے دل نرم ہو جاتے۔
    fr: Bilal avait une belle voix qui touchait le cœur de ceux qui l’entendaient.
    tr: Bilal'ın çok güzel bir sesi vardı, insanlar bunu duyabilir ve duyacaklardı.
    id: Bilal memiliki suara yang indah, sangat indah, yang bisa didengar dan akan didengar orang.
- title:
    ar: كيف ننادي؟
    en: How shall we call?
    ur: کیسے پکاریں؟
    fr: Comment appeler à la prière ?
    tr: Nasıl arıyoruz?
    id: Bagaimana cara menelepon?
  motif: mosque
  narration:
    ar: 'لما استقر المسلمون في المدينة سألوا: كيف نجمع الناس للصلاة؟'
    en: 'When the Muslims settled in Madinah they asked: how shall we gather people for prayer?'
    ur: 'جب مسلمان مدینہ میں بس گئے تو پوچھا: نماز کے لیے لوگوں کو کیسے جمع کریں؟'
    fr: Une fois installés à Médine, les musulmans se demandèrent comment rassembler les gens pour la prière.
    tr: 'Müslümanlar Medine''ye yerleştiklerinde sordular: İnsanları namaza nasıl toplayacağız?'
    id: 'Ketika umat Muslim menetap di Madinah, mereka bertanya: Bagaimana kita mengumpulkan orang untuk shalat?'
- title:
    ar: رؤيا عبد الله
    en: Abd Allah's dream
    ur: عبداللہ کا خواب
    fr: Le rêve d’Abdallah
    tr: Ruya Abdullah
    id: Ruya Abdullah
  motif: moon
  narration:
    ar: رأى عبد الله بن زيد في المنام رجلاً يعلّمه كلمات الأذان، فقصها.
    en: Abd Allah ibn Zayd saw a man in a dream teaching him the words of the call, and he told it.
    ur: عبداللہ بن زید نے خواب میں شخص کو اذان کے کلمات سکھاتے دیکھا اور بیان کیا۔
    fr: Abdallah ibn Zayd raconta avoir vu en rêve un homme qui lui enseignait les paroles de l’appel à la prière.
    tr: Abdullah ibn Zaid bir rüyada kendisine ezan sözlerini öğreten bir adam gördü ve onları okudu.
    id: Abdullah ibn Zaid melihat dalam mimpi seorang pria yang mengajarinya kata-kata panggilan doa, sehingga ia mengucapkannya.
- title:
    ar: الأذان
    en: The call
    ur: اذان
    fr: L’appel à la prière
    tr: Ezan
    id: Adhan
  motif: mosque
  narration:
    ar: 'قال النبي: يا بلال، قم فنادِ بالناس بالصلاة — فكان أول أذان.'
    en: 'The Prophet said: Bilal, rise and call the people to prayer — and it was the first adhan.'
    ur: 'نبی نے فرمایا: بلال، اٹھو اور لوگوں کو نماز کی پکار دو — اور یہ پہلی اذان تھی۔'
    fr: Le prophète Muhammad demanda à Bilal de se lever et d’appeler les gens à la prière. Ce fut le premier adhan.
    tr: 'Peygamber şöyle dedi: Ey Bilal, ayağa kalk ve halkı namaza çağır—ve ilk ezan edildi.'
    id: 'Nabi berfirman: Wahai Bilal, berdirilah dan panggil umat untuk berdoa—dan panggilan pertama untuk berdoa pun diberikan.'
- title:
    ar: على سطح المسجد
    en: On the mosque roof
    ur: مسجد کی چھت پر
    fr: Sur un toit
    tr: Caminin çatısında
    id: Di atap masjid
  motif: mosque
  narration:
    ar: صعد بلال فوق بيتٍ بجوار المسجد فأذّن، فسمعه الناس واجتمعوا.
    en: Bilal climbed a roof beside the mosque and called; the people heard and gathered.
    ur: بلال مسجد کے پاس ایک چھت پر چڑھا اور اذان دی؛ لوگوں نے سنا اور جمع ہوئے۔
    fr: Bilal monta sur le toit d’une maison près de la mosquée et lança l’appel. Les gens l’entendirent et se rassemblèrent.
    tr: Bilal, caminin yanındaki bir eve tırmandı ve ezan etti; halk bunu duyup topladı.
    id: Bilal memanjat sebuah rumah di sebelah masjid dan memanggil adhan, yang didengar dan dikumpulkan oleh orang-orang.
- title:
    ar: يوم الفتح
    en: The day of the conquest
    ur: فتح کا دن
    fr: Le jour de la conquête
    tr: Zafer Günü
    id: Hari Kemenangan
  motif: city
  narration:
    ar: يوم فتح مكة أذّن بلال فوق ظهر الكعبة، والناس من حولها يتذكرون.
    en: On the day Makkah was opened Bilal called the adhan on the Ka'bah's back while the people remembered.
    ur: مکہ کی فتح کے دن بلال نے کعبہ کی پشت پر اذان دی اور لوگ یاد کرتے رہے۔
    fr: Le jour de la prise de La Mecque, Bilal lança l’adhan du haut de la Kaaba, au milieu de la foule qui se remémorait le passé.
    tr: Mekke'nin fethi günü, Bilal'in kulağı Kabe'nin sırtına dikildi ve çevresindekiler bunu hatırladı.
    id: Pada hari penaklukan Mekah, telinga Bilal terangkat di belakang Ka'bah, dan orang-orang di sekitarnya mengingatnya.
- title:
    ar: الوزير
    en: The trusted
    ur: امانتدار
    fr: L’homme de confiance
    tr: Bakan
    id: Menteri
  motif: coin
  narration:
    ar: كان بلال أميناً على بيت المال في المدينة، يصرفه على الفقراء.
    en: Bilal kept the treasury's trust in Madinah, spending it on the poor.
    ur: بلال مدینہ میں بیت المال کا امین تھا، اسے مسکینوں پر خرچ کرتا۔
    fr: Bilal reçut la charge du trésor public de Médine et en consacra les fonds aux pauvres.
    tr: Bilal, şehrin hazinesinin koruyucusuydu ve bunu fakirlere harcıyordu.
    id: Bilal adalah penjaga kas kota, menghabiskannya untuk kaum miskin.
- title:
    ar: بعد النبي
    en: After the Prophet
    ur: نبی کے بعد
    fr: Après le Prophète
    tr: Peygamberden sonra
    id: Menurut nabi
  motif: tree
  narration:
    ar: 'لما توفي النبي سألوه أن يؤذن، فأذن مرة أو مرتين ثم اعتذر: لا أستطيع.'
    en: After the Prophet's passing they asked him to call again; he called once or twice then excused himself.
    ur: نبی کے وصال کے بعد انہوں نے اذان کی التجا کی؛ ایک دو بار دی پھر معذرت کی۔
    fr: Après la mort du Prophète, on lui demanda d’appeler de nouveau à la prière. Il le fit une ou deux fois, puis s’en excusa.
    tr: 'Peygamber vefat ettiğinde, ondan azan çağırmasını istediler, o da bir iki kez ezan okudu ve sonra özür diledi: Yapamam.'
    id: 'Ketika Nabi wafat, mereka memintanya untuk memanggil adhan, jadi dia memanggil adhan sekali atau dua kali, lalu meminta maaf: Saya tidak bisa.'
- title:
    ar: في دمشق
    en: In Damascus
    ur: دمشق میں
    fr: À Damas
    tr: Şam'da
    id: Di Damaskus
  motif: mosque
  narration:
    ar: توفي في دمشق، وقبره في مقبرة الباب الصغير يزوره الناس إلى اليوم.
    en: He died in Damascus; his grave in Bab al-Saghir's cemetery is still visited today.
    ur: وہ دمشق میں فوت ہوئے؛ باب صغیر کی قبرستان میں ان کی قبر آج بھی زیارت ہوتی ہے۔
    fr: Il mourut à Damas. Aujourd’hui encore, des gens visitent sa tombe au cimetière de Bab al-Saghir.
    tr: Şam'da öldü ve mezarı bugün hâlâ ziyaret edilen Bab al-Saghir mezarlığında bulunmaktadır.
    id: Ia meninggal di Damaskus, dan makamnya berada di pemakaman Bab al-Saghir, yang masih sering dikunjungi hingga kini.
