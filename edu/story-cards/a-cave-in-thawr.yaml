slug: a-cave-in-thawr
title:
  ar: "غار في ثور"
  en: "A Cave in Thawr"
  ur: "ثور میں ایک غار"
lede:
  ar: "ثلاثة أيام في جوف الجبل، والبحث يدور حولهما — قصة غار ثور في اثنتي عشرة بطاقة."
  en: "Three days inside the mountain while the search circled them — the story of Thawr's cave in twelve cards."
  ur: "پہاڑ کے اندر تین دن جبکہ تلاش ان کے گرد گھومتی رہی — غارِ ثور کی کہانی بارہ کارڈز میں۔"
status: { review: published }
provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "سيرة ابن هشام؛ الرحيق المختوم — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "الليلة المقصودة", en: "The marked night", ur: "مقررہ رات" }
    motif: moon
    narration:
      ar: "اجتمع شباب كل قبيلة حول بيت النبي ليضربوه ضربة رجل واحد."
      en: "Young men from every tribe gathered at the Prophet's door to strike him as one man."
      ur: "ہر قبیلے کے نوجوان نبی کے دروازے پر جمع ہوئے کہ اسے ایک شخص کی وار کریں۔"
  - title: { ar: "فراش علي", en: "Ali in the bed", ur: "علی بستر میں" }
    motif: cave
    narration:
      ar: "نام علي بن أبي طالب في فراشه متسربلاً ببردته الحضرمية الخضراء."
      en: "Ali ibn Abi Talib slept in his bed, wrapped in the green Hadrami cloak."
      ur: "علی بن ابی طالب اس کے بستر پر سوئے، سبز حضرمی چادر اوڑھے۔"
  - title: { ar: "الرمل", en: "The dust", ur: "غبار" }
    motif: star
    narration:
      ar: "خرج عليهم فأخذ قبضة من تراب فذرها على رؤوسهم ومر بهم لا يعلمون."
      en: "He came out, took a handful of dust, scattered it over their heads, and passed unseen."
      ur: "وہ باہر آئے، مٹھی بھر خاک اٹھائی، ان کے سروں پر چھڑکی اور ان کے سامنے سے گزر گئے۔"
  - title: { ar: "أبو بكر", en: "Abu Bakr", ur: "ابو بکر" }
    motif: city
    narration:
      ar: "سار في الليل إلى بيت أبي بكر الصديق، أقرب الناس إلى قلبه."
      en: "He walked through the night to Abu Bakr the Truthful's house, closest of people to his heart."
      ur: "وہ رات کو ابو بکر صدیق کے گھر گئے، جو ان کے دل کے سب سے قریب تھے۔"
  - title: { ar: "ناقتان", en: "Two mounts", ur: "دو سواریاں" }
    motif: camel
    narration:
      ar: "كان أبو بكر قد أعدّ ناقتين لهذا السفر من قبل، وعلفهما عند ابنته."
      en: "Abu Bakr had prepared two mounts for this journey long before, fed at his daughter's."
      ur: "ابو بکر نے اس سفر کے لیے پہلے سے دو سواریاں تیار رکھی تھیں۔"
  - title: { ar: "الطريق الخلفي", en: "The back road", ur: "پچھلا راستہ" }
    motif: map
    narration:
      ar: "خرجا من خلف مكة لا من بابها، وسلكا طريقاً لا يعرفه الناس."
      en: "They left from behind Makkah, not its gate, and took a road no one knew."
      ur: "وہ مکہ کے پیچھے سے نکلے، اس کے دروازے سے نہیں، اور ایسا راستہ لیا جو کسی کو معلوم نہ تھا۔"
  - title: { ar: "الغار", en: "The cave", ur: "غار" }
    motif: cave
    narration:
      ar: "دخلا غاراً في جبل ثور بعيداً عن الطريق، واستترا في ظلامه."
      en: "They entered a cave in Mount Thawr far from the road and hid in its dark."
      ur: "وہ راستے سے دور کوہِ ثور کی ایک غار میں داخل ہوئے اور اس کے اندھیرے میں چھپ گئے۔"
  - title: { ar: "النعال", en: "The sandals", ur: "جوتے" }
    motif: book
    narration:
      ar: "قيل إن أبا بكر سدّ كل ثقب في الغار بقطع من نعله حتى لا تخرج حية."
      en: "It is said Abu Bakr plugged every hole in the cave with pieces of his sandal so no snake would come."
      ur: "کہا جاتا ہے ابو بکر نے غار کے ہر سوراخ اپنے جوتے کے ٹکڑوں سے بند کیا۔"
  - title: { ar: "لا تحزن", en: "Do not grieve", ur: "غم نہ کرو" }
    motif: star
    narration:
      ar: "لما اقترب الطالِبون قال أبو بكر: لو نظر أحدهم تحت قدميه لرآنا؛ فقال: لا تحزن."
      en: "As the searchers came near Abu Bakr said: if one looks under his feet he sees us — he said: do not grieve."
      ur: "جب تلاش کرنے والے قریب آئے تو ابو بکر نے کہا: کوئی پاؤں تلے دیکھے تو ہمیں پالے؛ انہوں نے کہا: غم نہ کرو۔"
  - title: { ar: "العنكبوت", en: "The web", ur: "جالا" }
    motif: star
    narration:
      ar: "تروي الكتب أن عنكبوتاً نسج خيوطه على باب الغار فكان كأنه لم يمسه أحد."
      en: "The books tell a spider spun threads over the mouth as if no one had touched it."
      ur: "کتب میں ہے کہ مکڑی نے منہ پر جالے بُنے، گویا کسی نے ہاتھ نہیں لگایا۔"
  - title: { ar: "عبد الله وعامر", en: "The watchers", ur: "نگہبان" }
    motif: moon
    narration:
      ar: "كان ابن أبي بكر يبيت معهما ويأتيهما بالخبر، ويرعى عامر الغنم على الأثر."
      en: "Abu Bakr's son spent the nights with them and brought news, while Amir's flock erased the tracks."
      ur: "ابو بکر کا بیٹا ان کے ساتھ راتیں گزارتا اور خبر لاتا، اور عامر کی بھیڑیں نشان مٹاتیں۔"
  - title: { ar: "الرحيل", en: "The departure", ur: "روانگی" }
    motif: caravan
    narration:
      ar: "في الليلة الرابعة جاء الدليل بالناقتين، فركبا نحو المدينة في طريق الساحل."
      en: "On the fourth night the guide came with the two mounts, and they rode the coastal road to Madinah."
      ur: "چوتھی رات رہنما سواریاں لے آیا اور وہ ساحل کے راستے سے مدینہ کو چلے۔"
