slug: a-cave-in-thawr
title:
  ar: غار في ثور
  en: A Cave in Thawr
  ur: ثور میں ایک غار
  fr: Une grotte au mont Thawr
  tr: boğa içinde mağara
  id: runtuh banteng
lede:
  ar: ثلاثة أيام في جوف الجبل، والبحث يدور حولهما — قصة غار ثور في اثنتي عشرة بطاقة.
  en: Three days inside the mountain while the search circled them — the story of Thawr's cave in twelve cards.
  ur: پہاڑ کے اندر تین دن جبکہ تلاش ان کے گرد گھومتی رہی — غارِ ثور کی کہانی بارہ کارڈز میں۔
  fr: 'Trois jours cachés au cœur de la montagne, tandis qu’on les cherche tout autour : l’histoire de la grotte de Thawr en douze cartes.'
  tr: Dağın üç gün derinliklerinde, arama onların etrafında dönüyor — Thor'un mağarasının hikayesi on iki kartta.
  id: Tiga hari di dalam gunung, dan pencarian berpusat pada mereka — kisah gua Thor dalam dua belas kartu.
