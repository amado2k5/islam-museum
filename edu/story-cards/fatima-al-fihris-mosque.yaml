  ar: "جامع فاطمة الفهرية"
  en: "Fatima al-Fihri's Mosque"
  ur: "فاطمہ الفہری کی مسجد"
  fr: "La mosquée de Fatima al-Fihri"
lede:
  ar: "امرأة من تونس بنت في فاس أقدم جامعة في العالم — في اثنتي عشرة بطاقة."
  en: "A woman from Tunis who built the world's oldest university in Fez — in twelve cards."
  ur: "تونس کی ایک عورت جس نے فاس میں دنیا کی قدیم ترین جامعہ بنائی — بارہ کارڈز میں۔"
  fr: "En douze cartes, découvre comment une femme originaire de Tunisie a fondé à Fès la plus ancienne université du monde."
