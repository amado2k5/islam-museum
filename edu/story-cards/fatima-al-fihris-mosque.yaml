cards:
- title:
    ar: القيروان
    en: Kairouan
    ur: قیروان
    fr: Kairouan
    tr: Kairouan
    id: Kairouan
  motif: city
  narration:
    ar: ولدت فاطمة بنت محمد الفهري في القيروان بتونس في القرن التاسع.
    en: Fatima bint Muhammad al-Fihri was born in Kairouan, Tunisia, in the ninth century.
    ur: فاطمہ بنت محمد الفہری نویں صدی میں تونس کے شہر قیروان میں پیدا ہوئیں۔
    fr: Fatima bint Muhammad al-Fihri naquit à Kairouan, en Tunisie, au IXe siècle.
    tr: Fatima bint Muhammad al-Fihri, dokuzuncu yüzyılda Tunus'un Kairouan kentinde doğdu.
    id: Fatima bint Muhammad al-Fihri lahir di Kairouan, Tunisia, pada abad kesembilan.
- title:
    ar: فاس
    en: Fez
    ur: فاس
    fr: Fès
    tr: Fes
    id: Fez
  motif: city
  narration:
    ar: هاجرت مع أهلها إلى فاس في المغرب، فنشأت فيها.
    en: She migrated with her family to Fez in Morocco, and grew up there.
    ur: وہ اپنے اہل و عیال کے ساتھ فاس ہجرت کی اور وہیں پلی۔
    fr: Elle partit avec sa famille pour Fès, au Maroc, où elle grandit.
    tr: Ailesiyle birlikte büyüdüğü Fas'ın Fes şehrine göç etti.
    id: Ia bermigrasi bersama keluarganya ke Fez di Maroko, tempat ia tumbuh besar.
- title:
    ar: التجارة
    en: The merchant wealth
    ur: تجارتی دولت
    fr: La fortune d’un marchand
    tr: Ticaret
    id: Perdagangan
  motif: coin
  narration:
    ar: كان أبوها تاجراً ميسوراً ترك لها مالاً وفيراً عند وفاته.
    en: Her father was a prosperous merchant who left her a great fortune at his death.
    ur: اس کے والد مالدار تاجر تھے جو مرنے پر اسے بہت مال چھوڑ گئے۔
    fr: Son père, un marchand prospère, lui laissa une grande fortune à sa mort.
    tr: Babası, ölümünden sonra ona büyük bir servet bırakan varlıklı bir tüccardı.
    id: Ayahnya adalah seorang pedagang kaya yang meninggalkannya kekayaan besar setelah kematiannya.
- title:
    ar: النيّة
    en: The resolve
    ur: ارادہ
    fr: La décision
    tr: Niyet
    id: Niat
  motif: star
  narration:
    ar: قررت أن تنفق مالها في بناء مسجد يجمع الصلاة والعلم.
    en: She resolved to spend her wealth on a mosque that would gather prayer and learning.
    ur: اس نے فیصلہ کیا کہ اپنا مال ایسی مسجد پر خرچ کرے جو نماز اور علم جمع کرے۔
    fr: Elle décida de consacrer sa fortune à une mosquée où l’on pourrait à la fois prier et étudier.
    tr: Parasını dua ve bilgiyi birleştiren bir cami inşa etmeye harcamaya karar verdi.
    id: Ia memutuskan untuk menghabiskan uangnya membangun masjid yang menggabungkan shalat dan pengetahuan.
- title:
    ar: الأرض
    en: The land
    ur: زمین
    fr: Le terrain
    tr: Dünya
    id: Bumi
  motif: map
  narration:
    ar: اشترت أرضاً في حي العوالية بفاس وبدأت البناء في رمضان سنة 245هـ.
    en: She bought land in the Awaliyya quarter of Fez and began building in Ramadan 245 AH.
    ur: اس نے فاس کے علاقہ عوالیہ میں زمین خریدی اور رمضان 245ھ میں تعمیر شروع کی۔
    fr: Elle acheta un terrain dans le quartier d’Awaliyya à Fès et lança les travaux pendant le ramadan de l’an 245 de l’Hégire.
    tr: Fes'in El-Avaliye mahallesinde arazi satın aldı ve 245 Hicri Ramazan ayında inşaata başladı.
    id: Ia membeli tanah di lingkungan Al-Awaliyah, Fez dan mulai membangun pada Ramadan tahun 245 H.
- title:
    ar: الصيام
    en: The fasting
    ur: روزہ
    fr: Le jeûne
    tr: Oruç
    id: Puasa
  motif: moon
  narration:
    ar: يُروى أنها صامت أيام البناء كلها حتى اكتمل المسجد.
    en: It is told she fasted every day of the building until the mosque was complete.
    ur: کہا جاتا ہے کہ تعمیر کے تمام دن وہ روزہ رکھتی رہی یہاں تک مسجد مکمل ہوئی۔
    fr: On raconte qu’elle jeûna chaque jour du chantier, jusqu’à ce que la mosquée soit achevée.
    tr: Cami tamamlanana kadar inşaat boyunca sessiz kaldığı söylenir.
    id: Dikatakan bahwa masjid tersebut tetap diam sepanjang pembangunan hingga masjid selesai dibangun.
- title:
    ar: القرويين
    en: Al-Qarawiyyin
    ur: القرویین
    fr: Al-Qarawiyyin
    tr: köylüler
    id: penduduk desa
  motif: mosque
  narration:
    ar: سُمي الجامع القرويين نسبة إلى قومها أهل القيروان.
    en: The mosque was named al-Qarawiyyin after her people of Kairouan.
    ur: مسجد کا نام قرویین رکھا گیا ان کے شہر قیروان کی نسبت سے۔
    fr: La mosquée fut appelée al-Qarawiyyin en référence aux gens de Kairouan, dont Fatima était originaire.
    tr: Cami, Kairouan halkı olan halkının adını al-Karawiyyin olarak aldı.
    id: Masjid ini dinamai Al-Qarawiyyin sesuai dengan penduduknya, masyarakat Kairouan.
- title:
    ar: المحراب
    en: The mihrab
    ur: محراب
    fr: Le mihrab
    tr: Mihrab
    id: Mihrab
  motif: mosque
  narration:
    ar: بنيت عشر أروقة ومحراب وقبة، وكانت أكبر مساجد فاس في عهدها.
    en: Ten arcades, a mihrab and a dome rose — the largest mosque of Fez in her day.
    ur: دس محرابیں، ایک محراب اور گنبد بنے — اپنے زمانے کی فاس کی سب سے بڑی مسجد۔
    fr: Dix arcades, un mihrab et une coupole s’élevèrent. C’était alors la plus grande mosquée de Fès.
    tr: On kemer, bir mihrab ve bir kubbe inşa edilmiş olup, döneminde Fes'in en büyük camisi olmuştur.
    id: Sepuluh arcade, sebuah mihrab, dan sebuah kubah dibangun, dan ini adalah masjid terbesar di Fez pada masanya.
- title:
    ar: المدرسة
    en: The school
    ur: مدرسہ
    fr: L’école
    tr: Okul
    id: Sekolah
  motif: book
  narration:
    ar: صارت المسجد مدرسة يدرس فيها العلماء الفقه والعربية والحساب.
    en: The mosque became a school where scholars taught fiqh, Arabic and reckoning.
    ur: مسجد مدرسہ بن گئی جہاں علما فقہ، عربی اور حساب پڑھاتے تھے۔
    fr: La mosquée devint une école où des savants enseignaient le droit musulman, l’arabe et le calcul.
    tr: Cami, alimlerin fıkıh, Arapça ve aritmetik öğrendiği bir okul haline geldi.
    id: Masjid ini menjadi sekolah di mana para cendekiawan mempelajari ilmu hukum, bahasa Arab, dan aritmatika.
- title:
    ar: الأخت
    en: The sister
    ur: بہن
    fr: La sœur
    tr: Kız kardeş
    id: Saudari
  motif: tree
  narration:
    ar: أختها مريم بنت على نفس المنوال جامعاً آخر في فاس.
    en: Her sister Maryam built another mosque in Fez on the same lines.
    ur: اس کی بہن مریم نے بھی فاس میں اسی طرز پر ایک اور مسجد بنائی۔
    fr: Sa sœur Maryam fit bâtir une autre mosquée à Fès, selon le même principe.
    tr: Kız kardeşi Maryam da aynı şekilde Fes'te başka bir cami inşa etti.
    id: Saudarinya, Maryam, membangun masjid lain di Fez dengan cara yang sama.
- title:
    ar: الجامعة
    en: The university
    ur: جامعہ
    fr: L’université
    tr: Üniversite
    id: Universitas
  motif: star
  narration:
    ar: يعدها مؤرخو التعليم أقدم مؤسسة جامعية ما زالت تمنح الدرجات.
    en: Historians of education count it the oldest degree-granting institution still operating.
    ur: تعلیم کے مؤرخین اسے قدیم ترین جامعہ مانتے ہیں جو آج بھی ڈگریاں دیتی ہے۔
    fr: Les historiens de l’éducation la considèrent comme le plus ancien établissement encore en activité à décerner des diplômes.
    tr: Eğitim tarihçileri, burayı hâlâ derece veren en eski üniversite kurumu olarak kabul etmektedir.
    id: Sejarawan pendidikan menganggapnya sebagai institusi universitas tertua yang masih memberikan gelar.
- title:
    ar: اليوم
    en: Today
    ur: آج
    fr: Aujourd’hui
    tr: Günümüz
    id: Saat ini
  motif: mosque
  narration:
    ar: ما زال جامع القرويين قائماً في فاس، والطلاب يقرؤون في رحابه.
    en: Al-Qarawiyyin still stands in Fez, and students still read in its courts.
    ur: قرویین آج بھی فاس میں قائم ہے اور طلبہ اس کے صحنوں میں پڑھتے ہیں۔
    fr: Al-Qarawiyyin se dresse toujours à Fès et des élèves étudient encore dans ses cours.
    tr: Fez'de hâlâ A-Karawiyyin Camii ayakta ve öğrenciler avlularında eğitim almaktadır.
    id: Masjid Al-Qarawiyyin masih berdiri di Fez, dan para mahasiswa belajar di dalam halaman-halaman masjid tersebut.
