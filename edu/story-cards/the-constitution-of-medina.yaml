title:
  ar: صحيفة المدينة
  en: The Constitution of Madinah
  ur: میثاقِ مدینہ
  fr: La Charte de Médine
  tr: El-Medina Gazetesi
  id: Surat Kabar Al-Madina
lede:
  ar: أول دستور مكتوب في المدينة يجمع المسلمين واليهود والأحلاف — في اثنتي عشرة بطاقة.
  en: The first written charter joining Madinah's Muslims, Jews and allies — in twelve cards.
  ur: مدینہ کا پہلا تحریری دستور جو مسلمانوں، یہود اور حلفاؤ کو جوڑتا ہے — بارہ کارڈز میں۔
  fr: La première charte écrite qui réunit les musulmans, les juifs et leurs alliés à Médine, en douze cartes.
  tr: Şehirdeki ilk yazılı anayasa, Müslümanları, Yahudileri ve müttefikleri on iki kartta birleştiriyor.
  id: Konstitusi tertulis pertama di kota ini menyatukan Muslim, Yahudi, dan sekutunya — dalam dua belas kartu.
