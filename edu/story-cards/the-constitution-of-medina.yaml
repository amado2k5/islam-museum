cards:
- title:
    ar: يثرب المقسّمة
    en: A divided Yathrib
    ur: منقسم یثرب
    fr: Yathrib, une ville divisée
    tr: Yathrib bölündü
    id: Yathrib terbagi
  motif: city
  narration:
    ar: 'قبل الهجرة كانت يثرب مدينة مقسّمة: الأوس والخزرج يتقاتلون، واليهود قبائل، والمهاجرون جدد.'
    en: 'Before the Hijra Yathrib was divided: Aws and Khazraj feuding, Jewish tribes, newcomers arriving.'
    ur: 'ہجرت سے پہلے یثرب منقسم تھا: اوس اور خزرج لڑتے، یہودی قبائل، اور نئے آئے مہاجرین۔'
    fr: 'Avant l’Hégire, Yathrib était divisée : les Aws et les Khazraj se battaient, des tribus juives y vivaient et des migrants venaient d’arriver.'
    tr: 'Göçten önce Yathrib bölünmüş bir şehirdi: Aws ve Khazraj kavga ediyordu, Yahudiler kabilelerdi ve göçmenler yeniydi.'
    id: 'Sebelum migrasi, Yathrib adalah kota yang terpecah: Aws dan Khazraj bertempur, Yahudi adalah suku, dan para migran adalah baru.'
- title:
    ar: الحاجة
    en: The need
    ur: ضرورت
    fr: Le besoin
    tr: İhtiyaç
    id: Kebutuhan
  motif: map
  narration:
    ar: احتاج الناس إلى صحيفة واحدة تحدد حقوق كل فريق وواجباته.
    en: The people needed one charter setting out each side's rights and duties.
    ur: لوگوں کو ایک صحیفہ چاہیے تھا جو ہر فریق کے حقوق اور فرائض لکھے۔
    fr: Il fallait une charte commune pour définir les droits et les devoirs de chaque groupe.
    tr: İnsanların her takımın hak ve görevlerini tanımlayan tek bir gazeteye ihtiyacı vardı.
    id: Orang-orang membutuhkan satu surat kabar yang mendefinisikan hak dan kewajiban setiap tim.
- title:
    ar: الكاتب
    en: The writing
    ur: تحریر
    fr: La rédaction
    tr: Yazar
    id: Penulis
  motif: pen
  narration:
    ar: أمر النبي بكتابة الصحيفة، فكتبت على جلد أو صحف، بنداً بنداً.
    en: The Prophet ordered the charter written; it went on skin or scrolls, clause by clause.
    ur: نبی نے صحیفہ لکھوانے کا حکم دیا؛ چمڑے پر لکھا گیا، بند بہ بند۔
    fr: Le prophète Muhammad ordonna de rédiger la charte. On l’écrivit sur du cuir ou sur des feuillets, clause après clause.
    tr: Peygamber, gazetenin yazılmasını emretti, bu yüzden kapakta veya gazetelerde madde madde yazıldı.
    id: Nabi memerintahkan penulisan koran, sehingga tertulis di sampul surat kabar, item demi item.
- title:
    ar: أمة واحدة
    en: One umma
    ur: ایک امت
    fr: Une seule oumma
    tr: Tek Ulus
    id: Satu Bangsa
  motif: star
  narration:
    ar: نصّت الصحيفة أن المؤمنين والمسلمين من قريش ويثرب أمة واحدة من دون الناس.
    en: The charter stated that the believers and Muslims of Quraysh and Yathrib are one umma apart from other people.
    ur: صحیفے میں لکھا کہ قریش اور یثرب کے مومنین اور مسلمان دوسرے لوگوں سے ایک الگ امت ہیں۔
    fr: La charte stipulait que les croyants et les musulmans de Quraych et de Yathrib formaient une communauté distincte, une oumma.
    tr: Gazete, Kurayş ve Yathrib'ten gelen inananlar ve Müslümanların diğerleri olmadan tek bir millet olduğunu belirtti.
    id: Surat kabar tersebut menyatakan bahwa umat Islam dan Muslim dari Quraisy dan Yathrib adalah satu bangsa tanpa yang lain.
- title:
    ar: اليهود
    en: The Jews
    ur: یہود
    fr: Les juifs
    tr: Yahudiler
    id: Yahudi
  motif: manuscript
  narration:
    ar: ولليهود دينهم وللمسلمين دينهم، عليهم النفقة وعليهم النصر إذا دعوا.
    en: The Jews keep their religion and the Muslims theirs; each pays their share and each helps when called.
    ur: یہود کو اپنا دین اور مسلمانوں کو اپنا دین ہے؛ ہر فریق اپنا حصہ ادا کرے اور مدد کرے۔
    fr: Les juifs conservaient leur religion et les musulmans la leur. Chacun prenait en charge sa part des dépenses et prêtait assistance quand on le lui demandait.
    tr: Yahudilerin kendi dinleri vardır, Müslümanların da kendi dinleri vardır; çağrılırlarsa onlara destek olmalı ve zafer kazandırmalıdırlar.
    id: Orang Yahudi memiliki agama mereka sendiri, dan Muslim memiliki agama mereka; mereka harus menyediakan dan memberikan kemenangan jika dipanggil.
- title:
    ar: الدماء
    en: The blood
    ur: خون
    fr: Les vies humaines
    tr: Kan
    id: Darah
  motif: coin
  narration:
    ar: من قتل نفساً بغير حق فعليه القصاص، ولا يجوز أن يمنع قاتلاً من قصاصه.
    en: Whoever wrongfully takes a life faces retaliation; none may shield a murderer from it.
    ur: جو ناحق جان لے اس پر قصاص ہے؛ کوئی قاتل کو قصاص سے نہیں بچا سکتا۔
    fr: Quiconque tuait sans droit s’exposait à la loi du talion. Nul ne pouvait y soustraire un meurtrier.
    tr: Bir ruhu haksız yere öldüren kişi intikama tabi tutulur ve bir katili misillemeden alıkoymak yasaktır.
    id: Siapa pun yang membunuh jiwa secara tidak adil harus dikenakan pembalasan, dan tidak diperbolehkan mencegah pembunuh membalas dendam.
- title:
    ar: الحل والحرم
    en: Peace and war
    ur: صلح اور جنگ
    fr: La paix et la guerre
    tr: Çözüm ve Kutsal Alan
    id: Solusi dan Sanctuary
  motif: compass
  narration:
    ar: سلم المؤمنين واحدة، لا يسالم مؤمن دون مؤمن في قتال في سبيل الله.
    en: The believers' peace is one; no believer makes a separate peace in God's cause.
    ur: مومنین کی صلح ایک ہے؛ اللہ کی راہ کی جنگ میں کوئی مومن الگ صلح نہیں کرتا۔
    fr: 'La paix des croyants était commune : aucun d’eux ne pouvait conclure de paix séparée lors d’un combat pour la cause de Dieu.'
    tr: İnananlar birdir; hiçbir inanan, Allah yolunda savaşarak başka bir müminle barış yapmaz.
    id: Orang beriman adalah satu dan sama; tidak ada orang beriman yang berdamai dengan orang beriman lain dalam berjuang di jalan Allah.
- title:
    ar: يثرب حرم
    en: Yathrib a sanctuary
    ur: یثرب حرم
    fr: Yathrib, un sanctuaire
    tr: Yathrib haramdır
    id: Yathrib adalah Haram
  motif: mosque
  narration:
    ar: نصت الصحيفة أن جوار يثرب حرم لأهل هذه الصحيفة.
    en: The charter made the heart of Yathrib a sanctuary for the charter's people.
    ur: صحیفے نے یثرب کے قلب کو اس صحیفے کے لوگوں کے لیے حرم قرار دیا۔
    fr: La charte faisait du territoire de Yathrib un lieu sacré pour les gens qu’elle liait.
    tr: Gazete, Yathrib mahallesinin bu gazetenin halkı için kutsal olduğunu belirtti.
    id: Surat kabar tersebut menyatakan bahwa lingkungan Yathrib adalah tempat suci bagi masyarakat surat kabar tersebut.
- title:
    ar: الجار
    en: The neighbour
    ur: پڑوسی
    fr: Le voisin
    tr: Komşu
    id: Tetangga
  motif: city
  narration:
    ar: إن الجار كالنفس غير مضار ولا آثم.
    en: 'The neighbour is like the self: not harmed and not sinned against.'
    ur: 'پڑوسی خود جان کی طرح ہے: نہ اسے نقصان پہنچایا جائے نہ گناہ۔'
    fr: 'Le voisin devait être traité comme soi-même : sans tort ni injustice.'
    tr: Komşu ruh gibidir, ne zararlı ne de günahkardır.
    id: Sesama itu seperti jiwa, tidak berbahaya atau berdosa.
- title:
    ar: الفتنة
    en: The strife
    ur: فتنہ
    fr: Les différends
    tr: İsyan
    id: Hasutan
  motif: moon
  narration:
    ar: وإنه مهما اختلفتم فيه من شيء فإن مرده إلى الله وإلى محمد.
    en: Whatever you differ on returns to God and to Muhammad.
    ur: جس بات میں تم اختلاف کرو گے، اس کا فیصلہ اللہ اور محمد کے پاس لوٹے گا۔
    fr: En cas de désaccord, la charte prévoyait de s’en remettre à Dieu et à Muhammad.
    tr: Ve gerçekten, ne kadar farklı düşünseniz de bu Allah ve Muhammed'e bağlıdır.
    id: Dan memang, seberapa pun berbeda pendapat kalian tentang apa pun, itu adalah hasil Allah dan Muhammad.
- title:
    ar: العدل
    en: The fairness
    ur: انصاف
    fr: L’équité
    tr: Adalet
    id: Keadilan
  motif: coin
  narration:
    ar: 'شملت الصحيفة كل فريق: المهاجرين والأنصار واليهود ومن تبعهم وقاتل معهم.'
    en: 'The charter covered everyone: the Muhajirin, the Ansar, the Jews and those who followed and fought with them.'
    ur: 'صحیفے میں ہر فریق آیا: مہاجرین، انصار، یہود اور جو ان کے ساتھ لڑے۔'
    fr: 'La charte concernait tous les groupes : les émigrés, les auxiliaires médinois, les juifs et ceux qui s’étaient joints à eux pour combattre à leurs côtés.'
    tr: 'Gazete her grubu içeriyordu: göçmenler, destekçiler, Yahudiler, onları takip eden ve onlarla birlikte savaşanlar.'
    id: 'Surat kabar ini mencakup setiap kelompok: para emigran, para pendukung, orang Yahudi, mereka yang mengikuti mereka, dan berjuang bersama mereka.'
- title:
    ar: أول دستور
    en: The first charter
    ur: پہلا دستور
    fr: La première charte
    tr: Birinci Anayasa
    id: Konstitusi Pertama
  motif: star
  narration:
    ar: يصفها المؤرخون بأنها من أوائل الوثائق الدستورية في التاريخ.
    en: Historians call it among the earliest constitutional documents in history.
    ur: مؤرخین اسے تاریخ کے ابتدائی دستوری دستاویزات میں شمار کرتے ہیں۔
    fr: Les historiens la décrivent comme l’un des premiers textes constitutionnels de l’histoire.
    tr: Tarihçiler bunu tarihteki en eski anayasal belgelerden biri olarak tanımlar.
    id: Sejarawan menyebutnya sebagai salah satu dokumen konstitusional paling awal dalam sejarah.
