slug: the-samarkand-observatory
title:
  ar: "مرصد سمرقند"
  en: "The Samarkand Observatory"
  ur: "سمرقند کا رصد خانہ"
lede:
  ar: "أمير يقيس النجوم بدقة لم يصل إليها أحد قبل التلسكوب — في اثنتي عشرة بطاقة."
  en: "A prince who measured the stars with a precision no one matched before the telescope — in twelve cards."
  ur: "ایک شہزادہ جس نے ستارے اس درستگی سے ناپے کہ دوربین سے پہلے کوئی نہ پہنچا — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/hodgson-1974]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "تاريخ أولوغ بيك ومرصد سمرقند؛ الزيج السلطاني — إعادة صياغة بأمانة."
cards:
  - title: { ar: "الأمير", en: "The prince", ur: "شہزادہ" }
    motif: star
    narration:
      ar: "أولوغ بيك حاكم سمرقند في القرن الخامس عشر، حفيد تيمورلنك."
      en: "Ulugh Beg, ruler of Samarkand in the fifteenth century, was Timur's grandson."
      ur: "الغ بیگ، پندرہویں صدی میں سمرقند کا حاکم، تیمور کا پوتا تھا۔"
  - title: { ar: "العاشق", en: "The scholar", ur: "عالم" }
    motif: book
    narration:
      ar: "أحب الرياضيات والفلك أكثر من الملك، وجمع حوله العلماء."
      en: "He loved mathematics and astronomy more than kingship and gathered scholars around him."
      ur: "وہ بادشاہی سے زیادہ ریاضی اور فلکیات سے محبت رکھتا تھا اور علماء کو جمع کیا۔"
  - title: { ar: "المدرسة", en: "The madrasa", ur: "مدرسہ" }
    motif: mosque
    narration:
      ar: "بنى مدرسته في ساحة الريگستان، تدرس الفلك والفقه والنحو."
      en: "He built his madrasa in the Registan square, teaching astronomy, fiqh and grammar."
      ur: "اس نے ریگستان چوک میں مدرسہ بنایا جہاں فلکیات، فقہ اور نحو پڑھائی جاتی۔"
  - title: { ar: "التل", en: "The hill", ur: "پہاڑی" }
    motif: mountain
    narration:
      ar: "على تل كوهك شمال المدينة بنى مرصده، أكبر مرصد في زمانه."
      en: "On Kohak hill north of the city he built his observatory — the largest of its age."
      ur: "شہر کے شمال میں کوہک کی پہاڑی پر اس نے رصد خانہ بنایا — اپنے زمانے کا سب سے بڑا۔"
  - title: { ar: "الربع", en: "The quadrant", ur: "ربع دائرہ" }
    motif: compass
    narration:
      ar: "رُكّب في أرض المرصد ربع دائرة ضخم نصفه داخل الأرض، نصفه فوقها."
      en: "A giant quadrant was set into the observatory's floor — half in the earth, half above."
      ur: "رصد خانے کے فرش میں ایک بڑا ربع دائرہ نصب ہوا — آدھا زمین میں، آدھا اوپر۔"
  - title: { ar: "القياس", en: "The measuring", ur: "پیمائش" }
    motif: star
    narration:
      ar: "قاس ارتفاع الشمس والنجوم بدقة بلغت ثوانٍ من الدرجة الواحدة."
      en: "He measured the sun's and stars' heights to arc-second precision."
      ur: "اس نے سورج اور ستاروں کی بلندی درجے کے ثانیوں تک درستگی سے ناپی۔"
  - title: { ar: "الفلكيون", en: "The astronomers", ur: "فلکی دان" }
    motif: moon
    narration:
      ar: "عمل معه قاضي زاده الرومي وعلي القشجي وجمشيد الكاشي."
      en: "Qadi-zadeh al-Rumi, Ali al-Qushji and Jamshid al-Kashi worked beside him."
      ur: "قاضی زادہ رومی، علی قشجی اور جمشید کاشی اس کے ساتھ کام کرتے تھے۔"
  - title: { ar: "السنة", en: "The year", ur: "سال" }
    motif: moon
    narration:
      ar: "حسب طول السنة النجمية: 365 يوماً و6 ساعات و10 دقائق و8 ثوانٍ."
      en: "He calculated the sidereal year: 365 days, 6 hours, 10 minutes, 8 seconds."
      ur: "اس نے نجومی سال کی لمبائی نکالی: 365 دن، 6 گھنٹے، 10 منٹ، 8 سیکنڈ۔"
  - title: { ar: "الزيج", en: "The tables", ur: "زیج" }
    motif: book
    narration:
      ar: "ألف الزيج السلطاني: جداول ألف نجم ومواقعها وأوجها وأبعادها."
      en: "He authored the Sultan's Zij — tables of a thousand stars, their positions, ascents and distances."
      ur: "اس نے زیجِ سلطانی لکھی — ہزار ستاروں کے مقامات، طلوع اور فاصلے۔"
  - title: { ar: "الدقة", en: "The accuracy", ur: "درستگی" }
    motif: compass
    narration:
      ar: "بقيت جداوله أدق ما عرفه العالم حتى أتى تايكو براهي بعده بقرن ونصف."
      en: "His tables stayed the world's most accurate until Tycho Brahe, a century and a half later."
      ur: "اس کی جدولیں دنیا کی درست ترین رہیں یہاں تک ڈیڑھ صدی بعد ٹائیکو براہی آیا۔"
  - title: { ar: "النهاية", en: "The end", ur: "اختتام" }
    motif: moon
    narration:
      ar: "فارق الحياة بأمر ابنه عام 1449م، وهُدم مرصده، فلم يبق منه إلا الربع."
      en: "He left this world at his son's command in 1449, and his observatory was razed — only the quadrant survived."
      ur: "1449ء میں اپنے بیٹے کے حکم سے اس دنیا سے رخصت ہوا اور رصد خانہ گرا دیا گیا — صرف ربع دائرہ بچا۔"
  - title: { ar: "الإرث", en: "The legacy", ur: "میراث" }
    motif: star
    narration:
      ar: "اكتشفت أطلال المرصد عام 1908م، وما زال الربع قائماً في سمرقند."
      en: "The observatory's remains were found in 1908; the quadrant still stands in Samarkand."
      ur: "رصد خانے کے کھنڈر 1908ء میں ملے؛ ربع دائرہ آج بھی سمرقند میں کھڑا ہے۔"
