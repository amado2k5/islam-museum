slug: the-samarkand-observatory
title:
  ar: مرصد سمرقند
  en: The Samarkand Observatory
  ur: سمرقند کا رصد خانہ
  fr: L’observatoire de Samarcande
  tr: Semerkant Gözlemevi
  id: Observatorium Samarkand
lede:
  ar: أمير يقيس النجوم بدقة لم يصل إليها أحد قبل التلسكوب — في اثنتي عشرة بطاقة.
  en: A prince who measured the stars with a precision no one matched before the telescope — in twelve cards.
  ur: ایک شہزادہ جس نے ستارے اس درستگی سے ناپے کہ دوربین سے پہلے کوئی نہ پہنچا — بارہ کارڈز میں۔
  fr: En douze cartes, découvre un prince qui mesurait la position des étoiles avec une précision sans égale avant le télescope.
  tr: Bir prens, yıldızları teleskoptan önce kimsenin ulaşamadığı bir hassasiyetle ölçer — on iki kartta.
  id: Seorang pangeran mengukur bintang dengan presisi yang belum pernah dicapai siapa pun sebelum teleskop — dalam dua belas kartu.
