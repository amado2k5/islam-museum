slug: sinans-first-mosque
title:
  ar: "أول مساجد سنان"
  en: "Sinan's First Mosque"
  ur: "سنان کی پہلی مسجد"
lede:
  ar: "ابن الأناضول الذي صار أعظم معماري عثماني — في اثنتي عشرة بطاقة."
  en: "The Anatolian boy who became the Ottomans' greatest architect — in twelve cards."
  ur: "اناطولی کا لڑکا جو عثمانیوں کا عظیم ترین معمار بنا — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/goodwin-ottoman-architecture-1971]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "تذكرة البنيان لصائي؛ دراسات عمارة سنان — إعادة صياغة بأمانة."
cards:
  - title: { ar: "قيصرية", en: "Kayseri", ur: "قیصریہ" }
    motif: mountain
    narration:
      ar: "وُلد سنان في قرية أغيرناس بقيصرية في الأناضول عام 1490م تقريباً."
      en: "Sinan was born in the village of Aghirnas near Kayseri in Anatolia around 1490."
      ur: "سنان 1490ء کے قریب اناطولیہ کے قیصریہ کے گاؤں آغیرناس میں پیدا ہوا۔"
  - title: { ar: "النجارة", en: "The carpenter", ur: "بڑھئی" }
    motif: tree
    narration:
      ar: "تعلم من أبيه النجارة وبناء الحجر، فصارت يده خبيرة بالمادة."
      en: "He learned carpentry and stonework from his father — his hand grew expert in materials."
      ur: "اس نے باپ سے بڑھئی گری اور پتھر کا کام سیکھا — اس کا ہاتھ مواد میں ماہر ہوا۔"
  - title: { ar: "الدّوْشِرمة", en: "The levy", ur: "دوشرمہ" }
    motif: city
    narration:
      ar: "أخذ في نظام الدّوْشِرمة إلى القسطنطينية فصار جندياً إنكشاريّاً."
      en: "He was taken in the devshirme levy to Constantinople and became a Janissary."
      ur: "وہ دوشرمہ نظام میں قسطنطنیہ لیا گیا اور ینگچیری فوجی بنا۔"
  - title: { ar: "الجسور", en: "The bridges", ur: "پل" }
    motif: sea
    narration:
      ar: "في الحروب بنى جسوراً وصوامع حصار، فعرفته العسكرية مهندساً."
      en: "In the wars he built bridges and siege works, and the army knew him as an engineer."
      ur: "جنگوں میں اس نے پل اور محاصرے کے مینار بنائے تو فوج اسے انجینیر جاننے لگی۔"
  - title: { ar: "المنصب", en: "The post", ur: "عہدہ" }
    motif: star
    narration:
      ar: "في 1538م عُيّن كبير معماريي السلطان سليمان القانوني."
      en: "In 1538 he was appointed chief architect to Sultan Süleyman the Lawgiver."
      ur: "1538ء میں وہ سلطان سلیمان قانونی کا سر معمار مقرر ہوا۔"
  - title: { ar: "شاهزاده", en: "Şehzade", ur: "شہزادہ" }
    motif: mosque
    narration:
      ar: "أول أعماله الكبرى: مسجد شاهزاده لابن السلطان محمد المتوفى."
      en: "His first great work: the Şehzade Mosque for the sultan's late son Mehmed."
      ur: "اس کا پہلا بڑا کام: سلطان کے فوت شدہ بیٹے محمد کے لیے شہزادہ مسجد۔"
  - title: { ar: "القبة", en: "The dome", ur: "گنبد" }
    motif: mosque
    narration:
      ar: "قبة تتوسط أربع نصف قباب — توازن جديد لم تصنعه يد قبله."
      en: "A dome centred on four half-domes — a balance no hand had made before."
      ur: "ایک گنبد چار آدھے گنبدوں کے بیچ — توازن جو پہلے کسی ہاتھ نے نہیں بنایا۔"
  - title: { ar: "سليمانية", en: "Süleymaniye", ur: "سلیمانیہ" }
    motif: mosque
    narration:
      ar: "ثم جامع السليمانية: مدينة صغيرة فيها مدرسة ومطبخ ومستشفى ومقبرة."
      en: "Then the Süleymaniye: a small city with schools, kitchen, hospital and cemetery."
      ur: "پھر سلیمانیہ جامع: چھوٹا شہر جس میں مدارس، باورچی خانہ، اسپتال اور قبرستان۔"
  - title: { ar: "الرياضيات", en: "The mathematics", ur: "ریاضی" }
    motif: compass
    narration:
      ar: "قاس كل زاوية ووزن؛ قال إنه لا يبدأ حجراً قبل حساب القواعد."
      en: "He measured every angle and weight, never laying a stone before the base was calculated."
      ur: "اس نے ہر زاویہ اور وزن ناپا؛ قاعدے کے حساب سے پہلے کبھی پتھر نہیں رکھا۔"
  - title: { ar: "الزلازل", en: "The earthquakes", ur: "زلزلے" }
    motif: mountain
    narration:
      ar: "عاشت مساجده زلازل إسطنبول خمسة قرون وما زالت قائمة."
      en: "His mosques survived five centuries of Constantinople's earthquakes and still stand."
      ur: "اس کی مسجدوں نے پانچ صدیوں کے قسطنطنیہ کے زلزلے سہے اور آج بھی کھڑی ہیں۔"
  - title: { ar: "سليمية", en: "Selimiye", ur: "سلیمیہ" }
    motif: star
    narration:
      ar: "في أدرنة بنى السليمية وقال: فيها بلغت — قبة فاقت آيا صوفيا."
      en: "In Edirne he built the Selimiye and said: here I arrived — a dome beyond Hagia Sophia."
      ur: "ادرنہ میں سلیمیہ بنائی اور کہا: اس میں میں پہنچا — ایاصوفیہ سے بڑا گنبد۔"
  - title: { ar: "الإرث", en: "The legacy", ur: "میراث" }
    motif: book
    narration:
      ar: "بنى ثلاثمئة عمل، وتوفي 1588م؛ قال تلامذته: معلم معماريي العالم."
      en: "He built three hundred works and died in 1588; his students call him the world's master builder."
      ur: "اس نے تین سو عمارتیں بنائیں اور 1588ء میں گزرا؛ شاگرد اسے دنیا کے استادِ معمار کہتے ہیں۔"
