title:
  ar: أول مساجد سنان
  en: Sinan's First Mosque
  ur: سنان کی پہلی مسجد
  fr: La première mosquée de Sinan
  tr: Sinan'ın ilk camileri
  id: Masjid-masjid pertama di Sinan
lede:
  ar: ابن الأناضول الذي صار أعظم معماري عثماني — في اثنتي عشرة بطاقة.
  en: The Anatolian boy who became the Ottomans' greatest architect — in twelve cards.
  ur: اناطولی کا لڑکا جو عثمانیوں کا عظیم ترین معمار بنا — بارہ کارڈز میں۔
  fr: En douze cartes, découvre comment un garçon d’Anatolie devint le plus grand architecte ottoman.
  tr: Anadolu'nun oğlu, en büyük Osmanlı mimarı — on iki kartta.
  id: Putra Anatolia yang menjadi arsitek Ottoman terbesar — dalam dua belas kartu.
