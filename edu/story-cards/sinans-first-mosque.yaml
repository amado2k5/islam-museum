cards:
- title:
    ar: قيصرية
    en: Kayseri
    ur: قیصریہ
    fr: Kayseri
    tr: sezaryen
    id: operasi sesar
  motif: mountain
  narration:
    ar: وُلد سنان في قرية أغيرناس بقيصرية في الأناضول عام 1490م تقريباً.
    en: Sinan was born in the village of Aghirnas near Kayseri in Anatolia around 1490.
    ur: سنان 1490ء کے قریب اناطولیہ کے قیصریہ کے گاؤں آغیرناس میں پیدا ہوا۔
    fr: Sinan naquit vers 1490 dans le village d’Ağırnas, près de Kayseri, en Anatolie.
    tr: Sinan, yaklaşık 1490 yılında Anadolu'nun Sezariye bölgesindeki Aghirnas köyünde doğdu.
    id: Sinan lahir di desa Aghirnas di Kaisarea, Anatolia sekitar tahun 1490 M.
- title:
    ar: النجارة
    en: The carpenter
    ur: بڑھئی
    fr: Le charpentier
    tr: Marangozluk
    id: Pertukangan
  motif: tree
  narration:
    ar: تعلم من أبيه النجارة وبناء الحجر، فصارت يده خبيرة بالمادة.
    en: He learned carpentry and stonework from his father — his hand grew expert in materials.
    ur: اس نے باپ سے بڑھئی گری اور پتھر کا کام سیکھا — اس کا ہاتھ مواد میں ماہر ہوا۔
    fr: Son père lui apprit à travailler le bois et la pierre. Il acquit ainsi une grande maîtrise de ces matériaux.
    tr: Marangozluk ve taş yapımını babasından öğrendi ve bu malzemede uzmanlaştı.
    id: Ia belajar pertukangan kayu dan konstruksi batu dari ayahnya, dan tangannya menjadi ahli dalam bahan tersebut.
- title:
    ar: الدّوْشِرمة
    en: The levy
    ur: دوشرمہ
    fr: Le recrutement
    tr: Al-Doshrama
    id: Al-Doshrama
  motif: city
  narration:
    ar: أخذ في نظام الدّوْشِرمة إلى القسطنطينية فصار جندياً إنكشاريّاً.
    en: He was taken in the devshirme levy to Constantinople and became a Janissary.
    ur: وہ دوشرمہ نظام میں قسطنطنیہ لیا گیا اور ینگچیری فوجی بنا۔
    fr: Emmené à Constantinople dans le cadre du devchirmé, le système de recrutement ottoman, il devint janissaire.
    tr: Docherma sistemine Konstantinopolis'e götürüldü ve Yeniçeri askeri oldu.
    id: Ia dibawa ke sistem Docherma ke Konstantinopel dan menjadi tentara Janissari.
- title:
    ar: الجسور
    en: The bridges
    ur: پل
    fr: Les ponts
    tr: köprüler
    id: jembatan
  motif: sea
  narration:
    ar: في الحروب بنى جسوراً وصوامع حصار، فعرفته العسكرية مهندساً.
    en: In the wars he built bridges and siege works, and the army knew him as an engineer.
    ur: جنگوں میں اس نے پل اور محاصرے کے مینار بنائے تو فوج اسے انجینیر جاننے لگی۔
    fr: Pendant les guerres, il construisit des ponts et des ouvrages de siège. L’armée le connaissait pour ses talents d’ingénieur.
    tr: Savaşlar sırasında köprüler ve kuşatma siloları inşa etti ve ordu onu mühendis olarak tanıdı.
    id: Selama perang, ia membangun jembatan dan silo pengepungan, dan militer mengakuinya sebagai seorang insinyur.
- title:
    ar: المنصب
    en: The post
    ur: عہدہ
    fr: La nomination
    tr: Konum
    id: Posisi
  motif: star
  narration:
    ar: في 1538م عُيّن كبير معماريي السلطان سليمان القانوني.
    en: In 1538 he was appointed chief architect to Sultan Süleyman the Lawgiver.
    ur: 1538ء میں وہ سلطان سلیمان قانونی کا سر معمار مقرر ہوا۔
    fr: En 1538, le sultan Soliman le Législateur le nomma architecte en chef.
    tr: 1538'de Sultan Süleyman Yüce tarafından baş mimar olarak atandı.
    id: Pada tahun 1538, ia diangkat sebagai arsitek utama oleh Sultan Suleiman yang Agung.
- title:
    ar: شاهزاده
    en: Şehzade
    ur: شہزادہ
    fr: Şehzade
    tr: prens
    id: pangeran
  motif: mosque
  narration:
    ar: 'أول أعماله الكبرى: مسجد شاهزاده لابن السلطان محمد المتوفى.'
    en: 'His first great work: the Şehzade Mosque for the sultan''s late son Mehmed.'
    ur: 'اس کا پہلا بڑا کام: سلطان کے فوت شدہ بیٹے محمد کے لیے شہزادہ مسجد۔'
    fr: Sa première grande œuvre fut la mosquée Şehzade, à la mémoire de Mehmed, le fils défunt du sultan.
    tr: İlk büyük eseri, merhum İbn Sultan Muhammed'in Şahzade Camii'dir.
    id: Karya besar pertamanya adalah Masjid Shahzadeh milik almarhum Ibn Sultan Muhammad.
- title:
    ar: القبة
    en: The dome
    ur: گنبد
    fr: La coupole
    tr: kubbe
    id: Kubah
  motif: mosque
  narration:
    ar: قبة تتوسط أربع نصف قباب — توازن جديد لم تصنعه يد قبله.
    en: A dome centred on four half-domes — a balance no hand had made before.
    ur: ایک گنبد چار آدھے گنبدوں کے بیچ — توازن جو پہلے کسی ہاتھ نے نہیں بنایا۔
    fr: 'Une coupole centrale flanquée de quatre demi-coupoles : un équilibre qu’aucun bâtisseur n’avait atteint jusque-là.'
    tr: Dört yarım kubbe merkezli bir kubbe — daha önce elle hiç yapılmamış yeni bir denge.
    id: Sebuah kubah yang berpusat pada empat setengah kubah — keseimbangan baru yang belum pernah dibuat oleh tangan sebelumnya.
- title:
    ar: سليمانية
    en: Süleymaniye
    ur: سلیمانیہ
    fr: Süleymaniye
    tr: Süleymaniye
    id: Sulaymaniyah
  motif: mosque
  narration:
    ar: 'ثم جامع السليمانية: مدينة صغيرة فيها مدرسة ومطبخ ومستشفى ومقبرة.'
    en: 'Then the Süleymaniye: a small city with schools, kitchen, hospital and cemetery.'
    ur: 'پھر سلیمانیہ جامع: چھوٹا شہر جس میں مدارس، باورچی خانہ، اسپتال اور قبرستان۔'
    fr: 'Puis vint la Süleymaniye : une petite ville avec ses écoles, sa cuisine, son hôpital et son cimetière.'
    tr: 'Sonra Süleymaniye Camii: okul, mutfak, hastane ve mezarlığı olan küçük bir şehir.'
    id: 'Kemudian Masjid Süleymaniye: sebuah kota kecil dengan sekolah, dapur, rumah sakit, dan pemakaman.'
- title:
    ar: الرياضيات
    en: The mathematics
    ur: ریاضی
    fr: Les mathématiques
    tr: Matematik
    id: Matematika
  motif: compass
  narration:
    ar: قاس كل زاوية ووزن؛ قال إنه لا يبدأ حجراً قبل حساب القواعد.
    en: He measured every angle and weight, never laying a stone before the base was calculated.
    ur: اس نے ہر زاویہ اور وزن ناپا؛ قاعدے کے حساب سے پہلے کبھی پتھر نہیں رکھا۔
    fr: Il mesurait chaque angle et calculait chaque poids. Il ne posait pas une pierre avant d’avoir calculé les fondations.
    tr: Her açıyı ve ağırlığı ölçtü; kuralları hesaplamadan taşı asla başlatmadığını söyledi.
    id: Dia mengukur setiap sudut dan berat; dia bilang dia tidak pernah memulai batu sebelum menghitung aturan.
- title:
    ar: الزلازل
    en: The earthquakes
    ur: زلزلے
    fr: Les séismes
    tr: Depremler
    id: Gempa bumi
  motif: mountain
  narration:
    ar: عاشت مساجده زلازل إسطنبول خمسة قرون وما زالت قائمة.
    en: His mosques survived five centuries of Constantinople's earthquakes and still stand.
    ur: اس کی مسجدوں نے پانچ صدیوں کے قسطنطنیہ کے زلزلے سہے اور آج بھی کھڑی ہیں۔
    fr: Ses mosquées ont traversé cinq siècles de séismes à Constantinople et sont toujours debout.
    tr: Camileri, İstanbul depremlerinden beş yüzyıl boyunca sağ kalmış ve hâlâ ayaktadır.
    id: Masjid-masjidnya bertahan dari gempa bumi Istanbul selama lima abad dan masih berdiri hingga kini.
- title:
    ar: سليمية
    en: Selimiye
    ur: سلیمیہ
    fr: Selimiye
    tr: Salimiya
    id: Salimiya
  motif: star
  narration:
    ar: 'في أدرنة بنى السليمية وقال: فيها بلغت — قبة فاقت آيا صوفيا.'
    en: 'In Edirne he built the Selimiye and said: here I arrived — a dome beyond Hagia Sophia.'
    ur: 'ادرنہ میں سلیمیہ بنائی اور کہا: اس میں میں پہنچا — ایاصوفیہ سے بڑا گنبد۔'
    fr: 'À Edirne, il construisit la Selimiye, qu’il tenait pour son chef-d’œuvre : une coupole qui surpassait celle de Sainte-Sophie.'
    tr: 'Edirne''de El-Süleymiyya''yı inşa etti ve şöyle dedi: Orada, Ayasofya''yı aşan bir kubbeye ulaştım.'
    id: 'Di Edirne, ia membangun Al-Sulaymiyya dan berkata: Di dalamnya, aku mencapai — sebuah kubah yang melampaui Hagia Sophia.'
- title:
    ar: الإرث
    en: The legacy
    ur: میراث
    fr: L’héritage
    tr: Miras
    id: Warisan
  motif: book
  narration:
    ar: 'بنى ثلاثمئة عمل، وتوفي 1588م؛ قال تلامذته: معلم معماريي العالم.'
    en: He built three hundred works and died in 1588; his students call him the world's master builder.
    ur: اس نے تین سو عمارتیں بنائیں اور 1588ء میں گزرا؛ شاگرد اسے دنیا کے استادِ معمار کہتے ہیں۔
    fr: Il réalisa trois cents ouvrages et mourut en 1588. Ses élèves le considèrent comme le plus grand des bâtisseurs.
    tr: 'Üç yüz eser inşa etti ve 1588''de öldü; öğrencileri şöyle derdi: Dünyanın mimarlarının ustası.'
    id: 'Ia membangun tiga ratus karya dan meninggal pada tahun 1588 M; murid-muridnya berkata: Seorang maestro arsitek dunia.'
