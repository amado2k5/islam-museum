cards:
  - title: { ar: "مالي", en: "Mali", ur: "مالی" }
    motif: map
    narration:
      ar: "إمبراطورية مالي في غرب إفريقيا كانت أغنى ممالك عصرها بالذهب."
      en: "The Mali empire in West Africa was its age's richest kingdom in gold."
      ur: "مغربی افریقہ کی سلطنتِ مالی اپنے زمانے کا سنہری ترین ملک تھا۔"
  - title: { ar: "مانسا", en: "The mansa", ur: "مانسا" }
    motif: star
    narration:
      ar: "مانسا موسى حكم مالي من 1312م، وملكها يعني ملك الذهب."
      en: "Mansa Musa ruled Mali from 1312 — being its king meant owning its gold."
      ur: "مانسا موسیٰ نے 1312ء سے مالی پر حکومت کی — اس کا بادشاہ ہونا سونے کا مالک ہونا تھا۔"
  - title: { ar: "النيّة", en: "The pilgrimage", ur: "عزمِ حج" }
    motif: compass
    narration:
      ar: "قرر الحج إلى مكة، فأعد أكبر قافلة عبرت الصحراء."
      en: "He resolved on the Hajj to Makkah and prepared the largest caravan ever to cross the desert."
      ur: "اس نے مکہ کی حج کا ارادہ کیا اور صحرا عبور کرنے والا سب سے بڑا قافلہ تیار کیا۔"
  - title: { ar: "العدد", en: "The number", ur: "تعداد" }
    motif: caravan
    narration:
      ar: "يُروى أن ستين ألفاً خرجوا معه، فيهم جنود وعبيد وقضاة وأدباء."
      en: "It is told that sixty thousand went with him — soldiers, servants, judges and men of letters."
      ur: "کہا جاتا ہے کہ ساٹھ ہزار ساتھ تھے — فوجی، نوکر، قاضی اور ادباء۔"
  - title: { ar: "الذهب", en: "The gold", ur: "سونہ" }
    motif: coin
    narration:
      ar: "حمل الرجال والإبل سبائك الذهب؛ قيل إن خمسمائة عبدٍ حملوا عصياً من ذهب."
      en: "Men and camels bore gold bars; five hundred servants are said to have carried gold staffs."
      ur: "آدمیوں اور اونٹوں نے سونے کی اینٹیں اٹھائیں؛ کہتے ہیں پانچ سو نوکر سونے کی لاٹھیاں لے کر چلے۔"
  - title: { ar: "تمبكتو", en: "Timbuktu", ur: "تمبکتو" }
    motif: city
    narration:
      ar: "من نياني عاصمته إلى تمبكتو — مدينة العلم والتجارة في الصحراء."
      en: "From his capital Niani to Timbuktu — the desert's city of learning and trade."
      ur: "اپنے دارالسلطنت نیانی سے تمبکتو تک — صحرا کا شہر علم اور تجارت کا۔"
  - title: { ar: "القيروان", en: "Through the sands", ur: "ریگستان سے" }
    motif: camel
    narration:
      ar: "عبر الصحراء الكبرى على طريق القيروان ومصر، شهران في الرمل."
      en: "He crossed the great desert on the Kairouan-and-Egypt road — two months of sand."
      ur: "اس نے قیروان اور مصر کے راستے عظیم صحرا عبور کیا — ریت میں دو مہینے۔"
  - title: { ar: "القاهرة", en: "Cairo", ur: "قاہرہ" }
    motif: city
    narration:
      ar: "في القاهرة أنفق من الذهب حتى قيل إن سعره انخفض في السوق سنيناً."
      en: "In Cairo he spent so much gold that its price is said to have fallen for years."
      ur: "قاہرہ میں اس نے اتنا سونہ خرچ کیا کہ کہتے ہیں بازار میں اس کی قیمت برسوں گری۔"
  - title: { ar: "العطاء", en: "The giving", ur: "عطاء" }
    motif: coin
    narration:
      ar: "أعطى الفقراء والعلماء والمضيفين، وما بخل على أحد."
      en: "He gave to the poor, the scholars and his hosts, and withheld from none."
      ur: "اس نے مسکینوں، علماء اور مضبانوں کو دیا اور کسی سے بخل نہ کیا۔"
  - title: { ar: "مكة", en: "Makkah", ur: "مکہ" }
    motif: mosque
    narration:
      ar: "أدى مناسك الحج في مكة، واشترى مدارس ومكتبات لبلده."
      en: "He performed the rites of the Hajj in Makkah, and bought schools and libraries for his country."
      ur: "اس نے مکہ میں مناسکِ حج ادا کیے اور اپنے ملک کے لیے مدارس اور کتابیں خریدیں۔"
  - title: { ar: "العودة", en: "The return", ur: "واپسی" }
    motif: caravan
    narration:
      ar: "رجع إلى مالي بعلماء ومعماريين، وبنى جامع جنگربير في تمبكتو."
      en: "He returned to Mali with scholars and architects, and built Timbuktu's Djinguereber mosque."
      ur: "وہ مالی میں علماء اور معماروں کے ساتھ لوٹا اور تمبکتو میں جنگربیر مسجد بنائی۔"
  - title: { ar: "الذكر", en: "The memory", ur: "یادگار" }
    motif: star
    narration:
      ar: "رسمه الخرائط الأوروبية ملكاً بكرة ذهبية — لا يزال أشهر حكّام إفريقيا."
      en: "European maps drew him as a king with a golden orb — still Africa's most famous ruler."
      ur: "یورپی نقشوں نے اسے سونے کے گولے لئے بادشاہ بنایا — افریقہ کا معروف ترین حکمران آج بھی۔"
