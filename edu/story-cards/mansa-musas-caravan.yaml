title:
  ar: قافلة مانسا موسى
  en: Mansa Musa's Caravan
  ur: مانسا موسیٰ کا قافلہ
  fr: La caravane de Mansa Moussa
  tr: Mansa Musa Konvoyu
  id: Konvoi Mansa Musa
lede:
  ar: أغنى رجل في التاريخ يعبر الصحراء إلى مكة — في اثنتي عشرة بطاقة.
  en: The richest man in history crossing the desert to Makkah — in twelve cards.
  ur: تاریخ کا امیر ترین شخص صحرا پار کر کے مکہ گیا — بارہ کارڈز میں۔
  fr: 'L’homme le plus riche de l’histoire traverse le désert pour aller à La Mecque : son voyage en douze cartes.'
  tr: Tarihin en zengin adamı çölü geçip Mekke'ye gider — on iki kartta.
  id: Orang terkaya dalam sejarah menyeberangi gurun menuju Mekah — dalam dua belas kartu.
