cards:
- title:
    ar: الإذن بالرحيل
    en: Permission to leave
    ur: رخصتِ رحلت
    fr: La permission de partir
    tr: Ayrılma izni
    id: Izin untuk pergi
  motif: moon
  narration:
    ar: في ليلة مباركة جاء الإذن، فخرج رسول الله من بيته وقد نام علي مكانه.
    en: On a blessed night the permission came, and the Prophet left his house while Ali slept in his place.
    ur: ایک مبارک رات اجازت آئی، تو رسول اللہ اپنے گھر سے نکلے جبکہ علی ان کی جگہ سوئے تھے۔
    fr: Une nuit bénie, le prophète Muhammad reçut la permission de partir. Il quitta sa maison tandis qu’Ali dormait à sa place.
    tr: Mübarek bir gecede, ezan geldi ve Allah'ın Elçisi evinden çıktı, Ali ise onun yerine uyudu.
    id: Pada malam yang diberkati, panggilan untuk shalat datang, dan Rasulullah meninggalkan rumahnya, Ali tertidur menggantikannya.
- title:
    ar: بيت صديقة
    en: A loyal friend's house
    ur: وفادار دوست کا گھر
    fr: Chez un ami fidèle
    tr: Bir arkadaşımın evi
    id: Rumah teman
  motif: city
  narration:
    ar: ذهب أولاً إلى بيت أبي بكر، فاتفقا على الخروج معاً في جنح الظلام.
    en: He went first to Abu Bakr's house, and the two agreed to leave together under cover of darkness.
    ur: انہوں نے پہلے ابو بکر کے گھر جاکر مل کر اندھیرے میں نکلنے کا فیصلہ کیا۔
    fr: Il se rendit d’abord chez Abou Bakr. Tous deux convinrent de partir ensemble à la faveur de l’obscurité.
    tr: Önce Ebu Bekir'in evine gitti ve karanlıkta birlikte dışarı çıkmaya karar verdiler.
    id: Dia pertama kali pergi ke rumah Abu Bakr, dan mereka sepakat untuk keluar bersama dalam kegelapan.
- title:
    ar: الغار
    en: The cave
    ur: غار
    fr: La grotte
    tr: defne
    id: laurel
  motif: cave
  narration:
    ar: لجآ إلى غار ثور ثلاثة أيام، والقوم يطلبونهما في كل مكان.
    en: The two sheltered in Thawr's cave for three days while the searchers looked everywhere.
    ur: دونوں غارِ ثور میں تین دن رہے جبکہ طالِبین ہر جگہ ڈھونڈتے رہے۔
    fr: Ils se réfugièrent trois jours dans la grotte de Thawr, pendant que leurs poursuivants les cherchaient partout.
    tr: Üç gün boyunca Thawr mağarasına sığındılar ve halk onları her yerde aradı.
    id: Mereka berlindung di gua Thawr selama tiga hari, dan orang-orang mencari mereka di mana-mana.
- title:
    ar: العنكبوت والحمامة
    en: The spider and the dove
    ur: مکڑی اور کبوتر
    fr: L’araignée et la colombe
    tr: Örümcek ve Güvercin
    id: Laba-laba dan Merpati
  motif: star
  narration:
    ar: تروى الكتب أن عنكبوتاً نسج بيتاً على باب الغار وحامة حاضنت عنده.
    en: The books tell that a spider wove its web at the cave's mouth and a dove nested there.
    ur: کتابوں میں ہے کہ مکڑی نے غار کے منہ پر جالا بُنا اور کبوتر وہاں بیٹھ گئی۔
    fr: Les livres racontent qu’une araignée tissa sa toile à l’entrée de la grotte et qu’une colombe y fit son nid.
    tr: Kitaplar, bir örümceğin körfez kapısında bir ev ördüğünü ve bir yılanın orada kuluçkaya yattığını anlatır.
    id: Buku-buku menceritakan bahwa seekor laba-laba menenun rumah di pintu teluk dan seekor ular mengerami di sana.
- title:
    ar: سراقة
    en: Suraqa's chase
    ur: سراقہ کا تعاقب
    fr: La poursuite de Suraqa
    tr: Hırsızlık
    id: Pencurian
  motif: camel
  narration:
    ar: لحق بهما سراقة بن مالك طمعاً في الجائزة، فساخت قوائم فرسه في الرمل.
    en: Suraqa ibn Malik chased them for the bounty, and his mare's legs sank into the sand.
    ur: انعام کی لالچ میں سراقہ بن مالک نے تعاقب کیا تو اس کی گھوڑی کی ٹانگیں ریت میں دنس گئیں۔
    fr: Suraqa ibn Malik les poursuivit dans l’espoir de toucher la récompense, mais sa jument s’enfonça dans le sable.
    tr: Suraqa ibn Malik, bir ödül umuduyla onları takip etti ve atının bacaklarını kumda kırdı.
    id: Suraqa ibn Malik, berharap mendapatkan hadiah, mengikuti mereka dan mematahkan kaki kudanya di pasir.
- title:
    ar: الدليل
    en: The guide
    ur: رہنما
    fr: Le guide
    tr: Rehber
    id: Panduan
  motif: compass
  narration:
    ar: استأجرا عبد الله بن أريقط دليلاً خبيراً بالطريق، وسار معهما على غير الطريق المعهود.
    en: They hired Abd Allah ibn Urayqit, a guide who knew the sands, and he took them on an untravelled road.
    ur: انہوں نے عبداللہ بن اریقط کو راستے کا ماہر رہنما رکھا اور وہ انہیں نئی راہ سے لے گیا۔
    fr: Ils engagèrent Abdallah ibn Urayqit, un guide qui connaissait le désert. Il les mena par un chemin peu fréquenté.
    tr: Yolda uzman rehber olarak Abdullah ibn Uraqat'ı tuttular ve o da alışılmış olmayan bir güzergahta onlarla birlikte seyahat etti.
    id: Mereka menyewa Abdullah ibn Uraqat sebagai pemandu ahli di jalan, dan ia ikut bersama mereka melalui rute yang tidak biasa.
- title:
    ar: ساحل البحر
    en: The sea coast
    ur: ساحلِ بحر
    fr: Le littoral
    tr: sahil
    id: pantai
  motif: sea
  narration:
    ar: سلكوا طريق الساحل حتى لا يعثر عليهم أحد، والرمل يحفظ آثار النعال.
    en: They travelled the coastal road so none would find them, the sand holding the tracks.
    ur: کوئی انہیں نہ پالے اس لیے انہوں نے ساحل کا راستہ لیا، اور ریت نے نشانات سمیٹ لیے۔
    fr: Ils prirent la route du littoral pour que personne ne les trouve. Le sable gardait leurs empreintes.
    tr: Kimse onları bulmasın diye sahil yolunu tercih ettiler ve kum sandaletlerin ayak izlerini koruyordu.
    id: Mereka mengambil jalan pesisir agar tidak ada yang menemukannya, dan pasir itu menjaga jejak sandal.
- title:
    ar: أم معبد
    en: Umm Ma'bad's tent
    ur: ام معبد کا ڈیرہ
    fr: La tente d’Oumm Mabad
    tr: Tapınağın Annesi
    id: Ibu Bait Suci
  motif: caravan
  narration:
    ar: مرّا بخباء أم معبد الخزاعية، فحلبت لهم الشاة العجفاء لبناً كثيراً.
    en: They passed Umm Ma'bad's tent, and her lean ewe gave them a full pail of milk.
    ur: وہ ام معبد خزاعی کے ڈیرے سے گزرے اور اس کی دبلی بھیڑ نے بھرا بھرا دودھ دیا۔
    fr: Ils passèrent devant la tente d’Oumm Mabad. Sa maigre brebis leur donna un seau entier de lait.
    tr: Um Ma'bad al-Khuza'iyyah'ın saklandığı yerden geçti ve ince koyunlar onlara bolca süt sağdı.
    id: Ia melewati tempat persembunyian um Ma'bad al-Khuza'iyyah, dan domba-domba kurus itu memerah susu mereka dengan banyak.
- title:
    ar: قُباء
    en: Quba
    ur: قباء
    fr: Qouba
    tr: Kubbeler
    id: Kubah
  motif: mosque
  narration:
    ar: في اليوم الثامن وصلا إلى قباء، فنزلا أياماً ووضعا أساس أول مسجد.
    en: On the eighth day they reached Quba and stayed, laying the foundations of the first mosque.
    ur: آٹھویں دن وہ قباء پہنچے اور وہاں ٹھہر کر پہلی مسجد کی بنیاد رکھی۔
    fr: Le huitième jour, ils arrivèrent à Qouba et y séjournèrent, posant les fondations de la première mosquée.
    tr: Sekizinci gün Quba'ya vardılar, günlerce kaldılar ve ilk caminin temelini attılar.
    id: Pada hari kedelapan, mereka tiba di Quba, tinggal selama beberapa hari, dan meletakkan fondasi masjid pertama.
- title:
    ar: يوم الجمعة
    en: The first Friday
    ur: پہلا جمعہ
    fr: Le premier vendredi
    tr: Cuma
    id: Jumat
  motif: tree
  narration:
    ar: في بني سالم بن عوف خطب أول خطبة جمعة في الإسلام.
    en: Among the Banu Salim ibn Awf he delivered Islam's first Friday sermon.
    ur: بنو سالم بن عوف میں انہوں نے اسلام کی پہلی جمعہ کی خطبہ دی۔
    fr: Chez les Banou Salim ibn Awf, le Prophète prononça le premier sermon du vendredi de l’islam.
    tr: Banu Salim ibn Awf'ta İslam'da ilk Cuma vaazını verdi.
    id: Dalam Banu Salim ibn Awf, ia menyampaikan khotbah Jumat pertama dalam Islam.
- title:
    ar: الأنصار ينتظرون
    en: The Ansar wait
    ur: انصار کا انتظار
    fr: L’attente des Ansar
    tr: Taraftarlar bekliyor
    id: Para pendukung menunggu
  motif: city
  narration:
    ar: 'كان أهل المدينة يخرجون كل ضحى إلى الحرة ينتظرون، حتى نادى يهودي: قد جاء.'
    en: 'The people of Madinah waited on the lava ridge each morning, until a Jew cried: he has come.'
    ur: 'اہلِ مدینہ ہر صبح الحرہ پر منتظر رہتے، یہاں تک کہ ایک یہودی نے پکارا: وہ آ گئے۔'
    fr: Chaque matin, les habitants de Médine attendaient sur la crête de lave, jusqu’au jour où un homme juif s’écria que Muhammad arrivait.
    tr: 'Medine halkı, her sabah boş yere gider, bir Yahudi seslenene kadar: O geldi.'
    id: 'Orang-orang Madinah akan keluar setiap pagi ke tempat bebas menunggu, sampai seorang Yahudi berseru: Dia telah datang.'
- title:
    ar: المدينة المنورة
    en: The radiant city
    ur: مدینہ منورہ
    fr: La ville lumineuse
    tr: Medine
    id: Madinah
  motif: mosque
  narration:
    ar: دخل المدينة والناس ينشدون، فصارت يثرب دار الهجرة ومنارة الإسلام.
    en: He entered Madinah to singing crowds, and Yathrib became the home of the Hijra and Islam's beacon.
    ur: وہ مدینہ میں داخل ہوئے اور لوگ نغمے گاتے رہے؛ یثرب ہجرت کا گھر اور اسلام کا مینار بن گئی۔
    fr: La foule chanta à son entrée dans Médine. Yathrib devint le refuge de l’Hégire et un foyer de l’islam.
    tr: Halk ilahi sözleri söylerken şehre girdi ve Yathrib göç merkezi ve İslam'ın simgesi oldu.
    id: Ia memasuki kota sementara orang-orang bernyanyi, dan Yathrib menjadi pusat migrasi serta mercusuar Islam.
