slug: the-year-of-sorrow
title:
  ar: "عام الحزن"
  en: "The Year of Sorrow"
  ur: "عامِ غم"
lede:
  ar: "سنة فقد فيها النبي عمّه أبا طالب وزوجته خديجة — في اثنتي عشرة بطاقة."
  en: "The year the Prophet lost his uncle Abu Talib and his wife Khadijah — in twelve cards."
  ur: "وہ سال جب نبی نے اپنے چچا ابو طالب اور بیوی خدیجہ کو کھویا — بارہ کارڈز میں۔"
status: { review: published }
sources: [source/ibn-hisham-saqqa, source/ibn-sad-tabaqat-bewley]

provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "سيرة ابن هشام؛ الرحيق المختوم — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "أبو طالب", en: "Abu Talib", ur: "ابو طالب" }
    motif: mountain
    narration:
      ar: "أبو طالب عم النبي وكافله منذ صغره وحماه من قريش أربعين سنة."
      en: "Abu Talib was the Prophet's uncle, his guardian since childhood, his shield from Quraysh for forty years."
      ur: "ابو طالب نبی کے چچا تھے، بچپن سے ان کے کافل اور چالیس برس قریش سے ان کے ڈھال۔"
  - title: { ar: "خديجة", en: "Khadijah", ur: "خدیجہ" }
    motif: tree
    narration:
      ar: "خديجة بنت خويلد أول من آمن به، زوجته وأم أولاده وأول مؤمنة."
      en: "Khadijah bint Khuwaylid was the first to believe in him — his wife, mother of his children, first believer."
      ur: "خدیجہ بنت خویلد پہلی مومن تھیں — ان کی بیوی، اولاد کی ماں، سب سے پہلی ایمان والی۔"
  - title: { ar: "الحصار", en: "The boycott", ur: "محاصرہ" }
    motif: city
    narration:
      ar: "قبلهما بسنوات حاصرت قريش بني هاشم في الشعب ثلاث سنين."
      en: "Years before, Quraysh had besieged the Banu Hashim in the valley for three years."
      ur: "اس سے پہلے قریش نے بنو ہاشم کو شعب میں تین برس محاصرہ کیا تھا۔"
  - title: { ar: "الجوع", en: "The hunger", ur: "بھوک" }
    motif: moon
    narration:
      ar: "أكل الناس ورق الشجر والجلود من الجوع حتى انتهى الحصار."
      en: "People ate tree leaves and hides from hunger until the boycott ended."
      ur: "بھوک سے لوگ درخت کے پتے اور کھالیں کھاتے رہے یہاں تک کہ محاصرہ ختم ہوا۔"
  - title: { ar: "المرض", en: "The illness", ur: "بیماری" }
    motif: moon
    narration:
      ar: "في السنة العاشرة من البعثة مرض أبو طالب مرضاً شديداً."
      en: "In the tenth year of the mission Abu Talib fell gravely ill."
      ur: "بعثت کے دسویں سال ابو طالب سخت بیمار ہوئے۔"
  - title: { ar: "الوفاة", en: "The passing", ur: "وصال" }
    motif: star
    narration:
      ar: "توفي أبو طالب ولم يقل كلمة الشهادة، فحزن عليه النبي حزناً شديداً."
      en: "Abu Talib passed without saying the testimony; the Prophet grieved for him deeply."
      ur: "ابو طالب شہادت کہے بغیر گزر گئے؛ نبی ان پر بہت غمگین ہوئے۔"
  - title: { ar: "خديجة أيضاً", en: "Khadijah too", ur: "خدیجہ بھی" }
    motif: tree
    narration:
      ar: "وبعده بأيام، قيل ثلاثة أو خمسة وثلاثين، توفيت خديجة."
      en: "Days after him — some say three, some thirty-five — Khadijah passed."
      ur: "ان کے بعد دنوں میں — کہتے ہیں تین یا پینتیس — خدیجہ گزر گئیں۔"
  - title: { ar: "عام الحزن", en: "The naming", ur: "نام" }
    motif: book
    narration:
      ar: "سُميت تلك السنة عام الحزن لشدة ما أصاب النبي فيها."
      en: "That year was named the Year of Sorrow for how much befell the Prophet in it."
      ur: "اس سال کو عامِ غم کہا گیا اس شدید مصیبت کے لیے جو اس پر آئی۔"
  - title: { ar: "الطائف", en: "Ta'if", ur: "طائف" }
    motif: mountain
    narration:
      ar: "خرج إلى الطائف ينادي أهلها، فردّوه وأغروا به سفهاءهم فرجع مجروحاً."
      en: "He went to Ta'if calling its people; they refused and set their riffraff on him until he returned wounded."
      ur: "وہ طائف گئے، لوگوں نے انکار کیا اور سفلے لگائے؛ وہ زخمی لوٹے۔"
  - title: { ar: "حائط", en: "The garden", ur: "باغ" }
    motif: tree
    narration:
      ar: "دخل حائطاً لابني ربيعة فاستظل تحته، وواساه غلام نصراني."
      en: "He sheltered in the two Rabi'a sons' garden, and a Christian boy comforted him."
      ur: "وہ ربیعہ کے بیٹوں کے باغ میں ٹھہرے، ایک مسیحی لڑکے نے تسلی دی۔"
  - title: { ar: "الملك", en: "The angel's offer", ur: "فرشتے کی پیشکش" }
    motif: mountain
    narration:
      ar: "قال ملك الجبال: إن شئت أطبقت عليهم الأخشبين؛ فقال: لا، لعل الله يخرج من أصلابهم من يعبده."
      en: "The angel of the mountains offered to close the two mountains on them; he said: no — perhaps God will bring worshippers from their offspring."
      ur: "پہاڑوں کے فرشتے نے پیشکش کی کہ پہاڑ ملا دوں؛ انہوں نے کہا: نہیں، شاید اللہ ان کی اولاد سے عبادت کرنے والے نکالے۔"
  - title: { ar: "السماء", en: "The heavens open", ur: "آسمان کھلے" }
    motif: star
    narration:
      ar: "ثم كانت رحلة الإسراء والمعراج، فصار صدره للسماء والأوس والخزرج يبايعون."
      en: "Then came the journey of Isra' and Mi'raj, and soon the Aws and Khazraj were pledging."
      ur: "پھر معراج کا سفر آیا اور جلد اوس اور خزرج بیعت کرنے لگے۔"
