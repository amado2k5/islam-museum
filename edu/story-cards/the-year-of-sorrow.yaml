lede:
  ar: سنة فقد فيها النبي عمّه أبا طالب وزوجته خديجة — في اثنتي عشرة بطاقة.
  en: The year the Prophet lost his uncle Abu Talib and his wife Khadijah — in twelve cards.
  ur: وہ سال جب نبی نے اپنے چچا ابو طالب اور بیوی خدیجہ کو کھویا — بارہ کارڈز میں۔
  fr: En douze cartes, l’année où le prophète Muhammad perdit son oncle Abou Talib et son épouse Khadija.
  tr: Peygamber'in amcası Ebu Talib ve eşi Hadijah'ı on iki kartta kaybettiği bir yıl.
  id: Tahun di mana Nabi kehilangan pamannya Abu Talib dan istrinya Khadijah—dalam dua belas kartu.
