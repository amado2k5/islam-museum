slug: first-revelation-in-hira
title:
  ar: "الوحي الأول في حراء"
  en: "First Revelation in Hira"
  ur: "غارِ حرا میں پہلی وحی"
lede:
  ar: "في غار حراء بدأت الكلمة — قصة نزول الوحي في اثنتي عشرة بطاقة."
  en: "In the cave of Hira the Word began — the story of the first revelation in twelve cards."
  ur: "غارِ حرا میں کلمہ اترنا شروع ہوا — پہلی وحی کی کہانی بارہ کارڈز میں۔"
status: { review: published }
provenance:
  generated_by: "Devin"
  model: "Devin (Cognition)"
  run: "education-E5-story-cards"
  source: "سيرة ابن هشام؛ صحيح البخاري، بدء الوحي — إعادة صياغة بأمانة، صيغة أطفال."
cards:
  - title: { ar: "جبل النور", en: "The mountain", ur: "کوہِ نور" }
    motif: mountain
    narration:
      ar: "شمال مكة يقف جبل النور، وفيه غار صغير يقبل شخصاً واحداً أو اثنين."
      en: "North of Makkah stands the Mountain of Light, with a small cave that holds one or two."
      ur: "مکہ کے شمال میں کوہِ نور ہے، جس میں ایک چھوٹی غار ہے جو ایک دو آدمیوں کو سماتی ہے۔"
  - title: { ar: "الخلاء", en: "The retreat", ur: "تنہائی" }
    motif: cave
    narration:
      ar: "كان يخلو بنفسه في الغار فيتحنث الليالي، يتفكر في السماوات والأرض."
      en: "He would withdraw to the cave for nights of worship, pondering the heavens and the earth."
      ur: "وہ غار میں تنہا رہتے اور راتوں عبادت میں گزارتے، آسمانوں اور زمین پر غور کرتے۔"
  - title: { ar: "رؤيا صادقة", en: "True dreams", ur: "سچے خواب" }
    motif: moon
    narration:
      ar: "قبل الوحي رأى أحلاماً صادقة تأتي مثل فلق الصبح."
      en: "Before the revelation he saw true dreams that came like the break of dawn."
      ur: "وحی سے پہلے انھیں ایسے سچے خواب آئے جو صبح کی کرن کی طرح ظاہر ہوئے۔"
  - title: { ar: "ليلة القدر", en: "The night", ur: "مقصدِ شب" }
    motif: moon
    narration:
      ar: "وفي شهر رمضان، في ليلة من لياليها العشر الأخير، تغير كل شيء."
      en: "And in the month of Ramadan, on one of its last ten nights, everything changed."
      ur: "اور رمضان کے مہینے میں، اس کی آخری عشرہ کی ایک رات، سب کچھ بدل گیا۔"
  - title: { ar: "الملك", en: "The angel", ur: "فرشتہ" }
    motif: star
    narration:
      ar: "جاءه الملك فقال: اقرأ؛ فأجاب: ما أنا بقارئ."
      en: "The angel came to him and said: read; he answered: I am not a reader."
      ur: "فرشتہ آیا اور کہا: پڑھو؛ اس نے جواب دیا: میں پڑھا ہوا نہیں ہوں۔"
  - title: { ar: "ضمّة", en: "The embrace", ur: "گھیرا" }
    motif: star
    narration:
      ar: "فأخذه الملك فضمه حتى بلغ منه الجهد، ثم قال: اقرأ."
      en: "The angel took him and pressed him until he could bear no more, then said: read."
      ur: "فرشتے نے اسے لیا اور اتنا دبایا کہ سخت ہو گیا، پھر کہا: پڑھو۔"
  - title: { ar: "الكلمات الأولى", en: "The first words", ur: "پہلے کلمات" }
    motif: book
    narration:
      ar: "فنزلت أول آيات سورة العلق: اقرأ باسم ربك الذي خلق."
      en: "The first verses of Surat al-Alaq came down: read in the name of your Lord who created."
      ur: "سورۃ علق کی پہلی آیات اتریں: اپنے رب کے نام سے پڑھو جس نے پیدا کیا۔"
  - title: { ar: "الرجفة", en: "The trembling", ur: "لرزش" }
    motif: mountain
    narration:
      ar: "عاد إلى خديجة وقلبه يرتجف وقال: زملوني زملوني، فغطّته."
      en: "He returned to Khadijah with a trembling heart saying: wrap me, wrap me — and she did."
      ur: "وہ خدیجہ کے پاس لرزتا ہوا دل لے کر آئے اور کہا: مجھے اوڑھا دو، تو انہوں نے اوڑھا دیا۔"
  - title: { ar: "خديجة", en: "Khadijah's words", ur: "خدیجہ کے الفاظ" }
    motif: tree
    narration:
      ar: "قالت له: لا يخزيك الله أبداً، إنك لتصل الرحم وتحمل الكل وتقرى الضيف."
      en: "She said: God will never disgrace you — you keep ties of kin, carry burdens and feed guests."
      ur: "اس نے کہا: اللہ کبھی تمھیں ذلیل نہیں کرے گا؛ تم صلہ رحمی کرتے ہو، بوجھ اٹھاتے ہو اور مہمان نوازی کرتے ہو۔"
  - title: { ar: "ورقة", en: "Waraqa", ur: "ورقہ" }
    motif: manuscript
    narration:
      ar: "أخذته إلى ابن عمها ورقة بن نوفل، فقال: هذا الناموس الذي أنزل على موسى."
      en: "She took him to her cousin Waraqa ibn Nawfal, who said: this is the law revealed to Moses."
      ur: "اس نے انہیں اپنے چچازاد ورقہ بن نوفل کے پاس لے گئی، جس نے کہا: یہ وہی شریعت ہے جو موسیٰ پر اتری۔"
  - title: { ar: "فترة", en: "The pause", ur: "وقفہ" }
    motif: moon
    narration:
      ar: "ثم فتر الوحي فترة، فكان يحزن حتى جاءه الملك مرة أخرى."
      en: "Then the revelation paused for a time, and he grieved until the angel came again."
      ur: "پھر وحی کچھ عرصہ رکی، تو وہ غمگین رہے یہاں تک کہ فرشتہ پھر آیا۔"
  - title: { ar: "البداية", en: "The beginning", ur: "آغاز" }
    motif: star
    narration:
      ar: "ومن تلك الليلة بدأ النور ينزل على الأرض آية آية، حتى اكتمل الدين."
      en: "From that night the light began descending on earth verse by verse, until the faith was complete."
      ur: "اسی رات سے نور زمین پر آیت بہ آیت اترتا رہا، یہاں تک کہ دین مکمل ہوا۔"
