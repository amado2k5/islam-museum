cards:
- title:
    ar: جبل النور
    en: The mountain
    ur: کوہِ نور
    fr: Le mont de la Lumière
    tr: Cebel-Nur
    id: Jabal al-Noor
  motif: mountain
  narration:
    ar: شمال مكة يقف جبل النور، وفيه غار صغير يقبل شخصاً واحداً أو اثنين.
    en: North of Makkah stands the Mountain of Light, with a small cave that holds one or two.
    ur: مکہ کے شمال میں کوہِ نور ہے، جس میں ایک چھوٹی غار ہے جو ایک دو آدمیوں کو سماتی ہے۔
    fr: Au nord de La Mecque se dresse le mont de la Lumière. Sa petite grotte peut abriter une ou deux personnes.
    tr: Mekke'nin kuzeyinde, bir veya iki kişinin sığabileceği küçük bir mağarası bulunan Jabal al-Noor bulunur.
    id: Di utara Mekah berdiri Jabal al-Noor, yang memiliki gua kecil yang dapat menampung satu atau dua orang.
- title:
    ar: الخلاء
    en: The retreat
    ur: تنہائی
    fr: La retraite
    tr: Boş alan
    id: Ruang kosong
  motif: cave
  narration:
    ar: كان يخلو بنفسه في الغار فيتحنث الليالي، يتفكر في السماوات والأرض.
    en: He would withdraw to the cave for nights of worship, pondering the heavens and the earth.
    ur: وہ غار میں تنہا رہتے اور راتوں عبادت میں گزارتے، آسمانوں اور زمین پر غور کرتے۔
    fr: Muhammad se retirait dans la grotte pour passer des nuits à prier et à méditer sur les cieux et la terre.
    tr: Kendini mağarada izole eder, geceleri düşünür, gökyüzünü ve yeri düşünürdü.
    id: Dia mengasingkan diri di gua, merenungkan malam-malam, merenungkan langit dan bumi.
- title:
    ar: رؤيا صادقة
    en: True dreams
    ur: سچے خواب
    fr: Des rêves véridiques
    tr: Samimi bir vizyon
    id: Sebuah visi yang tulus
  motif: moon
  narration:
    ar: قبل الوحي رأى أحلاماً صادقة تأتي مثل فلق الصبح.
    en: Before the revelation he saw true dreams that came like the break of dawn.
    ur: وحی سے پہلے انھیں ایسے سچے خواب آئے جو صبح کی کرن کی طرح ظاہر ہوئے۔
    fr: Avant la révélation, il eut des rêves véridiques, clairs comme le jour qui se lève.
    tr: Vahiyden önce, şafak sökerken gelen gerçek rüyalar gördü.
    id: Sebelum pengungkapan itu, dia melihat mimpi nyata yang datang seperti fajar.
- title:
    ar: ليلة القدر
    en: The night
    ur: مقصدِ شب
    fr: La Nuit du Destin
    tr: Leylat el-Kadr
    id: Laylat al-Qadr
  motif: moon
  narration:
    ar: وفي شهر رمضان، في ليلة من لياليها العشر الأخير، تغير كل شيء.
    en: And in the month of Ramadan, on one of its last ten nights, everything changed.
    ur: اور رمضان کے مہینے میں، اس کی آخری عشرہ کی ایک رات، سب کچھ بدل گیا۔
    fr: Au mois de ramadan, pendant l’une des dix dernières nuits, tout changea.
    tr: Ve Ramazan ayında, son on gecesinden birinde, her şey değişti.
    id: Dan di bulan Ramadan, di salah satu dari sepuluh malam terakhirnya, segalanya berubah.
- title:
    ar: الملك
    en: The angel
    ur: فرشتہ
    fr: L’ange
    tr: Kral
    id: Raja
  motif: star
  narration:
    ar: 'جاءه الملك فقال: اقرأ؛ فأجاب: ما أنا بقارئ.'
    en: 'The angel came to him and said: read; he answered: I am not a reader.'
    ur: 'فرشتہ آیا اور کہا: پڑھو؛ اس نے جواب دیا: میں پڑھا ہوا نہیں ہوں۔'
    fr: L’ange vint lui demander de lire, mais Muhammad répondit qu’il ne savait pas lire.
    tr: 'Kral yanına geldi ve dedi ki: Oku; o da cevap verdi: Ben okuyucu değilim.'
    id: 'Raja datang kepadanya dan berkata: Bacalah; ia menjawab: Saya bukan pembaca.'
- title:
    ar: ضمّة
    en: The embrace
    ur: گھیرا
    fr: L’étreinte
    tr: canlı
    id: Vivid
  motif: star
  narration:
    ar: 'فأخذه الملك فضمه حتى بلغ منه الجهد، ثم قال: اقرأ.'
    en: 'The angel took him and pressed him until he could bear no more, then said: read.'
    ur: 'فرشتے نے اسے لیا اور اتنا دبایا کہ سخت ہو گیا، پھر کہا: پڑھو۔'
    fr: L’ange le serra jusqu’à ce qu’il n’en puisse plus, puis lui demanda de nouveau de lire.
    tr: 'Kral onu yakaladı, yorulana kadar sarıldı, sonra dedi ki: Oku.'
    id: 'Raja menangkapnya dan memeluknya sampai kelelahan, lalu berkata: Bacalah.'
- title:
    ar: الكلمات الأولى
    en: The first words
    ur: پہلے کلمات
    fr: Les premiers mots
    tr: İlk Sözler
    id: Kata Pertama
  motif: book
  narration:
    ar: فنزلت أول آيات سورة العلق تأمره بالقراءة باسم ربه الخالق.
    en: The first verses of Surat al-Alaq came down, calling him to read in his creating Lord's name.
    ur: سورۃ علق کی پہلی آیات اتریں، جن میں پیدا کرنے والے رب کے نام سے پڑھنے کا حکم تھا۔
    fr: Les premiers versets révélés, au début de la sourate Al-Alaq, associent la lecture au rappel de Dieu, le Créateur.
    tr: Al-'Alaq Suresi'nin ilk ayetleri vahyedildi ve ona Rab Yaratıcısının adıyla okuması emredildi.
    id: Ayat-ayat pertama Surah Al-'Alaq diwahyukan, memerintahkan dia untuk melafalkan atas nama Tuhannya Sang Pencipta.
- title:
    ar: الرجفة
    en: The trembling
    ur: لرزش
    fr: Le tremblement
    tr: titreme
    id: getaran
  motif: mountain
  narration:
    ar: 'عاد إلى خديجة وقلبه يرتجف وقال: زملوني زملوني، فغطّته.'
    en: 'He returned to Khadijah with a trembling heart saying: wrap me, wrap me — and she did.'
    ur: 'وہ خدیجہ کے پاس لرزتا ہوا دل لے کر آئے اور کہا: مجھے اوڑھا دو، تو انہوں نے اوڑھا دیا۔'
    fr: Il revint vers Khadija, le cœur tremblant. Il lui demanda avec insistance de le couvrir, et elle le couvrit.
    tr: 'Kalbi titreyerek Khadijah''a döndü ve dedi ki: ''Bana katıldılar, bana katıldılar,'' ben de onu örttüm.'
    id: 'Ia kembali kepada Khadijah, hatinya bergetar, dan berkata: ''Mereka bergabung denganku, mereka bergabung denganku,'' jadi aku menutupinya.'
- title:
    ar: خديجة
    en: Khadijah's words
    ur: خدیجہ کے الفاظ
    fr: Les paroles de Khadija
    tr: Khadija
    id: Khadija
  motif: tree
  narration:
    ar: 'قالت له: لا يخزيك الله أبداً، إنك لتصل الرحم وتحمل الكل وتقرى الضيف.'
    en: 'She said: God will never disgrace you — you keep ties of kin, carry burdens and feed guests.'
    ur: 'اس نے کہا: اللہ کبھی تمھیں ذلیل نہیں کرے گا؛ تم صلہ رحمی کرتے ہو، بوجھ اٹھاتے ہو اور مہمان نوازی کرتے ہو۔'
    fr: 'Elle lui assura que Dieu ne l’abandonnerait pas : il entretenait les liens de parenté, aidait les personnes dans le besoin et accueillait ses hôtes.'
    tr: 'Ona dedi ki: Tanrı seni asla küçük düşürmesin; akrabalık bağlarını sürdür, herkesi taşır ve misafirleri kabul edersin.'
    id: 'Dia berkata kepadanya: Semoga Tuhan tidak pernah mempermalukanmu; kamu menjaga ikatan kekerabatan, menggendong semua orang, dan menyambut tamu.'
- title:
    ar: ورقة
    en: Waraqa
    ur: ورقہ
    fr: Waraqa
    tr: Kağıt
    id: Kertas
  motif: manuscript
  narration:
    ar: 'أخذته إلى ابن عمها ورقة بن نوفل، فقال: هذا الناموس الذي أنزل على موسى.'
    en: 'She took him to her cousin Waraqa ibn Nawfal, who said: this is the law revealed to Moses.'
    ur: 'اس نے انہیں اپنے چچازاد ورقہ بن نوفل کے پاس لے گئی، جس نے کہا: یہ وہی شریعت ہے جو موسیٰ پر اتری۔'
    fr: Elle le conduisit chez son cousin Waraqa ibn Nawfal, qui reconnut en cet ange le messager de la révélation faite à Moïse.
    tr: 'Onu kuzeni Varaka ibn Nevfal''e götürdü ve o da şöyle dedi: Bu, Musa''ya vahyedilen yasadır.'
    id: 'Ia membawanya kepada sepupunya Waraqah ibn Nawfal, yang berkata: Inilah hukum yang diwahyukan kepada Musa.'
- title:
    ar: فترة
    en: The pause
    ur: وقفہ
    fr: L’interruption
    tr: Dönem
    id: Periode
  motif: moon
  narration:
    ar: ثم فتر الوحي فترة، فكان يحزن حتى جاءه الملك مرة أخرى.
    en: Then the revelation paused for a time, and he grieved until the angel came again.
    ur: پھر وحی کچھ عرصہ رکی، تو وہ غمگین رہے یہاں تک کہ فرشتہ پھر آیا۔
    fr: Puis la révélation s’interrompit quelque temps. Muhammad en fut attristé jusqu’au retour de l’ange.
    tr: Sonra bu açıklama bir süre kesintiye uğradı ve kral tekrar yanına gelene kadar üzgündü.
    id: Kemudian pengungkapan itu terhenti sejenak, dan dia sedih sampai raja datang lagi kepadanya.
- title:
    ar: البداية
    en: The beginning
    ur: آغاز
    fr: Le commencement
    tr: Başlangıç
    id: Awal Mula
  motif: star
  narration:
    ar: ومن تلك الليلة بدأ النور ينزل على الأرض آية آية، حتى اكتمل الدين.
    en: From that night the light began descending on earth verse by verse, until the faith was complete.
    ur: اسی رات سے نور زمین پر آیت بہ آیت اترتا رہا، یہاں تک کہ دین مکمل ہوا۔
    fr: À partir de cette nuit, la lumière de la révélation descendit sur terre, verset après verset, jusqu’à ce que la religion soit complète.
    tr: O geceden itibaren, din tamamlanana kadar kıta ayet yer dünyaya ışık inmeye başladı.
    id: Sejak malam itu, cahaya mulai turun ke bumi ayat demi bait, hingga agama itu selesai.
