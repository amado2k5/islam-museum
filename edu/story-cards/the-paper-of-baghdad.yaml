lede:
  ar: من سمرقند إلى بغداد — كيف وصل الكاغد إلى العالم الإسلامي وغيّره — في اثنتي عشرة بطاقة.
  en: From Samarqand to Baghdad — how paper reached the Islamic world and changed it — in twelve cards.
  ur: سمرقند سے بغداد تک — کاغذ اسلامی دنیا میں کیسے آیا اور اسے بدل دیا — بارہ کارڈز میں۔
  fr: De Samarcande à Bagdad, découvre en douze cartes comment le papier est arrivé dans le monde islamique et l’a transformé.
  tr: Semerkant'tan Bağdat'a—Kağıt İslam Dünyasına ve Ötesine Nasıl Ulaştı—on iki kartta.
  id: Dari Samarkand ke Baghdad—Bagaimana Kertas Sampai ke Dunia Islam dan Lebih Lagi—dalam dua belas kartu.
