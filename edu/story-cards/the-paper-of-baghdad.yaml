cards:
  - title: { ar: "قبل الورق", en: "Before paper", ur: "کاغذ سے پہلے" }
    motif: manuscript
    narration:
      ar: "كان الناس يكتبون على الرّق والعظام والخزف، وكلها ثقيلة وغالية."
      en: "People wrote on parchment, bones and potsherds — all heavy and costly."
      ur: "لوگ چمڑے، ہڈیوں اور سفالینہ پر لکھتے تھے — سب بھاری اور مہنگے۔"
  - title: { ar: "معركة طلاس", en: "The battle of Talas", ur: "تلاس کی لڑائی" }
    motif: mountain
    narration:
      ar: "في عام 751م التقى الجيش العباسي مع الصين عند نهر طلاس، وأسروا صُنّاعاً."
      en: "In 751 CE the Abbasid army met the Chinese at the Talas river, and captured craftsmen."
      ur: "751ء میں عباسی فوج چینیوں سے دریاۓ تلاس پر ملی اور کاریگر قیدی آئے۔"
  - title: { ar: "سمرقند", en: "Samarqand", ur: "سمرقند" }
    motif: city
    narration:
      ar: "في سمرقند علّم الأسرى أهلها صناعة الكاغد من خرق الكتان والقماش."
      en: "In Samarqand the captives taught its people to make paper from linen rags."
      ur: "سمرقند میں قیدیوں نے لوگوں کو کتان کے چیتھڑوں سے کاغذ بنانا سکھایا۔"
  - title: { ar: "الخرق", en: "The rags", ur: "چیتھڑے" }
    motif: book
    narration:
      ar: "تدق الخرق وتهرى بالماء حتى تصير لباً يبسط ويُجفَّف."
      en: "The rags are pounded and mashed in water into pulp, then spread and dried."
      ur: "چیتھڑے کُٹے اور پانی میں ملیے جاتے ہیں تا لُب بنے، پھر بچھا کر سوکھایا۔"
  - title: { ar: "أول سوق", en: "The first market", ur: "پہلا بازار" }
    motif: city
    narration:
      ar: "صار لسمرقند سوق للكاغد يُباع فيه ويُرحَّل إلى المشرق والمغرب."
      en: "Samarqand gained a paper market selling west and east."
      ur: "سمرقند کا کاغذ کا بازار بنا جو مشرق و مغرب بھیجتا تھا۔"
  - title: { ar: "بغداد", en: "Baghdad", ur: "بغداد" }
    motif: city
    narration:
      ar: "في عهد هارون الرشيد وصل الكاغد إلى بغداد وفتحت الوراقين سوقهم."
      en: "Under Harun al-Rashid paper reached Baghdad, and the warraqin opened their book-market."
      ur: "ہارون الرشید کے زمانے میں کاغذ بغداد آیا اور وراقین نے بازار کھولا۔"
  - title: { ar: "الوراق", en: "The warraq", ur: "وراق" }
    motif: pen
    narration:
      ar: "الوراق مهنة: بائع الورق، ونساخ الكتب، وجامع المخطوطات."
      en: "The warraq was a trade: paper seller, book copier and manuscript collector in one."
      ur: "وراق ایک پیشہ تھا: کاغذ بیچنا، کتابیں نقل کرنا اور مخطوطات جمع کرنا۔"
  - title: { ar: "المكتبات", en: "The libraries", ur: "کتاب خانے" }
    motif: book
    narration:
      ar: "كثرت الكتب الرخيصة، فملأت المكتبات الخاصة والعامة."
      en: "Cheap books multiplied and filled private and public libraries."
      ur: "سستی کتابیں کثرت سے بھر گئیں نجی اور عام کتاب خانے۔"
  - title: { ar: "بيت الحكمة", en: "The House of Wisdom", ur: "بیت الحکمت" }
    motif: star
    narration:
      ar: "أثّر الورق في بيت الحكمة: الترجمة والنسخ أصبحتا صناعة مدينة."
      en: "Paper powered the House of Wisdom: translation and copying became a city industry."
      ur: "کاغذ نے بیت الحکمت کو چلایا: ترجمہ اور نقل شہر کی صنعت بن گئے۔"
  - title: { ar: "مصر", en: "Egypt", ur: "مصر" }
    motif: city
    narration:
      ar: "في مصر بنيت مطاحن الكاغد وصارت صناعة عربية لا صينية."
      en: "In Egypt paper mills rose; it became an Arab craft, no longer Chinese."
      ur: "مصر میں کاغذ کی چکیاں لگیں؛ یہ عرب صنعت بن گئی، چینی نہیں رہی۔"
  - title: { ar: "الأندلس", en: "Al-Andalus", ur: "اندلس" }
    motif: sea
    narration:
      ar: "في الأندلس صارت مدينة شاطبة أعظم ميناء للكاغد، يصدر إلى أوروبا."
      en: "In al-Andalus the city of Shatiba became paper's greatest port, exporting to Europe."
      ur: "اندلس میں شاطبہ شہر کاغذ کی سب سے بڑی بندرگاہ بنا، یورپ برآمد کرتا۔"
  - title: { ar: "الثورة", en: "The revolution", ur: "انقلاب" }
    motif: star
    narration:
      ar: "قال المؤرخون: الكاغد غيّر العالم كما غيّرت الطباعة بعده — كتاب في كل بيت."
      en: "Historians say paper changed the world as printing did later — a book in every home."
      ur: "مؤرخین کہتے ہیں: کاغذ نے دنیا بدلی جیسے بعد میں چھاپہ نے — ہر گھر میں کتاب۔"
