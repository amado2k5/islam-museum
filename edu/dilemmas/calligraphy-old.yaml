id: calligraphy-old
band: researchers
decision:
  ar: حفظ الكوفي أم اعتماد النسخ؟
  en: Keep the kufic or adopt the naskh?
  ur: کوفی رکھیں یا نسخ اپنائیں؟
context:
  ar: 'الخطاط في ورشته أمام قرار جمالي وعملي: الإبقاء على الخط الكوفي المربع الأصيل في كل المصاحف واللافتات، أم تبنّي خط النسخ الأسرع والأوضح الذي يخدم النسّاخ والقرّاء
    أكثر؟ القرار: الأصالة أم النفع؟'
  en: 'The calligrapher at his bench faces an aesthetic and practical decision: keep the original squared kufic on every manuscript and sign, or adopt the faster,
    clearer naskh that serves copyists and readers better? The decision: authenticity or use?'
  ur: 'اپنی ورکشاپ پر خطاط ایک فنی اور عملی فیصلے کے سامنے ہے: ہر مصحف اور تختی پر اصلی مربع کوفی رکھنا یا تیز اور واضح نسخ اپنانا جو نساخوں اور قارئین کی زیادہ خدمت
    کرے؟ فیصلہ: اصالت یا افادیت؟'
positions:
- holder:
    ar: أهل الأصالة
    en: the keepers
    ur: اصالت کے حامی
  stance:
    ar: الكوفي وجه المصاحف الأولى؛ إسقاطه قطع للجذر
    en: kufic is the face of the first manuscripts; dropping it severs the root
    ur: کوفی ابتدائی مصاحف کا چہرہ ہے؛ گرانا جڑ کاٹنا ہے
  evidence:
    ar: بقي الكوفي يزيّن الأبواب والمصاحف الملكية
    en: kufic kept adorning gates and royal manuscripts
    ur: کوفی دروازوں اور شاہی مصاحف کو سجاتا رہا
  sources:
  - concept/islamic-calligraphy
- holder:
    ar: أهل النفع
    en: the users
    ur: افادیت کے حامی
  stance:
    ar: الخط الذي يُقرأ أسرع يخدم القارئ أكثر
    en: the script read faster serves the reader more
    ur: جو رسم الخط تیزی سے پڑھی جائے وہ قاری کی زیادہ خدمت کرتی ہے
  evidence:
    ar: انتشر النسخ في الدواوين والمدارس حتى صار خط العلم
    en: naskh spread through chanceries and schools until it became learning's script
    ur: نسخ دفاتروں اور مدارس میں پھیلی یہاں تک کہ علم کی رسم الخط بنی
  sources:
  - concept/islamic-calligraphy
  - exhibit/pathway-g11-hrt3m-islamic-art-architecture
reflection:
  ar: أيّ الخطين كنت ستعلّمه لتلميذك أولًا؟ اكتب سببك.
  en: Which script would you have taught your pupil first? Write your reason.
  ur: آپ اپنے شاگرد کو پہلے کون سا خط سکھاتے؟ وجہ لکھیں۔
