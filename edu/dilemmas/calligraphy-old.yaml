id: calligraphy-old
band: researchers
decision:
  ar: حفظ الكوفي أم اعتماد النسخ؟
  en: Keep the kufic or adopt the naskh?
  ur: کوفی رکھیں یا نسخ اپنائیں؟
  fr: Garder le coufique ou adopter le naskh ?
  tr: Kufileri ezberlemek mi yoksa kopyalamaya mı güvenmek?
  id: Menghafal Kufi atau mengandalkan penyalinan?
context:
  ar: 'الخطاط في ورشته أمام قرار جمالي وعملي: الإبقاء على الخط الكوفي المربع الأصيل في كل المصاحف واللافتات، أم تبنّي خط النسخ الأسرع والأوضح الذي يخدم النسّاخ والقرّاء أكثر؟ القرار: الأصالة أم النفع؟'
  en: 'The calligrapher at his bench faces an aesthetic and practical decision: keep the original squared kufic on every manuscript and sign, or adopt the faster, clearer naskh that serves copyists and
    readers better? The decision: authenticity or use?'
  ur: 'اپنی ورکشاپ پر خطاط ایک فنی اور عملی فیصلے کے سامنے ہے: ہر مصحف اور تختی پر اصلی مربع کوفی رکھنا یا تیز اور واضح نسخ اپنانا جو نساخوں اور قارئین کی زیادہ خدمت کرے؟ فیصلہ: اصالت یا افادیت؟'
  fr: 'À sa table, le calligraphe doit faire un choix à la fois esthétique et pratique. Faut-il garder les lettres anguleuses du coufique des origines pour tous les manuscrits et les inscriptions, ou adopter
    le naskh, plus rapide à tracer et plus facile à lire ? Que privilégier : la fidélité à la tradition ou la facilité d’usage ?'
  tr: 'Atölyesindeki hattat, estetik ve pratik bir kararla karşı karşıya: tüm Kur''anlarda ve işaretlerde otantik kare Kufi alfabesini korumak mı, yoksa yazıcılara ve okuyuculara daha iyi hizmet eden en
    hızlı ve en net Naskh yazısını mı benimsemek? Karar: özgünlük mü yoksa fayda mı?'
  id: 'Kaligrafer di bengkelnya menghadapi keputusan estetika dan praktis: mempertahankan aksara Kufik persegi otentik di semua Al-Qur''an dan tanda, atau mengadopsi aksara Naskh tercepat dan paling jelas
    yang lebih bermanfaat bagi para juru tulis dan pembaca? Keputusan: keaslian atau manfaat?'
