id: jerusalem-terms
band: scholars
decision:
  ar: قبول الشروط أم القتال للنهاية؟
  en: Accept the terms or fight to the end?
  ur: شرائط قبول کریں یا آخر تک لڑیں؟
context:
  ar: 'في حصار القدس عرض القادة المسيحيون تسليم المدينة إن ضمن صلاح الدين سلامة أهلها وأموالهم بالفدية. القرار: قبول تسليم بالشروط، أم الاستمرار في قتال قد يهلك المدينة
    وأهلها؟'
  en: 'At the siege of Jerusalem the Christian leaders offered to hand over the city if Saladin guaranteed the safety of its people and their property for a ransom.
    The decision: accept surrender on terms, or keep fighting at the risk of city and people?'
  ur: 'یروشلم کے محاصرے میں مسیحی قائدین نے شہر حوالے کرنے کی پیشکش کی اگر صلاح الدین تاوان کے بدلے لوگوں اور ان کے مال کی حفاظت کی ضمانت دے۔ فیصلہ: شرائط پر حوالگی
    قبول کرنا یا شہر اور لوگوں کے نقصان کے خطرے پر لڑتے رہنا؟'
positions:
- holder:
    ar: صلاح الدين وقادته
    en: Saladin and his commanders
    ur: صلاح الدین اور ان کے سردار
  stance:
    ar: المدينة وأهلها أغلى من غنيمة الانتقام
    en: the city and its people are dearer than the spoils of revenge
    ur: شہر اور اس کے لوگ انتقام کی دولت سے قیمتی ہیں
  evidence:
    ar: قبل الفدية فسلم الحجاج والسكان وخرجت المدينة بلا دم
    en: he took the ransom, pilgrims and residents left safe, the city without blood
    ur: انھوں نے تاوان لیا، حاجی اور باشندے امن سے نکلے، شہر بے خون رہا
  sources:
  - person/salah-al-din-yusuf-ibn-ayyub
  - place/jerusalem
- holder:
    ar: الرافضون للشروط
    en: the terms-refusers
    ur: شرائط کے مخالف
  stance:
    ar: العدو منهك؛ الضغط أكثر يأخذ كل شيء
    en: the foe is spent; more pressure takes everything
    ur: دشمن تھکا ہوا ہے؛ مزید دباؤ سب کچھ لے لیتا ہے
  evidence:
    ar: رأوا أن الحصار قد أضعف الحامية حتى قرب السقوط
    en: they judged the siege had worn the garrison near collapse
    ur: انھوں نے سمجھا کہ محاصرے نے محافظوں کو گرنے کے قریب کر دیا
  sources:
  - exhibit/pathway-g11-chw3m-crusades-muslim-side
reflection:
  ar: أيّ قرار كنت ستنصح به لو كنت في مجلس الحرب؟ اكتب سببك.
  en: Which decision would you have advised in the war council? Write your reason.
  ur: اگر آپ مجلسِ جنگ میں ہوتے تو کون سا فیصلہ تجویز کرتے؟ وجہ لکھیں۔
