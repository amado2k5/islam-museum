id: jerusalem-terms
band: scholars
decision:
  ar: قبول الشروط أم القتال للنهاية؟
  en: Accept the terms or fight to the end?
  ur: شرائط قبول کریں یا آخر تک لڑیں؟
  fr: Accepter les conditions ou combattre jusqu’au bout ?
  tr: Şartları kabul etmeli miyim yoksa sonuna kadar mı savaşmalıyım?
  id: Terima syaratnya atau berjuang sampai akhir?
context:
  ar: 'في حصار القدس عرض القادة المسيحيون تسليم المدينة إن ضمن صلاح الدين سلامة أهلها وأموالهم بالفدية. القرار: قبول تسليم بالشروط، أم الاستمرار في قتال قد يهلك المدينة وأهلها؟'
  en: 'At the siege of Jerusalem the Christian leaders offered to hand over the city if Saladin guaranteed the safety of its people and their property for a ransom. The decision: accept surrender on terms,
    or keep fighting at the risk of city and people?'
  ur: 'یروشلم کے محاصرے میں مسیحی قائدین نے شہر حوالے کرنے کی پیشکش کی اگر صلاح الدین تاوان کے بدلے لوگوں اور ان کے مال کی حفاظت کی ضمانت دے۔ فیصلہ: شرائط پر حوالگی قبول کرنا یا شہر اور لوگوں کے نقصان کے
    خطرے پر لڑتے رہنا؟'
  fr: Pendant le siège de Jérusalem, les dirigeants chrétiens proposent de remettre la ville à Saladin s’il garantit la sécurité de ses habitants et de leurs biens en échange d’une rançon. Faut-il accepter
    cette reddition sous conditions ou poursuivre le combat au risque de mettre en danger la ville et sa population ?
  tr: 'Kudüs kuşatması sırasında, Hristiyan liderler, Selahaddin halkının güvenliğini ve servetini fidye olarak garanti ederse şehri teslim etmeyi teklif etti. Karar: Teslimiyeti şartlı kabul etmek mi,
    yoksa şehri ve halkını yok edebilecek savaşlara devam etmek mi?'
  id: 'Selama pengepungan Yerusalem, para pemimpin Kristen menawarkan untuk menyerahkan kota itu jika Saladin menjamin keselamatan rakyatnya dan kekayaan mereka sebagai tebusan. Keputusannya: Menerima penyerahan
    dengan syarat, atau melanjutkan pertempuran yang dapat menghancurkan kota dan penduduknya?'
positions:
- holder:
    ar: صلاح الدين وقادته
    en: Saladin and his commanders
    ur: صلاح الدین اور ان کے سردار
    fr: Saladin et ses commandants
    tr: Salah al-Din ve liderleri
    id: Salah al-Din dan para pemimpinnya
  stance:
    ar: المدينة وأهلها أغلى من غنيمة الانتقام
    en: the city and its people are dearer than the spoils of revenge
    ur: شہر اور اس کے لوگ انتقام کی دولت سے قیمتی ہیں
    fr: La ville et ses habitants valent mieux qu’un butin obtenu par vengeance.
    tr: Şehir ve halkı intikam ganimetlerinden daha değerlidir
    id: Kota dan penduduknya lebih berharga daripada rampasan balas dendam
  evidence:
    ar: قبل الفدية فسلم الحجاج والسكان وخرجت المدينة بلا دم
    en: he took the ransom, pilgrims and residents left safe, the city without blood
    ur: انھوں نے تاوان لیا، حاجی اور باشندے امن سے نکلے، شہر بے خون رہا
    fr: Il a accepté la rançon. Pèlerins et habitants ont pu partir sains et saufs, sans effusion de sang dans la ville.
    tr: Fidyeyi kabul etti, böylece hacılar ve sakinler güvende oldu ve şehir kan olmadan gitti.
    id: Ia menerima tebusan itu, sehingga para peziarah dan penduduk aman, dan kota keluar tanpa darah.
  sources:
  - person/salah-al-din-yusuf-ibn-ayyub
  - place/jerusalem
- holder:
    ar: الرافضون للشروط
    en: the terms-refusers
    ur: شرائط کے مخالف
    fr: Ceux qui refusent les conditions
    tr: Koşulları reddedenler
    id: Mereka yang menolak syarat-syarat tersebut
  stance:
    ar: العدو منهك؛ الضغط أكثر يأخذ كل شيء
    en: the foe is spent; more pressure takes everything
    ur: دشمن تھکا ہوا ہے؛ مزید دباؤ سب کچھ لے لیتا ہے
    fr: L’adversaire est épuisé. En accentuant la pression, on obtiendra tout.
    tr: Düşman yorgundur; daha fazla baskı her şeyi alır
    id: Musuh kelelahan; tekanan lebih besar mengambil segalanya
  evidence:
    ar: رأوا أن الحصار قد أضعف الحامية حتى قرب السقوط
    en: they judged the siege had worn the garrison near collapse
    ur: انھوں نے سمجھا کہ محاصرے نے محافظوں کو گرنے کے قریب کر دیا
    fr: Ils estimaient que le siège avait épuisé la garnison et qu’elle était près de céder.
    tr: Kuşatmanın garnizonu zayıflattığını ve düşüşe yaklaştığını gördüler
    id: Mereka melihat bahwa pengepungan telah melemahkan garnisun hingga hampir runtuh
