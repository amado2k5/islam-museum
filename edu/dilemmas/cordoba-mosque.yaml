id: cordoba-mosque
band: scholars
decision:
  ar: توسيع المسجد أم بناء المكتبة؟
  en: Widen the mosque or build the library?
  ur: مسجد بڑھائیں یا کتب خانہ بنائیں؟
context:
  ar: 'في قرطبة كان المال كافيًا لعمارة واحدة كبرى هذا العام: توسعة الجامع ليتّسع للجماهير، أم مكتبة تجمع الكتب والنسّاخ؟ القرار: العمارة التي يقصدها الناس كل يوم،
    أم الدار التي ميّزت المدينة عن غيرها؟'
  en: 'In Cordoba the money sufficed for one great work this year: widening the Great Mosque to fit the crowds, or a library to gather books and copyists? The decision:
    the building the people crowd every day, or the house that set the city apart?'
  ur: 'قرطبہ میں مال اس سال ایک بڑی تعمیر کے لیے کافی تھا: جامع مسجد کو وسیع کرنا تاکہ بھیڑ سما سکے یا کتب خانہ جو کتابیں اور نساخ جمع کرے؟ فیصلہ: وہ عمارت جس میں
    لوگ روز بھراتے ہیں یا وہ گھر جس نے شہر کو ممتاز کیا؟'
positions:
- holder:
    ar: جماعة المسجد
    en: the mosque party
    ur: مسجد کے حامی
  stance:
    ar: المسجد يجمع الكل في كل يوم؛ لا شيء أسبق
    en: the mosque gathers everyone every day; nothing comes first
    ur: مسجد ہر روز سب کو جمع کرتی ہے؛ کچھ پہلے نہیں
  evidence:
    ar: توسّع بناؤها على العهود حتى صار أعظم معالم الغرب
    en: its building grew over the reigns until it became the West's greatest landmark
    ur: اس کی تعمیر دور دراز بڑھتی گئی یہاں تک کہ مغرب کی عظیم ترین نشانی بنا
  sources:
  - building/great-mosque-cordoba
  - place/cordoba
- holder:
    ar: جماعة المكتبة
    en: the library party
    ur: کتب خانہ کے حامی
  stance:
    ar: الكتب بلا دار تضيع؛ المكتبة تلد ألف مسجد في العقول
    en: books without a house are lost; a library births a thousand mosques in minds
    ur: بے گھر کتابیں ضائع ہوتی ہیں؛ کتب خانہ ذہنوں میں ہزار مسجدیں پیدا کرتا ہے
  evidence:
    ar: جمعت قرطبة مكتبات فاقت حتى صار رقم الكتب فيها مثلًا
    en: Cordoba gathered libraries so large their catalogue count became proverbial
    ur: قرطبہ نے اتنے بڑے کتب خانے جمع کیے کہ اس کی فہرستیں مثال بنیں
  sources:
  - place/cordoba
  - exhibit/pathway-g11-chw3m-al-andalus
reflection:
  ar: أيّ العمارَتين كنت ستدفع ثمنها أولًا؟ اكتب سببك.
  en: Which of the two buildings would you have paid for first? Write your reason.
  ur: آپ پہلے کون سی عمارت کی ادائیگی کرتے؟ وجہ لکھیں۔
