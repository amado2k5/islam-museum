id: cordoba-mosque
band: scholars
decision:
  ar: توسيع المسجد أم بناء المكتبة؟
  en: Widen the mosque or build the library?
  ur: مسجد بڑھائیں یا کتب خانہ بنائیں؟
  fr: Agrandir la mosquée ou construire la bibliothèque ?
  tr: Camiyi genişletmek mi yoksa kütüphane inşa etmek mi?
  id: Memperluas masjid atau membangun perpustakaan?
context:
  ar: 'في قرطبة كان المال كافيًا لعمارة واحدة كبرى هذا العام: توسعة الجامع ليتّسع للجماهير، أم مكتبة تجمع الكتب والنسّاخ؟ القرار: العمارة التي يقصدها الناس كل يوم، أم الدار التي ميّزت المدينة عن غيرها؟'
  en: 'In Cordoba the money sufficed for one great work this year: widening the Great Mosque to fit the crowds, or a library to gather books and copyists? The decision: the building the people crowd every
    day, or the house that set the city apart?'
  ur: 'قرطبہ میں مال اس سال ایک بڑی تعمیر کے لیے کافی تھا: جامع مسجد کو وسیع کرنا تاکہ بھیڑ سما سکے یا کتب خانہ جو کتابیں اور نساخ جمع کرے؟ فیصلہ: وہ عمارت جس میں لوگ روز بھراتے ہیں یا وہ گھر جس نے شہر
    کو ممتاز کیا؟'
  fr: À Cordoue, le budget de l’année suffit pour un seul grand chantier. Faut-il agrandir la Grande Mosquée pour accueillir la foule, ou bâtir une bibliothèque où réunir des livres et des copistes ? Faut-il
    privilégier le lieu où les gens se pressent chaque jour ou celui qui ferait la renommée de la ville ?
  tr: 'Cordoba''da, bu yıl büyük bir bina için para yeterli miydi: caminin kitlelere uygun şekilde genişletilmesi mi, yoksa kitap ve yazıcıların toplandığı bir kütüphane mi? Karar: insanların her gün ziyaret
    ettiği bina mı, yoksa şehri diğerlerinden ayıran ev mi?'
  id: 'Di Cordoba, apakah uang itu cukup untuk satu bangunan besar tahun ini: memperluas masjid untuk menampung massa, atau perpustakaan yang mengumpulkan buku dan juru tulis? Keputusan: bangunan yang dikunjungi
    orang setiap hari, atau rumah yang membedakan kota dari yang lain?'
