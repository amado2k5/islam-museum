id: ghazali-seclusion
band: researchers
decision:
  ar: المنصب أم الخلوة للغزالي؟
  en: The chair or seclusion for al-Ghazali?
  ur: غزالی کے لیے منصب یا خلوت؟
context:
  ar: 'بلغ أبو حامد الغزالي أعلى منصب علمي في النظامية ثم أحسّ بقلق في قلبه بين الشهرة والصدق. القرار: البقاء أستاذًا محتفى به في أعظم مدارس زمانه، أم ترك كل شيء
    والانزواء سنين ليطهّر قلبه ويكتب؟'
  en: 'Abu Hamid al-Ghazali reached the highest scholarly chair at the Nizamiyya, then felt an anxiety between fame and sincerity. The decision: stay a celebrated
    professor at the era''s greatest school, or leave everything and withdraw for years to cleanse his heart and write?'
  ur: 'ابو حامد الغزالی نظامیہ میں اعلیٰ ترین علمی منصب پر پہنچے پھر شہرت اور اخلاص کے بیچ دل کی بے چینی محسوس کی۔ فیصلہ: زمانے کے عظیم ترین مدرسے میں مشہور استاد
    رہنا یا سب چھوڑ کر برسوں خلوت میں بیٹھنا تاکہ دل صاف ہو اور لکھ سکے؟'
positions:
- holder:
    ar: دعاة البقاء
    en: the stay party
    ur: رہنے کے حامی
  stance:
    ar: الطلاب والمدرسة يحتاجونه؛ الفرار هزيمة
    en: students and school need him; leaving is defeat
    ur: طلبہ اور مدرسہ ان کے محتاج ہیں؛ جانا شکست ہے
  evidence:
    ar: كان يدرّس المئات ويكتب في الرد على الخصوم
    en: he was teaching hundreds and writing answers to opponents
    ur: وہ سیکڑوں کو پڑھا رہے تھے اور مخالفین کے جواب لکھ رہے تھے
  sources:
  - person/al-ghazali-abu-hamid
- holder:
    ar: دعاة الخلوة
    en: the retreat party
    ur: خلوت کے حامی
  stance:
    ar: القلب المريض لا يعلّم الصدق؛ الاعتزال دواء
    en: a sick heart cannot teach sincerity; retreat is the cure
    ur: بیمار دل اخلاص نہیں سکھا سکتا؛ خلوت علاج ہے
  evidence:
    ar: انزوى سنين فعاد يكتب الإحياء أعظم كتبه
    en: he withdrew for years and returned to write the Ihya, his greatest work
    ur: وہ برسوں خلوت میں رہے اور واپس آئے تو احیاء لکھی، عظیم ترین کتاب
  sources:
  - person/al-ghazali-abu-hamid
  - place/baghdad
reflection:
  ar: لو كنت تلميذه، ماذا كنت ستنصحه؟ اكتب سببك.
  en: If you were his student, what would you have advised him? Write your reason.
  ur: اگر آپ ان کے شاگرد ہوتے تو کیا مشورہ دیتے؟ وجہ لکھیں۔
