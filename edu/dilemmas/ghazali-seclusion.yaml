id: ghazali-seclusion
band: researchers
decision:
  ar: المنصب أم الخلوة للغزالي؟
  en: The chair or seclusion for al-Ghazali?
  ur: غزالی کے لیے منصب یا خلوت؟
  fr: Al-Ghazali doit-il garder sa chaire ou se retirer ?
  tr: Al-Ghazali'nin konumu mu yoksa inzivası mı?
  id: Posisi atau pengasingan Al-Ghazali?
context:
  ar: 'بلغ أبو حامد الغزالي أعلى منصب علمي في النظامية ثم أحسّ بقلق في قلبه بين الشهرة والصدق. القرار: البقاء أستاذًا محتفى به في أعظم مدارس زمانه، أم ترك كل شيء والانزواء سنين ليطهّر قلبه ويكتب؟'
  en: 'Abu Hamid al-Ghazali reached the highest scholarly chair at the Nizamiyya, then felt an anxiety between fame and sincerity. The decision: stay a celebrated professor at the era''s greatest school,
    or leave everything and withdraw for years to cleanse his heart and write?'
  ur: 'ابو حامد الغزالی نظامیہ میں اعلیٰ ترین علمی منصب پر پہنچے پھر شہرت اور اخلاص کے بیچ دل کی بے چینی محسوس کی۔ فیصلہ: زمانے کے عظیم ترین مدرسے میں مشہور استاد رہنا یا سب چھوڑ کر برسوں خلوت میں بیٹھنا
    تاکہ دل صاف ہو اور لکھ سکے؟'
  fr: Abou Hamid al-Ghazali occupe la plus haute chaire de la Nizamiyya, mais il se sent déchiré entre sa renommée et son désir de sincérité. Faut-il rester un professeur célèbre dans la plus grande école
    de l’époque, ou tout quitter et se retirer pendant des années pour purifier son cœur et écrire ?
  tr: 'Ebu Hamid el-Gazali, Nizamiye''de en yüksek bilimsel makamlığa ulaştı, ardından kalbinde şöhret ile dürüstlük arasında bir gerilim hissetti. Karar: Zamanının en büyük okullarında ünlü bir öğretmen
    olarak mı kalacak, yoksa her şeyi bırakıp yıllarca kalbini arındırıp yazmak mı?'
  id: 'Abu Hamid al-Ghazali mencapai posisi ilmiah tertinggi di Nizamiyyah, lalu merasakan ketegangan di hatinya antara ketenaran dan kejujuran. Keputusan: Tetap menjadi guru yang terkenal di sekolah-sekolah
    terbesar pada zamannya, atau meninggalkan segalanya dan mengasingkan diri selama bertahun-tahun untuk menyucikan hatinya dan menulis?'
