reflection:
  ar: أيّ الطريقين كان سيرشد يدك؟ اكتب سببك.
  en: Which road would have guided your hand? Write your reason.
  ur: کون سا راستہ آپ کے ہاتھ کی رہنمائی کرتا؟ وجہ لکھیں۔
  fr: Laquelle de ces deux approches aurait guidé ta main ? Explique pourquoi.
  tr: İki yoldan hangisi size rehberlik eder? Sebebinizi yazın.
  id: Mana dari dua jalan yang akan membimbingmu? Tuliskan alasanmu.
