id: islamic-art-form
band: researchers
decision:
  ar: الزخرفة الحرة أم الهندسة المنضبطة؟
  en: Free ornament or disciplined geometry?
  ur: آزاد آرائش یا منضبط ہندسہ؟
  fr: Un décor libre ou une géométrie rigoureuse ?
  tr: Ücretsiz süsleme mi yoksa disiplinli geometri mi?
  id: Dekorasi gratis atau geometri yang disiplin?
context:
  ar: 'الفنّان في الورشة يصمّم جدار جامع جديد. طريقان: زخرفة نباتية حرة تتدفق كما تتدفق الحياة لا تتكرر، أم هندسة نجوم ومضلعات تنضبط بمقاييس وتتكرر إلى ما لا نهاية؟ القرار: حرية اليد أم نظام العقل؟'
  en: 'The artist in the workshop designs a new mosque wall. Two roads: free vegetal ornament flowing as life flows, never repeating, or star-and-polygon geometry disciplined by measures, repeating to infinity?
    The decision: freedom of the hand or order of the mind?'
  ur: 'ورکشاپ میں فنکار نئی مسجد کی دیوار ڈیزائن کر رہا ہے۔ دو راستے: آزاد نباتاتی آرائش جو زندگی کی طرح بہتی، کبھی نہ دہرائے یا ستاروں اور کثیرالاضلاع کی ہندسہ جو پیمانوں سے بندھی اور لامحدود دہرائے؟ فیصلہ:
    ہاتھ کی آزادی یا ذہن کا نظم؟'
  fr: 'Dans son atelier, un artiste imagine le décor d’un nouveau mur de mosquée. Il peut dessiner des motifs végétaux libres, qui se développent comme la vie sans jamais se répéter, ou des étoiles et des
    polygones aux proportions exactes qui se répètent à l’infini. Que choisir : la liberté du geste ou l’ordre de l’esprit ?'
  tr: 'Atölyedeki sanatçı yeni bir cami duvarı tasarlıyor. İki yol: yaşamın aktığı gibi akan ve tekrarlanmayan serbest bitki süslemesi mi, yoksa yıldızların ve çokgenlerin ölçeğe ayarlanıp sonsuzca tekrarlanan
    geometrisi mi? Karar: El özgürlüğü mü yoksa akıl sistemi mi?'
  id: 'Seniman di bengkel merancang dinding masjid baru. Dua jalur: dekorasi tumbuhan bebas yang mengalir seiring kehidupan tanpa berulang, atau geometri bintang dan poligon yang diatur pada skala dan diulang
    tanpa henti? Keputusan: Kebebasan tangan atau sistem akal?'
