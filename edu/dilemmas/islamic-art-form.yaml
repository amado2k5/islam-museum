id: islamic-art-form
band: researchers
decision:
  ar: الزخرفة الحرة أم الهندسة المنضبطة؟
  en: Free ornament or disciplined geometry?
  ur: آزاد آرائش یا منضبط ہندسہ؟
context:
  ar: 'الفنّان في الورشة يصمّم جدار جامع جديد. طريقان: زخرفة نباتية حرة تتدفق كما تتدفق الحياة لا تتكرر، أم هندسة نجوم ومضلعات تنضبط بمقاييس وتتكرر إلى ما لا نهاية؟
    القرار: حرية اليد أم نظام العقل؟'
  en: 'The artist in the workshop designs a new mosque wall. Two roads: free vegetal ornament flowing as life flows, never repeating, or star-and-polygon geometry
    disciplined by measures, repeating to infinity? The decision: freedom of the hand or order of the mind?'
  ur: 'ورکشاپ میں فنکار نئی مسجد کی دیوار ڈیزائن کر رہا ہے۔ دو راستے: آزاد نباتاتی آرائش جو زندگی کی طرح بہتی، کبھی نہ دہرائے یا ستاروں اور کثیرالاضلاع کی ہندسہ جو
    پیمانوں سے بندھی اور لامحدود دہرائے؟ فیصلہ: ہاتھ کی آزادی یا ذہن کا نظم؟'
positions:
- holder:
    ar: أهل الحرية
    en: the free hand
    ur: آزادی کے حامی
  stance:
    ar: الورقة والسعف تنمو كما تنمو الحياة بلا حد
    en: the leaf and frond grow as life grows, without bound
    ur: پتا اور پور زندگی کی طرح بے حد بڑھتے ہیں
  evidence:
    ar: غطّت الأرابيسك الجدران والأبواب في كل عصر
    en: the arabesque covered walls and doors in every era
    ur: آرائش نے ہر دور میں دیواریں اور دروازے ڈھانپے
  sources:
  - exhibit/pathway-g11-hrt3m-islamic-art-architecture
  - building/alhambra
- holder:
    ar: أهل الهندسة
    en: the geometers
    ur: ہندسہ کے حامی
  stance:
    ar: النجوم تنضبط بعدها نظام الكون؛ النمط لا يفشل
    en: the stars' order mirrors the universe's order; the pattern never fails
    ur: ستاروں کا نظم کائنات کے نظم کی عکاسی کرتا ہے؛ نمونہ کبھی ناکام نہیں ہوتا
  evidence:
    ar: بُنيت النجوم الهندسية فوّرت الأنماط التي تفوق عدها
    en: the geometric stars generated patterns beyond counting
    ur: ہندسی ستاروں نے ایسے نمونے بنائے جو گنتی سے باہر ہیں
  sources:
  - exhibit/pathway-g11-hrt3m-islamic-art-architecture
  - concept/islamic-calligraphy
reflection:
  ar: أيّ الطريقين كان سيرشد يدك؟ اكتب سببك.
  en: Which road would have guided your hand? Write your reason.
  ur: کون سا راستہ آپ کے ہاتھ کی رہنمائی کرتا؟ وجہ لکھیں۔
