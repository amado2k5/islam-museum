  stance:
    ar: السيرة تُقرأ لتعيش لا لتُحفظ؛ الدروس طريق العمل
    en: the sirah is read to be lived, not memorised; lessons are the road of action
    ur: سیرت یاد کرنے نہیں جینے کے لیے پڑھی جاتی ہے؛ اسباق عمل کا راستہ ہیں
    fr: On lit cette biographie pour s’en inspirer dans sa vie, pas pour la mémoriser. Les leçons aident à agir.
    tr: Bir biyografi ezberlenmek yerine yaşamak için okunur; dersler eyleme giden yoldur
    id: Biografi dibaca untuk dijalani, bukan dihafal; pelajaran adalah jalan menuju tindakan
  evidence:
    ar: جمعوا المواقف بالأخلاق حتى صارت قدوة تُتّبع
    en: they gathered the stands by virtue until they became a followed example
    ur: انھوں نے موقفوں کو اخلاق سے جمع کیا تو وہ پیروی کا نمونہ بنے
    fr: Ils ont regroupé les récits par qualités pour offrir des exemples à suivre.
    tr: Durumları ahlakla birleştirerek takip edilecek bir rol model haline geldiler.
    id: Mereka menggabungkan situasi dengan moral hingga menjadi panutan yang patut diikuti.
  sources:
