id: sirah-form
band: researchers
decision:
  ar: السيرة تواريخ أم دروس؟
  en: The sirah as chronicle or lessons?
  ur: 'سیرت: تواریخ یا اسباق؟'
context:
  ar: 'كاتب يريد أن يدوّن السيرة للأجيال القادمة. شكلان: كتاب تواريخ يتبع الحوادث بالسنين والأيام والأسماء كما وقعت، أم كتاب دروس يرتّب المواقف والأخلاق فيتعلم منها
    القارئ حياته؟ القرار: الدقة أم القدوة؟'
  en: 'A writer wants to record the sirah for coming generations. Two shapes: a chronicle book following events by years, days and names as they happened, or a lessons
    book arranging the stands and virtues so the reader learns his own life? The decision: accuracy or example?'
  ur: 'ایک مصنف آنے والی نسلوں کے لیے سیرت لکھنا چاہتا ہے۔ دو شکلیں: تواریخ کی کتاب جو واقعات کو برسوں، دنوں اور ناموں سے جس طرح ہوئے بیان کرے یا اسباق کی کتاب جو
    موقفوں اور اخلاق کو مرتب کرے تاکہ قاری اپنی زندگی سیکھے؟ فیصلہ: درستگی یا نمونہ؟'
positions:
- holder:
    ar: أهل التواريخ
    en: the chroniclers
    ur: تواریخ کے حامی
  stance:
    ar: الحدث كما وقع لا كما يريده الخيال؛ التاريخ أمانة
    en: the event as it happened, not as fancy wishes; history is a trust
    ur: واقعہ جیسا ہوا، خیال نہیں؛ تاریخ امانت ہے
  evidence:
    ar: رتّبوا الأخبار بالسنين حتى عرف الناس ما جرى ومتى
    en: they arranged the reports by years so people knew what befell and when
    ur: انھوں نے خبریں برسوں سے مرتب کیں تاکہ لوگ جانیں کیا اور کب ہھوا
  sources:
  - exhibit/pathway-g11-hrt3m-life-of-the-prophet
  - place/mecca
- holder:
    ar: أهل الدروس
    en: the lesson writers
    ur: اسباق کے حامی
  stance:
    ar: السيرة تُقرأ لتعيش لا لتُحفظ؛ الدروس طريق العمل
    en: the sirah is read to be lived, not memorised; lessons are the road of action
    ur: سیرت یاد کرنے نہیں جینے کے لیے پڑھی جاتی ہے؛ اسباق عمل کا راستہ ہیں
  evidence:
    ar: جمعوا المواقف بالأخلاق حتى صارت قدوة تُتّبع
    en: they gathered the stands by virtue until they became a followed example
    ur: انھوں نے موقفوں کو اخلاق سے جمع کیا تو وہ پیروی کا نمونہ بنے
  sources:
  - exhibit/pathway-g11-hrt3m-life-of-the-prophet
reflection:
  ar: أيّ الشكلين كنت ستكتبه لو دُوّنت السيرة بيدك؟ اكتب سببك.
  en: Which shape would you have written had the sirah been penned by you? Write your reason.
  ur: اگر سیرت آپ کے قلم سے لکھی جاتی تو آپ کون سی شکل لکھتے؟ وجہ لکھیں۔
