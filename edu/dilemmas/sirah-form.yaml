  stance:
    ar: الحدث كما وقع لا كما يريده الخيال؛ التاريخ أمانة
    en: the event as it happened, not as fancy wishes; history is a trust
    ur: واقعہ جیسا ہوا، خیال نہیں؛ تاریخ امانت ہے
    fr: Raconter ce qui s’est passé, et non ce qu’on aimerait imaginer. Transmettre l’histoire est une responsabilité.
    tr: Olay, hayal gücünün istediği gibi değil; tarih bir güvendir
    id: Peristiwa itu seperti yang terjadi, bukan seperti yang diinginkan imajinasi; sejarah adalah sebuah kepercayaan
  evidence:
    ar: رتّبوا الأخبار بالسنين حتى عرف الناس ما جرى ومتى
    en: they arranged the reports by years so people knew what befell and when
    ur: انھوں نے خبریں برسوں سے مرتب کیں تاکہ لوگ جانیں کیا اور کب ہھوا
    fr: Ils ont classé les récits par année pour qu’on sache ce qui s’est passé et quand.
    tr: Yıllar içinde haberleri düzenlediler, ta ki insanlar ne zaman ve ne zaman olduğunu anlayana kadar.
    id: Mereka mengatur berita selama bertahun-tahun sampai orang tahu apa yang terjadi dan kapan.
