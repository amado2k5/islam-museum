id: sirah-form
band: researchers
decision:
  ar: السيرة تواريخ أم دروس؟
  en: The sirah as chronicle or lessons?
  ur: 'سیرت: تواریخ یا اسباق؟'
  fr: 'La vie du Prophète : une chronique ou des leçons ?'
  tr: 'Biyografi: Tarihler mi yoksa dersler mi?'
  id: 'Biografi: Tanggal atau Pelajaran?'
context:
  ar: 'كاتب يريد أن يدوّن السيرة للأجيال القادمة. شكلان: كتاب تواريخ يتبع الحوادث بالسنين والأيام والأسماء كما وقعت، أم كتاب دروس يرتّب المواقف والأخلاق فيتعلم منها القارئ حياته؟ القرار: الدقة أم القدوة؟'
  en: 'A writer wants to record the sirah for coming generations. Two shapes: a chronicle book following events by years, days and names as they happened, or a lessons book arranging the stands and virtues
    so the reader learns his own life? The decision: accuracy or example?'
  ur: 'ایک مصنف آنے والی نسلوں کے لیے سیرت لکھنا چاہتا ہے۔ دو شکلیں: تواریخ کی کتاب جو واقعات کو برسوں، دنوں اور ناموں سے جس طرح ہوئے بیان کرے یا اسباق کی کتاب جو موقفوں اور اخلاق کو مرتب کرے تاکہ قاری
    اپنی زندگی سیکھے؟ فیصلہ: درستگی یا نمونہ؟'
  fr: 'Un auteur veut transmettre la vie du prophète Muhammad aux générations futures. Il peut écrire une chronique qui suit les événements, avec leurs dates et leurs acteurs, ou regrouper les récits par
    attitudes et qualités pour que le lecteur en tire des leçons pour sa propre vie. Que mettre au premier plan : la précision des faits ou la valeur de l’exemple ?'
  tr: 'Biyografiyi gelecek nesiller için kaydetmek isteyen bir yazar. İki biçim: olayları yıllara, günlere ve isimlere göre takip eden bir kronik kitabı mı, yoksa okuyucunun hayatından öğrenmesi için durumları
    ve ahlakı düzenleyen bir ders kitabı mı? Karar: Doğruluk mu yoksa rol model mi?'
  id: 'Seorang penulis yang ingin merekam biografi untuk generasi mendatang. Dua bentuk: buku kronik yang mengikuti peristiwa berdasarkan tahun, hari, dan nama sebagaimana terjadi, atau buku pelajaran yang
    mengatur situasi dan moral agar pembaca belajar dari kehidupan mereka? Keputusan: Akurasi atau Panutan?'
