id: badr-choice
band: scholars
decision:
  ar: القافلة أم الجيش؟
  en: The caravan or the army?
  ur: قافلہ یا لشکر؟
  fr: La caravane ou l’armée ?
  tr: Konvoy mu yoksa ordu mu?
  id: Konvoi atau tentara?
context:
  ar: 'خرج المسلمون لاعتراض قافلة قريش التجارية، ثم بلغهم أن جيشًا قويًّا جاء لحمايتها. القرار: الاكتفاء بمحاولة القافلة التي فاتت، أم مواجهة جيش أكبر بكثير في بدر.'
  en: 'The Muslims set out to intercept the Quraysh trade caravan, then heard a strong army had come to guard it. The decision: settle for the lost caravan attempt, or face a much larger army at Badr.'
  ur: 'مسلمان قریش کے تجارتی قافلے کا راستہ روکنے نکلے، پھر خبر آئی کہ اس کی حفاظت کے لیے مضبوط لشکر آیا۔ فیصلہ: ہاتھ سے نکلے قافلے پر اکتفا کرنا یا بدر میں کئی گنا بڑے لشکر کا سامنا کرنا۔'
  fr: Les musulmans partent à la rencontre d’une caravane commerciale de Quraych pour l’intercepter. Ils apprennent qu’une armée puissante est venue la protéger. Faut-il renoncer puisque la caravane leur
    a échappé, ou affronter à Badr une armée beaucoup plus nombreuse ?
  tr: 'Müslümanlar, Kureyş''in ticaret kervanını durdurmak için yola çıktı, ancak güçlü bir ordunun onu korumak için geldiği bildirildi. Karar: Kaçırılan kervanı denemekle yetinmek ya da Bedr''de çok daha
    büyük bir orduyla karşılaşmak mı?'
  id: 'Orang Muslim berangkat untuk mencegat karavan perdagangan Quraisy, tetapi kemudian diberitahu bahwa pasukan kuat telah datang untuk melindunginya. Keputusan: Cukup puas dengan mencoba karavan yang
    gagal, atau menghadapi pasukan yang jauh lebih besar di Badr.'
positions:
- holder:
    ar: المستعدون للمواجهة
    en: those ready to face it
    ur: مقابلہ کے لیے تیار
    fr: Ceux qui sont prêts à combattre
    tr: Karşılaşmaya Hazır Olanlar
    id: Mereka yang Siap untuk Bertemu
  stance:
    ar: إن فزنا بغير عدد أثبتنا أن العزيمة أهم
    en: if we win outnumbered we prove resolve matters more
    ur: اگر ہم کم تعداد میں جیتیں تو ثابت ہوگا کہ عزم زیادہ اہم ہے
    fr: Si nous gagnons en étant moins nombreux, nous montrerons que la détermination compte davantage.
    tr: Sayı olmadan kazanırsak, kararlılığın daha önemli olduğunu kanıtlarız
    id: Jika kita menang tanpa angka, kita membuktikan bahwa tekad lebih penting
  evidence:
    ar: 'قالوا: نمضي إلى الماء حتى نلقى عدوّنا'
    en: 'they said: we march to the water until we meet our foe'
    ur: 'انھوں نے کہا: ہم پانی تک چلیں گے یہاں تک کہ دشمن سے ملیں'
    fr: Ils disaient vouloir avancer jusqu’au point d’eau pour y rencontrer leurs adversaires.
    tr: 'Dediler ki: Düşmanımızla karşılaşana kadar suya gideceğiz'
    id: 'Mereka berkata: Kita akan pergi ke air sampai kita bertemu musuh kita'
  sources:
  - event/battle-of-badr
- holder:
    ar: الحذرون
    en: the cautious
    ur: محتاط
    fr: Les plus prudents
    tr: Temkinli olanlar
    id: Yang berhati-hati
  stance:
    ar: القافلة فاتت؛ القتال مغامرة قد تهلكنا جميعًا
    en: the caravan is gone; fighting is a gamble that could ruin us all
    ur: قافلہ نکل گیا؛ لڑنا وہ جوا ہے جو سب کو ہلاک کر سکتا ہے
    fr: La caravane est passée. En nous battant, nous risquons tous d’y laisser la vie.
    tr: Kervan geçti; savaş hepimizi yok edebilecek bir maceradır
    id: Karavan telah lewat; bertarung adalah petualangan yang bisa menghancurkan kita semua
  evidence:
    ar: كان العدد والعدة لصالح قريش، وانسحاب غير مذموم
    en: the numbers and gear favoured Quraysh, and withdrawal was no shame
    ur: تعداد اور سازوسامان قریش کے حق میں تھا اور پیچھے ہٹنا برائی نہیں تھی
    fr: Quraych avait l’avantage du nombre et de l’équipement. Se retirer n’avait rien de honteux.
    tr: Sayıca ve ekipman Kureyş lehineydi ve geri çekilmek suçlanacak bir şey değildi
    id: Jumlah dan perlengkapan lebih menguntungkan Quraisy, dan mundur bukanlah hal yang patut disalahkan
  sources:
  - place/mecca
reflection:
  ar: أيّ وجه كان سيغلب عليك لو سُئل رأيك يومها؟ اكتب سببك.
  en: Which side would have won you over had your opinion been asked that day? Write your reason.
  ur: اگر اس دن آپ کی رائے لی جاتی تو کس طرف جھکتے؟ وجہ لکھیں۔
  fr: Si l’on t’avait demandé ton avis ce jour-là, quel camp t’aurait convaincu ? Explique pourquoi.
  tr: O gün görüşün sorulsaydı hangi yüz galip gelirdi? Gerekçeni yaz.
  id: Wajah mana yang akan menang jika pendapatmu ditanya hari itu? Tuliskan alasanmu.
