id: badr-choice
band: scholars
decision:
  ar: القافلة أم الجيش؟
  en: The caravan or the army?
  ur: قافلہ یا لشکر؟
context:
  ar: 'خرج المسلمون لاعتراض قافلة قريش التجارية، ثم بلغهم أن جيشًا قويًّا جاء لحمايتها. القرار: الاكتفاء بمحاولة القافلة التي فاتت، أم مواجهة جيش أكبر بكثير في بدر.'
  en: 'The Muslims set out to intercept the Quraysh trade caravan, then heard a strong army had come to guard it. The decision: settle for the lost caravan attempt,
    or face a much larger army at Badr.'
  ur: 'مسلمان قریش کے تجارتی قافلے کا راستہ روکنے نکلے، پھر خبر آئی کہ اس کی حفاظت کے لیے مضبوط لشکر آیا۔ فیصلہ: ہاتھ سے نکلے قافلے پر اکتفا کرنا یا بدر میں کئی گنا
    بڑے لشکر کا سامنا کرنا۔'
positions:
- holder:
    ar: المستعدون للمواجهة
    en: those ready to face it
    ur: مقابلہ کے لیے تیار
  stance:
    ar: إن فزنا بغير عدد أثبتنا أن العزيمة أهم
    en: if we win outnumbered we prove resolve matters more
    ur: اگر ہم کم تعداد میں جیتیں تو ثابت ہوگا کہ عزم زیادہ اہم ہے
  evidence:
    ar: 'قالوا: نمضي إلى الماء حتى نلقى عدوّنا'
    en: 'they said: we march to the water until we meet our foe'
    ur: 'انھوں نے کہا: ہم پانی تک چلیں گے یہاں تک کہ دشمن سے ملیں'
  sources:
  - event/battle-of-badr
- holder:
    ar: الحذرون
    en: the cautious
    ur: محتاط
  stance:
    ar: القافلة فاتت؛ القتال مغامرة قد تهلكنا جميعًا
    en: the caravan is gone; fighting is a gamble that could ruin us all
    ur: قافلہ نکل گیا؛ لڑنا وہ جوا ہے جو سب کو ہلاک کر سکتا ہے
  evidence:
    ar: كان العدد والعدة لصالح قريش، وانسحاب غير مذموم
    en: the numbers and gear favoured Quraysh, and withdrawal was no shame
    ur: تعداد اور سازوسامان قریش کے حق میں تھا اور پیچھے ہٹنا برائی نہیں تھی
  sources:
  - place/mecca
reflection:
  ar: أيّ وجه كان سيغلب عليك لو سُئل رأيك يومها؟ اكتب سببك.
  en: Which side would have won you over had your opinion been asked that day? Write your reason.
  ur: اگر اس دن آپ کی رائے لی جاتی تو کس طرف جھکتے؟ وجہ لکھیں۔
