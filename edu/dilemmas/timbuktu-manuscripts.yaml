id: timbuktu-manuscripts
band: scholars
decision:
  ar: إخفاء الكتب أم إتاحتها؟
  en: Hide the manuscripts or share them?
  ur: مخطوطات چھپائیں یا عام کریں؟
context:
  ar: 'في تمبكتو ورثت الأسر مخطوطات نفيسة في الفقه والطب والنجوم. ومع قلق الغزو والتلف، القرار: إخفاؤها في الصناديق لحمايتها، أم إتاحتها للدارسين والنسّاخ حتى تعيش؟'
  en: 'In Timbuktu families inherited precious manuscripts in law, medicine and the stars. With fear of raiders and decay the decision: hide them in chests to protect
    them, or open them to students and copyists so they live?'
  ur: 'تمبکتو میں خاندانوں کو فقہ، طب اور نجوم کے نفیس مخطوطات وراثت میں ملے۔ حملہ آوروں اور تباہی کے خوف کے سامنے فیصلہ: حفاظت کے لیے صندوقوں میں چھپانا یا طلبہ
    اور نساخوں کے لیے کھولنا تاکہ وہ زندہ رہیں؟'
positions:
- holder:
    ar: حرّاس المخطوطات
    en: the manuscript keepers
    ur: مخطوطات کے محافظ
  stance:
    ar: المخطوط الذي يهلك لا يُنسخ أبدًا؛ الاحتفاظ أولًا
    en: a ruined manuscript is never copied; safekeeping first
    ur: جو مخطوطہ تباہ ہو وہ کبھی نقل نہیں ہوتا؛ پہلے تحفظ
  evidence:
    ar: خبّأوا صناديقهم في حفر الجدران والرمال عند الخطر
    en: they buried their chests in wall hollows and sand at danger
    ur: انھوں نے خطرے کے وقت صندوق دیواروں اور ریت میں دبائے
  sources:
  - place/timbuktu
- holder:
    ar: المدرسون والنسّاخ
    en: the teachers and copyists
    ur: مدرس اور نساخ
  stance:
    ar: الكتاب المحفوظ الذي لا يُقرأ ميت؛ النسخ حياة
    en: a kept book unread is dead; copying is life
    ur: جو کتاب محفوظ مگر نہ پڑھی جائے مردہ ہے؛ نقل زندگی ہے
  evidence:
    ar: درّسوا ونسخوا حتى تكاثرت المتون في يد كل طالب
    en: they taught and copied until the texts multiplied in every student's hand
    ur: انھوں نے پڑھایا اور نقل کیا یہاں تک کہ متن ہر طالب علم کے ہاتھ بڑھ گئے
  sources:
  - place/timbuktu
  - exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
reflection:
  ar: لو كانت عندك مخطوطة وحيدة، أتحفظها أم تنشرها؟ اكتب سببك.
  en: If you held a single manuscript, would you keep it or spread it? Write your reason.
  ur: اگر آپ کے پاس واحد مخطوطہ ہوتا تو محفوظ رکھتے یا پھیلاتے؟ وجہ لکھیں۔
