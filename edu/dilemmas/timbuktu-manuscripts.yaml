id: timbuktu-manuscripts
band: scholars
decision:
  ar: إخفاء الكتب أم إتاحتها؟
  en: Hide the manuscripts or share them?
  ur: مخطوطات چھپائیں یا عام کریں؟
  fr: Cacher les manuscrits ou les partager ?
  tr: Kitapları saklamak mı yoksa erişime açmak mı?
  id: Menyembunyikan buku atau membuatnya tersedia?
context:
  ar: 'في تمبكتو ورثت الأسر مخطوطات نفيسة في الفقه والطب والنجوم. ومع قلق الغزو والتلف، القرار: إخفاؤها في الصناديق لحمايتها، أم إتاحتها للدارسين والنسّاخ حتى تعيش؟'
  en: 'In Timbuktu families inherited precious manuscripts in law, medicine and the stars. With fear of raiders and decay the decision: hide them in chests to protect them, or open them to students and
    copyists so they live?'
  ur: 'تمبکتو میں خاندانوں کو فقہ، طب اور نجوم کے نفیس مخطوطات وراثت میں ملے۔ حملہ آوروں اور تباہی کے خوف کے سامنے فیصلہ: حفاظت کے لیے صندوقوں میں چھپانا یا طلبہ اور نساخوں کے لیے کھولنا تاکہ وہ زندہ رہیں؟'
  fr: À Tombouctou, des familles ont hérité de précieux manuscrits de droit musulman, de médecine et d’astronomie. Les raids et le temps menacent ces écrits. Faut-il les cacher dans des coffres pour les
    protéger ou les mettre à la disposition des élèves et des copistes pour qu’ils continuent à vivre ?
  tr: Timbuktu'da aileler hukuk, tıp ve astronomi alanlarında değerli el yazmalarını miras aldı. İstila ve yıkım endişesi arasında, onları korumak için kutulara mı saklayacaklar, yoksa yaşayabilmeleri için
    bilim insanları ve yazıcılara mı sunacaklardı?
  id: Di Timbuktu, keluarga-keluarga mewarisi manuskrip berharga dalam bidang yurisprudensi, kedokteran, dan astronomi. Di tengah kecemasan akan invasi dan kehancuran, keputusannya adalah apakah menyembunyikannya
    dalam kotak untuk melindunginya, atau membuatnya tersedia bagi para sarjana dan juru tulis agar mereka bisa hidup?
positions:
- holder:
    ar: حرّاس المخطوطات
    en: the manuscript keepers
    ur: مخطوطات کے محافظ
    fr: Les gardiens des manuscrits
    tr: El Yazması Koruyucuları
    id: Penjaga Manuskrip
  stance:
    ar: المخطوط الذي يهلك لا يُنسخ أبدًا؛ الاحتفاظ أولًا
    en: a ruined manuscript is never copied; safekeeping first
    ur: جو مخطوطہ تباہ ہو وہ کبھی نقل نہیں ہوتا؛ پہلے تحفظ
    fr: Un manuscrit détruit ne sera jamais recopié. Il faut d’abord le mettre à l’abri.
    tr: Bozulabilir bir el yazması asla kopyalanmaz; önce onu saklayın.
    id: Naskah yang mudah rusak tidak pernah disalin; simpan dulu.
  evidence:
    ar: خبّأوا صناديقهم في حفر الجدران والرمال عند الخطر
    en: they buried their chests in wall hollows and sand at danger
    ur: انھوں نے خطرے کے وقت صندوق دیواروں اور ریت میں دبائے
    fr: En cas de danger, ils dissimulaient leurs coffres dans des creux de murs ou sous le sable.
    tr: Kutularını duvar deliklerine sakladılar ve tehlike olduğunda kum yaptılar.
    id: Mereka menyembunyikan kotak mereka di lubang dinding dan pasir saat bahaya terjadi.
  sources:
  - place/timbuktu
- holder:
    ar: المدرسون والنسّاخ
    en: the teachers and copyists
    ur: مدرس اور نساخ
    fr: Les enseignants et les copistes
    tr: Öğretmenler ve Yazıcılar
    id: Guru dan Juru Tulis
  stance:
    ar: الكتاب المحفوظ الذي لا يُقرأ ميت؛ النسخ حياة
    en: a kept book unread is dead; copying is life
    ur: جو کتاب محفوظ مگر نہ پڑھی جائے مردہ ہے؛ نقل زندگی ہے
    fr: Un livre qu’on conserve sans le lire est un livre mort. Le copier, c’est le faire vivre.
    tr: Okunmayan korunmuş kitap ölüdür; kopyalamak hayattır
    id: Buku yang diawetkan dan tidak dibaca sudah mati; menyalin adalah kehidupan
  evidence:
    ar: درّسوا ونسخوا حتى تكاثرت المتون في يد كل طالب
    en: they taught and copied until the texts multiplied in every student's hand
    ur: انھوں نے پڑھایا اور نقل کیا یہاں تک کہ متن ہر طالب علم کے ہاتھ بڑھ گئے
    fr: Ils enseignaient et recopiaient les textes, jusqu’à ce que chaque élève puisse en avoir une copie.
    tr: Çalıştılar ve kopyaladılar, ta ki metinler her öğrencinin elinde çoğalanana kadar
    id: Mereka belajar dan menyalin sampai teks berlipat ganda di tangan masing-masing siswa
  sources:
  - place/timbuktu
  - exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
reflection:
  ar: لو كانت عندك مخطوطة وحيدة، أتحفظها أم تنشرها؟ اكتب سببك.
  en: If you held a single manuscript, would you keep it or spread it? Write your reason.
  ur: اگر آپ کے پاس واحد مخطوطہ ہوتا تو محفوظ رکھتے یا پھیلاتے؟ وجہ لکھیں۔
  fr: Si tu n’avais qu’un seul manuscrit, le garderais-tu à l’abri ou le partagerais-tu ? Explique pourquoi.
  tr: Eğer sadece bir el yazmanız varsa, onu ezberliyor musunuz yoksa yayınlıyor musunuz? Gerekçenizi yazın.
  id: Jika Anda hanya memiliki satu naskah, apakah Anda menghafalnya atau menerbitkannya? Tuliskan alasan Anda.
