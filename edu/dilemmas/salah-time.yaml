    fr: Ils priaient dès le début de l’heure, avant qu’autre chose ne les retienne.
    tr: Namaz geldiğinde aceleyle koştular, ama bir dikkat dağıtıcı unsurla meşgul oldular.
    id: Mereka bergegas ke doa saat tiba sebelum mereka sibuk dengan gangguan.
