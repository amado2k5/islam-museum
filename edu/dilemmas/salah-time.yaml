reflection:
  ar: أيهما تختار عندما يتعارض الوقت والجماعة؟ اكتب سببك.
  en: Which do you choose when the hour and the company clash? Write your reason.
  ur: جب وقت اور جماعت ٹکرائیں تو آپ کیا چنتے ہیں؟ وجہ لکھیں۔
  fr: Que choisis-tu quand tu ne peux pas à la fois prier dès le début de l’heure et prier en groupe ? Explique pourquoi.
  tr: Zaman ve grup çatışmadığında hangisini seçersiniz? Sebebinizi yazın.
  id: Mana yang kamu pilih saat waktu dan kelompok bertentangan? Tuliskan alasanmu.
