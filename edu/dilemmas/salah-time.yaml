    en: prayer on time is the dearest work; a right is not delayed
    ur: وقت پر نماز محبوب ترین عمل ہے؛ حق مؤجل نہیں ہوتا
    fr: Prier à l’heure est l’un des actes les plus aimés. On ne repousse pas un devoir.
    tr: Zamanında dua etmek en sevilen eylemdir; ertelenmez.
    id: Berdoa tepat waktu adalah perbuatan yang paling dicintai; tidak ditunda.
  evidence:
