id: salah-time
band: scholars
decision:
  ar: الصلاة في أول وقتها أم مع الجماعة؟
  en: Pray at the hour's start or with the company?
  ur: وقت کے شروع میں نماز یا جماعت کے ساتھ؟
  fr: Prier dès le début de l’heure ou en groupe ?
  tr: Bu dua en erken zamanında mı yoksa cemaatle mi birlikte?
  id: Apakah doa pada waktu paling awal atau bersama jemaat?
context:
  ar: 'دخل وقت الصلاة وأنت في بيتك قادر أن تصلي وحدك الآن، أو تنتظر قليلًا لتلحق بجماعة الحيّ. القرار: الصلاة على أول وقتها فردًا، أم تأخيرها لصلاة الجماعة؟'
  en: 'The prayer hour has come in and you can pray alone at home now, or wait a little and join the neighbourhood congregation. The decision: prayer at the first of its time alone, or delaying it to pray
    together?'
  ur: 'نماز کا وقت شروع ہوا اور آپ گھر پر ابھی تنہا پڑھ سکتے ہیں یا تھوڑا انتظار کر کے محلے کی جماعت میں شامل ہوں۔ فیصلہ: وقت کے آغاز میں تنہا نماز یا اسے دیر کر کے سب کے ساتھ؟'
  fr: L’heure de la prière est arrivée. Tu peux prier seul chez toi tout de suite, ou attendre un peu pour rejoindre les gens du quartier. Vaut-il mieux prier seul dès le début de l’heure ou attendre pour
    prier ensemble ?
  tr: 'Dua zamanı evdeyken girdi, şimdi yalnız dua edebilir veya mahalle cemaatine katılmak için biraz bekleyebilirsiniz. Karar: Dua belirlenen saatte bireysel olarak mı kılınmalı yoksa cemaat duası için
    ertelenmeli mi?'
  id: 'Waktu doa telah masuk saat Anda berada di rumah, dapat berdoa sendiri sekarang atau menunggu sebentar untuk bergabung dengan jemaat di lingkungan sekitar. Keputusan: Haruskah doa dilakukan pada waktu
    yang ditentukan secara individual, atau harus ditunda untuk doa jemaat?'
