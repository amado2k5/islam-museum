id: salah-time
band: scholars
decision:
  ar: الصلاة في أول وقتها أم مع الجماعة؟
  en: Pray at the hour's start or with the company?
  ur: وقت کے شروع میں نماز یا جماعت کے ساتھ؟
context:
  ar: 'دخل وقت الصلاة وأنت في بيتك قادر أن تصلي وحدك الآن، أو تنتظر قليلًا لتلحق بجماعة الحيّ. القرار: الصلاة على أول وقتها فردًا، أم تأخيرها لصلاة الجماعة؟'
  en: 'The prayer hour has come in and you can pray alone at home now, or wait a little and join the neighbourhood congregation. The decision: prayer at the first
    of its time alone, or delaying it to pray together?'
  ur: 'نماز کا وقت شروع ہوا اور آپ گھر پر ابھی تنہا پڑھ سکتے ہیں یا تھوڑا انتظار کر کے محلے کی جماعت میں شامل ہوں۔ فیصلہ: وقت کے آغاز میں تنہا نماز یا اسے دیر کر
    کے سب کے ساتھ؟'
positions:
- holder:
    ar: أهل أول الوقت
    en: the first-hour party
    ur: پہلے وقت کے حامی
  stance:
    ar: الصلاة على وقتها أحبّ الأعمال؛ لا يُؤجَّل حق
    en: prayer on time is the dearest work; a right is not delayed
    ur: وقت پر نماز محبوب ترین عمل ہے؛ حق مؤجل نہیں ہوتا
  evidence:
    ar: سارعوا إلى الصلاة حين حلّت قبل أن يشغلهم شاغل
    en: they hurried to prayer when it came lest something occupy them
    ur: وہ وقت آتے ہی نماز کی طرف جلدی کیے کہ کہیں اور مصروف نہ ہوں
  sources:
  - practice/salah
- holder:
    ar: أهل الجماعة
    en: the congregation party
    ur: جماعت کے حامی
  stance:
    ar: الجماعة أعظم أجرًا وتربط الحيّ بمسجده
    en: congregation is the greater reward and binds the quarter to its mosque
    ur: جماعت بڑا اجر ہے اور محلے کو مسجد سے جوڑتی ہے
  evidence:
    ar: انتظروا ليدخلوا في صلاة واحدة مع الناس
    en: they waited to enter one prayer with the people
    ur: انھوں نے انتظار کیا تاکہ لوگوں کے ساتھ ایک نماز میں داخل ہوں
  sources:
  - practice/salah
  - concept/five-pillars
reflection:
  ar: أيهما تختار عندما يتعارض الوقت والجماعة؟ اكتب سببك.
  en: Which do you choose when the hour and the company clash? Write your reason.
  ur: جب وقت اور جماعت ٹکرائیں تو آپ کیا چنتے ہیں؟ وجہ لکھیں۔
