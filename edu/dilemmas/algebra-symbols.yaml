id: algebra-symbols
band: researchers
decision:
  ar: الكلمات أم الرموز للجبر؟
  en: Words or symbols for algebra?
  ur: الجبر کے لیے الفاظ یا علامات؟
context:
  ar: 'عالم يعرف أن الأفكار الدقيقة تحتاج اختصارًا، لكن قرّاءه تعلّموا النثر. القرار: كتابة معادلاته بالجمل الكاملة الواضحة التي يفهمها الجميع، أم اختراع رموز مختصرة
    تقصّر العمل لكنها تحتاج تعلمًا جديدًا؟'
  en: 'A scholar knows precise ideas need abbreviation, but his readers learned prose. The decision: write his equations in the full clear sentences everyone understands,
    or invent shortened symbols that cut the work but need new learning?'
  ur: 'ایک عالم جانتا ہے کہ درست خیالات کو اختصار چاہیے، مگر اس کے قارئین نثر سیکھے ہوئے ہیں۔ فیصلہ: مساوات مکمل واضح جملوں میں لکھنا جو سب سمجھیں یا ایسی مختصر علامتیں
    ایجاد کرنا جو کام کم کریں مگر نیا سیکھنا چاہیں؟'
positions:
- holder:
    ar: أهل النثر
    en: the prose party
    ur: نثر کے حامی
  stance:
    ar: الكتابة بالكلام تُقرأ في كل مكان بلا مفتاح
    en: writing in words is read everywhere with no key
    ur: الفاظ میں لکھنا ہر جگہ بغیر کنجی پڑھا جاتا ہے
  evidence:
    ar: كتب الخوارزمي بالجمل فتعلم منه كل قارئ
    en: al-Khwarizmi wrote in sentences and every reader learned
    ur: الخوارزمی نے جملوں میں لکھا اور ہر قاری نے سیکھا
  sources:
  - concept/algebra
  - person/al-khwarizmi
- holder:
    ar: أهل الرموز
    en: the symbolers
    ur: علامات کے حامی
  stance:
    ar: الرمز يختصر صفحة في سطر ويكشف البنية
    en: the symbol shortens a page to a line and shows the structure
    ur: علامت صفحہ کو سطر میں سمیٹتی اور ساخت دکھاتی ہے
  evidence:
    ar: تطورت الرموز لاحقًا حتى صارت لغة الرياضيات
    en: symbols later grew until they became mathematics' language
    ur: علامات بعد میں بڑھیں یہاں تک کہ ریاضی کی زبان بنیں
  sources:
  - concept/algebra
reflection:
  ar: أيّ الطريقتين كنت ستكتب بها لو اخترعت علمًا جديدًا؟ اكتب سببك.
  en: Which way would you have written had you invented a new science? Write your reason.
  ur: اگر آپ نیا علم ایجاد کرتے تو کس طریقے سے لکھتے؟ وجہ لکھیں۔
