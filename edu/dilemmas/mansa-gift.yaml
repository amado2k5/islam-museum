  stance:
    ar: العطية تروّج الاسم وتمحو العداوات في الطريق
    en: the gift spreads the name and erases enmities along the way
    ur: تحفہ نام پھیلاتا اور راستے کی دشمنیاں مٹاتا ہے
    fr: Les dons font connaître celui qui les offre et apaisent les inimitiés sur la route.
    tr: Al-Attiyah ismi yayıyor ve yol boyunca düşmanlıkları ortadan kaldırıyor
    id: Al-Attiyah mempromosikan nama tersebut dan menghapus permusuhan sepanjang jalan
  evidence:
    ar: ترك وراءه أسواقًا انتعشت وعلماء رافقوه إلى بلاده
    en: he left thriving markets behind him and scholars who followed him home
    ur: پیچھے خوشحال بازار اور ایسے علماء چھوڑے جو اس کے ساتھ وطن آئے
    fr: Il a laissé derrière lui des marchés prospères, et des savants l’ont suivi jusque dans son pays.
    tr: Geride gelişen pazarlar ve ülkesine eşlik eden bilginler bıraktı
    id: Ia meninggalkan pasar yang berkembang pesat dan para cendekiawan yang menemaninya ke negaranya
  sources:
