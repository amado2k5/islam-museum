id: mansa-gift
band: scholars
decision:
  ar: إنفاق على العطاء أم على البناء؟
  en: Spend on gifts or on building?
  ur: تحفوں پر خرچ کریں یا تعمیر پر؟
  fr: Dépenser en dons ou en constructions ?
  tr: Bağış mı yoksa inşaat için mi harcama?
  id: Pengeluaran untuk memberi atau membangun?
context:
  ar: 'في طريق حجّه حمل مانسا موسى ذهبًا كثيرًا، ففرّق جانبًا منه هدايا وصدقات حتى رخص سعر الذهب في القاهرة سنين. القرار أمام أمثاله: الإنفاق سخاءً يفتح القلوب، أم حبس المال للمساجد والمدارس والآبار؟'
  en: 'On his pilgrimage Mansa Musa carried much gold and gave part of it in gifts and alms until the price of gold fell in Cairo for years. The decision for one like him: open-handed giving that wins hearts,
    or holding the money for mosques, schools and wells?'
  ur: 'حج کے سفر میں مانسا موسیٰ بہت سونا لے گیا اور اس کا ایک حصہ تحفوں اور صدقات میں بانٹا یہاں تک کہ قاہرہ میں سونے کی قیمت برسوں گری۔ اس جیسے کے لیے فیصلہ: کھلے ہاتھ سے عطیہ جو دل جیتے یا مال روک کر
    مسجدوں، مدارس اور کنوؤں پر لگانا؟'
  fr: Lors de son pèlerinage, Mansa Moussa emporte beaucoup d’or et en distribue tant en cadeaux et en aumônes que le prix de l’or baisse au Caire pendant des années. À sa place, faut-il donner largement
    pour gagner les cœurs, ou réserver l’argent à la construction de mosquées, d’écoles et de puits ?
  tr: 'Hac yolculuğunda Mansa Musa, çok fazla altın taşıdı, bir kısmını hediye ve sadaka olarak dağıttı, ta ki Kahire''de altın fiyatı yıllarca düşene kadar. Onun gibi insanların önündeki karar: Kalpleri
    açan cömert harcamalar mı, yoksa camiler, okullar ve kuyular için para biriktirmek mi?'
  id: 'Dalam perjalanan ziarahnya, Mansa Musa membawa banyak emas, membagikan sebagian sebagai hadiah dan sedekah sampai harga emas di Kairo turun selama bertahun-tahun. Keputusan yang harus dihadapi orang-orang
    seperti dia: Apakah menghabiskan uang yang murah hati membuka hati, atau menimbun uang untuk masjid, sekolah, dan sumur?'
positions:
- holder:
    ar: السخاء الطريق
    en: the generous road
    ur: سخی راستہ
