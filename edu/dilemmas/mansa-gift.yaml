    fr: Les partisans des constructions
    tr: İnşaatçılar
    id: Pembangun
  stance:
    ar: المسجد والمدرسة باقيان بعد زوال الغنيمة
    en: the mosque and school remain when the bounty is spent
    ur: مسجد اور مدرسہ دولت ختم ہونے کے بعد باقی رہتے ہیں
    fr: Une mosquée ou une école reste debout quand les dons ont été dépensés.
    tr: Cami ve okul, ganimetler bittikten sonra da kalacak.
    id: Masjid dan sekolah akan tetap ada setelah hasil rampasan habis.
  evidence:
    ar: أمر بالمدارس والمساجد في تمبكتو حتى صارت عاصمة العلم
    en: he ordered schools and mosques in Timbuktu until it became learning's capital
    ur: انھوں نے تمبکتو میں مدارس اور مسجدیں بنوائیں یہاں تک کہ وہ علم کا پایہ تخت بنا
    fr: Il a fait bâtir des écoles et des mosquées à Tombouctou, qui est devenue une capitale du savoir.
    tr: Timbuktu'da okullar ve camiler inşa etti, ta ki burası bilgi başkenti olana kadar
    id: Ia memerintahkan sekolah dan masjid di Timbuktu hingga kota itu menjadi ibu kota ilmu pengetahuan
  sources:
  - place/timbuktu
  - person/mansa-musa
reflection:
  ar: لو كنت معه في القافلة، أيهما كنت ستنصح أولًا؟ اكتب سببك.
  en: If you rode in his caravan, which would you have advised first? Write your reason.
  ur: اگر آپ اس کے قافلے میں ہوتے تو پہلے کیا مشورہ دیتے؟ وجہ لکھیں۔
  fr: Si tu avais voyagé dans sa caravane, que lui aurais-tu conseillé en priorité ? Explique pourquoi.
  tr: Eğer onunla kervanda olsaydın, önce hangisini önerirdin? Sebebini yaz.
  id: Jika kamu bersamanya di karavan, mana yang akan kamu rekomendasikan terlebih dahulu? Tuliskan alasanmu.
