id: mansa-gift
band: scholars
decision:
  ar: إنفاق على العطاء أم على البناء؟
  en: Spend on gifts or on building?
  ur: تحفوں پر خرچ کریں یا تعمیر پر؟
context:
  ar: 'في طريق حجّه حمل مانسا موسى ذهبًا كثيرًا، ففرّق جانبًا منه هدايا وصدقات حتى رخص سعر الذهب في القاهرة سنين. القرار أمام أمثاله: الإنفاق سخاءً يفتح القلوب، أم
    حبس المال للمساجد والمدارس والآبار؟'
  en: 'On his pilgrimage Mansa Musa carried much gold and gave part of it in gifts and alms until the price of gold fell in Cairo for years. The decision for one
    like him: open-handed giving that wins hearts, or holding the money for mosques, schools and wells?'
  ur: 'حج کے سفر میں مانسا موسیٰ بہت سونا لے گیا اور اس کا ایک حصہ تحفوں اور صدقات میں بانٹا یہاں تک کہ قاہرہ میں سونے کی قیمت برسوں گری۔ اس جیسے کے لیے فیصلہ: کھلے
    ہاتھ سے عطیہ جو دل جیتے یا مال روک کر مسجدوں، مدارس اور کنوؤں پر لگانا؟'
positions:
- holder:
    ar: السخاء الطريق
    en: the generous road
    ur: سخی راستہ
  stance:
    ar: العطية تروّج الاسم وتمحو العداوات في الطريق
    en: the gift spreads the name and erases enmities along the way
    ur: تحفہ نام پھیلاتا اور راستے کی دشمنیاں مٹاتا ہے
  evidence:
    ar: ترك وراءه أسواقًا انتعشت وعلماء رافقوه إلى بلاده
    en: he left thriving markets behind him and scholars who followed him home
    ur: پیچھے خوشحال بازار اور ایسے علماء چھوڑے جو اس کے ساتھ وطن آئے
  sources:
  - person/mansa-musa
  - place/cairo
- holder:
    ar: أصحاب البناء
    en: the building party
    ur: تعمیر کے حامی
  stance:
    ar: المسجد والمدرسة باقيان بعد زوال الغنيمة
    en: the mosque and school remain when the bounty is spent
    ur: مسجد اور مدرسہ دولت ختم ہونے کے بعد باقی رہتے ہیں
  evidence:
    ar: أمر بالمدارس والمساجد في تمبكتو حتى صارت عاصمة العلم
    en: he ordered schools and mosques in Timbuktu until it became learning's capital
    ur: انھوں نے تمبکتو میں مدارس اور مسجدیں بنوائیں یہاں تک کہ وہ علم کا پایہ تخت بنا
  sources:
  - place/timbuktu
  - person/mansa-musa
reflection:
  ar: لو كنت معه في القافلة، أيهما كنت ستنصح أولًا؟ اكتب سببك.
  en: If you rode in his caravan, which would you have advised first? Write your reason.
  ur: اگر آپ اس کے قافلے میں ہوتے تو پہلے کیا مشورہ دیتے؟ وجہ لکھیں۔
