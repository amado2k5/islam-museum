reflection:
  ar: أيّ المشروعين كنت ستمول لو كنت الوزير؟ اكتب سببك.
  en: Which project would you have funded as the vizier? Write your reason.
  ur: اگر آپ وزیر ہوتے تو کون سا منصوبہ فنڈ کرتے؟ وجہ لکھیں۔
  fr: À la place du vizir, quel projet aurais-tu financé ? Explique pourquoi.
  tr: Eğer ben bakan olsaydım, hangisini finanse ederdin? Gerekçeni yaz.
  id: Proyek mana dari dua proyek yang akan Anda danai jika saya menjadi menteri? Tuliskan alasan Anda.
