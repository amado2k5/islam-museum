id: bayt-fund
band: researchers
decision:
  ar: تمويل الترجمة أم التأليف؟
  en: Fund translation or original writing?
  ur: ترجمے کے لیے مال یا تالیف کے لیے؟
context:
  ar: 'بيت الحكمة في بغداد يملك ميزانية تكفي مشروعًا كبيرًا واحدًا: حملة ترجمة تجلب طب وفلسفة ونجوم اليونان والهند إلى العربية، أم تمويل مؤلفين عرب يكتبون كتبًا جديدة
    من عند أنفسهم؟ القرار: استيراد العلم أم صناعته؟'
  en: 'Baghdad''s House of Wisdom holds a budget that covers one great project: a translation campaign bringing Greek and Indian medicine, philosophy and astronomy
    into Arabic, or funding Arab authors writing new books of their own? The decision: import knowledge or make it?'
  ur: 'بغداد کے بیت الحکمت کے پاس ایسا بجٹ ہے جو ایک بڑے منصوبے کو چلا سکے: ترجمے کی مہم جو یونانی اور ہندوستانی طب، فلسفہ اور فلکیات عربی میں لائے یا عرب مصنفین
    کو مال دینا جو اپنی نئی کتابیں لکھیں؟ فیصلہ: علم کی درآمد یا تیاری؟'
positions:
- holder:
    ar: أهل الترجمة
    en: the translation party
    ur: ترجمہ کے حامی
  stance:
    ar: ألف عام من العلم اليوناني في جيل واحد بالترجمة
    en: a thousand years of Greek learning in one generation through translation
    ur: ترجمے سے ایک نسل میں ہزار سال کا یونانی علم
  evidence:
    ar: جلس المترجمون يقابلون المتون حتى صارت العربية لسان العلم
    en: the translators collated texts until Arabic became learning's tongue
    ur: مترجم متنوں کی مقابلہ کاری کرتے رہے یہاں تک کہ عربی علم کی زبان بنی
  sources:
  - building/bayt-al-hikma
  - place/baghdad
- holder:
    ar: أهل التأليف
    en: the authorship party
    ur: تالیف کے حامی
  stance:
    ar: من لا يُؤلّف يظلّ تلميذًا أبدًا؛ الأمة تكتب كتبها
    en: who never authors stays a pupil forever; the nation writes its books
    ur: جو تالیف نہیں کرتا ہمیشہ شاگرد رہتا ہے؛ قوم اپنی کتابیں لکھتی ہے
  evidence:
    ar: خرج من البيئة نفسها الخوارزمي وابن سينا بعد جيل
    en: from that same milieu came al-Khwarizmi and Ibn Sina a generation on
    ur: اسی فضا سے ایک نسل بعد الخوارزمی اور ابن سینا آئے
  sources:
  - building/bayt-al-hikma
  - person/al-khwarizmi
  - person/ibn-sina
reflection:
  ar: أيّ المشروعين كنت ستمول لو كنت الوزير؟ اكتب سببك.
  en: Which project would you have funded as the vizier? Write your reason.
  ur: اگر آپ وزیر ہوتے تو کون سا منصوبہ فنڈ کرتے؟ وجہ لکھیں۔
