id: bayt-fund
band: researchers
decision:
  ar: تمويل الترجمة أم التأليف؟
  en: Fund translation or original writing?
  ur: ترجمے کے لیے مال یا تالیف کے لیے؟
  fr: Financer les traductions ou de nouveaux ouvrages ?
  tr: Çeviri finansmanı mı yoksa yazarlık mı?
  id: Pendanaan terjemahan atau kepenulisan?
context:
  ar: 'بيت الحكمة في بغداد يملك ميزانية تكفي مشروعًا كبيرًا واحدًا: حملة ترجمة تجلب طب وفلسفة ونجوم اليونان والهند إلى العربية، أم تمويل مؤلفين عرب يكتبون كتبًا جديدة من عند أنفسهم؟ القرار: استيراد العلم
    أم صناعته؟'
  en: 'Baghdad''s House of Wisdom holds a budget that covers one great project: a translation campaign bringing Greek and Indian medicine, philosophy and astronomy into Arabic, or funding Arab authors writing
    new books of their own? The decision: import knowledge or make it?'
  ur: 'بغداد کے بیت الحکمت کے پاس ایسا بجٹ ہے جو ایک بڑے منصوبے کو چلا سکے: ترجمے کی مہم جو یونانی اور ہندوستانی طب، فلسفہ اور فلکیات عربی میں لائے یا عرب مصنفین کو مال دینا جو اپنی نئی کتابیں لکھیں؟ فیصلہ:
    علم کی درآمد یا تیاری؟'
  fr: 'La Maison de la sagesse de Bagdad a de quoi financer un seul grand projet : traduire en arabe des ouvrages grecs et indiens de médecine, de philosophie et d’astronomie, ou soutenir des auteurs arabes
    qui écrivent de nouveaux livres. Faut-il faire venir le savoir d’ailleurs ou en produire de nouveau ?'
  tr: 'Bağdat''taki Bilgelik Evi''nin tek büyük bir proje için yeterli bütçesi var: Yunanistan ve Hindistan''dan tıp, felsefe ve yıldızları Arapçaya getiren bir çeviri kampanyası mı, yoksa kendi başına
    yeni kitaplar yazan Arap yazarları finanse etmek mi? Karar: Bilimi ithal etmek mi yoksa üretmek mi?'
  id: 'House of Wisdom di Baghdad memiliki anggaran yang cukup untuk satu proyek besar: kampanye terjemahan yang membawa kedokteran, filsafat, dan bintang dari Yunani dan India ke dalam bahasa Arab, atau
    mendanai penulis Arab yang menulis buku baru sendiri? Keputusan: Mengimpor ilmu pengetahuan atau memproduksinya?'
