id: astronomy-funds
band: researchers
decision:
  ar: المرصد أم المستشفى؟
  en: The observatory or the hospital?
  ur: رصدگاہ یا شفاخانہ؟
context:
  ar: 'سلطان يملك مالًا يكفي بناءً واحدًا عظيمًا: مرصد يقيس النجوم ويصحح التقويم والقبلة والمواقيت، أم بيمارستان يعالج المرضى ويعلّم الأطباء؟ القرار: العلم الذي يعالج
    الأبد، أم الدواء الذي يعالج اليوم؟'
  en: 'A sultan holds money enough for one great building: an observatory measuring the stars and correcting the calendar, the qibla and the times, or a hospital
    treating the sick and teaching the doctors? The decision: the learning that heals forever, or the medicine healing today?'
  ur: 'ایک سلطان کے پاس اتنا مال ہے جو ایک عظیم عمارت کے لیے کافی ہو: رصدگاہ جو ستارے ناپے اور تقویم، قبلہ اور اوقات درست کرے یا شفاخانہ جو مریضوں کا علاج کرے اور
    معالجوں کو سکھائے؟ فیصلہ: وہ علم جو ہمیشہ کے لیے شفا دے یا آج کی دوا؟'
positions:
- holder:
    ar: أهل المرصد
    en: the observatory party
    ur: رصدگاہ کے حامی
  stance:
    ar: النجوم تحكم المواقيت والسفر والفصول؛ قياسها ضرورة
    en: the stars rule the times, the travel, the seasons; measuring them is need
    ur: ستارے اوقات، سفر اور موسم پر حاکم ہیں؛ ان کا ناپنا ضروری ہے
  evidence:
    ar: بُنيت المراصد فصحّحت الجداول الفلكية أجيالًا
    en: observatories were built and corrected the astronomical tables for generations
    ur: رصدگاہیں بنیں اور زچ نسلوں تک فلکی جداول درست کیں
  sources:
  - concept/astronomy
  - place/baghdad
- holder:
    ar: أهل البيمارستان
    en: the hospital party
    ur: شفاخانہ کے حامی
  stance:
    ar: الإنسان قبل السماء؛ شفاء المريض أقرب برّ
    en: man before sky; healing the sick is the nearer good
    ur: انسان پہلے، آسمان بعد میں؛ مریض کی شفا قریب تر نیکی ہے
  evidence:
    ar: عالجت البيمارستانات المرضى وعلّمت الأطباء دون تمييز
    en: the hospitals treated the sick and taught doctors without distinction
    ur: شفاخانوں نے مریضوں کا علاج اور معالجوں کی تعلیم بغیر امتیاز کی
  sources:
  - place/damascus
  - person/ibn-sina
reflection:
  ar: أيّ البنائين كان يستحق مالك لو كنت السلطان؟ اكتب سببك.
  en: Which building would your money have deserved as sultan? Write your reason.
  ur: اگر آپ سلطان ہوتے تو آپ کا مال کس عمارت کا حقدار ہوتا؟ وجہ لکھیں۔
