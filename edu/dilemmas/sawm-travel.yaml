id: sawm-travel
band: scholars
decision:
  ar: الصوم في السفر أم التأجيل؟
  en: Fast on the road or postpone it?
  ur: سفر میں روزہ یا مؤجل؟
context:
  ar: 'أنت في سفر طويل شاق في شهر رمضان، والرخصة تقول: صُم إن شئت أو أفطر وأعِد. القرار: الصيام على المشقة ومعك حقك، أم التأجيل حتى ترجع فيسهل عليك وعلى رفاقك؟'
  en: 'You are on a long hard journey in Ramadan, and the licence says: fast if you will, or break it and make it up. The decision: fast through the hardship, rightfully
    yours, or postpone until you return to ease for you and your companions?'
  ur: 'آپ رمضان میں لمبے کٹھن سفر پر ہیں اور رخصت کہتی ہے: چاہے روزہ رکھو یا نہ رکھو اور بعد میں پورا کرو۔ فیصلہ: مشقت کے ساتھ روزہ رکھنا جو آپ کا حق ہے یا واپسی
    تک مؤجل کرنا تاکہ آپ اور ساتھیوں پر آسان ہو؟'
positions:
- holder:
    ar: المتمسكون
    en: the keepers
    ur: متمسک
  stance:
    ar: الصوم عبادة لا تؤجَّل ما استُطيع؛ الرخصة لا واجب
    en: fasting is worship not postponed while possible; licence is not duty
    ur: روزہ عبادت ہے ممکن ہوتے مؤجل نہیں ہوتا؛ رخصت فرض نہیں
  evidence:
    ar: صاموا في السفر صابرين على المسير
    en: they fasted on the road, patient through the march
    ur: انھوں نے سفر میں روزہ رکھا، چلنے پر صبر کرتے ہوئے
  sources:
  - practice/sawm-ramadan
  - event/hijra
- holder:
    ar: الآخذون بالرخصة
    en: the licence takers
    ur: رخصت لینے والے
  stance:
    ar: الرخصة جُعلت للسفر؛ أخذها اتباع لا تفريط
    en: the licence was made for travel; taking it follows, not neglects
    ur: رخصت سفر کے لیے بنی؛ اسے لینا پیروی ہے، غفلت نہیں
  evidence:
    ar: أفطروا وأعادوا حتى سلم البدن والرفقة
    en: they broke it and made it up so body and company stayed safe
    ur: انھوں نے نہیں رکھا اور بعد میں پورا کیا تاکہ جسم اور رفقہ بچے رہیں
  sources:
  - practice/sawm-ramadan
reflection:
  ar: أيهما أيسر لك في سفرك ولماذا؟ اكتب سببك.
  en: Which is easier for you on your journey and why? Write your reason.
  ur: آپ کے لیے اپنے سفر میں کون سا آسان ہے اور کیوں؟ وجہ لکھیں۔
