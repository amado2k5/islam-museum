id: sawm-travel
band: scholars
decision:
  ar: الصوم في السفر أم التأجيل؟
  en: Fast on the road or postpone it?
  ur: سفر میں روزہ یا مؤجل؟
  fr: Jeûner en voyage ou rattraper les jours plus tard ?
  tr: Seyahat sırasında oruç tutmak mı yoksa erteleme mi?
  id: Puasa saat bepergian atau penundaan?
context:
  ar: 'أنت في سفر طويل شاق في شهر رمضان، والرخصة تقول: صُم إن شئت أو أفطر وأعِد. القرار: الصيام على المشقة ومعك حقك، أم التأجيل حتى ترجع فيسهل عليك وعلى رفاقك؟'
  en: 'You are on a long hard journey in Ramadan, and the licence says: fast if you will, or break it and make it up. The decision: fast through the hardship, rightfully yours, or postpone until you return
    to ease for you and your companions?'
  ur: 'آپ رمضان میں لمبے کٹھن سفر پر ہیں اور رخصت کہتی ہے: چاہے روزہ رکھو یا نہ رکھو اور بعد میں پورا کرو۔ فیصلہ: مشقت کے ساتھ روزہ رکھنا جو آپ کا حق ہے یا واپسی تک مؤجل کرنا تاکہ آپ اور ساتھیوں پر آسان
    ہو؟'
  fr: Tu fais un long voyage éprouvant pendant le ramadan. La dispense du voyage te permet soit de jeûner, soit de manger et de rattraper les jours plus tard. Continueras-tu à jeûner malgré la difficulté,
    comme tu en as le droit, ou attendras-tu ton retour pour que le trajet soit plus facile pour toi et tes compagnons ?
  tr: 'Ramazan ayında uzun ve zorlu bir yolculuktasınız ve imtiyaz şöyle diyor: isterseniz oruç tutun, ya da orucunuzu bozup sayın. Karar: zorluklara rağmen oruç tutmak ve hakkınız varsa, yoksa geri dönene
    kadar ertelemek ve sizin ve yoldaşlarınız için kolaylaşmak mı?'
  id: 'Anda sedang dalam perjalanan panjang dan melelahkan di bulan Ramadan, dan konsesi itu mengatakan: puasa jika Anda mau, atau putuskan puasa dan hitung. Keputusan: berpuasa meskipun kesulitan dan Anda
    memiliki hak, atau menunda sampai Anda kembali dan menjadi lebih mudah bagi Anda dan teman-teman Anda?'
positions:
- holder:
    ar: المتمسكون
    en: the keepers
    ur: متمسک
    fr: Ceux qui maintiennent le jeûne
    tr: Direnenler
    id: Para Holdout
  stance:
    ar: الصوم عبادة لا تؤجَّل ما استُطيع؛ الرخصة لا واجب
    en: fasting is worship not postponed while possible; licence is not duty
    ur: روزہ عبادت ہے ممکن ہوتے مؤجل نہیں ہوتا؛ رخصت فرض نہیں
    fr: Le jeûne est un acte de culte qu’on ne reporte pas tant qu’on le peut. Une dispense n’est pas une obligation.
    tr: Oruç, elimden geleni ertelemeyen bir ibadet eylemidir; taviz zorunlu değildir
    id: Puasa adalah tindakan ibadah yang tidak menunda apa yang bisa saya lakukan; konsesi itu tidak wajib
  evidence:
    ar: صاموا في السفر صابرين على المسير
    en: they fasted on the road, patient through the march
    ur: انھوں نے سفر میں روزہ رکھا، چلنے پر صبر کرتے ہوئے
    fr: Ils ont jeûné en voyage, supportant patiemment les difficultés de la route.
    tr: Yolculuk sırasında oruç tuttular, yolculukta sabırlı oldular
    id: Mereka berpuasa saat bepergian, sabar dalam perjalanan
  sources:
  - practice/sawm-ramadan
  - event/hijra
- holder:
    ar: الآخذون بالرخصة
    en: the licence takers
    ur: رخصت لینے والے
    fr: Ceux qui choisissent la dispense
    tr: Lisans sahipleri
    id: Pemegang lisensi
  stance:
    ar: الرخصة جُعلت للسفر؛ أخذها اتباع لا تفريط
    en: the licence was made for travel; taking it follows, not neglects
    ur: رخصت سفر کے لیے بنی؛ اسے لینا پیروی ہے، غفلت نہیں
    fr: La dispense est prévue pour le voyage. En profiter, ce n’est pas négliger son devoir.
    tr: Lisans seyahat için verilmiştir; almak ihmal değil, takip etme meselesidir.
    id: Izin dibuat untuk perjalanan; mengambilnya adalah soal mengikuti, bukan kelalaian.
  evidence:
    ar: أفطروا وأعادوا حتى سلم البدن والرفقة
    en: they broke it and made it up so body and company stayed safe
    ur: انھوں نے نہیں رکھا اور بعد میں پورا کیا تاکہ جسم اور رفقہ بچے رہیں
    fr: Ils ont interrompu leur jeûne et rattrapé ces jours plus tard, pour préserver leur santé et celle de leurs compagnons.
    tr: Oruçlarını açtılar ve beden ile arkadaşları teslim edilene kadar geri döndüler
    id: Mereka berbuka sasa dan kembali sampai jenazah dan temannya dikirimkan
  sources:
  - practice/sawm-ramadan
reflection:
  ar: أيهما أيسر لك في سفرك ولماذا؟ اكتب سببك.
  en: Which is easier for you on your journey and why? Write your reason.
  ur: آپ کے لیے اپنے سفر میں کون سا آسان ہے اور کیوں؟ وجہ لکھیں۔
  fr: Quelle option te semblerait la plus facile pendant ce voyage ? Explique pourquoi.
  tr: Yolculuğunuzda hangisi daha kolay ve neden? Sebebinizi yazın.
  id: Mana yang lebih mudah dalam perjalanan Anda dan mengapa? Tuliskan alasan Anda.
