decision:
  ar: أرقام هندية أم أحرف عربية؟
  en: Indian digits or Arabic letters?
  ur: ہندوستانی ہندسے یا عربی حروف؟
  fr: Des chiffres indiens ou des lettres arabes ?
  tr: Hint rakamları mı yoksa Arap harfleri mi?
  id: Angka India atau huruf Arab?
context:
  ar: 'الخوارزمي يكتب كتاب الجبر والمقابلة أمامه اختيار: تبنّي الأرقام الهندية ٠-٩ الجديدة التي تسهّل الحساب لكنها غريبة على القرّاء، أم الاحتفاظ بالأحرف والكلمات العربية التي يعرفها الجميع؟ القرار: دقة
    الرموز أم قرب الألفاظ؟'
  en: 'Al-Khwarizmi writing his book of algebra faces a choice: adopt the new Indian digits 0-9 easing calculation but strange to readers, or keep the Arabic letters and words everyone knows? The decision:
    precision of symbols or closeness of words?'
  ur: 'الخوارزمی الجبر و المقابلہ کی کتاب لکھتے ہوئے انتخاب کے سامنے تھا: نئے ہندوستانی ہندسے 0-9 اپنانا جو حساب آسان کرتے مگر قارئین کو اجنبی لگتے یا وہ عربی حروف اور الفاظ رکھنا جو سب جانتے ہیں؟ فیصلہ:
    علامات کی درستگی یا الفاظ کی قربت؟'
  fr: 'En écrivant son livre d’algèbre, al-Khwarizmi doit choisir : adopter les chiffres indiens de 0 à 9, qui facilitent les calculs mais sont nouveaux pour ses lecteurs, ou garder les lettres et les mots
    arabes que tout le monde connaît. Que privilégier : la précision des symboles ou la familiarité des mots ?'
  tr: 'Al-Khwarizmi, ''Cebir ve Röportaj'' adlı kitabı yazıyor: Bir seçim: Hesaplamayı kolaylaştıran ama okuyuculara yabancı hale getiren yeni Hint rakamları 0-9''u benimsemek mi, yoksa herkesin bildiği
    Arapça harfleri ve kelimeleri korumak mı? Karar: Sembollerin doğruluğu mu yoksa kelimelerin yakınlığı mı?'
  id: 'Al-Khwarizmi menulis buku Aljabar dan Wawancara Sebelum Dia Pilihan: Mengadopsi angka India baru 0-9 yang membuat perhitungan lebih mudah namun asing bagi pembaca, atau mempertahankan huruf dan kata
    Arab yang sudah dikenal semua orang? Keputusan: Ketepatan simbol atau kedekatan kata?'
