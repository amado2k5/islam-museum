id: khwarizmi-names
band: researchers
decision:
  ar: أرقام هندية أم أحرف عربية؟
  en: Indian digits or Arabic letters?
  ur: ہندوستانی ہندسے یا عربی حروف؟
context:
  ar: 'الخوارزمي يكتب كتاب الجبر والمقابلة أمامه اختيار: تبنّي الأرقام الهندية ٠-٩ الجديدة التي تسهّل الحساب لكنها غريبة على القرّاء، أم الاحتفاظ بالأحرف والكلمات
    العربية التي يعرفها الجميع؟ القرار: دقة الرموز أم قرب الألفاظ؟'
  en: 'Al-Khwarizmi writing his book of algebra faces a choice: adopt the new Indian digits 0-9 easing calculation but strange to readers, or keep the Arabic letters
    and words everyone knows? The decision: precision of symbols or closeness of words?'
  ur: 'الخوارزمی الجبر و المقابلہ کی کتاب لکھتے ہوئے انتخاب کے سامنے تھا: نئے ہندوستانی ہندسے 0-9 اپنانا جو حساب آسان کرتے مگر قارئین کو اجنبی لگتے یا وہ عربی حروف
    اور الفاظ رکھنا جو سب جانتے ہیں؟ فیصلہ: علامات کی درستگی یا الفاظ کی قربت؟'
positions:
- holder:
    ar: أهل الأرقام
    en: the digits party
    ur: ہندسوں کے حامی
  stance:
    ar: الصفر يفتح الحساب الذي تسدّه الأحرف
    en: zero opens the arithmetic letters close
    ur: صفر وہ حساب کھولتا ہے جو حروف بند کرتے ہیں
  evidence:
    ar: دخلت الأرقام حساب الميراث والتجارة فعمّت
    en: the digits entered inheritance and trade arithmetic and spread
    ur: ہندسے وراثت اور تجارت کے حساب میں آئے اور پھیل گئے
  sources:
  - person/al-khwarizmi
  - concept/algebra
- holder:
    ar: أهل الألفاظ
    en: the words party
    ur: الفاظ کے حامی
  stance:
    ar: الجبر يُقرأ باللسان الذي يفهمه الناس، لا بأشكال غريبة
    en: algebra is read in the tongue people understand, not strange shapes
    ur: الجبر اسی زبان میں پڑھا جاتا ہے جو لوگ سمجھتے ہیں، اجنبی شکلوں میں نہیں
  evidence:
    ar: كتب بالنثر الكامل فصار كتابه مدرسة أجيال
    en: he wrote in full prose so his book schooled generations
    ur: انھوں نے مکمل نثر میں لکھا تو کتاب نسلوں کی مدرسہ بنی
  sources:
  - person/al-khwarizmi
  - concept/algebra
reflection:
  ar: 'أيهما كان سيخدم كتابك أكثر: الرمز أم اللفظ؟ اكتب سببك.'
  en: 'Which would have served your book more: symbol or word? Write your reason.'
  ur: 'آپ کی کتاب کو کیا زیادہ فائدہ دیتا: علامت یا لفظ؟ وجہ لکھیں۔'
