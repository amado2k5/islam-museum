id: salah-travel
band: scholars
decision:
  ar: الصلاة في الجماعة أم وحدها في السفر؟
  en: Prayer with the group or alone on a journey?
  ur: سفر میں نماز جماعت سے یا تنہا؟
context:
  ar: 'أنت في سفر مع قافلة تستعجل المسير قبل الغروب. القرار: الصلاة في وقتها وحدك على جنب الطريق، أم الانتظار لتصلي جماعة حين يحلّ الركب؟ الصلاة فرض في كل حال، لكن
    أيهما تقدّم: الوقت أم الجماعة؟'
  en: 'You travel with a caravan pressing on before sunset. The decision: pray on time alone by the roadside, or wait to pray in congregation when the train halts?
    Prayer is due either way, but which comes first: the hour or the company?'
  ur: 'آپ ایک قافلے کے ساتھ سفر میں ہیں جو غروب سے پہلے چلنا چاہتا ہے۔ فیصلہ: وقت پر راستے کے کنارے تنہا نماز پڑھنا یا قافلے کے رکنے پر جماعت کے ساتھ پڑھنے کا انتظار؟
    نماز ہر صورت میں فرض ہے، لیکن پہلے کیا: وقت یا جماعت؟'
positions:
- holder:
    ar: أهل الوقت
    en: the on-time party
    ur: وقت کے حامی
  stance:
    ar: الصلاة مؤقتة؛ الوقت الذي يفوت لا يعود
    en: prayer is timed; the hour that passes never returns
    ur: نماز مقرر وقت کی ہے؛ جو وقت نکلا وہ واپس نہیں آتا
  evidence:
    ar: صلّوا حيث حلّ الوقت ولو على الرمل
    en: they prayed where the hour found them, even on sand
    ur: انھوں نے وہاں نماز پڑھی جہاں وقت آیا، ریت پر بھی
  sources:
  - practice/salah
  - event/hijra
- holder:
    ar: أهل الجماعة
    en: the congregation party
    ur: جماعت کے حامی
  stance:
    ar: الجماعة تُصلي وتُعَلِّم وتوحّد الركب
    en: the congregation prays, teaches and binds the train together
    ur: جماعت نماز بھی پڑھاتی اور قافلے کو جوڑتی ہے
  evidence:
    ar: فضّلوا الانتظار ليجتمع الناس على صلاة واحدة
    en: they preferred to wait so the people would gather on one prayer
    ur: انھوں نے انتظار کو ترجیح دی تاکہ لوگ ایک نماز پر جمع ہوں
  sources:
  - practice/salah
reflection:
  ar: أيهما كنت ستختار في سفرك الطويل؟ اكتب سببك.
  en: Which would you have chosen on your long journey? Write your reason.
  ur: آپ اپنے لمبے سفر میں کیا چنتے؟ وجہ لکھیں۔
