id: salah-travel
band: scholars
decision:
  ar: الصلاة في الجماعة أم وحدها في السفر؟
  en: Prayer with the group or alone on a journey?
  ur: سفر میں نماز جماعت سے یا تنہا؟
  fr: En voyage, prier en groupe ou seul ?
  tr: Cemaatte mi yoksa seyahat sırasında yalnız mı dua etmek gerekiyor?
  id: Apakah itu berdoa dalam jemaat atau sendirian saat bepergian?
context:
  ar: 'أنت في سفر مع قافلة تستعجل المسير قبل الغروب. القرار: الصلاة في وقتها وحدك على جنب الطريق، أم الانتظار لتصلي جماعة حين يحلّ الركب؟ الصلاة فرض في كل حال، لكن أيهما تقدّم: الوقت أم الجماعة؟'
  en: 'You travel with a caravan pressing on before sunset. The decision: pray on time alone by the roadside, or wait to pray in congregation when the train halts? Prayer is due either way, but which comes
    first: the hour or the company?'
  ur: 'آپ ایک قافلے کے ساتھ سفر میں ہیں جو غروب سے پہلے چلنا چاہتا ہے۔ فیصلہ: وقت پر راستے کے کنارے تنہا نماز پڑھنا یا قافلے کے رکنے پر جماعت کے ساتھ پڑھنے کا انتظار؟ نماز ہر صورت میں فرض ہے، لیکن پہلے
    کیا: وقت یا جماعت؟'
  fr: 'Tu voyages dans une caravane qui se hâte d’avancer avant le coucher du soleil. Tu peux prier seul à l’heure, au bord du chemin, ou attendre l’arrêt de la caravane pour prier en groupe. Dans les deux
    cas, la prière reste obligatoire. À quoi donner la priorité : à l’heure ou au groupe ?'
  tr: 'Gün batımından önce yolculuğu hızlandıran bir kervanla seyahat ediyorsunuz. Karar: Belirlenen saatte yol kenarında yalnız mı dua edeceksiniz, yoksa kervanlar geldiğinde bir grup mı dua edecek? Her
    durumda dua zorunludur, ama hangisi önce gelir: zaman mı yoksa cemaat mı?'
  id: 'Anda bepergian dengan karavan yang mempercepat perjalanan sebelum matahari terbenam. Keputusan: Berdoa pada waktu yang ditentukan sendirian di pinggir jalan, atau menunggu sekelompok orang berdoa
    saat karavan tiba? Doa wajib dalam semua kasus, tapi mana yang utama: waktu atau jemaat?'
