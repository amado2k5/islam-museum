id: baghdad-market
band: researchers
decision:
  ar: سوق الكتب أم سوق البضائع؟
  en: The book market or the goods market?
  ur: کتب بازار یا مال بازار؟
  fr: Un marché du livre ou un marché de marchandises ?
  tr: Kitap pazarı mı, mal pazarı mı?
  id: Pasar buku atau pasar barang?
context:
  ar: 'بغداد في أزمنتها الذهبية توسّع حيًّا جديدًا على ضفة دجلة: سوق ورّاقين تبيع الكتب والنسخ وتجمع العلماء، أم سوق بضائع تستقبل قوافل الحرير والتوابل فتغنّي الخزينة؟ القرار: رأس المال الفكري أم رأس المال
    المادي؟'
  en: 'Baghdad in its golden age expands a new quarter on the Tigris bank: a stationers'' market selling books and copies and gathering scholars, or a goods market receiving silk and spice caravans to enrich
    the treasury? The decision: intellectual capital or material capital?'
  ur: 'بغداد اپنے سنہری زمانے میں دجلہ کے کنارے نیا محلہ بڑھا رہا ہے: وراقین کا بازار جو کتابیں اور نقلیں بیچے اور علماء جمع کرے یا مال کا بازار جو ریشم اور مصالحوں کے قافلے لے کر خزانہ بھرے؟ فیصلہ: فکری
    سرمایہ یا مادی سرمایہ؟'
  fr: 'À l’âge d’or de Bagdad, un nouveau quartier prend forme sur la rive du Tigre. Doit-on y installer un marché du livre où des libraires vendront des ouvrages et des copies, et où se retrouveront les
    savants ? Ou accueillir des caravanes de soie et d’épices pour enrichir le trésor public ? Que privilégier : le savoir ou la richesse matérielle ?'
  tr: 'Altın çağında Bağdat, Dicle kıyısında yeni bir mahalle genişletiyor: kitap ve kopya satan, bilginleri toplayan sofistike bir pazar mı, yoksa hazineyi zenginleştirmek için ipek ve baharat kervanları
    alan bir mal pazarı mı? Karar: Entelektüel sermaye mi yoksa maddi sermaye mi?'
  id: 'Baghdad di masa keemasannya memperluas lingkungan baru di tepi Sungai Tigris: pasar canggih yang menjual buku dan salinan, mengumpulkan para cendekiawan, atau pasar barang yang menerima karavan sutra
    dan rempah-rempah untuk memperkaya kas? Keputusan: Modal intelektual atau modal materi?'
