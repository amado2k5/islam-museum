id: baghdad-market
band: researchers
decision:
  ar: سوق الكتب أم سوق البضائع؟
  en: The book market or the goods market?
  ur: کتب بازار یا مال بازار؟
context:
  ar: 'بغداد في أزمنتها الذهبية توسّع حيًّا جديدًا على ضفة دجلة: سوق ورّاقين تبيع الكتب والنسخ وتجمع العلماء، أم سوق بضائع تستقبل قوافل الحرير والتوابل فتغنّي الخزينة؟
    القرار: رأس المال الفكري أم رأس المال المادي؟'
  en: 'Baghdad in its golden age expands a new quarter on the Tigris bank: a stationers'' market selling books and copies and gathering scholars, or a goods market
    receiving silk and spice caravans to enrich the treasury? The decision: intellectual capital or material capital?'
  ur: 'بغداد اپنے سنہری زمانے میں دجلہ کے کنارے نیا محلہ بڑھا رہا ہے: وراقین کا بازار جو کتابیں اور نقلیں بیچے اور علماء جمع کرے یا مال کا بازار جو ریشم اور مصالحوں
    کے قافلے لے کر خزانہ بھرے؟ فیصلہ: فکری سرمایہ یا مادی سرمایہ؟'
positions:
- holder:
    ar: أهل الورّاقين
    en: the stationers' party
    ur: وراقین کے حامی
  stance:
    ar: سوق الكتب يصنع العلماء الذين يصنعون كل سوق
    en: the book market makes the scholars who make every market
    ur: کتابوں کا بازار وہ علماء بناتا ہے جو ہر بازار بناتے ہیں
  evidence:
    ar: اشتهرت بغداد بورّاقيها أكثر مما اشتهرت بحريرها
    en: Baghdad was famed for its stationers more than its silk
    ur: بغداد اپنے وراقین سے ریشم سے زیادہ مشہور تھا
  sources:
  - place/baghdad
  - building/bayt-al-hikma
- holder:
    ar: أهل البضائع
    en: the goods party
    ur: مال کے حامی
  stance:
    ar: القوافل تطعم المدينة وتدفع للمترجمين أجورهم
    en: the caravans feed the city and pay the translators' wages
    ur: قافلے شہر کو کھلاتے اور مترجموں کی اجرت دیتے ہیں
  evidence:
    ar: دخلت الحرير والتوابل طرقها فصارت عاصمة العالم التجارية
    en: silk and spices entered her roads and she became the world's trade capital
    ur: ریشم اور مصالحے اس کے راستوں میں آئے تو وہ دنیا کی تجارتی پایہ تخت بنی
  sources:
  - exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
  - place/baghdad
reflection:
  ar: أيّ السوقين كان أولى بأرضك لو كنت العمّار؟ اكتب سببك.
  en: Which market would your land have deserved as the planner? Write your reason.
  ur: اگر آپ منصوبہ ساز ہوتے تو آپ کی زمین کس بازار کی حقدار ہوتی؟ وجہ لکھیں۔
