id: four-cities-first
band: scholars
decision:
  ar: السوق أم المكتبة أولًا؟
  en: The market or the library first?
  ur: پہلے بازار یا کتب خانہ؟
context:
  ar: 'مدينة جديدة تبني مركزها، والمال يكفي لبناء واحد الآن: سوق يجمع القوافل والحرفيين فتعيش المدينة، أم مدرسة ومكتبة تجمع العلماء فيتعلم أبناؤها؟ القرار: خبز اليوم
    أم علم الغد؟'
  en: 'A new city builds its heart, and the money covers one building now: a market gathering caravans and craftsmen so the city lives, or a school and library gathering
    scholars so its children learn? The decision: today''s bread or tomorrow''s learning?'
  ur: 'ایک نیا شہر اپنا مرکز بنا رہا ہے اور مال ابھی ایک ہی عمارت کے لیے کافی ہے: بازار جو قافلے اور کاریگر جمع کرے تاکہ شہر زندہ رہے یا مدرسہ اور کتب خانہ جو علماء
    جمع کرے تاکہ اس کے بچے پڑھیں؟ فیصلہ: آج کی روٹی یا کل کا علم؟'
positions:
- holder:
    ar: أهل السوق
    en: the market party
    ur: بازار کے حامی
  stance:
    ar: بلا قوت لا مدينة ولا طلب علم
    en: without bread there is no city and no seeking knowledge
    ur: روٹی کے بغیر نہ شہر نہ علم کی طلب
  evidence:
    ar: عمّرت المدن الكبرى أسواقها أولًا فازدهر حولها كل شيء
    en: the great cities raised their markets first and everything flowered around
    ur: بڑے شہروں نے پہلے بازار بنائے اور سب کچھ ان کے گرد کھلا
  sources:
  - exhibit/pathway-g4-social-studies-four-cities
  - place/baghdad
- holder:
    ar: أهل المدرسة
    en: the school party
    ur: مدرسہ کے حامی
  stance:
    ar: المدينة الغنية الجاهلة تموت؛ العلم يصنع الغنى
    en: a rich ignorant city dies; learning makes the wealth
    ur: امیر مگر جاہل شہر مرتا ہے؛ علم دولت بناتا ہے
  evidence:
    ar: جمعت بغداد وقرطبة العلماء قبل أن تشتهر أسواقها
    en: Baghdad and Cordoba gathered scholars before their markets were famed
    ur: بغداد اور قرطبہ نے بازار مشہور ہونے سے پہلے علماء جمع کیے
  sources:
  - exhibit/pathway-g4-social-studies-four-cities
  - place/cordoba
reflection:
  ar: أيهما تبني أولًا لو كنت منظّمًا لمدينة؟ اكتب سببك.
  en: Which would you build first planning a city? Write your reason.
  ur: اگر آپ شہر کا منصوبہ بند ہوتے تو پہلے کیا بناتے؟ وجہ لکھیں۔
