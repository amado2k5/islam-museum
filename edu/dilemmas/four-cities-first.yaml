id: four-cities-first
band: scholars
decision:
  ar: السوق أم المكتبة أولًا؟
  en: The market or the library first?
  ur: پہلے بازار یا کتب خانہ؟
  fr: Le marché ou la bibliothèque en premier ?
  tr: Önce pazar mı yoksa kütüphane mi?
  id: Pasar atau perpustakaan dulu?
context:
  ar: 'مدينة جديدة تبني مركزها، والمال يكفي لبناء واحد الآن: سوق يجمع القوافل والحرفيين فتعيش المدينة، أم مدرسة ومكتبة تجمع العلماء فيتعلم أبناؤها؟ القرار: خبز اليوم أم علم الغد؟'
  en: 'A new city builds its heart, and the money covers one building now: a market gathering caravans and craftsmen so the city lives, or a school and library gathering scholars so its children learn?
    The decision: today''s bread or tomorrow''s learning?'
  ur: 'ایک نیا شہر اپنا مرکز بنا رہا ہے اور مال ابھی ایک ہی عمارت کے لیے کافی ہے: بازار جو قافلے اور کاریگر جمع کرے تاکہ شہر زندہ رہے یا مدرسہ اور کتب خانہ جو علماء جمع کرے تاکہ اس کے بچے پڑھیں؟ فیصلہ:
    آج کی روٹی یا کل کا علم؟'
  fr: 'Une ville nouvelle aménage son centre. Pour le moment, elle n’a les moyens de bâtir qu’un seul édifice : un marché qui réunira caravanes et artisans et fera vivre la ville, ou une école avec une
    bibliothèque où des savants instruiront les enfants. Que privilégier : le pain d’aujourd’hui ou le savoir de demain ?'
  tr: 'Yeni bir şehir merkezini inşa ediyor ve para şimdi bir tane inşa etmek için yeterli: kervanları ve zanaatkârları bir araya getiren bir pazar, böylece şehir yaşayabilir, yoksa çocuklarının öğrenmesi
    için bilginleri bir araya getiren bir okul ve kütüphane mi? Karar: Bugünün ekmeği mi yoksa yarının bayrağı mı?'
  id: 'Sebuah kota baru membangun pusatnya, dan uangnya sudah cukup untuk membangunnya sekarang: pasar yang mengumpulkan karavan dan pengrajin agar kota bisa hidup, atau sekolah dan perpustakaan yang mengumpulkan
    para cendekiawan agar anak-anaknya bisa belajar? Keputusan: Roti hari ini atau bendera besok?'
