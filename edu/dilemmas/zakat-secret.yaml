id: zakat-secret
band: scholars
decision:
  ar: إخفاء الزكاة أم إعلانها؟
  en: Hide the zakat or give it openly?
  ur: زکوٰت چھپائیں یا ظاہر کریں؟
context:
  ar: 'حان وقت زكاتك السنوية. طريقان: أداؤها خفيًا في يد المحتاج حتى لا يراك أحد وتصفّي النيّة، أم أداؤها علنًا ليقتدي بك الناس ويطمئن الفقير أنه غير منسيّ؟ القرار:
    الخفاء يحفظ الصدق، أم العلانية تنشر العادة؟'
  en: 'Your yearly zakat is due. Two ways: give it quietly into the needy hand so none see and the intention stays pure, or give it openly so others copy you and
    the poor know they are not forgotten? The decision: secrecy keeping sincerity, or openness spreading the habit?'
  ur: 'آپ کی سالانہ زکوٰت آ گئی۔ دو راستے: خاموشی سے محتاج کے ہاتھ میں دینا تاکہ کوئی نہ دیکھے اور نیت صاف رہے یا اعلانیہ دینا تاکہ دوسرے آپ کی پیروی کریں اور غریب
    جانے کہ وہ بھولا نہیں؟ فیصلہ: اخلاص بچانے والا چھپانا یا عادت پھیلانے والا ظاہر کرنا؟'
positions:
- holder:
    ar: أهل الخفاء
    en: the secrecy party
    ur: خفی کے حامی
  stance:
    ar: الصدقة السرية أبعد عن الرياء وأقرب للقبول
    en: the secret charity is farthest from show and nearest acceptance
    ur: خفیہ صدقہ دکھاوے سے دور اور قبولیت کے قریب تر ہے
  evidence:
    ar: فضّلوا أن تجهَل يمينهم ما أنفقت شمالهم
    en: they preferred their right hand not know what the left spent
    ur: انھوں نے ترجیح دی کہ دائیں ہاتھ کو خبر نہ ہو کیا خرچ کیا
  sources:
  - practice/zakat
- holder:
    ar: أهل الإعلان
    en: the open party
    ur: علانیہ کے حامی
  stance:
    ar: المعلن يُقتدى به؛ صدقة علنية تولّد مئة مثلها
    en: the open giver is followed; one public alms births a hundred
    ur: ظاہر دینے والے کی پیروی ہوتی ہے؛ ایک کھلا صدقہ سو پیدا کرتا ہے
  evidence:
    ar: أعلنوا أداءهم ليحفّزوا جيرانهم على الزكاة
    en: they declared their giving to stir their neighbours to zakat
    ur: انھوں نے اپنی ادائیگی ظاہر کی تاکہ ہمسائے زکوٰت پر ابھاریں
  sources:
  - practice/zakat
  - concept/five-pillars
reflection:
  ar: أيّ الطريقين كنت ستسلك؟ اكتب سببك.
  en: Which road would you have taken? Write your reason.
  ur: آپ کون سا راستہ اختیار کرتے؟ وجہ لکھیں۔
