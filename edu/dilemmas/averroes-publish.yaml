id: averroes-publish
band: researchers
decision:
  ar: النشر أم الكتمان لابن رشد؟
  en: Publish or withhold for Ibn Rushd?
  ur: ابن رشد کے لیے شائع کرنا یا چھپانا؟
context:
  ar: 'ابن رشد القاضي والمعلّق على أرسطو أمام خيار مرير: نشر شروحه التي تقرأ الفلسفة كما هي فتُغضب المتشددين وتكلّفه منصبه وربما حياته، أم كتمان النصوص لنفسه وتلاميذه
    فيسلم؟ القرار: الحقيقة أم الأمان؟'
  en: 'Ibn Rushd, judge and commentator on Aristotle, faces a bitter choice: publish commentaries reading philosophy as it is, angering the hard-liners and costing
    him his post and perhaps his life, or keep the texts for himself and his students and stay safe? The decision: truth or safety?'
  ur: 'قاضی ابن رشد، ارسطو کے شارح، کڑوے انتخاب کے سامنے تھا: اپنی شروحات شائع کرنا جو فلسفہ جیسا ہے ویسا پڑھیں اور سخت گیروں کو ناراض کر کے منصب اور شاید جان خطرے
    میں ڈالیں یا متن اپنے اور شاگردوں کے لیے رکھ کر سلامت رہنا؟ فیصلہ: سچ یا امن؟'
positions:
- holder:
    ar: أهل النشر
    en: the publishers
    ur: شائع کرنے والے
  stance:
    ar: العلم الذي يُكتم يموت؛ الشروح ملك للقارئ
    en: suppressed learning dies; the commentaries belong to the reader
    ur: جو علم دبایا جائے وہ مرتا ہے؛ شروحات قاری کی ہیں
  evidence:
    ar: واصل التعليق على المتون حتى سمّاه الغرب المعلّق
    en: he kept commenting on the texts until the West named him the Commentator
    ur: انھوں نے متنوں پر شرح جاری رکھی یہاں تک کہ مغرب نے انھیں شارح کہا
  sources:
  - person/ibn-rushd
  - place/cordoba
- holder:
    ar: أهل الكتمان
    en: the withholders
    ur: چھپانے والے
  stance:
    ar: الحياة والمنصب خدمة أكبر من كتاب قد يُحرق
    en: life and office serve more than a book that may burn
    ur: جان اور منصب اس کتاب سے بڑی خدمت ہے جو شاید جلائی جائے
  evidence:
    ar: رأوا العقوبة تسقط على من فتح الباب قبله
    en: they saw the penalty fall on whoever had opened the door before
    ur: انھوں نے دیکھا کہ اس دروازے کو پہلے کھولنے والے پر سزا گری
  sources:
  - person/ibn-rushd
reflection:
  ar: لو كنت مكانه، هل كنت ستنشر؟ اكتب سببك.
  en: If you were him, would you have published? Write your reason.
  ur: اگر آپ ان کی جگہ ہوتے تو شائع کرتے؟ وجہ لکھیں۔
