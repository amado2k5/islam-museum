id: averroes-publish
band: researchers
decision:
  ar: النشر أم الكتمان لابن رشد؟
  en: Publish or withhold for Ibn Rushd?
  ur: ابن رشد کے لیے شائع کرنا یا چھپانا؟
  fr: Ibn Rouchd doit-il publier ses commentaires ?
  tr: İbn Rüşd tarafından yayımlanma mı yoksa gizlenme mi?
  id: Menerbitkan atau menyembunyikan karya Ibn Rushd?
context:
  ar: 'ابن رشد القاضي والمعلّق على أرسطو أمام خيار مرير: نشر شروحه التي تقرأ الفلسفة كما هي فتُغضب المتشددين وتكلّفه منصبه وربما حياته، أم كتمان النصوص لنفسه وتلاميذه فيسلم؟ القرار: الحقيقة أم الأمان؟'
  en: 'Ibn Rushd, judge and commentator on Aristotle, faces a bitter choice: publish commentaries reading philosophy as it is, angering the hard-liners and costing him his post and perhaps his life, or
    keep the texts for himself and his students and stay safe? The decision: truth or safety?'
  ur: 'قاضی ابن رشد، ارسطو کے شارح، کڑوے انتخاب کے سامنے تھا: اپنی شروحات شائع کرنا جو فلسفہ جیسا ہے ویسا پڑھیں اور سخت گیروں کو ناراض کر کے منصب اور شاید جان خطرے میں ڈالیں یا متن اپنے اور شاگردوں کے لیے
    رکھ کر سلامت رہنا؟ فیصلہ: سچ یا امن؟'
  fr: 'Ibn Rouchd, juge et commentateur d’Aristote, est face à un choix difficile. Publier ses commentaires et exposer la philosophie telle qu’il la comprend risque de lui attirer la colère des plus intransigeants
    et de lui coûter son poste, voire la vie. Doit-il garder ses textes pour lui et ses élèves afin de rester en sécurité ? Que privilégier : la vérité ou la sécurité ?'
  tr: 'Aristoteles hakkında yargıç ve yorumcu İbn Rüşd, acı bir seçimle karşı karşıya: Felsefeyi olduğu gibi okuyan yorumlarını yayımlayıp aşırılıkçıları kızdıracak ve konumunu, belki de hayatını kaybettirecek
    mi, yoksa metinleri kendisi ve öğrencileri için gizli tutup sonra teslim olmak mı? Karar: Gerçek mi yoksa güvenlik mi?'
  id: 'Ibn Rushd, hakim dan komentator Aristoteles, dihadapkan pada pilihan pahit: menerbitkan komentarnya yang membaca filsafat apa adanya, membuat marah para ekstremis dan membuatnya kehilangan posisinya
    dan mungkin nyawanya, atau menyimpan teks-teks itu rahasia untuk dirinya dan murid-muridnya lalu menyerah? Keputusan: Kebenaran atau keselamatan?'
