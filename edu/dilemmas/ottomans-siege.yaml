id: ottomans-siege
band: researchers
decision:
  ar: الأسوار أم الحصار لقسطنطينية؟
  en: Storm the walls or besiege Constantinople?
  ur: دیواریں توڑیں یا قسطنطنیہ کا محاصرہ؟
context:
  ar: 'عام ١٤٥٣ وقف محمد الثاني أمام أحصن أسوار العصر. خياران: حصار طويل يتعب الغذاء والمال ويخاطر بنجدة الغرب، أم هجوم شامل بالمدافع الجديدة على أسوار لم تُخترق
    ألف عام؟ القرار: الزمن أم الدم؟'
  en: 'In 1453 Mehmed II stood before the age''s strongest walls. Two options: a long siege draining food and money and risking Western relief, or a full assault
    with the new cannon on walls unbreached for a thousand years? The decision: time or blood?'
  ur: '1453 میں محمد دوم دور کی مضبوط ترین دیواروں کے سامنے کھڑا تھا۔ دو راستے: لمبا محاصرہ جو خوراک اور خزانہ نچوڑے اور مغربی امداد کا خطرہ رکھے یا نئی توپوں سے
    ہزار سال ناٹوڑ دیواروں پر مکمل حملہ؟ فیصلہ: وقت یا خون؟'
positions:
- holder:
    ar: دعاة الهجوم
    en: the assault party
    ur: حملہ کے حامی
  stance:
    ar: المدافع العظام صُبّت لهذا اليوم؛ الأسـوار ستُكسر
    en: the great guns were cast for this day; the walls will break
    ur: بڑی توپیں اسی دن کے لیے ڈھالیں گئیں؛ دیواریں ٹوٹیں گی
  evidence:
    ar: نصب المدفعية أسابيع حتى فُتحت الثغور
    en: he ranged the artillery for weeks until the breaches opened
    ur: انھوں نے ہفتوں توپیں نصب کیں یہاں تک کہ راستے کھل گئے
  sources:
  - exhibit/pathway-g12-chy4u-ottomans-gunpowder-empires
  - place/istanbul
- holder:
    ar: دعاة الحصار
    en: the siege party
    ur: محاصرہ کے حامی
  stance:
    ar: المدينة الجائعة تسلّم بغير قتال؛ الحصار يوفر الدم
    en: a starving city yields without a battle; siege saves blood
    ur: بھوکا شہر بغیر لڑے ہارتا ہے؛ محاصرہ خون بچاتا ہے
  evidence:
    ar: عدّوا سنين الحروب التي كُسرت على هذه الأسوار
    en: they counted the years of wars that broke on these walls
    ur: انھوں نے جنگوں کے وہ سال گنے جو ان دیواروں پر ٹوٹیں
  sources:
  - place/istanbul
reflection:
  ar: أيّ الخطة كنت سترسم لو كنت المهندس؟ اكتب سببك.
  en: Which plan would you have drawn as the engineer? Write your reason.
  ur: اگر آپ انجینئر ہوتے تو کون سا منصوبہ بناتے؟ وجہ لکھیں۔
