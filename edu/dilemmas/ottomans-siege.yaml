id: ottomans-siege
band: researchers
decision:
  ar: الأسوار أم الحصار لقسطنطينية؟
  en: Storm the walls or besiege Constantinople?
  ur: دیواریں توڑیں یا قسطنطنیہ کا محاصرہ؟
  fr: Prendre d’assaut les remparts ou assiéger Constantinople ?
  tr: Duvarlar mı yoksa Konstantinopolis Kuşatması mı?
  id: Tembok atau Pengepungan Konstantinopel?
context:
  ar: 'عام ١٤٥٣ وقف محمد الثاني أمام أحصن أسوار العصر. خياران: حصار طويل يتعب الغذاء والمال ويخاطر بنجدة الغرب، أم هجوم شامل بالمدافع الجديدة على أسوار لم تُخترق ألف عام؟ القرار: الزمن أم الدم؟'
  en: 'In 1453 Mehmed II stood before the age''s strongest walls. Two options: a long siege draining food and money and risking Western relief, or a full assault with the new cannon on walls unbreached
    for a thousand years? The decision: time or blood?'
  ur: '1453 میں محمد دوم دور کی مضبوط ترین دیواروں کے سامنے کھڑا تھا۔ دو راستے: لمبا محاصرہ جو خوراک اور خزانہ نچوڑے اور مغربی امداد کا خطرہ رکھے یا نئی توپوں سے ہزار سال ناٹوڑ دیواروں پر مکمل حملہ؟ فیصلہ:
    وقت یا خون؟'
  fr: 'En 1453, Mehmed II se trouve devant les remparts les plus solides de son époque. Deux choix : un long siège, qui épuise vivres et argent et risque de laisser arriver des renforts occidentaux, ou
    un assaut avec les nouveaux canons contre des murs qui n’ont pas cédé depuis mille ans. Que risque-t-on le plus de perdre : du temps ou des vies ?'
  tr: '1453''te Muhammed II, dönemin surlarının kalesinin önünde duruyordu. İki seçenek: yiyecek ve parayı tüketen uzun bir kuşatma ve Batı''nın yardımını riske atacak bir kuşatma mı, yoksa bin yıldır aşılmamış
    duvarlara yeni toplarla tam ölçekli bir saldırı mı? Karar: Zaman mı kan mı?'
  id: 'Pada tahun 1453, Muhammad II berdiri di hadapan benteng tembok era itu. Dua pilihan: pengepungan panjang yang menghabiskan makanan dan uang serta berisiko mendapat bantuan Barat, atau serangan besar-besaran
    dengan meriam baru ke tembok yang belum ditembus selama seribu tahun? Keputusan: Waktu atau darah?'
