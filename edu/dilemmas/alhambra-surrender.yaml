id: alhambra-surrender
band: scholars
decision:
  ar: الدفاع أم التفاوض؟
  en: Defend or negotiate?
  ur: دفاع کریں یا مذاکرات؟
context:
  ar: 'عندما اشتد الحصار على غرناطة وعمّتها الحمراء، وقف أهلها بين خيارين: قتال قد يدمّر القصور والبيوت والسكان، أم تسليم بشروط تحفظ الأنفس والأموال والدين؟ القرار:
    دفاع عن الكرامة مهما كلف، أم تفاوض ينقذ ما يمكن إنقاذه؟'
  en: 'When the siege tightened on Granada and its red palace, its people stood between two choices: a fight that could destroy palaces, houses and residents, or
    a surrender on terms saving souls, property and faith? The decision: defence of honour whatever it costs, or negotiation to rescue what can be rescued?'
  ur: 'جب غرناطہ اور اس کے سرخ محل پر محاصرہ سخت ہوا تو اس کے لوگ دو راستوں میں تھے: ایسی لڑائی جو محلات، گھر اور باشندے تباہ کر سکتی تھی یا شرائط پر حوالگی جو جانیں،
    مال اور دین بچائے؟ فیصلہ: عزت کی دفاع چاہے کچھ ہو یا جو بچ سکتا ہے بچانے کے لیے مذاکرات؟'
positions:
- holder:
    ar: المدافعون
    en: the defenders
    ur: مدافعین
  stance:
    ar: المدينة التي قاومت كل قرن تستحق أن تقاتل
    en: the city that resisted every century deserves to fight
    ur: جو شہر ہر صدی میں لڑا وہ لڑنے کا حقدار ہے
  evidence:
    ar: صمدوا في الأسوار والقصور حتى لم يبق مخرج
    en: they held on walls and palaces until no way out remained
    ur: وہ دیواروں اور محلات میں ڈٹے رہے یہاں تک کہ نکلنے کی کوئی راہ نہ رہی
  sources:
  - building/alhambra
  - exhibit/pathway-g11-chw3m-al-andalus
- holder:
    ar: المفاوضون
    en: the negotiators
    ur: مذاکرات کار
  stance:
    ar: التسليم بالشروط يحفظ الأسر والأموال والعبادة
    en: surrender on terms saves families, property and worship
    ur: شرائط پر حوالگی خاندان، مال اور عبادت بچاتی ہے
  evidence:
    ar: خرجت المدينة بشروط مكتوبة تحفظ الحياة
    en: the city came out under written terms that saved life
    ur: شہر لکھی ہوئی شرائط پر نکلا جس نے جانیں بچائیں
  sources:
  - building/alhambra
reflection:
  ar: أيّهما أصعب عليك لو كنت من سكانها يومها؟ اكتب سببك.
  en: Which would have been harder for you had you lived there then? Write your reason.
  ur: اگر آپ اس وقت وہاں کے باشندے ہوتے تو کون سا مشکل ہوتا؟ وجہ لکھیں۔
