  - place/jerusalem
- holder:
    ar: أهل الخشوع
    en: the humble party
    ur: عاجزی کے حامی
    fr: Les partisans de la simplicité
    tr: Alçakgönüllü insanlar
    id: Orang-orang yang rendah hati
  stance:
    ar: البيت يُعبد فيه لا يُتفرّج عليه؛ البساطة أولى
    en: the house is worshipped in, not gazed at; plainness first
    ur: گھر عبادت کی جگہ ہے، دیکھنے کی نہیں؛ سادگی پہلے
    fr: C’est un lieu de prière, pas un spectacle. La simplicité passe avant tout.
    tr: Ev içinde tapılır, gözetlenmez; sadelik tercih edilir
    id: Rumah disembah di dalamnya, bukan diawasi; kesederhanaan lebih disukai
  evidence:
    ar: فضّلوا الزخرفة الداخلية وخطوط الكعبة على البريق
    en: they preferred inner ornament and the Kaaba's lines over glitter
    ur: انھوں نے چمک پر اندرونی سجاوٹ اور کعبہ کی لکیروں کو ترجیح دی
    fr: Ils préféraient un décor intérieur et la simplicité des lignes de la Kaaba à l’éclat.
    tr: Parıltıdan çok Kabe'nin iç dekorasyonunu ve çizgilerini tercih ettiler
    id: Mereka lebih memilih dekorasi interior dan garis-garis Ka'bah daripada glitter
  sources:
  - building/dome-of-the-rock
reflection:
  ar: أيّ الزخرفة كنت ستختار لو كنت المهندس؟ اكتب سببك.
  en: Which decoration would you have chosen as the builder? Write your reason.
  ur: اگر آپ معمار ہوتے تو کون سی سجاوٹ چنتے؟ وجہ لکھیں۔
  fr: À la place des bâtisseurs, quel décor aurais-tu choisi ? Explique pourquoi.
  tr: Mühendis olsaydın hangi dekorasyonu seçerdin? Sebebini yaz.
  id: Dekorasi mana yang akan Anda pilih jika Anda seorang insinyur? Tuliskan alasan Anda.
