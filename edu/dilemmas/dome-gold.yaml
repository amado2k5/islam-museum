id: dome-gold
band: researchers
decision:
  ar: الذهب أم الحجر البسيط للقبة؟
  en: Gold or plain stone for the Dome?
  ur: گنبد کے لیے سونا یا سادہ پتھر؟
context:
  ar: 'عندما بُنيت قبة الصخرة كان أمام البنّائين اختيار في الزخرفة: فسيفساء وذهب يلمعان فوق المدينة يعلنان المكان ويشرفانه قرونًا، أم حجر بسيط متواضع يكرّس المكان
    للعبادة لا للمظهر؟ القرار: البهاء أم الخشوع؟'
  en: 'When the Dome of the Rock was built its makers faced a decoration choice: mosaic and gold gleaming over the city, proclaiming and honouring the place for centuries,
    or plain humble stone consecrating it to worship not appearance? The decision: splendour or humility?'
  ur: 'جب گنبدِ صخرہ بنا تو اس کے بنانے والوں کے سامنے سجاوٹ کا انتخاب تھا: موزائیک اور سونا جو شہر پر چمکتا اور صدیوں جگہ کا اعلان اور احترام کرتا یا سادہ متواضع
    پتھر جو اسے شکل نہیں عبادت کے لیے وقف کرے؟ فیصلہ: شان یا عاجزی؟'
positions:
- holder:
    ar: أهل البهاء
    en: the splendour party
    ur: شان کے حامی
  stance:
    ar: الجمال يعلن المكان ويكرّمه في عيون العالم
    en: beauty proclaims the place and honours it in the world's eyes
    ur: خوبصورتی جگہ کا اعلان اور دنیا کی نظروں میں احترام کرتی ہے
  evidence:
    ar: غطّوا القبة بالذهب والفسيفساء فصارت أيقونة المدينة
    en: they clad the dome in gold and mosaic until it became the city's icon
    ur: انھوں نے گنبد کو سونے اور موزائیک سے ڈھانپا تو وہ شہر کی نشانی بنی
  sources:
  - building/dome-of-the-rock
  - place/jerusalem
- holder:
    ar: أهل الخشوع
    en: the humble party
    ur: عاجزی کے حامی
  stance:
    ar: البيت يُعبد فيه لا يُتفرّج عليه؛ البساطة أولى
    en: the house is worshipped in, not gazed at; plainness first
    ur: گھر عبادت کی جگہ ہے، دیکھنے کی نہیں؛ سادگی پہلے
  evidence:
    ar: فضّلوا الزخرفة الداخلية وخطوط الكعبة على البريق
    en: they preferred inner ornament and the Kaaba's lines over glitter
    ur: انھوں نے چمک پر اندرونی سجاوٹ اور کعبہ کی لکیروں کو ترجیح دی
  sources:
  - building/dome-of-the-rock
reflection:
  ar: أيّ الزخرفة كنت ستختار لو كنت المهندس؟ اكتب سببك.
  en: Which decoration would you have chosen as the builder? Write your reason.
  ur: اگر آپ معمار ہوتے تو کون سی سجاوٹ چنتے؟ وجہ لکھیں۔
