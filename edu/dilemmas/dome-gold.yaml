id: dome-gold
band: researchers
decision:
  ar: الذهب أم الحجر البسيط للقبة؟
  en: Gold or plain stone for the Dome?
  ur: گنبد کے لیے سونا یا سادہ پتھر؟
  fr: De l’or ou de la pierre nue pour le Dôme ?
  tr: Altın mı yoksa kubbenin basit taşı mı?
  id: Emas atau batu sederhana dari kubah?
context:
  ar: 'عندما بُنيت قبة الصخرة كان أمام البنّائين اختيار في الزخرفة: فسيفساء وذهب يلمعان فوق المدينة يعلنان المكان ويشرفانه قرونًا، أم حجر بسيط متواضع يكرّس المكان للعبادة لا للمظهر؟ القرار: البهاء أم الخشوع؟'
  en: 'When the Dome of the Rock was built its makers faced a decoration choice: mosaic and gold gleaming over the city, proclaiming and honouring the place for centuries, or plain humble stone consecrating
    it to worship not appearance? The decision: splendour or humility?'
  ur: 'جب گنبدِ صخرہ بنا تو اس کے بنانے والوں کے سامنے سجاوٹ کا انتخاب تھا: موزائیک اور سونا جو شہر پر چمکتا اور صدیوں جگہ کا اعلان اور احترام کرتا یا سادہ متواضع پتھر جو اسے شکل نہیں عبادت کے لیے وقف کرے؟
    فیصلہ: شان یا عاجزی؟'
  fr: En construisant le Dôme du Rocher, ses bâtisseurs doivent choisir un décor. De l’or et des mosaïques brilleraient au-dessus de la ville et honoreraient le lieu pendant des siècles. De la pierre nue
    donnerait au contraire la priorité au culte plutôt qu’aux apparences. Faut-il choisir la splendeur ou la simplicité ?
  tr: 'Kaya Kubbesi inşa edildiğinde, inşaatçılar dekorasyon seçimi yapmak zorunda kaldılar: şehrin üzerinde yüzyıllardır yeri ilan eden ve onurlandıran bir mozaik ve altın parıltı, yoksa görünüşten çok
    ibadete adanmış basit, mütevazı bir taş mı? Karar: Görkem mi yoksa alçakgönüllülük mü?'
  id: 'Ketika Kubah Batu dibangun, para pembangun harus memilih dekorasi: mozaik dan emas yang berkilau di atas kota yang menandakan tempat itu dan menghormatinya selama berabad-abad, atau batu sederhana
    yang sederhana yang mendedikasikan tempat itu untuk ibadah, bukan penampilan? Keputusan: Kemegahan atau kerendahan hati?'
positions:
- holder:
    ar: أهل البهاء
    en: the splendour party
    ur: شان کے حامی
    fr: Les partisans de la splendeur
    tr: Baha'a halkı
    id: Orang-orang Baha'a
  stance:
    ar: الجمال يعلن المكان ويكرّمه في عيون العالم
    en: beauty proclaims the place and honours it in the world's eyes
    ur: خوبصورتی جگہ کا اعلان اور دنیا کی نظروں میں احترام کرتی ہے
    fr: La beauté fait connaître le lieu et l’honore aux yeux du monde.
    tr: Güzellik, yeri ilan eder ve dünyanın gözünde onurlandırır
    id: Keindahan mengumumkan tempat itu dan menghormatinya di mata dunia
  evidence:
    ar: غطّوا القبة بالذهب والفسيفساء فصارت أيقونة المدينة
    en: they clad the dome in gold and mosaic until it became the city's icon
    ur: انھوں نے گنبد کو سونے اور موزائیک سے ڈھانپا تو وہ شہر کی نشانی بنی
    fr: Ils ont paré le dôme d’or et de mosaïques, jusqu’à en faire le symbole de la ville.
    tr: Kubbe altın ve mozaiklerle kaplandı ve burası şehrin simgesi haline geldi.
    id: Mereka menutupi kubah dengan emas dan mozaik, dan menjadi ikon kota.
  sources:
