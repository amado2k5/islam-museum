id: damascus-rebuild
band: researchers
decision:
  ar: الأسوار أم الماء لدمشق؟
  en: Walls or water for Damascus?
  ur: دمشق کے لیے دیواریں یا پانی؟
context:
  ar: 'دمشق بعد سنوات الحصار والغلاء تستطيع مشروعًا واحدًا كبيرًا: ترميم أسوارها وبواباتها أمام جيوش العصر، أم مدّ القنوات وإصلاح الأنهار والحمّامات التي تسقي المدينة
    كل يوم؟ القرار: الحماية أم الحياة؟'
  en: 'Damascus after years of siege and dearth can afford one great project: restoring its walls and gates against the age''s armies, or laying the channels and
    repairing the rivers and bathhouses that water the city every day? The decision: protection or life?'
  ur: 'دمشق برسوں کے محاصرے اور قحط کے بعد ایک بڑا منصوبہ برداشت کر سکتی ہے: دور کی فوجوں کے سامنے دیواریں اور دروازے مرمت کرنا یا نہریں بچھانا اور نہریں اور حمام
    درست کرنا جو شہر کو روز پانی دیتے ہیں؟ فیصلہ: حفاظت یا زندگی؟'
positions:
- holder:
    ar: أهل الأسوار
    en: the walls party
    ur: دیواروں کے حامی
  stance:
    ar: المدينة المفتوحة تُؤخذ قبل أن تشرب
    en: the open city is taken before it can drink
    ur: کھلا شہر پانی پینے سے پہلے لیا جاتا ہے
  evidence:
    ar: جدّدوا الأسوار والأبراج في كل عهد خوف
    en: they renewed walls and towers in every fearful reign
    ur: انھوں نے ہر خوف کے دور میں دیواریں اور برج نئے کیے
  sources:
  - place/damascus
  - building/umayyad-mosque
- holder:
    ar: أهل الماء
    en: the water party
    ur: پانی کے حامی
  stance:
    ar: بلا ماء لا سور ولا سكان؛ القنوات تسقي الكل
    en: without water there is no wall and no people; the channels water all
    ur: پانی کے بغیر نہ دیوار نہ باشندے؛ نہریں سب کو سیراب کرتی ہیں
  evidence:
    ar: أصلحوا المجاري والحمّامات فعادت الحياة للأحياء
    en: they repaired the channels and bathhouses and life returned to the quarters
    ur: انھوں نے نہریں اور حمام درست کیں تو محلوں میں زندگی لوٹی
  sources:
  - place/damascus
reflection:
  ar: أيّهما كنت ستبني أولًا لو كنت الوالي؟ اكتب سببك.
  en: Which would you have built first as governor? Write your reason.
  ur: اگر آپ گورنر ہوتے تو پہلے کیا بناتے؟ وجہ لکھیں۔
