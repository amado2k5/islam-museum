id: damascus-rebuild
band: researchers
decision:
  ar: الأسوار أم الماء لدمشق؟
  en: Walls or water for Damascus?
  ur: دمشق کے لیے دیواریں یا پانی؟
  fr: Des remparts ou de l’eau pour Damas ?
  tr: Şam için duvarlar mı yoksa su mu?
  id: Tembok atau air untuk Damaskus?
context:
  ar: 'دمشق بعد سنوات الحصار والغلاء تستطيع مشروعًا واحدًا كبيرًا: ترميم أسوارها وبواباتها أمام جيوش العصر، أم مدّ القنوات وإصلاح الأنهار والحمّامات التي تسقي المدينة كل يوم؟ القرار: الحماية أم الحياة؟'
  en: 'Damascus after years of siege and dearth can afford one great project: restoring its walls and gates against the age''s armies, or laying the channels and repairing the rivers and bathhouses that
    water the city every day? The decision: protection or life?'
  ur: 'دمشق برسوں کے محاصرے اور قحط کے بعد ایک بڑا منصوبہ برداشت کر سکتی ہے: دور کی فوجوں کے سامنے دیواریں اور دروازے مرمت کرنا یا نہریں بچھانا اور نہریں اور حمام درست کرنا جو شہر کو روز پانی دیتے ہیں؟
    فیصلہ: حفاظت یا زندگی؟'
  fr: 'Après des années de siège et de pénurie, Damas ne peut financer qu’un seul grand chantier. Faut-il restaurer les murs et les portes pour résister aux armées, ou aménager les canaux et réparer les
    cours d’eau et les bains qui approvisionnent la ville chaque jour ? Que privilégier : la protection ou les besoins vitaux ?'
  tr: 'Yıllarca süren kuşatma ve yüksek fiyatlardan sonra Şam, büyük bir projeyi gerçekleştirebilir mi: dönemin ordularının önünde surlarını ve kapılarını restore etmek mi, yoksa kanalları uzatmak ve şehri
    her gün sulayan nehir ve hamamları onarmak? Karar: Koruma mı Yaşam mı?'
  id: 'Damaskus, setelah bertahun-tahun pengepungan dan harga tinggi, dapat menyelesaikan satu proyek besar: memulihkan tembok dan gerbangnya di depan tentara pada masa itu, atau memperpanjang kanal dan
    memperbaiki sungai serta pemandian yang mengairi kota setiap hari? Keputusan: perlindungan atau kehidupan?'
