  en: Which would you have built first as governor? Write your reason.
  ur: اگر آپ گورنر ہوتے تو پہلے کیا بناتے؟ وجہ لکھیں۔
  fr: À la place du gouverneur, quel chantier aurais-tu lancé en premier ? Explique pourquoi.
  tr: Vali olsan önce hangisini inşa ederdin? Sebebini yaz.
  id: Mana yang akan kamu bangun pertama jika kamu gubernur? Tuliskan alasanmu.
