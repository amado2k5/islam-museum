id: daily-neighbour
band: scholars
decision:
  ar: المساعدة أم الدراسة؟
  en: Helping or studying?
  ur: مدد یا مطالعہ؟
  fr: Aider ou réviser ?
  tr: Yardım mı yoksa ders çalışmak mı?
  id: Butuh bantuan atau belajar?
context:
  ar: 'جارك المسنّ يحتاج من يشتري له الدواء ويصلح له بابًا، وعندك امتحان غدًا ووراءك مراجعة طويلة. القرار: النزول لمساعدة الجار ولو نقص مراجعتك، أم إكمال الدرس وتكليف غيرك بالعون؟ الحياة اليومية تمتحن ما
    تعلّمته من الأركان.'
  en: 'Your elderly neighbour needs someone to buy his medicine and fix his door, and you have an exam tomorrow and a long revision behind you. The decision: go help the neighbour even if revision shrinks,
    or finish the study and delegate the helping? Daily life tests what the pillars taught.'
  ur: 'آپ کے بزرگ ہمسایہ کو کوئی چاہیے جو دوا لائے اور دروازہ ٹھیک کرے، اور کل آپ کا امتحان ہے اور طویل دہرائی باقی۔ فیصلہ: ہمسایہ کی مدد کے لیے اترنا چاہے دہرائی کم ہو یا پڑھائی مکمل کر کے مدد کسی اور
    کو سونپنا؟ روزمرہ زندگی ارکان کی سیکھا ہوا امتحان لیتی ہے۔'
  fr: Ton voisin âgé a besoin de quelqu’un pour acheter ses médicaments et réparer sa porte. Tu as un examen demain et tu as déjà beaucoup révisé. Vas-tu l’aider, quitte à réduire ton temps de révision,
    ou finir de réviser en demandant à quelqu’un d’autre de s’en charger ? Le quotidien met à l’épreuve les leçons des cinq piliers.
  tr: 'Yaşlı komşunuzun ona ilaç alacak ve kapıyı tamir ettirecek birine ihtiyacı var, yarın bir sınavınız ve uzun bir incelemeniz var. Karar: ziyaretiniz kısa olsa bile komşuya yardım etmek için aşağı
    inmek mi, yoksa derse devam edip başkalarını da yardım etmek mi? Günlük hayat, temel taşlardan öğrendiklerinizi test eder.'
  id: 'Tetangga lansia Anda membutuhkan seseorang untuk membelikannya obat dan memperbaiki pintu, dan Anda besok memiliki ujian serta tinjauan panjang di depan Anda. Keputusannya: turun untuk membantu tetangga
    meskipun kunjungan Anda singkat, atau lanjutkan pelajaran dan menugaskan orang lain untuk membantu? Kehidupan sehari-hari menguji apa yang telah Anda pelajari dari pilar-pilar itu.'
