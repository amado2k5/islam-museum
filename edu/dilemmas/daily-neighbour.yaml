id: daily-neighbour
band: scholars
decision:
  ar: المساعدة أم الدراسة؟
  en: Helping or studying?
  ur: مدد یا مطالعہ؟
context:
  ar: 'جارك المسنّ يحتاج من يشتري له الدواء ويصلح له بابًا، وعندك امتحان غدًا ووراءك مراجعة طويلة. القرار: النزول لمساعدة الجار ولو نقص مراجعتك، أم إكمال الدرس وتكليف
    غيرك بالعون؟ الحياة اليومية تمتحن ما تعلّمته من الأركان.'
  en: 'Your elderly neighbour needs someone to buy his medicine and fix his door, and you have an exam tomorrow and a long revision behind you. The decision: go help
    the neighbour even if revision shrinks, or finish the study and delegate the helping? Daily life tests what the pillars taught.'
  ur: 'آپ کے بزرگ ہمسایہ کو کوئی چاہیے جو دوا لائے اور دروازہ ٹھیک کرے، اور کل آپ کا امتحان ہے اور طویل دہرائی باقی۔ فیصلہ: ہمسایہ کی مدد کے لیے اترنا چاہے دہرائی
    کم ہو یا پڑھائی مکمل کر کے مدد کسی اور کو سونپنا؟ روزمرہ زندگی ارکان کی سیکھا ہوا امتحان لیتی ہے۔'
positions:
- holder:
    ar: أهل الجوار
    en: the neighbours' party
    ur: ہمسایہ کے حامی
  stance:
    ar: خدمة الجار عبادة يومية لا تُغيبها الورقة
    en: serving the neighbour is daily worship a paper does not erase
    ur: ہمسایہ کی خدمت روزمرہ عبادت ہے جسے کاغذ نہیں مٹاتا
  evidence:
    ar: اختاروا النزول وقاسموا الوقت بين الجار والكتاب
    en: they chose to go down and split the time between neighbour and book
    ur: انھوں نے اترنے کا انتخاب کیا اور ہمسایہ اور کتاب کے بیچ وقت بانٹا
  sources:
  - exhibit/pathway-g11-hrf3o-five-pillars-daily-life
- holder:
    ar: أهل الترتيب
    en: the orderers
    ur: ترتیب کے حامی
  stance:
    ar: الواجب المؤكد أولًا؛ الجار يُعان عن طريق غيرك
    en: the certain duty first; the neighbour is helped through another
    ur: پہلے یقینی فرض؛ ہمسایہ کی مدد کسی اور کے ذریعے ہو سکتی ہے
  evidence:
    ar: أرسلوا من يساعد بينما يكملون مراجعتهم
    en: they sent a helper while finishing their revision
    ur: انھوں نے مددگار بھیجا اور اپنی دہرائی مکمل کی
  sources:
  - exhibit/pathway-g11-hrf3o-five-pillars-daily-life
reflection:
  ar: كيف كنت ستقسّم وقتك بين الجار والكتاب؟ اكتب سببك.
  en: How would you split your time between neighbour and book? Write your reason.
  ur: آپ ہمسایہ اور کتاب میں اپنا وقت کیسے بانٹتے؟ وجہ لکھیں۔
