id: hajj-route
band: scholars
decision:
  ar: الطريق الطويل الآمن أم القصير الخطير؟
  en: The long safe road or the short risky one?
  ur: لمبا محفوظ راستہ یا چھوٹا خطرناک؟
context:
  ar: 'قافلة الحج أمامها طريقان: درب طويل محفوظ تمرّ بآبار وأسواق، أم درب قصير عبر صحراء خالية يختصر أيامًا ويخاطر بالعطش والضياع؟ القرار: الوصول البطيء المأمون،
    أم السرعة على المخاطرة؟'
  en: 'The pilgrimage caravan has two roads: a long safe track past wells and markets, or a short track over empty desert saving days at the risk of thirst and loss?
    The decision: the slow sure arrival, or speed on the hazard?'
  ur: 'حج کے قافلے کے سامنے دو راستے ہیں: کنوؤں اور بازاروں سے گزرنے والا لمبا محفوظ راستہ یا خالی صحرا سے گزرنے والا چھوٹا راستہ جو دن بچاتا مگر پیاس اور بھٹکنے
    کا خطرہ رکھتا ہے؟ فیصلہ: دیر مگر یقینی پہنچنا یا خطرے پر تیز رفتاری؟'
positions:
- holder:
    ar: أهل الأمان
    en: the safety party
    ur: احتیاط کے حامی
  stance:
    ar: النفوس التي تحملها القافلة أمانة لا تُغامَر
    en: the souls the caravan carries are a trust not gambled
    ur: قافلے کی جانیں امانت ہیں جو داؤ پر نہیں لگائیں جاتیں
  evidence:
    ar: اختاروا الدروب ذات الآبار حتى وصلوا متأخرين سالمين
    en: they chose the well-roads, arriving late but whole
    ur: انھوں نے کنوؤں والے راستے چنے، دیر مگر سلامت پہنچے
  sources:
  - exhibit/pathway-g6-social-studies-hajj-network
  - person/mansa-musa
- holder:
    ar: أهل السرعة
    en: the speed party
    ur: تیزی کے حامی
  stance:
    ar: الموسم لا ينتظر؛ من فاته الوقت فاته الحج
    en: the season waits for none; who misses the time misses the Hajj
    ur: موسم کسی کا انتظار نہیں کرتا؛ جو وقت کھویا وہ حج کھو بیٹھا
  evidence:
    ar: سلكوا الطرق القصارى ليدركوا الوقوف في عرفة
    en: they took the shortest tracks to catch the standing at Arafah
    ur: انھوں نے چھوٹے راستے لیے تاکہ عرفات کے وقوف تک پہنچیں
  sources:
  - exhibit/pathway-g6-social-studies-hajj-network
reflection:
  ar: أيّ الدربين كنت ستدلّ عليه قافلتك؟ اكتب سببك.
  en: Which road would you have pointed your caravan to? Write your reason.
  ur: آپ اپنے قافلے کو کون سا راستہ دکھاتے؟ وجہ لکھیں۔
