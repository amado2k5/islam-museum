id: crusades-name
band: researchers
decision:
  ar: غزو أم حرب مضادة؟
  en: Invasion or counter-war?
  ur: حملہ یا جوابی جنگ؟
  fr: Une invasion ou une guerre de reconquête ?
  tr: İşgal mi yoksa karşı savaş mı?
  id: Invasi atau perang balasan?
context:
  ar: 'في نهاية القرن الحادي عشر وصلت جيوش الفرنج إلى بلاد الشام تحت راية استرداد الأماكن المقدسة، فرآها أهل الشام عدوانًا غاشمًا على ديارهم. القرار في التسمية والوصف: غزو محض، أم حرب دينية متبادلة فهمها
    كل طرف من جهته؟'
  en: 'At the end of the eleventh century Frankish armies reached the Levant under the banner of recovering the holy places, while its people saw a brutal assault on their homes. The decision in naming
    and framing: a pure invasion, or a religious war each side read from its own seat?'
  ur: 'گیارہویں صدی کے آخر میں فرنگی فوجیں مقدس مقامات واپس لینے کے بینر تلے شام پہنچیں، جبکہ اس کے لوگوں نے اسے اپنے گھروں پر سنگین حملہ سمجھا۔ نام اور وضاحت کا فیصلہ: محض حملہ یا مذہبی جنگ جسے ہر فریق
    اپنی جگہ سے سمجھا؟'
  fr: 'À la fin du XIe siècle, des armées franques arrivent au Levant en annonçant qu’elles reprennent les lieux saints. Les habitants, eux, voient une attaque brutale contre leurs foyers. Comment nommer
    et présenter ces événements : une invasion pure et simple, ou une guerre religieuse que chaque camp interprète à sa façon ?'
  tr: 'On birinci yüzyılın sonunda, Frank orduları kutsal mekanları geri alma bayrağı altında Levant''a geldi ve Levant halkı bunu topraklarına karşı acımasız bir saldırı olarak gördü. Isim verme ve tanımlama
    kararı: saf bir işgal mi yoksa karşılıklı dini savaş mı, her iki tarafın kendi bakış açısından anlaşıldığı mı?'
  id: 'Pada akhir abad kesebelas, tentara Franka tiba di Levant dengan panji merebut kembali tempat-tempat suci, dan rakyat Levant melihatnya sebagai agresi brutal terhadap tanah mereka. Keputusan tentang
    penamaan dan deskripsi: invasi murni atau perang agama bersama yang dipahami oleh masing-masing pihak dari perspektif masing-masing?'
