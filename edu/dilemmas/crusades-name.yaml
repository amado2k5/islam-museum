id: crusades-name
band: researchers
decision:
  ar: غزو أم حرب مضادة؟
  en: Invasion or counter-war?
  ur: حملہ یا جوابی جنگ؟
context:
  ar: 'في نهاية القرن الحادي عشر وصلت جيوش الفرنج إلى بلاد الشام تحت راية استرداد الأماكن المقدسة، فرآها أهل الشام عدوانًا غاشمًا على ديارهم. القرار في التسمية والوصف:
    غزو محض، أم حرب دينية متبادلة فهمها كل طرف من جهته؟'
  en: 'At the end of the eleventh century Frankish armies reached the Levant under the banner of recovering the holy places, while its people saw a brutal assault
    on their homes. The decision in naming and framing: a pure invasion, or a religious war each side read from its own seat?'
  ur: 'گیارہویں صدی کے آخر میں فرنگی فوجیں مقدس مقامات واپس لینے کے بینر تلے شام پہنچیں، جبکہ اس کے لوگوں نے اسے اپنے گھروں پر سنگین حملہ سمجھا۔ نام اور وضاحت کا
    فیصلہ: محض حملہ یا مذہبی جنگ جسے ہر فریق اپنی جگہ سے سمجھا؟'
positions:
- holder:
    ar: ابن الأثير والمؤرخون الشاميون
    en: Ibn al-Athir and the Levantine chroniclers
    ur: ابن اثیر اور شامی مورخین
  stance:
    ar: غزو جاء بغير دعوة فحصد الديار والناس
    en: an invasion that came unbidden and reaped homes and people
    ur: بلا بلائے آیا حملہ جس نے گھر اور لوگ کاٹ لیے
  evidence:
    ar: كتب عن سقوط إدessa وأنطاكية والقدس كفجائع متتابعة
    en: he wrote of Edessa, Antioch and Jerusalem falling as successive calamities
    ur: اس نے ایڈیسا، انطاکیہ اور یروشلم کے گرنے کو مسلسل آفتیں لکھا
  sources:
  - exhibit/pathway-g11-chw3m-crusades-muslim-side
  - place/jerusalem
- holder:
    ar: المؤرخون الفرنج
    en: the Frankish chroniclers
    ur: فرنگی مورخ
  stance:
    ar: رحلة مقدسة لردّ بيت المقدس إلى المؤمنين
    en: a holy journey to return the Sepulchre to the faithful
    ur: مقدس سفر جو قبرِ مقدس مومنوں کو واپس دے
  evidence:
    ar: وصفوا المسير استجابة لنداء البابا ونجدة للشرق
    en: they described the march as answering the Pope's call and aiding the East
    ur: انھوں نے سفر کو پوپ کے پکار اور مشرق کی مدد کا جواب لکھا
  sources:
  - exhibit/pathway-g11-chw3m-crusades-muslim-side
reflection:
  ar: بأيّ تسمية كنت ستكتب هذا الحدث لو كنت مؤرخًا محايدًا؟ اكتب سببك.
  en: Under which name would you have written this event as a neutral historian? Write your reason.
  ur: اگر آپ غیر جانبدار مورخ ہوتے تو اس واقعے کو کس نام سے لکھتے؟ وجہ لکھیں۔
