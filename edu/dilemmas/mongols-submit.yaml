  en: Which counsel would you have given in the city's council? Write your reason.
  ur: اگر آپ شہر کی مجلس میں ہوتے تو کیا مشورہ دیتے؟ وجہ لکھیں۔
  fr: Quel conseil aurais-tu donné au conseil de la ville ? Explique pourquoi.
  tr: Belediye Meclisi'nde ne tavsiye edersiniz? Gerekçenizi yazın.
  id: Nasihat apa yang akan Anda berikan di Dewan Kota? Tuliskan alasan Anda.
