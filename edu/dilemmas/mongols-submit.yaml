id: mongols-submit
band: researchers
decision:
  ar: الاستسلام أم المقاومة لبغداد؟
  en: Submit or resist for Baghdad?
  ur: بغداد کے لیے حوالگی یا مزاحمت؟
context:
  ar: 'عام ١٢٥٨ بلغ هولاكو أسوار بغداد بجيش لم يُهزم، وعرض الأمان على المدينة إن استسلمت. القرار على الخليفة وقادته: الاستسلام فينجو الناس وربما العرش، أم المقاومة
    التي يعرف الجميع ثمنها وربما شرفها؟'
  en: 'In 1258 Hulagu reached Baghdad''s walls with an unbeaten army and offered the city safety if it surrendered. The decision for the Caliph and his leaders: submission
    to save the people and perhaps the throne, or resistance whose price everyone knew — and perhaps whose honour?'
  ur: '1258 میں ہلاکو ناقابلِ شکست فوج کے ساتھ بغداد کی دیواروں تک آیا اور شہر کو حوالگی پر امان کی پیشکش کی۔ خلیفہ اور اس کے قائدین کا فیصلہ: لوگوں اور شاید تخت
    بچانے کے لیے حوالگی یا مزاحمت جس کی قیمت سب جانتے تھے — اور شاید جس کی عزت بھی؟'
positions:
- holder:
    ar: دعاة الاستسلام
    en: the submission party
    ur: حوالگی کے حامی
  stance:
    ar: المدينة العظيمة تستحق أن يُنقذ أهلها قبل أسوارها
    en: the great city deserves its people saved before its walls
    ur: عظیم شہر کے لوگ دیواروں سے پہلے بچنے کے حقدار ہیں
  evidence:
    ar: رأوا عجز الدفاع عن خندق وحيد عمره أجيال
    en: they saw the defence could not hold a moat generations old
    ur: انھوں نے دیکھا کہ دفاع نسلوں پرانی خندق بھی نہیں بچا سکتا
  sources:
  - exhibit/pathway-g11-chw3m-mongols-and-after
  - place/baghdad
- holder:
    ar: دعاة المقاومة
    en: the resistance party
    ur: مزاحمت کے حامی
  stance:
    ar: استسلام بلا قتال يسلّم الأمانة بغير ثمن
    en: submission without battle hands the trust away for nothing
    ur: بے لڑائی حوالگی امانت مفت میں سونپ دیتی ہے
  evidence:
    ar: تذكّروا أن كل مدينة استسلمت قبلها خسرت
    en: they remembered that every city that submitted before had lost
    ur: انھیں یاد تھا کہ پہلے حوالگی کرنے والا ہر شہر ہارا
  sources:
  - exhibit/pathway-g11-chw3m-mongols-and-after
reflection:
  ar: أيّ نصيحة كنت ستقدّم في مجلس المدينة؟ اكتب سببك.
  en: Which counsel would you have given in the city's council? Write your reason.
  ur: اگر آپ شہر کی مجلس میں ہوتے تو کیا مشورہ دیتے؟ وجہ لکھیں۔
