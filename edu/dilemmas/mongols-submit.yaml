id: mongols-submit
band: researchers
decision:
  ar: الاستسلام أم المقاومة لبغداد؟
  en: Submit or resist for Baghdad?
  ur: بغداد کے لیے حوالگی یا مزاحمت؟
  fr: Bagdad doit-elle se rendre ou résister ?
  tr: Bağdat'a teslim olmak mı yoksa direniş mi?
  id: Menyerah atau melawan Baghdad?
context:
  ar: 'عام ١٢٥٨ بلغ هولاكو أسوار بغداد بجيش لم يُهزم، وعرض الأمان على المدينة إن استسلمت. القرار على الخليفة وقادته: الاستسلام فينجو الناس وربما العرش، أم المقاومة التي يعرف الجميع ثمنها وربما شرفها؟'
  en: 'In 1258 Hulagu reached Baghdad''s walls with an unbeaten army and offered the city safety if it surrendered. The decision for the Caliph and his leaders: submission to save the people and perhaps
    the throne, or resistance whose price everyone knew — and perhaps whose honour?'
  ur: '1258 میں ہلاکو ناقابلِ شکست فوج کے ساتھ بغداد کی دیواروں تک آیا اور شہر کو حوالگی پر امان کی پیشکش کی۔ خلیفہ اور اس کے قائدین کا فیصلہ: لوگوں اور شاید تخت بچانے کے لیے حوالگی یا مزاحمت جس کی قیمت
    سب جانتے تھے — اور شاید جس کی عزت بھی؟'
  fr: 'En 1258, Houlagou arrive devant les remparts de Bagdad à la tête d’une armée invaincue. Il promet d’épargner la ville si elle se rend. Le calife et ses conseillers doivent choisir : se soumettre
    pour sauver les habitants et peut-être le trône, ou résister pour l’honneur, au prix de pertes prévisibles.'
  tr: '1258''de Hulagu, yenilgisiz bir orduyla Bağdat surlarına ulaştı ve teslim olması halinde şehre güvenlik sundu. Karar halifeye ve liderlerine aittir: Teslim olmak ki halk ve belki taht hayatta kalsın,
    yoksa herkesin bedelini bildiği ve belki de onurunun bilindiği direniş mi?'
  id: 'Pada tahun 1258, Hulagu mencapai tembok Baghdad dengan pasukan yang tak terkalahkan dan menawarkan keselamatan kota jika menyerah. Keputusan ada di tangan khalifah dan para pemimpinnya: menyerah
    agar rakyat dan mungkin tahta tetap bertahan, atau perlawanan, yang harganya diketahui semua orang dan mungkin kehormatan siapa yang diketahui?'
