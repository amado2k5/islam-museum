    ar: هاجروا فرادى وجماعات حتى خلا البيت، تاركين الديار والأموال
    en: they migrated singly and in groups until the house emptied, leaving homes and wealth
    ur: وہ یکے بعد دیگرے ہجرت کرتے گئے یہاں تک کہ گھر خالی ہو گیا، گھر اور مال چھوڑ کر
    fr: Ils sont partis seuls ou en groupes jusqu’à ce qu’il ne reste plus personne, abandonnant leurs maisons et leurs biens.
    tr: Ev boşalana kadar tek tek ve grup halinde göç ettiler, evlerini ve paralarını bıraktılar
    id: Mereka bermigrasi secara individu maupun dalam kelompok sampai rumah kosong, meninggalkan rumah dan uang mereka
