id: hijra-leave
band: scholars
decision:
  ar: هل يغادر المسلمون مكة؟
  en: Should the Muslims leave Mecca?
  ur: کیا مسلمان مکہ چھوڑیں؟
  fr: Les musulmans doivent-ils quitter La Mecque ?
  tr: Müslümanlar Mekke'den ayrılır mı?
  id: Apakah Muslim meninggalkan Mekah?
context:
  ar: 'في مكة اشتدّ الأذى على المسلمين الأوائل حتى صارت حياتهم في خطر، وأُرسل استطلاع إلى يثرب فأقبل أهلها. والقرار أمام المسلمين: البقاء في وطنهم وأرض آبائهم رغم الأذى، أم الهجرة إلى مدينة بعيدة لا يملكون
    فيها شيئًا.'
  en: 'In Mecca the harm against the first Muslims grew until their lives were at risk, and envoys to Yathrib found it welcoming. The decision before the Muslims: stay in their homeland and fathers'' land
    despite the harm, or migrate to a far city where they own nothing.'
  ur: 'مکہ میں پہلے مسلمانوں پر ظلم اس قدر بڑھا کہ جانیں خطرے میں پڑ گئیں، اور یثرب بھیجے ہوئے قاصدوں نے اسے مہمان نواز پایا۔ مسلمانوں کے سامنے فیصلہ تھا: ظلم کے باوجود اپنے وطن اور آبائی زمین میں رہنا،
    یا ایک دور شہر ہجرت کرنا جہاں ان کے پاس کچھ نہیں۔'
  fr: À La Mecque, les persécutions contre les premiers musulmans s’aggravent jusqu’à menacer leur vie. Des émissaires ont trouvé bon accueil à Yathrib. Faut-il rester sur la terre de leurs pères malgré
    les persécutions ou partir vers une ville lointaine où ils ne possèdent rien ?
  tr: 'Mekke''de, erken Müslümanlara verilen zarar o kadar ağır oldu ki hayatları tehlikeye girdi ve halkının geldiği Yatrib''e keşif gönderildi. Müslümanların önündeki karar şuydu: zarara rağmen kendi
    vatanlarında ve atalarının topraklarında kalmak, yoksa hiçbir şeye sahip olmadıkları uzak bir şehre göç etmek.'
  id: 'Di Mekah, kerugian bagi Muslim awal menjadi sangat parah sehingga nyawa mereka terancam, dan sebuah pengintaian dikirim ke Yathrib, tempat penduduknya datang. Keputusan yang ada di hadapan Muslim
    adalah: tetap tinggal di tanah air dan tanah leluhur mereka meskipun mengalami bahaya, atau bermigrasi ke kota jauh di mana mereka tidak memiliki apa-apa.'
