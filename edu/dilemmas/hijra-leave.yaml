  stance:
    ar: النجاة بالدين أولى؛ يثرب تقبلنا وتأوينا
    en: saving the faith comes first; Yathrib welcomes and shelters us
    ur: دین کی حفاظت پہلے؛ یثرب ہمیں قبول اور پناہ دیتی ہے
    fr: Préserver notre foi passe avant tout. Yathrib nous accueille et nous protège.
    tr: Din yoluyla kurtuluş daha önemlidir; Yathrib bizi kabul eder ve barındırır
    id: Keselamatan melalui agama lebih penting; Yathrib menerima dan melindungi kita
