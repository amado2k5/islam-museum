id: hijra-leave
band: scholars
decision:
  ar: هل يغادر المسلمون مكة؟
  en: Should the Muslims leave Mecca?
  ur: کیا مسلمان مکہ چھوڑیں؟
context:
  ar: 'في مكة اشتدّ الأذى على المسلمين الأوائل حتى صارت حياتهم في خطر، وأُرسل استطلاع إلى يثرب فأقبل أهلها. والقرار أمام المسلمين: البقاء في وطنهم وأرض آبائهم رغم
    الأذى، أم الهجرة إلى مدينة بعيدة لا يملكون فيها شيئًا.'
  en: 'In Mecca the harm against the first Muslims grew until their lives were at risk, and envoys to Yathrib found it welcoming. The decision before the Muslims:
    stay in their homeland and fathers'' land despite the harm, or migrate to a far city where they own nothing.'
  ur: 'مکہ میں پہلے مسلمانوں پر ظلم اس قدر بڑھا کہ جانیں خطرے میں پڑ گئیں، اور یثرب بھیجے ہوئے قاصدوں نے اسے مہمان نواز پایا۔ مسلمانوں کے سامنے فیصلہ تھا: ظلم کے
    باوجود اپنے وطن اور آبائی زمین میں رہنا، یا ایک دور شہر ہجرت کرنا جہاں ان کے پاس کچھ نہیں۔'
positions:
- holder:
    ar: الصحابة المهاجرون
    en: the emigrant Companions
    ur: ہجرت کرنے والے صحابہ
  stance:
    ar: النجاة بالدين أولى؛ يثرب تقبلنا وتأوينا
    en: saving the faith comes first; Yathrib welcomes and shelters us
    ur: دین کی حفاظت پہلے؛ یثرب ہمیں قبول اور پناہ دیتی ہے
  evidence:
    ar: هاجروا فرادى وجماعات حتى خلا البيت، تاركين الديار والأموال
    en: they migrated singly and in groups until the house emptied, leaving homes and wealth
    ur: وہ یکے بعد دیگرے ہجرت کرتے گئے یہاں تک کہ گھر خالی ہو گیا، گھر اور مال چھوڑ کر
  sources:
  - event/hijra
  - place/medina
- holder:
    ar: قريش المتخوفة
    en: fearful Quraysh
    ur: ڈری ہوئی قریش
  stance:
    ar: الهجرة تبني دولة منافسة على حدودنا
    en: the migration builds a rival power on our border
    ur: یہ ہجرت ہماری سرحد پر حریف طاقت بناتی ہے
  evidence:
    ar: لاحقوا المهاجرين على الطريق وحاصروا الخبر
    en: they chased the migrants on the road and besieged the news
    ur: انھوں نے راستے میں مہاجرین کا پیچھا کیا اور خبر کو دبایا
  sources:
  - place/mecca
reflection:
  ar: إن كنت مكانهم، أتترك بيتك ومالك لتنجو بدينك؟ اكتب سببك.
  en: If you were them, would you leave your home and wealth to save your faith? Write your reason.
  ur: اگر آپ ان کی جگہ ہوتے تو دین بچانے کے لیے گھر اور مال چھوڑتے؟ اپنی وجہ لکھیں۔
