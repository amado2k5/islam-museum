reflection:
  ar: إن كنت مكانهم، أتترك بيتك ومالك لتنجو بدينك؟ اكتب سببك.
  en: If you were them, would you leave your home and wealth to save your faith? Write your reason.
  ur: اگر آپ ان کی جگہ ہوتے تو دین بچانے کے لیے گھر اور مال چھوڑتے؟ اپنی وجہ لکھیں۔
  fr: À leur place, quitterais-tu ta maison et tes biens pour préserver ta foi ? Explique pourquoi.
  tr: Onların yerinde olsaydınız, dininizi sürdürmek için evinizi ve mülkünüzü terk eder miydiniz? Sebebinizi yazın.
  id: Jika Anda berada di posisi mereka, apakah Anda akan meninggalkan rumah dan properti Anda untuk bertahan dalam agama Anda? Tuliskan alasan Anda.
