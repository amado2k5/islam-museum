id: ibn-sina-scope
band: researchers
decision:
  ar: الطب أولًا أم الفلسفة لابن سينا؟
  en: Medicine or philosophy first for Ibn Sina?
  ur: ابن سینا کے لیے پہلے طب یا فلسفہ؟
context:
  ar: 'شاب عبقري اسمه ابن سينا يحمل موهبتين: طب يعالج الناس اليوم، وفلسفة تفكر في العالم إلى الأبد. القرار: تركيز العمر على القانون في الطب وعلاج المرضى، أم على الشفاء
    وكشف قوانين العقل والوجود؟'
  en: 'A gifted young man named Ibn Sina carried two talents: medicine healing people today, and philosophy thinking the world forever. The decision: focus the life
    on the Canon of medicine and treating patients, or on the Healing and uncovering the laws of mind and being?'
  ur: 'ابن سینا نامہ نوجوان نابغہ دو صلاحیتیں رکھتا تھا: طب جو آج لوگوں کا علاج کرے اور فلسفہ جو ہمیشہ دنیا پر سوچے۔ فیصلہ: عمر کو طب کے قانون اور مریضوں کے علاج
    پر مرکوز کرنا یا شفا اور ذہن و وجود کے قوانین کھولنا؟'
positions:
- holder:
    ar: أهل الطب
    en: the medicine party
    ur: طب کے حامی
  stance:
    ar: البدن أمانة اليوم؛ الطب ينفع كل إنسان
    en: the body is today's trust; medicine serves every human
    ur: جسم آج کی امانت ہے؛ طب ہر انسان کے کام آتا ہے
  evidence:
    ar: كتب القانون فصار مرجع الطب قرونًا في كل العالم
    en: he wrote the Canon, medicine's reference for centuries everywhere
    ur: انھوں نے قانون لکھا جو صدیوں ہر جگہ طب کا مرجع رہا
  sources:
  - person/ibn-sina
- holder:
    ar: أهل الفلسفة
    en: the philosophy party
    ur: فلسفہ کے حامی
  stance:
    ar: العقل الذي يفكر يشفي أكثر من يد واحدة
    en: the mind that thinks heals more than one hand
    ur: جو ذہن سوچتا ہے ایک ہاتھ سے زیادہ شفا دیتا ہے
  evidence:
    ar: كتب الشفاء والإشارات في الفلسفة والمنطق والكلام
    en: he wrote the Healing and the Pointers in philosophy, logic and doctrine
    ur: انھوں نے فلسفہ، منطق اور کلام میں شفا اور اشارات لکھے
  sources:
  - person/ibn-sina
  - place/baghdad
reflection:
  ar: لو كان لديك عقله، على ماذا كنت ستركز؟ اكتب سببك.
  en: If you had his mind, what would you have focused on? Write your reason.
  ur: اگر آپ کے پاس ان کا ذہن ہوتا تو کس پر توجہ دیتے؟ وجہ لکھیں۔
