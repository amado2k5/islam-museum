id: ibn-sina-scope
band: researchers
decision:
  ar: الطب أولًا أم الفلسفة لابن سينا؟
  en: Medicine or philosophy first for Ibn Sina?
  ur: ابن سینا کے لیے پہلے طب یا فلسفہ؟
  fr: Ibn Sina doit-il privilégier la médecine ou la philosophie ?
  tr: Önce Tıp mı yoksa İbn Sina'nın Felsefesi mi?
  id: Kedokteran Pertama atau Filsafat oleh Ibn Sina?
context:
  ar: 'شاب عبقري اسمه ابن سينا يحمل موهبتين: طب يعالج الناس اليوم، وفلسفة تفكر في العالم إلى الأبد. القرار: تركيز العمر على القانون في الطب وعلاج المرضى، أم على الشفاء وكشف قوانين العقل والوجود؟'
  en: 'A gifted young man named Ibn Sina carried two talents: medicine healing people today, and philosophy thinking the world forever. The decision: focus the life on the Canon of medicine and treating
    patients, or on the Healing and uncovering the laws of mind and being?'
  ur: 'ابن سینا نامہ نوجوان نابغہ دو صلاحیتیں رکھتا تھا: طب جو آج لوگوں کا علاج کرے اور فلسفہ جو ہمیشہ دنیا پر سوچے۔ فیصلہ: عمر کو طب کے قانون اور مریضوں کے علاج پر مرکوز کرنا یا شفا اور ذہن و وجود کے قوانین
    کھولنا؟'
  fr: 'Ibn Sina, jeune homme doué, excelle dans deux domaines : la médecine, qui soigne dès aujourd’hui, et la philosophie, qui cherche à comprendre le monde au-delà du présent. Faut-il consacrer sa vie
    au Canon de la médecine et aux malades, ou au Livre de la guérison et à l’étude de l’esprit et de l’être ?'
  tr: 'İbn Sina adında dahi bir genç adam iki yeteneğe sahiptir: günümüzde insanları tedavi eden tıp, ve dünyayı sonsuza dek düşünen bir felsefe. Karar: Omar, tıpta hukuka ve hastaları tedavi etmeye mi
    odaklanmalı, yoksa akıl ve varoluş yasalarını iyileştirmeye ve ortaya çıkarmaya mı?'
  id: 'Seorang pemuda jenius bernama Ibn Sina memiliki dua bakat: kedokteran yang mengobati orang saat ini, dan filosofi yang memikirkan dunia selamanya. Keputusan: Haruskah Omar fokus pada hukum dalam
    kedokteran dan pengobatan orang sakit, atau pada penyembuhan dan pengungkapan hukum akal dan eksistensi?'
