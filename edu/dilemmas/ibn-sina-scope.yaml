reflection:
  ar: لو كان لديك عقله، على ماذا كنت ستركز؟ اكتب سببك.
  en: If you had his mind, what would you have focused on? Write your reason.
  ur: اگر آپ کے پاس ان کا ذہن ہوتا تو کس پر توجہ دیتے؟ وجہ لکھیں۔
  fr: Si tu avais eu ses capacités, à quoi les aurais-tu consacrées ? Explique pourquoi.
  tr: Onun aklında olsaydı, neye odaklanırdın? Sebebini yaz.
  id: Kalau kamu punya pikirannya, apa yang akan kamu fokuskan? Tuliskan alasanmu.
