id: mecca-amnesty
band: scholars
decision:
  ar: عقاب أم عفو في فتح مكة؟
  en: Punishment or pardon at the conquest of Mecca?
  ur: فتح مکہ میں سزا یا معافی؟
context:
  ar: 'دخل المسلمون مكة فاتحين بعد سنوات من الأذى والطرد، وبيدهم القوة أن يقتصّوا ممن آذاهم. القرار: العقاب على سنين الظلم، أم إعلان الأمان العام؟'
  en: 'The Muslims entered Mecca as conquerors after years of harm and expulsion, with the power to take revenge on those who had hurt them. The decision: punishment
    for years of wrong, or a general amnesty?'
  ur: 'مسلمان برسوں کے ظلم اور جلاوطنی کے بعد فاتح بن کر مکہ میں داخل ہوئے اور ان کے پاس آزار دینے والوں سے انتقام کی طاقت تھی۔ فیصلہ: برسوں کے ظلم کی سزا یا عام
    معافی کا اعلان؟'
positions:
- holder:
    ar: دعاة العفو
    en: the pardoning party
    ur: معافی کے حامی
  stance:
    ar: العفو يفتح القلوب قبل أن تُفتح الأبواب
    en: pardon opens hearts before gates are opened
    ur: معافی دروازے کھلنے سے پہلے دل کھولتی ہے
  evidence:
    ar: 'قيل للمستخفيين: اذهبوا فأنتم الطلقاء'
    en: 'the hiding ones were told: go, you are free'
    ur: 'چھپے لوگوں سے کہا گیا: جاؤ تم آزاد ہو'
  sources:
  - event/conquest-of-mecca
  - place/mecca
- holder:
    ar: دعاة العدل
    en: the justice party
    ur: انصاف کے حامی
  stance:
    ar: سنين الظلم تستحق جزاء لا إغفال
    en: years of wrong deserve justice, not forgetting
    ur: برسوں کے ظلم کا بدلہ ہونا چاہیے، فراموشی نہیں
  evidence:
    ar: كان في المدينة من فقد أهلًا ومالًا بسببها
    en: there were those in Medina who had lost kin and wealth to it
    ur: مدینہ میں ایسے لوگ بھی تھے جنہوں نے اس کی وجہ سے عزیز اور مال کھویا
  sources:
  - event/hijra
reflection:
  ar: 'أيهما أصعب عندك: أن تعفو وأنت قادر، أم أن تعدل وأنت جريح؟ اكتب سببك.'
  en: 'Which is harder for you: to pardon while able, or to do justice while wounded? Write your reason.'
  ur: 'آپ کے لیے کون مشکل ہے: طاقت ہوتے معاف کرنا یا زخمی ہوتے انصاف کرنا؟ وجہ لکھیں۔'
