id: zakat-practice
band: scholars
claim:
  ar: توثق المصادر أحكام الزكاة بالتفصيل منذ الجيل الأول.
  en: The sources document the rulings of zakat in detail from the first generation.
  ur: مصادر پہلی نسل سے زکات کے احکام تفصیل سے درج کرتے ہیں۔
evidence:
- kind: passage
  id: passage/muwatta-1-020
  caption:
    ar: حديث موطأ في باب الزكاة بسند.
    en: A Muwatta hadith in the zakat section with its isnad.
    ur: موطا کا زکات کے باب میں ایک حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: practice/zakat
  caption:
    ar: سجل الزكاة — ثالث أركان الإسلام في الموسوعة.
    en: The zakat record — the third pillar of Islam in the museum.
    ur: زکات کا ریکارڈ — اسلام کا تیسرا رکن۔
- kind: object
  id: concept/five-pillars
  caption:
    ar: مفهوم الأركان الخمسة — إطار العبادة في الفقه.
    en: The concept of the five pillars — the frame of worship in fiqh.
    ur: پانچ ارکان کا مفہوم — فقہ میں عبادت کا ڈھانچہ۔
historians:
  ar: تورد كتب الفقه أحكام الزكاة تفصيلاً؛ اختلاف الفروع لا ينفي إجماع الأصل.
  en: The fiqh works detail zakat's rulings; disagreement in branches does not negate consensus on the core.
  ur: فقہ کی کتابیں زکات کے احکام تفصیل سے لاتیں ہیں؛ فروعی اختلاف اصل کے اتفاق کو نہیں مٹاتا۔
