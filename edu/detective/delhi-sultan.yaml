id: delhi-sultan
band: researchers
claim:
  ar: دخلت دلهي شبكة العالم الإسلامي العلمية مع السلاطين.
  en: Delhi entered the learned network of the Muslim world under the sultans.
  ur: دہلی سلاطین کے دور میں مسلم دنیا کے علمی جال میں شامل ہوئی۔
evidence:
- kind: passage
  id: passage/muwatta-1-061
  caption:
    ar: حديث موطأ بسند.
    en: A Muwatta hadith with isnad.
    ur: موطا کا حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: place/delhi
  caption:
    ar: دلهي — عاصمة السلاطين ثم المغول في الهند.
    en: Delhi — capital of the sultans then the Mughals in India.
    ur: دہلی — ہندوستان میں سلاطین پھر مغولوں کا دارالحکومت۔
- kind: object
  id: object/mira-mughaliyya
  caption:
    ar: مرآة مغولية — أثر من الحرفية الهندية الإسلامية.
    en: A Mughal mirror — a work of Indo-Islamic craft.
    ur: مغل آئینہ — ہند-اسلامی دستکاری کا نمونہ۔
historians:
  ar: تصف المصادر مدراس دلهي وكتبها؛ اندمجت في عالم الكتاب العربي والفارسي.
  en: Sources describe Delhi's madrasas and books; it joined the Arabic-and-Persian book world.
  ur: مآخذ دہلی کی مدراسوں اور کتابوں کا ذکر کرتی ہیں؛ وہ عربی-فارسی کتابی دنیا میں شامل ہوئی۔
