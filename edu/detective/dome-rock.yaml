id: dome-rock
band: researchers
claim:
  ar: يظهر بناء قبة الصخرة قروناً من الترميم والرعاية.
  en: The Dome of the Rock shows centuries of rebuilding and care.
  ur: قبة الصخرہ صدیوں کی تعمیر نو اور دیکھ بھال دکھاتا ہے۔
evidence:
- kind: passage
  id: passage/arbaun-07
  caption:
    ar: حديث في الأربعين بسند.
    en: A Forty hadith with isnad.
    ur: چالیس کا حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: place/jerusalem
  caption:
    ar: القدس — مدينة القبة والأقصى في التاريخ الإسلامي.
    en: Jerusalem — the city of the Dome and al-Aqsa in Islamic history.
    ur: یروشلم — اسلامی تاریخ میں قبة اور اقصیٰ کا شہر۔
- kind: object
  id: building/dome-of-the-rock
  caption:
    ar: قبة الصخرة — البناء الأموي بزخارفه الذهبية.
    en: The Dome of the Rock — the Umayyad building with its golden decoration.
    ur: قبة الصخرہ — اموی عمارت اپنی سنہری آرائش کے ساتھ۔
historians:
  ar: تؤرخ كتب العمارة البناء لعبد الملك؛ طبقات الترميم العثمانية والحديثة موثقة بالنقوش.
  en: Architecture histories date it to Abd al-Malik; Ottoman and modern restoration layers are documented by inscriptions.
  ur: عمارت کی کتابیں اسے عبد الملک کے عہد میں مورخ کرتی ہیں؛ عثمانی اور جدید تزئین کی تہیں کتبوں سے موثق ہیں۔
