id: ghazali-turn
band: researchers
claim:
  ar: تحول الغزالي من التدريس إلى التصوف وثقة ذاتية في سيرته.
  en: Al-Ghazali's turn from teaching to Sufism is documented in his own account.
  ur: غزالی کی تدریس سے تصوف کی طرف رخ ان کی اپنی سرگزشت میں موثق ہے۔
evidence:
- kind: passage
  id: passage/muwatta-1-037
  caption:
    ar: 'حديث موطأ بسند.'
    en: 'A Muwatta hadith with isnad.'
    ur: 'موطا کا حدیث اپنی سند کے ساتھ۔'
- kind: chronicle
  id: work/al-munqidh-min-al-dalal
  caption:
    ar: 'فقرة من المنقذ من الضلال يحكي فيها الغزالي أزمته وتحوّله، معاد صياغتها بأمانة.'
    en: 'A paragraph of al-Munqidh where al-Ghazali tells his crisis and turn, faithfully rephrased.'
    ur: 'المنقذ من الضلال کا ایک پیراگراف جس میں غزالی نے اپنا بحران اور تبدیلی بیان کی، دیانت سے دوبارہ صیغہ بندی۔'
- kind: object
  id: work/al-mughni
  caption:
    ar: 'المغني في فقه الحنابلة — سياق الفقه الذي عاش فيه الغزالي.'
    en: 'Al-Mughni in Hanbali fiqh — the legal world al-Ghazali inhabited.'
    ur: 'حنبلی فقہ میں مغنی — وہ فقہی دنیا جس میں غزالی رہے۔'
historians:
  ar: يصف «المنقذ من الضلال» تحوله بنفسه؛ يقرؤه الباحثون كنص ذاتي لا شهادة محايدة.
  en: The Deliverer from Error describes his turn in his own words; researchers read it as self-testimony, not neutral witness.
  ur: '''منقذ من الضلال'' اس کا رخ خود بیان کرتا ہے؛ محققین اسے خود شہادت پڑھتے ہیں، غیر جانبدار گواہی نہیں۔'
