id: fath-mercy
band: scholars
claim:
  ar: دخل النبي مكة عفواً عام ٨ هـ لا انتقاماً.
  en: The Prophet entered Mecca in 8 AH with pardon, not vengeance.
  ur: نبی نے ۸ ہجری میں مکہ میں عفو کے ساتھ داخلہ کیا، انتقام سے نہیں۔
  fr: En entrant à La Mecque en l’an 8 de l’Hégire, le prophète Muhammad choisit le pardon plutôt que la vengeance.
  tr: Peygamber, affedersiniz, 8 Hicri yılında, intikam için değil, Mekke'ye girdi.
  id: Nabi memasuki Mekah, maaf, pada tahun ke-8 H, bukan karena balas dendam.
evidence:
- kind: passage
  id: passage/muwatta-1-013
  caption:
    ar: حديث موطأ بسند مدني.
    en: A Muwatta hadith with a Medinan isnad.
    ur: موطا کا ایک حدیث مدنی سند کے ساتھ۔
    fr: Un hadith du Muwatta dont la chaîne de transmission est médinoise.
    tr: Sivil zincirli bir Muwatta' hadisi.
    id: Hadis Muwatta' dengan rantai sipil.
- kind: chronicle
  id: event/fath-mecca-cleansing-kaaba
  caption:
    ar: تطهير الكعبة من الأصنام — من سجل الفتح.
    en: The cleansing of the Kaaba from idols — from the conquest record.
    ur: کعبہ کو بتوں سے پاک کرنا — فتح کے ریکارڈ سے۔
    fr: Le retrait des idoles de la Kaaba, d’après la fiche sur la prise de La Mecque.
    tr: Kabe'nin putlardan arındırılması — fetih kaydından.
    id: Pemurnian Ka'bah dari berhala — dari catatan penaklukan.
- kind: object
  id: building/dome-of-the-rock
  caption:
    ar: قبة الصخرة في القدس — مرجع بصري للمكان المقدس في التراث.
    en: The Dome of the Rock in Jerusalem — a visual anchor of the sacred place in the heritage.
    ur: یروشلم میں قبة الصخرہ — مقدس مقام کا بصری مرکز۔
    fr: 'Le Dôme du Rocher à Jérusalem : un repère visuel qui rappelle la place du sanctuaire dans le patrimoine.'
    tr: Kudüs'teki Kaya Kubbesi — mirasta kutsal yer için görsel bir referans.
    id: Kubah Batu di Yerusalem — referensi visual untuk tempat suci dalam warisan.
historians:
  ar: تروي المصادر العفو العام كحدث مميز؛ بعضها يصف استثناءات محدودة.
  en: The sources tell the general pardon as a distinctive event; some describe limited exceptions.
  ur: مصادر عام معافی کو نمایاں واقعہ بیان کرتے ہیں؛ کچھ محدود استثنائیں ذکر کرتے ہیں۔
  fr: Les sources présentent le pardon général comme un fait marquant. Certaines en signalent quelques exceptions.
  tr: Kaynaklar genel afı ayırt edici bir olay olarak anlatır; bazıları sınırlı istisnalar içerir.
  id: Sumber-sumber menceritakan amnesti umum sebagai peristiwa yang khas; beberapa menggambarkan pengecualian terbatas.
