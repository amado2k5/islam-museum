id: fath-mercy
band: scholars
claim:
  ar: دخل النبي مكة عفواً عام ٨ هـ لا انتقاماً.
  en: The Prophet entered Mecca in 8 AH with pardon, not vengeance.
  ur: نبی نے ۸ ہجری میں مکہ میں عفو کے ساتھ داخلہ کیا، انتقام سے نہیں۔
evidence:
- kind: passage
  id: passage/muwatta-1-013
  caption:
    ar: حديث موطأ بسند مدني.
    en: A Muwatta hadith with a Medinan isnad.
    ur: موطا کا ایک حدیث مدنی سند کے ساتھ۔
- kind: chronicle
  id: event/fath-mecca-cleansing-kaaba
  caption:
    ar: تطهير الكعبة من الأصنام — من سجل الفتح.
    en: The cleansing of the Kaaba from idols — from the conquest record.
    ur: کعبہ کو بتوں سے پاک کرنا — فتح کے ریکارڈ سے۔
- kind: object
  id: building/dome-of-the-rock
  caption:
    ar: قبة الصخرة في القدس — مرجع بصري للمكان المقدس في التراث.
    en: The Dome of the Rock in Jerusalem — a visual anchor of the sacred place in the heritage.
    ur: یروشلم میں قبة الصخرہ — مقدس مقام کا بصری مرکز۔
historians:
  ar: تروي المصادر العفو العام كحدث مميز؛ بعضها يصف استثناءات محدودة.
  en: The sources tell the general pardon as a distinctive event; some describe limited exceptions.
  ur: مصادر عام معافی کو نمایاں واقعہ بیان کرتے ہیں؛ کچھ محدود استثنائیں ذکر کرتے ہیں۔
