id: ibn-sina-canon
band: researchers
claim:
  ar: ظل القانون في الطب مرجعاً في أوروبا قروناً.
  en: The Canon of Medicine stayed a reference in Europe for centuries.
  ur: قانون طب صدیوں تک یورپ میں حوالہ رہا۔
evidence:
- kind: passage
  id: passage/muwatta-1-030
  caption:
    ar: حديث موطأ بسند — مثال توثيق النصوص.
    en: A Muwatta hadith with isnad — an example of textual documentation.
    ur: موطا کا حدیث سند کے ساتھ — متن کی توثیق کی مثال۔
- kind: chronicle
  id: person/ibn-sina
  caption:
    ar: ابن سينا — الفيلسوف والطبيب صاحب القانون.
    en: Ibn Sina — the philosopher-physician who authored the Canon.
    ur: ابن سینا — قانون کے مصنف فلسفی طبیب۔
- kind: object
  id: work/al-qanun-fi-al-tibb
  caption:
    ar: كتاب القانون في الطب — موسوعة طبية في خمسة أجزاء.
    en: The Canon of Medicine — a medical encyclopaedia in five books.
    ur: قانون فل طب — پانچ جلدوں میں طبی دائرۃ المعارف۔
historians:
  ar: تروي كتب الترجمة تداول القانون في المدارس الأوروبية حتى القرن السابع عشر.
  en: Translation histories report the Canon's use in European schools into the seventeenth century.
  ur: ترجمہ کی تاریخیں سترہویں صدی تک یورپی مدارس میں قانون کے استعمال کی خبر دیتی ہیں۔
