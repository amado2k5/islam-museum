  en: The Canon of Medicine stayed a reference in Europe for centuries.
  ur: قانون طب صدیوں تک یورپ میں حوالہ رہا۔
  fr: Le Canon de la médecine est resté un ouvrage de référence en Europe pendant des siècles.
  tr: Tıpta hukuk, yüzyıllarca Avrupa'da bir referans olarak kaldı.
  id: Hukum dalam bidang kedokteran tetap menjadi referensi di Eropa selama berabad-abad.
