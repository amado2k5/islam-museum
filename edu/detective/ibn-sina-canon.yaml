  en: Translation histories report the Canon's use in European schools into the seventeenth century.
  ur: ترجمہ کی تاریخیں سترہویں صدی تک یورپی مدارس میں قانون کے استعمال کی خبر دیتی ہیں۔
  fr: Les historiens de la traduction rapportent que le Canon a servi dans les écoles européennes jusqu’au XVIIe siècle.
  tr: Çeviri kitapları, on yedinci yüzyıla kadar Avrupa okullarında hukukun dolaşımını anlatır.
