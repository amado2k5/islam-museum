id: ali-knowledge
band: scholars
claim:
  ar: كان علي بن أبي طالب من أوائل الذين رووا وعلموا.
  en: Ali ibn Abi Talib was among the earliest who narrated and taught.
  ur: علی بن ابی طالب ابتدائی راویوں اور علم دینے والوں میں سے تھے۔
evidence:
- kind: passage
  id: passage/arbaun-05
  caption:
    ar: 'حديث في الأربعين بسند يمر بأقارب البيت.'
    en: 'A Forty hadith whose chain runs through the household''s kin.'
    ur: 'چالیس کا ایک حدیث جس کی سند اہل بیت کے رشتوں سے گزرتی ہے۔'
- kind: chronicle
  id: work/itmam-al-wafa-fi-sirat-al-khulafa
  caption:
    ar: 'خلاصة من إتمام الوفاء في سيرة الخلفاء: مكانة علي في الرواية والقضاء، معاد صياغتها بأمانة.'
    en: 'A paraphrase of Itmam al-Wafa on the caliphs'' lives: Ali''s standing in narration and judgem''en''t, restated faithfully.'
    ur: 'اتمام الوفا فی سیرۃ الخلفا کا خلاصہ: روایت اور قضاء میں علی کا مقام، دیانت سے دوبارہ بیان کیا گیا۔'
- kind: object
  id: object/naal-al-nabi
  caption:
    ar: 'نعل النبي المحفوظ — أثر يرتبط بالبيت النبوي في الذاكرة.'
    en: 'The preserved sandal — a relic tied to the Prophet''s household in memory.'
    ur: 'محفوظ نعل — یادداشت میں اہل بیت سے منسوب تذکرہ۔'
historians:
  ar: تذكر المصادر مكانة علي في نقل الحديث والقضاء؛ تقع في المنزلة الخاصة عند كل المسلمين.
  en: Sources mention Ali's standing in narration and judgement; his place is special among all Muslims.
  ur: مصادر علی کا مقام روایت اور قضاء میں بیان کرتے ہیں؛ ان کی جگہ تمام مسلمانوں میں خاص ہے۔
