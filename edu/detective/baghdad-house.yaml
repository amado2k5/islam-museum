id: baghdad-house
band: researchers
claim:
  ar: كان بيت الحكمة مركزاً لحركة الترجمة في بغداد.
  en: The House of Wisdom was the centre of the translation movement in Baghdad.
  ur: بیت الحکمت بغداد میں ترجمہ کی تحریک کا مرکز تھا۔
evidence:
- kind: passage
  id: passage/muwatta-1-059
  caption:
    ar: حديث موطأ بسند.
    en: A Muwatta hadith with isnad.
    ur: موطا کا حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: building/bayt-al-hikma
  caption:
    ar: بيت الحكمة — المؤسسة العباسية للترجمة والبحث.
    en: The House of Wisdom — the Abbasid institution for translation and research.
    ur: بیت الحکمت — ترجمہ اور تحقیق کی عباسی ادارہ۔
- kind: object
  id: place/baghdad
  caption:
    ar: بغداد — عاصمة العباسيين ومركز الحركة العلمية.
    en: Baghdad — the Abbasid capital and centre of the scholarly movement.
    ur: بغداد — عباسی دارالحکومت اور علمی تحریک کا مرکز۔
historians:
  ar: يصف الباحثون بيت الحكمة مكتبة ومركز ترجمة؛ توسعت وظيفته عبر العصور.
  en: Researchers describe it as a library and translation centre; its role expanded across the centuries.
  ur: محققین اسے کتب خانہ اور ترجمہ مرکز بتاتے ہیں؛ اس کا کردار صدیوں میں بڑھا۔
