  caption:
    ar: حديث موطأ — مثال على سند يوثق النص.
    en: A Muwatta hadith — an example of a chain that docum'en'ts a text.
    ur: موطا کا حدیث — متن کو ثابت کرنے والی سند کی مثال۔
    fr: 'Un hadith du Muwatta : un exemple de chaîne de transmission qui documente un texte.'
    tr: Muwatta Hadisleri — Metni belgeleyen bir zincir örneği.
    id: Muwatta Hadis — Contoh rantai yang mendokumentasikan teks.
