  caption:
    ar: جملة من كتاب الجبر والمقابلة تعرّف فنّه في حل المسائل، منقولة بأمانة مختصرًا.
    en: A line from the Book of Algebra and Balancing defining its art in solving problems, faithfully abbreviated.
    ur: کتاب الجبر والمقابلہ کا ایک جملہ جو مسائل حل کرنے کے اس کے فن کی تعریف کرتا ہے، دیانت سے مختصر۔
    fr: Une phrase abrégée fidèlement du Livre de l’algèbre et de la comparaison, qui définit l’art de résoudre des problèmes.
    tr: Algebra and Counterbalance adlı kitaptan bir derleme, sanatını problem çözme konusunda tanıtıyor, özlü ve sadık bir şekilde.
    id: Sebuah kumpulan dari buku Algebra and Counterbalance yang memperkenalkan seni pemecahan masalahnya secara ringkas dan setia dan singkat.
- kind: object
  id: concept/algebra
  caption:
    ar: مفهوم الجبر — من الجبر والمقابلة إلى علم الحديث.
    en: The concept of algebra — from al-jabr wal-muqabala to a named discipline.
    ur: الجبر کا مفہوم — الجبر والمقابلہ سے ایک نامور علم تک۔
    fr: 'L’algèbre : de l’al-jabr wa-l-muqabala à une discipline qui porte ce nom.'
    tr: Cebir kavramı — cebir ve karşılaştırmadan hadis bilimine kadar.
    id: Konsep aljabar — dari aljabar dan perbandingan hingga ilmu hadis.
historians:
  ar: يرى المؤرخون كتابه أول تأسيس منهجي للجبر؛ الاسم بقي في اللغات الأوروبية.
  en: Historians see his book as the first systematic founding of algebra; the name stayed in European languages.
  ur: مؤرخین اس کی کتاب کو الجبر کی پہلی منظم بنیاد مانتے ہیں؛ نام یورپی زبانوں میں باقی رہا۔
  fr: Les historiens voient dans son livre le premier exposé systématique des fondements de l’algèbre. Le nom est resté dans les langues européennes.
  tr: Tarihçiler, kitabını cebirin ilk sistematik temeli olarak kabul eder; isim Avrupa dillerinde kalmıştır.
  id: Para sejarawan menganggap bukunya sebagai dasar sistematis pertama dari aljabar; nama ini tetap digunakan dalam bahasa-bahasa Eropa.
