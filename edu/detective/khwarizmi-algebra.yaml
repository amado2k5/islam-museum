id: khwarizmi-algebra
band: researchers
claim:
  ar: وضع الخوارزمي الجبر علماً مستقلاً باسمه.
  en: Al-Khwarizmi established algebra as a science bearing its own name.
  ur: خوارزمی نے الجبر کو اس کے نام کے ساتھ ایک مستقل علم بنا دیا۔
evidence:
- kind: passage
  id: passage/muwatta-1-029
  caption:
    ar: 'حديث موطأ — مثال على سند يوثق النص.'
    en: 'A Muwatta hadith — an example of a chain that docum''en''ts a text.'
    ur: 'موطا کا حدیث — متن کو ثابت کرنے والی سند کی مثال۔'
- kind: chronicle
  id: work/al-jabr-wal-muqabala
  caption:
    ar: 'جملة من كتاب الجبر والمقابلة تعرّف فنّه في حل المسائل، منقولة بأمانة مختصرًا.'
    en: 'A line from the Book of Algebra and Balancing defining its art in solving problems, faithfully abbreviated.'
    ur: 'کتاب الجبر والمقابلہ کا ایک جملہ جو مسائل حل کرنے کے اس کے فن کی تعریف کرتا ہے، دیانت سے مختصر۔'
- kind: object
  id: concept/algebra
  caption:
    ar: 'مفهوم الجبر — من الجبر والمقابلة إلى علم الحديث.'
    en: 'The concept of algebra — from al-jabr wal-muqabala to a named discipline.'
    ur: 'الجبر کا مفہوم — الجبر والمقابلہ سے ایک نامور علم تک۔'
historians:
  ar: يرى المؤرخون كتابه أول تأسيس منهجي للجبر؛ الاسم بقي في اللغات الأوروبية.
  en: Historians see his book as the first systematic founding of algebra; the name stayed in European languages.
  ur: مؤرخین اس کی کتاب کو الجبر کی پہلی منظم بنیاد مانتے ہیں؛ نام یورپی زبانوں میں باقی رہا۔
