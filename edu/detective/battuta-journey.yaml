id: battuta-journey
band: researchers
claim:
  ar: قطع ابن بطوطة مسافات قياسية في ثلاثة عقود.
  en: Ibn Battuta covered record distances across three decades.
  ur: ابن بطوطہ نے تین دہائیوں میں غیر معمولی فاصلے طے کیے۔
evidence:
- kind: passage
  id: passage/muwatta-1-044
  caption:
    ar: 'حديث بسند — مثال على النص المدون.'
    en: 'A hadith with isnad — an example of a docum''en''ted text.'
    ur: 'سند کے ساتھ حدیث — موثق متن کی مثال۔'
- kind: chronicle
  id: work/rihla-ibn-battuta
  caption:
    ar: 'مقطع من الرحلة يصف طول سفر ابن بطوطة وبلوغه بلاد الإسلام، منقول بأمانة مختصرًا.'
    en: 'A passage of the Rihla describing the l''en''gth of Ibn Battuta''s travels and his reach across the lands of Islam, faithfully abbreviated.'
    ur: 'رحلہ کا ایک اقتباس جو ابن بطوطہ کے سفر کی طوالت اور بلادِ اسلام تک رسائی بیان کرتا ہے، دیانت سے مختصر کیا گیا۔'
- kind: object
  id: work/rihla-ibn-battuta
  caption:
    ar: 'الرحلة — كتاب سفره الملقب بتحفة النظار.'
    en: 'The Rihla — his travel book titled the Gift of the Observers.'
    ur: 'رحلہ — ان کی سفرنامہ کتاب جس کا نام تحفۃ النظار ہے۔'
historians:
  ar: تقدر المصادر مسافته بنحو مئة ألف كيلومتر؛ تحفظ الرحلة تفاصيل ثلاثين سنة.
  en: Sources estimate his distance at about a hundred thousand kilometres; the Rihla preserves thirty years of detail.
  ur: مآخذ ان کا فاصلہ تقریباً ایک لاکھ کلومیٹر بتاتے ہیں؛ رحلہ تیس سال کی تفصیلات محفوظ رکھتا ہے۔
