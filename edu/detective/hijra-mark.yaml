id: hijra-mark
band: scholars
claim:
  ar: كانت الهجرة نقطة تحول في تاريخ الإسلام الأول.
  en: The Hijra was the turning point in early Islamic history.
  ur: ہجرت ابتدائی اسلامی تاریخ میں نقطۂ عطف تھی۔
evidence:
- kind: passage
  id: passage/muwatta-1-003
  caption:
    ar: حديث من الموطأ يذكر أمور ما بعد الهجرة بسند مدني.
    en: A Muwatta hadith on post-Hijra matters carried by a Medinan chain.
    ur: موطا کا ایک حدیث جو ہجرت کے بعد کے امور بیان کرتا ہے مدنی سند کے ساتھ۔
- kind: chronicle
  id: event/hijra
  caption:
    ar: سجل الهجرة في الموسوعة — مخرج النبي من مكة إلى المدينة عام ١ هـ.
    en: The graph's record of the Hijra — the Prophet's move from Mecca to Medina in year 1 AH.
    ur: گراف میں ہجرت کا ریکارڈ — سن ۱ ہجری میں نبی کا مکہ سے مدینہ کا سفر۔
- kind: object
  id: place/mecca
  caption:
    ar: مكة قبل الهجرة — موطن الدعوة الأولى.
    en: Mecca before the Hijra — the first home of the call.
    ur: ہجرت سے قبل مکہ — دعوت کا پہلا گھر۔
historians:
  ar: يعدد المؤرخون الهجرة بداية التقويم الهجري وبداية الدولة في المدينة.
  en: Historians count the Hijra as the start of the Hijri calendar and of the community's state in Medina.
  ur: مؤرخین ہجرت کو ہجری تقویم اور مدینہ میں ریاست کی شروعات شمار کرتے ہیں۔
