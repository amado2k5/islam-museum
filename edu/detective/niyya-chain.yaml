id: niyya-chain
band: scholars
claim:
  ar: وصلتنا أحاديث الأربعين النووية بأسانيد مسمّاة يتحقق منها أهل الحديث.
  en: The hadith of al-Nawawi's Forty reached us through named chains hadith scholars verify.
  ur: نووی کے چالیس کے احادیث ہم تک نامور سندوں سے پہنچے جن کی تصدیق محدثین کرتے ہیں۔
  fr: Les hadiths des Quarante d’Al-Nawawi nous sont parvenus par des chaînes dont les spécialistes vérifient les transmetteurs nommés.
  tr: Hadis âlimleri tarafından doğrulanmış isimli zincirlerle birlikte kırk en-Nevavi'nin hadislerini aldık.
  id: Kami telah menerima hadis dari empat puluh an-Nawawi dengan rantai yang disebutkan yang diverifikasi oleh para ulama hadis.
evidence:
- kind: passage
  id: passage/arbaun-05
  caption:
    ar: حديث من الأربعين بسند يمرّ بالقاسم عن عائشة عن النبي — مثال على السند الموثق.
    en: A Forty hadith whose chain runs through al-Qasim from Aisha from the Prophet — an example of a docum'en'ted isnad.
    ur: چالیس کا حدیث جس کی سند قاسم سے عائشہ سے نبی تک جاتی ہے — موثق سند کی مثال۔
    fr: 'Un hadith des Quarante dont la chaîne passe par al-Qasim, d’après Aïcha, d’après le prophète Muhammad : un exemple de chaîne documentée.'
    tr: Kırklı bir hadis, zinciri Peygamber'den Aişeden Kasım — güvenilir bir zincir örneği.
    id: Hadis dari tahun empat puluh dengan rantai yang melewati Qasim dari Aisha dari Nabi — contoh rantai yang dapat diandalkan.
- kind: chronicle
  id: work/arbaun-nawawi
  caption:
    ar: نصّ حديث النية الأول في الأربعين النووية مع سنده، مذكور بحذافيره.
    en: The first hadith of int'en'tion in al-Nawawi's Forty with its chain, quoted as recorded.
    ur: اربعین نووی میں نیت کی پہلی حدیث اپنی سند کے ساتھ، جوں کی توں مذکور۔
    fr: Le premier hadith des Quarante d’Al-Nawawi, sur l’intention, cité tel qu’il a été consigné avec sa chaîne de transmission.
    tr: Arbaeen al-Nawawiyyah'daki ilk niyet hadisi metni ve onun rivayet zinciri ayrıntılı olarak anılır.
    id: Teks Hadits niat pertama dalam Arbaeen al-Nawawiyyah beserta rantai riwayatnya disebutkan secara rinci.
- kind: object
  id: work/arbaun-nawawi
  caption:
    ar: كتاب الأربعون نفسه — أربعون حديثاً اختارها النووي لتكون أصول الدين.
    en: The Book of the Forty itself — forty hadith al-Nawawi chose as the foundations of the faith.
    ur: کتاب الاربعون — وہ چالیس احادیث جو نووی نے دین کے اصول کے طور پر چنیں۔
    fr: 'Le recueil des Quarante lui-même : quarante hadiths choisis par al-Nawawi pour présenter les fondements de la religion.'
    tr: Kırk Kitabı Kendisi — el-Nevavi tarafından dinin temeli olarak seçilen kırk hadis.
    id: Kitab Empat Puluh itu sendiri — empat puluh hadis yang dipilih oleh al-Nawawi sebagai dasar agama.
historians:
  ar: يتفق أهل الحديث على أن طريق البخاري لهذا الحديث إسناد صحيح؛ رواية يحيى بن سعيد عنه مئتا راوٍ أو أكثر.
  en: Hadith scholars agree al-Bukhari's chain for this hadith is sound; over two hundred narrators transmitted it from Yahya ibn Sa'id.
  ur: محققین حدیث متفق ہیں کہ بخاری کا سند صحیح ہے؛ یحییٰ بن سعید سے دو سو سے زائد راویوں نے روایت کیا۔
  fr: Les spécialistes du hadith s’accordent sur l’authenticité de la chaîne d’Al-Boukhari pour ce hadith. Au moins deux cents personnes l’ont transmis d’après Yahya ibn Saïd.
  tr: Hadis âlimleri, Buhari'nin bu hadis için aktardığı zincirin doğru olduğunu kabul eder; Yahya ibn Sa'id ondan iki yüz veya daha fazla rivayetçi rivayet etmiştir.
  id: Para ulama hadis sepakat bahwa rantai transmisi Bukhari untuk hadis ini adalah asli; Yahya ibn Sa'id menceritakan darinya dua ratus atau lebih narator.
