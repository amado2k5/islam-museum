id: niyya-chain
band: scholars
claim:
  ar: وصلتنا أحاديث الأربعين النووية بأسانيد مسمّاة يتحقق منها أهل الحديث.
  en: The hadith of al-Nawawi's Forty reached us through named chains hadith scholars verify.
  ur: نووی کے چالیس کے احادیث ہم تک نامور سندوں سے پہنچے جن کی تصدیق محدثین کرتے ہیں۔
evidence:
- kind: passage
  id: passage/arbaun-05
  caption:
    ar: حديث من الأربعين بسند يمرّ بالقاسم عن عائشة عن النبي — مثال على السند الموثق.
    en: A Forty hadith whose chain runs through al-Qasim from Aisha from the Prophet — an example of a documented isnad.
    ur: چالیس کا حدیث جس کی سند قاسم سے عائشہ سے نبی تک جاتی ہے — موثق سند کی مثال۔
- kind: chronicle
  id: person/al-nawawi
  caption:
    ar: يحيى النووي جامع الأربعين — عالم شافعي عاش في القرن السابع الهجري وجمع أحاديث مفتاحية.
    en: Yahya al-Nawawi, compiler of the Forty — a seventh-century Shafi'i scholar who gathered the foundational hadith.
    ur: یحیی نووی — ساتویں صدی ہجری کے شافعی عالم جنہوں نے بنیادی احادیث جمع کیں۔
- kind: object
  id: work/arbaun-nawawi
  caption:
    ar: كتاب الأربعون نفسه — أربعون حديثاً اختارها النووي لتكون أصول الدين.
    en: The Book of the Forty itself — forty hadith al-Nawawi chose as the foundations of the faith.
    ur: کتاب الاربعون — وہ چالیس احادیث جو نووی نے دین کے اصول کے طور پر چنیں۔
historians:
  ar: يتفق أهل الحديث على أن طريق البخاري لهذا الحديث إسناد صحيح؛ رواية يحيى بن سعيد عنه مئتا راوٍ أو أكثر.
  en: Hadith scholars agree al-Bukhari's chain for this hadith is sound; over two hundred narrators transmitted it from Yahya ibn Sa'id.
  ur: محققین حدیث متفق ہیں کہ بخاری کا سند صحیح ہے؛ یحییٰ بن سعید سے دو سو سے زائد راویوں نے روایت کیا۔
