id: badr-day
band: scholars
claim:
  ar: روت المصادر يوم بدر يوماً مفصلاً.
  en: The sources recount the day of Badr as a decisive day.
  ur: مصادر بدر کے دن کو فیصلہ کن دن کے طور پر بیان کرتے ہیں۔
  fr: Les sources présentent la journée de Badr comme un moment décisif.
  tr: Kaynaklar, dolunayın ayrıntılı bir gününü anlattı.
  id: Sumber-sumber menceritakan hari bulan purnama secara rinci.
evidence:
- kind: passage
  id: passage/muwatta-1-006
  caption:
    ar: حديث موطأ آخر بسند من أهل العلم.
    en: Another Muwatta hadith with a scholar's chain.
    ur: موطا کا ایک اور حدیث علم والے کی سند کے ساتھ۔
    fr: Un autre hadith du Muwatta, accompagné d’une chaîne de transmission qui passe par un savant.
    tr: Bir başka Muwatta hadisi, alimlerden gelen bir aktarım zincirine sahip.
    id: Hadits Muwatta lain dengan rangkaian transmisi dari para ulama.
- kind: chronicle
  id: event/badr-battle-day
  caption:
    ar: سجل يوم بدر — تفاصيل المعركة الأولى الكبرى عام ٢ هـ.
    en: The record of Badr day — details of the first great battle in 2 AH.
    ur: بدر کے دن کا ریکارڈ — ۲ ہجری کی پہلی بڑی جنگ کی تفصیلات۔
    fr: La fiche sur Badr détaille la première grande bataille, en l’an 2 de l’Hégire.
    tr: Badr Günü kaydedilmiştir — 2 Hicri yılındaki ilk büyük savaşın detayları.
    id: Hari Badr tercatat — rincian pertempuran besar pertama di tahun 2 H.
- kind: object
  id: concept/badr-as-sign
  caption:
    ar: مفهوم بدر كآية — كيف قرأتها الذاكرة الإسلامية.
    en: The concept of Badr as a sign — how Muslim memory read it.
    ur: بدر بطور آیت کا مفہوم — اسلامی یادداشت نے اسے کیسے پڑھا۔
    fr: 'Badr comme signe : la manière dont la mémoire musulmane a interprété l’événement.'
    tr: Bedr'in bir ayet olarak kavramı — İslami hafızanın bunu nasıl okuduğu.
    id: Konsep Badr sebagai sebuah ayat — bagaimana ingatan Islam membacanya.
historians:
  ar: يرى المؤرخون بدر أول اختبار عسكري كبير للجماعة؛ المبالغة في التفاصيل تعود لأهميتها في الوعي.
  en: Historians see Badr as the community's first major military test; its meaning in memory explains the detail.
  ur: مؤرخین بدر کو جماعت کا پہلا بڑا عسکری امتحان مانتے ہیں؛ یادداشت میں اس کی اہمیت تفصیلات کی وجہ ہے۔
  fr: Les historiens voient dans Badr la première grande épreuve militaire de la communauté. Sa place dans la mémoire explique l’abondance des détails.
  tr: Tarihçiler Badr'ı grubun ilk büyük askeri sınavı olarak görür; detaylardaki abartı, farkındalık açısından öneminden kaynaklanmaktadır.
  id: Sejarawan menganggap Badr sebagai ujian militer besar pertama kelompok ini; keterlebihan dalam detail disebabkan oleh pentingnya dalam kesadaran.
