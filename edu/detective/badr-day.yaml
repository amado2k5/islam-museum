id: badr-day
band: scholars
claim:
  ar: روت المصادر يوم بدر يوماً مفصلاً.
  en: The sources recount the day of Badr as a decisive day.
  ur: مصادر بدر کے دن کو فیصلہ کن دن کے طور پر بیان کرتے ہیں۔
evidence:
- kind: passage
  id: passage/muwatta-1-006
  caption:
    ar: حديث موطأ آخر بسند من أهل العلم.
    en: Another Muwatta hadith with a scholar's chain.
    ur: موطا کا ایک اور حدیث علم والے کی سند کے ساتھ۔
- kind: chronicle
  id: event/badr-battle-day
  caption:
    ar: سجل يوم بدر — تفاصيل المعركة الأولى الكبرى عام ٢ هـ.
    en: The record of Badr day — details of the first great battle in 2 AH.
    ur: بدر کے دن کا ریکارڈ — ۲ ہجری کی پہلی بڑی جنگ کی تفصیلات۔
- kind: object
  id: concept/badr-as-sign
  caption:
    ar: مفهوم بدر كآية — كيف قرأتها الذاكرة الإسلامية.
    en: The concept of Badr as a sign — how Muslim memory read it.
    ur: بدر بطور آیت کا مفہوم — اسلامی یادداشت نے اسے کیسے پڑھا۔
historians:
  ar: يرى المؤرخون بدر أول اختبار عسكري كبير للجماعة؛ المبالغة في التفاصيل تعود لأهميتها في الوعي.
  en: Historians see Badr as the community's first major military test; its meaning in memory explains the detail.
  ur: مؤرخین بدر کو جماعت کا پہلا بڑا عسکری امتحان مانتے ہیں؛ یادداشت میں اس کی اہمیت تفصیلات کی وجہ ہے۔
