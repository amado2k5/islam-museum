id: mans-hajj
band: researchers
claim:
  ar: أظهرت رحلة مانسا موسى للحج ثروة غرب أفريقيا للعالم.
  en: Mansa Musa's hajj showed the world West Africa's wealth.
  ur: مانسا موسیٰ کی حج کی رحلہ نے دنیا کو مغربی افریقہ کی دولت دکھائی۔
evidence:
- kind: passage
  id: passage/muwatta-1-052
  caption:
    ar: 'حديث موطأ بسند.'
    en: 'A Muwatta hadith with isnad.'
    ur: 'موطا کا حدیث اپنی سند کے ساتھ۔'
- kind: chronicle
  id: work/masalik-al-absar
  caption:
    ar: 'رواية مسالك الأبصار عن حج منسا موسى وذهبه، مختصرة بأمانة عن العمري.'
    en: 'The Masalik al-Absar account of Mansa Musa''s hajj and his gold, faithfully cond''en''sed from al-Umari.'
    ur: 'مسالک الابصار کی روایت منسا موسیٰ کے حج اور اس کے سونے کے بارے میں، عمری سے دیانت سے مختصر۔'
- kind: object
  id: place/timbuktu
  caption:
    ar: 'تمبكتو — مركز الذهب والكتب في مملكته.'
    en: 'Timbuktu — the gold-and-books c''en''tre of his kingdom.'
    ur: 'ٹمبکٹو — ان کی سلطنت کا سونا اور کتابوں کا مرکز۔'
historians:
  ar: تروي كتب التاريخ والخرائط أثر الذهب الذي أنفقه في القاهرة؛ تبقى الرقم الدقيق محل تقدير.
  en: Histories and maps tell the effect of the gold he spent in Cairo; the exact figure stays an estimate.
  ur: تاریخ اور نقشے قاہرہ میں خرچ کیے گئے سونے کا اثر بیان کرتے ہیں؛ درست رقم تخمینہ رہتی ہے۔
