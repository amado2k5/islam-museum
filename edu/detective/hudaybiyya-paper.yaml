id: hudaybiyya-paper
band: scholars
claim:
  ar: يثبت نص صلح الحديبية كيف دارت المفاوضات.
  en: The text of the Hudaybiyya treaty shows how the negotiations ran.
  ur: حديبية کی معاہدے کا متن دکھاتا ہے کہ مذاکرات کیسے ہوئے۔
  fr: Le texte du traité d’Al-Hudaybiyya renseigne sur le déroulement des négociations.
  tr: Hudeybiye Barışı'nın metni, müzakerelerin nasıl geçtiğini kanıtlamaktadır.
  id: Teks Perdamaian Hudaybiyyah membuktikan bagaimana negosiasi berjalan.
evidence:
- kind: passage
  id: passage/muwatta-1-010
  caption:
    ar: حديث من الموطأ بسند.
    en: A Muwatta hadith with its isnad.
    ur: موطا کا ایک حدیث اپنی سند کے ساتھ۔
    fr: Un hadith du Muwatta avec sa chaîne de transmission.
    tr: Muwatta'dan bir hadis ve bir aktarım zinciri.
    id: Hadis dari Muwatta' dengan rantai transmisi.
- kind: chronicle
  id: event/treaty-of-hudaybiyya
  caption:
    ar: سجل الصلح — بنود الاتفاق بين النبي وقريش عام ٦ هـ.
    en: The treaty record — the terms agreed between the Prophet and Quraysh in 6 AH.
    ur: معاہدے کا ریکارڈ — ۶ ہجری میں نبی اور قریش کے درمیان متفقہ شرائط۔
    fr: 'La fiche sur le traité : les clauses convenues entre le prophète Muhammad et Quraych en l’an 6 de l’Hégire.'
    tr: Uzlaşma Kaydı — Peygamber ile Kureyş arasındaki 6 Hicri Anlaşmasının şartları.
    id: Catatan Rekonsiliasi — Ketentuan Perjanjian antara Nabi dan Quraisy pada tahun 6 H.
- kind: object
  id: place/hudaybiyya
  caption:
    ar: موضع الحديبية على حدود الحرم حيث دار الصلح.
    en: The site of al-Hudaybiyya on the edge of the sacred zone where the treaty was made.
    ur: حديبیہ کی جگہ حرم کی سرحد پر جہاں معاہدہ ہوا۔
    fr: Le site d’Al-Hudaybiyya, à la limite du territoire sacré, où fut conclu le traité.
    tr: Barışın sağlandığı Haram sınırındaki Hudaybiyyah konumu.
    id: Lokasi Hudaybiyyah di perbatasan Haram tempat perdamaian terjadi.
historians:
  ar: يصف ابن إسحاق وغيره بنود الصلح؛ نص المعاهدة نفسه يروي القصة بلا تعليق مؤرخ لاحق.
  en: Ibn Ishaq and others describe the treaty's terms; the treaty text itself tells the story without later commentary.
  ur: ابن اسحاق اور دیگر شرائط بیان کرتے ہیں؛ متن خود کہانی بیان کرتا ہے بلا بعد کے تبصرے۔
  fr: Ibn Ishaq et d’autres auteurs décrivent les clauses du traité. Le texte de l’accord lui-même en témoigne sans commentaire d’un historien ultérieur.
  tr: İbn İshaq ve diğerleri antlaşmanın şartlarını tanımlar; antlaşma metninin kendisi hikayeyi sonraki tarihçi yorumları olmadan anlatır.
  id: Ibn Ishaq dan lainnya menjelaskan ketentuan perjanjian tersebut; teks perjanjian itu sendiri menceritakan kisah tersebut tanpa komentar sejarawan berikutnya.
