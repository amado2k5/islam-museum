id: hudaybiyya-paper
band: scholars
claim:
  ar: يثبت نص صلح الحديبية كيف دارت المفاوضات.
  en: The text of the Hudaybiyya treaty shows how the negotiations ran.
  ur: حديبية کی معاہدے کا متن دکھاتا ہے کہ مذاکرات کیسے ہوئے۔
evidence:
- kind: passage
  id: passage/muwatta-1-010
  caption:
    ar: حديث من الموطأ بسند.
    en: A Muwatta hadith with its isnad.
    ur: موطا کا ایک حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: event/treaty-of-hudaybiyya
  caption:
    ar: سجل الصلح — بنود الاتفاق بين النبي وقريش عام ٦ هـ.
    en: The treaty record — the terms agreed between the Prophet and Quraysh in 6 AH.
    ur: معاہدے کا ریکارڈ — ۶ ہجری میں نبی اور قریش کے درمیان متفقہ شرائط۔
- kind: object
  id: place/hudaybiyya
  caption:
    ar: موضع الحديبية على حدود الحرم حيث دار الصلح.
    en: The site of al-Hudaybiyya on the edge of the sacred zone where the treaty was made.
    ur: حديبیہ کی جگہ حرم کی سرحد پر جہاں معاہدہ ہوا۔
historians:
  ar: يصف ابن إسحاق وغيره بنود الصلح؛ نص المعاهدة نفسه يروي القصة بلا تعليق مؤرخ لاحق.
  en: Ibn Ishaq and others describe the treaty's terms; the treaty text itself tells the story without later commentary.
  ur: ابن اسحاق اور دیگر شرائط بیان کرتے ہیں؛ متن خود کہانی بیان کرتا ہے بلا بعد کے تبصرے۔
