id: istanbul-turn
band: researchers
claim:
  ar: تحولت إسطنبول مركزاً إسلامياً كبيراً بعد ١٤٥٣م.
  en: Istanbul became a major Muslim centre after 1453.
  ur: اسطنبول ۱۴۵۳ کے بعد ایک بڑا اسلامی مرکز بنا۔
evidence:
- kind: passage
  id: passage/muwatta-1-062
  caption:
    ar: حديث موطأ بسند.
    en: A Muwatta hadith with isnad.
    ur: موطا کا حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: place/istanbul
  caption:
    ar: إسطنبول — من القسطنطينية إلى العاصمة العثمانية.
    en: Istanbul — from Constantinople to the Ottoman capital.
    ur: اسطنبول — قسطنطنیہ سے عثمانی دارالحکومت تک۔
- kind: object
  id: object/sayf-awrangzib
  caption:
    ar: سيف أورنكزيب — أثر من العصر العثماني-المغولي.
    en: Aurangzeb's sword — a relic of the late Mughal-Ottoman age.
    ur: اورنگزیب کی تلوار — مغل-عثمانی دور کی یادگار۔
historians:
  ar: يرى المؤرخون ١٤٥٣ نقطة تحول للمدينة؛ توسعها العثماني موثق في البناء والسكان.
  en: Historians see 1453 as the city's turning point; Ottoman growth is documented in building and population.
  ur: مؤرخین ۱۴۵۳ کو شہر کا نقطۂ عطف مانتے ہیں؛ عثمانی پھیلاؤ عمارت اور آبادی میں موثق ہے۔
