claim:
  ar: فرض صيام رمضان بإجماع لا خلاف فيه.
  en: The fast of Ramadan was prescribed by consensus without dispute.
  ur: رمضان کا روزہ بلا اختلاف اجماع سے فرض ہوا۔
  fr: Le caractère obligatoire du jeûne du ramadan fait l’objet d’un consensus.
  tr: Ramazan orucu, anlaşmazlık olmadan uzlaşıyla zorunlu hale getirildi.
  id: Puasa Ramadan diwajibkan secara konsensus tanpa perselisihan.
