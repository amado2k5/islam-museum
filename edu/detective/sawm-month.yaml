    en: A hadith on Ramadan fasting with its chain.
    ur: رمضان کے روزے پر ایک حدیث اپنی سند کے ساتھ۔
    fr: Un hadith sur le jeûne du ramadan avec sa chaîne de transmission.
    tr: Ramazan'ı aktarım zinciriyle oruç tutma hadisi.
    id: Sebuah hadits tentang puasa Ramadan dengan rantai transmisi.
