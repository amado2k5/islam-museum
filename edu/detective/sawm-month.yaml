id: sawm-month
band: scholars
claim:
  ar: فرض صيام رمضان بإجماع لا خلاف فيه.
  en: The fast of Ramadan was prescribed by consensus without dispute.
  ur: رمضان کا روزہ بلا اختلاف اجماع سے فرض ہوا۔
evidence:
- kind: passage
  id: passage/muwatta-1-025
  caption:
    ar: حديث في صيام رمضان بسند.
    en: A hadith on Ramadan fasting with its chain.
    ur: رمضان کے روزے پر ایک حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: practice/sawm
  caption:
    ar: سجل الصوم — رابع أركان الإسلام.
    en: The fasting record — the fourth pillar of Islam.
    ur: روزے کا ریکارڈ — اسلام کا چوتھا رکن۔
- kind: object
  id: concept/hijri-calendar
  caption:
    ar: التقويم الهجري — شهر رمضان في سياق الأشهر.
    en: The Hijri calendar — Ramadan in the cycle of months.
    ur: ہجری تقویم — مہینوں کے چکر میں رمضان۔
historians:
  ar: يورد الفقهاء إجماعاً على فرضية الصوم؛ اختلفوا في بعض التفاصيل فقط.
  en: Jurists report consensus on the fast's obligation; they differed only on details.
  ur: فقہا فرضیت روزہ پر اجماع بیان کرتے ہیں؛ وہ صرف جزئیات میں مختلف ہوئے۔
