    ar: التقويم الهجري — شهر رمضان في سياق الأشهر.
    en: The Hijri calendar — Ramadan in the cycle of months.
    ur: ہجری تقویم — مہینوں کے چکر میں رمضان۔
    fr: 'Le calendrier hégirien : la place du ramadan dans le cycle des mois.'
    tr: Hicri takvimi — Aylar bağlamında Ramazan ayı.
    id: Kalender Hijriyah — bulan Ramadan dalam konteks bulan.
historians:
  ar: يورد الفقهاء إجماعاً على فرضية الصوم؛ اختلفوا في بعض التفاصيل فقط.
  en: Jurists report consensus on the fast's obligation; they differed only on details.
  ur: فقہا فرضیت روزہ پر اجماع بیان کرتے ہیں؛ وہ صرف جزئیات میں مختلف ہوئے۔
  fr: Les juristes rapportent un consensus sur l’obligation du jeûne. Ils ne divergent que sur certains détails.
  tr: Hukukçular oruç hipotezi üzerinde bir uzlaşı sunmuşlardır; sadece bazı ayrıntılarda farklılık göstermişlerdir.
  id: Para ahli hukum menyajikan konsensus tentang hipotesis puasa; mereka hanya berbeda pendapat pada beberapa detail.
