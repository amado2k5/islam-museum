  caption:
    ar: سجل الصوم — رابع أركان الإسلام.
    en: The fasting record — the fourth pillar of Islam.
    ur: روزے کا ریکارڈ — اسلام کا چوتھا رکن۔
    fr: La fiche sur le jeûne, quatrième pilier de l’islam.
    tr: Oruç kaydı — İslam'ın dördüncü direği.
    id: Catatan puasa — pilar keempat Islam.
