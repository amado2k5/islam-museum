id: revelation-hira
band: scholars
claim:
  ar: بدأ الوحي في غار حراء قبل أربعين سنة من الهجرة تقريباً.
  en: Revelation began in the cave of Hira nearly forty lunar years before the Hijra.
  ur: وحی کا آغاز غار حرا میں ہجرت سے تقریباً چالیس قمری سال پہلے ہوا۔
  fr: La révélation a commencé dans la grotte de Hira près de quarante années lunaires avant l’Hégire.
  tr: Vahiy, Hira Mağarası'nda, Hicre'den yaklaşık kırk yıl önce başladı.
  id: Wahyu dimulai di Gua Hira sekitar empat puluh tahun sebelum Hijrah.
evidence:
- kind: passage
  id: passage/muwatta-1-016
  caption:
    ar: حديث من الموطأ بسند.
    en: A Muwatta hadith with its isnad.
    ur: موطا کا ایک حدیث اپنی سند کے ساتھ۔
    fr: Un hadith du Muwatta avec sa chaîne de transmission.
    tr: Muwatta'dan bir hadis ve bir aktarım zinciri.
    id: Hadis dari Muwatta' dengan rantai transmisi.
- kind: chronicle
  id: event/first-revelation
  caption:
    ar: سجل الوحي الأول — ليلة القدر في غار حراء.
    en: The record of the first revelation — the night of power in the cave of Hira.
    ur: پہلی وحی کا ریکارڈ — غار حرا میں لیلۃ القدر۔
    fr: 'La fiche sur la première révélation : la Nuit du Destin dans la grotte de Hira.'
    tr: İlk vahiy kaydedildi — Hira mağarasında Kararname Gecesi.
    id: Wahyu pertama tercatat — Malam Dekrit di gua Hira.
- kind: object
  id: place/mecca
  caption:
    ar: مكة وضواحيها — مكان بدء الوحي.
    en: Mecca and its surroundings — where revelation began.
    ur: مکہ اور اس کے نواح — جہاں وحی شروع ہوئی۔
    fr: La Mecque et ses environs, où la révélation a commencé.
    tr: Mekke ve çevresi — vahiyin başladığı yer.
    id: Mekah dan sekitarnya — tempat di mana wahyu dimulai.
historians:
  ar: تجمع السير على أن بدء الوحي كان في حراء؛ تختلف الروايات في تفاصيل اليوم والشهر.
  en: The sirah works agree revelation began in Hira; accounts differ on the day and month.
  ur: سیر کی کتابیں متفق ہیں کہ وحی کا آغاز حرا میں تھا؛ روایتیں دن اور مہینے میں مختلف ہیں۔
  fr: Les biographies du prophète Muhammad s’accordent pour situer le début de la révélation à Hira, mais les récits divergent sur le jour et le mois.
  tr: Siyarlar oybirliğiyle vahyin Hira'da başladığını kabul eder; anlatımlar gün ve ayın detayları konusunda farklılık gösterir.
  id: Para Siyar sepakat bahwa wahyu dimulai di Hira; narasi berbeda mengenai rincian hari dan bulan tersebut.
