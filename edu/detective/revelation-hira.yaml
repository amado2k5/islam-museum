id: revelation-hira
band: scholars
claim:
  ar: بدأ الوحي في غار حراء قبل أربعين سنة من الهجرة تقريباً.
  en: Revelation began in the cave of Hira nearly forty lunar years before the Hijra.
  ur: وحی کا آغاز غار حرا میں ہجرت سے تقریباً چالیس قمری سال پہلے ہوا۔
evidence:
- kind: passage
  id: passage/muwatta-1-016
  caption:
    ar: حديث من الموطأ بسند.
    en: A Muwatta hadith with its isnad.
    ur: موطا کا ایک حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: event/first-revelation
  caption:
    ar: سجل الوحي الأول — ليلة القدر في غار حراء.
    en: The record of the first revelation — the night of power in the cave of Hira.
    ur: پہلی وحی کا ریکارڈ — غار حرا میں لیلۃ القدر۔
- kind: object
  id: place/mecca
  caption:
    ar: مكة وضواحيها — مكان بدء الوحي.
    en: Mecca and its surroundings — where revelation began.
    ur: مکہ اور اس کے نواح — جہاں وحی شروع ہوئی۔
historians:
  ar: تجمع السير على أن بدء الوحي كان في حراء؛ تختلف الروايات في تفاصيل اليوم والشهر.
  en: The sirah works agree revelation began in Hira; accounts differ on the day and month.
  ur: سیر کی کتابیں متفق ہیں کہ وحی کا آغاز حرا میں تھا؛ روایتیں دن اور مہینے میں مختلف ہیں۔
