id: muwatta-date
band: researchers
claim:
  ar: الموطأ من أقدم كتب الحديث المدونة التي بقيت.
  en: The Muwatta is among the earliest surviving compiled hadith books.
  ur: موطا باقی ماندہ مدون حدیث کی ابتدائی کتابوں میں سے ہے۔
  fr: Le Muwatta est l’un des plus anciens recueils de hadiths qui nous soient parvenus.
  tr: Al-Muwatta, kayıtlara geçmiş en eski hadis kitaplarından biridir.
  id: Al-Muwatta adalah salah satu buku hadits tertua yang masih tercatat.
evidence:
- kind: passage
  id: passage/muwatta-1-001
  caption:
    ar: نص أول حديث في الموطأ بسند مالك.
    en: The text of the Muwatta's first hadith with Malik's isnad.
    ur: موطا کے پہلے حدیث کا متن مالک کی سند کے ساتھ۔
    fr: Le texte du premier hadith du Muwatta, avec la chaîne de transmission de Malik.
    tr: Muwatta'daki bir hadisin ilk metni, Malik'in aktarım zinciriyle birlikte.
    id: Teks pertama hadits dalam Muwatta dengan rantai transmisi Malik.
- kind: chronicle
  id: work/al-muntaqa-sharh-al-muwatta
  caption:
    ar: ملاحظة من شرح المنتقى على الموطأ تساعد في تأريخ عمل مالك، معاد صياغتها بأمانة.
    en: A note from the Muntaqa comm'en'tary on the Muwatta helping to date Malik's work, faithfully rephrased.
    ur: موطا پر شرح منتقی کا ایک مشاہدہ جو مالک کے کام کی تاریخ کرنے میں مدد دیتا ہے، دیانت سے دوبارہ صیغہ بندی۔
    fr: Une note reformulée fidèlement d’Al-Muntaqa, commentaire du Muwatta, qui aide à dater l’ouvrage de Malik.
    tr: Al-Muntaqa'nın Al-Muwatta üzerine yazdığı yorumdan bir not, Malik'in eserini tarihlendirmeye yardımcı olur, dürüstçe yeniden ifade edilmiş.
    id: Sebuah catatan dari komentar Al-Muntaqa tentang Al-Muwatta yang membantu menentukan usia karya Malik, yang dirumuskan ulang dengan jujur.
- kind: object
  id: place/medina
  caption:
    ar: المدينة — بيئة تأليف الموطأ.
    en: Medina — the Muwatta's place of compilation.
    ur: مدینہ — موطا کی تالیف کا ماحول۔
    fr: Médine, le milieu où le Muwatta a été compilé.
    tr: Şehir — Al-Muwatta'nın bestesinin çevresi.
    id: Kota — Lingkungan komposisi Al-Muwatta.
historians:
  ar: يؤرخ الباحثون للموطأ بالقرن الثاني الهجري؛ يقارنونه بالصحيحين المتأخرين.
  en: Researchers date the Muwatta to the second Hijri century, comparing it with the later Sahihs.
  ur: محققین موطا کو دوسری صدی ہجری میں مورخ کرتے ہیں اور بعد کی صحیحین سے موازنہ کرتے ہیں۔
  fr: Les chercheurs datent le Muwatta du IIe siècle de l’Hégire et le comparent aux deux recueils authentiques, plus tardifs.
  tr: Araştırmacılar, Muwatta'yı ikinci yüzyıl Hicri Tanrısı'na tarihlendirerek onu iki sonraki Sahih ile karşılaştırır.
  id: Para peneliti memperkirakan Muwatta pada abad kedua H, membandingkannya dengan dua Sahih yang lebih baru.
