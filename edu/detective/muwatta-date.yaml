id: muwatta-date
band: researchers
claim:
  ar: الموطأ من أقدم كتب الحديث المدونة التي بقيت.
  en: The Muwatta is among the earliest surviving compiled hadith books.
  ur: موطا باقی ماندہ مدون حدیث کی ابتدائی کتابوں میں سے ہے۔
evidence:
- kind: passage
  id: passage/muwatta-1-001
  caption:
    ar: نص أول حديث في الموطأ بسند مالك.
    en: The text of the Muwatta's first hadith with Malik's isnad.
    ur: موطا کے پہلے حدیث کا متن مالک کی سند کے ساتھ۔
- kind: chronicle
  id: person/malik-ibn-anas
  caption:
    ar: مالك بن أنس (ت. ١٧٩ هـ) مؤلف الموطأ.
    en: Malik ibn Anas (d. 179 AH), author of the Muwatta.
    ur: مالک بن انس (وفات ۱۷۹ ہجری)، موطا کے مصنف۔
- kind: object
  id: place/medina
  caption:
    ar: المدينة — بيئة تأليف الموطأ.
    en: Medina — the Muwatta's place of compilation.
    ur: مدینہ — موطا کی تالیف کا ماحول۔
historians:
  ar: يؤرخ الباحثون للموطأ بالقرن الثاني الهجري؛ يقارنونه بالصحيحين المتأخرين.
  en: Researchers date the Muwatta to the second Hijri century, comparing it with the later Sahihs.
  ur: محققین موطا کو دوسری صدی ہجری میں مورخ کرتے ہیں اور بعد کی صحیحین سے موازنہ کرتے ہیں۔
