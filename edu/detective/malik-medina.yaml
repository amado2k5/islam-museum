id: malik-medina
band: scholars
claim:
  ar: اعتمد الإمام مالك على عمل أهل المدينة ونقلها الأصحاب من الصحابة.
  en: Imam Malik relied on the practice of Medina, transmitted by the Companions' own students.
  ur: امام مالک نے مدینہ والوں کے عمل پر اعتماد کیا جو اصحاب کے شاگردوں نے منتقل کیا۔
evidence:
- kind: passage
  id: passage/muwatta-1-001
  caption:
    ar: أول حديث في الموطأ — يسرده مالك بإسناده.
    en: The first hadith of the Muwatta — Malik narrates it with his isnad.
    ur: موطا کا پہلا حدیث — مالک اپنی سند کے ساتھ بیان کرتے ہیں۔
- kind: chronicle
  id: person/malik-ibn-anas
  caption:
    ar: مالك بن أنس شيخ دار الهجرة — أقام في المدينة وأخذ عن التابعين.
    en: Malik ibn Anas, shaykh of Medina — he lived in Medina and took from the Successors.
    ur: مالک بن انس، مدینہ کے شیخ — مدینہ میں رہے اور تابعین سے لیا۔
- kind: object
  id: place/medina
  caption:
    ar: المدينة النبوية — حاضرة الفقه الأولى حيث استقر الفقه النبوي.
    en: The Prophet's city — the first home of fiqh where the prophetic practice settled.
    ur: مدینۃ النبی — فقہ کا پہلا مرکز جہاں نبوی عمل مستقر ہوا۔
historians:
  ar: يرى الباحثون أن «عمل أهل المدينة» حجة عند مالك؛ أسلوب فقهي ميز مدرسته.
  en: Researchers hold that the 'practice of Medina' is a proof for Malik — a distinct method of his school.
  ur: محققین کا خیال ہے کہ 'عمل اہل مدینہ' مالک کے نزدیک حجت ہے — ان کے مکتب کی مخصوص روش۔
