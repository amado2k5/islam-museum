id: fatima-waqf
band: researchers
claim:
  ar: أسست فاطمة الفهرية أقدم جامعة قائمة بالوقف.
  en: Fatima al-Fihri founded the oldest standing university through a waqf.
  ur: فاطمہ الفہری نے وقف کے ذریعے قدیم ترین قائم جامعہ قائم کیا۔
  fr: Grâce à un waqf, une fondation pieuse, Fatima al-Fihri a fondé la plus ancienne université encore en activité.
  tr: Fatima Al-Fihri, bağışlarla kurulan en eski üniversiteyi kurdu.
  id: Fatima Al-Fihri mendirikan universitas tertua yang didirikan melalui dana abadi.
