id: fatima-waqf
band: researchers
claim:
  ar: أسست فاطمة الفهرية أقدم جامعة قائمة بالوقف.
  en: Fatima al-Fihri founded the oldest standing university through a waqf.
  ur: فاطمہ الفہری نے وقف کے ذریعے قدیم ترین قائم جامعہ قائم کیا۔
evidence:
- kind: passage
  id: passage/muwatta-1-057
  caption:
    ar: حديث موطأ بسند.
    en: A Muwatta hadith with isnad.
    ur: موطا کا حدیث اپنی سند کے ساتھ۔
- kind: chronicle
  id: person/fatima-al-fihri
  caption:
    ar: فاطمة الفهرية — مؤسسة جامع القرويين في فاس.
    en: Fatima al-Fihri — founder of the Qarawiyyin mosque-college in Fez.
    ur: فاطمہ الفہری — فاس میں قرویین مسجد-کالج کی بانی۔
- kind: object
  id: place/timbuktu
  caption:
    ar: تمبكتو كمقارن — مركز علم أفريقي آخر يوضح شبكة العلم.
    en: Timbuktu as comparison — another African centre showing the learning network.
    ur: ٹمبکٹو بطور تقابل — علم کے جال کو دکھانے والا ایک اور افریقی مرکز۔
historians:
  ar: تذكر كتب الأوقاف والسير تأسيسها بالوقف؛ يثبت الباحثون القرويين أقدم جامعة مستمرة.
  en: Waqf and biographical works record her founding; researchers certify al-Qarawiyyin as the oldest continuously operating university.
  ur: وقف اور سیر کی کتابیں ان کی تاسیس درج کرتی ہیں؛ محققین قرویین کو قدیم ترین مسلسل جامعہ قرار دیتے ہیں۔
