  caption:
    ar: ملاحظة من كتاب المغرب عن فاس وجامعتها القرويين التي أسستها فاطمة الفهرية، مختصرة بأمانة.
    en: A note from the Book of the West on Fez and its Qarawiyyin mosque that Fatima al-Fihri founded, faithfully cond'en'sed.
    ur: کتاب المغرب کا ایک مشاہدہ فاس اور اس کی قرویین مسجد کے بارے میں جسے فاطمہ فہری نے قائم کیا، دیانت سے مختصر۔
    fr: Un résumé fidèle d’une note du Livre de l’Occident sur Fès et sa mosquée al-Qarawiyyin, fondée par Fatima al-Fihri.
    tr: Fatima Al-Fihri tarafından kurulan Fez ve Karawiyyin Üniversitesi hakkında Al-Maghrib kitabından bir not, sadakatle kısaltılmıştır.
    id: Sebuah catatan dari buku Al-Maghrib tentang Fez dan Universitas Qarawiyyin yang didirikan oleh Fatima Al-Fihri, diringkas dengan setia.
- kind: object
  id: place/timbuktu
  caption:
    ar: تمبكتو كمقارن — مركز علم أفريقي آخر يوضح شبكة العلم.
    en: Timbuktu as comparison — another African c'en'tre showing the learning network.
    ur: ٹمبکٹو بطور تقابل — علم کے جال کو دکھانے والا ایک اور افریقی مرکز۔
    fr: À titre de comparaison, Tombouctou est un autre foyer de savoir africain qui illustre ce réseau savant.
    tr: Timbuktu karşılaştırma olarak — bilim ağını gösteren bir başka Afrika bilim merkezi.
    id: Timbuktu sebagai perbandingan — pusat sains Afrika lain yang menggambarkan jaringan sains.
historians:
  ar: تذكر كتب الأوقاف والسير تأسيسها بالوقف؛ يثبت الباحثون القرويين أقدم جامعة مستمرة.
  en: Waqf and biographical works record her founding; researchers certify al-Qarawiyyin as the oldest continuously operating university.
  ur: وقف اور سیر کی کتابیں ان کی تاسیس درج کرتی ہیں؛ محققین قرویین کو قدیم ترین مسلسل جامعہ قرار دیتے ہیں۔
  fr: Les ouvrages sur les waqfs et les récits biographiques mentionnent sa fondation. Les chercheurs présentent al-Qarawiyyin comme la plus ancienne université à avoir fonctionné sans interruption.
  tr: Vakıf kitapları ve biyografiler, kuruluşlarını vakıf olarak belirtir; kırsal araştırmacılar en eski kesintisiz üniversite olduğunu kanıtlamaktadır.
  id: Buku dan biografi endowment menyebutkan pendiriannya sebagai endowment; peneliti pedesaan terbukti sebagai universitas tertua yang berkelanjutan.
