packs:
- id: heritage-month
  title:
    ar: حِزمة شهر التراث الإسلامي
    en: Islamic Heritage Month pack
    ur: اسلامی ورثہ ماہ کا پیک
    fr: Dossier du Mois du patrimoine islamique
    tr: İslami Miras Ayı Paketi
    id: Paket Bulan Warisan Islam
  when:
    ar: 'شهر التراث الإسلامي في أونتاريو: أكتوبر من كل عام.'
    en: 'Islamic Heritage Month in Ontario: every October.'
    ur: 'انٹاریو میں اسلامی ورثہ ماہ: ہر سال اکتوبر۔'
    fr: 'Le Mois du patrimoine islamique en Ontario : chaque mois d’octobre.'
    tr: 'Ontario''da İslami Miras Ayı: Her yıl Ekim ayında.'
    id: 'Bulan Warisan Islam di Ontario: Oktober setiap tahun.'
  lede:
    ar: 'حقائق يومية، درب كامل قابل للطباعة، جواز المتحف وتحدّي اليوم: حقيبة الصف لشهر التراث.'
    en: 'A daily fact, a full printable pathway, the museum passport and the daily challenge: the classroom kit for Heritage Month.'
    ur: 'روز ایک حقیقت، مکمل چھپنے والا راستہ، میوزیم پاسپورٹ اور روزانہ چیلنج: ورثہ ماہ کے لیے کلاس کا سامان۔'
    fr: 'Un fait quotidien, un parcours complet à imprimer, le passeport du musée et le défi quotidien : le dossier de classe pour le Mois du patrimoine.'
    tr: 'Günlük bilgiler, yazdırılabilir tam bir yürüyüş yolu, müze pasaportu ve bugünün meydan okuması: Miras Ayı ders çantası.'
    id: 'Fakta harian, jejak lengkap yang dapat dicetak, paspor museum, dan tantangan hari ini: tas kelas Bulan Warisan.'
  kit:
  - title:
      ar: ملصق حقيقة الأسبوع
      en: Fact-of-the-week poster
      ur: ہفتے کی حقیقت کا پوسٹر
      fr: Affiche du fait de la semaine
      tr: Haftanın Gerçeği Afişi
      id: Poster Fakta Minggu Ini
    href: /learn/facts/poster/
    sheets: 1
  - title:
      ar: 'دروب المنهج: صفقة الطباعة (صعود الإسلام)'
      en: Curriculum pathway print pack (Rise of Islam)
      ur: نصابی راستے کا چھپائی پیک (اسلام کا عروج)
      fr: 'Dossier de parcours pédagogique à imprimer : l’essor de l’islam'
      tr: 'Metodoloji Yolları: Baskı Anlaşması (İslam''ın Yükselişi)'
      id: 'Jalur Metodologi: Kesepakatan Percetakan (Kebangkitan Islam)'
    href: /learn/teachers/pathways/g11-chw3m-rise-of-islam/print/
    sheets: 4
  - title:
      ar: جواز المتحف
      en: Museum passport
      ur: میوزیم پاسپورٹ
      fr: Passeport du musée
      tr: Müze Pasaportu
      id: Paspor Museum
    href: /learn/passport/
    sheets: 1
  - title:
      ar: تحدّي اليوم (أسبوع من الأسئلة)
      en: Daily challenge (a week of rounds)
      ur: روزانہ چیلنج (ایک ہفتے کے سوالات)
      fr: 'Défi quotidien : une semaine de manches'
      tr: Bugünün Meydan Okuması (Sorular Haftası)
      id: Tantangan Hari Ini (Minggu Pertanyaan)
    href: /learn/daily/
    sheets: 1
  - title:
      ar: أخبرها بكلماتك
      en: Tell it back prompts
      ur: اپنے الفاظ میں سنانے کی مشق
      fr: Questions pour raconter ses découvertes
      tr: Kendi kelimelerinle söyle
      id: Katakan padanya dengan kata-katamu sendiri
    href: /sighar/retell/
    sheets: 1
- id: ramadan
  title:
    ar: حِزمة رمضان
    en: Ramadan pack
    ur: رمضان کا پیک
    fr: Dossier Ramadan
    tr: Ramazan Paketi
    id: Paket Ramadan
  when:
    ar: 'رمضان 1448هـ: يتوقع تقويم أم القرى أن يبدأ نحو 8 فبراير 2027م، ويبقى بدؤه موقوفًا على رؤية الهلال.'
    en: 'Ramadan 1448: the Umm al-Qura calendar expects it to begin about 8 February 2027; the actual start still depends on the moon sighting.'
    ur: 'رمضان 1448ھ: ام‌القری تقویم کے مطابق متوقع آغاز تقریباً 8 فروری 2027ء؛ اصل آغاز ہلال دیکھنے پر موقوف ہے۔'
    fr: 'Ramadan 1448 : le calendrier d’Oumm al-Qoura prévoit un début vers le 8 février 2027 ; la date effective dépend toujours de l’observation de la lune.'
    tr: 'Ramazan 1448 H: Ümmü Kur''a takviminin yaklaşık 8 Şubat 2027''de başlaması bekleniyor ve hilal görüldüğünde başlangıcı askıya alınacak.'
    id: 'Ramadan 1448 H: Kalender um al-Qura diperkirakan akan dimulai sekitar 8 Februari 2027, dan awalnya akan tetap ditangguhkan saat bulan sabit dilihat.'
  lede:
    ar: 'جدول الأعمال الخيرية، ملصق الحقائق، صحائف العائلة الأسبوعية ودرب قابل للطباعة: حِزمة الصف لرمضان.'
    en: 'The kindness chart, the fact poster, the family weekly sheets and a printable pathway: the classroom kit for Ramadan.'
    ur: 'نیکی کا چارٹ، حقائق کا پوسٹر، خاندانی ہفتہ وار ورقیں اور چھپنے والا راستہ: رمضان کے لیے کلاس کا سامان۔'
    fr: 'Le tableau de la gentillesse, l’affiche du fait, les fiches familiales hebdomadaires et un parcours à imprimer : le dossier de classe pour Ramadan.'
    tr: 'Hayır kurumu gündemi, bilgi afişi, haftalık aile sayfaları ve yazdırılabilir yol: Ramazan sınıf paketi.'
    id: 'Agenda amal, poster fakta, lembar keluarga mingguan, dan jejak cetak: paket kelas Ramadan.'
  kit:
  - title:
      ar: ملصق حقيقة الأسبوع
      en: Fact-of-the-week poster
      ur: ہفتے کی حقیقت کا پوسٹر
      fr: Affiche du fait de la semaine
      tr: Haftanın Gerçeği Afişi
      id: Poster Fakta Minggu Ini
    href: /learn/facts/poster/
    sheets: 1
  - title:
      ar: جدول الكرم ثلاثين يوماً
      en: Kindness Quest 30-day chart
      ur: نیکی کی 30 روزہ چارٹ
      fr: Tableau de trente jours de la Quête de la gentillesse
      tr: Otuz günlük cömertlik programı
      id: Jadwal kemurahan hati selama tiga puluh hari
    href: /sighar/kindness/
    sheets: 1
  - title:
      ar: 'دروب المنهج: صفقة الطباعة'
      en: Curriculum pathway print pack
      ur: نصابی راستے کا چھپائی پیک
      fr: Dossier de parcours pédagogique à imprimer
      tr: 'Metodoloji Yolları: Baskı Anlaşması'
      id: 'Jalur Metodologi: Kesepakatan Pencetakan'
    href: /learn/teachers/pathways/g11-chw3m-rise-of-islam/print/
    sheets: 4
  - title:
      ar: الصحيفة الأسبوعية للعائلة
      en: Family weekly sheet
      ur: خاندانی ہفتہ وار ورق
      fr: Fiche familiale hebdomadaire
      tr: Ailenin haftalık gazetesi
      id: Surat kabar mingguan keluarga
    href: /learn/parents/weekly/
    sheets: 2
  - title:
      ar: تحدّي اليوم
      en: Daily challenge
      ur: روزانہ چیلنج
      fr: Défi quotidien
      tr: Bugünün Meydan Okuması
      id: Tantangan Hari Ini
    href: /learn/daily/
    sheets: 1
- id: back-to-school
  title:
    ar: حِزمة العودة إلى المدرسة
    en: Back-to-school pack
    ur: اسکول واپسی کا پیک
    fr: Dossier de rentrée
    tr: Okula Dönüş Paketi
    id: Paket Kembali ke Sekolah
  when:
    ar: الأسبوع الأول من سبتمبر.
    en: The first week of September.
    ur: ستمبر کا پہلا ہفتہ۔
    fr: La première semaine de septembre.
    tr: Eylül'ün ilk haftası.
    id: Minggu pertama September.
  lede:
    ar: ابدأ السنة بجواز متحفٍ لكل تلميذ، ملصقٍ للحقائق، دربٍ للصف وبطاقاتٍ للقص والدراسة.
    en: Start the year with a passport for every pupil, a fact poster, a pathway for the class and cards to cut out and study.
    ur: سال کا آغاز ہر شاگرد کے پاسپورٹ، حقائق کے پوسٹر، کلاس کے راستے اور کاٹنے اور پڑھنے کے کارڈ سے کریں۔
    fr: Commencez l’année avec un passeport par élève, une affiche, un parcours pour la classe et des cartes à découper et à étudier.
    tr: Yıla her öğrenci için bir müze pasaportu, bir bilgi çıkartması, bir ders yolu ve kesme ile çalışma kartlarıyla başlayın.
    id: Mulailah tahun dengan paspor museum untuk setiap siswa, stiker fakta, jalur kelas, dan kartu untuk memotong serta belajar.
