- id: exam-season
  title:
    ar: حِزمة موسم الامتحانات
    en: Exam-season pack
    ur: امتحانوں کے موسم کا پیک
    fr: Dossier de révision des examens
    tr: Sınav Sezonu Paketi
    id: Paket Musim Ujian
  when:
    ar: مايو–يونيو.
    en: May–June.
    ur: مئی تا جون۔
    fr: Mai–juin.
    tr: Mayıs–Haziran.
    id: Mei–Juni.
  lede:
    ar: 'أنماط الدراسة التي تُصحَّح ذاتيًا، أوراق عمل الدروب، تحدّي اليوم وملصق الحقائق: مراجعة الصف قبل الامتحان.'
    en: 'Self-marking study modes, pathway worksheets, the daily challenge and the fact poster: the class''s revision kit before exams.'
    ur: 'خود جانچنے والے مطالعہ طریقے، راستوں کی ورک شیٹیں، روزانہ چیلنج اور حقائق کا پوسٹر: امتحان سے پہلے کلاس کی دہرائی کا سامان۔'
    fr: 'Modes d’étude autocorrigés, fiches de parcours, défi quotidien et affiche : le dossier de révision de la classe avant les examens.'
    tr: 'Kendini düzelten çalışma stilleri, ders çalışma sayfaları, bugünün meydan okuması ve gerçek etiketi: Sınavdan önce sınıf tekrarı.'
    id: 'Gaya belajar yang mengoreksi diri sendiri, lembar kerja mata kuliah, tantangan hari ini, dan stiker fakta: Tinjauan kelas sebelum ujian.'
  kit:
  - title:
