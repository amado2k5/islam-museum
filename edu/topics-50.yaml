        en: for charity, not sale
        ur: فروخت کے لیے نہیں، صدقہ کے لیے
    - text:
        ar: تخزين الحبوب
        en: storing grain
        ur: اناج ذخیرہ کرنا
      correct: false
      why:
        ar: ليس مخزنًا بل مطبخًا
        en: a kitchen, not a store
        ur: گودام نہیں، باورچی خانہ
  - q:
      ar: لماذا تُعدّ تحفة عثمانية؟
      en: Why is it an Ottoman masterpiece?
      ur: یہ عثمانی شاہکار کیوں ہے؟
    options:
    - text:
        ar: لتوازنها وخدماتها
        en: for its balance and services
        ur: توازن اور خدمات کے لیے
      correct: true
      why:
