- id: hajj-network
  anchor: exhibit/pathway-g6-social-studies-hajj-network
  band: scholars
  title:
    ar: شبكة الحج
    en: The Hajj Network
    ur: حج کا جال
  sixty:
    ar: 'شبكة الحج: أعظم هجرة سنوية في التاريخ — ملايين يجتمعون في مكة كلّ سنة من كلّ قارة ولغة. يلبس الحاجّ الإحرام الأبيض فيعرف الغني والفقير سواء، ويطوف بالكعبة سبعًا، ويسعى بين الصفا والمروة، ويقف في عرفة اليوم الأعظم، ويرمي الجمرات في منى ويضحّي في العيد. ومن طرق الحج نشأت حضارة: قوافل الشام والعراق ومصر واليمن تحمل العلماء والتجار والكتب، وعلى طريق منصور موسى إلى مكة تبادل الذهب والعلم بين تمبكتو والقاهرة. والحجّ يعلّم الدرس الكبير: أن المسلمين ليسوا أممًا متفرّقة بل أمة واحدة تلتقي في مكان واحد كلّ سنة.  وهكذا يبقى الحجّ بعد أربعة عشر قرنًا: نفس المكان، ونفس الكلمات، ونفس الاتجاه — أقدم اجتماع سنوي مستمر على وجه الأرض.  وفي كلّ سنة تعود الكعبة مركز العالم أربعة أيام: فالمليار ونصف ينظرون إليها في صلاتهم، والملايين يقفون في عرفتها.'
    en: 'The Hajj network: history''s greatest yearly migration — millions gathering in Mecca every year from every continent and tongue. The pilgrim wears the white ihram so rich and poor look alike, circles the Kaaba seven times, walks between Safa and Marwa, stands at Arafah on the greatest day, stones the jamarat at Mina and sacrifices on the Eid. From the Hajj routes a civilisation grew: the caravans of Syria, Iraq, Egypt and Yemen carrying scholars, traders and books, and on Mansa Musa''s road to Mecca gold and knowledge were traded between Timbuktu and Cairo. The Hajj teaches the great lesson: Muslims are not scattered nations but one ummah meeting in one place every year.  So the Hajj stays after fourteen centuries: same place, same words, same direction — the oldest continuous yearly gathering on earth.'
    ur: 'حج کا جال: تاریخ کی عظیم ترین سالانہ ہجرت — ہر براعظم اور زبان سے لاکھوں لوگ ہر سال مکہ میں جمع۔ حاجی سفید احرام پہنتا ہے تو امیر اور غریب ایک جیسے لگتے ہیں، کعبہ کے سات چکر لگاتا ہے، صفا اور مروہ کے درمیان سعی کرتا ہے، عظیم ترین دن عرفہ میں کھڑا ہوتا ہے، منیٰ میں جمرات کو کنکریاں مارتا اور عید پر قربانی دیتا ہے۔ حج کے راستوں سے ایک تہذیب پھوٹی: شام، عراق، مصر اور یمن کے قافلے علماء، سوداگر اور کتابیں لے جاتے، اور منسا موسیٰ کے مکہ کے راستے پر تمبکتو اور قاہرہ کے درمیان سونا اور علم تبادلہ ہوا۔ حج عظیم سبق سکھاتا ہے: مسلمان بکھری قومیں نہیں بلکہ ایک امت ہے جو ہر سال ایک جگہ ملتی ہے۔  اسی طرح حج چودہ صدیوں بعد بھی قائم ہے: وہی جگہ، وہی الفاظ، وہی سمت — زمین پر قدیم ترین مسلسل سالانہ اجتماع۔'
  glossary:
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الركن الخامس في الإسلام'
      en: 'the fifth pillar in Islam'
      ur: 'اسلام کا پانچواں رکن'
  - term:
