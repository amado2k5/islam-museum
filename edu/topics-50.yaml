        en: for unifying, not ease
        ur: آسانی نہیں، یکسانی کے لیے
    - text:
        ar: لأنه صامت
        en: for being silent
        ur: خاموش ہونے کے لیے
      correct: false
      why:
        ar: ليس لصمته بل لرسالته
        en: for its message, not silence
        ur: خاموشی نہیں، پیغام کے لیے
- id: life-of-the-prophet
  anchor: exhibit/pathway-g11-hrt3m-life-of-the-prophet
  band: scholars
  title:
    ar: سيرة النبي محمد
    en: The Life of the Prophet Muhammad
    ur: سیرتِ نبی محمد
  sixty:
    ar: وُلد محمد في مكة يتيمًا نحو عام ٥٧٠، واشتهر بالصدق حتى دُعي «الأمين». في الأربعين نزل عليه الوحي في غار حراء، فدعا إلى الله ثلاثة عشر عامًا تحت الأذى، ثم
      هاجر إلى المدينة فأسّس جماعة ودولة. واستعاد مكة سلمًا وعفا عند المقدرة، وخطب وداعًا قبل أن يتوفى عام ٦٣٢ تاركًا أمّة تعدّه أسوة لكل مسلم.
    en: Muhammad was born an orphan in Mecca about 570, famed for honesty — people called him 'the Trustworthy'. At forty revelation came to him in the cave of Hira;
      he called people to God for thirteen years under persecution, then migrated to Medina and founded a community and a state. He regained Mecca peacefully, pardoning
      when he had power, and gave a farewell sermon before passing in 632, leaving a community that takes him as the model for every Muslim.
    ur: محمد تقریباً 570 میں مکہ میں یتیم پیدا ہوئے اور دیانت میں مشہور ہوئے یہاں تک کہ «امین» کہلائے۔ چالیس برس کی عمر میں غار حرا میں وحی آئی؛ انہوں نے تیرہ برس
      اذیت سہتے ہوئے اللہ کی دعوت دی، پھر مدینہ ہجرت کی اور برادری اور ریاست بنائی۔ انہوں نے مکہ امن سے واپس لیا اور قدرت پر عفو کیا اور 632 میں وفات سے پہلے خطبہ
      وداع دیا، ایسی امت چھوڑی جو انہیں ہر مسلمان کا نمونہ مانتی ہے۔
  glossary:
  - term:
      ar: الأمين
      en: the Trustworthy
      ur: امین
    gloss:
      ar: لقبه قبل النبوة لصدقه
      en: his pre-prophethood name for honesty
      ur: نبوت سے پہلے دیانت کا لقب
  - term:
      ar: غار حراء
      en: the cave of Hira
      ur: غار حرا
    gloss:
      ar: الكهف الذي نزل فيه الوحي
      en: the cave where revelation came
      ur: وہ غار جہاں وحی آئی
  - term:
      ar: الوحي
      en: revelation
      ur: وحی
    gloss:
      ar: كلام الله المنزل عليه
      en: God's word sent down to him
      ur: اللہ کا کلام جو اس پر نازل ہوا
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: انتقاله إلى المدينة ٦٢٢
      en: his move to Medina in 622
      ur: 622 میں اس کی مدینہ منتقلی
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: اسم المدينة قبله
      en: Medina's name before him
      ur: اس سے پہلے مدینہ کا نام
  - term:
      ar: بدر
      en: Badr
      ur: بدر
    gloss:
      ar: أول انتصار كبير ٦٢٤
      en: the first great victory, 624
      ur: پہلی بڑی فتح، 624
  - term:
      ar: صلح الحديبية
      en: the Hudaybiyyah peace
      ur: صلح حدیبیہ
    gloss:
      ar: هدنة فتحت الطريق إلى مكة
      en: the truce that opened the way to Mecca
      ur: وہ صلح جس نے مکہ کا راستہ کھولا
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: استعادة مكة بعفو ٦٣٠
      en: Mecca's pardoning regain in 630
      ur: 630 میں مکہ کی معافی والی واپسی
  - term:
      ar: خطب الوداع
      en: the farewell sermon
      ur: خطبہ وداع
    gloss:
      ar: خطابه الأخير في عرفة
      en: his last address at Arafah
      ur: عرفہ میں آخری خطبہ
  - term:
      ar: السيرة
      en: the sira (biography)
      ur: سیرت
    gloss:
      ar: قصة حياته المدونة
      en: the written story of his life
      ur: اس کی زندگی کی لکھی ہوئی کہانی
  - term:
      ar: الأسوة
      en: the model
      ur: نمونہ
    gloss:
      ar: مثله التي يتبعها المسلمون
      en: the example Muslims follow
      ur: وہ نمونہ جسے مسلمان پیروتے ہیں
  - term:
      ar: ٦٣٢
      en: '632'
      ur: 632ء
    gloss:
      ar: عام وفاته في المدينة
      en: the year he passed in Medina
      ur: مدینہ میں وفات کا سال
  practice:
  - q:
      ar: أين وُلد؟
      en: Where was he born?
      ur: وہ کہاں پیدا ہوئے؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: ولد في مكة نحو عام ٥٧٠
        en: born in Mecca about 570
        ur: تقریباً 570 میں مکہ میں پیدا ہوئے
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة وجهة الهجرة لا المولد
        en: Medina was the Hijra's destination
        ur: مدینہ ہجرت کی منزل تھی، پیدائش نہیں
    - text:
        ar: الطائف
        en: Taif
        ur: طائف
      correct: false
      why:
        ar: الطائف مدينة قريبة لا مولده
        en: Taif was nearby, not his birth
        ur: طائف قریب تھا، پیدائش نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس ليست مولده
        en: Jerusalem was not his birth
        ur: یروشلم پیدائش نہیں
  - q:
      ar: ما لقبه قبل النبوة؟
      en: His name before prophethood?
      ur: نبوت سے پہلے اس کا لقب؟
    options:
    - text:
        ar: الأمين
        en: the Trustworthy
        ur: امین
      correct: true
      why:
        ar: لقّب بالأمين لصدقه
        en: named 'the Trustworthy' for honesty
        ur: دیانت کے لیے «امین» کہلائے
    - text:
        ar: الخليفة
        en: the Caliph
        ur: خلیفہ
      correct: false
      why:
        ar: ليس خليفة قبل النبوة
        en: not 'caliph' before prophethood
        ur: نبوت سے پہلے خلیفہ نہیں
    - text:
        ar: السلطان
        en: the Sultan
        ur: سلطان
      correct: false
      why:
        ar: ليس سلطانًا بل أمينًا
        en: '''Trustworthy'', not sultan'
        ur: سلطان نہیں، امین
    - text:
        ar: الفاتح
        en: the Conqueror
        ur: فاتح
      correct: false
      why:
        ar: ليس فاتحًا قبل النبوة
        en: not 'Conqueror' before prophethood
        ur: نبوت سے پہلے فاتح نہیں
  - q:
      ar: أين نزل الوحي أول مرة؟
      en: Where did revelation first come?
      ur: وحی پہلی بار کہاں آئی؟
    options:
    - text:
        ar: غار حراء
        en: the cave of Hira
        ur: غار حرا
      correct: true
      why:
        ar: في غار حراء نزل أول الوحي
        en: in the cave of Hira the first revelation came
        ur: غار حرا میں پہلی وحی آئی
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة ليست موضع أول وحي
        en: the Kaaba was not where it first came
        ur: کعبہ پہلی وحی کی جگہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة بعده بسنوات
        en: Medina came years later
        ur: مدینہ برسوں بعد آئی
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس ليست موضعه
        en: Jerusalem was not the place
        ur: یروشلم جگہ نہیں
  - q:
      ar: كم دعا في مكة؟
      en: How long did he call in Mecca?
      ur: مکہ میں کتنے عرصے دعوت دی؟
    options:
    - text:
        ar: ثلاثة عشر عامًا
        en: thirteen years
        ur: تیرہ سال
      correct: true
      why:
        ar: ثلاثة عشر عامًا قبل الهجرة
        en: thirteen years before the Hijra
        ur: ہجرت سے پہلے تیرہ سال
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام مدة المدينة
        en: ten years was the Medina era
        ur: دس سال مدینہ کا عرصہ تھا
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة مدة السرية فقط
        en: three was the secret phase
        ur: تین صرف پوشیدہ مرحلہ تھا
    - text:
        ar: عشرون
        en: twenty
        ur: بیس
      correct: false
      why:
        ar: ثلاثة وعشرون مجموع الدعوة
        en: twenty-three was the whole mission
        ur: تئیس کل دعوت تھی
  - q:
      ar: ماذا أسّس في المدينة؟
      en: What did he found in Medina?
      ur: مدینہ میں اس نے کیا قائم کیا؟
    options:
    - text:
        ar: جماعة ودولة
        en: a community and a state
        ur: برادری اور ریاست
      correct: true
      why:
        ar: أسّس أمّة ودولة فيها
        en: he founded a community and state there
        ur: اس نے وہاں امت اور ریاست بنائی
    - text:
        ar: مدرسة فقط
        en: only a school
        ur: صرف مدرسہ
      correct: false
      why:
        ar: ليست مدرسة بل دولة
        en: a state, not just a school
        ur: صرف مدرسہ نہیں، ریاست
    - text:
        ar: سوقًا
        en: a market
        ur: بازار
      correct: false
      why:
        ar: ليست سوقًا بل دولة
        en: a state, not a market
        ur: بازار نہیں، ریاست
    - text:
        ar: جيشًا فقط
        en: only an army
        ur: صرف لشکر
      correct: false
      why:
        ar: ليست جيشًا بل جماعة
        en: a community, not just an army
        ur: صرف لشکر نہیں، برادری
  - q:
      ar: كيف دخل مكة؟
      en: How did he enter Mecca?
      ur: وہ مکہ میں کیسے داخل ہوا؟
    options:
    - text:
        ar: سلمًا بعفو
        en: peacefully, pardoning
        ur: امن سے، معاف کرتے ہوئے
      correct: true
      why:
        ar: دخلها بعفو عام ٦٣٠
        en: he entered pardoning in 630
        ur: اس نے 630 میں معافی کے ساتھ داخل کیا
    - text:
        ar: بانتقام
        en: with revenge
        ur: انتقام سے
      correct: false
      why:
        ar: لم ينتقم بل عفا
        en: he pardoned, not avenged
        ur: اس نے انتقام نہیں لیا، معاف کیا
    - text:
        ar: بمعركة طويلة
        en: after a long battle
        ur: طویل لڑائی کے بعد
      correct: false
      why:
        ar: لم يقاتل بل دخل بسلام
        en: he entered in peace, not battle
        ur: اس نے لڑائی نہیں کی، امن سے داخل ہوا
    - text:
        ar: لم يدخلها
        en: he never entered
        ur: کبھی داخل نہیں ہوا
      correct: false
      why:
        ar: دخلها عام ٦٣٠
        en: he entered in 630
        ur: وہ 630 میں داخل ہوا
  - q:
      ar: ما «صلح الحديبية»؟
      en: What was Hudaybiyyah?
      ur: حدیبیہ کی صلح کیا تھی؟
    options:
    - text:
        ar: هدنة فتحت الطريق
        en: a truce opening the way
        ur: راستہ کھولنے والی صلح
      correct: true
      why:
        ar: هدنة مهّدت فتح مكة
        en: a truce that paved Mecca's opening
        ur: وہ صلح جس نے مکہ کا راستہ بنایا
    - text:
        ar: معركة كبرى
        en: a great battle
        ur: بڑی لڑائی
      correct: false
      why:
        ar: ليست معركة بل صلحًا
        en: a truce, not a battle
        ur: لڑائی نہیں، صلح
    - text:
        ar: معاهدة بيع
        en: a sale treaty
        ur: بیع کا معاہدہ
      correct: false
      why:
        ar: ليست بيعًا بل هدنة
        en: a truce, not a sale
        ur: بیع نہیں، صلح
    - text:
        ar: حلف تجارة
        en: a trade pact
        ur: تجارتی معاہدہ
      correct: false
      why:
        ar: ليست تجارة بل هدنة
        en: a truce, not trade
        ur: تجارت نہیں، صلح
  - q:
      ar: أين خطب وداعًا؟
      en: Where was the farewell sermon?
      ur: خطبہ وداع کہاں دیا؟
    options:
    - text:
        ar: عرفة
        en: at Arafah
        ur: عرفہ میں
      correct: true
      why:
        ar: في عرفة خطب الوداع
        en: at Arafah he gave the farewell sermon
        ur: عرفہ میں اس نے خطبہ وداع دیا
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة ليست موضع الخطبة
        en: the Kaaba was not the sermon site
        ur: کعبہ خطبے کی جگہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة ليست موضع الوداع
        en: Medina was not the farewell place
        ur: مدینہ وداع کی جگہ نہیں
    - text:
        ar: منى
        en: Mina
        ur: منیٰ
      correct: false
      why:
        ar: منى قريبة لكنها عرفة
        en: Mina is near but it was Arafah
        ur: منیٰ قریب ہے مگر عرفہ تھا
  - q:
      ar: متى توفي؟
      en: When did he pass?
      ur: اس کی وفات کب ہوئی؟
    options:
    - text:
        ar: عام ٦٣٢
        en: in 632
        ur: 632 میں
      correct: true
      why:
        ar: توفي في المدينة عام ٦٣٢
        en: he passed in Medina in 632
        ur: وہ 632 میں مدینہ میں فوت ہوئے
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ٦٣٠ عام الفتح لا الوفاة
        en: 630 is the conquest year
        ur: 630 فتح کا سال ہے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة لا الوفاة
        en: 622 is the Hijra year
        ur: 622 ہجرت کا سال ہے
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ٦١٠ عام الوحي لا الوفاة
        en: 610 is the revelation year
        ur: 610 وحی کا سال ہے
  - q:
      ar: ماذا ترك للمسلمين؟
      en: What did he leave Muslims?
      ur: اس نے مسلمانوں کے لیے کیا چھوڑا؟
    options:
    - text:
        ar: أسوة لكل مسلم
        en: a model for every Muslim
        ur: ہر مسلمان کا نمونہ
      correct: true
      why:
        ar: ترك سيرة تتبعها الأمة
        en: he left a life the umma follows
        ur: اس نے سیرت چھوڑی جسے امت پیروتی ہے
    - text:
        ar: مالًا كثيرًا
        en: much wealth
        ur: بہت دولت
      correct: false
      why:
        ar: لم يترك مالًا بل أسوة
        en: a model, not wealth
        ur: دولت نہیں، نمونہ
    - text:
        ar: جيشًا فقط
        en: only an army
        ur: صرف لشکر
      correct: false
      why:
        ar: ليست جيشًا بل أسوة
        en: a model, not an army
        ur: لشکر نہیں، نمونہ
    - text:
        ar: قصرًا
        en: a palace
        ur: محل
      correct: false
      why:
        ar: ليست قصرًا بل سيرة
        en: a life example, not a palace
        ur: محل نہیں، سیرت
- id: quran-as-a-text
  anchor: exhibit/pathway-g11-hrt3m-quran-as-a-text
  band: scholars
  title:
    ar: القرآن نصًّا
    en: The Qur'an as a Text
    ur: قرآن بطور متن
  sixty:
    ar: نزل القرآن على محمد في ثلاثة وعشرين عامًا شفهًا أولاً، فحفظه الصحابة وكتبوه على الرقاع والعظام والسعف. جمع أبو بكر نصه بعد اليمامة ووحّد عثمان المصاحف، فصار
      كتابًا واحدًا بلا اختلاف عبر القرون. واليوم يحفظه ملايين عن ظهر قلب — وهي ظاهرة نصية فريدة في تاريخ الكتب.
    en: The Qur'an came down to Muhammad over twenty-three years, orally first; the Companions memorised it and wrote it on parchments, bones and palm fronds. Abu
      Bakr gathered the text after Yamama and Uthman unified the codices, making it one book unchanged across the centuries. Today millions know it by heart — a textual
      phenomenon unique in the history of books.
    ur: قرآن تئیس برسوں میں محمد پر نازل ہوا، پہلے زبانی؛ صحابہ نے اسے یاد کیا اور چمڑے، ہڈیوں اور کھجور کے پتوں پر لکھا۔ ابو بکر نے یمامہ کے بعد متن جمع کیا اور
      عثمان نے مصحف یکساں کیے تو یہ صدیوں بھر ایک ہی کتاب بنا۔ آج لاکھوں اسے زبانی یاد رکھتے ہیں — کتابوں کی تاریخ میں ایک نایاب متنی مظہر۔
  glossary:
  - term:
      ar: الوحي
      en: revelation
      ur: وحی
    gloss:
      ar: نزول كلام الله على النبي
      en: God's word coming down to the Prophet
      ur: اللہ کا کلام نبی پر نازل ہونا
  - term:
      ar: السورة
      en: the sura
      ur: سورۃ
    gloss:
      ar: فصل القرآن من ١١٤
      en: one of the Qur'an's 114 chapters
      ur: قرآن کے 114 ابواب میں سے ایک
  - term:
      ar: الآية
      en: the aya
      ur: آیت
    gloss:
      ar: جملة القرآن المقروءة
      en: a recited verse of the Qur'an
      ur: قرآن کی تلاوت کی جانی والی آیت
  - term:
      ar: الحفظ
      en: memorisation
      ur: حفظ
    gloss:
      ar: حمل النص عن ظهر قلب
      en: carrying the text by heart
      ur: متن کا زبانی یاد ہونا
  - term:
      ar: المصحف
      en: the mushaf
      ur: مصحف
    gloss:
      ar: نسخة القرآن المكتوبة
      en: the written Qur'an copy
      ur: قرآن کی لکھی ہوئی نقل
  - term:
      ar: أبو بكر
      en: Abu Bakr
      ur: ابو بکر
    gloss:
      ar: أول خليفة جمع النص
      en: the first caliph to gather the text
      ur: پہلا خلیفہ جس نے متن جمع کیا
  - term:
      ar: عثمان
      en: Uthman
      ur: عثمان
    gloss:
      ar: الخليفة الذي وحّد المصاحف
      en: the caliph who unified the codices
      ur: وہ خلیفہ جس نے مصحف یکساں کیے
  - term:
      ar: زيد بن ثابت
      en: Zayd ibn Thabit
      ur: زید بن ثابت
    gloss:
      ar: الكاتب الذي دوّن النص
      en: the scribe who wrote the text down
      ur: وہ منشی جس نے متن لکھا
  - term:
      ar: اليمامة
      en: Yamama
      ur: یمامہ
    gloss:
      ar: المعركة التي أدت إلى الجمع
      en: the battle that led to the gathering
      ur: وہ لڑائی جس سے جمع ہوا
  - term:
      ar: الرقاع
      en: parchments
      ur: چمڑے
    gloss:
      ar: جلود كُتب عليها النص
      en: skins the text was written on
      ur: وہ کھالیں جن پر متن لکھا
  - term:
      ar: ثلاثة وعشرون
      en: twenty-three
      ur: تئیس
    gloss:
      ar: سنوات نزول القرآن
      en: the years of its descent
      ur: نزول کے سال
  - term:
      ar: الحفّاظ
      en: the huffaz
      ur: حفاظ
    gloss:
      ar: ملايين يحفظونه اليوم
      en: the millions who know it by heart today
      ur: لاکھوں جو آج اسے یاد رکھتے ہیں
  practice:
  - q:
      ar: كم استغرق نزوله؟
      en: How long did its descent take?
      ur: اس کا نزول کتنے عرصے میں ہوا؟
    options:
    - text:
        ar: ثلاثة وعشرون عامًا
        en: twenty-three years
        ur: تئیس سال
      correct: true
      why:
        ar: من ٦١٠ إلى ٦٣٢ ثلاثة وعشرون
        en: from 610 to 632, twenty-three years
        ur: 610 تا 632، تئیس سال
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة مدة السرية فقط
        en: three was only the secret phase
        ur: تین صرف پوشیدہ مرحلہ تھا
    - text:
        ar: أربعون عامًا
        en: forty years
        ur: چالیس سال
      correct: false
      why:
        ar: أربعون أكثر من عمر النزول
        en: forty exceeds the descent's span
        ur: چالیس نزول سے زیادہ ہے
    - text:
        ar: قرن
        en: a century
        ur: ایک صدی
      correct: false
      why:
        ar: قرن أكثر بكثير
        en: a century is far more
        ur: ایک صدی بہت زیادہ ہے
  - q:
      ar: كيف نزل أولاً؟
      en: How did it first come down?
      ur: یہ پہلے کیسے آیا؟
    options:
    - text:
        ar: شفهًا
        en: orally
        ur: زبانی
      correct: true
      why:
        ar: نزل تلاوة وكُتب وحُفظ
        en: it came as recitation, written and memorised
        ur: یہ تلاوت آیا، لکھا اور یاد کیا گیا
    - text:
        ar: كتابًا كاملاً
        en: as a full book
        ur: پوری کتاب
      correct: false
      why:
        ar: لم ينزل كتابًا بل تلاوة
        en: as recitation, not a whole book
        ur: پوری کتاب نہیں، تلاوت
    - text:
        ar: لوحًا حجريًا
        en: on stone tablets
        ur: پتھر کی تختیوں پر
      correct: false
      why:
        ar: ليست ألواحًا بل وحيًا
        en: revelation, not tablets
        ur: تختی نہیں، وحی
    - text:
        ar: مخطوطًا جاهزًا
        en: a ready codex
        ur: تیار مخطوط
      correct: false
      why:
        ar: لم يأتِ جاهزًا بل نزل شفهًا
        en: came orally, not ready-made
        ur: تیار نہیں آیا، زبانی آیا
  - q:
      ar: على ماذا كُتب؟
      en: On what was it written?
      ur: یہ کس پر لکھا گیا؟
    options:
    - text:
        ar: رقاع وعظام وسعف
        en: skins, bones, fronds
        ur: کھالیں، ہڈیاں، پتے
      correct: true
      why:
        ar: كتب على الرقاع والعظام والسعف
        en: written on parchments, bones and palm fronds
        ur: چمڑے، ہڈیوں اور کھجور کے پتوں پر لکھا
    - text:
        ar: ورق صيني فقط
        en: only Chinese paper
        ur: صرف چینی کاغذ
      correct: false
      why:
        ar: ليست ورقًا صينيًا
        en: not Chinese paper
        ur: چینی کاغذ نہیں
    - text:
        ar: لوحات ذهبية
        en: golden tablets
        ur: سنہری تختیاں
      correct: false
      why:
        ar: ليست ذهبًا بل جلود وعظام
        en: skins and bones, not gold
        ur: سونا نہیں، کھالیں اور ہڈیاں
    - text:
        ar: كتب مطبوعة
        en: printed books
        ur: چھپی کتابیں
      correct: false
      why:
        ar: ليست مطبوعة بل مخطوطة
        en: handwritten, not printed
        ur: چھپی نہیں، ہاتھ سے لکھی
  - q:
      ar: من جمعه أولاً؟
      en: Who first gathered it?
      ur: اسے پہلی بار کس نے جمع کیا؟
    options:
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: true
      why:
        ar: أبو بكر جمع النص بعد اليمامة
        en: Abu Bakr gathered the text after Yamama
        ur: ابو بکر نے یمامہ کے بعد متن جمع کیا
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: false
      why:
        ar: عثمان وحّده لا جمعه أولاً
        en: Uthman unified it; Abu Bakr gathered first
        ur: عثمان نے یکساں کیا، ابو بکر نے پہلے جمع کیا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي لم يجمعه أولاً
        en: Ali did not gather it first
        ur: علی نے پہلے جمع نہیں کیا
    - text:
        ar: عمر
        en: Umar
        ur: عمر
      correct: false
      why:
        ar: عمر اقترح وأبو بكر أمر
        en: Umar suggested; Abu Bakr ordered
        ur: عمر نے تجویز کیا، ابو بکر نے حکم دیا
  - q:
      ar: من وحّد المصاحف؟
      en: Who unified the codices?
      ur: مصحف کس نے یکساں کیے؟
    options:
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: true
      why:
        ar: عثمان وحّد النص في مصحف واحد
        en: Uthman unified the text in one codex
        ur: عثمان نے متن کو ایک مصحف میں یکساں کیا
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: false
      why:
        ar: أبو بكر جمع لا وحّد
        en: Abu Bakr gathered, not unified
        ur: ابو بکر نے جمع کیا، یکساں نہیں
    - text:
        ar: معاوية
        en: Mu'awiya
        ur: معاویہ
      correct: false
      why:
        ar: معاوية بعد عثمان
        en: Mu'awiya came after Uthman
        ur: معاویہ عثمان کے بعد تھا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي بعد عثمان
        en: Ali came after Uthman
        ur: علی عثمان کے بعد تھا
  - q:
      ar: من كتبه بإملاء؟
      en: Who wrote it at dictation?
      ur: امل پر کس نے لکھا؟
    options:
    - text:
        ar: زيد بن ثابت
        en: Zayd ibn Thabit
        ur: زید بن ثابت
      correct: true
      why:
        ar: زيد كاتب الوحي الذي دوّنه
        en: Zayd, the revelation's scribe, wrote it
        ur: زید، وحی کے منشی، نے لکھا
    - text:
        ar: ابن مسعود
        en: Ibn Mas'ud
        ur: ابن مسعود
      correct: false
      why:
        ar: ابن مسعود حافظ لا كاتب الجمع
        en: Ibn Mas'ud memorised, not the gathering scribe
        ur: ابن مسعود حافظ تھا، جمع کا منشی نہیں
    - text:
        ar: عبد الله بن عباس
        en: Ibn Abbas
        ur: ابن عباس
      correct: false
      why:
        ar: ابن عباس مفسّر لا جامع
        en: Ibn Abbas was an exegete, not the gatherer
        ur: ابن عباس مفسر تھا، جامع نہیں
    - text:
        ar: بلال
        en: Bilal
        ur: بلال
      correct: false
      why:
        ar: بلال مؤذن لا كاتب
        en: Bilal was the muezzin, not the scribe
        ur: بلال موذن تھا، منشی نہیں
  - q:
      ar: ما الذي أدى إلى جمعه؟
      en: What led to its gathering?
      ur: اس کے جمع کی کیا وجہ بنی؟
    options:
    - text:
        ar: معركة اليمامة
        en: the battle of Yamama
        ur: یمامہ کی لڑائی
      correct: true
      why:
        ar: سقوط الحفّاظ في اليمامة دفع للجمع
        en: the huffaz's fall at Yamama prompted it
        ur: یمامہ میں حفاظ کی شہادت نے جمع کروایا
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: false
      why:
        ar: فتح مكة قبل الجمع بعقدين
        en: Mecca's conquest was two decades before
        ur: فتح مکہ دو دہائی پہلے تھا
    - text:
        ar: وفاة النبي فقط
        en: the Prophet's death only
        ur: صرف نبی کی وفات
      correct: false
      why:
        ar: الوفاة دفعت لكن اليمامة السبب المباشر
        en: the death prompted but Yamama was the trigger
        ur: وفات سبب تھی مگر یمامہ براہ راست وجہ
    - text:
        ar: فارس
        en: Persia
        ur: فارس
      correct: false
      why:
        ar: ليست فارس بل اليمامة
        en: Yamama, not Persia
        ur: فارس نہیں، یمامہ
  - q:
      ar: كم يحفظه اليوم؟
      en: How many memorise it today?
      ur: آج کتنے اسے یاد رکھتے ہیں؟
    options:
    - text:
        ar: ملايين
        en: millions
        ur: لاکھوں
      correct: true
      why:
        ar: ملايين يحفظونه عن ظهر قلب
        en: millions know it by heart
        ur: لاکھوں اسے زبانی یاد رکھتے ہیں
    - text:
        ar: ألف
        en: a thousand
        ur: ہزار
      correct: false
      why:
        ar: ألف أقل بكثير من الواقع
        en: a thousand is far below reality
        ur: ہزار بہت کم ہے
    - text:
        ar: مئة
        en: a hundred
        ur: سو
      correct: false
      why:
        ar: مئة أقل بكثير
        en: a hundred is far fewer
        ur: سو بہت کم ہے
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: عشرة أقل بكثير
        en: ten is far fewer
        ur: دس بہت کم ہیں
  - q:
      ar: ما الظاهرة الفريدة فيه؟
      en: Its unique textual phenomenon?
      ur: اس کا نایاب متنی مظہر؟
    options:
    - text:
        ar: حفظه ملايين شفهًا
        en: millions memorising it orally
        ur: لاکھوں کا زبانی یاد رکھنا
      correct: true
      why:
        ar: كتاب يحفظه الملايين بلا اختلاف نص
        en: a book millions keep unchanged by heart
        ur: وہ کتاب جو لاکھوں بغیر فرق یاد رکھتے ہیں
    - text:
        ar: أطول كتاب
        en: the longest book
        ur: سب سے لمبی کتاب
      correct: false
      why:
        ar: ليست أطول بل محفوظ
        en: kept by heart, not longest
        ur: لمبی نہیں، یاد شدہ
    - text:
        ar: أقدم مخطوط
        en: the oldest codex
        ur: قدیم ترین مخطوط
      correct: false
      why:
        ar: ليست أقدم بل محفوظ جماهيريًا
        en: mass-memorised, not oldest
        ur: قدیم ترین نہیں، عمومی حفظ
    - text:
        ar: أكثر لغات
        en: the most languages
        ur: زیادہ زبانیں
      correct: false
      why:
        ar: ليست لغات بل حفظ
        en: memorisation, not languages
        ur: زبانیں نہیں، حفظ
  - q:
      ar: لماذا يُعدّ نصًّا متميزًا؟
      en: Why is it a distinct text?
      ur: یہ ممتاز متن کیوں ہے؟
    options:
    - text:
        ar: لوحدة نصه عبر القرون
        en: its text's unity across centuries
        ur: صدیوں بھر متن کی یکسانی
      correct: true
      why:
        ar: بقي نصًا واحدًا بلا اختلاف
        en: it stayed one text without variance
        ur: یہ ایک متن بغیر فرق رہا
    - text:
        ar: لأقدمه فقط
        en: for its age only
        ur: صرف قدمت کے لیے
      correct: false
      why:
        ar: ليست قدمًا بل وحدة
        en: unity, not just age
        ur: قدمت نہیں، یکسانی
    - text:
        ar: لأطوله
        en: for its length
        ur: لمبائی کے لیے
      correct: false
      why:
        ar: ليست طولًا بل حفظًا
        en: memorisation, not length
        ur: لمبائی نہیں، حفظ
    - text:
        ar: لأول كتاب عربي
        en: for being first Arabic book
        ur: پہلی عربی کتاب ہونے کے لیے
      correct: false
      why:
        ar: ليست أولًا بل موحّد
        en: unified, not first
        ur: پہلی نہیں، یکساں
- id: ottomans-gunpowder-empires
  anchor: exhibit/pathway-g12-chy4u-ottomans-gunpowder-empires
  band: researchers
  title:
    ar: العثمانيون وإمبراطوريات البارود
    en: The Ottomans and the Gunpowder Empires
    ur: عثمانی اور بارودی سلطنتیں
  sixty:
    ar: قامت الدولة العثمانية من إمارة صغيرة في الأناضول إلى إمبراطورية حكمت ثلاث قارات من ١٢٩٩ إلى ١٩٢٢. فتحت القسطنطينية عام ١٤٥٣ فصارت إسطنبول عاصمتها، وبلغت ذروتها
      بسليمان القانوني في القرن السادس عشر. وتسمّى مع المغول الهندية والصفويين الفارسيين «إمبراطوريات البارود» لاعتمادها سلاح البارود الجديد — بندقية ومدفع — في بناء
      جيوش مركزية قوية.
    en: The Ottoman state rose from a small Anatolian principality to an empire ruling three continents from 1299 to 1922. It took Constantinople in 1453, made it
      Istanbul its capital, and peaked under Süleyman the Lawgiver in the sixteenth century. With Mughal India and Safavid Persia it is called a 'gunpowder empire'
      — states built on the new gunpowder weapons, musket and cannon, to forge strong central armies.
    ur: عثمانی ریاست اناطولیہ کی ایک چھوٹی امارت سے 1299 تا 1922 تین براعظموں پر حکمران سلطنت بنی۔ اس نے 1453 میں قسطنطنیہ لیا اور استنبول بن کر اپنا پایہ تخت کیا
      اور سولہویں صدی میں سلیمان قانونی کے عہد میں عروج پر پہنچی۔ مغلیہ ہند اور صفوی فارس کے ساتھ اسے «بارودی سلطنت» کہا جاتا ہے — ایسی ریاستیں جو نئے بارودی ہتھیاروں،
      بندوق اور توپ، پر مضبوط مرکزی فوجیں کھڑی کرتی تھیں۔
  glossary:
  - term:
      ar: عثمان
      en: Osman
      ur: عثمان
    gloss:
      ar: مؤسس السلالة عام ١٢٩٩
      en: the dynasty's founder in 1299
      ur: 1299 میں خاندان کا بانی
  - term:
      ar: القسطنطينية
      en: Constantinople
      ur: قسطنطنیہ
    gloss:
      ar: المدينة التي فتحها محمد الثاني
      en: the city Mehmed II took
      ur: وہ شہر جو محمد دوم نے لیا
  - term:
      ar: فتح ١٤٥٣
      en: the 1453 conquest
      ur: 1453 کی فتح
    gloss:
      ar: سقوط عاصمة بيزنطة
      en: the fall of Byzantium's capital
      ur: بازنطینی دارالحکومت کا سقوط
  - term:
      ar: إسطنبول
      en: Istanbul
      ur: استنبول
    gloss:
      ar: العاصمة بعد الفتح
      en: the capital after the conquest
      ur: فتح کے بعد پایہ تخت
  - term:
      ar: سليمان القانوني
      en: Süleyman the Lawgiver
      ur: سلیمان قانونی
    gloss:
      ar: السلطان الذي بلغت ذروتها في عهده
      en: the sultan under whom it peaked
      ur: وہ سلطان جس کے عہد میں یہ عروج پر تھی
  - term:
      ar: محمد الفاتح
      en: Mehmed the Conqueror
      ur: محمد فاتح
    gloss:
      ar: السلطان الذي فتح القسطنطينية
      en: the sultan who took Constantinople
      ur: وہ سلطان جس نے قسطنطنیہ لی
  - term:
      ar: البارود
      en: gunpowder
      ur: بارود
    gloss:
      ar: المادة التي غيّرت الحرب في العصر
      en: the substance that changed the age's war
      ur: وہ مادہ جس نے دور کی جنگ بدل دی
  - term:
      ar: البندقية
      en: the musket
      ur: بندوق
    gloss:
      ar: سلاح ناري فردي في الجيوش
      en: the infantry firearm of the armies
      ur: فوجوں کا انفرادی آتشین ہتھیار
  - term:
      ar: المدفع
      en: the cannon
      ur: توپ
    gloss:
      ar: السلاح الثقيل الذي حطّم الأسوار
      en: the heavy weapon that broke walls
      ur: وہ بھاری ہتھیار جس نے دیواریں توڑیں
  - term:
      ar: الصفويون
      en: the Safavids
      ur: صفوی
    gloss:
      ar: إمبراطورية فارس المنافسة
      en: rival empire of Persia
      ur: فارس کی حریف سلطنت
  - term:
      ar: المغول الهندية
      en: Mughal India
      ur: مغلیہ ہند
    gloss:
      ar: إمبراطورية الهند المنافسة
      en: rival empire of India
      ur: ہندوستان کی حریف سلطنت
  - term:
      ar: الأناضول
      en: Anatolia
      ur: اناطولیہ
    gloss:
      ar: الإقليم الذي نشأت فيه الدولة
      en: the region where the state arose
      ur: وہ خطہ جہاں ریاست پیدا ہوئی
  practice:
  - q:
      ar: من مؤسس الدولة؟
      en: Who founded the state?
      ur: ریاست کا بانی کون تھا؟
    options:
    - text:
        ar: عثمان الأول
        en: Osman I
        ur: عثمان اول
      correct: true
      why:
        ar: عثمان بدأ السلالة عام ١٢٩٩
