        en: al-Aqsa before the change to Mecca
        ur: مکہ میں تبدیلی سے پہلے اقصیٰ
      correct: true
      why:
        ar: تذكر المصادر الصلاة إليه أولًا
        en: the sources have prayer to her first
        ur: ماخذ میں نماز پہلے اس کی طرف ہے
    - text:
        ar: الكعبة من البداية
        en: the Kaaba from the start
        ur: شروع سے کعبہ
      correct: false
      why:
