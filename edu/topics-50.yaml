        en: many Arabic names survive
        ur: بہت سے عربی نام باقی ہیں
  - q:
      ar: من عالم مرصد مراغة؟
      en: Who was Maragha's famed astronomer?
      ur: مراغہ کا مشہور فلکیات دان کون تھا؟
    options:
    - text:
        ar: الطوسي
        en: al-Tusi
        ur: طوسی
      correct: true
      why:
        ar: نصير الدين الطوسي عالم مراغة
        en: Nasir al-Din al-Tusi of Maragha
        ur: نصیرالدین طوسی مراغہ کا
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: false
      why:
        ar: الخوارزمي في بغداد لا مراغة
        en: al-Khwarizmi was in Baghdad
        ur: خوارزمی بغداد میں تھا
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا طبيب لا عالم مراغة
        en: Ibn Sina was a physician, not Maragha's man
        ur: ابن سینا طبیب تھا، مراغہ کا نہیں
    - text:
        ar: الفارابي
        en: al-Farabi
        ur: فارابی
      correct: false
      why:
        ar: الفارابي فيلسوف لا مراغة
        en: al-Farabi was a philosopher, not Maragha's
        ur: فارابی فلسفی تھا، مراغہ کا نہیں
  - q:
      ar: لماذا ازدهر علم الفلك؟
      en: Why did astronomy flourish?
      ur: فلکیات کیوں پھلی؟
    options:
    - text:
        ar: للحاجة إلى القبلة والوقت والملاحة
        en: for qibla, time and sailing needs
        ur: قبلہ، وقت اور سفر کی ضرورت سے
      correct: true
      why:
        ar: خدمة العبادة والتجارة والسفر دفعت العلم
        en: worship, trade and travel needs drove the science
        ur: عبادت، تجارت اور سفر کی ضرورت نے علم کو چلایا
    - text:
        ar: للحروب فقط
        en: for wars only
        ur: صرف جنگوں کے لیے
      correct: false
      why:
        ar: ليست حروبًا بل عبادة وسفر
        en: worship and travel, not wars
        ur: جنگ نہیں، عبادت اور سفر
    - text:
        ar: للزينة
        en: for decoration
        ur: زینت کے لیے
      correct: false
      why:
        ar: ليست زينة بل علم عملي
        en: a practical science, not decoration
        ur: زینت نہیں، عملی علم
    - text:
        ar: للتسلية
        en: for amusement
        ur: تفریح کے لیے
      correct: false
      why:
        ar: ليست تسلية بل حاجة
        en: a need, not amusement
        ur: تفریح نہیں، ضرورت
- id: islamic-calligraphy
  anchor: concept/islamic-calligraphy
  band: researchers
  title:
    ar: الخط العربي
    en: Islamic calligraphy
    ur: اسلامی خطاطی
  sixty:
    ar: 'الخط العربي: فنّ الحرف الذي صار أعظم فنون الإسلام لأنه يحمل كلام الله نفسه. بدأ بالخط الكوفي المربّع في المصاحف الأولى، ثم نظّم ابن مقلة النسخ في بغداد، وبلغ الثلث قمّته في عهد ياقوت المستعصمي، وصار الديواني خطّ الدواوين العثمانية. والخطاط لا يكتب بل يرسم: بالقلم القصب والحبر السخام يضع كلّ حرف في موضعه الحسابي، فيكتب المصاحف واللوحات والعمائر من دمشق إلى سمرقند. ومن هذا الفن خرج التذهيب: زخارف ذهبية ونباتية تُطوّق النص حتى يصير الصفحة نفسها لوحة — فالكلمة هنا فنٌّ كامل.  ولأن الكتابة تسامح معها كلّ شيء صار فنّاً أشمل: على الورق والحجر والخشب والمعدن يكتب أسماء الله وأبيات الشعر ورقّة الحرف واحدة.  وبهذا صار الحرف نفسه موضوع جمال: ليس رسولًا للمعنى بل معنى في حد ذاته.'
    en: 'Arabic calligraphy: the art of the letter that became Islam''s greatest art because it carries God''s own speech. It began with square Kufic in the early mushafs, then Ibn Muqla regularized naskh in Baghdad, thuluth peaked under Yaqut al-Musta''simi, and diwani became the Ottoman chancery''s script. The calligrapher does not write, he draws: with a reed pen and soot ink he sets each letter in its measured place, writing mushafs, panels and monuments from Damascus to Samarqand. Out of this art came illumination — golden and floral borders ring the text until the page itself is a painting. Here the word is the whole art.  And because writing forgives everything it became the broadest art: on paper, stone, wood and metal it writes God''s names and verses of poetry, and the letter''s grace is one.'
    ur: 'عربی خطاطی: حرف کا وہ فن جو اسلام کا سب سے عظیم فن بنا کیونکہ یہ خود خدا کا کلام اٹھاتا ہے۔ یہ ابتدائی مصحفوں کے مربع کوفی سے شروع ہوا، پھر ابن مقلہ نے بغداد میں نسخ کو مرتب کیا، ثلث یاقوت مستعصمی کے عہد میں عروج پر پہنچا، اور دیوانی عثمانی دیوان کا خط بنا۔ خطاط لکھتا نہیں، کھینچتا ہے: قصب کی قلم اور سیاہی سے وہ ہر حرف کو اس کے مپی ہوئے مقام پر رکھتا ہے، دمشق سے سمرقند تک مصحف، تختیاں اور عمارتیں لکھتا ہے۔ اسی فن سے تذهیب نکلا — سنہری اور پھولدار حاشیے متن کو گھیرتے ہیں یہاں تک کہ صفحہ خود تصویر بن جاتا ہے۔ یہاں لفظ ہی سارا فن ہے۔  اور چونکہ تحریر سب کچھ معاف کرتی ہے یہ سب سے وسیع فن بنا: کاغذ، پتھر، لکڑی اور دھات پر وہ خدا کے نام اور شعر لکھتی ہے، اور حرف کی لطافت ایک ہی ہے۔'
  glossary:
  - term:
      ar: الكوفي
      en: Kufic
      ur: کوفی
    gloss:
      ar: 'الخط المربّع الأقدم في المصاحف'
      en: 'the square script — oldest in the mushafs'
      ur: 'وہ مربع خط — مصحفوں کا قدیم ترین'
  - term:
      ar: النسخ
      en: Naskh
      ur: نسخ
    gloss:
      ar: 'الخط المدوّر اليومي للنسّاخ'
      en: 'the copyists'' everyday rounded script'
      ur: 'نسخہ نویسوں کا روزانہ گول خط'
  - term:
      ar: الثلث
      en: Thuluth
      ur: ثلث
    gloss:
      ar: 'الخط الملكي للقباب واللافتات'
      en: 'the royal script of domes and signs'
      ur: 'گنبدوں اور تختیوں کا شاہی خط'
  - term:
      ar: ابن مقلة
      en: Ibn Muqla
      ur: ابن مقلہ
    gloss:
      ar: 'الذي نظّم النسخ في بغداد'
      en: 'he who regularised naskh in Baghdad'
      ur: 'اس نے بغداد میں نسخ کو مرتب کیا'
  - term:
      ar: ياقوت المستعصمي
      en: Yaqut al-Musta'simi
      ur: یاقوت مستعصمی
    gloss:
      ar: 'سيّد الخطاطين في عصر المغول'
      en: 'the calligraphers'' master in the Mongols'' era'
      ur: 'مغولوں کے دور میں خطاطوں کا سردار'
  - term:
      ar: الخطاط
      en: the calligrapher
      ur: خطاط
    gloss:
      ar: 'صاحب القلم الذي يكسب قوته'
      en: 'the pen-holder who earns his living'
      ur: 'وہ قلم بردار جو اپنا معاش کماتا ہے'
  - term:
      ar: المصحف
      en: the mushaf
      ur: مصحف
    gloss:
      ar: 'المصحف المكتوب بأجمل الخطوط'
      en: 'the mushaf written in the finest scripts'
      ur: 'خوبصورت ترین خطوں میں لکھی مصحف'
  - term:
      ar: اللوحة
      en: the panel
      ur: لوح
    gloss:
      ar: 'اللوحة المعلّقة في البيوت'
      en: 'the panel hung in houses'
      ur: 'گھروں میں لٹکی تختی'
  - term:
      ar: الديواني
      en: Diwani
      ur: دیوانی
    gloss:
      ar: 'خطّ الدواوين العثمانية'
      en: 'the Ottoman chanceries'' script'
      ur: 'عثمانی دیوانوں کا خط'
  - term:
      ar: التذهيب
      en: illumination
      ur: تلائیہ
    gloss:
      ar: 'فنّ تذهيب النصوص بالنباتات'
      en: 'the art of gilding texts with flora'
      ur: 'پودوں سے متنوں کو سنہری بنانے کا فن'
  - term:
      ar: الحبر
      en: the ink
      ur: سیاہی
    gloss:
      ar: 'الحبر الأسود المصنوع من السخام'
      en: 'the black ink made from soot'
      ur: 'کاجل سے بنی سیاہ سیاہی'
  - term:
      ar: القلم
      en: the reed pen
      ur: قلم
    gloss:
      ar: 'القلم المصنوع من القصب'
      en: 'the pen made of reed'
      ur: 'قصب کی بنی قلم'
  practice:
  - q:
      ar: لماذا ارتفع الخط في الفن الإسلامي؟
      en: Why did calligraphy rise highest in Islamic art?
      ur: خطاطی اسلامی فن میں اعلیٰ کیوں بنی؟
    options:
    - text:
        ar: لجمعه الجمال والكتابة المقدسة
        en: it joins beauty and sacred writing
        ur: خوبصورتی اور مقدس تحریر کا اجتماع
      correct: true
      why:
        ar: يجمع الجمال والكتابة حيث لا صورة
        en: it joins beauty and writing where image is absent
        ur: خوبصورتی اور تحریر جمع جہاں تصویر نہیں
    - text:
        ar: لرسمه الوجوه
        en: for drawing faces
        ur: چہرے بنانے کے لیے
      correct: false
      why:
        ar: ليس لوجوه بل لحروف
        en: for letters, not faces
        ur: چہروں کے لیے نہیں، حروف کے لیے
    - text:
        ar: لأرخص فن
        en: for being cheapest art
        ur: سستے فن کے لیے
      correct: false
      why:
        ar: ليس لرخصة بل لجماله
        en: for its beauty, not cheapness
        ur: سستے ہونے کے لیے نہیں، خوبصورتی کے لیے
    - text:
        ar: لسهولته
        en: for its ease
        ur: آسانی کے لیے
      correct: false
      why:
        ar: ليس لسهولة بل لقدسية وجمال
        en: for sacred beauty, not ease
        ur: آسانی کے لیے نہیں، تقدس اور حسن کے لیے
  - q:
      ar: ما أسلوب المخطوطات الأولى؟
      en: The early manuscripts' style?
      ur: ابتدائی مخطوطات کا اسلوب؟
    options:
    - text:
        ar: الكوفي الزاوي
        en: angular Kufic
        ur: کونا دار کوفی
      correct: true
      why:
        ar: الكوفي أسلوب المخطوطات الأولى
        en: Kufic is the early manuscripts' style
        ur: کوفی ابتدائی مخطوطات کا اسلوب ہے
    - text:
        ar: الديواني
        en: Diwani
        ur: دیوانی
      correct: false
      why:
        ar: الديواني عثماني متأخر
        en: Diwani is a later Ottoman style
        ur: دیوانی بعد کا عثمانی اسلوب ہے
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: false
      why:
        ar: النسخ لليومي لا الأول
        en: Naskh is the everyday, not earliest
        ur: نسخ روزمرہ ہے، اولین نہیں
    - text:
        ar: الرقعة
        en: Ruqa
        ur: رقعہ
      correct: false
      why:
        ar: الرقعة أسلوب سريع متأخر
        en: Ruqa is a later quick style
        ur: رقعہ بعد کا تیز اسلوب ہے
  - q:
      ar: ما أسلوب النسخ اليومي؟
      en: The everyday copying style?
      ur: روزمرہ نقل کا اسلوب؟
    options:
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: true
      why:
        ar: النسخ للنسخ اليومي والكتب
        en: Naskh is for daily copying and books
        ur: نسخ روزمرہ نقل اور کتابوں کے لیے
    - text:
        ar: الثلث
        en: Thuluth
        ur: ثلث
      correct: false
      why:
        ar: الثلث للعناوين لا اليومي
        en: Thuluth is for titles, not daily
        ur: ثلث عنوانوں کے لیے، روزمرہ نہیں
    - text:
        ar: الكوفي
        en: Kufic
        ur: کوفی
      correct: false
      why:
        ar: الكوفي للمخطوطات الأولى
        en: Kufic is the early manuscripts'
        ur: کوفی ابتدائی مخطوطات کا ہے
    - text:
        ar: الديواني
        en: Diwani
        ur: دیوانی
      correct: false
      why:
        ar: الديواني للدواوين لا اليومي
        en: Diwani is for decrees, not daily
        ur: دیوانی فرمانوں کا ہے، روزمرہ نہیں
  - q:
      ar: ما أسلوب العناوين المهيبة؟
      en: The majestic monumental style?
      ur: شاندار یادگاری اسلوب؟
    options:
    - text:
        ar: الثلث
        en: Thuluth
        ur: ثلث
      correct: true
      why:
        ar: الثلث للعمائر والمصاحف
        en: Thuluth for monuments and Qur'ans
        ur: ثلث یادگاروں اور مصحفوں کے لیے
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: false
      why:
        ar: النسخ لليومي لا المهيب
        en: Naskh is for daily, not majestic
        ur: نسخ روزمرہ کا ہے، شاندار نہیں
    - text:
        ar: الرقعة
        en: Ruqa
        ur: رقعہ
      correct: false
      why:
        ar: الرقعة للسرعة لا المهيب
        en: Ruqa is for speed, not majesty
        ur: رقعہ تیز رفتاری کا ہے، شان نہیں
    - text:
        ar: الفارسي
        en: Nasta'liq
        ur: نستعلیق
      correct: false
      why:
        ar: الفارسي للشعر لا المهيب
        en: Nasta'liq is for poetry, not monuments
        ur: نستعلیق شاعری کا ہے، یادگار نہیں
  - q:
      ar: من قنّن قياس الحروف؟
      en: Who systematised the letters?
      ur: حروف کا قاعدہ کس نے بنایا؟
    options:
    - text:
        ar: ابن مقلة
        en: Ibn Muqla
        ur: ابن مقلہ
      correct: true
      why:
        ar: ابن مقلة قنّن قياس الحروف
        en: Ibn Muqla systematised letter measure
        ur: ابن مقلہ نے حروف کی پیمائش کی
    - text:
        ar: ياقوت
        en: Yaqut
        ur: یاقوت
      correct: false
      why:
        ar: ياقوت خطاط بعده
        en: Yaqut was a later calligrapher
        ur: یاقوت بعد کا خطاط تھا
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: false
      why:
        ar: الخوارزمي عالم جبر لا خط
        en: al-Khwarizmi was of algebra, not script
        ur: خوارزمی الجبر کا تھا، خط نہیں
    - text:
        ar: الزهراوي
        en: al-Zahrawi
        ur: زہراوی
      correct: false
      why:
        ar: الزهراوي طبيب لا خطاط
        en: al-Zahrawi was a physician
        ur: زہراوی طبیب تھا
  - q:
      ar: من أشهر خطاطي بغداد؟
      en: The most famed Baghdad calligrapher?
      ur: بغداد کا مشہور ترین خطاط؟
    options:
    - text:
        ar: ياقوت المستعصمي
        en: Yaqut al-Musta'simi
        ur: یاقوت مستعصمی
      correct: true
      why:
        ar: ياقوت أعظم خطاطي بغداد العباسية
        en: Yaqut was Abbasid Baghdad's greatest
        ur: یاقوت عباسی بغداد کا سب سے بڑا تھا
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون مؤرخ لا خطاط
        en: Ibn Khaldun was a historian
        ur: ابن خلدون مؤرخ تھا
    - text:
        ar: الجاحظ
        en: al-Jahiz
        ur: جاحظ
      correct: false
      why:
        ar: الجاحظ أديب لا خطاط
        en: al-Jahiz was a writer, not calligrapher
        ur: جاحظ ادیب تھا، خطاط نہیں
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا خطاط
        en: Ibn Battuta was a traveller
        ur: ابن بطوطہ مسافر تھا
  - q:
      ar: ما «التذهيب»؟
      en: What is illumination?
      ur: تلائیہ کیا ہے؟
    options:
    - text:
        ar: زخرفة الذهب حول النص
        en: gold ornament round the text
        ur: متن کے گرد سنہری زینت
      correct: true
      why:
        ar: ذهب يزخرف هوامش المخطوط
        en: gold ornamenting the manuscript's margins
        ur: مخطوط کے حاشیے کو سنہرا بنانا
    - text:
        ar: كتابة بالحبر الأسود
        en: black-ink writing
        ur: کالی سیاہی کی تحریر
      correct: false
      why:
        ar: ليست حبرًا بل ذهب
        en: gold, not black ink
        ur: سیاہی نہیں، سونا
    - text:
        ar: طباعة الكتب
        en: printing books
        ur: کتاب چھاپنا
      correct: false
      why:
        ar: ليست طباعة بل زخرفة
        en: ornament, not printing
        ur: چھپائی نہیں، زینت
    - text:
        ar: تجليد المخطوط
        en: binding the codex
        ur: مخطوط جلد کرنا
      correct: false
      why:
        ar: ليست تجليدًا بل تذهيب
        en: illumination, not binding
        ur: جلد نہیں، تلائیہ
  - q:
      ar: ما أداة الخطاط؟
      en: The calligrapher's tool?
      ur: خطاط کا آلہ؟
    options:
    - text:
        ar: القلم القصبي
        en: the reed pen
        ur: سرکنڈے کا قلم
      correct: true
      why:
        ar: القلم من قصب مقطوع مائل
        en: a reed pen cut at a slant
        ur: ترچھا کاٹا سرکنڈے کا قلم
    - text:
        ar: فرشاة رسم
        en: a paint brush
        ur: رنگ برش
      correct: false
      why:
        ar: ليست فرشاة رسم بل قلم
        en: a reed pen, not a paint brush
        ur: رنگ برش نہیں، قلم
    - text:
        ar: ريشة طائر
        en: a feather quill
        ur: پر کی قلم
      correct: false
      why:
        ar: ليست ريشة بل قصب
        en: a reed, not a feather
        ur: پر نہیں، سرکنڈا
    - text:
        ar: قلم حديث
        en: a modern pen
        ur: جدید قلم
      correct: false
      why:
        ar: ليست حديثًا بل قصبًا
        en: a reed pen, not modern
        ur: جدید نہیں، سرکنڈا
  - q:
      ar: أين بلغ الخط ذروته؟
      en: Where did calligraphy peak?
      ur: خطاطی کہاں عروج پر پہنچی؟
    options:
    - text:
        ar: في مساجد تركيا
        en: in Turkey's mosques
        ur: ترکی کی مسجدوں میں
      correct: true
      why:
        ar: بلغت الذروة في لوحات المساجد العثمانية
        en: it peaked in Ottoman mosque panels
        ur: یہ عثمانی مسجدوں کے لوحوں میں عروج پر پہنچی
    - text:
        ar: في قصور أوروبا
        en: in Europe's palaces
        ur: یورپ کے محلوں میں
      correct: false
      why:
        ar: ليست في قصور بل مساجد
        en: in mosques, not palaces
        ur: محلوں میں نہیں، مسجدوں میں
    - text:
        ar: في مخطوطات الصين
        en: in China's codices
        ur: چین کے مخطوطات میں
      correct: false
      why:
        ar: ليست في الصين بل تركيا
        en: in Turkey, not China
        ur: چین میں نہیں، ترکی میں
    - text:
        ar: في كهوف إفريقيا
        en: in Africa's caves
        ur: افریقہ کی غاروں میں
      correct: false
      why:
        ar: ليست في كهوف بل مساجد
        en: in mosques, not caves
        ur: غاروں میں نہیں، مسجدوں میں
  - q:
      ar: ما «اللوحة» في الخط؟
      en: What is a calligraphy 'panel'?
      ur: خطاطی میں «لوح» کیا ہے؟
    options:
    - text:
        ar: لوح خط معلق
        en: a hung calligraphy board
        ur: لٹکا ہوا خطاطی لوح
      correct: true
      why:
        ar: أعمال خطية كبيرة تعلق في المساجد
        en: large calligraphy works hung in mosques
        ur: بڑی خطاطی کام جو مسجدوں میں لٹکتے ہیں
    - text:
        ar: باب خشبي
        en: a wooden door
        ur: لکڑی کا دروازہ
      correct: false
      why:
        ar: ليست بابًا بل لوحًا
        en: a panel, not a door
        ur: دروازہ نہیں، لوح
    - text:
        ar: نافذة زجاج
        en: a glass window
        ur: شیشے کی کھڑکی
      correct: false
      why:
        ar: ليست نافذة بل لوحًا
        en: a panel, not a window
        ur: کھڑکی نہیں، لوح
    - text:
        ar: سجادة صلاة
        en: a prayer rug
        ur: جائے نماز
      correct: false
      why:
        ar: ليست سجادة بل لوحًا
        en: a panel, not a rug
        ur: جائے نماز نہیں، لوح
- id: sawm-ramadan
  anchor: practice/sawm-ramadan
  band: scholars
  title:
    ar: صوم رمضان
    en: Fasting Ramadan
    ur: رمضان کے روزے
  sixty:
    ar: 'صوم رمضان: ركن الإسلام الرابع — الإمساك عن الطعام والشراب من طلوع الفجر إلى غروب الشمس طوال شهر الصيام. يأكل المسلمون السحور قبل الفجر ويفطرون عند الغروب على التمر والماء، وفي الليل تصلّى التراويح بعد العشاء، وفي العشر الأواخر تُطلب ليلة القدر التي هي خير من ألف شهر. والصوم ليس جوعًا بل تربية: صبرًا على النفس ورحمة بالجائعين وتقوى القلب، ويعفى المريض والمسافر والمرأة الحامل على أحكامها. وفي آخره عيد الفطر: صدقة تخرج قبل الصلاة وفرح يجمع الأمة كلّها في يوم واحد.  وبهذا الشهر تتجدّد الجماعة كلّ سنة: مساجد تمتلئ، وبيوت تضاء، ومائدة واحدة تجمع الغني والفقير، فيتعلّم المسلمون كلّ سنة أن قلوبهم يمكن أن تتحرّك معًا.  وهو شهر القرآن أيضًا: فيه نزلت أول آية، وفيه يتنافس المسلمون على تلاوتها حتى آخر ليلة.'
    en: 'The Ramadan fast: Islam''s fourth pillar — abstaining from food and drink from dawn to sunset through the fasting month. Muslims eat suhoor before dawn and break at sunset on dates and water; at night taraweeh prayers follow isha, and in the last ten nights the Night of Power is sought, better than a thousand months. Fasting is not hunger but training — patience for the self, mercy for the hungry, God-consciousness in the heart — and the sick, the traveller and the expectant mother are excused under their own rules. At its end comes Eid al-Fitr: charity given before the prayer and a joy gathering the whole ummah in one day.  With this month the community renews itself every year: mosques fill, houses glow, one table joins rich and poor, and Muslims learn each year that their hearts can move together.'
    ur: 'رمضان کا روزہ: اسلام کا چوتھا رکن — طلوع فجر سے غروب آفتاب تک پورے مہینے کھانے پینے سے رکنا۔ مسلمان فجر سے پہلے سحری کھاتے ہیں اور غروب پر کھجور اور پانی سے افطار کرتے ہیں؛ رات میں عشاء کے بعد تراویح ہوتی ہیں، اور آخری دس راتوں میں لیلۃ القدر تلاش کی جاتی ہے جو ہزار مہینوں سے بہتر ہے۔ روزہ بھوک نہیں بلکہ تربیت ہے — نفس کے لیے صبر، بھوکوں کے لیے رحمت، دل میں تقویٰ — اور بیمار، مسافر اور حاملہ عورت اپنے اصولوں سے معذور ہیں۔ اس کے آخر میں عید الفطر ہے: نماز سے پہلے دی جانے والی صدقۃ الفطر اور وہ خوشی جو پوری امت کو ایک دن میں جمع کرتی ہے۔  اس مہینے سے ہر سال برادری تازہ ہوتی ہے: مسجدیں بھرتیں ہیں، گھر جگمگاتے ہیں، ایک دسترخوان امیر اور غریب کو جوڑتا ہے، اور مسلمان ہر سال سیکھتے ہیں کہ ان کے دل یکساں ہل سکتے ہیں۔'
  glossary:
  - term:
      ar: الصوم
      en: fasting
      ur: روزہ
    gloss:
      ar: 'الامتناع عن الطعام والشراب'
      en: 'abstaining from food and drink'
      ur: 'کھانے پینے سے رکنا'
  - term:
      ar: السحور
      en: suhoor
      ur: سحری
    gloss:
      ar: 'وجبة ما قبل الفجر'
      en: 'the meal before dawn'
      ur: 'فجر سے پہلے کا کھانا'
  - term:
      ar: الإفطار
      en: iftar
      ur: افطار
    gloss:
      ar: 'كسر الصوم عند الغروب'
      en: 'breaking the fast at sunset'
      ur: 'غروب پر روزہ کھولنا'
  - term:
      ar: الهلال
      en: the crescent
      ur: ہلال
    gloss:
      ar: 'بداية الشهر في السماء'
      en: 'the month''s start in the sky'
      ur: 'آسمان میں مہینے کا آغاز'
  - term:
      ar: ليلة القدر
      en: the Night of Power
      ur: لیلۃ القدر
    gloss:
      ar: 'الليلة التي هي خير من ألف شهر'
      en: 'the night better than a thousand months'
      ur: 'وہ رات جو ہزار مہینوں سے بہتر ہے'
  - term:
      ar: عيد الفطر
      en: Eid al-Fitr
      ur: عید الفطر
    gloss:
      ar: 'العيد الذي يلي الصيام'
      en: 'the feast following the fast'
      ur: 'روزے کے بعد کی عید'
  - term:
      ar: التراويح
      en: taraweeh
      ur: تراویح
    gloss:
      ar: 'صلاة الليل في رمضان'
      en: 'the night prayer of Ramadan'
      ur: 'رمضان کی رات کی نماز'
  - term:
      ar: المعذورون
      en: the excused
      ur: معذور
    gloss:
      ar: 'من يعفون من الصوم بشرط'
      en: 'those excused from fasting under conditions'
      ur: 'شرائط پر روزے سے معذور لوگ'
  - term:
      ar: نزول القرآن
      en: the Qur'an's descent
      ur: قرآن کا نزول
    gloss:
      ar: 'بداية نزول الكتاب'
      en: 'the Book''s descent''s beginning'
      ur: 'کتاب کے نزول کا آغاز'
  - term:
      ar: التقوى
      en: taqwa (God-consciousness)
      ur: تقویٰ
    gloss:
      ar: 'خوف الله الذي يزداد بالصوم'
      en: 'God-consciousness that fasting grows'
      ur: 'روزے سے بڑھنے والی خدا سے بچنے کی فطرت'
  - term:
      ar: الفجر
      en: dawn
      ur: طلوع فجر
    gloss:
      ar: 'بدء الصيام في اليوم'
      en: 'the fast''s start in the day'
      ur: 'دن میں روزے کا آغاز'
  - term:
      ar: الغروب
      en: sunset
      ur: غروب
    gloss:
      ar: 'نهاية الصيام في اليوم'
      en: 'the fast''s end in the day'
      ur: 'دن میں روزے کا اختتام'
  practice:
  - q:
      ar: ما شهر الصوم؟
      en: Which is the fasting month?
      ur: روزے کا مہینہ کون سا ہے؟
    options:
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: true
      why:
        ar: رمضان التاسع شهر الصوم
        en: Ramadan is the ninth, the fasting month
        ur: رمضان نواں مہینہ، روزے کا ہے
    - text:
        ar: شعبان
        en: Sha'ban
        ur: شعبان
      correct: false
      why:
        ar: شعبان قبله لا الصوم
        en: Sha'ban precedes it, not fasting
        ur: شعبان اس سے پہلے ہے، روزے کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الصوم
        en: Muharram opens the year, not fasting
        ur: محرم سال کا پہلا ہے، روزے کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب سابع الشهر
        en: Rajab is the seventh month
        ur: رجب ساتواں مہینہ ہے
  - q:
      ar: من الفجر إلى متى يصوم؟
      en: From dawn until when?
      ur: طلوع فجر سے کب تک روزہ؟
    options:
    - text:
        ar: إلى الغروب
        en: until sunset
        ur: غروب تک
      correct: true
      why:
        ar: من الفجر إلى الغروب يمتنع
        en: from dawn to sunset he abstains
        ur: طلوع فجر سے غروب تک پرہیز
    - text:
        ar: إلى الظهر
        en: until noon
        ur: دوپہر تک
      correct: false
      why:
        ar: ليس إلى الظهر بل الغروب
        en: till sunset, not noon
        ur: دوپہر نہیں، غروب
    - text:
        ar: إلى منتصف الليل
        en: till midnight
        ur: آدھی رات تک
      correct: false
      why:
        ar: ليس منتصف الليل بل الغروب
        en: till sunset, not midnight
        ur: آدھی رات نہیں، غروب
    - text:
        ar: إلى الفجر التالي
        en: till next dawn
        ur: اگلی فجر تک
      correct: false
      why:
        ar: ليس يوم كامل بل نهار
        en: a day, not a full night too
        ur: پورا دن رات نہیں، صرف دن
  - q:
      ar: ما السحور؟
      en: What is suhoor?
      ur: سحری کیا ہے؟
    options:
    - text:
        ar: وجبة الفجر قبل الصوم
        en: the pre-dawn meal
        ur: طلوع فجر سے پہلے کھانا
      correct: true
      why:
        ar: وجبة قبل الفجر تجهّز للصوم
        en: a pre-dawn meal preparing for the fast
        ur: روزے کی تیاری کا فجر سے پہلے کھانا
    - text:
        ar: وجبة الغروب
        en: the sunset meal
        ur: غروب کا کھانا
      correct: false
      why:
        ar: وجبة الغروب هي الإفطار
        en: the sunset meal is iftar
        ur: غروب کا کھانا افطار ہے
    - text:
        ar: صلاة الليل
        en: the night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: ليست صلاة بل وجبة
        en: a meal, not a prayer
        ur: نماز نہیں، کھانا
    - text:
        ar: صدقة الصوم
        en: the fast's charity
        ur: روزے کا صدقہ
      correct: false
      why:
        ar: ليست صدقة بل وجبة
        en: a meal, not charity
        ur: صدقہ نہیں، کھانا
  - q:
      ar: ما الإفطار؟
      en: What is iftar?
      ur: افطار کیا ہے؟
    options:
    - text:
        ar: وجبة الغروب
        en: the sunset meal
        ur: غروب کا کھانا
      correct: true
      why:
        ar: وجبة فتح الصوم عند الغروب
        en: the meal breaking the fast at sunset
        ur: غروب پر روزہ کھولنے کا کھانا
    - text:
        ar: وجبة الفجر
        en: the dawn meal
        ur: فجر کا کھانا
      correct: false
      why:
        ar: وجبة الفجر هي السحور
        en: the dawn meal is suhoor
        ur: فجر کا کھانا سحری ہے
    - text:
        ar: صلاة المغرب
        en: the sunset prayer
        ur: نماز مغرب
      correct: false
      why:
        ar: ليست صلاة بل وجبة
        en: a meal, not the prayer
        ur: نماز نہیں، کھانا
    - text:
        ar: ليلة القدر
        en: the Night of Power
        ur: لیلۃ القدر
      correct: false
      why:
        ar: ليست ليلة بل وجبة
        en: a meal, not a night
        ur: رات نہیں، کھانا
  - q:
      ar: ما ليلة القدر؟
      en: What is the Night of Power?
      ur: لیلۃ القدر کیا ہے؟
    options:
    - text:
        ar: ليلة ذكرى نزول القرآن
        en: a night marking the Qur'an's descent
        ur: قرآن کے نزول کی یاد کی رات
      correct: true
      why:
        ar: في العشر الأخيرة تذكّر بنزول القرآن
        en: in the last ten, recalling the Qur'an's descent
        ur: آخری دس میں، قرآن کے نزول کی یاد
    - text:
        ar: أول ليلة رمضان
        en: Ramadan's first night
        ur: رمضان کی پہلی رات
      correct: false
      why:
        ar: ليست أول ليلة بل من العشر
        en: in the last ten, not the first
        ur: پہلی نہیں، آخری دس میں
    - text:
        ar: ليلة العيد
        en: the Eid night
        ur: عید کی رات
      correct: false
      why:
        ar: ليست ليلة العيد بل قبلها
        en: before Eid night, not it
        ur: عید کی رات نہیں، اس سے پہلے
    - text:
        ar: ليلة النصف
        en: the mid-month night
        ur: وسط مہینے کی رات
      correct: false
      why:
        ar: ليست النصف بل العشر
        en: in the last ten, not mid-month
        ur: وسط نہیں، آخری دس
  - q:
      ar: من المعذور من الصوم؟
      en: Who is excused from fasting?
      ur: روزے سے کون معذور ہے؟
    options:
    - text:
        ar: المرضى والمسافرون والصغار
        en: the sick, travellers, young
        ur: بیمار، مسافر، بچے
      correct: true
      why:
        ar: المريض والمسافر والصغير معفوون
        en: the sick, traveller and young are exempt
        ur: بیمار، مسافر اور بچے معذور ہیں
    - text:
        ar: كل الناس
        en: everyone
        ur: ہر کوئی
      correct: false
      why:
        ar: ليس كل الناس بل أصناف
        en: not everyone, but classes
        ur: ہر کوئی نہیں، بعض قسمیں
    - text:
        ar: الكبار فقط
        en: only adults
        ur: صرف بڑے
      correct: false
      why:
        ar: ليس الكبار بل المعذور
        en: not adults; the excused
        ur: بڑے نہیں، معذور
    - text:
        ar: لا أحد
        en: no one
        ur: کوئی نہیں
      correct: false
      why:
        ar: بعض الناس معفوون
        en: some people are exempt
        ur: بعض لوگ معذور ہیں
  - q:
      ar: بماذا يبدأ الشهر؟
      en: What starts the month?
      ur: مہینہ کس سے شروع ہوتا ہے؟
    options:
    - text:
        ar: رؤية الهلال
        en: the crescent's sighting
        ur: ہلال کی رؤیت
      correct: true
      why:
        ar: يبدأ برؤية الهلال الجديد
        en: it begins with the new crescent's sighting
        ur: نئے ہلال کی رؤیت سے شروع ہوتا ہے
    - text:
        ar: أول يوم شمسي
        en: the first solar day
        ur: پہلا شمسی دن
      correct: false
      why:
        ar: ليس شمسيًا بل قمريًا
        en: lunar, not solar
        ur: شمسی نہیں، قمری
    - text:
        ar: بداية السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليس أول السنة بل هلاله
        en: its crescent, not the new year
        ur: نیا سال نہیں، اس کا ہلال
    - text:
        ar: أول أسبوع
        en: the first week
        ur: پہلا ہفتہ
      correct: false
      why:
        ar: ليس أسبوعًا بل هلالاً
        en: a crescent, not a week
        ur: ہفتہ نہیں، ہلال
  - q:
      ar: ما ختام الشهر؟
      en: How does the month close?
      ur: مہینہ کیسے ختم ہوتا ہے؟
    options:
    - text:
        ar: عيد الفطر
        en: with Eid al-Fitr
        ur: عید الفطر سے
      correct: true
      why:
        ar: يختم بعيد الفطر أول شوال
        en: it closes with Eid al-Fitr, first Shawwal
        ur: عید الفطر سے، پہلی شوال
    - text:
        ar: الحج
        en: with the Hajj
        ur: حج سے
      correct: false
      why:
        ar: الحج في ذي الحجة لا رمضان
        en: Hajj is in Dhu al-Hijja, not Ramadan
        ur: حج ذوالحجہ میں ہے، رمضان نہیں
    - text:
        ar: عيد الأضحى
        en: with Eid al-Adha
        ur: عید الاضحیٰ سے
      correct: false
      why:
        ar: الأضحى في الحج لا الفطر
        en: al-Adha is in Hajj season, not Fitr
        ur: اضحیٰ حج کے موسم میں ہے، فطر نہیں
    - text:
        ar: بداية السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليست أول السنة بل العيد
        en: Eid, not the new year
        ur: نیا سال نہیں، عید
  - q:
      ar: ما غاية الصوم الروحية؟
      en: The fast's spiritual aim?
      ur: روزے کا روحانی مقصد؟
    options:
    - text:
        ar: تزكية النفس وتقوية الإرادة
        en: cleansing soul, strengthening will
        ur: نفس کی پاکیزگی، عزم کی مضبوطی
      correct: true
      why:
        ar: تزكية وتقوية وذكرى القرآن
        en: cleansing, strengthening, Qur'an remembrance
        ur: پاکیزگی، مضبوطی، قرآن کی یاد
    - text:
        ar: إنقاص الوزن
        en: losing weight
        ur: وزن کم کرنا
      correct: false
      why:
        ar: ليس وزنًا بل تزكية
        en: soul-cleansing, not weight
        ur: وزن نہیں، پاکیزگی
    - text:
        ar: توفير الطعام
        en: saving food
        ur: کھانا بچانا
      correct: false
      why:
        ar: ليس توفيرًا بل عبادة
        en: worship, not saving
        ur: بچت نہیں، عبادت
    - text:
        ar: إثبات القوة
        en: proving strength
        ur: طاقت ثابت کرنا
      correct: false
      why:
        ar: ليس إثباتًا بل تقوى
        en: God-consciousness, not proving
        ur: ثابت کرنا نہیں، تقویٰ
  - q:
      ar: ما التراويح؟
      en: What is taraweeh?
      ur: تراویح کیا ہے؟
    options:
    - text:
        ar: صلاة الليل الجامعة
        en: the communal night prayer
        ur: باجماعت رات کی نماز
      correct: true
      why:
        ar: صلاة ليلية جامعة في رمضان
        en: a communal night prayer in Ramadan
        ur: رمضان کی باجماعت رات کی نماز
    - text:
        ar: وجبة الإفطار
        en: the iftar meal
        ur: افطار کا کھانا
      correct: false
      why:
        ar: ليست وجبة بل صلاة
        en: a prayer, not a meal
        ur: کھانا نہیں، نماز
    - text:
        ar: صيام الليل
        en: night fasting
        ur: رات کا روزہ
      correct: false
      why:
        ar: ليست صومًا بل صلاة
        en: a prayer, not fasting
        ur: روزہ نہیں، نماز
    - text:
        ar: ذكرى العيد
        en: the Eid rite
        ur: عید کی رسم
      correct: false
      why:
        ar: ليست عيدًا بل صلاة ليلية
        en: a night prayer, not Eid
        ur: عید نہیں، رات کی نماز
- id: zakat
  anchor: practice/zakat
  band: scholars
  title:
    ar: الزكاة
    en: Zakat
    ur: زکوٰت
  sixty:
    ar: 'الزكاة: ركن الإسلام الثالث — حقّ الفقراء في مال الموسرين: اثنان ونصف في المئة من المال الفائض إذا بلغ النصاب ومرّ عليه عام هجري. تُعطى للفقراء والمساكين والغارمين وفي سبيل الله وثلاث فئات أخرى ذكرها القرآن. وهي ليست صدقة يُشكَر عليها بل عبادة مالية تقوم عليها الجماعة: كانت تجبيها دولة المدينة في بيت المال، وتُخرَج اليوم بالنسبة نفسها في كلّ مكان. ومن اسمها «الزكاة» أي التطهير والنماء — فهي تطهّر المال من الحرام وتُنمّي البركة فيه، وتصل القلب بالمجتمع.  وهي أيضًا درس المساواة العملي: أن المال ليس ملكًا مطلقًا بل أمانة، وأن الحقوق المتبادلة في المجتمع تكتب على يد الشريعة نفسها.  وفيها يتعلّم المسلم أن ماله ليس كله له: ثمة نصيب ثابت لمن سواه فيه، ومن أدّاه فقد برّد قلب مجتمعه.'
    en: 'Zakat: Islam''s third pillar — the poor''s rightful share in the wealthy''s money: two and a half percent of surplus wealth once it reaches the nisab threshold and a Hijri year has passed. It goes to the poor, the needy, the debtors, in God''s cause and three other classes the Qur''an named. It is not charity to be thanked for but a financial devotion the community stands on: Medina''s state once collected it into the treasury, and today it is paid at the same rate everywhere. Its very name means purification and growth — it cleanses wealth of what is wrong, grows its blessing, and ties the heart to society.  It is also the practical lesson of equality: that wealth is not absolute ownership but a trust, and that mutual rights in society are written by revelation''s own hand.'
    ur: 'زکوٰۃ: اسلام کا تیسرا رکن — امیروں کے مال میں فقیروں کا حق: اضافی مال کا ڈھائی فیصد جب وہ نصاب تک پہنچے اور اس پر ہجری سال گزرے۔ یہ فقیروں، مسکینوں، مقروضوں، راہِ خدا اور تین دوسرے طبقوں کو دی جاتی ہے جنہیں قرآن نے گنایا۔ یہ وہ صدقہ نہیں جس پر شکریہ ادا کیا جائے بلکہ مالی عبادت ہے جس پر برادری قائم ہے: مدینہ کی ریاست اسے بیت المال میں جمع کرتی تھی اور آج دنیا بھر میں اسی شرح سے ادا ہوتی ہے۔ اس کے نام کا مطلب پاکیزگی اور بڑھوتری ہے — یہ مال کو برے سے صاف کرتی، اس میں برکت بڑھاتی اور دل کو معاشرے سے جوڑتی ہے۔  یہ مساوات کا عملی سبق بھی ہے: کہ مال مطلق ملکیت نہیں بلکہ امانت ہے، اور معاشرے میں باہمی حقوق خود وحی کی لکھی ہوئی ہیں۔'
  glossary:
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰت
    gloss:
      ar: 'العبادة المالية الثالثة في الأركان'
      en: 'the third financial pillar of the faith'
      ur: 'دین کا تیسرا مالی رکن'
  - term:
      ar: النصاب
      en: the nisab (threshold)
      ur: نصاب
    gloss:
      ar: 'الحدّ الذي يبلغه المال ليجب الصدق'
      en: 'the threshold wealth reaches for duty'
      ur: 'وہ حد جس پر پہنچ کر مال پر فرض آتا ہے'
  - term:
      ar: ٢.٥ بالمئة
      en: 2.5 percent
      ur: ڈھائی فیصد
    gloss:
      ar: 'النسبة الثابتة في المال الفائض'
      en: 'the fixed share in surplus wealth'
      ur: 'اضافی مال میں مقررہ حصہ'
  - term:
      ar: الفقراء
      en: the poor
      ur: فقیر
    gloss:
      ar: 'الفئة الأولى من المستحقين'
      en: 'the first class of the deserving'
      ur: 'مستحقین کا پہلا طبقہ'
  - term:
      ar: المحتاجون
      en: the needy
      ur: ضرورت مند
    gloss:
      ar: 'الفئة الثانية من المستحقين'
      en: 'the second class of the deserving'
      ur: 'مستحقین کا دوسرا طبقہ'
  - term:
      ar: المدينون
      en: the debtors
      ur: مقروض
    gloss:
      ar: 'الفئة التي سقطت ديونها'
      en: 'the class whose debts are lifted'
      ur: 'وہ طبقہ جس کے قرضے اتر جاتے ہیں'
  - term:
      ar: العبادة
      en: worship
      ur: عبادت
    gloss:
      ar: 'العمل الذي ليس صدقة تطوّعية'
      en: 'the act that is not voluntary charity'
      ur: 'وہ عمل جو رضاکارانہ صدقہ نہیں'
  - term:
      ar: بيت المال
      en: the treasury
      ur: بیت المال
    gloss:
      ar: 'خزينة الدولة الإسلامية القديمة'
      en: 'the old Islamic state''s treasury'
      ur: 'قدیم اسلامی ریاست کی خزانہ'
  - term:
      ar: المال الفائض
      en: surplus wealth
      ur: فاضل مال
    gloss:
      ar: 'المال الذي يزيد على الحاجة'
      en: 'the wealth exceeding need'
      ur: 'ضرورت سے بڑھا ہوا مال'
  - term:
      ar: الصدقة
      en: sadaqah (voluntary)
      ur: صدقہ
    gloss:
      ar: 'الصدقة الاختيارية فوق الواجب'
      en: 'voluntary alms beyond the duty'
      ur: 'فرض سے بڑھ کر رضاکارانہ صدقہ'
  - term:
      ar: التطهير
      en: purification
      ur: پاکیزگی
    gloss:
      ar: 'معنى الاسم من الطهارة والنماء'
      en: 'the name''s meaning from purity and growth'
      ur: 'نام کا مطلب — پاکیزگی اور بڑھوتری'
  - term:
      ar: الأصناف الثمانية
      en: the eight classes
      ur: آٹھ گروہ
    gloss:
      ar: 'الفئات التي عدّدها القرآن'
      en: 'the classes the Qur''an enumerated'
      ur: 'وہ طبقے جنہیں قرآن نے گنایا'
  practice:
  - q:
      ar: ما ركن الزكاة في الإسلام؟
      en: Which pillar is zakat?
      ur: زکوٰت اسلام کا کون سا رکن ہے؟
    options:
    - text:
        ar: الثالث
        en: the third
        ur: تیسرا
      correct: true
      why:
        ar: الزكاة الركن الثالث بعد الصلاة
        en: zakat is the third pillar after prayer
        ur: زکوٰت نماز کے بعد تیسرا رکن ہے
    - text:
        ar: الأول
        en: the first
        ur: پہلا
      correct: false
      why:
        ar: الأول الشهادة لا الزكاة
        en: the first is the testimony
        ur: پہلا شہادت ہے
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: الرابع الصوم لا الزكاة
        en: the fourth is fasting
        ur: چوتھا روزہ ہے
    - text:
        ar: الخامس
        en: the fifth
        ur: پانچواں
      correct: false
      why:
        ar: الخامس الحج لا الزكاة
        en: the fifth is Hajj
        ur: پانچواں حج ہے
  - q:
      ar: كم معدلها على الادّخار؟
      en: Its rate on savings?
      ur: بچت پر اس کی شرح؟
    options:
    - text:
        ar: نحو ٢.٥ بالمئة
        en: about 2.5 percent
        ur: تقریباً ڈھائی فیصد
      correct: true
      why:
        ar: ٢.٥ بالمئة على الادّخار
        en: 2.5 percent on saved wealth
        ur: بچت پر ڈھائی فیصد
    - text:
        ar: ١٠ بالمئة
        en: 10 percent
        ur: دس فیصد
      correct: false
      why:
        ar: ١٠ بالمئة أكثر من معدلها
        en: 10 percent exceeds its rate
        ur: دس فیصد اس سے زیادہ ہے
    - text:
        ar: ١ بالمئة
        en: 1 percent
        ur: ایک فیصد
      correct: false
      why:
        ar: ١ بالمئة أقل من معدلها
        en: 1 percent is below its rate
        ur: ایک فیصد اس سے کم ہے
    - text:
        ar: ٢٥ بالمئة
        en: 25 percent
        ur: پچیس فیصد
      correct: false
      why:
        ar: ٢٥ بالمئة أكثر بكثير
        en: 25 percent is far more
        ur: پچیس فیصد بہت زیادہ ہے
  - q:
      ar: على ماذا تجب؟
      en: On what is it due?
      ur: یہ کس چیز پر لازم ہے؟
    options:
    - text:
        ar: المال الفائض
        en: surplus wealth
        ur: فاضل مال
      correct: true
      why:
        ar: تجب على الفائض فوق النصاب
        en: due on surplus above the nisab
        ur: نصاب سے اوپر فاضل پر واجب
    - text:
        ar: كل دخل يومي
        en: all daily income
        ur: ہر روز کی آمدنی
      correct: false
      why:
        ar: ليس كل دخل بل الفائض
        en: surplus, not all income
        ur: ہر آمدنی نہیں، فاضل
    - text:
        ar: الهدايا
        en: gifts
        ur: تحائف
      correct: false
      why:
        ar: ليست هدايا بل مال فائض
        en: surplus wealth, not gifts
        ur: تحائف نہیں، فاضل مال
    - text:
        ar: الوقت
        en: time
        ur: وقت
      correct: false
      why:
        ar: ليست وقتًا بل مالاً
        en: wealth, not time
        ur: وقت نہیں، مال
  - q:
      ar: لمن تذهب؟
      en: To whom does it go?
      ur: یہ کس کو ملتی ہے؟
    options:
    - text:
        ar: الفقراء والمحتاجون
        en: the poor and needy
        ur: فقیروں اور ضرورت مندوں کو
      correct: true
      why:
        ar: الفقراء والمحتاجون والمدينون وأصناف
        en: poor, needy, debtors and named classes
        ur: فقیر، ضرورت مند، مقروض اور نامزد گروہ
    - text:
        ar: الحكّام فقط
        en: only rulers
        ur: صرف حکمرانوں کو
      correct: false
      why:
        ar: ليست حكّامًا بل مستحقين
        en: to the deserving, not rulers
        ur: حکمرانوں کو نہیں، مستحقین کو
    - text:
        ar: الأغنياء
        en: the rich
        ur: امیروں کو
      correct: false
      why:
        ar: ليست أغنياء بل فقراء
        en: to the poor, not rich
        ur: امیروں کو نہیں، فقیروں کو
    - text:
        ar: السائحون
        en: tourists
        ur: سیاحوں کو
      correct: false
      why:
        ar: ليست سائحين بل أصناف محددة
        en: to named classes, not tourists
        ur: سیاحوں کو نہیں، نامزد گروہوں کو
  - q:
      ar: ما الفرق بينها والضريبة؟
      en: How does it differ from tax?
      ur: یہ ٹیکس سے کیسے مختلف ہے؟
    options:
    - text:
        ar: عبادة لا ضريبة
        en: worship, not tax
        ur: عبادت، ٹیکس نہیں
      correct: true
      why:
        ar: الزكاة عبادة تطهر المال لا جباية
        en: zakat is worship cleansing wealth, not levy
        ur: زکوٰت مال پاک کرنے والی عبادت ہے، وصولی نہیں
    - text:
        ar: مثلها تمامًا
        en: exactly like tax
        ur: بالکل ٹیکس جیسی
      correct: false
      why:
        ar: ليست ضريبة بل عبادة
        en: worship, not tax
        ur: ٹیکس نہیں، عبادت
    - text:
        ar: أقل قيمة
        en: less in value
        ur: کم قدر
      correct: false
      why:
        ar: ليس أقل بل معنى مختلف
        en: different in meaning, not less
        ur: کم نہیں، مختلف معنی
    - text:
        ar: اختيارية
        en: voluntary
        ur: رضاکارانہ
      correct: false
      why:
        ar: ليست اختيارية بل واجبة
        en: obligatory, not voluntary
        ur: رضاکارانہ نہیں، لازم
  - q:
      ar: ما النصاب؟
      en: What is the nisab?
      ur: نصاب کیا ہے؟
    options:
    - text:
        ar: حد المال الذي تجب فيه
        en: the wealth threshold for zakat
        ur: وہ حد جس پر زکوٰت واجب ہوتی ہے
      correct: true
      why:
        ar: أدنى مال فائض تبدأ فيه الزكاة
        en: the minimum surplus at which zakat starts
        ur: کم از کم فاضل جس پر زکوٰت شروع ہوتی ہے
    - text:
        ar: كل المال
        en: all wealth
        ur: تمام مال
      correct: false
      why:
        ar: ليس كل المال بل الحد
        en: a threshold, not all wealth
        ur: تمام مال نہیں، حد
    - text:
        ar: دين الدولة
        en: the state debt
        ur: ریاست کا قرض
      correct: false
      why:
        ar: ليس دينًا بل حد مال
        en: a wealth threshold, not debt
        ur: قرض نہیں، مال کی حد
    - text:
        ar: سنة الصوم
        en: the fasting year
        ur: روزے کا سال
      correct: false
      why:
        ar: ليس وقتًا بل مالاً
        en: a wealth measure, not time
        ur: وقت نہیں، مال
  - q:
      ar: من الأصناف المستحقة؟
      en: Which classes deserve it?
      ur: مستحق گروہ کون سے ہیں؟
    options:
    - text:
        ar: الفقراء والمحتاجون والمدينون
        en: poor, needy, debtors
        ur: فقیر، ضرورت مند، مقروض
      correct: true
      why:
        ar: ثمانية أصناف بينها الفقراء والمدينون
        en: eight classes including poor and debtors
        ur: آٹھ گروہ جن میں فقیر اور مقروض ہیں
    - text:
        ar: الكبار فقط
        en: only elders
        ur: صرف بڑے
      correct: false
      why:
        ar: ليست كبارًا بل أصناف محددة
        en: named classes, not just elders
        ur: صرف بڑے نہیں، نامزد گروہ
    - text:
        ar: العمّال فقط
        en: only workers
        ur: صرف مزدور
      correct: false
      why:
        ar: ليست عمّالًا بل أصناف
        en: named classes, not just workers
        ur: صرف مزدور نہیں، گروہ
    - text:
        ar: الأهل فقط
        en: only family
        ur: صرف خاندان
      correct: false
      why:
        ar: ليست أهلًا بل مستحقين
        en: the deserving, not just family
        ur: صرف خاندان نہیں، مستحق
  - q:
      ar: ما بيت المال؟
      en: What was the treasury?
      ur: بیت المال کیا تھا؟
    options:
    - text:
        ar: خزانة الدولة للزكاة
        en: the state's zakat treasury
        ur: زکوٰت کی ریاستی خزانہ
      correct: true
      why:
        ar: نظمت بيت المال جمع الزكاة وتوزيعها
        en: the treasury organised zakat's collection and share
        ur: بیت المال نے زکوٰت کی جمع اور تقسیم مرتب کی
    - text:
        ar: بنك تجاري
        en: a commercial bank
        ur: تجارتی بینک
      correct: false
      why:
        ar: ليست بنكًا بل خزانة
        en: a treasury, not a bank
        ur: بینک نہیں، خزانہ
    - text:
        ar: مخزن حبوب
        en: a grain store
        ur: اناج کا گودام
      correct: false
      why:
        ar: ليست مخزنًا بل خزانة
        en: a treasury, not a store
        ur: گودام نہیں، خزانہ
    - text:
        ar: بيت الخليفة
        en: the caliph's house
        ur: خلیفہ کا گھر
      correct: false
      why:
        ar: ليست بيتًا خاصًا
        en: not a private house
        ur: نجی گھر نہیں
  - q:
      ar: ما الفرق بينها والصدقة؟
      en: Zakat vs. sadaqah?
      ur: زکوٰت اور صدقہ میں فرق؟
    options:
    - text:
        ar: واجبة مقابل اختيارية
        en: obligatory vs. voluntary
        ur: لازم بمقابلہ رضاکارانہ
      correct: true
      why:
        ar: الزكاة واجبة والصدقة اختيارية
        en: zakat is required, sadaqah voluntary
        ur: زکوٰت واجب ہے، صدقہ رضاکارانہ
    - text:
        ar: مثلها تمامًا
        en: exactly alike
        ur: بالکل ایک جیسی
      correct: false
      why:
        ar: ليستا متساويتين
        en: they are not the same
        ur: یہ برابر نہیں
    - text:
        ar: الصدقة أكبر
        en: sadaqah is bigger
        ur: صدقہ بڑا ہے
      correct: false
      why:
        ar: ليست قيمة بل وجوب
        en: the difference is obligation, not size
        ur: قدر نہیں، لزوم کا فرق
    - text:
        ar: الصدقة للفقراء فقط
        en: sadaqah only for poor
        ur: صدقہ صرف فقیروں کو
      correct: false
      why:
        ar: الصدقة لأحد والزكاة واجبة
        en: sadaqah is free; zakat is required
        ur: صدقہ آزاد ہے؛ زکوٰت لازم
  - q:
      ar: ما معنى «تطهير المال»؟
      en: What does 'cleansing wealth' mean?
      ur: مال کی پاکیزگی کا کیا مطلب؟
    options:
    - text:
        ar: تنقية النفس والمال بالعطاء
        en: cleansing soul and wealth by giving
        ur: عطیہ سے نفس اور مال کی پاکیزگی
      correct: true
      why:
        ar: العطاء ينقّي القلب والمال من الشح
        en: giving cleans heart and wealth of greed
        ur: عطیہ دل اور مال کو بخل سے پاک کرتا ہے
    - text:
        ar: غسل العملة
        en: washing coins
        ur: سکے دھونا
      correct: false
      why:
        ar: ليست غسلًا بل تنقية
        en: cleansing, not washing
        ur: دھونا نہیں، پاکیزگی
    - text:
        ar: تجميع المال
        en: hoarding wealth
        ur: مال جمع کرنا
      correct: false
      why:
        ar: ليس تجميعًا بل إخراج
        en: releasing, not hoarding
        ur: جمع نہیں، اخراج
    - text:
        ar: إخفاء الثروة
        en: hiding wealth
        ur: دولت چھپانا
      correct: false
      why:
        ar: ليس إخفاءً بل تطهير
        en: purifying, not hiding
        ur: چھپانا نہیں، پاکیزگی
- id: bayt-al-hikma
  anchor: building/bayt-al-hikma
  band: researchers
  title:
    ar: بيت الحكمة
    en: The House of Wisdom
    ur: بیت الحکمت
  sixty:
    ar: 'بيت الحكمة في بغداد: مكتبة الخلفاء العباسيين ومركز الترجمة الكبرى في القرن التاسع. في عهد المأمون صار مقرًّا للعلماء: الخوارزمي يكتب الجبر فيه، ونسّاخ ينقلون اليونانية والفارسية والسنسكريتية إلى العربية، ومراصد تُقاس فيها السماء، ومترجمون كحنين بن إسحاق يتقاضون وزن كتبهم ذهبًا. منه خرجت حركة الترجمة التي حفظت علم اليونان للعالم حين كانت أوروبا نائمة، وجمعت علم الهند وفارس ومصر القديمة في لغة واحدة. وبهذا كان بيت الحكمة أول «جامعة» إسلامية: ليس مدرسة فقه فقط بل دار معرفة مفتوحة على كلّ علم.  وبهذا صار رمز الإسلام للتسامح العلمي: أن تكون كلّ لغة ولغة، وأن يكون كلّ علم علمًا لله — فالبيت كان داراً للجماعة بأوسع معانيها.  وبقي اسمها على لسان أهل العلم إلى اليوم: كلما ذُكرت حركة الترجمة ذُكرت بغداد وبيت الحكمة فيها.'
    en: 'The House of Wisdom in Baghdad: the Abbasid caliphs'' library and the ninth century''s great translation centre. Under al-Ma''mun it became the scholars'' seat: al-Khwarizmi wrote his algebra there, copyists carried Greek, Persian and Sanskrit into Arabic, observatories measured the sky, and translators like Hunayn ibn Ishaq were paid the weight of their books in gold. Out of it came the translation movement that preserved Greek learning for the world while Europe slept, joining the sciences of India, Persia and old Egypt in one language. So the House of Wisdom was Islam''s first ''university'' — not just a law school but a house of knowledge open to every science.  Thus it became Islam''s emblem of scholarly tolerance: that every tongue is a tongue and every science a science of God — for the House was a house of the whole community in its widest sense.'
    ur: 'بغداد میں بیت الحکمت: عباسی خلفاء کی کتب خانہ اور نویں صدی کا عظیم ترجمہ مرکز۔ مامون کے دور میں یہ علماء کی نشست بنا: خوارزمی نے یہاں اپنا الجبر لکھا، نسخہ نویسوں نے یونانی، فارسی اور سنسکرت کو عربی میں منتقل کیا، رصد گاہوں نے آسمان ناپا، اور مترجمین جیسے حنین بن اسحاق اپنی کتابوں کے وزن کے برابر سونا پاتے تھے۔ اسی سے ترجمے کی وہ تحریک نکلی جس نے یونانی علم کو اس وقت دنیا کے لیے محفوظ کیا جب یورپ سویا ہوا تھا، اور ہند، فارس اور قدیم مصر کے علوم ایک زبان میں جمع کیے۔ اس طرح بیت الحکمت اسلام کا پہلا جامعہ تھا — صرف فقہ کا مدرسہ نہیں بلکہ ہر علم پر کھلا علم کا گھر۔  اسی لیے یہ اسلام کی علمی برداشت کی علامت بنا: کہ ہر زبان زبان ہے اور ہر علم خدا کا علم — کیونکہ یہ گھر وسیع ترین معنوں میں پوری برادری کا گھر تھا۔'
  glossary:
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: 'مدينة الخلفاء ومركز الترجمة'
      en: 'the caliphs'' city and translation centre'
      ur: 'خلفاء کا شہر اور ترجمہ مرکز'
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'السلالة التي بنته في عصرها'
      en: 'the dynasty that built it in its era'
      ur: 'وہ خاندان جس نے اپنے دور میں اسے بنایا'
  - term:
      ar: المأمون
      en: al-Ma'mun
      ur: المامون
    gloss:
      ar: 'الخليفة الذي بلغ بذلك القمة'
      en: 'the caliph who took it to the summit'
      ur: 'وہ خلیفہ جس نے اسے عروج پر پہنچایا'
  - term:
      ar: الترجمة
      en: translation
      ur: ترجمہ
    gloss:
      ar: 'حركة نقل العلوم إلى العربية'
      en: 'the movement carrying sciences into Arabic'
      ur: 'علوم کو عربی میں لانے والی تحریک'
  - term:
      ar: الخوارزمي
      en: al-Khwarizmi
      ur: خوارزمی
    gloss:
      ar: 'عالِم الجبر الذي عمل فيه'
      en: 'the algebra scholar who worked there'
      ur: 'وہ الجبر کا عالم جس نے وہاں کام کیا'
  - term:
      ar: المكتبة
      en: the library
      ur: کتب خانہ
    gloss:
      ar: 'مكان الكتب والمخطوطات'
      en: 'the place of books and manuscripts'
      ur: 'کتابوں اور مخطوطوں کی جگہ'
  - term:
      ar: الورّاقون
      en: the copyists
      ur: نسخہ نویس
    gloss:
      ar: 'الذين ينسخون النصوص'
      en: 'those who copy the texts'
      ur: 'وہ جو متن نقل کرتے ہیں'
  - term:
      ar: الفلك
      en: astronomy
      ur: فلک
    gloss:
      ar: 'رصد السماء في الخدمة'
      en: 'sky-watching in its service'
      ur: 'اس کی خدمت میں آسمان کی رصد'
  - term:
      ar: الجبر
      en: algebra
      ur: الجبر
    gloss:
      ar: 'علم المعادلات الذي كُتب فيه'
      en: 'the equation-science written there'
      ur: 'مساواتوں کا وہ علم جو وہاں لکھا گیا'
  - term:
      ar: المرصد
      en: the observatory
      ur: رصد گاہ
    gloss:
      ar: 'مكان قياس النجوم'
      en: 'the place of star-measuring'
      ur: 'ستارے ناپنے کی جگہ'
  - term:
      ar: المترجمون
      en: the translators
      ur: مترجم
    gloss:
      ar: 'الذين ينقلون الكتب لغةً لغة'
      en: 'those who carry books tongue to tongue'
      ur: 'وہ جو کتابیں زبان در زبان لے جاتے ہیں'
  - term:
      ar: حركة الترجمة
      en: the translation movement
      ur: ترجمہ تحریک
    gloss:
      ar: 'الحركة التي حفظت علم اليونان'
      en: 'the movement that saved Greek learning'
      ur: 'وہ تحریک جس نے یونانی علم محفوظ کیا'
  practice:
  - q:
      ar: في أيّ مدينة قام؟
      en: In which city did it stand?
      ur: یہ کس شہر میں تھا؟
    options:
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: true
      why:
        ar: في بغداد العاصمة العباسية
        en: in Baghdad, the Abbasid capital
        ur: عباسی پایہ تخت بغداد میں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة مدينة دار الحكمة الفاطمية
        en: Cairo held the Fatimid house
        ur: قاہرہ میں فاطمی دار الحکمت تھا
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق عاصمة الأمويين لا العباسيين
        en: Damascus was the Umayyad capital
        ur: دمشق امویوں کی دارالحکومت تھی
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: false
      why:
        ar: قرطبة في الأندلس لا بغداد
        en: Cordoba was in al-Andalus, not Baghdad
        ur: قرطبہ الاندلس میں تھا، بغداد نہیں
  - q:
      ar: في أيّ قرن اشتهر؟
      en: In which century did it flourish?
      ur: یہ کس صدی میں پھلا؟
    options:
    - text:
        ar: القرن التاسع
        en: the ninth century
        ur: نویں صدی
      correct: true
      why:
        ar: ازدهر في القرن التاسع الميلادي
        en: it flourished in the ninth century CE
        ur: یہ نویں صدی عیسوی میں پھلا
    - text:
        ar: القرن الخامس عشر
        en: the fifteenth century
        ur: پندرہویں صدی
      correct: false
      why:
        ar: القرن الخامس عشر متأخر عنه
        en: the fifteenth century is later
        ur: پندرہویں صدی بعد کی ہے
    - text:
        ar: القرن الخامس
        en: the fifth century
        ur: پانچویں صدی
      correct: false
      why:
        ar: القرن الخامس قبل الإسلام
        en: the fifth century predates Islam
        ur: پانچویں صدی اسلام سے پہلے ہے
    - text:
        ar: القرن العشرون
        en: the twentieth century
        ur: بیسویں صدی
      correct: false
      why:
        ar: القرن العشرون متأخر جدًا
        en: the twentieth is far later
        ur: بیسویں صدی بہت بعد کی ہے
  - q:
      ar: من الخليفة المشهور بدعمه؟
      en: Which caliph famously patronised it?
      ur: کون سا خلیفہ اس کی سرپرستی میں مشہور تھا؟
    options:
    - text:
        ar: المأمون
        en: al-Ma'mun
        ur: المامون
      correct: true
      why:
        ar: المأمون اشتهر بدعم العلم والترجمة
        en: al-Ma'mun is famed for backing learning and translation
        ur: المامون علم اور ترجمہ کی حمایت میں مشہور ہے
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: عبد الملك أموي قبله
        en: Abd al-Malik was an earlier Umayyad
        ur: عبدالملک پہلا اموی تھا
    - text:
        ar: هارون فقط
        en: Harun alone
        ur: صرف ہارون
      correct: false
      why:
        ar: هارون بدأه لكن المأمون أشهر من دعمه
        en: Harun began it but al-Ma'mun is the famed patron
        ur: ہارون نے شروع کیا مگر المامون مشہور سرپرست ہے
    - text:
        ar: المعتصم
        en: al-Mu'tasim
        ur: المعتصم
      correct: false
      why:
        ar: المعتصم بعد المأمون
        en: al-Mu'tasim came after al-Ma'mun
        ur: المعتصم المامون کے بعد تھا
  - q:
      ar: ما الذي حدث فيه؟
      en: What happened inside it?
      ur: اس میں کیا ہوتا تھا؟
    options:
    - text:
        ar: ترجمة العلوم إلى العربية
        en: translating sciences into Arabic
        ur: علوم کی عربی میں منتقلی
      correct: true
      why:
        ar: نُقلت كتب اليونان وفارس والهند إلى العربية
        en: Greek, Persian and Indian books were rendered into Arabic
        ur: یونانی، فارسی اور ہندوستانی کتابیں عربی میں آئیں
    - text:
        ar: حروب كلامية فقط
        en: only debates
        ur: صرف مباحثے
      correct: false
      why:
        ar: ليست كلامًا بل ترجمة وعمل
        en: not talk alone but translation and work
        ur: صرف بحث نہیں، ترجمہ اور کام
    - text:
        ar: تجارة كتب
        en: book trade
        ur: کتابوں کی تجارت
      correct: false
      why:
        ar: ليس سوقًا بل دار علم
        en: a house of learning, not a market
        ur: بازار نہیں، علم کا گھر
    - text:
        ar: اجتماع حكّام فقط
        en: only rulers' meetings
        ur: صرف حکمرانوں کی میٹنگ
      correct: false
      why:
        ar: ليس اجتماعًا بل عمل علمي
        en: not meetings but scholarly work
        ur: میٹنگ نہیں، علمی کام
  - q:
      ar: من العالم المشهور الذي عمل فيه؟
      en: Which famed scholar worked there?
      ur: کون سا مشہور عالم وہاں کام کرتا تھا؟
    options:
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: true
      why:
        ar: الخوارزمي عمل فيه على الجبر
        en: al-Khwarizmi worked there on algebra
        ur: خوارزمی وہاں الجبر پر کام کرتا تھا
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا بعده بقرنين
        en: Ibn Sina came two centuries later
        ur: ابن سینا دو صدیوں بعد تھا
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا عالم فيه
        en: Ibn Battuta was a traveller, not a scholar there
        ur: ابن بطوطہ مسافر تھا، وہاں کا عالم نہیں
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون بعده بقرون
        en: Ibn Khaldun came centuries later
        ur: ابن خلدون صدیاں بعد تھا
  - q:
      ar: ما «حركة الترجمة»؟
      en: What was the translation movement?
      ur: ترجمہ تحریک کیا تھی؟
    options:
    - text:
        ar: نقل علوم الأمم إلى العربية
        en: carrying nations' learning into Arabic
        ur: قوموں کا علم عربی میں لانا
      correct: true
      why:
        ar: موجة نقلت كتب اليونان وفارس والهند
        en: a wave carrying Greek, Persian and Indian books
        ur: لہر جو یونانی، فارسی اور ہندوستانی کتابیں لائی
    - text:
        ar: ترجمة الشعر فقط
        en: translating poetry only
        ur: صرف شاعری کا ترجمہ
      correct: false
      why:
        ar: ليست شعرًا بل علومًا
        en: not poetry but sciences
        ur: شاعری نہیں، علوم
    - text:
        ar: نسخ الكتب يدويًا
        en: copying books by hand
        ur: ہاتھ سے کتابیں نقل کرنا
      correct: false
      why:
        ar: ليس نسخًا بل نقل لغة
        en: not copying but translating
        ur: نقل نہیں، ترجمہ
    - text:
        ar: إرسال كتب خارجًا
        en: sending books out
        ur: کتابیں باہر بھیجنا
      correct: false
      why:
        ar: ليس إرسالًا بل استيراد
        en: not sending out but bringing in
        ur: باہر بھیجنا نہیں، اندر لانا
  - q:
      ar: ما الدور الذي لعبه في العلم؟
      en: What role did it play in science?
      ur: اس کا علم میں کیا کردار تھا؟
    options:
    - text:
        ar: حفظ علوم الأمم وتطويرها
        en: preserving and advancing nations' learning
        ur: قوموں کے علم کی حفاظت اور ترقی
      correct: true
      why:
        ar: حفظ علوم اليونان وطوّرها بالعربية
        en: it kept Greek learning and advanced it in Arabic
        ur: اس نے یونانی علم بچایا اور عربی میں ترقی دی
    - text:
        ar: إتلاف الكتب القديمة
        en: destroying old books
        ur: پرانی کتابیں ضائع کرنا
      correct: false
      why:
        ar: لم يتلف بل حفظ وطوّر
        en: it did not destroy; it preserved and advanced
        ur: اس نے ضائع نہیں کیا، بچایا اور ترقی دی
    - text:
        ar: منع التعليم
        en: banning learning
        ur: تعلیم پر پابندی
      correct: false
      why:
        ar: لم يمنع بل رعى العلم
        en: it did not ban; it sponsored learning
        ur: اس نے پابندی نہیں لگائی، سرپرستی کی
    - text:
        ar: نسخ القرآن فقط
        en: copying scripture only
        ur: صرف صحیفہ نقل کرنا
      correct: false
      why:
        ar: ليس نسخًا بل ترجمة علوم
        en: not copying but translating sciences
        ur: نقل نہیں، علوم کا ترجمہ
  - q:
      ar: ما مصيره؟
      en: What became of it?
      ur: اس کا کیا انجام ہوا؟
    options:
    - text:
        ar: دُمّر في السقوط المغولي
        en: destroyed in the Mongol sack
        ur: منگول حملے میں تباہ ہوا
      correct: true
      why:
        ar: دمّره المغول مع بغداد عام ١٢٥٨
        en: the Mongols destroyed it with Baghdad in 1258
        ur: منگولوں نے 1258 میں بغداد کے ساتھ تباہ کیا
    - text:
        ar: بقي حتى اليوم
        en: it survives today
        ur: آج تک باقی ہے
      correct: false
      why:
        ar: لم يبقَ بل دُمّر
        en: it did not survive; it was destroyed
        ur: یہ باقی نہیں رہا، تباہ ہوا
    - text:
        ar: تحوّل إلى مسجد
        en: it became a mosque
        ur: مسجد بن گیا
      correct: false
      why:
        ar: لم يتحوّل بل دُمّر
        en: it was destroyed, not converted
        ur: یہ تبدیل نہیں ہوا، تباہ ہوا
    - text:
        ar: انتقل إلى مصر
        en: it moved to Egypt
        ur: مصر منتقل ہوا
      correct: false
      why:
        ar: لم ينتقل بل باد
        en: it perished, did not move
        ur: یہ منتقل نہیں ہوا، ختم ہوا
  - q:
      ar: ما المرصد المرتبط به؟
      en: What was its linked observatory?
      ur: اس سے منسلک رصد گاہ کیا تھی؟
    options:
    - text:
        ar: رصد النجوم للمأمون
        en: al-Ma'mun's star-watching
        ur: المامون کی نجومی رصد
      correct: true
      why:
        ar: رصد الفلك في بغداد ودمشق
        en: star-watching in Baghdad and Damascus
        ur: بغداد اور دمشق میں فلکیاتی رصد
    - text:
        ar: مرصد الفاتيكان
        en: the Vatican observatory
        ur: ویٹیکن رصد گاہ
      correct: false
      why:
        ar: ليس الفاتيكان بل الإسلامي
        en: not the Vatican but the Islamic one
        ur: ویٹیکن نہیں، اسلامی
    - text:
        ar: تليسكوب حديث
        en: a modern telescope
        ur: جدید دوربین
      correct: false
      why:
        ar: لا تليسكوب بل رصد قديم
        en: no telescope; ancient observation
        ur: دوربین نہیں، قدیم رصد
    - text:
        ar: غير موجود
        en: none existed
        ur: کوئی نہیں تھا
      correct: false
      why:
        ar: كان المرصد جزءًا من حركته العلمية
        en: an observatory was part of its science
        ur: رصد گاہ اس کی علمی تحریک کا حصہ تھی
  - q:
      ar: لماذا يُعدّ محورًا في تاريخ المعرفة؟
      en: Why is it a pivot in knowledge history?
      ur: یہ علم کی تاریخ میں محور کیوں ہے؟
    options:
    - text:
        ar: لترجمته التي غيّرت العالم
        en: for the translation that changed the world
        ur: دنیا بدلنے والے ترجمہ کے لیے
      correct: true
      why:
        ar: نقل علوم الأمم فأثر في أوروبا والعالم
        en: it carried nations' learning and influenced Europe
        ur: اس نے قوموں کا علم لایا اور یورپ پر اثر ڈالا
    - text:
        ar: لبنائه الضخم فقط
        en: for its large building only
        ur: صرف بڑی عمارت کے لیے
      correct: false
      why:
        ar: ليست العمارة بل العلم فيه
        en: not the building but the learning
        ur: عمارت نہیں، علم
    - text:
        ar: لأطول مكتبة
        en: for the longest library
        ur: لمبی کتب خانہ کے لیے
      correct: false
      why:
        ar: ليست أطولًا بل أثرها
        en: not longest but its influence
        ur: لمبی نہیں، اس کا اثر
    - text:
        ar: لأول خريطة
        en: for the first map
        ur: پہلے نقشے کے لیے
      correct: false
      why:
        ar: ليست أول خريطة بل أثر علم
        en: not first map but scholarly influence
        ur: پہلا نقشہ نہیں، علمی اثر
- id: damascus
  anchor: place/damascus
  band: researchers
  title:
    ar: دمشق
    en: Damascus
    ur: دمشق
  sixty:
    ar: 'دمشق: أقدم مدينة مأهولة مستمرة في ذاكرة البشر، وعاصمة الخلافة الأموية تسعة عقودًا. بناها الآراميون قديمًا وعرفها الروم والبيزنطيون، وجعلها معاوية بن أبي سفيان قلب دولته سنة ٦٦١، فخرج منها الفتح إلى الأندلس والسند. فيها الجامع الأموي على معبد يوحنا ومئذنة عيسى التي يُروى أنّه ينزل عندها، وأسواق الحميدية والمدارس النورية التي بناها نور الدين قبل صلاح الدين، وحمّاماتها القديمة وحاراتها العربية. وبقيت مدينة الذاكرة الطويلة: كلّ عصر ترك فيها حيًّا أو حجرًا، حتى صارت كتاب الشام المفتوح على كلّ عصوره.  وبقيت في ذاكرة الإسلام مدينة الأمويين أولا — لكنّها أقدم منهم وأسمى: مدينة المسلمين كلّهم، من أيّ عصر جاؤوا فيه.  وفي كلّ قرن بقي لها دور: مركز خلافة ثم مركز مقاومة ثم مركز علم، وما برحت الشام في قلب الإسلام.'
    en: 'Damascus: the oldest continuously inhabited city in human memory, and the Umayyad caliphate''s capital for nine decades. The Arameans built it in antiquity, Rome and Byzantium knew it, and Mu''awiya ibn Abi Sufyan made it the heart of his state in 661 — from it the conquests went out to al-Andalus and Sindh. It holds the Umayyad Mosque over John''s temple and the Jesus minaret where tradition says he will descend, the Hamidiyeh markets and the Nuri schools Nur al-Din built before Saladin, its old bathhouses and Arab lanes. It stayed the city of long memory: every era left a quarter or a stone, until it became Syria''s open book on all its ages.  She stayed in Islam''s memory the Umayyads'' city first — yet older and loftier than them: the Muslims'' city entire, whatever age they came to her in.'
    ur: 'دمشق: انسانی یادداشت کا قدیم ترین مسلسل بسا ہوا شہر، اور نوے برس اموی خلافت کا دارالحکومت۔ قدیم زمانے میں آرامیوں نے بسایا، روم اور بازنطین نے جانا، اور معاویہ بن ابی سفیان نے 661 میں اپنی ریاست کا دل بنایا — یہیں سے فتوحات اندلس اور سندھ تک گئیں۔ اس میں یحییٰ کے معبد پر اموی مسجد ہے اور عیسیٰ کا مینار جہاں روایت ہے وہ نازل ہوں گے، حمیدیہ کے بازار اور نور الدین کے نوری مدارس جو صلاح الدین سے پہلے بنے، اس کے پرانے حمام اور عرب گلیاں۔ یہ لمبی یادداشت کا شہر رہا: ہر دور نے کوئی محلہ یا پتھر چھوڑا یہاں تک کہ یہ شام کی کھلی کتاب بنا۔  یہ اسلام کی یادداشت میں پہلے امویوں کا شہر رہا — مگر ان سے قدیم اور عظیم: تمام مسلمانوں کا شہر، جس دور میں بھی وہ اس پر آئے۔'
  glossary:
  - term:
      ar: الشام
      en: the Levant / Syria
      ur: شام
    gloss:
      ar: 'الإقليم الذي هي عاصمته'
      en: 'the region she is capital of'
      ur: 'وہ خطہ جس کا یہ دارالحکومت ہے'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة التي جعلتها قلب الدولة'
      en: 'the dynasty that made her the state''s heart'
      ur: 'وہ خاندان جس نے اسے ریاست کا دل بنایا'
  - term:
      ar: معاوية
      en: Mu'awiya
      ur: معاویہ
    gloss:
      ar: 'الخلف الذي نقل العاصمة إليها'
      en: 'the caliph who moved the capital to her'
      ur: 'وہ خلیفہ جس نے دارالحکومت اس میں منتقل کیا'
  - term:
      ar: الجامع الأموي
      en: the Umayyad Mosque
      ur: اموی مسجد
    gloss:
      ar: 'الجامع الذي يحمل اسم السلالة'
      en: 'the mosque carrying the dynasty''s name'
      ur: 'وہ مسجد جو خاندان کا نام اٹھاتی ہے'
  - term:
      ar: مئذنة عيسى
      en: the Jesus minaret
      ur: عیسائی مینار
    gloss:
      ar: 'المئذنة التي ينزل عندها المسيح'
      en: 'the minaret Christ descends at per tradition'
      ur: 'وہ مینار جہاں روایت کے مطابق مسیح نازل ہوں گے'
  - term:
      ar: قبر يوحنا
      en: John the Baptist's grave
      ur: یحییٰ کی قبر
    gloss:
      ar: 'قبر النبي في جدار المسجد'
      en: 'the prophet''s grave in the mosque''s wall'
      ur: 'مسجد کی دیوار میں نبی کی قبر'
  - term:
      ar: الحميدية
      en: the Hamidiyeh souk
      ur: حامدیہ بازار
    gloss:
      ar: 'السوق الطويل في المدينة القديمة'
      en: 'the long souk in the old city'
      ur: 'پرانے شہر کا لمبا بازار'
  - term:
      ar: المدارس النورية
      en: the Nuri madrasas
      ur: نوری مدرسے
    gloss:
      ar: 'المدارس التي بناها نور الدين'
      en: 'the schools Nur al-Din built'
      ur: 'وہ مدارس جو نور الدین نے بنائے'
  - term:
      ar: الحمّامات
      en: the bathhouses
      ur: حمام
    gloss:
      ar: 'الحمّامات العامة القديمة'
      en: 'the old public bathhouses'
      ur: 'پرانے عوامی حمام'
  - term:
      ar: عبد الملك
      en: Abd al-Malik
      ur: عبدالملک
    gloss:
      ar: 'الخليفة الذي بناه سنة ٧١٥'
      en: 'the caliph who built it in 715'
      ur: 'وہ خلیفہ جس نے 715 میں بنایا'
  - term:
      ar: نور الدين
      en: Nur al-Din
      ur: نورالدین
    gloss:
      ar: 'السلطان الذي رمّم المدينة'
      en: 'the sultan who restored the city'
      ur: 'وہ سلطان جس نے شہر کی مرمت کی'
  - term:
      ar: أقدم مدينة
      en: the oldest city
      ur: قدیم ترین شہر
    gloss:
      ar: 'اللقب الذي تحمله المدينة'
      en: 'the title the city bears'
      ur: 'وہ لقب جو یہ شہر اٹھاتی ہے'
  practice:
  - q:
      ar: في أيّ إقليم تقع دمشق؟
      en: In which region is Damascus?
      ur: دمشق کس خطے میں ہے؟
    options:
    - text:
        ar: الشام
        en: the Levant
        ur: شام
      correct: true
      why:
        ar: في بلاد الشام على مفترق الطرق
        en: in the Levant at the crossroads
        ur: شام میں، راستوں کے چوراہے پر
    - text:
        ar: الحجاز
        en: the Hijaz
        ur: حجاز
      correct: false
      why:
        ar: الحجاز في الجزيرة لا دمشق
        en: the Hijaz is in Arabia, not Damascus
        ur: حجاز جزیرہ میں ہے، دمشق نہیں
    - text:
        ar: مصر
        en: Egypt
        ur: مصر
      correct: false
      why:
        ar: مصر إقليم آخر
        en: Egypt is another region
        ur: مصر دوسرا خطہ ہے
    - text:
        ar: الأندلس
        en: al-Andalus
        ur: الاندلس
      correct: false
      why:
        ar: الأندلس في الغرب لا دمشق
        en: al-Andalus is far west
        ur: الاندلس دور مغرب میں ہے
  - q:
      ar: ما أبرز لقب تاريخي لها؟
      en: What is its most famous historical title?
      ur: اس کا مشہور ترین تاریخی لقب؟
    options:
    - text:
        ar: عاصمة الأمويين
        en: capital of the Umayyads
        ur: امویوں کا پایہ تخت
      correct: true
      why:
        ar: كانت عاصمة الخلافة الأموية قرنًا
        en: it was the Umayyad caliphate's capital for a century
        ur: یہ صدیوں اموی خلافت کا پایہ تخت رہی
    - text:
        ar: عاصمة العباسيين
        en: capital of the Abbasids
        ur: عباسیوں کا پایہ تخت
      correct: false
      why:
        ar: العباسيون عاصمتهم بغداد
        en: the Abbasids' capital was Baghdad
        ur: عباسیوں کا پایہ تخت بغداد تھا
    - text:
        ar: عاصمة الفاطميين
        en: capital of the Fatimids
        ur: فاطمیوں کا پایہ تخت
      correct: false
      why:
        ar: الفاطميون عاصمتهم القاهرة
        en: the Fatimids' capital was Cairo
        ur: فاطمیوں کا پایہ تخت قاہرہ تھا
    - text:
        ar: عاصمة العثمانيين
        en: capital of the Ottomans
        ur: عثمانیوں کا پایہ تخت
      correct: false
      why:
        ar: العثمانيون عاصمتهم إسطنبول
        en: the Ottomans' capital was Istanbul
        ur: عثمانیوں کا پایہ تخت استنبول تھا
  - q:
      ar: متى كانت عاصمة الخلافة؟
      en: When was it the caliphate's capital?
      ur: یہ کب خلافت کا پایہ تخت تھا؟
    options:
    - text:
        ar: من ٦٦١ إلى ٧٥٠
        en: from 661 to 750
        ur: 661 تا 750
      correct: true
      why:
        ar: ظلت عاصمة الأمويين تسعين عامًا
        en: it stayed the Umayyad capital ninety years
        ur: یہ نوے سال اموی دارالحکومت رہی
    - text:
        ar: من ٧٥٠ إلى ١٢٥٨
        en: from 750 to 1258
        ur: 750 تا 1258
      correct: false
      why:
        ar: ذلك عصر العباسيين في بغداد
        en: that is the Abbasid era in Baghdad
        ur: یہ بغداد میں عباسی دور تھا
    - text:
        ar: من ١٢٥٠ إلى ١٥١٧
        en: from 1250 to 1517
        ur: 1250 تا 1517
      correct: false
      why:
        ar: ذلك عصر المماليك في القاهرة
        en: that is the Mamluk era in Cairo
        ur: یہ قاہرہ میں ممالیک دور تھا
    - text:
        ar: من ١٥١٧ إلى ١٩١٨
        en: from 1517 to 1918
        ur: 1517 تا 1918
      correct: false
      why:
        ar: ذلك العصر العثماني في إسطنبول
        en: that is the Ottoman era in Istanbul
        ur: یہ استنبول میں عثمانی دور تھا
  - q:
      ar: ما أشهر مسجد فيها؟
      en: Its most famous mosque?
      ur: اس کی مشہور ترین مسجد؟
    options:
    - text:
        ar: الجامع الأموي
        en: the Umayyad Mosque
        ur: اموی مسجد
      correct: true
      why:
        ar: الجامع الأموي أعظم مساجدها
        en: the Umayyad Mosque is its greatest
        ur: اموی مسجد اس کی عظیم ترین ہے
    - text:
        ar: الجامع الأقصى
        en: al-Aqsa
        ur: اقصیٰ
      correct: false
      why:
        ar: الأقصى في القدس لا دمشق
        en: al-Aqsa is in Jerusalem
        ur: اقصیٰ یروشلم میں ہے
    - text:
        ar: المسجد الأزرق
        en: the Blue Mosque
        ur: بلیو مسجد
      correct: false
      why:
        ar: الأزرق في إسطنبول
        en: the Blue Mosque is in Istanbul
        ur: بلیو مسجد استنبول میں ہے
    - text:
        ar: الجامع الكبير بقرطبة
        en: Cordoba's mosque
        ur: قرطبہ کی مسجد
      correct: false
      why:
        ar: جامع قرطبة في الأندلس
        en: Cordoba's mosque is in al-Andalus
        ur: قرطبہ کی مسجد الاندلس میں ہے
  - q:
      ar: من أسّس دولتها الأموية؟
      en: Who founded its Umayyad state?
      ur: اس کی اموی دولت کس نے بنائی؟
    options:
    - text:
        ar: معاوية
        en: Mu'awiya
        ur: معاویہ
      correct: true
      why:
        ar: معاوية أسّس الخلافة الأموية فيها
        en: Mu'awiya founded the Umayyad caliphate there
        ur: معاویہ نے وہاں اموی خلافت بنائی
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: عبد الملك بعده جيلان
        en: Abd al-Malik came two generations later
        ur: عبدالملک دو نسلوں بعد تھا
    - text:
        ar: الوليد
        en: al-Walid
        ur: الولید
      correct: false
      why:
        ar: الوليد بعد عبد الملك
        en: al-Walid came after Abd al-Malik
        ur: الولید عبدالملک کے بعد تھا
    - text:
        ar: هشام
        en: Hisham
        ur: ہشام
      correct: false
      why:
        ar: هشام من أحفاد الأسرة لا مؤسسها
        en: Hisham was a descendant, not the founder
        ur: ہشام خاندان کا ایک فرد تھا، بانی نہیں
  - q:
      ar: ما «مئذنة عيسى»؟
      en: What is the Jesus minaret?
      ur: عیسیٰ مینار کیا ہے؟
    options:
    - text:
        ar: منارة يذكرها التقليد
        en: a minaret named in tradition
        ur: روایت میں مذکور مینار
      correct: true
      why:
        ar: تذكر التقاليد نزول عيسى عندها
        en: tradition names it where Jesus descends
        ur: روایت اسے عیسیٰ کے نزول کی جگہ کہتی ہے
    - text:
        ar: برج عيسى في مصر
        en: a Jesus tower in Egypt
        ur: مصر میں عیسیٰ مینار
      correct: false
      why:
        ar: ليست في مصر بل دمشق
        en: in Damascus, not Egypt
        ur: مصر میں نہیں، دمشق میں
    - text:
        ar: قبة ذهبية
        en: a golden dome
        ur: سنہری گنبد
      correct: false
      why:
        ar: ليست قبة بل منارة
        en: a minaret, not a dome
        ur: گنبد نہیں، مینار
    - text:
        ar: باب عيسى
        en: a Jesus gate
        ur: عیسیٰ دروازہ
      correct: false
      why:
        ar: ليست بابًا بل منارة
        en: a minaret, not a gate
        ur: دروازہ نہیں، مینار
  - q:
      ar: ما السوق المشهورة فيها؟
      en: Its famous souk?
      ur: اس کا مشہور بازار؟
    options:
    - text:
        ar: الحميدية
        en: the Hamidiyeh
        ur: حامدیہ
      correct: true
      why:
        ar: الحميدية سوقها المسقوفة المشهورة
        en: the Hamidiyeh is its famed roofed market
        ur: حامدیہ اس کا مشہور چھت دار بازار ہے
    - text:
        ar: بازار إسطنبول
        en: the Grand Bazaar
        ur: گرینڈ بازار
      correct: false
      why:
        ar: البازار الكبير في إسطنبول
        en: the Grand Bazaar is Istanbul's
        ur: گرینڈ بازار استنبول کا ہے
    - text:
        ar: سوق مراكش
        en: Marrakesh's souk
        ur: مراکش کا بازار
      correct: false
      why:
        ar: سوق مراكش في المغرب
        en: Marrakesh's souk is in Morocco
        ur: مراکش کا بازار مراکش میں ہے
    - text:
        ar: سوق القاهرة
        en: Cairo's Khan
        ur: قاہرہ کا خان
      correct: false
      why:
        ar: خان الخليلي في القاهرة
        en: Khan al-Khalili is Cairo's
        ur: خان الخلیلی قاہرہ کا ہے
  - q:
      ar: من رعاها في عصره؟
      en: Who patronised it in his era?
      ur: اپنے دور میں اس کی سرپرستی کس نے کی؟
    options:
    - text:
        ar: نور الدين
        en: Nur al-Din
        ur: نورالدین
      correct: true
      why:
        ar: نور الدين رعاها بالمدارس
        en: Nur al-Din patronised it with madrasas
        ur: نورالدین نے مدرسوں سے سرپرستی کی
    - text:
        ar: صلاح الدين فيها قبره
        en: Saladin, buried there
        ur: صلاح الدین، وہاں مدفون
      correct: false
      why:
        ar: صلاح الدين دُفن فيها بعد نور الدين
        en: Saladin was buried there after Nur al-Din
        ur: صلاح الدین نورالدین کے بعد وہاں دفن ہوا
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: هارون عباسي في بغداد
        en: Harun was Abbasid in Baghdad
        ur: ہارون بغداد میں عباسی تھا
    - text:
        ar: عبد الملك فقط
        en: Abd al-Malik alone
        ur: صرف عبدالملک
      correct: false
      why:
        ar: نور الدين رعاها بعده بقرون
        en: Nur al-Din patronised it centuries later
        ur: نورالدین نے صدیاں بعد سرپرستی کی
  - q:
      ar: ما الذي يميّز قبرها في الجامع؟
      en: What distinguishes its mosque grave?
      ur: اس کی مسجد کی قبر کی خاصیت؟
    options:
    - text:
        ar: قبر يوحنا المشترك
        en: John's shared grave
        ur: یحییٰ کی مشترک قبر
      correct: true
      why:
        ar: قبر يوحنا المعمدان يحترمه المسلمون والمسيحيون
        en: John the Baptist's grave is honoured by both faiths
        ur: یحییٰ کی قبر کو دونوں دین عزت دیتے ہیں
    - text:
        ar: قبر سليمان
        en: Solomon's grave
        ur: سلیمان کی قبر
      correct: false
      why:
        ar: ليس قبر سليمان بل يوحنا
        en: not Solomon's but John's
        ur: سلیمان کی نہیں، یحییٰ کی
    - text:
        ar: قبر محمد
        en: Muhammad's grave
        ur: محمد کی قبر
      correct: false
      why:
        ar: ليس قبر النبي في دمشق
        en: not the Prophet's grave in Damascus
        ur: دمشق میں نبی کی قبر نہیں
    - text:
        ar: لا قبر فيه
        en: no grave in it
        ur: اس میں کوئی قبر نہیں
      correct: false
      why:
        ar: يوجد قبر يوحنا فيه
        en: John's grave is there
        ur: اس میں یحییٰ کی قبر ہے
  - q:
      ar: لماذا تُعدّ من أقدم المدن؟
      en: Why is it among the oldest cities?
      ur: یہ قدیم ترین شہروں میں کیوں ہے؟
    options:
    - text:
        ar: لسكنها بلا انقطاع
        en: for unbroken habitation
        ur: مسلسل آبادی کے لیے
      correct: true
      why:
        ar: سكنها البشر دون توقف آلاف الأعوام
        en: people have lived there unbroken for millennia
        ur: لوگ وہاں ہزاروں سال سے مسلسل رہے
    - text:
        ar: لحجمها فقط
        en: for its size only
        ur: صرف وسعت کے لیے
      correct: false
      why:
        ar: ليست أكبر بل أقدم استمرارًا
        en: not largest but oldest continuously
        ur: سب سے بڑی نہیں، مسلسل قدیم
    - text:
        ar: لأول بناء حجري
        en: for the first stone building
        ur: پہلی پتھر کی عمارت کے لیے
      correct: false
      why:
        ar: ليست أول بناء بل أطول سكن
        en: not first building but longest lived-in
        ur: پہلی عمارت نہیں، طویل ترین آبادی
    - text:
        ar: لقربها من مكة
        en: for nearness to Mecca
        ur: مکہ کی قربت کے لیے
      correct: false
      why:
        ar: ليست قريبة من مكة بل شمالًا
        en: it is not near Mecca but north
        ur: یہ مکہ کے قریب نہیں، شمال میں
- id: rise-of-islam
  anchor: exhibit/pathway-g11-chw3m-rise-of-islam
  band: researchers
  title:
    ar: نشأة الإسلام
    en: The Rise of Islam
    ur: اسلام کا آغاز
  sixty:
    ar: 'نشأة الإسلام: من غار حراء فوق مكة نزل الوحي على النبي نحو سنة ٦١٠ بدعوة التوحيد — إفراد الله بالعبادة. بدأت الدعوة خفيةً ثم علت، فاضطهدت قريش المؤمنين الأوائل حتى هاجر المسلمون إلى يثرب سنة ٦٢٢، وهناك قامت أول جماعة مسلمة بدستورها ومسجدها. ومن المدينة جاءت بدر والأحزاب وفتح مكة سنة ٦٣٠، فدخل الناس في دين الله أفواجًا. وفي قرن واحد انتشرت الدعوة من الأندلس إلى السند: خلافة راشدة ثم أموية قامت على حدود ثلاث قارات، وديانة جمعت العرب والفرس والترك والبربر في أمة واحدة. تلك هي القصة الكبرى: من كهف إلى قارة.  وتبقى البداية هي الدرس: أن فكرة واحدة قوية، بشخص واحد مخلص، يمكن أن تغيّر خريطة العالم في أقلّ من عمر إنسان.  ومن تلك البداية نشأت حضارة كاملة — فقه وأدب وعمارة وعلم — تركت أثرها في كلّ قارة.'
    en: 'The rise of Islam: from the cave of Hira above Mecca, revelation came down on the Prophet around 610 with the call of tawhid — singling God out in worship. The call began hidden, then rose; the Quraysh persecuted the early believers until the Muslims migrated to Yathrib in 622, and there the first Muslim community stood up with its charter and mosque. From Medina came Badr, the Confederates and the conquest of Mecca in 630, and people entered God''s religion in throngs. In one century the call spread from al-Andalus to the Indus: a rightly-guided then an Umayyad caliphate standing across three continents, and a faith binding Arabs, Persians, Turks and Berbers into one ummah. That is the great story — from a cave to a continent.  And the beginning stays the lesson: that one strong idea, in one faithful person, can change the world''s map in less than a human lifetime.'
    ur: 'اسلام کا آغاز: مکہ کے اوپر غارِ حرا سے نبی پر تقریباً 610ء میں توحید کی دعوت کے ساتھ وحی نازل ہوئی — صرف خدا کی عبادت۔ دعوت پہلے پوشیدہ رہی پھر بلند ہوئی؛ قریش نے ابتدائی مومنین پر ظلم کیا یہاں تک کہ مسلمان 622ء میں یثرب ہجرت کر گئے، اور وہاں پہلی مسلم برادری اپنے میثاق اور مسجد کے ساتھ قائم ہوئی۔ مدینہ سے بدر، احزاب اور 630ء میں فتح مکہ ہوا اور لوگ جوق در جوق دین میں آئے۔ ایک صدی میں دعوت اندلس سے سندھ تک پھیلی: راشدی اور پھر اموی خلافت تین براعظموں پر قائم، اور وہ دین جس نے عرب، فارسی، ترک اور بربروں کو ایک امت میں باندھا۔ یہی وہ عظیم کہانی ہے — ایک غار سے ایک براعظم تک۔  اور آغاز ہی سبق رہتا ہے: کہ ایک مضبوط خیال، ایک مخلص شخص میں، انسانی عمر سے کم میں دنیا کا نقشہ بدل سکتا ہے۔'
  glossary:
  - term:
      ar: مكة
      en: Mecca
      ur: مکہ
    gloss:
      ar: 'مدينة الوحي الأولى'
      en: 'the first revelation''s city'
      ur: 'پہلی وحی کا شہر'
  - term:
      ar: الوحي
      en: revelation
      ur: وحی
    gloss:
      ar: 'الكلام الذي نزل من السماء'
      en: 'the speech come down from heaven'
      ur: 'آسمان سے اتری ہوئی کلام'
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: 'المدينة التي هاجرت إليها'
      en: 'the city migrated to'
      ur: 'وہ شہر جس میں ہجرت ہوئی'
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'الرحلة التي بدأت بها السنة'
      en: 'the journey the year begins with'
      ur: 'وہ سفر جس سے سال شروع ہوتا ہے'
  - term:
      ar: الدعوة السرية
      en: the secret call
      ur: پوشیدہ دعوت
    gloss:
      ar: 'الدعوة في بداياتها الخفية'
      en: 'the call in its hidden beginnings'
      ur: 'دعوت کے پوشیدہ آغاز'
  - term:
      ar: الاضطهاد
      en: persecution
      ur: اذیت
    gloss:
      ar: 'أذى قريش للمؤمنين الأوائل'
      en: 'Quraysh''s hurt of the early believers'
      ur: 'ابتدائی مومنین پر قریش کا ظلم'
  - term:
      ar: بدر
      en: Badr
      ur: بدر
    gloss:
      ar: 'المعركة الأولى في التاريخ'
      en: 'the first battle in the history'
      ur: 'تاریخ کی پہلی لڑائی'
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: 'عودة المسلمين إلى مكة ٦٣٠'
      en: 'the Muslims'' return to Mecca in 630'
      ur: '630ء میں مسلمانوں کی مکہ واپسی'
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: 'الحكم بعد النبي'
      en: 'the rule after the Prophet'
      ur: 'نبی کے بعد حکومت'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة الأولى بعد الراشدين'
      en: 'the first dynasty after the rightly-guided'
      ur: 'راشدین کے بعد پہلا خاندان'
  - term:
      ar: قرن من التوسع
      en: a century of expansion
      ur: ایک صدی کی پھیلاؤ
    gloss:
      ar: 'مئة سنة من الفتوح'
      en: 'a hundred years of expansion'
      ur: 'سالوں کی فتوحات'
  - term:
      ar: توحيد
      en: tawhid (God's oneness)
      ur: توحید
    gloss:
      ar: 'إفراد الله بالعبادة'
      en: 'singling God out in worship'
      ur: 'صرف خدا کی عبادت'
  practice:
  - q:
      ar: أين بدأ الإسلام؟
      en: Where did Islam begin?
      ur: اسلام کہاں شروع ہوا؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: نزل الوحي في مكة عام ٦١٠
        en: revelation came down in Mecca in 610
        ur: وحی 610 میں مکہ میں نازل ہوئی
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة وجهة الهجرة لا البداية
        en: Medina was the Hijra's destination
        ur: مدینہ ہجرت کی منزل تھی، آغاز نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس قبلته الأولى لا مولده
        en: Jerusalem was the first qibla, not the start
        ur: یروشلم پہلا قبلہ تھا، آغاز نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق عاصمة لاحقة
        en: Damascus was a later capital
        ur: دمشق بعد کی دارالحکومت تھی
  - q:
      ar: متى نزل الوحي أول مرة؟
      en: When did revelation first come down?
      ur: وحی پہلی بار کب نازل ہوئی؟
    options:
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: true
      why:
        ar: بدأ الوحي في غار حراء عام ٦١٠
        en: revelation began in the cave of Hira in 610
        ur: وحی غار حرا میں 610 میں شروع ہوئی
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة لا الوحي
        en: 622 is the Hijra, not the revelation
        ur: 622 ہجرت کا سال ہے، وحی کا نہیں
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ٦٣٠ عام الفتح لا الوحي
        en: 630 is the conquest, not revelation
        ur: 630 فتح کا سال ہے، وحی کا نہیں
    - text:
        ar: عام ٦٣٢
        en: in 632
        ur: 632 میں
      correct: false
      why:
        ar: ٦٣٢ عام الوفاة لا البداية
        en: 632 is the passing year, not the start
        ur: 632 وفات کا سال ہے، آغاز کا نہیں
  - q:
      ar: كم استمرت الدعوة في مكة؟
      en: How long did the call last in Mecca?
      ur: مکہ میں دعوت کتنے عرصے چلی؟
    options:
    - text:
        ar: ثلاثة عشر عامًا
        en: thirteen years
        ur: تیرہ سال
      correct: true
      why:
        ar: ثلاثة عشر عامًا قبل الهجرة
        en: thirteen years before the Hijra
        ur: ہجرت سے پہلے تیرہ سال
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة أعوام مدة السرية فقط
        en: three years was only the secret phase
        ur: تین سال صرف پوشیدہ مرحلہ تھا
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام مدة المدينة
        en: ten years was the Medina period
        ur: دس سال مدینہ کا عرصہ تھا
    - text:
        ar: خمسة وعشرون
        en: twenty-five
        ur: پچیس
      correct: false
      why:
        ar: ثلاثة وعشرون مجموع الدعوة كلها
        en: twenty-three was the whole mission
        ur: تئیس کل دعوت کا عرصہ تھا
  - q:
      ar: إلى أين هاجر المسلمون؟
      en: Where did the Muslims migrate?
      ur: مسلمان کہاں ہجرت کر گئے؟
    options:
    - text:
        ar: يثرب — المدينة
        en: Yathrib — Medina
        ur: یثرب — مدینہ
      correct: true
      why:
        ar: هاجروا إلى يثرب فصارت المدينة
        en: they migrated to Yathrib, which became Medina
        ur: وہ یثرب ہجرت کر گئے جو مدینہ بنی
    - text:
        ar: الطائف
        en: Taif
        ur: طائف
      correct: false
      why:
        ar: الطائف زارها ولم يهاجر إليها
        en: Taif he visited but did not settle
        ur: طائف وہ گیا مگر وہاں نہیں رہا
    - text:
        ar: الحبشة مرة ثانية
        en: Abyssinia again
        ur: دوبارہ حبشہ
      correct: false
      why:
        ar: الحبشة هجرة أولى جزئية
        en: Abyssinia was an earlier partial migration
        ur: حبشہ پہلی جزوی ہجرت تھی
    - text:
        ar: الشام
        en: Syria
        ur: شام
      correct: false
      why:
        ar: الشام لم تكن وجهته
        en: Syria was not his destination
        ur: شام اس کی منزل نہیں تھی
  - q:
      ar: كيف استُعيدت مكة؟
      en: How was Mecca regained?
      ur: مکہ کیسے واپس آیا؟
    options:
    - text:
        ar: سلمًا عام ٦٣٠
        en: peacefully in 630
        ur: 630 میں امن سے
      correct: true
      why:
        ar: دخلها بلا قتال تقريبًا عام ٦٣٠
        en: he entered it nearly bloodlessly in 630
        ur: اس نے 630 میں تقریباً بغیر لڑائی داخل کیا
    - text:
        ar: بحصار طويل
        en: by a long siege
        ur: طویل محاصرے سے
      correct: false
      why:
        ar: لم يحاصرها بل دخلها
        en: he did not besiege it but entered
        ur: اس نے محاصرہ نہیں کیا بل داخل ہوا
    - text:
        ar: بمعركة كبرى
        en: by a great battle
        ur: بڑی لڑائی سے
      correct: false
      why:
        ar: لم تكن معركة بل فتح سلمي
        en: it was a peaceful opening, not a battle
        ur: یہ لڑائی نہیں بل امن تھی
    - text:
        ar: لم تُستعد
        en: it was never regained
        ur: کبھی واپس نہیں آیا
      correct: false
      why:
        ar: استعادها عام ٦٣٠
        en: it was regained in 630
        ur: یہ 630 میں واپس آیا
  - q:
      ar: من حكم بعد النبي؟
      en: Who ruled after the Prophet?
      ur: نبی کے بعد کس نے حکومت کی؟
    options:
    - text:
        ar: الخلفاء
        en: the caliphs
        ur: خلفاء
      correct: true
      why:
        ar: الخلفاء الراشدون ثم الأمويون
        en: the rightly-guided caliphs, then Umayyads
        ur: راشدین خلفاء، پھر اموی
    - text:
        ar: السلاطين
        en: the sultans
        ur: سلاطین
      correct: false
      why:
        ar: السلاطين لقب متأخر
        en: sultan is a later title
        ur: سلطان بعد کا لقب ہے
    - text:
        ar: الأباطرة
        en: the emperors
        ur: شہنشاہ
      correct: false
      why:
        ar: ليس أباطرة بل خلفاء
        en: caliphs, not emperors
        ur: شہنشاہ نہیں، خلفاء
    - text:
        ar: الملوك
        en: the kings
        ur: بادشاہ
      correct: false
      why:
        ar: الخلفاء لا ملوك في البدء
        en: caliphs led first, not kings
        ur: پہلے خلفاء تھے، بادشاہ نہیں
  - q:
      ar: إلى أين امتدت الدولة الأموية؟
      en: How far did the Umayyad state reach?
      ur: اموی ریاست کہاں تک پھیلی؟
    options:
    - text:
        ar: من الأندلس إلى الهند
        en: from al-Andalus to India
        ur: الاندلس سے ہندوستان تک
      correct: true
      why:
        ar: امتدت غربًا إلى الأندلس وشرقًا إلى الهند
        en: it stretched west to al-Andalus and east to India
        ur: یہ مغرب میں الاندلس اور مشرق میں ہندوستان تک پھیلی
    - text:
        ar: الجزيرة فقط
        en: Arabia only
        ur: صرف جزیرہ
      correct: false
      why:
        ar: لم تقف عند الجزيرة
        en: it did not stop at Arabia
        ur: یہ جزیرے پر نہیں رکی
    - text:
        ar: الشام ومصر فقط
        en: Syria and Egypt only
        ur: صرف شام اور مصر
      correct: false
      why:
        ar: أوسع من الشام ومصر
        en: wider than Syria and Egypt
        ur: شام اور مصر سے زیادہ وسیع
    - text:
        ar: أوروبا كلها
        en: all of Europe
        ur: پورا یورپ
      correct: false
      why:
        ar: لم تبلغ كل أوروبا
        en: it did not reach all Europe
        ur: یہ پورے یورپ تک نہیں پہنچی
  - q:
      ar: ما «التوحيد» الذي دعا إليه؟
      en: What is the tawhid he preached?
      ur: اس کی توحید کیا ہے؟
    options:
    - text:
        ar: إفراد الله بالعبادة
        en: worshipping God alone
        ur: اللہ اکیلے کی عبادت
      correct: true
      why:
        ar: دعوة إلى توحيد الله وترك الأصنام
        en: a call to God's oneness leaving idols
        ur: اللہ کی وحدانیت اور بتوں کی چھٹی کی دعوت
    - text:
        ar: عبادة الأصنام
        en: worshipping idols
        ur: بتوں کی عبادت
      correct: false
      why:
        ar: عكس دعوته تمامًا
        en: the opposite of his call
        ur: اس کی دعوت کے بالکل برعکس
    - text:
        ar: ثلاثة آلهة
        en: three gods
        ur: تین معبود
      correct: false
      why:
        ar: ليس ثلاثة بل توحيد
        en: oneness, not three
        ur: تین نہیں، وحدانیت
    - text:
        ar: لا إله
        en: no god
        ur: کوئی معبود نہیں
      correct: false
      why:
        ar: ليس نفيًا بل توحيد الله
        en: God's oneness, not denial
        ur: انکار نہیں، اللہ کی وحدانیت
  - q:
      ar: كم استغرق انتشار الحضارة؟
      en: How long did the civilisation's spread take?
      ur: تہذیب کا پھیلاؤ کتنے عرصے میں ہوا؟
    options:
    - text:
        ar: أقل من قرن
        en: under a century
        ur: ایک صدی سے کم
      correct: true
      why:
        ar: من ٦١٠ إلى الأندلس في نحو مئة عام
        en: from 610 to al-Andalus in about a hundred years
        ur: 610 سے الاندلس تک تقریباً سو سال میں
    - text:
        ar: خمسة قرون
        en: five centuries
        ur: پانچ صدیاں
      correct: false
      why:
        ar: أقل من قرن لا خمسة
        en: under a century, not five
        ur: پانچ نہیں، ایک صدی سے کم
    - text:
        ar: عقد واحد
        en: one decade
        ur: ایک دہائی
      correct: false
      why:
        ar: عقد قليل جدًا للانتشار
        en: a decade is too short for the spread
        ur: پھیلاؤ کے لیے دہائی بہت کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: ألف عام أكثر بكثير
        en: a thousand is far more
        ur: ہزار سال بہت زیادہ ہے
  - q:
      ar: لماذا تُعدّ الهجرة محورًا؟
      en: Why is the Hijra a turning point?
      ur: ہجرت محور کیوں ہے؟
    options:
    - text:
        ar: لأنها بدأت دولة وتقويمًا
        en: it began a state and a calendar
        ur: اس نے ریاست اور تقویم شروع کیا
      correct: true
      why:
        ar: بها قامت الدولة وبدأ التقويم الهجري
        en: by it the state arose and the calendar began
        ur: اس سے ریاست قائم ہوئی اور ہجری تقویم شروع ہوا
    - text:
        ar: لأنها آخر حدث
        en: for being the last event
        ur: آخری واقعہ ہونے کے لیے
      correct: false
      why:
        ar: ليست آخر بل بداية
        en: a beginning, not the end
        ur: آخر نہیں، آغاز
    - text:
        ar: لأنها سفر فقط
        en: for being a journey only
        ur: صرف سفر ہونے کے لیے
      correct: false
      why:
        ar: ليست سفرًا بل تأسيس
        en: a founding, not just travel
        ur: صرف سفر نہیں، قیام
    - text:
        ar: لأنها سرية
        en: for being secret
        ur: پوشیدہ ہونے کے لیے
      correct: false
      why:
        ar: لم تكن سرية بل علنية
        en: it was open, not secret
        ur: یہ پوشیدہ نہیں، علانیہ تھی
- id: baghdad-silk-roads
  anchor: exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
  band: researchers
  title:
    ar: بغداد وطرق الحرير
    en: Baghdad and the Silk Roads
    ur: بغداد اور ریشم کے راستے
  sixty:
    ar: 'بغداد: مدينة السلام التي بناها المنصور سنة ٧٦٢ مدينةً دائرية على دجلة — دار خلافة وميناء تجارة ومكتبة علم في مكان واحد. فيها وصلت طرق الحرير من الصين إلى طرق البحر من الهند والخليج، فصارت أكبر سوق عالمية في عصرها: الورق والتوابل والخزف والعلم يتداول كلّه في أسواقها. وفيها بيت الحكمة الذي علّم الخوارزمي فيه الجبر وترجمت العلوم اليونانية والفارسية، ومراصد قاست السماء. وبقيت خمسة قرون مركز العالم الإسلامي حتى سقطت للمغول سنة ١٢٥٨، وبقي اسمها على لسان التاريخ: كلّ طريق قديم يمكن أن يبدأ أو ينتهي في بغداد.  وفي خرائط اليوم تبقى بغداد عقدة الطرق نفسها: ليس صدفة أن تكون دجلة في قلب التجارة القديمة، بل جغرافيا مدينة قدّر لها أن تكون ميناءَ الشرق والغرب.  وهي درس الاقتصاد أيضًا: أن الدولة التي تربط الطرق لا تحتاج غزو أحد لتغنى، بل تحتاج حرّية التجارة والعلم.'
    en: 'Baghdad: the City of Peace al-Mansur built in 762 as a round city on the Tigris — a caliphate''s seat, a trade port and a library of knowledge in one place. In it the Silk Roads from China met the sea routes from India and the Gulf, making it the age''s greatest world market: paper, spices, porcelain and learning all traded in its souks. It held the House of Wisdom where al-Khwarizmi taught algebra and Greek and Persian sciences were translated, and observatories measuring the sky. For five centuries it stayed the Islamic world''s centre until it fell to the Mongols in 1258, and its name stayed on history''s tongue: every old road can begin or end in Baghdad.  On today''s maps Baghdad stays the same knot of routes: it is no accident the Tigris lies at old trade''s heart, but the geography of a city fated to be East''s and West''s port.'
    ur: 'بغداد: شہر السلام جو منصور نے 762ء میں دجلہ کے کنارے گول شہر کے طور پر بسایا — خلافت کی نشست، تجارتی بندرگاہ اور علم کا کتب خانہ ایک ہی جگہ۔ اس میں چین سے شاہراہِ ریشم اور ہند اور خلیج سے بحری راستے ملے، اور یہ اپنے زمانے کا سب سے بڑا عالمی بازار بنا: کاغذ، مصالحے، چینی مٹی اور علم سب اس کے بازاروں میں سودا ہوا۔ اس میں بیت الحکمت تھا جہاں خوارزمی نے الجبر پڑھایا اور یونانی اور فارسی علوم کا ترجمہ ہوا، اور رصد گاہیں آسمان ناپتی تھیں۔ پانچ صدیوں یہ اسلامی دنیا کا مرکز رہا یہاں تک کہ 1258ء میں مغولوں کے ہاتھ گرا، اور اس کا نام تاریخ کی زبان پر رہا: ہر پرانا راستہ بغداد میں شروع یا ختم ہو سکتا ہے۔  آج کے نقشوں میں بغداد راستوں کی وہی گرہ ہے: اتفاق نہیں کہ دجلہ قدیم تجارت کے دل میں ہے، بلکہ ایسے شہر کی جغرافیہ ہے جسے مشرق اور مغرب کی بندرگاہ ہونا لکھا تھا۔'
  glossary:
  - term:
      ar: المنصور
      en: al-Mansur
      ur: منصور
    gloss:
      ar: 'الخليفة الذي بناها دائرة'
      en: 'the caliph who built her as a circle'
      ur: 'وہ خلیفہ جس نے اسے گول بسایا'
  - term:
      ar: المدينة المدوّرة
      en: the round city
      ur: گول شہر
    gloss:
      ar: 'شكلها الهندسي الفريد'
      en: 'her unique geometric shape'
      ur: 'اس کی انوٹھی ہندسی شکل'
  - term:
      ar: طريق الحرير
      en: the Silk Road
      ur: ریشم کا راستہ
    gloss:
      ar: 'الطريق الكبرى من الصين'
      en: 'the great road from China'
      ur: 'چین سے عظیم راستہ'
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'السلالة التي جعلتها عاصمة'
      en: 'the dynasty that made her capital'
      ur: 'وہ خاندان جس نے اسے دارالحکومت بنایا'
  - term:
      ar: بيت الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: 'مكتبة العلماء الكبرى'
      en: 'the scholars'' great library'
      ur: 'علماء کا عظیم کتب خانہ'
  - term:
      ar: المأمون
      en: al-Ma'mun
      ur: المامون
    gloss:
      ar: 'الخليفة الذي جمع فيها المترجمين'
      en: 'the caliph who gathered translators in her'
      ur: 'وہ خلیفہ جس نے اس میں مترجمین جمع کیے'
  - term:
      ar: دجلة
      en: the Tigris
      ur: دجلہ
    gloss:
      ar: 'النهر الذي تحمل سفنها'
      en: 'the river her ships sail'
      ur: 'وہ دریا جس پر اس کی کشیاں چلتی ہیں'
  - term:
      ar: التجار
      en: the merchants
      ur: تاجر
    gloss:
      ar: 'الذين يحملون البضائع والعلوم'
      en: 'those carrying goods and learning'
      ur: 'وہ جو مال اور علم لاتے ہیں'
  - term:
      ar: سقوط بغداد
      en: the fall of Baghdad
      ur: بغداد کا سقوط
    gloss:
      ar: 'سقوط المدينة للمغول'
      en: 'the city''s fall to the Mongols'
      ur: 'مغولوں کے ہاتھ شہر کا گرنا'
  - term:
      ar: السند
      en: India
      ur: ہند
    gloss:
      ar: 'طرف الشرق في تجارتها'
      en: 'her trade''s eastern end'
      ur: 'اس کی تجارت کا مشرقی سرا'
  - term:
      ar: الطرق البحرية
      en: the sea routes
      ur: سمندری راستے
    gloss:
      ar: 'طرق البحر الهندي والخليجي'
      en: 'the Indian and Gulf sea routes'
      ur: 'ہند اور خلیج کے بحری راستے'
  - term:
      ar: خمسة قرون
      en: five centuries
      ur: پانچ صدیاں
    gloss:
