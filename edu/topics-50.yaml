      en: coexistence
      ur: بقائے باہمی
    gloss:
      ar: عيش المسلمين والمسيحيين واليهود معًا
      en: Muslims, Christians and Jews living together
      ur: مسلمان، مسیحی اور یہودی کا ساتھ رہنا
  - term:
      ar: المكتبات
      en: the libraries
      ur: کتب خانے
    gloss:
      ar: خزائن الكتب في قرطبة
      en: the book stores of Cordoba
      ur: قرطبہ کے کتاب ذخیرے
  - term:
      ar: ثمانية قرون
      en: eight centuries
      ur: آٹھ صدیاں
    gloss:
      ar: مدة الحكم الإسلامي فيها
      en: the span of Muslim rule there
      ur: وہاں مسلم حکومت کی مدت
  practice:
  - q:
      ar: متى فُتحت أيبيريا؟
      en: When was Iberia taken?
      ur: ایبریا کب فتح ہوئی؟
    options:
    - text:
        ar: عام ٧١١
        en: in 711
        ur: 711 میں
      correct: true
      why:
        ar: دخل المسلمون أيبيريا عام ٧١١
        en: Muslims entered Iberia in 711
        ur: مسلمان 711 میں ایبریا میں داخل ہوئے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة لا الفتح
        en: 622 is the Hijra, not the conquest
        ur: 622 ہجرت کا سال ہے، فتح کا نہیں
    - text:
        ar: عام ٧٥٦
        en: in 756
        ur: 756 میں
      correct: false
      why:
        ar: ٧٥٦ عام الإمارة لا الفتح
        en: 756 is the emirate's year, not conquest
        ur: 756 امارت کا سال ہے، فتح نہیں
    - text:
        ar: عام ١٠٨٥
        en: in 1085
        ur: 1085 میں
      correct: false
      why:
        ar: ١٠٨٥ عام سقوط طليطلة
        en: 1085 is Toledo's fall
        ur: 1085 طليطلہ کے گرنے کا سال ہے
  - q:
      ar: كم استمر الحكم فيها؟
      en: How long did rule last there?
      ur: وہاں حکومت کتنے عرصے رہی؟
    options:
    - text:
        ar: ثمانية قرون
        en: eight centuries
        ur: آٹھ صدیاں
      correct: true
      why:
        ar: من ٧١١ إلى ١٤٩٢ ثمانية قرون
        en: from 711 to 1492, eight centuries
        ur: 711 تا 1492، آٹھ صدیاں
    - text:
        ar: قرن واحد
        en: one century
        ur: ایک صدی
      correct: false
      why:
        ar: قرن أقل بكثير
        en: a century is far less
        ur: ایک صدی بہت کم ہے
    - text:
        ar: أربعة قرون
        en: four centuries
        ur: چار صدیاں
      correct: false
      why:
        ar: أربعة نصف المدة
        en: four is half the span
        ur: چار نصف مدت ہے
    - text:
        ar: عشرة قرون
        en: ten centuries
        ur: دس صدیاں
      correct: false
      why:
        ar: عشرة أكثر من ثمانية
        en: ten is more than eight
        ur: دس آٹھ سے زیادہ ہے
  - q:
      ar: ما عاصمتها الأولى؟
      en: Its first capital?
      ur: اس کا پہلا پایہ تخت؟
    options:
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: true
      why:
        ar: قرطبة عاصمة الأندلس الأموية
        en: Cordoba was Umayyad al-Andalus's capital
        ur: قرطبہ اموی الاندلس کا پایہ تخت تھا
    - text:
        ar: إشبيلية
        en: Seville
        ur: اشبیلیہ
      correct: false
      why:
        ar: إشبيلية عاصمة لاحقة
        en: Seville was a later seat
        ur: اشبیلیہ بعد کی نشست تھی
    - text:
        ar: غرناطة
        en: Granada
        ur: غرناطہ
      correct: false
      why:
        ar: غرناطة آخر العواصم
        en: Granada was the last capital
        ur: غرناطہ آخری پایہ تخت تھا
    - text:
        ar: طليطلة
        en: Toledo
        ur: طليطلہ
      correct: false
      why:
        ar: طليطلة مدينة قبل الإسلام
        en: Toledo was a pre-Islamic city
        ur: طليطلہ اسلام سے پہلے کا شہر تھا
  - q:
      ar: ما «ممالك الطوائف»؟
      en: What were the taifa kingdoms?
      ur: طائفہ ریاستیں کیا تھیں؟
    options:
    - text:
        ar: دول صغيرة بعد الخلافة
        en: small states after the caliphate
        ur: خلافت کے بعد چھوٹی ریاستیں
      correct: true
      why:
        ar: تفككت الخلافة إلى ممالك صغيرة
        en: the caliphate broke into small kingdoms
        ur: خلافت چھوٹی بادشاہتوں میں بٹ گئی
    - text:
        ar: مقاطعات عثمانية
        en: Ottoman provinces
        ur: عثمانی صوبے
      correct: false
      why:
        ar: ليست عثمانية بل أندلسية
        en: Andalusi, not Ottoman
        ur: عثمانی نہیں، اندلسی
    - text:
        ar: إمارات قديمة
        en: old emirates
        ur: پرانی امارتیں
      correct: false
      why:
        ar: ليست قديمة بل بعد الخلافة
        en: after the caliphate, not old
        ur: پرانی نہیں، خلافت کے بعد
    - text:
        ar: ولايات رومانية
        en: Roman provinces
        ur: رومن صوبے
      correct: false
      why:
        ar: ليست رومانية بل إسلامية
        en: Muslim, not Roman
        ur: رومن نہیں، مسلم
  - q:
      ar: من جاء بعد الطوائف؟
      en: Who came after the taifas?
      ur: طائفہ کے بعد کون آیا؟
    options:
    - text:
        ar: المرابطون والموحدون
        en: Almoravids and Almohads
        ur: مرابطین اور موحدین
      correct: true
      why:
        ar: المرابطون ثم الموحدون من المغرب
        en: Almoravids then Almohads from Morocco
        ur: مراکش سے مرابطین پھر موحدین
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون في المشرق لا الأندلس
        en: Ottomans ruled the East, not al-Andalus
        ur: عثمانی مشرق میں تھے، الاندلس میں نہیں
    - text:
        ar: الفاطميون
        en: the Fatimids
        ur: فاطمی
      correct: false
      why:
        ar: الفاطميون في مصر لا الأندلس
        en: Fatimids ruled Egypt, not al-Andalus
        ur: فاطمی مصر میں تھے، الاندلس میں نہیں
    - text:
        ar: السلاجقة
        en: the Seljuks
        ur: سلجوق
      correct: false
      why:
        ar: السلاجقة في الشرق لا الأندلس
        en: Seljuks ruled the East
        ur: سلجوق مشرق میں تھے
  - q:
      ar: من قائد الفتح؟
      en: Who led the conquest?
      ur: فتح کی قیادت کس نے کی؟
    options:
    - text:
        ar: طارق
        en: Tariq
        ur: طارق
      correct: true
      why:
        ar: طارق بن زياد قاد الجيش عبر المضيق
        en: Tariq ibn Ziyad led the army across the strait
        ur: طارق بن زیاد نے فوج کی قیادت آبنائے پار کی
    - text:
        ar: موسى فقط
        en: only Musa
        ur: صرف موسیٰ
      correct: false
      why:
        ar: موسى تبع طارق لا قاده
        en: Musa followed Tariq, did not lead
        ur: موسیٰ طارق کے بعد آیا، قیادت نہیں کی
    - text:
        ar: عبد الرحمن الأول
        en: Abd al-Rahman I
        ur: عبدالرحمٰن اول
      correct: false
      why:
        ar: عبد الرحمن أمير بعد الفتح
        en: Abd al-Rahman was emir after the conquest
        ur: عبدالرحمٰن فتح کے بعد امیر تھا
    - text:
        ar: يوسف بن تاشفين
        en: Yusuf ibn Tashfin
        ur: یوسف بن تاشفین
      correct: false
      why:
        ar: يوسف مرابط بعده بقرون
        en: Yusuf was Almoravid centuries later
        ur: یوسف مرابطی تھا، صدیاں بعد
  - q:
      ar: ماذا سُمّي المضيق باسمه؟
      en: What strait bears his name?
      ur: کون سی آبنائے اس کے نام پر ہے؟
    options:
    - text:
        ar: جبل طارق
        en: Gibraltar
        ur: جبل الطارق
      correct: true
      why:
        ar: «جبل طارق» باسم قائد الفتح
        en: '''Tariq''s mountain'' for the conquest leader'
        ur: فتح کے سردار کے نام «جبل الطارق»
    - text:
        ar: البوسفور
        en: the Bosporus
        ur: باسفورس
      correct: false
      why:
        ar: البوسفور في إسطنبول لا هنا
        en: the Bosporus is Istanbul's, not here
        ur: باسفورس استنبول کا ہے، یہاں نہیں
    - text:
        ar: هرمز
        en: Hormuz
        ur: ہرمز
      correct: false
      why:
        ar: هرمز في الخليج لا الأندلس
        en: Hormuz is in the Gulf
        ur: ہرمز خلیج میں ہے
    - text:
        ar: باب المندب
        en: Bab al-Mandab
        ur: باب المندب
      correct: false
      why:
        ar: باب المندب جنوب البحر الأحمر
        en: Bab al-Mandab is south of the Red Sea
        ur: باب المندب بحیرہ احمر کے جنوب میں ہے
  - q:
      ar: متى سقطت غرناطة؟
      en: When did Granada fall?
      ur: غرناطہ کب گرا؟
    options:
    - text:
        ar: عام ١٤٩٢
        en: in 1492
        ur: 1492 میں
      correct: true
      why:
        ar: سقطت آخر ممالك الأندلس عام ١٤٩٢
        en: al-Andalus's last kingdom fell in 1492
        ur: الاندلس کی آخری بادشاہت 1492 میں گری
    - text:
        ar: عام ١٢١٢
        en: in 1212
        ur: 1212 میں
      correct: false
      why:
        ar: ١٢١٢ معركة العقاب لا السقوط
        en: 1212 was Las Navas, not the fall
        ur: 1212 ناواس کی لڑائی تھی، سقوط نہیں
    - text:
        ar: عام ١٠٨٥
        en: in 1085
        ur: 1085 میں
      correct: false
      why:
        ar: ١٠٨٥ عام طليطلة لا غرناطة
        en: 1085 is Toledo's year
        ur: 1085 طليطلہ کا سال ہے
    - text:
        ar: عام ١٥١٧
        en: in 1517
        ur: 1517 میں
      correct: false
      why:
        ar: ١٥١٧ متأخر عن سقوطها
        en: 1517 is after its fall
        ur: 1517 اس کے گرنے کے بعد ہے
  - q:
      ar: ما ذاكرة التعايش؟
      en: What is the coexistence memory?
      ur: بقائے باہمی کی یاد کیا ہے؟
    options:
    - text:
        ar: عيش ثلاثة أديان معًا
        en: three faiths living together
        ur: تین دینوں کا ساتھ رہنا
      correct: true
      why:
        ar: المسلمون والمسيحيون واليهود عاشوا جنبًا
        en: Muslims, Christians and Jews lived side by side
        ur: مسلمان، مسیحی اور یہودی ساتھ رہے
    - text:
        ar: حروب فقط
        en: wars only
        ur: صرف جنگیں
      correct: false
      why:
        ar: ليست حروبًا بل عيش مشترك
        en: shared living, not just wars
        ur: صرف جنگ نہیں، باہمی رہنا
    - text:
        ar: انعزال الأديان
        en: faiths' isolation
        ur: دینوں کی تنہائی
      correct: false
      why:
        ar: ليس انعزالًا بل تعايش
        en: togetherness, not isolation
        ur: تنہائی نہیں، بقائے باہمی
    - text:
        ar: وحدة دين واحد
        en: one single faith
        ur: ایک دین
      correct: false
      why:
        ar: ليست دينًا واحدًا بل ثلاثة
        en: three faiths, not one
        ur: ایک نہیں، تین دین
  - q:
      ar: ماذا تركت الأندلس؟
      en: What did al-Andalus leave?
      ur: الاندلس نے کیا چھوڑا؟
    options:
    - text:
        ar: عمائر وعلوم وذاكرة
        en: monuments, sciences, memory
        ur: یادگاریں، علوم، یاد
      correct: true
      why:
        ar: عمائر كالحمراء وعلوم وتعايش
        en: monuments like the Alhambra, learning, coexistence
        ur: الحمراء جیسی یادگاریں، علم، بقائے باہمی
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: تركت كثيرًا
        en: it left much
        ur: اس نے بہت کچھ چھوڑا
    - text:
        ar: حروب فقط
        en: wars only
        ur: صرف جنگیں
      correct: false
      why:
        ar: ليست حروبًا بل حضارة
        en: a civilisation, not wars
        ur: جنگیں نہیں، تہذیب
    - text:
        ar: خرائط فقط
        en: maps only
        ur: صرف نقشے
      correct: false
      why:
        ar: ليست خرائط بل عمائر وعلوم
        en: monuments and learning, not maps
        ur: نقشے نہیں، یادگاریں اور علم
- id: mongols-and-after
  anchor: exhibit/pathway-g11-chw3m-mongols-and-after
  band: researchers
  title:
    ar: المغول وما بعدهم
    en: The Mongols and After
    ur: منگول اور ان کے بعد
  sixty:
    ar: اجتاح المغول آسيا في القرن الثالث عشر فدمّروا بغداد عام ١٢٥٨ وأنهوا الخلافة العباسية. لكن المماليك أوقفوهم في عين جالوت عام ١٢٦٠ — أول هزيمة كبرى لهم. ثم
      اعتنق أحفاد جنكيز الإسلام أنفسهم، فحكم الإيلخانيون فارس مسلمين وبنت الدول المغولية المتأسلمة عمائر عظيمة. وبعد قرنين جاء تيمور فدمّر مجددًا، لكن أحفاده رعوا
      عصر سمرقند الذهبي.
    en: 'The Mongols swept Asia in the thirteenth century, destroying Baghdad in 1258 and ending the Abbasid caliphate. But the Mamluks stopped them at Ayn Jalut
      in 1260 — their first great defeat. Then Genghis''s own descendants embraced Islam: the Ilkhanids ruled Persia as Muslims and the Islamised Mongol states built
      great monuments. Two centuries on Timur destroyed again, yet his own descendants patronised Samarkand''s golden age.'
    ur: 'منگولوں نے تیرہویں صدی میں ایشیا پر حملہ کیا اور 1258 میں بغداد تباہ کر کے عباسی خلافت ختم کی۔ لیکن ممالیک نے 1260 میں عین جالوت میں انہیں روک دیا — ان کی
      پہلی بڑی شکست۔ پھر چنگیز کی اولاد نے خود اسلام قبول کیا: ایلخانوں نے مسلمان ہو کر فارس پر حکومت کی اور اسلامی ہوئے منگول ریاستوں نے عظیم یادگاریں بنائیں۔ دو
      صدیوں بعد تیمور نے پھر تباہی کی مگر اس کی اولاد نے سمرقند کے سنہری دور کی سرپرستی کی۔'
  glossary:
  - term:
      ar: جنكيز خان
      en: Genghis Khan
      ur: چنگیز خان
    gloss:
      ar: مؤسس الإمبراطورية المغولية
      en: the Mongol empire's founder
      ur: منگول سلطنت کا بانی
  - term:
      ar: هولاكو
      en: Hulagu
      ur: ہلاکو
    gloss:
      ar: القائد الذي دمّر بغداد
      en: the commander who destroyed Baghdad
      ur: وہ سردار جس نے بغداد تباہ کیا
  - term:
      ar: سقوط بغداد
      en: the fall of Baghdad
      ur: بغداد کا سقوط
    gloss:
      ar: ١٢٥٨ نهاية الخلافة
      en: 1258, the caliphate's end
      ur: 1258ء، خلافت کا خاتمہ
  - term:
      ar: عين جالوت
      en: Ayn Jalut
      ur: عین جالوت
    gloss:
      ar: معركة أوقفت المغول عام ١٢٦٠
      en: the battle that stopped them in 1260
      ur: وہ لڑائی جس نے 1260 میں روکا
  - term:
      ar: المماليك
      en: the Mamluks
      ur: ممالیک
    gloss:
      ar: دولة مصر التي هزمتهم
      en: Egypt's state that defeated them
      ur: مصر کی ریاست جس نے انہیں ہرایا
  - term:
      ar: الإيلخانيون
      en: the Ilkhanids
      ur: ایلخان
    gloss:
      ar: الفرع المغولي الذي أسلم في فارس
      en: the Mongol branch that turned Muslim in Persia
      ur: وہ منگول شاخ جو فارس میں مسلم ہوئی
  - term:
      ar: غازان
      en: Ghazan
      ur: غازان
    gloss:
      ar: الإيلخان الذي اعتنق الإسلام
      en: the Ilkhan who embraced Islam
      ur: وہ ایلخان جس نے اسلام قبول کیا
  - term:
      ar: تيمور
      en: Timur
      ur: تیمور
    gloss:
      ar: القائد المغولي المتأخر الذي دمّر مجددًا
      en: the later Mongol leader who destroyed again
      ur: بعد کا منگول سردار جس نے پھر تباہی کی
  - term:
      ar: سمرقند
      en: Samarkand
      ur: سمرقند
    gloss:
      ar: عاصمة تيمور ومركز عصر ذهبي
      en: Timur's capital and a golden-age centre
      ur: تیمور کا پایہ تخت اور سنہری دور کا مرکز
  - term:
      ar: أولوغ بيك
      en: Ulugh Beg
      ur: الغ بیگ
    gloss:
      ar: حفيد تيمور العالم
      en: Timur's scholar grandson
      ur: تیمور کا عالم نواسہ
  - term:
      ar: الدول المتأسلمة
      en: the Islamised states
      ur: اسلامی ہوئی ریاستیں
    gloss:
      ar: الممالك المغولية التي اعتنقت الإسلام
      en: the Mongol kingdoms that embraced Islam
      ur: وہ منگول بادشاہتیں جنھوں نے اسلام قبول کیا
  - term:
      ar: أول هزيمة
      en: the first defeat
      ur: پہلی شکست
    gloss:
      ar: عين جالوت أول وقفة كبرى
      en: Ayn Jalut, their first great halt
      ur: عین جالوت، ان کی پہلی بڑی روک
  practice:
  - q:
      ar: متى سقطت بغداد؟
      en: When did Baghdad fall?
      ur: بغداد کب گرا؟
    options:
    - text:
        ar: عام ١٢٥٨
        en: in 1258
        ur: 1258 میں
      correct: true
      why:
        ar: سقطت بيد هولاكو عام ١٢٥٨
        en: it fell to Hulagu in 1258
        ur: یہ 1258 میں ہلاکو کے ہاتھ گرا
    - text:
        ar: عام ١٢٦٠
        en: in 1260
        ur: 1260 میں
      correct: false
      why:
        ar: ١٢٦٠ عام عين جالوت لا السقوط
        en: 1260 is Ayn Jalut, not the fall
        ur: 1260 عین جالوت کا سال ہے، سقوط نہیں
    - text:
        ar: عام ١٤٩٢
        en: in 1492
        ur: 1492 میں
      correct: false
      why:
        ar: ١٤٩٢ عام غرناطة لا بغداد
        en: 1492 is Granada's year
        ur: 1492 غرناطہ کا سال ہے
    - text:
        ar: عام ٧٥٠
        en: in 750
        ur: 750 میں
      correct: false
      why:
        ar: ٧٥٠ عام بداية العباسية لا نهايتها
        en: 750 begins the Abbasid era, not ends it
        ur: 750 عباسی آغاز ہے، خاتمہ نہیں
  - q:
      ar: من دمّرها؟
      en: Who destroyed it?
      ur: اسے کس نے تباہ کیا؟
    options:
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: true
      why:
        ar: هولاكو حفيد جنكيز دمّرها
        en: Genghis's grandson Hulagu razed it
        ur: چنگیز کے پوتے ہلاکو نے تباہ کیا
    - text:
        ar: جنكيز نفسه
        en: Genghis himself
        ur: خود چنگیز
      correct: false
      why:
        ar: جنكيز مات قبلها بثلاثين عامًا
        en: Genghis died thirty years before
        ur: چنگیز تیس سال پہلے مرا
    - text:
        ar: تيمور
        en: Timur
        ur: تیمور
      correct: false
      why:
        ar: تيمور بعدها بقرن
        en: Timur came a century after
        ur: تیمور ایک صدی بعد آیا
    - text:
        ar: قطز
        en: Qutuz
        ur: قطز
      correct: false
      why:
        ar: قطز مملوكي هزمهم لا دمّر
        en: Qutuz the Mamluk defeated them, did not destroy
        ur: قطز ممالیکی نے انہیں ہرایا، تباہ نہیں کیا
  - q:
      ar: أين أوقفهم المسلمون؟
      en: Where were they stopped?
      ur: انھیں کہاں روکا گیا؟
    options:
    - text:
        ar: عين جالوت
        en: at Ayn Jalut
        ur: عین جالوت پر
      correct: true
      why:
        ar: عين جالوت أول هزيمة كبرى لهم
        en: Ayn Jalut was their first great defeat
        ur: عین جالوت ان کی پہلی بڑی شکست تھی
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد سقطت لا أوقفتهم
        en: Baghdad fell; it did not stop them
        ur: بغداد گرا، روکا نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق ليست موضع المعركة
        en: Damascus was not the battle site
        ur: دمشق لڑائی کی جگہ نہیں تھی
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة مركز المماليك لا الميدان
        en: Cairo was the Mamluk seat, not the field
        ur: قاہرہ ممالیکی نشست تھی، میدان نہیں
  - q:
      ar: من هزمهم فيها؟
      en: Who beat them there?
      ur: وہاں انہیں کس نے ہرایا؟
    options:
    - text:
        ar: المماليك
        en: the Mamluks
        ur: ممالیک
      correct: true
      why:
        ar: مماليك مصر بقيادة قطز وبيبرس
        en: Egypt's Mamluks under Qutuz and Baybars
        ur: مصر کے ممالیک، قطز اور بیبرس کی قیادت میں
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون انتهوا قبلها بقليل
        en: the Abbasids had just ended
        ur: عباسی ابھی ختم ہوئے تھے
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون بعدها بقرون
        en: Ottomans came centuries later
        ur: عثمانی صدیاں بعد آئے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الصليبيون لم يهزموهم هنا
        en: the Crusaders did not beat them there
        ur: صلیبیوں نے وہاں نہیں ہرایا
  - q:
      ar: ماذا فعل أحفاد جنكيز لاحقًا؟
      en: What did Genghis's descendants later do?
      ur: چنگیز کی اولاد نے بعد میں کیا کیا؟
    options:
    - text:
        ar: اعتنقوا الإسلام
        en: they embraced Islam
        ur: انھوں نے اسلام قبول کیا
      correct: true
      why:
        ar: أسلم الإيلخانيون وحكموا مسلمين
        en: the Ilkhanids turned Muslim and ruled as such
        ur: ایلخان مسلم ہوئے اور مسلمان بن کر حکومت کی
    - text:
        ar: دمّروا إلى الأبد
        en: they destroyed forever
        ur: ہمیشہ تباہ کرتے رہے
      correct: false
      why:
        ar: لم يدمّروا دائمًا بل أسلموا
        en: they did not destroy forever; they converted
        ur: وہ ہمیشہ تباہ نہیں کرتے رہے، مسلم ہوئے
    - text:
        ar: رجعوا إلى منغوليا
        en: returned to Mongolia
        ur: منگولیا لوٹ گئے
      correct: false
      why:
        ar: لم يرجعوا بل بقوا وحكموا
        en: they stayed and ruled, did not return
        ur: وہ نہیں لوٹے، رہے اور حکومت کی
    - text:
        ar: انقرضوا كلهم
        en: all died out
        ur: سب ختم ہو گئے
      correct: false
      why:
        ar: لم ينقرضوا بل أسلموا
        en: they did not die out; they converted
        ur: وہ ختم نہیں ہوئے، مسلم ہوئے
  - q:
      ar: من الإيلخان الذي أسلم؟
      en: Which Ilkhan turned Muslim?
      ur: کون سا ایلخان مسلم ہوا؟
    options:
    - text:
        ar: غازان
        en: Ghazan
        ur: غازان
      correct: true
      why:
        ar: غازان أول إيلخان مسلم معلن
        en: Ghazan was the first openly Muslim Ilkhan
        ur: غازان پہلا کھلے مسلم ایلخان تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: هولاكو لم يسلم بل غازان
        en: Hulagu did not convert; Ghazan did
        ur: ہلاکو مسلم نہیں ہوا، غازان ہوا
    - text:
        ar: تيمور
        en: Timur
        ur: تیمور
      correct: false
      why:
        ar: تيمور ليس إيلخانيًا
        en: Timur was not an Ilkhan
        ur: تیمور ایلخان نہیں تھا
    - text:
        ar: جنكيز
        en: Genghis
        ur: چنگیز
      correct: false
      why:
        ar: جنكيز لم يصل الإسلام
        en: Genghis never reached Islam
        ur: چنگیز اسلام تک نہیں پہنچا
  - q:
      ar: من كان تيمور؟
      en: Who was Timur?
      ur: تیمور کون تھا؟
    options:
    - text:
        ar: قائد دمّر ثم بناه أحفاده
        en: a destroyer whose heirs rebuilt
        ur: تباہ کار جس کی اولاد نے تعمیر کی
      correct: true
      why:
        ar: دمّر كثيرًا لكن عاصمته سمرقند ازدهرت
        en: he destroyed much but his Samarkand flourished
        ur: اس نے بہت تباہی کی مگر سمرقند پھلی
    - text:
        ar: أول خليفة عباسي
        en: the first Abbasid caliph
        ur: پہلا عباسی خلیفہ
      correct: false
      why:
        ar: ليس خليفة بل قائد مغولي
        en: a Mongol leader, not a caliph
        ur: خلیفہ نہیں، منگول سردار
    - text:
        ar: سلطان عثماني
        en: an Ottoman sultan
        ur: عثمانی سلطان
      correct: false
      why:
        ar: ليس عثمانيًا بل مغوليًا
        en: a Mongol, not an Ottoman
        ur: عثمانی نہیں، منگول
    - text:
        ar: عالم فلك فقط
        en: only an astronomer
        ur: صرف فلکیات دان
      correct: false
      why:
        ar: ليس عالمًا بل قائدًا
        en: a commander, not a scholar
        ur: عالم نہیں، سردار
  - q:
      ar: ما مدينة عصره الذهبي؟
      en: His golden-age city?
      ur: اس کے سنہری دور کا شہر؟
    options:
    - text:
        ar: سمرقند
        en: Samarkand
        ur: سمرقند
      correct: true
      why:
        ar: سمرقند عاصمته ومركز علم لاحقًا
        en: Samarkand his capital, later a learning centre
        ur: سمرقند اس کا پایہ تخت، بعد میں علمی مرکز
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد ليست مدينته
        en: Baghdad was not his city
        ur: بغداد اس کا شہر نہیں
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: false
      why:
        ar: إسطنبول عثمانية لا تيمورية
        en: Istanbul was Ottoman, not Timurid
        ur: استنبول عثمانی تھی، تیموری نہیں
    - text:
        ar: دلهي
        en: Delhi
        ur: دہلی
      correct: false
      why:
        ar: دلهي هندية متأخرة
        en: Delhi was later Indian
        ur: دہلی بعد کی ہندوستانی تھی
  - q:
      ar: من حفيده العالم؟
      en: His scholar grandson?
      ur: اس کا عالم نواسہ؟
    options:
    - text:
        ar: أولوغ بيك
        en: Ulugh Beg
        ur: الغ بیگ
      correct: true
      why:
        ar: أولوغ بيك بنا مرصد سمرقند
        en: Ulugh Beg built Samarkand's observatory
        ur: الغ بیگ نے سمرقند کی رصد گاہ بنائی
    - text:
        ar: بابر
        en: Babur
        ur: بابر
      correct: false
      why:
        ar: بابر حفيد بعيد في الهند
        en: Babur was a later descendant in India
        ur: بابر بعد کی اولاد تھی، ہند میں
    - text:
        ar: أكبر
        en: Akbar
        ur: اکبر
      correct: false
      why:
        ar: أكبر هندي مغولي متأخر
        en: Akbar was a later Mughal
        ur: اکبر بعد کا مغلیائی تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: هولاكو من فرع آخر
        en: Hulagu was of another branch
        ur: ہلاکو دوسری شاخ کا تھا
  - q:
      ar: لماذا تُعدّ عين جالوت محورًا؟
      en: Why is Ayn Jalut a turning point?
      ur: عین جالوت محور کیوں ہے؟
    options:
    - text:
        ar: لأنها أول وقفة لهم
        en: it was their first halt
        ur: ان کی پہلی روک تھی
      correct: true
      why:
        ar: أول هزيمة كبرى أوقفت زحفهم
        en: the first great defeat halting their sweep
        ur: پہلی بڑی شکست جس نے ان کی پیش قدمی روکی
    - text:
        ar: لأنها آخر معركة
        en: for being the last battle
        ur: آخری لڑائی ہونے کے لیے
      correct: false
      why:
        ar: ليست آخر بل أول وقفة
        en: a first halt, not last battle
        ur: آخری نہیں، پہلی روک
    - text:
        ar: لأنها سقوط بغداد
        en: for being Baghdad's fall
        ur: بغداد کے گرنے کے لیے
      correct: false
      why:
        ar: ليست سقوطًا بل وقفة
        en: a halt, not a fall
        ur: سقوط نہیں، روک
    - text:
        ar: لأنها نهاية الإسلام
        en: for ending Islam
        ur: اسلام کے خاتمے کے لیے
      correct: false
      why:
        ar: لم تنهِ الإسلام بل حفظته
        en: it preserved Islam, did not end it
        ur: اس نے اسلام ختم نہیں کیا، بچایا
- id: five-pillars-daily-life
  anchor: exhibit/pathway-g11-hrf3o-five-pillars-daily-life
  band: researchers
  title:
    ar: الأركان الخمسة في الحياة اليومية
    en: The Five Pillars in Daily Life
    ur: پانچ ارکان روزمرہ زندگی میں
  sixty:
    ar: الأركان الخمسة — الشهادة والصلاة والزكاة والصوم والحج — ليست شعائر معزولة بل نسيج الحياة اليومية للمسلم. تشكل مواقيت الصلاة إيقاع اليوم، وتحكم الزكاة المال،
      ويجمع رمضان الأسر والحارات كل عام، ويربط الحج ملايين المسلمين عبر القارات. وهكذا تترجم العقيدة إلى عادات مشتركة تلمّ شمل الجماعة.
    en: The five pillars — testimony, prayer, alms, fasting and pilgrimage — are not separate rites but the fabric of a Muslim's daily life. Prayer times set the
      day's rhythm, zakat governs wealth, Ramadan gathers families and neighbourhoods every year, and the Hajj links millions of Muslims across continents. In this
      way belief becomes shared habits that bind a community together.
    ur: پانچ ارکان — شہادت، نماز، زکوٰت، روزہ اور حج — الگ الگ رسومات نہیں بلکہ مسلمان کی روزمرہ زندگی کا تانا بانا ہیں۔ نماز کے اوقات دن کی تال بناتے ہیں، زکوٰت
      مال کو منظم کرتی ہے، رمضان ہر سال خاندان اور محلے جمع کرتا ہے اور حج براعظموں کے لاکھوں مسلمانوں کو جوڑتا ہے۔ یوں عقیدہ مشترک عادات بن کر برادری کو باندھتی
      ہے۔
  glossary:
  - term:
      ar: الشهادة
      en: the testimony
      ur: شہادت
    gloss:
      ar: إقرار التوحيد ورسالة النبي
      en: affirming God's oneness and the Prophet's mission
      ur: اللہ کی وحدانیت اور نبوت کا اقرار
  - term:
      ar: الصلاة
      en: the prayer
      ur: نماز
    gloss:
      ar: خمس صلوات في اليوم
      en: five daily prayers
      ur: دن میں پانچ نمازیں
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰت
    gloss:
      ar: عطية المال الواجبة
      en: the obligatory wealth-giving
      ur: مال کا لازم عطیہ
  - term:
      ar: الصوم
      en: fasting
      ur: روزہ
    gloss:
      ar: صيام رمضان
      en: the Ramadan fast
      ur: رمضان کا روزہ
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: زيارة مكة لمن استطاع
      en: the Mecca journey for whoever can
      ur: جو استطاعت رکھتا ہے اس کا مکہ سفر
  - term:
      ar: مواقيت
      en: the prayer times
      ur: اوقات
    gloss:
      ar: أوقات الصلوات الخمس
      en: the five prayer times
      ur: پانچ نمازوں کے وقت
  - term:
      ar: الإيقاع اليومي
      en: the daily rhythm
      ur: روزانہ تال
    gloss:
      ar: شكل اليوم حول الصلوات
      en: the day shaped around the prayers
      ur: نمازوں کے گرد دن کی صورت
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: شهر يجمع الأسر والحارات
      en: the month gathering families and streets
      ur: وہ مہینہ جو خاندان اور محلے جمع کرتا ہے
  - term:
      ar: الجماعة
      en: the community
      ur: برادری
    gloss:
      ar: المجموعة التي تربطها الأركان
      en: the body the pillars bind
      ur: وہ گروہ جسے ارکان باندھتے ہیں
  - term:
      ar: العادات المشتركة
      en: shared habits
      ur: مشترک عادات
    gloss:
      ar: أفعال تؤديها الجماعة معًا
      en: acts the community does together
      ur: وہ کام جو برادری مل کر کرتی ہے
  - term:
      ar: الاستطاعة
      en: capability
      ur: استطاعت
    gloss:
      ar: شرط الحج لمن يقدر
      en: the Hajj condition for whoever can
      ur: حج کی شرط جو استطاعت رکھتا ہو
  - term:
      ar: العبادة
      en: worship
      ur: عبادت
    gloss:
      ar: عمل القربى اليومي
      en: daily act of devotion
      ur: روزانہ قرب کا عمل
  practice:
  - q:
      ar: كم عدد الأركان؟
      en: How many pillars are there?
      ur: ارکان کتنے ہیں؟
    options:
    - text:
        ar: خمسة
        en: five
        ur: پانچ
      correct: true
      why:
        ar: الشهادة والصلاة والزكاة والصوم والحج
        en: testimony, prayer, alms, fasting, pilgrimage
        ur: شہادت، نماز، زکوٰت، روزہ، حج
    - text:
        ar: أربعة
        en: four
        ur: چار
      correct: false
      why:
        ar: خمسة لا أربعة
        en: five, not four
        ur: چار نہیں، پانچ
    - text:
        ar: ستة
        en: six
        ur: چھ
      correct: false
      why:
        ar: خمسة لا ستة
        en: five, not six
        ur: چھ نہیں، پانچ
    - text:
        ar: سبعة
        en: seven
        ur: سات
      correct: false
      why:
        ar: خمسة لا سبعة
        en: five, not seven
        ur: سات نہیں، پانچ
  - q:
      ar: ما الركن الأول؟
      en: The first pillar?
      ur: پہلا رکن؟
    options:
    - text:
        ar: الشهادة
        en: the testimony
        ur: شہادت
      correct: true
      why:
        ar: الشهادة أول الأركان
        en: the testimony comes first
        ur: شہادت پہلا رکن ہے
    - text:
        ar: الصلاة
        en: the prayer
        ur: نماز
      correct: false
      why:
        ar: الصلاة ثاني الأركان
        en: prayer is the second
        ur: نماز دوسرا ہے
    - text:
        ar: الحج
        en: the Hajj
        ur: حج
      correct: false
      why:
        ar: الحج آخر الأركان
        en: the Hajj is the last
        ur: حج آخری ہے
    - text:
        ar: الصوم
        en: fasting
        ur: روزہ
      correct: false
      why:
        ar: الصوم رابع الأركان
        en: fasting is the fourth
        ur: روزہ چوتھا ہے
  - q:
      ar: كم صلاة في اليوم؟
      en: How many prayers a day?
      ur: دن میں کتنی نمازیں؟
    options:
    - text:
        ar: خمس
        en: five
        ur: پانچ
      correct: true
      why:
        ar: خمس صلوات من الفجر إلى العشاء
        en: five prayers from dawn to night
        ur: فجر سے عشا تک پانچ نمازیں
    - text:
        ar: ثلاث
        en: three
        ur: تین
      correct: false
      why:
        ar: خمس لا ثلاث
        en: five, not three
        ur: تین نہیں، پانچ
    - text:
        ar: أربع
        en: four
        ur: چار
      correct: false
      why:
        ar: خمس لا أربع
        en: five, not four
        ur: چار نہیں، پانچ
    - text:
        ar: سبع
        en: seven
        ur: سات
      correct: false
      why:
        ar: خمس لا سبع
        en: five, not seven
        ur: سات نہیں، پانچ
  - q:
      ar: ما الذي يضبط إيقاع اليوم؟
      en: What sets the day's rhythm?
      ur: دن کی تال کیا بناتا ہے؟
    options:
    - text:
        ar: مواقيت الصلاة
        en: the prayer times
        ur: نماز کے اوقات
      correct: true
      why:
        ar: الصلوات الخمس تشكل اليوم
        en: the five prayers shape the day
        ur: پانچ نمازیں دن بناتی ہیں
    - text:
        ar: وجبات الطعام
        en: mealtimes
        ur: کھانے کے وقت
      correct: false
      why:
        ar: ليست وجبات بل صلوات
        en: prayers, not meals
        ur: کھانا نہیں، نمازیں
    - text:
        ar: ساعات العمل
        en: work hours
        ur: کام کے گھنٹے
      correct: false
      why:
        ar: ليست عملًا بل صلاة
        en: prayer, not work
        ur: کام نہیں، نماز
    - text:
        ar: النوم
        en: sleep
        ur: نیند
      correct: false
      why:
        ar: ليست نومًا بل صلاة
        en: prayer, not sleep
        ur: نیند نہیں، نماز
  - q:
      ar: ما الذي يحكم المال؟
      en: What governs wealth?
      ur: مال کو کیا منظم کرتا ہے؟
    options:
    - text:
        ar: الزكاة
        en: zakat
        ur: زکوٰت
      correct: true
      why:
        ar: الزكاة تحكم المال الفائض
        en: zakat governs surplus wealth
        ur: زکوٰت فاضل مال منظم کرتی ہے
    - text:
        ar: الصوم
        en: fasting
        ur: روزہ
      correct: false
      why:
        ar: الصوم للنفس لا المال
        en: fasting is for the soul, not wealth
        ur: روزہ نفس کا ہے، مال کا نہیں
    - text:
        ar: الشهادة
        en: testimony
        ur: شہادت
      correct: false
      why:
        ar: الشهادة إقرار لا مال
        en: testimony affirms, not wealth
        ur: شہادت اقرار ہے، مال نہیں
    - text:
        ar: الصلاة
        en: prayer
        ur: نماز
      correct: false
      why:
        ar: الصلاة للوقت لا المال
        en: prayer is for time, not wealth
        ur: نماز وقت کی ہے، مال کی نہیں
  - q:
      ar: أيّ شهر يجمع الأسر؟
      en: Which month gathers families?
      ur: کون سا مہینہ خاندان جمع کرتا ہے؟
    options:
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: true
      why:
        ar: رمضان يجمع الأسر والحارات
        en: Ramadan gathers families and streets
        ur: رمضان خاندان اور محلے جمع کرتا ہے
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الجمع
        en: Muharram opens the year, not gathering
        ur: محرم سال کا پہلا ہے، جمع کا نہیں
    - text:
        ar: شعبان
        en: Sha'ban
        ur: شعبان
      correct: false
      why:
        ar: شعبان قبل رمضان
        en: Sha'ban precedes Ramadan
        ur: شعبان رمضان سے پہلے ہے
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب سابع الشهر لا الجمع
        en: Rajab is the seventh, not the gathering
        ur: رجب ساتواں ہے، جمع کا نہیں
  - q:
      ar: ما شرط الحج؟
      en: The Hajj's condition?
      ur: حج کی شرط؟
    options:
    - text:
        ar: الاستطاعة
        en: capability
        ur: استطاعت
      correct: true
      why:
        ar: لمن استطاع إليه سبيلاً
        en: for whoever can make the way
        ur: جو راستہ کر سکے اس کے لیے
    - text:
        ar: الغنى فقط
        en: wealth only
        ur: صرف دولت
      correct: false
      why:
        ar: ليست غنى فقط بل استطاعة
        en: capability, not wealth alone
        ur: صرف دولت نہیں، استطاعت
    - text:
        ar: العمر
        en: age
        ur: عمر
      correct: false
      why:
        ar: ليس عمرًا بل استطاعة
        en: capability, not age
        ur: عمر نہیں، استطاعت
    - text:
        ar: كل عام
        en: every year
        ur: ہر سال
      correct: false
      why:
        ar: مرة في العمر لا كل عام
        en: once in a life, not yearly
        ur: ہر سال نہیں، عمر میں ایک بار
  - q:
      ar: ماذا يربط الحج؟
      en: What does the Hajj link?
      ur: حج کیا جوڑتا ہے؟
    options:
    - text:
        ar: ملايين عبر القارات
        en: millions across continents
        ur: براعظموں کے لاکھوں
      correct: true
      why:
        ar: يجمع مسلمين من كل بلد
        en: it gathers Muslims from every land
        ur: ہر ملک کے مسلمانوں کو جمع کرتا ہے
    - text:
        ar: مدينة واحدة
        en: one city
        ur: ایک شہر
      correct: false
      why:
        ar: ليست مدينة بل العالم
        en: the world, not one city
        ur: ایک شہر نہیں، دنیا
    - text:
        ar: العائلة فقط
        en: family only
        ur: صرف خاندان
      correct: false
      why:
        ar: ليست عائلة بل أمّة
        en: the whole umma, not one family
        ur: صرف خاندان نہیں، امت
    - text:
        ar: الشيوخ
        en: the elders
        ur: بزرگ
      correct: false
      why:
        ar: ليست شيوخًا بل جماعة
        en: the community, not just elders
        ur: بزرگ نہیں، برادری
  - q:
      ar: ماذا تفعل الأركان بالعقيدة؟
      en: What do the pillars do to belief?
      ur: ارکان عقیدے کا کیا کرتے ہیں؟
    options:
    - text:
        ar: يحوّلونها إلى عادات
        en: they turn it into habits
        ur: عادات میں بدل دیتے ہیں
      correct: true
      why:
        ar: تترجم الإيمان إلى أفعال يومية
        en: they translate faith into daily acts
        ur: یہ ایمان کو روزانہ اعمال میں ڈھالتے ہیں
    - text:
        ar: يلغونها
        en: they cancel it
        ur: ختم کر دیتے ہیں
      correct: false
      why:
        ar: لا يلغون بل يجسّدون
        en: they embody it, not cancel
        ur: یہ ختم نہیں، مجسم کرتے ہیں
    - text:
        ar: يخفونها
        en: they hide it
        ur: چھپا دیتے ہیں
      correct: false
      why:
        ar: لا يخفون بل يظهرون
        en: they show it, not hide
        ur: یہ چھپاتے نہیں، ظاہر کرتے ہیں
    - text:
        ar: يعقّدونها
        en: they complicate it
        ur: پیچیدہ کرتے ہیں
      correct: false
      why:
        ar: لا يعقّدون بل يبسّطون
        en: they simplify it, not complicate
        ur: یہ پیچیدہ نہیں، سادہ کرتے ہیں
  - q:
      ar: لماذا تُسمّى «أركانًا»؟
      en: Why called 'pillars'?
      ur: انہیں «ارکان» کیوں کہتے ہیں؟
    options:
    - text:
        ar: لأنها تحمل الدين
        en: they carry the faith
        ur: یہ دین اٹھاتے ہیں
      correct: true
      why:
        ar: كالأركان تحمل البناء يسندون الإيمان
        en: like pillars holding a building, they hold faith
        ur: جیسے ستون عمارت اٹھاتے ہیں، یہ دین اٹھاتے ہیں
    - text:
        ar: لأنها حجارة
        en: for being stones
        ur: پتھر ہونے کے لیے
      correct: false
      why:
        ar: ليست حجارة بل أعمال
        en: acts, not stones
        ur: پتھر نہیں، اعمال
    - text:
        ar: لأنها قديمة
        en: for being old
        ur: پرانے ہونے کے لیے
      correct: false
      why:
        ar: ليست قديمة بل أساسية
        en: foundational, not just old
        ur: پرانے نہیں، بنیادی
    - text:
        ar: لأنها خمسة
        en: for being five
        ur: پانچ ہونے کے لیے
      correct: false
      why:
        ar: ليس العدد بل الوظيفة
        en: the role, not the number
        ur: تعداد نہیں، کردار
- id: islamic-art-architecture
  anchor: exhibit/pathway-g11-hrt3m-islamic-art-architecture
  band: researchers
  title:
    ar: الفن والعمارة الإسلامية
    en: Islamic Art and Architecture
    ur: اسلامی فن اور تعمیرات
  sixty:
    ar: 'جمع الفن الإسلامي الخط والزخرفة والهندسة بدل الصورة في أماكن العبادة. طوّرت العمارة المسجد عبر العصور: من بساطة مسجد النبي الأول إلى قبة الصخرة الذهبية،
      وأقواس قرطبة المزدوجة، وقباب سنان العثمانية. وفي الوقت نفسه غطّت الأرابيسك والأنماط الهندسية كل سطح — فصار الفن لغة توحيد النظرة إلى العالم.'
    en: 'Islamic art joined calligraphy, ornament and geometry in place of the figure in spaces of worship. Mosque architecture evolved across eras: from the simplicity
      of the Prophet''s first mosque to the Dome of the Rock''s golden dome, Cordoba''s double arches and Sinan''s Ottoman domes. Meanwhile arabesque and geometric
      pattern covered every surface — art became a language unifying the gaze upon the world.'
    ur: 'اسلامی فن نے عبادت گاہوں میں تصویر کی جگہ خطاطی، زخرفہ اور ہندسہ جمع کیا۔ مسجد کی تعمیر زمانوں میں ارتقا پزیر ہوئی: نبی کی پہلی مسجد کی سادگی سے قبة الصخرہ
      کے سنہری گنبد، قرطبہ کی دوہری محرابیں اور سنان کے عثمانی گنبدوں تک۔ اسی دوران ارابیسک اور ہندسی نقش ہر سطح ڈھانپتے رہے — فن دنیا کی نظر یکساں کرنے کی زبان بنا۔'
  glossary:
  - term:
      ar: الأرابيسك
      en: the arabesque
      ur: ارابیسک
    gloss:
      ar: زخرفة نباتية متشابكة بلا نهاية
      en: endless interlaced plant ornament
      ur: بے انت الجڑی پودوں کی زینت
  - term:
      ar: الهندسة الزخرفية
      en: geometric pattern
      ur: ہندسی نقش
    gloss:
      ar: أشكال رياضية تغطي الأسطح
      en: mathematical shapes covering surfaces
      ur: سطحوں کو ڈھانپنے والی ریاضی شکلیں
  - term:
      ar: قبة الصخرة
      en: the Dome of the Rock
      ur: قبة الصخرہ
    gloss:
      ar: أقدم عمارة إسلامية باقية كبيرة
      en: the oldest large surviving Islamic monument
      ur: سب سے قدیم بڑی باقی اسلامی یادگار
  - term:
      ar: سنان
      en: Sinan
      ur: سنان
    gloss:
      ar: أعظم المهندسين العثمانيين
      en: the greatest Ottoman architect
      ur: سب سے بڑا عثمانی معمار
  - term:
      ar: الأقواس المزدوجة
      en: double arches
      ur: دوہری محرابیں
    gloss:
      ar: ابتكار جامع قرطبة
      en: Cordoba mosque's invention
      ur: قرطبہ مسجد کی ایجاد
  - term:
      ar: المحراب
      en: the mihrab
      ur: محراب
    gloss:
      ar: حجرة القبلة في المسجد
      en: the mosque's qibla niche
      ur: مسجد کا قبلہ محراب
  - term:
      ar: المنارة
      en: the minaret
      ur: مینار
    gloss:
      ar: برج الأذان
      en: the call-to-prayer tower
      ur: اذان کا مینار
  - term:
      ar: الخط
      en: calligraphy
      ur: خطاطی
    gloss:
      ar: فن الكتابة الجميلة
      en: the art of beautiful writing
      ur: خوبصورت تحریر کا فن
  - term:
      ar: الإوات
      en: the iwans
      ur: ایوان
    gloss:
      ar: قاعات مقوسة في العمارة الفارسية
      en: vaulted halls in Persian building
      ur: فارسی تعمیر کے محرابی ہال
  - term:
      ar: المقرنصات
      en: muqarnas
      ur: مقرنصات
    gloss:
      ar: زخرفة معلقة في القباب
      en: hanging ornament in the domes
      ur: گنبدوں میں لٹکتی زینت
  - term:
      ar: البلاط
      en: tilework
      ur: ٹائل
    gloss:
      ar: خزف ملون يكسو الجدران
      en: coloured glazed tile on walls
      ur: دیواروں پر رنگین ٹائل
  - term:
      ar: المسجد النبوي
      en: the Prophet's Mosque
      ur: مسجد نبوی
    gloss:
      ar: أول مسجد بسيط في المدينة
      en: the first simple mosque, in Medina
      ur: پہلی سادہ مسجد، مدینہ میں
  practice:
  - q:
      ar: ما الذي يجمعه الفن الإسلامي؟
      en: What does Islamic art join?
      ur: اسلامی فن کیا جمع کرتا ہے؟
    options:
    - text:
        ar: الخط والزخرفة والهندسة
        en: calligraphy, ornament, geometry
        ur: خطاطی، زخرفہ، ہندسہ
      correct: true
      why:
        ar: جمع الخط والنقش والهندسة بدل الصورة
        en: it joined script, pattern and geometry over figure
        ur: اس نے تحریر، نقش اور ہندسہ تصویر پر جمع کیا
    - text:
        ar: الصور البشرية
        en: human figures
        ur: انسانی تصویریں
      correct: false
      why:
        ar: ليس صورًا بل خط ونقش
        en: script and pattern, not figures
        ur: تصویریں نہیں، خط اور نقش
