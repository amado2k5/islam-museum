- id: umayyad-mosque
  anchor: building/umayyad-mosque
  band: scholars
  title:
    ar: الجامع الأموي
    en: the Umayyad Mosque
    ur: اموی جامع
  sixty:
    ar: 'الجامع الأموي في دمشق: أعظم مساجد العصر الأموي، بناه الوليد بن عبد الملك عام ٧١٥ في موقع معبد روماني وكنيسة يوحنا المعمدان. جمع البناء فسيفساء زجاجية ذهبية
      تصوّر الجنة — بلا وجوه — وقاعة صلاة واسعة وصحنًا مفتوحًا، وحمل فيها الخط الكوفي. احترق مرارًا وأعيد بناؤه، وبقي فيه قبر يوحنا المعمدان عند المسلمين والمسيحيين
      معًا. بقي الجامع نموذج المسجد الإسلامي المبكر: منارة مربعة وقبة ورواق وجامعًا للمدينة القديمة.'
    en: 'The Umayyad Mosque in Damascus: the Umayyad era''''s greatest mosque, built by al-Walid ibn Abd al-Malik in 715 on the site of a Roman temple and the church
      of John the Baptist. Its golden glass mosaics picture paradise — without faces — beside a wide prayer hall and open courtyard, all in Kufic script. It burned
      repeatedly and was rebuilt, and it still holds the grave of John the Baptist shared by Muslims and Christians alike. It stayed the model of the early Islamic
      mosque: square minaret, dome, portico and gatherer of the Old City.'
    ur: 'دمشق میں اموی جامع: اموی دور کی عظیم ترین مسجد، جسے ولید بن عبدالملک نے 715 میں رومی معبد اور یحییٰ المعمدان کی کلیسا کی جگہ پر بنایا۔ اس کی سنہری شیشے کی
      موزائک جنت دکھاتی ہے — چہروں کے بغیر — وسیع نماز ہال اور کھلے صحن کے ساتھ، سب کوفی خط میں۔ یہ بار بار جلی اور دوبارہ بنی، اور اس میں اب بھی یحییٰ المعمدان کی
      قبر ہے جسے مسلمان اور مسیحی دونوں مانتے ہیں۔ یہ ابتدائی اسلامی مسجد کا نمونہ رہی: چوکور مینار، گنبد، رواق اور پرانے شہر کی جامع۔'
  glossary:
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: مدينته عاصمة الأمويين
      en: his city, the Umayyad capital
      ur: امویوں کا دارالحکومت شہر
  - term:
      ar: الوليد بن عبد الملك
      en: al-Walid ibn Abd al-Malik
      ur: ولید بن عبدالملک
    gloss:
      ar: الخليفة الذي بناه
      en: the caliph who built it
      ur: وہ خلیفہ جس نے اسے بنایا
  - term:
      ar: ٧١٥
      en: '715'
      ur: '715'
    gloss:
      ar: عام بنائه
      en: the year of its building
      ur: اس کی تعمیر کا سال
  - term:
      ar: يوحنا المعمدان
      en: John the Baptist
      ur: یحییٰ المعمدان
    gloss:
      ar: صاحب القبر فيه والكنيسة قبله
      en: the grave''s owner and the church before
      ur: قبر کا صاحب اور اس سے پہلے کی کلیسا
  - term:
      ar: الفسيفساء
      en: the mosaics
      ur: موزائک
    gloss:
      ar: زجاجها الذهبي الذي يصوّر الجنة
      en: its golden glass picturing paradise
      ur: اس کا سنہری شیشہ جو جنت دکھاتا ہے
  - term:
      ar: بلا وجوه
      en: without faces
      ur: چہروں کے بغیر
    gloss:
      ar: ما تجنّبته فسيفساؤه من التصوير
      en: what its mosaics avoid depicting
      ur: وہ جو اس کی موزائک دکھانے سے بچتی ہے
  - term:
      ar: الكوفية
      en: the Kufic
      ur: کوفی
    gloss:
      ar: خط نقوشه
      en: its inscriptions'' script
      ur: اس کے نقشوں کی رسم الخط
  - term:
      ar: الصحن
      en: the courtyard
      ur: صحن
    gloss:
      ar: فضاؤه المفتوح للمدينة
      en: its open space for the city
      ur: شہر کے لیے اس کی کھلی جگہ
  - term:
      ar: المنارة المربعة
      en: the square minaret
      ur: چوکور مینار
    gloss:
      ar: شكل منارته المبكر
      en: its early minaret shape
      ur: اس کے ابتدائی مینار کی شکل
  - term:
      ar: الحرائق
      en: the fires
      ur: آگ
    gloss:
      ar: ما احترق فيه وأعيد بناؤه
      en: what it burned in and was rebuilt
      ur: وہ جس میں یہ جلا اور دوبارہ بنا
  - term:
      ar: الكنيسة
      en: the church
      ur: کلیسا
    gloss:
      ar: الموقع قبل بنائه
      en: the site before its building
      ur: تعمیر سے پہلے کی جگہ
  - term:
      ar: المعبد الروماني
      en: the Roman temple
      ur: رومی معبد
    gloss:
      ar: أقدم استعمال للموقع
      en: the site''s earliest use
      ur: جگہ کا قدیم ترین استعمال
  practice:
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنایا؟
    options:
    - text:
        ar: الوليد بن عبد الملك عام ٧١٥
        en: al-Walid ibn Abd al-Malik in 715
        ur: ولید بن عبدالملک نے 715 میں
      correct: true
      why:
        ar: تنسب المصادر بناءه إلى الوليد
        en: the sources credit it to al-Walid
        ur: ماخذ اسے ولید سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعده بأربعة قرون ونصف
        en: Saladin came four and a half centuries later
        ur: صلاح الدین ساڑھے چار صدیوں بعد آیا
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: جاء الفاتح بعده بسبعة قرون
        en: the Conqueror came seven centuries later
        ur: فاتح سات صدیوں بعد آیا
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: بناه الأمويون لا العباسيون
        en: the Umayyads built it, not the Abbasids
        ur: امویوں نے بنایا، عباسیوں نے نہیں
  - q:
      ar: على ماذا بُني؟
      en: What was it built on?
      ur: یہ کس پر بنا؟
    options:
    - text:
        ar: موقع معبد روماني وكنيسة يوحنا
        en: a Roman temple and John''s church site
        ur: رومی معبد اور یحییٰ کی کلیسا کی جگہ پر
      correct: true
      why:
        ar: تذكر المصادر تاريخ الموقع قبله
        en: the sources record the site''s earlier uses
        ur: ماخذ جگہ کے پہلے کے استعمال لکھتے ہیں
    - text:
        ar: صحراء خالية
        en: empty desert
        ur: خالی صحرا
      correct: false
      why:
        ar: قام على موقع مقدس قديم
        en: it stood on an old sacred site
        ur: یہ قدیم مقدس جگہ پر بنا
    - text:
        ar: مدينة جديدة
        en: a new city
        ur: نیا شہر
      correct: false
      why:
        ar: بنيت في دمشق القديمة
        en: it was built in old Damascus
        ur: یہ پرانے دمشق میں بنی
    - text:
        ar: جبل
        en: a mountain
        ur: پہاڑ
      correct: false
      why:
        ar: بنيت في قلب المدينة لا جبل
        en: it was built in the city''s heart, not a mountain
        ur: یہ شہر کے دل میں بنی، پہاڑ پر نہیں
  - q:
      ar: ما فسيفساؤه؟
      en: What are its mosaics?
      ur: اس کی موزائک کیا ہے؟
    options:
    - text:
        ar: زجاجية ذهبية تصوّر الجنة بلا وجوه
        en: golden glass picturing paradise without faces
        ur: سنہری شیشہ جو جنت دکھاتا ہے، چہروں کے بغیر
      correct: true
      why:
        ar: تذكر المصادر تجنبها الوجوه
        en: the sources note their avoiding faces
        ur: ماخذ ان کے چہروں سے بچنے کا ذکر کرتے ہیں
    - text:
        ar: حجرية رومانية
        en: Roman stone
        ur: رومی پتھر
      correct: false
      why:
        ar: فسيفساؤه إسلامية ذهبية لا رومانية
        en: its mosaics are golden Islamic, not Roman
        ur: اس کی موزائک سنہری اسلامی ہے، رومی نہیں
    - text:
        ar: لا فسيفساء
        en: no mosaics
        ur: کوئی موزائک نہیں
      correct: false
      why:
        ar: تحمل فسيفساء مشهورة
        en: it carries famous mosaics
        ur: اس میں مشہور موزائک ہے
    - text:
        ar: صور أشخاص
        en: people''s pictures
        ur: لوگوں کی تصاویر
      correct: false
      why:
        ar: تجنبت وجوه الأشخاص
        en: they avoided human faces
        ur: انہوں نے چہروں سے بچا
  - q:
      ar: ماذا فيه من القبور؟
      en: What grave does it hold?
      ur: اس میں کس کی قبر ہے؟
    options:
    - text:
        ar: قبر يوحنا المعمدان
        en: John the Baptist''s grave
        ur: یحییٰ المعمدان کی قبر
      correct: true
      why:
        ar: يذكر المصادر قبره فيه عند الفريقين
        en: the sources have his grave there for both faiths
        ur: ماخذ دونوں دینوں کے لیے وہاں اس کی قبر لکھتے ہیں
    - text:
        ar: قبر النبي
        en: the Prophet''s grave
        ur: نبی کی قبر
      correct: false
      why:
        ar: قبر النبي في المدينة لا دمشق
        en: the Prophet''s grave is in Medina, not Damascus
        ur: نبی کی قبر مدینہ میں ہے، دمشق میں نہیں
    - text:
        ar: قبر الخليفة
        en: the caliph''s grave
        ur: خلیفہ کی قبر
      correct: false
      why:
        ar: قبر يوحنا فيه لا الوليد
        en: it holds John''s grave, not al-Walid''s
        ur: اس میں یحییٰ کی قبر ہے، ولید کی نہیں
    - text:
        ar: لا قبور
        en: no graves
        ur: کوئی قبر نہیں
      correct: false
      why:
        ar: يذكر المصادر قبر يوحنا فيه
        en: the sources name John''s grave there
        ur: ماخذ وہاں یحییٰ کی قبر لکھتے ہیں
  - q:
      ar: ما شكل منارته؟
      en: What is its minaret''s shape?
      ur: اس کے مینار کی شکل کیا ہے؟
    options:
    - text:
        ar: مربعة
        en: square
        ur: چوکور
      correct: true
      why:
        ar: يذكر المصادر شكلها المبكر
        en: the sources give its early shape
        ur: ماخذ اس کی ابتدائی شکل دیتے ہیں
    - text:
        ar: مدببة كالقلم
        en: pencil-pointed
        ur: قلم جیسی نوکیلی
      correct: false
      why:
        ar: المدببة عثمانية لا أموية
        en: the pencil shape is Ottoman, not Umayyad
        ur: نوکیلی شکل عثمانی ہے، اموی نہیں
    - text:
        ar: ملتوية
        en: twisted
        ur: مڑی ہوئی
      correct: false
      why:
        ar: مربعة لا ملتوية في المصادر
        en: square, not twisted, in the sources
        ur: ماخذ میں چوکور ہے، مڑی ہوئی نہیں
    - text:
        ar: لا منارة
        en: no minaret
        ur: کوئی مینار نہیں
      correct: false
      why:
        ar: لها منارة مربعة مبكرة
        en: it has an early square minaret
        ur: اس میں ابتدائی چوکور مینار ہے
  - q:
      ar: ماذا حدث له عبر الزمن؟
      en: What happened to it over time?
      ur: زمانے میں اسے کیا ہوا؟
    options:
    - text:
        ar: احترق مرارًا وأعيد بناؤه
        en: it burned repeatedly and was rebuilt
        ur: یہ بار بار جلی اور دوبارہ بنی
      correct: true
      why:
        ar: تذكر المصادر حرائقه وإعاداته
        en: the sources record its fires and rebuildings
        ur: ماخذ اس کی آگ اور دوبارہ تعمیر لکھتے ہیں
    - text:
        ar: لم يمسّه شيء
        en: nothing touched it
        ur: اسے کچھ نہیں ہوا
      correct: false
      why:
        ar: تذكر المصادر حرائقه
        en: the sources record its fires
        ur: ماخذ اس کی آگ لکھتے ہیں
    - text:
        ar: هُدم كليًّا
        en: it was fully demolished
        ur: یہ مکمل مسمار ہوئی
      correct: false
      why:
        ar: بقي قائمًا بإعادات
        en: it stayed standing through rebuildings
        ur: یہ دوبارہ تعمیر کے ساتھ کھڑی رہی
    - text:
        ar: تحوّل إلى قصر
        en: it became a palace
        ur: یہ محل بن گئی
      correct: false
      why:
        ar: بقي مسجدًا في المصادر
        en: it stayed a mosque in the sources
        ur: یہ ماخذ میں مسجد رہی
  - q:
      ar: لماذا يهمّ؟
      en: Why does it matter?
      ur: یہ کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه نموذج المسجد الإسلامي المبكر
        en: because it is the early Islamic mosque''s model
        ur: کیونکہ یہ ابتدائی اسلامی مسجد کا نمونہ ہے
      correct: true
      why:
        ar: جمع القاعة والصحن والمنارة في صيغة
        en: it joined hall, courtyard and minaret in one form
        ur: اس نے ہال، صحن اور مینار کو ایک شکل میں جمع کیا
    - text:
        ar: لأنه أكبر مسجد في العالم
        en: because it is the world''s largest mosque
        ur: کیونکہ یہ دنیا کی سب سے بڑی مسجد ہے
      correct: false
      why:
        ar: أهميته تاريخية ومعمارية لا حجمية
        en: its importance is historic and architectural, not size
        ur: اس کی اہمیت تاریخی اور معماری ہے، حجمی نہیں
    - text:
        ar: لأنه في مكة
        en: because it is in Mecca
        ur: کیونکہ یہ مکہ میں ہے
      correct: false
      why:
        ar: هو في دمشق لا مكة
        en: it is in Damascus, not Mecca
        ur: یہ دمشق میں ہے، مکہ میں نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: يعدّ أعظم المساجد الأموية
        en: it is counted the greatest Umayyad mosque
        ur: یہ عظیم ترین اموی مسجد شمار ہوتی ہے
  - q:
      ar: من كتب عنه؟
      en: Who wrote about it?
      ur: اس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو دمشق والعمارة الإسلامية
        en: Damascus''s historians and Islamic architecture scholars
        ur: دمشق کے مؤرخین اور اسلامی معماری کے علماء
      correct: true
      why:
        ar: تصلنا وصفه من الرحّالة والمؤرخين
        en: its accounts reach us from travellers and historians
        ur: سیاحوں اور مؤرخین سے اس کی وصف پہنچی
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقته الكتب والفسيفساء
        en: books and mosaics document it
        ur: کتابوں اور موزائک نے اسے ثبت کیا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of it
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنه قبل العثمانيين بقرون
        en: it was written of centuries before the Ottomans
        ur: اس کے بارے میں عثمانیوں سے صدیوں پہلے لکھا گیا
  - q:
      ar: ماذا جمع في بنائه؟
      en: What did it join in its building?
      ur: اس نے اپنی تعمیر میں کیا ملا؟
    options:
    - text:
        ar: الموقع الروماني والكنيسة والمسجد
        en: the Roman site, the church and the mosque
        ur: رومی جگہ، کلیسا اور مسجد
      correct: true
      why:
        ar: جمع تاريخ المكان في بناء واحد
        en: it gathered the place''s history in one building
        ur: اس نے جگہ کی تاریخ کو ایک عمارت میں جمع کیا
    - text:
        ar: لا شيء جديد
        en: nothing new
        ur: کچھ نیا نہیں
      correct: false
      why:
        ar: جمع العصور في موقعه في المصادر
        en: the sources have it join the ages in its site
        ur: ماخذ میں اس نے اپنی جگہ میں دوروں کو جمع کیا
    - text:
        ar: الصيني والهندي
        en: Chinese and Indian
        ur: چینی اور ہندوستانی
      correct: false
      why:
        ar: جمع التاريخ المحلي لا الصيني
        en: it joined local history, not Chinese
        ur: اس نے مقامی تاریخ جمع کی، چینی نہیں
    - text:
        ar: المعبد فقط
        en: only the temple
        ur: صرف معبد
      correct: false
      why:
        ar: جمع معبدًا وكنيسة ومسجدًا
        en: it joined temple, church and mosque
        ur: اس نے معبد، کلیسا اور مسجد جمع کیے
  - q:
      ar: ما الذي يميّز قبره؟
      en: What distinguishes its grave?
      ur: اس کی قبر کی کیا خاصیت ہے؟
    options:
    - text:
        ar: مشترك بين المسلمين والمسيحيين
        en: shared by Muslims and Christians
        ur: مسلمانوں اور مسیحیوں میں مشترک
      correct: true
      why:
        ar: يذكر المصادر احترام الفريقين لقبر يوحنا
        en: the sources record both faiths'' respect for John''s grave
        ur: ماخذ یحییٰ کی قبر کے لیے دونوں دینوں کا احترام لکھتے ہیں
    - text:
        ar: مدفون فيه الوليد
        en: al-Walid is buried in it
        ur: اس میں ولید دفن ہے
      correct: false
      why:
        ar: قبر يوحنا لا الوليد فيه
        en: it holds John''s grave, not al-Walid''s
        ur: اس میں یحییٰ کی قبر ہے، ولید کی نہیں
    - text:
        ar: لا يوجد قبر
        en: no grave exists
        ur: کوئی قبر نہیں
      correct: false
      why:
        ar: يذكر المصادر قبر يوحنا فيه
        en: the sources name John''s grave there
        ur: ماخذ وہاں یحییٰ کی قبر لکھتے ہیں
    - text:
        ar: قبر اكتشف حديثًا
        en: a recently discovered grave
        ur: حال ہی میں دریافت شدہ قبر
      correct: false
      why:
        ar: القبر قديم معروف
        en: the grave is old and known
        ur: قبر پرانی اور معروف ہے
- id: ibn-battuta
  anchor: person/ibn-battuta-muhammad
  band: researchers
  title:
    ar: ابن بطّوطة
    en: Ibn Battuta
    ur: ابن بطوطہ
  sixty:
    ar: ولد ابن بطّوطة في طنجة عام ١٣٠٤، وخرج للحج وهو شاب فلم يعد إلى بلاده ثلاثين عامًا. سافر نحو ١٢٠ ألف كيلومتر عبر إفريقيا وآسيا والهند وما وراءها، وعمل قاضيًا
      ومبعوثًا وضيفًا لدى السلاطين. وعندما عاد أخيرًا إلى المغرب أملى ذكريات رحلته، فصارت «الرحلة» أشهر كتاب سفر في الحضارة الإسلامية.
    en: Ibn Battuta was born in Tangier in 1304 and left for the Hajj as a young man, not returning home for thirty years. He travelled some 120,000 kilometres across
      Africa, Asia, India and beyond, working as a judge, envoy and guest of sultans. When he finally returned to Morocco he dictated the memories of his journey,
      and the Rihla became the most famous travel book in Islamic civilisation.
    ur: ابن بطوطہ 1304 میں طنجہ میں پیدا ہوا اور جوان ہونے پر حج کے لیے نکل پڑا اور تیس سال تک وطن نہیں لوٹا۔ اس نے افریقہ، ایشیا اور ہندوستان کے پار تقریباً 120,000
      کلومیٹر کا سفر کیا اور قاضی، ایلچی اور سلاطین کا مہمان رہا۔ جب وہ بالآخر مراکش لوٹا تو اپنے سفر کی یادیں امل میں کروائیں اور «رحلہ» اسلامی تہذیب کی مشہور ترین
      سفر نامہ بن گئی۔
  glossary:
  - term:
      ar: طنجة
      en: Tangier
      ur: طنجہ
    gloss:
      ar: مدينة المغرب على مضيق جبل طارق
      en: Moroccan city on the Strait of Gibraltar
      ur: جبل الطارق کی آبنائے پر مراکش کا شہر
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: رحلة الحج إلى مكة التي بدأ بها سفره
      en: the pilgrimage to Mecca that began his journey
      ur: مکہ کا حج سفر جس سے اس کا سفر شروع ہوا
  - term:
      ar: الرحلة
      en: the Rihla
      ur: رحلہ
    gloss:
      ar: كتاب رحلته الذي أملاه بعد عودته
      en: the travel book he dictated on his return
      ur: سفر نامہ جسے وہ واپسی پر امل میں لکھوایا
  - term:
      ar: قاضي
      en: qadi
      ur: قاضی
    gloss:
      ar: حاكم قضائي شرعي عمل به في الهند وجزر المالديف
      en: Islamic judge; he served as one in India and the Maldives
      ur: شرعی جج؛ وہ ہندوستان اور مالدیپ میں قاضی رہا
  - term:
      ar: مبعوث
      en: envoy
      ur: ایلچی
    gloss:
      ar: رسول يحمله سلطان إلى دولة أخرى
      en: a messenger carrying a sultan's letters to another court
      ur: سلطان کا قاصد جو دوسری دربار میں خطوط لے جاتا ہے
  - term:
      ar: المالديف
      en: the Maldives
      ur: مالدیپ
    gloss:
      ar: جزر المحيط الهندي حيث عمل قاضيًا
      en: Indian Ocean islands where he served as judge
      ur: جزیروں کا ملک جہاں وہ قاضی رہا
  - term:
      ar: سلطنة المغرب
      en: Morocco
      ur: مراکش
    gloss:
      ar: بلده التي خرج منها وعاد إليها
      en: his homeland, which he left and returned to
      ur: اس کا وطن جسے اس نے چھوڑا اور لوٹا
  - term:
      ar: المالي
      en: Mali
      ur: مالی
    gloss:
      ar: الإمبراطورية التي زارها في بلاد السودان
      en: the West African empire he visited
      ur: مغربی افریقہ کی سلطنت جہاں وہ گیا
  - term:
      ar: الصين
      en: China
      ur: چین
    gloss:
      ar: وصل إليها وكانت أبعد بلد في رحلته
      en: the farthest land he reached on his journey
      ur: وہ دور ترین ملک جہاں اس کا سفر پہنچا
  - term:
      ar: ابن جزي
      en: Ibn Juzayy
      ur: ابن جزی
    gloss:
      ar: الكاتب الذي دوّن الرحلة بإملاء ابن بطّوطة
      en: the scribe who wrote down the Rihla at Ibn Battuta's dictation
      ur: منشی جس نے ابن بطوطہ کی امل پر رحلہ لکھی
  - term:
      ar: سلطان
      en: sultan
      ur: سلطان
    gloss:
      ar: حاكم مسلم استقبله أو وظّفه في بلاده
      en: a Muslim ruler who received or employed him
      ur: مسلم حکمران جس نے اس کا استقبال کیا یا ملازمت دی
  - term:
      ar: المسافة
      en: distance
      ur: فاصلہ
    gloss:
      ar: نحو ١٢٠ ألف كيلومتر قطعها في سفره
      en: roughly 120,000 kilometres covered in his travels
      ur: تقریباً 120,000 کلومیٹر جو اس نے طے کیا
  practice:
  - q:
      ar: أين وُلد ابن بطّوطة؟
      en: Where was Ibn Battuta born?
      ur: ابن بطوطہ کہاں پیدا ہوا؟
    options:
    - text:
        ar: طنجة
        en: Tangier
        ur: طنجہ
      correct: true
      why:
        ar: وُلد في طنجة بالمغرب عام ١٣٠٤
        en: he was born in Tangier, Morocco, in 1304
        ur: وہ 1304 میں مراکش کے شہر طنجہ میں پیدا ہوا
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة من محطاته لا منشأه
        en: Cairo was a stop on his route, not his birthplace
        ur: قاہرہ اس کے سفر کا ایک ٹھہراؤ تھا، جائے پیدائش نہیں
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: false
      why:
        ar: إسطنبول ليست مدينته
        en: Istanbul was not his city
        ur: استنبول اس کا شہر نہیں تھا
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد زارها ولم يولد فيها
        en: Baghdad he visited but was not born in
        ur: بغداد میں وہ آیا مگر پیدا وہاں نہیں ہوا
  - q:
      ar: لماذا خرج من بلاده أول مرة؟
      en: Why did he first leave home?
      ur: وہ پہلی بار گھر سے کیوں نکلا؟
    options:
    - text:
        ar: للحج
        en: to perform the Hajj
        ur: حج کے لیے
      correct: true
      why:
        ar: خرج شابًا قاصدًا الحج فطالت رحلته
        en: he left as a young pilgrim and the journey grew
        ur: وہ حج کرنے کے لیے نکلا اور سفر طوالت اختیار کر گیا
    - text:
        ar: للتجارة
        en: to trade
        ur: تجارت کے لیے
      correct: false
      why:
        ar: لم يكن تاجرًا بل حاجًا أولاً
        en: he was no merchant but a pilgrim first
        ur: وہ پہلے تاجر نہیں بلکہ حاجی تھا
    - text:
        ar: للدراسة
        en: to study
        ur: تعلیم کے لیے
      correct: false
      why:
        ar: درس في بلاده ثم خرج للحج
        en: he studied at home then left for the Hajj
        ur: اس نے وطن میں پڑھا پھر حج کے لیے نکلا
    - text:
        ar: هربًا من طاعون
        en: fleeing a plague
        ur: طاعون سے بھاگتے ہوئے
      correct: false
      why:
        ar: لم يفرّ من شيء بل قصد الحج
        en: he fled nothing; he sought the Hajj
        ur: وہ کسی چیز سے نہیں بھاگا، حج چاہتا تھا
  - q:
      ar: كم استمر غائبًا عن بلاده؟
      en: How long was he away from home?
      ur: وہ گھر سے کتنے عرصے دور رہا؟
    options:
    - text:
        ar: نحو ثلاثين عامًا
        en: about thirty years
        ur: تقریباً تیس سال
      correct: true
      why:
        ar: عاد بعد نحو ثلاثة عقود من السفر
        en: he came back after some three decades away
        ur: وہ تقریباً تین دہائیوں بعد لوٹا
    - text:
        ar: خمسة أعوام
        en: five years
        ur: پانچ سال
      correct: false
      why:
        ar: خمسة أعوام أقل بكثير من مدة رحلته
        en: five years is far short of his journey
        ur: پانچ سال اس کے سفر سے بہت کم ہے
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام لا تكفي لرحلاته
        en: ten years is too few for his travels
        ur: دس سال اس کے سفروں کے لیے کافی نہیں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون عامًا أكثر من عمر رحلته
        en: fifty years exceeds his journey's span
        ur: پچاس سال اس کے سفر سے زیادہ ہے
  - q:
      ar: ما اسم كتاب سفره؟
      en: What is his travel book called?
      ur: اس کے سفر نامے کا نام کیا ہے؟
    options:
    - text:
        ar: «الرحلة»
        en: the Rihla
        ur: «رحلہ»
      correct: true
      why:
        ar: أملى ذكرياته فصارت «الرحلة»
        en: he dictated his memories into the Rihla
        ur: اس نے اپنی یادیں امل میں لکھوائیں اور رحلہ بنی
    - text:
        ar: «الإيضاح»
        en: the Idah
        ur: «ایضاح»
      correct: false
      why:
        ar: «الإيضاح» كتاب الجغرافيا لا رحلته
        en: the Idah is a geography work, not his book
        ur: ایضاح جغرافیہ کا کتاب ہے، اس کی رحلہ نہیں
    - text:
        ar: «المقدمة»
        en: the Muqaddimah
        ur: «مقدمہ»
      correct: false
      why:
        ar: المقدمة لابن خلدون لا لابن بطّوطة
        en: the Muqaddimah is Ibn Khaldun's, not Ibn Battuta's
        ur: مقدمہ ابن خلدون کی ہے، ابن بطوطہ کی نہیں
    - text:
        ar: «الرحلات» بلا قيد
        en: an unnamed notebook
        ur: بے نام نوٹ بک
      correct: false
      why:
        ar: اسم معروف لكتابه هو «الرحلة»
        en: his book is famously named the Rihla
        ur: اس کے سفر نامے کا مشہور نام رحلہ ہے
  - q:
      ar: ما مهنته التي عمل بها في الهند؟
      en: What job did he hold in India?
      ur: ہندوستان میں اس کا کیا کام تھا؟
    options:
    - text:
        ar: قاضي
        en: a judge (qadi)
        ur: قاضی
      correct: true
      why:
        ar: عمل قاضيًا لدى سلطان الهند
        en: he served the Indian sultan as a judge
        ur: وہ ہندوستان کے سلطان کے ہاں قاضی رہا
    - text:
        ar: طبيب
        en: a physician
        ur: طبیب
      correct: false
      why:
        ar: لم يكن طبيبًا بل فقيهًا قاضيًا
        en: he was a jurist, not a physician
        ur: وہ فقیہ تھا، طبیب نہیں
    - text:
        ar: تاجر
        en: a merchant
        ur: تاجر
      correct: false
      why:
        ar: لم يعش من التجارة بل من القضاء والضيافة
        en: he lived by judging and hospitality, not trade
        ur: وہ تجارت سے نہیں، قضا اور مہمانداری سے گزرا
    - text:
        ar: فارس
        en: a horseman
        ur: سوار
      correct: false
      why:
        ar: لم يكن جنديًا بل رجلاً علميًا
        en: he was a scholar, not a soldier
        ur: وہ عالم تھا، سپاہی نہیں
  - q:
      ar: من دوّن «الرحلة» بإملائه؟
      en: Who wrote down the Rihla at his dictation?
      ur: اس کی امل پر رحلہ کس نے لکھی؟
    options:
    - text:
        ar: ابن جزي
        en: Ibn Juzayy
        ur: ابن جزی
      correct: true
      why:
        ar: دوّن ابن جزي الرحلة بإملاء ابن بطّوطة
        en: Ibn Juzayy transcribed the Rihla as Ibn Battuta dictated
        ur: ابن جزی نے ابن بطوطہ کی امل پر رحلہ تحریر کی
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون مؤرخ آخر لم يدوّن الرحلة
        en: Ibn Khaldun was another historian, not the scribe
        ur: ابن خلدون دوسرا مؤرخ تھا، منشی نہیں
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا سابق عليه بقرون
        en: Ibn Sina lived centuries earlier
        ur: ابن سینا اس سے صدیاں پہلے تھا
    - text:
        ar: ابن بطّوطة نفسه يدويًا
        en: Ibn Battuta himself, by hand
        ur: خود ابن بطوطہ نے ہاتھ سے
      correct: false
      why:
        ar: أملاها على ابن جزي ولم يكتبها بيده
        en: he dictated to Ibn Juzayy; he did not write it by hand
        ur: اس نے ابن جزی کو امل میں لکھوائی، ہاتھ سے نہیں لکھی
  - q:
      ar: ما أبعد جهة بلغها تقريبًا؟
      en: Roughly the farthest land he reached?
      ur: وہ تقریباً کس دور ترین سرزمین تک پہنچا؟
    options:
    - text:
        ar: الصين
        en: China
        ur: چین
      correct: true
      why:
        ar: بلغ الصين وكانت أقصى مشارق رحلته
        en: he reached China, the farthest east of his journey
        ur: وہ چین تک پہنچا جو اس کے سفر کا دور مشرق تھا
    - text:
        ar: الأندلس فقط
        en: only al-Andalus
        ur: صرف الاندلس
      correct: false
      why:
        ar: الأندلس على الطريق لا النهاية
        en: al-Andalus lay on the route, not the end
        ur: الاندلس راستے میں تھا، منزل نہیں
    - text:
        ar: اليابان
        en: Japan
        ur: جاپان
      correct: false
      why:
        ar: لم يصل إلى اليابان
        en: he never reached Japan
        ur: وہ جاپان تک نہیں پہنچا
    - text:
        ar: أوروبا الغربية
        en: Western Europe
        ur: مغربی یورپ
      correct: false
      why:
        ar: لم يتجه غربًا إلى أوروبا بعيدًا
        en: he did not travel far into western Europe
        ur: وہ مغربی یورپ میں دور تک نہیں گیا
  - q:
      ar: ما الدولة التي زارها في غرب إفريقيا؟
      en: Which West African empire did he visit?
      ur: مغربی افریقہ میں اس نے کون سی سلطنت دیکھی؟
    options:
    - text:
        ar: مالي
        en: Mali
        ur: مالی
      correct: true
      why:
        ar: زار إمبراطورية مالي ووصف قصورها
        en: he visited the Mali empire and described its court
        ur: اس نے مالی سلطنت دیکھی اور اس کے دربار کی وضاحت کی
    - text:
        ar: الأندلس
        en: al-Andalus
        ur: الاندلس
      correct: false
      why:
        ar: الأندلس في أيبيريا لا غرب إفريقيا
        en: al-Andalus is in Iberia, not West Africa
        ur: الاندلس ایبریا میں ہے، مغربی افریقہ میں نہیں
    - text:
        ar: مصر
        en: Egypt
        ur: مصر
      correct: false
      why:
        ar: مصر شرق إفريقيا لا غربها
        en: Egypt is in Africa's northeast, not west
        ur: مصر شمال مشرقی افریقہ میں ہے، مغرب میں نہیں
    - text:
        ar: فارس
        en: Persia
        ur: فارس
      correct: false
      why:
        ar: فارس في آسيا لا إفريقيا
        en: Persia is in Asia, not Africa
        ur: فارس ایشیا میں ہے، افریقہ میں نہیں
  - q:
      ar: كيف عاش خلال رحلته غالبًا؟
      en: How did he mostly live on the road?
      ur: سفر میں اس کی گزر بسر کیسے ہوتی تھی؟
    options:
    - text:
        ar: بالقضاء وضيافة السلاطين
        en: as a judge and a sultans' guest
        ur: قاضی اور سلاطین کے مہمان کے طور پر
      correct: true
      why:
        ar: عمل قاضيًا ومبعوثًا وضيفًا لدى الحكام
        en: he worked as judge, envoy and guest of rulers
        ur: وہ قاضی، ایلچی اور حکمرانوں کا مہمان رہا
    - text:
        ar: بالتجارة البحرية
        en: by sea trade
        ur: سمندری تجارت سے
      correct: false
      why:
        ar: لم يكن تاجرًا أساسًا
        en: trade was never his living
        ur: تجارت اس کی روزی نہیں تھی
    - text:
        ar: بالسخرة
        en: by forced labour
        ur: جبری محنت سے
      correct: false
      why:
        ar: عاش مكرّمًا لا مسخّرًا
        en: he lived honoured, not enslaved
        ur: وہ عزت سے رہا، غلام نہیں
    - text:
        ar: بالصيد
        en: by hunting
        ur: شکار سے
      correct: false
      why:
        ar: لم يكن صيادًا
        en: he was no hunter
        ur: وہ شکاری نہیں تھا
  - q:
      ar: ماذا حدث عندما عاد إلى المغرب؟
      en: What happened when he returned to Morocco?
      ur: مراکش واپسی پر کیا ہوا؟
    options:
    - text:
        ar: أملى رحلته على كاتب
        en: he dictated his journey to a scribe
        ur: اس نے منشی کو سفر نامہ امل میں لکھوایا
      correct: true
      why:
        ar: أملى الذكريات على ابن جزي فدوّنها
        en: he dictated his memories to Ibn Juzayy, who wrote them
        ur: اس نے ابن جزی کو یادیں امل میں دیں جنہوں نے لکھیں
    - text:
        ar: خرج مرة أخرى للحج
        en: he left for the Hajj again
        ur: وہ دوبارہ حج کو نکل گیا
      correct: false
      why:
        ar: استقر بعد عودته وأملى رحلته
        en: he settled after returning and dictated
        ur: وہ واپسی کے بعد ٹھہرا اور امل کرائی
    - text:
        ar: صار سلطانًا
        en: he became sultan
        ur: وہ سلطان بن گیا
      correct: false
      why:
        ar: لم يحكم بل أملى كتابه
        en: he ruled nothing; he dictated his book
        ur: اس نے حکومت نہیں کی، کتاب امل میں لکھوائی
    - text:
        ar: نسي رحلته
        en: he forgot his journey
        ur: وہ اپنا سفر بھول گیا
      correct: false
      why:
        ar: لم ينسَ بل أملى ذكرياتها
        en: he forgot nothing — he dictated them
        ur: وہ نہیں بھولا، یادیں امل میں لکھوائیں
- id: great-mosque-cordoba
  anchor: building/great-mosque-cordoba
  band: researchers
  title:
    ar: جامع قرطبة الكبير
    en: The Great Mosque of Cordoba
    ur: قرطبہ کی جامع مسجد
  sixty:
    ar: بدأ الأمويون في قرطبة بناء جامعهم عام ٧٨٥، وظلت الأجيال توسّعه قرنين. صار المسجد غابة أعمدة تحمل أقواسًا مزدوجة حمراء وبيضاء، وفي محرابه فسيفساء بيزنطية نادرة.
      وبقي — حتى بعد أن صار كاتدرائية — أعظم عمارة تركها الإسلام في الأندلس.
    en: The Umayyads began their great mosque in Cordoba in 785, and generations kept enlarging it for two centuries. It became a forest of columns carrying red-and-white
      double arches, with rare Byzantine mosaics in its mihrab. Even after it became a cathedral it remained the greatest building Islam left in al-Andalus.
    ur: امویوں نے 785 میں قرطبہ میں اپنی جامع مسجد کی بنیاد رکھی اور دو صدیوں تک نسلیں اسے وسیع کرتی رہیں۔ یہ سرخ اور سفید دوہری محرابوں پر ٹکے ستونوں کا جنگل بن
      گئی اور محراب میں نایاب بازنطینی فسفسائی تھی۔ کیتھیڈرل بننے کے بعد بھی یہ الاندلس میں اسلام کی سب سے عظیم عمارت رہی۔
  glossary:
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطبہ
    gloss:
      ar: عاصمة الأندلس الأموية
      en: the Umayyad capital of al-Andalus
      ur: الاندلس کا اموی پایہ تخت
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: السلالة التي حكمت الأندلس وبنت الجامع
      en: the dynasty that ruled al-Andalus and built the mosque
      ur: وہ خاندان جس نے الاندلس پر حکومت کی اور مسجد بنائی
  - term:
      ar: الأقواس المزدوجة
      en: double arches
      ur: دوہری محرابیں
    gloss:
      ar: قوس فوق قوس يرفع السقف على أعمدة قصيرة
      en: arch over arch raising the roof on short columns
      ur: چھوٹے ستونوں پر چھت اٹھانے کے لیے محراب پر محراب
  - term:
      ar: المحراب
      en: the mihrab
      ur: محراب
    gloss:
      ar: حجرة القبلة المزخرفة بالفسيفساء
      en: the ornate qibla chamber with mosaics
      ur: قبلہ کی خوبصورت محراب جس میں فسفسائی ہے
  - term:
      ar: الفسيفساء
      en: mosaics
      ur: فسفسائی
    gloss:
      ar: قطع زجاج ملونة صنعها فنانون بيزنطيون
      en: coloured glass pieces made by Byzantine artists
      ur: بازنطینی فنکاروں کے بنائے رنگین شیشے کے ٹکڑے
  - term:
      ar: عبد الرحمن الأول
      en: Abd al-Rahman I
      ur: عبدالرحمٰن اول
    gloss:
      ar: أمير بدأ بناء الجامع عام ٧٨٥
      en: the emir who began the mosque in 785
      ur: وہ امیر جس نے 785 میں مسجد شروع کی
  - term:
      ar: غابة الأعمدة
      en: the forest of columns
      ur: ستونوں کا جنگل
    gloss:
      ar: مئات الأعمدة التي تملأ قاعة الصلاة
      en: the hundreds of columns filling the prayer hall
      ur: نمازی ہال کو بھرنے والے سیکڑوں ستون
  - term:
      ar: المقصورة
      en: the maqsura
      ur: مقصورہ
    gloss:
      ar: جزء مخصوص من المسجد للخليفة
      en: a screened part of the mosque for the caliph
      ur: خلیفہ کے لیے مسجد کا گھرا ہوا حصہ
  - term:
      ar: الحجر والطوب
      en: stone and brick
      ur: پتھر اور اینٹ
    gloss:
      ar: الحجارتان الحمراء والبيضاء في الأقواس
      en: the red and white voussoirs of the arches
      ur: محرابوں کی سرخ اور سفید پتھر کی قطعیں
  - term:
      ar: المنارة
      en: the minaret
      ur: مینار
    gloss:
      ar: برج المؤذن الذي بقي في الكاتدرائية
      en: the muezzin's tower surviving inside the cathedral
      ur: موذن کا مینار جو کیتھیڈرل میں باقی ہے
  - term:
      ar: التوسيعات
      en: the enlargements
      ur: وسیع کرنا
    gloss:
      ar: أجيال أضافت قاعات جديدة للمسجد
      en: generations adding new halls to the mosque
      ur: نسلیں جو مسجد میں نئے ہال جوڑتی گئیں
  - term:
      ar: الكاتدرائية
      en: the cathedral
      ur: کیتھیڈرل
    gloss:
      ar: الكنيسة التي أقيمت داخل الجامع لاحقًا
      en: the church later built inside the mosque
      ur: وہ گرجا جو بعد میں مسجد کے اندر بنایا گیا
  practice:
  - q:
      ar: في أيّ مدينة يقع الجامع؟
      en: In which city is the mosque?
      ur: مسجد کس شہر میں ہے؟
    options:
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: true
      why:
        ar: في قرطبة عاصمة الأندلس
        en: in Cordoba, the capital of al-Andalus
        ur: الاندلس کے پایہ تخت قرطبہ میں
    - text:
        ar: إشبيلية
        en: Seville
        ur: اشبیلیہ
      correct: false
      why:
        ar: إشبيلية مدينة أخرى لا موضعه
        en: Seville is another city, not its site
        ur: اشبیلیہ دوسرا شہر ہے، اس کی جگہ نہیں
    - text:
        ar: غرناطة
        en: Granada
        ur: غرناطہ
      correct: false
      why:
        ar: غرناطة مدينة قصر الحمراء لا هذا الجامع
        en: Granada is the Alhambra's city, not this mosque's
        ur: غرناطہ قصر الحمراء کا شہر ہے، اس مسجد کا نہیں
    - text:
        ar: طليطلة
        en: Toledo
        ur: طليطلہ
      correct: false
      why:
        ar: طليطلة شمال قرطبة
        en: Toledo lies north of Cordoba
        ur: طليطلہ قرطبہ کے شمال میں ہے
  - q:
      ar: من بدأ بناءه ومتى؟
      en: Who began it, and when?
      ur: اسے کس نے اور کب شروع کیا؟
    options:
    - text:
        ar: عبد الرحمن الأول عام ٧٨٥
        en: Abd al-Rahman I in 785
        ur: عبدالرحمٰن اول نے 785 میں
      correct: true
      why:
        ar: أمير الأندلس الأموي بدأه عام ٧٨٥
        en: the Umayyad emir of al-Andalus began it in 785
        ur: الاندلس کے اموی امیر نے 785 میں شروع کیا
    - text:
        ar: عبد الناصر عام ١٠٠٠
        en: Abd al-Nasir in 1000
        ur: عبدالناصر نے 1000 میں
      correct: false
      why:
        ar: لم يبدأه بل وسّعه لاحقًا
        en: he enlarged it later, did not begin it
        ur: اس نے بعد میں وسعت دی، شروع نہیں کیا
    - text:
        ar: الحكم الثاني عام ٩٦٠
        en: al-Hakam II in 960
        ur: الحکم دوم نے 960 میں
      correct: false
      why:
        ar: الحكم الثاني وسّعه لا بناه
        en: al-Hakam II enlarged it, not built it
        ur: الحکم دوم نے وسعت دی، تعمیر نہیں کی
    - text:
        ar: محمد الناصر عام ١١٩٥
        en: al-Nasir in 1195
        ur: الناصر نے 1195 میں
      correct: false
      why:
        ar: لم يكن بانيًا له
        en: he was not its builder
        ur: وہ اس کا معمار نہیں تھا
  - q:
      ar: ما أشهر سمته المعمارية؟
      en: Its most famous architectural feature?
      ur: اس کی سب سے مشہور تعمیری خصوصیت؟
    options:
    - text:
        ar: أقواس مزدوجة حمراء وبيضاء
        en: red-and-white double arches
        ur: سرخ و سفید دوہری محرابیں
      correct: true
      why:
        ar: أقواس متداخلة على غابة أعمدة
        en: interlocking arches over a forest of columns
        ur: ستونوں کے جنگل پر اندرونی محرابیں
    - text:
        ar: قبة خضراء ضخمة
        en: a huge green dome
        ur: بڑا سبز گنبد
      correct: false
      why:
        ar: لا قبة خضراء مشهورة فيه
        en: no famous green dome is in it
        ur: اس میں مشہور سبز گنبد نہیں
    - text:
        ar: أبراج مائلة
        en: leaning towers
        ur: جھکے ہوئے مینار
      correct: false
      why:
        ar: لا مائلة فيه بل أعمدة مستقيمة
        en: no leaning towers, straight columns
        ur: جھکے مینار نہیں، سیدھے ستون
    - text:
        ar: نوافذ زجاجية ملونة كبيرة
        en: large stained-glass windows
        ur: بڑی رنگین کھڑکیاں
      correct: false
      why:
        ar: الزخرفة فسيفساء لا زجاج
        en: its ornament is mosaic, not stained glass
        ur: اس کی زینت فسفسائی ہے، رنگین شیشہ نہیں
  - q:
      ar: ماذا حفظ محرابه؟
      en: What does its mihrab preserve?
      ur: اس کا محراب کیا محفوظ رکھتا ہے؟
    options:
    - text:
        ar: فسيفساء بيزنطية
        en: Byzantine mosaics
        ur: بازنطینی فسفسائی
      correct: true
      why:
        ar: في المحراب فسيفساء صنعها فنانون بيزنطيون
        en: Byzantine artists made the mihrab mosaics
        ur: محراب کی فسفسائی بازنطینی فنکاروں نے بنائی
    - text:
        ar: لوحات زيتية
        en: oil paintings
        ur: تیل کی پینٹنگ
      correct: false
      why:
        ar: لا لوحات زيتية في محرابه
        en: no oil paintings are in the mihrab
        ur: محراب میں تیل کی پینٹنگ نہیں
    - text:
        ar: تماثيل رخامية
        en: marble statues
        ur: سنگ مرمر کے مجسمے
      correct: false
      why:
        ar: لا تماثيل في المحراب الإسلامي
        en: no statues in an Islamic mihrab
        ur: اسلامی محراب میں مجسمے نہیں
    - text:
        ar: كتابة ضخمة فقط
        en: only huge writing
        ur: صرف بڑی خطاطی
      correct: false
      why:
        ar: الكتابة فيه لكنها فسيفساء مشهورة
        en: writing is there but the fame is the mosaic
        ur: خطاطی موجود مگر شہرت فسفسائی کی ہے
  - q:
      ar: لماذا سُمّي «غابة أعمدة»؟
      en: Why called a 'forest of columns'?
      ur: اسے ستونوں کا جنگل کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لمئات الأعمدة القصيرة
        en: for hundreds of short columns
        ur: سیکڑوں چھوٹے ستونوں کے لیے
      correct: true
      why:
        ar: مئات الأعمدة تملأ قاعة الصلاة
        en: hundreds of columns fill the prayer hall
        ur: نمازی ہال میں سیکڑوں ستون بھرے ہیں
    - text:
        ar: لأشجار داخله
        en: for trees inside it
        ur: اس کے اندر درختوں کے لیے
      correct: false
      why:
        ar: لا أشجار بل أعمدة فيه
        en: columns, not trees, fill it
        ur: اس میں درخت نہیں، ستون ہیں
    - text:
        ar: لجذوع من خشب
        en: for wooden trunks
        ur: لکڑی کے تنوں کے لیے
      correct: false
      why:
        ar: أعمدته من حجر ورخام لا خشب
        en: its columns are stone and marble, not wood
        ur: اس کے ستون پتھر اور سنگ مرمر کے ہیں، لکڑی کے نہیں
    - text:
        ar: لأعمدة ذهبية
        en: for golden columns
        ur: سنہری ستونوں کے لیے
      correct: false
      why:
        ar: لا ذهب في أعمدته بل حجر
        en: its columns are stone, not gold
        ur: اس کے ستون سونے کے نہیں، پتھر کے ہیں
  - q:
      ar: كم جيلاً وسّعه؟
      en: How many generations enlarged it?
      ur: کتنی نسلوں نے اسے وسیع کیا؟
    options:
    - text:
        ar: نحو قرنين
        en: about two centuries
        ur: تقریباً دو صدیاں
      correct: true
      why:
        ar: ظلّت الأجيال توسّعه قرنين
        en: generations kept enlarging it for two centuries
        ur: نسلیں دو صدیوں تک اسے وسیع کرتی رہیں
    - text:
        ar: جيل واحد
        en: one generation
        ur: ایک نسل
      correct: false
      why:
        ar: لم يكتف بجيل واحد
        en: one generation did not suffice
        ur: ایک نسل نے تکمیل نہیں کی
    - text:
        ar: ثلاثة قرون
        en: three centuries
        ur: تین صدیاں
      correct: false
      why:
        ar: قرنان أدقّ من ثلاثة
        en: two centuries is more accurate than three
        ur: دو صدیاں تین سے درست ہیں
    - text:
        ar: عقد واحد
        en: one decade
        ur: ایک دہائی
      correct: false
      why:
        ar: عقد قليل جدًا لبنائه
        en: a decade is far too short for it
        ur: ایک دہائی اس کے لیے بہت کم ہے
  - q:
      ar: بماذا تحوّل لاحقًا؟
      en: What did it later become?
      ur: بعد میں یہ کیا بن گیا؟
    options:
    - text:
        ar: كاتدرائية
        en: a cathedral
        ur: کیتھیڈرل
      correct: true
      why:
        ar: أقيمت فيه كاتدرائية بعد استرداد المدينة
        en: a cathedral was set inside it after the city was taken
        ur: شہر کی واپسی کے بعد اس میں کیتھیڈرل بنائی گئی
    - text:
        ar: قلعة
        en: a fortress
        ur: قلعہ
      correct: false
      why:
        ar: لم يصبح قلعة بل كنيسة
        en: it became a church, not a fortress
        ur: یہ قلعہ نہیں، گرجا بنا
    - text:
        ar: قصر ملكي
        en: a royal palace
        ur: شاہی محل
      correct: false
      why:
        ar: لم يصبح قصرًا
        en: it never became a palace
        ur: یہ محل نہیں بنا
    - text:
        ar: متحف حربي
        en: a war museum
        ur: جنگی عجائب گھر
      correct: false
      why:
        ar: لم يكن متحفًا بل مكان عبادة
        en: it stayed a place of worship, not a museum
        ur: یہ عبادت گاہ رہی، عجائب گھر نہیں
  - q:
      ar: ما لونا حجارتيه؟
      en: What two colours are its voussoirs?
      ur: اس کے محرابی پتھر کس دو رنگوں میں ہیں؟
    options:
    - text:
        ar: الأحمر والأبيض
        en: red and white
        ur: سرخ اور سفید
      correct: true
      why:
        ar: حجارته حمراء وبيضاء متناوبة
        en: its voussoirs alternate red and white
        ur: اس کے پتھر سرخ اور سفید متبادل ہیں
    - text:
        ar: الأزرق والأخضر
        en: blue and green
        ur: نیلا اور سبز
      correct: false
      why:
        ar: ليس أزرق وأخضر في أقواسه
        en: its arches are not blue and green
        ur: اس کی محرابیں نیلی سبز نہیں
    - text:
        ar: الأسود والذهبي
        en: black and gold
        ur: کالا اور سنہری
      correct: false
      why:
        ar: ليس أسود وذهبيًا فيه
        en: not black and gold
        ur: کالا اور سنہری نہیں
    - text:
        ar: الرمادي والبني
        en: grey and brown
        ur: سرمئی اور بھورا
      correct: false
      why:
        ar: ليس رماديًا وبنيًا
        en: not grey and brown
        ur: سرمئی اور بھورا نہیں
  - q:
      ar: ما الدور الذي بقي لمئذنته؟
      en: What survived of its minaret?
      ur: اس کے مینار سے کیا بچا؟
    options:
    - text:
        ar: برجها داخل الكاتدرائية
        en: its tower inside the cathedral
        ur: کیتھیڈرل کے اندر مینار
      correct: true
      why:
        ar: بقيت المنارة برجًا داخل الكنيسة
        en: the minaret remained a tower inside the church
        ur: مینار گرجا کے اندر مینار بنا رہا
    - text:
        ar: هدمت كليًا
        en: it was fully razed
        ur: مکمل مسمار ہو گیا
      correct: false
      why:
        ar: لم تهدم كليًا بل بقيت برجًا
        en: it was not razed; it survives as a tower
        ur: یہ مسمار نہیں ہوئی، مینار باقی ہے
    - text:
        ar: انقلبت قبةً
        en: it was turned into a dome
        ur: گنبد بنا دیا گیا
      correct: false
      why:
        ar: لم تنقلب قبة بل بقي برجًا
        en: it was not turned into a dome; it stayed a tower
        ur: یہ گنبد نہیں بنا، مینار رہا
    - text:
        ar: غرقت في نهر
        en: it sank into a river
        ur: دریا میں ڈوب گیا
      correct: false
      why:
        ar: لم تغرق بل بقيت قائمة
        en: it did not sink; it still stands
        ur: یہ ڈوبی نہیں، کھڑی ہے
  - q:
      ar: لماذا يُعدّ أعظم عمارة أندلسية؟
      en: Why is it al-Andalus's greatest building?
      ur: یہ الاندلس کی سب سے عظیم عمارت کیوں ہے؟
    options:
    - text:
        ar: لجماله وحجمه ونفوذه
        en: for its beauty, scale and influence
        ur: اس کی خوبصورتی، وسعت اور اثر کے لیے
      correct: true
      why:
        ar: جمع الحجم والفن وأثرًا عظيمًا في العمارة
        en: it joined scale, art and vast influence on building
        ur: اس نے وسعت، فن اور تعمیرات پر وسیع اثر جمع کیا
    - text:
        ar: لأنه أطول مبنى
        en: because it is tallest
        ur: کیونکہ یہ بلند ترین ہے
      correct: false
      why:
        ar: لم يشتهر بعلوّه بل بجماله
        en: it is famed for beauty, not height
        ur: یہ اونچائی سے نہیں، خوبصورتی سے مشہور ہے
    - text:
        ar: لأنه أقدم مسجد
        en: because it is the oldest mosque
        ur: کیونکہ یہ قدیم ترین مسجد ہے
      correct: false
      why:
        ar: ليس أقدم مسجد لكنه أعظمهن شهرة
        en: not the oldest mosque but the most famous
        ur: قدیم ترین نہیں مگر مشہور ترین مسجد ہے
    - text:
        ar: لأنه من ذهب
        en: because it is of gold
        ur: کیونکہ یہ سونے کا ہے
      correct: false
      why:
        ar: ليس من ذهب بل من حجر
        en: it is stone, not gold
        ur: یہ سونے کا نہیں، پتھر کا ہے
- id: alhambra
  anchor: building/alhambra
  band: researchers
  title:
    ar: قصر الحمراء
    en: The Alhambra
    ur: قصر الحمراء
  sixty:
    ar: شيّد سلاطين بنو نصر قصرهم على رابية فوق غرناطة في القرن الرابع عشر. جمع القصر حجرًا هشًا وخشبًا منحوتًا وبلاطًا ملونًا وخطّاطات جدارية، وفي صحنه ساحرة الأسود
      يقطر ماؤها. وبقي بعد سقوط غرناطة أجمل قصر إسلامي باقٍ في الغرب.
    en: The Nasrid sultans built their palace on a hill above Granada in the fourteenth century. It joined delicate plaster, carved wood, coloured tile and walls
      of calligraphy, and in its Court of the Lions the fountain water murmurs. It survived Granada's fall as the finest Islamic palace left in the West.
    ur: نصری سلاطین نے چودہویں صدی میں غرناطہ کے اوپر پہاڑی پر اپنا محل بنایا۔ اس میں نازک پلاسٹر، تراشیدہ لکڑی، رنگین ٹائل اور دیواروں کی خطاطی جمع تھی اور شیروں
      کے صحن میں چشمے کا پانی کھلکھلاتا ہے۔ غرناطہ کے سقوط کے بعد یہ مغرب میں بچا ہوا خوبصورت ترین اسلامی محل بنا۔
  glossary:
  - term:
      ar: الحمراء
      en: the Alhambra (the Red)
      ur: الحمراء (سرخ)
    gloss:
      ar: «القلعة الحمراء» بلون جدرانها
      en: '''the Red Fort'' after its walls'' colour'
      ur: «سرخ قلعہ» اپنی دیواروں کے رنگ کے سبب
  - term:
      ar: غرناطة
      en: Granada
      ur: غرناطہ
    gloss:
      ar: المدينة التي فوقها القصر
      en: the city beneath the palace
      ur: وہ شہر جس کے اوپر محل ہے
  - term:
      ar: بنو نصر
      en: the Nasrids
      ur: بنو نصر
    gloss:
      ar: آخر سلالة مسلمة حكمت الأندلس
      en: the last Muslim dynasty to rule al-Andalus
      ur: الاندلس پر حکومت کرنے والا آخری مسلم خاندان
  - term:
      ar: صحن الأسود
      en: the Court of the Lions
      ur: شیروں کا صحن
    gloss:
      ar: ساحة القصر بنافورة على أسود رخامية
      en: the palace court with a fountain on marble lions
      ur: مرکزی صحن جس کا چشمہ سنگ مرمر کے شیروں پر ہے
  - term:
      ar: الجص المزخرف
      en: carved plaster
      ur: تراشیدہ پلاسٹر
    gloss:
      ar: زخرفة دقيقة تغطي جدران القصر
      en: fine ornament covering the palace walls
      ur: محل کی دیواروں کو ڈھانپنے والی باریک نقش
  - term:
      ar: البلاط المزجج
      en: glazed tile
      ur: چمکیلی ٹائل
    gloss:
      ar: قطع ملونة تكسو أسفل الجدران
      en: coloured pieces cladding the lower walls
      ur: دیواروں کے نچلے حصے پر لگی رنگین ٹائلیں
  - term:
      ar: الخط الكوفي والنسخي
      en: Kufic and cursive calligraphy
      ur: کوفی اور نسخی خطاطی
    gloss:
      ar: كتابات جدارية من آيات وأدعية
      en: wall inscriptions of verses and prayers
      ur: آیتوں اور دعاؤں کی دیواری خطاطی
  - term:
      ar: المقرنصات
      en: muqarnas (stalactite vaults)
      ur: مقرنصات
    gloss:
      ar: زخرفة معلقة كالخلية في القباب
      en: honeycomb ornament hanging in the domes
      ur: گنبدوں میں چھتے جیسی لٹکتی زینت
  - term:
      ar: قصر العمارات
      en: the Nasrid palaces
      ur: نصری محلات
    gloss:
      ar: جناحان ملكيان داخل القلعة
      en: the two royal wings inside the fort
      ur: قلعے کے اندر دو شاہی حصے
  - term:
      ar: الجنة
      en: the Generalife gardens
      ur: جنرلیف باغات
    gloss:
      ar: بستان الصيف فوق القصر
      en: the summer garden above the palace
      ur: محل کے اوپر گرمیوں کا باغ
  - term:
      ar: سقوط غرناطة
      en: the fall of Granada
      ur: غرناطہ کا سقوط
    gloss:
      ar: ١٤٩٢ نهاية الحكم الإسلامي في الأندلس
      en: 1492, the end of Muslim rule in al-Andalus
      ur: 1492ء، الاندلس میں مسلم حکومت کا خاتمہ
  - term:
      ar: النافورة
      en: the fountain
      ur: چشمہ
    gloss:
      ar: ماء جارٍ في صحن الأسود
      en: running water in the Court of the Lions
      ur: شیروں کے صحن میں بہتا پانی
  practice:
  - q:
      ar: أين يقع قصر الحمراء؟
      en: Where is the Alhambra?
      ur: قصر الحمراء کہاں ہے؟
    options:
    - text:
        ar: فوق غرناطة
        en: above Granada
        ur: غرناطہ کے اوپر
      correct: true
      why:
        ar: على رابية تطل على غرناطة
        en: on a hill overlooking Granada
        ur: غرناطہ پر نگاہ رکھنے والی پہاڑی پر
    - text:
        ar: في قرطبة
        en: in Cordoba
        ur: قرطبہ میں
      correct: false
      why:
        ar: قرطبة مدينة الجامع لا الحمراء
        en: Cordoba holds the mosque, not the Alhambra
        ur: قرطبہ میں جامع مسجد ہے، الحمراء نہیں
    - text:
        ar: في إشبيلية
        en: in Seville
        ur: اشبیلیہ میں
      correct: false
      why:
        ar: إشبيلية مدينة قصر آخر
        en: Seville has another palace
        ur: اشبیلیہ میں دوسرا محل ہے
    - text:
        ar: في طليطلة
        en: in Toledo
        ur: طليطلہ میں
      correct: false
      why:
        ar: طليطلة لا تضم الحمراء
        en: Toledo does not hold the Alhambra
        ur: طليطلہ میں الحمراء نہیں
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنایا؟
    options:
    - text:
        ar: بنو نصر
        en: the Nasrid dynasty
        ur: بنو نصر
      correct: true
      why:
        ar: سلاطين بنو نصر في القرن الرابع عشر
        en: the Nasrid sultans of the fourteenth century
        ur: چودہویں صدی کے نصری سلاطین
    - text:
        ar: الأمويون
        en: the Umayyads
        ur: اموی
      correct: false
      why:
        ar: الأمويون قبلهم بقرون
        en: the Umayyads came centuries earlier
        ur: اموی ان سے صدیاں پہلے تھے
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون في المشرق لا الأندلس
        en: the Abbasids ruled the East, not al-Andalus
        ur: عباسی مشرق میں تھے، الاندلس میں نہیں
    - text:
        ar: الفاطميون
        en: the Fatimids
        ur: فاطمی
      correct: false
      why:
        ar: الفاطميون في مصر لا الأندلس
        en: the Fatimids ruled Egypt, not al-Andalus
        ur: فاطمی مصر میں تھے، الاندلس میں نہیں
  - q:
      ar: ما «صحن الأسود»؟
      en: What is the Court of the Lions?
      ur: شیروں کا صحن کیا ہے؟
    options:
    - text:
        ar: ساحة بنافورة على أسود
        en: a court with a lion-borne fountain
        ur: شیروں پر اٹھے چشمے والا صحن
      correct: true
      why:
        ar: نافورة تحملها أسود رخامية
        en: a fountain borne by marble lions
        ur: سنگ مرمر کے شیروں پر اٹھا چشمہ
    - text:
        ar: قفص أسود حية
        en: a cage of live lions
        ur: زندہ شیروں کا پنجرہ
      correct: false
      why:
        ar: لا أسود حية بل رخامية
        en: not live lions but marble ones
        ur: زندہ شیر نہیں، سنگ مرمر کے
    - text:
        ar: قاعة عرش
        en: a throne room
        ur: تخت کا کمرہ
      correct: false
      why:
        ar: الصحن ساحة لا قاعة عرش
        en: the court is a courtyard, not a throne hall
        ur: صحن ایک آنگن ہے، تخت کمرہ نہیں
    - text:
        ar: حديقة حيوان
        en: a menagerie
        ur: چڑیا گھر
      correct: false
      why:
        ar: ليست حديقة حيوان بل ساحة
        en: not a menagerie but a courtyard
        ur: چڑیا گھر نہیں، آنگن ہے
  - q:
      ar: ما المادة التي تكسو جدرانه؟
      en: What covers its walls?
      ur: اس کی دیواریں کس چیز سے ڈھکی ہیں؟
    options:
    - text:
        ar: جص منحوت وبلاط
        en: carved plaster and tile
        ur: تراشیدہ پلاسٹر اور ٹائل
      correct: true
      why:
        ar: جص وبلاط وخشب وكتابات
        en: plaster, tile, wood and inscriptions
        ur: پلاسٹر، ٹائل، لکڑی اور خطاطی
    - text:
        ar: الذهب الخالص
        en: pure gold
        ur: خالص سونا
      correct: false
      why:
        ar: لا ذهب في جدرانه
        en: no gold is on its walls
        ur: اس کی دیواروں پر سونا نہیں
    - text:
        ar: الرخام فقط
        en: marble only
        ur: صرف سنگ مرمر
      correct: false
      why:
        ar: ليس رخامًا فقط بل جص وبلاط
        en: not marble alone but plaster and tile
        ur: صرف سنگ مرمر نہیں، پلاسٹر اور ٹائل
    - text:
        ar: الفولاذ
        en: steel
        ur: فولاد
      correct: false
      why:
        ar: لا فولاذ في بنائه
        en: no steel in its fabric
        ur: اس کی تعمیر میں فولاد نہیں
  - q:
      ar: ما «المقرنصات»؟
      en: What are muqarnas?
      ur: مقرنصات کیا ہیں؟
    options:
    - text:
        ar: زخرفة كالخلية في القباب
        en: honeycomb vault ornament
        ur: گنبدوں میں چھتے نما زینت
      correct: true
      why:
        ar: زخرفة معلقة متدرجة في القباب
        en: tiered hanging ornament in the domes
        ur: گنبدوں میں لٹکتی تہ دار زینت
    - text:
        ar: أعمدة حجرية
        en: stone columns
        ur: پتھر کے ستون
      correct: false
      why:
        ar: ليست أعمدة بل زخرفة سقف
        en: not columns but ceiling ornament
        ur: ستون نہیں، چھت کی زینت
    - text:
        ar: أبواب خشبية
        en: wooden doors
        ur: لکڑی کے دروازے
      correct: false
      why:
        ar: ليست أبوابًا بل تاج قبّة
        en: not doors but a dome crown
        ur: دروازے نہیں، گنبد کا تاج
    - text:
        ar: نوافذ صغيرة
        en: small windows
        ur: چھوٹی کھڑکیاں
      correct: false
      why:
        ar: ليست نوافذ بل زخرفة
        en: not windows but ornament
        ur: کھڑکیاں نہیں، زینت
  - q:
      ar: متى انتهى الحكم الإسلامي في غرناطة؟
      en: When did Muslim rule in Granada end?
      ur: غرناطہ میں مسلم حکومت کب ختم ہوئی؟
    options:
    - text:
        ar: عام ١٤٩٢
        en: in 1492
        ur: 1492 میں
      correct: true
      why:
        ar: سقطت غرناطة عام ١٤٩٢
        en: Granada fell in 1492
        ur: غرناطہ 1492 میں گرا
    - text:
        ar: عام ١٢١٢
        en: in 1212
        ur: 1212 میں
      correct: false
      why:
        ar: ١٢١٢ معركة قبل سقوط غرناطة بكثير
        en: 1212 was a battle long before the fall
        ur: 1212 گرنے سے بہت پہلے کی لڑائی تھی
    - text:
        ar: عام ١٠٨٥
        en: in 1085
        ur: 1085 میں
      correct: false
      why:
        ar: ١٠٨٥ عام سقوط طليطلة
        en: 1085 is Toledo's fall, not Granada's
        ur: 1085 طليطلہ کے گرنے کا سال ہے
    - text:
        ar: عام ١٦١٤
        en: in 1614
        ur: 1614 میں
      correct: false
      why:
        ar: ١٦١٤ طرد لا سقوط للمدينة
        en: 1614 was an expulsion, not the city's fall
        ur: 1614 بے دخلی تھی، شہر کا سقوط نہیں
  - q:
      ar: ما «الجنة» في الحمراء؟
      en: What is the Generalife?
      ur: الحمراء میں «جنرلیف» کیا ہے؟
    options:
    - text:
        ar: بستان الصيف فوق القصر
        en: the summer garden above
        ur: اوپر گرمیوں کا باغ
      correct: true
      why:
        ar: بستان راحة فوق القصر
        en: a retreat garden above the palace
        ur: محل کے اوپر آرام کا باغ
    - text:
        ar: مسجد صغير
        en: a small mosque
        ur: چھوٹی مسجد
      correct: false
      why:
        ar: ليست مسجدًا بل بستانًا
        en: a garden, not a mosque
        ur: مسجد نہیں، باغ ہے
    - text:
        ar: برج حراسة
        en: a watchtower
        ur: چوکیدار مینار
      correct: false
      why:
        ar: ليست برجًا بل جنةً
        en: a garden, not a tower
        ur: مینار نہیں، باغ ہے
    - text:
        ar: سوق داخلي
        en: an inner market
        ur: اندرونی بازار
      correct: false
      why:
        ar: ليست سوقًا بل بستانًا
        en: a garden, not a market
        ur: بازار نہیں، باغ ہے
  - q:
      ar: ما الذي كُتب على جدرانه؟
      en: What is written on its walls?
      ur: اس کی دیواروں پر کیا لکھا ہے؟
    options:
    - text:
        ar: كتابات عربية
        en: Arabic calligraphy
        ur: عربی خطاطی
      correct: true
      why:
        ar: آيات وأدعية وأشعار في الخط العربي
        en: verses, prayers and poems in Arabic script
        ur: عربی خط میں آیات، دعائیں اور اشعار
    - text:
        ar: رموز رومانية
        en: Roman symbols
        ur: رومن علامتیں
      correct: false
      why:
        ar: لا رموز رومانية فيه
        en: no Roman symbols on it
        ur: اس پر رومن علامتیں نہیں
    - text:
        ar: خرائط قديمة
        en: old maps
        ur: پرانے نقشے
      correct: false
      why:
        ar: لا خرائط بل كتابات
        en: not maps but inscriptions
        ur: نقشے نہیں، خطاطی ہے
    - text:
        ar: رسوم بشرية
        en: human figures
        ur: انسانی تصویریں
      correct: false
      why:
        ar: لا رسوم بشرية في زخرفته
        en: no human figures in its ornament
        ur: اس کی زینت میں انسانی تصویریں نہیں
  - q:
      ar: ماذا حدث للقصر بعد ١٤٩٢؟
      en: What happened to the palace after 1492?
      ur: 1492 کے بعد محل کا کیا ہوا؟
    options:
    - text:
        ar: بقي وعُني به
        en: it survived and was kept
        ur: یہ بچا اور سنوارا گیا
      correct: true
      why:
        ar: بقي أجمل قصر إسلامي في الغرب
        en: it stayed the finest Islamic palace in the West
        ur: یہ مغرب کا خوبصورت ترین اسلامی محل رہا
    - text:
        ar: هُدم بالكامل
        en: it was fully razed
        ur: مکمل تباہ ہو گیا
      correct: false
      why:
        ar: لم يهدم بل بقي
        en: it was not razed; it survives
        ur: یہ تباہ نہیں ہوا، باقی ہے
    - text:
        ar: تحوّل إلى مسجد كبير
        en: it became a big mosque
        ur: بڑی مسجد بن گیا
      correct: false
      why:
        ar: لم يصبح مسجدًا بل قصرًا أثرًا
        en: it stayed a palace, not a mosque
        ur: یہ مسجد نہیں بنا، تاریخی محل رہا
    - text:
        ar: أُغرق بالماء
        en: it was flooded
        ur: پانی میں ڈبو دیا گیا
      correct: false
      why:
        ar: لم يُغرق بل بقي على رابيته
        en: it was not flooded; it still crowns its hill
        ur: یہ ڈبویا نہیں گیا، پہاڑی پر ہے
  - q:
      ar: لماذا يشتهر في فن العمارة؟
      en: Why is it famous in architecture?
      ur: یہ تعمیرات میں مشہور کیوں ہے؟
    options:
    - text:
        ar: لزخرفته الدقيقة ومائه
        en: for fine ornament and water
        ur: باریک زینت اور پانی کے لیے
      correct: true
      why:
        ar: جمع الجص والبلاط والكتابة والماء في تناسق نادر
        en: it joined plaster, tile, writing and water in rare harmony
        ur: اس نے پلاسٹر، ٹائل، خطاطی اور پانی کو نایاب ہم آہنگی میں جمع کیا
    - text:
        ar: لأطول برج فيه
        en: for its tallest tower
        ur: اس کے بلند ترین مینار کے لیے
      correct: false
      why:
        ar: لا برج فيه يفوق شهرته
        en: no tower of it is its fame
        ur: اس کا کوئی مینار اس کی شہرت نہیں
    - text:
        ar: لأقدم قبّة
        en: for the oldest dome
        ur: قدیم ترین گنبد کے لیے
      correct: false
      why:
        ar: ليس قديم قبّته بل جماله
        en: not oldest dome but its beauty
        ur: قدیم گنبد نہیں، اس کی خوبصورتی
    - text:
        ar: لأكبر مسجد
        en: for the largest mosque
        ur: بڑی مسجد کے لیے
      correct: false
      why:
        ar: ليس مسجدًا بل قصرًا
        en: it is a palace, not a mosque
        ur: یہ مسجد نہیں، محل ہے
- id: suleymaniye-mosque
  anchor: building/suleymaniye-mosque
  band: researchers
  title:
    ar: جامع السليمانية
    en: The Süleymaniye Mosque
    ur: سلیمانیہ مسجد
  sixty:
    ar: أمر سليمان القانوني مهندسه سنان ببناء جامع عظيم في إسطنبول فأنجزه عام ١٥٥٧. جمع المسجد قبّة واسعة على أربعة أعمدة وأربع مآذن، وحوله مدارس ومستشفى ومطابخ فقيرة
      وحمّام — مدينة كاملة للعبادة والخير. ويقول سنان إنها عمله الأعظم في أناقة التوازن.
    en: Sultan Süleyman ordered his architect Sinan to build a great mosque in Istanbul, finished in 1557. It joins a vast dome on four piers with four minarets,
      and around it schools, a hospital, poor kitchens and a bath — a whole city of worship and charity. Sinan called it his greatest work of balanced grace.
    ur: سلطان سلیمان قانونی نے اپنے معمار سنان کو استنبول میں عظیم مسجد بنانے کا حکم دیا جو 1557 میں مکمل ہوئی۔ چار ستونوں پر وسیع گنبد اور چار مینار جمع کیے اور
      گرد اسکول، شفاخانہ، فقیروں کی باورچی خانہ اور حمام — عبادت اور خیر کا پورا شہر۔ سنان اسے اپنا متوازن شاہکار کہتا تھا۔
  glossary:
  - term:
      ar: سليمان القانوني
      en: Süleyman the Lawgiver
      ur: سلیمان قانونی
    gloss:
      ar: السلطان الذي أمر ببناء الجامع
      en: the sultan who ordered the mosque
      ur: وہ سلطان جس نے مسجد کا حکم دیا
  - term:
      ar: سنان
      en: Sinan
      ur: سنان
    gloss:
      ar: المهندس الذي بناه وسمّاه عمله الأعظم
      en: the architect who built it and called it his peak
      ur: معمار جس نے بنایا اور اپنا شاہکار کہا
  - term:
      ar: إسطنبول
      en: Istanbul
      ur: استنبول
    gloss:
      ar: العاصمة العثمانية حيث يقف المسجد
      en: the Ottoman capital where it stands
      ur: عثمانی پایہ تخت جہاں مسجد ہے
  - term:
      ar: القبة الواسعة
      en: the great dome
      ur: وسیع گنبد
    gloss:
      ar: قبة كبيرة على أربعة أعمدة
      en: a vast dome over four piers
      ur: چار ستونوں پر بڑا گنبد
  - term:
      ar: المآذن الأربع
      en: the four minarets
      ur: چار مینار
    gloss:
      ar: أبراج عند زوايا المسجد
      en: towers at the mosque's corners
      ur: مسجد کے کونوں پر مینار
  - term:
      ar: الكلية
      en: the külliye
      ur: کلیے
    gloss:
      ar: مجمع الخدمات حول الجامع
      en: the complex of services around the mosque
      ur: مسجد کے گرد خدمات کا مجموعہ
  - term:
      ar: مطبخ الفقراء
      en: the soup kitchen
      ur: فقیروں کی باورچی خانہ
    gloss:
      ar: مطعم مجاني للفقراء في الكلية
      en: a free kitchen for the poor in the complex
      ur: کلیے میں فقیروں کا مفت کھانا
  - term:
      ar: المدارس
      en: the schools
      ur: مدارس
    gloss:
      ar: معاهد تعليم في المجمع
      en: teaching institutes in the complex
      ur: کلیے میں تعلیمی ادارے
  - term:
      ar: الحمّام
      en: the bath
      ur: حمام
    gloss:
      ar: مكان اغتسال عام في المجمع
      en: a public bath in the complex
      ur: کلیے میں عوامی حمام
  - term:
      ar: الشبابيك العازلة
      en: the quiet windows
      ur: خاموش کھڑکیاں
    gloss:
      ar: نوافذ تصمّ الصوت والرطوبة
      en: windows muting sound and damp
      ur: آواز اور نمی روکنے والی کھڑکیاں
  - term:
      ar: ١٥٥٧
      en: '1557'
      ur: 1557ء
    gloss:
      ar: عام إنجاز الجامع
      en: the year the mosque was finished
      ur: مسجد کی تکمیل کا سال
  - term:
      ar: التوازن
      en: balance
      ur: توازن
    gloss:
      ar: تناسب الأجزاء الذي فخر به سنان
      en: the proportion Sinan was proud of
      ur: تناسب جس پر سنان کو فخر تھا
  practice:
  - q:
      ar: من أمر ببناء الجامع؟
      en: Who ordered the mosque built?
      ur: مسجد بنانے کا حکم کس نے دیا؟
    options:
    - text:
        ar: سليمان القانوني
        en: Süleyman the Lawgiver
        ur: سلیمان قانونی
      correct: true
      why:
        ar: سليمان أمر سنانًا ببنائه
        en: Süleyman commanded Sinan to build it
        ur: سلیمان نے سنان کو حکم دیا
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: محمد الفاتح قبله جيلان
        en: Mehmed came two generations before
        ur: محمد فاتح دو نسلیں پہلے تھا
    - text:
        ar: سليم الثاني
        en: Selim II
        ur: سلیم دوم
      correct: false
      why:
        ar: سليم الثاني ابنه لا آمره
        en: Selim II was his son, not the patron
        ur: سلیم دوم اس کا بیٹا تھا، آمر نہیں
    - text:
        ar: عبد المجيد
        en: Abdülmecid
        ur: عبدالمجید
      correct: false
      why:
        ar: عبد المجيد بعده بقرون
        en: Abdülmecid came centuries later
        ur: عبدالمجید صدیاں بعد تھا
  - q:
      ar: من مهندسه؟
      en: Who was its architect?
      ur: اس کا معمار کون تھا؟
    options:
    - text:
        ar: سنان
        en: Sinan
        ur: سنان
      correct: true
      why:
        ar: سنان المهندس العثماني الأعظم
        en: Sinan, the greatest Ottoman architect
        ur: سنان، عثمانیوں کا سب سے بڑا معمار
    - text:
        ar: داود آغا
        en: Davud Agha
        ur: داؤد آغا
      correct: false
      why:
        ar: داود آغا مهندس آخر
        en: Davud Agha was another architect
        ur: داؤد آغا دوسرا معمار تھا
    - text:
        ar: أحمد إسحاق
        en: Ahmed Ishaq
        ur: احمد اسحاق
      correct: false
      why:
        ar: لا علاقة له به
        en: no link to him
        ur: اس سے کوئی تعلق نہیں
    - text:
        ar: الكافيه جي
        en: Kafiyeji
        ur: کافیجی
      correct: false
      why:
        ar: اسم غير معروف للمسجد
        en: not this mosque's name
        ur: اس مسجد کا نام نہیں
  - q:
      ar: متى أُنجز؟
      en: When was it finished?
      ur: یہ کب مکمل ہوئی؟
    options:
    - text:
        ar: عام ١٥٥٧
        en: in 1557
        ur: 1557 میں
      correct: true
      why:
        ar: انتهى البناء عام ١٥٥٧
        en: construction ended in 1557
        ur: تعمیر 1557 میں مکمل ہوئی
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ١٤٥٣ عام فتح إسطنبول لا بنائه
        en: 1453 is the conquest year, not its building
        ur: 1453 فتح کا سال ہے، تعمیر کا نہیں
    - text:
        ar: عام ١٦١٦
        en: in 1616
        ur: 1616 میں
      correct: false
      why:
        ar: ١٦١٦ عام المسجد الأزرق لا السليمانية
        en: 1616 is the Blue Mosque's year
        ur: 1616 بلیو مسجد کا سال ہے
    - text:
        ar: عام ١٩٢٣
        en: in 1923
        ur: 1923 میں
      correct: false
      why:
        ar: ١٩٢٣ عام الجمهورية لا بنائه
        en: 1923 is the republic's year
        ur: 1923 جمہوریت کا سال ہے
  - q:
      ar: كم عدد مآذنه؟
      en: How many minarets does it have?
      ur: اس کے کتنے مینار ہیں؟
    options:
    - text:
        ar: أربعة
        en: four
        ur: چار
      correct: true
      why:
        ar: أربع مآذن عند زواياه
        en: four minarets at its corners
        ur: کونوں پر چار مینار
    - text:
        ar: اثنان
        en: two
        ur: دو
      correct: false
      why:
        ar: له أربعة لا اثنان
        en: it has four, not two
        ur: اس کے چار ہیں، دو نہیں
    - text:
        ar: ستة
        en: six
        ur: چھ
      correct: false
      why:
        ar: ستة مآذن للأزرق لا له
        en: six is the Blue Mosque's count
        ur: چھ بلیو مسجد کے ہیں
    - text:
        ar: واحد
        en: one
        ur: ایک
      correct: false
      why:
        ar: له أربعة لا واحد
        en: it has four, not one
        ur: اس کے چار ہیں، ایک نہیں
  - q:
      ar: ما «الكلية»؟
      en: What is the külliye?
      ur: کلیے کیا ہے؟
    options:
    - text:
        ar: مجمع خدمات حول المسجد
        en: a service complex around the mosque
        ur: مسجد کے گرد خدمات کا مجموعہ
      correct: true
      why:
        ar: مدارس ومستشفى ومطبخ وحمّام حوله
        en: schools, hospital, kitchen and bath around it
        ur: اس کے گرد اسکول، شفاخانہ، باورچی خانہ اور حمام
    - text:
        ar: قبة صغيرة
        en: a small dome
        ur: چھوٹا گنبد
      correct: false
      why:
        ar: ليست قبة بل مجمع
        en: not a dome but a complex
        ur: گنبد نہیں، مجموعہ ہے
    - text:
        ar: مقبرة
        en: a tomb
        ur: قبر
      correct: false
      why:
        ar: ليست مقبرة بل خدمات
        en: not a tomb but services
        ur: قبر نہیں، خدمات ہیں
    - text:
        ar: سوق
        en: a market
        ur: بازار
      correct: false
      why:
        ar: ليس سوقًا بل مجمع خيري
        en: not a market but a charity complex
        ur: بازار نہیں، خیری مجموعہ
  - q:
      ar: ماذا اشتمل مجمعه؟
      en: What did its complex include?
      ur: اس کے مجموعے میں کیا شامل تھا؟
    options:
    - text:
        ar: مدارس ومستشفى ومطبخ
        en: schools, hospital, kitchen
        ur: اسکول، شفاخانہ، باورچی خانہ
      correct: true
      why:
        ar: معاهد ومستشفى ومطابخ فقراء وحمّام
        en: institutes, hospital, poor kitchens and bath
        ur: ادارے، شفاخانہ، فقیروں کی باورچی خانہ اور حمام
    - text:
        ar: قلعة حرب
        en: a war fortress
        ur: جنگی قلعہ
      correct: false
      why:
        ar: لا قلعة في المجمع
        en: no fortress in the complex
        ur: مجموعے میں قلعہ نہیں
    - text:
        ar: ميناء بحري
        en: a sea port
        ur: سمندری بندرگاہ
      correct: false
      why:
        ar: لا ميناء في المجمع
        en: no port in the complex
        ur: مجموعے میں بندرگاہ نہیں
    - text:
        ar: سجن
        en: a prison
        ur: قید خانہ
      correct: false
      why:
        ar: لا سجن في المجمع
        en: no prison in the complex
        ur: مجموعے میں قید خانہ نہیں
  - q:
      ar: ماذا قال سنان عنه؟
      en: What did Sinan say of it?
      ur: سنان نے اس کے بارے میں کیا کہا؟
    options:
    - text:
        ar: إنه عمله الأعظم في الأناقة
        en: his greatest work of grace
        ur: متوازن خوبصورتی کا شاہکار
      correct: true
      why:
        ar: سمّاه أعظم أعماله في الأناقة والتوازن
        en: he called it his peak of grace and balance
        ur: اسے متوازن خوبصورتی کا شاہکار کہا
    - text:
        ar: إنه أسرع أعماله
        en: his fastest work
        ur: تیز ترین کام
      correct: false
      why:
        ar: لم يفتخر بسرعته
        en: he took no pride in speed
        ur: اس نے رفتار پر فخر نہیں کیا
    - text:
        ar: إنه أصغر أعماله
        en: his smallest work
        ur: چھوٹا ترین کام
      correct: false
      why:
        ar: لم يقل أصغر بل أعظم
        en: he said greatest, not smallest
        ur: اس نے چھوٹا نہیں، بڑا کہا
    - text:
        ar: إنه عمل ناقص
        en: an unfinished work
        ur: نامکمل کام
      correct: false
      why:
        ar: لم يقل ناقصًا بل كاملاً
        en: he called it complete, not lacking
        ur: اس نے نامکمل نہیں، مکمل کہا
  - q:
      ar: على ماذا تستند قبته؟
      en: On what does its dome rest?
      ur: اس کا گنبد کس پر ٹکا ہے؟
    options:
    - text:
        ar: أربعة أعمدة ضخمة
        en: four great piers
        ur: چار بڑے ستون
      correct: true
      why:
        ar: قبة على أربعة أعمدة
        en: a dome over four piers
        ur: چار ستونوں پر گنبد
    - text:
        ar: عمود واحد
        en: one pillar
        ur: ایک ستون
      correct: false
      why:
        ar: لا عمود واحد بل أربعة
        en: not one pillar but four
        ur: ایک نہیں، چار ستون
    - text:
        ar: جدار واحد
        en: one wall
        ur: ایک دیوار
      correct: false
      why:
        ar: لا جدار واحد بل أعمدة
        en: not one wall but piers
        ur: ایک دیوار نہیں، ستون
    - text:
        ar: أرصفة خشبية
        en: wooden platforms
        ur: لکڑی کے پلیٹ فارم
      correct: false
      why:
        ar: لا خشب في قاعدة قبته
        en: no wood under its dome
        ur: گنبد کے نیچے لکڑی نہیں
  - q:
      ar: ما الغرض من مطبخ الفقراء؟
      en: What was the soup kitchen for?
      ur: فقیروں کی باورچی خانہ کس لیے تھی؟
    options:
    - text:
        ar: إطعام الفقراء مجانًا
        en: feeding the poor free
        ur: فقیروں کو مفت کھانا
      correct: true
      why:
        ar: مطبخ عام لإطعام المحتاجين
        en: a public kitchen feeding the needy
        ur: ضرورت مندوں کو کھانا دینے والا عام باورچی خانہ
    - text:
        ar: طعام السلطان فقط
        en: the sultan's food only
        ur: صرف سلطان کا کھانا
      correct: false
      why:
        ar: ليس للسلطان بل للفقراء
        en: for the poor, not the sultan
        ur: سلطان کے لیے نہیں، فقیروں کے لیے
    - text:
        ar: بيع الطعام
        en: selling food
        ur: کھانا بیچنا
      correct: false
      why:
        ar: ليس للبيع بل للصدقة
        en: for charity, not sale
        ur: فروخت کے لیے نہیں، صدقہ کے لیے
    - text:
        ar: تخزين الحبوب
        en: storing grain
        ur: اناج ذخیرہ کرنا
      correct: false
      why:
        ar: ليس مخزنًا بل مطبخًا
        en: a kitchen, not a store
        ur: گودام نہیں، باورچی خانہ
  - q:
      ar: لماذا تُعدّ تحفة عثمانية؟
      en: Why is it an Ottoman masterpiece?
      ur: یہ عثمانی شاہکار کیوں ہے؟
    options:
    - text:
        ar: لتوازنها وخدماتها
        en: for its balance and services
        ur: توازن اور خدمات کے لیے
      correct: true
      why:
        ar: جمعت جمال القبة وخدمات الكلية في انسجام
        en: it joined the dome's beauty and the complex's services
        ur: اس نے گنبد کی خوبصورتی اور کلیے کی خدمات جمع کیں
    - text:
        ar: لأنها أقدم مسجد
        en: for being the oldest mosque
        ur: قدیم ترین مسجد ہونے کے لیے
      correct: false
      why:
        ar: ليست أقدم المساجد
        en: it is not the oldest mosque
        ur: یہ قدیم ترین مسجد نہیں
    - text:
        ar: لأنها من ذهب
        en: for being golden
        ur: سونے کی ہونے کے لیے
      correct: false
      why:
        ar: ليست من ذهب بل حجر
        en: it is stone, not gold
        ur: یہ سونے کی نہیں، پتھر کی ہے
    - text:
        ar: لأكبر مسجد في العالم
        en: for being the world's largest
        ur: دنیا کی بڑی مسجد ہونے کے لیے
      correct: false
      why:
        ar: ليست أكبر مسجد في العالم
        en: it is not the world's largest
        ur: یہ دنیا کی بڑی مسجد نہیں
- id: blue-mosque
  anchor: building/blue-mosque
  band: researchers
  title:
    ar: المسجد الأزرق
    en: The Blue Mosque
    ur: بلیو مسجد
  sixty:
    ar: بناه السلطان أحمد الأول في إسطنبول وأُنجز عام ١٦١٦، واشتهر ببلاطه الإزنيقي الأزرق الذي يكسو جدرانه العليا. وقف المسجد قبالة آيا صوفيا بستّ مآذن — وهو عدد
      لم يُرَ قبله — مع قبة كبرى تحيط بها قباب أنصاف متدرجة. ولا يزال مكان عبادة وأشهر معلم عثماني بعد آيا صوفيا.
    en: Sultan Ahmed I built it in Istanbul, finished in 1616, and it is famed for the blue Iznik tiles cladding its upper walls. Facing Hagia Sophia with six minarets
      — a count never seen before — its great dome is ringed by tiers of half-domes. It remains a place of worship and the best-known Ottoman monument after Hagia
      Sophia.
    ur: سلطان احمد اول نے اسے استنبول میں بنوایا اور 1616 میں مکمل ہوا، اور اپنی اوپری دیواروں کی نیلی ایزنق ٹائلوں سے مشہور ہوا۔ آیا صوفیا کے سامنے چھ میناروں کے
      ساتھ — پہلے کبھی نہ دیکھا ہوا عدد — اس کے بڑے گنبد کو درجہ دار نصف گنبد گھیرتے ہیں۔ یہ آج بھی عبادت گاہ اور آیا صوفیا کے بعد مشہور ترین عثمانی یادگار ہے۔
  glossary:
  - term:
      ar: السلطان أحمد الأول
      en: Sultan Ahmed I
      ur: سلطان احمد اول
    gloss:
      ar: السلطان الذي أمر ببناء المسجد
      en: the sultan who ordered the mosque
      ur: وہ سلطان جس نے مسجد کا حکم دیا
  - term:
      ar: إزنيق
      en: Iznik
      ur: ازنق
    gloss:
      ar: المدينة التي صُنع فيها البلاط الأزرق
      en: the town where the blue tiles were made
      ur: وہ شہر جہاں نیلی ٹائلیں بنیں
  - term:
      ar: البلاط الأزرق
      en: the blue tiles
      ur: نیلی ٹائلیں
    gloss:
      ar: قطع زجاجية زرقاء تكسو الجدران العليا
      en: blue glazed pieces cladding the upper walls
      ur: اوپری دیواروں کو ڈھانپنے والی نیلی ٹائلیں
  - term:
      ar: ستّ مآذن
      en: six minarets
      ur: چھ مینار
    gloss:
      ar: عدد لم يُرَ في مسجد قبله
      en: a number never seen on a mosque before
      ur: پہلے کسی مسجد پر نہ دیکھا ہوا عدد
  - term:
      ar: آيا صوفيا
      en: Hagia Sophia
      ur: آیا صوفیا
    gloss:
      ar: البازيليكا التي يقف المسجد قبالتها
      en: the basilica the mosque faces
      ur: وہ باسیلیکا جس کے سامنے مسجد ہے
  - term:
      ar: أنصاف القباب
      en: the half-domes
      ur: نصف گنبد
    gloss:
      ar: قباب صغيرة تحمل القبة الكبرى
      en: smaller domes carrying the great dome
      ur: چھوٹے گنبد جو بڑے گنبد کو سہارا دیتے ہیں
  - term:
      ar: ١٦١٦
      en: '1616'
      ur: 1616ء
    gloss:
      ar: عام إنجاز المسجد
      en: the year the mosque was finished
      ur: مسجد کی تکمیل کا سال
  - term:
      ar: سدف خارجه
      en: Sedefkar Mehmed Agha
      ur: سدفکار محمد آغا
    gloss:
      ar: المهندس الذي بناه تلميذ سنان
      en: its architect, a pupil of Sinan
      ur: اس کا معمار، سنان کا شاگرد
  - term:
      ar: القرن السابع عشر
      en: the seventeenth century
      ur: سترہویں صدی
    gloss:
      ar: العصر الذي بُني فيه
      en: the century it was built in
      ur: وہ صدی جس میں بنا
  - term:
      ar: المسجد السلطاني
      en: the imperial mosque
      ur: شاہی مسجد
    gloss:
      ar: مسجد بناه السلطان لاسمه
      en: a mosque a sultan built in his name
      ur: سلطان کی بنائی ہوئی نام کی مسجد
  - term:
      ar: النافورة الداخلية
      en: the inner fountain
      ur: اندرونی چشمہ
    gloss:
      ar: ماء في صحن المسجد
      en: water in the mosque's courtyard
      ur: مسجد کے صحن کا پانی
  - term:
      ar: الحجر والرخام
      en: stone and marble
      ur: پتھر اور سنگ مرمر
    gloss:
      ar: مواد البناء الخارجية
      en: the outer building materials
      ur: بیرونی تعمیر کا سامان
  practice:
  - q:
      ar: في أيّ مدينة يقع؟
      en: In which city is it?
      ur: یہ کس شہر میں ہے؟
    options:
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: true
      why:
        ar: في إسطنبول قبالة آيا صوفيا
        en: in Istanbul, facing Hagia Sophia
        ur: استنبول میں، آیا صوفیا کے سامنے
    - text:
        ar: بورصة
        en: Bursa
        ur: بورصہ
      correct: false
      why:
        ar: بورصة مدينة أخرى
        en: Bursa is another city
        ur: بورصہ دوسرا شہر ہے
    - text:
        ar: أدرنة
        en: Edirne
        ur: ادرنہ
      correct: false
      why:
        ar: أدرنة فيها مسجد سليم
        en: Edirne holds the Selimiye
        ur: ادرنہ میں سلیمیہ مسجد ہے
    - text:
        ar: أنقرة
        en: Ankara
        ur: انقرہ
      correct: false
      why:
        ar: أنقرة ليست موضعه
        en: Ankara is not its site
        ur: انقرہ اس کی جگہ نہیں
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنوایا؟
    options:
    - text:
        ar: السلطان أحمد الأول
        en: Sultan Ahmed I
        ur: سلطان احمد اول
      correct: true
      why:
        ar: أحمد الأول أمر ببنائه
        en: Ahmed I ordered its building
        ur: احمد اول نے بنانے کا حکم دیا
    - text:
        ar: سليمان القانوني
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان بنا السليمانية لا هذا
        en: Süleyman built the Süleymaniye, not this
        ur: سلیمان نے سلیمانیہ بنوائی، یہ نہیں
    - text:
        ar: محمد الفاتح
        en: Mehmed II
        ur: محمد فاتح
      correct: false
      why:
        ar: محمد الفاتح قبله بقرون
        en: Mehmed II came centuries before
        ur: محمد فاتح صدیاں پہلے تھا
    - text:
        ar: عبد الحميد
        en: Abdülhamid
        ur: عبدالحمید
      correct: false
      why:
        ar: عبد الحميد بعده بقرون
        en: Abdülhamid came centuries later
        ur: عبدالحمید صدیاں بعد تھا
  - q:
      ar: لماذا سُمّي «الأزرق»؟
      en: Why is it called 'Blue'?
      ur: اسے «بلیو» کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لبلاطه الإزنيقي الأزرق
        en: for its blue Iznik tiles
        ur: نیلی ایزنق ٹائلوں کے لیے
      correct: true
      why:
        ar: البلاط الأزرق يكسو جدرانه العليا
        en: blue tiles clad its upper walls
        ur: نیلی ٹائلیں اوپری دیواریں ڈھانپتی ہیں
    - text:
        ar: لمائه الأزرق
        en: for blue water
        ur: نیلے پانی کے لیے
      correct: false
      why:
        ar: لا ماء أزرق اشتهر به
        en: no blue water is its fame
        ur: نیلے پانی سے مشہور نہیں
    - text:
        ar: لسمائه فقط
        en: for its sky only
        ur: صرف آسمان کے لیے
      correct: false
      why:
        ar: لون السماء لا سبب التسمية
        en: the sky's colour is not the reason
        ur: آسمان کا رنگ وجہ نہیں
    - text:
        ar: لحجره الأزرق
        en: for blue stone
        ur: نیلے پتھر کے لیے
      correct: false
      why:
        ar: حجره رمادي بل البلاط أزرق
        en: its stone is grey; the tiles are blue
        ur: پتھر سرمئی ہے، ٹائلیں نیلی
  - q:
      ar: كم عدد مآذنه؟
      en: How many minarets?
      ur: اس کے کتنے مینار ہیں؟
    options:
    - text:
        ar: ستّة
        en: six
        ur: چھ
      correct: true
      why:
        ar: ستّ مآذن لم يُرَ مثلها
        en: six minarets, a count unseen before
        ur: چھ مینار، پہلے نہ دیکھا ہوا عدد
    - text:
        ar: أربعة
        en: four
        ur: چار
      correct: false
      why:
        ar: أربعة للسليمانية لا له
        en: four is the Süleymaniye's count
        ur: چار سلیمانیہ کے ہیں
    - text:
        ar: اثنان
        en: two
        ur: دو
      correct: false
      why:
        ar: له ستة لا اثنان
        en: it has six, not two
        ur: اس کے چھ ہیں، دو نہیں
    - text:
        ar: ثمانية
        en: eight
        ur: آٹھ
      correct: false
      why:
        ar: لا مسجد له ثمانية هنا
        en: no mosque here has eight
        ur: یہاں کسی مسجد کے آٹھ نہیں
  - q:
      ar: متى أُنجز؟
      en: When was it finished?
      ur: یہ کب مکمل ہوئی؟
    options:
    - text:
        ar: عام ١٦١٦
        en: in 1616
        ur: 1616 میں
      correct: true
      why:
        ar: انتهى البناء عام ١٦١٦
        en: construction ended in 1616
        ur: تعمیر 1616 میں مکمل ہوئی
    - text:
        ar: عام ١٥٥٧
        en: in 1557
        ur: 1557 میں
      correct: false
      why:
        ar: ١٥٥٧ عام السليمانية لا الأزرق
        en: 1557 is the Süleymaniye's year
        ur: 1557 سلیمانیہ کا سال ہے
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ١٤٥٣ عام الفتح لا بنائه
        en: 1453 is the conquest year
        ur: 1453 فتح کا سال ہے
    - text:
        ar: عام ١٧٥٥
        en: in 1755
        ur: 1755 میں
      correct: false
      why:
        ar: ١٧٥٥ متأخر عن بنائه
        en: 1755 is later than its building
        ur: 1755 اس کی تعمیر سے بعد ہے
  - q:
      ar: ما «البلاط الإزنيقي»؟
      en: What is Iznik tile?
      ur: ایزنق ٹائل کیا ہے؟
    options:
    - text:
        ar: خزف أزرق من إزنيق
        en: blue glazed tile from Iznik
        ur: ازنق کی نیلی چمکیلی ٹائل
      correct: true
      why:
        ar: خزف ملون صنعته مدينة إزنيق
        en: coloured glazed tile made in Iznik
        ur: ازنق شہر کی بنائی رنگین چمکیلی ٹائل
    - text:
        ar: رخام إيطالي
        en: Italian marble
        ur: اطالوی سنگ مرمر
      correct: false
      why:
        ar: ليس رخامًا بل خزف
        en: not marble but glazed tile
        ur: سنگ مرمر نہیں، چمکیلی ٹائل
    - text:
        ar: زجاج معشق
        en: stained glass
        ur: رنگین شیشہ
      correct: false
      why:
        ar: ليس زجاجًا بل بلاط
        en: not glass but tile
        ur: شیشہ نہیں، ٹائل
    - text:
        ar: ذهب مصفح
        en: gilded gold
        ur: مطلي سونا
      correct: false
      why:
        ar: ليس ذهبًا بل خزف أزرق
        en: not gold but blue tile
        ur: سونا نہیں، نیلی ٹائل
  - q:
      ar: من مهندسه؟
      en: Who was its architect?
      ur: اس کا معمار کون تھا؟
    options:
    - text:
        ar: سدف خارجه تلميذ سنان
        en: Sedefkar Mehmed Agha, Sinan's pupil
        ur: سدفکار محمد آغا، سنان کا شاگرد
      correct: true
      why:
        ar: بناه تلميذ سنان محمد آغا
        en: Sinan's pupil Mehmed Agha built it
        ur: سنان کے شاگرد محمد آغا نے بنایا
    - text:
        ar: سنان نفسه
        en: Sinan himself
        ur: خود سنان
      correct: false
      why:
        ar: سنان مات قبل بنائه
        en: Sinan died before its building
        ur: سنان اس کی تعمیر سے پہلے فوت ہوا
    - text:
        ar: مهندس فرنسي
        en: a French architect
        ur: فرانسیسی معمار
      correct: false
      why:
        ar: ليس فرنسيًا بل عثمانيًا
        en: an Ottoman architect, not French
        ur: عثمانی معمار، فرانسیسی نہیں
    - text:
        ar: داود آغا
        en: Davud Agha
        ur: داؤد آغا
      correct: false
      why:
        ar: سدف خارجه هو المهندس
        en: Sedefkar is the architect
        ur: سدفکار معمار ہے
  - q:
      ar: ما البناء الذي يقف قبالته؟
      en: What building does it face?
      ur: یہ کس عمارت کے سامنے ہے؟
    options:
    - text:
        ar: آيا صوفيا
        en: Hagia Sophia
        ur: آیا صوفیا
      correct: true
      why:
        ar: يقف قبالة آيا صوفيا
        en: it stands facing Hagia Sophia
        ur: آیا صوفیا کے سامنے کھڑی ہے
    - text:
        ar: قصر طوب قابي
        en: Topkapi Palace
        ur: توپ قاپی محل
      correct: false
      why:
        ar: القصر قريب لا مقابل
        en: the palace is near, not facing
        ur: محل قریب ہے، سامنے نہیں
    - text:
        ar: المسجد السليمانية
        en: the Süleymaniye
        ur: سلیمانیہ
      correct: false
      why:
        ar: السليمانية في جهة أخرى
        en: the Süleymaniye is elsewhere
        ur: سلیمانیہ دوسری جگہ ہے
    - text:
        ar: قلعة روملي
        en: Rumeli fortress
        ur: روملی قلعہ
      correct: false
      why:
        ar: القلعة على البوسفور بعيدة
        en: the fortress is far on the Bosporus
        ur: قلعہ باسفورس پر دور ہے
  - q:
      ar: ما الذي يحيط قبته الكبرى؟
      en: What rings its great dome?
      ur: اس کے بڑے گنبد کو کیا گھیرتا ہے؟
    options:
    - text:
        ar: أنصاف قباب متدرجة
        en: tiered half-domes
        ur: درجہ دار نصف گنبد
      correct: true
      why:
        ar: قباب أنصاف تحيط القبة وتعينها
        en: half-domes ring and bear the great dome
        ur: نصف گنبد بڑے گنبد کو گھیرے اور سہارا دیتے ہیں
    - text:
        ar: أعمدة ذهبية
        en: golden columns
        ur: سنہری ستون
      correct: false
      why:
        ar: لا ذهب بل قباب أنصاف
        en: no gold; half-domes
        ur: سونا نہیں، نصف گنبد
    - text:
        ar: أبراج ساعة
        en: clock towers
        ur: گھڑی کے مینار
      correct: false
      why:
        ar: لا أبراج ساعة فيه
        en: no clock towers on it
        ur: اس پر گھڑی کے مینار نہیں
    - text:
        ar: تماثيل رخامية
        en: marble statues
        ur: سنگ مرمر کے مجسمے
      correct: false
      why:
        ar: لا تماثيل في المسجد
        en: no statues in the mosque
        ur: مسجد میں مجسمے نہیں
  - q:
      ar: ما حاله اليوم؟
      en: What is it today?
      ur: آج یہ کیا ہے؟
    options:
    - text:
        ar: مسجد عامر ومعلم مشهور
        en: an active mosque and famous landmark
        ur: فعال مسجد اور مشہور نشان
      correct: true
      why:
        ar: يبقى مكان عبادة ومعلمًا زائرًا
        en: it stays a place of worship and a visited landmark
        ur: یہ عبادت گاہ اور مشہور یادگار رہی
    - text:
        ar: متحف مغلق
        en: a closed museum
        ur: بند عجائب گھر
      correct: false
      why:
        ar: ليس مغلقًا بل مفتوح للصلاة
        en: not closed; open for prayer
        ur: بند نہیں، نماز کے لیے کھلی
    - text:
        ar: قصر ملكي
        en: a royal palace
        ur: شاہی محل
      correct: false
      why:
        ar: ليس قصرًا بل مسجدًا
        en: a mosque, not a palace
        ur: محل نہیں، مسجد
    - text:
        ar: مدرسة خاصة
        en: a private school
        ur: نجی اسکول
      correct: false
      why:
        ar: ليس مدرسة بل مسجد عامر
        en: an active mosque, not a school
        ur: اسکول نہیں، فعال مسجد
- id: hijri-calendar
  anchor: concept/hijri-calendar
  band: scholars
  title:
    ar: التقويم الهجري
    en: The Hijri calendar
    ur: ہجری تقویم
  sixty:
    ar: يبدأ التقويم الهجري سنة الهجرة — ٦٢٢ ميلادية — ويقيس الزمان بأشهر قمرية اثني عشر شهرًا. شهر رمضان للصوم وشوال لعيد الفطر وذو الحجة للحج وعيد الأضحى. ولأن
      السنة القمرية أقصر من الشمسية بأحد عشر يومًا، تتنقل المواسم الإسلامية عبر فصول السنة كلها في نحو ثلاثة وثلاثين عامًا.
    en: The Hijri calendar begins at the year of the Hijra — 622 CE — and measures time in twelve lunar months. Ramadan is for fasting, Shawwal for Eid al-Fitr, and
      Dhu al-Hijja for the Hajj and Eid al-Adha. Because the lunar year is about eleven days shorter than the solar year, Islamic seasons move through every season
      of the year in about thirty-three years.
    ur: ہجری تقویم ہجرت کے سال — 622 عیسوی — سے شروع ہوتا ہے اور وقت کو بارہ قمری مہینوں میں ناپتا ہے۔ رمضان روزے کا، شوال عید الفطر کا اور ذوالحجہ حج اور عید الاضحیٰ
      کا مہینہ ہے۔ چونکہ قمری سال شمسی سے تقریباً گیارہ دن چھوٹا ہے، اسلامی موسم تقریباً تینتیس برسوں میں سال کے تمام فصلوں میں گھومتے ہیں۔
  glossary:
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: هجرة النبي إلى المدينة عام ٦٢٢ وبداية التقويم
      en: the Prophet's migration to Medina in 622; the calendar's start
      ur: نبی کی مدینہ ہجرت 622 میں؛ تقویم کا آغاز
  - term:
      ar: الشهر القمري
      en: the lunar month
      ur: قمری مہینہ
    gloss:
      ar: شهر يقاس بطور القمر من هلال إلى هلال
      en: a month measured by the moon's phase, crescent to crescent
      ur: چاند کے طور سے ناپا مہینہ، ہلال سے ہلال
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: شهر الصوم التاسع في التقويم
      en: the ninth month, the fasting month
      ur: نواں مہینہ، روزے کا مہینہ
  - term:
      ar: شوال
      en: Shawwal
      ur: شوال
    gloss:
      ar: شهر العيد الفطر بعد رمضان
      en: the month of Eid al-Fitr after Ramadan
      ur: رمضان کے بعد عید الفطر کا مہینہ
  - term:
      ar: ذو الحجة
      en: Dhu al-Hijja
      ur: ذوالحجہ
    gloss:
      ar: شهر الحج والأضحى الثاني عشر
      en: the twelfth month, of Hajj and Eid al-Adha
      ur: بارہواں مہینہ، حج اور عید الاضحیٰ کا
  - term:
      ar: محرم
      en: Muharram
      ur: محرم
    gloss:
      ar: أول الشهر في السنة الهجرية
      en: the first month of the Hijri year
      ur: ہجری سال کا پہلا مہینہ
  - term:
      ar: الهلال
      en: the crescent
      ur: ہلال
    gloss:
      ar: القمر الجديد الذي يبدأ به الشهر
      en: the new moon that starts each month
      ur: نیا چاند جس سے مہینہ شروع ہوتا ہے
  - term:
      ar: السنة القمرية
      en: the lunar year
      ur: قمری سال
    gloss:
      ar: نحو ٣٥٤ يومًا أقصر من الشمسية
      en: about 354 days, shorter than the solar year
      ur: تقریباً 354 دن، شمسی سال سے چھوٹا
  - term:
      ar: عيد الفطر
      en: Eid al-Fitr
      ur: عید الفطر
    gloss:
      ar: عيد نهاية رمضان أول شوال
      en: the feast ending Ramadan, first of Shawwal
      ur: رمضان کے اختتام کی عید، پہلی شوال
  - term:
      ar: عيد الأضحى
      en: Eid al-Adha
      ur: عید الاضحیٰ
    gloss:
      ar: عيد الحج العاشر من ذي الحجة
      en: the feast of Hajj, tenth of Dhu al-Hijja
      ur: حج کی عید، دسویں ذوالحجہ
  - term:
      ar: عمر بن الخطاب
      en: Umar ibn al-Khattab
      ur: عمر بن الخطاب
    gloss:
      ar: الخليفة الذي بدأ التقويم بالهجرة
      en: the caliph who based the calendar on the Hijra
      ur: وہ خلیفہ جس نے تقویم ہجرت پر قائم کیا
  - term:
      ar: الموسم المتنقل
      en: the moving season
      ur: گھومتا موسم
    gloss:
      ar: تنقل الأشهر عبر فصول السنة
      en: the months' drift through the year's seasons
      ur: مہینوں کا سال کے فصلوں میں گھومنا
  practice:
  - q:
      ar: متى يبدأ التقويم الهجري؟
      en: When does the Hijri calendar start?
      ur: ہجری تقویم کب شروع ہوتا ہے؟
    options:
    - text:
        ar: سنة الهجرة ٦٢٢
        en: the Hijra year, 622
        ur: ہجرت کا سال 622
      correct: true
      why:
        ar: يبدأ بعام هجرة النبي إلى المدينة
        en: it begins at the Prophet's migration to Medina
        ur: نبی کی مدینہ ہجرت سے شروع ہوتا ہے
    - text:
        ar: سنة الميلاد
        en: the birth year
        ur: پیدائش کا سال
      correct: false
      why:
        ar: ليس بعام الميلاد بل الهجرة
        en: not the birth year but the Hijra
        ur: پیدائش کا سال نہیں، ہجرت
    - text:
        ar: سنة البعثة
        en: the call year
        ur: بعثت کا سال
      correct: false
      why:
        ar: ليس بعام البعثة بل الهجرة
        en: not the call year but the Hijra
        ur: بعثت کا سال نہیں، ہجرت
    - text:
        ar: سنة الوفاة
        en: the death year
        ur: وفات کا سال
      correct: false
      why:
        ar: ليس بعام الوفاة بل الهجرة
        en: not the death year but the Hijra
        ur: وفات کا سال نہیں، ہجرت
  - q:
      ar: كم شهرًا فيه؟
      en: How many months does it have?
      ur: اس میں کتنے مہینے ہیں؟
    options:
    - text:
        ar: اثنا عشر
        en: twelve
        ur: بارہ
      correct: true
      why:
        ar: اثنا عشر شهرًا قمريًا
        en: twelve lunar months
        ur: بارہ قمری مہینے
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: له اثنا عشر لا عشرة
        en: it has twelve, not ten
        ur: اس میں بارہ ہیں، دس نہیں
    - text:
        ar: أربعة عشر
        en: fourteen
        ur: چودہ
      correct: false
      why:
        ar: له اثنا عشر لا أربعة عشر
        en: it has twelve, not fourteen
        ur: اس میں بارہ ہیں، چودہ نہیں
    - text:
        ar: سبعة
        en: seven
        ur: سات
      correct: false
      why:
        ar: له اثنا عشر لا سبعة
        en: it has twelve, not seven
        ur: اس میں بارہ ہیں، سات نہیں
  - q:
      ar: ما شهر الصوم؟
      en: Which is the fasting month?
      ur: روزے کا مہینہ کون سا ہے؟
    options:
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: true
      why:
        ar: رمضان التاسع شهر الصوم
        en: Ramadan, the ninth month, is for fasting
        ur: رمضان، نواں مہینہ، روزے کا ہے
    - text:
        ar: شوال
        en: Shawwal
        ur: شوال
      correct: false
      why:
        ar: شوال شهر العيد بعد رمضان
        en: Shawwal is the feast month after Ramadan
        ur: شوال رمضان کے بعد عید کا مہینہ ہے
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول الشهر لا الصوم
        en: Muharram is the first month, not fasting
        ur: محرم پہلا مہینہ ہے، روزے کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب سابع الشهر لا الصوم
        en: Rajab is the seventh, not fasting
        ur: رجب ساتواں ہے، روزے کا نہیں
  - q:
      ar: أين يقع الحج؟
      en: When is the Hajj?
      ur: حج کب ہوتا ہے؟
    options:
    - text:
        ar: ذو الحجة
        en: Dhu al-Hijja
        ur: ذوالحجہ
      correct: true
      why:
        ar: الحج في ذي الحجة الثاني عشر
        en: the Hajj is in Dhu al-Hijja, the twelfth
        ur: حج بارہویں مہینے ذوالحجہ میں ہے
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: false
      why:
        ar: رمضان للصوم لا للحج
        en: Ramadan is for fasting, not Hajj
        ur: رمضان روزے کا ہے، حج کا نہیں
    - text:
        ar: شعبان
        en: Sha'ban
        ur: شعبان
      correct: false
      why:
        ar: شعبان قبل رمضان لا الحج
        en: Sha'ban precedes Ramadan, not Hajj
        ur: شعبان رمضان سے پہلے ہے، حج کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الحج
        en: Muharram opens the year, not Hajj
        ur: محرم سال کا پہلا ہے، حج کا نہیں
  - q:
      ar: ما الفرق عن السنة الشمسية؟
      en: How does it differ from the solar year?
      ur: یہ شمسی سال سے کیسے مختلف ہے؟
    options:
    - text:
        ar: أقصر بنحو ١١ يومًا
        en: about 11 days shorter
        ur: تقریباً 11 دن چھوٹا
      correct: true
      why:
        ar: السنة القمرية نحو ٣٥٤ يومًا
        en: the lunar year runs about 354 days
        ur: قمری سال تقریباً 354 دن کا ہے
    - text:
        ar: أطول بعشرة أيام
        en: 10 days longer
        ur: 10 دن لمبا
      correct: false
      why:
        ar: ليس أطول بل أقصر
        en: it is shorter, not longer
        ur: یہ لمبا نہیں، چھوٹا ہے
    - text:
        ar: مثل الشمسية تمامًا
        en: exactly like the solar
        ur: بالکل شمسی جیسا
      correct: false
      why:
        ar: ليس مثلها بل أقصر
        en: not the same; it is shorter
        ur: ایک جیسا نہیں، چھوٹا ہے
    - text:
        ar: أقصر بشهر كامل
        en: a full month shorter
        ur: پورا مہینہ چھوٹا
      correct: false
      why:
        ar: ليس شهرًا بل أحد عشر يومًا
        en: not a month but eleven days
        ur: مہینہ نہیں، گیارہ دن
  - q:
      ar: لماذا تتنقل المواسم؟
      en: Why do its seasons move?
      ur: اس کے موسم کیوں گھومتے ہیں؟
    options:
    - text:
        ar: لقصر السنة القمرية
        en: because the lunar year is short
        ur: قمری سال کے چھوٹے ہونے کے سبب
      correct: true
      why:
        ar: أقصر من الشمسية فتتقدم الأشهر كل عام
        en: shorter than solar, so months advance yearly
        ur: شمسی سے چھوٹا، اس لیے مہینے ہر سال آگے آتے ہیں
    - text:
        ar: لطول السنة القمرية
        en: because the lunar year is long
        ur: قمری سال کے لمبے ہونے کے سبب
      correct: false
      why:
        ar: ليس أطول بل أقصر
        en: it is shorter, not longer
        ur: یہ لمبا نہیں، چھوٹا ہے
    - text:
        ar: لحركة الأرض
        en: for Earth's motion
        ur: زمین کی حرکت کے لیے
      correct: false
      why:
        ar: السبب طول السنة لا حركة الأرض
        en: the cause is the year's length, not Earth's motion
        ur: وجہ سال کی لمبائی ہے، زمین کی حرکت نہیں
    - text:
        ar: لتغيير الطقس
        en: for weather change
        ur: موسم کی تبدیلی کے لیے
      correct: false
      why:
        ar: ليس الطقس بل حساب الشهر
        en: not weather but the month count
        ur: موسم نہیں، مہینوں کا حساب
  - q:
      ar: ما الهلال؟
      en: What is the crescent?
      ur: ہلال کیا ہے؟
    options:
    - text:
        ar: القمر الجديد بادئ الشهر
        en: the new moon starting each month
        ur: ہر مہینے کا آغاز کرنے والا نیا چاند
      correct: true
      why:
        ar: يبدأ كل شهر قمري برؤية هلاله
        en: each lunar month begins with its crescent
        ur: ہر قمری مہینہ اس کے ہلال سے شروع ہوتا ہے
    - text:
        ar: نجمة الصباح
        en: the morning star
        ur: صبح کا ستارہ
      correct: false
      why:
        ar: ليست نجمة بل قمر
        en: a moon, not a star
        ur: ستارہ نہیں، چاند
    - text:
        ar: قمر مكتمل
        en: a full moon
        ur: پورا چاند
      correct: false
      why:
        ar: ليس مكتملًا بل هلال جديد
        en: a new crescent, not a full moon
        ur: پورا نہیں، نیا ہلال
    - text:
        ar: كوكب الزهرة
        en: the planet Venus
        ur: زہرہ سیارہ
      correct: false
      why:
        ar: ليست كوكبًا بل طور القمر
        en: a moon phase, not a planet
        ur: سیارہ نہیں، چاند کا طور
  - q:
      ar: من بدأ التقويم؟
      en: Who began the calendar?
      ur: تقویم کس نے شروع کیا؟
    options:
    - text:
        ar: عمر بن الخطاب
        en: Umar ibn al-Khattab
        ur: عمر بن الخطاب
      correct: true
      why:
        ar: عمر جعل الهجرة بداية التقويم
        en: Umar made the Hijra its starting point
        ur: عمر نے ہجرت کو اس کا آغاز بنایا
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: false
      why:
        ar: أبو بكر قبل عمر
        en: Abu Bakr preceded Umar
        ur: ابو بکر عمر سے پہلے تھا
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: false
      why:
        ar: عثمان بعد عمر
        en: Uthman came after Umar
        ur: عثمان عمر کے بعد تھا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي بعد عمر
        en: Ali came after Umar
        ur: علی عمر کے بعد تھا
  - q:
      ar: ما عيد الفطر؟
      en: What is Eid al-Fitr?
      ur: عید الفطر کیا ہے؟
    options:
    - text:
        ar: عيد نهاية رمضان
        en: the feast ending Ramadan
        ur: رمضان کے اختتام کی عید
      correct: true
      why:
        ar: أول شوال عيد انتهاء الصوم
        en: first of Shawwal, the fast-ending feast
        ur: پہلی شوال، روزے کے ختم کی عید
    - text:
        ar: عيد الحج
        en: the Hajj feast
        ur: حج کی عید
      correct: false
      why:
        ar: عيد الحج هو الأضحى لا الفطر
        en: the Hajj feast is al-Adha, not al-Fitr
        ur: حج کی عید اضحیٰ ہے، فطر نہیں
    - text:
        ar: أول السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليست أول السنة بل بعد رمضان
        en: not the new year but after Ramadan
        ur: نیا سال نہیں، رمضان کے بعد
    - text:
        ar: ليلة القدر
        en: the Night of Power
        ur: قدر کی رات
      correct: false
      why:
        ar: ليلة القدر في رمضان لا عيد
        en: the Night of Power is in Ramadan, not Eid
        ur: قدر کی رات رمضان میں ہے، عید نہیں
  - q:
      ar: كم يستغرق دورة المواسم؟
      en: How long for seasons to cycle?
      ur: موسموں کا چکر کتنے عرصے میں پورا ہوتا ہے؟
    options:
    - text:
        ar: نحو ٣٣ عامًا
        en: about 33 years
        ur: تقریباً 33 سال
      correct: true
      why:
        ar: تكمل الأشهر دورة الفصول في نحو ٣٣ عامًا
        en: the months complete a season cycle in about 33 years
        ur: مہینے تقریباً 33 سال میں فصلوں کا چکر پورا کرتے ہیں
    - text:
        ar: ١٠ أعوام
        en: 10 years
        ur: 10 سال
      correct: false
      why:
        ar: ١٠ أعوام أقل من الدورة
        en: ten years is less than the cycle
        ur: 10 سال چکر سے کم ہے
    - text:
        ar: ١٠٠ عام
        en: 100 years
        ur: 100 سال
      correct: false
      why:
        ar: ١٠٠ عام أكثر من الدورة
        en: a hundred years is more than the cycle
        ur: 100 سال چکر سے زیادہ ہے
    - text:
        ar: عام واحد
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: عام واحد لا يكفي لدورة
        en: one year is too few for the cycle
        ur: ایک سال چکر کے لیے کم ہے
- id: algebra
  anchor: concept/algebra
  band: researchers
  title:
    ar: الجبر
    en: Algebra
    ur: الجبر
  sixty:
    ar: وضع محمد بن موسى الخوارزمي في بغداد كتاب «الجبر والمقابلة» نحو عام ٨٢٠، فجمع طريقة حل المعادلات خطوة بخطوة بلا رموز حديثة. من اسمه جاءت كلمة «الخوارزمية»
      ومن «الجبر» جاءت كلمة algebra في لغات أوروبا. وغيّر الكتاب حساب الميراث والتجارة والهندسة في العالم الإسلامي وما بعده.
    en: Around 820 in Baghdad, Muhammad ibn Musa al-Khwarizmi wrote the 'Book of Restoration and Balancing', setting out step-by-step ways to solve equations without
      modern symbols. His name gave us 'algorithm' and 'al-jabr' gave Europe the word 'algebra'. The book changed inheritance reckoning, trade and engineering in
      the Islamic world and beyond.
    ur: تقریباً 820 میں بغداد میں محمد بن موسیٰ خوارزمی نے «الجبر والمقابلہ» لکھی اور جدید علامتوں کے بغیر مساوات حل کرنے کا قدم بہ قدم طریقہ پیش کیا۔ اس کے نام سے
      «الگورتھم» اور «الجبر» سے یورپ میں algebra کا لفظ بنا۔ اس کتاب نے اسلامی دنیا اور اس سے آگے میراث، تجارت اور انجینئری کے حساب بدل دیا۔
  glossary:
  - term:
      ar: الخوارزمي
      en: al-Khwarizmi
      ur: خوارزمی
    gloss:
      ar: عالم بغداد الذي كتب الجبر
      en: the Baghdad scholar who wrote the algebra book
      ur: بغداد کا عالم جس نے الجبر کی کتاب لکھی
  - term:
      ar: الجبر والمقابلة
      en: restoration and balancing
      ur: الجبر والمقابلہ
    gloss:
      ar: طريقة إكمال الطرفين ومساواتهما
      en: the method of completing and balancing sides
      ur: طرفین کو مکمل اور برابر کرنے کا طریقہ
  - term:
      ar: الخوارزمية
      en: algorithm
      ur: الگورتھم
    gloss:
      ar: خطوات حل سميت باسم الخوارزمي
      en: solution steps named after al-Khwarizmi
      ur: حل کے قدم جو خوارزمی کے نام پر پڑے
  - term:
      ar: المعادلة
      en: the equation
      ur: مساوات
    gloss:
      ar: تساوي طرفين نحلّه خطوة بخطوة
      en: two sides equal, solved step by step
      ur: دو برابر طرف جو قدم بہ قدم حل ہوتے ہیں
  - term:
      ar: الحد المجهول
      en: the unknown term
      ur: نامعلوم جزو
    gloss:
      ar: العدد الذي نبحث عنه
      en: the number we solve for
      ur: وہ عدد جسے ہم ڈھونڈتے ہیں
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: مدينة بيت الحكمة حيث كتب
      en: the House of Wisdom city where he wrote
      ur: بیت الحکمت کا شہر جہاں اس نے لکھا
  - term:
      ar: الميراث
      en: inheritance
      ur: میراث
    gloss:
      ar: قسمة التركة التي استعمل الجبر فيها
      en: estate division where algebra was applied
      ur: ترکہ کی تقسیم جس میں الجبر استعمال ہوا
  - term:
      ar: الحساب
      en: reckoning
      ur: حساب
    gloss:
      ar: علم الأعداد والعمليات
      en: the science of numbers and operations
      ur: اعداد اور عمل کا علم
  - term:
      ar: المقابلة
      en: balancing
      ur: مقابلہ
    gloss:
      ar: حذف المتشابه من الطرفين
      en: cancelling like terms on both sides
      ur: دونوں طرف سے یکساں اجزا کاٹنا
  - term:
      ar: الكتاب المختصر
      en: the Compendious Book
      ur: مختصر کتاب
    gloss:
      ar: اسم كتابه الكامل في الحساب
      en: his book's full title on reckoning
      ur: حساب میں اس کی کتاب کا پورا نام
  - term:
      ar: الترجمة اللاتينية
      en: the Latin translation
      ur: لاطینی ترجمہ
    gloss:
      ar: نقل كتابه إلى لاتينية فانتشر في أوروبا
      en: his book rendered into Latin, spreading in Europe
      ur: اس کی کتاب لاطینی میں منتقل ہوئی اور یورپ میں پھیلی
  - term:
      ar: algebra
      en: algebra
      ur: algebra
    gloss:
      ar: الكلمة الأوروبية من «الجبر»
      en: the European word from 'al-jabr'
      ur: «الجبر» سے بنا یورپی لفظ
  practice:
  - q:
      ar: من وضع علم الجبر؟
      en: Who set down algebra?
      ur: الجبر کس نے قائم کیا؟
    options:
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: true
      why:
        ar: الخوارزمي كتب «الجبر والمقابلة»
        en: al-Khwarizmi wrote 'Restoration and Balancing'
        ur: خوارزمی نے الجبر والمقابلہ لکھی
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا طبيب فيلسوف لا جبر
        en: Ibn Sina was physician-philosopher, not algebra
        ur: ابن سینا طبیب فلسفی تھا، الجبر نہیں
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا عالم
        en: Ibn Battuta was a traveller, not a scholar
        ur: ابن بطوطہ مسافر تھا، عالم نہیں
    - text:
        ar: ابن رشد
        en: Ibn Rushd
        ur: ابن رشد
      correct: false
      why:
        ar: ابن رشد فيلسوف لا جبر
        en: Ibn Rushd was a philosopher, not algebra
        ur: ابن رشد فلسفی تھا، الجبر نہیں
  - q:
      ar: أين عمل الخوارزمي؟
      en: Where did al-Khwarizmi work?
      ur: خوارزمی کہاں کام کرتا تھا؟
    options:
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: true
      why:
        ar: في بيت الحكمة ببغداد
        en: at Baghdad's House of Wisdom
        ur: بغداد کے بیت الحکمت میں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة ليست مدينته
        en: Cairo was not his city
        ur: قاہرہ اس کا شہر نہیں
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: false
      why:
        ar: قرطبة في الغرب لا عمله
        en: Cordoba was far west of his work
        ur: قرطبہ اس کے کام سے دور مغرب تھی
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق ليست مدينته
        en: Damascus was not his city
        ur: دمشق اس کا شہر نہیں
  - q:
      ar: ما «الخوارزمية»؟
      en: What is an algorithm?
      ur: الگورتھم کیا ہے؟
    options:
    - text:
        ar: خطوات حل مرتبة
        en: ordered solution steps
        ur: مرتب حل کے قدم
      correct: true
      why:
        ar: خطوات الحل سميت باسم الخوارزمي
        en: solution steps named after al-Khwarizmi
        ur: حل کے قدم خوارزمی کے نام پر
    - text:
        ar: لغة برمجة
        en: a programming language
        ur: پروگرامنگ زبان
      correct: false
      why:
        ar: ليست لغة بل خطوات
        en: steps, not a language
        ur: زبان نہیں، قدم
    - text:
        ar: آلة حاسبة
        en: a machine
        ur: مشین
      correct: false
      why:
        ar: ليست آلة بل طريقة
        en: a method, not a machine
        ur: مشین نہیں، طریقہ
    - text:
        ar: قانون فيزياء
        en: a physics law
        ur: طبیعیات کا قانون
      correct: false
      why:
        ar: ليست قانونًا بل طريقة حل
        en: a solving method, not a physics law
        ur: طبیعیات کا قانون نہیں، حل کا طریقہ
  - q:
      ar: من أين جاءت كلمة algebra؟
      en: Where does 'algebra' come from?
      ur: algebra کہاں سے آیا؟
    options:
    - text:
        ar: من «الجبر» العربية
        en: from Arabic 'al-jabr'
        ur: عربی «الجبر» سے
      correct: true
      why:
        ar: من اسم كتاب الخوارزمي «الجبر»
        en: from al-Khwarizmi's book title 'al-jabr'
        ur: خوارزمی کی کتاب کے نام «الجبر» سے
    - text:
        ar: من اليونانية
        en: from Greek
        ur: یونانی سے
      correct: false
      why:
        ar: ليست يونانية بل عربية
        en: from Arabic, not Greek
        ur: یونانی نہیں، عربی سے
    - text:
        ar: من اللاتينية
        en: from Latin
        ur: لاطینی سے
      correct: false
      why:
        ar: ترجم إلى اللاتينية لا منها
        en: translated into Latin, not from it
        ur: لاطینی میں ترجمہ ہوا، اس سے نہیں
    - text:
        ar: من الفارسية
        en: from Persian
        ur: فارسی سے
      correct: false
      why:
        ar: ليست فارسية بل عربية
        en: from Arabic, not Persian
        ur: فارسی نہیں، عربی سے
  - q:
      ar: ما طريقة «المقابلة»؟
      en: What is 'balancing'?
      ur: «مقابلہ» کیا ہے؟
    options:
    - text:
        ar: حذف المتشابه من الطرفين
        en: cancelling like terms both sides
        ur: دونوں طرف یکساں اجزا کاٹنا
      correct: true
      why:
        ar: إسقاط الحدود المتشابهة لبسط المعادلة
        en: dropping like terms to simplify the equation
        ur: مساوات سادہ کرنے کے لیے یکساں اجزا گرانا
    - text:
        ar: جمع كل الأعداد
        en: adding all numbers
        ur: تمام اعداد جمع کرنا
      correct: false
      why:
        ar: ليست جمعًا بل حذفًا
        en: cancelling, not adding
        ur: جمع نہیں، کاٹنا
    - text:
        ar: ضرب الطرفين
        en: multiplying the sides
        ur: طرفوں کو ضرب دینا
      correct: false
      why:
        ar: ليست ضربًا بل حذفًا
        en: cancelling, not multiplying
        ur: ضرب نہیں، کاٹنا
    - text:
        ar: نقل الأرقام فقط
        en: moving numbers only
        ur: صرف اعداد منتقل کرنا
      correct: false
      why:
        ar: ليست نقلًا بل مساواة
        en: balancing, not moving
        ur: منتقلی نہیں، توازن
  - q:
      ar: في أيّ عمل استُعمل الجبر؟
      en: Where was algebra applied?
      ur: الجبر کہاں استعمال ہوا؟
    options:
    - text:
        ar: قسمة الميراث
        en: dividing inheritance
        ur: میراث کی تقسیم
      correct: true
      why:
        ar: استعمل في حساب التركات والتجارة
        en: applied to estates and trade
        ur: ترکوں اور تجارت میں استعمال ہوا
    - text:
        ar: رسم الخرائط فقط
        en: only map-drawing
        ur: صرف نقشہ سازی
      correct: false
      why:
        ar: ليست خرائط بل ميراث وتجارة
        en: not maps but inheritance and trade
        ur: نقشے نہیں، میراث اور تجارت
    - text:
        ar: بناء الجدران
        en: wall-building
        ur: دیوار سازی
      correct: false
      why:
        ar: ليست بناءً بل حسابًا
        en: reckoning, not building
        ur: تعمیر نہیں، حساب
    - text:
        ar: كتابة الشعر
        en: writing poetry
        ur: شاعری لکھنا
      correct: false
      why:
        ar: ليست شعرًا بل حسابًا
        en: reckoning, not poetry
        ur: شاعری نہیں، حساب
  - q:
      ar: متى كُتب الكتاب تقريبًا؟
      en: Roughly when was the book written?
      ur: کتاب تقریباً کب لکھی گئی؟
    options:
    - text:
        ar: نحو عام ٨٢٠
        en: about 820
        ur: تقریباً 820
      correct: true
      why:
        ar: كتبه في القرن التاسع نحو ٨٢٠
        en: he wrote it about 820 in the ninth century
        ur: اس نے نویں صدی میں تقریباً 820 میں لکھی
    - text:
        ar: عام ١٠٥٠
        en: in 1050
        ur: 1050 میں
      correct: false
      why:
        ar: ١٠٥٠ متأخر عن كتابه
        en: 1050 is later than his book
        ur: 1050 اس کی کتاب سے بعد ہے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة قبل كتابه
        en: 622 is the Hijra year, before his book
        ur: 622 ہجرت کا سال ہے، کتاب سے پہلے
    - text:
        ar: عام ١٢٠٠
        en: in 1200
        ur: 1200 میں
      correct: false
      why:
        ar: ١٢٠٠ متأخر بقرون
        en: 1200 is centuries later
        ur: 1200 صدیاں بعد ہے
  - q:
      ar: ما «الحد المجهول»؟
      en: What is the unknown term?
      ur: نامعلوم جزو کیا ہے؟
    options:
    - text:
        ar: العدد المطلوب إيجاده
        en: the number to find
        ur: وہ عدد جو ڈھونڈنا ہے
      correct: true
      why:
        ar: القيمة التي نحسبها بالجبر
        en: the value algebra solves for
        ur: وہ قدر جو الجبر حل کرتا ہے
    - text:
        ar: العدد الكبير
        en: the big number
        ur: بڑا عدد
      correct: false
      why:
        ar: ليس كبيرًا بل مجهولًا
        en: unknown, not big
        ur: بڑا نہیں، نامعلوم
    - text:
        ar: الصفر
        en: zero
        ur: صفر
      correct: false
      why:
        ar: ليس صفرًا بل مجهولًا
        en: an unknown, not zero
        ur: صفر نہیں، نامعلوم
    - text:
        ar: الجزء الكسري
        en: the fraction
        ur: کسر حصہ
      correct: false
      why:
        ar: ليس كسرًا بل قيمة مطلوبة
        en: an unknown value, not a fraction
        ur: کسر نہیں، مطلوب قدر
  - q:
      ar: كيف انتشر الجبر في أوروبا؟
      en: How did algebra reach Europe?
      ur: الجبر یورپ میں کیسے پہنچا؟
    options:
    - text:
        ar: بالترجمة اللاتينية
        en: through Latin translation
        ur: لاطینی ترجمہ سے
      correct: true
      why:
        ar: نقل الكتاب إلى اللاتينية فانتشر
        en: the book was rendered into Latin and spread
        ur: کتاب لاطینی میں منتقل ہوئی اور پھیلی
    - text:
        ar: بالحروب
        en: through wars
        ur: جنگوں سے
      correct: false
      why:
        ar: ليست حروبًا بل ترجمة
        en: translation, not wars
        ur: جنگ نہیں، ترجمہ
    - text:
        ar: بالتجارة فقط
        en: by trade alone
        ur: صرف تجارت سے
      correct: false
      why:
        ar: ليست تجارة بل ترجمة
        en: translation, not trade
        ur: تجارت نہیں، ترجمہ
    - text:
        ar: بالهجرة
        en: by migration
        ur: ہجرت سے
      correct: false
      why:
        ar: ليست هجرة بل ترجمة
        en: translation, not migration
        ur: ہجرت نہیں، ترجمہ
  - q:
      ar: لماذا يُعدّ الكتاب محوريًا؟
      en: Why is the book pivotal?
      ur: یہ کتاب محوری کیوں ہے؟
    options:
    - text:
        ar: لأنه أسّس علمًا جديدًا
        en: it founded a new science
        ur: اس نے نیا علم بنایا
      correct: true
      why:
        ar: جمع طريقة حل المعادلات وأسّس علمًا
        en: it systematised equation-solving as a science
        ur: اس نے مساوات کے حل کو علم بنایا
    - text:
        ar: لأطوله
        en: for its length
        ur: اس کی لمبائی کے لیے
      correct: false
      why:
        ar: ليست طوله بل طريقته
        en: not its length but its method
        ur: لمبائی نہیں، اس کا طریقہ
    - text:
        ar: لأوله أرقامًا
        en: for first numbers
        ur: پہلے اعداد کے لیے
      correct: false
      why:
        ar: ليست أول أرقام بل علم جديد
        en: not first numbers but a new science
        ur: پہلے اعداد نہیں، نیا علم
    - text:
        ar: لأقدم كتاب
        en: for the oldest book
        ur: قدیم ترین کتاب کے لیے
      correct: false
      why:
        ar: ليست أقدم بل مؤسسًا
        en: not oldest but founding
        ur: قدیم ترین نہیں، بانی
- id: astronomy
  anchor: concept/astronomy
  band: researchers
  title:
    ar: علم الفلك
    en: Astronomy
    ur: علم فلکیات
  sixty:
    ar: ازدهر علم الفلك في العالم الإسلامي من بغداد إلى مراغة وسمرقند. بنى العلماء مراصد لقياس مواقع النجوم وحركات الكواكب، وصنعوا أسطرلابات للملاحة والصلاة والوقت.
      وفي مرصد سمرقند قاس أولوغ بيك مواقع ألف نجم بدقة سبقت تيلكو براهي، وسمّى كثير من نجوم الليل بأسماء عربية ما زالت تُستعمل.
    en: Astronomy flourished in the Islamic world from Baghdad to Maragha and Samarkand. Scholars built observatories to fix the stars' places and the planets' motions,
      and made astrolabes for sailing, prayer and timekeeping. At Samarkand's observatory Ulugh Beg measured a thousand stars with an accuracy that preceded Tycho
      Brahe, and many night stars still carry Arabic names.
    ur: اسلامی دنیا میں بغداد سے مراغہ اور سمرقند تک فلکیات پھلی۔ علماء نے ستاروں کے مقام اور سیاروں کی حرکت ناپنے کے لیے رصد گاہیں بنائیں اور سفر، نماز اور وقت کے
      لیے اسطرلاب بنائے۔ سمرقند کی رصد گاہ میں الغ بیگ نے ہزار ستارے ایسے درست ناپے جو ٹائکو براہی سے پہلے کے ہیں اور آج بھی بہت سے رات کے ستارے عربی نام رکھتے ہیں۔
  glossary:
  - term:
      ar: المرصد
      en: the observatory
      ur: رصد گاہ
    gloss:
      ar: مبنى رصد النجوم وقياسها
      en: a building for watching and measuring stars
      ur: ستارے دیکھنے اور ناپنے کی عمارت
  - term:
      ar: الأسطرلاب
      en: the astrolabe
      ur: اسطرلاب
    gloss:
      ar: أداة قياس النجوم والوقت والاتجاه
      en: a tool measuring stars, time and direction
      ur: ستارے، وقت اور سمت ناپنے کا آلہ
  - term:
      ar: أولوغ بيك
      en: Ulugh Beg
      ur: الغ بیگ
    gloss:
      ar: السلطان العالم بفلك سمرقند
      en: the scholar-sultan of Samarkand's observatory
      ur: سمرقند کی رصد گاہ کا عالم سلطان
  - term:
      ar: مراغة
      en: Maragha
      ur: مراغہ
    gloss:
      ar: مدينة المرصد المشهور في إيران
      en: the Iranian city of the famed observatory
      ur: ایران کے مشہور رصد گاہ کا شہر
  - term:
      ar: الزيج
      en: the zij (star tables)
      ur: زیج
    gloss:
      ar: جداول حساب مواقع النجوم
      en: tables reckoning the stars' places
      ur: ستاروں کے مقام کے جدول
  - term:
      ar: البتانوسي
      en: al-Battani
      ur: بتانی
    gloss:
      ar: فلكي قاس السنة بدقة
      en: the astronomer who measured the year precisely
      ur: وہ فلکیات دان جس نے سال درست ناپا
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: الاتجاه الذي ساعد الفلك في إيجاده
      en: the direction astronomy helped to fix
      ur: وہ سمت جسے فلکیات نے ٹھیک کرنے میں مدد کی
  - term:
      ar: النجوم العربية
      en: Arabic star names
      ur: عربی ناموں والے ستارے
    gloss:
      ar: أسماء مثل الدبران والجدي بقيت في الخرائط
      en: names like Aldebaran and Deneb still on charts
      ur: الدیبران اور ذنب جیسے نام آج بھی نقشوں پر
  - term:
      ar: الطوسي
      en: al-Tusi
      ur: طوسی
    gloss:
      ar: عالم مرصد مراغة المشهور
      en: the famed scholar of Maragha's observatory
      ur: مراغہ کی رصد گاہ کا مشہور عالم
  - term:
      ar: حركة الكواكب
      en: planetary motion
      ur: سیاروں کی حرکت
    gloss:
      ar: مسارات الأجرام التي قاسها الفلكيون
      en: the bodies' paths the astronomers measured
      ur: وہ راستے جو فلکیات دانوں نے ناپے
  - term:
      ar: التقويم
      en: calendar reckoning
      ur: تقویم
    gloss:
      ar: حساب الوقت بالنجوم
      en: reckoning time by the stars
      ur: ستاروں سے وقت کا حساب
  - term:
      ar: الملاحة
      en: navigation
      ur: سمندری رہنمائی
    gloss:
      ar: سير السفن بالنجوم
      en: sailing ships by the stars
      ur: ستاروں سے جہاز چلانا
  practice:
  - q:
      ar: ما المرصد؟
      en: What is an observatory?
      ur: رصد گاہ کیا ہے؟
    options:
    - text:
        ar: مبنى رصد النجوم
        en: a star-watching building
        ur: ستارے دیکھنے کی عمارت
      correct: true
      why:
        ar: مبنى لقياس مواقع النجوم وحركاتها
        en: a building for measuring stars' places and motions
        ur: ستاروں کے مقام اور حرکت ناپنے کی عمارت
    - text:
        ar: مسجد كبير
        en: a big mosque
        ur: بڑی مسجد
      correct: false
      why:
        ar: ليست مسجدًا بل مكان قياس
        en: a measuring station, not a mosque
        ur: مسجد نہیں، ناپنے کی جگہ
    - text:
        ar: قلعة حرب
        en: a war fortress
        ur: جنگی قلعہ
      correct: false
      why:
        ar: ليست قلعة بل مرصد
        en: an observatory, not a fortress
        ur: قلعہ نہیں، رصد گاہ
    - text:
        ar: مدرسة دينية
        en: a religious school
        ur: دینی مدرسہ
      correct: false
      why:
        ar: ليست مدرسة بل مرصد
        en: an observatory, not a school
        ur: مدرسہ نہیں، رصد گاہ
  - q:
      ar: ما الأسطرلاب؟
      en: What is an astrolabe?
      ur: اسطرلاب کیا ہے؟
    options:
    - text:
        ar: أداة قياس النجوم والوقت
        en: a tool for stars and time
        ur: ستاروں اور وقت کا آلہ
      correct: true
      why:
        ar: أداة قياس الملاحة والصلاة والوقت
        en: a tool for sailing, prayer and time
        ur: سفر، نماز اور وقت کا آلہ
    - text:
        ar: بوصلة مغناطيسية
        en: a magnetic compass
        ur: مقناطیسی قطب نما
      correct: false
      why:
        ar: ليست بوصلة بل أسطرلاب
        en: an astrolabe, not a compass
        ur: قطب نما نہیں، اسطرلاب
    - text:
        ar: ساعة رملية
        en: an hourglass
        ur: ریت گھڑی
      correct: false
      why:
        ar: ليست ساعة رملية
        en: not an hourglass
        ur: ریت گھڑی نہیں
    - text:
        ar: تلسكوب
        en: a telescope
        ur: دوربین
      correct: false
      why:
        ar: قبل التلسكوب بقرون
        en: centuries before the telescope
        ur: دوربین سے صدیاں پہلے
  - q:
      ar: من سلطان سمرقند العالم؟
      en: Which scholar-sultan was of Samarkand?
      ur: سمرقند کا عالم سلطان کون تھا؟
    options:
    - text:
        ar: أولوغ بيك
        en: Ulugh Beg
        ur: الغ بیگ
      correct: true
      why:
        ar: أولوغ بيك بنا مرصد سمرقند
        en: Ulugh Beg built Samarkand's observatory
        ur: الغ بیگ نے سمرقند کی رصد گاہ بنائی
    - text:
        ar: تيمورلنك
        en: Timur
        ur: تیمور
      correct: false
      why:
        ar: تيمور جدّه لا العالم
        en: Timur was his grandfather, not the scholar
        ur: تیمور اس کا دادا تھا، عالم نہیں
    - text:
        ar: بابر
        en: Babur
        ur: بابر
      correct: false
      why:
        ar: بابر في الهند لا سمرقند
        en: Babur ruled India, not Samarkand
        ur: بابر ہند میں تھا، سمرقند نہیں
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: هولاكو مغولي مدمر
        en: Hulagu was a Mongol destroyer
        ur: ہلاکو منگول تباہ کرنے والا تھا
  - q:
      ar: ما «الزيج»؟
      en: What is a zij?
      ur: زیج کیا ہے؟
    options:
    - text:
        ar: جداول مواقع النجوم
        en: star-position tables
        ur: ستاروں کے مقام کے جدول
      correct: true
      why:
        ar: جداول حساب الفلك
        en: the astronomers' reckoning tables
        ur: فلکیات کے حسابی جدول
    - text:
        ar: كتاب شعر
        en: a poetry book
        ur: شاعری کی کتاب
      correct: false
      why:
        ar: ليست شعرًا بل جداول
        en: tables, not poetry
        ur: شاعری نہیں، جدول
    - text:
        ar: قبة رصد
        en: a watch dome
        ur: رصد گنبد
      correct: false
      why:
        ar: ليست قبة بل جداول
        en: tables, not a dome
        ur: گنبد نہیں، جدول
    - text:
        ar: سيف تركي
        en: a Turkish sword
        ur: ترک تلوار
      correct: false
      why:
        ar: ليست سلاحًا بل جداول
        en: tables, not a weapon
        ur: ہتھیار نہیں، جدول
  - q:
      ar: كم نجمًا قاس أولوغ بيك؟
      en: How many stars did Ulugh Beg measure?
      ur: الغ بیگ نے کتنے ستارے ناپے؟
    options:
    - text:
        ar: نحو ألف
        en: about a thousand
        ur: تقریباً ہزار
      correct: true
      why:
        ar: قاس نحو ألف نجم بدقة
        en: he measured about a thousand stars precisely
        ur: اس نے تقریباً ہزار ستارے درست ناپے
    - text:
        ar: مئة
        en: a hundred
        ur: سو
      correct: false
      why:
        ar: مئة أقل من جدوله
        en: a hundred is fewer than his table
        ur: سو اس کے جدول سے کم ہے
    - text:
        ar: عشرة آلاف
        en: ten thousand
        ur: دس ہزار
      correct: false
      why:
        ar: عشرة آلاف أكثر من جدوله
        en: ten thousand exceeds his table
        ur: دس ہزار اس کے جدول سے زیادہ ہے
    - text:
        ar: مليون
        en: a million
        ur: دس لاکھ
      correct: false
      why:
        ar: مليون أكثر بكثير
        en: a million is far more
        ur: دس لاکھ بہت زیادہ ہے
  - q:
      ar: لأيّ شيء استُعمل الفلك؟
      en: What was astronomy used for?
      ur: فلکیات کس کام آئی؟
    options:
    - text:
        ar: الملاحة والقبلة والوقت
        en: sailing, qibla and time
        ur: سفر، قبلہ اور وقت
      correct: true
      why:
        ar: ساعدت الملاحة واتجاه الصلاة وحساب الوقت
        en: it helped sailing, prayer direction and time
        ur: اس نے سفر، نماز کی سمت اور وقت میں مدد کی
    - text:
        ar: بناء القصور
        en: building palaces
        ur: محل بنانا
      correct: false
      why:
        ar: ليست بناءً بل نجومًا
        en: stars, not building
        ur: تعمیر نہیں، ستارے
    - text:
        ar: صناعة السلاح
        en: weapon-making
        ur: ہتھیار سازی
      correct: false
      why:
        ar: ليست سلاحًا بل قياسًا
        en: measuring, not weapons
        ur: ہتھیار نہیں، پیمائش
    - text:
        ar: كتابة التاريخ
        en: writing history
        ur: تاریخ لکھنا
      correct: false
      why:
        ar: ليست تاريخًا بل فلكًا
        en: astronomy, not history
        ur: تاریخ نہیں، فلکیات
  - q:
      ar: أين كان مرصد مراغة؟
      en: Where was Maragha's observatory?
      ur: مراغہ کی رصد گاہ کہاں تھی؟
    options:
    - text:
        ar: في إيران
        en: in Iran
        ur: ایران میں
      correct: true
      why:
        ar: في مراغة بشمال إيران
        en: at Maragha in northern Iran
        ur: شمالی ایران کے مراغہ میں
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: ليست في مصر بل إيران
        en: in Iran, not Egypt
        ur: مصر میں نہیں، ایران میں
    - text:
        ar: في الأندلس
        en: in al-Andalus
        ur: الاندلس میں
      correct: false
      why:
        ar: ليست في الأندلس
        en: not in al-Andalus
        ur: الاندلس میں نہیں
    - text:
        ar: في الهند
        en: in India
        ur: ہند میں
      correct: false
      why:
        ar: ليست في الهند بل إيران
        en: in Iran, not India
        ur: ہند میں نہیں، ایران میں
  - q:
      ar: ما أسماء نجوم بقيت؟
      en: Which star names survive?
      ur: کون سے ستاروں کے نام باقی ہیں؟
    options:
    - text:
        ar: عربية كالدبران
        en: Arabic like Aldebaran
        ur: الدیبران جیسے عربی
      correct: true
      why:
        ar: كثير من النجوم تحمل أسماء عربية
        en: many stars still carry Arabic names
        ur: بہت سے ستارے آج بھی عربی نام رکھتے ہیں
    - text:
        ar: رومانية فقط
        en: only Roman
        ur: صرف رومن
      correct: false
      why:
        ar: ليست رومانية فقط بل عربية
        en: Arabic too, not only Roman
        ur: صرف رومن نہیں، عربی بھی
    - text:
        ar: صينية فقط
        en: only Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: ليست صينية بل عربية كثيرة
        en: many Arabic, not Chinese
        ur: چینی نہیں، بہت عربی
    - text:
        ar: لا أسماء بقيت
        en: none survive
        ur: کوئی باقی نہیں
      correct: false
      why:
        ar: بقيت كثير من الأسماء العربية
        en: many Arabic names survive
        ur: بہت سے عربی نام باقی ہیں
  - q:
      ar: من عالم مرصد مراغة؟
      en: Who was Maragha's famed astronomer?
      ur: مراغہ کا مشہور فلکیات دان کون تھا؟
    options:
    - text:
        ar: الطوسي
        en: al-Tusi
        ur: طوسی
      correct: true
      why:
        ar: نصير الدين الطوسي عالم مراغة
        en: Nasir al-Din al-Tusi of Maragha
        ur: نصیرالدین طوسی مراغہ کا
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: false
      why:
        ar: الخوارزمي في بغداد لا مراغة
        en: al-Khwarizmi was in Baghdad
        ur: خوارزمی بغداد میں تھا
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا طبيب لا عالم مراغة
        en: Ibn Sina was a physician, not Maragha's man
        ur: ابن سینا طبیب تھا، مراغہ کا نہیں
    - text:
        ar: الفارابي
        en: al-Farabi
        ur: فارابی
      correct: false
      why:
        ar: الفارابي فيلسوف لا مراغة
        en: al-Farabi was a philosopher, not Maragha's
        ur: فارابی فلسفی تھا، مراغہ کا نہیں
  - q:
      ar: لماذا ازدهر علم الفلك؟
      en: Why did astronomy flourish?
      ur: فلکیات کیوں پھلی؟
    options:
    - text:
        ar: للحاجة إلى القبلة والوقت والملاحة
        en: for qibla, time and sailing needs
        ur: قبلہ، وقت اور سفر کی ضرورت سے
      correct: true
      why:
        ar: خدمة العبادة والتجارة والسفر دفعت العلم
        en: worship, trade and travel needs drove the science
        ur: عبادت، تجارت اور سفر کی ضرورت نے علم کو چلایا
    - text:
        ar: للحروب فقط
        en: for wars only
        ur: صرف جنگوں کے لیے
      correct: false
      why:
        ar: ليست حروبًا بل عبادة وسفر
        en: worship and travel, not wars
        ur: جنگ نہیں، عبادت اور سفر
    - text:
        ar: للزينة
        en: for decoration
        ur: زینت کے لیے
      correct: false
      why:
        ar: ليست زينة بل علم عملي
        en: a practical science, not decoration
        ur: زینت نہیں، عملی علم
    - text:
        ar: للتسلية
        en: for amusement
        ur: تفریح کے لیے
      correct: false
      why:
        ar: ليست تسلية بل حاجة
        en: a need, not amusement
        ur: تفریح نہیں، ضرورت
- id: islamic-calligraphy
  anchor: concept/islamic-calligraphy
  band: researchers
  title:
    ar: الخط العربي
    en: Islamic calligraphy
    ur: اسلامی خطاطی
  sixty:
    ar: صار الخط العربي أعلى الفنون الإسلامية لأنه يجمع الجمال والكتابة المقدسة في مكان لا تقبل فيه الصورة. تطورت أساليبه — الكوفي الزاوي في المخطوطات الأولى، والنسخ
      للنسخ اليومي، والثلث المهيب للعمائر والمصاحف. وفي تركيا بلغ الخط ذروته في لوحات المساجد الكبرى. ومن أشهر الخطاطين ياقوت المستعصمي وابن مقلة الذي قنّن الحروف.
    en: Arabic calligraphy became the highest Islamic art because it joins beauty and sacred writing where image is not admitted. Its styles evolved — angular Kufic
      in early manuscripts, Naskh for everyday copying, and majestic Thuluth for monuments and Qur'ans. In Turkey it peaked in the great mosques' panels. Its most
      famed calligraphers are Yaqut al-Musta'simi and Ibn Muqla, who systematised the letters.
    ur: عربی خطاطی اعلیٰ ترین اسلامی فن بنی کیونکہ وہ خوبصورتی اور مقدس تحریر کو وہاں جمع کرتی ہے جہاں تصویر جگہ نہیں رکھتی۔ اس کے اسلوب ارتقا پزیر ہوئے — ابتدائی
      مخطوطات میں کونا دار کوفی، روزمرہ نقل کے لیے نسخ اور یادگاروں اور مصحفوں کے لیے شاندار ثلث۔ ترکی میں یہ بڑی مسجدوں کے لوحوں میں اپنے عروج پر پہنچی۔ اس کے مشہور
      خطاط یاقوت مستعصمی اور ابن مقلہ ہیں جنھوں نے حروف کو قاعدہ دیا۔
  glossary:
  - term:
      ar: الكوفي
      en: Kufic
      ur: کوفی
    gloss:
      ar: أسلوب زاوي قديم في المخطوطات
      en: an old angular style in early manuscripts
      ur: ابتدائی مخطوطات کا پرانا کونا دار اسلوب
  - term:
      ar: النسخ
      en: Naskh
      ur: نسخ
    gloss:
      ar: أسلوب دائري للنسخ اليومي
      en: a rounded style for everyday copying
      ur: روزمرہ نقل کا گول اسلوب
  - term:
      ar: الثلث
      en: Thuluth
      ur: ثلث
    gloss:
      ar: أسلوب مهيب للعناوين والعمائر
      en: a majestic style for titles and monuments
      ur: عنوانوں اور یادگاروں کا شاندار اسلوب
  - term:
      ar: ابن مقلة
      en: Ibn Muqla
      ur: ابن مقلہ
    gloss:
      ar: من قنّن قياس الحروف
      en: who systematised letter measurement
      ur: جس نے حروف کی پیمائش کا قاعدہ دیا
  - term:
      ar: ياقوت المستعصمي
      en: Yaqut al-Musta'simi
      ur: یاقوت مستعصمی
    gloss:
      ar: خطاط بغداد المشهور الأخير
      en: the last famed calligrapher of Abbasid Baghdad
      ur: عباسی بغداد کا آخری مشہور خطاط
  - term:
      ar: الخطاط
      en: the calligrapher
      ur: خطاط
    gloss:
      ar: فنان الخط
      en: the calligraphy artist
      ur: خطاطی کا فنکار
  - term:
      ar: المصحف
      en: the mushaf
      ur: مصحف
    gloss:
      ar: نسخة القرآن التي زخرفها الخط
      en: the Qur'an copy adorned by calligraphy
      ur: وہ نسخہ جسے خطاطی سنوارتی ہے
  - term:
      ar: اللوحة
      en: the panel
      ur: لوح
    gloss:
      ar: لوح خط معلق في المساجد
      en: a calligraphy board hung in mosques
      ur: مسجدوں میں لٹکا خطاطی لوح
  - term:
      ar: الديواني
      en: Diwani
      ur: دیوانی
    gloss:
      ar: أسلوب منحنى للدواوين العثمانية
      en: a curved style for Ottoman decrees
      ur: عثمانی فرمانوں کا خم دار اسلوب
  - term:
      ar: التذهيب
      en: illumination
      ur: تلائیہ
    gloss:
      ar: زخرفة الذهب حول النص
      en: gold ornament around the text
      ur: متن کے گرد سنہری زینت
  - term:
      ar: الحبر
      en: the ink
      ur: سیاہی
    gloss:
      ar: مداد الخطاط الأسود
      en: the calligrapher's black ink
      ur: خطاط کی کالی سیاہی
  - term:
      ar: القلم
      en: the reed pen
      ur: قلم
    gloss:
      ar: أداة الخطاط من القصب
      en: the calligrapher's reed tool
      ur: خطاط کا سرکنڈے کا آلہ
  practice:
  - q:
      ar: لماذا ارتفع الخط في الفن الإسلامي؟
      en: Why did calligraphy rise highest in Islamic art?
      ur: خطاطی اسلامی فن میں اعلیٰ کیوں بنی؟
    options:
    - text:
        ar: لجمعه الجمال والكتابة المقدسة
        en: it joins beauty and sacred writing
        ur: خوبصورتی اور مقدس تحریر کا اجتماع
      correct: true
      why:
        ar: يجمع الجمال والكتابة حيث لا صورة
        en: it joins beauty and writing where image is absent
        ur: خوبصورتی اور تحریر جمع جہاں تصویر نہیں
    - text:
        ar: لرسمه الوجوه
        en: for drawing faces
        ur: چہرے بنانے کے لیے
      correct: false
      why:
        ar: ليس لوجوه بل لحروف
        en: for letters, not faces
        ur: چہروں کے لیے نہیں، حروف کے لیے
    - text:
        ar: لأرخص فن
        en: for being cheapest art
        ur: سستے فن کے لیے
      correct: false
      why:
        ar: ليس لرخصة بل لجماله
        en: for its beauty, not cheapness
        ur: سستے ہونے کے لیے نہیں، خوبصورتی کے لیے
    - text:
        ar: لسهولته
        en: for its ease
        ur: آسانی کے لیے
      correct: false
      why:
        ar: ليس لسهولة بل لقدسية وجمال
        en: for sacred beauty, not ease
        ur: آسانی کے لیے نہیں، تقدس اور حسن کے لیے
  - q:
      ar: ما أسلوب المخطوطات الأولى؟
      en: The early manuscripts' style?
      ur: ابتدائی مخطوطات کا اسلوب؟
    options:
    - text:
        ar: الكوفي الزاوي
        en: angular Kufic
        ur: کونا دار کوفی
      correct: true
      why:
        ar: الكوفي أسلوب المخطوطات الأولى
        en: Kufic is the early manuscripts' style
        ur: کوفی ابتدائی مخطوطات کا اسلوب ہے
    - text:
        ar: الديواني
        en: Diwani
        ur: دیوانی
      correct: false
      why:
        ar: الديواني عثماني متأخر
        en: Diwani is a later Ottoman style
        ur: دیوانی بعد کا عثمانی اسلوب ہے
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: false
      why:
        ar: النسخ لليومي لا الأول
        en: Naskh is the everyday, not earliest
        ur: نسخ روزمرہ ہے، اولین نہیں
    - text:
        ar: الرقعة
        en: Ruqa
        ur: رقعہ
      correct: false
      why:
        ar: الرقعة أسلوب سريع متأخر
        en: Ruqa is a later quick style
        ur: رقعہ بعد کا تیز اسلوب ہے
  - q:
      ar: ما أسلوب النسخ اليومي؟
      en: The everyday copying style?
      ur: روزمرہ نقل کا اسلوب؟
    options:
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: true
      why:
        ar: النسخ للنسخ اليومي والكتب
        en: Naskh is for daily copying and books
        ur: نسخ روزمرہ نقل اور کتابوں کے لیے
    - text:
        ar: الثلث
        en: Thuluth
        ur: ثلث
      correct: false
      why:
        ar: الثلث للعناوين لا اليومي
        en: Thuluth is for titles, not daily
        ur: ثلث عنوانوں کے لیے، روزمرہ نہیں
    - text:
        ar: الكوفي
        en: Kufic
        ur: کوفی
      correct: false
      why:
        ar: الكوفي للمخطوطات الأولى
        en: Kufic is the early manuscripts'
        ur: کوفی ابتدائی مخطوطات کا ہے
    - text:
        ar: الديواني
        en: Diwani
        ur: دیوانی
      correct: false
      why:
        ar: الديواني للدواوين لا اليومي
        en: Diwani is for decrees, not daily
        ur: دیوانی فرمانوں کا ہے، روزمرہ نہیں
  - q:
      ar: ما أسلوب العناوين المهيبة؟
      en: The majestic monumental style?
      ur: شاندار یادگاری اسلوب؟
    options:
    - text:
        ar: الثلث
        en: Thuluth
        ur: ثلث
      correct: true
      why:
        ar: الثلث للعمائر والمصاحف
        en: Thuluth for monuments and Qur'ans
        ur: ثلث یادگاروں اور مصحفوں کے لیے
    - text:
        ar: النسخ
        en: Naskh
        ur: نسخ
      correct: false
      why:
        ar: النسخ لليومي لا المهيب
        en: Naskh is for daily, not majestic
        ur: نسخ روزمرہ کا ہے، شاندار نہیں
    - text:
        ar: الرقعة
        en: Ruqa
        ur: رقعہ
      correct: false
      why:
        ar: الرقعة للسرعة لا المهيب
        en: Ruqa is for speed, not majesty
        ur: رقعہ تیز رفتاری کا ہے، شان نہیں
    - text:
        ar: الفارسي
        en: Nasta'liq
        ur: نستعلیق
      correct: false
      why:
        ar: الفارسي للشعر لا المهيب
        en: Nasta'liq is for poetry, not monuments
        ur: نستعلیق شاعری کا ہے، یادگار نہیں
  - q:
      ar: من قنّن قياس الحروف؟
      en: Who systematised the letters?
      ur: حروف کا قاعدہ کس نے بنایا؟
    options:
    - text:
        ar: ابن مقلة
        en: Ibn Muqla
        ur: ابن مقلہ
      correct: true
      why:
        ar: ابن مقلة قنّن قياس الحروف
        en: Ibn Muqla systematised letter measure
        ur: ابن مقلہ نے حروف کی پیمائش کی
    - text:
        ar: ياقوت
        en: Yaqut
        ur: یاقوت
      correct: false
      why:
        ar: ياقوت خطاط بعده
        en: Yaqut was a later calligrapher
        ur: یاقوت بعد کا خطاط تھا
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: false
      why:
        ar: الخوارزمي عالم جبر لا خط
        en: al-Khwarizmi was of algebra, not script
        ur: خوارزمی الجبر کا تھا، خط نہیں
    - text:
        ar: الزهراوي
        en: al-Zahrawi
        ur: زہراوی
      correct: false
      why:
        ar: الزهراوي طبيب لا خطاط
        en: al-Zahrawi was a physician
        ur: زہراوی طبیب تھا
  - q:
      ar: من أشهر خطاطي بغداد؟
      en: The most famed Baghdad calligrapher?
      ur: بغداد کا مشہور ترین خطاط؟
    options:
    - text:
        ar: ياقوت المستعصمي
        en: Yaqut al-Musta'simi
        ur: یاقوت مستعصمی
      correct: true
      why:
        ar: ياقوت أعظم خطاطي بغداد العباسية
        en: Yaqut was Abbasid Baghdad's greatest
        ur: یاقوت عباسی بغداد کا سب سے بڑا تھا
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون مؤرخ لا خطاط
        en: Ibn Khaldun was a historian
        ur: ابن خلدون مؤرخ تھا
    - text:
        ar: الجاحظ
        en: al-Jahiz
        ur: جاحظ
      correct: false
      why:
        ar: الجاحظ أديب لا خطاط
        en: al-Jahiz was a writer, not calligrapher
        ur: جاحظ ادیب تھا، خطاط نہیں
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا خطاط
        en: Ibn Battuta was a traveller
        ur: ابن بطوطہ مسافر تھا
  - q:
      ar: ما «التذهيب»؟
      en: What is illumination?
      ur: تلائیہ کیا ہے؟
    options:
    - text:
        ar: زخرفة الذهب حول النص
        en: gold ornament round the text
        ur: متن کے گرد سنہری زینت
      correct: true
      why:
        ar: ذهب يزخرف هوامش المخطوط
        en: gold ornamenting the manuscript's margins
        ur: مخطوط کے حاشیے کو سنہرا بنانا
    - text:
        ar: كتابة بالحبر الأسود
        en: black-ink writing
        ur: کالی سیاہی کی تحریر
      correct: false
      why:
        ar: ليست حبرًا بل ذهب
        en: gold, not black ink
        ur: سیاہی نہیں، سونا
    - text:
        ar: طباعة الكتب
        en: printing books
        ur: کتاب چھاپنا
      correct: false
      why:
        ar: ليست طباعة بل زخرفة
        en: ornament, not printing
        ur: چھپائی نہیں، زینت
    - text:
        ar: تجليد المخطوط
        en: binding the codex
        ur: مخطوط جلد کرنا
      correct: false
      why:
        ar: ليست تجليدًا بل تذهيب
        en: illumination, not binding
        ur: جلد نہیں، تلائیہ
  - q:
      ar: ما أداة الخطاط؟
      en: The calligrapher's tool?
      ur: خطاط کا آلہ؟
    options:
    - text:
        ar: القلم القصبي
        en: the reed pen
        ur: سرکنڈے کا قلم
      correct: true
      why:
        ar: القلم من قصب مقطوع مائل
        en: a reed pen cut at a slant
        ur: ترچھا کاٹا سرکنڈے کا قلم
    - text:
        ar: فرشاة رسم
        en: a paint brush
        ur: رنگ برش
      correct: false
      why:
        ar: ليست فرشاة رسم بل قلم
        en: a reed pen, not a paint brush
        ur: رنگ برش نہیں، قلم
    - text:
        ar: ريشة طائر
        en: a feather quill
        ur: پر کی قلم
      correct: false
      why:
        ar: ليست ريشة بل قصب
        en: a reed, not a feather
        ur: پر نہیں، سرکنڈا
    - text:
        ar: قلم حديث
        en: a modern pen
        ur: جدید قلم
      correct: false
      why:
        ar: ليست حديثًا بل قصبًا
        en: a reed pen, not modern
        ur: جدید نہیں، سرکنڈا
  - q:
      ar: أين بلغ الخط ذروته؟
      en: Where did calligraphy peak?
      ur: خطاطی کہاں عروج پر پہنچی؟
    options:
    - text:
        ar: في مساجد تركيا
        en: in Turkey's mosques
        ur: ترکی کی مسجدوں میں
      correct: true
      why:
        ar: بلغت الذروة في لوحات المساجد العثمانية
        en: it peaked in Ottoman mosque panels
        ur: یہ عثمانی مسجدوں کے لوحوں میں عروج پر پہنچی
    - text:
        ar: في قصور أوروبا
        en: in Europe's palaces
        ur: یورپ کے محلوں میں
      correct: false
      why:
        ar: ليست في قصور بل مساجد
        en: in mosques, not palaces
        ur: محلوں میں نہیں، مسجدوں میں
    - text:
        ar: في مخطوطات الصين
        en: in China's codices
        ur: چین کے مخطوطات میں
      correct: false
      why:
        ar: ليست في الصين بل تركيا
        en: in Turkey, not China
        ur: چین میں نہیں، ترکی میں
    - text:
        ar: في كهوف إفريقيا
        en: in Africa's caves
        ur: افریقہ کی غاروں میں
      correct: false
      why:
        ar: ليست في كهوف بل مساجد
        en: in mosques, not caves
        ur: غاروں میں نہیں، مسجدوں میں
  - q:
      ar: ما «اللوحة» في الخط؟
      en: What is a calligraphy 'panel'?
      ur: خطاطی میں «لوح» کیا ہے؟
    options:
    - text:
        ar: لوح خط معلق
        en: a hung calligraphy board
        ur: لٹکا ہوا خطاطی لوح
      correct: true
      why:
        ar: أعمال خطية كبيرة تعلق في المساجد
        en: large calligraphy works hung in mosques
        ur: بڑی خطاطی کام جو مسجدوں میں لٹکتے ہیں
    - text:
        ar: باب خشبي
        en: a wooden door
        ur: لکڑی کا دروازہ
      correct: false
      why:
        ar: ليست بابًا بل لوحًا
        en: a panel, not a door
        ur: دروازہ نہیں، لوح
    - text:
        ar: نافذة زجاج
        en: a glass window
        ur: شیشے کی کھڑکی
      correct: false
      why:
        ar: ليست نافذة بل لوحًا
        en: a panel, not a window
        ur: کھڑکی نہیں، لوح
    - text:
        ar: سجادة صلاة
        en: a prayer rug
        ur: جائے نماز
      correct: false
      why:
        ar: ليست سجادة بل لوحًا
        en: a panel, not a rug
        ur: جائے نماز نہیں، لوح
- id: sawm-ramadan
  anchor: practice/sawm-ramadan
  band: scholars
  title:
    ar: صوم رمضان
    en: Fasting Ramadan
    ur: رمضان کے روزے
  sixty:
    ar: رمضان الشهر التاسع الذي يصوم فيه المسلمون من الفجر إلى الغروب. الصوم امتناع عن الطعام والشراب نهارًا، تزكية للنفس وتقوية للإرادة وذكرى لنزول القرآن. يبدأ
      الشهر برؤية الهلال ويختم بعيد الفطر، وفيه ليالي العشر الأخيرة ليلة القدر. ويُعفى المرضى والمسافرون والصغار.
    en: Ramadan, the ninth month, is when Muslims fast from dawn to sunset. Fasting is abstaining from food and drink by day — a cleansing of the soul, a strengthening
      of will, and a remembrance of the Qur'an's descent. The month begins at the crescent's sighting and closes with Eid al-Fitr; its last ten nights hold the Night
      of Power. The sick, travellers and the young are excused.
    ur: رمضان نواں مہینہ ہے جس میں مسلمان طلوع فجر سے غروب تک روزہ رکھتے ہیں۔ روزہ دن میں کھانے پینے سے پرہیز ہے — نفس کی پاکیزگی، عزم کی مضبوطی اور قرآن کے نزول
      کی یاد۔ مہینہ ہلال کی رؤیت سے شروع اور عید الفطر سے ختم ہوتا ہے اور آخری دس راتوں میں لیلۃ القدر آتی ہے۔ بیمار، مسافر اور بچے معذور ہیں۔
  glossary:
  - term:
      ar: الصوم
      en: fasting
      ur: روزہ
    gloss:
      ar: الامتناع عن الطعام والشراب نهارًا
      en: abstaining from food and drink by day
      ur: دن میں کھانے پینے سے پرہیز
  - term:
      ar: السحور
      en: suhoor
      ur: سحری
    gloss:
      ar: وجبة الفجر قبل الصوم
      en: the pre-dawn meal before fasting
      ur: طلوع فجر سے پہلے کا کھانا
  - term:
      ar: الإفطار
      en: iftar
      ur: افطار
    gloss:
      ar: وجبة الغروب لفتح الصوم
      en: the sunset meal breaking the fast
      ur: روزہ کھولنے کا غروب کا کھانا
  - term:
      ar: الهلال
      en: the crescent
      ur: ہلال
    gloss:
      ar: القمر الجديد الذي يبدأ به الشهر
      en: the new moon starting the month
      ur: نیا چاند جس سے مہینہ شروع ہوتا ہے
  - term:
      ar: ليلة القدر
      en: the Night of Power
      ur: لیلۃ القدر
    gloss:
      ar: ليلة في العشر الأخيرة ذكّر بنزول القرآن
      en: a last-ten night recalling the Qur'an's descent
      ur: آخری دس کی رات جو قرآن کے نزول کی یاد ہے
  - term:
      ar: عيد الفطر
      en: Eid al-Fitr
      ur: عید الفطر
    gloss:
      ar: عيد نهاية الشهر
      en: the feast ending the month
      ur: مہینے کے اختتام کی عید
  - term:
      ar: التراويح
      en: taraweeh
      ur: تراویح
    gloss:
      ar: صلاة الليل الجامعة في رمضان
      en: the communal night prayer of Ramadan
      ur: رمضان کی باجماعت رات کی نماز
  - term:
      ar: المعذورون
      en: the excused
      ur: معذور
    gloss:
      ar: المرضى والمسافرون والصغار المُعفون
      en: the sick, travellers and young exempted
      ur: بیمار، مسافر اور بچے جو معذور ہیں
  - term:
      ar: نزول القرآن
      en: the Qur'an's descent
      ur: قرآن کا نزول
    gloss:
      ar: الذكرى التي يحييها رمضان
      en: the remembrance Ramadan marks
      ur: وہ یاد جو رمضان زندہ رکھتا ہے
  - term:
      ar: التقوى
      en: taqwa (God-consciousness)
      ur: تقویٰ
    gloss:
      ar: غاية الصوم الروحية
      en: the fast's spiritual goal
      ur: روزے کا روحانی مقصد
  - term:
      ar: الفجر
      en: dawn
      ur: طلوع فجر
    gloss:
      ar: وقت بدء الصوم اليومي
      en: the daily fast's start time
      ur: روزانہ روزے کا آغاز
  - term:
      ar: الغروب
      en: sunset
      ur: غروب
    gloss:
      ar: وقت الإفطار اليومي
      en: the daily breaking time
      ur: روزانہ روزہ کھولنے کا وقت
  practice:
  - q:
      ar: ما شهر الصوم؟
      en: Which is the fasting month?
      ur: روزے کا مہینہ کون سا ہے؟
    options:
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: true
      why:
        ar: رمضان التاسع شهر الصوم
        en: Ramadan is the ninth, the fasting month
        ur: رمضان نواں مہینہ، روزے کا ہے
    - text:
        ar: شعبان
        en: Sha'ban
        ur: شعبان
      correct: false
      why:
        ar: شعبان قبله لا الصوم
        en: Sha'ban precedes it, not fasting
        ur: شعبان اس سے پہلے ہے، روزے کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الصوم
        en: Muharram opens the year, not fasting
        ur: محرم سال کا پہلا ہے، روزے کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب سابع الشهر
        en: Rajab is the seventh month
        ur: رجب ساتواں مہینہ ہے
  - q:
      ar: من الفجر إلى متى يصوم؟
      en: From dawn until when?
      ur: طلوع فجر سے کب تک روزہ؟
    options:
    - text:
        ar: إلى الغروب
        en: until sunset
        ur: غروب تک
      correct: true
      why:
        ar: من الفجر إلى الغروب يمتنع
        en: from dawn to sunset he abstains
        ur: طلوع فجر سے غروب تک پرہیز
    - text:
        ar: إلى الظهر
        en: until noon
        ur: دوپہر تک
      correct: false
      why:
        ar: ليس إلى الظهر بل الغروب
        en: till sunset, not noon
        ur: دوپہر نہیں، غروب
    - text:
        ar: إلى منتصف الليل
        en: till midnight
        ur: آدھی رات تک
      correct: false
      why:
        ar: ليس منتصف الليل بل الغروب
        en: till sunset, not midnight
        ur: آدھی رات نہیں، غروب
    - text:
        ar: إلى الفجر التالي
        en: till next dawn
        ur: اگلی فجر تک
      correct: false
      why:
        ar: ليس يوم كامل بل نهار
        en: a day, not a full night too
        ur: پورا دن رات نہیں، صرف دن
  - q:
      ar: ما السحور؟
      en: What is suhoor?
      ur: سحری کیا ہے؟
    options:
    - text:
        ar: وجبة الفجر قبل الصوم
        en: the pre-dawn meal
        ur: طلوع فجر سے پہلے کھانا
      correct: true
      why:
        ar: وجبة قبل الفجر تجهّز للصوم
        en: a pre-dawn meal preparing for the fast
        ur: روزے کی تیاری کا فجر سے پہلے کھانا
    - text:
        ar: وجبة الغروب
        en: the sunset meal
        ur: غروب کا کھانا
      correct: false
      why:
        ar: وجبة الغروب هي الإفطار
        en: the sunset meal is iftar
        ur: غروب کا کھانا افطار ہے
    - text:
        ar: صلاة الليل
        en: the night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: ليست صلاة بل وجبة
        en: a meal, not a prayer
        ur: نماز نہیں، کھانا
    - text:
        ar: صدقة الصوم
        en: the fast's charity
        ur: روزے کا صدقہ
      correct: false
      why:
        ar: ليست صدقة بل وجبة
        en: a meal, not charity
        ur: صدقہ نہیں، کھانا
  - q:
      ar: ما الإفطار؟
      en: What is iftar?
      ur: افطار کیا ہے؟
    options:
    - text:
        ar: وجبة الغروب
        en: the sunset meal
        ur: غروب کا کھانا
      correct: true
      why:
        ar: وجبة فتح الصوم عند الغروب
        en: the meal breaking the fast at sunset
        ur: غروب پر روزہ کھولنے کا کھانا
    - text:
        ar: وجبة الفجر
        en: the dawn meal
        ur: فجر کا کھانا
      correct: false
      why:
        ar: وجبة الفجر هي السحور
        en: the dawn meal is suhoor
        ur: فجر کا کھانا سحری ہے
    - text:
        ar: صلاة المغرب
        en: the sunset prayer
        ur: نماز مغرب
      correct: false
      why:
        ar: ليست صلاة بل وجبة
        en: a meal, not the prayer
        ur: نماز نہیں، کھانا
    - text:
        ar: ليلة القدر
        en: the Night of Power
        ur: لیلۃ القدر
      correct: false
      why:
        ar: ليست ليلة بل وجبة
        en: a meal, not a night
        ur: رات نہیں، کھانا
  - q:
      ar: ما ليلة القدر؟
      en: What is the Night of Power?
      ur: لیلۃ القدر کیا ہے؟
    options:
    - text:
        ar: ليلة ذكرى نزول القرآن
        en: a night marking the Qur'an's descent
        ur: قرآن کے نزول کی یاد کی رات
      correct: true
      why:
        ar: في العشر الأخيرة تذكّر بنزول القرآن
        en: in the last ten, recalling the Qur'an's descent
        ur: آخری دس میں، قرآن کے نزول کی یاد
    - text:
        ar: أول ليلة رمضان
        en: Ramadan's first night
        ur: رمضان کی پہلی رات
      correct: false
      why:
        ar: ليست أول ليلة بل من العشر
        en: in the last ten, not the first
        ur: پہلی نہیں، آخری دس میں
    - text:
        ar: ليلة العيد
        en: the Eid night
        ur: عید کی رات
      correct: false
      why:
        ar: ليست ليلة العيد بل قبلها
        en: before Eid night, not it
        ur: عید کی رات نہیں، اس سے پہلے
    - text:
        ar: ليلة النصف
        en: the mid-month night
        ur: وسط مہینے کی رات
      correct: false
      why:
        ar: ليست النصف بل العشر
        en: in the last ten, not mid-month
        ur: وسط نہیں، آخری دس
  - q:
      ar: من المعذور من الصوم؟
      en: Who is excused from fasting?
      ur: روزے سے کون معذور ہے؟
    options:
    - text:
        ar: المرضى والمسافرون والصغار
        en: the sick, travellers, young
        ur: بیمار، مسافر، بچے
      correct: true
      why:
        ar: المريض والمسافر والصغير معفوون
        en: the sick, traveller and young are exempt
        ur: بیمار، مسافر اور بچے معذور ہیں
    - text:
        ar: كل الناس
        en: everyone
        ur: ہر کوئی
      correct: false
      why:
        ar: ليس كل الناس بل أصناف
        en: not everyone, but classes
        ur: ہر کوئی نہیں، بعض قسمیں
    - text:
        ar: الكبار فقط
        en: only adults
        ur: صرف بڑے
      correct: false
      why:
        ar: ليس الكبار بل المعذور
        en: not adults; the excused
        ur: بڑے نہیں، معذور
    - text:
        ar: لا أحد
        en: no one
        ur: کوئی نہیں
      correct: false
      why:
        ar: بعض الناس معفوون
        en: some people are exempt
        ur: بعض لوگ معذور ہیں
  - q:
      ar: بماذا يبدأ الشهر؟
      en: What starts the month?
      ur: مہینہ کس سے شروع ہوتا ہے؟
    options:
    - text:
        ar: رؤية الهلال
        en: the crescent's sighting
        ur: ہلال کی رؤیت
      correct: true
      why:
        ar: يبدأ برؤية الهلال الجديد
        en: it begins with the new crescent's sighting
        ur: نئے ہلال کی رؤیت سے شروع ہوتا ہے
    - text:
        ar: أول يوم شمسي
        en: the first solar day
        ur: پہلا شمسی دن
      correct: false
      why:
        ar: ليس شمسيًا بل قمريًا
        en: lunar, not solar
        ur: شمسی نہیں، قمری
    - text:
        ar: بداية السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليس أول السنة بل هلاله
        en: its crescent, not the new year
        ur: نیا سال نہیں، اس کا ہلال
    - text:
        ar: أول أسبوع
        en: the first week
        ur: پہلا ہفتہ
      correct: false
      why:
        ar: ليس أسبوعًا بل هلالاً
        en: a crescent, not a week
        ur: ہفتہ نہیں، ہلال
  - q:
      ar: ما ختام الشهر؟
      en: How does the month close?
      ur: مہینہ کیسے ختم ہوتا ہے؟
    options:
    - text:
        ar: عيد الفطر
        en: with Eid al-Fitr
        ur: عید الفطر سے
      correct: true
      why:
        ar: يختم بعيد الفطر أول شوال
        en: it closes with Eid al-Fitr, first Shawwal
        ur: عید الفطر سے، پہلی شوال
    - text:
        ar: الحج
        en: with the Hajj
        ur: حج سے
      correct: false
      why:
        ar: الحج في ذي الحجة لا رمضان
        en: Hajj is in Dhu al-Hijja, not Ramadan
        ur: حج ذوالحجہ میں ہے، رمضان نہیں
    - text:
        ar: عيد الأضحى
        en: with Eid al-Adha
        ur: عید الاضحیٰ سے
      correct: false
      why:
        ar: الأضحى في الحج لا الفطر
        en: al-Adha is in Hajj season, not Fitr
        ur: اضحیٰ حج کے موسم میں ہے، فطر نہیں
    - text:
        ar: بداية السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليست أول السنة بل العيد
        en: Eid, not the new year
        ur: نیا سال نہیں، عید
  - q:
      ar: ما غاية الصوم الروحية؟
      en: The fast's spiritual aim?
      ur: روزے کا روحانی مقصد؟
    options:
    - text:
        ar: تزكية النفس وتقوية الإرادة
        en: cleansing soul, strengthening will
        ur: نفس کی پاکیزگی، عزم کی مضبوطی
      correct: true
      why:
        ar: تزكية وتقوية وذكرى القرآن
        en: cleansing, strengthening, Qur'an remembrance
        ur: پاکیزگی، مضبوطی، قرآن کی یاد
    - text:
        ar: إنقاص الوزن
        en: losing weight
        ur: وزن کم کرنا
      correct: false
      why:
        ar: ليس وزنًا بل تزكية
        en: soul-cleansing, not weight
        ur: وزن نہیں، پاکیزگی
    - text:
        ar: توفير الطعام
        en: saving food
        ur: کھانا بچانا
      correct: false
      why:
        ar: ليس توفيرًا بل عبادة
        en: worship, not saving
        ur: بچت نہیں، عبادت
    - text:
        ar: إثبات القوة
        en: proving strength
        ur: طاقت ثابت کرنا
      correct: false
      why:
        ar: ليس إثباتًا بل تقوى
        en: God-consciousness, not proving
        ur: ثابت کرنا نہیں، تقویٰ
  - q:
      ar: ما التراويح؟
      en: What is taraweeh?
      ur: تراویح کیا ہے؟
    options:
    - text:
        ar: صلاة الليل الجامعة
        en: the communal night prayer
        ur: باجماعت رات کی نماز
      correct: true
      why:
        ar: صلاة ليلية جامعة في رمضان
        en: a communal night prayer in Ramadan
        ur: رمضان کی باجماعت رات کی نماز
    - text:
        ar: وجبة الإفطار
        en: the iftar meal
        ur: افطار کا کھانا
      correct: false
      why:
        ar: ليست وجبة بل صلاة
        en: a prayer, not a meal
        ur: کھانا نہیں، نماز
    - text:
        ar: صيام الليل
        en: night fasting
        ur: رات کا روزہ
      correct: false
      why:
        ar: ليست صومًا بل صلاة
        en: a prayer, not fasting
        ur: روزہ نہیں، نماز
    - text:
        ar: ذكرى العيد
        en: the Eid rite
        ur: عید کی رسم
      correct: false
      why:
        ar: ليست عيدًا بل صلاة ليلية
        en: a night prayer, not Eid
        ur: عید نہیں، رات کی نماز
- id: zakat
  anchor: practice/zakat
  band: scholars
  title:
    ar: الزكاة
    en: Zakat
    ur: زکوٰت
  sixty:
    ar: 'الزكاة ركن الإسلام الثالث: عطية سنوية واجبة على المال الفائض تصل إلى نحو ٢.٥ بالمئة على الادّخار. تذهب إلى الفقراء والمحتاجين والمدينين وأصناف أخرى حددها
      القرآن. ليست ضريبة حكومية بل عبادة تطهّر المال وتربط المجتمع بعضه ببعض. وعبر التاريخ بنيت دول على تنظيمها، من بيت مال المسلمين إلى صناديق العصر الحديث.'
    en: Zakat, Islam's third pillar, is an annual obligatory giving on surplus wealth — about 2.5 percent on savings. It goes to the poor, the needy, debtors and
      other classes the Qur'an named. It is not a state tax but a worship that cleanses wealth and binds society together. Across history states organised it, from
      the Muslims' treasury to modern funds.
    ur: 'زکوٰت اسلام کا تیسرا رکن ہے: فاضل مال پر سالانہ لازم عطیہ — بچت پر تقریباً ڈھائی فیصد۔ یہ فقیروں، ضرورت مندوں، مقروضوں اور قرآن کے بتائے دیگر گروہوں کو ملتی
      ہے۔ یہ سرکاری ٹیکس نہیں بلکہ عبادت ہے جو مال کو پاک کرتی اور معاشرے کو آپس میں جوڑتی ہے۔ تاریخ بھر ریاستوں نے اسے منظم کیا، بیت المال سے لے کر جدید فنڈز تک۔'
  glossary:
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰت
    gloss:
      ar: العطية الواجبة على المال الفائض
      en: the obligatory giving on surplus wealth
      ur: فاضل مال پر لازم عطیہ
  - term:
      ar: النصاب
      en: the nisab (threshold)
      ur: نصاب
    gloss:
      ar: الحد الأدنى من المال الذي تجب فيه
      en: the minimum wealth at which it is due
      ur: کم از کم مال جس پر واجب ہوتی ہے
  - term:
      ar: ٢.٥ بالمئة
      en: 2.5 percent
      ur: ڈھائی فیصد
    gloss:
      ar: معدل الزكاة على الادّخار
      en: the rate on saved wealth
      ur: بچت پر اس کی شرح
  - term:
      ar: الفقراء
      en: the poor
      ur: فقیر
    gloss:
      ar: أصناف المستحقين الأوائل
      en: the first named deserving class
      ur: پہلا نامزد مستحق گروہ
  - term:
      ar: المحتاجون
      en: the needy
      ur: ضرورت مند
    gloss:
      ar: الذين لا يكفيهم ما عندهم
      en: those whom what they have does not suffice
      ur: وہ جن کے پاس کافی نہیں
  - term:
      ar: المدينون
      en: the debtors
      ur: مقروض
    gloss:
      ar: المثقلون بالديون المستحقون
      en: the debt-laden who are deserving
      ur: وہ قرض دار جو مستحق ہیں
  - term:
      ar: العبادة
      en: worship
      ur: عبادت
    gloss:
      ar: عمل ديني لا ضريبة
      en: a rite, not a tax
      ur: رسم، ٹیکس نہیں
  - term:
      ar: بيت المال
      en: the treasury
      ur: بیت المال
    gloss:
      ar: خزانة الدولة الإسلامية القديمة للزكاة
      en: the old Islamic treasury for zakat
      ur: زکوٰت کی پرانی اسلامی خزانہ
  - term:
      ar: المال الفائض
      en: surplus wealth
      ur: فاضل مال
    gloss:
      ar: ما زاد عن حاجة السنة
      en: what exceeds a year's need
      ur: سال کی ضرورت سے زائد
  - term:
      ar: الصدقة
      en: sadaqah (voluntary)
      ur: صدقہ
    gloss:
      ar: عطية اختيارية غير الزكاة
      en: voluntary giving unlike zakat
      ur: رضاکارانہ عطیہ، زکوٰت کے برعکس
  - term:
      ar: التطهير
      en: purification
      ur: پاکیزگی
    gloss:
      ar: تنقية المال والنفس بالعطاء
      en: cleansing wealth and soul by giving
      ur: عطیہ سے مال اور نفس کی پاکیزگی
  - term:
      ar: الأصناف الثمانية
      en: the eight classes
      ur: آٹھ گروہ
    gloss:
      ar: الفئات التي حددها القرآن
      en: the categories the Qur'an named
      ur: وہ درجے جو قرآن نے بتائے
  practice:
  - q:
      ar: ما ركن الزكاة في الإسلام؟
      en: Which pillar is zakat?
      ur: زکوٰت اسلام کا کون سا رکن ہے؟
    options:
    - text:
        ar: الثالث
        en: the third
        ur: تیسرا
      correct: true
      why:
        ar: الزكاة الركن الثالث بعد الصلاة
        en: zakat is the third pillar after prayer
        ur: زکوٰت نماز کے بعد تیسرا رکن ہے
    - text:
        ar: الأول
        en: the first
        ur: پہلا
      correct: false
      why:
        ar: الأول الشهادة لا الزكاة
        en: the first is the testimony
        ur: پہلا شہادت ہے
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: الرابع الصوم لا الزكاة
        en: the fourth is fasting
        ur: چوتھا روزہ ہے
    - text:
        ar: الخامس
        en: the fifth
        ur: پانچواں
      correct: false
      why:
        ar: الخامس الحج لا الزكاة
        en: the fifth is Hajj
        ur: پانچواں حج ہے
  - q:
      ar: كم معدلها على الادّخار؟
      en: Its rate on savings?
      ur: بچت پر اس کی شرح؟
    options:
    - text:
        ar: نحو ٢.٥ بالمئة
        en: about 2.5 percent
        ur: تقریباً ڈھائی فیصد
      correct: true
      why:
        ar: ٢.٥ بالمئة على الادّخار
        en: 2.5 percent on saved wealth
        ur: بچت پر ڈھائی فیصد
    - text:
        ar: ١٠ بالمئة
        en: 10 percent
        ur: دس فیصد
      correct: false
      why:
        ar: ١٠ بالمئة أكثر من معدلها
        en: 10 percent exceeds its rate
        ur: دس فیصد اس سے زیادہ ہے
    - text:
        ar: ١ بالمئة
        en: 1 percent
        ur: ایک فیصد
      correct: false
      why:
        ar: ١ بالمئة أقل من معدلها
        en: 1 percent is below its rate
        ur: ایک فیصد اس سے کم ہے
    - text:
        ar: ٢٥ بالمئة
        en: 25 percent
        ur: پچیس فیصد
      correct: false
      why:
        ar: ٢٥ بالمئة أكثر بكثير
        en: 25 percent is far more
        ur: پچیس فیصد بہت زیادہ ہے
  - q:
      ar: على ماذا تجب؟
      en: On what is it due?
      ur: یہ کس چیز پر لازم ہے؟
    options:
    - text:
        ar: المال الفائض
        en: surplus wealth
        ur: فاضل مال
      correct: true
      why:
        ar: تجب على الفائض فوق النصاب
        en: due on surplus above the nisab
        ur: نصاب سے اوپر فاضل پر واجب
    - text:
        ar: كل دخل يومي
        en: all daily income
        ur: ہر روز کی آمدنی
      correct: false
      why:
        ar: ليس كل دخل بل الفائض
        en: surplus, not all income
        ur: ہر آمدنی نہیں، فاضل
    - text:
        ar: الهدايا
        en: gifts
        ur: تحائف
      correct: false
      why:
        ar: ليست هدايا بل مال فائض
        en: surplus wealth, not gifts
        ur: تحائف نہیں، فاضل مال
    - text:
        ar: الوقت
        en: time
        ur: وقت
      correct: false
      why:
        ar: ليست وقتًا بل مالاً
        en: wealth, not time
        ur: وقت نہیں، مال
  - q:
      ar: لمن تذهب؟
      en: To whom does it go?
      ur: یہ کس کو ملتی ہے؟
    options:
    - text:
        ar: الفقراء والمحتاجون
        en: the poor and needy
        ur: فقیروں اور ضرورت مندوں کو
      correct: true
      why:
        ar: الفقراء والمحتاجون والمدينون وأصناف
        en: poor, needy, debtors and named classes
        ur: فقیر، ضرورت مند، مقروض اور نامزد گروہ
    - text:
        ar: الحكّام فقط
        en: only rulers
        ur: صرف حکمرانوں کو
      correct: false
      why:
        ar: ليست حكّامًا بل مستحقين
        en: to the deserving, not rulers
        ur: حکمرانوں کو نہیں، مستحقین کو
    - text:
        ar: الأغنياء
        en: the rich
        ur: امیروں کو
      correct: false
      why:
        ar: ليست أغنياء بل فقراء
        en: to the poor, not rich
        ur: امیروں کو نہیں، فقیروں کو
    - text:
        ar: السائحون
        en: tourists
        ur: سیاحوں کو
      correct: false
      why:
        ar: ليست سائحين بل أصناف محددة
        en: to named classes, not tourists
        ur: سیاحوں کو نہیں، نامزد گروہوں کو
  - q:
      ar: ما الفرق بينها والضريبة؟
      en: How does it differ from tax?
      ur: یہ ٹیکس سے کیسے مختلف ہے؟
    options:
    - text:
        ar: عبادة لا ضريبة
        en: worship, not tax
        ur: عبادت، ٹیکس نہیں
      correct: true
      why:
        ar: الزكاة عبادة تطهر المال لا جباية
        en: zakat is worship cleansing wealth, not levy
        ur: زکوٰت مال پاک کرنے والی عبادت ہے، وصولی نہیں
    - text:
        ar: مثلها تمامًا
        en: exactly like tax
        ur: بالکل ٹیکس جیسی
      correct: false
      why:
        ar: ليست ضريبة بل عبادة
        en: worship, not tax
        ur: ٹیکس نہیں، عبادت
    - text:
        ar: أقل قيمة
        en: less in value
        ur: کم قدر
      correct: false
      why:
        ar: ليس أقل بل معنى مختلف
        en: different in meaning, not less
        ur: کم نہیں، مختلف معنی
    - text:
        ar: اختيارية
        en: voluntary
        ur: رضاکارانہ
      correct: false
      why:
        ar: ليست اختيارية بل واجبة
        en: obligatory, not voluntary
        ur: رضاکارانہ نہیں، لازم
  - q:
      ar: ما النصاب؟
      en: What is the nisab?
      ur: نصاب کیا ہے؟
    options:
    - text:
        ar: حد المال الذي تجب فيه
        en: the wealth threshold for zakat
        ur: وہ حد جس پر زکوٰت واجب ہوتی ہے
      correct: true
      why:
        ar: أدنى مال فائض تبدأ فيه الزكاة
        en: the minimum surplus at which zakat starts
        ur: کم از کم فاضل جس پر زکوٰت شروع ہوتی ہے
    - text:
        ar: كل المال
        en: all wealth
        ur: تمام مال
      correct: false
      why:
        ar: ليس كل المال بل الحد
        en: a threshold, not all wealth
        ur: تمام مال نہیں، حد
    - text:
        ar: دين الدولة
        en: the state debt
        ur: ریاست کا قرض
      correct: false
      why:
        ar: ليس دينًا بل حد مال
        en: a wealth threshold, not debt
        ur: قرض نہیں، مال کی حد
    - text:
        ar: سنة الصوم
        en: the fasting year
        ur: روزے کا سال
      correct: false
      why:
        ar: ليس وقتًا بل مالاً
        en: a wealth measure, not time
        ur: وقت نہیں، مال
  - q:
      ar: من الأصناف المستحقة؟
      en: Which classes deserve it?
      ur: مستحق گروہ کون سے ہیں؟
    options:
    - text:
        ar: الفقراء والمحتاجون والمدينون
        en: poor, needy, debtors
        ur: فقیر، ضرورت مند، مقروض
      correct: true
      why:
        ar: ثمانية أصناف بينها الفقراء والمدينون
        en: eight classes including poor and debtors
        ur: آٹھ گروہ جن میں فقیر اور مقروض ہیں
    - text:
        ar: الكبار فقط
        en: only elders
        ur: صرف بڑے
      correct: false
      why:
        ar: ليست كبارًا بل أصناف محددة
        en: named classes, not just elders
        ur: صرف بڑے نہیں، نامزد گروہ
    - text:
        ar: العمّال فقط
        en: only workers
        ur: صرف مزدور
      correct: false
      why:
        ar: ليست عمّالًا بل أصناف
        en: named classes, not just workers
        ur: صرف مزدور نہیں، گروہ
    - text:
        ar: الأهل فقط
        en: only family
        ur: صرف خاندان
      correct: false
      why:
        ar: ليست أهلًا بل مستحقين
        en: the deserving, not just family
        ur: صرف خاندان نہیں، مستحق
  - q:
      ar: ما بيت المال؟
      en: What was the treasury?
      ur: بیت المال کیا تھا؟
    options:
    - text:
        ar: خزانة الدولة للزكاة
        en: the state's zakat treasury
        ur: زکوٰت کی ریاستی خزانہ
      correct: true
      why:
        ar: نظمت بيت المال جمع الزكاة وتوزيعها
        en: the treasury organised zakat's collection and share
        ur: بیت المال نے زکوٰت کی جمع اور تقسیم مرتب کی
    - text:
        ar: بنك تجاري
        en: a commercial bank
        ur: تجارتی بینک
      correct: false
      why:
        ar: ليست بنكًا بل خزانة
        en: a treasury, not a bank
        ur: بینک نہیں، خزانہ
    - text:
        ar: مخزن حبوب
        en: a grain store
        ur: اناج کا گودام
      correct: false
      why:
        ar: ليست مخزنًا بل خزانة
        en: a treasury, not a store
        ur: گودام نہیں، خزانہ
    - text:
        ar: بيت الخليفة
        en: the caliph's house
        ur: خلیفہ کا گھر
      correct: false
      why:
        ar: ليست بيتًا خاصًا
        en: not a private house
        ur: نجی گھر نہیں
  - q:
      ar: ما الفرق بينها والصدقة؟
      en: Zakat vs. sadaqah?
      ur: زکوٰت اور صدقہ میں فرق؟
    options:
    - text:
        ar: واجبة مقابل اختيارية
        en: obligatory vs. voluntary
        ur: لازم بمقابلہ رضاکارانہ
      correct: true
      why:
        ar: الزكاة واجبة والصدقة اختيارية
        en: zakat is required, sadaqah voluntary
        ur: زکوٰت واجب ہے، صدقہ رضاکارانہ
    - text:
        ar: مثلها تمامًا
        en: exactly alike
        ur: بالکل ایک جیسی
      correct: false
      why:
        ar: ليستا متساويتين
        en: they are not the same
        ur: یہ برابر نہیں
    - text:
        ar: الصدقة أكبر
        en: sadaqah is bigger
        ur: صدقہ بڑا ہے
      correct: false
      why:
        ar: ليست قيمة بل وجوب
        en: the difference is obligation, not size
        ur: قدر نہیں، لزوم کا فرق
    - text:
        ar: الصدقة للفقراء فقط
        en: sadaqah only for poor
        ur: صدقہ صرف فقیروں کو
      correct: false
      why:
        ar: الصدقة لأحد والزكاة واجبة
        en: sadaqah is free; zakat is required
        ur: صدقہ آزاد ہے؛ زکوٰت لازم
  - q:
      ar: ما معنى «تطهير المال»؟
      en: What does 'cleansing wealth' mean?
      ur: مال کی پاکیزگی کا کیا مطلب؟
    options:
    - text:
        ar: تنقية النفس والمال بالعطاء
        en: cleansing soul and wealth by giving
        ur: عطیہ سے نفس اور مال کی پاکیزگی
      correct: true
      why:
        ar: العطاء ينقّي القلب والمال من الشح
        en: giving cleans heart and wealth of greed
        ur: عطیہ دل اور مال کو بخل سے پاک کرتا ہے
    - text:
        ar: غسل العملة
        en: washing coins
        ur: سکے دھونا
      correct: false
      why:
        ar: ليست غسلًا بل تنقية
        en: cleansing, not washing
        ur: دھونا نہیں، پاکیزگی
    - text:
        ar: تجميع المال
        en: hoarding wealth
        ur: مال جمع کرنا
      correct: false
      why:
        ar: ليس تجميعًا بل إخراج
        en: releasing, not hoarding
        ur: جمع نہیں، اخراج
    - text:
        ar: إخفاء الثروة
        en: hiding wealth
        ur: دولت چھپانا
      correct: false
      why:
        ar: ليس إخفاءً بل تطهير
        en: purifying, not hiding
        ur: چھپانا نہیں، پاکیزگی
- id: bayt-al-hikma
  anchor: building/bayt-al-hikma
  band: researchers
  title:
    ar: بيت الحكمة
    en: The House of Wisdom
    ur: بیت الحکمت
  sixty:
    ar: أسّس الخلفاء العباسيون في بغداد «بيت الحكمة» في القرن التاسع مكتبةً ودار ترجمة ومجمع علماء. وفيها نُقلت كتب اليونان وفارس والهند إلى العربية، واشتغل الخوارزمي
      على الجبر والحساب، وصارت بغداد أعظم مدينة علم في عصرها. ويقول المؤرخون إن حركة الترجمة فيها غيّرت تاريخ المعرفة.
    en: The Abbasid caliphs founded the 'House of Wisdom' in ninth-century Baghdad as a library, translation house and scholars' academy. There the books of Greece,
      Persia and India were rendered into Arabic, al-Khwarizmi worked on algebra and reckoning, and Baghdad became the greatest city of learning of its age. Historians
      say its translation movement changed the history of knowledge.
    ur: عباسی خلفاء نے نویں صدی میں بغداد میں «بیت الحکمت» کو کتب خانہ، ترجمہ خانہ اور علماء کی درسگاہ کے طور پر بنایا۔ وہاں یونان، فارس اور ہند کی کتابیں عربی میں
      منتقل ہوئیں، خوارزمی نے الجبر اور حساب پر کام کیا اور بغداد اپنے زمانے کا سب سے بڑا علمی شہر بنا۔ مؤرخین کہتے ہیں کہ اس کی ترجمہ تحریک نے علم کی تاریخ بدل دی۔
  glossary:
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: العاصمة العباسية حيث قام البيت
      en: the Abbasid capital where it stood
      ur: عباسی پایہ تخت جہاں یہ قائم تھا
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: الخلفاء الذين أسّسوه ووسّعوه
      en: the caliphs who founded and enlarged it
      ur: وہ خلفاء جنھوں نے بنایا اور پھیلایا
  - term:
      ar: المأمون
      en: al-Ma'mun
      ur: المامون
    gloss:
      ar: الخليفة الذي اشتهر بدعمه العلم
      en: the caliph famed for patronising learning
      ur: وہ خلیفہ جو علم کی سرپرستی میں مشہور تھا
  - term:
      ar: الترجمة
      en: translation
      ur: ترجمہ
    gloss:
      ar: نقل الكتب من اليونانية والفارسية والهندية
      en: rendering books from Greek, Persian and Sanskrit
      ur: یونانی، فارسی اور سنسکرت سے کتابوں کی منتقلی
  - term:
      ar: الخوارزمي
      en: al-Khwarizmi
      ur: خوارزمی
    gloss:
      ar: عالم الجبر الذي عمل في البيت
      en: the algebra scholar who worked there
      ur: الجبر کا عالم جس نے وہاں کام کیا
  - term:
      ar: المكتبة
      en: the library
      ur: کتب خانہ
    gloss:
      ar: مجمع الكتب والمخطوطات
      en: the store of books and manuscripts
      ur: کتابوں اور مخطوطات کا ذخیرہ
  - term:
      ar: الورّاقون
      en: the copyists
      ur: نسخہ نویس
    gloss:
      ar: كتبة ينسخون الكتب وينشرونها
      en: scribes who copied and spread books
      ur: وہ منشی جو کتابیں نقل اور پھیلاتے تھے
  - term:
      ar: الفلك
      en: astronomy
      ur: فلک
    gloss:
      ar: علم النجوم الذي ازدهر فيه
      en: the star science that flourished there
      ur: وہ نجوم کا علم جو وہاں پھلا
  - term:
      ar: الجبر
      en: algebra
      ur: الجبر
    gloss:
      ar: علم الحساب الذي وضعه الخوارزمي
      en: the reckoning science al-Khwarizmi founded
      ur: حساب کا علم جسے خوارزمی نے قائم کیا
  - term:
      ar: المرصد
      en: the observatory
      ur: رصد گاہ
    gloss:
      ar: مكان رصد النجوم المرتبط بالبيت
      en: the star-watching station linked to it
      ur: اس سے منسلک ستاروں کی رصد گاہ
  - term:
      ar: المترجمون
      en: the translators
      ur: مترجم
    gloss:
      ar: علماء ينقلون النصوص إلى العربية
      en: scholars rendering texts into Arabic
      ur: علماء جو متن عربی میں منتقل کرتے تھے
  - term:
      ar: حركة الترجمة
      en: the translation movement
      ur: ترجمہ تحریک
    gloss:
      ar: الموجة التي نقلت علوم الأمم إلى العربية
      en: the wave that carried nations' learning into Arabic
      ur: وہ لہر جو قوموں کا علم عربی میں لائی
  practice:
  - q:
      ar: في أيّ مدينة قام؟
      en: In which city did it stand?
      ur: یہ کس شہر میں تھا؟
    options:
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: true
      why:
        ar: في بغداد العاصمة العباسية
        en: in Baghdad, the Abbasid capital
        ur: عباسی پایہ تخت بغداد میں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة مدينة دار الحكمة الفاطمية
        en: Cairo held the Fatimid house
        ur: قاہرہ میں فاطمی دار الحکمت تھا
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق عاصمة الأمويين لا العباسيين
        en: Damascus was the Umayyad capital
        ur: دمشق امویوں کی دارالحکومت تھی
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: false
      why:
        ar: قرطبة في الأندلس لا بغداد
        en: Cordoba was in al-Andalus, not Baghdad
        ur: قرطبہ الاندلس میں تھا، بغداد نہیں
  - q:
      ar: في أيّ قرن اشتهر؟
      en: In which century did it flourish?
      ur: یہ کس صدی میں پھلا؟
    options:
    - text:
        ar: القرن التاسع
        en: the ninth century
        ur: نویں صدی
      correct: true
      why:
        ar: ازدهر في القرن التاسع الميلادي
        en: it flourished in the ninth century CE
        ur: یہ نویں صدی عیسوی میں پھلا
    - text:
        ar: القرن الخامس عشر
        en: the fifteenth century
        ur: پندرہویں صدی
      correct: false
      why:
        ar: القرن الخامس عشر متأخر عنه
        en: the fifteenth century is later
        ur: پندرہویں صدی بعد کی ہے
    - text:
        ar: القرن الخامس
        en: the fifth century
        ur: پانچویں صدی
      correct: false
      why:
        ar: القرن الخامس قبل الإسلام
        en: the fifth century predates Islam
        ur: پانچویں صدی اسلام سے پہلے ہے
    - text:
        ar: القرن العشرون
        en: the twentieth century
        ur: بیسویں صدی
      correct: false
      why:
        ar: القرن العشرون متأخر جدًا
        en: the twentieth is far later
        ur: بیسویں صدی بہت بعد کی ہے
  - q:
      ar: من الخليفة المشهور بدعمه؟
      en: Which caliph famously patronised it?
      ur: کون سا خلیفہ اس کی سرپرستی میں مشہور تھا؟
    options:
    - text:
        ar: المأمون
        en: al-Ma'mun
        ur: المامون
      correct: true
      why:
        ar: المأمون اشتهر بدعم العلم والترجمة
        en: al-Ma'mun is famed for backing learning and translation
        ur: المامون علم اور ترجمہ کی حمایت میں مشہور ہے
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: عبد الملك أموي قبله
        en: Abd al-Malik was an earlier Umayyad
        ur: عبدالملک پہلا اموی تھا
    - text:
        ar: هارون فقط
        en: Harun alone
        ur: صرف ہارون
      correct: false
      why:
        ar: هارون بدأه لكن المأمون أشهر من دعمه
        en: Harun began it but al-Ma'mun is the famed patron
        ur: ہارون نے شروع کیا مگر المامون مشہور سرپرست ہے
    - text:
        ar: المعتصم
        en: al-Mu'tasim
        ur: المعتصم
      correct: false
      why:
        ar: المعتصم بعد المأمون
        en: al-Mu'tasim came after al-Ma'mun
        ur: المعتصم المامون کے بعد تھا
  - q:
      ar: ما الذي حدث فيه؟
      en: What happened inside it?
      ur: اس میں کیا ہوتا تھا؟
    options:
    - text:
        ar: ترجمة العلوم إلى العربية
        en: translating sciences into Arabic
        ur: علوم کی عربی میں منتقلی
      correct: true
      why:
        ar: نُقلت كتب اليونان وفارس والهند إلى العربية
        en: Greek, Persian and Indian books were rendered into Arabic
        ur: یونانی، فارسی اور ہندوستانی کتابیں عربی میں آئیں
    - text:
        ar: حروب كلامية فقط
        en: only debates
        ur: صرف مباحثے
      correct: false
      why:
        ar: ليست كلامًا بل ترجمة وعمل
        en: not talk alone but translation and work
        ur: صرف بحث نہیں، ترجمہ اور کام
    - text:
        ar: تجارة كتب
        en: book trade
        ur: کتابوں کی تجارت
      correct: false
      why:
        ar: ليس سوقًا بل دار علم
        en: a house of learning, not a market
        ur: بازار نہیں، علم کا گھر
    - text:
        ar: اجتماع حكّام فقط
        en: only rulers' meetings
        ur: صرف حکمرانوں کی میٹنگ
      correct: false
      why:
        ar: ليس اجتماعًا بل عمل علمي
        en: not meetings but scholarly work
        ur: میٹنگ نہیں، علمی کام
  - q:
      ar: من العالم المشهور الذي عمل فيه؟
      en: Which famed scholar worked there?
      ur: کون سا مشہور عالم وہاں کام کرتا تھا؟
    options:
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: true
      why:
        ar: الخوارزمي عمل فيه على الجبر
        en: al-Khwarizmi worked there on algebra
        ur: خوارزمی وہاں الجبر پر کام کرتا تھا
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا بعده بقرنين
        en: Ibn Sina came two centuries later
        ur: ابن سینا دو صدیوں بعد تھا
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا عالم فيه
        en: Ibn Battuta was a traveller, not a scholar there
        ur: ابن بطوطہ مسافر تھا، وہاں کا عالم نہیں
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون بعده بقرون
        en: Ibn Khaldun came centuries later
        ur: ابن خلدون صدیاں بعد تھا
  - q:
      ar: ما «حركة الترجمة»؟
      en: What was the translation movement?
      ur: ترجمہ تحریک کیا تھی؟
    options:
    - text:
        ar: نقل علوم الأمم إلى العربية
        en: carrying nations' learning into Arabic
        ur: قوموں کا علم عربی میں لانا
      correct: true
      why:
        ar: موجة نقلت كتب اليونان وفارس والهند
        en: a wave carrying Greek, Persian and Indian books
        ur: لہر جو یونانی، فارسی اور ہندوستانی کتابیں لائی
    - text:
        ar: ترجمة الشعر فقط
        en: translating poetry only
        ur: صرف شاعری کا ترجمہ
      correct: false
      why:
        ar: ليست شعرًا بل علومًا
        en: not poetry but sciences
        ur: شاعری نہیں، علوم
    - text:
        ar: نسخ الكتب يدويًا
        en: copying books by hand
        ur: ہاتھ سے کتابیں نقل کرنا
      correct: false
      why:
        ar: ليس نسخًا بل نقل لغة
        en: not copying but translating
        ur: نقل نہیں، ترجمہ
    - text:
        ar: إرسال كتب خارجًا
        en: sending books out
        ur: کتابیں باہر بھیجنا
      correct: false
      why:
        ar: ليس إرسالًا بل استيراد
        en: not sending out but bringing in
        ur: باہر بھیجنا نہیں، اندر لانا
  - q:
      ar: ما الدور الذي لعبه في العلم؟
      en: What role did it play in science?
      ur: اس کا علم میں کیا کردار تھا؟
    options:
    - text:
        ar: حفظ علوم الأمم وتطويرها
        en: preserving and advancing nations' learning
        ur: قوموں کے علم کی حفاظت اور ترقی
      correct: true
      why:
        ar: حفظ علوم اليونان وطوّرها بالعربية
        en: it kept Greek learning and advanced it in Arabic
        ur: اس نے یونانی علم بچایا اور عربی میں ترقی دی
    - text:
        ar: إتلاف الكتب القديمة
        en: destroying old books
        ur: پرانی کتابیں ضائع کرنا
      correct: false
      why:
        ar: لم يتلف بل حفظ وطوّر
        en: it did not destroy; it preserved and advanced
        ur: اس نے ضائع نہیں کیا، بچایا اور ترقی دی
    - text:
        ar: منع التعليم
        en: banning learning
        ur: تعلیم پر پابندی
      correct: false
      why:
        ar: لم يمنع بل رعى العلم
        en: it did not ban; it sponsored learning
        ur: اس نے پابندی نہیں لگائی، سرپرستی کی
    - text:
        ar: نسخ القرآن فقط
        en: copying scripture only
        ur: صرف صحیفہ نقل کرنا
      correct: false
      why:
        ar: ليس نسخًا بل ترجمة علوم
        en: not copying but translating sciences
        ur: نقل نہیں، علوم کا ترجمہ
  - q:
      ar: ما مصيره؟
      en: What became of it?
      ur: اس کا کیا انجام ہوا؟
    options:
    - text:
        ar: دُمّر في السقوط المغولي
        en: destroyed in the Mongol sack
        ur: منگول حملے میں تباہ ہوا
      correct: true
      why:
        ar: دمّره المغول مع بغداد عام ١٢٥٨
        en: the Mongols destroyed it with Baghdad in 1258
        ur: منگولوں نے 1258 میں بغداد کے ساتھ تباہ کیا
    - text:
        ar: بقي حتى اليوم
        en: it survives today
        ur: آج تک باقی ہے
      correct: false
      why:
        ar: لم يبقَ بل دُمّر
        en: it did not survive; it was destroyed
        ur: یہ باقی نہیں رہا، تباہ ہوا
    - text:
        ar: تحوّل إلى مسجد
        en: it became a mosque
        ur: مسجد بن گیا
      correct: false
      why:
        ar: لم يتحوّل بل دُمّر
        en: it was destroyed, not converted
        ur: یہ تبدیل نہیں ہوا، تباہ ہوا
    - text:
        ar: انتقل إلى مصر
        en: it moved to Egypt
        ur: مصر منتقل ہوا
      correct: false
      why:
        ar: لم ينتقل بل باد
        en: it perished, did not move
        ur: یہ منتقل نہیں ہوا، ختم ہوا
  - q:
      ar: ما المرصد المرتبط به؟
      en: What was its linked observatory?
      ur: اس سے منسلک رصد گاہ کیا تھی؟
    options:
    - text:
        ar: رصد النجوم للمأمون
        en: al-Ma'mun's star-watching
        ur: المامون کی نجومی رصد
      correct: true
      why:
        ar: رصد الفلك في بغداد ودمشق
        en: star-watching in Baghdad and Damascus
        ur: بغداد اور دمشق میں فلکیاتی رصد
    - text:
        ar: مرصد الفاتيكان
        en: the Vatican observatory
        ur: ویٹیکن رصد گاہ
      correct: false
      why:
        ar: ليس الفاتيكان بل الإسلامي
        en: not the Vatican but the Islamic one
        ur: ویٹیکن نہیں، اسلامی
    - text:
        ar: تليسكوب حديث
        en: a modern telescope
        ur: جدید دوربین
      correct: false
      why:
        ar: لا تليسكوب بل رصد قديم
        en: no telescope; ancient observation
        ur: دوربین نہیں، قدیم رصد
    - text:
        ar: غير موجود
        en: none existed
        ur: کوئی نہیں تھا
      correct: false
      why:
        ar: كان المرصد جزءًا من حركته العلمية
        en: an observatory was part of its science
        ur: رصد گاہ اس کی علمی تحریک کا حصہ تھی
  - q:
      ar: لماذا يُعدّ محورًا في تاريخ المعرفة؟
      en: Why is it a pivot in knowledge history?
      ur: یہ علم کی تاریخ میں محور کیوں ہے؟
    options:
    - text:
        ar: لترجمته التي غيّرت العالم
        en: for the translation that changed the world
        ur: دنیا بدلنے والے ترجمہ کے لیے
      correct: true
      why:
        ar: نقل علوم الأمم فأثر في أوروبا والعالم
        en: it carried nations' learning and influenced Europe
        ur: اس نے قوموں کا علم لایا اور یورپ پر اثر ڈالا
    - text:
        ar: لبنائه الضخم فقط
        en: for its large building only
        ur: صرف بڑی عمارت کے لیے
      correct: false
      why:
        ar: ليست العمارة بل العلم فيه
        en: not the building but the learning
        ur: عمارت نہیں، علم
    - text:
        ar: لأطول مكتبة
        en: for the longest library
        ur: لمبی کتب خانہ کے لیے
      correct: false
      why:
        ar: ليست أطولًا بل أثرها
        en: not longest but its influence
        ur: لمبی نہیں، اس کا اثر
    - text:
        ar: لأول خريطة
        en: for the first map
        ur: پہلے نقشے کے لیے
      correct: false
      why:
        ar: ليست أول خريطة بل أثر علم
        en: not first map but scholarly influence
        ur: پہلا نقشہ نہیں، علمی اثر
- id: damascus
  anchor: place/damascus
  band: researchers
  title:
    ar: دمشق
    en: Damascus
    ur: دمشق
  sixty:
    ar: دمشق من أقدم مدن العالم المأهولة دون انقطاع، وكانت عاصمة الخلافة الأموية من ٦٦١ إلى ٧٥٠. فيها الجامع الأموي بمناره عيسى وقبر يوحنا المعمدان، وأسواقها القديمة
      وحمّاماتها ومدارسها بقيت قلب المدينة. وظلت مركزًا للعلم والتجارة والصنعة على مفترق طرق الشام.
    en: Damascus is among the world's oldest continuously lived-in cities, and was the Umayyad caliphate's capital from 661 to 750. It holds the Umayyad Mosque with
      its Jesus minaret and John the Baptist's grave, and its old souks, baths and madrasas still form its heart. It stayed a centre of learning, trade and craft
      at the Levant's crossroads.
    ur: دمشق دنیا کے قدیم ترین مسلسل آباد شہروں میں ہے اور 661 سے 750 تک اموی خلافت کا پایہ تخت رہی۔ اس میں اموی مسجد اپنے عیسیٰ مینار اور یحییٰ کی قبر کے ساتھ ہے
      اور اس کے پرانے بازار، حمام اور مدرسے آج بھی اس کا دل ہیں۔ یہ شام کے چوراہے پر علم، تجارت اور دستکاری کا مرکز رہی۔
  glossary:
  - term:
      ar: الشام
      en: the Levant / Syria
      ur: شام
    gloss:
      ar: الإقليم الذي تقع فيه دمشق
      en: the region where Damascus lies
      ur: وہ خطہ جہاں دمشق ہے
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: السلالة التي جعلتها عاصمتها
      en: the dynasty that made it their capital
      ur: وہ خاندان جس نے اسے دارالحکومت بنایا
  - term:
      ar: معاوية
      en: Mu'awiya
      ur: معاویہ
    gloss:
      ar: مؤسس الدولة الأموية فيها
      en: the founder of the Umayyad state there
      ur: وہاں اموی دولت کا بانی
  - term:
      ar: الجامع الأموي
      en: the Umayyad Mosque
      ur: اموی مسجد
    gloss:
      ar: المسجد الكبير في قلب المدينة
      en: the great mosque in the city's heart
      ur: شہر کے دل میں بڑی مسجد
  - term:
      ar: مئذنة عيسى
      en: the Jesus minaret
      ur: عیسائی مینار
    gloss:
      ar: المنارة التي يذكرها التقليد
      en: the minaret named in tradition
      ur: وہ مینار جس کا روایت میں ذکر ہے
  - term:
      ar: قبر يوحنا
      en: John the Baptist's grave
      ur: یحییٰ کی قبر
    gloss:
      ar: الضريح المشترك في الجامع
      en: the shared shrine in the mosque
      ur: مسجد میں مشترک مقبرہ
  - term:
      ar: الحميدية
      en: the Hamidiyeh souk
      ur: حامدیہ بازار
    gloss:
      ar: السوق المسقوفة المشهورة
      en: the famous roofed market
      ur: مشہور چھت دار بازار
  - term:
      ar: المدارس النورية
      en: the Nuri madrasas
      ur: نوری مدرسے
    gloss:
      ar: معاهد أسّسها نور الدين
      en: institutes Nur al-Din founded
      ur: نورالدین کے بنائے ادارے
  - term:
      ar: الحمّامات
      en: the bathhouses
      ur: حمام
    gloss:
      ar: أماكن اغتسال عامة قديمة
      en: old public bathing places
      ur: پرانے عوامی حمام
  - term:
      ar: عبد الملك
      en: Abd al-Malik
      ur: عبدالملک
    gloss:
      ar: الخليفة الذي بناه منارة عربية
      en: the caliph who made its monument Arabic
      ur: وہ خلیفہ جس نے اسے عربی یادگار بنایا
  - term:
      ar: نور الدين
      en: Nur al-Din
      ur: نورالدین
    gloss:
      ar: السلطان الذي رعاها في القرن الثاني عشر
      en: the twelfth-century sultan who patronised it
      ur: بارہویں صدی کا سلطان جس نے اس کی سرپرستی کی
  - term:
      ar: أقدم مدينة
      en: the oldest city
      ur: قدیم ترین شہر
    gloss:
      ar: من أقدم المدن المأهولة بلا انقطاع
      en: among the oldest cities lived in without break
      ur: بلا تعطل آباد قدیم ترین شہروں میں
  practice:
  - q:
      ar: في أيّ إقليم تقع دمشق؟
      en: In which region is Damascus?
      ur: دمشق کس خطے میں ہے؟
    options:
    - text:
        ar: الشام
        en: the Levant
        ur: شام
      correct: true
      why:
        ar: في بلاد الشام على مفترق الطرق
        en: in the Levant at the crossroads
        ur: شام میں، راستوں کے چوراہے پر
    - text:
        ar: الحجاز
        en: the Hijaz
        ur: حجاز
      correct: false
      why:
        ar: الحجاز في الجزيرة لا دمشق
        en: the Hijaz is in Arabia, not Damascus
        ur: حجاز جزیرہ میں ہے، دمشق نہیں
    - text:
        ar: مصر
        en: Egypt
        ur: مصر
      correct: false
      why:
        ar: مصر إقليم آخر
        en: Egypt is another region
        ur: مصر دوسرا خطہ ہے
    - text:
        ar: الأندلس
        en: al-Andalus
        ur: الاندلس
      correct: false
      why:
        ar: الأندلس في الغرب لا دمشق
        en: al-Andalus is far west
        ur: الاندلس دور مغرب میں ہے
  - q:
      ar: ما أبرز لقب تاريخي لها؟
      en: What is its most famous historical title?
      ur: اس کا مشہور ترین تاریخی لقب؟
    options:
    - text:
        ar: عاصمة الأمويين
        en: capital of the Umayyads
        ur: امویوں کا پایہ تخت
      correct: true
      why:
        ar: كانت عاصمة الخلافة الأموية قرنًا
        en: it was the Umayyad caliphate's capital for a century
        ur: یہ صدیوں اموی خلافت کا پایہ تخت رہی
    - text:
        ar: عاصمة العباسيين
        en: capital of the Abbasids
        ur: عباسیوں کا پایہ تخت
      correct: false
      why:
        ar: العباسيون عاصمتهم بغداد
        en: the Abbasids' capital was Baghdad
        ur: عباسیوں کا پایہ تخت بغداد تھا
    - text:
        ar: عاصمة الفاطميين
        en: capital of the Fatimids
        ur: فاطمیوں کا پایہ تخت
      correct: false
      why:
        ar: الفاطميون عاصمتهم القاهرة
        en: the Fatimids' capital was Cairo
        ur: فاطمیوں کا پایہ تخت قاہرہ تھا
    - text:
        ar: عاصمة العثمانيين
        en: capital of the Ottomans
        ur: عثمانیوں کا پایہ تخت
      correct: false
      why:
        ar: العثمانيون عاصمتهم إسطنبول
        en: the Ottomans' capital was Istanbul
        ur: عثمانیوں کا پایہ تخت استنبول تھا
  - q:
      ar: متى كانت عاصمة الخلافة؟
      en: When was it the caliphate's capital?
      ur: یہ کب خلافت کا پایہ تخت تھا؟
    options:
    - text:
        ar: من ٦٦١ إلى ٧٥٠
        en: from 661 to 750
        ur: 661 تا 750
      correct: true
      why:
        ar: ظلت عاصمة الأمويين تسعين عامًا
        en: it stayed the Umayyad capital ninety years
        ur: یہ نوے سال اموی دارالحکومت رہی
    - text:
        ar: من ٧٥٠ إلى ١٢٥٨
        en: from 750 to 1258
        ur: 750 تا 1258
      correct: false
      why:
        ar: ذلك عصر العباسيين في بغداد
        en: that is the Abbasid era in Baghdad
        ur: یہ بغداد میں عباسی دور تھا
    - text:
        ar: من ١٢٥٠ إلى ١٥١٧
        en: from 1250 to 1517
        ur: 1250 تا 1517
      correct: false
      why:
        ar: ذلك عصر المماليك في القاهرة
        en: that is the Mamluk era in Cairo
        ur: یہ قاہرہ میں ممالیک دور تھا
    - text:
        ar: من ١٥١٧ إلى ١٩١٨
        en: from 1517 to 1918
        ur: 1517 تا 1918
      correct: false
      why:
        ar: ذلك العصر العثماني في إسطنبول
        en: that is the Ottoman era in Istanbul
        ur: یہ استنبول میں عثمانی دور تھا
  - q:
      ar: ما أشهر مسجد فيها؟
      en: Its most famous mosque?
      ur: اس کی مشہور ترین مسجد؟
    options:
    - text:
        ar: الجامع الأموي
        en: the Umayyad Mosque
        ur: اموی مسجد
      correct: true
      why:
        ar: الجامع الأموي أعظم مساجدها
        en: the Umayyad Mosque is its greatest
        ur: اموی مسجد اس کی عظیم ترین ہے
    - text:
        ar: الجامع الأقصى
        en: al-Aqsa
        ur: اقصیٰ
      correct: false
      why:
        ar: الأقصى في القدس لا دمشق
        en: al-Aqsa is in Jerusalem
        ur: اقصیٰ یروشلم میں ہے
    - text:
        ar: المسجد الأزرق
        en: the Blue Mosque
        ur: بلیو مسجد
      correct: false
      why:
        ar: الأزرق في إسطنبول
        en: the Blue Mosque is in Istanbul
        ur: بلیو مسجد استنبول میں ہے
    - text:
        ar: الجامع الكبير بقرطبة
        en: Cordoba's mosque
        ur: قرطبہ کی مسجد
      correct: false
      why:
        ar: جامع قرطبة في الأندلس
        en: Cordoba's mosque is in al-Andalus
        ur: قرطبہ کی مسجد الاندلس میں ہے
  - q:
      ar: من أسّس دولتها الأموية؟
      en: Who founded its Umayyad state?
      ur: اس کی اموی دولت کس نے بنائی؟
    options:
    - text:
        ar: معاوية
        en: Mu'awiya
        ur: معاویہ
      correct: true
      why:
        ar: معاوية أسّس الخلافة الأموية فيها
        en: Mu'awiya founded the Umayyad caliphate there
        ur: معاویہ نے وہاں اموی خلافت بنائی
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: عبد الملك بعده جيلان
        en: Abd al-Malik came two generations later
        ur: عبدالملک دو نسلوں بعد تھا
    - text:
        ar: الوليد
        en: al-Walid
        ur: الولید
      correct: false
      why:
        ar: الوليد بعد عبد الملك
        en: al-Walid came after Abd al-Malik
        ur: الولید عبدالملک کے بعد تھا
    - text:
        ar: هشام
        en: Hisham
        ur: ہشام
      correct: false
      why:
        ar: هشام من أحفاد الأسرة لا مؤسسها
        en: Hisham was a descendant, not the founder
        ur: ہشام خاندان کا ایک فرد تھا، بانی نہیں
  - q:
      ar: ما «مئذنة عيسى»؟
      en: What is the Jesus minaret?
      ur: عیسیٰ مینار کیا ہے؟
    options:
    - text:
        ar: منارة يذكرها التقليد
        en: a minaret named in tradition
        ur: روایت میں مذکور مینار
      correct: true
      why:
        ar: تذكر التقاليد نزول عيسى عندها
        en: tradition names it where Jesus descends
        ur: روایت اسے عیسیٰ کے نزول کی جگہ کہتی ہے
    - text:
        ar: برج عيسى في مصر
        en: a Jesus tower in Egypt
        ur: مصر میں عیسیٰ مینار
      correct: false
      why:
        ar: ليست في مصر بل دمشق
        en: in Damascus, not Egypt
        ur: مصر میں نہیں، دمشق میں
    - text:
        ar: قبة ذهبية
        en: a golden dome
        ur: سنہری گنبد
      correct: false
      why:
        ar: ليست قبة بل منارة
        en: a minaret, not a dome
        ur: گنبد نہیں، مینار
    - text:
        ar: باب عيسى
        en: a Jesus gate
        ur: عیسیٰ دروازہ
      correct: false
      why:
        ar: ليست بابًا بل منارة
        en: a minaret, not a gate
        ur: دروازہ نہیں، مینار
  - q:
      ar: ما السوق المشهورة فيها؟
      en: Its famous souk?
      ur: اس کا مشہور بازار؟
    options:
    - text:
        ar: الحميدية
        en: the Hamidiyeh
        ur: حامدیہ
      correct: true
      why:
        ar: الحميدية سوقها المسقوفة المشهورة
        en: the Hamidiyeh is its famed roofed market
        ur: حامدیہ اس کا مشہور چھت دار بازار ہے
    - text:
        ar: بازار إسطنبول
        en: the Grand Bazaar
        ur: گرینڈ بازار
      correct: false
      why:
        ar: البازار الكبير في إسطنبول
        en: the Grand Bazaar is Istanbul's
        ur: گرینڈ بازار استنبول کا ہے
    - text:
        ar: سوق مراكش
        en: Marrakesh's souk
        ur: مراکش کا بازار
      correct: false
      why:
        ar: سوق مراكش في المغرب
        en: Marrakesh's souk is in Morocco
        ur: مراکش کا بازار مراکش میں ہے
    - text:
        ar: سوق القاهرة
        en: Cairo's Khan
        ur: قاہرہ کا خان
      correct: false
      why:
        ar: خان الخليلي في القاهرة
        en: Khan al-Khalili is Cairo's
        ur: خان الخلیلی قاہرہ کا ہے
  - q:
      ar: من رعاها في عصره؟
      en: Who patronised it in his era?
      ur: اپنے دور میں اس کی سرپرستی کس نے کی؟
    options:
    - text:
        ar: نور الدين
        en: Nur al-Din
        ur: نورالدین
      correct: true
      why:
        ar: نور الدين رعاها بالمدارس
        en: Nur al-Din patronised it with madrasas
        ur: نورالدین نے مدرسوں سے سرپرستی کی
    - text:
        ar: صلاح الدين فيها قبره
        en: Saladin, buried there
        ur: صلاح الدین، وہاں مدفون
      correct: false
      why:
        ar: صلاح الدين دُفن فيها بعد نور الدين
        en: Saladin was buried there after Nur al-Din
        ur: صلاح الدین نورالدین کے بعد وہاں دفن ہوا
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: هارون عباسي في بغداد
        en: Harun was Abbasid in Baghdad
        ur: ہارون بغداد میں عباسی تھا
    - text:
        ar: عبد الملك فقط
        en: Abd al-Malik alone
        ur: صرف عبدالملک
      correct: false
      why:
        ar: نور الدين رعاها بعده بقرون
        en: Nur al-Din patronised it centuries later
        ur: نورالدین نے صدیاں بعد سرپرستی کی
  - q:
      ar: ما الذي يميّز قبرها في الجامع؟
      en: What distinguishes its mosque grave?
      ur: اس کی مسجد کی قبر کی خاصیت؟
    options:
    - text:
        ar: قبر يوحنا المشترك
        en: John's shared grave
        ur: یحییٰ کی مشترک قبر
      correct: true
      why:
        ar: قبر يوحنا المعمدان يحترمه المسلمون والمسيحيون
        en: John the Baptist's grave is honoured by both faiths
        ur: یحییٰ کی قبر کو دونوں دین عزت دیتے ہیں
    - text:
        ar: قبر سليمان
        en: Solomon's grave
        ur: سلیمان کی قبر
      correct: false
      why:
        ar: ليس قبر سليمان بل يوحنا
        en: not Solomon's but John's
        ur: سلیمان کی نہیں، یحییٰ کی
    - text:
        ar: قبر محمد
        en: Muhammad's grave
        ur: محمد کی قبر
      correct: false
      why:
        ar: ليس قبر النبي في دمشق
        en: not the Prophet's grave in Damascus
        ur: دمشق میں نبی کی قبر نہیں
    - text:
        ar: لا قبر فيه
        en: no grave in it
        ur: اس میں کوئی قبر نہیں
      correct: false
      why:
        ar: يوجد قبر يوحنا فيه
        en: John's grave is there
        ur: اس میں یحییٰ کی قبر ہے
  - q:
      ar: لماذا تُعدّ من أقدم المدن؟
      en: Why is it among the oldest cities?
      ur: یہ قدیم ترین شہروں میں کیوں ہے؟
    options:
    - text:
        ar: لسكنها بلا انقطاع
        en: for unbroken habitation
        ur: مسلسل آبادی کے لیے
      correct: true
      why:
        ar: سكنها البشر دون توقف آلاف الأعوام
        en: people have lived there unbroken for millennia
        ur: لوگ وہاں ہزاروں سال سے مسلسل رہے
    - text:
        ar: لحجمها فقط
        en: for its size only
        ur: صرف وسعت کے لیے
      correct: false
      why:
        ar: ليست أكبر بل أقدم استمرارًا
        en: not largest but oldest continuously
        ur: سب سے بڑی نہیں، مسلسل قدیم
    - text:
        ar: لأول بناء حجري
        en: for the first stone building
        ur: پہلی پتھر کی عمارت کے لیے
      correct: false
      why:
        ar: ليست أول بناء بل أطول سكن
        en: not first building but longest lived-in
        ur: پہلی عمارت نہیں، طویل ترین آبادی
    - text:
        ar: لقربها من مكة
        en: for nearness to Mecca
        ur: مکہ کی قربت کے لیے
      correct: false
      why:
        ar: ليست قريبة من مكة بل شمالًا
        en: it is not near Mecca but north
        ur: یہ مکہ کے قریب نہیں، شمال میں
- id: rise-of-islam
  anchor: exhibit/pathway-g11-chw3m-rise-of-islam
  band: researchers
  title:
    ar: نشأة الإسلام
    en: The Rise of Islam
    ur: اسلام کا آغاز
  sixty:
    ar: بدأ الإسلام في مكة بوحي نزل على محمد عام ٦١٠، فدعا إلى توحيد الله سرًّا ثم علنًا. وبعد ثلاثة عشر عامًا من الاضطهاد هاجر إلى يثرب فصارت المدينة، ومنها انتشر
      الدين حتى استعاد مكة سلمًا عام ٦٣٠. وبعد قرن مدّت الخلافة الأموية الحكم من الأندلس إلى الهند، فصار الإسلام حضارة عالمية في أقل من مئة عام.
    en: Islam began in Mecca in 610, when revelation came to Muhammad calling people to God's oneness, first in secret then openly. After thirteen years of persecution
      he migrated to Yathrib — which became Medina — and from there the faith spread until Mecca was regained peacefully in 630. Within a century the Umayyad caliphate
      stretched from al-Andalus to India, and Islam had become a world civilisation in under a hundred years.
    ur: اسلام 610 میں مکہ میں شروع ہوا جب محمد پر وحی نازل ہوئی جس نے اللہ کی وحدانیت کی دعوت پہلے چپکے پھر کھلے عام کی۔ تیرہ برس کی سختیوں کے بعد وہ یثرب ہجرت کر
      گیا جو مدینہ بنی اور وہاں سے دین اتنا پھیلا کہ 630 میں مکہ امن سے واپس لیا گیا۔ ایک صدی کے اندر اموی خلافت الاندلس سے ہندوستان تک پھیل گئی اور اسلام سو برس
      سے بھی کم میں عالمی تہذیب بن گیا۔
  glossary:
  - term:
      ar: مكة
      en: Mecca
      ur: مکہ
    gloss:
      ar: المدينة التي بدأ فيها الوحي
      en: the city where revelation began
      ur: وہ شہر جہاں وحی شروع ہوئی
  - term:
      ar: الوحي
      en: revelation
      ur: وحی
    gloss:
      ar: كلام الله المنزل على النبي
      en: God's word sent down to the Prophet
      ur: اللہ کا کلام جو نبی پر نازل ہوا
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: اسم المدينة قبل الهجرة
      en: Medina's name before the Hijra
      ur: ہجرت سے پہلے مدینہ کا نام
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: انتقال المسلمين إلى المدينة عام ٦٢٢
      en: the Muslims' move to Medina in 622
      ur: 622 میں مسلمانوں کی مدینہ منتقلی
  - term:
      ar: الدعوة السرية
      en: the secret call
      ur: پوشیدہ دعوت
    gloss:
      ar: أول ثلاث سنوات من التبليغ
      en: the first three years of quiet preaching
      ur: دعوت کے پہلے تین چھپے ہوئے سال
  - term:
      ar: الاضطهاد
      en: persecution
      ur: اذیت
    gloss:
      ar: أذى قريش للمسلمين الأوائل
      en: Quraysh's harm to the early Muslims
      ur: قریش کی ابتدائی مسلمانوں پر سختی
  - term:
      ar: بدر
      en: Badr
      ur: بدر
    gloss:
      ar: أول معركة كبرى عام ٦٢٤
      en: the first great battle, 624
      ur: پہلی بڑی لڑائی، 624
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: استعادة مكة سلمًا عام ٦٣٠
      en: Mecca's peaceful regain in 630
      ur: 630 میں مکہ کی پُر امن واپسی
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: الدولة التي قادت المسلمين بعد النبي
      en: the state that led the Muslims after the Prophet
      ur: نبی کے بعد مسلمانوں کی قیادت کرنے والی ریاست
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: السلالة التي وسّعت الدولة
      en: the dynasty that expanded the state
      ur: وہ خاندان جس نے ریاست پھیلائی
  - term:
      ar: قرن من التوسع
      en: a century of expansion
      ur: ایک صدی کی پھیلاؤ
    gloss:
      ar: من مكة إلى الأندلس في مئة عام
      en: from Mecca to al-Andalus in a hundred years
      ur: مکہ سے الاندلس تک سو سال میں
  - term:
      ar: توحيد
      en: tawhid (God's oneness)
      ur: توحید
    gloss:
      ar: إفراد الله بالعبادة
      en: worshipping God alone
      ur: اللہ اکیلے کی عبادت
  practice:
  - q:
      ar: أين بدأ الإسلام؟
      en: Where did Islam begin?
      ur: اسلام کہاں شروع ہوا؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: نزل الوحي في مكة عام ٦١٠
        en: revelation came down in Mecca in 610
        ur: وحی 610 میں مکہ میں نازل ہوئی
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة وجهة الهجرة لا البداية
        en: Medina was the Hijra's destination
        ur: مدینہ ہجرت کی منزل تھی، آغاز نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس قبلته الأولى لا مولده
        en: Jerusalem was the first qibla, not the start
        ur: یروشلم پہلا قبلہ تھا، آغاز نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق عاصمة لاحقة
        en: Damascus was a later capital
        ur: دمشق بعد کی دارالحکومت تھی
  - q:
      ar: متى نزل الوحي أول مرة؟
      en: When did revelation first come down?
      ur: وحی پہلی بار کب نازل ہوئی؟
    options:
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: true
      why:
        ar: بدأ الوحي في غار حراء عام ٦١٠
        en: revelation began in the cave of Hira in 610
        ur: وحی غار حرا میں 610 میں شروع ہوئی
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة لا الوحي
        en: 622 is the Hijra, not the revelation
        ur: 622 ہجرت کا سال ہے، وحی کا نہیں
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ٦٣٠ عام الفتح لا الوحي
        en: 630 is the conquest, not revelation
        ur: 630 فتح کا سال ہے، وحی کا نہیں
    - text:
        ar: عام ٦٣٢
        en: in 632
        ur: 632 میں
      correct: false
      why:
        ar: ٦٣٢ عام الوفاة لا البداية
        en: 632 is the passing year, not the start
        ur: 632 وفات کا سال ہے، آغاز کا نہیں
  - q:
      ar: كم استمرت الدعوة في مكة؟
      en: How long did the call last in Mecca?
      ur: مکہ میں دعوت کتنے عرصے چلی؟
    options:
    - text:
        ar: ثلاثة عشر عامًا
        en: thirteen years
        ur: تیرہ سال
      correct: true
      why:
        ar: ثلاثة عشر عامًا قبل الهجرة
        en: thirteen years before the Hijra
        ur: ہجرت سے پہلے تیرہ سال
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة أعوام مدة السرية فقط
        en: three years was only the secret phase
        ur: تین سال صرف پوشیدہ مرحلہ تھا
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام مدة المدينة
        en: ten years was the Medina period
        ur: دس سال مدینہ کا عرصہ تھا
    - text:
        ar: خمسة وعشرون
        en: twenty-five
        ur: پچیس
      correct: false
      why:
        ar: ثلاثة وعشرون مجموع الدعوة كلها
        en: twenty-three was the whole mission
        ur: تئیس کل دعوت کا عرصہ تھا
  - q:
      ar: إلى أين هاجر المسلمون؟
      en: Where did the Muslims migrate?
      ur: مسلمان کہاں ہجرت کر گئے؟
    options:
    - text:
        ar: يثرب — المدينة
        en: Yathrib — Medina
        ur: یثرب — مدینہ
      correct: true
      why:
        ar: هاجروا إلى يثرب فصارت المدينة
        en: they migrated to Yathrib, which became Medina
        ur: وہ یثرب ہجرت کر گئے جو مدینہ بنی
    - text:
        ar: الطائف
        en: Taif
        ur: طائف
      correct: false
      why:
        ar: الطائف زارها ولم يهاجر إليها
        en: Taif he visited but did not settle
        ur: طائف وہ گیا مگر وہاں نہیں رہا
    - text:
        ar: الحبشة مرة ثانية
        en: Abyssinia again
        ur: دوبارہ حبشہ
      correct: false
      why:
        ar: الحبشة هجرة أولى جزئية
        en: Abyssinia was an earlier partial migration
        ur: حبشہ پہلی جزوی ہجرت تھی
    - text:
        ar: الشام
        en: Syria
        ur: شام
      correct: false
      why:
        ar: الشام لم تكن وجهته
        en: Syria was not his destination
        ur: شام اس کی منزل نہیں تھی
  - q:
      ar: كيف استُعيدت مكة؟
      en: How was Mecca regained?
      ur: مکہ کیسے واپس آیا؟
    options:
    - text:
        ar: سلمًا عام ٦٣٠
        en: peacefully in 630
        ur: 630 میں امن سے
      correct: true
      why:
        ar: دخلها بلا قتال تقريبًا عام ٦٣٠
        en: he entered it nearly bloodlessly in 630
        ur: اس نے 630 میں تقریباً بغیر لڑائی داخل کیا
    - text:
        ar: بحصار طويل
        en: by a long siege
        ur: طویل محاصرے سے
      correct: false
      why:
        ar: لم يحاصرها بل دخلها
        en: he did not besiege it but entered
        ur: اس نے محاصرہ نہیں کیا بل داخل ہوا
    - text:
        ar: بمعركة كبرى
        en: by a great battle
        ur: بڑی لڑائی سے
      correct: false
      why:
        ar: لم تكن معركة بل فتح سلمي
        en: it was a peaceful opening, not a battle
        ur: یہ لڑائی نہیں بل امن تھی
    - text:
        ar: لم تُستعد
        en: it was never regained
        ur: کبھی واپس نہیں آیا
      correct: false
      why:
        ar: استعادها عام ٦٣٠
        en: it was regained in 630
        ur: یہ 630 میں واپس آیا
  - q:
      ar: من حكم بعد النبي؟
      en: Who ruled after the Prophet?
      ur: نبی کے بعد کس نے حکومت کی؟
    options:
    - text:
        ar: الخلفاء
        en: the caliphs
        ur: خلفاء
      correct: true
      why:
        ar: الخلفاء الراشدون ثم الأمويون
        en: the rightly-guided caliphs, then Umayyads
        ur: راشدین خلفاء، پھر اموی
    - text:
        ar: السلاطين
        en: the sultans
        ur: سلاطین
      correct: false
      why:
        ar: السلاطين لقب متأخر
        en: sultan is a later title
        ur: سلطان بعد کا لقب ہے
    - text:
        ar: الأباطرة
        en: the emperors
        ur: شہنشاہ
      correct: false
      why:
        ar: ليس أباطرة بل خلفاء
        en: caliphs, not emperors
        ur: شہنشاہ نہیں، خلفاء
    - text:
        ar: الملوك
        en: the kings
        ur: بادشاہ
      correct: false
      why:
        ar: الخلفاء لا ملوك في البدء
        en: caliphs led first, not kings
        ur: پہلے خلفاء تھے، بادشاہ نہیں
  - q:
      ar: إلى أين امتدت الدولة الأموية؟
      en: How far did the Umayyad state reach?
      ur: اموی ریاست کہاں تک پھیلی؟
    options:
    - text:
        ar: من الأندلس إلى الهند
        en: from al-Andalus to India
        ur: الاندلس سے ہندوستان تک
      correct: true
      why:
        ar: امتدت غربًا إلى الأندلس وشرقًا إلى الهند
        en: it stretched west to al-Andalus and east to India
        ur: یہ مغرب میں الاندلس اور مشرق میں ہندوستان تک پھیلی
    - text:
        ar: الجزيرة فقط
        en: Arabia only
        ur: صرف جزیرہ
      correct: false
      why:
        ar: لم تقف عند الجزيرة
        en: it did not stop at Arabia
        ur: یہ جزیرے پر نہیں رکی
    - text:
        ar: الشام ومصر فقط
        en: Syria and Egypt only
        ur: صرف شام اور مصر
      correct: false
      why:
        ar: أوسع من الشام ومصر
        en: wider than Syria and Egypt
        ur: شام اور مصر سے زیادہ وسیع
    - text:
        ar: أوروبا كلها
        en: all of Europe
        ur: پورا یورپ
      correct: false
      why:
        ar: لم تبلغ كل أوروبا
        en: it did not reach all Europe
        ur: یہ پورے یورپ تک نہیں پہنچی
  - q:
      ar: ما «التوحيد» الذي دعا إليه؟
      en: What is the tawhid he preached?
      ur: اس کی توحید کیا ہے؟
    options:
    - text:
        ar: إفراد الله بالعبادة
        en: worshipping God alone
        ur: اللہ اکیلے کی عبادت
      correct: true
      why:
        ar: دعوة إلى توحيد الله وترك الأصنام
        en: a call to God's oneness leaving idols
        ur: اللہ کی وحدانیت اور بتوں کی چھٹی کی دعوت
    - text:
        ar: عبادة الأصنام
        en: worshipping idols
        ur: بتوں کی عبادت
      correct: false
      why:
        ar: عكس دعوته تمامًا
        en: the opposite of his call
        ur: اس کی دعوت کے بالکل برعکس
    - text:
        ar: ثلاثة آلهة
        en: three gods
        ur: تین معبود
      correct: false
      why:
        ar: ليس ثلاثة بل توحيد
        en: oneness, not three
        ur: تین نہیں، وحدانیت
    - text:
        ar: لا إله
        en: no god
        ur: کوئی معبود نہیں
      correct: false
      why:
        ar: ليس نفيًا بل توحيد الله
        en: God's oneness, not denial
        ur: انکار نہیں، اللہ کی وحدانیت
  - q:
      ar: كم استغرق انتشار الحضارة؟
      en: How long did the civilisation's spread take?
      ur: تہذیب کا پھیلاؤ کتنے عرصے میں ہوا؟
    options:
    - text:
        ar: أقل من قرن
        en: under a century
        ur: ایک صدی سے کم
      correct: true
      why:
        ar: من ٦١٠ إلى الأندلس في نحو مئة عام
        en: from 610 to al-Andalus in about a hundred years
        ur: 610 سے الاندلس تک تقریباً سو سال میں
    - text:
        ar: خمسة قرون
        en: five centuries
        ur: پانچ صدیاں
      correct: false
      why:
        ar: أقل من قرن لا خمسة
        en: under a century, not five
        ur: پانچ نہیں، ایک صدی سے کم
    - text:
        ar: عقد واحد
        en: one decade
        ur: ایک دہائی
      correct: false
      why:
        ar: عقد قليل جدًا للانتشار
        en: a decade is too short for the spread
        ur: پھیلاؤ کے لیے دہائی بہت کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: ألف عام أكثر بكثير
        en: a thousand is far more
        ur: ہزار سال بہت زیادہ ہے
  - q:
      ar: لماذا تُعدّ الهجرة محورًا؟
      en: Why is the Hijra a turning point?
      ur: ہجرت محور کیوں ہے؟
    options:
    - text:
        ar: لأنها بدأت دولة وتقويمًا
        en: it began a state and a calendar
        ur: اس نے ریاست اور تقویم شروع کیا
      correct: true
      why:
        ar: بها قامت الدولة وبدأ التقويم الهجري
        en: by it the state arose and the calendar began
        ur: اس سے ریاست قائم ہوئی اور ہجری تقویم شروع ہوا
    - text:
        ar: لأنها آخر حدث
        en: for being the last event
        ur: آخری واقعہ ہونے کے لیے
      correct: false
      why:
        ar: ليست آخر بل بداية
        en: a beginning, not the end
        ur: آخر نہیں، آغاز
    - text:
        ar: لأنها سفر فقط
        en: for being a journey only
        ur: صرف سفر ہونے کے لیے
      correct: false
      why:
        ar: ليست سفرًا بل تأسيس
        en: a founding, not just travel
        ur: صرف سفر نہیں، قیام
    - text:
        ar: لأنها سرية
        en: for being secret
        ur: پوشیدہ ہونے کے لیے
      correct: false
      why:
        ar: لم تكن سرية بل علنية
        en: it was open, not secret
        ur: یہ پوشیدہ نہیں، علانیہ تھی
- id: baghdad-silk-roads
  anchor: exhibit/pathway-g11-chw3m-baghdad-and-the-silk-roads
  band: researchers
  title:
    ar: بغداد وطرق الحرير
    en: Baghdad and the Silk Roads
    ur: بغداد اور ریشم کے راستے
  sixty:
    ar: بنى المنصور بغداد عام ٧٦٢ مدينة مدوّرة على ملتقى طرق الحرير البرية والبحرية. جمعت المدينة تجارًا من الصين والهند وفارس والروم، فتدفقت فيها البضائع والكتب
      والأفكار. وفي عصر المأمون صارت أعظم مدن العالم عددًا وعلمًا، وبقيت عاصمة العباسيين خمسة قرون حتى سقطت بيد المغول عام ١٢٥٨.
    en: Al-Mansur built Baghdad in 762 as a round city at the meeting of land and sea Silk Roads. It drew traders from China, India, Persia and Rome, so goods, books
      and ideas flowed through it. In al-Ma'mun's era it became the world's greatest city in number and learning, and stayed the Abbasid capital for five centuries
      until the Mongols took it in 1258.
    ur: منصور نے 762 میں بغداد کو خشکی اور سمندری ریشم راستوں کے سنگم پر ایک گول شہر بنایا۔ اس نے چین، ہند، فارس اور روم کے تاجروں کو کھینچا تو مال، کتابیں اور افکار
      اس میں بہتے رہے۔ مامون کے عہد میں یہ آبادی اور علم میں دنیا کا سب سے بڑا شہر بنا اور پانچ صدیوں عباسی پایہ تخت رہی یہاں تک کہ 1258 میں منگولوں نے لے لیا۔
  glossary:
  - term:
      ar: المنصور
      en: al-Mansur
      ur: منصور
    gloss:
      ar: الخليفة الذي بناها عام ٧٦٢
      en: the caliph who built it in 762
      ur: وہ خلیفہ جس نے 762 میں بنائی
  - term:
      ar: المدينة المدوّرة
      en: the round city
      ur: گول شہر
    gloss:
      ar: شكل بغداد الدائري الأول
      en: Baghdad's first circular design
      ur: بغداد کی پہلی دائروی بناؤ
  - term:
      ar: طريق الحرير
      en: the Silk Road
      ur: ریشم کا راستہ
    gloss:
      ar: طرق التجارة بين الصين والغرب
      en: the trade routes between China and the West
      ur: چین اور مغرب کے درمیان تجارتی راستے
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: السلالة التي عاصمتها بغداد
      en: the dynasty whose capital was Baghdad
      ur: وہ خاندان جس کا پایہ تخت بغداد تھا
  - term:
      ar: بيت الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: دار العلم والترجمة فيها
      en: its house of learning and translation
      ur: اس میں علم اور ترجمہ کا گھر
  - term:
      ar: المأمون
      en: al-Ma'mun
      ur: المامون
    gloss:
      ar: الخليفة الذي بلغ علمها الذروة
      en: the caliph under whom its learning peaked
      ur: وہ خلیفہ جس کے عہد میں علم عروج پر تھا
  - term:
      ar: دجلة
      en: the Tigris
      ur: دجلہ
    gloss:
      ar: النهر الذي قامت عليه
      en: the river it stands on
      ur: وہ دریا جس پر یہ قائم ہے
  - term:
      ar: التجار
      en: the merchants
      ur: تاجر
    gloss:
      ar: أصحاب البضائع من كل جهة
      en: goods-bearers from every direction
      ur: ہر سمت سے مال لانے والے
  - term:
      ar: سقوط بغداد
      en: the fall of Baghdad
      ur: بغداد کا سقوط
    gloss:
      ar: ١٢٥٨ نهاية الخلافة العباسية
      en: 1258, the Abbasid caliphate's end
      ur: 1258ء، عباسی خلافت کا خاتمہ
  - term:
      ar: السند
      en: India
      ur: ہند
    gloss:
      ar: جهة التجارة الشرقية للمدينة
      en: the city's eastern trade direction
      ur: شہر کی مشرقی تجارتی سمت
  - term:
      ar: الطرق البحرية
      en: the sea routes
      ur: سمندری راستے
    gloss:
      ar: مسالك المحيط الهندي التجارية
      en: the Indian Ocean trade lanes
      ur: بحر ہند کی تجارتی راہیں
  - term:
      ar: خمسة قرون
      en: five centuries
      ur: پانچ صدیاں
    gloss:
      ar: مدة بقائها عاصمة
      en: how long it stayed capital
      ur: یہ کتنی مدت پایہ تخت رہی
  practice:
  - q:
      ar: من بناها ومتى؟
      en: Who built it and when?
      ur: اسے کس نے اور کب بنایا؟
    options:
    - text:
        ar: المنصور عام ٧٦٢
        en: al-Mansur in 762
        ur: منصور نے 762 میں
      correct: true
      why:
        ar: الخليفة المنصور بناها عام ٧٦٢
        en: Caliph al-Mansur built it in 762
        ur: خلیفہ منصور نے 762 میں بنائی
    - text:
        ar: هارون عام ٨٠٠
        en: Harun in 800
        ur: ہارون نے 800 میں
      correct: false
      why:
        ar: هارون بعد بانيها
        en: Harun came after its builder
        ur: ہارون بانی کے بعد تھا
    - text:
        ar: المأمون عام ٨٣٠
        en: al-Ma'mun in 830
        ur: المامون نے 830 میں
      correct: false
      why:
        ar: المأمون ابن هارون لا الباني
        en: al-Ma'mun was Harun's son, not founder
        ur: المامون ہارون کا بیٹا تھا، بانی نہیں
    - text:
        ar: المعتصم عام ٨٤٠
        en: al-Mu'tasim in 840
        ur: المعتصم نے 840 میں
      correct: false
      why:
        ar: المعتصم بعد الباني بقرون
        en: al-Mu'tasim came generations later
        ur: المعتصم نسلوں بعد تھا
  - q:
      ar: ما شكلها الأول؟
      en: What was its first shape?
      ur: اس کی پہلی شکل کیا تھی؟
    options:
    - text:
        ar: مدينة مدوّرة
        en: a round city
        ur: گول شہر
      correct: true
      why:
        ar: بناها المنصور دائرية
        en: al-Mansur built it circular
        ur: منصور نے اسے دائروی بنایا
    - text:
        ar: مربعة
        en: square
        ur: چوکور
      correct: false
      why:
        ar: ليست مربعة بل مدوّرة
        en: round, not square
        ur: چوکور نہیں، گول
    - text:
        ar: نجمية
        en: star-shaped
        ur: ستارہ نما
      correct: false
      why:
        ar: ليست نجمية بل دائرية
        en: circular, not star-shaped
        ur: ستارہ نما نہیں، دائروی
    - text:
        ar: مثلثة
        en: triangular
        ur: تکونی
      correct: false
      why:
        ar: ليست مثلثة
        en: not triangular
        ur: تکونی نہیں
  - q:
      ar: أيّ نهر قامت عليه؟
      en: Which river is it on?
      ur: یہ کس دریا پر ہے؟
    options:
    - text:
        ar: دجلة
        en: the Tigris
        ur: دجلہ
      correct: true
      why:
        ar: قامت على ضفاف دجلة
        en: it stands on the Tigris' banks
        ur: یہ دجلہ کے کنارے قائم ہے
    - text:
        ar: الفرات
        en: the Euphrates
        ur: فرات
      correct: false
      why:
        ar: الفرات قريب لا عليه
        en: the Euphrates is near, not under it
        ur: فرات قریب ہے، اس پر نہیں
    - text:
        ar: النيل
        en: the Nile
        ur: نیل
      correct: false
      why:
        ar: النيل في مصر لا بغداد
        en: the Nile is in Egypt
        ur: نیل مصر میں ہے
    - text:
        ar: الأردن
        en: the Jordan
        ur: اردن
      correct: false
      why:
        ar: الأردن بعيد عنها
        en: the Jordan is far from it
        ur: اردن اس سے دور ہے
  - q:
      ar: ما «طريق الحرير»؟
      en: What is the Silk Road?
      ur: ریشم کا راستہ کیا ہے؟
    options:
    - text:
        ar: طرق تجارة بين الصين والغرب
        en: trade routes China–West
        ur: چین تا مغرب تجارتی راستے
      correct: true
      why:
        ar: شبكة طرق برية وبحرية للتجارة
        en: a web of land and sea trade routes
        ur: خشکی اور سمندری تجارتی راستوں کا جال
    - text:
        ar: شارع واحد
        en: one street
        ur: ایک گلی
      correct: false
      why:
        ar: ليست شارعًا بل شبكة
        en: a network, not one street
        ur: ایک گلی نہیں، جال
    - text:
        ar: نهر للتجارة
        en: a trade river
        ur: تجارتی دریا
      correct: false
      why:
        ar: ليست نهرًا بل طرق
        en: routes, not a river
        ur: دریا نہیں، راستے
    - text:
        ar: سكة حديد
        en: a railway
        ur: ریلوے
      correct: false
      why:
        ar: ليست حديدًا بل قوافل
        en: caravans, not rails
        ur: ریلوے نہیں، قافلے
  - q:
      ar: من جمعت في أسواقها؟
      en: Whom did its markets gather?
      ur: اس کے بازار کس کو جمع کرتے تھے؟
    options:
    - text:
        ar: تجار الصين والهند وفارس
        en: traders of China, India, Persia
        ur: چین، ہند، فارس کے تاجر
      correct: true
      why:
        ar: تجار من كل الجهات يجلبون البضائع
        en: traders from every direction bringing goods
        ur: ہر سمت کے تاجر مال لاتے
    - text:
        ar: بحارة أوروبا فقط
        en: only European sailors
        ur: صرف یورپی ملاح
      correct: false
      why:
        ar: ليست أوروبا فقط بل آسيا
        en: Asia more than Europe
        ur: صرف یورپ نہیں، ایشیا
    - text:
        ar: جنود مغول
        en: Mongol soldiers
        ur: منگول سپاہی
      correct: false
      why:
        ar: ليست جنودًا بل تجارًا
        en: traders, not soldiers
        ur: سپاہی نہیں، تاجر
    - text:
        ar: رحالة فقط
        en: only travellers
        ur: صرف مسافر
      correct: false
      why:
        ar: ليست رحالة بل تجارة
        en: trade, not just travellers
        ur: صرف مسافر نہیں، تجارت
  - q:
      ar: في عصر من بلغ علمها الذروة؟
      en: Under whom did its learning peak?
      ur: کس کے عہد میں اس کا علم عروج پر تھا؟
    options:
    - text:
        ar: المأمون
        en: al-Ma'mun
        ur: المامون
      correct: true
      why:
        ar: في عصر المأمون ازدهر بيت الحكمة
        en: in al-Ma'mun's era the House of Wisdom flourished
        ur: المامون کے عہد میں بیت الحکمت پھلا
    - text:
        ar: الوليد
        en: al-Walid
        ur: الولید
      correct: false
      why:
        ar: الوليد أموي لا عباسي
        en: al-Walid was Umayyad, not Abbasid
        ur: الولید اموی تھا، عباسی نہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: عبد الملك أموي قبلها
        en: Abd al-Malik was an earlier Umayyad
        ur: عبدالملک پہلا اموی تھا
    - text:
        ar: سليمان العثماني
        en: Ottoman Süleyman
        ur: عثمانی سلیمان
      correct: false
      why:
        ar: سليمان عثماني بعد بقرون
        en: Süleyman was Ottoman, centuries later
        ur: سلیمان عثمانی تھا، صدیاں بعد
  - q:
      ar: كم بقيت عاصمة؟
      en: How long was it capital?
      ur: یہ کتنے عرصے پایہ تخت رہی؟
    options:
    - text:
        ar: نحو خمسة قرون
        en: about five centuries
        ur: تقریباً پانچ صدیاں
      correct: true
      why:
        ar: من ٧٦٢ إلى ١٢٥٨ نحو خمسة قرون
        en: from 762 to 1258, about five centuries
        ur: 762 تا 1258، تقریباً پانچ صدیاں
    - text:
        ar: قرن واحد
        en: one century
        ur: ایک صدی
      correct: false
      why:
        ar: قرن أقل بكثير
        en: a century is far less
        ur: ایک صدی بہت کم ہے
    - text:
        ar: عشرة قرون
        en: ten centuries
        ur: دس صدیاں
      correct: false
      why:
        ar: عشرة قرون أكثر
        en: ten centuries is more
        ur: دس صدیاں زیادہ ہیں
    - text:
        ar: عقد واحد
        en: one decade
        ur: ایک دہائی
      correct: false
      why:
        ar: عقد قليل جدًا
        en: a decade is far too short
        ur: ایک دہائی بہت کم ہے
  - q:
      ar: كيف انتهت عاصمتها؟
      en: How did its capital era end?
      ur: اس کا عہدِ پایہ تخت کیسے ختم ہوا؟
    options:
    - text:
        ar: سقطت بيد المغول ١٢٥٨
        en: fell to the Mongols, 1258
        ur: 1258 میں منگولوں کے ہاتھ گری
      correct: true
      why:
        ar: سقطت بغداد بيد هولاكو عام ١٢٥٨
        en: Baghdad fell to Hulagu in 1258
        ur: بغداد 1258 میں ہلاکو کے ہاتھ گرا
    - text:
        ar: زلزال دمّرها
        en: an earthquake razed it
        ur: زلزلے نے مٹا دیا
      correct: false
      why:
        ar: لم يكن زلزالاً بل مغول
        en: Mongols, not earthquake
        ur: زلزلہ نہیں، منگول
    - text:
        ar: غرقها النهر
        en: the river drowned it
        ur: دریا نے ڈبو دیا
      correct: false
      why:
        ar: لم يغرقها النهر
        en: the river did not drown it
        ur: دریا نے نہیں ڈبویا
    - text:
        ar: تركها الخلفاء
        en: the caliphs left it
        ur: خلفاء نے چھوڑ دیا
      correct: false
      why:
        ar: لم يتركوها بل سقطت
        en: it fell; they did not leave
        ur: انھوں نے نہیں چھوڑا، گرا
  - q:
      ar: ماذا تدفق فيها مع البضائع؟
      en: What flowed in with the goods?
      ur: مال کے ساتھ کیا بہتا آیا؟
    options:
    - text:
        ar: الكتب والأفكار
        en: books and ideas
        ur: کتابیں اور افکار
      correct: true
      why:
        ar: جاءت البضائع والكتب والأفكار معًا
        en: goods, books and ideas came together
        ur: مال، کتابیں اور افکار ساتھ آئے
    - text:
        ar: الجنود فقط
        en: only soldiers
        ur: صرف سپاہی
      correct: false
      why:
        ar: ليست جنودًا بل أفكار
        en: ideas, not soldiers
        ur: سپاہی نہیں، افکار
    - text:
        ar: لا شيء غير الذهب
        en: only gold
        ur: صرف سونا
      correct: false
      why:
        ar: ليست ذهبًا بل كتب وأفكار
        en: books and ideas, not just gold
        ur: صرف سونا نہیں، کتابیں اور افکار
    - text:
        ar: العبيد فقط
        en: only slaves
        ur: صرف غلام
      correct: false
      why:
        ar: ليست عبيدًا بل معرفة
        en: knowledge, not just slaves
        ur: صرف غلام نہیں، علم
  - q:
      ar: لماذا تُعدّ مركزًا عالميًا؟
      en: Why is it a world centre?
      ur: یہ عالمی مرکز کیوں ہے؟
    options:
    - text:
        ar: لموقعها وعلمها
        en: for its place and learning
        ur: مقام اور علم کے لیے
      correct: true
      why:
        ar: ملتقى الطرق ودار العلم جعلاها مركزًا
        en: the routes' junction and the learning house made it a centre
        ur: راستوں کا سنگم اور علم کا گھر اسے مرکز بنایا
    - text:
        ar: لحجمها فقط
        en: for size only
        ur: صرف وسعت کے لیے
      correct: false
      why:
        ar: ليست حجمًا بل موقع وعلم
        en: place and learning, not just size
        ur: صرف وسعت نہیں، مقام اور علم
    - text:
        ar: لقصرها
        en: for its palace
        ur: محل کے لیے
      correct: false
      why:
        ar: ليست قصرًا بل مركز علم
        en: a learning centre, not a palace
        ur: محل نہیں، علمی مرکز
    - text:
        ar: لجيشها
        en: for its army
        ur: لشکر کے لیے
      correct: false
      why:
        ar: ليست جيشًا بل تجارة وعلم
        en: trade and learning, not army
        ur: لشکر نہیں، تجارت اور علم
- id: al-andalus
  anchor: exhibit/pathway-g11-chw3m-al-andalus
  band: researchers
  title:
    ar: الأندلس
    en: Al-Andalus
    ur: الاندلس
  sixty:
    ar: فتح المسلمون أيبيريا عام ٧١١ وحكموها ثمانية قرون. قامت قرطبة عاصمةً عبّرت عن ازدهار العلم والتجارة، فبناها الأمويون أكبر مدينة في الغرب بمكتباتها وجامعها
      الكبير. وبعد سقوط الخلافة صارت ممالك الطوائف ثم المرابطون والموحدون، حتى بقيت غرناطة وحدها فسقطت عام ١٤٩٢. وتركت الأندلس عمائر وعلومًا وذاكرة تعايش فيها المسلمون
      والمسيحيون واليهود.
    en: Muslims took Iberia in 711 and ruled it for eight centuries. Cordoba stood as a capital that showed off learning and trade — the Umayyads made it the West's
      largest city with its libraries and great mosque. After the caliphate fell it became taifa kingdoms, then the Almoravids and Almohads, until only Granada remained
      and fell in 1492. Al-Andalus left monuments, sciences and a memory of Muslims, Christians and Jews living side by side.
    ur: مسلمانوں نے 711 میں ایبریا فتح کی اور آٹھ صدیوں حکومت کی۔ قرطبہ پایہ تخت بنا جو علم اور تجارت کی شان دکھاتا تھا — امویوں نے اسے کتب خانوں اور جامع مسجد کے
      ساتھ مغرب کا سب سے بڑا شہر بنایا۔ خلافت کے گرنے کے بعد طائفہ بادشاہتیں پھر مرابطین اور موحدین آئے، یہاں تک کہ صرف غرناطہ بچا جو 1492 میں گرا۔ الاندلس نے یادگاریں،
      علوم اور مسلمان، مسیحی اور یہودی کے ساتھ رہنے کی یاد چھوڑی۔
  glossary:
  - term:
      ar: الأندلس
      en: al-Andalus
      ur: الاندلس
    gloss:
      ar: اسم أيبيريا المسلمة
      en: the name for Muslim Iberia
      ur: مسلم ایبریا کا نام
  - term:
      ar: فتح أيبيريا
      en: the conquest of Iberia
      ur: ایبریا کی فتح
    gloss:
      ar: ٧١١ دخول المسلمين شبه الجزيرة
      en: 711, the Muslims' entry into the peninsula
      ur: 711ء، مسلمانوں کا جزیرہ نما میں داخلہ
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطبہ
    gloss:
      ar: العاصمة التي صارت أكبر مدن الغرب
      en: the capital that became the West's largest city
      ur: پایہ تخت جو مغرب کا بڑا شہر بنا
  - term:
      ar: ممالك الطوائف
      en: the taifa kingdoms
      ur: طائفہ ریاستیں
    gloss:
      ar: دول صغيرة بعد سقوط الخلافة
      en: small states after the caliphate's fall
      ur: خلافت کے گرنے کے بعد چھوٹی ریاستیں
  - term:
      ar: المرابطون
      en: the Almoravids
      ur: مرابطین
    gloss:
      ar: سلالة من المغرب حكمت بعد الطوائف
      en: a Moroccan dynasty ruling after the taifas
      ur: مراکش کا خاندان جو طائفہ کے بعد آیا
  - term:
      ar: الموحدون
      en: the Almohads
      ur: موحدین
    gloss:
      ar: السلالة التالية بعد المرابطين
      en: the dynasty following the Almoravids
      ur: مرابطین کے بعد آنے والا خاندان
  - term:
      ar: غرناطة
      en: Granada
      ur: غرناطہ
    gloss:
      ar: آخر ممالك الأندلس حتى ١٤٩٢
      en: al-Andalus's last kingdom, till 1492
      ur: الاندلس کی آخری بادشاہت، 1492 تک
  - term:
      ar: طارق
      en: Tariq
      ur: طارق
    gloss:
      ar: القائد الذي قاد الفتح
      en: the commander who led the conquest
      ur: وہ سردار جس نے فتح کی قیادت کی
  - term:
      ar: جبل طارق
      en: Gibraltar
      ur: جبل الطارق
    gloss:
      ar: المضيق المسمى باسم طارق
      en: the strait named after Tariq
      ur: طارق کے نام پر آبنائے
  - term:
