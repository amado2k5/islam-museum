- id: mongols-and-after
  anchor: exhibit/pathway-g11-chw3m-mongols-and-after
  band: researchers
  title:
    ar: المغول وما بعدهم
    en: The Mongols and After
    ur: منگول اور ان کے بعد
  sixty:
    ar: 'المغول وما بعدهم: عاصفة جنكيز خان التي اجتاحت آسيا ثم إعادة البناء الإسلامية. دمّر هولاكو بغداد سنة ١٢٥٨ فمات الخليفة ودمّرت المكتبات، لكن المماليك صدّوا الزحف في عين جالوت سنة ١٢٦٠ — أول هزيمة كبرى للمغول. ثم تحوّل الغزاة أنفسهم: غازان ملك الإيلخانيين اعتنق الإسلام مع جنوده، وصار تيمور بناءً آخر لسمرقند حيث أقام ألوغ بيك مرصده وجداول النجوم. وهكذا صارت المأساة معجزة: الدول المنبثقة من الغزو صارت إسلامية — إيلخانيون، مملوكيون، مغول الهند — والحضارة التي كادت تهلك قامت من جديد على الحدود التي غزاها أبناء جنكيز.  وهناك العبرة الأخيرة: من دمّر بغداد بيده ابنه حفظها — وأن الله يخرج الحيّ من الميّت، وأن حضارة القرآن أقوى من جيوش الغزاة.  وهي تذكير بأن الإسلام ليس عرقًا ولا دولة بل دعوة: دخلها الغزاة في نهاية المطاف، وصار أعظم ملوكهم خادمها.'
    en: 'The Mongols and after: Genghis Khan''s storm that swept Asia, then the Islamic rebuilding. Hulagu destroyed Baghdad in 1258 — the caliph died and the libraries burned — but the Mamluks stopped the tide at Ayn Jalut in 1260, the Mongols'' first great defeat. Then the conquerors themselves changed: Ghazan the Ilkhanid king took Islam with his soldiers, and Timur became another builder of Samarkand where Ulugh Beg raised his observatory and star tables. So the calamity turned to wonder: the states born of the invasion became Islamic — Ilkhanids, Mamluks, Mughal India — and the civilisation that nearly perished rose again on the very frontiers Genghis''s sons had raided.  There lies the last lesson: the hand that razed Baghdad — his son preserved her; and God brings the living from the dead, for the Qur''an''s civilisation is stronger than raiders'' armies.'
    ur: 'مغول اور ان کے بعد: چنگیز خان کا وہ طوفان جو ایشیا پر گزرا، اور پھر اسلامی تعمیرِ نو۔ ہلاکو نے 1258ء میں بغداد تباہ کیا — خلیفہ مارا گیا اور کتب خانے جل گئے — مگر ممالیک نے 1260ء میں عین جالوت پر لہر روکی، مغولوں کی پہلی بڑی شکست۔ پھر خود فاتحین بدل گئے: ایلخانی بادشاہ غازان اپنے لشکر سمیت مسلمان ہوا، اور تیمور سمرقند کا دوسرا معمار بنا جہاں الغ بیگ نے رصد گاہ اور ستاروں کی جدولیں بنائیں۔ اس طرح آفت معجزہ بنی: حملے سے نکلی ریاستیں مسلمان ہوئیں — ایلخانی، ممالیک، مغل ہندوستان — اور وہ تہذیب جو مٹنے کے قریب تھی چنگیز کے بیٹوں کے لوٹے ہوئے سرحدوں پر پھر اٹھ کھڑی ہوئی۔  یہیں آخری سبق ہے: جس ہاتھ نے بغداد تباہ کیا اس کا بیٹا اس کی حفاظت کرتا ہے — اور خدا مردے سے زندہ نکالتا ہے، کیونکہ قرآن کی تہذیب حملہ آوروں کے لشکروں سے مضبوط ہے۔'
  glossary:
  - term:
      ar: جنكيز خان
      en: Genghis Khan
      ur: چنگیز خان
    gloss:
      ar: 'المؤسّس الذي أطلق العاصفة'
      en: 'the founder who loosed the storm'
      ur: 'وہ بانی جس نے طوفان برپا کیا'
  - term:
      ar: هولاكو
      en: Hulagu
      ur: ہلاکو
    gloss:
      ar: 'حفيده الذي أخذ بغداد'
      en: 'his grandson who took Baghdad'
      ur: 'اس کا پوتا جس نے بغداد لیا'
  - term:
      ar: سقوط بغداد
      en: the fall of Baghdad
      ur: بغداد کا سقوط
    gloss:
