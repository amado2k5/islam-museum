      ur: 'دجلہ پر خلافت کا شہر'
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطبہ
    gloss:
      ar: 'مدينة الأندلس على الغرب'
      en: 'al-Andalus''s city on the west'
      ur: 'مغرب میں اندلس کا شہر'
