      en: 'the sultan at the state''s peak'
      ur: 'ریاست کے عروج پر سلطان'
  - term:
      ar: محمد الفاتح
      en: Mehmed the Conqueror
      ur: محمد فاتح
    gloss:
      ar: 'السلطان الذي فتح القسطنطينية'
      en: 'the sultan who took Constantinople'
      ur: 'وہ سلطان جس نے قسطنطنیہ فتح کی'
  - term:
