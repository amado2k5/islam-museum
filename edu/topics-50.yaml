      en: the millions
      ur: لاکھوں
    gloss:
      ar: 'عدد الحجّاج كلّ سنة'
      en: 'the pilgrims'' number each year'
      ur: 'ہر سال حاجیوں کی تعداد'
  practice:
  - q:
      ar: ما ركن الحج؟
      en: Which pillar is the Hajj?
      ur: حج کون سا رکن ہے؟
    options:
    - text:
        ar: الخامس
        en: the fifth
        ur: پانچواں
      correct: true
      why:
        ar: الحج الركن الخامس والأخير
        en: the Hajj is the fifth and last pillar
        ur: حج پانچواں اور آخری رکن ہے
    - text:
        ar: الأول
        en: the first
        ur: پہلا
      correct: false
      why:
        ar: الأول الشهادة لا الحج
        en: the first is the testimony
        ur: پہلا شہادت ہے
    - text:
        ar: الثالث
        en: the third
        ur: تیسرا
      correct: false
      why:
        ar: الثالث الزكاة لا الحج
        en: the third is zakat
        ur: تیسرا زکوٰت ہے
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: الرابع الصوم لا الحج
        en: the fourth is fasting
        ur: چوتھا روزہ ہے
  - q:
      ar: إلى أين يتجه الحجاج؟
      en: Where do pilgrims head?
      ur: حاجی کہاں جاتے ہیں؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: إلى مكة من كل جهة
        en: to Mecca from every direction
        ur: ہر سمت سے مکہ
    - text:
        ar: المدينة فقط
        en: only Medina
        ur: صرف مدینہ
      correct: false
      why:
        ar: الحج إلى مكة لا المدينة
        en: the Hajj is to Mecca, not Medina
        ur: حج مکہ کا ہے، مدینہ کا نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: الحج ليس إلى القدس
        en: the Hajj is not to Jerusalem
        ur: حج یروشلم کا نہیں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة طريق لا وجهة
        en: Cairo is a way, not the goal
        ur: قاہرہ راستہ ہے، منزل نہیں
  - q:
      ar: ماذا يلبسون؟
      en: What do they wear?
      ur: وہ کیا پہنتے ہیں؟
    options:
    - text:
        ar: ثيابًا بيضاء موحدة
        en: the same white cloth
        ur: ایک جیسے سفید کپڑے
      correct: true
      why:
        ar: إحرام أبيض يساوي الجميع
        en: white ihram making all equal
        ur: سفید احرام جو سب برابر کرتا ہے
    - text:
        ar: حريرًا ملونًا
        en: coloured silk
        ur: رنگین ریشم
      correct: false
      why:
        ar: ليست حريرًا بل بياض
        en: white, not coloured silk
        ur: رنگین ریشم نہیں، سفید
    - text:
        ar: ذهبًا
        en: gold
        ur: سونا
      correct: false
      why:
        ar: ليست ذهبًا بل بياضًا
        en: white cloth, not gold
        ur: سونا نہیں، سفید کپڑے
    - text:
        ar: دروعًا
        en: armour
        ur: زرہ
      correct: false
      why:
        ar: ليست دروعًا بل ثيابًا
        en: cloth, not armour
        ur: زرہ نہیں، کپڑے
  - q:
      ar: ما الطواف؟
      en: What is tawaf?
      ur: طواف کیا ہے؟
    options:
    - text:
        ar: دوران حول الكعبة سبعًا
        en: circling the Kaaba seven times
        ur: کعبہ کے سات چکر
      correct: true
      why:
        ar: سبعة أشواط حول الكعبة
        en: seven rounds around the Kaaba
        ur: کعبہ کے گرد سات چکر
    - text:
        ar: ركض في الصحراء
        en: desert running
        ur: صحرا میں دوڑنا
      correct: false
      why:
        ar: ليست ركضًا بل دوران
        en: circling, not running
        ur: دوڑنا نہیں، چکر
    - text:
        ar: صلاة الليل
        en: night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: ليست صلاة بل طواف
        en: circling, not prayer
        ur: نماز نہیں، طواف
    - text:
        ar: جلوس في المسجد
        en: sitting in mosque
        ur: مسجد میں بیٹھنا
      correct: false
      why:
        ar: ليست جلوسًا بل دوران
        en: circling, not sitting
        ur: بیٹھنا نہیں، چکر
  - q:
      ar: أين يقف الحجاج؟
      en: Where do pilgrims stand?
      ur: حاجی کہاں کھڑے ہوتے ہیں؟
    options:
    - text:
        ar: عرفة
        en: at Arafah
        ur: عرفات
      correct: true
      why:
        ar: يقفون في عرفة يوم التاسع
        en: they stand at Arafah on the ninth
        ur: وہ نویں دن عرفات میں کھڑے ہوتے ہیں
    - text:
        ar: الكعبة فقط
        en: only the Kaaba
        ur: صرف کعبہ
      correct: false
      why:
        ar: الوقوف في عرفة لا الكعبة
        en: the standing is at Arafah, not the Kaaba
        ur: کھڑا ہونا عرفات میں ہے، کعبہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: ليست المدينة بل عرفة
        en: Arafah, not Medina
        ur: مدینہ نہیں، عرفات
    - text:
        ar: جدة
        en: Jeddah
        ur: جدہ
      correct: false
      why:
        ar: ليست جدة بل عرفة
        en: Arafah, not Jeddah
        ur: جدہ نہیں، عرفات
  - q:
      ar: ما الجمرات؟
      en: What are the jamarat?
      ur: کنکریاں کیا ہیں؟
    options:
    - text:
        ar: حجارة يقذفها الحجاج
        en: pillars pilgrims stone
        ur: وہ ستون جن پر کنکریاں پھینکتے ہیں
      correct: true
      why:
        ar: رمي الجمرات في منى
        en: casting the stones in Mina
        ur: منیٰ میں کنکریاں پھینکنا
    - text:
        ar: قباب صغيرة
        en: small domes
        ur: چھوٹے گنبد
      correct: false
      why:
        ar: ليست قبابًا بل جمرات
        en: stoned pillars, not domes
        ur: گنبد نہیں، جمرات
    - text:
        ar: آبار ماء
        en: water wells
        ur: پانی کے کنویں
      correct: false
      why:
        ar: ليست آبارًا بل رمي
        en: stoning sites, not wells
        ur: کنویں نہیں، جمرات
    - text:
        ar: أبواب المسجد
        en: mosque gates
        ur: مسجد کے دروازے
      correct: false
      why:
        ar: ليست أبوابًا بل جمرات
        en: stoned pillars, not gates
        ur: دروازے نہیں، جمرات
  - q:
      ar: ماذا حملت طرق الحج؟
      en: What did the Hajj routes carry?
      ur: حج کے راستے کیا لے گئے؟
    options:
    - text:
        ar: الناس والتجارة والعلم
        en: people, trade and learning
        ur: لوگ، تجارت اور علم
      correct: true
      why:
        ar: نقلت الناس والبضائع والعلوم معًا
        en: they carried people, goods and learning together
        ur: وہ لوگ، مال اور علم ساتھ لے گئے
    - text:
        ar: الجنود فقط
        en: only soldiers
        ur: صرف سپاہی
      correct: false
      why:
        ar: ليست جنودًا بل كل شيء
        en: everything, not just soldiers
        ur: صرف سپاہی نہیں، سب کچھ
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: حملت كثيرًا
        en: they carried much
        ur: انھوں نے بہت کچھ لیا
    - text:
        ar: الأسلحة فقط
        en: only weapons
        ur: صرف ہتھیار
      correct: false
      why:
        ar: ليست أسلحة بل ناس وعلم
        en: people and learning, not weapons
        ur: ہتھیار نہیں، لوگ اور علم
  - q:
      ar: من أشهر حاج في التاريخ؟
      en: History's most famous pilgrim?
      ur: تاریخ کا مشہور ترین حاجی؟
    options:
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسیٰ
      correct: true
      why:
        ar: حج مانسا موسى أشهر رحلة
        en: Mansa Musa's is the most famous pilgrimage
        ur: مانسا موسیٰ کا حج مشہور ترین سفر ہے
    - text:
        ar: ابن بطّوطة فقط
        en: only Ibn Battuta
        ur: صرف ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة حج لكن موسى أشهر
        en: Ibn Battuta hajjed but Musa is famed
        ur: ابن بطوطہ نے حج کیا مگر موسیٰ مشہور
    - text:
        ar: سليمان القانوني
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان لم يحج
        en: Süleyman never hajjed
        ur: سلیمان نے حج نہیں کیا
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: صلاح الدين لم يحج معروفًا
        en: Saladin is not famed for hajj
        ur: صلاح الدین حج میں مشہور نہیں
  - q:
      ar: ما السعي؟
      en: What is sa'i?
      ur: سعی کیا ہے؟
    options:
    - text:
        ar: السير بين الصفا والمروة
        en: walking Safa to Marwa
        ur: صفا تا مروہ چلنا
      correct: true
      why:
        ar: سبعة أشواط بين الجبلين
        en: seven lengths between the two hills
        ur: دو پہاڑیوں کے درمیان سات چکر
    - text:
        ar: تسلق جبل
        en: climbing a mountain
        ur: پہاڑ چڑھنا
      correct: false
      why:
        ar: ليست تسلقًا بل سير بين جبلين
        en: walking between hills, not climbing
        ur: چڑھنا نہیں، دو پہاڑیوں کے درمیان چلنا
    - text:
        ar: صوم يوم
        en: a day's fast
        ur: ایک دن کا روزہ
      correct: false
      why:
        ar: ليست صومًا بل سعي
        en: walking, not fasting
        ur: روزہ نہیں، سعی
    - text:
        ar: ركوب بعير
        en: riding a camel
        ur: اونٹ سواری
      correct: false
      why:
        ar: ليست ركوبًا بل مشي
        en: walking, not riding
        ur: سواری نہیں، چلنا
  - q:
      ar: لماذا تُسمّى شبكة؟
      en: Why called a network?
      ur: یہ جال کیوں کہلایا؟
    options:
    - text:
        ar: لأنها تربط العالم
        en: it links the world
        ur: یہ دنیا کو جوڑتی ہے
      correct: true
      why:
        ar: تربط مسلمين من كل قارة
        en: it links Muslims from every continent
        ur: یہ ہر براعظم کے مسلمانوں کو جوڑتی ہے
    - text:
        ar: لأنها أسلاك
        en: for being wires
        ur: تاریں ہونے کے لیے
      correct: false
      why:
        ar: ليست أسلاكًا بل رحلات
        en: journeys, not wires
        ur: تاریں نہیں، سفر
    - text:
        ar: لأنها خريطة
        en: for being a map
        ur: نقشہ ہونے کے لیے
      correct: false
      why:
        ar: ليست خريطة بل شبكة رحلات
        en: a network of journeys, not a map
        ur: نقشہ نہیں، سفروں کا جال
    - text:
        ar: لأنها جدار
        en: for being a wall
        ur: دیوار ہونے کے لیے
      correct: false
      why:
        ar: ليست جدارًا بل ربط
        en: a link, not a wall
        ur: دیوار نہیں، جوڑ
