topics:
- id: crusades
  anchor: exhibit/pathway-g11-chw3m-crusades-muslim-side
  band: scholars
  title:
    ar: الحروب الصليبية
    en: the Crusades
    ur: صلیبی جنگیں
  sixty:
    ar: 'بين عامي ١٠٩٥ و١٢٩١ شنّت جيوش من غرب أوروبا سلسلة حملات على بلاد الشام ومصر وُعرفت بالحروب الصليبية. رآها مؤرخو المسلمين غزوًا أجنبيًا، بينما وصفتها كتب أوروبا بأنها حجّ مسلّح. انتصر الفرنجة في البداية لأن بلاد الشام كانت مقسّمة بين سلاطين متنافسين، فأقاموا أربع إمارات ساحلية منها الرها والقدس. وبقيت قوتهم في المدن المحصّنة أكثر مما سادت في الريف. لم تكن الحرب دينية خالصة: عقد الطرفان معاهدات وتبادلا تجارة وعلومًا، حتى قاتل المسلمون والفرنجة أحيانًا جنبًا إلى جنب. ثم وحّد صلاح الدين مصر والشام وهزمهم في حطين واستعاد القدس سنة ١١٨٧، وختم المماليك الحقبة بسقوط عكا ١٢٩١، وبقيت آثار الفرنجة في القلاع والطرق والذاكرة المشتركة. ورأينا في تلك الحقبة درسًا دائمًا: أن الفرقة تدعو الغزاة، والوحدة تسترد البلاد، وأن التعايش بين المخالفين ممكن حتى في زمن الحرب. ومن هذه البلاد حمل الغربُ بعد قرون صورةً مشوّهة عن الإسلام، فكان ردّ المؤرخين المسلمين أن الحكاية أعقد: غزو وحرب وتجارة وتعايش في آن.'
    en: 'Between 1095 and 1291, armies from western Europe mounted a series of campaigns on Syria and Egypt remembered as the Crusades. Muslim chroniclers saw a foreign invasion; European writers called it an armed pilgrimage. The Franks won early because Syria was divided among rival rulers, so they founded four coastal states, including Edessa and Jerusalem. Their strength lived in walled cities more than the countryside. The war was never purely religious: both sides signed truces, traded goods and ideas, and sometimes fought side by side. Then Saladin united Egypt and Syria, defeated them at Hattin, and recovered Jerusalem in 1187. The Mamluks ended the era at the fall of Acre in 1291, yet Frankish castles, roads and shared memory survived for centuries after. From that era we still read a lasting lesson: division invites invaders, unity recovers lands, and coexistence between rivals is possible even in wartime.'
    ur: '1095 اور 1291 کے درمیان مغربی یورپ کی فوجوں نے شام اور مصر پر ایک سلسلے میں مہمات چلائیں جو صلیبی جنگوں کے نام سے یاد کی جاتیں ہیں۔ مسلم مورخین نے انہیں غیر ملکی حملہ لکھا؛ یورپی مصنفین نے مسلح زیارت کہا۔ فرنگی شروع میں اس لیے کامیاب ہوئے کہ شام باہم جھگڑتے حکمرانوں میں بٹا تھا، اس لیے انہوں نے چار ساحلی ریاستیں بنا لیں جن میں رها اور بیت المقدس شامل تھے۔ ان کی طاقت دیہات سے زیادہ مضبوط شہروں میں رہی۔ جنگ کبھی محض مذہبی نہ رہی: دونوں فریق معاہدے کرتے، تجارت اور علم کا تبادلہ کرتے اور کبھی ساتھ ساتھ لڑتے۔ پھر صلاح الدین نے مصر اور شام متحد کیے، حطین میں شکست دی اور 1187 میں بیت المقدس واپس لیا۔ مملوکوں نے 1291 میں عکہ کے سقوط پر دور ختم کیا، مگر فرنگی قلعے، سڑکیں اور مشترک یادیں صدیوں زندہ رہیں۔ اس دور سے اب بھی ایک مستقل سبق پڑھا جاتا ہے: تقسیم حملہ آوروں کو بلاتی ہے، اتحاد سرزمین واپس دلاتا ہے، اور مخالفوں کا بقائے باہمی جنگ میں بھی ممکن ہے۔'
  glossary:
  - term:
      ar: الفرنج
      en: the Franks
      ur: فرنگی
    gloss:
      ar: 'ما سمّاه المسلمون الأوروبيين الغربيين الذين جاءوا إلى الشام في تلك الحملات'
      en: 'the name Muslims gave the western Europeans who came east on those campaigns'
      ur: 'مسلمانوں کا وہ نام جو انہوں نے ان مہموں پر مشرق آنے والے مغربی یورپیوں کو دیا'
  - term:
      ar: الإمارات الصليبية
      en: the Crusader states
      ur: صلیبی ریاستیں
    gloss:
      ar: 'أربع ممالك وإمارات أسسها الفرنجة على ساحل الشام وداخله لقرنين تقريبًا'
      en: 'the four states the Franks founded on the Syrian coast and inland for nearly two centuries'
      ur: 'فرنگیوں کی شامی ساحل اور اندرون میں قائم کردہ چار ریاستیں تقریباً دو صدیوں تک رہیں'
  - term:
      ar: عكا
      en: Acre
      ur: عکہ
    gloss:
      ar: 'المدينة الساحلية الحصينة التي سقطت سنة ١٢٩١ فانهارت معها آخر مملكة صليبية'
      en: 'the fortified coastal city whose fall in 1291 ended the last Crusader kingdom'
      ur: 'مضبوط ساحلی شہر جس کا 1291 میں سقوط آخری صلیبی ریاست کا خاتمہ تھا'
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: 'وقعة سنة ١١٨٧ التي كسر فيها صلاح الدين جيش الصليبيين وفتحت له طريق القدس'
      en: 'the 1187 battle where Saladin broke the Crusader army and opened his road to Jerusalem'
      ur: '1187 کی جنگ جس میں صلاح الدین نے صلیبی فوج کو توڑا اور بیت المقدس کا راستہ کھولا'
  - term:
      ar: الصليب
      en: the Cross
      ur: صلیب
    gloss:
      ar: 'علامة المسيحية التي اتخذها المقاتلون شعارًا ومنها اشتُق اسم الحروب نفسه'
      en: 'the Christian symbol the fighters carried as their emblem and the wars'' namesake'
      ur: 'مسیحی علامت جو لڑاکوں کا نشان بنی اور جس سے خود جنگوں کا نام پڑا'
  - term:
      ar: الهدنة
      en: the truce
      ur: صلح
    gloss:
      ar: 'اتفاقات وقف القتال التي جمعت الفريقين فترات طويلة بين جولات الحرب'
      en: 'the ceasefire agreements that held both sides for long stretches between rounds of war'
      ur: 'طویل عرصے جنگ کے دوروں کے درمیان دونوں فریقوں کو جوڑنے والے معاہدے'
  - term:
      ar: الرملة
      en: Ramla
      ur: رملہ
    gloss:
      ar: 'بلدة فلسطينية تبادلها الجانبان في هدنات متكررة فصارت عنوان التعايش'
      en: 'a Palestinian town that passed between the sides in repeated truces and came to mark coexistence'
      ur: 'ایک فلسطینی قصبہ جو بار بار معاہدوں میں دونوں فریقوں کے درمیان بدلتا رہا'
  - term:
      ar: الجهاد
      en: jihad
      ur: جہاد
    gloss:
      ar: 'اسم أطلقه المسلمون على مقاومتهم للغزو الفرنجي وارتبط بفكرة الدفاع عن الديار'
      en: 'the name Muslims gave their resistance to the Frankish invasion, tied to defending the homeland'
      ur: 'مسلمانوں کا اپنی سرزمین کے دفاع سے جڑا نام جو انہوں نے فرنگی مزاحمت کو دیا'
  - term:
      ar: القلعة
      en: the castle
      ur: قلعہ
    gloss:
      ar: 'الحصون الحجري مثل قلعة الحصن التي بناها الصليبيون وما زالت تقف اليوم'
      en: 'the stone keeps like Krak des Chevaliers the Crusaders built which still stand today'
      ur: 'پتھر کے مضبوط قلعے جیسے کراک دی شوالیے جو صلیبیوں نے بنائے اور آج بھی کھڑے ہیں'
  - term:
      ar: الأربعون سنة
      en: the forty years
      ur: چالیس سال
    gloss:
      ar: 'مدة بقاء معظم الإمارات الفرنجية قبل أن يستعيدها المسلمون تدريجًا'
      en: 'the rough span most Frankish states survived before Muslims gradually took them back'
      ur: 'تقریباً وہ دورانیہ جس میں فرنگی ریاستیں باقی رہیں قبل اس کے کہ مسلمان واپس لیں'
  - term:
      ar: المستعربة
      en: the Arabized Franks
      ur: عرب طرز کے فرنگی
    gloss:
      ar: 'فرنج الجيل الثاني الذين تكلموا العربية وعاشوا بعادات البلاد أكثر من أوروبا'
      en: 'second-generation Franks who spoke Arabic and lived by the land''s ways more than Europe''s'
      ur: 'دوسری نسل کے فرنگی جو عربی بولتے اور یورپ سے زیادہ مقامی رسموں پر جیتے تھے'
  - term:
      ar: عكا الكبرى
      en: the siege of Acre
      ur: عکہ کا محاصرہ
    gloss:
      ar: 'الحصار الطويل الذي قاده المماليك سنة ١٢٩١ فسقطت معه نهاية الوجود الصليبي'
      en: 'the long siege the Mamluks led in 1291 which brought the Crusader presence to its end'
      ur: 'لمبا محاصرہ جو 1291 میں مملوکوں نے کیا اور صلیبی موجودگی کا خاتمہ ہوا'
  practice:
  - q:
      ar: كم دامت الحروب الصليبية؟
      en: How long did the Crusades last?
      ur: صلیبی جنگیں کتنی دیر جاری رہیں؟
    options:
    - text:
        ar: نحو مائتي عام
        en: about two hundred years
        ur: تقریباً دو سو سال
      correct: true
      why:
        ar: من نداء البابا ١٠٩٥ إلى سقوط عكا ١٢٩١
        en: from the 1095 call to Acre's fall in 1291
        ur: 1095 کی پکار سے 1291 میں عکہ کے سقوط تک
    - text:
        ar: عشرون عامًا
        en: about twenty years
        ur: تقریباً بیس سال
      correct: false
      why:
        ar: هذا طول حملة واحدة فقط لا الحروب كلها
        en: that is the span of one campaign, not the whole wars
        ur: یہ تو صرف ایک مہم کا عرصہ ہے، تمام جنگوں کا نہیں
    - text:
        ar: أربعمائة عام
        en: about four hundred years
        ur: تقریباً چار سو سال
      correct: false
      why:
        ar: يتجاوز هذا عصر الحروب الصليبية بمراحل
        en: that runs well beyond the age of the Crusades
        ur: یہ صلیبی جنگوں کے زمانے سے کہیں زیادہ ہے
    - text:
        ar: عشر سنوات فقط
        en: only ten years
        ur: صرف دس سال
      correct: false
      why:
        ar: هذا عُمر إمارة صليبية واحدة صغيرة
        en: that is the life of one small Crusader state
        ur: یہ صرف ایک چھوٹی صلیبی ریاست کی عمر ہے
  - q:
      ar: لماذا نجح الفرنجة في البداية؟
      en: Why did the Franks succeed at first?
      ur: فرنگی ابتداء میں کیوں کامیاب ہوئے؟
    options:
    - text:
        ar: لأنّ بلاد الشام كانت منقسمة بين حكّام متحاربين
        en: because Syria was split among warring rulers
        ur: کیونکہ شام جنگجو حکمرانوں میں بٹا تھا
      correct: true
      why:
        ar: تذكر المصادر تفكك جبهة المقاومة قبل عودة التوحيد
        en: sources describe a divided resistance before reunification
        ur: ماخذ دوبارہ اتحاد سے پہلے کمزور مزاحمت کا ذکر کرتے ہیں
    - text:
        ar: لأنّ المسلمين لم يقاتلوا أبدًا
        en: because Muslims never fought back
        ur: کیونکہ مسلمانوں نے کبھی مزاحمت نہیں کی
      correct: false
      why:
        ar: قاتل المسلمون منذ البداية، لكنّ التنسيق كان ضعيفًا
        en: Muslims fought from the start; coordination was the weak part
        ur: مسلمان شروع سے لڑے؛ کمزوری رابطے میں تھی
    - text:
        ar: لأنّ أوروبا كانت أكثر عددًا
        en: because Europe had more people
        ur: کیونکہ یورپ کی آبادی زیادہ تھی
      correct: false
      why:
        ar: كان الجيش الصليبي صغيرًا مقارنة بجيوش المنطقة
        en: Crusader armies were small next to the region's armies
        ur: صلیبی فوجیں علاقائی فوجوں کے مقابلے میں چھوٹی تھیں
    - text:
        ar: لأنّ الفرنجة عرفوا الطرق أفضل
        en: because the Franks knew the roads better
        ur: کیونکہ فرنگی راستوں کو بہتر جانتے تھے
      correct: false
      why:
        ar: كانوا غرباء في بلاد لا يعرفونها
        en: they were newcomers in a land they did not know
        ur: وہ نئی سرزمین میں اجنبی تھے
  - q:
      ar: ماذا فعل صلاح الدين في ١١٨٧؟
      en: What did Saladin do in 1187?
      ur: صلاح الدین نے 1187 میں کیا کیا؟
    options:
    - text:
        ar: استعاد القدس بعد معركة حطين
        en: retook Jerusalem after the battle of Hattin
        ur: حطین کی جنگ کے بعد بیت المقدس واپس لیا
      correct: true
      why:
        ar: تفيد المصادر باستعادة المدينة في ربيع الأول ١١٨٧
        en: sources record the city's recovery in spring 1187
        ur: ماخذ موسم بہار 1187 میں شہر کی واپسی لکھتے ہیں
    - text:
        ar: غزا روما
        en: he invaded Rome
        ur: اس نے روم پر حملہ کیا
      correct: false
      why:
        ar: لم يغادر صلاح الدين الشرق الأوسط قط
        en: Saladin never left the Middle East
        ur: صلاح الدین کبھی مشرقِ وسطی سے باہر نہیں گیا
    - text:
        ar: أسّس إمارة صليبية
        en: he founded a Crusader state
        ur: اس نے ایک صلیبی ریاست بنائی
      correct: false
      why:
        ar: كان يوحّد المسلمين ضدّ الإمارات الصليبية
        en: he was uniting Muslims against the Crusader states
        ur: وہ مسلمانوں کو صلیبی ریاستوں کے خلاف متحد کر رہا تھا
    - text:
        ar: عقد صلحًا بقي خمسين عامًا
        en: he signed a fifty-year peace
        ur: اس نے پچاس سالہ صلح کی
      correct: false
      why:
        ar: كانت هدنه مؤقتة لا نصف قرن
        en: his truces were shorter pauses, not half a century
        ur: اس کی صلحیں عارضی وقفے تھیں، نصف صدی نہیں
  - q:
      ar: كم كان عدد الإمارات الصليبية؟
      en: How many Crusader states were there?
      ur: صلیبی ریاستیں کتنی تھیں؟
    options:
    - text:
        ar: أربع
        en: four
        ur: چار
      correct: true
      why:
        ar: إديسا وأنطاكية وطرابلس والمملكة اللاتينية
        en: Edessa, Antioch, Tripoli and the Latin kingdom
        ur: ایڈیسا، انطاکیہ، طرابلس اور لاطینی مملکت
    - text:
        ar: عشر
        en: ten
        ur: دس
      correct: false
      why:
        ar: هذا عدد المدن الرئيسية أكثر من الإمارات
        en: that is closer to the count of major cities
        ur: یہ بڑی شہر کی گنتی ہے، ریاستوں کی نہیں
    - text:
        ar: اثنتان
        en: two
        ur: دو
      correct: false
      why:
        ar: اثنتان فقط إن حُصرا بالساحل
        en: two only if you ignore inland states
        ur: صرف دو اگر اندرونی ریاستیں نظرانداز کریں
    - text:
        ar: إمارة واحدة فقط
        en: only one
        ur: صرف ایک
      correct: false
      why:
        ar: قسمت الفرنجة سيطرتهم إلى أربع ممالك
        en: the Franks split their holdings into four kingdoms
        ur: فرنگیوں نے اپنی حدود کو چار مملکتوں میں تقسیم کیا
  - q:
      ar: هل كانت الحروب الصليبية حربًا دينية خالصة؟
      en: Were the Crusades a purely religious war?
      ur: کیا صلیبی جنگیں محض مذہبی جنگ تھیں؟
    options:
    - text:
        ar: لا؛ شملت معاهدات وتجارة وشراكات
        en: no; truces, trade and partnerships were part of it
        ur: نہیں؛ صلحیں، تجارت اور شراکتیں بھی شامل تھیں
      correct: true
      why:
        ar: سجّل المؤرخون صلحًا وتجارة وتعاونًا عبر الطرفين
        en: chroniclers record peace, trade and cooperation across lines
        ur: مورخین دونوں طرف کے مابین صلح، تجارت اور تعاون درج کرتے ہیں
    - text:
        ar: نعم؛ لم يكن فيها إلا قتال دائم
        en: yes; it was nothing but constant fighting
        ur: ہاں؛ اس میں صرف مسلسل لڑائی تھی
      correct: false
      why:
        ar: دامت فترات الصلح أطول من فترات الحرب
        en: stretches of peace outlasted stretches of war
        ur: صلح کے دور جنگ کے دوروں سے طویل رہے
    - text:
        ar: لا؛ لم يشارك رجال دين فيها
        en: no; no clergy took part
        ur: نہیں؛ اس میں مذہبی رہنماؤں نے حصہ نہیں لیا
      correct: false
      why:
        ar: شاركت الخطابة والرهبانيات من الجانبين
        en: preachers and orders took part on both sides
        ur: دونوں طرف کے واعظ اور مذہبی ادارے شریک تھے
    - text:
        ar: لا؛ كانت حربًا بين مدن مسلمة
        en: no; it was a war between Muslim cities
        ur: نہیں؛ یہ مسلم شہروں کی جنگ تھی
      correct: false
      why:
        ar: كان العدوّ الأساسي غزوًا خارجيًا وإن تداخلت صراعات داخلية
        en: the main foe was an outside invasion, though internal struggles overlapped
        ur: اصل حریف بیرونی حملہ تھا، اگرچہ اندرونی تنازعات بھی تھے
  - q:
      ar: ما مصير آخر معقل صليبي؟
      en: What happened to the last Crusader stronghold?
      ur: آخری صلیبی گڑھ کا کیا ہوا؟
    options:
    - text:
        ar: سقطت عكا عام ١٢٩١
        en: Acre fell in 1291
        ur: عکہ 1291 میں گر گیا
      correct: true
      why:
        ar: سجّلت المصادر نهاية المملكة اللاتينية بسقوط عكا
        en: sources date the Latin kingdom's end to Acre's fall
        ur: ماخذ لاطینی مملکت کا خاتمہ عکہ کے سقوط پر لکھتے ہیں
    - text:
        ar: بقيت حتى القرن الخامس عشر
        en: it held out into the 1400s
        ur: یہ پندرہویں صدی تک قائم رہی
      correct: false
      why:
        ar: انتهت الوجود الصليبي البريّ عام ١٢٩١
        en: mainland Crusader presence ended in 1291
        ur: برّی صلیبی موجودگی 1291 میں ختم ہوئی
    - text:
        ar: سلّمها الصليبيون طوعًا
        en: the Crusaders handed it over freely
        ur: صلیبیوں نے خود سپردگی کی
      correct: false
      why:
        ar: جاء السقوط بعد محاصرة طويلة لا بتسليم
        en: it fell after a long siege, not a handover
        ur: یہ طویل محاصرے کے بعد گرا، خود تسلیم نہیں
    - text:
        ar: نقلها الصليبيون إلى روما
        en: the Crusaders moved it to Rome
        ur: صلیبی اسے روم لے گئے
      correct: false
      why:
        ar: كانت عكا مدينة لا يمكن نقلها
        en: Acre was a city, not something to move
        ur: عکہ ایک شہر تھا جو منتقل نہیں ہو سکتا
  - q:
      ar: أين تركّزت قوة الفرنجة؟
      en: Where was Frankish power concentrated?
      ur: فرنگی طاقت کہاں مرکوز تھی؟
    options:
    - text:
        ar: في المدن الساحلية والقلاع
        en: in the coastal cities and castles
        ur: ساحلی شہروں اور قلعوں میں
      correct: true
      why:
        ar: حكموا من بيروت وعكا والقلاع أكثر من الريف
        en: they ruled from Beirut, Acre and the castles more than the countryside
        ur: وہ بیروت، عکہ اور قلعوں سے دیہات کے مقابلے میں زیادہ حکمرانی کرتے تھے
    - text:
        ar: في الصحراء العربية
        en: in the Arabian desert
        ur: عرب کی صحرا میں
      correct: false
      why:
        ar: لم يمتدّ حكمهم إلى الصحراء
        en: their rule did not reach the desert
        ur: ان کی حکمرانی صحرا تک نہیں پہنچی
    - text:
        ar: في كلّ بلاد الشام بالتساوي
        en: equally across all Syria
        ur: پورے شام میں یکساں طور پر
      correct: false
      why:
        ar: كانت قوتهم في الساحل والقلاع، لا في كلّ الأرض
        en: their strength was the coast and the castles, not the whole land
        ur: ان کی طاقت ساحل اور قلعے تھی، پوری زمین نہیں
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: لم يحكم الفرنجة مصر قط
        en: the Franks never ruled Egypt
        ur: فرنگیوں نے کبھی مصر پر حکومت نہیں کی
  - q:
      ar: ما أثر الحروب الصليبية بعد انتهائها؟
      en: What did the Crusades leave behind?
      ur: صلیبی جنگوں کے بعد کیا بچا؟
    options:
    - text:
        ar: قلاع وطرق وذاكرة مشتركة
        en: castles, roads and shared memory
        ur: قلعے، سڑکیں اور مشترک یادیں
      correct: true
      why:
        ar: بقيت القلاع والطرق والحكايات في كتب كلا الجانبين
        en: the castles, roads and stories remained in both sides' books
        ur: قلعے، سڑکیں اور قصے دونوں طرف کی کتابوں میں رہے
    - text:
        ar: انتهى كلّ أثر لها فورًا
        en: all trace of them vanished at once
        ur: ان کا ہر نشان فوراً مٹ گیا
      correct: false
      why:
        ar: بقيت الإمارات والقلاع والذاكرة لأجيال
        en: the states, castles and memory lasted for generations
        ur: ریاستیں، قلعے اور یادیں نسلوں تک رہیں
    - text:
        ar: تحوّل الشرق الأوسط كله إلى أوروبا
        en: the whole Middle East turned European
        ur: پورا مشرقِ وسطی یورپی بن گیا
      correct: false
      why:
        ar: بقيت المنطقة على لغتها ودينها في غالبها
        en: the region mostly kept its languages and faith
        ur: خطہ عموماً اپنی زبانیں اور دین پر رہا
    - text:
        ar: انتهت التجارة بين الشرق والغرب
        en: East-West trade ended
        ur: مشرق و مغرب کی تجارت ختم ہو گئی
      correct: false
      why:
        ar: ازدادت التجارة بعد الحروب لا اختفت
        en: trade grew after the wars, it did not disappear
        ur: جنگوں کے بعد تجارت بڑھی، ختم نہیں ہوئی
  - q:
      ar: من كتب عن الحروب الصليبية؟
      en: Who wrote about the Crusades?
      ur: صلیبی جنگوں کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون من الجانبين المسلم والأوروبي
        en: historians on both the Muslim and European sides
        ur: مسلم اور یورپی دونوں طرف کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات ابن الأثير والفرنجة وغيرهما من الجهتين
        en: accounts reach us from Ibn al-Athir and Frankish writers alike
        ur: ابن اثیر اور فرنگی مصنفین دونوں کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: لا أحد؛ فُقدت السجلات كلها
        en: nobody; the records are all lost
        ur: کوئی نہیں؛ تمام ریکارڈ کھو گئے
      correct: false
      why:
        ar: بقيت روايات مفصّلة من الجانبين
        en: detailed accounts survive from both sides
        ur: دونوں طرف کی مفصل روایتیں باقی ہیں
    - text:
        ar: الأوروبيون فقط
        en: only the Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها بدورهم
        en: Muslims wrote their own accounts
        ur: مسلمانوں نے بھی اپنی روایتیں لکھیں
    - text:
        ar: المسلمون فقط
        en: only the Muslims
        ur: صرف مسلمان
      correct: false
      why:
        ar: تصلنا سجلات أوروبية أيضًا
        en: European records reach us too
        ur: یورپی ریکارڈ بھی ہم تک پہنچے ہیں
  - q:
      ar: ما معنى "الفرنجة" في كتب المسلمين؟
      en: What does "al-Firanj" mean in Muslim sources?
      ur: مسلم ماخذ میں "فرنگی" کا کیا مطلب ہے؟
    options:
    - text:
        ar: الأوروبيون الغربيون عامة
        en: western Europeans in general
        ur: عمومی طور پر مغربی یورپی
      correct: true
      why:
        ar: استعملتها الكتب للقوافل والجيش الصليبي
        en: the books used it for the invading forces and settlers
        ur: کتابوں نے اسے حملہ آوروں اور باسیوں کے لیے استعمال کیا
    - text:
        ar: الفرس
        en: the Persians
        ur: فارسی
      correct: false
      why:
        ar: كان للفرس اسم آخر في تلك الكتب
        en: Persians had their own name in those books
        ur: فارسیوں کا ان کتابوں میں اپنا نام تھا
    - text:
        ar: سكان البحر المتوسط
        en: Mediterranean natives
        ur: بحیرہ روم کے رہائشی
      correct: false
      why:
        ar: كان اللفظ للغرباء القادمين لا لأهل الساحل
        en: the word was for the newcomers, not the coastal people
        ur: یہ لفظ نئے آنے والوں کے لیے تھا، ساحلی باشندوں کے لیے نہیں
    - text:
        ar: جيش روما القديمة
        en: the army of ancient Rome
        ur: قدیم روم کی فوج
      correct: false
      why:
        ar: كانت الحملة في القرن الثاني عشر لا في العصور القديمة
        en: the campaign was twelfth-century, not ancient
        ur: مہم بارہویں صدی کی تھی، قدیم زمانے کی نہیں
- id: hijra
  anchor: event/hijra
  band: scholars
  title:
    ar: الهجرة
    en: the Hijra
    ur: ہجرت
  sixty:
    ar: 'في سنة ٦٢٢ هاجر النبي من مكة إلى يثرب فصارت المدينة، وكانت الهجرة نقطة تحوّل لا رحلة هروب. استقبل الأنصار المهاجرين فقاسموهم الديار والأموال، وبنى المسلمون أول مجتمع مستقل لهم: مسجدًا يجمعهم، ووثيقة تنظّم حقوق المسلمين واليهود وبقية القبائل، وأسواقًا تُقام على قواعد جديدة. من المدينة خرجت بدر وأحد وخيبر، وإليها عاد الناس أفواجًا بعد فتح مكة سنة ٦٣٠. ولمّا توفي النبي بقي الأمر للخلفاء الراشدين ثم انتقلت العاصمة إلى الكوفة فدمشق. واليوم يقصد ملايين المسلمين المدينة لزيارة مسجده، ويظل اسم يثرب شاهدًا على أن مجتمعًا جديدًا يمكن أن يولد من هجرة. وبهذا صارت الهجرة درس الأمة الأول: أن العقيدة تحتاج دارًا، والدار تحتاج نظامًا، والنظام يحتاج صبرًا. ولذلك بدأ المسلمون بهذا الحدث تقويمهم: لا من مولد النبي ولا من بدء الوحي، بل من يوم صار للإسلام دار ودولة. وفي كل عام يتذكّر المسلمون تلك الأيام: ليلة الخروج، وكهف ثور، وقباء، ودخول المدينة وناسها يستقبلون بالأناشيد.'
    en: 'In 622 the Prophet left Mecca for Yathrib — soon called Medina, the City — and the Hijra became a turning point, not a flight. The Ansar welcomed the emigrants, sharing homes and wealth, and the Muslims built their first self-governing community: a mosque that gathered them, a charter regulating the rights of Muslims, Jews and the remaining tribes, and markets run on new rules. From Medina went out Badr, Uhud and Khaybar; to it people flocked after the conquest of Mecca in 630. When the Prophet died, the Rightly Guided caliphs ruled there before the capital moved to Kufa, then Damascus. Today millions of Muslims visit his mosque in Medina, and the old name Yathrib still recalls how a new community can be born out of a migration. In this the Hijra stands as the ummah''s first lesson: a faith needs a home, a home needs an order, and an order needs patience.'
    ur: '622 میں نبی مکہ سے یثرب — جو جلد مدینہ کہلائی — ہجرت کی، اور یہ ہجرت فرار نہیں بلکہ نقطۂ آغاز بنی۔ انصار نے مہاجرین کا خیرمقدم کیا اور گھر اور مال بانٹے، اور مسلمانوں نے اپنی پہلی خود مختار برادری بنائی: ایک مسجد جو سب کو جمع کرے، ایک میثاق جو مسلمانوں، یہود اور قبائل کے حقوق لکھے، اور نئے اصولوں پر بازار۔ مدینہ سے بدر، احد اور خیبر نکلے؛ اور 630 میں فتح مکہ کے بعد لوگ جوق در جوق واپس آئے۔ نبی کی وفات کے بعد خلفائے راشدین وہیں حکمران رہے پھر دارالحکومت کوفہ اور دمشق منتقل ہوا۔ آج لاکھوں مسلمان اس کی مسجد کی زیارت کرتے ہیں، اور پرانا نام یثرب اب بھی بتاتا ہے کہ ہجرت سے نئی برادری جنم لیتی ہے۔ اسی لیے ہجرت امت کا پہلا سبق رہی: عقیدے کو گھر چاہیے، گھر کو نظم، اور نظم کو صبر۔'
  glossary:
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: 'الاسم القديم للمدينة قبل هجرة النبي إليها سنة ٦٢٢ فصارت مدينته'
      en: 'the old name of the town before the Prophet''s migration there in 622 made it his city'
      ur: 'شہر کا پرانا نام قبل اس کے کہ 622 میں نبی کی ہجرت نے اسے ان کا شہر بنایا'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'أهل مكة الذين تركوا ديارهم وأموالهم وهاجروا مع النبي إلى المدينة'
      en: 'the Meccans who left their homes and wealth to migrate with the Prophet to Medina'
      ur: 'مکہ کے لوگ جنھوں نے گھر اور مال چھوڑ کر نبی کے ساتھ مدینہ ہجرت کی'
  - term:
      ar: الأنصار
      en: the Ansar
      ur: انصار
    gloss:
      ar: 'أهل يثرب من الأوس والخزرج الذين نصروا المهاجرين وآووهم في ديارهم'
      en: 'the people of Yathrib of Aws and Khazraj who sheltered the emigrants in their homes'
      ur: 'یثرب کے اوس و خزرج کے لوگ جنھوں نے مہاجرین کو اپنے گھروں میں پناہ دی'
  - term:
      ar: وثيقة المدينة
      en: the Constitution of Medina
      ur: میثاقِ مدینہ
    gloss:
      ar: 'الصحيفة التي نظّمت حقوق مسلمي المدينة ويهودها وسائر قبائلها على شراكة واحدة'
      en: 'the charter that set the rights of Medina''s Muslims, Jews and remaining tribes on one footing'
      ur: 'وہ فرمان جس نے مدینہ کے مسلمانوں، یہود اور قبائل کے حقوق ایک نظم میں لکھے'
  - term:
      ar: المسجد النبوي
      en: the Prophet's mosque
      ur: مسجدِ نبوی
    gloss:
      ar: 'أول مسجد بنّاه المسلمون في المدينة وصار قلب الجماعة ومنبرها حتى اليوم'
      en: 'the first mosque the Muslims built in Medina, still the community''s heart and pulpit today'
      ur: 'مدینہ میں مسلمانوں کی بنائی ہوئی پہلی مسجد جو آج بھی برادری کا دل و منبر ہے'
  - term:
      ar: التقويم الهجري
      en: the Hijri calendar
      ur: ہجری تقویم
    gloss:
      ar: 'النظام الزمني الذي بدأ من الهجرة وصار به المسلمون يؤرّخون حتى اليوم'
      en: 'the timekeeping system counted from the Hijra by which Muslims still date their years today'
      ur: 'وہ تقویمی نظام جو ہجرت سے شروع ہوا اور جس سے مسلمان آج تک سال گنتے ہیں'
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'الرحلة التي غيّرت التاريخ: خروج النبي من مكة إلى يثرب ونشأة أول دولة مسلمة'
      en: 'the journey that changed history — the Prophet''s leaving Mecca for Yathrib and the first Muslim polity'
      ur: 'وہ سفر جس نے تاریخ بدلی — مکہ سے یثرب نبی کا جانا اور پہلی مسلم ریاست کا قیام'
  - term:
      ar: النبي
      en: the Prophet
      ur: نبی
    gloss:
      ar: 'محمد رسول الله الذي قاد الهجرة وأسس في المدينة قلب أمّة بأكملها'
      en: 'Muhammad, God''s messenger, who led the migration and founded the heart of an entire ummah'
      ur: 'محمد رسول خدا جس نے ہجرت کی قیادت کی اور پوری امت کا مرکز بسایا'
  - term:
      ar: اليهود في المدينة
      en: Medina's Jews
      ur: مدینہ کے یہود
    gloss:
      ar: 'طوائف يثرب اليهودية التي رتّبت الوثيقة علاقتها مع المسلمين قبل تغيّر الأحوال'
      en: 'the Jewish groups of Yathrib whose relations with Muslims the charter set before affairs changed'
      ur: 'یثرب کے یہودی طائفے جن کا مسلمانوں سے تعلق میثاق نے طے کیا حالات بدلنے سے پہلے'
  - term:
      ar: الأوس والخزرج
      en: Aws and Khazraj
      ur: اوس اور خزرج
    gloss:
      ar: 'القبيلتان العربيتان المتناحرتان اللتان صارتا سند الدعوة بعد الهجرة'
      en: 'the two feuding Arab tribes of Yathrib that became the call''s backbone after the Hijra'
      ur: 'یثرب کے دو باہم لڑتے عرب قبیلے جو ہجرت کے بعد دعوت کی کمر بنے'
  - term:
      ar: الصحبة
      en: the companions
      ur: صحابہ
    gloss:
      ar: 'أصحاب النبي الملازمون له في مكة والمدينة الذين حملوا الدعوة إلى العالم'
      en: 'the Prophet''s close followers in Mecca and Medina who carried the call to the world'
      ur: 'نبی کے قریبی ساتھی مکہ اور مدینہ میں جنھوں نے دعوت کو دنیا تک پہنچایا'
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: 'عودة النبي إلى مكة منتصرًا سنة ٦٣٠ فدخلها بسلام وطهّر الكعبة'
      en: 'the Prophet''s victorious return to Mecca in 630, entering it peacefully and cleansing the Kaaba'
      ur: '630 میں نبی کی مکہ فاتحانہ واپسی — امن سے داخل ہوئے اور کعبہ پاک کیا'
  practice:
  - q:
      ar: متى وقعت الهجرة؟
      en: When did the Hijra happen?
      ur: ہجرت کب ہوئی؟
    options:
    - text:
        ar: عام ٦٢٢ ميلادي
        en: in 622 CE
        ur: 622 عیسوی میں
      correct: true
      why:
        ar: سجّلت المصادر سنة الهجرة ٦٢٢ وبدأت بها التقويم
        en: sources date the Hijra to 622, the calendar's starting year
        ur: ماخذ ہجرت کو 622 لکھتے ہیں، تقویم کا آغاز سال
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ذلك العام كان فتح مكة لا الهجرة
        en: that year was the conquest of Mecca, not the Hijra
        ur: وہ سال فتح مکہ کا تھا، ہجرت کا نہیں
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ذلك العام بدأت الرسالة في مكة
        en: that year began the revelation in Mecca
        ur: وہ سال مکہ میں وحی کا آغاز تھا
    - text:
        ar: عام ٦٥٠
        en: in 650
        ur: 650 میں
      correct: false
      why:
        ar: ذلك بعد وفاة النبي بسنوات
        en: that was years after the Prophet's death
        ur: یہ نبی کی وفات کے برسوں بعد تھا
  - q:
      ar: إلى أين كانت الهجرة؟
      en: Where did the Hijra go?
      ur: ہجرت کہاں کی طرف ہوئی؟
    options:
    - text:
        ar: إلى يثرب التي صارت المدينة
        en: to Yathrib, which became Medina
        ur: یثرب کی طرف، جو مدینہ بن گئی
      correct: true
      why:
        ar: دعا أهل يثرب النبي إليها فصارت مركز الدولة
        en: Yathrib's people invited him, and it became the polity's centre
        ur: یثرب کے لوگوں نے ان کو بلایا، اور یہ ریاست کا مرکز بنا
    - text:
        ar: إلى دمشق
        en: to Damascus
        ur: دمشق کی طرف
      correct: false
      why:
        ar: لم تدخل دمشق في دائرة الهجرة
        en: Damascus was not part of the Hijra
        ur: دمشق ہجرت کا حصہ نہیں تھا
    - text:
        ar: إلى مصر
        en: to Egypt
        ur: مصر کی طرف
      correct: false
      why:
        ar: بقيت مصر خارج رحلة الهجرة
        en: Egypt was outside the Hijra's route
        ur: مصر ہجرت کے راستے سے باہر تھا
    - text:
        ar: إلى بغداد
        en: to Baghdad
        ur: بغداد کی طرف
      correct: false
      why:
        ar: لم تكن بغداد موجودة آنذاك
        en: Baghdad did not yet exist
        ur: اس وقت بغداد موجود ہی نہیں تھا
  - q:
      ar: لماذا هاجر النبي؟
      en: Why did the Prophet migrate?
      ur: نبی نے ہجرت کیوں کی؟
    options:
    - text:
        ar: بدعوة من أهل يثرب وبعد اضطهاد مكة
        en: by Yathrib's invitation after Meccan persecution
        ur: یثرب کی دعوت پر، مکہ کے ظلم کے بعد
      correct: true
      why:
        ar: جمعت الهجرة الهروب من الأذى وبناء دولة جديدة
        en: the move joined escaping harm with building a new polity
        ur: اس منتقلی نے ظلم سے بچنا اور نئی ریاست بنانا جوڑا
    - text:
        ar: للتجارة فقط
        en: for trade only
        ur: صرف تجارت کے لیے
      correct: false
      why:
        ar: لم تكن غايته التجارة بل بناء الجماعة
        en: its aim was not trade but building the community
        ur: اس کا مقصد تجارت نہیں بلکہ جماعت بنانا تھا
    - text:
        ar: لزيارة الأقارب
        en: to visit relatives
        ur: رشتہ داروں سے ملنے
      correct: false
      why:
        ar: كانت هجرة سياسية دينية لا زيارة
        en: it was a religious-political migration, not a visit
        ur: یہ مذہبی-سیاسی ہجرت تھی، ملاقات نہیں
    - text:
        ar: لأنّ يثرب كانت أقرب مدينة
        en: because Yathrib was the closest town
        ur: کیونکہ یثرب قریب ترین شہر تھا
      correct: false
      why:
        ar: لم يكن القرب سبب الاختيار بل الدعوة
        en: proximity was not the reason; the invitation was
        ur: قرب وجہ نہیں تھا؛ دعوت تھی
  - q:
      ar: ما وثيقة المدينة؟
      en: What was the Constitution of Medina?
      ur: میثاقِ مدینہ کیا تھا؟
    options:
    - text:
        ar: عقد بين المسلمين وقبائل المدينة وحلفائهم
        en: a pact between Muslims, Medina's tribes and their allies
        ur: مسلمانوں، مدینہ کے قبائل اور ان کے حلیفوں کے درمیان عہد
      correct: true
      why:
        ar: جمعت الوثيقة أطراف المدينة في نظام مشترك
        en: the document bound Medina's parties into one shared order
        ur: اس دستاویز نے مدینہ کے فریقوں کو ایک مشترک نظم میں باندھا
    - text:
        ar: معاهدة تجارية بين مكة ويثرب
        en: a trade treaty between Mecca and Yathrib
        ur: مکہ اور یثرب کے درمیان تجارتی معاہدہ
      correct: false
      why:
        ar: كانت عقدًا داخليًا لأهل المدينة لا معاهدة تجارة
        en: it was Medina's internal pact, not a trade treaty
        ur: یہ مدینہ کا اندرونی عہد تھا، تجارتی معاہدہ نہیں
    - text:
        ar: دستور كتبه الفرنجة لاحقًا
        en: a constitution written later by the Franks
        ur: ایک آئین جو بعد میں فرنگیوں نے لکھا
      correct: false
      why:
        ar: كُتبت في زمن النبي لا في العصور اللاحقة
        en: it was written in the Prophet's time, not later
        ur: یہ نبی کے زمانے میں لکھی گئی، بعد میں نہیں
    - text:
        ar: رسالة سرية بين المهاجرين فقط
        en: a secret letter among the migrants only
        ur: صرف مہاجرین کے درمیان خفیہ خط
      correct: false
      why:
        ar: شملت جميع أطراف المدينة، لا المهاجرين وحدهم
        en: it covered all of Medina's parties, not just the migrants
        ur: اس میں مدینہ کے تمام فریق شامل تھے، صرف مہاجرین نہیں
  - q:
      ar: ماذا غيّرت الهجرة في المسلمين؟
      en: What did the Hijra change for Muslims?
      ur: ہجرت نے مسلمانوں کے لیے کیا بدلا؟
    options:
    - text:
        ar: صاروا مجتمعًا مستقلًّا بدولته الخاصة
        en: they became an independent society with its own polity
        ur: وہ اپنی ریاست والا آزاد معاشرہ بن گئے
      correct: true
      why:
        ar: انتقلت الجماعة من محاصرة مكية إلى بنيان مدني
        en: the community moved from a besieged Meccan group to a civic structure
        ur: جماعت محصور مکی گروہ سے شہری نظم میں بدل گئی
    - text:
        ar: لم يتغير شيء
        en: nothing changed
        ur: کچھ نہیں بدلا
      correct: false
      why:
        ar: بدأت دولة وتقويم ومركز جديد للتعليم
        en: a state, a calendar and a new centre of learning began
        ur: ایک ریاست، تقویم اور علم کا نیا مرکز شروع ہوا
    - text:
        ar: تركوا مكة نهائيًا بلا عودة
        en: they left Mecca forever
        ur: انہوں نے مکہ ہمیشہ کے لیے چھوڑ دیا
      correct: false
      why:
        ar: عادوا إلى مكة بعد ثماني سنوات في الفتح
        en: they returned to Mecca eight years later at the conquest
        ur: وہ آٹھ سال بعد فتح میں مکہ واپس آئے
    - text:
        ar: صاروا أقلّ عددًا من قبل
        en: they became fewer than before
        ur: وہ پہلے سے کم ہو گئے
      correct: false
      why:
        ar: نما عدد المسلمين في المدينة لا نقص
        en: Muslim numbers grew in Medina, not shrank
        ur: مدینہ میں مسلمان بڑھے، کم نہیں ہوئے
  - q:
      ar: من كتب عن الهجرة؟
      en: Who wrote about the Hijra?
      ur: ہجرت کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون من السيرة والتواريخ المبكرة
        en: chroniclers of the sira and early histories
        ur: سیرت اور ابتدائی تواریخ کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والواقدي والطبري
        en: accounts reach us from Ibn Ishaq, al-Waqidi and al-Tabari
        ur: ابن اسحاق، واقدی اور طبری کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تصلنا روايات مبكرة من كتب السيرة
        en: early sira accounts reach us
        ur: ابتدائی سیرت کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: المستشرقون فقط
        en: only orientalists
        ur: صرف مستشرقین
      correct: false
      why:
        ar: سبقت روايات السيرة العربية بقرون
        en: Arabic sira accounts predate orientalism by centuries
        ur: عربی سیرت کی روایتیں صدیوں پہلے کی ہیں
    - text:
        ar: الأنصار فقط
        en: only the Ansar
        ur: صرف انصار
      correct: false
      why:
        ar: تصلنا روايات مهاجرين وأنصار على حد سواء
        en: migrant and Ansar accounts both reach us
        ur: مہاجرین اور انصار دونوں کی روایتیں ہم تک پہنچی ہیں
  - q:
      ar: لماذا بدأ التقويم الهجري من الهجرة؟
      en: Why does the Hijri calendar start from the Hijra?
      ur: ہجری تقویم ہجرت سے کیوں شروع ہوتی ہے؟
    options:
    - text:
        ar: لأنها لحظة قيام الدولة الإسلامية
        en: because it marks the founding of the Islamic polity
        ur: کیونکہ یہ اسلامی ریاست کے قیام کی علامت ہے
      correct: true
      why:
        ar: اختار الخلفاء لاحقًا سنة الهجرة بداية للتاريخ الإسلامي
        en: later caliphs chose the Hijra year as the Islamic era's start
        ur: بعد کے خلفاء نے ہجرت کے سال کو اسلامی عہد کا آغاز چنا
    - text:
        ar: لأنها سنة ميلاد النبي
        en: because it is the Prophet's birth year
        ur: کیونکہ یہ نبی کا سالِ پیدائش ہے
      correct: false
      why:
        ar: ولد النبي قبل الهجرة بنحو ٥٣ سنة
        en: the Prophet was born about 53 years before the Hijra
        ur: نبی ہجرت سے تقریباً 53 سال پہلے پیدا ہوئے
    - text:
        ar: لأنها سنة فتح مكة
        en: because it is the conquest year
        ur: کیونکہ یہ فتح کا سال ہے
      correct: false
      why:
        ar: كان الفتح بعد الهجرة بثماني سنوات
        en: the conquest was eight years after the Hijra
        ur: فتح ہجرت کے آٹھ سال بعد تھی
    - text:
        ar: لأن القرآن أمر بذلك
        en: because the Quran commanded it
        ur: کیونکہ قرآن نے اس کا حکم دیا
      correct: false
      why:
        ar: كان اختيارًا إداريًا لاحقًا لا نصًّا قرآنيًا
        en: it was a later administrative choice, not a Quranic command
        ur: یہ بعد کا انتظامی فیصلہ تھا، قرآنی حکم نہیں
  - q:
      ar: ماذا جاء بعد الهجرة بثماني سنوات؟
      en: What came eight years after the Hijra?
      ur: ہجرت کے آٹھ سال بعد کیا آیا؟
    options:
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: true
      why:
        ar: عاد المسلمون إلى مكة عام ٦٣٠
        en: the Muslims returned to Mecca in 630
        ur: مسلمان 630 میں مکہ واپس آئے
    - text:
        ar: موت النبي
        en: the Prophet's death
        ur: نبی کی وفات
      correct: false
      why:
        ar: توفي النبي عام ٦٣٢ بعد الفتح بسنتين
        en: he died in 632, two years after the conquest
        ur: ان کی وفات 632 میں ہوئی، فتح کے دو سال بعد
    - text:
        ar: سقوط عكا
        en: the fall of Acre
        ur: عکہ کا سقوط
      correct: false
      why:
        ar: كان ذلك عام ١٢٩١ بعد قرون
        en: that was in 1291, centuries later
        ur: یہ 1291 میں تھا، صدیوں بعد
    - text:
        ar: بداية الحروب الصليبية
        en: the start of the Crusades
        ur: صلیبی جنگوں کا آغاز
      correct: false
      why:
        ar: كانت الحروب الصليبية في ١٠٩٥
        en: the Crusades began in 1095
        ur: صلیبی جنگیں 1095 میں شروع ہوئیں
  - q:
      ar: من كان الأنصار؟
      en: Who were the Ansar?
      ur: انصار کون تھے؟
    options:
    - text:
        ar: أهل يثرب الذين آووا المهاجرين
        en: the people of Yathrib who hosted the migrants
        ur: یثرب کے وہ لوگ جنہوں نے مہاجرین کی میزبانی کی
      correct: true
      why:
        ar: سمّوا أنصارًا لنصرتهم للنبي والمهاجرين
        en: they were called Ansar for aiding the Prophet and the migrants
        ur: انہیں نبی اور مہاجرین کی مدد پر انصار کہا گیا
    - text:
        ar: أهل مكة الذين هاجروا
        en: the Meccans who migrated
        ur: مکہ کے وہ لوگ جنہوں نے ہجرت کی
      correct: false
      why:
        ar: أولئك كانوا المهاجرين لا الأنصار
        en: those were the migrants, not the Ansar
        ur: وہ مہاجرین تھے، انصار نہیں
    - text:
        ar: جيش النبي في الفتح
        en: the Prophet's army at the conquest
        ur: فتح میں نبی کی فوج
      correct: false
      why:
        ar: كان الأنصار طائفة من أهل المدينة لا جيشًا عسكريًا فقط
        en: the Ansar were Medina's host community, not just an army
        ur: انصار مدینہ کی میزبان جماعت تھی، صرف فوج نہیں
    - text:
        ar: قبائل عربية في الشام
        en: Arab tribes in Syria
        ur: شام کے عرب قبائل
      correct: false
      why:
        ar: كان الأنصار في يثرب لا في الشام
        en: the Ansar were in Yathrib, not Syria
        ur: انصار یثرب میں تھے، شام میں نہیں
  - q:
      ar: كم عُدّت يثرب قبل الإسلام؟
      en: How was Yathrib described before Islam?
      ur: اسلام سے پہلے یثرب کیسا تھا؟
    options:
    - text:
        ar: واحة فيها قبائل متنافسة وحلفاء يهود
        en: an oasis of rival tribes with Jewish allies
        ur: ایک نخلستان جس میں متحارب قبائل اور یہودی حلیف تھے
      correct: true
      why:
        ar: وصفت المصادر تنازع الأوس والخزرج وتحالفات يهودية
        en: sources describe Aws-Khazraj rivalry and Jewish alliances
        ur: ماخذ اوس-خزرج کی دشمنی اور یہودی اتحادوں کا ذکر کرتے ہیں
    - text:
        ar: مدينة موحّدة تحت ملك واحد
        en: a unified city under one king
        ur: ایک بادشاہ کے تحت متحد شہر
      correct: false
      why:
        ar: لم تكن يثرب تحت حكم واحد قبل الهجرة
        en: Yathrib was not under one ruler before the Hijra
        ur: ہجرت سے پہلے یثرب ایک حکمران کے تحت نہیں تھا
    - text:
        ar: ميناء بحري على الخليج
        en: a seaport on the Gulf
        ur: خلیج پر ایک بندرگاہ
      correct: false
      why:
        ar: كانت يثرب واحة داخلية لا ميناء
        en: Yathrib was an inland oasis, not a port
        ur: یثرب اندرونی نخلستان تھا، بندرگاہ نہیں
    - text:
        ar: أرض فارغة بلا سكان
        en: empty land with no people
        ur: بے آباد زمین
      correct: false
      why:
        ar: كان فيها قبائل وزراعة وتجارة قبل الإسلام
        en: it had tribes, farming and trade before Islam
        ur: اسلام سے پہلے اس میں قبائل، کھیتی اور تجارت تھے
- id: five-pillars
  anchor: concept/five-pillars
  band: scholars
  title:
    ar: أركان الإسلام الخمسة
    en: the five pillars
    ur: اسلام کے پانچ ارکان
  sixty:
    ar: 'تقوم عبادة المسلمين على خمسة أركان: الشهادة أن لا إله إلا الله وأن محمدًا رسوله، والصلاة خمس مرات في اليوم، والزكاة نصيب للفقراء في المال، والصوم في رمضان، والحج إلى بيت الله لمن استطاع. هذه الأركان ليست مجرد عادات؛ إنها بناء يومي يربط العبد بربه وبجيرانه. فالشهادة تُعلَّن في الولادة والصلاة، والصلاة توقف النهار خمس مرات فيتعوّد الإنسان النظام، والزكاة تُخرج المال من حبّ اليد إلى يد الحاجة، والصوم يعلّم الصبر والرحمة، والحج يجمع المسلمين من كل أرض في زي واحد وموقف واحد. وبهذا يصير الدين عيشًا لا كلامًا. ولهذا سمّيت أركانًا: كما لا يقوم البيت بلا أعمدة، لا يقوم دين المسلم بغيرها، فهي هيكل اليوم والسنة والعمر كله. فإذا اجتمعت تلك الخمسة رأيت مسلمًا كامل الطقس: شهادة في قلبه، وصلاة على لسانه، وصدقة في يده، وصبرًا في جسده، وحجًّا في أمله. وهذا هو الإسلام باختصاره العملي: إيمان بالقلب واللسان، ثم جسدٌ ومالٌ يشهدان، وعمرٌ كامل يدور حول تلك الأركان الخمسة.'
    en: 'Muslim worship stands on five pillars: the testimony that there is no god but God and Muhammad is His messenger; prayer five times a day; zakat, the share the poor hold in one''s wealth; fasting through Ramadan; and the Hajj to God''s House for whoever is able. These are not mere habits — they are a daily frame linking a person to God and to neighbors. The testimony is announced at birth and echoed in every prayer; prayer interrupts the day five times and teaches order; zakat moves money from a tight hand to a needy one; fasting schools patience and mercy; and the Hajj gathers Muslims from every land in one dress and one standing. In this way faith becomes a life, not just words. That is why they are called pillars: as no house stands without columns, a Muslim''s faith does not stand without them — the frame of a day, a year and a whole life.'
    ur: 'مسلمانوں کی عبادت پانچ ارکان پر قائم ہے: شہادت کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے رسول ہیں؛ دن میں پانچ وقت نماز؛ زکوٰۃ، مال میں فقیروں کا حصہ؛ رمضان کا روزہ؛ اور جو استطاعت رکھے اس کے لیے بیت اللہ کا حج۔ یہ محض عادتیں نہیں — یہ روزمرہ ڈھانچہ ہے جو انسان کو خدا اور ہمسائیوں سے جوڑتا ہے۔ شہادت پیدائش پر کہی جاتی ہے اور ہر نماز میں گونجتی ہے؛ نماز دن کو پانچ بار روک کر نظم سکھاتی ہے؛ زکوٰۃ مال کو بند ہاتھ سے محتاج کے ہاتھ پہنچاتی ہے؛ روزہ صبر اور رحم سکھاتا ہے؛ اور حج ہر سرزمین کے مسلمانوں کو ایک لباس اور ایک موقف میں جمع کرتا ہے۔ اس طرح دین زندگی بنتا ہے، محض باتیں نہیں۔ اسی لیے انہیں ارکان کہا گیا: جس طرح گھر ستونوں کے بغیر نہیں کھڑا، مسلمان کا دین ان کے بغیر نہیں کھڑا — یہ دن، سال اور ساری زندگی کا ڈھانچہ ہے۔'
  glossary:
  - term:
      ar: الشهادة
      en: the testimony
      ur: شہادت
    gloss:
      ar: 'الإعلان أن لا إله إلا الله ومحمد رسوله، مدخل الإسلام كله'
      en: 'the declaration that there is no god but God and Muhammad is His messenger — Islam''s doorway'
      ur: 'اعلان کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے رسول ہیں — اسلام کا دروازہ'
  - term:
      ar: الصلاة
      en: the prayer
      ur: نماز
    gloss:
      ar: 'العبادة اليومية الخمس التي توقف النهار وتصل المسلم بربه'
      en: 'the five daily devotions that pause the day and link the Muslim to God'
      ur: 'روزانہ پانچ عبادتیں جو دن کو روکیں اور مسلمان کو خدا سے جوڑیں'
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰۃ
    gloss:
      ar: 'حق الفقراء في مال الموسرين، نسبة مؤكدة تخرج كل سنة'
      en: 'the poor''s rightful share in the wealthy''s money, a fixed fraction paid each year'
      ur: 'امیروں کے مال میں فقیروں کا حق — ہر سال ادا ہونے والا مقررہ حصہ'
  - term:
      ar: الصوم
      en: the fast
      ur: روزہ
    gloss:
      ar: 'إمساك الطعام والشراب من الفجر إلى الغروب، مدرسة للصبر والرحمة'
      en: 'abstaining from food and drink dawn to dusk — a school of patience and mercy'
      ur: 'طلوع فجر سے غروب تک کھانا پینا چھوڑنا — صبر اور رحم کا درس'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'رحلة الكعبة الكبرى التي يؤدّيها المسلم مرة في العمر إن استطاع'
      en: 'the great Kaaba journey a Muslim performs once in life if able'
      ur: 'کعبہ کا وہ بڑا سفر جو مسلمان عمر میں ایک بار ادا کرے اگر استطاعت ہو'
  - term:
      ar: التوحيد
      en: tawhid
      ur: توحید
    gloss:
      ar: 'توحيد الله وإفراده بالعبادة، قلب الشهادة وأساس الدين كله'
      en: 'God''s oneness and sole worship — the testimony''s heart and the faith''s whole root'
      ur: 'خدا کی وحدانیت اور اسی کی عبادت — شہادت کا دل اور دین کی جڑ'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي يصلّي المسلمون إليه في كل أرض، نحو الكعبة في مكة'
      en: 'the direction Muslims face in prayer everywhere, toward the Kaaba in Mecca'
      ur: 'وہ سمت جس کی طرف مسلمان دنیا بھر میں نماز پڑھتے ہیں — مکہ میں کعبہ'
  - term:
      ar: النية
      en: the intention
      ur: نیت
    gloss:
      ar: 'قصد القلب الذي يفتتح به كل عمل، فالأعمال بها وبحسبها'
      en: 'the heart''s resolve that opens every deed — deeds are judged by it'
      ur: 'دل کا ارادہ جو ہر عمل کا آغاز ہے — اعمال اسی سے تولے جاتے ہیں'
  - term:
      ar: الركن
      en: the pillar
      ur: رکن
    gloss:
      ar: 'الدعامة التي يقوم عليها البناء؛ هكذا وصُفت العبادات الخمس'
      en: 'the support a building stands on — thus the five devotions were named'
      ur: 'وہ ستون جس پر عمارت کھڑی ہوتی ہے — پانچ عبادتوں کو اسی لیے کہا گیا'
  - term:
      ar: الاستطاعة
      en: the ability
      ur: استطاعت
    gloss:
      ar: 'القدرة البدنية والمالية التي يشترطها الحج قبل وجوبه'
      en: 'the bodily and financial means required before the Hajj becomes a duty'
      ur: 'جسمانی اور مالی استطاعت جو حج فرض ہونے سے پہلے لازم ہے'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'شهر الصيام التاسع من السنة الهجرية، حين ينقطع المسلمون للعبادة'
      en: 'the ninth Hijri month of fasting when Muslims devote themselves to worship'
      ur: 'ہجری سال کا نواں صیام کا مہینہ جب مسلمان عبادت میں لگتے ہیں'
  - term:
      ar: الأركان الخمسة
      en: the five pillars
      ur: پانچ ارکان
    gloss:
      ar: 'الصورة المختصرة لأساس الإيمان الخماسي الذي تقوم عليه حياة المسلم'
      en: 'the shorthand for the fivefold foundation a Muslim''s whole life stands on'
      ur: 'پانچ جزوی بنیاد کا مختصر نام جس پر مسلمان کی ساری زندگی قائم ہے'
  practice:
  - q:
      ar: كم عدد أركان الإسلام؟
      en: How many pillars of Islam are there?
      ur: اسلام کے ارکان کتنے ہیں؟
    options:
    - text:
        ar: خمسة
        en: five
        ur: پانچ
      correct: true
      why:
        ar: تذكر الكتب الأركان الخمسة نفسها منذ القرون الأولى
        en: books name the same five pillars since the early centuries
        ur: کتابیں ابتدائی صدیوں سے وہی پانچ ارکان لکھتی ہیں
    - text:
        ar: ثلاثة
        en: three
        ur: تین
      correct: false
      why:
        ar: الثلاثة عدد الأيام المشهورة لا الأركان
        en: three is the count of sacred days, not pillars
        ur: تین مقدس دنوں کی گنتی ہے، ارکان کی نہیں
    - text:
        ar: سبعة
        en: seven
        ur: سات
      correct: false
      why:
        ar: السبعة عدد أبواب المدينة أو أشياء أخرى
        en: seven is the count of other things, not pillars
        ur: سات دوسری چیزوں کی گنتی ہے، ارکان کی نہیں
    - text:
        ar: اثنا عشر
        en: twelve
        ur: بارہ
      correct: false
      why:
        ar: الاثنا عشر عدد الأئمة عند الشيعة لا الأركان
        en: twelve is a count from another tradition, not pillars
        ur: بارہ دوسری روایت کی گنتی ہے، ارکان کی نہیں
  - q:
      ar: ما أول ركن؟
      en: What is the first pillar?
      ur: پہلا رکن کون سا ہے؟
    options:
    - text:
        ar: الشهادة
        en: the testimony
        ur: شہادت
      correct: true
      why:
        ar: تأتي الشهادة أولًا لأنها دخول الإيمان
        en: the testimony comes first as the entry into faith
        ur: شہادت پہلے آتی ہے کیونکہ یہ ایمان کا داخلہ ہے
    - text:
        ar: الصلاة
        en: the prayer
        ur: نماز
      correct: false
      why:
        ar: الصلاة الركن الثاني بعد الشهادة
        en: prayer is the second pillar after the testimony
        ur: نماز شہادت کے بعد دوسرا رکن ہے
    - text:
        ar: الحج
        en: the Hajj
        ur: حج
      correct: false
      why:
        ar: الحج الركن الأخير المشروط بالاستطاعة
        en: Hajj is the last pillar, conditioned on ability
        ur: حج آخری رکن ہے، استطاعت کی شرط کے ساتھ
    - text:
        ar: الزكاة
        en: zakat
        ur: زکوٰۃ
      correct: false
      why:
        ar: الزكاة الركن الثالث المالي
        en: zakat is the third pillar, the financial one
        ur: زکوٰۃ تیسرا رکن ہے، مالی رکن
  - q:
      ar: كم مرة يصلي المسلم في اليوم؟
      en: How many times does a Muslim pray daily?
      ur: مسلمان دن میں کتنی بار نماز پڑھتا ہے؟
    options:
    - text:
        ar: خمس مرات
        en: five times
        ur: پانچ بار
      correct: true
      why:
        ar: تذكر الكتب الصلوات الخمس من الفجر إلى العشاء
        en: books name the five prayers from dawn to night
        ur: کتابیں طلوع فجر سے عشاء تک پانچ نمازیں لکھتی ہیں
    - text:
        ar: مرة واحدة
        en: once
        ur: ایک بار
      correct: false
      why:
        ar: مرة واحدة لا تكمل العدد المشهور
        en: once does not match the familiar count
        ur: ایک بار مشہور گنتی پوری نہیں کرتی
    - text:
        ar: ثلاث مرات
        en: three times
        ur: تین بار
      correct: false
      why:
        ar: ثلاثة عدد الصلوات المجمعة أحيانًا لا المفروضة
        en: three is a count in combined prayer, not the required five
        ur: تین مجموعی نمازوں کی گنتی ہے، واجب پانچ کی نہیں
    - text:
        ar: عشر مرات
        en: ten times
        ur: دس بار
      correct: false
      why:
        ar: عشرة عدد النوافل لا الفرائض
        en: ten is the count of extras, not required prayers
        ur: دس نوافل کی گنتی ہے، فرائض کی نہیں
  - q:
      ar: ما الزكاة؟
      en: What is zakat?
      ur: زکوٰۃ کیا ہے؟
    options:
    - text:
        ar: حصة واجبة من المال للفقراء
        en: an obligatory share of wealth for the poor
        ur: مال میں سے غریبوں کا واجب حصہ
      correct: true
      why:
        ar: تفرض الكتب نسبة محددة لأصناف مستحقيها
        en: books set a fixed share for its eligible categories
        ur: کتابیں اس کے مستحقین کے لیے مقررہ حصہ لکھتی ہیں
    - text:
        ar: صدقة اختيارية
        en: voluntary charity
        ur: رضاکارانہ صدقہ
      correct: false
      why:
        ar: الزكاة فرض لا تطوّع، عكس الصدقة الاختيارية
        en: zakat is required, unlike optional charity
        ur: زکوٰۃ فرض ہے، اختیاری صدقے کے برعکس
    - text:
        ar: ضريبة للدولة
        en: a state tax
        ur: ریاستی ٹیکس
      correct: false
      why:
        ar: الزكاة عبادة مالية لا ضريبة مدنية
        en: zakat is a financial act of worship, not a civic tax
        ur: زکوٰۃ مالی عبادت ہے، سول ٹیکس نہیں
    - text:
        ar: هبة للأقارب
        en: a gift for relatives
        ur: رشتہ داروں کے لیے تحفہ
      correct: false
      why:
        ar: الزكاة للفقراء والمستحقين لا للأقارب خاصة
        en: zakat is for the poor and eligible, not family specifically
        ur: زکوٰۃ غریبوں اور مستحقین کے لیے ہے، خاص رشتہ داروں کے لیے نہیں
  - q:
      ar: متى يصوم المسلمون؟
      en: When do Muslims fast?
      ur: مسلمان کب روزہ رکھتے ہیں؟
    options:
    - text:
        ar: في شهر رمضان
        en: during Ramadan
        ur: رمضان کے مہینے میں
      correct: true
      why:
        ar: رمضان الشهر المفروض للصوم في الكتب
        en: Ramadan is the month of the required fast in the books
        ur: رمضان کتابوں میں واجب روزے کا مہینہ ہے
    - text:
        ar: كلّ يوم من السنة
        en: every day of the year
        ur: سال کا ہر دن
      correct: false
      why:
        ar: الصوم المفروض في رمضان لا طوال السنة
        en: the required fast is Ramadan, not all year
        ur: واجب روزہ رمضان کا ہے، پورے سال کا نہیں
    - text:
        ar: في أيام الحج فقط
        en: only during Hajj days
        ur: صرف حج کے دنوں میں
      correct: false
      why:
        ar: أيام الحج لها أعمالها الخاصة لا صومًا عامًّا
        en: Hajj days have their own rites, not a general fast
        ur: حج کے دن اپنے اعمال رکھتے ہیں، عمومی روزہ نہیں
    - text:
        ar: في موسم الشتاء فقط
        en: only in winter
        ur: صرف سردیوں میں
      correct: false
      why:
        ar: يجري رمضان في المواسم كلها عبر السنين
        en: Ramadan runs through all seasons over the years
        ur: رمضان برسوں کے دوران ہر موسم میں آتا ہے
  - q:
      ar: من يجب عليه الحج؟
      en: Who must perform Hajj?
      ur: حج کس پر فرض ہے؟
    options:
    - text:
        ar: من استطاع بدنيًا وماليًا
        en: whoever is physically and financially able
        ur: جو جسمانی اور مالی طور پر مائل ہو
      correct: true
      why:
        ar: تشترط الكتب الاستطاعة شرطًا للحج
        en: the books make ability the Hajj's condition
        ur: کتابیں استطاعت کو حج کی شرط بناتی ہیں
    - text:
        ar: كلّ مسلم دون استثناء
        en: every Muslim without exception
        ur: ہر مسلمان بلا استثنا
      correct: false
      why:
        ar: الاستطاعة شرط، فالعاجز معذور
        en: ability is a condition, so the unable are excused
        ur: استطاعت شرط ہے، لہٰذا عاجز معذور ہے
    - text:
        ar: الرجال فقط
        en: only men
        ur: صرف مرد
      correct: false
      why:
        ar: تحجّ النساء والرجال على السواء
        en: women and men perform Hajj alike
        ur: عورتیں اور مرد یکساں حج کرتے ہیں
    - text:
        ar: سكان مكة فقط
        en: only Mecca's residents
        ur: صرف مکہ کے رہائشی
      correct: false
      why:
        ar: يأتي الحجاج من العالم كله لا من مكة وحدها
        en: pilgrims come from the whole world, not just Mecca
        ur: حجاج پوری دنیا سے آتے ہیں، صرف مکہ سے نہیں
  - q:
      ar: ما الذي تجمعه الأركان الخمسة؟
      en: What do the five pillars bind together?
      ur: پانچ ارکان کیا جوڑتے ہیں؟
    options:
    - text:
        ar: الإيمان والعبادة والتكافل
        en: faith, worship and solidarity
        ur: ایمان، عبادت اور یکجہتی
      correct: true
      why:
        ar: تربط الأركان القلب والبدن والمال بالمجتمع
        en: the pillars tie heart, body and wealth to the community
        ur: ارکان دل، جسم اور مال کو معاشرے سے جوڑتے ہیں
    - text:
        ar: العبادات فقط
        en: worship only
        ur: صرف عبادتیں
      correct: false
      why:
        ar: فيها أيضًا عقد اجتماعي مالي
        en: they include a social-financial contract too
        ur: ان میں سماجی-مالی عہد بھی شامل ہے
    - text:
        ar: العقيدة فقط
        en: belief only
        ur: صرف عقیدہ
      correct: false
      why:
        ar: فيها أعمال بدنية ومالية أيضًا
        en: they include bodily and financial acts too
        ur: ان میں جسمانی اور مالی اعمال بھی ہیں
    - text:
        ar: المال فقط
        en: wealth only
        ur: صرف مال
      correct: false
      why:
        ar: المال جانب منها لا كلّها
        en: wealth is one side, not the whole
        ur: مال ایک پہلو ہے، سب کچھ نہیں
  - q:
      ar: من كتب عن الأركان الخمسة؟
      en: Who wrote about the five pillars?
      ur: پانچ ارکان کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب الفقه والحديث منذ القرون الأولى
        en: books of law and hadith since the early centuries
        ur: ابتدائی صدیوں سے فقہ اور حدیث کی کتابیں
      correct: true
      why:
        ar: تذكرها مصادر مثل البخاري وكتب الفقه منذ القدم
        en: sources like Bukhari and fiqh books list them from early on
        ur: بخاری جیسے ماخذ اور فقہ کی کتابیں انہیں شروع سے لکھتی ہیں
    - text:
        ar: مؤرخو الحروب الصليبية
        en: Crusade historians
        ur: صلیبی جنگوں کے مؤرخین
      correct: false
      why:
        ar: كتب الفقه الإسلامية أولى بالأركان
        en: Islamic fiqh books are the primary place for the pillars
        ur: ارکان کی بنیادی جگہ اسلامی فقہ کی کتابیں ہیں
    - text:
        ar: علماء الأحياء فقط
        en: only biologists
        ur: صرف ماہرینِ حیاتیات
      correct: false
      why:
        ar: الأركان موضوع ديني لا علمي حيوي
        en: the pillars are a religious subject, not biological
        ur: ارکان مذہبی موضوع ہیں، حیاتیاتی نہیں
    - text:
        ar: لا أحد؛ نصّ شفهي فقط
        en: nobody; oral text only
        ur: کوئی نہیں؛ صرف زبانی روایت
      correct: false
      why:
        ar: كُتبت الأركان في الكتب منذ القرون الأولى
        en: the pillars were written down from the early centuries
        ur: ارکان ابتدائی صدیوں سے لکھے جا رہے ہیں
  - q:
      ar: ما التوحيد في الشهادة؟
      en: What is tawhid in the testimony?
      ur: شہادت میں توحید کیا ہے؟
    options:
    - text:
        ar: إفراد الله بالعبادة
        en: singling out God in worship
        ur: اللہ کو یکتا ماننا
      correct: true
      why:
        ar: تُقسم الشهادة بين إثبات الوحدانية ورسالة النبي
        en: the testimony pairs God's oneness with the Prophet's message
        ur: شہادت اللہ کی وحدانیت اور نبی کے رسالت کو جوڑتی ہے
    - text:
        ar: تعدد الآلهة
        en: many gods
        ur: بہت سے معبود
      correct: false
      why:
        ar: التوحيد هو ضدّ الشرك لا تأكيده
        en: tawhid is the opposite of polytheism
        ur: توحید شرک کے برعکس ہے
    - text:
        ar: عبادة الأنبياء
        en: worshipping prophets
        ur: نبیوں کی عبادت
      correct: false
      why:
        ar: النبي رسول لا معبود في الشهادة
        en: the Prophet is a messenger, not worshipped, in the testimony
        ur: نبی شہادت میں رسول ہیں، معبود نہیں
    - text:
        ar: فلسفة يونانية
        en: Greek philosophy
        ur: یونانی فلسفہ
      correct: false
      why:
        ar: التوحيد عقيدة إسلامية لا فلسفة مستوردة
        en: tawhid is Islamic doctrine, not imported philosophy
        ur: توحید اسلامی عقیدہ ہے، درآمدہ فلسفہ نہیں
  - q:
      ar: متى يُعفى المسلم من الحج؟
      en: When is a Muslim excused from Hajj?
      ur: مسلمان کب حج سے معذور ہوتا ہے؟
    options:
    - text:
        ar: عند عدم الاستطاعة
        en: when unable physically or financially
        ur: جب جسمانی یا مالی طور پر عاجز ہو
      correct: true
      why:
        ar: شرط الاستطاعة يعفي من لا يقدر عليها
        en: the ability condition excuses whoever cannot perform it
        ur: استطاعت کی شرط اس شخص کو معذور کرتی ہے جو نہیں کر سکتا
    - text:
        ar: أبدًا؛ فهو واجب دائمًا
        en: never; it is always required
        ur: کبھی نہیں؛ یہ ہمیشہ فرض ہے
      correct: false
      why:
        ar: الاستطاعة شرط، فالعاجز معذور
        en: ability is the condition, so the unable are excused
        ur: استطاعت شرط ہے، لہٰذا عاجز معذور ہے
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: الحج مرتبط بذي الحجة لا برمضان
        en: Hajj is tied to Dhu al-Hijja, not Ramadan
        ur: حج ذوالحجہ سے جڑا ہے، رمضان سے نہیں
    - text:
        ar: بعد الستين فقط
        en: only after sixty
        ur: صرف ساٹھ کے بعد
      correct: false
      why:
        ar: لا يتعلق الإعفاء بالعمر بل بالقدرة
        en: the excuse depends on ability, not age
        ur: معذوریت عمر نہیں بلکہ استطاعت پر منحصر ہے
- id: salah
  anchor: practice/salah
  band: scholars
  title:
    ar: الصلاة
    en: the prayer
    ur: نماز
  sixty:
    ar: 'الصلاة خمس مرات في اليوم توقف نهار المسلم وتصله بربه: الفجر والظهر والعصر والمغرب والعشاء. قبلها الطهارة بالماء ليكون البدن والثوب والمكان نظيفًا، ثم يتّجه المصلّي إلى القبلة أي الكعبة في مكة. تبدأ بالتكبير: يقول «الله أكبر» فينهض راكعًا ساجدًا على مراحل تقام بوحدة اسمها الركعة. وفي جماعة تقف الصفوف كتفًا إلى كتف وراء الإمام، فيتعلم الناس المساواة حتى بين الغني والفقير. وفي الجمعة تجتمع البلدة في مسجد واحد وخطبة تذكّر، وفي رمضان تمتد التراويح في الليل. هكذا صارت الصلاة عادة يومية ورباط جماعة معًا. ولذا كانت أول ما يسأل عنه العبد يوم القيامة في الحديث، فإن صلحت صلح عمله كله؛ هي مقياس اليوم المسلم كله. وهي أيضًا عهد الجماعة: يتساوى فيها الملوك والرعاع، ويلتقي الغريب أهل المسجد في قلب مدينةٍ لا يعرفها، فيجد بيته الثاني. وتختلف الحركات بين مذهب وآخر في التفاصيل، لكن الهيكل واحد في كل أرض: تكبير وقراءة وركوع وسجود وسلام.'
    en: 'Prayer five times a day pauses a Muslim''s daylight and ties it to God: dawn, noon, afternoon, sunset and night. Before it comes purification with water, so body, clothes and ground are clean; then the worshipper turns to the qibla — the Kaaba in Mecca. It opens with the takbir, ''God is greatest'', moving through standings, bowings and prostrations in units called raka''at. In congregation the rows stand shoulder to shoulder behind the imam, and the town learns its equality — rich and poor on one carpet. On Friday the whole quarter gathers in one mosque for a sermon; in Ramadan tarawih stretches the night. Thus prayer became both a daily habit and the community''s bond. Hence the hadith makes it the first thing a servant is asked about on Judgment Day — if it is sound, his whole work is sound; it is the measure of the Muslim day.'
    ur: 'دن میں پانچ بار نماز مسلمان کے دن کو روک کر خدا سے جوڑتی ہے: فجر، ظہر، عصر، مغرب اور عشاء۔ اس سے پہلے پانی سے طہارت تاکہ بدن، کپڑے اور جگہ پاک ہوں، پھر قبلہ — مکہ میں کعبہ — کی طرف رخ کیا جاتا ہے۔ تکبیر سے شروع ہو کر عبادت قیام، رکوع اور سجدوں میں گزرتے ہوئے رکعات کہلائی جانے والی اکائیوں میں چلتی ہے۔ جماعت میں صفیں کندھے سے کندھا ملا کر امام کے پیچھے کھڑی ہوتی ہیں اور امیر و فقیر ایک قالین پر برابر ہو جاتے ہیں۔ جمعے کو محلہ ایک مسجد اور خطبے میں جمع ہوتا ہے؛ رمضان میں تراویح رات کو طول دیتی ہے۔ اس طرح نماز روزانہ عادت اور برادری کا بندھن دونوں بن گئی۔ اسی لیے حدیث میں قیامت کے دن بندے سے پہلی چیز یہی پوچھی جائے گی — اگر یہ درست تو سارا عمل درست؛ یہ مسلمان کے دن کا پیمانہ ہے۔'
  glossary:
  - term:
      ar: الطهارة
      en: the purification
      ur: طہارت
    gloss:
      ar: 'التنظيف بالماء قبل الصلاة، وضوءًا أو غسلًا، شرط صحتها الأول'
      en: 'washing with water before prayer — wudu or full bath — its first condition'
      ur: 'نماز سے پہلے پانی سے صفائی — وضو یا غسل — اس کی پہلی شرط'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي تواجهه الصلوات جميعًا: نحو الكعبة في مكة'
      en: 'the direction every prayer faces — toward the Kaaba in Mecca'
      ur: 'وہ سمت جس کی طرف ہر نماز پڑھی جاتی ہے — مکہ میں کعبہ'
  - term:
      ar: الجماعة
      en: the congregation
      ur: جماعت
    gloss:
      ar: 'الاجتماع للصلاة وراء الإمام صفًّا واحدًا، تعليم المساواة'
      en: 'standing together behind the imam in one row — equality taught'
      ur: 'امام کے پیچھے ایک صف میں کھڑے ہونا — برابری کی تعلیم'
  - term:
      ar: الركوع
      en: the bowing
      ur: رکوع
    gloss:
      ar: 'الانحناء في الصلاة راحةً على الركبتين بعد القيام'
      en: 'the bow in prayer resting hands on knees after standing'
      ur: 'نماز میں قیام کے بعد گھٹنوں پر ہاتھ رکھ کر جھکنا'
  - term:
      ar: السجود
      en: the prostration
      ur: سجدہ
    gloss:
      ar: 'وضع الجبهة على الأرض تواضعًا لله في كل ركعة مرتين'
      en: 'placing the forehead on the ground humbling to God, twice in every unit'
      ur: 'ہر رکعت میں دو بار پیشانی زمین پر رکھ کر خدا کے آگے عاجزی'
  - term:
      ar: الركعة
      en: the unit
      ur: رکعت
    gloss:
      ar: 'الوحدة المعدودة من القيام والركوع والسجود التي تتألف منها الصلوات'
      en: 'the counted unit of standing, bowing and prostrations prayers are made of'
      ur: 'قیام، رکوع اور سجود کی گنی ہوئی اکائی جس سے نمازیں بنتی ہیں'
  - term:
      ar: النية
      en: the intention
      ur: نیت
    gloss:
      ar: 'القصد الذي يعقد به المصلّي نفسه قبل أن يبدأ صلاته'
      en: 'the resolve the worshipper binds themselves with before the prayer begins'
      ur: 'وہ ارادہ جس سے نمازی نماز شروع کرنے سے پہلے خود کو باندھتا ہے'
  - term:
      ar: التكبير
      en: the takbir
      ur: تکبیر
    gloss:
      ar: '«الله أكبر» كلمة الدخول في الصلاة وبها تُفتتح وتُنقل أقسامها'
      en: '''God is greatest'', the entry word that opens prayer and moves its parts'
      ur: '«اللہ سب سے بڑا ہے» وہ لفظ جو نماز کھولتا اور اس کے مراحل بدلتا ہے'
  - term:
      ar: الخمسة
      en: the five
      ur: پانچ
    gloss:
      ar: 'الصلوات الخمس اليومية التي رتّبها الله على المسلمين أوقاتًا معلومة'
      en: 'the five daily devotions God fixed on Muslims at stated times'
      ur: 'پانچ روزانہ عبادتیں جو خدا نے مقررہ اوقات پر مسلمانوں پر لگائیں'
  - term:
      ar: الجمعة
      en: Friday
      ur: جمعہ
    gloss:
      ar: 'يوم الاجتماع الأسبوعي الذي تخطب فيه الخطبة وتجتمع الأمة'
      en: 'the weekly gathering day with its sermon when the ummah assembles'
      ur: 'ہفتہ وار اجتماع کا دن جس میں خطبہ ہوتا اور امت جمع ہوتی ہے'
  - term:
      ar: التراويح
      en: the night prayers
      ur: تراویح
    gloss:
      ar: 'الصلوات الليلية في رمضان تقام بعد العشاء في الجماعة'
      en: 'the night devotions of Ramadan held after isha in congregation'
      ur: 'رمضان کی رات کی عبادتیں جو عشاء کے بعد جماعت سے ہوتی ہیں'
  - term:
      ar: السنن
      en: the extra prayers
      ur: سنتیں
    gloss:
      ar: 'الصلوات المستحبة غير المفروضة التي يزيدها العبد على ما كُتب عليه'
      en: 'the beloved extra devotions a servant adds beyond what is prescribed'
      ur: 'محبوب اضافی عبادتیں جو بندہ مقررہ فرائض کے علاوہ کرتا ہے'
  practice:
  - q:
      ar: كم صلاة في اليوم؟
      en: How many prayers a day?
      ur: دن میں کتنی نمازیں؟
    options:
    - text:
        ar: خمس
        en: five
        ur: پانچ
      correct: true
      why:
        ar: الفجر والظهر والعصر والمغرب والعشاء
        en: dawn, noon, afternoon, sunset and night
        ur: فجر، ظہر، عصر، مغرب اور عشاء
    - text:
        ar: ثلاث
        en: three
        ur: تین
      correct: false
      why:
        ar: ثلاثة عدد الصلوات المجمعة أحيانًا لا المفروضة
        en: three is a count in combined prayer, not the required five
        ur: تین مجموعی نمازوں کی گنتی ہے، واجب پانچ کی نہیں
    - text:
        ar: سبع
        en: seven
        ur: سات
      correct: false
      why:
        ar: سبعة عدد أبواب المدينة لا الصلوات
        en: seven is the count of gates or days, not prayers
        ur: سات دروازوں یا دنوں کی گنتی ہے، نمازوں کی نہیں
    - text:
        ar: عشر
        en: ten
        ur: دس
      correct: false
      why:
        ar: عشرة عدد النوافل لا الفرائض
        en: ten is the count of extras, not required prayers
        ur: دس نوافل کی گنتی ہے، فرائض کی نہیں
  - q:
      ar: إلى أيّ اتجاه تصلى؟
      en: In which direction is salah prayed?
      ur: نماز کس سمت پڑھی جاتی ہے؟
    options:
    - text:
        ar: نحو الكعبة في مكة
        en: toward the Kaaba in Mecca
        ur: مکہ میں کعبہ کی طرف
      correct: true
      why:
        ar: القبلة نحو الكعبة منذ البداية بعد التحويل
        en: the qibla has been toward the Kaaba since the change
        ur: قبلہ تبدیلی کے بعد سے کعبہ کی طرف ہے
    - text:
        ar: نحو القدس دائمًا
        en: always toward Jerusalem
        ur: ہمیشہ بیت المقدس کی طرف
      correct: false
      why:
        ar: كان القدس القبلة الأولى ثم حُوّلت إلى الكعبة
        en: Jerusalem was the first qibla, then it changed to the Kaaba
        ur: بیت المقدس پہلا قبلہ تھا، پھر کعبہ کی طرف بدل گیا
    - text:
        ar: نحو الشرق فقط
        en: only east
        ur: صرف مشرق
      correct: false
      why:
        ar: القبلة تختلف بحسب مكان المصلي
        en: the qibla varies by the pray-er's location
        ur: قبلہ مقام کے حساب سے بدلتا ہے
    - text:
        ar: لا اتجاه معين
        en: no fixed direction
        ur: کوئی مقررہ سمت نہیں
      correct: false
      why:
        ar: القبلة جزء أساسي من الصلاة
        en: the qibla is a basic part of the prayer
        ur: قبلہ نماز کا بنیادی حصہ ہے
  - q:
      ar: ماذا يسبق الصلاة؟
      en: What comes before the prayer?
      ur: نماز سے پہلے کیا ہوتا ہے؟
    options:
    - text:
        ar: الطهارة بالوضوء
        en: purification by washing
        ur: وضو سے طہارت
      correct: true
      why:
        ar: تشترط الكتب الطهارة شرطًا قبل الدخول في الصلاة
        en: the books make purification a condition before the prayer
        ur: کتابیں طہارت کو نماز سے پہلے شرط بناتی ہیں
    - text:
        ar: الأكل مباشرة
        en: eating right away
        ur: فوراً کھانا
      correct: false
      why:
        ar: تُصلى على طهارة لا على معدة ممتلئة
        en: salah is prayed in purity, not on a full stomach
        ur: نماز طہارت میں پڑھی جاتی ہے، بھری معدے پر نہیں
    - text:
        ar: النوم
        en: sleeping
        ur: سونا
      correct: false
      why:
        ar: النوم ناقض للطهارة لا مقدمة لها
        en: sleep breaks purification, it does not prepare it
        ur: نیند طہارت توڑتی ہے، اس کی تیاری نہیں
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: الطهارة شرط ثابت في الكتب
        en: purification is a fixed condition in the books
        ur: طہارت کتابوں میں مقررہ شرط ہے
  - q:
      ar: أين تصلى الجمعة؟
      en: Where is the Friday prayer held?
      ur: جمعے کی نماز کہاں ہوتی ہے؟
    options:
    - text:
        ar: في المسجد جماعةً
        en: in the mosque in congregation
        ur: مسجد میں جماعت کے ساتھ
      correct: true
      why:
        ar: الجمعة صلاة جماعة مع الخطبة في المسجد
        en: Friday is a congregational prayer with a sermon in the mosque
        ur: جمعہ مسجد میں خطبے کے ساتھ جماعت کی نماز ہے
    - text:
        ar: في البيت وحدها
        en: alone at home
        ur: گھر میں تنہا
      correct: false
      why:
        ar: يتطلب الجمعة الجماعة والخطبة في المسجد
        en: Friday requires congregation and sermon in the mosque
        ur: جمعہ مسجد میں جماعت اور خطبہ چاہتا ہے
    - text:
        ar: في المدرسة فقط
        en: only in school
        ur: صرف سکول میں
      correct: false
      why:
        ar: تصلى الجمعة في أيّ مسجد جامع لا في المدرسة خاصة
        en: Friday is prayed in any congregational mosque, not only school
        ur: جمعہ کسی بھی جامع مسجد میں ہوتا ہے، صرف سکول میں نہیں
    - text:
        ar: في السوق
        en: in the market
        ur: بازار میں
      correct: false
      why:
        ar: ليس السوق مكان الجمعة
        en: the market is not the place for Friday
        ur: بازار جمعے کی جگہ نہیں
  - q:
      ar: ما التكبير؟
      en: What is the takbir?
      ur: تکبیر کیا ہے؟
    options:
    - text:
        ar: قول "الله أكبر" لافتتاح الصلاة
        en: saying "God is greatest" to open the prayer
        ur: نماز کھولنے کے لیے "اللہ اکبر" کہنا
      correct: true
      why:
        ar: تُفتح الصلاة بالتكبير ويُكرر في مواضعها
        en: the prayer opens with the takbir and repeats it in its places
        ur: نماز تکبیر سے کھلتی ہے اور اپنے مقامات پر دہراتی ہے
    - text:
        ar: اسم المسجد
        en: the mosque's name
        ur: مسجد کا نام
      correct: false
      why:
        ar: التكبير عبارة لا اسم مكان
        en: takbir is a phrase, not a place name
        ur: تکبیر ایک فقرہ ہے، جگہ کا نام نہیں
    - text:
        ar: نوع من الصدقة
        en: a kind of charity
        ur: ایک قسم کا صدقہ
      correct: false
      why:
        ar: التكبير ذكر لا عمل مالي
        en: takbir is remembrance, not a financial act
        ur: تکبیر ذکر ہے، مالی عمل نہیں
    - text:
        ar: صلاة الليل
        en: the night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: التكبير جزء من كلّ صلاة لا صلاة خاصة
        en: takbir is part of every prayer, not a separate one
        ur: تکبیر ہر نماز کا حصہ ہے، الگ نماز نہیں
  - q:
      ar: متى تصلى الجمعة؟
      en: When is the Friday prayer?
      ur: جمعے کی نماز کب ہوتی ہے؟
    options:
    - text:
        ar: يوم الجمعة وقت الظهر
        en: on Friday at noon
        ur: جمعے کے دن ظہر کے وقت
      correct: true
      why:
        ar: تُعقد الجمعة في موعد الظهر مع الخطبة
        en: Friday prayer is held at noon with the sermon
        ur: جمعہ ظہر کے وقت خطبے کے ساتھ ہوتا ہے
    - text:
        ar: كلّ يوم عند الغروب
        en: every day at sunset
        ur: ہر دن غروب پر
      correct: false
      why:
        ar: يوم الجمعة خاص لا يومي
        en: Friday is a special day, not daily
        ur: جمعہ ایک خاص دن ہے، روزانہ نہیں
    - text:
        ar: مرة في الشهر
        en: once a month
        ur: مہینے میں ایک بار
      correct: false
      why:
        ar: الجمعة أسبوعية لا شهرية
        en: Friday is weekly, not monthly
        ur: جمعہ ہفتہ وار ہے، ماہانہ نہیں
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: تصلى الجمعة طوال السنة لا في رمضان وحده
        en: Friday is prayed all year, not only in Ramadan
        ur: جمعہ پورے سال ہوتا ہے، صرف رمضان میں نہیں
  - q:
      ar: ما الركعة؟
      en: What is a rak'ah?
      ur: رکعت کیا ہے؟
    options:
    - text:
        ar: دورة من الوقوف والركوع والسجود
        en: a cycle of standing, bowing and prostration
        ur: کھڑے ہونے، رکوع اور سجدے کا ایک دور
      correct: true
      why:
        ar: تُقسّم كلّ صلاة إلى ركعات ثابتة العدد
        en: each prayer is divided into a fixed number of units
        ur: ہر نماز مقررہ رکعتوں میں بٹی ہوتی ہے
    - text:
        ar: نوع من الصدقة
        en: a kind of charity
        ur: ایک قسم کا صدقہ
      correct: false
      why:
        ar: الركعة جزء حركي من الصلاة لا صدقة
        en: a rak'ah is a prayer movement, not charity
        ur: رکعت نماز کی حرکت ہے، صدقہ نہیں
    - text:
        ar: خطبة الجمعة
        en: the Friday sermon
        ur: جمعے کا خطبہ
      correct: false
      why:
        ar: الخطبة منفصلة عن الركعات
        en: the sermon is separate from the units
        ur: خطبہ رکعتوں سے الگ ہے
    - text:
        ar: اسم المسجد
        en: the mosque's name
        ur: مسجد کا نام
      correct: false
      why:
        ar: الركعة وحدة عبادة لا مكان
        en: a rak'ah is a worship unit, not a place
        ur: رکعت عبادت کی اکائی ہے، جگہ نہیں
  - q:
      ar: لماذا تُقسّم الصلاة إلى خمس؟
      en: Why is the prayer divided into five?
      ur: نماز پانچ میں کیوں بٹی ہے؟
    options:
    - text:
        ar: لتوقف الحياة خمس مرات يوميًّا نحو الله
        en: to pause life toward God five times a day
        ur: دن میں پانچ بار اللہ کی طرف وقفہ کے لیے
      correct: true
      why:
        ar: تذكر الكتب الصلوات الخمس كمواقيت ثابتة للذكر
        en: the books describe the five as fixed times for remembrance
        ur: کتابیں پانچ کو ذکر کے مقررہ اوقات کے طور پر لکھتی ہیں
    - text:
        ar: لأنّ الأيام خمسة في الأسبوع
        en: because there are five days in a week
        ur: کیونکہ ہفتے میں پانچ دن ہیں
      correct: false
      why:
        ar: الأسبوع سبعة أيام لا خمسة
        en: a week has seven days, not five
        ur: ہفتے میں سات دن ہیں، پانچ نہیں
    - text:
        ar: لأنّ الأركان خمسة أيضًا
        en: because the pillars are also five
        ur: کیونکہ ارکان بھی پانچ ہیں
      correct: false
      why:
        ar: الصدفة رقمية لا علّة
        en: the match in number is coincidence, not the reason
        ur: تعداد میں مماثلت اتفاق ہے، وجہ نہیں
    - text:
        ar: لأنّها سهلة
        en: because it is easy
        ur: کیونکہ یہ آسان ہے
      correct: false
      why:
        ar: العدد ثابت في النصوص لا للسهولة
        en: the count is fixed in the texts, not for ease
        ur: تعداد نصوص میں مقررہ ہے، آسانی کے لیے نہیں
  - q:
      ar: من يصلي؟
      en: Who prays?
      ur: نماز کون پڑھتا ہے؟
    options:
    - text:
        ar: كلّ مسلم بالغ عاقل قادر
        en: every adult, sane, able Muslim
        ur: ہر بالغ، عاقل، قادر مسلمان
      correct: true
      why:
        ar: تشترط الكتب البلوغ والعقل والقدرة للصلاة
        en: the books condition prayer on maturity, sanity and ability
        ur: کتابیں نماز پر بلوغت، عقل اور استطاعت کی شرط لگاتی ہیں
    - text:
        ar: الرجال فقط
        en: only men
        ur: صرف مرد
      correct: false
      why:
        ar: تُصلي النساء والرجال على السواء
        en: women and men pray alike
        ur: عورتیں اور مرد یکساں نماز پڑھتے ہیں
    - text:
        ar: في المسجد فقط
        en: only in the mosque
        ur: صرف مسجد میں
      correct: false
      why:
        ar: تصلى في أيّ مكان طاهر لا في المسجد وحده
        en: salah is prayed anywhere pure, not only the mosque
        ur: نماز کسی پاک جگہ میں ہوتی ہے، صرف مسجد میں نہیں
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: الصلاة يومية طوال السنة
        en: the prayer is daily all year
        ur: نماز پورے سال روزانہ ہے
  - q:
      ar: ما الجماعة؟
      en: What is the congregation?
      ur: جماعت کیا ہے؟
    options:
    - text:
        ar: الصلاة مع الناس في المسجد أو أيّ مكان
        en: praying with others in a mosque or anywhere
        ur: مسجد میں یا کہیں بھی لوگوں کے ساتھ نماز
      correct: true
      why:
        ar: تُثيب الكتب الجماعة أكثر من الفرادى
        en: the books reward congregational prayer over individual
        ur: کتابیں جماعت کو انفرادی پر فضیلت دیتی ہیں
    - text:
        ar: صلاة الجمعة وحدها
        en: only the Friday prayer
        ur: صرف جمعے کی نماز
      correct: false
      why:
        ar: الجماعة تصلى في أيّ وقت لا الجمعة وحدها
        en: congregation is prayed at any time, not only Friday
        ur: جماعت کسی بھی وقت ہوتی ہے، صرف جمعہ نہیں
    - text:
        ar: صلاة العيدين فقط
        en: only the two Eid prayers
        ur: صرف دونوں عیدوں کی نماز
      correct: false
      why:
        ar: العيدان جماعة خاصة لا معنى الجماعة العام
        en: the Eids are special congregations, not the general meaning
        ur: عیدیں خاص جماعتیں ہیں، عمومی معنی نہیں
    - text:
        ar: لا صلاة مشتركة في الإسلام
        en: there is no shared prayer in Islam
        ur: اسلام میں مشترک نماز نہیں
      correct: false
      why:
        ar: الجماعة جزء أساسي من التدين
        en: congregation is a basic part of devotion
        ur: جماعت عبادت کا بنیادی حصہ ہے
- id: badr
  anchor: event/battle-of-badr
  band: scholars
  title:
    ar: غزوة بدر
    en: the battle of Badr
    ur: غزوۂ بدر
  sixty:
    ar: 'في رمضان من السنة الثانية للهجرة (٦٢٤م) التقى جيشان صغيران عند بدر: ثلاثمائة ونحو ثلاثة عشر من المسلمين ضد نحو ألف من قريش وقّفوا مع قافلتها العائدة من الشام. كان النصر للمسلمين، فقتلت قريش صناديدها وأسر نحو سبعين منها. في القرآن يوم الفرقان: يوم تميّز الحق وتمكّنت الدعوة الجديدة، وذُكرت ملائكة تؤيد المؤمنين. بعد النصر عاد أسرى كثيرون بالفدية أو بتعليم أبناء المسلمين القراءة والكتابة. فصار بدر اسمًا للتدخل الإلهي وبداية فترة غيّرت ميزان القوى في الجزيرة، حتى ما كان من الممكن أن تبقى المدينة صامدة بدونه. وحفظ المسلمون ذكراه كل رمضان، وتليت آياته في كل جيل، حتى صار ميزانًا يقاس عليه نصر العقيدة بالقلة. ولهذا لا يقرأ المسلم بدر حربًا صغيرة، بل يومًا قرّر مصير دعوة كاملة: إن تسقط تسقط المدينة، وإن تنتصر فعالمٌ يتغيّر. ونزلت في يومه سورة الأنفال تدبّر دروسه: الإعداد ثم التوكل، والصبر ثم النصر، والنظام قبل العدد.'
    en: 'In Ramadan of the second Hijri year (624 CE), two small armies met at Badr: about 313 Muslims against nearly a thousand Quraysh guarding their caravan home from Syria. Victory went to the Muslims; the Quraysh lost their champions and about seventy were captured. The Qur''an calls it the Day of the Criterion — the day truth was marked out and the new call stood firm — and remembers angels strengthening the believers. Many captives returned home by ransom or by teaching Muslim children to read and write. So Badr became a name for divine aid and the start of a period that tilted the peninsula''s balance of power; without it Medina might not have survived at all. Muslims keep its memory every Ramadan and recite its verses in every generation, until it became the measure by which faith''s victory with few numbers is judged.'
    ur: 'ہجرت کے دوسرے سال رمضان میں (624ء) بدر کے مقام پر دو چھوٹی فوجیں ملی: تقریباً 313 مسلمان، اور قریب ہزار قریشی جو شام سے لوٹتی قافلے کی حفاظت پر تھے۔ فتح مسلمانوں کو ملی؛ قریش کے سردار مارے گئے اور تقریباً ستر قید ہوئے۔ قرآن اسے یومِ فرقان کہتا ہے — وہ دن جب حق اور باطل الگ ہوئے اور نئی دعوت قائم ہوئی — اور فرشتوں کی مدد یاد کرتا ہے۔ بہت سے قیدی فدیے سے یا مسلم بچوں کو پڑھنا لکھنا سکھا کر لوٹے۔ بدر اس طرح الہی مدد کا نام بنا اور جزیرے میں طاقت کا توازن بدلنے والے دور کا آغاز؛ اس کے بغیر مدینہ شاید قائم نہ رہتا۔ مسلمان ہر رمضان اس کی یاد رکھتے ہیں اور ہر نسل اس کی آیات تلاوت کرتی ہے، یہاں تک کہ وہ قلیل تعداد سے عقیدے کی فتح کا پیمانہ بنا۔'
  glossary:
  - term:
      ar: بدر
      en: Badr
      ur: بدر
    gloss:
      ar: 'الموضع بين مكة والمدينة حيث وقعت الموقعة الكبرى سنة ٦٢٤م'
      en: 'the spot between Mecca and Medina where the great clash happened in 624 CE'
      ur: 'مکہ اور مدینہ کے درمیان مقام جہاں 624ء میں بڑی جنگ ہوئی'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'قبيلة مكة الحاكمة التي قادت المعارضة للدعوة الجديدة سنوات'
      en: 'Mecca''s ruling tribe that led the opposition to the new call for years'
      ur: 'مکہ کا حکمران قبیلہ جس نے برسوں نئی دعوت کی مخالفت کی'
  - term:
      ar: يوم الفرقان
      en: the Day of the Criterion
      ur: یومِ فرقان
    gloss:
      ar: 'الاسم القرآني ليوم بدر حيث تميّز الحق من الباطل'
      en: 'the Qur''an''s name for Badr''s day when truth was marked from falsehood'
      ur: 'بدر کے دن کا قرآنی نام جب حق اور باطل الگ ہوئے'
  - term:
      ar: القافلة
      en: the caravan
      ur: قافلہ
    gloss:
      ar: 'قافلة قريش التجارية العائدة من الشام التي خرج لحمايتها جيشهم'
      en: 'the Quraysh trade caravan returning from Syria their army marched to protect'
      ur: 'قریش کا تجارتی قافلہ شام سے لوٹتا جس کی حفاظت پر ان کی فوج نکلی'
  - term:
      ar: الأسرى
      en: the captives
      ur: اسیر
    gloss:
      ar: 'المأسورون في الموقعة الذين عاد بعضهم بفدية أو بتعليم المسلمين'
      en: 'the captives of the battle, some freed for ransom or for teaching Muslims'
      ur: 'جنگ کے قیدی جن میں بعض فدیے یا مسلمانوں کو سکھانے پر چھوٹے'
  - term:
      ar: المدينة
      en: Medina
      ur: مدینہ
    gloss:
      ar: 'المدينة التي صارت مركز الدعوة بعد الهجرة ومنها انطلقت الموقعة'
      en: 'the city that became the call''s center after the Hijra and from which the battle set out'
      ur: 'وہ شہر جو ہجرت کے بعد دعوت کا مرکز بنا اور جہاں سے جنگ نکلی'
  - term:
      ar: أحد
      en: Uhud
      ur: احد
    gloss:
      ar: 'الجبل قرب المدينة حيث وقعت معركة ثانية بعد سنة من بدر'
      en: 'the hill near Medina where a second battle came a year after Badr'
      ur: 'مدینہ کے قریب پہاڑ جہاں بدر کے ایک سال بعد دوسری جنگ ہوئی'
  - term:
      ar: خيبر
      en: Khaybar
      ur: خیبر
    gloss:
      ar: 'واحة شمال المدينة سقطت في يد المسلمين بعد سنين من بدر'
      en: 'the oasis north of Medina that fell to Muslims years after Badr'
      ur: 'مدینہ کے شمال کا وہ نخلستان جو بدر کے برسوں بعد مسلمانوں کے ہاتھ آیا'
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: 'دخول النبي مكة منتصرًا سنة ٦٣٠ خاتمة الصراع الذي بدأ من بدر'
      en: 'the Prophet''s victorious entry into Mecca in 630, the end of the struggle begun at Badr'
      ur: '630 میں نبی کا مکہ میں فاتحانہ داخلہ — بدر سے شروع کشمکش کا خاتمہ'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'الشهر الذي وقعت فيه الوقعة، وكان المسلمون صائمين في قتالهم'
      en: 'the month the battle fell in — the Muslims were fasting as they fought'
      ur: 'وہ مہینہ جس میں جنگ ہوئی — مسلمان لڑتے ہوئے روزے سے تھے'
  - term:
      ar: الثلاثمائة
      en: the three hundred
      ur: تین سو
    gloss:
      ar: 'عدد المسلمين المقاتلين في بدر تقريبًا، قلة أمام ألف'
      en: 'the rough count of Muslim fighters at Badr, a few facing a thousand'
      ur: 'بدر میں لڑنے والے مسلمانوں کی تقریبی گنتی — ہزار کے سامنے قلیل'
  - term:
      ar: السنة الثانية
      en: the second year
      ur: دوسرا سال
    gloss:
      ar: 'سنة الهجرة الثانية التي شهدت الوقعة وفيها تغيّرت الأحوال'
      en: 'the second Hijri year that held the battle and in which fortunes changed'
      ur: 'ہجرت کا دوسرا سال جس میں جنگ ہوئی اور بخت بدلے'
  practice:
  - q:
      ar: متى كانت غزوة بدر؟
      en: When was the battle of Badr?
      ur: غزوۂ بدر کب ہوا؟
    options:
    - text:
        ar: في رمضان السنة الثانية للهجرة
        en: in Ramadan of the second Hijri year
        ur: ہجرت کے دوسرے سال رمضان میں
      correct: true
      why:
        ar: تذكر المصادر رمضان ٢هـ ٦٢٤م
        en: the sources date Ramadan 2 AH / 624 CE
        ur: ماخذ رمضان 2 ہجری / 624ء لکھتے ہیں
    - text:
        ar: في السنة الأولى للهجرة
        en: in the first Hijri year
        ur: ہجرت کے پہلے سال میں
      correct: false
      why:
        ar: كانت السنة الأولى سنة التأسيس في المدينة
        en: the first year was the founding year in Medina
        ur: پہلا سال مدینہ میں قیام کا سال تھا
    - text:
        ar: بعد فتح مكة
        en: after the conquest of Mecca
        ur: فتح مکہ کے بعد
      correct: false
      why:
        ar: كان بدر قبل الفتح بست سنوات
        en: Badr was six years before the conquest
        ur: بدر فتح سے چھ سال پہلے تھا
    - text:
        ar: في القرن السابع عشر
        en: in the seventeenth century
        ur: سترہویں صدی میں
      correct: false
      why:
        ar: بدر في القرن السابع الميلادي
        en: Badr is seventh-century, not seventeenth
        ur: بدر ساتویں صدی میں ہے، سترہویں نہیں
  - q:
      ar: أين وقعت معركة بدر؟
      en: Where did Badr happen?
      ur: بدر کہاں ہوا؟
    options:
    - text:
        ar: عند آبار بدر بين مكة والمدينة
        en: at the wells of Badr between Mecca and Medina
        ur: مکہ اور مدینہ کے درمیان بدر کے کنوئوں پر
      correct: true
      why:
        ar: سجلت المصادر موقع الآبار على طريق القوافل
        en: sources name the wells on the caravan road
        ur: ماخذ قافلہ راہ پر کنوئوں کا ذکر کرتے ہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم تصل الأحداث إلى الشام في ذلك الزمن
        en: the events had not reached Syria then
        ur: واقعات اس زمانے میں شام تک نہیں پہنچے تھے
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: بقيت مصر خارج الصراع الأول
        en: Egypt was outside this first conflict
        ur: مصر اس ابتدائی تنازعے سے باہر تھا
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: لم تكن بغداد قائمة بعد
        en: Baghdad did not yet exist
        ur: اس وقت بغداد موجود ہی نہیں تھا
  - q:
      ar: كم كان عدد المسلمين تقريبًا؟
      en: About how many Muslims fought?
      ur: مسلمانوں کی تعداد تقریباً کتنی تھی؟
    options:
    - text:
        ar: نحو ثلاثمائة
        en: about three hundred
        ur: تقریباً تین سو
      correct: true
      why:
        ar: تعطي المصادر عددًا قريبًا من ٣١٣
        en: the sources give a number near 313
        ur: ماخذ 313 کے قریب تعداد دیتے ہیں
    - text:
        ar: عشرة آلاف
        en: ten thousand
        ur: دس ہزار
      correct: false
      why:
        ar: هذا عدد جيش الفتح بعد ست سنوات
        en: that is nearer the conquest army six years later
        ur: یہ چھ سال بعد فتح کے لشکر کے قریب ہے
    - text:
        ar: خمسون
        en: fifty
        ur: پچاس
      correct: false
      why:
        ar: خمسون أقلّ مما سجلته المصادر
        en: fifty is far below the recorded count
        ur: پچاس درج تعداد سے کہیں کم ہے
    - text:
        ar: مليون
        en: a million
        ur: دس لاکھ
      correct: false
      why:
        ar: لا تصل الأعداد إلى هذا في كتب السيرة
        en: the sira books give nothing near this
        ur: سیرت کی کتابیں اس کے قریب کچھ نہیں لکھتیں
  - q:
      ar: لماذا خرج المسلمون إلى بدر؟
      en: Why did the Muslims go out to Badr?
      ur: مسلمان بدر کی طرف کیوں نکلے؟
    options:
    - text:
        ar: لاعتراض قافلة تجارة قريش
        en: to intercept the Quraysh trade caravan
        ur: قریش کے تجارتی قافلے کو روکنے کے لیے
      correct: true
      why:
        ar: كانت القافلة هدف الخروج الأول ثم جاء الجيش
        en: the caravan was the first target, then the army came
        ur: قافلہ پہلا ہدف تھا، پھر لشکر آیا
    - text:
        ar: لغزو روما
        en: to invade Rome
        ur: روم پر حملے کے لیے
      correct: false
      why:
        ar: لم يكن هدف المسلمين روما
        en: Rome was not their aim
        ur: ان کا مقصد روم نہیں تھا
    - text:
        ar: لحجّ إلى مكة
        en: to pilgrimage to Mecca
        ur: مکہ کی حج کے لیے
      correct: false
      why:
        ar: كان الخروج عسكريًا لا حجًّا
        en: the march was military, not a pilgrimage
        ur: یہ عسکری نکلنا تھا، حج نہیں
    - text:
        ar: لزيارة القبور
        en: to visit graves
        ur: قبروں کی زیارت کے لیے
      correct: false
      why:
        ar: لم تكن الزيارة سبب الخروج
        en: a visit was not the reason
        ur: زیارت وجہ نہیں تھی
  - q:
      ar: ماذا نتج عن بدر؟
      en: What came of Badr?
      ur: بدر کا کیا نتیجہ نکلا؟
    options:
    - text:
        ar: انتصار المسلمين وأسر سبعين من قريش
        en: Muslim victory and seventy Quraysh captured
        ur: مسلمانوں کی فتح اور قریش کے ستر افراد کا اسر ہونا
      correct: true
      why:
        ar: تسجل المصادر النتيجة وأسماء القتلى والأسرى
        en: sources record the result and the names of dead and captives
        ur: ماخذ نتیجہ اور مرنے والوں و اسیروں کے نام لکھتے ہیں
    - text:
        ar: هزيمة المسلمين الكاملة
        en: a complete Muslim defeat
        ur: مسلمانوں کی مکمل شکست
      correct: false
      why:
        ar: الهزيمة في الكتب تخصّ أُحد لا بدر
        en: the defeat in the books belongs to Uhud, not Badr
        ur: کتابوں میں شکست احد سے متعلق ہے، بدر سے نہیں
    - text:
        ar: نهاية الدولة الإسلامية
        en: the end of the Islamic state
        ur: اسلامی ریاست کا خاتمہ
      correct: false
      why:
        ar: بدأت الدولة أقوى بعد بدر لا انتهت
        en: the state began stronger after Badr, not ended
        ur: بدر کے بعد ریاست مضبوط ہوئی، ختم نہیں ہوئی
    - text:
        ar: اتفاق سلام دائم
        en: a lasting peace
        ur: مستقل صلح
      correct: false
      why:
        ar: استمر الصراع إلى فتح مكة
        en: the struggle ran on to the conquest of Mecca
        ur: جنگ فتح مکہ تک جاری رہی
  - q:
      ar: لماذا سمّيت بدر يوم الفرقان؟
      en: Why is Badr called the Day of the Criterion?
      ur: بدر کو یومِ فرقان کیوں کہا گیا؟
    options:
    - text:
        ar: لأنه فصل بين دولة المدينة وعدوّها
        en: because it decided between Medina''s state and its foe
        ur: کیونکہ اس نے مدینہ کی ریاست اور اس کے حریف کے درمیان فیصلہ کیا
      correct: true
      why:
        ar: اعتبرته الذاكرة يوم تمايزت فيه الدولة الجديدة
        en: memory treated it as the day the new state proved itself
        ur: یادداشت نے اسے وہ دن سمجھا جس میں نئی ریاست ثابت ہوئی
    - text:
        ar: لأنه كان أطول يوم في السنة
        en: because it was the longest day of the year
        ur: کیونکہ یہ سال کا سب سے طویل دن تھا
      correct: false
      why:
        ar: التسمية للمعنى لا للفلك
        en: the name is for meaning, not astronomy
        ur: نام معنی کے لیے ہے، فلکیات کے لیے نہیں
    - text:
        ar: لأنه كان في رمضان
        en: because it fell in Ramadan
        ur: کیونکہ یہ رمضان میں ہوا
      correct: false
      why:
        ar: رمضان وصف الوقت لا سبب الاسم
        en: Ramadan describes the timing, not the name''s reason
        ur: رمضان وقت کی صفت ہے، نام کی وجہ نہیں
    - text:
        ar: لأنه كان أول نزول القرآن
        en: because it was the first Quranic descent
        ur: کیونکہ یہ قرآن کی پہلی نزول تھی
      correct: false
      why:
        ar: بدأ الوحي قبل بدر بأكثر من عقد
        en: revelation began over a decade before Badr
        ur: وحی بدر سے دہائیوں پہلے شروع ہوئی
  - q:
      ar: من كتب عن بدر؟
      en: Who wrote about Badr?
      ur: بدر کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب السيرة والتواريخ المبكرة
        en: the sira and early history books
        ur: سیرت اور ابتدائی تواریخ کی کتابیں
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والطبري وغيرهما
        en: accounts reach us from Ibn Ishaq, al-Tabari and others
        ur: ابن اسحاق، طبری اور دیگر کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: مؤرخون أوروبيون فقط
        en: only European historians
        ur: صرف یورپی مؤرخین
      correct: false
      why:
        ar: كتب المسلمون عن بدر قبل قرون
        en: Muslims wrote about Badr centuries earlier
        ur: مسلمانوں نے بدر کے بارے میں صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: بدر من أكثر الأيام تدوينًا في السيرة
        en: Badr is among the most documented days in the sira
        ur: بدر سیرت کے سب سے مکتوب ایام میں سے ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: جاءت الحروب الصليبية بعد خمسة قرون
        en: the Crusades came five centuries later
        ur: صلیبی جنگیں پانچ صدیوں بعد آئیں
  - q:
      ar: ماذا سمّى المسلمون يوم بدر؟
      en: What did Muslims call the day of Badr?
      ur: مسلمانوں نے بدر کے دن کو کیا نام دیا؟
    options:
    - text:
        ar: يوم الفرقان
        en: the Day of the Criterion
        ur: یومِ فرقان
      correct: true
      why:
        ar: هذا الاسم في النصوص والذاكرة
        en: this is the name in the texts and memory
        ur: یہ نام نصوص اور یادداشت میں ہے
    - text:
        ar: يوم الأحد
        en: Sunday
        ur: اتوار کا دن
      correct: false
      why:
        ar: الاسم للمعركة لا لليوم الأسبوعي
        en: the name is for the battle, not the weekday
        ur: نام جنگ کے لیے ہے، ہفتے کے دن کے لیے نہیں
    - text:
        ar: عيد النصر
        en: Victory Feast
        ur: فتح کی عید
      correct: false
      why:
        ar: لم يكن بدر عيدًا موسميًّا
        en: Badr was not a seasonal feast
        ur: بدر کوئی موسمی عید نہیں تھی
    - text:
        ar: يوم الحساب
        en: the Day of Reckoning
        ur: حساب کا دن
      correct: false
      why:
        ar: يوم الحساب في النصوص ليوم آخر
        en: the Day of Reckoning names a different day in the texts
        ur: حساب کا دن نصوص میں دوسرے دن کا نام ہے
  - q:
      ar: من انتصر في بدر؟
      en: Who won at Badr?
      ur: بدر میں کون جیتا؟
    options:
    - text:
        ar: المسلمون
        en: the Muslims
        ur: مسلمان
      correct: true
      why:
        ar: انتهى اليوم بانتصار المدنيين وأسر قريش
        en: the day ended in Medina''s victory and Quraysh captives
        ur: دن مدینہ والوں کی فتح اور قریش کے اسیروں پر ختم ہوا
    - text:
        ar: قريش
        en: the Quraysh
        ur: قریش
      correct: false
      why:
        ar: خسرت قريش القتال وكبار رجالها
        en: the Quraysh lost the fight and their leading men
        ur: قریش جنگ اور اپنے بڑے آدمی ہارے
    - text:
        ar: تعادل الفريقان
        en: it was a draw
        ur: برابر رہی
      correct: false
      why:
        ar: فُضّ النزاع في المصادر بانتصار صريح
        en: the sources decide it a clear victory
        ur: ماخذ اسے واضح فتح لکھتے ہیں
    - text:
        ar: لم يقع قتال
        en: no battle happened
        ur: کوئی جنگ نہیں ہوئی
      correct: false
      why:
        ar: وثّقت الكتب القتال وأسماء من مات
        en: the books document the fighting and the dead
        ur: کتابیں لڑائی اور مرنے والوں کو ثبت کرتی ہیں
  - q:
      ar: ماذا جاء بعد بدر في الأحداث؟
      en: What followed Badr in the events?
      ur: واقعات میں بدر کے بعد کیا آیا؟
    options:
    - text:
        ar: أُحد ثم خيبر ثم فتح مكة
        en: Uhud, then Khaybar, then the conquest of Mecca
        ur: احد، پھر خیبر، پھر فتح مکہ
      correct: true
      why:
        ar: السلسلة في المصادر تجري بهذا الترتيب
        en: the sources run the chain in this order
        ur: ماخذ سلسلہ اسی ترتیب میں لکھتے ہیں
    - text:
        ar: الحروب الصليبية مباشرة
        en: the Crusades right away
        ur: فوراً صلیبی جنگیں
      correct: false
      why:
        ar: جاءت الحروب الصليبية في ١٠٩٥ بعد قرون
        en: the Crusades came in 1095, centuries later
        ur: صلیبی جنگیں 1095 میں آئیں، صدیوں بعد
    - text:
        ar: سقوط بغداد
        en: the fall of Baghdad
        ur: بغداد کا سقوط
      correct: false
      why:
        ar: سقطت بغداد في ١٢٥٨ بعد قرون
        en: Baghdad fell in 1258, centuries later
        ur: بغداد 1258 میں گرا، صدیوں بعد
    - text:
        ar: بناء المسجد الأقصى
        en: the building of al-Aqsa
        ur: مسجدِ اقصیٰ کی تعمیر
      correct: false
      why:
        ar: بُني الأقصى قبل بدر بزمن
        en: al-Aqsa was built before Badr
        ur: اقصیٰ بدر سے پہلے تعمیر ہوئی
- id: first-revelation
  anchor: event/first-revelation
  band: scholars
  title:
    ar: أول الوحي
    en: the first revelation
    ur: پہلی وحی
  sixty:
    ar: 'في نحو سنة ٦١٠م كان محمد يتعبّد في غار حراء فوق مكة، حين نزل عليه الوحي بكلمة «اقرأ». بدأت الدعوة سرًّا بين أهل البيت وبعض الصدقاء، ثم علت بعد سنوات إلى إعلان. استمر الوحي يتنزّل على النبي ثلاثًا وعشرين سنة في مكة والمدينة، يحفظه الناس ويكتبونه، حتى اكتمل القرآن. كان جبل النور يُسمى قبل ذلك مكانًا للتأمل، وصار بعده عنوان البداية الكبرى. من تلك الليلة خرجت أمّة: دعوة خفية سنواتها الأولى، ثم جماعة تتسع في مكة، فمدينة تبنى، فعالم يتغيّر. ويظل «اقرأ» أول كلمة للأمة تحمل القراءة والعلم دينًا. وهكذا بدأ كل شيء: غار صغير فوق الجبل، وكلمة واحدة، فحملتها أمّة في صدورها وكتبها ألفًا وأربعمائة عام. ولم تكن تلك الليلة نهاية الطريق بل فاتحته، فكل ما جاء بعد — الهجرة والفتح والدولة والحضارة — امتداد لتلك الكلمة الواحدة. فمن «اقرأ» تعلّمت الأجيال أن دينها دين قراءة وعلم، وأن أول خطوة في الطريق سماعٌ وقلبٌ حاضر.'
    en: 'Around 610 CE Muhammad was worshipping in the cave of Hira above Mecca when revelation came down with the word ''Read''. The call began secretly among his household and a few close friends, rising after years into open declaration. Revelation kept descending on the Prophet for twenty-three years, in Mecca and in Medina, memorized and written down, until the Qur''an was complete. The Mount of Light had been a place of retreat before that; afterwards it became the name of the greatest beginning. From that night came an ummah: a hidden call for its first years, then a widening community in Mecca, then a city built, then a world changed. ''Read'' remains the ummah''s first word, making reading and knowledge a religion. So everything began: a small cave on the mountain, a single word — and an ummah carried it in its chest and books for fourteen hundred years.'
    ur: 'تقریباً 610ء میں محمد مکہ کے اوپر غارِ حرا میں عبادت میں تھے جب وحی «پڑھو» کے لفظ سے نازل ہوئی۔ دعوت پہلے خفیہ رہی — گھر والوں اور چند قریبی ساتھیوں میں — پھر برسوں بعد کھلم کھلا ہوئی۔ وحی تئیس برس نبی پر مکہ اور مدینہ میں نازل ہوتی رہی، لوگ حفظ اور لکھتے رہے یہاں تک کہ قرآن مکمل ہوا۔ کوہِ نور پہلے خلوت کی جگہ تھا؛ بعد میں وہ عظیم آغاز کا نام بنا۔ اسی رات سے امت نکلی: ابتدائی برسوں کی پوشیدہ دعوت، پھر مکہ میں پھیلتی برادری، پھر بسایا گیا شہر، پھر بدلی ہوئی دنیا۔ «پڑھو» امت کا پہلا لفظ رہا جس نے پڑھنا اور علم دین بنا دیا۔ اسی طرح سب کچھ شروع ہوا: پہاڑ پر ایک چھوٹی سی غار، ایک ہی لفظ — اور امت نے اسے چودہ سو برس سینوں اور کتابوں میں اٹھایا۔'
  glossary:
  - term:
      ar: حراء
      en: Hira
      ur: حرا
    gloss:
      ar: 'الغار فوق مكة الذي كان يتعبّد فيه النبي قبل الوحي'
      en: 'the cave above Mecca where the Prophet used to worship before revelation'
      ur: 'مکہ کے اوپر غار جہاں نبی وحی سے پہلے عبادت کرتے تھے'
  - term:
      ar: الوحي
      en: the revelation
      ur: وحی
    gloss:
      ar: 'كلام الله النازل على النبي عبر الملك في تلك الليلة'
      en: 'God''s speech sent down on the Prophet through the angel that night'
      ur: 'خدا کا کلام جو اس رات فرشتے کے ذریعے نبی پر نازل ہوا'
  - term:
      ar: اقرأ
      en: Read
      ur: پڑھو
    gloss:
      ar: 'أول كلمة نزلت من القرآن، فصارت عنوان العلم في الأمة'
      en: 'the Qur''an''s first revealed word, becoming the ummah''s banner of knowledge'
      ur: 'قرآن کا پہلا نازل شدہ لفظ جو امت کے علم کا نشان بنا'
  - term:
      ar: الدعوة الخفية
      en: the quiet preaching
      ur: خاموش دعوت
    gloss:
      ar: 'السنوات الأولى من الدعوة حين اقتصرت على أهل البيت والصدقاء'
      en: 'the call''s first years when it stayed within household and close friends'
      ur: 'دعوت کے ابتدائی برس جب وہ گھر اور قریبی دوستوں تک رہی'
  - term:
      ar: النبوة
      en: the prophethood
      ur: نبوت
    gloss:
      ar: 'منصب رسالة الله الذي حمله النبي ثلاثًا وعشرين سنة'
      en: 'the office of God''s message the Prophet carried for twenty-three years'
      ur: 'خدا کے پیغام کا منصب جو نبی نے تئیس برس اٹھایا'
  - term:
      ar: جبل النور
      en: the Mount of Light
      ur: کوہِ نور
    gloss:
      ar: 'الاسم اللاحق للجبل الذي فيه الغار، تيمّنًا بنور الوحي'
      en: 'the hill''s later name holding the cave, blessed by revelation''s light'
      ur: 'پہاڑ کا بعد کا نام جس میں غار ہے — وحی کے نور کی برکت سے'
  - term:
      ar: الملك
      en: the angel
      ur: فرشتہ
    gloss:
      ar: 'الملك الذي حمل الوحي إلى النبي في الغار، جبريل'
      en: 'the angel who bore revelation to the Prophet in the cave — Jibril'
      ur: 'وہ فرشتہ جو غار میں نبی پر وحی لایا — جبریل'
  - term:
      ar: ٦١٠م
      en: 610 CE
      ur: 610ء
    gloss:
      ar: 'السنة التقريبية لبدء الوحي في الروايات المتواترة'
      en: 'the rough year the sources give for revelation''s beginning'
      ur: 'وہ تقریبی سال جو روایات وحی کے آغاز کے لیے دیتی ہیں'
  - term:
      ar: الثلاث وعشرون
      en: the twenty-three years
      ur: تئیس سال
    gloss:
      ar: 'مدة تنزّل القرآن على النبي بين مكة والمدينة'
      en: 'the span the Qur''an descended on the Prophet between Mecca and Medina'
      ur: 'قرآن کے نبی پر نزول کی مدت مکہ اور مدینہ کے درمیان'
  - term:
      ar: مكة
      en: Mecca
      ur: مکہ
    gloss:
      ar: 'المدينة التي بدأت منها الدعوة قبل انتقالها إلى العالم'
      en: 'the city the call began in before it travelled out to the world'
      ur: 'وہ شہر جس میں دعوت شروع ہوئی قبل اس کے کہ دنیا میں پھیلے'
  - term:
      ar: الدعوة
      en: the calling
      ur: دعوت
    gloss:
      ar: 'الاسم العام لعمل تبليغ الإسلام، من الخفاء إلى العلن'
      en: 'the general name for the work of carrying Islam, from hiding to openness'
      ur: 'اسلام پہنچانے کے کام کا عمومی نام — چھپی سے کھلی تک'
  - term:
      ar: الجماعة
      en: the community
      ur: جماعت
    gloss:
      ar: 'الجماعة التي جمعها الإيمان تدريجًا حول نبيه حتى صارت أمة'
      en: 'the gathering faith slowly bound around its prophet until it became an ummah'
      ur: 'وہ برادری جو آہستہ آہستہ اپنے نبی کے گرد جمی یہاں تک امت بنی'
  practice:
  - q:
      ar: أين جاء الوحي أول مرة؟
      en: Where did revelation first come?
      ur: وحی پہلی بار کہاں آئی؟
    options:
    - text:
        ar: في غار حراء قرب مكة
        en: in the cave of Hira near Mecca
        ur: مکہ کے قریب غارِ حرا میں
      correct: true
      why:
        ar: تذكر المصادر الغار على الجبل
        en: the sources name the cave on the mountain
        ur: ماخذ پہاڑ پر غار کا ذکر کرتے ہیں
    - text:
        ar: في المدينة
        en: in Medina
        ur: مدینہ میں
      correct: false
      why:
        ar: كان الوحي في مكة قبل الهجرة
        en: revelation was in Mecca before the Hijra
        ur: وحی ہجرت سے پہلے مکہ میں آئی
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: القدس قبلة لاحقة لا مكان الوحي
        en: Jerusalem was a later qibla, not the revelation''s place
        ur: بیت المقدس بعد کا قبلہ تھا، وحی کی جگہ نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم تدخل الأحداث دمشق في ذلك الزمن
        en: the events did not reach Damascus then
        ur: واقعات اس زمانے میں دمشق تک نہیں پہنچے
  - q:
      ar: متى بدأ الوحي تقريبًا؟
      en: When did revelation begin, roughly?
      ur: وحی تقریباً کب شروع ہوئی؟
    options:
    - text:
        ar: نحو ٦١٠م
        en: around 610 CE
        ur: تقریباً 610ء میں
      correct: true
      why:
        ar: تحسب المصادر البدء قبل الهجرة باثني عشر عامًا
        en: the sources count twelve years before the Hijra
        ur: ماخذ ہجرت سے بارہ سال پہلے گنتے ہیں
    - text:
        ar: نحو ٥٧٠م
        en: around 570 CE
        ur: تقریباً 570ء میں
      correct: false
      why:
        ar: ذلك تقريب ميلاد النبي لا بدء الوحي
        en: that is nearer the Prophet''s birth, not the revelation
        ur: یہ نبی کی پیدائش کے قریب ہے، وحی کے آغاز کے نہیں
    - text:
        ar: نحو ٦٢٢م
        en: around 622 CE
        ur: تقریباً 622ء میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا بدء الوحي
        en: that is the Hijra year, not the start of revelation
        ur: یہ ہجرت کا سال ہے، وحی کا آغاز نہیں
    - text:
        ar: نحو ٦٣٢م
        en: around 632 CE
        ur: تقریباً 632ء میں
      correct: false
      why:
        ar: ذلك عام وفاة النبي
        en: that is the year of the Prophet''s death
        ur: یہ نبی کی وفات کا سال ہے
  - q:
      ar: ما أول كلمة نزلت؟
      en: What was the first word sent down?
      ur: پہلا اترا ہوا لفظ کیا تھا؟
    options:
    - text:
        ar: اقرأ
        en: Read
        ur: پڑھو
      correct: true
      why:
        ar: تذكر المصادر بدء الأمر بكلمة اقرأ
        en: the sources record the opening word as Read
        ur: ماخذ پہلے لفظ کو پڑھو لکھتے ہیں
    - text:
        ar: اكتب
        en: Write
        ur: لکھو
      correct: false
      why:
        ar: لم تكن الكتابة الكلمة الأولى
        en: writing was not the first word
        ur: لکھنا پہلا لفظ نہیں تھا
    - text:
        ar: اسمع
        en: Listen
        ur: سنو
      correct: false
      why:
        ar: اقرأ الكلمة المسجلة في النصوص
        en: Read is the recorded word in the texts
        ur: پڑھو نصوص میں درج لفظ ہے
    - text:
        ar: تعلّم
        en: Learn
        ur: سیکھو
      correct: false
      why:
        ar: الكلمة الأولى اقرأ لا تعلّم
        en: the first word is Read, not Learn
        ur: پہلا لفظ پڑھو ہے، سیکھو نہیں
  - q:
      ar: كم دام الوحي؟
      en: How long did revelation last?
      ur: وحی کتنی دیر رہی؟
    options:
    - text:
        ar: ثلاثًا وعشرين سنة
        en: twenty-three years
        ur: تئیس سال
      correct: true
      why:
        ar: من البداية إلى وفاة النبي نحو ٢٣ عامًا
        en: from the start to the Prophet''s death, about 23 years
        ur: آغاز سے نبی کی وفات تک تقریباً 23 سال
    - text:
        ar: سنتان
        en: two years
        ur: دو سال
      correct: false
      why:
        ar: سنتان مدة جزء من المكية لا الكل
        en: two years is a portion of the Meccan period
        ur: دو سال مکی دور کا ایک حصہ ہے
    - text:
        ar: مائة عام
        en: a hundred years
        ur: سو سال
      correct: false
      why:
        ar: لم يعش النبي هذا العمر
        en: the Prophet did not live that long
        ur: نبی اتنی عمر نہیں پائے
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أقلّ من مدة المكية وحدها
        en: ten is less than the Meccan span alone
        ur: دس صرف مکی عرصے سے کم ہے
  - q:
      ar: ماذا ميّز السنوات الأولى؟
      en: What marked the early years?
      ur: ابتدائی برسوں کی کیا خصوصیت تھی؟
    options:
    - text:
        ar: الدعوة الخفية في مكة
        en: the quiet preaching in Mecca
        ur: مکہ میں خاموش دعوت
      correct: true
      why:
        ar: كانت الدعوة في السرّ قبل الإذن بالظهور
        en: the calling was quiet before permission to appear
        ur: اظہار کی اجازت سے پہلے دعوت خاموش تھی
    - text:
        ar: حروب كبرى
        en: great wars
        ur: بڑی جنگیں
      correct: false
      why:
        ar: كانت السنوات الأولى دعوة لا قتال
        en: the early years were preaching, not war
        ur: ابتدائی برس دعوت کے تھے، جنگ کے نہیں
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: false
      why:
        ar: الفتح جاء في آخر السلسلة لا أولها
        en: the conquest came at the chain''s end
        ur: فتح زنجیر کے آخر میں آیا
    - text:
        ar: الحج إلى بيت المقدس
        en: pilgrimage to Jerusalem
        ur: بیت المقدس کی حج
      correct: false
      why:
        ar: لم يكن الحج إلى القدس في تلك السنوات
        en: there was no Jerusalem pilgrimage in those years
        ur: ان برسوں میں بیت المقدس کی حج نہیں تھی
  - q:
      ar: من جاء بالوحي؟
      en: Who brought the revelation?
      ur: وحی کون لایا؟
    options:
    - text:
        ar: المَلَك
        en: the angel
        ur: فرشتہ
      correct: true
      why:
        ar: تذكر المصادر المَلَك حامل الأمر
        en: the sources name the angel as the bearer
        ur: ماخذ فرشتے کو لانے والا لکھتے ہیں
    - text:
        ar: إنسان من قريش
        en: a man of Quraysh
        ur: قریش کا ایک آدمی
      correct: false
      why:
        ar: لم يكن الوسيط إنسانًا
        en: the bearer was not a human
        ur: لانے والا انسان نہیں تھا
    - text:
        ar: النبي نفسه
        en: the Prophet himself
        ur: خود نبی
      correct: false
      why:
        ar: النبي مستلم الوحي لا حامله
        en: the Prophet received it, he did not carry it
        ur: نبی وصول کنندہ تھے، لانے والا نہیں
    - text:
        ar: قوم الأنصار
        en: the Ansar
        ur: انصار
      correct: false
      why:
        ar: الأنصار دعوا النبي بعد الوحي بأعوام
        en: the Ansar invited the Prophet years later
        ur: انصار نے برسوں بعد نبی کو بلایا
  - q:
      ar: ماذا غيّر الوحي؟
      en: What did revelation change?
      ur: وحی نے کیا بدلا؟
    options:
    - text:
        ar: بلاد العرب وما جاورها على مدى ٢٣ عامًا
        en: Arabia and its neighbors over 23 years
        ur: 23 سال میں جزیرۃ العرب اور اس کے پڑوسی
      correct: true
      why:
        ar: أعادت السلسلة تشكيل المنطقة وتاريخها
        en: the chain reshaped the region and its history
        ur: زنجیر نے خطے اور اس کی تاریخ کو بدل دیا
    - text:
        ar: لا شيء؛ بقي كل شيء كما كان
        en: nothing; all stayed the same
        ur: کچھ نہیں؛ سب وہی رہا
      correct: false
      why:
        ar: بدأت منه الدولة والقرآن والتقويم
        en: the state, the Quran and the calendar began from it
        ur: اس سے ریاست، قرآن اور تقویم شروع ہوئے
    - text:
        ar: أوروبا فقط
        en: Europe only
        ur: صرف یورپ
      correct: false
      why:
        ar: كان التأثير في الجزيرة أولًا ثم العالم
        en: the effect was Arabia first, then the world
        ur: اثر پہلے جزیرے میں تھا، پھر دنیا میں
    - text:
        ar: أسبوع واحد من الأحداث
        en: one week of events
        ur: ایک ہفتے کے واقعات
      correct: false
      why:
        ar: دام الوحي عقدين لا أسبوعًا
        en: revelation lasted two decades, not a week
        ur: وحی دو دہائیوں تک رہی، ایک ہفتے نہیں
  - q:
      ar: أين كان المكان؟
      en: Where was the place?
      ur: وہ جگہ کہاں تھی؟
    options:
    - text:
        ar: على جبل قرب مكة
        en: on a mountain near Mecca
        ur: مکہ کے قریب ایک پہاڑ پر
      correct: true
      why:
        ar: الغار على جبل النور قرب المدينة
        en: the cave is on the Mount of Light near the city
        ur: غار شہر کے قریب کوہِ نور پر ہے
    - text:
        ar: في وادي النيل
        en: in the Nile valley
        ur: وادیِ نیل میں
      correct: false
      why:
        ar: لم تكن مصر مكان الوحي
        en: Egypt was not the revelation''s place
        ur: مصر وحی کی جگہ نہیں تھی
    - text:
        ar: في البادية الشمالية
        en: in the northern desert
        ur: شمالی صحرا میں
      correct: false
      why:
        ar: الغار قرب مكة لا في الشمال البعيد
        en: the cave is near Mecca, not the far north
        ur: غار مکہ کے قریب ہے، دور شمال میں نہیں
    - text:
        ar: تحت الأرض في بيت
        en: underground in a house
        ur: کسی گھر میں زیرِ زمین
      correct: false
      why:
        ar: كان المكان غارًا على جبل لا بيتًا
        en: the place was a cave on a mountain, not a house
        ur: وہ جگہ پہاڑ پر غار تھی، گھر نہیں
  - q:
      ar: لماذا كان الأمر بالقراءة؟
      en: Why was the command to read?
      ur: حکم پڑھنے کا کیوں تھا؟
    options:
    - text:
        ar: لأنّ الرسالة كتاب يُقرأ ويُتلى
        en: because the message is a book to be read and recited
        ur: کیونکہ پیغام ایک کتاب ہے جو پڑھی اور تلاوت کی جائے
      correct: true
      why:
        ar: تذكر المصادر أنّ البدء كان بكلمة القراءة
        en: the sources record the start was the word of reading
        ur: ماخذ لکھتے ہیں آغاز پڑھنے کے لفظ سے تھا
    - text:
        ar: لأنّ النبي لم يكن يعرف الكتابة
        en: because the Prophet could not write
        ur: کیونکہ نبی لکھنا نہیں جانتے تھے
      correct: false
      why:
        ar: الكلمة للرسالة لا لحالة النبي
        en: the word was for the message, not the Prophet''s state
        ur: لفظ پیغام کے لیے تھا، نبی کی حالت کے لیے نہیں
    - text:
        ar: لأنّ العرب لم يكن عندهم كتب
        en: because the Arabs had no books
        ur: کیونکہ عربوں کے پاس کتابیں نہیں تھیں
      correct: false
      why:
        ar: الأمر للرسالة الجديدة لا لوصف العرب
        en: the command was for the new message, not describing Arabs
        ur: حکم نئے پیغام کے لیے تھا، عربوں کی صفت کے لیے نہیں
    - text:
        ar: لا سبب
        en: no reason
        ur: کوئی وجہ نہیں
      correct: false
      why:
        ar: تحمل الكلمة معنى الرسالة الأولى
        en: the word carries the first message''s meaning
        ur: لفظ پہلے پیغام کا معنی رکھتا ہے
  - q:
      ar: ماذا سمّى المسلمون الفترة الأولى؟
      en: What did Muslims call the first period?
      ur: مسلمانوں نے پہلے دور کو کیا نام دیا؟
    options:
    - text:
        ar: الدعوة الخفية
        en: the quiet preaching
        ur: خاموش دعوت
      correct: true
      why:
        ar: هذا الاسم للسنوات الأولى من التبليغ
        en: this name marks the first years of spreading
        ur: یہ نام تبلیغ کے ابتدائی برسوں کا ہے
    - text:
        ar: عهد المدينة
        en: the Medina era
        ur: مدینہ کا دور
      correct: false
      why:
        ar: عهد المدينة بعد الهجرة
        en: the Medina era came after the Hijra
        ur: مدینہ کا دور ہجرت کے بعد آیا
    - text:
        ar: الفتوحات
        en: the conquests
        ur: فتوحات
      correct: false
      why:
        ar: الفتوحات في العصر اللاحق لا الأول
        en: the conquests belong to the later era, not the first
        ur: فتوحات بعد کے دور کی ہیں، پہلے کی نہیں
    - text:
        ar: الخلافة
        en: the caliphate
        ur: خلافت
      correct: false
      why:
        ar: الخلافة بعد وفاة النبي
        en: the caliphate came after the Prophet''s death
        ur: خلافت نبی کی وفات کے بعد آئی
- id: conquest-mecca
  anchor: event/conquest-of-mecca
  band: scholars
  title:
    ar: فتح مكة
    en: the conquest of Mecca
    ur: فتح مکہ
  sixty:
    ar: 'في رمضان من السنة الثامنة للهجرة (٦٣٠م) دخل النبي مكة بجيش عشرة آلاف بلا قتال تقريبًا. ثمانية سنين بعد خروجه مهاجرًا عاد فاتحًا، فمنّ على أهلها أمانًا عامًا «اذهبوا فأنتم الطلقاء». طوّف بالكعبة وهدم أصنامها وردّ البيت لتوحيده الأول، ودخل الناس في دين الله أفواجًا في تلك السنين التالية. لم يكن الفتح انتقامًا بل مصالحة كبرى: أعاد الولاء لبيت الله، وسكت أصوات الحرب، وجعل القبلة قلب أمة تتوسع. وبهذا تكتمل القصة: من الهجرة قوةً ضعيفة إلى الفتح عودةً منصورة، ومن يثرب مدينة إلى مكة أمّ القرى. وصار الفتح سنة للفاتحين: العفو عند المقدرة أعظم من النصر، وقلب الكعبة الذي رُدّ للتوحيد ما زال يجمع الملايين. وفي يوم الفتح طُويت عشرون سنة من الصراع بين مكة والمدينة، وبدأت مرحلةٌ انتقلت فيها الدعوة من مدينة واحدة إلى شبه جزيرة كاملة. ولم يدخل الفاتحون مكة ملوكًا بل دخلوها ساجدين شاكرين، فكان المشهد درسًا في كيف يعامل النصرُ المنتصرين قبل المنهزمين.'
    en: 'In Ramadan of the eighth Hijri year (630 CE), the Prophet entered Mecca with ten thousand and almost no fighting. Eight years after leaving as an emigrant, he returned a conqueror — granting its people general safety: ''Go, you are free.'' He circled the Kaaba, brought down its idols and restored the House to its first oneness, and in the following years people entered God''s religion in throngs. The conquest was not revenge but a grand reconciliation: it restored the House''s allegiance, silenced the war and made the qibla the heart of a widening ummah. So the story completes itself: from a weak migration to a victorious return, from Yathrib a city to Mecca mother of towns. The conquest became a model for conquerors: pardon at power is greater than victory, and the Kaaba''s heart restored to oneness still gathers millions.'
    ur: 'ہجرت کے آٹھویں سال رمضان میں (630ء) نبی دس ہزار کی فوج کے ساتھ مکہ میں تقریباً بغیر جنگ داخل ہوئے۔ مہاجر بن کر نکلے تھے، فاتح بن کر لوٹے — اور اہلِ شہر کو عام امان دیا: «جاؤ تم آزاد ہو۔» انہوں نے کعبہ کا طواف کیا، بت گرا دیے اور گھر کو اس کی پہلی توحید پر لوٹایا، اور اگلے برسوں میں لوگ جوق در جوق دین میں داخل ہوئے۔ یہ فتح انتقام نہیں بلکہ بڑی صلح تھی: گھر کی وفاداری بحال ہوئی، جنگ خاموش ہوئی اور قبلہ بڑھتی امت کا دل بنا۔ اس طرح کہانی پوری ہوتی ہے: کمزور ہجرت سے فاتحانہ واپسی، یثرب کے شہر سے مکہ ام القری تک۔ فتح فاتحین کے لیے نمونہ بنا: طاقت پر معافی فتح سے بڑی ہے، اور توحید پر لوٹا ہوا کعبہ آج بھی لاکھوں کو جمع کرتا ہے۔'
  glossary:
  - term:
      ar: الفتح
      en: the conquest
      ur: فتح
    gloss:
      ar: 'العودة المنتصرة إلى مكة سنة ٦٣٠ بعد ثماني سنوات من الهجرة'
      en: 'the victorious return to Mecca in 630, eight years after the Hijra'
      ur: '630ء میں مکہ کی فاتحانہ واپسی — ہجرت کے آٹھ سال بعد'
  - term:
      ar: الأصنام
      en: the idols
      ur: بت
    gloss:
      ar: 'تماثيل العرب التي كانت تحيط بالكعبة قبل طهارتها'
      en: 'the Arabs'' idols that ringed the Kaaba before its cleansing'
      ur: 'عرب کے بت جو کعبہ کے گرد رکھے تھے پاک کرنے سے پہلے'
  - term:
      ar: الأمان
      en: the safety
      ur: امان
    gloss:
      ar: 'العفو العام الذي أعلنه النبي لأهل مكة يوم دخولها'
      en: 'the general amnesty the Prophet declared for Mecca''s people at its entry'
      ur: 'عام معافی جو نبی نے مکہ کے داخلہ کے دن اہلِ شہر کو دی'
  - term:
      ar: أفواجًا
      en: in throngs
      ur: جوق در جوق
    gloss:
      ar: 'دخول الناس دين الله زمرًا وجماعات في السنين بعد الفتح'
      en: 'people entering God''s religion in groups and throngs in the post-conquest years'
      ur: 'فتح کے بعد کے برسوں میں لوگوں کا گروہ در گروہ دین میں داخل ہونا'
  - term:
      ar: الكعبة
      en: the Kaaba
      ur: کعبہ
    gloss:
      ar: 'بيت الله الذي طهّره النبي من الأصنام يوم دخوله'
      en: 'God''s House the Prophet cleansed of idols the day he entered'
      ur: 'خدا کا گھر جسے نبی نے داخلے کے دن بتوں سے پاک کیا'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'أهل مكة المسلمون الأوائل الذين هاجروا وعادوا مع النبي'
      en: 'the early Meccan Muslims who migrated and came back with the Prophet'
      ur: 'مکہ کے ابتدائی مسلمان جو ہجرت کر کے نبی کے ساتھ واپس آئے'
  - term:
      ar: رمضان ٦٣٠
      en: Ramadan 630
      ur: رمضان 630
    gloss:
      ar: 'الشهر الذي وقع فيه الدخول، وقد كان المسلمون صائمين'
      en: 'the month of the entry — the Muslims were fasting'
      ur: 'داخلے کا وہ مہینہ جب مسلمان روزے سے تھے'
  - term:
      ar: الأبواب الأربعة
      en: the four gates
      ur: چار دروازے
    gloss:
      ar: 'مداخل المدينة التي جاء منها الجيش يوم العودة'
      en: 'the city''s entry points the army came through on its return'
      ur: 'شہر کے وہ دروازے جن سے فوج واپسی کے دن داخل ہوئی'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'القبيلة التي كانت تحكم مكة وتقود المعارضة حتى فتحها'
      en: 'the tribe that had ruled Mecca and led the opposition until its conquest'
      ur: 'وہ قبیلہ جو مکہ پر حکومت اور مخالفت کی قیادت کرتا رہا یہاں تک فتح'
  - term:
      ar: الثماني سنوات
      en: the eight years
      ur: آٹھ سال
    gloss:
      ar: 'الفترة من الهجرة إلى العودة، وهي عمر دولة المدينة'
      en: 'the span from migration to return — the life of Medina''s state'
      ur: 'ہجرت سے واپسی تک کا دورانیہ — مدینہ کی ریاست کی عمر'
  - term:
      ar: ميزان العرب
      en: the balance of Arabia
      ur: عرب کا توازن
    gloss:
      ar: 'التوازن الذي غيّره الفتح في الجزيرة لصالح الدعوة'
      en: 'the balance the conquest tilted in the peninsula toward the call'
      ur: 'وہ توازن جو فتح نے جزیرے میں دعوت کے حق میں بدلا'
  - term:
      ar: الرسالة
      en: the message
      ur: پیغام
    gloss:
      ar: 'الحقيقة المركزية التي أُعيد إليها البيت: عبادة الله وحده'
      en: 'the central truth the House was restored to — worship of God alone'
      ur: 'وہ مرکزی سچائی جس پر گھر لوٹایا گیا — صرف خدا کی عبادت'
  practice:
  - q:
      ar: متى كان فتح مكة؟
      en: When was the conquest of Mecca?
      ur: فتح مکہ کب ہوا؟
    options:
    - text:
        ar: في رمضان عام ٦٣٠م
        en: in Ramadan of 630 CE
        ur: 630ء رمضان میں
      correct: true
      why:
        ar: تذكر المصادر رمضان ٨هـ ٦٣٠م
        en: the sources date Ramadan 8 AH / 630 CE
        ur: ماخذ رمضان 8 ہجری / 630ء لکھتے ہیں
    - text:
        ar: في عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا الفتح
        en: that is the Hijra year, not the conquest
        ur: یہ ہجرت کا سال ہے، فتح کا نہیں
    - text:
        ar: في عام ٦١٧
        en: in 617
        ur: 617 میں
      correct: false
      why:
        ar: قبل الهجرة بسنوات
        en: years before the Hijra
        ur: ہجرت سے برسوں پہلے
    - text:
        ar: في القرن الثامن
        en: in the eighth century
        ur: آٹھویں صدی میں
      correct: false
      why:
        ar: الفتح في القرن السابع الميلادي
        en: the conquest is seventh-century
        ur: فتح ساتویں صدی میں ہے
  - q:
      ar: كم سنة مرّت بين الهجرة والفتح؟
      en: How many years between Hijra and conquest?
      ur: ہجرت اور فتح کے درمیان کتنے سال گذرے؟
    options:
    - text:
        ar: ثماني سنوات
        en: eight years
        ur: آٹھ سال
      correct: true
      why:
        ar: من ٦٢٢ إلى ٦٣٠ ثمانية أعوام
        en: from 622 to 630 is eight years
        ur: 622 سے 630 تک آٹھ سال
    - text:
        ar: سنتان
        en: two years
        ur: دو سال
      correct: false
      why:
        ar: سنتان أقلّ من مدة المكية وحدها
        en: two is less than the Meccan span alone
        ur: دو صرف مکی عرصے سے کم ہے
    - text:
        ar: عشرون عامًا
        en: twenty years
        ur: بیس سال
      correct: false
      why:
        ar: عشرون تتجاوز عمر الدعوة كلها تقريبًا
        en: twenty runs past nearly the whole message
        ur: بیس تقریباً پورے پیغام کے عرصے سے زیادہ ہے
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: لم يعش النبي إلى تلك المدة
        en: the Prophet did not live that span
        ur: نبی اتنے عرصے تک نہیں رہے
  - q:
      ar: كيف دخل المسلمون مكة؟
      en: How did the Muslims enter Mecca?
      ur: مسلمان مکہ میں کیسے داخل ہوئے؟
    options:
    - text:
        ar: من أبوابها الأربعة بلا قتال كبير
        en: through its four gates without a great fight
        ur: اس کے چار دروازوں سے، بڑی جنگ کے بغیر
      correct: true
      why:
        ar: سلّمت المدينة في المصادر بلا مقاومة كبرى
        en: the sources have the city yield without major resistance
        ur: ماخذ میں شہر نے بڑی مزاحمت کے بغیر ہتھیار ڈالے
    - text:
        ar: بعد محاصرة سنتين
        en: after a two-year siege
        ur: دو سالہ محاصرے کے بعد
      correct: false
      why:
        ar: لم تكن المدينة محاصرة سنتين
        en: the city was not besieged for two years
        ur: شہر دو سال محاصرے میں نہیں تھا
    - text:
        ar: بالبحر
        en: by sea
        ur: سمندر سے
      correct: false
      why:
        ar: مكة مدينة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے، ساحلی نہیں
    - text:
        ar: بالحيلة في الليل
        en: by a trick at night
        ur: رات کو چال سے
      correct: false
      why:
        ar: كان الدخول علنيًّا نهارًا بالأبواب
        en: the entry was open by day through the gates
        ur: داخلہ دن کے وقت دروازوں سے علانیہ تھا
  - q:
      ar: ماذا حدث للأصنام حول الكعبة؟
      en: What happened to the idols around the Kaaba?
      ur: کعبہ کے گرد بتوں کا کیا ہوا؟
    options:
    - text:
        ar: هُدّمت
        en: they were brought down
        ur: گرائے گئے
      correct: true
      why:
        ar: تذكر المصادر إزالة الأصنام من حول البيت
        en: the sources record the idols removed from around the House
        ur: ماخذ گھر کے گرد سے بتوں کے ہٹائے جانے کا ذکر کرتے ہیں
    - text:
        ar: بقيت إلى اليوم
        en: they remain today
        ur: آج بھی موجود ہیں
      correct: false
      why:
        ar: أُزيلت يوم الفتح في النصوص
        en: the texts have them removed the day of the conquest
        ur: نصوص میں وہ فتح کے دن ہٹا دیے گئے
    - text:
        ar: بِيعت إلى تجار
        en: they were sold to merchants
        ur: تاجروں کو بیچ دیے گئے
      correct: false
      why:
        ar: لم تُبع الأصنام بل هُدّمت
        en: they were not sold, they were destroyed
        ur: وہ بیچے نہیں گئے، گرائے گئے
    - text:
        ar: نُقلت إلى متحف
        en: they were moved to a museum
        ur: عجائب گھر منتقل کیے گئے
      correct: false
      why:
        ar: لم تكن متاحف في ذلك الزمن
        en: there were no museums then
        ur: اس وقت عجائب گھر نہیں تھے
  - q:
      ar: ما الأمان الذي أُعلن؟
      en: What was the declared safety?
      ur: کون سی امان کا اعلان ہوا؟
    options:
    - text:
        ar: أمان عامّ لأهل مكة
        en: a general safety for Mecca''s people
        ur: مکہ کے لوگوں کے لیے عمومی امان
      correct: true
      why:
        ar: أعلن النبي الأمان لأهل المدينة في المصادر
        en: the sources have safety declared for the city''s people
        ur: ماخذ میں شہر کے لوگوں کے لیے امان کا اعلان ہے
    - text:
        ar: عفو للقادة فقط
        en: pardon for leaders only
        ur: صرف رہنماؤں کے لیے معافی
      correct: false
      why:
        ar: شمل الأمان أهلها لا القادة وحدهم
        en: the safety covered its people, not leaders only
        ur: امان میں لوگ شامل تھے، صرف رہنما نہیں
    - text:
        ar: للمسلمين فقط
        en: for Muslims only
        ur: صرف مسلمانوں کے لیے
      correct: false
      why:
        ar: كان الأمان لأهل مكة المشركين أولاً
        en: the safety was for Mecca''s polytheist people first
        ur: امان پہلے مکہ کے مشرک لوگوں کے لیے تھی
    - text:
        ar: لا أمان أُعلن
        en: no safety was declared
        ur: کوئی امان کا اعلان نہیں ہوا
      correct: false
      why:
        ar: تذكر المصادر إعلان الأمان صراحة
        en: the sources name the safety plainly
        ur: ماخذ امان کو صاف لکھتے ہیں
  - q:
      ar: لماذا كان الفتح إتمامًا للهجرة؟
      en: Why did the conquest complete the Hijra?
      ur: فتح نے ہجرت کو کیوں مکمل کیا؟
    options:
    - text:
        ar: لأنّ المهاجرين عادوا إلى موطنهم أقوى
        en: because the migrants returned home too strong to resist
        ur: کیونکہ مہاجرین اپنے وطن اتنے مضبوط ہو کر لوٹے
      correct: true
      why:
        ar: جمع الفتح العودة إلى الأصل والقوة الجديدة
        en: the conquest joined the return home with new strength
        ur: فتح نے وطن واپسی اور نئی طاقت کو جوڑا
    - text:
        ar: لأنّه كان نزهة
        en: because it was a picnic
        ur: کیونکہ یہ پکنک تھا
      correct: false
      why:
        ar: كان الفتح حدثًا سياسيًّا كبيرًا
        en: the conquest was a major political event
        ur: فتح ایک بڑا سیاسی واقعہ تھا
    - text:
        ar: لأنّه كان نهاية الإسلام
        en: because it was the end of Islam
        ur: کیونکہ یہ اسلام کا خاتمہ تھا
      correct: false
      why:
        ar: الفتح بداية الانتشار لا النهاية
        en: the conquest was the spread''s start, not the end
        ur: فتح پھیلاؤ کا آغاز تھا، خاتمہ نہیں
    - text:
        ar: لأنّ مكة كانت أبعد مدينة
        en: because Mecca was the farthest city
        ur: کیونکہ مکہ سب سے دور شہر تھا
      correct: false
      why:
        ar: العودة ليست للبعد بل للموطن
        en: the return was to home, not the farthest point
        ur: واپسی دور ترین مقام نہیں بلکہ وطن تھی
  - q:
      ar: من كتب عن الفتح؟
      en: Who wrote about the conquest?
      ur: فتح کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب السيرة والتواريخ المبكرة
        en: the sira and early history books
        ur: سیرت اور ابتدائی تواریخ کی کتابیں
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والواقدي والطبري
        en: accounts reach us from Ibn Ishaq, al-Waqidi and al-Tabari
        ur: ابن اسحاق، واقدی اور طبری کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: مؤرخو العثمانيين فقط
        en: only Ottoman historians
        ur: صرف عثمانی مؤرخین
      correct: false
      why:
        ar: كتب المسلمون عن الفتح قبل العثمانيين بقرون
        en: Muslims wrote about it centuries before the Ottomans
        ur: مسلمانوں نے عثمانیوں سے صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: الفتح موثّق في كتب السيرة
        en: the conquest is documented in the sira books
        ur: فتح سیرت کی کتابوں میں مکتوب ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الحروب الصليبية بعد خمسة قرون
        en: the Crusades came five centuries later
        ur: صلیبی جنگیں پانچ صدیوں بعد آئیں
  - q:
      ar: ماذا تغيّر بعد الفتح؟
      en: What changed after the conquest?
      ur: فتح کے بعد کیا بدلا؟
    options:
    - text:
        ar: ميزان العرب كلها ودخول الناس في الإسلام
        en: the balance of all Arabia and people entering Islam
        ur: پورے عرب کا توازن اور لوگوں کا اسلام میں داخل ہونا
      correct: true
      why:
        ar: غيّر الفتح القوة في الجزيرة كلها
        en: the conquest shifted power across the peninsula
        ur: فتح نے جزیرے میں طاقت بدل دی
    - text:
        ar: لا شيء مهم
        en: nothing important
        ur: کوئی اہم چیز نہیں
      correct: false
      why:
        ar: الفتح نقطة تحوّل في المصادر
        en: the conquest is a turning point in the sources
        ur: فتح ماخذ میں ایک موڑ ہے
    - text:
        ar: انتهى الإسلام في مكة
        en: Islam ended in Mecca
        ur: مکہ میں اسلام ختم ہو گیا
      correct: false
      why:
        ar: بدأ انتشار الإسلام بعد الفتح لا انتهى
        en: Islam''s spread began after the conquest
        ur: فتح کے بعد اسلام کا پھیلاؤ شروع ہوا
    - text:
        ar: سقطت المدينة
        en: Medina fell
        ur: مدینہ گر گیا
      correct: false
      why:
        ar: بقيت المدينة العاصمة
        en: Medina stayed the capital
        ur: مدینہ دارالحکومت رہا
  - q:
      ar: لماذا لم تقاتل قريش الفتح؟
      en: Why did the Quraysh not fight the conquest?
      ur: قریش نے فتح کا مقابلہ کیوں نہیں کیا؟
    options:
    - text:
        ar: لأنّ المسلمين صاروا أقوى من أن يقاوموا
        en: because the Muslims had grown too strong to resist
        ur: کیونکہ مسلمان اتنے مضبوط ہو گئے تھے کہ مقابلہ نہ ہو سکا
      correct: true
      why:
        ar: سلّمت المدينة لأنّ الميزان مال في المصادر
        en: the sources have the city yield as the balance tipped
        ur: ماخذ میں شہر نے ہتھیار ڈالے کیونکہ توازن جھک گیا تھا
    - text:
        ar: لأنّهم كانوا في عطلة
        en: because they were on holiday
        ur: کیونکہ وہ تعطیل میں تھے
      correct: false
      why:
        ar: السلامة ليست عطلة في النصوص
        en: safety is not a holiday in the texts
        ur: نصوص میں امان کوئی تعطیل نہیں
    - text:
        ar: لأنّهم هاجروا إلى مصر
        en: because they migrated to Egypt
        ur: کیونکہ وہ مصر ہجرت کر گئے
      correct: false
      why:
        ar: بقيت قريش في مكة وسلّمت
        en: the Quraysh stayed in Mecca and yielded
        ur: قریش مکہ میں رہے اور ہتھیار ڈالے
    - text:
        ar: لأنّ مكة كانت مدينة مسالمة دائمًا
        en: because Mecca was always peaceful
        ur: کیونکہ مکہ ہمیشہ پرامن تھا
      correct: false
      why:
        ar: قاتلت قريش المسلمين في بدر وأُحد قبلها
        en: the Quraysh had fought the Muslims at Badr and Uhud
        ur: قریش نے اس سے پہلے بدر اور احد میں مسلمانوں سے لڑی
  - q:
      ar: أين ذهب النبي بعد الفتح؟
      en: Where did the Prophet go after the conquest?
      ur: فتح کے بعد نبی کہاں گئے؟
    options:
    - text:
        ar: عاد إلى المدينة
        en: he returned to Medina
        ur: مدینہ واپس آئے
      correct: true
      why:
        ar: بقيت المدينة مقرّه بعد الفتح في المصادر
        en: the sources keep Medina as his seat after the conquest
        ur: ماخذ میں فتح کے بعد مدینہ اس کی نشست رہی
    - text:
        ar: بقي في مكة إلى الأبد
        en: he stayed in Mecca forever
        ur: ہمیشہ مکہ میں رہے
      correct: false
      why:
        ar: عاد إلى المدينة بعد فتحها
        en: he returned to Medina after taking it
        ur: اسے لینے کے بعد مدینہ واپس آئے
    - text:
        ar: سافر إلى روما
        en: he travelled to Rome
        ur: روم گئے
      correct: false
      why:
        ar: لم يزر النبي روما
        en: the Prophet never visited Rome
        ur: نبی کبھی روم نہیں گئے
    - text:
        ar: ذهب إلى مصر
        en: he went to Egypt
        ur: مصر گئے
      correct: false
      why:
        ar: لم يغادر النبي الجزيرة بعد الفتح
        en: the Prophet did not leave Arabia after the conquest
        ur: فتح کے بعد نبی جزیرے سے باہر نہیں گئے
- id: baghdad
  anchor: place/baghdad
  band: researchers
  title:
    ar: بغداد
    en: Baghdad
    ur: بغداد
  sixty:
    ar: 'أسّس الخليفة العباسي المنصور بغداد سنة ٧٦٢م على دجلة مدينةً مدوّرة، قلبها قصر الخلافة ومسجده. صارت عاصمة الإمبراطورية العباسية ومقامًا للعصر الذهبي الإسلامي: تجمعت فيها التجارة من أقاصي الأرض، ودار الحكمة تترجم الفلسفة والطب والفلك من اليونانية والفارسية والهندية. ظلت خمسة قرون مركز الحضارة، تتنافس فيها المدارس والأسواق والشعراء. ثم جاء هولاكو سنة ١٢٥٨ فأسقط الخلافة وأحرق الكتب في دجلة، لكن بغداد نهضت مرة أخرى كمدينة كبرى على طريق الرافدين. ومن اسمها خرجت قصة: مدينة بُنيت على هندسة دائرة صارت عقل العالم. ويذكر المسلمون بغداد كما تُذكر العواصم الكبرى: أن الحضارة تبنى بالعلم والمال والحكم، وأنها تهدم بالفرقة والغزو، وأنها تعود بالذاكرة. ولم يكن جامعُها سوى وجهٍ واحد لمدينة تعدّدت مدارسها، ففي أزقّتها اجتمع المسلم والنصراني واليهودي والمجوسي على حرفةٍ وتجارةٍ وعلم. وكانت تسمّى مدينة السلام، فصار اسمها وعدًا وذكرى معًا: وعد ما يمكن أن تكونه العواصم، وذكرى ما خسرته.'
    en: 'The Abbasid caliph al-Mansur founded Baghdad in 762 CE on the Tigris as a round city — its heart the caliph''s palace and mosque. It became the empire''s capital and the seat of Islam''s golden age: goods came from the earth''s ends, and the House of Wisdom translated philosophy, medicine and astronomy out of Greek, Persian and Sanskrit. For five centuries it stayed civilization''s hub, where schools, markets and poets competed. Then Hulagu came in 1258, toppled the caliphate and cast the books into the Tigris; yet Baghdad rose again as the great city of the Two Rivers. From its name came a parable — a city built on the geometry of a circle that became the world''s mind. Muslims remember Baghdad as great capitals are remembered: civilization is built with knowledge, wealth and rule, destroyed by division and invasion, and reborn through memory.'
    ur: 'عباسی خلیفہ المنصور نے 762ء میں دجلہ کے کنارے بغداد کو گول شہر کے طور پر بسایا — مرکز میں خلیفہ کا محل اور مسجد۔ یہ سلطنت کا دارالحکومت اور اسلام کے عہدِ زریں کی نشست بنا: زمین کے کونوں سے سامان آتا، اور بیت الحکمت یونانی، فارسی اور سنسکرت سے فلسفہ، طب اور فلکیات کا ترجمہ کرتی۔ پانچ صدیوں یہ تہذیب کا مرکز رہا جہاں مکاتب، بازار اور شاعر مقابلہ کرتے۔ پھر 1258ء میں ہلاکو آیا، خلافت گرائی اور کتابیں دجلہ میں بہائیں — مگر بغداد دو دریا کا عظیم شہر بن کر پھر اٹھا۔ اس کے نام سے مثل نکلی: دائرے کی ہندسہ پر بسایا ہوا شہر جو دنیا کا ذہن بنا۔ مسلمان بغداد کو اسی طرح یاد رکھتے ہیں جس طرح عظیم دارالحکومت یاد کیے جاتے ہیں: تہذیب علم، دولت اور حکومت سے بنتی ہے، تقسیم اور حملے سے مٹتی ہے، اور یاد سے پھر جیتی ہے۔'
  glossary:
  - term:
      ar: المدينة المدوّرة
      en: the Round City
      ur: گول شہر
    gloss:
      ar: 'الشكل الذي بُنيت عليه بغداد أولًا: سور دائري حول القصر والمسجد'
      en: 'the shape Baghdad first took — a circular wall around palace and mosque'
      ur: 'وہ شکل جس پر بغداد پہلے بنا — محل اور مسجد کے گرد گول دیوار'
  - term:
      ar: المنصور
      en: al-Mansur
      ur: المنصور
    gloss:
      ar: 'الخليفة العباسي الثاني الذي وضع أساس المدينة سنة ٧٦٢م'
      en: 'the second Abbasid caliph who laid the city''s foundation in 762 CE'
      ur: 'دوسرا عباسی خلیفہ جس نے 762ء میں شہر کی بنیاد رکھی'
  - term:
      ar: دار الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: 'مركز الترجمة والعلوم الذي اشتهر به عصر المأمون'
      en: 'the translation and science house made famous under al-Ma''mun''s age'
      ur: 'ترجمہ اور علوم کا مرکز جو مامون کے عہد میں مشہور ہوا'
  - term:
      ar: دجلة
      en: the Tigris
      ur: دجلہ
    gloss:
      ar: 'النهر الذي قامت عليه بغداد وسالت فيه كتبها يوم السقوط'
      en: 'the river Baghdad stood on, into which its books ran the day it fell'
      ur: 'وہ دریا جس پر بغداد آباد تھا اور جس میں اس کے کتابیں بہی دن سقوط'
  - term:
      ar: العباسية
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'السلالة التي حكمت من المدينة خمسة قرون من ٧٥٠ حتى ١٢٥٨'
      en: 'the dynasty that ruled from the city five centuries, 750 to 1258'
      ur: 'وہ خاندان جو شہر سے پانچ صدیوں حکومت کیا، 750 سے 1258'
  - term:
      ar: هولاكو
      en: Hulagu
      ur: ہلاکو
    gloss:
      ar: 'قائد المغول الذي حاصر المدينة وأسقط الخلافة سنة ١٢٥٨'
      en: 'the Mongol leader who besieged the city and ended the caliphate in 1258'
      ur: 'منگول سردار جس نے شہر کا محاصرہ کیا اور 1258ء میں خلافت گرائی'
  - term:
      ar: العصر الذهبي
      en: the golden age
      ur: عہدِ زریں
    gloss:
      ar: 'الفترة التي ازدهرت فيها العلوم والفنون تحت العباسيين الأوائل'
      en: 'the era when sciences and arts flourished under the early Abbasids'
      ur: 'وہ دور جب ابتدائی عباسیوں میں علوم اور فنون سر سبز ہوئے'
  - term:
      ar: الترجمة
      en: the translation
      ur: ترجمہ
    gloss:
      ar: 'النشاط الذي ملأ الخزائن بالكتب من لغات كثيرة'
      en: 'the activity that filled the libraries with books out of many tongues'
      ur: 'وہ سرگرمی جس نے کتب خانوں کو بہت سی زبانوں کی کتابوں سے بھرا'
  - term:
      ar: الخمسة قرون
      en: the five centuries
      ur: پانچ صدیاں
    gloss:
      ar: 'مدة بقاء المدينة مركزًا للحضارة قبل السقوط'
      en: 'the span the city stayed civilization''s center before the fall'
      ur: 'وہ مدت جب شہر سقوط سے پہلے تہذیب کا مرکز رہا'
  - term:
      ar: ١٢٥٨
      en: '1258'
      ur: '1258'
    gloss:
      ar: 'سنة السقوط المغولي التي ختمت العصر العباسي في المدينة'
      en: 'the Mongol fall''s year that closed the Abbasid era in the city'
      ur: 'منگول سقوط کا سال جس نے شہر میں عباسی دور بند کیا'
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: 'منصب الإمام العام للمسلمين الذي كان مقامه في المدينة'
      en: 'the office of general leadership over Muslims seated in the city'
      ur: 'مسلمانوں کی عمومی قیادت کا منصب جس کی نشست شہر میں تھی'
  - term:
      ar: الرقّة
      en: the Ruzafa quarter
      ur: رزافہ محلہ
    gloss:
      ar: 'الحي الذي نشأ على ضفة دجلة الشرقية خارج المدورة'
      en: 'the quarter that grew on the Tigris''s east bank outside the Round City'
      ur: 'وہ محلہ جو دجلہ کے مشرقی کنارے گول شہر سے باہر ابھرا'
  practice:
  - q:
      ar: من أسّس بغداد؟
      en: Who founded Baghdad?
      ur: بغداد کس نے بسایا؟
    options:
    - text:
        ar: المنصور عام ٧٦٢
        en: al-Mansur in 762
        ur: المنصور نے 762 میں
      correct: true
      why:
        ar: تنسبه المصادر إلى الخليفة العباسي الثاني
        en: the sources credit the second Abbasid caliph
        ur: ماخذ اسے دوسرے عباسی خلیفہ سے منسوب کرتے ہیں
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: كان هارون خليفة لاحقًا لا المؤسس
        en: Harun was a later caliph, not the founder
        ur: ہارون بعد کا خلیفہ تھا، بانی نہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين في القرن الثاني عشر لا المؤسس
        en: Saladin is twelfth-century, not the founder
        ur: صلاح الدین بارہویں صدی کا ہے، بانی نہیں
    - text:
        ar: عمر بن الخطاب
        en: Umar ibn al-Khattab
        ur: عمر بن خطاب
      correct: false
      why:
        ar: مات عمر قبل تأسيس بغداد بقرن
        en: Umar died a century before the founding
        ur: عمر کی وفات بغداد کے قیام سے ایک صدی پہلے ہوئی
  - q:
      ar: ماذا كان شكل بغداد الأول؟
      en: What was early Baghdad''s shape?
      ur: ابتدائی بغداد کی شکل کیا تھی؟
    options:
    - text:
        ar: دائرة كاملة
        en: a perfect circle
        ur: مکمل دائرہ
      correct: true
      why:
        ar: سُمّيت المدينة المدوّرة في المصادر
        en: the sources call it the Round City
        ur: ماخذ اسے گول شہر کہتے ہیں
    - text:
        ar: مربع
        en: a square
        ur: مربع
      correct: false
      why:
        ar: الشكل في الكتب دائري لا مربع
        en: the books give a circle, not a square
        ur: کتابوں میں شکل دائرہ ہے، مربع نہیں
    - text:
        ar: خط مستقيم
        en: a straight line
        ur: سیدھی لکیر
      correct: false
      why:
        ar: لم تكن بغداد خطًّا بل مدينة مغلقة
        en: Baghdad was not a line but an enclosed city
        ur: بغداد لکیر نہیں بلکہ بند شہر تھا
    - text:
        ar: مثلث
        en: a triangle
        ur: مثلث
      correct: false
      why:
        ar: المدينة المدوّرة لا مثلثة
        en: it was the Round City, not a triangle
        ur: یہ گول شہر تھا، مثلث نہیں
  - q:
      ar: ما دار الحكمة؟
      en: What was the House of Wisdom?
      ur: بیت الحکمت کیا تھا؟
    options:
    - text:
        ar: مركز الترجمة والعلم في العباسية
        en: the Abbasid centre of translation and learning
        ur: ترجمہ اور علم کا عباسی مرکز
      correct: true
      why:
        ar: جمع المترجمين والعلماء في بغداد
        en: it gathered translators and scholars in Baghdad
        ur: اس نے بغداد میں مترجمین اور علماء جمع کیے
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: دار الحكمة مؤسسة علم لا سكن
        en: it was a learned institution, not a residence
        ur: یہ علمی ادارہ تھا، رہائش نہیں
    - text:
        ar: سوق الكتب
        en: the book market
        ur: کتابوں کی مارکیٹ
      correct: false
      why:
        ar: كانت مركز ترجمة لا سوقًا
        en: it was a translation centre, not a market
        ur: یہ ترجمہ کا مرکز تھا، بازار نہیں
    - text:
        ar: مدرسة أطفال
        en: a children''s school
        ur: بچوں کا مدرسہ
      correct: false
      why:
        ar: جمعت العلماء لا الصغار
        en: it gathered scholars, not the young
        ur: اس میں علماء جمع ہوئے، بچے نہیں
  - q:
      ar: متى سقطت بغداد؟
      en: When did Baghdad fall?
      ur: بغداد کب گرا؟
    options:
    - text:
        ar: عام ١٢٥٨ في أيدي المغول
        en: in 1258 to the Mongols
        ur: 1258 میں مغولوں کے ہاتھوں
      correct: true
      why:
        ar: تذكر المصادر تدمير هولاكو للمدينة ١٢٥٨
        en: the sources date Hulagu''s destruction to 1258
        ur: ماخذ ہلاکو کی تباہی 1258 لکھتے ہیں
    - text:
        ar: عام ١٠٩٥
        en: in 1095
        ur: 1095 میں
      correct: false
      why:
        ar: ذلك عام الحروب الصليبية لا سقوط بغداد
        en: that is the Crusades year, not Baghdad''s fall
        ur: یہ صلیبی جنگوں کا سال ہے، بغداد کے گرنے کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية لا سقوط بغداد
        en: that is Constantinople''s fall, not Baghdad''s
        ur: یہ قسطنطنیہ کے گرنے کا سال ہے، بغداد کا نہیں
    - text:
        ar: لم تسقط أبدًا
        en: it never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت المدينة للمغول في ١٢٥٨
        en: the city fell to the Mongols in 1258
        ur: شہر 1258 میں مغولوں کے ہاتھ گرا
  - q:
      ar: ما العصر الذهبي؟
      en: What was the golden age?
      ur: عہدِ زریں کیا تھا؟
    options:
    - text:
        ar: زمن الذروة العلمية في بغداد
        en: Baghdad''s peak age of learning
        ur: بغداد کی علمی بلندی کا زمانہ
      correct: true
      why:
        ar: ازدهرت الرياضيات والفلك والطب والجغرافيا
        en: mathematics, astronomy, medicine and geography flourished
        ur: ریاضی، فلکیات، طب اور جغرافیہ پھلے پھولے
    - text:
        ar: عصر الجاهلية
        en: the age of ignorance
        ur: جاہلیت کا دور
      correct: false
      why:
        ar: الجاهلية قبل الإسلام لا العصر الذهبي
        en: the Jahiliyya is pre-Islamic, not the golden age
        ur: جاہلیت اسلام سے پہلے کی ہے، عہدِ زریں نہیں
    - text:
        ar: القرن العشرين
        en: the twentieth century
        ur: بیسویں صدی
      correct: false
      why:
        ar: العصر الذهبي في العصور الوسطى
        en: the golden age is medieval, not modern
        ur: عہدِ زریں قرونِ وسطی کا ہے، جدید نہیں
    - text:
        ar: زمن الفتح الأول
        en: the time of the first conquests
        ur: پہلی فتوحات کا زمانہ
      correct: false
      why:
        ar: العصر الذهبي في العباسية لا الفتوحات
        en: the golden age is Abbasid, not the conquests
        ur: عہدِ زریں عباسی ہے، فتوحات نہیں
  - q:
      ar: ماذا فعل هولاكو بالكتب؟
      en: What did Hulagu do to the books?
      ur: ہلاکو نے کتابوں کا کیا کیا؟
    options:
    - text:
        ar: طرحها في النهر
        en: cast them into the river
        ur: دریا میں پھینکے
      correct: true
      why:
        ar: تذكر المصادر رمي الكتب في دجلة
        en: the sources record the books thrown into the Tigris
        ur: ماخذ کتابوں کے دجلہ میں پھینکے جانے کا ذکر کرتے ہیں
    - text:
        ar: بناها مكتبة
        en: he built them a library
        ur: ان کے لیے کتب خانہ بنایا
      correct: false
      why:
        ar: دمّر المدينة لا بناها مكتبة
        en: he destroyed the city, not built it a library
        ur: اس نے شہر تباہ کیا، کتب خانہ نہیں بنایا
    - text:
        ar: أرسلها إلى الصين
        en: he sent them to China
        ur: چین بھیجے
      correct: false
      why:
        ar: الكتب طرحت في دجلة لا أرسلت
        en: the books were cast into the river, not sent
        ur: کتابیں دریا میں پھینکی گئیں، بھیجی نہیں گئیں
    - text:
        ar: حفظها في خزانة
        en: he stored them in a treasury
        ur: خزانے میں محفوظ کیے
      correct: false
      why:
        ar: فقدت الكتب في النهر لا حُفظت
        en: the books were lost to the river, not stored
        ur: کتابیں دریا میں ضائع ہوئیں، محفوظ نہیں ہوئیں
  - q:
      ar: على أيّ نهر قامت بغداد؟
      en: On which river does Baghdad stand?
      ur: بغداد کس دریا پر قائم ہے؟
    options:
    - text:
        ar: دجلة
        en: the Tigris
        ur: دجلہ
      correct: true
      why:
        ar: تقف المدينة على ضفاف دجلة في المصادر
        en: the sources place the city on the Tigris banks
        ur: ماخذ شہر کو دجلہ کے کنارے رکھتے ہیں
    - text:
        ar: النيل
        en: the Nile
        ur: نیل
      correct: false
      why:
        ar: النيل في مصر لا العراق
        en: the Nile is in Egypt, not Iraq
        ur: نیل مصر میں ہے، عراق میں نہیں
    - text:
        ar: الفرات
        en: the Euphrates
        ur: فرات
      correct: false
      why:
        ar: الفرات قريب لكن المدينة على دجلة
        en: the Euphrates is near, but the city is on the Tigris
        ur: فرات قریب ہے مگر شہر دجلہ پر ہے
    - text:
        ar: الأردن
        en: the Jordan
        ur: اردن
      correct: false
      why:
        ar: الأردن في الشام لا العراق
        en: the Jordan is in Syria, not Iraq
        ur: اردن شام میں ہے، عراق میں نہیں
  - q:
      ar: لماذا اشتهرت بغداد؟
      en: Why is Baghdad famous?
      ur: بغداد کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت بيت الحكمة للبشر في زمنها
        en: because it was the world''s house of wisdom in its time
        ur: کیونکہ یہ اپنے زمانے میں دنیا کا بیت الحکمت تھا
      correct: true
      why:
        ar: جمعت العلم والترجمة والتجارة في ذروة
        en: it gathered learning, translation and trade at a peak
        ur: اس نے علم، ترجمہ اور تجارت کو بلندی پر جمع کیا
    - text:
        ar: لأنها كانت أول مدينة في التاريخ
        en: because it was history''s first city
        ur: کیونکہ یہ تاریخ کا پہلا شہر تھا
      correct: false
      why:
        ar: سبقتها مدن كثيرة في التاريخ
        en: many cities predate it in history
        ur: اس سے پہلے بہت سے شہر تھے
    - text:
        ar: لأنها لم تسقط أبدًا
        en: because it never fell
        ur: کیونکہ یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت في ١٢٥٨
        en: it fell in 1258
        ur: یہ 1258 میں گرا
    - text:
        ar: لأنها كانت عاصمة الأمويين
        en: because it was the Umayyad capital
        ur: کیونکہ یہ امویوں کا دارالحکومت تھا
      correct: false
      why:
        ar: الأمويون حكموا من دمشق لا بغداد
        en: the Umayyads ruled from Damascus, not Baghdad
        ur: امویوں نے دمشق سے حکومت کی، بغداد سے نہیں
  - q:
      ar: كم دامت بغداد عاصمة؟
      en: How long was Baghdad a capital?
      ur: بغداد کتنی دیر دارالحکومت رہا؟
    options:
    - text:
        ar: نحو خمسة قرون
        en: about five centuries
        ur: تقریباً پانچ صدیاں
      correct: true
      why:
        ar: من ٧٦٢ إلى ١٢٥٨ خمسة قرون تقريبًا
        en: from 762 to 1258 is about five centuries
        ur: 762 سے 1258 تک تقریباً پانچ صدیاں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة حكمها
        en: fifty is far short of its rule
        ur: پچاس اس کی حکمرانی کے عرصے سے کہیں کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: لم يصل حكمها إلى ألف
        en: its rule did not reach a thousand
        ur: اس کی حکمرانی ہزار تک نہیں پہنچی
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة مدة خلافة واحدة قصيرة
        en: ten is the span of one short caliphate
        ur: دس ایک مختصر خلافت کا عرصہ ہے
  - q:
      ar: ماذا ترجمت دار الحكمة؟
      en: What did the House of Wisdom translate?
      ur: بیت الحکمت نے کیا ترجمہ کیا؟
    options:
    - text:
        ar: علوم اليونان وفارس والهند إلى العربية
        en: Greek, Persian and Indian learning into Arabic
        ur: یونانی، فارسی اور ہندوستانی علم کا عربی میں
      correct: true
      why:
        ar: نقلت الحضارات القديمة إلى لغة العلم العربية
        en: it carried ancient civilizations into scholarly Arabic
        ur: اس نے قدیم تہذیبوں کو علمی عربی میں منتقل کیا
    - text:
        ar: القرآن إلى الفرنسية
        en: the Quran into French
        ur: قرآن کا فرانسیسی میں
      correct: false
      why:
        ar: كانت الترجمة من اللغات القديمة إلى العربية
        en: the translation was from ancient languages into Arabic
        ur: ترجمہ قدیم زبانوں سے عربی میں تھا
    - text:
        ar: الأدب الفرنسي
        en: French literature
        ur: فرانسیسی ادب
      correct: false
      why:
        ar: لم تكن الفرنسية في مصادر الترجمة
        en: French was not among the translation sources
        ur: فرانسیسی ترجمے کے ماخذ میں نہیں تھی
    - text:
        ar: لا شيء؛ كانت للعبادة
        en: nothing; it was for worship
        ur: کچھ نہیں؛ یہ عبادت کے لیے تھی
      correct: false
      why:
        ar: دار الحكمة مؤسسة علم لا عبادة
        en: it was a learning institution, not worship
        ur: یہ علمی ادارہ تھا، عبادت نہیں
- id: mecca
  anchor: place/mecca
  band: scholars
  title:
    ar: مكة
    en: Mecca
    ur: مکہ
  sixty:
    ar: 'مكة أم القرى: فيها الكعبة بيت الله، وإليها تتوجّه الصلوات في كل أرض، ومنها خرجت الدعوة الإسلامية. كانت قبل الإسلام مركز التجارة الحجازي وعُرفت بقوافل الشتاء والصيف، وبئر زمزم التي لا تنضب منذ إبراهيم. من جبل النور فوقها نزل الوحي أول مرة، ومنها هاجر النبي إلى يثرب، وإليها عاد فاتحًا سنة ٦٣٠م. اليوم يقصدها ملايين الحجاج في ذي الحجة والعمرة طوال العام، وتظل حكمها للمسلمين: لا يدخلها إلا المسلم. مدينة تجمع الجغرافيا والتاريخ والقلب في موضع واحد. وهي اليوم كما كانت: قلب الأمة الذي تنبض إليه الأيام، وأمّ المدن التي تنتظرها العيون في كل أذان. وتلك الأيام التي تحفظها الذاكرة — أول وحي، وخروج، وعودة — جعلت مكة لا مدينةً تُزَار بل زمّنًا يُعاش مرة أخرى في كل موسم. فيها وُلدت الدعوة، ومنها انطلقت إلى الدنيا، وإليها يعود الحجاج كل عام فيقولون لبّيك: حاضرون بين يديك.'
    en: 'Mecca, Mother of Towns — it holds the Kaaba, God''s House, toward which prayers turn in every land, and from which the Islamic call went out. Before Islam it was the Hijaz''s trade hub, known for the winter and summer caravans, and for Zamzam, the well that has not dried since Abraham''s days. From the Mount of Light above it the revelation first came down; from it the Prophet migrated to Yathrib; to it he returned a conqueror in 630. Today millions come for the Hajj in Dhu al-Hijja and for umrah through the year, and its precinct stays Muslims-only. A city joining geography, history and the heart in one spot. And it is today as it ever was: the ummah Few cities hold so much in so little ground: a house, a well, a cave, and the memory of twenty-three years that remade the world.''s heart the days beat toward, the mother of cities toward which every call to prayer gazes.'
    ur: 'مکہ، ام القری — اس میں خدا کا گھر کعبہ ہے جس کی طرف دنیا بھر میں نمازیں پڑھی جاتی ہیں اور جہاں سے اسلامی دعوت نکلی۔ اسلام سے پہلے یہ حجاز کا تجارتی مرکز تھا، موسم سرما و گرما کے قافلوں اور زمزم کے ایسے چشمے کے لیے مشہور جو ابراہیم کے زمانے سے خشک نہیں ہوا۔ اس کے اوپر کوہِ نور سے وحی پہلی بار نازل ہوئی؛ یہاں سے نبی یثرب ہجرت کی؛ اور 630ء میں فاتح بن کر واپس آئے۔ آج ذوالحجہ میں لاکھوں حجاج اور سارے سال معتمر آتے ہیں، اور اس کا حرم صرف مسلمانوں کے لیے ہے۔ وہ شہر جو جغرافیہ، تاریخ اور دل کو ایک جگہ جوڑتا ہے۔ اور آج بھی وہ ویسی ہی ہے: امت کا دل جس کی طرف دن دھڑکتے ہیں، شہروں کی ماں جسے ہر اذان دیکھتی ہے۔'
  glossary:
  - term:
      ar: الكعبة
      en: the Kaaba
      ur: کعبہ
    gloss:
      ar: 'بيت الله في قلب مكة الذي تتوجه إليه الصلوات والحج'
      en: 'God''s House at Mecca''s heart toward which prayers and the Hajj turn'
      ur: 'مکہ کے مرکز میں خدا کا گھر جس کی طرف نمازیں اور حج متوجہ ہیں'
  - term:
      ar: زمزم
      en: Zamzam
      ur: زمزم
    gloss:
      ar: 'البئر في المسجد الحرام التي تروي الحجاج منذ أيام إبراهيم'
      en: 'the well in the Grand Mosque that has watered pilgrims since Abraham''s days'
      ur: 'مسجد الحرام کا چشمہ جو ابراہیم کے زمانے سے حجاج کو سیراب کرتا ہے'
  - term:
      ar: الحجاز
      en: the Hijaz
      ur: حجاز
    gloss:
      ar: 'الإقليم الغربي من الجزيرة حيث قامت مكة والمدينة والطائف'
      en: 'the peninsula''s western region holding Mecca, Medina and Taif'
      ur: 'جزیرے کا مغربی خطہ جس میں مکہ، مدینہ اور طائف ہیں'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي يصلّي المسلمون إليه في كل مكان: نحو الكعبة'
      en: 'the direction Muslims pray toward everywhere — the Kaaba'
      ur: 'وہ سمت جس کی طرف مسلمان ہر جگہ نماز پڑھتے ہیں — کعبہ'
  - term:
      ar: غار حراء
      en: the cave of Hira
      ur: غارِ حرا
    gloss:
      ar: 'الغار في جبل النور حيث بدأ الوحي على النبي'
      en: 'the cave on the Mount of Light where revelation began upon the Prophet'
      ur: 'کوہِ نور کی غار جہاں نبی پر وحی کا آغاز ہوا'
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'رحلة النبي إلى يثرب التي صارت بداية دولة المدينة'
      en: 'the Prophet''s journey to Yathrib that began the Medina state'
      ur: 'نبی کا یثرب سفر جس سے مدینہ کی ریاست کا آغاز ہوا'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الرحلة الكبرى إلى الكعبة التي يؤدّيها المسلم مرة إن استطاع'
      en: 'the great journey to the Kaaba a Muslim performs once if able'
      ur: 'کعبہ کا عظیم سفر جو مسلمان عمر میں ایک بار کرے اگر استطاعت ہو'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'قبيلة مكة الحاكمة التي قادت قوافلها وحرمتها'
      en: 'Mecca''s ruling tribe that led its caravans and held its sanctuary'
      ur: 'مکہ کا حکمران قبیلہ جس نے قافلوں کی قیادت اور حرم کی رکھی'
  - term:
      ar: الفتح
      en: the conquest
      ur: فتح
    gloss:
      ar: 'دخول النبي مكة منتصرًا سنة ٦٣٠ وطهارة الكعبة'
      en: 'the Prophet''s victorious entry into Mecca in 630 and the Kaaba''s cleansing'
      ur: '630ء میں نبی کا مکہ میں فاتحانہ داخلہ اور کعبہ کی پاکیزگی'
  - term:
      ar: القوافل
      en: the caravans
      ur: قافلے
    gloss:
      ar: 'رحلات التجارة الحجازية التي اشتهرت بها قريش شتاءً وصيفًا'
      en: 'the Hijazi trade journeys Quraysh was known for, winter and summer'
      ur: 'حجازی تجارتی سفر جو قریش کی پہچان تھے — سرما اور گرما میں'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'شهر الحج الذي يقصد فيه الحجاج المدينة المقدسة'
      en: 'the Hajj month in which pilgrims seek the holy city'
      ur: 'حج کا مہینہ جس میں حجاج مقدس شہر کا رخ کرتے ہیں'
  - term:
      ar: ذو الحجة
      en: Dhu al-Hijja
      ur: ذوالحجہ
    gloss:
      ar: 'شهر الموسم الذي تقام فيه مناسك الحج الكبرى'
      en: 'the season month in which the great Hajj rites are performed'
      ur: 'وہ موسمی مہینہ جس میں حج کے عظیم مناسک ادا ہوتے ہیں'
  practice:
  - q:
      ar: ما الذي يتجه إليه المسلمون في صلاتهم؟
      en: What do Muslims face in prayer?
      ur: مسلمان نماز میں کس طرف رخ کرتے ہیں؟
    options:
    - text:
        ar: الكعبة في مكة
        en: the Kaaba in Mecca
        ur: مکہ میں کعبہ
      correct: true
      why:
        ar: الكعبة قبلة الصلوات الخمس في الكتب
        en: the Kaaba is the five prayers'' qibla in the books
        ur: کعبہ کتابوں میں پانچ نمازوں کا قبلہ ہے
    - text:
        ar: القدس دائمًا
        en: always Jerusalem
        ur: ہمیشہ بیت المقدس
      correct: false
      why:
        ar: كانت القدس القبلة الأولى ثم حُوّلت
        en: Jerusalem was the first qibla, then it changed
        ur: بیت المقدس پہلا قبلہ تھا، پھر بدل گیا
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة مركز الدولة لا القبلة
        en: Medina is the polity''s centre, not the qibla
        ur: مدینہ ریاست کا مرکز ہے، قبلہ نہیں
    - text:
        ar: لا اتجاه
        en: no direction
        ur: کوئی سمت نہیں
      correct: false
      why:
        ar: القبلة جزء من الصلاة
        en: the qibla is part of the prayer
        ur: قبلہ نماز کا حصہ ہے
  - q:
      ar: على ماذا قامت مكة اقتصاديًّا؟
      en: What did Mecca''s economy stand on?
      ur: مکہ کی معیشت کس پر قائم تھی؟
    options:
    - text:
        ar: تجارة القوافل
        en: the caravan trade
        ur: قافلہ تجارت
      correct: true
      why:
        ar: جمعت قريش تجارة الشام واليمن
        en: Quraysh gathered the Syria-Yemen trade
        ur: قریش نے شام اور یمن کی تجارت جمع کی
    - text:
        ar: الزراعة الواسعة
        en: vast farming
        ur: وسیع کھیتی
      correct: false
      why:
        ar: مكة وادٍ غير زراعي في المصادر
        en: Mecca is an un-farmed valley in the sources
        ur: مکہ ماخذ میں غیر زرعی وادی ہے
    - text:
        ar: صيد السمك
        en: fishing
        ur: مچھلی پکڑنا
      correct: false
      why:
        ar: مكة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے، ساحلی نہیں
    - text:
        ar: التعدين
        en: mining
        ur: کان کنی
      correct: false
      why:
        ar: لم تشتهر مكة بالتعدين بل بالتجارة
        en: Mecca was known for trade, not mining
        ur: مکہ کان کنی نہیں بلکہ تجارت کے لیے مشہور تھا
  - q:
      ar: أين بدأ الوحي في مكة؟
      en: Where in Mecca did revelation begin?
      ur: مکہ میں وحی کہاں شروع ہوئی؟
    options:
    - text:
        ar: غار حراء
        en: the cave of Hira
        ur: غارِ حرا
      correct: true
      why:
        ar: تذكر المصادر الغار على جبل النور
        en: the sources name the cave on the Mount of Light
        ur: ماخذ کوہِ نور پر غار کا ذکر کرتے ہیں
    - text:
        ar: داخل الكعبة
        en: inside the Kaaba
        ur: کعبہ کے اندر
      correct: false
      why:
        ar: كان الوحي في الغار لا في البيت
        en: revelation was in the cave, not the House
        ur: وحی غار میں آئی، گھر میں نہیں
    - text:
        ar: في المسجد الحرام
        en: in the Grand Mosque
        ur: مسجدِ حرام میں
      correct: false
      why:
        ar: كان بدء الوحي على الجبل لا في المسجد
        en: the start was on the mountain, not the mosque
        ur: آغاز پہاڑ پر تھا، مسجد میں نہیں
    - text:
        ar: في السوق
        en: in the market
        ur: بازار میں
      correct: false
      why:
        ar: لم يكن الوحي في السوق
        en: revelation was not in the market
        ur: وحی بازار میں نہیں آئی
  - q:
      ar: متى عاد المسلمون إلى مكة؟
      en: When did Muslims return to Mecca?
      ur: مسلمان مکہ کب واپس آئے؟
    options:
    - text:
        ar: عام ٦٣٠ فاتحين
        en: in 630 as conquerors
        ur: 630 میں فاتح کے طور پر
      correct: true
      why:
        ar: الفتح في رمضان ٨هـ
        en: the conquest in Ramadan 8 AH
        ur: فتح رمضان 8 ہجری میں
    - text:
        ar: لم يعودوا أبدًا
        en: they never returned
        ur: وہ کبھی واپس نہیں آئے
      correct: false
      why:
        ar: عادوا عام ٦٣٠ في الفتح
        en: they returned in 630 at the conquest
        ur: وہ 630 میں فتح میں واپس آئے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام خروجهم لا عودتهم
        en: that is the year they left, not returned
        ur: یہ ان کے نکلنے کا سال ہے، واپسی کا نہیں
    - text:
        ar: في القرن العاشر
        en: in the tenth century
        ur: دسویں صدی میں
      correct: false
      why:
        ar: الفتح في القرن السابع
        en: the conquest is seventh-century
        ur: فتح ساتویں صدی میں ہے
  - q:
      ar: ما زمزم؟
      en: What is Zamzam?
      ur: زمزم کیا ہے؟
    options:
    - text:
        ar: ماء مكة المشهور
        en: Mecca''s famous water
        ur: مکہ کا مشہور پانی
      correct: true
      why:
        ar: قامت المدينة على ماء زمزم في الذاكرة
        en: the city stood on Zamzam water in memory
        ur: شہر یادداشت میں زمزم کے پانی پر قائم تھا
    - text:
        ar: جبل قرب مكة
        en: a mountain near Mecca
        ur: مکہ کے قریب پہاڑ
      correct: false
      why:
        ar: زمزم بئر لا جبل
        en: Zamzam is a well, not a mountain
        ur: زمزم کنواں ہے، پہاڑ نہیں
    - text:
        ar: قبيلة من مكة
        en: a Meccan tribe
        ur: مکہ کا قبیلہ
      correct: false
      why:
        ar: زمزم ماء لا قبيلة
        en: Zamzam is water, not a tribe
        ur: زمزم پانی ہے، قبیلہ نہیں
    - text:
        ar: سوق مكة
        en: Mecca''s market
        ur: مکہ کا بازار
      correct: false
      why:
        ar: زمزم ماء لا سوق
        en: Zamzam is water, not a market
        ur: زمزم پانی ہے، بازار نہیں
  - q:
      ar: في أيّ شهر يكون الحج؟
      en: In which month is the Hajj?
      ur: حج کس مہینے میں ہوتا ہے؟
    options:
    - text:
        ar: ذو الحجة
        en: Dhu al-Hijja
        ur: ذوالحجہ
      correct: true
      why:
        ar: الحج في الشهر الثاني عشر الهجري
        en: Hajj is in the twelfth Hijri month
        ur: حج ہجری سال کے بارہویں مہینے میں ہے
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: false
      why:
        ar: رمضان شهر الصوم لا الحج
        en: Ramadan is the fasting month, not Hajj
        ur: رمضان روزے کا مہینہ ہے، حج کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الحج
        en: Muharram opens the year, not Hajj
        ur: محرم سال کا پہلا مہینہ ہے، حج کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب شهر حرام لا شهر الحج
        en: Rajab is sacred, not the Hajj month
        ur: رجب حرام مہینہ ہے، حج کا نہیں
  - q:
      ar: من كانت قريش؟
      en: Who were the Quraysh?
      ur: قریش کون تھے؟
    options:
    - text:
        ar: قبيلة مكة الحاكمة وقبيلة النبي
        en: Mecca''s ruling tribe and the Prophet''s own
        ur: مکہ کا حکمران قبیلہ اور نبی کا قبیلہ
      correct: true
      why:
        ar: من قريش كان النبي ومنها خرج
        en: the Prophet came from Quraysh and left it
        ur: نبی قریش سے تھے اور اسی سے نکلے
    - text:
        ar: قبيلة من يثرب
        en: a Yathrib tribe
        ur: یثرب کا قبیلہ
      correct: false
      why:
        ar: قريش في مكة لا يثرب
        en: Quraysh is Meccan, not Yathribi
        ur: قریش مکہ کا ہے، یثرب کا نہیں
    - text:
        ar: جيش الفرنجة
        en: the Frankish army
        ur: فرنگی لشکر
      correct: false
      why:
        ar: الفرنجة جاءت بعد قرون
        en: the Franks came centuries later
        ur: فرنگی صدیوں بعد آئے
    - text:
        ar: ملوك فارس
        en: Persian kings
        ur: فارسی بادشاہ
      correct: false
      why:
        ar: قريش قبيلة عربية لا فارسية
        en: Quraysh is an Arab tribe, not Persian
        ur: قریش عرب قبیلہ ہے، فارسی نہیں
  - q:
      ar: لماذا سمّيت مكة مقدسة؟
      en: Why is Mecca called sacred?
      ur: مکہ کو مقدس کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: للبيت الكعبة ومكان الوحي في الذاكرة
        en: for the Kaaba and revelation''s place in memory
        ur: کعبہ اور وحی کے مقام کی وجہ سے، یادداشت میں
      correct: true
      why:
        ar: تجمع المصادر بيت الله وبدء الرسالة فيها
        en: the sources join God''s House and the message''s start there
        ur: ماخذ اس میں اللہ کا گھر اور پیغام کا آغاز جوڑتے ہیں
    - text:
        ar: لأنها أكبر مدينة في العالم
        en: because it is the world''s largest city
        ur: کیونکہ یہ دنیا کا سب سے بڑا شہر ہے
      correct: false
      why:
        ar: لم تكن أكبر مدن العالم في أيّ زمن
        en: it was never the world''s largest city
        ur: یہ کسی زمانے میں دنیا کا سب سے بڑا شہر نہیں تھا
    - text:
        ar: لأنها على البحر
        en: because it is on the sea
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: مكة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے
    - text:
        ar: لأنها عاصمة الخلافة
        en: because it was the caliphate capital
        ur: کیونکہ یہ خلافت کا دارالحکومت تھا
      correct: false
      why:
        ar: الخلافة كانت في المدينة ثم دمشق ثم بغداد
        en: the caliphate sat in Medina, then Damascus, then Baghdad
        ur: خلافت مدینہ، پھر دمشق، پھر بغداد میں رہی
  - q:
      ar: ماذا فعل المسلمون في مكة عام ٦٣٠؟
      en: What did Muslims do in Mecca in 630?
      ur: 630 میں مسلمانوں نے مکہ میں کیا کیا؟
    options:
    - text:
        ar: دخلوها فاتحين وهدّموا الأصنام
        en: they entered as conquerors and brought down the idols
        ur: فاتح کے طور پر داخل ہوئے اور بت گرائے
      correct: true
      why:
        ar: الفتح وإزالة الأصنام في المصادر
        en: the conquest and removing the idols in the sources
        ur: فتح اور بتوں کے ہٹائے جانے کا ذکر ماخذ میں
    - text:
        ar: بنوا الكعبة
        en: they built the Kaaba
        ur: انہوں نے کعبہ بنایا
      correct: false
      why:
        ar: الكعبة أقدم من الفتح بقرون
        en: the Kaaba predates the conquest by centuries
        ur: کعبہ فتح سے صدیوں پرانا ہے
    - text:
        ar: أحرقوا المدينة
        en: they burned the city
        ur: انہوں نے شہر جلایا
      correct: false
      why:
        ar: سلّمت مكة بلا حريق في المصادر
        en: Mecca yielded without burning in the sources
        ur: ماخذ میں مکہ نے بغیر جلائے ہتھیار ڈالے
    - text:
        ar: هاجروا منها
        en: they migrated from it
        ur: انہوں نے وہاں سے ہجرت کی
      correct: false
      why:
        ar: الهجرة كانت ٦٢٢ لا ٦٣٠
        en: the migration was 622, not 630
        ur: ہجرت 622 میں تھی، 630 میں نہیں
  - q:
      ar: من كتب عن مكة؟
      en: Who wrote about Mecca?
      ur: مکہ کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون وجغرافيون ورحّالة من العصور كلها
        en: historians, geographers and travellers of every age
        ur: ہر دور کے مؤرخین، جغرافیہ دان اور سیاح
      correct: true
      why:
        ar: تصلنا وصف مكة من الأزرقي إلى الرحّالة
        en: accounts of Mecca reach us from al-Azraqi to the travellers
        ur: ازرقی سے سیاحوں تک مکہ کی وصف ہم تک پہنچی
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عن مكة قبل أوروبا بقرون
        en: Muslims wrote about Mecca centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے مکہ کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: مكة من أكثر المدن وصفًا في الكتب
        en: Mecca is among the most-described cities in books
        ur: مکہ کتابوں میں سب سے زیادہ بیان شدہ شہروں میں ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الصليبيون كتبوا عن الشام لا مكة
        en: the Crusaders wrote of Syria, not Mecca
        ur: صلیبیوں نے شام کے بارے میں لکھا، مکہ کے بارے میں نہیں
- id: medina
  anchor: place/medina
  band: scholars
  title:
    ar: المدينة
    en: Medina
    ur: مدینہ
  sixty:
    ar: 'يثرب التي صارت المدينة: قبل الهجرة كانت واحة يتنازعها الأوس والخزرج، وبعدها صارت قلب أول دولة مسلمة. فيها بُني مسجد النبي، وكتبت وثيقتها تسوّي بين المسلمين واليهود وسائر القبائل، ومنها انطلقت السرايا والغزوات: بدر وأحد والخندق. ظلت عاصمة الخلفاء الراشدين ثلاثين سنة حتى انتقلت الخلافة إلى الكوفة فدمشق. وأهلها الأنصار الذين آووا المهاجرين صاروا نموذج النصرة في القرآن. اليوم تبقى المدينة ثاني الحرمين، يزورها المسلمون للصلاة في مسجد النبي وزيارة قبره، ويحمل اسمها معنى التحوّل: بلدة منقسمة صارت أمّة. ومنها تعلّمت الأمة أن الدولة تُبنى بالوثيقة قبل الجيش، وأن الجوار يسبق العرق، وأن الرحمة تقود الدعوة. وبقيت المدينة بعد رحيله بيتَ السنة: فيها دُوّنت الحياةُ اليومية للمسلم الأول، ومنها نُقلت للأجيال صورةُ عيشٍ كامل. وعلى أرضها دروس كل عصر: الأخوة قبل النسب، والعقد قبل السيف، والبيت قبل القصر.'
    en: 'Yathrib that became Medina — before the Hijra it was an oasis contested by Aws and Khazraj; afterwards it became the heart of the first Muslim state. Here the Prophet''s mosque was built, and its charter written, equalizing Muslims, Jews and the other tribes; from here the raids went out — Badr, Uhud, the Trench. It stayed the Rightly Guided caliphs'' capital thirty years, until rule passed to Kufa, then Damascus. Its Ansar who sheltered the emigrants became the Qur''an''s model of support. Today Medina remains the second sanctuary: Muslims come to pray in the Prophet''s mosque and visit his grave. Its name carries the meaning of transformation — a divided town that became an ummah. From it the ummah learned that a state is built by charter before army, that neighborliness comes before blood, and that mercy leads the call.'
    ur: 'یثرب جو مدینہ بنی — ہجرت سے پہلے اوس اور خزرج کے باہم جھگڑتے نخلستان تھی؛ بعد میں پہلی مسلم ریاست کا دل بنی۔ یہاں نبی کی مسجد بنی اور اس کا میثاق لکھا گیا جو مسلمانوں، یہود اور قبائل کے حق برابر رکھتا تھا؛ یہاں سے مہمات نکلیں — بدر، احد، خندق۔ تیس برس خلفائے راشدین کا دارالحکومت رہی پھر حکومت کوفہ اور دمشق منتقل ہوئی۔ اس کے انصار جنھوں نے مہاجرین کو پناہ دی قرآن میں نصرت کا نمونہ بنے۔ آج مدینہ دوسرا حرم ہے: مسلمان نبی کی مسجد میں نماز اور ان کی قبر کی زیارت آتے ہیں۔ اس کا نام تبدیلی کا مفہوم رکھتا ہے — بٹا ہوا قصبہ جو امت بنا۔ اسی سے امت نے سیکھا کہ ریاست فوج سے پہلے میثاق سے بنتی ہے، ہمسایگی خون سے پہلے آتی ہے، اور رحمت دعوت کی قیادت کرتی ہے۔'
  glossary:
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: 'الاسم القديم للمدينة قبل أن تسمّى مدينة النبي'
      en: 'the old name before it was called the Prophet''s city'
      ur: 'پرانا نام قبل اس کے کہ نبی کا شہر کہلائی'
  - term:
      ar: المسجد النبوي
      en: the Prophet''s mosque
      ur: مسجدِ نبوی
    gloss:
      ar: 'أول مسجد في المدينة صار قبر النبي بجواره ومقصد الزوار'
      en: 'the city''s first mosque, beside which the Prophet lies and visitors seek'
      ur: 'شہر کی پہلی مسجد جس کے پاس نبی آرام کرتے ہیں اور زائر آتے ہیں'
  - term:
      ar: وثيقة المدينة
      en: the Constitution of Medina
      ur: میثاقِ مدینہ
    gloss:
      ar: 'الصحيفة التي رتّبت حقوق المسلمين واليهود وسائر القبائل'
      en: 'the document that set the rights of Muslims, Jews and the remaining tribes'
      ur: 'وہ فرمان جس نے مسلمانوں، یہود اور قبائل کے حقوق طے کیے'
  - term:
      ar: الأنصار
      en: the Ansar
      ur: انصار
    gloss:
      ar: 'أهل يثرب الذين نصروا المهاجرين فصاروا عنوان النصرة'
      en: 'the Yathrib folk who aided the emigrants and became the emblem of support'
      ur: 'یثرب کے لوگ جنھوں نے مہاجرین کی مدد کی اور نصرت کی پہچان بنے'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'أهل مكة الذين تركوا ديارهم وهاجروا إلى المدينة'
      en: 'the Meccans who left their homes and migrated to Medina'
      ur: 'مکہ کے لوگ جنھوں نے گھر چھوڑے اور مدینہ ہجرت کی'
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: 'منصب الحكم العام الذي قام في المدينة ثلاثين سنة'
      en: 'the general rule''s office seated in Medina for thirty years'
      ur: 'عمومی حکومت کا منصب جو مدینہ میں تیس برس رہا'
  - term:
      ar: الكوفة
      en: Kufa
      ur: کوفہ
    gloss:
      ar: 'المدينة العراقية التي انتقلت إليها الخلافة في عهد علي'
      en: 'the Iraqi city the caliphate moved to under Ali'
      ur: 'وہ عراقی شہر جہاں علی کے عہد میں خلافت منتقل ہوئی'
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: 'المدينة الشامية التي صارت عاصمة الأمويين بعد المدينة'
      en: 'the Syrian city that became the Umayyad capital after Medina'
      ur: 'وہ شامی شہر جو مدینہ کے بعد اموی دارالحکومت بنا'
  - term:
      ar: الحرمان
      en: the two sanctuaries
      ur: دونوں حرم
    gloss:
      ar: 'مكة والمدينة معًا، المقامان الأقدس في الإسلام'
      en: 'Mecca and Medina together — Islam''s two holiest precincts'
      ur: 'مکہ اور مدینہ دونوں — اسلام کے دو مقدس ترین مقامات'
  - term:
      ar: السرايا
      en: the expeditions
      ur: مہمات
    gloss:
      ar: 'البعثات الصغيرة التي أرسلها النبي من المدينة'
      en: 'the small missions the Prophet sent out from Medina'
      ur: 'چھوٹی مہمیں جو نبی نے مدینہ سے بھیجیں'
  - term:
      ar: ٦٢٢
      en: '622'
      ur: '622'
    gloss:
      ar: 'سنة الهجرة التي بدأ فيها التاريخ الهجري والدولة'
      en: 'the Hijra year starting the Hijri calendar and the state'
      ur: 'ہجرت کا سال جس سے ہجری تقویم اور ریاست شروع ہوئیں'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي صار للصلاة بعد التحويل من القدس إلى الكعبة'
      en: 'the direction prayer turned after the change from Jerusalem to the Kaaba'
      ur: 'وہ سمت جس کی طرف نماز مڑی بیت المقدس سے کعبہ کی تبدیلی کے بعد'
  practice:
  - q:
      ar: ما الاسم القديم للمدينة؟
      en: What is Medina''s old name?
      ur: مدینہ کا قدیم نام کیا ہے؟
    options:
    - text:
        ar: يثرب
        en: Yathrib
        ur: یثرب
      correct: true
      why:
        ar: يثرب اسمها قبل الإسلام في المصادر
        en: Yathrib is her pre-Islamic name in the sources
        ur: یثرب ماخذ میں اس کا اسلام سے پہلے کا نام ہے
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: false
      why:
        ar: مكة مدينة أخرى
        en: Mecca is another city
        ur: مکہ دوسرا شہر ہے
    - text:
        ar: الكوفة
        en: Kufa
        ur: کوفہ
      correct: false
      why:
        ar: الكوفة في العراق لا يثرب
        en: Kufa is in Iraq, not Yathrib
        ur: کوفہ عراق میں ہے، یثرب نہیں
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد مدينة لاحقة
        en: Baghdad is a later city
        ur: بغداد بعد کا شہر ہے
  - q:
      ar: متى قامت الدولة في المدينة؟
      en: When did the polity rise in Medina?
      ur: مدینہ میں ریاست کب قائم ہوئی؟
    options:
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: true
      why:
        ar: سنة الهجرة والوثيقة معًا
        en: the Hijra year and the covenant together
        ur: ہجرت کا سال اور معاہدہ ایک ساتھ
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ذلك عام بدء الوحي في مكة
        en: that is the year revelation began in Mecca
        ur: یہ مکہ میں وحی کے آغاز کا سال ہے
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ذلك عام الفتح لا قيام المدينة
        en: that is the conquest year, not Medina''s founding
        ur: یہ فتح کا سال ہے، مدینہ کے قیام کا نہیں
    - text:
        ar: عام ٧٥٠
        en: in 750
        ur: 750 میں
      correct: false
      why:
        ar: ذلك عام قيام العباسية
        en: that is the year the Abbasids rose
        ur: یہ عباسیوں کے قیام کا سال ہے
  - q:
      ar: ما وثيقة المدينة؟
      en: What is the Constitution of Medina?
      ur: میثاقِ مدینہ کیا ہے؟
    options:
    - text:
        ar: عقد بين المسلمين وقبائل المدينة وحلفائهم
        en: a pact between Muslims, Medina''s tribes and allies
        ur: مسلمانوں، مدینہ کے قبائل اور حلیفوں کے درمیان عہد
      correct: true
      why:
        ar: جمعت الأطراف في بنيان واحد
        en: it joined the parties in one order
        ur: اس نے فریقوں کو ایک نظم میں جوڑا
    - text:
        ar: معاهدة تجارة
        en: a trade treaty
        ur: تجارتی معاہدہ
      correct: false
      why:
        ar: كانت عقدًا سياسيًّا لا تجاريًّا
        en: it was a political pact, not trade
        ur: یہ سیاسی عہد تھا، تجارتی نہیں
    - text:
        ar: رسالة سرية
        en: a secret letter
        ur: خفیہ خط
      correct: false
      why:
        ar: شملت كلّ أطراف المدينة علنًا
        en: it covered all of Medina''s parties openly
        ur: اس میں مدینہ کے تمام فریق علانیہ شامل تھے
    - text:
        ar: قانون روماني
        en: a Roman law
        ur: رومی قانون
      correct: false
      why:
        ar: كُتبت في المدينة لا روما
        en: it was written in Medina, not Rome
        ur: یہ مدینہ میں لکھی گئی، روم میں نہیں
  - q:
      ar: ماذا بُني في المدينة؟
      en: What was built in Medina?
      ur: مدینہ میں کیا تعمیر ہوا؟
    options:
    - text:
        ar: المسجد النبوي
        en: the Prophet''s mosque
        ur: مسجدِ نبوی
      correct: true
      why:
        ar: المركز الأول للعبادة والحكم في المصادر
        en: the first centre of worship and rule in the sources
        ur: عبادت اور حکومت کا پہلا مرکز ماخذ میں
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة في مكة لا المدينة
        en: the Kaaba is in Mecca, not Medina
        ur: کعبہ مکہ میں ہے، مدینہ میں نہیں
    - text:
        ar: الأقصى
        en: al-Aqsa
        ur: اقصیٰ
      correct: false
      why:
        ar: الأقصى في القدس
        en: al-Aqsa is in Jerusalem
        ur: اقصیٰ بیت المقدس میں ہے
    - text:
        ar: دار الحكمة
        en: the House of Wisdom
        ur: بیت الحکمت
      correct: false
      why:
        ar: دار الحكمة في بغداد العباسية
        en: the House of Wisdom is Abbasid Baghdad
        ur: بیت الحکمت عباسی بغداد میں ہے
  - q:
      ar: كم بقيت المدينة عاصمة؟
      en: How long did Medina stay the capital?
      ur: مدینہ کتنی دیر دارالحکومت رہا؟
    options:
    - text:
        ar: حتى انتقال المركز إلى الكوفة
        en: until the centre moved to Kufa
        ur: جب تک مرکز کوفہ منتقل ہوا
      correct: true
      why:
        ar: انتقلت العاصمة بعد الخلفاء الأوائل
        en: the capital moved after the first caliphs
        ur: پہلے خلفاء کے بعد دارالحکومت منتقل ہوا
    - text:
        ar: إلى اليوم
        en: to this day
        ur: آج تک
      correct: false
      why:
        ar: انتقل المركز إلى الكوفة ثم دمشق
        en: the centre moved to Kufa then Damascus
        ur: مرکز کوفہ پھر دمشق منتقل ہوا
    - text:
        ar: سنة واحدة
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: دامت عاصمة سنوات لا سنة
        en: it stayed capital for years, not one
        ur: یہ برسوں دارالحکومت رہا، ایک سال نہیں
    - text:
        ar: لم تكن عاصمة أبدًا
        en: it was never capital
        ur: یہ کبھی دارالحکومت نہیں تھا
      correct: false
      why:
        ar: كانت مقرّ الخلفاء الأوائل
        en: it was the first caliphs'' seat
        ur: یہ پہلے خلفاء کی نشست تھی
  - q:
      ar: من سكن المدينة قبل الإسلام؟
      en: Who lived in Medina before Islam?
      ur: اسلام سے پہلے مدینہ میں کون رہتا تھا؟
    options:
    - text:
        ar: قبائل الأوس والخزرج وحلفاء يهود
        en: the Aws and Khazraj tribes with Jewish allies
        ur: اوس اور خزرج قبائل اور یہودی حلیف
      correct: true
      why:
        ar: وصفت المصادر أطرافها قبل الهجرة
        en: the sources describe her parties before the Hijra
        ur: ماخذ ہجرت سے پہلے اس کے فریقوں کا ذکر کرتے ہیں
    - text:
        ar: الرومان
        en: the Romans
        ur: رومی
      correct: false
      why:
        ar: لم يحكم الرومان يثرب
        en: the Romans did not rule Yathrib
        ur: رومیوں نے یثرب پر حکومت نہیں کی
    - text:
        ar: الفرنجة
        en: the Franks
        ur: فرنگی
      correct: false
      why:
        ar: الفرنجة جاءت بعد قرون
        en: the Franks came centuries later
        ur: فرنگی صدیوں بعد آئے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: كان فيها قبائل وزراعة قبل الإسلام
        en: she had tribes and farming before Islam
        ur: اسلام سے پہلے اس میں قبائل اور کھیتی تھی
  - q:
      ar: لماذا هاجر المسلمون إليها؟
      en: Why did the Muslims migrate to her?
      ur: مسلمان اس کی طرف ہجرت کیوں کیے؟
    options:
    - text:
        ar: بدعوة من أهلها ولبناء دولة
        en: by her people''s invitation to build a polity
        ur: اس کے لوگوں کی دعوت پر، ریاست بنانے کے لیے
      correct: true
      why:
        ar: دعاها الأنصار النبي في المصادر
        en: the sources have the Ansar invite the Prophet
        ur: ماخذ میں انصار نے نبی کو بلایا
    - text:
        ar: لأنها كانت أقرب مدينة
        en: because she was the closest city
        ur: کیونکہ یہ قریب ترین شہر تھا
      correct: false
      why:
        ar: لم يكن القرب سبب الاختيار
        en: proximity was not the reason for the choice
        ur: قرب انتخاب کی وجہ نہیں تھا
    - text:
        ar: للتجارة فقط
        en: for trade only
        ur: صرف تجارت کے لیے
      correct: false
      why:
        ar: كان الهدف الدعوة والدولة لا التجارة
        en: the aim was calling and polity, not trade
        ur: مقصد دعوت اور ریاست تھا، تجارت نہیں
    - text:
        ar: لهروب من الحج
        en: to escape the Hajj
        ur: حج سے بچنے کے لیے
      correct: false
      why:
        ar: لم يكن الحج سبب الهجرة
        en: the Hajj was not the migration''s reason
        ur: حج ہجرت کی وجہ نہیں تھا
  - q:
      ar: ماذا خرج من المدينة؟
      en: What went out from Medina?
      ur: مدینہ سے کیا نکلا؟
    options:
    - text:
        ar: السرايا والرسائل والتقويم الهجري
        en: the expeditions, letters and Hijri calendar
        ur: مہمات، خطوط اور ہجری تقویم
      correct: true
      why:
        ar: انطلقت منها الحملات والدعوة والتاريخ
        en: campaigns, calling and the calendar went out from her
        ur: وہاں سے مہمات، دعوت اور تقویم نکلی
    - text:
        ar: الحروب الصليبية
        en: the Crusades
        ur: صلیبی جنگیں
      correct: false
      why:
        ar: الحروب الصليبية من أوروبا لا المدينة
        en: the Crusades came from Europe, not Medina
        ur: صلیبی جنگیں یورپ سے آئیں، مدینہ سے نہیں
    - text:
        ar: الغزو المغولي
        en: the Mongol invasion
        ur: مغل حملہ
      correct: false
      why:
        ar: المغول جاءوا من الشرق بعد قرون
        en: the Mongols came from the east centuries later
        ur: مغل مشرق سے صدیوں بعد آئے
    - text:
        ar: الترجمة العباسية
        en: the Abbasid translation
        ur: عباسی ترجمہ
      correct: false
      why:
        ar: الترجمة في بغداد لا المدينة
        en: translation was in Baghdad, not Medina
        ur: ترجمہ بغداد میں تھا، مدینہ میں نہیں
  - q:
      ar: ما الحرمان؟
      en: What are the two sanctuaries?
      ur: دونوں حرم کیا ہیں؟
    options:
    - text:
        ar: مكة والمدينة معًا
        en: Mecca and Medina together
        ur: مکہ اور مدینہ ایک ساتھ
      correct: true
      why:
        ar: يذكر الاسم الحرمين مكة والمدينة
        en: the name joins Mecca and Medina
        ur: یہ نام مکہ اور مدینہ کو جوڑتا ہے
    - text:
        ar: مكة والقدس
        en: Mecca and Jerusalem
        ur: مکہ اور بیت المقدس
      correct: false
      why:
        ar: الحرمان في الاسم مكة والمدينة
        en: the two sanctuaries named are Mecca and Medina
        ur: نام میں دونوں حرم مکہ اور مدینہ ہیں
    - text:
        ar: الكعبة والأقصى
        en: the Kaaba and al-Aqsa
        ur: کعبہ اور اقصیٰ
      correct: false
      why:
        ar: الحرمان مدينتان لا مسجدان
        en: the two sanctuaries are cities, not mosques
        ur: دونوں حرم شہر ہیں، مسجد نہیں
    - text:
        ar: المدينة ودمشق
        en: Medina and Damascus
        ur: مدینہ اور دمشق
      correct: false
      why:
        ar: دمشق ليست حرمًا في الاسم
        en: Damascus is not a sanctuary in the name
        ur: دمشق نام میں حرم نہیں
  - q:
      ar: أين قبر النبي؟
      en: Where is the Prophet''s grave?
      ur: نبی کی قبر کہاں ہے؟
    options:
    - text:
        ar: في المدينة
        en: in Medina
        ur: مدینہ میں
      correct: true
      why:
        ar: تضمّ المدينة قبره في مسجده
        en: Medina holds his grave in his mosque
        ur: مدینہ میں اس کی مسجد میں قبر ہے
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: توفي ودُفن في المدينة لا مكة
        en: he died and was buried in Medina, not Mecca
        ur: وہ مدینہ میں فوت ہوئے اور دفن ہوئے، مکہ میں نہیں
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: القبر في المدينة لا القدس
        en: the grave is in Medina, not Jerusalem
        ur: قبر مدینہ میں ہے، بیت المقدس میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم ينتقل القبر إلى دمشق
        en: the grave did not move to Damascus
        ur: قبر دمشق منتقل نہیں ہوا
- id: jerusalem
  anchor: place/jerusalem
  band: researchers
  title:
    ar: القدس
    en: Jerusalem
    ur: بیت المقدس
  sixty:
    ar: 'القدس مدينة القبلة الأولى والمسجد الأقصى ثالث الحرمين، ومسرى النبي في الذاكرة الإسلامية. فتحها المسلمون عام ٦٣٧ في عهد عمر، وبنى عبد الملك قبة الصخرة فوق
      الصخرة المقدسة في ٦٩١. احتلها الصليبيون ١٠٩٩ واستعادها صلاح الدين ١١٨٧ بعد حطين، فعادت تحت الحكم الإسلامي حتى العصر العثماني وما بعده. بقيت القدس مركزًا دينيًّا
      للديانات الثلاث معًا: للمسلمين الأقصى والقبة، ولليهود جبل الهيكل، وللمسيحيين كنيسة القيامة.'
    en: 'Jerusalem is the city of the first qibla and al-Aqsa mosque, the third sanctuary, and the Prophet''''s night journey in Muslim memory. Muslims took it in
      637 under Umar, and Abd al-Malik built the Dome of the Rock over the sacred rock in 691. Crusaders seized it in 1099, and Saladin recovered it in 1187 after
      Hattin; it stayed under Islamic rule through the Ottoman era and beyond. Jerusalem remains a religious centre for all three faiths: al-Aqsa and the Dome for
      Muslims, the Temple Mount for Jews, the Church of the Holy Sepulchre for Christians.'
    ur: 'بیت المقدس پہلے قبلہ اور مسجدِ اقصیٰ کا شہر ہے، تیسرا حرم، اور مسلم یادداشت میں نبی کا معراج۔ مسلمانوں نے اسے 637 میں عمر کے دور میں لیا، اور عبدالملک نے
      691 میں مقدس چٹان پر گنبدِ صخرہ بنایا۔ صلیبیوں نے 1099 میں اسے لیا، اور صلاح الدین نے حطین کے بعد 1187 میں واپس لیا؛ یہ عثمانی دور اور اس کے بعد تک اسلامی حکومت
      میں رہی۔ بیت المقدس تینوں دینوں کا مذہبی مرکز ہے: مسلمانوں کے لیے اقصیٰ اور گنبد، یہودیوں کے لیے کوہِ ہیکل، مسیحیوں کے لیے کلیسائے قیامت۔'
  glossary:
  - term:
      ar: الأقصى
      en: al-Aqsa
      ur: اقصیٰ
    gloss:
      ar: المسجد الثالث في الحرمين بعد مكة والمدينة
      en: the third mosque after Mecca''s and Medina''s
      ur: مکہ اور مدینہ کے بعد تیسری مسجد
  - term:
      ar: قبة الصخرة
      en: the Dome of the Rock
      ur: گنبدِ صخرہ
    gloss:
      ar: البناء فوق الصخرة الذي شيّده عبد الملك
      en: the building over the rock Abd al-Malik built
      ur: وہ عمارت جو عبدالملک نے چٹان پر بنائی
  - term:
      ar: القبلة الأولى
      en: the first qibla
      ur: پہلا قبلہ
    gloss:
      ar: اتجاه الصلاة قبل مكة
      en: the prayer direction before Mecca
      ur: مکہ سے پہلے نماز کی سمت
  - term:
      ar: المعراج
      en: the night journey
      ur: معراج
    gloss:
      ar: رحلة النبي في الذاكرة الإسلامية
      en: the Prophet''s journey in Muslim memory
      ur: مسلم یادداشت میں نبی کا سفر
  - term:
      ar: عمر
      en: Umar
      ur: عمر
    gloss:
      ar: الخليفة الذي في عهده فُتحت المدينة
      en: the caliph in whose reign the city was taken
      ur: وہ خلیفہ جس کے دور میں شہر لیا گیا
  - term:
      ar: عبد الملك
      en: Abd al-Malik
      ur: عبدالملک
    gloss:
      ar: الخليفة الأموي الذي بنى القبة
      en: the Umayyad caliph who built the Dome
      ur: وہ اموی خلیفہ جس نے گنبد بنایا
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: معركة ١١٨٧ التي فتحت طريق القدس
      en: the 1187 battle that opened Jerusalem''s road
      ur: 1187 کی جنگ جس نے بیت المقدس کا راستہ کھولا
  - term:
      ar: صلاح الدين
      en: Saladin
      ur: صلاح الدین
    gloss:
      ar: مستعيد المدينة من الصليبيين
      en: the recoverer of the city from the Crusaders
      ur: صلیبیوں سے شہر کا واپس لینے والا
  - term:
      ar: ٦٣٧
      en: '637'
      ur: '637'
    gloss:
      ar: عام الفتح الإسلامي للمدينة
      en: the year of the city''s Islamic conquest
      ur: شہر کی اسلامی فتح کا سال
  - term:
      ar: ١٠٩٩
      en: '1099'
      ur: '1099'
    gloss:
      ar: عام احتلالها الصليبي
      en: the year of its Crusader seizure
      ur: اس کے صلیبی قبضے کا سال
  - term:
      ar: الصخرة
      en: the Rock
      ur: چٹان
    gloss:
      ar: الحجر المقدس الذي قامت عليه القبة
      en: the sacred rock under the Dome
      ur: وہ مقدس چٹان جس پر گنبد ہے
  - term:
      ar: العثمانيون
      en: the Ottomans
      ur: عثمانی
    gloss:
      ar: الحكم الإسلامي الأخير للمدينة قبل الحديث
      en: the city''s last Islamic rule before the modern era
      ur: جدید دور سے پہلے شہر کی آخری اسلامی حکومت
  practice:
  - q:
      ar: ما المسجد الأقصى؟
      en: What is al-Aqsa mosque?
      ur: مسجدِ اقصیٰ کیا ہے؟
    options:
    - text:
        ar: ثالث الحرمين في القدس
        en: the third sanctuary in Jerusalem
        ur: بیت المقدس میں تیسرا حرم
      correct: true
      why:
        ar: يذكر الاسم الأقصى ثالثًا بعد مكة والمدينة
        en: the name ranks it third after Mecca and Medina
        ur: نام اسے مکہ اور مدینہ کے بعد تیسرا رکھتا ہے
    - text:
        ar: أول مسجد في الإسلام
        en: the first mosque in Islam
        ur: اسلام کی پہلی مسجد
      correct: false
      why:
        ar: أول المساجد مسجد قباء والنبوي
        en: the first mosques were Quba and the Prophet''s
        ur: پہلی مسجدیں قباء اور نبوی تھیں
    - text:
        ar: كنيسة مسيحية
        en: a Christian church
        ur: مسیحی کلیسا
      correct: false
      why:
        ar: الأقصى مسجد لا كنيسة
        en: al-Aqsa is a mosque, not a church
        ur: اقصیٰ مسجد ہے، کلیسا نہیں
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: الأقصى بيت عبادة لا سكن
        en: al-Aqsa is a house of worship, not residence
        ur: اقصیٰ عبادت کا گھر ہے، رہائش نہیں
  - q:
      ar: متى فتح المسلمون القدس؟
      en: When did Muslims take Jerusalem?
      ur: مسلمانوں نے بیت المقدس کب لیا؟
    options:
    - text:
        ar: عام ٦٣٧ في عهد عمر
        en: in 637 under Umar
        ur: 637 میں عمر کے دور میں
      correct: true
      why:
        ar: تذكر المصادر تسليم المدينة ٦٣٧
        en: the sources date the city''s surrender to 637
        ur: ماخذ شہر کی سپردگی 637 لکھتے ہیں
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا فتح القدس
        en: that is the Hijra year, not Jerusalem''s taking
        ur: یہ ہجرت کا سال ہے، بیت المقدس کے لینے کا نہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام استعادة صلاح الدين
        en: that is Saladin''s recovery year
        ur: یہ صلاح الدین کی واپسی کا سال ہے
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية
        en: that is Constantinople''s year
        ur: یہ قسطنطنیہ کا سال ہے
  - q:
      ar: من بنى قبة الصخرة؟
      en: Who built the Dome of the Rock?
      ur: گنبدِ صخرہ کس نے بنایا؟
    options:
    - text:
        ar: عبد الملك عام ٦٩١
        en: Abd al-Malik in 691
        ur: عبدالملک نے 691 میں
      correct: true
      why:
        ar: تنسبه المصادر إلى الخليفة الأموي
        en: the sources credit the Umayyad caliph
        ur: ماخذ اسے اموی خلیفہ سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين بعد البناء بخمسة قرون
        en: Saladin came five centuries after the building
        ur: صلاح الدین عمارت سے پانچ صدیوں بعد آیا
    - text:
        ar: المنصور
        en: al-Mansur
        ur: المنصور
      correct: false
      why:
        ar: كان المنصور عباسيًّا مؤسس بغداد
        en: al-Mansur was the Abbasid founder of Baghdad
        ur: المنصور عباسی بانی بغداد تھا
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: هارون خليفة لاحق لا الباني
        en: Harun was a later caliph, not the builder
        ur: ہارون بعد کا خلیفہ تھا، بنانے والا نہیں
  - q:
      ar: متى استعادها المسلمون من الصليبيين؟
      en: When did Muslims recover it from the Crusaders?
      ur: مسلمانوں نے اسے صلیبیوں سے کب واپس لیا؟
    options:
    - text:
        ar: عام ١١٨٧ بعد حطين
        en: in 1187 after Hattin
        ur: 1187 میں حطین کے بعد
      correct: true
      why:
        ar: تذكر المصادر استعادة صلاح الدين بعد المعركة
        en: the sources date Saladin''s recovery after the battle
        ur: ماخذ جنگ کے بعد صلاح الدین کی واپسی لکھتے ہیں
    - text:
        ar: عام ١٠٩٩
        en: in 1099
        ur: 1099 میں
      correct: false
      why:
        ar: ذلك عام احتلالها لا استعادتها
        en: that is the year of its seizure, not recovery
        ur: یہ اس کے قبضے کا سال ہے، واپسی کا نہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا القدس
        en: that is Acre''s fall, not Jerusalem
        ur: یہ عکہ کے گرنے کا سال ہے، بیت المقدس کا نہیں
    - text:
        ar: لم تُستعد أبدًا
        en: it was never recovered
        ur: یہ کبھی واپس نہیں آیا
      correct: false
      why:
        ar: استعادها صلاح الدين في المصادر
        en: the sources have Saladin recover it
        ur: ماخذ میں صلاح الدین نے اسے واپس لیا
  - q:
      ar: ما القبلة الأولى؟
      en: What was the first qibla?
      ur: پہلا قبلہ کیا تھا؟
    options:
    - text:
        ar: القدس قبل التحويل إلى مكة
        en: Jerusalem before the change to Mecca
        ur: مکہ میں تبدیلی سے پہلے بیت المقدس
      correct: true
      why:
        ar: تذكر المصادر الصلاة نحو القدس ثم الكعبة
        en: the sources have prayer toward Jerusalem then the Kaaba
        ur: ماخذ میں نماز بیت المقدس پھر کعبہ کی طرف ہے
    - text:
        ar: مكة منذ البداية
        en: Mecca from the start
        ur: شروع سے مکہ
      correct: false
      why:
        ar: كانت القدس القبلة أولًا
        en: Jerusalem was the qibla first
        ur: بیت المقدس پہلے قبلہ تھا
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة لم تكن قبلة قط
        en: Medina was never the qibla
        ur: مدینہ کبھی قبلہ نہیں تھا
    - text:
        ar: لا قبلة كانت
        en: there was no qibla
        ur: کوئی قبلہ نہیں تھا
      correct: false
      why:
        ar: كانت القبلة إلى القدس ثم مكة
        en: the qibla was to Jerusalem then Mecca
        ur: قبلہ بیت المقدس پھر مکہ تھا
  - q:
      ar: لمن القدس مركز ديني؟
      en: For whom is Jerusalem a religious centre?
      ur: بیت المقدس کس کے لیے مذہبی مرکز ہے؟
    options:
    - text:
        ar: للمسلمين واليهود والمسيحيين معًا
        en: for Muslims, Jews and Christians together
        ur: مسلمانوں، یہودیوں اور مسیحیوں کے لیے، ایک ساتھ
      correct: true
      why:
        ar: يجمع المدينة الأقصى وجبل الهيكل وكنيسة القيامة
        en: it joins al-Aqsa, the Temple Mount and the Sepulchre
        ur: یہ اقصیٰ، کوہِ ہیکل اور قیامت کو جوڑتا ہے
    - text:
        ar: للمسلمين فقط
        en: for Muslims only
        ur: صرف مسلمانوں کے لیے
      correct: false
      why:
        ar: للمدينة مراكز للديانات الثلاث
        en: the city has centres for all three faiths
        ur: شہر میں تینوں دینوں کے مراکز ہیں
    - text:
        ar: للمسيحيين فقط
        en: for Christians only
        ur: صرف مسیحیوں کے لیے
      correct: false
      why:
        ar: للمسلمين واليهود أيضًا مراكز فيها
        en: Muslims and Jews have centres there too
        ur: مسلمانوں اور یہودیوں کے بھی وہاں مراکز ہیں
    - text:
        ar: لأحد؛ مدينة علمانية
        en: for no one; a secular city
        ur: کسی کے لیے نہیں؛ سیکولر شہر
      correct: false
      why:
        ar: القدس من أكثر المدن دينية في التاريخ
        en: Jerusalem is among history''s most religious cities
        ur: بیت المقدس تاریخ کے سب سے مذہبی شہروں میں ہے
  - q:
      ar: كم دامت تحت الحكم الإسلامي؟
      en: How long was it under Islamic rule?
      ur: یہ اسلامی حکومت میں کتنی دیر رہی؟
    options:
    - text:
        ar: من ٦٣٧ حتى العصر العثماني وما بعده
        en: from 637 through the Ottoman era and beyond
        ur: 637 سے عثمانی دور اور اس کے بعد تک
      correct: true
      why:
        ar: بقيت تحت الحكم الإسلامي قرونًا باستثناء الصليبي
        en: it stayed under Islamic rule for centuries but the Crusader gap
        ur: یہ صلیبی وقفے کے علاوہ صدیوں اسلامی حکومت میں رہی
    - text:
        ar: سنة واحدة فقط
        en: only one year
        ur: صرف ایک سال
      correct: false
      why:
        ar: دامت قرونًا لا سنة
        en: it lasted centuries, not a year
        ur: یہ صدیوں رہی، ایک سال نہیں
    - text:
        ar: حتى ١٠٩٩ ثم لم تعد
        en: until 1099 then never again
        ur: 1099 تک پھر کبھی نہیں
      correct: false
      why:
        ar: استعادها المسلمون ١١٨٧ وحكموها قرونًا بعد
        en: Muslims recovered it in 1187 and ruled for centuries more
        ur: مسلمانوں نے 1187 میں واپس لیا اور مزید صدیوں حکومت کی
    - text:
        ar: لم تكن إسلامية أبدًا
        en: it was never Islamic
        ur: یہ کبھی اسلامی نہیں رہی
      correct: false
      why:
        ar: حكمها المسلمون منذ ٦٣٧
        en: Muslims ruled it from 637
        ur: مسلمانوں نے 637 سے اس پر حکومت کی
  - q:
      ar: ما الصخرة؟
      en: What is the Rock?
      ur: چٹان کیا ہے؟
    options:
    - text:
        ar: الحجر المقدس الذي قامت عليه قبة الصخرة
        en: the sacred rock under the Dome of the Rock
        ur: وہ مقدس چٹان جس پر گنبدِ صخرہ ہے
      correct: true
      why:
        ar: بنى عبد الملك القبة فوقها
        en: Abd al-Malik built the Dome over it
        ur: عبدالملک نے اس پر گنبد بنایا
    - text:
        ar: جبل قرب مكة
        en: a mountain near Mecca
        ur: مکہ کے قریب پہاڑ
      correct: false
      why:
        ar: الصخرة في القدس لا مكة
        en: the Rock is in Jerusalem, not Mecca
        ur: چٹان بیت المقدس میں ہے، مکہ میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: الصخرة حجر ديني لا قلعة
        en: the Rock is a sacred stone, not a castle
        ur: چٹان مقدس پتھر ہے، قلعہ نہیں
    - text:
        ar: سوق القدس
        en: Jerusalem''s market
        ur: بیت المقدس کا بازار
      correct: false
      why:
        ar: الصخرة مكان ديني لا سوق
        en: the Rock is a sacred place, not a market
        ur: چٹان مقدس جگہ ہے، بازار نہیں
  - q:
      ar: من كتب عن القدس؟
      en: Who wrote about Jerusalem?
      ur: بیت المقدس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون وجغرافيون من كلّ الحضارات
        en: historians and geographers of every civilization
        ur: ہر تہذیب کے مؤرخین اور جغرافیہ دان
      correct: true
      why:
        ar: تصلنا وصفها من المصادر الإسلامية والأوروبية واليهودية
        en: accounts reach us from Islamic, European and Jewish sources
        ur: اسلامی، یورپی اور یہودی ماخذ سے اس کی وصف پہنچی
    - text:
        ar: المسلمون فقط
        en: only Muslims
        ur: صرف مسلمان
      correct: false
      why:
        ar: كتب عنها كلّ الأديان والحضارات
        en: every faith and civilization wrote of her
        ur: ہر دین اور تہذیب نے اس کے بارے میں لکھا
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها قبل أوروبا بقرون
        en: Muslims wrote of her centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: القدس من أكثر المدن تدوينًا
        en: Jerusalem is among the most-written cities
        ur: بیت المقدس سب سے زیادہ لکھے جانے والے شہروں میں ہے
  - q:
      ar: في عهد أيّ خلافة بُنيت قبة الصخرة؟
      en: Under which caliphate was the Dome built?
      ur: گنبدِ صخرہ کس خلافت میں بنی؟
    options:
    - text:
        ar: الأموية
        en: the Umayyad
        ur: اموی
      correct: true
      why:
        ar: كان عبد الملك أمويًّا دمشقيًّا
        en: Abd al-Malik was Umayyad, of Damascus
        ur: عبدالملک اموی تھا، دمشق کا
    - text:
        ar: العباسية
        en: the Abbasid
        ur: عباسی
      correct: false
      why:
        ar: كان عبد الملك قبل العباسيين
        en: Abd al-Malik predates the Abbasids
        ur: عبدالملک عباسیوں سے پہلے تھا
    - text:
        ar: العثمانية
        en: the Ottoman
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون جاءوا بعد ثمانية قرون
        en: the Ottomans came eight centuries later
        ur: عثمانی آٹھ صدیوں بعد آئے
    - text:
        ar: المملوكية
        en: the Mamluk
        ur: مملوکی
      correct: false
      why:
        ar: المماليك حكموا مصر والشام لاحقًا
        en: the Mamluks ruled Egypt and Syria later
        ur: مملوکوں نے مصر اور شام پر بعد میں حکومت کی
- id: cordoba
  anchor: place/cordoba
  band: researchers
  title:
    ar: قرطبة
    en: Cordoba
    ur: قرطہ
  sixty:
    ar: 'قرطبة عاصمة الأندلس ومدينة الجامع الكبير، أعظم حواضر أوروبا في القرن العاشر. حكمها الأمويون الهاربون من دمشق فأقاموا فيها إمارة ثم خلافة، وجعلها عبد الرحمن
      الثالث لؤلؤة الغرب الإسلامي: مكتبة الحكم الثاني بمئات الآلاف من المجلدات، ومدينة الزهراء التي بناها للخلافة، ومدارس الطب والفلك والفقه. تفككت خلافتها في فتنة
      ١٠٣١، فصارت ملوك الطوائف ثم المرابطين والموحدين حتى سقطت للنصارى ١٢٣٦. بقيت قرطبة رمز الأندلس: ذروة تلاقت فيها الحضارات على ضفاف الوادي الكبير.'
    en: 'Cordoba is the capital of al-Andalus and the city of the Great Mosque, the greatest urban centre in tenth-century Europe. The Umayyads who escaped Damascus
      ruled it, setting up first an emirate then a caliphate, and Abd al-Rahman III made it the jewel of the Islamic west: al-Hakam II''''s library of hundreds of
      thousands of volumes, the city of Madinat al-Zahra he built for the caliphate, and schools of medicine, astronomy and law. Its caliphate broke apart in the
      fitna of 1031 into taifa kingdoms, then Almoravids and Almohads, until it fell to the Christians in 1236. Cordoba remains the emblem of al-Andalus: a peak where
      civilizations met on the banks of the Guadalquivir.'
    ur: 'قرطہ اندلس کا دارالحکومت اور عظیم مسجد کا شہر ہے، دسویں صدی کے یورپ کا سب سے بڑا شہری مرکز۔ دمشق سے بچ نکلنے والے امویوں نے اس پر حکومت کی، پہلے امارت پھر
      خلافت قائم کر کے، اور عبدالرحمن ثالث نے اسے اسلامی مغرب کا جواہر بنایا: حکم دوم کی لاکھوں جلدوں کی لائبریری، خلافت کے لیے بنایا گیا شہر مدینۃ الزہرا، اور طب،
      فلکیات اور فقہ کے مکاتب۔ اس کی خلافت 1031 کی فتنے میں ٹوٹ کر طائفہ بادشاہیوں، پھر مرابطین اور موحدین میں بٹ گئی، جب تک کہ 1236 میں مسیحیوں کے ہاتھ گری۔ قرطہ
      اندلس کی علامت ہے: وہ بلندی جہاں تہذیبیں وادی الکبیر کے کنارے ملی تھیں۔'
  glossary:
  - term:
      ar: الأندلس
      en: al-Andalus
      ur: اندلس
    gloss:
      ar: الاسم الإسلامي لشبه الجزيرة
      en: the Islamic name for the peninsula
      ur: جزیرہ نما کا اسلامی نام
  - term:
      ar: الجامع الكبير
      en: the Great Mosque
      ur: عظیم مسجد
    gloss:
      ar: أشهر بناء في قرطبة
      en: Cordoba''s most famous building
      ur: قرطہ کی سب سے مشہور عمارت
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: السلالة التي حكمت قرطبة
      en: the dynasty that ruled Cordoba
      ur: وہ خاندان جس نے قرطہ پر حکومت کی
  - term:
      ar: عبد الرحمن الثالث
      en: Abd al-Rahman III
      ur: عبدالرحمن ثالث
    gloss:
      ar: معلن الخلافة في قرطبة
      en: the one who declared the caliphate in Cordoba
      ur: قرطہ میں خلافت کا اعلان کرنے والا
  - term:
      ar: الحكم الثاني
      en: al-Hakam II
      ur: حکم دوم
    gloss:
      ar: صاحب المكتبة العظيمة
      en: the owner of the great library
      ur: عظیم لائبریری کا مالک
  - term:
      ar: مدينة الزهراء
      en: Madinat al-Zahra
      ur: مدینۃ الزہرا
    gloss:
      ar: المدينة التي بناها للخلافة
      en: the city he built for the caliphate
      ur: وہ شہر جو اس نے خلافت کے لیے بنایا
  - term:
      ar: الفتنة
      en: the fitna
      ur: فتنہ
    gloss:
      ar: الحرب الأهلية التي فككت الخلافة ١٠٣١
      en: the civil war that broke the caliphate in 1031
      ur: وہ خانہ جنگی جس نے 1031 میں خلافت توڑی
  - term:
      ar: ملوك الطوائف
      en: the taifa kings
      ur: طائفہ بادشاہ
    gloss:
      ar: الحكام الصغار بعد الخلافة
      en: the small rulers after the caliphate
      ur: خلافت کے بعد چھوٹے حکمران
  - term:
      ar: المرابطون
      en: the Almoravids
      ur: مرابطین
    gloss:
      ar: السلالة التي جاءت من المغرب بعد الطوائف
      en: the dynasty from Morocco after the taifas
      ur: طائفوں کے بعد مراکش سے آیا خاندان
  - term:
      ar: الموحدون
      en: the Almohads
      ur: موحدین
    gloss:
      ar: السلالة التي تلت المرابطين
      en: the dynasty that followed the Almoravids
      ur: وہ خاندان جو مرابطین کے بعد آیا
  - term:
      ar: ١٢٣٦
      en: '1236'
      ur: '1236'
    gloss:
      ar: عام سقوطها للنصارى
      en: the year she fell to the Christians
      ur: اس کے مسیحیوں کے ہاتھ گرنے کا سال
  - term:
      ar: الوادي الكبير
      en: the Guadalquivir
      ur: وادی الکبیر
    gloss:
      ar: النهر الذي قامت عليه قرطبة
      en: the river Cordoba stands on
      ur: وہ دریا جس پر قرطہ قائم ہے
  practice:
  - q:
      ar: ما أشهر بناء في قرطبة؟
      en: What is Cordoba''s most famous building?
      ur: قرطہ کی سب سے مشہور عمارت کیا ہے؟
    options:
    - text:
        ar: الجامع الكبير
        en: the Great Mosque
        ur: عظیم مسجد
      correct: true
      why:
        ar: يذكر الاسم الجامع الكبير أشهر معالمها
        en: the Great Mosque is her best-known landmark
        ur: عظیم مسجد اس کی سب سے مشہور نشانی ہے
    - text:
        ar: قصر الحمراء
        en: the Alhambra
        ur: الحمرا محل
      correct: false
      why:
        ar: الحمراء في غرناطة لا قرطبة
        en: the Alhambra is in Granada, not Cordoba
        ur: الحمرا غرناطہ میں ہے، قرطہ میں نہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: قبة الصخرة في القدس
        en: the Dome of the Rock is in Jerusalem
        ur: گنبدِ صخرہ بیت المقدس میں ہے
    - text:
        ar: دار الحكمة
        en: the House of Wisdom
        ur: بیت الحکمت
      correct: false
      why:
        ar: دار الحكمة في بغداد
        en: the House of Wisdom is in Baghdad
        ur: بیت الحکمت بغداد میں ہے
  - q:
      ar: من حكم قرطبة أولًا؟
      en: Who ruled Cordoba first?
      ur: قرطہ پر پہلے کس نے حکومت کی؟
    options:
    - text:
        ar: الأمويون الهاربون من دمشق
        en: the Umayyads who escaped Damascus
        ur: دمشق سے بچ نکلنے والے اموی
      correct: true
      why:
        ar: أقاموا إمارة ثم خلافة فيها
        en: they set up an emirate then a caliphate there
        ur: انہوں نے وہاں امارت پھر خلافت قائم کی
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون حكموا بغداد لا قرطبة
        en: the Abbasids ruled Baghdad, not Cordoba
        ur: عباسیوں نے بغداد پر حکومت کی، قرطہ نہیں
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون جاءوا بعد قرون في الشرق
        en: the Ottomans came centuries later in the east
        ur: عثمانی مشرق میں صدیوں بعد آئے
    - text:
        ar: الفرنجة
        en: the Franks
        ur: فرنگی
      correct: false
      why:
        ar: الفرنجة لم يحكموا الأندلس
        en: the Franks did not rule al-Andalus
        ur: فرنگیوں نے اندلس پر حکومت نہیں کی
  - q:
      ar: متى سقطت قرطبة للنصارى؟
      en: When did Cordoba fall to the Christians?
      ur: قرطہ مسیحیوں کے ہاتھ کب گرا؟
    options:
    - text:
        ar: عام ١٢٣٦
        en: in 1236
        ur: 1236 میں
      correct: true
      why:
        ar: تذكر المصادر استيلاء النصارى ١٢٣٦
        en: the sources date the Christian capture to 1236
        ur: ماخذ مسیحی قبضہ 1236 لکھتے ہیں
    - text:
        ar: عام ١٠٩٩
        en: in 1099
        ur: 1099 میں
      correct: false
      why:
        ar: ذلك عام احتلال القدس لا سقوط قرطبة
        en: that is Jerusalem''s seizure, not Cordoba''s fall
        ur: یہ بیت المقدس کے قبضے کا سال ہے، قرطہ کے گرنے کا نہیں
    - text:
        ar: عام ١٠٣١
        en: in 1031
        ur: 1031 میں
      correct: false
      why:
        ar: ذلك عام الفتنة لا السقوط
        en: that is the fitna year, not the fall
        ur: یہ فتنے کا سال ہے، گرنے کا نہیں
    - text:
        ar: لم تسقط أبدًا
        en: it never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت للنصارى في ١٢٣٦
        en: she fell to the Christians in 1236
        ur: یہ 1236 میں مسیحیوں کے ہاتھ گرا
  - q:
      ar: ما مدينة الزهراء؟
      en: What is Madinat al-Zahra?
      ur: مدینۃ الزہرا کیا ہے؟
    options:
    - text:
        ar: المدينة التي بناها عبد الرحمن الثالث للخلافة
        en: the city Abd al-Rahman III built for the caliphate
        ur: وہ شہر جو عبدالرحمن ثالث نے خلافت کے لیے بنایا
      correct: true
      why:
        ar: تذكر المصادر بناءها قرب قرطبة
        en: the sources record her building near Cordoba
        ur: ماخذ قرطہ کے قریب اس کی تعمیر کا ذکر کرتے ہیں
    - text:
        ar: مدينة في مصر
        en: a city in Egypt
        ur: مصر کا شہر
      correct: false
      why:
        ar: الزهراء في الأندلس لا مصر
        en: al-Zahra is in al-Andalus, not Egypt
        ur: الزہرا اندلس میں ہے، مصر میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: الزهراء مدينة خلافة لا قلعة
        en: al-Zahra is a caliphate city, not a castle
        ur: الزہرا خلافت کا شہر ہے، قلعہ نہیں
    - text:
        ar: ميناء على المتوسط
        en: a Mediterranean port
        ur: بحیرہ روم کی بندرگاہ
      correct: false
      why:
        ar: الزهراء داخلية قرب قرطبة
        en: al-Zahra is inland near Cordoba
        ur: الزہرا قرطہ کے قریب اندرونی ہے
  - q:
      ar: ما فتنة ١٠٣١؟
      en: What was the fitna of 1031?
      ur: 1031 کا فتنہ کیا تھا؟
    options:
    - text:
        ar: الحرب الأهلية التي فككت الخلافة
        en: the civil war that broke the caliphate
        ur: وہ خانہ جنگی جس نے خلافت توڑی
      correct: true
      why:
        ar: انتهت الخلافة فيها إلى ملوك الطوائف
        en: the caliphate ended in it into taifa kings
        ur: اس میں خلافت ختم ہو کر طائفہ بادشاہیوں میں بٹ گئی
    - text:
        ar: غزو أجنبي
        en: a foreign invasion
        ur: غیر ملکی حملہ
      correct: false
      why:
        ar: كانت فتنة داخلية لا غزوًا
        en: it was internal strife, not invasion
        ur: یہ اندرونی فتنہ تھا، حملہ نہیں
    - text:
        ar: ثورة عبيد
        en: a slave revolt
        ur: غلاموں کی بغاوت
      correct: false
      why:
        ar: الفتنة صراع على الحكم لا ثورة عبيد
        en: the fitna was a struggle for rule, not a slave revolt
        ur: فتنہ حکمرانی پر تنازعہ تھا، غلاموں کی بغاوت نہیں
    - text:
        ar: وباء
        en: a plague
        ur: طاعون
      correct: false
      why:
        ar: الفتنة سياسية لا وبائية
        en: the fitna was political, not epidemic
        ur: فتنہ سیاسی تھا، وبائی نہیں
  - q:
      ar: كم كان في مكتبة الحكم الثاني؟
      en: How large was al-Hakam II''s library?
      ur: حکم دوم کی لائبریری کتنی بڑی تھی؟
    options:
    - text:
        ar: مئات الآلاف من المجلدات
        en: hundreds of thousands of volumes
        ur: لاکھوں جلدیں
      correct: true
      why:
        ar: تذكر المصادر عددًا قريبًا من أربعمائة ألف
        en: the sources give a number near four hundred thousand
        ur: ماخذ چار لاکھ کے قریب تعداد دیتے ہیں
    - text:
        ar: مائة كتاب
        en: a hundred books
        ur: سو کتابیں
      correct: false
      why:
        ar: مائة مكتبة بيت لا خلافة
        en: a hundred is a house library, not a caliphate''s
        ur: سو گھر کی لائبریری ہے، خلافت کی نہیں
    - text:
        ar: عشرة ملايين
        en: ten million
        ur: ایک کروڑ
      correct: false
      why:
        ar: عشرة ملايين تتجاوز ما سجلته المصادر
        en: ten million exceeds what the sources record
        ur: ایک کروڑ ماخذ کے درج سے زیادہ ہے
    - text:
        ar: لا مكتبة كانت
        en: there was no library
        ur: کوئی لائبریری نہیں تھی
      correct: false
      why:
        ar: مكتبة الحكم من أشهر المكتبات في التاريخ
        en: al-Hakam''s library is among history''s most famous
        ur: حکم کی لائبریری تاریخ کی مشہور ترین میں ہے
  - q:
      ar: لماذا اشتهرت قرطبة؟
      en: Why is Cordoba famous?
      ur: قرطہ کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت أعظم حواضر أوروبا في القرن العاشر
        en: because she was Europe''s greatest centre in the tenth century
        ur: کیونکہ یہ دسویں صدی میں یورپ کا سب سے بڑا مرکز تھا
      correct: true
      why:
        ar: جمعت العلم والعمارة والتجارة في ذروة
        en: she gathered learning, architecture and trade at a peak
        ur: اس نے علم، معماری اور تجارت کو بلندی پر جمع کیا
    - text:
        ar: لأنها كانت عاصمة الرومان دائمًا
        en: because she was always the Roman capital
        ur: کیونکہ یہ ہمیشہ رومی دارالحکومت تھا
      correct: false
      why:
        ar: لم تكن عاصمة روما قط
        en: she was never Rome''s capital
        ur: یہ کبھی روم کا دارالحکومت نہیں تھا
    - text:
        ar: لأنها على المحيط
        en: because she is on the ocean
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: قرطبة داخلية على نهر لا محيط
        en: Cordoba is inland on a river, not ocean
        ur: قرطہ اندرونِ ملک دریا پر ہے، سمندر پر نہیں
    - text:
        ar: لأنها لم تسقط
        en: because she never fell
        ur: کیونکہ یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت في ١٢٣٦
        en: she fell in 1236
        ur: یہ 1236 میں گرا
  - q:
      ar: من جاء بعد الخلافة؟
      en: Who came after the caliphate?
      ur: خلافت کے بعد کون آیا؟
    options:
    - text:
        ar: ملوك الطوائف ثم المرابطون والموحدون
        en: the taifa kings, then Almoravids and Almohads
        ur: طائفہ بادشاہ، پھر مرابطین اور موحدین
      correct: true
      why:
        ar: تفككت الخلافة إلى طوائف ثم دول المغرب
        en: the caliphate broke into taifas then Moroccan states
        ur: خلافت طائفوں میں پھر مراکشی ریاستوں میں ٹوٹی
    - text:
        ar: العباسيون مباشرة
        en: the Abbasids right away
        ur: فوراً عباسی
      correct: false
      why:
        ar: العباسيون حكموا بغداد لا الأندلس
        en: the Abbasids ruled Baghdad, not al-Andalus
        ur: عباسیوں نے بغداد پر حکومت کی، اندلس نہیں
    - text:
        ar: النصارى فورًا
        en: the Christians immediately
        ur: فوراً مسیحی
      correct: false
      why:
        ar: دامت الطوائف والمغاربة قرونًا قبل السقوط
        en: taifas and Moroccan states lasted centuries before the fall
        ur: طائفے اور مراکشی صدیوں رہے، گرنے سے پہلے
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون لم يصلوا إلى الأندلس
        en: the Ottomans never reached al-Andalus
        ur: عثمانی اندلس تک نہیں پہنچے
  - q:
      ar: على أيّ نهر قامت قرطبة؟
      en: On which river does Cordoba stand?
      ur: قرطہ کس دریا پر قائم ہے؟
    options:
    - text:
        ar: الوادي الكبير
        en: the Guadalquivir
        ur: وادی الکبیر
      correct: true
      why:
        ar: تقف المدينة على الوادي الكبير في المصادر
        en: the sources place her on the Guadalquivir
        ur: ماخذ اسے وادی الکبیر پر رکھتے ہیں
    - text:
        ar: النيل
        en: the Nile
        ur: نیل
      correct: false
      why:
        ar: النيل في مصر لا الأندلس
        en: the Nile is in Egypt, not al-Andalus
        ur: نیل مصر میں ہے، اندلس میں نہیں
    - text:
        ar: دجلة
        en: the Tigris
        ur: دجلہ
      correct: false
      why:
        ar: دجلة في العراق لا الأندلس
        en: the Tigris is in Iraq, not al-Andalus
        ur: دجلہ عراق میں ہے، اندلس میں نہیں
    - text:
        ar: الدانوب
        en: the Danube
        ur: ڈینیوب
      correct: false
      why:
        ar: الدانوب في أوروبا الشرقية لا إسبانيا
        en: the Danube is in eastern Europe, not Spain
        ur: ڈینیوب مشرقی یورپ میں ہے، سپین میں نہیں
  - q:
      ar: ماذا بقي من قرطبة؟
      en: What remains of Cordoba?
      ur: قرطہ سے کیا باقی ہے؟
    options:
    - text:
        ar: رمز تلاقي الحضارات في الأندلس
        en: the emblem of civilizations meeting in al-Andalus
        ur: اندلس میں تہذیبوں کے ملنے کی علامت
      correct: true
      why:
        ar: بقيت ذاكرتها ذروة التلاقي في المصادر
        en: her memory stays a peak of meeting in the sources
        ur: اس کی یادداشت ماخذ میں ملنے کی بلندی رہی
    - text:
        ar: لا شيء؛ هُدمت كلها
        en: nothing; it was all demolished
        ur: کچھ نہیں؛ سب مسمار کر دیا گیا
      correct: false
      why:
        ar: بقي جامعها ومعالمها وذاكرتها
        en: her mosque, landmarks and memory remain
        ur: اس کی مسجد، نشانیاں اور یادداشت باقی ہیں
    - text:
        ar: عاصمة حديثة
        en: a modern capital
        ur: جدید دارالحکومت
      correct: false
      why:
        ar: قرطبة مدينة حالية لا عاصمة
        en: Cordoba is a living city, not a capital
        ur: قرطہ ایک زندہ شہر ہے، دارالحکومت نہیں
    - text:
        ar: متحف مغلق فقط
        en: only a closed museum
        ur: صرف ایک بند عجائب گھر
      correct: false
      why:
        ar: المدينة حية بمعالمها الإسلامية
        en: the city lives with its Islamic landmarks
        ur: شہر اپنی اسلامی نشانیوں کے ساتھ زندہ ہے
- id: timbuktu
  anchor: place/timbuktu
  band: researchers
  title:
    ar: تمبكتو
    en: Timbuktu
    ur: تمبکٹو
  sixty:
    ar: 'تمبكتو مدينة الملح والذهب والكتب على حافة الصحراء الكبرى في مالي: ميناء القوافل الصحراوية التي حملت الملح من الشمال والذهب من الجنوب. بلغت ذروتها في القرنين
      الرابع عشر والخامس عشر حين حجّ مانسا موسى منها وبنى مسجد جنكربر، فصارت جامعة أفريقيا الغربية: سبعمائة ألف مخطوط في خزائن الأسر ومساجد سنكور وجنكربر وسيدي يحيى.
      حكمها المغربيون عام ١٥٩١ فنقلوا علماءها إلى مراكش، وبقيت كتبها في الصحراء حتى أنقذها أهلها من التهريب والحرب. تمبكتو اليوم شاهد على أنّ الحرف الإسلامي وصل إلى
      أعماق أفريقيا.'
    en: 'Timbuktu is the city of salt, gold and books on the edge of the Sahara in Mali: the port of the desert caravans that carried salt from the north and gold
      from the south. It peaked in the fourteenth and fifteenth centuries, when Mansa Musa made his Hajj from it and built the Djinguereber mosque; it became West
      Africa''''s university — seven hundred thousand manuscripts in family collections and the Sankore, Djinguereber and Sidi Yahya mosques. The Moroccans took it
      in 1591 and carried its scholars off to Marrakesh, but its books stayed in the desert until its people saved them from smuggling and war. Timbuktu today bears
      witness that the Islamic written word reached the depths of Africa.'
    ur: 'تمبکٹو مالی میں صحرائے کبیر کے کنارے نمک، سونے اور کتابوں کا شہر ہے: صحرائی قافلوں کی بندرگاہ جو شمال سے نمک اور جنوب سے سونہ لے کر آتے تھے۔ یہ چودہویں اور
      پندرہویں صدی میں عروج پر رہا، جب مانسا موسی نے یہاں سے حج کیا اور جنگربر مسجد بنائی؛ یہ مغربی افریقہ کا جامعہ بن گیا — خاندانی خزانوں میں سات لاکھ مخطوطے اور
      سنکور، جنگربر اور سیدی یحییٰ کی مسجدیں۔ مراکشیوں نے 1591 میں اسے لیا اور اس کے علماء کو مراکش لے گئے، مگر اس کی کتابیں صحرا میں رہیں جب تک کہ اس کے لوگوں نے
      انہیں اسمگلنگ اور جنگ سے بچا لیا۔ تمبکٹو آج گواہ ہے کہ اسلامی تحریر افریقہ کی گہرائیوں تک پہنچی تھی۔'
  glossary:
  - term:
      ar: مالي
      en: Mali
      ur: مالی
    gloss:
      ar: البلد الأفريقي الذي فيه تمبكتو
      en: the African country holding Timbuktu
      ur: وہ افریقی ملک جس میں تمبکٹو ہے
  - term:
      ar: الصحراء الكبرى
      en: the Sahara
      ur: صحرائے کبیر
    gloss:
      ar: الصحراء التي على حافتها المدينة
      en: the desert on whose edge the city stands
      ur: وہ صحرا جس کے کنارے شہر ہے
  - term:
      ar: الملح
      en: the salt
      ur: نمک
    gloss:
      ar: بضاعة الشمال التي حملتها القوافل
      en: the northern goods the caravans carried
      ur: شمال کا وہ سامان جو قافلے لاتے تھے
  - term:
      ar: الذهب
      en: the gold
      ur: سونا
    gloss:
      ar: ثروة الجنوب التي جعلتها غنية
      en: the southern wealth that made her rich
      ur: جنوب کی وہ دولت جس نے اسے امیر کیا
  - term:
      ar: مانسا موسى
      en: Mansa Musa
      ur: مانسا موسی
    gloss:
      ar: الملك الذي حجّ منها وبنى مسجدها
      en: the king who made Hajj from her and built her mosque
      ur: وہ بادشاہ جس نے یہاں سے حج کیا اور مسجد بنائی
  - term:
      ar: جنگربر
      en: Djinguereber
      ur: جنگربر
    gloss:
      ar: مسجدها الأشهر الذي بناه مانسا موسى
      en: her most famous mosque, built by Mansa Musa
      ur: اس کی سب سے مشہور مسجد جو مانسا موسی نے بنائی
  - term:
      ar: سنكور
      en: Sankore
      ur: سنکور
    gloss:
      ar: مسجدها وجامعتها الأكبر
      en: her mosque and greatest university
      ur: اس کی مسجد اور سب سے بڑا جامعہ
  - term:
      ar: المخطوطات
      en: the manuscripts
      ur: مخطوطے
    gloss:
      ar: سبعمائة ألف كتاب في خزائن الأسر
      en: seven hundred thousand books in family collections
      ur: خاندانی خزانوں میں سات لاکھ کتابیں
  - term:
      ar: مراكش
      en: Marrakesh
      ur: مراکش
    gloss:
      ar: المدينة التي نُقل إليها علماؤها
      en: the city her scholars were carried to
      ur: وہ شہر جہاں اس کے علماء لے جائے گئے
  - term:
      ar: ١٥٩١
      en: '1591'
      ur: '1591'
    gloss:
      ar: عام استيلاء المغرب عليها
      en: the year Morocco seized her
      ur: اس کے مراکشی قبضے کا سال
  - term:
      ar: القوافل
      en: the caravans
      ur: قافلے
    gloss:
      ar: طرق التجارة الصحراوية
      en: the desert trade roads
      ur: صحرائی تجارتی راہیں
  - term:
      ar: الأسر
      en: the families
      ur: خاندان
    gloss:
      ar: من حفظ المخطوطات في بيوتهم
      en: those who kept the manuscripts in their homes
      ur: وہ جنہوں نے اپنے گھروں میں مخطوطے محفوظ کیے
  practice:
  - q:
      ar: أين تقع تمبكتو؟
      en: Where is Timbuktu?
      ur: تمبکٹو کہاں ہے؟
    options:
    - text:
        ar: على حافة الصحراء الكبرى في مالي
        en: on the Sahara''s edge in Mali
        ur: مالی میں صحرائے کبیر کے کنارے
      correct: true
      why:
        ar: تقف المدينة شمال النيجر على طريق القوافل
        en: the city stands north of the Niger on the caravan road
        ur: شہر نائجر کے شمال میں قافلہ راہ پر ہے
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: تمبكتو في غرب أفريقيا لا مصر
        en: Timbuktu is in West Africa, not Egypt
        ur: تمبکٹو مغربی افریقہ میں ہے، مصر میں نہیں
    - text:
        ar: في الجزيرة العربية
        en: in Arabia
        ur: جزیرۃ العرب میں
      correct: false
      why:
        ar: هي في أفريقيا لا الجزيرة
        en: she is in Africa, not Arabia
        ur: یہ افریقہ میں ہے، جزیرے میں نہیں
    - text:
        ar: في الهند
        en: in India
        ur: ہندوستان میں
      correct: false
      why:
        ar: بعيدة عن الهند في غرب أفريقيا
        en: far from India, in West Africa
        ur: ہندوستان سے دور، مغربی افریقہ میں
  - q:
      ar: ماذا حملت قوافل تمبكتو؟
      en: What did Timbuktu''s caravans carry?
      ur: تمبکٹو کے قافلے کیا لے کر آتے تھے؟
    options:
    - text:
        ar: الملح من الشمال والذهب من الجنوب
        en: salt from the north and gold from the south
        ur: شمال سے نمک اور جنوب سے سونا
      correct: true
      why:
        ar: جمعت طريقها بين مناجم الملح ومناجم الذهب
        en: her road joined the salt mines to the gold fields
        ur: اس کی راہ نے نمک کی کانوں کو سونے کی کانوں سے جوڑا
    - text:
        ar: الحرير من الصين
        en: silk from China
        ur: چین سے ریشم
      correct: false
      why:
        ar: كان بضاعتها الملح والذهب لا الحرير
        en: her goods were salt and gold, not silk
        ur: اس کا سامان نمک اور سونا تھا، ریشم نہیں
    - text:
        ar: النفط
        en: oil
        ur: تیل
      correct: false
      why:
        ar: لم يكن النفط تجارة القوافل
        en: oil was not the caravans'' goods
        ur: تیل قافلوں کا سامان نہیں تھا
    - text:
        ar: الكتب من أوروبا
        en: books from Europe
        ur: یورپ سے کتابیں
      correct: false
      why:
        ar: كانت كتبها محلية التأليف لا مستوردة
        en: her books were locally authored, not imported
        ur: اس کی کتابیں مقامی تصنیف تھیں، درآمدہ نہیں
  - q:
      ar: من بنى مسجد جنكربر؟
      en: Who built the Djinguereber mosque?
      ur: جنگربر مسجد کس نے بنائی؟
    options:
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسی
      correct: true
      why:
        ar: تنسب المصادر بناءه إلى الملك الحاج
        en: the sources credit the pilgrim king
        ur: ماخذ اسے حاجی بادشاہ سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين في مصر والشام لا مالي
        en: Saladin was in Egypt and Syria, not Mali
        ur: صلاح الدین مصر اور شام میں تھا، مالی میں نہیں
    - text:
        ar: عبد الرحمن الثالث
        en: Abd al-Rahman III
        ur: عبدالرحمن ثالث
      correct: false
      why:
        ar: كان في الأندلس لا أفريقيا الغربية
        en: he was in al-Andalus, not West Africa
        ur: وہ اندلس میں تھا، مغربی افریقہ میں نہیں
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: كان هولاكو مغوليًّا مدمرًا لا بانيًا
        en: Hulagu was a Mongol destroyer, not a builder
        ur: ہلاکو مغل تباہ کن تھا، بنانے والا نہیں
  - q:
      ar: كم مخطوطًا في تمبكتو؟
      en: How many manuscripts in Timbuktu?
      ur: تمبکٹو میں کتنے مخطوطے ہیں؟
    options:
    - text:
        ar: نحو سبعمائة ألف
        en: about seven hundred thousand
        ur: تقریباً سات لاکھ
      correct: true
      why:
        ar: تذكر المصادر هذا العدد في خزائن الأسر
        en: the sources give this count in family collections
        ur: ماخذ خاندانی خزانوں میں یہی تعداد دیتے ہیں
    - text:
        ar: مائة
        en: a hundred
        ur: سو
      correct: false
      why:
        ar: مائة مكتبة صغيرة لا جامعة
        en: a hundred is a small library, not a university
        ur: سو ایک چھوٹی لائبریری ہے، جامعہ نہیں
    - text:
        ar: مليار
        en: a billion
        ur: ایک ارب
      correct: false
      why:
        ar: مليار يتجاوز ما سجلته المصادر
        en: a billion exceeds what the sources record
        ur: ایک ارب ماخذ کے درج سے زیادہ ہے
    - text:
        ar: لا مخطوطات
        en: no manuscripts
        ur: کوئی مخطوطے نہیں
      correct: false
      why:
        ar: تعد مكتبتها من أعظم مكتبات أفريقيا
        en: her library is among Africa''s greatest
        ur: اس کی لائبریری افریقہ کی عظیم ترین میں شمار ہوتی ہے
  - q:
      ar: ماذا حدث عام ١٥٩١؟
      en: What happened in 1591?
      ur: 1591 میں کیا ہوا؟
    options:
    - text:
        ar: استولى المغرب على تمبكتو
        en: Morocco seized Timbuktu
        ur: مراکش نے تمبکٹو پر قبضہ کیا
      correct: true
      why:
        ar: نقلوا علماءها إلى مراكش في المصادر
        en: the sources have her scholars carried to Marrakesh
        ur: ماخذ میں اس کے علماء مراکش لے جائے گئے
    - text:
        ar: بنى مانسا موسى المسجد
        en: Mansa Musa built the mosque
        ur: مانسا موسی نے مسجد بنائی
      correct: false
      why:
        ar: كان البناء قبل قرنين
        en: the building was two centuries earlier
        ur: تعمیر دو صدیاں پہلے ہوئی تھی
    - text:
        ar: وصل الأوروبيون أول مرة
        en: Europeans arrived for the first time
        ur: یورپی پہلی بار پہنچے
      correct: false
      why:
        ar: كان الأوروبيون قد وصلوا قبل ذلك
        en: Europeans had reached her earlier
        ur: یورپی پہلے پہنچ چکے تھے
    - text:
        ar: انتهت التجارة نهائيًّا
        en: trade ended forever
        ur: تجارت ہمیشہ کے لیے ختم ہو گئی
      correct: false
      why:
        ar: استمرت التجارة رغم تغير الحكم
        en: trade went on though the rule changed
        ur: حکومت بدلنے کے باوجود تجارت جاری رہی
  - q:
      ar: من حفظ مخطوطات تمبكتو؟
      en: Who kept Timbuktu''s manuscripts?
      ur: تمبکٹو کے مخطوطے کس نے محفوظ کیے؟
    options:
    - text:
        ar: الأسر في بيوتها
        en: the families in their homes
        ur: خاندان اپنے گھروں میں
      correct: true
      why:
        ar: انتقلت الكتب بين أيدي الأسر لأجيال
        en: the books passed between families for generations
        ur: کتابیں نسلوں تک خاندانوں کے ہاتھ رہیں
    - text:
        ar: الحكومة المركزية فقط
        en: only the central government
        ur: صرف مرکزی حکومت
      correct: false
      why:
        ar: كانت المخطوطات في خزائن الأسر لا الدولة
        en: the manuscripts were in family holdings, not the state''s
        ur: مخطوطے خاندانی خزانوں میں تھے، ریاست کے نہیں
    - text:
        ar: الاستعمار الفرنسي
        en: the French colonizers
        ur: فرانسیسی نوآبادکار
      correct: false
      why:
        ar: حفظها أهلها لا المستعمر
        en: her people kept them, not the colonizer
        ur: انہیں اس کے لوگوں نے محفوظ کیا، نوآبادکار نہیں
    - text:
        ar: لا أحد؛ ضاعت كلها
        en: nobody; all were lost
        ur: کوئی نہیں؛ سب کھو گئے
      correct: false
      why:
        ar: نجت معظمها بجهود أهلها
        en: most survived through her people''s efforts
        ur: زیادہ تر اس کے لوگوں کی کوشش سے بچ گئے
  - q:
      ar: لماذا اشتهرت تمبكتو؟
      en: Why is Timbuktu famous?
      ur: تمبکٹو کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت جامعة أفريقيا الغربية
        en: because she was West Africa''s university
        ur: کیونکہ یہ مغربی افریقہ کا جامعہ تھا
      correct: true
      why:
        ar: جمعت المساجد والمدارس والمخطوطات
        en: she gathered mosques, schools and manuscripts
        ur: اس نے مسجدیں، مکاتب اور مخطوطے جمع کیے
    - text:
        ar: لأنها كانت عاصمة العالم
        en: because she was the world''s capital
        ur: کیونکہ یہ دنیا کا دارالحکومت تھا
      correct: false
      why:
        ar: لم تكن عاصمة عالمية قط
        en: she was never a world capital
        ur: یہ کبھی عالمی دارالحکومت نہیں رہی
    - text:
        ar: لأنها على البحر
        en: because she is on the sea
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: تمبكتو صحراوية لا بحرية
        en: Timbuktu is desert, not coastal
        ur: تمبکٹو صحرائی ہے، ساحلی نہیں
    - text:
        ar: لأنها اخترعت الكتابة
        en: because she invented writing
        ur: کیونکہ اس نے تحریر ایجاد کی
      correct: false
      why:
        ar: لم تخترع الكتابة بل حفظها
        en: she did not invent writing, she preserved it
        ur: اس نے تحریر ایجاد نہیں کی، محفوظ کی
  - q:
      ar: ماذا تدلّ تمبكتو على الإسلام؟
      en: What does Timbuktu show about Islam?
      ur: تمبکٹو اسلام کے بارے میں کیا بتاتا ہے؟
    options:
    - text:
        ar: أنّ الحرف الإسلامي وصل إلى أعماق أفريقيا
        en: that the Islamic written word reached deep into Africa
        ur: کہ اسلامی تحریر افریقہ کی گہرائیوں تک پہنچی
      correct: true
      why:
        ar: شهدت على انتقال العلم إلى قلب القارة
        en: she witnessed learning reaching the continent''s heart
        ur: اس نے علم کے براعظم کے دل تک پہنچنے کی گواہی دی
    - text:
        ar: أنّ الإسلام بقي على الساحل فقط
        en: that Islam stayed only on the coast
        ur: کہ اسلام صرف ساحل تک رہا
      correct: false
      why:
        ar: بلغت المدينة قلب أفريقيا الداخلية
        en: the city reached Africa''s inland heart
        ur: شہر افریقہ کے اندرونی دل تک پہنچا
    - text:
        ar: أنّ الإسلام لم يصل إلى أفريقيا
        en: that Islam never reached Africa
        ur: کہ اسلام افریقہ تک نہیں پہنچا
      correct: false
      why:
        ar: كانت تمبكتو مركزًا إسلاميًّا كبيرًا
        en: Timbuktu was a great Islamic centre
        ur: تمبکٹو ایک بڑا اسلامی مرکز تھا
    - text:
        ar: أنّها كانت مدينة أوروبية
        en: that she was a European city
        ur: کہ یہ ایک یورپی شہر تھا
      correct: false
      why:
        ar: كانت أفريقية إسلامية لا أوروبية
        en: she was African-Islamic, not European
        ur: یہ افریقی-اسلامی تھی، یورپی نہیں
  - q:
      ar: من كتب عن تمبكتو؟
      en: Who wrote about Timbuktu?
      ur: تمبکٹو کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو الصحراء مثل مؤلفي التاريخين المحليين
        en: Saharan historians like the authors of the local chronicles
        ur: صحرا کے مؤرخین جیسے مقامی تواریخ کے مصنف
      correct: true
      why:
        ar: تصلنا تاريخ السودان وتاريخ الفتاش
        en: the Tarikh al-Sudan and Tarikh al-Fattash reach us
        ur: تاریخ السودان اور تاریخ الفتاش ہم تک پہنچی ہیں
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب أهلها عنها قبل الأوروبيين
        en: her people wrote of her before Europeans
        ur: اس کے لوگوں نے یورپیوں سے پہلے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقها مؤرخوها وعلماؤها
        en: her historians and scholars documented her
        ur: اس کے مؤرخین اور علماء نے اسے ثبت کیا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون لم يصلوا إليها
        en: the Ottomans never reached her
        ur: عثمانی اس تک نہیں پہنچے
  - q:
      ar: ماذا أثبتت تمبكتو للعالم؟
      en: What did Timbuktu prove to the world?
      ur: تمبکٹو نے دنیا کو کیا ثابت کیا؟
    options:
    - text:
        ar: أنّ القلب الإسلامي امتدّ من الصحراء إلى النيجر
        en: that the Islamic heartland stretched from the Sahara to the Niger
        ur: کہ اسلامی مرکز صحرا سے نائجر تک پھیلا
      correct: true
      why:
        ar: شهدت على انتشار الحرف في عمق أفريقيا
        en: she witnessed the written word spreading deep in Africa
        ur: اس نے افریقہ کی گہرائی میں تحریر کے پھیلاؤ کی گواہی دی
    - text:
        ar: أنّ أفريقيا بلا تاريخ
        en: that Africa had no history
        ur: کہ افریقہ کی کوئی تاریخ نہیں
      correct: false
      why:
        ar: كانت تمبكتو مركزًا للتاريخ والكتب
        en: Timbuktu was a centre of history and books
        ur: تمبکٹو تاریخ اور کتابوں کا مرکز تھا
    - text:
        ar: أنّ الصحراء خالية
        en: that the Sahara was empty
        ur: کہ صحرا خالی تھا
      correct: false
      why:
        ar: كانت الصحراء ممرًّا للقوافل والعلم
        en: the Sahara was a road for caravans and learning
        ur: صحرا قافلوں اور علم کی راہ تھی
    - text:
        ar: أنّ الإسلام لم يعرف أفريقيا
        en: that Islam never knew Africa
        ur: کہ اسلام نے افریقہ کو نہیں جانا
      correct: false
      why:
        ar: وصلت المدينة قلب أفريقيا الإسلامي
        en: the city reached Africa''s Islamic heart
        ur: شہر افریقہ کے اسلامی دل تک پہنچا
- id: cairo
  anchor: place/cairo
  band: scholars
  title:
    ar: القاهرة
    en: Cairo
    ur: قاہرہ
  sixty:
    ar: 'القاهرة مدينة الألف مئذنة: أسّسها الفاطميون عام ٩٦٩ شمال الفسطاط قاعدةً لخلافتهم، وجعلها صلاح الدين قلب مقاومة الصليبيين. بلغت أوجها في العصر المملوكي: الأزهر
      منذ ٩٧٠ أقدم جامعة مستمرة في العالم، وقلعة صلاح الدين على المقطم، وأسواق خان الخليلي وأعمال محمد علي في القرن التاسع عشر. جمعت القاهرة الفاطمي والأيوبي والمملوكي
      والعثماني في نسيج واحد، وبقيت أكبر مدن العالم الإسلامي إلى اليوم.'
    en: 'Cairo is the city of a thousand minarets: the Fatimids founded it in 969 north of Fustat as their caliphate''''s base, and Saladin made it the heart of resistance
      to the Crusaders. It peaked in the Mamluk era: al-Azhar since 970 the world''''s oldest continuous university, Saladin''''s citadel on the Muqattam hill, the
      Khan al-Khalili markets and Muhammad Ali''''s nineteenth-century works. Cairo wove Fatimid, Ayyubid, Mamluk and Ottoman into one fabric, and it remains the
      Islamic world''''s largest city to this day.'
    ur: 'قاہرہ ہزاروں میناروں کا شہر ہے: فاطمیوں نے 969 میں فسطاط کے شمال میں اپنی خلافت کی بنیاد کے طور پر بسایا، اور صلاح الدین نے اسے صلیبیوں کے مقابلہ کا دل بنایا۔
      یہ مملوکی دور میں عروج پر رہا: 970 سے قائم الازہر دنیا کا قدیم ترین مسلسل جامعہ، مقطم پہاڑی پر صلاح الدین کا قلعہ، خان الخلیلی کی مارکیٹیں اور انیسویں صدی میں
      محمد علی کی تعمیرات۔ قاہرہ نے فاطمی، ایوبی، مملوکی اور عثمانی کو ایک تانے بانے میں بُنا، اور یہ آج بھی اسلامی دنیا کا سب سے بڑا شہر ہے۔'
  glossary:
  - term:
      ar: الفسطاط
      en: Fustat
      ur: فسطاط
    gloss:
      ar: المدينة العربية الأولى في مصر قبل القاهرة
      en: the first Arab city in Egypt before Cairo
      ur: قاہرہ سے پہلے مصر کا پہلا عرب شہر
  - term:
      ar: الفاطميون
      en: the Fatimids
      ur: فاطمی
    gloss:
      ar: السلالة التي أسّست القاهرة ٩٦٩
      en: the dynasty that founded Cairo in 969
      ur: وہ خاندان جس نے 969 میں قاہرہ بسایا
  - term:
      ar: الأزهر
      en: al-Azhar
      ur: الازہر
    gloss:
      ar: أقدم جامعة مستمرة في العالم منذ ٩٧٠
      en: the world''s oldest continuous university since 970
      ur: 970 سے دنیا کا قدیم ترین مسلسل جامعہ
  - term:
      ar: قلعة صلاح الدين
      en: Saladin''s citadel
      ur: صلاح الدین کا قلعہ
    gloss:
      ar: الحصن على جبل المقطم
      en: the fortress on the Muqattam hill
      ur: مقطم پہاڑی پر قلعہ
  - term:
      ar: المماليك
      en: the Mamluks
      ur: مملوک
    gloss:
      ar: السلالة التي بلغت القاهرة فيها ذروتها
      en: the dynasty under which Cairo peaked
      ur: وہ خاندان جس کے دور میں قاہرہ عروج پر رہا
  - term:
      ar: خان الخليلي
      en: Khan al-Khalili
      ur: خان الخلیلی
    gloss:
      ar: سوقها المشهور من العصر المملوكي
      en: her famous market from the Mamluk era
      ur: اس کی مشہور مملوکی مارکیٹ
  - term:
      ar: محمد علي
      en: Muhammad Ali
      ur: محمد علی
    gloss:
      ar: الحاكم العثماني الذي حدّث مصر في القرن التاسع عشر
      en: the Ottoman ruler who modernized Egypt in the nineteenth century
      ur: وہ عثمانی حکمران جس نے انیسویں صدی میں مصر کو جدید بنایا
  - term:
      ar: المقطم
      en: the Muqattam
      ur: مقطم
    gloss:
      ar: الجبل الذي قامت عليه القلعة
      en: the hill the citadel stands on
      ur: وہ پہاڑی جس پر قلعہ ہے
  - term:
      ar: الأيوبيون
      en: the Ayyubids
      ur: ایوبی
    gloss:
      ar: سلالة صلاح الدين التي حكمت مصر
      en: Saladin''s dynasty that ruled Egypt
      ur: وہ صلاح الدین کا خاندان جس نے مصر پر حکومت کی
  - term:
      ar: ٩٦٩
      en: '969'
      ur: '969'
    gloss:
      ar: عام تأسيس المدينة
      en: the year of the city''s founding
      ur: شہر کی بنیاد کا سال
  - term:
      ar: الألف مئذنة
      en: the thousand minarets
      ur: ہزار مینار
    gloss:
      ar: لقبها لكثرة مساجدها
      en: her nickname for her many mosques
      ur: اس کی بہت سی مسجدوں کی وجہ سے لقب
  - term:
      ar: النيل
      en: the Nile
      ur: نیل
    gloss:
      ar: النهر الذي قامت عليه المدينة
      en: the river the city stands on
      ur: وہ دریا جس پر شہر قائم ہے
  practice:
  - q:
      ar: من أسّس القاهرة؟
      en: Who founded Cairo?
      ur: قاہرہ کس نے بسایا؟
    options:
    - text:
        ar: الفاطميون عام ٩٦٩
        en: the Fatimids in 969
        ur: فاطمیوں نے 969 میں
      correct: true
      why:
        ar: تنسب المصادر تأسيسها إلى جوهر والفاطميين
        en: the sources credit Jawhar and the Fatimids
        ur: ماخذ اسے جوہر اور فاطمیوں سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعد تأسيسها بقرنين
        en: Saladin came two centuries after her founding
        ur: صلاح الدین اس کی بنیاد سے دو صدیاں بعد آیا
    - text:
        ar: المماليك
        en: the Mamluks
        ur: مملوک
      correct: false
      why:
        ar: حكمها المماليك بعد الفاطميين
        en: the Mamluks ruled her after the Fatimids
        ur: مملوکوں نے فاطمیوں کے بعد حکومت کی
    - text:
        ar: محمد علي
        en: Muhammad Ali
        ur: محمد علی
      correct: false
      why:
        ar: جاء محمد علي في القرن التاسع عشر
        en: Muhammad Ali came in the nineteenth century
        ur: محمد علی انیسویں صدی میں آیا
  - q:
      ar: ما الأزهر؟
      en: What is al-Azhar?
      ur: الازہر کیا ہے؟
    options:
    - text:
        ar: أقدم جامعة مستمرة في العالم منذ ٩٧٠
        en: the world''s oldest continuous university since 970
        ur: 970 سے دنیا کا قدیم ترین مسلسل جامعہ
      correct: true
      why:
        ar: أسّسه الفاطميون مسجدًا وجامعًا في المصادر
        en: the sources have the Fatimids build it mosque and college
        ur: ماخذ میں فاطمیوں نے اسے مسجد اور جامعہ بنایا
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: الأزهر مؤسسة علم لا قصر
        en: al-Azhar is a learning institution, not a palace
        ur: الازہر علمی ادارہ ہے، محل نہیں
    - text:
        ar: مستشفى
        en: a hospital
        ur: اسپتال
      correct: false
      why:
        ar: الأزهر جامعة لا مستشفى
        en: al-Azhar is a university, not a hospital
        ur: الازہر جامعہ ہے، اسپتال نہیں
    - text:
        ar: سوق
        en: a market
        ur: بازار
      correct: false
      why:
        ar: الأزهر جامعة لا سوق
        en: al-Azhar is a university, not a market
        ur: الازہر جامعہ ہے، بازار نہیں
  - q:
      ar: أين قلعة صلاح الدين؟
      en: Where is Saladin''s citadel?
      ur: صلاح الدین کا قلعہ کہاں ہے؟
    options:
    - text:
        ar: على جبل المقطم
        en: on the Muqattam hill
        ur: مقطم پہاڑی پر
      correct: true
      why:
        ar: تقف القلعة على الجبل في المصادر
        en: the sources place the citadel on the hill
        ur: ماخذ قلعے کو پہاڑی پر رکھتے ہیں
    - text:
        ar: في الإسكندرية
        en: in Alexandria
        ur: اسکندریہ میں
      correct: false
      why:
        ar: القلعة في القاهرة لا الإسكندرية
        en: the citadel is in Cairo, not Alexandria
        ur: قلعہ قاہرہ میں ہے، اسکندریہ میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: بنيت القلعة في مصر لا الشام
        en: the citadel was built in Egypt, not Syria
        ur: قلعہ مصر میں بنا، شام میں نہیں
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: لا علاقة للقلعة بمكة
        en: the citadel has nothing to do with Mecca
        ur: قلعے کا مکہ سے کوئی تعلق نہیں
  - q:
      ar: من جعل القاهرة قلب المقاومة؟
      en: Who made Cairo the heart of resistance?
      ur: قاہرہ کو مزاحمت کا دل کس نے بنایا؟
    options:
    - text:
        ar: صلاح الدين ضد الصليبيين
        en: Saladin against the Crusaders
        ur: صلاح الدین نے، صلیبیوں کے مقابلہ میں
      correct: true
      why:
        ar: جعلها مركز مواجهة الفرنجة في المصادر
        en: the sources have him make it the centre against the Franks
        ur: ماخذ میں اس نے اسے فرنگیوں کے مقابلہ کا مرکز بنایا
    - text:
        ar: الفاطميون ضد المغول
        en: the Fatimids against the Mongols
        ur: فاطمیوں نے، مغولوں کے مقابلہ میں
      correct: false
      why:
        ar: جاء المغول بعد الفاطميين بقرون
        en: the Mongols came centuries after the Fatimids
        ur: مغل فاطمیوں سے صدیوں بعد آئے
    - text:
        ar: محمد علي ضد أوروبا
        en: Muhammad Ali against Europe
        ur: محمد علی نے، یورپ کے مقابلہ میں
      correct: false
      why:
        ar: كان محمد علي في القرن التاسع عشر لا الصليبيين
        en: Muhammad Ali is nineteenth-century, not Crusader-era
        ur: محمد علی انیسویں صدی کا ہے، صلیبی دور کا نہیں
    - text:
        ar: العثمانيون ضد الفرس
        en: the Ottomans against the Persians
        ur: عثمانیوں نے، فارسیوں کے مقابلہ میں
      correct: false
      why:
        ar: جعل صلاح الدين القاهرة قلب المقاومة
        en: Saladin made Cairo the resistance heart
        ur: صلاح الدین نے قاہرہ کو مزاحمت کا دل بنایا
  - q:
      ar: ما خان الخليلي؟
      en: What is Khan al-Khalili?
      ur: خان الخلیلی کیا ہے؟
    options:
    - text:
        ar: سوقها المشهور من العصر المملوكي
        en: her famous market from the Mamluk era
        ur: اس کی مشہور مملوکی مارکیٹ
      correct: true
      why:
        ar: بقي السوق مركز تجارتها في المصادر
        en: the market stayed her trade centre in the sources
        ur: مارکیٹ ماخذ میں اس کے تجارت کا مرکز رہی
    - text:
        ar: مستشفى قديم
        en: an old hospital
        ur: پرانا اسپتال
      correct: false
      why:
        ar: خان الخليلي سوق لا مستشفى
        en: Khan al-Khalili is a market, not a hospital
        ur: خان الخلیلی بازار ہے، اسپتال نہیں
    - text:
        ar: مكتبة عباسية
        en: an Abbasid library
        ur: عباسی لائبریری
      correct: false
      why:
        ar: خان الخليلي في القاهرة لا بغداد
        en: Khan al-Khalili is in Cairo, not Baghdad
        ur: خان الخلیلی قاہرہ میں ہے، بغداد میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: خان الخليلي سوق مملوكي لا صليبي
        en: Khan al-Khalili is a Mamluk market, not Crusader
        ur: خان الخلیلی مملوکی بازار ہے، صلیبی نہیں
  - q:
      ar: ما الفسطاط؟
      en: What is Fustat?
      ur: فسطاط کیا ہے؟
    options:
    - text:
        ar: المدينة العربية الأولى في مصر قبل القاهرة
        en: the first Arab city in Egypt before Cairo
        ur: قاہرہ سے پہلے مصر کا پہلا عرب شہر
      correct: true
      why:
        ar: قامت قبل القاهرة في المصادر
        en: the sources have her before Cairo
        ur: ماخذ میں وہ قاہرہ سے پہلے ہے
    - text:
        ar: عاصمة الأندلس
        en: the Andalusi capital
        ur: اندلس کا دارالحکومت
      correct: false
      why:
        ar: الفسطاط في مصر لا الأندلس
        en: Fustat is in Egypt, not al-Andalus
        ur: فسطاط مصر میں ہے، اندلس میں نہیں
    - text:
        ar: مدينة فارسية
        en: a Persian city
        ur: فارسی شہر
      correct: false
      why:
        ar: الفسطاط عربية مصرية لا فارسية
        en: Fustat is Arab-Egyptian, not Persian
        ur: فسطاط عربی-مصری ہے، فارسی نہیں
    - text:
        ar: ميناء على المتوسط
        en: a Mediterranean port
        ur: بحیرہ روم کی بندرگاہ
      correct: false
      why:
        ar: الفسطاط على النيل لا المتوسط
        en: Fustat is on the Nile, not the Mediterranean
        ur: فسطاط نیل پر ہے، بحیرہ روم پر نہیں
  - q:
      ar: كم قديم الأزهر؟
      en: How old is al-Azhar?
      ur: الازہر کتنا پرانا ہے؟
    options:
    - text:
        ar: منذ ٩٧٠، أكثر من ألف عام
        en: since 970, over a thousand years
        ur: 970 سے، ایک ہزار سال سے زیادہ
      correct: true
      why:
        ar: تذكر المصادر تأسيسه ٩٧٠
        en: the sources date its founding to 970
        ur: ماخذ اس کی بنیاد 970 لکھتے ہیں
    - text:
        ar: مائة عام
        en: a hundred years
        ur: سو سال
      correct: false
      why:
        ar: الأزهر أقدم من مائة عام بكثير
        en: al-Azhar is far older than a century
        ur: الازہر ایک صدی سے کہیں پرانا ہے
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: الأزهر من أقدم الجامعات في العالم
        en: al-Azhar is among the world''s oldest universities
        ur: الازہر دنیا کے قدیم ترین جامعوں میں ہے
    - text:
        ar: خمسة آلاف عام
        en: five thousand years
        ur: پانچ ہزار سال
      correct: false
      why:
        ar: لم يكن الأزهر في عصر الفراعنة
        en: al-Azhar did not exist in pharaonic times
        ur: الازہر فرعونی دور میں نہیں تھا
  - q:
      ar: ماذا جمعت القاهرة؟
      en: What did Cairo weave together?
      ur: قاہرہ نے کیا ایک ساتھ بُنا؟
    options:
    - text:
        ar: الفاطمي والأيوبي والمملوكي والعثماني
        en: Fatimid, Ayyubid, Mamluk and Ottoman
        ur: فاطمی، ایوبی، مملوکی اور عثمانی
      correct: true
      why:
        ar: جمعت السلالات الأربع في نسيجها في المصادر
        en: the sources weave the four dynasties into her fabric
        ur: ماخذ میں چار خاندان اس کے تانے بانے میں بنے
    - text:
        ar: العباسي فقط
        en: only the Abbasid
        ur: صرف عباسی
      correct: false
      why:
        ar: لم تحكمها العباسية قط
        en: the Abbasids never ruled her
        ur: عباسیوں نے اس پر کبھی حکومت نہیں کی
    - text:
        ar: الروماني والفرعوني
        en: Roman and pharaonic
        ur: رومی اور فرعونی
      correct: false
      why:
        ar: القاهرة مدينة إسلامية لا فرعونية
        en: Cairo is an Islamic city, not pharaonic
        ur: قاہرہ اسلامی شہر ہے، فرعونی نہیں
    - text:
        ar: لا شيء؛ مدينة جديدة
        en: nothing; a new city
        ur: کچھ نہیں؛ نیا شہر
      correct: false
      why:
        ar: تعد من أقدم مدن العالم الإسلامي
        en: she is among the Islamic world''s oldest cities
        ur: یہ اسلامی دنیا کے قدیم ترین شہروں میں ہے
  - q:
      ar: من كتب عن القاهرة؟
      en: Who wrote about Cairo?
      ur: قاہرہ کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون مثل المقريزي ووصف مصر
        en: historians like al-Maqrizi and the Description of Egypt
        ur: مقریزی جیسے مؤرخین اور وصف مصر
      correct: true
      why:
        ar: تصلنا تاريخ المقريزي ووصف الحملة الفرنسية
        en: al-Maqrizi''s history and the French Description reach us
        ur: مقریزی کی تاریخ اور فرانسیسی وصف ہم تک پہنچے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: القاهرة من أكثر المدن تدوينًا
        en: Cairo is among the most-documented cities
        ur: قاہرہ سب سے زیادہ لکھے جانے والے شہروں میں ہے
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها قبل أوروبا بقرون
        en: Muslims wrote of her centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنها الفاطميون والمماليك قبل العثمانيين
        en: Fatimids and Mamluks wrote of her before the Ottomans
        ur: فاطمیوں اور مملوکوں نے عثمانیوں سے پہلے لکھا
  - q:
      ar: لماذا سمّيت مدينة الألف مئذنة؟
      en: Why is she called the city of a thousand minarets?
      ur: اسے ہزار میناروں کا شہر کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لكثرة مساجدها ومناراتها
        en: for her many mosques and minarets
        ur: اس کی بہت سی مسجدوں اور میناروں کی وجہ سے
      correct: true
      why:
        ar: جمعت المدينة مئذنة فوق مئذنة في نسيجها
        en: the city gathered minaret upon minaret in her fabric
        ur: شہر نے اپنے تانے بانے میں مینار پر مینار جمع کیا
    - text:
        ar: لأنها بنت ألف مئذنة في سنة
        en: because she built a thousand minarets in one year
        ur: کیونکہ اس نے ایک سال میں ہزار مینار بنائے
      correct: false
      why:
        ar: الاسم للكثرة لا لسنة واحدة
        en: the name is for the many, not one year
        ur: نام بہتات کے لیے ہے، ایک سال کے لیے نہیں
    - text:
        ar: لأنها مدينة حديثة
        en: because she is a modern city
        ur: کیونکہ یہ جدید شہر ہے
      correct: false
      why:
        ar: اللقب لعمارتها التاريخية
        en: the nickname is for her historic architecture
        ur: لقب اس کی تاریخی معماری کے لیے ہے
    - text:
        ar: لا سبب
        en: no reason
        ur: کوئی وجہ نہیں
      correct: false
      why:
        ar: يرتبط اللقب بكثرة المساجد في المصادر
        en: the sources tie the name to her many mosques
        ur: ماخذ نام کو اس کی بہت سی مسجدوں سے جوڑتے ہیں
- id: delhi
  anchor: place/delhi
  band: researchers
  title:
    ar: دلهي
    en: Delhi
    ur: دہلی
  sixty:
    ar: 'دلهي عاصمة سلطنة دلهي ثم الإمبراطورية المغولية في الهند: جعلها القطب منارها والقطب مسجدها رمزًا للإسلام الهندي منذ القرن الثالث عشر. حكمها خمس سلالات سلطانية
      من ١٢٠٦ إلى ١٥٢٦، ثم بناها شاهجهان شاهجاهان أباد عاصمةً مغولية: الجامع المسجد والحصن الأحمر وشاندني شوك. سقطت للفرس في ١٧٣٩ ثم للبريطانيين ١٨٥٧، وبقيت قلب الهند
      الإسلامي: مدرسة ومرقد ومدينة الحكماء ومسجد الجمعة.'
    en: 'Delhi is the capital of the Delhi Sultanate then the Mughal Empire in India: the Qutb Minar and Quwwat al-Islam mosque made it the emblem of Indian Islam
      from the thirteenth century. Five sultanate dynasties ruled it from 1206 to 1526, then Shah Jahan built it as Shahjahanabad, the Mughal capital: the Jama Masjid,
      the Red Fort and Chandni Chowk. It fell to the Persians in 1739 then the British in 1857, and it remains the heart of India''''s Islamic life: a school, a shrine,
      a city of the wise and the Friday mosque.'
    ur: 'دہلی ہندوستان میں دہلی سلطنت پھر مغل سلطنت کا دارالحکومت ہے: قطب مینار اور قوت الاسلام مسجد نے اسے تیرہویں صدی سے ہندوستانی اسلام کی علامت بنایا۔ پانچ سلطانی
      خاندانوں نے 1206 سے 1526 تک اس پر حکومت کی، پھر شاہجہاں نے اسے شاہجہان آباد کے نام سے مغل دارالحکومت بنایا: جامع مسجد، لال قلعہ اور چاندنی چوک۔ یہ 1739 میں
      فارسیوں کے پھر 1857 میں برطانویوں کے ہاتھ گرا، اور یہ ہندوستان کی اسلامی زندگی کا دل ہے: مدرسہ، درگاہ، حکماء کا شہر اور جمعہ کی مسجد۔'
  glossary:
  - term:
      ar: القطب منار
      en: the Qutb Minar
      ur: قطب مینار
    gloss:
      ar: أطول منارة طوب في العالم
      en: the world''s tallest brick minaret
      ur: دنیا کا سب سے اونچا اینٹوں کا مینار
  - term:
      ar: قوت الإسلام
      en: Quwwat al-Islam
      ur: قوت الاسلام
    gloss:
      ar: أول مسجد في سلطنة دلهي
      en: the Delhi Sultanate''s first mosque
      ur: دہلی سلطنت کی پہلی مسجد
  - term:
      ar: السلطنة
      en: the Sultanate
      ur: سلطنت
    gloss:
      ar: حكم خمس سلالات من ١٢٠٦
      en: the rule of five dynasties from 1206
      ur: 1206 سے پانچ خاندانوں کی حکومت
  - term:
      ar: شاهجهان
      en: Shah Jahan
      ur: شاہجہاں
    gloss:
      ar: الإمبراطور المغولي الذي بناها عاصمة
      en: the Mughal emperor who built her as capital
      ur: وہ مغل بادشاہ جس نے اسے دارالحکومت بنایا
  - term:
      ar: شاهجاهان أباد
      en: Shahjahanabad
      ur: شاہجہان آباد
    gloss:
      ar: اسمها المغولي كعاصمة
      en: her Mughal name as capital
      ur: دارالحکومت کے طور پر اس کا مغلی نام
  - term:
      ar: الجامع المسجد
      en: the Jama Masjid
      ur: جامع مسجد
    gloss:
      ar: مسجد الجمعة الكبير في شاهجاهان أباد
      en: the great Friday mosque of Shahjahanabad
      ur: شاہجہان آباد کی بڑی جمعہ مسجد
  - term:
      ar: الحصن الأحمر
      en: the Red Fort
      ur: لال قلعہ
    gloss:
      ar: قصر الإمبراطور المغولي
      en: the Mughal emperor''s palace
      ur: مغل بادشاہ کا محل
  - term:
      ar: شاندني شوك
      en: Chandni Chowk
      ur: چاندنی چوک
    gloss:
      ar: سوقها المشهور
      en: her famous market
      ur: اس کی مشہور بازار
  - term:
      ar: ١٧٣٩
      en: '1739'
      ur: '1739'
    gloss:
      ar: عام سقوطها للفرس
      en: the year she fell to the Persians
      ur: اس کے فارسیوں کے ہاتھ گرنے کا سال
  - term:
      ar: ١٨٥٧
      en: '1857'
      ur: '1857'
    gloss:
      ar: عام سقوطها للبريطانيين
      en: the year she fell to the British
      ur: اس کے برطانویوں کے ہاتھ گرنے کا سال
  - term:
      ar: الهند
      en: India
      ur: ہندوستان
    gloss:
      ar: البلد الذي فيه دلهي
      en: the country holding Delhi
      ur: وہ ملک جس میں دہلی ہے
  - term:
      ar: السلالات الخمس
      en: the five dynasties
      ur: پانچ خاندان
    gloss:
      ar: العبيد والخلجيون والتوغلكيون والسيديون واللوديون
      en: the Mamluks, Khaljis, Tughlaqs, Sayyids and Lodis
      ur: غلامان، خلجی، تغلق، سید اور لودھی
  practice:
  - q:
      ar: ما القطب منار؟
      en: What is the Qutb Minar?
      ur: قطب مینار کیا ہے؟
    options:
    - text:
        ar: أطول منارة طوب في العالم
        en: the world''s tallest brick minaret
        ur: دنیا کا سب سے اونچا اینٹوں کا مینار
      correct: true
      why:
        ar: تذكر المصادر ارتفاعها بأكثر من سبعين مترًا
        en: the sources give her height over seventy metres
        ur: ماخذ اس کی اونچائی ستر میٹر سے زیادہ لکھتے ہیں
    - text:
        ar: قصر الإمبراطور
        en: the emperor''s palace
        ur: بادشاہ کا محل
      correct: false
      why:
        ar: القطب منار منارة لا قصر
        en: the Qutb Minar is a minaret, not a palace
        ur: قطب مینار مینار ہے، محل نہیں
    - text:
        ar: مسجد الجمعة
        en: the Friday mosque
        ur: جمعہ مسجد
      correct: false
      why:
        ar: القطب منار برج لا مسجد
        en: the Qutb Minar is a tower, not a mosque
        ur: قطب مینار برج ہے، مسجد نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: القطب منار هندية إسلامية لا صليبية
        en: the Qutb Minar is Indian-Islamic, not Crusader
        ur: قطب مینار ہندوستانی-اسلامی ہے، صلیبی نہیں
  - q:
      ar: كم سلالة حكمت دلهي؟
      en: How many dynasties ruled Delhi?
      ur: دہلی پر کتنے خاندانوں نے حکومت کی؟
    options:
    - text:
        ar: خمس من ١٢٠٦ إلى ١٥٢٦
        en: five from 1206 to 1526
        ur: 1206 سے 1526 تک پانچ
      correct: true
      why:
        ar: تذكر المصادر السلالات السلطانية الخمس
        en: the sources name the five sultanate dynasties
        ur: ماخذ پانچ سلطانی خاندانوں کے نام لیتے ہیں
    - text:
        ar: واحدة
        en: one
        ur: ایک
      correct: false
      why:
        ar: خمس سلالات لا واحدة
        en: five dynasties, not one
        ur: پانچ خاندان، ایک نہیں
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: خمسة عدد السلطنة لا عشرة
        en: five is the sultanate count, not ten
        ur: پانچ سلطنت کی گنتی ہے، دس نہیں
    - text:
        ar: لا سلالة؛ جمهورية
        en: no dynasty; a republic
        ur: کوئی خاندان نہیں؛ جمہوریت
      correct: false
      why:
        ar: حكمها سلالات سلطانية قبل الجمهورية
        en: sultanate dynasties ruled her before the republic
        ur: جمہوریت سے پہلے سلطانی خاندانوں نے حکومت کی
  - q:
      ar: من بناها عاصمة مغولية؟
      en: Who built her as Mughal capital?
      ur: اسے مغل دارالحکومت کس نے بنایا؟
    options:
    - text:
        ar: شاهجهان شاهجاهان أباد
        en: Shah Jahan as Shahjahanabad
        ur: شاہجہاں نے، شاہجہان آباد کے نام سے
      correct: true
      why:
        ar: تنسب المصادر بناءها للإمبراطور الخامس
        en: the sources credit the fifth Mughal emperor
        ur: ماخذ اسے پانچویں مغل بادشاہ سے منسوب کرتے ہیں
    - text:
        ar: أكبر
        en: Akbar
        ur: اکبر
      correct: false
      why:
        ar: كان أكبر قبلها عاصمة في أغرا
        en: Akbar had Agra as capital before
        ur: اکبر کا دارالحکومت پہلے آگرہ تھا
    - text:
        ar: بابر
        en: Babur
        ur: بابر
      correct: false
      why:
        ar: أسّس بابر الدولة لا المدينة
        en: Babur founded the state, not the city
        ur: بابر نے سلطنت بنائی، شہر نہیں
    - text:
        ar: أورنكزيب
        en: Aurangzeb
        ur: اورنگزیب
      correct: false
      why:
        ar: جاء أورنكزيب بعد بناءها
        en: Aurangzeb came after her building
        ur: اورنگزیب اس کی تعمیر کے بعد آیا
  - q:
      ar: متى سقطت دلهي للبريطانيين؟
      en: When did Delhi fall to the British?
      ur: دہلی برطانویوں کے ہاتھ کب گرا؟
    options:
    - text:
        ar: عام ١٨٥٧
        en: in 1857
        ur: 1857 میں
      correct: true
      why:
        ar: تذكر المصادر نهاية حكمها المغولي ١٨٥٧
        en: the sources date her Mughal rule''s end to 1857
        ur: ماخذ اس کی مغلی حکومت کا خاتمہ 1857 لکھتے ہیں
    - text:
        ar: عام ١٧٣٩
        en: in 1739
        ur: 1739 میں
      correct: false
      why:
        ar: ذلك عام سقوطها للفرس لا البريطانيين
        en: that is her Persian fall, not the British
        ur: یہ اس کے فارسی گرنے کا سال ہے، برطانوی نہیں
    - text:
        ar: عام ١٥٢٦
        en: in 1526
        ur: 1526 میں
      correct: false
      why:
        ar: ذلك عام بداية الحكم المغولي
        en: that is the start of Mughal rule
        ur: یہ مغلی حکومت کے آغاز کا سال ہے
    - text:
        ar: لم تسقط أبدًا
        en: she never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت للفرس ثم البريطانيين
        en: she fell to the Persians then the British
        ur: یہ فارسیوں پھر برطانویوں کے ہاتھ گری
  - q:
      ar: ما قوت الإسلام؟
      en: What is Quwwat al-Islam?
      ur: قوت الاسلام کیا ہے؟
    options:
    - text:
        ar: أول مسجد في سلطنة دلهي
        en: the Delhi Sultanate''s first mosque
        ur: دہلی سلطنت کی پہلی مسجد
      correct: true
      why:
        ar: بناها القادة الأوائل في المصادر
        en: the sources have the first commanders build it
        ur: ماخذ میں پہلے سرداروں نے اسے بنایا
    - text:
        ar: مدرسة عثمانية
        en: an Ottoman school
        ur: عثمانی مدرسہ
      correct: false
      why:
        ar: قوت الإسلام في الهند لا العثمانية
        en: Quwwat al-Islam is in India, not Ottoman
        ur: قوت الاسلام ہندوستان میں ہے، عثمانی نہیں
    - text:
        ar: قصر فرعوني
        en: a pharaonic palace
        ur: فرعونی محل
      correct: false
      why:
        ar: قوت الإسلام إسلامية لا فرعونية
        en: Quwwat al-Islam is Islamic, not pharaonic
        ur: قوت الاسلام اسلامی ہے، فرعونی نہیں
    - text:
        ar: سوق إيراني
        en: an Iranian market
        ur: ایرانی بازار
      correct: false
      why:
        ar: قوت الإسلام مسجد لا سوق
        en: Quwwat al-Islam is a mosque, not a market
        ur: قوت الاسلام مسجد ہے، بازار نہیں
  - q:
      ar: ماذا بنا شاهجهان في دلهي؟
      en: What did Shah Jahan build in Delhi?
      ur: شاہجہاں نے دہلی میں کیا بنایا؟
    options:
    - text:
        ar: الجامع المسجد والحصن الأحمر وشاندني شوك
        en: the Jama Masjid, the Red Fort and Chandni Chowk
        ur: جامع مسجد، لال قلعہ اور چاندنی چوک
      correct: true
      why:
        ar: تذكر المصادر معالمها الثلاثة في عاصمته
        en: the sources name her three landmarks in his capital
        ur: ماخذ اس کے دارالحکومت میں تین نشانیوں کا ذکر کرتے ہیں
    - text:
        ar: تاج محل في دلهي
        en: the Taj Mahal in Delhi
        ur: دہلی میں تاج محل
      correct: false
      why:
        ar: تاج محل في أغرا لا دلهي
        en: the Taj Mahal is in Agra, not Delhi
        ur: تاج محل آگرہ میں ہے، دہلی میں نہیں
    - text:
        ar: قلعة صلاح الدين
        en: Saladin''s citadel
        ur: صلاح الدین کا قلعہ
      correct: false
      why:
        ar: قلعة صلاح الدين في القاهرة
        en: Saladin''s citadel is in Cairo
        ur: صلاح الدین کا قلعہ قاہرہ میں ہے
    - text:
        ar: القطب منار
        en: the Qutb Minar
        ur: قطب مینار
      correct: false
      why:
        ar: القطب منار قبل شاهجهان بقرون
        en: the Qutb Minar predates Shah Jahan by centuries
        ur: قطب مینار شاہجہاں سے صدیوں پرانا ہے
  - q:
      ar: لماذا اشتهرت دلهي؟
      en: Why is Delhi famous?
      ur: دہلی کیوں مشہور ہے؟
    options:
    - text:
        ar: كقلب الهند الإسلامي وعاصمة سلالاتها
        en: as the heart of Indian Islam and her dynasties'' capital
        ur: ہندوستانی اسلام کے دل اور اس کے خاندانوں کے دارالحکومت کے طور پر
      correct: true
      why:
        ar: جمعت سلطنة ومغولية وتراثًا إسلاميًّا
        en: she gathered sultanate, Mughal and Islamic heritage
        ur: اس نے سلطنت، مغلیہ اور اسلامی ورثہ جمع کیا
    - text:
        ar: كأول مدينة في الهند
        en: as India''s first city
        ur: ہندوستان کے پہلے شہر کے طور پر
      correct: false
      why:
        ar: سبقتها مدن هندية قديمة
        en: older Indian cities predate her
        ur: اس سے پہلے قدیم ہندوستانی شہر تھے
    - text:
        ar: كعاصمة بريطانية دائمًا
        en: as always the British capital
        ur: ہمیشہ برطانوی دارالحکومت کے طور پر
      correct: false
      why:
        ar: كانت إسلامية قبل البريطانيين بقرون
        en: she was Islamic centuries before the British
        ur: یہ برطانویوں سے صدیوں پہلے اسلامی تھی
    - text:
        ar: كجزيرة
        en: as an island
        ur: جزیرے کے طور پر
      correct: false
      why:
        ar: دلهي مدينة برية لا جزيرة
        en: Delhi is an inland city, not an island
        ur: دہلی اندرونِ ملک شہر ہے، جزیرہ نہیں
  - q:
      ar: من كتب عن دلهي؟
      en: Who wrote about Delhi?
      ur: دہلی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو السلطنة مثل البرني
        en: sultanate historians like Barani
        ur: برنی جیسے سلطنت کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات البرني ومؤرخي المغول
        en: Barani''s accounts and Mughal historians reach us
        ur: برنی کی روایتیں اور مغل مؤرخین ہم تک پہنچے
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب مؤرخوها قبل أوروبا بقرون
        en: her historians wrote centuries before Europe
        ur: اس کے مؤرخین نے یورپ سے صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقها مؤرخو السلطنة والمغول
        en: sultanate and Mughal historians documented her
        ur: سلطنت اور مغل مؤرخین نے اسے ثبت کیا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون كتبوا عن بلادهم لا دلهي
        en: the Ottomans wrote of their lands, not Delhi
        ur: عثمانیوں نے اپنے ملکوں کے بارے میں لکھا، دہلی کے بارے میں نہیں
  - q:
      ar: ماذا تدلّ دلهي على الإسلام؟
      en: What does Delhi show about Islam?
      ur: دہلی اسلام کے بارے میں کیا بتاتی ہے؟
    options:
    - text:
        ar: أنّ الإسلام صار هنديًّا في العمارة واللغة والمدرسة
        en: that Islam became Indian in architecture, language and learning
        ur: کہ اسلام معماری، زبان اور علم میں ہندوستانی بن گیا
      correct: true
      why:
        ar: شهدت على اندماج الإسلام في المجتمع الهندي
        en: she witnessed Islam''s joining Indian society
        ur: اس نے ہندوستانی معاشرے میں اسلام کے مکس ہونے کی گواہی دی
    - text:
        ar: أنّ الإسلام بقي غريبًا عن الهند
        en: that Islam stayed foreign to India
        ur: کہ اسلام ہندوستان کے لیے اجنبی رہا
      correct: false
      why:
        ar: اندمجت عمارتها ولغتها في الهند
        en: her architecture and language merged into India
        ur: اس کی معماری اور زبان ہندوستان میں ملی
    - text:
        ar: أنّ الهند لم تعرف الإسلام
        en: that India never knew Islam
        ur: کہ ہندوستان نے اسلام کو نہیں جانا
      correct: false
      why:
        ar: كانت دلهي مركزًا إسلاميًّا قرونًا
        en: Delhi was an Islamic centre for centuries
        ur: دہلی صدیوں اسلامی مرکز رہی
    - text:
        ar: أنّ الإسلام انتهى في ١٢٦٥
        en: that Islam ended in 1265
        ur: کہ اسلام 1265 میں ختم ہو گیا
      correct: false
      why:
        ar: استمر الإسلام في الهند إلى اليوم
        en: Islam in India continues to this day
        ur: ہندوستان میں اسلام آج تک جاری ہے
  - q:
      ar: متى بدأ حكم سلطنة دلهي؟
      en: When did the Delhi Sultanate''s rule begin?
      ur: دہلی سلطنت کی حکمرانی کب شروع ہوئی؟
    options:
    - text:
        ar: عام ١٢٠٦
        en: in 1206
        ur: 1206 میں
      correct: true
      why:
        ar: تذكر المصادر بداية السلطنة ١٢٠٦
        en: the sources date the sultanate''s start to 1206
        ur: ماخذ سلطنت کا آغاز 1206 لکھتے ہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح إسطنبول لا بداية السلطنة
        en: that is Istanbul''s conquest, not the sultanate''s start
        ur: یہ استنبول کی فتح کا سال ہے، سلطنت کے آغاز کا نہیں
    - text:
        ar: عام ١٨٥٧
        en: in 1857
        ur: 1857 میں
      correct: false
      why:
        ar: ذلك عام نهاية الحكم المغولي لا بدايته
        en: that is Mughal rule''s end, not its start
        ur: یہ مغلی حکومت کا خاتمہ ہے، آغاز نہیں
    - text:
        ar: عام ٩٦٩
        en: in 969
        ur: 969 میں
      correct: false
      why:
        ar: ذلك عام تأسيس القاهرة لا سلطنة دلهي
        en: that is Cairo''s founding, not Delhi''s sultanate
        ur: یہ قاہرہ کی بنیاد کا سال ہے، دہلی سلطنت کا نہیں
- id: istanbul
  anchor: place/istanbul
  band: researchers
  title:
    ar: إسطنبول
    en: Istanbul
    ur: استنبول
  sixty:
    ar: 'إسطنبول القسطنطينية سابقًا: عاصمة البيزنطيين ألف عام حتى فتحها محمد الفاتح عام ١٤٥٣ فحوّل آيا صوفيا إلى مسجد وجعلها عاصمة الخلافة العثمانية أربعة قرون. بلغت
      أوجها في عهد سليمان القانوني: مساجد سنان الزرقاء والسليمانية وبازارها الكبير وأضابها على البوسفور. جمعت إسطنبول الروماني والبيزنطي والعثماني في مدينة واحدة:
      قسطنطينية بأسوارها وإسطنبول بمآذنها، وبقيت جسرًا بين أوروبا وآسيا إلى اليوم.'
    en: 'Istanbul, formerly Constantinople: capital of the Byzantines for a thousand years until Mehmed the Conqueror took it in 1453, turned Hagia Sophia into a
      mosque, and made it the seat of the Ottoman caliphate for four centuries. It peaked under Suleiman the Magnificent: Sinan''''s Blue and Suleymaniye mosques,
      its Grand Bazaar and its quarters on the Bosphorus. Istanbul wove Roman, Byzantine and Ottoman into one city — Constantinople with its walls and Istanbul with
      its minarets — and it remains the bridge between Europe and Asia to this day.'
    ur: 'استنبول، پہلے قسطنطنیہ: ایک ہزار سال تک بازنطینیوں کا دارالحکومت رہا جب تک کہ محمد فاتح نے 1453 میں اسے لیا، آیا صوفیا کو مسجد میں بدلا اور اسے چار صدیوں
      کے لیے عثمانی خلافت کی نشست بنایا۔ یہ سلیمان قانونی کے دور میں عروج پر رہا: سنان کی بلیو اور سلیمانیہ مسجدیں، اس کا گرینڈ بازار اور بوسفورس کے کنارے اس کے محلے۔
      استنبول نے رومی، بازنطینی اور عثمانی کو ایک شہر میں بُنا — قسطنطنیہ اپنی فصیلوں کے ساتھ اور استنبول اپنے میناروں کے ساتھ — اور یہ آج بھی یورپ اور ایشیا کے درمیان
      پل ہے۔'
  glossary:
  - term:
      ar: القسطنطينية
      en: Constantinople
      ur: قسطنطنیہ
    gloss:
      ar: الاسم البيزنطي القديم للمدينة
      en: the city''s old Byzantine name
      ur: شہر کا قدیم بازنطینی نام
  - term:
      ar: محمد الفاتح
      en: Mehmed the Conqueror
      ur: محمد فاتح
    gloss:
      ar: السلطان الذي فتحها عام ١٤٥٣
      en: the sultan who took her in 1453
      ur: وہ سلطان جس نے 1453 میں اسے لیا
  - term:
      ar: آيا صوفيا
      en: Hagia Sophia
      ur: آیا صوفیا
    gloss:
      ar: الكنيسة التي صارت مسجدًا
      en: the church that became a mosque
      ur: وہ کلیسا جو مسجد بنی
  - term:
      ar: سليمان القانوني
      en: Suleiman the Magnificent
      ur: سلیمان قانونی
    gloss:
      ar: السلطان الذي في عهده بلغت أوجها
      en: the sultan in whose reign she peaked
      ur: وہ سلطان جس کے دور میں یہ عروج پر رہی
  - term:
      ar: سنان
      en: Sinan
      ur: سنان
    gloss:
      ar: المهندس الذي بنى أجمل مساجدها
      en: the architect who built her finest mosques
      ur: وہ معمار جس نے اس کی خوبصورت مسجدیں بنائیں
  - term:
      ar: البوسفور
      en: the Bosphorus
      ur: بوسفورس
    gloss:
      ar: المضيق الذي يفصل أوروبا عن آسيا
      en: the strait separating Europe from Asia
      ur: وہ آبی راہ جو یورپ کو ایشیا سے الگ کرتی ہے
  - term:
      ar: الخلافة العثمانية
      en: the Ottoman caliphate
      ur: عثمانی خلافت
    gloss:
      ar: حكم السلاطين من إسطنبول أربعة قرون
      en: the sultans'' rule from Istanbul for four centuries
      ur: استنبول سے چار صدیوں تک سلاطین کی حکومت
  - term:
      ar: البازار الكبير
      en: the Grand Bazaar
      ur: گرینڈ بازار
    gloss:
      ar: سوقها المسقوف المشهور
      en: her famous covered market
      ur: اس کی مشہور ڈھکی ہوئی بازار
  - term:
      ar: ١٤٥٣
      en: '1453'
      ur: '1453'
    gloss:
      ar: عام فتحها العثماني
      en: the year of her Ottoman conquest
      ur: اس کی عثمانی فتح کا سال
  - term:
      ar: البيزنطيون
      en: the Byzantines
      ur: بازنطینی
    gloss:
      ar: الحكم الذي استمر ألف عام قبلها
      en: the rule that lasted a thousand years before
      ur: اس سے پہلے ہزار سال رہنے والی حکومت
  - term:
      ar: المسجد الأزرق
      en: the Blue Mosque
      ur: بلیو مسجد
    gloss:
      ar: مسجد سلطان أحمد المشهور
      en: the famous Sultan Ahmed mosque
      ur: مشہور سلطان احمد مسجد
  - term:
      ar: السليمانية
      en: the Suleymaniye
      ur: سلیمانیہ
    gloss:
      ar: مسجد سليمان الذي بناه سنان
      en: Suleiman''s mosque built by Sinan
      ur: سلیمان کی مسجد جسے سنان نے بنایا
  practice:
  - q:
      ar: ما الاسم القديم لإسطنبول؟
      en: What is Istanbul''s old name?
      ur: استنبول کا قدیم نام کیا ہے؟
    options:
    - text:
        ar: القسطنطينية
        en: Constantinople
        ur: قسطنطنیہ
      correct: true
      why:
        ar: كانت عاصمة بيزنطية ألف عام
        en: she was the Byzantine capital a thousand years
        ur: یہ ہزار سال بازنطینی دارالحکومت رہی
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد مدينة أخرى في العراق
        en: Baghdad is another city in Iraq
        ur: بغداد عراق میں دوسرا شہر ہے
    - text:
        ar: القدس
        en: Jerusalem
        ur: بیت المقدس
      correct: false
      why:
        ar: القدس في فلسطين لا الأناضول
        en: Jerusalem is in Palestine, not Anatolia
        ur: بیت المقدس فلسطین میں ہے، اناطولیہ میں نہیں
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطہ
      correct: false
      why:
        ar: قرطبة في الأندلس
        en: Cordoba is in al-Andalus
        ur: قرطہ اندلس میں ہے
  - q:
      ar: متى فتحها العثمانيون؟
      en: When did the Ottomans take her?
      ur: عثمانیوں نے اسے کب لیا؟
    options:
    - text:
        ar: عام ١٤٥٣ بقيادة محمد الفاتح
        en: in 1453 under Mehmed the Conqueror
        ur: 1453 میں محمد فاتح کی قیادت میں
      correct: true
      why:
        ar: تذكر المصادر سقوط القسطنطينية ١٤٥٣
        en: the sources date Constantinople''s fall to 1453
        ur: ماخذ قسطنطنیہ کا سقوط 1453 لکھتے ہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا إسطنبول
        en: that is Acre''s fall, not Istanbul
        ur: یہ عکہ کے گرنے کا سال ہے، استنبول کا نہیں
    - text:
        ar: عام ١٥١٧
        en: in 1517
        ur: 1517 میں
      correct: false
      why:
        ar: ذلك عام فتح مصر لا إسطنبول
        en: that is Egypt''s taking, not Istanbul
        ur: یہ مصر کے لینے کا سال ہے، استنبول کا نہیں
    - text:
        ar: لم تُفتح أبدًا
        en: she was never taken
        ur: یہ کبھی نہیں لی گئی
      correct: false
      why:
        ar: فتحها العثمانيون في ١٤٥٣
        en: the Ottomans took her in 1453
        ur: عثمانیوں نے 1453 میں اسے لیا
  - q:
      ar: ماذا فعل الفاتح بآيا صوفيا؟
      en: What did the Conqueror do to Hagia Sophia?
      ur: فاتح نے آیا صوفیا کا کیا کیا؟
    options:
    - text:
        ar: حوّلها إلى مسجد
        en: he turned her into a mosque
        ur: اس نے اسے مسجد میں بدل دیا
      correct: true
      why:
        ar: تذكر المصادر تحويلها مسجدًا يوم الفتح
        en: the sources record her becoming a mosque on conquest day
        ur: ماخذ فتح کے دن اس کے مسجد بننے کا ذکر کرتے ہیں
    - text:
        ar: هدمها كلها
        en: he demolished her entirely
        ur: اس نے اسے مکمل مسمار کیا
      correct: false
      why:
        ar: بقيت آيا صوفيا مسجدًا لا أُهدمت
        en: Hagia Sophia remained a mosque, not demolished
        ur: آیا صوفیا مسجد رہی، مسمار نہیں ہوئی
    - text:
        ar: أبقاها كنيسة
        en: he kept her a church
        ur: اس نے اسے کلیسا رکھا
      correct: false
      why:
        ar: حوّلها الفاتح مسجدًا في المصادر
        en: the sources have the Conqueror make her a mosque
        ur: ماخذ میں فاتح نے اسے مسجد بنایا
    - text:
        ar: بناها من جديد
        en: he built her anew
        ur: اس نے اسے نئے سرے سے بنایا
      correct: false
      why:
        ar: كانت قائمة قبل الفتح بقرون
        en: she stood centuries before the conquest
        ur: وہ فتح سے صدیوں پہلے قائم تھی
  - q:
      ar: من بنا المسجد الأزرق والسليمانية؟
      en: Who built the Blue and Suleymaniye mosques?
      ur: بلیو اور سلیمانیہ مسجدیں کس نے بنائیں؟
    options:
    - text:
        ar: سنان المعمار العثماني
        en: Sinan the Ottoman architect
        ur: سنان نے، عثمانی معمار
      correct: true
      why:
        ar: تنسب المصادر الجامعتين إلى سنان
        en: the sources credit both to Sinan
        ur: ماخذ دونوں کو سنان سے منسوب کرتے ہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: كان عبد الملك قبلها بثمانية قرون
        en: Abd al-Malik was eight centuries earlier
        ur: عبدالملک اس سے آٹھ صدیاں پہلے تھا
    - text:
        ar: شاهجهان
        en: Shah Jahan
        ur: شاہجہاں
      correct: false
      why:
        ar: كان شاهجهان في الهند لا إسطنبول
        en: Shah Jahan was in India, not Istanbul
        ur: شاہجہاں ہندوستان میں تھا، استنبول میں نہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين قبلها بثلاثة قرون
        en: Saladin was three centuries earlier
        ur: صلاح الدین اس سے تین صدیاں پہلے تھا
  - q:
      ar: كم دامت إسطنبول عاصمة الخلافة؟
      en: How long was Istanbul the caliphate seat?
      ur: استنبول کتنی دیر خلافت کی نشست رہی؟
    options:
    - text:
        ar: أربعة قرون
        en: four centuries
        ur: چار صدیاں
      correct: true
      why:
        ar: من ١٤٥٣ حتى نهاية الخلافة أربعة قرون
        en: from 1453 to the caliphate''s end, four centuries
        ur: 1453 سے خلافت کے خاتمے تک چار صدیاں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة حكمها
        en: fifty is far short of her rule
        ur: پچاس اس کی حکمرانی کے عرصے سے کہیں کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: ألف عام مدة بيزنطية لا عثمانية
        en: a thousand years was the Byzantine span, not Ottoman
        ur: ہزار سال بازنطینی عرصہ تھا، عثمانی نہیں
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة مدة حكم سلطان واحد قصير
        en: ten is one short sultan''s span
        ur: دس ایک مختصر سلطان کا عرصہ ہے
  - q:
      ar: ما البوسفور؟
      en: What is the Bosphorus?
      ur: بوسفورس کیا ہے؟
    options:
    - text:
        ar: المضيق الذي يفصل أوروبا عن آسيا
        en: the strait separating Europe from Asia
        ur: وہ آبی راہ جو یورپ کو ایشیا سے الگ کرتی ہے
      correct: true
      why:
        ar: تقف المدينة على ضفتي المضيق
        en: the city stands on both sides of the strait
        ur: شہر آبی راہ کے دونوں کناروں پر ہے
    - text:
        ar: نهر في مصر
        en: a river in Egypt
        ur: مصر کا دریا
      correct: false
      why:
        ar: البوسفور في تركيا لا مصر
        en: the Bosphorus is in Turkey, not Egypt
        ur: بوسفورس ترکی میں ہے، مصر میں نہیں
    - text:
        ar: بحيرة في الهند
        en: a lake in India
        ur: ہندوستان کی جھیل
      correct: false
      why:
        ar: البوسفور مضيق لا بحيرة
        en: the Bosphorus is a strait, not a lake
        ur: بوسفورس آبی راہ ہے، جھیل نہیں
    - text:
        ar: جبل في الأندلس
        en: a mountain in al-Andalus
        ur: اندلس کا پہاڑ
      correct: false
      why:
        ar: البوسفور في إسطنبول لا الأندلس
        en: the Bosphorus is in Istanbul, not al-Andalus
        ur: بوسفورس استنبول میں ہے، اندلس میں نہیں
  - q:
      ar: لماذا اشتهرت إسطنبول؟
      en: Why is Istanbul famous?
      ur: استنبول کیوں مشہور ہے؟
    options:
    - text:
        ar: كجسر بين أوروبا وآسيا وعاصمة الخلافة العثمانية
        en: as the bridge between Europe and Asia and the Ottoman caliphate seat
        ur: یورپ اور ایشیا کے درمیان پل اور عثمانی خلافت کی نشست کے طور پر
      correct: true
      why:
        ar: جمعت البيزنطي والعثماني في مدينة واحدة
        en: she joined Byzantine and Ottoman in one city
        ur: اس نے بازنطینی اور عثمانی کو ایک شہر میں جوڑا
    - text:
        ar: كأول مدينة في العالم
        en: as the world''s first city
        ur: دنیا کے پہلے شہر کے طور پر
      correct: false
      why:
        ar: سبقتها مدن قديمة كثيرة
        en: many older cities predate her
        ur: اس سے پہلے بہت سے قدیم شہر تھے
    - text:
        ar: كعاصمة أوروبا الوحيدة
        en: as Europe''s only capital
        ur: یورپ کے واحد دارالحکومت کے طور پر
      correct: false
      why:
        ar: لها عواصم كثيرة في التاريخ
        en: she is one of history''s many capitals
        ur: یہ تاریخ کے بہت سے دارالحکومتوں میں سے ہے
    - text:
        ar: كمدينة صحراوية
        en: as a desert city
        ur: صحرائی شہر کے طور پر
      correct: false
      why:
        ar: إسطنبول ساحلية على البحر
        en: Istanbul is coastal on the sea
        ur: استنبول سمندر پر ساحلی ہے
  - q:
      ar: من كتب عن إسطنبول؟
      en: Who wrote about Istanbul?
      ur: استنبول کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون عثمانيون ورحّالة أوروبيون
        en: Ottoman historians and European travellers
        ur: عثمانی مؤرخین اور یورپی سیاح
      correct: true
      why:
        ar: تصلنا روايات أوليا جلبي والرحّالة
        en: Evliya Celebi''s and travellers'' accounts reach us
        ur: اولیا چلبی اور سیاحوں کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: العرب فقط
        en: only Arabs
        ur: صرف عرب
      correct: false
      why:
        ar: كتب عنها العثمانيون والأوروبيون والعرب
        en: Ottomans, Europeans and Arabs wrote of her
        ur: عثمانیوں، یورپیوں اور عربوں نے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: إسطنبول من أكثر المدن تدوينًا
        en: Istanbul is among the most-documented cities
        ur: استنبول سب سے زیادہ لکھے جانے والے شہروں میں ہے
    - text:
        ar: المغول
        en: the Mughals
        ur: مغل
      correct: false
      why:
        ar: المغول كتبوا عن الهند لا إسطنبول
        en: the Mughals wrote of India, not Istanbul
        ur: مغلوں نے ہندوستان کے بارے میں لکھا، استنبول کے بارے میں نہیں
  - q:
      ar: ماذا جمعت إسطنبول؟
      en: What did Istanbul weave together?
      ur: استنبول نے کیا ایک ساتھ بُنا؟
    options:
    - text:
        ar: الروماني والبيزنطي والعثماني
        en: Roman, Byzantine and Ottoman
        ur: رومی، بازنطینی اور عثمانی
      correct: true
      why:
        ar: جمعت العصور الثلاثة في نسيجها
        en: she wove the three ages into her fabric
        ur: اس نے تینوں دوروں کو اپنے تانے بانے میں بُنا
    - text:
        ar: الفاطمي فقط
        en: only the Fatimid
        ur: صرف فاطمی
      correct: false
      why:
        ar: لم تحكمها الفاطمية قط
        en: the Fatimids never ruled her
        ur: فاطمیوں نے اس پر کبھی حکومت نہیں کی
    - text:
        ar: المغولي والهندي
        en: Mughal and Indian
        ur: مغلی اور ہندوستانی
      correct: false
      why:
        ar: المغولية في الهند لا إسطنبول
        en: the Mughal era is in India, not Istanbul
        ur: مغلیہ دور ہندوستان میں ہے، استنبول میں نہیں
    - text:
        ar: لا شيء؛ مدينة حديثة
        en: nothing; a modern city
        ur: کچھ نہیں؛ جدید شہر
      correct: false
      why:
        ar: جمعت إسطنبول عصورًا من التاريخ
        en: Istanbul gathered ages of history
        ur: استنبول نے تاریخ کے دور جمع کیے
  - q:
      ar: في عهد من بلغت إسطنبول أوجها؟
      en: Under whom did Istanbul peak?
      ur: استنبول کس کے دور میں عروج پر رہی؟
    options:
    - text:
        ar: سليمان القانوني
        en: Suleiman the Magnificent
        ur: سلیمان قانونی
      correct: true
      why:
        ar: تذكر المصادر ذروتها العثمانية في عهده
        en: the sources place her Ottoman peak in his reign
        ur: ماخذ اس کا عثمانی عروج اس کے دور میں رکھتے ہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: كان عبد الملك أمويًّا قبلها بقرون
        en: Abd al-Malik was Umayyad, centuries earlier
        ur: عبدالملک اموی تھا، صدیوں پہلے
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: كان هارون في بغداد لا إسطنبول
        en: Harun was in Baghdad, not Istanbul
        ur: ہارون بغداد میں تھا، استنبول میں نہیں
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسی
      correct: false
      why:
        ar: كان مانسا موسى في مالي لا إسطنبول
        en: Mansa Musa was in Mali, not Istanbul
        ur: مانسا موسی مالی میں تھا، استنبول میں نہیں
- id: salah-al-din
  anchor: person/salah-al-din-yusuf-ibn-ayyub
  band: scholars
  title:
    ar: صلاح الدين
    en: Saladin
    ur: صلاح الدین
  sixty:
    ar: 'يوسف بن أيوب الكردي، الملقّب صلاح الدين: موحّد مصر والشام ومستعيد القدس. أنهى الخلافة الفاطمية عام ١١٧١ وأعاد مصر إلى العباسيين، ثم جمع دمشق وحلب والموصل
      في جبهة واحدة ضد الصليبيين. انتصر في حطين عام ١١٨٧ واستعاد القدس بعد ثمانية وثمانين عامًا من الاحتلال، وواجه الحملة الثالثة بقيادة ريتشارد قلب الأسد حتى صلح
      الرملة ١١٩٢. مات في دمشق ١١٩٣ فقيرًا بعد أن أنفق ثروته على الجهاد والبناء: القلعة في القاهرة ومدارس في مصر والشام.'
    en: 'Yusuf ibn Ayyub the Kurd, known as Saladin: unifier of Egypt and Syria and recoverer of Jerusalem. He ended the Fatimid caliphate in 1171, returning Egypt
      to the Abbasids, then gathered Damascus, Aleppo and Mosul into one front against the Crusaders. He won at Hattin in 1187 and retook Jerusalem after eighty-eight
      years of occupation, then faced the Third Crusade under Richard the Lionheart until the peace of Ramla in 1192. He died in Damascus in 1193, poor, having spent
      his wealth on jihad and building: the Cairo citadel and schools across Egypt and Syria.'
    ur: 'کرد یوسف بن ایوب، جسے صلاح الدین کہا جاتا ہے: مصر اور شام کا متحد کرنے والا اور بیت المقدس کا واپس لینے والا۔ اس نے 1171 میں فاطمی خلافت ختم کی اور مصر کو
      عباسیوں کو واپس کیا، پھر دمشق، حلب اور موصل کو صلیبیوں کے مقابلہ ایک محاذ میں جمع کیا۔ اس نے 1187 میں حطین میں فتح پائی اور اٹھاسی سال کے قبضے کے بعد بیت المقدس
      واپس لیا، پھر رچرڈ لائن ہارٹ کی قیادت میں تیسری صلیبی مہم کا سامنا کیا جب تک 1192 میں رملہ کا صلح ہوا۔ وہ 1193 میں دمشق میں فقیر ہو کر فوت ہوا، اپنی دولت جہاد
      اور تعمیر پر خرچ کر کے: قاہرہ کا قلعہ اور مصر و شام کے مدرسے۔'
  glossary:
  - term:
      ar: يوسف بن أيوب
      en: Yusuf ibn Ayyub
      ur: یوسف بن ایوب
    gloss:
      ar: اسمه الشخصي قبل اللقب
      en: his personal name before the title
      ur: لقب سے پہلے اس کا ذاتی نام
  - term:
      ar: الكردي
      en: the Kurd
      ur: کرد
    gloss:
      ar: أصله الكردي من أرمينيا
      en: his Kurdish origin from Armenia
      ur: ارمینیا سے اس کی کرد اصلیت
  - term:
      ar: الفاطميون
      en: the Fatimids
      ur: فاطمی
    gloss:
      ar: الخلافة التي أنهاها ١١٧١
      en: the caliphate he ended in 1171
      ur: وہ خلافت جسے اس نے 1171 میں ختم کیا
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: الخلافة التي أعاد مصر إليها
      en: the caliphate he returned Egypt to
      ur: وہ خلافت جس کو اس نے مصر واپس کیا
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: معركة ١١٨٧ التي فتحت طريق القدس
      en: the 1187 battle that opened Jerusalem''s road
      ur: 1187 کی جنگ جس نے بیت المقدس کا راستہ کھولا
  - term:
      ar: ريتشارد قلب الأسد
      en: Richard the Lionheart
      ur: رچرڈ لائن ہارٹ
    gloss:
      ar: قائد الحملة الثالثة الإنكليزي
      en: the English leader of the Third Crusade
      ur: تیسری مہم کا انگریز قائد
  - term:
      ar: صلح الرملة
      en: the peace of Ramla
      ur: رملہ کا صلح
    gloss:
      ar: الاتفاق الذي أنهى الحملة الثالثة ١١٩٢
      en: the accord ending the Third Crusade in 1192
      ur: وہ معاہدہ جس نے 1192 میں تیسری مہم ختم کی
  - term:
      ar: الجهاد
      en: jihad
      ur: جہاد
    gloss:
      ar: ما أنفق عليه ثروته في المصادر
      en: what he spent his wealth on in the sources
      ur: وہ جس پر اس نے اپنی دولت خرچ کی، ماخذ میں
  - term:
      ar: القلعة
      en: the citadel
      ur: قلعہ
    gloss:
      ar: حصنه في القاهرة على المقطم
      en: his fortress in Cairo on the Muqattam
      ur: مقطم پر قاہرہ میں اس کا قلعہ
  - term:
      ar: المدارس
      en: the schools
      ur: مدرسے
    gloss:
      ar: ما بناه في مصر والشام للعلم
      en: what he built in Egypt and Syria for learning
      ur: جو اس نے علم کے لیے مصر اور شام میں بنائے
  - term:
      ar: ١١٨٧
      en: '1187'
      ur: '1187'
    gloss:
      ar: عام حطين واستعادة القدس
      en: the year of Hattin and Jerusalem''s recovery
      ur: حطین اور بیت المقدس کی واپسی کا سال
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: المدينة التي مات فيها
      en: the city he died in
      ur: وہ شہر جس میں وہ فوت ہوا
  practice:
  - q:
      ar: ما اسم صلاح الدين الحقيقي؟
      en: What was Saladin''s real name?
      ur: صلاح الدین کا اصل نام کیا تھا؟
    options:
    - text:
        ar: يوسف بن أيوب
        en: Yusuf ibn Ayyub
        ur: یوسف بن ایوب
      correct: true
      why:
        ar: يذكر المصادر اسمه قبل اللقب
        en: the sources give his name before the title
        ur: ماخذ لقب سے پہلے اس کا نام دیتے ہیں
    - text:
        ar: نور الدين
        en: Nur al-Din
        ur: نور الدین
      correct: false
      why:
        ar: كان نور الدين سيده لا اسمه
        en: Nur al-Din was his lord, not his name
        ur: نور الدین اس کا آقا تھا، نام نہیں
    - text:
        ar: عماد الدين
        en: Imad al-Din
        ur: عماد الدین
      correct: false
      why:
        ar: عماد الدين لقب أخيه لا هو
        en: Imad al-Din was his brother''s title
        ur: عماد الدین اس کے بھائی کا لقب تھا
    - text:
        ar: طغتكين
        en: Tughtekin
        ur: طغتکین
      correct: false
      why:
        ar: طغتكين حاكم دمشق قبله
        en: Tughtekin ruled Damascus before him
        ur: طغتکین اس سے پہلے دمشق کا حاکم تھا
  - q:
      ar: متى أنهى الخلافة الفاطمية؟
      en: When did he end the Fatimid caliphate?
      ur: اس نے فاطمی خلافت کب ختم کی؟
    options:
    - text:
        ar: عام ١١٧١
        en: in 1171
        ur: 1171 میں
      correct: true
      why:
        ar: تذكر المصادر إسقاط الخطبة الفاطمية ١١٧١
        en: the sources date dropping the Fatimid khutba to 1171
        ur: ماخذ فاطمی خطبہ گرانے کو 1171 لکھتے ہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام حطين لا نهاية الفاطميين
        en: that is Hattin, not the Fatimid end
        ur: یہ حطین کا سال ہے، فاطمیوں کے خاتمے کا نہیں
    - text:
        ar: عام ١١٩٢
        en: in 1192
        ur: 1192 میں
      correct: false
      why:
        ar: ذلك عام صلح الرملة
        en: that is the peace of Ramla
        ur: یہ رملہ کے صلح کا سال ہے
    - text:
        ar: عام ١٢٠٤
        en: in 1204
        ur: 1204 میں
      correct: false
      why:
        ar: مات صلاح الدين قبلها بأحد عشر عامًا
        en: Saladin died eleven years before
        ur: صلاح الدین اس سے گیارہ سال پہلے فوت ہوا
  - q:
      ar: ماذا فتحت معركة حطين؟
      en: What did the battle of Hattin open?
      ur: حطین کی جنگ نے کیا کھولا؟
    options:
    - text:
        ar: طريق استعادة القدس
        en: the road to retaking Jerusalem
        ur: بیت المقدس واپس لینے کا راستہ
      correct: true
      why:
        ar: تذكر المصادر دخوله القدس بعدها بأسابيع
        en: the sources have him enter Jerusalem weeks later
        ur: ماخذ میں وہ ہفتوں بعد بیت المقدس داخل ہوا
    - text:
        ar: طريق مصر
        en: the road to Egypt
        ur: مصر کا راستہ
      correct: false
      why:
        ar: كان يحكم مصر قبل حطين
        en: he ruled Egypt before Hattin
        ur: وہ حطین سے پہلے مصر پر حکومت کرتا تھا
    - text:
        ar: طريق الأندلس
        en: the road to al-Andalus
        ur: اندلس کا راستہ
      correct: false
      why:
        ar: حطين في فلسطين لا الأندلس
        en: Hattin is in Palestine, not al-Andalus
        ur: حطین فلسطین میں ہے، اندلس میں نہیں
    - text:
        ar: طريق بغداد
        en: the road to Baghdad
        ur: بغداد کا راستہ
      correct: false
      why:
        ar: لم تفتح حطين بغداد
        en: Hattin did not open Baghdad
        ur: حطین نے بغداد نہیں کھولا
  - q:
      ar: من قاد الحملة الثالثة ضده؟
      en: Who led the Third Crusade against him?
      ur: تیسری صلیبی مہم کی قیادت اس کے مقابلہ میں کس نے کی؟
    options:
    - text:
        ar: ريتشارد قلب الأسد
        en: Richard the Lionheart
        ur: رچرڈ لائن ہارٹ
      correct: true
      why:
        ar: تذكر المصادر ملك إنكلترا قائدًا
        en: the sources name England''s king as leader
        ur: ماخذ انگلستان کے بادشاہ کو قائد لکھتے ہیں
    - text:
        ar: نابليون
        en: Napoleon
        ur: نپولین
      correct: false
      why:
        ar: جاء نابليون بعده بستة قرون
        en: Napoleon came six centuries later
        ur: نپولین چھ صدیوں بعد آیا
    - text:
        ar: شارلمان
        en: Charlemagne
        ur: شارلمین
      correct: false
      why:
        ar: كان شارلمان قبله بقرون
        en: Charlemagne was centuries earlier
        ur: شارلمین اس سے صدیوں پہلے تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: كان هولاكو مغوليًّا لا صليبيًّا
        en: Hulagu was Mongol, not Crusader
        ur: ہلاکو مغل تھا، صلیبی نہیں
  - q:
      ar: كم بقيت القدس محتلة قبل استعادتها؟
      en: How long was Jerusalem occupied before her recovery?
      ur: بیت المقدس واپسی سے پہلے کتنی دیر مقبوضہ رہی؟
    options:
    - text:
        ar: ثمانية وثمانين عامًا
        en: eighty-eight years
        ur: اٹھاسی سال
      correct: true
      why:
        ar: من ١٠٩٩ إلى ١١٨٧ ثمانية وثمانون
        en: 1099 to 1187 is eighty-eight
        ur: 1099 سے 1187 اٹھاسی ہے
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أقلّ بكثير من المدة
        en: ten is far short of the span
        ur: دس عرصے سے کہیں کم ہے
    - text:
        ar: قرن كامل
        en: a full century
        ur: پوری صدی
      correct: false
      why:
        ar: ثمانية وثمانون لا مئة
        en: eighty-eight, not a hundred
        ur: اٹھاسی، سو نہیں
    - text:
        ar: أربعمائة عام
        en: four hundred years
        ur: چار سو سال
      correct: false
      why:
        ar: لم تدم القرون الأربعة
        en: the four centuries did not last
        ur: چار صدیاں نہیں رہیں
  - q:
      ar: أين مات صلاح الدين؟
      en: Where did Saladin die?
      ur: صلاح الدین کہاں فوت ہوا؟
    options:
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: true
      why:
        ar: تذكر المصادر وفاته في دمشق ١١٩٣
        en: the sources record his death in Damascus in 1193
        ur: ماخذ اس کی وفات 1193 میں دمشق میں لکھتے ہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: بنى فيها القلعة لكن مات في دمشق
        en: he built the citadel there but died in Damascus
        ur: اس نے وہاں قلعہ بنایا مگر دمشق میں فوت ہوا
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: استعادها لكن مات في دمشق
        en: he recovered her but died in Damascus
        ur: اس نے اسے واپس لیا مگر دمشق میں فوت ہوا
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: لم يمت في مكة
        en: he did not die in Mecca
        ur: وہ مکہ میں فوت نہیں ہوا
  - q:
      ar: ماذا بنا صلاح الدين؟
      en: What did Saladin build?
      ur: صلاح الدین نے کیا بنایا؟
    options:
    - text:
        ar: قلعة القاهرة ومدارس مصر والشام
        en: Cairo''s citadel and schools in Egypt and Syria
        ur: قاہرہ کا قلعہ اور مصر و شام کے مدرسے
      correct: true
      why:
        ar: تذكر المصادر حصنه ومدارسه
        en: the sources name his fortress and schools
        ur: ماخذ اس کے قلعہ اور مدرسوں کا ذکر کرتے ہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: بنتها الأموية قبله بخمسة قرون
        en: the Umayyads built it five centuries before him
        ur: امویوں نے اس سے پانچ صدیاں پہلے بنائی
    - text:
        ar: الحمراء
        en: the Alhambra
        ur: الحمرا
      correct: false
      why:
        ar: الحمراء في غرناطة لا الشام
        en: the Alhambra is in Granada, not Syria
        ur: الحمرا غرناطہ میں ہے، شام میں نہیں
    - text:
        ar: تاج محل
        en: the Taj Mahal
        ur: تاج محل
      correct: false
      why:
        ar: تاج محل في الهند بعده بقرون
        en: the Taj Mahal is in India, centuries later
        ur: تاج محل ہندوستان میں ہے، صدیوں بعد
  - q:
      ar: ماذا أنهى صلح الرملة؟
      en: What did the peace of Ramla end?
      ur: رملہ کے صلح نے کیا ختم کیا؟
    options:
    - text:
        ar: الحملة الثالثة ١١٩٢
        en: the Third Crusade in 1192
        ur: تیسری مہم 1192 میں
      correct: true
      why:
        ar: تذكر المصادر الصلح بينه وبين ريتشارد
        en: the sources name the accord between him and Richard
        ur: ماخذ اس کے اور رچرڈ کے درمیان معاہدہ لکھتے ہیں
    - text:
        ar: الخلافة الفاطمية
        en: the Fatimid caliphate
        ur: فاطمی خلافت
      correct: false
      why:
        ar: انتهت الفاطمية قبلها بعشرين عامًا
        en: the Fatimids ended twenty years earlier
        ur: فاطمی بیس سال پہلے ختم ہوئی
    - text:
        ar: الحرب العالمية
        en: the world war
        ur: عالمی جنگ
      correct: false
      why:
        ar: لم تكن حروب عالمية في عصره
        en: there were no world wars in his age
        ur: اس کے دور میں عالمی جنگیں نہیں تھیں
    - text:
        ar: حكم المماليك
        en: Mamluk rule
        ur: مملوکی حکومت
      correct: false
      why:
        ar: جاء المماليك بعده بعقود
        en: the Mamluks came decades later
        ur: مملوک دہائیوں بعد آئے
  - q:
      ar: ماذا يدلّ فقره عند موته؟
      en: What does his poverty at death show?
      ur: موت کے وقت اس کی فقیری کیا بتاتی ہے؟
    options:
    - text:
        ar: أنه أنفق ثروته على الجهاد والبناء
        en: that he spent his wealth on jihad and building
        ur: کہ اس نے اپنی دولت جہاد اور تعمیر پر خرچ کی
      correct: true
      why:
        ar: تذكر المصادر نفقاته لا ادخاره
        en: the sources record his spending, not saving
        ur: ماخذ اس کے خرچ کا ذکر کرتے ہیں، بچت کا نہیں
    - text:
        ar: أنه كان فقيرًا منذ الولادة
        en: that he was poor from birth
        ur: کہ وہ پیدائش سے فقیر تھا
      correct: false
      why:
        ar: جاء من أسرة عسكرية مرموقة
        en: he came from a prominent military family
        ur: وہ ایک ممتاز فوجی خاندان سے آیا
    - text:
        ar: أنه خسر ماله في التجارة
        en: that he lost his money trading
        ur: کہ اس نے تجارت میں مال کھویا
      correct: false
      why:
        ar: لم يكن تاجرًا بل قائدًا
        en: he was a commander, not a trader
        ur: وہ تاجر نہیں، سردار تھا
    - text:
        ar: أن الناس سرقوا ماله
        en: that people stole his money
        ur: کہ لوگوں نے اس کا مال چرایا
      correct: false
      why:
        ar: تذكر المصادر إنفاقه لا السرقة
        en: the sources record spending, not theft
        ur: ماخذ خرچ کا ذکر کرتے ہیں، چوری کا نہیں
  - q:
      ar: لماذا يعدّ صلاح الدين مهمًّا؟
      en: Why is Saladin important?
      ur: صلاح الدین کیوں اہم ہے؟
    options:
    - text:
        ar: لوحدته الجبهة واستعادته القدس
        en: for uniting the front and recovering Jerusalem
        ur: محاذ متحد کرنے اور بیت المقدس واپس لینے کے لیے
      correct: true
      why:
        ar: جمع مصر والشام واستعاد المدينة في المصادر
        en: the sources have him join Egypt and Syria and retake the city
        ur: ماخذ میں اس نے مصر اور شام کو جوڑا اور شہر واپس لیا
    - text:
        ar: لأنه أول سلطان عثماني
        en: because he was the first Ottoman sultan
        ur: کیونکہ وہ پہلا عثمانی سلطان تھا
      correct: false
      why:
        ar: كان قبل العثمانيين بقرنين ونصف
        en: he was two and a half centuries before the Ottomans
        ur: وہ عثمانیوں سے ڈھائی صدی پہلے تھا
    - text:
        ar: لأنه غزا أوروبا
        en: because he invaded Europe
        ur: کیونکہ اس نے یورپ پر حملہ کیا
      correct: false
      why:
        ar: لم يغزُ أوروبا بل قاتل في بلاده
        en: he did not invade Europe; he fought in his lands
        ur: اس نے یورپ پر حملہ نہیں کیا، اپنے ملکوں میں لڑا
    - text:
        ar: لأنه كتب القرآن
        en: because he wrote the Qur''an
        ur: کیونکہ اس نے قرآن لکھا
      correct: false
      why:
        ar: لم يكتب قرآنًا بل كان قائدًا
        en: he was a commander, not a writer of scripture
        ur: وہ سردار تھا، صحیفہ لکھنے والا نہیں
- id: mansa-musa
  anchor: person/mansa-musa
  band: researchers
  title:
    ar: مانسا موسى
    en: Mansa Musa
    ur: مانسا موسی
  sixty:
    ar: 'مانسا موسى ملك مالي، أغنى حاكم في ذاكرة التاريخ: حجّ إلى مكة عام ١٣٢٤ في موكب قيل إنه ضمّ ستين ألفًا وثمانين بعيرًا من الذهب، حتى خفّض سعر الذهب في القاهرة
      سنين. أنفق على طريق الحج، وبنى مسجد جنكربر في تمبكتو وجلب العلماء والمعماريين إلى مملكته. جعل إمبراطوريته على طرق الملح والذهب أغنى دول أفريقيا الغربية، وظهرت
      مملكته على خريطة كتالانية عام ١٣٧٥ يحمل قطعة ذهب. مات ١٣٣٧ تاركًا مملكة تقاس بالعالم الإسلامي والأوروبي معًا.'
    en: 'Mansa Musa, king of Mali, the richest ruler in the memory of history: he made the Hajj to Mecca in 1324 in a caravan said to number sixty thousand and eighty
      camel-loads of gold, lowering the price of gold in Cairo for years. He spent along the pilgrimage road, built the Djinguereber mosque in Timbuktu and brought
      scholars and architects to his kingdom. He made his empire on the salt-and-gold roads the richest state in West Africa, and his realm appeared on the 1375 Catalan
      map holding a nugget of gold. He died in 1337 leaving a kingdom measured against the Islamic and European worlds alike.'
    ur: 'مانسا موسی، مالی کا بادشاہ، تاریخ کی یادداشت میں امیر ترین حکمران: اس نے 1324 میں مکہ کا حج ایک ایسے قافلے میں کیا جس میں کہا جاتا ہے ساٹھ ہزار افراد اور
      اسی اونٹوں کا سونا تھا، جس نے قاہرہ میں سونے کی قیمت برسوں گرا دی۔ اس نے حج کی راہ پر خرچ کیا، تمبکٹو میں جنگربر مسجد بنائی اور علماء اور معماروں کو اپنی سلطنت
      میں لایا۔ اس نے اپنی سلطنت کو نمک اور سونے کی راہوں پر مغربی افریقہ کی امیر ترین ریاست بنایا، اور اس کی سلطنت 1375 کے کیٹلن نقشے پر سونے کا ٹکڑا تھامے دکھائی
      دیتی ہے۔ وہ 1337 میں فوت ہوا، ایک ایسی سلطنت چھوڑ کر جو اسلامی اور یورپی دنیا کے ساتھ ناپی جائے۔'
  glossary:
  - term:
      ar: مانسا
      en: Mansa
      ur: مانسا
    gloss:
      ar: لقب ملك مالي
      en: the title of Mali''s king
      ur: مالی کے بادشاہ کا لقب
  - term:
      ar: مالي
      en: Mali
      ur: مالی
    gloss:
      ar: مملكته في أفريقيا الغربية
      en: his kingdom in West Africa
      ur: مغربی افریقہ میں اس کی سلطنت
  - term:
      ar: ١٣٢٤
      en: '1324'
      ur: '1324'
    gloss:
      ar: عام حجّه المشهور
      en: the year of his famous Hajj
      ur: اس کے مشہور حج کا سال
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: رحلته إلى مكة التي ذكرته المصادر
      en: his journey to Mecca the sources record
      ur: وہ سفر مکہ کا جو ماخذ نے لکھا
  - term:
      ar: الذهب
      en: the gold
      ur: سونا
    gloss:
      ar: ثروة مملكته التي خفّضت سعر المعدن
      en: his kingdom''s wealth that lowered the metal''s price
      ur: اس کی سلطنت کی دولت جس نے دھات کی قیمت گرا دی
  - term:
      ar: القاهرة
      en: Cairo
      ur: قاہرہ
    gloss:
      ar: المدينة التي مرّ بها وأنفق فيها
      en: the city he passed through and spent in
      ur: وہ شہر جس سے وہ گزرا اور جس میں خرچ کیا
  - term:
      ar: تمبكتو
      en: Timbuktu
      ur: تمبکٹو
    gloss:
      ar: مدينته التي بنى فيها جنكربر
      en: his city where he built Djinguereber
      ur: اس کا شہر جس میں اس نے جنگربر بنائی
  - term:
      ar: جنكربر
      en: Djinguereber
      ur: جنگربر
    gloss:
      ar: مسجد تمبكتو الذي بنّاه
      en: the Timbuktu mosque he built
      ur: تمبکٹو کی وہ مسجد جو اس نے بنائی
  - term:
      ar: الملح
      en: the salt
      ur: نمک
    gloss:
      ar: بضاعة طرق مملكته مع الذهب
      en: his kingdom''s trade goods with gold
      ur: سونے کے ساتھ اس کی سلطنت کی تجارتی جنس
  - term:
      ar: الكتالانية
      en: the Catalan
      ur: کیٹلن
    gloss:
      ar: الخريطة التي ظهرت عليها مملكته ١٣٧٥
      en: the map his kingdom appeared on in 1375
      ur: وہ نقشہ جس پر اس کی سلطنت 1375 میں دکھائی دی
  - term:
      ar: العلماء
      en: the scholars
      ur: علماء
    gloss:
      ar: من جلبهم إلى مملكته
      en: those he brought to his kingdom
      ur: وہ جنہیں وہ اپنی سلطنت میں لایا
  - term:
      ar: ١٣٣٧
      en: '1337'
      ur: '1337'
    gloss:
      ar: عام وفاته
      en: the year of his death
      ur: اس کی وفات کا سال
  practice:
  - q:
      ar: من مانسا موسى؟
      en: Who was Mansa Musa?
      ur: مانسا موسی کون تھا؟
    options:
    - text:
        ar: ملك مالي وأغنى حاكم في الذاكرة
        en: Mali''s king and the richest ruler in memory
        ur: مالی کا بادشاہ اور یادداشت میں امیر ترین حکمران
      correct: true
      why:
        ar: تصفه المصادر بأغنى ملوك عصره
        en: the sources call him the richest king of his age
        ur: ماخذ اسے اپنے دور کا امیر ترین بادشاہ کہتے ہیں
    - text:
        ar: سلطان عثماني
        en: an Ottoman sultan
        ur: عثمانی سلطان
      correct: false
      why:
        ar: كان أفريقيًّا لا عثمانيًّا
        en: he was African, not Ottoman
        ur: وہ افریقی تھا، عثمانی نہیں
    - text:
        ar: تاجر إيطالي
        en: an Italian trader
        ur: اطالوی تاجر
      correct: false
      why:
        ar: كان ملكًا لا تاجرًا
        en: he was a king, not a trader
        ur: وہ بادشاہ تھا، تاجر نہیں
    - text:
        ar: رحّالة صيني
        en: a Chinese traveller
        ur: چینی مسافر
      correct: false
      why:
        ar: كان ملك مالي لا رحّالة
        en: he was Mali''s king, not a traveller
        ur: وہ مالی کا بادشاہ تھا، مسافر نہیں
  - q:
      ar: متى حجّ إلى مكة؟
      en: When did he make the Hajj to Mecca?
      ur: اس نے مکہ کا حج کب کیا؟
    options:
    - text:
        ar: عام ١٣٢٤
        en: in 1324
        ur: 1324 میں
      correct: true
      why:
        ar: تذكر المصادر موكبه في القاهرة ذلك العام
        en: the sources place his caravan in Cairo that year
        ur: ماخذ اس سال قاہرہ میں اس کا قافلہ رکھتے ہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا حجّه
        en: that is Acre''s fall, not his Hajj
        ur: یہ عکہ کے گرنے کا سال ہے، اس کے حج کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية
        en: that is Constantinople''s conquest
        ur: یہ قسطنطنیہ کی فتح کا سال ہے
    - text:
        ar: لم يحجّ أبدًا
        en: he never made Hajj
        ur: اس نے کبھی حج نہیں کیا
      correct: false
      why:
        ar: حجّه من أشهر المواكب في التاريخ
        en: his Hajj is among history''s most famous processions
        ur: اس کا حج تاریخ کے مشہور ترین جلوسوں میں ہے
  - q:
      ar: ماذا فعل موكبه بسعر الذهب؟
      en: What did his caravan do to gold''s price?
      ur: اس کے قافلے نے سونے کی قیمت کا کیا کیا؟
    options:
    - text:
        ar: خفّضه في القاهرة لسنين
        en: lowered it in Cairo for years
        ur: قاہرہ میں برسوں کے لیے گرا دیا
      correct: true
      why:
        ar: تذكر المصادر كثرة إنفاقه أثّرت في السوق
        en: the sources say his spending affected the market
        ur: ماخذ کہتے ہیں اس کے خرچ نے بازار پر اثر ڈالا
    - text:
        ar: رفعه ضعفين
        en: doubled it
        ur: دو گنا بڑھا دیا
      correct: false
      why:
        ar: انخفض السعر لكثرة الذهب لا ارتفع
        en: the price fell for gold''s abundance
        ur: بہت زیادہ سونے کی وجہ سے قیمت گری
    - text:
        ar: لم يؤثّر
        en: no effect
        ur: کوئی اثر نہیں
      correct: false
      why:
        ar: أثّر إنفاقه في سوق الذهب
        en: his spending moved the gold market
        ur: اس کے خرچ نے سونے کی مارکیٹ ہلائی
    - text:
        ar: ألغى الذهب
        en: abolished gold
        ur: سونا ختم کر دیا
      correct: false
      why:
        ar: لم يلغِ المعدن بل أنفق منه
        en: he did not abolish the metal, he spent it
        ur: اس نے دھات ختم نہیں کی، خرچ کی
  - q:
      ar: ماذا بنا في تمبكتو؟
      en: What did he build in Timbuktu?
      ur: اس نے تمبکٹو میں کیا بنایا؟
    options:
    - text:
        ar: مسجد جنكربر
        en: the Djinguereber mosque
        ur: جنگربر مسجد
      correct: true
      why:
        ar: تنسب المصادر بناءه إليه في المصادر
        en: the sources credit the building to him
        ur: ماخذ تعمیر اس سے منسوب کرتے ہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: قبة الصخرة في القدس لا تمبكتو
        en: the Dome of the Rock is in Jerusalem, not Timbuktu
        ur: گنبدِ صخرہ بیت المقدس میں ہے، تمبکٹو میں نہیں
    - text:
        ar: الحمراء
        en: the Alhambra
        ur: الحمرا
      correct: false
      why:
        ar: الحمراء في الأندلس لا أفريقيا
        en: the Alhambra is in al-Andalus, not Africa
        ur: الحمرا اندلس میں ہے، افریقہ میں نہیں
    - text:
        ar: القلعة
        en: the citadel
        ur: قلعہ
      correct: false
      why:
        ar: القلعة في القاهرة لا تمبكتو
        en: the citadel is in Cairo, not Timbuktu
        ur: قلعہ قاہرہ میں ہے، تمبکٹو میں نہیں
  - q:
      ar: من جلب إلى مملكته؟
      en: Whom did he bring to his kingdom?
      ur: وہ اپنی سلطنت میں کسے لایا؟
    options:
    - text:
        ar: العلماء والمعماريين
        en: scholars and architects
        ur: علماء اور معمار
      correct: true
      why:
        ar: تذكر المصادر من جاء معه من حجّه
        en: the sources name those who came with him from his Hajj
        ur: ماخذ ان لوگوں کا ذکر کرتے ہیں جو اس کے حج سے ساتھ آئے
    - text:
        ar: الجنود الفرنجة
        en: Frankish soldiers
        ur: فرنگی سپاہی
      correct: false
      why:
        ar: لم يجلب فرنجة بل علماء
        en: he brought scholars, not Franks
        ur: وہ فرنگی نہیں، علماء لایا
    - text:
        ar: التجار الصينيين
        en: Chinese traders
        ur: چینی تاجر
      correct: false
      why:
        ar: جلب العلماء لا التجار الصينيين
        en: he brought scholars, not Chinese traders
        ur: وہ علماء لایا، چینی تاجر نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: جلب العلماء والمعماريين في المصادر
        en: the sources have him bring scholars and architects
        ur: ماخذ میں وہ علماء اور معمار لایا
  - q:
      ar: على ماذا قامت ثروة مملكته؟
      en: What did his kingdom''s wealth stand on?
      ur: اس کی سلطنت کی دولت کس پر قائم تھی؟
    options:
    - text:
        ar: طرق الملح والذهب
        en: the salt-and-gold roads
        ur: نمک اور سونے کی راہیں
      correct: true
      why:
        ar: جمعت تجارة الصحراء ثروته في المصادر
        en: desert trade gathered his wealth in the sources
        ur: صحرائی تجارت نے ماخذ میں اس کی دولت جمع کی
    - text:
        ar: صيد الحيتان
        en: whale hunting
        ur: وہیل کا شکار
      correct: false
      why:
        ar: مالي صحراوية لا بحرية
        en: Mali is desert, not coastal
        ur: مالی صحرائی ہے، ساحلی نہیں
    - text:
        ar: النفط
        en: oil
        ur: تیل
      correct: false
      why:
        ar: لم يكن النفط بضاعة عصره
        en: oil was not his age''s goods
        ur: تیل اس کے دور کی جنس نہیں تھی
    - text:
        ar: الحرير
        en: silk
        ur: ریشم
      correct: false
      why:
        ar: كانت تجارته ملحًا وذهبًا لا حريرًا
        en: his trade was salt and gold, not silk
        ur: اس کی تجارت نمک اور سونا تھی، ریشم نہیں
  - q:
      ar: أين ظهرت مملكته عام ١٣٧٥؟
      en: Where did his kingdom appear in 1375?
      ur: اس کی سلطنت 1375 میں کہاں دکھائی دی؟
    options:
    - text:
        ar: على الخريطة الكتالانية
        en: on the Catalan map
        ur: کیٹلن نقشے پر
      correct: true
      why:
        ar: يظهر على الخريطة يحمل ذهبًا
        en: he appears on the map holding gold
        ur: وہ نقشے پر سونا تھامے دکھائی دیتا ہے
    - text:
        ar: على عملة رومانية
        en: on a Roman coin
        ur: رومی سکہ پر
      correct: false
      why:
        ar: لم تسكّ روما عملة له
        en: Rome minted no coin of him
        ur: روم نے اس کا سکہ نہیں ڈھالا
    - text:
        ar: في كتاب صيني
        en: in a Chinese book
        ur: چینی کتاب میں
      correct: false
      why:
        ar: ظهرت على الخريطة الكتالانية لا الصينية
        en: it appeared on the Catalan, not Chinese, map
        ur: یہ کیٹلن نقشے پر دکھائی دی، چینی پر نہیں
    - text:
        ar: في معرض باريس
        en: in a Paris exhibition
        ur: پیرس کی نمائش میں
      correct: false
      why:
        ar: الخريطة قبل المعارض الحديثة
        en: the map predates modern exhibitions
        ur: نقشہ جدید نمائشوں سے پہلے کا ہے
  - q:
      ar: متى مات؟
      en: When did he die?
      ur: وہ کب فوت ہوا؟
    options:
    - text:
        ar: عام ١٣٣٧
        en: in 1337
        ur: 1337 میں
      correct: true
      why:
        ar: تذكر المصادر وفاته نحو ١٣٣٧
        en: the sources date his death about 1337
        ur: ماخذ اس کی وفات تقریباً 1337 لکھتے ہیں
    - text:
        ar: عام ١٣٢٤
        en: in 1324
        ur: 1324 میں
      correct: false
      why:
        ar: ذلك عام حجّه لا وفاته
        en: that is his Hajj year, not his death
        ur: یہ اس کے حج کا سال ہے، وفات کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك بعد موته بأكثر من قرن
        en: that is over a century after his death
        ur: یہ اس کی وفات سے ایک صدی سے زیادہ بعد ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر كسائر الناس
        en: he died in the sources like all people
        ur: وہ ماخذ میں سب کی طرح فوت ہوا
  - q:
      ar: لماذا يهمّ حجّه؟
      en: Why does his Hajj matter?
      ur: اس کا حج کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه وصل مالي بالعالم الإسلامي وأظهر ثروتها
        en: because it linked Mali to the Islamic world and showed her wealth
        ur: کیونکہ اس نے مالی کو اسلامی دنیا سے جوڑا اور اس کی دولت دکھائی
      correct: true
      why:
        ar: ظهر موكبه في القاهرة ومصر والخرائط
        en: his caravan showed in Cairo and on maps
        ur: اس کا قافلہ قاہرہ اور نقشوں پر دکھائی دیا
    - text:
        ar: لأنه أول حجّ في التاريخ
        en: because it was history''s first Hajj
        ur: کیونکہ یہ تاریخ کا پہلا حج تھا
      correct: false
      why:
        ar: حجّ الناس قبله بقرون
        en: people made Hajj centuries before him
        ur: لوگ اس سے صدیوں پہلے حج کرتے تھے
    - text:
        ar: لأنه اكتشف الذهب
        en: because he discovered gold
        ur: کیونکہ اس نے سونا دریافت کیا
      correct: false
      why:
        ar: كان الذهب معروفًا قبله
        en: gold was known before him
        ur: سونا اس سے پہلے معروف تھا
    - text:
        ar: لا أهمية له
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: يذكره المؤرخون والخرائط
        en: historians and maps record him
        ur: مؤرخین اور نقشے اسے لکھتے ہیں
  - q:
      ar: من كتب عن مانسا موسى؟
      en: Who wrote about Mansa Musa?
      ur: مانسا موسی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو مصر والمغرب ورحّالة
        en: Egyptian and Maghrebi historians and travellers
        ur: مصری اور مغربی مؤرخین اور مسافر
      correct: true
      why:
        ar: تصلنا روايات العمري وابن خلدون
        en: al-Umari''s and Ibn Khaldun''s accounts reach us
        ur: عمری اور ابن خلدون کی روایتیں ہم تک پہنچیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقه مؤرخو عصره
        en: his age''s historians documented him
        ur: اس کے دور کے مؤرخین نے اسے ثبت کیا
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: كتب عنه العرب والأوروبيون
        en: Arabs and Europeans wrote of him
        ur: عرب اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: كتب المؤرخون العرب عنه قبل العثمانيين
        en: Arab historians wrote of him before the Ottomans
        ur: عرب مؤرخین نے عثمانیوں سے پہلے لکھا
- id: fatima-al-fihri
  anchor: person/fatima-al-fihri
  band: scholars
  title:
    ar: فاطمة الفهرية
    en: Fatima al-Fihri
    ur: فاطمہ الفہری
  sixty:
    ar: 'فاطمة الفهرية، تاجرة من القيروان انتقلت إلى فاس في القرن التاسع: ورثت ثروة من والدها وأنفقتها كلها على بناء مسجد القرويين عام ٨٥٩، فصار أقدم جامعة مستمرة
      في العالم بحسب اليونسكو وغينيس. صامت حتى اكتمل البناء، وجعلت المسجد مدرسة للفقه والنحو والمنطق والفلك والطب. خرّج القرويين مؤرخين مثل ابن خلدون وفلاسفة مثل
      ابن رشد وابن ميمون، وبقي منارة العلم المغربي ألف عام. ماتت ٨٨٠ تاركة إرثًا لم يُقَدّر بمال بل بعلم.'
    en: 'Fatima al-Fihri, a merchant from Kairouan who moved to Fez in the ninth century: she inherited wealth from her father and spent it all building the al-Qarawiyyin
      mosque in 859, which UNESCO and Guinness rank as the world''''s oldest continuously operating university. She fasted until the building was finished, and she
      made the mosque a school of jurisprudence, grammar, logic, astronomy and medicine. Al-Qarawiyyin graduated historians like Ibn Khaldun and philosophers like
      Ibn Rushd and Maimonides, and it stayed Morocco''''s beacon of learning for a thousand years. She died in 880 leaving a legacy measured not in money but in
      learning.'
    ur: 'فاطمہ الفہری، قیروان کی ایک تاجر خاتون جو نویں صدی میں فاس منتقل ہوئی: اس نے والد سے وراثت میں دولت پائی اور وہ سب 859 میں مسجد القرویین بنانے پر خرچ کی،
      جسے یونیسکو اور گنیز دنیا کا قدیم ترین مسلسل چلنے والا جامعہ کہتے ہیں۔ وہ تعمیر مکمل ہونے تک روزے رکھتی رہی، اور اس نے مسجد کو فقہ، نحو، منطق، فلکیات اور طب
      کا مدرسہ بنایا۔ القرویین نے ابن خلدون جیسے مؤرخین اور ابن رشد اور میمونیدس جیسے فلاسفہ پیدا کیے، اور یہ ایک ہزار سال مراکش کے علم کی مینار رہی۔ وہ 880 میں فوت
      ہوئی، ایک ایسا ورثہ چھوڑ کر جو مال سے نہیں بلکہ علم سے ناپا جاتا ہے۔'
  glossary:
  - term:
      ar: القيروان
      en: Kairouan
      ur: قیروان
    gloss:
      ar: مدينتها الأصلية في تونس
      en: her original city in Tunisia
      ur: تونس میں اس کا اصل شہر
  - term:
      ar: فاس
      en: Fez
      ur: فاس
    gloss:
      ar: المدينة التي انتقلت إليها وبنت فيها
      en: the city she moved to and built in
      ur: وہ شہر جہاں وہ منتقل ہوئی اور جہاں اس نے بنایا
  - term:
      ar: القرويين
      en: al-Qarawiyyin
      ur: قرویین
    gloss:
      ar: مسجدها وجامعتها التي بنّت
      en: her mosque and university she built
      ur: اس کی مسجد اور جامعہ جسے اس نے بنایا
  - term:
      ar: ٨٥٩
      en: '859'
      ur: '859'
    gloss:
      ar: عام بناء المسجد
      en: the year of the mosque''s building
      ur: مسجد کی تعمیر کا سال
  - term:
      ar: اليونسكو
      en: UNESCO
      ur: یونیسکو
    gloss:
      ar: الهيئة التي صنّفتها أقدم جامعة
      en: the body that ranked it the oldest university
      ur: وہ ادارہ جس نے اسے قدیم ترین جامعہ قرار دیا
  - term:
      ar: ابن خلدون
      en: Ibn Khaldun
      ur: ابن خلدون
    gloss:
      ar: مؤرخ خرّجه القرويين
      en: a historian al-Qarawiyyin graduated
      ur: وہ مؤرخ جسے قرویین نے تیار کیا
  - term:
      ar: ابن رشد
      en: Ibn Rushd
      ur: ابن رشد
    gloss:
      ar: فيلسوف درس فيها
      en: a philosopher who studied there
      ur: وہ فلسفی جس نے وہاں پڑھا
  - term:
      ar: ابن ميمون
      en: Maimonides
      ur: میمونیدس
    gloss:
      ar: فيلسوف ارتبط بها في الذاكرة
      en: a philosopher tied to her in memory
      ur: وہ فلسفی جو یادداشت میں اس سے جڑا
  - term:
      ar: الفقه
      en: jurisprudence
      ur: فقہ
    gloss:
      ar: أحد علوم مدرستها
      en: one of her school''s sciences
      ur: اس کے مدرسے کے علوم میں سے ایک
  - term:
      ar: الفلك
      en: astronomy
      ur: فلکیات
    gloss:
      ar: علم السماء الذي دُرّس فيها
      en: the sky-science taught in her
      ur: وہ آسمان کا علم جو اس میں پڑھایا گیا
  - term:
      ar: ٨٨٠
      en: '880'
      ur: '880'
    gloss:
      ar: عام وفاتها
      en: the year of her death
      ur: اس کی وفات کا سال
  - term:
      ar: الصوم
      en: the fast
      ur: روزہ
    gloss:
      ar: ما صامت حتى اكتمل البناء
      en: what she fasted until the building finished
      ur: وہ روزہ جو اس نے تعمیر مکمل ہونے تک رکھا
  practice:
  - q:
      ar: من فاطمة الفهرية؟
      en: Who was Fatima al-Fihri?
      ur: فاطمہ الفہری کون تھی؟
    options:
    - text:
        ar: تاجرة بنت أقدم جامعة مستمرة
        en: a merchant who built the oldest continuous university
        ur: ایک تاجر خاتون جس نے قدیم ترین مسلسل جامعہ بنایا
      correct: true
      why:
        ar: تنسب المصادر بناء القرويين إليها
        en: the sources credit al-Qarawiyyin to her
        ur: ماخذ قرویین کو اس سے منسوب کرتے ہیں
    - text:
        ar: ملكة الأندلس
        en: the queen of al-Andalus
        ur: اندلس کی ملکہ
      correct: false
      why:
        ar: كانت تاجرة لا ملكة
        en: she was a merchant, not a queen
        ur: وہ تاجر تھی، ملکہ نہیں
    - text:
        ar: عالمة عباسية
        en: an Abbasid scholar
        ur: عباسی عالمہ
      correct: false
      why:
        ar: كانت في المغرب لا بغداد
        en: she was in Morocco, not Baghdad
        ur: وہ مراکش میں تھی، بغداد میں نہیں
    - text:
        ar: محاربة
        en: a warrior
        ur: سپاہی
      correct: false
      why:
        ar: كانت بانية مسجد لا محاربة
        en: she was a mosque-builder, not a warrior
        ur: وہ مسجد بنانے والی تھی، سپاہی نہیں
  - q:
      ar: متى بنّت القرويين؟
      en: When did she build al-Qarawiyyin?
      ur: اس نے قرویین کب بنایا؟
    options:
    - text:
        ar: عام ٨٥٩
        en: in 859
        ur: 859 میں
      correct: true
      why:
        ar: تذكر المصادر البناء في منتصف القرن التاسع
        en: the sources date the building mid-ninth century
        ur: ماخذ تعمیر نویں صدی کے وسط میں لکھتے ہیں
    - text:
        ar: عام ٦٩١
        en: in 691
        ur: 691 میں
      correct: false
      why:
        ar: ذلك عام قبة الصخرة لا القرويين
        en: that is the Dome''s year, not al-Qarawiyyin''s
        ur: یہ گنبد کا سال ہے، قرویین کا نہیں
    - text:
        ar: عام ١١٧١
        en: in 1171
        ur: 1171 میں
      correct: false
      why:
        ar: ذلك بعد بنائها بثلاثة قرون
        en: that is three centuries after her building
        ur: یہ اس کی تعمیر سے تین صدیاں بعد ہے
    - text:
        ar: لم تبنِ مسجدًا
        en: she built no mosque
        ur: اس نے کوئی مسجد نہیں بنائی
      correct: false
      why:
        ar: بنّت القرويين في المصادر
        en: the sources have her build al-Qarawiyyin
        ur: ماخذ میں اس نے قرویین بنایا
  - q:
      ar: أين القرويين؟
      en: Where is al-Qarawiyyin?
      ur: قرویین کہاں ہے؟
    options:
    - text:
        ar: في فاس بالمغرب
        en: in Fez, Morocco
        ur: مراکش میں فاس
      correct: true
      why:
        ar: تقف المدينة في شمال أفريقيا في المصادر
        en: the sources place the city in North Africa
        ur: ماخذ شہر کو شمالی افریقہ میں رکھتے ہیں
    - text:
        ar: في القيروان
        en: in Kairouan
        ur: قیروان میں
      correct: false
      why:
        ar: القيروان مدينتها الأصلية لا مكان المسجد
        en: Kairouan is her home city, not the mosque''s place
        ur: قیروان اس کا اصل شہر ہے، مسجد کی جگہ نہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: القرويين في المغرب لا مصر
        en: al-Qarawiyyin is in Morocco, not Egypt
        ur: قرویین مراکش میں ہے، مصر میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: القرويين في فاس لا دمشق
        en: al-Qarawiyyin is in Fez, not Damascus
        ur: قرویین فاس میں ہے، دمشق میں نہیں
  - q:
      ar: من أين جاءت ثروتها؟
      en: Where did her wealth come from?
      ur: اس کی دولت کہاں سے آئی؟
    options:
    - text:
        ar: وراثة من والدها التاجر
        en: an inheritance from her merchant father
        ur: اس کے تاجر والد کی وراثت
      correct: true
      why:
        ar: أنفقت ما ورثته على البناء في المصادر
        en: the sources have her spend the inheritance on building
        ur: ماخذ میں اس نے وراثت تعمیر پر خرچ کی
    - text:
        ar: من زواج
        en: from a marriage
        ur: شادی سے
      correct: false
      why:
        ar: كانت الثروة وراثة لا زواج
        en: the wealth was inheritance, not marriage
        ur: دولت وراثت تھی، شادی نہیں
    - text:
        ar: من غنيمة حرب
        en: from war spoils
        ur: جنگ کی غنیمت سے
      correct: false
      why:
        ar: لم تكن غنيمة بل وراثة
        en: it was inheritance, not spoils
        ur: یہ وراثت تھی، غنیمت نہیں
    - text:
        ar: من التجارة البحرية
        en: from sea trade
        ur: بحری تجارت سے
      correct: false
      why:
        ar: كانت الثروة وراثة أب
        en: the wealth was a father''s inheritance
        ur: دولت باپ کی وراثت تھی
  - q:
      ar: ماذا فعلت أثناء البناء؟
      en: What did she do during the building?
      ur: تعمیر کے دوران اس نے کیا کیا؟
    options:
    - text:
        ar: صامت حتى اكتمل
        en: she fasted until it finished
        ur: تعمیر مکمل ہونے تک روزے رکھے
      correct: true
      why:
        ar: تذكر الذاكرة صومها حتى الفراغ
        en: memory records her fasting to the end
        ur: یادداشت میں اس کے روزے آخر تک لکھے گئے
    - text:
        ar: سافرت للحج
        en: she travelled for Hajj
        ur: اس نے حج کا سفر کیا
      correct: false
      why:
        ar: تذكر المصادر صومها لا سفرها
        en: the sources record her fast, not travel
        ur: ماخذ اس کا روزہ لکھتے ہیں، سفر نہیں
    - text:
        ar: أوقفت البناء
        en: she stopped the building
        ur: اس نے تعمیر روکی
      correct: false
      why:
        ar: أكملت البناء في المصادر
        en: the sources have her complete it
        ur: ماخذ میں اس نے اسے مکمل کیا
    - text:
        ar: غيرت موقع المسجد
        en: she changed the site
        ur: اس نے مسجد کی جگہ بدلی
      correct: false
      why:
        ar: لم تغيّر الموقع في المصادر
        en: the sources have no site change
        ur: ماخذ میں جگہ کی تبدیلی نہیں
  - q:
      ar: من خرّج القرويين؟
      en: Whom did al-Qarawiyyin graduate?
      ur: قرویین نے کسے تیار کیا؟
    options:
    - text:
        ar: ابن خلدون وابن رشد وابن ميمون
        en: Ibn Khaldun, Ibn Rushd and Maimonides
        ur: ابن خلدون، ابن رشد اور میمونیدس
      correct: true
      why:
        ar: تربط الذاكرة هؤلاء بالقرويين
        en: memory ties these figures to al-Qarawiyyin
        ur: یادداشت انہیں قرویین سے جوڑتی ہے
    - text:
        ar: نيوتن وغاليليو
        en: Newton and Galileo
        ur: نیوٹن اور گلیلیو
      correct: false
      why:
        ar: كانوا أوروبيين لا في فاس
        en: they were European, not in Fez
        ur: وہ یورپی تھے، فاس میں نہیں
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: كان في إسطنبول لا فاس
        en: he was in Istanbul, not Fez
        ur: وہ استنبول میں تھا، فاس میں نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: خرّجت المدرسة أجيالًا من العلماء
        en: the school graduated generations of scholars
        ur: مدرسے نے نسلوں کے علماء تیار کیے
  - q:
      ar: ماذا دُرّس في القرويين؟
      en: What was taught at al-Qarawiyyin?
      ur: قرویین میں کیا پڑھایا گیا؟
    options:
    - text:
        ar: الفقه والنحو والمنطق والفلك والطب
        en: jurisprudence, grammar, logic, astronomy and medicine
        ur: فقہ، نحو، منطق، فلکیات اور طب
      correct: true
      why:
        ar: تذكر المصادر علوم مدرستها المتنوعة
        en: the sources name her school''s varied sciences
        ur: ماخذ اس کے مدرسے کے متنوع علوم کا ذکر کرتے ہیں
    - text:
        ar: الفقه فقط
        en: jurisprudence only
        ur: صرف فقہ
      correct: false
      why:
        ar: شملت علومًا عدة لا فقهًا فقط
        en: it covered several sciences, not just fiqh
        ur: اس میں کئی علوم شامل تھے، صرف فقہ نہیں
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: كانت مدرسة كاملة العلوم
        en: it was a full school of sciences
        ur: یہ مکمل علوم کا مدرسہ تھا
    - text:
        ar: الفن الحديث
        en: modern art
        ur: جدید فن
      correct: false
      why:
        ar: كانت علوم شرعية وعقلية قديمة
        en: its sciences were classical, not modern art
        ur: اس کے علوم کلاسیکی تھے، جدید فن نہیں
  - q:
      ar: ما مكانة القرويين؟
      en: What is al-Qarawiyyin''s standing?
      ur: قرویین کی کیا حیثیت ہے؟
    options:
    - text:
        ar: أقدم جامعة مستمرة بحسب اليونسكو
        en: the oldest continuous university per UNESCO
        ur: یونیسکو کے مطابق قدیم ترین مسلسل جامعہ
      correct: true
      why:
        ar: تصنّفها الهيئات الدولية أقدم جامعة
        en: international bodies rank it the oldest university
        ur: بین الاقوامی ادارے اسے قدیم ترین جامعہ کہتے ہیں
    - text:
        ar: أكبر مسجد في العالم
        en: the world''s largest mosque
        ur: دنیا کی سب سے بڑی مسجد
      correct: false
      why:
        ar: لم تكن أكبر بل أقدم
        en: it is oldest, not largest
        ur: یہ سب سے پرانا ہے، سب سے بڑا نہیں
    - text:
        ar: جامعة جديدة
        en: a new university
        ur: نیا جامعہ
      correct: false
      why:
        ar: قامت قبل ألف عام لا حديثًا
        en: it stood a thousand years ago, not recently
        ur: یہ ہزار سال پہلے قائم ہوا، حال میں نہیں
    - text:
        ar: متحف فقط
        en: only a museum
        ur: صرف عجائب گھر
      correct: false
      why:
        ar: بقيت جامعة عاملة لا متحفًا
        en: it stayed a working university, not a museum
        ur: یہ چلتا جامعہ رہا، عجائب گھر نہیں
  - q:
      ar: متى ماتت؟
      en: When did she die?
      ur: وہ کب فوت ہوئی؟
    options:
    - text:
        ar: عام ٨٨٠
        en: in 880
        ur: 880 میں
      correct: true
      why:
        ar: تذكر المصادر وفاتها نحو ٨٨٠
        en: the sources date her death about 880
        ur: ماخذ اس کی وفات تقریباً 880 لکھتے ہیں
    - text:
        ar: عام ٨٥٩
        en: in 859
        ur: 859 میں
      correct: false
      why:
        ar: ذلك عام البناء لا الوفاة
        en: that is the building year, not death
        ur: یہ تعمیر کا سال ہے، وفات کا نہیں
    - text:
        ar: عام ١٠٠٠
        en: in 1000
        ur: 1000 میں
      correct: false
      why:
        ar: ذلك بعد موتها بأكثر من قرن
        en: that is over a century after her death
        ur: یہ اس کی وفات سے ایک صدی سے زیادہ بعد ہے
    - text:
        ar: غير معلومة
        en: unknown
        ur: نامعلوم
      correct: false
      why:
        ar: تذكر المصادر نحو ٨٨٠
        en: the sources give about 880
        ur: ماخذ تقریباً 880 دیتے ہیں
  - q:
      ar: لماذا تهمّ فاطمة الفهرية؟
      en: Why does Fatima al-Fihri matter?
      ur: فاطمہ الفہری کیوں اہم ہے؟
    options:
    - text:
        ar: لأنها بنت أقدم مؤسسة علمية مستمرة في الذاكرة
        en: because she built the oldest continuous learning institution in memory
        ur: کیونکہ اس نے یادداشت میں قدیم ترین مسلسل علمی ادارہ بنایا
      correct: true
      why:
        ar: بقيت القرويين عاملة أكثر من ألف عام
        en: al-Qarawiyyin stayed working over a thousand years
        ur: قرویین ایک ہزار سال سے زیادہ چلتا رہا
    - text:
        ar: لأنها كتبت القرآن
        en: because she wrote the Qur''an
        ur: کیونکہ اس نے قرآن لکھا
      correct: false
      why:
        ar: لم تكتب قرآنًا بل بنت مدرسة
        en: she built a school, not scripture
        ur: اس نے مدرسہ بنایا، صحیفہ نہیں
    - text:
        ar: لأنها كانت ملكة
        en: because she was a queen
        ur: کیونکہ وہ ملکہ تھی
      correct: false
      why:
        ar: كانت تاجرة لا ملكة
        en: she was a merchant, not a queen
        ur: وہ تاجر تھی، ملکہ نہیں
    - text:
        ar: لأنها غزت الأندلس
        en: because she conquered al-Andalus
        ur: کیونکہ اس نے اندلس فتح کیا
      correct: false
      why:
        ar: لم تغزُ بل بنت علمًا
        en: she did not conquer; she built learning
        ur: اس نے فتح نہیں کیا، علم بنایا
- id: al-khwarizmi
  anchor: person/al-khwarizmi
  band: researchers
  title:
    ar: الخوارزمي
    en: al-Khwarizmi
    ur: خوارزمی
  sixty:
    ar: 'محمد بن موسى الخوارزمي، عالم بغداد في بيت الحكمة العباسي حوالي ٨٢٠: ألّف كتاب الجبر والمقابلة الذي أعطى الرياضيات علمها الجديد واسمه، وأدخل الأرقام الهندية
      — ما نسميه الأرقام العربية — إلى العالم الإسلامي ثم أوروبا. من اسمه جاءت كلمة «الخوارزمية» التي يقوم عليها كل حاسوب اليوم. كتب أيضًا في الفلك والجغرافيا ومساحة
      الأرض. مات حوالي ٨٥٠ تاركًا علمًا صار لغة العالم: «algorithm» و«algebra» من اسمه وكتابه معًا.'
    en: 'Muhammad ibn Musa al-Khwarizmi, a scholar of Baghdad''''s Abbasid House of Wisdom around 820: he authored the Book of al-Jabr wa-l-Muqabala, which gave mathematics
      its new science and its name, and he brought the Indian numerals — what we call Arabic numerals — to the Islamic world and then to Europe. From his name came
      the word ''''algorithm'''' on which every computer runs today. He also wrote on astronomy, geography and the earth''''s surface. He died about 850 leaving a
      science that became the world''''s language: ''''algorithm'''' and ''''algebra'''' from his name and his book together.'
    ur: 'محمد بن موسیٰ خوارزمی، تقریباً 820 میں بغداد کے عباسی بیت الحکمت کا عالم: اس نے کتاب الجبر والمقابلہ لکھی جس نے ریاضی کو اس کا نیا علم اور نام دیا، اور ہندوستانی
      ہندسوں — جنہیں ہم عربی ہندسے کہتے ہیں — کو اسلامی دنیا اور پھر یورپ میں متعارف کرایا۔ اس کے نام سے لفظ الگورتھم نکلا جس پر آج ہر کمپیوٹر چلتا ہے۔ اس نے فلکیات،
      جغرافیہ اور زمین کی سطح پر بھی لکھا۔ وہ تقریباً 850 میں فوت ہوا، ایک ایسا علم چھوڑ کر جو دنیا کی زبان بنا: الگورتھم اور الجبرا دونوں اس کے نام اور کتاب سے۔'
  glossary:
  - term:
      ar: بيت الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: مكتبة بغداد العباسية حيث عمل
      en: Baghdad''s Abbasid library where he worked
      ur: بغداد کی عباسی لائبریری جہاں اس نے کام کیا
  - term:
      ar: الجبر والمقابلة
      en: al-Jabr wa-l-Muqabala
      ur: الجبر والمقابلہ
    gloss:
      ar: كتابه الذي أعطى الجبر اسمه
      en: his book that gave algebra its name
      ur: اس کی کتاب جس نے الجبرا کو نام دیا
  - term:
      ar: الجبر
      en: algebra
      ur: الجبرا
    gloss:
      ar: العلم الذي سمّاه كتابه
      en: the science his book named
      ur: وہ علم جسے اس کی کتاب نے نام دیا
  - term:
      ar: الخوارزمية
      en: the algorithm
      ur: الگورتھم
    gloss:
      ar: الكلمة من اسمه التي يقوم عليها الحاسوب
      en: the word from his name computers run on
      ur: وہ لفظ اس کے نام سے جس پر کمپیوٹر چلتے ہیں
  - term:
      ar: الأرقام الهندية
      en: the Indian numerals
      ur: ہندوستانی ہندسے
    gloss:
      ar: الأعداد التي أدخلها العالم
      en: the numbers he brought to the world
      ur: وہ ہندسے جو وہ دنیا میں لایا
  - term:
      ar: الأرقام العربية
      en: the Arabic numerals
      ur: عربی ہندسے
    gloss:
      ar: ما سمّته أوروبا الأرقام الهندية
      en: what Europe called the Indian numerals
      ur: وہ ہندسے جنہیں یورپ نے ہندوستانی کہا
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: مدينته التي عمل فيها
      en: his city where he worked
      ur: اس کا شہر جہاں اس نے کام کیا
  - term:
      ar: ٨٢٠
      en: '820'
      ur: '820'
    gloss:
      ar: تقريب عام نشاطه
      en: about his activity year
      ur: اس کی سرگرمی کا تقریبی سال
  - term:
      ar: الفلك
      en: astronomy
      ur: فلکیات
    gloss:
      ar: علم السماء الذي كتب فيه
      en: the sky-science he wrote on
      ur: وہ آسمان کا علم جس پر اس نے لکھا
  - term:
      ar: الجغرافيا
      en: geography
      ur: جغرافیہ
    gloss:
      ar: علم الأرض الذي كتب فيه
      en: the earth-science he wrote on
      ur: وہ زمین کا علم جس پر اس نے لکھا
  - term:
      ar: المأمون
      en: al-Ma''mun
      ur: المأمون
    gloss:
      ar: الخليفة الذي في عهده بيت الحكمة
      en: the caliph whose House of Wisdom he used
      ur: وہ خلیفہ جس کے بیت الحکمت میں اس نے کام کیا
  - term:
      ar: مساحة الأرض
      en: the earth''s surface
      ur: زمین کی سطح
    gloss:
      ar: موضوع كتابه الجغرافي
      en: his geographical book''s subject
      ur: اس کی جغرافیائی کتاب کا موضوع
  practice:
  - q:
      ar: أين عمل الخوارزمي؟
      en: Where did al-Khwarizmi work?
      ur: خوارزمی نے کہاں کام کیا؟
    options:
    - text:
        ar: بيت الحكمة في بغداد
        en: Baghdad''s House of Wisdom
        ur: بغداد کا بیت الحکمت
      correct: true
      why:
        ar: تذكر المصادر عمله في مكتبة المأمون
        en: the sources place him in al-Ma''mun''s library
        ur: ماخذ اسے مأمون کی لائبریری میں رکھتے ہیں
    - text:
        ar: القرويين في فاس
        en: al-Qarawiyyin in Fez
        ur: فاس میں قرویین
      correct: false
      why:
        ar: كان في بغداد لا المغرب
        en: he was in Baghdad, not Morocco
        ur: وہ بغداد میں تھا، مراکش میں نہیں
    - text:
        ar: الأزهر في القاهرة
        en: al-Azhar in Cairo
        ur: قاہرہ میں الازہر
      correct: false
      why:
        ar: كان قبل الأزهر بقرن ونصف
        en: he was a century and a half before al-Azhar
        ur: وہ الازہر سے ڈیڑھ صدی پہلے تھا
    - text:
        ar: قرطبة في الأندلس
        en: Cordoba in al-Andalus
        ur: اندلس میں قرطہ
      correct: false
      why:
        ar: كان في بغداد لا الأندلس
        en: he was in Baghdad, not al-Andalus
        ur: وہ بغداد میں تھا، اندلس میں نہیں
  - q:
      ar: ما كتابه الأشهر؟
      en: What is his most famous book?
      ur: اس کی سب سے مشہور کتاب کیا ہے؟
    options:
    - text:
        ar: الجبر والمقابلة
        en: al-Jabr wa-l-Muqabala
        ur: الجبر والمقابلہ
      correct: true
      why:
        ar: أعطى الرياضيات علمها الجديد
        en: it gave mathematics its new science
        ur: اس نے ریاضی کو نیا علم دیا
    - text:
        ar: القانون في الطب
        en: the Canon of Medicine
        ur: طب کا قانون
      correct: false
      why:
        ar: القانون كتاب ابن سينا لا الخوارزمي
        en: the Canon is Ibn Sina''s, not his
        ur: قانون ابن سینا کی کتاب ہے، اس کی نہیں
    - text:
        ar: المقدمة
        en: the Muqaddima
        ur: مقدمہ
      correct: false
      why:
        ar: المقدمة لابن خلدون لا الخوارزمي
        en: the Muqaddima is Ibn Khaldun''s, not his
        ur: مقدمہ ابن خلدون کی ہے، اس کی نہیں
    - text:
        ar: الشفاء
        en: the Healing
        ur: شفا
      correct: false
      why:
        ar: الشفاء لابن سينا
        en: the Healing is Ibn Sina''s
        ur: شفا ابن سینا کی ہے
  - q:
      ar: من أين جاءت كلمة الخوارزمية؟
      en: Where did the word ''algorithm'' come from?
      ur: الگورتھم کا لفظ کہاں سے آیا؟
    options:
    - text:
        ar: من اسمه
        en: from his name
        ur: اس کے نام سے
      correct: true
      why:
        ar: اشتُقت الكلمة اللاتينية من «الخوارزمي»
        en: the Latin word derives from ''al-Khwarizmi''
        ur: لاطینی لفظ خوارزمی سے نکلا
    - text:
        ar: من اسم أبيه
        en: from his father''s name
        ur: اس کے والد کے نام سے
      correct: false
      why:
        ar: من اسمه هو لا أبيه
        en: from his own name, not his father''s
        ur: اس کے اپنے نام سے، والد کے نہیں
    - text:
        ar: من كتابه فقط
        en: only from his book
        ur: صرف اس کی کتاب سے
      correct: false
      why:
        ar: الكلمة من اسمه والجبر من كتابه
        en: the word is from his name, algebra from his book
        ur: لفظ اس کے نام سے، الجبرا اس کی کتاب سے
    - text:
        ar: كلمة عربية قديمة
        en: an old Arabic word
        ur: پرانا عربی لفظ
      correct: false
      why:
        ar: أصلها اسمه في المصادر
        en: its root is his name in the sources
        ur: اس کی جڑ ماخذ میں اس کا نام ہے
  - q:
      ar: ماذا أدخل إلى العالم؟
      en: What did he bring to the world?
      ur: اس نے دنیا میں کیا متعارف کرایا؟
    options:
    - text:
        ar: الأرقام الهندية صارت العربية
        en: the Indian numerals that became Arabic
        ur: وہ ہندوستانی ہندسے جو عربی بنے
      correct: true
      why:
        ar: نقلها من الهند إلى الإسلام ثم أوروبا
        en: he carried them from India to Islam then Europe
        ur: انہیں ہندوستان سے اسلام پھر یورپ تک پہنچایا
    - text:
        ar: الحروف اللاتينية
        en: the Latin letters
        ur: لاطینی حروف
      correct: false
      why:
        ar: أدخل الأرقام لا الحروف
        en: he brought numerals, not letters
        ur: وہ ہندسے لایا، حروف نہیں
    - text:
        ar: البارود
        en: gunpowder
        ur: بارود
      correct: false
      why:
        ar: لم يكن البارود علمه
        en: gunpowder was not his field
        ur: بارود اس کا میدان نہیں تھا
    - text:
        ar: الطباعة
        en: printing
        ur: چھاپہ
      correct: false
      why:
        ar: لم تكن الطباعة في عصره
        en: printing was not in his age
        ur: چھاپہ اس کے دور میں نہیں تھا
  - q:
      ar: في أيّ قرن عاش؟
      en: In which century did he live?
      ur: وہ کس صدی میں رہا؟
    options:
    - text:
        ar: القرن التاسع
        en: the ninth century
        ur: نویں صدی
      correct: true
      why:
        ar: عمل نحو ٨٢٠ ومات نحو ٨٥٠
        en: he worked about 820 and died about 850
        ur: وہ تقریباً 820 میں کام کرتا تھا اور تقریباً 850 میں فوت ہوا
    - text:
        ar: القرن السابع
        en: the seventh century
        ur: ساتویں صدی
      correct: false
      why:
        ar: كان بعد القرن السابع بقرنين
        en: he was two centuries after the seventh
        ur: وہ ساتویں صدی سے دو صدیاں بعد تھا
    - text:
        ar: القرن الثاني عشر
        en: the twelfth century
        ur: بارہویں صدی
      correct: false
      why:
        ar: كان قبل القرن الثاني عشر بثلاثة قرون
        en: he was three centuries before the twelfth
        ur: وہ بارہویں صدی سے تین صدیاں پہلے تھا
    - text:
        ar: القرن الأول
        en: the first century
        ur: پہلی صدی
      correct: false
      why:
        ar: كان في العصر العباسي لا الروماني
        en: he was in the Abbasid, not Roman, era
        ur: وہ عباسی دور میں تھا، رومی نہیں
  - q:
      ar: ما علاقته بالمأمون؟
      en: What was his tie to al-Ma''mun?
      ur: اس کا المأمون سے کیا تعلق تھا؟
    options:
    - text:
        ar: عمل في بيت حكمته
        en: he worked in his House of Wisdom
        ur: اس نے اس کے بیت الحکمت میں کام کیا
      correct: true
      why:
        ar: جعل المأمون بيت الحكمة مركز العلم
        en: al-Ma''mun made the House a centre of learning
        ur: مأمون نے بیت الحکمت کو علم کا مرکز بنایا
    - text:
        ar: كان ابن المأمون
        en: he was al-Ma''mun''s son
        ur: وہ مأمون کا بیٹا تھا
      correct: false
      why:
        ar: كان عالمًا في دار الخليفة لا ابنه
        en: he was a scholar in the caliph''s house, not his son
        ur: وہ خلیفہ کے گھر میں عالم تھا، بیٹا نہیں
    - text:
        ar: كان خليفة بعده
        en: he was caliph after him
        ur: وہ اس کے بعد خلیفہ تھا
      correct: false
      why:
        ar: كان عالمًا لا خليفة
        en: he was a scholar, not a caliph
        ur: وہ عالم تھا، خلیفہ نہیں
    - text:
        ar: لا علاقة
        en: no relation
        ur: کوئی تعلق نہیں
      correct: false
      why:
        ar: عمل في بيت الحكمة في عهد المأمون
        en: he worked in the House under al-Ma''mun
        ur: اس نے مأمون کے دور میں بیت الحکمت میں کام کیا
  - q:
      ar: ماذا كتب غير الجبر؟
      en: What else did he write on?
      ur: الجبرا کے علاوہ اس نے کس پر لکھا؟
    options:
    - text:
        ar: الفلك والجغرافيا ومساحة الأرض
        en: astronomy, geography and the earth''s surface
        ur: فلکیات، جغرافیہ اور زمین کی سطح
      correct: true
      why:
        ar: تذكر المصادر كتبه الأخرى
        en: the sources name his other books
        ur: ماخذ اس کی دوسری کتابوں کا ذکر کرتے ہیں
    - text:
        ar: الطب فقط
        en: only medicine
        ur: صرف طب
      correct: false
      why:
        ar: كتب في علوم كثيرة لا طبًّا فقط
        en: he wrote on many sciences, not just medicine
        ur: اس نے کئی علوم پر لکھا، صرف طب نہیں
    - text:
        ar: الشعر
        en: poetry
        ur: شاعری
      correct: false
      why:
        ar: كان عالم رياضيات لا شاعرًا
        en: he was a mathematician, not a poet
        ur: وہ ریاضی دان تھا، شاعر نہیں
    - text:
        ar: لا شيء آخر
        en: nothing else
        ur: کچھ اور نہیں
      correct: false
      why:
        ar: تذكر المصادر كتبًا في علوم عدة
        en: the sources name books on several sciences
        ur: ماخذ کئی علوم کی کتابوں کا ذکر کرتے ہیں
  - q:
      ar: ما أصل كلمة algebra؟
      en: What is the root of ''algebra''?
      ur: الجبرا کی جڑ کیا ہے؟
    options:
    - text:
        ar: من عنوان كتابه الجبر
        en: from his book''s title al-Jabr
        ur: اس کی کتاب کے نام الجبر سے
      correct: true
      why:
        ar: من «الجبر» جاءت algebra
        en: from ''al-Jabr'' came algebra
        ur: الجبر سے الجبرا آیا
    - text:
        ar: من اسم مدينته
        en: from his city''s name
        ur: اس کے شہر کے نام سے
      correct: false
      why:
        ar: من كتابه لا مدينته
        en: from his book, not his city
        ur: اس کی کتاب سے، شہر سے نہیں
    - text:
        ar: كلمة لاتينية قديمة
        en: an old Latin word
        ur: پرانا لاطینی لفظ
      correct: false
      why:
        ar: أصلها كتابه العربي
        en: its root is his Arabic book
        ur: اس کی جڑ اس کی عربی کتاب ہے
    - text:
        ar: من اسم معلمه
        en: from his teacher''s name
        ur: اس کے استاد کے نام سے
      correct: false
      why:
        ar: من كتابه لا معلمه
        en: from his book, not his teacher
        ur: اس کی کتاب سے، استاد سے نہیں
  - q:
      ar: لماذا يهمّ الخوارزمي اليوم؟
      en: Why does al-Khwarizmi matter today?
      ur: خوارزمی آج کیوں اہم ہے؟
    options:
    - text:
        ar: لأن الخوارزميات والجبر من إرثه
        en: because algorithms and algebra come from his legacy
        ur: کیونکہ الگورتھم اور الجبرا اس کے ورثے سے ہیں
      correct: true
      why:
        ar: اسمه في كل حاسوب وكتابه في كل مدرسة
        en: his name is in every computer, his book in every school
        ur: اس کا نام ہر کمپیوٹر میں، کتاب ہر مدرسے میں ہے
    - text:
        ar: لأنه اخترع الكهرباء
        en: because he invented electricity
        ur: کیونکہ اس نے بجلی ایجاد کی
      correct: false
      why:
        ar: لم يكن الكهرباء في عصره
        en: electricity was not in his age
        ur: بجلی اس کے دور میں نہیں تھی
    - text:
        ar: لأنه بنى الأهرام
        en: because he built the pyramids
        ur: کیونکہ اس نے اہرام بنائے
      correct: false
      why:
        ar: الأهرام قبله بآلاف السنين
        en: the pyramids predate him by millennia
        ur: اہرام اس سے ہزاروں سال پرانے ہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في كلمة algorithm العالمية
        en: his name is in the worldwide word algorithm
        ur: اس کا نام عالمی لفظ الگورتھم میں ہے
  - q:
      ar: من كتب عن الخوارزمي؟
      en: Who wrote about al-Khwarizmi?
      ur: خوارزمی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو العلم ومترجمو كتبه إلى اللاتينية
        en: historians of science and his Latin translators
        ur: علم کے مؤرخین اور اس کے لاطینی مترجمین
      correct: true
      why:
        ar: ترجمته أوروبا في القرون الوسطى
        en: Europe translated him in the Middle Ages
        ur: یورپ نے قرون وسطیٰ میں اس کا ترجمہ کیا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تصلنا كتبه وروايات مؤرخي العلم
        en: his books and science historians'' accounts reach us
        ur: اس کی کتابیں اور مؤرخین کی روایتیں ہم تک پہنچیں
    - text:
        ar: المصريون القدماء
        en: the ancient Egyptians
        ur: قدیم مصری
      correct: false
      why:
        ar: كان في العصر العباسي لا الفرعوني
        en: he was in the Abbasid, not pharaonic, era
        ur: وہ عباسی دور میں تھا، فرعونی نہیں
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: ترجمته أوروبا والعرب
        en: Europe and the Arabs translated him
        ur: یورپ اور عربوں نے اس کا ترجمہ کیا
- id: ibn-sina
  anchor: person/ibn-sina
  band: researchers
  title:
    ar: ابن سينا
    en: Ibn Sina
    ur: ابن سینا
  sixty:
    ar: 'أبو علي الحسين بن عبد الله بن سينا، شيخ الرئيس: طبيب بخارى وفيلسوف فارسي من القرن الحادي عشر، ألّف «القانون في الطب» الذي بقي مرجع الطب في الجامعات الإسلامية
      والأوروبية ستة قرون. حفظ الكتب قبل العاشرة وعالج الملوك وهو مراهق، وتنقّل بين البلاطات في همذان وإصبهان يطبّ ويؤلّف. كتب «الشفاء» موسوعة العلوم من المنطق إلى
      الفلك، وجمع الفلسفة اليونانية بالفكر الإسلامي في نظام فلسفي خاص. مات ١٠٣٧ في همذان عن سبعة وخمسين عامًا، وبقي «Avicenna» عند الأوروبيين اسمًا للطب نفسه.'
    en: 'Abu Ali al-Husayn ibn Abd Allah ibn Sina, the Shaykh al-Ra''''is: a physician of Bukhara and a Persian philosopher of the eleventh century, author of the
      Canon of Medicine that stayed medicine''''s reference in Islamic and European universities for six centuries. He memorized the books before age ten and treated
      kings as a teenager, moving between the courts of Hamadan and Isfahan, healing and writing. He wrote the Healing encyclopedia from logic to astronomy, joining
      Greek philosophy to Islamic thought in a system of his own. He died in Hamadan in 1037 at fifty-seven; to Europeans he stayed ''''Avicenna'''', a name for medicine
      itself.'
    ur: 'ابو علی حسین بن عبداللہ ابن سینا، شیخ الرئیس: گیارہویں صدی کا بخارا کا طبیب اور فارسی فلسفی، جس نے طب کا قانون لکھی جو چھ صدیوں تک اسلامی اور یورپی جامعوں
      میں طب کا مرجع رہی۔ اس نے دس سال سے پہلے کتابیں یاد کیں اور نوجوان ہو کر بادشاہوں کا علاج کیا، ہمدان اور اصفہان کے درباروں میں علاج اور تصنیف کرتا رہا۔ اس نے
      شفا کی دائرۃ المعارف منطق سے فلکیات تک لکھی، اور یونانی فلسفہ کو اسلامی فکر سے جوڑ کر اپنا فلسفیانہ نظام بنایا۔ وہ 1037 میں ہمدان میں ستاون سال کی عمر میں فوت
      ہوا؛ یورپیوں کے ہاں وہ ایویسینا رہا، طب ہی کا نام۔'
  glossary:
  - term:
      ar: بخارى
      en: Bukhara
