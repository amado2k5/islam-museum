- id: four-cities
  anchor: exhibit/pathway-g4-social-studies-four-cities
  band: scholars
  title:
    ar: أربع مدن إسلامية قبل ١٥٠٠
    en: Four Muslim Cities Before 1500
    ur: 1500 سے پہلے چار مسلم شہر
  sixty:
    ar: 'أربع مدن: بغداد وقرطبة والقاهرة وتمبكتو — منارات الحضارة الإسلامية في أربع جهات. بغداد على دجلة ببيت الحكمة والورق؛ قرطبة في الأندلس بجامعها الكبير ومكتباتها المليونية؛ القاهرة على النيل بالأزهر الذي يدرّس منذ ألف سنة؛ تمبكتو على نيجر بجامعات سانكوري ومخطوطات الصحراء. أربع مدن وُصلت بطرق تجارة وحجّ: طرق الصحراء تحمل ملح تيمبكتو وذهبها، وطرق البحر تحمل توابل الهند، والحجّ يجمع علماء الجميع في مكة فيتبادلون الكتب والأفكار. حول سنة ١٥٠٠ كانت هذه الشبكة أعظم شبكة علم في العالم — أربع نقاط نور على خريطة واحدة.  وبهذا تُقرأ الشبكة: ليست أربع مدن منعزلة بل أربعة رؤوس في جسد واحد — كلّما تنفّست جهة انتفع الكلّ بالآخر.  وهي تذكير بأن العالم الإسلامي لم يكن أمة واحدة على الخريطة بل شبكة عواصم — كلّ عاصمة تعلم الأخرى ويتعلم الجميع معًا.'
    en: 'Four cities: Baghdad, Cordoba, Cairo and Timbuktu — beacons of Islamic civilisation in four directions. Baghdad on the Tigris with the House of Wisdom and paper; Cordoba in al-Andalus with her Great Mosque and million-volume libraries; Cairo on the Nile with al-Azhar teaching for a thousand years; Timbuktu on the Niger with Sankore''s colleges and the Sahara''s manuscripts. Four cities joined by trade and Hajj routes: desert roads carrying Timbuktu''s salt and gold, sea roads carrying India''s spices, and the Hajj gathering all their scholars in Mecca to swap books and ideas. Around 1500 this network was the world''s greatest web of learning — four points of light on one map.  So the network reads: not four isolated cities but four heads on one body — whenever one region breathed, all profited from the others.'
    ur: 'چار شہر: بغداد، قرطہ، قاہرہ اور تمبکتو — چار سمتوں میں اسلامی تہذیب کے مینار۔ دجلہ پر بغداد بیت الحکمت اور کاغذ کے ساتھ؛ اندلس میں قرطہ اپنی عظیم مسجد اور دس لاکھ جلدوں کے کتب خانوں کے ساتھ؛ نیل پر قاہرہ ہزار برس سے پڑھانے والے الازہر کے ساتھ؛ نائجر پر تمبکتو سانکورے کے مدارس اور صحرا کے مخطوطوں کے ساتھ۔ چار شہر تجارت اور حج کے راستوں سے جڑے: صحرائی راستے تمبکتو کا نمک اور سونا لاتے، سمندری راستے ہند کے مصالحے، اور حج سب کے علماء کو مکہ میں جمع کرتا جہاں وہ کتابیں اور خیالات بانٹتے۔ تقریباً 1500ء میں یہ جال دنیا کا سب سے بڑا علمی جال تھا — ایک نقشے پر روشنی کے چار نقطے۔  اسی لیے جال پڑھا جاتا ہے: چار الگ شہر نہیں بلکہ ایک جسم کے چار سر — جب ایک کونے نے سانس لی سب کو باقیوں سے فائدہ ملا۔'
  glossary:
