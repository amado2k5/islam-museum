- id: al-andalus
  anchor: exhibit/pathway-g11-chw3m-al-andalus
  band: researchers
  title:
    ar: الأندلس
    en: Al-Andalus
    ur: الاندلس
  sixty:
    ar: 'الأندلس: ثمانية قرون من التاريخ الإسلامي في شبه الجزيرة الإيبيرية بدأت بفتح طارق سنة ٧١١ الذي أعطى اسمه لجبل طارق، وانتهت بسقوط غرناطة ١٤٩٢. فيها ازدهرت قرطبة حتى صارت أكبر مدن أوروبا، وبُني جامعها الكبير بأعمدته الحمراء والبيضاء، وانقسمت الممالك إلى طوائف ثم جمعتها المرابطون والموحّدون، وفي الحمراء كتب شعراء النصريين على الجدران. وكانت جسر الثقافات: مكتبات نقلت العلوم إلى اللاتينية، وفلاحون نقلوا الري والفواكه، ومسيحيون ويهود عاشوا في ظلّها بأحكامها الخاصة. ثمانية قرون تركت كلمات «الجبرا» و«الأغوريتم» وألف كلمة عربية في الإسبانية.  ولهذا يتوق المسلمون إلى ذكراها: ثمانية قرون أثبتت أن الإسلام يمكن أن يزدهر في أرض الغرب — وأن الحضارة يمكن أن تفنى من فوقها دون أن تُنسى.  وبقيت أرشيفها في الذاكرة: آلاف المخطوطات نقلت منها إلى شمال أوروبا حين عادت، فصارت مكتبات أوروبا نفسها إرثًا أندلسيًّا.'
    en: 'Al-Andalus: eight centuries of Islamic history on the Iberian Peninsula, from Tariq''s conquest of 711 — which gave Gibraltar its name — to Granada''s fall in 1492. In it Cordoba flowered until it was Europe''s largest city, and her Great Mosque rose with red and white columns; the kingdoms split into taifas then were joined by the Almoravids and Almohads, and Nasrid poets wrote on the Alhambra''s walls. She was the bridge of cultures: libraries carried sciences into Latin, farmers carried irrigation and fruits, and Christians and Jews lived under her own rules. Eight centuries left ''algebra'', ''algorithm'' and a thousand Arabic words in Spanish.  That is why Muslims long for her memory: eight centuries proved Islam can flourish on western soil — and that a civilisation can vanish from the map without being forgotten.'
    ur: 'اندلس: ایبیرین جزیرہ نما پر آٹھ صدیوں کی اسلامی تاریخ، طارق کی 711ء کی فتح سے — جس نے جبل الطارق کو نام دیا — 1492ء میں غرناطہ کے گرنے تک۔ اس میں قرطہ ایسا کھلا کہ وہ یورپ کا سب سے بڑا شہر بنا، اور اس کی عظیم مسجد سرخ اور سفید ستونوں سے اٹھی؛ ریاستیں طوائف میں بٹیں پھر مرابطین اور موحدین نے جوڑیں، اور نصری شعراء نے الحمرا کی دیواروں پر لکھا۔ یہ ثقافتوں کا پل تھا: کتب خانوں نے علوم لاطینی میں پہنچائے، کسانوں نے نہریں اور پھل، اور مسیحی اور یہودی اپنے قواعد کے تلے رہے۔ آٹھ صدیوں نے ہسپانوی میں الجبرا، الگورتھم اور ہزار عربی الفاظ چھوڑے۔  اسی لیے مسلمان اس کی یاد کو ترستے ہیں: آٹھ صدیوں نے ثابت کیا کہ اسلام مغربی زمین پر کھل سکتا ہے — اور تہذیب نقشے سے مٹ بھی سکتی ہے مگر بھولائی نہیں جا سکتی۔'
