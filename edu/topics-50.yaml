      en: Ghazan
      ur: غازان
    gloss:
      ar: 'الملك الذي أسلم مع جنوده'
      en: 'the king who took Islam with his soldiers'
      ur: 'وہ بادشاہ جو اپنے لشکر سمیت مسلمان ہوا'
  - term:
      ar: تيمور
      en: Timur
      ur: تیمور
    gloss:
      ar: 'المغولي الآخر الذي بنا سمرقند'
      en: 'the other Mongol who built Samarkand'
      ur: 'دوسرا مغل جس نے سمرقند بسایا'
  - term:
      ar: سمرقند
      en: Samarkand
      ur: سمرقند
    gloss:
      ar: 'مدينة المرصّد والعلم'
      en: 'the observatory and knowledge city'
      ur: 'رصد گاہ اور علم کا شہر'
  - term:
      ar: أولوغ بيك
      en: Ulugh Beg
      ur: الغ بیگ
    gloss:
      ar: 'الفلكي الذي قاس السماء فيها'
      en: 'the astronomer who measured the sky there'
      ur: 'وہ ماہر فلکیات جس نے وہاں آسمان ناپا'
  - term:
      ar: الدول المتأسلمة
      en: the Islamised states
      ur: اسلامی ہوئی ریاستیں
    gloss:
      ar: 'الدول التي خرجت إسلامية من الغزو'
      en: 'the states that came out Islamic from invasion'
      ur: 'حملے سے نکلی مسلم ریاستیں'
  - term:
      ar: أول هزيمة
      en: the first defeat
      ur: پہلی شکست
    gloss:
      ar: 'أول هزيمة كبرى في تاريخهم'
      en: 'their first great defeat in history'
      ur: 'تاریخ میں ان کی پہلی بڑی شکست'
  practice:
  - q:
      ar: متى سقطت بغداد؟
      en: When did Baghdad fall?
      ur: بغداد کب گرا؟
    options:
    - text:
        ar: عام ١٢٥٨
        en: in 1258
        ur: 1258 میں
      correct: true
      why:
        ar: سقطت بيد هولاكو عام ١٢٥٨
        en: it fell to Hulagu in 1258
        ur: یہ 1258 میں ہلاکو کے ہاتھ گرا
    - text:
        ar: عام ١٢٦٠
        en: in 1260
        ur: 1260 میں
      correct: false
      why:
        ar: ١٢٦٠ عام عين جالوت لا السقوط
        en: 1260 is Ayn Jalut, not the fall
        ur: 1260 عین جالوت کا سال ہے، سقوط نہیں
    - text:
        ar: عام ١٤٩٢
        en: in 1492
        ur: 1492 میں
      correct: false
      why:
        ar: ١٤٩٢ عام غرناطة لا بغداد
        en: 1492 is Granada's year
        ur: 1492 غرناطہ کا سال ہے
    - text:
        ar: عام ٧٥٠
        en: in 750
        ur: 750 میں
      correct: false
      why:
        ar: ٧٥٠ عام بداية العباسية لا نهايتها
        en: 750 begins the Abbasid era, not ends it
        ur: 750 عباسی آغاز ہے، خاتمہ نہیں
  - q:
      ar: من دمّرها؟
      en: Who destroyed it?
      ur: اسے کس نے تباہ کیا؟
    options:
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: true
      why:
        ar: هولاكو حفيد جنكيز دمّرها
        en: Genghis's grandson Hulagu razed it
        ur: چنگیز کے پوتے ہلاکو نے تباہ کیا
    - text:
        ar: جنكيز نفسه
        en: Genghis himself
        ur: خود چنگیز
      correct: false
      why:
        ar: جنكيز مات قبلها بثلاثين عامًا
        en: Genghis died thirty years before
        ur: چنگیز تیس سال پہلے مرا
    - text:
        ar: تيمور
        en: Timur
        ur: تیمور
      correct: false
      why:
        ar: تيمور بعدها بقرن
        en: Timur came a century after
        ur: تیمور ایک صدی بعد آیا
    - text:
        ar: قطز
        en: Qutuz
        ur: قطز
      correct: false
      why:
        ar: قطز مملوكي هزمهم لا دمّر
        en: Qutuz the Mamluk defeated them, did not destroy
        ur: قطز ممالیکی نے انہیں ہرایا، تباہ نہیں کیا
  - q:
      ar: أين أوقفهم المسلمون؟
      en: Where were they stopped?
      ur: انھیں کہاں روکا گیا؟
    options:
    - text:
        ar: عين جالوت
        en: at Ayn Jalut
        ur: عین جالوت پر
      correct: true
      why:
        ar: عين جالوت أول هزيمة كبرى لهم
        en: Ayn Jalut was their first great defeat
        ur: عین جالوت ان کی پہلی بڑی شکست تھی
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد سقطت لا أوقفتهم
        en: Baghdad fell; it did not stop them
        ur: بغداد گرا، روکا نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق ليست موضع المعركة
        en: Damascus was not the battle site
        ur: دمشق لڑائی کی جگہ نہیں تھی
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة مركز المماليك لا الميدان
        en: Cairo was the Mamluk seat, not the field
        ur: قاہرہ ممالیکی نشست تھی، میدان نہیں
  - q:
      ar: من هزمهم فيها؟
      en: Who beat them there?
      ur: وہاں انہیں کس نے ہرایا؟
    options:
    - text:
        ar: المماليك
        en: the Mamluks
        ur: ممالیک
      correct: true
      why:
        ar: مماليك مصر بقيادة قطز وبيبرس
        en: Egypt's Mamluks under Qutuz and Baybars
        ur: مصر کے ممالیک، قطز اور بیبرس کی قیادت میں
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون انتهوا قبلها بقليل
        en: the Abbasids had just ended
        ur: عباسی ابھی ختم ہوئے تھے
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون بعدها بقرون
        en: Ottomans came centuries later
        ur: عثمانی صدیاں بعد آئے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الصليبيون لم يهزموهم هنا
        en: the Crusaders did not beat them there
        ur: صلیبیوں نے وہاں نہیں ہرایا
  - q:
      ar: ماذا فعل أحفاد جنكيز لاحقًا؟
      en: What did Genghis's descendants later do?
      ur: چنگیز کی اولاد نے بعد میں کیا کیا؟
    options:
    - text:
        ar: اعتنقوا الإسلام
        en: they embraced Islam
        ur: انھوں نے اسلام قبول کیا
      correct: true
      why:
        ar: أسلم الإيلخانيون وحكموا مسلمين
        en: the Ilkhanids turned Muslim and ruled as such
        ur: ایلخان مسلم ہوئے اور مسلمان بن کر حکومت کی
    - text:
        ar: دمّروا إلى الأبد
        en: they destroyed forever
        ur: ہمیشہ تباہ کرتے رہے
      correct: false
      why:
        ar: لم يدمّروا دائمًا بل أسلموا
        en: they did not destroy forever; they converted
        ur: وہ ہمیشہ تباہ نہیں کرتے رہے، مسلم ہوئے
    - text:
        ar: رجعوا إلى منغوليا
        en: returned to Mongolia
        ur: منگولیا لوٹ گئے
      correct: false
      why:
        ar: لم يرجعوا بل بقوا وحكموا
        en: they stayed and ruled, did not return
        ur: وہ نہیں لوٹے، رہے اور حکومت کی
    - text:
        ar: انقرضوا كلهم
        en: all died out
        ur: سب ختم ہو گئے
      correct: false
      why:
        ar: لم ينقرضوا بل أسلموا
        en: they did not die out; they converted
        ur: وہ ختم نہیں ہوئے، مسلم ہوئے
  - q:
      ar: من الإيلخان الذي أسلم؟
      en: Which Ilkhan turned Muslim?
      ur: کون سا ایلخان مسلم ہوا؟
    options:
    - text:
        ar: غازان
        en: Ghazan
        ur: غازان
      correct: true
      why:
        ar: غازان أول إيلخان مسلم معلن
        en: Ghazan was the first openly Muslim Ilkhan
        ur: غازان پہلا کھلے مسلم ایلخان تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: هولاكو لم يسلم بل غازان
        en: Hulagu did not convert; Ghazan did
        ur: ہلاکو مسلم نہیں ہوا، غازان ہوا
    - text:
        ar: تيمور
        en: Timur
        ur: تیمور
      correct: false
      why:
        ar: تيمور ليس إيلخانيًا
        en: Timur was not an Ilkhan
        ur: تیمور ایلخان نہیں تھا
    - text:
        ar: جنكيز
        en: Genghis
        ur: چنگیز
      correct: false
      why:
        ar: جنكيز لم يصل الإسلام
        en: Genghis never reached Islam
        ur: چنگیز اسلام تک نہیں پہنچا
  - q:
      ar: من كان تيمور؟
      en: Who was Timur?
      ur: تیمور کون تھا؟
    options:
    - text:
        ar: قائد دمّر ثم بناه أحفاده
        en: a destroyer whose heirs rebuilt
        ur: تباہ کار جس کی اولاد نے تعمیر کی
      correct: true
      why:
        ar: دمّر كثيرًا لكن عاصمته سمرقند ازدهرت
        en: he destroyed much but his Samarkand flourished
        ur: اس نے بہت تباہی کی مگر سمرقند پھلی
    - text:
        ar: أول خليفة عباسي
        en: the first Abbasid caliph
        ur: پہلا عباسی خلیفہ
      correct: false
      why:
        ar: ليس خليفة بل قائد مغولي
        en: a Mongol leader, not a caliph
        ur: خلیفہ نہیں، منگول سردار
    - text:
        ar: سلطان عثماني
        en: an Ottoman sultan
        ur: عثمانی سلطان
      correct: false
      why:
        ar: ليس عثمانيًا بل مغوليًا
        en: a Mongol, not an Ottoman
        ur: عثمانی نہیں، منگول
    - text:
        ar: عالم فلك فقط
        en: only an astronomer
        ur: صرف فلکیات دان
      correct: false
      why:
        ar: ليس عالمًا بل قائدًا
        en: a commander, not a scholar
        ur: عالم نہیں، سردار
  - q:
      ar: ما مدينة عصره الذهبي؟
      en: His golden-age city?
      ur: اس کے سنہری دور کا شہر؟
    options:
    - text:
        ar: سمرقند
        en: Samarkand
        ur: سمرقند
      correct: true
      why:
        ar: سمرقند عاصمته ومركز علم لاحقًا
        en: Samarkand his capital, later a learning centre
        ur: سمرقند اس کا پایہ تخت، بعد میں علمی مرکز
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد ليست مدينته
        en: Baghdad was not his city
        ur: بغداد اس کا شہر نہیں
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: false
      why:
        ar: إسطنبول عثمانية لا تيمورية
        en: Istanbul was Ottoman, not Timurid
        ur: استنبول عثمانی تھی، تیموری نہیں
    - text:
        ar: دلهي
        en: Delhi
        ur: دہلی
      correct: false
      why:
        ar: دلهي هندية متأخرة
        en: Delhi was later Indian
        ur: دہلی بعد کی ہندوستانی تھی
  - q:
      ar: من حفيده العالم؟
      en: His scholar grandson?
      ur: اس کا عالم نواسہ؟
    options:
    - text:
        ar: أولوغ بيك
        en: Ulugh Beg
        ur: الغ بیگ
      correct: true
      why:
        ar: أولوغ بيك بنا مرصد سمرقند
        en: Ulugh Beg built Samarkand's observatory
        ur: الغ بیگ نے سمرقند کی رصد گاہ بنائی
    - text:
        ar: بابر
        en: Babur
        ur: بابر
      correct: false
      why:
        ar: بابر حفيد بعيد في الهند
        en: Babur was a later descendant in India
        ur: بابر بعد کی اولاد تھی، ہند میں
    - text:
        ar: أكبر
        en: Akbar
        ur: اکبر
      correct: false
      why:
        ar: أكبر هندي مغولي متأخر
        en: Akbar was a later Mughal
        ur: اکبر بعد کا مغلیائی تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: هولاكو من فرع آخر
        en: Hulagu was of another branch
        ur: ہلاکو دوسری شاخ کا تھا
  - q:
      ar: لماذا تُعدّ عين جالوت محورًا؟
      en: Why is Ayn Jalut a turning point?
      ur: عین جالوت محور کیوں ہے؟
    options:
    - text:
        ar: لأنها أول وقفة لهم
        en: it was their first halt
        ur: ان کی پہلی روک تھی
      correct: true
      why:
        ar: أول هزيمة كبرى أوقفت زحفهم
        en: the first great defeat halting their sweep
        ur: پہلی بڑی شکست جس نے ان کی پیش قدمی روکی
    - text:
        ar: لأنها آخر معركة
        en: for being the last battle
        ur: آخری لڑائی ہونے کے لیے
      correct: false
      why:
        ar: ليست آخر بل أول وقفة
        en: a first halt, not last battle
        ur: آخری نہیں، پہلی روک
    - text:
        ar: لأنها سقوط بغداد
        en: for being Baghdad's fall
        ur: بغداد کے گرنے کے لیے
      correct: false
      why:
        ar: ليست سقوطًا بل وقفة
        en: a halt, not a fall
        ur: سقوط نہیں، روک
    - text:
        ar: لأنها نهاية الإسلام
        en: for ending Islam
        ur: اسلام کے خاتمے کے لیے
      correct: false
      why:
        ar: لم تنهِ الإسلام بل حفظته
        en: it preserved Islam, did not end it
        ur: اس نے اسلام ختم نہیں کیا، بچایا
- id: five-pillars-daily-life
  anchor: exhibit/pathway-g11-hrf3o-five-pillars-daily-life
  band: researchers
  title:
    ar: الأركان الخمسة في الحياة اليومية
    en: The Five Pillars in Daily Life
    ur: پانچ ارکان روزمرہ زندگی میں
  sixty:
    ar: 'الأركان الخمسة في الحياة اليومية: ليس عبادات معزولة بل إيقاع يوم يجمع الأمة. الشهادة تقال في الأذان وفي الولادة والموت؛ الصلاة خمس مرات تحدّد ساعات النهار من الفجر إلى العشاء؛ الزكاة تخرج من الفائض سنويًّا للفقراء؛ الصوم يملأ رمضان بالصبر والتقوى؛ والحج يجمع ملايين في مكة مرة في العمر لمن استطاع. وهذه الأركان ليست عبء الفرد فحسب: صلاة الجمعة تجمع الحيّ، والعيدان يوحّدان الأسرة والجماعة، وسنن الطهارة والتحية تصيغ العادات المشتركة. من فجر الفجر إلى صلاة العشاء يعيش المسلم إيقاعًا واحدًا يوحّد مليارًا ونصفًا في خمس قارات.  ولهذا تسمّى أركانًا: كما لا يقوم بيت بلا أساس لا يقوم دين بلا شهادة وصلاة وصدقة وصوم وحج — خمسة جدران تحمل بيت المسلم.  وهي أيضًا مدرسة السلوك: الصلاة تعلّم النظافة، والزكاة الرحمة، والصوم ضبط النفس، والحج المساواة — فالعبادة أخلاق أولًا.'
    en: 'The five pillars in daily life: not isolated devotions but a day''s rhythm joining the ummah. The testimony is spoken in the adhan and at birth and death; the five prayers set the daylight''s hours from fajr to isha; zakat leaves the surplus yearly for the poor; fasting fills Ramadan with patience and God-consciousness; the Hajj gathers millions in Mecca once in a lifetime for whoever is able. These pillars are not only the individual''s burden: Friday''s prayer gathers the neighbourhood, the two Eids join family and community, and the sunnas of purity and greeting shape shared habits. From dawn to isha the Muslim lives one rhythm uniting a billion and a half across five continents.  That is why they are called pillars: as no house stands without foundations no faith stands without testimony, prayer, alms, fasting and Hajj — five walls holding up the Muslim''s house.'
    ur: 'روزمرہ زندگی میں پانچ ارکان: الگ تھلگ عبادتیں نہیں بلکہ دن کی وہ لے جو امت کو جوڑتی ہے۔ شہادت اذان میں اور پیدائش اور موت پر کہی جاتی ہے؛ پانچ نمازیں فجر سے عشاء تک دن کے اوقات مقرر کرتی ہیں؛ زکوٰۃ اضافی مال سے سالانہ فقیروں کو نکلتی ہے؛ روزہ رمضان کو صبر اور تقویٰ سے بھرتا ہے؛ اور حج ہر قادر شخص کے لیے عمر میں ایک بار مکہ میں لاکھوں کو جمع کرتا ہے۔ یہ ارکان صرف فرد کا بوجھ نہیں: جمعہ محلے کو جمع کرتا ہے، دونوں عیدیں خاندان اور برادری جوڑتی ہیں، اور طہارت اور سلام کی سنتیں مشترک عادات بناتی ہیں۔ فجر سے عشاء تک مسلمان ایک ہی لے جیتا ہے جو ڈیڑھ ارب کو پانچ براعظموں پر یکساں کرتی ہے۔  اسی لیے انہیں ارکان کہتے ہیں: جیسے بنیاد کے بغیر گھر نہیں کھڑا ہوتا ایسے شہادت، نماز، صدقہ، روزہ اور حج کے بغیر دین نہیں — پانچ دیواریں جو مسلمان کا گھر تھامتی ہیں۔'
  glossary:
  - term:
      ar: الشهادة
      en: the testimony
      ur: شہادت
    gloss:
      ar: 'الكلمة التي تبدأ بها الإسلام'
      en: 'the word Islam begins with'
      ur: 'وہ کلمہ جس سے اسلام شروع ہوتا ہے'
  - term:
      ar: الصلاة
      en: the prayer
      ur: نماز
    gloss:
      ar: 'الركن الذي يتكرّر خمسًا يوميًّا'
      en: 'the pillar repeated five times daily'
      ur: 'وہ رکن جو روزانہ پانچ بار دہرایا جاتا ہے'
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰت
    gloss:
      ar: 'الصدقة الواجبة السنوية'
      en: 'the yearly obligatory alms'
      ur: 'سالانہ لازم صدقہ'
  - term:
      ar: الصوم
      en: fasting
      ur: روزہ
    gloss:
      ar: 'الإمساك عن الطعام والشراب'
      en: 'holding off food and drink'
      ur: 'کھانے پینے سے رکنا'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الرحلة الكبرى إلى مكة'
      en: 'the great journey to Mecca'
      ur: 'مکہ کا عظیم سفر'
  - term:
      ar: مواقيت
      en: the prayer times
      ur: اوقات
    gloss:
      ar: 'ساعات النهار الخمس'
      en: 'the five hours of daylight'
