topics:
- id: crusades
  anchor: exhibit/pathway-g11-chw3m-crusades-muslim-side
  band: scholars
  title:
    ar: الحروب الصليبية
    en: the Crusades
    ur: صلیبی جنگیں
  sixty:
    ar: 'بين عامي ١٠٩٥ و١٢٩١ شنّت جيوش من غرب أوروبا سلسلة حملات على بلاد الشام ومصر وُعرفت بالحروب الصليبية. رآها مؤرخو المسلمين غزوًا أجنبيًا، بينما وصفتها كتب أوروبا بأنها حجّ مسلّح. انتصر الفرنجة في البداية لأن بلاد الشام كانت مقسّمة بين سلاطين متنافسين، فأقاموا أربع إمارات ساحلية منها الرها والقدس. وبقيت قوتهم في المدن المحصّنة أكثر مما سادت في الريف. لم تكن الحرب دينية خالصة: عقد الطرفان معاهدات وتبادلا تجارة وعلومًا، حتى قاتل المسلمون والفرنجة أحيانًا جنبًا إلى جنب. ثم وحّد صلاح الدين مصر والشام وهزمهم في حطين واستعاد القدس سنة ١١٨٧، وختم المماليك الحقبة بسقوط عكا ١٢٩١، وبقيت آثار الفرنجة في القلاع والطرق والذاكرة المشتركة. ورأينا في تلك الحقبة درسًا دائمًا: أن الفرقة تدعو الغزاة، والوحدة تسترد البلاد، وأن التعايش بين المخالفين ممكن حتى في زمن الحرب. ومن هذه البلاد حمل الغربُ بعد قرون صورةً مشوّهة عن الإسلام، فكان ردّ المؤرخين المسلمين أن الحكاية أعقد: غزو وحرب وتجارة وتعايش في آن.'
    en: 'Between 1095 and 1291, armies from western Europe mounted a series of campaigns on Syria and Egypt remembered as the Crusades. Muslim chroniclers saw a foreign invasion; European writers called it an armed pilgrimage. The Franks won early because Syria was divided among rival rulers, so they founded four coastal states, including Edessa and Jerusalem. Their strength lived in walled cities more than the countryside. The war was never purely religious: both sides signed truces, traded goods and ideas, and sometimes fought side by side. Then Saladin united Egypt and Syria, defeated them at Hattin, and recovered Jerusalem in 1187. The Mamluks ended the era at the fall of Acre in 1291, yet Frankish castles, roads and shared memory survived for centuries after. From that era we still read a lasting lesson: division invites invaders, unity recovers lands, and coexistence between rivals is possible even in wartime.'
    ur: '1095 اور 1291 کے درمیان مغربی یورپ کی فوجوں نے شام اور مصر پر ایک سلسلے میں مہمات چلائیں جو صلیبی جنگوں کے نام سے یاد کی جاتیں ہیں۔ مسلم مورخین نے انہیں غیر ملکی حملہ لکھا؛ یورپی مصنفین نے مسلح زیارت کہا۔ فرنگی شروع میں اس لیے کامیاب ہوئے کہ شام باہم جھگڑتے حکمرانوں میں بٹا تھا، اس لیے انہوں نے چار ساحلی ریاستیں بنا لیں جن میں رها اور بیت المقدس شامل تھے۔ ان کی طاقت دیہات سے زیادہ مضبوط شہروں میں رہی۔ جنگ کبھی محض مذہبی نہ رہی: دونوں فریق معاہدے کرتے، تجارت اور علم کا تبادلہ کرتے اور کبھی ساتھ ساتھ لڑتے۔ پھر صلاح الدین نے مصر اور شام متحد کیے، حطین میں شکست دی اور 1187 میں بیت المقدس واپس لیا۔ مملوکوں نے 1291 میں عکہ کے سقوط پر دور ختم کیا، مگر فرنگی قلعے، سڑکیں اور مشترک یادیں صدیوں زندہ رہیں۔ اس دور سے اب بھی ایک مستقل سبق پڑھا جاتا ہے: تقسیم حملہ آوروں کو بلاتی ہے، اتحاد سرزمین واپس دلاتا ہے، اور مخالفوں کا بقائے باہمی جنگ میں بھی ممکن ہے۔'
  glossary:
  - term:
      ar: الفرنج
      en: the Franks
      ur: فرنگی
    gloss:
      ar: 'ما سمّاه المسلمون الأوروبيين الغربيين الذين جاءوا إلى الشام في تلك الحملات'
      en: 'the name Muslims gave the western Europeans who came east on those campaigns'
      ur: 'مسلمانوں کا وہ نام جو انہوں نے ان مہموں پر مشرق آنے والے مغربی یورپیوں کو دیا'
  - term:
      ar: الإمارات الصليبية
      en: the Crusader states
      ur: صلیبی ریاستیں
    gloss:
      ar: 'أربع ممالك وإمارات أسسها الفرنجة على ساحل الشام وداخله لقرنين تقريبًا'
      en: 'the four states the Franks founded on the Syrian coast and inland for nearly two centuries'
      ur: 'فرنگیوں کی شامی ساحل اور اندرون میں قائم کردہ چار ریاستیں تقریباً دو صدیوں تک رہیں'
  - term:
      ar: عكا
      en: Acre
      ur: عکہ
    gloss:
      ar: 'المدينة الساحلية الحصينة التي سقطت سنة ١٢٩١ فانهارت معها آخر مملكة صليبية'
      en: 'the fortified coastal city whose fall in 1291 ended the last Crusader kingdom'
      ur: 'مضبوط ساحلی شہر جس کا 1291 میں سقوط آخری صلیبی ریاست کا خاتمہ تھا'
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: 'وقعة سنة ١١٨٧ التي كسر فيها صلاح الدين جيش الصليبيين وفتحت له طريق القدس'
      en: 'the 1187 battle where Saladin broke the Crusader army and opened his road to Jerusalem'
      ur: '1187 کی جنگ جس میں صلاح الدین نے صلیبی فوج کو توڑا اور بیت المقدس کا راستہ کھولا'
  - term:
      ar: الصليب
      en: the Cross
      ur: صلیب
    gloss:
      ar: 'علامة المسيحية التي اتخذها المقاتلون شعارًا ومنها اشتُق اسم الحروب نفسه'
      en: 'the Christian symbol the fighters carried as their emblem and the wars'' namesake'
      ur: 'مسیحی علامت جو لڑاکوں کا نشان بنی اور جس سے خود جنگوں کا نام پڑا'
  - term:
      ar: الهدنة
      en: the truce
      ur: صلح
    gloss:
      ar: 'اتفاقات وقف القتال التي جمعت الفريقين فترات طويلة بين جولات الحرب'
      en: 'the ceasefire agreements that held both sides for long stretches between rounds of war'
      ur: 'طویل عرصے جنگ کے دوروں کے درمیان دونوں فریقوں کو جوڑنے والے معاہدے'
  - term:
      ar: الرملة
      en: Ramla
      ur: رملہ
    gloss:
      ar: 'بلدة فلسطينية تبادلها الجانبان في هدنات متكررة فصارت عنوان التعايش'
      en: 'a Palestinian town that passed between the sides in repeated truces and came to mark coexistence'
      ur: 'ایک فلسطینی قصبہ جو بار بار معاہدوں میں دونوں فریقوں کے درمیان بدلتا رہا'
  - term:
      ar: الجهاد
      en: jihad
      ur: جہاد
    gloss:
      ar: 'اسم أطلقه المسلمون على مقاومتهم للغزو الفرنجي وارتبط بفكرة الدفاع عن الديار'
      en: 'the name Muslims gave their resistance to the Frankish invasion, tied to defending the homeland'
      ur: 'مسلمانوں کا اپنی سرزمین کے دفاع سے جڑا نام جو انہوں نے فرنگی مزاحمت کو دیا'
  - term:
      ar: القلعة
      en: the castle
      ur: قلعہ
    gloss:
      ar: 'الحصون الحجري مثل قلعة الحصن التي بناها الصليبيون وما زالت تقف اليوم'
      en: 'the stone keeps like Krak des Chevaliers the Crusaders built which still stand today'
      ur: 'پتھر کے مضبوط قلعے جیسے کراک دی شوالیے جو صلیبیوں نے بنائے اور آج بھی کھڑے ہیں'
  - term:
      ar: الأربعون سنة
      en: the forty years
      ur: چالیس سال
    gloss:
      ar: 'مدة بقاء معظم الإمارات الفرنجية قبل أن يستعيدها المسلمون تدريجًا'
      en: 'the rough span most Frankish states survived before Muslims gradually took them back'
      ur: 'تقریباً وہ دورانیہ جس میں فرنگی ریاستیں باقی رہیں قبل اس کے کہ مسلمان واپس لیں'
  - term:
      ar: المستعربة
      en: the Arabized Franks
      ur: عرب طرز کے فرنگی
    gloss:
      ar: 'فرنج الجيل الثاني الذين تكلموا العربية وعاشوا بعادات البلاد أكثر من أوروبا'
      en: 'second-generation Franks who spoke Arabic and lived by the land''s ways more than Europe''s'
      ur: 'دوسری نسل کے فرنگی جو عربی بولتے اور یورپ سے زیادہ مقامی رسموں پر جیتے تھے'
  - term:
      ar: عكا الكبرى
      en: the siege of Acre
      ur: عکہ کا محاصرہ
    gloss:
      ar: 'الحصار الطويل الذي قاده المماليك سنة ١٢٩١ فسقطت معه نهاية الوجود الصليبي'
      en: 'the long siege the Mamluks led in 1291 which brought the Crusader presence to its end'
      ur: 'لمبا محاصرہ جو 1291 میں مملوکوں نے کیا اور صلیبی موجودگی کا خاتمہ ہوا'
  practice:
  - q:
      ar: كم دامت الحروب الصليبية؟
      en: How long did the Crusades last?
      ur: صلیبی جنگیں کتنی دیر جاری رہیں؟
    options:
    - text:
        ar: نحو مائتي عام
        en: about two hundred years
        ur: تقریباً دو سو سال
      correct: true
      why:
        ar: من نداء البابا ١٠٩٥ إلى سقوط عكا ١٢٩١
        en: from the 1095 call to Acre's fall in 1291
        ur: 1095 کی پکار سے 1291 میں عکہ کے سقوط تک
    - text:
        ar: عشرون عامًا
        en: about twenty years
        ur: تقریباً بیس سال
      correct: false
      why:
        ar: هذا طول حملة واحدة فقط لا الحروب كلها
        en: that is the span of one campaign, not the whole wars
        ur: یہ تو صرف ایک مہم کا عرصہ ہے، تمام جنگوں کا نہیں
    - text:
        ar: أربعمائة عام
        en: about four hundred years
        ur: تقریباً چار سو سال
      correct: false
      why:
        ar: يتجاوز هذا عصر الحروب الصليبية بمراحل
        en: that runs well beyond the age of the Crusades
        ur: یہ صلیبی جنگوں کے زمانے سے کہیں زیادہ ہے
    - text:
        ar: عشر سنوات فقط
        en: only ten years
        ur: صرف دس سال
      correct: false
      why:
        ar: هذا عُمر إمارة صليبية واحدة صغيرة
        en: that is the life of one small Crusader state
        ur: یہ صرف ایک چھوٹی صلیبی ریاست کی عمر ہے
  - q:
      ar: لماذا نجح الفرنجة في البداية؟
      en: Why did the Franks succeed at first?
      ur: فرنگی ابتداء میں کیوں کامیاب ہوئے؟
    options:
    - text:
        ar: لأنّ بلاد الشام كانت منقسمة بين حكّام متحاربين
        en: because Syria was split among warring rulers
        ur: کیونکہ شام جنگجو حکمرانوں میں بٹا تھا
      correct: true
      why:
        ar: تذكر المصادر تفكك جبهة المقاومة قبل عودة التوحيد
        en: sources describe a divided resistance before reunification
        ur: ماخذ دوبارہ اتحاد سے پہلے کمزور مزاحمت کا ذکر کرتے ہیں
    - text:
        ar: لأنّ المسلمين لم يقاتلوا أبدًا
        en: because Muslims never fought back
        ur: کیونکہ مسلمانوں نے کبھی مزاحمت نہیں کی
      correct: false
      why:
        ar: قاتل المسلمون منذ البداية، لكنّ التنسيق كان ضعيفًا
        en: Muslims fought from the start; coordination was the weak part
        ur: مسلمان شروع سے لڑے؛ کمزوری رابطے میں تھی
    - text:
        ar: لأنّ أوروبا كانت أكثر عددًا
        en: because Europe had more people
        ur: کیونکہ یورپ کی آبادی زیادہ تھی
      correct: false
      why:
        ar: كان الجيش الصليبي صغيرًا مقارنة بجيوش المنطقة
        en: Crusader armies were small next to the region's armies
        ur: صلیبی فوجیں علاقائی فوجوں کے مقابلے میں چھوٹی تھیں
    - text:
        ar: لأنّ الفرنجة عرفوا الطرق أفضل
        en: because the Franks knew the roads better
        ur: کیونکہ فرنگی راستوں کو بہتر جانتے تھے
      correct: false
      why:
        ar: كانوا غرباء في بلاد لا يعرفونها
        en: they were newcomers in a land they did not know
        ur: وہ نئی سرزمین میں اجنبی تھے
  - q:
      ar: ماذا فعل صلاح الدين في ١١٨٧؟
      en: What did Saladin do in 1187?
      ur: صلاح الدین نے 1187 میں کیا کیا؟
    options:
    - text:
        ar: استعاد القدس بعد معركة حطين
        en: retook Jerusalem after the battle of Hattin
        ur: حطین کی جنگ کے بعد بیت المقدس واپس لیا
      correct: true
      why:
        ar: تفيد المصادر باستعادة المدينة في ربيع الأول ١١٨٧
        en: sources record the city's recovery in spring 1187
        ur: ماخذ موسم بہار 1187 میں شہر کی واپسی لکھتے ہیں
    - text:
        ar: غزا روما
        en: he invaded Rome
        ur: اس نے روم پر حملہ کیا
      correct: false
      why:
        ar: لم يغادر صلاح الدين الشرق الأوسط قط
        en: Saladin never left the Middle East
        ur: صلاح الدین کبھی مشرقِ وسطی سے باہر نہیں گیا
    - text:
        ar: أسّس إمارة صليبية
        en: he founded a Crusader state
        ur: اس نے ایک صلیبی ریاست بنائی
      correct: false
      why:
        ar: كان يوحّد المسلمين ضدّ الإمارات الصليبية
        en: he was uniting Muslims against the Crusader states
        ur: وہ مسلمانوں کو صلیبی ریاستوں کے خلاف متحد کر رہا تھا
    - text:
        ar: عقد صلحًا بقي خمسين عامًا
        en: he signed a fifty-year peace
        ur: اس نے پچاس سالہ صلح کی
      correct: false
      why:
        ar: كانت هدنه مؤقتة لا نصف قرن
        en: his truces were shorter pauses, not half a century
        ur: اس کی صلحیں عارضی وقفے تھیں، نصف صدی نہیں
  - q:
      ar: كم كان عدد الإمارات الصليبية؟
      en: How many Crusader states were there?
      ur: صلیبی ریاستیں کتنی تھیں؟
    options:
    - text:
        ar: أربع
        en: four
        ur: چار
      correct: true
      why:
        ar: إديسا وأنطاكية وطرابلس والمملكة اللاتينية
        en: Edessa, Antioch, Tripoli and the Latin kingdom
        ur: ایڈیسا، انطاکیہ، طرابلس اور لاطینی مملکت
    - text:
        ar: عشر
        en: ten
        ur: دس
      correct: false
      why:
        ar: هذا عدد المدن الرئيسية أكثر من الإمارات
        en: that is closer to the count of major cities
        ur: یہ بڑی شہر کی گنتی ہے، ریاستوں کی نہیں
    - text:
        ar: اثنتان
        en: two
        ur: دو
      correct: false
      why:
        ar: اثنتان فقط إن حُصرا بالساحل
        en: two only if you ignore inland states
        ur: صرف دو اگر اندرونی ریاستیں نظرانداز کریں
    - text:
        ar: إمارة واحدة فقط
        en: only one
        ur: صرف ایک
      correct: false
      why:
        ar: قسمت الفرنجة سيطرتهم إلى أربع ممالك
        en: the Franks split their holdings into four kingdoms
        ur: فرنگیوں نے اپنی حدود کو چار مملکتوں میں تقسیم کیا
  - q:
      ar: هل كانت الحروب الصليبية حربًا دينية خالصة؟
      en: Were the Crusades a purely religious war?
      ur: کیا صلیبی جنگیں محض مذہبی جنگ تھیں؟
    options:
    - text:
        ar: لا؛ شملت معاهدات وتجارة وشراكات
        en: no; truces, trade and partnerships were part of it
        ur: نہیں؛ صلحیں، تجارت اور شراکتیں بھی شامل تھیں
      correct: true
      why:
        ar: سجّل المؤرخون صلحًا وتجارة وتعاونًا عبر الطرفين
        en: chroniclers record peace, trade and cooperation across lines
        ur: مورخین دونوں طرف کے مابین صلح، تجارت اور تعاون درج کرتے ہیں
    - text:
        ar: نعم؛ لم يكن فيها إلا قتال دائم
        en: yes; it was nothing but constant fighting
        ur: ہاں؛ اس میں صرف مسلسل لڑائی تھی
      correct: false
      why:
        ar: دامت فترات الصلح أطول من فترات الحرب
        en: stretches of peace outlasted stretches of war
        ur: صلح کے دور جنگ کے دوروں سے طویل رہے
    - text:
        ar: لا؛ لم يشارك رجال دين فيها
        en: no; no clergy took part
        ur: نہیں؛ اس میں مذہبی رہنماؤں نے حصہ نہیں لیا
      correct: false
      why:
        ar: شاركت الخطابة والرهبانيات من الجانبين
        en: preachers and orders took part on both sides
        ur: دونوں طرف کے واعظ اور مذہبی ادارے شریک تھے
    - text:
        ar: لا؛ كانت حربًا بين مدن مسلمة
        en: no; it was a war between Muslim cities
        ur: نہیں؛ یہ مسلم شہروں کی جنگ تھی
      correct: false
      why:
        ar: كان العدوّ الأساسي غزوًا خارجيًا وإن تداخلت صراعات داخلية
        en: the main foe was an outside invasion, though internal struggles overlapped
        ur: اصل حریف بیرونی حملہ تھا، اگرچہ اندرونی تنازعات بھی تھے
  - q:
      ar: ما مصير آخر معقل صليبي؟
      en: What happened to the last Crusader stronghold?
      ur: آخری صلیبی گڑھ کا کیا ہوا؟
    options:
    - text:
        ar: سقطت عكا عام ١٢٩١
        en: Acre fell in 1291
        ur: عکہ 1291 میں گر گیا
      correct: true
      why:
        ar: سجّلت المصادر نهاية المملكة اللاتينية بسقوط عكا
        en: sources date the Latin kingdom's end to Acre's fall
        ur: ماخذ لاطینی مملکت کا خاتمہ عکہ کے سقوط پر لکھتے ہیں
    - text:
        ar: بقيت حتى القرن الخامس عشر
        en: it held out into the 1400s
        ur: یہ پندرہویں صدی تک قائم رہی
      correct: false
      why:
        ar: انتهت الوجود الصليبي البريّ عام ١٢٩١
        en: mainland Crusader presence ended in 1291
        ur: برّی صلیبی موجودگی 1291 میں ختم ہوئی
    - text:
        ar: سلّمها الصليبيون طوعًا
        en: the Crusaders handed it over freely
        ur: صلیبیوں نے خود سپردگی کی
      correct: false
      why:
        ar: جاء السقوط بعد محاصرة طويلة لا بتسليم
        en: it fell after a long siege, not a handover
        ur: یہ طویل محاصرے کے بعد گرا، خود تسلیم نہیں
    - text:
        ar: نقلها الصليبيون إلى روما
        en: the Crusaders moved it to Rome
        ur: صلیبی اسے روم لے گئے
      correct: false
      why:
        ar: كانت عكا مدينة لا يمكن نقلها
        en: Acre was a city, not something to move
        ur: عکہ ایک شہر تھا جو منتقل نہیں ہو سکتا
  - q:
      ar: أين تركّزت قوة الفرنجة؟
      en: Where was Frankish power concentrated?
      ur: فرنگی طاقت کہاں مرکوز تھی؟
    options:
    - text:
        ar: في المدن الساحلية والقلاع
        en: in the coastal cities and castles
        ur: ساحلی شہروں اور قلعوں میں
      correct: true
      why:
        ar: حكموا من بيروت وعكا والقلاع أكثر من الريف
        en: they ruled from Beirut, Acre and the castles more than the countryside
        ur: وہ بیروت، عکہ اور قلعوں سے دیہات کے مقابلے میں زیادہ حکمرانی کرتے تھے
    - text:
        ar: في الصحراء العربية
        en: in the Arabian desert
        ur: عرب کی صحرا میں
      correct: false
      why:
        ar: لم يمتدّ حكمهم إلى الصحراء
        en: their rule did not reach the desert
        ur: ان کی حکمرانی صحرا تک نہیں پہنچی
    - text:
        ar: في كلّ بلاد الشام بالتساوي
        en: equally across all Syria
        ur: پورے شام میں یکساں طور پر
      correct: false
      why:
        ar: كانت قوتهم في الساحل والقلاع، لا في كلّ الأرض
        en: their strength was the coast and the castles, not the whole land
        ur: ان کی طاقت ساحل اور قلعے تھی، پوری زمین نہیں
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: لم يحكم الفرنجة مصر قط
        en: the Franks never ruled Egypt
        ur: فرنگیوں نے کبھی مصر پر حکومت نہیں کی
  - q:
      ar: ما أثر الحروب الصليبية بعد انتهائها؟
      en: What did the Crusades leave behind?
      ur: صلیبی جنگوں کے بعد کیا بچا؟
    options:
    - text:
        ar: قلاع وطرق وذاكرة مشتركة
        en: castles, roads and shared memory
        ur: قلعے، سڑکیں اور مشترک یادیں
      correct: true
      why:
        ar: بقيت القلاع والطرق والحكايات في كتب كلا الجانبين
        en: the castles, roads and stories remained in both sides' books
        ur: قلعے، سڑکیں اور قصے دونوں طرف کی کتابوں میں رہے
    - text:
        ar: انتهى كلّ أثر لها فورًا
        en: all trace of them vanished at once
        ur: ان کا ہر نشان فوراً مٹ گیا
      correct: false
      why:
        ar: بقيت الإمارات والقلاع والذاكرة لأجيال
        en: the states, castles and memory lasted for generations
        ur: ریاستیں، قلعے اور یادیں نسلوں تک رہیں
    - text:
        ar: تحوّل الشرق الأوسط كله إلى أوروبا
        en: the whole Middle East turned European
        ur: پورا مشرقِ وسطی یورپی بن گیا
      correct: false
      why:
        ar: بقيت المنطقة على لغتها ودينها في غالبها
        en: the region mostly kept its languages and faith
        ur: خطہ عموماً اپنی زبانیں اور دین پر رہا
    - text:
        ar: انتهت التجارة بين الشرق والغرب
        en: East-West trade ended
        ur: مشرق و مغرب کی تجارت ختم ہو گئی
      correct: false
      why:
        ar: ازدادت التجارة بعد الحروب لا اختفت
        en: trade grew after the wars, it did not disappear
        ur: جنگوں کے بعد تجارت بڑھی، ختم نہیں ہوئی
  - q:
      ar: من كتب عن الحروب الصليبية؟
      en: Who wrote about the Crusades?
      ur: صلیبی جنگوں کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون من الجانبين المسلم والأوروبي
        en: historians on both the Muslim and European sides
        ur: مسلم اور یورپی دونوں طرف کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات ابن الأثير والفرنجة وغيرهما من الجهتين
        en: accounts reach us from Ibn al-Athir and Frankish writers alike
        ur: ابن اثیر اور فرنگی مصنفین دونوں کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: لا أحد؛ فُقدت السجلات كلها
        en: nobody; the records are all lost
        ur: کوئی نہیں؛ تمام ریکارڈ کھو گئے
      correct: false
      why:
        ar: بقيت روايات مفصّلة من الجانبين
        en: detailed accounts survive from both sides
        ur: دونوں طرف کی مفصل روایتیں باقی ہیں
    - text:
        ar: الأوروبيون فقط
        en: only the Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها بدورهم
        en: Muslims wrote their own accounts
        ur: مسلمانوں نے بھی اپنی روایتیں لکھیں
    - text:
        ar: المسلمون فقط
        en: only the Muslims
        ur: صرف مسلمان
      correct: false
      why:
        ar: تصلنا سجلات أوروبية أيضًا
        en: European records reach us too
        ur: یورپی ریکارڈ بھی ہم تک پہنچے ہیں
  - q:
      ar: ما معنى "الفرنجة" في كتب المسلمين؟
      en: What does "al-Firanj" mean in Muslim sources?
      ur: مسلم ماخذ میں "فرنگی" کا کیا مطلب ہے؟
    options:
    - text:
        ar: الأوروبيون الغربيون عامة
        en: western Europeans in general
        ur: عمومی طور پر مغربی یورپی
      correct: true
      why:
        ar: استعملتها الكتب للقوافل والجيش الصليبي
        en: the books used it for the invading forces and settlers
        ur: کتابوں نے اسے حملہ آوروں اور باسیوں کے لیے استعمال کیا
    - text:
        ar: الفرس
        en: the Persians
        ur: فارسی
      correct: false
      why:
        ar: كان للفرس اسم آخر في تلك الكتب
        en: Persians had their own name in those books
        ur: فارسیوں کا ان کتابوں میں اپنا نام تھا
    - text:
        ar: سكان البحر المتوسط
        en: Mediterranean natives
        ur: بحیرہ روم کے رہائشی
      correct: false
      why:
        ar: كان اللفظ للغرباء القادمين لا لأهل الساحل
        en: the word was for the newcomers, not the coastal people
        ur: یہ لفظ نئے آنے والوں کے لیے تھا، ساحلی باشندوں کے لیے نہیں
    - text:
        ar: جيش روما القديمة
        en: the army of ancient Rome
        ur: قدیم روم کی فوج
      correct: false
      why:
        ar: كانت الحملة في القرن الثاني عشر لا في العصور القديمة
        en: the campaign was twelfth-century, not ancient
        ur: مہم بارہویں صدی کی تھی، قدیم زمانے کی نہیں
- id: hijra
  anchor: event/hijra
  band: scholars
  title:
    ar: الهجرة
    en: the Hijra
    ur: ہجرت
  sixty:
    ar: 'في سنة ٦٢٢ هاجر النبي من مكة إلى يثرب فصارت المدينة، وكانت الهجرة نقطة تحوّل لا رحلة هروب. استقبل الأنصار المهاجرين فقاسموهم الديار والأموال، وبنى المسلمون أول مجتمع مستقل لهم: مسجدًا يجمعهم، ووثيقة تنظّم حقوق المسلمين واليهود وبقية القبائل، وأسواقًا تُقام على قواعد جديدة. من المدينة خرجت بدر وأحد وخيبر، وإليها عاد الناس أفواجًا بعد فتح مكة سنة ٦٣٠. ولمّا توفي النبي بقي الأمر للخلفاء الراشدين ثم انتقلت العاصمة إلى الكوفة فدمشق. واليوم يقصد ملايين المسلمين المدينة لزيارة مسجده، ويظل اسم يثرب شاهدًا على أن مجتمعًا جديدًا يمكن أن يولد من هجرة. وبهذا صارت الهجرة درس الأمة الأول: أن العقيدة تحتاج دارًا، والدار تحتاج نظامًا، والنظام يحتاج صبرًا. ولذلك بدأ المسلمون بهذا الحدث تقويمهم: لا من مولد النبي ولا من بدء الوحي، بل من يوم صار للإسلام دار ودولة. وفي كل عام يتذكّر المسلمون تلك الأيام: ليلة الخروج، وكهف ثور، وقباء، ودخول المدينة وناسها يستقبلون بالأناشيد.'
    en: 'In 622 the Prophet left Mecca for Yathrib — soon called Medina, the City — and the Hijra became a turning point, not a flight. The Ansar welcomed the emigrants, sharing homes and wealth, and the Muslims built their first self-governing community: a mosque that gathered them, a charter regulating the rights of Muslims, Jews and the remaining tribes, and markets run on new rules. From Medina went out Badr, Uhud and Khaybar; to it people flocked after the conquest of Mecca in 630. When the Prophet died, the Rightly Guided caliphs ruled there before the capital moved to Kufa, then Damascus. Today millions of Muslims visit his mosque in Medina, and the old name Yathrib still recalls how a new community can be born out of a migration. In this the Hijra stands as the ummah''s first lesson: a faith needs a home, a home needs an order, and an order needs patience.'
    ur: '622 میں نبی مکہ سے یثرب — جو جلد مدینہ کہلائی — ہجرت کی، اور یہ ہجرت فرار نہیں بلکہ نقطۂ آغاز بنی۔ انصار نے مہاجرین کا خیرمقدم کیا اور گھر اور مال بانٹے، اور مسلمانوں نے اپنی پہلی خود مختار برادری بنائی: ایک مسجد جو سب کو جمع کرے، ایک میثاق جو مسلمانوں، یہود اور قبائل کے حقوق لکھے، اور نئے اصولوں پر بازار۔ مدینہ سے بدر، احد اور خیبر نکلے؛ اور 630 میں فتح مکہ کے بعد لوگ جوق در جوق واپس آئے۔ نبی کی وفات کے بعد خلفائے راشدین وہیں حکمران رہے پھر دارالحکومت کوفہ اور دمشق منتقل ہوا۔ آج لاکھوں مسلمان اس کی مسجد کی زیارت کرتے ہیں، اور پرانا نام یثرب اب بھی بتاتا ہے کہ ہجرت سے نئی برادری جنم لیتی ہے۔ اسی لیے ہجرت امت کا پہلا سبق رہی: عقیدے کو گھر چاہیے، گھر کو نظم، اور نظم کو صبر۔'
  glossary:
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: 'الاسم القديم للمدينة قبل هجرة النبي إليها سنة ٦٢٢ فصارت مدينته'
      en: 'the old name of the town before the Prophet''s migration there in 622 made it his city'
      ur: 'شہر کا پرانا نام قبل اس کے کہ 622 میں نبی کی ہجرت نے اسے ان کا شہر بنایا'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'أهل مكة الذين تركوا ديارهم وأموالهم وهاجروا مع النبي إلى المدينة'
      en: 'the Meccans who left their homes and wealth to migrate with the Prophet to Medina'
      ur: 'مکہ کے لوگ جنھوں نے گھر اور مال چھوڑ کر نبی کے ساتھ مدینہ ہجرت کی'
  - term:
      ar: الأنصار
      en: the Ansar
      ur: انصار
    gloss:
      ar: 'أهل يثرب من الأوس والخزرج الذين نصروا المهاجرين وآووهم في ديارهم'
      en: 'the people of Yathrib of Aws and Khazraj who sheltered the emigrants in their homes'
      ur: 'یثرب کے اوس و خزرج کے لوگ جنھوں نے مہاجرین کو اپنے گھروں میں پناہ دی'
  - term:
      ar: وثيقة المدينة
      en: the Constitution of Medina
      ur: میثاقِ مدینہ
    gloss:
      ar: 'الصحيفة التي نظّمت حقوق مسلمي المدينة ويهودها وسائر قبائلها على شراكة واحدة'
      en: 'the charter that set the rights of Medina''s Muslims, Jews and remaining tribes on one footing'
      ur: 'وہ فرمان جس نے مدینہ کے مسلمانوں، یہود اور قبائل کے حقوق ایک نظم میں لکھے'
  - term:
      ar: المسجد النبوي
      en: the Prophet's mosque
      ur: مسجدِ نبوی
    gloss:
      ar: 'أول مسجد بنّاه المسلمون في المدينة وصار قلب الجماعة ومنبرها حتى اليوم'
      en: 'the first mosque the Muslims built in Medina, still the community''s heart and pulpit today'
      ur: 'مدینہ میں مسلمانوں کی بنائی ہوئی پہلی مسجد جو آج بھی برادری کا دل و منبر ہے'
  - term:
      ar: التقويم الهجري
      en: the Hijri calendar
      ur: ہجری تقویم
    gloss:
      ar: 'النظام الزمني الذي بدأ من الهجرة وصار به المسلمون يؤرّخون حتى اليوم'
      en: 'the timekeeping system counted from the Hijra by which Muslims still date their years today'
      ur: 'وہ تقویمی نظام جو ہجرت سے شروع ہوا اور جس سے مسلمان آج تک سال گنتے ہیں'
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'الرحلة التي غيّرت التاريخ: خروج النبي من مكة إلى يثرب ونشأة أول دولة مسلمة'
      en: 'the journey that changed history — the Prophet''s leaving Mecca for Yathrib and the first Muslim polity'
      ur: 'وہ سفر جس نے تاریخ بدلی — مکہ سے یثرب نبی کا جانا اور پہلی مسلم ریاست کا قیام'
  - term:
      ar: النبي
      en: the Prophet
      ur: نبی
    gloss:
      ar: 'محمد رسول الله الذي قاد الهجرة وأسس في المدينة قلب أمّة بأكملها'
      en: 'Muhammad, God''s messenger, who led the migration and founded the heart of an entire ummah'
      ur: 'محمد رسول خدا جس نے ہجرت کی قیادت کی اور پوری امت کا مرکز بسایا'
  - term:
      ar: اليهود في المدينة
      en: Medina's Jews
      ur: مدینہ کے یہود
    gloss:
      ar: 'طوائف يثرب اليهودية التي رتّبت الوثيقة علاقتها مع المسلمين قبل تغيّر الأحوال'
      en: 'the Jewish groups of Yathrib whose relations with Muslims the charter set before affairs changed'
      ur: 'یثرب کے یہودی طائفے جن کا مسلمانوں سے تعلق میثاق نے طے کیا حالات بدلنے سے پہلے'
  - term:
      ar: الأوس والخزرج
      en: Aws and Khazraj
      ur: اوس اور خزرج
    gloss:
      ar: 'القبيلتان العربيتان المتناحرتان اللتان صارتا سند الدعوة بعد الهجرة'
      en: 'the two feuding Arab tribes of Yathrib that became the call''s backbone after the Hijra'
      ur: 'یثرب کے دو باہم لڑتے عرب قبیلے جو ہجرت کے بعد دعوت کی کمر بنے'
  - term:
      ar: الصحبة
      en: the companions
      ur: صحابہ
    gloss:
      ar: 'أصحاب النبي الملازمون له في مكة والمدينة الذين حملوا الدعوة إلى العالم'
      en: 'the Prophet''s close followers in Mecca and Medina who carried the call to the world'
      ur: 'نبی کے قریبی ساتھی مکہ اور مدینہ میں جنھوں نے دعوت کو دنیا تک پہنچایا'
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: 'عودة النبي إلى مكة منتصرًا سنة ٦٣٠ فدخلها بسلام وطهّر الكعبة'
      en: 'the Prophet''s victorious return to Mecca in 630, entering it peacefully and cleansing the Kaaba'
      ur: '630 میں نبی کی مکہ فاتحانہ واپسی — امن سے داخل ہوئے اور کعبہ پاک کیا'
  practice:
  - q:
      ar: متى وقعت الهجرة؟
      en: When did the Hijra happen?
      ur: ہجرت کب ہوئی؟
    options:
    - text:
        ar: عام ٦٢٢ ميلادي
        en: in 622 CE
        ur: 622 عیسوی میں
      correct: true
      why:
        ar: سجّلت المصادر سنة الهجرة ٦٢٢ وبدأت بها التقويم
        en: sources date the Hijra to 622, the calendar's starting year
        ur: ماخذ ہجرت کو 622 لکھتے ہیں، تقویم کا آغاز سال
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ذلك العام كان فتح مكة لا الهجرة
        en: that year was the conquest of Mecca, not the Hijra
        ur: وہ سال فتح مکہ کا تھا، ہجرت کا نہیں
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ذلك العام بدأت الرسالة في مكة
        en: that year began the revelation in Mecca
        ur: وہ سال مکہ میں وحی کا آغاز تھا
    - text:
        ar: عام ٦٥٠
        en: in 650
        ur: 650 میں
      correct: false
      why:
        ar: ذلك بعد وفاة النبي بسنوات
        en: that was years after the Prophet's death
        ur: یہ نبی کی وفات کے برسوں بعد تھا
  - q:
      ar: إلى أين كانت الهجرة؟
      en: Where did the Hijra go?
      ur: ہجرت کہاں کی طرف ہوئی؟
    options:
    - text:
        ar: إلى يثرب التي صارت المدينة
        en: to Yathrib, which became Medina
        ur: یثرب کی طرف، جو مدینہ بن گئی
      correct: true
      why:
        ar: دعا أهل يثرب النبي إليها فصارت مركز الدولة
        en: Yathrib's people invited him, and it became the polity's centre
        ur: یثرب کے لوگوں نے ان کو بلایا، اور یہ ریاست کا مرکز بنا
    - text:
        ar: إلى دمشق
        en: to Damascus
        ur: دمشق کی طرف
      correct: false
      why:
        ar: لم تدخل دمشق في دائرة الهجرة
        en: Damascus was not part of the Hijra
        ur: دمشق ہجرت کا حصہ نہیں تھا
    - text:
        ar: إلى مصر
        en: to Egypt
        ur: مصر کی طرف
      correct: false
      why:
        ar: بقيت مصر خارج رحلة الهجرة
        en: Egypt was outside the Hijra's route
        ur: مصر ہجرت کے راستے سے باہر تھا
    - text:
        ar: إلى بغداد
        en: to Baghdad
        ur: بغداد کی طرف
      correct: false
      why:
        ar: لم تكن بغداد موجودة آنذاك
        en: Baghdad did not yet exist
        ur: اس وقت بغداد موجود ہی نہیں تھا
  - q:
      ar: لماذا هاجر النبي؟
      en: Why did the Prophet migrate?
      ur: نبی نے ہجرت کیوں کی؟
    options:
    - text:
        ar: بدعوة من أهل يثرب وبعد اضطهاد مكة
        en: by Yathrib's invitation after Meccan persecution
        ur: یثرب کی دعوت پر، مکہ کے ظلم کے بعد
      correct: true
      why:
        ar: جمعت الهجرة الهروب من الأذى وبناء دولة جديدة
        en: the move joined escaping harm with building a new polity
        ur: اس منتقلی نے ظلم سے بچنا اور نئی ریاست بنانا جوڑا
    - text:
        ar: للتجارة فقط
        en: for trade only
        ur: صرف تجارت کے لیے
      correct: false
      why:
        ar: لم تكن غايته التجارة بل بناء الجماعة
        en: its aim was not trade but building the community
        ur: اس کا مقصد تجارت نہیں بلکہ جماعت بنانا تھا
    - text:
        ar: لزيارة الأقارب
        en: to visit relatives
        ur: رشتہ داروں سے ملنے
      correct: false
      why:
        ar: كانت هجرة سياسية دينية لا زيارة
        en: it was a religious-political migration, not a visit
        ur: یہ مذہبی-سیاسی ہجرت تھی، ملاقات نہیں
    - text:
        ar: لأنّ يثرب كانت أقرب مدينة
        en: because Yathrib was the closest town
        ur: کیونکہ یثرب قریب ترین شہر تھا
      correct: false
      why:
        ar: لم يكن القرب سبب الاختيار بل الدعوة
        en: proximity was not the reason; the invitation was
        ur: قرب وجہ نہیں تھا؛ دعوت تھی
  - q:
      ar: ما وثيقة المدينة؟
      en: What was the Constitution of Medina?
      ur: میثاقِ مدینہ کیا تھا؟
    options:
    - text:
        ar: عقد بين المسلمين وقبائل المدينة وحلفائهم
        en: a pact between Muslims, Medina's tribes and their allies
        ur: مسلمانوں، مدینہ کے قبائل اور ان کے حلیفوں کے درمیان عہد
      correct: true
      why:
        ar: جمعت الوثيقة أطراف المدينة في نظام مشترك
        en: the document bound Medina's parties into one shared order
        ur: اس دستاویز نے مدینہ کے فریقوں کو ایک مشترک نظم میں باندھا
    - text:
        ar: معاهدة تجارية بين مكة ويثرب
        en: a trade treaty between Mecca and Yathrib
        ur: مکہ اور یثرب کے درمیان تجارتی معاہدہ
      correct: false
      why:
        ar: كانت عقدًا داخليًا لأهل المدينة لا معاهدة تجارة
        en: it was Medina's internal pact, not a trade treaty
        ur: یہ مدینہ کا اندرونی عہد تھا، تجارتی معاہدہ نہیں
    - text:
        ar: دستور كتبه الفرنجة لاحقًا
        en: a constitution written later by the Franks
        ur: ایک آئین جو بعد میں فرنگیوں نے لکھا
      correct: false
      why:
        ar: كُتبت في زمن النبي لا في العصور اللاحقة
        en: it was written in the Prophet's time, not later
        ur: یہ نبی کے زمانے میں لکھی گئی، بعد میں نہیں
    - text:
        ar: رسالة سرية بين المهاجرين فقط
        en: a secret letter among the migrants only
        ur: صرف مہاجرین کے درمیان خفیہ خط
      correct: false
      why:
        ar: شملت جميع أطراف المدينة، لا المهاجرين وحدهم
        en: it covered all of Medina's parties, not just the migrants
        ur: اس میں مدینہ کے تمام فریق شامل تھے، صرف مہاجرین نہیں
  - q:
      ar: ماذا غيّرت الهجرة في المسلمين؟
      en: What did the Hijra change for Muslims?
      ur: ہجرت نے مسلمانوں کے لیے کیا بدلا؟
    options:
    - text:
        ar: صاروا مجتمعًا مستقلًّا بدولته الخاصة
        en: they became an independent society with its own polity
        ur: وہ اپنی ریاست والا آزاد معاشرہ بن گئے
      correct: true
      why:
        ar: انتقلت الجماعة من محاصرة مكية إلى بنيان مدني
        en: the community moved from a besieged Meccan group to a civic structure
        ur: جماعت محصور مکی گروہ سے شہری نظم میں بدل گئی
    - text:
        ar: لم يتغير شيء
        en: nothing changed
        ur: کچھ نہیں بدلا
      correct: false
      why:
        ar: بدأت دولة وتقويم ومركز جديد للتعليم
        en: a state, a calendar and a new centre of learning began
        ur: ایک ریاست، تقویم اور علم کا نیا مرکز شروع ہوا
    - text:
        ar: تركوا مكة نهائيًا بلا عودة
        en: they left Mecca forever
        ur: انہوں نے مکہ ہمیشہ کے لیے چھوڑ دیا
      correct: false
      why:
        ar: عادوا إلى مكة بعد ثماني سنوات في الفتح
        en: they returned to Mecca eight years later at the conquest
        ur: وہ آٹھ سال بعد فتح میں مکہ واپس آئے
    - text:
        ar: صاروا أقلّ عددًا من قبل
        en: they became fewer than before
        ur: وہ پہلے سے کم ہو گئے
      correct: false
      why:
        ar: نما عدد المسلمين في المدينة لا نقص
        en: Muslim numbers grew in Medina, not shrank
        ur: مدینہ میں مسلمان بڑھے، کم نہیں ہوئے
  - q:
      ar: من كتب عن الهجرة؟
      en: Who wrote about the Hijra?
      ur: ہجرت کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون من السيرة والتواريخ المبكرة
        en: chroniclers of the sira and early histories
        ur: سیرت اور ابتدائی تواریخ کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والواقدي والطبري
        en: accounts reach us from Ibn Ishaq, al-Waqidi and al-Tabari
        ur: ابن اسحاق، واقدی اور طبری کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تصلنا روايات مبكرة من كتب السيرة
        en: early sira accounts reach us
        ur: ابتدائی سیرت کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: المستشرقون فقط
        en: only orientalists
        ur: صرف مستشرقین
      correct: false
      why:
        ar: سبقت روايات السيرة العربية بقرون
        en: Arabic sira accounts predate orientalism by centuries
        ur: عربی سیرت کی روایتیں صدیوں پہلے کی ہیں
    - text:
        ar: الأنصار فقط
        en: only the Ansar
        ur: صرف انصار
      correct: false
      why:
        ar: تصلنا روايات مهاجرين وأنصار على حد سواء
        en: migrant and Ansar accounts both reach us
        ur: مہاجرین اور انصار دونوں کی روایتیں ہم تک پہنچی ہیں
  - q:
      ar: لماذا بدأ التقويم الهجري من الهجرة؟
      en: Why does the Hijri calendar start from the Hijra?
      ur: ہجری تقویم ہجرت سے کیوں شروع ہوتی ہے؟
    options:
    - text:
        ar: لأنها لحظة قيام الدولة الإسلامية
        en: because it marks the founding of the Islamic polity
        ur: کیونکہ یہ اسلامی ریاست کے قیام کی علامت ہے
      correct: true
      why:
        ar: اختار الخلفاء لاحقًا سنة الهجرة بداية للتاريخ الإسلامي
        en: later caliphs chose the Hijra year as the Islamic era's start
        ur: بعد کے خلفاء نے ہجرت کے سال کو اسلامی عہد کا آغاز چنا
    - text:
        ar: لأنها سنة ميلاد النبي
        en: because it is the Prophet's birth year
        ur: کیونکہ یہ نبی کا سالِ پیدائش ہے
      correct: false
      why:
        ar: ولد النبي قبل الهجرة بنحو ٥٣ سنة
        en: the Prophet was born about 53 years before the Hijra
        ur: نبی ہجرت سے تقریباً 53 سال پہلے پیدا ہوئے
    - text:
        ar: لأنها سنة فتح مكة
        en: because it is the conquest year
        ur: کیونکہ یہ فتح کا سال ہے
      correct: false
      why:
        ar: كان الفتح بعد الهجرة بثماني سنوات
        en: the conquest was eight years after the Hijra
        ur: فتح ہجرت کے آٹھ سال بعد تھی
    - text:
        ar: لأن القرآن أمر بذلك
        en: because the Quran commanded it
        ur: کیونکہ قرآن نے اس کا حکم دیا
      correct: false
      why:
        ar: كان اختيارًا إداريًا لاحقًا لا نصًّا قرآنيًا
        en: it was a later administrative choice, not a Quranic command
        ur: یہ بعد کا انتظامی فیصلہ تھا، قرآنی حکم نہیں
  - q:
      ar: ماذا جاء بعد الهجرة بثماني سنوات؟
      en: What came eight years after the Hijra?
      ur: ہجرت کے آٹھ سال بعد کیا آیا؟
    options:
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: true
      why:
        ar: عاد المسلمون إلى مكة عام ٦٣٠
        en: the Muslims returned to Mecca in 630
        ur: مسلمان 630 میں مکہ واپس آئے
    - text:
        ar: موت النبي
        en: the Prophet's death
        ur: نبی کی وفات
      correct: false
      why:
        ar: توفي النبي عام ٦٣٢ بعد الفتح بسنتين
        en: he died in 632, two years after the conquest
        ur: ان کی وفات 632 میں ہوئی، فتح کے دو سال بعد
    - text:
        ar: سقوط عكا
        en: the fall of Acre
        ur: عکہ کا سقوط
      correct: false
      why:
        ar: كان ذلك عام ١٢٩١ بعد قرون
        en: that was in 1291, centuries later
        ur: یہ 1291 میں تھا، صدیوں بعد
    - text:
        ar: بداية الحروب الصليبية
        en: the start of the Crusades
        ur: صلیبی جنگوں کا آغاز
      correct: false
      why:
        ar: كانت الحروب الصليبية في ١٠٩٥
        en: the Crusades began in 1095
        ur: صلیبی جنگیں 1095 میں شروع ہوئیں
  - q:
      ar: من كان الأنصار؟
      en: Who were the Ansar?
      ur: انصار کون تھے؟
    options:
    - text:
        ar: أهل يثرب الذين آووا المهاجرين
        en: the people of Yathrib who hosted the migrants
        ur: یثرب کے وہ لوگ جنہوں نے مہاجرین کی میزبانی کی
      correct: true
      why:
        ar: سمّوا أنصارًا لنصرتهم للنبي والمهاجرين
        en: they were called Ansar for aiding the Prophet and the migrants
        ur: انہیں نبی اور مہاجرین کی مدد پر انصار کہا گیا
    - text:
        ar: أهل مكة الذين هاجروا
        en: the Meccans who migrated
        ur: مکہ کے وہ لوگ جنہوں نے ہجرت کی
      correct: false
      why:
        ar: أولئك كانوا المهاجرين لا الأنصار
        en: those were the migrants, not the Ansar
        ur: وہ مہاجرین تھے، انصار نہیں
    - text:
        ar: جيش النبي في الفتح
        en: the Prophet's army at the conquest
        ur: فتح میں نبی کی فوج
      correct: false
      why:
        ar: كان الأنصار طائفة من أهل المدينة لا جيشًا عسكريًا فقط
        en: the Ansar were Medina's host community, not just an army
        ur: انصار مدینہ کی میزبان جماعت تھی، صرف فوج نہیں
    - text:
        ar: قبائل عربية في الشام
        en: Arab tribes in Syria
        ur: شام کے عرب قبائل
      correct: false
      why:
        ar: كان الأنصار في يثرب لا في الشام
        en: the Ansar were in Yathrib, not Syria
        ur: انصار یثرب میں تھے، شام میں نہیں
  - q:
      ar: كم عُدّت يثرب قبل الإسلام؟
      en: How was Yathrib described before Islam?
      ur: اسلام سے پہلے یثرب کیسا تھا؟
    options:
    - text:
        ar: واحة فيها قبائل متنافسة وحلفاء يهود
        en: an oasis of rival tribes with Jewish allies
        ur: ایک نخلستان جس میں متحارب قبائل اور یہودی حلیف تھے
      correct: true
      why:
        ar: وصفت المصادر تنازع الأوس والخزرج وتحالفات يهودية
        en: sources describe Aws-Khazraj rivalry and Jewish alliances
        ur: ماخذ اوس-خزرج کی دشمنی اور یہودی اتحادوں کا ذکر کرتے ہیں
    - text:
        ar: مدينة موحّدة تحت ملك واحد
        en: a unified city under one king
        ur: ایک بادشاہ کے تحت متحد شہر
      correct: false
      why:
        ar: لم تكن يثرب تحت حكم واحد قبل الهجرة
        en: Yathrib was not under one ruler before the Hijra
        ur: ہجرت سے پہلے یثرب ایک حکمران کے تحت نہیں تھا
    - text:
        ar: ميناء بحري على الخليج
        en: a seaport on the Gulf
        ur: خلیج پر ایک بندرگاہ
      correct: false
      why:
        ar: كانت يثرب واحة داخلية لا ميناء
        en: Yathrib was an inland oasis, not a port
        ur: یثرب اندرونی نخلستان تھا، بندرگاہ نہیں
    - text:
        ar: أرض فارغة بلا سكان
        en: empty land with no people
        ur: بے آباد زمین
      correct: false
      why:
        ar: كان فيها قبائل وزراعة وتجارة قبل الإسلام
        en: it had tribes, farming and trade before Islam
        ur: اسلام سے پہلے اس میں قبائل، کھیتی اور تجارت تھے
- id: five-pillars
  anchor: concept/five-pillars
  band: scholars
  title:
    ar: أركان الإسلام الخمسة
    en: the five pillars
    ur: اسلام کے پانچ ارکان
  sixty:
    ar: 'تقوم عبادة المسلمين على خمسة أركان: الشهادة أن لا إله إلا الله وأن محمدًا رسوله، والصلاة خمس مرات في اليوم، والزكاة نصيب للفقراء في المال، والصوم في رمضان، والحج إلى بيت الله لمن استطاع. هذه الأركان ليست مجرد عادات؛ إنها بناء يومي يربط العبد بربه وبجيرانه. فالشهادة تُعلَّن في الولادة والصلاة، والصلاة توقف النهار خمس مرات فيتعوّد الإنسان النظام، والزكاة تُخرج المال من حبّ اليد إلى يد الحاجة، والصوم يعلّم الصبر والرحمة، والحج يجمع المسلمين من كل أرض في زي واحد وموقف واحد. وبهذا يصير الدين عيشًا لا كلامًا. ولهذا سمّيت أركانًا: كما لا يقوم البيت بلا أعمدة، لا يقوم دين المسلم بغيرها، فهي هيكل اليوم والسنة والعمر كله. فإذا اجتمعت تلك الخمسة رأيت مسلمًا كامل الطقس: شهادة في قلبه، وصلاة على لسانه، وصدقة في يده، وصبرًا في جسده، وحجًّا في أمله. وهذا هو الإسلام باختصاره العملي: إيمان بالقلب واللسان، ثم جسدٌ ومالٌ يشهدان، وعمرٌ كامل يدور حول تلك الأركان الخمسة.'
    en: 'Muslim worship stands on five pillars: the testimony that there is no god but God and Muhammad is His messenger; prayer five times a day; zakat, the share the poor hold in one''s wealth; fasting through Ramadan; and the Hajj to God''s House for whoever is able. These are not mere habits — they are a daily frame linking a person to God and to neighbors. The testimony is announced at birth and echoed in every prayer; prayer interrupts the day five times and teaches order; zakat moves money from a tight hand to a needy one; fasting schools patience and mercy; and the Hajj gathers Muslims from every land in one dress and one standing. In this way faith becomes a life, not just words. That is why they are called pillars: as no house stands without columns, a Muslim''s faith does not stand without them — the frame of a day, a year and a whole life.'
    ur: 'مسلمانوں کی عبادت پانچ ارکان پر قائم ہے: شہادت کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے رسول ہیں؛ دن میں پانچ وقت نماز؛ زکوٰۃ، مال میں فقیروں کا حصہ؛ رمضان کا روزہ؛ اور جو استطاعت رکھے اس کے لیے بیت اللہ کا حج۔ یہ محض عادتیں نہیں — یہ روزمرہ ڈھانچہ ہے جو انسان کو خدا اور ہمسائیوں سے جوڑتا ہے۔ شہادت پیدائش پر کہی جاتی ہے اور ہر نماز میں گونجتی ہے؛ نماز دن کو پانچ بار روک کر نظم سکھاتی ہے؛ زکوٰۃ مال کو بند ہاتھ سے محتاج کے ہاتھ پہنچاتی ہے؛ روزہ صبر اور رحم سکھاتا ہے؛ اور حج ہر سرزمین کے مسلمانوں کو ایک لباس اور ایک موقف میں جمع کرتا ہے۔ اس طرح دین زندگی بنتا ہے، محض باتیں نہیں۔ اسی لیے انہیں ارکان کہا گیا: جس طرح گھر ستونوں کے بغیر نہیں کھڑا، مسلمان کا دین ان کے بغیر نہیں کھڑا — یہ دن، سال اور ساری زندگی کا ڈھانچہ ہے۔'
  glossary:
  - term:
      ar: الشهادة
      en: the testimony
      ur: شہادت
    gloss:
      ar: 'الإعلان أن لا إله إلا الله ومحمد رسوله، مدخل الإسلام كله'
      en: 'the declaration that there is no god but God and Muhammad is His messenger — Islam''s doorway'
      ur: 'اعلان کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے رسول ہیں — اسلام کا دروازہ'
  - term:
      ar: الصلاة
      en: the prayer
      ur: نماز
    gloss:
      ar: 'العبادة اليومية الخمس التي توقف النهار وتصل المسلم بربه'
      en: 'the five daily devotions that pause the day and link the Muslim to God'
      ur: 'روزانہ پانچ عبادتیں جو دن کو روکیں اور مسلمان کو خدا سے جوڑیں'
  - term:
      ar: الزكاة
      en: zakat
      ur: زکوٰۃ
    gloss:
      ar: 'حق الفقراء في مال الموسرين، نسبة مؤكدة تخرج كل سنة'
      en: 'the poor''s rightful share in the wealthy''s money, a fixed fraction paid each year'
      ur: 'امیروں کے مال میں فقیروں کا حق — ہر سال ادا ہونے والا مقررہ حصہ'
  - term:
      ar: الصوم
      en: the fast
      ur: روزہ
    gloss:
      ar: 'إمساك الطعام والشراب من الفجر إلى الغروب، مدرسة للصبر والرحمة'
      en: 'abstaining from food and drink dawn to dusk — a school of patience and mercy'
      ur: 'طلوع فجر سے غروب تک کھانا پینا چھوڑنا — صبر اور رحم کا درس'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'رحلة الكعبة الكبرى التي يؤدّيها المسلم مرة في العمر إن استطاع'
      en: 'the great Kaaba journey a Muslim performs once in life if able'
      ur: 'کعبہ کا وہ بڑا سفر جو مسلمان عمر میں ایک بار ادا کرے اگر استطاعت ہو'
  - term:
      ar: التوحيد
      en: tawhid
      ur: توحید
    gloss:
      ar: 'توحيد الله وإفراده بالعبادة، قلب الشهادة وأساس الدين كله'
      en: 'God''s oneness and sole worship — the testimony''s heart and the faith''s whole root'
      ur: 'خدا کی وحدانیت اور اسی کی عبادت — شہادت کا دل اور دین کی جڑ'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي يصلّي المسلمون إليه في كل أرض، نحو الكعبة في مكة'
      en: 'the direction Muslims face in prayer everywhere, toward the Kaaba in Mecca'
      ur: 'وہ سمت جس کی طرف مسلمان دنیا بھر میں نماز پڑھتے ہیں — مکہ میں کعبہ'
  - term:
      ar: النية
      en: the intention
      ur: نیت
    gloss:
      ar: 'قصد القلب الذي يفتتح به كل عمل، فالأعمال بها وبحسبها'
      en: 'the heart''s resolve that opens every deed — deeds are judged by it'
      ur: 'دل کا ارادہ جو ہر عمل کا آغاز ہے — اعمال اسی سے تولے جاتے ہیں'
  - term:
      ar: الركن
      en: the pillar
      ur: رکن
    gloss:
      ar: 'الدعامة التي يقوم عليها البناء؛ هكذا وصُفت العبادات الخمس'
      en: 'the support a building stands on — thus the five devotions were named'
      ur: 'وہ ستون جس پر عمارت کھڑی ہوتی ہے — پانچ عبادتوں کو اسی لیے کہا گیا'
  - term:
      ar: الاستطاعة
      en: the ability
      ur: استطاعت
    gloss:
      ar: 'القدرة البدنية والمالية التي يشترطها الحج قبل وجوبه'
      en: 'the bodily and financial means required before the Hajj becomes a duty'
      ur: 'جسمانی اور مالی استطاعت جو حج فرض ہونے سے پہلے لازم ہے'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'شهر الصيام التاسع من السنة الهجرية، حين ينقطع المسلمون للعبادة'
      en: 'the ninth Hijri month of fasting when Muslims devote themselves to worship'
      ur: 'ہجری سال کا نواں صیام کا مہینہ جب مسلمان عبادت میں لگتے ہیں'
  - term:
      ar: الأركان الخمسة
      en: the five pillars
      ur: پانچ ارکان
    gloss:
      ar: 'الصورة المختصرة لأساس الإيمان الخماسي الذي تقوم عليه حياة المسلم'
      en: 'the shorthand for the fivefold foundation a Muslim''s whole life stands on'
      ur: 'پانچ جزوی بنیاد کا مختصر نام جس پر مسلمان کی ساری زندگی قائم ہے'
  practice:
  - q:
      ar: كم عدد أركان الإسلام؟
      en: How many pillars of Islam are there?
      ur: اسلام کے ارکان کتنے ہیں؟
    options:
    - text:
        ar: خمسة
        en: five
        ur: پانچ
      correct: true
      why:
        ar: تذكر الكتب الأركان الخمسة نفسها منذ القرون الأولى
        en: books name the same five pillars since the early centuries
        ur: کتابیں ابتدائی صدیوں سے وہی پانچ ارکان لکھتی ہیں
    - text:
        ar: ثلاثة
        en: three
        ur: تین
      correct: false
      why:
        ar: الثلاثة عدد الأيام المشهورة لا الأركان
        en: three is the count of sacred days, not pillars
        ur: تین مقدس دنوں کی گنتی ہے، ارکان کی نہیں
    - text:
        ar: سبعة
        en: seven
        ur: سات
      correct: false
      why:
        ar: السبعة عدد أبواب المدينة أو أشياء أخرى
        en: seven is the count of other things, not pillars
        ur: سات دوسری چیزوں کی گنتی ہے، ارکان کی نہیں
    - text:
        ar: اثنا عشر
        en: twelve
        ur: بارہ
      correct: false
      why:
        ar: الاثنا عشر عدد الأئمة عند الشيعة لا الأركان
        en: twelve is a count from another tradition, not pillars
        ur: بارہ دوسری روایت کی گنتی ہے، ارکان کی نہیں
  - q:
      ar: ما أول ركن؟
      en: What is the first pillar?
      ur: پہلا رکن کون سا ہے؟
    options:
    - text:
        ar: الشهادة
        en: the testimony
        ur: شہادت
      correct: true
      why:
        ar: تأتي الشهادة أولًا لأنها دخول الإيمان
        en: the testimony comes first as the entry into faith
        ur: شہادت پہلے آتی ہے کیونکہ یہ ایمان کا داخلہ ہے
    - text:
        ar: الصلاة
        en: the prayer
        ur: نماز
      correct: false
      why:
        ar: الصلاة الركن الثاني بعد الشهادة
        en: prayer is the second pillar after the testimony
        ur: نماز شہادت کے بعد دوسرا رکن ہے
    - text:
        ar: الحج
        en: the Hajj
        ur: حج
      correct: false
      why:
        ar: الحج الركن الأخير المشروط بالاستطاعة
        en: Hajj is the last pillar, conditioned on ability
        ur: حج آخری رکن ہے، استطاعت کی شرط کے ساتھ
    - text:
        ar: الزكاة
        en: zakat
        ur: زکوٰۃ
      correct: false
      why:
        ar: الزكاة الركن الثالث المالي
        en: zakat is the third pillar, the financial one
        ur: زکوٰۃ تیسرا رکن ہے، مالی رکن
  - q:
      ar: كم مرة يصلي المسلم في اليوم؟
      en: How many times does a Muslim pray daily?
      ur: مسلمان دن میں کتنی بار نماز پڑھتا ہے؟
    options:
    - text:
        ar: خمس مرات
        en: five times
        ur: پانچ بار
      correct: true
      why:
        ar: تذكر الكتب الصلوات الخمس من الفجر إلى العشاء
        en: books name the five prayers from dawn to night
        ur: کتابیں طلوع فجر سے عشاء تک پانچ نمازیں لکھتی ہیں
    - text:
        ar: مرة واحدة
        en: once
        ur: ایک بار
      correct: false
      why:
        ar: مرة واحدة لا تكمل العدد المشهور
        en: once does not match the familiar count
        ur: ایک بار مشہور گنتی پوری نہیں کرتی
    - text:
        ar: ثلاث مرات
        en: three times
        ur: تین بار
      correct: false
      why:
        ar: ثلاثة عدد الصلوات المجمعة أحيانًا لا المفروضة
        en: three is a count in combined prayer, not the required five
        ur: تین مجموعی نمازوں کی گنتی ہے، واجب پانچ کی نہیں
    - text:
        ar: عشر مرات
        en: ten times
        ur: دس بار
      correct: false
      why:
        ar: عشرة عدد النوافل لا الفرائض
        en: ten is the count of extras, not required prayers
        ur: دس نوافل کی گنتی ہے، فرائض کی نہیں
  - q:
      ar: ما الزكاة؟
      en: What is zakat?
      ur: زکوٰۃ کیا ہے؟
    options:
    - text:
        ar: حصة واجبة من المال للفقراء
        en: an obligatory share of wealth for the poor
        ur: مال میں سے غریبوں کا واجب حصہ
      correct: true
      why:
        ar: تفرض الكتب نسبة محددة لأصناف مستحقيها
        en: books set a fixed share for its eligible categories
        ur: کتابیں اس کے مستحقین کے لیے مقررہ حصہ لکھتی ہیں
    - text:
        ar: صدقة اختيارية
        en: voluntary charity
        ur: رضاکارانہ صدقہ
      correct: false
      why:
        ar: الزكاة فرض لا تطوّع، عكس الصدقة الاختيارية
        en: zakat is required, unlike optional charity
        ur: زکوٰۃ فرض ہے، اختیاری صدقے کے برعکس
    - text:
        ar: ضريبة للدولة
        en: a state tax
        ur: ریاستی ٹیکس
      correct: false
      why:
        ar: الزكاة عبادة مالية لا ضريبة مدنية
        en: zakat is a financial act of worship, not a civic tax
        ur: زکوٰۃ مالی عبادت ہے، سول ٹیکس نہیں
    - text:
        ar: هبة للأقارب
        en: a gift for relatives
        ur: رشتہ داروں کے لیے تحفہ
      correct: false
      why:
        ar: الزكاة للفقراء والمستحقين لا للأقارب خاصة
        en: zakat is for the poor and eligible, not family specifically
        ur: زکوٰۃ غریبوں اور مستحقین کے لیے ہے، خاص رشتہ داروں کے لیے نہیں
  - q:
      ar: متى يصوم المسلمون؟
      en: When do Muslims fast?
      ur: مسلمان کب روزہ رکھتے ہیں؟
    options:
    - text:
        ar: في شهر رمضان
        en: during Ramadan
        ur: رمضان کے مہینے میں
      correct: true
      why:
        ar: رمضان الشهر المفروض للصوم في الكتب
        en: Ramadan is the month of the required fast in the books
        ur: رمضان کتابوں میں واجب روزے کا مہینہ ہے
    - text:
        ar: كلّ يوم من السنة
        en: every day of the year
        ur: سال کا ہر دن
      correct: false
      why:
        ar: الصوم المفروض في رمضان لا طوال السنة
        en: the required fast is Ramadan, not all year
        ur: واجب روزہ رمضان کا ہے، پورے سال کا نہیں
    - text:
        ar: في أيام الحج فقط
        en: only during Hajj days
        ur: صرف حج کے دنوں میں
      correct: false
      why:
        ar: أيام الحج لها أعمالها الخاصة لا صومًا عامًّا
        en: Hajj days have their own rites, not a general fast
        ur: حج کے دن اپنے اعمال رکھتے ہیں، عمومی روزہ نہیں
    - text:
        ar: في موسم الشتاء فقط
        en: only in winter
        ur: صرف سردیوں میں
      correct: false
      why:
        ar: يجري رمضان في المواسم كلها عبر السنين
        en: Ramadan runs through all seasons over the years
        ur: رمضان برسوں کے دوران ہر موسم میں آتا ہے
  - q:
      ar: من يجب عليه الحج؟
      en: Who must perform Hajj?
      ur: حج کس پر فرض ہے؟
    options:
    - text:
        ar: من استطاع بدنيًا وماليًا
        en: whoever is physically and financially able
        ur: جو جسمانی اور مالی طور پر مائل ہو
      correct: true
      why:
        ar: تشترط الكتب الاستطاعة شرطًا للحج
        en: the books make ability the Hajj's condition
        ur: کتابیں استطاعت کو حج کی شرط بناتی ہیں
    - text:
        ar: كلّ مسلم دون استثناء
        en: every Muslim without exception
        ur: ہر مسلمان بلا استثنا
      correct: false
      why:
        ar: الاستطاعة شرط، فالعاجز معذور
        en: ability is a condition, so the unable are excused
        ur: استطاعت شرط ہے، لہٰذا عاجز معذور ہے
    - text:
        ar: الرجال فقط
        en: only men
        ur: صرف مرد
      correct: false
      why:
        ar: تحجّ النساء والرجال على السواء
        en: women and men perform Hajj alike
        ur: عورتیں اور مرد یکساں حج کرتے ہیں
    - text:
        ar: سكان مكة فقط
        en: only Mecca's residents
        ur: صرف مکہ کے رہائشی
      correct: false
      why:
        ar: يأتي الحجاج من العالم كله لا من مكة وحدها
        en: pilgrims come from the whole world, not just Mecca
        ur: حجاج پوری دنیا سے آتے ہیں، صرف مکہ سے نہیں
  - q:
      ar: ما الذي تجمعه الأركان الخمسة؟
      en: What do the five pillars bind together?
      ur: پانچ ارکان کیا جوڑتے ہیں؟
    options:
    - text:
        ar: الإيمان والعبادة والتكافل
        en: faith, worship and solidarity
        ur: ایمان، عبادت اور یکجہتی
      correct: true
      why:
        ar: تربط الأركان القلب والبدن والمال بالمجتمع
        en: the pillars tie heart, body and wealth to the community
        ur: ارکان دل، جسم اور مال کو معاشرے سے جوڑتے ہیں
    - text:
        ar: العبادات فقط
        en: worship only
        ur: صرف عبادتیں
      correct: false
      why:
        ar: فيها أيضًا عقد اجتماعي مالي
        en: they include a social-financial contract too
        ur: ان میں سماجی-مالی عہد بھی شامل ہے
    - text:
        ar: العقيدة فقط
        en: belief only
        ur: صرف عقیدہ
      correct: false
      why:
        ar: فيها أعمال بدنية ومالية أيضًا
        en: they include bodily and financial acts too
        ur: ان میں جسمانی اور مالی اعمال بھی ہیں
    - text:
        ar: المال فقط
        en: wealth only
        ur: صرف مال
      correct: false
      why:
        ar: المال جانب منها لا كلّها
        en: wealth is one side, not the whole
        ur: مال ایک پہلو ہے، سب کچھ نہیں
  - q:
      ar: من كتب عن الأركان الخمسة؟
      en: Who wrote about the five pillars?
      ur: پانچ ارکان کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب الفقه والحديث منذ القرون الأولى
        en: books of law and hadith since the early centuries
        ur: ابتدائی صدیوں سے فقہ اور حدیث کی کتابیں
      correct: true
      why:
        ar: تذكرها مصادر مثل البخاري وكتب الفقه منذ القدم
        en: sources like Bukhari and fiqh books list them from early on
        ur: بخاری جیسے ماخذ اور فقہ کی کتابیں انہیں شروع سے لکھتی ہیں
    - text:
        ar: مؤرخو الحروب الصليبية
        en: Crusade historians
        ur: صلیبی جنگوں کے مؤرخین
      correct: false
      why:
        ar: كتب الفقه الإسلامية أولى بالأركان
        en: Islamic fiqh books are the primary place for the pillars
        ur: ارکان کی بنیادی جگہ اسلامی فقہ کی کتابیں ہیں
    - text:
        ar: علماء الأحياء فقط
        en: only biologists
        ur: صرف ماہرینِ حیاتیات
      correct: false
      why:
        ar: الأركان موضوع ديني لا علمي حيوي
        en: the pillars are a religious subject, not biological
        ur: ارکان مذہبی موضوع ہیں، حیاتیاتی نہیں
    - text:
        ar: لا أحد؛ نصّ شفهي فقط
        en: nobody; oral text only
        ur: کوئی نہیں؛ صرف زبانی روایت
      correct: false
      why:
        ar: كُتبت الأركان في الكتب منذ القرون الأولى
        en: the pillars were written down from the early centuries
        ur: ارکان ابتدائی صدیوں سے لکھے جا رہے ہیں
  - q:
      ar: ما التوحيد في الشهادة؟
      en: What is tawhid in the testimony?
      ur: شہادت میں توحید کیا ہے؟
    options:
    - text:
        ar: إفراد الله بالعبادة
        en: singling out God in worship
        ur: اللہ کو یکتا ماننا
      correct: true
      why:
        ar: تُقسم الشهادة بين إثبات الوحدانية ورسالة النبي
        en: the testimony pairs God's oneness with the Prophet's message
        ur: شہادت اللہ کی وحدانیت اور نبی کے رسالت کو جوڑتی ہے
    - text:
        ar: تعدد الآلهة
        en: many gods
        ur: بہت سے معبود
      correct: false
      why:
        ar: التوحيد هو ضدّ الشرك لا تأكيده
        en: tawhid is the opposite of polytheism
        ur: توحید شرک کے برعکس ہے
    - text:
        ar: عبادة الأنبياء
        en: worshipping prophets
        ur: نبیوں کی عبادت
      correct: false
      why:
        ar: النبي رسول لا معبود في الشهادة
        en: the Prophet is a messenger, not worshipped, in the testimony
        ur: نبی شہادت میں رسول ہیں، معبود نہیں
    - text:
        ar: فلسفة يونانية
        en: Greek philosophy
        ur: یونانی فلسفہ
      correct: false
      why:
        ar: التوحيد عقيدة إسلامية لا فلسفة مستوردة
        en: tawhid is Islamic doctrine, not imported philosophy
        ur: توحید اسلامی عقیدہ ہے، درآمدہ فلسفہ نہیں
  - q:
      ar: متى يُعفى المسلم من الحج؟
      en: When is a Muslim excused from Hajj?
      ur: مسلمان کب حج سے معذور ہوتا ہے؟
    options:
    - text:
        ar: عند عدم الاستطاعة
        en: when unable physically or financially
        ur: جب جسمانی یا مالی طور پر عاجز ہو
      correct: true
      why:
        ar: شرط الاستطاعة يعفي من لا يقدر عليها
        en: the ability condition excuses whoever cannot perform it
        ur: استطاعت کی شرط اس شخص کو معذور کرتی ہے جو نہیں کر سکتا
    - text:
        ar: أبدًا؛ فهو واجب دائمًا
        en: never; it is always required
        ur: کبھی نہیں؛ یہ ہمیشہ فرض ہے
      correct: false
      why:
        ar: الاستطاعة شرط، فالعاجز معذور
        en: ability is the condition, so the unable are excused
        ur: استطاعت شرط ہے، لہٰذا عاجز معذور ہے
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: الحج مرتبط بذي الحجة لا برمضان
        en: Hajj is tied to Dhu al-Hijja, not Ramadan
        ur: حج ذوالحجہ سے جڑا ہے، رمضان سے نہیں
    - text:
        ar: بعد الستين فقط
        en: only after sixty
        ur: صرف ساٹھ کے بعد
      correct: false
      why:
        ar: لا يتعلق الإعفاء بالعمر بل بالقدرة
        en: the excuse depends on ability, not age
        ur: معذوریت عمر نہیں بلکہ استطاعت پر منحصر ہے
- id: salah
  anchor: practice/salah
  band: scholars
  title:
    ar: الصلاة
    en: the prayer
    ur: نماز
  sixty:
    ar: 'الصلاة خمس مرات في اليوم توقف نهار المسلم وتصله بربه: الفجر والظهر والعصر والمغرب والعشاء. قبلها الطهارة بالماء ليكون البدن والثوب والمكان نظيفًا، ثم يتّجه المصلّي إلى القبلة أي الكعبة في مكة. تبدأ بالتكبير: يقول «الله أكبر» فينهض راكعًا ساجدًا على مراحل تقام بوحدة اسمها الركعة. وفي جماعة تقف الصفوف كتفًا إلى كتف وراء الإمام، فيتعلم الناس المساواة حتى بين الغني والفقير. وفي الجمعة تجتمع البلدة في مسجد واحد وخطبة تذكّر، وفي رمضان تمتد التراويح في الليل. هكذا صارت الصلاة عادة يومية ورباط جماعة معًا. ولذا كانت أول ما يسأل عنه العبد يوم القيامة في الحديث، فإن صلحت صلح عمله كله؛ هي مقياس اليوم المسلم كله. وهي أيضًا عهد الجماعة: يتساوى فيها الملوك والرعاع، ويلتقي الغريب أهل المسجد في قلب مدينةٍ لا يعرفها، فيجد بيته الثاني. وتختلف الحركات بين مذهب وآخر في التفاصيل، لكن الهيكل واحد في كل أرض: تكبير وقراءة وركوع وسجود وسلام.'
    en: 'Prayer five times a day pauses a Muslim''s daylight and ties it to God: dawn, noon, afternoon, sunset and night. Before it comes purification with water, so body, clothes and ground are clean; then the worshipper turns to the qibla — the Kaaba in Mecca. It opens with the takbir, ''God is greatest'', moving through standings, bowings and prostrations in units called raka''at. In congregation the rows stand shoulder to shoulder behind the imam, and the town learns its equality — rich and poor on one carpet. On Friday the whole quarter gathers in one mosque for a sermon; in Ramadan tarawih stretches the night. Thus prayer became both a daily habit and the community''s bond. Hence the hadith makes it the first thing a servant is asked about on Judgment Day — if it is sound, his whole work is sound; it is the measure of the Muslim day.'
    ur: 'دن میں پانچ بار نماز مسلمان کے دن کو روک کر خدا سے جوڑتی ہے: فجر، ظہر، عصر، مغرب اور عشاء۔ اس سے پہلے پانی سے طہارت تاکہ بدن، کپڑے اور جگہ پاک ہوں، پھر قبلہ — مکہ میں کعبہ — کی طرف رخ کیا جاتا ہے۔ تکبیر سے شروع ہو کر عبادت قیام، رکوع اور سجدوں میں گزرتے ہوئے رکعات کہلائی جانے والی اکائیوں میں چلتی ہے۔ جماعت میں صفیں کندھے سے کندھا ملا کر امام کے پیچھے کھڑی ہوتی ہیں اور امیر و فقیر ایک قالین پر برابر ہو جاتے ہیں۔ جمعے کو محلہ ایک مسجد اور خطبے میں جمع ہوتا ہے؛ رمضان میں تراویح رات کو طول دیتی ہے۔ اس طرح نماز روزانہ عادت اور برادری کا بندھن دونوں بن گئی۔ اسی لیے حدیث میں قیامت کے دن بندے سے پہلی چیز یہی پوچھی جائے گی — اگر یہ درست تو سارا عمل درست؛ یہ مسلمان کے دن کا پیمانہ ہے۔'
  glossary:
  - term:
      ar: الطهارة
      en: the purification
      ur: طہارت
    gloss:
      ar: 'الغسل بالماء — وضوءًا أو اغتسالًا — الذي تحتاجه الصلاة، أو التيمم حين يُفقد الماء'
      en: 'the ritual washing — wudu or the full bath — that a prayer needs, or dry tayammum when water cannot be found'
      ur: 'پانی سے ہونے والی طہارت — وضو یا غسل — جو نماز چاہتی ہے، اور پانی نہ ملے تو خشکی تیمم'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الجهة التي تتوجه إليها الصلاة كلها — الكعبة في مكة أينما كان المصلّي في الدنيا'
      en: 'the direction every prayer turns toward — the Kaaba in Mecca, wherever in the world the worshipper stands'
      ur: 'وہ سمت جس کی طرف ہر نماز مڑتی ہے — مکہ میں کعبہ، نمازی دنیا میں کہیں بھی ہو'
  - term:
      ar: الجماعة
      en: the congregation
      ur: جماعت
    gloss:
      ar: 'الوقوف كتفًا بكتف خلف الإمام في صفّ واحد — وهو درس المساواة الذي تعلّمه الصلاة'
      en: 'standing shoulder to shoulder behind the imam in one row — the lesson in equality the prayer teaches'
      ur: 'امام کے پیچھے ایک صف میں کندھے سے کندھا ملا کر کھڑے ہونا — نماز کی سکھائی ہوئی برابری'
  - term:
      ar: الركوع
      en: the bowing
      ur: رکوع
    gloss:
      ar: 'الانحناء بعد القيام واليدان على الركبتين والظهر مستوٍ خشوعًا'
      en: 'the bow that follows standing, hands resting on the knees, the back level in humility'
      ur: 'قیام کے بعد جھکنا، ہاتھ گھٹنوں پر اور پیٹھ سیدھی، عاجزی کی حالت میں'
  - term:
      ar: السجود
      en: the prostration
      ur: سجدہ
    gloss:
      ar: 'وضع الجبهة على الأرض في أعظم الخضوع لله — مرتين في كل ركعة'
      en: 'placing the forehead on the ground in deepest humility before God — twice inside every unit'
      ur: 'اللہ کے آگے عاجزی کی انتہا میں پیشانی زمین پر رکھنا — ہر رکعت میں دو بار'
  - term:
      ar: الركعة
      en: the unit
      ur: رکعت
    gloss:
      ar: 'الوحدة المعدودة التي تُبنى منها الصلاة: قيام وركوع وسجدتان'
      en: 'the counted building block of prayer — standing, bowing and prostrations — that prayers are made of'
      ur: 'نماز کا گنتی کا حصہ جس سے نماز بنتی ہے: قیام، رکوع اور دو سجدے'
  - term:
      ar: النية
      en: the intention
      ur: نیت
    gloss:
      ar: 'العزم في القلب الذي يعيّن أيّ صلاة تُؤدّى قبل أن تبدأ بأول لفظ'
      en: 'the quiet resolve in the heart that names which prayer is offered before the first word'
      ur: 'دل کا وہ عزم جو پہلے لفظ سے پہلے بتاتا ہے کون سی نماز ادا ہو رہی ہے'
  - term:
      ar: التكبير
      en: the takbir
      ur: تکبیر
    gloss:
      ar: '«الله أكبر» — اللفظ الذي يفتتح الصلاة وينقل المصلي بين أركانها'
      en: '''God is greatest'' — the words that open the prayer and carry the worshipper between its parts'
      ur: '«اللہ اکبر» — وہ کلمات جو نماز کھولتے ہیں اور نمازی کو اس کے حصوں میں لے جاتے ہیں'
  - term:
      ar: الخمسة
      en: the five
      ur: پانچ
    gloss:
      ar: 'الصلوات الخمس التي فرضها الله على المسلمين في أوقات معلومة من الفجر إلى الليل'
      en: 'the five daily devotions God fixed for Muslims at their stated times, from dawn to night'
      ur: 'پانچ روزانہ نمازیں جو اللہ نے مسلمانوں پر مقررہ اوقات میں فرض کیں، فجر سے رات تک'
  - term:
      ar: الجمعة
      en: Friday
      ur: جمعہ
    gloss:
      ar: 'يوم الاجتماع الأسبوعي حين تحلّ الخطبة والصلاة المجتمعة محلّ صلاة الظهر'
      en: 'the week''s gathering day, when a sermon and one shared prayer replace the noon prayer'
      ur: 'ہفتے کا اجتماعی دن جب خطبہ اور مشترکہ نماز ظہر کی جگہ لیتی ہے'
  - term:
      ar: التراويح
      en: the night prayers
      ur: تراویح
    gloss:
      ar: 'قيام رمضان الطويل الذي يُصلّى جماعةً بعد صلاة العشاء'
      en: 'the long night devotions of Ramadan, prayed in congregation after the evening prayer'
      ur: 'رمضان کی رات کی لمبی نماز جو عشاء کے بعد جماعت سے ادا ہوتی ہے'
  - term:
      ar: السنن
      en: the extra prayers
      ur: سنتیں
    gloss:
      ar: 'النوافل المحبوبة التي يضيفها المصلّي حول الفرائض اتباعًا لسنّة النبي'
      en: 'the beloved extra devotions the worshipper adds around the prescribed prayers, following the Prophet''s way'
      ur: 'پسندیدہ نفل نمازیں جو نمازی فرضوں کے ساتھ نبی کے طریقے پر بڑھاتا ہے'
  practice:
  - q:
      ar: كم صلاة في اليوم؟
      en: How many prayers a day?
      ur: دن میں کتنی نمازیں؟
    options:
    - text:
        ar: خمس
        en: five
        ur: پانچ
      correct: true
      why:
        ar: الفجر والظهر والعصر والمغرب والعشاء
        en: dawn, noon, afternoon, sunset and night
        ur: فجر، ظہر، عصر، مغرب اور عشاء
    - text:
        ar: ثلاث
        en: three
        ur: تین
      correct: false
      why:
        ar: ثلاثة عدد الصلوات المجمعة أحيانًا لا المفروضة
        en: three is a count in combined prayer, not the required five
        ur: تین مجموعی نمازوں کی گنتی ہے، واجب پانچ کی نہیں
    - text:
        ar: سبع
        en: seven
        ur: سات
      correct: false
      why:
        ar: سبعة عدد أبواب المدينة لا الصلوات
        en: seven is the count of gates or days, not prayers
        ur: سات دروازوں یا دنوں کی گنتی ہے، نمازوں کی نہیں
    - text:
        ar: عشر
        en: ten
        ur: دس
      correct: false
      why:
        ar: عشرة عدد النوافل لا الفرائض
        en: ten is the count of extras, not required prayers
        ur: دس نوافل کی گنتی ہے، فرائض کی نہیں
  - q:
      ar: إلى أيّ اتجاه تصلى؟
      en: In which direction is salah prayed?
      ur: نماز کس سمت پڑھی جاتی ہے؟
    options:
    - text:
        ar: نحو الكعبة في مكة
        en: toward the Kaaba in Mecca
        ur: مکہ میں کعبہ کی طرف
      correct: true
      why:
        ar: القبلة نحو الكعبة منذ البداية بعد التحويل
        en: the qibla has been toward the Kaaba since the change
        ur: قبلہ تبدیلی کے بعد سے کعبہ کی طرف ہے
    - text:
        ar: نحو القدس دائمًا
        en: always toward Jerusalem
        ur: ہمیشہ بیت المقدس کی طرف
      correct: false
      why:
        ar: كان القدس القبلة الأولى ثم حُوّلت إلى الكعبة
        en: Jerusalem was the first qibla, then it changed to the Kaaba
        ur: بیت المقدس پہلا قبلہ تھا، پھر کعبہ کی طرف بدل گیا
    - text:
        ar: نحو الشرق فقط
        en: only east
        ur: صرف مشرق
      correct: false
      why:
        ar: القبلة تختلف بحسب مكان المصلي
        en: the qibla varies by the pray-er's location
        ur: قبلہ مقام کے حساب سے بدلتا ہے
    - text:
        ar: لا اتجاه معين
        en: no fixed direction
        ur: کوئی مقررہ سمت نہیں
      correct: false
      why:
        ar: القبلة جزء أساسي من الصلاة
        en: the qibla is a basic part of the prayer
        ur: قبلہ نماز کا بنیادی حصہ ہے
  - q:
      ar: ماذا يسبق الصلاة؟
      en: What comes before the prayer?
      ur: نماز سے پہلے کیا ہوتا ہے؟
    options:
    - text:
        ar: الطهارة بالوضوء
        en: purification by washing
        ur: وضو سے طہارت
      correct: true
      why:
        ar: تشترط الكتب الطهارة شرطًا قبل الدخول في الصلاة
        en: the books make purification a condition before the prayer
        ur: کتابیں طہارت کو نماز سے پہلے شرط بناتی ہیں
    - text:
        ar: الأكل مباشرة
        en: eating right away
        ur: فوراً کھانا
      correct: false
      why:
        ar: تُصلى على طهارة لا على معدة ممتلئة
        en: salah is prayed in purity, not on a full stomach
        ur: نماز طہارت میں پڑھی جاتی ہے، بھری معدے پر نہیں
    - text:
        ar: النوم
        en: sleeping
        ur: سونا
      correct: false
      why:
        ar: النوم ناقض للطهارة لا مقدمة لها
        en: sleep breaks purification, it does not prepare it
        ur: نیند طہارت توڑتی ہے، اس کی تیاری نہیں
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: الطهارة شرط ثابت في الكتب
        en: purification is a fixed condition in the books
        ur: طہارت کتابوں میں مقررہ شرط ہے
  - q:
      ar: أين تصلى الجمعة؟
      en: Where is the Friday prayer held?
      ur: جمعے کی نماز کہاں ہوتی ہے؟
    options:
    - text:
        ar: في المسجد جماعةً
        en: in the mosque in congregation
        ur: مسجد میں جماعت کے ساتھ
      correct: true
      why:
        ar: الجمعة صلاة جماعة مع الخطبة في المسجد
        en: Friday is a congregational prayer with a sermon in the mosque
        ur: جمعہ مسجد میں خطبے کے ساتھ جماعت کی نماز ہے
    - text:
        ar: في البيت وحدها
        en: alone at home
        ur: گھر میں تنہا
      correct: false
      why:
        ar: يتطلب الجمعة الجماعة والخطبة في المسجد
        en: Friday requires congregation and sermon in the mosque
        ur: جمعہ مسجد میں جماعت اور خطبہ چاہتا ہے
    - text:
        ar: في المدرسة فقط
        en: only in school
        ur: صرف سکول میں
      correct: false
      why:
        ar: تصلى الجمعة في أيّ مسجد جامع لا في المدرسة خاصة
        en: Friday is prayed in any congregational mosque, not only school
        ur: جمعہ کسی بھی جامع مسجد میں ہوتا ہے، صرف سکول میں نہیں
    - text:
        ar: في السوق
        en: in the market
        ur: بازار میں
      correct: false
      why:
        ar: ليس السوق مكان الجمعة
        en: the market is not the place for Friday
        ur: بازار جمعے کی جگہ نہیں
  - q:
      ar: ما التكبير؟
      en: What is the takbir?
      ur: تکبیر کیا ہے؟
    options:
    - text:
        ar: قول "الله أكبر" لافتتاح الصلاة
        en: saying "God is greatest" to open the prayer
        ur: نماز کھولنے کے لیے "اللہ اکبر" کہنا
      correct: true
      why:
        ar: تُفتح الصلاة بالتكبير ويُكرر في مواضعها
        en: the prayer opens with the takbir and repeats it in its places
        ur: نماز تکبیر سے کھلتی ہے اور اپنے مقامات پر دہراتی ہے
    - text:
        ar: اسم المسجد
        en: the mosque's name
        ur: مسجد کا نام
      correct: false
      why:
        ar: التكبير عبارة لا اسم مكان
        en: takbir is a phrase, not a place name
        ur: تکبیر ایک فقرہ ہے، جگہ کا نام نہیں
    - text:
        ar: نوع من الصدقة
        en: a kind of charity
        ur: ایک قسم کا صدقہ
      correct: false
      why:
        ar: التكبير ذكر لا عمل مالي
        en: takbir is remembrance, not a financial act
        ur: تکبیر ذکر ہے، مالی عمل نہیں
    - text:
        ar: صلاة الليل
        en: the night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: التكبير جزء من كلّ صلاة لا صلاة خاصة
        en: takbir is part of every prayer, not a separate one
        ur: تکبیر ہر نماز کا حصہ ہے، الگ نماز نہیں
  - q:
      ar: متى تصلى الجمعة؟
      en: When is the Friday prayer?
      ur: جمعے کی نماز کب ہوتی ہے؟
    options:
    - text:
        ar: يوم الجمعة وقت الظهر
        en: on Friday at noon
        ur: جمعے کے دن ظہر کے وقت
      correct: true
      why:
        ar: تُعقد الجمعة في موعد الظهر مع الخطبة
        en: Friday prayer is held at noon with the sermon
        ur: جمعہ ظہر کے وقت خطبے کے ساتھ ہوتا ہے
    - text:
        ar: كلّ يوم عند الغروب
        en: every day at sunset
        ur: ہر دن غروب پر
      correct: false
      why:
        ar: يوم الجمعة خاص لا يومي
        en: Friday is a special day, not daily
        ur: جمعہ ایک خاص دن ہے، روزانہ نہیں
    - text:
        ar: مرة في الشهر
        en: once a month
        ur: مہینے میں ایک بار
      correct: false
      why:
        ar: الجمعة أسبوعية لا شهرية
        en: Friday is weekly, not monthly
        ur: جمعہ ہفتہ وار ہے، ماہانہ نہیں
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: تصلى الجمعة طوال السنة لا في رمضان وحده
        en: Friday is prayed all year, not only in Ramadan
        ur: جمعہ پورے سال ہوتا ہے، صرف رمضان میں نہیں
  - q:
      ar: ما الركعة؟
      en: What is a rak'ah?
      ur: رکعت کیا ہے؟
    options:
    - text:
        ar: دورة من الوقوف والركوع والسجود
        en: a cycle of standing, bowing and prostration
        ur: کھڑے ہونے، رکوع اور سجدے کا ایک دور
      correct: true
      why:
        ar: تُقسّم كلّ صلاة إلى ركعات ثابتة العدد
        en: each prayer is divided into a fixed number of units
        ur: ہر نماز مقررہ رکعتوں میں بٹی ہوتی ہے
    - text:
        ar: نوع من الصدقة
        en: a kind of charity
        ur: ایک قسم کا صدقہ
      correct: false
      why:
        ar: الركعة جزء حركي من الصلاة لا صدقة
        en: a rak'ah is a prayer movement, not charity
        ur: رکعت نماز کی حرکت ہے، صدقہ نہیں
    - text:
        ar: خطبة الجمعة
        en: the Friday sermon
        ur: جمعے کا خطبہ
      correct: false
      why:
        ar: الخطبة منفصلة عن الركعات
        en: the sermon is separate from the units
        ur: خطبہ رکعتوں سے الگ ہے
    - text:
        ar: اسم المسجد
        en: the mosque's name
        ur: مسجد کا نام
      correct: false
      why:
        ar: الركعة وحدة عبادة لا مكان
        en: a rak'ah is a worship unit, not a place
        ur: رکعت عبادت کی اکائی ہے، جگہ نہیں
  - q:
      ar: لماذا تُقسّم الصلاة إلى خمس؟
      en: Why is the prayer divided into five?
      ur: نماز پانچ میں کیوں بٹی ہے؟
    options:
    - text:
        ar: لتوقف الحياة خمس مرات يوميًّا نحو الله
        en: to pause life toward God five times a day
        ur: دن میں پانچ بار اللہ کی طرف وقفہ کے لیے
      correct: true
      why:
        ar: تذكر الكتب الصلوات الخمس كمواقيت ثابتة للذكر
        en: the books describe the five as fixed times for remembrance
        ur: کتابیں پانچ کو ذکر کے مقررہ اوقات کے طور پر لکھتی ہیں
    - text:
        ar: لأنّ الأيام خمسة في الأسبوع
        en: because there are five days in a week
        ur: کیونکہ ہفتے میں پانچ دن ہیں
      correct: false
      why:
        ar: الأسبوع سبعة أيام لا خمسة
        en: a week has seven days, not five
        ur: ہفتے میں سات دن ہیں، پانچ نہیں
    - text:
        ar: لأنّ الأركان خمسة أيضًا
        en: because the pillars are also five
        ur: کیونکہ ارکان بھی پانچ ہیں
      correct: false
      why:
        ar: الصدفة رقمية لا علّة
        en: the match in number is coincidence, not the reason
        ur: تعداد میں مماثلت اتفاق ہے، وجہ نہیں
    - text:
        ar: لأنّها سهلة
        en: because it is easy
        ur: کیونکہ یہ آسان ہے
      correct: false
      why:
        ar: العدد ثابت في النصوص لا للسهولة
        en: the count is fixed in the texts, not for ease
        ur: تعداد نصوص میں مقررہ ہے، آسانی کے لیے نہیں
  - q:
      ar: من يصلي؟
      en: Who prays?
      ur: نماز کون پڑھتا ہے؟
    options:
    - text:
        ar: كلّ مسلم بالغ عاقل قادر
        en: every adult, sane, able Muslim
        ur: ہر بالغ، عاقل، قادر مسلمان
      correct: true
      why:
        ar: تشترط الكتب البلوغ والعقل والقدرة للصلاة
        en: the books condition prayer on maturity, sanity and ability
        ur: کتابیں نماز پر بلوغت، عقل اور استطاعت کی شرط لگاتی ہیں
    - text:
        ar: الرجال فقط
        en: only men
        ur: صرف مرد
      correct: false
      why:
        ar: تُصلي النساء والرجال على السواء
        en: women and men pray alike
        ur: عورتیں اور مرد یکساں نماز پڑھتے ہیں
    - text:
        ar: في المسجد فقط
        en: only in the mosque
        ur: صرف مسجد میں
      correct: false
      why:
        ar: تصلى في أيّ مكان طاهر لا في المسجد وحده
        en: salah is prayed anywhere pure, not only the mosque
        ur: نماز کسی پاک جگہ میں ہوتی ہے، صرف مسجد میں نہیں
    - text:
        ar: في رمضان فقط
        en: only in Ramadan
        ur: صرف رمضان میں
      correct: false
      why:
        ar: الصلاة يومية طوال السنة
        en: the prayer is daily all year
        ur: نماز پورے سال روزانہ ہے
  - q:
      ar: ما الجماعة؟
      en: What is the congregation?
      ur: جماعت کیا ہے؟
    options:
    - text:
        ar: الصلاة مع الناس في المسجد أو أيّ مكان
        en: praying with others in a mosque or anywhere
        ur: مسجد میں یا کہیں بھی لوگوں کے ساتھ نماز
      correct: true
      why:
        ar: تُثيب الكتب الجماعة أكثر من الفرادى
        en: the books reward congregational prayer over individual
        ur: کتابیں جماعت کو انفرادی پر فضیلت دیتی ہیں
    - text:
        ar: صلاة الجمعة وحدها
        en: only the Friday prayer
        ur: صرف جمعے کی نماز
      correct: false
      why:
        ar: الجماعة تصلى في أيّ وقت لا الجمعة وحدها
        en: congregation is prayed at any time, not only Friday
        ur: جماعت کسی بھی وقت ہوتی ہے، صرف جمعہ نہیں
    - text:
        ar: صلاة العيدين فقط
        en: only the two Eid prayers
        ur: صرف دونوں عیدوں کی نماز
      correct: false
      why:
        ar: العيدان جماعة خاصة لا معنى الجماعة العام
        en: the Eids are special congregations, not the general meaning
        ur: عیدیں خاص جماعتیں ہیں، عمومی معنی نہیں
    - text:
        ar: لا صلاة مشتركة في الإسلام
        en: there is no shared prayer in Islam
        ur: اسلام میں مشترک نماز نہیں
      correct: false
      why:
        ar: الجماعة جزء أساسي من التدين
        en: congregation is a basic part of devotion
        ur: جماعت عبادت کا بنیادی حصہ ہے
- id: badr
  anchor: event/battle-of-badr
  band: scholars
  title:
    ar: غزوة بدر
    en: the battle of Badr
    ur: غزوۂ بدر
  sixty:
    ar: 'في رمضان من السنة الثانية للهجرة (٦٢٤م) التقى جيشان صغيران عند بدر: ثلاثمائة ونحو ثلاثة عشر من المسلمين ضد نحو ألف من قريش وقّفوا مع قافلتها العائدة من الشام. كان النصر للمسلمين، فقتلت قريش صناديدها وأسر نحو سبعين منها. في القرآن يوم الفرقان: يوم تميّز الحق وتمكّنت الدعوة الجديدة، وذُكرت ملائكة تؤيد المؤمنين. بعد النصر عاد أسرى كثيرون بالفدية أو بتعليم أبناء المسلمين القراءة والكتابة. فصار بدر اسمًا للتدخل الإلهي وبداية فترة غيّرت ميزان القوى في الجزيرة، حتى ما كان من الممكن أن تبقى المدينة صامدة بدونه. وحفظ المسلمون ذكراه كل رمضان، وتليت آياته في كل جيل، حتى صار ميزانًا يقاس عليه نصر العقيدة بالقلة. ولهذا لا يقرأ المسلم بدر حربًا صغيرة، بل يومًا قرّر مصير دعوة كاملة: إن تسقط تسقط المدينة، وإن تنتصر فعالمٌ يتغيّر. ونزلت في يومه سورة الأنفال تدبّر دروسه: الإعداد ثم التوكل، والصبر ثم النصر، والنظام قبل العدد.'
    en: 'In Ramadan of the second Hijri year (624 CE), two small armies met at Badr: about 313 Muslims against nearly a thousand Quraysh guarding their caravan home from Syria. Victory went to the Muslims; the Quraysh lost their champions and about seventy were captured. The Qur''an calls it the Day of the Criterion — the day truth was marked out and the new call stood firm — and remembers angels strengthening the believers. Many captives returned home by ransom or by teaching Muslim children to read and write. So Badr became a name for divine aid and the start of a period that tilted the peninsula''s balance of power; without it Medina might not have survived at all. Muslims keep its memory every Ramadan and recite its verses in every generation, until it became the measure by which faith''s victory with few numbers is judged.'
    ur: 'ہجرت کے دوسرے سال رمضان میں (624ء) بدر کے مقام پر دو چھوٹی فوجیں ملی: تقریباً 313 مسلمان، اور قریب ہزار قریشی جو شام سے لوٹتی قافلے کی حفاظت پر تھے۔ فتح مسلمانوں کو ملی؛ قریش کے سردار مارے گئے اور تقریباً ستر قید ہوئے۔ قرآن اسے یومِ فرقان کہتا ہے — وہ دن جب حق اور باطل الگ ہوئے اور نئی دعوت قائم ہوئی — اور فرشتوں کی مدد یاد کرتا ہے۔ بہت سے قیدی فدیے سے یا مسلم بچوں کو پڑھنا لکھنا سکھا کر لوٹے۔ بدر اس طرح الہی مدد کا نام بنا اور جزیرے میں طاقت کا توازن بدلنے والے دور کا آغاز؛ اس کے بغیر مدینہ شاید قائم نہ رہتا۔ مسلمان ہر رمضان اس کی یاد رکھتے ہیں اور ہر نسل اس کی آیات تلاوت کرتی ہے، یہاں تک کہ وہ قلیل تعداد سے عقیدے کی فتح کا پیمانہ بنا۔'
  glossary:
  - term:
      ar: بدر
      en: Badr
      ur: بدر
    gloss:
      ar: 'الموضع بين مكة والمدينة حيث وقعت الموقعة الكبرى سنة ٦٢٤م'
      en: 'the spot between Mecca and Medina where the great clash happened in 624 CE'
      ur: 'مکہ اور مدینہ کے درمیان مقام جہاں 624ء میں بڑی جنگ ہوئی'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'قبيلة مكة الحاكمة التي قادت المعارضة للدعوة الجديدة سنوات'
      en: 'Mecca''s ruling tribe that led the opposition to the new call for years'
      ur: 'مکہ کا حکمران قبیلہ جس نے برسوں نئی دعوت کی مخالفت کی'
  - term:
      ar: يوم الفرقان
      en: the Day of the Criterion
      ur: یومِ فرقان
    gloss:
      ar: 'الاسم القرآني ليوم بدر حيث تميّز الحق من الباطل'
      en: 'the Qur''an''s name for Badr''s day when truth was marked from falsehood'
      ur: 'بدر کے دن کا قرآنی نام جب حق اور باطل الگ ہوئے'
  - term:
      ar: القافلة
      en: the caravan
      ur: قافلہ
    gloss:
      ar: 'قافلة قريش التجارية العائدة من الشام التي خرج لحمايتها جيشهم'
      en: 'the Quraysh trade caravan returning from Syria their army marched to protect'
      ur: 'قریش کا تجارتی قافلہ شام سے لوٹتا جس کی حفاظت پر ان کی فوج نکلی'
  - term:
      ar: الأسرى
      en: the captives
      ur: اسیر
    gloss:
      ar: 'المأسورون في الموقعة الذين عاد بعضهم بفدية أو بتعليم المسلمين'
      en: 'the captives of the battle, some freed for ransom or for teaching Muslims'
      ur: 'جنگ کے قیدی جن میں بعض فدیے یا مسلمانوں کو سکھانے پر چھوٹے'
  - term:
      ar: المدينة
      en: Medina
      ur: مدینہ
    gloss:
      ar: 'المدينة التي صارت مركز الدعوة بعد الهجرة ومنها انطلقت الموقعة'
      en: 'the city that became the call''s center after the Hijra and from which the battle set out'
      ur: 'وہ شہر جو ہجرت کے بعد دعوت کا مرکز بنا اور جہاں سے جنگ نکلی'
  - term:
      ar: أحد
      en: Uhud
      ur: احد
    gloss:
      ar: 'الجبل قرب المدينة حيث وقعت معركة ثانية بعد سنة من بدر'
      en: 'the hill near Medina where a second battle came a year after Badr'
      ur: 'مدینہ کے قریب پہاڑ جہاں بدر کے ایک سال بعد دوسری جنگ ہوئی'
  - term:
      ar: خيبر
      en: Khaybar
      ur: خیبر
    gloss:
      ar: 'واحة شمال المدينة سقطت في يد المسلمين بعد سنين من بدر'
      en: 'the oasis north of Medina that fell to Muslims years after Badr'
      ur: 'مدینہ کے شمال کا وہ نخلستان جو بدر کے برسوں بعد مسلمانوں کے ہاتھ آیا'
  - term:
      ar: فتح مكة
      en: the conquest of Mecca
      ur: فتح مکہ
    gloss:
      ar: 'دخول النبي مكة منتصرًا سنة ٦٣٠ خاتمة الصراع الذي بدأ من بدر'
      en: 'the Prophet''s victorious entry into Mecca in 630, the end of the struggle begun at Badr'
      ur: '630 میں نبی کا مکہ میں فاتحانہ داخلہ — بدر سے شروع کشمکش کا خاتمہ'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'الشهر الذي وقعت فيه الوقعة، وكان المسلمون صائمين في قتالهم'
      en: 'the month the battle fell in — the Muslims were fasting as they fought'
      ur: 'وہ مہینہ جس میں جنگ ہوئی — مسلمان لڑتے ہوئے روزے سے تھے'
  - term:
      ar: الثلاثمائة
      en: the three hundred
      ur: تین سو
    gloss:
      ar: 'عدد المسلمين المقاتلين في بدر تقريبًا، قلة أمام ألف'
      en: 'the rough count of Muslim fighters at Badr, a few facing a thousand'
      ur: 'بدر میں لڑنے والے مسلمانوں کی تقریبی گنتی — ہزار کے سامنے قلیل'
  - term:
      ar: السنة الثانية
      en: the second year
      ur: دوسرا سال
    gloss:
      ar: 'سنة الهجرة الثانية التي شهدت الوقعة وفيها تغيّرت الأحوال'
      en: 'the second Hijri year that held the battle and in which fortunes changed'
      ur: 'ہجرت کا دوسرا سال جس میں جنگ ہوئی اور بخت بدلے'
  practice:
  - q:
      ar: متى كانت غزوة بدر؟
      en: When was the battle of Badr?
      ur: غزوۂ بدر کب ہوا؟
    options:
    - text:
        ar: في رمضان السنة الثانية للهجرة
        en: in Ramadan of the second Hijri year
        ur: ہجرت کے دوسرے سال رمضان میں
      correct: true
      why:
        ar: تذكر المصادر رمضان ٢هـ ٦٢٤م
        en: the sources date Ramadan 2 AH / 624 CE
        ur: ماخذ رمضان 2 ہجری / 624ء لکھتے ہیں
    - text:
        ar: في السنة الأولى للهجرة
        en: in the first Hijri year
        ur: ہجرت کے پہلے سال میں
      correct: false
      why:
        ar: كانت السنة الأولى سنة التأسيس في المدينة
        en: the first year was the founding year in Medina
        ur: پہلا سال مدینہ میں قیام کا سال تھا
    - text:
        ar: بعد فتح مكة
        en: after the conquest of Mecca
        ur: فتح مکہ کے بعد
      correct: false
      why:
        ar: كان بدر قبل الفتح بست سنوات
        en: Badr was six years before the conquest
        ur: بدر فتح سے چھ سال پہلے تھا
    - text:
        ar: في القرن السابع عشر
        en: in the seventeenth century
        ur: سترہویں صدی میں
      correct: false
      why:
        ar: بدر في القرن السابع الميلادي
        en: Badr is seventh-century, not seventeenth
        ur: بدر ساتویں صدی میں ہے، سترہویں نہیں
  - q:
      ar: أين وقعت معركة بدر؟
      en: Where did Badr happen?
      ur: بدر کہاں ہوا؟
    options:
    - text:
        ar: عند آبار بدر بين مكة والمدينة
        en: at the wells of Badr between Mecca and Medina
        ur: مکہ اور مدینہ کے درمیان بدر کے کنوئوں پر
      correct: true
      why:
        ar: سجلت المصادر موقع الآبار على طريق القوافل
        en: sources name the wells on the caravan road
        ur: ماخذ قافلہ راہ پر کنوئوں کا ذکر کرتے ہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم تصل الأحداث إلى الشام في ذلك الزمن
        en: the events had not reached Syria then
        ur: واقعات اس زمانے میں شام تک نہیں پہنچے تھے
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: بقيت مصر خارج الصراع الأول
        en: Egypt was outside this first conflict
        ur: مصر اس ابتدائی تنازعے سے باہر تھا
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: لم تكن بغداد قائمة بعد
        en: Baghdad did not yet exist
        ur: اس وقت بغداد موجود ہی نہیں تھا
  - q:
      ar: كم كان عدد المسلمين تقريبًا؟
      en: About how many Muslims fought?
      ur: مسلمانوں کی تعداد تقریباً کتنی تھی؟
    options:
    - text:
        ar: نحو ثلاثمائة
        en: about three hundred
        ur: تقریباً تین سو
      correct: true
      why:
        ar: تعطي المصادر عددًا قريبًا من ٣١٣
        en: the sources give a number near 313
        ur: ماخذ 313 کے قریب تعداد دیتے ہیں
    - text:
        ar: عشرة آلاف
        en: ten thousand
        ur: دس ہزار
      correct: false
      why:
        ar: هذا عدد جيش الفتح بعد ست سنوات
        en: that is nearer the conquest army six years later
        ur: یہ چھ سال بعد فتح کے لشکر کے قریب ہے
    - text:
        ar: خمسون
        en: fifty
        ur: پچاس
      correct: false
      why:
        ar: خمسون أقلّ مما سجلته المصادر
        en: fifty is far below the recorded count
        ur: پچاس درج تعداد سے کہیں کم ہے
    - text:
        ar: مليون
        en: a million
        ur: دس لاکھ
      correct: false
      why:
        ar: لا تصل الأعداد إلى هذا في كتب السيرة
        en: the sira books give nothing near this
        ur: سیرت کی کتابیں اس کے قریب کچھ نہیں لکھتیں
  - q:
      ar: لماذا خرج المسلمون إلى بدر؟
      en: Why did the Muslims go out to Badr?
      ur: مسلمان بدر کی طرف کیوں نکلے؟
    options:
    - text:
        ar: لاعتراض قافلة تجارة قريش
        en: to intercept the Quraysh trade caravan
        ur: قریش کے تجارتی قافلے کو روکنے کے لیے
      correct: true
      why:
        ar: كانت القافلة هدف الخروج الأول ثم جاء الجيش
        en: the caravan was the first target, then the army came
        ur: قافلہ پہلا ہدف تھا، پھر لشکر آیا
    - text:
        ar: لغزو روما
        en: to invade Rome
        ur: روم پر حملے کے لیے
      correct: false
      why:
        ar: لم يكن هدف المسلمين روما
        en: Rome was not their aim
        ur: ان کا مقصد روم نہیں تھا
    - text:
        ar: لحجّ إلى مكة
        en: to pilgrimage to Mecca
        ur: مکہ کی حج کے لیے
      correct: false
      why:
        ar: كان الخروج عسكريًا لا حجًّا
        en: the march was military, not a pilgrimage
        ur: یہ عسکری نکلنا تھا، حج نہیں
    - text:
        ar: لزيارة القبور
        en: to visit graves
        ur: قبروں کی زیارت کے لیے
      correct: false
      why:
        ar: لم تكن الزيارة سبب الخروج
        en: a visit was not the reason
        ur: زیارت وجہ نہیں تھی
  - q:
      ar: ماذا نتج عن بدر؟
      en: What came of Badr?
      ur: بدر کا کیا نتیجہ نکلا؟
    options:
    - text:
        ar: انتصار المسلمين وأسر سبعين من قريش
        en: Muslim victory and seventy Quraysh captured
        ur: مسلمانوں کی فتح اور قریش کے ستر افراد کا اسر ہونا
      correct: true
      why:
        ar: تسجل المصادر النتيجة وأسماء القتلى والأسرى
        en: sources record the result and the names of dead and captives
        ur: ماخذ نتیجہ اور مرنے والوں و اسیروں کے نام لکھتے ہیں
    - text:
        ar: هزيمة المسلمين الكاملة
        en: a complete Muslim defeat
        ur: مسلمانوں کی مکمل شکست
      correct: false
      why:
        ar: الهزيمة في الكتب تخصّ أُحد لا بدر
        en: the defeat in the books belongs to Uhud, not Badr
        ur: کتابوں میں شکست احد سے متعلق ہے، بدر سے نہیں
    - text:
        ar: نهاية الدولة الإسلامية
        en: the end of the Islamic state
        ur: اسلامی ریاست کا خاتمہ
      correct: false
      why:
        ar: بدأت الدولة أقوى بعد بدر لا انتهت
        en: the state began stronger after Badr, not ended
        ur: بدر کے بعد ریاست مضبوط ہوئی، ختم نہیں ہوئی
    - text:
        ar: اتفاق سلام دائم
        en: a lasting peace
        ur: مستقل صلح
      correct: false
      why:
        ar: استمر الصراع إلى فتح مكة
        en: the struggle ran on to the conquest of Mecca
        ur: جنگ فتح مکہ تک جاری رہی
  - q:
      ar: لماذا سمّيت بدر يوم الفرقان؟
      en: Why is Badr called the Day of the Criterion?
      ur: بدر کو یومِ فرقان کیوں کہا گیا؟
    options:
    - text:
        ar: لأنه فصل بين دولة المدينة وعدوّها
        en: because it decided between Medina''s state and its foe
        ur: کیونکہ اس نے مدینہ کی ریاست اور اس کے حریف کے درمیان فیصلہ کیا
      correct: true
      why:
        ar: اعتبرته الذاكرة يوم تمايزت فيه الدولة الجديدة
        en: memory treated it as the day the new state proved itself
        ur: یادداشت نے اسے وہ دن سمجھا جس میں نئی ریاست ثابت ہوئی
    - text:
        ar: لأنه كان أطول يوم في السنة
        en: because it was the longest day of the year
        ur: کیونکہ یہ سال کا سب سے طویل دن تھا
      correct: false
      why:
        ar: التسمية للمعنى لا للفلك
        en: the name is for meaning, not astronomy
        ur: نام معنی کے لیے ہے، فلکیات کے لیے نہیں
    - text:
        ar: لأنه كان في رمضان
        en: because it fell in Ramadan
        ur: کیونکہ یہ رمضان میں ہوا
      correct: false
      why:
        ar: رمضان وصف الوقت لا سبب الاسم
        en: Ramadan describes the timing, not the name''s reason
        ur: رمضان وقت کی صفت ہے، نام کی وجہ نہیں
    - text:
        ar: لأنه كان أول نزول القرآن
        en: because it was the first Quranic descent
        ur: کیونکہ یہ قرآن کی پہلی نزول تھی
      correct: false
      why:
        ar: بدأ الوحي قبل بدر بأكثر من عقد
        en: revelation began over a decade before Badr
        ur: وحی بدر سے دہائیوں پہلے شروع ہوئی
  - q:
      ar: من كتب عن بدر؟
      en: Who wrote about Badr?
      ur: بدر کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب السيرة والتواريخ المبكرة
        en: the sira and early history books
        ur: سیرت اور ابتدائی تواریخ کی کتابیں
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والطبري وغيرهما
        en: accounts reach us from Ibn Ishaq, al-Tabari and others
        ur: ابن اسحاق، طبری اور دیگر کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: مؤرخون أوروبيون فقط
        en: only European historians
        ur: صرف یورپی مؤرخین
      correct: false
      why:
        ar: كتب المسلمون عن بدر قبل قرون
        en: Muslims wrote about Badr centuries earlier
        ur: مسلمانوں نے بدر کے بارے میں صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: بدر من أكثر الأيام تدوينًا في السيرة
        en: Badr is among the most documented days in the sira
        ur: بدر سیرت کے سب سے مکتوب ایام میں سے ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: جاءت الحروب الصليبية بعد خمسة قرون
        en: the Crusades came five centuries later
        ur: صلیبی جنگیں پانچ صدیوں بعد آئیں
  - q:
      ar: ماذا سمّى المسلمون يوم بدر؟
      en: What did Muslims call the day of Badr?
      ur: مسلمانوں نے بدر کے دن کو کیا نام دیا؟
    options:
    - text:
        ar: يوم الفرقان
        en: the Day of the Criterion
        ur: یومِ فرقان
      correct: true
      why:
        ar: هذا الاسم في النصوص والذاكرة
        en: this is the name in the texts and memory
        ur: یہ نام نصوص اور یادداشت میں ہے
    - text:
        ar: يوم الأحد
        en: Sunday
        ur: اتوار کا دن
      correct: false
      why:
        ar: الاسم للمعركة لا لليوم الأسبوعي
        en: the name is for the battle, not the weekday
        ur: نام جنگ کے لیے ہے، ہفتے کے دن کے لیے نہیں
    - text:
        ar: عيد النصر
        en: Victory Feast
        ur: فتح کی عید
      correct: false
      why:
        ar: لم يكن بدر عيدًا موسميًّا
        en: Badr was not a seasonal feast
        ur: بدر کوئی موسمی عید نہیں تھی
    - text:
        ar: يوم الحساب
        en: the Day of Reckoning
        ur: حساب کا دن
      correct: false
      why:
        ar: يوم الحساب في النصوص ليوم آخر
        en: the Day of Reckoning names a different day in the texts
        ur: حساب کا دن نصوص میں دوسرے دن کا نام ہے
  - q:
      ar: من انتصر في بدر؟
      en: Who won at Badr?
      ur: بدر میں کون جیتا؟
    options:
    - text:
        ar: المسلمون
        en: the Muslims
        ur: مسلمان
      correct: true
      why:
        ar: انتهى اليوم بانتصار المدنيين وأسر قريش
        en: the day ended in Medina''s victory and Quraysh captives
        ur: دن مدینہ والوں کی فتح اور قریش کے اسیروں پر ختم ہوا
    - text:
        ar: قريش
        en: the Quraysh
        ur: قریش
      correct: false
      why:
        ar: خسرت قريش القتال وكبار رجالها
        en: the Quraysh lost the fight and their leading men
        ur: قریش جنگ اور اپنے بڑے آدمی ہارے
    - text:
        ar: تعادل الفريقان
        en: it was a draw
        ur: برابر رہی
      correct: false
      why:
        ar: فُضّ النزاع في المصادر بانتصار صريح
        en: the sources decide it a clear victory
        ur: ماخذ اسے واضح فتح لکھتے ہیں
    - text:
        ar: لم يقع قتال
        en: no battle happened
        ur: کوئی جنگ نہیں ہوئی
      correct: false
      why:
        ar: وثّقت الكتب القتال وأسماء من مات
        en: the books document the fighting and the dead
        ur: کتابیں لڑائی اور مرنے والوں کو ثبت کرتی ہیں
  - q:
      ar: ماذا جاء بعد بدر في الأحداث؟
      en: What followed Badr in the events?
      ur: واقعات میں بدر کے بعد کیا آیا؟
    options:
    - text:
        ar: أُحد ثم خيبر ثم فتح مكة
        en: Uhud, then Khaybar, then the conquest of Mecca
        ur: احد، پھر خیبر، پھر فتح مکہ
      correct: true
      why:
        ar: السلسلة في المصادر تجري بهذا الترتيب
        en: the sources run the chain in this order
        ur: ماخذ سلسلہ اسی ترتیب میں لکھتے ہیں
    - text:
        ar: الحروب الصليبية مباشرة
        en: the Crusades right away
        ur: فوراً صلیبی جنگیں
      correct: false
      why:
        ar: جاءت الحروب الصليبية في ١٠٩٥ بعد قرون
        en: the Crusades came in 1095, centuries later
        ur: صلیبی جنگیں 1095 میں آئیں، صدیوں بعد
    - text:
        ar: سقوط بغداد
        en: the fall of Baghdad
        ur: بغداد کا سقوط
      correct: false
      why:
        ar: سقطت بغداد في ١٢٥٨ بعد قرون
        en: Baghdad fell in 1258, centuries later
        ur: بغداد 1258 میں گرا، صدیوں بعد
    - text:
        ar: بناء المسجد الأقصى
        en: the building of al-Aqsa
        ur: مسجدِ اقصیٰ کی تعمیر
      correct: false
      why:
        ar: بُني الأقصى قبل بدر بزمن
        en: al-Aqsa was built before Badr
        ur: اقصیٰ بدر سے پہلے تعمیر ہوئی
- id: first-revelation
  anchor: event/first-revelation
  band: scholars
  title:
    ar: أول الوحي
    en: the first revelation
    ur: پہلی وحی
  sixty:
    ar: 'في نحو سنة ٦١٠م كان محمد يتعبّد في غار حراء فوق مكة، حين نزل عليه الوحي بكلمة «اقرأ». بدأت الدعوة سرًّا بين أهل البيت وبعض الصدقاء، ثم علت بعد سنوات إلى إعلان. استمر الوحي يتنزّل على النبي ثلاثًا وعشرين سنة في مكة والمدينة، يحفظه الناس ويكتبونه، حتى اكتمل القرآن. كان جبل النور يُسمى قبل ذلك مكانًا للتأمل، وصار بعده عنوان البداية الكبرى. من تلك الليلة خرجت أمّة: دعوة خفية سنواتها الأولى، ثم جماعة تتسع في مكة، فمدينة تبنى، فعالم يتغيّر. ويظل «اقرأ» أول كلمة للأمة تحمل القراءة والعلم دينًا. وهكذا بدأ كل شيء: غار صغير فوق الجبل، وكلمة واحدة، فحملتها أمّة في صدورها وكتبها ألفًا وأربعمائة عام. ولم تكن تلك الليلة نهاية الطريق بل فاتحته، فكل ما جاء بعد — الهجرة والفتح والدولة والحضارة — امتداد لتلك الكلمة الواحدة. فمن «اقرأ» تعلّمت الأجيال أن دينها دين قراءة وعلم، وأن أول خطوة في الطريق سماعٌ وقلبٌ حاضر.'
    en: 'Around 610 CE Muhammad was worshipping in the cave of Hira above Mecca when revelation came down with the word ''Read''. The call began secretly among his household and a few close friends, rising after years into open declaration. Revelation kept descending on the Prophet for twenty-three years, in Mecca and in Medina, memorized and written down, until the Qur''an was complete. The Mount of Light had been a place of retreat before that; afterwards it became the name of the greatest beginning. From that night came an ummah: a hidden call for its first years, then a widening community in Mecca, then a city built, then a world changed. ''Read'' remains the ummah''s first word, making reading and knowledge a religion. So everything began: a small cave on the mountain, a single word — and an ummah carried it in its chest and books for fourteen hundred years.'
    ur: 'تقریباً 610ء میں محمد مکہ کے اوپر غارِ حرا میں عبادت میں تھے جب وحی «پڑھو» کے لفظ سے نازل ہوئی۔ دعوت پہلے خفیہ رہی — گھر والوں اور چند قریبی ساتھیوں میں — پھر برسوں بعد کھلم کھلا ہوئی۔ وحی تئیس برس نبی پر مکہ اور مدینہ میں نازل ہوتی رہی، لوگ حفظ اور لکھتے رہے یہاں تک کہ قرآن مکمل ہوا۔ کوہِ نور پہلے خلوت کی جگہ تھا؛ بعد میں وہ عظیم آغاز کا نام بنا۔ اسی رات سے امت نکلی: ابتدائی برسوں کی پوشیدہ دعوت، پھر مکہ میں پھیلتی برادری، پھر بسایا گیا شہر، پھر بدلی ہوئی دنیا۔ «پڑھو» امت کا پہلا لفظ رہا جس نے پڑھنا اور علم دین بنا دیا۔ اسی طرح سب کچھ شروع ہوا: پہاڑ پر ایک چھوٹی سی غار، ایک ہی لفظ — اور امت نے اسے چودہ سو برس سینوں اور کتابوں میں اٹھایا۔'
  glossary:
  - term:
      ar: حراء
      en: Hira
      ur: حرا
    gloss:
      ar: 'الغار الصغير في جبل النور فوق مكة حيث كان النبي يعتزل ويتعبّد'
      en: 'the small cave on the Mount of Light above Mecca where the Prophet used to withdraw and worship'
      ur: 'مکہ کے اوپر کوہِ نور کی چھوٹی غار جہاں نبی اعتکاف اور عبادت کرتے تھے'
  - term:
      ar: الوحي
      en: the revelation
      ur: وحی
    gloss:
      ar: 'كلام الله المنزَّل على النبي بواسطة الملك — الليلة التي بدأ فيها القرآن'
      en: 'God''s speech sent down to the Prophet through the angel — the night the Qur''an began'
      ur: 'اللہ کا کلام جو فرشتے کے ذریعے نبی پر نازل ہوا — وہ رات جب قرآن کا آغاز ہوا'
  - term:
      ar: اقرأ
      en: Read
      ur: پڑھو
    gloss:
      ar: 'أول كلمة نزلت من القرآن، وصارت راية العلم القائمة في أمة الإسلام'
      en: 'the first revealed word of the Qur''an, which became the ummah''s standing banner of knowledge'
      ur: 'قرآن کا پہلا نازل شدہ لفظ جو امت کے لیے علم کا قائم رہنے والا پرچم بنا'
  - term:
      ar: الدعوة الخفية
      en: the quiet preaching
      ur: خاموش دعوت
    gloss:
      ar: 'سنوات الدعوة الأولى حين بقيت في حدود البيت والأصحاب المقرّبين'
      en: 'the call''s first years, when it stayed inside the household and among the closest friends'
      ur: 'دعوت کے ابتدائی سال جب وہ گھر اور قریبی ساتھیوں تک محدود رہی'
  - term:
      ar: النبوة
      en: the prophethood
      ur: نبوت
    gloss:
      ar: 'منصب حمل رسالة الله الذي حمله النبي ثلاثًا وعشرين سنة'
      en: 'the office of carrying God''s message that the Prophet bore for twenty-three years'
      ur: 'اللہ کے پیغام اٹھانے کا منصب جو نبی نے تئیس برس ادا کیا'
  - term:
      ar: جبل النور
      en: the Mount of Light
      ur: کوہِ نور
    gloss:
      ar: 'اسم الجبل فيما بعد — الجبل الحامل للغار الذي باركه نور الوحي'
      en: 'the hill''s later name — the mount holding the cave, blessed by the revelation''s light'
      ur: 'پہاڑ کا بعد کا نام — وہ پہاڑ جس میں غار ہے اور وحی کے نور نے مبارک کیا'
  - term:
      ar: الملك
      en: the angel
      ur: فرشتہ
    gloss:
      ar: 'جبريل، الملك الذي حمل الوحي إلى النبي في الغار'
      en: 'Jibril, the angel who carried the revelation down to the Prophet in the cave'
      ur: 'جبرائیل، وہ فرشتہ جو غار میں نبی تک وحی لایا'
  - term:
      ar: ٦١٠م
      en: 610 CE
      ur: 610ء
    gloss:
      ar: 'السنة التقريبية التي تعطيها المصادر لبدء نزول الوحي'
      en: 'the rough year the sources give for the beginning of the revelation'
      ur: 'تقریبی سال جو روایات وحی کے آغاز کے لیے بتاتی ہیں'
  - term:
      ar: الثلاث وعشرون
      en: the twenty-three years
      ur: تئیس سال
    gloss:
      ar: 'المدة التي نزل فيها القرآن على النبي بين مكة والمدينة'
      en: 'the span over which the Qur''an descended on the Prophet, between Mecca and Medina'
      ur: 'وہ مدت جس میں قرآن نبی پر مکہ اور مدینہ میں نازل ہوا'
  - term:
      ar: مكة
      en: Mecca
      ur: مکہ
    gloss:
      ar: 'المدينة التي بدأت فيها الدعوة قبل أن تخرج إلى العالم'
      en: 'the city where the call began before it travelled out into the world'
      ur: 'وہ شہر جہاں دعوت شروع ہوئی اور پھر دنیا میں پھیلی'
  - term:
      ar: الدعوة
      en: the calling
      ur: دعوت
    gloss:
      ar: 'الاسم العام لعمل حمل الإسلام — من الخفاء إلى العلن'
      en: 'the general name for the work of carrying Islam — from hiding to openness'
      ur: 'اسلام پہنچانے کے کام کا عمومی نام — خفیہ سے کھلے عام تک'
  - term:
      ar: الجماعة
      en: the community
      ur: جماعت
    gloss:
      ar: 'الجماعة التي ربطها الإيمان بنبيها شيئًا فشيئًا حتى صارت أمة'
      en: 'the gathering that faith slowly bound around its prophet until it grew into an ummah'
      ur: 'وہ جماعت جسے ایمان آہستہ آہستہ نبی کے گرد باندھتا گیا یہاں تک کہ امت بن گئی'
  practice:
  - q:
      ar: أين جاء الوحي أول مرة؟
      en: Where did revelation first come?
      ur: وحی پہلی بار کہاں آئی؟
    options:
    - text:
        ar: في غار حراء قرب مكة
        en: in the cave of Hira near Mecca
        ur: مکہ کے قریب غارِ حرا میں
      correct: true
      why:
        ar: تذكر المصادر الغار على الجبل
        en: the sources name the cave on the mountain
        ur: ماخذ پہاڑ پر غار کا ذکر کرتے ہیں
    - text:
        ar: في المدينة
        en: in Medina
        ur: مدینہ میں
      correct: false
      why:
        ar: كان الوحي في مكة قبل الهجرة
        en: revelation was in Mecca before the Hijra
        ur: وحی ہجرت سے پہلے مکہ میں آئی
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: القدس قبلة لاحقة لا مكان الوحي
        en: Jerusalem was a later qibla, not the revelation''s place
        ur: بیت المقدس بعد کا قبلہ تھا، وحی کی جگہ نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم تدخل الأحداث دمشق في ذلك الزمن
        en: the events did not reach Damascus then
        ur: واقعات اس زمانے میں دمشق تک نہیں پہنچے
  - q:
      ar: متى بدأ الوحي تقريبًا؟
      en: When did revelation begin, roughly?
      ur: وحی تقریباً کب شروع ہوئی؟
    options:
    - text:
        ar: نحو ٦١٠م
        en: around 610 CE
        ur: تقریباً 610ء میں
      correct: true
      why:
        ar: تحسب المصادر البدء قبل الهجرة باثني عشر عامًا
        en: the sources count twelve years before the Hijra
        ur: ماخذ ہجرت سے بارہ سال پہلے گنتے ہیں
    - text:
        ar: نحو ٥٧٠م
        en: around 570 CE
        ur: تقریباً 570ء میں
      correct: false
      why:
        ar: ذلك تقريب ميلاد النبي لا بدء الوحي
        en: that is nearer the Prophet''s birth, not the revelation
        ur: یہ نبی کی پیدائش کے قریب ہے، وحی کے آغاز کے نہیں
    - text:
        ar: نحو ٦٢٢م
        en: around 622 CE
        ur: تقریباً 622ء میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا بدء الوحي
        en: that is the Hijra year, not the start of revelation
        ur: یہ ہجرت کا سال ہے، وحی کا آغاز نہیں
    - text:
        ar: نحو ٦٣٢م
        en: around 632 CE
        ur: تقریباً 632ء میں
      correct: false
      why:
        ar: ذلك عام وفاة النبي
        en: that is the year of the Prophet''s death
        ur: یہ نبی کی وفات کا سال ہے
  - q:
      ar: ما أول كلمة نزلت؟
      en: What was the first word sent down?
      ur: پہلا اترا ہوا لفظ کیا تھا؟
    options:
    - text:
        ar: اقرأ
        en: Read
        ur: پڑھو
      correct: true
      why:
        ar: تذكر المصادر بدء الأمر بكلمة اقرأ
        en: the sources record the opening word as Read
        ur: ماخذ پہلے لفظ کو پڑھو لکھتے ہیں
    - text:
        ar: اكتب
        en: Write
        ur: لکھو
      correct: false
      why:
        ar: لم تكن الكتابة الكلمة الأولى
        en: writing was not the first word
        ur: لکھنا پہلا لفظ نہیں تھا
    - text:
        ar: اسمع
        en: Listen
        ur: سنو
      correct: false
      why:
        ar: اقرأ الكلمة المسجلة في النصوص
        en: Read is the recorded word in the texts
        ur: پڑھو نصوص میں درج لفظ ہے
    - text:
        ar: تعلّم
        en: Learn
        ur: سیکھو
      correct: false
      why:
        ar: الكلمة الأولى اقرأ لا تعلّم
        en: the first word is Read, not Learn
        ur: پہلا لفظ پڑھو ہے، سیکھو نہیں
  - q:
      ar: كم دام الوحي؟
      en: How long did revelation last?
      ur: وحی کتنی دیر رہی؟
    options:
    - text:
        ar: ثلاثًا وعشرين سنة
        en: twenty-three years
        ur: تئیس سال
      correct: true
      why:
        ar: من البداية إلى وفاة النبي نحو ٢٣ عامًا
        en: from the start to the Prophet''s death, about 23 years
        ur: آغاز سے نبی کی وفات تک تقریباً 23 سال
    - text:
        ar: سنتان
        en: two years
        ur: دو سال
      correct: false
      why:
        ar: سنتان مدة جزء من المكية لا الكل
        en: two years is a portion of the Meccan period
        ur: دو سال مکی دور کا ایک حصہ ہے
    - text:
        ar: مائة عام
        en: a hundred years
        ur: سو سال
      correct: false
      why:
        ar: لم يعش النبي هذا العمر
        en: the Prophet did not live that long
        ur: نبی اتنی عمر نہیں پائے
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أقلّ من مدة المكية وحدها
        en: ten is less than the Meccan span alone
        ur: دس صرف مکی عرصے سے کم ہے
  - q:
      ar: ماذا ميّز السنوات الأولى؟
      en: What marked the early years?
      ur: ابتدائی برسوں کی کیا خصوصیت تھی؟
    options:
    - text:
        ar: الدعوة الخفية في مكة
        en: the quiet preaching in Mecca
        ur: مکہ میں خاموش دعوت
      correct: true
      why:
        ar: كانت الدعوة في السرّ قبل الإذن بالظهور
        en: the calling was quiet before permission to appear
        ur: اظہار کی اجازت سے پہلے دعوت خاموش تھی
    - text:
        ar: حروب كبرى
        en: great wars
        ur: بڑی جنگیں
      correct: false
      why:
        ar: كانت السنوات الأولى دعوة لا قتال
        en: the early years were preaching, not war
        ur: ابتدائی برس دعوت کے تھے، جنگ کے نہیں
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: false
      why:
        ar: الفتح جاء في آخر السلسلة لا أولها
        en: the conquest came at the chain''s end
        ur: فتح زنجیر کے آخر میں آیا
    - text:
        ar: الحج إلى بيت المقدس
        en: pilgrimage to Jerusalem
        ur: بیت المقدس کی حج
      correct: false
      why:
        ar: لم يكن الحج إلى القدس في تلك السنوات
        en: there was no Jerusalem pilgrimage in those years
        ur: ان برسوں میں بیت المقدس کی حج نہیں تھی
  - q:
      ar: من جاء بالوحي؟
      en: Who brought the revelation?
      ur: وحی کون لایا؟
    options:
    - text:
        ar: المَلَك
        en: the angel
        ur: فرشتہ
      correct: true
      why:
        ar: تذكر المصادر المَلَك حامل الأمر
        en: the sources name the angel as the bearer
        ur: ماخذ فرشتے کو لانے والا لکھتے ہیں
    - text:
        ar: إنسان من قريش
        en: a man of Quraysh
        ur: قریش کا ایک آدمی
      correct: false
      why:
        ar: لم يكن الوسيط إنسانًا
        en: the bearer was not a human
        ur: لانے والا انسان نہیں تھا
    - text:
        ar: النبي نفسه
        en: the Prophet himself
        ur: خود نبی
      correct: false
      why:
        ar: النبي مستلم الوحي لا حامله
        en: the Prophet received it, he did not carry it
        ur: نبی وصول کنندہ تھے، لانے والا نہیں
    - text:
        ar: قوم الأنصار
        en: the Ansar
        ur: انصار
      correct: false
      why:
        ar: الأنصار دعوا النبي بعد الوحي بأعوام
        en: the Ansar invited the Prophet years later
        ur: انصار نے برسوں بعد نبی کو بلایا
  - q:
      ar: ماذا غيّر الوحي؟
      en: What did revelation change?
      ur: وحی نے کیا بدلا؟
    options:
    - text:
        ar: بلاد العرب وما جاورها على مدى ٢٣ عامًا
        en: Arabia and its neighbors over 23 years
        ur: 23 سال میں جزیرۃ العرب اور اس کے پڑوسی
      correct: true
      why:
        ar: أعادت السلسلة تشكيل المنطقة وتاريخها
        en: the chain reshaped the region and its history
        ur: زنجیر نے خطے اور اس کی تاریخ کو بدل دیا
    - text:
        ar: لا شيء؛ بقي كل شيء كما كان
        en: nothing; all stayed the same
        ur: کچھ نہیں؛ سب وہی رہا
      correct: false
      why:
        ar: بدأت منه الدولة والقرآن والتقويم
        en: the state, the Quran and the calendar began from it
        ur: اس سے ریاست، قرآن اور تقویم شروع ہوئے
    - text:
        ar: أوروبا فقط
        en: Europe only
        ur: صرف یورپ
      correct: false
      why:
        ar: كان التأثير في الجزيرة أولًا ثم العالم
        en: the effect was Arabia first, then the world
        ur: اثر پہلے جزیرے میں تھا، پھر دنیا میں
    - text:
        ar: أسبوع واحد من الأحداث
        en: one week of events
        ur: ایک ہفتے کے واقعات
      correct: false
      why:
        ar: دام الوحي عقدين لا أسبوعًا
        en: revelation lasted two decades, not a week
        ur: وحی دو دہائیوں تک رہی، ایک ہفتے نہیں
  - q:
      ar: أين كان المكان؟
      en: Where was the place?
      ur: وہ جگہ کہاں تھی؟
    options:
    - text:
        ar: على جبل قرب مكة
        en: on a mountain near Mecca
        ur: مکہ کے قریب ایک پہاڑ پر
      correct: true
      why:
        ar: الغار على جبل النور قرب المدينة
        en: the cave is on the Mount of Light near the city
        ur: غار شہر کے قریب کوہِ نور پر ہے
    - text:
        ar: في وادي النيل
        en: in the Nile valley
        ur: وادیِ نیل میں
      correct: false
      why:
        ar: لم تكن مصر مكان الوحي
        en: Egypt was not the revelation''s place
        ur: مصر وحی کی جگہ نہیں تھی
    - text:
        ar: في البادية الشمالية
        en: in the northern desert
        ur: شمالی صحرا میں
      correct: false
      why:
        ar: الغار قرب مكة لا في الشمال البعيد
        en: the cave is near Mecca, not the far north
        ur: غار مکہ کے قریب ہے، دور شمال میں نہیں
    - text:
        ar: تحت الأرض في بيت
        en: underground in a house
        ur: کسی گھر میں زیرِ زمین
      correct: false
      why:
        ar: كان المكان غارًا على جبل لا بيتًا
        en: the place was a cave on a mountain, not a house
        ur: وہ جگہ پہاڑ پر غار تھی، گھر نہیں
  - q:
      ar: لماذا كان الأمر بالقراءة؟
      en: Why was the command to read?
      ur: حکم پڑھنے کا کیوں تھا؟
    options:
    - text:
        ar: لأنّ الرسالة كتاب يُقرأ ويُتلى
        en: because the message is a book to be read and recited
        ur: کیونکہ پیغام ایک کتاب ہے جو پڑھی اور تلاوت کی جائے
      correct: true
      why:
        ar: تذكر المصادر أنّ البدء كان بكلمة القراءة
        en: the sources record the start was the word of reading
        ur: ماخذ لکھتے ہیں آغاز پڑھنے کے لفظ سے تھا
    - text:
        ar: لأنّ النبي لم يكن يعرف الكتابة
        en: because the Prophet could not write
        ur: کیونکہ نبی لکھنا نہیں جانتے تھے
      correct: false
      why:
        ar: الكلمة للرسالة لا لحالة النبي
        en: the word was for the message, not the Prophet''s state
        ur: لفظ پیغام کے لیے تھا، نبی کی حالت کے لیے نہیں
    - text:
        ar: لأنّ العرب لم يكن عندهم كتب
        en: because the Arabs had no books
        ur: کیونکہ عربوں کے پاس کتابیں نہیں تھیں
      correct: false
      why:
        ar: الأمر للرسالة الجديدة لا لوصف العرب
        en: the command was for the new message, not describing Arabs
        ur: حکم نئے پیغام کے لیے تھا، عربوں کی صفت کے لیے نہیں
    - text:
        ar: لا سبب
        en: no reason
        ur: کوئی وجہ نہیں
      correct: false
      why:
        ar: تحمل الكلمة معنى الرسالة الأولى
        en: the word carries the first message''s meaning
        ur: لفظ پہلے پیغام کا معنی رکھتا ہے
  - q:
      ar: ماذا سمّى المسلمون الفترة الأولى؟
      en: What did Muslims call the first period?
      ur: مسلمانوں نے پہلے دور کو کیا نام دیا؟
    options:
    - text:
        ar: الدعوة الخفية
        en: the quiet preaching
        ur: خاموش دعوت
      correct: true
      why:
        ar: هذا الاسم للسنوات الأولى من التبليغ
        en: this name marks the first years of spreading
        ur: یہ نام تبلیغ کے ابتدائی برسوں کا ہے
    - text:
        ar: عهد المدينة
        en: the Medina era
        ur: مدینہ کا دور
      correct: false
      why:
        ar: عهد المدينة بعد الهجرة
        en: the Medina era came after the Hijra
        ur: مدینہ کا دور ہجرت کے بعد آیا
    - text:
        ar: الفتوحات
        en: the conquests
        ur: فتوحات
      correct: false
      why:
        ar: الفتوحات في العصر اللاحق لا الأول
        en: the conquests belong to the later era, not the first
        ur: فتوحات بعد کے دور کی ہیں، پہلے کی نہیں
    - text:
        ar: الخلافة
        en: the caliphate
        ur: خلافت
      correct: false
      why:
        ar: الخلافة بعد وفاة النبي
        en: the caliphate came after the Prophet''s death
        ur: خلافت نبی کی وفات کے بعد آئی
- id: conquest-mecca
  anchor: event/conquest-of-mecca
  band: scholars
  title:
    ar: فتح مكة
    en: the conquest of Mecca
    ur: فتح مکہ
  sixty:
    ar: 'في رمضان من السنة الثامنة للهجرة (٦٣٠م) دخل النبي مكة بجيش عشرة آلاف بلا قتال تقريبًا. ثمانية سنين بعد خروجه مهاجرًا عاد فاتحًا، فمنّ على أهلها أمانًا عامًا «اذهبوا فأنتم الطلقاء». طوّف بالكعبة وهدم أصنامها وردّ البيت لتوحيده الأول، ودخل الناس في دين الله أفواجًا في تلك السنين التالية. لم يكن الفتح انتقامًا بل مصالحة كبرى: أعاد الولاء لبيت الله، وسكت أصوات الحرب، وجعل القبلة قلب أمة تتوسع. وبهذا تكتمل القصة: من الهجرة قوةً ضعيفة إلى الفتح عودةً منصورة، ومن يثرب مدينة إلى مكة أمّ القرى. وصار الفتح سنة للفاتحين: العفو عند المقدرة أعظم من النصر، وقلب الكعبة الذي رُدّ للتوحيد ما زال يجمع الملايين. وفي يوم الفتح طُويت عشرون سنة من الصراع بين مكة والمدينة، وبدأت مرحلةٌ انتقلت فيها الدعوة من مدينة واحدة إلى شبه جزيرة كاملة. ولم يدخل الفاتحون مكة ملوكًا بل دخلوها ساجدين شاكرين، فكان المشهد درسًا في كيف يعامل النصرُ المنتصرين قبل المنهزمين.'
    en: 'In Ramadan of the eighth Hijri year (630 CE), the Prophet entered Mecca with ten thousand and almost no fighting. Eight years after leaving as an emigrant, he returned a conqueror — granting its people general safety: ''Go, you are free.'' He circled the Kaaba, brought down its idols and restored the House to its first oneness, and in the following years people entered God''s religion in throngs. The conquest was not revenge but a grand reconciliation: it restored the House''s allegiance, silenced the war and made the qibla the heart of a widening ummah. So the story completes itself: from a weak migration to a victorious return, from Yathrib a city to Mecca mother of towns. The conquest became a model for conquerors: pardon at power is greater than victory, and the Kaaba''s heart restored to oneness still gathers millions.'
    ur: 'ہجرت کے آٹھویں سال رمضان میں (630ء) نبی دس ہزار کی فوج کے ساتھ مکہ میں تقریباً بغیر جنگ داخل ہوئے۔ مہاجر بن کر نکلے تھے، فاتح بن کر لوٹے — اور اہلِ شہر کو عام امان دیا: «جاؤ تم آزاد ہو۔» انہوں نے کعبہ کا طواف کیا، بت گرا دیے اور گھر کو اس کی پہلی توحید پر لوٹایا، اور اگلے برسوں میں لوگ جوق در جوق دین میں داخل ہوئے۔ یہ فتح انتقام نہیں بلکہ بڑی صلح تھی: گھر کی وفاداری بحال ہوئی، جنگ خاموش ہوئی اور قبلہ بڑھتی امت کا دل بنا۔ اس طرح کہانی پوری ہوتی ہے: کمزور ہجرت سے فاتحانہ واپسی، یثرب کے شہر سے مکہ ام القری تک۔ فتح فاتحین کے لیے نمونہ بنا: طاقت پر معافی فتح سے بڑی ہے، اور توحید پر لوٹا ہوا کعبہ آج بھی لاکھوں کو جمع کرتا ہے۔'
  glossary:
  - term:
      ar: الفتح
      en: the conquest
      ur: فتح
    gloss:
      ar: 'العودة المنتصرة إلى مكة سنة ٦٣٠م بعد ثماني سنوات من الهجرة'
      en: 'the victorious return to Mecca in 630, eight years after the Hijra had carried the call away'
      ur: '630 میں مکہ کی فاتحانہ واپسی، ہجرت کے آٹھ سال بعد'
  - term:
      ar: الأصنام
      en: the idols
      ur: بت
    gloss:
      ar: 'أصنام العرب التي أحاطت بالكعبة قبل أن يطهّرها النبي يوم الدخول'
      en: 'the Arabs'' idols that ringed the Kaaba before the Prophet cleansed it on entry'
      ur: 'عرب کے بت جو کعبہ کے گرد رکھے تھے اور نبی نے داخل ہو کر صاف کر دیے'
  - term:
      ar: الأمان
      en: the safety
      ur: امان
    gloss:
      ar: 'العفو العام الذي أعلنه النبي لأهل مكة يوم دخولها'
      en: 'the general amnesty the Prophet declared for Mecca''s people the day he entered it'
      ur: 'عام معافی جو نبی نے مکہ کے لوگوں کے لیے داخل ہونے کے دن اعلان کی'
  - term:
      ar: أفواجًا
      en: in throngs
      ur: جوق در جوق
    gloss:
      ar: 'دخول الناس في دين الله جماعاتٍ وأفواجًا في السنوات التي تلت الفتح'
      en: 'people entering God''s religion in groups and throngs in the years that followed the conquest'
      ur: 'لوگوں کا اللہ کے دین میں گروہ در گروہ داخل ہونا فتح کے بعد کے سالوں میں'
  - term:
      ar: الكعبة
      en: the Kaaba
      ur: کعبہ
    gloss:
      ar: 'بيت الله الذي طهّره النبي من الأصنام يوم دخل المدينة'
      en: 'God''s House, which the Prophet cleansed of idols the day he entered the city'
      ur: 'اللہ کا گھر جسے نبی نے شہر میں داخل ہونے والے دن بتوں سے پاک کیا'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'المسلمون المكيون الأوائل الذين هاجروا إلى المدينة وعادوا مع النبي'
      en: 'the early Meccan Muslims who had migrated to Medina and came back with the Prophet'
      ur: 'ابتدائی مکی مسلمان جو مدینہ ہجرت کر گئے تھے اور نبی کے ساتھ لوٹے'
  - term:
      ar: رمضان ٦٣٠
      en: Ramadan 630
      ur: رمضان 630
    gloss:
      ar: 'شهر الدخول — وكان الجيش المسلم صائمًا حين جاء'
      en: 'the month of the entry — the Muslim army was fasting as it came'
      ur: 'داخلے کا مہینہ — مسلم فوج آتے وقت روزے سے تھی'
  - term:
      ar: الأبواب الأربعة
      en: the four gates
      ur: چار دروازے
    gloss:
      ar: 'نقاط دخول المدينة التي دخل منها الجيش يوم العودة'
      en: 'the city''s entry points through which the army came on the day of the return'
      ur: 'شہر کے وہ راستے جن سے فوج واپسی کے دن اندر آئی'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'القبيلة التي حكمت مكة وقادت معارضة الدعوة حتى يوم الفتح'
      en: 'the tribe that had ruled Mecca and led the opposition to the call until the conquest'
      ur: 'وہ قبیلہ جو مکہ پر حکومت کرتا تھا اور فتح تک دعوت کی مخالفت کرتا رہا'
  - term:
      ar: الثماني سنوات
      en: the eight years
      ur: آٹھ سال
    gloss:
      ar: 'المدة من الهجرة إلى العودة — وهي عمر دولة المدينة كلها حتى ذلك اليوم'
      en: 'the span from the migration to the return — the whole life of Medina''s state so far'
      ur: 'ہجرت سے واپسی تک کا عرصہ — مدینہ کی ریاست کی ساری عمر اس دن تک'
  - term:
      ar: ميزان العرب
      en: the balance of Arabia
      ur: عرب کا توازن
    gloss:
      ar: 'الميزان الذي رجّحه الفتح في الجزيرة فحسم الصراع لصالح الدعوة'
      en: 'the balance the conquest tilted in the peninsula, settling the contest for the call'
      ur: 'وہ توازن جسے فتح نے جزیرے میں دعوت کے حق میں جھکا دیا'
  - term:
      ar: الرسالة
      en: the message
      ur: پیغام
    gloss:
      ar: 'الحقيقة المركزية التي أُعيد إليها البيت — عبادة الله وحده'
      en: 'the central truth the House was restored to — the worship of God alone'
      ur: 'مرکزی سچائی جس پر گھر لوٹایا گیا — صرف اللہ کی عبادت'
  practice:
  - q:
      ar: متى كان فتح مكة؟
      en: When was the conquest of Mecca?
      ur: فتح مکہ کب ہوا؟
    options:
    - text:
        ar: في رمضان عام ٦٣٠م
        en: in Ramadan of 630 CE
        ur: 630ء رمضان میں
      correct: true
      why:
        ar: تذكر المصادر رمضان ٨هـ ٦٣٠م
        en: the sources date Ramadan 8 AH / 630 CE
        ur: ماخذ رمضان 8 ہجری / 630ء لکھتے ہیں
    - text:
        ar: في عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا الفتح
        en: that is the Hijra year, not the conquest
        ur: یہ ہجرت کا سال ہے، فتح کا نہیں
    - text:
        ar: في عام ٦١٧
        en: in 617
        ur: 617 میں
      correct: false
      why:
        ar: قبل الهجرة بسنوات
        en: years before the Hijra
        ur: ہجرت سے برسوں پہلے
    - text:
        ar: في القرن الثامن
        en: in the eighth century
        ur: آٹھویں صدی میں
      correct: false
      why:
        ar: الفتح في القرن السابع الميلادي
        en: the conquest is seventh-century
        ur: فتح ساتویں صدی میں ہے
  - q:
      ar: كم سنة مرّت بين الهجرة والفتح؟
      en: How many years between Hijra and conquest?
      ur: ہجرت اور فتح کے درمیان کتنے سال گذرے؟
    options:
    - text:
        ar: ثماني سنوات
        en: eight years
        ur: آٹھ سال
      correct: true
      why:
        ar: من ٦٢٢ إلى ٦٣٠ ثمانية أعوام
        en: from 622 to 630 is eight years
        ur: 622 سے 630 تک آٹھ سال
    - text:
        ar: سنتان
        en: two years
        ur: دو سال
      correct: false
      why:
        ar: سنتان أقلّ من مدة المكية وحدها
        en: two is less than the Meccan span alone
        ur: دو صرف مکی عرصے سے کم ہے
    - text:
        ar: عشرون عامًا
        en: twenty years
        ur: بیس سال
      correct: false
      why:
        ar: عشرون تتجاوز عمر الدعوة كلها تقريبًا
        en: twenty runs past nearly the whole message
        ur: بیس تقریباً پورے پیغام کے عرصے سے زیادہ ہے
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: لم يعش النبي إلى تلك المدة
        en: the Prophet did not live that span
        ur: نبی اتنے عرصے تک نہیں رہے
  - q:
      ar: كيف دخل المسلمون مكة؟
      en: How did the Muslims enter Mecca?
      ur: مسلمان مکہ میں کیسے داخل ہوئے؟
    options:
    - text:
        ar: من أبوابها الأربعة بلا قتال كبير
        en: through its four gates without a great fight
        ur: اس کے چار دروازوں سے، بڑی جنگ کے بغیر
      correct: true
      why:
        ar: سلّمت المدينة في المصادر بلا مقاومة كبرى
        en: the sources have the city yield without major resistance
        ur: ماخذ میں شہر نے بڑی مزاحمت کے بغیر ہتھیار ڈالے
    - text:
        ar: بعد محاصرة سنتين
        en: after a two-year siege
        ur: دو سالہ محاصرے کے بعد
      correct: false
      why:
        ar: لم تكن المدينة محاصرة سنتين
        en: the city was not besieged for two years
        ur: شہر دو سال محاصرے میں نہیں تھا
    - text:
        ar: بالبحر
        en: by sea
        ur: سمندر سے
      correct: false
      why:
        ar: مكة مدينة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے، ساحلی نہیں
    - text:
        ar: بالحيلة في الليل
        en: by a trick at night
        ur: رات کو چال سے
      correct: false
      why:
        ar: كان الدخول علنيًّا نهارًا بالأبواب
        en: the entry was open by day through the gates
        ur: داخلہ دن کے وقت دروازوں سے علانیہ تھا
  - q:
      ar: ماذا حدث للأصنام حول الكعبة؟
      en: What happened to the idols around the Kaaba?
      ur: کعبہ کے گرد بتوں کا کیا ہوا؟
    options:
    - text:
        ar: هُدّمت
        en: they were brought down
        ur: گرائے گئے
      correct: true
      why:
        ar: تذكر المصادر إزالة الأصنام من حول البيت
        en: the sources record the idols removed from around the House
        ur: ماخذ گھر کے گرد سے بتوں کے ہٹائے جانے کا ذکر کرتے ہیں
    - text:
        ar: بقيت إلى اليوم
        en: they remain today
        ur: آج بھی موجود ہیں
      correct: false
      why:
        ar: أُزيلت يوم الفتح في النصوص
        en: the texts have them removed the day of the conquest
        ur: نصوص میں وہ فتح کے دن ہٹا دیے گئے
    - text:
        ar: بِيعت إلى تجار
        en: they were sold to merchants
        ur: تاجروں کو بیچ دیے گئے
      correct: false
      why:
        ar: لم تُبع الأصنام بل هُدّمت
        en: they were not sold, they were destroyed
        ur: وہ بیچے نہیں گئے، گرائے گئے
    - text:
        ar: نُقلت إلى متحف
        en: they were moved to a museum
        ur: عجائب گھر منتقل کیے گئے
      correct: false
      why:
        ar: لم تكن متاحف في ذلك الزمن
        en: there were no museums then
        ur: اس وقت عجائب گھر نہیں تھے
  - q:
      ar: ما الأمان الذي أُعلن؟
      en: What was the declared safety?
      ur: کون سی امان کا اعلان ہوا؟
    options:
    - text:
        ar: أمان عامّ لأهل مكة
        en: a general safety for Mecca''s people
        ur: مکہ کے لوگوں کے لیے عمومی امان
      correct: true
      why:
        ar: أعلن النبي الأمان لأهل المدينة في المصادر
        en: the sources have safety declared for the city''s people
        ur: ماخذ میں شہر کے لوگوں کے لیے امان کا اعلان ہے
    - text:
        ar: عفو للقادة فقط
        en: pardon for leaders only
        ur: صرف رہنماؤں کے لیے معافی
      correct: false
      why:
        ar: شمل الأمان أهلها لا القادة وحدهم
        en: the safety covered its people, not leaders only
        ur: امان میں لوگ شامل تھے، صرف رہنما نہیں
    - text:
        ar: للمسلمين فقط
        en: for Muslims only
        ur: صرف مسلمانوں کے لیے
      correct: false
      why:
        ar: كان الأمان لأهل مكة المشركين أولاً
        en: the safety was for Mecca''s polytheist people first
        ur: امان پہلے مکہ کے مشرک لوگوں کے لیے تھی
    - text:
        ar: لا أمان أُعلن
        en: no safety was declared
        ur: کوئی امان کا اعلان نہیں ہوا
      correct: false
      why:
        ar: تذكر المصادر إعلان الأمان صراحة
        en: the sources name the safety plainly
        ur: ماخذ امان کو صاف لکھتے ہیں
  - q:
      ar: لماذا كان الفتح إتمامًا للهجرة؟
      en: Why did the conquest complete the Hijra?
      ur: فتح نے ہجرت کو کیوں مکمل کیا؟
    options:
    - text:
        ar: لأنّ المهاجرين عادوا إلى موطنهم أقوى
        en: because the migrants returned home too strong to resist
        ur: کیونکہ مہاجرین اپنے وطن اتنے مضبوط ہو کر لوٹے
      correct: true
      why:
        ar: جمع الفتح العودة إلى الأصل والقوة الجديدة
        en: the conquest joined the return home with new strength
        ur: فتح نے وطن واپسی اور نئی طاقت کو جوڑا
    - text:
        ar: لأنّه كان نزهة
        en: because it was a picnic
        ur: کیونکہ یہ پکنک تھا
      correct: false
      why:
        ar: كان الفتح حدثًا سياسيًّا كبيرًا
        en: the conquest was a major political event
        ur: فتح ایک بڑا سیاسی واقعہ تھا
    - text:
        ar: لأنّه كان نهاية الإسلام
        en: because it was the end of Islam
        ur: کیونکہ یہ اسلام کا خاتمہ تھا
      correct: false
      why:
        ar: الفتح بداية الانتشار لا النهاية
        en: the conquest was the spread''s start, not the end
        ur: فتح پھیلاؤ کا آغاز تھا، خاتمہ نہیں
    - text:
        ar: لأنّ مكة كانت أبعد مدينة
        en: because Mecca was the farthest city
        ur: کیونکہ مکہ سب سے دور شہر تھا
      correct: false
      why:
        ar: العودة ليست للبعد بل للموطن
        en: the return was to home, not the farthest point
        ur: واپسی دور ترین مقام نہیں بلکہ وطن تھی
  - q:
      ar: من كتب عن الفتح؟
      en: Who wrote about the conquest?
      ur: فتح کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: كتب السيرة والتواريخ المبكرة
        en: the sira and early history books
        ur: سیرت اور ابتدائی تواریخ کی کتابیں
      correct: true
      why:
        ar: تصلنا روايات ابن إسحاق والواقدي والطبري
        en: accounts reach us from Ibn Ishaq, al-Waqidi and al-Tabari
        ur: ابن اسحاق، واقدی اور طبری کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: مؤرخو العثمانيين فقط
        en: only Ottoman historians
        ur: صرف عثمانی مؤرخین
      correct: false
      why:
        ar: كتب المسلمون عن الفتح قبل العثمانيين بقرون
        en: Muslims wrote about it centuries before the Ottomans
        ur: مسلمانوں نے عثمانیوں سے صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: الفتح موثّق في كتب السيرة
        en: the conquest is documented in the sira books
        ur: فتح سیرت کی کتابوں میں مکتوب ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الحروب الصليبية بعد خمسة قرون
        en: the Crusades came five centuries later
        ur: صلیبی جنگیں پانچ صدیوں بعد آئیں
  - q:
      ar: ماذا تغيّر بعد الفتح؟
      en: What changed after the conquest?
      ur: فتح کے بعد کیا بدلا؟
    options:
    - text:
        ar: ميزان العرب كلها ودخول الناس في الإسلام
        en: the balance of all Arabia and people entering Islam
        ur: پورے عرب کا توازن اور لوگوں کا اسلام میں داخل ہونا
      correct: true
      why:
        ar: غيّر الفتح القوة في الجزيرة كلها
        en: the conquest shifted power across the peninsula
        ur: فتح نے جزیرے میں طاقت بدل دی
    - text:
        ar: لا شيء مهم
        en: nothing important
        ur: کوئی اہم چیز نہیں
      correct: false
      why:
        ar: الفتح نقطة تحوّل في المصادر
        en: the conquest is a turning point in the sources
        ur: فتح ماخذ میں ایک موڑ ہے
    - text:
        ar: انتهى الإسلام في مكة
        en: Islam ended in Mecca
        ur: مکہ میں اسلام ختم ہو گیا
      correct: false
      why:
        ar: بدأ انتشار الإسلام بعد الفتح لا انتهى
        en: Islam''s spread began after the conquest
        ur: فتح کے بعد اسلام کا پھیلاؤ شروع ہوا
    - text:
        ar: سقطت المدينة
        en: Medina fell
        ur: مدینہ گر گیا
      correct: false
      why:
        ar: بقيت المدينة العاصمة
        en: Medina stayed the capital
        ur: مدینہ دارالحکومت رہا
  - q:
      ar: لماذا لم تقاتل قريش الفتح؟
      en: Why did the Quraysh not fight the conquest?
      ur: قریش نے فتح کا مقابلہ کیوں نہیں کیا؟
    options:
    - text:
        ar: لأنّ المسلمين صاروا أقوى من أن يقاوموا
        en: because the Muslims had grown too strong to resist
        ur: کیونکہ مسلمان اتنے مضبوط ہو گئے تھے کہ مقابلہ نہ ہو سکا
      correct: true
      why:
        ar: سلّمت المدينة لأنّ الميزان مال في المصادر
        en: the sources have the city yield as the balance tipped
        ur: ماخذ میں شہر نے ہتھیار ڈالے کیونکہ توازن جھک گیا تھا
    - text:
        ar: لأنّهم كانوا في عطلة
        en: because they were on holiday
        ur: کیونکہ وہ تعطیل میں تھے
      correct: false
      why:
        ar: السلامة ليست عطلة في النصوص
        en: safety is not a holiday in the texts
        ur: نصوص میں امان کوئی تعطیل نہیں
    - text:
        ar: لأنّهم هاجروا إلى مصر
        en: because they migrated to Egypt
        ur: کیونکہ وہ مصر ہجرت کر گئے
      correct: false
      why:
        ar: بقيت قريش في مكة وسلّمت
        en: the Quraysh stayed in Mecca and yielded
        ur: قریش مکہ میں رہے اور ہتھیار ڈالے
    - text:
        ar: لأنّ مكة كانت مدينة مسالمة دائمًا
        en: because Mecca was always peaceful
        ur: کیونکہ مکہ ہمیشہ پرامن تھا
      correct: false
      why:
        ar: قاتلت قريش المسلمين في بدر وأُحد قبلها
        en: the Quraysh had fought the Muslims at Badr and Uhud
        ur: قریش نے اس سے پہلے بدر اور احد میں مسلمانوں سے لڑی
  - q:
      ar: أين ذهب النبي بعد الفتح؟
      en: Where did the Prophet go after the conquest?
      ur: فتح کے بعد نبی کہاں گئے؟
    options:
    - text:
        ar: عاد إلى المدينة
        en: he returned to Medina
        ur: مدینہ واپس آئے
      correct: true
      why:
        ar: بقيت المدينة مقرّه بعد الفتح في المصادر
        en: the sources keep Medina as his seat after the conquest
        ur: ماخذ میں فتح کے بعد مدینہ اس کی نشست رہی
    - text:
        ar: بقي في مكة إلى الأبد
        en: he stayed in Mecca forever
        ur: ہمیشہ مکہ میں رہے
      correct: false
      why:
        ar: عاد إلى المدينة بعد فتحها
        en: he returned to Medina after taking it
        ur: اسے لینے کے بعد مدینہ واپس آئے
    - text:
        ar: سافر إلى روما
        en: he travelled to Rome
        ur: روم گئے
      correct: false
      why:
        ar: لم يزر النبي روما
        en: the Prophet never visited Rome
        ur: نبی کبھی روم نہیں گئے
    - text:
        ar: ذهب إلى مصر
        en: he went to Egypt
        ur: مصر گئے
      correct: false
      why:
        ar: لم يغادر النبي الجزيرة بعد الفتح
        en: the Prophet did not leave Arabia after the conquest
        ur: فتح کے بعد نبی جزیرے سے باہر نہیں گئے
- id: baghdad
  anchor: place/baghdad
  band: researchers
  title:
    ar: بغداد
    en: Baghdad
    ur: بغداد
  sixty:
    ar: 'أسّس الخليفة العباسي المنصور بغداد سنة ٧٦٢م على دجلة مدينةً مدوّرة، قلبها قصر الخلافة ومسجده. صارت عاصمة الإمبراطورية العباسية ومقامًا للعصر الذهبي الإسلامي: تجمعت فيها التجارة من أقاصي الأرض، ودار الحكمة تترجم الفلسفة والطب والفلك من اليونانية والفارسية والهندية. ظلت خمسة قرون مركز الحضارة، تتنافس فيها المدارس والأسواق والشعراء. ثم جاء هولاكو سنة ١٢٥٨ فأسقط الخلافة وأحرق الكتب في دجلة، لكن بغداد نهضت مرة أخرى كمدينة كبرى على طريق الرافدين. ومن اسمها خرجت قصة: مدينة بُنيت على هندسة دائرة صارت عقل العالم. ويذكر المسلمون بغداد كما تُذكر العواصم الكبرى: أن الحضارة تبنى بالعلم والمال والحكم، وأنها تهدم بالفرقة والغزو، وأنها تعود بالذاكرة. ولم يكن جامعُها سوى وجهٍ واحد لمدينة تعدّدت مدارسها، ففي أزقّتها اجتمع المسلم والنصراني واليهودي والمجوسي على حرفةٍ وتجارةٍ وعلم. وكانت تسمّى مدينة السلام، فصار اسمها وعدًا وذكرى معًا: وعد ما يمكن أن تكونه العواصم، وذكرى ما خسرته.'
    en: 'The Abbasid caliph al-Mansur founded Baghdad in 762 CE on the Tigris as a round city — its heart the caliph''s palace and mosque. It became the empire''s capital and the seat of Islam''s golden age: goods came from the earth''s ends, and the House of Wisdom translated philosophy, medicine and astronomy out of Greek, Persian and Sanskrit. For five centuries it stayed civilization''s hub, where schools, markets and poets competed. Then Hulagu came in 1258, toppled the caliphate and cast the books into the Tigris; yet Baghdad rose again as the great city of the Two Rivers. From its name came a parable — a city built on the geometry of a circle that became the world''s mind. Muslims remember Baghdad as great capitals are remembered: civilization is built with knowledge, wealth and rule, destroyed by division and invasion, and reborn through memory.'
    ur: 'عباسی خلیفہ المنصور نے 762ء میں دجلہ کے کنارے بغداد کو گول شہر کے طور پر بسایا — مرکز میں خلیفہ کا محل اور مسجد۔ یہ سلطنت کا دارالحکومت اور اسلام کے عہدِ زریں کی نشست بنا: زمین کے کونوں سے سامان آتا، اور بیت الحکمت یونانی، فارسی اور سنسکرت سے فلسفہ، طب اور فلکیات کا ترجمہ کرتی۔ پانچ صدیوں یہ تہذیب کا مرکز رہا جہاں مکاتب، بازار اور شاعر مقابلہ کرتے۔ پھر 1258ء میں ہلاکو آیا، خلافت گرائی اور کتابیں دجلہ میں بہائیں — مگر بغداد دو دریا کا عظیم شہر بن کر پھر اٹھا۔ اس کے نام سے مثل نکلی: دائرے کی ہندسہ پر بسایا ہوا شہر جو دنیا کا ذہن بنا۔ مسلمان بغداد کو اسی طرح یاد رکھتے ہیں جس طرح عظیم دارالحکومت یاد کیے جاتے ہیں: تہذیب علم، دولت اور حکومت سے بنتی ہے، تقسیم اور حملے سے مٹتی ہے، اور یاد سے پھر جیتی ہے۔'
  glossary:
  - term:
      ar: المدينة المدوّرة
      en: the Round City
      ur: گول شہر
    gloss:
      ar: 'الشكل الذي اتخذته بغداد أولًا — سور دائري كامل حول القصر والجامع'
      en: 'the shape Baghdad first took — a perfect circular wall around the palace and the mosque'
      ur: 'وہ شکل جو بغداد نے پہلے اختیار کی — محلہ اور مسجد کے گرد مکمل گول دیوار'
  - term:
      ar: المنصور
      en: al-Mansur
      ur: المنصور
    gloss:
      ar: 'الخليفة العباسي الثاني الذي وضع أساس المدينة سنة ٧٦٢م'
      en: 'the second Abbasid caliph, who laid the city''s foundation in 762 CE'
      ur: 'دوسرا عباسی خلیفہ جس نے 762ء میں شہر کی بنیاد رکھی'
  - term:
      ar: دار الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: 'دار الترجمة والعلوم التي ازدهرت في عصر المأمون وجذبت العلماء'
      en: 'the translation and science house that flourished in al-Ma''mun''s age and drew scholars'
      ur: 'ترجمہ اور علوم کا مرکز جو مامون کے عہد میں زندہ ہوا اور علماء کو کھینچا'
  - term:
      ar: دجلة
      en: the Tigris
      ur: دجلہ
    gloss:
      ar: 'النهر الذي قامت عليه بغداد — والذي سالت فيه كتبها يوم سقوطها'
      en: 'the river Baghdad stood on — into which its books ran the day the city fell'
      ur: 'وہ دریا جس پر بغداد کھڑا تھا — جس میں اس کی کتابیں گرنے کے دن بہ گئیں'
  - term:
      ar: العباسية
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'السلالة التي حكمت من المدينة خمسة قرون، من ٧٥٠م إلى ١٢٥٨م'
      en: 'the dynasty that ruled from the city for five centuries, from 750 to 1258'
      ur: 'وہ خاندان جو شہر سے پانچ صدیوں تک حکومت کرتا رہا، 750 سے 1258 تک'
  - term:
      ar: هولاكو
      en: Hulagu
      ur: ہلاکو
    gloss:
      ar: 'القائد المغولي الذي حاصر المدينة وأنهى الخلافة سنة ١٢٥٨م'
      en: 'the Mongol leader who besieged the city and ended the caliphate in 1258'
      ur: 'منگول سردار جس نے شہر کا محاصرہ کیا اور 1258 میں خلافت ختم کی'
  - term:
      ar: العصر الذهبي
      en: the golden age
      ur: عہدِ زریں
    gloss:
      ar: 'العصر الذي ازدهرت فيه العلوم والفنون في ظل الخلفاء العباسيين الأوائل'
      en: 'the era when sciences and arts flourished under the early Abbasid caliphs'
      ur: 'وہ دور جب ابتدائی عباسی خلفاء کے زمانے میں علوم اور فنون پھل پھولے'
  - term:
      ar: الترجمة
      en: the translation
      ur: ترجمہ
    gloss:
      ar: 'النشاط الذي ملأ مكتبات بغداد بالكتب من لغات شتى'
      en: 'the activity that filled Baghdad''s libraries with books out of many tongues'
      ur: 'وہ سرگرمی جس نے بغداد کی لائبریریوں کو کئی زبانوں کی کتابوں سے بھر دیا'
  - term:
      ar: الخمسة قرون
      en: the five centuries
      ur: پانچ صدیاں
    gloss:
      ar: 'المدة التي بقيت فيها المدينة مركز الحضارة قبل السقوط'
      en: 'the span the city stayed the center of civilization before the fall'
      ur: 'وہ عرصہ جس میں شہر زوال سے پہلے تہذیب کا مرکز رہا'
  - term:
      ar: ١٢٥٨
      en: '1258'
      ur: '1258'
    gloss:
      ar: 'سنة السقوط المغولي التي أغلقت العصر العباسي في المدينة'
      en: 'the year of the Mongol fall that closed the Abbasid era in the city'
      ur: 'منگول زوال کا سال جس نے شہر میں عباسی دور بند کیا'
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: 'منصب القيادة العامة على المسلمين الذي كان مقرّه في المدينة'
      en: 'the office of general leadership over Muslims that was seated in the city'
      ur: 'مسلمانوں کی عمومی قیادت کا منصب جس کا مرکز یہ شہر تھا'
  - term:
      ar: الرقّة
      en: the Ruzafa quarter
      ur: رزافہ محلہ
    gloss:
      ar: 'الحي الذي نشأ على الضفة الشرقية لدجلة خارج سور المدينة المدوّرة'
      en: 'the quarter that grew on the Tigris''s east bank, outside the Round City''s wall'
      ur: 'وہ محلہ جو دجلہ کے مشرقی کنارے پر گول شہر کی دیوار سے باہر بنا'
  practice:
  - q:
      ar: من أسّس بغداد؟
      en: Who founded Baghdad?
      ur: بغداد کس نے بسایا؟
    options:
    - text:
        ar: المنصور عام ٧٦٢
        en: al-Mansur in 762
        ur: المنصور نے 762 میں
      correct: true
      why:
        ar: تنسبه المصادر إلى الخليفة العباسي الثاني
        en: the sources credit the second Abbasid caliph
        ur: ماخذ اسے دوسرے عباسی خلیفہ سے منسوب کرتے ہیں
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: كان هارون خليفة لاحقًا لا المؤسس
        en: Harun was a later caliph, not the founder
        ur: ہارون بعد کا خلیفہ تھا، بانی نہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين في القرن الثاني عشر لا المؤسس
        en: Saladin is twelfth-century, not the founder
        ur: صلاح الدین بارہویں صدی کا ہے، بانی نہیں
    - text:
        ar: عمر بن الخطاب
        en: Umar ibn al-Khattab
        ur: عمر بن خطاب
      correct: false
      why:
        ar: مات عمر قبل تأسيس بغداد بقرن
        en: Umar died a century before the founding
        ur: عمر کی وفات بغداد کے قیام سے ایک صدی پہلے ہوئی
  - q:
      ar: ماذا كان شكل بغداد الأول؟
      en: What was early Baghdad''s shape?
      ur: ابتدائی بغداد کی شکل کیا تھی؟
    options:
    - text:
        ar: دائرة كاملة
        en: a perfect circle
        ur: مکمل دائرہ
      correct: true
      why:
        ar: سُمّيت المدينة المدوّرة في المصادر
        en: the sources call it the Round City
        ur: ماخذ اسے گول شہر کہتے ہیں
    - text:
        ar: مربع
        en: a square
        ur: مربع
      correct: false
      why:
        ar: الشكل في الكتب دائري لا مربع
        en: the books give a circle, not a square
        ur: کتابوں میں شکل دائرہ ہے، مربع نہیں
    - text:
        ar: خط مستقيم
        en: a straight line
        ur: سیدھی لکیر
      correct: false
      why:
        ar: لم تكن بغداد خطًّا بل مدينة مغلقة
        en: Baghdad was not a line but an enclosed city
        ur: بغداد لکیر نہیں بلکہ بند شہر تھا
    - text:
        ar: مثلث
        en: a triangle
        ur: مثلث
      correct: false
      why:
        ar: المدينة المدوّرة لا مثلثة
        en: it was the Round City, not a triangle
        ur: یہ گول شہر تھا، مثلث نہیں
  - q:
      ar: ما دار الحكمة؟
      en: What was the House of Wisdom?
      ur: بیت الحکمت کیا تھا؟
    options:
    - text:
        ar: مركز الترجمة والعلم في العباسية
        en: the Abbasid centre of translation and learning
        ur: ترجمہ اور علم کا عباسی مرکز
      correct: true
      why:
        ar: جمع المترجمين والعلماء في بغداد
        en: it gathered translators and scholars in Baghdad
        ur: اس نے بغداد میں مترجمین اور علماء جمع کیے
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: دار الحكمة مؤسسة علم لا سكن
        en: it was a learned institution, not a residence
        ur: یہ علمی ادارہ تھا، رہائش نہیں
    - text:
        ar: سوق الكتب
        en: the book market
        ur: کتابوں کی مارکیٹ
      correct: false
      why:
        ar: كانت مركز ترجمة لا سوقًا
        en: it was a translation centre, not a market
        ur: یہ ترجمہ کا مرکز تھا، بازار نہیں
    - text:
        ar: مدرسة أطفال
        en: a children''s school
        ur: بچوں کا مدرسہ
      correct: false
      why:
        ar: جمعت العلماء لا الصغار
        en: it gathered scholars, not the young
        ur: اس میں علماء جمع ہوئے، بچے نہیں
  - q:
      ar: متى سقطت بغداد؟
      en: When did Baghdad fall?
      ur: بغداد کب گرا؟
    options:
    - text:
        ar: عام ١٢٥٨ في أيدي المغول
        en: in 1258 to the Mongols
        ur: 1258 میں مغولوں کے ہاتھوں
      correct: true
      why:
        ar: تذكر المصادر تدمير هولاكو للمدينة ١٢٥٨
        en: the sources date Hulagu''s destruction to 1258
        ur: ماخذ ہلاکو کی تباہی 1258 لکھتے ہیں
    - text:
        ar: عام ١٠٩٥
        en: in 1095
        ur: 1095 میں
      correct: false
      why:
        ar: ذلك عام الحروب الصليبية لا سقوط بغداد
        en: that is the Crusades year, not Baghdad''s fall
        ur: یہ صلیبی جنگوں کا سال ہے، بغداد کے گرنے کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية لا سقوط بغداد
        en: that is Constantinople''s fall, not Baghdad''s
        ur: یہ قسطنطنیہ کے گرنے کا سال ہے، بغداد کا نہیں
    - text:
        ar: لم تسقط أبدًا
        en: it never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت المدينة للمغول في ١٢٥٨
        en: the city fell to the Mongols in 1258
        ur: شہر 1258 میں مغولوں کے ہاتھ گرا
  - q:
      ar: ما العصر الذهبي؟
      en: What was the golden age?
      ur: عہدِ زریں کیا تھا؟
    options:
    - text:
        ar: زمن الذروة العلمية في بغداد
        en: Baghdad''s peak age of learning
        ur: بغداد کی علمی بلندی کا زمانہ
      correct: true
      why:
        ar: ازدهرت الرياضيات والفلك والطب والجغرافيا
        en: mathematics, astronomy, medicine and geography flourished
        ur: ریاضی، فلکیات، طب اور جغرافیہ پھلے پھولے
    - text:
        ar: عصر الجاهلية
        en: the age of ignorance
        ur: جاہلیت کا دور
      correct: false
      why:
        ar: الجاهلية قبل الإسلام لا العصر الذهبي
        en: the Jahiliyya is pre-Islamic, not the golden age
        ur: جاہلیت اسلام سے پہلے کی ہے، عہدِ زریں نہیں
    - text:
        ar: القرن العشرين
        en: the twentieth century
        ur: بیسویں صدی
      correct: false
      why:
        ar: العصر الذهبي في العصور الوسطى
        en: the golden age is medieval, not modern
        ur: عہدِ زریں قرونِ وسطی کا ہے، جدید نہیں
    - text:
        ar: زمن الفتح الأول
        en: the time of the first conquests
        ur: پہلی فتوحات کا زمانہ
      correct: false
      why:
        ar: العصر الذهبي في العباسية لا الفتوحات
        en: the golden age is Abbasid, not the conquests
        ur: عہدِ زریں عباسی ہے، فتوحات نہیں
  - q:
      ar: ماذا فعل هولاكو بالكتب؟
      en: What did Hulagu do to the books?
      ur: ہلاکو نے کتابوں کا کیا کیا؟
    options:
    - text:
        ar: طرحها في النهر
        en: cast them into the river
        ur: دریا میں پھینکے
      correct: true
      why:
        ar: تذكر المصادر رمي الكتب في دجلة
        en: the sources record the books thrown into the Tigris
        ur: ماخذ کتابوں کے دجلہ میں پھینکے جانے کا ذکر کرتے ہیں
    - text:
        ar: بناها مكتبة
        en: he built them a library
        ur: ان کے لیے کتب خانہ بنایا
      correct: false
      why:
        ar: دمّر المدينة لا بناها مكتبة
        en: he destroyed the city, not built it a library
        ur: اس نے شہر تباہ کیا، کتب خانہ نہیں بنایا
    - text:
        ar: أرسلها إلى الصين
        en: he sent them to China
        ur: چین بھیجے
      correct: false
      why:
        ar: الكتب طرحت في دجلة لا أرسلت
        en: the books were cast into the river, not sent
        ur: کتابیں دریا میں پھینکی گئیں، بھیجی نہیں گئیں
    - text:
        ar: حفظها في خزانة
        en: he stored them in a treasury
        ur: خزانے میں محفوظ کیے
      correct: false
      why:
        ar: فقدت الكتب في النهر لا حُفظت
        en: the books were lost to the river, not stored
        ur: کتابیں دریا میں ضائع ہوئیں، محفوظ نہیں ہوئیں
  - q:
      ar: على أيّ نهر قامت بغداد؟
      en: On which river does Baghdad stand?
      ur: بغداد کس دریا پر قائم ہے؟
    options:
    - text:
        ar: دجلة
        en: the Tigris
        ur: دجلہ
      correct: true
      why:
        ar: تقف المدينة على ضفاف دجلة في المصادر
        en: the sources place the city on the Tigris banks
        ur: ماخذ شہر کو دجلہ کے کنارے رکھتے ہیں
    - text:
        ar: النيل
        en: the Nile
        ur: نیل
      correct: false
      why:
        ar: النيل في مصر لا العراق
        en: the Nile is in Egypt, not Iraq
        ur: نیل مصر میں ہے، عراق میں نہیں
    - text:
        ar: الفرات
        en: the Euphrates
        ur: فرات
      correct: false
      why:
        ar: الفرات قريب لكن المدينة على دجلة
        en: the Euphrates is near, but the city is on the Tigris
        ur: فرات قریب ہے مگر شہر دجلہ پر ہے
    - text:
        ar: الأردن
        en: the Jordan
        ur: اردن
      correct: false
      why:
        ar: الأردن في الشام لا العراق
        en: the Jordan is in Syria, not Iraq
        ur: اردن شام میں ہے، عراق میں نہیں
  - q:
      ar: لماذا اشتهرت بغداد؟
      en: Why is Baghdad famous?
      ur: بغداد کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت بيت الحكمة للبشر في زمنها
        en: because it was the world''s house of wisdom in its time
        ur: کیونکہ یہ اپنے زمانے میں دنیا کا بیت الحکمت تھا
      correct: true
      why:
        ar: جمعت العلم والترجمة والتجارة في ذروة
        en: it gathered learning, translation and trade at a peak
        ur: اس نے علم، ترجمہ اور تجارت کو بلندی پر جمع کیا
    - text:
        ar: لأنها كانت أول مدينة في التاريخ
        en: because it was history''s first city
        ur: کیونکہ یہ تاریخ کا پہلا شہر تھا
      correct: false
      why:
        ar: سبقتها مدن كثيرة في التاريخ
        en: many cities predate it in history
        ur: اس سے پہلے بہت سے شہر تھے
    - text:
        ar: لأنها لم تسقط أبدًا
        en: because it never fell
        ur: کیونکہ یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت في ١٢٥٨
        en: it fell in 1258
        ur: یہ 1258 میں گرا
    - text:
        ar: لأنها كانت عاصمة الأمويين
        en: because it was the Umayyad capital
        ur: کیونکہ یہ امویوں کا دارالحکومت تھا
      correct: false
      why:
        ar: الأمويون حكموا من دمشق لا بغداد
        en: the Umayyads ruled from Damascus, not Baghdad
        ur: امویوں نے دمشق سے حکومت کی، بغداد سے نہیں
  - q:
      ar: كم دامت بغداد عاصمة؟
      en: How long was Baghdad a capital?
      ur: بغداد کتنی دیر دارالحکومت رہا؟
    options:
    - text:
        ar: نحو خمسة قرون
        en: about five centuries
        ur: تقریباً پانچ صدیاں
      correct: true
      why:
        ar: من ٧٦٢ إلى ١٢٥٨ خمسة قرون تقريبًا
        en: from 762 to 1258 is about five centuries
        ur: 762 سے 1258 تک تقریباً پانچ صدیاں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة حكمها
        en: fifty is far short of its rule
        ur: پچاس اس کی حکمرانی کے عرصے سے کہیں کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: لم يصل حكمها إلى ألف
        en: its rule did not reach a thousand
        ur: اس کی حکمرانی ہزار تک نہیں پہنچی
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة مدة خلافة واحدة قصيرة
        en: ten is the span of one short caliphate
        ur: دس ایک مختصر خلافت کا عرصہ ہے
  - q:
      ar: ماذا ترجمت دار الحكمة؟
      en: What did the House of Wisdom translate?
      ur: بیت الحکمت نے کیا ترجمہ کیا؟
    options:
    - text:
        ar: علوم اليونان وفارس والهند إلى العربية
        en: Greek, Persian and Indian learning into Arabic
        ur: یونانی، فارسی اور ہندوستانی علم کا عربی میں
      correct: true
      why:
        ar: نقلت الحضارات القديمة إلى لغة العلم العربية
        en: it carried ancient civilizations into scholarly Arabic
        ur: اس نے قدیم تہذیبوں کو علمی عربی میں منتقل کیا
    - text:
        ar: القرآن إلى الفرنسية
        en: the Quran into French
        ur: قرآن کا فرانسیسی میں
      correct: false
      why:
        ar: كانت الترجمة من اللغات القديمة إلى العربية
        en: the translation was from ancient languages into Arabic
        ur: ترجمہ قدیم زبانوں سے عربی میں تھا
    - text:
        ar: الأدب الفرنسي
        en: French literature
        ur: فرانسیسی ادب
      correct: false
      why:
        ar: لم تكن الفرنسية في مصادر الترجمة
        en: French was not among the translation sources
        ur: فرانسیسی ترجمے کے ماخذ میں نہیں تھی
    - text:
        ar: لا شيء؛ كانت للعبادة
        en: nothing; it was for worship
        ur: کچھ نہیں؛ یہ عبادت کے لیے تھی
      correct: false
      why:
        ar: دار الحكمة مؤسسة علم لا عبادة
        en: it was a learning institution, not worship
        ur: یہ علمی ادارہ تھا، عبادت نہیں
- id: mecca
  anchor: place/mecca
  band: scholars
  title:
    ar: مكة
    en: Mecca
    ur: مکہ
  sixty:
    ar: 'مكة أم القرى: فيها الكعبة بيت الله، وإليها تتوجّه الصلوات في كل أرض، ومنها خرجت الدعوة الإسلامية. كانت قبل الإسلام مركز التجارة الحجازي وعُرفت بقوافل الشتاء والصيف، وبئر زمزم التي لا تنضب منذ إبراهيم. من جبل النور فوقها نزل الوحي أول مرة، ومنها هاجر النبي إلى يثرب، وإليها عاد فاتحًا سنة ٦٣٠م. اليوم يقصدها ملايين الحجاج في ذي الحجة والعمرة طوال العام، وتظل حكمها للمسلمين: لا يدخلها إلا المسلم. مدينة تجمع الجغرافيا والتاريخ والقلب في موضع واحد. وهي اليوم كما كانت: قلب الأمة الذي تنبض إليه الأيام، وأمّ المدن التي تنتظرها العيون في كل أذان. وتلك الأيام التي تحفظها الذاكرة — أول وحي، وخروج، وعودة — جعلت مكة لا مدينةً تُزَار بل زمّنًا يُعاش مرة أخرى في كل موسم. فيها وُلدت الدعوة، ومنها انطلقت إلى الدنيا، وإليها يعود الحجاج كل عام فيقولون لبّيك: حاضرون بين يديك.'
    en: 'Mecca, Mother of Towns — it holds the Kaaba, God''s House, toward which prayers turn in every land, and from which the Islamic call went out. Before Islam it was the Hijaz''s trade hub, known for the winter and summer caravans, and for Zamzam, the well that has not dried since Abraham''s days. From the Mount of Light above it the revelation first came down; from it the Prophet migrated to Yathrib; to it he returned a conqueror in 630. Today millions come for the Hajj in Dhu al-Hijja and for umrah through the year, and its precinct stays Muslims-only. A city joining geography, history and the heart in one spot. And it is today as it ever was: the ummah Few cities hold so much in so little ground: a house, a well, a cave, and the memory of twenty-three years that remade the world.''s heart the days beat toward, the mother of cities toward which every call to prayer gazes.'
    ur: 'مکہ، ام القری — اس میں خدا کا گھر کعبہ ہے جس کی طرف دنیا بھر میں نمازیں پڑھی جاتی ہیں اور جہاں سے اسلامی دعوت نکلی۔ اسلام سے پہلے یہ حجاز کا تجارتی مرکز تھا، موسم سرما و گرما کے قافلوں اور زمزم کے ایسے چشمے کے لیے مشہور جو ابراہیم کے زمانے سے خشک نہیں ہوا۔ اس کے اوپر کوہِ نور سے وحی پہلی بار نازل ہوئی؛ یہاں سے نبی یثرب ہجرت کی؛ اور 630ء میں فاتح بن کر واپس آئے۔ آج ذوالحجہ میں لاکھوں حجاج اور سارے سال معتمر آتے ہیں، اور اس کا حرم صرف مسلمانوں کے لیے ہے۔ وہ شہر جو جغرافیہ، تاریخ اور دل کو ایک جگہ جوڑتا ہے۔ اور آج بھی وہ ویسی ہی ہے: امت کا دل جس کی طرف دن دھڑکتے ہیں، شہروں کی ماں جسے ہر اذان دیکھتی ہے۔'
  glossary:
  - term:
      ar: الكعبة
      en: the Kaaba
      ur: کعبہ
    gloss:
      ar: 'بيت الله في قلب مكة الذي تتجه إليه الصلوات والحج'
      en: 'God''s House at Mecca''s heart, toward which every prayer and every Hajj turns'
      ur: 'اللہ کا گھر مکہ کے دل میں، جس کی طرف نمازیں اور حج مڑتے ہیں'
  - term:
      ar: زمزم
      en: Zamzam
      ur: زمزم
    gloss:
      ar: 'البئر في المسجد الحرام التي سقت الحجاج منذ أيام إبراهيم'
      en: 'the well inside the Grand Mosque that has watered pilgrims since the days of Abraham'
      ur: 'مسجدِ حرام کا وہ کنواں جو ابراہیم کے زمانے سے حاجیوں کو پانی دیتا آیا ہے'
  - term:
      ar: الحجاز
      en: the Hijaz
      ur: حجاز
    gloss:
      ar: 'إقليم الجزيرة الغربي وفيه مكة والمدينة والطائف'
      en: 'the peninsula''s western region, holding Mecca, Medina and Taif'
      ur: 'جزیرے کا مغربی خطہ جس میں مکہ، مدینہ اور طائف ہیں'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الجهة التي يصلّي إليها المسلمون في كل مكان — الكعبة نفسها'
      en: 'the direction Muslims pray toward everywhere on earth — the Kaaba itself'
      ur: 'وہ سمت جس کی طرف مسلمان ہر جگہ نماز پڑھتے ہیں — خود کعبہ'
  - term:
      ar: غار حراء
      en: the cave of Hira
      ur: غارِ حرا
    gloss:
      ar: 'الغار في جبل النور حيث بدأ الوحي ينزل على النبي'
      en: 'the cave on the Mount of Light where the revelation began to descend on the Prophet'
      ur: 'کوہِ نور کی غار جہاں نبی پر وحی کا نزول شروع ہوا'
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'رحلة النبي إلى يثرب التي بدأت بها دولة المدينة والتقويم'
      en: 'the Prophet''s journey out to Yathrib, which began the Medina state and the calendar'
      ur: 'نبی کا یثرب کا سفر جس سے مدینہ کی ریاست اور تقویم کا آغاز ہوا'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الرحلة الكبرى إلى الكعبة التي تلزم كل مسلم قادر مرة في العمر'
      en: 'the great journey to the Kaaba every able Muslim owes once in a lifetime'
      ur: 'کعبہ کا وہ عظیم سفر جو ہر قادر مسلمان پر عمر میں ایک بار فرض ہے'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'قبيلة مكة الحاكمة التي قادت قوافلها وكانت تحمل مفاتيح حرمها'
      en: 'Mecca''s ruling tribe, which led its caravans and held the keys of its sanctuary'
      ur: 'مکہ کا حکمران قبیلہ جو اس کے قافلے چلاتا اور حرم کی کنجیاں رکھتا تھا'
  - term:
      ar: الفتح
      en: the conquest
      ur: فتح
    gloss:
      ar: 'دخول النبي المنتصر سنة ٦٣٠م وتطهير الكعبة من أصنامها'
      en: 'the Prophet''s victorious entry in 630 and the cleansing of the Kaaba''s idols'
      ur: 'نبی کی 630 میں فاتحانہ آمد اور کعبہ کے بتوں کی صفائی'
  - term:
      ar: القوافل
      en: the caravans
      ur: قافلے
    gloss:
      ar: 'رحلات التجارة التي اشتهرت بها قريش — رحلة الشتاء والصيف'
      en: 'the trade journeys Quraysh was known for — the winter and the summer caravans'
      ur: 'وہ تجارتی سفر جن کے لیے قریش مشہور تھا — سردیوں اور گرمیوں کے قافلے'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'شهر الصيام الذي تمتلئ فيه المدينة المقدسة أيضًا بالمعتمرين'
      en: 'the month of fasting, when the holy city also fills with pilgrims performing umrah'
      ur: 'روزوں کا مہینہ جب مقدس شہر عمرہ کرنے والوں سے بھی بھر جاتا ہے'
  - term:
      ar: ذو الحجة
      en: Dhu al-Hijja
      ur: ذوالحجہ
    gloss:
      ar: 'شهر الحج الذي تُؤدّى فيه مناسك الحج الكبرى حول المدينة'
      en: 'the pilgrimage month, in which the great Hajj rites are performed around the city'
      ur: 'حج کا مہینہ جس میں شہر کے گرد حج کے عظیم مناسک ادا ہوتے ہیں'
  practice:
  - q:
      ar: ما الذي يتجه إليه المسلمون في صلاتهم؟
      en: What do Muslims face in prayer?
      ur: مسلمان نماز میں کس طرف رخ کرتے ہیں؟
    options:
    - text:
        ar: الكعبة في مكة
        en: the Kaaba in Mecca
        ur: مکہ میں کعبہ
      correct: true
      why:
        ar: الكعبة قبلة الصلوات الخمس في الكتب
        en: the Kaaba is the five prayers'' qibla in the books
        ur: کعبہ کتابوں میں پانچ نمازوں کا قبلہ ہے
    - text:
        ar: القدس دائمًا
        en: always Jerusalem
        ur: ہمیشہ بیت المقدس
      correct: false
      why:
        ar: كانت القدس القبلة الأولى ثم حُوّلت
        en: Jerusalem was the first qibla, then it changed
        ur: بیت المقدس پہلا قبلہ تھا، پھر بدل گیا
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة مركز الدولة لا القبلة
        en: Medina is the polity''s centre, not the qibla
        ur: مدینہ ریاست کا مرکز ہے، قبلہ نہیں
    - text:
        ar: لا اتجاه
        en: no direction
        ur: کوئی سمت نہیں
      correct: false
      why:
        ar: القبلة جزء من الصلاة
        en: the qibla is part of the prayer
        ur: قبلہ نماز کا حصہ ہے
  - q:
      ar: على ماذا قامت مكة اقتصاديًّا؟
      en: What did Mecca''s economy stand on?
      ur: مکہ کی معیشت کس پر قائم تھی؟
    options:
    - text:
        ar: تجارة القوافل
        en: the caravan trade
        ur: قافلہ تجارت
      correct: true
      why:
        ar: جمعت قريش تجارة الشام واليمن
        en: Quraysh gathered the Syria-Yemen trade
        ur: قریش نے شام اور یمن کی تجارت جمع کی
    - text:
        ar: الزراعة الواسعة
        en: vast farming
        ur: وسیع کھیتی
      correct: false
      why:
        ar: مكة وادٍ غير زراعي في المصادر
        en: Mecca is an un-farmed valley in the sources
        ur: مکہ ماخذ میں غیر زرعی وادی ہے
    - text:
        ar: صيد السمك
        en: fishing
        ur: مچھلی پکڑنا
      correct: false
      why:
        ar: مكة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے، ساحلی نہیں
    - text:
        ar: التعدين
        en: mining
        ur: کان کنی
      correct: false
      why:
        ar: لم تشتهر مكة بالتعدين بل بالتجارة
        en: Mecca was known for trade, not mining
        ur: مکہ کان کنی نہیں بلکہ تجارت کے لیے مشہور تھا
  - q:
      ar: أين بدأ الوحي في مكة؟
      en: Where in Mecca did revelation begin?
      ur: مکہ میں وحی کہاں شروع ہوئی؟
    options:
    - text:
        ar: غار حراء
        en: the cave of Hira
        ur: غارِ حرا
      correct: true
      why:
        ar: تذكر المصادر الغار على جبل النور
        en: the sources name the cave on the Mount of Light
        ur: ماخذ کوہِ نور پر غار کا ذکر کرتے ہیں
    - text:
        ar: داخل الكعبة
        en: inside the Kaaba
        ur: کعبہ کے اندر
      correct: false
      why:
        ar: كان الوحي في الغار لا في البيت
        en: revelation was in the cave, not the House
        ur: وحی غار میں آئی، گھر میں نہیں
    - text:
        ar: في المسجد الحرام
        en: in the Grand Mosque
        ur: مسجدِ حرام میں
      correct: false
      why:
        ar: كان بدء الوحي على الجبل لا في المسجد
        en: the start was on the mountain, not the mosque
        ur: آغاز پہاڑ پر تھا، مسجد میں نہیں
    - text:
        ar: في السوق
        en: in the market
        ur: بازار میں
      correct: false
      why:
        ar: لم يكن الوحي في السوق
        en: revelation was not in the market
        ur: وحی بازار میں نہیں آئی
  - q:
      ar: متى عاد المسلمون إلى مكة؟
      en: When did Muslims return to Mecca?
      ur: مسلمان مکہ کب واپس آئے؟
    options:
    - text:
        ar: عام ٦٣٠ فاتحين
        en: in 630 as conquerors
        ur: 630 میں فاتح کے طور پر
      correct: true
      why:
        ar: الفتح في رمضان ٨هـ
        en: the conquest in Ramadan 8 AH
        ur: فتح رمضان 8 ہجری میں
    - text:
        ar: لم يعودوا أبدًا
        en: they never returned
        ur: وہ کبھی واپس نہیں آئے
      correct: false
      why:
        ar: عادوا عام ٦٣٠ في الفتح
        en: they returned in 630 at the conquest
        ur: وہ 630 میں فتح میں واپس آئے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام خروجهم لا عودتهم
        en: that is the year they left, not returned
        ur: یہ ان کے نکلنے کا سال ہے، واپسی کا نہیں
    - text:
        ar: في القرن العاشر
        en: in the tenth century
        ur: دسویں صدی میں
      correct: false
      why:
        ar: الفتح في القرن السابع
        en: the conquest is seventh-century
        ur: فتح ساتویں صدی میں ہے
  - q:
      ar: ما زمزم؟
      en: What is Zamzam?
      ur: زمزم کیا ہے؟
    options:
    - text:
        ar: ماء مكة المشهور
        en: Mecca''s famous water
        ur: مکہ کا مشہور پانی
      correct: true
      why:
        ar: قامت المدينة على ماء زمزم في الذاكرة
        en: the city stood on Zamzam water in memory
        ur: شہر یادداشت میں زمزم کے پانی پر قائم تھا
    - text:
        ar: جبل قرب مكة
        en: a mountain near Mecca
        ur: مکہ کے قریب پہاڑ
      correct: false
      why:
        ar: زمزم بئر لا جبل
        en: Zamzam is a well, not a mountain
        ur: زمزم کنواں ہے، پہاڑ نہیں
    - text:
        ar: قبيلة من مكة
        en: a Meccan tribe
        ur: مکہ کا قبیلہ
      correct: false
      why:
        ar: زمزم ماء لا قبيلة
        en: Zamzam is water, not a tribe
        ur: زمزم پانی ہے، قبیلہ نہیں
    - text:
        ar: سوق مكة
        en: Mecca''s market
        ur: مکہ کا بازار
      correct: false
      why:
        ar: زمزم ماء لا سوق
        en: Zamzam is water, not a market
        ur: زمزم پانی ہے، بازار نہیں
  - q:
      ar: في أيّ شهر يكون الحج؟
      en: In which month is the Hajj?
      ur: حج کس مہینے میں ہوتا ہے؟
    options:
    - text:
        ar: ذو الحجة
        en: Dhu al-Hijja
        ur: ذوالحجہ
      correct: true
      why:
        ar: الحج في الشهر الثاني عشر الهجري
        en: Hajj is in the twelfth Hijri month
        ur: حج ہجری سال کے بارہویں مہینے میں ہے
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: false
      why:
        ar: رمضان شهر الصوم لا الحج
        en: Ramadan is the fasting month, not Hajj
        ur: رمضان روزے کا مہینہ ہے، حج کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الحج
        en: Muharram opens the year, not Hajj
        ur: محرم سال کا پہلا مہینہ ہے، حج کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب شهر حرام لا شهر الحج
        en: Rajab is sacred, not the Hajj month
        ur: رجب حرام مہینہ ہے، حج کا نہیں
  - q:
      ar: من كانت قريش؟
      en: Who were the Quraysh?
      ur: قریش کون تھے؟
    options:
    - text:
        ar: قبيلة مكة الحاكمة وقبيلة النبي
        en: Mecca''s ruling tribe and the Prophet''s own
        ur: مکہ کا حکمران قبیلہ اور نبی کا قبیلہ
      correct: true
      why:
        ar: من قريش كان النبي ومنها خرج
        en: the Prophet came from Quraysh and left it
        ur: نبی قریش سے تھے اور اسی سے نکلے
    - text:
        ar: قبيلة من يثرب
        en: a Yathrib tribe
        ur: یثرب کا قبیلہ
      correct: false
      why:
        ar: قريش في مكة لا يثرب
        en: Quraysh is Meccan, not Yathribi
        ur: قریش مکہ کا ہے، یثرب کا نہیں
    - text:
        ar: جيش الفرنجة
        en: the Frankish army
        ur: فرنگی لشکر
      correct: false
      why:
        ar: الفرنجة جاءت بعد قرون
        en: the Franks came centuries later
        ur: فرنگی صدیوں بعد آئے
    - text:
        ar: ملوك فارس
        en: Persian kings
        ur: فارسی بادشاہ
      correct: false
      why:
        ar: قريش قبيلة عربية لا فارسية
        en: Quraysh is an Arab tribe, not Persian
        ur: قریش عرب قبیلہ ہے، فارسی نہیں
  - q:
      ar: لماذا سمّيت مكة مقدسة؟
      en: Why is Mecca called sacred?
      ur: مکہ کو مقدس کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: للبيت الكعبة ومكان الوحي في الذاكرة
        en: for the Kaaba and revelation''s place in memory
        ur: کعبہ اور وحی کے مقام کی وجہ سے، یادداشت میں
      correct: true
      why:
        ar: تجمع المصادر بيت الله وبدء الرسالة فيها
        en: the sources join God''s House and the message''s start there
        ur: ماخذ اس میں اللہ کا گھر اور پیغام کا آغاز جوڑتے ہیں
    - text:
        ar: لأنها أكبر مدينة في العالم
        en: because it is the world''s largest city
        ur: کیونکہ یہ دنیا کا سب سے بڑا شہر ہے
      correct: false
      why:
        ar: لم تكن أكبر مدن العالم في أيّ زمن
        en: it was never the world''s largest city
        ur: یہ کسی زمانے میں دنیا کا سب سے بڑا شہر نہیں تھا
    - text:
        ar: لأنها على البحر
        en: because it is on the sea
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: مكة داخلية لا بحرية
        en: Mecca is inland, not coastal
        ur: مکہ اندرونِ ملک ہے
    - text:
        ar: لأنها عاصمة الخلافة
        en: because it was the caliphate capital
        ur: کیونکہ یہ خلافت کا دارالحکومت تھا
      correct: false
      why:
        ar: الخلافة كانت في المدينة ثم دمشق ثم بغداد
        en: the caliphate sat in Medina, then Damascus, then Baghdad
        ur: خلافت مدینہ، پھر دمشق، پھر بغداد میں رہی
  - q:
      ar: ماذا فعل المسلمون في مكة عام ٦٣٠؟
      en: What did Muslims do in Mecca in 630?
      ur: 630 میں مسلمانوں نے مکہ میں کیا کیا؟
    options:
    - text:
        ar: دخلوها فاتحين وهدّموا الأصنام
        en: they entered as conquerors and brought down the idols
        ur: فاتح کے طور پر داخل ہوئے اور بت گرائے
      correct: true
      why:
        ar: الفتح وإزالة الأصنام في المصادر
        en: the conquest and removing the idols in the sources
        ur: فتح اور بتوں کے ہٹائے جانے کا ذکر ماخذ میں
    - text:
        ar: بنوا الكعبة
        en: they built the Kaaba
        ur: انہوں نے کعبہ بنایا
      correct: false
      why:
        ar: الكعبة أقدم من الفتح بقرون
        en: the Kaaba predates the conquest by centuries
        ur: کعبہ فتح سے صدیوں پرانا ہے
    - text:
        ar: أحرقوا المدينة
        en: they burned the city
        ur: انہوں نے شہر جلایا
      correct: false
      why:
        ar: سلّمت مكة بلا حريق في المصادر
        en: Mecca yielded without burning in the sources
        ur: ماخذ میں مکہ نے بغیر جلائے ہتھیار ڈالے
    - text:
        ar: هاجروا منها
        en: they migrated from it
        ur: انہوں نے وہاں سے ہجرت کی
      correct: false
      why:
        ar: الهجرة كانت ٦٢٢ لا ٦٣٠
        en: the migration was 622, not 630
        ur: ہجرت 622 میں تھی، 630 میں نہیں
  - q:
      ar: من كتب عن مكة؟
      en: Who wrote about Mecca?
      ur: مکہ کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون وجغرافيون ورحّالة من العصور كلها
        en: historians, geographers and travellers of every age
        ur: ہر دور کے مؤرخین، جغرافیہ دان اور سیاح
      correct: true
      why:
        ar: تصلنا وصف مكة من الأزرقي إلى الرحّالة
        en: accounts of Mecca reach us from al-Azraqi to the travellers
        ur: ازرقی سے سیاحوں تک مکہ کی وصف ہم تک پہنچی
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عن مكة قبل أوروبا بقرون
        en: Muslims wrote about Mecca centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے مکہ کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: مكة من أكثر المدن وصفًا في الكتب
        en: Mecca is among the most-described cities in books
        ur: مکہ کتابوں میں سب سے زیادہ بیان شدہ شہروں میں ہے
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: الصليبيون كتبوا عن الشام لا مكة
        en: the Crusaders wrote of Syria, not Mecca
        ur: صلیبیوں نے شام کے بارے میں لکھا، مکہ کے بارے میں نہیں
- id: medina
  anchor: place/medina
  band: scholars
  title:
    ar: المدينة
    en: Medina
    ur: مدینہ
  sixty:
    ar: 'يثرب التي صارت المدينة: قبل الهجرة كانت واحة يتنازعها الأوس والخزرج، وبعدها صارت قلب أول دولة مسلمة. فيها بُني مسجد النبي، وكتبت وثيقتها تسوّي بين المسلمين واليهود وسائر القبائل، ومنها انطلقت السرايا والغزوات: بدر وأحد والخندق. ظلت عاصمة الخلفاء الراشدين ثلاثين سنة حتى انتقلت الخلافة إلى الكوفة فدمشق. وأهلها الأنصار الذين آووا المهاجرين صاروا نموذج النصرة في القرآن. اليوم تبقى المدينة ثاني الحرمين، يزورها المسلمون للصلاة في مسجد النبي وزيارة قبره، ويحمل اسمها معنى التحوّل: بلدة منقسمة صارت أمّة. ومنها تعلّمت الأمة أن الدولة تُبنى بالوثيقة قبل الجيش، وأن الجوار يسبق العرق، وأن الرحمة تقود الدعوة. وبقيت المدينة بعد رحيله بيتَ السنة: فيها دُوّنت الحياةُ اليومية للمسلم الأول، ومنها نُقلت للأجيال صورةُ عيشٍ كامل. وعلى أرضها دروس كل عصر: الأخوة قبل النسب، والعقد قبل السيف، والبيت قبل القصر.'
    en: 'Yathrib that became Medina — before the Hijra it was an oasis contested by Aws and Khazraj; afterwards it became the heart of the first Muslim state. Here the Prophet''s mosque was built, and its charter written, equalizing Muslims, Jews and the other tribes; from here the raids went out — Badr, Uhud, the Trench. It stayed the Rightly Guided caliphs'' capital thirty years, until rule passed to Kufa, then Damascus. Its Ansar who sheltered the emigrants became the Qur''an''s model of support. Today Medina remains the second sanctuary: Muslims come to pray in the Prophet''s mosque and visit his grave. Its name carries the meaning of transformation — a divided town that became an ummah. From it the ummah learned that a state is built by charter before army, that neighborliness comes before blood, and that mercy leads the call.'
    ur: 'یثرب جو مدینہ بنی — ہجرت سے پہلے اوس اور خزرج کے باہم جھگڑتے نخلستان تھی؛ بعد میں پہلی مسلم ریاست کا دل بنی۔ یہاں نبی کی مسجد بنی اور اس کا میثاق لکھا گیا جو مسلمانوں، یہود اور قبائل کے حق برابر رکھتا تھا؛ یہاں سے مہمات نکلیں — بدر، احد، خندق۔ تیس برس خلفائے راشدین کا دارالحکومت رہی پھر حکومت کوفہ اور دمشق منتقل ہوئی۔ اس کے انصار جنھوں نے مہاجرین کو پناہ دی قرآن میں نصرت کا نمونہ بنے۔ آج مدینہ دوسرا حرم ہے: مسلمان نبی کی مسجد میں نماز اور ان کی قبر کی زیارت آتے ہیں۔ اس کا نام تبدیلی کا مفہوم رکھتا ہے — بٹا ہوا قصبہ جو امت بنا۔ اسی سے امت نے سیکھا کہ ریاست فوج سے پہلے میثاق سے بنتی ہے، ہمسایگی خون سے پہلے آتی ہے، اور رحمت دعوت کی قیادت کرتی ہے۔'
  glossary:
  - term:
      ar: يثرب
      en: Yathrib
      ur: یثرب
    gloss:
      ar: 'اسم المدينة القديم قبل أن تُسمّى مدينة النبي'
      en: 'the city''s old name before it came to be called the Prophet''s city'
      ur: 'شہر کا پرانا نام اس سے پہلے کہ اسے شہرِ نبی کہا جانے لگا'
  - term:
      ar: المسجد النبوي
      en: the Prophet''s mosque
      ur: مسجدِ نبوی
    gloss:
      ar: 'أول مسجد في المدينة — بجانبه يرقد النبي وإليه يقصد الزائرون'
      en: 'the city''s first mosque — beside which the Prophet lies, and which visitors seek'
      ur: 'شہر کی پہلی مسجد — جس کے پاس نبی آرام فرما ہے اور زائرین اسے تلاشتے ہیں'
  - term:
      ar: وثيقة المدينة
      en: the Constitution of Medina
      ur: میثاقِ مدینہ
    gloss:
      ar: 'الوثيقة المكتوبة التي حدّدت حقوق المسلمين واليهود وبقية القبائل معًا'
      en: 'the written document that set the rights of Muslims, Jews and the remaining tribes together'
      ur: 'تحریری دستاویز جس نے مسلمانوں، یہودیوں اور باقی قبائل کے حقوق مل کر طے کیے'
  - term:
      ar: الأنصار
      en: the Ansar
      ur: انصار
    gloss:
      ar: 'أهل يثرب الذين نصروا المهاجرين فصاروا رمز النصرة'
      en: 'the people of Yathrib who aided the emigrants and became the emblem of support'
      ur: 'یثرب کے لوگ جنہوں نے مہاجرین کی مدد کی اور نصرت کی علامت بن گئے'
  - term:
      ar: المهاجرون
      en: the migrants
      ur: مہاجرین
    gloss:
      ar: 'المكيون الذين تركوا بيوتهم وهاجروا إلى المدينة من أجل الدين'
      en: 'the Meccans who left their homes and migrated to Medina for the faith'
      ur: 'مکہ کے لوگ جنہوں نے دین کے لیے گھر چھوڑے اور مدینہ ہجرت کیے'
  - term:
      ar: الخلافة
      en: the caliphate
      ur: خلافت
    gloss:
      ar: 'منصب الحكم العام الذي بقي مقرّه في المدينة ثلاثين سنة'
      en: 'the office of general rule that stayed seated in Medina for thirty years'
      ur: 'عمومی حکومت کا منصب جو تیس برس مدینہ میں قائم رہا'
  - term:
      ar: الكوفة
      en: Kufa
      ur: کوفہ
    gloss:
      ar: 'المدينة العراقية التي انتقلت إليها الخلافة في عهد علي'
      en: 'the Iraqi garrison city to which the caliphate moved under Ali'
      ur: 'عراقی شہر جہاں علی کے عہد میں خلافت منتقل ہوئی'
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: 'المدينة الشامية التي صارت عاصمة الأمويين بعد ثلاثين سنة مدينية'
      en: 'the Syrian city that became the Umayyad capital after Medina''s thirty years'
      ur: 'شامی شہر جو مدینہ کے تیس سال بعد امویوں کا دارالحکومت بنا'
  - term:
      ar: الحرمان
      en: the two sanctuaries
      ur: دونوں حرم
    gloss:
      ar: 'مكة والمدينة معًا — أقدس حرمين في الإسلام'
      en: 'Mecca and Medina together — Islam''s two holiest precincts'
      ur: 'مکہ اور مدینہ مل کر — اسلام کے دو مقدس ترین حرم'
  - term:
      ar: السرايا
      en: the expeditions
      ur: مہمات
    gloss:
      ar: 'البعوث الصغيرة التي أرسلها النبي من المدينة دون أن يخرج معها'
      en: 'the small missions the Prophet sent out from Medina without joining them'
      ur: 'چھوٹی مہمات جو نبی نے مدینہ سے بھیجیں اور خود ساتھ نہ گئے'
  - term:
      ar: ٦٢٢
      en: '622'
      ur: '622'
    gloss:
      ar: 'سنة الهجرة التي بدأت بها التقويم الهجري والدولة'
      en: 'the year of the Hijra, which began both the Hijri calendar and the state'
      ur: 'ہجرت کا سال جس سے ہجری تقویم اور ریاست دونوں کا آغاز ہوا'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'جهة الصلاة بعدما تحوّلت من القدس إلى الكعبة في المدينة'
      en: 'the prayer direction after it turned from Jerusalem to the Kaaba in Medina'
      ur: 'نماز کی سمت جب وہ بیت المقدس سے کعبہ کی طرف مدینہ میں پھر دی گئی'
  practice:
  - q:
      ar: ما الاسم القديم للمدينة؟
      en: What is Medina''s old name?
      ur: مدینہ کا قدیم نام کیا ہے؟
    options:
    - text:
        ar: يثرب
        en: Yathrib
        ur: یثرب
      correct: true
      why:
        ar: يثرب اسمها قبل الإسلام في المصادر
        en: Yathrib is her pre-Islamic name in the sources
        ur: یثرب ماخذ میں اس کا اسلام سے پہلے کا نام ہے
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: false
      why:
        ar: مكة مدينة أخرى
        en: Mecca is another city
        ur: مکہ دوسرا شہر ہے
    - text:
        ar: الكوفة
        en: Kufa
        ur: کوفہ
      correct: false
      why:
        ar: الكوفة في العراق لا يثرب
        en: Kufa is in Iraq, not Yathrib
        ur: کوفہ عراق میں ہے، یثرب نہیں
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد مدينة لاحقة
        en: Baghdad is a later city
        ur: بغداد بعد کا شہر ہے
  - q:
      ar: متى قامت الدولة في المدينة؟
      en: When did the polity rise in Medina?
      ur: مدینہ میں ریاست کب قائم ہوئی؟
    options:
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: true
      why:
        ar: سنة الهجرة والوثيقة معًا
        en: the Hijra year and the covenant together
        ur: ہجرت کا سال اور معاہدہ ایک ساتھ
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ذلك عام بدء الوحي في مكة
        en: that is the year revelation began in Mecca
        ur: یہ مکہ میں وحی کے آغاز کا سال ہے
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ذلك عام الفتح لا قيام المدينة
        en: that is the conquest year, not Medina''s founding
        ur: یہ فتح کا سال ہے، مدینہ کے قیام کا نہیں
    - text:
        ar: عام ٧٥٠
        en: in 750
        ur: 750 میں
      correct: false
      why:
        ar: ذلك عام قيام العباسية
        en: that is the year the Abbasids rose
        ur: یہ عباسیوں کے قیام کا سال ہے
  - q:
      ar: ما وثيقة المدينة؟
      en: What is the Constitution of Medina?
      ur: میثاقِ مدینہ کیا ہے؟
    options:
    - text:
        ar: عقد بين المسلمين وقبائل المدينة وحلفائهم
        en: a pact between Muslims, Medina''s tribes and allies
        ur: مسلمانوں، مدینہ کے قبائل اور حلیفوں کے درمیان عہد
      correct: true
      why:
        ar: جمعت الأطراف في بنيان واحد
        en: it joined the parties in one order
        ur: اس نے فریقوں کو ایک نظم میں جوڑا
    - text:
        ar: معاهدة تجارة
        en: a trade treaty
        ur: تجارتی معاہدہ
      correct: false
      why:
        ar: كانت عقدًا سياسيًّا لا تجاريًّا
        en: it was a political pact, not trade
        ur: یہ سیاسی عہد تھا، تجارتی نہیں
    - text:
        ar: رسالة سرية
        en: a secret letter
        ur: خفیہ خط
      correct: false
      why:
        ar: شملت كلّ أطراف المدينة علنًا
        en: it covered all of Medina''s parties openly
        ur: اس میں مدینہ کے تمام فریق علانیہ شامل تھے
    - text:
        ar: قانون روماني
        en: a Roman law
        ur: رومی قانون
      correct: false
      why:
        ar: كُتبت في المدينة لا روما
        en: it was written in Medina, not Rome
        ur: یہ مدینہ میں لکھی گئی، روم میں نہیں
  - q:
      ar: ماذا بُني في المدينة؟
      en: What was built in Medina?
      ur: مدینہ میں کیا تعمیر ہوا؟
    options:
    - text:
        ar: المسجد النبوي
        en: the Prophet''s mosque
        ur: مسجدِ نبوی
      correct: true
      why:
        ar: المركز الأول للعبادة والحكم في المصادر
        en: the first centre of worship and rule in the sources
        ur: عبادت اور حکومت کا پہلا مرکز ماخذ میں
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة في مكة لا المدينة
        en: the Kaaba is in Mecca, not Medina
        ur: کعبہ مکہ میں ہے، مدینہ میں نہیں
    - text:
        ar: الأقصى
        en: al-Aqsa
        ur: اقصیٰ
      correct: false
      why:
        ar: الأقصى في القدس
        en: al-Aqsa is in Jerusalem
        ur: اقصیٰ بیت المقدس میں ہے
    - text:
        ar: دار الحكمة
        en: the House of Wisdom
        ur: بیت الحکمت
      correct: false
      why:
        ar: دار الحكمة في بغداد العباسية
        en: the House of Wisdom is Abbasid Baghdad
        ur: بیت الحکمت عباسی بغداد میں ہے
  - q:
      ar: كم بقيت المدينة عاصمة؟
      en: How long did Medina stay the capital?
      ur: مدینہ کتنی دیر دارالحکومت رہا؟
    options:
    - text:
        ar: حتى انتقال المركز إلى الكوفة
        en: until the centre moved to Kufa
        ur: جب تک مرکز کوفہ منتقل ہوا
      correct: true
      why:
        ar: انتقلت العاصمة بعد الخلفاء الأوائل
        en: the capital moved after the first caliphs
        ur: پہلے خلفاء کے بعد دارالحکومت منتقل ہوا
    - text:
        ar: إلى اليوم
        en: to this day
        ur: آج تک
      correct: false
      why:
        ar: انتقل المركز إلى الكوفة ثم دمشق
        en: the centre moved to Kufa then Damascus
        ur: مرکز کوفہ پھر دمشق منتقل ہوا
    - text:
        ar: سنة واحدة
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: دامت عاصمة سنوات لا سنة
        en: it stayed capital for years, not one
        ur: یہ برسوں دارالحکومت رہا، ایک سال نہیں
    - text:
        ar: لم تكن عاصمة أبدًا
        en: it was never capital
        ur: یہ کبھی دارالحکومت نہیں تھا
      correct: false
      why:
        ar: كانت مقرّ الخلفاء الأوائل
        en: it was the first caliphs'' seat
        ur: یہ پہلے خلفاء کی نشست تھی
  - q:
      ar: من سكن المدينة قبل الإسلام؟
      en: Who lived in Medina before Islam?
      ur: اسلام سے پہلے مدینہ میں کون رہتا تھا؟
    options:
    - text:
        ar: قبائل الأوس والخزرج وحلفاء يهود
        en: the Aws and Khazraj tribes with Jewish allies
        ur: اوس اور خزرج قبائل اور یہودی حلیف
      correct: true
      why:
        ar: وصفت المصادر أطرافها قبل الهجرة
        en: the sources describe her parties before the Hijra
        ur: ماخذ ہجرت سے پہلے اس کے فریقوں کا ذکر کرتے ہیں
    - text:
        ar: الرومان
        en: the Romans
        ur: رومی
      correct: false
      why:
        ar: لم يحكم الرومان يثرب
        en: the Romans did not rule Yathrib
        ur: رومیوں نے یثرب پر حکومت نہیں کی
    - text:
        ar: الفرنجة
        en: the Franks
        ur: فرنگی
      correct: false
      why:
        ar: الفرنجة جاءت بعد قرون
        en: the Franks came centuries later
        ur: فرنگی صدیوں بعد آئے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: كان فيها قبائل وزراعة قبل الإسلام
        en: she had tribes and farming before Islam
        ur: اسلام سے پہلے اس میں قبائل اور کھیتی تھی
  - q:
      ar: لماذا هاجر المسلمون إليها؟
      en: Why did the Muslims migrate to her?
      ur: مسلمان اس کی طرف ہجرت کیوں کیے؟
    options:
    - text:
        ar: بدعوة من أهلها ولبناء دولة
        en: by her people''s invitation to build a polity
        ur: اس کے لوگوں کی دعوت پر، ریاست بنانے کے لیے
      correct: true
      why:
        ar: دعاها الأنصار النبي في المصادر
        en: the sources have the Ansar invite the Prophet
        ur: ماخذ میں انصار نے نبی کو بلایا
    - text:
        ar: لأنها كانت أقرب مدينة
        en: because she was the closest city
        ur: کیونکہ یہ قریب ترین شہر تھا
      correct: false
      why:
        ar: لم يكن القرب سبب الاختيار
        en: proximity was not the reason for the choice
        ur: قرب انتخاب کی وجہ نہیں تھا
    - text:
        ar: للتجارة فقط
        en: for trade only
        ur: صرف تجارت کے لیے
      correct: false
      why:
        ar: كان الهدف الدعوة والدولة لا التجارة
        en: the aim was calling and polity, not trade
        ur: مقصد دعوت اور ریاست تھا، تجارت نہیں
    - text:
        ar: لهروب من الحج
        en: to escape the Hajj
        ur: حج سے بچنے کے لیے
      correct: false
      why:
        ar: لم يكن الحج سبب الهجرة
        en: the Hajj was not the migration''s reason
        ur: حج ہجرت کی وجہ نہیں تھا
  - q:
      ar: ماذا خرج من المدينة؟
      en: What went out from Medina?
      ur: مدینہ سے کیا نکلا؟
    options:
    - text:
        ar: السرايا والرسائل والتقويم الهجري
        en: the expeditions, letters and Hijri calendar
        ur: مہمات، خطوط اور ہجری تقویم
      correct: true
      why:
        ar: انطلقت منها الحملات والدعوة والتاريخ
        en: campaigns, calling and the calendar went out from her
        ur: وہاں سے مہمات، دعوت اور تقویم نکلی
    - text:
        ar: الحروب الصليبية
        en: the Crusades
        ur: صلیبی جنگیں
      correct: false
      why:
        ar: الحروب الصليبية من أوروبا لا المدينة
        en: the Crusades came from Europe, not Medina
        ur: صلیبی جنگیں یورپ سے آئیں، مدینہ سے نہیں
    - text:
        ar: الغزو المغولي
        en: the Mongol invasion
        ur: مغل حملہ
      correct: false
      why:
        ar: المغول جاءوا من الشرق بعد قرون
        en: the Mongols came from the east centuries later
        ur: مغل مشرق سے صدیوں بعد آئے
    - text:
        ar: الترجمة العباسية
        en: the Abbasid translation
        ur: عباسی ترجمہ
      correct: false
      why:
        ar: الترجمة في بغداد لا المدينة
        en: translation was in Baghdad, not Medina
        ur: ترجمہ بغداد میں تھا، مدینہ میں نہیں
  - q:
      ar: ما الحرمان؟
      en: What are the two sanctuaries?
      ur: دونوں حرم کیا ہیں؟
    options:
    - text:
        ar: مكة والمدينة معًا
        en: Mecca and Medina together
        ur: مکہ اور مدینہ ایک ساتھ
      correct: true
      why:
        ar: يذكر الاسم الحرمين مكة والمدينة
        en: the name joins Mecca and Medina
        ur: یہ نام مکہ اور مدینہ کو جوڑتا ہے
    - text:
        ar: مكة والقدس
        en: Mecca and Jerusalem
        ur: مکہ اور بیت المقدس
      correct: false
      why:
        ar: الحرمان في الاسم مكة والمدينة
        en: the two sanctuaries named are Mecca and Medina
        ur: نام میں دونوں حرم مکہ اور مدینہ ہیں
    - text:
        ar: الكعبة والأقصى
        en: the Kaaba and al-Aqsa
        ur: کعبہ اور اقصیٰ
      correct: false
      why:
        ar: الحرمان مدينتان لا مسجدان
        en: the two sanctuaries are cities, not mosques
        ur: دونوں حرم شہر ہیں، مسجد نہیں
    - text:
        ar: المدينة ودمشق
        en: Medina and Damascus
        ur: مدینہ اور دمشق
      correct: false
      why:
        ar: دمشق ليست حرمًا في الاسم
        en: Damascus is not a sanctuary in the name
        ur: دمشق نام میں حرم نہیں
  - q:
      ar: أين قبر النبي؟
      en: Where is the Prophet''s grave?
      ur: نبی کی قبر کہاں ہے؟
    options:
    - text:
        ar: في المدينة
        en: in Medina
        ur: مدینہ میں
      correct: true
      why:
        ar: تضمّ المدينة قبره في مسجده
        en: Medina holds his grave in his mosque
        ur: مدینہ میں اس کی مسجد میں قبر ہے
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: توفي ودُفن في المدينة لا مكة
        en: he died and was buried in Medina, not Mecca
        ur: وہ مدینہ میں فوت ہوئے اور دفن ہوئے، مکہ میں نہیں
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: القبر في المدينة لا القدس
        en: the grave is in Medina, not Jerusalem
        ur: قبر مدینہ میں ہے، بیت المقدس میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: لم ينتقل القبر إلى دمشق
        en: the grave did not move to Damascus
        ur: قبر دمشق منتقل نہیں ہوا
- id: jerusalem
  anchor: place/jerusalem
  band: researchers
  title:
    ar: القدس
    en: Jerusalem
    ur: بیت المقدس
  sixty:
    ar: 'القدس مدينة القبلة الأولى والمسجد الأقصى ثالث الحرمين، ومسرى النبي في الذاكرة الإسلامية. فتحها المسلمون عام ٦٣٧ في عهد عمر، وبنى عبد الملك قبة الصخرة فوق
      الصخرة المقدسة في ٦٩١. احتلها الصليبيون ١٠٩٩ واستعادها صلاح الدين ١١٨٧ بعد حطين، فعادت تحت الحكم الإسلامي حتى العصر العثماني وما بعده. بقيت القدس مركزًا دينيًّا
      للديانات الثلاث معًا: للمسلمين الأقصى والقبة، ولليهود جبل الهيكل، وللمسيحيين كنيسة القيامة.  وتقول القصة الكاملة: مدينة واحدة تحمل ثلاث ذاكرات، والحجارة نفسها تقرأ طبقات من التاريخ: أموية ومملوكية وعثمانية، وصليبية بينها، والأقصى في قلبها قائم منذ ألف وثلاثمائة عام. ومن القدس خرجت الأناشيد والقصائد، وإليها توجهت عيون الحجاج قبل مكة، وفيها تعلم المسلم أن الأرض يمكن أن تكون مقدسة ومتنازعًا عليها في آن، وأن ذاكرتها ملك لمن يحملها بأمانة.  وفي أسواقها ومساجدها وكنائسها تُقرأ طبقات إيمان الشعوب كلها، فصارت عنوان سؤال الحضارات: كيف يتعايش المختلفون في المقدّس المشترك.'
    en: 'Jerusalem is the city of the first qibla and al-Aqsa mosque, the third sanctuary, and the Prophet''''s night journey in Muslim memory. Muslims took it in
      637 under Umar, and Abd al-Malik built the Dome of the Rock over the sacred rock in 691. Crusaders seized it in 1099, and Saladin recovered it in 1187 after
      Hattin; it stayed under Islamic rule through the Ottoman era and beyond. Jerusalem remains a religious centre for all three faiths: al-Aqsa and the Dome for
      Muslims, the Temple Mount for Jews, the Church of the Holy Sepulchre for Christians.  The whole story says more: one city carrying three memories, and the very stones read like layers — Umayyad, Mamluk and Ottoman, with the Crusaders between — and al-Aqsa standing at its heart for thirteen hundred years. Out of Jerusalem came anthems and poems; toward it the pilgrims'' eyes turned before Mecca; and there the Muslim learns that a land can be sacred and contested at once, and that its memory belongs to whoever carries it faithfully.'
    ur: 'بیت المقدس پہلے قبلہ اور مسجدِ اقصیٰ کا شہر ہے، تیسرا حرم، اور مسلم یادداشت میں نبی کا معراج۔ مسلمانوں نے اسے 637 میں عمر کے دور میں لیا، اور عبدالملک نے
      691 میں مقدس چٹان پر گنبدِ صخرہ بنایا۔ صلیبیوں نے 1099 میں اسے لیا، اور صلاح الدین نے حطین کے بعد 1187 میں واپس لیا؛ یہ عثمانی دور اور اس کے بعد تک اسلامی حکومت
      میں رہی۔ بیت المقدس تینوں دینوں کا مذہبی مرکز ہے: مسلمانوں کے لیے اقصیٰ اور گنبد، یہودیوں کے لیے کوہِ ہیکل، مسیحیوں کے لیے کلیسائے قیامت۔  پوری کہانی مزید کہتی ہے: ایک شہر تین یادداشتیں اٹھائے، اور اس کی پتھریں تہوں کی طرح پڑھی جاتیں — اموی، مملوکی اور عثمانی، اور صلیبی ان کے درمیان — اور اقصیٰ تیرہ سو سال سے اس کے دل میں قائم ہے۔ بیت المقدس سے ترانے اور نظمیں نکلیں؛ مکہ سے پہلے حجاج کی نگاہیں اسی طرف تھیں؛ اور وہاں مسلمان سیکھتا ہے کہ سرزمین مقدس اور متنازع دونوں ہو سکتی ہے، اور اس کی یادداشت اسی کی ہے جو امانت سے اٹھائے۔'
  glossary:
  - term:
      ar: الأقصى
      en: al-Aqsa
      ur: اقصیٰ
    gloss:
      ar: 'مسجد الحرم الثالث بعد حرمي مكة والمدينة'
      en: 'the mosque of the third sanctuary, after the two sanctuaries of Mecca and Medina'
      ur: 'تیسرے حرم کی مسجد، مکہ اور مدینہ کے حرموں کے بعد'
  - term:
      ar: قبة الصخرة
      en: the Dome of the Rock
      ur: گنبدِ صخرہ
    gloss:
      ar: 'القبة الذهبية التي بناها عبد الملك فوق الصخرة المقدسة سنة ٦٩١م'
      en: 'the golden dome Abd al-Malik built over the sacred rock in 691'
      ur: 'سنہری گنبد جو عبدالملک نے 691 میں مقدس چٹان پر بنایا'
  - term:
      ar: القبلة الأولى
      en: the first qibla
      ur: پہلا قبلہ
    gloss:
      ar: 'الاتجاه الأول للصلاة قبل أن تتحوّل إلى الكعبة في مكة'
      en: 'the first direction of the prayer before it turned to the Kaaba in Mecca'
      ur: 'نماز کی پہلی سمت اس سے پہلے کہ وہ مکہ کے کعبہ کی طرف پھری'
  - term:
      ar: المعراج
      en: the night journey
      ur: معراج
    gloss:
      ar: 'رحلة الإسراء والمعراج التي تحفظها الذاكرة المسلمة مرتبطة بهذه المدينة'
      en: 'the Isra and Mi''raj journey that Muslim memory keeps bound to this city'
      ur: 'اسراء و معراج کا سفر جسے مسلم یادداشت اس شہر سے جوڑ کر رکھتی ہے'
  - term:
      ar: عمر
      en: Umar
      ur: عمر
    gloss:
      ar: 'الخليفة الثاني الذي دخل المدينة وتسلّمها من بطريركها'
      en: 'the second caliph, who entered the city and received it from its patriarch'
      ur: 'دوسرا خلیفہ جس نے شہر میں داخل ہو کر اسے اس کے پادری سے لیا'
  - term:
      ar: عبد الملك
      en: Abd al-Malik
      ur: عبدالملک
    gloss:
      ar: 'الخليفة الأموي الذي أقام قبة الصخرة — أعجوبة العمارة الإسلامية الأولى'
      en: 'the Umayyad caliph who raised the Dome of the Rock — early Islamic architecture''s wonder'
      ur: 'اموی خلیفہ جس نے گنبدِ صخرہ تعمیر کیا — ابتدائی اسلامی فنِ تعمیر کا شاہکار'
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: 'المعركة الحاسمة التي سبقت استعادة المدينة بأشهر سنة ١١٨٧م'
      en: 'the decisive battle won only months before the city''s recovery in 1187'
      ur: 'فیصلہ کن جنگ جو 1187 میں شہر کی واپسی سے چند مہینے پہلے جیتی گئی'
  - term:
      ar: صلاح الدين
      en: Saladin
      ur: صلاح الدین
    gloss:
      ar: 'موحّد الجبهة المسلمة الذي استعاد المدينة بعد ثمانٍ وثمانين سنة'
      en: 'the unifier of the Muslim front, who took the city back after eighty-eight years'
      ur: 'مسلم محاذ کا متحد کنندہ جس نے اٹھاسی سال بعد شہر واپس لیا'
  - term:
      ar: ٦٣٧
      en: '637'
      ur: '637'
    gloss:
      ar: 'سنة الفتح الإسلامي للمدينة في عهد عمر بن الخطاب'
      en: 'the year of the Muslim conquest of the city under Umar ibn al-Khattab'
      ur: 'عمر بن خطاب کے عہد میں شہر کی مسلم فتح کا سال'
  - term:
      ar: ١٠٩٩
      en: '1099'
      ur: '1099'
    gloss:
      ar: 'السنة التي سقطت فيها بأيدي الصليبيين في حملتهم الأولى'
      en: 'the year it fell to the Crusaders in their first campaign'
      ur: 'وہ سال جب وہ صلیبیوں کی پہلی مہم میں ان کے ہاتھوں گر گئی'
  - term:
      ar: الصخرة
      en: the Rock
      ur: چٹان
    gloss:
      ar: 'الصخرة المقدسة تحت القبة التي تحفظها ذاكرة الديانات الثلاث'
      en: 'the sacred rock beneath the dome, kept at the center of three faiths'' memory'
      ur: 'گنبد کے نیچے مقدس چٹان جو تین دھارموں کی یادداشت کے مرکز میں ہے'
  - term:
      ar: العثمانيون
      en: the Ottomans
      ur: عثمانی
    gloss:
      ar: 'آخر حكم إسلامي للمدينة ودام أربعة قرون حتى نهاية الحرب الكبرى'
      en: 'the city''s last Muslim rule, which held it four centuries until the Great War''s end'
      ur: 'شہر کی آخری مسلم حکومت جو چار صدیوں تک رہی یہاں تک کہ عظیم جنگ ختم ہوئی'
  practice:
  - q:
      ar: ما المسجد الأقصى؟
      en: What is al-Aqsa mosque?
      ur: مسجدِ اقصیٰ کیا ہے؟
    options:
    - text:
        ar: ثالث الحرمين في القدس
        en: the third sanctuary in Jerusalem
        ur: بیت المقدس میں تیسرا حرم
      correct: true
      why:
        ar: يذكر الاسم الأقصى ثالثًا بعد مكة والمدينة
        en: the name ranks it third after Mecca and Medina
        ur: نام اسے مکہ اور مدینہ کے بعد تیسرا رکھتا ہے
    - text:
        ar: أول مسجد في الإسلام
        en: the first mosque in Islam
        ur: اسلام کی پہلی مسجد
      correct: false
      why:
        ar: أول المساجد مسجد قباء والنبوي
        en: the first mosques were Quba and the Prophet''s
        ur: پہلی مسجدیں قباء اور نبوی تھیں
    - text:
        ar: كنيسة مسيحية
        en: a Christian church
        ur: مسیحی کلیسا
      correct: false
      why:
        ar: الأقصى مسجد لا كنيسة
        en: al-Aqsa is a mosque, not a church
        ur: اقصیٰ مسجد ہے، کلیسا نہیں
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: الأقصى بيت عبادة لا سكن
        en: al-Aqsa is a house of worship, not residence
        ur: اقصیٰ عبادت کا گھر ہے، رہائش نہیں
  - q:
      ar: متى فتح المسلمون القدس؟
      en: When did Muslims take Jerusalem?
      ur: مسلمانوں نے بیت المقدس کب لیا؟
    options:
    - text:
        ar: عام ٦٣٧ في عهد عمر
        en: in 637 under Umar
        ur: 637 میں عمر کے دور میں
      correct: true
      why:
        ar: تذكر المصادر تسليم المدينة ٦٣٧
        en: the sources date the city''s surrender to 637
        ur: ماخذ شہر کی سپردگی 637 لکھتے ہیں
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا فتح القدس
        en: that is the Hijra year, not Jerusalem''s taking
        ur: یہ ہجرت کا سال ہے، بیت المقدس کے لینے کا نہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام استعادة صلاح الدين
        en: that is Saladin''s recovery year
        ur: یہ صلاح الدین کی واپسی کا سال ہے
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية
        en: that is Constantinople''s year
        ur: یہ قسطنطنیہ کا سال ہے
  - q:
      ar: من بنى قبة الصخرة؟
      en: Who built the Dome of the Rock?
      ur: گنبدِ صخرہ کس نے بنایا؟
    options:
    - text:
        ar: عبد الملك عام ٦٩١
        en: Abd al-Malik in 691
        ur: عبدالملک نے 691 میں
      correct: true
      why:
        ar: تنسبه المصادر إلى الخليفة الأموي
        en: the sources credit the Umayyad caliph
        ur: ماخذ اسے اموی خلیفہ سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين بعد البناء بخمسة قرون
        en: Saladin came five centuries after the building
        ur: صلاح الدین عمارت سے پانچ صدیوں بعد آیا
    - text:
        ar: المنصور
        en: al-Mansur
        ur: المنصور
      correct: false
      why:
        ar: كان المنصور عباسيًّا مؤسس بغداد
        en: al-Mansur was the Abbasid founder of Baghdad
        ur: المنصور عباسی بانی بغداد تھا
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: هارون خليفة لاحق لا الباني
        en: Harun was a later caliph, not the builder
        ur: ہارون بعد کا خلیفہ تھا، بنانے والا نہیں
  - q:
      ar: متى استعادها المسلمون من الصليبيين؟
      en: When did Muslims recover it from the Crusaders?
      ur: مسلمانوں نے اسے صلیبیوں سے کب واپس لیا؟
    options:
    - text:
        ar: عام ١١٨٧ بعد حطين
        en: in 1187 after Hattin
        ur: 1187 میں حطین کے بعد
      correct: true
      why:
        ar: تذكر المصادر استعادة صلاح الدين بعد المعركة
        en: the sources date Saladin''s recovery after the battle
        ur: ماخذ جنگ کے بعد صلاح الدین کی واپسی لکھتے ہیں
    - text:
        ar: عام ١٠٩٩
        en: in 1099
        ur: 1099 میں
      correct: false
      why:
        ar: ذلك عام احتلالها لا استعادتها
        en: that is the year of its seizure, not recovery
        ur: یہ اس کے قبضے کا سال ہے، واپسی کا نہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا القدس
        en: that is Acre''s fall, not Jerusalem
        ur: یہ عکہ کے گرنے کا سال ہے، بیت المقدس کا نہیں
    - text:
        ar: لم تُستعد أبدًا
        en: it was never recovered
        ur: یہ کبھی واپس نہیں آیا
      correct: false
      why:
        ar: استعادها صلاح الدين في المصادر
        en: the sources have Saladin recover it
        ur: ماخذ میں صلاح الدین نے اسے واپس لیا
  - q:
      ar: ما القبلة الأولى؟
      en: What was the first qibla?
      ur: پہلا قبلہ کیا تھا؟
    options:
    - text:
        ar: القدس قبل التحويل إلى مكة
        en: Jerusalem before the change to Mecca
        ur: مکہ میں تبدیلی سے پہلے بیت المقدس
      correct: true
      why:
        ar: تذكر المصادر الصلاة نحو القدس ثم الكعبة
        en: the sources have prayer toward Jerusalem then the Kaaba
        ur: ماخذ میں نماز بیت المقدس پھر کعبہ کی طرف ہے
    - text:
        ar: مكة منذ البداية
        en: Mecca from the start
        ur: شروع سے مکہ
      correct: false
      why:
        ar: كانت القدس القبلة أولًا
        en: Jerusalem was the qibla first
        ur: بیت المقدس پہلے قبلہ تھا
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة لم تكن قبلة قط
        en: Medina was never the qibla
        ur: مدینہ کبھی قبلہ نہیں تھا
    - text:
        ar: لا قبلة كانت
        en: there was no qibla
        ur: کوئی قبلہ نہیں تھا
      correct: false
      why:
        ar: كانت القبلة إلى القدس ثم مكة
        en: the qibla was to Jerusalem then Mecca
        ur: قبلہ بیت المقدس پھر مکہ تھا
  - q:
      ar: لمن القدس مركز ديني؟
      en: For whom is Jerusalem a religious centre?
      ur: بیت المقدس کس کے لیے مذہبی مرکز ہے؟
    options:
    - text:
        ar: للمسلمين واليهود والمسيحيين معًا
        en: for Muslims, Jews and Christians together
        ur: مسلمانوں، یہودیوں اور مسیحیوں کے لیے، ایک ساتھ
      correct: true
      why:
        ar: يجمع المدينة الأقصى وجبل الهيكل وكنيسة القيامة
        en: it joins al-Aqsa, the Temple Mount and the Sepulchre
        ur: یہ اقصیٰ، کوہِ ہیکل اور قیامت کو جوڑتا ہے
    - text:
        ar: للمسلمين فقط
        en: for Muslims only
        ur: صرف مسلمانوں کے لیے
      correct: false
      why:
        ar: للمدينة مراكز للديانات الثلاث
        en: the city has centres for all three faiths
        ur: شہر میں تینوں دینوں کے مراکز ہیں
    - text:
        ar: للمسيحيين فقط
        en: for Christians only
        ur: صرف مسیحیوں کے لیے
      correct: false
      why:
        ar: للمسلمين واليهود أيضًا مراكز فيها
        en: Muslims and Jews have centres there too
        ur: مسلمانوں اور یہودیوں کے بھی وہاں مراکز ہیں
    - text:
        ar: لأحد؛ مدينة علمانية
        en: for no one; a secular city
        ur: کسی کے لیے نہیں؛ سیکولر شہر
      correct: false
      why:
        ar: القدس من أكثر المدن دينية في التاريخ
        en: Jerusalem is among history''s most religious cities
        ur: بیت المقدس تاریخ کے سب سے مذہبی شہروں میں ہے
  - q:
      ar: كم دامت تحت الحكم الإسلامي؟
      en: How long was it under Islamic rule?
      ur: یہ اسلامی حکومت میں کتنی دیر رہی؟
    options:
    - text:
        ar: من ٦٣٧ حتى العصر العثماني وما بعده
        en: from 637 through the Ottoman era and beyond
        ur: 637 سے عثمانی دور اور اس کے بعد تک
      correct: true
      why:
        ar: بقيت تحت الحكم الإسلامي قرونًا باستثناء الصليبي
        en: it stayed under Islamic rule for centuries but the Crusader gap
        ur: یہ صلیبی وقفے کے علاوہ صدیوں اسلامی حکومت میں رہی
    - text:
        ar: سنة واحدة فقط
        en: only one year
        ur: صرف ایک سال
      correct: false
      why:
        ar: دامت قرونًا لا سنة
        en: it lasted centuries, not a year
        ur: یہ صدیوں رہی، ایک سال نہیں
    - text:
        ar: حتى ١٠٩٩ ثم لم تعد
        en: until 1099 then never again
        ur: 1099 تک پھر کبھی نہیں
      correct: false
      why:
        ar: استعادها المسلمون ١١٨٧ وحكموها قرونًا بعد
        en: Muslims recovered it in 1187 and ruled for centuries more
        ur: مسلمانوں نے 1187 میں واپس لیا اور مزید صدیوں حکومت کی
    - text:
        ar: لم تكن إسلامية أبدًا
        en: it was never Islamic
        ur: یہ کبھی اسلامی نہیں رہی
      correct: false
      why:
        ar: حكمها المسلمون منذ ٦٣٧
        en: Muslims ruled it from 637
        ur: مسلمانوں نے 637 سے اس پر حکومت کی
  - q:
      ar: ما الصخرة؟
      en: What is the Rock?
      ur: چٹان کیا ہے؟
    options:
    - text:
        ar: الحجر المقدس الذي قامت عليه قبة الصخرة
        en: the sacred rock under the Dome of the Rock
        ur: وہ مقدس چٹان جس پر گنبدِ صخرہ ہے
      correct: true
      why:
        ar: بنى عبد الملك القبة فوقها
        en: Abd al-Malik built the Dome over it
        ur: عبدالملک نے اس پر گنبد بنایا
    - text:
        ar: جبل قرب مكة
        en: a mountain near Mecca
        ur: مکہ کے قریب پہاڑ
      correct: false
      why:
        ar: الصخرة في القدس لا مكة
        en: the Rock is in Jerusalem, not Mecca
        ur: چٹان بیت المقدس میں ہے، مکہ میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: الصخرة حجر ديني لا قلعة
        en: the Rock is a sacred stone, not a castle
        ur: چٹان مقدس پتھر ہے، قلعہ نہیں
    - text:
        ar: سوق القدس
        en: Jerusalem''s market
        ur: بیت المقدس کا بازار
      correct: false
      why:
        ar: الصخرة مكان ديني لا سوق
        en: the Rock is a sacred place, not a market
        ur: چٹان مقدس جگہ ہے، بازار نہیں
  - q:
      ar: من كتب عن القدس؟
      en: Who wrote about Jerusalem?
      ur: بیت المقدس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون وجغرافيون من كلّ الحضارات
        en: historians and geographers of every civilization
        ur: ہر تہذیب کے مؤرخین اور جغرافیہ دان
      correct: true
      why:
        ar: تصلنا وصفها من المصادر الإسلامية والأوروبية واليهودية
        en: accounts reach us from Islamic, European and Jewish sources
        ur: اسلامی، یورپی اور یہودی ماخذ سے اس کی وصف پہنچی
    - text:
        ar: المسلمون فقط
        en: only Muslims
        ur: صرف مسلمان
      correct: false
      why:
        ar: كتب عنها كلّ الأديان والحضارات
        en: every faith and civilization wrote of her
        ur: ہر دین اور تہذیب نے اس کے بارے میں لکھا
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها قبل أوروبا بقرون
        en: Muslims wrote of her centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: القدس من أكثر المدن تدوينًا
        en: Jerusalem is among the most-written cities
        ur: بیت المقدس سب سے زیادہ لکھے جانے والے شہروں میں ہے
  - q:
      ar: في عهد أيّ خلافة بُنيت قبة الصخرة؟
      en: Under which caliphate was the Dome built?
      ur: گنبدِ صخرہ کس خلافت میں بنی؟
    options:
    - text:
        ar: الأموية
        en: the Umayyad
        ur: اموی
      correct: true
      why:
        ar: كان عبد الملك أمويًّا دمشقيًّا
        en: Abd al-Malik was Umayyad, of Damascus
        ur: عبدالملک اموی تھا، دمشق کا
    - text:
        ar: العباسية
        en: the Abbasid
        ur: عباسی
      correct: false
      why:
        ar: كان عبد الملك قبل العباسيين
        en: Abd al-Malik predates the Abbasids
        ur: عبدالملک عباسیوں سے پہلے تھا
    - text:
        ar: العثمانية
        en: the Ottoman
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون جاءوا بعد ثمانية قرون
        en: the Ottomans came eight centuries later
        ur: عثمانی آٹھ صدیوں بعد آئے
    - text:
        ar: المملوكية
        en: the Mamluk
        ur: مملوکی
      correct: false
      why:
        ar: المماليك حكموا مصر والشام لاحقًا
        en: the Mamluks ruled Egypt and Syria later
        ur: مملوکوں نے مصر اور شام پر بعد میں حکومت کی
- id: cordoba
  anchor: place/cordoba
  band: researchers
  title:
    ar: قرطبة
    en: Cordoba
    ur: قرطہ
  sixty:
    ar: 'قرطبة عاصمة الأندلس ومدينة الجامع الكبير، أعظم حواضر أوروبا في القرن العاشر. حكمها الأمويون الهاربون من دمشق فأقاموا فيها إمارة ثم خلافة، وجعلها عبد الرحمن
      الثالث لؤلؤة الغرب الإسلامي: مكتبة الحكم الثاني بمئات الآلاف من المجلدات، ومدينة الزهراء التي بناها للخلافة، ومدارس الطب والفلك والفقه. تفككت خلافتها في فتنة
      ١٠٣١، فصارت ملوك الطوائف ثم المرابطين والموحدين حتى سقطت للنصارى ١٢٣٦. بقيت قرطبة رمز الأندلس: ذروة تلاقت فيها الحضارات على ضفاف الوادي الكبير.  ومن قرطبة خرجت أسماء الغرب الإسلامي: ابن رشد الفيلسوف وابن العربي الصوفي وابن حزم الأديب، وترجمت فيها مؤلفات انتقلت إلى جامعات أوروبا. سقطت بعد ذلك أمام فرناندو الثالث سنة ١٢٣٦، لكن مسجدها الكبير باقٍ إلى اليوم كاتدرائية تروي أن قرطبة كانت يومًا عقل الغرب كله، وأن حضارة يمكن أن تخسر عاصمتها وتبقى دروسها.  وتلك الحقبة أعطت الحضارة صورتها الكاملة: حكم وعلم وعمران وتسامح، حتى صار اسمها في ذاكرة أوروبا اسم العصر الذهبي.'
    en: 'Cordoba is the capital of al-Andalus and the city of the Great Mosque, the greatest urban centre in tenth-century Europe. The Umayyads who escaped Damascus
      ruled it, setting up first an emirate then a caliphate, and Abd al-Rahman III made it the jewel of the Islamic west: al-Hakam II''''s library of hundreds of
      thousands of volumes, the city of Madinat al-Zahra he built for the caliphate, and schools of medicine, astronomy and law. Its caliphate broke apart in the
      fitna of 1031 into taifa kingdoms, then Almoravids and Almohads, until it fell to the Christians in 1236. Cordoba remains the emblem of al-Andalus: a peak where
      civilizations met on the banks of the Guadalquivir.  Out of Cordoba came the names of the Islamic west — the philosopher Ibn Rushd, the mystic Ibn Arabi, the man of letters Ibn Hazm — and translations that travelled into Europe''s universities. It fell to Ferdinand III in 1236, yet its Great Mosque stands today as a cathedral telling that Cordoba was once the whole west''s mind, and that a civilization may lose its capital yet keep its lessons.'
    ur: 'قرطہ اندلس کا دارالحکومت اور عظیم مسجد کا شہر ہے، دسویں صدی کے یورپ کا سب سے بڑا شہری مرکز۔ دمشق سے بچ نکلنے والے امویوں نے اس پر حکومت کی، پہلے امارت پھر
      خلافت قائم کر کے، اور عبدالرحمن ثالث نے اسے اسلامی مغرب کا جواہر بنایا: حکم دوم کی لاکھوں جلدوں کی لائبریری، خلافت کے لیے بنایا گیا شہر مدینۃ الزہرا، اور طب،
      فلکیات اور فقہ کے مکاتب۔ اس کی خلافت 1031 کی فتنے میں ٹوٹ کر طائفہ بادشاہیوں، پھر مرابطین اور موحدین میں بٹ گئی، جب تک کہ 1236 میں مسیحیوں کے ہاتھ گری۔ قرطہ
      اندلس کی علامت ہے: وہ بلندی جہاں تہذیبیں وادی الکبیر کے کنارے ملی تھیں۔  قرطہ سے اسلامی مغرب کے نام نکلے — فلسفی ابن رشد، صوفی ابن عربی، ادیب ابن حزم — اور وہ ترجمے جو یورپ کے جامعوں تک پہنچے۔ یہ 1236 میں فرنانڈو سوم کے ہاتھ گرا، مگر اس کی عظیم مسجد آج گرجا بن کر کھڑی بتاتی ہے کہ قرطہ کبھی پورے مغرب کا ذہن تھا، اور تہذیب اپنا دارالحکومت کھو سکتی ہے مگر اپنے اسباق نہیں۔'
  glossary:
  - term:
      ar: الأندلس
      en: al-Andalus
      ur: اندلس
    gloss:
      ar: 'الاسم الإسلامي لشبه الجزيرة الإيبيرية طوال العصور الوسطى'
      en: 'the Islamic name for the Iberian peninsula through the Middle Ages'
      ur: 'قرون وسطی میں جزیرہ نما آئیبیریا کا اسلامی نام'
  - term:
      ar: الجامع الكبير
      en: the Great Mosque
      ur: عظیم مسجد
    gloss:
      ar: 'الجامع الكبير ذو الأقواس المخططة — كاتدرائية اليوم وما زال مدرسةً للعمارة'
      en: 'the Great Mosque of striped arches — a cathedral today, still a school of architecture'
      ur: 'دھاری دار محرابوں والی عظیم مسجد — آج گرجا گھر مگر فنِ تعمیر کا مکتب اب بھی'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة التي فرّت من دمشق وأقامت هناك إمارةً ثم خلافة'
      en: 'the dynasty that fled Damascus and set up first an emirate, then a caliphate, there'
      ur: 'وہ خاندان جو دمشق سے بھاگ کر آیا اور وہاں پہلے امارت پھر خلافت قائم کی'
  - term:
      ar: عبد الرحمن الثالث
      en: Abd al-Rahman III
      ur: عبدالرحمن ثالث
    gloss:
      ar: 'الأمير الذي أعلن نفسه خليفةً وجعل قرطبة جوهرة الغرب'
      en: 'the emir who declared himself caliph and made Cordoba the jewel of the west'
      ur: 'وہ امیر جس نے خود کو خلیفہ قرار دیا اور قرطبة کو مغرب کا جواہر بنا دیا'
  - term:
      ar: الحكم الثاني
      en: al-Hakam II
      ur: حکم دوم
    gloss:
      ar: 'الخليفة صاحب المكتبة الكبرى التي ضمّت مئات آلاف المجلدات'
      en: 'the caliph of the great library, which held hundreds of thousands of volumes'
      ur: 'عظیم کتب خانے کا خلیفہ جس میں لاکھوں جلدیں تھیں'
  - term:
      ar: مدينة الزهراء
      en: Madinat al-Zahra
      ur: مدینۃ الزہرا
    gloss:
      ar: 'المدينة الملكية التي بناها الخليفة بجوار قرطبة مقرًّا للحكم'
      en: 'the royal city the caliph built beside Cordoba as a seat of rule'
      ur: 'شاہی شہر جو خلیفہ نے قرطبة کے پاس مرکزِ حکومت بنا کر بنایا'
  - term:
      ar: الفتنة
      en: the fitna
      ur: فتنہ
    gloss:
      ar: 'الحرب الأهلية التي حلّت الخلافة سنة ١٠٣١م إلى دويلات صغيرة'
      en: 'the civil war that dissolved the caliphate in 1031 into small statelets'
      ur: 'وہ خانہ جنگی جس نے 1031 میں خلافت کو چھوٹی ریاستوں میں بکھیر دیا'
  - term:
      ar: ملوك الطوائف
      en: the taifa kings
      ur: طائفہ بادشاہ
    gloss:
      ar: 'الملوك الصغار الذين تقاسموا الأندلس بعد سقوط الخلافة'
      en: 'the small kings who carved up al-Andalus after the caliphate''s fall'
      ur: 'چھوٹے بادشاہ جنہوں نے خلافت کے زوال کے بعد اندلس بانٹ لیا'
  - term:
      ar: المرابطون
      en: the Almoravids
      ur: مرابطین
    gloss:
      ar: 'السلالة المغربية التي عبرت لنجدة الأندلس بعد عهد الطوائف'
      en: 'the Moroccan dynasty that crossed over to al-Andalus''s rescue after the taifas'
      ur: 'مراکشی خاندان جو طائفہ بادشاہوں کے بعد اندلس کی مدد کو آیا'
  - term:
      ar: الموحدون
      en: the Almohads
      ur: موحدین
    gloss:
      ar: 'السلالة التي جاءت بعد المرابطين وحكمت من إشبيلية ومراكش'
      en: 'the dynasty that followed the Almoravids, ruling from Seville and Marrakesh'
      ur: 'وہ خاندان جو مرابطین کے بعد آیا اور اشبیلیہ اور مراکش سے حکومت کی'
  - term:
      ar: ١٢٣٦
      en: '1236'
      ur: '1236'
    gloss:
      ar: 'سنة سقوط المدينة بيد فرديناند الثالث ملك قشتالة'
      en: 'the year the city fell to Ferdinand III of Castile'
      ur: 'وہ سال جب شہر قشتالہ کے فرڈینینڈ سوم کے ہاتھوں گیا'
  - term:
      ar: الوادي الكبير
      en: the Guadalquivir
      ur: وادی الکبیر
    gloss:
      ar: 'النهر الكبير الذي تقوم عليه المدينة وما زالت جسورها القديمة تعبره'
      en: 'the great river the city stands on, which its old bridges still cross'
      ur: 'وہ عظیم دریا جس پر شہر کھڑا ہے اور جسے اس کے پرانے پل آج بھی پھانڈتے ہیں'
  practice:
  - q:
      ar: ما أشهر بناء في قرطبة؟
      en: What is Cordoba''s most famous building?
      ur: قرطہ کی سب سے مشہور عمارت کیا ہے؟
    options:
    - text:
        ar: الجامع الكبير
        en: the Great Mosque
        ur: عظیم مسجد
      correct: true
      why:
        ar: يذكر الاسم الجامع الكبير أشهر معالمها
        en: the Great Mosque is her best-known landmark
        ur: عظیم مسجد اس کی سب سے مشہور نشانی ہے
    - text:
        ar: قصر الحمراء
        en: the Alhambra
        ur: الحمرا محل
      correct: false
      why:
        ar: الحمراء في غرناطة لا قرطبة
        en: the Alhambra is in Granada, not Cordoba
        ur: الحمرا غرناطہ میں ہے، قرطہ میں نہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: قبة الصخرة في القدس
        en: the Dome of the Rock is in Jerusalem
        ur: گنبدِ صخرہ بیت المقدس میں ہے
    - text:
        ar: دار الحكمة
        en: the House of Wisdom
        ur: بیت الحکمت
      correct: false
      why:
        ar: دار الحكمة في بغداد
        en: the House of Wisdom is in Baghdad
        ur: بیت الحکمت بغداد میں ہے
  - q:
      ar: من حكم قرطبة أولًا؟
      en: Who ruled Cordoba first?
      ur: قرطہ پر پہلے کس نے حکومت کی؟
    options:
    - text:
        ar: الأمويون الهاربون من دمشق
        en: the Umayyads who escaped Damascus
        ur: دمشق سے بچ نکلنے والے اموی
      correct: true
      why:
        ar: أقاموا إمارة ثم خلافة فيها
        en: they set up an emirate then a caliphate there
        ur: انہوں نے وہاں امارت پھر خلافت قائم کی
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون حكموا بغداد لا قرطبة
        en: the Abbasids ruled Baghdad, not Cordoba
        ur: عباسیوں نے بغداد پر حکومت کی، قرطہ نہیں
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون جاءوا بعد قرون في الشرق
        en: the Ottomans came centuries later in the east
        ur: عثمانی مشرق میں صدیوں بعد آئے
    - text:
        ar: الفرنجة
        en: the Franks
        ur: فرنگی
      correct: false
      why:
        ar: الفرنجة لم يحكموا الأندلس
        en: the Franks did not rule al-Andalus
        ur: فرنگیوں نے اندلس پر حکومت نہیں کی
  - q:
      ar: متى سقطت قرطبة للنصارى؟
      en: When did Cordoba fall to the Christians?
      ur: قرطہ مسیحیوں کے ہاتھ کب گرا؟
    options:
    - text:
        ar: عام ١٢٣٦
        en: in 1236
        ur: 1236 میں
      correct: true
      why:
        ar: تذكر المصادر استيلاء النصارى ١٢٣٦
        en: the sources date the Christian capture to 1236
        ur: ماخذ مسیحی قبضہ 1236 لکھتے ہیں
    - text:
        ar: عام ١٠٩٩
        en: in 1099
        ur: 1099 میں
      correct: false
      why:
        ar: ذلك عام احتلال القدس لا سقوط قرطبة
        en: that is Jerusalem''s seizure, not Cordoba''s fall
        ur: یہ بیت المقدس کے قبضے کا سال ہے، قرطہ کے گرنے کا نہیں
    - text:
        ar: عام ١٠٣١
        en: in 1031
        ur: 1031 میں
      correct: false
      why:
        ar: ذلك عام الفتنة لا السقوط
        en: that is the fitna year, not the fall
        ur: یہ فتنے کا سال ہے، گرنے کا نہیں
    - text:
        ar: لم تسقط أبدًا
        en: it never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت للنصارى في ١٢٣٦
        en: she fell to the Christians in 1236
        ur: یہ 1236 میں مسیحیوں کے ہاتھ گرا
  - q:
      ar: ما مدينة الزهراء؟
      en: What is Madinat al-Zahra?
      ur: مدینۃ الزہرا کیا ہے؟
    options:
    - text:
        ar: المدينة التي بناها عبد الرحمن الثالث للخلافة
        en: the city Abd al-Rahman III built for the caliphate
        ur: وہ شہر جو عبدالرحمن ثالث نے خلافت کے لیے بنایا
      correct: true
      why:
        ar: تذكر المصادر بناءها قرب قرطبة
        en: the sources record her building near Cordoba
        ur: ماخذ قرطہ کے قریب اس کی تعمیر کا ذکر کرتے ہیں
    - text:
        ar: مدينة في مصر
        en: a city in Egypt
        ur: مصر کا شہر
      correct: false
      why:
        ar: الزهراء في الأندلس لا مصر
        en: al-Zahra is in al-Andalus, not Egypt
        ur: الزہرا اندلس میں ہے، مصر میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: الزهراء مدينة خلافة لا قلعة
        en: al-Zahra is a caliphate city, not a castle
        ur: الزہرا خلافت کا شہر ہے، قلعہ نہیں
    - text:
        ar: ميناء على المتوسط
        en: a Mediterranean port
        ur: بحیرہ روم کی بندرگاہ
      correct: false
      why:
        ar: الزهراء داخلية قرب قرطبة
        en: al-Zahra is inland near Cordoba
        ur: الزہرا قرطہ کے قریب اندرونی ہے
  - q:
      ar: ما فتنة ١٠٣١؟
      en: What was the fitna of 1031?
      ur: 1031 کا فتنہ کیا تھا؟
    options:
    - text:
        ar: الحرب الأهلية التي فككت الخلافة
        en: the civil war that broke the caliphate
        ur: وہ خانہ جنگی جس نے خلافت توڑی
      correct: true
      why:
        ar: انتهت الخلافة فيها إلى ملوك الطوائف
        en: the caliphate ended in it into taifa kings
        ur: اس میں خلافت ختم ہو کر طائفہ بادشاہیوں میں بٹ گئی
    - text:
        ar: غزو أجنبي
        en: a foreign invasion
        ur: غیر ملکی حملہ
      correct: false
      why:
        ar: كانت فتنة داخلية لا غزوًا
        en: it was internal strife, not invasion
        ur: یہ اندرونی فتنہ تھا، حملہ نہیں
    - text:
        ar: ثورة عبيد
        en: a slave revolt
        ur: غلاموں کی بغاوت
      correct: false
      why:
        ar: الفتنة صراع على الحكم لا ثورة عبيد
        en: the fitna was a struggle for rule, not a slave revolt
        ur: فتنہ حکمرانی پر تنازعہ تھا، غلاموں کی بغاوت نہیں
    - text:
        ar: وباء
        en: a plague
        ur: طاعون
      correct: false
      why:
        ar: الفتنة سياسية لا وبائية
        en: the fitna was political, not epidemic
        ur: فتنہ سیاسی تھا، وبائی نہیں
  - q:
      ar: كم كان في مكتبة الحكم الثاني؟
      en: How large was al-Hakam II''s library?
      ur: حکم دوم کی لائبریری کتنی بڑی تھی؟
    options:
    - text:
        ar: مئات الآلاف من المجلدات
        en: hundreds of thousands of volumes
        ur: لاکھوں جلدیں
      correct: true
      why:
        ar: تذكر المصادر عددًا قريبًا من أربعمائة ألف
        en: the sources give a number near four hundred thousand
        ur: ماخذ چار لاکھ کے قریب تعداد دیتے ہیں
    - text:
        ar: مائة كتاب
        en: a hundred books
        ur: سو کتابیں
      correct: false
      why:
        ar: مائة مكتبة بيت لا خلافة
        en: a hundred is a house library, not a caliphate''s
        ur: سو گھر کی لائبریری ہے، خلافت کی نہیں
    - text:
        ar: عشرة ملايين
        en: ten million
        ur: ایک کروڑ
      correct: false
      why:
        ar: عشرة ملايين تتجاوز ما سجلته المصادر
        en: ten million exceeds what the sources record
        ur: ایک کروڑ ماخذ کے درج سے زیادہ ہے
    - text:
        ar: لا مكتبة كانت
        en: there was no library
        ur: کوئی لائبریری نہیں تھی
      correct: false
      why:
        ar: مكتبة الحكم من أشهر المكتبات في التاريخ
        en: al-Hakam''s library is among history''s most famous
        ur: حکم کی لائبریری تاریخ کی مشہور ترین میں ہے
  - q:
      ar: لماذا اشتهرت قرطبة؟
      en: Why is Cordoba famous?
      ur: قرطہ کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت أعظم حواضر أوروبا في القرن العاشر
        en: because she was Europe''s greatest centre in the tenth century
        ur: کیونکہ یہ دسویں صدی میں یورپ کا سب سے بڑا مرکز تھا
      correct: true
      why:
        ar: جمعت العلم والعمارة والتجارة في ذروة
        en: she gathered learning, architecture and trade at a peak
        ur: اس نے علم، معماری اور تجارت کو بلندی پر جمع کیا
    - text:
        ar: لأنها كانت عاصمة الرومان دائمًا
        en: because she was always the Roman capital
        ur: کیونکہ یہ ہمیشہ رومی دارالحکومت تھا
      correct: false
      why:
        ar: لم تكن عاصمة روما قط
        en: she was never Rome''s capital
        ur: یہ کبھی روم کا دارالحکومت نہیں تھا
    - text:
        ar: لأنها على المحيط
        en: because she is on the ocean
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: قرطبة داخلية على نهر لا محيط
        en: Cordoba is inland on a river, not ocean
        ur: قرطہ اندرونِ ملک دریا پر ہے، سمندر پر نہیں
    - text:
        ar: لأنها لم تسقط
        en: because she never fell
        ur: کیونکہ یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت في ١٢٣٦
        en: she fell in 1236
        ur: یہ 1236 میں گرا
  - q:
      ar: من جاء بعد الخلافة؟
      en: Who came after the caliphate?
      ur: خلافت کے بعد کون آیا؟
    options:
    - text:
        ar: ملوك الطوائف ثم المرابطون والموحدون
        en: the taifa kings, then Almoravids and Almohads
        ur: طائفہ بادشاہ، پھر مرابطین اور موحدین
      correct: true
      why:
        ar: تفككت الخلافة إلى طوائف ثم دول المغرب
        en: the caliphate broke into taifas then Moroccan states
        ur: خلافت طائفوں میں پھر مراکشی ریاستوں میں ٹوٹی
    - text:
        ar: العباسيون مباشرة
        en: the Abbasids right away
        ur: فوراً عباسی
      correct: false
      why:
        ar: العباسيون حكموا بغداد لا الأندلس
        en: the Abbasids ruled Baghdad, not al-Andalus
        ur: عباسیوں نے بغداد پر حکومت کی، اندلس نہیں
    - text:
        ar: النصارى فورًا
        en: the Christians immediately
        ur: فوراً مسیحی
      correct: false
      why:
        ar: دامت الطوائف والمغاربة قرونًا قبل السقوط
        en: taifas and Moroccan states lasted centuries before the fall
        ur: طائفے اور مراکشی صدیوں رہے، گرنے سے پہلے
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون لم يصلوا إلى الأندلس
        en: the Ottomans never reached al-Andalus
        ur: عثمانی اندلس تک نہیں پہنچے
  - q:
      ar: على أيّ نهر قامت قرطبة؟
      en: On which river does Cordoba stand?
      ur: قرطہ کس دریا پر قائم ہے؟
    options:
    - text:
        ar: الوادي الكبير
        en: the Guadalquivir
        ur: وادی الکبیر
      correct: true
      why:
        ar: تقف المدينة على الوادي الكبير في المصادر
        en: the sources place her on the Guadalquivir
        ur: ماخذ اسے وادی الکبیر پر رکھتے ہیں
    - text:
        ar: النيل
        en: the Nile
        ur: نیل
      correct: false
      why:
        ar: النيل في مصر لا الأندلس
        en: the Nile is in Egypt, not al-Andalus
        ur: نیل مصر میں ہے، اندلس میں نہیں
    - text:
        ar: دجلة
        en: the Tigris
        ur: دجلہ
      correct: false
      why:
        ar: دجلة في العراق لا الأندلس
        en: the Tigris is in Iraq, not al-Andalus
        ur: دجلہ عراق میں ہے، اندلس میں نہیں
    - text:
        ar: الدانوب
        en: the Danube
        ur: ڈینیوب
      correct: false
      why:
        ar: الدانوب في أوروبا الشرقية لا إسبانيا
        en: the Danube is in eastern Europe, not Spain
        ur: ڈینیوب مشرقی یورپ میں ہے، سپین میں نہیں
  - q:
      ar: ماذا بقي من قرطبة؟
      en: What remains of Cordoba?
      ur: قرطہ سے کیا باقی ہے؟
    options:
    - text:
        ar: رمز تلاقي الحضارات في الأندلس
        en: the emblem of civilizations meeting in al-Andalus
        ur: اندلس میں تہذیبوں کے ملنے کی علامت
      correct: true
      why:
        ar: بقيت ذاكرتها ذروة التلاقي في المصادر
        en: her memory stays a peak of meeting in the sources
        ur: اس کی یادداشت ماخذ میں ملنے کی بلندی رہی
    - text:
        ar: لا شيء؛ هُدمت كلها
        en: nothing; it was all demolished
        ur: کچھ نہیں؛ سب مسمار کر دیا گیا
      correct: false
      why:
        ar: بقي جامعها ومعالمها وذاكرتها
        en: her mosque, landmarks and memory remain
        ur: اس کی مسجد، نشانیاں اور یادداشت باقی ہیں
    - text:
        ar: عاصمة حديثة
        en: a modern capital
        ur: جدید دارالحکومت
      correct: false
      why:
        ar: قرطبة مدينة حالية لا عاصمة
        en: Cordoba is a living city, not a capital
        ur: قرطہ ایک زندہ شہر ہے، دارالحکومت نہیں
    - text:
        ar: متحف مغلق فقط
        en: only a closed museum
        ur: صرف ایک بند عجائب گھر
      correct: false
      why:
        ar: المدينة حية بمعالمها الإسلامية
        en: the city lives with its Islamic landmarks
        ur: شہر اپنی اسلامی نشانیوں کے ساتھ زندہ ہے
- id: timbuktu
  anchor: place/timbuktu
  band: researchers
  title:
    ar: تمبكتو
    en: Timbuktu
    ur: تمبکٹو
  sixty:
    ar: 'تمبكتو مدينة الملح والذهب والكتب على حافة الصحراء الكبرى في مالي: ميناء القوافل الصحراوية التي حملت الملح من الشمال والذهب من الجنوب. بلغت ذروتها في القرنين
      الرابع عشر والخامس عشر حين حجّ مانسا موسى منها وبنى مسجد جنكربر، فصارت جامعة أفريقيا الغربية: سبعمائة ألف مخطوط في خزائن الأسر ومساجد سنكور وجنكربر وسيدي يحيى.
      حكمها المغربيون عام ١٥٩١ فنقلوا علماءها إلى مراكش، وبقيت كتبها في الصحراء حتى أنقذها أهلها من التهريب والحرب. تمبكتو اليوم شاهد على أنّ الحرف الإسلامي وصل إلى
      أعماق أفريقيا.  وبقيت تمبكتو معنًى: أن العلم قد يسكن في أقاصي الأرض ما دامت الأسر تحفظ كتبها، وأن الصحراء التي تبدو نهاية الطريق كانت جسرًا يربط الشمال بالجنوب. ومخطوطاتها اليوم في صناديق العائلات وخزائن العالم تشهد أن أفريقيا كتبت تاريخها بأيدي علمائها لا بأقلام الغرباء فقط.  ومن دروسها أن الجغرافيا لا تحدّد العلم: بيئة قاسية صنعت مكتبة، وقوافل ملحٍ حملت كتبًا، ومدينة طرفية صارت جامعة قرنها.'
    en: 'Timbuktu is the city of salt, gold and books on the edge of the Sahara in Mali: the port of the desert caravans that carried salt from the north and gold
      from the south. It peaked in the fourteenth and fifteenth centuries, when Mansa Musa made his Hajj from it and built the Djinguereber mosque; it became West
      Africa''''s university — seven hundred thousand manuscripts in family collections and the Sankore, Djinguereber and Sidi Yahya mosques. The Moroccans took it
      in 1591 and carried its scholars off to Marrakesh, but its books stayed in the desert until its people saved them from smuggling and war. Timbuktu today bears
      witness that the Islamic written word reached the depths of Africa.  Timbuktu stayed a meaning: learning can dwell at earth''s ends so long as families keep their books, and the Sahara that looks like the road''s end was really a bridge binding north and south. Its manuscripts today, in family chests and world libraries, witness that Africa wrote its history in its scholars'' own hands, not only in strangers'' pens.'
    ur: 'تمبکٹو مالی میں صحرائے کبیر کے کنارے نمک، سونے اور کتابوں کا شہر ہے: صحرائی قافلوں کی بندرگاہ جو شمال سے نمک اور جنوب سے سونہ لے کر آتے تھے۔ یہ چودہویں اور
      پندرہویں صدی میں عروج پر رہا، جب مانسا موسی نے یہاں سے حج کیا اور جنگربر مسجد بنائی؛ یہ مغربی افریقہ کا جامعہ بن گیا — خاندانی خزانوں میں سات لاکھ مخطوطے اور
      سنکور، جنگربر اور سیدی یحییٰ کی مسجدیں۔ مراکشیوں نے 1591 میں اسے لیا اور اس کے علماء کو مراکش لے گئے، مگر اس کی کتابیں صحرا میں رہیں جب تک کہ اس کے لوگوں نے
      انہیں اسمگلنگ اور جنگ سے بچا لیا۔ تمبکٹو آج گواہ ہے کہ اسلامی تحریر افریقہ کی گہرائیوں تک پہنچی تھی۔  تمبکٹو ایک مفہوم رہا: علم زمین کے کناروں تک بھی رہ سکتا ہے جب تک خاندان اپنی کتابیں سنبھالیں، اور وہ صحرا جو راستے کا آخر لگتا ہے اصل میں شمال اور جنوب کا پل تھا۔ اس کے مخطوطے آج خاندانی صندوقوں اور عالمی کتب خانوں میں گواہ ہیں کہ افریقہ نے اپنی تاریخ اپنے علماء کے ہاتھوں لکھی، محض اجنبیوں کے قلموں سے نہیں۔'
  glossary:
  - term:
      ar: مالي
      en: Mali
      ur: مالی
    gloss:
      ar: 'المملكة الغرب أفريقية التي قامت على طرق الملح والذهب في الصحراء'
      en: 'the West African kingdom built on the salt and gold roads of the Sahara'
      ur: 'مغربی افریقی سلطنت جو صحرا کے نمک اور سونے کے راستوں پر قائم ہوئی'
  - term:
      ar: الصحراء الكبرى
      en: the Sahara
      ur: صحرائے کبیر
    gloss:
      ar: 'الصحراء الكبرى التي كانت للقوافل بحرًا بدل السفن'
      en: 'the Great Desert that served the caravans as a sea instead of ships'
      ur: 'وہ عظیم صحرا جو قافلوں کے لیے جہازوں کی جگہ سمندر بنا'
  - term:
      ar: الملح
      en: the salt
      ur: نمک
    gloss:
      ar: 'سلعة الشمال التي كانت القوافل تحملها من مناجم الجزائر'
      en: 'the northern goods the caravans carried down from the Algerian mines'
      ur: 'شمال کی وہ جنس جو قافلے الجزائر کی کانوں سے نیچے لاتے تھے'
  - term:
      ar: الذهب
      en: the gold
      ur: سونا
    gloss:
      ar: 'ثروة الجنوب التي جعلت مالي أغنى ممالك أفريقيا'
      en: 'the southern wealth that made Mali the richest kingdom in Africa'
      ur: 'جنوب کی وہ دولت جس نے مالی کو افریقہ کی امیر ترین سلطنت بنا دیا'
  - term:
      ar: مانسا موسى
      en: Mansa Musa
      ur: مانسا موسی
    gloss:
      ar: 'الملك الحاج الذي بنى جنغربر وأغرق القاهرة بالذهب في حجّه'
      en: 'the pilgrim king who built Djinguereber and flooded Cairo with gold on his Hajj'
      ur: 'حجاز جانے والا بادشاہ جس نے جنگربر بنائی اور حج کے سفر میں قاہرہ کو سونے سے بھر دیا'
  - term:
      ar: جنگربر
      en: Djinguereber
      ur: جنگربر
    gloss:
      ar: 'أشهر مسجد في المدينة، بناه مانسا موسى بعد عودته'
      en: 'the city''s most famous mosque, which Mansa Musa built on his return'
      ur: 'شہر کی مشہور ترین مسجد جو مانسا موسی نے واپسی پر بنوائی'
  - term:
      ar: سنكور
      en: Sankore
      ur: سنکور
    gloss:
      ar: 'جامعتها الكبرى التي ضمّت آلاف الطلاب في عهدها'
      en: 'the great university that held thousands of students in its day'
      ur: 'اس کی عظیم یونیورسٹی جس میں اپنے دور میں ہزاروں طالب علم تھے'
  - term:
      ar: المخطوطات
      en: the manuscripts
      ur: مخطوطے
    gloss:
      ar: 'كتبها المخطوطة التي حفظتها الأسر في الصناديق أجيالًا'
      en: 'her handwritten books, which families kept in chests for generations'
      ur: 'اس کے ہاتھ کے لکھے کتابچے جو خاندانوں نے صدیوں تک صندوقوں میں سمیٹ رکھے'
  - term:
      ar: مراكش
      en: Marrakesh
      ur: مراکش
    gloss:
      ar: 'المدينة المغربية التي نُقل إليها علماؤها بعد الفتح'
      en: 'the Moroccan city to which her scholars were carried after the conquest'
      ur: 'وہ مراکشی شہر جہاں فتح کے بعد اس کے علماء لے جائے گئے'
  - term:
      ar: ١٥٩١
      en: '1591'
      ur: '1591'
    gloss:
      ar: 'سنة الاحتلال المغربي التي أنهت عصرها الذهبي'
      en: 'the year of the Moroccan occupation that ended her golden age'
      ur: 'مراکشی قبضے کا سال جس نے اس کے زریں دور کا خاتمہ کیا'
  - term:
      ar: القوافل
      en: the caravans
      ur: قافلے
    gloss:
      ar: 'طرق الصحراء التي حملت التجارة والكتب معًا عبر الرمال'
      en: 'the desert roads that carried trade and books together across the sands'
      ur: 'صحرا کے وہ راستے جو تجارت اور کتابیں دونوں ریت پار لے جاتے تھے'
  - term:
      ar: الأسر
      en: the families
      ur: خاندان
    gloss:
      ar: 'الأسر العلمية التي ورثت المخطوطات وحفظتها'
      en: 'the learned families that inherited the manuscripts and guarded them'
      ur: 'وہ علمی خاندان جنھوں نے مخطوطے وراثت میں پائے اور سمحالے'
  practice:
  - q:
      ar: أين تقع تمبكتو؟
      en: Where is Timbuktu?
      ur: تمبکٹو کہاں ہے؟
    options:
    - text:
        ar: على حافة الصحراء الكبرى في مالي
        en: on the Sahara''s edge in Mali
        ur: مالی میں صحرائے کبیر کے کنارے
      correct: true
      why:
        ar: تقف المدينة شمال النيجر على طريق القوافل
        en: the city stands north of the Niger on the caravan road
        ur: شہر نائجر کے شمال میں قافلہ راہ پر ہے
    - text:
        ar: في مصر
        en: in Egypt
        ur: مصر میں
      correct: false
      why:
        ar: تمبكتو في غرب أفريقيا لا مصر
        en: Timbuktu is in West Africa, not Egypt
        ur: تمبکٹو مغربی افریقہ میں ہے، مصر میں نہیں
    - text:
        ar: في الجزيرة العربية
        en: in Arabia
        ur: جزیرۃ العرب میں
      correct: false
      why:
        ar: هي في أفريقيا لا الجزيرة
        en: she is in Africa, not Arabia
        ur: یہ افریقہ میں ہے، جزیرے میں نہیں
    - text:
        ar: في الهند
        en: in India
        ur: ہندوستان میں
      correct: false
      why:
        ar: بعيدة عن الهند في غرب أفريقيا
        en: far from India, in West Africa
        ur: ہندوستان سے دور، مغربی افریقہ میں
  - q:
      ar: ماذا حملت قوافل تمبكتو؟
      en: What did Timbuktu''s caravans carry?
      ur: تمبکٹو کے قافلے کیا لے کر آتے تھے؟
    options:
    - text:
        ar: الملح من الشمال والذهب من الجنوب
        en: salt from the north and gold from the south
        ur: شمال سے نمک اور جنوب سے سونا
      correct: true
      why:
        ar: جمعت طريقها بين مناجم الملح ومناجم الذهب
        en: her road joined the salt mines to the gold fields
        ur: اس کی راہ نے نمک کی کانوں کو سونے کی کانوں سے جوڑا
    - text:
        ar: الحرير من الصين
        en: silk from China
        ur: چین سے ریشم
      correct: false
      why:
        ar: كان بضاعتها الملح والذهب لا الحرير
        en: her goods were salt and gold, not silk
        ur: اس کا سامان نمک اور سونا تھا، ریشم نہیں
    - text:
        ar: النفط
        en: oil
        ur: تیل
      correct: false
      why:
        ar: لم يكن النفط تجارة القوافل
        en: oil was not the caravans'' goods
        ur: تیل قافلوں کا سامان نہیں تھا
    - text:
        ar: الكتب من أوروبا
        en: books from Europe
        ur: یورپ سے کتابیں
      correct: false
      why:
        ar: كانت كتبها محلية التأليف لا مستوردة
        en: her books were locally authored, not imported
        ur: اس کی کتابیں مقامی تصنیف تھیں، درآمدہ نہیں
  - q:
      ar: من بنى مسجد جنكربر؟
      en: Who built the Djinguereber mosque?
      ur: جنگربر مسجد کس نے بنائی؟
    options:
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسی
      correct: true
      why:
        ar: تنسب المصادر بناءه إلى الملك الحاج
        en: the sources credit the pilgrim king
        ur: ماخذ اسے حاجی بادشاہ سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين في مصر والشام لا مالي
        en: Saladin was in Egypt and Syria, not Mali
        ur: صلاح الدین مصر اور شام میں تھا، مالی میں نہیں
    - text:
        ar: عبد الرحمن الثالث
        en: Abd al-Rahman III
        ur: عبدالرحمن ثالث
      correct: false
      why:
        ar: كان في الأندلس لا أفريقيا الغربية
        en: he was in al-Andalus, not West Africa
        ur: وہ اندلس میں تھا، مغربی افریقہ میں نہیں
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: كان هولاكو مغوليًّا مدمرًا لا بانيًا
        en: Hulagu was a Mongol destroyer, not a builder
        ur: ہلاکو مغل تباہ کن تھا، بنانے والا نہیں
  - q:
      ar: كم مخطوطًا في تمبكتو؟
      en: How many manuscripts in Timbuktu?
      ur: تمبکٹو میں کتنے مخطوطے ہیں؟
    options:
    - text:
        ar: نحو سبعمائة ألف
        en: about seven hundred thousand
        ur: تقریباً سات لاکھ
      correct: true
      why:
        ar: تذكر المصادر هذا العدد في خزائن الأسر
        en: the sources give this count in family collections
        ur: ماخذ خاندانی خزانوں میں یہی تعداد دیتے ہیں
    - text:
        ar: مائة
        en: a hundred
        ur: سو
      correct: false
      why:
        ar: مائة مكتبة صغيرة لا جامعة
        en: a hundred is a small library, not a university
        ur: سو ایک چھوٹی لائبریری ہے، جامعہ نہیں
    - text:
        ar: مليار
        en: a billion
        ur: ایک ارب
      correct: false
      why:
        ar: مليار يتجاوز ما سجلته المصادر
        en: a billion exceeds what the sources record
        ur: ایک ارب ماخذ کے درج سے زیادہ ہے
    - text:
        ar: لا مخطوطات
        en: no manuscripts
        ur: کوئی مخطوطے نہیں
      correct: false
      why:
        ar: تعد مكتبتها من أعظم مكتبات أفريقيا
        en: her library is among Africa''s greatest
        ur: اس کی لائبریری افریقہ کی عظیم ترین میں شمار ہوتی ہے
  - q:
      ar: ماذا حدث عام ١٥٩١؟
      en: What happened in 1591?
      ur: 1591 میں کیا ہوا؟
    options:
    - text:
        ar: استولى المغرب على تمبكتو
        en: Morocco seized Timbuktu
        ur: مراکش نے تمبکٹو پر قبضہ کیا
      correct: true
      why:
        ar: نقلوا علماءها إلى مراكش في المصادر
        en: the sources have her scholars carried to Marrakesh
        ur: ماخذ میں اس کے علماء مراکش لے جائے گئے
    - text:
        ar: بنى مانسا موسى المسجد
        en: Mansa Musa built the mosque
        ur: مانسا موسی نے مسجد بنائی
      correct: false
      why:
        ar: كان البناء قبل قرنين
        en: the building was two centuries earlier
        ur: تعمیر دو صدیاں پہلے ہوئی تھی
    - text:
        ar: وصل الأوروبيون أول مرة
        en: Europeans arrived for the first time
        ur: یورپی پہلی بار پہنچے
      correct: false
      why:
        ar: كان الأوروبيون قد وصلوا قبل ذلك
        en: Europeans had reached her earlier
        ur: یورپی پہلے پہنچ چکے تھے
    - text:
        ar: انتهت التجارة نهائيًّا
        en: trade ended forever
        ur: تجارت ہمیشہ کے لیے ختم ہو گئی
      correct: false
      why:
        ar: استمرت التجارة رغم تغير الحكم
        en: trade went on though the rule changed
        ur: حکومت بدلنے کے باوجود تجارت جاری رہی
  - q:
      ar: من حفظ مخطوطات تمبكتو؟
      en: Who kept Timbuktu''s manuscripts?
      ur: تمبکٹو کے مخطوطے کس نے محفوظ کیے؟
    options:
    - text:
        ar: الأسر في بيوتها
        en: the families in their homes
        ur: خاندان اپنے گھروں میں
      correct: true
      why:
        ar: انتقلت الكتب بين أيدي الأسر لأجيال
        en: the books passed between families for generations
        ur: کتابیں نسلوں تک خاندانوں کے ہاتھ رہیں
    - text:
        ar: الحكومة المركزية فقط
        en: only the central government
        ur: صرف مرکزی حکومت
      correct: false
      why:
        ar: كانت المخطوطات في خزائن الأسر لا الدولة
        en: the manuscripts were in family holdings, not the state''s
        ur: مخطوطے خاندانی خزانوں میں تھے، ریاست کے نہیں
    - text:
        ar: الاستعمار الفرنسي
        en: the French colonizers
        ur: فرانسیسی نوآبادکار
      correct: false
      why:
        ar: حفظها أهلها لا المستعمر
        en: her people kept them, not the colonizer
        ur: انہیں اس کے لوگوں نے محفوظ کیا، نوآبادکار نہیں
    - text:
        ar: لا أحد؛ ضاعت كلها
        en: nobody; all were lost
        ur: کوئی نہیں؛ سب کھو گئے
      correct: false
      why:
        ar: نجت معظمها بجهود أهلها
        en: most survived through her people''s efforts
        ur: زیادہ تر اس کے لوگوں کی کوشش سے بچ گئے
  - q:
      ar: لماذا اشتهرت تمبكتو؟
      en: Why is Timbuktu famous?
      ur: تمبکٹو کیوں مشہور ہے؟
    options:
    - text:
        ar: لأنها كانت جامعة أفريقيا الغربية
        en: because she was West Africa''s university
        ur: کیونکہ یہ مغربی افریقہ کا جامعہ تھا
      correct: true
      why:
        ar: جمعت المساجد والمدارس والمخطوطات
        en: she gathered mosques, schools and manuscripts
        ur: اس نے مسجدیں، مکاتب اور مخطوطے جمع کیے
    - text:
        ar: لأنها كانت عاصمة العالم
        en: because she was the world''s capital
        ur: کیونکہ یہ دنیا کا دارالحکومت تھا
      correct: false
      why:
        ar: لم تكن عاصمة عالمية قط
        en: she was never a world capital
        ur: یہ کبھی عالمی دارالحکومت نہیں رہی
    - text:
        ar: لأنها على البحر
        en: because she is on the sea
        ur: کیونکہ یہ سمندر پر ہے
      correct: false
      why:
        ar: تمبكتو صحراوية لا بحرية
        en: Timbuktu is desert, not coastal
        ur: تمبکٹو صحرائی ہے، ساحلی نہیں
    - text:
        ar: لأنها اخترعت الكتابة
        en: because she invented writing
        ur: کیونکہ اس نے تحریر ایجاد کی
      correct: false
      why:
        ar: لم تخترع الكتابة بل حفظها
        en: she did not invent writing, she preserved it
        ur: اس نے تحریر ایجاد نہیں کی، محفوظ کی
  - q:
      ar: ماذا تدلّ تمبكتو على الإسلام؟
      en: What does Timbuktu show about Islam?
      ur: تمبکٹو اسلام کے بارے میں کیا بتاتا ہے؟
    options:
    - text:
        ar: أنّ الحرف الإسلامي وصل إلى أعماق أفريقيا
        en: that the Islamic written word reached deep into Africa
        ur: کہ اسلامی تحریر افریقہ کی گہرائیوں تک پہنچی
      correct: true
      why:
        ar: شهدت على انتقال العلم إلى قلب القارة
        en: she witnessed learning reaching the continent''s heart
        ur: اس نے علم کے براعظم کے دل تک پہنچنے کی گواہی دی
    - text:
        ar: أنّ الإسلام بقي على الساحل فقط
        en: that Islam stayed only on the coast
        ur: کہ اسلام صرف ساحل تک رہا
      correct: false
      why:
        ar: بلغت المدينة قلب أفريقيا الداخلية
        en: the city reached Africa''s inland heart
        ur: شہر افریقہ کے اندرونی دل تک پہنچا
    - text:
        ar: أنّ الإسلام لم يصل إلى أفريقيا
        en: that Islam never reached Africa
        ur: کہ اسلام افریقہ تک نہیں پہنچا
      correct: false
      why:
        ar: كانت تمبكتو مركزًا إسلاميًّا كبيرًا
        en: Timbuktu was a great Islamic centre
        ur: تمبکٹو ایک بڑا اسلامی مرکز تھا
    - text:
        ar: أنّها كانت مدينة أوروبية
        en: that she was a European city
        ur: کہ یہ ایک یورپی شہر تھا
      correct: false
      why:
        ar: كانت أفريقية إسلامية لا أوروبية
        en: she was African-Islamic, not European
        ur: یہ افریقی-اسلامی تھی، یورپی نہیں
  - q:
      ar: من كتب عن تمبكتو؟
      en: Who wrote about Timbuktu?
      ur: تمبکٹو کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو الصحراء مثل مؤلفي التاريخين المحليين
        en: Saharan historians like the authors of the local chronicles
        ur: صحرا کے مؤرخین جیسے مقامی تواریخ کے مصنف
      correct: true
      why:
        ar: تصلنا تاريخ السودان وتاريخ الفتاش
        en: the Tarikh al-Sudan and Tarikh al-Fattash reach us
        ur: تاریخ السودان اور تاریخ الفتاش ہم تک پہنچی ہیں
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب أهلها عنها قبل الأوروبيين
        en: her people wrote of her before Europeans
        ur: اس کے لوگوں نے یورپیوں سے پہلے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقها مؤرخوها وعلماؤها
        en: her historians and scholars documented her
        ur: اس کے مؤرخین اور علماء نے اسے ثبت کیا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون لم يصلوا إليها
        en: the Ottomans never reached her
        ur: عثمانی اس تک نہیں پہنچے
  - q:
      ar: ماذا أثبتت تمبكتو للعالم؟
      en: What did Timbuktu prove to the world?
      ur: تمبکٹو نے دنیا کو کیا ثابت کیا؟
    options:
    - text:
        ar: أنّ القلب الإسلامي امتدّ من الصحراء إلى النيجر
        en: that the Islamic heartland stretched from the Sahara to the Niger
        ur: کہ اسلامی مرکز صحرا سے نائجر تک پھیلا
      correct: true
      why:
        ar: شهدت على انتشار الحرف في عمق أفريقيا
        en: she witnessed the written word spreading deep in Africa
        ur: اس نے افریقہ کی گہرائی میں تحریر کے پھیلاؤ کی گواہی دی
    - text:
        ar: أنّ أفريقيا بلا تاريخ
        en: that Africa had no history
        ur: کہ افریقہ کی کوئی تاریخ نہیں
      correct: false
      why:
        ar: كانت تمبكتو مركزًا للتاريخ والكتب
        en: Timbuktu was a centre of history and books
        ur: تمبکٹو تاریخ اور کتابوں کا مرکز تھا
    - text:
        ar: أنّ الصحراء خالية
        en: that the Sahara was empty
        ur: کہ صحرا خالی تھا
      correct: false
      why:
        ar: كانت الصحراء ممرًّا للقوافل والعلم
        en: the Sahara was a road for caravans and learning
        ur: صحرا قافلوں اور علم کی راہ تھی
    - text:
        ar: أنّ الإسلام لم يعرف أفريقيا
        en: that Islam never knew Africa
        ur: کہ اسلام نے افریقہ کو نہیں جانا
      correct: false
      why:
        ar: وصلت المدينة قلب أفريقيا الإسلامي
        en: the city reached Africa''s Islamic heart
        ur: شہر افریقہ کے اسلامی دل تک پہنچا
- id: cairo
  anchor: place/cairo
  band: scholars
  title:
    ar: القاهرة
    en: Cairo
    ur: قاہرہ
  sixty:
    ar: 'القاهرة مدينة الألف مئذنة: أسّسها الفاطميون عام ٩٦٩ شمال الفسطاط قاعدةً لخلافتهم، وجعلها صلاح الدين قلب مقاومة الصليبيين. بلغت أوجها في العصر المملوكي: الأزهر
      منذ ٩٧٠ أقدم جامعة مستمرة في العالم، وقلعة صلاح الدين على المقطم، وأسواق خان الخليلي وأعمال محمد علي في القرن التاسع عشر. جمعت القاهرة الفاطمي والأيوبي والمملوكي
      والعثماني في نسيج واحد، وبقيت أكبر مدن العالم الإسلامي إلى اليوم.  وما زالت القاهرة مدينة تُقرأ طبقاتها: فاطمية في الأزهر، وصلاحية في القلعة، ومملوكية في المآذن، وعثمانية في الأحياء، وحديثة في النيل الذي يمر بها كما مرّ بها الفراعنة. ومن القاهرة خرجت طباعة الكتب الأولى في العالم العربي، وصارت عاصمة الثقافة العربية في العصر الحديث بأدبائها وفنانيها.  وحول المدينة قصة أعمق: من بنى الفسطاط العرب الأوائل، ومن بنى القاهرة الفاطميون، فصارت كل حيّ منها صفحة في تاريخ المسلمين.'
    en: 'Cairo is the city of a thousand minarets: the Fatimids founded it in 969 north of Fustat as their caliphate''''s base, and Saladin made it the heart of resistance
      to the Crusaders. It peaked in the Mamluk era: al-Azhar since 970 the world''''s oldest continuous university, Saladin''''s citadel on the Muqattam hill, the
      Khan al-Khalili markets and Muhammad Ali''''s nineteenth-century works. Cairo wove Fatimid, Ayyubid, Mamluk and Ottoman into one fabric, and it remains the
      Islamic world''''s largest city to this day.  Cairo is still a city read in layers: Fatimid in al-Azhar, Saladin''s in the Citadel, Mamluk in the minarets, Ottoman in the quarters, modern along the same Nile that passed the pharaohs. Out of Cairo came the Arab world''s first book printing, and it became modern Arab culture''s capital with its writers and artists.'
    ur: 'قاہرہ ہزاروں میناروں کا شہر ہے: فاطمیوں نے 969 میں فسطاط کے شمال میں اپنی خلافت کی بنیاد کے طور پر بسایا، اور صلاح الدین نے اسے صلیبیوں کے مقابلہ کا دل بنایا۔
      یہ مملوکی دور میں عروج پر رہا: 970 سے قائم الازہر دنیا کا قدیم ترین مسلسل جامعہ، مقطم پہاڑی پر صلاح الدین کا قلعہ، خان الخلیلی کی مارکیٹیں اور انیسویں صدی میں
      محمد علی کی تعمیرات۔ قاہرہ نے فاطمی، ایوبی، مملوکی اور عثمانی کو ایک تانے بانے میں بُنا، اور یہ آج بھی اسلامی دنیا کا سب سے بڑا شہر ہے۔  قاہرہ اب بھی تہوں میں پڑھا جانے والا شہر ہے: ازہر میں فاطمی، قلعے میں صلاحی، میناروں میں مملوکی، محلوں میں عثمانی، اور اسی نیل کے ساتھ جدید جو فرعونوں کے پاس سے بھی گزرتا تھا۔ قاہرہ سے عرب دنیا کی پہلی کتابی طباعت نکلی، اور یہ اپنے ادیبوں اور فنکاروں کے ساتھ جدید عرب ثقافت کا دارالحکومت بنا۔'
  glossary:
  - term:
      ar: الفسطاط
      en: Fustat
      ur: فسطاط
    gloss:
      ar: 'أول مدينة عربية في مصر بناها عمرو بن العاص قبلها'
      en: 'the first Arab city in Egypt, which Amr ibn al-As built before her'
      ur: 'مصر کا پہلا عرب شہر جو عمرو بن العاص نے اس سے پہلے بنایا'
  - term:
      ar: الفاطميون
      en: the Fatimids
      ur: فاطمی
    gloss:
      ar: 'السلالة الشيعية التي أسست المدينة عاصمةً لها سنة ٩٦٩م'
      en: 'the Shi''i dynasty that founded the city as its capital in 969'
      ur: 'شیعہ خاندان جس نے 969 میں شہر کو اپنا دارالحکومت بنایا'
  - term:
      ar: الأزهر
      en: al-Azhar
      ur: الازہر
    gloss:
      ar: 'جامعها الأزهر الذي صار أقدم جامعة عاملة في العالم'
      en: 'her Azhar mosque, which grew into the world''s oldest still-running university'
      ur: 'اس کی ازہر مسجد جو دنیا کی قدیم ترین چلتی ہوئی یونیورسٹی بن گئی'
  - term:
      ar: قلعة صلاح الدين
      en: Saladin''s citadel
      ur: صلاح الدین کا قلعہ
    gloss:
      ar: 'قلعته على جبل المقطم التي صارت رمز عصر مقاومة الصليبيين'
      en: 'his citadel on the Muqattam hill, which became the emblem of the anti-Crusader age'
      ur: 'مقطم پہاڑی پر اس کا قلعہ جو صلیبیوں کے خلاف دور کی علامت بنا'
  - term:
      ar: المماليك
      en: the Mamluks
      ur: مملوک
    gloss:
      ar: 'سلالة الحكام العسكريين التي ملأت المدينة مآذنَ ومدارس'
      en: 'the dynasty of soldier-rulers that filled the city with minarets and schools'
      ur: 'سپاہی حکمرانوں کا خاندان جس نے شہر کو میناروں اور مدرسوں سے بھر دیا'
  - term:
      ar: خان الخليلي
      en: Khan al-Khalili
      ur: خان الخلیلی
    gloss:
      ar: 'سوقها الشهير الذي بقي من أيام المماليك إلى يومنا'
      en: 'her famous market, which has lasted from Mamluk days until our own'
      ur: 'اس کا مشہور بازار جو مملوکوں کے زمانے سے آج تک قائم ہے'
  - term:
      ar: محمد علي
      en: Muhammad Ali
      ur: محمد علی
    gloss:
      ar: 'حاكم مصر الذي شرع في تحديثها بالمصانع والمدارس'
      en: 'Egypt''s ruler who set to modernizing her with factories and schools'
      ur: 'مصر کا حکمران جس نے کارخانوں اور اسکولوں سے اسے جدید بنانا شروع کیا'
  - term:
      ar: المقطم
      en: the Muqattam
      ur: مقطم
    gloss:
      ar: 'التل الشرقي الذي يحمل القلعة وكثيرًا من أقدم المساجد'
      en: 'the eastern hill that carries the citadel and many of the oldest mosques'
      ur: 'مشرقی پہاڑی جس پر قلعہ اور بہت سی قدیم مساجد ہیں'
  - term:
      ar: الأيوبيون
      en: the Ayyubids
      ur: ایوبی
    gloss:
      ar: 'سلالة صلاح الدين التي حكمت مصر والشام بعد الفاطميين'
      en: 'Saladin''s dynasty, which ruled Egypt and Syria after the Fatimids'
      ur: 'صلاح الدین کا خاندان جس نے فاطمیوں کے بعد مصر اور شام پر حکومت کی'
  - term:
      ar: ٩٦٩
      en: '969'
      ur: '969'
    gloss:
      ar: 'سنة تأسيسها الفاطمي شمال الفسطاط'
      en: 'the year of her Fatimid founding, north of Fustat'
      ur: 'فسطاط کے شمال میں فاطمی قیام کا سال'
  - term:
      ar: الألف مئذنة
      en: the thousand minarets
      ur: ہزار مینار
    gloss:
      ar: 'لقبها لكثرة المآذن التي تزحم كل حيّ وكل عصر'
      en: 'her nickname for the minarets crowding every quarter and every era'
      ur: 'اس کا لقب ان میناروں کی کثرت پر جو ہر محلے اور ہر دور میں ہیں'
  - term:
      ar: النيل
      en: the Nile
      ur: نیل
    gloss:
      ar: 'النهر العظيم الذي قامت عليه منذ أيام الفراعنة'
      en: 'the great river she has stood on since the days of the pharaohs'
      ur: 'وہ عظیم دریا جس پر وہ فرعونوں کے زمانے سے قائم ہے'
  practice:
  - q:
      ar: من أسّس القاهرة؟
      en: Who founded Cairo?
      ur: قاہرہ کس نے بسایا؟
    options:
    - text:
        ar: الفاطميون عام ٩٦٩
        en: the Fatimids in 969
        ur: فاطمیوں نے 969 میں
      correct: true
      why:
        ar: تنسب المصادر تأسيسها إلى جوهر والفاطميين
        en: the sources credit Jawhar and the Fatimids
        ur: ماخذ اسے جوہر اور فاطمیوں سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعد تأسيسها بقرنين
        en: Saladin came two centuries after her founding
        ur: صلاح الدین اس کی بنیاد سے دو صدیاں بعد آیا
    - text:
        ar: المماليك
        en: the Mamluks
        ur: مملوک
      correct: false
      why:
        ar: حكمها المماليك بعد الفاطميين
        en: the Mamluks ruled her after the Fatimids
        ur: مملوکوں نے فاطمیوں کے بعد حکومت کی
    - text:
        ar: محمد علي
        en: Muhammad Ali
        ur: محمد علی
      correct: false
      why:
        ar: جاء محمد علي في القرن التاسع عشر
        en: Muhammad Ali came in the nineteenth century
        ur: محمد علی انیسویں صدی میں آیا
  - q:
      ar: ما الأزهر؟
      en: What is al-Azhar?
      ur: الازہر کیا ہے؟
    options:
    - text:
        ar: أقدم جامعة مستمرة في العالم منذ ٩٧٠
        en: the world''s oldest continuous university since 970
        ur: 970 سے دنیا کا قدیم ترین مسلسل جامعہ
      correct: true
      why:
        ar: أسّسه الفاطميون مسجدًا وجامعًا في المصادر
        en: the sources have the Fatimids build it mosque and college
        ur: ماخذ میں فاطمیوں نے اسے مسجد اور جامعہ بنایا
    - text:
        ar: قصر الخليفة
        en: the caliph''s palace
        ur: خلیفہ کا محل
      correct: false
      why:
        ar: الأزهر مؤسسة علم لا قصر
        en: al-Azhar is a learning institution, not a palace
        ur: الازہر علمی ادارہ ہے، محل نہیں
    - text:
        ar: مستشفى
        en: a hospital
        ur: اسپتال
      correct: false
      why:
        ar: الأزهر جامعة لا مستشفى
        en: al-Azhar is a university, not a hospital
        ur: الازہر جامعہ ہے، اسپتال نہیں
    - text:
        ar: سوق
        en: a market
        ur: بازار
      correct: false
      why:
        ar: الأزهر جامعة لا سوق
        en: al-Azhar is a university, not a market
        ur: الازہر جامعہ ہے، بازار نہیں
  - q:
      ar: أين قلعة صلاح الدين؟
      en: Where is Saladin''s citadel?
      ur: صلاح الدین کا قلعہ کہاں ہے؟
    options:
    - text:
        ar: على جبل المقطم
        en: on the Muqattam hill
        ur: مقطم پہاڑی پر
      correct: true
      why:
        ar: تقف القلعة على الجبل في المصادر
        en: the sources place the citadel on the hill
        ur: ماخذ قلعے کو پہاڑی پر رکھتے ہیں
    - text:
        ar: في الإسكندرية
        en: in Alexandria
        ur: اسکندریہ میں
      correct: false
      why:
        ar: القلعة في القاهرة لا الإسكندرية
        en: the citadel is in Cairo, not Alexandria
        ur: قلعہ قاہرہ میں ہے، اسکندریہ میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: بنيت القلعة في مصر لا الشام
        en: the citadel was built in Egypt, not Syria
        ur: قلعہ مصر میں بنا، شام میں نہیں
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: لا علاقة للقلعة بمكة
        en: the citadel has nothing to do with Mecca
        ur: قلعے کا مکہ سے کوئی تعلق نہیں
  - q:
      ar: من جعل القاهرة قلب المقاومة؟
      en: Who made Cairo the heart of resistance?
      ur: قاہرہ کو مزاحمت کا دل کس نے بنایا؟
    options:
    - text:
        ar: صلاح الدين ضد الصليبيين
        en: Saladin against the Crusaders
        ur: صلاح الدین نے، صلیبیوں کے مقابلہ میں
      correct: true
      why:
        ar: جعلها مركز مواجهة الفرنجة في المصادر
        en: the sources have him make it the centre against the Franks
        ur: ماخذ میں اس نے اسے فرنگیوں کے مقابلہ کا مرکز بنایا
    - text:
        ar: الفاطميون ضد المغول
        en: the Fatimids against the Mongols
        ur: فاطمیوں نے، مغولوں کے مقابلہ میں
      correct: false
      why:
        ar: جاء المغول بعد الفاطميين بقرون
        en: the Mongols came centuries after the Fatimids
        ur: مغل فاطمیوں سے صدیوں بعد آئے
    - text:
        ar: محمد علي ضد أوروبا
        en: Muhammad Ali against Europe
        ur: محمد علی نے، یورپ کے مقابلہ میں
      correct: false
      why:
        ar: كان محمد علي في القرن التاسع عشر لا الصليبيين
        en: Muhammad Ali is nineteenth-century, not Crusader-era
        ur: محمد علی انیسویں صدی کا ہے، صلیبی دور کا نہیں
    - text:
        ar: العثمانيون ضد الفرس
        en: the Ottomans against the Persians
        ur: عثمانیوں نے، فارسیوں کے مقابلہ میں
      correct: false
      why:
        ar: جعل صلاح الدين القاهرة قلب المقاومة
        en: Saladin made Cairo the resistance heart
        ur: صلاح الدین نے قاہرہ کو مزاحمت کا دل بنایا
  - q:
      ar: ما خان الخليلي؟
      en: What is Khan al-Khalili?
      ur: خان الخلیلی کیا ہے؟
    options:
    - text:
        ar: سوقها المشهور من العصر المملوكي
        en: her famous market from the Mamluk era
        ur: اس کی مشہور مملوکی مارکیٹ
      correct: true
      why:
        ar: بقي السوق مركز تجارتها في المصادر
        en: the market stayed her trade centre in the sources
        ur: مارکیٹ ماخذ میں اس کے تجارت کا مرکز رہی
    - text:
        ar: مستشفى قديم
        en: an old hospital
        ur: پرانا اسپتال
      correct: false
      why:
        ar: خان الخليلي سوق لا مستشفى
        en: Khan al-Khalili is a market, not a hospital
        ur: خان الخلیلی بازار ہے، اسپتال نہیں
    - text:
        ar: مكتبة عباسية
        en: an Abbasid library
        ur: عباسی لائبریری
      correct: false
      why:
        ar: خان الخليلي في القاهرة لا بغداد
        en: Khan al-Khalili is in Cairo, not Baghdad
        ur: خان الخلیلی قاہرہ میں ہے، بغداد میں نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: خان الخليلي سوق مملوكي لا صليبي
        en: Khan al-Khalili is a Mamluk market, not Crusader
        ur: خان الخلیلی مملوکی بازار ہے، صلیبی نہیں
  - q:
      ar: ما الفسطاط؟
      en: What is Fustat?
      ur: فسطاط کیا ہے؟
    options:
    - text:
        ar: المدينة العربية الأولى في مصر قبل القاهرة
        en: the first Arab city in Egypt before Cairo
        ur: قاہرہ سے پہلے مصر کا پہلا عرب شہر
      correct: true
      why:
        ar: قامت قبل القاهرة في المصادر
        en: the sources have her before Cairo
        ur: ماخذ میں وہ قاہرہ سے پہلے ہے
    - text:
        ar: عاصمة الأندلس
        en: the Andalusi capital
        ur: اندلس کا دارالحکومت
      correct: false
      why:
        ar: الفسطاط في مصر لا الأندلس
        en: Fustat is in Egypt, not al-Andalus
        ur: فسطاط مصر میں ہے، اندلس میں نہیں
    - text:
        ar: مدينة فارسية
        en: a Persian city
        ur: فارسی شہر
      correct: false
      why:
        ar: الفسطاط عربية مصرية لا فارسية
        en: Fustat is Arab-Egyptian, not Persian
        ur: فسطاط عربی-مصری ہے، فارسی نہیں
    - text:
        ar: ميناء على المتوسط
        en: a Mediterranean port
        ur: بحیرہ روم کی بندرگاہ
      correct: false
      why:
        ar: الفسطاط على النيل لا المتوسط
        en: Fustat is on the Nile, not the Mediterranean
        ur: فسطاط نیل پر ہے، بحیرہ روم پر نہیں
  - q:
      ar: كم قديم الأزهر؟
      en: How old is al-Azhar?
      ur: الازہر کتنا پرانا ہے؟
    options:
    - text:
        ar: منذ ٩٧٠، أكثر من ألف عام
        en: since 970, over a thousand years
        ur: 970 سے، ایک ہزار سال سے زیادہ
      correct: true
      why:
        ar: تذكر المصادر تأسيسه ٩٧٠
        en: the sources date its founding to 970
        ur: ماخذ اس کی بنیاد 970 لکھتے ہیں
    - text:
        ar: مائة عام
        en: a hundred years
        ur: سو سال
      correct: false
      why:
        ar: الأزهر أقدم من مائة عام بكثير
        en: al-Azhar is far older than a century
        ur: الازہر ایک صدی سے کہیں پرانا ہے
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: الأزهر من أقدم الجامعات في العالم
        en: al-Azhar is among the world''s oldest universities
        ur: الازہر دنیا کے قدیم ترین جامعوں میں ہے
    - text:
        ar: خمسة آلاف عام
        en: five thousand years
        ur: پانچ ہزار سال
      correct: false
      why:
        ar: لم يكن الأزهر في عصر الفراعنة
        en: al-Azhar did not exist in pharaonic times
        ur: الازہر فرعونی دور میں نہیں تھا
  - q:
      ar: ماذا جمعت القاهرة؟
      en: What did Cairo weave together?
      ur: قاہرہ نے کیا ایک ساتھ بُنا؟
    options:
    - text:
        ar: الفاطمي والأيوبي والمملوكي والعثماني
        en: Fatimid, Ayyubid, Mamluk and Ottoman
        ur: فاطمی، ایوبی، مملوکی اور عثمانی
      correct: true
      why:
        ar: جمعت السلالات الأربع في نسيجها في المصادر
        en: the sources weave the four dynasties into her fabric
        ur: ماخذ میں چار خاندان اس کے تانے بانے میں بنے
    - text:
        ar: العباسي فقط
        en: only the Abbasid
        ur: صرف عباسی
      correct: false
      why:
        ar: لم تحكمها العباسية قط
        en: the Abbasids never ruled her
        ur: عباسیوں نے اس پر کبھی حکومت نہیں کی
    - text:
        ar: الروماني والفرعوني
        en: Roman and pharaonic
        ur: رومی اور فرعونی
      correct: false
      why:
        ar: القاهرة مدينة إسلامية لا فرعونية
        en: Cairo is an Islamic city, not pharaonic
        ur: قاہرہ اسلامی شہر ہے، فرعونی نہیں
    - text:
        ar: لا شيء؛ مدينة جديدة
        en: nothing; a new city
        ur: کچھ نہیں؛ نیا شہر
      correct: false
      why:
        ar: تعد من أقدم مدن العالم الإسلامي
        en: she is among the Islamic world''s oldest cities
        ur: یہ اسلامی دنیا کے قدیم ترین شہروں میں ہے
  - q:
      ar: من كتب عن القاهرة؟
      en: Who wrote about Cairo?
      ur: قاہرہ کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون مثل المقريزي ووصف مصر
        en: historians like al-Maqrizi and the Description of Egypt
        ur: مقریزی جیسے مؤرخین اور وصف مصر
      correct: true
      why:
        ar: تصلنا تاريخ المقريزي ووصف الحملة الفرنسية
        en: al-Maqrizi''s history and the French Description reach us
        ur: مقریزی کی تاریخ اور فرانسیسی وصف ہم تک پہنچے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: القاهرة من أكثر المدن تدوينًا
        en: Cairo is among the most-documented cities
        ur: قاہرہ سب سے زیادہ لکھے جانے والے شہروں میں ہے
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها قبل أوروبا بقرون
        en: Muslims wrote of her centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنها الفاطميون والمماليك قبل العثمانيين
        en: Fatimids and Mamluks wrote of her before the Ottomans
        ur: فاطمیوں اور مملوکوں نے عثمانیوں سے پہلے لکھا
  - q:
      ar: لماذا سمّيت مدينة الألف مئذنة؟
      en: Why is she called the city of a thousand minarets?
      ur: اسے ہزار میناروں کا شہر کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لكثرة مساجدها ومناراتها
        en: for her many mosques and minarets
        ur: اس کی بہت سی مسجدوں اور میناروں کی وجہ سے
      correct: true
      why:
        ar: جمعت المدينة مئذنة فوق مئذنة في نسيجها
        en: the city gathered minaret upon minaret in her fabric
        ur: شہر نے اپنے تانے بانے میں مینار پر مینار جمع کیا
    - text:
        ar: لأنها بنت ألف مئذنة في سنة
        en: because she built a thousand minarets in one year
        ur: کیونکہ اس نے ایک سال میں ہزار مینار بنائے
      correct: false
      why:
        ar: الاسم للكثرة لا لسنة واحدة
        en: the name is for the many, not one year
        ur: نام بہتات کے لیے ہے، ایک سال کے لیے نہیں
    - text:
        ar: لأنها مدينة حديثة
        en: because she is a modern city
        ur: کیونکہ یہ جدید شہر ہے
      correct: false
      why:
        ar: اللقب لعمارتها التاريخية
        en: the nickname is for her historic architecture
        ur: لقب اس کی تاریخی معماری کے لیے ہے
    - text:
        ar: لا سبب
        en: no reason
        ur: کوئی وجہ نہیں
      correct: false
      why:
        ar: يرتبط اللقب بكثرة المساجد في المصادر
        en: the sources tie the name to her many mosques
        ur: ماخذ نام کو اس کی بہت سی مسجدوں سے جوڑتے ہیں
- id: delhi
  anchor: place/delhi
  band: researchers
  title:
    ar: دلهي
    en: Delhi
    ur: دہلی
  sixty:
    ar: 'دلهي عاصمة سلطنة دلهي ثم الإمبراطورية المغولية في الهند: جعلها القطب منارها والقطب مسجدها رمزًا للإسلام الهندي منذ القرن الثالث عشر. حكمها خمس سلالات سلطانية
      من ١٢٠٦ إلى ١٥٢٦، ثم بناها شاهجهان شاهجاهان أباد عاصمةً مغولية: الجامع المسجد والحصن الأحمر وشاندني شوك. سقطت للفرس في ١٧٣٩ ثم للبريطانيين ١٨٥٧، وبقيت قلب الهند
      الإسلامي: مدرسة ومرقد ومدينة الحكماء ومسجد الجمعة.  وتلك الطبقات تقرأها العيون في آثارها: أعمدة هندية في مسجد إسلامي، وفارسي في نقوش مباني مغولية، وهندية تتكلم في مأذنة. وفي دلهي اليوم يقف القطب منار شاهدًا على ثمانية قرون من التاريخ: من السلاطين الأوائل إلى شاهجهان، ومن شاهجهان إلى الاستعمار، ومن الاستعمار إلى استقلال الهند وبقاء دلهي قلب ثقافتها.  وبهذا صارت دلهي عاصمة ثلاث حضارات: هندية وإسلامية وهندية إسلامية، كلها متداخلة في شوارعها ومبانيها.'
    en: 'Delhi is the capital of the Delhi Sultanate then the Mughal Empire in India: the Qutb Minar and Quwwat al-Islam mosque made it the emblem of Indian Islam
      from the thirteenth century. Five sultanate dynasties ruled it from 1206 to 1526, then Shah Jahan built it as Shahjahanabad, the Mughal capital: the Jama Masjid,
      the Red Fort and Chandni Chowk. It fell to the Persians in 1739 then the British in 1857, and it remains the heart of India''''s Islamic life: a school, a shrine,
      a city of the wise and the Friday mosque.  Those layers are read with the eyes in its remains — Hindu pillars inside an Islamic mosque, Persian on Mughal walls, Hindi ringing in a minaret. And in Delhi today the Qutb Minar stands witness to eight centuries: from the first sultans to Shah Jahan, from Shah Jahan to empire, from empire to India''s independence and Delhi''s staying her heart.'
    ur: 'دہلی ہندوستان میں دہلی سلطنت پھر مغل سلطنت کا دارالحکومت ہے: قطب مینار اور قوت الاسلام مسجد نے اسے تیرہویں صدی سے ہندوستانی اسلام کی علامت بنایا۔ پانچ سلطانی
      خاندانوں نے 1206 سے 1526 تک اس پر حکومت کی، پھر شاہجہاں نے اسے شاہجہان آباد کے نام سے مغل دارالحکومت بنایا: جامع مسجد، لال قلعہ اور چاندنی چوک۔ یہ 1739 میں
      فارسیوں کے پھر 1857 میں برطانویوں کے ہاتھ گرا، اور یہ ہندوستان کی اسلامی زندگی کا دل ہے: مدرسہ، درگاہ، حکماء کا شہر اور جمعہ کی مسجد۔  یہ تہیں آنکھوں سے اس کی یادگاروں میں پڑھی جاتی ہیں — اسلامی مسجد میں ہندو ستون، مغل عمارتوں پر فارسی کتبے، مینار میں گونجتی ہندوستانی زبان۔ اور آج دہلی میں قطب مینار آٹھ صدیوں کا گواہ کھڑا ہے: پہلے سلطانوں سے شاہجہاں تک، شاہجہاں سے سلطنت تک، سلطنت سے ہندوستان کی آزادی اور دہلی کے اس کے دل رہنے تک۔'
  glossary:
  - term:
      ar: القطب منار
      en: the Qutb Minar
      ur: قطب مینار
    gloss:
      ar: 'أعلى مئذنة حجرية في العالم شيّدها سلاطين دلهي الأوائل'
      en: 'the tallest brick minaret in the world, raised by Delhi''s first sultans'
      ur: 'دنیا کا سب سے اونچا اینٹوں کا مینار جو دہلی کے ابتدائی سلاطین نے بنایا'
  - term:
      ar: قوت الإسلام
      en: Quwwat al-Islam
      ur: قوت الاسلام
    gloss:
      ar: 'أول مسجد أقامته السلطنة فوق معبد سابق'
      en: 'the sultanate''s first mosque, raised over the site of an earlier temple'
      ur: 'سلطنت کی پہلی مسجد جو ایک پرانے مندر کی جگہ پر اٹھی'
  - term:
      ar: السلطنة
      en: the Sultanate
      ur: سلطنت
    gloss:
      ar: 'حكم خمس سلالات مسلمة متعاقبة من ١٢٠٦م إلى ١٥٢٦م'
      en: 'the rule of five successive Muslim dynasties over north India, from 1206 to 1526'
      ur: 'شمالی ہندوستان پر پانچ مسلم خاندانوں کی باری باری حکومت، 1206 سے 1526 تک'
  - term:
      ar: شاهجهان
      en: Shah Jahan
      ur: شاہجہاں
    gloss:
      ar: 'الإمبراطور المغولي الذي أعاد بناءها عاصمةً كاملة المرافق'
      en: 'the Mughal emperor who rebuilt her as a complete capital of gardens and stone'
      ur: 'مغل بادشاہ جس نے اسے باغات اور پتھر کی مکمل راجدھانی بنا کر تعمیر کیا'
  - term:
      ar: شاهجاهان أباد
      en: Shahjahanabad
      ur: شاہجہان آباد
    gloss:
      ar: 'اسمها المغولي حين جعلها شاهجهان عاصمته الجديدة'
      en: 'her Mughal name, when Shah Jahan made her his new capital'
      ur: 'اس کا مغلی نام جب شاہجہاں نے اسے اپنی نئی راجدھانی بنایا'
  - term:
      ar: الجامع المسجد
      en: the Jama Masjid
      ur: جامع مسجد
    gloss:
      ar: 'الجامع الكبير الذي بناه شاهجهان لعاصمته الجديدة'
      en: 'the great Friday mosque Shah Jahan built for his new capital'
      ur: 'وہ عظیم جامع مسجد جو شاہجہاں نے اپنی نئی راجدھانی کے لیے بنوائی'
  - term:
      ar: الحصن الأحمر
      en: the Red Fort
      ur: لال قلعہ
    gloss:
      ar: 'قصر الإمبراطور الأحمر في قلب المدينة المغولية'
      en: 'the emperor''s red sandstone palace at the Mughal city''s heart'
      ur: 'مغل شہر کے دل میں بادشاہ کا سرخ پتھر کا محل'
  - term:
      ar: شاندني شوك
      en: Chandni Chowk
      ur: چاندنی چوک
    gloss:
      ar: 'سوقها الشهيرة القمريّة التي صمّمتها ابنة شاهجهان'
      en: 'her famous moonlit market, designed in the reign of Shah Jahan''s daughter'
      ur: 'اس کا مشہور چاندنی بازار جو شاہجہاں کی بیٹی کے دور میں ڈیزائن ہوا'
  - term:
      ar: ١٧٣٩
      en: '1739'
      ur: '1739'
    gloss:
      ar: 'السنة التي احتلّها فيها نادر شاه الفارسي وسلب كنوزها'
      en: 'the year Nadir Shah of Persia occupied her and stripped her treasures'
      ur: 'وہ سال جب فارس کے نادر شاہ نے اس پر قبضہ کیا اور خزانے لوٹے'
  - term:
      ar: ١٨٥٧
      en: '1857'
      ur: '1857'
    gloss:
      ar: 'سنة سقوطها الأخير بيد البريطانيين بعد التمرد الكبير'
      en: 'the year of her final fall to the British after the great revolt'
      ur: 'عظیم بغاوت کے بعد برطانویوں کے ہاتھوں اس کے آخری سقوط کا سال'
  - term:
      ar: الهند
      en: India
      ur: ہندوستان
    gloss:
      ar: 'البلد الذي يحتضن دلهي وهو أكبر بلدان جنوب آسيا'
      en: 'the country that holds Delhi — the largest in South Asia'
      ur: 'وہ ملک جس میں دہلی ہے — جنوبی ایشیا کا سب سے بڑا ملک'
  - term:
      ar: السلالات الخمس
      en: the five dynasties
      ur: پانچ خاندان
    gloss:
      ar: 'المماليك والخلجيون والتغلقيون والسيديون واللوديون بالترتيب'
      en: 'the Mamluks, Khaljis, Tughlaqs, Sayyids and Lodis, ruling one after another'
      ur: 'غلامان، خلجی، تغلق، سید اور لودھی خاندان، ایک کے بعد ایک حکمران'
  practice:
  - q:
      ar: ما القطب منار؟
      en: What is the Qutb Minar?
      ur: قطب مینار کیا ہے؟
    options:
    - text:
        ar: أطول منارة طوب في العالم
        en: the world''s tallest brick minaret
        ur: دنیا کا سب سے اونچا اینٹوں کا مینار
      correct: true
      why:
        ar: تذكر المصادر ارتفاعها بأكثر من سبعين مترًا
        en: the sources give her height over seventy metres
        ur: ماخذ اس کی اونچائی ستر میٹر سے زیادہ لکھتے ہیں
    - text:
        ar: قصر الإمبراطور
        en: the emperor''s palace
        ur: بادشاہ کا محل
      correct: false
      why:
        ar: القطب منار منارة لا قصر
        en: the Qutb Minar is a minaret, not a palace
        ur: قطب مینار مینار ہے، محل نہیں
    - text:
        ar: مسجد الجمعة
        en: the Friday mosque
        ur: جمعہ مسجد
      correct: false
      why:
        ar: القطب منار برج لا مسجد
        en: the Qutb Minar is a tower, not a mosque
        ur: قطب مینار برج ہے، مسجد نہیں
    - text:
        ar: قلعة صليبية
        en: a Crusader castle
        ur: صلیبی قلعہ
      correct: false
      why:
        ar: القطب منار هندية إسلامية لا صليبية
        en: the Qutb Minar is Indian-Islamic, not Crusader
        ur: قطب مینار ہندوستانی-اسلامی ہے، صلیبی نہیں
  - q:
      ar: كم سلالة حكمت دلهي؟
      en: How many dynasties ruled Delhi?
      ur: دہلی پر کتنے خاندانوں نے حکومت کی؟
    options:
    - text:
        ar: خمس من ١٢٠٦ إلى ١٥٢٦
        en: five from 1206 to 1526
        ur: 1206 سے 1526 تک پانچ
      correct: true
      why:
        ar: تذكر المصادر السلالات السلطانية الخمس
        en: the sources name the five sultanate dynasties
        ur: ماخذ پانچ سلطانی خاندانوں کے نام لیتے ہیں
    - text:
        ar: واحدة
        en: one
        ur: ایک
      correct: false
      why:
        ar: خمس سلالات لا واحدة
        en: five dynasties, not one
        ur: پانچ خاندان، ایک نہیں
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: خمسة عدد السلطنة لا عشرة
        en: five is the sultanate count, not ten
        ur: پانچ سلطنت کی گنتی ہے، دس نہیں
    - text:
        ar: لا سلالة؛ جمهورية
        en: no dynasty; a republic
        ur: کوئی خاندان نہیں؛ جمہوریت
      correct: false
      why:
        ar: حكمها سلالات سلطانية قبل الجمهورية
        en: sultanate dynasties ruled her before the republic
        ur: جمہوریت سے پہلے سلطانی خاندانوں نے حکومت کی
  - q:
      ar: من بناها عاصمة مغولية؟
      en: Who built her as Mughal capital?
      ur: اسے مغل دارالحکومت کس نے بنایا؟
    options:
    - text:
        ar: شاهجهان شاهجاهان أباد
        en: Shah Jahan as Shahjahanabad
        ur: شاہجہاں نے، شاہجہان آباد کے نام سے
      correct: true
      why:
        ar: تنسب المصادر بناءها للإمبراطور الخامس
        en: the sources credit the fifth Mughal emperor
        ur: ماخذ اسے پانچویں مغل بادشاہ سے منسوب کرتے ہیں
    - text:
        ar: أكبر
        en: Akbar
        ur: اکبر
      correct: false
      why:
        ar: كان أكبر قبلها عاصمة في أغرا
        en: Akbar had Agra as capital before
        ur: اکبر کا دارالحکومت پہلے آگرہ تھا
    - text:
        ar: بابر
        en: Babur
        ur: بابر
      correct: false
      why:
        ar: أسّس بابر الدولة لا المدينة
        en: Babur founded the state, not the city
        ur: بابر نے سلطنت بنائی، شہر نہیں
    - text:
        ar: أورنكزيب
        en: Aurangzeb
        ur: اورنگزیب
      correct: false
      why:
        ar: جاء أورنكزيب بعد بناءها
        en: Aurangzeb came after her building
        ur: اورنگزیب اس کی تعمیر کے بعد آیا
  - q:
      ar: متى سقطت دلهي للبريطانيين؟
      en: When did Delhi fall to the British?
      ur: دہلی برطانویوں کے ہاتھ کب گرا؟
    options:
    - text:
        ar: عام ١٨٥٧
        en: in 1857
        ur: 1857 میں
      correct: true
      why:
        ar: تذكر المصادر نهاية حكمها المغولي ١٨٥٧
        en: the sources date her Mughal rule''s end to 1857
        ur: ماخذ اس کی مغلی حکومت کا خاتمہ 1857 لکھتے ہیں
    - text:
        ar: عام ١٧٣٩
        en: in 1739
        ur: 1739 میں
      correct: false
      why:
        ar: ذلك عام سقوطها للفرس لا البريطانيين
        en: that is her Persian fall, not the British
        ur: یہ اس کے فارسی گرنے کا سال ہے، برطانوی نہیں
    - text:
        ar: عام ١٥٢٦
        en: in 1526
        ur: 1526 میں
      correct: false
      why:
        ar: ذلك عام بداية الحكم المغولي
        en: that is the start of Mughal rule
        ur: یہ مغلی حکومت کے آغاز کا سال ہے
    - text:
        ar: لم تسقط أبدًا
        en: she never fell
        ur: یہ کبھی نہیں گرا
      correct: false
      why:
        ar: سقطت للفرس ثم البريطانيين
        en: she fell to the Persians then the British
        ur: یہ فارسیوں پھر برطانویوں کے ہاتھ گری
  - q:
      ar: ما قوت الإسلام؟
      en: What is Quwwat al-Islam?
      ur: قوت الاسلام کیا ہے؟
    options:
    - text:
        ar: أول مسجد في سلطنة دلهي
        en: the Delhi Sultanate''s first mosque
        ur: دہلی سلطنت کی پہلی مسجد
      correct: true
      why:
        ar: بناها القادة الأوائل في المصادر
        en: the sources have the first commanders build it
        ur: ماخذ میں پہلے سرداروں نے اسے بنایا
    - text:
        ar: مدرسة عثمانية
        en: an Ottoman school
        ur: عثمانی مدرسہ
      correct: false
      why:
        ar: قوت الإسلام في الهند لا العثمانية
        en: Quwwat al-Islam is in India, not Ottoman
        ur: قوت الاسلام ہندوستان میں ہے، عثمانی نہیں
    - text:
        ar: قصر فرعوني
        en: a pharaonic palace
        ur: فرعونی محل
      correct: false
      why:
        ar: قوت الإسلام إسلامية لا فرعونية
        en: Quwwat al-Islam is Islamic, not pharaonic
        ur: قوت الاسلام اسلامی ہے، فرعونی نہیں
    - text:
        ar: سوق إيراني
        en: an Iranian market
        ur: ایرانی بازار
      correct: false
      why:
        ar: قوت الإسلام مسجد لا سوق
        en: Quwwat al-Islam is a mosque, not a market
        ur: قوت الاسلام مسجد ہے، بازار نہیں
  - q:
      ar: ماذا بنا شاهجهان في دلهي؟
      en: What did Shah Jahan build in Delhi?
      ur: شاہجہاں نے دہلی میں کیا بنایا؟
    options:
    - text:
        ar: الجامع المسجد والحصن الأحمر وشاندني شوك
        en: the Jama Masjid, the Red Fort and Chandni Chowk
        ur: جامع مسجد، لال قلعہ اور چاندنی چوک
      correct: true
      why:
        ar: تذكر المصادر معالمها الثلاثة في عاصمته
        en: the sources name her three landmarks in his capital
        ur: ماخذ اس کے دارالحکومت میں تین نشانیوں کا ذکر کرتے ہیں
    - text:
        ar: تاج محل في دلهي
        en: the Taj Mahal in Delhi
        ur: دہلی میں تاج محل
      correct: false
      why:
        ar: تاج محل في أغرا لا دلهي
        en: the Taj Mahal is in Agra, not Delhi
        ur: تاج محل آگرہ میں ہے، دہلی میں نہیں
    - text:
        ar: قلعة صلاح الدين
        en: Saladin''s citadel
        ur: صلاح الدین کا قلعہ
      correct: false
      why:
        ar: قلعة صلاح الدين في القاهرة
        en: Saladin''s citadel is in Cairo
        ur: صلاح الدین کا قلعہ قاہرہ میں ہے
    - text:
        ar: القطب منار
        en: the Qutb Minar
        ur: قطب مینار
      correct: false
      why:
        ar: القطب منار قبل شاهجهان بقرون
        en: the Qutb Minar predates Shah Jahan by centuries
        ur: قطب مینار شاہجہاں سے صدیوں پرانا ہے
  - q:
      ar: لماذا اشتهرت دلهي؟
      en: Why is Delhi famous?
      ur: دہلی کیوں مشہور ہے؟
    options:
    - text:
        ar: كقلب الهند الإسلامي وعاصمة سلالاتها
        en: as the heart of Indian Islam and her dynasties'' capital
        ur: ہندوستانی اسلام کے دل اور اس کے خاندانوں کے دارالحکومت کے طور پر
      correct: true
      why:
        ar: جمعت سلطنة ومغولية وتراثًا إسلاميًّا
        en: she gathered sultanate, Mughal and Islamic heritage
        ur: اس نے سلطنت، مغلیہ اور اسلامی ورثہ جمع کیا
    - text:
        ar: كأول مدينة في الهند
        en: as India''s first city
        ur: ہندوستان کے پہلے شہر کے طور پر
      correct: false
      why:
        ar: سبقتها مدن هندية قديمة
        en: older Indian cities predate her
        ur: اس سے پہلے قدیم ہندوستانی شہر تھے
    - text:
        ar: كعاصمة بريطانية دائمًا
        en: as always the British capital
        ur: ہمیشہ برطانوی دارالحکومت کے طور پر
      correct: false
      why:
        ar: كانت إسلامية قبل البريطانيين بقرون
        en: she was Islamic centuries before the British
        ur: یہ برطانویوں سے صدیوں پہلے اسلامی تھی
    - text:
        ar: كجزيرة
        en: as an island
        ur: جزیرے کے طور پر
      correct: false
      why:
        ar: دلهي مدينة برية لا جزيرة
        en: Delhi is an inland city, not an island
        ur: دہلی اندرونِ ملک شہر ہے، جزیرہ نہیں
  - q:
      ar: من كتب عن دلهي؟
      en: Who wrote about Delhi?
      ur: دہلی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو السلطنة مثل البرني
        en: sultanate historians like Barani
        ur: برنی جیسے سلطنت کے مؤرخین
      correct: true
      why:
        ar: تصلنا روايات البرني ومؤرخي المغول
        en: Barani''s accounts and Mughal historians reach us
        ur: برنی کی روایتیں اور مغل مؤرخین ہم تک پہنچے
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب مؤرخوها قبل أوروبا بقرون
        en: her historians wrote centuries before Europe
        ur: اس کے مؤرخین نے یورپ سے صدیوں پہلے لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقها مؤرخو السلطنة والمغول
        en: sultanate and Mughal historians documented her
        ur: سلطنت اور مغل مؤرخین نے اسے ثبت کیا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: العثمانيون كتبوا عن بلادهم لا دلهي
        en: the Ottomans wrote of their lands, not Delhi
        ur: عثمانیوں نے اپنے ملکوں کے بارے میں لکھا، دہلی کے بارے میں نہیں
  - q:
      ar: ماذا تدلّ دلهي على الإسلام؟
      en: What does Delhi show about Islam?
      ur: دہلی اسلام کے بارے میں کیا بتاتی ہے؟
    options:
    - text:
        ar: أنّ الإسلام صار هنديًّا في العمارة واللغة والمدرسة
        en: that Islam became Indian in architecture, language and learning
        ur: کہ اسلام معماری، زبان اور علم میں ہندوستانی بن گیا
      correct: true
      why:
        ar: شهدت على اندماج الإسلام في المجتمع الهندي
        en: she witnessed Islam''s joining Indian society
        ur: اس نے ہندوستانی معاشرے میں اسلام کے مکس ہونے کی گواہی دی
    - text:
        ar: أنّ الإسلام بقي غريبًا عن الهند
        en: that Islam stayed foreign to India
        ur: کہ اسلام ہندوستان کے لیے اجنبی رہا
      correct: false
      why:
        ar: اندمجت عمارتها ولغتها في الهند
        en: her architecture and language merged into India
        ur: اس کی معماری اور زبان ہندوستان میں ملی
    - text:
        ar: أنّ الهند لم تعرف الإسلام
        en: that India never knew Islam
        ur: کہ ہندوستان نے اسلام کو نہیں جانا
      correct: false
      why:
        ar: كانت دلهي مركزًا إسلاميًّا قرونًا
        en: Delhi was an Islamic centre for centuries
        ur: دہلی صدیوں اسلامی مرکز رہی
    - text:
        ar: أنّ الإسلام انتهى في ١٢٦٥
        en: that Islam ended in 1265
        ur: کہ اسلام 1265 میں ختم ہو گیا
      correct: false
      why:
        ar: استمر الإسلام في الهند إلى اليوم
        en: Islam in India continues to this day
        ur: ہندوستان میں اسلام آج تک جاری ہے
  - q:
      ar: متى بدأ حكم سلطنة دلهي؟
      en: When did the Delhi Sultanate''s rule begin?
      ur: دہلی سلطنت کی حکمرانی کب شروع ہوئی؟
    options:
    - text:
        ar: عام ١٢٠٦
        en: in 1206
        ur: 1206 میں
      correct: true
      why:
        ar: تذكر المصادر بداية السلطنة ١٢٠٦
        en: the sources date the sultanate''s start to 1206
        ur: ماخذ سلطنت کا آغاز 1206 لکھتے ہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح إسطنبول لا بداية السلطنة
        en: that is Istanbul''s conquest, not the sultanate''s start
        ur: یہ استنبول کی فتح کا سال ہے، سلطنت کے آغاز کا نہیں
    - text:
        ar: عام ١٨٥٧
        en: in 1857
        ur: 1857 میں
      correct: false
      why:
        ar: ذلك عام نهاية الحكم المغولي لا بدايته
        en: that is Mughal rule''s end, not its start
        ur: یہ مغلی حکومت کا خاتمہ ہے، آغاز نہیں
    - text:
        ar: عام ٩٦٩
        en: in 969
        ur: 969 میں
      correct: false
      why:
        ar: ذلك عام تأسيس القاهرة لا سلطنة دلهي
        en: that is Cairo''s founding, not Delhi''s sultanate
        ur: یہ قاہرہ کی بنیاد کا سال ہے، دہلی سلطنت کا نہیں
- id: istanbul
  anchor: place/istanbul
  band: researchers
  title:
    ar: إسطنبول
    en: Istanbul
    ur: استنبول
  sixty:
    ar: 'إسطنبول القسطنطينية سابقًا: عاصمة البيزنطيين ألف عام حتى فتحها محمد الفاتح عام ١٤٥٣ فحوّل آيا صوفيا إلى مسجد وجعلها عاصمة الخلافة العثمانية أربعة قرون. بلغت
      أوجها في عهد سليمان القانوني: مساجد سنان الزرقاء والسليمانية وبازارها الكبير وأضابها على البوسفور. جمعت إسطنبول الروماني والبيزنطي والعثماني في مدينة واحدة:
      قسطنطينية بأسوارها وإسطنبول بمآذنها، وبقيت جسرًا بين أوروبا وآسيا إلى اليوم.  وهي المدينة الوحيدة التي جلست على قارّتين، فصارت أمثولة التقاء: شرق وغرب، إسلام ومسيحية، إمبراطوريتان في أسوار واحدة. ومن إسطنبول قاد العثمانيون بحارهم إلى المحيط الهندي والبحر المتوسط، وطبعت فيها أول مطبعة عربية عثمانية، وبقيت أكبر مدن تركيا وجسرها الثقافي إلى العالم.  وفيها التقت القصة العثمانية كلها: من محمد الفاتح إلى سنان، ومن آيا صوفيا إلى الميناء الذهبي، وبقيت عاصمة ذاكرتين معًا.'
    en: 'Istanbul, formerly Constantinople: capital of the Byzantines for a thousand years until Mehmed the Conqueror took it in 1453, turned Hagia Sophia into a
      mosque, and made it the seat of the Ottoman caliphate for four centuries. It peaked under Suleiman the Magnificent: Sinan''''s Blue and Suleymaniye mosques,
      its Grand Bazaar and its quarters on the Bosphorus. Istanbul wove Roman, Byzantine and Ottoman into one city — Constantinople with its walls and Istanbul with
      its minarets — and it remains the bridge between Europe and Asia to this day.  It is the only city seated on two continents, so it became the parable of meetings — east and west, Islam and Christianity, two empires inside one set of walls. From Istanbul the Ottomans led their fleets to the Indian Ocean and the Mediterranean, the first Ottoman Arabic press printed there, and it stays Turkey''s largest city and its cultural bridge to the world.'
    ur: 'استنبول، پہلے قسطنطنیہ: ایک ہزار سال تک بازنطینیوں کا دارالحکومت رہا جب تک کہ محمد فاتح نے 1453 میں اسے لیا، آیا صوفیا کو مسجد میں بدلا اور اسے چار صدیوں
      کے لیے عثمانی خلافت کی نشست بنایا۔ یہ سلیمان قانونی کے دور میں عروج پر رہا: سنان کی بلیو اور سلیمانیہ مسجدیں، اس کا گرینڈ بازار اور بوسفورس کے کنارے اس کے محلے۔
      استنبول نے رومی، بازنطینی اور عثمانی کو ایک شہر میں بُنا — قسطنطنیہ اپنی فصیلوں کے ساتھ اور استنبول اپنے میناروں کے ساتھ — اور یہ آج بھی یورپ اور ایشیا کے درمیان
      پل ہے۔  یہ واحد شہر ہے جو دو براعظموں پر بیٹھا، اس لیے ملنے کی مثل بنا — مشرق اور مغرب، اسلام اور مسیحیت، ایک ہی دیواروں میں دو سلطنتیں۔ استنبول سے عثمانیوں نے اپنی بیڑے بحرِ ہند اور بحیرۂ روم تک پہنچائے، پہلی عثمانی عربی چھاپہ خانہ یہیں چلا، اور یہ ترکی کا بڑا شہر اور دنیا سے اس کا ثقافتی پل رہا۔'
  glossary:
  - term:
      ar: القسطنطينية
      en: Constantinople
      ur: قسطنطنیہ
    gloss:
      ar: 'اسمها البيزنطي الذي حملته ألف سنة قبل الفتح العثماني'
      en: 'her Byzantine name, which she carried a thousand years before the Ottoman conquest'
      ur: 'اس کا بازنطینی نام جو فتحِ عثمانی سے پہلے ہزار سال رہا'
  - term:
      ar: محمد الفاتح
      en: Mehmed the Conqueror
      ur: محمد فاتح
    gloss:
      ar: 'السلطان الذي حقق بشارة الفتح سنة ١٤٥٣م وهو شاب'
      en: 'the sultan who fulfilled the foretold conquest in 1453 while still a young man'
      ur: 'وہ سلطان جس نے 1453 میں فتح کی بشارت پوری کی جب وہ ابھی جوان تھا'
  - term:
      ar: آيا صوفيا
      en: Hagia Sophia
      ur: آیا صوفیا
    gloss:
      ar: 'كاتدرائية البيزنطيين الكبرى التي صارت مسجدًا ثم متحفًا'
      en: 'the Byzantines'' great cathedral, which became a mosque and later a museum'
      ur: 'بازنطینیوں کا عظیم گرجا گھر جو مسجد بنا اور بعد میں عجائب گھر'
  - term:
      ar: سليمان القانوني
      en: Suleiman the Magnificent
      ur: سلیمان قانونی
    gloss:
      ar: 'السلطان الذي بلغت الإمبراطورية في عهده ذروة قوتها'
      en: 'the sultan in whose reign the empire reached the peak of its power'
      ur: 'وہ سلطان جس کے دور میں سلطنت اپنی طاقت کی انتہا کو پہنچی'
  - term:
      ar: سنان
      en: Sinan
      ur: سنان
    gloss:
      ar: 'مهندس العصر الذي بنا السليمانية وأجمل مساجد المدينة'
      en: 'the age''s master architect, who built the Suleymaniye and the city''s finest mosques'
      ur: 'دور کا ماسٹر معمار جس نے سلیمانیہ اور شہر کی خوبصورت ترین مساجد بنائیں'
  - term:
      ar: البوسفور
      en: the Bosphorus
      ur: بوسفورس
    gloss:
      ar: 'المضيق الذي يفصل أوروبا عن آسيا ويشقّ المدينة نصفين'
      en: 'the strait that splits Europe from Asia and cuts the city in two'
      ur: 'وہ آبی گزرگاہ جو یورپ کو ایشیا سے جدا کرتی اور شہر کو دو حصوں میں کاٹتی ہے'
  - term:
      ar: الخلافة العثمانية
      en: the Ottoman caliphate
      ur: عثمانی خلافت
    gloss:
      ar: 'حكم السلاطين من إسطنبول أربعة قرون حتى ١٩٢٤م'
      en: 'the sultans'' rule seated in Istanbul for four centuries, until 1924'
      ur: 'سلاطین کی حکومت جو استنبول میں چار صدیوں تک رہی، 1924 تک'
  - term:
      ar: البازار الكبير
      en: the Grand Bazaar
      ur: گرینڈ بازار
    gloss:
      ar: 'سوقها المغطّى الكبير الذي يرجع إلى عهد الفاتح'
      en: 'her great covered market, which goes back to the Conqueror''s era'
      ur: 'اس کا عظیم ڈھکا ہوا بازار جو فاتح کے دور تک جاتا ہے'
  - term:
      ar: ١٤٥٣
      en: '1453'
      ur: '1453'
    gloss:
      ar: 'سنة الفتح العثماني التي أغلقت العصر البيزنطي'
      en: 'the year of the Ottoman conquest that closed the Byzantine age'
      ur: 'عثمانی فتح کا سال جس نے بازنطینی دور بند کر دیا'
  - term:
      ar: البيزنطيون
      en: the Byzantines
      ur: بازنطینی
    gloss:
      ar: 'حكمها الروماني الشرقي ألف سنة قبل العثمانيين'
      en: 'her eastern Roman rule, which lasted a thousand years before the Ottomans'
      ur: 'اس کی مشرقی رومی حکومت جو عثمانیوں سے پہلے ہزار سال رہی'
  - term:
      ar: المسجد الأزرق
      en: the Blue Mosque
      ur: بلیو مسجد
    gloss:
      ar: 'مسجد السلطان أحمد الشهير المواجه لآيا صوفيا'
      en: 'the famous Sultan Ahmed mosque that stands facing Hagia Sophia'
      ur: 'سلطان احمد کی مشہور مسجد جو آیا صوفیا کے سامنے کھڑی ہے'
  - term:
      ar: السليمانية
      en: the Suleymaniye
      ur: سلیمانیہ
    gloss:
      ar: 'مسجد سليمان الذي أقامه سنان على التل المطل على القرن الذهبي'
      en: 'Suleiman''s mosque, which Sinan raised on the hill above the Golden Horn'
      ur: 'سلیمان کی مسجد جو سنان نے سنہری سینگ کی پہاڑی پر بنائی'
  practice:
  - q:
      ar: ما الاسم القديم لإسطنبول؟
      en: What is Istanbul''s old name?
      ur: استنبول کا قدیم نام کیا ہے؟
    options:
    - text:
        ar: القسطنطينية
        en: Constantinople
        ur: قسطنطنیہ
      correct: true
      why:
        ar: كانت عاصمة بيزنطية ألف عام
        en: she was the Byzantine capital a thousand years
        ur: یہ ہزار سال بازنطینی دارالحکومت رہی
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد مدينة أخرى في العراق
        en: Baghdad is another city in Iraq
        ur: بغداد عراق میں دوسرا شہر ہے
    - text:
        ar: القدس
        en: Jerusalem
        ur: بیت المقدس
      correct: false
      why:
        ar: القدس في فلسطين لا الأناضول
        en: Jerusalem is in Palestine, not Anatolia
        ur: بیت المقدس فلسطین میں ہے، اناطولیہ میں نہیں
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطہ
      correct: false
      why:
        ar: قرطبة في الأندلس
        en: Cordoba is in al-Andalus
        ur: قرطہ اندلس میں ہے
  - q:
      ar: متى فتحها العثمانيون؟
      en: When did the Ottomans take her?
      ur: عثمانیوں نے اسے کب لیا؟
    options:
    - text:
        ar: عام ١٤٥٣ بقيادة محمد الفاتح
        en: in 1453 under Mehmed the Conqueror
        ur: 1453 میں محمد فاتح کی قیادت میں
      correct: true
      why:
        ar: تذكر المصادر سقوط القسطنطينية ١٤٥٣
        en: the sources date Constantinople''s fall to 1453
        ur: ماخذ قسطنطنیہ کا سقوط 1453 لکھتے ہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا إسطنبول
        en: that is Acre''s fall, not Istanbul
        ur: یہ عکہ کے گرنے کا سال ہے، استنبول کا نہیں
    - text:
        ar: عام ١٥١٧
        en: in 1517
        ur: 1517 میں
      correct: false
      why:
        ar: ذلك عام فتح مصر لا إسطنبول
        en: that is Egypt''s taking, not Istanbul
        ur: یہ مصر کے لینے کا سال ہے، استنبول کا نہیں
    - text:
        ar: لم تُفتح أبدًا
        en: she was never taken
        ur: یہ کبھی نہیں لی گئی
      correct: false
      why:
        ar: فتحها العثمانيون في ١٤٥٣
        en: the Ottomans took her in 1453
        ur: عثمانیوں نے 1453 میں اسے لیا
  - q:
      ar: ماذا فعل الفاتح بآيا صوفيا؟
      en: What did the Conqueror do to Hagia Sophia?
      ur: فاتح نے آیا صوفیا کا کیا کیا؟
    options:
    - text:
        ar: حوّلها إلى مسجد
        en: he turned her into a mosque
        ur: اس نے اسے مسجد میں بدل دیا
      correct: true
      why:
        ar: تذكر المصادر تحويلها مسجدًا يوم الفتح
        en: the sources record her becoming a mosque on conquest day
        ur: ماخذ فتح کے دن اس کے مسجد بننے کا ذکر کرتے ہیں
    - text:
        ar: هدمها كلها
        en: he demolished her entirely
        ur: اس نے اسے مکمل مسمار کیا
      correct: false
      why:
        ar: بقيت آيا صوفيا مسجدًا لا أُهدمت
        en: Hagia Sophia remained a mosque, not demolished
        ur: آیا صوفیا مسجد رہی، مسمار نہیں ہوئی
    - text:
        ar: أبقاها كنيسة
        en: he kept her a church
        ur: اس نے اسے کلیسا رکھا
      correct: false
      why:
        ar: حوّلها الفاتح مسجدًا في المصادر
        en: the sources have the Conqueror make her a mosque
        ur: ماخذ میں فاتح نے اسے مسجد بنایا
    - text:
        ar: بناها من جديد
        en: he built her anew
        ur: اس نے اسے نئے سرے سے بنایا
      correct: false
      why:
        ar: كانت قائمة قبل الفتح بقرون
        en: she stood centuries before the conquest
        ur: وہ فتح سے صدیوں پہلے قائم تھی
  - q:
      ar: من بنا المسجد الأزرق والسليمانية؟
      en: Who built the Blue and Suleymaniye mosques?
      ur: بلیو اور سلیمانیہ مسجدیں کس نے بنائیں؟
    options:
    - text:
        ar: سنان المعمار العثماني
        en: Sinan the Ottoman architect
        ur: سنان نے، عثمانی معمار
      correct: true
      why:
        ar: تنسب المصادر الجامعتين إلى سنان
        en: the sources credit both to Sinan
        ur: ماخذ دونوں کو سنان سے منسوب کرتے ہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: كان عبد الملك قبلها بثمانية قرون
        en: Abd al-Malik was eight centuries earlier
        ur: عبدالملک اس سے آٹھ صدیاں پہلے تھا
    - text:
        ar: شاهجهان
        en: Shah Jahan
        ur: شاہجہاں
      correct: false
      why:
        ar: كان شاهجهان في الهند لا إسطنبول
        en: Shah Jahan was in India, not Istanbul
        ur: شاہجہاں ہندوستان میں تھا، استنبول میں نہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: كان صلاح الدين قبلها بثلاثة قرون
        en: Saladin was three centuries earlier
        ur: صلاح الدین اس سے تین صدیاں پہلے تھا
  - q:
      ar: كم دامت إسطنبول عاصمة الخلافة؟
      en: How long was Istanbul the caliphate seat?
      ur: استنبول کتنی دیر خلافت کی نشست رہی؟
    options:
    - text:
        ar: أربعة قرون
        en: four centuries
        ur: چار صدیاں
      correct: true
      why:
        ar: من ١٤٥٣ حتى نهاية الخلافة أربعة قرون
        en: from 1453 to the caliphate''s end, four centuries
        ur: 1453 سے خلافت کے خاتمے تک چار صدیاں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة حكمها
        en: fifty is far short of her rule
        ur: پچاس اس کی حکمرانی کے عرصے سے کہیں کم ہے
    - text:
        ar: ألف عام
        en: a thousand years
        ur: ہزار سال
      correct: false
      why:
        ar: ألف عام مدة بيزنطية لا عثمانية
        en: a thousand years was the Byzantine span, not Ottoman
        ur: ہزار سال بازنطینی عرصہ تھا، عثمانی نہیں
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة مدة حكم سلطان واحد قصير
        en: ten is one short sultan''s span
        ur: دس ایک مختصر سلطان کا عرصہ ہے
  - q:
      ar: ما البوسفور؟
      en: What is the Bosphorus?
      ur: بوسفورس کیا ہے؟
    options:
    - text:
        ar: المضيق الذي يفصل أوروبا عن آسيا
        en: the strait separating Europe from Asia
        ur: وہ آبی راہ جو یورپ کو ایشیا سے الگ کرتی ہے
      correct: true
      why:
        ar: تقف المدينة على ضفتي المضيق
        en: the city stands on both sides of the strait
        ur: شہر آبی راہ کے دونوں کناروں پر ہے
    - text:
        ar: نهر في مصر
        en: a river in Egypt
        ur: مصر کا دریا
      correct: false
      why:
        ar: البوسفور في تركيا لا مصر
        en: the Bosphorus is in Turkey, not Egypt
        ur: بوسفورس ترکی میں ہے، مصر میں نہیں
    - text:
        ar: بحيرة في الهند
        en: a lake in India
        ur: ہندوستان کی جھیل
      correct: false
      why:
        ar: البوسفور مضيق لا بحيرة
        en: the Bosphorus is a strait, not a lake
        ur: بوسفورس آبی راہ ہے، جھیل نہیں
    - text:
        ar: جبل في الأندلس
        en: a mountain in al-Andalus
        ur: اندلس کا پہاڑ
      correct: false
      why:
        ar: البوسفور في إسطنبول لا الأندلس
        en: the Bosphorus is in Istanbul, not al-Andalus
        ur: بوسفورس استنبول میں ہے، اندلس میں نہیں
  - q:
      ar: لماذا اشتهرت إسطنبول؟
      en: Why is Istanbul famous?
      ur: استنبول کیوں مشہور ہے؟
    options:
    - text:
        ar: كجسر بين أوروبا وآسيا وعاصمة الخلافة العثمانية
        en: as the bridge between Europe and Asia and the Ottoman caliphate seat
        ur: یورپ اور ایشیا کے درمیان پل اور عثمانی خلافت کی نشست کے طور پر
      correct: true
      why:
        ar: جمعت البيزنطي والعثماني في مدينة واحدة
        en: she joined Byzantine and Ottoman in one city
        ur: اس نے بازنطینی اور عثمانی کو ایک شہر میں جوڑا
    - text:
        ar: كأول مدينة في العالم
        en: as the world''s first city
        ur: دنیا کے پہلے شہر کے طور پر
      correct: false
      why:
        ar: سبقتها مدن قديمة كثيرة
        en: many older cities predate her
        ur: اس سے پہلے بہت سے قدیم شہر تھے
    - text:
        ar: كعاصمة أوروبا الوحيدة
        en: as Europe''s only capital
        ur: یورپ کے واحد دارالحکومت کے طور پر
      correct: false
      why:
        ar: لها عواصم كثيرة في التاريخ
        en: she is one of history''s many capitals
        ur: یہ تاریخ کے بہت سے دارالحکومتوں میں سے ہے
    - text:
        ar: كمدينة صحراوية
        en: as a desert city
        ur: صحرائی شہر کے طور پر
      correct: false
      why:
        ar: إسطنبول ساحلية على البحر
        en: Istanbul is coastal on the sea
        ur: استنبول سمندر پر ساحلی ہے
  - q:
      ar: من كتب عن إسطنبول؟
      en: Who wrote about Istanbul?
      ur: استنبول کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخون عثمانيون ورحّالة أوروبيون
        en: Ottoman historians and European travellers
        ur: عثمانی مؤرخین اور یورپی سیاح
      correct: true
      why:
        ar: تصلنا روايات أوليا جلبي والرحّالة
        en: Evliya Celebi''s and travellers'' accounts reach us
        ur: اولیا چلبی اور سیاحوں کی روایتیں ہم تک پہنچی ہیں
    - text:
        ar: العرب فقط
        en: only Arabs
        ur: صرف عرب
      correct: false
      why:
        ar: كتب عنها العثمانيون والأوروبيون والعرب
        en: Ottomans, Europeans and Arabs wrote of her
        ur: عثمانیوں، یورپیوں اور عربوں نے اس کے بارے میں لکھا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: إسطنبول من أكثر المدن تدوينًا
        en: Istanbul is among the most-documented cities
        ur: استنبول سب سے زیادہ لکھے جانے والے شہروں میں ہے
    - text:
        ar: المغول
        en: the Mughals
        ur: مغل
      correct: false
      why:
        ar: المغول كتبوا عن الهند لا إسطنبول
        en: the Mughals wrote of India, not Istanbul
        ur: مغلوں نے ہندوستان کے بارے میں لکھا، استنبول کے بارے میں نہیں
  - q:
      ar: ماذا جمعت إسطنبول؟
      en: What did Istanbul weave together?
      ur: استنبول نے کیا ایک ساتھ بُنا؟
    options:
    - text:
        ar: الروماني والبيزنطي والعثماني
        en: Roman, Byzantine and Ottoman
        ur: رومی، بازنطینی اور عثمانی
      correct: true
      why:
        ar: جمعت العصور الثلاثة في نسيجها
        en: she wove the three ages into her fabric
        ur: اس نے تینوں دوروں کو اپنے تانے بانے میں بُنا
    - text:
        ar: الفاطمي فقط
        en: only the Fatimid
        ur: صرف فاطمی
      correct: false
      why:
        ar: لم تحكمها الفاطمية قط
        en: the Fatimids never ruled her
        ur: فاطمیوں نے اس پر کبھی حکومت نہیں کی
    - text:
        ar: المغولي والهندي
        en: Mughal and Indian
        ur: مغلی اور ہندوستانی
      correct: false
      why:
        ar: المغولية في الهند لا إسطنبول
        en: the Mughal era is in India, not Istanbul
        ur: مغلیہ دور ہندوستان میں ہے، استنبول میں نہیں
    - text:
        ar: لا شيء؛ مدينة حديثة
        en: nothing; a modern city
        ur: کچھ نہیں؛ جدید شہر
      correct: false
      why:
        ar: جمعت إسطنبول عصورًا من التاريخ
        en: Istanbul gathered ages of history
        ur: استنبول نے تاریخ کے دور جمع کیے
  - q:
      ar: في عهد من بلغت إسطنبول أوجها؟
      en: Under whom did Istanbul peak?
      ur: استنبول کس کے دور میں عروج پر رہی؟
    options:
    - text:
        ar: سليمان القانوني
        en: Suleiman the Magnificent
        ur: سلیمان قانونی
      correct: true
      why:
        ar: تذكر المصادر ذروتها العثمانية في عهده
        en: the sources place her Ottoman peak in his reign
        ur: ماخذ اس کا عثمانی عروج اس کے دور میں رکھتے ہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: كان عبد الملك أمويًّا قبلها بقرون
        en: Abd al-Malik was Umayyad, centuries earlier
        ur: عبدالملک اموی تھا، صدیوں پہلے
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: كان هارون في بغداد لا إسطنبول
        en: Harun was in Baghdad, not Istanbul
        ur: ہارون بغداد میں تھا، استنبول میں نہیں
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسی
      correct: false
      why:
        ar: كان مانسا موسى في مالي لا إسطنبول
        en: Mansa Musa was in Mali, not Istanbul
        ur: مانسا موسی مالی میں تھا، استنبول میں نہیں
- id: salah-al-din
  anchor: person/salah-al-din-yusuf-ibn-ayyub
  band: scholars
  title:
    ar: صلاح الدين
    en: Saladin
    ur: صلاح الدین
  sixty:
    ar: 'يوسف بن أيوب الكردي، الملقّب صلاح الدين: موحّد مصر والشام ومستعيد القدس. أنهى الخلافة الفاطمية عام ١١٧١ وأعاد مصر إلى العباسيين، ثم جمع دمشق وحلب والموصل
      في جبهة واحدة ضد الصليبيين. انتصر في حطين عام ١١٨٧ واستعاد القدس بعد ثمانية وثمانين عامًا من الاحتلال، وواجه الحملة الثالثة بقيادة ريتشارد قلب الأسد حتى صلح
      الرملة ١١٩٢. مات في دمشق ١١٩٣ فقيرًا بعد أن أنفق ثروته على الجهاد والبناء: القلعة في القاهرة ومدارس في مصر والشام.  وبقي صلاح الدين في الذاكرة مثال الحاكم المجاهد العادل: يبني المدارس في القاهرة ودمشق، ويعامل أسراه بلطف، ويحارب بشرف فحفظ له خصومه احترامهم. ومملكته لم تعش طويلاً بعده، لكن أخلاقه عاشت أطول: سيرة تُقرأ في كل عصر على أنها معنى المسؤولية في الحكم.  وفي قصته يقرأ المسلمون أن القوة والأخلاق يجتمعان: من هزم خصومه بشجاعته أدهشهم بكرمه، فكانت سمعته أعظم من نصره.'
    en: 'Yusuf ibn Ayyub the Kurd, known as Saladin: unifier of Egypt and Syria and recoverer of Jerusalem. He ended the Fatimid caliphate in 1171, returning Egypt
      to the Abbasids, then gathered Damascus, Aleppo and Mosul into one front against the Crusaders. He won at Hattin in 1187 and retook Jerusalem after eighty-eight
      years of occupation, then faced the Third Crusade under Richard the Lionheart until the peace of Ramla in 1192. He died in Damascus in 1193, poor, having spent
      his wealth on jihad and building: the Cairo citadel and schools across Egypt and Syria.  Saladin stayed in memory as the model just warrior-ruler: he built schools in Cairo and Damascus, treated captives kindly, fought with honour until his enemies themselves respected him. His kingdom did not long outlive him, but his character lived longer — a biography read in every age as the meaning of responsibility in rule.'
    ur: 'کرد یوسف بن ایوب، جسے صلاح الدین کہا جاتا ہے: مصر اور شام کا متحد کرنے والا اور بیت المقدس کا واپس لینے والا۔ اس نے 1171 میں فاطمی خلافت ختم کی اور مصر کو
      عباسیوں کو واپس کیا، پھر دمشق، حلب اور موصل کو صلیبیوں کے مقابلہ ایک محاذ میں جمع کیا۔ اس نے 1187 میں حطین میں فتح پائی اور اٹھاسی سال کے قبضے کے بعد بیت المقدس
      واپس لیا، پھر رچرڈ لائن ہارٹ کی قیادت میں تیسری صلیبی مہم کا سامنا کیا جب تک 1192 میں رملہ کا صلح ہوا۔ وہ 1193 میں دمشق میں فقیر ہو کر فوت ہوا، اپنی دولت جہاد
      اور تعمیر پر خرچ کر کے: قاہرہ کا قلعہ اور مصر و شام کے مدرسے۔  صلاح الدین یادداشت میں منصف مجاہد حکمران کا نمونہ رہا: قاہرہ اور دمشق میں مدارس بنائے، قیدیوں سے نرمی کی، شرافت سے لڑا یہاں تک کہ دشمن بھی عزت کرنے لگے۔ اس کی سلطنت اس کے بعد دیر تک نہ رہی، مگر اس کا کردار زیادہ جیا — ہر دور میں حکومت میں ذمہ داری کے مفہوم کی طرح پڑھی جانے والی سیرت۔'
  glossary:
  - term:
      ar: يوسف بن أيوب
      en: Yusuf ibn Ayyub
      ur: یوسف بن ایوب
    gloss:
      ar: 'اسمه الشخصي قبل أن يُلقّب بصلاح الدين'
      en: 'his personal name, before he was given the title Salah al-Din'
      ur: 'اس کا ذاتی نام اس سے پہلے کہ اسے صلاح الدین کا لقب ملا'
  - term:
      ar: الكردي
      en: the Kurd
      ur: کرد
    gloss:
      ar: 'أصله الكردي من أرمينيا حيث كانت أسرته'
      en: 'his Kurdish origin — the family''s homeland before they entered service'
      ur: 'اس کی کرد اصل — خاندان کی وہ سرزمین جہاں سے وہ خدمت میں آئے'
  - term:
      ar: الفاطميون
      en: the Fatimids
      ur: فاطمی
    gloss:
      ar: 'الخلافة التي أنهاها في القاهرة سنة ١١٧١م'
      en: 'the caliphate he brought to an end in Cairo in 1171'
      ur: 'وہ خلافت جسے اس نے 1171 میں قاہرہ میں ختم کیا'
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'الخلافة التي أعاد مصر إليها بعد قرنين'
      en: 'the caliphate he returned Egypt to after two centuries away'
      ur: 'وہ خلافت جس کی طرف اس نے مصر کو دو صدیوں بعد لوٹایا'
  - term:
      ar: حطين
      en: Hattin
      ur: حطین
    gloss:
      ar: 'المعركة التي كسر فيها جيش الصليبيين قرب طبرية'
      en: 'the battle where he broke the Crusader army near Tiberias in 1187'
      ur: 'وہ جنگ جس میں اس نے 1187 میں طبریا کے قریب صلیبی فوج کو توڑا'
  - term:
      ar: ريتشارد قلب الأسد
      en: Richard the Lionheart
      ur: رچرڈ لائن ہارٹ
    gloss:
      ar: 'قائد الحملة الصليبية الثالثة الذي واجهه بعد حطين'
      en: 'the English king who led the Third Crusade against him after Hattin'
      ur: 'انگریز بادشاہ جس نے حطین کے بعد تیسری صلیبی مہم اس کے خلاف قیادت کی'
  - term:
      ar: صلح الرملة
      en: the peace of Ramla
      ur: رملہ کا صلح
    gloss:
      ar: 'الصلح الذي أغلق حملة ريتشارد سنة ١١٩٢م'
      en: 'the peace that closed Richard''s campaign in 1192 and split the coast'
      ur: 'وہ صلح جس نے 1192 میں رچرڈ کی مہم بند کی اور ساحل تقسیم کیا'
  - term:
      ar: الجهاد
      en: jihad
      ur: جہاد
    gloss:
      ar: 'قضيته التي أنفق عليها كل ماله وجهده'
      en: 'the cause on which he spent his wealth and his effort all his life'
      ur: 'وہ مشن جس پر اس نے اپنی ساری دولت اور زندگی کا جتن لگا دیا'
  - term:
      ar: القلعة
      en: the citadel
      ur: قلعہ
    gloss:
      ar: 'قلعته بالقاهرة التي أقامها على جبل المقطم'
      en: 'the Cairo citadel he raised on the Muqattam hill against the Crusaders'
      ur: 'قاہرہ کا قلعہ جو اس نے صلیبیوں کے مقابل مقطم پہاڑی پر بنایا'
  - term:
      ar: المدارس
      en: the schools
      ur: مدرسے
    gloss:
      ar: 'المدارس التي نشرها في مصر ودمشق لتعليم الفقه'
      en: 'the schools he spread through Egypt and Damascus for teaching jurisprudence'
      ur: 'وہ مدرسے جو اس نے فقہ کی تعلیم کے لیے مصر اور دمشق میں پھیلائے'
  - term:
      ar: ١١٨٧
      en: '1187'
      ur: '1187'
    gloss:
      ar: 'سنة حطين واستعادة القدس معًا — ذروة حياته كلها'
      en: 'the year of Hattin and of Jerusalem''s recovery, together — the summit of his life'
      ur: 'حطین اور بیت المقدس کی واپسی دونوں کا سال — اس کی زندگی کی بلندی'
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: 'مدينة حكمه ووفاته سنة ١١٩٣م'
      en: 'the city of his later rule, and of his death in 1193'
      ur: 'اس کے آخری دورِ حکومت اور 1193 میں وفات کا شہر'
  practice:
  - q:
      ar: ما اسم صلاح الدين الحقيقي؟
      en: What was Saladin''s real name?
      ur: صلاح الدین کا اصل نام کیا تھا؟
    options:
    - text:
        ar: يوسف بن أيوب
        en: Yusuf ibn Ayyub
        ur: یوسف بن ایوب
      correct: true
      why:
        ar: يذكر المصادر اسمه قبل اللقب
        en: the sources give his name before the title
        ur: ماخذ لقب سے پہلے اس کا نام دیتے ہیں
    - text:
        ar: نور الدين
        en: Nur al-Din
        ur: نور الدین
      correct: false
      why:
        ar: كان نور الدين سيده لا اسمه
        en: Nur al-Din was his lord, not his name
        ur: نور الدین اس کا آقا تھا، نام نہیں
    - text:
        ar: عماد الدين
        en: Imad al-Din
        ur: عماد الدین
      correct: false
      why:
        ar: عماد الدين لقب أخيه لا هو
        en: Imad al-Din was his brother''s title
        ur: عماد الدین اس کے بھائی کا لقب تھا
    - text:
        ar: طغتكين
        en: Tughtekin
        ur: طغتکین
      correct: false
      why:
        ar: طغتكين حاكم دمشق قبله
        en: Tughtekin ruled Damascus before him
        ur: طغتکین اس سے پہلے دمشق کا حاکم تھا
  - q:
      ar: متى أنهى الخلافة الفاطمية؟
      en: When did he end the Fatimid caliphate?
      ur: اس نے فاطمی خلافت کب ختم کی؟
    options:
    - text:
        ar: عام ١١٧١
        en: in 1171
        ur: 1171 میں
      correct: true
      why:
        ar: تذكر المصادر إسقاط الخطبة الفاطمية ١١٧١
        en: the sources date dropping the Fatimid khutba to 1171
        ur: ماخذ فاطمی خطبہ گرانے کو 1171 لکھتے ہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام حطين لا نهاية الفاطميين
        en: that is Hattin, not the Fatimid end
        ur: یہ حطین کا سال ہے، فاطمیوں کے خاتمے کا نہیں
    - text:
        ar: عام ١١٩٢
        en: in 1192
        ur: 1192 میں
      correct: false
      why:
        ar: ذلك عام صلح الرملة
        en: that is the peace of Ramla
        ur: یہ رملہ کے صلح کا سال ہے
    - text:
        ar: عام ١٢٠٤
        en: in 1204
        ur: 1204 میں
      correct: false
      why:
        ar: مات صلاح الدين قبلها بأحد عشر عامًا
        en: Saladin died eleven years before
        ur: صلاح الدین اس سے گیارہ سال پہلے فوت ہوا
  - q:
      ar: ماذا فتحت معركة حطين؟
      en: What did the battle of Hattin open?
      ur: حطین کی جنگ نے کیا کھولا؟
    options:
    - text:
        ar: طريق استعادة القدس
        en: the road to retaking Jerusalem
        ur: بیت المقدس واپس لینے کا راستہ
      correct: true
      why:
        ar: تذكر المصادر دخوله القدس بعدها بأسابيع
        en: the sources have him enter Jerusalem weeks later
        ur: ماخذ میں وہ ہفتوں بعد بیت المقدس داخل ہوا
    - text:
        ar: طريق مصر
        en: the road to Egypt
        ur: مصر کا راستہ
      correct: false
      why:
        ar: كان يحكم مصر قبل حطين
        en: he ruled Egypt before Hattin
        ur: وہ حطین سے پہلے مصر پر حکومت کرتا تھا
    - text:
        ar: طريق الأندلس
        en: the road to al-Andalus
        ur: اندلس کا راستہ
      correct: false
      why:
        ar: حطين في فلسطين لا الأندلس
        en: Hattin is in Palestine, not al-Andalus
        ur: حطین فلسطین میں ہے، اندلس میں نہیں
    - text:
        ar: طريق بغداد
        en: the road to Baghdad
        ur: بغداد کا راستہ
      correct: false
      why:
        ar: لم تفتح حطين بغداد
        en: Hattin did not open Baghdad
        ur: حطین نے بغداد نہیں کھولا
  - q:
      ar: من قاد الحملة الثالثة ضده؟
      en: Who led the Third Crusade against him?
      ur: تیسری صلیبی مہم کی قیادت اس کے مقابلہ میں کس نے کی؟
    options:
    - text:
        ar: ريتشارد قلب الأسد
        en: Richard the Lionheart
        ur: رچرڈ لائن ہارٹ
      correct: true
      why:
        ar: تذكر المصادر ملك إنكلترا قائدًا
        en: the sources name England''s king as leader
        ur: ماخذ انگلستان کے بادشاہ کو قائد لکھتے ہیں
    - text:
        ar: نابليون
        en: Napoleon
        ur: نپولین
      correct: false
      why:
        ar: جاء نابليون بعده بستة قرون
        en: Napoleon came six centuries later
        ur: نپولین چھ صدیوں بعد آیا
    - text:
        ar: شارلمان
        en: Charlemagne
        ur: شارلمین
      correct: false
      why:
        ar: كان شارلمان قبله بقرون
        en: Charlemagne was centuries earlier
        ur: شارلمین اس سے صدیوں پہلے تھا
    - text:
        ar: هولاكو
        en: Hulagu
        ur: ہلاکو
      correct: false
      why:
        ar: كان هولاكو مغوليًّا لا صليبيًّا
        en: Hulagu was Mongol, not Crusader
        ur: ہلاکو مغل تھا، صلیبی نہیں
  - q:
      ar: كم بقيت القدس محتلة قبل استعادتها؟
      en: How long was Jerusalem occupied before her recovery?
      ur: بیت المقدس واپسی سے پہلے کتنی دیر مقبوضہ رہی؟
    options:
    - text:
        ar: ثمانية وثمانين عامًا
        en: eighty-eight years
        ur: اٹھاسی سال
      correct: true
      why:
        ar: من ١٠٩٩ إلى ١١٨٧ ثمانية وثمانون
        en: 1099 to 1187 is eighty-eight
        ur: 1099 سے 1187 اٹھاسی ہے
    - text:
        ar: عشر سنوات
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أقلّ بكثير من المدة
        en: ten is far short of the span
        ur: دس عرصے سے کہیں کم ہے
    - text:
        ar: قرن كامل
        en: a full century
        ur: پوری صدی
      correct: false
      why:
        ar: ثمانية وثمانون لا مئة
        en: eighty-eight, not a hundred
        ur: اٹھاسی، سو نہیں
    - text:
        ar: أربعمائة عام
        en: four hundred years
        ur: چار سو سال
      correct: false
      why:
        ar: لم تدم القرون الأربعة
        en: the four centuries did not last
        ur: چار صدیاں نہیں رہیں
  - q:
      ar: أين مات صلاح الدين؟
      en: Where did Saladin die?
      ur: صلاح الدین کہاں فوت ہوا؟
    options:
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: true
      why:
        ar: تذكر المصادر وفاته في دمشق ١١٩٣
        en: the sources record his death in Damascus in 1193
        ur: ماخذ اس کی وفات 1193 میں دمشق میں لکھتے ہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: بنى فيها القلعة لكن مات في دمشق
        en: he built the citadel there but died in Damascus
        ur: اس نے وہاں قلعہ بنایا مگر دمشق میں فوت ہوا
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: استعادها لكن مات في دمشق
        en: he recovered her but died in Damascus
        ur: اس نے اسے واپس لیا مگر دمشق میں فوت ہوا
    - text:
        ar: في مكة
        en: in Mecca
        ur: مکہ میں
      correct: false
      why:
        ar: لم يمت في مكة
        en: he did not die in Mecca
        ur: وہ مکہ میں فوت نہیں ہوا
  - q:
      ar: ماذا بنا صلاح الدين؟
      en: What did Saladin build?
      ur: صلاح الدین نے کیا بنایا؟
    options:
    - text:
        ar: قلعة القاهرة ومدارس مصر والشام
        en: Cairo''s citadel and schools in Egypt and Syria
        ur: قاہرہ کا قلعہ اور مصر و شام کے مدرسے
      correct: true
      why:
        ar: تذكر المصادر حصنه ومدارسه
        en: the sources name his fortress and schools
        ur: ماخذ اس کے قلعہ اور مدرسوں کا ذکر کرتے ہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: بنتها الأموية قبله بخمسة قرون
        en: the Umayyads built it five centuries before him
        ur: امویوں نے اس سے پانچ صدیاں پہلے بنائی
    - text:
        ar: الحمراء
        en: the Alhambra
        ur: الحمرا
      correct: false
      why:
        ar: الحمراء في غرناطة لا الشام
        en: the Alhambra is in Granada, not Syria
        ur: الحمرا غرناطہ میں ہے، شام میں نہیں
    - text:
        ar: تاج محل
        en: the Taj Mahal
        ur: تاج محل
      correct: false
      why:
        ar: تاج محل في الهند بعده بقرون
        en: the Taj Mahal is in India, centuries later
        ur: تاج محل ہندوستان میں ہے، صدیوں بعد
  - q:
      ar: ماذا أنهى صلح الرملة؟
      en: What did the peace of Ramla end?
      ur: رملہ کے صلح نے کیا ختم کیا؟
    options:
    - text:
        ar: الحملة الثالثة ١١٩٢
        en: the Third Crusade in 1192
        ur: تیسری مہم 1192 میں
      correct: true
      why:
        ar: تذكر المصادر الصلح بينه وبين ريتشارد
        en: the sources name the accord between him and Richard
        ur: ماخذ اس کے اور رچرڈ کے درمیان معاہدہ لکھتے ہیں
    - text:
        ar: الخلافة الفاطمية
        en: the Fatimid caliphate
        ur: فاطمی خلافت
      correct: false
      why:
        ar: انتهت الفاطمية قبلها بعشرين عامًا
        en: the Fatimids ended twenty years earlier
        ur: فاطمی بیس سال پہلے ختم ہوئی
    - text:
        ar: الحرب العالمية
        en: the world war
        ur: عالمی جنگ
      correct: false
      why:
        ar: لم تكن حروب عالمية في عصره
        en: there were no world wars in his age
        ur: اس کے دور میں عالمی جنگیں نہیں تھیں
    - text:
        ar: حكم المماليك
        en: Mamluk rule
        ur: مملوکی حکومت
      correct: false
      why:
        ar: جاء المماليك بعده بعقود
        en: the Mamluks came decades later
        ur: مملوک دہائیوں بعد آئے
  - q:
      ar: ماذا يدلّ فقره عند موته؟
      en: What does his poverty at death show?
      ur: موت کے وقت اس کی فقیری کیا بتاتی ہے؟
    options:
    - text:
        ar: أنه أنفق ثروته على الجهاد والبناء
        en: that he spent his wealth on jihad and building
        ur: کہ اس نے اپنی دولت جہاد اور تعمیر پر خرچ کی
      correct: true
      why:
        ar: تذكر المصادر نفقاته لا ادخاره
        en: the sources record his spending, not saving
        ur: ماخذ اس کے خرچ کا ذکر کرتے ہیں، بچت کا نہیں
    - text:
        ar: أنه كان فقيرًا منذ الولادة
        en: that he was poor from birth
        ur: کہ وہ پیدائش سے فقیر تھا
      correct: false
      why:
        ar: جاء من أسرة عسكرية مرموقة
        en: he came from a prominent military family
        ur: وہ ایک ممتاز فوجی خاندان سے آیا
    - text:
        ar: أنه خسر ماله في التجارة
        en: that he lost his money trading
        ur: کہ اس نے تجارت میں مال کھویا
      correct: false
      why:
        ar: لم يكن تاجرًا بل قائدًا
        en: he was a commander, not a trader
        ur: وہ تاجر نہیں، سردار تھا
    - text:
        ar: أن الناس سرقوا ماله
        en: that people stole his money
        ur: کہ لوگوں نے اس کا مال چرایا
      correct: false
      why:
        ar: تذكر المصادر إنفاقه لا السرقة
        en: the sources record spending, not theft
        ur: ماخذ خرچ کا ذکر کرتے ہیں، چوری کا نہیں
  - q:
      ar: لماذا يعدّ صلاح الدين مهمًّا؟
      en: Why is Saladin important?
      ur: صلاح الدین کیوں اہم ہے؟
    options:
    - text:
        ar: لوحدته الجبهة واستعادته القدس
        en: for uniting the front and recovering Jerusalem
        ur: محاذ متحد کرنے اور بیت المقدس واپس لینے کے لیے
      correct: true
      why:
        ar: جمع مصر والشام واستعاد المدينة في المصادر
        en: the sources have him join Egypt and Syria and retake the city
        ur: ماخذ میں اس نے مصر اور شام کو جوڑا اور شہر واپس لیا
    - text:
        ar: لأنه أول سلطان عثماني
        en: because he was the first Ottoman sultan
        ur: کیونکہ وہ پہلا عثمانی سلطان تھا
      correct: false
      why:
        ar: كان قبل العثمانيين بقرنين ونصف
        en: he was two and a half centuries before the Ottomans
        ur: وہ عثمانیوں سے ڈھائی صدی پہلے تھا
    - text:
        ar: لأنه غزا أوروبا
        en: because he invaded Europe
        ur: کیونکہ اس نے یورپ پر حملہ کیا
      correct: false
      why:
        ar: لم يغزُ أوروبا بل قاتل في بلاده
        en: he did not invade Europe; he fought in his lands
        ur: اس نے یورپ پر حملہ نہیں کیا، اپنے ملکوں میں لڑا
    - text:
        ar: لأنه كتب القرآن
        en: because he wrote the Qur''an
        ur: کیونکہ اس نے قرآن لکھا
      correct: false
      why:
        ar: لم يكتب قرآنًا بل كان قائدًا
        en: he was a commander, not a writer of scripture
        ur: وہ سردار تھا، صحیفہ لکھنے والا نہیں
- id: mansa-musa
  anchor: person/mansa-musa
  band: researchers
  title:
    ar: مانسا موسى
    en: Mansa Musa
    ur: مانسا موسی
  sixty:
    ar: 'مانسا موسى ملك مالي، أغنى حاكم في ذاكرة التاريخ: حجّ إلى مكة عام ١٣٢٤ في موكب قيل إنه ضمّ ستين ألفًا وثمانين بعيرًا من الذهب، حتى خفّض سعر الذهب في القاهرة
      سنين. أنفق على طريق الحج، وبنى مسجد جنكربر في تمبكتو وجلب العلماء والمعماريين إلى مملكته. جعل إمبراطوريته على طرق الملح والذهب أغنى دول أفريقيا الغربية، وظهرت
      مملكته على خريطة كتالانية عام ١٣٧٥ يحمل قطعة ذهب. مات ١٣٣٧ تاركًا مملكة تقاس بالعالم الإسلامي والأوروبي معًا.  ومانسا موسى نفسه درس في الثروة: كيف تُبنى الإمبراطورية على التجارة والعلم معًا، وكيف تُوزع الأموال بسخاء حتى تصير القصة أكبر من الأرقام، وكيف يجعل الحج ملكًا حاجًّا مثل غيره في الموقف.  وأعطى مالي صورتها الذهبية في التاريخ: إمبراطورية ثروتها من الأرض وعزّها من العلم، وملكها في موسم الحج واحد من الناس.'
    en: 'Mansa Musa, king of Mali, the richest ruler in the memory of history: he made the Hajj to Mecca in 1324 in a caravan said to number sixty thousand and eighty
      camel-loads of gold, lowering the price of gold in Cairo for years. He spent along the pilgrimage road, built the Djinguereber mosque in Timbuktu and brought
      scholars and architects to his kingdom. He made his empire on the salt-and-gold roads the richest state in West Africa, and his realm appeared on the 1375 Catalan
      map holding a nugget of gold. He died in 1337 leaving a kingdom measured against the Islamic and European worlds alike.  And Mansa Musa himself is a study in wealth: how an empire is built on trade and learning together, how money given generously becomes a story bigger than the numbers, and how the Hajj makes a king a pilgrim like any other in the standing.'
    ur: 'مانسا موسی، مالی کا بادشاہ، تاریخ کی یادداشت میں امیر ترین حکمران: اس نے 1324 میں مکہ کا حج ایک ایسے قافلے میں کیا جس میں کہا جاتا ہے ساٹھ ہزار افراد اور
      اسی اونٹوں کا سونا تھا، جس نے قاہرہ میں سونے کی قیمت برسوں گرا دی۔ اس نے حج کی راہ پر خرچ کیا، تمبکٹو میں جنگربر مسجد بنائی اور علماء اور معماروں کو اپنی سلطنت
      میں لایا۔ اس نے اپنی سلطنت کو نمک اور سونے کی راہوں پر مغربی افریقہ کی امیر ترین ریاست بنایا، اور اس کی سلطنت 1375 کے کیٹلن نقشے پر سونے کا ٹکڑا تھامے دکھائی
      دیتی ہے۔ وہ 1337 میں فوت ہوا، ایک ایسی سلطنت چھوڑ کر جو اسلامی اور یورپی دنیا کے ساتھ ناپی جائے۔  اور خود مانسا موسی دولت کا سبق ہے: سلطنت تجارت اور علم دونوں پر کیسے بنتی ہے، فراخدلی سے بانٹی گئی دولت کہانی میں اعداد سے بڑی کیسے ہوتی ہے، اور حج بادشاہ کو موقف میں ہر حاجی جیسا کیسے بناتا ہے۔'
  glossary:
  - term:
      ar: مانسا
      en: Mansa
      ur: مانسا
    gloss:
      ar: 'لقب ملوك مالي ومعناه الإمبراطور فوق الملوك'
      en: 'the title Mali''s kings carried, meaning emperor above the kings'
      ur: 'مالی کے بادشاہوں کا لقب جس کا مطلب ہے بادشاہوں سے اوپر شہنشاہ'
  - term:
      ar: مالي
      en: Mali
      ur: مالی
    gloss:
      ar: 'مملكته الغرب أفريقية القائمة على طرق الملح والذهب'
      en: 'his West African kingdom, built on the salt and gold roads'
      ur: 'اس کی مغربی افریقی سلطنت جو نمک اور سونے کی راہوں پر قائم تھی'
  - term:
      ar: ١٣٢٤
      en: '1324'
      ur: '1324'
    gloss:
      ar: 'سنة حجّه الشهير الذي سجّلته المصادر'
      en: 'the year of his famous Hajj, which the chronicles recorded'
      ur: 'اس کے مشہور حج کا سال جسے مؤرخوں نے محفوظ کیا'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'رحلته إلى مكة التي صارت أسطورة الكرم'
      en: 'his journey to Mecca, which became the legend of generosity'
      ur: 'اس کا مکہ کا سفر جو سخاوت کی داستان بن گیا'
  - term:
      ar: الذهب
      en: the gold
      ur: سونا
    gloss:
      ar: 'معدن مملكته الذي خفّض سعره في القاهرة بسخائه'
      en: 'his kingdom''s metal, whose price in Cairo his lavish spending lowered'
      ur: 'اس کی سلطنت کی وہ دولت جس نے قاہرہ میں اس کی سخاوت سے سونے کا دام گرایا'
  - term:
      ar: القاهرة
      en: Cairo
      ur: قاہرہ
    gloss:
      ar: 'المدينة التي مرّ بها حاجًّا وأنفق فيها بلا حساب'
      en: 'the city he passed through as a pilgrim, spending without counting'
      ur: 'وہ شہر جس سے وہ حاجی بن کر گزرا اور بغیر گنے خرچ کرتا رہا'
  - term:
      ar: تمبكتو
      en: Timbuktu
      ur: تمبکٹو
    gloss:
      ar: 'مدينته التي بناها فيها جامع جنكربر'
      en: 'his city on the Niger bend, where he built the Djinguereber mosque'
      ur: 'اس کا شہر دریائے نائجر کے موڑ پر، جہاں اس نے جنگربر مسجد بنائی'
  - term:
      ar: جنكربر
      en: Djinguereber
      ur: جنگربر
    gloss:
      ar: 'المسجد الذي أقامه بعد عودته من الحج'
      en: 'the mosque he raised after returning home from the Hajj'
      ur: 'وہ مسجد جو اس نے حج سے واپسی کے بعد بنوائی'
  - term:
      ar: الملح
      en: the salt
      ur: نمک
    gloss:
      ar: 'سلعة الشمال التي كانت مع الذهب عماد تجارته'
      en: 'the northern goods that, with gold, were the core of his trade'
      ur: 'شمال کی وہ جنس جو سونے کے ساتھ اس کی تجارت کی بنیاد تھی'
  - term:
      ar: الكتالانية
      en: the Catalan
      ur: کیٹلن
    gloss:
      ar: 'الخريطة الأوروبية التي ظهرت عليها مملكته سنة ١٣٧٥م'
      en: 'the European atlas on which his kingdom famously appeared in 1375'
      ur: 'وہ یورپی نقشہ جس پر 1375 میں اس کی سلطنت نمایاں ہوئی'
  - term:
      ar: العلماء
      en: the scholars
      ur: علماء
    gloss:
      ar: 'العلماء والمهندسون الذين استدعاهم إلى مملكته'
      en: 'the scholars and architects he summoned to serve his kingdom'
      ur: 'وہ علماء اور معمار جنہیں اس نے اپنی سلطنت میں بلوایا'
  - term:
      ar: ١٣٣٧
      en: '1337'
      ur: '1337'
    gloss:
      ar: 'السنة التقريبية لوفاته بعد نحو ثلاثين سنة من الحكم'
      en: 'the rough year of his death, after some thirty years of rule'
      ur: 'اس کی وفات کا تقریبی سال، تقریباً تیس سالہ حکومت کے بعد'
  practice:
  - q:
      ar: من مانسا موسى؟
      en: Who was Mansa Musa?
      ur: مانسا موسی کون تھا؟
    options:
    - text:
        ar: ملك مالي وأغنى حاكم في الذاكرة
        en: Mali''s king and the richest ruler in memory
        ur: مالی کا بادشاہ اور یادداشت میں امیر ترین حکمران
      correct: true
      why:
        ar: تصفه المصادر بأغنى ملوك عصره
        en: the sources call him the richest king of his age
        ur: ماخذ اسے اپنے دور کا امیر ترین بادشاہ کہتے ہیں
    - text:
        ar: سلطان عثماني
        en: an Ottoman sultan
        ur: عثمانی سلطان
      correct: false
      why:
        ar: كان أفريقيًّا لا عثمانيًّا
        en: he was African, not Ottoman
        ur: وہ افریقی تھا، عثمانی نہیں
    - text:
        ar: تاجر إيطالي
        en: an Italian trader
        ur: اطالوی تاجر
      correct: false
      why:
        ar: كان ملكًا لا تاجرًا
        en: he was a king, not a trader
        ur: وہ بادشاہ تھا، تاجر نہیں
    - text:
        ar: رحّالة صيني
        en: a Chinese traveller
        ur: چینی مسافر
      correct: false
      why:
        ar: كان ملك مالي لا رحّالة
        en: he was Mali''s king, not a traveller
        ur: وہ مالی کا بادشاہ تھا، مسافر نہیں
  - q:
      ar: متى حجّ إلى مكة؟
      en: When did he make the Hajj to Mecca?
      ur: اس نے مکہ کا حج کب کیا؟
    options:
    - text:
        ar: عام ١٣٢٤
        en: in 1324
        ur: 1324 میں
      correct: true
      why:
        ar: تذكر المصادر موكبه في القاهرة ذلك العام
        en: the sources place his caravan in Cairo that year
        ur: ماخذ اس سال قاہرہ میں اس کا قافلہ رکھتے ہیں
    - text:
        ar: عام ١٢٩١
        en: in 1291
        ur: 1291 میں
      correct: false
      why:
        ar: ذلك عام سقوط عكا لا حجّه
        en: that is Acre''s fall, not his Hajj
        ur: یہ عکہ کے گرنے کا سال ہے، اس کے حج کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك عام فتح القسطنطينية
        en: that is Constantinople''s conquest
        ur: یہ قسطنطنیہ کی فتح کا سال ہے
    - text:
        ar: لم يحجّ أبدًا
        en: he never made Hajj
        ur: اس نے کبھی حج نہیں کیا
      correct: false
      why:
        ar: حجّه من أشهر المواكب في التاريخ
        en: his Hajj is among history''s most famous processions
        ur: اس کا حج تاریخ کے مشہور ترین جلوسوں میں ہے
  - q:
      ar: ماذا فعل موكبه بسعر الذهب؟
      en: What did his caravan do to gold''s price?
      ur: اس کے قافلے نے سونے کی قیمت کا کیا کیا؟
    options:
    - text:
        ar: خفّضه في القاهرة لسنين
        en: lowered it in Cairo for years
        ur: قاہرہ میں برسوں کے لیے گرا دیا
      correct: true
      why:
        ar: تذكر المصادر كثرة إنفاقه أثّرت في السوق
        en: the sources say his spending affected the market
        ur: ماخذ کہتے ہیں اس کے خرچ نے بازار پر اثر ڈالا
    - text:
        ar: رفعه ضعفين
        en: doubled it
        ur: دو گنا بڑھا دیا
      correct: false
      why:
        ar: انخفض السعر لكثرة الذهب لا ارتفع
        en: the price fell for gold''s abundance
        ur: بہت زیادہ سونے کی وجہ سے قیمت گری
    - text:
        ar: لم يؤثّر
        en: no effect
        ur: کوئی اثر نہیں
      correct: false
      why:
        ar: أثّر إنفاقه في سوق الذهب
        en: his spending moved the gold market
        ur: اس کے خرچ نے سونے کی مارکیٹ ہلائی
    - text:
        ar: ألغى الذهب
        en: abolished gold
        ur: سونا ختم کر دیا
      correct: false
      why:
        ar: لم يلغِ المعدن بل أنفق منه
        en: he did not abolish the metal, he spent it
        ur: اس نے دھات ختم نہیں کی، خرچ کی
  - q:
      ar: ماذا بنا في تمبكتو؟
      en: What did he build in Timbuktu?
      ur: اس نے تمبکٹو میں کیا بنایا؟
    options:
    - text:
        ar: مسجد جنكربر
        en: the Djinguereber mosque
        ur: جنگربر مسجد
      correct: true
      why:
        ar: تنسب المصادر بناءه إليه في المصادر
        en: the sources credit the building to him
        ur: ماخذ تعمیر اس سے منسوب کرتے ہیں
    - text:
        ar: قبة الصخرة
        en: the Dome of the Rock
        ur: گنبدِ صخرہ
      correct: false
      why:
        ar: قبة الصخرة في القدس لا تمبكتو
        en: the Dome of the Rock is in Jerusalem, not Timbuktu
        ur: گنبدِ صخرہ بیت المقدس میں ہے، تمبکٹو میں نہیں
    - text:
        ar: الحمراء
        en: the Alhambra
        ur: الحمرا
      correct: false
      why:
        ar: الحمراء في الأندلس لا أفريقيا
        en: the Alhambra is in al-Andalus, not Africa
        ur: الحمرا اندلس میں ہے، افریقہ میں نہیں
    - text:
        ar: القلعة
        en: the citadel
        ur: قلعہ
      correct: false
      why:
        ar: القلعة في القاهرة لا تمبكتو
        en: the citadel is in Cairo, not Timbuktu
        ur: قلعہ قاہرہ میں ہے، تمبکٹو میں نہیں
  - q:
      ar: من جلب إلى مملكته؟
      en: Whom did he bring to his kingdom?
      ur: وہ اپنی سلطنت میں کسے لایا؟
    options:
    - text:
        ar: العلماء والمعماريين
        en: scholars and architects
        ur: علماء اور معمار
      correct: true
      why:
        ar: تذكر المصادر من جاء معه من حجّه
        en: the sources name those who came with him from his Hajj
        ur: ماخذ ان لوگوں کا ذکر کرتے ہیں جو اس کے حج سے ساتھ آئے
    - text:
        ar: الجنود الفرنجة
        en: Frankish soldiers
        ur: فرنگی سپاہی
      correct: false
      why:
        ar: لم يجلب فرنجة بل علماء
        en: he brought scholars, not Franks
        ur: وہ فرنگی نہیں، علماء لایا
    - text:
        ar: التجار الصينيين
        en: Chinese traders
        ur: چینی تاجر
      correct: false
      why:
        ar: جلب العلماء لا التجار الصينيين
        en: he brought scholars, not Chinese traders
        ur: وہ علماء لایا، چینی تاجر نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: جلب العلماء والمعماريين في المصادر
        en: the sources have him bring scholars and architects
        ur: ماخذ میں وہ علماء اور معمار لایا
  - q:
      ar: على ماذا قامت ثروة مملكته؟
      en: What did his kingdom''s wealth stand on?
      ur: اس کی سلطنت کی دولت کس پر قائم تھی؟
    options:
    - text:
        ar: طرق الملح والذهب
        en: the salt-and-gold roads
        ur: نمک اور سونے کی راہیں
      correct: true
      why:
        ar: جمعت تجارة الصحراء ثروته في المصادر
        en: desert trade gathered his wealth in the sources
        ur: صحرائی تجارت نے ماخذ میں اس کی دولت جمع کی
    - text:
        ar: صيد الحيتان
        en: whale hunting
        ur: وہیل کا شکار
      correct: false
      why:
        ar: مالي صحراوية لا بحرية
        en: Mali is desert, not coastal
        ur: مالی صحرائی ہے، ساحلی نہیں
    - text:
        ar: النفط
        en: oil
        ur: تیل
      correct: false
      why:
        ar: لم يكن النفط بضاعة عصره
        en: oil was not his age''s goods
        ur: تیل اس کے دور کی جنس نہیں تھی
    - text:
        ar: الحرير
        en: silk
        ur: ریشم
      correct: false
      why:
        ar: كانت تجارته ملحًا وذهبًا لا حريرًا
        en: his trade was salt and gold, not silk
        ur: اس کی تجارت نمک اور سونا تھی، ریشم نہیں
  - q:
      ar: أين ظهرت مملكته عام ١٣٧٥؟
      en: Where did his kingdom appear in 1375?
      ur: اس کی سلطنت 1375 میں کہاں دکھائی دی؟
    options:
    - text:
        ar: على الخريطة الكتالانية
        en: on the Catalan map
        ur: کیٹلن نقشے پر
      correct: true
      why:
        ar: يظهر على الخريطة يحمل ذهبًا
        en: he appears on the map holding gold
        ur: وہ نقشے پر سونا تھامے دکھائی دیتا ہے
    - text:
        ar: على عملة رومانية
        en: on a Roman coin
        ur: رومی سکہ پر
      correct: false
      why:
        ar: لم تسكّ روما عملة له
        en: Rome minted no coin of him
        ur: روم نے اس کا سکہ نہیں ڈھالا
    - text:
        ar: في كتاب صيني
        en: in a Chinese book
        ur: چینی کتاب میں
      correct: false
      why:
        ar: ظهرت على الخريطة الكتالانية لا الصينية
        en: it appeared on the Catalan, not Chinese, map
        ur: یہ کیٹلن نقشے پر دکھائی دی، چینی پر نہیں
    - text:
        ar: في معرض باريس
        en: in a Paris exhibition
        ur: پیرس کی نمائش میں
      correct: false
      why:
        ar: الخريطة قبل المعارض الحديثة
        en: the map predates modern exhibitions
        ur: نقشہ جدید نمائشوں سے پہلے کا ہے
  - q:
      ar: متى مات؟
      en: When did he die?
      ur: وہ کب فوت ہوا؟
    options:
    - text:
        ar: عام ١٣٣٧
        en: in 1337
        ur: 1337 میں
      correct: true
      why:
        ar: تذكر المصادر وفاته نحو ١٣٣٧
        en: the sources date his death about 1337
        ur: ماخذ اس کی وفات تقریباً 1337 لکھتے ہیں
    - text:
        ar: عام ١٣٢٤
        en: in 1324
        ur: 1324 میں
      correct: false
      why:
        ar: ذلك عام حجّه لا وفاته
        en: that is his Hajj year, not his death
        ur: یہ اس کے حج کا سال ہے، وفات کا نہیں
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ذلك بعد موته بأكثر من قرن
        en: that is over a century after his death
        ur: یہ اس کی وفات سے ایک صدی سے زیادہ بعد ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر كسائر الناس
        en: he died in the sources like all people
        ur: وہ ماخذ میں سب کی طرح فوت ہوا
  - q:
      ar: لماذا يهمّ حجّه؟
      en: Why does his Hajj matter?
      ur: اس کا حج کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه وصل مالي بالعالم الإسلامي وأظهر ثروتها
        en: because it linked Mali to the Islamic world and showed her wealth
        ur: کیونکہ اس نے مالی کو اسلامی دنیا سے جوڑا اور اس کی دولت دکھائی
      correct: true
      why:
        ar: ظهر موكبه في القاهرة ومصر والخرائط
        en: his caravan showed in Cairo and on maps
        ur: اس کا قافلہ قاہرہ اور نقشوں پر دکھائی دیا
    - text:
        ar: لأنه أول حجّ في التاريخ
        en: because it was history''s first Hajj
        ur: کیونکہ یہ تاریخ کا پہلا حج تھا
      correct: false
      why:
        ar: حجّ الناس قبله بقرون
        en: people made Hajj centuries before him
        ur: لوگ اس سے صدیوں پہلے حج کرتے تھے
    - text:
        ar: لأنه اكتشف الذهب
        en: because he discovered gold
        ur: کیونکہ اس نے سونا دریافت کیا
      correct: false
      why:
        ar: كان الذهب معروفًا قبله
        en: gold was known before him
        ur: سونا اس سے پہلے معروف تھا
    - text:
        ar: لا أهمية له
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: يذكره المؤرخون والخرائط
        en: historians and maps record him
        ur: مؤرخین اور نقشے اسے لکھتے ہیں
  - q:
      ar: من كتب عن مانسا موسى؟
      en: Who wrote about Mansa Musa?
      ur: مانسا موسی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو مصر والمغرب ورحّالة
        en: Egyptian and Maghrebi historians and travellers
        ur: مصری اور مغربی مؤرخین اور مسافر
      correct: true
      why:
        ar: تصلنا روايات العمري وابن خلدون
        en: al-Umari''s and Ibn Khaldun''s accounts reach us
        ur: عمری اور ابن خلدون کی روایتیں ہم تک پہنچیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقه مؤرخو عصره
        en: his age''s historians documented him
        ur: اس کے دور کے مؤرخین نے اسے ثبت کیا
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: كتب عنه العرب والأوروبيون
        en: Arabs and Europeans wrote of him
        ur: عرب اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: كتب المؤرخون العرب عنه قبل العثمانيين
        en: Arab historians wrote of him before the Ottomans
        ur: عرب مؤرخین نے عثمانیوں سے پہلے لکھا
- id: fatima-al-fihri
  anchor: person/fatima-al-fihri
  band: scholars
  title:
    ar: فاطمة الفهرية
    en: Fatima al-Fihri
    ur: فاطمہ الفہری
  sixty:
    ar: 'فاطمة الفهرية، تاجرة من القيروان انتقلت إلى فاس في القرن التاسع: ورثت ثروة من والدها وأنفقتها كلها على بناء مسجد القرويين عام ٨٥٩، فصار أقدم جامعة مستمرة
      في العالم بحسب اليونسكو وغينيس. صامت حتى اكتمل البناء، وجعلت المسجد مدرسة للفقه والنحو والمنطق والفلك والطب. خرّج القرويين مؤرخين مثل ابن خلدون وفلاسفة مثل
      ابن رشد وابن ميمون، وبقي منارة العلم المغربي ألف عام. ماتت ٨٨٠ تاركة إرثًا لم يُقَدّر بمال بل بعلم.  وقصتها درس في أن العطاء يصنع المؤسسات: امرأة واحدة بثروة ونية بنت جامعًا عاش أحد عشر قرنًا، وما زال طلابه يتعلمون في صحنه. وبهذا تكون فاطمة الفهرية نموذج الأوقاف الإسلامية: مال يتحول إلى علم يخدم الأجيال.  وبها تكتمل حكاية القرويين: امرأة تقود، ووقف يبقى، وجامعة تُعطي بلا مقابل، حتى صار اسمها اسم فاس نفسها.'
    en: 'Fatima al-Fihri, a merchant from Kairouan who moved to Fez in the ninth century: she inherited wealth from her father and spent it all building the al-Qarawiyyin
      mosque in 859, which UNESCO and Guinness rank as the world''''s oldest continuously operating university. She fasted until the building was finished, and she
      made the mosque a school of jurisprudence, grammar, logic, astronomy and medicine. Al-Qarawiyyin graduated historians like Ibn Khaldun and philosophers like
      Ibn Rushd and Maimonides, and it stayed Morocco''''s beacon of learning for a thousand years. She died in 880 leaving a legacy measured not in money but in
      learning.  Her story is a lesson in what giving builds: one woman with wealth and intent founded a mosque that lived eleven centuries, and its students still learn in its court. In this Fatima al-Fihri is the model of Islamic endowments — wealth turned into knowledge that serves the generations.'
    ur: 'فاطمہ الفہری، قیروان کی ایک تاجر خاتون جو نویں صدی میں فاس منتقل ہوئی: اس نے والد سے وراثت میں دولت پائی اور وہ سب 859 میں مسجد القرویین بنانے پر خرچ کی،
      جسے یونیسکو اور گنیز دنیا کا قدیم ترین مسلسل چلنے والا جامعہ کہتے ہیں۔ وہ تعمیر مکمل ہونے تک روزے رکھتی رہی، اور اس نے مسجد کو فقہ، نحو، منطق، فلکیات اور طب
      کا مدرسہ بنایا۔ القرویین نے ابن خلدون جیسے مؤرخین اور ابن رشد اور میمونیدس جیسے فلاسفہ پیدا کیے، اور یہ ایک ہزار سال مراکش کے علم کی مینار رہی۔ وہ 880 میں فوت
      ہوئی، ایک ایسا ورثہ چھوڑ کر جو مال سے نہیں بلکہ علم سے ناپا جاتا ہے۔  اس کی کہانی عطاء کی طاقت کا سبق ہے: ایک خاتون جس کے پاس دولت اور نیت تھی نے وہ مسجد بنائی جو گیارہ صدیاں جی، اور اس کے طلبہ اب بھی اس کے صحن میں سیکھتے ہیں۔ اس طرح فاطمہ الفہری اسلامی اوقاف کا نمونہ ہے — وہ مال جو علم میں بدل کر نسلوں کے کام آئے۔'
  glossary:
  - term:
      ar: القيروان
      en: Kairouan
      ur: قیروان
    gloss:
      ar: 'القيروان، مدينتها الأصلية في تونس اليوم قبل انتقالها إلى فاس'
      en: 'Kairouan, her home city in what is now Tunisia, before she moved to Fez'
      ur: 'قیروان، اس کا آبائی شہر جو آج تیونس میں ہے، اس سے پہلے کہ وہ فاس منتقل ہوئی'
  - term:
      ar: فاس
      en: Fez
      ur: فاس
    gloss:
      ar: 'المدينة التي انتقلت إليها وبنت فيها مسجدها'
      en: 'the Moroccan city she moved to, where she built her mosque'
      ur: 'وہ مراکشی شہر جہاں وہ منتقل ہوئی اور اپنی مسجد بنائی'
  - term:
      ar: القرويين
      en: al-Qarawiyyin
      ur: قرویین
    gloss:
      ar: 'مسجدها وجامعتها التي دامت أحد عشر قرنًا من العلم'
      en: 'her mosque and school, which has carried learning for eleven centuries'
      ur: 'اس کی مسجد اور مدرسہ جو گیارہ صدیوں سے علم کا گھر ہے'
  - term:
      ar: ٨٥٩
      en: '859'
      ur: '859'
    gloss:
      ar: 'سنة بناء المسجد في عهد الأدارسة'
      en: 'the year the mosque was built, under the Idrisid rulers'
      ur: 'مسجد کی تعمیر کا سال، ادریسی حکمرانوں کے عہد میں'
  - term:
      ar: اليونسكو
      en: UNESCO
      ur: یونیسکو
    gloss:
      ar: 'الهيئة العالمية التي صنّفتها أقدم جامعة عاملة'
      en: 'the world body that counts her school the oldest still-running university'
      ur: 'عالمی ادارہ جس نے اس کے مدرسے کو قدیم ترین چلتی یونیورسٹی قرار دیا'
  - term:
      ar: ابن خلدون
      en: Ibn Khaldun
      ur: ابن خلدون
    gloss:
      ar: 'المؤرخ العظيم صاحب المقدمة الذي تعلّم في مدرسة القرويين'
      en: 'the great historian of the Muqaddima, who studied at al-Qarawiyyin'
      ur: 'مقدمہ کے عظیم مؤرخ جس نے قرویین میں تعلیم حاصل کی'
  - term:
      ar: ابن رشد
      en: Ibn Rushd
      ur: ابن رشد
    gloss:
      ar: 'الفيلسوف الذي تربطه الذاكرة بمدرستها ومدينتها'
      en: 'the philosopher whose memory the school and her city keep'
      ur: 'وہ فلسفی جس کی یاد مدرسہ اور اس کا شہر قائم رکھتے ہیں'
  - term:
      ar: ابن ميمون
      en: Maimonides
      ur: میمونیدس
    gloss:
      ar: 'الفيلسوف اليهودي الكبير الذي تذكره الروايات إلى جانب مدرستها ومدينتها'
      en: 'the great Jewish philosopher the accounts remember beside her school and her city'
      ur: 'عظیم یہودی فلسفی جسے روایات اس کے مدرسے اور اس کے شہر کے ساتھ یاد رکھتی ہیں'
  - term:
      ar: الفقه
      en: jurisprudence
      ur: فقہ
    gloss:
      ar: 'علم الأحكام الذي دُرّس في مدرستها'
      en: 'the science of law that was taught in her school'
      ur: 'احکام کا وہ علم جو اس کے مدرسے میں پڑھایا جاتا تھا'
  - term:
      ar: الفلك
      en: astronomy
      ur: فلکیات
    gloss:
      ar: 'علم السماء الذي تعلّمه طلابها في المدرسة'
      en: 'the science of the heavens her students learned in the school'
      ur: 'آسمانوں کا علم جو اس کے مدرسے کے طالب علم سیکھتے تھے'
  - term:
      ar: ٨٨٠
      en: '880'
      ur: '880'
    gloss:
      ar: 'السنة التقريبية لوفاتها بعد إنجازها'
      en: 'the rough year of her death, after her achievement was complete'
      ur: 'اس کی وفات کا تقریبی سال، اس کے کارنامے کے مکمل ہونے کے بعد'
  - term:
      ar: الصوم
      en: the fast
      ur: روزہ
    gloss:
      ar: 'صيامها الذي حافظت عليه حتى اكتمل البناء'
      en: 'the fast she is remembered to have kept until the building was finished'
      ur: 'اس کا روزہ جسے وہ عمارت مکمل ہونے تک قائم رکھتی رہی'
  practice:
  - q:
      ar: من فاطمة الفهرية؟
      en: Who was Fatima al-Fihri?
      ur: فاطمہ الفہری کون تھی؟
    options:
    - text:
        ar: تاجرة بنت أقدم جامعة مستمرة
        en: a merchant who built the oldest continuous university
        ur: ایک تاجر خاتون جس نے قدیم ترین مسلسل جامعہ بنایا
      correct: true
      why:
        ar: تنسب المصادر بناء القرويين إليها
        en: the sources credit al-Qarawiyyin to her
        ur: ماخذ قرویین کو اس سے منسوب کرتے ہیں
    - text:
        ar: ملكة الأندلس
        en: the queen of al-Andalus
        ur: اندلس کی ملکہ
      correct: false
      why:
        ar: كانت تاجرة لا ملكة
        en: she was a merchant, not a queen
        ur: وہ تاجر تھی، ملکہ نہیں
    - text:
        ar: عالمة عباسية
        en: an Abbasid scholar
        ur: عباسی عالمہ
      correct: false
      why:
        ar: كانت في المغرب لا بغداد
        en: she was in Morocco, not Baghdad
        ur: وہ مراکش میں تھی، بغداد میں نہیں
    - text:
        ar: محاربة
        en: a warrior
        ur: سپاہی
      correct: false
      why:
        ar: كانت بانية مسجد لا محاربة
        en: she was a mosque-builder, not a warrior
        ur: وہ مسجد بنانے والی تھی، سپاہی نہیں
  - q:
      ar: متى بنّت القرويين؟
      en: When did she build al-Qarawiyyin?
      ur: اس نے قرویین کب بنایا؟
    options:
    - text:
        ar: عام ٨٥٩
        en: in 859
        ur: 859 میں
      correct: true
      why:
        ar: تذكر المصادر البناء في منتصف القرن التاسع
        en: the sources date the building mid-ninth century
        ur: ماخذ تعمیر نویں صدی کے وسط میں لکھتے ہیں
    - text:
        ar: عام ٦٩١
        en: in 691
        ur: 691 میں
      correct: false
      why:
        ar: ذلك عام قبة الصخرة لا القرويين
        en: that is the Dome''s year, not al-Qarawiyyin''s
        ur: یہ گنبد کا سال ہے، قرویین کا نہیں
    - text:
        ar: عام ١١٧١
        en: in 1171
        ur: 1171 میں
      correct: false
      why:
        ar: ذلك بعد بنائها بثلاثة قرون
        en: that is three centuries after her building
        ur: یہ اس کی تعمیر سے تین صدیاں بعد ہے
    - text:
        ar: لم تبنِ مسجدًا
        en: she built no mosque
        ur: اس نے کوئی مسجد نہیں بنائی
      correct: false
      why:
        ar: بنّت القرويين في المصادر
        en: the sources have her build al-Qarawiyyin
        ur: ماخذ میں اس نے قرویین بنایا
  - q:
      ar: أين القرويين؟
      en: Where is al-Qarawiyyin?
      ur: قرویین کہاں ہے؟
    options:
    - text:
        ar: في فاس بالمغرب
        en: in Fez, Morocco
        ur: مراکش میں فاس
      correct: true
      why:
        ar: تقف المدينة في شمال أفريقيا في المصادر
        en: the sources place the city in North Africa
        ur: ماخذ شہر کو شمالی افریقہ میں رکھتے ہیں
    - text:
        ar: في القيروان
        en: in Kairouan
        ur: قیروان میں
      correct: false
      why:
        ar: القيروان مدينتها الأصلية لا مكان المسجد
        en: Kairouan is her home city, not the mosque''s place
        ur: قیروان اس کا اصل شہر ہے، مسجد کی جگہ نہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: القرويين في المغرب لا مصر
        en: al-Qarawiyyin is in Morocco, not Egypt
        ur: قرویین مراکش میں ہے، مصر میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: القرويين في فاس لا دمشق
        en: al-Qarawiyyin is in Fez, not Damascus
        ur: قرویین فاس میں ہے، دمشق میں نہیں
  - q:
      ar: من أين جاءت ثروتها؟
      en: Where did her wealth come from?
      ur: اس کی دولت کہاں سے آئی؟
    options:
    - text:
        ar: وراثة من والدها التاجر
        en: an inheritance from her merchant father
        ur: اس کے تاجر والد کی وراثت
      correct: true
      why:
        ar: أنفقت ما ورثته على البناء في المصادر
        en: the sources have her spend the inheritance on building
        ur: ماخذ میں اس نے وراثت تعمیر پر خرچ کی
    - text:
        ar: من زواج
        en: from a marriage
        ur: شادی سے
      correct: false
      why:
        ar: كانت الثروة وراثة لا زواج
        en: the wealth was inheritance, not marriage
        ur: دولت وراثت تھی، شادی نہیں
    - text:
        ar: من غنيمة حرب
        en: from war spoils
        ur: جنگ کی غنیمت سے
      correct: false
      why:
        ar: لم تكن غنيمة بل وراثة
        en: it was inheritance, not spoils
        ur: یہ وراثت تھی، غنیمت نہیں
    - text:
        ar: من التجارة البحرية
        en: from sea trade
        ur: بحری تجارت سے
      correct: false
      why:
        ar: كانت الثروة وراثة أب
        en: the wealth was a father''s inheritance
        ur: دولت باپ کی وراثت تھی
  - q:
      ar: ماذا فعلت أثناء البناء؟
      en: What did she do during the building?
      ur: تعمیر کے دوران اس نے کیا کیا؟
    options:
    - text:
        ar: صامت حتى اكتمل
        en: she fasted until it finished
        ur: تعمیر مکمل ہونے تک روزے رکھے
      correct: true
      why:
        ar: تذكر الذاكرة صومها حتى الفراغ
        en: memory records her fasting to the end
        ur: یادداشت میں اس کے روزے آخر تک لکھے گئے
    - text:
        ar: سافرت للحج
        en: she travelled for Hajj
        ur: اس نے حج کا سفر کیا
      correct: false
      why:
        ar: تذكر المصادر صومها لا سفرها
        en: the sources record her fast, not travel
        ur: ماخذ اس کا روزہ لکھتے ہیں، سفر نہیں
    - text:
        ar: أوقفت البناء
        en: she stopped the building
        ur: اس نے تعمیر روکی
      correct: false
      why:
        ar: أكملت البناء في المصادر
        en: the sources have her complete it
        ur: ماخذ میں اس نے اسے مکمل کیا
    - text:
        ar: غيرت موقع المسجد
        en: she changed the site
        ur: اس نے مسجد کی جگہ بدلی
      correct: false
      why:
        ar: لم تغيّر الموقع في المصادر
        en: the sources have no site change
        ur: ماخذ میں جگہ کی تبدیلی نہیں
  - q:
      ar: من خرّج القرويين؟
      en: Whom did al-Qarawiyyin graduate?
      ur: قرویین نے کسے تیار کیا؟
    options:
    - text:
        ar: ابن خلدون وابن رشد وابن ميمون
        en: Ibn Khaldun, Ibn Rushd and Maimonides
        ur: ابن خلدون، ابن رشد اور میمونیدس
      correct: true
      why:
        ar: تربط الذاكرة هؤلاء بالقرويين
        en: memory ties these figures to al-Qarawiyyin
        ur: یادداشت انہیں قرویین سے جوڑتی ہے
    - text:
        ar: نيوتن وغاليليو
        en: Newton and Galileo
        ur: نیوٹن اور گلیلیو
      correct: false
      why:
        ar: كانوا أوروبيين لا في فاس
        en: they were European, not in Fez
        ur: وہ یورپی تھے، فاس میں نہیں
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: كان في إسطنبول لا فاس
        en: he was in Istanbul, not Fez
        ur: وہ استنبول میں تھا، فاس میں نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: خرّجت المدرسة أجيالًا من العلماء
        en: the school graduated generations of scholars
        ur: مدرسے نے نسلوں کے علماء تیار کیے
  - q:
      ar: ماذا دُرّس في القرويين؟
      en: What was taught at al-Qarawiyyin?
      ur: قرویین میں کیا پڑھایا گیا؟
    options:
    - text:
        ar: الفقه والنحو والمنطق والفلك والطب
        en: jurisprudence, grammar, logic, astronomy and medicine
        ur: فقہ، نحو، منطق، فلکیات اور طب
      correct: true
      why:
        ar: تذكر المصادر علوم مدرستها المتنوعة
        en: the sources name her school''s varied sciences
        ur: ماخذ اس کے مدرسے کے متنوع علوم کا ذکر کرتے ہیں
    - text:
        ar: الفقه فقط
        en: jurisprudence only
        ur: صرف فقہ
      correct: false
      why:
        ar: شملت علومًا عدة لا فقهًا فقط
        en: it covered several sciences, not just fiqh
        ur: اس میں کئی علوم شامل تھے، صرف فقہ نہیں
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: كانت مدرسة كاملة العلوم
        en: it was a full school of sciences
        ur: یہ مکمل علوم کا مدرسہ تھا
    - text:
        ar: الفن الحديث
        en: modern art
        ur: جدید فن
      correct: false
      why:
        ar: كانت علوم شرعية وعقلية قديمة
        en: its sciences were classical, not modern art
        ur: اس کے علوم کلاسیکی تھے، جدید فن نہیں
  - q:
      ar: ما مكانة القرويين؟
      en: What is al-Qarawiyyin''s standing?
      ur: قرویین کی کیا حیثیت ہے؟
    options:
    - text:
        ar: أقدم جامعة مستمرة بحسب اليونسكو
        en: the oldest continuous university per UNESCO
        ur: یونیسکو کے مطابق قدیم ترین مسلسل جامعہ
      correct: true
      why:
        ar: تصنّفها الهيئات الدولية أقدم جامعة
        en: international bodies rank it the oldest university
        ur: بین الاقوامی ادارے اسے قدیم ترین جامعہ کہتے ہیں
    - text:
        ar: أكبر مسجد في العالم
        en: the world''s largest mosque
        ur: دنیا کی سب سے بڑی مسجد
      correct: false
      why:
        ar: لم تكن أكبر بل أقدم
        en: it is oldest, not largest
        ur: یہ سب سے پرانا ہے، سب سے بڑا نہیں
    - text:
        ar: جامعة جديدة
        en: a new university
        ur: نیا جامعہ
      correct: false
      why:
        ar: قامت قبل ألف عام لا حديثًا
        en: it stood a thousand years ago, not recently
        ur: یہ ہزار سال پہلے قائم ہوا، حال میں نہیں
    - text:
        ar: متحف فقط
        en: only a museum
        ur: صرف عجائب گھر
      correct: false
      why:
        ar: بقيت جامعة عاملة لا متحفًا
        en: it stayed a working university, not a museum
        ur: یہ چلتا جامعہ رہا، عجائب گھر نہیں
  - q:
      ar: متى ماتت؟
      en: When did she die?
      ur: وہ کب فوت ہوئی؟
    options:
    - text:
        ar: عام ٨٨٠
        en: in 880
        ur: 880 میں
      correct: true
      why:
        ar: تذكر المصادر وفاتها نحو ٨٨٠
        en: the sources date her death about 880
        ur: ماخذ اس کی وفات تقریباً 880 لکھتے ہیں
    - text:
        ar: عام ٨٥٩
        en: in 859
        ur: 859 میں
      correct: false
      why:
        ar: ذلك عام البناء لا الوفاة
        en: that is the building year, not death
        ur: یہ تعمیر کا سال ہے، وفات کا نہیں
    - text:
        ar: عام ١٠٠٠
        en: in 1000
        ur: 1000 میں
      correct: false
      why:
        ar: ذلك بعد موتها بأكثر من قرن
        en: that is over a century after her death
        ur: یہ اس کی وفات سے ایک صدی سے زیادہ بعد ہے
    - text:
        ar: غير معلومة
        en: unknown
        ur: نامعلوم
      correct: false
      why:
        ar: تذكر المصادر نحو ٨٨٠
        en: the sources give about 880
        ur: ماخذ تقریباً 880 دیتے ہیں
  - q:
      ar: لماذا تهمّ فاطمة الفهرية؟
      en: Why does Fatima al-Fihri matter?
      ur: فاطمہ الفہری کیوں اہم ہے؟
    options:
    - text:
        ar: لأنها بنت أقدم مؤسسة علمية مستمرة في الذاكرة
        en: because she built the oldest continuous learning institution in memory
        ur: کیونکہ اس نے یادداشت میں قدیم ترین مسلسل علمی ادارہ بنایا
      correct: true
      why:
        ar: بقيت القرويين عاملة أكثر من ألف عام
        en: al-Qarawiyyin stayed working over a thousand years
        ur: قرویین ایک ہزار سال سے زیادہ چلتا رہا
    - text:
        ar: لأنها كتبت القرآن
        en: because she wrote the Qur''an
        ur: کیونکہ اس نے قرآن لکھا
      correct: false
      why:
        ar: لم تكتب قرآنًا بل بنت مدرسة
        en: she built a school, not scripture
        ur: اس نے مدرسہ بنایا، صحیفہ نہیں
    - text:
        ar: لأنها كانت ملكة
        en: because she was a queen
        ur: کیونکہ وہ ملکہ تھی
      correct: false
      why:
        ar: كانت تاجرة لا ملكة
        en: she was a merchant, not a queen
        ur: وہ تاجر تھی، ملکہ نہیں
    - text:
        ar: لأنها غزت الأندلس
        en: because she conquered al-Andalus
        ur: کیونکہ اس نے اندلس فتح کیا
      correct: false
      why:
        ar: لم تغزُ بل بنت علمًا
        en: she did not conquer; she built learning
        ur: اس نے فتح نہیں کیا، علم بنایا
- id: al-khwarizmi
  anchor: person/al-khwarizmi
  band: researchers
  title:
    ar: الخوارزمي
    en: al-Khwarizmi
    ur: خوارزمی
  sixty:
    ar: 'محمد بن موسى الخوارزمي، عالم بغداد في بيت الحكمة العباسي حوالي ٨٢٠: ألّف كتاب الجبر والمقابلة الذي أعطى الرياضيات علمها الجديد واسمه، وأدخل الأرقام الهندية
      — ما نسميه الأرقام العربية — إلى العالم الإسلامي ثم أوروبا. من اسمه جاءت كلمة «الخوارزمية» التي يقوم عليها كل حاسوب اليوم. كتب أيضًا في الفلك والجغرافيا ومساحة
      الأرض. مات حوالي ٨٥٠ تاركًا علمًا صار لغة العالم: «algorithm» و«algebra» من اسمه وكتابه معًا.  ولم يكن الخوارزمي عالمًا واحدًا بل عدة علماء في شخص واحد: يضع علمًا جديدًا للحساب، ويكتب في الفلك جداول للنجوم، ويرسم خريطة العالم في عصر المأمون، ويجمع عمل الهندسة اليونانية والحساب الهندي في منهج واحد صار أساس الرياضيات الحديثة.  ومن اسمه أخذت الرياضيات لغتها الجديدة، ومن كتابه أخذت أوروبا اسم علم الجبر، فصار رجلًا واحدًا من أعمدة العلم الكوني.'
    en: 'Muhammad ibn Musa al-Khwarizmi, a scholar of Baghdad''''s Abbasid House of Wisdom around 820: he authored the Book of al-Jabr wa-l-Muqabala, which gave mathematics
      its new science and its name, and he brought the Indian numerals — what we call Arabic numerals — to the Islamic world and then to Europe. From his name came
      the word ''''algorithm'''' on which every computer runs today. He also wrote on astronomy, geography and the earth''''s surface. He died about 850 leaving a
      science that became the world''''s language: ''''algorithm'''' and ''''algebra'''' from his name and his book together.  Al-Khwarizmi was not one scholar but several in a single person: founding a new science of reckoning, writing star tables in astronomy, drawing the world''s map in al-Ma''mun''s day, and joining Greek geometry with Indian reckoning in one method that became modern mathematics'' base.'
    ur: 'محمد بن موسیٰ خوارزمی، تقریباً 820 میں بغداد کے عباسی بیت الحکمت کا عالم: اس نے کتاب الجبر والمقابلہ لکھی جس نے ریاضی کو اس کا نیا علم اور نام دیا، اور ہندوستانی
      ہندسوں — جنہیں ہم عربی ہندسے کہتے ہیں — کو اسلامی دنیا اور پھر یورپ میں متعارف کرایا۔ اس کے نام سے لفظ الگورتھم نکلا جس پر آج ہر کمپیوٹر چلتا ہے۔ اس نے فلکیات،
      جغرافیہ اور زمین کی سطح پر بھی لکھا۔ وہ تقریباً 850 میں فوت ہوا، ایک ایسا علم چھوڑ کر جو دنیا کی زبان بنا: الگورتھم اور الجبرا دونوں اس کے نام اور کتاب سے۔  خوارزمی ایک نہیں بلکہ ایک شخص میں کئی سائنسدان تھا: حساب کا نیا علم قائم کیا، فلکیات میں ستاروں کی جدولیں لکھیں، مامون کے دور میں دنیا کا نقشہ بندھایا، اور یونانی ہندسہ اور ہندوستانی حساب کو ایک ایسے منہج میں ملایا جو جدید ریاضی کی بنیاد بنا۔'
  glossary:
  - term:
      ar: بيت الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: 'مكتبة بغداد الكبرى التي عمل فيها في عهد المأمون'
      en: 'Baghdad''s great library of science, where he worked in al-Ma''mun''s era'
      ur: 'بغداد کا عظیم علمی کتب خانہ جہاں اس نے مامون کے عہد میں کام کیا'
  - term:
      ar: الجبر والمقابلة
      en: al-Jabr wa-l-Muqabala
      ur: الجبر والمقابلہ
    gloss:
      ar: 'كتابه الذي أعطى الجبر اسمه ومنهجه'
      en: 'his book that gave algebra both its name and its method'
      ur: 'اس کی کتاب جس نے الجبرے کو اس کا نام اور اس کا طریقہ دیا'
  - term:
      ar: الجبر
      en: algebra
      ur: الجبرا
    gloss:
      ar: 'علم الجبر الذي أسّسه كتابه للعالم'
      en: 'the science of algebra his book founded for the world'
      ur: 'جبرے کا وہ علم جس کی بنیاد اس کی کتاب نے دنیا کے لیے رکھی'
  - term:
      ar: الخوارزمية
      en: the algorithm
      ur: الگورتھم
    gloss:
      ar: 'الكلمة المشتقة من اسمه التي تعمل بها الحواسيب'
      en: 'the word derived from his name that computers run on today'
      ur: 'اس کے نام سے نکلا وہ لفظ جس پر آج کمپیوٹر چلتے ہیں'
  - term:
      ar: الأرقام الهندية
      en: the Indian numerals
      ur: ہندوستانی ہندسے
    gloss:
      ar: 'الأرقام التي نقلها من الهند إلى بلاد الإسلام'
      en: 'the numerals he carried from India into the lands of Islam'
      ur: 'وہ ہندسے جو اس نے ہندوستان سے اسلامی سرزمین تک پہنچائے'
  - term:
      ar: الأرقام العربية
      en: the Arabic numerals
      ur: عربی ہندسے
    gloss:
      ar: 'ما سمّته أوروبا لاحقًا بالأرقام العربية وهي هندية الأصل'
      en: 'what Europe later called Arabic numerals — Indian in origin'
      ur: 'جنہیں یورپ نے بعد میں عربی ہندسے کہا — مگر اصل میں ہندوستانی'
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: 'مدينته التي كانت مركز علوم العصر العباسي كلها'
      en: 'his city, which was then the center of the Abbasid world''s science'
      ur: 'اس کا شہر جو اس زمانے میں عباسی دنیا کے علوم کا مرکز تھا'
  - term:
      ar: ٨٢٠
      en: '820'
      ur: '820'
    gloss:
      ar: 'العهد التقريبي لعمله في بيت الحكمة'
      en: 'the rough era of his work inside the House of Wisdom'
      ur: 'بیت الحکمت میں اس کے کام کا تقریبی زمانہ'
  - term:
      ar: الفلك
      en: astronomy
      ur: فلکیات
    gloss:
      ar: 'علم النجوم الذي كتب فيه جداوله المعروفة'
      en: 'the science of the stars, in which he wrote his famous tables'
      ur: 'ستاروں کا وہ علم جس میں اس نے اپنی مشہور جدولیں لکھیں'
  - term:
      ar: الجغرافيا
      en: geography
      ur: جغرافیہ
    gloss:
      ar: 'علم الأرض الذي وصف فيه العالم القديم'
      en: 'the science of the earth, in which he described the old world'
      ur: 'زمین کا وہ علم جس میں اس نے پرانی دنیا کو بیان کیا'
  - term:
      ar: المأمون
      en: al-Ma''mun
      ur: المأمون
    gloss:
      ar: 'الخليفة الذي ازدهر بيت الحكمة في عهده'
      en: 'the caliph in whose era the House of Wisdom flourished'
      ur: 'وہ خلیفہ جس کے عہد میں بیت الحکمت زندہ ہوا'
  - term:
      ar: مساحة الأرض
      en: the earth''s surface
      ur: زمین کی سطح
    gloss:
      ar: 'موضوع كتابه الجغرافي الذي وصف سطح الأرض'
      en: 'the subject of his geography book, which mapped the earth''s surface'
      ur: 'اس کی جغرافیہ کی کتاب کا موضوع جس نے زمین کی سطح کی تصویر کھینچی'
  practice:
  - q:
      ar: أين عمل الخوارزمي؟
      en: Where did al-Khwarizmi work?
      ur: خوارزمی نے کہاں کام کیا؟
    options:
    - text:
        ar: بيت الحكمة في بغداد
        en: Baghdad''s House of Wisdom
        ur: بغداد کا بیت الحکمت
      correct: true
      why:
        ar: تذكر المصادر عمله في مكتبة المأمون
        en: the sources place him in al-Ma''mun''s library
        ur: ماخذ اسے مأمون کی لائبریری میں رکھتے ہیں
    - text:
        ar: القرويين في فاس
        en: al-Qarawiyyin in Fez
        ur: فاس میں قرویین
      correct: false
      why:
        ar: كان في بغداد لا المغرب
        en: he was in Baghdad, not Morocco
        ur: وہ بغداد میں تھا، مراکش میں نہیں
    - text:
        ar: الأزهر في القاهرة
        en: al-Azhar in Cairo
        ur: قاہرہ میں الازہر
      correct: false
      why:
        ar: كان قبل الأزهر بقرن ونصف
        en: he was a century and a half before al-Azhar
        ur: وہ الازہر سے ڈیڑھ صدی پہلے تھا
    - text:
        ar: قرطبة في الأندلس
        en: Cordoba in al-Andalus
        ur: اندلس میں قرطہ
      correct: false
      why:
        ar: كان في بغداد لا الأندلس
        en: he was in Baghdad, not al-Andalus
        ur: وہ بغداد میں تھا، اندلس میں نہیں
  - q:
      ar: ما كتابه الأشهر؟
      en: What is his most famous book?
      ur: اس کی سب سے مشہور کتاب کیا ہے؟
    options:
    - text:
        ar: الجبر والمقابلة
        en: al-Jabr wa-l-Muqabala
        ur: الجبر والمقابلہ
      correct: true
      why:
        ar: أعطى الرياضيات علمها الجديد
        en: it gave mathematics its new science
        ur: اس نے ریاضی کو نیا علم دیا
    - text:
        ar: القانون في الطب
        en: the Canon of Medicine
        ur: طب کا قانون
      correct: false
      why:
        ar: القانون كتاب ابن سينا لا الخوارزمي
        en: the Canon is Ibn Sina''s, not his
        ur: قانون ابن سینا کی کتاب ہے، اس کی نہیں
    - text:
        ar: المقدمة
        en: the Muqaddima
        ur: مقدمہ
      correct: false
      why:
        ar: المقدمة لابن خلدون لا الخوارزمي
        en: the Muqaddima is Ibn Khaldun''s, not his
        ur: مقدمہ ابن خلدون کی ہے، اس کی نہیں
    - text:
        ar: الشفاء
        en: the Healing
        ur: شفا
      correct: false
      why:
        ar: الشفاء لابن سينا
        en: the Healing is Ibn Sina''s
        ur: شفا ابن سینا کی ہے
  - q:
      ar: من أين جاءت كلمة الخوارزمية؟
      en: Where did the word ''algorithm'' come from?
      ur: الگورتھم کا لفظ کہاں سے آیا؟
    options:
    - text:
        ar: من اسمه
        en: from his name
        ur: اس کے نام سے
      correct: true
      why:
        ar: اشتُقت الكلمة اللاتينية من «الخوارزمي»
        en: the Latin word derives from ''al-Khwarizmi''
        ur: لاطینی لفظ خوارزمی سے نکلا
    - text:
        ar: من اسم أبيه
        en: from his father''s name
        ur: اس کے والد کے نام سے
      correct: false
      why:
        ar: من اسمه هو لا أبيه
        en: from his own name, not his father''s
        ur: اس کے اپنے نام سے، والد کے نہیں
    - text:
        ar: من كتابه فقط
        en: only from his book
        ur: صرف اس کی کتاب سے
      correct: false
      why:
        ar: الكلمة من اسمه والجبر من كتابه
        en: the word is from his name, algebra from his book
        ur: لفظ اس کے نام سے، الجبرا اس کی کتاب سے
    - text:
        ar: كلمة عربية قديمة
        en: an old Arabic word
        ur: پرانا عربی لفظ
      correct: false
      why:
        ar: أصلها اسمه في المصادر
        en: its root is his name in the sources
        ur: اس کی جڑ ماخذ میں اس کا نام ہے
  - q:
      ar: ماذا أدخل إلى العالم؟
      en: What did he bring to the world?
      ur: اس نے دنیا میں کیا متعارف کرایا؟
    options:
    - text:
        ar: الأرقام الهندية صارت العربية
        en: the Indian numerals that became Arabic
        ur: وہ ہندوستانی ہندسے جو عربی بنے
      correct: true
      why:
        ar: نقلها من الهند إلى الإسلام ثم أوروبا
        en: he carried them from India to Islam then Europe
        ur: انہیں ہندوستان سے اسلام پھر یورپ تک پہنچایا
    - text:
        ar: الحروف اللاتينية
        en: the Latin letters
        ur: لاطینی حروف
      correct: false
      why:
        ar: أدخل الأرقام لا الحروف
        en: he brought numerals, not letters
        ur: وہ ہندسے لایا، حروف نہیں
    - text:
        ar: البارود
        en: gunpowder
        ur: بارود
      correct: false
      why:
        ar: لم يكن البارود علمه
        en: gunpowder was not his field
        ur: بارود اس کا میدان نہیں تھا
    - text:
        ar: الطباعة
        en: printing
        ur: چھاپہ
      correct: false
      why:
        ar: لم تكن الطباعة في عصره
        en: printing was not in his age
        ur: چھاپہ اس کے دور میں نہیں تھا
  - q:
      ar: في أيّ قرن عاش؟
      en: In which century did he live?
      ur: وہ کس صدی میں رہا؟
    options:
    - text:
        ar: القرن التاسع
        en: the ninth century
        ur: نویں صدی
      correct: true
      why:
        ar: عمل نحو ٨٢٠ ومات نحو ٨٥٠
        en: he worked about 820 and died about 850
        ur: وہ تقریباً 820 میں کام کرتا تھا اور تقریباً 850 میں فوت ہوا
    - text:
        ar: القرن السابع
        en: the seventh century
        ur: ساتویں صدی
      correct: false
      why:
        ar: كان بعد القرن السابع بقرنين
        en: he was two centuries after the seventh
        ur: وہ ساتویں صدی سے دو صدیاں بعد تھا
    - text:
        ar: القرن الثاني عشر
        en: the twelfth century
        ur: بارہویں صدی
      correct: false
      why:
        ar: كان قبل القرن الثاني عشر بثلاثة قرون
        en: he was three centuries before the twelfth
        ur: وہ بارہویں صدی سے تین صدیاں پہلے تھا
    - text:
        ar: القرن الأول
        en: the first century
        ur: پہلی صدی
      correct: false
      why:
        ar: كان في العصر العباسي لا الروماني
        en: he was in the Abbasid, not Roman, era
        ur: وہ عباسی دور میں تھا، رومی نہیں
  - q:
      ar: ما علاقته بالمأمون؟
      en: What was his tie to al-Ma''mun?
      ur: اس کا المأمون سے کیا تعلق تھا؟
    options:
    - text:
        ar: عمل في بيت حكمته
        en: he worked in his House of Wisdom
        ur: اس نے اس کے بیت الحکمت میں کام کیا
      correct: true
      why:
        ar: جعل المأمون بيت الحكمة مركز العلم
        en: al-Ma''mun made the House a centre of learning
        ur: مأمون نے بیت الحکمت کو علم کا مرکز بنایا
    - text:
        ar: كان ابن المأمون
        en: he was al-Ma''mun''s son
        ur: وہ مأمون کا بیٹا تھا
      correct: false
      why:
        ar: كان عالمًا في دار الخليفة لا ابنه
        en: he was a scholar in the caliph''s house, not his son
        ur: وہ خلیفہ کے گھر میں عالم تھا، بیٹا نہیں
    - text:
        ar: كان خليفة بعده
        en: he was caliph after him
        ur: وہ اس کے بعد خلیفہ تھا
      correct: false
      why:
        ar: كان عالمًا لا خليفة
        en: he was a scholar, not a caliph
        ur: وہ عالم تھا، خلیفہ نہیں
    - text:
        ar: لا علاقة
        en: no relation
        ur: کوئی تعلق نہیں
      correct: false
      why:
        ar: عمل في بيت الحكمة في عهد المأمون
        en: he worked in the House under al-Ma''mun
        ur: اس نے مأمون کے دور میں بیت الحکمت میں کام کیا
  - q:
      ar: ماذا كتب غير الجبر؟
      en: What else did he write on?
      ur: الجبرا کے علاوہ اس نے کس پر لکھا؟
    options:
    - text:
        ar: الفلك والجغرافيا ومساحة الأرض
        en: astronomy, geography and the earth''s surface
        ur: فلکیات، جغرافیہ اور زمین کی سطح
      correct: true
      why:
        ar: تذكر المصادر كتبه الأخرى
        en: the sources name his other books
        ur: ماخذ اس کی دوسری کتابوں کا ذکر کرتے ہیں
    - text:
        ar: الطب فقط
        en: only medicine
        ur: صرف طب
      correct: false
      why:
        ar: كتب في علوم كثيرة لا طبًّا فقط
        en: he wrote on many sciences, not just medicine
        ur: اس نے کئی علوم پر لکھا، صرف طب نہیں
    - text:
        ar: الشعر
        en: poetry
        ur: شاعری
      correct: false
      why:
        ar: كان عالم رياضيات لا شاعرًا
        en: he was a mathematician, not a poet
        ur: وہ ریاضی دان تھا، شاعر نہیں
    - text:
        ar: لا شيء آخر
        en: nothing else
        ur: کچھ اور نہیں
      correct: false
      why:
        ar: تذكر المصادر كتبًا في علوم عدة
        en: the sources name books on several sciences
        ur: ماخذ کئی علوم کی کتابوں کا ذکر کرتے ہیں
  - q:
      ar: ما أصل كلمة algebra؟
      en: What is the root of ''algebra''?
      ur: الجبرا کی جڑ کیا ہے؟
    options:
    - text:
        ar: من عنوان كتابه الجبر
        en: from his book''s title al-Jabr
        ur: اس کی کتاب کے نام الجبر سے
      correct: true
      why:
        ar: من «الجبر» جاءت algebra
        en: from ''al-Jabr'' came algebra
        ur: الجبر سے الجبرا آیا
    - text:
        ar: من اسم مدينته
        en: from his city''s name
        ur: اس کے شہر کے نام سے
      correct: false
      why:
        ar: من كتابه لا مدينته
        en: from his book, not his city
        ur: اس کی کتاب سے، شہر سے نہیں
    - text:
        ar: كلمة لاتينية قديمة
        en: an old Latin word
        ur: پرانا لاطینی لفظ
      correct: false
      why:
        ar: أصلها كتابه العربي
        en: its root is his Arabic book
        ur: اس کی جڑ اس کی عربی کتاب ہے
    - text:
        ar: من اسم معلمه
        en: from his teacher''s name
        ur: اس کے استاد کے نام سے
      correct: false
      why:
        ar: من كتابه لا معلمه
        en: from his book, not his teacher
        ur: اس کی کتاب سے، استاد سے نہیں
  - q:
      ar: لماذا يهمّ الخوارزمي اليوم؟
      en: Why does al-Khwarizmi matter today?
      ur: خوارزمی آج کیوں اہم ہے؟
    options:
    - text:
        ar: لأن الخوارزميات والجبر من إرثه
        en: because algorithms and algebra come from his legacy
        ur: کیونکہ الگورتھم اور الجبرا اس کے ورثے سے ہیں
      correct: true
      why:
        ar: اسمه في كل حاسوب وكتابه في كل مدرسة
        en: his name is in every computer, his book in every school
        ur: اس کا نام ہر کمپیوٹر میں، کتاب ہر مدرسے میں ہے
    - text:
        ar: لأنه اخترع الكهرباء
        en: because he invented electricity
        ur: کیونکہ اس نے بجلی ایجاد کی
      correct: false
      why:
        ar: لم يكن الكهرباء في عصره
        en: electricity was not in his age
        ur: بجلی اس کے دور میں نہیں تھی
    - text:
        ar: لأنه بنى الأهرام
        en: because he built the pyramids
        ur: کیونکہ اس نے اہرام بنائے
      correct: false
      why:
        ar: الأهرام قبله بآلاف السنين
        en: the pyramids predate him by millennia
        ur: اہرام اس سے ہزاروں سال پرانے ہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في كلمة algorithm العالمية
        en: his name is in the worldwide word algorithm
        ur: اس کا نام عالمی لفظ الگورتھم میں ہے
  - q:
      ar: من كتب عن الخوارزمي؟
      en: Who wrote about al-Khwarizmi?
      ur: خوارزمی کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو العلم ومترجمو كتبه إلى اللاتينية
        en: historians of science and his Latin translators
        ur: علم کے مؤرخین اور اس کے لاطینی مترجمین
      correct: true
      why:
        ar: ترجمته أوروبا في القرون الوسطى
        en: Europe translated him in the Middle Ages
        ur: یورپ نے قرون وسطیٰ میں اس کا ترجمہ کیا
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تصلنا كتبه وروايات مؤرخي العلم
        en: his books and science historians'' accounts reach us
        ur: اس کی کتابیں اور مؤرخین کی روایتیں ہم تک پہنچیں
    - text:
        ar: المصريون القدماء
        en: the ancient Egyptians
        ur: قدیم مصری
      correct: false
      why:
        ar: كان في العصر العباسي لا الفرعوني
        en: he was in the Abbasid, not pharaonic, era
        ur: وہ عباسی دور میں تھا، فرعونی نہیں
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: ترجمته أوروبا والعرب
        en: Europe and the Arabs translated him
        ur: یورپ اور عربوں نے اس کا ترجمہ کیا
- id: ibn-sina
  anchor: person/ibn-sina
  band: researchers
  title:
    ar: ابن سينا
    en: Ibn Sina
    ur: ابن سینا
  sixty:
    ar: 'أبو علي الحسين بن عبد الله بن سينا، شيخ الرئيس: طبيب بخارى وفيلسوف فارسي من القرن الحادي عشر، ألّف «القانون في الطب» الذي بقي مرجع الطب في الجامعات الإسلامية
      والأوروبية ستة قرون. حفظ الكتب قبل العاشرة وعالج الملوك وهو مراهق، وتنقّل بين البلاطات في همذان وإصبهان يطبّ ويؤلّف. كتب «الشفاء» موسوعة العلوم من المنطق إلى
      الفلك، وجمع الفلسفة اليونانية بالفكر الإسلامي في نظام فلسفي خاص. مات ١٠٣٧ في همذان عن سبعة وخمسين عامًا، وبقي «Avicenna» عند الأوروبيين اسمًا للطب نفسه.  ومن بخارى خرجت حكمته إلى العالم: صار «القانون» كتاب الطب الأول من قرطبة إلى كولونيا، وصار «الشفاء» أكبر موسوعة فلسفية في عصره، وبقي اسمه لاتينيًّا «أفيسينا» عنوانًا في تاريخ الفكر. ولهذا يرى المسلمون فيه قمة العصر الذهبي: العلم والفلسفة والطب في رجل واحد.  وفي سيرته يُقرأ درس العمل: طفل حفظ الكتب في صغره، وشاب نازع الملوك فلسفةً وطبًّا، وشيخ كتب ما ملأ مكتبة بأكملها.'
    en: 'Abu Ali al-Husayn ibn Abd Allah ibn Sina, the Shaykh al-Ra''''is: a physician of Bukhara and a Persian philosopher of the eleventh century, author of the
      Canon of Medicine that stayed medicine''''s reference in Islamic and European universities for six centuries. He memorized the books before age ten and treated
      kings as a teenager, moving between the courts of Hamadan and Isfahan, healing and writing. He wrote the Healing encyclopedia from logic to astronomy, joining
      Greek philosophy to Islamic thought in a system of his own. He died in Hamadan in 1037 at fifty-seven; to Europeans he stayed ''''Avicenna'''', a name for medicine
      itself.  From Bukhara his wisdom went out to the world: the Canon became medicine''s first book from Cordoba to Cologne, the Healing his age''s greatest philosophical encyclopaedia, and his name stayed Latin — Avicenna — a headline in the history of thought. For this Muslims see in him the golden age''s summit: science, philosophy and medicine in one man.'
    ur: 'ابو علی حسین بن عبداللہ ابن سینا، شیخ الرئیس: گیارہویں صدی کا بخارا کا طبیب اور فارسی فلسفی، جس نے طب کا قانون لکھی جو چھ صدیوں تک اسلامی اور یورپی جامعوں
      میں طب کا مرجع رہی۔ اس نے دس سال سے پہلے کتابیں یاد کیں اور نوجوان ہو کر بادشاہوں کا علاج کیا، ہمدان اور اصفہان کے درباروں میں علاج اور تصنیف کرتا رہا۔ اس نے
      شفا کی دائرۃ المعارف منطق سے فلکیات تک لکھی، اور یونانی فلسفہ کو اسلامی فکر سے جوڑ کر اپنا فلسفیانہ نظام بنایا۔ وہ 1037 میں ہمدان میں ستاون سال کی عمر میں فوت
      ہوا؛ یورپیوں کے ہاں وہ ایویسینا رہا، طب ہی کا نام۔  بخارا سے اس کی حکمت دنیا میں پھیلی: قانون قرطہ سے کولون تک طب کی پہلی کتاب بنا، شفا اپنے دور کی سب سے بڑی فلسفیانہ دائرۃ المعارف، اور اس کا نام لاطینی میں ابی سینا — فکر کی تاریخ کا سرخی۔ اسی لیے مسلمان اس میں عہدِ زریں کی چوٹی دیکھتے ہیں: ایک شخص میں علم، فلسفہ اور طب۔'
  glossary:
  - term:
      ar: بخارى
      en: Bukhara
      ur: بخارا
    gloss:
      ar: 'مدينته الأصلية في آسيا الوسطى وراء العالم العربي'
      en: 'his original city in Central Asia, beyond the Arab world'
      ur: 'وسطی ایشیا میں اس کا اصل شہر، عرب دنیا سے ماورا'
  - term:
      ar: القانون في الطب
      en: the Canon of Medicine
      ur: طب کا قانون
    gloss:
      ar: 'كتابه الطبي الذي بقي المرجع ستة قرون'
      en: 'his medical book, which stayed medicine''s reference for six centuries'
      ur: 'اس کی طب کی کتاب جو چھ صدیوں تک مرجع رہی'
  - term:
      ar: الشفاء
      en: the Healing
      ur: شفا
    gloss:
      ar: 'موسوعته الفلسفية الكبرى التي تطوّق العقل من المنطق إلى الفلك'
      en: 'his great philosophical encyclopaedia, which encircles the mind from logic to astronomy'
      ur: 'اس کی عظیم فلسفیانہ موسوعہ جو عقل کو منطق سے فلکیات تک گھیرے ہوئے ہے'
  - term:
      ar: شيخ الرئيس
      en: Shaykh al-Ra''is
      ur: شیخ الرئیس
    gloss:
      ar: 'لقبه في كتب الفلسفة ومعناه الشيخ الكبير'
      en: 'his title in the books of philosophy, meaning the great shaykh'
      ur: 'فلسفے کی کتابوں میں اس کا لقب، جس کا مطلب ہے عظیم شیخ'
  - term:
      ar: Avicenna
      en: Avicenna
      ur: ایویسینا
    gloss:
      ar: 'اسمه اللاتيني الذي عرفته به أوروبا'
      en: 'his Latin name, by which Europe came to know him'
      ur: 'اس کا لاطینی نام جس سے یورپ نے اسے پہچانا'
  - term:
      ar: همذان
      en: Hamadan
      ur: ہمدان
    gloss:
      ar: 'المدينة التي توفي فيها سنة ١٠٣٧م'
      en: 'the city he died in, in 1037, still travelling and working'
      ur: 'وہ شہر جس میں وہ 1037 میں وفات پا گیا، سفر اور کام میں مصروف'
  - term:
      ar: إصبهان
      en: Isfahan
      ur: اصفہان
    gloss:
      ar: 'بلاط إصبهان الذي طبّب فيه وكتب'
      en: 'the Isfahan court where he healed the sick and wrote his books'
      ur: 'اصفہان کا دربار جہاں اس نے مریضوں کا علاج اور کتابیں لکھیں'
  - term:
      ar: المنطق
      en: logic
      ur: منطق
    gloss:
      ar: 'علم الاستدلال الذي رتّبه في موسوعته الشفاء'
      en: 'the science of reasoning he ordered in his Healing encyclopaedia'
      ur: 'استدلال کا علم جسے اس نے شفا کی موسوعہ میں ترتیب دیا'
  - term:
      ar: الفلسفة
      en: philosophy
      ur: فلسفہ
    gloss:
      ar: 'فكره الذي جمع بين اليونان والإسلام'
      en: 'his thought, which joined the Greek legacy and Islam together'
      ur: 'اس کی فکر جس نے یونانی ورثے اور اسلام کو ایک ساتھ جوڑا'
  - term:
      ar: ١٠٣٧
      en: '1037'
      ur: '1037'
    gloss:
      ar: 'سنة وفاته في همذان وهو في ذروة عمله'
      en: 'the year of his death in Hamadan, amid his work'
      ur: 'ہمدان میں اس کی وفات کا سال، اپنے کام کے عروج پر'
  - term:
      ar: البلاط
      en: the court
      ur: دربار
    gloss:
      ar: 'حضوره في بلاط الملوك طبيبًا لهم ومستشارًا في دولتهم'
      en: 'his place in the kings'' courts — their physician and their adviser in the state'
      ur: 'بادشاہوں کے دربار میں اس کا مقام — ان کا طبیب اور سلطنت کا مشیر'
  - term:
      ar: الطب
      en: medicine
      ur: طب
    gloss:
      ar: 'علمه الطبي الذي علّم أوروبا قرونًا بعد وفاته'
      en: 'his medical science, which taught Europe for centuries after him'
      ur: 'اس کا طب کا علم جس نے اس کے بعد صدیوں تک یورپ کو سکھایا'
  practice:
  - q:
      ar: ما كتاب ابن سينا الأشهر؟
      en: What is Ibn Sina''s most famous book?
      ur: ابن سینا کی سب سے مشہور کتاب کیا ہے؟
    options:
    - text:
        ar: القانون في الطب
        en: the Canon of Medicine
        ur: طب کا قانون
      correct: true
      why:
        ar: بقي مرجع الطب ستة قرون في المصادر
        en: it stayed medicine''s reference six centuries in the sources
        ur: یہ ماخذ میں چھ صدیوں طب کا مرجع رہی
    - text:
        ar: الجبر والمقابلة
        en: al-Jabr wa-l-Muqabala
        ur: الجبر والمقابلہ
      correct: false
      why:
        ar: الجبر كتاب الخوارزمي لا ابن سينا
        en: al-Jabr is al-Khwarizmi''s, not his
        ur: الجبر خوارزمی کی کتاب ہے، اس کی نہیں
    - text:
        ar: المقدمة
        en: the Muqaddima
        ur: مقدمہ
      correct: false
      why:
        ar: المقدمة لابن خلدون
        en: the Muqaddima is Ibn Khaldun''s
        ur: مقدمہ ابن خلدون کی ہے
    - text:
        ar: رسالة إخوان الصفا
        en: the Epistles of the Brethren
        ur: اخوان الصفا کے رسائل
      correct: false
      why:
        ar: رسالة جماعية لا كتاب ابن سينا
        en: a collective epistle, not Ibn Sina''s book
        ur: اجتماعی رسائل ہیں، ابن سینا کی کتاب نہیں
  - q:
      ar: كم بقي القانون مرجعًا؟
      en: How long did the Canon stay a reference?
      ur: قانون کتنی دیر مرجع رہی؟
    options:
    - text:
        ar: نحو ستة قرون
        en: about six centuries
        ur: تقریباً چھ صدیاں
      correct: true
      why:
        ar: دُرّس في الجامعات حتى القرن السابع عشر
        en: it was taught in universities into the seventeenth century
        ur: یہ سترہویں صدی تک جامعوں میں پڑھائی گئی
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة تدريسه
        en: fifty is far short of its teaching span
        ur: پچاس اس کے پڑھائے جانے کے عرصے سے کہیں کم ہے
    - text:
        ar: عام واحد
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: بقي مرجعًا قرونًا لا عامًا
        en: it stayed a reference for centuries, not a year
        ur: یہ صدیوں مرجع رہی، ایک سال نہیں
    - text:
        ar: لم يُدرّس أبدًا
        en: it was never taught
        ur: یہ کبھی نہیں پڑھائی گئی
      correct: false
      why:
        ar: دُرّس في أوروبا والإسلام قرونًا
        en: it was taught in Europe and Islam for centuries
        ur: یہ یورپ اور اسلام میں صدیوں پڑھائی گئی
  - q:
      ar: ما اسم ابن سينا عند الأوروبيين؟
      en: What is Ibn Sina''s European name?
      ur: یورپیوں میں ابن سینا کا نام کیا ہے؟
    options:
    - text:
        ar: Avicenna
        en: Avicenna
        ur: ایویسینا
      correct: true
      why:
        ar: يذكر الاسم اللاتيني في المصادر
        en: the sources give the Latin name
        ur: ماخذ لاطینی نام دیتے ہیں
    - text:
        ar: Averroes
        en: Averroes
        ur: ایوروس
      correct: false
      why:
        ar: Averroes لابن رشد لا ابن سينا
        en: Averroes is Ibn Rushd, not Ibn Sina
        ur: ایوروس ابن رشد کا ہے، ابن سینا کا نہیں
    - text:
        ar: Alhazen
        en: Alhazen
        ur: الحازن
      correct: false
      why:
        ar: Alhazen لابن الهيثم
        en: Alhazen is Ibn al-Haytham
        ur: الحازن ابن ہیشم کا ہے
    - text:
        ar: Algazel
        en: Algazel
        ur: الغزال
      correct: false
      why:
        ar: Algazel للغزالي
        en: Algazel is al-Ghazali
        ur: الغزال الغزالی کا ہے
  - q:
      ar: أين وُلد تقريبًا؟
      en: Where was he roughly born?
      ur: وہ تقریباً کہاں پیدا ہوا؟
    options:
    - text:
        ar: قرب بخارى
        en: near Bukhara
        ur: بخارا کے قریب
      correct: true
      why:
        ar: يذكر المصادر نشأته في إقليم بخارى
        en: the sources place his upbringing in Bukhara''s region
        ur: ماخذ اس کی پرورش بخارا کے خطے میں رکھتے ہیں
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: كان من بخارى لا بغداد
        en: he was from Bukhara, not Baghdad
        ur: وہ بخارا سے تھا، بغداد نہیں
    - text:
        ar: في قرطبة
        en: in Cordoba
        ur: قرطہ میں
      correct: false
      why:
        ar: كان من آسيا الوسطى لا الأندلس
        en: he was from Central Asia, not al-Andalus
        ur: وہ وسطیٰ ایشیا سے تھا، اندلس نہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: لم يعش في مصر
        en: he did not live in Egypt
        ur: وہ مصر میں نہیں رہا
  - q:
      ar: ماذا فعل وهو مراهق؟
      en: What did he do as a teenager?
      ur: نوجوان ہو کر اس نے کیا کیا؟
    options:
    - text:
        ar: عالج الملوك ونال مكانة
        en: he treated kings and won standing
        ur: اس نے بادشاہوں کا علاج کیا اور مقام پایا
      correct: true
      why:
        ar: يذكر المصادر تطببه لسامانيين في صغره
        en: the sources have him treat Samanids young
        ur: ماخذ میں اس نے کم عمری میں سامانیوں کا علاج کیا
    - text:
        ar: قاد جيشًا
        en: he led an army
        ur: اس نے فوج کی قیادت کی
      correct: false
      why:
        ar: كان طبيبًا لا قائدًا
        en: he was a physician, not a commander
        ur: وہ طبیب تھا، سردار نہیں
    - text:
        ar: بنى جامعة
        en: he built a university
        ur: اس نے جامعہ بنایا
      correct: false
      why:
        ar: علّم في البلاطات لا في جامعة بناها
        en: he taught in courts, not a university he built
        ur: وہ درباروں میں پڑھایا، بنائے ہوئے جامعے میں نہیں
    - text:
        ar: لم يفعل شيئًا
        en: he did nothing
        ur: اس نے کچھ نہیں کیا
      correct: false
      why:
        ar: يذكر المصادر موهبته المبكرة
        en: the sources record his early gift
        ur: ماخذ اس کی ابتدائی صلاحیت لکھتے ہیں
  - q:
      ar: ما موسوعته الكبرى؟
      en: What is his great encyclopedia?
      ur: اس کی بڑی دائرۃ المعارف کیا ہے؟
    options:
    - text:
        ar: الشفاء
        en: the Healing
        ur: شفا
      correct: true
      why:
        ar: تغطي من المنطق إلى الفلك
        en: it covers logic to astronomy
        ur: یہ منطق سے فلکیات تک ہے
    - text:
        ar: القانون
        en: the Canon
        ur: قانون
      correct: false
      why:
        ar: القانون في الطب خاصة لا موسوعة
        en: the Canon is medicine only, not encyclopedic
        ur: قانون صرف طب میں ہے، دائرۃ المعارف نہیں
    - text:
        ar: صحيح البخاري
        en: Sahih al-Bukhari
        ur: صحیح بخاری
      correct: false
      why:
        ar: البخاري كتاب حديث لا فلسفة
        en: al-Bukhari is a hadith book, not philosophy
        ur: بخاری حدیث کی کتاب ہے، فلسفہ نہیں
    - text:
        ar: تفسير الطبري
        en: al-Tabari''s exegesis
        ur: طبری کی تفسیر
      correct: false
      why:
        ar: الطبري مؤرخ لا ابن سينا
        en: al-Tabari is a historian, not Ibn Sina
        ur: طبری مؤرخ ہے، ابن سینا نہیں
  - q:
      ar: ماذا جمع في فلسفته؟
      en: What did he join in his philosophy?
      ur: اس نے اپنے فلسفے میں کیا ملا؟
    options:
    - text:
        ar: الفلسفة اليونانية بالفكر الإسلامي
        en: Greek philosophy with Islamic thought
        ur: یونانی فلسفہ کو اسلامی فکر سے
      correct: true
      why:
        ar: تذكر المصادر نظامه الخاص بين التقليدين
        en: the sources name his own system between the two traditions
        ur: ماخذ دونوں روایات کے درمیان اس کا اپنا نظام لکھتے ہیں
    - text:
        ar: الصينية والهندية
        en: Chinese and Indian
        ur: چینی اور ہندوستانی
      correct: false
      why:
        ar: جمع اليوناني والإسلامي لا الصيني
        en: he joined Greek and Islamic, not Chinese
        ur: اس نے یونانی اور اسلامی ملایا، چینی نہیں
    - text:
        ar: لا شيء؛ رفض الفلسفة
        en: nothing; he rejected philosophy
        ur: کچھ نہیں؛ اس نے فلسفہ رد کیا
      correct: false
      why:
        ar: كان فيلسوفًا قبل طبيبه
        en: he was a philosopher before his medicine
        ur: وہ طب سے پہلے فلسفی تھا
    - text:
        ar: الفكر الأوروبي الحديث
        en: modern European thought
        ur: جدید یورپی فکر
      correct: false
      why:
        ar: جمع اليوناني والإسلامي لا الأوروبي الحديث
        en: he joined Greek and Islamic, not modern European
        ur: اس نے یونانی اور اسلامی ملایا، جدید یورپی نہیں
  - q:
      ar: أين مات؟
      en: Where did he die?
      ur: وہ کہاں فوت ہوا؟
    options:
    - text:
        ar: في همذان
        en: in Hamadan
        ur: ہمدان میں
      correct: true
      why:
        ar: تذكر المصادر وفاته في همذان ١٠٣٧
        en: the sources record his death in Hamadan in 1037
        ur: ماخذ اس کی وفات 1037 میں ہمدان میں لکھتے ہیں
    - text:
        ar: في بخارى
        en: in Bukhara
        ur: بخارا میں
      correct: false
      why:
        ar: وُلد قربها ومات في همذان
        en: he was born near her but died in Hamadan
        ur: وہ اس کے قریب پیدا ہوا مگر ہمدان میں فوت ہوا
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: لم يمت في بغداد
        en: he did not die in Baghdad
        ur: وہ بغداد میں فوت نہیں ہوا
    - text:
        ar: في القسطنطينية
        en: in Constantinople
        ur: قسطنطنیہ میں
      correct: false
      why:
        ar: مات في إيران لا بيزنطة
        en: he died in Iran, not Byzantium
        ur: وہ ایران میں فوت ہوا، بازنطیم میں نہیں
  - q:
      ar: لماذا يهمّ ابن سينا؟
      en: Why does Ibn Sina matter?
      ur: ابن سینا کیوں اہم ہے؟
    options:
    - text:
        ar: لأن قانونه علّم الطب للعالم ستة قرون
        en: because his Canon taught medicine to the world for six centuries
        ur: کیونکہ اس کے قانون نے چھ صدیوں دنیا کو طب پڑھایا
      correct: true
      why:
        ar: دُرّس في بغداد وبولونيا وباريس
        en: it was taught in Baghdad, Bologna and Paris
        ur: یہ بغداد، بولونیا اور پیرس میں پڑھائی گئی
    - text:
        ar: لأنه اخترع الطب
        en: because he invented medicine
        ur: کیونکہ اس نے طب ایجاد کی
      correct: false
      why:
        ar: الطب قبله بقرون لكنه جمعه ونظّمه
        en: medicine predates him but he gathered and ordered it
        ur: طب اس سے صدیوں پہلے تھا مگر اس نے جمع اور مرتب کیا
    - text:
        ar: لأنه كان خليفة
        en: because he was a caliph
        ur: کیونکہ وہ خلیفہ تھا
      correct: false
      why:
        ar: كان طبيبًا لا خليفة
        en: he was a physician, not a caliph
        ur: وہ طبیب تھا، خلیفہ نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في تاريخ الطب والفلسفة
        en: his name is in medicine''s and philosophy''s history
        ur: اس کا نام طب اور فلسفہ کی تاریخ میں ہے
  - q:
      ar: من كتب عن ابن سينا؟
      en: Who wrote about Ibn Sina?
      ur: ابن سینا کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو العلم وسيرته الذاتية
        en: historians of science and his autobiography
        ur: علم کے مؤرخین اور اس کی خود سوانح
      correct: true
      why:
        ar: تصلنا سيرته وشروح تلاميذه
        en: his life story and his students'' commentaries reach us
        ur: اس کی سوانح اور شاگردوں کی شروحات ہم تک پہنچیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: كتب سيرته وكتب عنه تلاميذه
        en: he wrote his life and students wrote of him
        ur: اس نے اپنی سوانح لکھی اور شاگردوں نے لکھا
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of him
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنه قبل العثمانيين بقرون
        en: he was written of centuries before the Ottomans
        ur: اس کے بارے میں عثمانیوں سے صدیوں پہلے لکھا گیا
- id: ibn-rushd
  anchor: person/ibn-rushd
  band: researchers
  title:
    ar: ابن رشد
    en: Ibn Rushd
    ur: ابن رشد
  sixty:
    ar: 'أبو الوليد محمد بن أحمد بن رشد، فيلسوف قرطبة وقاضيها في القرن الثاني عشر: شارح أرسطو الأعظم عند الأوروبيين حتى سمّوه «المفسّر». كتب «فصل المقال» في العلاقة
      بين الدين والفلسفة، وناقش الغزالي في «تهافت التهافت» دفاعًا عن العقل. عيّنه الموحدون قاضي قرطبة وطبيبًا للخليفة، ثم نفوه في شيخوخته إلى لوسينة فعاد وافته المنية
      في مراكش ١١٩٨. ألهمت شروحه عصر النهضة الأوروبي: «Averroes» اسمه في مدارسهم أربعة قرون.  ومن قرطبة خرجت أفكاره إلى العالمين: عند المسلمين حفظها الزهراويون واليهود الأندلسيون، وعند النصارى أشعلت مدارس باريس قرنين من الجدل حتى سُمّي التيار اللاتيني «الرشدية». مات في مراكش ١١٩٨ وعاد جثمانه إلى قرطبة، ومن كتبه تعلّم الغرب أن الدين والفلسفة يمكن أن يجتمعا في عقل واحد بلا تناقض حقيقي.  ولهذا بقي «المفسّر» لقبه في كل المكتبات: رجل فصل بين الفتوى والفلسفة يومًا، ثم جمع بينهما عمرًا كاملًا، فكان قاضي قرطبة وعقلها معًا.'
    en: 'Abu al-Walid Muhammad ibn Ahmad ibn Rushd, Cordoba''''s philosopher and judge in the twelfth century: Aristotle''''s greatest commentator for Europeans,
      who called him simply ''''the Commentator''''. He wrote the Decisive Treatise on the relation between religion and philosophy, and answered al-Ghazali in the
      Incoherence of the Incoherence defending reason. The Almohads made him Cordoba''''s judge and the caliph''''s physician, then exiled him in old age to Lucena;
      he returned and died in Marrakesh in 1198. His commentaries inspired the European Renaissance: ''''Averroes'''' was his name in their schools for four centuries.  From Cordoba his ideas went out to both worlds: kept among Muslims by the Zahrawis and Andalusi Jews, and among Christians they lit two centuries of Paris debates until the Latin current itself was called Averroism. He died in Marrakesh in 1198 and his body returned to Cordoba — and from his books the west learned that religion and philosophy can meet in one mind without real contradiction.'
    ur: 'ابو الولید محمد بن احمد ابن رشد، بارہویں صدی میں قرطہ کا فلسفی اور قاضی: یورپیوں کے نزدیک ارسطو کا عظیم ترین شارح، جسے انہوں نے صرف مفسر کہا۔ اس نے دین اور
      فلسفہ کے تعلق پر فصل المقال لکھی، اور عقل کے دفاع میں تہافت التہافت میں غزالی کا جواب دیا۔ موحدین نے اسے قرطہ کا قاضی اور خلیفہ کا طبیب بنایا، پھر پیری میں
      اسے لوسینہ جلاوطن کیا؛ وہ واپس آیا اور 1198 میں مراکش میں فوت ہوا۔ اس کی شروحات نے یورپی نشاۃ ثانیہ کو ابھارا: ایوروس ان کے مکتبوں میں چار صدیوں اس کا نام رہا۔  قرطہ سے اس کے افکار دونوں جہانوں میں گئے: مسلمانوں میں زہراویوں اور اندلسی یہودیوں نے سنبھالے، اور مسیحیوں میں انہوں نے پیرس کے مکاتب میں دو صدیوں کا بحث جلایا یہاں تک کہ لاطینی روجان خود ابن رشدی کہلایا۔ وہ 1198 میں مراکش میں فوت ہوا اور اس کا جسد قرطہ لوٹا — اور اس کی کتابوں سے مغرب نے سیکھا کہ دین اور فلسفہ ایک ذہن میں بغیر حقیقی تضاد مل سکتے ہیں۔'
  glossary:
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطہ
    gloss:
      ar: 'مدينته الأندلسية التي قضى فيها وكتب في العصر المتأخر'
      en: 'his Andalusi city, where he judged and wrote in the late era'
      ur: 'اس کا اندلسی شہر جہاں اس نے قضا اور آخری دور میں لکھا'
  - term:
      ar: المفسّر
      en: the Commentator
      ur: مفسر
    gloss:
      ar: 'اللقب الذي أعطته له أوروبا لشروحه على أرسطو'
      en: 'the title Europe gave him for his commentaries on Aristotle'
      ur: 'وہ لقب جو یورپ نے اسے ارسطو کی شروحات پر دیا'
  - term:
      ar: أرسطو
      en: Aristotle
      ur: ارسطو
    gloss:
      ar: 'الفيلسوف اليوناني الذي شرحه كتابًا بعد كتاب حتى صار شارحه الأعظم'
      en: 'the Greek philosopher he commented on, book after book, until he became his greatest commentator'
      ur: 'یونانی فلسفی جس کی کتابوں پر اس نے کتاب بہ کتاب شروحات لکھیں یہاں تک کہ اس کا سب سے بڑا شارح بن گیا'
  - term:
      ar: فصل المقال
      en: the Decisive Treatise
      ur: فصل المقال
    gloss:
      ar: 'كتابه الشهير في العلاقة بين الوحي والحكمة'
      en: 'his famous treatise on the relation between revelation and wisdom'
      ur: 'وحی اور حکمت کے رشتے پر اس کی مشہور رسالہ'
  - term:
      ar: تهافت التهافت
      en: the Incoherence of the Incoherence
      ur: تہافت التہافت
    gloss:
      ar: 'كتابه الذي ردّ فيه على الغزالي دفاعًا عن الفلسفة'
      en: 'the book in which he answered al-Ghazali in philosophy''s defence'
      ur: 'وہ کتاب جس میں اس نے فلسفے کے دفاع میں غزالی کا جواب دیا'
  - term:
      ar: الغزالي
      en: al-Ghazali
      ur: غزالی
    gloss:
      ar: 'الإمام الذي جادله في مسألة العالم والمعرفة'
      en: 'the imam he debated on the question of the world and knowledge'
      ur: 'وہ امام جس سے اس نے دنیا اور علم کے مسئلے پر مباحثہ کیا'
  - term:
      ar: الموحدون
      en: the Almohads
      ur: موحدین
    gloss:
      ar: 'السلالة المغربية التي خدمها قاضيًا ثم كبير القضاة'
      en: 'the Moroccan dynasty he served as qadi and then chief judge'
      ur: 'مراکشی خاندان جس کی وہ قاضی پھر کبیر القضا ہو کر خدمت کرتا رہا'
  - term:
      ar: لوسينة
      en: Lucena
      ur: لوسینہ
    gloss:
      ar: 'مدينة مولده قبل انتقاله إلى قرطبة'
      en: 'the town of his birth before he moved to Cordoba'
      ur: 'اس کی پیدائش کا شہر اس سے پہلے کہ وہ قرطہ منتقل ہوا'
  - term:
      ar: مراكش
      en: Marrakesh
      ur: مراکش
    gloss:
      ar: 'المدينة المغربية التي توفي فيها منفيًّا ثم نُقل جثمانه إلى قرطبة'
      en: 'the Moroccan city he died in during exile, before his body was carried to Cordoba'
      ur: 'مراکشی شہر جس میں وہ جلاوطنی میں فوت ہوا اور بعد میں اس کی لاش قرطہ لے جائی گئی'
  - term:
      ar: Averroes
      en: Averroes
      ur: ایوروس
    gloss:
      ar: 'اسمه اللاتيني في كتب أوروبا في القرون الوسطى — المعلّق'
      en: 'his Latin name in the books of medieval Europe — the Commentator'
      ur: 'قرون وسطی کے یورپ کی کتابوں میں اس کا لاطینی نام — واسطی شارح'
  - term:
      ar: ١١٩٨
      en: '1198'
      ur: '1198'
    gloss:
      ar: 'سنة وفاته في مراكش قبل عودة رفاته'
      en: 'the year of his death in Marrakesh, before his remains came home'
      ur: 'مراکش میں اس کی وفات کا سال، اس کی رفات کے وطن لوٹنے سے پہلے'
  - term:
      ar: القاضي
      en: the judge
      ur: قاضی
    gloss:
      ar: 'منصبه في قرطبة قاضي القضاة الأعلى'
      en: 'his office in Cordoba — the highest of the judges'
      ur: 'قرطہ میں اس کا منصب — قاضیوں کا سب سے بڑا قاضی'
  practice:
  - q:
      ar: ما لقب ابن رشد عند الأوروبيين؟
      en: What was Ibn Rushd''s European title?
      ur: یورپیوں میں ابن رشد کا لقب کیا تھا؟
    options:
    - text:
        ar: المفسّر
        en: the Commentator
        ur: مفسر
      correct: true
      why:
        ar: سمّوه المفسّر لشروحه على أرسطو
        en: they called him the Commentator for his Aristotle commentaries
        ur: انہوں نے ارسطو کی شروحات کے لیے اسے مفسر کہا
    - text:
        ar: شيخ الرئيس
        en: Shaykh al-Ra''is
        ur: شیخ الرئیس
      correct: false
      why:
        ar: شيخ الرئيس لابن سينا لا ابن رشد
        en: Shaykh al-Ra''is is Ibn Sina, not Ibn Rushd
        ur: شیخ الرئیس ابن سینا کا ہے، ابن رشد کا نہیں
    - text:
        ar: الغزالي
        en: al-Ghazali
        ur: غزالی
      correct: false
      why:
        ar: الغزالي خصمه لا لقبه
        en: al-Ghazali is his opponent, not his title
        ur: غزالی اس کا مخالف ہے، لقب نہیں
    - text:
        ar: الملك
        en: the King
        ur: بادشاہ
      correct: false
      why:
        ar: كان فيلسوفًا لا ملكًا
        en: he was a philosopher, not a king
        ur: وہ فلسفی تھا، بادشاہ نہیں
  - q:
      ar: في أيّ مدينة قضى وعلّم؟
      en: In which city did he judge and teach?
      ur: اس نے کس شہر میں قضا اور پڑھایا؟
    options:
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطہ
      correct: true
      why:
        ar: كان قاضيها تحت الموحدين في المصادر
        en: the sources have him her judge under the Almohads
        ur: ماخذ میں وہ موحدین کے دور میں اس کا قاضی تھا
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: كان في الأندلس لا بغداد
        en: he was in al-Andalus, not Baghdad
        ur: وہ اندلس میں تھا، بغداد میں نہیں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: كان في المغرب لا مصر
        en: he was in the Maghreb, not Egypt
        ur: وہ مغرب میں تھا، مصر میں نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: كان في قرطبة لا دمشق
        en: he was in Cordoba, not Damascus
        ur: وہ قرطہ میں تھا، دمشق میں نہیں
  - q:
      ar: ما فصل المقال؟
      en: What is the Decisive Treatise?
      ur: فصل المقال کیا ہے؟
    options:
    - text:
        ar: كتابه في العلاقة بين الدين والفلسفة
        en: his book on religion and philosophy''s relation
        ur: دین اور فلسفہ کے تعلق پر اس کی کتاب
      correct: true
      why:
        ar: تذكر المصادر عنوانه وموضوعه
        en: the sources name its title and subject
        ur: ماخذ اس کا نام اور موضوع لکھتے ہیں
    - text:
        ar: كتاب طب
        en: a medicine book
        ur: طب کی کتاب
      correct: false
      why:
        ar: كان في الدين والفلسفة لا الطب
        en: it was on religion and philosophy, not medicine
        ur: یہ دین اور فلسفہ پر تھی، طب پر نہیں
    - text:
        ar: كتاب شعر
        en: a poetry book
        ur: شاعری کی کتاب
      correct: false
      why:
        ar: كان فلسفة لا شعرًا
        en: it was philosophy, not poetry
        ur: یہ فلسفہ تھا، شاعری نہیں
    - text:
        ar: رسالة سرية
        en: a secret letter
        ur: خفیہ خط
      correct: false
      why:
        ar: كتاب منشور لا سر
        en: a published book, not secret
        ur: شائع شدہ کتاب ہے، خفیہ نہیں
  - q:
      ar: من ناقش ابن رشد؟
      en: Whom did Ibn Rushd answer?
      ur: ابن رشد نے کس کا جواب دیا؟
    options:
    - text:
        ar: الغزالي في تهافت التهافت
        en: al-Ghazali in the Incoherence of the Incoherence
        ur: غزالی کو تہافت التہافت میں
      correct: true
      why:
        ar: تذكر المصادر ردّه على تهافت الفلاسفة
        en: the sources name his answer to the Incoherence of the Philosophers
        ur: ماخذ تہافت الفلاسفہ کے جواب کا ذکر کرتے ہیں
    - text:
        ar: أرسطو
        en: Aristotle
        ur: ارسطو
      correct: false
      why:
        ar: شرح أرسطو لا ناقشه
        en: he commented on Aristotle, not debated him
        ur: اس نے ارسطو کی شرح کی، بحث نہیں
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ناقش الغزالي لا ابن سينا مباشرة
        en: he answered al-Ghazali, not Ibn Sina directly
        ur: اس نے غزالی کا جواب دیا، ابن سینا کا براہ راست نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: ناقش الغزالي في كتابه
        en: he debated al-Ghazali in his book
        ur: اس نے اپنی کتاب میں غزالی سے بحث کی
  - q:
      ar: ماذا فعل الموحدون به في شيخوخته؟
      en: What did the Almohads do to him in old age?
      ur: پیری میں موحدین نے اس کے ساتھ کیا کیا؟
    options:
    - text:
        ar: نفوه إلى لوسينة ثم عاد
        en: they exiled him to Lucena then he returned
        ur: انہوں نے اسے لوسینہ جلاوطن کیا پھر وہ واپس آیا
      correct: true
      why:
        ar: تذكر المصادر نفيه وعودته
        en: the sources record his exile and return
        ur: ماخذ اس کی جلاوطنی اور واپسی لکھتے ہیں
    - text:
        ar: قتلوه
        en: they killed him
        ur: انہوں نے اسے مار ڈالا
      correct: false
      why:
        ar: مات في مراكش لا قُتل
        en: he died in Marrakesh, not killed
        ur: وہ مراکش میں فوت ہوا، مارا نہیں گیا
    - text:
        ar: نصّبوه خليفة
        en: they made him caliph
        ur: انہوں نے اسے خلیفہ بنایا
      correct: false
      why:
        ar: كان فيلسوفًا لا خليفة
        en: he was a philosopher, not a caliph
        ur: وہ فلسفی تھا، خلیفہ نہیں
    - text:
        ar: لم يفعلوا شيئًا
        en: they did nothing
        ur: انہوں نے کچھ نہیں کیا
      correct: false
      why:
        ar: تذكر المصادر نفيه في شيخوخته
        en: the sources record his old-age exile
        ur: ماخذ اس کی پیری میں جلاوطنی لکھتے ہیں
  - q:
      ar: متى مات ابن رشد؟
      en: When did Ibn Rushd die?
      ur: ابن رشد کب فوت ہوا؟
    options:
    - text:
        ar: عام ١١٩٨ في مراكش
        en: in 1198 in Marrakesh
        ur: 1198 میں مراکش میں
      correct: true
      why:
        ar: تذكر المصادر مكان وفاته وعامها
        en: the sources give his death''s place and year
        ur: ماخذ اس کی وفات کی جگہ اور سال دیتے ہیں
    - text:
        ar: عام ١٠٣٧
        en: in 1037
        ur: 1037 میں
      correct: false
      why:
        ar: ذلك عام وفاة ابن سينا
        en: that is Ibn Sina''s death year
        ur: یہ ابن سینا کی وفات کا سال ہے
    - text:
        ar: عام ٨٥٠
        en: in 850
        ur: 850 میں
      correct: false
      why:
        ar: ذلك قبل ميلاده بقرون
        en: that is centuries before his birth
        ur: یہ اس کی پیدائش سے صدیوں پہلے ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر كسائر الناس
        en: he died in the sources like all people
        ur: وہ ماخذ میں سب کی طرح فوت ہوا
  - q:
      ar: ما أثر شروحه؟
      en: What was his commentaries'' impact?
      ur: اس کی شروحات کا کیا اثر تھا؟
    options:
    - text:
        ar: ألهمت عصر النهضة الأوروبي
        en: they inspired the European Renaissance
        ur: انہوں نے یورپی نشاۃ ثانیہ کو ابھارا
      correct: true
      why:
        ar: دُرّست شروحه في مدارسهم قرونًا
        en: his commentaries were taught in their schools for centuries
        ur: اس کی شروحات ان کے مکتبوں میں صدیوں پڑھائی گئیں
    - text:
        ar: ألغت الفلسفة
        en: they abolished philosophy
        ur: انہوں نے فلسفہ ختم کیا
      correct: false
      why:
        ar: أحيت الفلسفة لا ألغتها
        en: they revived philosophy, not abolished
        ur: انہوں نے فلسفہ زندہ کیا، ختم نہیں
    - text:
        ar: لم يقرأها أحد
        en: nobody read them
        ur: کسی نے انہیں نہیں پڑھا
      correct: false
      why:
        ar: قرأتها أوروبا قرونًا
        en: Europe read them for centuries
        ur: یورپ نے انہیں صدیوں پڑھا
    - text:
        ar: بقيت مجهولة
        en: they stayed unknown
        ur: وہ نامعلوم رہیں
      correct: false
      why:
        ar: عرفت في أوروبا قبل بلاده
        en: they were known in Europe before his land
        ur: یہ اس کے ملک سے پہلے یورپ میں معروف ہوئیں
  - q:
      ar: ما منصبه تحت الموحدين؟
      en: What was his office under the Almohads?
      ur: موحدین کے دور میں اس کا منصب کیا تھا؟
    options:
    - text:
        ar: قاضي قرطبة وطبيب الخليفة
        en: Cordoba''s judge and the caliph''s physician
        ur: قرطہ کا قاضی اور خلیفہ کا طبیب
      correct: true
      why:
        ar: تذكر المصادر منصبيه معًا
        en: the sources name both offices together
        ur: ماخذ دونوں منصبوں کا ذکر ایک ساتھ کرتے ہیں
    - text:
        ar: قائد الجيش
        en: the army commander
        ur: فوج کا سردار
      correct: false
      why:
        ar: كان قاضيًا لا قائدًا
        en: he was a judge, not a commander
        ur: وہ قاضی تھا، سردار نہیں
    - text:
        ar: الخليفة نفسه
        en: the caliph himself
        ur: خود خلیفہ
      correct: false
      why:
        ar: خدم الخليفة لا كان هو
        en: he served the caliph, not was him
        ur: اس نے خلیفہ کی خدمت کی، خود نہیں تھا
    - text:
        ar: لا منصب
        en: no office
        ur: کوئی منصب نہیں
      correct: false
      why:
        ar: كان قاضيًا وطبيبًا في المصادر
        en: he was judge and physician in the sources
        ur: وہ ماخذ میں قاضی اور طبیب تھا
  - q:
      ar: لماذا يهمّ ابن رشد؟
      en: Why does Ibn Rushd matter?
      ur: ابن رشد کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه وصل الفلسفة اليونانية بأوروبا والإسلام
        en: because he linked Greek philosophy to Europe and Islam
        ur: کیونکہ اس نے یونانی فلسفہ کو یورپ اور اسلام سے جوڑا
      correct: true
      why:
        ar: جسّرت شروحه عقلًا بين الحضارتين
        en: his commentaries bridged reason between the civilizations
        ur: اس کی شروحات نے تہذیبوں کے درمیان عقل کا پل بنایا
    - text:
        ar: لأنه اخترع الفلسفة
        en: because he invented philosophy
        ur: کیونکہ اس نے فلسفہ ایجاد کی
      correct: false
      why:
        ar: شرح فلسفة قديمة لا اخترعها
        en: he commented on old philosophy, not invented
        ur: اس نے پرانے فلسفہ کی شرح کی، ایجاد نہیں
    - text:
        ar: لأنه كان ملكًا
        en: because he was a king
        ur: کیونکہ وہ بادشاہ تھا
      correct: false
      why:
        ar: كان فيلسوفًا وقاضيًا لا ملكًا
        en: he was a philosopher and judge, not a king
        ur: وہ فلسفی اور قاضی تھا، بادشاہ نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في تاريخ الفلسفة والنهضة
        en: his name is in philosophy''s and the Renaissance''s history
        ur: اس کا نام فلسفہ اور نشاۃ ثانیہ کی تاریخ میں ہے
  - q:
      ar: من كتب عن ابن رشد؟
      en: Who wrote about Ibn Rushd?
      ur: ابن رشد کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو الفلسفة والأوروبيون الذين ترجموه
        en: philosophy historians and the Europeans who translated him
        ur: فلسفہ کے مؤرخین اور وہ یورپی جنہوں نے اس کا ترجمہ کیا
      correct: true
      why:
        ar: تصلنا شروحه وروايات مؤرخي عصره
        en: his commentaries and his age''s historians reach us
        ur: اس کی شروحات اور اس کے دور کے مؤرخین ہم تک پہنچے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: ترجمته أوروبا وكتب عنه مؤرخوه
        en: Europe translated him and historians wrote of him
        ur: یورپ نے اس کا ترجمہ کیا اور مؤرخین نے لکھا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of him
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العباسيون فقط
        en: only the Abbasids
        ur: صرف عباسی
      correct: false
      why:
        ar: كتب عنه الموحدون والأوروبيون
        en: Almohads and Europeans wrote of him
        ur: موحدین اور یورپیوں نے اس کے بارے میں لکھا
- id: al-ghazali
  anchor: person/al-ghazali-abu-hamid
  band: scholars
  title:
    ar: الغزالي
    en: al-Ghazali
    ur: غزالی
  sixty:
    ar: 'أبو حامد محمد الغزالي الطوسي، حجة الإسلام: فقيه شافعي ومتصوف وفيلسوف من القرن الحادي عشر، ناقش الفلاسفة في «تهافت الفلاسفة» وجدد العلوم الدينية في «إحياء
      علوم الدين». عيّنه نظام الملك أستاذًا في النظامية ببغداد، ثم ترك المنصب في أزمة روحية وخرج إلى العزلة والتصوف عشر سنين. عاد إلى التدريس في نيسابور ثم طوس، جامعًا
      بين الشريعة والتصوف في مدرسة واحدة. مات ١١١١ في طوس، وبقي «Algazel» عند الأوروبيين ومُصلح الإسلام عند المسلمين.  ومن تلك الأزمة خرجت «الإحياء»: كتاب جمع الفقه والتصوف والعقل في مشروع واحد، فصار دستور التعليم الإسلامي قرونًا، وعرفه الغرب باسم «ألغزال». وبقي مثال العالم الذي يشك ثم يبحث ثم يجد — سيرة تُقرأ اليوم على أنها قصة البحث عن اليقين.  وقد رحل من بغداد إلى الشام والحجاز سنين في الخلوة والتأليف، ثم عاد إلى طوس يعلّم فيها حتى وفاته، تاركًا مدرسة فكر لا يزال أثرها في الفقه والتصوف والفلسفة معًا.'
    en: 'Abu Hamid Muhammad al-Ghazali al-Tusi, the Proof of Islam: an eleventh-century Shafi''''i jurist, Sufi and philosopher who answered the philosophers in the
      Incoherence of the Philosophers and renewed the religious sciences in the Revival of the Religious Sciences. Nizam al-Mulk made him professor at the Nizamiyya
      in Baghdad, then he left the chair in a spiritual crisis for ten years of seclusion and Sufism. He returned to teach in Nishapur then Tus, joining law and Sufism
      in one school. He died in Tus in 1111; to Europeans he stayed ''''Algazel'''' and to Muslims Islam''''s renewer.  Out of that crisis came the Revival — a book joining jurisprudence, Sufism and reason in one project that became Islamic education''s charter for centuries, and the west knew him as Algazel. He stayed the model of the scholar who doubts, then seeks, then finds — a life read today as the story of the search for certainty.'
    ur: 'ابو حامد محمد غزالی طوسی، حجۃ الاسلام: گیارہویں صدی کا شافعی فقیہ، صوفی اور فلسفی جس نے تہافت الفلاسفہ میں فلسفیوں کا جواب دیا اور احیاء علوم الدین میں دینی
      علوم کی تجدید کی۔ نظام الملک نے اسے بغداد میں نظامیہ کا استاد بنایا، پھر اس نے روحانی بحران میں کرسی چھوڑ کر دس سال خلوت اور تصوف میں گزارے۔ وہ نیشاپور پھر
      طوس میں پڑھانے واپس آیا، شریعت اور تصوف کو ایک مکتب میں جمع کرتے ہوئے۔ وہ 1111 میں طوس میں فوت ہوا؛ یورپیوں کے ہاں الغزال اور مسلمانوں کے ہاں اسلام کا مجدد
      رہا۔  اسی بحران سے احیاء نکلا — وہ کتاب جس نے فقہ، تصوف اور عقل کو ایک منصوبے میں جمع کیا اور صدیوں اسلامی تعلیم کا فرمان بنا، اور مغرب اسے الگزیل کے نام سے جانتا ہے۔ وہ اس عالم کا نمونہ رہا جو شک کرتا، پھر تلاش کرتا، پھر پاتا ہے — آج یقین کی تلاش کی کہانی کی طرح پڑھی جانے والی سیرت۔'
  glossary:
  - term:
      ar: حجة الإسلام
      en: the Proof of Islam
      ur: حجۃ الاسلام
    gloss:
      ar: 'لقبه عند المسلمين لدفاعه عن الدين بالحجة'
      en: 'his title among Muslims, for defending the faith with proof'
      ur: 'مسلمانوں میں اس کا لقب، دین کا حجت سے دفاع کرنے پر'
  - term:
      ar: طوس
      en: Tus
      ur: طوس
    gloss:
      ar: 'مدينته الخراسانية التي وُلد فيها ومات'
      en: 'his Khurasan city, where he was born and where he died'
      ur: 'خراسان کا اس کا شہر جہاں وہ پیدا ہوا اور فوت ہوا'
  - term:
      ar: الشافعي
      en: the Shafi''i
      ur: شافعی
    gloss:
      ar: 'مذهبه الفقهي الذي تعلّمه وعلّمه في النظامية'
      en: 'the legal school he learned and taught at the Nizamiyya'
      ur: 'فقہی مسلک جو اس نے سیکھا اور نظامیہ میں پڑھایا'
  - term:
      ar: التصوف
      en: Sufism
      ur: تصوف
    gloss:
      ar: 'الطريق الروحي الذي اختاره بعد أزمته'
      en: 'the spiritual path he chose after his crisis of certainty'
      ur: 'روحانی راستہ جو اس نے یقین کے بحران کے بعد چنا'
  - term:
      ar: تهافت الفلاسفة
      en: the Incoherence of the Philosophers
      ur: تہافت الفلاسفہ
    gloss:
      ar: 'كتابه الشهير الذي نقض فيه الفلاسفة، وردّ عليه ابن رشد من بعد'
      en: 'his famous critique of the philosophers, which Ibn Rushd later answered'
      ur: 'اس کی مشہور کتاب جس میں اس نے فلاسفہ پر نقد کیا، جس کا بعد میں ابن رشد نے جواب دیا'
  - term:
      ar: إحياء علوم الدين
      en: the Revival of the Religious Sciences
      ur: احیاء علوم الدین
    gloss:
      ar: 'موسوعته العظيمة التي جدّدت علوم الدين من الفقه إلى التصوف'
      en: 'his great encyclopaedia that renewed the religious sciences from fiqh to Sufism'
      ur: 'اس کی عظیم موسوعہ جس نے فقہ سے تصوف تک دین کے علوم کی تجدید کی'
  - term:
      ar: نظام الملك
      en: Nizam al-Mulk
      ur: نظام الملک
    gloss:
      ar: 'الوزير السلجوقي الذي عيّنه في بغداد'
      en: 'the Seljuk vizier who appointed him to the Nizamiyya in Baghdad'
      ur: 'سلجوقی وزیر جس نے اسے بغداد کی نظامیہ پر مقرر کیا'
  - term:
      ar: النظامية
      en: the Nizamiyya
      ur: نظامیہ
    gloss:
      ar: 'كليته التي صارت نموذج التعليم الإسلامي العالي لقرون'
      en: 'his college, which became the model of higher Islamic education for centuries'
      ur: 'اس کا مدرسہ جو صدیوں تک اعلیٰ اسلامی تعلیم کا نمونہ رہا'
  - term:
      ar: نيسابور
      en: Nishapur
      ur: نیشاپور
    gloss:
      ar: 'المدينة الخراسانية التي تلقّى فيها علمه الأول على مشايخها'
      en: 'the Khurasan city where he first received learning from its scholars'
      ur: 'خراسان کا شہر جہاں اس نے اس کے مشائخ سے پہلی تعلیم حاصل کی'
  - term:
      ar: العزلة
      en: the seclusion
      ur: خلوت
    gloss:
      ar: 'سنوات خلوته بين الشام والحجاز بعد تركه التدريس'
      en: 'his years of seclusion between Syria and the Hijaz, after he left teaching'
      ur: 'شام اور حجاز کے درمیان اس کی خلوت کے سال، تدریس چھوڑنے کے بعد'
  - term:
      ar: Algazel
      en: Algazel
      ur: الغزال
    gloss:
      ar: 'اسمه اللاتيني الذي عرفته به أوروبا الوسطى في كتبها'
      en: 'the Latin name medieval Europe knew him by in its books'
      ur: 'وہ لاطینی نام جس سے قرون وسطی کا یورپ اسے اپنی کتابوں میں جانتا تھا'
  - term:
      ar: ١١١١
      en: '1111'
      ur: '1111'
    gloss:
      ar: 'سنة وفاته في طوس مسقط رأسه وموطنه'
      en: 'the year of his death in Tus — his birthplace and home'
      ur: 'طوس میں اس کی وفات کا سال — اس کا مسقط الرأس اور وطن'
  practice:
  - q:
      ar: ما لقب الغزالي؟
      en: What is al-Ghazali''s title?
      ur: غزالی کا لقب کیا ہے؟
    options:
    - text:
        ar: حجة الإسلام
        en: the Proof of Islam
        ur: حجۃ الاسلام
      correct: true
      why:
        ar: يذكر المصادر لقبه في كتب السيرة
        en: the sources give his title in the biographies
        ur: ماخذ سوانح میں اس کا لقب دیتے ہیں
    - text:
        ar: شيخ الرئيس
        en: Shaykh al-Ra''is
        ur: شیخ الرئیس
      correct: false
      why:
        ar: شيخ الرئيس لابن سينا لا الغزالي
        en: Shaykh al-Ra''is is Ibn Sina, not al-Ghazali
        ur: شیخ الرئیس ابن سینا کا ہے، غزالی کا نہیں
    - text:
        ar: المفسّر
        en: the Commentator
        ur: مفسر
      correct: false
      why:
        ar: المفسّر لابن رشد
        en: the Commentator is Ibn Rushd
        ur: مفسر ابن رشد کا ہے
    - text:
        ar: الفاتح
        en: the Conqueror
        ur: فاتح
      correct: false
      why:
        ar: الفاتح لمحمد الثاني لا الغزالي
        en: the Conqueror is Mehmed II, not al-Ghazali
        ur: فاتح محمد ثانی کا ہے، غزالی کا نہیں
  - q:
      ar: ما كتابه الأشهر ضد الفلاسفة؟
      en: What is his famous book against the philosophers?
      ur: فلسفیوں کے خلاف اس کی مشہور کتاب کیا ہے؟
    options:
    - text:
        ar: تهافت الفلاسفة
        en: the Incoherence of the Philosophers
        ur: تہافت الفلاسفہ
      correct: true
      why:
        ar: تذكر المصادر عنوانه وردّه
        en: the sources name its title and refutation
        ur: ماخذ اس کا نام اور رد لکھتے ہیں
    - text:
        ar: القانون في الطب
        en: the Canon of Medicine
        ur: طب کا قانون
      correct: false
      why:
        ar: القانون لابن سينا لا الغزالي
        en: the Canon is Ibn Sina''s, not al-Ghazali''s
        ur: قانون ابن سینا کی ہے، غزالی کی نہیں
    - text:
        ar: فصل المقال
        en: the Decisive Treatise
        ur: فصل المقال
      correct: false
      why:
        ar: فصل المقال لابن رشد
        en: the Decisive Treatise is Ibn Rushd''s
        ur: فصل المقال ابن رشد کی ہے
    - text:
        ar: المقدمة
        en: the Muqaddima
        ur: مقدمہ
      correct: false
      why:
        ar: المقدمة لابن خلدون
        en: the Muqaddima is Ibn Khaldun''s
        ur: مقدمہ ابن خلدون کی ہے
  - q:
      ar: ما موسوعته الدينية؟
      en: What is his religious encyclopedia?
      ur: اس کی دینی دائرۃ المعارف کیا ہے؟
    options:
    - text:
        ar: إحياء علوم الدين
        en: the Revival of the Religious Sciences
        ur: احیاء علوم الدین
      correct: true
      why:
        ar: تذكر المصادر تجديده العلوم الدينية
        en: the sources name its renewal of religious sciences
        ur: ماخذ دینی علوم کی اس کی تجدید لکھتے ہیں
    - text:
        ar: الشفاء
        en: the Healing
        ur: شفا
      correct: false
      why:
        ar: الشفاء لابن سينا
        en: the Healing is Ibn Sina''s
        ur: شفا ابن سینا کی ہے
    - text:
        ar: صحيح البخاري
        en: Sahih al-Bukhari
        ur: صحیح بخاری
      correct: false
      why:
        ar: البخاري كتاب حديث قبله
        en: al-Bukhari is an earlier hadith book
        ur: بخاری اس سے پہلے کی حدیث کی کتاب ہے
    - text:
        ar: تفسير الطبري
        en: al-Tabari''s exegesis
        ur: طبری کی تفسیر
      correct: false
      why:
        ar: الطبري قبله بقرنين
        en: al-Tabari is two centuries earlier
        ur: طبری اس سے دو صدیاں پہلے ہے
  - q:
      ar: من عيّنه في النظامية؟
      en: Who appointed him to the Nizamiyya?
      ur: اسے نظامیہ میں کس نے مقرر کیا؟
    options:
    - text:
        ar: نظام الملك الوزير
        en: the vizier Nizam al-Mulk
        ur: وزیر نظام الملک
      correct: true
      why:
        ar: تذكر المصادر تعيين الوزير له
        en: the sources record the vizier''s appointment
        ur: ماخذ وزیر کی طرف سے تقرر لکھتے ہیں
    - text:
        ar: الخليفة المأمون
        en: the caliph al-Ma''mun
        ur: خلیفہ مأمون
      correct: false
      why:
        ar: المأمون قبله بقرنين ونصف
        en: al-Ma''mun was two and a half centuries earlier
        ur: مأمون اس سے ڈھائی صدی پہلے تھا
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعده بعقود
        en: Saladin came decades later
        ur: صلاح الدین دہائیوں بعد آیا
    - text:
        ar: هارون الرشيد
        en: Harun al-Rashid
        ur: ہارون الرشید
      correct: false
      why:
        ar: هارون قبله بثلاثة قرون
        en: Harun was three centuries earlier
        ur: ہارون اس سے تین صدیاں پہلے تھا
  - q:
      ar: ماذا فعل بعد ترك المنصب؟
      en: What did he do after leaving the chair?
      ur: کرسی چھوڑنے کے بعد اس نے کیا کیا؟
    options:
    - text:
        ar: اعتزل عشر سنين في التصوف
        en: he secluded ten years in Sufism
        ur: اس نے تصوف میں دس سال خلوت کی
      correct: true
      why:
        ar: تذكر المصادر أزمته الروحية واعتزاله
        en: the sources record his spiritual crisis and seclusion
        ur: ماخذ اس کا روحانی بحران اور خلوت لکھتے ہیں
    - text:
        ar: قاد جيشًا
        en: he led an army
        ur: اس نے فوج کی قیادت کی
      correct: false
      why:
        ar: كان عالمًا لا قائدًا
        en: he was a scholar, not a commander
        ur: وہ عالم تھا، سردار نہیں
    - text:
        ar: بنى مدينة
        en: he built a city
        ur: اس نے شہر بنایا
      correct: false
      why:
        ar: بنى فكرًا لا مدينة
        en: he built thought, not a city
        ur: اس نے فکر بنائی، شہر نہیں
    - text:
        ar: تجّر في الهند
        en: he traded in India
        ur: اس نے ہندوستان میں تجارت کی
      correct: false
      why:
        ar: اعتزل للعلم لا التجارة
        en: he secluded for learning, not trade
        ur: اس نے علم کے لیے خلوت کی، تجارت کے لیے نہیں
  - q:
      ar: في أيّ مذهب كان؟
      en: Which legal school was he in?
      ur: وہ کس فقہی مذہب میں تھا؟
    options:
    - text:
        ar: الشافعي
        en: the Shafi''i
        ur: شافعی
      correct: true
      why:
        ar: يذكر المصادر مذهبه الشافعي
        en: the sources give his Shafi''i school
        ur: ماخذ اس کا شافعی مذہب دیتے ہیں
    - text:
        ar: الحنفي
        en: the Hanafi
        ur: حنفی
      correct: false
      why:
        ar: كان شافعيًّا لا حنفيًّا
        en: he was Shafi''i, not Hanafi
        ur: وہ شافعی تھا، حنفی نہیں
    - text:
        ar: المالكي
        en: the Maliki
        ur: مالکی
      correct: false
      why:
        ar: كان في الشافعية لا المالكية
        en: he was in the Shafi''i school, not Maliki
        ur: وہ شافعی مذہب میں تھا، مالکی نہیں
    - text:
        ar: لا مذهب
        en: no school
        ur: کوئی مذہب نہیں
      correct: false
      why:
        ar: يذكر المصادر مذهبه الشافعي
        en: the sources give his Shafi''i school
        ur: ماخذ اس کا شافعی مذہب دیتے ہیں
  - q:
      ar: ماذا جمع في مدرسته؟
      en: What did he join in his school?
      ur: اس نے اپنے مکتب میں کیا ملا؟
    options:
    - text:
        ar: الشريعة والتصوف
        en: law and Sufism
        ur: شریعت اور تصوف
      correct: true
      why:
        ar: تذكر المصادر جمعه الفقه والروح
        en: the sources have him join fiqh and spirit
        ur: ماخذ میں اس نے فقہ اور روح کو ملایا
    - text:
        ar: الفلسفة فقط
        en: philosophy only
        ur: صرف فلسفہ
      correct: false
      why:
        ar: جمع الفقه والتصوف لا فلسفة فقط
        en: he joined fiqh and Sufism, not just philosophy
        ur: اس نے فقہ اور تصوف ملایا، صرف فلسفہ نہیں
    - text:
        ar: الطب والهندسة
        en: medicine and engineering
        ur: طب اور انجینئری
      correct: false
      why:
        ar: كانت مدرسته دينية لا طبية
        en: his school was religious, not medical
        ur: اس کا مکتب دینی تھا، طبی نہیں
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: جمع الشريعة والتصوف في المصادر
        en: the sources have him join law and Sufism
        ur: ماخذ میں اس نے شریعت اور تصوف کو ملایا
  - q:
      ar: متى مات الغزالي؟
      en: When did al-Ghazali die?
      ur: غزالی کب فوت ہوا؟
    options:
    - text:
        ar: عام ١١١١ في طوس
        en: in 1111 in Tus
        ur: 1111 میں طوس میں
      correct: true
      why:
        ar: تذكر المصادر مكان وعام وفاته
        en: the sources give his death''s place and year
        ur: ماخذ اس کی وفات کی جگہ اور سال دیتے ہیں
    - text:
        ar: عام ١١٩٨
        en: in 1198
        ur: 1198 میں
      correct: false
      why:
        ar: ذلك عام وفاة ابن رشد
        en: that is Ibn Rushd''s death year
        ur: یہ ابن رشد کی وفات کا سال ہے
    - text:
        ar: عام ٨٥٩
        en: in 859
        ur: 859 میں
      correct: false
      why:
        ar: ذلك قبل ميلاده بقرنين
        en: that is two centuries before his birth
        ur: یہ اس کی پیدائش سے دو صدیاں پہلے ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر
        en: he died in the sources
        ur: وہ ماخذ میں فوت ہوا
  - q:
      ar: ما اسمه عند الأوروبيين؟
      en: What is his European name?
      ur: یورپیوں میں اس کا نام کیا ہے؟
    options:
    - text:
        ar: Algazel
        en: Algazel
        ur: الغزال
      correct: true
      why:
        ar: يذكر الاسم اللاتيني في المصادر
        en: the sources give the Latin name
        ur: ماخذ لاطینی نام دیتے ہیں
    - text:
        ar: Avicenna
        en: Avicenna
        ur: ایویسینا
      correct: false
      why:
        ar: Avicenna لابن سينا
        en: Avicenna is Ibn Sina
        ur: ایویسینا ابن سینا کا ہے
    - text:
        ar: Averroes
        en: Averroes
        ur: ایوروس
      correct: false
      why:
        ar: Averroes لابن رشد
        en: Averroes is Ibn Rushd
        ur: ایوروس ابن رشد کا ہے
    - text:
        ar: Alhazen
        en: Alhazen
        ur: الحازن
      correct: false
      why:
        ar: Alhazen لابن الهيثم
        en: Alhazen is Ibn al-Haytham
        ur: الحازن ابن ہیشم کا ہے
  - q:
      ar: لماذا يهمّ الغزالي؟
      en: Why does al-Ghazali matter?
      ur: غزالی کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه جدد العلوم الدينية وناقش الفلسفة
        en: because he renewed religious sciences and debated philosophy
        ur: کیونکہ اس نے دینی علوم کی تجدید کی اور فلسفہ سے بحث کی
      correct: true
      why:
        ar: بقي إحياؤه مرجعًا في المدرسة الإسلامية
        en: his Revival stayed a reference in Islamic schooling
        ur: اس کی احیاء اسلامی تدریس میں مرجع رہی
    - text:
        ar: لأنه اخترع الفلسفة
        en: because he invented philosophy
        ur: کیونکہ اس نے فلسفہ ایجاد کی
      correct: false
      why:
        ar: ناقش الفلسفة لا اخترعها
        en: he debated philosophy, not invented it
        ur: اس نے فلسفہ سے بحث کی، ایجاد نہیں
    - text:
        ar: لأنه كان خليفة
        en: because he was a caliph
        ur: کیونکہ وہ خلیفہ تھا
      correct: false
      why:
        ar: كان عالمًا لا خليفة
        en: he was a scholar, not a caliph
        ur: وہ عالم تھا، خلیفہ نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في تاريخ الفكر الإسلامي
        en: his name is in Islamic thought''s history
        ur: اس کا نام اسلامی فکر کی تاریخ میں ہے
- id: mimar-sinan
  anchor: person/mimar-sinan
  band: researchers
  title:
    ar: سنان
    en: Sinan
    ur: سنان
  sixty:
    ar: 'معمار سنان، كبير مهندسي الدولة العثمانية في القرن السادس عشر: جندي ينشري قبطي الأصل صار أعظم بناة إسطنبول خمسين عامًا. صمّم أكثر من ثلاثمائة بناء: جامع سليمان
      في إسطنبول ١٥٥٧، وجامع سليم في أدرنة ١٥٧٥ الذي عدّه تحفته، وجسور وحمّامات ومدارس في كلّ الأناضول. جمع البناء العثماني البراعة البيزنطية بالحرف الإسلامي في قبة
      وفناء ورواق، وجعل إسطنبول مدينة المآذن. مات ١٥٨٨ مدفونًا قرب السليمانية التي تبقى تحفته الكبرى.  ومن تعليمه خرج مهندسون حملوا اسمه عبر البلقان والشام ومصر، فصار طرازه معيار المسجد العثماني كلّه. وحين سئل عن أعماله الكبرى قال إن السليمانية صنعة الكفاءة والسليمية صنعة الكمال — فهو الذي رأى عمره كله عمارة واحدة تتقدّم نحو قبة مثالية.  وبقي اسمه فوق الأعمال الثلاثمائة رمزًا للمهندس الذي يبدأ جنديًّا وينتهي معلّمًا للإمبراطوريات: من مسجد إلى جسر إلى مدرسة، خريطة حياته هي خريطة إسطنبول نفسها.'
    en: 'Mimar Sinan, chief architect of the Ottoman state in the sixteenth century: a janissary soldier of Cappadocian origin who became Istanbul''''s greatest builder
      for fifty years. He designed more than three hundred works: the Suleymaniye mosque in Istanbul in 1557, the Selimiye in Edirne in 1575 he counted his masterpiece,
      and bridges, bathhouses and schools across Anatolia. He joined Byzantine craft to Islamic art in dome, courtyard and portico, and made Istanbul the city of
      minarets. He died in 1588, buried near the Suleymaniye that stays his greatest work.  Out of his teaching came engineers who carried his name across the Balkans, Syria and Egypt, until his style became the whole Ottoman mosque''s measure. Asked about his great works he said the Suleymaniye was the work of competence and the Selimiye of perfection — for he saw his whole life as one architecture advancing toward an ideal dome.'
    ur: 'معمار سنان، سولہویں صدی میں عثمانی سلطنت کا چیف انجینئر: کیپاڈوکیائی اصل کا جنیسری سپاہی جو پچاس سال استنبول کا سب سے بڑا معمار رہا۔ اس نے تین سو سے زیادہ
      عمارتیں ڈیزائن کیں: 1557 میں استنبول کی سلیمانیہ مسجد، 1575 میں ادرنہ کی سلیمیہ مسجد جسے وہ اپنی ماسٹر پیس کہتا تھا، اور پورے اناطولیہ میں پل، حمام اور مدرسے۔
      اس نے بازنطینی ہنر کو اسلامی فن سے گنبد، صحن اور رواق میں ملایا، اور استنبول کو میناروں کا شہر بنایا۔ وہ 1588 میں فوت ہوا، سلیمانیہ کے قریب دفن جو اس کا سب
      سے بڑا کام رہی۔  اس کی تعلیم سے انجینئر نکلے جنھوں نے اس کا نام بلقان، شام اور مصر تک پہنچایا یہاں تک کہ اس کا طرز ساری عثمانی مسجد کا پیمانہ بنا۔ اپنی بڑی عمارتوں کے بارے میں پوچھا گیا تو اس نے کہا سلیمانیہ مہارت کا کام ہے اور سلیمیہ کمال کا — کیونکہ اس نے اپنی ساری زندگی کو ایک مثالی گنبد کی طرف بڑھتی عمارت سمجھا۔'
  glossary:
  - term:
      ar: معمار
      en: Mimar
      ur: معمار
    gloss:
      ar: 'لقبه عند العثمانيين ومعناه المهندس المعماري'
      en: 'his Ottoman title, meaning simply architect'
      ur: 'عثمانیوں میں اس کا لقب جس کا مطلب بس معمار ہے'
  - term:
      ar: الينشري
      en: the janissary
      ur: جنیسری
    gloss:
      ar: 'سلك الجندية الذي بدأ فيه قبل أن يصير مهندسًا'
      en: 'the soldiery he began in before he became an engineer'
      ur: 'سپاہی گری کا سلك جو اس نے انجینئر بننے سے پہلے اختیار کیا'
  - term:
      ar: قبادوقيا
      en: Cappadocia
      ur: کیپاڈوکیا
    gloss:
      ar: 'موطنه الأناضولي الذي جاء منه جنديًّا شابًّا'
      en: 'his Anatolian homeland, which he left as a young soldier'
      ur: 'اناطولیہ میں اس کی مادی وطن جہاں سے وہ جوان سپاہی بن کر گیا'
  - term:
      ar: سليمانية
      en: the Suleymaniye
      ur: سلیمانیہ
    gloss:
      ar: 'مسجد سليمان الذي سمّاه عمل الكفاءة'
      en: 'Suleiman''s great mosque, which he called the work of his competence'
      ur: 'سلیمان کی عظیم مسجد جسے اس نے اپنے ہنر کا کارنامہ کہا'
  - term:
      ar: سليمية
      en: the Selimiye
      ur: سلیمیہ
    gloss:
      ar: 'مسجد سليم الذي سمّاه تحفة الإتقان'
      en: 'Selim''s mosque in Edirne, which he called his masterpiece of perfection'
      ur: 'ادرنہ میں سلیم کی مسجد جسے اس نے کمال کا شاہکار کہا'
  - term:
      ar: أدرنة
      en: Edirne
      ur: ادرنہ
    gloss:
      ar: 'مدينة السليمية في الروملي قرب الحدود الغربية للدولة'
      en: 'the Selimiye''s city in Rumelia, near the empire''s western border'
      ur: 'رومیلی میں سلیمیہ کا شہر، سلطنت کی مغربی سرحد کے قریب'
  - term:
      ar: إسطنبول
      en: Istanbul
      ur: استنبول
    gloss:
      ar: 'عاصمة أعماله التي ملأها بالبناء'
      en: 'the capital of his works, which he filled with buildings'
      ur: 'اس کے کارناموں کی راجدھانی جسے اس نے عمارتوں سے بھر دیا'
  - term:
      ar: القبة
      en: the dome
      ur: گنبد
    gloss:
      ar: 'العنصر الذي أتقنته كل أعماله'
      en: 'the element all his great works master — the high dome'
      ur: 'وہ عنصر جس پر اس کی ساری عظیم عمارتیں مہارت رکھتی ہیں — بلند گنبد'
  - term:
      ar: ثلاثمائة
      en: three hundred
      ur: تین سو
    gloss:
      ar: 'عدد الأعمال التي تنسبها إليه المصادر'
      en: 'the count of works the sources attribute to his hand'
      ur: 'ان کارناموں کی گنتی جو روایات اس کے نام سے جوڑتی ہیں'
  - term:
      ar: ١٥٨٨
      en: '1588'
      ur: '1588'
    gloss:
      ar: 'سنة وفاته بعد نصف قرن من البناء'
      en: 'the year of his death, after half a century of building'
      ur: 'اس کی وفات کا سال، نصف صدی کی تعمیر کے بعد'
  - term:
      ar: الأناضول
      en: Anatolia
      ur: اناطولیہ
    gloss:
      ar: 'إقليمه الذي جاء منه معظم تلاميذه'
      en: 'his region, from which most of his pupils also came'
      ur: 'اس کا خطہ جہاں سے اس کے زیادہ تر شاگرد بھی آئے'
  - term:
      ar: المآذن
      en: the minarets
      ur: مینار
    gloss:
      ar: 'أبراجه النحيلة العالية التي أعطت إسطنبول شكلها المميز'
      en: 'his slender lofty towers that gave Istanbul its distinctive skyline'
      ur: 'اس کے پتلے اونچے مینار جنہوں نے استنبول کو اس کا مخصوص آسمان خاکہ دیا'
  practice:
  - q:
      ar: من سنان؟
      en: Who was Sinan?
      ur: سنان کون تھا؟
    options:
    - text:
        ar: كبير مهندسي الدولة العثمانية
        en: the Ottoman state''s chief architect
        ur: عثمانی سلطنت کا چیف انجینئر
      correct: true
      why:
        ar: يذكر المصادر منصبه في عهد سليمان
        en: the sources name his office under Suleiman
        ur: ماخذ سلیمان کے دور میں اس کے منصب کا ذکر کرتے ہیں
    - text:
        ar: سلطان عثماني
        en: an Ottoman sultan
        ur: عثمانی سلطان
      correct: false
      why:
        ar: كان مهندسًا لا سلطانًا
        en: he was an architect, not a sultan
        ur: وہ معمار تھا، سلطان نہیں
    - text:
        ar: رحّالة
        en: a traveller
        ur: مسافر
      correct: false
      why:
        ar: كان بانيًا لا رحّالة
        en: he was a builder, not a traveller
        ur: وہ بنانے والا تھا، مسافر نہیں
    - text:
        ar: فيلسوف
        en: a philosopher
        ur: فلسفی
      correct: false
      why:
        ar: كان معماريًّا لا فيلسوفًا
        en: he was an architect, not a philosopher
        ur: وہ معمار تھا، فلسفی نہیں
  - q:
      ar: كم بنا؟
      en: How much did he build?
      ur: اس نے کتنا بنایا؟
    options:
    - text:
        ar: أكثر من ثلاثمائة بناء
        en: more than three hundred works
        ur: تین سو سے زیادہ عمارتیں
      correct: true
      why:
        ar: تذكر المصادر عدد أعماله
        en: the sources give his works'' count
        ur: ماخذ اس کے کاموں کی تعداد دیتے ہیں
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: ثلاثمائة أكثر من عشرة بكثير
        en: three hundred far exceeds ten
        ur: تین سو دس سے کہیں زیادہ ہے
    - text:
        ar: مبنى واحد
        en: one building
        ur: ایک عمارت
      correct: false
      why:
        ar: بنى مئات الأعمال لا واحدًا
        en: he built hundreds, not one
        ur: اس نے سیکڑوں بنائے، ایک نہیں
    - text:
        ar: لم يبنِ
        en: he built nothing
        ur: اس نے کچھ نہیں بنایا
      correct: false
      why:
        ar: يعدّ أعظم بناة العثمانية
        en: he is counted the Ottomans'' greatest builder
        ur: وہ عثمانیوں کا عظیم ترین معمار شمار ہوتا ہے
  - q:
      ar: ما أشهر مسجديه؟
      en: What are his two most famous mosques?
      ur: اس کی دو مشہور ترین مسجدیں کیا ہیں؟
    options:
    - text:
        ar: السليمانية والسليمية
        en: the Suleymaniye and the Selimiye
        ur: سلیمانیہ اور سلیمیہ
      correct: true
      why:
        ar: بنى الأول في إسطنبول والثاني في أدرنة
        en: he built the first in Istanbul, the second in Edirne
        ur: پہلی اس نے استنبول میں، دوسری ادرنہ میں بنائی
    - text:
        ar: الأقصى والنبوي
        en: al-Aqsa and the Prophet''s
        ur: اقصیٰ اور نبوی
      correct: false
      why:
        ar: الأقصى والنبوي قبله بقرون
        en: al-Aqsa and the Prophet''s predate him by centuries
        ur: اقصیٰ اور نبوی اس سے صدیوں پرانے ہیں
    - text:
        ar: القرويين والأزهر
        en: al-Qarawiyyin and al-Azhar
        ur: قرویین اور الازہر
      correct: false
      why:
        ar: القرويين والأزهر قبله بقرون
        en: al-Qarawiyyin and al-Azhar predate him
        ur: قرویین اور الازہر اس سے صدیوں پرانے ہیں
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة في مكة لا من بنائه
        en: the Kaaba is in Mecca, not his building
        ur: کعبہ مکہ میں ہے، اس کی عمارت نہیں
  - q:
      ar: في أيّ مدينة السليمية؟
      en: In which city is the Selimiye?
      ur: سلیمیہ کس شہر میں ہے؟
    options:
    - text:
        ar: في أدرنة
        en: in Edirne
        ur: ادرنہ میں
      correct: true
      why:
        ar: بناها هناك وعدّها تحفته
        en: he built her there and counted her his masterpiece
        ur: اس نے اسے وہاں بنایا اور اپنی ماسٹر پیس کہا
    - text:
        ar: في إسطنبول
        en: in Istanbul
        ur: استنبول میں
      correct: false
      why:
        ar: السليمانية في إسطنبول لا السليمية
        en: the Suleymaniye is in Istanbul, not the Selimiye
        ur: سلیمانیہ استنبول میں ہے، سلیمیہ نہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: السليمية في تركيا لا مصر
        en: the Selimiye is in Turkey, not Egypt
        ur: سلیمیہ ترکی میں ہے، مصر میں نہیں
    - text:
        ar: في دمشق
        en: in Damascus
        ur: دمشق میں
      correct: false
      why:
        ar: السليمية في الأناضول لا الشام
        en: the Selimiye is in Anatolia, not Syria
        ur: سلیمیہ اناطولیہ میں ہے، شام میں نہیں
  - q:
      ar: ماذا كان قبل المعمارية؟
      en: What was he before architecture?
      ur: معماری سے پہلے وہ کیا تھا؟
    options:
    - text:
        ar: جندي ينشري
        en: a janissary soldier
        ur: جنیسری سپاہی
      correct: true
      why:
        ar: بدأ في السلاح العسكري في المصادر
        en: the sources have him start in the military arm
        ur: ماخذ میں اس نے فوجی شعبے سے آغاز کیا
    - text:
        ar: تاجر
        en: a merchant
        ur: تاجر
      correct: false
      why:
        ar: كان جنديًّا قبل البناء لا تاجرًا
        en: he was a soldier before building, not a merchant
        ur: وہ تعمیر سے پہلے سپاہی تھا، تاجر نہیں
    - text:
        ar: فلاح
        en: a farmer
        ur: کسان
      correct: false
      why:
        ar: كان ينشريًّا لا فلاحًا
        en: he was a janissary, not a farmer
        ur: وہ جنیسری تھا، کسان نہیں
    - text:
        ar: عالم دين
        en: a religious scholar
        ur: دینی عالم
      correct: false
      why:
        ar: كان عسكريًّا ثم معماريًّا
        en: he was military then architect
        ur: وہ فوجی تھا پھر معمار
  - q:
      ar: ماذا جمع في بنائه؟
      en: What did he join in his building?
      ur: اس نے اپنی تعمیر میں کیا ملا؟
    options:
    - text:
        ar: البراعة البيزنطية بالحرف الإسلامي
        en: Byzantine craft with Islamic art
        ur: بازنطینی ہنر کو اسلامی فن سے
      correct: true
      why:
        ar: تذكر المصادر جمعه العمارتين في عمل واحد
        en: the sources have him join the two architectures in one work
        ur: ماخذ میں اس نے دونوں معماریوں کو ایک کام میں ملایا
    - text:
        ar: الصيني والهندي
        en: Chinese and Indian
        ur: چینی اور ہندوستانی
      correct: false
      why:
        ar: جمع البيزنطي والإسلامي لا الصيني
        en: he joined Byzantine and Islamic, not Chinese
        ur: اس نے بازنطینی اور اسلامی ملایا، چینی نہیں
    - text:
        ar: لا شيء؛ نسخ آيا صوفيا
        en: nothing; he copied Hagia Sophia
        ur: کچھ نہیں؛ اس نے آیا صوفیا کی نقل کی
      correct: false
      why:
        ar: جمع وأبدع لا نسخ
        en: he joined and created, not copied
        ur: اس نے ملا اور ایجاد کیا، نقل نہیں
    - text:
        ar: الروماني والفرعوني
        en: Roman and pharaonic
        ur: رومی اور فرعونی
      correct: false
      why:
        ar: جمع البيزنطي والإسلامي لا الفرعوني
        en: he joined Byzantine and Islamic, not pharaonic
        ur: اس نے بازنطینی اور اسلامی ملایا، فرعونی نہیں
  - q:
      ar: متى مات؟
      en: When did he die?
      ur: وہ کب فوت ہوا؟
    options:
    - text:
        ar: عام ١٥٨٨ قرب السليمانية
        en: in 1588 near the Suleymaniye
        ur: 1588 میں سلیمانیہ کے قریب
      correct: true
      why:
        ar: تذكر المصادر وفاته وقبره
        en: the sources record his death and grave
        ur: ماخذ اس کی وفات اور قبر لکھتے ہیں
    - text:
        ar: عام ١٥٥٧
        en: in 1557
        ur: 1557 میں
      correct: false
      why:
        ar: ذلك عام اكتمال السليمانية لا وفاته
        en: that is the Suleymaniye''s completion, not his death
        ur: یہ سلیمانیہ کی تکمیل کا سال ہے، وفات کا نہیں
    - text:
        ar: عام ١٦٨٣
        en: in 1683
        ur: 1683 میں
      correct: false
      why:
        ar: ذلك بعد موته بقرن تقريبًا
        en: that is about a century after his death
        ur: یہ اس کی وفات سے تقریباً ایک صدی بعد ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر
        en: he died in the sources
        ur: وہ ماخذ میں فوت ہوا
  - q:
      ar: ماذا بنا غير المساجد؟
      en: What did he build besides mosques?
      ur: مسجدوں کے علاوہ اس نے کیا بنایا؟
    options:
    - text:
        ar: جسورًا وحمّامات ومدارس
        en: bridges, bathhouses and schools
        ur: پل، حمام اور مدرسے
      correct: true
      why:
        ar: تذكر المصادر تنوع أعماله في الأناضول
        en: the sources name his varied works in Anatolia
        ur: ماخذ اناطولیہ میں اس کے متنوع کاموں کا ذکر کرتے ہیں
    - text:
        ar: السفن
        en: ships
        ur: جہاز
      correct: false
      why:
        ar: بنى مبانٍ لا سفنًا
        en: he built buildings, not ships
        ur: اس نے عمارتیں بنائیں، جہاز نہیں
    - text:
        ar: الطائرات
        en: aircraft
        ur: ہوائی جہاز
      correct: false
      why:
        ar: لم تكن الطائرات في عصره
        en: aircraft did not exist in his age
        ur: ہوائی جہاز اس کے دور میں نہیں تھے
    - text:
        ar: لا شيء آخر
        en: nothing else
        ur: کچھ اور نہیں
      correct: false
      why:
        ar: تذكر المصادر جسورًا وحمّامات ومدارس
        en: the sources name bridges, baths and schools
        ur: ماخذ پل، حمام اور مدرسوں کا ذکر کرتے ہیں
  - q:
      ar: لماذا يهمّ سنان؟
      en: Why does Sinan matter?
      ur: سنان کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه جعل إسطنبول مدينة المآذن والقباب
        en: because he made Istanbul the city of minarets and domes
        ur: کیونکہ اس نے استنبول کو میناروں اور گنبدوں کا شہر بنایا
      correct: true
      why:
        ar: بقيت أعماله معالم المدينة في المصادر
        en: his works stayed the city''s landmarks in the sources
        ur: اس کے کام ماخذ میں شہر کی نشانیاں رہے
    - text:
        ar: لأنه اخترع العمارة
        en: because he invented architecture
        ur: کیونکہ اس نے معماری ایجاد کی
      correct: false
      why:
        ar: طوّر العمارة لا اخترعها
        en: he advanced architecture, not invented
        ur: اس نے معماری کو آگے بڑھایا، ایجاد نہیں
    - text:
        ar: لأنه كان سلطانًا
        en: because he was a sultan
        ur: کیونکہ وہ سلطان تھا
      correct: false
      why:
        ar: خدم السلاطين لا كان سلطانًا
        en: he served sultans, not was one
        ur: اس نے سلطانوں کی خدمت کی، خود نہیں تھا
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: بقيت مساجده معالم إسطنبول
        en: his mosques stay Istanbul''s landmarks
        ur: اس کی مسجدیں استنبول کی نشانیاں رہیں
  - q:
      ar: من كتب عن سنان؟
      en: Who wrote about Sinan?
      ur: سنان کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو العمارة العثمانية ووثائق البناء
        en: Ottoman architecture historians and building records
        ur: عثمانی معماری کے مؤرخین اور تعمیر کے دستاویزات
      correct: true
      why:
        ar: تصلنا سيرته ووثائق أوقاف أعماله
        en: his biography and his works'' endowment records reach us
        ur: اس کی سوانح اور اس کے کاموں کے اوقاف کے دستاویزات ہم تک پہنچے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقته كتب السيرة والأوقاف
        en: his biographies and endowment records document him
        ur: اس کی سوانح اور اوقاف کے دستاویزات نے اسے ثبت کیا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنه العثمانيون والأوروبيون
        en: Ottomans and Europeans wrote of him
        ur: عثمانیوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون قبله بسبعة قرون
        en: the Abbasids were seven centuries earlier
        ur: عباسی اس سے سات صدیاں پہلے تھے
- id: kaaba
  anchor: building/kaaba
  band: scholars
  title:
    ar: الكعبة
    en: the Kaaba
    ur: کعبہ
  sixty:
    ar: 'الكعبة البيت الحرام في مسجد مكة: بناء إبراهيم وإسماعيل في الذاكرة الإسلامية، وقبلة المسلمين في صلواتهم الخمس من كلّ مكان في العالم. حولها يطوف الحجاج سبعًا
      في كلّ حجّ وعمرة، وتحمل كسوتها السوداء المطرزة بالذهب في كلّ سنة. كانت قبل الإسلام بيتًا للأصنام حتى طهّرها الفتح عام ٦٣٠، وبنيت وتوسّعت عبر القرون: إبراهيم،
      قريش، عبد الله بن الزبير، عبد الملك، العثمانيون. بقيت الكعبة مركز الأرض الإسلامية: إليها تتجه صلوات مليار مسلم في اليوم.  وهي القلب الذي تدور حوله عبادة الأمة كلها: في كل صلاة يتجه المسلم إليها، وفي كل موسم يطوف بها الحجاج، وفي كل ليلة يصلّي من حولها من جاء من أقاصي الأرض. وبقيت عبر القرون البيتَ الذي اجتمعت عليه القبائل وتنازعت عليه الملوك، حتى صار اسمها اسم الوحدة نفسه.  وحولها جُمعت المناسك كلها: الطواف والسعي والوقوف بعرفة، فهي النقطة التي تلتقي فيها الشعائر الجسدية والمعنوية في رحلة الحجيج من كل شعوب الأرض.'
    en: 'The Kaaba, the sacred House in Mecca''''s mosque: the building of Abraham and Ishmael in Islamic memory, and the Muslims'''' qibla in their five prayers
      from everywhere on earth. Around it pilgrims circle seven times in every Hajj and Umrah, and it carries its black gold-embroidered covering each year. It was
      a house of idols before Islam until the conquest purified it in 630, and it was built and expanded over the centuries: Abraham, Quraysh, Ibn al-Zubayr, Abd
      al-Malik, the Ottomans. The Kaaba stayed the centre of the Islamic earth: toward it turn the prayers of a billion Muslims each day.  It is the heart the ummah''s whole worship turns on: in every prayer the Muslim faces it, in every season the pilgrims circle it, in every night those who came from earth''s ends pray around it. Across the centuries it stayed the House tribes united over and kings contended for, until its name became the name of unity itself.'
    ur: 'کعبہ، مکہ کی مسجد میں مقدس گھر: اسلامی یادداشت میں ابراہیم اور اسماعیل کی تعمیر، اور دنیا بھر میں مسلمانوں کی پانچ نمازوں کا قبلہ۔ اس کے گرد ہر حج اور عمرے
      میں حجاج سات چکر لگاتے ہیں، اور یہ ہر سال اپنی سیاہ سنہری کڑھائی والی کسوتی پہنتی ہے۔ یہ اسلام سے پہلے بتوں کا گھر تھا جب تک کہ 630 میں فتح نے اسے پاک کیا،
      اور یہ صدیوں میں بنی اور بڑھی: ابراہیم، قریش، ابن زبیر، عبدالملک، عثمانی۔ کعبہ اسلامی زمین کا مرکز رہا: اسی طرف روزانہ ایک ارب مسلمانوں کی نمازیں مڑتی ہیں۔  یہ وہ دل ہے جس کے گرد امت کی ساری عبادت گھومتی ہے: ہر نماز میں مسلمان اسی کی طرف ہے، ہر موسم میں حجاج اس کا طواف کرتے ہیں، ہر رات دنیا کے کناروں سے آئے لوگ اس کے گرد عبادت کرتے ہیں۔ صدیوں یہ وہ گھر رہا جس پر قبائل متفق ہوئے اور بادشاہ ٹکرائے، یہاں تک کہ اس کا نام اتحاد کا نام بنا۔'
  glossary:
  - term:
      ar: البيت الحرام
      en: the sacred House
      ur: مقدس گھر
    gloss:
      ar: 'البيت الحرام الذي تتجه إليه وجوه المصلّين من كل أرض في كل صلاة'
      en: 'the sacred House toward which worshippers turn their faces from every land in every prayer'
      ur: 'وہ مقدس گھر جس کی طرف نمازی ہر زمین سے ہر نماز میں رخ کرتے ہیں'
  - term:
      ar: إبراهيم
      en: Abraham
      ur: ابراہیم
    gloss:
      ar: 'النبي الذي رفع قواعد البيت في الذاكرة الإسلامية مع ابنه'
      en: 'the prophet who raised the House''s foundations in Islamic memory, alongside his son'
      ur: 'وہ نبی جس نے اسلامی روایت میں اپنے بیٹے کے ساتھ گھر کی بنیادیں اٹھائیں'
  - term:
      ar: إسماعيل
      en: Ishmael
      ur: اسماعیل
    gloss:
      ar: 'ابنه الذي شاركه في رفع قواعد البيت في الروايات'
      en: 'his son who shared in raising the House''s foundations in the accounts'
      ur: 'اس کا بیٹا جس نے روایات کے مطابق گھر کی بنیادیں اٹھانے میں ساتھ دیا'
  - term:
      ar: القبلة
      en: the qibla
      ur: قبلہ
    gloss:
      ar: 'الاتجاه الذي يصلي إليه المسلمون من كل مكان في الأرض'
      en: 'the direction Muslims pray toward from every place on the earth'
      ur: 'وہ سمت جس کی طرف مسلمان زمین کی ہر جگہ سے نماز پڑھتے ہیں'
  - term:
      ar: الطواف
      en: the tawaf
      ur: طواف
    gloss:
      ar: 'الدوران السباعي حول البيت في كل منسك من المناسك'
      en: 'the sevenfold circling of the House, performed in every pilgrimage rite'
      ur: 'ہر حج منسک میں گھر کے گرد سات بار چکر لگانا'
  - term:
      ar: الكسوة
      en: the covering
      ur: کسوتی
    gloss:
      ar: 'كسوته السوداء المطرزة التي تُجدَّد عليه كل سنة'
      en: 'its black embroidered covering, which is renewed upon it every single year'
      ur: 'اس کا کالا کڑھائی والا پردہ جو ہر سال اس پر نیا ڈالا جاتا ہے'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الرحلة الكبرى إلى البيت التي تلزم القادر مرة في العمر'
      en: 'the great journey to the House, owed by every able Muslim once in a lifetime'
      ur: 'گھر کا عظیم سفر جو ہر قادر مسلمان پر عمر میں ایک بار ہے'
  - term:
      ar: العمرة
      en: the Umrah
      ur: عمرہ
    gloss:
      ar: 'الرحلة الصغرى إلى البيت التي تؤدَّى في أي وقت من السنة'
      en: 'the lesser journey to the House, performed at any time of the year'
      ur: 'گھر کا چھوٹا سفر جو سال کے کسی بھی وقت کیا جا سکتا ہے'
  - term:
      ar: الأصنام
      en: the idols
      ur: بت
    gloss:
      ar: 'أصنام مكة التي طهّر الفتح البيت منها إلى الأبد'
      en: 'Mecca''s idols, which the conquest cleansed the House of forever'
      ur: 'مکہ کے وہ بت جنہیں فتح نے گھر سے ہمیشہ کے لیے صاف کر دیا'
  - term:
      ar: ٦٣٠
      en: '630'
      ur: '630'
    gloss:
      ar: 'عام دخل فيه النبي البيت فاتحًا في رمضان'
      en: 'the year the Prophet entered the House as conqueror, in Ramadan'
      ur: 'وہ سال جس میں نبی نے رمضان میں فاتح بن کر گھر میں داخلہ کیا'
  - term:
      ar: المسجد الحرام
      en: the Grand Mosque
      ur: مسجدِ حرام
    gloss:
      ar: 'المسجد العظيم المحيط بالبيت في قلب مكة المكرمة'
      en: 'the great mosque surrounding the House at the heart of Mecca'
      ur: 'مکہ مکرمہ کے دل میں گھر کے گرد موجود عظیم مسجد'
  - term:
      ar: قريش
      en: the Quraysh
      ur: قریش
    gloss:
      ar: 'القبيلة التي خدمت البيت وكانت سدانته قبل الإسلام'
      en: 'the tribe that served the House and held its keys before Islam'
      ur: 'وہ قبیلہ جو اسلام سے پہلے گھر کی خدمت اور کلیدبرداری کرتا تھا'
  practice:
  - q:
      ar: من بناها في الذاكرة الإسلامية؟
      en: Who built her in Islamic memory?
      ur: اسلامی یادداشت میں اسے کس نے بنایا؟
    options:
    - text:
        ar: إبراهيم وإسماعيل
        en: Abraham and Ishmael
        ur: ابراہیم اور اسماعیل
      correct: true
      why:
        ar: يذكر المصادر بناءهما البيت
        en: the sources have them build the House
        ur: ماخذ میں انہوں نے گھر بنایا
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: الفاتح في إسطنبول لا مكة
        en: the Conqueror is in Istanbul, not Mecca
        ur: فاتح استنبول میں ہے، مکہ میں نہیں
    - text:
        ar: عبد الملك
        en: Abd al-Malik
        ur: عبدالملک
      correct: false
      why:
        ar: أعاد عبد الملك بناءها لا بناها أولًا
        en: Abd al-Malik rebuilt, not first built
        ur: عبدالملک نے دوبارہ بنایا، پہلی بار نہیں
    - text:
        ar: لا أحد؛ أزلية
        en: nobody; eternal
        ur: کوئی نہیں؛ ازلی
      correct: false
      why:
        ar: يذكر المصادر بناء إبراهيم وإسماعيل
        en: the sources name Abraham and Ishmael''s building
        ur: ماخذ ابراہیم اور اسماعیل کی تعمیر لکھتے ہیں
  - q:
      ar: ما القبلة؟
      en: What is the qibla?
      ur: قبلہ کیا ہے؟
    options:
    - text:
        ar: اتجاه الكعبة في الصلوات الخمس
        en: the Kaaba''s direction in the five prayers
        ur: پانچ نمازوں میں کعبہ کی سمت
      correct: true
      why:
        ar: تتجه إليها صلوات المسلمين في العالم
        en: the world''s Muslims'' prayers turn to her
        ur: دنیا کے مسلمانوں کی نمازیں اس کی طرف مڑتی ہیں
    - text:
        ar: اتجاه القدس دائمًا
        en: always Jerusalem''s direction
        ur: ہمیشہ بیت المقدس کی سمت
      correct: false
      why:
        ar: كانت القدس أولًا ثم الكعبة
        en: Jerusalem was first, then the Kaaba
        ur: بیت المقدس پہلے تھا، پھر کعبہ
    - text:
        ar: اتجاه الشمال
        en: the north direction
        ur: شمال کی سمت
      correct: false
      why:
        ar: القبلة إلى مكة لا الشمال
        en: the qibla is to Mecca, not north
        ur: قبلہ مکہ کی طرف ہے، شمال نہیں
    - text:
        ar: لا اتجاه
        en: no direction
        ur: کوئی سمت نہیں
      correct: false
      why:
        ar: القبلة جزء من الصلاة
        en: the qibla is part of the prayer
        ur: قبلہ نماز کا حصہ ہے
  - q:
      ar: كم يطوف الحجاج حولها؟
      en: How many times do pilgrims circle her?
      ur: حجاج اس کے گرد کتنے چکر لگاتے ہیں؟
    options:
    - text:
        ar: سبع مرات
        en: seven times
        ur: سات بار
      correct: true
      why:
        ar: يذكر المصادر سبع الدورات
        en: the sources give the seven circuits
        ur: ماخذ سات چکر دیتے ہیں
    - text:
        ar: ثلاث
        en: three
        ur: تین
      correct: false
      why:
        ar: سبع لا ثلاث في المصادر
        en: seven, not three, in the sources
        ur: ماخذ میں سات ہے، تین نہیں
    - text:
        ar: أربع عشرة
        en: fourteen
        ur: چودہ
      correct: false
      why:
        ar: سبع لا أربع عشرة
        en: seven, not fourteen
        ur: سات، چودہ نہیں
    - text:
        ar: مرة واحدة
        en: once
        ur: ایک بار
      correct: false
      why:
        ar: الطواف سبع في المصادر
        en: tawaf is seven in the sources
        ur: طواف ماخذ میں سات ہے
  - q:
      ar: ما الكسوة؟
      en: What is the covering?
      ur: کسوتی کیا ہے؟
    options:
    - text:
        ar: رداؤها الأسود المطرز بالذهب كلّ سنة
        en: her yearly black gold-embroidered covering
        ur: ہر سال اس کا سیاہ سنہری کڑھائی والا لباس
      correct: true
      why:
        ar: تتبدل سنويًّا في المصادر
        en: it changes yearly in the sources
        ur: یہ ماخذ میں ہر سال بدلتی ہے
    - text:
        ar: بابها
        en: her door
        ur: اس کا دروازہ
      correct: false
      why:
        ar: الكسوة القماش لا الباب
        en: the covering is cloth, not the door
        ur: کسوتی کپڑا ہے، دروازہ نہیں
    - text:
        ar: سورها
        en: her wall
        ur: اس کی دیوار
      correct: false
      why:
        ar: الكسوة رداء لا سور
        en: the covering is a robe, not a wall
        ur: کسوتی لباس ہے، دیوار نہیں
    - text:
        ar: قبتها
        en: her dome
        ur: اس کا گنبد
      correct: false
      why:
        ar: الكعبة مكعبة لا مقببة
        en: the Kaaba is cubic, not domed
        ur: کعبہ مکعب ہے، گنبد دار نہیں
  - q:
      ar: ماذا كانت قبل الإسلام؟
      en: What was she before Islam?
      ur: اسلام سے پہلے یہ کیا تھی؟
    options:
    - text:
        ar: بيتًا للأصنام
        en: a house of idols
        ur: بتوں کا گھر
      correct: true
      why:
        ar: يذكر المصادر أصنامها حتى الفتح
        en: the sources record her idols until the conquest
        ur: ماخذ فتح تک اس کے بت لکھتے ہیں
    - text:
        ar: مسجدًا
        en: a mosque
        ur: مسجد
      correct: false
      why:
        ar: كانت بيت أصنام لا مسجد قبل الطهارة
        en: she was an idol-house, not mosque, before purification
        ur: وہ پاک ہونے سے پہلے بتوں کا گھر تھی، مسجد نہیں
    - text:
        ar: سوقًا
        en: a market
        ur: بازار
      correct: false
      why:
        ar: كانت بيتًا دينيًّا لا سوقًا
        en: she was a sacred house, not a market
        ur: وہ مقدس گھر تھی، بازار نہیں
    - text:
        ar: مدرسة
        en: a school
        ur: مدرسہ
      correct: false
      why:
        ar: كانت بيتًا دينيًّا لا مدرسة
        en: she was a sacred house, not a school
        ur: وہ مقدس گھر تھی، مدرسہ نہیں
  - q:
      ar: متى طهّرها المسلمون؟
      en: When did Muslims purify her?
      ur: مسلمانوں نے اسے کب پاک کیا؟
    options:
    - text:
        ar: عام ٦٣٠ في الفتح
        en: in 630 at the conquest
        ur: 630 میں فتح کے وقت
      correct: true
      why:
        ar: يذكر المصادر إزالة الأصنام ذلك العام
        en: the sources record the idols'' removal that year
        ur: ماخذ اس سال بتوں کے ہٹائے جانے کا ذکر کرتے ہیں
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة لا الفتح
        en: that is the Hijra year, not the conquest
        ur: یہ ہجرت کا سال ہے، فتح کا نہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام استعادة القدس لا مكة
        en: that is Jerusalem''s recovery, not Mecca
        ur: یہ بیت المقدس کی واپسی کا سال ہے، مکہ کا نہیں
    - text:
        ar: لم تُطهَّر
        en: she was never purified
        ur: اسے کبھی پاک نہیں کیا گیا
      correct: false
      why:
        ar: طهّرها الفتح في المصادر
        en: the sources have the conquest purify her
        ur: ماخذ میں فتح نے اسے پاک کیا
  - q:
      ar: من أعاد بناءها؟
      en: Who rebuilt her?
      ur: اسے دوبارہ کس نے بنایا؟
    options:
    - text:
        ar: قريش وعبد الله بن الزبير وعبد الملك
        en: Quraysh, Ibn al-Zubayr and Abd al-Malik
        ur: قریش، ابن زبیر اور عبدالملک
      correct: true
      why:
        ar: تذكر المصادر بناها المتعددين عبر القرون
        en: the sources name her many builders over centuries
        ur: ماخذ صدیوں میں اس کے متعدد بنانے والوں کا ذکر کرتے ہیں
    - text:
        ar: محمد الفاتح فقط
        en: only Mehmed the Conqueror
        ur: صرف محمد فاتح
      correct: false
      why:
        ar: لم يبنها الفاتح
        en: the Conqueror did not build her
        ur: فاتح نے اسے نہیں بنایا
    - text:
        ar: لا أحد؛ واحدة فقط
        en: nobody; built once only
        ur: کوئی نہیں؛ صرف ایک بار بنی
      correct: false
      why:
        ar: بنيت مرارًا في المصادر
        en: the sources have her built repeatedly
        ur: ماخذ میں وہ بار بار بنی
    - text:
        ar: البريطانيون
        en: the British
        ur: برطانوی
      correct: false
      why:
        ar: لم يبنها الأوروبيون
        en: Europeans did not build her
        ur: یورپیوں نے اسے نہیں بنایا
  - q:
      ar: أين تقع؟
      en: Where does she stand?
      ur: یہ کہاں واقع ہے؟
    options:
    - text:
        ar: في المسجد الحرام بمكة
        en: in Mecca''s Grand Mosque
        ur: مکہ کی مسجدِ حرام میں
      correct: true
      why:
        ar: تقف في قلب المسجد في المصادر
        en: the sources place her at the mosque''s heart
        ur: ماخذ اسے مسجد کے دل میں رکھتے ہیں
    - text:
        ar: في المدينة
        en: in Medina
        ur: مدینہ میں
      correct: false
      why:
        ar: الكعبة في مكة لا المدينة
        en: the Kaaba is in Mecca, not Medina
        ur: کعبہ مکہ میں ہے، مدینہ میں نہیں
    - text:
        ar: في القدس
        en: in Jerusalem
        ur: بیت المقدس میں
      correct: false
      why:
        ar: الكعبة في مكة لا القدس
        en: the Kaaba is in Mecca, not Jerusalem
        ur: کعبہ مکہ میں ہے، بیت المقدس میں نہیں
    - text:
        ar: في صنعاء
        en: in Sanaa
        ur: صنعا میں
      correct: false
      why:
        ar: الكعبة في مكة لا اليمن
        en: the Kaaba is in Mecca, not Yemen
        ur: کعبہ مکہ میں ہے، یمن میں نہیں
  - q:
      ar: لماذا تهمّ الكعبة؟
      en: Why does the Kaaba matter?
      ur: کعبہ کیوں اہم ہے؟
    options:
    - text:
        ar: لأنها قبلة مليار مسلم ومركز الحج
        en: because she is a billion Muslims'' qibla and the Hajj centre
        ur: کیونکہ یہ ایک ارب مسلمانوں کا قبلہ اور حج کا مرکز ہے
      correct: true
      why:
        ar: تتجه إليها صلوات اليوم كلّه
        en: every day''s prayers turn to her
        ur: ہر دن کی نمازیں اس کی طرف مڑتی ہیں
    - text:
        ar: لأنها أكبر بناء في العالم
        en: because she is the world''s largest building
        ur: کیونکہ یہ دنیا کی سب سے بڑی عمارت ہے
      correct: false
      why:
        ar: أهميتها دينية لا حجمية
        en: her importance is religious, not size
        ur: اس کی اہمیت مذہبی ہے، حجمی نہیں
    - text:
        ar: لأنها أول بناء في التاريخ
        en: because she is history''s first building
        ur: کیونکہ یہ تاریخ کی پہلی عمارت ہے
      correct: false
      why:
        ar: سبقتها مبانٍ قديمة كثيرة
        en: many older buildings predate her
        ur: اس سے پہلے بہت سی قدیم عمارتیں تھیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: إليها تتجه صلوات المسلمين
        en: Muslims'' prayers turn to her
        ur: مسلمانوں کی نمازیں اس کی طرف مڑتی ہیں
  - q:
      ar: من كتب عن الكعبة؟
      en: Who wrote about the Kaaba?
      ur: کعبہ کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو مكة من الأزرقي إلى الرحّالة
        en: Mecca''s historians from al-Azraqi to the travellers
        ur: ازرقی سے سیاحوں تک مکہ کے مؤرخین
      correct: true
      why:
        ar: تصلنا تاريخ مكة ووصف الرحّالة
        en: Mecca''s history and travellers'' accounts reach us
        ur: مکہ کی تاریخ اور سیاحوں کی وصف ہم تک پہنچی
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تذكرها كتب التاريخ والسيرة
        en: history and biography books name her
        ur: تاریخ اور سیر کی کتابیں اس کا ذکر کرتی ہیں
    - text:
        ar: الأوروبيون فقط
        en: only Europeans
        ur: صرف یورپی
      correct: false
      why:
        ar: كتب المسلمون عنها قبل أوروبا بقرون
        en: Muslims wrote of her centuries before Europe
        ur: مسلمانوں نے یورپ سے صدیوں پہلے لکھا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنها مؤرخو الإسلام
        en: Islam''s historians wrote of her
        ur: اسلام کے مؤرخین نے اس کے بارے میں لکھا
- id: dome-of-the-rock
  anchor: building/dome-of-the-rock
  band: scholars
  title:
    ar: قبة الصخرة
    en: the Dome of the Rock
    ur: گنبدِ صخرہ
  sixty:
    ar: 'قبة الصخرة في القدس: أقدم بناء إسلامي قائم في العالم، شيّده الخليفة الأموي عبد الملك بن مروان عام ٦٩١ فوق الصخرة المقدسة في الحرم الشريف. ثمانية أضلاع وقبة
      ذهبية وفسيفساء زرقاء ونقوش كوفية تحمل أقدم نقش إسلامي معمار. رمّمها العثمانيون بالبلاط الإزنيقي في القرن السادس عشر، وبقيت أيقونة القدس: قبة ذهبية فوق المدينة
      القديمة يعرفها كلّ مسلم في العالم.  وهي أول روائع العمارة الإسلامية وأقدمها بقاءً: مثمّنة تقف على ربّوة القدس منذ ألف وثلاثمائة عام، تروي أن الفن الإسلامي بدأ من نصٍّ ونور لا من تمثال.  وعلى جدرانها كُتبت أقدم النصوص الإسلامية في العمارة: آيات توحيد وعبادة، فصارت المبنى نفسه إعلانًا عن الدين الجديد في قلب العالم القديم.  ومن جملة الفن الإسلامي يبقى موضعها مميزًا: لا صحن ولا مآذن بل قبة فوق صخرة، كأنها أيقونة البدايات — أول بناء أعلن الإسلام للعالم بأنه قد جاء ليقيم ويبدع.'
    en: 'The Dome of the Rock in Jerusalem: the world''''s oldest standing Islamic building, raised by the Umayyad caliph Abd al-Malik ibn Marwan in 691 over the
      sacred rock on the Noble Sanctuary. Eight sides, a golden dome, blue mosaics and Kufic inscriptions carrying architecture''''s oldest Islamic text. The Ottomans
      restored her with Iznik tile in the sixteenth century, and she stayed Jerusalem''''s icon: a golden dome over the Old City every Muslim in the world knows.  It is the first and oldest-surviving masterpiece of Islamic architecture: an octagon standing on Jerusalem''s height for thirteen hundred years, telling that Islamic art began from text and light, not statue.  Its Kufic band is architecture''s oldest Islamic inscription, a declaration of oneness written in gold on blue, and under its dome pilgrims and prayers have met since the seventh century.'
    ur: 'بیت المقدس میں گنبدِ صخرہ: دنیا کی قدیم ترین کھڑی اسلامی عمارت، جسے اموی خلیفہ عبدالملک بن مروان نے 691 میں حرم شریف کی مقدس چٹان پر اٹھایا۔ آٹھ اضلاع، سنہری
      گنبد، نیلی موزائک اور کوفی نقش جو معماری کا قدیم ترین اسلامی متن رکھتے ہیں۔ عثمانیوں نے سولہویں صدی میں ازنک ٹائلوں سے اس کی مرمت کی، اور یہ بیت المقدس کی علامت
      رہی: پرانے شہر پر سنہری گنبد جسے دنیا کا ہر مسلمان جانتا ہے۔  یہ اسلامی فنِ تعمیر کا پہلا اور قدیم ترین بچا ہوا شاہکار ہے: تیرہ سو سال سے بیت المقدس کی بلندی پر کھڑا ایک ہشت پہلو، جو بتاتا ہے کہ اسلامی فن متن اور روشنی سے شروع ہوا، مورتی سے نہیں۔  اس کا کوفی کتبہ فنِ تعمیر کا قدیم ترین اسلامی متن ہے — نیلے پر سنہری توحید کا اعلان — اور اس کے گنبد تلے زائر اور نمازیاں ساتویں صدی سے ملتے آئے ہیں۔'
  glossary:
  - term:
      ar: الصخرة
      en: the Rock
      ur: چٹان
    gloss:
      ar: 'الصخرة التي يقوم عليها البناء في قلب الحرم القدسي'
      en: 'the rock the building stands upon, in the heart of the sanctuary'
      ur: 'وہ چٹان جس پر حرم کے دل میں عمارت کھڑی ہے'
  - term:
      ar: عبد الملك
      en: Abd al-Malik
      ur: عبدالملک
    gloss:
      ar: 'الخليفة الأموي الذي أقامها سنة ٦٩١م فوق الصخرة'
      en: 'the Umayyad caliph who raised it over the Rock in the year 691'
      ur: 'اموی خلیفہ جس نے اسے 691ء میں چٹان کے اوپر تعمیر کیا'
  - term:
      ar: ٦٩١
      en: '691'
      ur: '691'
    gloss:
      ar: 'سنة البناء في عهد عبد الملك بن مروان الأموي الخامس'
      en: 'the building year under the fifth Umayyad caliph, Abd al-Malik'
      ur: 'پانچویں اموی خلیفہ عبدالملک کے عہد میں تعمیر کا سال'
  - term:
      ar: الحرم الشريف
      en: the Noble Sanctuary
      ur: حرم شریف
    gloss:
      ar: 'الحرم الذي تقوم فيه مع المسجد الأقصى فوق جبل بيت المقدس'
      en: 'the sanctuary it stands in with al-Aqsa, on the mount of Jerusalem'
      ur: 'حرم جس میں یہ اقصیٰ کے ساتھ بیت المقدس کے پہاڑ پر قائم ہے'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة التي بناها في مطلع عهد الإسلام الأول'
      en: 'the dynasty that built it in Islam''s very first age'
      ur: 'وہ خاندان جس نے اسلام کے بالکل ابتدائی زمانے میں اسے بنایا'
  - term:
      ar: الفسيفساء
      en: the mosaics
      ur: موزائک
    gloss:
      ar: 'زخارفها الزجاجية القديمة التي بقيت منذ بنائها إلى اليوم'
      en: 'its ancient glass mosaics, which have survived since its building to this day'
      ur: 'اس کی قدیم شیشے کی خوبصورتیاں جو تعمیر سے آج تک باقی ہیں'
  - term:
      ar: الكوفية
      en: the Kufic
      ur: کوفی
    gloss:
      ar: 'الخط العربي المبكر الذي كُتبت به نقوشها الشهيرة'
      en: 'the early Arabic script its famous inscriptions were written in'
      ur: 'وہ ابتدائی عربی خط جس میں اس کی مشہور نقوش لکھی گئیں'
  - term:
      ar: الإزنيقي
      en: the Iznik
      ur: ازنک
    gloss:
      ar: 'قراميدها العثمانية التي جدّدها السلطان سليمان القانوني في عهده'
      en: 'its Ottoman tiles, which Sultan Suleiman the Lawgiver restored in his era'
      ur: 'اس کی عثمانی ٹائلیں جنہیں سلطان سلیمان قانونی نے اپنے عہد میں تازہ کیا'
  - term:
      ar: القدس
      en: Jerusalem
      ur: بیت المقدس
    gloss:
      ar: 'مدينتها التي حفظتها منذ الفتح الإسلامي إلى يومنا'
      en: 'its city, which has kept it since the Islamic conquest until today'
      ur: 'اس کا شہر جس نے اسلامی فتح کے بعد سے آج تک اسے قائم رکھا'
  - term:
      ar: القبة الذهبية
      en: the golden dome
      ur: سنہری گنبد
    gloss:
      ar: 'قبتها الذهبية التي تُرى من بعيد فوق سور المدينة'
      en: 'its golden dome, seen from afar above the city''s walls'
      ur: 'اس کا سنہری گنبد جو شہر کی دیواروں کے اوپر دور سے دکھائی دیتا ہے'
  - term:
      ar: الثمانية
      en: the octagon
      ur: آٹھ
    gloss:
      ar: 'شكلها الثماني الفريد الذي لا نظير له في عمارة الإسلام'
      en: 'its unique eightfold shape, unlike anything else in Islamic architecture'
      ur: 'اسلامی تعمیرات میں اس کی منفرد ہشت پہلو شکل جس کی کوئی مثل نہیں'
  - term:
      ar: النقش
      en: the inscription
      ur: نقش
    gloss:
      ar: 'نصّها الكوفي — أقدم نقش باقٍ في عمارة إسلامية'
      en: 'its Kufic text — the oldest surviving inscription in any Islamic building'
      ur: 'اس کا کوفی متن — کسی بھی اسلامی عمارت میں باقی رہنے والا قدیم ترین نقوش'
  practice:
  - q:
      ar: من بناها؟
      en: Who built her?
      ur: اسے کس نے بنایا؟
    options:
    - text:
        ar: الخليفة الأموي عبد الملك ٦٩١
        en: the Umayyad caliph Abd al-Malik in 691
        ur: اموی خلیفہ عبدالملک نے 691 میں
      correct: true
      why:
        ar: تنسب المصادر بناءها إلى عبد الملك
        en: the sources credit her building to Abd al-Malik
        ur: ماخذ اس کی تعمیر عبدالملک سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعدها بخمسة قرون
        en: Saladin came five centuries later
        ur: صلاح الدین پانچ صدیوں بعد آیا
    - text:
        ar: سليمان القانوني
        en: Suleiman the Magnificent
        ur: سلیمان قانونی
      correct: false
      why:
        ar: رمّمها العثمانيون لا بنوها
        en: the Ottomans restored, not built, her
        ur: عثمانیوں نے اس کی مرمت کی، تعمیر نہیں
    - text:
        ar: الصهاينة
        en: the Zionists
        ur: صیہونی
      correct: false
      why:
        ar: بنيت إسلاميًّا في القرن السابع
        en: she was built Islamically in the seventh century
        ur: یہ ساتویں صدی میں اسلامی طور پر بنی
  - q:
      ar: على ماذا قامت؟
      en: What does she stand over?
      ur: یہ کس پر قائم ہے؟
    options:
    - text:
        ar: الصخرة المقدسة في الحرم الشريف
        en: the sacred rock on the Noble Sanctuary
        ur: حرم شریف کی مقدس چٹان پر
      correct: true
      why:
        ar: تقف فوق الحجر في المصادر
        en: the sources place her over the stone
        ur: ماخذ اسے پتھر پر رکھتے ہیں
    - text:
        ar: قبر النبي
        en: the Prophet''s grave
        ur: نبی کی قبر
      correct: false
      why:
        ar: الصخرة في القدس لا المدينة
        en: the Rock is in Jerusalem, not Medina
        ur: چٹان بیت المقدس میں ہے، مدینہ میں نہیں
    - text:
        ar: مقبرة أموية
        en: an Umayyad tomb
        ur: اموی مقبرہ
      correct: false
      why:
        ar: الصخرة حجر مقدس لا قبر
        en: the Rock is a sacred stone, not a tomb
        ur: چٹان مقدس پتھر ہے، قبر نہیں
    - text:
        ar: جبل
        en: a mountain
        ur: پہاڑ
      correct: false
      why:
        ar: الصخرة حجر داخل الحرم
        en: the Rock is a stone inside the Sanctuary
        ur: چٹان حرم کے اندر پتھر ہے
  - q:
      ar: ما شكلها؟
      en: What is her shape?
      ur: اس کی شکل کیا ہے؟
    options:
    - text:
        ar: ثمانية أضلاع وقبة ذهبية
        en: eight sides and a golden dome
        ur: آٹھ اضلاع اور سنہری گنبد
      correct: true
      why:
        ar: يذكر المصادر ثمانيتها وقبتها
        en: the sources name her octagon and dome
        ur: ماخذ اس کے آٹھ پہلو اور گنبد لکھتے ہیں
    - text:
        ar: مربعة بلا قبة
        en: square without dome
        ur: چوکور بغیر گنبد
      correct: false
      why:
        ar: لها ثمانية أضلاع وقبة
        en: she has eight sides and a dome
        ur: اس کے آٹھ پہلو اور گنبد ہیں
    - text:
        ar: برج عالٍ
        en: a tall tower
        ur: اونچا برج
      correct: false
      why:
        ar: هي قبة لا برج
        en: she is a dome, not a tower
        ur: یہ گنبد ہے، برج نہیں
    - text:
        ar: كنيسة صليبية
        en: a cross church
        ur: صلیب کلیسا
      correct: false
      why:
        ar: بنيت إسلاميًّا ثمانية الأضلاع
        en: she was built Islamically, octagonal
        ur: یہ اسلامی طور پر آٹھ پہلو میں بنی
  - q:
      ar: ما نقوشها؟
      en: What are her inscriptions?
      ur: اس کے نقش کیا ہیں؟
    options:
    - text:
        ar: كوفية تحمل أقدم نقش إسلامي معماري
        en: Kufic carrying the oldest architectural Islamic text
        ur: کوفی، معماری کا قدیم ترین اسلامی متن رکھتے ہوئے
      correct: true
      why:
        ar: تذكر المصادر كتابتها المبكرة
        en: the sources record her early writing
        ur: ماخذ اس کی ابتدائی تحریر لکھتے ہیں
    - text:
        ar: لاتينية
        en: Latin
        ur: لاطینی
      correct: false
      why:
        ar: نقوشها كوفية عربية
        en: her inscriptions are Arabic Kufic
        ur: اس کے نقش عربی کوفی ہیں
    - text:
        ar: صينية
        en: Chinese
        ur: چینی
      correct: false
      why:
        ar: نقوشها عربية لا صينية
        en: her inscriptions are Arabic, not Chinese
        ur: اس کے نقش عربی ہیں، چینی نہیں
    - text:
        ar: لا نقوش
        en: no inscriptions
        ur: کوئی نقش نہیں
      correct: false
      why:
        ar: لها كتابة كوفية قديمة
        en: she has old Kufic writing
        ur: اس میں پرانی کوفی تحریر ہے
  - q:
      ar: من رمّمها؟
      en: Who restored her?
      ur: اس کی مرمت کس نے کی؟
    options:
    - text:
        ar: العثمانيون بالبلاط الإزنيقي
        en: the Ottomans with Iznik tile
        ur: عثمانیوں نے ازنک ٹائلوں سے
      correct: true
      why:
        ar: تذكر المصادر ترميمها العثماني
        en: the sources record her Ottoman restoration
        ur: ماخذ اس کی عثمانی مرمت لکھتے ہیں
    - text:
        ar: الصليبيون
        en: the Crusaders
        ur: صلیبی
      correct: false
      why:
        ar: رمّمها العثمانيون لا الصليبيون
        en: the Ottomans restored her, not Crusaders
        ur: عثمانیوں نے مرمت کی، صلیبیوں نے نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: تذكر المصادر ترميمها
        en: the sources record her restoration
        ur: ماخذ اس کی مرمت لکھتے ہیں
    - text:
        ar: البريطانيون
        en: the British
        ur: برطانوی
      correct: false
      why:
        ar: الترميم عثماني في المصادر
        en: the restoration is Ottoman in the sources
        ur: مرمت ماخذ میں عثمانی ہے
  - q:
      ar: في أيّ قرن بُنيت؟
      en: In which century was she built?
      ur: یہ کس صدی میں بنی؟
    options:
    - text:
        ar: السابع الميلادي
        en: the seventh century
        ur: ساتویں صدی
      correct: true
      why:
        ar: بنيت ٦٩١ في القرن السابع
        en: she was built in 691, the seventh century
        ur: یہ 691 میں ساتویں صدی میں بنی
    - text:
        ar: العاشر
        en: the tenth
        ur: دسویں
      correct: false
      why:
        ar: بنيت قبل العاشر بثلاثة قرون
        en: she was built three centuries before the tenth
        ur: یہ دسویں سے تین صدیاں پہلے بنی
    - text:
        ar: السادس عشر
        en: the sixteenth
        ur: سولہویں
      correct: false
      why:
        ar: ذلك عصر ترميمها لا بنائها
        en: that is her restoration era, not building
        ur: یہ اس کی مرمت کا دور ہے، تعمیر کا نہیں
    - text:
        ar: الأول
        en: the first
        ur: پہلی
      correct: false
      why:
        ar: بنيت في الإسلام لا قبله
        en: she was built in Islam''s era, not before
        ur: یہ اسلام کے دور میں بنی، اس سے پہلے نہیں
  - q:
      ar: ما أقدمية بنائها؟
      en: What is her age''s distinction?
      ur: اس کی قدامت کی کیا خاصیت ہے؟
    options:
    - text:
        ar: أقدم بناء إسلامي قائم
        en: the oldest standing Islamic building
        ur: قدیم ترین کھڑی اسلامی عمارت
      correct: true
      why:
        ar: يذكر المصادر أقدميتها الإسلامية
        en: the sources name her Islamic seniority
        ur: ماخذ اس کی اسلامی قدامت لکھتے ہیں
    - text:
        ar: أقدم بناء في العالم
        en: the world''s oldest building
        ur: دنیا کی قدیم ترین عمارت
      correct: false
      why:
        ar: أقدم إسلامي لا مطلقًا
        en: oldest Islamic, not absolute
        ur: قدیم ترین اسلامی ہے، مطلق نہیں
    - text:
        ar: أحدث بناء إسلامي
        en: the newest Islamic building
        ur: تازہ ترین اسلامی عمارت
      correct: false
      why:
        ar: هي أقدم لا أحدث
        en: she is oldest, not newest
        ur: یہ قدیم ترین ہے، تازہ نہیں
    - text:
        ar: لا تميز
        en: no distinction
        ur: کوئی خاصیت نہیں
      correct: false
      why:
        ar: تعد أقدم بناء إسلامي قائم
        en: she is counted the oldest standing Islamic building
        ur: یہ قدیم ترین کھڑی اسلامی عمارت شمار ہوتی ہے
  - q:
      ar: لماذا تهمّ؟
      en: Why does she matter?
      ur: یہ کیوں اہم ہے؟
    options:
    - text:
        ar: لأنها أيقونة القدس والإسلام المعماري
        en: because she is Jerusalem''s icon and Islam''s architecture
        ur: کیونکہ یہ بیت المقدس اور اسلامی معماری کی علامت ہے
      correct: true
      why:
        ar: بقيت معلمها منذ ٦٩١
        en: she stayed her landmark since 691
        ur: یہ 691 سے اس کی نشانی رہی
    - text:
        ar: لأنها أكبر مسجد
        en: because she is the largest mosque
        ur: کیونکہ یہ سب سے بڑی مسجد ہے
      correct: false
      why:
        ar: أهميتها تاريخية ورمزية لا حجمية
        en: her importance is historic and symbolic, not size
        ur: اس کی اہمیت تاریخی اور علامتی ہے، حجمی نہیں
    - text:
        ar: لأنها في مكة
        en: because she is in Mecca
        ur: کیونکہ یہ مکہ میں ہے
      correct: false
      why:
        ar: هي في القدس لا مكة
        en: she is in Jerusalem, not Mecca
        ur: یہ بیت المقدس میں ہے، مکہ میں نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: يعرفها كلّ مسلم في العالم
        en: every Muslim in the world knows her
        ur: دنیا کا ہر مسلمان اسے جانتا ہے
  - q:
      ar: من كتب عنها؟
      en: Who wrote about her?
      ur: اس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو القدس والعمارة الإسلامية
        en: Jerusalem''s historians and Islamic architecture scholars
        ur: بیت المقدس کے مؤرخین اور اسلامی معماری کے علماء
      correct: true
      why:
        ar: تصلنا وصفها من الرحّالة والمؤرخين
        en: her accounts reach us from travellers and historians
        ur: سیاحوں اور مؤرخین سے اس کی وصف پہنچی
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقتها الكتب والنقوش
        en: books and inscriptions document her
        ur: کتابوں اور نقشوں نے اسے ثبت کیا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنها المسلمون والأوروبيون
        en: Muslims and Europeans wrote of her
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العباسيون فقط
        en: only the Abbasids
        ur: صرف عباسی
      correct: false
      why:
        ar: بنيت أمويًّا وكتب عنها كلّ العصور
        en: she was Umayyad-built and every age wrote of her
        ur: یہ اموی تعمیر ہے اور ہر دور نے لکھا
  - q:
      ar: في أيّ سنة أُنجزت القبة؟
      en: In which year was the Dome completed?
      ur: گنبد کس سال مکمل ہوئی؟
    options:
    - text:
        ar: عام ٦٩١
        en: in 691
        ur: 691 میں
      correct: true
      why:
        ar: تذكر المصادر اكتمالها نحو ٦٩١
        en: the sources date her completion about 691
        ur: ماخذ اس کی تکمیل تقریباً 691 لکھتے ہیں
    - text:
        ar: عام ٧١٥
        en: in 715
        ur: 715 میں
      correct: false
      why:
        ar: ذلك عام الجامع الأموي لا القبة
        en: that is the Umayyad Mosque''s year, not hers
        ur: یہ اموی جامع کا سال ہے، اس کا نہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام استعادة القدس لا بنائها
        en: that is Jerusalem''s recovery, not her building
        ur: یہ بیت المقدس کی واپسی کا سال ہے، تعمیر کا نہیں
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ذلك عام الهجرة قبل بنائها
        en: that is the Hijra year, before her building
        ur: یہ ہجرت کا سال ہے، تعمیر سے پہلے
- id: al-aqsa
  anchor: building/al-aqsa-mosque
  band: scholars
  title:
    ar: الأقصى
    en: al-Aqsa
    ur: اقصیٰ
  sixty:
    ar: 'المسجد الأقصى في القدس: ثالث الحرمين والقبلة الأولى للمسلمين ومسرى النبي في الذاكرة الإسلامية. بدأ بناءه الأمويون في أواخر القرن السابع، وأعاده العباسيون
      والفاطميون بعد الزلازل، ورمّمه صلاح الدين بعد استعادة المدينة ١١٨٧. احتلّه الصليبيون ١٠٩٩ فجعلوه قصرًا وأسطبلًا حتى عاد مسجدًا بعد ثمانية وثمانين عامًا. بقي
      الأقصى قلب الحرم الشريف: قاعة صلاة تحمل ستة قرون من العمارة الإسلامية وذاكرة المدينة المقدسة.  ومن الأقصى تعلّم المسلمون أن المسجد ذاكرة حيّة: بناء يتجدد بعد كل زلزال وحريق، واسم يجمع القبلة والإسراء والحرم في لفظة واحدة.  وبقي الأقصى مدرسة الأجيال: تحته أقبية الأمويين، وفوقه قبة العباسيين، وفي ساحاته ذاكرة كل عصر مرّ بالقدس.  فالأقصى ليس حجارة فقط بل درس: كيف يُحمى المقدّس بالبناء والدعاء والذاكرة، وكيف يجتمع في مكان واحد قبلتان وأنبياء وأجيال من المصلّين.'
    en: 'Al-Aqsa mosque in Jerusalem: the third sanctuary, the Muslims'''' first qibla and the Prophet''''s night journey in Islamic memory. The Umayyads began her
      building in the late seventh century, the Abbasids and Fatimids rebuilt her after earthquakes, and Saladin restored her after retaking the city in 1187. Crusaders
      seized her in 1099, making her palace and stable until she became a mosque again after eighty-eight years. Al-Aqsa stayed the heart of the Noble Sanctuary:
      a prayer hall carrying six centuries of Islamic architecture and the holy city''''s memory.  From al-Aqsa Muslims learn that a mosque is living memory: a building renewed after every earthquake and fire, and a name gathering qibla, night journey and sanctuary in one word.  Beneath it lie Umayyad foundations, above it the Abbasid dome, and in its courts the memory of every age that passed through Jerusalem — a school of generations, not only a sanctuary.'
    ur: 'بیت المقدس میں مسجدِ اقصیٰ: تیسرا حرم، مسلمانوں کا پہلا قبلہ اور اسلامی یادداشت میں نبی کا معراج۔ امویوں نے ساتویں صدی کے آخر میں اس کی تعمیر شروع کی، عباسیوں
      اور فاطمیوں نے زلزلوں کے بعد اسے دوبارہ بنایا، اور صلاح الدین نے 1187 میں شہر واپس لینے کے بعد اس کی مرمت کی۔ صلیبیوں نے 1099 میں اسے لے کر محل اور اصطبل بنایا
      جب تک کہ اٹھاسی سال بعد وہ مسجد بنی۔ اقصیٰ حرم شریف کا دل رہی: نماز کا ہال جس میں چھ صدیوں کی اسلامی معماری اور مقدس شہر کی یادداشت ہے۔  اقصیٰ سے مسلمان سیکھتے ہیں کہ مسجد زندہ یادداشت ہے: ہر زلزلے اور آگ کے بعد پھر کھڑی ہونے والی عمارت، اور وہ نام جو قبلہ، معراج اور حرم کو ایک لفظ میں جمع کرتا ہے۔  اس کے نیچے اموی بنیادیں ہیں، اوپر عباسی گنبد، اور اس کے ساحوں میں ہر اس دور کی یاد ہے جو بیت المقدس سے گزرا — نسلوں کا مدرسہ، صرف حرم نہیں۔'
  glossary:
  - term:
      ar: الأقصى
      en: al-Aqsa
      ur: اقصیٰ
    gloss:
      ar: 'المسجد الذي كان القبلة الأولى للمسلمين قبل مكة'
      en: 'the mosque that was the Muslims'' first qibla, before Mecca'
      ur: 'وہ مسجد جو مسلمانوں کا پہلا قبلہ تھی، مکہ سے پہلے'
  - term:
      ar: ثالث الحرمين
      en: the third sanctuary
      ur: تیسرا حرم
    gloss:
      ar: 'ثالث المساجد التي تشدّ إليها الرحال عند المسلمين'
      en: 'the third of the mosques journeys are made to, in Islamic teaching'
      ur: 'تیسری مسجد جن کی طرف سفر کیے جاتے ہیں، اسلامی تعلیم میں'
  - term:
      ar: القبلة الأولى
      en: the first qibla
      ur: پہلا قبلہ
    gloss:
      ar: 'الاتجاه الذي صلّى إليه النبي أولًا في المدينة'
      en: 'the direction the Prophet first prayed toward while in Medina'
      ur: 'وہ سمت جس کی طرف نبی نے مدینہ میں پہلے نماز پڑھی'
  - term:
      ar: المسرى
      en: the night journey
      ur: معراج
    gloss:
      ar: 'رحلة الإسراء الليلية التي انتهت عند مسجدها'
      en: 'the night journey of the Isra, which ended at its mosque'
      ur: 'معراج کا رات کا سفر جس کا اختتام اس کی مسجد پر ہوا'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة التي بدأت بناءه في عهدها الأول'
      en: 'the dynasty that began its building in its early reign'
      ur: 'وہ خاندان جس نے اپنے ابتدائی عہد میں اس کی تعمیر شروع کی'
  - term:
      ar: العباسيون
      en: the Abbasids
      ur: عباسی
    gloss:
      ar: 'السلالة التي أعادت بناءه بعد الزلازل المتكررة التي هدمته'
      en: 'the dynasty that rebuilt it after the repeated earthquakes that razed it'
      ur: 'وہ خاندان جس نے متواتر زلزلوں کے بعد اسے از سر نو کھڑا کیا جنہوں نے اسے ڈھایا'
  - term:
      ar: الفاطميون
      en: the Fatimids
      ur: فاطمی
    gloss:
      ar: 'السلالة التي رمّمته وجدّدته في عصرها'
      en: 'the dynasty that restored and renewed it in its era'
      ur: 'وہ خاندان جس نے اپنے زمانے میں اس کی مرمت اور تجدید کی'
  - term:
      ar: ١٠٩٩
      en: '1099'
      ur: '1099'
    gloss:
      ar: 'سنة سقوط القدس في أيدي الصليبيين'
      en: 'the year Jerusalem fell into the hands of the Crusaders'
      ur: 'وہ سال جس میں بیت المقدس صلیبیوں کے ہاتھ گر گیا'
  - term:
      ar: ١١٨٧
      en: '1187'
      ur: '1187'
    gloss:
      ar: 'سنة استعادته من الصليبيين مع صلاح الدين'
      en: 'the year of its recovery from the Crusaders with Saladin'
      ur: 'صلاح الدین کے ساتھ صلیبیوں سے اس کی واپسی کا سال'
  - term:
      ar: الزلازل
      en: the earthquakes
      ur: زلزلے
    gloss:
      ar: 'الكوارث الطبيعية التي هدمته وأعيد بناؤه بعدها مرات'
      en: 'the natural disasters that razed it and saw it rebuilt, time and again'
      ur: 'قدرتی آفتیں جنہوں نے اسے ڈھایا اور جن کے بعد یہ بار بار تعمیر ہوا'
  - term:
      ar: الحرم الشريف
      en: the Noble Sanctuary
      ur: حرم شریف
    gloss:
      ar: 'الحرم الواسع الذي يقوم فيه المسجد والقبة معًا'
      en: 'the wide sanctuary that the mosque and the dome stand in together'
      ur: 'وہ وسیع حرم جس میں مسجد اور گنبد دونوں قائم ہیں'
  - term:
      ar: صلاح الدين
      en: Saladin
      ur: صلاح الدین
    gloss:
      ar: 'الذي أعاد الأقصى إلى المسلمين بعد تحرير القدس'
      en: 'he who returned al-Aqsa to the Muslims after freeing Jerusalem'
      ur: 'وہ جس نے بیت المقدس کی آزادی کے بعد اقصیٰ مسلمانوں کو لوٹائی'
  practice:
  - q:
      ar: ما رتبة الأقصى في الحرمين؟
      en: What is al-Aqsa''s rank among sanctuaries?
      ur: حرموں میں اقصیٰ کا درجہ کیا ہے؟
    options:
    - text:
        ar: ثالث الحرمين
        en: the third sanctuary
        ur: تیسرا حرم
      correct: true
      why:
        ar: يذكر الاسم مكانتها بعد مكة والمدينة
        en: the name ranks her after Mecca and Medina
        ur: نام اسے مکہ اور مدینہ کے بعد رکھتا ہے
    - text:
        ar: أول الحرمين
        en: the first sanctuary
        ur: پہلا حرم
      correct: false
      why:
        ar: أولهما مكة لا القدس
        en: the first is Mecca, not Jerusalem
        ur: پہلا مکہ ہے، بیت المقدس نہیں
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: ثلاثة حرام لا أربعة
        en: three sanctuaries, not four
        ur: تین حرم ہیں، چار نہیں
    - text:
        ar: لا رتبة
        en: no rank
        ur: کوئی درجہ نہیں
      correct: false
      why:
        ar: يذكر الاسم ثالث الحرمين
        en: the name gives her the third sanctuary
        ur: نام اسے تیسرا حرم دیتا ہے
  - q:
      ar: ما القبلة الأولى؟
      en: What was the first qibla?
      ur: پہلا قبلہ کیا تھا؟
    options:
    - text:
        ar: الأقصى قبل التحويل إلى مكة
        en: al-Aqsa before the change to Mecca
        ur: مکہ میں تبدیلی سے پہلے اقصیٰ
      correct: true
      why:
        ar: تذكر المصادر الصلاة إليه أولًا
        en: the sources have prayer to her first
        ur: ماخذ میں نماز پہلے اس کی طرف ہے
    - text:
        ar: الكعبة من البداية
        en: the Kaaba from the start
        ur: شروع سے کعبہ
      correct: false
      why:
        ar: كان الأقصى أولًا ثم الكعبة
        en: al-Aqsa was first, then the Kaaba
        ur: اقصیٰ پہلے تھا، پھر کعبہ
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: لم تكن المدينة قبلة قط
        en: Medina was never the qibla
        ur: مدینہ کبھی قبلہ نہیں تھا
    - text:
        ar: لا قبلة
        en: no qibla
        ur: کوئی قبلہ نہیں
      correct: false
      why:
        ar: كانت القبلة إلى القدس أولًا
        en: the qibla was to Jerusalem first
        ur: قبلہ پہلے بیت المقدس کی طرف تھا
  - q:
      ar: متى احتلّها الصليبيون؟
      en: When did the Crusaders seize her?
      ur: صلیبیوں نے اسے کب لیا؟
    options:
    - text:
        ar: عام ١٠٩٩
        en: in 1099
        ur: 1099 میں
      correct: true
      why:
        ar: تذكر المصادر استيلاءهم عليها ذلك العام
        en: the sources date their seizure to that year
        ur: ماخذ اس سال ان کے قبضے کو لکھتے ہیں
    - text:
        ar: عام ١١٨٧
        en: in 1187
        ur: 1187 میں
      correct: false
      why:
        ar: ذلك عام استعادتها لا احتلالها
        en: that is her recovery year, not seizure
        ur: یہ اس کی واپسی کا سال ہے، قبضے کا نہیں
    - text:
        ar: عام ٦٣٧
        en: in 637
        ur: 637 میں
      correct: false
      why:
        ar: ذلك عام الفتح الإسلامي لا الصليبي
        en: that is the Islamic conquest, not Crusader
        ur: یہ اسلامی فتح کا سال ہے، صلیبی نہیں
    - text:
        ar: لم تُحتلّ
        en: she was never seized
        ur: اسے کبھی نہیں لیا گیا
      correct: false
      why:
        ar: احتلّها الصليبيون في المصادر
        en: the sources have the Crusaders seize her
        ur: ماخذ میں صلیبیوں نے اسے لیا
  - q:
      ar: ماذا جعلها الصليبيون؟
      en: What did the Crusaders make her?
      ur: صلیبیوں نے اسے کیا بنایا؟
    options:
    - text:
        ar: قصرًا وأسطبلًا
        en: a palace and a stable
        ur: محل اور اصطبل
      correct: true
      why:
        ar: تذكر المصادر استعمالهم المسجد
        en: the sources record their use of the mosque
        ur: ماخذ مسجد کے ان کے استعمال لکھتے ہیں
    - text:
        ar: متحفًا
        en: a museum
        ur: عجائب گھر
      correct: false
      why:
        ar: جعلوها قصرًا وأسطبلًا لا متحفًا
        en: they made her palace and stable, not museum
        ur: انہوں نے محل اور اصطبل بنایا، عجائب گھر نہیں
    - text:
        ar: هدوها
        en: they demolished her
        ur: انہوں نے اسے مسمار کیا
      correct: false
      why:
        ar: بقيت قائمة باستعمال مختلف
        en: she stayed standing under different use
        ur: وہ مختلف استعمال میں کھڑی رہی
    - text:
        ar: مدرسة
        en: a school
        ur: مدرسہ
      correct: false
      why:
        ar: لم يجعلوها مدرسة
        en: they did not make her a school
        ur: انہوں نے اسے مدرسہ نہیں بنایا
  - q:
      ar: من أعادها مسجدًا؟
      en: Who returned her a mosque?
      ur: اسے مسجد کس نے دوبارہ بنایا؟
    options:
    - text:
        ar: صلاح الدين عام ١١٨٧
        en: Saladin in 1187
        ur: صلاح الدین نے 1187 میں
      correct: true
      why:
        ar: تذكر المصادر ترميمه بعد حطين
        en: the sources record his restoration after Hattin
        ur: ماخذ حطین کے بعد اس کی مرمت لکھتے ہیں
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: جاء العثمانيون بعدها بثلاثة قرون
        en: the Ottomans came three centuries later
        ur: عثمانی تین صدیوں بعد آئے
    - text:
        ar: الفاطميون
        en: the Fatimids
        ur: فاطمی
      correct: false
      why:
        ar: انتهت الفاطمية قبلها
        en: the Fatimids ended before her recovery
        ur: فاطمی اس کی واپسی سے پہلے ختم ہوئی
    - text:
        ar: لم تُعد
        en: she never returned
        ur: وہ کبھی واپس نہیں آئی
      correct: false
      why:
        ar: عادت مسجدًا بعد ١١٨٧
        en: she returned a mosque after 1187
        ur: وہ 1187 کے بعد مسجد بنی
  - q:
      ar: متى بدأ بناءها؟
      en: When did her building begin?
      ur: اس کی تعمیر کب شروع ہوئی؟
    options:
    - text:
        ar: أواخر القرن السابع الأموي
        en: the Umayyad late seventh century
        ur: ساتویں صدی کے آخر میں، اموی دور
      correct: true
      why:
        ar: تذكر المصادر بدايتها الأموية
        en: the sources place her Umayyad start
        ur: ماخذ اس کا اموی آغاز رکھتے ہیں
    - text:
        ar: القرن العاشر
        en: the tenth century
        ur: دسویں صدی
      correct: false
      why:
        ar: بدأت قبل العاشر بثلاثة قرون
        en: she began three centuries before the tenth
        ur: وہ دسویں سے تین صدیاں پہلے شروع ہوئی
    - text:
        ar: القرن الثاني عشر
        en: the twelfth century
        ur: بارہویں صدی
      correct: false
      why:
        ar: ذلك عصر ترميمها لا بدايتها
        en: that is her restoration era, not start
        ur: یہ اس کی مرمت کا دور ہے، آغاز کا نہیں
    - text:
        ar: غير معروف
        en: unknown
        ur: نامعلوم
      correct: false
      why:
        ar: تذكر المصادر بدايتها الأموية
        en: the sources give her Umayyad start
        ur: ماخذ اس کا اموی آغاز دیتے ہیں
  - q:
      ar: من أعاد بنائها بعد الزلازل؟
      en: Who rebuilt her after earthquakes?
      ur: زلزلوں کے بعد اسے کس نے دوبارہ بنایا؟
    options:
    - text:
        ar: العباسيون والفاطميون
        en: the Abbasids and the Fatimids
        ur: عباسی اور فاطمی
      correct: true
      why:
        ar: تذكر المصادر إعاداتها بعد الكوارث
        en: the sources record her rebuildings after disasters
        ur: ماخذ آفتوں کے بعد اس کی دوبارہ تعمیر لکھتے ہیں
    - text:
        ar: العثمانيون
        en: the Ottomans
        ur: عثمانی
      correct: false
      why:
        ar: جاء العثمانيون بعد الزلازل بقرون
        en: the Ottomans came centuries after the earthquakes
        ur: عثمانی زلزلوں سے صدیوں بعد آئے
    - text:
        ar: البريطانيون
        en: the British
        ur: برطانوی
      correct: false
      why:
        ar: لم يبنها البريطانيون
        en: the British did not build her
        ur: برطانویوں نے اسے نہیں بنایا
    - text:
        ar: لا أحد؛ هُدمت
        en: nobody; she was demolished
        ur: کوئی نہیں؛ اسے مسمار کر دیا گیا
      correct: false
      why:
        ar: بقيت قائمة بإعادات
        en: she stayed standing through rebuildings
        ur: وہ دوبارہ تعمیر کے ساتھ کھڑی رہی
  - q:
      ar: لماذا تهمّ الأقصى؟
      en: Why does al-Aqsa matter?
      ur: اقصیٰ کیوں اہم ہے؟
    options:
    - text:
        ar: لكونها ثالث الحرمين ومسرى النبي
        en: for being the third sanctuary and the Prophet''s night journey
        ur: تیسرا حرم اور نبی کے معراج ہونے کی وجہ سے
      correct: true
      why:
        ar: تجمع المكانة والذاكرة في المصادر
        en: the sources join her standing and memory
        ur: ماخذ اس کی حیثیت اور یادداشت کو جوڑتے ہیں
    - text:
        ar: لأنها أكبر مسجد
        en: because she is the largest mosque
        ur: کیونکہ یہ سب سے بڑی مسجد ہے
      correct: false
      why:
        ar: أهميتها دينية لا حجمية
        en: her importance is religious, not size
        ur: اس کی اہمیت مذہبی ہے، حجمی نہیں
    - text:
        ar: لأنها في مكة
        en: because she is in Mecca
        ur: کیونکہ یہ مکہ میں ہے
      correct: false
      why:
        ar: هي في القدس لا مكة
        en: she is in Jerusalem, not Mecca
        ur: یہ بیت المقدس میں ہے، مکہ میں نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: ثالث الحرمين في المصادر
        en: the third sanctuary in the sources
        ur: ماخذ میں تیسرا حرم
  - q:
      ar: ماذا تحمل من العمارة؟
      en: What does she carry of architecture?
      ur: اس میں معماری کا کیا ہے؟
    options:
    - text:
        ar: ستة قرون من العمارة الإسلامية
        en: six centuries of Islamic architecture
        ur: چھ صدیوں کی اسلامی معماری
      correct: true
      why:
        ar: جمعت إعاداتها أساليب عصرها
        en: her rebuildings gathered their eras'' styles
        ur: اس کی دوبارہ تعمیر نے اپنے دوروں کے طرز جمع کیے
    - text:
        ar: العمارة الرومانية فقط
        en: only Roman architecture
        ur: صرف رومی معماری
      correct: false
      why:
        ar: بنيت إسلاميًّا لا رومانيًّا
        en: she was built Islamically, not Roman
        ur: یہ اسلامی طور پر بنی، رومی نہیں
    - text:
        ar: العمارة الحديثة
        en: modern architecture
        ur: جدید معماری
      correct: false
      why:
        ar: بنيت قبل الحداثة بقرون
        en: she was built centuries before modernity
        ur: یہ جدیدیت سے صدیوں پہلے بنی
    - text:
        ar: لا عمارة
        en: no architecture
        ur: کوئی معماری نہیں
      correct: false
      why:
        ar: تحمل أساليب ستة قرون
        en: she carries six centuries'' styles
        ur: اس میں چھ صدیوں کے طرز ہیں
  - q:
      ar: من كتب عنها؟
      en: Who wrote about her?
      ur: اس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو القدس والفتح والصليب
        en: Jerusalem''s historians and those of conquest and crusade
        ur: بیت المقدس، فتح اور صلیبی مہمات کے مؤرخین
      correct: true
      why:
        ar: تصلنا وصفها من المصادر الإسلامية والأوروبية
        en: her accounts reach us from Islamic and European sources
        ur: اسلامی اور یورپی ماخذ سے اس کی وصف پہنچی
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقتها كتب التاريخ والنقوش
        en: history books and inscriptions document her
        ur: تاریخ کی کتابوں اور نقشوں نے اسے ثبت کیا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنها المسلمون والأوروبيون
        en: Muslims and Europeans wrote of her
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنها قبل العثمانيين بقرون
        en: she was written of centuries before the Ottomans
        ur: اس کے بارے میں عثمانیوں سے صدیوں پہلے لکھا گیا
- id: umayyad-mosque
  anchor: building/umayyad-mosque
  band: scholars
  title:
    ar: الجامع الأموي
    en: the Umayyad Mosque
    ur: اموی جامع
  sixty:
    ar: 'الجامع الأموي في دمشق: أعظم مساجد العصر الأموي، بناه الوليد بن عبد الملك عام ٧١٥ في موقع معبد روماني وكنيسة يوحنا المعمدان. جمع البناء فسيفساء زجاجية ذهبية
      تصوّر الجنة — بلا وجوه — وقاعة صلاة واسعة وصحنًا مفتوحًا، وحمل فيها الخط الكوفي. احترق مرارًا وأعيد بناؤه، وبقي فيه قبر يوحنا المعمدان عند المسلمين والمسيحيين
      معًا. بقي الجامع نموذج المسجد الإسلامي المبكر: منارة مربعة وقبة ورواق وجامعًا للمدينة القديمة.  وفي صحنه تقف ثلاث حضارات معًا: معبد روماني أسفله، وكنيسة يوحنا قبله، ومسجد الوليد فوقهما — تاريخ دمشق كله في بناء واحد، وبقي محرابه الرابع القديم شاهدًا على القبلة الأولى قبل تحويلها.  وتلك الفسيفساء الذهبية، التي تروي أنهارًا وأشجارًا وقصورًا بلا إنسان، صارت أعظم ما تبقّى من فنّ العالم الأموي، فالجامع متحفٌ ومكانُ عبادة في وقتٍ واحد.'
    en: 'The Umayyad Mosque in Damascus: the Umayyad era''''s greatest mosque, built by al-Walid ibn Abd al-Malik in 715 on the site of a Roman temple and the church
      of John the Baptist. Its golden glass mosaics picture paradise — without faces — beside a wide prayer hall and open courtyard, all in Kufic script. It burned
      repeatedly and was rebuilt, and it still holds the grave of John the Baptist shared by Muslims and Christians alike. It stayed the model of the early Islamic
      mosque: square minaret, dome, portico and gatherer of the Old City.  In its court three civilizations stand together: a Roman temple beneath, John the Baptist''s church before, al-Walid''s mosque above — all of Damascus''s history in one building; and its old fourth mihrab still witnesses the first qibla before the change.  Those golden mosaics, picturing rivers and trees and palaces with no human face, are the greatest survival of Umayyad art — the mosque is museum and prayer-place at once.'
    ur: 'دمشق میں اموی جامع: اموی دور کی عظیم ترین مسجد، جسے ولید بن عبدالملک نے 715 میں رومی معبد اور یحییٰ المعمدان کی کلیسا کی جگہ پر بنایا۔ اس کی سنہری شیشے کی
      موزائک جنت دکھاتی ہے — چہروں کے بغیر — وسیع نماز ہال اور کھلے صحن کے ساتھ، سب کوفی خط میں۔ یہ بار بار جلی اور دوبارہ بنی، اور اس میں اب بھی یحییٰ المعمدان کی
      قبر ہے جسے مسلمان اور مسیحی دونوں مانتے ہیں۔ یہ ابتدائی اسلامی مسجد کا نمونہ رہی: چوکور مینار، گنبد، رواق اور پرانے شہر کی جامع۔  اس کے صحن میں تین تہذیبیں ساتھ کھڑی ہیں: نیچے رومی معبد، پہلے یحییٰ کی کلیسا، اور اوپر ولید کی مسجد — ایک ہی عمارت میں دمشق کی ساری تاریخ؛ اور اس کا پرانا چوتھا محراب تبدیلی سے پہلے کے پہلے قبلہ کی گواہی دیتا ہے۔  وہ سنہری موزائک جو دریاؤں، درختوں اور محلوں کو بغیر چہروں کے دکھاتی ہے، اموی فن کی عظیم ترین بچی ہوئی یادگار ہے — مسجد عجائب گھر اور عبادت گاہ دونوں ہے۔'
  glossary:
  - term:
      ar: دمشق
      en: Damascus
      ur: دمشق
    gloss:
      ar: 'مدينة الجامع الأموي في قلب بلاد الشام'
      en: 'the Umayyad Mosque''s city, at the heart of the land of Syria'
      ur: 'شام کی سرزمین کے دل میں جامع اموی کا شہر'
  - term:
      ar: الوليد بن عبد الملك
      en: al-Walid ibn Abd al-Malik
      ur: ولید بن عبدالملک
    gloss:
      ar: 'الخليفة الأموي الذي بناه سنة ٧١٥م في دمشق'
      en: 'the Umayyad caliph who built it in Damascus in the year 715'
      ur: 'اموی خلیفہ جس نے اسے 715ء میں دمشق میں بنایا'
  - term:
      ar: ٧١٥
      en: '715'
      ur: '715'
    gloss:
      ar: 'سنة إتمام البناء في عهد الوليد بن عبد الملك الخليفة'
      en: 'the completion year under the caliph al-Walid ibn Abd al-Malik'
      ur: 'خلیفہ ولید بن عبدالملک کے عہد میں تعمیر کی تکمیل کا سال'
  - term:
      ar: يوحنا المعمدان
      en: John the Baptist
      ur: یحییٰ المعمدان
    gloss:
      ar: 'النبي الذي قامت كنيسته في موضع المسجد قبله'
      en: 'the prophet whose church stood on the mosque''s site before it'
      ur: 'وہ نبی جس کی گرجا مسجد سے پہلے اسی جگہ پر قائم تھی'
  - term:
      ar: الفسيفساء
      en: the mosaics
      ur: موزائک
    gloss:
      ar: 'فسيفساؤه الذهبية المصوِّرة لمشاهد الجنة وأنهارها'
      en: 'its golden mosaics picturing scenes of paradise and its rivers'
      ur: 'اس کی سنہری خوبصورتیاں جو جنت اور اس کے نہروں کے مناظر دکھاتی ہیں'
  - term:
      ar: بلا وجوه
      en: without faces
      ur: چہروں کے بغیر
    gloss:
      ar: 'أسلوبه الذي تجنّب الوجوه والأرواح في كل الصور'
      en: 'its style, which avoided faces and living souls in all the imagery'
      ur: 'اس کا انداز جس نے تمام تصویروں میں چہروں اور روحوں سے اجتناب کیا'
  - term:
      ar: الكوفية
      en: the Kufic
      ur: کوفی
    gloss:
      ar: 'خطّه العربي المبكر الذي كُتب به نقش التأسيس'
      en: 'its early Arabic script, in which the founding inscription was written'
      ur: 'اس کا ابتدائی عربی خط جس میں تاسیس نقوش لکھی گئی'
  - term:
      ar: الصحن
      en: the courtyard
      ur: صحن
    gloss:
      ar: 'صحنه المفتوح الذي جمع أجيال المصلّين عبر القرون'
      en: 'its open courtyard that gathered generations of worshippers across the centuries'
      ur: 'اس کا کھلا صحن جس نے صدیوں تک نمازیوں کی نسلوں کو جمع کیا'
  - term:
      ar: المنارة المربعة
      en: the square minaret
      ur: چوکور مینار
    gloss:
      ar: 'مئذنته المربعة التي تعلو صحنه على الطراز الشامي'
      en: 'its square minaret rising over its court, in the old Syrian style'
      ur: 'اس کا چوکور مینار جو پرانے شامی انداز میں صحن کے اوپر اٹھتا ہے'
  - term:
      ar: الحرائق
      en: the fires
      ur: آگ
    gloss:
      ar: 'حرائقه التي هدمته وأعيد بناؤه بعدها مرات'
      en: 'its fires, which destroyed it and saw it rebuilt time and again'
      ur: 'اس کی آگیں جنہوں نے اسے جلایا اور جن کے بعد یہ بار بار تعمیر ہوا'
  - term:
      ar: الكنيسة
      en: the church
      ur: کلیسا
    gloss:
      ar: 'كنيسة يحيى التي سبقته في المكان نفسه'
      en: 'John''s church that stood before it on the very same spot'
      ur: 'یحییٰ کی گرجا جو اس سے پہلے اسی جگہ قائم تھی'
  - term:
      ar: المعبد الروماني
      en: the Roman temple
      ur: رومی معبد
    gloss:
      ar: 'معبد الرومان الذي سبق الكنيسة قبلهما'
      en: 'the Romans'' temple that stood before the church, before both'
      ur: 'رومیوں کا مندر جو ان دونوں سے پہلے گرجا سے بھی پہلے تھا'
  practice:
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنایا؟
    options:
    - text:
        ar: الوليد بن عبد الملك عام ٧١٥
        en: al-Walid ibn Abd al-Malik in 715
        ur: ولید بن عبدالملک نے 715 میں
      correct: true
      why:
        ar: تنسب المصادر بناءه إلى الوليد
        en: the sources credit it to al-Walid
        ur: ماخذ اسے ولید سے منسوب کرتے ہیں
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: جاء صلاح الدين بعده بأربعة قرون ونصف
        en: Saladin came four and a half centuries later
        ur: صلاح الدین ساڑھے چار صدیوں بعد آیا
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: جاء الفاتح بعده بسبعة قرون
        en: the Conqueror came seven centuries later
        ur: فاتح سات صدیوں بعد آیا
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: بناه الأمويون لا العباسيون
        en: the Umayyads built it, not the Abbasids
        ur: امویوں نے بنایا، عباسیوں نے نہیں
  - q:
      ar: على ماذا بُني؟
      en: What was it built on?
      ur: یہ کس پر بنا؟
    options:
    - text:
        ar: موقع معبد روماني وكنيسة يوحنا
        en: a Roman temple and John''s church site
        ur: رومی معبد اور یحییٰ کی کلیسا کی جگہ پر
      correct: true
      why:
        ar: تذكر المصادر تاريخ الموقع قبله
        en: the sources record the site''s earlier uses
        ur: ماخذ جگہ کے پہلے کے استعمال لکھتے ہیں
    - text:
        ar: صحراء خالية
        en: empty desert
        ur: خالی صحرا
      correct: false
      why:
        ar: قام على موقع مقدس قديم
        en: it stood on an old sacred site
        ur: یہ قدیم مقدس جگہ پر بنا
    - text:
        ar: مدينة جديدة
        en: a new city
        ur: نیا شہر
      correct: false
      why:
        ar: بنيت في دمشق القديمة
        en: it was built in old Damascus
        ur: یہ پرانے دمشق میں بنی
    - text:
        ar: جبل
        en: a mountain
        ur: پہاڑ
      correct: false
      why:
        ar: بنيت في قلب المدينة لا جبل
        en: it was built in the city''s heart, not a mountain
        ur: یہ شہر کے دل میں بنی، پہاڑ پر نہیں
  - q:
      ar: ما فسيفساؤه؟
      en: What are its mosaics?
      ur: اس کی موزائک کیا ہے؟
    options:
    - text:
        ar: زجاجية ذهبية تصوّر الجنة بلا وجوه
        en: golden glass picturing paradise without faces
        ur: سنہری شیشہ جو جنت دکھاتا ہے، چہروں کے بغیر
      correct: true
      why:
        ar: تذكر المصادر تجنبها الوجوه
        en: the sources note their avoiding faces
        ur: ماخذ ان کے چہروں سے بچنے کا ذکر کرتے ہیں
    - text:
        ar: حجرية رومانية
        en: Roman stone
        ur: رومی پتھر
      correct: false
      why:
        ar: فسيفساؤه إسلامية ذهبية لا رومانية
        en: its mosaics are golden Islamic, not Roman
        ur: اس کی موزائک سنہری اسلامی ہے، رومی نہیں
    - text:
        ar: لا فسيفساء
        en: no mosaics
        ur: کوئی موزائک نہیں
      correct: false
      why:
        ar: تحمل فسيفساء مشهورة
        en: it carries famous mosaics
        ur: اس میں مشہور موزائک ہے
    - text:
        ar: صور أشخاص
        en: people''s pictures
        ur: لوگوں کی تصاویر
      correct: false
      why:
        ar: تجنبت وجوه الأشخاص
        en: they avoided human faces
        ur: انہوں نے چہروں سے بچا
  - q:
      ar: ماذا فيه من القبور؟
      en: What grave does it hold?
      ur: اس میں کس کی قبر ہے؟
    options:
    - text:
        ar: قبر يوحنا المعمدان
        en: John the Baptist''s grave
        ur: یحییٰ المعمدان کی قبر
      correct: true
      why:
        ar: يذكر المصادر قبره فيه عند الفريقين
        en: the sources have his grave there for both faiths
        ur: ماخذ دونوں دینوں کے لیے وہاں اس کی قبر لکھتے ہیں
    - text:
        ar: قبر النبي
        en: the Prophet''s grave
        ur: نبی کی قبر
      correct: false
      why:
        ar: قبر النبي في المدينة لا دمشق
        en: the Prophet''s grave is in Medina, not Damascus
        ur: نبی کی قبر مدینہ میں ہے، دمشق میں نہیں
    - text:
        ar: قبر الخليفة
        en: the caliph''s grave
        ur: خلیفہ کی قبر
      correct: false
      why:
        ar: قبر يوحنا فيه لا الوليد
        en: it holds John''s grave, not al-Walid''s
        ur: اس میں یحییٰ کی قبر ہے، ولید کی نہیں
    - text:
        ar: لا قبور
        en: no graves
        ur: کوئی قبر نہیں
      correct: false
      why:
        ar: يذكر المصادر قبر يوحنا فيه
        en: the sources name John''s grave there
        ur: ماخذ وہاں یحییٰ کی قبر لکھتے ہیں
  - q:
      ar: ما شكل منارته؟
      en: What is its minaret''s shape?
      ur: اس کے مینار کی شکل کیا ہے؟
    options:
    - text:
        ar: مربعة
        en: square
        ur: چوکور
      correct: true
      why:
        ar: يذكر المصادر شكلها المبكر
        en: the sources give its early shape
        ur: ماخذ اس کی ابتدائی شکل دیتے ہیں
    - text:
        ar: مدببة كالقلم
        en: pencil-pointed
        ur: قلم جیسی نوکیلی
      correct: false
      why:
        ar: المدببة عثمانية لا أموية
        en: the pencil shape is Ottoman, not Umayyad
        ur: نوکیلی شکل عثمانی ہے، اموی نہیں
    - text:
        ar: ملتوية
        en: twisted
        ur: مڑی ہوئی
      correct: false
      why:
        ar: مربعة لا ملتوية في المصادر
        en: square, not twisted, in the sources
        ur: ماخذ میں چوکور ہے، مڑی ہوئی نہیں
    - text:
        ar: لا منارة
        en: no minaret
        ur: کوئی مینار نہیں
      correct: false
      why:
        ar: لها منارة مربعة مبكرة
        en: it has an early square minaret
        ur: اس میں ابتدائی چوکور مینار ہے
  - q:
      ar: ماذا حدث له عبر الزمن؟
      en: What happened to it over time?
      ur: زمانے میں اسے کیا ہوا؟
    options:
    - text:
        ar: احترق مرارًا وأعيد بناؤه
        en: it burned repeatedly and was rebuilt
        ur: یہ بار بار جلی اور دوبارہ بنی
      correct: true
      why:
        ar: تذكر المصادر حرائقه وإعاداته
        en: the sources record its fires and rebuildings
        ur: ماخذ اس کی آگ اور دوبارہ تعمیر لکھتے ہیں
    - text:
        ar: لم يمسّه شيء
        en: nothing touched it
        ur: اسے کچھ نہیں ہوا
      correct: false
      why:
        ar: تذكر المصادر حرائقه
        en: the sources record its fires
        ur: ماخذ اس کی آگ لکھتے ہیں
    - text:
        ar: هُدم كليًّا
        en: it was fully demolished
        ur: یہ مکمل مسمار ہوئی
      correct: false
      why:
        ar: بقي قائمًا بإعادات
        en: it stayed standing through rebuildings
        ur: یہ دوبارہ تعمیر کے ساتھ کھڑی رہی
    - text:
        ar: تحوّل إلى قصر
        en: it became a palace
        ur: یہ محل بن گئی
      correct: false
      why:
        ar: بقي مسجدًا في المصادر
        en: it stayed a mosque in the sources
        ur: یہ ماخذ میں مسجد رہی
  - q:
      ar: لماذا يهمّ؟
      en: Why does it matter?
      ur: یہ کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه نموذج المسجد الإسلامي المبكر
        en: because it is the early Islamic mosque''s model
        ur: کیونکہ یہ ابتدائی اسلامی مسجد کا نمونہ ہے
      correct: true
      why:
        ar: جمع القاعة والصحن والمنارة في صيغة
        en: it joined hall, courtyard and minaret in one form
        ur: اس نے ہال، صحن اور مینار کو ایک شکل میں جمع کیا
    - text:
        ar: لأنه أكبر مسجد في العالم
        en: because it is the world''s largest mosque
        ur: کیونکہ یہ دنیا کی سب سے بڑی مسجد ہے
      correct: false
      why:
        ar: أهميته تاريخية ومعمارية لا حجمية
        en: its importance is historic and architectural, not size
        ur: اس کی اہمیت تاریخی اور معماری ہے، حجمی نہیں
    - text:
        ar: لأنه في مكة
        en: because it is in Mecca
        ur: کیونکہ یہ مکہ میں ہے
      correct: false
      why:
        ar: هو في دمشق لا مكة
        en: it is in Damascus, not Mecca
        ur: یہ دمشق میں ہے، مکہ میں نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: يعدّ أعظم المساجد الأموية
        en: it is counted the greatest Umayyad mosque
        ur: یہ عظیم ترین اموی مسجد شمار ہوتی ہے
  - q:
      ar: من كتب عنه؟
      en: Who wrote about it?
      ur: اس کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو دمشق والعمارة الإسلامية
        en: Damascus''s historians and Islamic architecture scholars
        ur: دمشق کے مؤرخین اور اسلامی معماری کے علماء
      correct: true
      why:
        ar: تصلنا وصفه من الرحّالة والمؤرخين
        en: its accounts reach us from travellers and historians
        ur: سیاحوں اور مؤرخین سے اس کی وصف پہنچی
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: وثّقته الكتب والفسيفساء
        en: books and mosaics document it
        ur: کتابوں اور موزائک نے اسے ثبت کیا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of it
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنه قبل العثمانيين بقرون
        en: it was written of centuries before the Ottomans
        ur: اس کے بارے میں عثمانیوں سے صدیوں پہلے لکھا گیا
  - q:
      ar: ماذا جمع في بنائه؟
      en: What did it join in its building?
      ur: اس نے اپنی تعمیر میں کیا ملا؟
    options:
    - text:
        ar: الموقع الروماني والكنيسة والمسجد
        en: the Roman site, the church and the mosque
        ur: رومی جگہ، کلیسا اور مسجد
      correct: true
      why:
        ar: جمع تاريخ المكان في بناء واحد
        en: it gathered the place''s history in one building
        ur: اس نے جگہ کی تاریخ کو ایک عمارت میں جمع کیا
    - text:
        ar: لا شيء جديد
        en: nothing new
        ur: کچھ نیا نہیں
      correct: false
      why:
        ar: جمع العصور في موقعه في المصادر
        en: the sources have it join the ages in its site
        ur: ماخذ میں اس نے اپنی جگہ میں دوروں کو جمع کیا
    - text:
        ar: الصيني والهندي
        en: Chinese and Indian
        ur: چینی اور ہندوستانی
      correct: false
      why:
        ar: جمع التاريخ المحلي لا الصيني
        en: it joined local history, not Chinese
        ur: اس نے مقامی تاریخ جمع کی، چینی نہیں
    - text:
        ar: المعبد فقط
        en: only the temple
        ur: صرف معبد
      correct: false
      why:
        ar: جمع معبدًا وكنيسة ومسجدًا
        en: it joined temple, church and mosque
        ur: اس نے معبد، کلیسا اور مسجد جمع کیے
  - q:
      ar: ما الذي يميّز قبره؟
      en: What distinguishes its grave?
      ur: اس کی قبر کی کیا خاصیت ہے؟
    options:
    - text:
        ar: مشترك بين المسلمين والمسيحيين
        en: shared by Muslims and Christians
        ur: مسلمانوں اور مسیحیوں میں مشترک
      correct: true
      why:
        ar: يذكر المصادر احترام الفريقين لقبر يوحنا
        en: the sources record both faiths'' respect for John''s grave
        ur: ماخذ یحییٰ کی قبر کے لیے دونوں دینوں کا احترام لکھتے ہیں
    - text:
        ar: مدفون فيه الوليد
        en: al-Walid is buried in it
        ur: اس میں ولید دفن ہے
      correct: false
      why:
        ar: قبر يوحنا لا الوليد فيه
        en: it holds John''s grave, not al-Walid''s
        ur: اس میں یحییٰ کی قبر ہے، ولید کی نہیں
    - text:
        ar: لا يوجد قبر
        en: no grave exists
        ur: کوئی قبر نہیں
      correct: false
      why:
        ar: يذكر المصادر قبر يوحنا فيه
        en: the sources name John''s grave there
        ur: ماخذ وہاں یحییٰ کی قبر لکھتے ہیں
    - text:
        ar: قبر اكتشف حديثًا
        en: a recently discovered grave
        ur: حال ہی میں دریافت شدہ قبر
      correct: false
      why:
        ar: القبر قديم معروف
        en: the grave is old and known
        ur: قبر پرانی اور معروف ہے
- id: ibn-battuta
  anchor: person/ibn-battuta-muhammad
  band: researchers
  title:
    ar: ابن بطّوطة
    en: Ibn Battuta
    ur: ابن بطوطہ
  sixty:
    ar: 'وُلد ابن بطّوطة في طنجة سنة ١٣٠٤ وخرج شابًّا للحج فلم يعد إلى بلده إلا بعد نحو ثلاثين عامًا. قطع في رحلاته ما يقارب مئة وعشرين ألف كيلومتر عبر أفريقيا وآسيا: من مصر إلى مكة، ومن العراق إلى الأناضول، ومن المالديف حيث عمل قاضيًا إلى دلهي حيث خدم السلطان، ثم إلى الصين التي وصلها مبعوثًا، وعبر الصحراء إلى مالي في آخر رحلاته. كان يتزوّج ويطلّق ويعمل ويُسرق ويمرض ويقاتل القراصنة، وكلّه مسجّل بعين رحّالة فضولي. وحين استقرّ أخيرًا في المغرب أملى ذكرياته على ابن جزيّ فصارت «الرحلة» أشهر كتاب سفر في الحضارة الإسلامية — عين غربية مسلمة على نصف العالم في القرن الرابع عشر.  وهكذا تحوّل الشاب الطنجي إلى أمثولة العالم المسلم: أن الأرض كلها دار إسلامية ممكنة السكنى، وأن الحج يمكن أن يصير حياة كاملة.  وبقي كتابه عينًا على العالم الإسلامي في أعقاب المغول: من مراكش إلى بكين تتقارب العادات وتتباعد، ويبقى اليقين أن مسافرًا واحدًا رأى القرن كله بأمّ عينيه.'
    en: 'Ibn Battuta was born in Tangier in 1304 and left as a young man for the Hajj, not coming home for nearly thirty years. He covered about 120,000 kilometres across Africa and Asia: Egypt to Mecca, Iraq to Anatolia, the Maldives where he sat as qadi, Delhi where he served the sultan, then China which he reached as an envoy, and across the Sahara to Mali on his last journey. He married and divorced, worked and was robbed, fell ill and fought pirates — all recorded with a curious traveller''s eye. Settled at last in Morocco, he dictated his memories to Ibn Juzayy, and the Rihla became Islamic civilisation''s most famous travel book — a Muslim western eye on half the fourteenth-century world.  In him the Tangier youth became the Muslim world''s parable: that the whole earth can be a liveable Islamic home, and that a pilgrimage can turn into an entire life.'
    ur: 'ابن بطوطہ 1304 میں طنجہ میں پیدا ہوا اور جوان ہو کر حج کے لیے نکلا، تقریباً تیس برس بعد ہی وطن لوٹا۔ اس نے افریقہ اور ایشیا میں تقریباً ایک لاکھ بیس ہزار کلومیٹر کا سفر کیا: مصر سے مکہ، عراق سے اناطولیہ، مالدیپ جہاں قاضی رہا، دہلی جہاں سلطان کی خدمت کی، پھر چین جہاں مبعوث پہنچا، اور آخری سفر میں صحرا عبور کر کے مالی۔ اس نے شادیاں کیں اور طلاقیں، کام کیا اور لوٹا گیا، بیمار ہوا اور قزاقوں سے لڑا — سب کچھ ایک متجسس مسافر کی آنکھ سے درج ہے۔ آخر میں مراکش میں ٹھہر کر اس نے اپنی یادیں ابن جزی کو سنائیں اور «الرحلہ» اسلامی تہذیب کی مشہور ترین سفرنامہ بنا — چودہویں صدی کی آدھی دنیا پر مغربی مسلم نگاہ۔  اسی میں طنجہ کا نوجوان مسلم دنیا کی مثل بنا: کہ ساری زمین بسنے کے قابل اسلامی وطن ہو سکتی ہے، اور حج ساری زندگی بن سکتا ہے۔'
  glossary:
  - term:
      ar: طنجة
      en: Tangier
      ur: طنجہ
    gloss:
      ar: 'مدينته المغربية التي غادرها شابًّا ولم يرها ثلاثين سنة'
      en: 'his Moroccan city, which he left as a young man and did not see for thirty years'
      ur: 'اس کا مراکشی شہر جو اس نے جوانی میں چھوڑا اور تیس سال نہ دیکھا'
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: 'الحج — السبب الذي خرج من أجله قبل كل شيء'
      en: 'the Hajj — the reason he first set out, before everything else'
      ur: 'حج — وہ سبب جس کے لیے اس نے سب سے پہلے سفر کیا'
  - term:
      ar: الرحلة
      en: the Rihla
      ur: رحلہ
    gloss:
      ar: 'كتابه المشهور الذي أملاه بعد عودته إلى المغرب'
      en: 'his famous book, which he dictated after returning to Morocco'
      ur: 'اس کی مشہور کتاب جو اس نے مراکش لوٹنے کے بعد املائی'
  - term:
      ar: قاضي
      en: qadi
      ur: قاضی
    gloss:
      ar: 'منصبه القضائي في جزر المالديف وفي دلهي'
      en: 'his judgeship in the Maldives and in the city of Delhi'
      ur: 'مالدیپ اور دہلی شہر میں اس کا قاضی کا منصب'
  - term:
      ar: مبعوث
      en: envoy
      ur: ایلچی
    gloss:
      ar: 'دور الرسول الذي بعثه فيه سلطان دلهي إلى الصين'
      en: 'the envoy mission Delhi''s sultan sent him on to the emperor of China'
      ur: 'وہ سفیر مشن جس میں دہلی کے سلطان نے اسے چین کے بادشاہ کے پاس بھیجا'
  - term:
      ar: المالديف
      en: the Maldives
      ur: مالدیپ
    gloss:
      ar: 'الجزر التي قضى فيها بالعدل سنتين'
      en: 'the islands where he judged with justice for two years'
      ur: 'وہ جزائر جہاں اس نے انصاف سے دو سال قضا کیا'
  - term:
      ar: سلطنة المغرب
      en: Morocco
      ur: مراکش
    gloss:
      ar: 'بلده الذي عاد إليه بعد ثلاثين سنة من الأسفار'
      en: 'his country, which he came back to after thirty years of travel'
      ur: 'اس کا ملک جہاں وہ تیس سال کی سیاحتوں کے بعد لوٹا'
  - term:
      ar: المالي
      en: Mali
      ur: مالی
    gloss:
      ar: 'رحلته الأخيرة عبر الصحراء إلى مملكة مالي'
      en: 'his last journey, across the Sahara to the kingdom of Mali'
      ur: 'اس کا آخری سفر، صحرا کے پار مالی کی سلطنت تک'
  - term:
      ar: الصين
      en: China
      ur: چین
    gloss:
      ar: 'أبعد بلد وصل إليه في أقصى الشرق من الأرض'
      en: 'the farthest country he reached in the far east of the earth'
      ur: 'زمین کے مشرق بعید میں وہ دور ترین ملک جہاں وہ پہنچا'
  - term:
      ar: ابن جزي
      en: Ibn Juzayy
      ur: ابن جزی
    gloss:
      ar: 'الكاتب الذي أملى عليه ذكريات رحلاته في فاس'
      en: 'the scribe in Fez he dictated his journeys'' memories to'
      ur: 'فاس کا وہ کاتب جس پر اس نے اپنے سفروں کی یادیں املائی'
  - term:
      ar: سلطان
      en: sultan
      ur: سلطان
    gloss:
      ar: 'الحكّام والسلاطين الذين خدمهم في طريقه الطويل'
      en: 'the rulers and sultans he served along his long road'
      ur: 'وہ حکمران اور سلطان جن کی اس نے اپنے طویل سفر میں خدمت کی'
  - term:
      ar: المسافة
      en: distance
      ur: فاصلہ
    gloss:
      ar: 'طول رحلته التقريبي — نحو مئة وعشرين ألف كيلومتر'
      en: 'his journey''s rough length — some hundred and twenty thousand kilometres'
      ur: 'اس کے سفر کی تقریبی لمبائی — کوئی ایک لاکھ بیس ہزار کلومیٹر'
  practice:
  - q:
      ar: أين وُلد ابن بطّوطة؟
      en: Where was Ibn Battuta born?
      ur: ابن بطوطہ کہاں پیدا ہوا؟
    options:
    - text:
        ar: طنجة
        en: Tangier
        ur: طنجہ
      correct: true
      why:
        ar: وُلد في طنجة بالمغرب عام ١٣٠٤
        en: he was born in Tangier, Morocco, in 1304
        ur: وہ 1304 میں مراکش کے شہر طنجہ میں پیدا ہوا
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة من محطاته لا منشأه
        en: Cairo was a stop on his route, not his birthplace
        ur: قاہرہ اس کے سفر کا ایک ٹھہراؤ تھا، جائے پیدائش نہیں
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: false
      why:
        ar: إسطنبول ليست مدينته
        en: Istanbul was not his city
        ur: استنبول اس کا شہر نہیں تھا
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: بغداد زارها ولم يولد فيها
        en: Baghdad he visited but was not born in
        ur: بغداد میں وہ آیا مگر پیدا وہاں نہیں ہوا
  - q:
      ar: لماذا خرج من بلاده أول مرة؟
      en: Why did he first leave home?
      ur: وہ پہلی بار گھر سے کیوں نکلا؟
    options:
    - text:
        ar: للحج
        en: to perform the Hajj
        ur: حج کے لیے
      correct: true
      why:
        ar: خرج شابًا قاصدًا الحج فطالت رحلته
        en: he left as a young pilgrim and the journey grew
        ur: وہ حج کرنے کے لیے نکلا اور سفر طوالت اختیار کر گیا
    - text:
        ar: للتجارة
        en: to trade
        ur: تجارت کے لیے
      correct: false
      why:
        ar: لم يكن تاجرًا بل حاجًا أولاً
        en: he was no merchant but a pilgrim first
        ur: وہ پہلے تاجر نہیں بلکہ حاجی تھا
    - text:
        ar: للدراسة
        en: to study
        ur: تعلیم کے لیے
      correct: false
      why:
        ar: درس في بلاده ثم خرج للحج
        en: he studied at home then left for the Hajj
        ur: اس نے وطن میں پڑھا پھر حج کے لیے نکلا
    - text:
        ar: هربًا من طاعون
        en: fleeing a plague
        ur: طاعون سے بھاگتے ہوئے
      correct: false
      why:
        ar: لم يفرّ من شيء بل قصد الحج
        en: he fled nothing; he sought the Hajj
        ur: وہ کسی چیز سے نہیں بھاگا، حج چاہتا تھا
  - q:
      ar: كم استمر غائبًا عن بلاده؟
      en: How long was he away from home?
      ur: وہ گھر سے کتنے عرصے دور رہا؟
    options:
    - text:
        ar: نحو ثلاثين عامًا
        en: about thirty years
        ur: تقریباً تیس سال
      correct: true
      why:
        ar: عاد بعد نحو ثلاثة عقود من السفر
        en: he came back after some three decades away
        ur: وہ تقریباً تین دہائیوں بعد لوٹا
    - text:
        ar: خمسة أعوام
        en: five years
        ur: پانچ سال
      correct: false
      why:
        ar: خمسة أعوام أقل بكثير من مدة رحلته
        en: five years is far short of his journey
        ur: پانچ سال اس کے سفر سے بہت کم ہے
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام لا تكفي لرحلاته
        en: ten years is too few for his travels
        ur: دس سال اس کے سفروں کے لیے کافی نہیں
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون عامًا أكثر من عمر رحلته
        en: fifty years exceeds his journey's span
        ur: پچاس سال اس کے سفر سے زیادہ ہے
  - q:
      ar: ما اسم كتاب سفره؟
      en: What is his travel book called?
      ur: اس کے سفر نامے کا نام کیا ہے؟
    options:
    - text:
        ar: «الرحلة»
        en: the Rihla
        ur: «رحلہ»
      correct: true
      why:
        ar: أملى ذكرياته فصارت «الرحلة»
        en: he dictated his memories into the Rihla
        ur: اس نے اپنی یادیں امل میں لکھوائیں اور رحلہ بنی
    - text:
        ar: «الإيضاح»
        en: the Idah
        ur: «ایضاح»
      correct: false
      why:
        ar: «الإيضاح» كتاب الجغرافيا لا رحلته
        en: the Idah is a geography work, not his book
        ur: ایضاح جغرافیہ کا کتاب ہے، اس کی رحلہ نہیں
    - text:
        ar: «المقدمة»
        en: the Muqaddimah
        ur: «مقدمہ»
      correct: false
      why:
        ar: المقدمة لابن خلدون لا لابن بطّوطة
        en: the Muqaddimah is Ibn Khaldun's, not Ibn Battuta's
        ur: مقدمہ ابن خلدون کی ہے، ابن بطوطہ کی نہیں
    - text:
        ar: «الرحلات» بلا قيد
        en: an unnamed notebook
        ur: بے نام نوٹ بک
      correct: false
      why:
        ar: اسم معروف لكتابه هو «الرحلة»
        en: his book is famously named the Rihla
        ur: اس کے سفر نامے کا مشہور نام رحلہ ہے
  - q:
      ar: ما مهنته التي عمل بها في الهند؟
      en: What job did he hold in India?
      ur: ہندوستان میں اس کا کیا کام تھا؟
    options:
    - text:
        ar: قاضي
        en: a judge (qadi)
        ur: قاضی
      correct: true
      why:
        ar: عمل قاضيًا لدى سلطان الهند
        en: he served the Indian sultan as a judge
        ur: وہ ہندوستان کے سلطان کے ہاں قاضی رہا
    - text:
        ar: طبيب
        en: a physician
        ur: طبیب
      correct: false
      why:
        ar: لم يكن طبيبًا بل فقيهًا قاضيًا
        en: he was a jurist, not a physician
        ur: وہ فقیہ تھا، طبیب نہیں
    - text:
        ar: تاجر
        en: a merchant
        ur: تاجر
      correct: false
      why:
        ar: لم يعش من التجارة بل من القضاء والضيافة
        en: he lived by judging and hospitality, not trade
        ur: وہ تجارت سے نہیں، قضا اور مہمانداری سے گزرا
    - text:
        ar: فارس
        en: a horseman
        ur: سوار
      correct: false
      why:
        ar: لم يكن جنديًا بل رجلاً علميًا
        en: he was a scholar, not a soldier
        ur: وہ عالم تھا، سپاہی نہیں
  - q:
      ar: من دوّن «الرحلة» بإملائه؟
      en: Who wrote down the Rihla at his dictation?
      ur: اس کی امل پر رحلہ کس نے لکھی؟
    options:
    - text:
        ar: ابن جزي
        en: Ibn Juzayy
        ur: ابن جزی
      correct: true
      why:
        ar: دوّن ابن جزي الرحلة بإملاء ابن بطّوطة
        en: Ibn Juzayy transcribed the Rihla as Ibn Battuta dictated
        ur: ابن جزی نے ابن بطوطہ کی امل پر رحلہ تحریر کی
    - text:
        ar: ابن خلدون
        en: Ibn Khaldun
        ur: ابن خلدون
      correct: false
      why:
        ar: ابن خلدون مؤرخ آخر لم يدوّن الرحلة
        en: Ibn Khaldun was another historian, not the scribe
        ur: ابن خلدون دوسرا مؤرخ تھا، منشی نہیں
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا سابق عليه بقرون
        en: Ibn Sina lived centuries earlier
        ur: ابن سینا اس سے صدیاں پہلے تھا
    - text:
        ar: ابن بطّوطة نفسه يدويًا
        en: Ibn Battuta himself, by hand
        ur: خود ابن بطوطہ نے ہاتھ سے
      correct: false
      why:
        ar: أملاها على ابن جزي ولم يكتبها بيده
        en: he dictated to Ibn Juzayy; he did not write it by hand
        ur: اس نے ابن جزی کو امل میں لکھوائی، ہاتھ سے نہیں لکھی
  - q:
      ar: ما أبعد جهة بلغها تقريبًا؟
      en: Roughly the farthest land he reached?
      ur: وہ تقریباً کس دور ترین سرزمین تک پہنچا؟
    options:
    - text:
        ar: الصين
        en: China
        ur: چین
      correct: true
      why:
        ar: بلغ الصين وكانت أقصى مشارق رحلته
        en: he reached China, the farthest east of his journey
        ur: وہ چین تک پہنچا جو اس کے سفر کا دور مشرق تھا
    - text:
        ar: الأندلس فقط
        en: only al-Andalus
        ur: صرف الاندلس
      correct: false
      why:
        ar: الأندلس على الطريق لا النهاية
        en: al-Andalus lay on the route, not the end
        ur: الاندلس راستے میں تھا، منزل نہیں
    - text:
        ar: اليابان
        en: Japan
        ur: جاپان
      correct: false
      why:
        ar: لم يصل إلى اليابان
        en: he never reached Japan
        ur: وہ جاپان تک نہیں پہنچا
    - text:
        ar: أوروبا الغربية
        en: Western Europe
        ur: مغربی یورپ
      correct: false
      why:
        ar: لم يتجه غربًا إلى أوروبا بعيدًا
        en: he did not travel far into western Europe
        ur: وہ مغربی یورپ میں دور تک نہیں گیا
  - q:
      ar: ما الدولة التي زارها في غرب إفريقيا؟
      en: Which West African empire did he visit?
      ur: مغربی افریقہ میں اس نے کون سی سلطنت دیکھی؟
    options:
    - text:
        ar: مالي
        en: Mali
        ur: مالی
      correct: true
      why:
        ar: زار إمبراطورية مالي ووصف قصورها
        en: he visited the Mali empire and described its court
        ur: اس نے مالی سلطنت دیکھی اور اس کے دربار کی وضاحت کی
    - text:
        ar: الأندلس
        en: al-Andalus
        ur: الاندلس
      correct: false
      why:
        ar: الأندلس في أيبيريا لا غرب إفريقيا
        en: al-Andalus is in Iberia, not West Africa
        ur: الاندلس ایبریا میں ہے، مغربی افریقہ میں نہیں
    - text:
        ar: مصر
        en: Egypt
        ur: مصر
      correct: false
      why:
        ar: مصر شرق إفريقيا لا غربها
        en: Egypt is in Africa's northeast, not west
        ur: مصر شمال مشرقی افریقہ میں ہے، مغرب میں نہیں
    - text:
        ar: فارس
        en: Persia
        ur: فارس
      correct: false
      why:
        ar: فارس في آسيا لا إفريقيا
        en: Persia is in Asia, not Africa
        ur: فارس ایشیا میں ہے، افریقہ میں نہیں
  - q:
      ar: كيف عاش خلال رحلته غالبًا؟
      en: How did he mostly live on the road?
      ur: سفر میں اس کی گزر بسر کیسے ہوتی تھی؟
    options:
    - text:
        ar: بالقضاء وضيافة السلاطين
        en: as a judge and a sultans' guest
        ur: قاضی اور سلاطین کے مہمان کے طور پر
      correct: true
      why:
        ar: عمل قاضيًا ومبعوثًا وضيفًا لدى الحكام
        en: he worked as judge, envoy and guest of rulers
        ur: وہ قاضی، ایلچی اور حکمرانوں کا مہمان رہا
    - text:
        ar: بالتجارة البحرية
        en: by sea trade
        ur: سمندری تجارت سے
      correct: false
      why:
        ar: لم يكن تاجرًا أساسًا
        en: trade was never his living
        ur: تجارت اس کی روزی نہیں تھی
    - text:
        ar: بالسخرة
        en: by forced labour
        ur: جبری محنت سے
      correct: false
      why:
        ar: عاش مكرّمًا لا مسخّرًا
        en: he lived honoured, not enslaved
        ur: وہ عزت سے رہا، غلام نہیں
    - text:
        ar: بالصيد
        en: by hunting
        ur: شکار سے
      correct: false
      why:
        ar: لم يكن صيادًا
        en: he was no hunter
        ur: وہ شکاری نہیں تھا
  - q:
      ar: ماذا حدث عندما عاد إلى المغرب؟
      en: What happened when he returned to Morocco?
      ur: مراکش واپسی پر کیا ہوا؟
    options:
    - text:
        ar: أملى رحلته على كاتب
        en: he dictated his journey to a scribe
        ur: اس نے منشی کو سفر نامہ امل میں لکھوایا
      correct: true
      why:
        ar: أملى الذكريات على ابن جزي فدوّنها
        en: he dictated his memories to Ibn Juzayy, who wrote them
        ur: اس نے ابن جزی کو یادیں امل میں دیں جنہوں نے لکھیں
    - text:
        ar: خرج مرة أخرى للحج
        en: he left for the Hajj again
        ur: وہ دوبارہ حج کو نکل گیا
      correct: false
      why:
        ar: استقر بعد عودته وأملى رحلته
        en: he settled after returning and dictated
        ur: وہ واپسی کے بعد ٹھہرا اور امل کرائی
    - text:
        ar: صار سلطانًا
        en: he became sultan
        ur: وہ سلطان بن گیا
      correct: false
      why:
        ar: لم يحكم بل أملى كتابه
        en: he ruled nothing; he dictated his book
        ur: اس نے حکومت نہیں کی، کتاب امل میں لکھوائی
    - text:
        ar: نسي رحلته
        en: he forgot his journey
        ur: وہ اپنا سفر بھول گیا
      correct: false
      why:
        ar: لم ينسَ بل أملى ذكرياتها
        en: he forgot nothing — he dictated them
        ur: وہ نہیں بھولا، یادیں امل میں لکھوائیں
- id: great-mosque-cordoba
  anchor: building/great-mosque-cordoba
  band: researchers
  title:
    ar: جامع قرطبة الكبير
    en: The Great Mosque of Cordoba
    ur: قرطبہ کی جامع مسجد
  sixty:
    ar: 'الجامع الكبير في قرطبة، أعظم ما بناه الأمويون في الغرب: بدأه عبد الرحمن الأول سنة ٧٨٥ ووسّعه خلفاؤه قرنين. تشتهر قاعته بغابة الأعمدة — مئات الأعمدة الرخامية تحمل عقودًا مزدوجة من حجر أحمر وأبيض، فتنفتح أمام المصلّي آفاق لا نهائية. ومحرابها من عهد الحكم الثاني تحفة فسيفساء بيزنطية تحمل النصوص الذهبية على أزرق وخضراء، ومقصورتها قبة من أضلع متشابكة كأنها دانتيل حجري. وبعد قرون صارت الكاتدرائية في وسطها، فصارت المبنى الوحيد الذي يجمع مسجدًا وكنيسة في بناء واحد — طبقات قرطبة كلها في مكان.  وفيها يتعلّم الزائر أن العمارة ذاكرة أمة: أعمدة رومانية أُعيد استخدامها، وعقود أموية تطورت، ونقوش كتبت بلسان الفاتحين — فبقي البناء أمانةً في يد المدينة عبر خلفائها وملوكها ومللها.  وما تزال أجراجها تُضاء يوميًّا فينتقل المصلّي بين ماضي المسلمين وحاضرهم في خطوة واحدة، فهي درس في أن الأوطان يمكن أن تتغيّر أسماؤها وتبقى ذاكرتها.'
    en: 'The Great Mosque of Cordoba, the Umayyads'' greatest work in the west: begun by Abd al-Rahman I in 785 and enlarged by caliphs for two centuries. Its hall is famous for the forest of columns — hundreds of marble shafts carrying double arches of red and white stone that open endless vistas before the worshipper. Its mihrab from al-Hakam II''s reign is a Byzantine mosaic masterpiece writing golden text on blue and green, and its maqsura a dome of interlaced ribs like stone lace. Centuries later a cathedral rose in its midst, making it the one building joining mosque and church in a single body — all of Cordoba''s layers in one place.  In her the visitor learns that architecture is a nation''s memory: Roman columns reused, Umayyad arches developed, inscriptions written in conquerors'' tongues — and the building stayed a trust in the city''s hands through its caliphs, kings and creeds.'
    ur: 'قرطہ کی عظیم مسجد، مغرب میں امویوں کا عظیم ترین کام: 785 میں عبدالرحمن اول نے شروع کی اور خلفاء نے دو صدیوں تک بڑھایا۔ اس کا ہال ستونوں کے جنگل کے لیے مشہور ہے — سینکڑوں ماربل کے ستون سرخ اور سفید پتھر کی دوہری محرابیں اٹھائے جن کے سامنے بیکس منظر کھلتے ہیں۔ حکم ثانی کے عہد کا محراب بازنطینی موزائک کا شاہکار ہے جس میں نیلے اور سبز پر سنہری متن لکھا ہے، اور اس کی مقصورہ ایک دوسرے میں جکی پسلیوں کا گنبد جیسے پتھر کا جال۔ صدیوں بعد اس کے بیچ میں گرجا اٹھا، یہ وہ واحد عمارت بنا جس میں مسجد اور گرجا ایک ہی جسم میں ہیں — قرطہ کی ساری تہیں ایک جگہ۔  اس میں زائر سیکھتا ہے کہ فنِ تعمیر قوم کی یادداشت ہے: دوبارہ استعمال ہوئے رومی ستون، ارتقا پانے والی اموی محرابیں، فاتحین کی زبان میں لکھے کتبے — اور عمارت خلفاء، بادشاہوں اور مذاہب کے ہاتھوں شہر کی امانت رہی۔'
  glossary:
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطبہ
    gloss:
      ar: 'مدينة الجامع الكبير في قلب بلاد الأندلس'
      en: 'the great mosque''s city, at the heart of the land of al-Andalus'
      ur: 'اندلس کی سرزمین کے دل میں جامع کبیر کا شہر'
  - term:
      ar: الأمويون
      en: the Umayyads
      ur: اموی
    gloss:
      ar: 'السلالة التي بدأته ثم وسّعته على مدى قرنين'
      en: 'the dynasty that began it, then enlarged it across two centuries'
      ur: 'وہ خاندان جس نے اسے بنایا پھر دو صدیوں تک بڑھایا'
  - term:
      ar: الأقواس المزدوجة
      en: double arches
      ur: دوہری محرابیں
    gloss:
      ar: 'عقوده المزدوجة المشهورة في قاعة الصلاة الكبرى'
      en: 'its famous double arches rising inside the great prayer hall'
      ur: 'عظیم نماز ہال میں اٹھتی اس کی مشہور دوہرے محرابیں'
  - term:
      ar: المحراب
      en: the mihrab
      ur: محراب
    gloss:
      ar: 'محرابه المذهّب القائم من عهد الحكم الثاني'
      en: 'its gilded mihrab standing from the era of al-Hakam II'
      ur: 'حکم ثانی کے عہد سے قائم اس کا سنہری محراب'
  - term:
      ar: الفسيفساء
      en: mosaics
      ur: فسفسائی
    gloss:
      ar: 'زخارفه البيزنطية المصنوعة على خلفية زرقاء وخضراء'
      en: 'its Byzantine mosaics made over backgrounds of blue and green'
      ur: 'نیلے اور سبز پس منظر پر بنی اس کی بازنطینی زینت'
  - term:
      ar: عبد الرحمن الأول
      en: Abd al-Rahman I
      ur: عبدالرحمٰن اول
    gloss:
      ar: 'المؤسس الذي بدأ بناءه سنة ٧٨٥م'
      en: 'the founder who began its building in the year 785'
      ur: 'وہ بانی جس نے 785ء میں اس کی تعمیر شروع کی'
  - term:
      ar: غابة الأعمدة
      en: the forest of columns
      ur: ستونوں کا جنگل
    gloss:
      ar: 'مئات أعمدته القائمة التي تشبه غابة من الأشجار'
      en: 'its hundreds of standing columns, which resemble a forest of trees'
      ur: 'اس کے سینکڑوں کھڑے ستون جو درختوں کے جنگل کی طرح لگتے ہیں'
  - term:
      ar: المقصورة
      en: the maqsura
      ur: مقصورہ
    gloss:
      ar: 'مقصورته ذات الضلوع الحجرية المتشابكة والقباب'
      en: 'its maqsura of interlaced stone ribs and small domes'
      ur: 'باہم الجھے پتھر کے پسلیوں اور چھوٹے گنبدوں کی اس کی مقصورہ'
  - term:
      ar: الحجر والطوب
      en: stone and brick
      ur: پتھر اور اینٹ
    gloss:
      ar: 'مواده الحمراء والبيضاء المتناوبة في عقوده الشهيرة'
      en: 'its alternating red and white materials inside its famous arches'
      ur: 'اس کی مشہور محرابوں کے اندر سرخ اور سفید باری باری مواد'
  - term:
      ar: المنارة
      en: the minaret
      ur: مینار
    gloss:
      ar: 'برجه الذي صار فيما بعد جرسية الكاتدرائية'
      en: 'its tower, which in later times became the cathedral''s belfry'
      ur: 'اس کا برج جو بعد کے زمانوں میں کیتھیڈرل کا گھنٹا برج بنا'
  - term:
      ar: التوسيعات
      en: the enlargements
      ur: وسیع کرنا
    gloss:
      ar: 'توسيعات الخلفاء المتعاقبين عبر قرنين كاملين من الزمن'
      en: 'the successive caliphs'' enlargements across two whole centuries'
      ur: 'دو پوری صدیوں میں متعاقب خلفاء کی وسعتیں'
  - term:
      ar: الكاتدرائية
      en: the cathedral
      ur: کیتھیڈرل
    gloss:
      ar: 'الكنيسة التي نمت في وسطه بعد قرون'
      en: 'the church that grew up in its midst, centuries later'
      ur: 'وہ گرجا جو صدیوں بعد اس کے بیچ میں ابھر آئی'
  practice:
  - q:
      ar: في أيّ مدينة يقع الجامع؟
      en: In which city is the mosque?
      ur: مسجد کس شہر میں ہے؟
    options:
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: true
      why:
        ar: في قرطبة عاصمة الأندلس
        en: in Cordoba, the capital of al-Andalus
        ur: الاندلس کے پایہ تخت قرطبہ میں
    - text:
        ar: إشبيلية
        en: Seville
        ur: اشبیلیہ
      correct: false
      why:
        ar: إشبيلية مدينة أخرى لا موضعه
        en: Seville is another city, not its site
        ur: اشبیلیہ دوسرا شہر ہے، اس کی جگہ نہیں
    - text:
        ar: غرناطة
        en: Granada
        ur: غرناطہ
      correct: false
      why:
        ar: غرناطة مدينة قصر الحمراء لا هذا الجامع
        en: Granada is the Alhambra's city, not this mosque's
        ur: غرناطہ قصر الحمراء کا شہر ہے، اس مسجد کا نہیں
    - text:
        ar: طليطلة
        en: Toledo
        ur: طليطلہ
      correct: false
      why:
        ar: طليطلة شمال قرطبة
        en: Toledo lies north of Cordoba
        ur: طليطلہ قرطبہ کے شمال میں ہے
  - q:
      ar: من بدأ بناءه ومتى؟
      en: Who began it, and when?
      ur: اسے کس نے اور کب شروع کیا؟
    options:
    - text:
        ar: عبد الرحمن الأول عام ٧٨٥
        en: Abd al-Rahman I in 785
        ur: عبدالرحمٰن اول نے 785 میں
      correct: true
      why:
        ar: أمير الأندلس الأموي بدأه عام ٧٨٥
        en: the Umayyad emir of al-Andalus began it in 785
        ur: الاندلس کے اموی امیر نے 785 میں شروع کیا
    - text:
        ar: عبد الناصر عام ١٠٠٠
        en: Abd al-Nasir in 1000
        ur: عبدالناصر نے 1000 میں
      correct: false
      why:
        ar: لم يبدأه بل وسّعه لاحقًا
        en: he enlarged it later, did not begin it
        ur: اس نے بعد میں وسعت دی، شروع نہیں کیا
    - text:
        ar: الحكم الثاني عام ٩٦٠
        en: al-Hakam II in 960
        ur: الحکم دوم نے 960 میں
      correct: false
      why:
        ar: الحكم الثاني وسّعه لا بناه
        en: al-Hakam II enlarged it, not built it
        ur: الحکم دوم نے وسعت دی، تعمیر نہیں کی
    - text:
        ar: محمد الناصر عام ١١٩٥
        en: al-Nasir in 1195
        ur: الناصر نے 1195 میں
      correct: false
      why:
        ar: لم يكن بانيًا له
        en: he was not its builder
        ur: وہ اس کا معمار نہیں تھا
  - q:
      ar: ما أشهر سمته المعمارية؟
      en: Its most famous architectural feature?
      ur: اس کی سب سے مشہور تعمیری خصوصیت؟
    options:
    - text:
        ar: أقواس مزدوجة حمراء وبيضاء
        en: red-and-white double arches
        ur: سرخ و سفید دوہری محرابیں
      correct: true
      why:
        ar: أقواس متداخلة على غابة أعمدة
        en: interlocking arches over a forest of columns
        ur: ستونوں کے جنگل پر اندرونی محرابیں
    - text:
        ar: قبة خضراء ضخمة
        en: a huge green dome
        ur: بڑا سبز گنبد
      correct: false
      why:
        ar: لا قبة خضراء مشهورة فيه
        en: no famous green dome is in it
        ur: اس میں مشہور سبز گنبد نہیں
    - text:
        ar: أبراج مائلة
        en: leaning towers
        ur: جھکے ہوئے مینار
      correct: false
      why:
        ar: لا مائلة فيه بل أعمدة مستقيمة
        en: no leaning towers, straight columns
        ur: جھکے مینار نہیں، سیدھے ستون
    - text:
        ar: نوافذ زجاجية ملونة كبيرة
        en: large stained-glass windows
        ur: بڑی رنگین کھڑکیاں
      correct: false
      why:
        ar: الزخرفة فسيفساء لا زجاج
        en: its ornament is mosaic, not stained glass
        ur: اس کی زینت فسفسائی ہے، رنگین شیشہ نہیں
  - q:
      ar: ماذا حفظ محرابه؟
      en: What does its mihrab preserve?
      ur: اس کا محراب کیا محفوظ رکھتا ہے؟
    options:
    - text:
        ar: فسيفساء بيزنطية
        en: Byzantine mosaics
        ur: بازنطینی فسفسائی
      correct: true
      why:
        ar: في المحراب فسيفساء صنعها فنانون بيزنطيون
        en: Byzantine artists made the mihrab mosaics
        ur: محراب کی فسفسائی بازنطینی فنکاروں نے بنائی
    - text:
        ar: لوحات زيتية
        en: oil paintings
        ur: تیل کی پینٹنگ
      correct: false
      why:
        ar: لا لوحات زيتية في محرابه
        en: no oil paintings are in the mihrab
        ur: محراب میں تیل کی پینٹنگ نہیں
    - text:
        ar: تماثيل رخامية
        en: marble statues
        ur: سنگ مرمر کے مجسمے
      correct: false
      why:
        ar: لا تماثيل في المحراب الإسلامي
        en: no statues in an Islamic mihrab
        ur: اسلامی محراب میں مجسمے نہیں
    - text:
        ar: كتابة ضخمة فقط
        en: only huge writing
        ur: صرف بڑی خطاطی
      correct: false
      why:
        ar: الكتابة فيه لكنها فسيفساء مشهورة
        en: writing is there but the fame is the mosaic
        ur: خطاطی موجود مگر شہرت فسفسائی کی ہے
  - q:
      ar: لماذا سُمّي «غابة أعمدة»؟
      en: Why called a 'forest of columns'?
      ur: اسے ستونوں کا جنگل کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لمئات الأعمدة القصيرة
        en: for hundreds of short columns
        ur: سیکڑوں چھوٹے ستونوں کے لیے
      correct: true
      why:
        ar: مئات الأعمدة تملأ قاعة الصلاة
        en: hundreds of columns fill the prayer hall
        ur: نمازی ہال میں سیکڑوں ستون بھرے ہیں
    - text:
        ar: لأشجار داخله
        en: for trees inside it
        ur: اس کے اندر درختوں کے لیے
      correct: false
      why:
        ar: لا أشجار بل أعمدة فيه
        en: columns, not trees, fill it
        ur: اس میں درخت نہیں، ستون ہیں
    - text:
        ar: لجذوع من خشب
        en: for wooden trunks
        ur: لکڑی کے تنوں کے لیے
      correct: false
      why:
        ar: أعمدته من حجر ورخام لا خشب
        en: its columns are stone and marble, not wood
        ur: اس کے ستون پتھر اور سنگ مرمر کے ہیں، لکڑی کے نہیں
    - text:
        ar: لأعمدة ذهبية
        en: for golden columns
        ur: سنہری ستونوں کے لیے
      correct: false
      why:
        ar: لا ذهب في أعمدته بل حجر
        en: its columns are stone, not gold
        ur: اس کے ستون سونے کے نہیں، پتھر کے ہیں
  - q:
      ar: كم جيلاً وسّعه؟
      en: How many generations enlarged it?
      ur: کتنی نسلوں نے اسے وسیع کیا؟
    options:
    - text:
        ar: نحو قرنين
        en: about two centuries
        ur: تقریباً دو صدیاں
      correct: true
      why:
        ar: ظلّت الأجيال توسّعه قرنين
        en: generations kept enlarging it for two centuries
        ur: نسلیں دو صدیوں تک اسے وسیع کرتی رہیں
    - text:
        ar: جيل واحد
        en: one generation
        ur: ایک نسل
      correct: false
      why:
        ar: لم يكتف بجيل واحد
        en: one generation did not suffice
        ur: ایک نسل نے تکمیل نہیں کی
    - text:
        ar: ثلاثة قرون
        en: three centuries
        ur: تین صدیاں
      correct: false
      why:
        ar: قرنان أدقّ من ثلاثة
        en: two centuries is more accurate than three
        ur: دو صدیاں تین سے درست ہیں
    - text:
        ar: عقد واحد
        en: one decade
        ur: ایک دہائی
      correct: false
      why:
        ar: عقد قليل جدًا لبنائه
        en: a decade is far too short for it
        ur: ایک دہائی اس کے لیے بہت کم ہے
  - q:
      ar: بماذا تحوّل لاحقًا؟
      en: What did it later become?
      ur: بعد میں یہ کیا بن گیا؟
    options:
    - text:
        ar: كاتدرائية
        en: a cathedral
        ur: کیتھیڈرل
      correct: true
      why:
        ar: أقيمت فيه كاتدرائية بعد استرداد المدينة
        en: a cathedral was set inside it after the city was taken
        ur: شہر کی واپسی کے بعد اس میں کیتھیڈرل بنائی گئی
    - text:
        ar: قلعة
        en: a fortress
        ur: قلعہ
      correct: false
      why:
        ar: لم يصبح قلعة بل كنيسة
        en: it became a church, not a fortress
        ur: یہ قلعہ نہیں، گرجا بنا
    - text:
        ar: قصر ملكي
        en: a royal palace
        ur: شاہی محل
      correct: false
      why:
        ar: لم يصبح قصرًا
        en: it never became a palace
        ur: یہ محل نہیں بنا
    - text:
        ar: متحف حربي
        en: a war museum
        ur: جنگی عجائب گھر
      correct: false
      why:
        ar: لم يكن متحفًا بل مكان عبادة
        en: it stayed a place of worship, not a museum
        ur: یہ عبادت گاہ رہی، عجائب گھر نہیں
  - q:
      ar: ما لونا حجارتيه؟
      en: What two colours are its voussoirs?
      ur: اس کے محرابی پتھر کس دو رنگوں میں ہیں؟
    options:
    - text:
        ar: الأحمر والأبيض
        en: red and white
        ur: سرخ اور سفید
      correct: true
      why:
        ar: حجارته حمراء وبيضاء متناوبة
        en: its voussoirs alternate red and white
        ur: اس کے پتھر سرخ اور سفید متبادل ہیں
    - text:
        ar: الأزرق والأخضر
        en: blue and green
        ur: نیلا اور سبز
      correct: false
      why:
        ar: ليس أزرق وأخضر في أقواسه
        en: its arches are not blue and green
        ur: اس کی محرابیں نیلی سبز نہیں
    - text:
        ar: الأسود والذهبي
        en: black and gold
        ur: کالا اور سنہری
      correct: false
      why:
        ar: ليس أسود وذهبيًا فيه
        en: not black and gold
        ur: کالا اور سنہری نہیں
    - text:
        ar: الرمادي والبني
        en: grey and brown
        ur: سرمئی اور بھورا
      correct: false
      why:
        ar: ليس رماديًا وبنيًا
        en: not grey and brown
        ur: سرمئی اور بھورا نہیں
  - q:
      ar: ما الدور الذي بقي لمئذنته؟
      en: What survived of its minaret?
      ur: اس کے مینار سے کیا بچا؟
    options:
    - text:
        ar: برجها داخل الكاتدرائية
        en: its tower inside the cathedral
        ur: کیتھیڈرل کے اندر مینار
      correct: true
      why:
        ar: بقيت المنارة برجًا داخل الكنيسة
        en: the minaret remained a tower inside the church
        ur: مینار گرجا کے اندر مینار بنا رہا
    - text:
        ar: هدمت كليًا
        en: it was fully razed
        ur: مکمل مسمار ہو گیا
      correct: false
      why:
        ar: لم تهدم كليًا بل بقيت برجًا
        en: it was not razed; it survives as a tower
        ur: یہ مسمار نہیں ہوئی، مینار باقی ہے
    - text:
        ar: انقلبت قبةً
        en: it was turned into a dome
        ur: گنبد بنا دیا گیا
      correct: false
      why:
        ar: لم تنقلب قبة بل بقي برجًا
        en: it was not turned into a dome; it stayed a tower
        ur: یہ گنبد نہیں بنا، مینار رہا
    - text:
        ar: غرقت في نهر
        en: it sank into a river
        ur: دریا میں ڈوب گیا
      correct: false
      why:
        ar: لم تغرق بل بقيت قائمة
        en: it did not sink; it still stands
        ur: یہ ڈوبی نہیں، کھڑی ہے
  - q:
      ar: لماذا يُعدّ أعظم عمارة أندلسية؟
      en: Why is it al-Andalus's greatest building?
      ur: یہ الاندلس کی سب سے عظیم عمارت کیوں ہے؟
    options:
    - text:
        ar: لجماله وحجمه ونفوذه
        en: for its beauty, scale and influence
        ur: اس کی خوبصورتی، وسعت اور اثر کے لیے
      correct: true
      why:
        ar: جمع الحجم والفن وأثرًا عظيمًا في العمارة
        en: it joined scale, art and vast influence on building
        ur: اس نے وسعت، فن اور تعمیرات پر وسیع اثر جمع کیا
    - text:
        ar: لأنه أطول مبنى
        en: because it is tallest
        ur: کیونکہ یہ بلند ترین ہے
      correct: false
      why:
        ar: لم يشتهر بعلوّه بل بجماله
        en: it is famed for beauty, not height
        ur: یہ اونچائی سے نہیں، خوبصورتی سے مشہور ہے
    - text:
        ar: لأنه أقدم مسجد
        en: because it is the oldest mosque
        ur: کیونکہ یہ قدیم ترین مسجد ہے
      correct: false
      why:
        ar: ليس أقدم مسجد لكنه أعظمهن شهرة
        en: not the oldest mosque but the most famous
        ur: قدیم ترین نہیں مگر مشہور ترین مسجد ہے
    - text:
        ar: لأنه من ذهب
        en: because it is of gold
        ur: کیونکہ یہ سونے کا ہے
      correct: false
      why:
        ar: ليس من ذهب بل من حجر
        en: it is stone, not gold
        ur: یہ سونے کا نہیں، پتھر کا ہے
- id: alhambra
  anchor: building/alhambra
  band: researchers
  title:
    ar: قصر الحمراء
    en: The Alhambra
    ur: قصر الحمراء
  sixty:
    ar: 'الحمراء فوق غرناطة، آخر قصور الأندلس: مدينة قصرية بناها النصريون في القرنين الثالث عشر والرابع عشر فوق تلّة تطلّ على المدينة وسهولها. فيها صحن الأسود بنوافيره وعقوده الرقيقة، وقاعات السفراء بجدران الجصّ المنقوش الذي يبدو نقشًا على حرير لا على حجر، وسقوف المقرنص المتدلية كالأدمع النجمية. كُتب على جدرانها بالكوفي والنسخي شعرُ ابن زمرك: «لا غالب إلا الله» — شعار الدولة الأخيرة في الأندلس. سقطت غرناطة ١٤٩٢ وبقيت الحمراء محفوظة، فصارت متحف الجمال الإسلامي الأخير في أوروبا يزورها الملايين كل عام.  وهي اليوم أشهر آثار إسلامية في الغرب: يقف فيها الزائر أمام سؤال الحضارة — كيف تجعل الدولة ضعيفةً سياسيًّا جميلةً فنيًّا، وكيف تبقى القصور شاهدة حين ترحل الممالك.  وفي ليلها تبدو كما كانت دائمًا: قصر معلّق بين جبل وبحر، بين شرقٍ انقضى وغربٍ قائم، تروي أن النهايات يمكن أن تكون أجمل البدايات.'
    en: 'The Alhambra above Granada, al-Andalus''s last palaces: a palatial city the Nasrids built in the thirteenth and fourteenth centuries on a hill looking over town and plain. In it stand the Court of the Lions with its fountain and slender arches, the Ambassadors'' Hall with carved plaster seeming cut into silk not stone, and the muqarnas ceilings hanging like starry stalactites. On its walls Ibn Zamrak''s poems run in Kufic and cursive: ''There is no victor but God'' — the last Andalusi state''s motto. Granada fell in 1492 but the Alhambra survived, becoming Europe''s last museum of Islamic beauty, visited by millions each year.  She is today the west''s most famous Islamic monument: the visitor stands before civilization''s question — how a state weak in politics can be beautiful in art, and how palaces stay witnessing when kingdoms depart.'
    ur: 'غرناطہ کے اوپر الحمرا، اندلس کے آخری محلات: تیرہویں اور چودہویں صدی میں نصریوں نے پہاڑی پر شہر اور میدانوں کو دیکھتے ایک محلاتی شہر بسایا۔ اس میں شیروں کا صحن اپنے چشمے اور باریک محرابوں کے ساتھ، سفیروں کا ہال اپنے تراشیدہ پلستر کے ساتھ جو پتھر نہیں ریشم لگتا ہے، اور مقرنس کی چھتیں جو ستاروں جیسی لٹکتی ہیں۔ اس کی دیواروں پر ابن زمرک کی نظمیں کوفی اور نسخ میں چلتی ہیں: «اللہ کے سوا کوئی غالب نہیں» — اندلس کی آخری ریاست کا شعار۔ غرناطہ 1492 میں گرا مگر الحمرا بچی، اور یورپ میں اسلامی حسن کا آخری عجائب گھر بنا جسے ہر سال لاکھوں دیکھتے ہیں۔  آج وہ مغرب کا مشہور ترین اسلامی آثار ہے: زائر تہذیب کے سوال کے سامنے کھڑا ہوتا ہے — سیاست میں کمزور ریاست فن میں خوبصورت کیسے ہو سکتی ہے، اور ریاستیں جانے کے بعد محلات گواہ کیسے رہتے ہیں۔'
  glossary:
  - term:
      ar: الحمراء
      en: the Alhambra (the Red)
      ur: الحمراء (سرخ)
    gloss:
      ar: 'القصر الأحمر المطلّ فوق مدينة غرناطة'
      en: 'the Red Palace looking down over the city of Granada'
      ur: 'غرناطہ شہر کے اوپر نگاہ رکھنے والا سرخ محل'
  - term:
      ar: غرناطة
      en: Granada
      ur: غرناطہ
    gloss:
      ar: 'آخر مدن بني نصر الباقية في بلاد الأندلس'
      en: 'the Nasrids'' last remaining city in the land of al-Andalus'
      ur: 'اندلس کی سرزمین میں بنی نصر کا آخری باقی رہنے والا شہر'
  - term:
      ar: بنو نصر
      en: the Nasrids
      ur: بنو نصر
    gloss:
      ar: 'السلالة التي بناه وزخرفته على مدى قرنين'
      en: 'the dynasty that built and adorned it over two centuries'
      ur: 'وہ خاندان جس نے دو صدیوں میں اسے بنایا اور سجایا'
  - term:
      ar: صحن الأسود
      en: the Court of the Lions
      ur: شیروں کا صحن
    gloss:
      ar: 'صحنه المشهور بنافورته المحمولة على الأسود'
      en: 'its famous court with the fountain carried on the lions'
      ur: 'اس کا مشہور صحن جس کا فوارہ شیروں پر اٹھا ہوا ہے'
  - term:
      ar: الجص المزخرف
      en: carved plaster
      ur: تراشیدہ پلاسٹر
    gloss:
      ar: 'جصّه المحفور بعناية فائقة حتى صار يشبه الحرير'
      en: 'its plaster carved with utmost care until it resembled silk'
      ur: 'اس کی پلستر جو انتہائی احتیاط سے تراشی گئی یہاں تک کہ ریشم جیسی لگنے لگی'
  - term:
      ar: البلاط المزجج
      en: glazed tile
      ur: چمکیلی ٹائل
    gloss:
      ar: 'بلاطه المجلّى الملون القائم في القاعات الكبرى'
      en: 'its coloured glazed tiles standing inside the great halls'
      ur: 'عظیم ہالوں میں لگی اس کی رنگین جلی ہوئی ٹائلیں'
  - term:
      ar: الخط الكوفي والنسخي
      en: Kufic and cursive calligraphy
      ur: کوفی اور نسخی خطاطی
    gloss:
      ar: 'خطّاه — الكوفي القديم والجاري — في نقوشه'
      en: 'its two scripts — old Kufic and flowing cursive — in its inscriptions'
      ur: 'اس کے دو خطوط — پرانا کوفی اور بہتا جلی — اس کی نقوش میں'
  - term:
      ar: المقرنصات
      en: muqarnas (stalactite vaults)
      ur: مقرنصات
    gloss:
      ar: 'مقرنصاته المتدلية من السقوف كأنها عناقيد من نجوم'
      en: 'its muqarnas hanging from the ceilings, like clusters of stars'
      ur: 'چھتوں سے لٹکتے اس کے مقرنص، جیسے ستاروں کے جھرمٹ'
  - term:
      ar: قصر العمارات
      en: the Nasrid palaces
      ur: نصری محلات
    gloss:
      ar: 'قصور النصريين القائمة داخل أسواره الحصينة'
      en: 'the Nasrid palaces standing inside its fortified walls'
      ur: 'اس کی مضبوط دیواروں کے اندر کھڑے نصری محلات'
  - term:
      ar: الجنة
      en: the Generalife gardens
      ur: جنرلیف باغات
    gloss:
      ar: 'جنانه في المنتزه العلوي المعروف بالجنراليف'
      en: 'its gardens in the upper retreat known as the Generalife'
      ur: 'اونچے مقام پر اس کے باغات جنہیں جنرلیف کہتے ہیں'
  - term:
      ar: سقوط غرناطة
      en: the fall of Granada
      ur: غرناطہ کا سقوط
    gloss:
      ar: 'سقوط غرناطة سنة ١٤٩٢م ونهاية الحكم الإسلامي'
      en: 'the fall of Granada in 1492, ending Muslim rule there'
      ur: '1492ء میں غرناطہ کا سقوط اور وہاں مسلم حکمرانی کا خاتمہ'
  - term:
      ar: النافورة
      en: the fountain
      ur: چشمہ
    gloss:
      ar: 'نافورته الوسطى الجارية في قلب الصحن'
      en: 'its central fountain flowing at the heart of the court'
      ur: 'صحن کے دل میں بہتا اس کا مرکزی فوارہ'
  practice:
  - q:
      ar: أين يقع قصر الحمراء؟
      en: Where is the Alhambra?
      ur: قصر الحمراء کہاں ہے؟
    options:
    - text:
        ar: فوق غرناطة
        en: above Granada
        ur: غرناطہ کے اوپر
      correct: true
      why:
        ar: على رابية تطل على غرناطة
        en: on a hill overlooking Granada
        ur: غرناطہ پر نگاہ رکھنے والی پہاڑی پر
    - text:
        ar: في قرطبة
        en: in Cordoba
        ur: قرطبہ میں
      correct: false
      why:
        ar: قرطبة مدينة الجامع لا الحمراء
        en: Cordoba holds the mosque, not the Alhambra
        ur: قرطبہ میں جامع مسجد ہے، الحمراء نہیں
    - text:
        ar: في إشبيلية
        en: in Seville
        ur: اشبیلیہ میں
      correct: false
      why:
        ar: إشبيلية مدينة قصر آخر
        en: Seville has another palace
        ur: اشبیلیہ میں دوسرا محل ہے
    - text:
        ar: في طليطلة
        en: in Toledo
        ur: طليطلہ میں
      correct: false
      why:
        ar: طليطلة لا تضم الحمراء
        en: Toledo does not hold the Alhambra
        ur: طليطلہ میں الحمراء نہیں
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنایا؟
    options:
    - text:
        ar: بنو نصر
        en: the Nasrid dynasty
        ur: بنو نصر
      correct: true
      why:
        ar: سلاطين بنو نصر في القرن الرابع عشر
        en: the Nasrid sultans of the fourteenth century
        ur: چودہویں صدی کے نصری سلاطین
    - text:
        ar: الأمويون
        en: the Umayyads
        ur: اموی
      correct: false
      why:
        ar: الأمويون قبلهم بقرون
        en: the Umayyads came centuries earlier
        ur: اموی ان سے صدیاں پہلے تھے
    - text:
        ar: العباسيون
        en: the Abbasids
        ur: عباسی
      correct: false
      why:
        ar: العباسيون في المشرق لا الأندلس
        en: the Abbasids ruled the East, not al-Andalus
        ur: عباسی مشرق میں تھے، الاندلس میں نہیں
    - text:
        ar: الفاطميون
        en: the Fatimids
        ur: فاطمی
      correct: false
      why:
        ar: الفاطميون في مصر لا الأندلس
        en: the Fatimids ruled Egypt, not al-Andalus
        ur: فاطمی مصر میں تھے، الاندلس میں نہیں
  - q:
      ar: ما «صحن الأسود»؟
      en: What is the Court of the Lions?
      ur: شیروں کا صحن کیا ہے؟
    options:
    - text:
        ar: ساحة بنافورة على أسود
        en: a court with a lion-borne fountain
        ur: شیروں پر اٹھے چشمے والا صحن
      correct: true
      why:
        ar: نافورة تحملها أسود رخامية
        en: a fountain borne by marble lions
        ur: سنگ مرمر کے شیروں پر اٹھا چشمہ
    - text:
        ar: قفص أسود حية
        en: a cage of live lions
        ur: زندہ شیروں کا پنجرہ
      correct: false
      why:
        ar: لا أسود حية بل رخامية
        en: not live lions but marble ones
        ur: زندہ شیر نہیں، سنگ مرمر کے
    - text:
        ar: قاعة عرش
        en: a throne room
        ur: تخت کا کمرہ
      correct: false
      why:
        ar: الصحن ساحة لا قاعة عرش
        en: the court is a courtyard, not a throne hall
        ur: صحن ایک آنگن ہے، تخت کمرہ نہیں
    - text:
        ar: حديقة حيوان
        en: a menagerie
        ur: چڑیا گھر
      correct: false
      why:
        ar: ليست حديقة حيوان بل ساحة
        en: not a menagerie but a courtyard
        ur: چڑیا گھر نہیں، آنگن ہے
  - q:
      ar: ما المادة التي تكسو جدرانه؟
      en: What covers its walls?
      ur: اس کی دیواریں کس چیز سے ڈھکی ہیں؟
    options:
    - text:
        ar: جص منحوت وبلاط
        en: carved plaster and tile
        ur: تراشیدہ پلاسٹر اور ٹائل
      correct: true
      why:
        ar: جص وبلاط وخشب وكتابات
        en: plaster, tile, wood and inscriptions
        ur: پلاسٹر، ٹائل، لکڑی اور خطاطی
    - text:
        ar: الذهب الخالص
        en: pure gold
        ur: خالص سونا
      correct: false
      why:
        ar: لا ذهب في جدرانه
        en: no gold is on its walls
        ur: اس کی دیواروں پر سونا نہیں
    - text:
        ar: الرخام فقط
        en: marble only
        ur: صرف سنگ مرمر
      correct: false
      why:
        ar: ليس رخامًا فقط بل جص وبلاط
        en: not marble alone but plaster and tile
        ur: صرف سنگ مرمر نہیں، پلاسٹر اور ٹائل
    - text:
        ar: الفولاذ
        en: steel
        ur: فولاد
      correct: false
      why:
        ar: لا فولاذ في بنائه
        en: no steel in its fabric
        ur: اس کی تعمیر میں فولاد نہیں
  - q:
      ar: ما «المقرنصات»؟
      en: What are muqarnas?
      ur: مقرنصات کیا ہیں؟
    options:
    - text:
        ar: زخرفة كالخلية في القباب
        en: honeycomb vault ornament
        ur: گنبدوں میں چھتے نما زینت
      correct: true
      why:
        ar: زخرفة معلقة متدرجة في القباب
        en: tiered hanging ornament in the domes
        ur: گنبدوں میں لٹکتی تہ دار زینت
    - text:
        ar: أعمدة حجرية
        en: stone columns
        ur: پتھر کے ستون
      correct: false
      why:
        ar: ليست أعمدة بل زخرفة سقف
        en: not columns but ceiling ornament
        ur: ستون نہیں، چھت کی زینت
    - text:
        ar: أبواب خشبية
        en: wooden doors
        ur: لکڑی کے دروازے
      correct: false
      why:
        ar: ليست أبوابًا بل تاج قبّة
        en: not doors but a dome crown
        ur: دروازے نہیں، گنبد کا تاج
    - text:
        ar: نوافذ صغيرة
        en: small windows
        ur: چھوٹی کھڑکیاں
      correct: false
      why:
        ar: ليست نوافذ بل زخرفة
        en: not windows but ornament
        ur: کھڑکیاں نہیں، زینت
  - q:
      ar: متى انتهى الحكم الإسلامي في غرناطة؟
      en: When did Muslim rule in Granada end?
      ur: غرناطہ میں مسلم حکومت کب ختم ہوئی؟
    options:
    - text:
        ar: عام ١٤٩٢
        en: in 1492
        ur: 1492 میں
      correct: true
      why:
        ar: سقطت غرناطة عام ١٤٩٢
        en: Granada fell in 1492
        ur: غرناطہ 1492 میں گرا
    - text:
        ar: عام ١٢١٢
        en: in 1212
        ur: 1212 میں
      correct: false
      why:
        ar: ١٢١٢ معركة قبل سقوط غرناطة بكثير
        en: 1212 was a battle long before the fall
        ur: 1212 گرنے سے بہت پہلے کی لڑائی تھی
    - text:
        ar: عام ١٠٨٥
        en: in 1085
        ur: 1085 میں
      correct: false
      why:
        ar: ١٠٨٥ عام سقوط طليطلة
        en: 1085 is Toledo's fall, not Granada's
        ur: 1085 طليطلہ کے گرنے کا سال ہے
    - text:
        ar: عام ١٦١٤
        en: in 1614
        ur: 1614 میں
      correct: false
      why:
        ar: ١٦١٤ طرد لا سقوط للمدينة
        en: 1614 was an expulsion, not the city's fall
        ur: 1614 بے دخلی تھی، شہر کا سقوط نہیں
  - q:
      ar: ما «الجنة» في الحمراء؟
      en: What is the Generalife?
      ur: الحمراء میں «جنرلیف» کیا ہے؟
    options:
    - text:
        ar: بستان الصيف فوق القصر
        en: the summer garden above
        ur: اوپر گرمیوں کا باغ
      correct: true
      why:
        ar: بستان راحة فوق القصر
        en: a retreat garden above the palace
        ur: محل کے اوپر آرام کا باغ
    - text:
        ar: مسجد صغير
        en: a small mosque
        ur: چھوٹی مسجد
      correct: false
      why:
        ar: ليست مسجدًا بل بستانًا
        en: a garden, not a mosque
        ur: مسجد نہیں، باغ ہے
    - text:
        ar: برج حراسة
        en: a watchtower
        ur: چوکیدار مینار
      correct: false
      why:
        ar: ليست برجًا بل جنةً
        en: a garden, not a tower
        ur: مینار نہیں، باغ ہے
    - text:
        ar: سوق داخلي
        en: an inner market
        ur: اندرونی بازار
      correct: false
      why:
        ar: ليست سوقًا بل بستانًا
        en: a garden, not a market
        ur: بازار نہیں، باغ ہے
  - q:
      ar: ما الذي كُتب على جدرانه؟
      en: What is written on its walls?
      ur: اس کی دیواروں پر کیا لکھا ہے؟
    options:
    - text:
        ar: كتابات عربية
        en: Arabic calligraphy
        ur: عربی خطاطی
      correct: true
      why:
        ar: آيات وأدعية وأشعار في الخط العربي
        en: verses, prayers and poems in Arabic script
        ur: عربی خط میں آیات، دعائیں اور اشعار
    - text:
        ar: رموز رومانية
        en: Roman symbols
        ur: رومن علامتیں
      correct: false
      why:
        ar: لا رموز رومانية فيه
        en: no Roman symbols on it
        ur: اس پر رومن علامتیں نہیں
    - text:
        ar: خرائط قديمة
        en: old maps
        ur: پرانے نقشے
      correct: false
      why:
        ar: لا خرائط بل كتابات
        en: not maps but inscriptions
        ur: نقشے نہیں، خطاطی ہے
    - text:
        ar: رسوم بشرية
        en: human figures
        ur: انسانی تصویریں
      correct: false
      why:
        ar: لا رسوم بشرية في زخرفته
        en: no human figures in its ornament
        ur: اس کی زینت میں انسانی تصویریں نہیں
  - q:
      ar: ماذا حدث للقصر بعد ١٤٩٢؟
      en: What happened to the palace after 1492?
      ur: 1492 کے بعد محل کا کیا ہوا؟
    options:
    - text:
        ar: بقي وعُني به
        en: it survived and was kept
        ur: یہ بچا اور سنوارا گیا
      correct: true
      why:
        ar: بقي أجمل قصر إسلامي في الغرب
        en: it stayed the finest Islamic palace in the West
        ur: یہ مغرب کا خوبصورت ترین اسلامی محل رہا
    - text:
        ar: هُدم بالكامل
        en: it was fully razed
        ur: مکمل تباہ ہو گیا
      correct: false
      why:
        ar: لم يهدم بل بقي
        en: it was not razed; it survives
        ur: یہ تباہ نہیں ہوا، باقی ہے
    - text:
        ar: تحوّل إلى مسجد كبير
        en: it became a big mosque
        ur: بڑی مسجد بن گیا
      correct: false
      why:
        ar: لم يصبح مسجدًا بل قصرًا أثرًا
        en: it stayed a palace, not a mosque
        ur: یہ مسجد نہیں بنا، تاریخی محل رہا
    - text:
        ar: أُغرق بالماء
        en: it was flooded
        ur: پانی میں ڈبو دیا گیا
      correct: false
      why:
        ar: لم يُغرق بل بقي على رابيته
        en: it was not flooded; it still crowns its hill
        ur: یہ ڈبویا نہیں گیا، پہاڑی پر ہے
  - q:
      ar: لماذا يشتهر في فن العمارة؟
      en: Why is it famous in architecture?
      ur: یہ تعمیرات میں مشہور کیوں ہے؟
    options:
    - text:
        ar: لزخرفته الدقيقة ومائه
        en: for fine ornament and water
        ur: باریک زینت اور پانی کے لیے
      correct: true
      why:
        ar: جمع الجص والبلاط والكتابة والماء في تناسق نادر
        en: it joined plaster, tile, writing and water in rare harmony
        ur: اس نے پلاسٹر، ٹائل، خطاطی اور پانی کو نایاب ہم آہنگی میں جمع کیا
    - text:
        ar: لأطول برج فيه
        en: for its tallest tower
        ur: اس کے بلند ترین مینار کے لیے
      correct: false
      why:
        ar: لا برج فيه يفوق شهرته
        en: no tower of it is its fame
        ur: اس کا کوئی مینار اس کی شہرت نہیں
    - text:
        ar: لأقدم قبّة
        en: for the oldest dome
        ur: قدیم ترین گنبد کے لیے
      correct: false
      why:
        ar: ليس قديم قبّته بل جماله
        en: not oldest dome but its beauty
        ur: قدیم گنبد نہیں، اس کی خوبصورتی
    - text:
        ar: لأكبر مسجد
        en: for the largest mosque
        ur: بڑی مسجد کے لیے
      correct: false
      why:
        ar: ليس مسجدًا بل قصرًا
        en: it is a palace, not a mosque
        ur: یہ مسجد نہیں، محل ہے
- id: suleymaniye-mosque
  anchor: building/suleymaniye-mosque
  band: researchers
  title:
    ar: جامع السليمانية
    en: The Süleymaniye Mosque
    ur: سلیمانیہ مسجد
  sixty:
    ar: 'السليمانية في إسطنبول، مسجد سليمان القانوني الذي بناه سنان سنة ١٥٥٧: قبة عظيمة قطرها سبعة وعشرون مترًا تقف على أربعة دعائم، وأربع مآذن في الزوايا، وكلّية كاملة حولها — مدارس ومطبخ وحمّام ومقبرة — تجعل المسجد مركز حيّ لا بناءً منعزلًا. في الداخل الضوء يدخل من شبابيك رقيقة كأنه يصفّي نفسه، والخطّ بالقرآن يزيّن بلا مبالغة، والفراغ واسع هادئ. عدّها سنان صنعة «الكفاءة» بينما ترك «الكمال» للسليمية في أدرنة. وبقيت السليمانية رمز عصر سليمان كله: قانون وعمران وإيمان في مبنى واحد.  ومنها يُقرأ درس العمارة العثمانية: البساطة تصنع العظمة، والنور يصنع الروح، والمجموع يصنع المدينة — فلم تكن مسجدًا وحده بل حيًّا كاملًا بمسجدٍ في قلبه.  ولا يزال اسمها في لسان المدينة: يقول الأتراك «السليمانية» فيقصدون بها الزمن كله — سنان وسليمان والقرن السادس عشر في حجرٍ واحد.'
    en: 'The Suleymaniye in Istanbul, Suleiman the Lawgiver''s mosque Sinan built in 1557: a great dome twenty-seven metres across standing on four piers, four minarets at the corners, and a complete külliye around it — schools, a soup kitchen, a bath and tombs — making the mosque a living centre, not a lone building. Inside, light enters through delicate windows as if filtering itself, Qur''anic calligraphy adorns without excess, and the space is wide and calm. Sinan called it his work of ''competence'', keeping ''perfection'' for the Selimiye in Edirne. The Suleymaniye stayed the emblem of Suleiman''s whole age: law, building and faith in one structure.  From it the Ottoman lesson is read: simplicity makes greatness, light makes the spirit, and the whole makes the city — it was never a mosque alone but a whole quarter with a mosque at its heart.'
    ur: 'استنبول میں سلیمانیہ، سلطان سلیمان قانونی کی مسجد جو سنان نے 1557 میں بنائی: ستائیس میٹر قطر کا عظیم گنبد چار ستونوں پر، گوشوں میں چار مینار، اور گرد مکمل کلیہ — مدارس، لنگر خانہ، حمام اور مقبرے — جو مسجد کو تنہا عمارت نہیں زندہ مرکز بناتے ہیں۔ اندر باریک کھڑکیوں سے روشنی گزرتی ہے جیسے خود کو چھان رہی ہو، قرآنی خطاطی بغیر زیادتی آراستہ ہے، اور فضا کشادہ اور پرسکون ہے۔ سنان نے اسے اپنی «مہارت» کا کام کہا اور «کمال» ادرنہ کی سلیمیہ کے لیے رکھا۔ سلیمانیہ سلیمان کے پورے دور کا نشان رہی: قانون، تعمیر اور ایمان ایک ہی عمارت میں۔  اس سے عثمانی سبق پڑھا جاتا ہے: سادگی عظمت بناتی ہے، روشنی روح، اور مکمل مجموعہ شہر — وہ صرف مسجد نہ تھی بل مسجد کو دل میں رکھنے والا پورا محلہ۔'
  glossary:
  - term:
      ar: سليمان القانوني
      en: Süleyman the Lawgiver
      ur: سلیمان قانونی
    gloss:
      ar: 'السلطان الذي أمر ببنائها في أوج الدولة'
      en: 'the sultan who ordered her building at the empire''s height'
      ur: 'وہ سلطان جس نے سلطنت کے عروج پر اس کی تعمیر کا حکم دیا'
  - term:
      ar: سنان
      en: Sinan
      ur: سنان
    gloss:
      ar: 'المهندس الذي صمّمها بعبقرية نادرة في عصره'
      en: 'the architect who designed her with a genius rare in his age'
      ur: 'وہ معمار جس نے اپنے زمانے میں نایاب مہارت سے اسے ڈھالا'
  - term:
      ar: إسطنبول
      en: Istanbul
      ur: استنبول
    gloss:
      ar: 'مدينتها القائمة فوق تلال القسطنطينية السبع'
      en: 'her city, standing over the seven hills of Constantinople'
      ur: 'اس کا شہر، قسطنطنیہ کی سات پہاڑیوں پر قائم'
  - term:
      ar: القبة الواسعة
      en: the great dome
      ur: وسیع گنبد
    gloss:
      ar: 'قبتها الكبرى التي يبلغ قطرها سبعة وعشرين مترًا كاملة'
      en: 'her great dome, whose full span reaches twenty-seven metres'
      ur: 'اس کا عظیم گنبد جس کا مکمل قطر ستائیس میٹر تک پہنچتا ہے'
  - term:
      ar: المآذن الأربع
      en: the four minarets
      ur: چار مینار
    gloss:
      ar: 'مآذنها الأربع القائمة عند أركانها الأربعة'
      en: 'her four minarets, rising at her four corners'
      ur: 'اس کے چار مینار، اس کے چاروں کونوں پر اٹھتے ہوئے'
  - term:
      ar: الكلية
      en: the külliye
      ur: کلیے
    gloss:
      ar: 'مجمعها الكامل من المباني والمرافق العامة'
      en: 'her complete complex of buildings and public services'
      ur: 'اس کی عمارتوں اور عوامی سہولتوں کا مکمل مجموعہ'
  - term:
      ar: مطبخ الفقراء
      en: the soup kitchen
      ur: فقیروں کی باورچی خانہ
    gloss:
      ar: 'مطبخها الذي كان يطعم الفقراء كل يوم بلا انقطاع'
      en: 'her kitchen, which fed the poor every day without pause'
      ur: 'اس کا باورچی خانہ جو ہر روز بغیر رکے غریبوں کو کھلاتا تھا'
  - term:
      ar: المدارس
      en: the schools
      ur: مدارس
    gloss:
      ar: 'مدارسها السبع القائمة داخل الكلية'
      en: 'her seven schools standing within the külliye'
      ur: 'کلیہ کے اندر قائم اس کے سات مدرسے'
  - term:
      ar: الحمّام
      en: the bath
      ur: حمام
    gloss:
      ar: 'حمّامها العامر القائم في المجمع'
      en: 'her busy bath standing within the complex'
      ur: 'مجموعے میں قائم اس کا آباد حمام'
  - term:
      ar: الشبابيك العازلة
      en: the quiet windows
      ur: خاموش کھڑکیاں
    gloss:
      ar: 'نوافذها الرقيقة التي تدخل النور إلى داخلها الواسع'
      en: 'her delicate windows, letting light stream into her wide interior'
      ur: 'اس کی نازک کھڑکیاں جو اس کے وسیع اندرونی حصے میں روشنی بہاتی ہیں'
  - term:
      ar: ١٥٥٧
      en: '1557'
      ur: 1557ء
    gloss:
      ar: 'سنة إتمامها في عهد سليمان القانوني العظيم'
      en: 'her completion year under Suleiman the great Lawgiver'
      ur: 'عظیم سلیمان قانونی کے عہد میں اس کی تکمیل کا سال'
  - term:
      ar: التوازن
      en: balance
      ur: توازن
    gloss:
      ar: 'توازنها الذي أعجب به سنان نفسه وأثنى عليه'
      en: 'her balance, which Sinan himself admired and praised'
      ur: 'اس کا توازن جس کی سنان خود بھی تعریف کرتا تھا'
  practice:
  - q:
      ar: من أمر ببناء الجامع؟
      en: Who ordered the mosque built?
      ur: مسجد بنانے کا حکم کس نے دیا؟
    options:
    - text:
        ar: سليمان القانوني
        en: Süleyman the Lawgiver
        ur: سلیمان قانونی
      correct: true
      why:
        ar: سليمان أمر سنانًا ببنائه
        en: Süleyman commanded Sinan to build it
        ur: سلیمان نے سنان کو حکم دیا
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: false
      why:
        ar: محمد الفاتح قبله جيلان
        en: Mehmed came two generations before
        ur: محمد فاتح دو نسلیں پہلے تھا
    - text:
        ar: سليم الثاني
        en: Selim II
        ur: سلیم دوم
      correct: false
      why:
        ar: سليم الثاني ابنه لا آمره
        en: Selim II was his son, not the patron
        ur: سلیم دوم اس کا بیٹا تھا، آمر نہیں
    - text:
        ar: عبد المجيد
        en: Abdülmecid
        ur: عبدالمجید
      correct: false
      why:
        ar: عبد المجيد بعده بقرون
        en: Abdülmecid came centuries later
        ur: عبدالمجید صدیاں بعد تھا
  - q:
      ar: من مهندسه؟
      en: Who was its architect?
      ur: اس کا معمار کون تھا؟
    options:
    - text:
        ar: سنان
        en: Sinan
        ur: سنان
      correct: true
      why:
        ar: سنان المهندس العثماني الأعظم
        en: Sinan, the greatest Ottoman architect
        ur: سنان، عثمانیوں کا سب سے بڑا معمار
    - text:
        ar: داود آغا
        en: Davud Agha
        ur: داؤد آغا
      correct: false
      why:
        ar: داود آغا مهندس آخر
        en: Davud Agha was another architect
        ur: داؤد آغا دوسرا معمار تھا
    - text:
        ar: أحمد إسحاق
        en: Ahmed Ishaq
        ur: احمد اسحاق
      correct: false
      why:
        ar: لا علاقة له به
        en: no link to him
        ur: اس سے کوئی تعلق نہیں
    - text:
        ar: الكافيه جي
        en: Kafiyeji
        ur: کافیجی
      correct: false
      why:
        ar: اسم غير معروف للمسجد
        en: not this mosque's name
        ur: اس مسجد کا نام نہیں
  - q:
      ar: متى أُنجز؟
      en: When was it finished?
      ur: یہ کب مکمل ہوئی؟
    options:
    - text:
        ar: عام ١٥٥٧
        en: in 1557
        ur: 1557 میں
      correct: true
      why:
        ar: انتهى البناء عام ١٥٥٧
        en: construction ended in 1557
        ur: تعمیر 1557 میں مکمل ہوئی
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ١٤٥٣ عام فتح إسطنبول لا بنائه
        en: 1453 is the conquest year, not its building
        ur: 1453 فتح کا سال ہے، تعمیر کا نہیں
    - text:
        ar: عام ١٦١٦
        en: in 1616
        ur: 1616 میں
      correct: false
      why:
        ar: ١٦١٦ عام المسجد الأزرق لا السليمانية
        en: 1616 is the Blue Mosque's year
        ur: 1616 بلیو مسجد کا سال ہے
    - text:
        ar: عام ١٩٢٣
        en: in 1923
        ur: 1923 میں
      correct: false
      why:
        ar: ١٩٢٣ عام الجمهورية لا بنائه
        en: 1923 is the republic's year
        ur: 1923 جمہوریت کا سال ہے
  - q:
      ar: كم عدد مآذنه؟
      en: How many minarets does it have?
      ur: اس کے کتنے مینار ہیں؟
    options:
    - text:
        ar: أربعة
        en: four
        ur: چار
      correct: true
      why:
        ar: أربع مآذن عند زواياه
        en: four minarets at its corners
        ur: کونوں پر چار مینار
    - text:
        ar: اثنان
        en: two
        ur: دو
      correct: false
      why:
        ar: له أربعة لا اثنان
        en: it has four, not two
        ur: اس کے چار ہیں، دو نہیں
    - text:
        ar: ستة
        en: six
        ur: چھ
      correct: false
      why:
        ar: ستة مآذن للأزرق لا له
        en: six is the Blue Mosque's count
        ur: چھ بلیو مسجد کے ہیں
    - text:
        ar: واحد
        en: one
        ur: ایک
      correct: false
      why:
        ar: له أربعة لا واحد
        en: it has four, not one
        ur: اس کے چار ہیں، ایک نہیں
  - q:
      ar: ما «الكلية»؟
      en: What is the külliye?
      ur: کلیے کیا ہے؟
    options:
    - text:
        ar: مجمع خدمات حول المسجد
        en: a service complex around the mosque
        ur: مسجد کے گرد خدمات کا مجموعہ
      correct: true
      why:
        ar: مدارس ومستشفى ومطبخ وحمّام حوله
        en: schools, hospital, kitchen and bath around it
        ur: اس کے گرد اسکول، شفاخانہ، باورچی خانہ اور حمام
    - text:
        ar: قبة صغيرة
        en: a small dome
        ur: چھوٹا گنبد
      correct: false
      why:
        ar: ليست قبة بل مجمع
        en: not a dome but a complex
