      en: al-Tusi
      ur: طوسی
    gloss:
      ar: 'العالم الذي كتب في مراغة'
      en: 'the scholar who wrote at Maragha'
      ur: 'وہ عالم جس نے مراغہ میں لکھا'
  - term:
