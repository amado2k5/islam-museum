      en: the musket
      ur: بندوق
    gloss:
      ar: 'البندق اليدوي في المعارك'
      en: 'the hand gun in battles'
      ur: 'لڑائیوں میں ہاتھ کی بندوق'
  - term:
      ar: المدفع
      en: the cannon
      ur: توپ
    gloss:
      ar: 'السلاح الثقيل الذي هدم الجدران'
