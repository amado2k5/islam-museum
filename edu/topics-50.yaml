      en: planetary motion
      ur: سیاروں کی حرکت
    gloss:
      ar: 'حركة الكواكب التي شرحوها'
      en: 'the planets'' motion they explained'
      ur: 'وہ سیاروں کی حرکت جسے انہوں نے سمجھایا'
  - term:
      ar: التقويم
      en: calendar reckoning
      ur: تقویم
    gloss:
      ar: 'تقسيم السنة والوقت'
      en: 'the division of year and time'
      ur: 'سال اور وقت کی تقسیم'
  - term:
      ar: الملاحة
      en: navigation
      ur: سمندری رہنمائی
    gloss:
      ar: 'فنّ السفر بالنجوم عبر البحار'
      en: 'the art of star-sailing across the seas'
      ur: 'سمندروں پر ستاروں سے سفر کا فن'
  practice:
  - q:
      ar: ما المرصد؟
      en: What is an observatory?
