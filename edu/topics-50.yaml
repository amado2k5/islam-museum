        en: it joined the dome's beauty and the complex's services
        ur: اس نے گنبد کی خوبصورتی اور کلیے کی خدمات جمع کیں
    - text:
        ar: لأنها أقدم مسجد
        en: for being the oldest mosque
        ur: قدیم ترین مسجد ہونے کے لیے
      correct: false
      why:
        ar: ليست أقدم المساجد
        en: it is not the oldest mosque
        ur: یہ قدیم ترین مسجد نہیں
    - text:
        ar: لأنها من ذهب
        en: for being golden
        ur: سونے کی ہونے کے لیے
      correct: false
      why:
        ar: ليست من ذهب بل حجر
        en: it is stone, not gold
        ur: یہ سونے کی نہیں، پتھر کی ہے
    - text:
        ar: لأكبر مسجد في العالم
        en: for being the world's largest
        ur: دنیا کی بڑی مسجد ہونے کے لیے
      correct: false
      why:
        ar: ليست أكبر مسجد في العالم
        en: it is not the world's largest
        ur: یہ دنیا کی بڑی مسجد نہیں
- id: blue-mosque
  anchor: building/blue-mosque
  band: researchers
  title:
    ar: المسجد الأزرق
    en: The Blue Mosque
    ur: بلیو مسجد
  sixty:
    ar: 'مسجد السلطان أحمد في إسطنبول، المسمّى المسجد الأزرق لقراميده النيلية من أزنيك: بناه الصدفكار محمد آغا تلميذ سنان بين ١٦٠٩ و١٦١٦ في مواجهة آيا صوفيا. يحمل ستّ مآذن — وهو عدد لم تتجاسر عليه مساجد أخرى حتى أُضيفت سابعة للحرم المكي — وقبّة ترتفع على أربعة أعمدة عظيمة تحيط بها أنصاف قباب متدرّجة تُدخل النور من مئات النوافذ. والقراميد الزرقاء التي تكسو جدرانه الداخلية هي آخر ازدهار خزف أزنيك: توليب وورود وسرو على أزرق وأبيض. وبقي الجامع الأمبراطوري الأخير في سلسلة العمارة العثمانية الكلاسيكية — ردّ القرن السابع عشر على سؤال آيا صوفيا القديم.  وفي صحنها يلتقي التاريخان: البيزنطي في مواجهتها والعثماني في داخلها، فهي الجواب الذي أجاب به العثمانيون على ألف سنة من آيا صوفيا، ولغة المسجد نفسها تقول: نحن الورثة هنا.  وما تزال إلى اليوم مسجدًا يُصلّى فيه، ولا تزال زرقة قراميدها تتلألأ في أعين الزائرين ولو مرّت قرون.'
    en: 'The Sultan Ahmed mosque in Istanbul, called the Blue Mosque for its Iznik tiles: built by Sedefkar Mehmed Agha, Sinan''s pupil, between 1609 and 1616, facing Hagia Sophia. It carries six minarets — a number no other mosque dared until the sanctuary at Mecca gained a seventh — and a dome rising on four vast piers wrapped in cascading half-domes that let light in through hundreds of windows. The blue tiles cladding its inner walls are Iznik ceramic''s last flowering: tulips, roses and cypresses on blue and white. It stayed the last imperial mosque of classical Ottoman architecture — the seventeenth century''s answer to Hagia Sophia''s old question.  In her court two histories meet: the Byzantine across from her and the Ottoman inside, for she is the answer the Ottomans gave to a thousand years of Hagia Sophia, and the mosque''s own language says: we are the heirs here.'
    ur: 'استنبول میں سلطان احمد کی مسجد، جو اپنی ازنک کی نیلی ٹائلوں کے سبب نیلی مسجد کہلاتی ہے: سنان کے شاگرد صدفکار محمد آغا نے 1609 اور 1616 کے درمیان آیا صوفیا کے سامنے بنائی۔ اس کے چھ مینار ہیں — وہ تعداد جس پر کوئی اور مسجد جرات نہ کر سکی یہاں تک کہ حرمِ مکہ میں ساتواں مینار اضافہ ہوا — اور چار بڑے ستونوں پر اٹھا گنبد جسے مسلسل نصف گنبد گھیرے ہیں جو سینکڑوں کھڑکیوں سے روشنی داخل کرتے ہیں۔ اندرونی دیواروں پر نیلی ٹائلیں ازنک مٹی کے برتن کی آخری بہار ہیں: نیلے اور سفید پر لالہ، گلاب اور سرو۔ یہ کلاسیکی عثمانی فن کی آخری شاہی مسجد رہی — سترہویں صدی کا آیا صوفیا کے پرانے سوال کا جواب۔  اس کے صحن میں دو تاریخیں ملتی ہیں: سامنے بازنطینی اور اندر عثمانی، کیونکہ یہ ہزار برس کی آیا صوفیا کو عثمانیوں کا جواب ہے، اور مسجد کی اپنی زبان کہتی ہے: یہاں ہم وارث ہیں۔'
  glossary:
  - term:
      ar: السلطان أحمد الأول
      en: Sultan Ahmed I
      ur: سلطان احمد اول
    gloss:
      ar: 'السلطان الذي أمر بها وهو لا يزال في شبابه'
      en: 'the sultan who ordered her while still in his youth'
      ur: 'وہ سلطان جس نے ابھی جوانی میں ہی اس کا حکم دیا'
  - term:
      ar: إزنيق
      en: Iznik
      ur: ازنق
    gloss:
      ar: 'بلدة القرميد التي كست جدرانها من الداخل بالبلاط'
      en: 'the tile town that dressed her inner walls with its tiles'
      ur: 'ٹائلوں کا شہر جس نے اس کی اندرونی دیواریں اپنی ٹائلوں سے سجائیں'
  - term:
      ar: البلاط الأزرق
      en: the blue tiles
      ur: نیلی ٹائلیں
    gloss:
      ar: 'قراميدها الزرقاء — سرّ اسمها المشهور'
      en: 'her blue tiles — the secret of her famous name'
      ur: 'اس کی نیلی ٹائلیں — اس کے مشہور نام کا راز'
  - term:
      ar: ستّ مآذن
      en: six minarets
      ur: چھ مینار
    gloss:
      ar: 'مآذنها الست — عدد لم تبلغه مساجد عثمانية قبلها'
      en: 'her six minarets — a number no Ottoman mosque before her reached'
      ur: 'اس کے چھ مینار — وہ تعداد جو اس سے پہلے کوئی عثمانی مسجد نہ پہنچی'
  - term:
      ar: آيا صوفيا
      en: Hagia Sophia
      ur: آیا صوفیا
    gloss:
      ar: 'العمارة البيزنطية العظيمة التي تواجهها عبر الساحة الكبرى'
      en: 'the great Byzantine building facing her across the great square'
      ur: 'وہ عظیم بازنطینی عمارت جو عظیم چوک کے پار اس کے سامنے ہے'
  - term:
      ar: أنصاف القباب
      en: the half-domes
      ur: نصف گنبد
    gloss:
      ar: 'القباب النصفية الصغيرة المحيطة بالقبة الكبرى'
      en: 'the small half-domes gathered around the great dome above'
      ur: 'اوپر عظیم گنبد کے گرد جمع چھوٹے نصف گنبد'
  - term:
      ar: ١٦١٦
      en: '1616'
      ur: 1616ء
    gloss:
      ar: 'سنة إتمامها في عهد السلطان أحمد الأول'
      en: 'her completion year under Sultan Ahmed the First'
      ur: 'سلطان احمد اول کے عہد میں اس کی تکمیل کا سال'
  - term:
      ar: سدف خارجه
      en: Sedefkar Mehmed Agha
      ur: سدفکار محمد آغا
    gloss:
      ar: 'المهندس الذي بناها من تلاميذ سنان الكبار'
      en: 'the engineer who built her, one of Sinan''s senior pupils'
      ur: 'وہ انجینئر جس نے اسے بنایا، سنان کے بزرگ شاگردوں میں سے'
  - term:
      ar: القرن السابع عشر
      en: the seventeenth century
      ur: سترہویں صدی
    gloss:
      ar: 'القرن السابع عشر الذي بُنيت فيه بعد عصر سنان'
      en: 'the seventeenth century, in which she was built after Sinan''s age'
      ur: 'سترہویں صدی، جس میں وہ سنان کے زمانے کے بعد بنی'
  - term:
      ar: المسجد السلطاني
      en: the imperial mosque
      ur: شاہی مسجد
    gloss:
      ar: 'اللقب الذي يُطلق على المساجد السلطانية الكبرى في الدولة'
      en: 'the title given to the great imperial mosques of the state'
      ur: 'وہ لقب جو سلطنت کی عظیم شاہی مسجدوں کو دیا جاتا ہے'
  - term:
      ar: النافورة الداخلية
      en: the inner fountain
      ur: اندرونی چشمہ
    gloss:
      ar: 'نافورتها الجارية في قلب صحنها الواسع'
      en: 'her flowing fountain at the heart of her wide courtyard'
      ur: 'اس کے وسیع صحن کے دل میں بہتا اس کا فوارہ'
  - term:
      ar: الحجر والرخام
      en: stone and marble
      ur: پتھر اور سنگ مرمر
    gloss:
      ar: 'حجارتها ورخامها التي جُلبت من أنحاء الدولة الواسعة'
      en: 'her stone and marble, gathered from across the wide empire'
      ur: 'اس کا پتھر اور سنگ مرمر، وسیع سلطنت کے کونے کونے سے جمع کیا گیا'
  practice:
  - q:
      ar: في أيّ مدينة يقع؟
      en: In which city is it?
      ur: یہ کس شہر میں ہے؟
    options:
    - text:
        ar: إسطنبول
        en: Istanbul
        ur: استنبول
      correct: true
      why:
        ar: في إسطنبول قبالة آيا صوفيا
        en: in Istanbul, facing Hagia Sophia
        ur: استنبول میں، آیا صوفیا کے سامنے
    - text:
        ar: بورصة
        en: Bursa
        ur: بورصہ
      correct: false
      why:
        ar: بورصة مدينة أخرى
        en: Bursa is another city
        ur: بورصہ دوسرا شہر ہے
    - text:
        ar: أدرنة
        en: Edirne
        ur: ادرنہ
      correct: false
      why:
        ar: أدرنة فيها مسجد سليم
        en: Edirne holds the Selimiye
        ur: ادرنہ میں سلیمیہ مسجد ہے
    - text:
        ar: أنقرة
        en: Ankara
        ur: انقرہ
      correct: false
      why:
        ar: أنقرة ليست موضعه
        en: Ankara is not its site
        ur: انقرہ اس کی جگہ نہیں
  - q:
      ar: من بناه؟
      en: Who built it?
      ur: اسے کس نے بنوایا؟
    options:
    - text:
        ar: السلطان أحمد الأول
        en: Sultan Ahmed I
        ur: سلطان احمد اول
      correct: true
      why:
        ar: أحمد الأول أمر ببنائه
        en: Ahmed I ordered its building
        ur: احمد اول نے بنانے کا حکم دیا
    - text:
        ar: سليمان القانوني
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان بنا السليمانية لا هذا
        en: Süleyman built the Süleymaniye, not this
        ur: سلیمان نے سلیمانیہ بنوائی، یہ نہیں
    - text:
        ar: محمد الفاتح
        en: Mehmed II
        ur: محمد فاتح
      correct: false
      why:
        ar: محمد الفاتح قبله بقرون
        en: Mehmed II came centuries before
        ur: محمد فاتح صدیاں پہلے تھا
    - text:
        ar: عبد الحميد
        en: Abdülhamid
        ur: عبدالحمید
      correct: false
      why:
        ar: عبد الحميد بعده بقرون
        en: Abdülhamid came centuries later
        ur: عبدالحمید صدیاں بعد تھا
  - q:
      ar: لماذا سُمّي «الأزرق»؟
      en: Why is it called 'Blue'?
      ur: اسے «بلیو» کیوں کہا جاتا ہے؟
    options:
    - text:
        ar: لبلاطه الإزنيقي الأزرق
        en: for its blue Iznik tiles
        ur: نیلی ایزنق ٹائلوں کے لیے
      correct: true
      why:
        ar: البلاط الأزرق يكسو جدرانه العليا
        en: blue tiles clad its upper walls
        ur: نیلی ٹائلیں اوپری دیواریں ڈھانپتی ہیں
    - text:
        ar: لمائه الأزرق
        en: for blue water
        ur: نیلے پانی کے لیے
      correct: false
      why:
        ar: لا ماء أزرق اشتهر به
        en: no blue water is its fame
        ur: نیلے پانی سے مشہور نہیں
    - text:
        ar: لسمائه فقط
        en: for its sky only
        ur: صرف آسمان کے لیے
      correct: false
      why:
        ar: لون السماء لا سبب التسمية
        en: the sky's colour is not the reason
        ur: آسمان کا رنگ وجہ نہیں
    - text:
        ar: لحجره الأزرق
        en: for blue stone
        ur: نیلے پتھر کے لیے
      correct: false
      why:
        ar: حجره رمادي بل البلاط أزرق
        en: its stone is grey; the tiles are blue
        ur: پتھر سرمئی ہے، ٹائلیں نیلی
  - q:
      ar: كم عدد مآذنه؟
      en: How many minarets?
      ur: اس کے کتنے مینار ہیں؟
    options:
    - text:
        ar: ستّة
        en: six
        ur: چھ
      correct: true
      why:
        ar: ستّ مآذن لم يُرَ مثلها
        en: six minarets, a count unseen before
        ur: چھ مینار، پہلے نہ دیکھا ہوا عدد
    - text:
        ar: أربعة
        en: four
        ur: چار
      correct: false
      why:
        ar: أربعة للسليمانية لا له
        en: four is the Süleymaniye's count
        ur: چار سلیمانیہ کے ہیں
    - text:
        ar: اثنان
        en: two
        ur: دو
      correct: false
      why:
        ar: له ستة لا اثنان
        en: it has six, not two
        ur: اس کے چھ ہیں، دو نہیں
    - text:
        ar: ثمانية
        en: eight
        ur: آٹھ
      correct: false
      why:
        ar: لا مسجد له ثمانية هنا
        en: no mosque here has eight
        ur: یہاں کسی مسجد کے آٹھ نہیں
  - q:
      ar: متى أُنجز؟
      en: When was it finished?
      ur: یہ کب مکمل ہوئی؟
    options:
    - text:
        ar: عام ١٦١٦
        en: in 1616
        ur: 1616 میں
      correct: true
      why:
        ar: انتهى البناء عام ١٦١٦
        en: construction ended in 1616
        ur: تعمیر 1616 میں مکمل ہوئی
    - text:
        ar: عام ١٥٥٧
        en: in 1557
        ur: 1557 میں
      correct: false
      why:
        ar: ١٥٥٧ عام السليمانية لا الأزرق
        en: 1557 is the Süleymaniye's year
        ur: 1557 سلیمانیہ کا سال ہے
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: false
      why:
        ar: ١٤٥٣ عام الفتح لا بنائه
        en: 1453 is the conquest year
        ur: 1453 فتح کا سال ہے
    - text:
        ar: عام ١٧٥٥
        en: in 1755
        ur: 1755 میں
      correct: false
      why:
        ar: ١٧٥٥ متأخر عن بنائه
        en: 1755 is later than its building
        ur: 1755 اس کی تعمیر سے بعد ہے
  - q:
      ar: ما «البلاط الإزنيقي»؟
      en: What is Iznik tile?
      ur: ایزنق ٹائل کیا ہے؟
    options:
    - text:
        ar: خزف أزرق من إزنيق
        en: blue glazed tile from Iznik
        ur: ازنق کی نیلی چمکیلی ٹائل
      correct: true
      why:
        ar: خزف ملون صنعته مدينة إزنيق
        en: coloured glazed tile made in Iznik
        ur: ازنق شہر کی بنائی رنگین چمکیلی ٹائل
    - text:
        ar: رخام إيطالي
        en: Italian marble
        ur: اطالوی سنگ مرمر
      correct: false
      why:
        ar: ليس رخامًا بل خزف
        en: not marble but glazed tile
        ur: سنگ مرمر نہیں، چمکیلی ٹائل
    - text:
        ar: زجاج معشق
        en: stained glass
        ur: رنگین شیشہ
      correct: false
      why:
        ar: ليس زجاجًا بل بلاط
        en: not glass but tile
        ur: شیشہ نہیں، ٹائل
    - text:
        ar: ذهب مصفح
        en: gilded gold
        ur: مطلي سونا
      correct: false
      why:
        ar: ليس ذهبًا بل خزف أزرق
        en: not gold but blue tile
        ur: سونا نہیں، نیلی ٹائل
  - q:
      ar: من مهندسه؟
      en: Who was its architect?
      ur: اس کا معمار کون تھا؟
    options:
    - text:
        ar: سدف خارجه تلميذ سنان
        en: Sedefkar Mehmed Agha, Sinan's pupil
        ur: سدفکار محمد آغا، سنان کا شاگرد
      correct: true
      why:
        ar: بناه تلميذ سنان محمد آغا
        en: Sinan's pupil Mehmed Agha built it
        ur: سنان کے شاگرد محمد آغا نے بنایا
    - text:
        ar: سنان نفسه
        en: Sinan himself
        ur: خود سنان
      correct: false
      why:
        ar: سنان مات قبل بنائه
        en: Sinan died before its building
        ur: سنان اس کی تعمیر سے پہلے فوت ہوا
    - text:
        ar: مهندس فرنسي
        en: a French architect
        ur: فرانسیسی معمار
      correct: false
      why:
        ar: ليس فرنسيًا بل عثمانيًا
        en: an Ottoman architect, not French
        ur: عثمانی معمار، فرانسیسی نہیں
    - text:
        ar: داود آغا
        en: Davud Agha
        ur: داؤد آغا
      correct: false
      why:
        ar: سدف خارجه هو المهندس
        en: Sedefkar is the architect
        ur: سدفکار معمار ہے
  - q:
      ar: ما البناء الذي يقف قبالته؟
      en: What building does it face?
      ur: یہ کس عمارت کے سامنے ہے؟
    options:
    - text:
        ar: آيا صوفيا
        en: Hagia Sophia
        ur: آیا صوفیا
      correct: true
      why:
        ar: يقف قبالة آيا صوفيا
        en: it stands facing Hagia Sophia
        ur: آیا صوفیا کے سامنے کھڑی ہے
    - text:
        ar: قصر طوب قابي
        en: Topkapi Palace
        ur: توپ قاپی محل
      correct: false
      why:
        ar: القصر قريب لا مقابل
        en: the palace is near, not facing
        ur: محل قریب ہے، سامنے نہیں
    - text:
        ar: المسجد السليمانية
        en: the Süleymaniye
        ur: سلیمانیہ
      correct: false
      why:
        ar: السليمانية في جهة أخرى
        en: the Süleymaniye is elsewhere
        ur: سلیمانیہ دوسری جگہ ہے
    - text:
        ar: قلعة روملي
        en: Rumeli fortress
        ur: روملی قلعہ
      correct: false
      why:
        ar: القلعة على البوسفور بعيدة
        en: the fortress is far on the Bosporus
        ur: قلعہ باسفورس پر دور ہے
  - q:
      ar: ما الذي يحيط قبته الكبرى؟
      en: What rings its great dome?
      ur: اس کے بڑے گنبد کو کیا گھیرتا ہے؟
    options:
    - text:
        ar: أنصاف قباب متدرجة
        en: tiered half-domes
        ur: درجہ دار نصف گنبد
      correct: true
      why:
        ar: قباب أنصاف تحيط القبة وتعينها
        en: half-domes ring and bear the great dome
        ur: نصف گنبد بڑے گنبد کو گھیرے اور سہارا دیتے ہیں
    - text:
        ar: أعمدة ذهبية
        en: golden columns
        ur: سنہری ستون
      correct: false
      why:
        ar: لا ذهب بل قباب أنصاف
        en: no gold; half-domes
        ur: سونا نہیں، نصف گنبد
    - text:
        ar: أبراج ساعة
        en: clock towers
        ur: گھڑی کے مینار
      correct: false
      why:
        ar: لا أبراج ساعة فيه
        en: no clock towers on it
        ur: اس پر گھڑی کے مینار نہیں
    - text:
        ar: تماثيل رخامية
        en: marble statues
        ur: سنگ مرمر کے مجسمے
      correct: false
      why:
        ar: لا تماثيل في المسجد
        en: no statues in the mosque
        ur: مسجد میں مجسمے نہیں
  - q:
      ar: ما حاله اليوم؟
      en: What is it today?
      ur: آج یہ کیا ہے؟
    options:
    - text:
        ar: مسجد عامر ومعلم مشهور
        en: an active mosque and famous landmark
        ur: فعال مسجد اور مشہور نشان
      correct: true
      why:
        ar: يبقى مكان عبادة ومعلمًا زائرًا
        en: it stays a place of worship and a visited landmark
        ur: یہ عبادت گاہ اور مشہور یادگار رہی
    - text:
        ar: متحف مغلق
        en: a closed museum
        ur: بند عجائب گھر
      correct: false
      why:
        ar: ليس مغلقًا بل مفتوح للصلاة
        en: not closed; open for prayer
        ur: بند نہیں، نماز کے لیے کھلی
    - text:
        ar: قصر ملكي
        en: a royal palace
        ur: شاہی محل
      correct: false
      why:
        ar: ليس قصرًا بل مسجدًا
        en: a mosque, not a palace
        ur: محل نہیں، مسجد
    - text:
        ar: مدرسة خاصة
        en: a private school
        ur: نجی اسکول
      correct: false
      why:
        ar: ليس مدرسة بل مسجد عامر
        en: an active mosque, not a school
        ur: اسکول نہیں، فعال مسجد
- id: hijri-calendar
  anchor: concept/hijri-calendar
  band: scholars
  title:
    ar: التقويم الهجري
    en: The Hijri calendar
    ur: ہجری تقویم
  sixty:
    ar: 'التقويم الهجري: سنة قمرية من اثني عشر شهرًا يبدأ التأريخ بها من هجرة النبي إلى المدينة سنة ٦٢٢، وهو اختيار عمر بن الخطاب في خلافته. يحمل أشهر أربعة حرمًا منها المحرم ورجب وذو القعدة وذو الحجة، وفي رمضان يصوم المسلمون وفي شوال يفطرون بعيد الفطر، وفي ذي الحجة يحجّون ويضحّون في عيد الأضحى. الشهر يبدأ بميلاد الهلال، فتنتقل المواسم عبر السنين: رمضان يأتي صيفًا وشتاءً، والحج يدور على الفصول كلّها في جيل واحد. وهو أقدم تقويم إسلامي وأكثرها استعمالًا حتى اليوم لأعياد الأمة وعباداتها.  وهو اليوم لغة المسلمين الزمنية: فيه تُكتب المناسبات الدينية وتُحسب الآجال، ولو خسرت الأمة كل تقويومها لظلّت تعرف زمنها بأشهر قرآنها.  ولهذا تحفظ الأمة تواريخها به وحده: فيه تُولد المناسبات وتُحفظ المناسبات وتنتقل الحجّ من جيل إلى جيل.'
    en: 'The Hijri calendar: a lunar year of twelve months counted from the Prophet''s migration to Medina in 622 — Umar ibn al-Khattab''s choice in his caliphate. It holds four sacred months among them Muharram, Rajab, Dhu al-Qa''da and Dhu al-Hijja; in Ramadan Muslims fast, in Shawwal they celebrate Eid al-Fitr, in Dhu al-Hijja they make Hajj and sacrifice at Eid al-Adha. The month begins with the new crescent, so the seasons travel through the years: Ramadan comes in summer and winter, and the Hajj circles all seasons in one generation. It is Islam''s oldest calendar and the one still used most for the ummah''s feasts and devotions.  It is today the Muslims'' language of time: religious occasions are written by it and terms are counted, and if the ummah lost every other calendar it would still know its time by its Qur''an''s months.'
    ur: 'ہجری تقویم: بارہ مہینوں کا قمری سال جو نبی کی مدینہ ہجرت 622 سے شمار ہوتا ہے — عمر بن خطاب کے دور خلافت کا انتخاب۔ اس میں چار حرمت والے مہینے ہیں جن میں محرم، رجب، ذوالقعدہ اور ذوالحجہ ہیں؛ رمضان میں مسلمان روزہ رکھتے ہیں، شوال میں عید الفطر مناتے ہیں، ذوالحجہ میں حج کرتے اور عید الاضحی پر قربانیاں دیتے ہیں۔ مہینہ نئے چاند سے شروع ہوتا ہے، اس لیے موسم برسوں میں گھومتے ہیں: رمضان گرمی اور سردی دونوں میں آتا ہے، اور حج ایک ہی نسل میں تمام موسموں پر دائرہ کرتا ہے۔ یہ اسلام کا قدیم ترین تقویم ہے اور امت کی عیدوں اور عبادتوں کے لیے آج بھی سب سے زیادہ استعمال ہونے والا۔  آج یہ مسلمانوں کی زمانے کی زبان ہے: مذہبی مواقع اسی سے لکھے جاتے اور مدتیں اسی سے گنی جاتی ہیں، اور اگر امت ہر دوسرا تقویم کھو بھی دے تو اپنے قرآن کے مہینوں سے اپنا زمانہ جانے گی۔'
  glossary:
  - term:
      ar: الهجرة
      en: the Hijra
      ur: ہجرت
    gloss:
      ar: 'الحدث الذي يبدأ منه التقويم عدّ سنواته إلى اليوم'
      en: 'the event the calendar counts its years from until today'
      ur: 'وہ واقعہ جس سے تقویم آج تک اپنے سال گنتی ہے'
  - term:
      ar: الشهر القمري
      en: the lunar month
      ur: قمری مہینہ
    gloss:
      ar: 'الشهر القمري — الوحدة التي تتكوّن منها السنة'
      en: 'the lunar month — the unit each year is made of'
      ur: 'قمری مہینہ — وہ اکائی جس سے ہر سال بنتا ہے'
  - term:
      ar: رمضان
      en: Ramadan
      ur: رمضان
    gloss:
      ar: 'الشهر التاسع — شهر الصيام في السنة'
      en: 'the ninth month — the fasting month of the year'
      ur: 'نواں مہینہ — سال کا روزوں کا مہینہ'
  - term:
      ar: شوال
      en: Shawwal
      ur: شوال
    gloss:
      ar: 'الشهر الذي يعقب الصوم ويفتتحه العيد السعيد'
      en: 'the month following the fast, opened by the joyful Eid'
      ur: 'روزوں کے بعد کا مہینہ جس کا آغاز مسرت بخش عید کرتی ہے'
  - term:
      ar: ذو الحجة
      en: Dhu al-Hijja
      ur: ذوالحجہ
    gloss:
      ar: 'شهر الحج الذي تُختم به السنة القمرية'
      en: 'the Hajj month, with which the lunar year is sealed'
      ur: 'حج کا مہینہ جس کے ساتھ قمری سال مکمل ہوتا ہے'
  - term:
      ar: محرم
      en: Muharram
      ur: محرم
    gloss:
      ar: 'أول شهور السنة وهو من الأشهر الحرم'
      en: 'the year''s first month, and one of the sacred ones'
      ur: 'سال کا پہلا مہینہ، اور حرمت والے مہینوں میں سے'
  - term:
      ar: الهلال
      en: the crescent
      ur: ہلال
    gloss:
      ar: 'علامة الشهر الجديد التي تظهر في السماء'
      en: 'the sign of the new month, appearing in the sky'
      ur: 'نئے مہینے کی وہ علامت جو آسمان میں نمودار ہوتی ہے'
  - term:
      ar: السنة القمرية
      en: the lunar year
      ur: قمری سال
    gloss:
      ar: 'طول السنة القمرية — أقصر من الشمسية بنحو أحد عشر يومًا'
      en: 'the lunar year''s length — some eleven days shorter than the solar'
      ur: 'قمری سال کی لمبائی — شمسی سے کوئی گیارہ دن چھوٹی'
  - term:
      ar: عيد الفطر
      en: Eid al-Fitr
      ur: عید الفطر
    gloss:
      ar: 'العيد الذي يأتي في نهاية شهر رمضان المبارك'
      en: 'the feast that comes at the end of blessed Ramadan'
      ur: 'وہ عید جو مبارک رمضان کے اختتام پر آتی ہے'
  - term:
      ar: عيد الأضحى
      en: Eid al-Adha
      ur: عید الاضحیٰ
    gloss:
      ar: 'عيد الأضحى الذي يقع في موسم الحج العظيم'
      en: 'the sacrifice feast falling in the great Hajj season'
      ur: 'قربانی کی عید جو عظیم حج کے موسم میں آتی ہے'
  - term:
      ar: عمر بن الخطاب
      en: Umar ibn al-Khattab
      ur: عمر بن الخطاب
    gloss:
      ar: 'الخليفة الذي اختار سنة البدء للتقويم الهجري'
      en: 'the caliph who chose the starting year for the Hijri calendar'
      ur: 'وہ خلیفہ جس نے ہجری تقویم کا ابتدائی سال چنا'
  - term:
      ar: الموسم المتنقل
      en: the moving season
      ur: گھومتا موسم
    gloss:
      ar: 'سرّ تجوال الفصول الأربعة عبر السنين'
      en: 'the secret of the four seasons travelling through the years'
      ur: 'چاروں موسموں کے برسوں میں گھومتے رہنے کا راز'
  practice:
  - q:
      ar: متى يبدأ التقويم الهجري؟
      en: When does the Hijri calendar start?
      ur: ہجری تقویم کب شروع ہوتا ہے؟
    options:
    - text:
        ar: سنة الهجرة ٦٢٢
        en: the Hijra year, 622
        ur: ہجرت کا سال 622
      correct: true
      why:
        ar: يبدأ بعام هجرة النبي إلى المدينة
        en: it begins at the Prophet's migration to Medina
        ur: نبی کی مدینہ ہجرت سے شروع ہوتا ہے
    - text:
        ar: سنة الميلاد
        en: the birth year
        ur: پیدائش کا سال
      correct: false
      why:
        ar: ليس بعام الميلاد بل الهجرة
        en: not the birth year but the Hijra
        ur: پیدائش کا سال نہیں، ہجرت
    - text:
        ar: سنة البعثة
        en: the call year
        ur: بعثت کا سال
      correct: false
      why:
        ar: ليس بعام البعثة بل الهجرة
        en: not the call year but the Hijra
        ur: بعثت کا سال نہیں، ہجرت
    - text:
        ar: سنة الوفاة
        en: the death year
        ur: وفات کا سال
      correct: false
      why:
        ar: ليس بعام الوفاة بل الهجرة
        en: not the death year but the Hijra
        ur: وفات کا سال نہیں، ہجرت
  - q:
      ar: كم شهرًا فيه؟
      en: How many months does it have?
      ur: اس میں کتنے مہینے ہیں؟
    options:
    - text:
        ar: اثنا عشر
        en: twelve
        ur: بارہ
      correct: true
      why:
        ar: اثنا عشر شهرًا قمريًا
        en: twelve lunar months
        ur: بارہ قمری مہینے
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: له اثنا عشر لا عشرة
        en: it has twelve, not ten
        ur: اس میں بارہ ہیں، دس نہیں
    - text:
        ar: أربعة عشر
        en: fourteen
        ur: چودہ
      correct: false
      why:
        ar: له اثنا عشر لا أربعة عشر
        en: it has twelve, not fourteen
        ur: اس میں بارہ ہیں، چودہ نہیں
    - text:
        ar: سبعة
        en: seven
        ur: سات
      correct: false
      why:
        ar: له اثنا عشر لا سبعة
        en: it has twelve, not seven
        ur: اس میں بارہ ہیں، سات نہیں
  - q:
      ar: ما شهر الصوم؟
      en: Which is the fasting month?
      ur: روزے کا مہینہ کون سا ہے؟
    options:
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: true
      why:
        ar: رمضان التاسع شهر الصوم
        en: Ramadan, the ninth month, is for fasting
        ur: رمضان، نواں مہینہ، روزے کا ہے
    - text:
        ar: شوال
        en: Shawwal
        ur: شوال
      correct: false
      why:
        ar: شوال شهر العيد بعد رمضان
        en: Shawwal is the feast month after Ramadan
        ur: شوال رمضان کے بعد عید کا مہینہ ہے
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول الشهر لا الصوم
        en: Muharram is the first month, not fasting
        ur: محرم پہلا مہینہ ہے، روزے کا نہیں
    - text:
        ar: رجب
        en: Rajab
        ur: رجب
      correct: false
      why:
        ar: رجب سابع الشهر لا الصوم
        en: Rajab is the seventh, not fasting
        ur: رجب ساتواں ہے، روزے کا نہیں
  - q:
      ar: أين يقع الحج؟
      en: When is the Hajj?
      ur: حج کب ہوتا ہے؟
    options:
    - text:
        ar: ذو الحجة
        en: Dhu al-Hijja
        ur: ذوالحجہ
      correct: true
      why:
        ar: الحج في ذي الحجة الثاني عشر
        en: the Hajj is in Dhu al-Hijja, the twelfth
        ur: حج بارہویں مہینے ذوالحجہ میں ہے
    - text:
        ar: رمضان
        en: Ramadan
        ur: رمضان
      correct: false
      why:
        ar: رمضان للصوم لا للحج
        en: Ramadan is for fasting, not Hajj
        ur: رمضان روزے کا ہے، حج کا نہیں
    - text:
        ar: شعبان
        en: Sha'ban
        ur: شعبان
      correct: false
      why:
        ar: شعبان قبل رمضان لا الحج
        en: Sha'ban precedes Ramadan, not Hajj
        ur: شعبان رمضان سے پہلے ہے، حج کا نہیں
    - text:
        ar: محرم
        en: Muharram
        ur: محرم
      correct: false
      why:
        ar: محرم أول السنة لا الحج
        en: Muharram opens the year, not Hajj
        ur: محرم سال کا پہلا ہے، حج کا نہیں
  - q:
      ar: ما الفرق عن السنة الشمسية؟
      en: How does it differ from the solar year?
      ur: یہ شمسی سال سے کیسے مختلف ہے؟
    options:
    - text:
        ar: أقصر بنحو ١١ يومًا
        en: about 11 days shorter
        ur: تقریباً 11 دن چھوٹا
      correct: true
      why:
        ar: السنة القمرية نحو ٣٥٤ يومًا
        en: the lunar year runs about 354 days
        ur: قمری سال تقریباً 354 دن کا ہے
    - text:
        ar: أطول بعشرة أيام
        en: 10 days longer
        ur: 10 دن لمبا
      correct: false
      why:
        ar: ليس أطول بل أقصر
        en: it is shorter, not longer
        ur: یہ لمبا نہیں، چھوٹا ہے
    - text:
        ar: مثل الشمسية تمامًا
        en: exactly like the solar
        ur: بالکل شمسی جیسا
      correct: false
      why:
        ar: ليس مثلها بل أقصر
        en: not the same; it is shorter
        ur: ایک جیسا نہیں، چھوٹا ہے
    - text:
        ar: أقصر بشهر كامل
        en: a full month shorter
        ur: پورا مہینہ چھوٹا
      correct: false
      why:
        ar: ليس شهرًا بل أحد عشر يومًا
        en: not a month but eleven days
        ur: مہینہ نہیں، گیارہ دن
  - q:
      ar: لماذا تتنقل المواسم؟
      en: Why do its seasons move?
      ur: اس کے موسم کیوں گھومتے ہیں؟
    options:
    - text:
        ar: لقصر السنة القمرية
        en: because the lunar year is short
        ur: قمری سال کے چھوٹے ہونے کے سبب
      correct: true
      why:
        ar: أقصر من الشمسية فتتقدم الأشهر كل عام
        en: shorter than solar, so months advance yearly
        ur: شمسی سے چھوٹا، اس لیے مہینے ہر سال آگے آتے ہیں
    - text:
        ar: لطول السنة القمرية
        en: because the lunar year is long
        ur: قمری سال کے لمبے ہونے کے سبب
      correct: false
      why:
        ar: ليس أطول بل أقصر
        en: it is shorter, not longer
        ur: یہ لمبا نہیں، چھوٹا ہے
    - text:
        ar: لحركة الأرض
        en: for Earth's motion
        ur: زمین کی حرکت کے لیے
      correct: false
      why:
        ar: السبب طول السنة لا حركة الأرض
        en: the cause is the year's length, not Earth's motion
        ur: وجہ سال کی لمبائی ہے، زمین کی حرکت نہیں
    - text:
        ar: لتغيير الطقس
        en: for weather change
        ur: موسم کی تبدیلی کے لیے
      correct: false
      why:
        ar: ليس الطقس بل حساب الشهر
        en: not weather but the month count
        ur: موسم نہیں، مہینوں کا حساب
  - q:
      ar: ما الهلال؟
      en: What is the crescent?
      ur: ہلال کیا ہے؟
    options:
    - text:
        ar: القمر الجديد بادئ الشهر
        en: the new moon starting each month
        ur: ہر مہینے کا آغاز کرنے والا نیا چاند
      correct: true
      why:
        ar: يبدأ كل شهر قمري برؤية هلاله
        en: each lunar month begins with its crescent
        ur: ہر قمری مہینہ اس کے ہلال سے شروع ہوتا ہے
    - text:
        ar: نجمة الصباح
        en: the morning star
        ur: صبح کا ستارہ
      correct: false
      why:
        ar: ليست نجمة بل قمر
        en: a moon, not a star
        ur: ستارہ نہیں، چاند
    - text:
        ar: قمر مكتمل
        en: a full moon
        ur: پورا چاند
      correct: false
      why:
        ar: ليس مكتملًا بل هلال جديد
        en: a new crescent, not a full moon
        ur: پورا نہیں، نیا ہلال
    - text:
        ar: كوكب الزهرة
        en: the planet Venus
        ur: زہرہ سیارہ
      correct: false
      why:
        ar: ليست كوكبًا بل طور القمر
        en: a moon phase, not a planet
        ur: سیارہ نہیں، چاند کا طور
  - q:
      ar: من بدأ التقويم؟
      en: Who began the calendar?
      ur: تقویم کس نے شروع کیا؟
    options:
    - text:
        ar: عمر بن الخطاب
        en: Umar ibn al-Khattab
        ur: عمر بن الخطاب
      correct: true
      why:
        ar: عمر جعل الهجرة بداية التقويم
        en: Umar made the Hijra its starting point
        ur: عمر نے ہجرت کو اس کا آغاز بنایا
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: false
      why:
        ar: أبو بكر قبل عمر
        en: Abu Bakr preceded Umar
        ur: ابو بکر عمر سے پہلے تھا
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: false
      why:
        ar: عثمان بعد عمر
        en: Uthman came after Umar
        ur: عثمان عمر کے بعد تھا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي بعد عمر
        en: Ali came after Umar
        ur: علی عمر کے بعد تھا
  - q:
      ar: ما عيد الفطر؟
      en: What is Eid al-Fitr?
      ur: عید الفطر کیا ہے؟
    options:
    - text:
        ar: عيد نهاية رمضان
        en: the feast ending Ramadan
        ur: رمضان کے اختتام کی عید
      correct: true
      why:
        ar: أول شوال عيد انتهاء الصوم
        en: first of Shawwal, the fast-ending feast
        ur: پہلی شوال، روزے کے ختم کی عید
    - text:
        ar: عيد الحج
        en: the Hajj feast
        ur: حج کی عید
      correct: false
      why:
        ar: عيد الحج هو الأضحى لا الفطر
        en: the Hajj feast is al-Adha, not al-Fitr
        ur: حج کی عید اضحیٰ ہے، فطر نہیں
    - text:
        ar: أول السنة
        en: the new year
        ur: نیا سال
      correct: false
      why:
        ar: ليست أول السنة بل بعد رمضان
        en: not the new year but after Ramadan
        ur: نیا سال نہیں، رمضان کے بعد
    - text:
        ar: ليلة القدر
        en: the Night of Power
        ur: قدر کی رات
      correct: false
      why:
        ar: ليلة القدر في رمضان لا عيد
        en: the Night of Power is in Ramadan, not Eid
        ur: قدر کی رات رمضان میں ہے، عید نہیں
  - q:
      ar: كم يستغرق دورة المواسم؟
      en: How long for seasons to cycle?
      ur: موسموں کا چکر کتنے عرصے میں پورا ہوتا ہے؟
    options:
    - text:
        ar: نحو ٣٣ عامًا
        en: about 33 years
        ur: تقریباً 33 سال
      correct: true
      why:
        ar: تكمل الأشهر دورة الفصول في نحو ٣٣ عامًا
        en: the months complete a season cycle in about 33 years
        ur: مہینے تقریباً 33 سال میں فصلوں کا چکر پورا کرتے ہیں
    - text:
        ar: ١٠ أعوام
        en: 10 years
        ur: 10 سال
      correct: false
      why:
        ar: ١٠ أعوام أقل من الدورة
        en: ten years is less than the cycle
        ur: 10 سال چکر سے کم ہے
    - text:
        ar: ١٠٠ عام
        en: 100 years
        ur: 100 سال
      correct: false
      why:
        ar: ١٠٠ عام أكثر من الدورة
        en: a hundred years is more than the cycle
        ur: 100 سال چکر سے زیادہ ہے
    - text:
        ar: عام واحد
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: عام واحد لا يكفي لدورة
        en: one year is too few for the cycle
        ur: ایک سال چکر کے لیے کم ہے
- id: algebra
  anchor: concept/algebra
  band: researchers
  title:
    ar: الجبر
    en: Algebra
    ur: الجبر
  sixty:
    ar: 'الجبر: علم المعادلات الذي سمّاه العالم كله باسم كتاب الخوارزمي «الكتاب المختصر في حساب الجبر والمقابلة» من بغداد نحو سنة ٨٢٠. علّم الكتاب حلّ المسائل بإعادة الأجزاء المكسورة إلى كاملها — الجبر — وموازنة الطرفين — المقابلة، وطبّق ذلك على مسائل الإرث والتجارة والقياس. ومن عمله جاءت كلمة «الخوارزمية» التي تقوم عليها الحواسيب، ونقلته الترجمات اللاتينية إلى مدارس أوروبا فصار «الجبرا» اسم العلم كله. وبهذا كان الخوارزمي لا عالمًا يحلّ مسائل بل معلّمًا علّم البشرية طريقة التفكير في المجهول.  ومن بغداد انتقل اسمه إلى كلّ لغة حتى صار «الجبر» درسًا في مدارس الأرض كلّها، فصار الخوارزمي معلّمًا لمن لا يعرف اسمه، وهو أعظم شرف للمعلّم.  وهكذا بقي اسمه على لسان طلاب الأرض كلّ يوم، وهو من أجلّ ما يمكن أن يعطيه العالم لعالم.'
    en: 'Algebra: the science of equations the whole world named after al-Khwarizmi''s Compendious Book on the Calculation of Restoration and Balancing, from Baghdad around 820. The book taught solving problems by restoring broken parts to wholeness — al-jabr — and balancing the two sides — al-muqabala, applying it to inheritance, trade and measurement. From his work came the word ''algorithm'' that computers run on, and Latin translations carried it into Europe''s schools until ''algebra'' became the science''s own name. Thus al-Khwarizmi was not just a scholar solving problems but a teacher who taught humanity how to think about the unknown.  From Baghdad his name moved into every language until ''algebra'' became a lesson in every school on earth, making al-Khwarizmi the teacher of those who never heard his name — the teacher''s greatest honour.'
    ur: 'الجبر: مساواتوں کا وہ علم جسے پوری دنیا نے خوارزمی کی «مختصر کتاب حساب الجبر والمقابلہ» کے نام پر رکھا — بغداد سے تقریباً 820 میں۔ کتاب نے مسائل حل کرنا سکھایا: ٹوٹے حصوں کو مکمل کرنا — الجبر — اور دونوں طرفوں کا توازن — المقابلہ — اور اسے میراث، تجارت اور پیمائش کے مسائل پر لگایا۔ اسی کام سے لفظ الگورتھم نکلا جس پر کمپیوٹر چلتے ہیں، اور لاطینی ترجموں نے اسے یورپ کے مکاتب تک پہنچایا یہاں تک کہ الجبرا خود علم کا نام بنا۔ اس طرح خوارزمی صرف مسائل حل کرنے والا عالم نہیں بلکہ وہ معلم تھا جس نے انسانیت کو مجہول کے بارے میں سوچنا سکھایا۔  بغداد سے اس کا نام ہر زبان میں گیا یہاں تک کہ الجبر دنیا کے ہر مکتب کا سبق بنا، اور خوارزمی ان لوگوں کا استاد بنا جنھوں نے اس کا نام کبھی نہ سنا — یہی استاد کا سب سے بڑا اعزاز ہے۔'
  glossary:
  - term:
      ar: الخوارزمي
      en: al-Khwarizmi
      ur: خوارزمی
    gloss:
      ar: 'المعلّم الذي سمّى العلم كتابه'
      en: 'the scholar whose book named the science'
      ur: 'وہ عالم جس کی کتاب نے علم کو نام دیا'
  - term:
      ar: الجبر والمقابلة
      en: restoration and balancing
      ur: الجبر والمقابلہ
    gloss:
      ar: 'معنى الكلمة التي صارت اسم العلم'
      en: 'the word''s meaning that became the science''s name'
      ur: 'وہ لفظ جو علم کا نام بنا — اس کا مطلب'
  - term:
      ar: الخوارزمية
      en: algorithm
      ur: الگورتھم
    gloss:
      ar: 'الكلمة التي جاءت من اسم مؤلفها'
      en: 'the word that came from its author''s name'
      ur: 'وہ لفظ جو اس کے مؤلف کے نام سے نکلا'
  - term:
      ar: المعادلة
      en: the equation
      ur: مساوات
    gloss:
      ar: 'المسألة التي يحلّها الجبر'
      en: 'the problem algebra solves'
      ur: 'وہ مسئلہ جو الجبر حل کرتا ہے'
  - term:
      ar: الحد المجهول
      en: the unknown term
      ur: نامعلوم جزو
    gloss:
      ar: 'العنصر الذي يبحث عنه الحلّ'
      en: 'the element the solution seeks'
      ur: 'وہ عنصر جسے حل تلاش کرتا ہے'
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: 'مدينة الكتاب والعلم في عصره'
      en: 'the book and science city of his era'
      ur: 'اس کے زمانے کا کتاب اور علم کا شہر'
  - term:
      ar: الميراث
      en: inheritance
      ur: میراث
    gloss:
      ar: 'مجال تطبيق الجبر الأكثر شيوعًا'
      en: 'algebra''s most applied field'
      ur: 'الجبر کا سب سے زیادہ اطلاق ہونے والا میدان'
  - term:
      ar: الحساب
      en: reckoning
      ur: حساب
    gloss:
      ar: 'فنّ الحساب القديم قبل الجبر'
      en: 'the old art of reckoning before algebra'
      ur: 'الجبر سے پہلے حساب کا قدیم فن'
  - term:
      ar: المقابلة
      en: balancing
      ur: مقابلہ
    gloss:
      ar: 'موازنة الطرفين في المعادلة'
      en: 'balancing the two sides in the equation'
      ur: 'مساوات میں دونوں طرفوں کا توازن'
  - term:
      ar: الكتاب المختصر
      en: the Compendious Book
      ur: مختصر کتاب
    gloss:
      ar: 'اسم كتاب الخوارزمي الكامل'
      en: 'the full name of al-Khwarizmi''s book'
      ur: 'خوارزمی کی کتاب کا پورا نام'
  - term:
      ar: الترجمة اللاتينية
      en: the Latin translation
      ur: لاطینی ترجمہ
    gloss:
      ar: 'اللغة التي نقلته إلى الغرب'
      en: 'the language that carried him to the West'
      ur: 'وہ زبان جو اسے مغرب تک لے گئی'
  - term:
      ar: algebra
      en: algebra
      ur: algebra
    gloss:
      ar: 'العلم الذي نسمّيه اليوم'
      en: 'the science we call it today'
      ur: 'آج ہم جسے جس نام سے پکارتے ہیں'
  practice:
  - q:
      ar: من وضع علم الجبر؟
      en: Who set down algebra?
      ur: الجبر کس نے قائم کیا؟
    options:
    - text:
        ar: الخوارزمي
        en: al-Khwarizmi
        ur: خوارزمی
      correct: true
      why:
        ar: الخوارزمي كتب «الجبر والمقابلة»
        en: al-Khwarizmi wrote 'Restoration and Balancing'
        ur: خوارزمی نے الجبر والمقابلہ لکھی
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ابن سينا طبيب فيلسوف لا جبر
        en: Ibn Sina was physician-philosopher, not algebra
        ur: ابن سینا طبیب فلسفی تھا، الجبر نہیں
    - text:
        ar: ابن بطّوطة
        en: Ibn Battuta
        ur: ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة رحالة لا عالم
        en: Ibn Battuta was a traveller, not a scholar
        ur: ابن بطوطہ مسافر تھا، عالم نہیں
    - text:
        ar: ابن رشد
        en: Ibn Rushd
        ur: ابن رشد
      correct: false
      why:
        ar: ابن رشد فيلسوف لا جبر
        en: Ibn Rushd was a philosopher, not algebra
        ur: ابن رشد فلسفی تھا، الجبر نہیں
  - q:
      ar: أين عمل الخوارزمي؟
      en: Where did al-Khwarizmi work?
      ur: خوارزمی کہاں کام کرتا تھا؟
    options:
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: true
      why:
        ar: في بيت الحكمة ببغداد
        en: at Baghdad's House of Wisdom
        ur: بغداد کے بیت الحکمت میں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة ليست مدينته
        en: Cairo was not his city
        ur: قاہرہ اس کا شہر نہیں
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطبہ
      correct: false
      why:
        ar: قرطبة في الغرب لا عمله
        en: Cordoba was far west of his work
        ur: قرطبہ اس کے کام سے دور مغرب تھی
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: دمشق ليست مدينته
        en: Damascus was not his city
        ur: دمشق اس کا شہر نہیں
  - q:
      ar: ما «الخوارزمية»؟
      en: What is an algorithm?
      ur: الگورتھم کیا ہے؟
    options:
    - text:
        ar: خطوات حل مرتبة
        en: ordered solution steps
        ur: مرتب حل کے قدم
      correct: true
      why:
        ar: خطوات الحل سميت باسم الخوارزمي
        en: solution steps named after al-Khwarizmi
        ur: حل کے قدم خوارزمی کے نام پر
    - text:
        ar: لغة برمجة
        en: a programming language
        ur: پروگرامنگ زبان
      correct: false
      why:
        ar: ليست لغة بل خطوات
        en: steps, not a language
        ur: زبان نہیں، قدم
    - text:
        ar: آلة حاسبة
        en: a machine
        ur: مشین
      correct: false
      why:
        ar: ليست آلة بل طريقة
        en: a method, not a machine
        ur: مشین نہیں، طریقہ
    - text:
        ar: قانون فيزياء
        en: a physics law
        ur: طبیعیات کا قانون
      correct: false
      why:
        ar: ليست قانونًا بل طريقة حل
        en: a solving method, not a physics law
        ur: طبیعیات کا قانون نہیں، حل کا طریقہ
  - q:
      ar: من أين جاءت كلمة algebra؟
      en: Where does 'algebra' come from?
      ur: algebra کہاں سے آیا؟
    options:
    - text:
        ar: من «الجبر» العربية
        en: from Arabic 'al-jabr'
        ur: عربی «الجبر» سے
      correct: true
      why:
        ar: من اسم كتاب الخوارزمي «الجبر»
        en: from al-Khwarizmi's book title 'al-jabr'
        ur: خوارزمی کی کتاب کے نام «الجبر» سے
    - text:
        ar: من اليونانية
        en: from Greek
        ur: یونانی سے
      correct: false
      why:
        ar: ليست يونانية بل عربية
        en: from Arabic, not Greek
        ur: یونانی نہیں، عربی سے
    - text:
        ar: من اللاتينية
        en: from Latin
        ur: لاطینی سے
      correct: false
      why:
        ar: ترجم إلى اللاتينية لا منها
        en: translated into Latin, not from it
        ur: لاطینی میں ترجمہ ہوا، اس سے نہیں
    - text:
        ar: من الفارسية
        en: from Persian
        ur: فارسی سے
      correct: false
      why:
        ar: ليست فارسية بل عربية
        en: from Arabic, not Persian
        ur: فارسی نہیں، عربی سے
  - q:
      ar: ما طريقة «المقابلة»؟
      en: What is 'balancing'?
      ur: «مقابلہ» کیا ہے؟
    options:
    - text:
        ar: حذف المتشابه من الطرفين
        en: cancelling like terms both sides
        ur: دونوں طرف یکساں اجزا کاٹنا
      correct: true
      why:
        ar: إسقاط الحدود المتشابهة لبسط المعادلة
        en: dropping like terms to simplify the equation
        ur: مساوات سادہ کرنے کے لیے یکساں اجزا گرانا
    - text:
        ar: جمع كل الأعداد
        en: adding all numbers
        ur: تمام اعداد جمع کرنا
      correct: false
      why:
        ar: ليست جمعًا بل حذفًا
        en: cancelling, not adding
        ur: جمع نہیں، کاٹنا
    - text:
        ar: ضرب الطرفين
        en: multiplying the sides
        ur: طرفوں کو ضرب دینا
      correct: false
      why:
        ar: ليست ضربًا بل حذفًا
        en: cancelling, not multiplying
        ur: ضرب نہیں، کاٹنا
    - text:
        ar: نقل الأرقام فقط
        en: moving numbers only
        ur: صرف اعداد منتقل کرنا
      correct: false
      why:
        ar: ليست نقلًا بل مساواة
        en: balancing, not moving
        ur: منتقلی نہیں، توازن
  - q:
      ar: في أيّ عمل استُعمل الجبر؟
      en: Where was algebra applied?
      ur: الجبر کہاں استعمال ہوا؟
    options:
    - text:
        ar: قسمة الميراث
        en: dividing inheritance
        ur: میراث کی تقسیم
      correct: true
      why:
        ar: استعمل في حساب التركات والتجارة
        en: applied to estates and trade
        ur: ترکوں اور تجارت میں استعمال ہوا
    - text:
        ar: رسم الخرائط فقط
        en: only map-drawing
        ur: صرف نقشہ سازی
      correct: false
      why:
        ar: ليست خرائط بل ميراث وتجارة
        en: not maps but inheritance and trade
        ur: نقشے نہیں، میراث اور تجارت
    - text:
        ar: بناء الجدران
        en: wall-building
        ur: دیوار سازی
      correct: false
      why:
        ar: ليست بناءً بل حسابًا
        en: reckoning, not building
        ur: تعمیر نہیں، حساب
    - text:
        ar: كتابة الشعر
        en: writing poetry
        ur: شاعری لکھنا
      correct: false
      why:
        ar: ليست شعرًا بل حسابًا
        en: reckoning, not poetry
        ur: شاعری نہیں، حساب
  - q:
      ar: متى كُتب الكتاب تقريبًا؟
      en: Roughly when was the book written?
      ur: کتاب تقریباً کب لکھی گئی؟
    options:
    - text:
        ar: نحو عام ٨٢٠
        en: about 820
        ur: تقریباً 820
      correct: true
      why:
        ar: كتبه في القرن التاسع نحو ٨٢٠
        en: he wrote it about 820 in the ninth century
        ur: اس نے نویں صدی میں تقریباً 820 میں لکھی
    - text:
        ar: عام ١٠٥٠
        en: in 1050
        ur: 1050 میں
      correct: false
      why:
        ar: ١٠٥٠ متأخر عن كتابه
        en: 1050 is later than his book
        ur: 1050 اس کی کتاب سے بعد ہے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة قبل كتابه
        en: 622 is the Hijra year, before his book
        ur: 622 ہجرت کا سال ہے، کتاب سے پہلے
    - text:
        ar: عام ١٢٠٠
        en: in 1200
        ur: 1200 میں
      correct: false
      why:
        ar: ١٢٠٠ متأخر بقرون
        en: 1200 is centuries later
        ur: 1200 صدیاں بعد ہے
  - q:
      ar: ما «الحد المجهول»؟
      en: What is the unknown term?
      ur: نامعلوم جزو کیا ہے؟
    options:
    - text:
        ar: العدد المطلوب إيجاده
        en: the number to find
        ur: وہ عدد جو ڈھونڈنا ہے
      correct: true
      why:
        ar: القيمة التي نحسبها بالجبر
        en: the value algebra solves for
        ur: وہ قدر جو الجبر حل کرتا ہے
    - text:
        ar: العدد الكبير
        en: the big number
        ur: بڑا عدد
      correct: false
      why:
        ar: ليس كبيرًا بل مجهولًا
        en: unknown, not big
        ur: بڑا نہیں، نامعلوم
    - text:
        ar: الصفر
        en: zero
        ur: صفر
      correct: false
      why:
        ar: ليس صفرًا بل مجهولًا
        en: an unknown, not zero
        ur: صفر نہیں، نامعلوم
    - text:
        ar: الجزء الكسري
        en: the fraction
        ur: کسر حصہ
      correct: false
      why:
        ar: ليس كسرًا بل قيمة مطلوبة
        en: an unknown value, not a fraction
        ur: کسر نہیں، مطلوب قدر
  - q:
      ar: كيف انتشر الجبر في أوروبا؟
      en: How did algebra reach Europe?
      ur: الجبر یورپ میں کیسے پہنچا؟
    options:
    - text:
        ar: بالترجمة اللاتينية
        en: through Latin translation
        ur: لاطینی ترجمہ سے
      correct: true
      why:
        ar: نقل الكتاب إلى اللاتينية فانتشر
        en: the book was rendered into Latin and spread
        ur: کتاب لاطینی میں منتقل ہوئی اور پھیلی
    - text:
        ar: بالحروب
        en: through wars
        ur: جنگوں سے
      correct: false
      why:
        ar: ليست حروبًا بل ترجمة
        en: translation, not wars
        ur: جنگ نہیں، ترجمہ
    - text:
        ar: بالتجارة فقط
        en: by trade alone
        ur: صرف تجارت سے
      correct: false
      why:
        ar: ليست تجارة بل ترجمة
        en: translation, not trade
        ur: تجارت نہیں، ترجمہ
    - text:
        ar: بالهجرة
        en: by migration
        ur: ہجرت سے
      correct: false
      why:
        ar: ليست هجرة بل ترجمة
        en: translation, not migration
        ur: ہجرت نہیں، ترجمہ
  - q:
      ar: لماذا يُعدّ الكتاب محوريًا؟
      en: Why is the book pivotal?
      ur: یہ کتاب محوری کیوں ہے؟
    options:
    - text:
        ar: لأنه أسّس علمًا جديدًا
        en: it founded a new science
        ur: اس نے نیا علم بنایا
      correct: true
      why:
        ar: جمع طريقة حل المعادلات وأسّس علمًا
        en: it systematised equation-solving as a science
        ur: اس نے مساوات کے حل کو علم بنایا
    - text:
        ar: لأطوله
        en: for its length
        ur: اس کی لمبائی کے لیے
      correct: false
      why:
        ar: ليست طوله بل طريقته
        en: not its length but its method
        ur: لمبائی نہیں، اس کا طریقہ
    - text:
        ar: لأوله أرقامًا
        en: for first numbers
        ur: پہلے اعداد کے لیے
      correct: false
      why:
        ar: ليست أول أرقام بل علم جديد
        en: not first numbers but a new science
        ur: پہلے اعداد نہیں، نیا علم
    - text:
        ar: لأقدم كتاب
        en: for the oldest book
        ur: قدیم ترین کتاب کے لیے
      correct: false
      why:
        ar: ليست أقدم بل مؤسسًا
        en: not oldest but founding
        ur: قدیم ترین نہیں، بانی
- id: astronomy
  anchor: concept/astronomy
  band: researchers
  title:
    ar: علم الفلك
    en: Astronomy
    ur: علم فلکیات
  sixty:
    ar: 'علم الفلك في الحضارة الإسلامية: من المراصد الكبرى في سمرقند ومراغة وبغداد إلى الإسطرلاب في يد كلّ بحّار ومسافر. قاس البتّاني مدار الكواكب بدقة لم تُعرف في عصره، وكتب الطوسي في مراغة نماذج للكواكب السيارة وجدت طريقها بعد قرون إلى كوبرنيكوس، ووضع ألوغ بيك جداول النجوم — الزيج — التي بقيت مرجع الفلكيين. ومن أسمائهم بقيت نجوم العرب في سماءنا: الجبار والدبران والثريا والدنب. وللدين أيضًا دوره: تحديد القبلة وأوقات الصلاة وشهور السنة الهجرية دفع هذا العلم دفعًا يوميًّا.  وإليها يرجع جزء كبير من تاريخ العلم: نجوم سمّيناها، وأرصاد علّمناها للأجيال، وأدوات ورثها من بعدنا بحّارون مالوكيون وبرتغاليون.  ويبقى درسها: أن السماء يمكن أن تُقرأ بالحساب لا بالتخمين، وأن المسلمين قرؤوها يومًا أوّل الناس.'
    en: 'Astronomy in Islamic civilisation: from the great observatories of Samarqand, Maragha and Baghdad to the astrolabe in every sailor''s and traveller''s hand. Al-Battani measured the planets'' courses with a precision his age had not known; al-Tusi at Maragha wrote planetary models that reached Copernicus centuries later; Ulugh Beg drew the star tables — the zij — that stayed the astronomers'' reference. From their names the Arabs'' stars stay in our sky: Betelgeuse, Aldebaran, the Pleiades and Deneb. Religion played its part too: fixing the qibla, the prayer times and the Hijri months drove this science daily.  To it goes much of science''s history: stars we named, observations we taught the generations, and instruments inherited by Malaccan and Portuguese sailors after us.'
    ur: 'اسلامی تہذیب میں فلکیات: سمرقند، مراغہ اور بغداد کی عظیم رصد گاہوں سے لے کر ہر ملاح اور مسافر کے ہاتھ میں اسطرلاب تک۔ بتانی نے سیاروں کے مدار اپنی زمانے کی ناجانی ہوئی درستگی سے ناپے؛ طوسی نے مراغہ میں سیاروں کے وہ نمونے لکھے جو صدیوں بعد کوپرنیکس تک پہنچے؛ الغ بیگ نے ستاروں کی جدولیں — زیج — بنائیں جو ماہرینِ فلکیات کی مرجع رہیں۔ ان ہی ناموں سے عرب ستارے ہمارے آسمان میں رہے: الجبار، الدبران، الثریا اور الذنب۔ دین نے بھی اپنا کردار ادا کیا: قبلہ، نماز کے اوقات اور ہجری مہینوں کا تعین اس علم کو روزانہ آگے بڑھاتا رہا۔  اس کی طرف سائنس کی تاریخ کا بڑا حصہ لوٹتا ہے: وہ ستارے جنہیں ہم نے نام دیا، وہ مشاہدے جو ہم نے نسلوں کو سکھائے، اور وہ اوزار جو ہمارے بعد مالکا اور پرتگالی ملاحوں کو ملے۔'
  glossary:
  - term:
      ar: المرصد
      en: the observatory
      ur: رصد گاہ
    gloss:
      ar: 'مكان رصد السماء القديم'
      en: 'the old place for sky-watching'
      ur: 'آسمان کی رصد کی قدیم جگہ'
  - term:
      ar: الأسطرلاب
      en: the astrolabe
      ur: اسطرلاب
    gloss:
      ar: 'أداة البحّار والفلكي'
      en: 'the sailor and astronomer''s tool'
      ur: 'ملاح اور ماہر فلکیات کا آلہ'
  - term:
      ar: أولوغ بيك
      en: Ulugh Beg
      ur: الغ بیگ
    gloss:
      ar: 'مَلِك الفلكيين في سمرقند'
