        en: 1683 is Vienna's siege, not the city's fall
        ur: 1683 ویانا کا محاصرہ ہے، شہر کا سقوط نہیں
  - q:
      ar: من فتحها؟
      en: Who took it?
      ur: اسے کس نے لیا؟
    options:
    - text:
        ar: محمد الفاتح
        en: Mehmed the Conqueror
        ur: محمد فاتح
      correct: true
      why:
        ar: محمد الثاني فتحها وسمّي الفاتح
        en: Mehmed II took it and was named the Conqueror
        ur: محمد دوم نے لیا اور فاتح کہلایا
    - text:
        ar: عثمان
        en: Osman
        ur: عثمان
      correct: false
      why:
        ar: عثمان مات قبلها بقرن
        en: Osman died a century before
        ur: عثمان ایک صدی پہلے مرا
    - text:
        ar: سليمان
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان بعدها بقرن
        en: Süleyman came a century after
        ur: سلیمان ایک صدی بعد تھا
    - text:
        ar: بايزيد
        en: Bayezid
        ur: بایزید
      correct: false
      why:
        ar: بايزيد قبل الفتح
        en: Bayezid came before the conquest
        ur: بایزید فتح سے پہلے تھا
  - q:
