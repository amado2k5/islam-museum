        ur: اجڑ نہیں، پایہ تخت
    - text:
        ar: ميناء صغير
        en: a small port
        ur: چھوٹی بندرگاہ
      correct: false
      why:
        ar: ليست ميناء بل عاصمة
        en: a capital, not a small port
        ur: چھوٹی بندرگاہ نہیں، پایہ تخت
    - text:
        ar: قلعة حرب
        en: a war fortress
        ur: جنگی قلعہ
      correct: false
      why:
        ar: ليست قلعة بل عاصمة
        en: a capital, not a fortress
        ur: قلعہ نہیں، پایہ تخت
  - q:
      ar: في عصر من بلغت الذروة؟
      en: Under whom did it peak?
      ur: کس کے عہد میں عروج پر تھی؟
    options:
    - text:
        ar: سليمان القانوني
        en: Süleyman the Lawgiver
        ur: سلیمان قانونی
      correct: true
      why:
        ar: بلغت الذروة بسليمان في القرن السادس عشر
        en: it peaked under Süleyman in the sixteenth century
        ur: یہ سولہویں صدی میں سلیمان کے عہد میں عروج پر تھی
    - text:
        ar: عثمان
        en: Osman
        ur: عثمان
      correct: false
      why:
        ar: عثمان بداية لا ذروة
        en: Osman was the start, not the peak
        ur: عثمان آغاز تھا، عروج نہیں
    - text:
        ar: عبد الحميد
        en: Abdülhamid
        ur: عبدالحمید
      correct: false
      why:
        ar: عبد الحميد متأخر لا ذروة
        en: Abdülhamid was late, not the peak
        ur: عبدالحمید بعد کا تھا، عروج نہیں
    - text:
        ar: بايزيد الأول
        en: Bayezid I
        ur: بایزید اول
      correct: false
      why:
        ar: بايزيد قبل الذروة
        en: Bayezid predated the peak
        ur: بایزید عروج سے پہلے تھا
  - q:
      ar: لماذا «إمبراطوريات البارود»؟
      en: Why 'gunpowder empires'?
      ur: «بارودی سلطنتیں» کیوں؟
    options:
    - text:
        ar: لبناء جيوش على البارود
        en: for armies built on gunpowder
        ur: بارود پر کھڑی فوجوں کے لیے
      correct: true
      why:
        ar: اعتمدت البندقية والمدفع لجيوش مركزية
        en: they used musket and cannon for central armies
        ur: انھوں نے مرکزی فوجوں کے لیے بندوق اور توپ استعمال کی
    - text:
        ar: لتجارة البارود فقط
        en: for gunpowder trade only
        ur: صرف بارود کی تجارت کے لیے
      correct: false
      why:
