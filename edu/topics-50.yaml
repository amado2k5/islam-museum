- id: four-cities
  anchor: exhibit/pathway-g4-social-studies-four-cities
  band: scholars
  title:
    ar: أربع مدن إسلامية قبل ١٥٠٠
    en: Four Muslim Cities Before 1500
    ur: 1500 سے پہلے چار مسلم شہر
  sixty:
    ar: قبل عام ١٥٠٠ صارت بغداد وقرطبة والقاهرة وتمبكتو منارات علم وتجارة في العالم الإسلامي. جمعت بغداد علماء الترجمة، وبهرت قرطبة الغرب بجامعها ومكتباتها، وقادت
      القاهرة التجارة والعلم من مصر، وربطت تمبكتو الذهب والكتب عبر الصحراء. كل مدينة تعلمنا طريقة مختلفة يبني بها المسلمون حضارة تربط التجارة بالعلم والعيش المشترك.
    en: Before 1500, Baghdad, Cordoba, Cairo and Timbuktu became beacons of learning and trade in the Muslim world. Baghdad gathered the translators, Cordoba dazzled
      the West with its mosque and libraries, Cairo led trade and learning from Egypt, and Timbuktu linked gold and books across the Sahara. Each city teaches a different
      way Muslims built a civilisation binding trade to learning and shared living.
    ur: 1500 سے پہلے بغداد، قرطبہ، قاہرہ اور تمبکتو مسلم دنیا میں علم اور تجارت کے مینار بنے۔ بغداد نے مترجموں کو جمع کیا، قرطبہ نے اپنی مسجد اور کتب خانوں سے مغرب
      کو محو کیا، قاہرہ نے مصر سے تجارت اور علم کی قیادت کی اور تمبکتو نے صحرا کے پار سونا اور کتابیں جوڑیں۔ ہر شہر ایک الگ طریقہ سکھاتا ہے جس سے مسلمانوں نے تجارت،
      علم اور باہمی رہائش جوڑنے والی تہذیب بنائی۔
  glossary:
  - term:
      ar: بغداد
      en: Baghdad
      ur: بغداد
    gloss:
      ar: عاصمة العلم في المشرق
      en: the East's capital of learning
      ur: مشرق کا علمی پایہ تخت
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطبہ
    gloss:
      ar: عاصمة الأندلس المضيئة
      en: al-Andalus's luminous capital
      ur: الاندلس کا روشن پایہ تخت
  - term:
      ar: القاهرة
      en: Cairo
      ur: قاہرہ
    gloss:
      ar: مدينة مصر القائدة للتجارة
      en: Egypt's city leading trade
      ur: مصر کا شہر جو تجارت کی قیادت کرتا تھا
  - term:
      ar: تمبكتو
      en: Timbuktu
      ur: تمبکتو
    gloss:
      ar: مدينة الذهب والكتب عبر الصحراء
      en: the city of gold and books across the Sahara
      ur: صحرا کے پار سونے اور کتابوں کا شہر
  - term:
      ar: بيت الحكمة
      en: the House of Wisdom
      ur: بیت الحکمت
    gloss:
      ar: دار ترجمة بغداد
      en: Baghdad's translation house
      ur: بغداد کا ترجمہ خانہ
  - term:
      ar: الجامع الكبير
      en: the Great Mosque
      ur: جامع مسجد
    gloss:
      ar: مسجد قرطبة المشهور
      en: Cordoba's famed mosque
      ur: قرطبہ کی مشہور مسجد
  - term:
      ar: الأزهر
      en: al-Azhar
      ur: الازہر
    gloss:
      ar: جامع القاهرة ومدرسته
      en: Cairo's mosque and school
      ur: قاہرہ کی مسجد اور مدرسہ
  - term:
