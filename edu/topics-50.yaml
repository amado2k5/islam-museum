      correct: true
      why:
        ar: قبل عام ١٥٠٠ صارت منارات
        en: before 1500 they became beacons
        ur: 1500 سے پہلے یہ مینار بنے
    - text:
        ar: قبل ١٠٠٠
        en: before 1000
        ur: 1000 سے پہلے
      correct: false
      why:
        ar: ١٥٠٠ حدها لا ١٠٠٠
        en: 1500 is the bound, not 1000
        ur: 1500 حد ہے، 1000 نہیں
    - text:
        ar: بعد ١٥٠٠
        en: after 1500
        ur: 1500 کے بعد
      correct: false
      why:
        ar: ليست بعد بل قبل
        en: before, not after
        ur: بعد نہیں، پہلے
    - text:
        ar: قبل ٢٠٠٠
        en: before 2000
        ur: 2000 سے پہلے
      correct: false
      why:
        ar: ١٥٠٠ حدها
        en: 1500 is the bound
        ur: 1500 حد ہے
  - q:
      ar: ما الذي جمع المدن؟
      en: What bound the cities?
      ur: شہروں کو کیا جوڑتا تھا؟
    options:
    - text:
        ar: التجارة والعلم والعيش
        en: trade, learning, shared living
        ur: تجارت، علم، باہمی رہائش
      correct: true
      why:
        ar: كلها ربطت تجارة بعلم وتعايش
        en: all bound trade to learning and coexistence
        ur: سب نے تجارت، علم اور بقائے باہمی جوڑے
    - text:
        ar: لغة واحدة فقط
        en: one language only
        ur: صرف ایک زبان
      correct: false
      why:
        ar: ليست لغة بل حضارة
        en: a civilisation, not just language
        ur: صرف زبان نہیں، تہذیب
    - text:
        ar: حاكم واحد
        en: one ruler
        ur: ایک حکمران
      correct: false
      why:
        ar: ليست حاكمًا واحدًا
        en: not one ruler
        ur: ایک حکمران نہیں
    - text:
        ar: دولة واحدة
        en: one state
        ur: ایک ریاست
      correct: false
      why:
        ar: ليست دولة بل مدن متفرقة
        en: separate cities, not one state
        ur: ایک ریاست نہیں، الگ شہر
  - q:
      ar: ماذا تعلمنا المدن؟
      en: What do the cities teach?
      ur: شہر کیا سکھاتے ہیں؟
    options:
    - text:
        ar: بناء حضارة رابطة
        en: building a binding civilisation
        ur: جوڑنے والی تہذیب بنانا
      correct: true
      why:
        ar: طرق ربط التجارة بالعلم والعيش
        en: ways of binding trade, learning, living together
        ur: تجارت، علم اور رہائش جوڑنے کے طریقے
    - text:
        ar: الحروب فقط
        en: wars only
        ur: صرف جنگیں
      correct: false
      why:
        ar: ليست حروبًا بل حضارة
        en: civilisation, not wars
        ur: جنگیں نہیں، تہذیب
    - text:
        ar: الانعزال
        en: isolation
        ur: تنہائی
      correct: false
      why:
        ar: ليس انعزالًا بل ربط
        en: binding, not isolation
        ur: تنہائی نہیں، جوڑنا
    - text:
        ar: البساطة فقط
        en: simplicity only
        ur: صرف سادگی
      correct: false
      why:
        ar: ليست بساطة بل علم وتجارة
        en: learning and trade, not simplicity
        ur: سادگی نہیں، علم اور تجارت
- id: hajj-network
  anchor: exhibit/pathway-g6-social-studies-hajj-network
  band: scholars
  title:
    ar: شبكة الحج
    en: The Hajj Network
    ur: حج کا جال
  sixty:
    ar: الحج خامس الأركان ورحلة تربط المسلمين عبر العالم. يتجه ملايين المسلمين كل عام إلى مكة من إفريقيا وآسيا وأوروبا والأمريكيتين، فيلبسون الثياب البيضاء نفسها
      ويطوفون حول الكعبة ويقفون في عرفة ويقذفون الجمرات وينحرون. وعبر التاريخ حملت طرق الحج — برية وبحرية — الناس والتجارة والعلم معًا، فصارت رحلة إيمان وشبكة تواصل
      عالمية.
    en: The Hajj is the fifth pillar and a journey that links Muslims across the world. Each year millions head to Mecca from Africa, Asia, Europe and the Americas,
      wearing the same white cloth, circling the Kaaba, standing at Arafah, casting the stones and sacrificing. Across history the Hajj routes — by land and sea —
      carried people, trade and learning together, becoming a journey of faith and a global network of connection.
    ur: حج پانچواں رکن ہے اور وہ سفر جو دنیا بھر کے مسلمانوں کو جوڑتا ہے۔ ہر سال لاکھوں مسلمان افریقہ، ایشیا، یورپ اور امریکہ سے مکہ روانہ ہوتے ہیں، ایک جیسے سفید
      کپڑے پہن کر کعبہ کا طواف کرتے، عرفات میں کھڑے ہوتے، کنکریاں مارتے اور قربانی کرتے ہیں۔ تاریخ بھر حج کے راستے — خشکی اور سمندر — لوگوں، تجارت اور علم کو ساتھ
      لائے تو یہ ایمان کا سفر اور دنیا بھری رابطوں کا جال بنا۔
  glossary:
  - term:
      ar: الحج
      en: the Hajj
      ur: حج
    gloss:
      ar: الركن الخامس ورحلة مكة
      en: the fifth pillar and the Mecca journey
      ur: پانچواں رکن اور مکہ کا سفر
  - term:
      ar: الإحرام
      en: ihram
      ur: احرام
    gloss:
      ar: الثياب البيضاء والنية
      en: the white cloth and the intention
      ur: سفید کپڑے اور نیت
  - term:
      ar: الطواف
      en: tawaf
      ur: طواف
    gloss:
      ar: دوران حول الكعبة سبعًا
      en: circling the Kaaba seven times
      ur: کعبہ کے گرد سات چکر
  - term:
      ar: الكعبة
      en: the Kaaba
      ur: کعبہ
    gloss:
      ar: البيت الذي يتجه إليه المسلمون
      en: the House Muslims turn toward
      ur: وہ گھر جس طرف مسلمان متوجہ ہوتے ہیں
  - term:
      ar: عرفة
      en: Arafah
      ur: عرفات
    gloss:
      ar: المكان الذي يقف فيه الحجاج
      en: where pilgrims stand
      ur: جہاں حاجی کھڑے ہوتے ہیں
  - term:
      ar: الجمرات
      en: the stones (jamarat)
      ur: کنکریاں
    gloss:
      ar: حجارة يقذفها الحجاج
      en: the pillars pilgrims stone
      ur: وہ ستون جن پر حاجی کنکریاں پھینکتے ہیں
  - term:
      ar: النحر
      en: the sacrifice
      ur: قربانی
    gloss:
      ar: ذبح الأضحية في العيد
      en: the feast's sacrifice
      ur: عید کی قربانی
  - term:
      ar: طرق الحج
      en: the Hajj routes
      ur: حج کے راستے
    gloss:
      ar: مسالك القوافل برية وبحرية
      en: the caravans' ways by land and sea
      ur: خشکی اور سمندر کے قافلہ راستے
  - term:
      ar: منسى
      en: Mina
      ur: منیٰ
    gloss:
      ar: مكان المبيت والجمرات
      en: the staying place and the stones
      ur: ٹھہرنے کی جگہ اور کنکریاں
  - term:
      ar: السعي
      en: sa'i (the walk)
      ur: سعی
    gloss:
      ar: السير بين الصفا والمروة
      en: the walk between Safa and Marwa
      ur: صفا اور مروہ کے درمیان چلنا
  - term:
      ar: مانسا موسى
      en: Mansa Musa
      ur: مانسا موسیٰ
    gloss:
      ar: أشهر حاج في التاريخ
      en: the most famous pilgrim in history
      ur: تاریخ کا مشہور ترین حاجی
  - term:
      ar: الملايين
      en: the millions
      ur: لاکھوں
    gloss:
      ar: عدد الحجاج كل عام
      en: the pilgrims' number each year
      ur: ہر سال حاجیوں کی تعداد
  practice:
  - q:
      ar: ما ركن الحج؟
      en: Which pillar is the Hajj?
      ur: حج کون سا رکن ہے؟
    options:
    - text:
        ar: الخامس
        en: the fifth
        ur: پانچواں
      correct: true
      why:
        ar: الحج الركن الخامس والأخير
        en: the Hajj is the fifth and last pillar
        ur: حج پانچواں اور آخری رکن ہے
    - text:
        ar: الأول
        en: the first
        ur: پہلا
      correct: false
      why:
        ar: الأول الشهادة لا الحج
        en: the first is the testimony
        ur: پہلا شہادت ہے
    - text:
        ar: الثالث
        en: the third
        ur: تیسرا
      correct: false
      why:
        ar: الثالث الزكاة لا الحج
        en: the third is zakat
        ur: تیسرا زکوٰت ہے
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: الرابع الصوم لا الحج
        en: the fourth is fasting
        ur: چوتھا روزہ ہے
  - q:
      ar: إلى أين يتجه الحجاج؟
      en: Where do pilgrims head?
      ur: حاجی کہاں جاتے ہیں؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: إلى مكة من كل جهة
        en: to Mecca from every direction
        ur: ہر سمت سے مکہ
    - text:
        ar: المدينة فقط
        en: only Medina
        ur: صرف مدینہ
      correct: false
      why:
        ar: الحج إلى مكة لا المدينة
        en: the Hajj is to Mecca, not Medina
        ur: حج مکہ کا ہے، مدینہ کا نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: الحج ليس إلى القدس
        en: the Hajj is not to Jerusalem
        ur: حج یروشلم کا نہیں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: القاهرة طريق لا وجهة
        en: Cairo is a way, not the goal
        ur: قاہرہ راستہ ہے، منزل نہیں
  - q:
      ar: ماذا يلبسون؟
      en: What do they wear?
      ur: وہ کیا پہنتے ہیں؟
    options:
    - text:
        ar: ثيابًا بيضاء موحدة
        en: the same white cloth
        ur: ایک جیسے سفید کپڑے
      correct: true
      why:
        ar: إحرام أبيض يساوي الجميع
        en: white ihram making all equal
        ur: سفید احرام جو سب برابر کرتا ہے
    - text:
        ar: حريرًا ملونًا
        en: coloured silk
        ur: رنگین ریشم
      correct: false
      why:
        ar: ليست حريرًا بل بياض
        en: white, not coloured silk
        ur: رنگین ریشم نہیں، سفید
    - text:
        ar: ذهبًا
        en: gold
        ur: سونا
      correct: false
      why:
        ar: ليست ذهبًا بل بياضًا
        en: white cloth, not gold
        ur: سونا نہیں، سفید کپڑے
    - text:
        ar: دروعًا
        en: armour
        ur: زرہ
      correct: false
      why:
        ar: ليست دروعًا بل ثيابًا
        en: cloth, not armour
        ur: زرہ نہیں، کپڑے
  - q:
      ar: ما الطواف؟
      en: What is tawaf?
      ur: طواف کیا ہے؟
    options:
    - text:
        ar: دوران حول الكعبة سبعًا
        en: circling the Kaaba seven times
        ur: کعبہ کے سات چکر
      correct: true
      why:
        ar: سبعة أشواط حول الكعبة
        en: seven rounds around the Kaaba
        ur: کعبہ کے گرد سات چکر
    - text:
        ar: ركض في الصحراء
        en: desert running
        ur: صحرا میں دوڑنا
      correct: false
      why:
        ar: ليست ركضًا بل دوران
        en: circling, not running
        ur: دوڑنا نہیں، چکر
    - text:
        ar: صلاة الليل
        en: night prayer
        ur: رات کی نماز
      correct: false
      why:
        ar: ليست صلاة بل طواف
        en: circling, not prayer
        ur: نماز نہیں، طواف
    - text:
        ar: جلوس في المسجد
        en: sitting in mosque
        ur: مسجد میں بیٹھنا
      correct: false
      why:
        ar: ليست جلوسًا بل دوران
        en: circling, not sitting
        ur: بیٹھنا نہیں، چکر
  - q:
      ar: أين يقف الحجاج؟
      en: Where do pilgrims stand?
      ur: حاجی کہاں کھڑے ہوتے ہیں؟
    options:
    - text:
        ar: عرفة
        en: at Arafah
        ur: عرفات
      correct: true
      why:
        ar: يقفون في عرفة يوم التاسع
        en: they stand at Arafah on the ninth
        ur: وہ نویں دن عرفات میں کھڑے ہوتے ہیں
    - text:
        ar: الكعبة فقط
        en: only the Kaaba
        ur: صرف کعبہ
      correct: false
      why:
        ar: الوقوف في عرفة لا الكعبة
        en: the standing is at Arafah, not the Kaaba
        ur: کھڑا ہونا عرفات میں ہے، کعبہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: ليست المدينة بل عرفة
        en: Arafah, not Medina
        ur: مدینہ نہیں، عرفات
    - text:
        ar: جدة
        en: Jeddah
        ur: جدہ
      correct: false
      why:
        ar: ليست جدة بل عرفة
        en: Arafah, not Jeddah
        ur: جدہ نہیں، عرفات
  - q:
      ar: ما الجمرات؟
      en: What are the jamarat?
      ur: کنکریاں کیا ہیں؟
    options:
    - text:
        ar: حجارة يقذفها الحجاج
        en: pillars pilgrims stone
        ur: وہ ستون جن پر کنکریاں پھینکتے ہیں
      correct: true
      why:
        ar: رمي الجمرات في منى
        en: casting the stones in Mina
        ur: منیٰ میں کنکریاں پھینکنا
    - text:
        ar: قباب صغيرة
        en: small domes
        ur: چھوٹے گنبد
      correct: false
      why:
        ar: ليست قبابًا بل جمرات
        en: stoned pillars, not domes
        ur: گنبد نہیں، جمرات
    - text:
        ar: آبار ماء
        en: water wells
        ur: پانی کے کنویں
      correct: false
      why:
        ar: ليست آبارًا بل رمي
        en: stoning sites, not wells
        ur: کنویں نہیں، جمرات
    - text:
        ar: أبواب المسجد
        en: mosque gates
        ur: مسجد کے دروازے
      correct: false
      why:
        ar: ليست أبوابًا بل جمرات
        en: stoned pillars, not gates
        ur: دروازے نہیں، جمرات
  - q:
      ar: ماذا حملت طرق الحج؟
      en: What did the Hajj routes carry?
      ur: حج کے راستے کیا لے گئے؟
    options:
    - text:
        ar: الناس والتجارة والعلم
        en: people, trade and learning
        ur: لوگ، تجارت اور علم
      correct: true
      why:
        ar: نقلت الناس والبضائع والعلوم معًا
        en: they carried people, goods and learning together
        ur: وہ لوگ، مال اور علم ساتھ لے گئے
    - text:
        ar: الجنود فقط
        en: only soldiers
        ur: صرف سپاہی
      correct: false
      why:
        ar: ليست جنودًا بل كل شيء
        en: everything, not just soldiers
        ur: صرف سپاہی نہیں، سب کچھ
    - text:
        ar: لا شيء
        en: nothing
        ur: کچھ نہیں
      correct: false
      why:
        ar: حملت كثيرًا
        en: they carried much
        ur: انھوں نے بہت کچھ لیا
    - text:
        ar: الأسلحة فقط
        en: only weapons
        ur: صرف ہتھیار
      correct: false
      why:
        ar: ليست أسلحة بل ناس وعلم
        en: people and learning, not weapons
        ur: ہتھیار نہیں، لوگ اور علم
  - q:
      ar: من أشهر حاج في التاريخ؟
      en: History's most famous pilgrim?
      ur: تاریخ کا مشہور ترین حاجی؟
    options:
    - text:
        ar: مانسا موسى
        en: Mansa Musa
        ur: مانسا موسیٰ
      correct: true
      why:
        ar: حج مانسا موسى أشهر رحلة
        en: Mansa Musa's is the most famous pilgrimage
        ur: مانسا موسیٰ کا حج مشہور ترین سفر ہے
    - text:
        ar: ابن بطّوطة فقط
        en: only Ibn Battuta
        ur: صرف ابن بطوطہ
      correct: false
      why:
        ar: ابن بطّوطة حج لكن موسى أشهر
        en: Ibn Battuta hajjed but Musa is famed
        ur: ابن بطوطہ نے حج کیا مگر موسیٰ مشہور
    - text:
        ar: سليمان القانوني
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان لم يحج
        en: Süleyman never hajjed
        ur: سلیمان نے حج نہیں کیا
    - text:
        ar: صلاح الدين
        en: Saladin
        ur: صلاح الدین
      correct: false
      why:
        ar: صلاح الدين لم يحج معروفًا
        en: Saladin is not famed for hajj
        ur: صلاح الدین حج میں مشہور نہیں
  - q:
      ar: ما السعي؟
      en: What is sa'i?
      ur: سعی کیا ہے؟
    options:
    - text:
        ar: السير بين الصفا والمروة
        en: walking Safa to Marwa
        ur: صفا تا مروہ چلنا
      correct: true
      why:
        ar: سبعة أشواط بين الجبلين
        en: seven lengths between the two hills
        ur: دو پہاڑیوں کے درمیان سات چکر
    - text:
        ar: تسلق جبل
        en: climbing a mountain
        ur: پہاڑ چڑھنا
      correct: false
      why:
        ar: ليست تسلقًا بل سير بين جبلين
        en: walking between hills, not climbing
        ur: چڑھنا نہیں، دو پہاڑیوں کے درمیان چلنا
    - text:
        ar: صوم يوم
        en: a day's fast
        ur: ایک دن کا روزہ
      correct: false
      why:
        ar: ليست صومًا بل سعي
        en: walking, not fasting
        ur: روزہ نہیں، سعی
    - text:
        ar: ركوب بعير
        en: riding a camel
        ur: اونٹ سواری
      correct: false
      why:
        ar: ليست ركوبًا بل مشي
        en: walking, not riding
        ur: سواری نہیں، چلنا
  - q:
      ar: لماذا تُسمّى شبكة؟
      en: Why called a network?
      ur: یہ جال کیوں کہلایا؟
    options:
    - text:
        ar: لأنها تربط العالم
        en: it links the world
