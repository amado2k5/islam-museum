  practice:
  - q:
      ar: ما رتبة الأقصى في الحرمين؟
      en: What is al-Aqsa''s rank among sanctuaries?
      ur: حرموں میں اقصیٰ کا درجہ کیا ہے؟
    options:
    - text:
        ar: ثالث الحرمين
        en: the third sanctuary
        ur: تیسرا حرم
      correct: true
      why:
        ar: يذكر الاسم مكانتها بعد مكة والمدينة
        en: the name ranks her after Mecca and Medina
        ur: نام اسے مکہ اور مدینہ کے بعد رکھتا ہے
    - text:
        ar: أول الحرمين
        en: the first sanctuary
        ur: پہلا حرم
      correct: false
      why:
        ar: أولهما مكة لا القدس
        en: the first is Mecca, not Jerusalem
        ur: پہلا مکہ ہے، بیت المقدس نہیں
    - text:
        ar: الرابع
        en: the fourth
        ur: چوتھا
      correct: false
      why:
        ar: ثلاثة حرام لا أربعة
        en: three sanctuaries, not four
        ur: تین حرم ہیں، چار نہیں
    - text:
        ar: لا رتبة
        en: no rank
        ur: کوئی درجہ نہیں
      correct: false
      why:
        ar: يذكر الاسم ثالث الحرمين
        en: the name gives her the third sanctuary
        ur: نام اسے تیسرا حرم دیتا ہے
  - q:
      ar: ما القبلة الأولى؟
      en: What was the first qibla?
