- id: life-of-the-prophet
  anchor: exhibit/pathway-g11-hrt3m-life-of-the-prophet
  band: scholars
  title:
    ar: سيرة النبي محمد
    en: The Life of the Prophet Muhammad
    ur: سیرتِ نبی محمد
  sixty:
    ar: 'حياة النبي — السيرة: من يتيم مكة الذي لُقّب بالأمين إلى رسول العالمين. في غار حراء نزل عليه الوحي نحو ٦١٠ فدعا إلى توحيد الله سرًّا ثم علنًا، وصبر على أذى قريش ثلاث عشرة سنة، ثم هاجر إلى يثرب سنة ٦٢٢ فقامت أول جماعة مسلمة بدستورها ومسجدها. من هناك بدر والأحزاب وصلح الحديبية الذي فتح الباب لفتح مكة ٦٣٠، فدخل الناس في دين الله أفواجًا، ثم خطب خطبة الوداع سنة ٦٣٢ وقضى. وتركت سيرته المكتوبة عند ابن إسحاق والطبري وابن سعد نموذجًا تقلّده الأجيال: الأمانة والرحمة والصبر — قصة رسول كاملة في أقلّ من ربع قرن.  ولهذا ما يزال اسمه الأكثر على لسان البشر: يولد مسلم كلّ ثانية تقريبًا ينادى باسمه، ويموت مسلم وآخر كلماته عنه — ذكرى لا تنقطع.  وهي قصة الإنسانية الكاملة: من اليتم إلى الرسالة، من الاضطهاد إلى النصر، من الرجل إلى المثال الذي تقتدي به الأجيال.'
    en: 'The Prophet''s life — the sira: from Mecca''s orphan called the Trustworthy to the messenger to the worlds. In the cave of Hira revelation came down on him around 610, and he called to God''s oneness secretly then openly, endured Quraysh''s hurt thirteen years, then migrated to Yathrib in 622 where the first Muslim community stood with its charter and mosque. From there came Badr, the Confederates and the Hudaybiyyah peace that opened the door to Mecca''s conquest in 630, and people entered God''s religion in throngs; then he preached the farewell sermon in 632 and passed. His written life at Ibn Ishaq, al-Tabari and Ibn Sa''d left a model the generations emulate — honesty, mercy and patience, a whole messenger''s story in under a quarter-century.  That is why his name stays the most on human tongues: a Muslim is born every second or so called by it, and a Muslim dies with his last words about him — a remembrance unbroken.'
    ur: 'نبی کی زندگی — سیرت: مکہ کے یتیم سے جو امین کہلایا تا رسولِ عالمین۔ غارِ حرا میں تقریباً 610ء میں اس پر وحی نازل ہوئی اور اس نے خدا کی توحید کی دعوت پہلے پوشیدہ پھر کھلم کھلا دی، قریش کے ظلم پر تیرہ برس صبر کیا، پھر 622ء میں یثرب ہجرت کی جہاں پہلی مسلم برادری اپنے میثاق اور مسجد کے ساتھ قائم ہوئی۔ وہاں سے بدر، احزاب اور صلح حدیبیہ آئی جس نے 630ء میں فتح مکہ کا راستہ کھولا اور لوگ جوق در جوق دین میں آئے، پھر 632ء میں اس نے خطبۂ وداع دیا اور رحلت فرمائی۔ ابن اسحاق، طبری اور ابن سعد کے ہاں اس کی لکھی سیرت نے وہ نمونہ چھوڑا جس کی نسلیں پیروی کرتی ہیں — امانت، رحمت اور صبر، پورے رسول کی کہانی پون صدی سے بھی کم میں۔  اسی لیے اس کا نام بشری زبانوں پر سب سے زیادہ رہتا ہے: تقریباً ہر ثانی مسلمان پیدا ہوتا ہے جسے اس کے نام سے پکارا جاتا ہے، اور مسلمان فوت ہوتا ہے جس کے آخری الفاظ اسی کے بارے میں ہیں — ذکر جو کبھی نہ ٹوٹتا۔'
  glossary:
  - term:
      ar: الأمين
      en: the Trustworthy
      ur: امین
    gloss:
      ar: 'لقبه قبل البعثة في مكة'
