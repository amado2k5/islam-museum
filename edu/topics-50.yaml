        ur: پتھر نہیں، اعمال
    - text:
        ar: لأنها قديمة
        en: for being old
        ur: پرانے ہونے کے لیے
      correct: false
      why:
        ar: ليست قديمة بل أساسية
        en: foundational, not just old
        ur: پرانے نہیں، بنیادی
    - text:
        ar: لأنها خمسة
        en: for being five
        ur: پانچ ہونے کے لیے
      correct: false
      why:
        ar: ليس العدد بل الوظيفة
        en: the role, not the number
        ur: تعداد نہیں، کردار
- id: islamic-art-architecture
  anchor: exhibit/pathway-g11-hrt3m-islamic-art-architecture
  band: researchers
  title:
    ar: الفن والعمارة الإسلامية
    en: Islamic Art and Architecture
    ur: اسلامی فن اور تعمیرات
  sixty:
    ar: 'الفن والعمارة الإسلامية: لغة واحدة تحدّثتها قرطبة ودمشق وبغداد وسمرقند وإسطنبول. أساسها النمط الهندسي الذي يملأ السطح بلا نهاية، والأرابيسك النباتي الذي لا يصوّر وجهًا، والخط العربي الذي يكتب كلام الله زخرفةً. وأعمدة قرطبة ذات العقود المزدوجة، وقبة الصخرة ذات الثمانية، ومحراب كلّ مسجد يوجّه إلى مكة، ومآذن ترفع الأذان، وإيوانات إسفهان وقراميدها الزرقاء، ومقرنص الحمراء المتدلّي كالنجوم، وتوازن سنان الذي جعل القبّة تطفو. فنٌّ واحد وفي ألف لسان محلي — والجامع المشترك: الجمال في خدمة العبادة والعلم والبيت.  وبهذا تكتمل اللغة: الحجر يتكلّم بالنمط، والحرف بالخط، والنور بالقبّة — فالعمارة الإسلامية تلاوة مرئية لا مكتوبة.  وهي تذكير بأن الجمال ليس رفاهية بل عبادة: المسجد الجميل يرفع القلب كما يرفع السقف، والنمط يعلّم الصبر.'
    en: 'Islamic art and architecture: one language spoken by Cordoba, Damascus, Baghdad, Samarkand and Istanbul. Its basis is the geometric pattern filling a surface without end, the vegetal arabesque picturing no face, and Arabic calligraphy writing God''s speech as ornament. Cordoba''s double-arched columns, the Dome of the Rock''s eightfold form, every mosque''s mihrab pointing to Mecca, minarets raising the call, Isfahan''s iwans and blue tilework, the Alhambra''s muqarnas hanging like stars, and Sinan''s balance making the dome float — one art in a thousand local tongues, the common thread being beauty in the service of worship, knowledge and home.  So the language completes itself: stone speaks in pattern, letter in calligraphy, light in dome — Islamic architecture is a recitation seen, not written.'
    ur: 'اسلامی فن اور فنِ تعمیر: ایک زبان جسے قرطہ، دمشق، بغداد، سمرقند اور استنبول نے بولا۔ اس کی بنیاد بے انتہا سطح کو بھرنے والا ہندسی نمونہ، وہ نباتی عربی نقش جو کوئی چہرہ نہیں دکھاتا، اور وہ عربی خطاطی جو خدا کا کلام آرائش میں لکھتی ہے۔ قرطہ کے دوہری محراب والے ستون، قبة الصخرة کی آٹھ پہلو شکل، ہر مسجد کا مکہ کی طرف محراب، اذان اٹھانے والے مینار، اصفہان کے ایوان اور نیلی ٹائلیں، الحمرا کا ستاروں جیسا لٹکتا مقرنس، اور سنان کا توازن جو گنبد کو تیراتا ہے — ایک فن ہزار مقامی زبانوں میں، مشترک دھاگا یہ ہے: عبادت، علم اور گھر کی خدمت میں حسن۔  اسی لیے زبان مکمل ہوتی ہے: پتھر نمونہ بولتا ہے، حرف خطاطی، روشنی گنبد — اسلامی فنِ تعمیر دیکھی جانے والی تلاوت ہے، لکھی ہوئی نہیں۔'
  glossary:
  - term:
      ar: الأرابيسك
      en: the arabesque
      ur: ارابیسک
    gloss:
      ar: 'النبات الهندسي بلا وجه'
