        ur: عثمان نے 1299 میں خاندان بنایا
    - text:
        ar: سليمان
        en: Süleyman
        ur: سلیمان
      correct: false
      why:
        ar: سليمان ذروة لا بداية
        en: Süleyman was the peak, not the start
        ur: سلیمان عروج تھا، آغاز نہیں
    - text:
        ar: محمد الفاتح
        en: Mehmed II
        ur: محمد فاتح
      correct: false
      why:
        ar: محمد الفاتح بعده بقرن
        en: Mehmed came a century later
        ur: محمد فاتح ایک صدی بعد تھا
    - text:
        ar: سليم الأول
        en: Selim I
        ur: سلیم اول
      correct: false
      why:
        ar: سليم الأول حفيد متأخر
        en: Selim I was a later heir
        ur: سلیم اول بعد کا وارث تھا
  - q:
      ar: متى سقطت القسطنطينية؟
      en: When did Constantinople fall?
      ur: قسطنطنیہ کب گرا؟
    options:
    - text:
        ar: عام ١٤٥٣
        en: in 1453
        ur: 1453 میں
      correct: true
      why:
        ar: فتحها محمد الثاني عام ١٤٥٣
        en: Mehmed II took it in 1453
        ur: محمد دوم نے 1453 میں لیا
    - text:
        ar: عام ١٢٠٤
        en: in 1204
        ur: 1204 میں
      correct: false
      why:
        ar: ١٢٠٤ عام الصليبيين لا العثمانيين
        en: 1204 was the Crusaders' sack, not the Ottomans'
        ur: 1204 صلیبیوں کی تھی، عثمانیوں کی نہیں
    - text:
        ar: عام ١٥٢٦
        en: in 1526
        ur: 1526 میں
      correct: false
