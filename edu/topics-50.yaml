  - term:
      ar: خطب الوداع
      en: the farewell sermon
      ur: خطبہ وداع
    gloss:
      ar: 'خطبة الوداع قبل الرحيل'
      en: 'the farewell sermon before the departure'
      ur: 'رخصت سے پہلے الوداع کا خطبہ'
  - term:
      ar: السيرة
      en: the sira (biography)
      ur: سیرت
    gloss:
      ar: 'الكتب التي رووا فيها سيرته'
      en: 'the books telling his life'
      ur: 'وہ کتابیں جن میں اس کی سیرت بیان ہے'
  - term:
      ar: الأسوة
      en: the model
      ur: نمونہ
    gloss:
      ar: 'المثال الذي تتبعه الأجيال'
      en: 'the model the generations follow'
      ur: 'وہ نمونہ جس کی نسلیں پیروی کرتی ہیں'
  - term:
      ar: ٦٣٢
      en: '632'
      ur: 632ء
    gloss:
      ar: 'سنة وفاته في المدينة'
      en: 'the year of his death in Medina'
      ur: 'مدینہ میں اس کی وفات کا سال'
  practice:
  - q:
      ar: أين وُلد؟
      en: Where was he born?
      ur: وہ کہاں پیدا ہوئے؟
    options:
    - text:
        ar: مكة
        en: Mecca
        ur: مکہ
      correct: true
      why:
        ar: ولد في مكة نحو عام ٥٧٠
        en: born in Mecca about 570
        ur: تقریباً 570 میں مکہ میں پیدا ہوئے
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة وجهة الهجرة لا المولد
        en: Medina was the Hijra's destination
        ur: مدینہ ہجرت کی منزل تھی، پیدائش نہیں
    - text:
        ar: الطائف
        en: Taif
        ur: طائف
      correct: false
      why:
        ar: الطائف مدينة قريبة لا مولده
        en: Taif was nearby, not his birth
        ur: طائف قریب تھا، پیدائش نہیں
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس ليست مولده
        en: Jerusalem was not his birth
        ur: یروشلم پیدائش نہیں
  - q:
      ar: ما لقبه قبل النبوة؟
      en: His name before prophethood?
      ur: نبوت سے پہلے اس کا لقب؟
    options:
    - text:
        ar: الأمين
        en: the Trustworthy
        ur: امین
      correct: true
      why:
        ar: لقّب بالأمين لصدقه
        en: named 'the Trustworthy' for honesty
        ur: دیانت کے لیے «امین» کہلائے
    - text:
        ar: الخليفة
        en: the Caliph
        ur: خلیفہ
      correct: false
      why:
        ar: ليس خليفة قبل النبوة
        en: not 'caliph' before prophethood
        ur: نبوت سے پہلے خلیفہ نہیں
    - text:
        ar: السلطان
        en: the Sultan
        ur: سلطان
      correct: false
      why:
        ar: ليس سلطانًا بل أمينًا
        en: '''Trustworthy'', not sultan'
        ur: سلطان نہیں، امین
    - text:
        ar: الفاتح
        en: the Conqueror
        ur: فاتح
      correct: false
      why:
        ar: ليس فاتحًا قبل النبوة
        en: not 'Conqueror' before prophethood
        ur: نبوت سے پہلے فاتح نہیں
  - q:
      ar: أين نزل الوحي أول مرة؟
      en: Where did revelation first come?
      ur: وحی پہلی بار کہاں آئی؟
    options:
    - text:
        ar: غار حراء
        en: the cave of Hira
        ur: غار حرا
      correct: true
      why:
        ar: في غار حراء نزل أول الوحي
        en: in the cave of Hira the first revelation came
        ur: غار حرا میں پہلی وحی آئی
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة ليست موضع أول وحي
        en: the Kaaba was not where it first came
        ur: کعبہ پہلی وحی کی جگہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة بعده بسنوات
        en: Medina came years later
        ur: مدینہ برسوں بعد آئی
    - text:
        ar: القدس
        en: Jerusalem
        ur: یروشلم
      correct: false
      why:
        ar: القدس ليست موضعه
        en: Jerusalem was not the place
        ur: یروشلم جگہ نہیں
  - q:
      ar: كم دعا في مكة؟
      en: How long did he call in Mecca?
      ur: مکہ میں کتنے عرصے دعوت دی؟
    options:
    - text:
        ar: ثلاثة عشر عامًا
        en: thirteen years
        ur: تیرہ سال
      correct: true
      why:
        ar: ثلاثة عشر عامًا قبل الهجرة
        en: thirteen years before the Hijra
        ur: ہجرت سے پہلے تیرہ سال
    - text:
        ar: عشرة أعوام
        en: ten years
        ur: دس سال
      correct: false
      why:
        ar: عشرة أعوام مدة المدينة
        en: ten years was the Medina era
        ur: دس سال مدینہ کا عرصہ تھا
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة مدة السرية فقط
        en: three was the secret phase
        ur: تین صرف پوشیدہ مرحلہ تھا
    - text:
        ar: عشرون
        en: twenty
        ur: بیس
      correct: false
      why:
        ar: ثلاثة وعشرون مجموع الدعوة
        en: twenty-three was the whole mission
        ur: تئیس کل دعوت تھی
  - q:
      ar: ماذا أسّس في المدينة؟
      en: What did he found in Medina?
      ur: مدینہ میں اس نے کیا قائم کیا؟
    options:
    - text:
        ar: جماعة ودولة
        en: a community and a state
        ur: برادری اور ریاست
      correct: true
      why:
        ar: أسّس أمّة ودولة فيها
        en: he founded a community and state there
        ur: اس نے وہاں امت اور ریاست بنائی
    - text:
        ar: مدرسة فقط
        en: only a school
        ur: صرف مدرسہ
      correct: false
      why:
        ar: ليست مدرسة بل دولة
        en: a state, not just a school
        ur: صرف مدرسہ نہیں، ریاست
    - text:
        ar: سوقًا
        en: a market
        ur: بازار
      correct: false
      why:
        ar: ليست سوقًا بل دولة
        en: a state, not a market
        ur: بازار نہیں، ریاست
    - text:
        ar: جيشًا فقط
        en: only an army
        ur: صرف لشکر
      correct: false
      why:
        ar: ليست جيشًا بل جماعة
        en: a community, not just an army
        ur: صرف لشکر نہیں، برادری
  - q:
      ar: كيف دخل مكة؟
      en: How did he enter Mecca?
      ur: وہ مکہ میں کیسے داخل ہوا؟
    options:
    - text:
        ar: سلمًا بعفو
        en: peacefully, pardoning
        ur: امن سے، معاف کرتے ہوئے
      correct: true
      why:
        ar: دخلها بعفو عام ٦٣٠
        en: he entered pardoning in 630
        ur: اس نے 630 میں معافی کے ساتھ داخل کیا
    - text:
        ar: بانتقام
        en: with revenge
        ur: انتقام سے
      correct: false
      why:
        ar: لم ينتقم بل عفا
        en: he pardoned, not avenged
        ur: اس نے انتقام نہیں لیا، معاف کیا
    - text:
        ar: بمعركة طويلة
        en: after a long battle
        ur: طویل لڑائی کے بعد
      correct: false
      why:
        ar: لم يقاتل بل دخل بسلام
        en: he entered in peace, not battle
        ur: اس نے لڑائی نہیں کی، امن سے داخل ہوا
    - text:
        ar: لم يدخلها
        en: he never entered
        ur: کبھی داخل نہیں ہوا
      correct: false
      why:
        ar: دخلها عام ٦٣٠
        en: he entered in 630
        ur: وہ 630 میں داخل ہوا
  - q:
      ar: ما «صلح الحديبية»؟
      en: What was Hudaybiyyah?
      ur: حدیبیہ کی صلح کیا تھی؟
    options:
    - text:
        ar: هدنة فتحت الطريق
        en: a truce opening the way
        ur: راستہ کھولنے والی صلح
      correct: true
      why:
        ar: هدنة مهّدت فتح مكة
        en: a truce that paved Mecca's opening
        ur: وہ صلح جس نے مکہ کا راستہ بنایا
    - text:
        ar: معركة كبرى
        en: a great battle
        ur: بڑی لڑائی
      correct: false
      why:
        ar: ليست معركة بل صلحًا
        en: a truce, not a battle
        ur: لڑائی نہیں، صلح
    - text:
        ar: معاهدة بيع
        en: a sale treaty
        ur: بیع کا معاہدہ
      correct: false
      why:
        ar: ليست بيعًا بل هدنة
        en: a truce, not a sale
        ur: بیع نہیں، صلح
    - text:
        ar: حلف تجارة
        en: a trade pact
        ur: تجارتی معاہدہ
      correct: false
      why:
        ar: ليست تجارة بل هدنة
        en: a truce, not trade
        ur: تجارت نہیں، صلح
  - q:
      ar: أين خطب وداعًا؟
      en: Where was the farewell sermon?
      ur: خطبہ وداع کہاں دیا؟
    options:
    - text:
        ar: عرفة
        en: at Arafah
        ur: عرفہ میں
      correct: true
      why:
        ar: في عرفة خطب الوداع
        en: at Arafah he gave the farewell sermon
        ur: عرفہ میں اس نے خطبہ وداع دیا
    - text:
        ar: الكعبة
        en: the Kaaba
        ur: کعبہ
      correct: false
      why:
        ar: الكعبة ليست موضع الخطبة
        en: the Kaaba was not the sermon site
        ur: کعبہ خطبے کی جگہ نہیں
    - text:
        ar: المدينة
        en: Medina
        ur: مدینہ
      correct: false
      why:
        ar: المدينة ليست موضع الوداع
        en: Medina was not the farewell place
        ur: مدینہ وداع کی جگہ نہیں
    - text:
        ar: منى
        en: Mina
        ur: منیٰ
      correct: false
      why:
        ar: منى قريبة لكنها عرفة
        en: Mina is near but it was Arafah
        ur: منیٰ قریب ہے مگر عرفہ تھا
  - q:
      ar: متى توفي؟
      en: When did he pass?
      ur: اس کی وفات کب ہوئی؟
    options:
    - text:
        ar: عام ٦٣٢
        en: in 632
        ur: 632 میں
      correct: true
      why:
        ar: توفي في المدينة عام ٦٣٢
        en: he passed in Medina in 632
        ur: وہ 632 میں مدینہ میں فوت ہوئے
    - text:
        ar: عام ٦٣٠
        en: in 630
        ur: 630 میں
      correct: false
      why:
        ar: ٦٣٠ عام الفتح لا الوفاة
        en: 630 is the conquest year
        ur: 630 فتح کا سال ہے
    - text:
        ar: عام ٦٢٢
        en: in 622
        ur: 622 میں
      correct: false
      why:
        ar: ٦٢٢ عام الهجرة لا الوفاة
        en: 622 is the Hijra year
        ur: 622 ہجرت کا سال ہے
    - text:
        ar: عام ٦١٠
        en: in 610
        ur: 610 میں
      correct: false
      why:
        ar: ٦١٠ عام الوحي لا الوفاة
        en: 610 is the revelation year
        ur: 610 وحی کا سال ہے
  - q:
      ar: ماذا ترك للمسلمين؟
      en: What did he leave Muslims?
      ur: اس نے مسلمانوں کے لیے کیا چھوڑا؟
    options:
    - text:
        ar: أسوة لكل مسلم
        en: a model for every Muslim
        ur: ہر مسلمان کا نمونہ
      correct: true
      why:
        ar: ترك سيرة تتبعها الأمة
        en: he left a life the umma follows
        ur: اس نے سیرت چھوڑی جسے امت پیروتی ہے
    - text:
        ar: مالًا كثيرًا
        en: much wealth
        ur: بہت دولت
      correct: false
      why:
        ar: لم يترك مالًا بل أسوة
        en: a model, not wealth
        ur: دولت نہیں، نمونہ
    - text:
        ar: جيشًا فقط
        en: only an army
        ur: صرف لشکر
      correct: false
      why:
        ar: ليست جيشًا بل أسوة
        en: a model, not an army
        ur: لشکر نہیں، نمونہ
    - text:
        ar: قصرًا
        en: a palace
        ur: محل
      correct: false
      why:
        ar: ليست قصرًا بل سيرة
        en: a life example, not a palace
        ur: محل نہیں، سیرت
- id: quran-as-a-text
  anchor: exhibit/pathway-g11-hrt3m-quran-as-a-text
  band: scholars
  title:
    ar: القرآن نصًّا
    en: The Qur'an as a Text
    ur: قرآن بطور متن
  sixty:
    ar: 'القرآن كنصّ: الوحي الذي نزل على النبي في ثلاث وعشرين سنة بمكة والمدينة، ١١٤ سورة تتدرّج من قصيرة مكية إلى طويلة مدنية. حفظه الحفّاظ في صدورهم وكتبه الكتبة على الصحف والعظام والرقاع، وجمعه أبو بكر بعد اليمامة في صحف واحدة بيد زيد بن ثابت، ثم نسخه عثمان في مصاحف موحّدة أرسلها إلى الأمصار. وبقي النصّ منذ ذلك اليوم واحدًا لا يتغيّر: يقرأه المسلمون بالعربية في كلّ لسان، ويحفظه أطفال في جاكرتا كما في دمشق، ويكتب بالخط نفسه على كلّ مصحف. وهو أقدم كتاب مقدّس نصُّه مستمر بلا فصل منذ نزوله — المعجزة الدائمة.  وهو الكتاب الوحيد الذي تحفظه أمّة كاملة عن ظهر قلب: ستّون قرنًا من الزمن لم تغيّر حرفًا — فهو الدرس في أن الكلمة الحقيقية لا تفنى.  وهو الكتاب الذي يبدأ به كلّ طفل تعليمه، وينتهي به كلّ مسلم حياته — أول حرف يتعلمه وآخر حرف يقرأه.'
    en: 'The Qur''an as text: the revelation that came down on the Prophet over twenty-three years in Mecca and Medina — 114 suras ranging from short Meccan to long Medinan. The huffaz kept it in their hearts and the scribes wrote it on sheets, bones and patches; Abu Bakr gathered it into one collection after Yamama through Zayd ibn Thabit, then Uthman copied it into uniform mushafs sent to the provinces. The text has stayed one and unchanged since that day: Muslims read it in Arabic in every tongue, children in Jakarta memorise it as in Damascus, and every mushaf carries the same script. It is the oldest holy book whose text has run unbroken since its descent — the standing miracle.  It is the one book a whole nation keeps by heart: sixty-odd centuries of days have not changed a letter — the lesson that the true word does not perish.'
    ur: 'قرآن بطور متن: وہ وحی جو نبی پر مکہ اور مدینہ میں تئیس برس میں نازل ہوئی — 114 سورتیں چھوٹی مکی سے بڑی مدنی تک۔ حفاظ نے اسے سینوں میں رکھا اور کاتبوں نے چادروں، ہڈیوں اور پرچوں پر لکھا؛ ابوبکر نے یمامہ کے بعد زید بن ثابت کے ذریعے اسے ایک جگہ جمع کیا، پھر عثمان نے یکساں مصحف بنوا کر صوبوں میں بھیجے۔ اس دن سے متن ایک اور غیر بدلا ہوا ہے: مسلمان اسے ہر زبان میں عربی پڑھتے ہیں، جکارتہ کے بچے اسے ویسے ہی یاد کرتے ہیں جیسے دمشق میں، اور ہر مصحف وہی رسم الخط اٹھاتا ہے۔ یہ قدیم ترین مقدس کتاب ہے جس کا متن نزول سے بلا فصل چلا آرہا ہے — قائم معجزہ۔  یہ واحد کتاب ہے جسے پوری قوم زبانی یاد رکھتی ہے: ساٹھ صدیوں کے دنوں نے ایک حرف نہیں بدلا — سبق یہ کہ سچا لفظ فنا نہیں ہوتا۔'
  glossary:
  - term:
      ar: الوحي
      en: revelation
      ur: وحی
    gloss:
      ar: 'الكلام الذي نزل على النبي'
      en: 'the speech come down on the Prophet'
      ur: 'نبی پر اترا ہوا کلام'
  - term:
      ar: السورة
      en: the sura
      ur: سورۃ
    gloss:
      ar: 'الوحدة الكبرى من الفصول'
      en: 'the large chapter unit'
      ur: 'ابواب کی بڑی اکائی'
  - term:
      ar: الآية
      en: the aya
      ur: آیت
    gloss:
      ar: 'الوحدة الصغرى من النص'
      en: 'the text''s small unit'
      ur: 'متن کی چھوٹی اکائی'
  - term:
      ar: الحفظ
      en: memorisation
      ur: حفظ
    gloss:
      ar: 'حفظ النص في الصدور'
      en: 'keeping the text in chests'
      ur: 'متن کا سینوں میں یاد رہنا'
  - term:
      ar: المصحف
      en: the mushaf
      ur: مصحف
    gloss:
      ar: 'النسخة المكتوبة من الكتاب'
      en: 'the written copy of the Book'
      ur: 'کتاب کی لکھی ہوئی نقل'
  - term:
      ar: أبو بكر
      en: Abu Bakr
      ur: ابو بکر
    gloss:
      ar: 'الخليفة الذي جمع الصحف'
      en: 'the caliph who gathered the sheets'
      ur: 'وہ خلیفہ جس نے صحف جمع کیے'
  - term:
      ar: عثمان
      en: Uthman
      ur: عثمان
    gloss:
      ar: 'الخليفة الذي وحّد المصاحف'
      en: 'the caliph who unified the mushafs'
      ur: 'وہ خلیفہ جس نے مصحفوں کو یکساں کیا'
  - term:
      ar: زيد بن ثابت
      en: Zayd ibn Thabit
      ur: زید بن ثابت
    gloss:
      ar: 'الكاتب الذي نسخ النص'
      en: 'the scribe who copied the text'
      ur: 'وہ کاتب جس نے متن نقل کیا'
  - term:
      ar: اليمامة
      en: Yamama
      ur: یمامہ
    gloss:
      ar: 'المعركة التي حفظت القرآن'
      en: 'the battle that saved the Qur''an'
      ur: 'وہ لڑائی جس نے قرآن بچایا'
  - term:
      ar: الرقاع
      en: parchments
      ur: چمڑے
    gloss:
      ar: 'الجلود التي كُتبت عليها النصوص'
      en: 'the skins texts were written on'
      ur: 'وہ کھالیں جن پر متن لکھے گئے'
  - term:
      ar: ثلاثة وعشرون
      en: twenty-three
      ur: تئیس
    gloss:
      ar: 'سنوت نزول الوحي'
      en: 'the years of revelation''s descent'
      ur: 'وحی کے نزول کے برس'
  - term:
      ar: الحفّاظ
      en: the huffaz
      ur: حفاظ
    gloss:
      ar: 'الذين يحفظون الكتاب كاملًا'
      en: 'those who keep the whole Book'
      ur: 'وہ جو پوری کتاب یاد رکھتے ہیں'
  practice:
  - q:
      ar: كم استغرق نزوله؟
      en: How long did its descent take?
      ur: اس کا نزول کتنے عرصے میں ہوا؟
    options:
    - text:
        ar: ثلاثة وعشرون عامًا
        en: twenty-three years
        ur: تئیس سال
      correct: true
      why:
        ar: من ٦١٠ إلى ٦٣٢ ثلاثة وعشرون
        en: from 610 to 632, twenty-three years
        ur: 610 تا 632، تئیس سال
    - text:
        ar: ثلاثة أعوام
        en: three years
        ur: تین سال
      correct: false
      why:
        ar: ثلاثة مدة السرية فقط
        en: three was only the secret phase
        ur: تین صرف پوشیدہ مرحلہ تھا
    - text:
        ar: أربعون عامًا
        en: forty years
        ur: چالیس سال
      correct: false
      why:
        ar: أربعون أكثر من عمر النزول
        en: forty exceeds the descent's span
        ur: چالیس نزول سے زیادہ ہے
    - text:
        ar: قرن
        en: a century
        ur: ایک صدی
      correct: false
      why:
        ar: قرن أكثر بكثير
        en: a century is far more
        ur: ایک صدی بہت زیادہ ہے
  - q:
      ar: كيف نزل أولاً؟
      en: How did it first come down?
      ur: یہ پہلے کیسے آیا؟
    options:
    - text:
        ar: شفهًا
        en: orally
        ur: زبانی
      correct: true
      why:
        ar: نزل تلاوة وكُتب وحُفظ
        en: it came as recitation, written and memorised
        ur: یہ تلاوت آیا، لکھا اور یاد کیا گیا
    - text:
        ar: كتابًا كاملاً
        en: as a full book
        ur: پوری کتاب
      correct: false
      why:
        ar: لم ينزل كتابًا بل تلاوة
        en: as recitation, not a whole book
        ur: پوری کتاب نہیں، تلاوت
    - text:
        ar: لوحًا حجريًا
        en: on stone tablets
        ur: پتھر کی تختیوں پر
      correct: false
      why:
        ar: ليست ألواحًا بل وحيًا
        en: revelation, not tablets
        ur: تختی نہیں، وحی
    - text:
        ar: مخطوطًا جاهزًا
        en: a ready codex
        ur: تیار مخطوط
      correct: false
      why:
        ar: لم يأتِ جاهزًا بل نزل شفهًا
        en: came orally, not ready-made
        ur: تیار نہیں آیا، زبانی آیا
  - q:
      ar: على ماذا كُتب؟
      en: On what was it written?
      ur: یہ کس پر لکھا گیا؟
    options:
    - text:
        ar: رقاع وعظام وسعف
        en: skins, bones, fronds
        ur: کھالیں، ہڈیاں، پتے
      correct: true
      why:
        ar: كتب على الرقاع والعظام والسعف
        en: written on parchments, bones and palm fronds
        ur: چمڑے، ہڈیوں اور کھجور کے پتوں پر لکھا
    - text:
        ar: ورق صيني فقط
        en: only Chinese paper
        ur: صرف چینی کاغذ
      correct: false
      why:
        ar: ليست ورقًا صينيًا
        en: not Chinese paper
        ur: چینی کاغذ نہیں
    - text:
        ar: لوحات ذهبية
        en: golden tablets
        ur: سنہری تختیاں
      correct: false
      why:
        ar: ليست ذهبًا بل جلود وعظام
        en: skins and bones, not gold
        ur: سونا نہیں، کھالیں اور ہڈیاں
    - text:
        ar: كتب مطبوعة
        en: printed books
        ur: چھپی کتابیں
      correct: false
      why:
        ar: ليست مطبوعة بل مخطوطة
        en: handwritten, not printed
        ur: چھپی نہیں، ہاتھ سے لکھی
  - q:
      ar: من جمعه أولاً؟
      en: Who first gathered it?
      ur: اسے پہلی بار کس نے جمع کیا؟
    options:
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: true
      why:
        ar: أبو بكر جمع النص بعد اليمامة
        en: Abu Bakr gathered the text after Yamama
        ur: ابو بکر نے یمامہ کے بعد متن جمع کیا
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: false
      why:
        ar: عثمان وحّده لا جمعه أولاً
        en: Uthman unified it; Abu Bakr gathered first
        ur: عثمان نے یکساں کیا، ابو بکر نے پہلے جمع کیا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي لم يجمعه أولاً
        en: Ali did not gather it first
        ur: علی نے پہلے جمع نہیں کیا
    - text:
        ar: عمر
        en: Umar
        ur: عمر
      correct: false
      why:
        ar: عمر اقترح وأبو بكر أمر
        en: Umar suggested; Abu Bakr ordered
        ur: عمر نے تجویز کیا، ابو بکر نے حکم دیا
  - q:
      ar: من وحّد المصاحف؟
      en: Who unified the codices?
      ur: مصحف کس نے یکساں کیے؟
    options:
    - text:
        ar: عثمان
        en: Uthman
        ur: عثمان
      correct: true
      why:
        ar: عثمان وحّد النص في مصحف واحد
        en: Uthman unified the text in one codex
        ur: عثمان نے متن کو ایک مصحف میں یکساں کیا
    - text:
        ar: أبو بكر
        en: Abu Bakr
        ur: ابو بکر
      correct: false
      why:
        ar: أبو بكر جمع لا وحّد
        en: Abu Bakr gathered, not unified
        ur: ابو بکر نے جمع کیا، یکساں نہیں
    - text:
        ar: معاوية
        en: Mu'awiya
        ur: معاویہ
      correct: false
      why:
        ar: معاوية بعد عثمان
        en: Mu'awiya came after Uthman
        ur: معاویہ عثمان کے بعد تھا
    - text:
        ar: علي
        en: Ali
        ur: علی
      correct: false
      why:
        ar: علي بعد عثمان
        en: Ali came after Uthman
        ur: علی عثمان کے بعد تھا
  - q:
      ar: من كتبه بإملاء؟
      en: Who wrote it at dictation?
      ur: امل پر کس نے لکھا؟
    options:
    - text:
        ar: زيد بن ثابت
        en: Zayd ibn Thabit
        ur: زید بن ثابت
      correct: true
      why:
        ar: زيد كاتب الوحي الذي دوّنه
        en: Zayd, the revelation's scribe, wrote it
        ur: زید، وحی کے منشی، نے لکھا
    - text:
        ar: ابن مسعود
        en: Ibn Mas'ud
        ur: ابن مسعود
      correct: false
      why:
        ar: ابن مسعود حافظ لا كاتب الجمع
        en: Ibn Mas'ud memorised, not the gathering scribe
        ur: ابن مسعود حافظ تھا، جمع کا منشی نہیں
    - text:
        ar: عبد الله بن عباس
        en: Ibn Abbas
        ur: ابن عباس
      correct: false
      why:
        ar: ابن عباس مفسّر لا جامع
        en: Ibn Abbas was an exegete, not the gatherer
        ur: ابن عباس مفسر تھا، جامع نہیں
    - text:
        ar: بلال
        en: Bilal
        ur: بلال
      correct: false
      why:
        ar: بلال مؤذن لا كاتب
        en: Bilal was the muezzin, not the scribe
        ur: بلال موذن تھا، منشی نہیں
  - q:
      ar: ما الذي أدى إلى جمعه؟
      en: What led to its gathering?
      ur: اس کے جمع کی کیا وجہ بنی؟
    options:
    - text:
        ar: معركة اليمامة
        en: the battle of Yamama
        ur: یمامہ کی لڑائی
      correct: true
      why:
        ar: سقوط الحفّاظ في اليمامة دفع للجمع
        en: the huffaz's fall at Yamama prompted it
        ur: یمامہ میں حفاظ کی شہادت نے جمع کروایا
    - text:
        ar: فتح مكة
        en: the conquest of Mecca
        ur: فتح مکہ
      correct: false
      why:
        ar: فتح مكة قبل الجمع بعقدين
        en: Mecca's conquest was two decades before
        ur: فتح مکہ دو دہائی پہلے تھا
    - text:
        ar: وفاة النبي فقط
        en: the Prophet's death only
        ur: صرف نبی کی وفات
      correct: false
      why:
        ar: الوفاة دفعت لكن اليمامة السبب المباشر
        en: the death prompted but Yamama was the trigger
        ur: وفات سبب تھی مگر یمامہ براہ راست وجہ
    - text:
        ar: فارس
        en: Persia
        ur: فارس
      correct: false
      why:
        ar: ليست فارس بل اليمامة
        en: Yamama, not Persia
        ur: فارس نہیں، یمامہ
  - q:
      ar: كم يحفظه اليوم؟
      en: How many memorise it today?
      ur: آج کتنے اسے یاد رکھتے ہیں؟
    options:
    - text:
        ar: ملايين
        en: millions
        ur: لاکھوں
      correct: true
      why:
        ar: ملايين يحفظونه عن ظهر قلب
        en: millions know it by heart
        ur: لاکھوں اسے زبانی یاد رکھتے ہیں
    - text:
        ar: ألف
        en: a thousand
        ur: ہزار
      correct: false
      why:
        ar: ألف أقل بكثير من الواقع
        en: a thousand is far below reality
        ur: ہزار بہت کم ہے
    - text:
        ar: مئة
        en: a hundred
        ur: سو
      correct: false
      why:
        ar: مئة أقل بكثير
        en: a hundred is far fewer
        ur: سو بہت کم ہے
    - text:
        ar: عشرة
        en: ten
        ur: دس
      correct: false
      why:
        ar: عشرة أقل بكثير
        en: ten is far fewer
        ur: دس بہت کم ہیں
  - q:
      ar: ما الظاهرة الفريدة فيه؟
      en: Its unique textual phenomenon?
      ur: اس کا نایاب متنی مظہر؟
    options:
    - text:
        ar: حفظه ملايين شفهًا
        en: millions memorising it orally
        ur: لاکھوں کا زبانی یاد رکھنا
      correct: true
      why:
        ar: كتاب يحفظه الملايين بلا اختلاف نص
        en: a book millions keep unchanged by heart
        ur: وہ کتاب جو لاکھوں بغیر فرق یاد رکھتے ہیں
    - text:
        ar: أطول كتاب
        en: the longest book
        ur: سب سے لمبی کتاب
      correct: false
      why:
        ar: ليست أطول بل محفوظ
        en: kept by heart, not longest
        ur: لمبی نہیں، یاد شدہ
    - text:
        ar: أقدم مخطوط
        en: the oldest codex
        ur: قدیم ترین مخطوط
      correct: false
      why:
        ar: ليست أقدم بل محفوظ جماهيريًا
        en: mass-memorised, not oldest
        ur: قدیم ترین نہیں، عمومی حفظ
    - text:
        ar: أكثر لغات
        en: the most languages
        ur: زیادہ زبانیں
      correct: false
      why:
        ar: ليست لغات بل حفظ
        en: memorisation, not languages
        ur: زبانیں نہیں، حفظ
  - q:
      ar: لماذا يُعدّ نصًّا متميزًا؟
      en: Why is it a distinct text?
      ur: یہ ممتاز متن کیوں ہے؟
    options:
    - text:
        ar: لوحدة نصه عبر القرون
        en: its text's unity across centuries
        ur: صدیوں بھر متن کی یکسانی
      correct: true
      why:
        ar: بقي نصًا واحدًا بلا اختلاف
        en: it stayed one text without variance
        ur: یہ ایک متن بغیر فرق رہا
    - text:
        ar: لأقدمه فقط
        en: for its age only
        ur: صرف قدمت کے لیے
      correct: false
      why:
        ar: ليست قدمًا بل وحدة
        en: unity, not just age
        ur: قدمت نہیں، یکسانی
    - text:
        ar: لأطوله
        en: for its length
        ur: لمبائی کے لیے
      correct: false
      why:
        ar: ليست طولًا بل حفظًا
        en: memorisation, not length
        ur: لمبائی نہیں، حفظ
    - text:
        ar: لأول كتاب عربي
        en: for being first Arabic book
        ur: پہلی عربی کتاب ہونے کے لیے
      correct: false
      why:
        ar: ليست أولًا بل موحّد
        en: unified, not first
        ur: پہلی نہیں، یکساں
- id: ottomans-gunpowder-empires
  anchor: exhibit/pathway-g12-chy4u-ottomans-gunpowder-empires
  band: researchers
  title:
    ar: العثمانيون وإمبراطوريات البارود
    en: The Ottomans and the Gunpowder Empires
    ur: عثمانی اور بارودی سلطنتیں
  sixty:
    ar: 'العثمانيون والدول المدفعية: من إمارة عثمان الصغيرة في الأناضول إلى إمبراطورية ثلاث قارات. في ١٤٥٣ فتح محمد القسطنطينية بمدافع أوربان العظيمة فصارت إسطنبول، وفي عهد سليمان القانوني بلغت الدولة أوجها: بغداد والقاهرة وبلغراد وبودابست تحت راية واحدة. وهي دولة بارود: المسكيت والمدفع يحملها الإنكشارية في حرب صفويّة ومجريّة، لكنّها أيضًا دولة علم وعمران — سنان بناها، ومدارسها درّست الفقه والطب. وفي الهند قامت الدولة المغولية الشقيقة بنفس المعادلة: بارود وعمارة وإسلام. وفيها درس العصر الحديث: من يملك التقنية وينظّم الدولة يحكم — أو من يكتفي بالتقنية يزول.  وبقي إرثها في اليوم: خريطة البلقان والشرق الأوسط بأقاليمها هي خريطة الدولة العثمانية، وإسطنبول تبقى قلبها النابض إلى اليوم.  وهي أيضًا قصة التوازن: دولة عسكرية بقيت خمسة قرون لأنها جمعت البارود والقانون والمدرسة والجامع.'
    en: 'The Ottomans and the gunpowder empires: from Osman''s small Anatolian beylik to a three-continent empire. In 1453 Mehmed took Constantinople with Urban''s great cannons and it became Istanbul; under Süleyman the Lawgiver the state peaked: Baghdad, Cairo, Belgrade and Budapest under one banner. It is a gunpowder state — the musket and cannon carried by the Janissaries in Safavid and Hungarian wars — but also a state of knowledge and building: Sinan built it, its schools taught law and medicine. In India the sister Mughal state ran the same equation: gunpowder, architecture and Islam. It holds the modern age''s lesson: whoever owns the technology and organises the state rules — or whoever relies only on technology fades.  Its legacy stays today: the Balkan and Middle Eastern map in its provinces is the Ottoman map, and Istanbul stays its beating heart until now.'
    ur: 'عثمانی اور بارودی سلطنتیں: عثمان کی چھوٹی اناطولیائی امارت سے تین براعظموں کی سلطنت تک۔ 1453ء میں محمد نے اربان کی عظیم توپوں سے قسطنطنیہ فتح کیا اور وہ استنبول بنی؛ سلیمان قانونی کے عہد میں ریاست عروج پر پہنچی: بغداد، قاہرہ، بلغراد اور بوداپست ایک جھنڈے تلے۔ یہ بارود کی ریاست ہے — ینچریوں کے ہاتھ میں بندوق اور توپ صفوی اور مجری جنگوں میں — مگر علم اور تعمیر کی ریاست بھی: سنان نے اسے بنایا، اس کے مدارس نے فقہ اور طب پڑھایا۔ ہندوستان میں بہن مغل ریاست نے وہی معادلہ چلایا: بارود، عمارت اور اسلام۔ اس میں جدید دور کا سبق ہے: جو ٹیکنالوجی رکھے اور ریاست منظم کرے وہی حکمرانی کرتا ہے — یا جو صرف ٹیکنالوجی پر بھروسہ کرے وہ مٹتا ہے۔  اس کی میراث آج بھی باقی ہے: بلقان اور مشرق وسطی کا نقشہ اپنے صوبوں میں عثمانی نقشہ ہے، اور استنبول اس کا دھڑکتا دل اب تک ہے۔'
  glossary:
  - term:
      ar: عثمان
      en: Osman
      ur: عثمان
    gloss:
      ar: 'المؤسّس الذي بدأ الإمارة'
      en: 'the founder who began the beylik'
      ur: 'وہ بانی جس نے امارت شروع کی'
  - term:
      ar: القسطنطينية
      en: Constantinople
      ur: قسطنطنیہ
    gloss:
      ar: 'المدينة التي سقطت سنة ١٤٥٣'
      en: 'the city that fell in 1453'
      ur: 'وہ شہر جو 1453ء میں گرا'
  - term:
      ar: فتح ١٤٥٣
      en: the 1453 conquest
      ur: 1453 کی فتح
    gloss:
