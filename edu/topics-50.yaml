  practice:
  - q:
      ar: ما كتاب ابن سينا الأشهر؟
      en: What is Ibn Sina''s most famous book?
      ur: ابن سینا کی سب سے مشہور کتاب کیا ہے؟
    options:
    - text:
        ar: القانون في الطب
        en: the Canon of Medicine
        ur: طب کا قانون
      correct: true
      why:
        ar: بقي مرجع الطب ستة قرون في المصادر
        en: it stayed medicine''s reference six centuries in the sources
        ur: یہ ماخذ میں چھ صدیوں طب کا مرجع رہی
    - text:
        ar: الجبر والمقابلة
        en: al-Jabr wa-l-Muqabala
        ur: الجبر والمقابلہ
      correct: false
      why:
        ar: الجبر كتاب الخوارزمي لا ابن سينا
        en: al-Jabr is al-Khwarizmi''s, not his
        ur: الجبر خوارزمی کی کتاب ہے، اس کی نہیں
    - text:
        ar: المقدمة
        en: the Muqaddima
        ur: مقدمہ
      correct: false
      why:
        ar: المقدمة لابن خلدون
        en: the Muqaddima is Ibn Khaldun''s
        ur: مقدمہ ابن خلدون کی ہے
    - text:
        ar: رسالة إخوان الصفا
        en: the Epistles of the Brethren
        ur: اخوان الصفا کے رسائل
      correct: false
      why:
        ar: رسالة جماعية لا كتاب ابن سينا
        en: a collective epistle, not Ibn Sina''s book
        ur: اجتماعی رسائل ہیں، ابن سینا کی کتاب نہیں
  - q:
      ar: كم بقي القانون مرجعًا؟
      en: How long did the Canon stay a reference?
      ur: قانون کتنی دیر مرجع رہی؟
    options:
    - text:
        ar: نحو ستة قرون
        en: about six centuries
        ur: تقریباً چھ صدیاں
      correct: true
      why:
        ar: دُرّس في الجامعات حتى القرن السابع عشر
        en: it was taught in universities into the seventeenth century
        ur: یہ سترہویں صدی تک جامعوں میں پڑھائی گئی
    - text:
        ar: خمسون عامًا
        en: fifty years
        ur: پچاس سال
      correct: false
      why:
        ar: خمسون أقلّ بكثير من مدة تدريسه
        en: fifty is far short of its teaching span
        ur: پچاس اس کے پڑھائے جانے کے عرصے سے کہیں کم ہے
    - text:
        ar: عام واحد
        en: one year
        ur: ایک سال
      correct: false
      why:
        ar: بقي مرجعًا قرونًا لا عامًا
        en: it stayed a reference for centuries, not a year
        ur: یہ صدیوں مرجع رہی، ایک سال نہیں
    - text:
        ar: لم يُدرّس أبدًا
        en: it was never taught
        ur: یہ کبھی نہیں پڑھائی گئی
      correct: false
      why:
        ar: دُرّس في أوروبا والإسلام قرونًا
        en: it was taught in Europe and Islam for centuries
        ur: یہ یورپ اور اسلام میں صدیوں پڑھائی گئی
  - q:
      ar: ما اسم ابن سينا عند الأوروبيين؟
      en: What is Ibn Sina''s European name?
      ur: یورپیوں میں ابن سینا کا نام کیا ہے؟
    options:
    - text:
        ar: Avicenna
        en: Avicenna
        ur: ایویسینا
      correct: true
      why:
        ar: يذكر الاسم اللاتيني في المصادر
        en: the sources give the Latin name
        ur: ماخذ لاطینی نام دیتے ہیں
    - text:
        ar: Averroes
        en: Averroes
        ur: ایوروس
      correct: false
      why:
        ar: Averroes لابن رشد لا ابن سينا
        en: Averroes is Ibn Rushd, not Ibn Sina
        ur: ایوروس ابن رشد کا ہے، ابن سینا کا نہیں
    - text:
        ar: Alhazen
        en: Alhazen
        ur: الحازن
      correct: false
      why:
        ar: Alhazen لابن الهيثم
        en: Alhazen is Ibn al-Haytham
        ur: الحازن ابن ہیشم کا ہے
    - text:
        ar: Algazel
        en: Algazel
        ur: الغزال
      correct: false
      why:
        ar: Algazel للغزالي
        en: Algazel is al-Ghazali
        ur: الغزال الغزالی کا ہے
  - q:
      ar: أين وُلد تقريبًا؟
      en: Where was he roughly born?
      ur: وہ تقریباً کہاں پیدا ہوا؟
    options:
    - text:
        ar: قرب بخارى
        en: near Bukhara
        ur: بخارا کے قریب
      correct: true
      why:
        ar: يذكر المصادر نشأته في إقليم بخارى
        en: the sources place his upbringing in Bukhara''s region
        ur: ماخذ اس کی پرورش بخارا کے خطے میں رکھتے ہیں
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: كان من بخارى لا بغداد
        en: he was from Bukhara, not Baghdad
        ur: وہ بخارا سے تھا، بغداد نہیں
    - text:
        ar: في قرطبة
        en: in Cordoba
        ur: قرطہ میں
      correct: false
      why:
        ar: كان من آسيا الوسطى لا الأندلس
        en: he was from Central Asia, not al-Andalus
        ur: وہ وسطیٰ ایشیا سے تھا، اندلس نہیں
    - text:
        ar: في القاهرة
        en: in Cairo
        ur: قاہرہ میں
      correct: false
      why:
        ar: لم يعش في مصر
        en: he did not live in Egypt
        ur: وہ مصر میں نہیں رہا
  - q:
      ar: ماذا فعل وهو مراهق؟
      en: What did he do as a teenager?
      ur: نوجوان ہو کر اس نے کیا کیا؟
    options:
    - text:
        ar: عالج الملوك ونال مكانة
        en: he treated kings and won standing
        ur: اس نے بادشاہوں کا علاج کیا اور مقام پایا
      correct: true
      why:
        ar: يذكر المصادر تطببه لسامانيين في صغره
        en: the sources have him treat Samanids young
        ur: ماخذ میں اس نے کم عمری میں سامانیوں کا علاج کیا
    - text:
        ar: قاد جيشًا
        en: he led an army
        ur: اس نے فوج کی قیادت کی
      correct: false
      why:
        ar: كان طبيبًا لا قائدًا
        en: he was a physician, not a commander
        ur: وہ طبیب تھا، سردار نہیں
    - text:
        ar: بنى جامعة
        en: he built a university
        ur: اس نے جامعہ بنایا
      correct: false
      why:
        ar: علّم في البلاطات لا في جامعة بناها
        en: he taught in courts, not a university he built
        ur: وہ درباروں میں پڑھایا، بنائے ہوئے جامعے میں نہیں
    - text:
        ar: لم يفعل شيئًا
        en: he did nothing
        ur: اس نے کچھ نہیں کیا
      correct: false
      why:
        ar: يذكر المصادر موهبته المبكرة
        en: the sources record his early gift
        ur: ماخذ اس کی ابتدائی صلاحیت لکھتے ہیں
  - q:
      ar: ما موسوعته الكبرى؟
      en: What is his great encyclopedia?
      ur: اس کی بڑی دائرۃ المعارف کیا ہے؟
    options:
    - text:
        ar: الشفاء
        en: the Healing
        ur: شفا
      correct: true
      why:
        ar: تغطي من المنطق إلى الفلك
        en: it covers logic to astronomy
        ur: یہ منطق سے فلکیات تک ہے
    - text:
        ar: القانون
        en: the Canon
        ur: قانون
      correct: false
      why:
        ar: القانون في الطب خاصة لا موسوعة
        en: the Canon is medicine only, not encyclopedic
        ur: قانون صرف طب میں ہے، دائرۃ المعارف نہیں
    - text:
        ar: صحيح البخاري
        en: Sahih al-Bukhari
        ur: صحیح بخاری
      correct: false
      why:
        ar: البخاري كتاب حديث لا فلسفة
        en: al-Bukhari is a hadith book, not philosophy
        ur: بخاری حدیث کی کتاب ہے، فلسفہ نہیں
    - text:
        ar: تفسير الطبري
        en: al-Tabari''s exegesis
        ur: طبری کی تفسیر
      correct: false
      why:
        ar: الطبري مؤرخ لا ابن سينا
        en: al-Tabari is a historian, not Ibn Sina
        ur: طبری مؤرخ ہے، ابن سینا نہیں
  - q:
      ar: ماذا جمع في فلسفته؟
      en: What did he join in his philosophy?
      ur: اس نے اپنے فلسفے میں کیا ملا؟
    options:
    - text:
        ar: الفلسفة اليونانية بالفكر الإسلامي
        en: Greek philosophy with Islamic thought
        ur: یونانی فلسفہ کو اسلامی فکر سے
      correct: true
      why:
        ar: تذكر المصادر نظامه الخاص بين التقليدين
        en: the sources name his own system between the two traditions
        ur: ماخذ دونوں روایات کے درمیان اس کا اپنا نظام لکھتے ہیں
    - text:
        ar: الصينية والهندية
        en: Chinese and Indian
        ur: چینی اور ہندوستانی
      correct: false
      why:
        ar: جمع اليوناني والإسلامي لا الصيني
        en: he joined Greek and Islamic, not Chinese
        ur: اس نے یونانی اور اسلامی ملایا، چینی نہیں
    - text:
        ar: لا شيء؛ رفض الفلسفة
        en: nothing; he rejected philosophy
        ur: کچھ نہیں؛ اس نے فلسفہ رد کیا
      correct: false
      why:
        ar: كان فيلسوفًا قبل طبيبه
        en: he was a philosopher before his medicine
        ur: وہ طب سے پہلے فلسفی تھا
    - text:
        ar: الفكر الأوروبي الحديث
        en: modern European thought
        ur: جدید یورپی فکر
      correct: false
      why:
        ar: جمع اليوناني والإسلامي لا الأوروبي الحديث
        en: he joined Greek and Islamic, not modern European
        ur: اس نے یونانی اور اسلامی ملایا، جدید یورپی نہیں
  - q:
      ar: أين مات؟
      en: Where did he die?
      ur: وہ کہاں فوت ہوا؟
    options:
    - text:
        ar: في همذان
        en: in Hamadan
        ur: ہمدان میں
      correct: true
      why:
        ar: تذكر المصادر وفاته في همذان ١٠٣٧
        en: the sources record his death in Hamadan in 1037
        ur: ماخذ اس کی وفات 1037 میں ہمدان میں لکھتے ہیں
    - text:
        ar: في بخارى
        en: in Bukhara
        ur: بخارا میں
      correct: false
      why:
        ar: وُلد قربها ومات في همذان
        en: he was born near her but died in Hamadan
        ur: وہ اس کے قریب پیدا ہوا مگر ہمدان میں فوت ہوا
    - text:
        ar: في بغداد
        en: in Baghdad
        ur: بغداد میں
      correct: false
      why:
        ar: لم يمت في بغداد
        en: he did not die in Baghdad
        ur: وہ بغداد میں فوت نہیں ہوا
    - text:
        ar: في القسطنطينية
        en: in Constantinople
        ur: قسطنطنیہ میں
      correct: false
      why:
        ar: مات في إيران لا بيزنطة
        en: he died in Iran, not Byzantium
        ur: وہ ایران میں فوت ہوا، بازنطیم میں نہیں
  - q:
      ar: لماذا يهمّ ابن سينا؟
      en: Why does Ibn Sina matter?
      ur: ابن سینا کیوں اہم ہے؟
    options:
    - text:
        ar: لأن قانونه علّم الطب للعالم ستة قرون
        en: because his Canon taught medicine to the world for six centuries
        ur: کیونکہ اس کے قانون نے چھ صدیوں دنیا کو طب پڑھایا
      correct: true
      why:
        ar: دُرّس في بغداد وبولونيا وباريس
        en: it was taught in Baghdad, Bologna and Paris
        ur: یہ بغداد، بولونیا اور پیرس میں پڑھائی گئی
    - text:
        ar: لأنه اخترع الطب
        en: because he invented medicine
        ur: کیونکہ اس نے طب ایجاد کی
      correct: false
      why:
        ar: الطب قبله بقرون لكنه جمعه ونظّمه
        en: medicine predates him but he gathered and ordered it
        ur: طب اس سے صدیوں پہلے تھا مگر اس نے جمع اور مرتب کیا
    - text:
        ar: لأنه كان خليفة
        en: because he was a caliph
        ur: کیونکہ وہ خلیفہ تھا
      correct: false
      why:
        ar: كان طبيبًا لا خليفة
        en: he was a physician, not a caliph
        ur: وہ طبیب تھا، خلیفہ نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في تاريخ الطب والفلسفة
        en: his name is in medicine''s and philosophy''s history
        ur: اس کا نام طب اور فلسفہ کی تاریخ میں ہے
  - q:
      ar: من كتب عن ابن سينا؟
      en: Who wrote about Ibn Sina?
      ur: ابن سینا کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو العلم وسيرته الذاتية
        en: historians of science and his autobiography
        ur: علم کے مؤرخین اور اس کی خود سوانح
      correct: true
      why:
        ar: تصلنا سيرته وشروح تلاميذه
        en: his life story and his students'' commentaries reach us
        ur: اس کی سوانح اور شاگردوں کی شروحات ہم تک پہنچیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: كتب سيرته وكتب عنه تلاميذه
        en: he wrote his life and students wrote of him
        ur: اس نے اپنی سوانح لکھی اور شاگردوں نے لکھا
    - text:
        ar: الصينيون فقط
        en: only the Chinese
        ur: صرف چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of him
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العثمانيون فقط
        en: only the Ottomans
        ur: صرف عثمانی
      correct: false
      why:
        ar: كتب عنه قبل العثمانيين بقرون
        en: he was written of centuries before the Ottomans
        ur: اس کے بارے میں عثمانیوں سے صدیوں پہلے لکھا گیا
- id: ibn-rushd
  anchor: person/ibn-rushd
  band: researchers
  title:
    ar: ابن رشد
    en: Ibn Rushd
    ur: ابن رشد
  sixty:
    ar: 'أبو الوليد محمد بن أحمد بن رشد، فيلسوف قرطبة وقاضيها في القرن الثاني عشر: شارح أرسطو الأعظم عند الأوروبيين حتى سمّوه «المفسّر». كتب «فصل المقال» في العلاقة
      بين الدين والفلسفة، وناقش الغزالي في «تهافت التهافت» دفاعًا عن العقل. عيّنه الموحدون قاضي قرطبة وطبيبًا للخليفة، ثم نفوه في شيخوخته إلى لوسينة فعاد وافته المنية
      في مراكش ١١٩٨. ألهمت شروحه عصر النهضة الأوروبي: «Averroes» اسمه في مدارسهم أربعة قرون.'
    en: 'Abu al-Walid Muhammad ibn Ahmad ibn Rushd, Cordoba''''s philosopher and judge in the twelfth century: Aristotle''''s greatest commentator for Europeans,
      who called him simply ''''the Commentator''''. He wrote the Decisive Treatise on the relation between religion and philosophy, and answered al-Ghazali in the
      Incoherence of the Incoherence defending reason. The Almohads made him Cordoba''''s judge and the caliph''''s physician, then exiled him in old age to Lucena;
      he returned and died in Marrakesh in 1198. His commentaries inspired the European Renaissance: ''''Averroes'''' was his name in their schools for four centuries.'
    ur: 'ابو الولید محمد بن احمد ابن رشد، بارہویں صدی میں قرطہ کا فلسفی اور قاضی: یورپیوں کے نزدیک ارسطو کا عظیم ترین شارح، جسے انہوں نے صرف مفسر کہا۔ اس نے دین اور
      فلسفہ کے تعلق پر فصل المقال لکھی، اور عقل کے دفاع میں تہافت التہافت میں غزالی کا جواب دیا۔ موحدین نے اسے قرطہ کا قاضی اور خلیفہ کا طبیب بنایا، پھر پیری میں
      اسے لوسینہ جلاوطن کیا؛ وہ واپس آیا اور 1198 میں مراکش میں فوت ہوا۔ اس کی شروحات نے یورپی نشاۃ ثانیہ کو ابھارا: ایوروس ان کے مکتبوں میں چار صدیوں اس کا نام رہا۔'
  glossary:
  - term:
      ar: قرطبة
      en: Cordoba
      ur: قرطہ
    gloss:
      ar: مدينته التي قضى وعلّم فيها
      en: his city where he judged and taught
      ur: اس کا شہر جہاں اس نے قضا اور پڑھایا
  - term:
      ar: المفسّر
      en: the Commentator
      ur: مفسر
    gloss:
      ar: لقبه عند الأوروبيين لشروحه على أرسطو
      en: his European title for his Aristotle commentaries
      ur: ارسطو کی شروحات کے لیے یورپیوں میں اس کا لقب
  - term:
      ar: أرسطو
      en: Aristotle
      ur: ارسطو
    gloss:
      ar: الفيلسوف اليوناني الذي شرحه
      en: the Greek philosopher he commented on
      ur: وہ یونانی فلسفی جس کی اس نے شرح کی
  - term:
      ar: فصل المقال
      en: the Decisive Treatise
      ur: فصل المقال
    gloss:
      ar: كتابه في الدين والفلسفة
      en: his book on religion and philosophy
      ur: دین اور فلسفہ پر اس کی کتاب
  - term:
      ar: تهافت التهافت
      en: the Incoherence of the Incoherence
      ur: تہافت التہافت
    gloss:
      ar: ردّه على الغزالي
      en: his answer to al-Ghazali
      ur: غزالی کا اس کا جواب
  - term:
      ar: الغزالي
      en: al-Ghazali
      ur: غزالی
    gloss:
      ar: الفيلسوف الذي ناقشه
      en: the philosopher he debated
      ur: وہ فلسفی جس سے اس نے بحث کی
  - term:
      ar: الموحدون
      en: the Almohads
      ur: موحدین
    gloss:
      ar: السلالة التي عيّنته ونفته
      en: the dynasty that appointed and exiled him
      ur: وہ خاندان جس نے اسے مقرر اور جلاوطن کیا
  - term:
      ar: لوسينة
      en: Lucena
      ur: لوسینہ
    gloss:
      ar: المدينة التي نُفي إليها
      en: the town he was exiled to
      ur: وہ قصبہ جہاں اسے جلاوطن کیا گیا
  - term:
      ar: مراكش
      en: Marrakesh
      ur: مراکش
    gloss:
      ar: المدينة التي مات فيها
      en: the city he died in
      ur: وہ شہر جس میں وہ فوت ہوا
  - term:
      ar: Averroes
      en: Averroes
      ur: ایوروس
    gloss:
      ar: اسمه اللاتيني في مدارس أوروبا
      en: his Latin name in Europe''s schools
      ur: یورپ کے مکتبوں میں اس کا لاطینی نام
  - term:
      ar: ١١٩٨
      en: '1198'
      ur: '1198'
    gloss:
      ar: عام وفاته
      en: the year of his death
      ur: اس کی وفات کا سال
  - term:
      ar: القاضي
      en: the judge
      ur: قاضی
    gloss:
      ar: منصبه في قرطبة تحت الموحدين
      en: his office in Cordoba under the Almohads
      ur: موحدین کے دور میں قرطہ میں اس کا منصب
  practice:
  - q:
      ar: ما لقب ابن رشد عند الأوروبيين؟
      en: What was Ibn Rushd''s European title?
      ur: یورپیوں میں ابن رشد کا لقب کیا تھا؟
    options:
    - text:
        ar: المفسّر
        en: the Commentator
        ur: مفسر
      correct: true
      why:
        ar: سمّوه المفسّر لشروحه على أرسطو
        en: they called him the Commentator for his Aristotle commentaries
        ur: انہوں نے ارسطو کی شروحات کے لیے اسے مفسر کہا
    - text:
        ar: شيخ الرئيس
        en: Shaykh al-Ra''is
        ur: شیخ الرئیس
      correct: false
      why:
        ar: شيخ الرئيس لابن سينا لا ابن رشد
        en: Shaykh al-Ra''is is Ibn Sina, not Ibn Rushd
        ur: شیخ الرئیس ابن سینا کا ہے، ابن رشد کا نہیں
    - text:
        ar: الغزالي
        en: al-Ghazali
        ur: غزالی
      correct: false
      why:
        ar: الغزالي خصمه لا لقبه
        en: al-Ghazali is his opponent, not his title
        ur: غزالی اس کا مخالف ہے، لقب نہیں
    - text:
        ar: الملك
        en: the King
        ur: بادشاہ
      correct: false
      why:
        ar: كان فيلسوفًا لا ملكًا
        en: he was a philosopher, not a king
        ur: وہ فلسفی تھا، بادشاہ نہیں
  - q:
      ar: في أيّ مدينة قضى وعلّم؟
      en: In which city did he judge and teach?
      ur: اس نے کس شہر میں قضا اور پڑھایا؟
    options:
    - text:
        ar: قرطبة
        en: Cordoba
        ur: قرطہ
      correct: true
      why:
        ar: كان قاضيها تحت الموحدين في المصادر
        en: the sources have him her judge under the Almohads
        ur: ماخذ میں وہ موحدین کے دور میں اس کا قاضی تھا
    - text:
        ar: بغداد
        en: Baghdad
        ur: بغداد
      correct: false
      why:
        ar: كان في الأندلس لا بغداد
        en: he was in al-Andalus, not Baghdad
        ur: وہ اندلس میں تھا، بغداد میں نہیں
    - text:
        ar: القاهرة
        en: Cairo
        ur: قاہرہ
      correct: false
      why:
        ar: كان في المغرب لا مصر
        en: he was in the Maghreb, not Egypt
        ur: وہ مغرب میں تھا، مصر میں نہیں
    - text:
        ar: دمشق
        en: Damascus
        ur: دمشق
      correct: false
      why:
        ar: كان في قرطبة لا دمشق
        en: he was in Cordoba, not Damascus
        ur: وہ قرطہ میں تھا، دمشق میں نہیں
  - q:
      ar: ما فصل المقال؟
      en: What is the Decisive Treatise?
      ur: فصل المقال کیا ہے؟
    options:
    - text:
        ar: كتابه في العلاقة بين الدين والفلسفة
        en: his book on religion and philosophy''s relation
        ur: دین اور فلسفہ کے تعلق پر اس کی کتاب
      correct: true
      why:
        ar: تذكر المصادر عنوانه وموضوعه
        en: the sources name its title and subject
        ur: ماخذ اس کا نام اور موضوع لکھتے ہیں
    - text:
        ar: كتاب طب
        en: a medicine book
        ur: طب کی کتاب
      correct: false
      why:
        ar: كان في الدين والفلسفة لا الطب
        en: it was on religion and philosophy, not medicine
        ur: یہ دین اور فلسفہ پر تھی، طب پر نہیں
    - text:
        ar: كتاب شعر
        en: a poetry book
        ur: شاعری کی کتاب
      correct: false
      why:
        ar: كان فلسفة لا شعرًا
        en: it was philosophy, not poetry
        ur: یہ فلسفہ تھا، شاعری نہیں
    - text:
        ar: رسالة سرية
        en: a secret letter
        ur: خفیہ خط
      correct: false
      why:
        ar: كتاب منشور لا سر
        en: a published book, not secret
        ur: شائع شدہ کتاب ہے، خفیہ نہیں
  - q:
      ar: من ناقش ابن رشد؟
      en: Whom did Ibn Rushd answer?
      ur: ابن رشد نے کس کا جواب دیا؟
    options:
    - text:
        ar: الغزالي في تهافت التهافت
        en: al-Ghazali in the Incoherence of the Incoherence
        ur: غزالی کو تہافت التہافت میں
      correct: true
      why:
        ar: تذكر المصادر ردّه على تهافت الفلاسفة
        en: the sources name his answer to the Incoherence of the Philosophers
        ur: ماخذ تہافت الفلاسفہ کے جواب کا ذکر کرتے ہیں
    - text:
        ar: أرسطو
        en: Aristotle
        ur: ارسطو
      correct: false
      why:
        ar: شرح أرسطو لا ناقشه
        en: he commented on Aristotle, not debated him
        ur: اس نے ارسطو کی شرح کی، بحث نہیں
    - text:
        ar: ابن سينا
        en: Ibn Sina
        ur: ابن سینا
      correct: false
      why:
        ar: ناقش الغزالي لا ابن سينا مباشرة
        en: he answered al-Ghazali, not Ibn Sina directly
        ur: اس نے غزالی کا جواب دیا، ابن سینا کا براہ راست نہیں
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: ناقش الغزالي في كتابه
        en: he debated al-Ghazali in his book
        ur: اس نے اپنی کتاب میں غزالی سے بحث کی
  - q:
      ar: ماذا فعل الموحدون به في شيخوخته؟
      en: What did the Almohads do to him in old age?
      ur: پیری میں موحدین نے اس کے ساتھ کیا کیا؟
    options:
    - text:
        ar: نفوه إلى لوسينة ثم عاد
        en: they exiled him to Lucena then he returned
        ur: انہوں نے اسے لوسینہ جلاوطن کیا پھر وہ واپس آیا
      correct: true
      why:
        ar: تذكر المصادر نفيه وعودته
        en: the sources record his exile and return
        ur: ماخذ اس کی جلاوطنی اور واپسی لکھتے ہیں
    - text:
        ar: قتلوه
        en: they killed him
        ur: انہوں نے اسے مار ڈالا
      correct: false
      why:
        ar: مات في مراكش لا قُتل
        en: he died in Marrakesh, not killed
        ur: وہ مراکش میں فوت ہوا، مارا نہیں گیا
    - text:
        ar: نصّبوه خليفة
        en: they made him caliph
        ur: انہوں نے اسے خلیفہ بنایا
      correct: false
      why:
        ar: كان فيلسوفًا لا خليفة
        en: he was a philosopher, not a caliph
        ur: وہ فلسفی تھا، خلیفہ نہیں
    - text:
        ar: لم يفعلوا شيئًا
        en: they did nothing
        ur: انہوں نے کچھ نہیں کیا
      correct: false
      why:
        ar: تذكر المصادر نفيه في شيخوخته
        en: the sources record his old-age exile
        ur: ماخذ اس کی پیری میں جلاوطنی لکھتے ہیں
  - q:
      ar: متى مات ابن رشد؟
      en: When did Ibn Rushd die?
      ur: ابن رشد کب فوت ہوا؟
    options:
    - text:
        ar: عام ١١٩٨ في مراكش
        en: in 1198 in Marrakesh
        ur: 1198 میں مراکش میں
      correct: true
      why:
        ar: تذكر المصادر مكان وفاته وعامها
        en: the sources give his death''s place and year
        ur: ماخذ اس کی وفات کی جگہ اور سال دیتے ہیں
    - text:
        ar: عام ١٠٣٧
        en: in 1037
        ur: 1037 میں
      correct: false
      why:
        ar: ذلك عام وفاة ابن سينا
        en: that is Ibn Sina''s death year
        ur: یہ ابن سینا کی وفات کا سال ہے
    - text:
        ar: عام ٨٥٠
        en: in 850
        ur: 850 میں
      correct: false
      why:
        ar: ذلك قبل ميلاده بقرون
        en: that is centuries before his birth
        ur: یہ اس کی پیدائش سے صدیوں پہلے ہے
    - text:
        ar: لم يمت
        en: he never died
        ur: وہ کبھی فوت نہیں ہوا
      correct: false
      why:
        ar: مات في المصادر كسائر الناس
        en: he died in the sources like all people
        ur: وہ ماخذ میں سب کی طرح فوت ہوا
  - q:
      ar: ما أثر شروحه؟
      en: What was his commentaries'' impact?
      ur: اس کی شروحات کا کیا اثر تھا؟
    options:
    - text:
        ar: ألهمت عصر النهضة الأوروبي
        en: they inspired the European Renaissance
        ur: انہوں نے یورپی نشاۃ ثانیہ کو ابھارا
      correct: true
      why:
        ar: دُرّست شروحه في مدارسهم قرونًا
        en: his commentaries were taught in their schools for centuries
        ur: اس کی شروحات ان کے مکتبوں میں صدیوں پڑھائی گئیں
    - text:
        ar: ألغت الفلسفة
        en: they abolished philosophy
        ur: انہوں نے فلسفہ ختم کیا
      correct: false
      why:
        ar: أحيت الفلسفة لا ألغتها
        en: they revived philosophy, not abolished
        ur: انہوں نے فلسفہ زندہ کیا، ختم نہیں
    - text:
        ar: لم يقرأها أحد
        en: nobody read them
        ur: کسی نے انہیں نہیں پڑھا
      correct: false
      why:
        ar: قرأتها أوروبا قرونًا
        en: Europe read them for centuries
        ur: یورپ نے انہیں صدیوں پڑھا
    - text:
        ar: بقيت مجهولة
        en: they stayed unknown
        ur: وہ نامعلوم رہیں
      correct: false
      why:
        ar: عرفت في أوروبا قبل بلاده
        en: they were known in Europe before his land
        ur: یہ اس کے ملک سے پہلے یورپ میں معروف ہوئیں
  - q:
      ar: ما منصبه تحت الموحدين؟
      en: What was his office under the Almohads?
      ur: موحدین کے دور میں اس کا منصب کیا تھا؟
    options:
    - text:
        ar: قاضي قرطبة وطبيب الخليفة
        en: Cordoba''s judge and the caliph''s physician
        ur: قرطہ کا قاضی اور خلیفہ کا طبیب
      correct: true
      why:
        ar: تذكر المصادر منصبيه معًا
        en: the sources name both offices together
        ur: ماخذ دونوں منصبوں کا ذکر ایک ساتھ کرتے ہیں
    - text:
        ar: قائد الجيش
        en: the army commander
        ur: فوج کا سردار
      correct: false
      why:
        ar: كان قاضيًا لا قائدًا
        en: he was a judge, not a commander
        ur: وہ قاضی تھا، سردار نہیں
    - text:
        ar: الخليفة نفسه
        en: the caliph himself
        ur: خود خلیفہ
      correct: false
      why:
        ar: خدم الخليفة لا كان هو
        en: he served the caliph, not was him
        ur: اس نے خلیفہ کی خدمت کی، خود نہیں تھا
    - text:
        ar: لا منصب
        en: no office
        ur: کوئی منصب نہیں
      correct: false
      why:
        ar: كان قاضيًا وطبيبًا في المصادر
        en: he was judge and physician in the sources
        ur: وہ ماخذ میں قاضی اور طبیب تھا
  - q:
      ar: لماذا يهمّ ابن رشد؟
      en: Why does Ibn Rushd matter?
      ur: ابن رشد کیوں اہم ہے؟
    options:
    - text:
        ar: لأنه وصل الفلسفة اليونانية بأوروبا والإسلام
        en: because he linked Greek philosophy to Europe and Islam
        ur: کیونکہ اس نے یونانی فلسفہ کو یورپ اور اسلام سے جوڑا
      correct: true
      why:
        ar: جسّرت شروحه عقلًا بين الحضارتين
        en: his commentaries bridged reason between the civilizations
        ur: اس کی شروحات نے تہذیبوں کے درمیان عقل کا پل بنایا
    - text:
        ar: لأنه اخترع الفلسفة
        en: because he invented philosophy
        ur: کیونکہ اس نے فلسفہ ایجاد کی
      correct: false
      why:
        ar: شرح فلسفة قديمة لا اخترعها
        en: he commented on old philosophy, not invented
        ur: اس نے پرانے فلسفہ کی شرح کی، ایجاد نہیں
    - text:
        ar: لأنه كان ملكًا
        en: because he was a king
        ur: کیونکہ وہ بادشاہ تھا
      correct: false
      why:
        ar: كان فيلسوفًا وقاضيًا لا ملكًا
        en: he was a philosopher and judge, not a king
        ur: وہ فلسفی اور قاضی تھا، بادشاہ نہیں
    - text:
        ar: لا أهمية
        en: no importance
        ur: کوئی اہمیت نہیں
      correct: false
      why:
        ar: اسمه في تاريخ الفلسفة والنهضة
        en: his name is in philosophy''s and the Renaissance''s history
        ur: اس کا نام فلسفہ اور نشاۃ ثانیہ کی تاریخ میں ہے
  - q:
      ar: من كتب عن ابن رشد؟
      en: Who wrote about Ibn Rushd?
      ur: ابن رشد کے بارے میں کس نے لکھا؟
    options:
    - text:
        ar: مؤرخو الفلسفة والأوروبيون الذين ترجموه
        en: philosophy historians and the Europeans who translated him
        ur: فلسفہ کے مؤرخین اور وہ یورپی جنہوں نے اس کا ترجمہ کیا
      correct: true
      why:
        ar: تصلنا شروحه وروايات مؤرخي عصره
        en: his commentaries and his age''s historians reach us
        ur: اس کی شروحات اور اس کے دور کے مؤرخین ہم تک پہنچے
    - text:
        ar: لا أحد
        en: nobody
        ur: کوئی نہیں
      correct: false
      why:
        ar: ترجمته أوروبا وكتب عنه مؤرخوه
        en: Europe translated him and historians wrote of him
        ur: یورپ نے اس کا ترجمہ کیا اور مؤرخین نے لکھا
    - text:
        ar: الصينيون
        en: the Chinese
        ur: چینی
      correct: false
      why:
        ar: كتب عنه المسلمون والأوروبيون
        en: Muslims and Europeans wrote of him
        ur: مسلمانوں اور یورپیوں نے اس کے بارے میں لکھا
    - text:
        ar: العباسيون فقط
        en: only the Abbasids
        ur: صرف عباسی
      correct: false
      why:
        ar: كتب عنه الموحدون والأوروبيون
        en: Almohads and Europeans wrote of him
        ur: موحدین اور یورپیوں نے اس کے بارے میں لکھا
- id: al-ghazali
  anchor: person/al-ghazali-abu-hamid
  band: scholars
  title:
    ar: الغزالي
    en: al-Ghazali
    ur: غزالی
  sixty:
    ar: 'أبو حامد محمد الغزالي الطوسي، حجة الإسلام: فقيه شافعي ومتصوف وفيلسوف من القرن الحادي عشر، ناقش الفلاسفة في «تهافت الفلاسفة» وجدد العلوم الدينية في «إحياء
      علوم الدين». عيّنه نظام الملك أستاذًا في النظامية ببغداد، ثم ترك المنصب في أزمة روحية وخرج إلى العزلة والتصوف عشر سنين. عاد إلى التدريس في نيسابور ثم طوس، جامعًا
      بين الشريعة والتصوف في مدرسة واحدة. مات ١١١١ في طوس، وبقي «Algazel» عند الأوروبيين ومُصلح الإسلام عند المسلمين.'
    en: 'Abu Hamid Muhammad al-Ghazali al-Tusi, the Proof of Islam: an eleventh-century Shafi''''i jurist, Sufi and philosopher who answered the philosophers in the
      Incoherence of the Philosophers and renewed the religious sciences in the Revival of the Religious Sciences. Nizam al-Mulk made him professor at the Nizamiyya
      in Baghdad, then he left the chair in a spiritual crisis for ten years of seclusion and Sufism. He returned to teach in Nishapur then Tus, joining law and Sufism
      in one school. He died in Tus in 1111; to Europeans he stayed ''''Algazel'''' and to Muslims Islam''''s renewer.'
    ur: 'ابو حامد محمد غزالی طوسی، حجۃ الاسلام: گیارہویں صدی کا شافعی فقیہ، صوفی اور فلسفی جس نے تہافت الفلاسفہ میں فلسفیوں کا جواب دیا اور احیاء علوم الدین میں دینی
      علوم کی تجدید کی۔ نظام الملک نے اسے بغداد میں نظامیہ کا استاد بنایا، پھر اس نے روحانی بحران میں کرسی چھوڑ کر دس سال خلوت اور تصوف میں گزارے۔ وہ نیشاپور پھر
      طوس میں پڑھانے واپس آیا، شریعت اور تصوف کو ایک مکتب میں جمع کرتے ہوئے۔ وہ 1111 میں طوس میں فوت ہوا؛ یورپیوں کے ہاں الغزال اور مسلمانوں کے ہاں اسلام کا مجدد
      رہا۔'
  glossary:
  - term:
      ar: حجة الإسلام
      en: the Proof of Islam
      ur: حجۃ الاسلام
    gloss:
      ar: لقبه عند المسلمين
      en: his title among Muslims
      ur: مسلمانوں میں اس کا لقب
  - term:
      ar: طوس
      en: Tus
      ur: طوس
    gloss:
      ar: مدينته الأصلية ومكان وفاته
      en: his original city and death place
      ur: اس کا اصل شہر اور وفات کی جگہ
  - term:
      ar: الشافعي
      en: the Shafi''i
      ur: شافعی
    gloss:
      ar: مذهبه الفقهي
      en: his legal school
      ur: اس کا فقہی مذہب
  - term:
      ar: التصوف
      en: Sufism
      ur: تصوف
    gloss:
      ar: الطريق الروحي الذي سلكه
      en: the spiritual path he took
      ur: وہ روحانی راستہ جسے اس نے اختیار کیا
  - term:
      ar: تهافت الفلاسفة
      en: the Incoherence of the Philosophers
      ur: تہافت الفلاسفہ
    gloss:
      ar: كتابه الذي ناقش الفلاسفة
      en: his book answering the philosophers
      ur: فلسفیوں کا جواب دینے والی اس کی کتاب
  - term:
      ar: إحياء علوم الدين
      en: the Revival of the Religious Sciences
      ur: احیاء علوم الدین
    gloss:
      ar: موسوعته التي جدد العلوم الدينية
      en: his encyclopedia renewing the religious sciences
      ur: دینی علوم کی تجدید کرنے والی اس کی دائرۃ المعارف
  - term:
      ar: نظام الملك
      en: Nizam al-Mulk
      ur: نظام الملک
    gloss:
      ar: الوزير الذي عيّنه أستاذًا
      en: the vizier who made him professor
      ur: وہ وزیر جس نے اسے استاد بنایا
  - term:
      ar: النظامية
      en: the Nizamiyya
      ur: نظامیہ
    gloss:
      ar: مدرسة بغداد التي علّم فيها
      en: the Baghdad school he taught in
      ur: بغداد کا وہ مدرسہ جس میں اس نے پڑھایا
  - term:
      ar: نيسابور
      en: Nishapur
      ur: نیشاپور
    gloss:
      ar: المدينة التي عاد إلى التدريس فيها
      en: the city he returned to teach in
      ur: وہ شہر جس میں وہ پڑھانے واپس آیا
  - term:
