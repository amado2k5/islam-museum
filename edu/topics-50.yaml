      en: the Mamluks
      ur: ممالیک
    gloss:
      ar: 'الدولة التي ردّتهم'
      en: 'the state that repelled them'
      ur: 'وہ ریاست جس نے انہیں پسپا کیا'
  - term:
      ar: الإيلخانيون
      en: the Ilkhanids
      ur: ایلخان
    gloss:
      ar: 'دولتهم الإسلامية الأولى'
      en: 'their first Islamic state'
      ur: 'ان کی پہلی مسلم ریاست'
  - term:
