      en: Algazel
      ur: الغزال
    gloss:
      ar: اسمه اللاتيني عند الأوروبيين
      en: his Latin name among Europeans
      ur: یورپیوں میں اس کا لاطینی نام
  - term:
      ar: ١١١١
      en: '1111'
