slug: qissat-al-samiri
title: { ar: "قصة السامري", en: "The Samiri" }
lede:
  ar: "العجل الذهبي — كيف أضل قوم موسى في غيابه."
  en: "The golden calf — how Musa's people were led astray in his absence."
source_card: aa65ae60
status: { review: draft }
intro:
  ar: "في غياب موسى للمناجاة، صنع السامري عجلًا من حلي القوم فعبدوه."
  en: "During Musa's absence, al-Samiri made a calf from the people's jewelry, which they worshipped."
stations:
  - title: { ar: "غياب موسى", en: "Musa's absence" }
    ref: "طه 83–84"
    body:
      ar: "ذهب موسى لميقات ربه وترك هارون خليفة."
      en: "Musa went to his Lord's appointment, leaving Harun in charge."
  - title: { ar: "صنع العجل", en: "Making the calf" }
    ref: "طه 87–88"
    body:
      ar: "جمع السامري الحلي وصنع عجلًا له خوار."
      en: "Al-Samiri gathered the jewelry and made a lowing calf."
  - title: { ar: "العبادة", en: "The worship" }
    ref: "طه 88"
    body:
      ar: "قالوا هذا إلهكم وإله موسى — فتنة الجهل."
      en: "'This is your god and Musa's god' — the trial of ignorance."
  - title: { ar: "رجوع موسى", en: "Musa's return" }
    ref: "طه 92–94"
    body:
      ar: "رجع غضبان أسفًا وعاتب هارون والسامري."
      en: "He returned angry and sorrowful, rebuking Harun and al-Samiri."
  - title: { ar: "العقوبة", en: "The punishment" }
    ref: "طه 97"
    body:
      ar: "قال فاذهب فإن لك في الحياة أن تقول لا مساس — النفي والعزلة."
      en: "'Go — in this life you shall say: touch me not' — exile."
facts:
  - { ar: "ذُكرت في سورة طه.", en: "Mentioned in Surah Ta-Ha." }
lessons:
  - { ar: "خطر الفتنة في غياب القيادة.", en: "The danger of trial in leadership's absence." }
  - { ar: "الجهل بالتوحيد يوقع في الشرك.", en: "Ignorance of tawhid leads to shirk." }
cautions: []
khulasa:
  ar: "من ترك التوحيد عبد العجل — الثبات على العقيدة نجاة."
  en: "Whoever abandons tawhid worships the calf — holding to creed is salvation."
