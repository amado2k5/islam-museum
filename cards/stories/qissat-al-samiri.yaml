slug: qissat-al-samiri
title: { ar: "قصة السامري", en: "The Samiri", fr: "Le Samiri" }
lede:
  ar: "العجل الذهبي — كيف أضل قوم موسى في غيابه."
  en: "The golden calf — how Musa's people were led astray in his absence."
  fr: "Le veau d’or : comment le peuple de Moïse s’égare pendant son absence."
source_card: aa65ae60
status: { review: draft }
intro:
  ar: "في غياب موسى للمناجاة، صنع السامري عجلًا من حلي القوم فعبدوه."
  en: "During Musa's absence, al-Samiri made a calf from the people's jewelry, which they worshipped."
  fr: Pendant l’absence de Moïse, parti s’entretenir avec Dieu, le Samiri fabrique avec les bijoux du peuple un veau que les gens adorent.
stations:
  - title: { ar: "غياب موسى", en: "Musa's absence", fr: "L’absence de Moïse" }
    ref: "طه 83–84"
    body:
      ar: "ذهب موسى لميقات ربه وترك هارون خليفة."
      en: "Musa went to his Lord's appointment, leaving Harun in charge."
      fr: Moïse se rend au rendez-vous fixé par son Seigneur et confie la responsabilité à Aaron.
  - title: { ar: "صنع العجل", en: "Making the calf", fr: "La fabrication du veau" }
    ref: "طه 87–88"
    body:
      ar: "جمع السامري الحلي وصنع عجلًا له خوار."
      en: "Al-Samiri gathered the jewelry and made a lowing calf."
      fr: Le Samiri rassemble les bijoux et fabrique un veau qui émet un mugissement.
  - title: { ar: "العبادة", en: "The worship", fr: "Le culte du veau" }
    ref: "طه 88"
    body:
      ar: "قالوا هذا إلهكم وإله موسى — فتنة الجهل."
      en: "'This is your god and Musa's god' — the trial of ignorance."
      fr: Le verset évoque l’attribution mensongère d’un statut divin au veau, dans une épreuve liée à l’ignorance.
  - title: { ar: "رجوع موسى", en: "Musa's return", fr: "Le retour de Moïse" }
    ref: "طه 92–94"
    body:
      ar: "رجع غضبان أسفًا وعاتب هارون والسامري."
      en: "He returned angry and sorrowful, rebuking Harun and al-Samiri."
      fr: Il revient en colère et affligé, et adresse des reproches à Aaron et au Samiri.
  - title: { ar: "العقوبة", en: "The punishment", fr: "La sanction" }
    ref: "طه 97"
    body:
      ar: "قال فاذهب فإن لك في الحياة أن تقول لا مساس — النفي والعزلة."
      en: "'Go — in this life you shall say: touch me not' — exile."
      fr: Le verset évoque l’exclusion du Samiri et son isolement hors des contacts ordinaires.
facts:
  - { ar: "ذُكرت في سورة طه.", en: "Mentioned in Surah Ta-Ha.", fr: "Le récit figure dans la sourate Ta-Ha." }
lessons:
  - { ar: "خطر الفتنة في غياب القيادة.", en: "The danger of trial in leadership's absence.", fr: "Le danger de l’égarement en l’absence des dirigeants." }
  - { ar: "الجهل بالتوحيد يوقع في الشرك.", en: "Ignorance of tawhid leads to shirk.", fr: "L’ignorance de l’unicité divine est présentée comme une voie vers l’associationnisme." }
cautions: []
khulasa:
  ar: "من ترك التوحيد عبد العجل — الثبات على العقيدة نجاة."
  en: "Whoever abandons tawhid worships the calf — holding to creed is salvation."
  fr: Le récit oppose l’abandon de l’unicité divine, illustré par le culte du veau, à la fidélité à la croyance.
