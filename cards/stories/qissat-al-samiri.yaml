slug: qissat-al-samiri
title:
  ar: قصة السامري
  en: The Samiri
  fr: Le Samiri
  tr: Samiriyeli'nin hikayesi
  id: Kisah Samaria
lede:
  ar: العجل الذهبي — كيف أضل قوم موسى في غيابه.
  en: The golden calf — how Musa's people were led astray in his absence.
  fr: 'Le veau d’or : comment le peuple de Moïse s’égare pendant son absence.'
  tr: Altın Buzağı — Musa'nın halkı O'nun yokluğunda nasıl yanıldırılmıştır.
  id: Anak Sapi Emas — Bagaimana umat Musa disesatkan selama ketidakhadirannya.
source_card: aa65ae60
status:
  review: draft
intro:
  ar: في غياب موسى للمناجاة، صنع السامري عجلًا من حلي القوم فعبدوه.
  en: During Musa's absence, al-Samiri made a calf from the people's jewelry, which they worshipped.
  fr: Pendant l’absence de Moïse, parti s’entretenir avec Dieu, le Samiri fabrique avec les bijoux du peuple un veau que les gens adorent.
  tr: Dili için Musa yokken, Samiriyeli halkın süslerinden bir buzağı yaptı ve onlar ona tapıldı.
  id: Karena Musa tidak hadir dalam permohonan itu, orang Samaria itu membuat anak sapi dari perhiasan orang-orang dan mereka menyembahnya.
stations:
- title:
    ar: غياب موسى
    en: Musa's absence
    fr: L’absence de Moïse
    tr: Moussa'nın yokluğu
    id: Ketidakhadiran Moussa
  ref: طه 83–84
  body:
    ar: ذهب موسى لميقات ربه وترك هارون خليفة.
    en: Musa went to his Lord's appointment, leaving Harun in charge.
    fr: Moïse se rend au rendez-vous fixé par son Seigneur et confie la responsabilité à Aaron.
    tr: Musa, Rabbinin atamasına gitti ve Halife olarak Harun'u bıraktı.
    id: Musa pergi ke janji Tuhannya dan meninggalkan Harun sebagai khalifah.
- title:
    ar: صنع العجل
    en: Making the calf
    fr: La fabrication du veau
    tr: Buzağı yapımı
    id: Pembuatan anak sapi
  ref: طه 87–88
  body:
    ar: جمع السامري الحلي وصنع عجلًا له خوار.
    en: Al-Samiri gathered the jewelry and made a lowing calf.
    fr: Le Samiri rassemble les bijoux et fabrique un veau qui émet un mugissement.
    tr: Samiriyeli mücevherleri topladı ve körükleriyle bir buzağı yaptı.
    id: Orang Samaria itu mengumpulkan perhiasan dan membuat anak sapi dengan alat belokannya.
- title:
    ar: العبادة
    en: The worship
    fr: Le culte du veau
    tr: İbadet
    id: Ibadah
  ref: طه 88
  body:
    ar: قالوا هذا إلهكم وإله موسى — فتنة الجهل.
    en: '''This is your god and Musa''s god'' — the trial of ignorance.'
    fr: Le verset évoque l’attribution mensongère d’un statut divin au veau, dans une épreuve liée à l’ignorance.
    tr: Onlar, 'Bu senin tanrın ve Musa'nın Tanrısıdır' dediler — cehalet sınavı.
    id: Mereka berkata, 'Ini adalah allahmu dan Allah Musa' — ujian ketidaktahuan.
- title:
    ar: رجوع موسى
    en: Musa's return
    fr: Le retour de Moïse
    tr: Musa'nın dönüşü
    id: Kembalinya Musa
  ref: طه 92–94
  body:
    ar: رجع غضبان أسفًا وعاتب هارون والسامري.
    en: He returned angry and sorrowful, rebuking Harun and al-Samiri.
    fr: Il revient en colère et affligé, et adresse des reproches à Aaron et au Samiri.
    tr: Öfkeyle geri döndü ve Aaron ile Samiriyeli'yi azarladı.
    id: Dia kembali dengan marah dan menegur Aaron dan orang Samaria.
- title:
    ar: العقوبة
    en: The punishment
    fr: La sanction
    tr: Ceza
    id: Hukuman
  ref: طه 97
  body:
    ar: قال فاذهب فإن لك في الحياة أن تقول لا مساس — النفي والعزلة.
    en: '''Go — in this life you shall say: touch me not'' — exile.'
    fr: Le verset évoque l’exclusion du Samiri et son isolement hors des contacts ordinaires.
    tr: O da dedi ki, 'O zaman git, çünkü hayatta 'zarar yok' diyebilirsin — inkâr ve yalnızlık.
    id: Dia berkata, 'Jadi pergilah, karena dalam hidup kamu mungkin berkata 'tidak ada yang menyakiti' — penyangkalan dan isolasi.
facts:
- ar: ذُكرت في سورة طه.
  en: Mentioned in Surah Ta-Ha.
  fr: Le récit figure dans la sourate Ta-Ha.
  tr: Taha suresinde bahsedilmiştir.
  id: Ia disebutkan dalam Surah Taha.
lessons:
- ar: خطر الفتنة في غياب القيادة.
  en: The danger of trial in leadership's absence.
  fr: Le danger de l’égarement en l’absence des dirigeants.
  tr: Liderlik olmadan isyan tehlikesi.
  id: Bahaya hasutan tanpa kepemimpinan.
- ar: الجهل بالتوحيد يوقع في الشرك.
  en: Ignorance of tawhid leads to shirk.
  fr: L’ignorance de l’unicité divine est présentée comme une voie vers l’associationnisme.
  tr: Tek tanrıcılığın cehaleti çoktanrıcılığa yol açar.
  id: Ketidaktahuan tentang monoteisme mengarah pada politeisme.
cautions: []
khulasa:
  ar: من ترك التوحيد عبد العجل — الثبات على العقيدة نجاة.
  en: Whoever abandons tawhid worships the calf — holding to creed is salvation.
  fr: Le récit oppose l’abandon de l’unicité divine, illustré par le culte du veau, à la fidélité à la croyance.
  tr: Tek tanrıcılığı terk eden Abd al-Ajal'dır — inançta kararlılık kurtuluştur.
  id: Siapa pun yang meninggalkan monoteisme adalah Abd al-Ajal — keteguhan dalam kepercayaan adalah keselamatan.
