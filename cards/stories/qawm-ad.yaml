slug: qawm-ad
title: { ar: "قصة قوم عاد", en: "The people of 'Ad", fr: "Le peuple de Ad" }
lede:
  ar: "القوة التي أطغتها — ريح صرصر عاتية سبع ليال وثمانية أيام."
  en: "Strength that bred arrogance — a violent wind for seven nights and eight days."
  fr: "Une puissance devenue orgueil : un vent violent durant sept nuits et huit jours."
source_card: f2fb66a0
status: { review: draft }
intro:
  ar: "قوم عاد كانوا أشد الناس قوة وبنيانًا، فكذبوا نبيهم هودًا فأهلكهم الله."
  en: "'Ad were the mightiest in strength and building; they denied their prophet Hud."
  fr: Le peuple de Ad est décrit comme puissant et bâtisseur ; il rejette son prophète Houd et Dieu le fait périr.
stations:
  - title: { ar: "قوتهم", en: "Their power", fr: "Leur puissance" }
    ref: "فصلت 15"
    body:
      ar: "قالوا من أشد منا قوة — اغتروا بقوتهم."
      en: "'Who is mightier than us in strength?' — deluded by power."
      fr: Le verset évoque leur orgueil et leur conviction de n’avoir aucun égal en force.
  - title: { ar: "دعوة هود", en: "Hud's call", fr: "L’appel de Houd" }
    ref: "الأعراف 65"
    body:
      ar: "دعاهم إلى عبادة الله وحده وترك الاستكبار."
      en: "He called them to worship God alone and abandon arrogance."
      fr: Il les appelle à adorer Dieu seul et à renoncer à l’arrogance.
  - title: { ar: "التكذيب", en: "Denial", fr: "Le rejet" }
    ref: "الأعراف 66"
    body:
      ar: "كذبوه واتهموه بالسفه."
      en: "They denied him and accused him of folly."
      fr: Ils le traitent de menteur et l’accusent de sottise.
  - title: { ar: "السحاب", en: "The cloud", fr: "Le nuage" }
    ref: "الأحقاف 24"
    body:
      ar: "رأوا سحابًا فظنوه مطرًا — فإذا هو العذاب."
      en: "They saw a cloud and thought it rain — it was punishment."
      fr: Ils prennent un nuage pour une promesse de pluie ; il annonce leur châtiment.
  - title: { ar: "الريح العاتية", en: "The violent wind", fr: "Le vent violent" }
    ref: "الحاقة 6–7"
    body:
      ar: "ريح صرصر عاتية سخرها عليهم سبع ليال وثمانية أيام."
      en: "A furious wind unleashed upon them seven nights and eight days."
      fr: Le passage évoque un vent dévastateur durant sept nuits et huit jours.
  - title: { ar: "العاقبة", en: "The end", fr: "L’issue" }
    ref: "هود 60"
    body:
      ar: "أُتبعوا لعنة في الدنيا ويوم القيامة — ألا بعدًا لعاد."
      en: "Cursed in this world and on Resurrection Day."
      fr: Le passage évoque une malédiction qui les poursuit en ce monde et au Jour de la Résurrection.
facts:
  - { ar: "نبيهم هود.", en: "Their prophet was Hud.", fr: "Leur prophète est Houd." }
lessons:
  - { ar: "القوة بلا إيمان هلاك.", en: "Power without faith is ruin.", fr: "Le récit présente la puissance sans foi comme une voie de ruine." }
  - { ar: "الاستكبار عن الحق عاقبته وخيمة.", en: "Arrogance against truth ends badly.", fr: "L’arrogance face à la vérité conduit à une issue funeste." }
cautions: []
khulasa:
  ar: "من اغتر بقوته أهلكته — والنجاة في اتباع الرسل."
  en: "Whoever is deluded by strength is destroyed; salvation lies in following the messengers."
  fr: Le récit oppose l’illusion de la force à la voie du salut par le suivi des messagers.
