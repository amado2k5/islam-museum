slug: qawm-ad
title:
  ar: قصة قوم عاد
  en: The people of 'Ad
  fr: Le peuple de Ad
  tr: '''Ad halkının hikayesi'
  id: Kisah rakyat 'Ad
lede:
  ar: القوة التي أطغتها — ريح صرصر عاتية سبع ليال وثمانية أيام.
  en: Strength that bred arrogance — a violent wind for seven nights and eight days.
  fr: 'Une puissance devenue orgueil : un vent violent durant sept nuits et huit jours.'
  tr: Onu saran güç — yedi gece sekiz gün boyunca şiddetli bir kükreyen rüzgar.
  id: Kekuatan yang menguasainya — angin yang mengaum selama tujuh malam delapan hari.
source_card: f2fb66a0
status:
  review: draft
intro:
  ar: قوم عاد كانوا أشد الناس قوة وبنيانًا، فكذبوا نبيهم هودًا فأهلكهم الله.
  en: '''Ad were the mightiest in strength and building; they denied their prophet Hud.'
  fr: Le peuple de Ad est décrit comme puissant et bâtisseur ; il rejette son prophète Houd et Dieu le fait périr.
  tr: '''Ad''ın ahmi, en güçlü ve en sağlam yapılı insanlardı, bu yüzden peygamberleri Hud''u reddettiler ve Allah onları yok etti.'
  id: Orang-orang 'Aad adalah yang terkuat dan paling bertubuh baik, sehingga mereka menolak nabi mereka Hud dan Tuhan menghancurkan mereka.
stations:
- title:
    ar: قوتهم
    en: Their power
    fr: Leur puissance
    tr: Güçleri
    id: Kekuatan mereka
  ref: فصلت 15
  body:
    ar: قالوا من أشد منا قوة — اغتروا بقوتهم.
    en: '''Who is mightier than us in strength?'' — deluded by power.'
    fr: Le verset évoque leur orgueil et leur conviction de n’avoir aucun égal en force.
    tr: '''Bizden daha güçlü kim olabilir?'' dediler — güçlerine aldandılar.'
    id: Mereka berkata, 'Siapa yang lebih kuat dari kita?' — mereka tertipu oleh kekuatan mereka.
- title:
    ar: دعوة هود
    en: Hud's call
    fr: L’appel de Houd
    tr: Hood's Call
    id: Panggilan Hood
  ref: الأعراف 65
  body:
    ar: دعاهم إلى عبادة الله وحده وترك الاستكبار.
    en: He called them to worship God alone and abandon arrogance.
    fr: Il les appelle à adorer Dieu seul et à renoncer à l’arrogance.
    tr: Onları yalnızca Tanrı'ya tapmaya ve kibirden vazgeçmeye çağırdı.
    id: Ia memanggil mereka untuk hanya menyembah Tuhan dan meninggalkan kesombongan.
- title:
    ar: التكذيب
    en: Denial
    fr: Le rejet
    tr: İnkar
    id: Penolakan
  ref: الأعراف 66
  body:
    ar: كذبوه واتهموه بالسفه.
    en: They denied him and accused him of folly.
    fr: Ils le traitent de menteur et l’accusent de sottise.
    tr: Ona yalan söylediler ve aptal olmakla suçladılar.
    id: Mereka berbohong dan menuduhnya bodoh.
- title:
    ar: السحاب
    en: The cloud
    fr: Le nuage
    tr: bulutlar
    id: awan
  ref: الأحقاف 24
  body:
    ar: رأوا سحابًا فظنوه مطرًا — فإذا هو العذاب.
    en: They saw a cloud and thought it rain — it was punishment.
    fr: Ils prennent un nuage pour une promesse de pluie ; il annonce leur châtiment.
    tr: Bulutlar gördüler ve yağmur sandılar—ama bu işkenceydi.
    id: Mereka melihat awan dan mengira itu hujan—padahal itu adalah siksaan.
- title:
    ar: الريح العاتية
    en: The violent wind
    fr: Le vent violent
    tr: şiddetli rüzgar
    id: angin kencang
  ref: الحاقة 6–7
  body:
    ar: ريح صرصر عاتية سخرها عليهم سبع ليال وثمانية أيام.
    en: A furious wind unleashed upon them seven nights and eight days.
    fr: Le passage évoque un vent dévastateur durant sept nuits et huit jours.
    tr: Şiddetli bir hamamböceği rüzgarı onları yedi gece sekiz gün boyunca etkisiz hale getirdi.
    id: Angin kecoa yang ganas menundukkan mereka selama tujuh malam delapan hari.
- title:
    ar: العاقبة
    en: The end
    fr: L’issue
    tr: Sonuç
    id: Hasil
  ref: هود 60
  body:
    ar: أُتبعوا لعنة في الدنيا ويوم القيامة — ألا بعدًا لعاد.
    en: Cursed in this world and on Resurrection Day.
    fr: Le passage évoque une malédiction qui les poursuit en ce monde et au Jour de la Résurrection.
    tr: Bu dünyada ve Diriliş Günü'nde bir laneti takip ettiler — 'Ad' uzaklığı hariç.
    id: Mereka mengikuti kutukan di dunia ini dan pada Hari Kebangkitan — kecuali jarak 'Ad.
facts:
- ar: نبيهم هود.
  en: Their prophet was Hud.
  fr: Leur prophète est Houd.
  tr: Peygamberleri Hud.
  id: Nabi mereka, Hud.
lessons:
- ar: القوة بلا إيمان هلاك.
  en: Power without faith is ruin.
  fr: Le récit présente la puissance sans foi comme une voie de ruine.
  tr: İnanç olmadan güç yıkımdır.
  id: Kekuasaan tanpa iman adalah kehancuran.
- ar: الاستكبار عن الحق عاقبته وخيمة.
  en: Arrogance against truth ends badly.
  fr: L’arrogance face à la vérité conduit à une issue funeste.
  tr: Gerçeğin kibirinin ciddi bir sonucu vardır.
  id: Kesombongan terhadap kebenaran memiliki konsekuensi yang berat.
cautions: []
khulasa:
  ar: من اغتر بقوته أهلكته — والنجاة في اتباع الرسل.
  en: Whoever is deluded by strength is destroyed; salvation lies in following the messengers.
  fr: Le récit oppose l’illusion de la force à la voie du salut par le suivi des messagers.
  tr: Kendi gücüyle kandırılan herkes, onu yok eder — ve kurtuluş, elçileri takip etmekte yatar.
  id: Siapa pun yang tertipu oleh kekuatannya sendiri, itu akan menghancurkannya — dan keselamatan terletak pada mengikuti para utusan.
