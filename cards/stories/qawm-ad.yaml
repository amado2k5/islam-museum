slug: qawm-ad
title: { ar: "قصة قوم عاد", en: "The people of 'Ad" }
lede:
  ar: "القوة التي أطغتها — ريح صرصر عاتية سبع ليال وثمانية أيام."
  en: "Strength that bred arrogance — a violent wind for seven nights and eight days."
source_card: f2fb66a0
status: { review: draft }
intro:
  ar: "قوم عاد كانوا أشد الناس قوة وبنيانًا، فكذبوا نبيهم هودًا فأهلكهم الله."
  en: "'Ad were the mightiest in strength and building; they denied their prophet Hud."
stations:
  - title: { ar: "قوتهم", en: "Their power" }
    ref: "فصلت 15"
    body:
      ar: "قالوا من أشد منا قوة — اغتروا بقوتهم."
      en: "'Who is mightier than us in strength?' — deluded by power."
  - title: { ar: "دعوة هود", en: "Hud's call" }
    ref: "الأعراف 65"
    body:
      ar: "دعاهم إلى عبادة الله وحده وترك الاستكبار."
      en: "He called them to worship God alone and abandon arrogance."
  - title: { ar: "التكذيب", en: "Denial" }
    ref: "الأعراف 66"
    body:
      ar: "كذبوه واتهموه بالسفه."
      en: "They denied him and accused him of folly."
  - title: { ar: "السحاب", en: "The cloud" }
    ref: "الأحقاف 24"
    body:
      ar: "رأوا سحابًا فظنوه مطرًا — فإذا هو العذاب."
      en: "They saw a cloud and thought it rain — it was punishment."
  - title: { ar: "الريح العاتية", en: "The violent wind" }
    ref: "الحاقة 6–7"
    body:
      ar: "ريح صرصر عاتية سخرها عليهم سبع ليال وثمانية أيام."
      en: "A furious wind unleashed upon them seven nights and eight days."
  - title: { ar: "العاقبة", en: "The end" }
    ref: "هود 60"
    body:
      ar: "أُتبعوا لعنة في الدنيا ويوم القيامة — ألا بعدًا لعاد."
      en: "Cursed in this world and on Resurrection Day."
facts:
  - { ar: "نبيهم هود.", en: "Their prophet was Hud." }
lessons:
  - { ar: "القوة بلا إيمان هلاك.", en: "Power without faith is ruin." }
  - { ar: "الاستكبار عن الحق عاقبته وخيمة.", en: "Arrogance against truth ends badly." }
cautions: []
khulasa:
  ar: "من اغتر بقوته أهلكته — والنجاة في اتباع الرسل."
  en: "Whoever is deluded by strength is destroyed; salvation lies in following the messengers."
