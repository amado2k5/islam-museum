slug: qissat-isa
title:
  ar: قصة عيسى
  en: The story of 'Isa
  fr: Le récit de Jésus
  tr: İsa'nın Hikayesi
  id: Kisah Yesus
lede:
  ar: المسيح — مولده المعجز ومعجزاته ورفعه.
  en: The Messiah — his miraculous birth, miracles, and ascension.
  fr: 'Le Messie : naissance miraculeuse, miracles et élévation.'
  tr: Mesih — Mucizevi doğumu, mucizeleri ve yükselişi.
  id: Kristus — Kelahiran ajaib, mukjizat, dan kenaikan-Nya.
source_card: 0ef56c77
status:
  review: draft
intro:
  ar: عيسى بن مريم عبد الله ورسوله وكلمته ألقاها إلى مريم — آية للعالمين.
  en: '''Isa son of Maryam: God''s servant and messenger, His word cast to Maryam.'
  fr: Le passage présente Jésus, fils de Marie, comme serviteur et messager de Dieu, associé à Sa parole transmise à Marie et à un signe pour les mondes.
  tr: İsa, Meryem'in oğlu, Allah'ın ve O'nun Elçisinin hizmetkârı ve Meryem'e verdiği söz—dünyalar için bir işaret.
  id: Yesus, putra Maria, hamba Allah dan Rasul-Nya, dan firman yang Dia sampaikan kepada Maria—sebuah tanda bagi dunia.
stations:
- title:
    ar: البشارة
    en: The annunciation
    fr: L’Annonciation
    tr: Müjde
    id: Kabar Sukacita
  ref: آل عمران 45
  body:
    ar: بُشرت مريم بغلام اسمه المسيح عيسى بن مريم.
    en: Maryam was given glad tidings of a boy named the Messiah 'Isa.
    fr: Le passage évoque l’annonce faite à Marie de la naissance du Messie, Jésus, fils de Marie.
    tr: Meryem, Meryem'in oğlu İsa İsa adında bir çocuk için vaaz verdi.
    id: Maria memberitakan seorang anak laki-laki bernama Kristus Yesus, putra Maria.
- title:
    ar: المولد المعجز
    en: The miraculous birth
    fr: La naissance miraculeuse
    tr: Mucizevi Doğum
    id: Kelahiran Ajaib
  ref: مريم 22–23
  body:
    ar: وُلد من غير أب — آية من آيات الله.
    en: Born without a father — a sign of God.
    fr: Il naît sans père, signe de Dieu.
    tr: Babasız doğdu — Tanrı'nın işaretlerinden bir ayet.
    id: Lahir tanpa ayah — sebuah ayat dari tanda-tanda Tuhan.
- title:
    ar: المعجزات
    en: The miracles
    fr: Les miracles
    tr: mucizeler
    id: mukjizat
  ref: المائدة 110
  body:
    ar: يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله.
    en: He healed the blind and the leper and raised the dead by God's leave.
    fr: Le passage évoque des guérisons et le retour des morts à la vie, avec la permission de Dieu.
    tr: Körleri ve cüzamlıları iyileştirir ve ölüleri hayata döndürür, Allah izin verir.
    id: Dia menyembuhkan orang buta dan kusta serta menghidupkan kembali orang mati, dengan izin Tuhan.
- title:
    ar: الرفع
    en: The ascension
    fr: L’élévation
    tr: Kaldırma
    id: Mengangkat
  ref: النساء 158
  body:
    ar: بل رفعه الله إليه — وما قتلوه وما صلبوه.
    en: God raised him to Himself — they neither killed nor crucified him.
    fr: Le passage évoque l’élévation de Jésus auprès de Dieu et nie sa mise à mort et sa crucifixion.
    tr: Aksine Tanrı onu kendisine yükseltti — ve onu öldürmedi ya da çarmıha germedi.
    id: Sebaliknya, Tuhan membangkitkannya kepada-Nya — dan mereka tidak membunuhnya atau menyalibkannya.
- title:
    ar: النزول آخر الزمان
    en: Descent at the end of time
    fr: La descente à la fin des temps
    tr: Kıyamet Zamanlarının İnişi
    id: Kejatuhan Akhir Zaman
  ref: الزخرف 61
  body:
    ar: وإنه لعلم للساعة — ينزل حكمًا عدلًا.
    en: He is a sign of the Hour — descending as a just ruler.
    fr: Le passage évoque un signe de l’Heure ; la tradition présente son retour en juge équitable.
    tr: Ve bu Saatin bilgisidir—adil bir yargı iner.
    id: Dan itu adalah pengetahuan tentang Jam—penghakiman yang adil akan turun.
facts:
- ar: من أولي العزم من الرسل.
  en: Among the resolute messengers.
  fr: Il compte parmi les messagers doués de résolution.
  tr: Kararlı elçiler arasında.
  id: Di antara para utusan yang tegas.
lessons:
- ar: عيسى عبد الله ورسوله لا إله.
  en: '''Isa is God''s servant and messenger, not divine.'
  fr: Dans le cadre doctrinal présenté ici, Jésus est serviteur et messager de Dieu, non une divinité.
  tr: İsa, Tanrı'nın hizmetkârı ve Elçisidir. Tanrı yoktur.
  id: Yesus adalah hamba Allah dan utusan-Nya Tidak ada Tuhan.
- ar: المعجزات بإذن الله وحده.
  en: Miracles are by God's leave alone.
  fr: Les miracles se produisent avec la seule permission de Dieu.
  tr: Mucizeler sadece Tanrı'nın izniyle olur.
  id: Mukjizat hanya terjadi dengan izin Tuhan.
cautions: []
khulasa:
  ar: عيسى آية الله وكلمته — وعبوديته لله شرفه.
  en: '''Isa is God''s sign and word — and his servitude to God is his honor.'
  fr: Jésus est présenté comme un signe et une parole de Dieu, dont la dignité réside dans sa condition de serviteur.
  tr: İsa, Ayetullah ve O'nun Sözü'dür — ve Tanrı'ya olan hizmetkarlığı O'nun onurudur.
  id: Yesus adalah Ayatollah dan Firman-Nya — dan pengabdian-Nya kepada Allah adalah kehormatan-Nya.
