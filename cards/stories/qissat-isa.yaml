slug: qissat-isa
title: { ar: "قصة عيسى", en: "The story of 'Isa" }
lede:
  ar: "المسيح — مولده المعجز ومعجزاته ورفعه."
  en: "The Messiah — his miraculous birth, miracles, and ascension."
source_card: 0ef56c77
status: { review: draft }
intro:
  ar: "عيسى بن مريم عبد الله ورسوله وكلمته ألقاها إلى مريم — آية للعالمين."
  en: "'Isa son of Maryam: God's servant and messenger, His word cast to Maryam."
stations:
  - title: { ar: "البشارة", en: "The annunciation" }
    ref: "آل عمران 45"
    body:
      ar: "بُشرت مريم بغلام اسمه المسيح عيسى بن مريم."
      en: "Maryam was given glad tidings of a boy named the Messiah 'Isa."
  - title: { ar: "المولد المعجز", en: "The miraculous birth" }
    ref: "مريم 22–23"
    body:
      ar: "وُلد من غير أب — آية من آيات الله."
      en: "Born without a father — a sign of God."
  - title: { ar: "المعجزات", en: "The miracles" }
    ref: "المائدة 110"
    body:
      ar: "يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله."
      en: "He healed the blind and the leper and raised the dead by God's leave."
  - title: { ar: "الرفع", en: "The ascension" }
    ref: "النساء 158"
    body:
      ar: "بل رفعه الله إليه — وما قتلوه وما صلبوه."
      en: "God raised him to Himself — they neither killed nor crucified him."
  - title: { ar: "النزول آخر الزمان", en: "Descent at the end of time" }
    ref: "الزخرف 61"
    body:
      ar: "وإنه لعلم للساعة — ينزل حكمًا عدلًا."
      en: "He is a sign of the Hour — descending as a just ruler."
facts:
  - { ar: "من أولي العزم من الرسل.", en: "Among the resolute messengers." }
lessons:
  - { ar: "عيسى عبد الله ورسوله لا إله.", en: "'Isa is God's servant and messenger, not divine." }
  - { ar: "المعجزات بإذن الله وحده.", en: "Miracles are by God's leave alone." }
cautions: []
khulasa:
  ar: "عيسى آية الله وكلمته — وعبوديته لله شرفه."
  en: "'Isa is God's sign and word — and his servitude to God is his honor."
