slug: qissat-isa
title: { ar: "قصة عيسى", en: "The story of 'Isa", fr: "Le récit de Jésus" }
lede:
  ar: "المسيح — مولده المعجز ومعجزاته ورفعه."
  en: "The Messiah — his miraculous birth, miracles, and ascension."
  fr: "Le Messie : naissance miraculeuse, miracles et élévation."
source_card: 0ef56c77
status: { review: draft }
intro:
  ar: "عيسى بن مريم عبد الله ورسوله وكلمته ألقاها إلى مريم — آية للعالمين."
  en: "'Isa son of Maryam: God's servant and messenger, His word cast to Maryam."
  fr: Le passage présente Jésus, fils de Marie, comme serviteur et messager de Dieu, associé à Sa parole transmise à Marie et à un signe pour les mondes.
stations:
  - title: { ar: "البشارة", en: "The annunciation", fr: "L’Annonciation" }
    ref: "آل عمران 45"
    body:
      ar: "بُشرت مريم بغلام اسمه المسيح عيسى بن مريم."
      en: "Maryam was given glad tidings of a boy named the Messiah 'Isa."
      fr: Le passage évoque l’annonce faite à Marie de la naissance du Messie, Jésus, fils de Marie.
  - title: { ar: "المولد المعجز", en: "The miraculous birth", fr: "La naissance miraculeuse" }
    ref: "مريم 22–23"
    body:
      ar: "وُلد من غير أب — آية من آيات الله."
      en: "Born without a father — a sign of God."
      fr: Il naît sans père, signe de Dieu.
  - title: { ar: "المعجزات", en: "The miracles", fr: "Les miracles" }
    ref: "المائدة 110"
    body:
      ar: "يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله."
      en: "He healed the blind and the leper and raised the dead by God's leave."
      fr: Le passage évoque des guérisons et le retour des morts à la vie, avec la permission de Dieu.
  - title: { ar: "الرفع", en: "The ascension", fr: "L’élévation" }
    ref: "النساء 158"
    body:
      ar: "بل رفعه الله إليه — وما قتلوه وما صلبوه."
      en: "God raised him to Himself — they neither killed nor crucified him."
      fr: Le passage évoque l’élévation de Jésus auprès de Dieu et nie sa mise à mort et sa crucifixion.
  - title: { ar: "النزول آخر الزمان", en: "Descent at the end of time", fr: "La descente à la fin des temps" }
    ref: "الزخرف 61"
    body:
      ar: "وإنه لعلم للساعة — ينزل حكمًا عدلًا."
      en: "He is a sign of the Hour — descending as a just ruler."
      fr: Le passage évoque un signe de l’Heure ; la tradition présente son retour en juge équitable.
facts:
  - { ar: "من أولي العزم من الرسل.", en: "Among the resolute messengers.", fr: "Il compte parmi les messagers doués de résolution." }
lessons:
  - { ar: "عيسى عبد الله ورسوله لا إله.", en: "'Isa is God's servant and messenger, not divine.", fr: "Dans le cadre doctrinal présenté ici, Jésus est serviteur et messager de Dieu, non une divinité." }
  - { ar: "المعجزات بإذن الله وحده.", en: "Miracles are by God's leave alone.", fr: "Les miracles se produisent avec la seule permission de Dieu." }
cautions: []
khulasa:
  ar: "عيسى آية الله وكلمته — وعبوديته لله شرفه."
  en: "'Isa is God's sign and word — and his servitude to God is his honor."
  fr: Jésus est présenté comme un signe et une parole de Dieu, dont la dignité réside dans sa condition de serviteur.
