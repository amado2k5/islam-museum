slug: dhu-al-qarnayn
title: { ar: "قصة ذي القرنين", en: "Dhu al-Qarnayn" }
lede:
  ar: "التمكين والعدل والعمل — رحلات المشرق والمغرب وبناء السد."
  en: "Empowerment, justice and work — journeys east and west, and the barrier."
source_card: 374b2b1b
status: { review: draft }
intro:
  ar: "ملك صالح مكّن الله له في الأرض وآتاه من كل شيء سببًا، فجاب المشرق والمغرب عدلًا وإصلاحًا."
  en: "A righteous king God empowered on earth, journeying east and west with justice."
stations:
  - title: { ar: "الأخذ بالأسباب", en: "Taking the means" }
    ref: "الكهف 84–85"
    body:
      ar: "إنا مكنا له في الأرض وآتيناه من كل شيء سببًا فأتبع سببًا — التمكين مع العمل."
      en: "We established him on earth and gave him means to all things — empowerment with effort."
  - title: { ar: "رحلة المغرب", en: "Journey to the west" }
    ref: "الكهف 86"
    body:
      ar: "بلغ مغرب الشمس فوجد قومًا؛ فأقام العدل: من ظلم عُذّب ومن آمن عُومل بالحسنى."
      en: "He reached the setting of the sun and established justice among its people."
  - title: { ar: "رحلة المشرق", en: "Journey to the east" }
    ref: "الكهف 90"
    body:
      ar: "بلغ مطلع الشمس فوجد قومًا لا يكادون يفقهون قولًا فأحسن إليهم."
      en: "He reached the rising of the sun and treated its people well."
  - title: { ar: "بين السدين", en: "Between the barriers" }
    ref: "الكهف 93"
    body:
      ar: "وجد قومًا اشتكوا من يأجوج ومأجوج وطلبوا السد."
      en: "He found a people suffering from Gog and Magog who asked for a barrier."
  - title: { ar: "بناء السد", en: "Building the barrier" }
    ref: "الكهف 95–97"
    body:
      ar: "بنى سدًا من الحديد والنحاس بعمل جماعي منظم — الأخذ بالأسباب."
      en: "He built an iron-and-copper barrier through organized collective work."
  - title: { ar: "التواضع لله", en: "Humility before God" }
    ref: "الكهف 98"
    body:
      ar: "قال هذا رحمة من ربي — نسب الفضل إلى الله لا إلى نفسه."
      en: "'This is mercy from my Lord' — attributing grace to God, not himself."
facts:
  - { ar: "ذُكر في سورة الكهف.", en: "Mentioned in Surah al-Kahf." }
lessons:
  - { ar: "العدل أساس الملك.", en: "Justice is the foundation of rule." }
  - { ar: "الأخذ بالأسباب مع التوكل.", en: "Taking means alongside trust in God." }
  - { ar: "التواضع عند التمكين.", en: "Humility in empowerment." }
cautions: []
khulasa:
  ar: "القوة الحقيقية عدلٌ وعملٌ وتواضع."
  en: "True strength is justice, work, and humility."
