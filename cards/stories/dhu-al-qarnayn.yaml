slug: dhu-al-qarnayn
title:
  ar: قصة ذي القرنين
  en: Dhu al-Qarnayn
  fr: Dhou al-Qarnayn
  tr: Dhu al-Qarnayn'ın Hikayesi
  id: Kisah Dhu al-Qarnayn
lede:
  ar: التمكين والعدل والعمل — رحلات المشرق والمغرب وبناء السد.
  en: Empowerment, justice and work — journeys east and west, and the barrier.
  fr: 'Autorité, justice et travail : voyages vers l’est et l’ouest et construction de la barrière.'
  tr: Güçlenme, Adalet ve Eylem — Doğu, Fas ve Baraj İnşası'nın Yolculukları.
  id: Pemberdayaan, Keadilan, dan Aksi — Perjalanan Timur, Maroko, dan Pembangunan Bendungan.
source_card: 374b2b1b
status:
  review: draft
intro:
  ar: ملك صالح مكّن الله له في الأرض وآتاه من كل شيء سببًا، فجاب المشرق والمغرب عدلًا وإصلاحًا.
  en: A righteous king God empowered on earth, journeying east and west with justice.
  fr: Un roi juste auquel Dieu donne les moyens d’agir sur terre parcourt l’Orient et l’Occident avec justice.
  tr: Tanrı'nın yeryüzünde güç verdiği ve her şeyden bir amaç verdiği doğru bir kraldı, bu yüzden adalet ve reformla doğu ve batı yönünde yol aldı.
  id: Seorang raja yang benar yang diberi kuasa Tuhan di bumi dan memberinya tujuan dari segala hal, maka dia melakukan perjalanan ke timur dan barat dengan keadilan dan reformasi.
stations:
- title:
    ar: الأخذ بالأسباب
    en: Taking the means
    fr: Prendre les moyens d’agir
    tr: Nedenleri Ele Almak
    id: Mengambil Alasan
  ref: الكهف 84–85
  body:
    ar: إنا مكنا له في الأرض وآتيناه من كل شيء سببًا فأتبع سببًا — التمكين مع العمل.
    en: We established him on earth and gave him means to all things — empowerment with effort.
    fr: Le verset évoque les moyens accordés à Dhou al-Qarnayn et ses efforts pour les mettre en œuvre.
    tr: Gerçekten de, biz ona yeryüzünde güç verdik ve ona her türlü bir amaç verdik, böylece o da bir davayı takip etti—güçlenme ve eylem.
    id: Memang, Kami memberdayakan Dia di bumi dan memberinya berbagai tujuan dari segala bentuk, sehingga Dia mengikuti sebuah tujuan—pemberdayaan bersama dengan tindakan.
- title:
    ar: رحلة المغرب
    en: Journey to the west
    fr: Le voyage vers l’ouest
    tr: Fas Gezisi
    id: Perjalanan ke Maroko
  ref: الكهف 86
  body:
    ar: 'بلغ مغرب الشمس فوجد قومًا؛ فأقام العدل: من ظلم عُذّب ومن آمن عُومل بالحسنى.'
    en: He reached the setting of the sun and established justice among its people.
    fr: Il atteint le couchant et établit la justice parmi les habitants, distinguant l’injustice de la foi.
    tr: 'Gün batımına ulaştı ve bir halk buldu; adalet tesis oldu: haksızlığa uğrayan cezalandırılır, iman eden iyi muamele görür.'
    id: 'Ia mencapai matahari terbenam dan menemukan sebuah bangsa; dan keadilan ditegakkan: siapa pun yang berbuat salah dihukum, dan siapa pun percaya diperlakukan dengan baik.'
- title:
    ar: رحلة المشرق
    en: Journey to the east
    fr: Le voyage vers l’est
    tr: Doğu Yolculuğu
    id: Perjalanan Timur
  ref: الكهف 90
  body:
    ar: بلغ مطلع الشمس فوجد قومًا لا يكادون يفقهون قولًا فأحسن إليهم.
    en: He reached the rising of the sun and treated its people well.
    fr: Il atteint le levant et traite ses habitants avec bienveillance.
    tr: Gün doğumuna ulaştığında neredeyse tek kelime anlamayan bir halk buldu, bu yüzden onlara iyi davrandı.
    id: Dia sampai di matahari terbit dan menemukan orang-orang yang hampir tidak mengerti sepatah kata pun, jadi dia memperlakukan mereka dengan baik.
- title:
    ar: بين السدين
    en: Between the barriers
    fr: Entre les deux barrières
    tr: İki baraj arasında
    id: Di antara dua bendungan
  ref: الكهف 93
  body:
    ar: وجد قومًا اشتكوا من يأجوج ومأجوج وطلبوا السد.
    en: He found a people suffering from Gog and Magog who asked for a barrier.
    fr: Il rencontre un peuple qui se plaint de Gog et Magog et demande une barrière.
    tr: Gog ve Magog'dan şikayet eden ve bir baraj isteyen bir halk buldu.
    id: Dia menemukan sebuah bangsa yang mengeluh tentang Gog dan Magog dan meminta bendungan.
- title:
    ar: بناء السد
    en: Building the barrier
    fr: La construction de la barrière
    tr: Baraj İnşası
    id: Konstruksi Bendungan
  ref: الكهف 95–97
  body:
    ar: بنى سدًا من الحديد والنحاس بعمل جماعي منظم — الأخذ بالأسباب.
    en: He built an iron-and-copper barrier through organized collective work.
    fr: Il bâtit une barrière de fer et de cuivre grâce à un travail collectif organisé.
    tr: Organize kolektif çalışmalarla demir ve bakırdan bir baraj inşa etti — nedenleri üstlenerek.
    id: Ia membangun bendungan besi dan tembaga melalui kerja kolektif terorganisir — mengambil perjuangan.
- title:
    ar: التواضع لله
    en: Humility before God
    fr: L’humilité devant Dieu
    tr: Alçakgönüllülük Tanrı içindir
    id: Kerendahan hati adalah untuk Tuhan
  ref: الكهف 98
  body:
    ar: قال هذا رحمة من ربي — نسب الفضل إلى الله لا إلى نفسه.
    en: '''This is mercy from my Lord'' — attributing grace to God, not himself.'
    fr: 'Le verset évoque sa reconnaissance de la miséricorde divine : il attribue à Dieu le mérite de l’ouvrage.'
    tr: Dedi ki, 'Bu Rabbimden bir merhamettir.' — Krediyi Tanrı'ya, kendine değil, atfetti.
    id: Dia berkata, 'Ini adalah rahmat dari Tuhanku.' — Memberikan pujian kepada Tuhan, bukan kepada dirinya sendiri.
facts:
- ar: ذُكر في سورة الكهف.
  en: Mentioned in Surah al-Kahf.
  fr: Le récit figure dans la sourate al-Kahf.
  tr: Kahf Suresi'nde bahsedilmiştir.
  id: Disebutkan dalam Surah Al-Kahf.
lessons:
- ar: العدل أساس الملك.
  en: Justice is the foundation of rule.
  fr: La justice est le fondement du gouvernement.
  tr: Adalet, krallığın temelidir.
  id: Keadilan adalah fondasi kerajaan.
- ar: الأخذ بالأسباب مع التوكل.
  en: Taking means alongside trust in God.
  fr: Prendre les moyens d’agir tout en faisant confiance à Dieu.
  tr: Tanrı'ya güvenerek yolu kullanmak.
  id: Mengambil cara dengan bergantung pada Tuhan.
- ar: التواضع عند التمكين.
  en: Humility in empowerment.
  fr: Rester humble dans l’exercice de l’autorité.
  tr: Güçlenmede alçakgönüllülük.
  id: Kerendahan hati dalam pemberdayaan.
cautions: []
khulasa:
  ar: القوة الحقيقية عدلٌ وعملٌ وتواضع.
  en: True strength is justice, work, and humility.
  fr: La véritable force est présentée comme l’alliance de la justice, du travail et de l’humilité.
  tr: Gerçek güç adalet, eylem ve alçakgönüllülüktür.
  id: Kekuatan sejati adalah keadilan, tindakan, dan kerendahan hati.
