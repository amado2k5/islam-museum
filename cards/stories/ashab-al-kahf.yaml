slug: ashab-al-kahf
title:
  ar: أصحاب الكهف
  en: The People of the Cave
  fr: Les gens de la Caverne
  tr: Mağaranın İnsanları
  id: Orang-Orang Gua
lede:
  ar: فتية آمنوا بربهم فزادهم هدى — قصة الثبات والتوكل.
  en: Youths who believed in their Lord, and He increased them in guidance.
  fr: 'Le récit évoque de jeunes croyants affermis dans leur guidance : une histoire de constance et de confiance.'
  tr: Rablerine inanan gençler ve O onları rehberlikte artırdı — Kararlılık ve güven hikayesi.
  id: Pemuda yang percaya kepada Tuhan mereka, dan Dia meningkatkan mereka dalam bimbingan — Kisah keteguhan dan kepercayaan.
source_card: fb19a4c4
status:
  review: draft
intro:
  ar: في زمن طغيان الشرك، آمن فتية بربهم واعتزلوا قومهم فرارًا بدينهم، فلجؤوا إلى الكهف.
  en: In an age of rampant idolatry, youths believed in their Lord and withdrew from their people, fleeing with their faith to the cave.
  fr: À une époque dominée par l’idolâtrie, de jeunes croyants se séparent de leur peuple pour préserver leur foi et se réfugient dans une caverne.
  tr: Çoktanrıcılığın hakim olduğu bir dönemde, gençler Rablerine inanır ve dinlerinden kaçarak halklarından uzaklaşır, bu yüzden mağaraya sığınırlardı.
  id: Pada masa ketika politeisme mendominasi, anak muda percaya pada Tuhan mereka dan menarik diri dari umat mereka, melarikan diri dari agama mereka, sehingga mereka berlindung di gua.
stations:
- title:
    ar: فتية مؤمنون
    en: Believing youths
    fr: De jeunes croyants
    tr: Sadık Çocuklar
    id: Faithful Boys
  ref: الكهف 13
  body:
    ar: إنهم فتية آمنوا بربهم وزدناهم هدى — الإيمان أول الطريق.
    en: They were youths who believed in their Lord, and We increased them in guidance.
    fr: Le verset évoque leur foi et le renforcement de leur guidance, au début de leur cheminement.
    tr: Onlar, Rablerine inanan ve rehberlikle onları geliştiren genç adamlardır — inanç yolun başlangıcıdır.
    id: Mereka adalah pemuda yang percaya kepada Tuhan mereka dan memperbesar mereka dengan bimbingan — iman adalah awal dari jalan.
- title:
    ar: الثبات على التوحيد
    en: Steadfast on tawhid
    fr: La fidélité à l’unicité divine
    tr: Tek tanrıcılıkta kararlılık
    id: Keteguhan dalam monoteisme
  ref: الكهف 14
  body:
    ar: قاموا فقالوا ربنا رب السماوات والأرض — إعلان التوحيد في وجه الطغيان.
    en: 'They stood and said: our Lord is the Lord of the heavens and earth.'
    fr: Le verset évoque leur affirmation de l’unicité du Seigneur des cieux et de la terre face à la tyrannie.
    tr: 'Ayağa kalktılar ve şöyle dediler: ''Rabbimiz, göklerin ve yerin Rabbi.'' — Zulüm karşısında tektanrıcılığın ilanı.'
    id: Mereka berdiri dan berkata, 'Tuhan kami, Tuhan langit dan bumi.' — Deklarasi monoteisme di hadapan tirani.
- title:
    ar: اللجوء إلى الكهف
    en: Retreat to the cave
    fr: Le refuge dans la caverne
    tr: Mağarada sığınak bulmak
    id: Berlindung di dalam gua
  ref: الكهف 10
  body:
    ar: إذ أوى الفتية إلى الكهف فقالوا ربنا آتنا من لدنك رحمة — الفرار بالدين.
    en: 'When the youths retreated to the cave, they said: our Lord, grant us mercy.'
    fr: Le verset évoque leur recherche d’un refuge et leur demande de miséricorde divine.
    tr: Mağaraya sığındığında, 'Rabbimiz, bize dinde kaçan Senden merhamet ver.' dediler.
    id: Ketika ia berlindung di gua, mereka berkata, 'Tuhan kami, berikanlah rahmat dari-Mu — melarikan diri dalam agama.'
- title:
    ar: النوم الطويل
    en: The long sleep
    fr: Le long sommeil
    tr: Uzun uyku
    id: Tidur panjang
  ref: الكهف 11
  body:
    ar: فضربنا على آذانهم في الكهف سنين عددًا — آية من آيات الله.
    en: We cast sleep upon them in the cave for many years — a sign of God.
    fr: Le passage évoque un sommeil prolongé dans la caverne, signe de la puissance divine.
    tr: Bu yüzden yıllarca mağarada kulaklarına bir sayı vurduk — Tanrı'dan bir işaret.
    id: Jadi Kami memukul telinga mereka di gua selama bertahun-tahun — sebuah tanda dari Tuhan.
- title:
    ar: البعث من النوم
    en: Awakening
    fr: Le réveil
    tr: Uykudan Diriliş
    id: Kebangkitan dari Tidur
  ref: الكهف 19
  body:
    ar: بعثناهم ليتساءلوا بينهم — فإذا بالزمن قد تغير والقوم قد آمنوا.
    en: We raised them to question one another — time had passed and the people had believed.
    fr: Le passage évoque leur réveil et leurs questions mutuelles ; le temps a passé et leur peuple a changé.
    tr: Onları kendi aralarında sorgulamaya gönderdik — ama zaman değişmişti ve halk inanmıştı.
    id: Kami mengirim mereka untuk saling bertanya — tapi waktu telah berubah dan rakyat percaya.
- title:
    ar: آية على البعث
    en: A sign of resurrection
    fr: Un signe de la résurrection
    tr: Diriliş hakkında bir ayet
    id: Sebuah ayat tentang kebangkitan
  ref: الكهف 21
  body:
    ar: أعثرنا عليهم ليعلموا أن وعد الله حق — قصتهم برهان على البعث.
    en: We caused them to be found, that all might know God's promise is true.
    fr: Le verset présente leur découverte comme un signe de la véracité de la promesse divine et de la résurrection.
    tr: Onları bulduk ki Tanrı'nın vaadinin doğru olduğunu bilsinler — hikayeleri dirilişin kanıtıdır.
    id: Kami menemukan mereka agar mereka tahu bahwa janji Tuhan itu benar — kisah mereka adalah bukti kebangkitan.
facts:
- ar: ناموا 309 سنوات.
  en: They slept 309 years.
  fr: Le récit situe leur sommeil sur 309 ans.
  tr: 309 yıl uyudular.
  id: Mereka tidur selama 309 tahun.
- ar: كلبهم باسط ذراعيه بالوصيد.
  en: Their dog stretched its paws at the entrance.
  fr: Le récit évoque leur chien à l’entrée de la caverne.
  tr: Köpekleri yakalamada kollarını uzatıyor.
  id: Anjing mereka merentangkan lengannya di dalam tangkapan.
lessons:
- ar: صحبة الصالحين تنجي.
  en: Righteous company saves.
  fr: La compagnie des justes est présentée comme une protection.
  tr: Doğruların topluluğu kurtulur.
  id: Persekutuan orang benar diselamatkan.
- ar: الفرار بالدين عند الفتنة.
  en: Fleeing with one's faith at times of trial.
  fr: Préserver sa foi en se retirant lors des épreuves.
  tr: Zorluk zamanlarında dinle kaçıyorlar.
  id: Melarikan diri bersama agama di masa kekacauan.
- ar: التوكل على الله في الشدائد.
  en: Trust in God through hardships.
  fr: Faire confiance à Dieu dans les difficultés.
  tr: Zorluklarda Tanrı'ya güvenin.
  id: Percayalah kepada Tuhan dalam kesulitan.
cautions:
- ar: لم يثبت في القرآن اسم المدينة ولا موضع الكهف ولا أسماء الفتية ولا عددهم على وجه القطع.
  en: The Quran does not establish the city's name, the cave's location, or the youths' names and exact number.
  fr: Le Coran ne précise pas avec certitude le nom de la ville, l’emplacement de la caverne, les noms des jeunes gens ni leur nombre exact.
  tr: Kur'an şehrin adı, mağaranın konumu, gençlerin isimleri veya tam sayıları belirtilmemektedir.
  id: Al-Qur'an tidak menyebutkan nama kota, lokasi gua, nama-nama para pemuda, atau jumlah pastinya.
khulasa:
  ar: من آمن بالله واعتز بدينه كفاه الله — والثبات أول النصر.
  en: Whoever believes in God and holds to their faith, God suffices them.
  fr: Le récit souligne le soutien divin à celui qui croit et reste fidèle à sa foi ; la constance précède la victoire.
  tr: Tanrı'ya inanan ve O'nun diniyle gurur duyan kimse, Tanrı ona yeter — ve kararlılık zaferin ilkidir.
  id: Siapa pun yang percaya kepada Tuhan dan berbangga dengan agama-Nya, Allah akan mencukupinya — dan keteguhan adalah yang pertama dari kemenangan.
