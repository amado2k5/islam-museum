slug: ashab-al-kahf
title: { ar: "أصحاب الكهف", en: "The People of the Cave" }
lede:
  ar: "فتية آمنوا بربهم فزادهم هدى — قصة الثبات والتوكل."
  en: "Youths who believed in their Lord, and He increased them in guidance."
source_card: fb19a4c4
status: { review: draft }
intro:
  ar: "في زمن طغيان الشرك، آمن فتية بربهم واعتزلوا قومهم فرارًا بدينهم، فلجؤوا إلى الكهف."
  en: "In an age of rampant idolatry, youths believed in their Lord and withdrew from their people, fleeing with their faith to the cave."
stations:
  - title: { ar: "فتية مؤمنون", en: "Believing youths" }
    ref: "الكهف 13"
    body:
      ar: "إنهم فتية آمنوا بربهم وزدناهم هدى — الإيمان أول الطريق."
      en: "They were youths who believed in their Lord, and We increased them in guidance."
  - title: { ar: "الثبات على التوحيد", en: "Steadfast on tawhid" }
    ref: "الكهف 14"
    body:
      ar: "قاموا فقالوا ربنا رب السماوات والأرض — إعلان التوحيد في وجه الطغيان."
      en: "They stood and said: our Lord is the Lord of the heavens and earth."
  - title: { ar: "اللجوء إلى الكهف", en: "Retreat to the cave" }
    ref: "الكهف 10"
    body:
      ar: "إذ أوى الفتية إلى الكهف فقالوا ربنا آتنا من لدنك رحمة — الفرار بالدين."
      en: "When the youths retreated to the cave, they said: our Lord, grant us mercy."
  - title: { ar: "النوم الطويل", en: "The long sleep" }
    ref: "الكهف 11"
    body:
      ar: "فضربنا على آذانهم في الكهف سنين عددًا — آية من آيات الله."
      en: "We cast sleep upon them in the cave for many years — a sign of God."
  - title: { ar: "البعث من النوم", en: "Awakening" }
    ref: "الكهف 19"
    body:
      ar: "بعثناهم ليتساءلوا بينهم — فإذا بالزمن قد تغير والقوم قد آمنوا."
      en: "We raised them to question one another — time had passed and the people had believed."
  - title: { ar: "آية على البعث", en: "A sign of resurrection" }
    ref: "الكهف 21"
    body:
      ar: "أعثرنا عليهم ليعلموا أن وعد الله حق — قصتهم برهان على البعث."
      en: "We caused them to be found, that all might know God's promise is true."
facts:
  - { ar: "ناموا 309 سنوات.", en: "They slept 309 years." }
  - { ar: "كلبهم باسط ذراعيه بالوصيد.", en: "Their dog stretched its paws at the entrance." }
lessons:
  - { ar: "صحبة الصالحين تنجي.", en: "Righteous company saves." }
  - { ar: "الفرار بالدين عند الفتنة.", en: "Fleeing with one's faith at times of trial." }
  - { ar: "التوكل على الله في الشدائد.", en: "Trust in God through hardships." }
cautions:
  - ar: "لم يثبت في القرآن اسم المدينة ولا موضع الكهف ولا أسماء الفتية ولا عددهم على وجه القطع."
    en: "The Quran does not establish the city's name, the cave's location, or the youths' names and exact number."
khulasa:
  ar: "من آمن بالله واعتز بدينه كفاه الله — والثبات أول النصر."
  en: "Whoever believes in God and holds to their faith, God suffices them."
