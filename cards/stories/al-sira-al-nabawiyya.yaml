slug: al-sira-al-nabawiyya
title: { ar: "السيرة النبوية", en: "The Prophetic biography" }
lede:
  ar: "من المولد إلى الوفاة — أربع وعشرون محطة في حياة خير البرية."
  en: "From birth to passing — twenty-four stations in the best of creation's life."
source_card: 37d2ab45
status: { review: draft }
intro:
  ar: "حياة النبي من المولد في عام الفيل إلى الوفاة في المدينة — مختصرة في محطات."
  en: "The Prophet's life from birth in the Year of the Elephant to his passing in Madinah."
stations:
  - title: { ar: "المولد", en: "Birth" }
    ref: "عام الفيل"
    body: { ar: "وُلد في مكة عام الفيل.", en: "Born in Makkah in the Year of the Elephant." }
  - title: { ar: "الرضاعة", en: "Nursing" }
    ref: "البادية"
    body: { ar: "أرضعته حليمة السعدية في البادية.", en: "Nursed by Halima al-Sa'diyya in the desert." }
  - title: { ar: "كفالة جده وعمه", en: "Grandfather's and uncle's care" }
    ref: "مكة"
    body: { ar: "كفله جده عبد المطلب ثم عمه أبو طالب.", en: "Raised by his grandfather then his uncle Abu Talib." }
  - title: { ar: "التجارة", en: "Trade" }
    ref: "الشام"
    body: { ar: "تاجر بمال خديجة واشتهر بالأمانة.", en: "Traded with Khadija's wealth, famed for trustworthiness." }
  - title: { ar: "الزواج", en: "Marriage" }
    ref: "مكة"
    body: { ar: "تزوج خديجة بنت خويلد.", en: "Married Khadija bint Khuwaylid." }
  - title: { ar: "الوحي", en: "Revelation" }
    ref: "غار حراء"
    body: { ar: "نزل عليه الوحي في غار حراء: اقرأ.", en: "Revelation came in Hira: Read." }
  - title: { ar: "الدعوة سرًا", en: "Secret call" }
    ref: "مكة"
    body: { ar: "دعا سرًا ثلاث سنوات.", en: "Called secretly for three years." }
  - title: { ar: "الدعوة جهرًا", en: "Open call" }
    ref: "مكة"
    body: { ar: "صدع بالأمر على الصفا.", en: "Proclaimed openly on al-Safa." }
  - title: { ar: "الأذى", en: "Persecution" }
    ref: "مكة"
    body: { ar: "أوذي وأصحابه وصبر.", en: "He and his companions were harmed, and endured." }
  - title: { ar: "هجرة الحبشة", en: "Abyssinia migration" }
    ref: "الحبشة"
    body: { ar: "هاجر بعض أصحابه إلى الحبشة.", en: "Some companions migrated to Abyssinia." }
  - title: { ar: "عام الحزن", en: "Year of sorrow" }
    ref: "مكة"
    body: { ar: "توفي أبو طالب وخديجة.", en: "Abu Talib and Khadija passed away." }
  - title: { ar: "الإسراء والمعراج", en: "Isra' and Mi'raj" }
    ref: "مكة — القدس"
    body: { ar: "أُسري به إلى المسجد الأقصى وعُرج به إلى السماء.", en: "Taken by night to al-Aqsa, then ascended." }
  - title: { ar: "بيعتا العقبة", en: "The 'Aqaba pledges" }
    ref: "مكة"
    body: { ar: "بايعه أهل يثرب على النصرة.", en: "Yathrib's people pledged support." }
  - title: { ar: "الهجرة", en: "Hijra" }
    ref: "المدينة"
    body: { ar: "هاجر إلى المدينة وأسس الدولة.", en: "Migrated to Madinah and founded the state." }
  - title: { ar: "المؤاخاة والمسجد", en: "Brotherhood and mosque" }
    ref: "المدينة"
    body: { ar: "آخى بين المهاجرين والأنصار وبنى المسجد.", en: "Bonded Muhajirun and Ansar; built the mosque." }
  - title: { ar: "بدر", en: "Badr" }
    ref: "2هـ"
    body: { ar: "أول معركة كبرى — نصر مبين.", en: "First major battle — clear victory." }
  - title: { ar: "أحد", en: "Uhud" }
    ref: "3هـ"
    body: { ar: "ابتلاء وتعلم درس الطاعة.", en: "Trial and the lesson of obedience." }
  - title: { ar: "الخندق", en: "The Trench" }
    ref: "5هـ"
    body: { ar: "حفر الخندق وردّ الأحزاب.", en: "The trench dug; the confederates repelled." }
  - title: { ar: "الحديبية", en: "Hudaybiyya" }
    ref: "6هـ"
    body: { ar: "صلح الحديبية — فتح مبين.", en: "The treaty — a clear opening." }
  - title: { ar: "فتح مكة", en: "Conquest of Makkah" }
    ref: "8هـ"
    body: { ar: "دخل مكة فاتحًا عفوًا.", en: "Entered Makkah victorious and forgiving." }
  - title: { ar: "حجة الوداع", en: "Farewell pilgrimage" }
    ref: "10هـ"
    body: { ar: "خطبة الوداع وتمام الدين.", en: "The farewell sermon; religion completed." }
  - title: { ar: "المرض", en: "Illness" }
    ref: "المدينة"
    body: { ar: "مرض في بيت عائشة.", en: "Fell ill in 'A'isha's house." }
  - title: { ar: "الوفاة", en: "Passing" }
    ref: "11هـ"
    body: { ar: "توفي ودُفن في حجرته.", en: "Passed away and was buried in his chamber." }
  - title: { ar: "خلافة أبي بكر", en: "Abu Bakr's caliphate" }
    ref: "السقيفة"
    body: { ar: "بويع أبو بكر بالخلافة.", en: "Abu Bakr was pledged caliph." }
facts:
  - { ar: "عاش 63 سنة.", en: "Lived 63 years." }
  - { ar: "بُعث في الأربعين.", en: "Commissioned at forty." }
lessons:
  - { ar: "الصبر مفتاح النصر.", en: "Patience is victory's key." }
  - { ar: "الرحمة أساس الدعوة.", en: "Mercy is the call's foundation." }
cautions: []
khulasa:
  ar: "سيرته منهج حياة — من العبودية إلى التمكين بالرحمة والعدل."
  en: "His biography is a life's method — from servitude to empowerment through mercy and justice."
