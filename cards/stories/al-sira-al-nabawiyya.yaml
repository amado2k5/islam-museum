slug: al-sira-al-nabawiyya
title: { ar: "السيرة النبوية", en: "The Prophetic biography", fr: "La biographie prophétique" }
lede:
  ar: "من المولد إلى الوفاة — أربع وعشرون محطة في حياة خير البرية."
  en: "From birth to passing — twenty-four stations in the best of creation's life."
  fr: "De la naissance à la mort : vingt-quatre étapes de la vie de celui que la tradition considère comme le meilleur de la création."
source_card: 37d2ab45
status: { review: draft }
intro:
  ar: "حياة النبي من المولد في عام الفيل إلى الوفاة في المدينة — مختصرة في محطات."
  en: "The Prophet's life from birth in the Year of the Elephant to his passing in Madinah."
  fr: La vie du Prophète, de sa naissance pendant l’année de l’Éléphant à sa mort à Médine, résumée en étapes.
stations:
  - title: { ar: "المولد", en: "Birth", fr: "La naissance" }
    ref: "عام الفيل"
    body: { ar: "وُلد في مكة عام الفيل.", en: "Born in Makkah in the Year of the Elephant.", fr: "Il naît à La Mecque pendant l’année de l’Éléphant." }
  - title: { ar: "الرضاعة", en: "Nursing", fr: "L’allaitement" }
    ref: "البادية"
    body: { ar: "أرضعته حليمة السعدية في البادية.", en: "Nursed by Halima al-Sa'diyya in the desert.", fr: "Halima al-Sadiyya l’allaite dans le désert." }
  - title: { ar: "كفالة جده وعمه", en: "Grandfather's and uncle's care", fr: "La protection du grand-père et de l’oncle" }
    ref: "مكة"
    body: { ar: "كفله جده عبد المطلب ثم عمه أبو طالب.", en: "Raised by his grandfather then his uncle Abu Talib.", fr: "Son grand-père Abd al-Mouttalib, puis son oncle Abou Talib, prennent soin de lui." }
  - title: { ar: "التجارة", en: "Trade", fr: "Le commerce" }
    ref: "الشام"
    body: { ar: "تاجر بمال خديجة واشتهر بالأمانة.", en: "Traded with Khadija's wealth, famed for trustworthiness.", fr: "Il fait du commerce avec les biens de Khadija et se fait connaître pour son honnêteté." }
  - title: { ar: "الزواج", en: "Marriage", fr: "Le mariage" }
    ref: "مكة"
    body: { ar: "تزوج خديجة بنت خويلد.", en: "Married Khadija bint Khuwaylid.", fr: "Il épouse Khadija bint Khouwaylid." }
  - title: { ar: "الوحي", en: "Revelation", fr: "La révélation" }
    ref: "غار حراء"
    body: { ar: "نزل عليه الوحي في غار حراء: اقرأ.", en: "Revelation came in Hira: Read.", fr: "Le récit évoque les débuts de la révélation dans la grotte de Hira, avec un appel à la lecture." }
  - title: { ar: "الدعوة سرًا", en: "Secret call", fr: "L’appel discret" }
    ref: "مكة"
    body: { ar: "دعا سرًا ثلاث سنوات.", en: "Called secretly for three years.", fr: "Il prêche discrètement pendant trois ans." }
  - title: { ar: "الدعوة جهرًا", en: "Open call", fr: "L’appel public" }
    ref: "مكة"
    body: { ar: "صدع بالأمر على الصفا.", en: "Proclaimed openly on al-Safa.", fr: "Il proclame ouvertement son message sur le mont al-Safa." }
  - title: { ar: "الأذى", en: "Persecution", fr: "Les persécutions" }
    ref: "مكة"
    body: { ar: "أوذي وأصحابه وصبر.", en: "He and his companions were harmed, and endured.", fr: "Lui et ses compagnons subissent des persécutions et font preuve de patience." }
  - title: { ar: "هجرة الحبشة", en: "Abyssinia migration", fr: "L’émigration en Abyssinie" }
    ref: "الحبشة"
    body: { ar: "هاجر بعض أصحابه إلى الحبشة.", en: "Some companions migrated to Abyssinia.", fr: "Certains de ses compagnons émigrent en Abyssinie." }
  - title: { ar: "عام الحزن", en: "Year of sorrow", fr: "L’année de la tristesse" }
    ref: "مكة"
    body: { ar: "توفي أبو طالب وخديجة.", en: "Abu Talib and Khadija passed away.", fr: "Abou Talib et Khadija meurent." }
  - title: { ar: "الإسراء والمعراج", en: "Isra' and Mi'raj", fr: "Le voyage nocturne et l’ascension" }
    ref: "مكة — القدس"
    body: { ar: "أُسري به إلى المسجد الأقصى وعُرج به إلى السماء.", en: "Taken by night to al-Aqsa, then ascended.", fr: "Il est conduit de nuit à la mosquée al-Aqsa, puis s’élève vers le ciel." }
  - title: { ar: "بيعتا العقبة", en: "The 'Aqaba pledges", fr: "Les deux engagements d’al-Aqaba" }
    ref: "مكة"
    body: { ar: "بايعه أهل يثرب على النصرة.", en: "Yathrib's people pledged support.", fr: "Des habitants de Yathrib s’engagent à le soutenir." }
  - title: { ar: "الهجرة", en: "Hijra", fr: "L’Hégire" }
    ref: "المدينة"
    body: { ar: "هاجر إلى المدينة وأسس الدولة.", en: "Migrated to Madinah and founded the state.", fr: "Il émigre à Médine et y fonde l’État." }
  - title: { ar: "المؤاخاة والمسجد", en: "Brotherhood and mosque", fr: "La fraternisation et la mosquée" }
    ref: "المدينة"
    body: { ar: "آخى بين المهاجرين والأنصار وبنى المسجد.", en: "Bonded Muhajirun and Ansar; built the mosque.", fr: "Il établit des liens fraternels entre les Mouhajiroun et les Ansar et construit la mosquée." }
  - title: { ar: "بدر", en: "Badr", fr: "Badr" }
    ref: "2هـ"
    body: { ar: "أول معركة كبرى — نصر مبين.", en: "First major battle — clear victory.", fr: "La première grande bataille, marquée par une victoire nette." }
  - title: { ar: "أحد", en: "Uhud", fr: "Ouhoud" }
    ref: "3هـ"
    body: { ar: "ابتلاء وتعلم درس الطاعة.", en: "Trial and the lesson of obedience.", fr: "Une épreuve et une leçon sur l’obéissance." }
  - title: { ar: "الخندق", en: "The Trench", fr: "Le Fossé" }
    ref: "5هـ"
    body: { ar: "حفر الخندق وردّ الأحزاب.", en: "The trench dug; the confederates repelled.", fr: "Un fossé est creusé ; les coalisés sont repoussés." }
  - title: { ar: "الحديبية", en: "Hudaybiyya", fr: "Houdaybiya" }
    ref: "6هـ"
    body: { ar: "صلح الحديبية — فتح مبين.", en: "The treaty — a clear opening.", fr: "Le traité de Houdaybiya est présenté comme une ouverture décisive." }
  - title: { ar: "فتح مكة", en: "Conquest of Makkah", fr: "La conquête de La Mecque" }
    ref: "8هـ"
    body: { ar: "دخل مكة فاتحًا عفوًا.", en: "Entered Makkah victorious and forgiving.", fr: "Il entre victorieux à La Mecque et accorde son pardon." }
  - title: { ar: "حجة الوداع", en: "Farewell pilgrimage", fr: "Le pèlerinage d’adieu" }
    ref: "10هـ"
    body: { ar: "خطبة الوداع وتمام الدين.", en: "The farewell sermon; religion completed.", fr: "Le sermon d’adieu et l’achèvement de la religion." }
  - title: { ar: "المرض", en: "Illness", fr: "La maladie" }
    ref: "المدينة"
    body: { ar: "مرض في بيت عائشة.", en: "Fell ill in 'A'isha's house.", fr: "Il tombe malade dans la maison d’Aïcha." }
  - title: { ar: "الوفاة", en: "Passing", fr: "La mort" }
    ref: "11هـ"
    body: { ar: "توفي ودُفن في حجرته.", en: "Passed away and was buried in his chamber.", fr: "Il meurt et est enterré dans sa chambre." }
  - title: { ar: "خلافة أبي بكر", en: "Abu Bakr's caliphate", fr: "Le califat d’Abou Bakr" }
    ref: "السقيفة"
    body: { ar: "بويع أبو بكر بالخلافة.", en: "Abu Bakr was pledged caliph.", fr: "Abou Bakr reçoit l’allégeance comme calife." }
facts:
  - { ar: "عاش 63 سنة.", en: "Lived 63 years.", fr: "Il vit 63 ans." }
  - { ar: "بُعث في الأربعين.", en: "Commissioned at forty.", fr: "Il reçoit sa mission à quarante ans." }
lessons:
  - { ar: "الصبر مفتاح النصر.", en: "Patience is victory's key.", fr: "La patience est présentée comme une clé de la victoire." }
  - { ar: "الرحمة أساس الدعوة.", en: "Mercy is the call's foundation.", fr: "La miséricorde est au fondement de l’appel." }
cautions: []
khulasa:
  ar: "سيرته منهج حياة — من العبودية إلى التمكين بالرحمة والعدل."
  en: "His biography is a life's method — from servitude to empowerment through mercy and justice."
  fr: "Sa biographie est présentée comme un modèle de vie : de l’adoration à l’exercice de l’autorité, par la miséricorde et la justice."
