slug: al-sira-al-nabawiyya
title:
  ar: السيرة النبوية
  en: The Prophetic biography
  fr: La biographie prophétique
  tr: Peygamberlik Biyografisi
  id: Biografi Profetik
lede:
  ar: من المولد إلى الوفاة — أربع وعشرون محطة في حياة خير البرية.
  en: From birth to passing — twenty-four stations in the best of creation's life.
  fr: 'De la naissance à la mort : vingt-quatre étapes de la vie de celui que la tradition considère comme le meilleur de la création.'
  tr: Doğumdan ölüme kadar — vahşi doğanın iyiliği için yirmi dört durak.
  id: Dari lahir hingga mati — dua puluh empat stasiun dalam kehidupan kebaikan di alam liar.
source_card: 37d2ab45
status:
  review: draft
intro:
  ar: حياة النبي من المولد في عام الفيل إلى الوفاة في المدينة — مختصرة في محطات.
  en: The Prophet's life from birth in the Year of the Elephant to his passing in Madinah.
  fr: La vie du Prophète, de sa naissance pendant l’année de l’Éléphant à sa mort à Médine, résumée en étapes.
  tr: Peygamber'in Fil Yılı'ndaki doğumundan Medine'de ölümüne kadar olan hayatı — Duraklar bölümünde özetlenmiştir.
  id: Kehidupan Nabi dari lahir di Tahun Gajah hingga wafat di Madinah — dirangkum dalam Stations.
stations:
- title:
    ar: المولد
    en: Birth
    fr: La naissance
    tr: Doğum
    id: Kelahiran
  ref: عام الفيل
  body:
    ar: وُلد في مكة عام الفيل.
    en: Born in Makkah in the Year of the Elephant.
    fr: Il naît à La Mecque pendant l’année de l’Éléphant.
    tr: Mekke'de Fil Yılı'nda doğdu.
    id: Ia lahir di Mekah pada Tahun Gajah.
- title:
    ar: الرضاعة
    en: Nursing
    fr: L’allaitement
    tr: Emzirme
    id: menyusui
  ref: البادية
  body:
    ar: أرضعته حليمة السعدية في البادية.
    en: Nursed by Halima al-Sa'diyya in the desert.
    fr: Halima al-Sadiyya l’allaite dans le désert.
    tr: Çölde Halima Al-Saadiya tarafından emzirildi.
    id: Ia disusui oleh Halima Al-Saadiya di gurun.
- title:
    ar: كفالة جده وعمه
    en: Grandfather's and uncle's care
    fr: La protection du grand-père et de l’oncle
    tr: Büyükbabası ve amcasının sponsorluğu
    id: Sponsor dari kakek dan pamannya
  ref: مكة
  body:
    ar: كفله جده عبد المطلب ثم عمه أبو طالب.
    en: Raised by his grandfather then his uncle Abu Talib.
    fr: Son grand-père Abd al-Mouttalib, puis son oncle Abou Talib, prennent soin de lui.
    tr: Sponsorluğunu büyükbabası Abdul Muttalib, ardından amcası Abu Talib üstlendi.
    id: Ia disponsori oleh kakeknya Abdul Muttalib, kemudian oleh pamannya Abu Talib.
- title:
    ar: التجارة
    en: Trade
    fr: Le commerce
    tr: Ticaret
    id: Perdagangan
  ref: الشام
  body:
    ar: تاجر بمال خديجة واشتهر بالأمانة.
    en: Traded with Khadija's wealth, famed for trustworthiness.
    fr: Il fait du commerce avec les biens de Khadija et se fait connaître pour son honnêteté.
    tr: Hadijah'ın parasını takas etti ve güvenilirliğiyle ün kazandı.
    id: Ia menukar uang Khadijah dan menjadi terkenal karena kepercayaannya.
- title:
    ar: الزواج
    en: Marriage
    fr: Le mariage
    tr: Evlilik
    id: Pernikahan
  ref: مكة
  body:
    ar: تزوج خديجة بنت خويلد.
    en: Married Khadija bint Khuwaylid.
    fr: Il épouse Khadija bint Khouwaylid.
    tr: Khadija bint Khuwaylid ile evlendi.
    id: Ia menikah dengan Khadijah bint Khuwaylid.
- title:
    ar: الوحي
    en: Revelation
    fr: La révélation
    tr: vahiy
    id: wahyu
  ref: غار حراء
  body:
    ar: 'نزل عليه الوحي في غار حراء: اقرأ.'
    en: 'Revelation came in Hira: Read.'
    fr: Le récit évoque les débuts de la révélation dans la grotte de Hira, avec un appel à la lecture.
    tr: 'Vahiy, Hira Mağarası''nda üzerine çöktü: Oku.'
    id: 'Wahyu turun kepadanya di Gua Hira: Bacalah.'
- title:
    ar: الدعوة سرًا
    en: Secret call
    fr: L’appel discret
    tr: Davet gizli
    id: Undangannya rahasia
  ref: مكة
  body:
    ar: دعا سرًا ثلاث سنوات.
    en: Called secretly for three years.
    fr: Il prêche discrètement pendant trois ans.
    tr: Gizlice üç yıl aradı.
    id: Dia diam-diam menelepon selama tiga tahun.
- title:
    ar: الدعوة جهرًا
    en: Open call
    fr: L’appel public
    tr: Sesinizi Yükseltmek İçin Davet
    id: Undangan untuk Berbicara
  ref: مكة
  body:
    ar: صدع بالأمر على الصفا.
    en: Proclaimed openly on al-Safa.
    fr: Il proclame ouvertement son message sur le mont al-Safa.
    tr: Konuyu açık tarafta açtı.
    id: Dia memecahkan masalah ini dengan jelas.
- title:
    ar: الأذى
    en: Persecution
    fr: Les persécutions
    tr: Zarar
    id: Bahaya
  ref: مكة
  body:
    ar: أوذي وأصحابه وصبر.
    en: He and his companions were harmed, and endured.
    fr: Lui et ses compagnons subissent des persécutions et font preuve de patience.
    tr: Ve yoldaşlarına zarar verdi ve sabırlıydı.
    id: Dia menyakiti dan teman-temannya serta sabar.
- title:
    ar: هجرة الحبشة
    en: Abyssinia migration
    fr: L’émigration en Abyssinie
    tr: Habeşistan Göçü
    id: Migrasi Abyssinia
  ref: الحبشة
  body:
    ar: هاجر بعض أصحابه إلى الحبشة.
    en: Some companions migrated to Abyssinia.
    fr: Certains de ses compagnons émigrent en Abyssinie.
    tr: Bazı arkadaşları Habeşistan'a göç etti.
    id: Beberapa rekannya bermigrasi ke Abyssinia.
- title:
    ar: عام الحزن
    en: Year of sorrow
    fr: L’année de la tristesse
    tr: Keder Yılı
    id: Tahun Duka
  ref: مكة
  body:
    ar: توفي أبو طالب وخديجة.
    en: Abu Talib and Khadija passed away.
    fr: Abou Talib et Khadija meurent.
    tr: Ebu Talib ve Hatice öldü.
    id: Abu Talib dan Khadijah meninggal.
- title:
    ar: الإسراء والمعراج
    en: Isra' and Mi'raj
    fr: Le voyage nocturne et l’ascension
    tr: İsra ve Mi'raj
    id: Isra dan Mi'raj
  ref: مكة — القدس
  body:
    ar: أُسري به إلى المسجد الأقصى وعُرج به إلى السماء.
    en: Taken by night to al-Aqsa, then ascended.
    fr: Il est conduit de nuit à la mosquée al-Aqsa, puis s’élève vers le ciel.
    tr: Mescid-i Aksa Camii'ne bir yolculuğa çıkarıldı ve gökyüzüne yükseldi.
    id: Ia dibawa dalam perjalanan ke Masjid Al-Aqsa dan naik ke langit.
- title:
    ar: بيعتا العقبة
    en: The 'Aqaba pledges
    fr: Les deux engagements d’al-Aqaba
    tr: Akabe İndirimi
    id: Penjualan Aqaba
  ref: مكة
  body:
    ar: بايعه أهل يثرب على النصرة.
    en: Yathrib's people pledged support.
    fr: Des habitants de Yathrib s’engagent à le soutenir.
    tr: Yathrib halkı zafer için ona bağlılık yemini etti.
    id: Rakyat Yathrib bersumpah setia kepadanya demi kemenangan.
- title:
    ar: الهجرة
    en: Hijra
    fr: L’Hégire
    tr: Göç
    id: Migrasi
  ref: المدينة
  body:
    ar: هاجر إلى المدينة وأسس الدولة.
    en: Migrated to Madinah and founded the state.
    fr: Il émigre à Médine et y fonde l’État.
    tr: Şehre göç etti ve eyaleti kurdu.
    id: Ia bermigrasi ke kota tersebut dan mendirikan negara bagian tersebut.
- title:
    ar: المؤاخاة والمسجد
    en: Brotherhood and mosque
    fr: La fraternisation et la mosquée
    tr: Kardeşlik ve cami
    id: Persaudaraan dan masjid
  ref: المدينة
  body:
    ar: آخى بين المهاجرين والأنصار وبنى المسجد.
    en: Bonded Muhajirun and Ansar; built the mosque.
    fr: Il établit des liens fraternels entre les Mouhajiroun et les Ansar et construit la mosquée.
    tr: Mühacirun ile Ensar arasında kardeşlik kurdu ve camiyi inşa etti.
    id: Ia menjalin persaudaraan antara Muhajirun dan Ansar serta membangun masjid tersebut.
- title:
    ar: بدر
    en: Badr
    fr: Badr
    tr: Badr
    id: Badr
  ref: 2هـ
  body:
    ar: أول معركة كبرى — نصر مبين.
    en: First major battle — clear victory.
    fr: La première grande bataille, marquée par une victoire nette.
    tr: İlk büyük savaş — net bir zafer.
    id: Pertempuran besar pertama — kemenangan yang jelas.
- title:
    ar: أحد
    en: Uhud
    fr: Ouhoud
    tr: Pazar
    id: Minggu
  ref: 3هـ
  body:
    ar: ابتلاء وتعلم درس الطاعة.
    en: Trial and the lesson of obedience.
    fr: Une épreuve et une leçon sur l’obéissance.
    tr: Deneme ve itaat dersini öğrenmek.
    id: Ujian dan belajar pelajaran tentang ketaatan.
- title:
    ar: الخندق
    en: The Trench
    fr: Le Fossé
    tr: Siper
    id: Parit
  ref: 5هـ
  body:
    ar: حفر الخندق وردّ الأحزاب.
    en: The trench dug; the confederates repelled.
    fr: Un fossé est creusé ; les coalisés sont repoussés.
    tr: Siper kazıldı ve taraflar döndü.
    id: Menggali parit dan rombongan pun berbalik.
- title:
    ar: الحديبية
    en: Hudaybiyya
    fr: Houdaybiya
    tr: Hudaybiyyah
    id: Hudaybiyyah
  ref: 6هـ
  body:
    ar: صلح الحديبية — فتح مبين.
    en: The treaty — a clear opening.
    fr: Le traité de Houdaybiya est présenté comme une ouverture décisive.
    tr: Hudaybiyyah Antlaşması — açık bir fetih.
    id: Perjanjian Hudaybiyyah — sebuah penaklukan yang jelas.
- title:
    ar: فتح مكة
    en: Conquest of Makkah
    fr: La conquête de La Mecque
    tr: Mekke'nin Fethi
    id: Penaklukan Mekah
  ref: 8هـ
  body:
    ar: دخل مكة فاتحًا عفوًا.
    en: Entered Makkah victorious and forgiving.
    fr: Il entre victorieux à La Mecque et accorde son pardon.
    tr: Mekke'ye bir fatih olarak girdi, affedersiniz.
    id: Dia masuk ke Mekah sebagai penakluk, permisi.
- title:
    ar: حجة الوداع
    en: Farewell pilgrimage
    fr: Le pèlerinage d’adieu
    tr: Veda Mazereti
    id: Alasan Perpisahan
  ref: 10هـ
  body:
    ar: خطبة الوداع وتمام الدين.
    en: The farewell sermon; religion completed.
    fr: Le sermon d’adieu et l’achèvement de la religion.
    tr: Veda Vaazı ve Dinin Bütünlüğü.
    id: Khotbah Perpisahan dan Kelengkapan Agama.
- title:
    ar: المرض
    en: Illness
    fr: La maladie
    tr: Hastalık
    id: Penyakit
  ref: المدينة
  body:
    ar: مرض في بيت عائشة.
    en: Fell ill in 'A'isha's house.
    fr: Il tombe malade dans la maison d’Aïcha.
    tr: Aisha'nın evinde hastalık.
    id: Sakit di rumah Aisha.
- title:
    ar: الوفاة
    en: Passing
    fr: La mort
    tr: Ölüm
    id: Kematian
  ref: 11هـ
  body:
    ar: توفي ودُفن في حجرته.
    en: Passed away and was buried in his chamber.
    fr: Il meurt et est enterré dans sa chambre.
    tr: Öldü ve odasına defnedildi.
    id: Ia meninggal dan dimakamkan di kamarnya.
- title:
    ar: خلافة أبي بكر
    en: Abu Bakr's caliphate
    fr: Le califat d’Abou Bakr
    tr: Ebu Bekir Halifeliği
    id: Khalifahan Abu Bakr
  ref: السقيفة
  body:
    ar: بويع أبو بكر بالخلافة.
    en: Abu Bakr was pledged caliph.
    fr: Abou Bakr reçoit l’allégeance comme calife.
    tr: Ebu Bekir halifeliğe bağlılık yemini etti.
    id: Abu Bakr bersumpah setia kepada kekhalifahan.
facts:
- ar: عاش 63 سنة.
  en: Lived 63 years.
  fr: Il vit 63 ans.
  tr: 63 yıl yaşadı.
  id: Ia hidup selama 63 tahun.
- ar: بُعث في الأربعين.
  en: Commissioned at forty.
  fr: Il reçoit sa mission à quarante ans.
  tr: Kırk yaşında gönderildi.
  id: Ia dikirim pada usia empat puluh tahun.
lessons:
- ar: الصبر مفتاح النصر.
  en: Patience is victory's key.
  fr: La patience est présentée comme une clé de la victoire.
  tr: Sabır zaferin anahtarıdır.
  id: Kesabaran adalah kunci kemenangan.
- ar: الرحمة أساس الدعوة.
  en: Mercy is the call's foundation.
  fr: La miséricorde est au fondement de l’appel.
  tr: Merhamet, çağrının temelidir.
  id: Belas kasihan adalah dasar dari panggilan itu.
cautions: []
khulasa:
  ar: سيرته منهج حياة — من العبودية إلى التمكين بالرحمة والعدل.
  en: His biography is a life's method — from servitude to empowerment through mercy and justice.
  fr: 'Sa biographie est présentée comme un modèle de vie : de l’adoration à l’exercice de l’autorité, par la miséricorde et la justice.'
  tr: Biyografisi bir yaşam biçimi — kölelikten merhamet ve adalet yoluyla güçlenmeye kadar.
  id: Biografinya adalah sebuah cara hidup — dari perbudakan hingga pemberdayaan melalui belas kasih dan keadilan.
