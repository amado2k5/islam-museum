slug: nasl-nuh
title: { ar: "نسل نوح", en: "The progeny of Nuh" }
lede:
  ar: "سام وحام ويافث — أنساب البشرية بعد الطوفان."
  en: "Sam, Ham and Japheth — humanity's lineages after the Flood."
source_card: 793c6d2e
status: { review: draft }
intro:
  ar: "بعد الطوفان، تناسلت البشرية من أبناء نوح الثلاثة."
  en: "After the Flood, humanity descended from Nuh's three sons."
stations:
  - title: { ar: "الطوفان", en: "The Flood" }
    ref: "هود 40"
    body:
      ar: "نجا نوح ومن معه في السفينة."
      en: "Nuh and those with him were saved in the Ark."
  - title: { ar: "سام", en: "Sam" }
    ref: "الأنساب"
    body:
      ar: "من نسله العرب وبنو إسرائيل والفرس — أهل الشرق."
      en: "From him: Arabs, Israelites, Persians — the East."
  - title: { ar: "حام", en: "Ham" }
    ref: "الأنساب"
    body:
      ar: "من نسله أهل أفريقيا — المصريون والنوبة والحبشة."
      en: "From him: the peoples of Africa."
  - title: { ar: "يافث", en: "Japheth" }
    ref: "الأنساب"
    body:
      ar: "من نسله الترك والروم ويأجوج ومأجوج — أهل الشمال."
      en: "From him: Turks, Romans, Gog and Magog — the North."
facts:
  - { ar: "الأنساب التفصيلية من الإسرائيليات.", en: "Detailed genealogies come from Isra'iliyyat." }
lessons:
  - { ar: "البشرية كلها من أب واحد.", en: "All humanity from one father." }
cautions:
  - ar: "تفاصيل الأنساب بعد الطوفان من الإسرائيليات — تُروى ولا تُعتقد."
    en: "Post-Flood genealogical details are Isra'iliyyat — narrated, not believed."
khulasa:
  ar: "يا أيها الناس إنا خلقناكم من ذكر وأنثى."
  en: "O mankind, We created you from male and female."
