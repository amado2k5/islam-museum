slug: nasl-nuh
title:
  ar: نسل نوح
  en: The progeny of Nuh
  fr: La descendance de Noé
  tr: Nuh'un Soyu
  id: Garis Keturunan Nuh
lede:
  ar: سام وحام ويافث — أنساب البشرية بعد الطوفان.
  en: Sam, Ham and Japheth — humanity's lineages after the Flood.
  fr: 'Sem, Cham et Japhet : les généalogies humaines après le Déluge.'
  tr: Sam, Ham ve Yafet — tufandan sonraki insanlığın soyağacı.
  id: Sam, Ham, dan Yafet — silsilah umat manusia setelah banjir.
source_card: 793c6d2e
status:
  review: draft
intro:
  ar: بعد الطوفان، تناسلت البشرية من أبناء نوح الثلاثة.
  en: After the Flood, humanity descended from Nuh's three sons.
  fr: Selon le récit, l’humanité descend après le Déluge des trois fils de Noé.
  tr: Tufandan sonra, insanlık Nuh'un üç oğlundan doğdu.
  id: Setelah banjir, umat manusia lahir dari tiga putra Nuh.
stations:
- title:
    ar: الطوفان
    en: The Flood
    fr: Le Déluge
    tr: Sel
    id: Banjir
  ref: هود 40
  body:
    ar: نجا نوح ومن معه في السفينة.
    en: Nuh and those with him were saved in the Ark.
    fr: Noé et ceux qui l’accompagnent sont sauvés dans l’arche.
    tr: Nuh ve gemide onunla birlikteler hayatta kaldı.
    id: Nuh dan orang-orang yang bersamanya di bahtera selamat.
- title:
    ar: سام
    en: Sam
    fr: Sem
    tr: Sam
    id: Sam
  ref: الأنساب
  body:
    ar: من نسله العرب وبنو إسرائيل والفرس — أهل الشرق.
    en: 'From him: Arabs, Israelites, Persians — the East.'
    fr: La tradition lui rattache les Arabes, les Israélites et les Perses, peuples de l’Orient.
    tr: Onun soyundan Araplar, İsrailoğulları ve Doğu'nun halkı olan Persler vardı.
    id: Dari garis keturunannya adalah orang Arab, Anak-anak Israel, dan Persia — orang-orang Timur.
- title:
    ar: حام
    en: Ham
    fr: Cham
    tr: Jambon
    id: Ham
  ref: الأنساب
  body:
    ar: من نسله أهل أفريقيا — المصريون والنوبة والحبشة.
    en: 'From him: the peoples of Africa.'
    fr: La tradition lui rattache les peuples d’Afrique, notamment les Égyptiens, les Nubiens et les Abyssins.
    tr: Onun soyundan gelen Afrika halkı — Mısırlılar, Nubiyalılar ve Habeşistan'dan oluşmuştur.
    id: Dari keturunannya terdapat orang-orang Afrika — Mesir, Nubia, dan Abyssinia.
- title:
    ar: يافث
    en: Japheth
    fr: Japhet
    tr: Yafet
    id: Yafet
  ref: الأنساب
  body:
    ar: من نسله الترك والروم ويأجوج ومأجوج — أهل الشمال.
    en: 'From him: Turks, Romans, Gog and Magog — the North.'
    fr: La tradition lui rattache les Turcs, les Romains, Gog et Magog, peuples du Nord.
    tr: Onun soyundan Türkler, Romalılar, Gog ve Magog — kuzeyin halkı vardı.
    id: Dari garis keturunannya adalah bangsa Turki, Romawi, Gog, dan Magog — orang-orang di utara.
facts:
- ar: الأنساب التفصيلية من الإسرائيليات.
  en: Detailed genealogies come from Isra'iliyyat.
  fr: Les généalogies détaillées viennent des israiliyyat, récits issus des traditions israélites.
  tr: İsrail'iliyyat'ın ayrıntılı soy ağacı.
  id: Silsilah rinci Isra'iliyyat.
lessons:
- ar: البشرية كلها من أب واحد.
  en: All humanity from one father.
  fr: L’humanité entière est rattachée à un même père.
  tr: Tüm insanlık tek bir babadan türemiştir.
  id: Seluruh umat manusia berasal dari satu ayah.
cautions:
- ar: تفاصيل الأنساب بعد الطوفان من الإسرائيليات — تُروى ولا تُعتقد.
  en: Post-Flood genealogical details are Isra'iliyyat — narrated, not believed.
  fr: 'Les détails des généalogies après le Déluge relèvent des israiliyyat : ils se transmettent sans constituer un article de foi.'
  tr: İsrailoğullarının selinden sonraki soybilimsel detaylar — anlatıldı ama inanılmadı.
  id: Detail silsilah setelah banjir orang Israel — diceritakan dan tidak dipercaya.
khulasa:
  ar: يا أيها الناس إنا خلقناكم من ذكر وأنثى.
  en: O mankind, We created you from male and female.
  fr: Le verset évoque l’origine commune de l’humanité, issue d’un homme et d’une femme.
  tr: Ey insanlar, gerçekten de sizi erkek ve dişiden yarattık.
  id: Wahai manusia, memang Kami telah menciptakanmu dari laki-laki dan perempuan.
