slug: qisas-al-istighfar
title:
  ar: قصص الاستغفار
  en: Stories of istighfar
  fr: Récits sur la demande de pardon
  tr: Affedilme hikayeleri
  id: Kisah mencari pengampunan
lede:
  ar: ثلاث قصص في فضل الاستغفار — من نجا به ومن فُتح له به.
  en: Three stories on istighfar's virtue — who was saved and who was opened to.
  fr: 'Trois récits sur les mérites de la demande de pardon : salut et ouvertures.'
  tr: Affetmeyi aramanın erdemi üzerine üç hikaye — affedilme ile kurtulanlar ve onu açanlar.
  id: Tiga cerita tentang kebajikan mencari pengampunan — mereka yang diselamatkan olehnya dan mereka yang membukanya.
source_card: 710529ed
status:
  review: draft
intro:
  ar: الاستغفار مفتاح الفرج — قصص من أقره الواقع.
  en: Istighfar is relief's key — stories from lived experience.
  fr: La demande de pardon est présentée comme une clé du soulagement à travers des récits d’expérience.
  tr: 'Affetmeyi Aramak: Rahatlamanın Anahtarı — Gerçekliği Kabullenenlerin Hikayeleri.'
  id: 'Mencari Pengampunan: Kunci Kelegaan — Kisah Mereka yang Menerima Kenyataan.'
stations:
- title:
    ar: يونس في بطن الحوت
    en: Yunus in the whale
    fr: Jonas dans le ventre du poisson
    tr: Yunus balinanın karnında
    id: Yunus di perut paus
  ref: الأنبياء 87
  body:
    ar: فنادى في الظلمات أن لا إله إلا أنت سبحانك — فنجاه الله.
    en: 'He called in the darkness: none worthy but You — and God saved him.'
    fr: Le verset évoque l’invocation de Jonas dans les ténèbres et le salut que Dieu lui accorde.
    tr: Karanlıkta seslendi, 'Tanrı yok, sana şan olsun'—ve Tanrı onu kurtardı.
    id: Dia berseru dalam kegelapan, 'Tidak ada tuhan selain Engkau, kemuliaan bagi-Mu'—dan Allah menyelamatkannya.
- title:
    ar: قوم نوح
    en: Nuh's people
    fr: Le peuple de Noé
    tr: Nuh'un halkı
    id: Bangsa Nuh
  ref: نوح 10–12
  body:
    ar: فقلت استغفروا ربكم إنه كان غفارًا يرسل السماء عليكم مدرارًا.
    en: '''Seek your Lord''s forgiveness — He sends the sky upon you in showers.'''
    fr: Les versets évoquent l’appel de Noé à demander pardon et l’annonce d’une pluie abondante.
    tr: Ben de dedim ki, 'Rabbinden af dile; gerçekten de O her zaman affeder, üzerinize gökyüzü bolca gönderir.'
    id: Jadi aku berkata, 'Mintalah ampun kepada Tuhanmu; sesungguhnya, Dia selalu Pengampun, Dia mengirimkan langit kepadamu dengan melimpah.'
- title:
    ar: الرزق والفرج
    en: Provision and relief
    fr: Les subsistances et le soulagement
    tr: Geçim ve yardım
    id: Penghidupan dan bantuan
  ref: الاستغفار
  body:
    ar: من لزم الاستغفار جعل الله له من كل هم فرجًا ورزقه من حيث لا يحتسب.
    en: 'Whoever holds to istighfar: God makes every anxiety a relief and provides whence unimagined.'
    fr: Le récit associe la demande persévérante de pardon au soulagement des soucis et à des subsistances inattendues.
    tr: Bağışlanma dilemeye devam eden, Allah ona beklemediği her dert ve erzaktan kurtuluş verecektir.
    id: Siapa pun yang terus berusaha mencari pengampunan, Allah akan memberinya kelegaan dari segala kekhawatiran dan ketentuan yang tidak dia duga.
  evidence:
  - source: رواه أبو داود وابن ماجه
    note: مراجعة التخريج والدرجة
facts:
- ar: 'سيد الاستغفار: اللهم أنت ربي.'
  en: 'The master of istighfar begins: O God, You are my Lord.'
  fr: L’invocation dite maîtresse des demandes de pardon s’ouvre par la reconnaissance de Dieu comme Seigneur.
  tr: 'Bağışlama ustası: Ey Allah, Sen benim Rabbimsin.'
  id: 'Guru dalam mencari pengampunan: Ya Allah, Engkau adalah Tuhanku.'
lessons:
- ar: الاستغفار في الشدة والرخاء.
  en: Istighfar in hardship and ease.
  fr: Demander pardon dans l’épreuve comme dans l’aisance.
  tr: Zorluk ve refah zamanlarında af aramak.
  id: Mencari pengampunan di masa kesulitan dan kemakmuran.
cautions: []
khulasa:
  ar: استغفر تجد الفرج — فقلت استغفروا ربكم.
  en: Seek forgiveness and find relief.
  fr: Le récit associe demande de pardon et soulagement, en rappelant l’appel de Noé à son peuple.
  tr: Affet, rahatlama bulacaksın — ben de öyle dedim, Rabbinden af dile.
  id: Carilah pengampunan, kamu akan menemukan kelegaan — seperti yang aku katakan, mintalah pengampunan dari Tuhanmu.
