slug: qisas-al-istighfar
title: { ar: "قصص الاستغفار", en: "Stories of istighfar" }
lede:
  ar: "ثلاث قصص في فضل الاستغفار — من نجا به ومن فُتح له به."
  en: "Three stories on istighfar's virtue — who was saved and who was opened to."
source_card: 710529ed
status: { review: draft }
intro:
  ar: "الاستغفار مفتاح الفرج — قصص من أقره الواقع."
  en: "Istighfar is relief's key — stories from lived experience."
stations:
  - title: { ar: "يونس في بطن الحوت", en: "Yunus in the whale" }
    ref: "الأنبياء 87"
    body:
      ar: "فنادى في الظلمات أن لا إله إلا أنت سبحانك — فنجاه الله."
      en: "He called in the darkness: none worthy but You — and God saved him."
  - title: { ar: "قوم نوح", en: "Nuh's people" }
    ref: "نوح 10–12"
    body:
      ar: "فقلت استغفروا ربكم إنه كان غفارًا يرسل السماء عليكم مدرارًا."
      en: "'Seek your Lord's forgiveness — He sends the sky upon you in showers.'"
  - title: { ar: "الرزق والفرج", en: "Provision and relief" }
    ref: "الاستغفار"
    body:
      ar: "من لزم الاستغفار جعل الله له من كل هم فرجًا ورزقه من حيث لا يحتسب."
      en: "Whoever holds to istighfar: God makes every anxiety a relief and provides whence unimagined."
    evidence:
      - { source: "رواه أبو داود وابن ماجه", note: "مراجعة التخريج والدرجة" }
facts:
  - { ar: "سيد الاستغفار: اللهم أنت ربي.", en: "The master of istighfar begins: O God, You are my Lord." }
lessons:
  - { ar: "الاستغفار في الشدة والرخاء.", en: "Istighfar in hardship and ease." }
cautions: []
khulasa:
  ar: "استغفر تجد الفرج — فقلت استغفروا ربكم."
  en: "Seek forgiveness and find relief."
