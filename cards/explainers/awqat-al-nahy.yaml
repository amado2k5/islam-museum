slug: awqat-al-nahy
title:
  ar: الأوقات المنهي عن الصلاة فيها
  en: Times when prayer is forbidden
  fr: Les moments où la prière est déconseillée
  tr: Namaz için yasak zamanlar
  id: Waktu terlarang untuk berdoa
lede:
  ar: خمسة أوقات تُكره فيها النافلة — مع الاستثناءات.
  en: Five times when voluntary prayer is disliked — with the exceptions.
  fr: Cinq moments où la prière surérogatoire est déconseillée, avec leurs exceptions.
  tr: Gönüllü duaların isteksiz olduğu beş kez — istisnalar dışında.
  id: Lima kali ketika doa sukarela tidak disukai — dengan pengecualian.
source_card: 1898620f
status:
  review: draft
widget: stepper
steps:
- q:
    ar: ما الأوقات المنهي عنها؟
    en: What are the forbidden times?
    fr: Quels sont ces moments ?
    tr: Yasaklanan zamanlar nelerdir?
    id: Kapan waktu yang dilarang?
  a:
    ar: من بعد صلاة الفجر حتى تطلع الشمس، وعند طلوعها حتى ترتفع، وعند استواء الشمس حتى تزول، ومن بعد العصر حتى تغرب الشمس، وعند غروبها حتى يتم.
    en: After Fajr until sunrise, at sunrise until it rises, at noon until it passes zenith, after 'Asr until sunset, and at sunset until complete.
    fr: Après la prière du fajr jusqu’au lever du soleil ; pendant son lever jusqu’à ce qu’il s’élève ; lorsqu’il est au zénith jusqu’à son déclin ; après l’asr jusqu’au coucher ; et pendant son coucher
      jusqu’à sa disparition.
    tr: Fecr namazından sonra güneş doğana kadar, gün doğduğunda güneş doğunca ve güneş eşitlendikten sonra, batana kadar, Asr'dan sonra batana kadar ve gün batımından sonra tamamlanana kadar yapılır.
    id: Dari setelah shalat Fajr sampai matahari terbit, dan saat terbit sampai terbit, dan setelah matahari menjadi siang, sampai terbenam, dan setelah Asr sampai terbenam, dan saat matahari terbenam sampai
      selesai.
  evidence:
  - source: متفق عليه
    note: مراجعة اللفظ
- q:
    ar: ما الحكمة؟
    en: What is the wisdom?
    fr: Quelle raison est avancée ?
    tr: Bilgelik nedir?
    id: Apa itu kebijaksanaan?
  a:
    ar: مخالفة من يسجدون للشمس عند طلوعها وغروبها.
    en: To differ from those who prostrate to the sun at its rising and setting.
    fr: Se distinguer de ceux qui se prosternent devant le soleil à son lever et à son coucher.
    tr: Güneşin doğuşunda ve batarken secde edenlerin aksine.
    id: Berbeda dengan mereka yang bersujud pada matahari saat terbit dan terbenam.
- q:
    ar: وما المستثنى؟
    en: What is excepted?
    fr: Quelles sont les exceptions ?
    tr: Neler muaf tutulur?
    id: Apa yang dikecualikan?
  a:
    ar: الفوائت تُقضى في أي وقت، وتحية المسجد وصلاة الكسوف ونحوها من ذوات الأسباب عند كثير من العلماء.
    en: Missed prayers are made up anytime; mosque-greeting, eclipse prayer and the like are excepted by many scholars.
    fr: Les prières manquées se rattrapent à tout moment ; de nombreux savants exceptent aussi les prières liées à une cause, comme la salutation de la mosquée et la prière de l’éclipse.
    tr: Kaçırılan namazlar her zaman kılınır ve camiyi selamlamak, tutulma namazı yapmak ve benzeri eylemler birçok alim tarafından geçerli nedenler olarak kabul edilir.
    id: Shalat yang terlewat dilakukan kapan saja, dan menyapa masjid, melakukan shalat gerhana, dan tindakan serupa dianggap sebagai alasan yang sah menurut banyak ulama.
cautions:
- ar: التفاصيل الفقهية فيها خلاف؛ هذا عرض عام.
  en: Fiqh details differ; this is a general overview.
  fr: Les détails juridiques font l’objet de divergences ; il s’agit ici d’un aperçu général.
  tr: Hukuki ayrıntılar konusunda anlaşmazlık var; bu genel bir sunumdur.
  id: Ada perbedaan pendapat mengenai rincian yurisprudensi; ini adalah penyajian umum.
