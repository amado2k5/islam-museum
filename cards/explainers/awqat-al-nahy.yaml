slug: awqat-al-nahy
title: { ar: "الأوقات المنهي عن الصلاة فيها", en: "Times when prayer is forbidden" }
lede:
  ar: "خمسة أوقات تُكره فيها النافلة — مع الاستثناءات."
  en: "Five times when voluntary prayer is disliked — with the exceptions."
source_card: 1898620f
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما الأوقات المنهي عنها؟", en: "What are the forbidden times?" }
    a:
      ar: "من بعد صلاة الفجر حتى تطلع الشمس، وعند طلوعها حتى ترتفع، وعند استواء الشمس حتى تزول، ومن بعد العصر حتى تغرب الشمس، وعند غروبها حتى يتم."
      en: "After Fajr until sunrise, at sunrise until it rises, at noon until it passes zenith, after 'Asr until sunset, and at sunset until complete."
    evidence:
      - { source: "متفق عليه", note: "مراجعة اللفظ" }
  - q: { ar: "ما الحكمة؟", en: "What is the wisdom?" }
    a:
      ar: "مخالفة من يسجدون للشمس عند طلوعها وغروبها."
      en: "To differ from those who prostrate to the sun at its rising and setting."
  - q: { ar: "وما المستثنى؟", en: "What is excepted?" }
    a:
      ar: "الفوائت تُقضى في أي وقت، وتحية المسجد وصلاة الكسوف ونحوها من ذوات الأسباب عند كثير من العلماء."
      en: "Missed prayers are made up anytime; mosque-greeting, eclipse prayer and the like are excepted by many scholars."
cautions:
  - ar: "التفاصيل الفقهية فيها خلاف؛ هذا عرض عام."
    en: "Fiqh details differ; this is a general overview."
