slug: ghiras-al-janna
title: { ar: "غِراس الجنة", en: "Seedlings of Paradise" }
lede:
  ar: "ما تغرسه اليوم تحصده غدًا — الغرس الصالح وثماره."
  en: "What you plant today you harvest tomorrow — righteous planting and its fruits."
source_card: f2da5251
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما معنى غراس الجنة؟", en: "What are Paradise's seedlings?" }
    a:
      ar: "الأعمال الصالحة التي يغرسها العبد في الدنيا لتثمر له في الآخرة."
      en: "The righteous deeds one plants in this world to harvest in the next."
  - q: { ar: "وما أمثلتها؟", en: "What are examples?" }
    a:
      ar: "الذكر، والصدقة الجارية، والعلم النافع، وتربية الأبناء على الإيمان، وقضاء حوائج الناس."
      en: "Dhikr, ongoing charity, beneficial knowledge, raising children in faith, fulfilling people's needs."
  - q: { ar: "وما ثمارها؟", en: "And their fruits?" }
    a:
      ar: "الطمأنينة في الدنيا، والنور في القبر، والدرجات العلى في الجنة."
      en: "Tranquility in this world, light in the grave, high ranks in Paradise."
  - q: { ar: "وما الغرس الخبيث؟", en: "And the evil planting?" }
    a:
      ar: "الذنوب والمعاصي غراس النار — والاستغفار والتوبة يقتلعانها."
      en: "Sins are the seedlings of Fire — istighfar and repentance uproot them."
