slug: ghiras-al-janna
title:
  ar: غِراس الجنة
  en: Seedlings of Paradise
  fr: Les plantations du Paradis
  tr: Paradise Plantasyonu
  id: Perkebunan Surga
lede:
  ar: ما تغرسه اليوم تحصده غدًا — الغرس الصالح وثماره.
  en: What you plant today you harvest tomorrow — righteous planting and its fruits.
  fr: 'Planter aujourd’hui pour récolter demain : les bonnes œuvres et leurs fruits.'
  tr: Bugün ekerseniz, yarın biçeceksiniz — iyi ekimi ve meyvesi.
  id: Apa yang Anda tanam hari ini, akan Anda panen besok — penanaman yang baik dan buahnya.
source_card: f2da5251
status:
  review: draft
widget: stepper
steps:
- q:
    ar: ما معنى غراس الجنة؟
    en: What are Paradise's seedlings?
    fr: Que signifie l’expression « plantations du Paradis » ?
    tr: '''Cennet Dikimi'' ne anlama gelir?'
    id: Apa arti 'Paradise Planting'?
  a:
    ar: الأعمال الصالحة التي يغرسها العبد في الدنيا لتثمر له في الآخرة.
    en: The righteous deeds one plants in this world to harvest in the next.
    fr: Les bonnes œuvres accomplies en ce monde, dont les fruits sont attendus dans l’au-delà.
    tr: Bir hizmetçinin bu dünyada kendisi için ahirette meyve vermesi için ektiği doğru işlerdir.
    id: Perbuatan benar yang ditanam seorang hamba di dunia ini untuk menghasilkan buah baginya di akhirat.
- q:
    ar: وما أمثلتها؟
    en: What are examples?
    fr: Quels exemples en donne-t-on ?
    tr: Peki onların örnekleri nelerdir?
    id: Dan apa saja contoh mereka?
  a:
    ar: الذكر، والصدقة الجارية، والعلم النافع، وتربية الأبناء على الإيمان، وقضاء حوائج الناس.
    en: Dhikr, ongoing charity, beneficial knowledge, raising children in faith, fulfilling people's needs.
    fr: Le rappel de Dieu, la charité durable, le savoir utile, l’éducation des enfants dans la foi et l’aide apportée aux autres.
    tr: Anma, sürekli hayırseverlik, faydalı bilgi, çocukları inançla yetiştirme ve insanların ihtiyaçlarını karşılamak.
    id: Peringatan, amal yang berkelanjutan, pengetahuan yang bermanfaat, membesarkan anak dalam iman, dan memenuhi kebutuhan orang.
- q:
    ar: وما ثمارها؟
    en: And their fruits?
    fr: Quels en sont les fruits ?
    tr: Peki faydaları nelerdir?
    id: Dan apa manfaatnya?
  a:
    ar: الطمأنينة في الدنيا، والنور في القبر، والدرجات العلى في الجنة.
    en: Tranquility in this world, light in the grave, high ranks in Paradise.
    fr: La sérénité en ce monde, la lumière dans la tombe et des degrés élevés au Paradis.
    tr: Bu dünyada huzur, mezarda ışık ve Cennet'te en yüksek rütbeler.
    id: Ketenangan di dunia ini, cahaya di kubur, dan pangkat tertinggi di Surga.
- q:
    ar: وما الغرس الخبيث؟
    en: And the evil planting?
    fr: Et les mauvaises plantations ?
    tr: Peki kötü niyetli implantasyon nedir?
    id: Dan apa itu implan jahat?
  a:
    ar: الذنوب والمعاصي غراس النار — والاستغفار والتوبة يقتلعانها.
    en: Sins are the seedlings of Fire — istighfar and repentance uproot them.
    fr: Les péchés sont comparés aux plantations de l’Enfer ; la demande de pardon et le repentir les déracinent.
    tr: Günahlar ve günahlar ateşin tohumlarıdır — ve af ve tövbe aramak onları kökünden söküp atar.
    id: Dosa dan pelanggaran adalah benih api — dan mencari pengampunan serta pertobatan mencabutnya.
