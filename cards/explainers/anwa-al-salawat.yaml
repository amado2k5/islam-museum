slug: anwa-al-salawat
title: { ar: "أنواع الصلوات", en: "Types of prayers" }
lede:
  ar: "خريطة الصلوات: الفرائض والنوافل والصلاة على الميت."
  en: "A map of prayers: obligatory, voluntary, and funeral."
source_card: 68f3f30a
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما الصلوات المفروضة؟", en: "What are the obligatory prayers?" }
    a:
      ar: "الصلوات الخمس: الفجر والظهر والعصر والمغرب والعشاء."
      en: "The five daily prayers: Fajr, Dhuhr, 'Asr, Maghrib, 'Isha."
  - q: { ar: "وما صلوات الجماعة؟", en: "And congregational prayers?" }
    a:
      ar: "الجمعة، والعيدان، والكسوف، والاستسقاء، والتراويح."
      en: "Jumu'ah, the two Eids, eclipse, rain-seeking, Tarawih."
  - q: { ar: "وما النوافل الفردية غالبًا؟", en: "And mostly-individual voluntary prayers?" }
    a:
      ar: "الضحى، وقيام الليل، والوتر، والرواتب."
      en: "Duha, night prayer, Witr, and the regular sunnahs."
  - q: { ar: "وما الصلوات الخاصة؟", en: "And special prayers?" }
    a:
      ar: "الاستخارة، وصلاة الخوف، وصلاة التوبة، وصلاة المسافر، والجمع عند الحاجة."
      en: "Istikhara, fear prayer, repentance prayer, the traveler's prayer, combining when needed."
  - q: { ar: "وما صلاة الجنازة؟", en: "And the funeral prayer?" }
    a:
      ar: "صلاة على الميت بلا ركوع ولا سجود: تكبيرات ودعاء للميت."
      en: "Prayer over the deceased without bowing or prostration: takbirs and du'a."
cautions:
  - ar: "صلاة الشكر مختلف في مشروعيتها بين العلماء."
    en: "The legislation of gratitude prayer differs among scholars."
