slug: anwa-al-salawat
title:
  ar: أنواع الصلوات
  en: Types of prayers
  fr: Les différentes prières
  tr: Dua Türleri
  id: Jenis-jenis Doa
lede:
  ar: 'خريطة الصلوات: الفرائض والنوافل والصلاة على الميت.'
  en: 'A map of prayers: obligatory, voluntary, and funeral.'
  fr: 'Une carte des prières : obligations, prières surérogatoires et prière funéraire.'
  tr: 'Dua Haritası: Zorunlu dualar, gönüllü dualar ve vefat eden için yapılan dualar.'
  id: 'Peta Doa: Doa wajib, doa sukarela, dan doa untuk almarhum.'
source_card: 68f3f30a
status:
  review: draft
widget: stepper
steps:
- q:
    ar: ما الصلوات المفروضة؟
    en: What are the obligatory prayers?
    fr: Quelles sont les prières obligatoires ?
    tr: Zorunlu dualar nelerdir?
    id: Apa saja doa wajib?
  a:
    ar: 'الصلوات الخمس: الفجر والظهر والعصر والمغرب والعشاء.'
    en: 'The five daily prayers: Fajr, Dhuhr, ''Asr, Maghrib, ''Isha.'
    fr: 'Les cinq prières : fajr, dhuhr, asr, maghrib et icha.'
    tr: 'Beş günlük namaz: Fecr, Dhuhr, Asr, Maghrib ve İşa.'
    id: 'Lima shalat harian: Fajr, Dhuhr, Asr, Maghrib, dan Isha.'
- q:
    ar: وما صلوات الجماعة؟
    en: And congregational prayers?
    fr: Quelles prières se font en commun ?
    tr: Peki cemaat duaları nedir?
    id: Dan apa itu doa jemaah?
  a:
    ar: الجمعة، والعيدان، والكسوف، والاستسقاء، والتراويح.
    en: Jumu'ah, the two Eids, eclipse, rain-seeking, Tarawih.
    fr: La prière du vendredi, celles des deux fêtes, de l’éclipse, de demande de pluie et les tarawih.
    tr: Cuma, Bayram, tutulma, yağmur ve Teravieh.
    id: Jumat, Idul Fitri, gerhana, hujan, dan Taraweeh.
- q:
    ar: وما النوافل الفردية غالبًا؟
    en: And mostly-individual voluntary prayers?
    fr: Quelles prières surérogatoires sont généralement individuelles ?
    tr: Ve en sık hangi bireysel gönüllü dualar yapılır?
    id: Dan doa sukarela individu apa yang paling sering?
  a:
    ar: الضحى، وقيام الليل، والوتر، والرواتب.
    en: Duha, night prayer, Witr, and the regular sunnahs.
    fr: La prière du duha, les prières nocturnes, le witr et les prières régulières associées aux obligations.
    tr: Duha, gece namazları, Witr ve maaşlar.
    id: Duha, doa malam, Witr, dan gaji.
- q:
    ar: وما الصلوات الخاصة؟
    en: And special prayers?
    fr: Quelles sont les prières liées à des circonstances particulières ?
    tr: Peki özel dualar nelerdir?
    id: Dan apa doa khusus itu?
  a:
    ar: الاستخارة، وصلاة الخوف، وصلاة التوبة، وصلاة المسافر، والجمع عند الحاجة.
    en: Istikhara, fear prayer, repentance prayer, the traveler's prayer, combining when needed.
    fr: La consultation divine, la prière en situation de danger, le repentir, la prière du voyageur et le regroupement en cas de besoin.
    tr: İstikhara, korku duası, tövbe duası, gezgin duası ve gerektiğinde duaları birleştirme.
    id: Istikhara, doa ketakutan, doa pertobatan, doa pengembara, dan doa gabungan bila diperlukan.
- q:
    ar: وما صلاة الجنازة؟
    en: And the funeral prayer?
    fr: Qu’est-ce que la prière funéraire ?
    tr: Peki cenaze duası nedir?
    id: Dan apa doa pemakamannya?
  a:
    ar: 'صلاة على الميت بلا ركوع ولا سجود: تكبيرات ودعاء للميت.'
    en: 'Prayer over the deceased without bowing or prostration: takbirs and du''a.'
    fr: 'Une prière pour le défunt, sans inclinaison ni prosternation : des takbirs et des invocations en sa faveur.'
    tr: 'Ölene eğilmeden veya eğilmeden kutsamalar göndermek: tekbirler ve merhum için dualar.'
    id: 'Mengirimkan berkat kepada almarhum tanpa tunduk atau sujud: takbir dan permohonan untuk almarhum.'
cautions:
- ar: صلاة الشكر مختلف في مشروعيتها بين العلماء.
  en: The legislation of gratitude prayer differs among scholars.
  fr: La légitimité d’une prière de gratitude fait l’objet de divergences entre les savants.
  tr: Şükran duası, meşruiyeti açısından akademisyenler arasında geniş çapta kabul görmektedir.
  id: Doa rasa syukur sangat dihargai oleh para sarjana terkait legitimasinya.
