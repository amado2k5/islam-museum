slug: laylat-al-jumua
title: { ar: "ليلة الجمعة ويوم الجمعة", en: "Friday night and day" }
lede:
  ar: "ست محطات من مغرب الخميس إلى مغرب الجمعة — خير يوم طلعت عليه الشمس."
  en: "Six stations from Thursday sunset to Friday sunset — the best day the sun rose upon."
source_card: c68015e0
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "متى تبدأ ليلة الجمعة؟", en: "When does Friday night begin?" }
    a:
      ar: "من غروب شمس الخميس — فالليل يسبق النهار في التقويم الهجري."
      en: "At Thursday sunset — night precedes day in the Hijri calendar."
  - q: { ar: "ما أول المحطات؟", en: "What are the first stations?" }
    a:
      ar: "من مغرب الخميس: الذكر والدعاء والإكثار من الصلاة على النبي وقراءة القرآن."
      en: "From Thursday Maghrib: dhikr, du'a, abundant salawat upon the Prophet, Quran recitation."
  - q: { ar: "ما فضل الصلاة على النبي يوم الجمعة؟", en: "What is the virtue of salawat on Friday?" }
    a:
      ar: "فأكثروا عليَّ من الصلاة فيه — تُعرض عليه صلاتنا."
      en: "Increase salawat upon him on this day — our salawat are presented to him."
    evidence:
      - { source: "رواه أبو داود", note: "مراجعة اللفظ والتخريج" }
  - q: { ar: "وما فضل سورة الكهف؟", en: "And Surah al-Kahf?" }
    a:
      ar: "من قرأها يوم الجمعة أضاء له من النور ما بين الجمعتين."
      en: "Whoever recites it on Friday is lit with light between the two Fridays."
    evidence:
      - { source: "رواه الحاكم والبيهقي", note: "مراجعة التخريج" }
  - q: { ar: "كيف أستعد لصلاة الجمعة؟", en: "How do I prepare for Jumu'ah?" }
    a:
      ar: "الغسل، والسواك، والتطيب، ولبس أحسن الثياب، والتبكير إلى المسجد."
      en: "Ghusl, siwak, perfume, finest clothes, and arriving early."
  - q: { ar: "وما ساعة الإجابة؟", en: "And the hour of response?" }
    a:
      ar: "ساعة في يوم الجمعة لا يوافقها عبد مسلم يدعو بخير إلا استُجيب له — وأرجاها آخر ساعة بعد العصر."
      en: "An hour on Friday when no Muslim servant asks for good but is answered — likeliest the last hour after 'Asr."
cautions:
  - ar: "لم يثبت تخصيص ليلة الجمعة بقيام دون سائر الليالي."
    en: "Singling out Friday night for qiyam is not established."
  - ar: "لم يثبت تخصيص يوم الجمعة بصيام دون سائر الأيام."
    en: "Singling out Friday for fasting is not established."
  - ar: "لا يجوز الكلام أثناء الخطبة."
    en: "Talking during the khutbah is not permitted."
