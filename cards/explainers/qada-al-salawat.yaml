slug: qada-al-salawat
title: { ar: "كيفية قضاء الصلوات الفائتة", en: "Making up missed prayers", fr: "Le rattrapage des prières manquées" }
lede:
  ar: "فاتتك صلاة؟ هذا حكم القضاء برأي الجمهور."
  en: "Missed a prayer? This is the make-up ruling per the majority."
  fr: "Une prière manquée : les règles de rattrapage selon l’avis majoritaire."
source_card: 7463483c
status: { review: draft }
widget: stepper
attribution:
  ar: "برأي الجمهور"
  en: "Per the majority view"
  fr: Selon l’avis majoritaire
steps:
  - q: { ar: "من فاتته صلاة بلا عذر؟", en: "One who missed without excuse?", fr: "Et si la prière a été manquée sans excuse ?" }
    a:
      ar: "يتوب إلى الله ويقضي ما فاته — القضاء واجب مع التوبة."
      en: "Repent to God and make up what was missed — make-up is obligatory with repentance."
      fr: "Le repentir et le rattrapage de la prière sont requis : selon cet avis, le rattrapage est obligatoire avec le repentir."
  - q: { ar: "ومن فاتته بعذر (كنوم أو نسيان)؟", en: "And with an excuse (sleep, forgetfulness)?", fr: "Et en cas d’excuse, comme le sommeil ou l’oubli ?" }
    a:
      ar: "يصليها متى ذكرها؛ لا كفارة لها إلا ذلك."
      en: "Pray it when remembered; no expiation but that."
      fr: La prière se fait dès que l’on s’en souvient ; aucune autre expiation n’est prévue.
    evidence:
      - { source: "رواه البخاري", note: "مراجعة اللفظ والرقم" }
  - q: { ar: "كيف أقضي؟", en: "How do I make it up?", fr: "Comment s’effectue le rattrapage ?" }
    a:
      ar: "كل صلاة على هيئتها، بنية القضاء، ومرتبة إن أمكن."
      en: "Each prayer in its form, with the intention of make-up, in order if possible."
      fr: Chaque prière conserve sa forme, avec l’intention de rattrapage et, si possible, dans l’ordre.
