slug: qada-al-salawat
title:
  ar: كيفية قضاء الصلوات الفائتة
  en: Making up missed prayers
  fr: Le rattrapage des prières manquées
  tr: Kaçırılan Dualar Nasıl Yapılır
  id: Cara Melakukan Doa yang Terlewat
lede:
  ar: فاتتك صلاة؟ هذا حكم القضاء برأي الجمهور.
  en: Missed a prayer? This is the make-up ruling per the majority.
  fr: 'Une prière manquée : les règles de rattrapage selon l’avis majoritaire.'
  tr: Bir duayı kaçırdınız mı? Bu, çoğunluk görüşüne göre yargının kararıdır.
  id: Apakah Anda melewatkan doa? Ini adalah putusan yudikatif menurut pendapat mayoritas.
source_card: 7463483c
status:
  review: draft
widget: stepper
attribution:
  ar: برأي الجمهور
  en: Per the majority view
  fr: Selon l’avis majoritaire
  tr: Kamuoyunun görüşüne göre
  id: Menurut pendapat publik
steps:
- q:
    ar: من فاتته صلاة بلا عذر؟
    en: One who missed without excuse?
    fr: Et si la prière a été manquée sans excuse ?
    tr: Kim duayı bahanesiz kaçırır ki?
    id: Siapa yang melewatkan doa tanpa alasan?
  a:
    ar: يتوب إلى الله ويقضي ما فاته — القضاء واجب مع التوبة.
    en: Repent to God and make up what was missed — make-up is obligatory with repentance.
    fr: 'Le repentir et le rattrapage de la prière sont requis : selon cet avis, le rattrapage est obligatoire avec le repentir.'
    tr: Tanrı'ya tövbe eder ve eksiklerini telafi eder — bunu telafi etmek ve tövbe etmek zorunludur.
    id: Dia bertobat kepada Tuhan dan menebus apa yang terlewatkan — menebusnya adalah kewajiban bersama dengan pertobatan.
- q:
    ar: ومن فاتته بعذر (كنوم أو نسيان)؟
    en: And with an excuse (sleep, forgetfulness)?
    fr: Et en cas d’excuse, comme le sommeil ou l’oubli ?
    tr: Ve kim bunu bir bahaneyle (uyku ya da unutkanlık) kaçırdı?
    id: Dan siapa yang melewatkannya dengan alasan (tidur atau lupa)?
  a:
    ar: يصليها متى ذكرها؛ لا كفارة لها إلا ذلك.
    en: Pray it when remembered; no expiation but that.
    fr: La prière se fait dès que l’on s’en souvient ; aucune autre expiation n’est prévue.
    tr: Ne zaman bahsetse dua etmelidir; bunun için başka bir kefaret yoktur.
    id: Dia harus berdoa setiap kali menyebutkannya; tidak ada penebusan selain itu.
  evidence:
  - source: رواه البخاري
    note: مراجعة اللفظ والرقم
- q:
    ar: كيف أقضي؟
    en: How do I make it up?
    fr: Comment s’effectue le rattrapage ?
    tr: Nasıl harcayacağım?
    id: Bagaimana cara saya menggunakannya?
  a:
    ar: كل صلاة على هيئتها، بنية القضاء، ومرتبة إن أمكن.
    en: Each prayer in its form, with the intention of make-up, in order if possible.
    fr: Chaque prière conserve sa forme, avec l’intention de rattrapage et, si possible, dans l’ordre.
    tr: Her dua kendi halinde, duaları oluşturacak şekilde hazırlanmalı ve mümkünse düzenlenmelidir.
    id: Setiap doa harus dalam bentuk yang benar, dengan tujuan untuk menyusun doa, dan diatur jika memungkinkan.
