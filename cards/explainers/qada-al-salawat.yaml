slug: qada-al-salawat
title: { ar: "كيفية قضاء الصلوات الفائتة", en: "Making up missed prayers" }
lede:
  ar: "فاتتك صلاة؟ هذا حكم القضاء برأي الجمهور."
  en: "Missed a prayer? This is the make-up ruling per the majority."
source_card: 7463483c
status: { review: draft }
widget: stepper
attribution:
  ar: "برأي الجمهور"
  en: "Per the majority view"
steps:
  - q: { ar: "من فاتته صلاة بلا عذر؟", en: "One who missed without excuse?" }
    a:
      ar: "يتوب إلى الله ويقضي ما فاته — القضاء واجب مع التوبة."
      en: "Repent to God and make up what was missed — make-up is obligatory with repentance."
  - q: { ar: "ومن فاتته بعذر (كنوم أو نسيان)؟", en: "And with an excuse (sleep, forgetfulness)?" }
    a:
      ar: "يصليها متى ذكرها؛ لا كفارة لها إلا ذلك."
      en: "Pray it when remembered; no expiation but that."
    evidence:
      - { source: "رواه البخاري", note: "مراجعة اللفظ والرقم" }
  - q: { ar: "كيف أقضي؟", en: "How do I make it up?" }
    a:
      ar: "كل صلاة على هيئتها، بنية القضاء، ومرتبة إن أمكن."
      en: "Each prayer in its form, with the intention of make-up, in order if possible."
