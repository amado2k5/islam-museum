slug: asbab-al-hamm
title: { ar: "أسباب تجلب الهم والغم", en: "Causes that bring anxiety and sorrow" }
lede:
  ar: "ثمانية أسباب — مع تنبيه مهم: الهم ليس دائمًا ضعف إيمان."
  en: "Eight causes — with an important note: anxiety is not always weak faith."
source_card: 9e58f301
status: { review: draft }
widget: stepper
nuance:
  ar: "تنبيه: لا تختزل الهم في ضعف الإيمان؛ قد تكون له أسباب نفسية وجسدية تحتاج مختصًا."
  en: "Note: do not reduce anxiety to weak faith; it may have psychological and physical causes needing a specialist."
steps:
  - q: { ar: "ما أسباب الهم والغم؟", en: "What causes anxiety and sorrow?" }
    a:
      ar: "البعد عن ذكر الله، والذنوب، والحرص على الدنيا، والحسد، والفراغ، والوحدة، والديون، والظلم."
      en: "Distance from God's remembrance, sins, greed for dunya, envy, idleness, loneliness, debt, injustice."
  - q: { ar: "ما العلاج القرآني؟", en: "What is the Quranic remedy?" }
    a:
      ar: "ألا بذكر الله تطمئن القلوب — الذكر والقرآن سكينة للقلب."
      en: "Verily in God's remembrance do hearts find rest — dhikr and Quran bring tranquility."
    ref: "الرعد 28"
  - q: { ar: "وهل من دعاء نبوي؟", en: "Is there a prophetic du'a?" }
    a:
      ar: "اللهم إني أعوذ بك من الهم والحزن والعجز والكسل — دعاء متفق عليه."
      en: "'O God, I seek refuge in You from anxiety and sorrow, inability and laziness' — agreed upon."
    evidence:
      - { source: "متفق عليه", note: "مراجعة اللفظ" }
  - q: { ar: "ومتى أطلب مختصًا؟", en: "When should I seek a specialist?" }
    a:
      ar: "إذا استمر الهم أسبوعين فأكثر أو عطّل حياتك اليومية فراجع مختصًا؛ العلاج لا ينافي الإيمان."
      en: "If it persists two weeks or more or disrupts daily life, see a specialist; treatment does not contradict faith."
