slug: asbab-al-hamm
title:
  ar: أسباب تجلب الهم والغم
  en: Causes that bring anxiety and sorrow
  fr: Les causes de l’inquiétude et de la tristesse
  tr: Endişe ve üzüntü getiren nedenler
  id: Alasan yang membawa kekhawatiran dan kesedihan
lede:
  ar: 'ثمانية أسباب — مع تنبيه مهم: الهم ليس دائمًا ضعف إيمان.'
  en: 'Eight causes — with an important note: anxiety is not always weak faith.'
  fr: 'Huit causes, avec une précision essentielle : l’inquiétude n’est pas toujours un manque de foi.'
  tr: 'Sekiz neden — önemli bir uyarıyla: endişe her zaman inancın zayıflığı değildir.'
  id: 'Delapan alasan — dengan catatan penting: kekhawatiran tidak selalu menjadi kelemahan iman.'
source_card: 9e58f301
status:
  review: draft
widget: stepper
nuance:
  ar: 'تنبيه: لا تختزل الهم في ضعف الإيمان؛ قد تكون له أسباب نفسية وجسدية تحتاج مختصًا.'
  en: 'Note: do not reduce anxiety to weak faith; it may have psychological and physical causes needing a specialist.'
  fr: 'Attention : l’inquiétude ne se réduit pas à un manque de foi ; des causes psychologiques ou physiques peuvent nécessiter une aide professionnelle.'
  tr: 'Not: Endişeyi zayıf inanca indirgemeyin; bunun psikolojik ve fiziksel nedenleri olabilir ve bir uzman gerektirebilir.'
  id: 'Catatan: Jangan mengurangi kekhawatiran menjadi iman yang lemah; mungkin ada alasan psikologis dan fisik yang memerlukan spesialis.'
steps:
- q:
    ar: ما أسباب الهم والغم؟
    en: What causes anxiety and sorrow?
    fr: Quelles sont les causes de l’inquiétude et de la tristesse ?
    tr: Endişe ve sıkıntının nedenleri nelerdir?
    id: Apa penyebab kekhawatiran dan stres?
  a:
    ar: البعد عن ذكر الله، والذنوب، والحرص على الدنيا، والحسد، والفراغ، والوحدة، والديون، والظلم.
    en: Distance from God's remembrance, sins, greed for dunya, envy, idleness, loneliness, debt, injustice.
    fr: L’éloignement du rappel de Dieu, les fautes, l’attachement aux biens de ce monde, l’envie, l’oisiveté, la solitude, les dettes et l’injustice.
    tr: Tanrı'nın hatırlanmasından, günahlardan, dünyevi çıkar için açgözlülükten, kıskançlıktan, tembellikten, yalnızlıktan, borçlardan ve adaletsizlikten kaçınmak.
    id: Menghindari ingatan akan Tuhan, dosa, keserakahan demi keuntungan duniawi, iri hati, kemalasan, kesepian, hutang, dan ketidakadilan.
- q:
    ar: ما العلاج القرآني؟
    en: What is the Quranic remedy?
    fr: Quelle réponse le Coran présente-t-il ?
    tr: Kur'an terapisi nedir?
    id: Apa itu terapi Al-Quran?
  a:
    ar: ألا بذكر الله تطمئن القلوب — الذكر والقرآن سكينة للقلب.
    en: Verily in God's remembrance do hearts find rest — dhikr and Quran bring tranquility.
    fr: Le verset évoque l’apaisement du cœur par le rappel de Dieu ; le rappel et le Coran sont associés à la sérénité.
    tr: Gerçekten de, Allah'ın anısında kalpler huzur bulur — anma ve Kur'an kalp için bir huzurdur.
    id: Memang, dalam mengenang Allah hati menemukan kedamaian — kenangan dan Al-Qur'an adalah ketenangan bagi hati.
  ref: الرعد 28
- q:
    ar: وهل من دعاء نبوي؟
    en: Is there a prophetic du'a?
    fr: Existe-t-il une invocation prophétique ?
    tr: Ve herhangi bir kehanet duası var mı?
    id: Dan apakah ada doa nubuat?
  a:
    ar: اللهم إني أعوذ بك من الهم والحزن والعجز والكسل — دعاء متفق عليه.
    en: '''O God, I seek refuge in You from anxiety and sorrow, inability and laziness'' — agreed upon.'
    fr: Une invocation rapportée par al-Boukhari et Muslim demande à Dieu protection contre l’inquiétude, la tristesse, l’impuissance et la paresse.
    tr: Ey Allah, endişeden, üzüntüden, çaresizlikten ve tembellikten Sana sığınıyorum—üzerinde anlaşılmış bir dua.
    id: Ya Allah, aku memohon perlindungan kepada-Mu dari kekhawatiran, kesedihan, ketidakberdayaan, dan kemalasan—permohonan yang telah disepakati.
  evidence:
  - source: متفق عليه
    note: مراجعة اللفظ
- q:
    ar: ومتى أطلب مختصًا؟
    en: When should I seek a specialist?
    fr: Quand consulter un professionnel ?
    tr: Ve ne zaman bir uzmana başvurmalıyım?
    id: Dan kapan saya harus mencari spesialis?
  a:
    ar: إذا استمر الهم أسبوعين فأكثر أو عطّل حياتك اليومية فراجع مختصًا؛ العلاج لا ينافي الإيمان.
    en: If it persists two weeks or more or disrupts daily life, see a specialist; treatment does not contradict faith.
    fr: Si l’inquiétude dure deux semaines ou davantage, ou perturbe la vie quotidienne, consulter un professionnel ; les soins ne s’opposent pas à la foi.
    tr: Kaygı iki hafta veya daha uzun sürerse veya günlük hayatınızı bozuyorsa, bir uzmana danışın; tedavi inançla çelişmez.
    id: Jika kecemasan berlangsung dua minggu atau lebih atau mengganggu kehidupan sehari-hari Anda, konsultasikan dengan spesialis; pengobatan tidak bertentangan dengan keyakinan.
