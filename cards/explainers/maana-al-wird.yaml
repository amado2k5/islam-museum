slug: maana-al-wird
title: { ar: "لماذا نسمي تلاوة القرآن وردًا؟", en: "Why is Quran recitation called 'wird'?" }
lede:
  ar: "الورد في الأصل مورد الماء — فما علاقته بالقرآن؟"
  en: "'Wird' originally means a water source — what has it to do with the Quran?"
source_card: 0817d60d
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما معنى الورد لغة؟", en: "What does 'wird' mean linguistically?" }
    a:
      ar: "الورد مورد الماء الذي ترده الإبل والناس؛ ومنه ورد موسى ماء مدين."
      en: "The water source camels and people come to; thus Musa came to Madyan's water."
    ref: "القصص 23"
  - q: { ar: "فلماذا سُمّيت التلاوة وردًا؟", en: "Why is recitation called wird?" }
    a:
      ar: "كما يرد الظمآن الماء فيروى، ترد النفس القرآن فيروى ظمؤها — القرآن ماء الروح."
      en: "As the thirsty come to water and are quenched, the soul comes to the Quran — the Quran is the soul's water."
  - q: { ar: "وما المطلوب مني؟", en: "So what should I do?" }
    a:
      ar: "اجعل لك وردًا يوميًا من القرآن لا تتركه — وردك زادك."
      en: "Keep a daily portion of Quran you never abandon — your wird is your provision."
