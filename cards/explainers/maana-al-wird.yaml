slug: maana-al-wird
title: { ar: "لماذا نسمي تلاوة القرآن وردًا؟", en: "Why is Quran recitation called 'wird'?", fr: "Pourquoi appelle-t-on la lecture du Coran un « wird » ?" }
lede:
  ar: "الورد في الأصل مورد الماء — فما علاقته بالقرآن؟"
  en: "'Wird' originally means a water source — what has it to do with the Quran?"
  fr: "Le mot désigne à l’origine un point d’eau : quel rapport avec le Coran ?"
source_card: 0817d60d
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما معنى الورد لغة؟", en: "What does 'wird' mean linguistically?", fr: "Quel est le sens linguistique de « wird » ?" }
    a:
      ar: "الورد مورد الماء الذي ترده الإبل والناس؛ ومنه ورد موسى ماء مدين."
      en: "The water source camels and people come to; thus Musa came to Madyan's water."
      fr: Le point d’eau où viennent boire humains et chameaux ; le récit de Moïse à Madyan emploie cette image.
    ref: "القصص 23"
  - q: { ar: "فلماذا سُمّيت التلاوة وردًا؟", en: "Why is recitation called wird?", fr: "Pourquoi employer ce mot pour la récitation ?" }
    a:
      ar: "كما يرد الظمآن الماء فيروى، ترد النفس القرآن فيروى ظمؤها — القرآن ماء الروح."
      en: "As the thirsty come to water and are quenched, the soul comes to the Quran — the Quran is the soul's water."
      fr: "Comme la personne assoiffée vient se désaltérer, l’âme vient au Coran : celui-ci est comparé à l’eau qui apaise sa soif."
  - q: { ar: "وما المطلوب مني؟", en: "So what should I do?", fr: "Quelle pratique cela évoque-t-il ?" }
    a:
      ar: "اجعل لك وردًا يوميًا من القرآن لا تتركه — وردك زادك."
      en: "Keep a daily portion of Quran you never abandon — your wird is your provision."
      fr: Une portion quotidienne et régulière de lecture du Coran, considérée comme une provision spirituelle.
