slug: alamat-al-saa-al-kubra
title: { ar: "العلامات الكبرى للساعة", en: "The major signs of the Hour", fr: "Les grands signes de l’Heure" }
lede:
  ar: "إحدى عشرة علامة كبرى — بترتيب ترجيحي لا قطعي."
  en: "Eleven major signs — in a preferred, not certain, order."
  fr: Onze grands signes, dans un ordre proposé mais non certain.
source_card: 43d497bf
status: { review: draft }
widget: timeline
caution:
  ar: "ترتيب العلامات الكبرى ترجيح العلماء لا أمر قطعي."
  en: "The order of the major signs is scholars' preference, not certain."
  fr: L’ordre des grands signes relève de l’appréciation des savants, non d’une certitude.
stations:
  - title: { ar: "المهدي", en: "The Mahdi", fr: "Le Mahdi" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "رجل من أهل البيت يملأ الأرض عدلًا.", en: "A man from the Prophet's household who fills the earth with justice.", fr: "Un homme de la famille du Prophète qui remplit la terre de justice." }
    evidence: [{ source: "رواه أبو داود والترمذي", note: "مراجعة التخريج والدرجة" }]
  - title: { ar: "الدجال", en: "The Dajjal", fr: "Le Dajjal" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "أعظم فتنة؛ يدعي الألوهية ويُقتَل على يد عيسى.", en: "The greatest trial; claims divinity and is killed by 'Isa.", fr: "Une immense épreuve : il se prétend divin et Jésus le tue." }
  - title: { ar: "نزول عيسى", en: "The descent of 'Isa", fr: "La descente de Jésus" }
    tag: { ar: "من القرآن والسنة", en: "From the Quran and Sunna", fr: "Dans le Coran et la Sunna" }
    body: { ar: "ينزل حكمًا عدلًا فيقتل الدجال ويكسر الصليب.", en: "Descends as a just ruler; kills the Dajjal.", fr: "Il descend en juge équitable, tue le Dajjal et brise la croix." }
  - title: { ar: "يأجوج ومأجوج", en: "Gog and Magog", fr: "Gog et Magog" }
    tag: { ar: "من القرآن", en: "From the Quran", fr: "Dans le Coran" }
    body: { ar: "يفسدون في الأرض ثم يهلكهم الله.", en: "They corrupt the earth, then God destroys them.", fr: "Ils sèment la corruption sur terre, puis Dieu les fait périr." }
  - title: { ar: "الدخان", en: "The Smoke", fr: "La fumée" }
    tag: { ar: "من القرآن", en: "From the Quran", fr: "Dans le Coran" }
    body: { ar: "دخان يغشى الناس.", en: "A smoke enveloping the people.", fr: "Une fumée qui enveloppe les humains." }
  - title: { ar: "الخسوفات الثلاثة", en: "The three eclipses", fr: "Les trois effondrements de terrain" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "خسف بالمشرق وخسف بالمغرب وخسف بجزيرة العرب.", en: "Lunar eclipses in the east, west, and Arabia.", fr: "Un effondrement à l’est, un à l’ouest et un dans la péninsule Arabique." }
    evidence: [{ source: "رواه مسلم 2901", note: "مراجعة الرقم" }]
  - title: { ar: "طلوع الشمس من مغربها", en: "Sunrise from the west", fr: "Le lever du soleil à l’ouest" }
    tag: { ar: "من القرآن والسنة", en: "From the Quran and Sunna", fr: "Dans le Coran et la Sunna" }
    body: { ar: "حينها لا ينفع نفسًا إيمانها.", en: "Then no soul's faith shall benefit it.", fr: "Le récit évoque un moment où une foi nouvellement professée ne profite plus." }
  - title: { ar: "الدابة", en: "The Beast", fr: "La Bête" }
    tag: { ar: "من القرآن", en: "From the Quran", fr: "Dans le Coran" }
    body: { ar: "دابة تكلم الناس.", en: "A beast that speaks to people.", fr: "Une bête qui parle aux humains." }
  - title: { ar: "الريح الطيبة", en: "The gentle wind", fr: "Le vent bienfaisant" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "ريح تقبض أرواح المؤمنين.", en: "A wind that takes the believers' souls.", fr: "Un vent qui recueille les âmes des croyants." }
  - title: { ar: "هدم الكعبة", en: "Demolition of the Kaaba", fr: "La destruction de la Kaaba" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "يهدمها ذو السويقتين من الحبشة.", en: "Dhu al-Suwayqatayn from Abyssinia demolishes it.", fr: "Elle est détruite par Dhou al-Souwayqatayn, originaire d’Abyssinie." }
  - title: { ar: "نار اليمن", en: "The fire of Yemen", fr: "Le feu du Yémen" }
    tag: { ar: "من السنة", en: "From the Sunna", fr: "Dans la Sunna" }
    body: { ar: "نار تخرج من اليمن تحشر الناس.", en: "A fire from Yemen gathering the people.", fr: "Un feu surgit du Yémen et rassemble les humains." }
