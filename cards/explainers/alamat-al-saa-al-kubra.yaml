slug: alamat-al-saa-al-kubra
title: { ar: "العلامات الكبرى للساعة", en: "The major signs of the Hour" }
lede:
  ar: "إحدى عشرة علامة كبرى — بترتيب ترجيحي لا قطعي."
  en: "Eleven major signs — in a preferred, not certain, order."
source_card: 43d497bf
status: { review: draft }
widget: timeline
caution:
  ar: "ترتيب العلامات الكبرى ترجيح العلماء لا أمر قطعي."
  en: "The order of the major signs is scholars' preference, not certain."
stations:
  - title: { ar: "المهدي", en: "The Mahdi" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "رجل من أهل البيت يملأ الأرض عدلًا.", en: "A man from the Prophet's household who fills the earth with justice." }
    evidence: [{ source: "رواه أبو داود والترمذي", note: "مراجعة التخريج والدرجة" }]
  - title: { ar: "الدجال", en: "The Dajjal" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "أعظم فتنة؛ يدعي الألوهية ويُقتَل على يد عيسى.", en: "The greatest trial; claims divinity and is killed by 'Isa." }
  - title: { ar: "نزول عيسى", en: "The descent of 'Isa" }
    tag: { ar: "من القرآن والسنة", en: "From the Quran and Sunna" }
    body: { ar: "ينزل حكمًا عدلًا فيقتل الدجال ويكسر الصليب.", en: "Descends as a just ruler; kills the Dajjal." }
  - title: { ar: "يأجوج ومأجوج", en: "Gog and Magog" }
    tag: { ar: "من القرآن", en: "From the Quran" }
    body: { ar: "يفسدون في الأرض ثم يهلكهم الله.", en: "They corrupt the earth, then God destroys them." }
  - title: { ar: "الدخان", en: "The Smoke" }
    tag: { ar: "من القرآن", en: "From the Quran" }
    body: { ar: "دخان يغشى الناس.", en: "A smoke enveloping the people." }
  - title: { ar: "الخسوفات الثلاثة", en: "The three eclipses" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "خسف بالمشرق وخسف بالمغرب وخسف بجزيرة العرب.", en: "Lunar eclipses in the east, west, and Arabia." }
    evidence: [{ source: "رواه مسلم 2901", note: "مراجعة الرقم" }]
  - title: { ar: "طلوع الشمس من مغربها", en: "Sunrise from the west" }
    tag: { ar: "من القرآن والسنة", en: "From the Quran and Sunna" }
    body: { ar: "حينها لا ينفع نفسًا إيمانها.", en: "Then no soul's faith shall benefit it." }
  - title: { ar: "الدابة", en: "The Beast" }
    tag: { ar: "من القرآن", en: "From the Quran" }
    body: { ar: "دابة تكلم الناس.", en: "A beast that speaks to people." }
  - title: { ar: "الريح الطيبة", en: "The gentle wind" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "ريح تقبض أرواح المؤمنين.", en: "A wind that takes the believers' souls." }
  - title: { ar: "هدم الكعبة", en: "Demolition of the Kaaba" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "يهدمها ذو السويقتين من الحبشة.", en: "Dhu al-Suwayqatayn from Abyssinia demolishes it." }
  - title: { ar: "نار اليمن", en: "The fire of Yemen" }
    tag: { ar: "من السنة", en: "From the Sunna" }
    body: { ar: "نار تخرج من اليمن تحشر الناس.", en: "A fire from Yemen gathering the people." }
