slug: alamat-al-saa-al-kubra
title:
  ar: العلامات الكبرى للساعة
  en: The major signs of the Hour
  fr: Les grands signes de l’Heure
  tr: Ana izleme işaretleri
  id: Tanda-tanda pengawas utama
lede:
  ar: إحدى عشرة علامة كبرى — بترتيب ترجيحي لا قطعي.
  en: Eleven major signs — in a preferred, not certain, order.
  fr: Onze grands signes, dans un ordre proposé mais non certain.
  tr: On bir ana puan — ağırlıklı sırayla, nihai sıralama değil.
  id: Sebelas nilai utama — dalam urutan berbobot, bukan urutan akhir.
source_card: 43d497bf
status:
  review: draft
widget: timeline
caution:
  ar: ترتيب العلامات الكبرى ترجيح العلماء لا أمر قطعي.
  en: The order of the major signs is scholars' preference, not certain.
  fr: L’ordre des grands signes relève de l’appréciation des savants, non d’une certitude.
  tr: Başlıca burçların sıralaması akademisyenler için kesin bir karar değildir.
  id: Peringkat tanda utama bukanlah keputusan pasti bagi para akademisi.
stations:
- title:
    ar: المهدي
    en: The Mahdi
    fr: Le Mahdi
    tr: Mehdi
    id: Mahdi
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: رجل من أهل البيت يملأ الأرض عدلًا.
    en: A man from the Prophet's household who fills the earth with justice.
    fr: Un homme de la famille du Prophète qui remplit la terre de justice.
    tr: Ahl al-Bayt'ten bir adam, dünyayı adaletle dolduruyor.
    id: Seorang pria dari Ahl al-Bayt yang memenuhi bumi dengan keadilan.
  evidence:
  - source: رواه أبو داود والترمذي
    note: مراجعة التخريج والدرجة
- title:
    ar: الدجال
    en: The Dajjal
    fr: Le Dajjal
    tr: Deccal
    id: Antikristus
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: أعظم فتنة؛ يدعي الألوهية ويُقتَل على يد عيسى.
    en: The greatest trial; claims divinity and is killed by 'Isa.
    fr: 'Une immense épreuve : il se prétend divin et Jésus le tue.'
    tr: En büyük ayartma; ilahi olduğunu iddia eder ve İsa tarafından öldürülür.
    id: Godaan terbesar; dia mengklaim keilahian dan dibunuh oleh Yesus.
- title:
    ar: نزول عيسى
    en: The descent of 'Isa
    fr: La descente de Jésus
    tr: İsa'nın İnişi
    id: Turunnya Yesus
  tag:
    ar: من القرآن والسنة
    en: From the Quran and Sunna
    fr: Dans le Coran et la Sunna
    tr: Kur'an ve Sünnet'ten
    id: Dari Al-Qur'an dan Sunnah
  body:
    ar: ينزل حكمًا عدلًا فيقتل الدجال ويكسر الصليب.
    en: Descends as a just ruler; kills the Dajjal.
    fr: Il descend en juge équitable, tue le Dajjal et brise la croix.
    tr: Adil bir yargıç inecek, Deccal'i öldürecek ve çarmıha kaçıracak.
    id: Hakim yang adil akan turun, membunuh Antikristus, dan mematahkan salib.
- title:
    ar: يأجوج ومأجوج
    en: Gog and Magog
    fr: Gog et Magog
    tr: Gog ve Magog
    id: Gog dan Magog
  tag:
    ar: من القرآن
    en: From the Quran
    fr: Dans le Coran
    tr: Kur'an'dan
    id: Dari Al-Qur'an
  body:
    ar: يفسدون في الأرض ثم يهلكهم الله.
    en: They corrupt the earth, then God destroys them.
    fr: Ils sèment la corruption sur terre, puis Dieu les fait périr.
    tr: Yeryüzünde yozlaşma yaratırlar, sonra Tanrı onları yok eder.
    id: Mereka menyebabkan korupsi di bumi, lalu Tuhan akan menghancurkannya.
- title:
    ar: الدخان
    en: The Smoke
    fr: La fumée
    tr: Duman
    id: Asap
  tag:
    ar: من القرآن
    en: From the Quran
    fr: Dans le Coran
    tr: Kur'an'dan
    id: Dari Al-Qur'an
  body:
    ar: دخان يغشى الناس.
    en: A smoke enveloping the people.
    fr: Une fumée qui enveloppe les humains.
    tr: Duman insanları kaplar.
    id: Asap menutupi orang.
- title:
    ar: الخسوفات الثلاثة
    en: The three eclipses
    fr: Les trois effondrements de terrain
    tr: Üç Tutulma
    id: Tiga Gerhana
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: خسف بالمشرق وخسف بالمغرب وخسف بجزيرة العرب.
    en: Lunar eclipses in the east, west, and Arabia.
    fr: Un effondrement à l’est, un à l’ouest et un dans la péninsule Arabique.
    tr: Doğuda, Mağrip'te ve Arap Yarımadası'nda gölgede kaldı.
    id: Wilayah ini tertutup di Timur, Maghreb, dan Semenanjung Arab.
  evidence:
  - source: رواه مسلم 2901
    note: مراجعة الرقم
- title:
    ar: طلوع الشمس من مغربها
    en: Sunrise from the west
    fr: Le lever du soleil à l’ouest
    tr: Batıdan Gün Doğumu
    id: Matahari terbit dari Barat
  tag:
    ar: من القرآن والسنة
    en: From the Quran and Sunna
    fr: Dans le Coran et la Sunna
    tr: Kur'an ve Sünnet'ten
    id: Dari Al-Qur'an dan Sunnah
  body:
    ar: حينها لا ينفع نفسًا إيمانها.
    en: Then no soul's faith shall benefit it.
    fr: Le récit évoque un moment où une foi nouvellement professée ne profite plus.
    tr: O noktada, bir ruhun inancı hiçbir fayda sağlamaz.
    id: Pada titik itu, iman jiwa tidak akan bermanfaat.
- title:
    ar: الدابة
    en: The Beast
    fr: La Bête
    tr: Canavar
    id: Sang Binatang
  tag:
    ar: من القرآن
    en: From the Quran
    fr: Dans le Coran
    tr: Kur'an'dan
    id: Dari Al-Qur'an
  body:
    ar: دابة تكلم الناس.
    en: A beast that speaks to people.
    fr: Une bête qui parle aux humains.
    tr: İnsanlarla konuşan bir canavar.
    id: Seekor binatang yang berbicara dengan orang.
- title:
    ar: الريح الطيبة
    en: The gentle wind
    fr: Le vent bienfaisant
    tr: Nazik Rüzgar
    id: Angin yang Baik
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: ريح تقبض أرواح المؤمنين.
    en: A wind that takes the believers' souls.
    fr: Un vent qui recueille les âmes des croyants.
    tr: İnananların ruhlarını ele geçiren bir rüzgar.
    id: Angin yang merebut jiwa para penganut.
- title:
    ar: هدم الكعبة
    en: Demolition of the Kaaba
    fr: La destruction de la Kaaba
    tr: Kabe'nin Yıkımı
    id: Pembongkaran Ka'bah
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: يهدمها ذو السويقتين من الحبشة.
    en: Dhu al-Suwayqatayn from Abyssinia demolishes it.
    fr: Elle est détruite par Dhou al-Souwayqatayn, originaire d’Abyssinie.
    tr: Habeşistan'dan Dhu al-Suwaitain tarafından yıkıldı.
    id: Kota ini dihancurkan oleh Dhu al-Suwaitain dari Abyssinia.
- title:
    ar: نار اليمن
    en: The fire of Yemen
    fr: Le feu du Yémen
    tr: Yemen'in ateşi
    id: Kebakaran Yaman
  tag:
    ar: من السنة
    en: From the Sunna
    fr: Dans la Sunna
    tr: Sünnet'ten
    id: Dari Sunnah
  body:
    ar: نار تخرج من اليمن تحشر الناس.
    en: A fire from Yemen gathering the people.
    fr: Un feu surgit du Yémen et rassemble les humains.
    tr: Yemen'den ateş çıkıyor ve insanları topluyor.
    id: Api keluar dari Yaman dan memadati orang-orang.
