slug: anhar-al-janna
title:
  ar: أنهار الجنة
  en: The rivers of Paradise
  fr: Les fleuves du Paradis
  tr: Cennet Nehirleri
  id: Sungai-sungai Surga
lede:
  ar: أربعة أنهار تجري من أصل الجنة.
  en: Four rivers flowing from Paradise's origin.
  fr: Quatre fleuves prenant leur source au Paradis.
  tr: Cennetin kaynağından dört nehir akar.
  id: Empat sungai mengalir dari asal surga.
source_card: e2e8eda2
status:
  review: draft
widget: stepper
steps:
- q:
    ar: ما أنهار الجنة الأربعة؟
    en: What are the four rivers of Paradise?
    fr: Quels sont les quatre fleuves du Paradis ?
    tr: Cennetin dört nehri nedir?
    id: Apa itu empat sungai surga?
  a:
    ar: أنهار من ماء، وأنهار من لبن، وأنهار من عسل، وأنهار من خمر — كلها من أصل الجنة.
    en: Rivers of water, rivers of milk, rivers of honey, rivers of wine — all from Paradise's origin.
    fr: Le passage évoque quatre sortes de fleuves paradisiaques, associés à l’eau, au lait, au miel et au vin.
    tr: Su nehirleri, süt nehirleri, bal nehirleri ve şarap nehirleri—hepsi Cennet'in kökeninden geliyor.
    id: Sungai air, sungai susu, sungai madu, dan sungai anggur—semuanya berasal dari asal-usul Surga.
  ref: آل عمران 15
- q:
    ar: ما وصفها؟
    en: How are they described?
    fr: Comment sont-ils décrits ?
    tr: Ne anlattı?
    id: Apa yang dia gambarkan?
  a:
    ar: ماء غير آسن، ولبن لم يتغير طعمه، وخمر لذة للشاربين، وعسل مصفى.
    en: Unstagnant water, unspoiled milk, delightful wine, purified honey.
    fr: Le passage souligne la pureté de ces boissons et l’absence d’altération.
    tr: Dondurulmamış su, değişmemiş yoğurt, içiciler için nefis bir şarap ve rafine bal.
    id: Air tanpa beku, yogurt yang tidak berubah, anggur yang menyenangkan untuk peminum, dan madu yang sudah dihaluskan.
  evidence:
  - source: رواه مسلم 2577
    note: مراجعة الرقم
  - source: رواه ابن ماجه (الخمر)
    note: مراجعة التخريج
- q:
    ar: وهل خمر الجنة كخمر الدنيا؟
    en: Is Paradise's wine like the world's?
    fr: Le vin du Paradis ressemble-t-il à celui de ce monde ?
    tr: Ve Cennet şarabı bu dünyanın şarabı gibi midir?
    id: Dan apakah anggur Surga seperti anggur dunia ini?
  a:
    ar: لا؛ لا غول فيها ولا نزف — لذة بلا سكر ولا صداع.
    en: No; no intoxication or headache — delight without harm.
    fr: Le passage évoque un plaisir sans ivresse ni maux de tête.
    tr: Hayır; ne hortlak ne de kanama var — şekersiz ya da baş ağrısı olmayan bir haz.
    id: Tidak; tidak ada hantu atau pendarahan — kenikmatan tanpa gula atau sakit kepala.
