slug: anhar-al-janna
title: { ar: "أنهار الجنة", en: "The rivers of Paradise" }
lede:
  ar: "أربعة أنهار تجري من أصل الجنة."
  en: "Four rivers flowing from Paradise's origin."
source_card: e2e8eda2
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما أنهار الجنة الأربعة؟", en: "What are the four rivers of Paradise?" }
    a:
      ar: "أنهار من ماء، وأنهار من لبن، وأنهار من عسل، وأنهار من خمر — كلها من أصل الجنة."
      en: "Rivers of water, rivers of milk, rivers of honey, rivers of wine — all from Paradise's origin."
    ref: "آل عمران 15"
  - q: { ar: "ما وصفها؟", en: "How are they described?" }
    a:
      ar: "ماء غير آسن، ولبن لم يتغير طعمه، وخمر لذة للشاربين، وعسل مصفى."
      en: "Unstagnant water, unspoiled milk, delightful wine, purified honey."
    evidence:
      - { source: "رواه مسلم 2577", note: "مراجعة الرقم" }
      - { source: "رواه ابن ماجه (الخمر)", note: "مراجعة التخريج" }
  - q: { ar: "وهل خمر الجنة كخمر الدنيا؟", en: "Is Paradise's wine like the world's?" }
    a:
      ar: "لا؛ لا غول فيها ولا نزف — لذة بلا سكر ولا صداع."
      en: "No; no intoxication or headache — delight without harm."
