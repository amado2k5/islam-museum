title:
  ar: المذاهب الفقهية الأربعة
  en: The four schools of fiqh
  fr: Les quatre écoles de jurisprudence
  tr: Dört Hukuk Okulu
  id: Empat Sekolah Yurisprudensi
lede:
  ar: أربعة أئمة، أربعة مناهج — واختلافهم رحمة.
  en: Four imams, four methodologies — and their differences are mercy.
  fr: 'Quatre imams, quatre méthodes : leur diversité est présentée comme une miséricorde.'
  tr: Dört imam, dört metodoloji — ve aralarındaki farklar merhamettir.
  id: Empat Imam, empat metodologi — dan perbedaan mereka adalah rahmat.
