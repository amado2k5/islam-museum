slug: salat-al-duha
title: { ar: "صلاة الضحى", en: "Duha prayer" }
lede:
  ar: "صلاة الأوابين — وقتها وفضلها وكيفيتها سؤالًا وجوابًا."
  en: "The prayer of the oft-returning — its time, virtue and method, Q&A."
source_card: 2fc1002d
status: { review: draft }
widget: stepper
steps:
  - q: { ar: "ما هي صلاة الضحى؟", en: "What is Duha prayer?" }
    a:
      ar: "صلاة نافلة تُصلَّى في وقت الضحى، وتُسمَّى صلاة الأوابين."
      en: "A voluntary prayer performed in the forenoon, called the prayer of the oft-returning."
  - q: { ar: "متى وقتها؟", en: "When is its time?" }
    a:
      ar: "من ارتفاع الشمس قدر رمح (نحو ربع ساعة بعد الشروق) إلى قبيل الظهر؛ وأفضلها حين ترمض الفصال أي اشتداد الحر في وسط النهار."
      en: "From sunrise plus ~15 minutes until just before Dhuhr; best in the mid-morning heat."
  - q: { ar: "ما فضلها؟", en: "What is its virtue?" }
    a:
      ar: "تجزئ عن صدقة كل مفصل من مفاصل الجسم، وهي وصية نبوية جامعة."
      en: "It suffices as charity for every joint of the body; a comprehensive prophetic counsel."
    evidence:
      - { source: "رواه مسلم", note: "مراجعة اللفظ" }
      - { source: "متفق عليه (الوصية)", note: "مراجعة اللفظ" }
  - q: { ar: "كم عدد ركعاتها؟", en: "How many rak'ahs?" }
    a:
      ar: "أقلها ركعتان، وأفضلها أربع، وأكثر ما ورد ثمان؛ ولا حد لأكثرها عند جمهور العلماء."
      en: "Minimum two, best four, most narrated eight; no maximum per the majority."
    evidence:
      - { source: "رواه أبو داود والترمذي (الأربع)", note: "مراجعة اللفظ والتخريج" }
  - q: { ar: "كيف تُصلَّى؟", en: "How is it performed?" }
    a:
      ar: "ركعتين ركعتين: تكبيرة الإحرام، الفاتحة وسورة، الركوع والسجود كسائر الصلوات، ثم التشهد والسلام."
      en: "Two by two: opening takbir, Fatiha and a surah, bowing and prostration as in other prayers, then tashahhud and salam."
  - q: { ar: "هل لها سور مخصوصة؟", en: "Are there specific surahs for it?" }
    a:
      ar: "لا؛ يُقرأ فيها بما تيسر من القرآن."
      en: "No; recite whatever is easy from the Quran."
  - q: { ar: "هل لها أذكار مخصوصة؟", en: "Are there specific adhkar for it?" }
    a:
      ar: "لا أذكار مخصوصة ثبتت لها؛ الذكر العام بعد الصلاة كغيرها."
      en: "No specific adhkar are established for it; the general post-prayer dhikr as usual."
