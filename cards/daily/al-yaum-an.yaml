# «اليوم عن» daily series template (proposal §5).
# Each day: a card id + a one-line prompt. The renderer picks day-of-year % N.
series: al-yaum-an
title: { ar: "اليوم عن…", en: "Today about…" }
entries:
  - card: cards/wordmap/adhaban.json
    prompt: { ar: "كم صيغة للفظ «عذابًا» في القرآن؟", en: "How many forms of 'punishment' occur in the Quran?" }
  - card: cards/wordmap/wa-bashshir.json
    prompt: { ar: "من هم المبشَّرون في القرآن؟", en: "Who are given glad tidings in the Quran?" }
  - card: cards/lists/mafatih-al-faraj.yaml
    prompt: { ar: "احفظ اليوم مفتاحًا واحدًا من مفاتيح الفرج.", en: "Memorize one key of relief today." }
  - card: cards/lists/al-sab-al-mubiqat.yaml
    prompt: { ar: "راجع الموبقات السبع — واحذرها.", en: "Review the seven destructive sins — and beware them." }
  - card: cards/explainers/salat-al-duha.yaml
    prompt: { ar: "صلِّ الضحى اليوم ركعتين.", en: "Pray two rak'ahs of Duha today." }
  - card: cards/stories/ashab-al-kahf.yaml
    prompt: { ar: "اقرأ قصة أصحاب الكهف وتدبرها.", en: "Read the story of the Cave's people and reflect." }
