slug: asma-yaum-al-qiyama
title:
  ar: أسماء يوم القيامة في القرآن
  en: Names of Judgment Day in the Quran
  fr: Les noms du Jour de la Résurrection dans le Coran
  tr: Kur'an'da Kıyamet Günü İsimleri
  id: Nama-nama Hari Penghakiman dalam Al-Qur'an
lede:
  ar: أربعة وعشرون اسمًا ليوم واحد — لكثرة أهواله وعظم شأنه.
  en: Twenty-four names for a single day — for its terrors and gravity.
  fr: Vingt-quatre noms pour un même jour, qui en soulignent la gravité et les terreurs.
  tr: Bir günde yirmi dört isim — birçok korku ve büyük statüsü nedeniyle.
  id: Dua puluh empat nama untuk satu hari — karena banyak kengerian dan wibawanya yang besar.
source_card: c05d9fa3
status:
  review: draft
quiz: true
items:
- title:
    ar: يوم القيامة
    en: The Day of Resurrection
    fr: Le Jour de la Résurrection
    tr: Kıyamet Günü
    id: Hari Penghakiman
  body:
    ar: يوم يقوم الناس لرب العالمين.
    en: The day people rise before the Lord of the worlds.
    fr: Le verset évoque les humains se tenant devant le Seigneur des mondes.
    tr: İnsanların Dünyaların Rabbi önünde yükseleceği gün.
    id: Hari ketika orang-orang akan bangkit di hadapan Tuhan Dunia.
- title:
    ar: اليوم الآخر
    en: The Last Day
    fr: Le Jour dernier
    tr: Geçen Gün
    id: Beberapa Hari Lalu
  body:
    ar: اليوم الذي لا يوم بعده.
    en: The day after which there is no other day.
    fr: Le jour après lequel aucun autre jour ne vient.
    tr: Bir daha asla gelmeyecek gün.
    id: Hari yang tak pernah datang setelahnya.
- title:
    ar: الساعة
    en: The Hour
    fr: L’Heure
    tr: Zaman
    id: Waktu
  body:
    ar: تأتي بغتة فلا يستطيعون ردها.
    en: It comes suddenly; none can repel it.
    fr: Elle survient soudainement, sans que les humains puissent la repousser.
    tr: Aniden gelir, bu yüzden geri veremezler.
    id: Itu datang tiba-tiba, jadi mereka tidak bisa mengembalikannya.
- title:
    ar: يوم البعث
    en: The Day of Resurrection
    fr: Le Jour du retour à la vie
    tr: Yeniden Canlanma Günü
    id: Hari Kebangunan Rohani
  body:
    ar: يوم يبعث الله من في القبور.
    en: The day God raises those in the graves.
    fr: Le jour où Dieu ressuscite ceux qui sont dans les tombeaux.
    tr: Tanrı'nın mezardakileri dirilttiği gün.
    id: Hari di mana Tuhan membangkitkan mereka yang ada di kubur.
- title:
    ar: يوم الخروج
    en: The Day of Emergence
    fr: Le Jour de la sortie
    tr: Ayrılış Günü
    id: Hari Keberangkatan
  body:
    ar: يوم يخرجون من الأجداث سراعًا.
    en: The day they emerge from the graves hastening.
    fr: Le verset évoque une sortie précipitée des tombes.
    tr: Mağaralardan hızla çıkacakları gün.
    id: Hari mereka keluar dari gua dengan cepat.
- title:
    ar: يوم الفصل
    en: The Day of Separation
    fr: Le Jour de la décision
    tr: Dönem Günü
    id: Hari Semester
  body:
    ar: يوم يفصل الله بين عباده.
    en: The day God judges between His servants.
    fr: Le jour où Dieu tranche entre Ses serviteurs.
    tr: Allah'ın kullarını ayırdığı gün.
    id: Hari Allah memisahkan hamba-hamba-Nya.
- title:
    ar: يوم الدين
    en: The Day of Recompense
    fr: Le Jour de la rétribution
    tr: Kıyamet Günü
    id: Hari Penghakiman
  body:
    ar: يوم الجزاء والحساب.
    en: The day of recompense and reckoning.
    fr: Le jour de la rétribution et du jugement.
    tr: Kıyamet ve hesaplaşma günü.
    id: Hari Penghakiman dan Penghakiman.
- title:
    ar: يوم الحساب
    en: The Day of Reckoning
    fr: Le Jour des comptes
    tr: Kıyamet Günü
    id: Hari Penghakiman
  body:
    ar: يوم يحاسب كل امرئ على عمله.
    en: The day each soul is reckoned for its deeds.
    fr: Le jour où chacun répond de ses actes.
    tr: Herkesin yaptıklarından sorumlu tutulacağı bir gün.
    id: Hari di mana semua orang akan bertanggung jawab atas perbuatan mereka.
- title:
    ar: يوم الجمع
    en: The Day of Gathering
    fr: Le Jour du rassemblement
    tr: Cuma
    id: Jumat
  body:
    ar: يوم يجمع الله الأولين والآخرين.
    en: The day God gathers the first and the last.
    fr: Le jour où Dieu rassemble les premières et les dernières générations.
    tr: Tanrı'nın ilk ve sonuncunu topladığı gün.
    id: Hari ketika Tuhan mengumpulkan yang pertama dan terakhir.
- title:
    ar: يوم التغابن
    en: The Day of Mutual Loss
    fr: Le Jour de la perte mutuelle
    tr: Çatışma Günü
    id: Hari Konflik
  body:
    ar: يوم يغبن أهل النار أهل الجنة.
    en: The day the people of Fire feel cheated of Paradise.
    fr: Le jour où se révèle la perte des gens de l’Enfer par rapport aux gens du Paradis.
    tr: Cehennem Ateşi halkının Cennet halkı tarafından kandırılacağı gün.
    id: Hari ketika orang-orang Api Neraka akan tertipu oleh orang-orang Surga.
- title:
    ar: يوم التناد
    en: The Day of Calling
    fr: Le Jour des appels
    tr: Ziyaret Günü
    id: Hari Panggilan
  body:
    ar: يوم يتنادى الناس بالويل والثبور.
    en: The day people call out in woe.
    fr: Le jour où les humains s’appellent dans la détresse.
    tr: İnsanların keder ve felaketi haykıracağı bir gün.
    id: Hari di mana orang-orang akan berteriak sengsara dan malapetaka.
- title:
    ar: يوم الحسرة
    en: The Day of Regret
    fr: Le Jour du regret
    tr: Keder Günü
    id: Hari Kesedihan
  body:
    ar: يوم يتحسر المقصر على تفريطه.
    en: The day the negligent regret their failures.
    fr: Le jour où celui qui a négligé ses devoirs regrette ses manquements.
    tr: Başarısız olanın ihmalinden pişman olduğu bir gün.
    id: Hari di mana orang yang gagal menyesali kelalaian.
- title:
    ar: يوم الوعيد
    en: The Day of Threat
    fr: Le Jour de la menace accomplie
    tr: Uyarı Günü
    id: Hari Peringatan
  body:
    ar: يوم يتحقق وعيد الله للكافرين.
    en: The day God's threat to the disbelievers materializes.
    fr: Le jour où s’accomplit la menace divine adressée aux non-croyants.
    tr: Kıyamet Günü tamamlanacak ve Allah'ın bayramı kâfirler için tamamlanacaktır.
    id: Hari Penghakiman akan dipenuhi dan pesta Allah akan dipenuhi bagi orang-orang kafir.
- title:
    ar: يوم الخلود
    en: The Day of Eternity
    fr: Le Jour de l’éternité
    tr: Sonsuzluk Günü
    id: Hari Keabadian
  body:
    ar: يوم الخلود في الجنة أو النار.
    en: The day of eternity in Paradise or Fire.
    fr: Le jour de l’entrée dans une demeure éternelle, au Paradis ou en Enfer.
    tr: Cennette ya da Cehennemde Sonsuzluk Günü.
    id: Hari Keabadian di Surga atau Neraka.
- title:
    ar: الواقعة
    en: The Inevitable Event
    fr: L’Événement
    tr: Olay
    id: Insiden
  body:
    ar: الواقعة التي لا راد لها.
    en: The event none can repel.
    fr: L’événement que rien ne peut repousser.
    tr: Geri dönüşü olmayan olay.
    id: Insiden yang tak bisa diubah.
- title:
    ar: الحاقة
    en: The Reality
    fr: L’Inéluctable
    tr: El-Haqqa
    id: Al-Haqqa
  body:
    ar: الحاقة التي تحق فيها الأمور.
    en: The reality in which all matters are settled.
    fr: L’événement où les réalités deviennent manifestes.
    tr: Önemli olan hak haktır.
    id: Hak yang penting adalah hak yang benar.
- title:
    ar: القارعة
    en: The Striking Calamity
    fr: Le Fracas
    tr: El-Kari'a
    id: Al-Qari'a
  body:
    ar: القارعة التي تقرع القلوب بأهوالها.
    en: The calamity that strikes hearts with its terrors.
    fr: Un événement dont les terreurs frappent les cœurs.
    tr: Kalpleri dehşetleriyle sarsan kurnazlık.
    id: Kecerdikan yang menghantam hati dengan kengeriannya.
- title:
    ar: الغاشية
    en: The Overwhelming
    fr: L’Enveloppante
    tr: Al-Ghashiyya
    id: Al-Ghashiyya
  body:
    ar: تغشى الناس بأهوالها.
    en: It overwhelms people with its terrors.
    fr: Ses terreurs enveloppent les humains.
    tr: İnsanları dehşetleriyle sarar.
    id: Ia membungkus orang dengan kengeriannya.
- title:
    ar: الصاخة
    en: The Deafening Blast
    fr: Le Cri assourdissant
    tr: Gürültülü olan
    id: Yang berisik
  body:
    ar: الصيحة التي تصخ الآذان.
    en: The blast that deafens ears.
    fr: Un cri qui assourdit les oreilles.
    tr: Kulakları çınlayan bağırış.
    id: Teriakan yang bergema di telinga.
- title:
    ar: الطامة الكبرى
    en: The Greatest Catastrophe
    fr: La Grande Catastrophe
    tr: Büyük Felaket
    id: Bencana Besar
  body:
    ar: الداهية العظمى التي تطم على كل شيء.
    en: The supreme catastrophe eclipsing all else.
    fr: Une catastrophe suprême qui submerge toute chose.
    tr: Her şeyi kaplayan büyük kurnazlık.
    id: Kecerdikan besar yang menutupi segalanya.
- title:
    ar: الآزفة
    en: The Imminent
    fr: L’Imminente
    tr: El-Ezfa
    id: Al-Azfa
  body:
    ar: الساعة القريبة الآزفة.
    en: The near, imminent Hour.
    fr: L’Heure toute proche.
    tr: Saat yaklaşıyor.
    id: Jam sudah dekat.
- title:
    ar: يوم عسير
    en: A Difficult Day
    fr: Un jour difficile
    tr: Zor bir gün
    id: Hari yang sulit
  body:
    ar: عسير على الكافرين غير يسير.
    en: Hard upon the disbelievers, not easy.
    fr: Le verset souligne la difficulté de ce jour pour les non-croyants.
    tr: İnançsızlar için zor, kolay değil.
    id: Ini sulit bagi orang yang tidak percaya, tidak mudah.
- title:
    ar: يوم مشهود
    en: A Witnessed Day
    fr: Un jour dont tous sont témoins
    tr: Unutulmaz bir gün
    id: Hari yang tak terlupakan
  body:
    ar: يوم يشهده الخلائق كلهم.
    en: A day witnessed by all creation.
    fr: Un jour auquel assiste toute la création.
    tr: Tüm yaratılışın tanık olduğu bir gün.
    id: Hari yang disaksikan oleh seluruh ciptaan.
- title:
    ar: يوم عظيم
    en: A Tremendous Day
    fr: Un jour immense
    tr: Harika bir gün
    id: Hari yang luar biasa
  body:
    ar: لعظم ما فيه من الأهوال.
    en: Tremendous for the terrors it holds.
    fr: Ainsi nommé en raison de l’ampleur de ses terreurs.
    tr: İçinde barındırdığı büyük dehşetler yüzünden.
    id: Karena kengerian besar yang terkandung di dalamnya.
