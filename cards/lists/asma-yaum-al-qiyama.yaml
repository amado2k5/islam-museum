slug: asma-yaum-al-qiyama
title: { ar: "أسماء يوم القيامة في القرآن", en: "Names of Judgment Day in the Quran", fr: "Les noms du Jour de la Résurrection dans le Coran" }
lede:
  ar: "أربعة وعشرون اسمًا ليوم واحد — لكثرة أهواله وعظم شأنه."
  en: "Twenty-four names for a single day — for its terrors and gravity."
  fr: Vingt-quatre noms pour un même jour, qui en soulignent la gravité et les terreurs.
source_card: c05d9fa3
status: { review: draft }
quiz: true
items:
  - { title: { ar: "يوم القيامة", en: "The Day of Resurrection", fr: "Le Jour de la Résurrection" }, body: { ar: "يوم يقوم الناس لرب العالمين.", en: "The day people rise before the Lord of the worlds.", fr: "Le verset évoque les humains se tenant devant le Seigneur des mondes." } }
  - { title: { ar: "اليوم الآخر", en: "The Last Day", fr: "Le Jour dernier" }, body: { ar: "اليوم الذي لا يوم بعده.", en: "The day after which there is no other day.", fr: "Le jour après lequel aucun autre jour ne vient." } }
  - { title: { ar: "الساعة", en: "The Hour", fr: "L’Heure" }, body: { ar: "تأتي بغتة فلا يستطيعون ردها.", en: "It comes suddenly; none can repel it.", fr: "Elle survient soudainement, sans que les humains puissent la repousser." } }
  - { title: { ar: "يوم البعث", en: "The Day of Resurrection", fr: "Le Jour du retour à la vie" }, body: { ar: "يوم يبعث الله من في القبور.", en: "The day God raises those in the graves.", fr: "Le jour où Dieu ressuscite ceux qui sont dans les tombeaux." } }
  - { title: { ar: "يوم الخروج", en: "The Day of Emergence", fr: "Le Jour de la sortie" }, body: { ar: "يوم يخرجون من الأجداث سراعًا.", en: "The day they emerge from the graves hastening.", fr: "Le verset évoque une sortie précipitée des tombes." } }
  - { title: { ar: "يوم الفصل", en: "The Day of Separation", fr: "Le Jour de la décision" }, body: { ar: "يوم يفصل الله بين عباده.", en: "The day God judges between His servants.", fr: "Le jour où Dieu tranche entre Ses serviteurs." } }
  - { title: { ar: "يوم الدين", en: "The Day of Recompense", fr: "Le Jour de la rétribution" }, body: { ar: "يوم الجزاء والحساب.", en: "The day of recompense and reckoning.", fr: "Le jour de la rétribution et du jugement." } }
  - { title: { ar: "يوم الحساب", en: "The Day of Reckoning", fr: "Le Jour des comptes" }, body: { ar: "يوم يحاسب كل امرئ على عمله.", en: "The day each soul is reckoned for its deeds.", fr: "Le jour où chacun répond de ses actes." } }
  - { title: { ar: "يوم الجمع", en: "The Day of Gathering", fr: "Le Jour du rassemblement" }, body: { ar: "يوم يجمع الله الأولين والآخرين.", en: "The day God gathers the first and the last.", fr: "Le jour où Dieu rassemble les premières et les dernières générations." } }
  - { title: { ar: "يوم التغابن", en: "The Day of Mutual Loss", fr: "Le Jour de la perte mutuelle" }, body: { ar: "يوم يغبن أهل النار أهل الجنة.", en: "The day the people of Fire feel cheated of Paradise.", fr: "Le jour où se révèle la perte des gens de l’Enfer par rapport aux gens du Paradis." } }
  - { title: { ar: "يوم التناد", en: "The Day of Calling", fr: "Le Jour des appels" }, body: { ar: "يوم يتنادى الناس بالويل والثبور.", en: "The day people call out in woe.", fr: "Le jour où les humains s’appellent dans la détresse." } }
  - { title: { ar: "يوم الحسرة", en: "The Day of Regret", fr: "Le Jour du regret" }, body: { ar: "يوم يتحسر المقصر على تفريطه.", en: "The day the negligent regret their failures.", fr: "Le jour où celui qui a négligé ses devoirs regrette ses manquements." } }
  - { title: { ar: "يوم الوعيد", en: "The Day of Threat", fr: "Le Jour de la menace accomplie" }, body: { ar: "يوم يتحقق وعيد الله للكافرين.", en: "The day God's threat to the disbelievers materializes.", fr: "Le jour où s’accomplit la menace divine adressée aux non-croyants." } }
  - { title: { ar: "يوم الخلود", en: "The Day of Eternity", fr: "Le Jour de l’éternité" }, body: { ar: "يوم الخلود في الجنة أو النار.", en: "The day of eternity in Paradise or Fire.", fr: "Le jour de l’entrée dans une demeure éternelle, au Paradis ou en Enfer." } }
  - { title: { ar: "الواقعة", en: "The Inevitable Event", fr: "L’Événement" }, body: { ar: "الواقعة التي لا راد لها.", en: "The event none can repel.", fr: "L’événement que rien ne peut repousser." } }
  - { title: { ar: "الحاقة", en: "The Reality", fr: "L’Inéluctable" }, body: { ar: "الحاقة التي تحق فيها الأمور.", en: "The reality in which all matters are settled.", fr: "L’événement où les réalités deviennent manifestes." } }
  - { title: { ar: "القارعة", en: "The Striking Calamity", fr: "Le Fracas" }, body: { ar: "القارعة التي تقرع القلوب بأهوالها.", en: "The calamity that strikes hearts with its terrors.", fr: "Un événement dont les terreurs frappent les cœurs." } }
  - { title: { ar: "الغاشية", en: "The Overwhelming", fr: "L’Enveloppante" }, body: { ar: "تغشى الناس بأهوالها.", en: "It overwhelms people with its terrors.", fr: "Ses terreurs enveloppent les humains." } }
  - { title: { ar: "الصاخة", en: "The Deafening Blast", fr: "Le Cri assourdissant" }, body: { ar: "الصيحة التي تصخ الآذان.", en: "The blast that deafens ears.", fr: "Un cri qui assourdit les oreilles." } }
  - { title: { ar: "الطامة الكبرى", en: "The Greatest Catastrophe", fr: "La Grande Catastrophe" }, body: { ar: "الداهية العظمى التي تطم على كل شيء.", en: "The supreme catastrophe eclipsing all else.", fr: "Une catastrophe suprême qui submerge toute chose." } }
  - { title: { ar: "الآزفة", en: "The Imminent", fr: "L’Imminente" }, body: { ar: "الساعة القريبة الآزفة.", en: "The near, imminent Hour.", fr: "L’Heure toute proche." } }
  - { title: { ar: "يوم عسير", en: "A Difficult Day", fr: "Un jour difficile" }, body: { ar: "عسير على الكافرين غير يسير.", en: "Hard upon the disbelievers, not easy.", fr: "Le verset souligne la difficulté de ce jour pour les non-croyants." } }
  - { title: { ar: "يوم مشهود", en: "A Witnessed Day", fr: "Un jour dont tous sont témoins" }, body: { ar: "يوم يشهده الخلائق كلهم.", en: "A day witnessed by all creation.", fr: "Un jour auquel assiste toute la création." } }
  - { title: { ar: "يوم عظيم", en: "A Tremendous Day", fr: "Un jour immense" }, body: { ar: "لعظم ما فيه من الأهوال.", en: "Tremendous for the terrors it holds.", fr: "Ainsi nommé en raison de l’ampleur de ses terreurs." } }
