slug: asma-yaum-al-qiyama
title: { ar: "أسماء يوم القيامة في القرآن", en: "Names of Judgment Day in the Quran" }
lede:
  ar: "أربعة وعشرون اسمًا ليوم واحد — لكثرة أهواله وعظم شأنه."
  en: "Twenty-four names for a single day — for its terrors and gravity."
source_card: c05d9fa3
status: { review: draft }
quiz: true
items:
  - { title: { ar: "يوم القيامة", en: "The Day of Resurrection" }, body: { ar: "يوم يقوم الناس لرب العالمين.", en: "The day people rise before the Lord of the worlds." } }
  - { title: { ar: "اليوم الآخر", en: "The Last Day" }, body: { ar: "اليوم الذي لا يوم بعده.", en: "The day after which there is no other day." } }
  - { title: { ar: "الساعة", en: "The Hour" }, body: { ar: "تأتي بغتة فلا يستطيعون ردها.", en: "It comes suddenly; none can repel it." } }
  - { title: { ar: "يوم البعث", en: "The Day of Resurrection" }, body: { ar: "يوم يبعث الله من في القبور.", en: "The day God raises those in the graves." } }
  - { title: { ar: "يوم الخروج", en: "The Day of Emergence" }, body: { ar: "يوم يخرجون من الأجداث سراعًا.", en: "The day they emerge from the graves hastening." } }
  - { title: { ar: "يوم الفصل", en: "The Day of Separation" }, body: { ar: "يوم يفصل الله بين عباده.", en: "The day God judges between His servants." } }
  - { title: { ar: "يوم الدين", en: "The Day of Recompense" }, body: { ar: "يوم الجزاء والحساب.", en: "The day of recompense and reckoning." } }
  - { title: { ar: "يوم الحساب", en: "The Day of Reckoning" }, body: { ar: "يوم يحاسب كل امرئ على عمله.", en: "The day each soul is reckoned for its deeds." } }
  - { title: { ar: "يوم الجمع", en: "The Day of Gathering" }, body: { ar: "يوم يجمع الله الأولين والآخرين.", en: "The day God gathers the first and the last." } }
  - { title: { ar: "يوم التغابن", en: "The Day of Mutual Loss" }, body: { ar: "يوم يغبن أهل النار أهل الجنة.", en: "The day the people of Fire feel cheated of Paradise." } }
  - { title: { ar: "يوم التناد", en: "The Day of Calling" }, body: { ar: "يوم يتنادى الناس بالويل والثبور.", en: "The day people call out in woe." } }
  - { title: { ar: "يوم الحسرة", en: "The Day of Regret" }, body: { ar: "يوم يتحسر المقصر على تفريطه.", en: "The day the negligent regret their failures." } }
  - { title: { ar: "يوم الوعيد", en: "The Day of Threat" }, body: { ar: "يوم يتحقق وعيد الله للكافرين.", en: "The day God's threat to the disbelievers materializes." } }
  - { title: { ar: "يوم الخلود", en: "The Day of Eternity" }, body: { ar: "يوم الخلود في الجنة أو النار.", en: "The day of eternity in Paradise or Fire." } }
  - { title: { ar: "الواقعة", en: "The Inevitable Event" }, body: { ar: "الواقعة التي لا راد لها.", en: "The event none can repel." } }
  - { title: { ar: "الحاقة", en: "The Reality" }, body: { ar: "الحاقة التي تحق فيها الأمور.", en: "The reality in which all matters are settled." } }
  - { title: { ar: "القارعة", en: "The Striking Calamity" }, body: { ar: "القارعة التي تقرع القلوب بأهوالها.", en: "The calamity that strikes hearts with its terrors." } }
  - { title: { ar: "الغاشية", en: "The Overwhelming" }, body: { ar: "تغشى الناس بأهوالها.", en: "It overwhelms people with its terrors." } }
  - { title: { ar: "الصاخة", en: "The Deafening Blast" }, body: { ar: "الصيحة التي تصخ الآذان.", en: "The blast that deafens ears." } }
  - { title: { ar: "الطامة الكبرى", en: "The Greatest Catastrophe" }, body: { ar: "الداهية العظمى التي تطم على كل شيء.", en: "The supreme catastrophe eclipsing all else." } }
  - { title: { ar: "الآزفة", en: "The Imminent" }, body: { ar: "الساعة القريبة الآزفة.", en: "The near, imminent Hour." } }
  - { title: { ar: "يوم عسير", en: "A Difficult Day" }, body: { ar: "عسير على الكافرين غير يسير.", en: "Hard upon the disbelievers, not easy." } }
  - { title: { ar: "يوم مشهود", en: "A Witnessed Day" }, body: { ar: "يوم يشهده الخلائق كلهم.", en: "A day witnessed by all creation." } }
  - { title: { ar: "يوم عظيم", en: "A Tremendous Day" }, body: { ar: "لعظم ما فيه من الأهوال.", en: "Tremendous for the terrors it holds." } }
