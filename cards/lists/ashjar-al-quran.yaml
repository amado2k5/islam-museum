slug: ashjar-al-quran
title: { ar: "أشجار ذكرت في القرآن", en: "Trees mentioned in the Quran", fr: "Les arbres mentionnés dans le Coran" }
lede:
  ar: "سبعة أشجار ونباتات خلّدها القرآن — من النخلة إلى الزقوم."
  en: "Seven trees and plants immortalized by the Quran — from the date-palm to the zaqqum."
  fr: Sept arbres et plantes évoqués dans le Coran, du palmier au zaqqoum.
source_card: d5b0b44c
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
items:
  - { title: { ar: "النخلة", en: "The date-palm", fr: "Le palmier" }, body: { ar: "مثل الكلمة الطيبة؛ أصلها ثابت وفرعها في السماء.", en: "Like the good word: its root firm, its branches in the sky.", fr: "Le verset évoque une bonne parole à travers l’image d’un arbre solidement enraciné aux branches élevées." }, ref: "ق 10" }
  - { title: { ar: "الزيتونة", en: "The olive", fr: "L’olivier" }, body: { ar: "شجرة مباركة يُقسم بها.", en: "A blessed tree, sworn by.", fr: "Un arbre béni qui apparaît dans un serment coranique." }, ref: "التين 1" }
  - { title: { ar: "التينة", en: "The fig", fr: "Le figuier" }, body: { ar: "يُقسم بها مع الزيتون.", en: "Sworn by alongside the olive.", fr: "Il apparaît dans un serment aux côtés de l’olivier." }, ref: "التين 1" }
  - { title: { ar: "السدر", en: "The lote tree", fr: "Le jujubier" }, body: { ar: "سدرة المنتهى عندها جنة المأوى.", en: "The Lote Tree of the Utmost Boundary, near the Garden of Refuge.", fr: "Le récit situe le Jardin du refuge auprès du jujubier de la limite." }, ref: "النجم 14–15" }
  - { title: { ar: "الطلح", en: "The talh", fr: "Le talh" }, body: { ar: "من نعيم أهل الجنة: طلح منضود.", en: "Among Paradise's bliss: clustered talh.", fr: "Le verset évoque le talh parmi les délices du Paradis." }, ref: "الواقعة 29" }
  - { title: { ar: "اليقطين", en: "The gourd plant", fr: "La courge" }, body: { ar: "أنبتها الله على يونس بعد نجاته.", en: "God grew it over Yunus after his rescue.", fr: "Le récit évoque une plante que Dieu fait pousser auprès de Jonas après son salut." }, ref: "الصافات 146" }
  - { title: { ar: "الزقوم", en: "The zaqqum", fr: "Le zaqqoum" }, body: { ar: "شجرة تخرج في أصل الجحيم طعام الأثيم.", en: "A tree growing in Hell's depths, food of the sinful.", fr: "Le verset décrit un arbre de l’Enfer servant de nourriture au pécheur." }, ref: "الدخان 43–44" }
