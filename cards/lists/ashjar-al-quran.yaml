slug: ashjar-al-quran
title: { ar: "أشجار ذكرت في القرآن", en: "Trees mentioned in the Quran" }
lede:
  ar: "سبعة أشجار ونباتات خلّدها القرآن — من النخلة إلى الزقوم."
  en: "Seven trees and plants immortalized by the Quran — from the date-palm to the zaqqum."
source_card: d5b0b44c
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
items:
  - { title: { ar: "النخلة", en: "The date-palm" }, body: { ar: "مثل الكلمة الطيبة؛ أصلها ثابت وفرعها في السماء.", en: "Like the good word: its root firm, its branches in the sky." }, ref: "ق 10" }
  - { title: { ar: "الزيتونة", en: "The olive" }, body: { ar: "شجرة مباركة يُقسم بها.", en: "A blessed tree, sworn by." }, ref: "التين 1" }
  - { title: { ar: "التينة", en: "The fig" }, body: { ar: "يُقسم بها مع الزيتون.", en: "Sworn by alongside the olive." }, ref: "التين 1" }
  - { title: { ar: "السدر", en: "The lote tree" }, body: { ar: "سدرة المنتهى عندها جنة المأوى.", en: "The Lote Tree of the Utmost Boundary, near the Garden of Refuge." }, ref: "النجم 14–15" }
  - { title: { ar: "الطلح", en: "The talh" }, body: { ar: "من نعيم أهل الجنة: طلح منضود.", en: "Among Paradise's bliss: clustered talh." }, ref: "الواقعة 29" }
  - { title: { ar: "اليقطين", en: "The gourd plant" }, body: { ar: "أنبتها الله على يونس بعد نجاته.", en: "God grew it over Yunus after his rescue." }, ref: "الصافات 146" }
  - { title: { ar: "الزقوم", en: "The zaqqum" }, body: { ar: "شجرة تخرج في أصل الجحيم طعام الأثيم.", en: "A tree growing in Hell's depths, food of the sinful." }, ref: "الدخان 43–44" }
