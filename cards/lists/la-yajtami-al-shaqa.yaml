slug: la-yajtami-al-shaqa
title: { ar: "لا يجتمع الشقاء مع ستة", en: "Misery never meets six states", fr: "Six états associés à l’éloignement du malheur" }
lede:
  ar: "ستة أحوال من لازمها لم يجتمع عليه الشقاء — بأدلة من القرآن."
  en: "Six states whose keeper misery never meets — with Quranic proofs."
  fr: Six attitudes que cette fiche rapproche de l’absence de malheur, à partir de passages coraniques.
source_card: d1589817
status: { review: draft }
quiz: true
items:
  - { title: { ar: "بر الوالدة", en: "Honoring one's mother", fr: "La bonté envers sa mère" }, body: { ar: "قال عيسى: وبرًّا بوالدتي ولم يجعلني جبارًا شقيًّا.", en: "'Isa said: dutiful to my mother; He did not make me a wretched tyrant.", fr: "Le verset évoque la bonté de Jésus envers sa mère et l’absence de tyrannie et de malheur dans son caractère." }, ref: "مريم 32" }
  - { title: { ar: "الدعاء", en: "Supplication", fr: "L’invocation" }, body: { ar: "قال زكريا: ولم أكن بدعائك رب شقيًّا.", en: "Zakariyya said: never have I been wretched in my supplication to You.", fr: "Le verset évoque la confiance de Zacharie, qui se souvient de ses invocations à Dieu." }, ref: "مريم 4" }
  - { title: { ar: "القرآن", en: "The Quran", fr: "Le Coran" }, body: { ar: "ما أنزلنا عليك القرآن لتشقى.", en: "We did not send down the Quran upon you to distress you.", fr: "Le verset précise que la révélation du Coran n’a pas pour but de causer la détresse." }, ref: "طه 2" }
  - { title: { ar: "اتباع الهدى", en: "Following guidance", fr: "Suivre la guidance" }, body: { ar: "فمن اتبع هداي فلا يضل ولا يشقى.", en: "Whoever follows My guidance shall neither stray nor be wretched.", fr: "Le verset associe le suivi de la guidance divine à l’éloignement de l’égarement et du malheur." }, ref: "طه 123" }
  - { title: { ar: "خشية الله", en: "Fear of God", fr: "La crainte de Dieu" }, body: { ar: "سيذكر من يخشى ويتجنبها الأشقى.", en: "The God-fearing will remember; the most wretched will avoid it.", fr: "Les versets opposent l’accueil du rappel par celui qui craint Dieu à son rejet par le plus malheureux." }, ref: "الأعلى 10–11" }
  - { title: { ar: "التقوى", en: "Taqwa", fr: "La conscience de Dieu" }, body: { ar: "لا يصلاها إلا الأشقى الذي كذب وتولى.", en: "None burns in it but the most wretched, who denied and turned away.", fr: "Les versets évoquent le sort de celui qui dément et se détourne." }, ref: "الليل 14–16" }
