slug: la-yajtami-al-shaqa
title: { ar: "لا يجتمع الشقاء مع ستة", en: "Misery never meets six states" }
lede:
  ar: "ستة أحوال من لازمها لم يجتمع عليه الشقاء — بأدلة من القرآن."
  en: "Six states whose keeper misery never meets — with Quranic proofs."
source_card: d1589817
status: { review: draft }
quiz: true
items:
  - { title: { ar: "بر الوالدة", en: "Honoring one's mother" }, body: { ar: "قال عيسى: وبرًّا بوالدتي ولم يجعلني جبارًا شقيًّا.", en: "'Isa said: dutiful to my mother; He did not make me a wretched tyrant." }, ref: "مريم 32" }
  - { title: { ar: "الدعاء", en: "Supplication" }, body: { ar: "قال زكريا: ولم أكن بدعائك رب شقيًّا.", en: "Zakariyya said: never have I been wretched in my supplication to You." }, ref: "مريم 4" }
  - { title: { ar: "القرآن", en: "The Quran" }, body: { ar: "ما أنزلنا عليك القرآن لتشقى.", en: "We did not send down the Quran upon you to distress you." }, ref: "طه 2" }
  - { title: { ar: "اتباع الهدى", en: "Following guidance" }, body: { ar: "فمن اتبع هداي فلا يضل ولا يشقى.", en: "Whoever follows My guidance shall neither stray nor be wretched." }, ref: "طه 123" }
  - { title: { ar: "خشية الله", en: "Fear of God" }, body: { ar: "سيذكر من يخشى ويتجنبها الأشقى.", en: "The God-fearing will remember; the most wretched will avoid it." }, ref: "الأعلى 10–11" }
  - { title: { ar: "التقوى", en: "Taqwa" }, body: { ar: "لا يصلاها إلا الأشقى الذي كذب وتولى.", en: "None burns in it but the most wretched, who denied and turned away." }, ref: "الليل 14–16" }
