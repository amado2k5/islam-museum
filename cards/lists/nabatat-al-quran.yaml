items:
  - { title: { ar: "النخيل", en: "Date-palms", fr: "Les palmiers" }, body: { ar: "من آيات الله في إخراج الثمرات.", en: "Among God's signs in bringing forth fruits.", fr: "L’apparition de leurs fruits est présentée comme un signe de Dieu." }, ref: "النحل 11" }
  - { title: { ar: "الزيتون", en: "Olives", fr: "L’olivier" }, body: { ar: "شجرة مباركة زيتونة لا شرقية ولا غربية.", en: "A blessed olive tree, neither eastern nor western.", fr: "Le verset évoque un olivier béni à travers une image de lumière." }, ref: "النور 35" }
  - { title: { ar: "الأعناب", en: "Grapevines", fr: "Les vignes" }, body: { ar: "من ثمرات النخيل والأعناب.", en: "Among the fruits of date-palms and grapevines.", fr: "Le verset évoque les fruits des palmiers et des vignes." }, ref: "النحل 67" }
  - { title: { ar: "الرمان", en: "Pomegranates", fr: "Les grenadiers" }, body: { ar: "من فاكهة الجنة.", en: "Among the fruits of Paradise.", fr: "Leurs fruits figurent parmi ceux du Paradis." }, ref: "الرحمن 68" }
  - { title: { ar: "السدر", en: "Lote trees", fr: "Le jujubier" }, body: { ar: "سدر مخضود من نعيم الجنة.", en: "Thornless lote trees among Paradise's bliss.", fr: "Le verset évoque un jujubier sans épines parmi les délices du Paradis." }, ref: "الواقعة 28" }
  - { title: { ar: "التين", en: "Figs", fr: "Le figuier" }, body: { ar: "يُقسم به مع الزيتون.", en: "Sworn by alongside the olive.", fr: "Il apparaît dans un serment aux côtés de l’olivier." }, ref: "التين 1" }
  - { title: { ar: "اليقطين", en: "Gourd", fr: "La courge" }, body: { ar: "أنبتها الله على يونس.", en: "God grew it over Yunus.", fr: "Le récit évoque une plante que Dieu fait pousser auprès de Jonas." }, ref: "الصافات 146" }
  - { title: { ar: "الزنجبيل", en: "Ginger", fr: "Le gingembre" }, body: { ar: "من شراب أهل الجنة.", en: "Among the drink of Paradise's people.", fr: "Il est évoqué dans une boisson des habitants du Paradis." }, ref: "الإنسان 17" }
  - { title: { ar: "الريحان", en: "Sweet basil", fr: "Les plantes aromatiques" }, body: { ar: "والحب ذو العصف والريحان.", en: "Grain with husk, and fragrant basil.", fr: "Le verset associe les plantes odorantes aux céréales et à leur enveloppe." }, ref: "الرحمن 12" }
