title: { ar: "نباتات خلدها القرآن", en: "Plants immortalized by the Quran" }
lede:
  ar: "تسعة نباتات ورد ذكرها في القرآن الكريم."
  en: "Nine plants mentioned in the Holy Quran."
source_card: ec17a5d8
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
items:
  - { title: { ar: "النخيل", en: "Date-palms" }, body: { ar: "من آيات الله في إخراج الثمرات.", en: "Among God's signs in bringing forth fruits." }, ref: "النحل 11" }
  - { title: { ar: "الزيتون", en: "Olives" }, body: { ar: "شجرة مباركة زيتونة لا شرقية ولا غربية.", en: "A blessed olive tree, neither eastern nor western." }, ref: "النور 35" }
  - { title: { ar: "الأعناب", en: "Grapevines" }, body: { ar: "من ثمرات النخيل والأعناب.", en: "Among the fruits of date-palms and grapevines." }, ref: "النحل 67" }
  - { title: { ar: "الرمان", en: "Pomegranates" }, body: { ar: "من فاكهة الجنة.", en: "Among the fruits of Paradise." }, ref: "الرحمن 68" }
  - { title: { ar: "السدر", en: "Lote trees" }, body: { ar: "سدر مخضود من نعيم الجنة.", en: "Thornless lote trees among Paradise's bliss." }, ref: "الواقعة 28" }
  - { title: { ar: "التين", en: "Figs" }, body: { ar: "يُقسم به مع الزيتون.", en: "Sworn by alongside the olive." }, ref: "التين 1" }
  - { title: { ar: "اليقطين", en: "Gourd" }, body: { ar: "أنبتها الله على يونس.", en: "God grew it over Yunus." }, ref: "الصافات 146" }
  - { title: { ar: "الزنجبيل", en: "Ginger" }, body: { ar: "من شراب أهل الجنة.", en: "Among the drink of Paradise's people." }, ref: "الإنسان 17" }
  - { title: { ar: "الريحان", en: "Sweet basil" }, body: { ar: "والحب ذو العصف والريحان.", en: "Grain with husk, and fragrant basil." }, ref: "الرحمن 12" }
