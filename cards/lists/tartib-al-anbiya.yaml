slug: tartib-al-anbiya
title: { ar: "تسلسل الأنبياء", en: "The sequence of the prophets", fr: "La succession des prophètes" }
lede:
  ar: "خمسة وعشرون نبيًا ذُكروا في القرآن — رسالة واحدة عبر التاريخ."
  en: "Twenty-five prophets named in the Quran — one message across history."
  fr: "Vingt-cinq prophètes nommés dans le Coran : un même message à travers l’histoire."
source_card: 11c112d4
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
note:
  ar: "ترتيب بعض الأنبياء (كإلياس وإليسع) محل خلاف بين العلماء."
  en: "The order of some prophets (e.g. Ilyas and al-Yasa') is debated among scholars."
  fr: L’ordre de certains prophètes, comme Élie et Élisée, fait l’objet de divergences entre les savants.
items:
  - { title: { ar: "آدم", en: "Adam", fr: "Adam" }, body: { ar: "أبو البشر وأول الأنبياء.", en: "Father of humanity and the first prophet.", fr: "Le père de l’humanité et le premier des prophètes." } }
  - { title: { ar: "إدريس", en: "Idris", fr: "Idris" }, body: { ar: "نبي رفعه الله مكانًا عليًّا.", en: "A prophet God raised to a high station.", fr: "Un prophète que Dieu élève à un rang éminent." } }
  - { title: { ar: "نوح", en: "Nuh (Noah)", fr: "Noé" }, body: { ar: "دعا قومه 950 سنة، ونجا بالسفينة.", en: "Called his people for 950 years; saved by the Ark.", fr: "Il appelle son peuple pendant 950 ans et est sauvé par l’arche." } }
  - { title: { ar: "هود", en: "Hud", fr: "Houd" }, body: { ar: "أُرسل إلى قوم عاد.", en: "Sent to the people of 'Ad.", fr: "Il est envoyé au peuple de Ad." } }
  - { title: { ar: "صالح", en: "Salih", fr: "Salih" }, body: { ar: "أُرسل إلى ثمود، وآيته الناقة.", en: "Sent to Thamud; his sign was the she-camel.", fr: "Il est envoyé aux Thamoud ; la chamelle constitue son signe." } }
  - { title: { ar: "إبراهيم", en: "Ibrahim (Abraham)", fr: "Abraham" }, body: { ar: "خليل الله وأبو الأنبياء.", en: "The Friend of God and father of the prophets.", fr: "L’ami intime de Dieu et le père des prophètes." } }
  - { title: { ar: "لوط", en: "Lut (Lot)", fr: "Loth" }, body: { ar: "أُرسل إلى قومه لينهاهم عن الفاحشة.", en: "Sent to his people to forbid indecency.", fr: "Il est envoyé à son peuple pour le détourner de l’inconduite." } }
  - { title: { ar: "إسماعيل", en: "Isma'il (Ishmael)", fr: "Ismaël" }, body: { ar: "الذبيح، وجدّ العرب.", en: "The intended sacrifice; forefather of the Arabs.", fr: "Associé au récit du sacrifice et ancêtre des Arabes." } }
  - { title: { ar: "إسحاق", en: "Ishaq (Isaac)", fr: "Isaac" }, body: { ar: "نبي من ذرية إبراهيم.", en: "A prophet from Ibrahim's progeny.", fr: "Un prophète de la descendance d’Abraham." } }
  - { title: { ar: "يعقوب", en: "Ya'qub (Jacob)", fr: "Jacob" }, body: { ar: "أبو الأسباط، ولُقّب بإسرائيل.", en: "Father of the tribes; called Isra'il.", fr: "Le père des tribus, également appelé Israël." } }
  - { title: { ar: "يوسف", en: "Yusuf (Joseph)", fr: "Joseph" }, body: { ar: "الصدّيق، وقصته أحسن القصص.", en: "The truthful one; his story is the best of stories.", fr: "Le véridique, dont le récit occupe une place particulière dans le Coran." } }
  - { title: { ar: "شعيب", en: "Shu'ayb", fr: "Chouayb" }, body: { ar: "أُرسل إلى مدين لينهاهم عن التطفيف.", en: "Sent to Midian against cheating in measure.", fr: "Il est envoyé à Madyan pour dénoncer la fraude dans les mesures." } }
  - { title: { ar: "أيوب", en: "Ayyub (Job)", fr: "Job" }, body: { ar: "نبي الصبر على البلاء.", en: "The prophet of patience in affliction.", fr: "Le prophète de la patience dans l’épreuve." } }
  - { title: { ar: "ذو الكفل", en: "Dhu al-Kifl", fr: "Dhou al-Kifl" }, body: { ar: "من الصالحين المذكورين في القرآن.", en: "Among the righteous named in the Quran.", fr: "L’un des justes mentionnés dans le Coran." } }
  - { title: { ar: "موسى", en: "Musa (Moses)", fr: "Moïse" }, body: { ar: "كليم الله، أُرسل إلى فرعون وبني إسرائيل.", en: "The one God spoke to; sent to Pharaoh and Bani Isra'il.", fr: "Dieu lui parle ; il est envoyé à Pharaon et aux fils d’Israël." } }
  - { title: { ar: "هارون", en: "Harun (Aaron)", fr: "Aaron" }, body: { ar: "أخو موسى ووزيره.", en: "Musa's brother and minister.", fr: "Le frère et l’auxiliaire de Moïse." } }
  - { title: { ar: "داود", en: "Dawud (David)", fr: "David" }, body: { ar: "آتاه الله الملك والحكمة والزبور.", en: "Given kingship, wisdom, and the Psalms.", fr: "Dieu lui accorde la royauté, la sagesse et les Psaumes." } }
  - { title: { ar: "سليمان", en: "Sulayman (Solomon)", fr: "Salomon" }, body: { ar: "ملك لا ينبغي لأحد من بعده.", en: "A kingdom granted to none after him.", fr: "Il reçoit une royauté sans équivalent après lui." } }
  - { title: { ar: "إلياس", en: "Ilyas (Elijah)", fr: "Élie" }, body: { ar: "دعا قومه إلى ترك عبادة بعل.", en: "Called his people to abandon Baal worship.", fr: "Il appelle son peuple à abandonner le culte de Baal." } }
  - { title: { ar: "إليسع", en: "Al-Yasa' (Elisha)", fr: "Élisée" }, body: { ar: "من المرسلين الأخيار.", en: "Among the excellent messengers.", fr: "L’un des messagers vertueux." } }
  - { title: { ar: "يونس", en: "Yunus (Jonah)", fr: "Jonas" }, body: { ar: "ذو النون، نجا بدعائه في بطن الحوت.", en: "Dhu al-Nun; saved by his du'a in the whale's belly.", fr: "L’homme au poisson, sauvé après son invocation dans le ventre du poisson." } }
  - { title: { ar: "زكريا", en: "Zakariyya (Zechariah)", fr: "Zacharie" }, body: { ar: "كفل مريم ودعا فرزق بيحيى.", en: "Guardian of Maryam; granted Yahya in old age.", fr: "Il prend soin de Marie ; après son invocation, Jean lui est accordé." } }
  - { title: { ar: "يحيى", en: "Yahya (John)", fr: "Jean" }, body: { ar: "سيدًا وحصورًا ونبيًا من الصالحين.", en: "Noble, chaste, a prophet among the righteous.", fr: "Un prophète juste, noble et chaste." } }
  - { title: { ar: "عيسى", en: "'Isa (Jesus)", fr: "Jésus" }, body: { ar: "كلمة الله وروحه، أُيّد بالمعجزات.", en: "God's word and spirit; aided with miracles.", fr: "Parole et esprit venant de Dieu, soutenu par des miracles." } }
  - { title: { ar: "محمد", en: "Muhammad", fr: "Muhammad" }, body: { ar: "خاتم النبيين ورحمة للعالمين.", en: "The seal of the prophets; a mercy to the worlds.", fr: "Le sceau des prophètes, présenté comme une miséricorde pour les mondes." } }
