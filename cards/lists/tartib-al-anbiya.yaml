slug: tartib-al-anbiya
title: { ar: "تسلسل الأنبياء", en: "The sequence of the prophets" }
lede:
  ar: "خمسة وعشرون نبيًا ذُكروا في القرآن — رسالة واحدة عبر التاريخ."
  en: "Twenty-five prophets named in the Quran — one message across history."
source_card: 11c112d4
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
note:
  ar: "ترتيب بعض الأنبياء (كإلياس وإليسع) محل خلاف بين العلماء."
  en: "The order of some prophets (e.g. Ilyas and al-Yasa') is debated among scholars."
items:
  - { title: { ar: "آدم", en: "Adam" }, body: { ar: "أبو البشر وأول الأنبياء.", en: "Father of humanity and the first prophet." } }
  - { title: { ar: "إدريس", en: "Idris" }, body: { ar: "نبي رفعه الله مكانًا عليًّا.", en: "A prophet God raised to a high station." } }
  - { title: { ar: "نوح", en: "Nuh (Noah)" }, body: { ar: "دعا قومه 950 سنة، ونجا بالسفينة.", en: "Called his people for 950 years; saved by the Ark." } }
  - { title: { ar: "هود", en: "Hud" }, body: { ar: "أُرسل إلى قوم عاد.", en: "Sent to the people of 'Ad." } }
  - { title: { ar: "صالح", en: "Salih" }, body: { ar: "أُرسل إلى ثمود، وآيته الناقة.", en: "Sent to Thamud; his sign was the she-camel." } }
  - { title: { ar: "إبراهيم", en: "Ibrahim (Abraham)" }, body: { ar: "خليل الله وأبو الأنبياء.", en: "The Friend of God and father of the prophets." } }
  - { title: { ar: "لوط", en: "Lut (Lot)" }, body: { ar: "أُرسل إلى قومه لينهاهم عن الفاحشة.", en: "Sent to his people to forbid indecency." } }
  - { title: { ar: "إسماعيل", en: "Isma'il (Ishmael)" }, body: { ar: "الذبيح، وجدّ العرب.", en: "The intended sacrifice; forefather of the Arabs." } }
  - { title: { ar: "إسحاق", en: "Ishaq (Isaac)" }, body: { ar: "نبي من ذرية إبراهيم.", en: "A prophet from Ibrahim's progeny." } }
  - { title: { ar: "يعقوب", en: "Ya'qub (Jacob)" }, body: { ar: "أبو الأسباط، ولُقّب بإسرائيل.", en: "Father of the tribes; called Isra'il." } }
  - { title: { ar: "يوسف", en: "Yusuf (Joseph)" }, body: { ar: "الصدّيق، وقصته أحسن القصص.", en: "The truthful one; his story is the best of stories." } }
  - { title: { ar: "شعيب", en: "Shu'ayb" }, body: { ar: "أُرسل إلى مدين لينهاهم عن التطفيف.", en: "Sent to Midian against cheating in measure." } }
  - { title: { ar: "أيوب", en: "Ayyub (Job)" }, body: { ar: "نبي الصبر على البلاء.", en: "The prophet of patience in affliction." } }
  - { title: { ar: "ذو الكفل", en: "Dhu al-Kifl" }, body: { ar: "من الصالحين المذكورين في القرآن.", en: "Among the righteous named in the Quran." } }
  - { title: { ar: "موسى", en: "Musa (Moses)" }, body: { ar: "كليم الله، أُرسل إلى فرعون وبني إسرائيل.", en: "The one God spoke to; sent to Pharaoh and Bani Isra'il." } }
  - { title: { ar: "هارون", en: "Harun (Aaron)" }, body: { ar: "أخو موسى ووزيره.", en: "Musa's brother and minister." } }
  - { title: { ar: "داود", en: "Dawud (David)" }, body: { ar: "آتاه الله الملك والحكمة والزبور.", en: "Given kingship, wisdom, and the Psalms." } }
  - { title: { ar: "سليمان", en: "Sulayman (Solomon)" }, body: { ar: "ملك لا ينبغي لأحد من بعده.", en: "A kingdom granted to none after him." } }
  - { title: { ar: "إلياس", en: "Ilyas (Elijah)" }, body: { ar: "دعا قومه إلى ترك عبادة بعل.", en: "Called his people to abandon Baal worship." } }
  - { title: { ar: "إليسع", en: "Al-Yasa' (Elisha)" }, body: { ar: "من المرسلين الأخيار.", en: "Among the excellent messengers." } }
  - { title: { ar: "يونس", en: "Yunus (Jonah)" }, body: { ar: "ذو النون، نجا بدعائه في بطن الحوت.", en: "Dhu al-Nun; saved by his du'a in the whale's belly." } }
  - { title: { ar: "زكريا", en: "Zakariyya (Zechariah)" }, body: { ar: "كفل مريم ودعا فرزق بيحيى.", en: "Guardian of Maryam; granted Yahya in old age." } }
  - { title: { ar: "يحيى", en: "Yahya (John)" }, body: { ar: "سيدًا وحصورًا ونبيًا من الصالحين.", en: "Noble, chaste, a prophet among the righteous." } }
  - { title: { ar: "عيسى", en: "'Isa (Jesus)" }, body: { ar: "كلمة الله وروحه، أُيّد بالمعجزات.", en: "God's word and spirit; aided with miracles." } }
  - { title: { ar: "محمد", en: "Muhammad" }, body: { ar: "خاتم النبيين ورحمة للعالمين.", en: "The seal of the prophets; a mercy to the worlds." } }
