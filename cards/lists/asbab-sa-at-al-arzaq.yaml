slug: asbab-sa-at-al-arzaq
title:
  ar: أسباب سعة الرزق
  en: Causes of expanded provision
  fr: Les voies de l’abondance des subsistances
  tr: Ekmek Yapma Nedenleri
  id: Alasan Membuat Roti
lede:
  ar: عشرة أسباب من القرآن والسنة تفتح أبواب الرزق.
  en: Ten causes from the Quran and Sunna that open the doors of provision.
  fr: Dix voies présentées dans le Coran et la Sunna comme favorisant les subsistances.
  tr: Kur'an ve Sünnet'ten on sebep geçim kapılarını açar.
  id: Sepuluh alasan dari Al-Qur'an dan Sunnah membuka pintu kehidupan.
source_card: 94d53935
status:
  review: draft
quiz: true
note:
  ar: الأحاديث المذكورة تحتاج مراجعة تخريج قبل النشر النهائي.
  en: Cited hadiths need grading review before final publication.
  fr: Les hadiths cités nécessitent une vérification de leur référencement et de leur authenticité avant publication définitive.
  tr: Bahsedilen hadislerin nihai yayımlanmadan önce doğrulama gerekmektedir.
  id: Hadis-hadis yang disebutkan memerlukan verifikasi sebelum publikasi akhir.
items:
- title:
    ar: التقوى
    en: Taqwa
    fr: La conscience de Dieu
    tr: dindarlık
    id: kesalehan
  body:
    ar: من يتق الله يجعل له مخرجًا ويرزقه من حيث لا يحتسب.
    en: Whoever is conscious of God, He makes a way out and provides unexpectedly.
    fr: Le verset évoque une issue et des subsistances inattendues pour celui qui reste conscient de Dieu.
    tr: Allah'tan korkan kimse, ona bir çıkış yolu açar ve beklemediği yerden ona yardım eder.
    id: Siapa pun yang takut kepada Allah, Dia akan membuka jalan keluar dan menyediakan untuknya dari tempat yang tidak dia duga.
  ref: الطلاق 2–3
  verify: نص الآية من تنزيل عند العرض
- title:
    ar: الاستغفار
    en: Istighfar
    fr: La demande de pardon
    tr: af aramak
    id: mencari pengampunan
  body:
    ar: استغفروا ربكم إنه كان غفارًا يرسل السماء عليكم مدرارًا.
    en: Seek your Lord's forgiveness; He sends the sky down in abundance.
    fr: Les versets évoquent le pardon divin et une pluie abondante en lien avec la demande de pardon.
    tr: Rabbinizden af dileyin; gerçekten O, her zaman bağışlayandır ve üzerinize gökyüzü bolca gönderir.
    id: Mintalah ampun kepada Tuhanmu; sesungguhnya, Dia selalu Maha Ampun, dan Dia mengirimkan langit kepadamu dengan melimpah.
  ref: نوح 10–11
  verify: نص الآية من تنزيل عند العرض
- title:
    ar: الشكر
    en: Gratitude
    fr: La gratitude
    tr: Teşekkürler
    id: Terima kasih
  body:
    ar: لئن شكرتم لأزيدنكم.
    en: If you are grateful, I will increase you.
    fr: Le verset associe la gratitude à un accroissement des bienfaits.
    tr: Minnettarsan, seni artıracağım.
    id: Jika kamu bersyukur, aku akan menambahkanmu.
  ref: إبراهيم 7
  verify: نص الآية من تنزيل عند العرض
- title:
    ar: صلة الرحم
    en: Kinship ties
    fr: Les liens de parenté
    tr: Akrabalık bağları
    id: Ikatan kekerabatan
  body:
    ar: صلة الرحم تزيد في الرزق وتبارك في العمر.
    en: Kinship ties increase provision and bless one's lifespan.
    fr: La tradition associe l’entretien des liens de parenté à des subsistances accrues et à une vie bénie.
    tr: Aile bağlarını sürdürmek, geçimleri artırır ve yaşamı kutsar.
    id: Menjaga ikatan keluarga meningkatkan kelangsungan hidup dan memberkati hidup.
  ref: رواه البخاري
  verify: مراجعة اللفظ والرقم
- title:
    ar: الصدقة
    en: Charity
    fr: L’aumône
    tr: Hayırseverlik
    id: Amal
  body:
    ar: ما أنفقتم من شيء فهو يخلفه.
    en: Whatever you spend, He replaces it.
    fr: Le verset évoque le remplacement par Dieu de ce qui est dépensé.
    tr: Ne harcarsan, geride bırakır.
    id: Apa pun yang kamu keluarkan, itu akan tertinggal.
  ref: سبأ 39
  verify: نص الآية من تنزيل عند العرض
- title:
    ar: البكور
    en: Early rising
    fr: Se lever tôt
    tr: sabah erken saatlerde
    id: Pagi Hari
  body:
    ar: البركة في البكور؛ بورك لأمتي في بكورها.
    en: Blessing lies in early rising.
    fr: La tradition associe une bénédiction aux premières heures du matin.
    tr: Bereket ilk günlerdedir; kutsanmış milletim ilk günlerinde.
    id: Berkat ada di hari-hari awal; diberkatilah bangsa-Ku di hari-hari awalnya.
  ref: رواه أبو داود
  verify: مراجعة اللفظ والتخريج
- title:
    ar: الحج والعمرة
    en: Hajj and 'Umra
    fr: Le hajj et la omra
    tr: Hac ve Umre
    id: Haji dan Umrah
  body:
    ar: تابعوا بين الحج والعمرة فإنهما ينفيان الفقر.
    en: Follow Hajj with 'Umra; they repel poverty.
    fr: Le récit associe la succession du hajj et de la omra à l’éloignement de la pauvreté.
    tr: Hac ile Umre arasında devam edin, çünkü yoksulluğu ortadan kaldırırlar.
    id: Lanjutkan antara Haji dan Umrah, karena mereka menghapus kemiskinan.
  ref: رواه الترمذي
  verify: مراجعة اللفظ والتخريج
- title:
    ar: إعانة الضعفاء
    en: Helping the weak
    fr: Aider les personnes vulnérables
    tr: Savunmasızlara Yardım
    id: Bantuan untuk yang Rentan
  body:
    ar: هل تنصرون وترزقون إلا بضعفائكم.
    en: Are you not aided and provided for through your weak?
    fr: Le hadith relie l’aide et les subsistances reçues à la présence des plus vulnérables.
    tr: Zayıflığınız dışında hiçbir şeyi destekliyor ve sağlıyor musunuz?
    id: Apakah kamu mendukung dan menyediakan apa pun kecuali melalui kelemahanmu?
  ref: رواه البخاري
  verify: مراجعة اللفظ والرقم
- title:
    ar: النكاح
    en: Marriage
    fr: Le mariage
    tr: Evlilik
    id: Pernikahan
  body:
    ar: التمسوا الرزق بالنكاح.
    en: Seek provision through marriage.
    fr: Le récit invite à rechercher des subsistances par le mariage.
    tr: Geçimini evlilik yoluyla arayın.
    id: Cari penghidupan melalui pernikahan.
  ref: رواه الترمذي
  verify: مراجعة اللفظ والتخريج
- title:
    ar: التوكل
    en: Trust in God
    fr: La confiance en Dieu
    tr: Tawakkol
    id: Tawakkol
  body:
    ar: لو توكلتم على الله حق توكله لرزقكم كما يرزق الطير.
    en: If you trusted God truly, He would provide as He provides the birds.
    fr: Le hadith compare les subsistances de ceux qui font pleinement confiance à Dieu à celles des oiseaux.
    tr: Eğer gerçekten Tanrı'ya güvenirsen, O sana bir kuşun sağladığı gibi bakacaktır.
    id: Jika Anda benar-benar menaruh kepercayaan kepada Tuhan, Dia akan menyediakan untuk Anda seperti burung yang menyediakan.
  ref: رواه الترمذي
  verify: مراجعة اللفظ والتخريج
