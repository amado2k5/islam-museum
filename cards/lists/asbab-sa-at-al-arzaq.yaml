slug: asbab-sa-at-al-arzaq
title: { ar: "أسباب سعة الرزق", en: "Causes of expanded provision", fr: "Les voies de l’abondance des subsistances" }
lede:
  ar: "عشرة أسباب من القرآن والسنة تفتح أبواب الرزق."
  en: "Ten causes from the Quran and Sunna that open the doors of provision."
  fr: Dix voies présentées dans le Coran et la Sunna comme favorisant les subsistances.
source_card: 94d53935
status: { review: draft }
quiz: true
note:
  ar: "الأحاديث المذكورة تحتاج مراجعة تخريج قبل النشر النهائي."
  en: "Cited hadiths need grading review before final publication."
  fr: Les hadiths cités nécessitent une vérification de leur référencement et de leur authenticité avant publication définitive.
items:
  - { title: { ar: "التقوى", en: "Taqwa", fr: "La conscience de Dieu" }, body: { ar: "من يتق الله يجعل له مخرجًا ويرزقه من حيث لا يحتسب.", en: "Whoever is conscious of God, He makes a way out and provides unexpectedly.", fr: "Le verset évoque une issue et des subsistances inattendues pour celui qui reste conscient de Dieu." }, ref: "الطلاق 2–3", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "الاستغفار", en: "Istighfar", fr: "La demande de pardon" }, body: { ar: "استغفروا ربكم إنه كان غفارًا يرسل السماء عليكم مدرارًا.", en: "Seek your Lord's forgiveness; He sends the sky down in abundance.", fr: "Les versets évoquent le pardon divin et une pluie abondante en lien avec la demande de pardon." }, ref: "نوح 10–11", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "الشكر", en: "Gratitude", fr: "La gratitude" }, body: { ar: "لئن شكرتم لأزيدنكم.", en: "If you are grateful, I will increase you.", fr: "Le verset associe la gratitude à un accroissement des bienfaits." }, ref: "إبراهيم 7", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "صلة الرحم", en: "Kinship ties", fr: "Les liens de parenté" }, body: { ar: "صلة الرحم تزيد في الرزق وتبارك في العمر.", en: "Kinship ties increase provision and bless one's lifespan.", fr: "La tradition associe l’entretien des liens de parenté à des subsistances accrues et à une vie bénie." }, ref: "رواه البخاري", verify: "مراجعة اللفظ والرقم" }
  - { title: { ar: "الصدقة", en: "Charity", fr: "L’aumône" }, body: { ar: "ما أنفقتم من شيء فهو يخلفه.", en: "Whatever you spend, He replaces it.", fr: "Le verset évoque le remplacement par Dieu de ce qui est dépensé." }, ref: "سبأ 39", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "البكور", en: "Early rising", fr: "Se lever tôt" }, body: { ar: "البركة في البكور؛ بورك لأمتي في بكورها.", en: "Blessing lies in early rising.", fr: "La tradition associe une bénédiction aux premières heures du matin." }, ref: "رواه أبو داود", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "الحج والعمرة", en: "Hajj and 'Umra", fr: "Le hajj et la omra" }, body: { ar: "تابعوا بين الحج والعمرة فإنهما ينفيان الفقر.", en: "Follow Hajj with 'Umra; they repel poverty.", fr: "Le récit associe la succession du hajj et de la omra à l’éloignement de la pauvreté." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "إعانة الضعفاء", en: "Helping the weak", fr: "Aider les personnes vulnérables" }, body: { ar: "هل تنصرون وترزقون إلا بضعفائكم.", en: "Are you not aided and provided for through your weak?", fr: "Le hadith relie l’aide et les subsistances reçues à la présence des plus vulnérables." }, ref: "رواه البخاري", verify: "مراجعة اللفظ والرقم" }
  - { title: { ar: "النكاح", en: "Marriage", fr: "Le mariage" }, body: { ar: "التمسوا الرزق بالنكاح.", en: "Seek provision through marriage.", fr: "Le récit invite à rechercher des subsistances par le mariage." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "التوكل", en: "Trust in God", fr: "La confiance en Dieu" }, body: { ar: "لو توكلتم على الله حق توكله لرزقكم كما يرزق الطير.", en: "If you trusted God truly, He would provide as He provides the birds.", fr: "Le hadith compare les subsistances de ceux qui font pleinement confiance à Dieu à celles des oiseaux." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
