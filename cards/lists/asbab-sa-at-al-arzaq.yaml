slug: asbab-sa-at-al-arzaq
title: { ar: "أسباب سعة الرزق", en: "Causes of expanded provision" }
lede:
  ar: "عشرة أسباب من القرآن والسنة تفتح أبواب الرزق."
  en: "Ten causes from the Quran and Sunna that open the doors of provision."
source_card: 94d53935
status: { review: draft }
quiz: true
note:
  ar: "الأحاديث المذكورة تحتاج مراجعة تخريج قبل النشر النهائي."
  en: "Cited hadiths need grading review before final publication."
items:
  - { title: { ar: "التقوى", en: "Taqwa" }, body: { ar: "من يتق الله يجعل له مخرجًا ويرزقه من حيث لا يحتسب.", en: "Whoever is conscious of God, He makes a way out and provides unexpectedly." }, ref: "الطلاق 2–3", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "الاستغفار", en: "Istighfar" }, body: { ar: "استغفروا ربكم إنه كان غفارًا يرسل السماء عليكم مدرارًا.", en: "Seek your Lord's forgiveness; He sends the sky down in abundance." }, ref: "نوح 10–11", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "الشكر", en: "Gratitude" }, body: { ar: "لئن شكرتم لأزيدنكم.", en: "If you are grateful, I will increase you." }, ref: "إبراهيم 7", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "صلة الرحم", en: "Kinship ties" }, body: { ar: "صلة الرحم تزيد في الرزق وتبارك في العمر.", en: "Kinship ties increase provision and bless one's lifespan." }, ref: "رواه البخاري", verify: "مراجعة اللفظ والرقم" }
  - { title: { ar: "الصدقة", en: "Charity" }, body: { ar: "ما أنفقتم من شيء فهو يخلفه.", en: "Whatever you spend, He replaces it." }, ref: "سبأ 39", verify: "نص الآية من تنزيل عند العرض" }
  - { title: { ar: "البكور", en: "Early rising" }, body: { ar: "البركة في البكور؛ بورك لأمتي في بكورها.", en: "Blessing lies in early rising." }, ref: "رواه أبو داود", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "الحج والعمرة", en: "Hajj and 'Umra" }, body: { ar: "تابعوا بين الحج والعمرة فإنهما ينفيان الفقر.", en: "Follow Hajj with 'Umra; they repel poverty." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "إعانة الضعفاء", en: "Helping the weak" }, body: { ar: "هل تنصرون وترزقون إلا بضعفائكم.", en: "Are you not aided and provided for through your weak?" }, ref: "رواه البخاري", verify: "مراجعة اللفظ والرقم" }
  - { title: { ar: "النكاح", en: "Marriage" }, body: { ar: "التمسوا الرزق بالنكاح.", en: "Seek provision through marriage." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
  - { title: { ar: "التوكل", en: "Trust in God" }, body: { ar: "لو توكلتم على الله حق توكله لرزقكم كما يرزق الطير.", en: "If you trusted God truly, He would provide as He provides the birds." }, ref: "رواه الترمذي", verify: "مراجعة اللفظ والتخريج" }
