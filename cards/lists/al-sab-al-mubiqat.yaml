slug: al-sab-al-mubiqat
title: { ar: "السبع الموبقات", en: "The seven destructive sins" }
lede:
  ar: "سبع كبائر حذّر منها النبي — رواه البخاري ومسلم."
  en: "Seven grave sins the Prophet warned against — narrated by Bukhari and Muslim."
source_card: 1b2e8d6b
status: { review: draft }
quiz: true
items:
  - title: { ar: "الشرك بالله", en: "Associating partners with God" }
    body: { ar: "أعظم الذنوب: عبادة غير الله معه.", en: "The gravest sin: worshipping other than God alongside Him." }
  - title: { ar: "السحر", en: "Sorcery" }
    body: { ar: "السحر من الكبائر لما فيه من الكفر والأذى.", en: "Sorcery is among the gravest sins for its disbelief and harm." }
  - title: { ar: "قتل النفس", en: "Murder" }
    body: { ar: "قتل النفس التي حرم الله إلا بالحق.", en: "Killing a soul God has forbidden, except by right." }
  - title: { ar: "أكل الربا", en: "Consuming usury" }
    body: { ar: "أكل الربا من الموبقات لظلمه وفساده.", en: "Consuming usury, for its injustice and corruption." }
  - title: { ar: "أكل مال اليتيم", en: "Consuming the orphan's wealth" }
    body: { ar: "الاعتداء على مال اليتيم الضعيف.", en: "Wrongfully taking the wealth of the vulnerable orphan." }
  - title: { ar: "التولي يوم الزحف", en: "Fleeing the battlefield" }
    body: { ar: "الفرار من الجهاد عند التحام الصفوف.", en: "Deserting the ranks when the lines meet." }
  - title: { ar: "قذف المحصنات", en: "Slandering chaste women" }
    body: { ar: "اتهام العفيفات بالفاحشة بلا بينة.", en: "Accusing chaste women of indecency without proof." }
