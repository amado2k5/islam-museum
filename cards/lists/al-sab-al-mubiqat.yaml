slug: al-sab-al-mubiqat
title: { ar: "السبع الموبقات", en: "The seven destructive sins", fr: "Les sept péchés destructeurs" }
lede:
  ar: "سبع كبائر حذّر منها النبي — رواه البخاري ومسلم."
  en: "Seven grave sins the Prophet warned against — narrated by Bukhari and Muslim."
  fr: Sept fautes majeures contre lesquelles le Prophète a mis en garde, selon un hadith rapporté par al-Boukhari et Muslim.
source_card: 1b2e8d6b
status: { review: draft }
quiz: true
items:
  - title: { ar: "الشرك بالله", en: "Associating partners with God", fr: "Associer d’autres divinités à Dieu" }
    body: { ar: "أعظم الذنوب: عبادة غير الله معه.", en: "The gravest sin: worshipping other than God alongside Him.", fr: "Le péché tenu pour le plus grave : adorer autre chose que Dieu en l’associant à Lui." }
  - title: { ar: "السحر", en: "Sorcery", fr: "La sorcellerie" }
    body: { ar: "السحر من الكبائر لما فيه من الكفر والأذى.", en: "Sorcery is among the gravest sins for its disbelief and harm.", fr: "La sorcellerie figure parmi les fautes majeures en raison de l’incroyance et du tort qui lui sont associés." }
  - title: { ar: "قتل النفس", en: "Murder", fr: "Le meurtre" }
    body: { ar: "قتل النفس التي حرم الله إلا بالحق.", en: "Killing a soul God has forbidden, except by right.", fr: "Tuer une personne dont Dieu a rendu la vie inviolable, hors des cas reconnus par le droit." }
  - title: { ar: "أكل الربا", en: "Consuming usury", fr: "Vivre de l’usure" }
    body: { ar: "أكل الربا من الموبقات لظلمه وفساده.", en: "Consuming usury, for its injustice and corruption.", fr: "L’usure figure parmi les fautes destructrices en raison de l’injustice et de la corruption qu’elle entraîne." }
  - title: { ar: "أكل مال اليتيم", en: "Consuming the orphan's wealth", fr: "S’approprier les biens de l’orphelin" }
    body: { ar: "الاعتداء على مال اليتيم الضعيف.", en: "Wrongfully taking the wealth of the vulnerable orphan.", fr: "Prendre injustement les biens d’un orphelin vulnérable." }
  - title: { ar: "التولي يوم الزحف", en: "Fleeing the battlefield", fr: "Fuir le champ de bataille" }
    body: { ar: "الفرار من الجهاد عند التحام الصفوف.", en: "Deserting the ranks when the lines meet.", fr: "Déserter les rangs au moment de l’affrontement." }
  - title: { ar: "قذف المحصنات", en: "Slandering chaste women", fr: "Calomnier les femmes chastes" }
    body: { ar: "اتهام العفيفات بالفاحشة بلا بينة.", en: "Accusing chaste women of indecency without proof.", fr: "Accuser des femmes chastes d’inconduite sans preuve." }
