slug: al-sab-al-mubiqat
title:
  ar: السبع الموبقات
  en: The seven destructive sins
  fr: Les sept péchés destructeurs
  tr: Yedi ölümcül
  id: Tujuh yang mematikan
lede:
  ar: سبع كبائر حذّر منها النبي — رواه البخاري ومسلم.
  en: Seven grave sins the Prophet warned against — narrated by Bukhari and Muslim.
  fr: Sept fautes majeures contre lesquelles le Prophète a mis en garde, selon un hadith rapporté par al-Boukhari et Muslim.
  tr: Peygamber'in uyarıda bulunduğu yedi büyük günah — El-Buhari ve Müslim tarafından rivayet edilmiştir.
  id: Tujuh dosa besar yang diperingatkan Nabi — diceritakan oleh Al-Bukhari dan Muslim.
source_card: 1b2e8d6b
status:
  review: draft
quiz: true
items:
- title:
    ar: الشرك بالله
    en: Associating partners with God
    fr: Associer d’autres divinités à Dieu
    tr: Allah'la ortak olmak
    id: Mengaitkan mitra dengan Allah
  body:
    ar: 'أعظم الذنوب: عبادة غير الله معه.'
    en: 'The gravest sin: worshipping other than God alongside Him.'
    fr: 'Le péché tenu pour le plus grave : adorer autre chose que Dieu en l’associant à Lui.'
    tr: 'En büyük günahlar: Allah''tan başka birine O''nun yanında ibadet etmek.'
    id: 'Dosa terbesar: beribadah selain Allah bersama-Nya.'
- title:
    ar: السحر
    en: Sorcery
    fr: La sorcellerie
    tr: Büyü
    id: Sihir
  body:
    ar: السحر من الكبائر لما فيه من الكفر والأذى.
    en: Sorcery is among the gravest sins for its disbelief and harm.
    fr: La sorcellerie figure parmi les fautes majeures en raison de l’incroyance et du tort qui lui sont associés.
    tr: Büyü, içinde barındırdığı inançsızlık ve zarar nedeniyle en büyük günahlardan biridir.
    id: Sihir adalah salah satu dosa besar karena ketidakpercayaan dan bahaya yang ditimbulkannya.
- title:
    ar: قتل النفس
    en: Murder
    fr: Le meurtre
    tr: Kendini öldürmek
    id: Bunuh diri
  body:
    ar: قتل النفس التي حرم الله إلا بالحق.
    en: Killing a soul God has forbidden, except by right.
    fr: Tuer une personne dont Dieu a rendu la vie inviolable, hors des cas reconnus par le droit.
    tr: Tanrı'nın hak dışında yasakladığı bir ruhun öldürülmesi.
    id: Membunuh jiwa yang telah dilarang Tuhan kecuali dengan hak.
- title:
    ar: أكل الربا
    en: Consuming usury
    fr: Vivre de l’usure
    tr: Faiz yemek
    id: Makan riba
  body:
    ar: أكل الربا من الموبقات لظلمه وفساده.
    en: Consuming usury, for its injustice and corruption.
    fr: L’usure figure parmi les fautes destructrices en raison de l’injustice et de la corruption qu’elle entraîne.
    tr: Tefecilik tüketmek, adaletsizlik ve yozlaşma nedeniyle ölümcül şeyler arasındadır.
    id: Mengonsumsi riba termasuk hal mematikan karena ketidakadilan dan korupsinya.
- title:
    ar: أكل مال اليتيم
    en: Consuming the orphan's wealth
    fr: S’approprier les biens de l’orphelin
    tr: Yetimin parasını yemek
    id: Memakan uang anak yatim
  body:
    ar: الاعتداء على مال اليتيم الضعيف.
    en: Wrongfully taking the wealth of the vulnerable orphan.
    fr: Prendre injustement les biens d’un orphelin vulnérable.
    tr: Zayıf bir yetimin malına saldırmak.
    id: Menyerang properti anak yatim yang lemah.
- title:
    ar: التولي يوم الزحف
    en: Fleeing the battlefield
    fr: Fuir le champ de bataille
    tr: Sürünme günü kontrolü ele geçirmek
    id: Mengambil alih pada hari merangkak
  body:
    ar: الفرار من الجهاد عند التحام الصفوف.
    en: Deserting the ranks when the lines meet.
    fr: Déserter les rangs au moment de l’affrontement.
    tr: Saflar birleştiğinde cihaddan kaçmak.
    id: Melarikan diri dari jihad saat barisan berkumpul.
- title:
    ar: قذف المحصنات
    en: Slandering chaste women
    fr: Calomnier les femmes chastes
    tr: Papatya atılması
    id: Pengeluaran chamomile
  body:
    ar: اتهام العفيفات بالفاحشة بلا بينة.
    en: Accusing chaste women of indecency without proof.
    fr: Accuser des femmes chastes d’inconduite sans preuve.
    tr: Kanıtsız iffetli kadınların ahlaksızlıkla suçlanması.
    id: Tuduhan perempuan suci atas ketidakmoralan tanpa bukti.
