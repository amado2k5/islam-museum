slug: mafatih-al-faraj
title: { ar: "مفاتيح الفرج", en: "Keys to relief" }
lede:
  ar: "عشرة مفاتيح تفتح أبواب الفرج بعد الشدة — من القرآن والسنة."
  en: "Ten keys that open relief after hardship — from the Quran and Sunna."
source_card: 9a150716
status: { review: draft }
quiz: true
items:
  - title: { ar: "التقوى", en: "Taqwa (God-consciousness)" }
    body:
      ar: "من يتق الله يجعل له مخرجًا ويرزقه من حيث لا يحتسب."
      en: "Whoever is conscious of God, He makes a way out for them."
    ref: "الطلاق 2–3"
  - title: { ar: "الاستغفار", en: "Istighfar (seeking forgiveness)" }
    body:
      ar: "كثرة الاستغفار تجلب الرزق وتكشف الكرب بإذن الله."
      en: "Frequent istighfar brings provision and lifts distress, by God's leave."
    ref: "نوح 10–12"
  - title: { ar: "الدعاء", en: "Du'a (supplication)" }
    body:
      ar: "الإلحاح في الدعاء، خاصة في أوقات الإجابة كالسحر وبين الأذان والإقامة."
      en: "Persistence in du'a, especially at answered times like the pre-dawn hours."
  - title: { ar: "الصلاة", en: "Prayer" }
    body:
      ar: "كان النبي إذا حزبه أمر فزع إلى الصلاة."
      en: "The Prophet would turn to prayer when a matter weighed on him."
  - title: { ar: "الصبر", en: "Patience" }
    body:
      ar: "الصبر مفتاح الفرج؛ إنما النصر مع الصبر والفرج مع الكرب."
      en: "Patience is the key to relief; victory comes with patience."
  - title: { ar: "التوكل", en: "Tawakkul (trust in God)" }
    body:
      ar: "تفويض الأمر إلى الله مع الأخذ بالأسباب."
      en: "Entrusting matters to God while taking the means."
  - title: { ar: "تلاوة القرآن", en: "Quran recitation" }
    body:
      ar: "القرآن شفاء لما في الصدور وطمأنينة للقلب."
      en: "The Quran is healing for hearts and tranquility for the soul."
    ref: "يونس 57"
  - title: { ar: "قيام الليل", en: "Night prayer" }
    body:
      ar: "ساعات الليل الأخيرة وقت النزول الإلهي وإجابة الدعاء."
      en: "The last hours of night are a time of divine descent and answered du'a."
  - title: { ar: "الصدقة", en: "Charity" }
    body:
      ar: "الصدقة تطفئ غضب الرب وتدفع البلاء."
      en: "Charity extinguishes the Lord's anger and repels calamity."
  - title: { ar: "حسن الظن بالله", en: "Good expectations of God" }
    body:
      ar: "أنا عند ظن عبدي بي — فليظن العبد بربه خيرًا."
      en: "'I am as My servant expects Me' — so expect good from your Lord."
