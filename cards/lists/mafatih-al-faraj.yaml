slug: mafatih-al-faraj
title:
  ar: مفاتيح الفرج
  en: Keys to relief
  fr: Les clés du soulagement
  tr: Vulva Anahtarları
  id: Kunci Vulva
lede:
  ar: عشرة مفاتيح تفتح أبواب الفرج بعد الشدة — من القرآن والسنة.
  en: Ten keys that open relief after hardship — from the Quran and Sunna.
  fr: Dix clés du soulagement après l’épreuve, tirées du Coran et de la Sunna.
  tr: Zorluklardan sonra kuranma kapılarını açan on anahtar — Kur'an ve Sünnet'ten.
  id: Sepuluh kunci yang membuka pintu kelegaan setelah kesulitan — dari Al-Qur'an dan Sunnah.
source_card: 9a150716
status:
  review: draft
quiz: true
items:
- title:
    ar: التقوى
    en: Taqwa (God-consciousness)
    fr: La conscience de Dieu
    tr: dindarlık
    id: kesalehan
  body:
    ar: من يتق الله يجعل له مخرجًا ويرزقه من حيث لا يحتسب.
    en: Whoever is conscious of God, He makes a way out for them.
    fr: Le verset évoque une issue et des subsistances inattendues pour celui qui reste conscient de Dieu.
    tr: Allah'tan korkan kimse, ona bir çıkış yolu açar ve beklemediği yerden ona yardım eder.
    id: Siapa pun yang takut kepada Allah, Dia akan membuka jalan keluar dan menyediakan untuknya dari tempat yang tidak dia duga.
  ref: الطلاق 2–3
- title:
    ar: الاستغفار
    en: Istighfar (seeking forgiveness)
    fr: La demande de pardon
    tr: af aramak
    id: mencari pengampunan
  body:
    ar: كثرة الاستغفار تجلب الرزق وتكشف الكرب بإذن الله.
    en: Frequent istighfar brings provision and lifts distress, by God's leave.
    fr: La demande fréquente de pardon est associée aux subsistances et au soulagement, avec la permission de Dieu.
    tr: Sık sık af aramak, Allah izniyle besin sağlar ve sıkıntıyı ortadan kaldırır.
    id: Pencarian pengampunan yang sering akan membawa keberuntungan dan menghilangkan kesedihan, jika Tuhan mengizinkan.
  ref: نوح 10–12
- title:
    ar: الدعاء
    en: Du'a (supplication)
    fr: L’invocation
    tr: Dua
    id: Doa
  body:
    ar: الإلحاح في الدعاء، خاصة في أوقات الإجابة كالسحر وبين الأذان والإقامة.
    en: Persistence in du'a, especially at answered times like the pre-dawn hours.
    fr: La persévérance dans l’invocation, notamment en fin de nuit et entre l’adhan et l’iqama.
    tr: Özellikle namaz ile ikama arasındaki suhu gibi karşılık zamanlarında dua ısrarı göstermek.
    id: Ketekunan dalam permohonan, terutama pada saat-saat respons seperti suhoor, antara panggilan shalat, dan iqama.
- title:
    ar: الصلاة
    en: Prayer
    fr: La prière
    tr: Dua
    id: Doa
  body:
    ar: كان النبي إذا حزبه أمر فزع إلى الصلاة.
    en: The Prophet would turn to prayer when a matter weighed on him.
    fr: Selon le récit, le Prophète se tournait vers la prière lorsqu’une difficulté le préoccupait.
    tr: Peygamber bunalmışsa, dua etmeye korkacaktı.
    id: Jika Nabi kewalahan, ia akan terkejut untuk berdoa.
- title:
    ar: الصبر
    en: Patience
    fr: La patience
    tr: Sabır
    id: Kesabaran
  body:
    ar: الصبر مفتاح الفرج؛ إنما النصر مع الصبر والفرج مع الكرب.
    en: Patience is the key to relief; victory comes with patience.
    fr: La tradition associe patience, victoire et soulagement après l’épreuve.
    tr: Sabır rahatlamanın anahtarıdır; zafer sabırla gelir, rahatlama ise sıkıntıyla gelir.
    id: Kesabaran adalah kunci kelegaan; kemenangan datang dengan kesabaran, dan kelegaan datang dengan kesedihan.
- title:
    ar: التوكل
    en: Tawakkul (trust in God)
    fr: La confiance en Dieu
    tr: Tawakkol
    id: Tawakkol
  body:
    ar: تفويض الأمر إلى الله مع الأخذ بالأسباب.
    en: Entrusting matters to God while taking the means.
    fr: Confier son affaire à Dieu tout en prenant les moyens d’agir.
    tr: Konuyu Tanrı'ya devredin, araçlarını göz önünde bulundurun.
    id: Serahkan urusan kepada Allah dengan mempertimbangkan caranya.
- title:
    ar: تلاوة القرآن
    en: Quran recitation
    fr: La récitation du Coran
    tr: Kur'an okuyor
    id: Pembacaan Al-Qur'an
  body:
    ar: القرآن شفاء لما في الصدور وطمأنينة للقلب.
    en: The Quran is healing for hearts and tranquility for the soul.
    fr: Le Coran est présenté comme une guérison intérieure et un apaisement du cœur.
    tr: Kur'an, sandıklardakiler için bir şifa ve kalp için bir huzurdur.
    id: Al-Qur'an adalah penyembuhan untuk apa yang ada di dalam peti dan ketenangan bagi hati.
  ref: يونس 57
- title:
    ar: قيام الليل
    en: Night prayer
    fr: La prière nocturne
    tr: gece namazı
    id: doa malam
  body:
    ar: ساعات الليل الأخيرة وقت النزول الإلهي وإجابة الدعاء.
    en: The last hours of night are a time of divine descent and answered du'a.
    fr: Les dernières heures de la nuit sont associées, dans la tradition, à la descente divine et à l’exaucement des invocations.
    tr: Gecenin son saatleri, ilahi iniş ve yalvarışların kabulü zamanıdır.
    id: Jam-jam terakhir malam adalah waktu untuk turun ilahi dan menerima permohonan.
- title:
    ar: الصدقة
    en: Charity
    fr: L’aumône
    tr: Hayırseverlik
    id: Amal
  body:
    ar: الصدقة تطفئ غضب الرب وتدفع البلاء.
    en: Charity extinguishes the Lord's anger and repels calamity.
    fr: La tradition associe l’aumône à l’apaisement de la colère divine et à l’éloignement de l’épreuve.
    tr: Hayırseverlik, Rabbin gazabını söndürür ve sıkıntıyı uzaklaştırır.
    id: Kasih memadamkan murka Tuhan dan mengusir penderitaan.
- title:
    ar: حسن الظن بالله
    en: Good expectations of God
    fr: Une bonne opinion de Dieu
    tr: Tanrı'ya İyi Güven
    id: Iman Baik kepada Tuhan
  body:
    ar: أنا عند ظن عبدي بي — فليظن العبد بربه خيرًا.
    en: '''I am as My servant expects Me'' — so expect good from your Lord.'
    fr: Le récit souligne le lien entre la confiance du serviteur et son attente bienveillante envers Dieu.
    tr: Hizmetkârımın beni düşündüğü gibiyim — hizmetkâr Rabbi hakkında iyi düşünsün.
    id: Aku adalah seperti hamba-Ku memikirkan Aku — biarlah hamba berpikir baik tentang Tuhan-Nya.
