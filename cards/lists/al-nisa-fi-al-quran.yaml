slug: al-nisa-fi-al-quran
title: { ar: "النساء في القرآن", en: "Women in the Quran" }
lede:
  ar: "اثنتا عشرة امرأة ذُكرن في القرآن — قدوات وتحذيرات."
  en: "Twelve women mentioned in the Quran — models and warnings."
source_card: ed103070
status: { review: draft }
quiz: true
note:
  ar: "مريم وحدها ذُكرت باسمها الصريح في القرآن؛ الأسماء المشهورة للأخريات (زليخا، بلقيس، آسية) تقليدية لا قرآنية."
  en: "Only Maryam is named explicitly in the Quran; the famous names of the others (Zulaykha, Bilqis, Asiyah) are traditional, not Quranic."
items:
  - { title: { ar: "مريم", en: "Maryam (Mary)" }, body: { ar: "المرأة الوحيدة المذكورة باسمها؛ اصطفاها الله على نساء العالمين.", en: "The only woman named explicitly; chosen above the women of the worlds." } }
  - { title: { ar: "امرأة فرعون", en: "The wife of Pharaoh" }, body: { ar: "آمنت وكانت مثلًا للذين آمنوا.", en: "She believed and became an example for the believers." } }
  - { title: { ar: "حواء", en: "Hawwa' (Eve)" }, body: { ar: "زوج آدم وأم البشر.", en: "Adam's wife and mother of humanity." } }
  - { title: { ar: "امرأة العزيز", en: "The 'Aziz's wife" }, body: { ar: "راودت يوسف عن نفسه ثم أقرت ببراءته.", en: "She tempted Yusuf, then admitted his innocence." } }
  - { title: { ar: "ملكة سبأ", en: "The Queen of Sheba" }, body: { ar: "أسلمت مع سليمان لله رب العالمين.", en: "She submitted with Sulayman to God, Lord of the worlds." } }
  - { title: { ar: "أم موسى", en: "Musa's mother" }, body: { ar: "أوحى الله إليها أن ترضعه وتلقيه في اليم.", en: "God inspired her to nurse him and cast him into the river." } }
  - { title: { ar: "أخت موسى", en: "Musa's sister" }, body: { ar: "تتبعت أخاها ودلت على من يكفله.", en: "She tracked her brother and guided to his nurse." } }
  - { title: { ar: "سارة", en: "Sarah" }, body: { ar: "زوج إبراهيم وبُشّرت بإسحاق.", en: "Ibrahim's wife, given glad tidings of Ishaq." } }
  - { title: { ar: "المجادِلة", en: "The pleading woman" }, body: { ar: "جادلت النبي في زوجها فسمع الله شكواها.", en: "She pleaded with the Prophet about her husband; God heard her." } }
  - { title: { ar: "امرأة نوح", en: "Nuh's wife" }, body: { ar: "كانت مثلًا للذين كفروا بخيانتها.", en: "An example for disbelievers through her betrayal." } }
  - { title: { ar: "امرأة لوط", en: "Lut's wife" }, body: { ar: "خانت رسالة زوجها فكانت من الغابرين.", en: "She betrayed her husband's message and was left behind." } }
  - { title: { ar: "امرأة عمران", en: "The wife of 'Imran" }, body: { ar: "نذرت ما في بطنها لله فولدت مريم.", en: "She vowed her unborn child to God; she bore Maryam." } }
