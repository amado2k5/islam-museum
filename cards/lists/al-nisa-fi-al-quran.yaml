slug: al-nisa-fi-al-quran
title:
  ar: النساء في القرآن
  en: Women in the Quran
  fr: Les femmes dans le Coran
  tr: Kur'an'da Kadınlar
  id: Perempuan dalam Al-Qur'an
lede:
  ar: اثنتا عشرة امرأة ذُكرن في القرآن — قدوات وتحذيرات.
  en: Twelve women mentioned in the Quran — models and warnings.
  fr: 'Douze femmes évoquées dans le Coran : exemples à suivre et mises en garde.'
  tr: Kur'an'da adı geçen on iki kadın — rol modeller ve uyarılar.
  id: Dua belas wanita yang disebutkan dalam Al-Qur'an — panutan dan peringatan.
source_card: ed103070
status:
  review: draft
quiz: true
note:
  ar: مريم وحدها ذُكرت باسمها الصريح في القرآن؛ الأسماء المشهورة للأخريات (زليخا، بلقيس، آسية) تقليدية لا قرآنية.
  en: Only Maryam is named explicitly in the Quran; the famous names of the others (Zulaykha, Bilqis, Asiyah) are traditional, not Quranic.
  fr: Marie est la seule femme nommée explicitement dans le Coran ; les noms courants des autres, tels Zoulaykha, Bilqis et Assia, viennent de la tradition, non du texte coranique.
  tr: Kur'an'da sadece Meryem açıkça adı geçmiştir; diğerlerinin bilinen isimleri (Süleykha, Balqis, Asiya) gelenekseldir, Kur'an'a ait değildir.
  id: Hanya Maria yang disebut dengan nama eksplisitnya dalam Al-Qur'an; nama-nama terkenal dari yang lain (Zuleikha, Balqis, Asiya) bersifat tradisional, bukan Al-Qur'an.
items:
- title:
    ar: مريم
    en: Maryam (Mary)
    fr: Marie
    tr: Mary
    id: Mary
  body:
    ar: المرأة الوحيدة المذكورة باسمها؛ اصطفاها الله على نساء العالمين.
    en: The only woman named explicitly; chosen above the women of the worlds.
    fr: Seule femme nommée explicitement, elle est présentée comme élue parmi les femmes du monde.
    tr: Tanrı tarafından dünyalardaki kadınlar arasında adı verilen tek kadın.
    id: Satu-satunya wanita yang disebutkan oleh Tuhan di antara wanita-wanita di dunia.
- title:
    ar: امرأة فرعون
    en: The wife of Pharaoh
    fr: L’épouse de Pharaon
    tr: Firavun'un karısı
    id: Istri Firaun
  body:
    ar: آمنت وكانت مثلًا للذين آمنوا.
    en: She believed and became an example for the believers.
    fr: Elle croit et devient un exemple pour les croyants.
    tr: İnanıyordu ve inananlara örnek oluyordu.
    id: Dia percaya dan menjadi contoh bagi mereka yang percaya.
- title:
    ar: حواء
    en: Hawwa' (Eve)
    fr: Ève
    tr: Havva
    id: Eve
  body:
    ar: زوج آدم وأم البشر.
    en: Adam's wife and mother of humanity.
    fr: L’épouse d’Adam et la mère de l’humanité.
    tr: Adem'in kocası ve insanlığın annesi.
    id: Suami Adam dan ibu umat manusia.
- title:
    ar: امرأة العزيز
    en: The 'Aziz's wife
    fr: L’épouse d’al-Aziz
    tr: Sevgili eşim
    id: Istri tercinta
  body:
    ar: راودت يوسف عن نفسه ثم أقرت ببراءته.
    en: She tempted Yusuf, then admitted his innocence.
    fr: Elle tente de séduire Joseph, puis reconnaît son innocence.
    tr: Yusuf'u baştan çıkardı ve ardından masumiyetini itiraf etti.
    id: Dia menggoda Yusuf lalu mengakui ketidakbersalahannya.
- title:
    ar: ملكة سبأ
    en: The Queen of Sheba
    fr: La reine de Saba
    tr: Seba Kraliçesi
    id: Ratu Sheba
  body:
    ar: أسلمت مع سليمان لله رب العالمين.
    en: She submitted with Sulayman to God, Lord of the worlds.
    fr: Le récit la présente se soumettant avec Salomon à Dieu, Seigneur des mondes.
    tr: Süleyman ile birlikte dünyaların Rabbi Tanrı'ya teslim oldum.
    id: Aku menyerahkan diri bersama Salomo kepada Allah, Tuhan segala alam.
- title:
    ar: أم موسى
    en: Musa's mother
    fr: La mère de Moïse
    tr: um Musa
    id: um Musa
  body:
    ar: أوحى الله إليها أن ترضعه وتلقيه في اليم.
    en: God inspired her to nurse him and cast him into the river.
    fr: Dieu lui inspire d’allaiter son enfant puis de le confier au fleuve.
    tr: Tanrı onu ona bakması ve denize atması için ilham verdi.
    id: Tuhan mengilhami dia untuk merawatnya dan melemparkannya ke laut.
- title:
    ar: أخت موسى
    en: Musa's sister
    fr: La sœur de Moïse
    tr: Musa'nın Kardeşi
    id: Saudari Musa
  body:
    ar: تتبعت أخاها ودلت على من يكفله.
    en: She tracked her brother and guided to his nurse.
    fr: Elle suit les traces de son frère et indique qui pourrait le prendre en charge.
    tr: Kardeşini takip etti ve onu kimin sponsor edeceğini belirtti.
    id: Dia melacak saudaranya dan menunjukkan siapa yang akan mensponsorinya.
- title:
    ar: سارة
    en: Sarah
    fr: Sarah
    tr: Sarah
    id: Sarah
  body:
    ar: زوج إبراهيم وبُشّرت بإسحاق.
    en: Ibrahim's wife, given glad tidings of Ishaq.
    fr: L’épouse d’Abraham, à qui est annoncée la naissance d’Isaac.
    tr: Abraham ile evlendi ve İshak'tan iyi haberler getirdi.
    id: Dia menikah dengan Abraham dan membawa kabar baik tentang Ishak.
- title:
    ar: المجادِلة
    en: The pleading woman
    fr: La femme qui plaide
    tr: Argüman
    id: Argumen
  body:
    ar: جادلت النبي في زوجها فسمع الله شكواها.
    en: She pleaded with the Prophet about her husband; God heard her.
    fr: Elle s’adresse au Prophète au sujet de son mari ; Dieu entend sa plainte.
    tr: Peygamber kocasıyla tartıştı ve Allah onun şikayetini duydu.
    id: Nabi berdebat dengan suaminya, dan Tuhan mendengar keluhannya.
- title:
    ar: امرأة نوح
    en: Nuh's wife
    fr: L’épouse de Noé
    tr: Nuh'un Kadını
    id: Wanita Nuh
  body:
    ar: كانت مثلًا للذين كفروا بخيانتها.
    en: An example for disbelievers through her betrayal.
    fr: Sa trahison en fait un exemple donné aux non-croyants.
    tr: İhanetini reddedenlere örnek oldu.
    id: Dia menjadi contoh bagi mereka yang menyangkal pengkhianatannya.
- title:
    ar: امرأة لوط
    en: Lut's wife
    fr: L’épouse de Loth
    tr: Lot'un karısı
    id: Istri Lot
  body:
    ar: خانت رسالة زوجها فكانت من الغابرين.
    en: She betrayed her husband's message and was left behind.
    fr: Elle trahit le message de son époux et reste parmi ceux qui périssent.
    tr: Kocasının mektubunu ihanete uğrattı ve hüküm sürenler arasındaydı.
    id: Dia mengkhianati surat suaminya dan termasuk yang berkuasa.
- title:
    ar: امرأة عمران
    en: The wife of 'Imran
    fr: L’épouse d’Imran
    tr: Kadın, İmran
    id: Wanita, Imran
  body:
    ar: نذرت ما في بطنها لله فولدت مريم.
    en: She vowed her unborn child to God; she bore Maryam.
    fr: Elle consacre à Dieu l’enfant qu’elle porte, puis donne naissance à Marie.
    tr: Rahiminde olanı Tanrı'ya yemin etti ve Meryem'i doğurdu.
    id: Dia bersumpah apa yang ada di dalam rahimnya kepada Tuhan dan melahirkan Maria.
