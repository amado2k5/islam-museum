slug: al-nisa-fi-al-quran
title: { ar: "النساء في القرآن", en: "Women in the Quran", fr: "Les femmes dans le Coran" }
lede:
  ar: "اثنتا عشرة امرأة ذُكرن في القرآن — قدوات وتحذيرات."
  en: "Twelve women mentioned in the Quran — models and warnings."
  fr: "Douze femmes évoquées dans le Coran : exemples à suivre et mises en garde."
source_card: ed103070
status: { review: draft }
quiz: true
note:
  ar: "مريم وحدها ذُكرت باسمها الصريح في القرآن؛ الأسماء المشهورة للأخريات (زليخا، بلقيس، آسية) تقليدية لا قرآنية."
  en: "Only Maryam is named explicitly in the Quran; the famous names of the others (Zulaykha, Bilqis, Asiyah) are traditional, not Quranic."
  fr: Marie est la seule femme nommée explicitement dans le Coran ; les noms courants des autres, tels Zoulaykha, Bilqis et Assia, viennent de la tradition, non du texte coranique.
items:
  - { title: { ar: "مريم", en: "Maryam (Mary)", fr: "Marie" }, body: { ar: "المرأة الوحيدة المذكورة باسمها؛ اصطفاها الله على نساء العالمين.", en: "The only woman named explicitly; chosen above the women of the worlds.", fr: "Seule femme nommée explicitement, elle est présentée comme élue parmi les femmes du monde." } }
  - { title: { ar: "امرأة فرعون", en: "The wife of Pharaoh", fr: "L’épouse de Pharaon" }, body: { ar: "آمنت وكانت مثلًا للذين آمنوا.", en: "She believed and became an example for the believers.", fr: "Elle croit et devient un exemple pour les croyants." } }
  - { title: { ar: "حواء", en: "Hawwa' (Eve)", fr: "Ève" }, body: { ar: "زوج آدم وأم البشر.", en: "Adam's wife and mother of humanity.", fr: "L’épouse d’Adam et la mère de l’humanité." } }
  - { title: { ar: "امرأة العزيز", en: "The 'Aziz's wife", fr: "L’épouse d’al-Aziz" }, body: { ar: "راودت يوسف عن نفسه ثم أقرت ببراءته.", en: "She tempted Yusuf, then admitted his innocence.", fr: "Elle tente de séduire Joseph, puis reconnaît son innocence." } }
  - { title: { ar: "ملكة سبأ", en: "The Queen of Sheba", fr: "La reine de Saba" }, body: { ar: "أسلمت مع سليمان لله رب العالمين.", en: "She submitted with Sulayman to God, Lord of the worlds.", fr: "Le récit la présente se soumettant avec Salomon à Dieu, Seigneur des mondes." } }
  - { title: { ar: "أم موسى", en: "Musa's mother", fr: "La mère de Moïse" }, body: { ar: "أوحى الله إليها أن ترضعه وتلقيه في اليم.", en: "God inspired her to nurse him and cast him into the river.", fr: "Dieu lui inspire d’allaiter son enfant puis de le confier au fleuve." } }
  - { title: { ar: "أخت موسى", en: "Musa's sister", fr: "La sœur de Moïse" }, body: { ar: "تتبعت أخاها ودلت على من يكفله.", en: "She tracked her brother and guided to his nurse.", fr: "Elle suit les traces de son frère et indique qui pourrait le prendre en charge." } }
  - { title: { ar: "سارة", en: "Sarah", fr: "Sarah" }, body: { ar: "زوج إبراهيم وبُشّرت بإسحاق.", en: "Ibrahim's wife, given glad tidings of Ishaq.", fr: "L’épouse d’Abraham, à qui est annoncée la naissance d’Isaac." } }
  - { title: { ar: "المجادِلة", en: "The pleading woman", fr: "La femme qui plaide" }, body: { ar: "جادلت النبي في زوجها فسمع الله شكواها.", en: "She pleaded with the Prophet about her husband; God heard her.", fr: "Elle s’adresse au Prophète au sujet de son mari ; Dieu entend sa plainte." } }
  - { title: { ar: "امرأة نوح", en: "Nuh's wife", fr: "L’épouse de Noé" }, body: { ar: "كانت مثلًا للذين كفروا بخيانتها.", en: "An example for disbelievers through her betrayal.", fr: "Sa trahison en fait un exemple donné aux non-croyants." } }
  - { title: { ar: "امرأة لوط", en: "Lut's wife", fr: "L’épouse de Loth" }, body: { ar: "خانت رسالة زوجها فكانت من الغابرين.", en: "She betrayed her husband's message and was left behind.", fr: "Elle trahit le message de son époux et reste parmi ceux qui périssent." } }
  - { title: { ar: "امرأة عمران", en: "The wife of 'Imran", fr: "L’épouse d’Imran" }, body: { ar: "نذرت ما في بطنها لله فولدت مريم.", en: "She vowed her unborn child to God; she bore Maryam.", fr: "Elle consacre à Dieu l’enfant qu’elle porte, puis donne naissance à Marie." } }
