slug: afkar-lil-sadaqa
title: { ar: "أفكار للصدقة", en: "Ideas for charity", fr: "Idées de dons" }
lede:
  ar: "عشر صدقات جارية وأفكار عملية — الصدقة تطفئ الخطيئة."
  en: "Ten ongoing charities and practical ideas — charity extinguishes sin."
  fr: "Dix formes de charité durable et idées pratiques : la charité efface les fautes."
source_card: cd23d4da
status: { review: draft }
quiz: true
items:
  - { title: { ar: "مصحف للمسجد", en: "A Quran for the mosque", fr: "Un Coran pour la mosquée" }, body: { ar: "اشترِ مصحفًا وضعه في المسجد؛ كل من قرأ فيه لك أجره.", en: "Buy a mus'haf for the mosque; every reader earns you reward.", fr: "Offrir un exemplaire du Coran à une mosquée : la tradition associe une récompense à chaque lecture qui en est faite." } }
  - { title: { ar: "كفالة حفظ طفل", en: "Sponsor a child's memorization", fr: "Soutenir la mémorisation d’un enfant" }, body: { ar: "ساهم في تحفيظ طفل القرآن.", en: "Contribute to a child's Quran memorization.", fr: "Contribuer à l’apprentissage du Coran par un enfant." } }
  - { title: { ar: "سقي الطيور", en: "Water for birds", fr: "De l’eau pour les oiseaux" }, body: { ar: "ضع ماءً وطعامًا للطيور.", en: "Put out water and food for birds.", fr: "Mettre de l’eau et de la nourriture à la disposition des oiseaux." } }
  - { title: { ar: "براد ماء سبيل", en: "A public water cooler", fr: "Une fontaine publique" }, body: { ar: "براد ماء في طريق المارة.", en: "A water cooler on a passersby path.", fr: "Installer un point d’eau sur le passage des promeneurs." } }
  - { title: { ar: "غرس شجرة", en: "Plant a tree", fr: "Planter un arbre" }, body: { ar: "ما أكل منها طير أو إنسان إلا كان لك صدقة.", en: "Whatever bird or human eats from it is charity for you.", fr: "Selon la tradition, les fruits mangés par un oiseau ou une personne constituent une aumône pour celui qui a planté l’arbre." } }
  - { title: { ar: "مصحف أو سبحة هدية", en: "Gift a mus'haf or beads", fr: "Offrir un Coran ou un chapelet" }, body: { ar: "اترك مصحفًا أو سبحة لمن ينتفع بها.", en: "Leave a mus'haf or prayer beads for someone to use.", fr: "Laisser un exemplaire du Coran ou un chapelet à la disposition de quelqu’un." } }
  - { title: { ar: "إطعام محتاج", en: "Feed someone needy", fr: "Nourrir une personne dans le besoin" }, body: { ar: "أطعم مسكينًا أو فطّر صائمًا.", en: "Feed a poor person or break a fasting person's fast.", fr: "Offrir un repas à une personne démunie ou à quelqu’un qui rompt son jeûne." } }
  - { title: { ar: "إطعام الحيوان", en: "Feed animals", fr: "Nourrir les animaux" }, body: { ar: "في كل كبد رطبة أجر.", en: "In every living being there is reward.", fr: "La tradition associe une récompense au soin apporté à tout être vivant." } }
  - { title: { ar: "نشر العلم", en: "Share knowledge", fr: "Partager le savoir" }, body: { ar: "علّم آية أو ذكرًا ينتفع به الناس.", en: "Teach a verse or dhikr people benefit from.", fr: "Enseigner un verset ou une formule de rappel dont d’autres pourront bénéficier." } }
  - { title: { ar: "الابتسامة", en: "A smile", fr: "Un sourire" }, body: { ar: "تبسمك في وجه أخيك صدقة.", en: "Your smile at your brother is charity.", fr: "Selon la tradition, sourire à son frère constitue une aumône." } }
