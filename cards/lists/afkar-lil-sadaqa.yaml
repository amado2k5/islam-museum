slug: afkar-lil-sadaqa
title:
  ar: أفكار للصدقة
  en: Ideas for charity
  fr: Idées de dons
  tr: Hayır Amaçlı Fikirler
  id: Ide untuk Amal
lede:
  ar: عشر صدقات جارية وأفكار عملية — الصدقة تطفئ الخطيئة.
  en: Ten ongoing charities and practical ideas — charity extinguishes sin.
  fr: 'Dix formes de charité durable et idées pratiques : la charité efface les fautes.'
  tr: On sürekli sadaka ve pratik fikir — hayırseverlik günahı söndürür.
  id: Sepuluh sedekah berkelanjutan dan ide praktis — kasih sayang memadamkan dosa.
source_card: cd23d4da
status:
  review: draft
quiz: true
items:
- title:
    ar: مصحف للمسجد
    en: A Quran for the mosque
    fr: Un Coran pour la mosquée
    tr: Cami için Kur'an
    id: Al-Qur'an untuk masjid
  body:
    ar: اشترِ مصحفًا وضعه في المسجد؛ كل من قرأ فيه لك أجره.
    en: Buy a mus'haf for the mosque; every reader earns you reward.
    fr: 'Offrir un exemplaire du Coran à une mosquée : la tradition associe une récompense à chaque lecture qui en est faite.'
    tr: Bir Kur'an satın alın ve camiye koyun; onu okuyan ödülünü alır.
    id: Belilah Al-Qur'an dan letakkan di masjid; siapa pun yang membaca akan menerima ganjarannya.
- title:
    ar: كفالة حفظ طفل
    en: Sponsor a child's memorization
    fr: Soutenir la mémorisation d’un enfant
    tr: Çocuk Bakımı Sponsorluğu
    id: Sponsor Penitipan Anak
  body:
    ar: ساهم في تحفيظ طفل القرآن.
    en: Contribute to a child's Quran memorization.
    fr: Contribuer à l’apprentissage du Coran par un enfant.
    tr: Kur'an'ın çocuklara ezberlenmesinin öğretilmesine katkıda bulunun.
    id: Berkontribusi dalam mengajarkan hafalan anak Al-Quran.
- title:
    ar: سقي الطيور
    en: Water for birds
    fr: De l’eau pour les oiseaux
    tr: Kuşları sulamak
    id: Menyiram burung
  body:
    ar: ضع ماءً وطعامًا للطيور.
    en: Put out water and food for birds.
    fr: Mettre de l’eau et de la nourriture à la disposition des oiseaux.
    tr: Kuşlar için su ve yiyecek koy.
    id: Letakkan air dan makanan untuk burung-burung.
- title:
    ar: براد ماء سبيل
    en: A public water cooler
    fr: Une fontaine publique
    tr: Sabeel su soğutucu
    id: Chiller air Sabeel
  body:
    ar: براد ماء في طريق المارة.
    en: A water cooler on a passersby path.
    fr: Installer un point d’eau sur le passage des promeneurs.
    tr: Yaya yolunda bir su dağıtıcısı.
    id: Dispenser air di jalan pejalan kaki.
- title:
    ar: غرس شجرة
    en: Plant a tree
    fr: Planter un arbre
    tr: ağaç dikme
    id: penanaman pohon
  body:
    ar: ما أكل منها طير أو إنسان إلا كان لك صدقة.
    en: Whatever bird or human eats from it is charity for you.
    fr: Selon la tradition, les fruits mangés par un oiseau ou une personne constituent une aumône pour celui qui a planté l’arbre.
    tr: Hiçbir kuş ya da insan ondan yemez ancak sizin için bir hayır kurumudur.
    id: Tidak ada burung atau manusia yang memakan dari itu kecuali bahwa ini adalah amal untukmu.
- title:
    ar: مصحف أو سبحة هدية
    en: Gift a mus'haf or beads
    fr: Offrir un Coran ou un chapelet
    tr: Kur'an veya tesbih hediye olarak
    id: Al-Qur'an atau Rosario sebagai Hadiah
  body:
    ar: اترك مصحفًا أو سبحة لمن ينتفع بها.
    en: Leave a mus'haf or prayer beads for someone to use.
    fr: Laisser un exemplaire du Coran ou un chapelet à la disposition de quelqu’un.
    tr: Faydalananlar için bir Kur'an veya tespih bırakın.
    id: Tinggalkan Al-Qur'an atau rosario untuk mereka yang mendapat manfaat darinya.
- title:
    ar: إطعام محتاج
    en: Feed someone needy
    fr: Nourrir une personne dans le besoin
    tr: İhtiyacı olan birini beslemek
    id: Memberi makan seseorang yang membutuhkan
  body:
    ar: أطعم مسكينًا أو فطّر صائمًا.
    en: Feed a poor person or break a fasting person's fast.
    fr: Offrir un repas à une personne démunie ou à quelqu’un qui rompt son jeûne.
    tr: Fakir birini ya da oruç tutan mantarı besleyin.
    id: Berikan makan orang miskin atau jamur puasa.
- title:
    ar: إطعام الحيوان
    en: Feed animals
    fr: Nourrir les animaux
    tr: Hayvan beslemesi
    id: Pakan hewan
  body:
    ar: في كل كبد رطبة أجر.
    en: In every living being there is reward.
    fr: La tradition associe une récompense au soin apporté à tout être vivant.
    tr: Her ıslak karaciğerde bir ödül vardır.
    id: Di setiap hati basah, ada hadiahnya.
- title:
    ar: نشر العلم
    en: Share knowledge
    fr: Partager le savoir
    tr: Bilgi Yaymak
    id: Menyebarkan Pengetahuan
  body:
    ar: علّم آية أو ذكرًا ينتفع به الناس.
    en: Teach a verse or dhikr people benefit from.
    fr: Enseigner un verset ou une formule de rappel dont d’autres pourront bénéficier.
    tr: İnsanların fayda sağladığı bir ayet veya anının bilgisi.
    id: Pengetahuan tentang sebuah ayat atau kenangan yang dimanfaatkan oleh orang-orang.
- title:
    ar: الابتسامة
    en: A smile
    fr: Un sourire
    tr: Gülümse
    id: Tersenyumlah
  body:
    ar: تبسمك في وجه أخيك صدقة.
    en: Your smile at your brother is charity.
    fr: Selon la tradition, sourire à son frère constitue une aumône.
    tr: Kardeşinin yüzündeki gülümsemen hayırseverliktir.
    id: Senyummu di wajah saudaramu adalah amal.
