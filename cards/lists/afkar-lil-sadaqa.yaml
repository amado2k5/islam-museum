slug: afkar-lil-sadaqa
title: { ar: "أفكار للصدقة", en: "Ideas for charity" }
lede:
  ar: "عشر صدقات جارية وأفكار عملية — الصدقة تطفئ الخطيئة."
  en: "Ten ongoing charities and practical ideas — charity extinguishes sin."
source_card: cd23d4da
status: { review: draft }
quiz: true
items:
  - { title: { ar: "مصحف للمسجد", en: "A Quran for the mosque" }, body: { ar: "اشترِ مصحفًا وضعه في المسجد؛ كل من قرأ فيه لك أجره.", en: "Buy a mus'haf for the mosque; every reader earns you reward." } }
  - { title: { ar: "كفالة حفظ طفل", en: "Sponsor a child's memorization" }, body: { ar: "ساهم في تحفيظ طفل القرآن.", en: "Contribute to a child's Quran memorization." } }
  - { title: { ar: "سقي الطيور", en: "Water for birds" }, body: { ar: "ضع ماءً وطعامًا للطيور.", en: "Put out water and food for birds." } }
  - { title: { ar: "براد ماء سبيل", en: "A public water cooler" }, body: { ar: "براد ماء في طريق المارة.", en: "A water cooler on a passersby path." } }
  - { title: { ar: "غرس شجرة", en: "Plant a tree" }, body: { ar: "ما أكل منها طير أو إنسان إلا كان لك صدقة.", en: "Whatever bird or human eats from it is charity for you." } }
  - { title: { ar: "مصحف أو سبحة هدية", en: "Gift a mus'haf or beads" }, body: { ar: "اترك مصحفًا أو سبحة لمن ينتفع بها.", en: "Leave a mus'haf or prayer beads for someone to use." } }
  - { title: { ar: "إطعام محتاج", en: "Feed someone needy" }, body: { ar: "أطعم مسكينًا أو فطّر صائمًا.", en: "Feed a poor person or break a fasting person's fast." } }
  - { title: { ar: "إطعام الحيوان", en: "Feed animals" }, body: { ar: "في كل كبد رطبة أجر.", en: "In every living being there is reward." } }
  - { title: { ar: "نشر العلم", en: "Share knowledge" }, body: { ar: "علّم آية أو ذكرًا ينتفع به الناس.", en: "Teach a verse or dhikr people benefit from." } }
  - { title: { ar: "الابتسامة", en: "A smile" }, body: { ar: "تبسمك في وجه أخيك صدقة.", en: "Your smile at your brother is charity." } }
