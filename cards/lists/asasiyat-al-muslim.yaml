slug: asasiyat-al-muslim
title: { ar: "أساسيات يجب على المسلم معرفتها", en: "Essentials every Muslim should know", fr: "Les connaissances fondamentales du musulman" }
lede:
  ar: "تسع لوحات تأسيسية: من الأركان إلى الصلوات."
  en: "Nine foundational panels: from the pillars to the daily prayers."
  fr: "Neuf tableaux d’introduction : des piliers aux prières quotidiennes."
source_card: fb245531
status: { review: draft }
quiz: true
items:
  - { title: { ar: "أركان الإسلام الخمسة", en: "The five pillars of Islam", fr: "Les cinq piliers de l’islam" }, body: { ar: "الشهادتان، الصلاة، الزكاة، الصوم، الحج.", en: "The two testimonies, prayer, zakat, fasting, pilgrimage.", fr: "Les deux attestations de foi, la prière, la zakat, le jeûne et le pèlerinage." } }
  - { title: { ar: "أولو العزم من الرسل", en: "The resolute messengers", fr: "Les messagers doués de résolution" }, body: { ar: "نوح، إبراهيم، موسى، عيسى، محمد.", en: "Nuh, Ibrahim, Musa, 'Isa, Muhammad.", fr: "Noé, Abraham, Moïse, Jésus et Muhammad." } }
  - { title: { ar: "الأنبياء المذكورون في القرآن", en: "Prophets named in the Quran", fr: "Les prophètes nommés dans le Coran" }, body: { ar: "خمسة وعشرون نبيًا.", en: "Twenty-five prophets.", fr: "Vingt-cinq prophètes." } }
  - { title: { ar: "الأئمة الأربعة", en: "The four imams", fr: "Les quatre imams" }, body: { ar: "أبو حنيفة، مالك، الشافعي، أحمد بن حنبل.", en: "Abu Hanifa, Malik, al-Shafi'i, Ahmad ibn Hanbal.", fr: "Abou Hanifa, Malik, al-Chafii et Ahmad ibn Hanbal." } }
  - { title: { ar: "أصحاب الكتب الستة", en: "The six hadith collectors", fr: "Les auteurs des six recueils de hadiths" }, body: { ar: "البخاري، مسلم، أبو داود، الترمذي، النسائي، ابن ماجه.", en: "Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasa'i, Ibn Majah.", fr: "Al-Boukhari, Muslim, Abou Dawoud, al-Tirmidhi, al-Nassai et Ibn Majah." } }
  - { title: { ar: "أركان الإيمان الستة", en: "The six pillars of faith", fr: "Les six piliers de la foi" }, body: { ar: "الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر.", en: "Belief in God, His angels, books, messengers, the Last Day, and decree.", fr: "Croire en Dieu, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier et au destin." } }
  - { title: { ar: "الخلفاء الراشدون", en: "The rightly-guided caliphs", fr: "Les califes bien guidés" }, body: { ar: "أبو بكر، عمر، عثمان، علي.", en: "Abu Bakr, 'Umar, 'Uthman, 'Ali.", fr: "Abou Bakr, Omar, Othman et Ali." } }
  - { title: { ar: "الأشهر الهجرية", en: "The Hijri months", fr: "Les mois hégiriens" }, body: { ar: "اثنا عشر شهرًا من محرم إلى ذي الحجة.", en: "Twelve months from Muharram to Dhu al-Hijjah.", fr: "Douze mois, de Mouharram à dhou al-hijja." } }
  - { title: { ar: "الصلوات الخمس", en: "The five daily prayers", fr: "Les cinq prières quotidiennes" }, body: { ar: "الفجر، الظهر، العصر، المغرب، العشاء.", en: "Fajr, Dhuhr, 'Asr, Maghrib, 'Isha.", fr: "Fajr, dhuhr, asr, maghrib et icha." } }
