slug: asasiyat-al-muslim
title:
  ar: أساسيات يجب على المسلم معرفتها
  en: Essentials every Muslim should know
  fr: Les connaissances fondamentales du musulman
  tr: Bir Müslümanın bilmesi gereken temel bilgiler
  id: Dasar-dasar yang harus diketahui seorang Muslim
lede:
  ar: 'تسع لوحات تأسيسية: من الأركان إلى الصلوات.'
  en: 'Nine foundational panels: from the pillars to the daily prayers.'
  fr: 'Neuf tableaux d’introduction : des piliers aux prières quotidiennes.'
  tr: Köşelerden dualara kadar dokuz temel panel.
  id: 'Sembilan panel dasar: dari sudut hingga doa.'
source_card: fb245531
status:
  review: draft
quiz: true
items:
- title:
    ar: أركان الإسلام الخمسة
    en: The five pillars of Islam
    fr: Les cinq piliers de l’islam
    tr: İslam'ın Beş Direği
    id: Lima Pilar Islam
  body:
    ar: الشهادتان، الصلاة، الزكاة، الصوم، الحج.
    en: The two testimonies, prayer, zakat, fasting, pilgrimage.
    fr: Les deux attestations de foi, la prière, la zakat, le jeûne et le pèlerinage.
    tr: 'İki tanıklık: dua, zekat, oruç ve hac.'
    id: 'Dua kesaksian: doa, zakat, puasa, dan ziarah.'
- title:
    ar: أولو العزم من الرسل
    en: The resolute messengers
    fr: Les messagers doués de résolution
    tr: Kararlı olanlar elçiler arasındadır
    id: Mereka yang bertekad adalah di antara para utusan
  body:
    ar: نوح، إبراهيم، موسى، عيسى، محمد.
    en: Nuh, Ibrahim, Musa, 'Isa, Muhammad.
    fr: Noé, Abraham, Moïse, Jésus et Muhammad.
    tr: Nuh, İbrahim, Musa, İsa, Muhammed.
    id: Nuh, Abraham, Musa, Yesus, Muhammad.
- title:
    ar: الأنبياء المذكورون في القرآن
    en: Prophets named in the Quran
    fr: Les prophètes nommés dans le Coran
    tr: Kur'an'da bahsedilen peygamberler
    id: Para nabi yang disebutkan dalam Al-Qur'an
  body:
    ar: خمسة وعشرون نبيًا.
    en: Twenty-five prophets.
    fr: Vingt-cinq prophètes.
    tr: Yirmi beş peygamber.
    id: Dua puluh lima nabi.
- title:
    ar: الأئمة الأربعة
    en: The four imams
    fr: Les quatre imams
    tr: Dört İmam
    id: Empat Imam
  body:
    ar: أبو حنيفة، مالك، الشافعي، أحمد بن حنبل.
    en: Abu Hanifa, Malik, al-Shafi'i, Ahmad ibn Hanbal.
    fr: Abou Hanifa, Malik, al-Chafii et Ahmad ibn Hanbal.
    tr: Ebu Hanifa, Malik, El-Şafii, Ahmed bin Hanbel.
    id: Abu Hanifa, Malik, Al-Shafi'i, Ahmad ibn Hanbal.
- title:
    ar: أصحاب الكتب الستة
    en: The six hadith collectors
    fr: Les auteurs des six recueils de hadiths
    tr: Altı kitabın yazarları
    id: Para penulis enam buku tersebut
  body:
    ar: البخاري، مسلم، أبو داود، الترمذي، النسائي، ابن ماجه.
    en: Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasa'i, Ibn Majah.
    fr: Al-Boukhari, Muslim, Abou Dawoud, al-Tirmidhi, al-Nassai et Ibn Majah.
    tr: El-Buhari, Müslüman, Ebu Davud, El-Tirmidi, El-Nasa'i, İbn Mace.
    id: Al-Bukhari, Muslim, Abu Dawood, Al-Tirmidhi, Al-Nasa'i, Ibn Majah.
- title:
    ar: أركان الإيمان الستة
    en: The six pillars of faith
    fr: Les six piliers de la foi
    tr: İnancın Altı Sütunu
    id: Enam Pilar Iman
  body:
    ar: الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر.
    en: Belief in God, His angels, books, messengers, the Last Day, and decree.
    fr: Croire en Dieu, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier et au destin.
    tr: Allah'a, Meleklerine, kitaplarına, Elçilerine, Ahiret Gün'e ve kadere inanmak.
    id: Iman kepada Allah, malaikat-Nya, kitab-kitab-Nya, utusan-Nya, Hari Terakhir, dan takdir.
- title:
    ar: الخلفاء الراشدون
    en: The rightly-guided caliphs
    fr: Les califes bien guidés
    tr: Doğru Rehberli Halifeler
    id: Khalifah yang Dibimbing dengan Tepat
  body:
    ar: أبو بكر، عمر، عثمان، علي.
    en: Abu Bakr, 'Umar, 'Uthman, 'Ali.
    fr: Abou Bakr, Omar, Othman et Ali.
    tr: Ebu Bekir, Ömer, Osman, Ali.
    id: Abu Bakr, Omar, Othman, Ali.
- title:
    ar: الأشهر الهجرية
    en: The Hijri months
    fr: Les mois hégiriens
    tr: Hicri aylar
    id: Bulan-bulan Hijri
  body:
    ar: اثنا عشر شهرًا من محرم إلى ذي الحجة.
    en: Twelve months from Muharram to Dhu al-Hijjah.
    fr: Douze mois, de Mouharram à dhou al-hijja.
    tr: Muharrem'den Zulhicce'ye on iki ay.
    id: Dua belas bulan dari Muharram ke Dhu al-Hijjah.
- title:
    ar: الصلوات الخمس
    en: The five daily prayers
    fr: Les cinq prières quotidiennes
    tr: Beş günlük namaz
    id: Lima doa harian
  body:
    ar: الفجر، الظهر، العصر، المغرب، العشاء.
    en: Fajr, Dhuhr, 'Asr, Maghrib, 'Isha.
    fr: Fajr, dhuhr, asr, maghrib et icha.
    tr: Fıcr, Dhuhr, Asr, Mağrip, İsha.
    id: Fajr, Dhuhr, Asr, Maghrib, Isha.
