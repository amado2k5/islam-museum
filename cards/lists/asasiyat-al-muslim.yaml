slug: asasiyat-al-muslim
title: { ar: "أساسيات يجب على المسلم معرفتها", en: "Essentials every Muslim should know" }
lede:
  ar: "تسع لوحات تأسيسية: من الأركان إلى الصلوات."
  en: "Nine foundational panels: from the pillars to the daily prayers."
source_card: fb245531
status: { review: draft }
quiz: true
items:
  - { title: { ar: "أركان الإسلام الخمسة", en: "The five pillars of Islam" }, body: { ar: "الشهادتان، الصلاة، الزكاة، الصوم، الحج.", en: "The two testimonies, prayer, zakat, fasting, pilgrimage." } }
  - { title: { ar: "أولو العزم من الرسل", en: "The resolute messengers" }, body: { ar: "نوح، إبراهيم، موسى، عيسى، محمد.", en: "Nuh, Ibrahim, Musa, 'Isa, Muhammad." } }
  - { title: { ar: "الأنبياء المذكورون في القرآن", en: "Prophets named in the Quran" }, body: { ar: "خمسة وعشرون نبيًا.", en: "Twenty-five prophets." } }
  - { title: { ar: "الأئمة الأربعة", en: "The four imams" }, body: { ar: "أبو حنيفة، مالك، الشافعي، أحمد بن حنبل.", en: "Abu Hanifa, Malik, al-Shafi'i, Ahmad ibn Hanbal." } }
  - { title: { ar: "أصحاب الكتب الستة", en: "The six hadith collectors" }, body: { ar: "البخاري، مسلم، أبو داود، الترمذي، النسائي، ابن ماجه.", en: "Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasa'i, Ibn Majah." } }
  - { title: { ar: "أركان الإيمان الستة", en: "The six pillars of faith" }, body: { ar: "الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر.", en: "Belief in God, His angels, books, messengers, the Last Day, and decree." } }
  - { title: { ar: "الخلفاء الراشدون", en: "The rightly-guided caliphs" }, body: { ar: "أبو بكر، عمر، عثمان، علي.", en: "Abu Bakr, 'Umar, 'Uthman, 'Ali." } }
  - { title: { ar: "الأشهر الهجرية", en: "The Hijri months" }, body: { ar: "اثنا عشر شهرًا من محرم إلى ذي الحجة.", en: "Twelve months from Muharram to Dhu al-Hijjah." } }
  - { title: { ar: "الصلوات الخمس", en: "The five daily prayers" }, body: { ar: "الفجر، الظهر، العصر، المغرب، العشاء.", en: "Fajr, Dhuhr, 'Asr, Maghrib, 'Isha." } }
