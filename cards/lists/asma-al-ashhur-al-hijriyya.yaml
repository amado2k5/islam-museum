slug: asma-al-ashhur-al-hijriyya
title:
  ar: سبب تسمية الأشهر الهجرية
  en: Why the Hijri months are named as they are
  fr: L’origine des noms des mois hégiriens
  tr: Hicri aylarının adlandırılma nedeni
  id: Alasan penamaan bulan Hijriyah
lede:
  ar: اثنا عشر شهرًا — أسماؤها تحكي أحوال العرب قبل الإسلام.
  en: Twelve months — their names tell of Arab life before Islam.
  fr: Douze mois dont les noms racontent la vie des Arabes avant l’islam.
  tr: On iki ay — isimleri İslam öncesi Arapların durumunu anlatır.
  id: Dua belas bulan — namanya menceritakan kondisi orang Arab sebelum Islam.
source_card: 2b8c0882
status:
  review: draft
quiz: true
kids: true
note:
  ar: الاشتقاقات لغوية تقليدية تُروى عن العرب الأوائل.
  en: Traditional linguistic etymologies attributed to the early Arabs.
  fr: Étymologies linguistiques traditionnelles attribuées aux premiers Arabes.
  tr: Geleneksel dilsel türemeler erken Araplardan anlatılmaktadır.
  id: Turunan linguistik tradisional diceritakan dari bangsa Arab awal.
items:
- title:
    ar: محرم
    en: Muharram
    fr: Mouharram
    tr: Muharrem
    id: Muharram
  body:
    ar: سُمّي بذلك لتحريم القتال فيه.
    en: Named for fighting being forbidden in it.
    fr: Son nom est lié à l’interdiction d’y combattre.
    tr: Adını böyle almıştı çünkü içinde savaş yasaktı.
    id: Nama itu diambil karena pertempuran dilarang di dalamnya.
- title:
    ar: صفر
    en: Safar
    fr: Safar
    tr: Sıfır
    id: nol
  body:
    ar: 'قيل: لخلوّ الديار من أهلها إذا خرجوا للغزو.'
    en: Said to be for homes emptying as men left to raid.
    fr: Selon une explication, les maisons se vidaient lorsque leurs habitants partaient en expédition.
    tr: 'Denir ki: çünkü topraklar baskına çıktıklarında halklarının yok olmasıdır.'
    id: 'Dikatakan demikian: karena tanah kosong dari rakyatnya saat mereka melakukan serangan.'
- title:
    ar: ربيع الأول
    en: Rabi' al-Awwal
    fr: Rabi al-awwal
    tr: Rabi' al-Awwal
    id: Rabi' al-Awwal
  body:
    ar: سُمّي في فصل الربيع.
    en: Named in the spring season.
    fr: Il aurait été nommé au printemps.
    tr: Adı baharda verilmiştir.
    id: Nama ini diambil dari musim semi.
- title:
    ar: ربيع الآخر
    en: Rabi' al-Akhir
    fr: Rabi al-akhir
    tr: Rabi' al-Thani
    id: Rabi' al-Thani
  body:
    ar: تابع الربيع الأول.
    en: Follows the first Rabi'.
    fr: Il suit le premier rabi.
    tr: İlk baharı takip edin.
    id: Ikuti musim semi pertama.
- title:
    ar: جمادى الأولى
    en: Jumada al-Ula
    fr: Joumada al-oula
    tr: Cumedül-Avvel
    id: Jumada al-Awwal
  body:
    ar: سُمّيت حين جمد الماء من البرد.
    en: Named when water froze from the cold.
    fr: Son nom serait lié à l’eau gelée par le froid.
    tr: Adı suyun soğuktan donmasıyla verilmiştir.
    id: Nama itu diambil ketika air membeku karena dingin.
- title:
    ar: جمادى الآخرة
    en: Jumada al-Akhira
    fr: Joumada al-akhira
    tr: Jumada al-Thani
    id: Jumada al-Thani
  body:
    ar: تابع جمادى الأولى.
    en: Follows the first Jumada.
    fr: Il suit le premier joumada.
    tr: Jumada al-Awwal'i takip edin.
    id: Ikuti Jumada al-Awwal.
- title:
    ar: رجب
    en: Rajab
    fr: Rajab
    tr: Rajab
    id: Rajab
  body:
    ar: من الترجيب أي التعظيم؛ شهر حرام.
    en: From 'veneration'; a sacred month.
    fr: Son nom évoque la vénération ; c’est un mois sacré.
    tr: '''Targib'' kelimesi birini yüceltmek anlamına gelir; kutsal bir ay.'
    id: Dari 'targib' berarti memuliakan seseorang; bulan suci.
- title:
    ar: شعبان
    en: Sha'ban
    fr: Chaabane
    tr: Şaban
    id: Shaaban
  body:
    ar: 'قيل: لتشعب القبائل للغزو بعد رجب.'
    en: Said to be for tribes dispersing to raid after Rajab.
    fr: Selon une explication, les tribus se dispersaient en expéditions après rajab.
    tr: 'Şöyle denir: çünkü kabileler Rajab''dan sonra ayrılarak işgal etti.'
    id: 'Dikatakan demikian: karena suku-suku itu berpisah untuk menyerang setelah Rajab.'
- title:
    ar: رمضان
    en: Ramadan
    fr: Ramadan
    tr: Ramazan
    id: Ramadan
  body:
    ar: 'من الرمضاء: شدة الحر؛ وقيل: يحرق الذنوب.'
    en: From intense heat; said to burn away sins.
    fr: Son nom est lié à une chaleur intense ; une autre explication l’associe à l’effacement des péchés.
    tr: 'Kavurucu sıcaktan: yoğun sıcak; ayrıca denir ki: günahları yakar.'
    id: 'Dari panas yang membakar: panas yang sangat intens; juga dikatakan: itu membakar dosa.'
- title:
    ar: شوال
    en: Shawwal
    fr: Chawwal
    tr: Shawwal
    id: Shawwal
  body:
    ar: 'قيل: لشولان النوق بأذنابها.'
    en: Said to be for camels raising their tails.
    fr: Selon une explication, son nom évoque les chamelles levant la queue.
    tr: 'Denir ki: develer kuyrukları tarafından yutulur.'
    id: Dikatakan bahwa unta ditelan oleh ekornya.
- title:
    ar: ذو القعدة
    en: Dhu al-Qa'dah
    fr: Dhou al-qada
    tr: Dhu al-Qi'dah
    id: Dhu al-Qi'dah
  body:
    ar: سُمّي لقعودهم عن القتال فيه.
    en: Named for sitting back from fighting in it.
    fr: Son nom évoque le fait de s’abstenir de combattre.
    tr: Adını bu isim, içinde dövüşmelerinden askıya alınmasından almıştır.
    id: Nama mereka diambil dari penangguhan mereka akibat bertarung di dalamnya.
- title:
    ar: ذو الحجة
    en: Dhu al-Hijjah
    fr: Dhou al-hijja
    tr: Dhu al-Hijjah
    id: Dhu al-Hijjah
  body:
    ar: شهر الحج الأكبر.
    en: The month of the greater pilgrimage.
    fr: Le mois du grand pèlerinage.
    tr: Hac el-Ekber ayı.
    id: Bulan Haji al-Akbar.
