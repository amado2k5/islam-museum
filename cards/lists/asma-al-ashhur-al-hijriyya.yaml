slug: asma-al-ashhur-al-hijriyya
title: { ar: "سبب تسمية الأشهر الهجرية", en: "Why the Hijri months are named as they are" }
lede:
  ar: "اثنا عشر شهرًا — أسماؤها تحكي أحوال العرب قبل الإسلام."
  en: "Twelve months — their names tell of Arab life before Islam."
source_card: 2b8c0882
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
note:
  ar: "الاشتقاقات لغوية تقليدية تُروى عن العرب الأوائل."
  en: "Traditional linguistic etymologies attributed to the early Arabs."
items:
  - { title: { ar: "محرم", en: "Muharram" }, body: { ar: "سُمّي بذلك لتحريم القتال فيه.", en: "Named for fighting being forbidden in it." } }
  - { title: { ar: "صفر", en: "Safar" }, body: { ar: "قيل: لخلوّ الديار من أهلها إذا خرجوا للغزو.", en: "Said to be for homes emptying as men left to raid." } }
  - { title: { ar: "ربيع الأول", en: "Rabi' al-Awwal" }, body: { ar: "سُمّي في فصل الربيع.", en: "Named in the spring season." } }
  - { title: { ar: "ربيع الآخر", en: "Rabi' al-Akhir" }, body: { ar: "تابع الربيع الأول.", en: "Follows the first Rabi'." } }
  - { title: { ar: "جمادى الأولى", en: "Jumada al-Ula" }, body: { ar: "سُمّيت حين جمد الماء من البرد.", en: "Named when water froze from the cold." } }
  - { title: { ar: "جمادى الآخرة", en: "Jumada al-Akhira" }, body: { ar: "تابع جمادى الأولى.", en: "Follows the first Jumada." } }
  - { title: { ar: "رجب", en: "Rajab" }, body: { ar: "من الترجيب أي التعظيم؛ شهر حرام.", en: "From 'veneration'; a sacred month." } }
  - { title: { ar: "شعبان", en: "Sha'ban" }, body: { ar: "قيل: لتشعب القبائل للغزو بعد رجب.", en: "Said to be for tribes dispersing to raid after Rajab." } }
  - { title: { ar: "رمضان", en: "Ramadan" }, body: { ar: "من الرمضاء: شدة الحر؛ وقيل: يحرق الذنوب.", en: "From intense heat; said to burn away sins." } }
  - { title: { ar: "شوال", en: "Shawwal" }, body: { ar: "قيل: لشولان النوق بأذنابها.", en: "Said to be for camels raising their tails." } }
  - { title: { ar: "ذو القعدة", en: "Dhu al-Qa'dah" }, body: { ar: "سُمّي لقعودهم عن القتال فيه.", en: "Named for sitting back from fighting in it." } }
  - { title: { ar: "ذو الحجة", en: "Dhu al-Hijjah" }, body: { ar: "شهر الحج الأكبر.", en: "The month of the greater pilgrimage." } }
