slug: asma-al-ashhur-al-hijriyya
title: { ar: "سبب تسمية الأشهر الهجرية", en: "Why the Hijri months are named as they are", fr: "L’origine des noms des mois hégiriens" }
lede:
  ar: "اثنا عشر شهرًا — أسماؤها تحكي أحوال العرب قبل الإسلام."
  en: "Twelve months — their names tell of Arab life before Islam."
  fr: Douze mois dont les noms racontent la vie des Arabes avant l’islam.
source_card: 2b8c0882
status: { review: draft }
quiz: true
kids: true # opted into the Kids' Wing reading shelf (docs/agents/kids-content.md §4: gating is opt-in)
note:
  ar: "الاشتقاقات لغوية تقليدية تُروى عن العرب الأوائل."
  en: "Traditional linguistic etymologies attributed to the early Arabs."
  fr: Étymologies linguistiques traditionnelles attribuées aux premiers Arabes.
items:
  - { title: { ar: "محرم", en: "Muharram", fr: "Mouharram" }, body: { ar: "سُمّي بذلك لتحريم القتال فيه.", en: "Named for fighting being forbidden in it.", fr: "Son nom est lié à l’interdiction d’y combattre." } }
  - { title: { ar: "صفر", en: "Safar", fr: "Safar" }, body: { ar: "قيل: لخلوّ الديار من أهلها إذا خرجوا للغزو.", en: "Said to be for homes emptying as men left to raid.", fr: "Selon une explication, les maisons se vidaient lorsque leurs habitants partaient en expédition." } }
  - { title: { ar: "ربيع الأول", en: "Rabi' al-Awwal", fr: "Rabi al-awwal" }, body: { ar: "سُمّي في فصل الربيع.", en: "Named in the spring season.", fr: "Il aurait été nommé au printemps." } }
  - { title: { ar: "ربيع الآخر", en: "Rabi' al-Akhir", fr: "Rabi al-akhir" }, body: { ar: "تابع الربيع الأول.", en: "Follows the first Rabi'.", fr: "Il suit le premier rabi." } }
  - { title: { ar: "جمادى الأولى", en: "Jumada al-Ula", fr: "Joumada al-oula" }, body: { ar: "سُمّيت حين جمد الماء من البرد.", en: "Named when water froze from the cold.", fr: "Son nom serait lié à l’eau gelée par le froid." } }
  - { title: { ar: "جمادى الآخرة", en: "Jumada al-Akhira", fr: "Joumada al-akhira" }, body: { ar: "تابع جمادى الأولى.", en: "Follows the first Jumada.", fr: "Il suit le premier joumada." } }
  - { title: { ar: "رجب", en: "Rajab", fr: "Rajab" }, body: { ar: "من الترجيب أي التعظيم؛ شهر حرام.", en: "From 'veneration'; a sacred month.", fr: "Son nom évoque la vénération ; c’est un mois sacré." } }
  - { title: { ar: "شعبان", en: "Sha'ban", fr: "Chaabane" }, body: { ar: "قيل: لتشعب القبائل للغزو بعد رجب.", en: "Said to be for tribes dispersing to raid after Rajab.", fr: "Selon une explication, les tribus se dispersaient en expéditions après rajab." } }
  - { title: { ar: "رمضان", en: "Ramadan", fr: "Ramadan" }, body: { ar: "من الرمضاء: شدة الحر؛ وقيل: يحرق الذنوب.", en: "From intense heat; said to burn away sins.", fr: "Son nom est lié à une chaleur intense ; une autre explication l’associe à l’effacement des péchés." } }
  - { title: { ar: "شوال", en: "Shawwal", fr: "Chawwal" }, body: { ar: "قيل: لشولان النوق بأذنابها.", en: "Said to be for camels raising their tails.", fr: "Selon une explication, son nom évoque les chamelles levant la queue." } }
  - { title: { ar: "ذو القعدة", en: "Dhu al-Qa'dah", fr: "Dhou al-qada" }, body: { ar: "سُمّي لقعودهم عن القتال فيه.", en: "Named for sitting back from fighting in it.", fr: "Son nom évoque le fait de s’abstenir de combattre." } }
  - { title: { ar: "ذو الحجة", en: "Dhu al-Hijjah", fr: "Dhou al-hijja" }, body: { ar: "شهر الحج الأكبر.", en: "The month of the greater pilgrimage.", fr: "Le mois du grand pèlerinage." } }
