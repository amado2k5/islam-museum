    name: Surah app and Public Sura API (Tafsir Center for Quranic Studies)
    url: https://dev.surahapp.com/api/docs
    licence: no terms page found; facts-only (decision dec-20261114-279, founder docket)
    layer: facts
    method: public JSON API, project catalogue and per-project content, 3 s pause; no scripture wording stored
    status: enabled
    limits: {}
    downloads: []
