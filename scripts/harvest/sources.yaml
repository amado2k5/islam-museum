user_agent: islam-museum-harvest/0.1 (https://github.com/amado2k5/islam-museum)
sources:
  wikidata-query:
    name: Wikidata Query Service
    url: https://query.wikidata.org/sparql
    licence: CC0 1.0
    layer: cc0
    method: sparql, in series, one query file per class and signal
    limits:
      pause_seconds: 5
      timeout_seconds: 60
      backoff_on:
      - 429
      - 503
    status: enabled
  wikidata-dump:
    name: Wikidata JSON dump
    url: https://dumps.wikimedia.org/wikidatawiki/entities/latest-all.json.bz2
    licence: CC0 1.0
    layer: cc0
    method: aria2c, two connections, resumable; stream through the subset filter,
      then delete
    limits:
      connections: 2
      size_gib: 96
      note: kept after download until the subset filter has run once; delete afterwards
    status: enabled
  wikipedia-dumps:
    name: Wikipedia article dumps, by language
    url: https://dumps.wikimedia.org/
    licence: CC BY-SA 4.0 and GFDL
    layer: by-sa
    method: dumps only, two connections; pointers and context, never merged into cc0
    status: enabled
    limits:
      connections: 2
      first_ring:
      - en
      - fr
      - ar
      - fa
      - id
      - tr
      - bn
      - ur
      - ms
      second_ring:
      - de
      - es
      - ru
      - zh
      - hi
      - ha
      - sw
      - so
      - bs
      - sq
      - az
      - uz
      - kk
      - tt
      - ku
      - ps
      - pa
      - sd
      - ta
      - ml
      - th
      - ja
      - ko
      - it
      - nl
      - pt
      files:
      - pages-articles-multistream.xml.bz2
      - pages-articles-multistream-index.txt.bz2
      - page.sql.gz
      - categorylinks.sql.gz
      - linktarget.sql.gz
      size_gib:
        first_ring: 47.1
        second_ring: 44.5
      note: categorylinks now stores cl_target_id; the category names are in linktarget.sql.gz,
        so it is required for the category walk (added 11 Oct 2026; not in the original
        plan list)
  tanzil-quran:
    name: Tanzil Qur'an text v1.1 (Uthmani and Simple Clean)
    url: https://tanzil.net/download/
    licence: Tanzil terms (verbatim copies only, attribution, notice kept)
    layer: by
    method: manual download in a browser, then scripts/harvest/quran/verify_quran.py
    status: manual
  met-open-access:
    name: Metropolitan Museum of Art Open Access
    url: https://github.com/metmuseum/openaccess
    licence: CC0 1.0
    layer: cc0
    method: csv download (github raw redirect to LFS)
    status: enabled
    limits: {}
    downloads:
    - url: https://github.com/metmuseum/openaccess/raw/master/MetObjects.csv
      dest: raw/collections/met/MetObjects.csv
      size: 317650992
  pleiades:
    name: Pleiades gazetteer of ancient places
    url: https://pleiades.stoa.org/downloads
    licence: CC BY 3.0
    layer: by
    method: daily CSV dumps from atlantides.org
    status: enabled
    limits: {}
    downloads:
    - url: https://atlantides.org/downloads/pleiades/dumps/pleiades-places-latest.csv.gz
      dest: raw/collections/pleiades/pleiades-places-latest.csv.gz
    - url: https://atlantides.org/downloads/pleiades/dumps/pleiades-names-latest.csv.gz
      dest: raw/collections/pleiades/pleiades-names-latest.csv.gz
    - url: https://atlantides.org/downloads/pleiades/dumps/pleiades-locations-latest.csv.gz
      dest: raw/collections/pleiades/pleiades-locations-latest.csv.gz
  forbidden:
  - name: Quran Foundation API
    reason: no storage beyond a week
    no redistribution: null
  - name: Zabihah
    reason: terms prohibit collection
  - name: Mawaqit
    reason: terms prohibit collection
  - name: YouTube API data
    reason: terms prohibit storage and redistribution
  geonames:
    name: GeoNames gazetteer dump
    url: https://www.geonames.org/export/
    licence: CC BY 4.0
    layer: by
    method: dump files from download.geonames.org
    status: enabled
    limits: {}
    downloads:
    - url: https://download.geonames.org/export/dump/allCountries.zip
      dest: raw/collections/geonames/allCountries.zip
      size: 422014673
    - url: https://download.geonames.org/export/dump/alternateNamesV2.zip
      dest: raw/collections/geonames/alternateNamesV2.zip
      size: 204829015
    - url: https://download.geonames.org/export/dump/countryInfo.txt
      dest: raw/collections/geonames/countryInfo.txt
      size: 31680
    - url: https://download.geonames.org/export/dump/admin1CodesASCII.txt
      dest: raw/collections/geonames/admin1CodesASCII.txt
      size: 151583
  natural-earth:
    name: Natural Earth 10 m (physical, admin-0, shaded relief)
    url: https://www.naturalearthdata.com/downloads/
    licence: Public domain
    layer: cc0
    method: zip downloads from naciscdn.org; unzipped into $HARVEST/basemaps
    status: enabled
    limits: {}
    downloads:
    - url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_land.zip
      dest: basemaps/downloads/ne_10m_land.zip
      size: 3269070
    - url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_ocean.zip
      dest: basemaps/downloads/ne_10m_ocean.zip
      size: 3189765
    - url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_coastline.zip
      dest: basemaps/downloads/ne_10m_coastline.zip
      size: 3069451
    - url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_rivers_lake_centerlines.zip
      dest: basemaps/downloads/ne_10m_rivers_lake_centerlines.zip
      size: 2079507
    - url: https://naciscdn.org/naturalearth/10m/physical/ne_10m_lakes.zip
      dest: basemaps/downloads/ne_10m_lakes.zip
      size: 2349685
    - url: https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_0_countries.zip
      dest: basemaps/downloads/ne_10m_admin_0_countries.zip
      size: 4930492
    - url: https://naciscdn.org/naturalearth/10m/raster/SR_HR.zip
      dest: basemaps/downloads/SR_HR.zip
      size: 44367365
  etopo1:
    name: ETOPO1 Ice Surface global relief (NOAA)
    url: https://www.ngdc.noaa.gov/mgg/global/
    licence: Public domain (US government)
    layer: cc0
    method: single netcdf download, gzip
    status: enabled
    limits:
      size_mib: 377
    downloads:
    - url: https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO1/data/ice_surface/grid_registered/netcdf/ETOPO1_Ice_g_gmt4.grd.gz
      dest: basemaps/downloads/ETOPO1_Ice_g_gmt4.grd.gz
      size: 395148066
  openiti-makhzan:
    name: OpenITI Makhzan 2026.1.2 (annotated manuscript and print data for text recognition;
      NOT the text corpus)
    url: https://zenodo.org/records/19861912
    licence: CC BY-NC-SA 4.0
    layer: nc
    method: zenodo files, md5 checked; manuscript/print catalogue metadata and transcriptions;
      facts only
    status: enabled
    limits:
      note: 'non-commercial: text is mined for facts, never republished'
      size_gib: 5.7
    downloads:
    - url: https://zenodo.org/api/records/19861912/files/OpenITI-Makhzan_Data_2026-1-2.zip/content
      dest: raw/openiti/OpenITI-Makhzan_Data_2026-1-2.zip
      md5: 347a06a5714091665b7292775840a0f0
      size: 6109859716
    - url: https://zenodo.org/api/records/19861912/files/OpenITI-Makhzan_Metadata_2026-1-2.tsv/content
      dest: raw/openiti/OpenITI-Makhzan_Metadata_2026-1-2.tsv
      md5: 26e448803e90274a228ebee2a9df7e96
      size: 568495
    - url: https://zenodo.org/api/records/19861912/files/OpenITI-Makhzan_ReleaseNotes_2026-1-2.pdf/content
      dest: raw/openiti/OpenITI-Makhzan_ReleaseNotes_2026-1-2.pdf
      md5: 490b22ec83b5e445c191c0bf671233e5
      size: 86921
  openiti-corpus:
    name: 'OpenITI: a Machine-Readable Corpus of Islamicate Texts 2025.1.9 (Zenodo
      17767721)'
    url: https://zenodo.org/records/17767721
    licence: CC BY-NC-SA 4.0
    layer: nc
    method: zenodo files, md5 checked; facts and bibliographic leads mined with short
      quotations; text never republished
    status: enabled
    limits:
      size_gib: 5.5
      note: 'non-commercial: never republish text'
    downloads:
    - url: https://zenodo.org/api/records/17767721/files/OpenITI_metadata_2025-1-9.tsv/content
      dest: raw/openiti/corpus/OpenITI_metadata_2025-1-9.tsv
      md5: cb2226f64264efa964df9ef659d40199
      size: 12092756
    - url: https://zenodo.org/api/records/17767721/files/OpenITI_release-notes_2025-1-9.zip/content
      dest: raw/openiti/corpus/OpenITI_release-notes_2025-1-9.zip
      md5: e127a3fccd2df033a6462542820f55a0
      size: 204028
    - url: https://zenodo.org/api/records/17767721/files/OpenITI_data_2025-1-9.zip/content
      dest: raw/openiti/corpus/OpenITI_data_2025-1-9.zip
      md5: 95cf19a9320fee6c37c4c26c9fa860b1
      size: 5936029637
  archive-org-books:
    name: Internet Archive open Arabic book scans (reference copies of prominent Sunni works)
    url: https://archive.org
    licence: per item; classical texts are public domain, modern editions and tahqiq apparatus stay copyrighted
    layer: copyrighted-reference
    method: advancedsearch + metadata API; only items served openly (never borrow-only or access-restricted); 1 request/second; resumable
    status: enabled
    limits:
      pause_seconds: 1
      max_items_per_book: 6
      max_file_gib: 1.5
      note: 'facts, chronology, names and citations only; never republish text; OCR text and PDFs stay in the harvest workspace, never in git'
  encyclopaedia-of-islam-2:
    name: Encyclopaedia of Islam, 2nd edition (Leiden: Brill, 1954-2008, 13 volumes)
    url: https://archive.org/details/ei2-complete
    licence: Brill copyright; the archive.org item states no licence URL and the status is not verified as public domain. Read and rewritten in the museum's own words under docs/sources-policy.md, each fact cited by volume and PDF page
    layer: copyrighted-reference
    method: download of the 15 PDFs (checksums checked against archive.org); Apple Vision OCR (en-US, accurate, 200 dpi, every page); entry split with scripts/harvest/encyclopaedia/split_entries.py; English prose written from the text, then Arabic and Urdu translations
    limits:
      quotation_max_words: 40
      note: 'PDFs, OCR text, page images and entry splits stay in the harvest workspace, never in git'
    status: enabled
  assabile-omar-abdelkafy:
    name: Assabile archive of Omar Abdelkafy's lectures (audio and video)
    url: https://www.assabile.com/omar-abdelkafy
    media_host: https://media.assabile.com/
    licence: no licence statement found on the site (checked 25 Oct 2026); treated exactly like a book by the founder's decision of 25 Oct 2026: full details and full prose in the museum's own words, cited by series, episode and timestamp; audio never republished
    layer: copyrighted-reference
    method: browser discovery of series and episode pages (media links read from the page); scripts/harvest/audio/download.py (sequential, two-second pause, identified User-Agent, SHA-256 per file); scripts/harvest/audio/transcribe.py (mlx-whisper, large-v3, local)
    limits:
      pause_seconds: 2
      robots_txt: checked 25 Oct 2026; lesson pages and media host not disallowed
      youtube: not downloaded (YouTube terms)
    status: enabled
workspace: /Volumes/exmicroSD/islam-museum-harvest (symlinked from ~/islam-museum-harvest)
