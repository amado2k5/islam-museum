# Transliteration and spelling variants for client-side search (docs/plan/03 §13: synonyms are generated at build time, nothing runs per visitor).
# Each rule rewrites a normalised (lower-case, ASCII, apostrophes and hyphens removed) label into a spelling people commonly type.
# `swap` rules replace a substring; `whole` rules map a whole word. The build lists every variant that differs from the canonical label.
swap:
  - [qur an, quran]
  - [quran, koran]
  - [quran, quraan]
  - [muhammad, mohammed]
  - [muhammad, mohammad]
  - [muhammad, muhammed]
  - [abu, abou]
  - [abd al, abdul]
  - [abd al, abdel]
  - [abd al, abdal]
  - [abd, abdul]
  - [ibn, bin]
  - [ibn, ben]
  - [sina, sinna]
  - [khaldun, khaldoun]
  - [al ghazali, ghazali]
  - [husayn, hussein]
  - [husayn, hussain]
  - [husayn, hosein]
  - [hasan, hassan]
  - [umar, omar]
  - [uthman, othman]
  - [uthman, osman]
  - [aisha, ayesha]
  - [aisha, aysha]
  - [khadija, khadijah]
  - [khadija, khadeejah]
  - [fatima, fatimah]
  - [hijra, hijrah]
  - [hijra, hegira]
  - [makka, mecca]
  - [mecca, makkah]
  - [mecca, makka]
  - [medina, madinah]
  - [medina, madina]
  - [badr, bader]
  - [uhud, ohod]
  - [khaybar, khaibar]
  - [taif, taaif]
  - [kufa, koufa]
  - [basra, basrah]
  - [cairo, qahira]
  - [cordoba, cordova]
  - [istanbul, constantinople]
  - [sufism, tasawwuf]
  - [hadith, hadeeth]
  - [sunna, sunnah]
  - [sharia, shariah]
  - [sharia, shari ah]
  - [salat, salah]
  - [salah, salat]
  - [sawm, siyam]
  - [zakat, zakah]
  - [hajj, haj]
  - [ramadan, ramadhan]
  - [ramadan, ramazan]
  - [eid, id]
  - [allah, alla]
drop_prefix: [the, al, el, ash, an, at, ar, as, az]   # "al-Ghazali" is also typed "Ghazali"
