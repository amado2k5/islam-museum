# Test deployment of the R2-backed HTML worker, on the test bucket only.
name = "islam-museum-site-test"
main = "src/index.js"
compatibility_date = "2025-10-11"

[assets]
# CI copies only the non-R2 files into dist-assets (see the workflow).
directory = "../../dist-assets"
binding = "ASSETS"
run_worker_first = ["/ar/*", "/en/*", "/ur/*"]

[[r2_buckets]]
binding = "SITE_BUCKET"
bucket_name = "islam-museum-sync-test"
