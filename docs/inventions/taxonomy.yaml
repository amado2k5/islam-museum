status_today: [living, transformed, replaced, extinct, revived]
attribution_status: [original, improvement, transmission, contested, legend]
maker_roles: [inventor, co-inventor, improver, describer, transmitter, translator, commissioner, commercializer, disputed]

inclusion:
  maker:
    required: true
    rule: "A Muslim identity needs a cited basis in the person's faith block; a name, country, family or era is not evidence."
  tradition:
    default: "For a Muslim of a Sunni polity and milieu where sources attest no other tradition, record the museum's Sunni default frame and its source basis."
    other_attested_tradition: "Close the candidate as out of scope and cite the attestation."
    disputed_tradition: "Include only with a sourced, Sunni-first perspectives block on the maker record."
  contribution:
    included: [made, first_described, decisively_improved]
    inherited: "Name the precursor; include only a sourced Muslim contribution, improvement, adaptation or act of transmission."
    non_muslim_maker: "Do not include as a maker; retain their documented role in the invention's history."
  uncertainty:
    no_identity_basis: "Keep as an awaiting-identity-basis lead."
    contested_claim: "Use contested attribution and cited perspectives."
    unsupported_popular_claim: "Use legend only when the story is widely repeated; narrate it as a story and cite both the claim and the scholarly view."
  chronology:
    order: [first-century, abbasid-golden, middle-period, gunpowder-empires, nineteenth-century, twentieth-century, twenty-first-century]
    inherited_precursor_era: "Use pre-islamic-inherited for a named precursor, never to imply that the precursor is a Sunni Muslim invention."
