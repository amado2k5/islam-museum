# Job Browser: the job taxonomy and the roles merge map (Phase 0, 1 November 2026).
# Planning file: nothing reads it yet. Phase 1 turns it into data/job/<slug>.yaml records and a
# scripts/report/jobs-census.ts report. Append-only once approved; a job is never deleted, it is
# merged (its id becomes an alias of the richer job).
#
# Fields per job:
#   id        job/<slug>, immutable
#   domain    one of the domain ids below
#   kind      office | craft | scholarly | religious | commercial | military | medical | artistic |
#             service | administrative | modern-profession
#   label     ar / en / ur (Arabic first; English and Urdu always)
#   roles     the roles: strings in data/person that map to this job (the merge map; exact strings,
#             including the drifted spellings). A role listed under exactly one job.
#   ar_keys   Arabic stems used only for the Phase 0 lead census over summary.ar and content/ar/person
#             (substring matches; a nisba such as الحداد is also a surname, so these are leads, not holders)
#   broader   a wider job this one is a form of (display only)
#   first10   the Phase 1 batch
#   hirfa     true for a hand craft or trade (حِرفة / صناعة): the job also sits on the crafts shelf and its
#             entity carries the craft block (schema.md section 1a: materials, guild, grades, shadd, pir, marks, UNESCO)
#   note      caveats for the writer
domains:
  - { id: governance-law,        label: { ar: الحكم والقضاء,         en: Governance & Law,           ur: حکومت و قانون } }
  - { id: court-administration,  label: { ar: الديوان والإدارة,       en: Court & Administration,     ur: دربار و انتظامیہ } }
  - { id: scholarship-teaching,  label: { ar: العلم والتعليم,         en: Scholarship & Teaching,     ur: علم و تدریس } }
  - { id: faith-preaching,       label: { ar: الدين والدعوة,          en: Faith & Preaching,          ur: دین و تبلیغ } }
  - { id: medicine-care,         label: { ar: الطب والرعاية,          en: Medicine & Care,            ur: طب و نگہداشت } }
  - { id: sciences-numbers,      label: { ar: العلوم والحساب,         en: Sciences & Numbers,         ur: سائنس و حساب } }
  - { id: arts-letters,          label: { ar: الفنون والأدب,          en: Arts & Letters,             ur: فنون و ادب } }
  - { id: building-making,       label: { ar: الحِرَف والصنائع والبناء, en: "Crafts, Building & Making", ur: دستکاری، صنعت اور تعمیر } }
  - { id: trade-travel-sea,      label: { ar: التجارة والسفر والبحر,  en: "Trade, Travel & the Sea",  ur: تجارت، سفر اور سمندر } }
  - { id: war-command,           label: { ar: الحرب والقيادة,         en: War & Command,              ur: جنگ و قیادت } }
  - { id: media-performance,     label: { ar: الإعلام والأداء,        en: Media & Performance,        ur: میڈیا و فن کاری } }
  - { id: sport,                 label: { ar: الرياضة,                en: Sport,                      ur: کھیل } }
  - { id: patronage-public-life, label: { ar: الرعاية والحياة العامة, en: Patronage & Public Life,    ur: سرپرستی و عوامی زندگی } }
  # proposed addition (Phase 0 decision 2): the brief's thirteen domains have no home for the farmer, the herder,
  # the qanat-digger, the gardener, the fisherman or the pearl diver.
  - { id: land-water,            label: { ar: الأرض والماء,           en: Land & Water,               ur: زمین و پانی }, proposed: true }

# roles: strings that describe a standing, not a job. They stay as hand-maintained descriptors and are never
# turned into occupations (Phase 0 decision 3).
descriptors: [prophet, companion, successor, ancestor, tribal-ancestor, martyr, notable, figure, prophetic-family,
  family-of-the-prophet, companion-family, prophet-household, royal, royal-consort, princess, prince, umayyad-prince,
  noble, royalty, other, host, founder, reformer, rebel, convert, saint]

# roles: strings too vague to map by rule. The record keeps the string until the Phase 3 prose sweep reads the
# sources and writes the real occupation(s).
review: [scientist, artist, scribe, military, official, craftsman, mystic, sufi, ascetic, academic, leader]

