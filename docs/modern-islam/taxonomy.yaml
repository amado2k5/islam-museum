firsts_tags:
  [first-muslim-in-space, first-muslim-woman-olympic-gold, first-muslim-nobel-laureate-in-field, first-muslim-head-of-government-in-country, first-muslim-mayor-of-city, first-muslim-legislator-in-country, first-hijab-at-olympics, first-muslim-minister-in-country, first-accredited-muslim-college-in-country, largest-mosque-in-region, largest-gathering, first-islamic-bank-in-country, first-islamic-channel, first-nasheed-award]

reach_index:
  version: 1
  lists: [songs, albums, websites, channels, books]
  weights:
    honour_won: 10
    honour_nominated: 4
    honours_cap: 40
    certified: { gold: 6, platinum: 10, multi-platinum: 15, cap: 30 }
    chart: { top10: 8, top40: 4, charted: 2, cap: 16 }
    reach_log10_per_platform: 1
    reach_platforms_max: 3
    reach_cap: 24
    wikipedia_language: 1
    wikipedia_cap: 15
    press_item: 1
    press_cap: 10
    cover_version: 1
    cover_cap: 5
  tie_break: release-date-oldest-first
  notice: { ar: "هذا المؤشر يقيس مدى توثيق العمل لا جودته؛ المتحف لا يصنّف الفن بالذوق.", en: "This index measures how widely a work is documented, not how good it is; the museum does not rank by taste.", ur: "یہ اشاریہ ناپتا ہے کہ کوئی کام کتنا دستاویزی ہے، اس کی خوبی نہیں؛ عجائب گھر ذوق کی بنیاد پر درجہ بندی نہیں کرتا۔" }

inclusion:
  subject: "about Islam or Muslims, or made by Muslims, with at least one dated fact in the window or a horizon block"
  by_muslims: "made.by_muslims true only with basis self-identified (linked own statement) or documented (reliable source); unverified recorded, never shown as by Muslims"
  faith: "modern-figures lane rulings of 1 November 2026 verbatim: two independent sources naming the school; structured data never settles; bare branch settles nothing; headship never counts; doubt stays unknown"
  default: "Muslims included by default; an explicitly sourced non-Sunni affiliation is labelled, not excluded (docs/scope.md); Sunni positions first wherever views are stated"
  out: [incidental-appearances, single-social-post-only, violent-extremist-media, private-individuals, personal-data-beyond-public-roles, lyrics, article-text, embeds]
