honour_results: [won, nominated, shortlisted, longlisted, certified, ranked, honoured, finalist, participant]
certification_levels: [silver, gold, platinum, multi-platinum, diamond]

horizon_stages: [announced, in-development, in-production, under-construction, scheduled, beta, bid, postponed, cancelled]

reach_platforms: [youtube, spotify, apple-music, anghami, deezer, soundcloud, tiktok, instagram, x, facebook, telegram, snapchat, website, print, broadcast, app-store, play-store, podcast-index]
reach_metrics: [subscribers, followers, views, monthly-listeners, streams, downloads, circulation, monthly-visits, installs, ratings-count]

press_kinds: [news, feature, interview, review, obituary, investigation, opinion, profile, listing]

