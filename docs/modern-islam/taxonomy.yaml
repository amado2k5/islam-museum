# Modern Islam Browser: machine-readable taxonomy (docs/plan/26-modern-islam-browser.md section 2 and 3).
# Phase 1 generates the enums and the three locale labels from this file; never keep a parallel list.
# Append-only once approved. Labels: ar first, then en and ur, as everywhere in the museum.

version: 1
window:
  start: { edtf: "1976-01-03", hijri: "1396-01-01", calendar: gregorian, precision: day, derived: true, note: "1 Muharram 1396; Gregorian conversion derived" }
  end: build-date

sections:
  - id: web
    label: { ar: "المواقع والتطبيقات", en: "Websites and apps", ur: "ویب سائٹس اور ایپس" }
    classes: [work, listing]
    kinds: { work: [website, online-library, app], listing: [app, software, platform] }
    facets: [content_type, languages, active, country]
  - id: music
    label: { ar: "الموسيقى والأناشيد", en: "Music and nasheed", ur: "موسیقی اور نعت و نشید" }
    classes: [work, person, group, listing, award]
    kinds: { work: [album, song, composition], listing: [record-label, production-company] }
    facets: [genre, honours, country, language, decade]
  - id: film
    label: { ar: "الأفلام", en: "Films", ur: "فلمیں" }
    classes: [screen, person, event]
    kinds: { screen: [film, short, tv_film, documentary, animation], event: [festival] }
    facets: [format, approach, country, language, decade, by_muslims]
  - id: tv
    label: { ar: "المسلسلات والبرامج", en: "Series and programmes", ur: "ڈرامے اور پروگرام" }
    classes: [screen, listing]
    kinds: { screen: [series, miniseries, programme, web_series, documentary_series, children, episode], listing: [tv-channel] }
    facets: [format, ramadan_season, broadcaster, country, language]
  - id: conferences
    label: { ar: "المؤتمرات والملتقيات", en: "Conferences and conventions", ur: "کانفرنسیں اور اجتماعات" }
    classes: [event, group, work]
    kinds: { event: [conference, congress, gathering, council, declaration] }
    facets: [recurs, country, organiser, decade]
  - id: heritage
    label: { ar: "شهور التراث والمهرجانات", en: "Heritage months and festivals", ur: "ورثے کے مہینے اور میلے" }
    classes: [event, practice]
    kinds: { event: [heritage-month, festival, gathering, pilgrimage-season], practice: [festival] }
    facets: [month, hijri_month, country, since]
  - id: rights
    label: { ar: "الحقوق والاحتجاج", en: "Rights and protest", ur: "حقوق اور احتجاج" }
    classes: [event, work, group]
    kinds: { event: [protest, attack, law-enacted, court-ruling, persecution, declaration], work: [report, law, court-judgment] }
    facets: [kind, country, year, responded_to]
  - id: books
    label: { ar: "الكتب والناشرون", en: "Books and publishers", ur: "کتابیں اور ناشر" }
    classes: [work, person, listing, event, award]
    kinds: { work: [book], listing: [publisher, bookshop], event: [festival] }
    facets: [genre, language, country, decade, translation_of]
  - id: upcoming
    label: { ar: "القادم", en: "Upcoming", ur: "آنے والا" }
    classes: ["*"]
    kinds: {}
    facets: [stage, expected, section]
  - id: figures
    label: { ar: "أعلام الخمسين سنة", en: "Figures of the last fifty years", ur: "پچاس برسوں کی شخصیات" }
    classes: [person]
    kinds: {}
    facets: [field, country, decade, honours, faith_recorded]
    fields:
      - { id: scholars-preachers, label: { ar: "العلماء والدعاة", en: "Scholars and preachers", ur: "علما اور مبلغین" }, roles: [scholar, mufti, qadi, shaykh-al-islam, jurist, theologian, preacher, imam, khatib, mystic] }
      - { id: politics-state, label: { ar: "السياسة والدولة", en: "Politics and state", ur: "سیاست اور ریاست" }, roles: [politician, caliph, sultan, emir] }
      - { id: diplomacy, label: { ar: "الدبلوماسية", en: "Diplomacy", ur: "سفارت کاری" }, roles: [diplomat] }
      - { id: finance-economics, label: { ar: "المال والاقتصاد", en: "Finance and economics", ur: "مالیات اور معاشیات" }, roles: [banker, economist, entrepreneur, merchant] }
      - { id: science, label: { ar: "العلوم", en: "Science", ur: "سائنس" }, roles: [scientist, mathematician, astronomer, engineer, astronaut] }
      - { id: medicine, label: { ar: "الطب", en: "Medicine", ur: "طب" }, roles: [physician, nurse] }
      - { id: history-academy, label: { ar: "التاريخ والجامعة", en: "History and the academy", ur: "تاریخ اور جامعہ" }, roles: [historian, professor, philosopher, geographer] }
      - { id: teaching, label: { ar: "التعليم", en: "Teaching", ur: "تعلیم" }, roles: [teacher] }
      - { id: writing, label: { ar: "الكتابة", en: "Writing", ur: "تحریر" }, roles: [writer, poet] }
      - { id: arts, label: { ar: "الفنون", en: "Arts", ur: "فنون" }, roles: [artist, calligrapher, architect, musician, singer, composer, actor, director, producer, comedian] }
      - { id: media-creators, label: { ar: "الإعلام وصنّاع المحتوى", en: "Media and creators", ur: "میڈیا اور تخلیق کار" }, roles: [journalist, presenter, influencer] }
      - { id: activism, label: { ar: "النشاط العام", en: "Activism", ur: "سماجی سرگرمی" }, roles: [activist, lawyer, judge] }
      - { id: sport, label: { ar: "الرياضة", en: "Sport", ur: "کھیل" }, roles: [athlete, coach] }
  - id: organizations
    label: { ar: "المنظمات", en: "Organisations", ur: "تنظیمیں" }
    classes: [group, listing]
    kinds: { group: [organization, institution, council, charity, relief-agency, foundation, student-association, "women's-organisation", professional-association, interfaith-body, international-organisation, community-organisation, mosque-association, movement, party, think-tank, online-community], listing: [platform] }
    facets: [kind, scope, country, founded_decade]
  - id: media
    label: { ar: "الإعلام", en: "Media", ur: "ذرائع ابلاغ" }
    classes: [listing, work]
    kinds: { listing: [media, magazine, podcast, newspaper, tv-channel, radio-station, newsletter, channel], work: [newspaper, journal, podcast] }
    facets: [kind, language, country, founded_decade, reach]
  - id: sports
    label: { ar: "الرياضة", en: "Sport", ur: "کھیل" }
    classes: [person, group, event, award]
    kinds: { group: [team], event: [tournament] }
    facets: [sport, country, honours, decade]
  - id: awards
    label: { ar: "الجوائز والمسابقات", en: "Awards and competitions", ur: "ایوارڈ اور مقابلے" }
    classes: [award, event, screen]
    kinds: { event: [competition, award-ceremony], screen: [programme] }
    facets: [award_kind, field, country, since]
  - id: achievements
    label: { ar: "الإنجازات والسوابق", en: "Achievements and firsts", ur: "کارنامے اور اولیات" }
    classes: [person, event, building]
    kinds: {}
    facets: [prize, first_of, country, year]
  - id: enterprise
    label: { ar: "الشركات والمال", en: "Enterprise and finance", ur: "کاروبار اور مالیات" }
    classes: [listing, group, award]
    kinds: { listing: [company, startup, brand, fund], group: [bank, standards-body, certifier] }
    facets: [kind, sector, country, founded_decade, ranking]
  - id: arts
    label: { ar: "الفنون والثقافة", en: "Arts and culture", ur: "فنون اور ثقافت" }
    classes: [person, work, event, building, award]
    kinds: { work: [poem, diwan, composition], event: [exhibition, festival], building: [museum] }
    facets: [discipline, country, decade]
  - id: built
    label: { ar: "ما بُني منذ ١٩٧٦", en: "Built since 1976", ur: "۱۹۷۶ء سے تعمیر شدہ" }
    classes: [building, event]
    kinds: { building: [mosque, madrasa, library, islamic-centre, museum, university-campus, other], event: [founding] }
    facets: [kind, country, completed_decade, architect]
  - id: learning
    label: { ar: "التعليم والمعرفة", en: "Learning and knowledge", ur: "تعلیم اور علم" }
    classes: [group, listing, work]
    kinds: { group: [university, seminary, institution], listing: [school, university], work: [book, curriculum, online-library] }
    facets: [kind, online, country, language]

# The derived section of a record (scripts/modern/sections.ts) is computed from class, kind, dates and fields, in this order of precedence:
# horizon present -> upcoming (in addition to its own section); then the first section whose class/kind pair matches; a person goes to
# sports when sports[] exists, to achievements when honours[] carries a laureate-kind award or a firsts tag, otherwise to figures.

new_kinds:
  work: [album, song]
  event: [protest, attack, competition, award-ceremony, festival, heritage-month, exhibition, tournament, launch]
  listing: [newspaper, tv-channel, radio-station, newsletter, channel, record-label, production-company]
  group: [team, think-tank, online-community]
  building: [islamic-centre, museum, university-campus]
  roles: [singer, composer, actor, director, producer, presenter, journalist, diplomat, banker, economist, entrepreneur, comedian, influencer, coach, astronaut, judge, lawyer, nurse, professor]

