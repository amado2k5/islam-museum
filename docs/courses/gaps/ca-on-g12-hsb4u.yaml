- code: B1.3
  text: explain major social science methodologies and research designs […]
  why: The expectation names social-science research designs (qualitative and quantitative methods, ethnography, surveys); the museum's Muqaddima record speaks of verifying the methods of history, which is not a research design of that kind, so the lesson does not claim it.
  searches:
  - 'find_entity.py "research method" "منهج البحث" "isnad": concept/isnad and passage records on the transmission of hadith; no record on social-science research designs'
  - 'find_entity.py "Ibn Khaldun" "ابن خلدون" "Muqaddimah": person/ibn-khaldun, concept/asabiyya and work/al-muqaddima exist and are taught in lesson b-1 under B1.1 and B1.2; none of them records social-science research designs or any other point of this expectation'
- code: B2.1
  text: describe ways in which influential Canadian leaders have contributed to social change […]
  why: The expectation is about Canadian leaders who contributed to social change; the museum holds no record on any of them.
  searches:
  - 'find_entity.py "Canada" "كندا" "Canadian": place/canada has no prose; one event record (Canadian Islamic History Month) and source records; nothing on Canada''s leaders, policies, population, work or institutions'
  - 'find_entity.py "women" "المرأة" "women rights": concept/imra (women in fiqh) and records on hadith counsels to women; nothing on discrimination, social change or work in Canada'
- code: B2.2
  text: explain how various economic, environmental, political, or sociocultural factors […] can lead to social change, and how other factors […] can create resistance to change
  why: The expectation asks for economic, environmental, political and sociocultural factors leading to or resisting social change, with modern examples; no record explains such factors.
  searches:
  - 'find_entity.py "environment" "بيئة" "climate": seven records, among them concept/environmental-protection-in-islam and concept/athar-al-iqlim (climate''s effect on people); none on climate change, environmental activism or fossil-fuel exploitation'
  - 'find_entity.py "social change" "التغير الاجتماعي" "civilization": two source records (Hodgson, The Venture of Islam; an article on Ziryab); no entity about social change'
  - 'find_entity.py "revolution" "ثورة" "protest": 75 records of historical revolts and wars (e.g. event/kharijite-rebellion-866, event/arab-revolt-1334), several without prose; none treats protest, advocacy or community organization as a means of creating social change'
- code: B2.3
  text: explain various means of creating social change […]
  why: The expectation asks for means of creating social change (protest, advocacy, organization); the revolt records are single wars without such analysis.
  searches:
  - 'find_entity.py "revolution" "ثورة" "protest": 75 records of historical revolts and wars (e.g. event/kharijite-rebellion-866, event/arab-revolt-1334), several without prose; none treats protest, advocacy or community organization as a means of creating social change'
  - 'find_entity.py "social change" "التغير الاجتماعي" "civilization": two source records (Hodgson, The Venture of Islam; an article on Ziryab); no entity about social change'
- code: B2.4
  text: explain the relationships between conformity, alienation, and social change […]
  why: The expectation is about conformity, alienation and social change; no record treats them, and the asabiyya record is about group solidarity, not conformity or alienation.
  searches:
  - 'find_entity.py "social change" "التغير الاجتماعي" "civilization": two source records (Hodgson, The Venture of Islam; an article on Ziryab); no entity about social change'
  - 'find_entity.py "Ibn Khaldun" "ابن خلدون" "Muqaddimah": person/ibn-khaldun, concept/asabiyya and work/al-muqaddima exist and are taught in lesson b-1 under B1.1 and B1.2; none of them records social-science research designs or any other point of this expectation'
- code: B2.5
  text: explain the relationships between poverty, affluence, and social change […]
  why: The expectation asks for the relationships between poverty, affluence and social change (the digital divide, access to education); zakat is used in lesson d-1 for D1.4, but no record treats these relationships.
  searches:
  - 'find_entity.py "poverty" "فقر" "zakat": practice/zakat, concept/zakat and concept/faqr (poverty in Sufi ethics); zakat is taught in lesson d-1 under D1.4; none treats the relationship of poverty and affluence to social change or the digital divide'
  - 'find_entity.py "literacy" "محو الأمية" "education": 22 records on tarbiya, Islamic education and Muslim education today; none gives literacy rates or links literacy to standard of living'
- code: B2.6
  text: explain the impact of social change on indi­viduals in Canada and on Canadian society […]
  why: The expectation asks for the impact of social change on individuals and society in Canada; the museum holds no record on Canadian society.
  searches:
  - 'find_entity.py "Canada" "كندا" "Canadian": place/canada has no prose; one event record (Canadian Islamic History Month) and source records; nothing on Canada''s leaders, policies, population, work or institutions'
  - 'find_entity.py "social change" "التغير الاجتماعي" "civilization": two source records (Hodgson, The Venture of Islam; an article on Ziryab); no entity about social change'
- code: B3.1
  text: identify some recent technological changes and describe how they affect individuals […]
  why: The expectation asks for recent technological changes and their effects on individuals; no record in the museum treats them.
  searches:
  - 'find_entity.py "technology" "تقنية" "innovation": records on bid''a (innovation in religion) and the course record for Grade 6 science; no record on recent technologies or their effects on people'
  - 'find_entity.py "labour" "عمل" "workers": concept/work-in-islam and concept/amal (the five rulings on action); nothing on the nature of work changing or on workers in Canada'
- code: B3.2
  text: explain how various new technologies […] can affect social structures and interactions
  why: The expectation asks how new technologies in medicine, education, entertainment and health affect social structures; no record treats a present-day technology, and the printing records found are about publishing the Qur'an and sources.
  searches:
  - 'find_entity.py "technology" "تقنية" "innovation": records on bid''a (innovation in religion) and the course record for Grade 6 science; no record on recent technologies or their effects on people'
  - 'find_entity.py "printing" "مطبعة" "printing press": a Qur''an printing complex (group/king-fahd-complex-for-printing-the-holy-quran) and many source records; no record of a technology changing social structures'
- code: B3.3
  text: explain how technological advances […] lead to cul­tural adaptations […]
