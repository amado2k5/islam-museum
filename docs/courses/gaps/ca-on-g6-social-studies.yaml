- code: B3.7
  text: identify and locate on a map countries and regions with which Canada has a significant interrelationship, and use longitude and latitude to locate cities in these countries/regions […]
  why: The expectation is about locating on a map the countries and regions with which Canada is interrelated, using longitude and latitude. The museum holds records for some of the named cities (place/kabul, place/mogadishu, place/nairobi, place/beijing, place/london, place/mumbai), but none states a latitude or longitude or any link with Canada; place/kabul's prose is al-Baladhuri's account of the conquest. A link would stretch the record.
  searches:
  - 'find_entity.py "Kabul" "كابل" "Kabol": place/kabul has prose in three languages, about the conquest, with no coordinates and no mention of Canada'
  - 'find_entity.py "Mogadishu" "مقديشو" "Muqdisho": place/mogadishu has no prose; same for place/nairobi, place/beijing, place/london, place/mumbai'
