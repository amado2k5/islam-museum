course: course/ca-on-g6-social-studies
gaps:
- code: A1.1
  text: explain how various features, including built, physical, and social features of communities, can contribute to identities in and images of a territory and/or country […], and assess the contribution of some of these features to images of and identities in Canada […]
  why: The expectation is about settler and newcomer communities, their origins, their life and their interactions in Canada; the museum holds no record on Canadian settlement or on a named newcomer community, and place/canada has no prose.
  searches: &id001
  - 'find_entity.py "French" "الفرنسيون" "Quebec" "Acadian": only the French campaign in Egypt and related events of 1798; nothing on Canada'
  - 'find_entity.py "Chinese labourers" "العمال الصينيون" "railway": no real record'
  - 'find_entity.py "Canada" "كندا" "Canadian": place/canada has no prose; the other Canada records are sources, a course and event/canadian-islamic-history-month (used in the lesson)'
- code: A1.2
  text: analyse some of the contributions that various First Nations, Métis, and Inuit communities and individuals have made to Canada […]
  why: The expectation is about the contributions, territories, history or ways of life of First Nations, Métis and Inuit communities in Canada; the museum holds no record on any of them.
  searches: &id002
  - 'find_entity.py "First Nations" "الأمم الأولى" "Indigenous" "Métis": no real record'
  - 'find_entity.py "Inuit" "الإنويت" "Arctic": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable'
- code: A1.3
  text: analyse some of the contributions that various settler/newcomer groups have made to Canadian identities […]
  why: The expectation is about settler and newcomer communities, their origins, their life and their interactions in Canada; the museum holds no record on Canadian settlement or on a named newcomer community, and place/canada has no prose.
  searches: *id001
- code: A1.4
  text: explain how various groups and communities, including First Nations, Métis, and Inuit communities, have contributed to the goal of inclusiveness in Canada […], and assess the extent to which Canada has achieved the goal of being an inclusive society […]
  why: The expectation asks the student to explain how groups worked toward inclusiveness in Canada and to assess how far it has been reached. event/canadian-islamic-history-month records a commemoration and a campaign that promotes inclusion, but says nothing of the groups' efforts toward the goal or of any assessment of it, so it supports lesson A3.4/A3.11 and not this expectation.
  searches:
  - 'find_entity.py "multiculturalism" "التعددية الثقافية" "inclusion": no real record'
  - 'find_entity.py "Islamophobia" "الإسلاموفوبيا" "Quebec City mosque": event/canadian-islamic-history-month (mentions the Green Square campaign only in passing) and concept/islamufubiya; neither describes the Charter, the Multiculturalism policy or an assessment'
