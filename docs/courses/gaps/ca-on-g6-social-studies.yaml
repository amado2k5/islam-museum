- code: B1.1
  text: explain why Canada participates in specific international accords and organizations […], and assess the influence of some significant accords and/or organizations in which Canada participates
  why: The expectation is about Canada's participation in international accords and organizations; the museum holds no record on the UN, NATO, the WHO, NAFTA or the like in relation to Canada. event/international-day-to-combat-islamophobia is a UN observance and says nothing of Canada's part.
  searches: &id003
  - 'find_entity.py "United Nations" "الأمم المتحدة" "UN": no real record of the organization; matches are persons whose names contain ''un'''
  - 'find_entity.py "NATO" "حلف الناتو" "WHO": no real record of either'
  - 'find_entity.py "trade agreement" "اتفاقية تجارية" "NAFTA": only place/nafta, the Tunisian town of Nafta'
- code: B1.2
  text: analyse responses of Canadian governments, non-governmental organizations (NGOs), and individual citizens to an economic, environmental, political, and/or social issue of international significance […]
  why: The expectation is about Canadian governments and NGOs responding to a current international issue or disaster; the museum holds no record of such a response, and its earthquake records are medieval events with no Canadian link.
  searches: &id004
  - 'find_entity.py "refugees" "اللاجئون" "refugee": no real record'
  - 'find_entity.py "earthquake" "زلزال" "tsunami": medieval earthquake events (for example event/earthquake-tsunami-425); none a modern disaster or a Canadian response'
