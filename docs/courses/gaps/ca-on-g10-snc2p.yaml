- code: B1.1
  text: analyse, on the basis of research, medical imaging technologies […] used in Canada to explore, diagnose, or treat the human body, and communicate their findings [PR, AI, C]
  why: Asks for an analysis of medical imaging technologies used in Canada; the museum holds no record on imaging technology.
  searches:
  - 'find_entity.py "X-ray" "ultrasound" "microscope" "المجهر" "medical imaging": one hit, a fatwa on whether X-rays break the fast; no record on imaging technology'
  - 'find_entity.py "Ammar al-Mawsili" "عمار الموصلي" "cataract" "ophthalmology" "المياه البيضاء": invention/ammar-hollow-cataract-needle describes a surgical needle for cataract; it is neither an imaging technology nor an assessment of a technology''s effect on tissue'
- code: B1.2
  text: evaluate the effects that use of or exposure to a technology, substance, or environmental factor […] may have on the function of human tissues, organs, or systems [AI, C]
  why: Asks for the effects of a technology, substance or environmental factor on the function of tissues, organs or systems; the one candidate, concept/al-tadkhin on smoking, gives a preacher's opinion and says nothing of the body.
  searches:
  - 'find_entity.py "tobacco" "smoking" "تدخين" "pollution": concept/al-tadkhin records a preacher''s view that smoking is a waste of money; it says nothing about tissues, organs or health'
  - 'find_entity.py "asthma" "الربو" "heart disease" "diabetes" "السكري": a surname (person/al-sukkari) and a fatwa on fasting with chronic illness; no record on a health problem of tissues, organs or systems'
- code: B2.1
  text: 'use appropriate terminology related to human cells, tissues, organs, and systems, including, but not limited to: absorption, anaphase, capillaries, concentration, differentiation, diffusion, interphase, metaphase, osmosis, prophase, red blood cells, regeneration, and telophase [C]'
  why: Asks the student to use terms for human cells, tissues, organs and systems; the museum holds no record on cells, and a term such as "capillaries" appears only inside invention/pulmonary-circulation, which is not a record about terminology.
  searches:
  - 'find_entity.py "mitosis" "cell division" "الخلية" "tissue" "نسيج": woven cloth (the Arabic word nasij) and a fatwa on bone grafts; nothing on cells'
  - 'find_entity.py "lungs" "الرئة" "breathing" "blood" "الدم": a hit list dominated by fiqh and hadith on blood-money, the sanctity of blood and impurity; the one physiological record, invention/pulmonary-circulation, is used in lesson b-1 and gives the route of the blood, not the function of a system'
