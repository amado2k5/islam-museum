- code: B1.1
  text: explain how common human needs […] are reflected in religions and belief traditions across cultures and historical eras
  why: The expectation asks the student to explain how common human needs are reflected in religions across cultures and eras, a comparison across traditions. The museum's records describe Islam record by record; none treats human needs across traditions.
  searches:
  - 'find_entity.py "human needs" "الحاجات الإنسانية" "sense of community": no real record'
  - 'find_entity.py "comparative religion" "مقارنة الأديان" "world religions": one real record, a source record for a video channel, not a subject record'
- code: B1.4
  text: explain how a focus on the differences between various religions rather than their commonalities can foster prejudice, bias, and discrimination
  why: The expectation is about how a focus on differences between religions fosters prejudice, bias and discrimination. The museum holds no record on prejudice or on the study of religious difference.
  searches:
  - 'find_entity.py "prejudice" "التعصب" "discrimination": no real record'
  - 'find_entity.py "interfaith dialogue" "الحوار بين الأديان" "religious tolerance": no real record'
- code: B2.1
  text: define and appropriately use terms and concepts related to the study of world religions and belief traditions […]
  why: The expectation asks the student to define a list of study terms across traditions (agnosticism, ecumenism, polytheism and others). The museum holds no record of these terms as such.
  searches:
  - 'find_entity.py "agnosticism" "atheism" "الإلحاد": 2 real records, concept/ilhad (an Islamic usage about deviation from religion) and a journal source; neither defines the terms across traditions'
  - 'find_entity.py "pantheism" "polytheism" "ecumenism": no real record'
- code: B3.1
  text: describe factors that contribute or have contributed to the global influence of various religions and belief traditions […]
  why: The expectation asks for the factors behind the global influence of various religions (migration, forced migration, proselytism, colonialism). The museum's records on migration concern early Islamic emigrations and one note on emigration to the West; none analyses the global influence of religions.
  searches:
  - 'find_entity.py "colonialism" "الاستعمار" "migration": 13 real records, closest event/first-migration-to-abyssinia and concept/hijra-fiqh; none about factors of global influence'
  - 'find_entity.py "emigration" "immigration" "الهجرة والاستيطان": 5 real records, closest event/emigration-of-the-companions and concept/al-hijra-ila-al-gharb; none about the global spread of religions'
- code: B3.2
  text: analyse ways in which religions and belief traditions can influence the relationship between individuals and their society, with a focus on contemporary Canadian society
  why: The expectation asks for an analysis, focused on contemporary Canadian society, of how religions influence the relationship between individuals and their society. The only Canadian record with prose, event/canadian-islamic-history-month, is used in lesson B-2 for the commemoration; it does not analyse that relationship.
  searches:
  - 'find_entity.py "Canada" "كندا" "Canadian": 12 real records; place/canada has no prose, event/canadian-islamic-history-month is used elsewhere, the rest are source records'
  - 'find_entity.py "Ontario Human Rights Code" "حقوق الإنسان" "creed discrimination": 2 real records, neither about Canadian society'
- code: B3.3
  text: explain the impact of including “creed” as a protected ground of discrimination under the Ontario Human Rights Code
  why: The expectation is about "creed" as a protected ground under the Ontario Human Rights Code, a point of Ontario law. The museum holds no record on it.
  searches:
  - 'find_entity.py "Ontario Human Rights Code" "حقوق الإنسان" "creed discrimination": 2 real records, concept/huquq-al-insan (human rights violations in the Arab world) and a relief foundation listing; none on Ontario law'
  - 'find_entity.py "Canada" "كندا" "Canadian": 12 real records; none on Canadian human-rights law'
- code: B3.5
  text: identify similarities between civil and religious observances and celebrations […]
  why: The expectation asks for similarities between civil and religious observances (the oath of citizenship, the national anthem, Remembrance Day). The museum holds no record on Canadian civil observances.
  searches:
  - 'find_entity.py "oath of citizenship" "national anthem" "Remembrance Day": no real record'
  - 'find_entity.py "cenotaph" "war memorial" "نصب تذكاري": no real record'
- code: C2.3
  text: demonstrate an understanding of how various world religions and belief traditions accommodate a range of commitment, from strict observance to liberal compromise
  why: The expectation asks how traditions accommodate a range of commitment, from strict observance to liberal compromise. The museum holds no record that describes a range of observance within the faith.
  searches:
  - 'find_entity.py "religious observance" "التدين" "degree of commitment": no real record'
  - 'find_entity.py "strict observance" "liberal" "التساهل في الدين": 2 real records, both source records for podcasts, not subject records'
- code: C2.4
  text: describe difficulties that individuals may encounter in Canadian society when their reli­gious observance includes particular practices in regard to dress, diet, or behaviour […]
  why: The expectation is about difficulties that individuals meet in Canadian society over dress, diet or behaviour. concept/hijab and the halal records give rulings of fiqh and say nothing of life in Canada; the whole object of the expectation lies outside what the museum holds.
  searches:
  - 'find_entity.py "hijab" "الحجاب" "dress": concept/hijab is a record of the jurists'' rulings on covering, with no word on experience in Canadian society'
  - 'find_entity.py "diet" "halal" "الحلال" "dietary": 40 real records, closest concept/halal-lawful and concept/dhabaih-fiqh; rulings, not experiences in Canadian society'
- code: C3.1
  text: describe ways in which popular culture uses traditional symbols, ideas, and other elements associated with various world religions and belief traditions
  why: The expectation asks how popular culture uses traditional symbols and ideas of various religions. The museum holds no record on popular culture's use of religious symbols.
  searches:
  - 'find_entity.py "popular culture" "الثقافة الشعبية" "media": 39 real records, closest concept/al-ilam-wal-mas-uliyya and exhibit/path-muslim-media; none on popular culture''s use of religious symbols'
  - 'find_entity.py "symbol" "رمز" "religious symbol": 4 real records, none about a religious symbol'
- code: C3.2
  text: explain the effects on faith communities as well as popular culture when specific faith symbols are appropriated by popular culture
  why: The expectation asks for the effects on faith communities and popular culture when faith symbols are appropriated. The museum holds no record on this.
  searches:
  - 'find_entity.py "appropriation" "faith symbols" "توظيف الرموز الدينية": one real record, event/umar-sawafi, about a land measure and unrelated'
  - 'find_entity.py "popular culture" "الثقافة الشعبية" "media": 39 real records; none on appropriation of faith symbols'
- code: C3.3
  text: identify, explain, and evaluate examples of bias and prejudice in pop-culture representations of religions and belief traditions […]
  why: The expectation asks the student to identify and evaluate bias in pop-culture representations of religions. The nearest record, concept/surat-al-mutadayyin-fi-al-ilam, reports a studio audience's poll on the image of the religious person in Arab visual media, drawn from one lecture series and mostly the speakers' views; it gives no restatable account of bias in the representation of religions, so no link is made. A lesson from it is listed in the run log as possible.
  searches:
  - 'find_entity.py "stereotype" "الصورة النمطية" "representation of Islam": no real record'
  - 'find_entity.py "popular culture" "الثقافة الشعبية" "media": 39 real records; the nearest is concept/surat-al-mutadayyin-fi-al-ilam, a poll in one lecture series, not used'
- code: D1.4
  text: explain how practices and rituals employed in festivals and celebrations of various religions and belief traditions reflect the teachings of those traditions
  why: The expectation asks how festival practices reflect the teachings of their tradition. The festival records state rulings and practices but do not say which teaching each practice reflects, so the link would be the museum's own.
  searches:
  - 'find_entity.py "festival teachings" "حكمة العيد" "meaning of festival": no real record'
  - 'entity_brief.py practice/eid-al-fitr and practice/eid-al-adha: rulings and practices only, no statement of the teaching a practice reflects'
- code: D1.5
  text: explain the origins of symbols associated with specific religious festivals, celebrations, and commemorations […]
  why: The expectation asks for the origins of symbols of religious festivals (the Advent wreath, the menorah, the lotus). The museum holds no record on a festival symbol.
  searches:
  - 'find_entity.py "crescent symbol" "رمز الهلال" "star and crescent": no real record'
  - 'find_entity.py "symbol" "رمز" "religious symbol": 4 real records, none about a festival symbol'
- code: D2.3
  text: demonstrate an understanding of symbols, art, and literature associated with rites of pas­sage in various religions and belief traditions
  why: The expectation asks for symbols, art and literature associated with rites of passage. The museum holds no record that ties art or literature to a rite of passage.
  searches:
  - 'find_entity.py "art of rites" "funeral art" "wedding songs": no real record'
  - 'find_entity.py "sacred story" "art" "calligraphy" "الخط العربي": 40 real records, closest concept/islamic-calligraphy, which ties script to writing the Qur''an, not to a rite of passage'
- code: E1.4
  text: explain the intended message of specific passages from sacred writings or oral teachings from various religions and belief traditions […]
  why: The expectation asks the student to explain the intended message of specific passages of sacred writings. The museum does not paraphrase or say what a Qur'anic verse means (AGENTS.md), and holds no record of passages from the other traditions' writings.
  searches:
  - 'find_entity.py "tafsir" "تفسير" "message of verse": 40 real records, closest concept/tafsir and work/jami-al-bayan; records of works of exegesis, which the museum may not use to state what a verse means'
  - 'find_entity.py "Beatitudes" "Eightfold Path" "Seven Grandfather Teachings": no real record'
- code: E2.4
  text: explain the relationships between sacred stories and various symbols and works of art, music, or literature
  why: The expectation asks for the relationship between sacred stories and symbols or works of art, music or literature. concept/islamic-calligraphy ties script to writing the Qur'an (used in lesson E-1 for the importance of a written text), not to a sacred story.
  searches:
  - 'find_entity.py "sacred story" "art" "calligraphy" "الخط العربي": 40 real records, closest concept/islamic-calligraphy and event/arabic-script-origin; none ties a sacred story to a work of art'
  - 'find_entity.py "nasheed" "literature" "قصص الأنبياء": 16 real records, closest source/qisas-al-anbiya-kisai-kahana and passage/qisas-anbiya-* (works of prophets'' tales); none ties a sacred story to symbols, art or music'
- code: F2.3
  text: identify the relationship between place and common celebrations and commemorations […]
  why: The expectation asks for the relationship between place and common celebrations and commemorations (cenotaphs on Remembrance Day). The museum holds no record tying a place to a celebration of this kind.
  searches:
  - 'find_entity.py "cenotaph" "war memorial" "نصب تذكاري": no real record'
  - 'find_entity.py "commemoration" "إحياء الذكرى" "celebration": 4 real records, closest practice/mawlid-al-nabi (two sentences, cited to Wikidata), no place tied to a celebration'
- code: C1.4
  text: explain the relationship between religious movements […] or events […] and changes in religious practice over time
  why: The only record tried, the change of the qibla, was withdrawn because its text uses hostile language about a religious group in the record's own voice, so no remaining record shows an event changing a practice over time.
  searches:
  - 'find_entity.py "qibla" "قبلة" "change of direction": event/change-of-qibla, withdrawn from every lesson (hostile language about Jews in the record''s own voice)'
  - 'practice/ashura checked: it links a remembered incident to a fast (C1.3) but gives no account of a change in practice over time'
- code: E2.1
  text: explain the influence of sacred writings and oral teachings in the origin and development of various world religions and/or belief traditions […]
  why: The only record offered for it, the Qur'an verse on the pilgrimage, was withdrawn as a precaution (the passage page's commentary reports a hadith about dying "a Jew or a Christian"), and no remaining record shows a sacred text in the origin and development of a religion.
  searches:
  - 'passage/quran-3-97: withdrawn from these lessons; a student who opens the page reads the commentary, and the founder may restore the link'
  - 'concept/ramadan-fiqh and passage/muslim-0045 checked: they tie a month to the Qur''an and place one hadith in a chapter, and do not show a text''s influence on a religion''s origin or development'
