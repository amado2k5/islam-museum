course: course/ca-on-g1-social-studies
gaps:
- code: A1.1
  text: describe how and why a person’s roles, relationships, and responsibilities, in relation to others and to the environment, may change in different places or situations and at different times […]
  why: Asks how and why a person's roles and responsibilities change in different places and times; the museum's family records state duties, not how a child's role changes.
  searches:
  - 'find_entity.py "family" "أسرة" "roles" "parents" "الوالدين": only concept/huquq-al-walidayn and practice/birr-al-walidayn, which state duties toward parents, not how roles change'
  - 'find_entity.py "childhood" "طفولة" "child" "growing up": no record on a child''s growing responsibilities (concept/janin is the unborn child)'
- code: A1.3
  text: compare some of the significant events in their own lives and/or the lives of their family members with those in the lives of their peers
  why: Asks the student to compare significant events in their own life with those of peers; the object is the student's own life, not a subject of the museum.
  searches:
  - 'find_entity.py "childhood" "طفولة" "child" "growing up": no record on a child''s life events'
  - 'find_entity.py "self" "identity" "هوية": only records on self-admiration and self-delusion; none on a child''s life'
- code: A1.4
  text: describe the impact that people can have on each other in some different situations […] and some of the ways in which interactions between people can affect a person’s sense of self
  why: Asks how people's interactions affect each other and a person's sense of self; no record describes this.
  searches:
  - 'find_entity.py "friendship" "صداقة" "sharing" "كرم": concept/friendship covers the meaning of friendship, the law''s encouragement of it and eating at a friend''s house, not how interactions shape a person''s sense of self; concept/karam is generosity'
  - 'find_entity.py "self" "identity" "هوية": only records on self-admiration and self-delusion; nothing on the effect of others on a person''s sense of self'
- code: A1.5
  text: identify some of the ways in which First Nations, Métis, and Inuit individuals and communities are reclaiming and revitalizing aspects of their identity that were lost or taken away due to colonization, including the residential school system […], and the role …
  why: Asks about First Nations, Métis and Inuit reclaiming identity after colonization and residential schools; the museum holds no record on these peoples.
  searches:
  - 'find_entity.py "Indigenous" "السكان الأصليين" "First Nations" "Métis": no real record'
  - 'find_entity.py "residential school" "colonization" "الاستعمار": only period/colonial-era, a general period record, not about Canada or its peoples'
- code: A2.1
  text: formulate questions to guide investigations into some aspects of the interrelationship between events, people, and/or places in their lives and their own roles, relationships, responsibilities, and identity/sense of self […]
  why: 'skills expectation: names no subject matter'
