  searches:
  - 'find_entity.py "journalism" "mediation" "arbitration" "تحكيم": 3 records; event/arbitration-of-siffin is a historical event, not a career, and the others are not on a profession'
  - 'find_entity.py "mediation" "journalist" "صحافة" "وساطة": 9 word matches, among them person/ahmed-midhat (a writer and journalist) and concept/al-nashat-ghayr-al-tabii (intermediation in trade); no record on a career that states a philosophical presupposition'
