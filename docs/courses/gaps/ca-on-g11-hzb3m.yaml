- code: D2.2
  text: explain the philosophical presuppositions that are implicit in other subject areas […]
  why: The expectation asks the student to explain the philosophical presuppositions implicit in other subjects (the nature of knowledge in science, objectivity in history). No record states such a presupposition.
  searches:
  - 'find_entity.py "epistemology" "knowledge" "المعرفة" "ilm": 175 word matches; concept/ilm is seeking knowledge as a duty, and no record treats the nature of knowledge in a science'
  - 'entity_brief.py person/ibn-khaldun --full: history as a science of al-umran (Yeomans) is a claim about history, but the record does not state a presupposition about objectivity'
- code: D2.3
  text: explain the philosophical presuppositions that are implicit in a variety of careers […]
