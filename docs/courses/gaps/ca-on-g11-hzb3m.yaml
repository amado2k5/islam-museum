- code: B2.3
  text: compare how different philosophical tradi­tions approach the same big question […]
  why: The expectation asks the student to compare how two philosophical traditions approach one big question. The museum's records name rival schools of Islamic theology but set out no two traditions' answers to one question side by side, and hold nothing on the traditions the curriculum lists (rationalism, empiricism, Thomism and the rest).
  searches:
  - 'find_entity.py "empiricism" "rationalism" "العقلانية": no real record'
  - 'find_entity.py "Kant" "كانط" "Descartes": one record, person/rene-descartes, a biography with Arabic prose only; no tradition is set against another'
  - 'entity_brief.py group/mutazila and concept/ashariyya, read in full: they name the schools and their rivalry but give no two answers to one question to compare'
- code: B3.2
  text: explain the ways in which philosophical terms and concepts used by different philoso­phers have evolved over time, and describe how these terms and concepts are understood within different philosophical traditions
  why: The expectation asks how philosophical terms evolved over time and how they are understood in different traditions. No record traces a term across time; the records that touch the terms give one author's gloss each.
  searches:
  - 'find_entity.py "scepticism" "الشك" "shakk" "doubt": concept/doubt-shakk is doubt in the law of evidence and worship, not a philosophical term'
  - 'entity_brief.py concept/hikma --full and concept/falsafa --full: hikma is one lecturer''s gloss of a verse; falsafa gives two examples from al-Zirikli; neither follows a term over time'
  - 'find_entity.py "wisdom" "الحكمة" "hikma": 22 records, none a history of the term'
- code: C1.1
  text: describe the parts of an argument […], and explain how a philosophical argument differs from other communications
  why: The expectation asks the student to describe the parts of an argument (premise, evidence, conclusion). The museum holds no record that teaches the parts of an argument; it shows arguments in use (see lesson c-1) but does not describe their structure.
  searches:
  - 'find_entity.py "premise" "argument" "مقدمات" "برهان": 70 word matches, all names (al-Burhan fi Usul al-Fiqh, persons named Burhan al-Din) or hadith texts; none on the parts of an argument'
  - 'find_entity.py "logic" "منطق" "mantiq": works with no prose (work/al-mantiq-work, work/naqd-al-mantiq) and no record that describes an argument'
- code: C1.2
  text: describe forms of reasoning […], and explain how they are applied in philosophical arguments
  why: The expectation asks for the forms of reasoning, deduction and induction, and how philosophical arguments apply them. No record describes them.
  searches:
  - 'find_entity.py "deduction" "induction" "استقراء": one record, work/logical-foundations-of-induction, with no prose'
  - 'find_entity.py "syllogism" "قياس" "qiyas mantiqi": concept/qiyas is analogy in legal reasoning, not a form of philosophical argument'
- code: C1.3
  text: correctly use terminology related to logic and philosophical argumentation […]
  why: The expectation asks for correct use of the terms of logic and philosophical argument (validity, inference, syllogism). No record defines them.
  searches:
  - 'find_entity.py "logic" "منطق" "mantiq": works with no prose and a book title; no record defines a logical term'
  - 'find_entity.py "syllogism" "قياس" "qiyas mantiqi": concept/qiyas is legal analogy; no term of formal logic'
- code: C1.4
  text: identify some common fallacies in reasoning […], and identify examples of some of these fallacies in arguments encountered in everyday life […]
  why: The expectation asks the student to identify common fallacies. The museum holds no record on fallacies.
  searches:
  - 'find_entity.py "fallacy" "مغالطة" "mughalata": no real record'
  - 'grep -ril "fallac" content/en/concept content/ar/concept: two files; concept/ilm-al-tarikh reports Ibn Khaldun on historians who erred by relying on transmission alone, and concept/iznik-pottery uses the word of a mistaken name; neither names a fallacy of relevance, ambiguity or presumption'
