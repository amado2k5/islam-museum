  - 'find_entity.py "force" "gravity" "load" "stress" "الجاذبية" "القوة": 23 hits, none in the physical sense (political strength, command, conquest by force)'
- code: E1.1
  text: analyse long-term impacts of human uses of energy and natural resources, on society and the environment, including climate change, and suggest ways to mitigate these impacts
