  - 'find_entity.py "conservation" "resources" "الترشيد" "hima": concept/hima and concept/hima-protected-pasture (drafts) describe land reserved for particular herds and the rules for it; entity_brief.py --full shows neither states that the reserve conserves a resource, so neither is a conservation practice the record can carry; concept/al-mawarid-al-tabiiyya (Arabic prose only, draft) is an economic view of raw materials and colonial extraction, not conservation'
