  - 'find_entity.py "energy" "الطاقة" "kinetic energy" "light energy" "sound": 21 hits, mostly "sound" in the sense of valid (a sound report, sound judgment) and the museum''s own Grade 6 course records; nothing on forms of energy'
- code: E1.3
  text: analyse how First Nations, Métis, and Inuit communities use their knowledges and ways of knowing to conserve energy and resources
