- code: B2.4
  text: identify various diseases and medical disorders in humans and the organs and/or body system or systems that they affect
  why: Asks for diseases and the organs or systems they affect; the record names signs of two diseases and no organ or system.
  searches:
  - 'entity_brief.py invention/al-razi-smallpox-measles --full: it lists signs of smallpox and measles (fever, red eyes, nausea, back pain) and names no organ or body system, so it does not carry B2.4'
  - 'fleet review (docs/courses-mission/verifier/sweep-science.md): the lesson was read again and the record names signs of the two diseases, not the organs or systems they affect'
- code: C1.2
  text: assess how the use of specific materials in the manufacture of common products affects the environment, and identify actions that society and individuals can take to mitigate negative impacts
  why: Asks for the environmental effect of materials and actions to reduce it; the records describe a change of flux and give no environmental effect or action.
  searches:
  - 'entity_brief.py concept/natron-glass --full and concept/plant-ash-glass --full: they give two fluxes and a restriction on natron extraction, and state no environmental effect and no action to reduce one, so neither carries C1.2'
  - 'fleet review (docs/courses-mission/verifier/sweep-science.md): both records were read again; the natron restriction is linked to the end of natron glass and neither record gives an environmental effect or a mitigation'
- code: E2.3
  text: describe how energy is stored as potential energy and transformed in a given device or system
  why: Asks how energy is stored and transformed; the record describes motion transmission and never mentions energy.
  searches:
  - 'entity_brief.py invention/jazari-double-piston-pump --full: it describes a waterwheel, gears, a slotted rod and piston rods and has no word for energy, stored energy or potential energy, so it does not carry E2.3'
  - 'fleet review (docs/courses-mission/verifier/sweep-science.md): the lesson was read again; the record describes motion transmission, and the Brief itself left the forms of energy to the class'
