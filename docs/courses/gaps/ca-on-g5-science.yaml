- code: A2.2
  text: identify and describe impacts of coding and of emerging technologies on everyday life, including skilled trades
  why: Asks about the impacts of coding and emerging technologies on everyday life and skilled trades; the museum holds no record on coding or on such impacts.
  searches:
  - 'find_entity.py "coding" "programming" "البرمجة" "algorithm": two real records, invention/algorism (reckoning with Indian decimal numerals in al-Khwarizmi''s arithmetic) and source/weisstein-euclidean-algorithm (a source with no prose); nothing on writing or running code'
  - 'find_entity.py "computer" "automaton" "emerging technology" "الحاسوب": one record, invention/jazari-musical-boat, a medieval automaton design; nothing on coding or its effects on everyday life'
- code: A3.2
  text: investigate how science and technology can be used with other subject areas to address real-world problems
  why: Asks the student to investigate how science and technology combine with other subject areas to solve real-world problems; no record joins two school subjects to a real problem.
  searches:
  - 'find_entity.py "science and art" "scientist" "علم" "technology": 171 hits, the first ones fiqh, hadith-method and usul records with علم meaning religious knowledge and algebra; none joins science to another school subject to solve a real-world problem'
  - 'find_entity.py "computer" "automaton" "emerging technology" "الحاسوب": one record, invention/jazari-musical-boat, a medieval automaton design; nothing that joins science or technology to another school subject'
- code: B1.1
  text: assess effects of a variety of social and environmental factors on human health, and describe ways in which individuals can reduce the harmful effects of these factors and take advantage of those that are beneficial
  why: Asks for the effects of social and environmental factors on human health; the museum holds no record on such factors.
  searches:
  - 'find_entity.py "public health" "sanitation" "الصحة العامة" "water supply": no real record'
  - 'find_entity.py "nutrition" "diet" "healthy eating" "التغذية" "الحمية": one record, concept/hamiyya-diet (draft); entity_brief.py --full shows a fiqh account of keeping the sick from harmful food as a lawful treatment, cited to the Kuwaiti fiqh encyclopedia, not food literacy for decisions about health'
- code: B1.2
  text: evaluate beneficial and harmful effects of various technologies on human health and body systems, while taking different perspectives into consideration
  why: Asks for beneficial and harmful effects of technologies on health and body systems; no record assesses a technology's effects on health.
  searches:
  - 'find_entity.py "medical technology" "surgery" "الجراحة" "surgical instruments": six hits, two of them records: invention/ibn-zuhr-goat-tracheotomy-demonstration (read with entity_brief.py --full) is a reported animal recovery that its own record says is not a human trial proving safety, and a fatwa on surgery while fasting; none assesses a technology''s effects on health'
  - 'find_entity.py "public health" "sanitation" "الصحة العامة" "water supply": no real record'
- code: B1.3
  text: explain how food literacy can support decisions that affect physical and mental health
  why: Asks how food literacy supports decisions about physical and mental health; the one record on diet is a fiqh ruling on treatment, not food literacy.
  searches:
  - 'find_entity.py "nutrition" "diet" "healthy eating" "التغذية" "الحمية": one record, concept/hamiyya-diet (draft); entity_brief.py --full shows a fiqh account of keeping the sick from harmful food as a lawful treatment, cited to the Kuwaiti fiqh encyclopedia, not food literacy for decisions about health'
  - 'find_entity.py "public health" "sanitation" "الصحة العامة" "water supply": no real record'
- code: B2.1
  text: identify systems of the human body, and describe their basic function
  why: Asks the student to identify the body's systems and their functions; the museum has no record that names the systems of the body. Lesson b-1 serves two organs, not the systems.
  searches:
  - 'find_entity.py "digestive system" "nervous system" "anatomy" "التشريح" "الجهاز العصبي": concept/anatomy and work/sharh-tashrih-al-qanun exist (both drafts); entity_brief.py --full shows the commentary''s sources and that its opening sections treat the bones of the skull, jaws, teeth and spine; neither names the body''s systems or their functions'
  - 'find_entity.py "heart" "القلب" "digestion" "الهضم": the heart hits are records on the spiritual heart (qalb), poems and hadith; invention/pulmonary-circulation is used in lesson b-1 for two organs only'
- code: C2.1
  text: describe matter as everything that has mass and occupies volume
  why: Asks for matter as what has mass and takes up volume; the museum holds no record on the nature of matter.
  searches:
  - 'find_entity.py "states of matter" "solid liquid gas" "matter" "المادة" "الحالة الصلبة": 16 hits, none on matter in the physical sense (fiqh and question records using the word "matter", and the Grade 6 course record for Flight)'
  - 'find_entity.py "melting" "boiling" "heat" "الحرارة" "الغليان": two hits, a record on marching in the heat and a mosque; nothing on melting, boiling or thermal energy'
- code: C2.2
  text: identify the states of matter, and describe characteristics and properties of solids, liquids, and gases
  why: Asks for the states of matter and the properties of solids, liquids and gases; the museum holds no record that states them.
  searches:
  - 'find_entity.py "states of matter" "solid liquid gas" "matter" "المادة" "الحالة الصلبة": 16 hits, none on matter in the physical sense (fiqh and question records using the word "matter", and the Grade 6 course record for Flight)'
  - 'entity_brief.py practice/islamic-glassmaking --full and concept/plant-ash-glass --full: where, when and with which flux glass was made; they state no physical property of the material (hardness, transparency, melting)'
- code: C2.3
  text: describe changes of state of matter observed at home, in the community, or in the natural environment
  why: Asks for changes of state seen at home or in nature; the one record on distilling does not state a change of state.
  searches:
  - 'find_entity.py "melting" "boiling" "heat" "الحرارة" "الغليان": two hits, a record on marching in the heat and a mosque; nothing on melting, boiling or thermal energy'
  - 'entity_brief.py concept/anbik --full: the parts of a distilling apparatus (cucurbit, cap, receiver) and its use for rose-water; it does not mention evaporation, condensation or heat, so it cannot carry a change of state'
- code: C2.4
  text: describe physical changes in matter as changes of the state, volume, or form of the matter that do not result in the formation of a different substance
  why: Asks for physical changes in matter; no record describes one.
  searches:
