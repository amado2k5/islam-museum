  why: The expectation is about anthropological research methods and critiques of them; the museum holds no record on these methods.
  searches:
  - 'find_entity.py "survey" "fieldwork" "observation" "travel account" "الرحلة": hadith journeys (rihla) and land surveys of the Sawad; none on research methods'
  - 'find_entity.py "archaeology" "آثار" "excavation" "anthropology" "أنثروبولوجيا": records on antiquities law and on books titled al-Athar; none on anthropology or on excavation as a research method'
- code: B2.1
  text: explain, from an anthropological perspective, how various factors […] influence and shape human behaviour and culture […]
  why: The one record the museum holds on a physical environment shaping people is linked to D2.1 in lesson d-2, whose wording is the same with a sociological perspective; linking it again here would count one record twice. Nothing on pandemics or globalization.
  searches:
  - 'find_entity.py "climate and human" "environment influence" "الإقليم" "geography and character": concept/athar-al-iqlim, which lesson d-2 links to D2.1; no second record on this factor'
  - 'find_entity.py "plague" "الطاعون" "pandemic" "globalization" "العولمة": plague events (Amwas, 448, the Black Death in Ibn Khaldun’s life); none on how a pandemic or globalization shaped culture'
- code: B3.2
  text: explain ways in which culture is an agent of socialization […]
  why: The expectation is about culture as an agent of socialization; the museum holds no record on socialization, and its records on rites are rulings, not accounts of how a culture teaches kinship duties.
  searches:
  - 'find_entity.py "socialization" "التنشئة الاجتماعية" "social upbringing": no real record'
  - 'find_entity.py "child development" "تربية الأطفال" "upbringing" "تنشئة": concept/tarbiya, a lecturer’s advice on raising children (his view), not an account of culture as an agent of socialization'
