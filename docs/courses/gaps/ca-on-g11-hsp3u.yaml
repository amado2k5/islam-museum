  - 'find_entity.py "child development" "تربية الأطفال" "upbringing" "تنشئة": concept/tarbiya, a lecturer’s advice on raising children (his view), not an account of culture as an agent of socialization'
- code: C1.2
  text: "summarize the key ideas of major psychological theories […], and explain how they can be used to understand human behaviour"
  why: "The only candidate records are one non-psychologist's management talks, which give a chronology of Maslow and Theory Y that cannot be right and so would mislead a student asked to summarize major psychological theories."
  searches:
  - "concept/nazariyyat-al-dafiyya (tried at c-1): a lecturer's account of Maslow's hierarchy and \"Theory Z\" with a chronology that cannot be right (Theory Y built on Maslow, not the reverse)"
  - "find_entity.py \"psychology\" \"علم النفس\" \"personality\" \"behaviour\": no record by a psychologist or on a major psychological theory"
- code: C2.3
  text: "explain how diverse psychological factors […] influence individual behaviour"
  why: "The only candidate record is a lecturer's definition of motivation by reward, a popular management claim and not a psychological account of factors influencing behaviour."
  searches:
  - "concept/al-tahfiz (tried at c-1): a lecturer's definition of motivation as receiving a reward; not a psychological account of influences on behaviour"
  - "find_entity.py \"motivation\" \"learning\" \"علم النفس\" \"التحفيز\": no other record states a psychological factor"
- code: C3.2
  text: "assess how diverse personality traits […] shape human behaviour and interaction in a variety of environments"
  why: "The only candidate record is a lecturer's DISC leadership-personality talk, with uncited figures; DISC is a popular management tool, not an established trait theory."
  searches:
  - "concept/tahlil-disc (tried at c-1): DISC leadership talk with figures marked needs_source (uncited percentages and error margin); a management tool, not a trait theory"
  - "find_entity.py \"personality\" \"traits\" \"الشخصية\": no record on personality traits from a psychological source"
