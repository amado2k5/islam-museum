- code: D2.2
  text: explain, from a sociological perspective, the relationship between prejudice and individual and systemic discrimination […], and describe their impacts on individuals and society
  why: The expectation is about prejudice and discrimination and their impacts; the museum holds no record on these as a topic.
  searches:
  - 'find_entity.py "prejudice" "التعصب" "discrimination" "racism" "العنصرية": no real record'
  - 'find_entity.py "racism" "skin colour" "لون البشرة" "الأسود" "equality": persons and events whose names contain these words; none on prejudice or discrimination as a topic; concept/athar-al-iqlim (colour and climate) is linked in lesson d-2 and does not treat discrimination'
- code: D2.3
  text: explain, from a sociological perspective, how diverse influences […] shape social behaviour […]
  why: The expectation is about how culture, religion, economics, media and technology shape social behaviour; the only candidates are about media content and are not accounts of influence on behaviour.
  searches:
  - 'find_entity.py "media" "الإعلام" "social networking" "التواصل الاجتماعي": concept/al-ilam-wal-mas-uliyya (a lecturer on programme makers) and concept/surat-al-mutadayyin-fi-al-ilam (a studio discussion of the screen image of the religious person); about media content, not about how media or technology shape behaviour'
  - 'find_entity.py "courtship" "الخطبة" "dating" "bullying" "التنمر": sermons (khutba) only; none on courtship or bullying as social behaviour'
- code: D3.1
  text: explain how structural changes take place in social institutions […] in response to diverse influences […]
