- code: B1.1
  text: explain the significance of contributions of influential anthropologists […]
  why: The expectation is about the contributions of influential anthropologists; the museum holds no record on one.
  searches:
  - 'find_entity.py "Darwin" "داروين" "Freud" "فرويد" "Margaret Mead": no real record'
  - 'find_entity.py "archaeology" "آثار" "excavation" "anthropology" "أنثروبولوجيا": records on antiquities law and on books titled al-Athar; none on anthropology or on excavation as a research method'
- code: B1.2
  text: outline the key ideas of the major anthropo­logical schools of thought […] and explain how they can be used to analyse features of cultural systems
  why: The expectation is about the schools of thought of anthropology; the museum holds no record on any of them.
  searches:
  - 'find_entity.py "functionalism" "الوظيفية" "sociology" "علم الاجتماع" "school of thought": no real record'
  - 'find_entity.py "archaeology" "آثار" "excavation" "anthropology" "أنثروبولوجيا": records on antiquities law and on books titled al-Athar; none on anthropology or on excavation as a research method'
- code: B1.3
  text: explain significant issues in different areas of anthropology […]
  why: The expectation is about issues in the areas of anthropology; the museum holds no record on these areas. Ibn Khaldun on learning Arabic is one thinker’s theory, not an account of an area of the field.
  searches:
  - 'find_entity.py "linguistics" "اللغة" "philology" "علم اللغة": concept/lughah-fiqh (language in fiqh rulings) and concept/malakat-al-lugha (Ibn Khaldun on learning Arabic by memorisation); none on linguistic anthropology as a field'
  - 'find_entity.py "archaeology" "آثار" "excavation" "anthropology" "أنثروبولوجيا": records on antiquities law and on books titled al-Athar; none on anthropology or on excavation as a research method'
- code: B1.4
