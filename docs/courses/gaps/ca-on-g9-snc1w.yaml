- code: B1.1
  text: assess impacts of climate change on the sustainability of local and global ecosystems, describe local or global initiatives for combatting climate change, and identify solutions to address some of the impacts
  why: Asks about impacts of climate change on ecosystems and solutions; the museum holds no record on climate change.
  searches:
  - 'find_entity.py "climate change" "تغير المناخ" "global warming": no real record'
  - 'find_entity.py "climate": concept/al-aqalim-al-saba (the seven geographical climates) and concept/athar-al-iqlim (Ibn Khaldun on the effect of climate on people); neither is about climate change'
- code: B1.2
