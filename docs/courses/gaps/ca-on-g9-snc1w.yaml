  - 'find_entity.py "agriculture" "الزراعة" "irrigation" "fertiliser" "السماد": concept/agriculture-in-islam (livelihood and land-title rules), concept/simad (rulings on the purity of manure) and invention/ibn-bassal-soil-water-matching (soil and water types for crops, used in lesson b-1); none explains the cycling of matter or the flow of energy in farming'
  - 'find_entity.py "food chain" "السلسلة الغذائية" "nutrient" "decomposition" "energy flow": no real record'
