  why: Asks about impacts of climate change on communities in Canada; the museum holds no record on climate change or on communities in Canada.
  searches:
  - 'find_entity.py "climate change" "تغير المناخ" "global warming": no real record'
  - 'find_entity.py "Canada" "كندا" "Ontario": place/canada and place/ontario exist but are one-line gazetteer records with no prose'
- code: B1.3
  text: investigate and explain how sustainable practices used by various communities, including First Nations, Métis, and Inuit communities, reflect an understanding of the importance of the dynamic equilibrium of ecosystems
  why: Asks about sustainable practices of communities, including First Nations, Métis and Inuit communities, and what they show of ecosystem equilibrium; the museum holds no record on those communities, and the hima records give legal rules, not ecological reasons.
  searches:
  - 'find_entity.py "First Nations" "Indigenous" "Inuit" "Metis": no relevant record (the one hit, concept/muwala, is about continuity within acts of worship)'
  - 'find_entity.py "sustainable" "الاستدامة" "conservation" "hima": concept/hima and concept/hima-protected-pasture state the rules for reserved pasture (who may graze, who may reserve it) and give no reason from ecology or conservation'
- code: B2.1
  text: investigate interactions between the biosphere, hydrosphere, lithosphere, and atmosphere, and explain why these interactions are important for ecosystem sustainability
  why: Asks about interactions of the biosphere, hydrosphere, lithosphere and atmosphere; the museum holds no record on them.
  searches:
  - 'find_entity.py "biosphere" "hydrosphere" "atmosphere" "lithosphere" "الغلاف الجوي": no real record'
  - 'find_entity.py "rain" "المطر" "water cycle": concept/rain has no prose; work/kitab-al-matar-ibn-abi-al-dunya gathers reports on rain, thunder, lightning and wind and says nothing of how Earth''s systems interact'
- code: B2.2
  text: explain how naturally occurring phenomena, including the cycling of matter and the flow of energy, contribute to the dynamic equilibrium within and between ecosystems
  why: Asks about the cycling of matter and the flow of energy in ecosystems; the museum holds no record on either.
  searches:
  - 'find_entity.py "food chain" "السلسلة الغذائية" "nutrient" "decomposition" "energy flow": no real record'
  - 'find_entity.py "ecosystem" "النظام البيئي" "biosphere": no real record'
- code: B2.3
  text: compare and contrast the processes of cellular respiration and photosynthesis, and explain how their complementary relationship contributes to the dynamic equilibrium of ecosystems
  why: Asks the student to compare cellular respiration and photosynthesis; the museum holds no record on either.
  searches:
  - 'find_entity.py "photosynthesis" "التمثيل الضوئي" "respiration": no real record'
  - 'find_entity.py "plants" "النبات" "oxygen" "botany": concept/trees-plants gathers Qur''anic verses and a hadith about trees; nothing on how plants or cells use energy'
- code: B2.5
  text: explain the effects of various human activities on the dynamic equilibrium of ecosystems
  why: Asks for the effects of human activities on the equilibrium of ecosystems; the only related records are one author's reading on pollution and a preacher's anecdote whose details the record marks as unsourced, so neither can carry a lesson.
  searches:
  - 'find_entity.py "universe" "الكون" "cosmos" "creation": concept/al-tawazun-al-kawni holds a preacher''s account that human interference spoils creation''s balance, with a sparrow-and-locust story whose date and details the record itself marks as needing a source; it cannot carry a lesson'
  - 'find_entity.py "environment": concept/environmental-protection-in-islam gives one author''s reading that pollution of water, air and land threatens people and societies; it says nothing of ecosystems, their cycles or their balance'
- code: B2.6
  text: identify and use various indicators of climate change to describe the impacts of climate change on local and global ecosystems, and analyse how human activities contribute to climate change
  why: Asks for indicators of climate change and the human activities behind it; the museum holds no record on climate change or its indicators.
  searches:
  - 'find_entity.py "drought" "الجفاف" "glacier" "sea level" "temperature": no real record'
  - 'find_entity.py "climate change" "تغير المناخ" "global warming": no real record'
- code: B2.7
