- code: C2.1
  text: add monomials with a degree of 1 that involve whole numbers, using tools
  why: 'Adding monomials of degree 1 with tools: concept/algebra and concept/al-durub-al-sitta are taught under C2.2 and C2.3 for equations; no record is about adding like terms with tools.'
  searches:
  - 'find_entity.py "inequality" "المتباينة" "unknown" "المجهول": hits are place/unknown, a screen record and a fatwa resolution; concept/algebra and concept/al-durub-al-sitta cover equations only and are taught in lesson c-2 under C2.2 and C2.3'
  - 'find_entity.py "monomial" "expression" "الحدود" "term": hits are the hudud (prescribed punishments) and Muwatta reports on boundaries; grep -rli "monomial" content/en returns nothing; no record is about adding like terms with tools'
- code: C2.4
  text: solve inequalities that involve two operations and whole numbers up to 100 and verify and graph the solutions
  why: 'Solving and graphing inequalities with two operations: the museum''s algebra records treat equations only.'
  searches:
  - 'find_entity.py "inequality" "المتباينة" "unknown" "المجهول": hits are place/unknown, a screen record and a fatwa resolution; concept/algebra and concept/al-durub-al-sitta cover equations only and are taught in lesson c-2 under C2.2 and C2.3'
  - 'find_entity.py "algebra" "الجبر" "al-jabr": equations only (concept/al-durub-al-sitta states equations with positive terms)'
- code: C3.1
  text: solve problems and create computational representations of mathematical situations by writing and executing efficient code, including code that involves conditional statements and other control structures
  why: 'Writing and running efficient code with conditionals and control structures: the museum holds the origin of the word algorithm, not coding.'
  searches:
  - 'find_entity.py "mathematical modelling" "calculation" "الحساب" "hisab": concept/al-hisab (the Reckoning, on the Day), work/al-jabr-wal-muqabala and invention/algebra; nothing on writing or reading code'
  - 'invention/algorism (in lesson b-3 under B1.1, B2.4, B2.7, B2.8): it records the origin of the word "algorithm" and ordered written steps for arithmetic, but nothing on conditional statements, control structures or running code'
- code: C3.2
  text: read and alter existing code, including code that involves conditional statements and other control structures, and describe how changes to the code affect the outcomes and the efficiency of the code
  why: 'Reading and altering code and describing the effect of changes: the museum holds the origin of the word algorithm, not coding.'
  searches:
  - 'find_entity.py "mathematical modelling" "calculation" "الحساب" "hisab": concept/al-hisab (the Reckoning, on the Day), work/al-jabr-wal-muqabala and invention/algebra; nothing on writing or reading code'
  - 'invention/algorism (in lesson b-3 under B1.1, B2.4, B2.7, B2.8): it records the origin of the word "algorithm" and ordered written steps for arithmetic, but nothing on conditional statements, control structures or running code'
