- code: F1.3
  text: identify and describe various factors that may help or interfere with reaching financial goals
  why: 'Factors that help or interfere with reaching financial goals: the records on property, thresholds and debt are rulings and say nothing about such factors.'
  searches:
  - 'find_entity.py "poverty" "wealth" "الفقر" "financial hardship" "debt": concept/mal-fiqh, concept/nisab and concept/dayn-fiqh are rulings on property, thresholds and debt; none describes factors that help or hinder a person reaching a financial goal'
  - 'find_entity.py "financial goals" "saving" "الادخار" "thrift": concept/idkhar-fiqh (taught in lesson f-2 under F1.2), concept/al-iddikhar-al-mashru and concept/saving-and-investment-in-islam (Arabic prose only)'
- code: B2.1
  text: "use the properties of operations, and the relationships between operations, to solve problems involving whole numbers, decimal numbers, fractions, ratios, rates, and whole number percents, including those requiring multiple steps or multiple operations"
  why: "The only record (Abu al-Wafa's debt in a multiplication) multiplies a negative number by ten, which is beyond Grade 6, and its shortcut is a special case with the same tens digit; it shows no property of operations."
  searches:
  - "invention/abu-wafa-debt-multiplication (tried at b-2): a worked special case (three times five) that passes through a debt; kept under B1.2 for the number below zero, not for properties of operations"
  - "find_entity.py \"multiplication\" \"properties of operations\" \"الضرب\": no other record states a property of operations for whole numbers, fractions or decimals"
- code: E1.4
  text: "describe and perform combinations of translations, reflections, and rotations up to 360° on a grid, and predict the results of these transformations"
  why: "The museum's two pattern records (islamic-geometric-patterns, girih) are short and state no translation, reflection or rotation, and no image or description of the tiles' shapes."
  searches:
  - "concept/islamic-geometric-patterns (tried at e-1): one sentence sourced to Wikidata only; a pointer, not content, and no symmetry or transformation stated"
  - "concept/girih (tried at e-1): says the strapwork is common in Seljuk and Safavid architecture and rests on girih tiles; no image, no tile shapes, no symmetry or transformation"
- code: C1.1
  text: "identify and describe repeating, growing, and shrinking patterns, including patterns found in real-life contexts, and specify which growing patterns are linear"
  why: "Identifying and describing repeating, growing and shrinking patterns, and which growing patterns are linear: the museum's one pattern-rule record (al-Karaji's table of adjacent sums) shows a rule for building rows, not growing, shrinking or linear patterns."
  searches:
  - "invention/karaji-binomial-coefficient-recurrence (tried at c-1): a rule for building each row of a table by adding neighbours; served under C1.3 only, it states no growing, shrinking or linear pattern, graph or algebraic expression"
  - "find_entity.py \"linear patterns\" \"sequence\" \"المتتالية\" \"arithmetic progression\": no real record on sequences, tables of values or graphs of patterns"
- code: C1.2
  text: "create and translate repeating, growing, and shrinking patterns using various representations, including tables of values, graphs, and, for linear growing patterns, algebraic expressions and equations"
  why: "Creating and translating patterns among tables, graphs and algebraic expressions: the museum's one pattern-rule record builds a table by a rule and gives no graph, expression or equation of a linear pattern."
  searches:
  - "invention/karaji-binomial-coefficient-recurrence (tried at c-1): a rule for building each row of a table by adding neighbours; served under C1.3 only, it states no growing, shrinking or linear pattern, graph or algebraic expression"
  - "find_entity.py \"linear patterns\" \"sequence\" \"المتتالية\" \"arithmetic progression\": no real record on sequences, tables of values or graphs of patterns"
