- code: C1.4
  text: create and describe patterns to illustrate relationships among whole numbers and decimal numbers
  why: 'Creating patterns to illustrate relationships among whole numbers and decimal numbers: no record links patterns to decimals.'
  searches:
  - 'find_entity.py "linear patterns" "sequence" "المتتالية" "arithmetic progression": no real record; invention/karaji-binomial-coefficient-recurrence is taught in lesson c-1 under C1.1 to C1.3 and does not relate whole numbers to decimals'
