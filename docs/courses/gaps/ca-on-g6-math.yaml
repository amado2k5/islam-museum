course: course/ca-on-g6-math
gaps:
- code: B1.3
  text: compare and order integers, decimal numbers, and fractions, separately and in combination, in various contexts
  why: 'Comparing and ordering integers, decimals and fractions in combination: the museum''s decimal and debt records are taught for reading and representing (B1.4, B1.2); none of them compares numbers of the three kinds with one another.'
  searches:
  - 'find_entity.py "fractions" "الكسور" "kasr": concept/kasr is a lexical and fiqh term (breaking, a part of one); the only arithmetic record is invention/decimal-fractions-al-uqlidisi, taught in lesson b-1 under B1.4 and B1.6'
  - 'find_entity.py "negative numbers" "debt" "positive and negative": invention/abu-wafa-debt-multiplication (taught in lesson b-2 under B1.2) and fiqh debt records; no record about ordering numbers'
- code: B1.5
  text: round decimal numbers, both terminating and repeating, to the nearest tenth, hundredth, or whole number, as applicable, in various contexts
  why: 'Rounding terminating and repeating decimals: no record in the museum is about rounding.'
  searches:
  - 'find_entity.py "rounding" "estimation" "التقريب" "approximation": hits are hadith-science works (Taqrib al-Tahdhib and kin) and invention/abu-hanifa-brick-stack-reckoning (an estimate of brick volume), none about rounding decimals'
  - 'find_entity.py "fractions" "الكسور" "kasr": concept/kasr is a lexical and fiqh term (breaking, a part of one); the only arithmetic record is invention/decimal-fractions-al-uqlidisi, taught in lesson b-1 under B1.4 and B1.6'
- code: B2.3
  text: use mental math strategies to calculate percents of whole numbers, including 1%, 5%, 10%, 15%, 25%, and 50%, and explain the strategies used
  why: 'Mental-math strategies for percents of whole numbers: no record is about percents or mental calculation.'
  searches:
  - 'find_entity.py "percent" "النسبة المئوية" "ratio" "rate" "proportion": invention/mahani-successive-quotient-ratios and work/mahani-risala-fi-nisba (the Euclidean theory of ratio by successive quotients); nothing on percents, rates or everyday ratio problems'
  - 'grep -ril "percent" content/en/concept content/en/invention content/en/work content/en/person: hits are concept records on other subjects (concept/al-qiraa-wal-thaqafa, idarat-al-hayat, al-fatwa-hurriyya-am-ihtikar) where a percent figure occurs in passing, none a record on calculating percents'
- code: B2.5
  text: add and subtract fractions with like and unlike denominators, using appropriate tools, in various contexts
  why: 'Adding and subtracting fractions with like and unlike denominators: the museum''s only fraction record is about decimal fractions, taught under B1.4 and B1.6; it does not add or subtract fractions with different denominators.'
  searches:
  - 'find_entity.py "fractions" "الكسور" "kasr": concept/kasr is a lexical and fiqh term (breaking, a part of one); the only arithmetic record is invention/decimal-fractions-al-uqlidisi, taught in lesson b-1 under B1.4 and B1.6'
  - 'find_entity.py "divisibility" "prime" "factor" "القسمة" "الأعداد الأولية": no record on divisibility rules or prime numbers; the hits are about the division of spoils and realms (قسمة); the one record on divisors is invention/farisi-amicable-factorization, taught in lesson b-4'
- code: B2.9
  text: multiply whole numbers by proper fractions, using appropriate tools and strategies
  why: 'Multiplying whole numbers by proper fractions: no record is about operations on common fractions.'
  searches:
  - 'find_entity.py "fractions" "الكسور" "kasr": concept/kasr is a lexical and fiqh term (breaking, a part of one); the only arithmetic record is invention/decimal-fractions-al-uqlidisi, taught in lesson b-1 under B1.4 and B1.6'
  - 'find_entity.py "multiplication" "الضرب" "product of": hits are the mint (دار الضرب), a Muwatta report on a tax and reports on striking a person; no record on multiplying by a fraction'
- code: B2.10
