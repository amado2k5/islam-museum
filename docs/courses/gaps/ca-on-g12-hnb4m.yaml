- code: B2.1
  text: analyse the influence on the fashion industry of brand marketing […]
  why: The expectation is about brand marketing in the fashion industry (logos, endorsements, positional goods); the museum holds no record on fashion branding.
  searches:
  - 'find_entity.py "brand" "علامة تجارية" "advertising" "logo" "شعار": no record on fashion branding or advertising; hits were a fatwa on buying counterfeit branded goods, a US trademark source record, wasm (branding of animals) and the concept of shi''ar'
  - 'grep -ril "brand" over content/en concept, practice, invention and job: 13 files (wajh-fiqh, qaa, anam, washm-fiqh, manara, hayawan-animal and others), none a fashion topic by title'
- code: B2.2
  text: explain the contributions to the fashion industry of various Canadian and international designers […]
  why: The expectation asks for the contributions of Canadian and international fashion designers; the museum holds no record on any fashion designer or house.
  searches:
  - 'find_entity.py "fashion designer" "مصمم أزياء" "couture" "tailoring house": no real record'
  - 'find_entity.py "Chanel" "Yves Saint Laurent" "Hanae Mori" "Ritu Kumar" "Vera Wang" "شانيل": no real record'
- code: B2.3
  text: explain the influence of haute couture on the fashion industry […]
  why: The expectation is about haute couture and its influence on current styles; the museum holds no record on couture.
  searches:
  - 'find_entity.py "fashion designer" "مصمم أزياء" "couture" "tailoring house": no real record'
  - 'grep -ril "haute couture" over content/en concept, practice, invention and job: 0 files'
- code: B2.4
  text: explain the influence on the fashion industry of the traditional fashion centres […]
  why: The expectation is about the traditional fashion centres (Paris, Milan, London, Tokyo, New York City); the museum holds place records for some of these cities but none carries prose or says anything on fashion.
  searches:
  - 'find_entity.py "Paris" "باريس" "Milan" "London" "Dubai" "دبي": place/paris, place/london and place/dubai exist but have no prose; nothing on fashion; no record for Milan'
  - 'find_entity.py "Milan" "ميلانو" "New York" "نيويورك" "Tokyo" "طوكيو" "Los Angeles" "Toronto" "تورنتو" "Beijing" "بكين": place/new-york-city, place/los-angeles, place/toronto and place/beijing exist but have no prose; no place record for Milan or Tokyo'
