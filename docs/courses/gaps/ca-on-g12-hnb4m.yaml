- code: C2.1
  text: identify countries associated with the production of specific textiles […], and explain why those countries are major textile producers
  why: The expectation asks which countries produce which textiles and why; the museum holds no record that says what a country produces in textiles (the records of Egypt, India, China and Scotland carry no textile content, and the tiraz workshops are places of weaving, not country-level production).
  searches:
  - 'find_entity.py "China" "الصين" "Egypt" "مصر" "India" "الهند" "Scotland": place/misr has prose but none on cotton or textiles (grep of content/en/place/misr.md for cotton, textile, cloth, tiraz, linen, silk found nothing); place/india, place/china and place/scotland have no prose'
  - 'find_entity.py "cotton" "قطن" "Egypt cotton" "Gujarat" "textile trade" "تجارة النسيج": no record on cotton production; hits were people named Qatn and place/gujarat, which has no prose'
- code: C2.3
  text: analyse the social and environmental impact of textile production and disposal […]
  why: The expectation is about the social and environmental impact of textile production and disposal (child labour, pesticides, dyes, landfill); the museum holds no record on any of it.
  searches:
  - 'find_entity.py "pesticide" "irrigation" "ري" "pollution" "تلوث" "waste" "landfill": no record on the impact of textile production; hits were the city of Rayy, the Muwatta book on irrigation partnership and wars'
  - 'grep -ril "pesticide" over content/en concept, practice, invention and job: 0 files'
- code: C3.1
  text: demonstrate an understanding of concepts related to the globalization of the fashion industry […]
  why: The expectation is about concepts of the globalization of the fashion industry (imports, offshore production, trade agreements, maquiladoras); the museum holds no record on them. The one historical case it holds, the Ottoman weavers, serves C3.3 only.
  searches:
  - 'find_entity.py "globalization" "عولمة" "free trade agreement" "export" "تصدير": no real record (one source record on a history of al-Andalus)'
  - 'find_entity.py "child labour" "عمالة الأطفال" "factory" "مصنع" "union" "نقابة": no record on garment labour or unions; hits were the Soviet Union, a charcoal factory fatwa and a bank'
- code: C3.2
  text: demonstrate an understanding of legislation and agreements relating to the fashion industry […]
  why: The expectation is about Canadian and North American legislation and agreements (the Textile Labelling Act, NAFTA); the museum holds no record on them.
  searches:
  - 'find_entity.py "NAFTA" "Textile Labelling Act" "trade agreement" "معاهدة تجارية" "import duty" "tariff" "الجمارك": only place/nafta, the town Nafta (نفطة), not the agreement'
  - 'find_entity.py "globalization" "عولمة" "free trade agreement" "export" "تصدير": no real record (one source record on a history of al-Andalus)'
- code: C3.4
  text: describe strategies that consumers can adopt to make socially responsible fashion choices […]
  why: The expectation asks for strategies consumers can adopt to make socially responsible fashion choices; the museum holds no record that describes any.
  searches:
  - 'find_entity.py "boycott" "مقاطعة" "ethical" "recycle" "إعادة تدوير" "sustainable" "استدامة": only the early boycotts of the Banu Hashim and of the three, which are not consumer strategies'
  - 'find_entity.py "consumer" "مستهلك" "second-hand" "charity clothing" "sadaqa clothing" "ثياب" "israf waste" "إسراف": work/fatwa-aliftaa-jo-buying-bales-of-used-clothes-and-toys-by-weight rules on whether sealed bales may be bought by weight, not on responsible buying; concept/al-israf has Arabic prose only'
- code: C3.5
  text: explain strategies used by the fashion industry to reduce its environmental impact […]
  why: The expectation asks for strategies the fashion industry uses to reduce its environmental impact (natural dyes, less water and pesticide); the museum holds no record on them.
  searches:
  - 'find_entity.py "natural dye" "صبغ" "henna" "حناء" "saffron" "زعفران" "indigo" "نيلج": only Muwatta passages on saffron- or safflower-dyed garments for the pilgrim and on hair dye; nothing on dyes as an industry or on reducing its impact'
  - 'find_entity.py "pesticide" "irrigation" "ري" "pollution" "تلوث" "waste" "landfill": no record on the impact of textile production; hits were the city of Rayy, the Muwatta book on irrigation partnership and wars'
- code: D1.1
