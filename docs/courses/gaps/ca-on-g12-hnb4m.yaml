- code: D2.1
  text: identify, and describe the function and use of, various tools and technologies used in the creation of fashion products […]
  why: The expectation is about the function and use of tools and technologies for making fashion products (measuring tape, scissors, sewing machine, loom, CAD); the museum holds no record on sewing tools. Its loom records serve B1.3 and do not describe the loom's function.
  searches:
  - 'find_entity.py "scissors" "مقص" "thimble" "spindle" "مغزل" "needle" "سيلان": only a described cataract needle and two media/source records; no record on sewing tools'
  - 'find_entity.py "seam" "hem" "stitch" "غرزة" "خياطة" "زر" "button": no record on garment construction; hits were a person named Zirr, a surgical suture diagram and a manuscript-paper practice'
