  - 'find_entity.py "elements and principles of design" "color theory" "نظرية اللون" "balance" "proportion" "تناسب": only the balance (mizan) concepts and al-Khazini''s balance; none on design'
- code: D1.2
  text: analyse apparel items to determine how the designer has used the elements and principles of design to enhance their marketability
  why: The expectation is about analysing how a designer used the elements and principles of design to make an apparel item marketable; the museum holds no record that does this for an apparel item.
  searches:
  - 'find_entity.py "elements and principles of design" "color theory" "نظرية اللون" "balance" "proportion" "تناسب": only the balance (mizan) concepts and al-Khazini''s balance; none on design'
  - 'find_entity.py "pattern" "embroidery" "تطريز" "dress design" "calligraphy on cloth" "fashion": hits were the ghulamiyyat fashion, object/nasi-kamkha (a one-line catalogue entry on a silk loom width) and concept/islamic-geometric-patterns (not about apparel); no record that analyses design elements of apparel'
- code: D1.3
