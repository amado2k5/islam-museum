- code: C3.2
  text: identify, in level-appropriate texts in the target language, examples of sociolinguistic conventions associated with a variety of social situations in diverse communities where the target language is spoken […]
  why: The expectation asks the student to find, in level-appropriate Arabic texts, examples of slang, regional vocabulary and formulas of gratitude, excuse or invitation. The museum holds no record on dialects or colloquial Arabic and no record that sets out such formulas; the texts to read are the class's own.
  searches:
  - 'find_entity.py "dialect" "اللهجات" "lahja" "regional dialects": no real record on dialects (one building record, Madrasa of Bir Lahjar, no prose)'
  - 'find_entity.py "slang" "عامية" "colloquial": concept/popular-learning-in-arab-civilisation is about learning, not colloquial speech'
  - 'find_entity.py "gratitude" "شكر" "invitation" "دعوة" "apology" "اعتذار": concept/gratitude-shukr is a fiqh account of thanking God and people and gives no formula of thanks, invitation or apology that a reader could find in a text'
  - 'find_entity.py "diglossia" "فصحى" "fusha" "eloquent Arabic": no real record'
