- code: D3.2
  text: identify sociolinguistic conventions associated with a variety of social situations in diverse communities where the target language is spoken, and use them appropriately in their written work in the target language […]
  why: The expectation asks the student to use conventions of formality, regional expressions and idioms in written Arabic. The museum holds no record on written formality, letters, idioms or regional expressions; its one record on forms of address (the kunya) is about naming and is used in lesson b-2 for speech.
  searches:
  - 'find_entity.py "formality" "etiquette of address" "كنية" "kunya": concept/kunya-fiqh, taught in lesson b-2 under B3.2; it says nothing about written forms'
  - 'find_entity.py "letter writing" "رسالة" "epistolary" "كتابة الرسائل": the hits are individual letters and works titled risala (judged by title and summary), not accounts of how letters are written'
  - 'find_entity.py "idiom" "proverb" "مثل" "أمثال": hits are hadith passages and a television title; no record on idiomatic expressions'
  - 'find_entity.py "slang" "عامية" "colloquial": no record on colloquial speech'
- code: A3.1
  text: using information from oral texts in the target language, identify communities where the target language is spoken, find out about aspects of their cultures, and make connections to personal experiences and their own and other communities […]
  why: Neither city record says that Arabic is spoken there, and a city's history is not a community where Arabic is spoken.
  searches:
  - 'entity_brief.py place/baghdad --full: tried and removed (founding and naming of the city; no statement that Arabic is spoken there or of any community''s culture in that language)'
  - 'entity_brief.py place/cairo --full: tried and removed (the Golius line on a market for East and West is about trade; nothing about the language)'
- code: A3.2
  text: using information from oral texts in the target language, identify and demonstrate an understanding of sociolinguistic conventions used in a variety of situations in diverse communities where the target language is spoken […]
  why: Loanwords and word histories are not sociolinguistic conventions of use in social situations, and the bimaristan record is far from the topic.
  searches:
  - 'entity_brief.py invention/walid-bimaristan --full: tried and removed (the origin of the word bimaristan; the record also describes confining lepers, far from the conventions of speech)'
  - 'entity_brief.py concept/algebra --full: tried and removed (the history of the word algebra, not conventions of use in social situations)'
