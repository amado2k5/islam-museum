- code: D3.2
  text: identify sociolinguistic conventions associated with a variety of social situations in diverse communities where the target language is spoken, and use them appropriately in their written work in the target language […]
  why: The expectation asks the student to use conventions of register, slang, regional forms and number and currency formats in written Arabic. The museum holds no record on written register, letters, slang or regional forms; its one record on forms of address (the kunya) is about naming and is used in lesson b-2 for speech.
  searches:
  - 'find_entity.py "letter" "رسالة" "epistolary": the hits are individual letters and works titled risala, not an account of how letters are written'
  - 'find_entity.py "slang" "عامية" "colloquial" "fusha": no record on colloquial speech'
  - 'find_entity.py "dialect" "لهجة" "Egyptian Arabic": no record on dialects'
  - 'find_entity.py "résumé" "career" "وظيفة" "employment": wazifa-fiqh is a ruling on offices and stipends, not on application letters or register'
- code: A3.1
  text: using information from oral texts in the target language, identify communities where the target language is spoken, find out about aspects of their cultures, and make connections to personal experiences and their own and other communities […]
  why: Neither city record says that Arabic is spoken there, and a city's history is not a community where Arabic is spoken.
  searches:
  - 'entity_brief.py place/baghdad --full: tried and removed (founding and naming of the city; no statement that Arabic is spoken there or of any community''s culture in that language)'
  - 'entity_brief.py place/cairo --full: tried and removed (the Golius line on a market for East and West is about trade; nothing about the language)'
