- code: A3.2
  text: using information from oral texts in the target language, identify and demonstrate an understanding of sociolinguistic conventions used in a variety of situations in diverse communities where the target language is spoken […]
  why: 'The expectation asks the student to identify, in what they hear, sociolinguistic conventions: dialects and accents, gestures, interview conventions, idioms and proverbs, the register between speakers. The museum holds no record on any of these. Its two records on words that moved between languages (bimaristan, algebra) answered the Level 2 course, whose examples name borrowed words; this course''s examples do not, so they were not used.'
  searches:
  - 'find_entity.py "dialect" "لهجة" "Egyptian Arabic": five source records of encyclopaedia articles and no record on dialects'
  - 'find_entity.py "gesture" "body language" "إيماءة" "etiquette": adab al-akl (table manners) and tacbir (expression of will) are fiqh accounts, not spoken-language conventions'
  - 'find_entity.py "interview" "مقابلة" "register": the hits are state registers (diwan) and one audience of Herzl; no record on interview or register of speech'
  - 'find_entity.py "proverb" "أمثال" "idiom": hadith passages and a television title; no record on proverbs or idioms'
  - 'find_entity.py "loanword" "كلمات دخيلة" "mu''arrab" "تعريب": one record (Abd al-Malik''s register reform), about the language of tax registers, not borrowed words'
