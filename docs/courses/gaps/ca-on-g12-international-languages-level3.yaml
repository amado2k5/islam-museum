- code: C3.2
  text: identify, in level-appropriate texts in the target language, examples of sociolinguistic conventions associated with a variety of social situations in diverse communities where the target language is spoken […]
  why: The expectation asks the student to find, in level-appropriate Arabic texts, regional or idiomatic expressions, colloquialisms and slang, and to compare them between two regions. The museum holds no record on dialects, colloquial Arabic, slang or idioms; the texts to read are the class's own.
  searches:
  - 'find_entity.py "slang" "عامية" "colloquial" "fusha": concept/popular-learning-in-arab-civilisation is about learning, not colloquial speech; the other hit is a person record'
  - 'find_entity.py "dialect" "لهجة" "Egyptian Arabic": no record on dialects (five source records)'
  - 'find_entity.py "proverb" "أمثال" "idiom": no record on idiomatic expressions'
  - 'find_entity.py "gratitude" "شكر" "invitation" "اعتذار": concept/shukr and concept/gratitude-shukr are fiqh accounts of thanking God and people and give no formula a reader could find in a text'
