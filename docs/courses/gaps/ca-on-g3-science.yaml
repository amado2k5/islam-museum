- code: C2.4
  text: identify ways in which forces are used in their daily lives
  why: The expectation asks about contact and non-contact forces and how forces start, stop or change an object’s motion or shape. The museum holds no record that describes forces in this sense.
  searches:
  - 'find_entity.py "force" "قوة" "friction" "Newton": only records using the word in a political or legal sense (power, binding force, conquest by force)'
  - 'find_entity.py "gravity" "جاذبية" "magnet" "مغناطيس": only place/magnetic-temple-china, a place record, not about forces'
- code: D1.1
  text: assess effects on society and the environment of strong and stable structures
  why: The records the museum holds on dams show a structure's failure and what followed, not the effects of a strong, stable structure while it stood.
  searches:
  - 'find_entity.py "dam" "سد" "bridge" "جسر": building/marib-dam, event/flood-of-al-aram and passage/quran-34-16 were tried and removed after review, because they tell of a dam bursting and say nothing of what the dam did while it stood'
  - 'find_entity.py "bridge" "جسر" "dam": only battle and strife records named for a bridge, and building/marib-dam, which describes a dam’s history, not its strength'
- code: D1.2
  text: assess the environmental impact of structures built by various animals, including structures built by humans
  why: The expectation asks about the environmental impact of structures built by animals and by humans. The museum has records for the bee, the ant and the spider, but they have no prose to write from.
  searches:
  - 'find_entity.py "bee" "نحل" "ant" "نمل" "spider": concept/bee, concept/ant, concept/spider: prose none'
  - 'find_entity.py "nest" "عش" "beaver" "bird nest": only a silver hoard called al-Ush and a person named al-Ush'
- code: D2.1
  text: describe a structure as a supporting framework that holds a load and has a definite size, shape, and function, and identify structures in the natural environment and in the built environment
  why: The expectation asks the student to define a structure as a supporting framework with a load, size, shape and function, and to find natural and built examples. The museum holds no record that treats structures in this sense; its building records describe particular buildings.
  searches:
  - 'find_entity.py "arch" "قوس" "buttress" "vault" "عقد": only contract (aqd) records and hadith passages'
  - 'find_entity.py "truss" "beam" "column" "عمود": building/amud-al-sawari and a photo of a column base, not about the idea of a structure'
- code: D2.2
  text: demonstrate an understanding of the relationship between form and function for various structures
  why: The expectation asks the student to understand the relationship between form and function in structures. The museum’s record of the Dome of the Rock describes a form, but does not say how form serves function, so it is used in lesson D-1 only for materials and wind.
  searches:
  - 'find_entity.py "dome" "قبة" "arch": building/dome-of-the-rock: description of form and materials, no account of form and function'
  - 'find_entity.py "strut" "tie" "تدعيم" "stability" "توازن": no record on structural form and function'
- code: D2.3
  text: identify the strength of a structure as its ability to support a load and describe ways to increase the strength of structures, including ways to increase the strength of different materials used to build them
  why: The expectation asks about the strength of a structure as its ability to support a load and ways to increase it. The museum holds no record that says this of any structure.
  searches:
  - 'find_entity.py "truss" "beam" "column" "عمود": no record on load or strength'
  - 'find_entity.py "bridge" "جسر" "dam": only battle and strife records named for a bridge, and building/marib-dam, which describes a dam’s history, not its strength'
- code: D2.4
  text: describe the stability of a structure as its ability to keep its shape, maintain balance, float, and/or stay fixed in one spot when a force is applied to the structure, and describe ways to improve a structure’s stability
  why: The expectation asks about the stability of a structure when a force is applied and how to improve it. The museum holds no record that treats stability.
  searches:
  - 'find_entity.py "strut" "tie" "تدعيم" "stability" "توازن": concept/al-tawazun-al-kawni is the balance of creation, not of structures'
  - 'find_entity.py "arch" "قوس" "buttress" "vault" "عقد": no record on stability'
- code: D2.7
  text: explain the role of struts and ties in structures under load
  why: The expectation asks the student to explain the role of struts and ties in structures under load. The museum holds no record on struts or ties.
  searches:
  - 'find_entity.py "strut" "tie" "تدعيم" "stability" "توازن": only a hadith passage on the tie of kinship and concept/al-tawazun-al-kawni'
  - 'find_entity.py "truss" "beam" "column" "عمود": no record on struts or ties'
- code: E1.1
  text: assess the importance of soils for society and the environment
  why: The expectation asks the student to assess the importance of soils for society and the environment. The museum has records on farming and on one agronomist’s view of land, but none that assesses soil’s importance to society or the environment.
  searches:
  - 'find_entity.py "soil" "تربة" "compost": invention/ibn-bassal-soil-water-matching (used in lessons B-1 and E-1) and unrelated turbe (tomb) records; no assessment of importance'
  - 'find_entity.py "agriculture" "الفلاحة" "Kitab al-Filaha": concept/agriculture-in-islam is about farming as a livelihood, not about soil; work/filaha-nabatiyya is a corpus of magic and talismans'
- code: E1.2
  text: assess the impact of human activity on soils, and describe ways in which humans can improve the quality of soils and/or lessen or prevent harmful effects on soils
  why: The expectation asks about the impact of human activity on soils and ways to improve or protect them. The museum holds no record on soil degradation.
  searches:
  - 'find_entity.py "land degradation" "تدهور الأرض" "drought" "جفاف": no real record'
  - 'find_entity.py "erosion" "تعرية" "soil erosion" "انجراف التربة": no real record'
- code: E2.1
  text: identify the living and non-living components of soil, and describe the characteristics of healthy soil
  why: The expectation asks about the living and non-living parts of soil and the signs of healthy soil. The museum holds no record on soil composition.
  searches:
  - 'find_entity.py "humus" "تركيب التربة" "soil composition": one unrelated hadith passage on one-fifth of booty (khumus)'
  - 'find_entity.py "soil" "تربة" "compost": no record on soil composition; the Ibn Bassal record is about practical land types and is used in lessons B-1 and E-1'
- code: E2.2
  text: identify different substances that are commonly added to, or absorbed by, the soil, and describe their effects on soil health
  why: The only record on a substance added to soil gives jurists' rulings on purity, sale and eating the produce, not its effect on soil health.
  searches:
  - 'find_entity.py "fertilizer" "manure" "سماد": concept/simad was tried and removed after review, because it is jurists’ rulings on purity and sale, mentions human excrement, and is not about soil health'
  - 'find_entity.py "soil" "تربة" "compost": invention/ibn-bassal-soil-water-matching describes land types and suitable plants, not substances added to soil'
- code: E2.4
  text: explain the process of erosion, including its causes and its impact on soils
  why: The expectation asks about erosion, its causes and its impact on soils. The museum holds no record on erosion.
  searches:
  - 'find_entity.py "erosion" "تعرية" "soil erosion" "انجراف التربة": no real record'
  - 'find_entity.py "fallow" "بور" "soil conservation" "crop rotation" "تناوب المحاصيل": hits were place and person names ending in -pur (Burhanpur, Hoshiarpur, Sultanpur and the like); none on soil conservation'
- code: E2.5
  text: identify various strategies used to maintain and improve soil health in Ontario
  why: The expectation asks about strategies used to maintain and improve soil health in Ontario. The museum holds no record on soil-health strategies in Ontario, and its records on manure and land types are about other places.
  searches:
  - 'find_entity.py "fallow" "بور" "soil conservation" "crop rotation" "تناوب المحاصيل": no usable record'
  - 'find_entity.py "fertilizer" "manure" "سماد" "crop rotation": concept/simad exists (tried for E2.2 and removed after review) but gives rulings on manure, not strategies for soil health in Ontario'
- code: E2.6
  text: describe the process of composting, and explain some benefits of composting
  why: The expectation asks about the process and benefits of composting. The museum holds no record on composting.
  searches:
  - 'find_entity.py "compost" "تسميد" "organic matter": only place/santiago-de-compostela and a raid on it, unrelated'
  - 'find_entity.py "fertilizer" "manure" "سماد" "crop rotation": concept/simad: rulings on manure; it does not describe composting'
