- code: A2.1
  text: write and execute code in investigations and when modelling concepts, with a focus on testing, debugging, and refining programs
  why: The expectation asks the student to write and run code and to test and debug it. The museum holds no record about programming; its nearest record, on algorism, is about written arithmetic by ordered steps, which is not coding.
  searches:
  - 'find_entity.py "algorithm" "خوارزمية" "coding": invention/algorism and work/al-jabr-wal-muqabala: arithmetic and algebra, not code'
  - 'find_entity.py "computer" "حاسوب" "programming": no usable record; the only hit was a fatwa about asking artificial intelligence'
- code: A2.2
  text: identify and describe impacts of coding and of emerging technologies on everyday life
  why: The expectation asks about the impact of coding and emerging technologies on everyday life today. The museum holds no record about either.
  searches:
  - 'find_entity.py "emerging technology" "تقنية حديثة" "technology and society": no real record'
  - 'find_entity.py "artificial intelligence" "الذكاء الاصطناعي" "computer": work/fatwa-islamqa-asking-artificial-intelligence-for-fatwas only: a fatwa, not an account of impact on everyday life'
- code: A3.1
  text: describe practical applications of science and technology concepts in their home and community, and how these applications address real-world problems
  why: The expectation asks the student to describe applications of science in their own home and community; its object is the student’s own surroundings, which the museum does not hold.
  searches:
  - 'find_entity.py "locally grown" "محلي" "local produce": only partial-word matches (al-Muhalla of Ibn Hazm), unrelated'
  - 'find_entity.py "engineering design" "هندسة" "architect" "مهندس": 42 records, none about applications in a present-day home or community'
- code: A3.2
  text: investigate how science and technology can be used with other subject areas to address real-world problems
  why: The expectation asks the student to investigate how science and technology combine with other school subjects to meet real-world problems; it names no subject matter the museum could supply.
  searches:
  - 'find_entity.py "scientific method" "المنهج العلمي" "experiment" "تجربة": 12 records, none about combining school subjects; the nearest, invention/ibn-zuhr-goat-tracheotomy-demonstration, is a medical demonstration'
  - 'find_entity.py "engineering design" "هندسة" "architect" "مهندس": no record that addresses cross-subject problem solving'
- code: B1.1
  text: assess ways in which plants are important to humans and other living things, taking different perspectives into consideration, and identify ways in which humans can protect native plant species and their habitats
  why: The expectation asks the student to assess the importance of plants to humans and others and to name ways to protect native plant species and habitats. The nearest record, concept/hima, describes land reserved for named animals and says nothing about protecting plants or native species.
  searches:
  - 'find_entity.py "hima" "حمى" "protected land": concept/hima: a reserved pasture for the horse, riding camel and plough-ox; no statement about plants or habitat protection'
  - 'find_entity.py "deforestation" "إزالة الغابات" "habitat": no real record'
- code: B1.2
  text: assess ways in which human activities have an impact on plants and plant habitats, and identify personal actions that they could take to minimize harmful effects and enhance positive ones
  why: The expectation asks about the impact of human activities on plants and plant habitats and on personal actions to reduce harm. The museum holds no record on that subject.
  searches:
  - 'find_entity.py "deforestation" "إزالة الغابات" "habitat": no real record (one unrelated source record)'
  - 'find_entity.py "pollution" "تلوث" "environment" "البيئة" "forest" "غابة": only place/al-ghaba and battle records named al-Ghaba; not about plants'
- code: B1.3
  text: assess the benefits and limitations of locally grown food
  why: The expectation is about the benefits and limits of locally grown food, which is a question about Ontario’s present-day food supply; the museum holds no record on it.
  searches:
  - 'find_entity.py "locally grown" "محلي" "local produce": only partial-word matches (al-Muhalla), unrelated'
  - 'find_entity.py "food" "طعام" "local food" "market": the hits seen were hadith passages and fiqh entries on food rulings; none on local growing'
- code: B2.2
  text: identify different parts of plants, including the root, stem, flower, stamen, pistil, leaf, seed, cone, and fruit, and describe how each part contributes to plants’ survival within their environment
  why: The expectation asks the student to identify the parts of plants and what each contributes to survival. The museum holds no record that describes plant parts.
  searches:
  - 'find_entity.py "root" "جذر" "leaf" "ورقة" "stem of plant": only the name Waraqa ibn Nawfal, a hadith passage and a mathematical record on cubic roots, none about plant parts'
  - 'find_entity.py "seed" "بذرة" "germination" "إنبات": concept/mustard-seed has no prose; passage/muslim-0184 is a hadith, not a description of a seed'
- code: B2.3
  text: describe changes that different plants undergo in their life cycles
  why: The expectation asks the student to describe the changes plants undergo in their life cycles. The museum holds no record on plant life cycles.
  searches:
  - 'find_entity.py "life cycle" "دورة الحياة" "growth of a plant": exhibit/path-life-cycle only: a Muslim human life cycle'
  - 'find_entity.py "seed" "بذرة" "germination" "إنبات": no record describing plant growth'
- code: B2.4
  text: describe ways in which a variety of plants adapt and/or react to their environment and to changes in their environment
  why: The expectation asks about how plants adapt or react to their environment. The museum holds no record on plant adaptation.
  searches:
  - 'find_entity.py "adaptation" "تكيف" "desert plants": no real record'
  - 'find_entity.py "plant" "نبات" "botany": exhibit/path-botany, a fatwa on cloning plants, records on plant naming, idhkhir and plant-ash glass; none on how plants respond to their environment'
- code: B2.5
  text: demonstrate an understanding that most plants get energy directly from the Sun through the process of photosynthesis, which involves the absorption of carbon dioxide and the release of oxygen
  why: The expectation asks the student to understand photosynthesis. The museum holds no record on it.
  searches:
  - 'find_entity.py "photosynthesis" "التمثيل الضوئي" "chlorophyll": no real record'
  - 'find_entity.py "plant" "نبات" "botany": exhibit/path-botany and records on naming and plant ash; none on how plants take energy from the Sun'
- code: B2.7
  text: describe various plants used for food, including those grown by First Nations, Métis, and Inuit, and identify local settings where these plants are grown or found
  why: The expectation asks about food plants including those grown by First Nations, Métis and Inuit, and the local settings where they grow. The museum holds no record on Indigenous food plants or Ontario settings.
  searches:
  - 'find_entity.py "Indigenous" "السكان الأصليين" "First Nations": no real record'
  - 'find_entity.py "locally grown" "محلي" "local produce": only partial-word matches, unrelated'
- code: B2.8
  text: describe ways in which plants and animals, including humans, depend on each other
  why: The expectation asks about how plants and animals, including humans, depend on each other. The museum’s nearest records are course records of the Grade 6 pilot and a social-interdependence concept, neither about plants and animals.
  searches:
  - 'find_entity.py "food chain" "سلسلة غذائية" "interdependence": course/ca-on-g6-sci-bio-3 (another course) and concept/diversity-of-talents-and-interdependence (human society), not plants and animals'
  - 'find_entity.py "bee" "نحل" "ant" "نمل" "spider": concept/bee, concept/ant, concept/spider exist but have no prose to write from'
- code: C1.2
  text: assess harmful effects of forces that may result from various human activities, and describe how health and safety devices can minimize these effects
  why: The expectation asks about harmful forces from human activities and the health and safety devices that reduce them. The museum holds no record on safety devices.
  searches:
  - 'find_entity.py "seat belt" "safety device" "جهاز أمان": no real record'
  - 'find_entity.py "friction" "احتكاك" "push" "pull": no real record'
