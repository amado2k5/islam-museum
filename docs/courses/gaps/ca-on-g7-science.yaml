  - 'find_entity.py "soil" "تربة" "water cycle" "دورة الماء": 105 hits, the first being graves and tombs (turba); the soil-and-farming record found is invention/ibn-bassal-soil-water-matching, tried for B2.8 and removed (it matches crops to land and water and names no ecosystem impact); none of the hits read concerns the cycling of matter'
- code: B2.3
