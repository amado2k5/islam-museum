  why: The expectation is about the social, economic and environmental impacts of renewable and non-renewable energy, including climate change. The museum holds water- and animal-powered machines (invention/jazari-double-piston-pump, invention/jazari-animal-scoop-water-lifter) that name a power source, not its impacts, so they are not linked.
  searches:
  - 'find_entity.py "renewable energy" "طاقة متجددة" "solar" "طاقة شمسية" "fossil fuel": 9 hits on astronomy (solar-time tables, eclipses, a calendar gearing), none on energy sources or their impacts'
  - 'find_entity.py "fuel" "وقود" "charcoal" "فحم" "oil" "نفط" "naphtha": only fiqh records on oil and fat as substances'
