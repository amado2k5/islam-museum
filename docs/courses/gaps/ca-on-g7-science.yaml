- code: B2.8
  text: describe how different approaches to agriculture and to harvesting food from the natural environment can impact an ecosystem, and identify strategies that can be used to maintain and/or restore balance to ecosystems
  why: Concept/hima records who may graze a reserved pasture and invention/ibn-bassal-soil-water-matching records matching crops to land and water; neither says anything about an impact on an ecosystem or about keeping or restoring balance.
  searches:
  - 'concept/hima: the record concerns who may graze and the forfeiture of property; it names no ecosystem, no protection of the land and no balance, so it was removed after the fleet review'
  - 'invention/ibn-bassal-soil-water-matching: the record matches crops to land and water; no impact on an ecosystem and no restoration, so it was removed after the fleet review'
- code: C1.1
  text: analyse the social and environment impacts of the use and disposal of pure substances found in technological devices, considering local and global perspectives
  why: The expectation is about the social and environmental impacts of using and disposing of pure substances in technological devices; the museum holds no record on this.
  searches:
  - 'find_entity.py "mining" "تعدين" "metal" "معدن" "extraction": 15 hits, among them al-Kashi''s root extraction, a fiqh term for binding vessels with metal and a mining place; none on substances in devices or their disposal'
  - 'find_entity.py "natural resources" "موارد طبيعية" "waste" "recycling": concept/al-mawarid-al-tabiiyya and concept/al-israf are economic accounts, not about use and disposal of substances in devices'
- code: C1.2
  text: assess environmental and social impacts of different industrial methods used to separate mixtures
  why: The expectation is about the environmental and social impacts of industrial methods of separating mixtures; the anbik record (taught in lesson c-1 under C2.7) describes an apparatus, not an industry or its impacts.
  searches:
  - 'find_entity.py "mining" "تعدين" "metal" "معدن" "extraction": no record on industrial separation'
  - 'find_entity.py "dissolve" "ذوبان" "solution" "محلول" "solvent": 18 hits, none about dissolving a substance: "solution" as the answer to an equation (Abu Kamil, al-Kashi, Abu al-Wafa, Khayyam), an army that dissolves, fatwa resolutions, the dissolution of a contract'
