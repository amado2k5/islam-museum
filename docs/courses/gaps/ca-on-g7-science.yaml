- code: A2.1
  text: write and execute code in investigations and when modelling concepts, with a focus on planning and designing programs
  why: 'Skills expectation: writing and executing code. The museum holds no record on programming; invention/jazari-musical-boat says in its own summary that it is not the first programmed robot, so it is not linked.'
  searches: *id001
- code: A2.2
  text: identify and describe impacts of coding and of emerging technologies, such as artificial intelligence systems, on everyday life, including skilled trades
  why: The expectation is about the impacts of coding and of artificial intelligence on everyday life and skilled trades; the museum holds no record on these.
  searches:
  - 'find_entity.py "artificial intelligence" "الذكاء الاصطناعي" "computer" "programming" "برمجة": one real record, work/fatwa-islamqa-asking-artificial-intelligence-for-fatwas, a ruling on asking AI for fatwas, not about impacts on daily life or trades'
  - 'grep -rliE "artificial intelligence" content/en outside course/: invention/jazari-musical-boat and invention/jazari-castle-clock mention it only in passing; the other hits are records of modern people (person/fei-fei-li, person/feryal-clark)'
- code: B1.1
  text: assess the impact of various technologies on the environment
  why: The expectation asks the student to assess the impact of technologies on the environment; the museum holds no record that assesses a technology's environmental impact.
  searches:
  - 'find_entity.py "atmosphere" "غلاف جوي" "air" "هواء" "pollution" "تلوث": three hits, a mosque named Air Tiris, a course lesson on flight and a NASA source record; nothing on pollution'
  - 'find_entity.py "natural resources" "موارد طبيعية" "waste" "recycling": concept/al-mawarid-al-tabiiyya is an author''s account of raw materials and trade and concept/al-israf is about extravagance; neither assesses a technology''s environmental impact'
- code: B1.3
  text: analyse how diverse First Nations, Métis, and Inuit practices and perspectives contribute to environmental sustainability
  why: The expectation is about First Nations, Metis and Inuit practices and perspectives on sustainability; the museum holds no record on them.
  searches:
  - 'find_entity.py "First Nations" "Métis" "Inuit" "السكان الأصليون" "Indigenous": one loose hit, concept/muwala (a fiqh term for continuity)'
  - 'grep -rliE "First Nations|Métis|Indigenous peoples" content/en outside course/: no file'
- code: B2.1
  text: explain that an ecosystem is a network of interactions among living organisms and their environment
  why: The expectation is about the structure and workings of ecosystems; the museum holds no record that describes one.
  searches:
  - 'find_entity.py "ecosystem" "نظام بيئي" "ecology": one loose hit (a fatwa on obstetrics training), no ecosystem record'
  - 'find_entity.py "food chain" "سلسلة غذائية" "predator" "decomposer": no real record'
- code: B2.2
