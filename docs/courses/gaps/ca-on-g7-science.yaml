  - 'grep -rliE "centre of gravity|center of gravity" content/en: no file'
- code: D2.4
  text: describe the role of symmetry in structures, and identify instances of symmetry in various structures
  why: The expectation is about symmetry in structures; the girih and geometric-patterns records describe repeating star and polygon patterns in one Wikidata sentence each and name neither symmetry nor any property of it.
  searches:
  - 'concept/girih: a Wikidata sentence (interlacing lines that build stars and polygons) and generic tiers; it does not name symmetry, so it was removed after the fleet review'
  - 'concept/islamic-geometric-patterns: one Wikidata sentence (repeated patterns of stars, polygons and grids); it does not name symmetry, so it was removed after the fleet review'
- code: D2.7
  text: describe methods engineers and other professionals use to assess, improve, and maintain the safety of structures
  why: The expectation is about the methods engineers use to assess, improve and maintain the safety of structures. event/aqsa-fatimid-rebuild records a rebuilding after an earthquake, and the market-inspection records concern trade, not structural safety.
  searches:
  - 'find_entity.py "building safety" "سلامة المباني" "inspection" "muhtasib" "المحتسب": invention/hisba, job/muhtasib and events on al-Maqrizi''s terms as market inspector, about regulating markets, not inspecting structures'
  - 'find_entity.py "earthquake" "زلزلة" "collapse" "انهيار" "structure failure": event/aqsa-fatimid-rebuild gives the dates and the smaller plan of a rebuilding, not how safety was assessed or improved'
- code: E1.1
  text: assess the social and environmental benefits of technologies that reduce heat loss in enclosed spaces or heat transfer to surrounding spaces
  why: The expectation is about technologies that reduce heat loss or heat transfer in enclosed spaces. building/emarat-e-badgir (a wind-catcher house) exists but has no prose, so nothing can be restated from it.
  searches:
  - 'find_entity.py "wind catcher" "badgir" "ملقف" "wind tower": one real record, building/emarat-e-badgir, prose none'
  - 'find_entity.py "courtyard" "فناء" "mashrabiya" "مشربية" "ventilation": hits are fiqh and Sufi terms (concept/arsa, fana), none on cooling or insulation'
- code: E1.2
