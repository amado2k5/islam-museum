  - 'find_entity.py "Quebec nationalism" "racial profiling" "nativism": no real record'
- code: D2.5
  text: compare the context of and approaches implicit in Canada’s policies on diversity and multiculturalism with the context, approaches, and policies of other nations […]
  why: Comparing Canada’s diversity policy with other nations’ policies needs records on those policies. concept/al-ilmaniyya-wal-islam reports a television panel’s votes and views on secularism, and is not a record of any nation’s policy.
  searches:
  - 'find_entity.py "secularism in France" "laïcité" "العلمانية": one hit, concept/al-ilmaniyya-wal-islam, a television panel on secularism and Islam, not a statement of a state’s policy'
