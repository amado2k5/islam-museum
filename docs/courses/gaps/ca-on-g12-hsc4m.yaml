- code: B1.1
  text: demonstrate an understanding of the ele­ments of culture […] asso­ciated with various definitions of the term […]
  why: The expectation asks the student to understand the elements of culture and its definitions (UNESCO, anthropological, sociological); the museum holds no record on the concept of culture or on those definitions.
  searches:
  - 'find_entity.py "culture" "ثقافة" "UNESCO definition of culture": 18 records, none on the concept of culture (a reading-and-culture concept, a youth cultural crisis, a coffee trail, a book on the art and culture of India)'
  - 'find_entity.py "elements of culture" "عناصر الثقافة" "kinship": 11 records, all rulings and hadith on kinship ties; none defines culture'
- code: B1.2
  text: analyse various functions of culture […]
  why: The expectation is about the functions of culture in general (sense of self, social norms, security); the museum holds no record on them.
  searches:
  - 'find_entity.py "social norms" "الأعراف الاجتماعية" "sense of community": no real record'
  - 'find_entity.py "cultural identity" "الهوية الثقافية" "collective identity": no real record'
- code: B1.3
  text: describe multiple ways in which culture can influence an individual’s perceptions, attitudes, and behaviours […] and can shape social institutions and practices […]
  why: The expectation asks for several ways culture shapes perceptions, behaviour and institutions in general; the museum’s food-rule records show one rule of one tradition, not an account of cultural influence.
  searches:
  - 'find_entity.py "dietary restrictions" "customs" "العادات": 10 records, all names that contain the word saadat; nothing on customs'
  - 'find_entity.py "gender roles" "women" "المرأة": 187 records, almost all Muwatta passages and one fiqh entry on a woman’s rulings; none treats cultural influence on roles'
- code: B2.1
  text: demonstrate an understanding of how an individual’s cultural identity is socially constructed […]
  why: How an individual’s cultural identity is socially constructed (family, peers, media) is a social-science topic the museum holds no record on.
  searches:
  - 'find_entity.py "socially constructed identity" "identity formation" "تشكل الهوية": one hit, a source (a 2025 study of social media and religious identity), not a record'
  - 'find_entity.py "peer pressure" "family expectations" "التنشئة الاجتماعية": no real record'
- code: B2.2
  text: analyse how culture is acquired and main­tained within a group […]
  why: How culture is acquired and maintained within a group (oral tradition, endogamy, institutions) is a general topic; the museum holds no record on it.
  searches:
  - 'find_entity.py "oral tradition" "transmission of culture" "التراث الشفوي": no real record'
  - 'find_entity.py "endogamy" "exogamy" "الزواج من الأقارب": no real record'
- code: B2.4
  text: compare the rates at which cultural change is taking place within a variety of cultures […], and analyse the fac­tors contributing to this change […]
  why: Comparing rates of cultural change across cultures and its causes is a general topic; the museum holds no record on it.
  searches:
  - 'find_entity.py "cultural change" "التغير الثقافي" "globalization": no real record'
  - 'find_entity.py "intergenerational relationships" "rites of passage" "mass media": no real record'
- code: B2.5
  text: analyse various types of tensions that can occur between individuals and their collective culture […]
  why: Tensions between individuals and their collective culture (generations, majority and minority, secular and religious views) are not the subject of any museum record.
  searches:
  - 'find_entity.py "intergenerational conflict" "culture clash" "صراع الأجيال": no real record'
  - 'find_entity.py "minority culture majority culture" "secular and religious perspectives" "الأقليات": no real record'
- code: B3.2
  text: demonstrate an understanding of theoretical perspectives used to analyse culture […]
  why: The expectation asks for theoretical perspectives on culture (structural functionalist, conflict, feminist, symbolic interactionist, cultural materialist); the museum holds no record on any of them.
  searches:
  - 'find_entity.py "structural functionalism" "conflict theory" "symbolic interactionism": one hit, a question on evolution and Islam, unrelated'
  - 'find_entity.py "cultural materialism" "symbolic interactionism" "التفاعلية الرمزية": no real record'
- code: B3.3
  text: apply a range of theoretical perspectives to analyse selected cultures or cultural practices
  why: Applying theoretical perspectives to a culture needs those perspectives, which the museum does not hold (see B3.2).
  searches:
  - 'find_entity.py "feminist theory" "anthropology of culture" "علم الاجتماع": no real record'
  - 'find_entity.py "Orientalism critique" "postcolonial theory" "ما بعد الاستعمار": no real record'
- code: C1.2
  text: demonstrate an understanding of various secular beliefs or philosophies found within a specific culture […] and of how they relate to various aspects of that culture […]
  why: Secular beliefs and philosophies within a culture (humanism, rationalism, Confucianism, Marxism and others) are not the subject of any museum record.
  searches:
  - 'find_entity.py "secular philosophy" "humanism" "rationalism": no real record'
  - 'find_entity.py "Confucianism" "Marxism" "liberalism": one hit, a source (a podcast page), not a record'
- code: C2.2
  text: analyse the impact of various transformative social, economic, or political conditions or events […] on forms of cultural expression in the areas of art, philosophy, and religion/spirituality
  why: The expectation asks how events such as the partition of India, Harlem’s changes, the Cultural Revolution or apartheid shaped cultural expression; the museum holds no record on those events and their effect on expression.
  searches:
  - 'find_entity.py "Partition of India" "apartheid" "Cultural Revolution": one hit, a source (a profile of an anti-apartheid activist), not a record'
  - 'find_entity.py "Harlem" "transformative events cultural expression" "التحولات السياسية": 4 records; building/malcolm-shabazz-mosque has no prose, the others are medieval Frankish embassies and plots'
- code: C2.3
  text: compare similar forms of cultural expression in different cultures and/or historical periods […]
  why: Comparing similar cultural expressions across cultures (manga, Aboriginal art, Catholicism, rap) needs paired records the museum does not hold.
  searches:
  - 'find_entity.py "compare cultural expression across cultures" "rap" "hip hop": no real record'
  - 'find_entity.py "Aboriginal art" "Catholicism in Latin America" "cartoons manga": no real record'
- code: C3.3
  text: assess ethnocultural minority groups’ contributions to and influence on culture in Canada […]
  why: Contributions of ethnocultural minority groups to culture in Canada are the object of the expectation; the museum holds no record on them.
  searches:
