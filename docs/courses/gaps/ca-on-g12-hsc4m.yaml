- code: D2.3
  text: explain systemic barriers to integration and achievement facing Canadian ethnocultural minority groups […], and assess the effectiveness of programs and strategies to overcome these bar­riers […]
  why: Systemic barriers facing Canadian ethnocultural minority groups are the object of the expectation. concept/al-indimaj-wal-huwiyya, one preacher’s view of a believer’s integration, is used in a lesson on D1.4 and does not treat barriers or programmes in Canada.
  searches:
  - 'find_entity.py "systemic barriers" "racism and discrimination" "credential recognition": no real record'
  - 'find_entity.py "newcomers integration" "language training" "الاندماج": one hit, concept/al-indimaj-wal-huwiyya, a speaker’s view of integration, not of barriers in Canada'
- code: D2.4
  text: analyse major past and present policies, practices, and cultural issues at the community, […]
  why: Policies, practices and issues in Canadian communities (nativism, multiculturalism, integration versus assimilation) are the object of the expectation; the museum holds no record on any of them.
  searches:
