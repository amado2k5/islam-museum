  - 'find_entity.py "mosques in Canada" "Muslims in Canada" "مسلمو كندا": 2 hits, both sources (a mosque catalogue and an archive), not records; place/canada has no prose'
- code: C3.4
  text: demonstrate an understanding of the ways in which Canadian individuals from various ethnocultural minority groups have contributed to and influenced Canadian culture and society […]
  why: Canadian individuals from ethnocultural minority groups are the object of the expectation; the museum holds no record on any of them.
  searches:
  - 'find_entity.py "Canadian ethnocultural contributions" "Rosalie Abella" "Viola Desmond": no real record'
  - 'find_entity.py "Canadian Muslim" "Ontario" "أونتاريو": 10 records; place/ontario has no prose, the rest are the course tree itself'
- code: D1.1
  text: demonstrate an understanding of the dynamics of power relations within specific cultural groups […]
  why: Power relations within specific cultural groups (caste, shadism, elders, gender roles) are not the subject of any museum record.
  searches:
  - 'find_entity.py "caste system" "الطبقات الاجتماعية" "hijra": 23 records, all on the Prophet’s migration (the word hijra), not on the social status the expectation names'
  - 'find_entity.py "power relations within cultural groups" "shadism" "status of elders": no real record'
- code: D1.2
  text: analyse the potential impact on cultural identity and on the relations between cultural groups of cultural stereotypes, labelling, and misrepresentations found in mainstream media and popular culture […]
  why: The expectation asks for the impact of media stereotypes and misrepresentations on cultural identity. The only related record, concept/islamufubiya, summarises a television panel’s debate and audience votes, not an account of media stereotyping, and is draft; a student text cannot be restated from it without presenting a panel’s opinions as findings.
  searches:
  - 'find_entity.py "media stereotypes" "الصورة النمطية" "misrepresentation of Muslims": no real record'
  - 'find_entity.py "model minority" "terrorism stereotype" "Islamophobia": 6 records; concept/islamufubiya (a panel debate with audience votes) and event/international-day-to-combat-islamophobia, neither an account of media representation'
- code: D1.3
  text: analyse both the positive and negative aspects and effects of the interactions between minority and majority cultures in Canada and around the world […]
  why: Interactions between minority and majority cultures in Canada and the world are the object of the expectation; the museum holds no record on any of the cases it names.
  searches:
  - 'find_entity.py "minority and majority cultures" "Uighur" "Kurds": 3 records: group/kurds (medieval accounts of origins) and two medieval clashes; none on a minority and a majority today'
  - 'find_entity.py "Palestinians in Israel" "Romani" "Algerians in France": 4 records: a 1916 battle at Romani, a person, a fatwa on Romanian sheep and place/romania; none on these minorities'
- code: D1.5
  text: assess the effects of cultural imperialism on cultures around the world […]
  why: The effects of cultural imperialism on cultures around the world are not the subject of any museum record.
  searches:
  - 'find_entity.py "cultural imperialism" "الاستعمار الثقافي" "cultural appropriation": no real record'
  - 'find_entity.py "loss of language" "consumerism" "globalization": no real record'
- code: D2.1
  text: explain the impact of colonization on Aboriginal communities in Canada and other countries […]
