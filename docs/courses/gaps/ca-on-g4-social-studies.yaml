course: course/ca-on-g4-social-studies
gaps:
- code: A1.1
  text: "compare social organization […] in a few early societies, including at least one First Nation and one Inuit society […]"
  why: "Asks the student to compare social organisation across a few early societies, including a First Nation and an Inuit society; the one record still linked (dress in al-Andalus) shows how dress marked groups, not how a society was organised, and the record on the groups of Medina was withdrawn on review."
  searches:
  - "concept/medina-society-at-hijra: tried for the lesson a-5 (the groups of Medina); withdrawn on review because the record's page carries a hostile generalisation about the Jews of Medina, and no record that carries such content is linked"
  - "concept/al-ziyy-al-andalusi: linked in lesson a-5 for A1.2; it describes who wore what, and does not set out the social organisation of a society, so it does not carry A1.1"
  - "earlier searches for this register (\"First Nation\", \"Inuit\"): no real record, so the societies the expectation names cannot be compared"
- code: A2.1
  text: "formulate questions to guide investigations into ways of life and relationships with the environment in a few early societies, including at least one First Nation and one Inuit society, with an emphasis on aspects of the interrelationship between the environment …"
  why: "Inquiry-skill expectation (formulating questions) about ways of life and environment in early societies including a First Nation and an Inuit society; it asks for method and for societies the museum does not hold, and no record can honestly carry it."
  searches:
  - "find_entity.py \"First Nation\" \"الأمم الأولى\" \"Haudenosaunee\" \"Indigenous\": no real record"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "find_entity.py \"oral history\" \"رواية شفوية\" \"primary sources\": one source record (an interview), no entity about inquiry method"
  - "second pass: re-read against concept/unglazed-earthenware, concept/agriculture-in-islam and invention/tabula-rogeriana (taught in lessons a-4 and a-7 under A3.2 and A1.4; the Idrisi map was removed from lesson a-8 on review and A3.1 is in this register); this expectation is the skill of formulating questions and names no subject matter a record could carry, so it stays here"
- code: A2.2
  text: "gather and organize information on ways of life and relationships with the environment in a few early societies, including at least one First Nation and one Inuit society, using a variety of primary and secondary sources in both print and …"
  why: "Inquiry-skill expectation (gathering information from primary and secondary sources) including First Nation and Inuit societies and Elders' oral history; the museum holds no such records."
  searches:
  - "find_entity.py \"First Nation\" \"الأمم الأولى\" \"Haudenosaunee\" \"Indigenous\": no real record"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "find_entity.py \"oral history\" \"رواية شفوية\" \"primary sources\": one source record (an interview), no entity about inquiry method"
  - "second pass: concept/unglazed-earthenware (an artefact record) is taught in lesson a-4 under A3.2; gathering primary and secondary sources, including Elders' oral history and visits to First Nations cultural centres, is a skill whose named sources the museum does not hold"
- code: A2.3
  text: "analyse and construct print and/or digital maps, including thematic maps, as part of their investigations into interrelationships between the environment and life in a few early societies, including at least one First Nation and one Inuit society […]"
  why: "Map-skills expectation about thematic maps of environment and life in early societies including a First Nation and an Inuit society; no record is a thematic map of those societies."
  searches:
  - "find_entity.py \"First Nation\" \"الأمم الأولى\" \"Haudenosaunee\" \"Indigenous\": no real record"
  - "find_entity.py \"map\" \"خريطة\" \"Idrisi\" \"cartography\": invention/tabula-rogeriana is a world map of the Islamic Middle Ages, not a thematic map of environment or of an early society named by the expectation"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "second pass: find_entity.py \"map\" \"خريطة\" \"atlas\" \"world map\": invention/tabula-rogeriana was tried in lesson a-8 under A3.1 (finding places on a map) and removed on review; analysing and constructing thematic maps of the environment and life is a skill the Idrisi record does not teach, so A2.3 stays here"
- code: A2.4
  text: "interpret and analyse information relevant to their investigations, using a variety of tools […]"
  why: "Inquiry-skill expectation (interpreting artefacts, paintings, petroglyphs) tied to First Nation and Inuit societies; no usable record."
  searches:
  - "find_entity.py \"First Nation\" \"الأمم الأولى\" \"Haudenosaunee\" \"Indigenous\": no real record"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "find_entity.py \"paper\" \"ورق\" \"papermaking\": concept/gold-leaf-glass-tesserae is about the purity of gold in mosaic cubes, not daily life shown by visual evidence"
  - "second pass: find_entity.py \"pottery\" \"فخار\" \"ceramic\" \"lustre\": concept/unglazed-earthenware is taught in lesson a-4 under A3.2 (reading daily life from visual evidence); A2.4 is the general skill of analysing information with tools, and its named examples (petroglyphs, hunting customs of a First Nation and an Inuit society) are outside the museum, so it stays here"
- code: A2.5
  text: "evaluate evidence and draw conclusions about ways of life and relationships with the environment in a few early societies, including at least one First Nation and one Inuit society, with an emphasis on aspects of the interrelationship between the environment …"
  why: "Inquiry-skill expectation (evaluating evidence, drawing conclusions) about environment and life in early societies including a First Nation and an Inuit society; no record to carry it."
  searches:
