  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "find_entity.py \"oral history\" \"رواية شفوية\" \"primary sources\": one source record (an interview), no entity about inquiry method"
  - "second pass: no record teaches evaluating evidence and drawing conclusions; the records now used in lessons a-4 to a-7 carry subject matter, not this skill"
- code: A2.6
  text: "communicate the results of their inquiries, using appropriate vocabulary […] and formats […]"
  why: "Inquiry-skill expectation (communicating results) about early societies including a First Nation and an Inuit society; method only, no record to link."
  searches:
  - "find_entity.py \"First Nation\" \"الأمم الأولى\" \"Haudenosaunee\" \"Indigenous\": no real record"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Eskimo\" \"Arctic\": one real record, concept/muwala (a fiqh term, not Inuit); nothing usable"
  - "find_entity.py \"oral history\" \"رواية شفوية\" \"primary sources\": one source record (an interview), no entity about inquiry method"
  - "second pass: no record teaches communicating inquiry results; the Try this activities of lessons a-4 to a-7 are the lessons' own, not a record"
- code: A3.1
  text: "identify the location of some early societies, including at least one First Nation and one Inuit society, on a globe or on print, digital, and/or interactive maps, and demonstrate the ability to extract information on early societies’ relationship with the …"
  why: "Asks the student to locate early societies, including a First Nation and an Inuit society, on maps and take information from them; the only map record is a map of its maker's world and does not locate any society the curriculum names."
  searches:
  - "invention/tabula-rogeriana: tried for the lesson a-8 and removed on review; the record describes a silver disc and seventy maps of the medieval inhabited world, not the location of an early society or its relation to the environment"
  - "earlier searches for this register (\"First Nation\", \"Inuit\"): no real record, so no society named by the expectation can be located on a map from the museum's holdings"
- code: B1.1
