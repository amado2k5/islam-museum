- code: A3.1
  text: describe the evolution of dance and performance as different groups of people have responded to external factors such as migration, a new environment, and/or contact with other groups or cultures […]
  why: The expectation asks about the evolution of dance forms among groups responding to migration and contact; the museum holds no record of a dance tradition and its history.
  searches:
  - 'find_entity.py "dance" "رقص" "whirling" "Sama": concept/sama is about hearing (sama'') and its rulings; concept/raqs-fiqh is a legal ruling on dancing; neither describes a dance tradition or its evolution'
  - 'find_entity.py "folk dance" "dabke" "Mevlevi" "whirling dervish": practice/sama-mawlawiyya is one line citing only Wikidata and does not call the whirling a dance; group/mawlawiyya is not a dance record'
