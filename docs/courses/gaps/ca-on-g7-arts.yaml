  - 'find_entity.py "dance" "رقص" "whirling" "Sama": concept/sama (hearing and its rulings) and concept/raqs-fiqh (a ruling) say nothing of identity or media'
  - 'find_entity.py "folk dance" "dabke" "Mevlevi" "whirling dervish": practice/sama-mawlawiyya is a one-line Wikidata record and says nothing of identity or media'
