- code: C1.2
  text: create and translate repeating and growing patterns using various representations, including tables of values and graphs
  why: The expectation asks the student to create, translate and extend patterns with tables, graphs and rules; the only pattern records say the patterns repeat and nothing more.
  searches: &id003
  - 'find_entity.py "geometric patterns" "الزخرفة الهندسية" "girih": concept/islamic-geometric-patterns and concept/girih, both taught in lesson c-1 under C1.1; their prose says only that the patterns repeat and gives no tables of values, graphs, pattern rules or growth'
  - 'second pass: grep -il "pattern" content/en/concept the first five hits are unrelated records (names of God, ayyam-al-arab, chahartaq, fann-al-ilqa); none seen describes creating, translating or predicting patterns'
- code: C1.3
  text: determine pattern rules and use them to extend patterns, make and justify predictions, and identify missing elements in repeating and growing patterns
  why: The expectation asks the student to create, translate and extend patterns with tables, graphs and rules; the only pattern records say the patterns repeat and nothing more.
  searches: *id003
- code: C1.4
  text: create and describe patterns to illustrate relationships among whole numbers and decimal tenths
  why: The expectation asks the student to create, translate and extend patterns with tables, graphs and rules; the only pattern records say the patterns repeat and nothing more.
  searches: *id003
- code: C2.3
  text: solve inequalities that involve addition and subtraction of whole numbers up to 20, and verify and graph the solutions
  why: The expectation is about solving and graphing inequalities; the algebra records cover equations only.
  searches:
  - 'find_entity.py "algebra" "الجبر" "al-jabr": concept/algebra, invention/algebra and work/al-jabr-wal-muqabala exist; invention/algebra is taught in lesson c-2 under C2.1 and C2.2 and its prose treats equations (six types), not inequalities'
  - 'second pass: the algebra records say nothing of inequalities, of verifying them or of graphing a solution set'
- code: C3.1
  text: solve problems and create computational representations of mathematical situations by writing and executing code, including code that involves sequential, concurrent, repeating, and nested events
  why: The expectation is about writing and altering code; the museum holds no record on coding, and records on automata do not support it.
  searches: &id004
  - 'find_entity.py "Python" "programming" "البرمجة" "computer" "الحاسوب" "code": 3 real records, none about coding (a fatwa on discount codes, a knightly code, a workshop source)'
  - 'find_entity.py "programmable" "automaton" "الآلات" "Banu Musa automata" "كتاب الحيل": invention/jazari-musical-boat and work/turuq-saniyya-taqi exist, but a record on automata does not support an expectation about writing or altering code with sequential, concurrent, repeating or nested events; work/kitab-al-hiyal is a stub'
- code: C3.2
  text: read and alter existing code, including code that involves sequential, concurrent, repeating, and nested events, and describe how changes to the code affect the outcomes
  why: The expectation is about writing and altering code; the museum holds no record on coding, and records on automata do not support it.
  searches: *id004
- code: D1.1
  text: describe the difference between qualitative and quantitative data, and describe situations where each would be used
  why: The expectation is about collecting, graphing and analysing data; the museum holds no record on data handling.
  searches: &id005
  - 'find_entity.py "bar graph" "الرسم البياني" "table" "chart" "mean" "المتوسط": 43 real records, none about graphs or averages of data (hits are album-chart awards, a sea, invention/battani-sine-table-methods which is a trigonometric table)'
  - 'find_entity.py "probability" "الاحتمال" "statistics" "الإحصاء": event/abbasid-census-200 and event/egypt-census-837 are headcounts; neither records collecting, organising or graphing data for a question of interest'
