course: course/ca-on-g4-math
gaps:
- code: B1.2
  text: compare and order whole numbers up to and including 10 000, in various contexts
  why: The fleet review found that no record in the museum compares, orders or rounds numbers; the only record on whole numbers (invention/algorism) gives place value up to thousands.
  searches:
  - 'invention/algorism is taught in lesson b-1 under B1.1; its prose states place value (units, tens, hundreds, thousands) and says nothing of comparing, ordering or rounding'
  - 'find_entity.py "rounding" "تقريب" "compare numbers" "المقارنة بين الأعداد": 17 real records, none about numbers (hits are the word taqrib in hadith-science titles and approximate dates)'
- code: B1.3
  text: round whole numbers to the nearest ten, hundred, or thousand, in various contexts
  why: The fleet review found that no record in the museum compares, orders or rounds numbers; the only record on whole numbers (invention/algorism) gives place value up to thousands.
  searches:
  - 'invention/algorism is taught in lesson b-1 under B1.1; its prose states place value (units, tens, hundreds, thousands) and says nothing of comparing, ordering or rounding'
  - 'find_entity.py "rounding" "تقريب" "compare numbers" "المقارنة بين الأعداد": 17 real records, none about numbers (hits are the word taqrib in hadith-science titles and approximate dates)'
- code: B1.4
  text: represent fractions from halves to tenths using drawings, tools, and standard fractional notation, and explain the meanings of the denominator and the numerator
  why: The expectation is about fractions from halves to tenths (representing, fair shares, counting, repeated addition of a unit fraction); no record supports it, and the one record that mentions a half is already taught under decimal tenths.
  searches: &id001
  - 'find_entity.py "fractions" "الكسور" "inheritance shares" "الفرائض": 23 real records, none about fractions; concept/ilm-al-faraid and passage/muwatta-kitab-13-faraid are about who inherits, and concept/ilm-al-faraid prose states no fraction of a whole'
  - 'second pass: invention/decimal-fractions-al-uqlidisi speaks of a half as five tenths and is taught in lesson b-2 under B1.7 to B1.9; it does not represent fractions from halves to tenths, count by fractions or run fair-share scenarios'
- code: B1.5
  text: use drawings and models to represent, compare, and order fractions representing the individual portions that result from two different fair-share scenarios involving any combination of 2, 3, 4, 5, 6, 8, and 10 sharers
  why: The expectation is about fractions from halves to tenths (representing, fair shares, counting, repeated addition of a unit fraction); no record supports it, and the one record that mentions a half is already taught under decimal tenths.
  searches: *id001
- code: B1.6
  text: count to 10 by halves, thirds, fourths, fifths, sixths, eighths, and tenths, with and without the use of tools
  why: The expectation is about fractions from halves to tenths (representing, fair shares, counting, repeated addition of a unit fraction); no record supports it, and the one record that mentions a half is already taught under decimal tenths.
  searches: *id001
- code: B1.8
  text: round decimal numbers to the nearest whole number, in various contexts
  why: The fleet review found that no record rounds decimals to a whole number; invention/decimal-fractions-al-uqlidisi writes a half as five tenths and half of that as twenty-five hundredths and does not round.
  searches:
  - 'invention/decimal-fractions-al-uqlidisi is taught in lesson b-2 under B1.7 and B1.9; it shows decimal tenths and hundredths and says nothing of rounding to a whole number'
  - 'find_entity.py "rounding" "تقريب" "compare numbers" "المقارنة بين الأعداد": 17 real records, none about rounding numbers'
- code: B2.1
  text: use the properties of operations, and the relationships between addition, subtraction, multiplication, and division, to solve problems involving whole numbers, including those requiring more than one operation, and check calculations
  why: The expectation is about properties of operations, multiplication facts, mental strategies or rates; the museum holds no record on any of them.
  searches: &id002
  - 'find_entity.py "multiplication" "الضرب" "multiplication table" "جدول الضرب": 12 real records, none about multiplication facts (hits are the mint, دار الضرب, and legal passages on striking)'
  - 'second pass: invention/algorism is taught in lesson b-3 under B2.4 to B2.6; it names the four operations in general and gives no multiplication facts, mental strategies, properties of operations or rates'
