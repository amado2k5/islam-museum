- code: D2.1
  text: use mathematical language, including the terms “impossible”, “unlikely”, “equally likely”, “likely”, and “certain”, to describe the likelihood of events happening, represent this likelihood on a probability line, and use it to make predictions and informed decisions
  why: The expectation is about describing the likelihood of events and the mean, median and mode; no record supports it honestly.
  searches: &id006
  - 'find_entity.py "likelihood" "chance" "الاحتمال" "certain" "يقين": concept/yaqin-fiqh and concept/al-yaqin are about certainty in law and belief; concept/maysir and concept/nard are about games of chance and rulings on them'
  - 'second pass: considered and rejected; a lesson on describing likelihood in mathematical terms should not rest on a ruling about gambling, and no record describes impossible, unlikely, likely or certain events in that sense'
- code: D2.2
  text: make and test predictions about the likelihood that the mean, median, and mode(s) of a data set will be the same for data collected from different populations
  why: The expectation is about describing the likelihood of events and the mean, median and mode; no record supports it honestly.
  searches: *id006
- code: E1.1
  text: identify geometric properties of rectangles, including the number of right angles, parallel and perpendicular sides, and lines of symmetry
  why: The expectation is about properties of rectangles, translations and reflections; the museum holds no geometry record at this level.
  searches: &id007
  - 'find_entity.py "rectangle" "المستطيل" "reflection" "الانعكاس" "translation" "الانسحاب": 102 real records, none of geometry (concept/inikas and concept/insihab are terms of legal method; the rest are about reflection on the Qur''an or translation circles)'
  - 'find_entity.py "angle" "الزاوية" "geometry" "الهندسة" "Euclid" "إقليدس": person/uqlidis exists; invention/khayyam-parallel-quadrilateral concerns parallels in a theory far above Grade 4 and describes no rectangle, line of symmetry, or grid movement'
- code: E1.2
  text: plot and read coordinates in the first quadrant of a Cartesian plane, and describe the translations that move a point from one coordinate to another
  why: The expectation is about plotting and reading coordinates in the first quadrant; the museum holds no record on the Cartesian plane.
  searches:
  - 'find_entity.py "coordinates" "latitude" "خطوط الطول" "map": invention/tabula-rogeriana and map media exist; none describes a Cartesian plane or plotting a point from two coordinates'
  - 'second pass: grep -il "coordinate" over content/en/invention the first three hits (abu-wafa-fixed-opening-constructions, al-biruni-earth-radius, biruni-ghazna-qibla-setting-out) are geodesy or construction at a level far above the expectation'
- code: E1.3
  text: describe and perform translations and reflections on a grid, and predict the results of these transformations
  why: The expectation is about properties of rectangles, translations and reflections; the museum holds no geometry record at this level.
  searches: *id007
- code: E2.1
  text: explain the relationships between grams and kilograms as metric units of mass, and between litres and millilitres as metric units of capacity, and use benchmarks for these units to estimate mass and capacity
  why: The expectation is about metric units of mass, capacity and length and their prefixes; the museum holds no record on them.
  searches: &id008
  - 'find_entity.py "kilogram" "gram" "litre" "الكيلوغرام" "الغرام" "metric": 12 real records, none on metric units (work/shifa-al-gharam matches only the letters)'
  - 'find_entity.py "weights and measures" "الأوزان والمكاييل" "sa''" "mudd": concept/saa and concept/measure-sa describe a legal measure of dry goods, not metric mass or capacity, prefixes or tools'
- code: E2.2
  text: use metric prefixes to describe the relative size of different metric units, and choose appropriate units and tools to measure length, mass, and capacity
  why: The expectation is about metric units of mass, capacity and length and their prefixes; the museum holds no record on them.
  searches: *id008
- code: E2.3
  text: solve problems involving elapsed time by applying the relationships between different units of time
  why: The expectation is about solving elapsed-time problems; the museum holds no record on computing time.
  searches:
  - 'find_entity.py "elapsed time" "calendar" "التقويم" "hour" "الساعة" "clock": 70 real records; the hits are the Hour of the Last Day and the Friday hour, not time measurement'
  - 'find_entity.py "prayer times" "مواقيت الصلاة" "astrolabe" "الإسطرلاب": passage/muwatta-1-001 gives the times of prayer as a hadith; no record computes elapsed time between units'
- code: E2.4
  text: identify angles and classify them as right, straight, acute, or obtuse
  why: The expectation is about identifying and classifying angles; the museum holds no record on angles at this level.
  searches:
  - 'find_entity.py "angle" "الزاوية" "geometry" "الهندسة" "Euclid" "إقليدس": no record that identifies or classifies right, straight, acute or obtuse angles'
  - 'find_entity.py "rectangle" "المستطيل" "reflection" "الانعكاس" "translation" "الانسحاب": no geometry record'
- code: E2.6
  text: apply the formula for the area of a rectangle to find the unknown measurement when given two of the three
  why: The expectation is about applying the rectangle formula to find an unknown side; the only area record gives unit squares and other shapes, not this rule.
  searches:
  - concept/ilm-al-misaha is taught in lesson e-1 under E2.5; its rules cover squares, triangles, circles and solids and give no rule for finding an unknown side of a rectangle from its area and one side
  - 'find_entity.py "area" "المساحة" "surveying" "measurement": invention/kashi-muqarnas-mensuration measures the surfaces of a ceiling, not rectangles; event/khuzayma-land-survey and event/umar-ibn-hubayra-survey are land surveys with no formula'
- code: F1.1
  text: identify various methods of payment that can be used to purchase goods and services
  why: The expectation is about methods of payment; the museum holds no record on how goods are paid for.
  searches:
  - 'find_entity.py "dirham" "درهم" "dinar" "دينار" "coin": 104 real records; event/hajjaj-mint-reform is about striking coin and its inscriptions, not about how a buyer pays; person/dinar is a person named Dinar'
  - 'find_entity.py "payment" "currency" "العملة" "credit" "الدين" "loan" "القرض": 1,548 real records by loose word match, none on methods of payment for goods and services'
- code: F1.2
  text: estimate and calculate the cost of transactions involving multiple items priced in whole-dollar amounts, not including sales tax, and the amount of change needed when payment is made in cash, using mental math
  why: The expectation is about calculating the cost of transactions and change; the museum holds no record on it.
  searches:
  - 'find_entity.py "dirham" "درهم" "dinar" "دينار" "coin": no record on pricing items or computing totals and change'
  - 'find_entity.py "price" "السعر" "fair price" "تسعير" "market" "سوق": concept/tasir-price-fixing and place/essouk exist; neither shows a buyer calculating the cost of several items or change due'
- code: F1.4
  text: explain the relationship between spending and saving, and describe how spending and saving behaviours may differ from one person to another
  why: The expectation is about the relationship between spending and saving; the saving record does not compare them.
  searches:
  - concept/idkhar-fiqh is taught in lesson f-1 under F1.3; it treats saving by individuals and the state, and says nothing of how spending and saving relate or differ between people
  - 'find_entity.py "saving" "الادخار" "investment" "الاستثمار" "earning" "الكسب": concept/kasb, concept/idkhar-fiqh and passages on lawful earning exist; no record contrasts spending and saving behaviour'
- code: F1.5
  text: describe some ways of determining whether something is reasonably priced and therefore a good purchase
  why: The expectation is about judging whether a price is reasonable; the price records are about legal price-fixing and market supervision.
  searches:
  - 'find_entity.py "price" "السعر" "fair price" "تسعير" "market" "سوق": concept/tasir-price-fixing is about a ruler fixing prices and compelling sale, a legal ruling and not a way a shopper judges whether a price is reasonable'
  - 'considered and rejected: invention/hisba (an overseer of markets and weights) because it concerns market supervision, not a buyer''s judgement of value'
