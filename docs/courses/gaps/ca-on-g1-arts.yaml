- code: A3.1
  text: describe, with teacher guidance, a variety of dances from different communities around the world that they have seen in the media, at live performances and social gatherings, or in the classroom […]
  why: Asks the student to describe dances from different communities; the only record tried, practice/sama-mawlawiyya, is one Wikidata-only sentence about a session of listening to remembrance with the whirling of the Mevlevi dervishes, never calls it a dance, and its "best-known Sufi ritual" is an unattributed superlative.
  searches:
  - 'practice/sama-mawlawiyya: one sentence citing only Wikidata; it says whirling, never dance, and carries an unattributed superlative'
  - 'find_entity.py "dance" "رقص": concept/raqs-fiqh (a ruling on dancing) and two films (screen/raqs-al-bismil-2020, screen/raqis-al-sahra-2014); no record of a dance of a community'
- code: A3.2
  text: identify and describe dance experiences in their own lives and communities […]
  why: Asks the student to identify dance experiences in their own life and community; the object is the student's own experience, and the museum holds no record of a dance at weddings or celebrations.
  searches:
  - 'find_entity.py "dance" "رقص" "Mawlawi" "whirling" "سماع": concept/raqs-fiqh (rulings on dancing) and practice/sama-mawlawiyya, tried for A3.1 and removed (it is not called a dance); it is not the student''s own experience either'
  - 'find_entity.py "folk dance" "رقصة" "celebration" "احتفال": only practice/mawlid-al-nabi, a commemoration, not a dance'
- code: B1.1
