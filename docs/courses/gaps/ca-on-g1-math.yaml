- code: E2.1
  text: identify measurable attributes of two-dimensional shapes and three-dimensional objects, including length, area, mass, capacity, and angle
  why: The expectation is about naming measurable attributes (length, area, mass, capacity, angle) and comparing everyday objects; concept/mizan is the law of weights and measures (cheating in weight) and the measurement inventions are scholarly, so none serves a Grade 1 class.
  searches: &id009
