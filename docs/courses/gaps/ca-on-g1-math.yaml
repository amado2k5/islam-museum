course: course/ca-on-g1-math
gaps:
- code: B1.1
  text: "read and represent whole numbers up to and including 50, and describe various ways they are used in everyday life"
  why: "Reading and showing whole numbers to 50 is a Grade 1 counting task; the only number record (invention/algorism) is a history of Indian numerals and place value to thousands, far above a six-year-old and silent on reading or showing numbers."
  searches:
  - "find_entity.py \"counting\" \"العد\" \"numerals\": no record on reading or showing numbers to 50; invention/algorism was tried and removed (history of Indian numerals and place value to thousands, far above Grade 1)"
  - "entity_brief.py invention/algorism --full: says how numerals are written by place, nothing about reading, representing or using numbers to 50"
- code: B1.2
  text: "compose and decompose whole numbers up to and including 50, using a variety of tools and strategies, in various contexts"
  why: "Composing and decomposing numbers to 50 is a Grade 1 counting task; invention/algorism says nothing of putting numbers together or taking them apart and is far above a six-year-old."
  searches:
  - "find_entity.py \"counting\" \"العد\" \"numerals\": no record on composing or decomposing numbers; invention/algorism was tried and removed"
  - "entity_brief.py invention/algorism --full: no sentence on putting numbers together or taking them apart"
- code: B1.3
  text: compare and order whole numbers up to and including 50, in various contexts
  why: The expectation is about comparing and ordering, estimating and skip-counting whole numbers up to 50; the one number record (invention/algorism) says how numerals are written and nothing about these skills.
  searches: &id001
  - 'find_entity.py "counting" "العد" "hisab": concept/al-hisab is the Reckoning on the Day of Judgement and the rest are hadith passages; no record on counting, comparing or ordering numbers'
  - 'find_entity.py "mathematics" "الرياضيات" "arithmetic": invention/algorism (offered for B1.1, B1.2, B2.1, B2.4, C3.1 and C3.2 and removed after the fleet review as not fitting) and later arithmetic works; none concerns this expectation'
- code: B1.4
  text: estimate the number of objects in collections of up to 50, and verify their estimates by counting
  why: The expectation is about comparing and ordering, estimating and skip-counting whole numbers up to 50; the one number record (invention/algorism) says how numerals are written and nothing about these skills.
  searches: *id001
- code: B1.5
  text: count to 50 by 1s, 2s, 5s, and 10s, using a variety of tools and strategies
  why: The expectation is about comparing and ordering, estimating and skip-counting whole numbers up to 50; the one number record (invention/algorism) says how numerals are written and nothing about these skills.
  searches: *id001
- code: B1.6
  text: use drawings to represent and solve fair-share problems that involve 2 and 4 sharers, respectively, and have remainders of 1 or 2
  why: The expectation is about drawing equal fair shares among 2, 4 or up to 10 sharers and comparing unit fractions; no record in the museum describes equal sharing or fractions of a whole in a way a Grade 1 class could use.
  searches: &id002
  - 'find_entity.py "fraction" "كسر" "half": concept/kasr is breaking in law (a fiqh term); the other hits are hadith passages and a battle; nothing about fractions of a whole'
  - 'find_entity.py "fair division" "قسمة" "sharing": events about dividing spoils, a realm and a caliphate among rulers and a book of profit-sharing; no equal-sharing problem a child could draw'
  - 'find_entity.py "inheritance" "الميراث" "faraid": concept/mirath and concept/ilm-al-faraid exist; they record the law of inheritance shares, not the equal sharing among 2 or 4 that the expectation draws'
- code: B1.7
  text: recognize that one half and two fourths of the same whole are equal, in fair-sharing contexts
  why: The expectation is about drawing equal fair shares among 2, 4 or up to 10 sharers and comparing unit fractions; no record in the museum describes equal sharing or fractions of a whole in a way a Grade 1 class could use.
  searches: *id002
- code: B1.8
  text: use drawings to compare and order unit fractions representing the individual portions that result when a whole is shared by different numbers of sharers, up to a maximum of 10
  why: The expectation is about drawing equal fair shares among 2, 4 or up to 10 sharers and comparing unit fractions; no record in the museum describes equal sharing or fractions of a whole in a way a Grade 1 class could use.
