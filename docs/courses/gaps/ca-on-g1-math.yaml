- code: F1.1
  text: identify the various Canadian coins up to 50¢ and coins and bills up to $50, and compare their values
  why: The expectation is about identifying Canadian coins and bills and comparing their values; the museum holds records on early Islamic coinage (Abd al-Malik's dinars and dirhams), not on Canadian currency.
  searches:
  - 'find_entity.py "coin" "عملة" "sikka": only hadith passages, a fatwa on a cancelled currency and records on early Islamic coinage; no Canadian currency'
  - 'find_entity.py "currency" "نقود" "money": concept/al-nuqud and records on Abd al-Malik''s coinage and Khwarazm coinage; none is Canadian'
