- code: B2.1
  text: "use the properties of addition and subtraction, and the relationship between addition and subtraction, to solve problems and check calculations"
  why: "The expectation asks for the properties of addition and subtraction and the relation between them; invention/algorism holds only Ibn Khaldun's definition of the four operations, not their properties or inverse relation, and drags in multiplication and division."
  searches:
  - "entity_brief.py invention/algorism --full: Ibn Khaldun's definition of joining and separating (and of multiplication and division); no properties of addition and subtraction, no inverse relation"
  - "find_entity.py \"addition\" \"الجمع\" \"subtraction\": no record that states a property of addition or subtraction"
- code: B2.2
  text: recall and demonstrate addition facts for numbers up to 10, and related subtraction facts
  why: The expectation is about recalling addition and subtraction facts to 10 and mental strategies to 20; invention/algorism shows written arithmetic but states no facts or mental strategies, so no honest link exists.
  searches: &id003
  - 'find_entity.py "mathematics" "الرياضيات" "arithmetic": invention/algorism (offered for B1.1, B1.2, B2.1, B2.4, C3.1 and C3.2 and removed after the fleet review as not fitting) and later arithmetic works; none concerns this expectation'
  - 'find_entity.py "counting" "العد" "hisab": concept/al-hisab is the Reckoning on the Day of Judgement and the rest are hadith passages; no record on counting, comparing or ordering numbers'
- code: B2.3
  text: use mental math strategies, including estimation, to add and subtract whole numbers that add up to no more than 20, and explain the strategies used
  why: The expectation is about recalling addition and subtraction facts to 10 and mental strategies to 20; invention/algorism shows written arithmetic but states no facts or mental strategies, so no honest link exists.
  searches: *id003
- code: B2.4
  text: "use objects, diagrams, and equations to represent, describe, and solve situations involving addition and subtraction of whole numbers that add up to no more than 50"
  why: "The expectation asks for modelling situations of adding and subtracting to 50 with objects, diagrams and equations; invention/algorism offers only a definition of the operations and no situation to model."
  searches:
  - "entity_brief.py invention/algorism --full: a definition of the operations, no situation to model with objects, diagrams or equations"
  - "find_entity.py \"addition\" \"الجمع\" \"subtraction\": no record that describes a situation of adding or taking away"
- code: B2.5
  text: represent and solve equal-group problems where the total number of items is no more than 10, including problems in which each group is a half, using tools and drawings
  why: The expectation is about equal-group problems with a total of no more than 10, including halves; Ibn Khaldun in invention/algorism names joining by multiples as multiplication, but nothing in the museum shows equal groups or halves of small totals.
  searches:
  - 'find_entity.py "mathematics" "الرياضيات" "arithmetic": invention/algorism (offered for B1.1, B1.2, B2.1, B2.4, C3.1 and C3.2 and removed after the fleet review as not fitting) and later arithmetic works; none concerns this expectation'
  - 'find_entity.py "fraction" "كسر" "half": concept/kasr is breaking in law (a fiqh term); the other hits are hadith passages and a battle; nothing about fractions of a whole'
- code: C1.1
  text: "identify and describe the regularities in a variety of patterns, including patterns found in real-life contexts"
  why: "The expectation asks for the regularities in patterns; the only pattern record that survives the review (concept/arabesque) gives shapes to make a pattern from, not a repeating unit or a regularity to describe."
  searches:
  - "entity_brief.py concept/arabesque --full: names the shapes in the networks (circles, triangles, squares) but not a regularity or repeating unit"
  - "entity_brief.py concept/islamic-geometric-patterns --full: one sentence saying repeated patterns exist; no repeating unit or regularity"
- code: C1.3
  text: "determine pattern rules and use them to extend patterns, make and justify predictions, and identify missing elements in patterns"
  why: "The expectation asks for pattern rules, predictions and missing elements; concept/arabesque holds no repeating unit, rule or missing element to determine."
  searches:
  - "entity_brief.py concept/arabesque --full: no pattern rule, prediction or missing element"
  - "entity_brief.py concept/islamic-geometric-patterns --full: one sentence; no rule to determine or extend"
- code: C1.4
  text: create and describe patterns to illustrate relationships among whole numbers up to 50
  why: The expectation is about patterns that show relationships among whole numbers up to 50; the pattern records the museum holds (arabesque, taught in lesson c-1, gives shapes for C1.2) are patterns of shapes, not of numbers.
  searches:
  - 'find_entity.py "pattern" "نمط" "tessellation": only hits unrelated to number patterns (a poem, a hadith passage, a cursive script) besides the art records used in lesson c-1'
  - 'find_entity.py "mathematics" "الرياضيات" "arithmetic": invention/algorism (offered for B1.1, B1.2, B2.1, B2.4, C3.1 and C3.2 and removed after the fleet review as not fitting) and later arithmetic works; none concerns this expectation'
- code: C2.1
  text: identify quantities that can change and quantities that always remain the same in real-life contexts
  why: The expectation is about what changes and what stays the same, and about equivalent addition and subtraction expressions; the museum holds invention/algebra and concept/al-durub-al-sitta (equations of al-Khwarizmi), which are far above Grade 1 equality, and the calendar record taught in e-1 says nothing about quantities that stay the same.
  searches: &id004
  - 'find_entity.py "mathematics" "الرياضيات" "arithmetic": invention/algorism (offered for B1.1, B1.2, B2.1, B2.4, C3.1 and C3.2 and removed after the fleet review as not fitting) and later arithmetic works; none concerns this expectation'
  - 'find_entity.py "seasons" "الفصول" "lunar": the lunar and crescent records are taught or related only under E2.3 in lesson e-1; none speaks of quantities that change or stay the same'
