  searches:
  - 'find_entity.py "dance" "رقص" "sama": no record on a dance tradition; concept/raqs-fiqh is a legal ruling'
  - 'find_entity.py "folk dance" "رقصة" "Mevlevi whirling": practice/sama-mawlawiyya says nothing of the role of dance in a community'
