  searches:
  - 'find_entity.py "storytelling" "حكواتي" "folk tale" "fairy tale": no real record'
  - 'find_entity.py "drama" "مسرح" "puppet theatre" "shadow play": no drama work record; concept/ashik and work/alpamish are recited poetry and were not stretched into drama'
