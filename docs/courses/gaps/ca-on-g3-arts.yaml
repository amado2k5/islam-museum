- code: A3.1
  text: describe, with teacher guidance, a variety of dances from communities in Canada and around the world that they have seen in the media, at live performances and social gatherings, or in the classroom […]
  why: Asks for dances from communities in Canada and around the world seen in media, performances or gatherings; the museum holds no record of a dance form it can describe as dance.
  searches:
  - 'find_entity.py "dance" "رقص" "sama": raqs-fiqh is a ruling on dancing, not a dance form; concept/sama is about listening, and the Mevlevi record is not called dance in its prose'
  - 'find_entity.py "folk dance" "رقصة" "Mevlevi whirling": only practice/sama-mawlawiyya, one line citing Wikidata alone, which never calls it dance'
- code: A3.2
  text: identify and describe the role of dance in the community […]
