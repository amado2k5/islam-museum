- code: B3.1
  text: identify some distinct stylistic features of a few drama and theatre forms they experience in their home, school, and community, and in the media […]
  why: Asks for stylistic features of drama and theatre forms such as puppet shows, mask plays, street festivals and clown acts; the museum holds no record on a staged drama or theatre form.
  searches:
  - 'find_entity.py "drama" "مسرح" "puppet theatre" "shadow play": place/drama (a town), person/mirza-fath-ali-akhundzada (a dramatist with no record of a theatre form); no puppet or shadow theatre record'
  - 'find_entity.py "mask" "festival" "ceremony" "مهرجان": festival records are about observances and a music festival, none about a theatre form'
- code: B3.2
