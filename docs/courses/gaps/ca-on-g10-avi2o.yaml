- code: B2.3
  text: identify and describe ways in which creating and/or analysing art works has affected their personal identity and values […]
  why: The expectation is about how the student's own making and analysing changed their identity and values; the museum holds no record on that.
  searches:
  - 'find_entity.py "portrait" "تصوير" "self-portrait" "figurative art": concept/tasweer-images-and-picturing is a record on the view of picturing living beings, not on a student''s identity or values'
  - 'find_entity.py "colour" "لون" "colour theory": records on legal colour (lawn-fiqh) and ceramics; none on a maker''s self-concept or stereotypes'
- code: B3.3
  text: describe, on the basis of exploration, a variety of personal opportunities in their community in cultural or other fields related to visual arts […]
  why: The expectation asks for the student's own exploration of opportunities in their community; the museum holds no record on local arts opportunities in Ontario.
  searches:
  - 'find_entity.py "exhibition" "معرض" "gallery" "museum display": two source records (a gallery biography, a mosque photo-exhibition catalogue) and a person named Abu Mu''arrid; no record on community arts opportunities'
  - 'find_entity.py "apprentice" "حرفة" "guild" "craft training": concept/hirfa-crafts is a set of fiqh rulings on crafts and concept/akhi-baba a guild title; neither speaks of community opportunities'
- code: C1.3
