  - 'none: skills expectation'
- code: C3.1
  text: identify legal and ethical issues associated with visual arts […], and demonstrate legal and ethical practices when creating, presenting, and/or promoting art works […]
  why: The expectation is about copyright, ownership and cultural sensitivity in the student's own art; the one record found concerns the rights of research works after the author's death, not visual arts.
  searches:
  - 'find_entity.py "copyright" "حقوق النشر" "intellectual property" "plagiarism": one record, work/fatwa-dar-alifta-intellectual-property-of-research-after-death, about research works, not visual art'
  - 'grep -rli "copyright" content/en/concept content/en/job content/en/work: only source-note mentions in works, no record on art copyright or cultural sensitivity'
- code: C3.2
  text: demonstrate an understanding of safe and conscientious practices associated with the use of materials, tools, and technologies in visual arts, and apply these practices when creating and/or presenting art works […]
  why: The expectation is about safe practice with materials and tools in the studio; the museum holds no record on studio safety.
  searches:
  - 'find_entity.py "safety" "سلامة" "hazard" "toxic": names containing Salama and Muwatta passages, no record on hazardous materials or tools'
  - 'grep -rli "toxic" content/en/concept: only fiqh concepts (ikhala, naqi, takhlil) and no art materials'
- code: C3.3
  text: demonstrate an understanding of how the production and presentation of art works can affect the environment, and apply environmentally responsible practices when creating and presenting art works […]
  why: The expectation is about the environmental effect of making and showing art; the one related record is a writer's reading of pollution and the Islamic view, with nothing on art materials.
  searches:
  - 'find_entity.py "environment" "بيئة" "recycl" "waste": concept/environmental-protection-in-islam gives an author''s reading on pollution; it does not speak of art materials'
  - 'grep -rli "recycl" content/en/concept content/en/work: concept/andalusi-lead-glass and fatwa records on water; none on recycled or hazardous art materials'
