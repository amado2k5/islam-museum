- code: E1.4
  text: describe how major historical events and movements have shaped the daily practices of various religions and belief traditions […]
  why: The only record tried for the change of the direction of prayer was withdrawn after the reviewer found hostile language about a religious group in it, so no remaining record serves this expectation.
  searches:
  - 'find_entity.py "qibla" "قبلة" "change of direction": event/change-of-qibla, withdrawn from every lesson because its text uses hostile language about Jews in the record''s own voice'
  - 'practice/salah and passage/quran-4-103 checked: they give the prayer and a verse on its times, not a historical event that changed the practice'
- code: E2.4
  text: describe how major historical events and movements have shaped the rituals of various religions and belief traditions […]
  why: The only record tried for an event that shaped a practice, the change of the qibla, was withdrawn for hostile language about a religious group, so nothing remaining serves this expectation.
  searches:
  - 'find_entity.py "qibla" "قبلة": event/change-of-qibla, withdrawn from every lesson (hostile language about Jews in the record''s own voice)'
  - 'practice/salah: gives the prayer''s origin in the Isra and its five times, not a later event that shaped it'
- code: D1.1
  text: explain the concept of the supernatural and the role of entities associated with it in various religions and belief traditions […]
  why: The one record that served it, the angels, was withdrawn as a precaution (it carries a preacher's remark contrasting the Companions with "the Children of Israel"), and no remaining record names entities of the supernatural.
  searches:
  - 'concept/malaika: withdrawn from these lessons; a student who opens the record reads the remark, and the founder may restore the link'
  - 'concept/tawhid and concept/five-pillars checked: they state beliefs and acts, not the role of beings associated with the supernatural'
- code: E2.5
  text: explain how key teachings of various religions and belief systems are reflected in their rites of passage […]
  why: The only record tried, the marriage contract, gives the schools' legal definitions of a contract and does not describe a rite of passage or the teaching it carries.
  searches:
  - 'find_entity.py "nikah" "marriage" "زواج": practice/nikah gives juristic definitions of the contract (Hanafi and Shafi''i wordings), not a rite or the teaching it carries, and the Hanafi wording is a legal formula about a woman that a card cannot present without a named jurist'
  - 'find_entity.py "rite of passage" "birth" "coming of age": practice/aqiqa, a birth rite, exists in the museum; it is not linked from this course and the reviewer did not propose it for E2.5'
