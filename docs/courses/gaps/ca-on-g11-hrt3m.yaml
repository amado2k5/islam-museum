- code: B1.1
  text: identify diverse religions and belief traditions that are found in Canada […]
  why: Asks the student to identify the religions found in Canada; the museum holds no record on Canada's religious makeup or on those traditions.
  searches:
  - 'find_entity.py "Muslims in Canada" "مسلمو كندا" "Canadian Muslims": two source records (Muslims in Canada Archives; a National Council of Canadian Muslims press-release source) and no entity record'
  - 'find_entity.py "Christianity" "نصرانية" "Judaism" "اليهودية": Muwatta passages and place/al-yahudiyya, a town; no record on those traditions'
  - 'find_entity.py "Hinduism" "هندوسية" "Buddhism" "Sikh": no entity record of those traditions (one Sikh-related event and two sources)'
- code: B1.2
  text: identify reasons for the study of world religions and belief traditions […]
  why: Asks for reasons for the study of world religions; the museum holds no record on the study of religions.
  searches:
  - 'find_entity.py "comparative religion" "مقارنة الأديان" "study of religions": one YouTube channel source only, no entity record'
  - 'find_entity.py "religious diversity" "تعدد الأديان" "pluralism": one source record on Bosnian religious leaders, no entity record'
- code: B1.3
  text: identify and describe local and global contexts in which it is important to have an understanding of diverse religions and belief traditions
  why: Asks for local and global contexts in which understanding diverse religions matters; the museum holds no record on this.
  searches:
  - 'find_entity.py "religious diversity" "تعدد الأديان" "pluralism": one source record on Bosnian religious leaders, no entity record'
  - 'find_entity.py "Muslims in Canada" "مسلمو كندا" "Canadian Muslims": two source records (Muslims in Canada Archives; a National Council of Canadian Muslims press-release source) and no entity record'
- code: B2.1
  text: explain the various terms used to classify religions and belief traditions and the values implicit in these classifications […]
  why: Asks for the terms used to classify religions (sect, cult, denomination); the museum's nearest records classify Islamic legal schools, not religions.
  searches:
  - 'find_entity.py "sect" "فرقة" "denomination" "madhhab": concept/madhhab and the four legal schools, which classify Islamic law, not religions in general'
  - 'find_entity.py "polytheism" "شرك" "idolatry": concept/shirk is the Islamic term for associating partners with God; no record treats polytheism, pantheism or animism as study terms'
- code: B2.2
  text: define and appropriately use terms that relate to the study of world religions and belief traditions […]
  why: Asks for terms such as atheism, agnosticism, monotheism, pantheism, animism; the museum has the Islamic term shirk only, not these study terms.
  searches:
  - 'find_entity.py "atheism" "إلحاد" "agnosticism": six records, none about atheism or agnosticism (Muwatta passages matched other words)'
  - 'find_entity.py "polytheism" "شرك" "idolatry": concept/shirk is the Islamic term for associating partners with God; no record treats polytheism, pantheism or animism as study terms'
- code: B2.3
