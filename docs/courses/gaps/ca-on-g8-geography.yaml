- code: B3.2
  text: compare findings with respect to selected quality of life indicators in some developing and more developed countries […]
  why: The expectation asks the student to compare quality-of-life findings between developing and more developed countries; the museum holds no data of that kind.
  searches:
  - 'find_entity.py "developing country" "دول نامية" "development": the hits are unrelated (a leadership-training programme and a self-development concept)'
