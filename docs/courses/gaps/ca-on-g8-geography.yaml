- code: A3.1
  text: identify significant spatial patterns in human settlement on a global scale […]
  why: The expectation asks for spatial patterns in human settlement on a global scale (where people live); the museum holds no record on population distribution.
  searches:
  - 'find_entity.py "population distribution" "توزيع السكان" "demography": no real record'
  - 'find_entity.py "urbanization" "التحضر" "urban growth": no real record'
- code: A3.4
  text: identify and describe significant current trends in human settlement […]
  why: The expectation asks for significant current trends in human settlement; the museum holds no record on present-day trends.
  searches:
  - 'find_entity.py "urbanization" "التحضر" "urban growth": no real record'
  - 'find_entity.py "migration" "هجرة" "migrants": real records on the Hijra and the first migration to Abyssinia, which are events of the early community, not current trends in human settlement'
- code: A3.6
  text: describe some practices that individuals and communities have adopted to help make human settlements more sustainable […]
  why: The expectation asks for practices that make settlements more sustainable. concept/hima is a real record of a reserved pasture, but it does not say the reserve served conservation or sustainability, so the museum does not claim it.
  searches:
  - 'find_entity.py "sustainable community" "مجتمع مستدام" "sustainability": no real record'
  - 'find_entity.py "hima" "حمى" "conservation": concept/hima is a real record (a reserved pasture); it describes who may graze, not conservation'
  - 'find_entity.py "recycling" "إعادة التدوير" "environment": no usable record'
- code: A3.7
  text: demonstrate the ability to analyse and construct choropleth maps on topics related to human settlement […]
  why: 'Skills expectation (constructing and analysing choropleth maps): it names a mapping technique, not subject matter a record could carry.'
  searches: *id001
- code: B1.1
  text: analyse some interrelationships among factors that can contribute to quality of life […]
  why: The expectation asks for the factors that contribute to quality of life and how they interrelate; the museum holds no record on quality-of-life factors.
  searches:
  - 'find_entity.py "quality of life" "جودة الحياة" "well-being": no real record'
  - 'find_entity.py "life expectancy" "متوسط العمر" "literacy": no real record'
- code: B1.2
  text: analyse how various factors have affected the economies of specific developed and developing countries around the world […], and explain the interrelationship between these factors and quality of life in some of these countries […]
  why: The expectation asks for how factors have affected the economies of specific developed and developing countries today; the museum holds no record on these economies.
  searches:
  - 'find_entity.py "developing country" "دول نامية" "development": the hits are unrelated (a leadership-training programme and a self-development concept)'
  - 'find_entity.py "poverty" "الفقر" "inequality": concept/faqr is poverty in Sufi ethics, not the economy of a country'
- code: B1.3
  text: assess the effectiveness of various programs and policies aimed at improving the quality of life in various countries […]
  why: The expectation asks the student to assess the effectiveness of programmes and policies in various countries, which needs evidence of results. The records on zakat, waqf and the Adudi Bimaristan (lesson b-1, under B3.5) describe what an institution did, not how well it worked, so they cannot carry this expectation.
  searches:
  - 'find_entity.py "poverty relief" "مكافحة الفقر" "aid": concept/three-sources-of-economy (one author''s framework, marked unchecked in the record) and listing/ksrelief (a directory entry for a relief centre); neither assesses a programme or policy'
  - 'find_entity.py "United Nations" "الأمم المتحدة" "NGO": one source record on an observance day, nothing about programmes'
- code: B1.4
  text: assess the effectiveness of media in improving the quality of life in some countries/regions around the world […]
  why: The expectation asks for the effectiveness of media in improving quality of life; the museum holds no record on media campaigns.
  searches:
  - 'find_entity.py "media" "إعلام" "press": no record about media; the hits are a biographical dictionary and hadith passages'
  - 'find_entity.py "Red Crescent" "الهلال الأحمر" "humanitarian": directory entries for relief organisations, not media'
