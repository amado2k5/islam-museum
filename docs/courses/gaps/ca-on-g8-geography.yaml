course: course/ca-on-g8-geography
gaps:
- code: A1.3
  text: describe possible features of a sustainable community in the future […], and analyse some challenges associated with creating such a community […]
  why: The expectation asks the student to describe features of a sustainable community of the future and the challenges of creating one; no museum record describes a planned sustainable community, and none states that its subject served sustainability.
  searches:
  - 'find_entity.py "sustainable community" "مجتمع مستدام" "sustainability": no real record'
  - 'find_entity.py "recycling" "إعادة التدوير" "environment": no usable record (a fatwa on collecting plastic caps for charity and a Grade 6 lesson of this archive, neither about a sustainable community)'
  - 'find_entity.py "tree planting" "غرس" "زراعة الأشجار": no record about a community or its future; passage/muwatta-22-2166 is a hadith passage on reviving land'
