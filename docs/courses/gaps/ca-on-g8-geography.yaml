- code: B3.6
  text: identify different types of economic systems […], and describe their characteristics
  why: The expectation asks for types of economic systems and their characteristics; the museum holds no record that describes types of economic system.
  searches:
  - 'find_entity.py "economic system" "نظام اقتصادي" "economy": concept/al-iqtisad-fi-al-quran and concept/economy-as-moderation are ethical treatments of the economy, not accounts of types of economic system'
  - 'find_entity.py "riba" "ربا" "usury": concept/riba is a rule about interest, with prose in Arabic only, not a description of a type of economic system'
- code: B3.7
  text: explain how the four main economic sectors (i.e., primary, secondary, tertiary, and quaternary) are related to global development […]
  why: The expectation asks how the four economic sectors relate to global development; the museum holds no record that sets out the sectors or links them to development.
  searches:
  - 'find_entity.py "industry" "صناعة" "manufacturing": concept/crafts-in-islam is al-Maraghi on the ethics of crafts, not an account of economic sectors'
  - 'find_entity.py "agriculture" "farming" "فلاحة": concept/agriculture-in-islam is taught in lesson a-2 under A3.5; it does not relate sectors to one another or to development'
- code: B3.9
  text: describe the spatial distribution of wealth, both globally and within selected countries/regions […]
  why: The expectation asks for the spatial distribution of wealth, globally and within countries; the museum holds no record on it.
  searches:
  - 'find_entity.py "wealth" "ثروة" "distribution of wealth": concept/wealth-in-islam is one author''s ethical account of wealth, not a map of its distribution'
  - 'find_entity.py "inheritance" "ميراث" "mirath": concept/mirath is the law of inheritance shares, not a spatial distribution of wealth'
