- code: B2.5
  text: evaluate evidence and draw conclusions about issues related to the impact of natural resource extraction/harvesting and/or use around the world
  why: 'Skills expectation: names no subject matter.'
  searches: *id001
- code: B2.6
  text: communicate the results of their inquiries using appropriate vocabulary […] and formats appropriate for specific audiences […]
  why: 'Skills expectation: names no subject matter.'
