  text: analyse and construct maps as part of their investigations, with a particular focus on exploring the spatial boundaries of and, where applicable, patterns relating to their topics […]
  why: 'Skills expectation: names no subject matter.'
  searches: *id001
- code: B2.4
  text: interpret and analyse data and information relevant to their investigations, using various tools and spatial technologies […]
  why: 'Skills expectation: names no subject matter.'
