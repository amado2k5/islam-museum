- code: B3.1
  text: identify Earth’s renewable, non-renewable, and flow resources […], and explain their relationship to Earth’s physical features
  why: Asks the student to identify renewable, non-renewable and flow resources and relate them to physical features; the museum's nearest record lists resources without sorting them into those kinds.
  searches:
  - 'find_entity.py "natural resources" "الموارد الطبيعية" "renewable resources": only concept/al-mawarid-al-tabiiyya (prose in Arabic only), one author''s list of farm, mineral and animal resources, with no renewable, non-renewable or flow classification'
  - 'find_entity.py "renewable" "متجددة" "solar" "wind energy": hits are astronomy records on the sun; no record on energy resources'
- code: B3.3
  text: identify significant short- and long-term effects of natural resource extraction/harvesting and use on people and the environment […]
  why: Asks for the short- and long-term effects of extraction and use (deforestation, desertification, smog, acid rain, soil contamination, flooding); the museum holds no record of these effects of resource use.
  searches:
  - 'find_entity.py "pollution" "تلوث" "smog" "acid rain": no real record'
  - 'find_entity.py "deforestation" "إزالة الغابات" "soil erosion" "desertification": no real record'
- code: B3.4
  text: describe the perspectives of different groups […] regarding the use of the natural environment to meet human needs
  why: Asks for the perspectives of different groups (an indigenous community, an environmental organisation, a mining or forestry company, a resource town) on using the environment; the museum holds no record of such groups.
  searches:
  - 'find_entity.py "Indigenous" "السكان الأصليين" "First Nations" "Aboriginal": no real record'
  - 'find_entity.py "mine" "منجم" "معدن" "gold mine": no record on a mining or forestry company or a resource town'
- code: B3.6
  text: demonstrate the ability to extract information from, analyse, and construct GIS maps relating to natural resources around the world […]
  why: Asks the student to extract information from, analyse and construct GIS maps of natural resources; the museum holds no GIS data or record about one.
  searches:
  - 'find_entity.py "map" "خريطة" "GIS" "cartography": thirteen hits, none a GIS or thematic resource map (a twelfth-century world map, battle sketches, a star-mapping lesson)'
  - 'find_entity.py "hydroelectric" "كهرباء" "power plant": only the Grade 6 electricity lessons; no record of oil refineries or deforestation to map'
