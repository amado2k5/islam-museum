- code: A3.1
  text: describe, with teacher guidance, dance forms and styles that reflect the beliefs and traditions of diverse communities, times, and places […]
  why: 'The expectation asks for dance forms and styles that reflect the beliefs and traditions of diverse communities. The museum holds no record on a dance form or style: the only dance records are a legal ruling on dancing and a film title.'
  searches:
  - 'find_entity.py "dance" "رقص" "dabke": concept/raqs-fiqh is a ruling on dancing, not a dance form; screen/raqs-al-bismil-2020 is a title; no record on any dance form or style'
  - 'find_entity.py "Sema" "سماع" "whirling dervish" "Mevlevi": concept/sama is the legal and linguistic term for hearing, not a dance'
  - 'grep -ril -w "dance\|dancing" content/en/concept content/en/practice content/en/event: only raqs-fiqh, golconda-painting, ghurur, sadaqa-jariya and conquest-of-azerbaijan, none about a dance form'
- code: A3.2
  text: identify and describe some of the ways in which dance influences popular culture […]
  why: The expectation asks how dance influences popular culture. The museum holds no record on popular dance or on a dance's influence on fashion, magazines or music.
  searches:
  - 'find_entity.py "hip hop" "هيب هوب" "rap": no real record'
  - 'find_entity.py "dance" "رقص" "dabke": only a legal ruling on dancing and a film title, nothing on popular dance'
