- code: B3.1
  text: describe forms of process drama, theatre, storytelling, and visual representation from diverse communities around the world, and explain how they may reflect some beliefs and traditions of their communities […]
  why: The expectation asks for forms of drama, theatre, storytelling and visual representation from diverse communities and how they reflect beliefs and traditions. The museum holds no record on a theatre form; the maqama records name a literary genre but say nothing of performance or of a community's beliefs in it.
  searches:
  - 'find_entity.py "shadow play" "khayal al-zill" "خيال الظل": no real record'
  - 'find_entity.py "theatre" "مسرح" "drama": place/drama is a town in Greece; nothing on a theatre form'
  - 'find_entity.py "storytelling" "maqama" "hakawati": work/maqamat-badi-al-zaman and work/maqamat-al-hariri are books of a literary genre, not storytelling as performed'
- code: B3.2
  text: demonstrate an understanding of the broader world of drama and theatre by identifying and describing the roles and responsibilities of key theatre personnel […]
  why: The expectation asks for the roles of key theatre personnel (producer, director, stage manager, designers, technicians). The museum holds no record on the work of a theatre.
  searches:
  - 'find_entity.py "role play" "تمثيل" "actor": no record on theatre work; the hits are sources about film actors and an astronomy instrument'
  - 'find_entity.py "stage manager" "مخرج" "puppet" "karagoz": no record on theatre personnel'
  - 'find_entity.py "film" "سينما" "cinema": exhibits on national cinemas, none naming the roles of theatre personnel'
