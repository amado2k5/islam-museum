- code: C2.2
  text: demonstrate an understanding of a variety of conventions used in visual arts […]
  why: The expectation asks for the conventions of visual art (exaggeration, juxtaposition, metaphor, symbols, heroic, narrative and satirical works); no museum record teaches a convention of art, and concept/propaganda-coins, linked in lesson b-1 under B2.1, describes a coin type, not a convention.
  searches:
  - 'find_entity search "allegory" "convention" "exaggeration" "juxtaposition": no record on art conventions (convention matched only conference sources and banking or treaty records)'
  - 'find_entity search "metaphor" "symbol" "رمز" "satire": satire matched only verse-satire records (event/abu-al-mukhtar-satire, concept/hija-fiqh), which are poetry, not visual art'
- code: C3.1
  text: describe legal and ethical issues associated with the use of images, materials, and property (both physical and virtual) in the production of art works […], and demonstrate legal and ethical practices when creating, presenting, and/or promoting art works […]
  why: The expectation asks for the legal and ethical issues of using images and materials (copyright, intellectual property, cultural appropriation) and their practice; the museum holds no record on these in visual art. work/fatwa-dar-alifta-intellectual-property-of-research-after-death concerns a researcher's text, not images.
  searches:
  - 'find_entity search "copyright" "appropriation" "cultural appropriation" "plagiarism": appropriation matched only event/umar-sawafi, a person-linked event, not art'
  - 'find_entity search "intellectual property" "حقوق المؤلف" "citation" "الانتحال": matched only work/fatwa-dar-alifta-intellectual-property-of-research-after-death (research text) and unrelated records'
- code: C3.2
  text: demonstrate an understanding of safe and conscientious practices associated with the use of materials, property, tools, and technologies in visual arts, and apply these practices when creating and/or presenting art works […]
  why: The expectation asks for safe practice with materials, tools and technologies in the studio; the museum holds no record on studio safety.
  searches:
  - 'find_entity search "safety" "hazard" "toxic" "خطر": matched concept/khatar-fiqh (risk in jurisprudence), hadith passages and concept/muskir, none about studio safety'
  - 'find_entity search "precaution" "protective" "سلامة" "hazardous materials": matched only persons named Salama and concept/ihtiyat, no safety practice'
- code: C3.3
  text: demonstrate an understanding of how the production and presentation of art works can affect the environment, and apply environmentally responsible practices when creating, presenting, and promoting art works […]
  why: The expectation asks how making and showing art affects the environment and what responsible practice is; concept/environmental-protection-in-islam is about the environment in general, not art materials or display.
  searches:
  - 'find_entity search "environment" "البيئة" "pollution" "تلوث": matched concept/environmental-protection-in-islam (general) and an unrelated course record'
  - 'find_entity search "recycled" "sustainable" "waste" "carbon": matched concept/al-israf and fatwas on water waste and recycled sewage water, none about art'
