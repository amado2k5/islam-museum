- code: A2.1
  text: use a combination of elements and principles of design to create art works that express personal feelings and communicate specific emotions to an audience […]
  why: The expectation asks the student to use colour, line and the like in studio work to express emotion; no museum record is about emotion in art.
  searches:
  - 'find_entity search "emotion" "feeling" "العاطفة" "التعبير": no art record (التعبير matched only concept/tacbir-expressing-consent, dream-interpretation records and an unrelated person)'
  - 'find_entity search "expression" "mood" "harmony": matched only concept/rida-consent-fiqh and a diagram media record, neither about art'
- code: A2.2
  text: apply elements and principles of design as well as art-making conventions to create a variety of art works that explore and/or present a point of view on contemporary social issues and/or themes […]
  why: The expectation asks the student to make art that presents a point of view on contemporary social issues; the museum holds no record of such art.
  searches:
  - 'find_entity search "discrimination" "social justice" "العدالة الاجتماعية" "سخرية": matched only a hypocrites event and a fatwa on mocking rites, not art'
  - 'find_entity search "subculture" "urban" "graffiti" "mural": no record on urban art (matches were an unrelated cannon founder, a conduit invention and place names)'
- code: A3.2
  text: demonstrate appropriate ways to prepare their art works for presentation in a variety of contexts or venues […]
  why: The expectation asks how to prepare the student's own art works for presentation in a classroom, a gallery or a virtual gallery (mounting, framing, labels); no museum record is about preparing works for display, and linking the museum records of Doha or the Damascus Room would stretch them.
  searches:
  - 'find_entity search "framing" "mounting" "exhibition" "معرض": no record on presentation practice (matches were a source catalogue, a person and concept/nuzul)'
  - 'find_entity search "virtual gallery" "gallery" "label" "signature": label matched only a fatwa on a product label; signature matched only building/signature-dede-sultan-tomb, a tomb'
