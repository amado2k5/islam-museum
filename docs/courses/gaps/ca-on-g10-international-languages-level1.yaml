- code: C3.2
  text: identify, in level-appropriate texts in the target language, examples of sociolinguistic conventions associated with a variety of social situations in diverse communities where the target language is spoken […]
  why: The expectation asks the student to find, in level-appropriate Arabic texts, examples of conventions of letters and e-mails, the formality of social networking, regional vocabulary and expressions in song lyrics. The museum holds no record on dialects or regional vocabulary, none on social networking or the style of letters and e-mails, and none on song lyrics; the texts to read are the class's own.
