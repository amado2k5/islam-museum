  why: Asks the student to identify why people dance in daily life (to socialize, to celebrate, to tell stories, to relate history); the museum holds no record of a dance and the reasons for it.
  searches:
  - 'find_entity.py "dance" "الرقص" "dabke" "folk dance" "wedding": no record of a dance form or of why people dance; concept/raqs-fiqh is a ruling on dancing'
