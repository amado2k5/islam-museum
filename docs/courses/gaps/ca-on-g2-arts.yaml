  - 'docs/courses/gaps/ca-on-g4-arts.yaml (same topic, 2026-11-12): sama and mawlawiyya checked: practice/sama-mawlawiyya rests on one Wikidata line and group/mawlawiyya never calls the whirling a dance'
- code: A3.2
