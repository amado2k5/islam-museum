- code: B3.1
  text: identify and describe a variety of drama and theatre forms they experience in their home, school, and community, and in the media […]
  why: Asks the student to describe drama and theatre forms they meet at home, school, in the community and in the media (television, film, puppets, plays); the museum holds no record on theatre or on children's own viewing.
  searches:
  - 'find_entity.py "drama" "المسرح" "puppet" "shadow play" "television": place/drama is a town in Greece; the television records (work/ahaleena and others) are Islamic programmes, not a drama form; no record on puppets or shadow play'
