- code: A3.1
  text: describe, with teacher guidance, a variety of dances from communities around the world that they have seen in the media, at live performances and social gatherings, or in the classroom […]
  why: Asks the student to describe dances from communities around the world seen in media, live or in class (folk, ceremonial, worship, theatrical, social dances); the museum holds no record of a dance form.
