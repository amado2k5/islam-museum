- code: B3.2
  text: demonstrate an awareness of some drama and theatre traditions of communities around the world […]
  why: Asks for drama and theatre traditions; the records tried, concept/ashik and work/alpamish, are wandering minstrelsy and a verse epic, not drama, and the epic tells of captivity and a killing, which is not suited to age 7.
  searches:
  - 'concept/ashik: wandering minstrels who sang and recited; the lesson Brief itself said "not staged theatre"; missing nouns drama, theatre, play'
  - 'work/alpamish: a verse epic with no performance in drama form; a story of captivity and a killing'
