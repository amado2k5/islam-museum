- code: B4.1
  text: assess their interests, skills, and knowledge in relation to a variety of careers in the arts and culture industry […]
  why: The expectation asks the student to assess their own interests and skills against careers in the arts and culture industry (a composer, promotion and marketing, music education, arts advocacy); the museum holds no record of such a career.
  searches:
  - 'find_entity.py "musician" "موسيقي" "singer" "muezzin": concept/muezzin is a role in worship, person/al-gharid and person/mabad-al-mughanni are one-line singer records; no record on a career in the arts and culture industry'
  - 'find_entity.py "arts advocacy" "فنون" "audition" "conservatory": hits are book titles containing "funun" and hadith audition sessions (sama''); no record on arts organisations or music careers'
