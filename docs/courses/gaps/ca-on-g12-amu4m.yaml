- code: B4.3
  text: demonstrate an understanding of the benefits of their continuing involvement in a variety of aspects of the arts community […]
  why: The expectation asks the student to explain the benefits of continuing involvement in the arts community (performer, composer, advocate, promoter, producer); the museum holds no record on an arts community or on arts activism.
  searches:
