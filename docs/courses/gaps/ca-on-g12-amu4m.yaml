  - 'find_entity.py "musician" "موسيقي" "singer" "muezzin": individual singers only, no record on community involvement'
- code: C1.1
  text: extend and deepen their understanding of the elements and other components of music, particularly through practical application and aural recognition, and use appropriate terminology related to them […]
  why: The expectation asks the student to identify triads, cadences, chord progressions and forms with the right terminology; the museum holds no record of music theory.
  searches:
  - 'find_entity.py "musical notation" "تدوين موسيقي" "scale" "solfège": hits are hadith passages about "the Scale" (al-mizan); no record on music theory'
  - 'find_entity.py "maqam" "مقام" "melodic mode": hits are shrines (maqam) and a hadith station (al-maqam al-mahmud); no record on melodic modes'
- code: C1.2
