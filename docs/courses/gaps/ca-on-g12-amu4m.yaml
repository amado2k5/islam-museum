- code: C2.1
  text: demonstrate an understanding of the development of various forms of music with respect to chronology, genre, and theme […]
  why: The expectation asks the student to explain how forms of music developed over time, by chronology, genre and theme; the museum holds individual records but none on the development of a form.
  searches:
  - 'find_entity.py "history of music" "تاريخ الموسيقى" "blues" "jazz": no real record under these spellings'
  - 'find_entity.py "qawwali" "قوالي" "ghazal" "غزل": records on singers (person/nusrat-fatih-ali-khan, person/mehdi-hassan, person/begum-akhtar) but none traces a form across time'
- code: C3.1
  text: demonstrate an understanding of performance-related injuries connected to the field of music and ways of minimizing such injuries […]
  why: The expectation asks the student to understand injuries connected to music (hearing, posture) and how to minimise them; the museum holds no record on them.
  searches:
  - 'find_entity.py "hearing loss" "السمع" "noise" "ergonomics": hits are hadith passages beginning "he heard" (sami''a) and concept/sama (the rulings of hearing); none on injury'
  - 'find_entity.py "musician" "موسيقي" "singer" "muezzin": no record on a musician''s health'
- code: C3.2
  text: extend their understanding of conventions associated with various types of musical performances, from the perspective of performers and audience members […]
  why: The expectation asks the student to understand the conventions of musical performances (an orchestra, surtitles at the opera, how genres challenged conventions); the museum holds no record on them.
  searches:
  - 'find_entity.py "concert" "حفل" "orchestra" "opera": hits are military operations and cooperative societies; no record on performance conventions'
  - 'find_entity.py "qawwali" "قوالي" "ghazal" "غزل": person records only, none on the conventions of a performance'
- code: C3.3
  text: demonstrate an understanding of legal and ethical practices with respect to both consumers and producers of music, with a particular emphasis on the recording industry […]
  why: The expectation asks the student to understand legal and ethical practices in music, above all licensing and file sharing in the recording industry; the museum holds no record on them.
  searches:
  - 'find_entity.py "copyright" "حقوق الملكية" "licensing" "piracy": the only record is work/fatwa-dar-alifta-intellectual-property-of-research-after-death, about research works after the author''s death, not music or recordings'
  - 'find_entity.py "music" "موسيقى" "Musiqa": listing/awakening-records is a record company''s profile; no record on licensing or the legal practice of the industry'
