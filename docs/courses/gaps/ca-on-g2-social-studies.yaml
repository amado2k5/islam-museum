- code: A3.6
  text: "identify some ways in which heritage is passed on through various community celebrations, traditions, teachings, ceremonies, and events […]"
  why: "Asks how heritage is passed on through community celebrations and traditions; the records tried give moon-sighting and the jurists' recommendation for the last ten nights of Ramadan and an etymology of zakat al-fitr, and say nothing about handing a practice on."
  searches:
  - "practice/sawm-ramadan: tried for lesson a-2 and removed on review; the sighting of the crescent, completing Sha'ban to thirty and the jurists' recommendation for the last ten nights, which are too hard for age 7 and say nothing of passing a practice on"
  - "practice/zakat-al-fitr: tried for lesson a-2 and removed on review; the record is an etymology of why the alms is joined to fitr and of the coined term fitra, a grammar point far above Grade 2"
- code: A3.7
  text: "identify some ways in which heritage is passed on through various family celebrations and practices, including at least one First Nation, Métis, and/or Inuit family celebration or practice […]"
  why: "Asks how heritage is passed on through family celebrations and practices, including a First Nation, Métis or Inuit one; the records tried say nothing about handing a practice on from one generation to the next."
  searches:
  - "practice/sawm-ramadan: tried for lesson a-2 and removed on review; it records no way in which the practice is handed on in a family"
  - "practice/zakat-al-fitr: tried for lesson a-2 and removed on review; it records no way in which the practice is handed on in a family"
- code: B3.4
  text: "identify the location of selected countries, cities, and/or towns around the world, including at least one contemporary First Nation, Métis, or Inuit community, and describe how their location and climate are related […]"
  why: "Asks the student to locate selected countries, cities or towns and describe how their location and climate are related; the one record tried is a medieval scheme of seven climes with a claim about an empty southern quarter that a seven-year-old cannot weigh, and it names the climate of no country or town."
  searches:
  - "concept/al-aqalim-al-saba: tried for lesson b-2 and removed on review; seven climes, twenty-four degrees beyond the equator, and a southern quarter said to be empty of people and ruined by heat, which is wrong as stated"
  - "earlier searches for this register: no record gives the climate of a named country or town at Grade 2 level"
