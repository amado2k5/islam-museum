course: course/ca-on-g2-social-studies
gaps:
- code: A1.1
  text: "compare ways in which some traditions have been celebrated over multiple generations in their family […] and identify some of the main reasons for changes in these traditions […]"
  why: "Compares traditions of diverse groups, including First Nations, Métis and Inuit, over multiple generations in the student's own family; the museum holds no record of a Canadian family's traditions or of First Nations, Métis or Inuit peoples."
  searches:
  - "find_entity.py \"First Nations\" \"الأمم الأولى\" \"Métis\" \"Indigenous\": no real record"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Arctic\": one real record, concept/muwala (a fiqh term on continuity), nothing usable"
  - "find_entity.py \"Christmas\" \"Easter\" \"Diwali\" \"Passover\" \"Hanukkah\" \"Kwanzaa\" \"عيد الميلاد\": no real record"
- code: A1.2
  text: "compare their family structure and some of their traditions and celebrations with those of their peers’ families […]"
  why: "Compares the student's own family structure and traditions with those of peers' families; this rests on the student's own and classmates' families, which no record of the museum describes."
  searches:
  - "find_entity.py \"family\" \"أسرة\" \"عائلة\" \"multigenerational\": 47 records, all events or passages about named families (for example event/ali-left-with-the-prophets-family); none describes family structure"
  - "find_entity.py \"food\" \"طعام\" \"cuisine\" \"meal\" \"wedding\": hadith passages and fiqh of slaughter; no record on a family's foods or rites of passage"
- code: A1.3
  text: "compare some of the past and present traditions and celebrations of various ethnocultural groups in their local community, and identify some of the main reasons for the change […]"
  why: "Compares past and present traditions of ethnocultural groups in the student's local community and the reasons for change, including banned and reclaimed practices; the museum holds no record of a Canadian local community or of its groups."
  searches:
  - "find_entity.py \"First Nations\" \"الأمم الأولى\" \"Métis\" \"Indigenous\": no real record"
  - "find_entity.py \"Canada\" \"كندا\" \"Ontario\": place/canada and place/ontario exist but have no prose"
  - "find_entity.py \"residential school\" \"colonization\" \"استعمار\" \"reconciliation\": three unrelated records about reconciliation between scholars and the fiqh of winning hearts; nothing usable"
- code: A1.4
  text: "identify some ways in which First Nations, Métis, and/or Inuit individuals, communities, and nations are reclaiming traditions, customs, teachings, and celebrations […] that were banned, lost, or practised in secret due to settlement and/or colonization, including the residential school system […]"
  why: "Asks how First Nations, Métis and Inuit communities are reclaiming traditions banned or lost through settlement, colonization and the residential school system; the whole object of the expectation lies outside the museum."
  searches:
  - "find_entity.py \"First Nations\" \"الأمم الأولى\" \"Métis\" \"Indigenous\": no real record"
  - "find_entity.py \"residential school\" \"colonization\" \"استعمار\" \"reconciliation\": three unrelated records about reconciliation between scholars and the fiqh of winning hearts; nothing usable"
  - "find_entity.py \"Inuit\" \"الإنويت\" \"Arctic\": one real record, concept/muwala (a fiqh term on continuity), nothing usable"
