- code: A3.1
  text: "identify and describe different types of families […]"
  why: "Asks the student to describe different types of families (one-parent, blended, foster and others); the museum holds no record on family types."
  searches:
  - "find_entity.py \"family\" \"أسرة\" \"عائلة\" \"multigenerational\": 47 records, all events or passages about named families; none describes types of family"
  - "find_entity.py \"heritage\" \"تراث\" \"tradition\" \"تقاليد\": 37 records, none about family forms"
- code: A3.2
  text: "identify various groups in their community […], and describe some of the ways in which their community reflects this diversity […]"
  why: "Asks the student to identify groups in their community (religious, ethnocultural, First Nations, Métis, Inuit, immigrants and refugees) and how the community reflects this diversity; the museum holds no record of a Canadian community."
  searches:
  - "find_entity.py \"diversity\" \"تنوع\" \"multicultural\" \"neighbourhood\": concept/jiwar is the fiqh of the neighbour's rights; nothing on a community's groups"
  - "find_entity.py \"immigrants\" \"مهاجرون\" \"refugees\" \"لاجئون\" \"hijra\": group/muhajirun and event/hijra are the Prophet's emigration from Mecca to Medina, not immigrants to Canada"
  - "find_entity.py \"Canada\" \"كندا\" \"Ontario\": place/canada and place/ontario exist but have no prose"
- code: A3.3
  text: "identify places and/or countries of personal or familial significance, and locate them on a globe and/or print, digital, or interactive map"
  why: "Asks the student to find places and countries of personal or family significance on a globe or map; this rests on the student's own family, which no record describes."
  searches:
  - "find_entity.py \"globe\" \"كرة أرضية\" \"world map\" \"خريطة\": invention/tabula-rogeriana is a medieval world map (linked in lesson b-1); none concerns a family's places"
  - "find_entity.py \"family tree\" \"نسب\" \"genealogy\" \"timeline\": concept/nasab is the fiqh of lineage; nothing on a family's places"
- code: A3.5
  text: "demonstrate an understanding of simple chronology by identifying and organizing chronologically some important events and/or people from multiple generations in their family and/or community […]"
  why: "Asks the student to order events and people of several generations of their own family or community in time (family tree, timeline); this rests on the student's own family history, which no record describes."
  searches:
  - "find_entity.py \"family tree\" \"نسب\" \"genealogy\" \"timeline\" \"chronology\" \"تأريخ\": concept/nasab is the fiqh of lineage and proofs of descent, not a family chronology"
  - "find_entity.py \"family\" \"أسرة\" \"عائلة\" \"multigenerational\": 47 records about named families, none a method for a student's own family history"
- code: B1.1
  text: "compare selected communities from around the world, including their own community, in terms of the lifestyles of people in those communities and some ways in which the people meet their needs […]"
  why: "Compares selected communities around the world, including the student's own, in lifestyle and ways of meeting needs (housing, groceries, food); the museum holds no record that compares present-day communities."
  searches:
  - "find_entity.py \"Hawaii\" \"هاواي\" \"Caribbean\" \"South America\": no real record (only a source record on Caribbean pirates)"
  - "find_entity.py \"shelter\" \"house\" \"مسكن\" \"housing\" \"clothing\" \"لباس\": 91 records, none about a community's housing or clothing (place/maskin is a place name)"
  - "find_entity.py \"food\" \"طعام\" \"cuisine\" \"meal\": hadith passages and fiqh of slaughter; no record on a community's diet"
- code: B1.2
  text: "describe some of the ways in which two or more distinct communities have adapted to their location, climate, and physical features […]"
  why: "Asks how two or more distinct communities have adapted to their location, climate and physical features; the museum holds no record that describes a community's adaptation, only a medieval scheme of climes, tried for lesson b-2 and removed on review."
  searches:
  - "find_entity.py \"climate\" \"مناخ\" \"weather\": concept/al-aqalim-al-saba (tried for lesson b-2 and removed on review) and concept/athar-al-iqlim (Ibn Khaldun on climate and people, whose summary makes claims about skin colour that were not linked); neither describes a community's adaptation"
  - "find_entity.py \"farming\" \"زراعة\" \"agriculture\" \"harvest\": concept/agriculture-in-islam is a book's view of farming as a livelihood and land rights, not an adaptation to climate"
  - "find_entity.py \"hunting\" \"صيد\" \"fishing\": Muwatta book of hunting and similar passages are rulings, not a community's way of life"
