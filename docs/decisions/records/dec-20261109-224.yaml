rationale: 'dec-223 answered a source-onboarding question with the Arabic-first content rule because the word ''Arabic'' appeared in the assessment text (''Arabic-first moderate'', ''legends Arabic''). The rule fired on descriptive metadata, not on a language/localisation question — the same substring false-positive class as dec-189->190 and dec-197->204. The correct ruling applies the eight onboarding criteria in docs/agents/source-families.md: authority, citability, terms, structure, coverage fit, corroboration, Arabic coverage and longevity all scored; Nomisma''s own CC-BY 3.0 licence permits citation with attribution ({cite:nomisma <concept-id>} is the attribution), while partner datasets ingested through Nomisma carry their own licence statements and stay facts-only until checked per-record — hence Tier 2, not Tier 1.'
