question: 'Should the Thesaurus d''Epigraphie Islamique (now at epigraphie-islamique.uliege.be/Thesaurus/, University of Liege hosting, Max van
  Berchem Foundation sponsorship, directed by named scholars Kalus/Bauden/Soudan, successor to the printed RCEA) be onboarded as a citable source
  family for dating buildings, objects and events, and at what tier? Assessment 2026-11-08: authority strong; citability excellent (stable fiche
  numbers, e.g. EpigraphyDisplay.aspx?id=11979, GET pages server-rendered); terms: free of charge online since Oct 2011, no licence page found
  — default facts-only; structure: ASP.NET postback search (scriptable) plus GET fiche pages carrying Hijri era, Christian era, place, current
  repository, language, nature, support type, material, last-update date; 58,289 fiches and 49,884 photos covering the Muslim world to AH 1000;
  coverage fit high (inscription dating is the corroboration the corpus lacks); Arabic-first strong; longevity strong (university host, live daily
  updates). Old domain epigraphie-islamique.org is a parked courtesy page — the uliege.be base is canonical.'
