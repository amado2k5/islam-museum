question: "The founder approved four changes in chat on 14 November 2026: \"yes
  make the changes 1 to 4 that you proposed\". (1) Release notes: lane workers
  write one release-note entry per packet (the manifest's canary field) and the
  lander puts them into CANARY.md in the same pull request, so \"every change
  has its entry in the same commit\" still holds. (2) Batch size: the limit of
  25 entities applies per packet, and one train pull request may carry many
  packets. (3) Validation: a fast scoped check per packet (npm run
  check:packet), and the full npm run validate once per train before the merge.
  (4) Who merges: only the lander merges lane content; lane workers no longer
  open or merge their own pull requests. Reason: twenty agents merging small
  pull requests conflicted on CANARY.md and the progress files, and output
  stayed flat. Should AGENTS.md and the agent guides be amended to record the
  packet pipeline as the standing procedure for lane content, leaving work
  outside the lanes (site code, docs, fixes) on the existing workflow and
  weakening no content rule?"
options:
  - amend AGENTS.md and the guides as described, add docs/agents/pipeline.md and
    the check:packet script
  - amend only docs/agents/ and leave AGENTS.md unchanged
  - do not amend
evidence:
  - Founder approval in chat, 14 November 2026, quoted in the question
  - docs/agents/orchestration/packet-pipeline.md and lander-brief.md (the
    approved design)
  - "No content rule is weakened: the same checks run, once per train instead of
    once per small pull request"
  - "Reversible: docs and one read-only script; no entity changes"
