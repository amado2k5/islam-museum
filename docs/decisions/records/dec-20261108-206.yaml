rationale: 'dec-200 answered a source-onboarding question with the Arabic-first content rule because the word ''Arabic'' appeared in the assessment
  text (''Arabic-first value'', ''Arabic-first moderate''). The rule fired on descriptive metadata, not on a language/localisation question —
  the same substring false-positive class as dec-189->190 (kid/wikidata and Arabic-in-evidence). The correct ruling applies the eight onboarding
  criteria in docs/agents/source-families.md: authority, citability, terms posture, structure, coverage fit, corroboration, Arabic coverage and
  longevity all scored; the assessment''s recommended Tier 1 facts-only posture is adopted (non-commercial or unclear terms => facts-only permanently).'
