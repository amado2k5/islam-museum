question: 'Should the Victoria and Albert Museum Collections API (api.vam.ac.uk/v2 — public JSON search returning systemNumber, accessionNumber,
  dates, maker, place, object type and IIIF image identifiers; collections.vam.ac.uk object pages) be onboarded as a citable source family for
  the object backlog, and at what tier? Assessment 2026-11-08: authority strong (national museum); citability excellent (systemNumber stable id,
  IIIF manifests); terms: V&A websites terms state V&A-owned content may be used free of charge for non-commercial purposes — facts-only posture
  for data/prose, images never ingested; structure: keyless JSON API v2 answered live (objects/search?q=minbar returned records); robots file
  names AI crawlers only with no wildcard group, harvest UA not listed; coverage fit good (V&A Islamic collection vs 542 object records); corroboration
  high (maker/date/material/provenance); Arabic-first moderate; longevity strong.'
options:
- 'Tier 1 citable family, facts-only: cite {cite:vam-collections <systemNumber>}; record text and images never republished'
- Tier 3 pointer only
- Do not register
evidence:
- api.vam.ac.uk/v2/objects/search?q=minbar&page_size=3 returned HTTP 200 JSON on 2026-11-08 with no key
- developers.vam.ac.uk guide documents the API; vam.ac.uk info pages state non-commercial use terms
- docs/agents/source-families.md Tier 1 lists museum collections per collection; Met already Tier R CC0
status: decided
step: override
decision: 'Tier 1 citable family, facts-only: cite {cite:vam-collections <systemNumber>}; keyless JSON API is the harvest channel'
correct_outcome: vam-tier1-facts-only
wrong_outcome: register-tier1-facts-only
