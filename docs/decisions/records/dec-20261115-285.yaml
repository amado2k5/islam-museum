question: "The founder ruled in chat on 15 November 2026: \"make the changes and adjust the claims and be honest on everything\". The public-claims audit of the same day (docs/audit/public-claims-audit-2026-11-15.md, merged in PR #7045) measured the museum's public statements against its own records and found the draft Museums + Heritage Awards entry overstated AI's role as mechanical-only, implied a book-only corpus and a human-reviewed published tier, and used stale cost and count figures. The founder's ruling: every public claim about the museum — in award entries, submissions, outreach and the site's own pages — must match what the museum's own public record shows: AI tools research, draft, translate and check entries; most records are drafts; sources include reference sources and records whose sources are not yet checked, stated as such; running costs are the site's own published figures; and no text may imply a human-reviewed corpus. Should this honesty rule be recorded as a standing founder ruling, binding on every public statement about the museum, with the audit ledger as its evidence and the awards entry of 15 November 2026 as its first application? This question is reserved to the founder: the founder decides."
options:
  - "record the honesty rule as a standing founder ruling, binding on all public claims about the museum, with the audit ledger as its evidence"
  - "record it for award entries and submissions only"
  - "do not record"
