question: What is the reference set that rules and the rule engine must conform to?
decision: 'GOLDEN SET RULE (founder, 2026-11-08): everything currently in islam.museum — all data, prose, events, persons, books — is the golden reference. Rules and the decision engine are calibrated TO it, never the reverse. If a rule would rule out an existing entity, the rule/engine is wrong and must be adjusted to accommodate the golden set. Consequences: (1) existing published content is never retroactively invalidated by new rules — new rules apply forward unless the founder says otherwise; (2) decision-engine rules that conflict with attested existing content get fixed, not the content; (3) canon labels/decisions must be consistent with how the museum already treats these authors and works.'
confidence: 1
reversible: false
rationale: 'Founder ruling, verbatim intent: ''everything that is right now in islam museum... is your golden set... if your rules rule out an existing book, prose, phrase, event, anything then the rule and the rule engine is wrong and needs to be adjusted.'' This supersedes any interpretation where new doctrine silently invalidates existing content — including the draft-tier AI rule (applies to new AI output only, existing published content stands).'
