  - "Assessment 2026-11-08: authority strong (Saint John's University / HMML, the standard Western manuscript cataloguing institution); citability good (stable record ids and shelfmark anchors); terms: public catalogue browsable; full content requires free registration — the lane rule bars login-gated harvest, so only public catalogue metadata is in scope; robots.txt wildcard allows our User-Agent (named AI crawlers disallowed, ours not listed; Content-Signal ai-train=no noted — we harvest facts for citation, not model training); structure: HTML catalogue, API availability unconfirmed; coverage fit high (dates, colophons, provenance for the works backlog); corroboration high; longevity strong."
