question: 'The Place wing page carried 14 MB of map data inside its HTML (25.9 MB per language). Should the map script fetch that data on demand from static JSON files written beside the page under /<lang>/place-map/ at build time, instead of the page carrying it or a new /api/v1/ export serving it?'
options:
- 'static JSON files under /<lang>/place-map/, built by an Astro endpoint from the one graph and fetched on demand'
- 'a new /api/v1/ export'
- 'keep the data in the page'
evidence:
- 'AGENTS.md, hosting split of 28 October 2026: data goes to R2; workers/site/src/route.js already serves every path under /ar/, /en/ and /ur/ from R2, so no Worker, wrangler or workflow file changes'
- 'site/src/pages/timeline-data/[lang].json.ts is the standing precedent for page data moved out of a page so the page stays small'
- 'docs/ai-change-gates.md section 3 lists /api/v1/ and docs/data/README.md as submission-impacting; a page''s own data files are not an API route and no claim in the dossier changes'
- 'scripts/check-static.ts allows a fetch of a same-origin static .json file; the script stores nothing on the device and calls nothing else (scripts/place-map.test.ts asserts it)'
- 'Measured: page 601 KB (was 25.3 MB), places.json 125 KB compressed, the file behind a click at most 36 KB compressed'
status: decided
step: override
decision: 'Static JSON files under /<lang>/place-map/, written at build time by site/src/pages/[lang]/place-map/[file].json.ts from the one graph: places.json for every place, and 2 x 128 small files found by hashing a place''s slug or a record''s id, fetched when a reader opens one. No /api/v1/ file, Worker, wrangler or workflow file changes. The places themselves stay in the graph, the class exports and search exactly as before, so the graph, API and search rule is already met. Under docs/ai-change-gates.md section 3, which names a script and a network call, the change is labelled submission-impacting and waits for the founder''s sign-off; the reserved outreach files are edited only after it. No filed claim changes (same-origin static files, nothing stored, no third party).'
correct_outcome: page-data-as-static-files-beside-the-page
wrong_outcome: rule-feature-graph-api-search
confidence: 0.9
reversible: true
rationale: 'dec-232 answered with the graph, API and search rule. That rule is satisfied and is not the question: the question is how a page''s own script gets the data it draws. The standing example is timeline-data (page data moved out of a page into a static file), and the language path is already served from R2, which keeps the change inside the page''s own files. Files are hashed by name so that a new record changes one file. Reversible: the endpoint and the script are the only parts that know the layout.'
supersedes: dec-20261111-232
