question: "Hilyat al-Awliya vol. 10 notices 459, 460 and 648 (Ahmad ibn Khidruya al-Balkhi, Ibrahim al-Harawi known as Sitanba, Abu Amr al-Zajjaji) have no person record or alias in data/person. Create new draft person records from the single Hilyat notice, with no faith or tradition value because the notice states none, and read the garbled OCR nickname of notice 460 as Sitanba?"
options:
  - "create draft records with roles [mystic], no faith/tradition field, nickname Sitanba noted as an OCR reading"
  - "create the records and infer a tradition value from inclusion in a Sunni tabaqat work"
  - "leave the three notices as leads"
evidence:
  - "source/hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 10/42-44 and 10/376"
  - "AGENTS.md: one source is enough for any fact; a person's faith is recorded only with its basis, never inferred; reuse before you create"
  - "data/person searched for khidruya/خضرويه, ستنبه/الهروي, الزجاجي (al-zujaji and al-zajjaji are different men: a Shafi'i judge of Amul and the grammarian)"
