question: Should Zeno.ru (Oriental Coins Database — coin records with stable ids cross-referenced to Album/Tye/Mitchiner catalogues) be onboarded
  as a citable source family for polity and ruler coinage, and at what tier?
options:
- Tier 1 citable family, facts-only
- Tier 2 citable family, facts-only
- Tier 3 pointer only — catalogue ids used to locate the published reference, never a cite target
- Do not register
evidence:
- 'Assessment 2026-11-08: authority weak (private hobbyist database aggregating published catalogues — the family catalogue itself calls it ''weakest
  scholarly tier''); citability good (stable record ids); terms unclear → facts-only; structure: searchable HTML, no API; coverage fit moderate
  (coin legends, mints, dates for polities and rulers); corroboration moderate but derivative; robots.txt carries ''User-agent: * / Disallow:
  /'' — no automated access permitted, so no machine channel exists at all; longevity moderate.'
- 'docs/agents/source-families.md Tier 2: ''cite legend/mint/date only, paired with the published catalogue reference it names'''
status: decided
step: override
decision: Tier 3 pointer only — catalogue ids locate the published reference; robots.txt disallows all automated access and the database is derivative
  of published coin catalogues
correct_outcome: zeno-tier3-pointer
wrong_outcome: register-tier3-pointer
confidence: 1
reversible: true
rationale: dec-213 answered a source-onboarding question with rule-source-families, whose pattern 'families? of sources?'/'source famil' matched
  the phrase 'source family' describing the candidate itself. The rule governs how attestations are COUNTED (one family = one attestation), not
  whether a family may be registered — same substring false-positive class as dec-189->190 and dec-194..200->201..206. The correct ruling applies
  the eight onboarding criteria in docs/agents/source-families.md; the assessment's recommended tier and posture is adopted (non-commercial or
  unclear terms => facts-only permanently; robots or login barriers cap the channel, not necessarily the tier).
