question: "Should the iDAI.gazetteer (the German Archaeological Institute's ancient-world place gazetteer, canonical place/<gazId> URIs, unauthenticated JSON REST endpoints, CC-BY 4.0 content licence, multilingual names including Arabic, provenance-tracked records with owl:sameAs links to Pleiades/geonames/GND) be onboarded as a citable source family for place records, and at what tier? Assessment 9 Nov 2026: authority excellent (the DAI is Germany's federal archaeology institute and the gazetteer is a Pelagios linked-data standard across the ancient-world research community); citability excellent (stable canonical URIs like https://gazetteer.dainst.org/place/2280221 for Damascus, gazId + doc/<id>.json full record); terms good — CC-BY 4.0 stated in the site footer; structure excellent — robots.txt 'User-agent: * / Allow: /', JSON endpoints search.json, doc/<id>.json, suggestions, children, geoSearch; coverage fit good — populated-place, archaeological-site and building-institution types with coordinates and polygons across the Islamic-period Mediterranean and Near East; corroboration good — per-record identifiers (zenon-systemnr, zenon-thesaurus, GND-ID) and owl:sameAs links to Pleiades/geonames, the same identifier families the museum's place records already carry as external_ids; language coverage good — names in about 25 languages including Arabic; longevity excellent — institutional DAI service, versioned releases, per-record provenance batches."
options:
  - "Tier 2 citable family, facts-only"
  - "Tier 1 citable family"
  - "Tier 3 pointer only"
  - "Do not register"
evidence:
  - "Live checks 2026-11-09: https://gazetteer.dainst.org/app/#!/home HTTP 200; robots.txt 'User-agent: * / Allow: /'; GET https://gazetteer.dainst.org/search.json?q=Damascus&limit=5 returns JSON (total 599 hits, records carrying gazId, prefName, types, prefLocation.coordinates); GET /doc/2280221.json returns the full Damascus record — @id https://gazetteer.dainst.org/place/2280221, gazId 2280221, types building-institution + populated-place, prefLocation.coordinates [36.291924, 33.513063], 27 names incl. Arabic (الشام, دمشق, ash-Sham, Dimashq), identifiers zenon-systemnr/zenon-thesaurus/GND-ID, owl:sameAs links to Pleiades place 678106, geonames and arachne.dainst.org, provenance batches (geonames, syria admin imports); site footer states contents licensed CC-BY 4.0, app version 3.0.2"
  - "docs/agents/source-families.md: Pleiades is held at Tier 3 pointer with no data/source entity; iDAI.gazetteer is the DAI's institutional gazetteer with an open licence and a JSON API — the scholarly place-identification layer the place backlog lacks"
  - "data/place records already carry external_ids.geonames/pleiades/wikidata — iDAI's owl:sameAs links corroborate those identifiers and its gazIds add a citable scholarly anchor for place identity, alternate names and coordinates"
