question: "The Place wing page carried 14 MB of map data inside its HTML (25.9 MB per language). Should the map script fetch that data on demand from static JSON files written beside the page under /<lang>/place-map/ at build time, instead of the page carrying it or a new /api/v1/ export serving it?"
options:
  - "static JSON files under /<lang>/place-map/, built by an Astro endpoint from the one graph and fetched on demand"
  - "a new /api/v1/ export"
  - "keep the data in the page"
evidence:
  - "AGENTS.md, hosting split of 28 October 2026: data goes to R2; workers/site/src/route.js already serves every path under /ar/, /en/ and /ur/ from R2, so no Worker, wrangler or workflow file changes"
  - "site/src/pages/timeline-data/[lang].json.ts is the standing precedent for page data moved out of a page so the page stays small"
  - "docs/ai-change-gates.md section 3 lists /api/v1/ and docs/data/README.md as submission-impacting; a page's own data files are not an API route and no claim in the dossier changes"
  - "scripts/check-static.ts allows a fetch of a same-origin static .json file; the script stores nothing on the device and calls nothing else (scripts/place-map.test.ts asserts it)"
  - "Measured: page 601 KB (was 25.3 MB), places.json 125 KB compressed, the file behind a click at most 36 KB compressed"
