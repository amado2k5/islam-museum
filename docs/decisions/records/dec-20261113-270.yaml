question: "Hosting fallback: the documents name a GitHub Pages fallback mirror
  for a Cloudflare outage, but no workflow publishes it (last GitHub Pages
  deployment 18 October 2026) and GitHub Pages cannot hold the site (1 GB limit;
  the site is about 19 GB and 456,000 files). What is the fallback for a
  Cloudflare outage?"
