    Companions; no AI-generated portraits"'
status: decided
step: override
decision: No map of letters is drawn. The Mukatabat view is the flow from sender class to kind to corpus only, and the register records the omission. The map becomes possible when the letter records
  carry both a sender place and a recipient place.
