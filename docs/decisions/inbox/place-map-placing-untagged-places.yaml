question: "On the Place wing map, 867 of 3,875 places could not be reached because they carry none of the twelve region ids, and 14 place records carry the coordinates [0, 0]. How should the map show them without changing any record: assign a display region by geometry and leave the [0, 0] places off the map but in the index, or leave them out, or edit the records?"
class: "process"
lane: "place-map"
options: ["display only: a place's region on the map is its first tag among the twelve, else the region whose outline holds it (within two degrees), else Rest of the world; a place at [0, 0] is not plotted and stays in the index under the map; no record is edited", "leave untagged places off the map", "edit the records to add region tags and remove the [0, 0] coordinates"]
