question: "Hilyat al-Awliya vol. 10: (a) notice 645 names Sa'id ibn Abd al-Aziz al-Halabi, a companion of al-Sari al-Saqati who settled in Damascus, while the graph already holds person/said-ibn-abd-al-aziz-al-tanukhi (the earlier Damascene jurist) — merge or keep apart; (b) notice 650 says Abu Bakr ibn Abi Sa'dan 'followed al-Shafi'i' — record that as a traditions/faith value on the new record or state it in cited prose only?"
class: "content"
lane: "microsd-books"
options: ["keep the homonyms apart, write no record for notice 645 yet, and state the Shafi'i affiliation in cited prose only", "alias notice 645 to the Tanukhi record", "add a traditions value to the new record from the single Hilyat line"]
evidence: ["source/hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 10/366 and 10/377", "AGENTS.md: homonyms never merge; a person's faith is recorded only with its basis, never inferred"]
proposed_action: "keep the homonyms apart, write no record for notice 645 yet, and state the Shafi'i affiliation in cited prose only"
