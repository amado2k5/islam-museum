id: web-british-museum-onboarding
lane: "web-sources"
class: "process"
modality: "website"
question: "Should the British Museum collection database (britishmuseum.org/collection — object records with museum numbers, dates, materials, provenance for the Islamic collections) be onboarded as a citable source family for the object backlog, and at what tier? Assessment 2026-11-08: authority strong (national museum); citability good (museum object numbers); terms: collection data published CC BY-NC-SA 4.0 per the family catalogue's earlier check — non-commercial/share-alike clause means facts-only posture permanently; structure: collection pages answer 403 Cloudflare challenge to non-browser clients on 2026-11-08 (recorded, not bypassed); Wayback snapshots exist; an official data release/API status needs a browser check; coverage fit good (BM Islamic collection vs 542 object records); corroboration high; Arabic-first moderate; longevity strong."
options:
  - "Tier 1 citable family, facts-only: cite {cite:british-museum <object-id>}"
  - "Tier 3 pointer only"
  - "Do not register until a machine channel is confirmed"
evidence:
  - "britishmuseum.org/collection returned a 403 challenge page to the harvest User-Agent on 2026-11-08"
  - "docs/agents/source-families.md Tier 1: 'British Museum: CC BY-NC-SA 4.0 -> facts-only'"
proposed_action: "register source/british-museum at Tier 1 facts-only once a read channel (Wayback or browser) is exercised on a sample object page; pilot on 10 records"
source: "Muse web-sources lane assessment 2026-11-08"
