question: "Rulings Browser (lane ahkam, 20 Nov 2026): the agent (1) read the founder's «وخلافه» as the rest of the scale of the five rulings — the permitted (mubah) and the concession (rukhsa) — and added it as a tenth theme; (2) admitted Qur'an verses by a reviewed table of references instead of the lexicon, and listed no verse under fard 'ayn because the Qur'an does not use the term; (3) did not class a bare prohibition («نهى عن») as forbidden or disliked, because that is a jurist's reading, so such reports appear only when their wording names the degree; (4) read the forbidden theme with the Halal and Haram Browser's own lexicon; (5) harvested the hadith-api reports and the OCR excerpts in one pull request (above the 25-entity batch size) from books already on the harvest drive, downloading none; (6) created six new concept records (al-ahkam-al-taklifiyya, fard, fard-ayn, fard-kifaya, taa, haram-hukm) beside the existing ahkam, wajib-fiqh, kifaya and halal-haram records instead of rewriting those; (7) shipped English, Urdu, French and Spanish as machine translations by a model subagent, not through the Google Translate document route, because the set is six articles and not bulk. Is each of these right?"
