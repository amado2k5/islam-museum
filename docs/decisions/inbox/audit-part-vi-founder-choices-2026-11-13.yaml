question: "Audit Part VI: how AI text on published records is shown, what happens to dates from the date-enrichment pass that no text can test, and how the six beings filed as persons are typed."
class: "editorial"
lane: "audit-fixes"
options: ["label the AI text, records stay published", "mark the 28 tour records draft and remove the Kiswa sentences", "leave as is"]
evidence: ["docs/audit/part-vi-founder-inventories.md items 1, 7, 8, 11", "docs/audit/audit-fixes-2026-11-13.md", "dec-20261108-152"]
verdict: "Founder, in chat, 13 November 2026: (1) label the text: a published record with unread AI passages stays published and prints a notice; the 1,715 Tafsir digests print a notice inside the Tafsir section; wing counts stay as they are. (2) Dates: compare with Wikidata where the record has an id, keep and cite agreements, remove disagreements; the untested rest leave timelines and sorted lists and stay on the person's page with an unverified mark. (3) Beings: an optional typed field on persons; Jibril and Mika'il typed as angels with a source; Iblis, Harut, Marut and Bidukh stay untyped because the sources differ. Also approved: connectedness measured over subject records, the two missing al-Tabari digests (36:58, 112:1), and the Du'a occasions axis from al-Nawawi's al-Adhkar."
rationale: "No human readers are available, so 'draft until read' would mean draft indefinitely on the most visited records; a visible sentence on the text itself is truthful and changes no public count. A second model's recommendations (Gemini) were heard as advice and overruled on three points."
reversibility: "Reversible: the notices are three strings and two template lines; the being field is optional; no review state was changed."
