question: "Register Oxford Islamic Studies Online (as archived by the Wayback Machine) and, as a general family, defunct sites preserved by the Internet Archive, as trusted source families for facts-only enrichment?"
class: "process"
lane: "oxford-islamic-studies-wayback"
options:
