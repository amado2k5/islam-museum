rationale: "Registered as the founder asked. Posture is the strictest consistent with docs/sources-policy.md: facts in the museum's own words, 40-word quotation limit, no captured pages in git. Each defunct site is still judged on the eight criteria before use, and the capture must be checked to hold the content."
verdict: "register both families (founder ruling, 16 November 2026)"
reversibility: "Fully reversible: removing the three source entities and the source-families rows stops new use; facts already written stay citable to the entry id and are re-verifiable from the capture URL."
