question: "Should person/rawh-ibn-hatim be merged into person/ruh-ibn-hatim-al-muhallabi (same man, died 174 AH, al-Zirikli al-A'lam vol. 3 p. 34), keeping the richer record person/ruh-ibn-hatim-al-muhallabi, with the other slug kept as an alias and every reference repointed?"
options:
  - "Merge: ruh-ibn-hatim-al-muhallabi survives; rawh-ibn-hatim becomes an alias; unique facts and sources folded in; references repointed; duplicate files deleted"
  - "Keep both records"
evidence:
  - "Both cards: Hatim's son, al-Muhallabi, governor of Ifriqiya after his brother Yazid ibn Hatim, died 174 AH (791 CE); al-A'lam vol. 3 p. 34 read in full from the OpenITI text"
  - "Rawh card cites Siyar A'lam al-Nubala p. 1700 (death Ramadan 174, buried beside his brother at Qayrawan) and Futuh al-Buldan p. 326; no fact on either card conflicts with the other"
  - "AGENTS.md: reuse before you create; a duplicate becomes an alias of the richer entity"
proposed_action: "Merge into person/ruh-ibn-hatim-al-muhallabi; add person/rawh-ibn-hatim spelling variants to aliases; repoint al-fadl-ibn-rawh, yazid-ibn-hatim-ifriqiya, marzuq-ispahbadh-ruse and prose links"
