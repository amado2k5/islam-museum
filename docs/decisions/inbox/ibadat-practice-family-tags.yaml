question: "Ibadat Browser rosette: the practice records carried no worship family, and the view grouped 41 of them from a table typed into the component. Where should the grouping live, and what happens to a practice whose record names no family (for example practice/nadhr, which had been placed under supplication only through the Du'a Browser's section tag)?"
class: "engineering"
lane: "signature-views"
options: ["an ibadat-<topic> tag on each practice record, read by ibadatTagTopics; a practice whose record names no family is listed under the rosette, not placed (chosen, on the founder's instruction in chat on 13 November 2026 to add a tag to each practice record and remove the table)", "keep the table in the component", "leave every practice ungrouped"]
evidence: ["founder in chat, 13 November 2026: add a tag to each practice record and remove the table", "amado2k5/islam-museum pull request 6536", "scripts/ibadat.ts ibadatTagTopics", "eleven practices name no family and await classification from sources: aqiqa, ashura, dafn, eid-al-adha, eid-al-fitr, kaffarat-al-yamin, khitan, mawlid-al-nabi, nadhr, udhiyya, ziyarat-al-qubur"]
