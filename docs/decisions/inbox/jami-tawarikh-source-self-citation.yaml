options: ["allow the source record to cite the scanned edition itself (layer copyrighted-reference), with the scan's archive.org identifier", "require an external bibliographic record (library catalogue or publisher) before the source record is accepted", "hold the source records until an external record is found"]
evidence: ["docs/agents/publication-standard.md: one source is enough for any fact; a source record needs a cited source", "docs/library/harvest-register.yaml: the book entry cites archive.org item 20241003_20241003_1100 as its acquisition source", "packets/rejected/jami-tawarikh-v1-p001-060/REJECT_FIXED.md: the fix agent changed the layer to copyrighted-reference and cited the Khashshab scan"]
