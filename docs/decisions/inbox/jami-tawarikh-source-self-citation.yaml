question: "Jami al-Tawarikh source records (source/jami-al-tawarikh-khashshab-1960 and source/tarikh-wassaf) need a cited source for their non-open layer under the validator. May a source record cite the scanned edition itself (the archive.org scan and the Khashshab scan, layer copyrighted-reference), or must it cite an external bibliographic record?"
class: "content"
