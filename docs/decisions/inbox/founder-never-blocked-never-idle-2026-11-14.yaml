question: "How should lane workers handle a blocker or a pending decision: stop and wait, or keep moving?"
class: "process"
lane: "orchestrator"
options: ["decide with the rule engine and judge, and if still blocked skip the item and move on", "stop and ask the founder", "hold the lane until a decision arrives"]
evidence: ["Founder, in chat, 14 November 2026: 'as a general rule, do not let any lane get held or blocked, when there is any issue or any pending decision, use the rule engine/judge LLM to decide and if there is still blockage, move onto the next item and do not wait. keep making progress all the time, no lane and no worker should be idle or waiting at any time.'", "docs/decisions/records/dec-20261114-277.yaml (the founder-held items stay skipped, not guessed)", "AGENTS.md: act as the human in the loop; record every judgment in the decision ledger"]
verdict: "Founder, in chat, 14 November 2026: no lane and no worker is ever held, blocked, idle or waiting. On any issue or pending decision, run the rule engine and judge (decide.ts, one question at a time) and act on the answer; if it still cannot decide, log the proposal in docs/decisions/inbox/ and the lane ledger, skip that item and move to the next at once; never stop to ask and never wait. The hard invariants (terrorist-organisation block, Qur'an text integrity, licence posture, safety gates) are never decided by an engine, and items reserved for the founder are skipped and logged, not guessed. When a queue empties, the worker pulls the next unclaimed item from its lane list."
rationale: "The lanes run continuously for hours and one waiting worker wastes the whole window; the ledger already records every judgment, so the founder can audit them later and overturn any."
reversibility: "Reversible: every decision lands as a small pull request through the usual gates, the record can be superseded, and nothing under a hard invariant or founder reservation is touched."
