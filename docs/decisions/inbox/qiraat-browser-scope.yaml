question: "The founder asked for a browser of «قراءات القرآن والرسم الإملائي والخطوط والتنقيط». Should the browser carry only those four named subjects literally (canonical readings, ordinary/imla'i spelling, scripts, dotting), or also the subjects the sources treat as inseparable from them: the seven ahruf, the readers and transmitters, the collection of the Qur'an and the codices, and the 'Uthmanic rasm as a whole?"
class: "content"
lane: "qiraat"
options: ["literal four subjects only", "seven topics: ahruf, readings, readers, codex, rasm, naqt, khatt — with ritual-prayer recitation, abrogation (naskh) and general writing kept out", "everything about reciting or writing in any sense"]
evidence: ["docs/plan/60-qiraat-browser.md §7 (the agent chose the second option: the sources discuss imla'i spelling only as the alternative to the 'Uthmanic rasm, and the readings only through their readers, the ahruf report and the codices; reversible by removing a topic from QIRAAT_TOPICS and its tags)", "docs/engineering/52-qiraat-browser-requirements.md §0"]
