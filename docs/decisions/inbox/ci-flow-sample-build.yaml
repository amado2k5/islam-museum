question: "CI flow for pull requests (docs/engineering/46-ci-flow-proposal.md): the founder approved the proposal as written in chat on 13 November 2026. Its implementation left choices to the agent: how large the sample of record pages is, whether the release notes bump the site version, and whether the new full link check of main may fail a build run. What applies?"
class: "process"
lane: "build-deploy-performance"
options:
  - "100 records per class and 20 hadith chapters, evenly spaced by id, plus the pinned and the changed records; release notes under the current version with no bump (a bump rewrites every page for a change no reader sees); the full link check in its own workflow, so it never changes which build a deploy takes"
  - "a larger sample, a patch version bump, and the link check as a step of build.yml that fails the build run"
evidence:
  - "founder in chat, 13 November 2026: 'Approve as written' (docs/engineering/46-ci-flow-proposal.md)"
  - "build run 43425447215: the entity page and the hadith chapter page are 186,672 of 202,274 pages and 1,240 of 1,400 seconds of rendering"
  - "probe runs 43442771303, 43442860707, 43442884031, 43442910935: concurrency.queue accepts an expression; with three pushes one build ran, the middle one was cancelled while waiting, the newest waited"
  - "docs/engineering/15-release-notes-and-versioning.md; AGENTS.md 'Keep deploys small'"
proposed_action: "implement the first option; no deploy workflow is touched and no deploy is started"
