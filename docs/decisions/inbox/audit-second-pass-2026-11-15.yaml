question: "Audit second pass: (1) may a date from the enrichment pass that agrees with a Wikidata statement carrying no reference be kept and cited to Wikidata; (2) when a record's date and its Wikidata item disagree by more than a century, which of the two is wrong; (3) from what source does the Hadith Library take its division into books; (4) which proposed relations for unconnected records are applied."
class: "editorial"
lane: "audit-fixes"
options: ["cite the agreeing dates to the recorded Wikidata revision", "leave them untested", "remove the id when the item is another subject, remove the date when the item bears the record's own name", "leave both", "books from the dataset the reports came from", "books from a printed edition", "apply a relation only when the record's own text states it"]
evidence: ["AGENTS.md, Sources: Wikidata is a source for dates when the fact is taken from a recorded revision and cited", "docs/audit/data/dates-wikidata-ledger.json", "docs/audit/audit-fixes-2026-11-13.md, section 'Second pass, 15 November 2026'", "scripts/audit/hadith-books.py", "data/source/hadith-api-fawazahmed0.yaml", "data/source/hadith-json-ahmedbaset.yaml"]
verdict: "Agent (Claude Code, claude-fable-5-2), 15 November 2026, under the founder's instruction in chat to complete what the audit left open. (1) Cited: 1,085 dates that agree within one year with the record's Wikidata item are kept, with the item, the property and the revision read on 13 November named in the note, and the words 'a statement without a reference' kept in it. The earlier reading that required the statement to carry a reference was stricter than AGENTS.md. (2) 32 ids removed where the item is not the record's subject (a non-human item, or another person by name and description); 89 dates removed where the item bears the record's own name and gives a year more than a century away; 13 records where neither reading is safe are left untouched and listed. (3) The division of the hadith-api dataset, because the museum's reports and their numbers come from it; Arabic titles from the hadith-json dataset, matched by English name; a report is filed only when its own text matches the dataset's report of that number. (4) 494 of 507 mechanically verified proposals applied; 13 set aside where the text only ascribes, the reading was loose, or a date conflicted."
rationale: "Each choice keeps to what a record or a named source states and leaves a trace: the date notes name the revision and say the statement has no reference; removed lines are in the ledger; the book records say their division is the dataset's and that printed editions divide the collections differently; each new relation carries the sentence that states it. Where the evidence does not decide (13 Wikidata ids, 37 unmatched reports, 13 proposed relations), nothing was changed."
reversibility: "Reversible: every removed date and id is recorded with its line in docs/audit/data/dates-wikidata-ledger.json or the audit ledger; the book records and part_of relations are regenerated by one script; the relations carry a note that identifies them."
