question: "Gemini returned verdicts on the pending-corrections ledger (14 Nov 2026). Should its sections 1 to 5 be applied only where each claim is independently confirmed against a primary source read by the worker, and left unchanged and logged as unresolved otherwise, with section 6 kept as advice for the founder?"
class: "content"
lane: "corrections"
options: ["apply only independently verified items and log the rest as unresolved", "apply all Gemini verdicts as given", "apply none"]
evidence: ["PRs 6865, 6868, 6888, 6893, 6897, 6903, 6917", "Applied: ibn-al-sikkit, ibn-mattawayh, al-tamirtashi, zayn-al-abidin-work-14608, said-ibn-al-mubarak, ibn-al-dahan, ibrahim-ibn-sad-ibn-abi-waqqas, ibrahim-ibn-abdallah-physician (partly), muhammad-ibn-mustafa-al-bakri (son's dates), arabzade, abd-allah-ibn-yusuf (al-Tinnisi) and new al-Jurjani, abd-al-haqq-dihlawi (note), jafar-ibn-ulba, ahmad-ibn-al-nadr (partly), section 2 items 2.1-2.6, 2.8, 2.9, 2.11, 2.12, notes on 2.3, 2.4, 2.13, section 3 items 3.1, 3.6, 3.13 and confirmations of the rest, VIAF 4.1, GeoNames 4.2a-e, 31 Biblissima links, mehmed-rashid birth 1670", "Rejected Gemini: 1.8 (card is the son; father already has own card), 1.4 (Safavid illustrator, not the Imam), 1.5 nisba al-Hammami not al-Jammal, 3.9 Ibn Kharrash 242 AH stands (283 is Abd al-Rahman ibn Yusuf), 3.1 not a typo, 1.1 Shi'a label unsupported, 5.1 birth c. 675, 1.10b birth 919 AH, 4.2e Sfax 280566 is a spring", "Unresolved: 1.9 ahmad-ibn-yusuf-al-misri (may be two men), 1.10c Shi'a label, 1.10f, 1.11 Ibadi label, 2.7, 2.10, 3.17 (1204 stands), 5.22 floruit, al-Zuhri 108-183 AH, John of Damascus 675/676"]
