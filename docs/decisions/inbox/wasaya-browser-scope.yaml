question: "The founder asked for a browser of «وصايا الأنبياء والمرسلين والصالحين والأئمة والتابعين والخلفاء والصحابة قبل وفاتهم ومورثاتهم وأثرهم ومراقدهم». How wide is each of its four named subjects: does «وصايا قبل وفاتهم» include the deathbed and last words themselves; does «مورثاتهم» include the jurists' general law of inheritance shares; and may a shrine attributed to a prophet or a Companion be listed as that person's grave?"
class: "content"
lane: "wasaya"
options: ["literal: only texts titled a wasiyya, only estates, only relics, only graves the sources agree on", "five topics — wasiyya, ihtidar (the last hours), mirath (estates of named people and the Prophet's words on the prophets' inheritance, not the general law of shares), athar, marqad — with every identification of a grave attributed to the source that makes it and no ruling on visiting graves or on relics", "everything about death, inheritance law, graves and relics in any sense"]
evidence: ["docs/plan/62-wasaya-browser.md §7 (the agent chose the second option: the sources tell the testament together with the deathbed; the Muwatta's book of shares alone added about 70 passages of pure law under the wider reading; attributed shrines are existing museum records and are listed as attributions; reversible by removing a topic from WASAYA_TOPICS, one line in AR_MIRATH, or a tag)", "docs/engineering/54-wasaya-browser-requirements.md §0", "scripts/wasaya.ts"]
