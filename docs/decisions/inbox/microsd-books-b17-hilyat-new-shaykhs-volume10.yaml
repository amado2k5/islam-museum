question: "Hilyat al-Awliya vol. 10 notices 462 (Abu Turab al-Nakhshabi, the transmitter of Hatim al-Asamm's teaching; the notice gives no personal name and no death year) and 649 (Muhammad ibn Ulayyan al-Nasawi, whose notice is short and all related by al-Sulami through one intermediary): create draft person records from these single notices, with roles [mystic] and no faith or tradition value because the notices state none?"
