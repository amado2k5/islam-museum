map:
  - title: { ar: "سنة الابتلاء والفتنة", en: "The Law of Trial" }
    range: [1, 13]
    family: faith
    summary:
      ar: "افتتاح صريح: لا يُترك الناس بدعوى الإيمان دون امتحان، ليتميز الصادق من الكاذب والمنافق."
      en: "A blunt opening: people are not left alone on a mere claim of faith; they must be tested so the truthful stand out from the liars."
    children:
