- title:
    ar: مثل العنكبوت والصبر على الفتن
    en: The Spider's Parable and Endurance
    tr: Bir örümcek gibi ve ayartmalarda sabır
    id: Seperti laba-laba dan sabar dalam godaan
  range:
  - 41
  - 69
  family: faith
  summary:
    ar: 'مثل الآلهة المزعومة كبيت العنكبوت، ثم وصايا الثبات: الصلاة، والهجرة، والتوكل، والجهاد في الله.'
    en: 'The false gods likened to a spider''s house; then counsels of steadfastness: prayer, emigration, trust, striving in Allah.'
    tr: 'Örümcek ağı gibi sözde tanrılar gibi, sonra kararlılık emirleri: dua, göç, Tanrı''ya güvenme ve Tanrı''ya çalışma.'
    id: 'Seperti yang disebut dewa seperti jaring laba-laba, lalu perintah keteguhan: doa, migrasi, ketergantungan pada Tuhan, dan berjuang dalam Tuhan.'
