    ar: سنة الابتلاء والفتنة
    en: The Law of Trial
    tr: Sınav ve sıkıntı yılı
    id: Tahun ujian dan kesusahan
  range:
  - 1
  - 13
  family: faith
  summary:
    ar: 'افتتاح صريح: لا يُترك الناس بدعوى الإيمان دون امتحان، ليتميز الصادق من الكاذب والمنافق.'
    en: 'A blunt opening: people are not left alone on a mere claim of faith; they must be tested so the truthful stand out from the liars.'
    tr: 'Açık bir giriş: İnsanları inanç iddiasını test etmeden bırakmaz, böylece doğruyu yalancı ve ikiyüzlüden ayırt eder.'
    id: 'Pembukaan yang jelas: Dia tidak meninggalkan orang tanpa menguji klaim iman, sehingga yang benar dapat dibedakan dari yang berbohong dan munafik.'
