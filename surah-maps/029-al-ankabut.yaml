      - { title: { ar: "فتنة الوالدين", en: "The Trial of Parents" }, range: [8, 8] }
      - { title: { ar: "المنافقون عند الفتنة", en: "The Hypocrites Under Trial" }, range: [10, 13] }
  - title: { ar: "قصص الأنبياء وابتلاؤهم", en: "The Prophets and Their Trials" }
    range: [14, 40]
    family: stories
    summary:
      ar: "نماذج الابتلاء في الأمم السابقة: كل نبي ابتُلي في قومه، فصبر وثبت حتى جاء نصر الله."
      en: "Models of trial among past nations: every prophet was tested by his people, endured, and was vindicated."
    children:
      - { title: { ar: "نوح", en: "Noah" }, range: [14, 15] }
      - { title: { ar: "إبراهيم", en: "Abraham" }, range: [16, 27] }
      - { title: { ar: "لوط", en: "Lot" }, range: [28, 35] }
      - { title: { ar: "شعيب", en: "Shuayb" }, range: [36, 37] }
      - { title: { ar: "عاد وثمود وقارون وفرعون", en: "Ad, Thamud, Qarun and Pharaoh" }, range: [38, 40] }
  - title: { ar: "مثل العنكبوت والصبر على الفتن", en: "The Spider's Parable and Endurance" }
    range: [41, 69]
    family: faith
    summary:
      ar: "مثل الآلهة المزعومة كبيت العنكبوت، ثم وصايا الثبات: الصلاة، والهجرة، والتوكل، والجهاد في الله."
      en: "The false gods likened to a spider's house; then counsels of steadfastness: prayer, emigration, trust, striving in Allah."
    children:
