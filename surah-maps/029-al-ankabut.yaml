  - 40
  family: stories
  summary:
    ar: 'نماذج الابتلاء في الأمم السابقة: كل نبي ابتُلي في قومه، فصبر وثبت حتى جاء نصر الله.'
    en: 'Models of trial among past nations: every prophet was tested by his people, endured, and was vindicated.'
    tr: 'Önceki uluslardaki sınavlara örnekler: Her peygamber kendi halkı arasında sınandı, bu yüzden Allah''ın yardımı gelene kadar sabırlı ve kararlıydı.'
    id: 'Contoh cobaan di bangsa-bangsa sebelumnya: Setiap nabi diuji di antara umatnya, jadi ia sabar dan teguh sampai pertolongan Tuhan datang.'
