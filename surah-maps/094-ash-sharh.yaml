map:
- title:
    ar: ألم نشرح
    en: Did We Not Expand
    tr: Açıklamadık mı?
    id: Bukankah kami sudah jelaskan?
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: ألم نشرح لك صدرك ووضعنا عنك وزرك الذي أنقض ظهرك ورفعنا لك ذكرك.
    en: Did We not expand your breast, remove the burden that weighed down your back, and raise high your mention?
    tr: Göğsünü sana açmadık mı, yükünü kaldırmadık ve hatırlamanı yükseltmedik mi?
    id: Bukankah kami membuka dadamu untukmu, menghilangkan bebanmu, dan mengangkat ingatanmu?
  children: []
- title:
    ar: إن مع العسر يسرا
    en: With Hardship Comes Ease
    tr: Zorlukla birlikte kolaylık gelir
    id: Dengan kesulitan datang kemudahannya
  range:
  - 5
  - 8
  family: faith
  summary:
    ar: فإن مع العسر يسرا إن مع العسر يسرا — مكررة للتأكيد — فإذا فرغت فانصب وإلى ربك فارغب.
    en: 'With hardship comes ease — indeed with hardship comes ease, stated twice for emphasis — then: when you are free, labor on, and to your Lord turn in longing.'
    tr: Gerçekten de, zorlukla birlikte kolaylık gelir. Gerçekten de, zorlukla birlikte kolaylık gelir—vurgulamak için tekrar edersin. Bitirdiğinde kur ve Rab'bine ada.
    id: Memang, dengan kesulitan datang kemudahan. Memang, dengan kesulitan datang kemudahan—diulang untuk menekankan. Jadi ketika kamu selesai, menetap, dan untuk Tuhanmu kamu mendedikasikan.
  children: []
