map:
  - title: { ar: "ألم نشرح", en: "Did We Not Expand" }
    range: [1, 4]
    family: faith
    summary:
      ar: "ألم نشرح لك صدرك ووضعنا عنك وزرك الذي أنقض ظهرك ورفعنا لك ذكرك."
      en: "Did We not expand your breast, remove the burden that weighed down your back, and raise high your mention?"
    children: []
  - title: { ar: "إن مع العسر يسرا", en: "With Hardship Comes Ease" }
    range: [5, 8]
    family: faith
    summary:
      ar: "فإن مع العسر يسرا إن مع العسر يسرا — مكررة للتأكيد — فإذا فرغت فانصب وإلى ربك فارغب."
      en: "With hardship comes ease — indeed with hardship comes ease, stated twice for emphasis — then: when you are free, labor on, and to your Lord turn in longing."
    children: []
