- title:
    ar: قرب الساعة والرد على المكذبين
    en: The Nearness of the Hour and Answering the Deniers
    tr: Saat yaklaşıyor ve inkârcılara verilen yanıt da yaklaşıyor.
    id: Waktunya sudah dekat, dan respons terhadap para penyangkal sudah dekat.
  range:
  - 25
  - 30
  family: faith
  summary:
    ar: 'ختام السورة بالرد على سؤال المكذبين متى هذا الوعد: العلم عند الله وحده، فإذا رأوه قريبا ساءت وجوه الكافرين، وتحديات متتالية: من يجير الكافرين إن أهلك الله المؤمنين، ومن يأتي بالماء المعين إن غار
      ماؤكم.'
    en: 'The surah closes answering the deniers'' question ''when is this promise?'': knowledge belongs to Allah alone, and when they see it near, the disbelievers'' faces will darken — followed by successive
      challenges: who will shelter the disbelievers if Allah destroys or spares the believers, and who will bring flowing water if yours sinks away.'
    tr: 'Surenin sonu, inkarcılara şu soruya cevap vererek: Bu vaat ne zaman? Bilim yalnızca Allah''a aittir. Yakında görünce kâfirlerin yüzleri endişelenir ve ardışık sınavlar ortaya çıkar: Kâfirleri kim
      koruyacak? Gerçekten Allah müminleri yok etti ve suyun boğulduysa kim sabit su getirecek?'
    id: 'Akhir surah dengan menjawab pertanyaan para penyangkal: Kapan janji ini? Pengetahuan hanya ada pada Allah. Ketika mereka melihatnya dekat, wajah orang kafir menjadi gelisah, dan tantangan berturut-turut
      muncul: Siapa yang akan melindungi orang kafir? Sesungguhnya, Allah telah menghancurkan orang beriman, dan siapa yang akan membawa air tetap jika airmu tenggelam.'
  children:
  - title:
      ar: متى هذا الوعد
      en: '''When Is This Promise?'''
      tr: Bu söz ne zaman?
      id: Kapan janji ini?
    range:
    - 25
    - 27
  - title:
      ar: قل أرأيتم
      en: '''Say: Have You Considered…'''
      tr: Gördüğünü söyle
      id: Katakan apa yang kamu lihat
    range:
    - 28
    - 30
