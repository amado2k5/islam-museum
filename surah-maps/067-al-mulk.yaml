surah: 67
slug: al-mulk
sources_consulted:
  - "kuttab.com — Surah Al-Mulk mind map (4 blocks: 1-5 / 6-15 / 16-22 / 23-30)"
  - "تفسير المراغي — سورة الملك (verses 6-11 treated as one unit: the Fire scene)"
  - "islamweb.net — في ظلال القرآن: تفسير سورة الملك (Sayyid Qutb)"
  - "soubha.com — Michel Cuypers rhetorical analysis (two movements: 1-22 / 23-30)"
map:
  - title: { ar: "تبارك الذي بيده الملك", en: "Blessed Is He in Whose Hand Is Dominion" }
    range: [1, 5]
    family: faith
    summary:
      ar: "افتتاح السورة بتمجيد الملك القدير الذي خلق الموت والحياة ليبلو العباد، وخلق سبع سماوات طباقا بلا تفاوت، وزين السماء الدنيا بمصابيح وجعلها رجوما للشياطين."
      en: "The surah opens glorifying the Sovereign, All-Powerful, who created death and life to test His servants, fashioned seven heavens in layers without flaw, and adorned the lowest heaven with lamps made into missiles against the devils."
    children:
      - { title: { ar: "خلق الموت والحياة للابتلاء", en: "Death and Life Created as a Test" }, range: [1, 2] }
      - { title: { ar: "سبع سموات بلا تفاوت", en: "Seven Heavens Without Flaw" }, range: [3, 4] }
      - { title: { ar: "زينة السماء ورجوم الشياطين", en: "The Adorned Sky and Missiles at Devils" }, range: [5, 5] }
  - title: { ar: "عذاب جهنم وحوار الخزنة", en: "The Punishment of Hell and the Keepers' Question" }
    range: [6, 11]
    family: faith
    summary:
      ar: "مشهد الكافرين في جهنم: شهيقها وهي تفور، وسؤال خزنتها ألم يأتكم نذير، واعتراف أهلها بأن النذير جاءهم فكذبوه وتمنوا لو كانوا يسمعون أو يعقلون."
      en: "The scene of the disbelievers in Hell: its inhaling roar as it boils over, the keepers' question 'did no warner come to you?', and the inmates' confession that a warner did come but they denied him — wishing they had listened or reasoned."
    children:
      - { title: { ar: "عذاب جهنم", en: "The Punishment of Hell" }, range: [6, 7] }
      - { title: { ar: "سؤال الخزنة", en: "The Keepers' Question" }, range: [8, 9] }
      - { title: { ar: "اعتراف أهل النار", en: "The Confession of Hell's People" }, range: [10, 11] }
  - title: { ar: "علم الله ورزقه وآياته", en: "Allah's Knowledge, Provision, and Signs" }
    range: [12, 24]
    family: faith
    summary:
      ar: "مقابل المصير السابق: مغفرة وأجر كبير للذين يخشون ربهم بالغيب، ثم براهين على العلم والقدرة والرزق — علم السر والجهر، والأرض الذلول، والتهديد بالخسف، والطير الممسوك، ومثل الماشيين، ونعم السمع والأبصار والأفئدة."
      en: "The contrasting fate: forgiveness and great reward for those who fear their Lord unseen; then proofs of knowledge, power, and provision — knowledge of the hidden and declared, the tractable earth, the threat of being swallowed by it, the birds held aloft, the parable of the two walkers, and the gifts of hearing, sight, and hearts."
    children:
      - { title: { ar: "الذين يخشون ربهم بالغيب", en: "Those Who Fear Their Lord Unseen" }, range: [12, 12] }
      - { title: { ar: "علم السر والجهر", en: "Knowledge of the Hidden and Declared" }, range: [13, 14] }
      - { title: { ar: "الأرض ذلولا والرزق", en: "The Tractable Earth and Provision" }, range: [15, 15] }
      - { title: { ar: "التهديد بالخسف والحاصب", en: "The Threat of Swallowing and Storm" }, range: [16, 18] }
      - { title: { ar: "الطير والجند والرزق", en: "Birds, Helpers, and Provision" }, range: [19, 21] }
      - { title: { ar: "مثل الماشيين", en: "The Parable of the Two Walkers" }, range: [22, 22] }
      - { title: { ar: "السمع والأبصار والحشر", en: "Hearing, Sight, and the Gathering" }, range: [23, 24] }
  - title: { ar: "قرب الساعة والرد على المكذبين", en: "The Nearness of the Hour and Answering the Deniers" }
    range: [25, 30]
    family: faith
    summary:
      ar: "ختام السورة بالرد على سؤال المكذبين متى هذا الوعد: العلم عند الله وحده، فإذا رأوه قريبا ساءت وجوه الكافرين، وتحديات متتالية: من يجير الكافرين إن أهلك الله المؤمنين، ومن يأتي بالماء المعين إن غار ماؤكم."
      en: "The surah closes answering the deniers' question 'when is this promise?': knowledge belongs to Allah alone, and when they see it near, the disbelievers' faces will darken — followed by successive challenges: who will shelter the disbelievers if Allah destroys or spares the believers, and who will bring flowing water if yours sinks away."
    children:
      - { title: { ar: "متى هذا الوعد", en: "'When Is This Promise?'" }, range: [25, 27] }
      - { title: { ar: "قل أرأيتم", en: "'Say: Have You Considered…'" }, range: [28, 30] }
