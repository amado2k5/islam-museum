- title:
    ar: عذاب جهنم وحوار الخزنة
    en: The Punishment of Hell and the Keepers' Question
    tr: Cehennemin işkencesi ve hazinenin diyaloğu
    id: Siksaan neraka dan dialog dari kas
  range:
  - 6
  - 11
  family: faith
  summary:
    ar: 'مشهد الكافرين في جهنم: شهيقها وهي تفور، وسؤال خزنتها ألم يأتكم نذير، واعتراف أهلها بأن النذير جاءهم فكذبوه وتمنوا لو كانوا يسمعون أو يعقلون.'
    en: 'The scene of the disbelievers in Hell: its inhaling roar as it boils over, the keepers'' question ''did no warner come to you?'', and the inmates'' confession that a warner did come but they denied
      him — wishing they had listened or reasoned.'
    tr: 'Cehennemdeki kâfirlerin sahnesi: kaynarken nefes nefese, bekçisinin ''Sana bir uyarı göndermedi mi?'' sorusu ve halkının uyarıcının onlara geldiğini, ama bunu inkar ettiğini ve keşke duymuş ya
      da anlamış olmayı dilediğini kabul etmesi.'
    id: 'Adegan para kafir di Neraka: ia terengah-engah saat mendidih, pertanyaan tentang penjaganya ''Belum mengirimkan peringatan kepadamu,'' dan pengakuan dari rakyatnya bahwa sang pemberi peringatan
      telah datang kepada mereka, tetapi mereka menyangkalnya dan berharap mereka mendengar atau mengerti.'
