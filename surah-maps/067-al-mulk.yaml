- title:
    ar: علم الله ورزقه وآياته
    en: Allah's Knowledge, Provision, and Signs
    tr: Tanrı ona geçim kaynağını ve işaretlerini öğretti
    id: Tuhan mengajarinya penghidupan dan tanda-tandanya
  range:
  - 12
  - 24
  family: faith
  summary:
    ar: 'مقابل المصير السابق: مغفرة وأجر كبير للذين يخشون ربهم بالغيب، ثم براهين على العلم والقدرة والرزق — علم السر والجهر، والأرض الذلول، والتهديد بالخسف، والطير الممسوك، ومثل الماشيين، ونعم السمع والأبصار
      والأفئدة.'
    en: 'The contrasting fate: forgiveness and great reward for those who fear their Lord unseen; then proofs of knowledge, power, and provision — knowledge of the hidden and declared, the tractable earth,
      the threat of being swallowed by it, the birds held aloft, the parable of the two walkers, and the gifts of hearing, sight, and hearts.'
    tr: 'Önceki kader karşılığında: Rabbinden görünmez şekilde korkanlar için bağışlama ve büyük ödül, ardından bilgi, güç ve besin kanıtları — gizli ve kamu bilgisi bilgisi, alçakgönüllülük toprağı, yutma
      tehdidi, yakalanan kuş, hayvanların örneği ve mükemmel işitme, görme ve kalpler.'
    id: 'Sebagai imbalan atas nasib sebelumnya: pengampunan dan ganjaran besar bagi mereka yang takut pada Tuhan mereka tanpa terlihat, lalu bukti pengetahuan, kekuatan, dan kelangsungan — pengetahuan rahasia
      dan pengetahuan umum, bumi kerendahan hati, ancaman menelan, burung yang tertangkap, contoh ternak, dan pendengaran, penglihatan, serta hati yang sangat baik.'
  children:
  - title:
      ar: الذين يخشون ربهم بالغيب
      en: Those Who Fear Their Lord Unseen
      tr: Görünmeyen Rabbilerinden korkanlar
      id: Mereka yang takut pada Tuhan mereka secara tak terlihat
