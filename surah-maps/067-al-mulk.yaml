surah: 67
slug: al-mulk
sources_consulted:
- 'kuttab.com — Surah Al-Mulk mind map (4 blocks: 1-5 / 6-15 / 16-22 / 23-30)'
- 'تفسير المراغي — سورة الملك (verses 6-11 treated as one unit: the Fire scene)'
- 'islamweb.net — في ظلال القرآن: تفسير سورة الملك (Sayyid Qutb)'
- 'soubha.com — Michel Cuypers rhetorical analysis (two movements: 1-22 / 23-30)'
map:
- title:
    ar: تبارك الذي بيده الملك
    en: Blessed Is He in Whose Hand Is Dominion
    tr: Kralın elinde olan kutsanmıştır
    id: Diberkatilah Dia yang di tangannya Raja ada
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: افتتاح السورة بتمجيد الملك القدير الذي خلق الموت والحياة ليبلو العباد، وخلق سبع سماوات طباقا بلا تفاوت، وزين السماء الدنيا بمصابيح وجعلها رجوما للشياطين.
    en: The surah opens glorifying the Sovereign, All-Powerful, who created death and life to test His servants, fashioned seven heavens in layers without flaw, and adorned the lowest heaven with lamps
      made into missiles against the devils.
    tr: Bölüm, ölüm ve yaşamı hizmetkârlarını rahatsız etmek için yaratan, yedi gökyüzünü katmanlar halinde varyantsız yaratan, en alt cenneti lambalarla süsleyen ve şeytanlar için bir yer yapan Yüce Kral'ı
      yücelterek başlar.
    id: Bab ini dibuka dengan memuliakan Raja Yang Maha Kuasa yang menciptakan kematian dan kehidupan untuk menderita para hamba-Nya, menciptakan tujuh langit dalam lapisan tanpa perubahan, menghias langit
      terendah dengan lampu, dan menjadikannya tempat bagi para iblis.
