map:
- title:
    ar: خلق الإنسان وتخييره
    en: Man's Creation and His Choice
    tr: İnsanın yaratılışı ve seçimi
    id: Penciptaan manusia dan pilihannya
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: افتتاح السورة بسؤال الدهر الذي لم يكن الإنسان فيه شيئا مذكورا، ثم خلقه من نطفة أمشاج للابتلاء، وهدايته الطريق بين الشكر والكفر، ووعيد الكافرين بالسلاسل والسعير.
    en: The surah opens with the age when man was nothing worth mentioning, then his creation from a mixed drop for trial, his guidance to the way of gratitude or ingratitude, and the warning of chains
      and blaze for the disbelievers.
    tr: Bölüm, insanın maddeden bahsetmediği zamanla başlar; sonra onu denemek için karışık sıvıdan bir sperm damlasından yaratmış, minnettarlık ile inançsızlık arasındaki yolda yönlendirmiş ve kâfirleri
      zincirler ve alevli ateşle uyarmıştır.
    id: Bab dibuka dengan menanyakan tentang waktu, di mana manusia tidak menyebutkan materi, lalu Dia menciptakannya dari tetesan sperma campuran cairan untuk diuji, membimbingnya di jalan antara rasa
      syukur dan ketidakpercayaan, dan memperingatkan orang-orang kafir dengan rantai dan api yang menyala.
