- title:
    ar: تنزيل القرآن والصبر والذكر
    en: The Gradual Revelation, Patience, Remembrance
    tr: Kur'an'ın Vahiyi, Sabır ve Anma
    id: Wahyu Al-Qur'an, Kesabaran, dan Peringatan
  range:
  - 23
  - 26
  family: faith
  summary:
    ar: 'نزلنا عليك القرآن تنزيلا: فاصبر لحكم ربك ولا تطع آثما أو كفورا، واذكر اسم ربك بكرة وأصيلا واسجد له وسبحه طويلا.'
    en: 'We sent down the Quran in stages: so be patient with your Lord''s decree, obey no sinner or ingrate, remember your Lord''s name morning and evening, prostrate to Him and glorify Him long.'
    tr: 'Biz size Kur''an''ı bir şekilde indirdik: Rabbinizin yargısına sabredin, günahkara ya da kâfire itaat etmeyin, sabah ve akşam Rabbinizin adını hatırlayın, Ona secde edin ve uzun süre O''nu yüceltin.'
    id: 'Kami telah mewahyukan Al-Qur''an kepadamu dengan cara yang diwahyukan: Maka bersabarlah dengan hukuman Tuhanmu dan janganlah taat pada orang berdosa atau kafir, dan ingatlah nama Tuhanmu pagi dan
      sore, sujudlah kepada-Nya, dan memuliakan-Nya untuk waktu yang lama.'
  children: []
- title:
    ar: حب الدنيا ومشيئة الله
    en: Love of This World and Allah's Will
    tr: Dünyaya ve Tanrı'nın iradesine olan sevgi
    id: Cinta pada dunia dan kehendak Tuhan
  range:
  - 27
  - 31
  family: faith
  summary:
    ar: 'خاتمة السورة: هؤلاء يحبون العاجلة ويذرون يوما ثقيلا، والقرآن تذكرة لمن شاء، وما تشاءون إلا أن يشاء الله، يدخل من يشاء في رحمته.'
    en: 'The surah''s close: these love the fleeting and leave behind a heavy Day; the Quran is a reminder for whoever wills — and you will not except as Allah wills; He admits whom He wills into His mercy.'
    tr: 'Surenin Sonucu: Bu insanlar çalıyı sever ve ağır bir gün bırakırlar. Kur''an, O''nun istediği kişiye bir hatırlatıcıdır, siz ise sadece Allah''ın isteği dilediğinizde dilediğinizden başka; O, istediğini
      merhametine kabul eder.'
    id: 'Kesimpulan Surah: Orang-orang ini mencintai yang cepat dan meninggalkan hari yang berat. Al-Qur''an adalah pengingat untuk siapa yang Dia kehendaki, dan kamu tidak menginginkan kecuali Allah yang
      menghendakkan; Dia menerima siapa yang Dia kehendaki ke dalam rahmat-Nya.'
  children: []
