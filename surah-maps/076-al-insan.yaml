map:
  - title: { ar: "خلق الإنسان وتخييره", en: "Man's Creation and His Choice" }
    range: [1, 4]
    family: faith
    summary:
      ar: "افتتاح السورة بسؤال الدهر الذي لم يكن الإنسان فيه شيئا مذكورا، ثم خلقه من نطفة أمشاج للابتلاء، وهدايته الطريق بين الشكر والكفر، ووعيد الكافرين بالسلاسل والسعير."
      en: "The surah opens with the age when man was nothing worth mentioning, then his creation from a mixed drop for trial, his guidance to the way of gratitude or ingratitude, and the warning of chains and blaze for the disbelievers."
    children:
      - { title: { ar: "الخلق والهداية", en: "Creation and Guidance" }, range: [1, 3] }
      - { title: { ar: "وعيد الكافرين", en: "The Warning to the Disbelievers" }, range: [4, 4] }
  - title: { ar: "جزاء الأبرار", en: "The Reward of the Righteous" }
    range: [5, 22]
    family: faith
    summary:
      ar: "أطول مقطع في السورة: صفات الأبرار (الوفاء بالنذر وإطعام الطعام) وجزاؤهم في الجنة: الشراب واللباس والولدان، ختاما بأن سعيهم مشكور."
      en: "The surah's longest passage: the traits of the righteous — fulfilling vows and feeding others — and their reward in Paradise: drink, garments, and attendants, closing with their striving appreciated."
    children:
      - { title: { ar: "شراب الكافور", en: "The Camphor Drink" }, range: [5, 6] }
      - { title: { ar: "أعمال الأبرار", en: "The Deeds of the Righteous" }, range: [7, 10] }
      - { title: { ar: "الوقاية والنعيم", en: "Protection and Bliss" }, range: [11, 14] }
      - { title: { ar: "آنية الفضة", en: "Vessels of Silver" }, range: [15, 16] }
      - { title: { ar: "شراب الزنجبيل وسلسبيل", en: "The Ginger Drink and Salsabil" }, range: [17, 18] }
      - { title: { ar: "الولدان واللباس والشراب الطهور", en: "Attendants, Garments, and the Pure Drink" }, range: [19, 21] }
      - { title: { ar: "السعي المشكور", en: "The Appreciated Striving" }, range: [22, 22] }
  - title: { ar: "تنزيل القرآن والصبر والذكر", en: "The Gradual Revelation, Patience, Remembrance" }
    range: [23, 26]
    family: faith
    summary:
      ar: "نزلنا عليك القرآن تنزيلا: فاصبر لحكم ربك ولا تطع آثما أو كفورا، واذكر اسم ربك بكرة وأصيلا واسجد له وسبحه طويلا."
      en: "We sent down the Quran in stages: so be patient with your Lord's decree, obey no sinner or ingrate, remember your Lord's name morning and evening, prostrate to Him and glorify Him long."
    children: []
  - title: { ar: "حب الدنيا ومشيئة الله", en: "Love of This World and Allah's Will" }
    range: [27, 31]
    family: faith
    summary:
      ar: "خاتمة السورة: هؤلاء يحبون العاجلة ويذرون يوما ثقيلا، والقرآن تذكرة لمن شاء، وما تشاءون إلا أن يشاء الله، يدخل من يشاء في رحمته."
      en: "The surah's close: these love the fleeting and leave behind a heavy Day; the Quran is a reminder for whoever wills — and you will not except as Allah wills; He admits whom He wills into His mercy."
    children: []
