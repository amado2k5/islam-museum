- title:
    ar: جزاء الأبرار
    en: The Reward of the Righteous
    tr: Doğruların Ödülü
    id: Hadiah bagi Orang Benar
  range:
  - 5
  - 22
  family: faith
  summary:
    ar: 'أطول مقطع في السورة: صفات الأبرار (الوفاء بالنذر وإطعام الطعام) وجزاؤهم في الجنة: الشراب واللباس والولدان، ختاما بأن سعيهم مشكور.'
    en: 'The surah''s longest passage: the traits of the righteous — fulfilling vows and feeding others — and their reward in Paradise: drink, garments, and attendants, closing with their striving appreciated.'
    tr: 'Suredeki en uzun bölüm şudur: Doğru kişilerin özellikleri (yeminleri yerine getirme ve yiyecek verme) ve cennetteki ödülleri içki, giysi ve çocuklardır. Sonuç olarak, çabaları övülür.'
    id: 'Bagian terpanjang dalam surah adalah: Sifat-sifat orang benar (menepati sumpah dan memberi makan), dan ganjaran mereka di Surga adalah minuman, pakaian, dan anak-anak. Sebagai kesimpulan, usaha
      mereka dipuji.'
