map:
- title:
    ar: القسم ووقوع الدين
    en: The Oaths and the Inevitable Recompense
    tr: Yemin ve borcun oluşması
    id: Sumpah dan terjadinya utang
  range:
  - 1
  - 14
  family: faith
  summary:
    ar: قسم بالذاريات والحاملات والجاريات والمقسمات على أن ما توعدون لصادق وأن الدين لواقع، ثم وعيد المكذبين الخراصين بيوم الدين.
    en: Oaths by the scatterers, the bearers, the runners, and the distributors that what you are promised is true and the Recompense will occur, then a warning to the lying deniers of the Day of Recompense.
    tr: Dhariyat, taşıyıcılar, köleler ve bölünmüşler adına yemin etti, vaat ettiğinizin doğru olduğunu ve dinin gerçek olduğunu söyledi, ardından Kıyamet Günü'nün inkârcıları ve inkârcıları uyardı.
    id: Dia bersumpah demi Dhariyat, para pembawa, para budak, dan yang terpecah, menyatakan bahwa apa yang kamu janjikan adalah benar dan agama adalah kenyataan, lalu peringatan dari para penyangkal dan
      penyangkal Hari Penghakiman.
  children:
  - title:
      ar: الأقسام الأربعة
      en: The Four Oaths
      tr: Dört Bölüm
      id: Empat Bagian
    range:
    - 1
    - 6
  - title:
      ar: وعيد المكذبين بيوم الدين
      en: Warning the Deniers of the Day
      tr: Ve Kıyamet Günü'nde inkârcıların bayramı
      id: Dan pesta para penyangkal pada Hari Penghakiman
    range:
    - 7
    - 14
- title:
    ar: صفات المتقين
    en: Traits of the God-conscious
    tr: Tanrı korkusunun özellikleri
    id: Kualitas Orang yang Takut Tuhan
  range:
  - 15
  - 23
  family: faith
  summary:
    ar: 'المتقون في جنات وعيون: كانوا قبل ذلك محسنين، قليلا من الليل ما يهجعون، وفي أموالهم حق للسائل والمحروم، وفي الأرض والأنفس والسماء آيات للموقنين.'
    en: 'The God-conscious in gardens and springs: before that they did good, sleeping little at night, with a due in their wealth for the asker and the deprived; in the earth, in themselves, and in the
      sky are signs for the certain.'
    tr: 'Bahçelerde ve kaynaklarda doğru olanlar: ondan önce iyilik yapanlardı; geceleri bir süre uyumazlardı, servetlerinde dilenciler ve yoksullar için, yeryüzünde ise yaşamlar ve gökler için bir hak
      vardır—kesin işaretlerdir.'
    id: 'Orang benar di taman dan mata air: sebelumnya, mereka adalah pelaku kebaikan; mereka tidak mau tidur malam sebentar, dan dalam kekayaan mereka ada hak bagi pengemis dan yang miskin, dan di bumi,
      hidup, dan langit—tanda bagi yang pasti.'
  children:
  - title:
      ar: نعيمهم وإحسانهم
      en: Their Bliss and Their Goodness
      tr: Onların mutluluğu ve nezaketi
      id: Kebahagiaan dan kebaikan mereka
    range:
    - 15
    - 19
  - title:
      ar: آيات الله في الكون
      en: Allah's Signs in the Cosmos
      tr: Evrendeki Tanrı'nın işaretleri
      id: Tanda-tanda Tuhan di alam semesta
    range:
    - 20
    - 23
- title:
    ar: ضيف إبراهيم
    en: Abraham's Guests
    tr: İbrahim Guest
    id: Ibrahim Guest
  range:
  - 24
  - 30
  family: stories
  summary:
    ar: 'ضيف إبراهيم المكرمون: العجل السمين، والخوف منهم، وبشراهم بغلام عليم، وعجب امرأته العجوز العقيم.'
    en: 'Abraham''s honored guests: the fat calf, his fear of them, their glad tidings of a knowledgeable boy, and his old barren wife''s amazement.'
    tr: 'İbrahim''in onurlu misafiri: şişman buzağı, onlardan duyduğu korku, bilgili bir çocuğun haberciliği ve kısır yaşlı eşinin hayranlığı.'
    id: 'Tamu kehormatan Ibrahim: anak sapi gemuk, ketakutan akan mereka, kabar gembira seorang anak yang berpengetahuan, dan keajaiban istrinya yang mandul.'
  children: []
- title:
    ar: هلاك قوم لوط
    en: The Destruction of Lot's People
    tr: Lut'un halkının yıkımı
    id: Kehancuran umat Lot
  range:
  - 31
  - 37
  family: stories
  summary:
    ar: الملائكة أرسلوا إلى قوم مجرمين بحجارة من طين مسومة، فأخرجوا المؤمنين، وتركوا فيها آية للذين يخافون العذاب الأليم.
    en: The angels were sent to a criminal people with marked stones of clay, the believers were brought out, and a sign was left for those who fear the painful punishment.
    tr: Melekler, işaretli kilden taşlarla bir halka suçlular gönderdiler, bu yüzden inananları kovdular ve acı cezadan korkanlar için onlara bir işaret bıraktılar.
    id: Para malaikat mengirim penjahat kepada sebuah bangsa dengan batu tanah liat yang ditandai, sehingga mereka mengusir para penganut dan meninggalkan tanda di dalamnya bagi mereka yang takut akan hukuman
      yang menyakitkan.
  children: []
- title:
    ar: عبر من الأمم الغابرة
    en: Lessons from Perished Nations
    tr: Geçmiş Uluslardan Dersler
    id: Pelajaran dari Negara-negara Masa Lalu
  range:
  - 38
  - 46
  family: stories
  summary:
    ar: 'آية في موسى وفرعون، وفي عاد إذ أرسل عليهم الريح العقيم، وفي ثمود إذ أخذتهم الصاعقة، وقوم نوح من قبل: كل كذب رسله فأخذه الله.'
    en: 'A sign in Moses and Pharaoh, in ''Ad when the barren wind was sent, in Thamud when the thunderbolt seized them, and Noah''s people before: each denied its messengers and Allah seized them.'
    tr: 'Musa ve Firavun hakkında, Aad''ın üzerlerine issız rüzgarı gönderdiğinde, Semud''un yıldırım onları yakaladığında ve Nuh''un komünde olduğu bir ayet: Elçilerinin her biri yalan söyledi, böylece
      Allah onu yakaladı.'
    id: 'Sebuah ayat tentang Musa dan Firaun, dan tentang ''Aad ketika Dia mengirim angin tandus ke atas mereka, dan tentang Thamud ketika petir menyambar mereka, dan umat Nuh sebelumnya: Setiap utusannya
      berbohong, maka Allah menangkapnya.'
  children:
  - title:
      ar: موسى وفرعون
