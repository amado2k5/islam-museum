map:
  - title: { ar: "القسم ووقوع الدين", en: "The Oaths and the Inevitable Recompense" }
    range: [1, 14]
    family: faith
    summary:
      ar: "قسم بالذاريات والحاملات والجاريات والمقسمات على أن ما توعدون لصادق وأن الدين لواقع، ثم وعيد المكذبين الخراصين بيوم الدين."
      en: "Oaths by the scatterers, the bearers, the runners, and the distributors that what you are promised is true and the Recompense will occur, then a warning to the lying deniers of the Day of Recompense."
    children:
      - { title: { ar: "الأقسام الأربعة", en: "The Four Oaths" }, range: [1, 6] }
      - { title: { ar: "وعيد المكذبين بيوم الدين", en: "Warning the Deniers of the Day" }, range: [7, 14] }
  - title: { ar: "صفات المتقين", en: "Traits of the God-conscious" }
    range: [15, 23]
    family: faith
    summary:
      ar: "المتقون في جنات وعيون: كانوا قبل ذلك محسنين، قليلا من الليل ما يهجعون، وفي أموالهم حق للسائل والمحروم، وفي الأرض والأنفس والسماء آيات للموقنين."
      en: "The God-conscious in gardens and springs: before that they did good, sleeping little at night, with a due in their wealth for the asker and the deprived; in the earth, in themselves, and in the sky are signs for the certain."
    children:
      - { title: { ar: "نعيمهم وإحسانهم", en: "Their Bliss and Their Goodness" }, range: [15, 19] }
      - { title: { ar: "آيات الله في الكون", en: "Allah's Signs in the Cosmos" }, range: [20, 23] }
  - title: { ar: "ضيف إبراهيم", en: "Abraham's Guests" }
    range: [24, 30]
    family: stories
    summary:
      ar: "ضيف إبراهيم المكرمون: العجل السمين، والخوف منهم، وبشراهم بغلام عليم، وعجب امرأته العجوز العقيم."
      en: "Abraham's honored guests: the fat calf, his fear of them, their glad tidings of a knowledgeable boy, and his old barren wife's amazement."
    children: []
  - title: { ar: "هلاك قوم لوط", en: "The Destruction of Lot's People" }
    range: [31, 37]
    family: stories
    summary:
      ar: "الملائكة أرسلوا إلى قوم مجرمين بحجارة من طين مسومة، فأخرجوا المؤمنين، وتركوا فيها آية للذين يخافون العذاب الأليم."
      en: "The angels were sent to a criminal people with marked stones of clay, the believers were brought out, and a sign was left for those who fear the painful punishment."
    children: []
  - title: { ar: "عبر من الأمم الغابرة", en: "Lessons from Perished Nations" }
    range: [38, 46]
    family: stories
    summary:
      ar: "آية في موسى وفرعون، وفي عاد إذ أرسل عليهم الريح العقيم، وفي ثمود إذ أخذتهم الصاعقة، وقوم نوح من قبل: كل كذب رسله فأخذه الله."
      en: "A sign in Moses and Pharaoh, in 'Ad when the barren wind was sent, in Thamud when the thunderbolt seized them, and Noah's people before: each denied its messengers and Allah seized them."
    children:
      - { title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }, range: [38, 40] }
      - { title: { ar: "عاد وثمود", en: "'Ad and Thamud" }, range: [41, 45] }
      - { title: { ar: "قوم نوح", en: "Noah's People" }, range: [46, 46] }
  - title: { ar: "أدلة القدرة والدعوة إلى التوحيد", en: "Proofs of Power and the Call to Tawhid" }
    range: [47, 60]
    family: faith
    summary:
      ar: "السماء بناها الله بأيد، والأرض فرشها، ومن كل شيء خلق زوجين، ففروا إلى الله ولا تجعلوا معه إلها آخر؛ وخلق الجن والإنس إلا ليعبدوه، وخاتمة بوعيد الظالمين."
      en: "Allah built the sky with might and spread the earth, creating pairs of everything — so flee to Allah and set no other god with Him; jinn and mankind were created only to worship Him; the surah closes warning the wrongdoers."
    children:
      - { title: { ar: "بناء السماء ومد الأرض", en: "Building the Sky, Spreading the Earth" }, range: [47, 49] }
      - { title: { ar: "فروا إلى الله", en: "Flee to Allah" }, range: [50, 51] }
      - { title: { ar: "تكذيب الأمم لرسلها", en: "Nations Denying Their Messengers" }, range: [52, 55] }
      - { title: { ar: "خلق الجن والإنس للعبادة", en: "Jinn and Men Created for Worship" }, range: [56, 58] }
      - { title: { ar: "وعيد الظالمين", en: "Warning the Wrongdoers" }, range: [59, 60] }
