- title:
    ar: أدلة القدرة والدعوة إلى التوحيد
    en: Proofs of Power and the Call to Tawhid
    tr: Yetenek Kanıtı ve Tektanrıcılığa Çağrı
    id: Bukti Kemampuan dan Seruan untuk Monoteisme
  range:
  - 47
  - 60
  family: faith
  summary:
    ar: السماء بناها الله بأيد، والأرض فرشها، ومن كل شيء خلق زوجين، ففروا إلى الله ولا تجعلوا معه إلها آخر؛ وخلق الجن والإنس إلا ليعبدوه، وخاتمة بوعيد الظالمين.
    en: Allah built the sky with might and spread the earth, creating pairs of everything — so flee to Allah and set no other god with Him; jinn and mankind were created only to worship Him; the surah closes
      warning the wrongdoers.
    tr: Gökler Allah tarafından ellerle inşa edildi, yer onları yaydı ve her şeyden çiftler yarattı, bu yüzden Allah'a kaçın ve başka hiçbir tanrıyı yanında götürmeyin; cinleri ve insanları sadece O'na
      ibadet etmek için yarattı ve sonu suçluların uyarısıdır.
    id: Langit dibangun oleh Allah dengan tangan, bumi membentangkannya, dan dari segala sesuatu Dia menciptakan pasangan, maka larilah kepada Allah dan jangan bawa dewa lain bersama-Nya; Dia menciptakan
      jin dan manusia kecuali untuk menyembah-Nya, dan akhirnya adalah peringatan tentang para pelaku kesalahan.
  children:
  - title:
      ar: بناء السماء ومد الأرض
      en: Building the Sky, Spreading the Earth
      tr: Gökyüzünü ve dünyanın gelgitini inşa etmek
      id: Membangun langit dan pasang surut bumi
    range:
    - 47
    - 49
  - title:
