map:
- title:
    ar: النهي عن موالاة أعداء الله
    en: Forbidding Alliance with Allah's Enemies
    tr: Allah'ın düşmanlarına bağlılığın yasaklanması
    id: Larangan kesetiaan kepada musuh Allah
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: تحريم اتخاذ أعداء الله والمؤمنين أولياء وإلقاء المودة إليهم سرا، فهم قد كفروا بالحق وأخرجوا الرسول والمؤمنين، ولن تنفع المودةُ أصحابَها يوم القيامة.
    en: Forbidding the believers from taking Allah's enemies as allies and secretly offering them friendship — they disbelieved in the truth and expelled the Messenger and the believers, and such ties will
      avail nothing on the Day of Resurrection.
    tr: Allah'ın düşmanlarını ve müminleri müttefik olarak alıp onlara gizlice sevgi göstermenin yasaktır; çünkü onlar gerçeğe inkar etmiş ve Resulef'i ve müminleri kovmuşlardır ve sevgi, Kıyamet Günü'nde
      sahiplerine fayda sağlamaz.
    id: Larangan mengambil musuh Allah dan orang beriman sebagai sekutu dan diam-diam menunjukkan kasih sayang kepada mereka, karena mereka telah tidak percaya pada kebenaran dan mengusir Rasul serta orang
      beriman, dan kasih sayang tidak akan menguntungkan pemiliknya pada Hari Kiamat.
  children: []
- title:
    ar: أسوة إبراهيم
    en: The Example of Abraham
    tr: İbrahim'in örneği
    id: Contoh Ibrahim
  range:
  - 4
  - 6
  family: stories
  summary:
    ar: إبراهيم ومن معه أسوة حسنة في البراءة من الشرك وأهله، مع استثناء استغفاره لأبيه، ودعائهم المتوكل على الله ألا يجعلهم فتنة للكافرين.
    en: Abraham and those with him are an excellent example in disavowing idolatry and its people — excepting his prayer for his father — and in their supplication of trust in Allah not to make them a trial
      for the disbelievers.
    tr: İbrahim ve yanındakiler, babası için af dilemeleri dışında, çok tanrıcılıktan ve halkından kopmalarında iyi örneklerdir; onların duaları el-Mütekkil âlâ Allah, onları kâfirler için bir sınav yapmaz.
    id: Ibrahim dan orang-orang yang bersamanya adalah contoh baik dalam menjauhkan diri dari politeisme dan umatnya, kecuali dia memohon pengampunan untuk ayahnya, dan doa mereka, al-Mutakkil 'ala Allah,
      tidak menjadikan mereka ujian bagi kafir.
  children: []
- title:
    ar: العدل مع المسالمين
    en: Justice Toward the Peaceful
    tr: Barışçıl Adalet
    id: Keadilan dengan Yang Damai
  range:
  - 7
  - 9
  family: law
  summary:
    ar: الرجاء في أن يجعل الله مودة بين المؤمنين وأعدائهم، والتمييز بين المحاربين الذين يُنهى عن موالاتهم وبين المسالمين الذين يُبرَّون ويُقسَط إليهم.
    en: Hope that Allah may bring affection between the believers and their enemies, and the distinction between hostile fighters — alliance with whom is forbidden — and peaceful people, who are to be treated
      with kindness and justice.
    tr: Tanrı'nın inananlar ile düşmanları arasında sevgi kuracağına ve ittifak kurmasını yasakladığı savaşçılar ile barışçıl olan ve adil davrandığı insanları ayırt edeceğine dair umut edin.
    id: Harapan bahwa Tuhan akan menegakkan kasih sayang antara orang percaya dan musuh mereka, serta membedakan antara pejuang yang dilarang-Nya bersekutu dengan orang-orang damai yang diperlakukan dan
      dihormati-Nya dengan adil.
  children:
  - title:
      ar: الرجاء في المودة
      en: Hope of Affection
      tr: Sevgi içinde umut
      id: Harapan dalam kasih sayang
    range:
    - 7
    - 7
  - title:
      ar: البر والقسط لغير المحاربين
      en: Kindness and Justice to the Non-Hostile
      tr: Savaş dışı kişiler için doğruluk ve adalet
      id: Kebenaran dan keadilan bagi non-kombatan
    range:
    - 8
    - 9
- title:
    ar: امتحان المؤمنات المهاجرات
    en: Testing the Emigrant Believing Women
    tr: Sigortalı Göçmen Kadınlar İçin Sınav
    id: Ujian untuk Perempuan Migran yang Diasuransikan
  range:
  - 10
  - 11
  family: law
  summary:
    ar: 'أحكام النساء المؤمنات المهاجرات: امتحانهن، وعدم إرجاعهن إلى الكفار، ورد المهور، وعدم التمسك بعصم الكوافر، وتسوية الحقوق المالية بين الطرفين.'
    en: 'The rulings on believing women who emigrate: examining them, not returning them to the disbelievers, returning dowries, dissolving ties with disbelieving wives, and settling financial rights between
      both sides.'
    tr: 'İnanan göçmen kadınlarla ilgili kararlar: onları incelemek, gayrimüslimlere geri vermemek, çeyizleri iade etmek, Mühacir olmayanların yanılmazlığına uymamak ve taraflar arasında mali hakların uzlaştırılması.'
    id: 'Putusan tentang perempuan migran yang percaya: memeriksa mereka, tidak mengembalikannya kepada non-Muslim, mengembalikan mas kawin, tidak mematuhi ketidaksalahan non-Muhajir, dan menyelesaikan
      hak finansial antar pihak.'
  children: []
- title:
    ar: بيعة النساء
    en: The Women's Pledge
    tr: Kadınlar Yemin Etme
    id: Ikrar Perempuan
  range:
  - 12
  - 12
  family: law
  summary:
    ar: 'صيغة بيعة النساء المؤمنات: ألا يشركن بالله شيئا ولا يسرقن ولا يزنين ولا يقتلن أولادهن ولا يأتين ببهتان ولا يعصين في معروف.'
    en: 'The pledge of the believing women: to associate nothing with Allah, not to steal, not to commit adultery, not to kill their children, not to fabricate slander, and not to disobey in what is right.'
    tr: 'İnanan kadınlara bağlılık yemininin şekli şudur: Allah''la hiçbir şey ilişkilendirmeyecek, çalmayacak, zina yapmayacak, çocuklarını öldürmeyecek, yalan suçlamada bulunmayacak, doğru olanda itaatsizlik
      etmeyeceklerdir.'
    id: 'Bentuk sumpah setia kepada wanita beriman adalah: Mereka tidak boleh mengaitkan apa pun dengan Allah, tidak mencuri, tidak berzina, tidak membunuh anak-anak mereka, tidak melakukan tuduhan palsu,
      tidak akan membangkang dalam apa yang benar.'
  children: []
- title:
    ar: ختام النهي عن الموالاة
    en: The Closing Prohibition of Alliance
    tr: Bağlılık yasağının sonucuna varıldı
    id: Kesimpulan larangan kesetiaan
  range:
  - 13
  - 13
  family: faith
  summary:
    ar: ختمت السورة بالنهي عن موالاة قوم غضب الله عليهم قد يئسوا من الآخرة، عودا على بدء بموضوع الموالاة.
    en: The surah closes by forbidding alliance with a people whom Allah is angry with and who have despaired of the Hereafter — returning full circle to the theme of alliance.
    tr: Sure, Allah'ın gazabının üzerine geldiği, ahiretten umutsuzluğa kapılan bir topluluğun bağlılığını yasaklayarak sona erer ve sadakat konusunun başlangıcına geri döner.
    id: Surah diakhiri dengan melarang kesetiaan suatu bangsa yang menjadi sasaran murka Allah, yang telah putus asa akan akhirat, lalu kembali ke awal topik kesetiaan.
  children: []
