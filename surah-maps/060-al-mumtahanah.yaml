map:
  - title: { ar: "النهي عن موالاة أعداء الله", en: "Forbidding Alliance with Allah's Enemies" }
    range: [1, 3]
    family: faith
    summary:
      ar: "تحريم اتخاذ أعداء الله والمؤمنين أولياء وإلقاء المودة إليهم سرا، فهم قد كفروا بالحق وأخرجوا الرسول والمؤمنين، ولن تنفع المودةُ أصحابَها يوم القيامة."
      en: "Forbidding the believers from taking Allah's enemies as allies and secretly offering them friendship — they disbelieved in the truth and expelled the Messenger and the believers, and such ties will avail nothing on the Day of Resurrection."
    children: []
  - title: { ar: "أسوة إبراهيم", en: "The Example of Abraham" }
    range: [4, 6]
    family: stories
    summary:
      ar: "إبراهيم ومن معه أسوة حسنة في البراءة من الشرك وأهله، مع استثناء استغفاره لأبيه، ودعائهم المتوكل على الله ألا يجعلهم فتنة للكافرين."
      en: "Abraham and those with him are an excellent example in disavowing idolatry and its people — excepting his prayer for his father — and in their supplication of trust in Allah not to make them a trial for the disbelievers."
    children: []
  - title: { ar: "العدل مع المسالمين", en: "Justice Toward the Peaceful" }
    range: [7, 9]
    family: law
    summary:
      ar: "الرجاء في أن يجعل الله مودة بين المؤمنين وأعدائهم، والتمييز بين المحاربين الذين يُنهى عن موالاتهم وبين المسالمين الذين يُبرَّون ويُقسَط إليهم."
      en: "Hope that Allah may bring affection between the believers and their enemies, and the distinction between hostile fighters — alliance with whom is forbidden — and peaceful people, who are to be treated with kindness and justice."
    children:
      - { title: { ar: "الرجاء في المودة", en: "Hope of Affection" }, range: [7, 7] }
      - { title: { ar: "البر والقسط لغير المحاربين", en: "Kindness and Justice to the Non-Hostile" }, range: [8, 9] }
  - title: { ar: "امتحان المؤمنات المهاجرات", en: "Testing the Emigrant Believing Women" }
    range: [10, 11]
    family: law
    summary:
      ar: "أحكام النساء المؤمنات المهاجرات: امتحانهن، وعدم إرجاعهن إلى الكفار، ورد المهور، وعدم التمسك بعصم الكوافر، وتسوية الحقوق المالية بين الطرفين."
      en: "The rulings on believing women who emigrate: examining them, not returning them to the disbelievers, returning dowries, dissolving ties with disbelieving wives, and settling financial rights between both sides."
    children: []
  - title: { ar: "بيعة النساء", en: "The Women's Pledge" }
    range: [12, 12]
    family: law
    summary:
      ar: "صيغة بيعة النساء المؤمنات: ألا يشركن بالله شيئا ولا يسرقن ولا يزنين ولا يقتلن أولادهن ولا يأتين ببهتان ولا يعصين في معروف."
      en: "The pledge of the believing women: to associate nothing with Allah, not to steal, not to commit adultery, not to kill their children, not to fabricate slander, and not to disobey in what is right."
    children: []
  - title: { ar: "ختام النهي عن الموالاة", en: "The Closing Prohibition of Alliance" }
    range: [13, 13]
    family: faith
    summary:
      ar: "ختمت السورة بالنهي عن موالاة قوم غضب الله عليهم قد يئسوا من الآخرة، عودا على بدء بموضوع الموالاة."
      en: "The surah closes by forbidding alliance with a people whom Allah is angry with and who have despaired of the Hereafter — returning full circle to the theme of alliance."
    children: []
