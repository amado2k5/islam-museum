map:
- title:
    ar: القسم بالقلم وشهادة الخلق العظيم
    en: The Pen Oath and the Exalted Character
    tr: Kalemle yemin ve büyük karakter tanıklığı
    id: Sumpah dengan pena dan kesaksian karakter yang hebat
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: افتتاح السورة بالقسم بالقلم، وتبرئة النبي من تهمة الجنون، والشهادة له بالأجر غير الممنون والخلق العظيم.
    en: The surah opens with an oath by the Pen, clearing the Prophet of the madness charge, and testifying to his unceasing reward and exalted character.
    tr: Sureyi kalemle yemin ederek açmak, Peygamber'i delilik suçlamasından aklamak ve nankör ile büyük karakterin ödülüyle ona tanıklık etmek.
    id: Membuka surah dengan sumpah menggunakan pena, membebaskan Nabi dari tuduhan kegilaan, dan memberikan kesaksian kepada Nabi dengan ganjaran bagi orang yang tidak tahu berterima kasih dan yang mulia.
  children:
