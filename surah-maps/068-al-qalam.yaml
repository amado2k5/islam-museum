- title:
    ar: الصبر وعالمية الذكر
    en: Patience and the Universal Reminder
    tr: Sabır ve anmanın evrenselliği
    id: Kesabaran dan universalitas kenangan
  range:
  - 48
  - 52
  family: faith
  summary:
    ar: 'خاتمة السورة: الأمر بالصبر وعدم التبرم كصاحب الحوت، ورد تهمة الجنون، والتأكيد أن القرآن ذكر للعالمين.'
    en: 'The surah''s close: the command to patience, not fretting like the man of the fish, the madness charge refuted, and the Quran as a reminder to all worlds.'
    tr: 'Surenin Sonucu: Sabırlı olma, balığın sahibi gibi cesaretini kaybetmeme, delilik suçlamasını reddetme ve Kur''an''ın tüm dünyalar için bir anma olduğunu teyit etme emri.'
    id: 'Kesimpulan Surah: Perintah untuk bersabar dan tidak berkecil hati seperti pemilik ikan, menolak tuduhan kegilaan, dan menegaskan bahwa Al-Qur''an adalah kenangan bagi semua dunia.'
  children:
  - title:
      ar: عبرة صاحب الحوت
      en: The Lesson of the Man of the Fish
      tr: Balina sahibinin dersi
      id: Pelajaran dari pemilik paus
    range:
    - 48
    - 50
  - title:
      ar: ذكر للعالمين
      en: A Reminder to the Worlds
      tr: Dünyalara Anma
      id: Peringatan Dunia
    range:
