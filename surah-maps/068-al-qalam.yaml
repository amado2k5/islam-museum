- title:
    ar: النهي عن طاعة المكذبين وصفاتهم
    en: 'Do Not Obey the Deniers: Their Traits'
    tr: Yalancılara itaat etmenin ve onların özelliklerinin yasaklanması
    id: Larangan mematuhi pembohong dan sifat-sifat mereka
  range:
  - 8
  - 16
  family: faith
  summary:
    ar: 'نهي عن مداهنة المكذبين، وعرض لصفاتهم الذميمة: كثرة الحلف، والهمز، والنميمة، ومنع الخير، والعدوان، والزنيمية.'
    en: 'A ban on compromising with the deniers, then a portrait of their blameworthy traits: habitual swearing, slander, gossip, withholding good, aggression, ignobility.'
    tr: 'Inkarcıları pohpohlamayı yasakladı ve onların suçlanacak özelliklerini sundu: sık sık küfür etmek, fısıldamak, dedikodu, iyiliği saklamak, saldırganlık ve zina.'
    id: 'Ia melarang memuji para penyangkal dan menampilkan sifat-sifat mereka yang patut disalahkan: sering mengumpat, berbisik, bergosip, menyembunyikan kebaikan, agresi, dan perselingkuhan.'
  children:
  - title:
      ar: النهي عن المداهنة
      en: No Compromise with Deniers
      tr: İltifatın yasaklanması
      id: Larangan sanjungan
    range:
    - 8
    - 9
  - title:
      ar: صفات المكذب
      en: Traits of the Denier
      tr: Yalancı'nın Özellikleri
      id: Karakteristik Sang Pembohong
    range:
    - 10
    - 16
- title:
    ar: تحذير المكذبين وعاقبتهم
    en: Warning the Deniers and Their End
    tr: Yalancılar ve Cezaları Hakkında Uyarı
    id: Peringatan tentang para pembohong dan hukuman mereka
  range:
  - 17
  - 47
  family: faith
  summary:
    ar: 'كتلة التحذير الكبرى: مثل أصحاب الجنة الذين حرموا الفقراء فأهلكت جنتهم، ثم الحجة على المكذبين ومشهد يوم القيامة والاستدراج.'
    en: 'The great warning block: the parable of the garden owners who excluded the poor and lost their garden, then the argument against the deniers, the Day''s scene, and gradual seizure.'
    tr: 'Büyük uyarı ayini: Cennet halkının yoksulları ve onların Cenneti yok eden örneği, ardından inkârcılara karşı argüman ve Diriliş Günü sahnesi ve cazip hale getirildi.'
    id: 'Misa peringatan utama: Contoh orang-orang Surga yang meniadakan orang miskin dan Surga mereka hancur, lalu argumen melawan para penyangkal dan adegan Hari Kebangkitan serta yang menggoda.'
  children:
  - title:
      ar: مثل أصحاب الجنة
      en: The Parable of the Garden Owners
      tr: Cennetin sahipleri gibi
      id: Seperti pemilik Paradise
