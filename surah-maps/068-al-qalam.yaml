map:
  - title: { ar: "القسم بالقلم وشهادة الخلق العظيم", en: "The Pen Oath and the Exalted Character" }
    range: [1, 7]
    family: faith
    summary:
      ar: "افتتاح السورة بالقسم بالقلم، وتبرئة النبي من تهمة الجنون، والشهادة له بالأجر غير الممنون والخلق العظيم."
      en: "The surah opens with an oath by the Pen, clearing the Prophet of the madness charge, and testifying to his unceasing reward and exalted character."
    children:
      - { title: { ar: "القسم بالقلم", en: "The Oath by the Pen" }, range: [1, 2] }
      - { title: { ar: "الأجر والخلق العظيم", en: "The Reward and the Exalted Character" }, range: [3, 7] }
  - title: { ar: "النهي عن طاعة المكذبين وصفاتهم", en: "Do Not Obey the Deniers: Their Traits" }
    range: [8, 16]
    family: faith
    summary:
      ar: "نهي عن مداهنة المكذبين، وعرض لصفاتهم الذميمة: كثرة الحلف، والهمز، والنميمة، ومنع الخير، والعدوان، والزنيمية."
      en: "A ban on compromising with the deniers, then a portrait of their blameworthy traits: habitual swearing, slander, gossip, withholding good, aggression, ignobility."
    children:
      - { title: { ar: "النهي عن المداهنة", en: "No Compromise with Deniers" }, range: [8, 9] }
      - { title: { ar: "صفات المكذب", en: "Traits of the Denier" }, range: [10, 16] }
  - title: { ar: "تحذير المكذبين وعاقبتهم", en: "Warning the Deniers and Their End" }
    range: [17, 47]
    family: faith
    summary:
      ar: "كتلة التحذير الكبرى: مثل أصحاب الجنة الذين حرموا الفقراء فأهلكت جنتهم، ثم الحجة على المكذبين ومشهد يوم القيامة والاستدراج."
      en: "The great warning block: the parable of the garden owners who excluded the poor and lost their garden, then the argument against the deniers, the Day's scene, and gradual seizure."
    children:
      - { title: { ar: "مثل أصحاب الجنة", en: "The Parable of the Garden Owners" }, range: [17, 33] }
      - { title: { ar: "المسلمون والمجرمون", en: "The Submissive and the Guilty" }, range: [34, 43] }
      - { title: { ar: "الاستدراج", en: "The Gradual Seizure" }, range: [44, 47] }
  - title: { ar: "الصبر وعالمية الذكر", en: "Patience and the Universal Reminder" }
    range: [48, 52]
    family: faith
    summary:
      ar: "خاتمة السورة: الأمر بالصبر وعدم التبرم كصاحب الحوت، ورد تهمة الجنون، والتأكيد أن القرآن ذكر للعالمين."
      en: "The surah's close: the command to patience, not fretting like the man of the fish, the madness charge refuted, and the Quran as a reminder to all worlds."
    children:
      - { title: { ar: "عبرة صاحب الحوت", en: "The Lesson of the Man of the Fish" }, range: [48, 50] }
      - { title: { ar: "ذكر للعالمين", en: "A Reminder to the Worlds" }, range: [51, 52] }
