surah: 49
slug: al-hujurat
sources_consulted:
  - "ar.wikipedia.org — سورة الحجرات (المواضيع: أدب التعامل مع الله ورسوله، التثبت، الصلح، السخرية، التقوى، الإيمان)"
  - "mawdoo3.io — سبب تسمية سورة الحجرات وأسباب نزول آياتها"
  - "khutabaa.com — تأملات في سورة الحجرات (سورة الآداب الاجتماعية)"
map:
  - title: { ar: "أدب التعامل مع الرسول", en: "Manners Toward the Messenger" }
    range: [1, 5]
    family: law
    summary:
      ar: "يا أيها الذين آمنوا لا تقدموا بين يدي الله ورسوله؛ لا ترفعوا أصواتكم فوق صوت النبي؛ إن الذين ينادونك من وراء الحجرات أكثرهم لا يعقلون."
      en: "Believers, do not advance before God and His Messenger; do not raise your voices above the Prophet's voice; those who call you from behind the chambers — most of them do not reason."
    children:
      - { title: { ar: "لا تقدموا بين يدي الله ورسوله", en: "Do Not Advance Before God and His Messenger" }, range: [1, 1] }
      - { title: { ar: "لا ترفعوا أصواتكم", en: "Do Not Raise Your Voices" }, range: [2, 3] }
      - { title: { ar: "المنادون من وراء الحجرات", en: "Those Calling from Behind the Chambers" }, range: [4, 5] }
  - title: { ar: "التثبت من الأخبار", en: "Verifying Reports" }
    range: [6, 8]
    family: law
    summary:
      ar: "يا أيها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة؛ واعلموا أن فيكم رسول الله؛ حبب إليكم الإيمان وزينه في قلوبكم."
      en: "Believers, if a transgressor brings you news, verify lest you harm people out of ignorance; know God's Messenger is among you; He made faith beloved and adorned it in your hearts."
    children:
      - { title: { ar: "فتبينوا", en: "Verify" }, range: [6, 6] }
  - title: { ar: "الصلح بين المؤمنين", en: "Reconciliation Among Believers" }
    range: [9, 10]
    family: law
    summary:
      ar: "وإن طائفتان من المؤمنين اقتتلوا فأصلحوا بينهما؛ فإن بغت إحداهما على الأخرى فقاتلوا التي تبغي حتى تفيء إلى أمر الله؛ إنما المؤمنون إخوة فأصلحوا بين أخويكم."
      en: "If two parties of believers fight, make peace between them; if one transgresses against the other, fight the transgressing one until it returns to God's command; believers are but brothers, so reconcile your brothers."
    children:
      - { title: { ar: "إنما المؤمنون إخوة", en: "Believers Are But Brothers" }, range: [10, 10] }
  - title: { ar: "آداب المجتمع", en: "Manners of Society" }
    range: [11, 13]
    family: law
    summary:
      ar: "لا يسخر قوم من قوم عسى أن يكونوا خيرا منهم؛ ولا تلمزوا أنفسكم ولا تنابزوا بالألقاب؛ اجتنبوا كثيرا من الظن ولا تجسسوا ولا يغتب بعضكم بعضا؛ إن أكرمكم عند الله أتقاكم."
      en: "Let no people mock another, perhaps they are better; do not defame yourselves nor call by nicknames; avoid much suspicion, do not spy, do not backbite one another; the noblest of you to God is the most God-conscious."
    children:
      - { title: { ar: "لا يسخر قوم من قوم", en: "Let No People Mock Another" }, range: [11, 11] }
      - { title: { ar: "الظن والتجسس والغيبة", en: "Suspicion, Spying, Backbiting" }, range: [12, 12] }
      - { title: { ar: "إن أكرمكم عند الله أتقاكم", en: "The Noblest Is the Most God-conscious" }, range: [13, 13] }
  - title: { ar: "حقيقة الإيمان", en: "The Reality of Faith" }
    range: [14, 18]
    family: faith
    summary:
      ar: "قالت الأعراب آمنا قل لم تؤمنوا ولكن قولوا أسلمنا؛ إنما المؤمنون الذين آمنوا بالله ورسوله ثم لم يرتابوا وجاهدوا بأموالهم وأنفسهم؛ يمنون عليك أن أسلموا."
      en: "The Bedouins say: we believe — say: you have not believed, but say: we have submitted; the believers are those who believed in God and His Messenger, then never doubted, and strove with wealth and selves; they remind you of their submission as a favor."
    children:
      - { title: { ar: "قالت الأعراب آمنا", en: "The Bedouins Say: We Believe" }, range: [14, 15] }
      - { title: { ar: "يمنون عليك أن أسلموا", en: "They Remind You of Their Submission" }, range: [17, 17] }
