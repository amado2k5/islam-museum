surah: 49
slug: al-hujurat
sources_consulted:
- 'ar.wikipedia.org — سورة الحجرات (المواضيع: أدب التعامل مع الله ورسوله، التثبت، الصلح، السخرية، التقوى، الإيمان)'
- mawdoo3.io — سبب تسمية سورة الحجرات وأسباب نزول آياتها
- khutabaa.com — تأملات في سورة الحجرات (سورة الآداب الاجتماعية)
map:
- title:
    ar: أدب التعامل مع الرسول
    en: Manners Toward the Messenger
    tr: Peygamber ile Uğraşma Görgü Kuralları
    id: Etiket Berurusan dengan Nabi
  range:
  - 1
  - 5
  family: law
  summary:
    ar: يا أيها الذين آمنوا لا تقدموا بين يدي الله ورسوله؛ لا ترفعوا أصواتكم فوق صوت النبي؛ إن الذين ينادونك من وراء الحجرات أكثرهم لا يعقلون.
    en: Believers, do not advance before God and His Messenger; do not raise your voices above the Prophet's voice; those who call you from behind the chambers — most of them do not reason.
    tr: Ey iman edenler, Allah ve O'nun Resulü'nün önünde durmayın; sesinizi Peygamber'in sesinden yükseltmeyin; sizi odaların arkasından çağıranların çoğu anlamaz.
    id: Wahai yang beriman, janganlah berdiri di hadapan Allah dan Rasul-Nya; janganlah meninggikan suara kalian di atas suara Nabi; memang, kebanyakan orang yang memanggil kalian dari balik kamar tidak
      mengerti.
  children:
  - title:
      ar: لا تقدموا بين يدي الله ورسوله
      en: Do Not Advance Before God and His Messenger
      tr: Allah ve O'nun Elçisi huzuruna çıkma
      id: Jangan hadir di hadapan Allah dan Rasul-Nya
    range:
    - 1
    - 1
  - title:
      ar: لا ترفعوا أصواتكم
      en: Do Not Raise Your Voices
      tr: Sesinizi yükseltmeyin
      id: Jangan meninggikan suara kalian
    range:
    - 2
    - 3
  - title:
      ar: المنادون من وراء الحجرات
      en: Those Calling from Behind the Chambers
      tr: Odaların arkasından arayanlar
      id: Penelepon dari balik ruangan
    range:
    - 4
    - 5
- title:
    ar: التثبت من الأخبار
    en: Verifying Reports
    tr: Haberleri doğrulayın
    id: Verifikasi berita
  range:
  - 6
  - 8
  family: law
  summary:
    ar: يا أيها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة؛ واعلموا أن فيكم رسول الله؛ حبب إليكم الإيمان وزينه في قلوبكم.
    en: Believers, if a transgressor brings you news, verify lest you harm people out of ignorance; know God's Messenger is among you; He made faith beloved and adorned it in your hearts.
    tr: Ey iman edenler, eğer kötü biri size haberle gelirse, cehaletten bir koluma zarar vereceğinizi doğrulayın; ve bilin ki, aranızda Allah'ın Elçisi vardır; iman size sevilmiş ve kalbinizde güzelleşmiştir.
    id: Wahai yang beriman, jika orang jahat datang kepada kalian dengan kabar, buktikan bahwa kalian akan menyakiti umat karena kebodohan; dan ketahuilah bahwa di antara kalian ada Rasulullah; iman telah
      disayangi dan diperindah di hati kalian.
  children:
  - title:
      ar: فتبينوا
      en: Verify
      tr: O halde netleştirin
      id: Jadi jelaskan
    range:
    - 6
    - 6
- title:
    ar: الصلح بين المؤمنين
    en: Reconciliation Among Believers
    tr: İnananlar arasında uzlaşma
    id: Rekonsiliasi di antara para mukmin
  range:
  - 9
  - 10
  family: law
  summary:
    ar: وإن طائفتان من المؤمنين اقتتلوا فأصلحوا بينهما؛ فإن بغت إحداهما على الأخرى فقاتلوا التي تبغي حتى تفيء إلى أمر الله؛ إنما المؤمنون إخوة فأصلحوا بين أخويكم.
    en: If two parties of believers fight, make peace between them; if one transgresses against the other, fight the transgressing one until it returns to God's command; believers are but brothers, so reconcile
      your brothers.
    tr: İki müminler grubu kavga ederse, aralarında barışın; biri diğerini eziyorsa, zulme uğrayanla savaşın ki Allah emrine dönsün; müminler sadece kardeştir, kardeşleriniz arasında barışın.
    id: Jika dua kelompok orang beriman bertengkar, maka berdamailah di antara mereka; jika salah satu menindas yang lain, lawanlah yang menindas sampai kembali kepada perintah Allah; orang beriman hanyalah
      saudara, maka berdamailah antara saudaramu.
  children:
  - title:
      ar: إنما المؤمنون إخوة
      en: Believers Are But Brothers
      tr: Ama inananlar kardeştir
      id: Tapi orang percaya adalah saudara
    range:
    - 10
    - 10
- title:
    ar: آداب المجتمع
    en: Manners of Society
    tr: Topluluk Adabları
    id: Tata Krama Komunitas
  range:
  - 11
  - 13
  family: law
  summary:
    ar: لا يسخر قوم من قوم عسى أن يكونوا خيرا منهم؛ ولا تلمزوا أنفسكم ولا تنابزوا بالألقاب؛ اجتنبوا كثيرا من الظن ولا تجسسوا ولا يغتب بعضكم بعضا؛ إن أكرمكم عند الله أتقاكم.
    en: Let no people mock another, perhaps they are better; do not defame yourselves nor call by nicknames; avoid much suspicion, do not spy, do not backbite one another; the noblest of you to God is the
      most God-conscious.
    tr: Hiçbir halk başka bir halkla alay etmez, belki onlardan daha iyidirler; birbirinize hakaret etmeyin, lakapla hitap etmeyin; çok fazla şüphe çekmeyin, casusluk yapmayın ve birbirinize sırt ısırma;
      Allah huzurunda en onurlu olanınız en doğru olanınızdır.
    id: Tidak ada orang yang mengejek bangsa lain, mungkin mereka lebih baik dari mereka; jangan saling menghina atau memanggil satu sama lain dengan julukan; hindari banyak kecurigaan, jangan memata-matai,
      dan jangan saling mengkritik; memang, yang paling terhormat di antara kalian di hadapan Allah adalah yang paling benar di antara kalian.
  children:
  - title:
      ar: لا يسخر قوم من قوم
      en: Let No People Mock Another
      tr: Hiçbir insan başka bir halkla alay etmez
      id: Tidak ada orang yang mengejek orang lain
    range:
    - 11
    - 11
  - title:
      ar: الظن والتجسس والغيبة
      en: Suspicion, Spying, Backbiting
      tr: Şüphe, casusluk ve sırtüstü ifadeleme
      id: Kecurigaan, spionase, dan fitnah
    range:
    - 12
    - 12
  - title:
      ar: إن أكرمكم عند الله أتقاكم
      en: The Noblest Is the Most God-conscious
      tr: Tanrı'nın gözünde en onurlu olanınız en doğru olanınızdır
      id: Yang paling terhormat di antara kalian di hadapan Allah adalah yang paling benar di antara kalian
    range:
    - 13
    - 13
- title:
    ar: حقيقة الإيمان
    en: The Reality of Faith
    tr: İnancın Gerçeği
    id: Kebenaran Iman
  range:
  - 14
  - 18
  family: faith
  summary:
    ar: قالت الأعراب آمنا قل لم تؤمنوا ولكن قولوا أسلمنا؛ إنما المؤمنون الذين آمنوا بالله ورسوله ثم لم يرتابوا وجاهدوا بأموالهم وأنفسهم؛ يمنون عليك أن أسلموا.
    en: 'The Bedouins say: we believe — say: you have not believed, but say: we have submitted; the believers are those who believed in God and His Messenger, then never doubted, and strove with wealth
      and selves; they remind you of their submission as a favor.'
    tr: Bedeviler, 'Biz iman ediyoruz.' dediler. De ki, 'İnanmadınız, 'Biz teslim olduk.' Müminler, Allah'a ve O'nun Elçisine inanan, sonra şüphe duymayan ve malları ve canlarıyla mücadele edenlerdir; size
      İslam'ı benimsemeye emanet ediyorlar.
    id: Orang Badui berkata, 'Kami beriman.' Katakanlah, 'Kamu tidak beriman, tetapi katakanlah, 'Kami telah tunduk.' Memang, orang beriman adalah mereka yang percaya kepada Allah dan Rasul-Nya lalu tidak
      ragu dan berjuang dengan harta dan nyawa mereka; mereka mempercayakan kamu untuk memeluk Islam.
  children:
  - title:
      ar: قالت الأعراب آمنا
      en: 'The Bedouins Say: We Believe'
      tr: Bedeviler güvende olduğumuzu söyledi
      id: Orang Badui bilang kita aman
    range:
    - 14
    - 15
  - title:
      ar: يمنون عليك أن أسلموا
      en: They Remind You of Their Submission
      tr: Müslüman olmanı istiyorlar
      id: Mereka ingin kamu menjadi Muslim
    range:
    - 17
    - 17
