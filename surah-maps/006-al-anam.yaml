surah: 6
slug: al-anam
sources_consulted:
- Quranic Diagrammatic Overview (QDO draft) — Surah al-An'am 7 sections (1-73, 74-94, 95-113, 114-121, 122-135, 136-154, 155-165)
- muslimandquran.com — Surah Al-An'am main themes (tawhid vs shirk, Makkan argument)
- Qurtubi vol.7 description (Diwan Press) — An'am as single argument, usul al-din
map:
- title:
    ar: الحجاج مع مشركي مكة
    en: Argument with the Makkan Polytheists
    tr: Mekke'nin çoktanrılılarıyla birlikte hacılar
    id: Peziarah bersama para politeis Mekah
  range:
  - 1
  - 73
  family: faith
  summary:
    ar: حمد الله خالق السماوات والأرض، والرد على شبهات المشركين حول الوحي والملائكة والبعث.
    en: Praise of Allah, creator of heavens and earth; answering the polytheists' doubts about revelation, angels, and resurrection.
    tr: Göklerin ve yerin Yaratıcısı Allah'a hamd olsun; vahiy, melekler ve diriliş konusundaki mişkârların şüphelerine yanıt versin.
    id: Puji bagi Allah, Pencipta langit dan bumi, dan menjawab keraguan para musyrik tentang wahyu, malaikat, dan kebangkitan.
  children:
