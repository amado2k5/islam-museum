map:
  - title: { ar: "الحجاج مع مشركي مكة", en: "Argument with the Makkan Polytheists" }
    range: [1, 73]
    family: faith
    summary:
      ar: "حمد الله خالق السماوات والأرض، والرد على شبهات المشركين حول الوحي والملائكة والبعث."
      en: "Praise of Allah, creator of heavens and earth; answering the polytheists' doubts about revelation, angels, and resurrection."
    children:
      - { title: { ar: "الحمد والخلق", en: "Praise and Creation" }, range: [1, 3] }
      - { title: { ar: "كتب على نفسه الرحمة", en: "Mercy Decreed upon Himself" }, range: [12, 12] }
      - { title: { ar: "الضر والنفع بيد الله", en: "Harm and Benefit in Allah's Hand" }, range: [17, 18] }
      - { title: { ar: "مفاتح الغيب", en: "The Keys of the Unseen" }, range: [59, 59] }
  - title: { ar: "حجة إبراهيم والأنبياء", en: "Abraham's Proof and the Prophets" }
    range: [74, 94]
    family: stories
    summary:
      ar: "مناظرة إبراهيم لقومه في الكوكب والقمر والشمس، ثم سلسلة الأنبياء المهديين — حجة التوحيد."
      en: "Abraham's debate with his people over star, moon, and sun; then the chain of guided prophets — the proof of oneness."
    children:
      - { title: { ar: "الكوكب والقمر والشمس", en: "Star, Moon, and Sun" }, range: [76, 79] }
      - { title: { ar: "وتلك حجتنا", en: "That Was Our Proof" }, range: [83, 83] }
      - { title: { ar: "سلسلة الأنبياء", en: "The Chain of Prophets" }, range: [84, 90] }
  - title: { ar: "آيات التوحيد في الخلق", en: "Signs of Oneness in Creation" }
    range: [95, 113]
    family: faith
    summary:
      ar: "فالق الحب والنوى، ومبدع السماوات والأرض — أنى يكون له ولد؟ مع النهي عن سب آلهة المشركين."
      en: "Cleaver of grain and seed, originator of the heavens — how could He have a son? And: do not insult their gods."
    children:
      - { title: { ar: "فالق الحب والنوى", en: "Cleaver of Grain and Seed" }, range: [95, 99] }
      - { title: { ar: "أنى يكون له ولد", en: "How Could He Have a Son" }, range: [100, 101] }
      - { title: { ar: "لا تسبوا آلهتهم", en: "Do Not Insult Their Gods" }, range: [108, 108] }
  - title: { ar: "التوحيد في التشريع", en: "Oneness in Legislation" }
    range: [114, 121]
    family: law
    summary:
      ar: "أفغير الله أبتغي حكما؟ الحكم لله وحده في الحلال والحرام، ومنه ذكر اسم الله على الطعام."
      en: "Should I seek a judge other than Allah? Judgment in lawful and forbidden belongs to Him alone — including mentioning His name over food."
    children:
      - { title: { ar: "أغير الله أبتغي حكما", en: "Seek a Judge Other Than Allah?" }, range: [114, 114] }
      - { title: { ar: "ذكروا اسم الله", en: "Mention Allah's Name" }, range: [118, 119] }
  - title: { ar: "مكر المجرمين", en: "The Plotting of the Wicked" }
    range: [122, 135]
    family: faith
    summary:
      ar: "زخرف القول غرورا، وشياطين الإنس والجن يوحي بعضهم إلى بعض — والله أعلم حيث يجعل رسالته."
      en: "Adorned speech as delusion; devils of men and jinn inspiring one another — Allah knows best where to place His message."
    children:
      - { title: { ar: "يشرح صدره للإسلام", en: "He Expands His Breast to Islam" }, range: [125, 125] }
      - { title: { ar: "درجات مما عملوا", en: "Ranks According to Deeds" }, range: [132, 132] }
  - title: { ar: "بدع الأنعام والوصايا", en: "Cattle Innovations and the Commandments" }
    range: [136, 154]
    family: law
    summary:
      ar: "إبطال ما ابتدعوه في الحرث والأنعام من أنصبة، ثم الوصايا الجامعة: قل تعالوا أتل ما حرم ربكم عليكم."
      en: "Nullifying their invented shares of crops and cattle; then the comprehensive commandments: come, I will recite what your Lord forbade."
    children:
      - { title: { ar: "الأنصبة المبتدعة", en: "The Invented Shares" }, range: [136, 140] }
      - { title: { ar: "حق الحصاد", en: "The Harvest Due" }, range: [141, 141] }
      - { title: { ar: "قل تعالوا أتل", en: "Come, I Will Recite" }, range: [151, 153] }
  - title: { ar: "الخاتمة: الكتاب والجزاء", en: "Closing: The Book and Recompense" }
    range: [155, 165]
    family: faith
    summary:
      ar: "وهذا كتاب أنزلناه مبارك فاتبعوه، والحسنة بعشر أمثالها، وإن صلاتي ونسكي ومحياي لله."
      en: "This blessed Book revealed — so follow it; a good deed earns tenfold; my prayer and sacrifice belong to Allah."
    children:
      - { title: { ar: "كتاب مبارك فاتبعوه", en: "A Blessed Book — Follow It" }, range: [155, 157] }
      - { title: { ar: "الحسنة بعشر أمثالها", en: "Tenfold Reward" }, range: [160, 160] }
      - { title: { ar: "إن صلاتي ونسكي", en: "My Prayer and My Sacrifice" }, range: [162, 163] }
