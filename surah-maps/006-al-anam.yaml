- title:
    ar: حجة إبراهيم والأنبياء
    en: Abraham's Proof and the Prophets
    tr: İbrahim ve Peygamberlerin Argümanı
    id: Argumen Abraham dan Para Nabi
  range:
  - 74
  - 94
  family: stories
  summary:
    ar: مناظرة إبراهيم لقومه في الكوكب والقمر والشمس، ثم سلسلة الأنبياء المهديين — حجة التوحيد.
    en: Abraham's debate with his people over star, moon, and sun; then the chain of guided prophets — the proof of oneness.
    tr: İbrahim'in halkıyla yıldız, ay ve güneş üzerine tartışması, ardından rehber peygamberler dizisi — tek tanrıcılığın kanıtı.
    id: Perdebatan Abraham dengan umatnya tentang bintang, bulan, dan matahari, lalu rangkaian nabi yang dibimbing — bukti monoteisme.
  children:
  - title:
      ar: الكوكب والقمر والشمس
      en: Star, Moon, and Sun
      tr: Gezegen, ay ve güneş
      id: Planet, bulan, dan matahari
    range:
    - 76
    - 79
  - title:
      ar: وتلك حجتنا
      en: That Was Our Proof
      tr: Ve bu bizim argümanımız
      id: Dan itulah argumen kami
    range:
    - 83
    - 83
  - title:
      ar: سلسلة الأنبياء
      en: The Chain of Prophets
      tr: Peygamberler Serisi
      id: Seri Nabi
    range:
    - 84
    - 90
- title:
    ar: آيات التوحيد في الخلق
    en: Signs of Oneness in Creation
    tr: Yaratılışta Tektanrıcılık Dizeleri
    id: Ayat-ayat Monoteisme dalam Penciptaan
  range:
  - 95
  - 113
  family: faith
  summary:
    ar: فالق الحب والنوى، ومبدع السماوات والأرض — أنى يكون له ولد؟ مع النهي عن سب آلهة المشركين.
    en: 'Cleaver of grain and seed, originator of the heavens — how could He have a son? And: do not insult their gods.'
    tr: Tahılların ve çekirdeklerin Bölücüsü, gökyüzü ve yeryüzünün Yaratıcısı — nasıl bir oğlu olabilir? Putperestlerin tanrılarına lanet etme yasağı ile.
    id: Pemecah biji-bijian dan inti, Pencipta langit dan bumi — bagaimana mungkin Dia memiliki seorang putra? Dengan larangan mengutuk para dewa para politeis.
  children:
  - title:
      ar: فالق الحب والنوى
      en: Cleaver of Grain and Seed
      tr: Aşkın ve Çekirdeklerin Bölücüsü
      id: Pemecah Cinta dan Inti
    range:
    - 95
    - 99
  - title:
      ar: أنى يكون له ولد
      en: How Could He Have a Son
      tr: Nasıl bir oğlu olabilir?
      id: Bagaimana dia bisa punya anak laki-laki?
    range:
    - 100
    - 101
  - title:
      ar: لا تسبوا آلهتهم
      en: Do Not Insult Their Gods
      tr: Tanrılarına hakaret etme
      id: Jangan hina dewa mereka
    range:
    - 108
    - 108
- title:
    ar: التوحيد في التشريع
    en: Oneness in Legislation
    tr: Mevzuatta birleştirme
    id: Penyatuan dalam legislasi
  range:
  - 114
  - 121
  family: law
  summary:
    ar: أفغير الله أبتغي حكما؟ الحكم لله وحده في الحلال والحرام، ومنه ذكر اسم الله على الطعام.
    en: Should I seek a judge other than Allah? Judgment in lawful and forbidden belongs to Him alone — including mentioning His name over food.
    tr: Allah'tan başka bir hüküm mü arıyorum? Neyin yasal ve yasa dışı olduğuna ilişkin yargı yalnızca Allah'a aittir ve bundan da Allah'ın adının yemek üzerinde anılması gelir.
    id: Apakah aku mencari keputusan selain Allah? Putusan itu hanya milik Allah mengenai apa yang sah dan tidak sah, dan dari sinilah namanya Allah disebutkan atas makanan.
  children:
  - title:
      ar: أغير الله أبتغي حكما
      en: Seek a Judge Other Than Allah?
      tr: Tanrı'yı değiştiririm, bir yargıç ararım.
      id: Aku mengubah Tuhan, aku mencari hakim.
    range:
    - 114
    - 114
  - title:
      ar: ذكروا اسم الله
      en: Mention Allah's Name
      tr: Tanrı'nın adını anmak
      id: Sebut nama Tuhan
    range:
    - 118
    - 119
- title:
    ar: مكر المجرمين
    en: The Plotting of the Wicked
    tr: Suçluların kurnazlığı
    id: Kecerdikan para penjahat
  range:
  - 122
  - 135
  family: faith
  summary:
    ar: زخرف القول غرورا، وشياطين الإنس والجن يوحي بعضهم إلى بعض — والله أعلم حيث يجعل رسالته.
    en: Adorned speech as delusion; devils of men and jinn inspiring one another — Allah knows best where to place His message.
    tr: Konuşmanın süslenmesi kibirdir ve insan şeytanları ile cinler birbirini teşvik eder — ve Tanrı mesajını nereye yerleştirdiğini en iyi bilir.
    id: Hiasan dalam ucapan adalah kesombongan, dan iblis manusia serta jin saling menginspirasi — dan Tuhan paling tahu di mana Dia menempatkan pesan-Nya.
  children:
  - title:
      ar: يشرح صدره للإسلام
      en: He Expands His Breast to Islam
      tr: Kalbini İslam'a açıklıyor
      id: Dia menjelaskan hatinya kepada Islam
    range:
    - 125
    - 125
  - title:
      ar: درجات مما عملوا
      en: Ranks According to Deeds
      tr: Yaptıklarının dereceleri
      id: Tingkat dari apa yang mereka lakukan
    range:
    - 132
    - 132
- title:
    ar: بدع الأنعام والوصايا
    en: Cattle Innovations and the Commandments
    tr: Sığır ve emirlerin yenilikleri
    id: Inovasi sapi dan perintah
  range:
  - 136
  - 154
  family: law
  summary:
    ar: 'إبطال ما ابتدعوه في الحرث والأنعام من أنصبة، ثم الوصايا الجامعة: قل تعالوا أتل ما حرم ربكم عليكم.'
    en: 'Nullifying their invented shares of crops and cattle; then the comprehensive commandments: come, I will recite what your Lord forbade.'
    tr: 'Sürmek ve hayvancılıkta icat ettiklerini geçersiz kılmak, ardından kapsamlı emirleri içeren emirleri getirin: ''Gel, Rabbinizin size yasakladığını okuyun.'''
    id: 'Membatalkan apa yang mereka ciptakan dalam membajak dan ternak, lalu perintah yang komprehensif: Katakanlah, ''Datanglah, bacalah apa yang telah Tuhan kalian larang.'''
  children:
  - title:
