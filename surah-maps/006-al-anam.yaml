- title:
    ar: 'الخاتمة: الكتاب والجزاء'
    en: 'Closing: The Book and Recompense'
    tr: 'Sonuç: Kitap ve Ödül'
    id: 'Kesimpulan: Buku dan Ganti Rugi'
  range:
  - 155
  - 165
  family: faith
  summary:
    ar: وهذا كتاب أنزلناه مبارك فاتبعوه، والحسنة بعشر أمثالها، وإن صلاتي ونسكي ومحياي لله.
    en: This blessed Book revealed — so follow it; a good deed earns tenfold; my prayer and sacrifice belong to Allah.
    tr: Ve bu, bizim vahyettiğimiz kutsanmış bir kitaptır, onu takip edin. İyi işler on kat artmıştır ve dualarım, ayinlerim ve selamlarım Allah'adır.
    id: Dan ini adalah Kitab yang diberkati yang telah Kami wahyukan, maka ikutilah itu. Amal baik berlipat ganda sepuluh kali lipat, dan doa, upacara, serta salamku adalah untuk Allah.
  children:
  - title:
      ar: كتاب مبارك فاتبعوه
      en: A Blessed Book — Follow It
      tr: Mübarek'in kitabını takip edin.
      id: Buku Mubarak, jadi ikuti saja.
    range:
    - 155
    - 157
  - title:
      ar: الحسنة بعشر أمثالها
      en: Tenfold Reward
      tr: İyi bir iş on kat daha fazladır
      id: Perbuatan baik sepuluh kali lebih banyak
    range:
    - 160
    - 160
  - title:
      ar: إن صلاتي ونسكي
      en: My Prayer and My Sacrifice
      tr: Dualarım ve ritüellerim
      id: Doa dan upacara saya
    range:
    - 162
    - 163
