map:
- title:
    ar: آيات القدرة والرعد
    en: Signs of Power and the Thunder
    tr: Güç ve Gök Gürültüsü Dizeleri
    id: Bait-bait Kekuatan dan Petir
  range:
  - 1
  - 18
  family: faith
  summary:
    ar: السماوات بغير عمد، وقطع الأرض المتجاورات، والرعد يسبح بحمده، ومثل الزبد الذاهب جفاء.
    en: Heavens without pillars, neighboring tracts of earth, thunder glorifying Him, the parable of vanishing foam.
    tr: Sütunsuz gökler, bitişik toprak parçaları, gök gürültüsü O'nu yüceltir ve boşuna kaybolan köpük gibi.
    id: Langit tanpa pilar, potongan tanah di sekitarnya, guntur memuliakan-Nya, dan seperti busa yang hilang sia-sia.
  children:
  - title:
      ar: مثل الزبد
      en: The Parable of Foam
      tr: tereyağı gibi
      id: seperti mentega
    range:
    - 17
    - 17
- title:
    ar: صفات أولي الألباب
    en: The Traits of the Understanding
    tr: Bilge Nitelikler
    id: Kualitas Orang Bijaksana
  range:
  - 19
  - 31
  family: faith
  summary:
    ar: الذين يوفون بعهد الله ويصلون ما أمر الله به ويخشون ربهم، وبذكر الله تطمئن القلوب.
    en: Those who fulfill Allah's covenant, join what He ordered joined, fear their Lord; hearts rest in His remembrance.
    tr: Allah'ın ahdini yerine getiren, Allah'ın emrettiği duaları eden, Rablerinden korkan ve Allah'ın hatırasıyla kalpleri huzur bulanlar.
    id: Mereka yang menepati perjanjian Allah, berdoa seperti yang Allah perintahkan, takut kepada Tuhan mereka, dan dengan mengingat Allah hati menemukan kedamaian.
  children:
  - title:
      ar: اطمئنان القلوب
      en: Hearts at Rest
      tr: Kalplerin Güvencesi
      id: Jaminan Hati
    range:
    - 28
    - 28
- title:
    ar: يمحو الله ويثبت
    en: Allah Erases and Confirms
    tr: Tanrı silsin ve istikrar sağlasın
    id: Semoga Tuhan menghapus dan menstabilkan
  range:
  - 32
  - 43
  family: faith
  summary:
    ar: 'مكر الكافرين ومكر الله، ومثل الجنة الموعودة، وخاتمة السورة: أم الكتاب عنده وكفى بالله شهيدا.'
    en: 'The plotters'' plotting answered, the promised Garden''s parable, and the close: the Mother of the Book with Him.'
    tr: 'Kâfirlerin oyunları, Allah''ın oyunları, vaat edilen cennet örneği ve surenin sonu: Kitabın Annesi O''nunkaldır ve Allah şahit olarak yeterlidir.'
    id: 'Intrik orang kafir dan intrik Allah, dan teladan Surga, serta kesimpulan surat: Ibu Kitab Suci bersama-Nya, dan cukup Allah sebagai saksi.'
  children:
  - title:
      ar: أم الكتاب
      en: The Mother of the Book
      tr: Kitabın Annesi
      id: Ibu Buku
    range:
    - 39
    - 39
