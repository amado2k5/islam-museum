surah: 13
slug: ar-rad
sources_consulted:
  - "kuttab.com — Surah Ar-Ra'd mind map (3 blocks: 1-18, 19-31, 32-43)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "آيات القدرة والرعد", en: "Signs of Power and the Thunder" }
    range: [1, 18]
    family: faith
    summary:
      ar: "السماوات بغير عمد، وقطع الأرض المتجاورات، والرعد يسبح بحمده، ومثل الزبد الذاهب جفاء."
      en: "Heavens without pillars, neighboring tracts of earth, thunder glorifying Him, the parable of vanishing foam."
    children:
      - { title: { ar: "مثل الزبد", en: "The Parable of Foam" }, range: [17, 17] }
  - title: { ar: "صفات أولي الألباب", en: "The Traits of the Understanding" }
    range: [19, 31]
    family: faith
    summary:
      ar: "الذين يوفون بعهد الله ويصلون ما أمر الله به ويخشون ربهم، وبذكر الله تطمئن القلوب."
      en: "Those who fulfill Allah's covenant, join what He ordered joined, fear their Lord; hearts rest in His remembrance."
    children:
      - { title: { ar: "اطمئنان القلوب", en: "Hearts at Rest" }, range: [28, 28] }
  - title: { ar: "يمحو الله ويثبت", en: "Allah Erases and Confirms" }
    range: [32, 43]
    family: faith
    summary:
      ar: "مكر الكافرين ومكر الله، ومثل الجنة الموعودة، وخاتمة السورة: أم الكتاب عنده وكفى بالله شهيدا."
      en: "The plotters' plotting answered, the promised Garden's parable, and the close: the Mother of the Book with Him."
    children:
      - { title: { ar: "أم الكتاب", en: "The Mother of the Book" }, range: [39, 39] }
