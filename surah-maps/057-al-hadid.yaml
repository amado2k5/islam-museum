- title:
    ar: الحديد والرسل وأهل الكتاب
    en: Iron, the Messengers, and the People of the Book
    tr: Demir, elçiler ve Kitap Ehlileri
    id: Besi, para utusan, dan Orang-orang Kitab
  range:
  - 25
  - 29
  family: faith
  summary:
    ar: أرسلنا رسلنا بالبينات وأنزلنا معهم الكتاب والميزان ليقوم الناس بالقسط، وأنزلنا الحديد فيه بأس شديد ومنافع للناس؛ وأرسلنا نوحا وإبراهيم وجعلنا في ذريتهما النبوة والكتاب، ثم قفينا بعيسى ابن مريم وآتيناه
      الإنجيل، والرهبانية ابتدعوها ما كتبناها عليهم؛ يا أيها الذين آمنوا اتقوا الله وآمنوا برسوله يؤتكم كفلين من رحمته ويجعل لكم نورا، ليعلم أهل الكتاب ألا يقدرون على شيء من فضل الله وأن الفضل بيد الله
      يؤتيه من يشاء.
    en: 'We sent Our messengers with clear proofs, and sent down with them the Book and the Balance that men may stand in justice; and We sent down iron, in it mighty power and benefits for men; We sent
      Noah and Abraham, placing prophethood and the Book in their offspring, then followed with Jesus son of Mary, giving him the Gospel — as for monasticism, they innovated it, We did not prescribe it;
      O believers, fear Allah and believe in His Messenger: He gives you two shares of His mercy and a light to walk by; so the People of the Book may know they control nothing of Allah''s bounty — bounty
      is in Allah''s hand, He gives it to whom He wills.'
    tr: Elçilerimizi açık delillerle gönderdik ve onlarla birlikte Kitabı ve teraziyi indirdik ki insanlar adaleti sağlasın. Demir indirdik, içinde büyük güç ve faydalı bir şey vardır; Nuh ve İbrahim'i
      gönderdik, onların soylarına peygamberlik ve Kitap yerleştirdik. Sonra Meryem oğlu İsa'yı durdurduk ve ona İncil'i verdik. Manastır hayatı, onlar için yazdıklarımızla uyduruldu. Ey iman edenler, Allah'tan
      korkun ve O'nun Elçisine inanın. O, size iki merhamet garantisi verecek ve size ışık sağlayacak ki, Kutsal Kitap ehlâhı Allah'ın nimetlerine hiçbir yetkleri olmadığını, bu nimetin Allah'ın elindedir;
      O da bunu istediğine verir.
    id: Kami mengirim utusan-Rasul dengan bukti yang jelas dan mengirimkan bersama mereka Kitab dan sisa-sisanya agar manusia dapat menegakkan keadilan. Kami menurunkan besi, di mana terdapat kekuatan dan
      manfaat besar bagi umat; Kami mengutus Nuh dan Abraham dan menempatkan kenabian serta Kitab itu di antara keturunan mereka. Kemudian Kami menghentikan Yesus, putra Maria, dan memberinya Injil. Monastisisme
      ini diciptakan oleh apa yang Kami tulis untuk mereka. Wahai kalian yang telah beriman, takutlah Allah dan percayalah kepada Rasul-Nya. Dia akan memberikan dua jaminan rahmat-Nya dan memberikan terang
      kepada kalian, agar umat Kitab Suci tahu bahwa mereka tidak memiliki kuasa atas rahmat Allah manapun, dan karunia itu ada di tangan Allah; Dia memberikannya kepada siapa pun yang Dia kehendaki.
