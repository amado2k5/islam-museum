map:
- title:
    ar: تسبيح الكون وصفات الله
    en: 'The Cosmos Glorifies Allah: His Attributes'
    tr: Evrenin övgüsünü ve Tanrı'nın niteliklerini
    id: Pujian alam semesta dan sifat-sifat Allah
  range:
  - 1
  - 6
  family: faith
  summary:
    ar: سبح لله ما في السماوات والأرض وهو العزيز الحكيم، له ملك السماوات والأرض يحيي ويميت وهو على كل شيء قدير، هو الأول والآخر والظاهر والباطن، خلق السماوات والأرض في ستة أيام ثم استوى على العرش، يعلم
      ما يلج في الأرض وما يخرج منها، وهو معكم أينما كنتم، يولج الليل في النهار ويعلم ذات الصدور.
    en: Whatever is in the heavens and earth glorifies Allah, the Mighty, the Wise; His is the dominion of the heavens and earth, He gives life and death, over all things powerful; He is the First and the
      Last, the Manifest and the Hidden; He created the heavens and earth in six days then established Himself on the Throne; He knows what enters the earth and what emerges; He is with you wherever you
      are; He merges night into day and knows what breasts conceal.
    tr: Göklerde ve yerde ne varsa Allah'ı yüceltir; O Yüce ve Bilgedir. Göklerin ve yerin egemenliği O'nundadır. O hayat verir, ölüm sağlar ve her şeyin üzerinde yetkilidir. O İlk ve Son, Açık ve Gizlidir.
      Gökleri ve yeryüzünü altı günde yarattı, sonra tahta oturdu. Yeryüzüne neyin girdiğini ve ondan ne çıktığını bilir. Nerede olursanız olun, geceden gündüze girer ve göğsünde ne olduğunu bilir.
    id: Apa pun yang ada di langit dan bumi memuliakan Allah, dan Dia adalah Yang Maha Kuasa, Yang Bijaksana. Bagi-Dia adalah kekuasaan langit dan bumi. Dia memberi kehidupan dan menyebabkan kematian, dan
      Dia berkuasa atas segala sesuatu. Dia adalah yang Pertama dan Terakhir, yang Nyata dan yang Tersembunyi. Dia menciptakan langit dan bumi dalam enam hari, lalu menegakkan diri-Nya di atas takhta. Dia
      tahu apa yang masuk ke bumi dan apa yang keluar darinya. Dia bersama kamu di mana pun kamu berada, masuk malam ke siang dan mengetahui apa yang ada di dada.
  children: []
- title:
    ar: الدعوة إلى الإيمان والإنفاق
    en: The Call to Faith and Spending
    tr: İnanç ve harcamaya çağrı
    id: Panggilan untuk Iman dan Pengeluaran
  range:
  - 7
  - 11
  family: faith
  summary:
    ar: آمنوا بالله ورسوله وأنفقوا مما جعلكم مستخلفين فيه، فالذين آمنوا منكم وأنفقوا لهم أجر كبير؛ والرسول يدعوكم لتؤمنوا بربكم وقد أخذ ميثاقكم؛ وينزل على عبده آيات بينات ليخرجكم من الظلمات إلى النور؛ لا
      يستوي من أنفق من قبل الفتح وقاتل ومن أنفق من بعد؛ ومن يقرض الله قرضا حسنا يضاعفه له.
    en: Believe in Allah and His Messenger and spend from what He made you trustees of — those who believe and spend have a great reward; the Messenger calls you to believe in your Lord, having taken your
      covenant; He sends down clear verses to His servant to bring you from darkness to light; not equal are those who spent before the Victory and fought and those after; whoever lends Allah a goodly loan,
      He multiplies it.
    tr: Allah'a ve O'nun Elçisine inanın ve O'nun size halef yaptığı şeyden harca yapın. Aranızdan iman eden ve para harcayanlar büyük bir ödül alır; Peygamber sizi, Rabbinizin antlaştığına inanmaya davet
      eder; sizi karanlıktan çıkaracak biçimde gullarına açık aletler indirir. Fetihden önce harcayan ve savaşanlarla sonrasında harcayanlar eşit değildir; Allah'a iyi bir borç veren ona çoğaltır.
    id: Percayalah kepada Allah dan Rasul-Nya dan habiskan dari apa yang telah Dia tetapkan sebagai penerus. Mereka yang percaya dan menghabiskan uang akan menerima ganjaran besar; dan Rasulullah mengajak
      kalian untuk percaya kepada Tuhan yang telah mengambil perjanjian; dan Dia mengirimkan tanda-tanda jelas kepada hamba-Nya untuk membawa kalian keluar dari kegelapan menuju terang. Mereka yang menghabiskan
      sebelum penaklukan dan berperang serta yang menghabiskan setelahnya tidak setara; dan siapa pun yang meminjamkan pinjaman yang baik kepada Allah, Dia melipatgandakannya untuknya.
