- title:
    ar: النور يوم القيامة
    en: The Light on the Day of Resurrection
    tr: Diriliş Günü'ndeki ışık
    id: Cahaya pada Hari Kebangkitan
  range:
  - 12
  - 19
  family: faith
  summary:
    ar: يوم ترى المؤمنين والمؤمنات يسعى نورهم بين أيديهم وبأيمانهم بشراكم اليوم جنات، والمنافقون يلتمسون نورا فيضرب بينهم بسور له باب باطنه الرحمة وظاهره العذاب؛ ثم دعوة للخشوع لذكر الله وما نزل من الحق،
      ووعد المتصدقين والمتصدقات بالأجر الكريم، والذين آمنوا بالله ورسله أولئك هم الصديقون والشهداء لهم أجرهم ونورهم.
    en: 'On the Day you see the believing men and women, their light running before them and on their right: glad tidings of gardens; the hypocrites seek light, and a wall with a gate is struck between
      them, its inside mercy, its outside torment; then a call to humility before Allah''s remembrance and the truth revealed; the charitable men and women promised a generous reward; those who believe
      in Allah and His messengers are the truthful and the martyrs, with their reward and light.'
    tr: Bugün müjdenizi aldığınız müjdeyle ellerinde ve sağ ellerinde ışıklarını arayan iman eden erkekleri ve iman edenleri gördüğün gün, cennetler. Münafıklar ışık ararlar ve aralarına bir duvar örülür;
      kapı içi merhamet, dış görünüşü ise cezadır; sonra Allah'ı ve doğru vahyedilenleri hatırlamaya ve sadakatlere cömert bir ödül vaat etmeye alçakgönüllülük çağrısı yapılır. Allah'a ve O'nun elçilerine
      iman edenler doğrulardır ve şehitler ödülünü ve ışığını alırlar.
    id: Hari di mana kamu melihat orang beriman dan orang beriman mencari cahaya mereka di depan tangan dan tangan kanan mereka dengan kabar baik kalian hari ini, taman. Dan orang-orang munafik mencari
      cahaya, dan sebuah tembok dihantam di antara mereka dengan pintu yang pintu dalamnya adalah rahmat dan penampilan luarnya adalah hukuman; lalu seruan untuk rendah hati untuk mengingat Allah dan apa
      yang telah diwahyukan dari kebenaran, dan menjanjikan kasih kepada pria dan wanita ganjaran yang murah hati. Dan mereka yang percaya kepada Allah dan utusan-Nya - mereka adalah yang benar, dan para
      syuhada akan menerima ganjaran dan cahaya mereka.
