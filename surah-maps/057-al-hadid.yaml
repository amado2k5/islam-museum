map:
  - title: { ar: "تسبيح الكون وصفات الله", en: "The Cosmos Glorifies Allah: His Attributes" }
    range: [1, 6]
    family: faith
    summary:
      ar: "سبح لله ما في السماوات والأرض وهو العزيز الحكيم، له ملك السماوات والأرض يحيي ويميت وهو على كل شيء قدير، هو الأول والآخر والظاهر والباطن، خلق السماوات والأرض في ستة أيام ثم استوى على العرش، يعلم ما يلج في الأرض وما يخرج منها، وهو معكم أينما كنتم، يولج الليل في النهار ويعلم ذات الصدور."
      en: "Whatever is in the heavens and earth glorifies Allah, the Mighty, the Wise; His is the dominion of the heavens and earth, He gives life and death, over all things powerful; He is the First and the Last, the Manifest and the Hidden; He created the heavens and earth in six days then established Himself on the Throne; He knows what enters the earth and what emerges; He is with you wherever you are; He merges night into day and knows what breasts conceal."
    children: []
  - title: { ar: "الدعوة إلى الإيمان والإنفاق", en: "The Call to Faith and Spending" }
    range: [7, 11]
    family: faith
    summary:
      ar: "آمنوا بالله ورسوله وأنفقوا مما جعلكم مستخلفين فيه، فالذين آمنوا منكم وأنفقوا لهم أجر كبير؛ والرسول يدعوكم لتؤمنوا بربكم وقد أخذ ميثاقكم؛ وينزل على عبده آيات بينات ليخرجكم من الظلمات إلى النور؛ لا يستوي من أنفق من قبل الفتح وقاتل ومن أنفق من بعد؛ ومن يقرض الله قرضا حسنا يضاعفه له."
      en: "Believe in Allah and His Messenger and spend from what He made you trustees of — those who believe and spend have a great reward; the Messenger calls you to believe in your Lord, having taken your covenant; He sends down clear verses to His servant to bring you from darkness to light; not equal are those who spent before the Victory and fought and those after; whoever lends Allah a goodly loan, He multiplies it."
    children:
      - { title: { ar: "آمنوا وأنفقوا", en: "Believe and Spend" }, range: [7, 9] }
      - { title: { ar: "درجات المنفقين والقرض الحسن", en: "Ranks of Spenders and the Goodly Loan" }, range: [10, 11] }
  - title: { ar: "النور يوم القيامة", en: "The Light on the Day of Resurrection" }
    range: [12, 19]
    family: faith
    summary:
      ar: "يوم ترى المؤمنين والمؤمنات يسعى نورهم بين أيديهم وبأيمانهم بشراكم اليوم جنات، والمنافقون يلتمسون نورا فيضرب بينهم بسور له باب باطنه الرحمة وظاهره العذاب؛ ثم دعوة للخشوع لذكر الله وما نزل من الحق، ووعد المتصدقين والمتصدقات بالأجر الكريم، والذين آمنوا بالله ورسله أولئك هم الصديقون والشهداء لهم أجرهم ونورهم."
      en: "On the Day you see the believing men and women, their light running before them and on their right: glad tidings of gardens; the hypocrites seek light, and a wall with a gate is struck between them, its inside mercy, its outside torment; then a call to humility before Allah's remembrance and the truth revealed; the charitable men and women promised a generous reward; those who believe in Allah and His messengers are the truthful and the martyrs, with their reward and light."
    children:
      - { title: { ar: "نور المؤمنين والسور", en: "The Believers' Light and the Wall" }, range: [12, 15] }
      - { title: { ar: "الخشوع لذكر الله", en: "Humility Before Allah's Remembrance" }, range: [16, 17] }
      - { title: { ar: "المتصدقون والصديقون والشهداء", en: "The Charitable, the Truthful, the Martyrs" }, range: [18, 19] }
  - title: { ar: "حقيقة الدنيا والقضاء", en: "The Reality of Worldly Life and the Decree" }
    range: [20, 24]
    family: faith
    summary:
      ar: "اعلموا أنما الحياة الدنيا لعب ولهو وزينة وتفاخر وتكاثر كمثل غيث أعجب الكفار نباته ثم يهيج فتراه مصفرا ثم يكون حطاما، وسابقوا إلى مغفرة من ربكم وجنة عرضها كعرض السماء والأرض؛ ما أصاب من مصيبة في الأرض ولا في أنفسكم إلا في كتاب من قبل أن نبرأها؛ لكيلا تأسوا على ما فاتكم ولا تفرحوا بما آتاكم، والله لا يحب كل مختال فخور الذين يبخلون ويأمرون الناس بالبخل."
      en: "Know that worldly life is but play, diversion, adornment, mutual boasting, and rivalry — like rain whose growth pleases the tillers, then it withers, you see it yellowing, then crumbled; race to forgiveness from your Lord and a garden as wide as sky and earth; no calamity befalls earth or yourselves but is in a Book before We bring it about — so grieve not over what escapes you nor exult in what comes to you; Allah loves no vainglorious boaster, who are miserly and bid men to miserliness."
    children:
      - { title: { ar: "الدنيا لعب والمسارعة إلى المغفرة", en: "This World Is Play; Race to Forgiveness" }, range: [20, 21] }
      - { title: { ar: "المصيبة في كتاب والبخلاء", en: "Calamity in a Book; the Misers" }, range: [22, 24] }
  - title: { ar: "الحديد والرسل وأهل الكتاب", en: "Iron, the Messengers, and the People of the Book" }
    range: [25, 29]
    family: faith
    summary:
      ar: "أرسلنا رسلنا بالبينات وأنزلنا معهم الكتاب والميزان ليقوم الناس بالقسط، وأنزلنا الحديد فيه بأس شديد ومنافع للناس؛ وأرسلنا نوحا وإبراهيم وجعلنا في ذريتهما النبوة والكتاب، ثم قفينا بعيسى ابن مريم وآتيناه الإنجيل، والرهبانية ابتدعوها ما كتبناها عليهم؛ يا أيها الذين آمنوا اتقوا الله وآمنوا برسوله يؤتكم كفلين من رحمته ويجعل لكم نورا، ليعلم أهل الكتاب ألا يقدرون على شيء من فضل الله وأن الفضل بيد الله يؤتيه من يشاء."
      en: "We sent Our messengers with clear proofs, and sent down with them the Book and the Balance that men may stand in justice; and We sent down iron, in it mighty power and benefits for men; We sent Noah and Abraham, placing prophethood and the Book in their offspring, then followed with Jesus son of Mary, giving him the Gospel — as for monasticism, they innovated it, We did not prescribe it; O believers, fear Allah and believe in His Messenger: He gives you two shares of His mercy and a light to walk by; so the People of the Book may know they control nothing of Allah's bounty — bounty is in Allah's hand, He gives it to whom He wills."
    children:
      - { title: { ar: "إنزال الحديد", en: "Sending Down Iron" }, range: [25, 25] }
      - { title: { ar: "نوح وإبراهيم وعيسى والرهبانية", en: "Noah, Abraham, Jesus, and Monasticism" }, range: [26, 27] }
      - { title: { ar: "خطاب أهل الكتاب", en: "Address to the People of the Book" }, range: [28, 29] }
