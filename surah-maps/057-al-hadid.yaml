- title:
    ar: حقيقة الدنيا والقضاء
    en: The Reality of Worldly Life and the Decree
    tr: Dünyanın gerçekliği ve kaderi
    id: Realitas dunia dan takdir
  range:
  - 20
  - 24
  family: faith
  summary:
    ar: اعلموا أنما الحياة الدنيا لعب ولهو وزينة وتفاخر وتكاثر كمثل غيث أعجب الكفار نباته ثم يهيج فتراه مصفرا ثم يكون حطاما، وسابقوا إلى مغفرة من ربكم وجنة عرضها كعرض السماء والأرض؛ ما أصاب من مصيبة في
      الأرض ولا في أنفسكم إلا في كتاب من قبل أن نبرأها؛ لكيلا تأسوا على ما فاتكم ولا تفرحوا بما آتاكم، والله لا يحب كل مختال فخور الذين يبخلون ويأمرون الناس بالبخل.
    en: Know that worldly life is but play, diversion, adornment, mutual boasting, and rivalry — like rain whose growth pleases the tillers, then it withers, you see it yellowing, then crumbled; race to
      forgiveness from your Lord and a garden as wide as sky and earth; no calamity befalls earth or yourselves but is in a Book before We bring it about — so grieve not over what escapes you nor exult
      in what comes to you; Allah loves no vainglorious boaster, who are miserly and bid men to miserliness.
    tr: Bil ki bu dünyanın yaşamı sadece oyun, eğlence, süsleme, övünme ve çoğaltmadır; kâfirlerin hayranlık duyduğu yağmur gibidir, sonra kıpırdar, sen onu sarımsı görürsünüz, sonra enkaza dönüşür. Rabbinizden
      bağışlanmaya ve gökyüzü ile yeryüzü genişliğinde bir bahçeye acele edin; yere ya da size hiçbir felaket sadece bir kitapta gelir, biz onu iyileştiririz ki, kaçırdığınız için üzülmeyesiniz ve size
      verilenle sevinmeyin. Allah, cimri ve cimri olmaya emreden her böbürlenen aptalı sevmez.
    id: Ketahuilah bahwa kehidupan dunia ini hanyalah permainan, hiburan, hiasan, pamer, dan perbanyakan, seperti hujan yang tumbuhannya dikagumi oleh orang kafir, lalu ia bergerak, dan kamu melihatnya
      menjadi kuning lalu menjadi puing-puing. Cepatlah menuju pengampunan dari Tuhanmu dan taman selebar langit dan bumi; tidak ada malapetaka yang menimpa bumi atau dirimu kecuali dalam sebuah kitab sebelum
      Kami menyembuhkannya, agar kamu tidak berduka atas apa yang telah kamu lewatkan atau bersukacita atas apa yang telah diberikan kepadamu. Dan Allah tidak menyukai setiap orang bodoh yang sombong dan
      pelit memerintahkan orang untuk pelit.
