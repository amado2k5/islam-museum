- title:
    ar: قصة نوح
    en: The Story of Noah
    tr: Nuh'un Hikayesi
    id: Kisah Nuh
  range:
  - 9
  - 17
  family: stories
  summary:
    ar: 'قوم نوح كذبوا عبدنا وقالوا مجنون وازدجر، فدعا ربه أني مغلوب فانتصر، ففتحت أبواب السماء وفجرت الأرض عيونا، وحملناه على ذات ألواح ودسر، وتركناها آية: فهل من مدكر.'
    en: 'Noah''s people denied Our servant, calling him mad and threatened; he called his Lord: I am overcome, so help; the sky''s gates opened and the earth gushed springs, and We carried him on planks
      and nails, leaving it a sign — so is there any who will remember.'
    tr: 'Nuh halkı hizmetkârımızı reddetti ve onun deli ve kibirli olduğunu söylediler. Bunun üzerine Rabbisine seslendi, ''Yendim,'' ve O zafer kazandı. Gökyüzünün kapıları açıldı ve yeryüzü kaynaklar
      fışkırdı. Onu tabletler ve tepsilerle taşıdık, onları bir işaret olarak bıraktık: Hatırlayacak olan var mı?'
    id: 'Orang-orang Nuh menolak hamba Kami dan berkata dia gila dan sombong. Maka dia memanggil Tuhan-Nya, ''Aku telah kalah,'' dan Dia menang. Gerbang surga terbuka, dan bumi memancar dari mata air. Kami
      menggendongnya di atas lempeng dan piring, dan meninggalkannya sebagai tanda: Adakah yang akan mengingatnya?'
  children: []
- title:
    ar: قصة عاد
    en: The Story of 'Ad
    tr: Ad hikayesi
    id: Kisah Ad
  range:
  - 18
  - 22
  family: stories
  summary:
    ar: 'عاد كذبت فكيف كان عذابي ونذر: أرسلنا عليهم ريحا صرصرا في يوم نحس مستمر تنزع الناس كأنهم أعجاز نخل منقعر، ويسرنا القرآن للذكر فهل من مدكر.'
    en: '''Ad denied — how were My punishment and warnings: We sent against them a furious wind on a day of continuous ill fortune, uprooting people like uprooted palm trunks; and We made the Quran easy
      for remembrance, so is there any who will remember.'
    tr: 'Sonra yalan söyledim, peki cezam ve uyarım nasıldı: Üzerlerine sürekli bir felaketle kükreyen bir rüzgar gönderdik, insanları içbükey bir palmiye ağacının mucizeleri gibi uzaklaştıracak ve Kur''an''ı
      kolay hatırlamayı sağladık, kimse hatırlayacak mı?'
    id: 'Lalu Aku berbohong, jadi bagaimana hukuman dan peringatan-Ku: Kami mengirimkan angin kencang atas malapetaka yang terus-menerus yang akan mengusir orang-orang seolah-olah mereka adalah mukjizat
      pohon palem cekung, dan Kami membuat Al-Qur''an mudah diingat, jadi adakah yang akan mengingat?'
  children: []
- title:
    ar: قصة ثمود
    en: The Story of Thamud
    tr: Thamud'un Hikayesi
    id: Kisah Thamud
  range:
  - 23
  - 32
  family: stories
  summary:
    ar: ثمود كذبت بالنذر وقالت أبشرا منا واحدا نتبعه، فعقروا الناقة فأخذتهم صيحة واحدة فكانوا كهشيم المحتظر، ويسرنا القرآن للذكر فهل من مدكر.
    en: 'Thamud denied the warnings, saying: shall we follow a single human from among us; they hamstrung the she-camel, so one Blast seized them and they became like dry twigs of a fence-builder; and We
      made the Quran easy for remembrance.'
    tr: Semud yeminini reddetti ve dedi ki, 'Birimize müjde ver, onu takip etsin.' Dişi deveyi kestiler, tek bir çığlık onları yakaladı, bekleyiş yerinin saklı gibi oldular. Kur'an'ı hatırlamayı kolaylaştırdık,
      hatırlayacak olan var mı?
    id: Thamud menolak sumpahnya dan berkata, 'Berikanlah kabar bahagia kepada salah satu dari kami untuk diikuti.' Mereka membantai unta betina, dan satu teriakan pun menyerang mereka, dan mereka menjadi
      seperti janggut di tempat menunggu. Kami telah membuat Al-Qur'an mudah dikenang, jadi adakah yang akan mengingat?
  children: []
- title:
    ar: قصة لوط
    en: The Story of Lot
    tr: Lot'un Hikayesi
    id: Kisah Lot
  range:
  - 33
  - 40
  family: stories
  summary:
    ar: قوم لوط كذبوا بالنذر، فأرسلنا عليهم حاصبا إلا آل لوط نجيناهم بسحر نعمة من عندنا، وطمسنا أعينهم فذوقوا عذابي ونذر، ويسرنا القرآن للذكر فهل من مدكر.
    en: Lot's people denied the warnings, so We sent a storm of stones except Lot's family, saved at dawn as a favor from Us; We blinded their eyes — taste My punishment and warnings; and We made the Quran
      easy for remembrance.
    tr: Lut halkı yeminlerini reddetti, bu yüzden onlara Lut'un ailesinden başka bir günah keçisi gönderdik, onları bizden aldığımız bir lütufla sihirle kurtardık ve gözlerini kör ettik, böylece benim cezamı
      ve yeminimi tatsınlar. Kur'an'ı hatırlamayı kolaylaştırdık, hatırlayacak kimse var mı?
    id: Orang-orang Lot menyangkal sumpah mereka, maka Kami mengirim kambing hitam kecuali keluarga Lot, menyelamatkan mereka dengan sihir atas rahmat Kami, dan Kami membutakan mata mereka, sehingga mereka
      merasakan hukuman dan sumpah Kami. Kami membuat Al-Qur'an mudah diingat, jadi adakah yang akan mengingat?
  children: []
- title:
    ar: قصة فرعون وإنذار قريش
    en: Pharaoh's Story and the Warning to Quraysh
    tr: Firavun'un hikayesi ve Kureyş'in uyarısı
    id: Kisah Firaun dan peringatan Quraisy
  range:
  - 41
  - 45
  family: stories
  summary:
    ar: 'آل فرعون كذبوا بآياتنا كلها فأخذناهم أخذ عزيز مقتدر، ثم سؤال لقريش: أكفاركم خير من أولئكم، وتهديد بيوم بدر: سيهزم الجمع ويولون الدبر.'
    en: 'Pharaoh''s folk denied all Our signs, so We seized them with a mighty seizure; then Quraysh are asked: are your disbelievers better than those; and warned: the multitude will be routed and turn
      their backs.'
    tr: 'Firavun halkı tüm işaretlerimizi reddetti, biz de onları güçlü ve güçlü bir yakalamayla yakaladık. Sonra Kureyş''e soruldu: Kâfirleriniz aranızdakilerden daha iyidir ve Beder Günü tehdididir: Kuvvetler
      yenilecek ve geri püskürtülecek.'
    id: 'Umat Firaun menolak semua tanda Kami, maka Kami menangkapnya dengan serangan yang kuat dan kuat. Kemudian Quraisy ditanya: Orang kafirmu lebih baik daripada yang ada di antara kalian, dan ancaman
      Hari Badr: Pasukan akan dikalahkan dan dipukul mundur.'
  children: []
- title:
    ar: يوم القيامة والجزاء
    en: The Day of Judgment and Recompense
    tr: Kıyamet ve Ceza Günü
    id: Hari Penghakiman dan Hukuman
  range:
  - 46
  - 55
  family: faith
  summary:
    ar: بل الساعة موعدهم والساعة أدهى وأمر، المجرمون في ضلال وسعر يسحبون في النار، وكل شيء خلقناه بقدر، وأعمالهم في زبر مسطورة، والمتقون في جنات ونهر في مقعد صدق عند مليك مقتدر.
    en: Rather the Hour is their appointment, and the Hour is more calamitous and bitter; the criminals in error and madness, dragged into the Fire; everything We created in due measure, their deeds in
      written records; the God-conscious in gardens and rivers, in a seat of truth near an Omnipotent Sovereign.
    tr: Vakit onların belirlendiği zamandır ve Saat daha sert ve daha belirleyicidir. Suçlular hatalı ve bedel içinde Ateşe sürüklenir, kaderle yarattığımız her şey vardır, yaptıkları kayıtlı bir kafeste
      olur, doğru olanlar ise güçlü bir Kral'ın yanında bahçelerde ve nehirlerde gerçek bir yerdedir.
    id: Sebaliknya, Jam adalah waktu yang ditetapkan mereka, dan Jam itu lebih berat dan lebih menentukan. Para penjahat berada dalam kesalahan dan harga, diseret ke dalam Api, dan segala sesuatu yang Kita
      ciptakan oleh takdir, dan perbuatan mereka tercatat dalam sangkar yang tercatat, dan orang benar berada di taman dan sungai di kursi kebenaran bersama Raja yang kuat.
  children:
