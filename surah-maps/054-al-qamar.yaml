map:
- title:
    ar: انشقاق القمر واقتراب الساعة
    en: The Splitting of the Moon and the Near Hour
    tr: Ayın bölünmesi ve yaklaşan saat
    id: Bulan yang terbelah dan jam yang mendekat
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: اقتربت الساعة وانشق القمر آية على قربها، فيعرض المكذبون ويقولون سحر مستمر، ثم مشهد الخروج من الأجداث إلى الداعي سراعا كأنهم جراد منتشر.
    en: The Hour drew near and the moon split as its sign, yet the deniers turn away calling it continuous magic; then the scene of emerging from the graves, hastening to the Caller like scattered locusts.
    tr: Saat yaklaştı ve ay bir işaret olarak ayrıldı, inkarcıları sundu ve sürekli büyü dedi, ardından kıvılcımın çağırana dağılmış çekirge gibi fırladığı sahne geldi.
    id: Jam itu mendekat dan bulan terbelah sebagai tanda di dekatnya, memperlihatkan para penyangkal dan mengatakan sihir yang terus-menerus, lalu adegan percikan itu berlari ke arah penelepon seolah-olah
      mereka adalah belalang yang tersebar.
