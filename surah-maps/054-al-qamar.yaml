map:
  - title: { ar: "انشقاق القمر واقتراب الساعة", en: "The Splitting of the Moon and the Near Hour" }
    range: [1, 8]
    family: faith
    summary:
      ar: "اقتربت الساعة وانشق القمر آية على قربها، فيعرض المكذبون ويقولون سحر مستمر، ثم مشهد الخروج من الأجداث إلى الداعي سراعا كأنهم جراد منتشر."
      en: "The Hour drew near and the moon split as its sign, yet the deniers turn away calling it continuous magic; then the scene of emerging from the graves, hastening to the Caller like scattered locusts."
    children:
      - { title: { ar: "انشقاق القمر وإعراض المكذبين", en: "The Moon Split; the Deniers Turn Away" }, range: [1, 5] }
      - { title: { ar: "الخروج إلى الداعي", en: "Emerging Toward the Caller" }, range: [6, 8] }
  - title: { ar: "قصة نوح", en: "The Story of Noah" }
    range: [9, 17]
    family: stories
    summary:
      ar: "قوم نوح كذبوا عبدنا وقالوا مجنون وازدجر، فدعا ربه أني مغلوب فانتصر، ففتحت أبواب السماء وفجرت الأرض عيونا، وحملناه على ذات ألواح ودسر، وتركناها آية: فهل من مدكر."
      en: "Noah's people denied Our servant, calling him mad and threatened; he called his Lord: I am overcome, so help; the sky's gates opened and the earth gushed springs, and We carried him on planks and nails, leaving it a sign — so is there any who will remember."
    children: []
  - title: { ar: "قصة عاد", en: "The Story of 'Ad" }
    range: [18, 22]
    family: stories
    summary:
      ar: "عاد كذبت فكيف كان عذابي ونذر: أرسلنا عليهم ريحا صرصرا في يوم نحس مستمر تنزع الناس كأنهم أعجاز نخل منقعر، ويسرنا القرآن للذكر فهل من مدكر."
      en: "'Ad denied — how were My punishment and warnings: We sent against them a furious wind on a day of continuous ill fortune, uprooting people like uprooted palm trunks; and We made the Quran easy for remembrance, so is there any who will remember."
    children: []
  - title: { ar: "قصة ثمود", en: "The Story of Thamud" }
    range: [23, 32]
    family: stories
    summary:
      ar: "ثمود كذبت بالنذر وقالت أبشرا منا واحدا نتبعه، فعقروا الناقة فأخذتهم صيحة واحدة فكانوا كهشيم المحتظر، ويسرنا القرآن للذكر فهل من مدكر."
      en: "Thamud denied the warnings, saying: shall we follow a single human from among us; they hamstrung the she-camel, so one Blast seized them and they became like dry twigs of a fence-builder; and We made the Quran easy for remembrance."
    children: []
  - title: { ar: "قصة لوط", en: "The Story of Lot" }
    range: [33, 40]
    family: stories
    summary:
      ar: "قوم لوط كذبوا بالنذر، فأرسلنا عليهم حاصبا إلا آل لوط نجيناهم بسحر نعمة من عندنا، وطمسنا أعينهم فذوقوا عذابي ونذر، ويسرنا القرآن للذكر فهل من مدكر."
      en: "Lot's people denied the warnings, so We sent a storm of stones except Lot's family, saved at dawn as a favor from Us; We blinded their eyes — taste My punishment and warnings; and We made the Quran easy for remembrance."
    children: []
  - title: { ar: "قصة فرعون وإنذار قريش", en: "Pharaoh's Story and the Warning to Quraysh" }
    range: [41, 45]
    family: stories
    summary:
      ar: "آل فرعون كذبوا بآياتنا كلها فأخذناهم أخذ عزيز مقتدر، ثم سؤال لقريش: أكفاركم خير من أولئكم، وتهديد بيوم بدر: سيهزم الجمع ويولون الدبر."
      en: "Pharaoh's folk denied all Our signs, so We seized them with a mighty seizure; then Quraysh are asked: are your disbelievers better than those; and warned: the multitude will be routed and turn their backs."
    children: []
  - title: { ar: "يوم القيامة والجزاء", en: "The Day of Judgment and Recompense" }
    range: [46, 55]
    family: faith
    summary:
      ar: "بل الساعة موعدهم والساعة أدهى وأمر، المجرمون في ضلال وسعر يسحبون في النار، وكل شيء خلقناه بقدر، وأعمالهم في زبر مسطورة، والمتقون في جنات ونهر في مقعد صدق عند مليك مقتدر."
      en: "Rather the Hour is their appointment, and the Hour is more calamitous and bitter; the criminals in error and madness, dragged into the Fire; everything We created in due measure, their deeds in written records; the God-conscious in gardens and rivers, in a seat of truth near an Omnipotent Sovereign."
    children:
      - { title: { ar: "الساعة موعدهم", en: "The Hour Is Their Appointment" }, range: [46, 48] }
      - { title: { ar: "القدر والكتاب المسطور", en: "The Decree and the Written Record" }, range: [49, 53] }
      - { title: { ar: "المتقون في مقعد صدق", en: "The God-conscious in a Seat of Truth" }, range: [54, 55] }
