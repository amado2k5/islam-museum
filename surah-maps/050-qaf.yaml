surah: 50
slug: qaf
sources_consulted:
- 'kuttab.com — Surah Qaf mind map (3 blocks: 1-15, 16-30, 31-45)'
- 'arz.wikipedia.org — سورة ق: موضوع السورة (6-part thematic division)'
map:
- title:
    ar: إنكار البعث وأدلة ثبوته
    en: Denial of Resurrection and Its Proofs
    tr: Baas'ın Reddi ve Kuruluşuna Dair Kanıtlar
    id: Penolakan Baath dan Bukti Pendiriannya
  range:
  - 1
  - 11
  family: faith
  summary:
    ar: افتتاح بالقسم بالقرآن المجيد، وتعجب المكذبين من بعث بعد التراب، ثم أدلة القدرة في السماء المحكمة البناء والأرض الممدودة والماء المبارك الذي يحيي الموتى.
    en: Opens with the oath by the Glorious Quran, the deniers' wonder at return after dust, then proofs of power in the firmly built sky, the spread earth, and the blessed rain that revives the dead.
    tr: Muhteşem Kur'an'ın yeminiyle açılır ve inkarcılar tozdan sonra dirilişe, ardından iyi inşa edilmiş gökyüzünde, geniş toprakta ve ölülere hayat veren kutsanmış suda gücün kanıtlarına hayran kalırlar.
    id: Dibuka dengan sumpah oleh Al-Qur'an yang Mulia, para penyangkal takjub akan kebangkitan setelah debu, lalu bukti kekuatan di surga yang terbangun dengan baik, bumi yang terbentang, dan air yang
      diberkati yang memberi kehidupan kepada orang mati.
  children:
  - title:
      ar: القسم وتعجب المكذبين
      en: The Oath and the Deniers' Wonder
      tr: Yemin ve inkârcıların hayranlığı
      id: Sumpah dan kekaguman para penyangkal
    range:
    - 1
    - 5
  - title:
      ar: أدلة القدرة في الكون
      en: Proofs of Power in the Cosmos
      tr: Evrendeki Yetenek Kanıtı
      id: Bukti Kemampuan di Alam Semesta
    range:
    - 6
    - 11
- title:
    ar: مصارع الأمم المكذبة
    en: The Fates of Past Deniers
    tr: Yalancı Ulusların Güreşçisi
    id: Pegulat Bangsa-Bangsa Berbaring
  range:
  - 12
  - 15
  family: stories
  summary:
    ar: 'قوم نوح وعاد وفرعون وثمود وقوم لوط وأصحاب الأيكة وقوم تبع: كذبوا الرسل فحق عليهم الوعيد.'
    en: 'Noah''s people, ''Ad, Pharaoh, Thamud, Lot''s people, the companions of the Thicket, and Tubba'': they denied the messengers, so the warning came true.'
    tr: 'Nuh, Ad, Firavun, Semud, Lut halkı, çalılık yoldaşları ve Tubba halkı: Elçiler yalan söyledi, böylece uyarı onlara karşı gerçekleşti.'
    id: 'Orang-orang Nuh, ''Ad, Firaun, Thamud, umat Lot, para pengikut semak, dan orang-orang Tubba: Para utusan berbohong, sehingga peringatan itu menjadi kenyataan terhadap mereka.'
  children: []
- title:
    ar: خلق الإنسان وعلم الله
    en: Man's Creation and Allah's Knowledge
    tr: İnsan yaratıldı ve Tanrı öğretti
    id: Manusia diciptakan dan Tuhan diajarkan
  range:
  - 16
  - 18
  family: faith
  summary:
    ar: الله خلق الإنسان ويعلم وسوسة نفسه، وهو أقرب إليه من حبل الوريد، وعن اليمين والشمال قعيدان يسجلان كل لفظ.
    en: Allah created man and knows his inner whisperings, nearer to him than the jugular vein, with two seated recorders noting every word.
    tr: Tanrı insanı yarattı ve ruhunun fısıltısını bilir, O'na bir şah damarından daha yakındır, sağda ve solda her kelimeyi kaydeden iki basamak vardır.
    id: Tuhan menciptakan manusia dan mengetahui bisikan jiwanya, dan Dia lebih dekat kepada-Nya daripada pembuluh urat jugular, dan di kanan dan kiri ada dua anak tangga yang merekam setiap kata.
  children: []
- title:
    ar: سكرة الموت ويوم البعث
    en: Death's Throes and Resurrection Day
    tr: Ölümün Şekeri ve Diriliş Günü
    id: Gula Kematian dan Hari Kebangkitan
  range:
  - 19
  - 30
  family: faith
  summary:
    ar: 'سكرة الموت بالحق، والنفخ في الصور، وكشف الغطاء عن البصر، والخصومة بين الإنسان وقرينه، ثم سؤال جهنم: هل من مزيد.'
    en: 'The stupor of death in truth, the trumpet blast, the lifting of the veil from sight, the dispute between man and his companion, then Hell asked: is there more.'
    tr: 'Ölümün gerçekle sarhoş olması, borunun çalması, perdenin gözden kalkması, insan ile yoldaşı arasındaki anlaşmazlık, ardından cehennem sorusu: Daha var mı?'
    id: 'Kemabukan kematian dengan kebenaran, tiupan terompet, penghapusan tirai dari pandangan, perselisihan antara manusia dan temannya, lalu pertanyaan tentang Neraka: Apakah masih ada lagi?'
  children:
  - title:
      ar: سكرة الموت وكشف الغطاء
      en: Death's Stupor and the Lifted Veil
      tr: Death Sugar ve Kapak Açıklaması
      id: Death Sugar dan Pengungkapan Sampul
    range:
    - 19
    - 22
  - title:
      ar: الخصومة يوم الحساب
      en: The Dispute on the Day of Reckoning
      tr: Kıyamet Günü'nde Anlaşmazlık
      id: Sengketa pada Hari Pengadilan
    range:
    - 23
    - 29
  - title:
      ar: 'قول جهنم: هل من مزيد'
      en: 'Hell Asked: Is There More'
      tr: 'Cehennemin sözü: Daha fazlası var mı'
      id: 'Sungguh berkata: Apakah masih ada lebih banyak'
    range:
    - 30
    - 30
- title:
    ar: الجنة للمتقين
    en: Paradise for the God-conscious
    tr: Tanrı korkusuyla uğraşanlar için cennet
    id: Surga bagi yang takut akan Tuhan
  range:
  - 31
  - 35
  family: faith
  summary:
    ar: 'أزلفت الجنة للمتقين غير بعيد، لمن خشي الرحمن بالغيب وجاء بقلب منيب: ادخلوها بسلام، لهم ما يشاءون فيها ولدينا مزيد.'
    en: 'Paradise brought near the God-conscious, for whoever feared the Most Merciful unseen and came with a penitent heart: enter in peace, with all they wish and more with Us.'
    tr: 'Cennet, görünmeyenden korkan ve dönen kalple gelenler için, çok uzak olmayan doğruculara açıkça belirtilmiştir: Huzur içinde girin; orada istediklerini alacaklar ve bizimle daha fazlası vardır.'
    id: 'Surga telah dijelaskan kepada orang benar, tidak jauh dari sana, bagi mereka yang takut pada yang tak terlihat dan datang dengan hati yang berubah: Masuklah dengan damai; mereka akan mendapatkan
      apa pun yang mereka inginkan di dalamnya, dan bersama Kami ada lebih banyak lagi.'
  children: []
- title:
    ar: تهديد المكذبين وتسلية الرسول
    en: Warning the Deniers, Consoling the Messenger
    tr: Yalancıları Tehdit Etmek ve Peygamberi Eğlendirmek
    id: Mengancam Para Pembohong dan Menghibur Nabi
  range:
  - 36
  - 45
  family: faith
  summary:
    ar: قرون أهلكها الله قبلهم رغم بطشها، وخلق السماوات والأرض في ستة أيام بلا لغوب، ثم مشهد الصيحة والحشر، وخاتمة بالتذكير بالقرآن لمن يخاف الوعيد.
    en: Generations destroyed before them despite their might, the heavens and earth created in six days without weariness, then the scene of the Blast and the gathering, closing with reminding by the Quran
      whoever fears the warning.
    tr: Tanrı'nın zulme rağmen onlardan önce yok ettiği yüzyıllar, gökleri ve yeryüzünü altı günde uçurum olmadan yarattı, sonra çığlık ve toplanma sahnesi ve son, uyarıdan korkanlar için Kur'an'ın hatırlatıcısıdır.
    id: Berabad-abad yang Allah hancurkan di hadapan mereka meskipun mereka mengalami penindasan, dan Dia menciptakan langit dan bumi dalam enam hari tanpa jurang, lalu menjadi tempat seruan dan perkumpulan,
      dan kesimpulannya menjadi pengingat Al-Qur'an bagi mereka yang takut akan peringatan itu.
  children:
  - title:
      ar: قرون أهلكناها
      en: Generations We Destroyed
      tr: Yüzyılları yok ettik
      id: Berabad-abad yang kami hancurkan
    range:
    - 36
    - 37
  - title:
      ar: الخلق في ستة أيام
      en: Creation in Six Days
      tr: Altı günde yaratılış
      id: Penciptaan dalam enam hari
    range:
    - 38
    - 40
  - title:
      ar: الصيحة والحشر
      en: The Blast and the Gathering
      tr: Bağırışlar ve kalabalık
      id: Teriakan dan keramaian
    range:
    - 41
    - 44
  - title:
      ar: التذكير بالقرآن
      en: Reminding by the Quran
      tr: Kur'an'ın hatırlatılması
      id: Pengingat Al-Qur'an
    range:
    - 45
    - 45
