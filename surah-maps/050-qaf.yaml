surah: 50
slug: qaf
sources_consulted:
  - "kuttab.com — Surah Qaf mind map (3 blocks: 1-15, 16-30, 31-45)"
  - "arz.wikipedia.org — سورة ق: موضوع السورة (6-part thematic division)"
map:
  - title: { ar: "إنكار البعث وأدلة ثبوته", en: "Denial of Resurrection and Its Proofs" }
    range: [1, 11]
    family: faith
    summary:
      ar: "افتتاح بالقسم بالقرآن المجيد، وتعجب المكذبين من بعث بعد التراب، ثم أدلة القدرة في السماء المحكمة البناء والأرض الممدودة والماء المبارك الذي يحيي الموتى."
      en: "Opens with the oath by the Glorious Quran, the deniers' wonder at return after dust, then proofs of power in the firmly built sky, the spread earth, and the blessed rain that revives the dead."
    children:
      - { title: { ar: "القسم وتعجب المكذبين", en: "The Oath and the Deniers' Wonder" }, range: [1, 5] }
      - { title: { ar: "أدلة القدرة في الكون", en: "Proofs of Power in the Cosmos" }, range: [6, 11] }
  - title: { ar: "مصارع الأمم المكذبة", en: "The Fates of Past Deniers" }
    range: [12, 15]
    family: stories
    summary:
      ar: "قوم نوح وعاد وفرعون وثمود وقوم لوط وأصحاب الأيكة وقوم تبع: كذبوا الرسل فحق عليهم الوعيد."
      en: "Noah's people, 'Ad, Pharaoh, Thamud, Lot's people, the companions of the Thicket, and Tubba': they denied the messengers, so the warning came true."
    children: []
  - title: { ar: "خلق الإنسان وعلم الله", en: "Man's Creation and Allah's Knowledge" }
    range: [16, 18]
    family: faith
    summary:
      ar: "الله خلق الإنسان ويعلم وسوسة نفسه، وهو أقرب إليه من حبل الوريد، وعن اليمين والشمال قعيدان يسجلان كل لفظ."
      en: "Allah created man and knows his inner whisperings, nearer to him than the jugular vein, with two seated recorders noting every word."
    children: []
  - title: { ar: "سكرة الموت ويوم البعث", en: "Death's Throes and Resurrection Day" }
    range: [19, 30]
    family: faith
    summary:
      ar: "سكرة الموت بالحق، والنفخ في الصور، وكشف الغطاء عن البصر، والخصومة بين الإنسان وقرينه، ثم سؤال جهنم: هل من مزيد."
      en: "The stupor of death in truth, the trumpet blast, the lifting of the veil from sight, the dispute between man and his companion, then Hell asked: is there more."
    children:
      - { title: { ar: "سكرة الموت وكشف الغطاء", en: "Death's Stupor and the Lifted Veil" }, range: [19, 22] }
      - { title: { ar: "الخصومة يوم الحساب", en: "The Dispute on the Day of Reckoning" }, range: [23, 29] }
      - { title: { ar: "قول جهنم: هل من مزيد", en: "Hell Asked: Is There More" }, range: [30, 30] }
  - title: { ar: "الجنة للمتقين", en: "Paradise for the God-conscious" }
    range: [31, 35]
    family: faith
    summary:
      ar: "أزلفت الجنة للمتقين غير بعيد، لمن خشي الرحمن بالغيب وجاء بقلب منيب: ادخلوها بسلام، لهم ما يشاءون فيها ولدينا مزيد."
      en: "Paradise brought near the God-conscious, for whoever feared the Most Merciful unseen and came with a penitent heart: enter in peace, with all they wish and more with Us."
    children: []
  - title: { ar: "تهديد المكذبين وتسلية الرسول", en: "Warning the Deniers, Consoling the Messenger" }
    range: [36, 45]
    family: faith
    summary:
      ar: "قرون أهلكها الله قبلهم رغم بطشها، وخلق السماوات والأرض في ستة أيام بلا لغوب، ثم مشهد الصيحة والحشر، وخاتمة بالتذكير بالقرآن لمن يخاف الوعيد."
      en: "Generations destroyed before them despite their might, the heavens and earth created in six days without weariness, then the scene of the Blast and the gathering, closing with reminding by the Quran whoever fears the warning."
    children:
      - { title: { ar: "قرون أهلكناها", en: "Generations We Destroyed" }, range: [36, 37] }
      - { title: { ar: "الخلق في ستة أيام", en: "Creation in Six Days" }, range: [38, 40] }
      - { title: { ar: "الصيحة والحشر", en: "The Blast and the Gathering" }, range: [41, 44] }
      - { title: { ar: "التذكير بالقرآن", en: "Reminding by the Quran" }, range: [45, 45] }
