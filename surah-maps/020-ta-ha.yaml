- title:
    ar: آدم والخاتمة
    en: Adam and the Closing
    tr: Adam ve Sonuç
    id: Adam dan Kesimpulan
  range:
  - 99
  - 135
  family: faith
  summary:
    ar: أهوال القيامة، ونسيان آدم للعهد، والمعيشة الضنك لمن أعرض عن الذكر، والأمر بالصبر والصلاة.
    en: Resurrection's terrors, Adam forgetting the covenant, straitened life for whoever shuns remembrance; patience and prayer commanded.
    tr: Dirilişin dehşetleri, Adem'in antlaşmayı unutması, hatırlamaktan uzaklaşanlar için sefil hayat ve sabırlı olup dua etme emri.
    id: Kengerian Kebangkitan, Adam yang lupa akan perjanjian, kehidupan sengsara bagi mereka yang berpaling dari ingatan, dan perintah untuk bersabar dan berdoa.
  children:
  - title:
