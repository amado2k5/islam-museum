- title:
    ar: العجل
    en: The Calf
    tr: buzağı
    id: anak sapi
  range:
  - 80
  - 98
  family: stories
  summary:
    ar: المن والسلوى، والمواعدة أربعين ليلة، وعجل السامري، ودفاع هارون، وإحراق العجل ونسفه.
    en: Manna and quails, the forty nights' appointment, the Samiri's calf, Aaron's defense, the calf burned and scattered.
    tr: Manna ve Salwa, Kırk Gece Atama Gecesi, Samiriyeli buzağı, Harun'un Savunması, buzağının yakılması ve patlatılması.
    id: Manna dan Salwa, Empat Puluh Malam Janji, anak sapi Samaria, Pertahanan Aaron, pembakaran dan peledakan anak sapi.
  children:
