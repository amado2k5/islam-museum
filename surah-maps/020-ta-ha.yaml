    - 35
- title:
    ar: فرعون والسحرة
    en: Pharaoh and the Magicians
    tr: Firavun ve Büyücüler
    id: Firaun dan Para Penyihir
  range:
  - 49
  - 79
  family: stories
  summary:
    ar: حوار فرعون مع موسى، ويوم الزينة، وحبال السحرة وعصيهم، ثم إيمانهم وسجودهم رغم الوعيد.
    en: Pharaoh's exchange with Moses, the day of adornment, the magicians' ropes and staffs, then their belief and prostration.
    tr: Firavun'un Musa ile diyaloğu, Süs Günü, büyücülerin ipleri ve asaları, ardından uyarıya rağmen inançları ve secdeleri.
    id: Dialog Firaun dengan Musa, Hari Perhiasaan, tali dan tongkat para penyihir, lalu iman dan sujud mereka meski sudah diperingatkan.
  children:
