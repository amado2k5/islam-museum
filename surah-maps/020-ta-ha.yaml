surah: 20
slug: ta-ha
sources_consulted:
- 'kuttab.com — Surah Ta-Ha mind map (5 blocks: 1-8, 9-48, 49-79, 80-98, 99-135)'
- Standard thematic divisions (cross-checked)
map:
- title:
    ar: 'الافتتاح: تذكرة لا شقاء'
    en: 'The Opening: A Reminder, Not Misery'
    tr: 'Açılış: Mutsuzluk Bileti'
    id: 'Pembukaan: Tiket Menuju Tanpa Kesengsaraan'
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: 'ما أُنزل القرآن لتشقى: تذكرة لمن يخشى، والرحمن على العرش استوى، له الأسماء الحسنى.'
    en: 'The Quran was not sent to distress: a reminder for the God-fearing; the Most Merciful over the Throne; His finest names.'
    tr: Kur'an size acı çekmek için indirilmiştir; korkanlar için bir hatırlatıcıdır ve Merhametli Tahtın Üzerine Kendini Dikti, En Güzel İsimler O'nundadır.
    id: 'Al-Qur''an tidak diwahyukan untuk menyebabkan penderitaan: sebagai pengingat bagi mereka yang takut, dan Yang Maha Penyayang menegakkan diri-Nya di atas Takhta, bagi-Nya adalah Nama-nama Terindah.'
  children: []
- title:
    ar: النار والرسالة
    en: The Fire and the Message
    tr: Yangın ve Görev
    id: Api dan Misi
  range:
  - 9
  - 48
  family: stories
  summary:
    ar: نداء موسى عند النار في الوادي المقدس، والعصا واليد آيتين، وطلب هارون وزيرا، والأمر باللين مع فرعون.
    en: Moses called at the fire in the sacred valley; staff and hand as signs; Aaron asked as aide; gentleness with Pharaoh commanded.
    tr: Musa'nın kutsal vadideki ateşte yaptığı çağrı, asa ve el iki işarettir, Harun bir bakan ister ve Firavun'a hoşgörü gösterir.
    id: Panggilan Musa di api di lembah suci, tongkat dan tangan adalah dua tanda, Harun meminta seorang pelayan, dan ia memerintahkan kelonggaran kepada Firaun.
  children:
