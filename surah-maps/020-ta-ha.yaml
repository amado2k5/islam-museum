      tr: Kutsal Vadi
      id: Lembah Suci
    range:
    - 11
    - 16
  - title:
      ar: العصا واليد
      en: The Staff and the Hand
      tr: Sopa ve el
      id: Tongkat dan tangan
    range:
    - 17
    - 23
  - title:
      ar: طلب هارون
      en: Asking for Aaron
      tr: Haroon'un isteği
      id: Permintaan Haroon
    range:
