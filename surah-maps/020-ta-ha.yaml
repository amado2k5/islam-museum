surah: 20
slug: ta-ha
sources_consulted:
  - "kuttab.com — Surah Ta-Ha mind map (5 blocks: 1-8, 9-48, 49-79, 80-98, 99-135)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "الافتتاح: تذكرة لا شقاء", en: "The Opening: A Reminder, Not Misery" }
    range: [1, 8]
    family: faith
    summary:
      ar: "ما أُنزل القرآن لتشقى: تذكرة لمن يخشى، والرحمن على العرش استوى، له الأسماء الحسنى."
      en: "The Quran was not sent to distress: a reminder for the God-fearing; the Most Merciful over the Throne; His finest names."
    children: []
  - title: { ar: "النار والرسالة", en: "The Fire and the Message" }
    range: [9, 48]
    family: stories
    summary:
      ar: "نداء موسى عند النار في الوادي المقدس، والعصا واليد آيتين، وطلب هارون وزيرا، والأمر باللين مع فرعون."
      en: "Moses called at the fire in the sacred valley; staff and hand as signs; Aaron asked as aide; gentleness with Pharaoh commanded."
    children:
      - { title: { ar: "الوادي المقدس", en: "The Sacred Valley" }, range: [11, 16] }
      - { title: { ar: "العصا واليد", en: "The Staff and the Hand" }, range: [17, 23] }
      - { title: { ar: "طلب هارون", en: "Asking for Aaron" }, range: [29, 35] }
  - title: { ar: "فرعون والسحرة", en: "Pharaoh and the Magicians" }
    range: [49, 79]
    family: stories
    summary:
      ar: "حوار فرعون مع موسى، ويوم الزينة، وحبال السحرة وعصيهم، ثم إيمانهم وسجودهم رغم الوعيد."
      en: "Pharaoh's exchange with Moses, the day of adornment, the magicians' ropes and staffs, then their belief and prostration."
    children:
      - { title: { ar: "يوم الزينة", en: "The Day of Adornment" }, range: [59, 64] }
      - { title: { ar: "إيمان السحرة", en: "The Magicians Believe" }, range: [70, 73] }
  - title: { ar: "العجل", en: "The Calf" }
    range: [80, 98]
    family: stories
    summary:
      ar: "المن والسلوى، والمواعدة أربعين ليلة، وعجل السامري، ودفاع هارون، وإحراق العجل ونسفه."
      en: "Manna and quails, the forty nights' appointment, the Samiri's calf, Aaron's defense, the calf burned and scattered."
    children:
      - { title: { ar: "عجل السامري", en: "The Samiri's Calf" }, range: [85, 89] }
      - { title: { ar: "إحراق العجل", en: "Burning the Calf" }, range: [97, 97] }
  - title: { ar: "آدم والخاتمة", en: "Adam and the Closing" }
    range: [99, 135]
    family: faith
    summary:
      ar: "أهوال القيامة، ونسيان آدم للعهد، والمعيشة الضنك لمن أعرض عن الذكر، والأمر بالصبر والصلاة."
      en: "Resurrection's terrors, Adam forgetting the covenant, straitened life for whoever shuns remembrance; patience and prayer commanded."
    children:
      - { title: { ar: "نسيان آدم", en: "Adam Forgets" }, range: [115, 123] }
      - { title: { ar: "المعيشة الضنك", en: "The Straitened Life" }, range: [124, 127] }
