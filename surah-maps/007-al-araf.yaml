- title:
    ar: موسى وفرعون وبنو إسرائيل
    en: Moses, Pharaoh, and the Israelites
    tr: Musa, Firavun ve İsrailoğulları
    id: Musa, Firaun, dan Anak-anak Israel
  range:
  - 103
  - 171
  family: stories
  summary:
    ar: 'أطول قصص السورة: الآيات والعصا، وإيمان السحرة، والطوفان والجراد، والميقات والألواح، والعجل، والسبعون.'
    en: 'The surah''s longest narrative: the signs and staff, the magicians'' faith, plagues, the appointed time and Tablets, the calf, the seventy.'
    tr: 'Surenin en uzun hikayeleri: Ayetler ve Asa, Sihirbazların İnancı, Sel ve Çekirgeler, Miqat ve Tabletler, Buzağı ve Yetmişler.'
    id: 'Cerita-cerita terpanjang surat: Ayat-ayat dan Tongkat, Iman Para Penyihir, Banjir dan Belalang, Miqat dan Tablet, Anak Sapi, dan Tujuh Puluh.'
