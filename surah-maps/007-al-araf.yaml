- title:
    ar: نوح وقومه
    en: Noah and His People
    tr: Nuh ve halkı
    id: Nuh dan kaumnya
  range:
  - 59
  - 64
  family: stories
  summary:
    ar: 'أول المرسلين في السورة: دعوة نوح قومه إلى عبادة الله وحده فكذبوه فأنجاه الله وأغرقهم.'
    en: 'The first messenger in the surah: Noah calls his people to Allah alone; they deny him — he is saved, they drowned.'
    tr: 'Suredeki ilk elçi: Nuh''un halkına yalnızca Allah''a ibadet etmeleri için yaptığı çağrısı, fakat onlar onu reddetti, fakat Allah onu kurtardı ve onları boğdu.'
    id: 'Utusan pertama dalam surat: seruan Nuh kepada umat-nya untuk hanya beribadah kepada Allah, tetapi mereka menolak-Nya, namun Allah menyelamatkannya dan menenggelamkan mereka.'
  children: []
- title:
    ar: هود وعاد
    en: Hud and Ad
    tr: Hood and Return
    id: Hood dan Return
  range:
  - 65
  - 72
  family: stories
  summary:
    ar: هود يدعو عادا إلى التوحيد فيستكبرون بقوتهم، فأهلكهم الله بريح صرصر.
    en: Hud calls Ad to oneness; they boast of strength — Allah destroys them with a furious wind.
    tr: Hud, 'Ad'ı tek tanrıcılığa çağırır, ancak güçleri konusunda kibirlidirler, bu yüzden Tanrı onları kükreyen bir rüzgarla yok eder.
    id: Hud menyerukan 'Ad ke momodeisme, tetapi mereka sombong tentang kekuatan mereka, sehingga Tuhan menghancurkan mereka dengan angin yang mengaum.
  children: []
- title:
    ar: صالح وثمود
    en: Salih and Thamud
    tr: Salih ve Semud
    id: Saleh dan Thamud
  range:
  - 73
  - 79
  family: stories
  summary:
    ar: صالح وآية الناقة، فعقروها عتوا، فأخذتهم الرجفة.
    en: Salih and the she-camel sign; they hamstrung it in defiance — the earthquake seized them.
    tr: Salih ve ayet-el-Naka, öfkeyle onu sakatladılar ve titreme onları sardı.
    id: Saleh dan Ayat al-Naqa, sehingga mereka melukai Sakura dengan amarah, dan gemetar menguasai mereka.
  children:
  - title:
      ar: ناقة الله آية
      en: Allah's She-Camel as a Sign
      tr: Tanrı'nın dişi devesi bir ayettir
      id: Unta betina Tuhan adalah sebuah ayat
    range:
    - 73
