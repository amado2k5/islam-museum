- title:
    ar: لوط وقومه
    en: Lot and His People
    tr: Lot ve halkı
    id: Lot dan kaumnya
  range:
  - 80
  - 84
  family: stories
  summary:
    ar: إنكار لوط للفاحشة التي ما سبقهم إليها أحد، فأمطر الله عليهم حجارة.
    en: Lot denounces the indecency none committed before them — Allah rains stones upon them.
    tr: Lut'un daha önce hiç kimsenin işlemediği ahlaksızlığı reddetmesi, böylece Tanrı üzerlerine taş yağdırdı.
    id: Penyangkalan Lot atas ketidakmoralan yang belum pernah dilakukan siapa pun sebelum mereka, sehingga Tuhan menurunkan batu ke atas mereka.
  children: []
- title:
    ar: شعيب وسنة الله في القرى
    en: Shu'ayb and Allah's Way with Towns
    tr: Köylerde Şuayb ve Allah'ın Sünneti
    id: Shuayb dan Sunnah Tuhan di desa-desa
  range:
  - 85
  - 102
  family: stories
  summary:
    ar: 'شعيب يأمر مدين بالكيل والميزان، ثم بيان سنة الله: البأساء والضراء قبل التمكين.'
    en: 'Shu''ayb commands Madyan to fair measure; then Allah''s pattern: hardship before ease and establishment.'
    tr: 'Şuayb, borçluya ölçüp tartmasını emreder, ardından Allah''ın yasasını açıklar: güçlenmeden önceki zorluk ve sıkıntı.'
    id: 'Shu''ayb memerintahkan penghutang untuk mengukur dan menimbang, lalu menjelaskan hukum Tuhan: kesulitan dan kesulitan sebelum kekuasaan.'
  children:
  - title:
