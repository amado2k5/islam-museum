- title:
    ar: 'الخاتمة: الميثاق والذكر'
    en: 'Closing: The Covenant and Remembrance'
    tr: 'Sonuç: Antlaşma ve Anma'
    id: 'Kesimpulan: Perjanjian dan Kenangan'
  range:
  - 172
  - 206
  family: faith
  summary:
    ar: 'ميثاق الذر: ألست بربكم، وعبرة من أوتي الآيات فانسلخ، والأسماء الحسنى، وخذ العفو، والاستماع للقرآن.'
    en: The covenant of the offspring — 'Am I not your Lord'; the lesson of the one given signs who slipped; the beautiful names; pardon; listening to the Quran.
    tr: 'Sözünün ahidi: Ben sizin Rabbiniz değil miyim? Ayetler verilenlerden bir ders olarak, güzel isimler alınır, bağışlanır ve Kur''an''ı dinleriz.'
    id: 'Perjanjian Sabda: Bukankah aku Tuhanmu? Pelajaran dari mereka yang diberi ayat-ayat itu, sehingga kita akan diambil nama-nama indah, dan menerima pengampunan, dan mendengarkan Al-Qur''an.'
  children:
