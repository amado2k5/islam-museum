- title:
    ar: 'المقدمة: آدم وإبليس'
    en: 'Introduction: Adam and Iblis'
    tr: 'Giriş: Adem ve Şeytan'
    id: 'Pendahuluan: Adam dan Iblis'
  range:
  - 1
  - 58
  family: stories
  summary:
    ar: قصة الخلق والسجود وإباء إبليس، والهبوط، ولباس التقوى، وخلق السماوات والأرض والدعاء.
    en: Creation, the prostration and Iblis's refusal, the descent, the garment of God-consciousness, creation of the heavens and supplication.
    tr: Yaratılışın hikayesi, secde, İblis'in gururu, iniş, dindarlık giysisi, göklerin ve yerin yaratılışı ve yalvarış.
    id: Kisah penciptaan, sujud, kesombongan Iblis, turun, pakaian kesalehan, penciptaan langit dan bumi, serta permohonan.
