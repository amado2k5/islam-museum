surah: 7
slug: al-araf
sources_consulted:
  - "Quranic Diagrammatic Overview (QDO draft) — Surah al-A'raf 8 sections (1-58, 59-64, 65-72, 73-79, 80-84, 85-102, 103-171, 172-206)"
  - "Qurtubi vol.7 description (Diwan Press) — A'raf: stories of the prophets, Musa and Pharaoh at length"
map:
  - title: { ar: "المقدمة: آدم وإبليس", en: "Introduction: Adam and Iblis" }
    range: [1, 58]
    family: stories
    summary:
      ar: "قصة الخلق والسجود وإباء إبليس، والهبوط، ولباس التقوى، وخلق السماوات والأرض والدعاء."
      en: "Creation, the prostration and Iblis's refusal, the descent, the garment of God-consciousness, creation of the heavens and supplication."
    children:
      - { title: { ar: "السجود وإباء إبليس", en: "The Prostration, Iblis's Refusal" }, range: [11, 18] }
      - { title: { ar: "الجنة والهبوط", en: "The Garden and the Descent" }, range: [19, 25] }
      - { title: { ar: "لباس التقوى", en: "The Garment of Piety" }, range: [26, 27] }
      - { title: { ar: "الزينة عند المساجد", en: "Adornments at Mosques" }, range: [31, 32] }
      - { title: { ar: "الخلق والدعاء", en: "Creation and Supplication" }, range: [54, 56] }
  - title: { ar: "نوح وقومه", en: "Noah and His People" }
    range: [59, 64]
    family: stories
    summary:
      ar: "أول المرسلين في السورة: دعوة نوح قومه إلى عبادة الله وحده فكذبوه فأنجاه الله وأغرقهم."
      en: "The first messenger in the surah: Noah calls his people to Allah alone; they deny him — he is saved, they drowned."
    children: []
  - title: { ar: "هود وعاد", en: "Hud and Ad" }
    range: [65, 72]
    family: stories
    summary:
      ar: "هود يدعو عادا إلى التوحيد فيستكبرون بقوتهم، فأهلكهم الله بريح صرصر."
      en: "Hud calls Ad to oneness; they boast of strength — Allah destroys them with a furious wind."
    children: []
  - title: { ar: "صالح وثمود", en: "Salih and Thamud" }
    range: [73, 79]
    family: stories
    summary:
      ar: "صالح وآية الناقة، فعقروها عتوا، فأخذتهم الرجفة."
      en: "Salih and the she-camel sign; they hamstrung it in defiance — the earthquake seized them."
    children:
      - { title: { ar: "ناقة الله آية", en: "Allah's She-Camel as a Sign" }, range: [73, 73] }
  - title: { ar: "لوط وقومه", en: "Lot and His People" }
    range: [80, 84]
    family: stories
    summary:
      ar: "إنكار لوط للفاحشة التي ما سبقهم إليها أحد، فأمطر الله عليهم حجارة."
      en: "Lot denounces the indecency none committed before them — Allah rains stones upon them."
    children: []
  - title: { ar: "شعيب وسنة الله في القرى", en: "Shu'ayb and Allah's Way with Towns" }
    range: [85, 102]
    family: stories
    summary:
      ar: "شعيب يأمر مدين بالكيل والميزان، ثم بيان سنة الله: البأساء والضراء قبل التمكين."
      en: "Shu'ayb commands Madyan to fair measure; then Allah's pattern: hardship before ease and establishment."
    children:
      - { title: { ar: "أوفوا الكيل والميزان", en: "Give Full Measure" }, range: [85, 85] }
      - { title: { ar: "البأساء ثم التمكين", en: "Hardship, Then Establishment" }, range: [94, 96] }
  - title: { ar: "موسى وفرعون وبنو إسرائيل", en: "Moses, Pharaoh, and the Israelites" }
    range: [103, 171]
    family: stories
    summary:
      ar: "أطول قصص السورة: الآيات والعصا، وإيمان السحرة، والطوفان والجراد، والميقات والألواح، والعجل، والسبعون."
      en: "The surah's longest narrative: the signs and staff, the magicians' faith, plagues, the appointed time and Tablets, the calf, the seventy."
    children:
      - { title: { ar: "رسالة موسى والآيات", en: "Moses's Message and Signs" }, range: [104, 108] }
      - { title: { ar: "إيمان السحرة", en: "The Magicians' Faith" }, range: [120, 126] }
      - { title: { ar: "الطوفان والجراد والقمل", en: "Flood, Locusts, and Lice" }, range: [133, 135] }
      - { title: { ar: "الميقات والألواح", en: "The Appointed Time and Tablets" }, range: [142, 147] }
      - { title: { ar: "العجل والتوبة", en: "The Calf and Repentance" }, range: [148, 153] }
      - { title: { ar: "السبعون والنبي الأمي", en: "The Seventy and the Unlettered Prophet" }, range: [155, 157] }
      - { title: { ar: "أصحاب السبت", en: "The Sabbath People" }, range: [163, 166] }
      - { title: { ar: "رفع الطور", en: "The Mount Raised Above Them" }, range: [171, 171] }
  - title: { ar: "الخاتمة: الميثاق والذكر", en: "Closing: The Covenant and Remembrance" }
    range: [172, 206]
    family: faith
    summary:
      ar: "ميثاق الذر: ألست بربكم، وعبرة من أوتي الآيات فانسلخ، والأسماء الحسنى، وخذ العفو، والاستماع للقرآن."
      en: "The covenant of the offspring — 'Am I not your Lord'; the lesson of the one given signs who slipped; the beautiful names; pardon; listening to the Quran."
    children:
      - { title: { ar: "ميثاق ألست بربكم", en: "The 'Am I Not Your Lord' Covenant" }, range: [172, 174] }
      - { title: { ar: "الذي آتيناه آياتنا", en: "The One Given Our Signs" }, range: [175, 177] }
      - { title: { ar: "الأسماء الحسنى", en: "The Most Beautiful Names" }, range: [180, 180] }
      - { title: { ar: "خذ العفو", en: "Take to Pardoning" }, range: [199, 199] }
      - { title: { ar: "الاستماع للقرآن والذكر", en: "Listening to the Quran, Remembrance" }, range: [204, 206] }
