surah: 33
slug: al-ahzab
sources_consulted:
  - "dorar.net — موسوعة التفسير: سورة الأحزاب (موضوعات السورة)"
  - "fa.wikipedia.org — احزاب (خلاصه آيات: تفصيل الآيات)"
  - "quran.com API — التحقق من بدايات المقاطع (9، 28، 35، 36، 45، 53، 60، 69)"
map:
  - title: { ar: "توجيهات النبي", en: "Counsels to the Prophet" }
    range: [1, 3]
    family: faith
    summary:
      ar: "يا أيها النبي اتق الله ولا تطع الكافرين والمنافقين؛ واتبع ما يوحى إليك وتوكل على الله."
      en: "O Prophet, fear Allah and do not obey the disbelievers and hypocrites; follow what is revealed to you and trust in Allah."
    children: []
  - title: { ar: "إبطال الظهار والتبني", en: "Abolishing Zihar and Adoption" }
    range: [4, 8]
    family: law
    summary:
      ar: "ما جعل الله لرجل من قلبين؛ والظهار ليس أمومة، والأدعياء ليسوا أبناء؛ وأزواجه أمهاتهم، وميثاق النبيين الغليظ."
      en: "Allah made no two hearts in a man; zihar is not motherhood, adopted sons are not sons; his wives are their mothers; the solemn covenant of the prophets."
    children:
      - { title: { ar: "الظهار", en: "Zihar" }, range: [4, 4] }
      - { title: { ar: "التبني", en: "Adoption" }, range: [5, 5] }
      - { title: { ar: "أمهات المؤمنين", en: "Mothers of the Believers" }, range: [6, 6] }
      - { title: { ar: "ميثاق النبيين", en: "The Prophets' Covenant" }, range: [7, 8] }
  - title: { ar: "غزوة الأحزاب", en: "The Battle of the Confederates" }
    range: [9, 27]
    family: stories
    summary:
      ar: "اذكروا نعمة الله إذ جاءتكم جنود فأرسلنا عليهم ريحا؛ وابتلاء المؤمنين وزلزالهم، وكشف المنافقين، والأسوة الحسنة، وكفاية الله المؤمنين القتال."
      en: "Remember Allah's favor when armies came and We sent wind against them; the believers shaken, the hypocrites exposed, the fine example, Allah sparing the believers battle."
    children:
      - { title: { ar: "الريح والجنود", en: "The Wind and the Hosts" }, range: [9, 9] }
      - { title: { ar: "ابتلاء المؤمنين", en: "The Believers Tested" }, range: [10, 11] }
      - { title: { ar: "المنافقون", en: "The Hypocrites" }, range: [12, 20] }
      - { title: { ar: "الأسوة الحسنة", en: "The Fine Example" }, range: [21, 21] }
      - { title: { ar: "ثبات المؤمنين", en: "The Believers' Steadfastness" }, range: [22, 24] }
      - { title: { ar: "كفاية الله وبنو قريظة", en: "Allah's Sufficiency; Qurayza" }, range: [25, 27] }
  - title: { ar: "تخيير أزواج النبي", en: "The Prophet's Wives Given the Choice" }
    range: [28, 34]
    family: law
    summary:
      ar: "يا أيها النبي قل لأزواجك إن كنتن تردن الحياة الدنيا فتعالين أمتعكن؛ ومن يقنت منكن لله ورسوله نؤتها أجرها مرتين."
      en: "O Prophet, tell your wives: if you desire the worldly life, come, I shall provide for you; whoever of you devoutly obeys Allah and His Messenger — double reward."
    children:
      - { title: { ar: "التخيير", en: "The Choice" }, range: [28, 29] }
      - { title: { ar: "فضل أمهات المؤمنين", en: "The Mothers' Distinction" }, range: [30, 34] }
  - title: { ar: "صفات المؤمنين والمؤمنات", en: "Traits of Believing Men and Women" }
    range: [35, 35]
    family: faith
    summary:
      ar: "إن المسلمين والمسلمات والمؤمنين والمؤمنات — عشر صفات — أعد الله لهم مغفرة وأجرا عظيما."
      en: "Muslim men and women, believing men and women — ten traits — for whom Allah has prepared forgiveness and a great reward."
    children: []
  - title: { ar: "قصة زيد وزينب", en: "Zayd and Zaynab" }
    range: [36, 40]
    family: stories
    summary:
      ar: "وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمرا أن يكون لهم الخيرة؛ وزواج النبي زينب بعد زيد لإبطال حرج التبني."
      en: "No believer has a choice when Allah and His Messenger decree a matter; the Prophet's marriage to Zaynab after Zayd, ending adoption's restrictions."
    children: []
  - title: { ar: "الذكر الكثير", en: "Abundant Remembrance" }
    range: [41, 44]
    family: faith
    summary:
      ar: "يا أيها الذين آمنوا اذكروا الله ذكرا كثيرا وسبحوه بكرة وأصيلا؛ تحيتهم يوم يلقونه سلام."
      en: "O believers, remember Allah much and glorify Him morning and evening; their greeting the Day they meet Him is peace."
    children: []
  - title: { ar: "خصائص النبي", en: "The Prophet's Distinctions" }
    range: [45, 52]
    family: law
    summary:
      ar: "إنا أرسلناك شاهدا ومبشرا ونذيرا وداعيا إلى الله وسراجا منيرا؛ وبيان ما أحل له من النساء وما حرم عليه."
      en: "We sent you as witness, bearer of glad tidings, warner, caller to Allah, a luminous lamp; and who is lawful to him among women."
    children:
      - { title: { ar: "شاهدا ومبشرا ونذيرا", en: "Witness, Bearer of Glad Tidings, Warner" }, range: [45, 48] }
      - { title: { ar: "أحكام نكاح النبي", en: "The Prophet's Marriage Rulings" }, range: [49, 52] }
  - title: { ar: "آداب بيوت النبي والحجاب", en: "Manners of the Prophet's Houses; the Veil" }
    range: [53, 59]
    family: law
    summary:
      ar: "لا تدخلوا بيوت النبي إلا أن يؤذن لكم؛ إن الله وملائكته يصلون على النبي؛ وقل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن."
      en: "Do not enter the Prophet's houses without permission; Allah and His angels bless the Prophet; tell your wives, daughters, and believing women to draw their cloaks."
    children:
      - { title: { ar: "آداب الاستئذان", en: "Manners of Seeking Permission" }, range: [53, 55] }
      - { title: { ar: "الصلاة على النبي", en: "Blessings upon the Prophet" }, range: [56, 56] }
      - { title: { ar: "الحجاب", en: "The Veil" }, range: [59, 59] }
  - title: { ar: "المنافقون والمؤذون", en: "The Hypocrites and the Hurtful" }
    range: [60, 68]
    family: faith
    summary:
      ar: "لئن لم ينته المنافقون والذين في قلوبهم مرض لنغرينك بهم؛ ويسألونك عن الساعة؛ ومشهد عذاب الكافرين يوم تقلب وجوههم في النار."
      en: "If the hypocrites and the sick-hearted do not cease, We shall stir you against them; they ask about the Hour; the guilty's faces turned in the Fire."
    children:
      - { title: { ar: "تهديد المنافقين", en: "Warning the Hypocrites" }, range: [60, 62] }
      - { title: { ar: "السؤال عن الساعة", en: "Asked about the Hour" }, range: [63, 63] }
      - { title: { ar: "عذاب الكافرين", en: "The Disbelievers' Torment" }, range: [64, 68] }
  - title: { ar: "التقوى والأمانة", en: "God-consciousness and the Trust" }
    range: [69, 73]
    family: faith
    summary:
      ar: "لا تكونوا كالذين آذوا موسى؛ واتقوا الله وقولوا قولا سديدا؛ وعُرضت الأمانة على السماوات والأرض فأبين وحملها الإنسان."
      en: "Be not like those who hurt Moses; fear Allah and speak upright words; the Trust was offered to heavens and earth — they declined, and man bore it."
    children:
      - { title: { ar: "الذين آذوا موسى", en: "Those Who Hurt Moses" }, range: [69, 69] }
      - { title: { ar: "الأمانة", en: "The Trust" }, range: [72, 73] }
