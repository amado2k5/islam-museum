      ar: الظهار
      en: Zihar
      tr: Zihar
      id: Zihar
    range:
    - 4
    - 4
  - title:
      ar: التبني
      en: Adoption
      tr: Benimseme
      id: Adopsi
    range:
    - 5
    - 5
