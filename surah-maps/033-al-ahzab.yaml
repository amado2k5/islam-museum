map:
- title:
    ar: توجيهات النبي
    en: Counsels to the Prophet
    tr: Peygamberin Direktifleri
    id: Arahan Nabi
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: يا أيها النبي اتق الله ولا تطع الكافرين والمنافقين؛ واتبع ما يوحى إليك وتوكل على الله.
    en: O Prophet, fear Allah and do not obey the disbelievers and hypocrites; follow what is revealed to you and trust in Allah.
    tr: Ey Peygamber, Allah'tan kork ve kâfirlere ve münafıklara itaat etme; sana indirilenleri takip et ve Allah'a güven.
    id: Wahai Nabi, takulah Allah dan janganlah taat pada orang kafir dan munafik; ikutlah apa yang telah diturunkan kepadamu dan percayalah kepada Allah.
  children: []
- title:
    ar: إبطال الظهار والتبني
    en: Abolishing Zihar and Adoption
    tr: Görünüşün İptali ve Evlat Edinme
    id: Pembatalan Kehadiran dan Adopsi
  range:
  - 4
  - 8
  family: law
  summary:
    ar: ما جعل الله لرجل من قلبين؛ والظهار ليس أمومة، والأدعياء ليسوا أبناء؛ وأزواجه أمهاتهم، وميثاق النبيين الغليظ.
    en: Allah made no two hearts in a man; zihar is not motherhood, adopted sons are not sons; his wives are their mothers; the solemn covenant of the prophets.
    tr: Tanrı iki yürekli bir adam yaratmadı; zihar annelik değildir, sahtekarlar çocuk değildir ve eşleri anneleridir ve peygamberlerin resmi antlaşmasıdır.
    id: Tuhan tidak menciptakan pria dengan dua hati; zihar bukanlah keibuan, para penipu bukanlah anak-anak, dan istri-istrinya adalah ibu mereka, dan perjanjian khidmat para nabi.
  children:
