- title:
    ar: تخيير أزواج النبي
    en: The Prophet's Wives Given the Choice
    tr: Peygamberin Eşlerini Seçmek
    id: Memilih Pasangan Nabi
  range:
  - 28
  - 34
  family: law
  summary:
    ar: يا أيها النبي قل لأزواجك إن كنتن تردن الحياة الدنيا فتعالين أمتعكن؛ ومن يقنت منكن لله ورسوله نؤتها أجرها مرتين.
    en: 'O Prophet, tell your wives: if you desire the worldly life, come, I shall provide for you; whoever of you devoutly obeys Allah and His Messenger — double reward.'
    tr: Ey Peygamber, eşlerine de ki, eğer bu dünyanın hayatını istiyorsan, gelin ve tadını çıkarın; aranızda Allah'a ve O'nun Resulu'na bağlı olan kişi, ona iki kez ödülünü vereceğiz.
    id: Wahai Nabi, katakanlah kepada istri-istrimu jika engkau menginginkan kehidupan dunia ini, maka datanglah dan nikmatilah; dan siapa pun di antara kalian yang setia kepada Allah dan Rasul-Nya, Kami
      akan memberinya ganjaran dua kali.
  children:
  - title:
      ar: التخيير
      en: The Choice
      tr: Seçim
      id: Pilihan
    range:
    - 28
    - 29
  - title:
      ar: فضل أمهات المؤمنين
      en: The Mothers' Distinction
      tr: İnananların Annelerinin Erdemi
      id: Kebajikan Para Ibu Orang Percaya
    range:
    - 30
    - 34
- title:
    ar: صفات المؤمنين والمؤمنات
    en: Traits of Believing Men and Women
    tr: İnananların Özellikleri
    id: Karakteristik Orang Percaya
  range:
  - 35
  - 35
  family: faith
  summary:
    ar: إن المسلمين والمسلمات والمؤمنين والمؤمنات — عشر صفات — أعد الله لهم مغفرة وأجرا عظيما.
    en: Muslim men and women, believing men and women — ten traits — for whom Allah has prepared forgiveness and a great reward.
    tr: Müslümanlar, Müslüman erkekler ve kadınlar, inanan erkekler ve iman eden erkekler — on özellik — Allah bağışlama ve büyük bir ödül hazırlamıştır.
    id: Bagi umat Muslim, pria dan wanita Muslim, pria beriman dan pria beriman — sepuluh kualitas — Allah telah menyiapkan pengampunan dan ganjaran besar.
  children: []
- title:
    ar: قصة زيد وزينب
    en: Zayd and Zaynab
    tr: Zaid ve Zeynab'ın hikayesi
    id: Kisah Zaid dan Zainab
  range:
  - 36
  - 40
  family: stories
  summary:
    ar: وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمرا أن يكون لهم الخيرة؛ وزواج النبي زينب بعد زيد لإبطال حرج التبني.
    en: No believer has a choice when Allah and His Messenger decree a matter; the Prophet's marriage to Zaynab after Zayd, ending adoption's restrictions.
    tr: Allah ve Elçisi bir şey emrettiğinde, iman eden bir erkek ya da kadının seçim hakkı yoktur; ve Peygamber Zeyneb'in Zayd'den sonra evlenmesi, evlat edinmenin utancını ortadan kaldıracaktır.
    id: Bukan hak seorang pria atau wanita beriman untuk memilih ketika Allah dan Rasul-Nya telah menetapkan sesuatu; dan pernikahan Nabi Zainab setelah Zayd akan menghilangkan rasa malu dari adopsi.
  children: []
- title:
    ar: الذكر الكثير
    en: Abundant Remembrance
    tr: Çok bahset
    id: Sebutkan banyak hal
  range:
  - 41
  - 44
  family: faith
  summary:
    ar: يا أيها الذين آمنوا اذكروا الله ذكرا كثيرا وسبحوه بكرة وأصيلا؛ تحيتهم يوم يلقونه سلام.
    en: O believers, remember Allah much and glorify Him morning and evening; their greeting the Day they meet Him is peace.
    tr: Ey iman edenler, Allah'ı bolca hatırlayın ve sabah akşam O'nu yüceltin; selamları, O'nu huzur içinde buluşacakları gündür.
    id: Wahai kalian yang beriman, ingatlah Allah dengan melimpah dan memuliakan-Nya pagi dan sore; salam mereka adalah hari mereka bertemu Dia dengan damai.
  children: []
- title:
    ar: خصائص النبي
    en: The Prophet's Distinctions
    tr: Peygamber'in Özellikleri
    id: Karakteristik Nabi
  range:
  - 45
  - 52
  family: law
  summary:
    ar: إنا أرسلناك شاهدا ومبشرا ونذيرا وداعيا إلى الله وسراجا منيرا؛ وبيان ما أحل له من النساء وما حرم عليه.
    en: We sent you as witness, bearer of glad tidings, warner, caller to Allah, a luminous lamp; and who is lawful to him among women.
    tr: Seni şahit, müjdeci, uyarıcı, Allah'a çağrı eden ve parlayan bir çip olarak gönderdik; kadınlardan ve ona yasak olanları açıklayarak.
    id: Sesungguhnya, Kami telah mengutus engkau sebagai saksi, pembawa kabar baik, pembawa peringatan, pemanggil kepada Allah, dan pelita yang bersinar; dan menjelaskan apa yang telah diperbolehkan untuknya
      bagi wanita dan apa yang telah dilarang baginya.
  children:
  - title:
      ar: شاهدا ومبشرا ونذيرا
      en: Witness, Bearer of Glad Tidings, Warner
      tr: Tanık, İyi Haberin Taşıyıcısı ve Warner
      id: Saksi, Pembawa Kabar Baik dan Peringatan
    range:
    - 45
    - 48
  - title:
      ar: أحكام نكاح النبي
      en: The Prophet's Marriage Rulings
      tr: Peygamber'in Evliliğine Dair Kararlar
      id: Putusan tentang Pernikahan Nabi
    range:
    - 49
    - 52
- title:
    ar: آداب بيوت النبي والحجاب
    en: Manners of the Prophet's Houses; the Veil
    tr: Peygamberin Evlerinin ve Başörtüsünün Etiketi
    id: Etiket Rumah Nabi dan Hijab
  range:
  - 53
  - 59
  family: law
  summary:
    ar: لا تدخلوا بيوت النبي إلا أن يؤذن لكم؛ إن الله وملائكته يصلون على النبي؛ وقل لأزواجك وبناتك ونساء المؤمنين يدنين عليهن من جلابيبهن.
    en: Do not enter the Prophet's houses without permission; Allah and His angels bless the Prophet; tell your wives, daughters, and believing women to draw their cloaks.
    tr: Peygamber'in evlerine, yalnızca o size ezan çağırdıysa girin; gerçekten Allah ve melekleri Peygamber'e bereket gönderir; eşlerinizi, kızlarınızı ve iman eden kadınlarınızı cülbablarından sonra onların
      üzerlerine secde etmelerini söyleyin.
    id: Jangan masuk ke rumah Nabi kecuali karena Dia telah memanggil adhan kepada kamu; sesungguhnya, Allah dan malaikat-Nya mengirimkan berkat kepada Nabi; dan perintahkan istri, putri, dan wanita beriman
      kalian untuk membungkuk di atas mereka dari jilbab.
  children:
  - title:
      ar: آداب الاستئذان
      en: Manners of Seeking Permission
      tr: İzin İsteme Görgü Kuralları
      id: Etiket Meminta Izin
    range:
    - 53
    - 55
  - title:
      ar: الصلاة على النبي
      en: Blessings upon the Prophet
      tr: Peygamber üzerine dualar
      id: Doa atas nabi
    range:
    - 56
    - 56
  - title:
      ar: الحجاب
      en: The Veil
      tr: başörtüsü
      id: hijab
    range:
    - 59
    - 59
- title:
    ar: المنافقون والمؤذون
    en: The Hypocrites and the Hurtful
    tr: İkiyüzlüler ve zararlılar.
    id: Yang munafik dan yang merugikan.
  range:
  - 60
  - 68
  family: faith
  summary:
    ar: لئن لم ينته المنافقون والذين في قلوبهم مرض لنغرينك بهم؛ ويسألونك عن الساعة؛ ومشهد عذاب الكافرين يوم تقلب وجوههم في النار.
    en: If the hypocrites and the sick-hearted do not cease, We shall stir you against them; they ask about the Hour; the guilty's faces turned in the Fire.
    tr: Eğer münafıklar ve kalplerinde hastalık olanlar sona ermezse, sizi onlarla birlikte sınarız; onlar size Saat hakkında ve yüzlerinin ateşe döneceği gün kâfirlerin ceza sahnesini sorarlar.
    id: Jika orang munafik dan mereka yang di hatinya ada penyakit tidak berakhir, Kami akan menggoda kalian dengan mereka; mereka akan menanyakan tentang Jamnya; dan saat hukuman bagi orang kafir pada
      hari itu, wajah mereka akan berubah menjadi Api.
  children:
  - title:
      ar: تهديد المنافقين
      en: Warning the Hypocrites
      tr: İkiyüzlüleri tehdit etmek
      id: Mengancam para munafik
    range:
    - 60
    - 62
  - title:
      ar: السؤال عن الساعة
      en: Asked about the Hour
      tr: Saat hakkında soru
      id: Pertanyaan tentang jam tangan
    range:
    - 63
    - 63
  - title:
      ar: عذاب الكافرين
      en: The Disbelievers' Torment
      tr: İnfirlerin cezası
      id: Hukuman bagi orang-orang kafir
    range:
    - 64
    - 68
- title:
    ar: التقوى والأمانة
    en: God-consciousness and the Trust
    tr: Dindarlık ve Dürüstlük
    id: Kesalehan dan Kejujuran
  range:
  - 69
  - 73
  family: faith
  summary:
    ar: لا تكونوا كالذين آذوا موسى؛ واتقوا الله وقولوا قولا سديدا؛ وعُرضت الأمانة على السماوات والأرض فأبين وحملها الإنسان.
    en: Be not like those who hurt Moses; fear Allah and speak upright words; the Trust was offered to heavens and earth — they declined, and man bore it.
    tr: Musa'ya zarar verenler gibi olmayın; Allah'tan korkun ve adalet söyleyin; emanet göklere ve yere sunuldu, ama o indirildi ve insan onu taşıdı.
    id: Janganlah kamu seperti mereka yang menyakiti Musa; takulah Allah dan ucapkan kata-kata keadilan; dan amanah itu dipersembahkan kepada langit dan bumi, tetapi telah diwahyukan dan manusia yang menanggungnya.
  children:
  - title:
      ar: الذين آذوا موسى
      en: Those Who Hurt Moses
      tr: Musa'ya zarar verenler
      id: Mereka yang menyakiti Musa
    range:
    - 69
    - 69
  - title:
      ar: الأمانة
      en: The Trust
      tr: Sekretarya
      id: Sekretariat
    range:
    - 72
    - 73
