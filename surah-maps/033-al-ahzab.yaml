    - 8
- title:
    ar: غزوة الأحزاب
    en: The Battle of the Confederates
    tr: Konfederasyon Muharebesi
    id: Pertempuran Konfederasi
  range:
  - 9
  - 27
  family: stories
  summary:
    ar: اذكروا نعمة الله إذ جاءتكم جنود فأرسلنا عليهم ريحا؛ وابتلاء المؤمنين وزلزالهم، وكشف المنافقين، والأسوة الحسنة، وكفاية الله المؤمنين القتال.
    en: Remember Allah's favor when armies came and We sent wind against them; the believers shaken, the hypocrites exposed, the fine example, Allah sparing the believers battle.
    tr: Size ordular geldiğinde ve biz onlara bir rüzgar indirdiğimizde, Allah'ın lütfunu hatırlayın; müminlerin sınavı ve depremleri, münafıkların ortaya çıkarılması, iyi örnek ve Allah'ın müminlerin savaşta
      yeterliliği.
    id: Ingatlah rahmat Allah ketika tentara datang kepada kalian dan Kami mengirimkan angin ke atas mereka; ujian orang beriman dan gempa bumi mereka, keterbukaan orang munafik, teladan baik, dan kecukupan
      Allah orang beriman dalam pertempuran.
  children:
  - title:
      ar: الريح والجنود
      en: The Wind and the Hosts
      tr: Rüzgar ve Askerler
      id: Angin dan Para Prajurit
    range:
    - 9
    - 9
