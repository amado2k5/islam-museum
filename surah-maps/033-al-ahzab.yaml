      ar: أمهات المؤمنين
      en: Mothers of the Believers
      tr: İnananların Anneleri
      id: Ibu-ibu Para Penganut
    range:
    - 6
    - 6
  - title:
      ar: ميثاق النبيين
      en: The Prophets' Covenant
