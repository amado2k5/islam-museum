surah: 73
slug: al-muzzammil
sources_consulted:
  - "khutabaa.com — سورة المزمل: themes (night prayer, patience, Pharaoh warning, concession in verse 20)"
  - "dar-alifta.org — معنى قيام الليل الوارد في أول سورة المزمل وآخرها"
  - "alukah.net — التوحيد في سورة المزمل"
  - "khaledalsabt.com — تفسير سورة المزمل (قيام الليل والتخفيف)"
map:
  - title: { ar: "أمر قيام الليل", en: "The Command of Night Prayer" }
    range: [1, 9]
    family: faith
    summary:
      ar: "نداء المزمل: قم الليل إلا قليلا ورتل القرآن ترتيلا استعدادا للقول الثقيل، واذكر اسم ربك وتبتل إليه."
      en: "The call to the enwrapped one: stand the night except a little, recite the Quran with measured recitation in preparation for the weighty Word, and remember your Lord's name in devotion."
    children:
      - { title: { ar: "قيام الليل وترتيل القرآن", en: "Night Prayer and Measured Recitation" }, range: [1, 7] }
      - { title: { ar: "الذكر والتبتل", en: "Remembrance and Devotion" }, range: [8, 9] }
  - title: { ar: "الصبر على المكذبين", en: "Patience with the Deniers" }
    range: [10, 14]
    family: faith
    summary:
      ar: "أمر بالصبر على أذى المكذبين وهجرهم هجرا جميلا، ووعيد بأغلال وجحيم ويوم تشيب فيه الولدان."
      en: "The command to bear the deniers' harm patiently and part from them graciously, with warning of shackles, Hellfire, and a Day that turns children grey."
    children:
      - { title: { ar: "الهجر الجميل", en: "Gracious Parting" }, range: [10, 11] }
      - { title: { ar: "الوعيد بالعذاب", en: "The Threat of Punishment" }, range: [12, 14] }
  - title: { ar: "تحذير فرعون", en: "The Pharaoh Warning" }
    range: [15, 19]
    family: faith
    summary:
      ar: "أرسلنا إليكم رسولا شاهدا كما أرسلنا إلى فرعون رسولا فعصاه فأخذناه أخذا وبيلا، فكيف تتقون يوما يجعل الولدان شيبا."
      en: "A messenger sent to you as a witness, as one was sent to Pharaoh who defied him and was seized terribly — so how will you guard against a Day that turns children grey."
    children:
      - { title: { ar: "رسولا شاهدا كفرعون", en: "A Witnessing Messenger, as to Pharaoh" }, range: [15, 16] }
      - { title: { ar: "يوم يجعل الولدان شيبا", en: "A Day That Turns Children Grey" }, range: [17, 18] }
  - title: { ar: "التخفيف عن قيام الليل", en: "The Concession on Night Prayer" }
    range: [20, 20]
    family: faith
    summary:
      ar: "خاتمة السورة: علم الله أنهم لن يحصوه فخفف: فاقرءوا ما تيسر منه، وأقيموا الصلاة وآتوا الزكاة."
      en: "The surah's close: Allah knew they could not keep count of it, so He lightened it — recite what is easy of it, establish prayer, and give charity."
    children: []
