map:
- title:
    ar: أمر قيام الليل
    en: The Command of Night Prayer
    tr: Gece Duası Düzeni
    id: Doa Tata Malam
  range:
  - 1
  - 9
  family: faith
  summary:
    ar: 'نداء المزمل: قم الليل إلا قليلا ورتل القرآن ترتيلا استعدادا للقول الثقيل، واذكر اسم ربك وتبتل إليه.'
    en: 'The call to the enwrapped one: stand the night except a little, recite the Quran with measured recitation in preparation for the weighty Word, and remember your Lord''s name in devotion.'
    tr: 'El-Muzzammil''in çağrısı: Gece kalkın, kısa bir süre hariç, ağır konuşmaya hazırlanmak için Kur''an''ı ezgilerle okun, Rabbinizin adını hatırlayın ve O''na kendinizi adasın.'
    id: 'Seruan Al-Muzzammil: Bangunlah malam kecuali sebentar, bacakan Al-Qur''an dalam melodi sebagai persiapan untuk pidato berat, ingat nama Tuhanmu, dan sembahkanlah diri kepada-Nya.'
  children:
  - title:
      ar: قيام الليل وترتيل القرآن
      en: Night Prayer and Measured Recitation
      tr: Gece namazı ve Kur'an'ın okunması
      id: Shalat malam dan pembacaan Al-Qur'an
    range:
    - 1
    - 7
  - title:
      ar: الذكر والتبتل
      en: Remembrance and Devotion
      tr: Erkek ve Bakire
      id: Laki-laki dan Perawan
    range:
    - 8
    - 9
- title:
    ar: الصبر على المكذبين
    en: Patience with the Deniers
    tr: İnkarcılara sabır
    id: Kesabaran dengan para penyangkal
  range:
  - 10
  - 14
  family: faith
  summary:
    ar: أمر بالصبر على أذى المكذبين وهجرهم هجرا جميلا، ووعيد بأغلال وجحيم ويوم تشيب فيه الولدان.
    en: The command to bear the deniers' harm patiently and part from them graciously, with warning of shackles, Hellfire, and a Day that turns children grey.
    tr: Inkarcıların zararına sabırlı davrandı ve onları güzel bir terkedilmiş halde terk etti, zincirler, cehennem ve çocukların ağaracağı bir gün konusunda uyarıldı.
    id: Ia memerintahkan kesabaran terhadap bahaya para penyangkal dan meninggalkan mereka dalam pengabaian yang indah, serta diperingatkan tentang rantai, neraka, dan hari ketika anak-anak akan memutih.
  children:
  - title:
      ar: الهجر الجميل
      en: Gracious Parting
      tr: Güzel terk edilme
      id: Pengabaian yang indah
    range:
    - 10
    - 11
  - title:
      ar: الوعيد بالعذاب
      en: The Threat of Punishment
      tr: İşkence uyarısı
      id: Peringatan tentang siksaan
    range:
    - 12
    - 14
- title:
    ar: تحذير فرعون
    en: The Pharaoh Warning
    tr: Firavun'un Uyarısı
    id: Peringatan Firaun
  range:
  - 15
  - 19
  family: faith
  summary:
    ar: أرسلنا إليكم رسولا شاهدا كما أرسلنا إلى فرعون رسولا فعصاه فأخذناه أخذا وبيلا، فكيف تتقون يوما يجعل الولدان شيبا.
    en: A messenger sent to you as a witness, as one was sent to Pharaoh who defied him and was seized terribly — so how will you guard against a Day that turns children grey.
    tr: Biz sana bir elçi tanıdık olarak gönderdik, tıpkı Firavun'a bir elçi gönderdiğimiz gibi, o da ona itaatsizlik etti, biz de onu otlak ve gizlice yakaladık. Peki, çocukları beyazlatacağı bir günden
      nasıl korkabilirsin?
    id: Kami mengirim utusan kepadamu sebagai saksi, seperti Kami mengirim utusan kepada Firaun, dan dia membangkang, maka Kami menangkapnya dengan penggembalaan dan diam-diam. Jadi bagaimana kamu takut
      suatu hari ketika Dia akan membuat anak-anak beruban?
  children:
  - title:
      ar: رسولا شاهدا كفرعون
      en: A Witnessing Messenger, as to Pharaoh
      tr: Firavun gibi tanıklık eden bir elçi
      id: Seorang utusan yang menyaksikan seperti Firaun
    range:
    - 15
    - 16
  - title:
      ar: يوم يجعل الولدان شيبا
      en: A Day That Turns Children Grey
      tr: Çocukları griye çevirdiği gün
      id: Hari dia membuat anak-anak itu beruban
    range:
    - 17
    - 18
- title:
    ar: التخفيف عن قيام الليل
    en: The Concession on Night Prayer
    tr: Gece duasını hafifletmek
    id: Melembutkan doa malam
  range:
  - 20
  - 20
  family: faith
  summary:
    ar: 'خاتمة السورة: علم الله أنهم لن يحصوه فخفف: فاقرءوا ما تيسر منه، وأقيموا الصلاة وآتوا الزكاة.'
    en: 'The surah''s close: Allah knew they could not keep count of it, so He lightened it — recite what is easy of it, establish prayer, and give charity.'
    tr: 'Surenin sonu: Allah onların saymayacağını bildiği için hafifletti: Kolay olanı oku, namaz kıl ve zekat ver.'
    id: 'Akhir surat: Allah tahu bahwa mereka tidak akan menghitungnya, maka Dia melembutkannya: Jadi bacalah apa yang mudah darinya, tetapkan doa, dan berikan zakat.'
  children: []
