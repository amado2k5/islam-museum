surah: 63
slug: al-munafiqun
sources_consulted:
  - "arz.wikipedia.org — سورة المنافقون (موضوع السورة: 1-8 / 9-11)"
  - "kuttab.com — Surah Al-Munafiqun mind map (2 blocks: 1-8, 9-11)"
  - "ar.wikipedia.org — سورة المنافقون (مقاصد السورة وموضوعاتها)"
map:
  - title: { ar: "صفات المنافقين", en: "The Traits of the Hypocrites" }
    range: [1, 8]
    family: faith
    summary:
      ar: "وصف المنافقين وسيئ خصالهم: شهادتهم الكاذبة وأيمانهم الفاجرة، وأجسادهم التي تعجب الناظر وقلوبهم المطبوع عليها، وإعراضهم عن الاستغفار، وقولتهم في الغزوة بأن الأعز سيخرج الأذل."
      en: "The portrait of the hypocrites and their evil traits: their false testimony and lying oaths, bodies that please the onlooker with sealed hearts, their refusal of forgiveness, and their campaign boast that the mightier will expel the weaker."
    children:
      - { title: { ar: "الأيمان الكاذبة", en: "False Oaths" }, range: [1, 2] }
      - { title: { ar: "الأجساد والقلوب", en: "Bodies and Hearts" }, range: [3, 4] }
      - { title: { ar: "إعراضهم عن الاستغفار", en: "Turning Away from Forgiveness" }, range: [5, 6] }
      - { title: { ar: "قولتهم في الغزوة", en: "Their Words on the Campaign" }, range: [7, 8] }
  - title: { ar: "التحذير من الغفلة والإنفاق قبل الموت", en: "Warning Against Distraction and Spending Before Death" }
    range: [9, 11]
    family: faith
    summary:
      ar: "تحذير المؤمنين من أن تلهيهم أموالهم وأولادهم عن ذكر الله، وحثهم على الإنفاق قبل أن يأتي الموت فيطلب المؤجل التوبةَ والإنفاقَ فلا يُجاب."
      en: "Warning the believers not to let wealth or children divert them from Allah's remembrance, and urging them to spend before death arrives — when the one who delayed will plead for respite and be refused."
    children:
      - { title: { ar: "لا تلهكم أموالكم وأولادكم", en: "Let Not Wealth or Children Divert You" }, range: [9, 9] }
      - { title: { ar: "أنفقوا قبل مجيء الموت", en: "Spend Before Death Comes" }, range: [10, 11] }
