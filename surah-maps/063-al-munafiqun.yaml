map:
- title:
    ar: صفات المنافقين
    en: The Traits of the Hypocrites
    tr: İkiyüzlülerin özellikleri
    id: Karakteristik munafik
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: 'وصف المنافقين وسيئ خصالهم: شهادتهم الكاذبة وأيمانهم الفاجرة، وأجسادهم التي تعجب الناظر وقلوبهم المطبوع عليها، وإعراضهم عن الاستغفار، وقولتهم في الغزوة بأن الأعز سيخرج الأذل.'
    en: 'The portrait of the hypocrites and their evil traits: their false testimony and lying oaths, bodies that please the onlooker with sealed hearts, their refusal of forgiveness, and their campaign
      boast that the mightier will expel the weaker.'
    tr: 'Münafıkların tanımı ve kötü karakteri: sahte tanıklıkları ve ahlaksız yeminleri, izleyenleri sevindiren bedenleri ve kalpleri, af dilemeleri ve savaşta daha güçlü olanın aşağılananları ortaya çıkaracağı
      ifadeleri.'
    id: 'Deskripsi dan karakter buruk para munafik: kesaksian palsu dan sumpah tidak bermoral, tubuh mereka yang menyenangkan penonton dan hati yang tercetak, penolakan mereka untuk mencari pengampunan,
      dan pernyataan mereka dalam pertempuran bahwa yang lebih kuat akan mengeluarkan yang terhina.'
  children:
  - title:
      ar: الأيمان الكاذبة
      en: False Oaths
      tr: yanlış inançlar
      id: kepercayaan palsu
    range:
    - 1
    - 2
  - title:
      ar: الأجساد والقلوب
      en: Bodies and Hearts
      tr: Bedenler ve Kalpler
      id: Tubuh dan Hati
    range:
    - 3
    - 4
  - title:
      ar: إعراضهم عن الاستغفار
      en: Turning Away from Forgiveness
      tr: Affetmeyi reddetmeleri
      id: Penolakan mereka untuk mencari maaf
    range:
    - 5
    - 6
  - title:
      ar: قولتهم في الغزوة
      en: Their Words on the Campaign
      tr: Baskında onları söyledim
      id: Aku bilang itu di serangan
    range:
    - 7
    - 8
- title:
    ar: التحذير من الغفلة والإنفاق قبل الموت
    en: Warning Against Distraction and Spending Before Death
    tr: Ölüm öncesi ihmal ve harcama konusunda uyarı
    id: Peringatan terhadap kelalaian dan pengeluaran sebelum kematian
  range:
  - 9
  - 11
  family: faith
  summary:
    ar: تحذير المؤمنين من أن تلهيهم أموالهم وأولادهم عن ذكر الله، وحثهم على الإنفاق قبل أن يأتي الموت فيطلب المؤجل التوبةَ والإنفاقَ فلا يُجاب.
    en: Warning the believers not to let wealth or children divert them from Allah's remembrance, and urging them to spend before death arrives — when the one who delayed will plead for respite and be refused.
    tr: İnananları, Allah'ı anmaktan servetleri ve çocukları yüzünden dikkatlerini dağıtmamaları konusunda uyarır ve ölüm gelmeden önce harcamalarını teşvik eder, böylece tövbe ve harcamayı geciktiren kişi
      cevaplanmaz.
    id: Memperingatkan orang beriman agar tidak teralihkan oleh kekayaan dan anak-anak dari ingatan Allah, dan mendesak mereka untuk menghabiskan sebelum kematian datang, sehingga orang yang menunda mencari
      pertobatan dan pengeluaran tidak dijawab.
  children:
  - title:
      ar: لا تلهكم أموالكم وأولادكم
      en: Let Not Wealth or Children Divert You
      tr: Paranız ve çocuklarınız tarafından dikkatinizi dağıtmayın
      id: Jangan terganggu oleh uang dan anak-anakmu
    range:
    - 9
    - 9
  - title:
      ar: أنفقوا قبل مجيء الموت
      en: Spend Before Death Comes
      tr: Ölüm gelmeden önce harca
      id: Habiskan sebelum kematian datang
    range:
    - 10
    - 11
