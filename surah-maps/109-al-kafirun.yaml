  family: faith
  summary:
    ar: 'قل يا أيها الكافرون لا أعبد ما تعبدون ولا أنتم عابدون ما أعبد: لكم دينكم ولي دين.'
    en: 'Say: O disbelievers, I do not worship what you worship, nor do you worship what I worship — to you your religion, to me mine.'
    tr: 'Şöyle söyleyin: Ey kâfirler, ben sizin ibadet ettiğinize ibadet etmem, siz de benim ibadet ettiğim şeye ibadet etmezsiniz; sizin dininiz size aittir, benim de dinim var.'
    id: Katakanlah, wahai orang kafir, Aku tidak menyembah apa yang kalian sembah, dan kalian tidak menyembah apa yang aku sembah; bagi kalian adalah agama kalian, dan aku memiliki agamaku.
  children: []
