map:
- title:
    ar: تسبيح الله وبعثة الرسول الأمي
    en: Glorifying Allah and the Unlettered Messenger
    tr: Tanrı'yı ve okuma yazma bilmeyen peygamberin misyonunu yüceltmek
    id: Memuliakan Tuhan dan misi nabi yang tidak berpendidikan
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: تسبيح الله الملك القدوس العزيز الحكيم، وبيان بعثة الرسول من الأميين يتلو عليهم آياته ويزكيهم ويعلمهم الكتاب والحكمة، فضل الله يؤتيه من يشاء.
    en: 'Glorifying Allah, the Sovereign, the Holy, the Mighty, the Wise; and the mission of the Messenger sent among the unlettered — reciting His verses, purifying them, and teaching the Book and wisdom:
      Allah''s favor, granted to whom He wills.'
    tr: Tanrı'yı, Kral'ı, Kutsal'ı, Kudretli'yi, Bilge'yi yüceltmek ve Elçinin görevini, okuma yazma bilmeyenlerden açıklamak; okuma yazmayanlar, O'nun ayetlerini okuyan, onları arındıran ve Kitabı ve bilgeliği
      öğretenlerden. Tanrı'nın lütfunu, İstediği kişiye verir.
    id: Memuliakan Allah, Raja, Yang Kudus, Yang Perkasa, Yang Bijaksana, dan menjelaskan misi Rasul dari orang yang tidak berpendidikan yang membacakan ayat-ayat-Nya kepada mereka, menyucikan mereka, dan
      mengajarkan mereka Kitab dan hikmat. Kasih karunia Allah Dia kurniakan kepada siapa pun yang Dia kehendaki.
  children: []
- title:
    ar: عتاب اليهود
    en: Rebuking the Jews
    tr: Yahudilerin Suçlanması
    id: Celaan terhadap orang Yahudi
  range:
  - 5
  - 8
  family: faith
  summary:
    ar: مثل الذين حملوا التوراة ثم لم يحملوها كمثل الحمار يحمل أسفارا، ثم تحدي من يدعي أنه ولي الله دون الناس أن يتمنى الموت، وبيان أن الموت ملاقيهم لا محالة.
    en: The parable of those charged with the Torah who failed to live by it — like a donkey laden with books — then the challenge to those who claim exclusive closeness to Allah to wish for death, and
      the reminder that death will surely meet them.
    tr: Tevrat'ı taşıyan ama taşımayanların örneği, bir eşeğin kitap taşımasına benziyor; sonra Tanrı'nın koruyucusu olduğunu iddia edenlere ölüm dilemeye meydan okuması ve ölümün onlar için kaçınılmaz
      olduğunu netleştirmesi gibidir.
    id: Contoh mereka yang membawa Taurat tetapi tidak membawanya seperti keledai yang membawa buku, lalu menantang mereka yang mengaku sebagai pelindung Tuhan atas orang lain untuk menginginkan kematian,
      dan memperjelas bahwa kematian adalah hal yang tak terelakkan bagi mereka.
  children:
