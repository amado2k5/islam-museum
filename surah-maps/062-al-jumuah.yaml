map:
  - title: { ar: "تسبيح الله وبعثة الرسول الأمي", en: "Glorifying Allah and the Unlettered Messenger" }
    range: [1, 4]
    family: faith
    summary:
      ar: "تسبيح الله الملك القدوس العزيز الحكيم، وبيان بعثة الرسول من الأميين يتلو عليهم آياته ويزكيهم ويعلمهم الكتاب والحكمة، فضل الله يؤتيه من يشاء."
      en: "Glorifying Allah, the Sovereign, the Holy, the Mighty, the Wise; and the mission of the Messenger sent among the unlettered — reciting His verses, purifying them, and teaching the Book and wisdom: Allah's favor, granted to whom He wills."
    children: []
  - title: { ar: "عتاب اليهود", en: "Rebuking the Jews" }
    range: [5, 8]
    family: faith
    summary:
      ar: "مثل الذين حملوا التوراة ثم لم يحملوها كمثل الحمار يحمل أسفارا، ثم تحدي من يدعي أنه ولي الله دون الناس أن يتمنى الموت، وبيان أن الموت ملاقيهم لا محالة."
      en: "The parable of those charged with the Torah who failed to live by it — like a donkey laden with books — then the challenge to those who claim exclusive closeness to Allah to wish for death, and the reminder that death will surely meet them."
    children:
      - { title: { ar: "مثل الحمار يحمل أسفارا", en: "The Donkey Laden with Books" }, range: [5, 5] }
      - { title: { ar: "تحدي تمني الموت", en: "The Challenge to Wish for Death" }, range: [6, 7] }
      - { title: { ar: "الموت ملاقيكم", en: "Death Will Meet You" }, range: [8, 8] }
  - title: { ar: "صلاة الجمعة", en: "The Friday Prayer" }
    range: [9, 11]
    family: law
    summary:
      ar: "أحكام يوم الجمعة: إذا نودي للصلاة فاسعوا إلى ذكر الله وذروا البيع، ثم انتشروا بعد الصلاة وابتغوا من فضل الله، مع عتاب من انفضوا إلى التجارة واللهو."
      en: "The rulings of Friday: when the call to prayer is made, hasten to Allah's remembrance and leave off trade; then disperse after prayer seeking Allah's bounty — with a rebuke of those who scattered toward trade and amusement."
    children: []
