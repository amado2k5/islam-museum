- title:
    ar: صلاة الجمعة
    en: The Friday Prayer
    tr: Cuma namazı
    id: Doa Jumat
  range:
  - 9
  - 11
  family: law
  summary:
    ar: 'أحكام يوم الجمعة: إذا نودي للصلاة فاسعوا إلى ذكر الله وذروا البيع، ثم انتشروا بعد الصلاة وابتغوا من فضل الله، مع عتاب من انفضوا إلى التجارة واللهو.'
    en: 'The rulings of Friday: when the call to prayer is made, hasten to Allah''s remembrance and leave off trade; then disperse after prayer seeking Allah''s bounty — with a rebuke of those who scattered
      toward trade and amusement.'
    tr: 'Cuma günü kararlar: Namaz çağrısı yapıldığında, Allah''ı anmaya acele edin ve ticareti bırakın. Namazdan sonra dağılıp Allah''ın lütfunu, ticaret ve eğlenceye yönelenlerin kınamalarını dilen.'
    id: 'Putusan pada hari Jumat: Ketika panggilan untuk salat dibuat, cepatlah mengenang Allah dan tinggalkan perdagangan. Kemudian bercerailah setelah salat dan mohon rahmat Allah, bersama dengan celaan
      dari mereka yang berpaling untuk perdagangan dan hiburan.'
  children: []
