map:
  - title: { ar: "أصحاب الأخدود", en: "The People of the Trench" }
    range: [1, 11]
    family: stories
    summary:
      ar: "والسماء ذات البروج واليوم الموعود: قتل أصحاب الأخدود النار ذات الوقود إذ هم عليها قعود، وما نقموا منهم إلا أن يؤمنوا بالله."
      en: "By the sky of constellations and the promised Day: destroyed are the people of the trench — the fire with its fuel — who resented the believers only for their faith."
    children:
      - { title: { ar: "النار ذات الوقود", en: "The Fire with Its Fuel" }, range: [4, 7] }
  - title: { ar: "بطش ربك", en: "Your Lord's Grip" }
    range: [12, 22]
    family: faith
    summary:
      ar: "إن بطش ربك لشديد إنه هو يبدئ ويعيد، الغفور الودود ذو العرش المجيد، وفرعون وثمود عبرة، بل هو قرآن مجيد في لوح محفوظ."
      en: "Your Lord's grip is severe: He originates and restores — the Forgiving, the Loving, Lord of the glorious Throne; Pharaoh and Thamud as warning — a glorious Quran in a preserved tablet."
    children: []
