map:
  - title: { ar: "كلام الجن بعد سماع القرآن", en: "The Jinn's Speech After Hearing the Quran" }
    range: [1, 19]
    family: faith
    summary:
      ar: "نفر من الجن يستمعون القرآن فيؤمنون به، ويصححون لقومهم المعتقدات: تنزيه الله عن الصاحبة والولد، وحراسة السماء بالشهب، وأصناف الجن بين صالح وطالح."
      en: "A band of jinn hear the Quran and believe; they correct their people's beliefs: Allah exalted above spouse and child, the guarded heaven with meteors, and jinn of different ways, righteous and otherwise."
    children:
      - { title: { ar: "استماع الجن وإيمانهم", en: "The Jinn Listen and Believe" }, range: [1, 2] }
      - { title: { ar: "تنزيه الله وتصحيح المعتقدات", en: "Exalting Allah, Correcting Beliefs" }, range: [3, 7] }
      - { title: { ar: "حراسة السماء بالشهب", en: "The Heaven Guarded with Meteors" }, range: [8, 10] }
      - { title: { ar: "أصناف الجن", en: "The Kinds of Jinn" }, range: [11, 15] }
  - title: { ar: "رد الرسول وعلم الغيب", en: "The Messenger's Reply and the Unseen" }
    range: [20, 28]
    family: faith
    summary:
      ar: "خطاب الرسول: لا يملك ضرا ولا رشدا، وإنما يبلغ رسالات ربه، والمساجد لله، وعلم الغيب لا يظهره الله إلا لمن ارتضى من رسول."
      en: "The Messenger's word: he owns no harm or guidance, only conveys his Lord's messages; mosques belong to Allah; and the Unseen is disclosed only to a messenger He approves."
    children:
      - { title: { ar: "لا أملك ضرا ولا رشدا", en: "I Own No Harm nor Guidance" }, range: [20, 24] }
      - { title: { ar: "عالم الغيب والرسل", en: "Knower of the Unseen and the Messengers" }, range: [25, 28] }
