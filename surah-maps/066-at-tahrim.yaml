surah: 66
slug: at-tahrim
sources_consulted:
  - "Wikipedia — At-Tahrim (verse-by-verse summary)"
  - "islamicstudies.info — Tafheem ul Quran translation (Surah 66:8-12)"
  - "askislampedia.com — Surah At-Tahrim (full text, Sahih International)"
map:
  - title: { ar: "حادثة التحريم", en: "The Incident of the Prohibition" }
    range: [1, 5]
    family: faith
    summary:
      ar: "عتاب النبي على تحريمه ما أحل الله له ابتغاء مرضاة أزواجه، وبيان أن الله شرع تحلة الأيمان، ثم عتاب زوجتيه على إفشاء السر مع وعد بالاستبدال إن استمرتا."
      en: "The reproof of the Prophet for prohibiting to himself what Allah made lawful, seeking his wives' pleasure; Allah's ordaining of expiation for oaths; then the reproof of his two wives for disclosing the secret, with a promise of replacement if they persist."
    children:
      - { title: { ar: "العتاب وكفارة اليمين", en: "The Reproof and Expiation of the Oath" }, range: [1, 2] }
      - { title: { ar: "إفشاء السر", en: "The Disclosed Secret" }, range: [3, 4] }
      - { title: { ar: "وعد الاستبدال", en: "The Promise of Replacement" }, range: [5, 5] }
  - title: { ar: "الوقاية من النار", en: "Shielding from the Fire" }
    range: [6, 9]
    family: faith
    summary:
      ar: "نداء المؤمنين أن يقوا أنفسهم وأهليهم نارا وقودها الناس والحجارة، والدعوة إلى التوبة النصوح، والأمر بمجاهدة الكفار والمنافقين والغلظة عليهم."
      en: "A call to the believers to shield themselves and their families from a Fire whose fuel is people and stones; an invitation to sincere repentance; and the command to strive against the disbelievers and hypocrites and be firm with them."
    children:
      - { title: { ar: "قوا أنفسكم وأهليكم نارا", en: "Guard Yourselves and Your Families from the Fire" }, range: [6, 7] }
      - { title: { ar: "التوبة النصوح", en: "Sincere Repentance" }, range: [8, 8] }
      - { title: { ar: "جهاد الكفار والمنافقين", en: "Striving Against Disbelievers and Hypocrites" }, range: [9, 9] }
  - title: { ar: "أمثلة النساء الأربع", en: "The Four Women as Examples" }
    range: [10, 12]
    family: stories
    summary:
      ar: "أربعة أمثلة للنساء: امرأتا نوح ولوط خانتا زوجيهما فلم يغنيا عنهما شيئا، وامرأة فرعون آمنت رغم زوجها الكافر، ومريم ابنة عمران أحصنت فرجها وصدقت بكلمات ربها."
      en: "Four women as examples: the wives of Noah and Lot betrayed their husbands and gained nothing from them; Pharaoh's wife believed despite her disbelieving husband; and Mary, daughter of Imran, guarded her chastity and affirmed her Lord's words."
    children:
      - { title: { ar: "امرأة نوح وامرأة لوط", en: "The Wives of Noah and Lot" }, range: [10, 10] }
      - { title: { ar: "امرأة فرعون", en: "The Wife of Pharaoh" }, range: [11, 11] }
      - { title: { ar: "مريم ابنة عمران", en: "Mary, Daughter of Imran" }, range: [12, 12] }
