map:
- title:
    ar: حادثة التحريم
    en: The Incident of the Prohibition
    tr: Yasaklama Olayı
    id: Insiden Larangan
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: عتاب النبي على تحريمه ما أحل الله له ابتغاء مرضاة أزواجه، وبيان أن الله شرع تحلة الأيمان، ثم عتاب زوجتيه على إفشاء السر مع وعد بالاستبدال إن استمرتا.
    en: The reproof of the Prophet for prohibiting to himself what Allah made lawful, seeking his wives' pleasure; Allah's ordaining of expiation for oaths; then the reproof of his two wives for disclosing
      the secret, with a promise of replacement if they persist.
    tr: Peygamber'in, Allah'ın kendisine eşlerini memnun etmek için izin verdiklerini yasakladığı ve Allah'ın yemin edilebilirliğini yasalaştırdığını netleştirdiği, ardından eşlerini sırrı açığa çıkardıkları
      için azarlayıp devam ederlerse yerine geçecekleri sözüyle azarladığı için bu suçlama.
    id: Celaan Nabi karena melarang apa yang Allah izinkan demi menyenangkan istri-istrinya, dan menjelaskan bahwa Allah telah menetapkan kebolehan sumpah, lalu menegur istri-istrinya karena mengungkapkan
      rahasia itu dengan janji pengganti jika mereka melanjutkan.
  children:
  - title:
      ar: العتاب وكفارة اليمين
      en: The Reproof and Expiation of the Oath
      tr: Yemin için azarlama ve kefaret
      id: Teguran dan penebusan atas sumpah
    range:
    - 1
    - 2
  - title:
      ar: إفشاء السر
      en: The Disclosed Secret
      tr: Sırrın açıklanması
      id: Pengungkapan rahasia
    range:
    - 3
    - 4
  - title:
      ar: وعد الاستبدال
      en: The Promise of Replacement
      tr: Değişim vaadi
      id: Janji pertukaran
    range:
    - 5
    - 5
- title:
    ar: الوقاية من النار
    en: Shielding from the Fire
    tr: Yangın Önleme
    id: Pencegahan Kebakaran
  range:
  - 6
  - 9
  family: faith
  summary:
    ar: نداء المؤمنين أن يقوا أنفسهم وأهليهم نارا وقودها الناس والحجارة، والدعوة إلى التوبة النصوح، والأمر بمجاهدة الكفار والمنافقين والغلظة عليهم.
    en: A call to the believers to shield themselves and their families from a Fire whose fuel is people and stones; an invitation to sincere repentance; and the command to strive against the disbelievers
      and hypocrites and be firm with them.
    tr: İnananların kendilerini ve ailelerini insanlardan ve taşlardan kaynaklanan ateşten koruma çağrısı, içten tövbe çağrısı ve kâfirler ile münafıklarla savaşma ve onlara sert davranma emri.
    id: Seruan para mukmin untuk melindungi diri dan keluarga mereka dari api yang dipicu oleh manusia dan batu, seruan untuk pertobatan yang tulus, dan perintah untuk melawan kafir dan munafik serta bersikap
      keras kepada mereka.
  children:
  - title:
      ar: قوا أنفسكم وأهليكم نارا
      en: Guard Yourselves and Your Families from the Fire
      tr: Kendinizi ve ailelerinizi ateşle koruyun
      id: Lindungi diri dan keluarga dengan api
    range:
    - 6
    - 7
  - title:
      ar: التوبة النصوح
      en: Sincere Repentance
      tr: içten tövbe
      id: pertobatan tulus
    range:
    - 8
    - 8
  - title:
      ar: جهاد الكفار والمنافقين
      en: Striving Against Disbelievers and Hypocrites
      tr: Kafirlerin ve ikiyüzlülerin cihadı
      id: Jihad kafir dan munafik
    range:
    - 9
    - 9
- title:
    ar: أمثلة النساء الأربع
    en: The Four Women as Examples
    tr: Dört Kadın Örnekleri
    id: Contoh Empat Wanita
  range:
  - 10
  - 12
  family: stories
  summary:
    ar: 'أربعة أمثلة للنساء: امرأتا نوح ولوط خانتا زوجيهما فلم يغنيا عنهما شيئا، وامرأة فرعون آمنت رغم زوجها الكافر، ومريم ابنة عمران أحصنت فرجها وصدقت بكلمات ربها.'
    en: 'Four women as examples: the wives of Noah and Lot betrayed their husbands and gained nothing from them; Pharaoh''s wife believed despite her disbelieving husband; and Mary, daughter of Imran, guarded
      her chastity and affirmed her Lord''s words.'
    tr: 'Dört kadın örneği: Nuh ve Lut''un eşleri, kocalarını satıp onlara hiç fayda sağlamadı; Firavun''un karısı kocası inanmamış olsa da iman etti; ve İmran''ın kızı Meryem, özel bölgelerini koruyor
      ve Rabbinin sözlerine inanıyordu.'
    id: 'Empat contoh wanita: istri Nuh dan Lot yang mengkhianati suami mereka dan sama sekali tidak menguntungkan mereka; istri Firaun percaya meskipun suaminya tidak percaya; dan Maria, putri Imran, yang
      menjaga bagian pribadinya dan percaya pada firman Tuhannya.'
  children:
