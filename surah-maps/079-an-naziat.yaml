map:
- title:
    ar: القسم والراجفة
    en: The Oath and the Quake
    tr: Bölüm ve sarsıntı
    id: Bagian dan getaran
  range:
  - 1
  - 14
  family: faith
  summary:
    ar: خمسة أقسام بالنازعات على وقوع البعث، ثم يوم ترجف الراجفة تتبعها الرادفة، قلوب واجفة وأبصار خاشعة.
    en: Five oaths by those who pull out, that the Return is real; then the quaking blast and its follower — hearts trembling, eyes humbled.
    tr: Dirilişin mücadeleleri üzerine beş bölüm, ardından titreyen titremeler ve ardından kuru kalpli ve alçakgönüllü gözlerle peşindeki kişi gelir.
    id: Lima bagian tentang perjuangan kebangkitan, lalu hari gemetar diikuti oleh pengejar, dengan hati kering dan mata rendah hati.
  children: []
- title:
    ar: موسى وفرعون
    en: Moses and Pharaoh
    tr: Musa ve Firavun
    id: Musa dan Firaun
  range:
  - 15
  - 26
  family: stories
  summary:
    ar: 'هل أتاك حديث موسى إذ ناداه ربه بالوادي المقدس: اذهب إلى فرعون إنه طغى، فكذب وعصى فأخذه الله نكال الآخرة والأولى.'
    en: Has the story of Moses reached you? Called in the sacred valley to go to tyrannical Pharaoh — who denied and disobeyed, so Allah seized him as a lesson.
    tr: 'Musa''nın hikâyesini duydun mu, Rabbi onu kutsal vadi''ye çağırdığında: Firavun''a git; o suç etti, yalan söyledi ve itaatsizlik etti, Allah onu ahiret ve ahiret cezasıyla yakaladı.'
    id: 'Pernahkah kau mendengar kisah Musa ketika Tuhan-Nya memanggilnya ke Lembah Suci: Pergilah kepada Firaun; dia berbuat pelanggaran, maka dia berbohong dan tidak taat, dan Allah menangkapnya dengan
      hukuman atas akhirat dan akhirat.'
  children: []
- title:
    ar: بناء السماء ودحو الأرض
    en: The Raised Heaven
    tr: Gökyüzünü inşa etmek ve dünyayı yok etmek
    id: Membangun langit dan menghancurkan bumi
  range:
  - 27
  - 33
  family: faith
  summary:
    ar: 'الاستدلال بالخلق: أأنتم أشد خلقا أم السماء بناها ورفع سمكها، والأرض بعد ذلك دحاها وأخرج ماءها ومرعاها.'
    en: 'The argument from creation: the heaven raised and ordered, then the earth spread forth with its water and pasture.'
    tr: 'Yaratılışın kanıtı: Daha güçlü bir yaratılış mısınız, yoksa gökyüzü mi inşa etti, kalınlığını yükseltti, sonra yer onu yaydı, suyu ve otlasını mı getirdi?'
    id: 'Bukti dari ciptaan: Apakah kamu lebih merupakan ciptaan yang lebih kuat, atau langit yang Dia bangun dan tingkatkan ketebalannya, lalu bumi menyebarkannya dan menghasilkan air serta padang rumputnya?'
  children: []
- title:
    ar: الطامة الكبرى
    en: The Overwhelming Calamity
    tr: Büyük Felaket
    id: Bencana Besar
  range:
  - 34
  - 41
  family: faith
  summary:
    ar: 'فإذا جاءت الطامة الكبرى يوم يتذكر الإنسان ما سعى: فأما من طغى فالجحيم مأواه، وأما من خاف مقام ربه فالجنة مأواه.'
    en: 'When the Overwhelming Calamity comes and man remembers his striving: Hell for the transgressor, Paradise for who feared standing before his Lord.'
    tr: 'Büyük felaket, kişinin çabaladığı şeyi hatırladığı gün geldiğinde: Suç eden için cehennem, Rab''bin huzurunda durmaktan korkan için ise cennet onun sığınağıdır.'
    id: 'Ketika malapetaka besar datang pada Hari ketika seseorang mengingat apa yang telah dia perjuangkan: Adapun orang yang melanggar, Neraka adalah tempat perlindungannya, dan bagi orang yang takut
      berdiri di hadapan Tuhan-nya, Surga adalah tempat perlindungannya.'
  children: []
- title:
    ar: السؤال عن الساعة
    en: The Question About the Hour
    tr: Saat hakkında soru
    id: Pertanyaan tentang jam tangan
  range:
  - 42
  - 46
  family: faith
  summary:
    ar: 'يسألونك عن الساعة أيان مرساها: إنما أنت منذر من يخشاها، كأنهم يوم يرونها لم يلبثوا إلا عشية أو ضحاها.'
    en: 'They ask you about the Hour: you are only a warner to whoever fears it — as if, the day they see it, they had stayed but an evening.'
    tr: 'Size Saat hakkında soruyorlar, ki bu onun demiridir: Korkanlar için sadece bir uyarıcısınız, sanki onu gördükleri gün sadece akşam ya da şafakta kalmışlarmış gibi.'
    id: 'Mereka bertanya tentang Jam, yang menjadi jangkarnya: Kamu hanya menjadi peringatan bagi mereka yang takut padanya, seolah-olah pada hari mereka melihatnya, mereka hanya tinggal di malam hari atau
      saat fajar.'
  children: []
