surah: 79
slug: an-naziat
sources_consulted:
  - "kuttab.com — Surah An-Nazi'at mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "القسم والراجفة", en: "The Oath and the Quake" }
    range: [1, 14]
    family: faith
    summary:
      ar: "خمسة أقسام بالنازعات على وقوع البعث، ثم يوم ترجف الراجفة تتبعها الرادفة، قلوب واجفة وأبصار خاشعة."
      en: "Five oaths by those who pull out, that the Return is real; then the quaking blast and its follower — hearts trembling, eyes humbled."
    children: []
  - title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }
    range: [15, 26]
    family: stories
    summary:
      ar: "هل أتاك حديث موسى إذ ناداه ربه بالوادي المقدس: اذهب إلى فرعون إنه طغى، فكذب وعصى فأخذه الله نكال الآخرة والأولى."
      en: "Has the story of Moses reached you? Called in the sacred valley to go to tyrannical Pharaoh — who denied and disobeyed, so Allah seized him as a lesson."
    children: []
  - title: { ar: "بناء السماء ودحو الأرض", en: "The Raised Heaven" }
    range: [27, 33]
    family: faith
    summary:
      ar: "الاستدلال بالخلق: أأنتم أشد خلقا أم السماء بناها ورفع سمكها، والأرض بعد ذلك دحاها وأخرج ماءها ومرعاها."
      en: "The argument from creation: the heaven raised and ordered, then the earth spread forth with its water and pasture."
    children: []
  - title: { ar: "الطامة الكبرى", en: "The Overwhelming Calamity" }
    range: [34, 41]
    family: faith
    summary:
      ar: "فإذا جاءت الطامة الكبرى يوم يتذكر الإنسان ما سعى: فأما من طغى فالجحيم مأواه، وأما من خاف مقام ربه فالجنة مأواه."
      en: "When the Overwhelming Calamity comes and man remembers his striving: Hell for the transgressor, Paradise for who feared standing before his Lord."
    children: []
  - title: { ar: "السؤال عن الساعة", en: "The Question About the Hour" }
    range: [42, 46]
    family: faith
    summary:
      ar: "يسألونك عن الساعة أيان مرساها: إنما أنت منذر من يخشاها، كأنهم يوم يرونها لم يلبثوا إلا عشية أو ضحاها."
      en: "They ask you about the Hour: you are only a warner to whoever fears it — as if, the day they see it, they had stayed but an evening."
    children: []
