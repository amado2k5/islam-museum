map:
  - title: { ar: "البينة", en: "The Clear Proof" }
    range: [1, 5]
    family: faith
    summary:
      ar: "لم يكن الذين كفروا من أهل الكتاب والمشركين منفكين حتى تأتيهم البينة: رسول من الله يتلو صحفا مطهرة فيها كتب قيمة، والدين القيم: عبادة الله مخلصين وإقام الصلاة وإيتاء الزكاة."
      en: "The disbelievers would not cease until the Clear Proof came: a messenger from Allah reciting pure pages of upright writings — the upright religion: worshipping Allah sincerely, establishing prayer, giving alms."
    children: []
  - title: { ar: "شر البرية وخيرها", en: "The Worst and Best of Creatures" }
    range: [6, 8]
    family: faith
    summary:
      ar: "إن الذين كفروا في نار جهنم خالدين أولئك هم شر البرية، والذين آمنوا وعملوا الصالحات أولئك هم خير البرية: جنات عدن ورضوان الله."
      en: "The disbelievers among the People of the Book and the polytheists shall be in Hellfire — the worst of creatures; the believing righteous are the best of creatures: Gardens of Eden and Allah's good pleasure."
    children: []
