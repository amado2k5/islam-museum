map:
- title:
    ar: البينة
    en: The Clear Proof
    tr: Kanıtlar
    id: Bukti
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'لم يكن الذين كفروا من أهل الكتاب والمشركين منفكين حتى تأتيهم البينة: رسول من الله يتلو صحفا مطهرة فيها كتب قيمة، والدين القيم: عبادة الله مخلصين وإقام الصلاة وإيتاء الزكاة.'
    en: 'The disbelievers would not cease until the Clear Proof came: a messenger from Allah reciting pure pages of upright writings — the upright religion: worshipping Allah sincerely, establishing prayer,
      giving alms.'
    tr: 'Kitap Ehlileri ile Yolkârlar arasında kalanlar, açık kanıt gelene kadar ayrılmadı: Allah''tan bir elçi, değerli kitaplar içeren saf ayetler okuyor ve yüce din Allah''a samimiyetle ibadet ediyor,
      namaz kuruyor ve zekat veriyor.'
    id: 'Mereka yang tidak beriman di antara Umat Kitab dan para musyrik tidak dipisahkan sampai bukti jelas datang kepada mereka: seorang rasul Allah yang membaca kitab suci yang berisi kitab-kitab berharga,
      dan agama mulia menyembah Allah dengan tulus, mendirikan doa, dan memberikan zakat.'
  children: []
- title:
    ar: شر البرية وخيرها
    en: The Worst and Best of Creatures
    tr: Vahşi doğanın kötülüğü ve iyiliği
    id: Kejahatan di alam liar dan kebaikannya
  range:
  - 6
  - 8
  family: faith
  summary:
    ar: 'إن الذين كفروا في نار جهنم خالدين أولئك هم شر البرية، والذين آمنوا وعملوا الصالحات أولئك هم خير البرية: جنات عدن ورضوان الله.'
    en: 'The disbelievers among the People of the Book and the polytheists shall be in Hellfire — the worst of creatures; the believing righteous are the best of creatures: Gardens of Eden and Allah''s
      good pleasure.'
    tr: 'Gerçekten de, kâfir olanlar cehennem ateşinde sonsuza dek kalırlar; bunlar yaratılışın en kötüsüdür; iman edenler ve doğru işler yapanlar ise yaratıkların en iyisidir: Aden bahçeleri ve Allah''ın
      lütfu.'
    id: 'Memang, mereka yang tidak percaya akan kekal selamanya dalam Api Neraka; mereka adalah yang terburuk dari ciptaan, dan mereka yang percaya serta berbuat baik adalah makhluk terbaik: taman Eden
      dan kerduhan Allah.'
  children: []
