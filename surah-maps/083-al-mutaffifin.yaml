map:
  - title: { ar: "ويل للمطففين", en: "Woe to the Defrauders" }
    range: [1, 6]
    family: faith
    summary:
      ar: "وعيد من يبخس الكيل والميزان: ألا يظن أولئك أنهم مبعوثون ليوم عظيم يوم يقوم الناس لرب العالمين."
      en: "Woe to who give short measure and weight: do they not think they will be raised on a tremendous Day, when mankind stands before the Lord of the worlds?"
    children: []
  - title: { ar: "سجين", en: "Sijjin" }
    range: [7, 17]
    family: faith
    summary:
      ar: "كلا إن كتاب الفجار لفي سجين: ويل يومئذ للمكذبين بيوم الدين، ران على قلوبهم ما كانوا يكسبون، وإنهم عن ربهم لمحجوبون."
      en: "The record of the wicked is in Sijjin: woe to the deniers of the Recompense — rust upon their hearts from what they earned, veiled from their Lord."
    children: []
  - title: { ar: "عليون", en: "Illiyyun" }
    range: [18, 28]
    family: faith
    summary:
      ar: "كلا إن كتاب الأبرار لفي عليين يشهده المقربون: نعيم الأبرار على الأرائك، يسقون من رحيق مختوم ختامه مسك ومزاجه من تسنيم."
      en: "The record of the righteous is in Illiyyun, witnessed by the nearest: their bliss on couches, served a sealed pure drink whose seal is musk, mixed with Tasnim."
    children: []
  - title: { ar: "انقلاب السخرية", en: "The Mockery Reversed" }
    range: [29, 36]
    family: faith
    summary:
      ar: "إن الذين أجرموا كانوا من الذين آمنوا يضحكون ويتغامزون، فاليوم الذين آمنوا من الكفار يضحكون على الأرائك ينظرون."
      en: "The wicked used to laugh at the believers and wink at one another; today the believers laugh at the disbelievers, watching from couches."
    children: []
