map:
- title:
    ar: ويل للمطففين
    en: Woe to the Defrauders
    tr: Bağımlılara yazık.
    id: Celakalah para pecandu.
  range:
  - 1
  - 6
  family: faith
  summary:
    ar: 'وعيد من يبخس الكيل والميزان: ألا يظن أولئك أنهم مبعوثون ليوم عظيم يوم يقوم الناس لرب العالمين.'
    en: 'Woe to who give short measure and weight: do they not think they will be raised on a tremendous Day, when mankind stands before the Lord of the worlds?'
    tr: 'Ve ölçeği ve teraziyi küçümseyenin uyarısı: Büyük bir gün, insanların dünyaların Rabbi önünde duracağı gün için gönderildiklerini sanmıyorlar mı?'
    id: 'Dan peringatan dari orang yang meremehkan ukuran dan timbangan: Bukankah mereka mengira mereka diutus untuk hari yang besar, hari ketika manusia akan berdiri di hadapan Tuhan alam semesta?'
  children: []
- title:
    ar: سجين
    en: Sijjin
    tr: Mahkum
    id: Tahanan
  range:
  - 7
  - 17
  family: faith
  summary:
    ar: 'كلا إن كتاب الفجار لفي سجين: ويل يومئذ للمكذبين بيوم الدين، ران على قلوبهم ما كانوا يكسبون، وإنهم عن ربهم لمحجوبون.'
    en: 'The record of the wicked is in Sijjin: woe to the deniers of the Recompense — rust upon their hearts from what they earned, veiled from their Lord.'
    tr: 'Hayır, kötülerin kitabı bir hapishanede yazılmıştır: Kıyamet Günü''nü reddedenlere vay o gün. Kalpleri kazandıklarıyla doludur ve Rablerinden perdelenirler.'
    id: 'Tidak, kitab orang jahat ditulis di penjara: Celakalah hari itu bagi mereka yang menyangkal Hari Penghakiman. Hati mereka dipenuhi dengan apa yang dulu mereka hasilkan, dan mereka tersembunyi dari
      Tuhan mereka.'
  children: []
- title:
    ar: عليون
    en: Illiyyun
    tr: Aliyun
    id: Aliyun
  range:
  - 18
  - 28
  family: faith
  summary:
    ar: 'كلا إن كتاب الأبرار لفي عليين يشهده المقربون: نعيم الأبرار على الأرائك، يسقون من رحيق مختوم ختامه مسك ومزاجه من تسنيم.'
    en: 'The record of the righteous is in Illiyyun, witnessed by the nearest: their bliss on couches, served a sealed pure drink whose seal is musk, mixed with Tasnim.'
    tr: 'Hayır, Doğru Kitap en yüksek yerlerdedir, yakınındakiler tarafından tanıklık edilir: kanepelerde doğruların mutluluğu, miskle mühürlenmiş nektarla sulanmış ve Tasnim''den gelen ruh hali.'
    id: 'Tidak, Kitab Orang Benar ada di tempat tertinggi, disaksikan oleh orang-orang terdekat: kebahagiaan orang benar di sofa, disiram dari nektar yang disegel dengan musk dan suasana hatinya dari Tasnim.'
  children: []
- title:
    ar: انقلاب السخرية
    en: The Mockery Reversed
    tr: Hicivin Darbesi
    id: Kudeta Satire
  range:
  - 29
  - 36
  family: faith
  summary:
    ar: إن الذين أجرموا كانوا من الذين آمنوا يضحكون ويتغامزون، فاليوم الذين آمنوا من الكفار يضحكون على الأرائك ينظرون.
    en: The wicked used to laugh at the believers and wink at one another; today the believers laugh at the disbelievers, watching from couches.
    tr: Gerçekten de günah işleyenler inananlardan, gülerek ve göz kırpanlardır. Bugün, inananlar kanepelerinde güler ve izler.
    id: Memang, mereka yang berdosa adalah di antara mereka yang percaya, tertawa dan mengedipkan mata. Hari ini, mereka yang percaya di antara orang kafir tertawa di sofa mereka dan menyaksikan.
  children: []
