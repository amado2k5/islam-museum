surah: 46
slug: al-ahqaf
sources_consulted:
  - "arz.wikipedia.org — سورة الأحقاف (1-12، 13-14، 15-16، 17-20، 21-28، 29-32، 33-35)"
map:
  - title: { ar: "القدرة ومناقشة المشركين", en: "Power; Arguing the Deniers" }
    range: [1, 12]
    family: faith
    summary:
      ar: "حم؛ تنزيل الكتاب من الله العزيز الحكيم؛ ما خلقنا السماوات والأرض إلا بالحق؛ قل ما كنت بدعا من الرسل؛ وشهد شاهد من بني إسرائيل."
      en: "Ha-Mim; the Book's sending down from God, the Mighty, the Wise; We created the heavens and earth only in truth; say: I am no novelty among messengers — and a witness from the Children of Israel testified."
    children:
      - { title: { ar: "تنزيل الكتاب", en: "The Sending Down of the Book" }, range: [1, 3] }
      - { title: { ar: "شاهد من بني إسرائيل", en: "A Witness from Israel" }, range: [10, 10] }
  - title: { ar: "جزاء المستقيمين", en: "The Reward of the Steadfast" }
    range: [13, 14]
    family: faith
    summary:
      ar: "إن الذين قالوا ربنا الله ثم استقاموا فلا خوف عليهم ولا هم يحزنون أولئك أصحاب الجنة خالدين فيها جزاء بما كانوا يعملون."
      en: "Those who say: our Lord is God, then remain steadfast — no fear on them, nor shall they grieve; companions of the Garden, abiding, a reward for what they did."
    children: []
  - title: { ar: "الوصية بالوالدين", en: "The Charge Toward Parents" }
    range: [15, 16]
    family: law
    summary:
      ar: "ووصينا الإنسان بوالديه إحسانا حملته أمه كرها ووضعته كرها؛ حتى إذا بلغ أشده وبلغ أربعين سنة قال رب أوزعني أن أشكر نعمتك."
      en: "We charged man with kindness to his parents — his mother bore him in hardship and bore him in hardship; at forty he says: my Lord, enable me to thank Your favor."
    children:
      - { title: { ar: "بلوغ الأربعين", en: "Reaching Forty" }, range: [15, 15] }
  - title: { ar: "جزاء العاق", en: "The Reward of the Ungrateful" }
    range: [17, 20]
    family: faith
    summary:
      ar: "والذي قال لوالديه أف لكما أتعدانني أن أخرج؛ ويوم يعرض الذين كفروا على النار أذهبتم طيباتكم في حياتكم الدنيا."
      en: "One who says to his parents: fie on you, do you promise me I shall be brought out; on the Day deniers are exposed to the Fire: you consumed your good things in your worldly life."
    children: []
  - title: { ar: "قصة هود", en: "The Story of Hud" }
    range: [21, 28]
    family: stories
    summary:
      ar: "واذكر أخا عاد إذ أنذر قومه بالأحقاف؛ فلما رأوه عارضا مستقبل أوديتهم قالوا هذا عارض ممطرنا؛ بل هو ما استعجلتم به ريح فيها عذاب أليم."
      en: "Remember the brother of 'Ad when he warned his people at al-Ahqaf; when they saw a cloud approaching their valleys they said: a cloud bringing rain — rather, it is what you hastened: a wind with painful torment."
    children:
      - { title: { ar: "عارض ممطرنا", en: "\"A Cloud Bringing Rain\"" }, range: [24, 26] }
  - title: { ar: "إيمان الجن", en: "The Belief of the Jinn" }
    range: [29, 32]
    family: stories
    summary:
      ar: "وإذ صرفنا إليك نفرا من الجن يستمعون القرآن فلما حضروه قالوا أنصتوا؛ فلما قضي ولوا إلى قومهم منذرين؛ قالوا يا قومنا أجيبوا داعي الله."
      en: "When We turned toward you a company of jinn listening to the Quran, they said: be silent; when it was done they returned to their people as warners — saying: our people, answer God's caller."
    children:
      - { title: { ar: "استماع الجن", en: "The Jinn Listen" }, range: [29, 30] }
      - { title: { ar: "أجيبوا داعي الله", en: "\"Answer God's Caller\"" }, range: [31, 32] }
  - title: { ar: "إثبات البعث", en: "Establishing Resurrection" }
    range: [33, 35]
    family: faith
    summary:
      ar: "أولم يروا أن الله الذي خلق السماوات والأرض ولم يعي بخلقهن بقادر على أن يحيي الموتى؛ فاصبر كما صبر أولو العزم من الرسل."
      en: "Do they not see that God, who created the heavens and earth and did not tire of their creation, is able to give life to the dead; so be patient as the resolute messengers were patient."
    children:
      - { title: { ar: "فاصبر كما صبر أولو العزم", en: "Be Patient as the Resolute Were" }, range: [35, 35] }
