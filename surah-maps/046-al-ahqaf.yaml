surah: 46
slug: al-ahqaf
sources_consulted:
- arz.wikipedia.org — سورة الأحقاف (1-12، 13-14، 15-16، 17-20، 21-28، 29-32، 33-35)
map:
- title:
    ar: القدرة ومناقشة المشركين
    en: Power; Arguing the Deniers
    tr: Çoktanrıcıların gücü ve tartışması
    id: Kekuasaan dan diskusi tentang para politeis
  range:
  - 1
  - 12
  family: faith
  summary:
    ar: حم؛ تنزيل الكتاب من الله العزيز الحكيم؛ ما خلقنا السماوات والأرض إلا بالحق؛ قل ما كنت بدعا من الرسل؛ وشهد شاهد من بني إسرائيل.
    en: 'Ha-Mim; the Book''s sending down from God, the Mighty, the Wise; We created the heavens and earth only in truth; say: I am no novelty among messengers — and a witness from the Children of Israel
      testified.'
    tr: Hum; Yüce ve Bilgin Allah'tan Kitap'ın indirilişidir; gökleri ve yeryüzü ancak doğru olarak yarattık; de ki, 'Sen peygamberler arasında yenilik kaynağı değildin.' Ve İsrailoğullarından gelen bir
      şahitlik de bir şahitliktir.
    id: Hmm; wahyu Kitab dari Allah, Yang Maha Kuasa, Yang Bijaksana; Kami tidak menciptakan langit dan bumi kecuali dalam kebenaran; katakanlah, 'Engkau bukanlah sumber inovasi di antara para rasul.' Dan
      kesaksian dari Anak-anak Israel adalah saksi.
  children:
  - title:
      ar: تنزيل الكتاب
      en: The Sending Down of the Book
      tr: Kitabı indir
      id: Unduh bukunya
    range:
    - 1
    - 3
  - title:
      ar: شاهد من بني إسرائيل
      en: A Witness from Israel
      tr: İsrailoğulları'ndan bir tanık
      id: Sebuah kesaksian dari Anak-anak Israel
    range:
    - 10
    - 10
- title:
    ar: جزاء المستقيمين
    en: The Reward of the Steadfast
    tr: Doğruların Ödülü
    id: Hadiah dari Orang Yang Berdiri
  range:
  - 13
  - 14
  family: faith
  summary:
    ar: إن الذين قالوا ربنا الله ثم استقاموا فلا خوف عليهم ولا هم يحزنون أولئك أصحاب الجنة خالدين فيها جزاء بما كانوا يعملون.
    en: 'Those who say: our Lord is God, then remain steadfast — no fear on them, nor shall they grieve; companions of the Garden, abiding, a reward for what they did.'
    tr: Gerçekten de, 'Rabbimiz Allah'tır diyenler, sonra da sadık kalanlar, onlardan korkmazlar ve üzülmezler. Bunlar, yaptıklarının karşılığında orada sonsuza dek kalan cennetin sahabeleridir.
    id: Memang, mereka yang berkata, 'Tuhan kami adalah Allah' lalu tetap teguh, tidak akan ada rasa takut terhadap mereka, dan mereka tidak akan berduka. Mereka adalah sahabat Surga, yang tinggal selamanya
      sebagai ganjaran atas apa yang mereka lakukan.
  children: []
- title:
    ar: الوصية بالوالدين
    en: The Charge Toward Parents
    tr: Ebeveyn Vasiyeti
    id: Wasiat Orang Tua
  range:
  - 15
  - 16
  family: law
  summary:
    ar: ووصينا الإنسان بوالديه إحسانا حملته أمه كرها ووضعته كرها؛ حتى إذا بلغ أشده وبلغ أربعين سنة قال رب أوزعني أن أشكر نعمتك.
    en: 'We charged man with kindness to his parents — his mother bore him in hardship and bore him in hardship; at forty he says: my Lord, enable me to thank Your favor.'
    tr: Ve insana, annesinin isteksizce taşıdığı ve isteksizce doğurduğu ebeveynlerine iyi davranmasını emredik; ta ki olgunluğa ve kırk yaşına geldiğinde, 'Efendim, bereketin için minnettar olmamı bana
      ver.' der.
    id: Dan Kami telah memerintahkan manusia untuk berbuat baik kepada orang tuanya, yang ibunya lahirkan tanpa rela; sampai ketika ia dewasa dan berusia empat puluh tahun, ia berkata, 'Tuhanku, berikanlah
      aku bersyukur atas berkat-Mu.'
  children:
  - title:
      ar: بلوغ الأربعين
      en: Reaching Forty
      tr: Kırkına girmek
      id: Memasuki usia empat puluh
    range:
    - 15
    - 15
- title:
    ar: جزاء العاق
    en: The Reward of the Ungrateful
    tr: Maluliyet cezası
    id: Denda untuk cacat
  range:
  - 17
  - 20
  family: faith
  summary:
    ar: والذي قال لوالديه أف لكما أتعدانني أن أخرج؛ ويوم يعرض الذين كفروا على النار أذهبتم طيباتكم في حياتكم الدنيا.
    en: 'One who says to his parents: fie on you, do you promise me I shall be brought out; on the Day deniers are exposed to the Fire: you consumed your good things in your worldly life.'
    tr: Ve o da ebeveynlerine dedi ki, 'Vay halinize be, bana kovulacağıma söz veriyor musunuz?' Ve inanmayanların ateşe maruz kalacağı gün, dünyevi hayatınızdaki iyi işlerinizi kaybetmiş olacaksınız.
    id: Dan Dia berkata kepada orang tuanya, 'Celakalah kalian, apakah kalian berjanji kepada-Ku bahwa aku akan diusir?' Dan pada hari mereka yang tidak percaya akan terpapar Api, kalian akan kehilangan
      perbuatan baik dalam kehidupan duniawi.
  children: []
- title:
    ar: قصة هود
    en: The Story of Hud
    tr: Hood'un Hikayesi
    id: Kisah Hood
  range:
  - 21
  - 28
  family: stories
  summary:
    ar: واذكر أخا عاد إذ أنذر قومه بالأحقاف؛ فلما رأوه عارضا مستقبل أوديتهم قالوا هذا عارض ممطرنا؛ بل هو ما استعجلتم به ريح فيها عذاب أليم.
    en: 'Remember the brother of ''Ad when he warned his people at al-Ahqaf; when they saw a cloud approaching their valleys they said: a cloud bringing rain — rather, it is what you hastened: a wind with
      painful torment.'
    tr: 'Ve Ad kardeşi, halkını Akkaf hakkında uyardığında hatırla; onu vadilerine yaklaşırken görünce dediler: ''Bu yağmurlu bir rüzgardır; sen ise acı bir cezayla bir rüzgarı hızlandırdın.'''
    id: Dan ingat saudara 'Ad ketika dia memperingatkan kaumnya tentang Aqqaf; ketika mereka melihat dia mendekati lembah-lembah mereka, mereka berkata, 'Ini adalah angin yang basah oleh hujan; sebaliknya,
      kamu mempercepat angin dengan hukuman yang menyakitkan.'
  children:
  - title:
      ar: عارض ممطرنا
      en: '"A Cloud Bringing Rain"'
      tr: Yağmur fırtınası
      id: Hujan Badai
    range:
    - 24
    - 26
- title:
    ar: إيمان الجن
    en: The Belief of the Jinn
    tr: İman El-Cin
    id: Iman Al-Jinn
  range:
  - 29
  - 32
  family: stories
  summary:
    ar: وإذ صرفنا إليك نفرا من الجن يستمعون القرآن فلما حضروه قالوا أنصتوا؛ فلما قضي ولوا إلى قومهم منذرين؛ قالوا يا قومنا أجيبوا داعي الله.
    en: 'When We turned toward you a company of jinn listening to the Quran, they said: be silent; when it was done they returned to their people as warners — saying: our people, answer God''s caller.'
    tr: 'Ve biz size Kur''an''ı dinleyen bir grup cin''i gönderdiğimizde, oradayken: ''Dinleyin.'' dediler. Ferman tamamlandığında, halkına uyarı olarak döndüler; dediler ki, ''Ey halkımız, Allah''ın çağrısına
      cevap verin.'''
    id: Dan ketika Kami mengirim sekelompok jin yang mendengarkan Al-Qur'an, ketika mereka hadir, mereka berkata, 'Dengarkan.' Dan ketika titah itu selesai, mereka berbalik kepada umatnya sebagai peringatan;
      mereka berkata, 'Wahai umat kami, terimalah seruan Allah.'
  children:
  - title:
      ar: استماع الجن
      en: The Jinn Listen
      tr: Cin Dinlemek
      id: Mendengarkan Jin
    range:
    - 29
    - 30
  - title:
      ar: أجيبوا داعي الله
      en: '"Answer God''s Caller"'
      tr: Tanrı'nın duasına cevap ver
      id: Jawab doa Tuhan
    range:
    - 31
    - 32
- title:
    ar: إثبات البعث
    en: Establishing Resurrection
    tr: Baas Kanıtı
    id: Bukti Baath
  range:
  - 33
  - 35
  family: faith
  summary:
    ar: أولم يروا أن الله الذي خلق السماوات والأرض ولم يعي بخلقهن بقادر على أن يحيي الموتى؛ فاصبر كما صبر أولو العزم من الرسل.
    en: Do they not see that God, who created the heavens and earth and did not tire of their creation, is able to give life to the dead; so be patient as the resolute messengers were patient.
    tr: Gökleri ve yeryüzü yaratan ve onların yaratılışından habersiz olan Allah'ın ölülere hayat verebileceğini görmediler mi? O halde, kararlı elçilerin sabırlı olduğu gibi sabırlı olun.
    id: Apakah mereka tidak melihat bahwa Allah, yang menciptakan langit dan bumi tanpa mengetahui ciptaan mereka, mampu memberi kehidupan kepada orang mati? Jadi bersabarlah seperti para utusan tekad juga
      sabar.
  children:
  - title:
      ar: فاصبر كما صبر أولو العزم
      en: Be Patient as the Resolute Were
      tr: O yüzden kararlılar sabırlı olduğu gibi sabırlı olun
      id: Jadi bersabarlah seperti mereka yang bertekad juga sabar
    range:
    - 35
    - 35
