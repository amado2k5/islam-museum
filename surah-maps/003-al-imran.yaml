- title:
    ar: 'الخاتمة: التذكير والدعاء'
    en: 'Closing: Reminder and Supplication'
    tr: 'Sonuç: Hatırlatma ve Dua'
    id: 'Kesimpulan: Pengingat dan Doa'
  range:
  - 180
  - 200
  family: faith
  summary:
    ar: 'خلاصة السورة: ذم البخل والغرور بالدنيا، ودعاء أولي الألباب المستجاب، والوصية بالصبر والمرابطة.'
    en: 'The surah''s recapitulation: miserliness and worldly delusion condemned, the answered supplication of the wise, and the charge to persevere.'
    tr: 'Surenin özeti: Bu dünyada cimrilik ve kibri kınamak, anlayış sahiplerinin duasının kabul edilmesi ve sabır ile kararlılık öğüdü.'
    id: 'Ringkasan surat: Mengutuk kepelitan dan kesombongan di dunia ini, doa orang yang memahami dijawab, dan nasihat untuk kesabaran dan keteguhan.'
  children:
