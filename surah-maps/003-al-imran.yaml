- title:
    ar: الحوار مع أهل الكتاب
    en: Dialogue with the People of the Book
    tr: Kitap İnsanlarıyla Diyalog
    id: Dialog dengan Orang-Orang dalam Buku
  range:
  - 64
  - 99
  family: faith
  summary:
    ar: دعوتهم إلى الكلمة السواء، وكشف تحريفهم الكتاب وغلوهم، مع الثناء على الصادقين منهم.
    en: Calling them to a common word; exposing their distortion of scripture and excesses, while praising the sincere among them.
    tr: Ortak kelimeye seslendiler, Kitabı çarpıttıklarını ve aşırılıklarını ortaya çıkardılar, aralarındaki doğruları övdüler.
    id: Mereka memanggil kata-kata umum, mengungkap distorsi mereka terhadap Kitab dan ekstremisme mereka, sambil memuji yang benar di antara mereka.
