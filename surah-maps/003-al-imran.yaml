  - 179
  family: faith
  summary:
    ar: سنن النصر والهزيمة، ولين النبي وشوراه، وأن الشهداء أحياء عند ربهم يرزقون.
    en: The laws of victory and defeat, the Prophet's gentleness and consultation, and the martyrs alive with their Lord.
    tr: Zafer ve yenilgi yasaları, Peygamber'in yumuşaklığı ve danışma ile şehitlerin Rableriyle birlikte yaşaması ve erzak alması gerçeği.
    id: Hukum kemenangan dan kekalahan, kelembutan dan konsultasi Nabi, serta fakta bahwa para martir hidup bersama Tuhan mereka dan menerima perkelahian.
