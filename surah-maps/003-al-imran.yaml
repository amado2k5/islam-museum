map:
- title:
    ar: التوحيد والدين الحق
    en: Tawhid and the True Religion
    tr: Tek Tanrıcılık ve Hakikat Dini
    id: Monoteisme dan Agama Kebenaran
  range:
  - 1
  - 32
  family: faith
  summary:
    ar: إثبات التوحيد وصدق القرآن المصدق لما قبله، وأن الدين عند الله الإسلام، مع تحذير الكافرين.
    en: Affirming divine oneness and the Quran confirming earlier scriptures; Islam as Allah's religion, with warning to disbelievers.
    tr: Tek tanrıcılığı ve Kur'an'ın doğruluğunu onaylayarak, öncekileri doğrulayarak, Allah'tan önceki dinin İslam olduğunu ve kâfirleri uyardığını belirtir.
    id: Menegaskan monoteisme dan kebenaran Al-Qur'an yang menegaskan apa yang terjadi sebelumnya, dan bahwa agama di hadapan Allah adalah Islam, sambil memperingatkan kaum kafir.
