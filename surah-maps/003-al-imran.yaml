- title:
    ar: 'آل عمران: مريم وعيسى'
    en: 'The Family of Imran: Mary and Jesus'
    tr: 'El-İmran: Meryem ve İsa'
    id: 'Al-Imran: Maryam dan Isa'
  range:
  - 33
  - 63
  family: stories
  summary:
    ar: 'اصطفاء آل عمران: نذر امرأة عمران، وكفالة زكريا لمريم، وبشرى يحيى وعيسى، والرد على نصارى نجران.'
    en: 'The choosing of Imran''s family: Mary''s dedication, Zakariya''s care, the tidings of John and Jesus, and the answer to Najran''s Christians.'
    tr: 'İmran ailesinin seçimi: İmran''ın eşinin yemini, Zakariya''nın Meryem''e sponsorluğu, Yahya ve İsa''nın müjdesi ve Necran Hristiyanlarının reddi.'
    id: 'Pemilihan keluarga Imran: janji istri Imran, dukungan Zakariya terhadap Maria, kabar gembira Yahya dan Yesus, serta penolakan umat Kristen Najran.'
