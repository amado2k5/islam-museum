- title:
    ar: الأمة الوسط وابتلاء أحد
    en: The Middle Nation and the Trial of Uhud
    tr: Orta ulus ve birinin derdi
    id: Bangsa tengah dan penderitaan seseorang
  range:
  - 109
  - 148
  family: faith
  summary:
    ar: 'خيرية الأمة الآمرة بالمعروف، وأن أهل الكتاب ليسوا سواء، ثم الانتقال إلى أحد: الابتلاء والتمحيص.'
    en: The virtue of the nation enjoining good; the People of the Book are not all alike; then Uhud — trial and sifting.
    tr: 'Ulusun iyiliği iyiliği emreder ve Kitap Ahli''nin eşit olmadığı, sonra bunlardan birine geçelim: test ve inceleme.'
    id: 'Kebaikan bangsa yang mewajibkan kebaikan, dan bahwa Orang-orang Kitab tidak setara, lalu beralih ke salah satunya: pengujian dan pengawasan.'
