- title:
    ar: 'التحذير المركزي: لا تطيعوهم'
    en: The Central Warning
    tr: 'Merkezi uyarı: Onlara uymayın'
    id: 'Peringatan utama: Jangan patuhi'
  range:
  - 100
  - 108
  family: faith
  summary:
    ar: 'قلب السورة ورسالتها المركزية: إن تطيعوا فريقا من أهل الكتاب يردوكم بعد إيمانكم كافرين.'
    en: 'The surah''s heart and central message: obeying a faction of the People of the Book would turn believers back to disbelief.'
    tr: 'Surenin kalbi ve temel mesajı: Kutsal Kitap Ahlâhi''nin bir grubuna itaat ederseniz, sizi inançınızdan sonra kâfir olarak geri döndürürler.'
    id: 'Inti dari surah dan pesan utamanya: Jika kamu taat pada kelompok umat Kitab Suci, mereka akan membalikkan iman kamu sebagai orang kafir.'
  children:
  - title:
