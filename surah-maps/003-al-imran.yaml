map:
  - title: { ar: "التوحيد والدين الحق", en: "Tawhid and the True Religion" }
    range: [1, 32]
    family: faith
    summary:
      ar: "إثبات التوحيد وصدق القرآن المصدق لما قبله، وأن الدين عند الله الإسلام، مع تحذير الكافرين."
      en: "Affirming divine oneness and the Quran confirming earlier scriptures; Islam as Allah's religion, with warning to disbelievers."
    children:
      - { title: { ar: "المحكم والمتشابه", en: "Clear and Ambiguous Verses" }, range: [7, 7] }
      - { title: { ar: "دعاء الراسخين في العلم", en: "Supplication of the Learned" }, range: [8, 9] }
      - { title: { ar: "شهادة التوحيد", en: "The Testimony of Oneness" }, range: [18, 18] }
      - { title: { ar: "إن الدين عند الله الإسلام", en: "Islam Is Allah's Religion" }, range: [19, 20] }
      - { title: { ar: "قل اللهم مالك الملك", en: "Sovereignty Belongs to Allah" }, range: [26, 27] }
  - title: { ar: "آل عمران: مريم وعيسى", en: "The Family of Imran: Mary and Jesus" }
    range: [33, 63]
    family: stories
    summary:
      ar: "اصطفاء آل عمران: نذر امرأة عمران، وكفالة زكريا لمريم، وبشرى يحيى وعيسى، والرد على نصارى نجران."
      en: "The choosing of Imran's family: Mary's dedication, Zakariya's care, the tidings of John and Jesus, and the answer to Najran's Christians."
    children:
      - { title: { ar: "نذر امرأة عمران", en: "The Vow of Imran's Wife" }, range: [35, 37] }
      - { title: { ar: "دعاء زكريا وبشرى يحيى", en: "Zakariya's Prayer, John's Tidings" }, range: [38, 41] }
      - { title: { ar: "البشارة بعيسى", en: "The Annunciation of Jesus" }, range: [42, 47] }
      - { title: { ar: "رفع عيسى", en: "The Raising of Jesus" }, range: [55, 55] }
      - { title: { ar: "مثل عيسى كمثل آدم", en: "Jesus Like Adam" }, range: [59, 59] }
      - { title: { ar: "المباهلة", en: "The Mutual Imprecation" }, range: [61, 61] }
  - title: { ar: "الحوار مع أهل الكتاب", en: "Dialogue with the People of the Book" }
    range: [64, 99]
    family: faith
    summary:
      ar: "دعوتهم إلى الكلمة السواء، وكشف تحريفهم الكتاب وغلوهم، مع الثناء على الصادقين منهم."
      en: "Calling them to a common word; exposing their distortion of scripture and excesses, while praising the sincere among them."
    children:
      - { title: { ar: "الكلمة السواء", en: "The Common Word" }, range: [64, 64] }
      - { title: { ar: "تحريف الكتاب", en: "Distorting the Scripture" }, range: [78, 78] }
      - { title: { ar: "لا نفرق بين أحد من رسله", en: "No Distinction Among Messengers" }, range: [84, 84] }
      - { title: { ar: "لن تنالوا البر", en: "You Will Not Attain Righteousness" }, range: [92, 92] }
      - { title: { ar: "أول بيت وضع للناس", en: "The First House for Mankind" }, range: [96, 97] }
  - title: { ar: "التحذير المركزي: لا تطيعوهم", en: "The Central Warning" }
    range: [100, 108]
    family: faith
    summary:
      ar: "قلب السورة ورسالتها المركزية: إن تطيعوا فريقا من أهل الكتاب يردوكم بعد إيمانكم كافرين."
      en: "The surah's heart and central message: obeying a faction of the People of the Book would turn believers back to disbelief."
    children:
      - { title: { ar: "اتقوا الله حق تقاته", en: "Fear Allah as He Should Be Feared" }, range: [102, 102] }
      - { title: { ar: "واعتصموا بحبل الله", en: "Hold to Allah's Rope" }, range: [103, 103] }
  - title: { ar: "الأمة الوسط وابتلاء أحد", en: "The Middle Nation and the Trial of Uhud" }
    range: [109, 148]
    family: faith
    summary:
      ar: "خيرية الأمة الآمرة بالمعروف، وأن أهل الكتاب ليسوا سواء، ثم الانتقال إلى أحد: الابتلاء والتمحيص."
      en: "The virtue of the nation enjoining good; the People of the Book are not all alike; then Uhud — trial and sifting."
    children:
      - { title: { ar: "كنتم خير أمة", en: "You Are the Best Nation" }, range: [110, 110] }
      - { title: { ar: "ليسوا سواء", en: "They Are Not All Alike" }, range: [113, 115] }
      - { title: { ar: "غزوة أحد", en: "The Battle of Uhud" }, range: [121, 123] }
      - { title: { ar: "صفات المتقين", en: "Traits of the God-Conscious" }, range: [133, 136] }
      - { title: { ar: "ولا تهنوا", en: "Do Not Weaken" }, range: [139, 139] }
      - { title: { ar: "وما محمد إلا رسول", en: "Muhammad Is But a Messenger" }, range: [144, 144] }
  - title: { ar: "دروس أحد", en: "Lessons of Uhud" }
    range: [149, 179]
    family: faith
    summary:
      ar: "سنن النصر والهزيمة، ولين النبي وشوراه، وأن الشهداء أحياء عند ربهم يرزقون."
      en: "The laws of victory and defeat, the Prophet's gentleness and consultation, and the martyrs alive with their Lord."
    children:
      - { title: { ar: "الأمنة بعد الغم", en: "Reassurance After Grief" }, range: [154, 154] }
      - { title: { ar: "الشورى واللين", en: "Consultation and Gentleness" }, range: [159, 159] }
      - { title: { ar: "إن ينصركم الله", en: "If Allah Helps You" }, range: [160, 160] }
      - { title: { ar: "الشهداء أحياء", en: "The Martyrs Are Alive" }, range: [169, 171] }
  - title: { ar: "الخاتمة: التذكير والدعاء", en: "Closing: Reminder and Supplication" }
    range: [180, 200]
    family: faith
    summary:
      ar: "خلاصة السورة: ذم البخل والغرور بالدنيا، ودعاء أولي الألباب المستجاب، والوصية بالصبر والمرابطة."
      en: "The surah's recapitulation: miserliness and worldly delusion condemned, the answered supplication of the wise, and the charge to persevere."
    children:
      - { title: { ar: "كل نفس ذائقة الموت", en: "Every Soul Tastes Death" }, range: [185, 185] }
      - { title: { ar: "الابتلاء والصبر", en: "Trial and Patience" }, range: [186, 186] }
      - { title: { ar: "دعاء أولي الألباب", en: "Supplication of the Wise" }, range: [190, 194] }
      - { title: { ar: "فاستجاب لهم ربهم", en: "Their Lord Answered Them" }, range: [195, 195] }
      - { title: { ar: "اصبروا وصابروا ورابطوا", en: "Persevere and Hold Firm" }, range: [200, 200] }
