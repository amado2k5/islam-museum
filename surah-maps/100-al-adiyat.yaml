map:
- title:
    ar: العاديات
    en: The Charging Horses
    tr: Sıradan Alışkanlıklar
    id: Kebiasaan Biasa
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'والعاديات ضبحا فالموريات قدحا فالمغيرات صبحا فأثرن به نقعا فوسطن به جمعا: مشهد الغارة.'
    en: By the panting chargers striking sparks of fire, raiding at dawn, raising dust and driving into the midst — the battle scene.
    tr: '''Adiyat'' bir kılıçtır, sonra Murayyat bir kupadır, Murayyat ise sabah olur, bu yüzden onu bir ıslatmada bekletirler ve çoğuldur: baskının gerçekleştiği sahne.'
    id: 'Dan ''Adiyat'' adalah pedang, lalu Murayyat adalah cawan, dan Mughayyat di pagi hari, jadi mereka merendamnya dalam rendaman, dan mereka jamak: tempat terjadinya serangan.'
  children: []
- title:
    ar: كنود الإنسان
    en: Man's Ingratitude
    tr: İnsan Kodları
    id: Kode Manusia
  range:
  - 6
  - 11
  family: faith
  summary:
    ar: 'إن الإنسان لربه لكنود وإنه على ذلك لشهيد وإنه لحب الخير لشديد: أفلا يعلم إذا بعثر ما في القبور وحصل ما في الصدور.'
    en: Man is ungrateful to his Lord — a witness to it himself — fierce in his love of wealth; does he not know when graves are overturned and breasts laid bare?
    tr: Gerçekten de insan, Rabbine keder içinde bağlıdır, gerçekten de bunun şahididir ve gerçekten iyiliği güçlü bir şekilde sever. Mezarlarda ne varsa ne zaman dağılıp sandıklardakilerin ne zaman gerçekleştiğini
      bilmiyor mu?
    id: Memang, manusia bagi Tuhannya sedang berduka, dan memang dia adalah saksi akan hal itu, dan memang, dia adalah pecinta yang kuat akan kebaikan. Apakah dia tidak tahu kapan apa yang ada di dalam
      kubur tersebar dan apa yang ada di peti itu terpenuhi?
  children: []
