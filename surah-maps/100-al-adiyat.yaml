map:
  - title: { ar: "العاديات", en: "The Charging Horses" }
    range: [1, 5]
    family: faith
    summary:
      ar: "والعاديات ضبحا فالموريات قدحا فالمغيرات صبحا فأثرن به نقعا فوسطن به جمعا: مشهد الغارة."
      en: "By the panting chargers striking sparks of fire, raiding at dawn, raising dust and driving into the midst — the battle scene."
    children: []
  - title: { ar: "كنود الإنسان", en: "Man's Ingratitude" }
    range: [6, 11]
    family: faith
    summary:
      ar: "إن الإنسان لربه لكنود وإنه على ذلك لشهيد وإنه لحب الخير لشديد: أفلا يعلم إذا بعثر ما في القبور وحصل ما في الصدور."
      en: "Man is ungrateful to his Lord — a witness to it himself — fierce in his love of wealth; does he not know when graves are overturned and breasts laid bare?"
    children: []
