- title:
    ar: قصص نوح وموسى
    en: The Stories of Noah and Moses
    tr: Nuh ve Musa'nın hikayeleri
    id: Kisah Nuh dan Musa
  range:
  - 71
  - 93
  family: stories
  summary:
    ar: 'قصتا نوح وموسى: التكذيب، والسحرة، ونجاة المؤمنين وغرق فرعون حين أدركه الغرق.'
    en: 'Noah and Moses: denial, the magicians, the believers saved and Pharaoh drowned as the waters closed.'
    tr: 'Nuh ve Musa''nın hikayeleri: inkâr, büyücüler, inananların kurtuluşu ve Firavun''un ona yetiştiğinde boğulması.'
    id: 'Kisah Nuh dan Musa: penyangkalan, para penyihir, keselamatan orang beriman, dan tenggelamnya Firaun ketika ia mengejarnya.'
