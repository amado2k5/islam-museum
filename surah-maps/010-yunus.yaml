- title:
    ar: قوم يونس والخاتمة
    en: The People of Yunus and the Closing
    tr: Yunus halkı ve sonuç
    id: Orang-orang Yunus dan kesimpulannya
  range:
  - 94
  - 109
  family: faith
  summary:
    ar: 'القرية الوحيدة التي آمنت فنفعها إيمانها: قوم يونس، ثم الأمر بالثبات على الدين القيم والتوكل على الله.'
    en: The one town whose faith benefited it — the people of Yunus — then the command to hold firm and trust Allah.
    tr: İnancından faydalanan ve inancından faydalanan tek köy, o dönemde doğru dine bağlı kalma ve Tanrı'ya güvenme emri verilen Yunus halkıydı.
    id: Satu-satunya desa yang percaya dan mendapat manfaat dari imannya adalah rakyat Yunus, yang saat itu diperintahkan untuk tetap teguh dalam agama yang benar dan bergantung pada Tuhan.
  children:
  - title:
      ar: إيمان قوم يونس
      en: The Faith of Yunus's People
      tr: Yunus halkının inancı
      id: Iman rakyat Yunus
    range:
    - 98
    - 98
