surah: 10
slug: yunus
sources_consulted:
- 'kuttab.com — Surah Yunus mind map (4 blocks: 1-33, 34-70, 71-93, 94-109)'
- Standard thematic/ruku divisions (cross-checked)
map:
- title:
    ar: التعجب من الوحي ودلائل القدرة
    en: Wonder at Revelation and Signs of Power
    tr: Vahiy ve Güç Belirtileri Üzerine Merak Etmek
    id: Bertanya-tanya pada Wahyu dan Tanda-tanda Kekuatan
  range:
  - 1
  - 33
  family: faith
  summary:
    ar: افتتاح بالتعجب من إيحاء الله إلى رجل منهم، ثم دلائل القدرة في الخلق والتدبير، وأحوال الإنسان في الضراء والسراء.
    en: Opens at wonder that a man among them was inspired, then signs of power in creation, and man's state in hardship and ease.
    tr: Tanrı'nın onlardan birine vahyine duyulan hayranlıkla başlar, ardından yaratılış ve yönetimdeki güç işaretleriyle ve insanların zorluk ve refah içindeki durumlarıyla başlar.
    id: Cerita dimulai dengan kekaguman atas wahyu Tuhan kepada salah satu dari mereka, lalu tanda-tanda kekuatan dalam penciptaan dan pengelolaan, serta keadaan manusia dalam kesulitan dan kemakmuran.
  children:
  - title:
      ar: مثل الحياة الدنيا
      en: The Parable of Worldly Life
      tr: Bu dünyanın hayatı gibi
      id: Seperti kehidupan dunia ini
    range:
    - 24
    - 24
  - title:
      ar: دار السلام
      en: The Home of Peace
      tr: Dar es Salaam
      id: Dar es Salaam
    range:
    - 25
    - 26
- title:
    ar: إثبات الوحي والرد على المشركين
    en: Establishing Revelation, Answering the Polytheists
    tr: Vahiyin Kanıtlanması ve Çoktanrılıların Çürütülmesi
    id: Membuktikan Wahyu dan Membantah para Politeis
  range:
  - 34
  - 70
  family: faith
  summary:
    ar: 'محاجة المشركين: من يرزقكم ومن يدبر الأمر، وتحدي الإتيان بسورة مثله، وبيان أن القرآن شفاء لما في الصدور.'
    en: 'Arguing the polytheists: who provides and governs; the challenge to produce a surah like it; the Quran as healing.'
    tr: 'Putperestlerin argümanı: Kim size bakıyor, kim işleri yönetiyor, böyle bir sureyi getirme zorluğu ve Kur''an''ın kalplerdeki şifa olduğunu açıklamak.'
    id: 'Argumen para politeis: Siapa yang menyediakan untukmu dan siapa yang mengatur urusan, tantangan membawa surah seperti itu, dan memperjelas bahwa Al-Qur''an adalah penyembuhan bagi apa yang ada
      di hati.'
  children:
  - title:
      ar: شفاء لما في الصدور
      en: Healing for the Breasts
      tr: Sandıklarda olanlar için şifa
      id: Penyembuhan untuk apa yang ada di peti
    range:
    - 57
    - 57
  - title:
      ar: فضل الله ورحمته
      en: Allah's Bounty and Mercy
      tr: Tanrı'nın lütfu ve merhameti
      id: Kasih karunia dan belas kasihan Tuhan
