surah: 10
slug: yunus
sources_consulted:
  - "kuttab.com — Surah Yunus mind map (4 blocks: 1-33, 34-70, 71-93, 94-109)"
  - "Standard thematic/ruku divisions (cross-checked)"
map:
  - title: { ar: "التعجب من الوحي ودلائل القدرة", en: "Wonder at Revelation and Signs of Power" }
    range: [1, 33]
    family: faith
    summary:
      ar: "افتتاح بالتعجب من إيحاء الله إلى رجل منهم، ثم دلائل القدرة في الخلق والتدبير، وأحوال الإنسان في الضراء والسراء."
      en: "Opens at wonder that a man among them was inspired, then signs of power in creation, and man's state in hardship and ease."
    children:
      - { title: { ar: "مثل الحياة الدنيا", en: "The Parable of Worldly Life" }, range: [24, 24] }
      - { title: { ar: "دار السلام", en: "The Home of Peace" }, range: [25, 26] }
  - title: { ar: "إثبات الوحي والرد على المشركين", en: "Establishing Revelation, Answering the Polytheists" }
    range: [34, 70]
    family: faith
    summary:
      ar: "محاجة المشركين: من يرزقكم ومن يدبر الأمر، وتحدي الإتيان بسورة مثله، وبيان أن القرآن شفاء لما في الصدور."
      en: "Arguing the polytheists: who provides and governs; the challenge to produce a surah like it; the Quran as healing."
    children:
      - { title: { ar: "شفاء لما في الصدور", en: "Healing for the Breasts" }, range: [57, 57] }
      - { title: { ar: "فضل الله ورحمته", en: "Allah's Bounty and Mercy" }, range: [58, 58] }
  - title: { ar: "قصص نوح وموسى", en: "The Stories of Noah and Moses" }
    range: [71, 93]
    family: stories
    summary:
      ar: "قصتا نوح وموسى: التكذيب، والسحرة، ونجاة المؤمنين وغرق فرعون حين أدركه الغرق."
      en: "Noah and Moses: denial, the magicians, the believers saved and Pharaoh drowned as the waters closed."
    children:
      - { title: { ar: "نوح وقومه", en: "Noah and His People" }, range: [71, 73] }
      - { title: { ar: "إيمان السحرة", en: "The Magicians Believe" }, range: [77, 82] }
      - { title: { ar: "غرق فرعون", en: "Pharaoh's Drowning" }, range: [90, 92] }
  - title: { ar: "قوم يونس والخاتمة", en: "The People of Yunus and the Closing" }
    range: [94, 109]
    family: faith
    summary:
      ar: "القرية الوحيدة التي آمنت فنفعها إيمانها: قوم يونس، ثم الأمر بالثبات على الدين القيم والتوكل على الله."
      en: "The one town whose faith benefited it — the people of Yunus — then the command to hold firm and trust Allah."
    children:
      - { title: { ar: "إيمان قوم يونس", en: "The Faith of Yunus's People" }, range: [98, 98] }
