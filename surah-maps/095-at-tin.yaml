    range: [5, 8]
    family: faith
    summary:
      ar: "ثم رددناه أسفل سافلين إلا الذين آمنوا وعملوا الصالحات فلهم أجر غير ممنون، أليس الله بأحكم الحاكمين."
      en: "Then We returned him to the lowest of the low — except those who believed and did righteous deeds; is Allah not the most just of judges?"
