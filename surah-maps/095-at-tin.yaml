map:
- title:
    ar: أحسن تقويم
    en: The Best Stature
    tr: En iyi takvim
    id: Kalender terbaik
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: 'والتين والزيتون وطور سينين وهذا البلد الأمين: لقد خلقنا الإنسان في أحسن تقويم.'
    en: 'By the fig, the olive, Mount Sinai, and this secure city: We created man in the finest stature.'
    tr: 'Ve incirler, zeytinler, Sina Dağı ve bu güvenli toprak: İnsanı en iyi takvimde yarattık.'
    id: 'Dan buah ara dan zaitun, dan Gunung Sinai, dan tanah aman ini: Kami menciptakan manusia dalam kalender terbaik.'
  children: []
- title:
    ar: أسفل سافلين
    en: The Lowest of the Low
    tr: Dipin Altı
    id: Dasar dari Dasar
  range:
  - 5
  - 8
  family: faith
  summary:
    ar: ثم رددناه أسفل سافلين إلا الذين آمنوا وعملوا الصالحات فلهم أجر غير ممنون، أليس الله بأحكم الحاكمين.
    en: Then We returned him to the lowest of the low — except those who believed and did righteous deeds; is Allah not the most just of judges?
    tr: Sonra onu en alt tabakaların altına geri verdik, sadece iman edenler ve doğru işler yapanlar hariç, onlara nankör olmayan bir ödül verilir. Allah en adil yargıç değil midir?
    id: Kemudian Kami mengembalikannya ke bawah pangkat terendah, kecuali bagi mereka yang beriman dan berbuat adil, dan bagi mereka ada ganjaran yang tidak tidak bersyukur. Bukankah Allah adalah hakim
      yang paling adil?
