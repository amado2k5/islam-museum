    range:
    - 5
    - 9
  - title:
      ar: الأرض للأنام
      en: The Earth for Creatures
      tr: Toprak insanlar içindir
      id: Tanah itu untuk manusia
    range:
    - 10
    - 12
  - title:
      ar: خلق الإنسان والجان
      en: Creating Man and Jinn
      tr: İnsan ve cinlerin yaratılışı
      id: Penciptaan manusia dan jin
    range:
    - 14
    - 16
- title:
    ar: المشرقان والبحران
    en: The Two Easts and the Two Seas
    tr: El-Meşriqan ve El-Buhran
    id: Al-Mashriqan dan Al-Buhran
  range:
  - 17
  - 25
  family: faith
  summary:
    ar: رب المشرقين ورب المغربين، ومرج البحرين يلتقيان بينهما برزخ لا يبغيان، يخرج منهما اللؤلؤ والمرجان، وله الجوار المنشآت في البحر كالأعلام.
    en: Lord of the two easts and Lord of the two wests; He let the two seas meet, between them a barrier they do not transgress; from them come pearl and coral; His are the lofty ships in the sea like
      landmarks.
    tr: Doğuların Efendisi ve Batıların Lordu ile denizin çayırı, inciler ve mercanların çıktığı, denizde sancırlar gibi yapılar olan dokunulmamış bir Barzakh ile buluşur.
    id: Tuan Timur dan Penguasa Barat, serta padang rumput laut, bertemu dengan Barzakh yang belum tersentuh dari mana mutiara dan karang muncul, dan tetangganya adalah struktur di laut seperti panji-panji.
  children:
  - title:
      ar: رب المشرقين والمغربين
      en: Lord of the Two Easts and Wests
      tr: Doğu ve Batı'nın Lordu
      id: Penguasa Timur dan Barat
    range:
    - 17
    - 18
  - title:
      ar: مرج البحرين
      en: The Meeting of the Two Seas
      tr: Marj Al Bahreyn
      id: Marj Al Bahrain
    range:
    - 19
    - 23
  - title:
      ar: الجوار في البحر
      en: The Ships at Sea
      tr: Deniz kenarındaki mahalle
      id: Lingkungan di laut
    range:
    - 24
    - 25
- title:
    ar: الفناء ويوم الجزاء
    en: Perishing and the Day of Recompense
    tr: Yok Etme ve Ceza Günü
    id: Hari Pemusnahan dan Hukuman
  range:
  - 26
  - 45
  family: faith
  summary:
    ar: 'كل من عليها فان ويبقى وجه ربك ذو الجلال والإكرام، يسأله من في السماوات والأرض كل يوم هو في شأن، ثم خطاب الثقلين: يا معشر الجن والإنس لا تنفذون إلا بسلطان، فإذا انشقت السماء فكانت وردة كالدهان،
      ويعرف المجرمون بسيماهم: هذه جهنم التي يكذب بها المجرمون.'
    en: 'All upon it perish, and your Lord''s Face of majesty and honor remains; all in the heavens and earth ask Him, each day He is in a matter; then the address to the two weighty beings: O assembly
      of jinn and men, you pass not except by authority; when the sky splits and becomes rose-red like ointment; the criminals known by their marks: this is Hell the criminals denied.'
    tr: 'Üzerindeki herkes yok olacak ve Efendi, Yüce ve Şeref Sahibi''nin yüzü kalacak. Her gün, göklerde ve yeryüzünde olan tarafından sorgulanır, O bir iştedir. Sonra iki ağır şeyin hitabi: Ey cinler
      ve insan topluluğu, ancak yetkiyle yok olacaksınız. Gökyüzü yarıldığında, boya gibi bir gül olur ve suçlular yüz hatlarıyla tanınır: İşte suçluların reddettiği cehennemdir.'
    id: 'Setiap orang yang berada di atasnya akan binasa, dan Wajah Tuhanmu, Pemilik Keagungan dan Kehormatan, akan tetap ada. Setiap hari, Dia diinterogasi oleh Yang Maha Suci di langit dan bumi, Dia sedang
      dalam suatu perkara. Kemudian Alamat Dua Hal Berat: Wahai kumpulan jin dan manusia, kau tidak akan pergi kecuali dengan otoritas. Ketika langit terbelah, ia menjadi mawar seperti lukisan, dan para
      penjahat dikenal dari wajahnya: Inilah Neraka yang ditolak oleh para penjahat.'
  children:
  - title:
      ar: كل من عليها فان
      en: All Upon It Perish
      tr: İçindeki herkes ölümlü
      id: Semua orang di dalamnya adalah manusia biasa
    range:
    - 26
    - 28
  - title:
      ar: سؤال أهل السماوات والأرض
      en: The Asking of Heaven's and Earth's Folk
      tr: Gökyüzü ve yeryüzü sakinlerinden bir soru
      id: Sebuah pertanyaan dari penghuni langit dan bumi
    range:
    - 29
    - 32
  - title:
      ar: يا معشر الجن والإنس
      en: O Assembly of Jinn and Men
      tr: Ey cin ve insan halkı.
      id: Oh orang-orang jin dan manusia
    range:
    - 33
    - 36
  - title:
      ar: انشقاق السماء وجهنم
      en: The Splitting Sky and Hell
      tr: Cennet ve cehennemin ayrımı
      id: Perpecahan surga dan neraka
    range:
    - 37
    - 45
- title:
    ar: الجنتان العلييان
    en: The Two Lofty Gardens
    tr: İki Üst Gökyüzü
    id: Dua Langit Atas
  range:
  - 46
  - 61
  family: faith
  summary:
    ar: 'ولمن خاف مقام ربه جنتان ذواتا أفنان، فيهما عينان تجريان ومن كل فاكهة زوجان، متكئين على فرش بطائنها من إستبرق، فيهن قاصرات الطرف كأنهن الياقوت والمرجان: هل جزاء الإحسان إلا الإحسان.'
    en: 'For whoever feared his Lord''s station are two gardens of spreading branches, with two flowing springs and every fruit in pairs, reclining on couches lined with brocade; therein restraining maidens
      like ruby and coral: is the reward of goodness but goodness.'
    tr: 'Ve Rabbinin varlığından korkanlar için, bahçeleri olan, akan kaynakları olan iki bahçe vardır ve her meyveden iki çift vardır; İstibarq yataklarının halılarında yakut ve mercan gibi küçük yüz hatları
      vardır: İyilik için iyilikten başka bir ödül var mı?'
    id: 'Dan bagi mereka yang takut akan kehadiran Tuhan mereka, ada dua taman dengan taman, dengan mata air yang mengalir dan dari setiap buah dua pasang, berbaring di atas karpet tempat tidur Istibarq
      mereka, dengan fitur kecil seolah-olah itu adalah delima dan karang: Adakah hadiah atas kebaikan selain kebaikan?'
  children:
  - title:
      ar: ولمن خاف مقام ربه جنتان
      en: Two Gardens for Who Feared His Lord
      tr: Ve Rabbinin konumundan korkanlar için iki gök vardır
      id: Dan bagi mereka yang takut akan kedudukan Tuhan mereka, ada dua surga
    range:
    - 46
    - 47
  - title:
      ar: ذواتا أفنان والعينان
      en: Spreading Branches and Two Springs
      tr: Afnan ve Al-Ainan
      id: Afnan dan Al-Ainan
    range:
    - 48
    - 55
  - title:
      ar: قاصرات الطرف والجزاء
      en: The Restrained Maidens and the Reward
      tr: Küçükler ve Ceza
      id: Anak di bawah umur dan hukuman
    range:
    - 56
    - 61
- title:
    ar: الجنتان الأخريان
    en: The Other Two Gardens
    tr: Diğer iki cennet
    id: Dua surga lainnya
  range:
  - 62
  - 77
  family: faith
  summary:
    ar: 'ومن دونهما جنتان مدهامتان، فيهما عينان نضاختان وفاكهة ونخل ورمان، فيهن خيرات حسان: حور مقصورات في الخيام لم يطمثهن إنس قبلهم ولا جان، متكئين على رفرف خضر وعبقري حسان.'
    en: 'And besides those two are two dark-green gardens, with two gushing springs, fruit, palms, and pomegranates; therein good and beautiful ones: houris confined in pavilions, untouched before by man
      or jinn, reclining on green cushions and fine carpets.'
    tr: 'Aşağıda iki muhteşem bahçe var, iki çiçek açan kaynak, meyve, palmiye ağaçları ve narlar; güzel nimetlerle birlikte: daha önce hiçbir insanın ya da cinin dokunmadığı çadırlarda kapalı periler,
      yeşil kanat çırpıncalarına ve güzelliğin dehasına yaslanıyorlar.'
    id: 'Di bawahnya terdapat dua taman megah, dengan dua mata air yang bermekaran, buah, pohon palem, dan delima, dengan berkah indah: nimfa yang terkurung di tenda yang belum pernah disentuh manusia atau
      jin sebelumnya, bersandar pada keramaian hijau dan kejeniusan keindahan.'
  children:
  - title:
      ar: جنتان مدهامتان
      en: Two Dark-Green Gardens
      tr: Jentan Madhamtan
      id: Jentan Madhamtan
    range:
    - 62
    - 65
  - title:
      ar: عينان نضاختان وفاكهة
      en: Two Gushing Springs and Fruit
      tr: İki göz parıldayan meyve
      id: Dua mata buah berkilau
    range:
    - 66
    - 69
  - title:
      ar: خيرات حسان وحور مقصورات
      en: Good Beauties and Confined Houris
      tr: Khairat Hassan ve Hoor Maqoorat
      id: Khairat Hassan dan Hoor Maqoorat
    range:
    - 70
    - 77
- title:
    ar: الختام
    en: The Close
    tr: Sonuç
    id: Kesimpulan
  range:
  - 78
  - 78
  family: faith
  summary:
    ar: 'تبارك اسم ربك ذي الجلال والإكرام: خاتمة تليق بسورة النعم، تمجيدا لاسم الرب المنعم.'
    en: 'Blessed is the name of your Lord, Owner of majesty and honor: a close befitting the surah of blessings, glorifying the name of the bestowing Lord.'
    tr: 'Yüce ve Onur Sahibi olan Rabbinizin adı kutsanmıştır: An-Ni''Suresi''ne yakışır bir sonuç, Bahşiş Rab''bin adını yüceltmektedir.'
    id: 'Diberkatilah nama Tuhanmu, Pemilik Keagungan dan Kehormatan: penutup yang layak Surah An-Ni''am, memuliakan nama Dewa Pemberi.'
  children: []
