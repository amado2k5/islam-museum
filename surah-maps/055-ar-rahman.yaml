surah: 55
slug: ar-rahman
sources_consulted:
  - "YouTube — الخرائط الذهنية لسور القرآن: سورة الرحمن (3 حلقات: الآيات 1-25، 26-45، 46-78)"
  - "ibn-thani.com — سورة الرحمن (نص الآيات لتوثيق مواضع الفاصلة فبأي آلاء ربكما تكذبان)"
map:
  - title: { ar: "نعم التكوين: القرآن والإنسان والميزان", en: "Blessings of Origination: Quran, Man, the Balance" }
    range: [1, 16]
    family: faith
    summary:
      ar: "الرحمن علم القرآن خلق الإنسان علمه البيان، والشمس والقمر بحسبان والنجم والشجر يسجدان، والسماء رفعها ووضع الميزان عدلا، والأرض وضعها للأنام بفاكهتها وحبها، وخلق الإنسان من صلصال والجان من مارج من نار."
      en: "The Most Merciful taught the Quran, created man, taught him eloquence; the sun and moon by reckoning, the stars and trees prostrating; the sky raised and the Balance set in justice; the earth laid for creatures with its fruits and grain; man created from clay, the jinn from smokeless fire."
    children:
      - { title: { ar: "الرحمن علم القرآن", en: "The Most Merciful Taught the Quran" }, range: [1, 4] }
      - { title: { ar: "الشمس والقمر والميزان", en: "Sun, Moon, and the Balance" }, range: [5, 9] }
      - { title: { ar: "الأرض للأنام", en: "The Earth for Creatures" }, range: [10, 12] }
      - { title: { ar: "خلق الإنسان والجان", en: "Creating Man and Jinn" }, range: [14, 16] }
  - title: { ar: "المشرقان والبحران", en: "The Two Easts and the Two Seas" }
    range: [17, 25]
    family: faith
    summary:
      ar: "رب المشرقين ورب المغربين، ومرج البحرين يلتقيان بينهما برزخ لا يبغيان، يخرج منهما اللؤلؤ والمرجان، وله الجوار المنشآت في البحر كالأعلام."
      en: "Lord of the two easts and Lord of the two wests; He let the two seas meet, between them a barrier they do not transgress; from them come pearl and coral; His are the lofty ships in the sea like landmarks."
    children:
      - { title: { ar: "رب المشرقين والمغربين", en: "Lord of the Two Easts and Wests" }, range: [17, 18] }
      - { title: { ar: "مرج البحرين", en: "The Meeting of the Two Seas" }, range: [19, 23] }
      - { title: { ar: "الجوار في البحر", en: "The Ships at Sea" }, range: [24, 25] }
  - title: { ar: "الفناء ويوم الجزاء", en: "Perishing and the Day of Recompense" }
    range: [26, 45]
    family: faith
    summary:
      ar: "كل من عليها فان ويبقى وجه ربك ذو الجلال والإكرام، يسأله من في السماوات والأرض كل يوم هو في شأن، ثم خطاب الثقلين: يا معشر الجن والإنس لا تنفذون إلا بسلطان، فإذا انشقت السماء فكانت وردة كالدهان، ويعرف المجرمون بسيماهم: هذه جهنم التي يكذب بها المجرمون."
      en: "All upon it perish, and your Lord's Face of majesty and honor remains; all in the heavens and earth ask Him, each day He is in a matter; then the address to the two weighty beings: O assembly of jinn and men, you pass not except by authority; when the sky splits and becomes rose-red like ointment; the criminals known by their marks: this is Hell the criminals denied."
    children:
      - { title: { ar: "كل من عليها فان", en: "All Upon It Perish" }, range: [26, 28] }
      - { title: { ar: "سؤال أهل السماوات والأرض", en: "The Asking of Heaven's and Earth's Folk" }, range: [29, 32] }
      - { title: { ar: "يا معشر الجن والإنس", en: "O Assembly of Jinn and Men" }, range: [33, 36] }
      - { title: { ar: "انشقاق السماء وجهنم", en: "The Splitting Sky and Hell" }, range: [37, 45] }
  - title: { ar: "الجنتان العلييان", en: "The Two Lofty Gardens" }
    range: [46, 61]
    family: faith
    summary:
      ar: "ولمن خاف مقام ربه جنتان ذواتا أفنان، فيهما عينان تجريان ومن كل فاكهة زوجان، متكئين على فرش بطائنها من إستبرق، فيهن قاصرات الطرف كأنهن الياقوت والمرجان: هل جزاء الإحسان إلا الإحسان."
      en: "For whoever feared his Lord's station are two gardens of spreading branches, with two flowing springs and every fruit in pairs, reclining on couches lined with brocade; therein restraining maidens like ruby and coral: is the reward of goodness but goodness."
    children:
      - { title: { ar: "ولمن خاف مقام ربه جنتان", en: "Two Gardens for Who Feared His Lord" }, range: [46, 47] }
      - { title: { ar: "ذواتا أفنان والعينان", en: "Spreading Branches and Two Springs" }, range: [48, 55] }
      - { title: { ar: "قاصرات الطرف والجزاء", en: "The Restrained Maidens and the Reward" }, range: [56, 61] }
  - title: { ar: "الجنتان الأخريان", en: "The Other Two Gardens" }
    range: [62, 77]
    family: faith
    summary:
      ar: "ومن دونهما جنتان مدهامتان، فيهما عينان نضاختان وفاكهة ونخل ورمان، فيهن خيرات حسان: حور مقصورات في الخيام لم يطمثهن إنس قبلهم ولا جان، متكئين على رفرف خضر وعبقري حسان."
      en: "And besides those two are two dark-green gardens, with two gushing springs, fruit, palms, and pomegranates; therein good and beautiful ones: houris confined in pavilions, untouched before by man or jinn, reclining on green cushions and fine carpets."
    children:
      - { title: { ar: "جنتان مدهامتان", en: "Two Dark-Green Gardens" }, range: [62, 65] }
      - { title: { ar: "عينان نضاختان وفاكهة", en: "Two Gushing Springs and Fruit" }, range: [66, 69] }
      - { title: { ar: "خيرات حسان وحور مقصورات", en: "Good Beauties and Confined Houris" }, range: [70, 77] }
  - title: { ar: "الختام", en: "The Close" }
    range: [78, 78]
    family: faith
    summary:
      ar: "تبارك اسم ربك ذي الجلال والإكرام: خاتمة تليق بسورة النعم، تمجيدا لاسم الرب المنعم."
      en: "Blessed is the name of your Lord, Owner of majesty and honor: a close befitting the surah of blessings, glorifying the name of the bestowing Lord."
    children: []
