surah: 55
slug: ar-rahman
sources_consulted:
- 'YouTube — الخرائط الذهنية لسور القرآن: سورة الرحمن (3 حلقات: الآيات 1-25، 26-45، 46-78)'
- ibn-thani.com — سورة الرحمن (نص الآيات لتوثيق مواضع الفاصلة فبأي آلاء ربكما تكذبان)
map:
- title:
    ar: 'نعم التكوين: القرآن والإنسان والميزان'
    en: 'Blessings of Origination: Quran, Man, the Balance'
    tr: 'Evet Oluşumu: Kur''an, İnsan ve Denge'
    id: 'Formasi Ya: Al-Qur''an, Manusia, dan Keseimbangan'
  range:
  - 1
  - 16
  family: faith
  summary:
    ar: الرحمن علم القرآن خلق الإنسان علمه البيان، والشمس والقمر بحسبان والنجم والشجر يسجدان، والسماء رفعها ووضع الميزان عدلا، والأرض وضعها للأنام بفاكهتها وحبها، وخلق الإنسان من صلصال والجان من مارج من
      نار.
    en: The Most Merciful taught the Quran, created man, taught him eloquence; the sun and moon by reckoning, the stars and trees prostrating; the sky raised and the Balance set in justice; the earth laid
      for creatures with its fruits and grain; man created from clay, the jinn from smokeless fire.
    tr: 'Merhametli Kur''an''ı öğretti: İnsanı hitabetle yarattı, ona berraklığı, güneşi ve ayı, yıldızları ve ağaçları eğiltti, gökyüzü yükseltti ve terazileri adil şekilde dikti, yeryüzünü meyvesi ve
      sevgisiyle insanlığa yarattı, insanı kilden, cinleri ateşten bir beşiğinden yarattı.'
    id: 'Yang Maha Penyayang mengajarkan Al-Qur''an: Dia menciptakan manusia dengan kefasih, mengajarkannya kejelasan, matahari dan bulan dalam perhitungan, bintang dan pohon tunduk, langit terangkat dan
      mengatur timbangan dengan adil, bumi Dia tetapkan untuk manusia dengan buah dan kasihnya, menciptakan manusia dari tanah liat, dan jin dari buaian api.'
  children:
  - title:
      ar: الرحمن علم القرآن
      en: The Most Merciful Taught the Quran
      tr: En Merhametli Kur'an'ı öğretti
      id: Yang Maha Penyayang mengajarkan Al-Qur'an
    range:
    - 1
    - 4
