map:
- title:
    ar: تحدث الأرض أخبارها
    en: The Earth Reports
    tr: Dünya haberini verir.
    id: Bumi menceritakan kabarnya
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'إذا زلزلت الأرض زلزالها وأخرجت الأرض أثقالها وقال الإنسان ما لها: يومئذ تحدث أخبارها بأن ربك أوحى لها.'
    en: When the earth is shaken with its quake and casts out its burdens, and man asks what ails it — that Day it shall report, for your Lord inspired it.
    tr: Yer depremle sarsıldığında ve yükleriyle yük altında olduğunda, insan der ki, 'Ne var bunda?' O zaman haberi Rabbinin ona vahyettiğini duyulur.
    id: Ketika bumi diguncang oleh gempa bumi dan bumi terbeban oleh bebannya, manusia berkata, 'Apa yang salah dengan itu?' Maka kabarnya akan disampaikan bahwa Tuhanmu telah mewahyukan kepadanya.
  children: []
- title:
    ar: مثقال ذرة
    en: An Atom's Weight
    tr: Bir atomun ağırlığı
    id: Berat Atom
  range:
  - 6
  - 8
  family: faith
  summary:
    ar: 'يومئذ يصدر الناس أشتاتا ليروا أعمالهم: فمن يعمل مثقال ذرة خيرا يره ومن يعمل مثقال ذرة شرا يره.'
    en: 'That Day people shall come forth in scattered groups to be shown their deeds: an atom''s weight of good shall be seen, and an atom''s weight of evil.'
    tr: 'O Gün, insanlar yaptıklarını görmek için dağılır: Bir atom ağırlığı kadar iyilik yapan onu görür, bir atom ağırlığı kötülük yapan ise görür.'
    id: 'Pada hari itu, orang-orang akan tercerai-berai untuk melihat perbuatan mereka: Siapa pun yang melakukan berat kebaikan atom akan melihatnya, dan siapa pun melakukan berat kejahatan atom akan melihatnya.'
  children: []
