map:
  - title: { ar: "تحدث الأرض أخبارها", en: "The Earth Reports" }
    range: [1, 5]
    family: faith
    summary:
      ar: "إذا زلزلت الأرض زلزالها وأخرجت الأرض أثقالها وقال الإنسان ما لها: يومئذ تحدث أخبارها بأن ربك أوحى لها."
      en: "When the earth is shaken with its quake and casts out its burdens, and man asks what ails it — that Day it shall report, for your Lord inspired it."
    children: []
  - title: { ar: "مثقال ذرة", en: "An Atom's Weight" }
    range: [6, 8]
    family: faith
    summary:
      ar: "يومئذ يصدر الناس أشتاتا ليروا أعمالهم: فمن يعمل مثقال ذرة خيرا يره ومن يعمل مثقال ذرة شرا يره."
      en: "That Day people shall come forth in scattered groups to be shown their deeds: an atom's weight of good shall be seen, and an atom's weight of evil."
    children: []
