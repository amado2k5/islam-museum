- title:
    ar: الدفاع عن القرآن والرسالة
    en: The Defense of the Quran
    tr: Kur'an'ı ve mesajı savunmak
    id: Membela Al-Qur'an dan pesan
  range:
  - 38
  - 52
  family: faith
  summary:
    ar: القسم العظيم بأن القرآن قول رسول كريم لا قول شاعر ولا كاهن، ووعيد من يتقول على الله، وخاتمة بالتذكرة والحسرة.
    en: A mighty oath that the Quran is the word of a noble messenger, not a poet's or soothsayer's; a threat against forging lies about Allah; closing with reminder and regret.
    tr: Kur'an'ın bir şair ya da kahinin değil, soylu bir elçinin sözü olduğuna dair büyük yemin, Allah'a karşı konuşanlara bir uyarı ve anma ve pişmanlıkla sonuçlanan bir son.
    id: Sumpah besar bahwa Al-Qur'an adalah firman utusan yang mulia, bukan kata-kata penyair atau peramal, dan peringatan bagi mereka yang berbicara menentang Tuhan, serta penutup dengan kenangan dan penyesalan.
  children:
