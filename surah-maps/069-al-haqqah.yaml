      - { title: { ar: "ثمود وعاد", en: "Thamud and Ad" }, range: [4, 8] }
      - { title: { ar: "فرعون والمؤتفكات", en: "Pharaoh and the Overthrown Towns" }, range: [9, 10] }
      - { title: { ar: "الطوفان والجارية", en: "The Flood and the Ark" }, range: [11, 12] }
  - title: { ar: "النفخ في الصور وخراب العالم", en: "The Trumpet Blast and the World's Ruin" }
    range: [13, 17]
    family: faith
    summary:
      ar: "مشهد القيامة: النفخة الواحدة، ودك الأرض والجبال، وانشقاق السماء، وحمل العرش."
      en: "The Resurrection scene: the single blast, earth and mountains crushed, the sky split, the Throne borne."
    children: []
  - title: { ar: "الحساب والصحائف", en: "The Reckoning and the Records" }
    range: [18, 37]
    family: faith
    summary:
      ar: "يوم العرض على الله: من أوتي كتابه بيمينه في عيشة راضية، ومن أوتيه بشماله في حسرة وسلاسل."
      en: "The Day of presentation before Allah: whoever receives his record in his right hand lives in contentment; whoever receives it in his left faces regret and chains."
    children:
      - { title: { ar: "أصحاب اليمين", en: "The People of the Right" }, range: [19, 29] }
      - { title: { ar: "أصحاب الشمال", en: "The People of the Left" }, range: [30, 37] }
  - title: { ar: "الدفاع عن القرآن والرسالة", en: "The Defense of the Quran" }
    range: [38, 52]
    family: faith
    summary:
      ar: "القسم العظيم بأن القرآن قول رسول كريم لا قول شاعر ولا كاهن، ووعيد من يتقول على الله، وخاتمة بالتذكرة والحسرة."
      en: "A mighty oath that the Quran is the word of a noble messenger, not a poet's or soothsayer's; a threat against forging lies about Allah; closing with reminder and regret."
    children:
      - { title: { ar: "قسم بصدق الرسول", en: "Oath on the Messenger's Truthfulness" }, range: [38, 43] }
      - { title: { ar: "وعيد التقول على الله", en: "The Threat Against Forging Lies" }, range: [44, 47] }
      - { title: { ar: "تذكرة وحسرة", en: "Reminder and Regret" }, range: [48, 52] }
