map:
- title:
    ar: 'الحاقة: اليوم الحق'
    en: 'Al-Haqqah: The Inevitable Reality'
    tr: 'El-Haqqa: Bugün doğru gün'
    id: 'Al-Haqqa: Hari ini adalah hari yang tepat'
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: افتتاح مهيب باسم اليوم الآخر «الحاقة» مع التهويل بشأنها تعظيما لأمرها.
    en: An awe-filled opening naming the Last Day 'Al-Haqqah', magnifying its gravity.
    tr: Diriliş Günü 'Al-Haqqa' adına yapılan ciddi bir açılış, amacını yüceltmek için abartılı bir şekilde yapılır.
    id: Pembukaan yang khidmat atas nama Hari Kebangkitan, 'Al-Haqqa,' dengan berlebihan sebagai bentuk pengagungan atas tujuannya.
  children: []
- title:
    ar: عاقبة الأمم المكذبة
    en: The Fate of the Denying Nations
    tr: İnkar eden ulusların kaderi
    id: Nasib negara-negara penyangkal
  range:
  - 4
  - 12
  family: faith
  summary:
    ar: 'شواهد تاريخية على حتمية العذاب: ثمود وعاد وفرعون والمؤتفكات، والطوفان والجارية تذكرة للأذن الواعية.'
    en: 'Historical proofs of inevitable punishment: Thamud, Ad, Pharaoh, the overthrown towns, and the Flood and the Ark as a reminder for the heedful ear.'
    tr: 'Cezanın kaçınılmazlığına dair tarihsel kanıtlar: Thamud, ''Ad, Firavun, Mutafkat, tufan ve genç kız, bilinçli kulağa hatırlatıcılardır.'
    id: 'Bukti sejarah tentang kepastian hukuman: Thamud, ''Ad, Firaun, Mutafkat, banjir, dan gadis adalah pengingat bagi telinga yang sadar.'
  children:
