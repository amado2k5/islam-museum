- title:
    ar: النفخ في الصور وخراب العالم
    en: The Trumpet Blast and the World's Ruin
    tr: Fotoğrafları patlatmak ve dünyayı mahvetmek
    id: Merusak foto dan merusak dunia
  range:
  - 13
  - 17
  family: faith
  summary:
    ar: 'مشهد القيامة: النفخة الواحدة، ودك الأرض والجبال، وانشقاق السماء، وحمل العرش.'
    en: 'The Resurrection scene: the single blast, earth and mountains crushed, the sky split, the Throne borne.'
    tr: 'Diriliş sahnesi: tek bir darbe, toprağın ve dağların ezilmesi, gökyüzünün bölünmesi ve Taht''ın taşınması.'
    id: 'Adegan kebangkitan: satu pukulan, penghancuran bumi dan gunung, pembelahan langit, dan pembantuhan Takhta.'
  children: []
- title:
    ar: الحساب والصحائف
    en: The Reckoning and the Records
    tr: Hesap ve Tablolar
    id: Akun dan Lembar
  range:
  - 18
  - 37
  family: faith
  summary:
    ar: 'يوم العرض على الله: من أوتي كتابه بيمينه في عيشة راضية، ومن أوتيه بشماله في حسرة وسلاسل.'
    en: 'The Day of presentation before Allah: whoever receives his record in his right hand lives in contentment; whoever receives it in his left faces regret and chains.'
    tr: 'Allah''ın huzuruna sunulma günü: Sağ eline kitabı huzurlu bir hayat içinde verilen, sol eli pişman ve zincirlerle verilen.'
    id: 'Hari Persembahan di hadapan Allah: Siapa yang diberikan kitab di tangan kanannya dalam kehidupan yang tenang, dan siapa yang diberikan tangan kirinya dalam penyesalan dan rantai.'
  children:
