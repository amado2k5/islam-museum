  family: law
  summary:
    ar: حد الزنا، وعقوبة قذف المحصنات، وحكم اللعان بين الزوجين عند الاتهام.
    en: The punishment for adultery, for slandering chaste women, and li'an oaths between spouses.
    tr: Zina cezası, iffetli kadınlara karalamanın cezası ve suçlandığında eşler arasında küfür etme kararı.
    id: Hukuman atas perselingkuhan, hukuman untuk mencemarkan nama baik wanita suci, dan aturan tentang sumpah serapah antara pasangan saat dituduh.
