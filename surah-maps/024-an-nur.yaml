- title:
    ar: الطاعة والاستخلاف
    en: Obedience and Succession
    tr: İtaat ve yöneticilik
    id: Ketaatan dan pengelolaan
  range:
  - 47
  - 64
  family: faith
  summary:
    ar: المنافقون يقولون آمنا ثم يتولون، ووعد الله بالاستخلاف للمؤمنين، وآداب البيوت والدعاء.
    en: Hypocrites claim faith then turn away; Allah's promise of succession; household manners; the closing supplication.
    tr: Münafıklar 'İnanıyoruz' derler ve sonra yüz çevirirler; Tanrı inananlara yönetilmeyi, evlerin ve duaların görgü kurallarını vaat eder.
    id: Orang munafik berkata 'Kami percaya' lalu berpaling, dan Tuhan berjanji akan menjaga orang percaya, serta etiket rumah dan permohonan.
  children:
  - title:
      ar: وعد الاستخلاف
      en: The Promise of Succession
      tr: Vicegercy'nin Vaadi
      id: Janji Kewakilan
