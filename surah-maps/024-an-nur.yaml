- title:
    ar: حديث الإفك
    en: The Slander
    tr: Dedikodu Hadisi
    id: Hadis Gosip
  range:
  - 11
  - 26
  family: law
  summary:
    ar: 'قصة الإفك: الذين جاؤوا به عصبة، وتأديب من خاض فيه، والتحذير من إشاعة الفاحشة.'
    en: 'The slander affair: its spreaders a band; disciplining those who repeated it; warning against spreading indecency.'
    tr: 'İftiranın hikayesi: onu bir grup olarak getirenler, buna katılanların disiplinleri ve ahlaksızlığın yayılmasına karşı uyarı.'
    id: 'Kisah fitnah itu: mereka yang membawanya sebagai kelompok, disiplin mereka yang terlibat, dan peringatan agar tidak menyebarkan amoralitas.'
  children:
