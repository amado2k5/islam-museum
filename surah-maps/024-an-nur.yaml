- title:
    ar: الاستئذان والحجاب
    en: Seeking Permission and the Covering
    tr: İzin ve Başörtüsü
    id: Izin dan Hijab
  range:
  - 27
  - 34
  family: law
  summary:
    ar: آداب الاستئذان ودخول البيوت، وغض البصر للرجال والنساء، والحجاب، وتزويج الأيامى.
    en: Manners of permission and entering homes; lowering the gaze for men and women; the covering; marrying the unmarried.
    tr: İzin isteme, evlere girme, kadın ve erkeklere bakmayı aşağıya indirme, başörtüsü takma ve yaşlıları evlendirme görgü kuralları.
    id: Etiket meminta izin, masuk ke rumah, menundukkan pandangan terhadap pria dan wanita, mengenakan hijab, dan menikahkan orang tua.
  children:
  - title:
      ar: غض البصر
      en: Lowering the Gaze
      tr: Göz yummak
      id: Menutup mata
    range:
    - 30
    - 31
- title:
    ar: آية النور
    en: The Verse of Light
    tr: Ayat al-Noor
    id: Ayat al-Noor
  range:
  - 35
  - 46
  family: faith
  summary:
    ar: 'الله نور السماوات والأرض: المشكاة والمصباح، وبيوت أذن الله أن ترفع، وظلمات الكفر.'
    en: 'Allah the Light of the heavens and earth: niche, lamp, houses raised for remembrance, and the darknesses of disbelief.'
    tr: 'Allah, göklerin ve yerin ışığıdır: niş ve lamba, Allah''ın yükseltmesine izin verdiği evler ve kâfirliğin karanlığıdır.'
    id: 'Allah adalah Cahaya langit dan bumi: ceruk dan lampu, rumah-rumah yang Allah izinkan untuk didirikan, dan kegelapan ketidakpercayaan.'
