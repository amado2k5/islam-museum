  - title: { ar: "السؤال عن النعيم", en: "Asked About Comfort" }
    range: [6, 8]
    family: faith
    summary:
      ar: "لترون الجحيم ثم لترونها عين اليقين ثم لتسألن يومئذ عن النعيم."
      en: "You shall surely see Hellfire — see it with the eye of certainty — then be asked that Day about the comfort you were given."
    children: []
