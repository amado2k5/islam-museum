map:
- title:
    ar: ألهاكم التكاثر
    en: Rivalry Distracted You
    tr: Üreme dikkatinizi dağıttı
    id: Reproduksi mengalihkan perhatianmu
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'ألهاكم التكاثر حتى زرتم المقابر: كلا سوف تعلمون ثم كلا سوف تعلمون، كلا لو تعلمون علم اليقين.'
    en: Rivalry in increase distracted you until you visited the graves — no indeed, you shall come to know; if only you knew with certain knowledge.
    tr: 'Çoğaltma ile meşguldün, ta ki mezarları ziyaret edene kadar: Hayır, bilirsin, kesinlik bilimini biliyorsan bilirsin.'
    id: 'Kamu terdistraksi oleh perkalian sampai kamu mengunjungi makam: Tidak, kamu akan tahu, lalu kamu akan tahu, jika kamu tahu ilmu kepastian.'
  children: []
- title:
    ar: السؤال عن النعيم
    en: Asked About Comfort
    tr: Mutluluk sorusu
    id: Pertanyaan tentang kebahagiaan
  range:
  - 6
  - 8
  family: faith
  summary:
    ar: لترون الجحيم ثم لترونها عين اليقين ثم لتسألن يومئذ عن النعيم.
    en: You shall surely see Hellfire — see it with the eye of certainty — then be asked that Day about the comfort you were given.
    tr: Cehennemi göreceksiniz, sonra kesin olarak göreceksiniz, sonra o gün size mutluluk hakkında sorular sorulacak.
    id: Kamu akan melihat Neraka, lalu kamu akan melihatnya dengan pasti, lalu kamu akan ditanya hari itu tentang kebahagiaan.
  children: []
