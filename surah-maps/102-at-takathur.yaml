map:
  - title: { ar: "ألهاكم التكاثر", en: "Rivalry Distracted You" }
    range: [1, 5]
    family: faith
    summary:
      ar: "ألهاكم التكاثر حتى زرتم المقابر: كلا سوف تعلمون ثم كلا سوف تعلمون، كلا لو تعلمون علم اليقين."
      en: "Rivalry in increase distracted you until you visited the graves — no indeed, you shall come to know; if only you knew with certain knowledge."
