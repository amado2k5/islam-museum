  family: faith
  summary:
    ar: 'إنا أنزلناه في ليلة القدر: ليلة القدر خير من ألف شهر، تنزل الملائكة والروح فيها بإذن ربهم من كل أمر، سلام هي حتى مطلع الفجر.'
    en: 'We sent it down on the Night of Decree — better than a thousand months: the angels and the Spirit descend by their Lord''s leave with every matter; peace until the break of dawn.'
    tr: 'Gerçekten de Ferman Gecesi''nde indirdik: Ferman gecesi bin aydan iyidir. Melekler ve Ruh, Rabbilerinin izniyle her şey için oraya inerler. Selam şafak doğana kadar sürer.'
    id: 'Memang, Kami mengungkapkannya pada Malam Keputusan: Malam Keputusan lebih baik daripada seribu bulan. Para malaikat dan Roh turun ke sana atas izin Tuhan mereka untuk segala hal. Damai berlangsung
      sampai fajar.'
