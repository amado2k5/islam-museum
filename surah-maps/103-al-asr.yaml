  summary:
    ar: والعصر إن الإنسان لفي خسر إلا الذين آمنوا وعملوا الصالحات وتواصوا بالحق وتواصوا بالصبر.
    en: 'By time: man is in loss — except those who believed, did righteous deeds, and counseled one another to truth and patience.'
    tr: Ve bu dönemde, insanlık zarar içindedir; sadece iman eden, doğru işler yapan, birbirine doğruluk öğütleyen, sabırlı olmaya öğüt verenler hariç.
    id: Dan pada zamannya, umat manusia mengalami kerugian kecuali mereka yang percaya dan berbuat benar serta saling memaksa kebenaran dan saling menasihati untuk bersabar.
