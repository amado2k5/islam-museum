surah: 27
slug: an-naml
sources_consulted:
  - "kuttab.com — Surah An-Naml mind map (4 blocks: 1-14, 15-44, 45-58, 59-93)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "النار والآيات التسع", en: "The Fire and the Nine Signs" }
    range: [1, 14]
    family: stories
    summary:
      ar: "هدى وبشرى للمؤمنين، ونداء موسى عند النار، وإرساله إلى فرعون بتسع آيات فجحدوها ظلما وعلوا."
      en: "Guidance and glad tidings for believers; Moses called at the fire; sent to Pharaoh with nine signs, denied unjustly."
    children: []
  - title: { ar: "سليمان والنملة والهدهد", en: "Solomon, the Ant and the Hoopoe" }
    range: [15, 44]
    family: stories
    summary:
      ar: "مُلك سليمان ومنطق الطير، وتحذير النملة وتبسمه، ونبأ سبأ، والكتاب إلى الملكة، وعرشها والصرح."
      en: "Solomon's kingdom and the speech of birds; the ant's warning and his smile; Sheba's news; the letter; her throne; the palace."
    children:
      - { title: { ar: "النملة", en: "The Ant" }, range: [18, 19] }
      - { title: { ar: "الهدهد وسبأ", en: "The Hoopoe and Sheba" }, range: [22, 28] }
      - { title: { ar: "عرش بلقيس", en: "The Queen's Throne" }, range: [38, 42] }
  - title: { ar: "ثمود ولوط", en: "Thamud and Lot" }
    range: [45, 58]
    family: stories
    summary:
      ar: "صالح وثمود: التسعة الرهط الذين يفسدون ومكرهم، ولوط وقومه، ومطر السوء على المنذرين."
      en: "Salih and Thamud: the nine plotters and their scheme; Lot and his people; the evil rain on the warned."
    children: []
  - title: { ar: "من الخالق؟", en: "Who Creates?" }
    range: [59, 93]
    family: faith
    summary:
      ar: "خمسة أسئلة تنتهي بأإله مع الله، ودابة الأرض تكلم الناس، والنفخ في الصور، وخاتمة السورة بالحمد."
      en: "Five questions each ending 'is there a god with Allah'; the Beast speaking; the Trumpet; the close in praise."
    children:
      - { title: { ar: "أإله مع الله", en: "A God with Allah?" }, range: [60, 64] }
      - { title: { ar: "دابة الأرض", en: "The Beast of the Earth" }, range: [82, 82] }
