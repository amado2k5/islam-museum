map:
  - title: { ar: "من نفس واحدة: اليتامى والمواريث", en: "From One Soul: Orphans and Inheritance" }
    range: [1, 14]
    family: law
    summary:
      ar: "تقوى الله والأرحام، وحفظ أموال اليتامى، وتفصيل فرائض الميراث — وتلك حدود الله."
      en: "Fear of Allah and kinship ties, guarding orphans' property, and the detailed shares of inheritance — these are Allah's limits."
    children:
      - { title: { ar: "خلقكم من نفس واحدة", en: "Created from a Single Soul" }, range: [1, 1] }
      - { title: { ar: "أموال اليتامى", en: "The Orphans' Property" }, range: [2, 3] }
      - { title: { ar: "فرائض الميراث", en: "The Inheritance Shares" }, range: [7, 12] }
      - { title: { ar: "تلك حدود الله", en: "These Are Allah's Limits" }, range: [13, 14] }
  - title: { ar: "الزواج وحدوده", en: "Marriage and Its Limits" }
    range: [15, 35]
    family: law
    summary:
      ar: "أحكام الفاحشة والتوبة، والمحرمات في النكاح، والمعاشرة بالمعروف، والقوامة، والتحكيم عند الشقاق."
      en: "Rulings on indecency and repentance, forbidden marriages, kind companionship, responsibility in the household, and arbitration at discord."
    children:
      - { title: { ar: "التوبة المقبولة", en: "The Accepted Repentance" }, range: [17, 18] }
      - { title: { ar: "المعاشرة بالمعروف", en: "Kind Companionship" }, range: [19, 19] }
      - { title: { ar: "المحرمات من النساء", en: "Forbidden Women in Marriage" }, range: [23, 23] }
      - { title: { ar: "القوامة", en: "Men's Responsibility" }, range: [34, 34] }
      - { title: { ar: "الحكمان", en: "The Two Arbiters" }, range: [35, 35] }
  - title: { ar: "اعبدوا الله وأحسنوا", en: "Worship Allah and Do Good" }
    range: [36, 70]
    family: faith
    summary:
      ar: "عبادة الله وحده والإحسان إلى الوالدين واليتامى والجيران، والصلاة والطهارة، وطاعة الله والرسول وأولي الأمر."
      en: "Worshipping Allah alone and kindness to parents, orphans, and neighbors; prayer and purification; obeying Allah, the Messenger, and authority."
    children:
      - { title: { ar: "الإحسان العام", en: "Goodness to All" }, range: [36, 36] }
      - { title: { ar: "الصلاة والطهارة", en: "Prayer and Purification" }, range: [43, 43] }
      - { title: { ar: "الشرك لا يغفر", en: "Shirk Is Not Forgiven" }, range: [48, 48] }
      - { title: { ar: "طاعة أولي الأمر", en: "Obeying Those in Authority" }, range: [59, 59] }
  - title: { ar: "القتال والهجرة وصلاة الخوف", en: "Fighting, Migration, and the Fear Prayer" }
    range: [71, 104]
    family: law
    summary:
      ar: "النفير والحذر، والهجرة في سبيل الله، وتحية الإسلام، وحرمة دم المؤمن، وكيفية الصلاة حال الخوف."
      en: "Mobilization and caution, migration for Allah's sake, the greeting of peace, the sanctity of a believer's blood, and prayer under threat."
    children:
      - { title: { ar: "رد التحية", en: "Returning the Greeting" }, range: [86, 86] }
      - { title: { ar: "قتل المؤمن خطأ وعمدا", en: "Killing a Believer" }, range: [92, 93] }
      - { title: { ar: "الهجرة في سبيل الله", en: "Migration for Allah's Sake" }, range: [97, 100] }
      - { title: { ar: "صلاة الخوف", en: "The Fear Prayer" }, range: [101, 103] }
  - title: { ar: "احكم بما أراك الله", en: "Judge by What Allah Has Shown You" }
    range: [105, 126]
    family: law
    summary:
      ar: "العدل في القضاء وعدم المجادلة عن الخائنين، وأن النجاة ليست بالأماني بل بالإيمان والعمل."
      en: "Justice in judgment, no pleading for the treacherous; salvation comes not by wishes but by faith and deeds."
    children:
      - { title: { ar: "العدل في الحكم", en: "Justice in Judgment" }, range: [105, 105] }
      - { title: { ar: "لا تجادل عن الخائنين", en: "Do Not Plead for the Treacherous" }, range: [107, 109] }
      - { title: { ar: "ليس بأمانيكم", en: "Not by Your Wishes" }, range: [123, 123] }
  - title: { ar: "الإصلاح وآخر الأحكام", en: "Reconciliation and the Final Rulings" }
    range: [127, 176]
    family: law
    summary:
      ar: "الصلح بين الزوجين، والعدل مع النساء، وخطاب أهل الكتاب، وختام السورة بآية الكلالة."
      en: "Reconciliation between spouses, fairness with women, the address to the People of the Book, and the closing verse on distant heirs."
    children:
      - { title: { ar: "الصلح بين الزوجين", en: "Reconciliation Between Spouses" }, range: [128, 128] }
      - { title: { ar: "الجهر بالسوء", en: "Public Evil Speech" }, range: [148, 148] }
      - { title: { ar: "شبهة صلب عيسى", en: "The Crucifixion Claim" }, range: [157, 158] }
      - { title: { ar: "النهي عن الغلو", en: "Against Religious Excess" }, range: [171, 171] }
      - { title: { ar: "آية الكلالة", en: "The Kalala Verse" }, range: [176, 176] }
