- title:
    ar: القتال والهجرة وصلاة الخوف
    en: Fighting, Migration, and the Fear Prayer
    tr: Savaş, göç ve korku duası
    id: Pertempuran, migrasi, dan doa ketakutan
  range:
  - 71
  - 104
  family: law
  summary:
    ar: النفير والحذر، والهجرة في سبيل الله، وتحية الإسلام، وحرمة دم المؤمن، وكيفية الصلاة حال الخوف.
    en: Mobilization and caution, migration for Allah's sake, the greeting of peace, the sanctity of a believer's blood, and prayer under threat.
    tr: Alarm ve tedbir, Allah yolunda göç, İslam'ı selamlama, müminin kanının kutsallığı ve korku zamanlarında namaz kılma.
    id: Kekhawatiran dan kehati-hatian, migrasi di jalan Allah, menyapa Islam, kesucian darah orang berimim, dan cara berdoa di masa ketakutan.
