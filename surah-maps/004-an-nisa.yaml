    en: Reconciliation between spouses, fairness with women, the address to the People of the Book, and the closing verse on distant heirs.
    tr: eşler arasında uzlaşma, kadınlarla adalet, Kitap Ahli'nin konuşması ve surenin 'Kalala' ayetiyle sona ermesi.
    id: rekonsiliasi antara pasangan, keadilan dengan perempuan, ucapan umat Kitab, dan penutupan surah dengan ayat 'Kalala'.
