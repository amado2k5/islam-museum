- title:
    ar: اعبدوا الله وأحسنوا
    en: Worship Allah and Do Good
    tr: Tanrı'ya ibadet et ve iyilik yap
    id: Sembahlah Tuhan dan berbuat baik
  range:
  - 36
  - 70
  family: faith
  summary:
    ar: عبادة الله وحده والإحسان إلى الوالدين واليتامى والجيران، والصلاة والطهارة، وطاعة الله والرسول وأولي الأمر.
    en: Worshipping Allah alone and kindness to parents, orphans, and neighbors; prayer and purification; obeying Allah, the Messenger, and authority.
    tr: Sadece Allah'a ibadet etmek, ebeveynlere, yetimlere ve komşulara iyilik, namaz ve arınma, Allah'a, Resulu'na ve yetkililere itaat.
    id: Penyembahan kepada Allah saja, kebaikan kepada orang tua, anak yatim, dan tetangga, doa dan penyucian, ketaatan kepada Allah Rasulullah, dan mereka yang berkuasa.
