- title:
    ar: الزواج وحدوده
    en: Marriage and Its Limits
    tr: Evlilik ve sınırları
    id: Pernikahan dan batasannya
  range:
  - 15
  - 35
  family: law
  summary:
    ar: أحكام الفاحشة والتوبة، والمحرمات في النكاح، والمعاشرة بالمعروف، والقوامة، والتحكيم عند الشقاق.
    en: Rulings on indecency and repentance, forbidden marriages, kind companionship, responsibility in the household, and arbitration at discord.
    tr: Ahlaksızlık ve tövbe kararları, evlilik yasakları, iyi ilişkiler, vasilik ve anlaşmazlık durumunda tahkim.
    id: Putusan tentang ketidakmoralan dan pertobatan, larangan pernikahan, hubungan baik, perwalian, dan arbitrase dalam kasus perselisihan.
