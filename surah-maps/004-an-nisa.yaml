- title:
    ar: احكم بما أراك الله
    en: Judge by What Allah Has Shown You
    tr: Tanrı'nın sizi ne gördüğüne göre yargılayın
    id: Nilailah dari apa yang Tuhan lihat Anda
  range:
  - 105
  - 126
  family: law
  summary:
    ar: العدل في القضاء وعدم المجادلة عن الخائنين، وأن النجاة ليست بالأماني بل بالإيمان والعمل.
    en: Justice in judgment, no pleading for the treacherous; salvation comes not by wishes but by faith and deeds.
    tr: Yargıda adalet ve hainler hakkında tartışmamamak, kurtuluşun dilekte değil, inanç ve eylemde olduğu.
    id: Keadilan dalam peradilan dan tidak berdebat tentang para pengkhianat, dan bahwa keselamatan bukan pada keinginan tetapi pada iman dan tindakan.
