map:
- title:
    ar: 'من نفس واحدة: اليتامى والمواريث'
    en: 'From One Soul: Orphans and Inheritance'
    tr: 'Aynı ruhtan: yetimler ve miraslar'
    id: 'Dari jiwa yang sama: yatim piatu dan warisan'
  range:
  - 1
  - 14
  family: law
  summary:
    ar: تقوى الله والأرحام، وحفظ أموال اليتامى، وتفصيل فرائض الميراث — وتلك حدود الله.
    en: Fear of Allah and kinship ties, guarding orphans' property, and the detailed shares of inheritance — these are Allah's limits.
    tr: Allah'ın takvası ve akrabalık bağları, yetimlerin servetini korumak, miras yükümlülüklerini detaylandırmak — bunlar Allah'ın belirlediği sınırlardır.
    id: Kesalehan Allah dan ikatan kekerabatan, menjaga kekayaan anak yatim, merinci kewajiban warisan — inilah batasan yang ditetapkan oleh Allah.
  children:
