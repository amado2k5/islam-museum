surah: 59
slug: al-hashr
sources_consulted:
  - "Wikipedia — Al-Hashr (verse-by-verse summary)"
  - "islamicstudies.info — Tafheem ul Quran ayat themes (Surah 59)"
  - "fa.wikipedia.org — سوره حشر (six-part thematic division)"
  - "الخرائط الذهنية لسور القرآن — surah Al-Hashr mind-map series (Arabic)"
map:
  - title: { ar: "تسبيح الله", en: "The Glorification of Allah" }
    range: [1, 1]
    family: faith
    summary:
      ar: "افتتاح السورة بتسبيح كل ما في السماوات والأرض لله العزيز الحكيم، تمهيدا لما يأتي من مظاهر قدرته وعدله."
      en: "The surah opens with everything in the heavens and earth glorifying Allah, the Mighty, the Wise — a prelude to the displays of His power and justice that follow."
    children: []
  - title: { ar: "إجلاء بني النضير", en: "The Expulsion of Banu Nadir" }
    range: [2, 5]
    family: stories
    summary:
      ar: "قصة إخراج يهود بني النضير من ديارهم بعد نقضهم العهد: أتاهم الله من حيث لم يحتسبوا، وقذف في قلوبهم الرعب."
      en: "The account of Banu Nadir's expulsion after breaking their treaty: Allah came upon them from where they did not expect, casting terror into their hearts."
    children: []
  - title: { ar: "الفيء ومستحقوه", en: "The Fay' and Its Beneficiaries" }
    range: [6, 10]
    family: law
    summary:
      ar: "أحكام الفيء الذي أفاءه الله على رسوله من غير قتال: توزيعه على ذوي القربى واليتامى والمساكين وابن السبيل، وثناء على المهاجرين والأنصار واللاحقين."
      en: "The rulings on the fay' granted by Allah without fighting: its distribution among kin, orphans, the poor and travelers, and praise for the Emigrants, the Helpers, and the believers who came after."
    children:
      - { title: { ar: "الفيء وتوزيعه", en: "The Fay' and Its Distribution" }, range: [6, 7] }
      - { title: { ar: "الفقراء المهاجرون", en: "The Poor Emigrants" }, range: [8, 8] }
      - { title: { ar: "الأنصار", en: "The Helpers" }, range: [9, 9] }
      - { title: { ar: "دعاء اللاحقين للسابقين", en: "The Later Believers' Prayer for Their Predecessors" }, range: [10, 10] }
  - title: { ar: "خيانة المنافقين", en: "The Treachery of the Hypocrites" }
    range: [11, 17]
    family: stories
    summary:
      ar: "فضح المنافقين الذين وعدوا إخوانهم من أهل الكتاب بالنصرة ثم خذلوهم، وبيان وهن بأسهم وتفرق قلوبهم، مع مثل الشيطان الذي يغري الإنسان ثم يتبرأ منه."
      en: "The exposure of the hypocrites who promised their allies support then abandoned them; their feeble might and divided hearts are laid bare, capped by the parable of Satan who lures man then disowns him."
    children:
      - { title: { ar: "وعود المنافقين الكاذبة", en: "The Hypocrites' False Promises" }, range: [11, 12] }
      - { title: { ar: "وهن بأسهم", en: "Their Feeble Might" }, range: [13, 14] }
      - { title: { ar: "عبرة من سبقهم", en: "The Lesson of Those Before Them" }, range: [15, 15] }
      - { title: { ar: "مثل الشيطان", en: "The Parable of Satan" }, range: [16, 17] }
  - title: { ar: "التقوى والاستعداد للغد", en: "God-consciousness and Preparing for Tomorrow" }
    range: [18, 20]
    family: faith
    summary:
      ar: "نداء للمؤمنين بتقوى الله والنظر فيما قدمت كل نفس لغدها، وتحذير من نسيان الله، وبيان أن أصحاب الجنة هم الفائزون."
      en: "A call to the believers to be conscious of Allah and to consider what each soul has sent ahead for tomorrow, warning against forgetting Allah: the companions of Paradise are the successful."
    children: []
  - title: { ar: "مثل الجبل", en: "The Parable of the Mountain" }
    range: [21, 21]
    family: faith
    summary:
      ar: "لو أنزل هذا القرآن على جبل لرأيته خاشعا متصدعا من خشية الله — مثل يصور عظمة القرآن وأثره في القلوب."
      en: "Had this Quran been sent down upon a mountain, you would have seen it humbled and split asunder from awe of Allah — a parable picturing the Quran's majesty and its effect on hearts."
    children: []
  - title: { ar: "أسماء الله الحسنى", en: "The Beautiful Names of Allah" }
    range: [22, 24]
    family: faith
    summary:
      ar: "ختام السورة الشهير بسرد طائفة من أسماء الله الحسنى وصفاته: الملك القدوس السلام المؤمن المهيمن، والخالق البارئ المصور."
      en: "The surah's famous closing enumerating Allah's Beautiful Names and attributes: the Sovereign, the Holy, the Source of Peace, the Giver of Security, the Creator, the Originator, the Fashioner."
    children: []
