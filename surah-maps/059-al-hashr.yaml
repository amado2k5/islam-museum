map:
- title:
    ar: تسبيح الله
    en: The Glorification of Allah
    tr: Tasbih Allah
    id: Tasbih Allah
  range:
  - 1
  - 1
  family: faith
  summary:
    ar: افتتاح السورة بتسبيح كل ما في السماوات والأرض لله العزيز الحكيم، تمهيدا لما يأتي من مظاهر قدرته وعدله.
    en: The surah opens with everything in the heavens and earth glorifying Allah, the Mighty, the Wise — a prelude to the displays of His power and justice that follow.
    tr: Sure, gökteki ve yerdeki her şeyi yücelterek, O'nun kudretinin ve adaletinin göstergelerinin habercisi olarak Yüce, Bilgin Allah'a sunar.
    id: Surah dibuka dengan memuliakan segala sesuatu di langit dan bumi kepada Allah, Yang Maha Kuasa, Yang Bijaksana, sebagai pengantar manifestasi kuasa dan keadilan-Nya.
  children: []
- title:
    ar: إجلاء بني النضير
    en: The Expulsion of Banu Nadir
    tr: Bani Nadir Tahliyesi
    id: Evakuasi Bani Nadir
  range:
  - 2
  - 5
  family: stories
  summary:
    ar: 'قصة إخراج يهود بني النضير من ديارهم بعد نقضهم العهد: أتاهم الله من حيث لم يحتسبوا، وقذف في قلوبهم الرعب.'
    en: 'The account of Banu Nadir''s expulsion after breaking their treaty: Allah came upon them from where they did not expect, casting terror into their hearts.'
    tr: 'Banu Nadir''deki Yahudilerin, antlaşmalarını bozduktan sonra evlerinden kovulma hikayesi: Tanrı beklemedikleri yerden geldi ve kalplerine korku saldı.'
    id: 'Kisah orang Yahudi Banu Nadir yang diusir dari rumah mereka setelah melanggar perjanjian mereka: Tuhan datang kepada mereka dari tempat yang tidak mereka duga, dan menakutkan hati mereka.'
  children: []
- title:
    ar: الفيء ومستحقوه
    en: The Fay' and Its Beneficiaries
    tr: Fakirler ve Hak Edenler
    id: Orang Miskin dan yang Layak
  range:
  - 6
  - 10
  family: law
  summary:
    ar: 'أحكام الفيء الذي أفاءه الله على رسوله من غير قتال: توزيعه على ذوي القربى واليتامى والمساكين وابن السبيل، وثناء على المهاجرين والأنصار واللاحقين.'
    en: 'The rulings on the fay'' granted by Allah without fighting: its distribution among kin, orphans, the poor and travelers, and praise for the Emigrants, the Helpers, and the believers who came after.'
    tr: 'Allah''ın Resulu''na savaşmadan verdiği foil üzerindeki hükümler: akrabalar, yetimler, muhtaçlar ve yolcular arasında dağıtmak, göç edenleri, yardımcıları ve takip edenleri övmek.'
    id: 'Putusan tentang foil yang diberikan Allah kepada Rasul-Nya tanpa perlawanan: membagikannya kepada kerabat, anak yatim, yang membutuhkan, dan para pengembara, serta memuji para emigran, para pembantu,
      dan mereka yang mengikuti.'
  children:
