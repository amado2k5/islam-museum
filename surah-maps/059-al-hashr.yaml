- title:
    ar: التقوى والاستعداد للغد
    en: God-consciousness and Preparing for Tomorrow
    tr: Dindarlık ve yarına hazırlık
    id: Kesalehan dan persiapan untuk hari esok
  range:
  - 18
  - 20
  family: faith
  summary:
    ar: نداء للمؤمنين بتقوى الله والنظر فيما قدمت كل نفس لغدها، وتحذير من نسيان الله، وبيان أن أصحاب الجنة هم الفائزون.
    en: 'A call to the believers to be conscious of Allah and to consider what each soul has sent ahead for tomorrow, warning against forgetting Allah: the companions of Paradise are the successful.'
    tr: İnananlara Allah'tan korkmaları, her ruhun yarını hazırladıklarını düşünmeleri, Allah'ı unutmamaları için bir uyarı ve cennetin sahabelerinin başarılı olanlar olduğunu açıklama çağrısıdır.
    id: Seruan kepada orang beriman untuk takut kepada Allah, merenungkan apa yang telah dipersiapkan setiap jiwa untuk hari esoknya, peringatan agar tidak melupakan Allah, dan klarifikasi bahwa sahabat
      Surga adalah yang berhasil.
  children: []
- title:
    ar: مثل الجبل
    en: The Parable of the Mountain
    tr: Bir dağ gibi
    id: Seperti gunung
  range:
  - 21
  - 21
  family: faith
  summary:
    ar: لو أنزل هذا القرآن على جبل لرأيته خاشعا متصدعا من خشية الله — مثل يصور عظمة القرآن وأثره في القلوب.
    en: Had this Quran been sent down upon a mountain, you would have seen it humbled and split asunder from awe of Allah — a parable picturing the Quran's majesty and its effect on hearts.
    tr: Eğer bu Kur'an bir dağda indirilseydi, onu Allah korkusuyla alçakgönüllü ve çatlamış görürdünüz — bu alegori, Kur'an'ın büyüklüğünü ve kalpler üzerindeki etkisini gösterir.
    id: Jika Al-Qur'an ini diwahyukan di sebuah gunung, Anda akan melihatnya direndahkan dan retak karena takut akan Tuhan — sebuah perumpamaan yang menggambarkan kebesaran Al-Qur'an dan dampaknya pada
      hati.
  children: []
- title:
    ar: أسماء الله الحسنى
    en: The Beautiful Names of Allah
    tr: Allah'ın Güzel İsimleri
    id: Nama-nama Indah Allah
  range:
  - 22
  - 24
  family: faith
  summary:
    ar: 'ختام السورة الشهير بسرد طائفة من أسماء الله الحسنى وصفاته: الملك القدوس السلام المؤمن المهيمن، والخالق البارئ المصور.'
    en: 'The surah''s famous closing enumerating Allah''s Beautiful Names and attributes: the Sovereign, the Holy, the Source of Peace, the Giver of Security, the Creator, the Originator, the Fashioner.'
    tr: 'Surenin ünlü sonu, Allah''ın En Güzel İsimleri ve Sıfatlarının bir derlemesini anlatır: Kral, Kutsal, Barışçıl, İmkanlı, Egemen ve Yaratıcı, Yaratıcı, Gösteren.'
    id: 'Kesimpulan terkenal dari surah ini menceritakan kumpulan Nama-nama dan atribut Allah yang Paling Indah: Raja, Yang Kudus, Yang Damai, Yang Beriman, Yang Menguasai, dan Sang Pencipta, Sang Pencipta,
      yang Manifestasi.'
  children: []
