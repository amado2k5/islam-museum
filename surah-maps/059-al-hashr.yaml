- title:
    ar: خيانة المنافقين
    en: The Treachery of the Hypocrites
    tr: İkiyüzlülerin ihaneti
    id: Pengkhianatan terhadap para munafik
  range:
  - 11
  - 17
  family: stories
  summary:
    ar: فضح المنافقين الذين وعدوا إخوانهم من أهل الكتاب بالنصرة ثم خذلوهم، وبيان وهن بأسهم وتفرق قلوبهم، مع مثل الشيطان الذي يغري الإنسان ثم يتبرأ منه.
    en: The exposure of the hypocrites who promised their allies support then abandoned them; their feeble might and divided hearts are laid bare, capped by the parable of Satan who lures man then disowns
      him.
    tr: Kitap Ahli'nden kardeşlerine destek vaat eden ama sonra onları terk eden münafıkları ortaya çıkardı; zayıflıklarını ve kalplerinin bölünmesini ortaya çıkardı; ayrıca birini ayartıp sonra reddeden
      Şeytan'ın örneğini ortaya çıkardı.
    id: Ia mengungkap para munafik yang berjanji dukungan kepada saudara-saudara mereka dari Umat Kitab tetapi kemudian meninggalkan mereka, memperlihatkan kelemahan dan perpecahan hati mereka, bersama
      dengan contoh Setan yang menggoda seseorang lalu mengusirnya.
  children:
