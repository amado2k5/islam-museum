map:
  - title: { ar: "الحمد والتوحيد", en: "Praise; Oneness" }
    range: [1, 8]
    family: faith
    summary:
      ar: "الحمد لله فاطر السماوات والأرض جاعل الملائكة رسلا؛ ما يفتح الله للناس من رحمة فلا ممسك لها؛ يا أيها الناس اذكروا نعمة الله عليكم هل من خالق غير الله."
      en: "Praise be to God, Originator of heavens and earth, who made the angels messengers; no one withholds what God opens of mercy; remember God's favor upon you — is there a creator besides God?"
    children:
      - { title: { ar: "فاطر السماوات والأرض", en: "Originator of Heavens and Earth" }, range: [1, 1] }
      - { title: { ar: "الشيطان عدو", en: "Satan Is an Enemy" }, range: [6, 6] }
  - title: { ar: "آيات القدرة في الخلق", en: "Signs of Power in Creation" }
    range: [9, 18]
    family: faith
    summary:
      ar: "والله الذي أرسل الرياح فتثير سحابا؛ من كان يريد العزة فلله العزة جميعا؛ والله خلقكم من تراب؛ وما يستوي البحران هذا عذب فرات وهذا ملح أجاج."
      en: "It is God who sends the winds stirring clouds; whoever seeks might — all might belongs to God; God created you from dust; the two seas are not alike, one fresh and sweet, one salty and bitter."
    children:
      - { title: { ar: "إرسال الرياح", en: "The Sending of Winds" }, range: [9, 9] }
      - { title: { ar: "خلق الإنسان", en: "The Creation of Man" }, range: [11, 11] }
      - { title: { ar: "البحران", en: "The Two Seas" }, range: [12, 13] }
  - title: { ar: "الأمثال والتباين", en: "Parables; the Contrast" }
    range: [19, 28]
    family: faith
    summary:
      ar: "وما يستوي الأعمى والبصير ولا الظلمات ولا النور؛ إنا أرسلناك بالحق بشيرا ونذيرا؛ ألم تر أن الله أنزل من السماء ماء فأخرجنا به ثمرات مختلفا ألوانها."
      en: "The blind and the seeing are not equal, nor darkness and light; We sent you with the truth, bringer of glad tidings and warner; have you not seen that God sends water from the sky, bringing forth fruits of varying colors."
    children:
      - { title: { ar: "الأعمى والبصير", en: "The Blind and the Seeing" }, range: [19, 22] }
      - { title: { ar: "اختلاف الألوان", en: "The Varying Colors" }, range: [27, 28] }
  - title: { ar: "أهل القرآن وورثة الكتاب", en: "The People of the Quran; Heirs of the Book" }
    range: [29, 37]
    family: faith
    summary:
      ar: "إن الذين يتلون كتاب الله وأقاموا الصلاة وأنفقوا يرجون تجارة لن تبور؛ ثم أورثنا الكتاب الذين اصطفينا من عبادنا فمنهم ظالم لنفسه ومنهم مقتصد ومنهم سابق بالخيرات؛ والذين كفروا لهم نار جهنم."
      en: "Those who recite God's Book, establish prayer and spend hope for a trade that never perishes; then We made Our chosen servants inherit the Book — some wronging themselves, some moderate, some foremost in good; deniers have Hellfire."
    children:
      - { title: { ar: "تجارة لن تبور", en: "A Trade That Never Perishes" }, range: [29, 30] }
      - { title: { ar: "ورثة الكتاب الثلاثة", en: "The Three Heirs of the Book" }, range: [32, 33] }
  - title: { ar: "علم الله وإمهاله", en: "God's Knowledge; His Reprieve" }
    range: [38, 45]
    family: faith
    summary:
      ar: "إن الله عالم غيب السماوات والأرض إنه عليم بذات الصدور؛ هو الذي جعلكم خلائف في الأرض؛ ولو يؤاخذ الله الناس بما كسبوا ما ترك على ظهرها من دابة."
      en: "God knows the unseen of heavens and earth, Knower of what breasts conceal; He made you successors on earth; were God to seize people for what they earn, He would leave no creature on its back."
    children:
      - { title: { ar: "خلائف في الأرض", en: "Successors on Earth" }, range: [39, 39] }
      - { title: { ar: "ولو يؤاخذ الله الناس", en: "Were God to Seize People" }, range: [45, 45] }
