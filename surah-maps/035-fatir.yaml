map:
- title:
    ar: الحمد والتوحيد
    en: Praise; Oneness
    tr: Övgü ve Birlik
    id: Pujian dan Persatuan
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: الحمد لله فاطر السماوات والأرض جاعل الملائكة رسلا؛ ما يفتح الله للناس من رحمة فلا ممسك لها؛ يا أيها الناس اذكروا نعمة الله عليكم هل من خالق غير الله.
    en: Praise be to God, Originator of heavens and earth, who made the angels messengers; no one withholds what God opens of mercy; remember God's favor upon you — is there a creator besides God?
    tr: Melekleri elçi yapan göklerin ve yerin yaratıcısı Allah'a hamd olsun; Allah, merhameti alıkoyamayan her merhameti insanlara açar. Ey insanlar, Allah'ın size olan lütfunu unutmayın. Allah'tan başka
      bir yaratıcı var mıdır?
    id: Puji bagi Allah, Pencipta langit dan bumi, yang menjadikan malaikat utusan; Allah membuka rahmat bagi orang-orang yang tidak dapat menahannya. Wahai umat manusia, ingatlah rahmat Allah atas dirimu.
      Adakah pencipta lain selain Allah?
  children:
  - title:
      ar: فاطر السماوات والأرض
      en: Originator of Heavens and Earth
      tr: Gökyüzünün ve yerin yaratıcısı
      id: Pencipta langit dan bumi
    range:
    - 1
    - 1
  - title:
      ar: الشيطان عدو
      en: Satan Is an Enemy
      tr: Şeytan bir düşmandır
      id: Iblis adalah musuh
    range:
    - 6
    - 6
- title:
    ar: آيات القدرة في الخلق
    en: Signs of Power in Creation
    tr: Yaratılışta Yetenek Belirtileri
    id: Tanda-tanda Kemampuan dalam Penciptaan
  range:
  - 9
  - 18
  family: faith
  summary:
    ar: والله الذي أرسل الرياح فتثير سحابا؛ من كان يريد العزة فلله العزة جميعا؛ والله خلقكم من تراب؛ وما يستوي البحران هذا عذب فرات وهذا ملح أجاج.
    en: It is God who sends the winds stirring clouds; whoever seeks might — all might belongs to God; God created you from dust; the two seas are not alike, one fresh and sweet, one salty and bitter.
    tr: Ve Tanrı, rüzgarları gönderen ve bulutları harekete geçiren Tanrı'dır; kim şeref isterse, tüm şeref Allah'a aittir; Allah sizi topraktan yarattı; denize eşit olan tatlı Fırat'tır, bu da tuzdur ve
      tuzdur.
    id: Dan Allah adalah Dia yang mengutus angin dan menggerakkan awan; siapa yang menginginkan kehormatan, bagi Allah adalah segala kehormatan; dan Allah menciptakanmu dari debu; dan yang setara dengan
      laut, inilah Efrat yang manis, ini garam, dan itu garam.
  children:
  - title:
      ar: إرسال الرياح
      en: The Sending of Winds
      tr: Rüzgar iletimi
      id: Transmisi angin
    range:
    - 9
    - 9
  - title:
      ar: خلق الإنسان
      en: The Creation of Man
      tr: İnsanın Yaratılışı
      id: Penciptaan Manusia
    range:
    - 11
    - 11
  - title:
      ar: البحران
      en: The Two Seas
      tr: kriz
      id: krisis
    range:
    - 12
    - 13
- title:
    ar: الأمثال والتباين
    en: Parables; the Contrast
    tr: Atasözleri ve Varyasyon
    id: Peribahasa dan Variasi
  range:
  - 19
  - 28
  family: faith
  summary:
    ar: وما يستوي الأعمى والبصير ولا الظلمات ولا النور؛ إنا أرسلناك بالحق بشيرا ونذيرا؛ ألم تر أن الله أنزل من السماء ماء فأخرجنا به ثمرات مختلفا ألوانها.
    en: The blind and the seeing are not equal, nor darkness and light; We sent you with the truth, bringer of glad tidings and warner; have you not seen that God sends water from the sky, bringing forth
      fruits of varying colors.
    tr: Kör ile gören, ne karanlık ne de ışık eşit değildir; biz seni hakikatle gönderdik, hem müjdeyle hem de uyaran olarak. Görmedin mi Allah gökyüzünden su indirip onunla çeşitli renklerde meyveler verir?
    id: Dan yang buta dan yang melihat, tidak juga kegelapan, maupun terang, adalah sama; Kami telah mengutus kamu dengan kebenaran sebagai pembawa kabar baik dan peringatan. Tidakkah kamu melihat bahwa
      Allah menurunkan air dari langit dan menghasilkan buah yang beragam warna-warni?
  children:
  - title:
      ar: الأعمى والبصير
      en: The Blind and the Seeing
      tr: Körler ve görenler
      id: Orang buta dan yang melihat
    range:
    - 19
    - 22
  - title:
      ar: اختلاف الألوان
      en: The Varying Colors
      tr: Renk farkı
      id: Perbedaan warna
    range:
    - 27
    - 28
- title:
    ar: أهل القرآن وورثة الكتاب
    en: The People of the Quran; Heirs of the Book
    tr: Kur'an'ın Halkı ve Kitabın Varisleri
    id: Orang-orang Al-Qur'an dan Pewaris Kitab
  range:
  - 29
  - 37
  family: faith
  summary:
    ar: إن الذين يتلون كتاب الله وأقاموا الصلاة وأنفقوا يرجون تجارة لن تبور؛ ثم أورثنا الكتاب الذين اصطفينا من عبادنا فمنهم ظالم لنفسه ومنهم مقتصد ومنهم سابق بالخيرات؛ والذين كفروا لهم نار جهنم.
    en: Those who recite God's Book, establish prayer and spend hope for a trade that never perishes; then We made Our chosen servants inherit the Book — some wronging themselves, some moderate, some foremost
      in good; deniers have Hellfire.
    tr: Gerçekten Allah Kitabı'nı okuyanlar, namaz kılanlar ve asla yok olmayacak bir ticaret umudunu harcayanlar Kitabı bizden seçtiğimiz kölelerimize bıraktık. Onların arasında kendilerine haksızlık eden,
      bazıları ılımlı, iyilikte önde olanlar vardır; kâfir olanlar ise cehennem ateşidir.
    id: Memang, mereka yang membaca Kitab Allah, mendirikan doa, dan berharap untuk perdagangan yang tidak akan pernah lenyap; maka Kami mewariskan Kitab itu kepada mereka yang Kami pilih dari antara hamba-hamba
      Kami. Di antara mereka tidak adil bagi diri mereka sendiri, ada yang moderat, dan di antara mereka ada yang paling berbuat baik; dan mereka yang tidak percaya, bagi mereka adalah api Neraka.
  children:
  - title:
      ar: تجارة لن تبور
      en: A Trade That Never Perishes
      tr: Ticaret tolere edilmeyecek.
      id: Perdagangan tidak akan ditoleransi.
    range:
    - 29
    - 30
  - title:
      ar: ورثة الكتاب الثلاثة
      en: The Three Heirs of the Book
      tr: Kitabın üç varisi
      id: Tiga pewaris buku
    range:
    - 32
    - 33
- title:
    ar: علم الله وإمهاله
    en: God's Knowledge; His Reprieve
    tr: Tanrı bilir ve rahatlama.
    id: Tuhan tahu dan istirahat.
  range:
  - 38
  - 45
  family: faith
  summary:
    ar: إن الله عالم غيب السماوات والأرض إنه عليم بذات الصدور؛ هو الذي جعلكم خلائف في الأرض؛ ولو يؤاخذ الله الناس بما كسبوا ما ترك على ظهرها من دابة.
    en: God knows the unseen of heavens and earth, Knower of what breasts conceal; He made you successors on earth; were God to seize people for what they earn, He would leave no creature on its back.
    tr: Gerçekten Allah gök ve yerin görünmezliğini bilendir. O kalpleri bilendir; sizi yeryüzünde halef yapan Odur. Eğer Allah insanları kazandıklarından hesap verse, hiçbir canlıyı sırtında bırakmaz.
    id: Sesungguhnya, Allah Maha Mengetahui yang tak terlihat dari langit dan bumi. Dia Maha Mengetahui hati-hati; Dialah yang menjadikan kalian penerus di bumi. Dan jika Allah menuntut orang bertanggung
      jawab atas apa yang mereka peroleh, Dia tidak akan meninggalkan makhluk apa pun di punggungnya.
  children:
  - title:
      ar: خلائف في الأرض
      en: Successors on Earth
      tr: Dünyadaki Halef
      id: Penerus di Bumi
    range:
    - 39
    - 39
  - title:
      ar: ولو يؤاخذ الله الناس
      en: Were God to Seize People
      tr: Tanrı insanları cezalandırsa bile
      id: Bahkan jika Tuhan menghukum orang
    range:
    - 45
    - 45
