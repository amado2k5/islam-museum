surah: 58
slug: al-mujadila
sources_consulted:
  - "quran.inoor.ir — مقدمة السورة المجادلة: المحتوى والموضوعات (3 أقسام: الظهار، آداب المجالسة، المنافقون) وجو النزول (5 أجزاء)"
  - "download.ghbook.ir — تفسير نمونه، سورة المجادلة: ملخص الأقسام الثلاثة (thematic structure only)"
map:
  - title: { ar: "حكم الظهار وكفارته", en: "The Ruling of Zihar and Its Expiation" }
    range: [1, 4]
    family: law
    summary:
      ar: "سمع الله قول التي تجادلك في زوجها وتشتكي إلى الله، فبين حكم الظهار: الذين يظاهرون من نسائهم ثم يعودون فتحرير رقبة من قبل أن يتماسا، فمن لم يجد فصيام شهرين متتابعين، فمن لم يستطع فإطعام ستين مسكينا."
      en: "Allah heard the woman pleading about her husband and complaining to Allah, so the ruling of zihar was set: those who declare zihar then retract must free a slave before touching, or fast two consecutive months if unable, or feed sixty needy if unable."
    children: []
  - title: { ar: "عاقبة محادة الله ورسوله", en: "The End of Opposing Allah and His Messenger" }
    range: [5, 6]
    family: faith
    summary:
      ar: "إن الذين يحادون الله ورسوله كبتوا كما كبت الذين من قبلهم وقد أنزلنا آيات بينات، وللكافرين عذاب مهين يوم يبعثهم الله جميعا فينبئهم بما عملوا."
      en: "Those who oppose Allah and His Messenger are abased as those before them were abased, and We sent down clear verses; for the disbelievers a humiliating torment, on the Day Allah raises them all and informs them of their deeds."
    children: []
  - title: { ar: "النجوى: علم الله وآدابها", en: "Secret Counsel: Allah's Knowledge and Its Manners" }
    range: [7, 10]
    family: law
    summary:
      ar: "ما يكون من نجوى ثلاثة إلا هو رابعهم ولا خمسة إلا هو سادسهم، ثم توبيخ من نهوا عن النجوى ثم يعودون لما نهوا عنه ويتناجون بالإثم والعدوان ومعصية الرسول؛ وأمر المؤمنين أن يتناجوا بالبر والتقوى، وأن النجوى من الشيطان ليحزن الذين آمنوا وليس بضارهم شيئا إلا بإذن الله."
      en: "No secret counsel of three but He is their fourth, nor of five but He their sixth; then a rebuke of those forbidden secret counsel who return to it, conspiring in sin, aggression, and disobedience to the Messenger; believers are commanded to counsel in righteousness and piety; secret counsel is from Satan to grieve the believers, harming them nothing except by Allah's leave."
    children:
      - { title: { ar: "علم الله بالنجوى", en: "Allah's Knowledge of Secret Counsel" }, range: [7, 8] }
      - { title: { ar: "آداب نجوى المؤمنين", en: "Manners of the Believers' Counsel" }, range: [9, 10] }
  - title: { ar: "آداب المجالس ومناجاة الرسول", en: "Manners of Gatherings and Private Audience" }
    range: [11, 13]
    family: law
    summary:
      ar: "يا أيها الذين آمنوا إذا قيل لكم تفسحوا في المجالس فافسحوا يفسح الله لكم، وإذا قيل انشزوا فانشزوا يرفع الله الذين آمنوا منكم والذين أوتوا العلم درجات؛ وإذا ناجيتم الرسول فقدموا بين يدي نجواكم صدقة، ثم نسخ الوجوب وبقي الاستحباب مع الأمر بالصلاة والزكاة."
      en: "O believers, when told to make room in gatherings, make room — Allah will make room for you; when told to rise, rise — Allah raises the believers and the learned in ranks; before private audience with the Messenger, offer charity beforehand; then the obligation was lightened, with prayer and alms-giving enjoined."
    children:
      - { title: { ar: "التفسح في المجالس", en: "Making Room in Gatherings" }, range: [11, 11] }
      - { title: { ar: "الصدقة قبل المناجاة", en: "Charity Before Private Audience" }, range: [12, 13] }
  - title: { ar: "المنافقون وحزب الشيطان", en: "The Hypocrites and Satan's Party" }
    range: [14, 19]
    family: faith
    summary:
      ar: "توبيخ من يتولون قوما غضب الله عليهم ليسوا من المؤمنين ولا من الكفار، يحلفون على الكذب وهم يعلمون، اتخذوا أيمانهم جنة فصدوا عن سبيل الله؛ استحوذ عليهم الشيطان فأنساهم ذكر الله أولئك حزب الشيطان ألا إن حزب الشيطان هم الخاسرون."
      en: "A rebuke of those who befriend a people Allah is angry with — neither of the believers nor of them — swearing to lies knowingly, taking oaths as a shield to bar Allah's way; Satan has overcome them and made them forget Allah's remembrance: those are Satan's party, and Satan's party are the losers."
    children:
      - { title: { ar: "تولي قوم غضب الله عليهم", en: "Befriending Those Allah Is Angry With" }, range: [14, 16] }
      - { title: { ar: "استحواذ الشيطان", en: "Satan's Overcoming" }, range: [17, 19] }
  - title: { ar: "المحادون وحزب الله", en: "The Opposers and Allah's Party" }
    range: [20, 22]
    family: faith
    summary:
      ar: "إن الذين يحادون الله ورسوله أولئك في الأذلين، كتب الله لأغلبن أنا ورسلي؛ لا تجد قوما يؤمنون بالله واليوم الآخر يوادون من حاد الله ورسوله ولو كانوا آباءهم أو أبناءهم أو إخوانهم أو عشيرتهم، أولئك كتب في قلوبهم الإيمان وأيدهم بروح منه، ويدخلهم جنات: أولئك حزب الله ألا إن حزب الله هم المفلحون."
      en: "Those who oppose Allah and His Messenger are among the most abased; Allah has decreed: I and My messengers shall prevail; you find no people believing in Allah and the Last Day befriending Allah's and His Messenger's opposers, even were they their fathers, sons, brothers, or kin — He inscribed faith in their hearts and strengthened them with a spirit from Him, admitting them to gardens: those are Allah's party, and Allah's party are the successful."
    children:
      - { title: { ar: "المحادون في الأذلين", en: "The Opposers Among the Abased" }, range: [20, 21] }
      - { title: { ar: "حزب الله هم المفلحون", en: "Allah's Party Are the Successful" }, range: [22, 22] }
