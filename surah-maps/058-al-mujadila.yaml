map:
- title:
    ar: حكم الظهار وكفارته
    en: The Ruling of Zihar and Its Expiation
    tr: Zihar ve kefaret kararı
    id: Putusan tentang zihar dan penebusannya
  range:
  - 1
  - 4
  family: law
  summary:
    ar: 'سمع الله قول التي تجادلك في زوجها وتشتكي إلى الله، فبين حكم الظهار: الذين يظاهرون من نسائهم ثم يعودون فتحرير رقبة من قبل أن يتماسا، فمن لم يجد فصيام شهرين متتابعين، فمن لم يستطع فإطعام ستين مسكينا.'
    en: 'Allah heard the woman pleading about her husband and complaining to Allah, so the ruling of zihar was set: those who declare zihar then retract must free a slave before touching, or fast two consecutive
      months if unable, or feed sixty needy if unable.'
    tr: 'Allah, kocası hakkında sizinle tartışan ve Allah''a şikayet eden kadının sözlerini duymuştur. Zihar''ın hükmünü açıklığa kavuşturdu: Eşlerini gösterip sonra köleyi dokunmadan önce geri dönen ve
      onu kurtaranlar. Bulamayan iki ay üst üste oruç tutar. Eğer maddi gücü yetmiyorsa, altmış muhtaçla doyurun.'
    id: 'Allah telah mendengar kata-kata wanita yang berselisih denganmu tentang suaminya dan mengeluh kepada Allah. Dia menjelaskan aturan Zihar: Mereka yang memamerkan istrinya lalu kembali dan membebaskan
      budak sebelum menyentuhnya. Siapa yang tidak menemukannya, puasalah dua bulan berturut-turut. Jika tidak mampu, beri makan enam puluh orang yang membutuhkan.'
  children: []
- title:
    ar: عاقبة محادة الله ورسوله
    en: The End of Opposing Allah and His Messenger
    tr: Tanrı ile Elçisi arasındaki ittifakın sonucu
    id: Konsekuensi dari aliansi antara Allah dan Rasul-Nya
  range:
  - 5
  - 6
  family: faith
  summary:
    ar: إن الذين يحادون الله ورسوله كبتوا كما كبت الذين من قبلهم وقد أنزلنا آيات بينات، وللكافرين عذاب مهين يوم يبعثهم الله جميعا فينبئهم بما عملوا.
    en: Those who oppose Allah and His Messenger are abased as those before them were abased, and We sent down clear verses; for the disbelievers a humiliating torment, on the Day Allah raises them all
      and informs them of their deeds.
    tr: Gerçekten de, Allah'a ve Elçi'ye karşı olanlar, onlardan öncekilerin dışlandığı gibi ezdirilmiştir. Biz açık ayetler indirdik; kafirler için, Allah'ın hepsini dirilteceği ve yaptıklarını bildireceği
      gün aşağılayıcı bir cezadır.
    id: Memang, mereka yang menentang Allah dan Rasul-Nya telah ditindas seperti mereka yang sebelumnya telah ditekan. Kami telah menurunkan ayat yang jelas, dan bagi orang kafir adalah hukuman yang memalukan
      pada hari Allah akan membangkitkan mereka semua dan memberitahu mereka apa yang telah mereka lakukan.
  children: []
- title:
    ar: 'النجوى: علم الله وآدابها'
    en: 'Secret Counsel: Allah''s Knowledge and Its Manners'
    tr: 'Najwa: Tanrı''nın bilgisi ve görgü kuralları'
    id: 'Najwa: Pengetahuan dan etiket Tuhan'
  range:
  - 7
  - 10
  family: law
  summary:
    ar: ما يكون من نجوى ثلاثة إلا هو رابعهم ولا خمسة إلا هو سادسهم، ثم توبيخ من نهوا عن النجوى ثم يعودون لما نهوا عنه ويتناجون بالإثم والعدوان ومعصية الرسول؛ وأمر المؤمنين أن يتناجوا بالبر والتقوى، وأن
      النجوى من الشيطان ليحزن الذين آمنوا وليس بضارهم شيئا إلا بإذن الله.
    en: No secret counsel of three but He is their fourth, nor of five but He their sixth; then a rebuke of those forbidden secret counsel who return to it, conspiring in sin, aggression, and disobedience
      to the Messenger; believers are commanded to counsel in righteousness and piety; secret counsel is from Satan to grieve the believers, harming them nothing except by Allah's leave.
    tr: Üçlü özel konuşma yoktur, sadece dördüncüdür, beşi ise altıncı değildir. Sonra özel sohbeti yasaklayanları azarlar, sonra yasakladıkları şeylere geri dönüp günah, saldırganlık ve Peygamber'e itaatsizlik
      çağrısı yaparlar; müminlere doğru ve takvaya başvurmaları emredilmiştir ve fısıltı, iman edenlerin üzülmesi için şeytandan gelmiştir ve Allah'ın izniyle onlara zarar gelmez.
    id: Tidak ada percakapan pribadi tiga kecuali dia yang keempat, dan lima kecuali yang keenam. Kemudian menegur mereka yang melarang berbicara secara pribadi, lalu kembali ke apa yang mereka larang dan
      memohon dosa, agresi, dan ketidaktaatan kepada Rasul; orang beriman diperintahkan untuk berpegang pada kebenaran dan kesalehan, dan bisikan itu berasal dari Setan agar mereka yang percaya dapat berduka,
      dan tidak ada yang merugikan mereka kecuali dengan izin Allah.
  children:
  - title:
      ar: علم الله بالنجوى
      en: Allah's Knowledge of Secret Counsel
      tr: Tanrı ona gizli olmayı öğretti.
      id: Tuhan mengajarinya untuk bersikap rahasia.
    range:
    - 7
    - 8
  - title:
      ar: آداب نجوى المؤمنين
      en: Manners of the Believers' Counsel
      tr: İnananların Yoldaşlarının Görgü Kuralları
      id: Etiket Para Sahabat Orang Percaya
    range:
    - 9
    - 10
- title:
    ar: آداب المجالس ومناجاة الرسول
    en: Manners of Gatherings and Private Audience
    tr: Peygamber ile Toplantı ve Sohbetlerin Görgü Kuralları
    id: Etiket Pertemuan dan Percakapan dengan Nabi
  range:
  - 11
  - 13
  family: law
  summary:
    ar: يا أيها الذين آمنوا إذا قيل لكم تفسحوا في المجالس فافسحوا يفسح الله لكم، وإذا قيل انشزوا فانشزوا يرفع الله الذين آمنوا منكم والذين أوتوا العلم درجات؛ وإذا ناجيتم الرسول فقدموا بين يدي نجواكم صدقة،
      ثم نسخ الوجوب وبقي الاستحباب مع الأمر بالصلاة والزكاة.
    en: O believers, when told to make room in gatherings, make room — Allah will make room for you; when told to rise, rise — Allah raises the believers and the learned in ranks; before private audience
      with the Messenger, offer charity beforehand; then the obligation was lightened, with prayer and alms-giving enjoined.
    tr: Ey iman edenler, size meclislerde yer açın denildiğinde, Allah size yer açar. Ve 'Mütevazı olun, alçakgönüllü olun' denildiğinde, Allah aranızdan iman edenleri ve bilgiye göre kademeli olanları
      yükseltir; ve siz Peygamber'le konuştuğunuzda, özel sohbetlerinizden önce sadakat sunun, o zaman yükümlülük kaldırılır ve tavsiye namaz kılma ve zekat emriyle kalır.
    id: Wahai kamu yang beriman, ketika dikatakan untuk memberi ruang di dalam pertemuan, maka berikanlah ruang, Allah akan memberi ruang untukmu. Dan ketika dikatakan, 'Rendahkan diri, maka rendahkan hati.'
      Allah bangkitkan mereka yang telah beriman di antara kamu dan mereka yang diberi ilmu secara bertahap; dan ketika kamu berbicara dengan Rasulullah, mempersembahkan kasih di hadapan percakapan pribadimu,
      maka kewajiban itu dibatalkan, dan rekomendasi tetap bersama perintah untuk berdoa dan zakat.
  children:
  - title:
      ar: التفسح في المجالس
      en: Making Room in Gatherings
      tr: Toplantılarda takılmak
      id: Berkumpul di acara
    range:
    - 11
    - 11
  - title:
      ar: الصدقة قبل المناجاة
      en: Charity Before Private Audience
      tr: Dua öncesi hayırseverlik
      id: Amal sebelum memohon
    range:
    - 12
    - 13
- title:
    ar: المنافقون وحزب الشيطان
    en: The Hypocrites and Satan's Party
    tr: İkiyüzlüler ve Şeytan'ın partisi
    id: Para munafik dan partai Setan
  range:
  - 14
  - 19
  family: faith
  summary:
    ar: توبيخ من يتولون قوما غضب الله عليهم ليسوا من المؤمنين ولا من الكفار، يحلفون على الكذب وهم يعلمون، اتخذوا أيمانهم جنة فصدوا عن سبيل الله؛ استحوذ عليهم الشيطان فأنساهم ذكر الله أولئك حزب الشيطان ألا
      إن حزب الشيطان هم الخاسرون.
    en: 'A rebuke of those who befriend a people Allah is angry with — neither of the believers nor of them — swearing to lies knowingly, taking oaths as a shield to bar Allah''s way; Satan has overcome
      them and made them forget Allah''s remembrance: those are Satan''s party, and Satan''s party are the losers.'
    tr: Allah'ın kızgın olduğu bir komata müttefik olanlar nadir, kafir ve kafir değildir. Onlar bilerek yalan söylerler. Yeminlerini sığınma olarak almışlardır ve Allah yolundan engellenmişlerdir. Şeytan
      onları yakalayıp Allah'ın anmasını unutturmuştur. Bunlar şeytanın tarafıdır. Gerçekten şeytanın tarafı kaybedendir.
    id: Mencela mereka yang mengambil sekutu bagi umat yang Allah marah bukanlah orang beriman atau kafir. Mereka bersumpah dusta selagi mereka tahu. Mereka telah mengambil sumpah sebagai perlindungan dan
      telah dicegah dari jalan Allah. Setan telah menangkap mereka dan membuat mereka lupa akan menyebut Allah. Mereka adalah pihak Setan. Memang, pihak Setan adalah pihak yang kalah.
  children:
  - title:
      ar: تولي قوم غضب الله عليهم
      en: Befriending Those Allah Is Angry With
      tr: Tanrı'nın öfkesi onların üzerine çöker
      id: Umat murka Tuhan menyelimuti mereka
    range:
    - 14
    - 16
  - title:
      ar: استحواذ الشيطان
      en: Satan's Overcoming
      tr: Şeytanın Ele Geçirilmesi
      id: Kepemilikan Setan
    range:
    - 17
    - 19
- title:
    ar: المحادون وحزب الله
    en: The Opposers and Allah's Party
    tr: El-Muheddun ve Hizbullah
    id: Al-Muhaddoon dan Hezbollah
  range:
  - 20
  - 22
  family: faith
  summary:
    ar: 'إن الذين يحادون الله ورسوله أولئك في الأذلين، كتب الله لأغلبن أنا ورسلي؛ لا تجد قوما يؤمنون بالله واليوم الآخر يوادون من حاد الله ورسوله ولو كانوا آباءهم أو أبناءهم أو إخوانهم أو عشيرتهم، أولئك
      كتب في قلوبهم الإيمان وأيدهم بروح منه، ويدخلهم جنات: أولئك حزب الله ألا إن حزب الله هم المفلحون.'
    en: 'Those who oppose Allah and His Messenger are among the most abased; Allah has decreed: I and My messengers shall prevail; you find no people believing in Allah and the Last Day befriending Allah''s
      and His Messenger''s opposers, even were they their fathers, sons, brothers, or kin — He inscribed faith in their hearts and strengthened them with a spirit from Him, admitting them to gardens: those
      are Allah''s party, and Allah''s party are the successful.'
    tr: Gerçekten Allah ve O'nun Elçisine karşı olanlar aşağılananlar arasındadır. Allah, bana ve elçilerime üstün gelmesini buyurdu. Allah'a ve Ahiret Günü'ne iman eden, Allah'a ve Elçi'ne karşı olanlarla
      dost olan bir komit, ister babaları, oğulları, kardeşleri ya da akrabaları olsun, bulamazsınız. Bunlar kalplerinde iman yazılı ve O'nun ruhuyla desteklenmiştir ve O'nun onları cennete kabul edecektir.
      Bunlar Allah'ın partisidir. Gerçekten Allah'ın partisi başarılıdır.
    id: Memang, mereka yang menentang Allah dan Rasul-Nya adalah di antara yang dihina. Allah telah menetapkan bahwa Dia akan menang atas Aku dan para rasul-Ku. Kamu tidak akan menemukan umat yang percaya
      kepada Allah dan pada Hari Terakhir berteman dengan mereka yang menentang Allah dan Rasul-Nya, meskipun mereka adalah ayah, anak, saudara, atau kerabat mereka. Mereka adalah orang-orang yang dalam
      hatinya iman tertulis dan didukung oleh roh dari-Nya, dan Dia akan menerima mereka ke Surga. Mereka adalah pihak Allah. Memang, pihak Allah adalah yang berhasil.
  children:
  - title:
      ar: المحادون في الأذلين
      en: The Opposers Among the Abased
      tr: Aşağılananlar Arasında Marjinalleşenler
      id: Yang Terpinggirkan di antara yang dipermalukan
    range:
