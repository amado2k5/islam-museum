map:
  - title: { ar: "تسبيح الله وخلقه بالحق", en: "Glorifying Allah and His Purposeful Creation" }
    range: [1, 4]
    family: faith
    summary:
      ar: "تسبيح الله مالك الملك وصاحب الحمد والقادر على كل شيء، وخلقه السماوات والأرض بالحق، وتصويره الإنسان أحسن صورة، وعلمه ما يسر العباد وما يعلنون."
      en: "Glorifying Allah, Owner of sovereignty, worthy of praise, powerful over all things; His creation of the heavens and earth with truth, His shaping of man in excellent form, and His knowledge of what people conceal and declare."
    children: []
  - title: { ar: "مصارع المكذبين والدعوة إلى الإيمان", en: "The Fate of the Deniers and the Call to Belief" }
    range: [5, 10]
    family: faith
    summary:
      ar: "تذكير الكافرين بمصارع الأمم المكذبة قبلهم، والرد على إنكارهم البعث، ودعوتهم إلى الإيمان بالله ورسوله والنور المنزل، مع وصف يوم التغابن يوم يجمع الله الناس فيظهر الفائز والخاسر."
      en: "Reminding the disbelievers of the doom of the nations that denied before them, refuting their denial of resurrection, and calling them to believe in Allah, His Messenger, and the sent-down Light — with the description of the Day of Mutual Loss when Allah gathers mankind and the winners and losers are revealed."
    children:
      - { title: { ar: "هلاك الأمم المكذبة", en: "The Destroyed Nations" }, range: [5, 6] }
      - { title: { ar: "إنكار البعث والرد عليه", en: "Denying Resurrection, Refuted" }, range: [7, 7] }
      - { title: { ar: "الدعوة إلى الإيمان", en: "The Call to Believe" }, range: [8, 8] }
      - { title: { ar: "يوم التغابن", en: "The Day of Mutual Loss" }, range: [9, 10] }
  - title: { ar: "القدر والتوكل", en: "Divine Decree and Trust" }
    range: [11, 13]
    family: faith
    summary:
      ar: "ما أصاب من مصيبة إلا بإذن الله، ومن يؤمن بالله يهد قلبه؛ والدعوة إلى طاعة الله ورسوله والتوكل على الله وحده."
      en: "No calamity befalls except by Allah's permission, and whoever believes in Allah, He guides his heart; a call to obey Allah and His Messenger and to trust in Allah alone."
    children: []
  - title: { ar: "فتنة الأموال والأولاد والإنفاق", en: "The Trial of Wealth and Children, and Spending" }
    range: [14, 18]
    family: faith
    summary:
      ar: "تحذير المؤمنين من أن يكون من أزواجهم وأولادهم عدو لهم مع الحث على العفو، وبيان أن الأموال والأولاد فتنة، والختم بالحث على التقوى والسمع والطاعة والإنفاق."
      en: "Warning the believers that some of their spouses and children may be adversaries to them, alongside urging forgiveness; wealth and children are declared a trial, and the surah closes urging God-consciousness, obedience, and spending."
    children:
      - { title: { ar: "الحذر من الأهل والعفو", en: "Caution Toward Family, and Forgiveness" }, range: [14, 14] }
      - { title: { ar: "الأموال والأولاد فتنة", en: "Wealth and Children Are a Trial" }, range: [15, 15] }
      - { title: { ar: "التقوى والإنفاق", en: "God-consciousness and Spending" }, range: [16, 18] }
