- title:
    ar: القدر والتوكل
    en: Divine Decree and Trust
    tr: Kader ve Tanrı'ya Güven
    id: Takdir dan ketergantungan pada Tuhan
  range:
  - 11
  - 13
  family: faith
  summary:
    ar: ما أصاب من مصيبة إلا بإذن الله، ومن يؤمن بالله يهد قلبه؛ والدعوة إلى طاعة الله ورسوله والتوكل على الله وحده.
    en: No calamity befalls except by Allah's permission, and whoever believes in Allah, He guides his heart; a call to obey Allah and His Messenger and to trust in Allah alone.
    tr: Hiçbir felaket Allah'ın izniyle başına gelmez; Allah'a inanan kalbini yönlendirir; Allah'a ve O'nun Elçisine itaat etme ve yalnızca Allah'a güvenme çağrısıdır.
    id: Tidak ada malapetaka yang menimpa kecuali dengan izin Allah, dan siapa pun yang percaya kepada Allah membimbing hatinya; seruan untuk taat kepada Allah dan Rasul-Nya serta mengandalkan Allah semata-mata.
  children: []
- title:
    ar: فتنة الأموال والأولاد والإنفاق
    en: The Trial of Wealth and Children, and Spending
    tr: Para, Çocuklar ve Harcanmanın Cazibesi
    id: Godaan Uang, Anak-anak, dan Pengeluaran
  range:
  - 14
  - 18
  family: faith
  summary:
    ar: تحذير المؤمنين من أن يكون من أزواجهم وأولادهم عدو لهم مع الحث على العفو، وبيان أن الأموال والأولاد فتنة، والختم بالحث على التقوى والسمع والطاعة والإنفاق.
    en: Warning the believers that some of their spouses and children may be adversaries to them, alongside urging forgiveness; wealth and children are declared a trial, and the surah closes urging God-consciousness,
      obedience, and spending.
    tr: İnananları eşlerinin ve çocuklarının düşman olmamasına karşı uyarmak, affetmeyi teşvik etmek, zenginlik ve çocukların bir sınav olduğunu açıklamak ve takva, dinleme, itaat ve hayırseverlik için
      teşvik ile bitirmek.
    id: Memperingatkan orang percaya agar pasangan dan anak-anak mereka tidak menjadi musuh bagi mereka, sambil mendorong pengampunan, memperjelas bahwa kekayaan dan anak-anak adalah ujian, dan mengakhiri
      dengan dorongan untuk kesalehan, mendengarkan, ketaatan, dan amal.
  children:
