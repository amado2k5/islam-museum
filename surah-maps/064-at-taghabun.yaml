map:
- title:
    ar: تسبيح الله وخلقه بالحق
    en: Glorifying Allah and His Purposeful Creation
    tr: Tanrı'yı yüceltmek ve onu gerçekle yaratmak
    id: Memuliakan Tuhan dan menciptakannya dengan kebenaran
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: تسبيح الله مالك الملك وصاحب الحمد والقادر على كل شيء، وخلقه السماوات والأرض بالحق، وتصويره الإنسان أحسن صورة، وعلمه ما يسر العباد وما يعلنون.
    en: Glorifying Allah, Owner of sovereignty, worthy of praise, powerful over all things; His creation of the heavens and earth with truth, His shaping of man in excellent form, and His knowledge of what
      people conceal and declare.
    tr: Egemenliğin sahibi, övgü sahibi ve her şeyin Yeteneklisi Allah'ı yüceltmek; gökleri ve yeryüzünü doğrulukla yaratan, insanı en iyi biçimde tasvir eden, ona hizmetkarların hoşuna giden şeyleri ve
      söylediklerini öğreten.
    id: Memuliakan Allah, Pemilik kekuasaan, Pemilik Pujian, dan Yang Mampu segala sesuatu, yang menciptakan langit dan bumi dengan kebenaran, yang menggambarkan manusia dalam bentuk terbaik, dan mengajarkan
      apa yang menyenangkan para hamba dan apa yang mereka nyatakan.
  children: []
- title:
    ar: مصارع المكذبين والدعوة إلى الإيمان
    en: The Fate of the Deniers and the Call to Belief
    tr: İnkarcıların Gladyatörü ve İnanç Çağrısı
    id: Gladiator Penyangkal dan Seruan untuk Iman
  range:
  - 5
  - 10
  family: faith
  summary:
    ar: تذكير الكافرين بمصارع الأمم المكذبة قبلهم، والرد على إنكارهم البعث، ودعوتهم إلى الإيمان بالله ورسوله والنور المنزل، مع وصف يوم التغابن يوم يجمع الله الناس فيظهر الفائز والخاسر.
    en: Reminding the disbelievers of the doom of the nations that denied before them, refuting their denial of resurrection, and calling them to believe in Allah, His Messenger, and the sent-down Light
      — with the description of the Day of Mutual Loss when Allah gathers mankind and the winners and losers are revealed.
    tr: Kâfirlere, kendilerinden önce kendilerini reddeden ulusların çatışmalarını hatırlatmak, diriltme inkârına yanıt vermek ve Allah'a, O'nun Elçisine ve vahiye iman etmeye çağırmak, Savaş Günü'nü Allah'ın
      insanları bir araya getirdiği ve kazananı kaybedeni ortaya çıkardığı bir gün olarak tanımlar.
    id: Mengingatkan kaum kafir akan bentrokan bangsa-bangsa yang menyangkal mereka di hadapan mereka, menanggapi penolakan mereka atas kebangkitan, dan memanggil mereka untuk beriman kepada Allah, Rasul-Nya,
      dan cahaya yang diwahyukan, sambil menggambarkan Hari Pertempuran sebagai hari ketika Allah mengumpulkan umat dan mengungkapkan pemenang dan yang kalah.
