map:
  - title: { ar: "القارعة", en: "The Striking Calamity" }
    range: [1, 5]
    family: faith
    summary:
      ar: "القارعة ما القارعة وما أدراك ما القارعة: يوم يكون الناس كالفراش المبثوث وتكون الجبال كالعهن المنفوش."
      en: "The Striking Calamity — what is the Striking Calamity? The Day people are like scattered moths and the mountains like carded wool."
    children: []
  - title: { ar: "الموازين", en: "The Scales" }
    range: [6, 11]
    family: faith
    summary:
      ar: "فأما من ثقلت موازينه فهو في عيشة راضية، وأما من خفت موازينه فأمه هاوية وما أدراك ما هيه نار حامية."
      en: "Whose scales are heavy shall live a pleasant life; whose scales are light — his home is the abyss: a blazing fire."
    children: []
