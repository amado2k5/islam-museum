map:
- title:
    ar: القارعة
    en: The Striking Calamity
    tr: El-Kari'a
    id: Al-Qari'a
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'القارعة ما القارعة وما أدراك ما القارعة: يوم يكون الناس كالفراش المبثوث وتكون الجبال كالعهن المنفوش.'
    en: The Striking Calamity — what is the Striking Calamity? The Day people are like scattered moths and the mountains like carded wool.
    tr: 'El-Kari''ah, El-Kari''ah nedir ve sen El-Kari''ah hakkında ne biliyorsun: insanların sert yatak gibi ve dağların kabarık yün gibi olacağı bir gün.'
    id: 'Al-Qari''ah, apa itu Al-Qari''ah, dan apa yang kamu tahu tentang Al-Qari''ah: hari di mana orang-orang akan seperti tempat tidur yang tersebar dan gunung seperti wol yang berbulu.'
  children: []
- title:
    ar: الموازين
    en: The Scales
    tr: Ölçekler
    id: Tangga Nada
  range:
  - 6
  - 11
  family: faith
  summary:
    ar: فأما من ثقلت موازينه فهو في عيشة راضية، وأما من خفت موازينه فأمه هاوية وما أدراك ما هيه نار حامية.
    en: 'Whose scales are heavy shall live a pleasant life; whose scales are light — his home is the abyss: a blazing fire.'
    tr: Pulları ağır olan biri huzurlu bir hayat içindedir; ama pulları hafif olan biri annesi bir uçurumdur, yanan ateşin ne olduğunu ne biliyorsunuz?
    id: Adapun seseorang yang sisiknya berat, dia hidup bahagia; tetapi bagi yang sisiknya ringan, ibunya adalah jurang, dan apa yang kau tahu tentang api yang menyala?
  children: []
