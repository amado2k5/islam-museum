surah: 32
slug: as-sajdah
sources_consulted:
  - "almalomat.com — سورة السجدة (مشتملاتها: 1-3، 4-9، 10-14، 15-17، 18-22، 23-25، 26-30)"
  - "ar.wikipedia.org — سورة السجدة (آية السجدة 15)"
  - "fa.wikipedia.org — سجده (سوره) (تفصيل الآيات)"
map:
  - title: { ar: "إثبات تنزيل القرآن", en: "Affirming the Quran's Revelation" }
    range: [1, 3]
    family: faith
    summary:
      ar: "تنزيل الكتاب لا ريب فيه من رب العالمين؛ بل هو الحق لينذر قوما ما أتاهم من نذير من قبله."
      en: "The revelation of the Book, no doubt in it, from the Lord of worlds — the truth, to warn a people who had no warner before."
    children: []
  - title: { ar: "دلائل التوحيد والقدرة", en: "Proofs of Oneness and Power" }
    range: [4, 9]
    family: faith
    summary:
      ar: "خلق السماوات والأرض في ستة أيام، وتدبير الأمر، وبدء خلق الإنسان من طين ثم نسله من سلالة من ماء مهين."
      en: "Heavens and earth created in six days, the command administered, and man originated from clay then from a despised fluid."
    children:
      - { title: { ar: "الخلق في ستة أيام", en: "Creation in Six Days" }, range: [4, 4] }
      - { title: { ar: "بدء خلق الإنسان", en: "The Origin of Man" }, range: [7, 9] }
  - title: { ar: "إنكار البعث وحال الكفار", en: "Denying Resurrection; the Disbelievers' State" }
    range: [10, 14]
    family: faith
    summary:
      ar: "وقالوا أئذا ضللنا في الأرض أئنا لفي خلق جديد؛ ولو ترى إذ المجرمون ناكسو رءوسهم عند ربهم يطلبون الرجعة."
      en: "'When we are lost in the earth, shall we be in a new creation?' — if you could see the guilty hanging their heads, begging return."
    children: []
  - title: { ar: "صفات المؤمنين وجزاؤهم", en: "Traits of the Believers and Their Reward" }
    range: [15, 17]
    family: faith
    summary:
      ar: "إنما يؤمن بآياتنا الذين إذا ذُكروا بها خروا سجدا؛ تتجافى جنوبهم عن المضاجع يدعون ربهم خوفا وطمعا."
      en: "Only those believe in Our signs who fall prostrate when reminded; their sides forsake their beds, calling their Lord in fear and hope."
    children:
      - { title: { ar: "آية السجدة", en: "The Verse of Prostration" }, range: [15, 15] }
  - title: { ar: "جزاء المؤمنين والفاسقين", en: "The Recompense of Believers and Sinners" }
    range: [18, 22]
    family: faith
    summary:
      ar: "أفمن كان مؤمنا كمن كان فاسقا لا يستوون؛ جنات المأوى للمؤمنين، والنار للفاسقين مع العذاب الأدنى قبل الأكبر."
      en: "Is the believer like the sinner? Never equal: Gardens of refuge for believers, the Fire for sinners, with a nearer torment before the greater."
    children: []
  - title: { ar: "موسى والكتاب", en: "Moses and the Book" }
    range: [23, 25]
    family: stories
    summary:
      ar: "ولقد آتينا موسى الكتاب فلا تكن في مرية من لقائه، وجعلنا من بني إسرائيل أئمة يهدون بأمرنا لما صبروا."
      en: "Moses was given the Book — be not in doubt about meeting it — and leaders were made among the Children of Israel for their patience."
    children: []
  - title: { ar: "العبرة ويوم الفتح", en: "The Lesson; the Day of Decision" }
    range: [26, 30]
    family: faith
    summary:
      ar: "أولم يهد لهم كم أهلكنا من قبلهم من القرون؛ ويسوق الله الماء إلى الأرض الجرز؛ ويوم الفتح لا ينفع الذين كفروا إيمانهم."
      en: "Did so many destroyed generations not guide them? Allah drives water to barren land; on the Day of Decision the disbelievers' faith will not avail."
    children: []
