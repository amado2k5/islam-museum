map:
- title:
    ar: إثبات تنزيل القرآن
    en: Affirming the Quran's Revelation
    tr: Kur'an'ın vahyinin kanıtı
    id: Bukti Wahyu Al-Qur'an
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: تنزيل الكتاب لا ريب فيه من رب العالمين؛ بل هو الحق لينذر قوما ما أتاهم من نذير من قبله.
    en: The revelation of the Book, no doubt in it, from the Lord of worlds — the truth, to warn a people who had no warner before.
    tr: Kitap'ın vahyi dünyaların Rabbi tarafından sorgulanmaz; aksine, kendisinden önce uyarıcı gelmemiş bir topluluğu uyarmak doğrudur.
    id: Wahyu Kitab ini tidak dapat dipertanyakan dari Tuhan segala alam; sebaliknya, kebenaran adalah memperingatkan umat yang tidak pernah didatangi oleh seorang pewaris sebelum Dia.
  children: []
- title:
    ar: دلائل التوحيد والقدرة
    en: Proofs of Oneness and Power
    tr: Tek tanrıcılık ve gücün kanıtları
    id: Bukti Monoteisme dan Kekuasaan
  range:
  - 4
  - 9
  family: faith
  summary:
    ar: خلق السماوات والأرض في ستة أيام، وتدبير الأمر، وبدء خلق الإنسان من طين ثم نسله من سلالة من ماء مهين.
    en: Heavens and earth created in six days, the command administered, and man originated from clay then from a despised fluid.
    tr: Gökyüzünü ve yeri altı günde yarattı, işi düzenledi ve insanı kilden, ardından su soyunun bozulmuş bir soyundan yaratmaya başladı.
    id: Ia menciptakan langit dan bumi dalam enam hari, mengatur urusan itu, dan memulai penciptaan manusia dari tanah liat, lalu keturunannya dari garis keturunan air yang terdegradasi.
  children:
  - title:
      ar: الخلق في ستة أيام
      en: Creation in Six Days
      tr: Altı günde yaratılış
      id: Penciptaan dalam enam hari
    range:
    - 4
    - 4
  - title:
      ar: بدء خلق الإنسان
      en: The Origin of Man
      tr: İnsan yaratılışının başlangıcı
      id: Awal mula penciptaan manusia
    range:
    - 7
    - 9
- title:
    ar: إنكار البعث وحال الكفار
    en: Denying Resurrection; the Disbelievers' State
    tr: Baasizmin inkârı ve kâfirlerin durumu
    id: Penolakan Baathisme dan kondisi kaum kafir
  range:
  - 10
  - 14
  family: faith
  summary:
    ar: وقالوا أئذا ضللنا في الأرض أئنا لفي خلق جديد؛ ولو ترى إذ المجرمون ناكسو رءوسهم عند ربهم يطلبون الرجعة.
    en: '''When we are lost in the earth, shall we be in a new creation?'' — if you could see the guilty hanging their heads, begging return.'
    tr: Ve dediler ki, 'Peki biz toprakta ne zaman yoldan saptık? Yeni bir yaratılış var mı? Ve eğer suçluların Rab'bin önünde başlarını eğip dönüş aradıklarını görebilseydiniz.'
    id: Dan mereka berkata, 'Lalu kapan Kami sesat di tanah ini? Apakah ada ciptaan baru? Dan jika kau bisa melihat ketika para penjahat menundukkan kepala di hadapan Tuhan mereka, mencari balasan.'
  children: []
- title:
    ar: صفات المؤمنين وجزاؤهم
    en: Traits of the Believers and Their Reward
    tr: İnananların Özellikleri ve Ödülleri
    id: Karakteristik Orang Percaya dan Ganjaran Yang Mereka Dapatkan
  range:
  - 15
  - 17
  family: faith
  summary:
    ar: إنما يؤمن بآياتنا الذين إذا ذُكروا بها خروا سجدا؛ تتجافى جنوبهم عن المضاجع يدعون ربهم خوفا وطمعا.
    en: Only those believe in Our signs who fall prostrate when reminded; their sides forsake their beds, calling their Lord in fear and hope.
    tr: Ayetlerimize inananlar ancak hatırlatıldığında secde eder; yanları yataklarından dönerek korku ve umutla Rab'blerine seslenir.
    id: Hanya mereka yang percaya pada ayat Kami, ketika diingatkan akan itu, jatuh sujud; sisi mereka berpaling dari tempat tidur, memanggil Tuhan mereka dengan takut dan harapan.
  children:
  - title:
      ar: آية السجدة
      en: The Verse of Prostration
      tr: secde diyoru
      id: ayat sujud
    range:
    - 15
    - 15
- title:
    ar: جزاء المؤمنين والفاسقين
    en: The Recompense of Believers and Sinners
    tr: İnananların ve Kötülerin Ödülü
    id: Ganjaran bagi Orang Percaya dan Orang Jahat
  range:
  - 18
  - 22
  family: faith
  summary:
    ar: أفمن كان مؤمنا كمن كان فاسقا لا يستوون؛ جنات المأوى للمؤمنين، والنار للفاسقين مع العذاب الأدنى قبل الأكبر.
    en: 'Is the believer like the sinner? Never equal: Gardens of refuge for believers, the Fire for sinners, with a nearer torment before the greater.'
    tr: İnanan, itaatsiz olan ile aynı mıdır? Onlar eşit değildir; sığınma bahçeleri müminler içindir, ateş ise itaatsizlik edenler içindir, en büyük önünde en düşük ceza verilir.
    id: Apakah seseorang yang beriman sama seperti orang yang tidak taat? Mereka tidak setara; taman perlindungan untuk orang beriman, dan api untuk orang yang keras kepala tidak patuh, dengan hukuman paling
      rendah sebelum yang terbesar.
  children: []
- title:
    ar: موسى والكتاب
    en: Moses and the Book
    tr: Musa ve Kitap
    id: Musa dan Kitab
  range:
  - 23
  - 25
  family: stories
  summary:
    ar: ولقد آتينا موسى الكتاب فلا تكن في مرية من لقائه، وجعلنا من بني إسرائيل أئمة يهدون بأمرنا لما صبروا.
    en: Moses was given the Book — be not in doubt about meeting it — and leaders were made among the Children of Israel for their patience.
    tr: Ve Musa'ya Kutsal Kitabı verdik, o yüzden O'nu bulmakta şüphe etmeyin; İsrailoğulları'ndan sabırlı olduklarında emrimizle yol gösteren liderler yaptık.
    id: Dan Kami memberikan Musa Kitab Suci, jadi janganlah ragu untuk bertemu dengannya, dan Kami menciptakan dari anak-anak Israel pemimpin yang membimbing menurut perintah Kami ketika mereka sabar.
  children: []
- title:
    ar: العبرة ويوم الفتح
    en: The Lesson; the Day of Decision
    tr: Ders ve fetih günü
    id: Pelajaran dan hari penaklukan
  range:
  - 26
  - 30
  family: faith
  summary:
    ar: أولم يهد لهم كم أهلكنا من قبلهم من القرون؛ ويسوق الله الماء إلى الأرض الجرز؛ ويوم الفتح لا ينفع الذين كفروا إيمانهم.
    en: Did so many destroyed generations not guide them? Allah drives water to barren land; on the Day of Decision the disbelievers' faith will not avail.
    tr: Onları, onlardan önce kaç nesil yok ettiğimizi göstermedi mi? Allah suyu yere vahşi su gibi atar; ve Zafer gününde, kafirlerin iman faydası olmaz.
    id: Bukankah Dia membimbing mereka berapa banyak generasi yang Kita hancurkan sebelum mereka? Allah meneteskan air ke bumi seperti yang liar; dan pada Hari Kemenangan, iman mereka yang tidak percaya
      tidak akan bermanfaat.
  children: []
