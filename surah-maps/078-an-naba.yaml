map:
- title:
    ar: النبأ العظيم
    en: The Great News
    tr: Harika Haber
    id: Kabar Besar
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'يتساءلون عن النبأ العظيم الذي هم فيه مختلفون، وتهديد مؤكد مكرر: كلا سيعلمون.'
    en: 'They question one another about the Great News they dispute; a twice-repeated warning: no indeed, they will come to know.'
    tr: 'Büyük haberler hakkında farklı fikirde olmaları ve tekrar eden bir tehdit hakkında merak ederler: hayır, bilecekler.'
    id: 'Mereka bertanya-tanya tentang kabar baik yang berbeda pendapat mereka, dan ancaman yang dikonfirmasi berulang: tidak, mereka akan tahu.'
  children: []
- title:
    ar: نعم الله في الخلق
    en: Blessings in Creation
    tr: Tanrı yaratılışın en iyisidir
    id: Tuhan adalah yang terbaik dalam ciptaan
  range:
  - 6
  - 16
  family: faith
  summary:
    ar: الأرض مهادا والجبال أوتادا، والنوم سباتا والليل لباسا، وإنزال الماء المعصرات وإنبات الجنات.
    en: The earth a bed, mountains as pegs, sleep as rest, night as covering — water poured down and gardens grown.
    tr: Toprak dinlenir, dağlar bulunur, uyku uykudadır ve gece giydirilir, su preslere ve bahçelere gönderilir ve büyümesi için bahçeler vardır.
    id: Bumi diistirahatkan dan gunung-gunung ditemukan, tidur beristirahat dan malam dibalut, air diturunkan ke tempat pemakaian dan taman untuk tumbuh.
  children: []
- title:
    ar: يوم الفصل وجهنم
    en: The Day of Decision and Hell
    tr: Kıyamet Günü ve Cehennem
    id: Hari Penghakiman dan Neraka
  range:
  - 17
  - 30
  family: faith
  summary:
    ar: 'إن يوم الفصل كان ميقاتا: ينفخ في الصور وتفتح السماء وتسير الجبال، وجهنم كانت مرصادا للطاغين.'
    en: 'The Day of Decision is an appointed time: the trumpet, opened skies, vanishing mountains — Hell lying in ambush for the transgressors.'
    tr: 'Kıyamet Günü sabit bir zamandı: boru çalındı, gökyüzü açıldı, dağlar hareket etti ve Cehennem zalimlerin dinlenme yeriydi.'
    id: 'Hari Penghakiman adalah waktu yang tetap: terompet ditiup, langit dibuka, gunung-gunung dipindahkan, dan Neraka menjadi tempat istirahat para tiran.'
  children: []
- title:
    ar: فوز المتقين
    en: The Triumph of the Godfearing
    tr: Doğruların Zaferi
    id: Kemenangan Orang Benar
  range:
  - 31
  - 40
  family: faith
  summary:
    ar: 'إن للمتقين مفازا: حدائق وأعنابا وكأسا دهاقا، ويوم يقوم الروح والملائكة صفا، ويقول الكافر يا ليتني كنت ترابا.'
    en: 'For the Godfearing is triumph: gardens, grapevines, a full cup; the Day the Spirit and angels stand in ranks — and the disbeliever wishes he were dust.'
    tr: 'Gerçekten de, doğru olanlar için bir sığınak vardır: bahçeler, üzümler ve bir fincan çay; ve o gün Ruh ve melekler sıraya girer, inkar eden, ''Keşke toprak olsaydım'' der.'
    id: 'Memang, bagi orang benar ada tempat perlindungan: taman, anggur, dan secangkir teh, dan pada hari itu Roh dan malaikat akan berdiri berbaris, dan orang kafir akan berkata, ''Aku berharap aku adalah
      debu.'''
  children: []
