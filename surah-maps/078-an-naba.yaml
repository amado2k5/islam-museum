surah: 78
slug: an-naba
sources_consulted:
  - "kuttab.com — Surah An-Naba mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "النبأ العظيم", en: "The Great News" }
    range: [1, 5]
    family: faith
    summary:
      ar: "يتساءلون عن النبأ العظيم الذي هم فيه مختلفون، وتهديد مؤكد مكرر: كلا سيعلمون."
      en: "They question one another about the Great News they dispute; a twice-repeated warning: no indeed, they will come to know."
    children: []
  - title: { ar: "نعم الله في الخلق", en: "Blessings in Creation" }
    range: [6, 16]
    family: faith
    summary:
      ar: "الأرض مهادا والجبال أوتادا، والنوم سباتا والليل لباسا، وإنزال الماء المعصرات وإنبات الجنات."
      en: "The earth a bed, mountains as pegs, sleep as rest, night as covering — water poured down and gardens grown."
    children: []
  - title: { ar: "يوم الفصل وجهنم", en: "The Day of Decision and Hell" }
    range: [17, 30]
    family: faith
    summary:
      ar: "إن يوم الفصل كان ميقاتا: ينفخ في الصور وتفتح السماء وتسير الجبال، وجهنم كانت مرصادا للطاغين."
      en: "The Day of Decision is an appointed time: the trumpet, opened skies, vanishing mountains — Hell lying in ambush for the transgressors."
    children: []
  - title: { ar: "فوز المتقين", en: "The Triumph of the Godfearing" }
    range: [31, 40]
    family: faith
    summary:
      ar: "إن للمتقين مفازا: حدائق وأعنابا وكأسا دهاقا، ويوم يقوم الروح والملائكة صفا، ويقول الكافر يا ليتني كنت ترابا."
      en: "For the Godfearing is triumph: gardens, grapevines, a full cup; the Day the Spirit and angels stand in ranks — and the disbeliever wishes he were dust."
    children: []
