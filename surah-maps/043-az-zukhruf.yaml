surah: 43
slug: az-zukhruf
sources_consulted:
  - "جواهر العلماء — سورة الزخرف بالتفسير الميسر (التسلسل الزمني للآيات والمقاصد)"
  - "arz.wikipedia.org — سورة الزخرف (موضوع السورة)"
  - "alukah.net — تفسير سورة الزخرف للناشئين (1-25)"
  - "quran.com API — التحقق من بدايات المقاطع (9، 16، 26، 36، 46، 57، 68، 74)"
map:
  - title: { ar: "القرآن المبين", en: "The Clear Book" }
    range: [1, 8]
    family: faith
    summary:
      ar: "حم؛ والكتاب المبين؛ إنا جعلناه قرآنا عربيا؛ وكم أرسلنا من نبي في الأولين فكانوا به يستهزئون فأهلكناهم."
      en: "Ha-Mim; and the clear Book; We made it an Arabic Quran; how many a prophet We sent among the ancients — they mocked him, and We destroyed them."
    children:
      - { title: { ar: "قرآن عربي", en: "An Arabic Quran" }, range: [3, 4] }
      - { title: { ar: "مصير المستهزئين", en: "The Mockers' End" }, range: [6, 8] }
  - title: { ar: "دلائل القدرة والنعم", en: "Proofs of Power; Blessings" }
    range: [9, 15]
    family: faith
    summary:
      ar: "ولئن سألتهم من خلق السماوات والأرض ليقولن خلقهن العزيز العليم؛ الذي جعل لكم الأرض مهدا؛ وأنزل من السماء ماء؛ وخلق الأزواج والفلك والأنعام لتركبوها."
      en: "Ask them who created the heavens and earth — 'the Mighty, the Knowing'; who made the earth a cradle, sent down water, created kinds, ships and cattle for you to ride."
    children:
      - { title: { ar: "الماء وإحياء الميت", en: "Water; Reviving the Dead Land" }, range: [11, 11] }
      - { title: { ar: "دعاء الركوب", en: "The Riding Supplication" }, range: [13, 14] }
  - title: { ar: "فرية البنات والتقليد", en: "The Daughters Lie; Blind Imitation" }
    range: [16, 25]
    family: faith
    summary:
      ar: "أم اتخذ مما يخلق بنات وأصفاكم بالبنين؛ وجعلوا الملائكة الذين هم عباد الرحمن إناثا؛ وقالوا وجدنا آباءنا على أمة."
      en: "Has He taken daughters from what He creates and favored you with sons? They made the angels — servants of the Merciful — females; 'we found our forefathers on a creed.'"
    children:
      - { title: { ar: "الملائكة بنات الله", en: "'The Angels Are Allah's Daughters'" }, range: [16, 20] }
      - { title: { ar: "التقليد الأعمى", en: "Blind Imitation" }, range: [22, 24] }
  - title: { ar: "إبراهيم وقسمة الرحمة", en: "Abraham; the Apportioning of Mercy" }
    range: [26, 35]
    family: faith
    summary:
      ar: "وإذ قال إبراهيم لأبيه وقومه إنني براء مما تعبدون؛ وقالوا لولا نزل هذا القرآن على رجل من القريتين عظيم؛ أهم يقسمون رحمة ربك."
      en: "Abraham told his father and people: I am quit of what you worship; they said: why was this Quran not sent to a great man of the two towns? Is it they who apportion your Lord's mercy?"
    children:
      - { title: { ar: "براءة إبراهيم من الشرك", en: "Abraham's Disavowal of Association" }, range: [26, 28] }
      - { title: { ar: "لولا نزل على رجل عظيم", en: "'Why Not Sent to a Great Man'" }, range: [31, 31] }
      - { title: { ar: "هوان الدنيا", en: "The World's Pettiness" }, range: [33, 35] }
  - title: { ar: "القرين والاستمساك بالوحي", en: "The Companion; Holding to Revelation" }
    range: [36, 45]
    family: faith
    summary:
      ar: "ومن يعش عن ذكر الرحمن نقيض له شيطانا فهو له قرين؛ فاستمسك بالذي أوحي إليك إنك على صراط مستقيم؛ واسأل من أرسلنا من قبلك من رسلنا."
      en: "Whoever is blind to the Merciful's remembrance — We appoint a devil as companion; hold fast to what was revealed to you; ask those We sent before you among Our messengers."
    children:
      - { title: { ar: "قرين الشيطان", en: "The Devilish Companion" }, range: [36, 39] }
      - { title: { ar: "فاستمسك بالذي أوحي إليك", en: "Hold Fast to What Was Revealed" }, range: [43, 44] }
  - title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }
    range: [46, 56]
    family: stories
    summary:
      ar: "ولقد أرسلنا موسى بآياتنا إلى فرعون وملئه؛ فاستخف قومه فأطاعوه؛ فلما آسفونا انتقمنا منهم فأغرقناهم أجمعين."
      en: "We sent Moses with Our signs to Pharaoh and his chiefs; he deemed his people light-minded and they obeyed him; when they angered Us, We drowned them all."
    children:
      - { title: { ar: "استخفاف فرعون بقومه", en: "Pharaoh Deeming His People Light" }, range: [51, 54] }
  - title: { ar: "عيسى والساعة", en: "Jesus; the Hour" }
    range: [57, 67]
    family: faith
    summary:
      ar: "ولما ضرب ابن مريم مثلا إذا قومك منه يصدون؛ إن هو إلا عبد أنعمنا عليه؛ وإنه لعلم للساعة فلا تمترن بها."
      en: "When the son of Mary was cited as an example, your people jeered; he was but a servant We blessed; and he is a sign of the Hour — do not doubt it."
    children:
      - { title: { ar: "عيسى عبد منعَم عليه", en: "Jesus: a Blessed Servant" }, range: [57, 60] }
      - { title: { ar: "علم الساعة", en: "A Sign of the Hour" }, range: [61, 67] }
  - title: { ar: "المتقون في الجنة", en: "The God-conscious in Paradise" }
    range: [68, 73]
    family: faith
    summary:
      ar: "يا عباد لا خوف عليكم اليوم ولا أنتم تحزنون؛ الذين آمنوا بآياتنا وكانوا مسلمين ادخلوا الجنة أنتم وأزواجكم تحبرون."
      en: "O My servants, no fear upon you today, nor shall you grieve — those who believed Our signs and submitted: enter Paradise, you and your spouses, delighted."
    children: []
  - title: { ar: "المجرمون والخاتمة", en: "The Guilty; the Conclusion" }
    range: [74, 89]
    family: faith
    summary:
      ar: "إن المجرمين في عذاب جهنم خالدون؛ لقد جئناكم بالحق؛ قل إن كان للرحمن ولد فأنا أول العابدين؛ فذرهم يخوضوا ويلعبوا."
      en: "The guilty in Hell's torment, abiding; We brought you the truth; say: had the Merciful a son I would be first to worship — so leave them to blunder and play."
    children:
      - { title: { ar: "المجرمون في جهنم", en: "The Guilty in Hell" }, range: [74, 77] }
      - { title: { ar: "إن كان للرحمن ولد", en: "'Had the Merciful a Son'" }, range: [81, 82] }
