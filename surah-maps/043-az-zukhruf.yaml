map:
- title:
    ar: القرآن المبين
    en: The Clear Book
    tr: Açık Kur'an
    id: Al-Qur'an yang jelas
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: حم؛ والكتاب المبين؛ إنا جعلناه قرآنا عربيا؛ وكم أرسلنا من نبي في الأولين فكانوا به يستهزئون فأهلكناهم.
    en: Ha-Mim; and the clear Book; We made it an Arabic Quran; how many a prophet We sent among the ancients — they mocked him, and We destroyed them.
    tr: Ve beral Kitap; biz onu Arapça Kur'an yaptık; ve önceki komanlar arasında kaç peygamber gönderdik, onlar onunla alay ettiler, biz de onları yok ettik.
    id: Dan kitab yang jelas; Kami telah menjadikannya Al-Qur'an Arab; dan berapa banyak nabi yang Kami kirim ke antara bangsa-bangsa dahulu, dan mereka mengejeknya, maka Kami menghancurkan mereka.
  children:
  - title:
      ar: قرآن عربي
      en: An Arabic Quran
      tr: Arapça Kur'an
      id: Al-Qur'an Arab
    range:
    - 3
    - 4
  - title:
      ar: مصير المستهزئين
      en: The Mockers' End
      tr: Alaycıların kaderi
      id: Nasib para penghinaan
    range:
    - 6
    - 8
- title:
    ar: دلائل القدرة والنعم
    en: Proofs of Power; Blessings
    tr: Yetenek ve Nimetlerin Belirtileri
    id: Tanda-tanda Kemampuan dan Berkat
  range:
  - 9
  - 15
  family: faith
  summary:
    ar: ولئن سألتهم من خلق السماوات والأرض ليقولن خلقهن العزيز العليم؛ الذي جعل لكم الأرض مهدا؛ وأنزل من السماء ماء؛ وخلق الأزواج والفلك والأنعام لتركبوها.
    en: Ask them who created the heavens and earth — 'the Mighty, the Knowing'; who made the earth a cradle, sent down water, created kinds, ships and cattle for you to ride.
    tr: 'Onlara gökleri ve yeri kimin yarattığını sorarsanız, şöyle derler: ''Onları Kudretli, Her Şeyi bilen tarafından yarattı; o sizin için yeryüzünü beşik yaptı; gökyüzünden su indirdi; ve sizin için
      çiftler, gemi ve hayvanları yarattı.'' derler.'
    id: Dan jika kamu bertanya siapa yang menciptakan langit dan bumi, mereka akan berkata, 'Dia menciptakan mereka oleh Yang Perkasa, Yang Maha Tahu; yang menjadikan bumi untukmu sebagai buaian; menurunkan
      air dari langit; dan menciptakan pasangan, bahtera, dan ternak untuk kamu tunggangi.'
  children:
  - title:
      ar: الماء وإحياء الميت
      en: Water; Reviving the Dead Land
      tr: Su ve Ölülerin Dirilişi
      id: Air dan Kebangkitan Orang Mati
    range:
    - 11
    - 11
  - title:
      ar: دعاء الركوب
      en: The Riding Supplication
      tr: Binme Duası
      id: Doa Berkuda
    range:
    - 13
    - 14
- title:
    ar: فرية البنات والتقليد
    en: The Daughters Lie; Blind Imitation
    tr: Kızların Müstehcilliği ve Takliti
    id: Kevulgaran dan Tiruan Gadis-gadis
  range:
  - 16
  - 25
  family: faith
  summary:
    ar: أم اتخذ مما يخلق بنات وأصفاكم بالبنين؛ وجعلوا الملائكة الذين هم عباد الرحمن إناثا؛ وقالوا وجدنا آباءنا على أمة.
    en: Has He taken daughters from what He creates and favored you with sons? They made the angels — servants of the Merciful — females; 'we found our forefathers on a creed.'
    tr: 'Yoksa kızları yaratanlardan alıp sizi oğullarla mı tasvir etti? Ve Merhametli''nin hizmetkarları olan melekleri dişi yaptılar ve dediler: ''Atalarımızı bir millet üzerinde bulduk.'''
    id: Atau apakah Dia mengambil dari apa yang menciptakan anak perempuan dan menggambarkan kamu sebagai anak laki-laki? Dan mereka menjadikan malaikat, hamba Yang Maha Penyayang, sebagai perempuan; dan
      berkata, 'Kami menemukan leluhur kami atas sebuah bangsa.'
  children:
  - title:
      ar: الملائكة بنات الله
      en: '''The Angels Are Allah''s Daughters'''
      tr: Melekler Tanrı'nın kızlarıdır
      id: Malaikat adalah putri Allah
    range:
    - 16
    - 20
  - title:
      ar: التقليد الأعمى
      en: Blind Imitation
      tr: kör taklit
      id: tiruan buta
    range:
    - 22
    - 24
- title:
    ar: إبراهيم وقسمة الرحمة
    en: Abraham; the Apportioning of Mercy
    tr: İbrahim ve merhamet paylaşımı
    id: Ibrahim dan pembagian belas kasihan
  range:
  - 26
  - 35
  family: faith
  summary:
    ar: وإذ قال إبراهيم لأبيه وقومه إنني براء مما تعبدون؛ وقالوا لولا نزل هذا القرآن على رجل من القريتين عظيم؛ أهم يقسمون رحمة ربك.
    en: 'Abraham told his father and people: I am quit of what you worship; they said: why was this Quran not sent to a great man of the two towns? Is it they who apportion your Lord''s mercy?'
    tr: İbrahim babasına ve kaminine, 'Ben sizin ibadet ettiğiniz şeyden masumum' dedi. Onlar da dediler ki, 'Bu Kur'an neden iki şehirden büyük bir adama indirilmedi? Rabbinizin merhametine yemin ederler.'
    id: Dan ketika Abraham berkata kepada ayahnya dan umatnya, 'Aku tidak bersalah atas apa yang kau sembah.' Mereka berkata, 'Mengapa Al-Qur'an ini tidak diwahyukan kepada seorang tokoh besar dari dua
      kota itu? Mereka bersumpah dengan rahmat Tuhanmu.'
  children:
  - title:
      ar: براءة إبراهيم من الشرك
      en: Abraham's Disavowal of Association
      tr: İbrahim'in çoktanrıcılıktan masumiyeti
      id: Ketidakbersalahan Abraham dari politeisme
    range:
    - 26
    - 28
  - title:
      ar: لولا نزل على رجل عظيم
      en: '''Why Not Sent to a Great Man'''
      tr: Büyük bir adamın soyundan gelmeseydi.
      id: Andai saja bukan karena keturunan seorang pria hebat.
    range:
    - 31
    - 31
  - title:
      ar: هوان الدنيا
      en: The World's Pettiness
      tr: Dünyanın aşağılanması
      id: Penghinaan dunia
    range:
    - 33
    - 35
- title:
    ar: القرين والاستمساك بالوحي
    en: The Companion; Holding to Revelation
    tr: Yoldaş ve Vahiy'e Tutunmak
    id: Teman dan Bertahan pada Wahyu
  range:
  - 36
  - 45
  family: faith
  summary:
    ar: ومن يعش عن ذكر الرحمن نقيض له شيطانا فهو له قرين؛ فاستمسك بالذي أوحي إليك إنك على صراط مستقيم؛ واسأل من أرسلنا من قبلك من رسلنا.
    en: Whoever is blind to the Merciful's remembrance — We appoint a devil as companion; hold fast to what was revealed to you; ask those We sent before you among Our messengers.
    tr: Ve kim Merhametli'nin hatırından kaçınırsa, ona şeytan vardır; o da yoldaştır; o da size vazedilenlere sıkı tutunun. Doğru, doğru bir yoldasınız; ve bizden önce gönderdiğimiz peygamberlerimize sorun.
    id: Dan siapa pun yang menghindari ingatan akan Yang Maha Penyayang, iblis adalah baginya, maka dia adalah teman; maka bertahanlah teguh pada apa yang telah diwahyukan kepadamu. Memang, kamu berada
      di jalan yang benar; dan mintalah mereka yang Kami utus sebelum kalian di antara utusan Kami.
  children:
  - title:
      ar: قرين الشيطان
      en: The Devilish Companion
      tr: Şeytanın Yoldaşı
      id: Teman Setan
    range:
    - 36
    - 39
  - title:
      ar: فاستمسك بالذي أوحي إليك
      en: Hold Fast to What Was Revealed
      tr: O yüzden sana açıklananlara sıkı sıkıya tutun.
      id: Jadi bertahanlah dengan apa yang telah diwahyukan kepadamu.
    range:
    - 43
    - 44
- title:
    ar: موسى وفرعون
    en: Moses and Pharaoh
    tr: Musa ve Firavun
    id: Musa dan Firaun
  range:
  - 46
  - 56
  family: stories
  summary:
    ar: ولقد أرسلنا موسى بآياتنا إلى فرعون وملئه؛ فاستخف قومه فأطاعوه؛ فلما آسفونا انتقمنا منهم فأغرقناهم أجمعين.
    en: We sent Moses with Our signs to Pharaoh and his chiefs; he deemed his people light-minded and they obeyed him; when they angered Us, We drowned them all.
    tr: Musa'yı işaretlerimizle Firavun'a gönderdik ve onu doldurduk; onun halkı onu küçümsedi ve itaat etti; ama onlar pişman olduklarında, onlardan intikam aldık ve hepsini birlikte boğduk.
    id: Kami mengirim Musa dengan tanda-tanda Kami kepada Firaun dan memenuhi dirinya; umat-Nya merendahkannya dan mematuhinya; tetapi ketika mereka menyesal, Kami membalas dendam dan menenggelamkan mereka
      semua.
  children:
  - title:
      ar: استخفاف فرعون بقومه
      en: Pharaoh Deeming His People Light
      tr: Firavun'un halkına karşı umursamazlığı
      id: Pengabaian Firaun terhadap umatnya
    range:
    - 51
    - 54
- title:
    ar: عيسى والساعة
    en: Jesus; the Hour
    tr: İsa ve Saat
    id: Yesus dan Jamnya
  range:
  - 57
  - 67
  family: faith
  summary:
    ar: ولما ضرب ابن مريم مثلا إذا قومك منه يصدون؛ إن هو إلا عبد أنعمنا عليه؛ وإنه لعلم للساعة فلا تمترن بها.
    en: When the son of Mary was cited as an example, your people jeered; he was but a servant We blessed; and he is a sign of the Hour — do not doubt it.
    tr: 'Ve Meryem''in oğlu örnek verdiğinde: ''Eğer halkınız O''ndansa, onları geri çevirecekler''; o, bizim lütuf ettiğimiz bir hizmetten ibarettir; ve gerçekten de Saatin bilgisidir, bu yüzden çekinmeden
      yap.'
    id: 'Dan ketika putra Maria memberi contoh: ''Jika umatmu berasal dari-Nya, mereka akan menjauhkan mereka''; dia hanyalah hamba yang telah Kami berikan rahmat; dan memang, dia adalah pengetahuan tentang
      Jam, maka jangan ragu untuk melakukannya.'
  children:
  - title:
      ar: عيسى عبد منعَم عليه
      en: 'Jesus: a Blessed Servant'
      tr: Eissa Abd Mun'im Alayh
      id: Eissa Abd Mun'im Alayh
    range:
    - 57
    - 60
  - title:
      ar: علم الساعة
      en: A Sign of the Hour
      tr: Saat Bilimi
      id: Ilmu Jam
    range:
    - 61
    - 67
- title:
    ar: المتقون في الجنة
    en: The God-conscious in Paradise
    tr: Cennetteki dindar
    id: Orang saleh di Surga
  range:
  - 68
  - 73
  family: faith
  summary:
    ar: يا عباد لا خوف عليكم اليوم ولا أنتم تحزنون؛ الذين آمنوا بآياتنا وكانوا مسلمين ادخلوا الجنة أنتم وأزواجكم تحبرون.
    en: 'O My servants, no fear upon you today, nor shall you grieve — those who believed Our signs and submitted: enter Paradise, you and your spouses, delighted.'
    tr: Ey kullar, bugün üzerinizde korku yoktur, üzülmezsiniz; ayetlerimize iman eden ve Müslüman olanlar, siz ve eşleriniz cennete dönerek girin.
    id: Wahai hamba, hari ini tidak ada rasa takut di atas kalian, dan kalian tidak berduka; mereka yang percaya pada ayat Kami dan menjadi Muslim, masuk Surga, kamu dan pasangan kalian, bertobat.
  children: []
- title:
    ar: المجرمون والخاتمة
    en: The Guilty; the Conclusion
    tr: Suçlular ve Sonuç
    id: Para Penjahat dan Kesimpulan
  range:
  - 74
  - 89
  family: faith
  summary:
    ar: إن المجرمين في عذاب جهنم خالدون؛ لقد جئناكم بالحق؛ قل إن كان للرحمن ولد فأنا أول العابدين؛ فذرهم يخوضوا ويلعبوا.
    en: 'The guilty in Hell''s torment, abiding; We brought you the truth; say: had the Merciful a son I would be first to worship — so leave them to blunder and play.'
    tr: 'Suçlular cehennemin cezasında sonsuza dek kalır; biz size gerçeği getirdik. De ki: ''Eğer Merhametli''nin bir oğlu varsa, ibadet edenlerin ilkiyim benim.'' Bırakın onları dolaşıp oynasınlar.'
    id: Memang, para penjahat akan tetap selamanya dalam hukuman Neraka; Kami telah membawa kebenaran kepadamu. Katakanlah, 'Jika Yang Maha Penyayang memiliki seorang putra, maka akulah yang pertama di
      antara para penyembah.' Jadi biarkan mereka mengembara dan bermain.
  children:
  - title:
      ar: المجرمون في جهنم
      en: The Guilty in Hell
      tr: Cehennemdeki suçlular
      id: Penjahat di neraka
    range:
    - 74
    - 77
  - title:
      ar: إن كان للرحمن ولد
      en: '''Had the Merciful a Son'''
      tr: Eğer Merhametli Olan'ın bir oğlu varsa
      id: Jika Yang Maha Penyayang memiliki seorang putra
    range:
    - 81
    - 82
