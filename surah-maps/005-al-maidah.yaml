map:
  - title: { ar: "أوفوا بالعقود", en: "Fulfil Your Contracts" }
    range: [1, 11]
    family: law
    summary:
      ar: "الوفاء بالعهود: الحلال والحرام في الطعام، والوضوء والتيمم، والعدل حتى مع من نبغض."
      en: "Keeping covenants: the lawful and forbidden in food, ablution and dry purification, and justice even toward those hated."
    children:
      - { title: { ar: "أوفوا بالعقود", en: "Fulfil the Contracts" }, range: [1, 1] }
      - { title: { ar: "محرمات الطعام", en: "Forbidden Foods" }, range: [3, 3] }
      - { title: { ar: "الوضوء والتيمم", en: "Ablution and Tayammum" }, range: [6, 6] }
      - { title: { ar: "اعدلوا هو أقرب للتقوى", en: "Be Just — Nearer to Piety" }, range: [8, 8] }
  - title: { ar: "المواثيق: النقباء والأرض المقدسة", en: "The Covenants: Chiefs and the Holy Land" }
    range: [12, 26]
    family: stories
    summary:
      ar: "ميثاق بني إسرائيل والنقباء الاثني عشر، وأمرهم بدخول الأرض المقدسة فأبوا، فكان التيه أربعين سنة."
      en: "The covenant with the Israelites and their twelve chiefs; commanded to enter the holy land they refused — forty years of wandering."
    children:
      - { title: { ar: "النقباء الاثنا عشر", en: "The Twelve Chiefs" }, range: [12, 13] }
      - { title: { ar: "ادخلوا الأرض المقدسة", en: "Enter the Holy Land" }, range: [21, 21] }
      - { title: { ar: "فاذهب أنت وربك", en: "Go, You and Your Lord" }, range: [24, 24] }
      - { title: { ar: "أربعين سنة يتيهون", en: "Forty Years Wandering" }, range: [26, 26] }
  - title: { ar: "ابنا آدم وشرائع الكتب", en: "The Two Sons of Adam and the Scriptures' Laws" }
    range: [27, 50]
    family: law
    summary:
      ar: "قصة ابني آدم والغراب، وحرمة القتل، وحد الحرابة والسرقة، وشريعة التوراة والإنجيل والقرآن المهيمن."
      en: "The two sons of Adam and the crow, the sanctity of life, the penalties for waging war and theft, and the law of Torah, Gospel, and the guarding Quran."
    children:
      - { title: { ar: "ابنا آدم والغراب", en: "The Two Sons and the Crow" }, range: [27, 31] }
      - { title: { ar: "من قتل نفسا", en: "Whoever Kills a Soul" }, range: [32, 32] }
      - { title: { ar: "حد الحرابة", en: "The Penalty for Waging War" }, range: [33, 34] }
      - { title: { ar: "حد السرقة", en: "The Penalty for Theft" }, range: [38, 38] }
      - { title: { ar: "الحكم بما أنزل الله", en: "Judging by What Allah Revealed" }, range: [44, 49] }
  - title: { ar: "الولاء وأقربهم مودة", en: "Loyalty and the Nearest in Affection" }
    range: [51, 86]
    family: faith
    summary:
      ar: "النهي عن موالاة أعداء الدين، وولاية الله ورسوله والمؤمنين، وكفر الغلو في عيسى، وأقرب الناس مودة."
      en: "No alliance with religion's enemies; loyalty belongs to Allah, His Messenger, and believers; the excess over Jesus refuted; the nearest in affection."
    children:
      - { title: { ar: "لا تتخذوا اليهود والنصارى أولياء", en: "No Allies from Jews and Christians" }, range: [51, 51] }
      - { title: { ar: "إنما وليكم الله", en: "Your Ally Is Allah" }, range: [55, 56] }
      - { title: { ar: "كفر التثليث", en: "The Trinity Refuted" }, range: [72, 73] }
      - { title: { ar: "أقربهم مودة", en: "Nearest in Affection" }, range: [82, 82] }
  - title: { ar: "الأيمان والخمر والمائدة", en: "Oaths, Wine, and the Table" }
    range: [87, 120]
    family: law
    summary:
      ar: "لا تحريم للطيبات، وتحريم الخمر والميسر، وأحكام الصيد حال الإحرام والوصية، ثم المائدة وسؤال عيسى يوم القيامة."
      en: "No forbidding Allah's good things; wine and gambling forbidden; game rules in pilgrim garb, bequests; then the Table and Jesus questioned on the Last Day."
    children:
      - { title: { ar: "لا تحرموا الطيبات", en: "Do Not Forbid Good Things" }, range: [87, 87] }
      - { title: { ar: "الخمر والميسر رجس", en: "Wine and Gambling Are Filth" }, range: [90, 91] }
      - { title: { ar: "الصيد حال الإحرام", en: "Game While in Ihram" }, range: [95, 96] }
      - { title: { ar: "شهادة الوصية", en: "Testimony at Bequest" }, range: [106, 108] }
      - { title: { ar: "المائدة", en: "The Table Spread" }, range: [112, 115] }
      - { title: { ar: "سؤال عيسى يوم القيامة", en: "Jesus Questioned on the Last Day" }, range: [116, 118] }
