- title:
    ar: الأيمان والخمر والمائدة
    en: Oaths, Wine, and the Table
    tr: Yeminler, şarap ve masa
    id: Sumpah, anggur, dan meja makan
  range:
  - 87
  - 120
  family: law
  summary:
    ar: لا تحريم للطيبات، وتحريم الخمر والميسر، وأحكام الصيد حال الإحرام والوصية، ثم المائدة وسؤال عيسى يوم القيامة.
    en: No forbidding Allah's good things; wine and gambling forbidden; game rules in pilgrim garb, bequests; then the Table and Jesus questioned on the Last Day.
    tr: İyi şeylerin yasağı yoktur, şarap ve kumar yasakları yoktur, İhram döneminde avcılık ve Kıyamet Günü'nde İsa'nın emirleri, ardından sofra ve sorgulama yasakları yoktur.
    id: Tidak ada larangan atas hal-hal baik, tidak ada larangan anggur dan perjudian, juga tidak ada aturan berburu selama masa Ihram, dan perintah itu, lalu meja makan dan pertanyaan Yesus pada Hari Penghakiman.
