- title:
    ar: 'المواثيق: النقباء والأرض المقدسة'
    en: 'The Covenants: Chiefs and the Holy Land'
    tr: 'Tüzükler: Kaptanlar ve Kutsal Topraklar'
    id: 'Piagam Gereja: Para Kapten dan Tanah Suci'
  range:
  - 12
  - 26
  family: stories
  summary:
    ar: ميثاق بني إسرائيل والنقباء الاثني عشر، وأمرهم بدخول الأرض المقدسة فأبوا، فكان التيه أربعين سنة.
    en: The covenant with the Israelites and their twelve chiefs; commanded to enter the holy land they refused — forty years of wandering.
    tr: İsrailoğulları ve on iki liderin antlaşmasını ve Kutsal Topraklara girmelerini emretti, ancak reddettiler, böylece karmaşa kırk yıl sürdü.
    id: Perjanjian antara orang Israel dan dua belas pemimpin, memerintahkan mereka untuk masuk ke Tanah Suci, tetapi mereka menolak, sehingga kekacauan berlangsung selama empat puluh tahun.
