- title:
    ar: ابنا آدم وشرائع الكتب
    en: The Two Sons of Adam and the Scriptures' Laws
    tr: Adem'in Oğulları ve Kutsal Yazıların Yasaları
    id: Anak-anak Adam dan Hukum-hukum Kitab Suci
  range:
  - 27
  - 50
  family: law
  summary:
    ar: قصة ابني آدم والغراب، وحرمة القتل، وحد الحرابة والسرقة، وشريعة التوراة والإنجيل والقرآن المهيمن.
    en: The two sons of Adam and the crow, the sanctity of life, the penalties for waging war and theft, and the law of Torah, Gospel, and the guarding Quran.
    tr: Adem ve karganın oğullarının hikayesi, öldürmenin yasaklanması, mızrak ve hırsızlık cezası, Tevrat, İncil ve Kur'an'ın baskın yasası.
    id: Kisah anak-anak Adam dan gagak, larangan membunuh, hukuman atas tombak dan pencurian, hukum dominan Taurat, Injil, dan Al-Qur'an.
