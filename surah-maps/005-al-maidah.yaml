map:
- title:
    ar: أوفوا بالعقود
    en: Fulfil Your Contracts
    tr: Sözleşmeleri yerine getirmek
    id: Penuhi kontrak
  range:
  - 1
  - 11
  family: law
  summary:
    ar: 'الوفاء بالعهود: الحلال والحرام في الطعام، والوضوء والتيمم، والعدل حتى مع من نبغض.'
    en: 'Keeping covenants: the lawful and forbidden in food, ablution and dry purification, and justice even toward those hated.'
    tr: 'Sözlerin yerine getirilmesi: yiyeceklerde neyin yasal ve yasadışı olduğunu, abdest alma ve kuru abdestajın yanı sıra, nefret edenlere bile adalet.'
    id: 'Menepati janji: apa yang sah dan tidak sah dalam makanan, wudhu dan wudhu kering, serta keadilan bahkan bagi mereka yang membencinya.'
