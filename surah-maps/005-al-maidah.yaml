- title:
    ar: الولاء وأقربهم مودة
    en: Loyalty and the Nearest in Affection
    tr: Sadakat ve en yakın sevgi
    id: Kesetiaan dan kasih sayang terdekat
  range:
  - 51
  - 86
  family: faith
  summary:
    ar: النهي عن موالاة أعداء الدين، وولاية الله ورسوله والمؤمنين، وكفر الغلو في عيسى، وأقرب الناس مودة.
    en: No alliance with religion's enemies; loyalty belongs to Allah, His Messenger, and believers; the excess over Jesus refuted; the nearest in affection.
    tr: Din düşmanlarına, Allah'ın, Elçisinin ve müminlerin bağlılığına bağlılığın yasaklanması ve en yakın insan olan İsa'ya karşı aşırılığın inanılmazlığı.
    id: Larangan kesetiaan kepada musuh agama, kesetiaan kepada Allah, Rasul-Nya, dan para mukmin, serta ketidakpercayaan ekstremisme kepada Yesus, orang terdekat.
