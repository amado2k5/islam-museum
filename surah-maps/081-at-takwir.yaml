map:
  - title: { ar: "علامات التكوير", en: "The Upheavals" }
    range: [1, 14]
    family: faith
    summary:
      ar: "اثنتا عشرة علامة متتابعة ليوم القيامة: الشمس كورت والنجوم انكدرت والجبال سيرت، ومنها سؤال الموءودة بأي ذنب قتلت."
      en: "Twelve consecutive signs of the Day: the sun folded, stars falling, mountains moved — among them the buried girl asked for what sin she was killed."
    children:
      - { title: { ar: "الموءودة تسأل", en: "The Buried Girl Asked" }, range: [8, 9] }
  - title: { ar: "الرسول والرسالة", en: "The Messenger and the Message" }
    range: [15, 29]
    family: faith
    summary:
      ar: "القسم بالخنس الجوار الكنس والليل والصبح: إن القرآن لقول رسول كريم، وما صاحبكم بمجنون، وما هو إلا ذكر للعالمين."
      en: "The oath by the receding stars, the night and the dawn: the Quran is the word of a noble messenger; your companion is not mad — it is a reminder to all peoples."
    children: []
