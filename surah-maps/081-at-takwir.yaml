map:
- title:
    ar: علامات التكوير
    en: The Upheavals
    tr: Peletleme işaretleri
    id: Tanda peletisasi
  range:
  - 1
  - 14
  family: faith
  summary:
    ar: 'اثنتا عشرة علامة متتابعة ليوم القيامة: الشمس كورت والنجوم انكدرت والجبال سيرت، ومنها سؤال الموءودة بأي ذنب قتلت.'
    en: 'Twelve consecutive signs of the Day: the sun folded, stars falling, mountains moved — among them the buried girl asked for what sin she was killed.'
    tr: 'Kıyamet Günü için ardışık on iki işaret: güneş çevrelenmiş, yıldızlar kararmış ve dağlar sessiz, hangi günahı öldürdüğü sorusu da dahil.'
    id: 'Dua belas tanda berturut-turut untuk Hari Penghakiman: matahari dikelilingi, bintang-bintang menjadi gelap, dan pegunungan sunyi, termasuk pertanyaan tentang dosa apa yang telah ia bunuh.'
  children:
  - title:
      ar: الموءودة تسأل
      en: The Buried Girl Asked
      tr: Kadın soruyor
      id: Wanita itu bertanya
    range:
    - 8
    - 9
- title:
    ar: الرسول والرسالة
    en: The Messenger and the Message
    tr: Elçi ve Misyon
    id: Utusan dan Misi
  range:
  - 15
  - 29
  family: faith
  summary:
    ar: 'القسم بالخنس الجوار الكنس والليل والصبح: إن القرآن لقول رسول كريم، وما صاحبكم بمجنون، وما هو إلا ذكر للعالمين.'
    en: 'The oath by the receding stars, the night and the dawn: the Quran is the word of a noble messenger; your companion is not mad — it is a reminder to all peoples.'
    tr: 'Komşu leşçinin yemini, süpürme, gece ve sabahtır: Kur''an, soylu bir Elçi''nin sözüdür, senin sahabenin deli değildir ve dünyalara sadece bir hatırlatıcıdır.'
    id: 'Sumpah oleh pemulung tetangga adalah penyapuan, malam, dan pagi: Al-Qur''an adalah ucapan Rasul yang mulia, dan sahabatmu tidak gila, dan itu hanyalah pengingat bagi dunia.'
  children: []
