surah: 42
slug: ash-shura
sources_consulted:
- taftaq.com — سورة الشورى (مقدمة، 11-16، 17-26، 27-46، خلاصة 47-53)
- arz.wikipedia.org — سورة الشورى (موضوع السورة)
- 'islamweb.net — في ظلال القرآن: مقدمة سورة الشورى (وحدة الوحي)'
map:
- title:
    ar: الوحي والرسالة
    en: Revelation and the Message
    tr: Vahiy ve Mesaj
    id: Wahyu dan Pesan
  range:
  - 1
  - 10
  family: faith
  summary:
    ar: حم عسق؛ كذلك يوحي إليك وإلى الذين من قبلك الله العزيز الحكيم؛ له ما في السماوات والأرض؛ والملائكة يسبحون ويستغفرون لمن في الأرض.
    en: Ha-Mim, Ayn-Sin-Qaf; thus Allah the Mighty, the Wise reveals to you and those before you; His is all in heavens and earth; the angels glorify Him and seek forgiveness for those on earth.
    tr: 'Ham Asak; sana ve senden öncekilere böyle vahiy edilmiştir: Yüce Allah, Bilgi Olan; göklerde ve yerde olan her şey O''nundur; melekler yeryüzündekileri yüceltir ve af diler.'
    id: 'Ham Asaq; maka wahyukan kepada kamu dan kepada mereka yang sebelumnya: Allah, Yang Maha Kuasa, Yang Bijaksana; kepada-Nya adalah milik-Nya segala sesuatu yang ada di langit dan bumi; dan para malaikat
      memuliakan dan memohon pengampunan bagi mereka yang di bumi.'
  children:
  - title:
      ar: كذلك يوحي إليك
      en: Thus He Reveals to You
      tr: Ayrıca size de önerir
      id: Itu juga menyarankan kepada Anda
    range:
    - 3
    - 3
  - title:
      ar: تسبيح الملائكة
      en: The Angels' Glorification
      tr: Melek övgüsleri
      id: Pujian malaikat
    range:
    - 5
    - 5
- title:
    ar: الخلق والرزق والدين
    en: Creation, Provision and the Religion
    tr: Yaratılış, geçim kaynakları ve din
    id: Penciptaan, mata pencaharian, dan agama
  range:
  - 11
  - 16
  family: faith
  summary:
    ar: فاطر السماوات والأرض؛ جعل لكم من أنفسكم أزواجا؛ ليس كمثله شيء؛ له مقاليد السماوات والأرض؛ شرع لكم من الدين ما وصى به نوحا.
    en: Originator of heavens and earth; He made spouses for you from yourselves; nothing is like Him; His are the keys of heavens and earth; He ordained for you the religion enjoined upon Noah.
    tr: Göklerin ve yerin Yaratıcısı; sizi kendinizden eşler yaptı; O'na benzeyen bir şey yoktur; göklerin ve yerin dizginleri O'nundadır; Nuh'un size emrettiği dini sizin için yasalaştırmıştır.
    id: Yang Berasal dari langit dan bumi; Dia menciptakan kalian sebagai pasangan dari diri kalian sendiri; tidak ada yang serupa-Nya; kepada-Nya adalah milik kekang langit dan bumi; Dia telah menetapkan
      agama yang diperintahkan Nuh untuk kalian sebagaimana kalian berikan.
  children:
  - title:
      ar: ليس كمثله شيء
      en: Nothing Is Like Him
      tr: Bunun gibi bir şey yok
      id: Tidak ada yang seperti itu
    range:
    - 11
    - 11
  - title:
      ar: شرع لكم من الدين
      en: He Ordained the Religion for You
      tr: Size dinden buyurdu
      id: Dia meresepkan untukmu dari agama
    range:
    - 13
    - 13
- title:
    ar: الميزان والحرث
    en: The Balance; the Tillage
    tr: Tartı ve sürme
    id: Timbangan dan bajak
  range:
  - 17
  - 26
  family: faith
  summary:
    ar: الله الذي أنزل الكتاب بالحق والميزان؛ من كان يريد حرث الآخرة نزد له فيها؛ قل لا أسألكم عليه أجرا إلا المودة في القربى.
    en: 'Allah who sent down the Book in truth, and the Balance; whoever desires the tillage of the Hereafter, We increase it for him; say: I ask no wage except affection for kin.'
    tr: 'Kitabı doğru ve teraziyle indiren Allah''tır; kim ahiret hasadını isterse, ona bundan fazlasını artırırız; de ki: ''Bunun karşılığında senden sadece yakın akrabalara sevgi dilemem.'''
    id: Allah adalah Dia yang mewahyukan Kitab ini dengan kebenaran dan keseimbangan; siapa pun yang menginginkan hasil akhirat, Kami akan menambah untuknya di dalamnya; katakanlah, 'Aku tidak meminta ganjaran
      apapun untukmu kecuali kasih kepada kerabat dekat.'
  children:
  - title:
      ar: الكتاب والميزان
      en: The Book and the Balance
      tr: Kitap ve Ölçek
      id: Buku dan Timbangan
    range:
    - 17
    - 18
  - title:
      ar: حرث الآخرة وحرث الدنيا
      en: Tillage of the Hereafter and of the World
      tr: Ahireti sürmek ve bu dünyanın sürgünü
      id: Membajak akhirat dan membajak dunia ini
    range:
    - 20
    - 20
  - title:
      ar: المودة في القربى
      en: Affection for Kin
      tr: Akrabalıkta sevgi
      id: Kasih sayang dalam kekerabatan
    range:
    - 23
    - 23
- title:
    ar: تدبير الأمور وصفات المؤمنين
    en: Ordering of Affairs; Traits of Believers
    tr: İşlerin yönetimi ve inananların nitelikleri
    id: Mengelola urusan dan kualitas para mukmin
  range:
  - 27
  - 46
  family: faith
  summary:
    ar: ولو بسط الله الرزق لعباده لبغوا؛ ومن آياته خلق السماوات والأرض؛ وما عند الله خير وأبقى؛ وأمرهم شورى بينهم؛ وجزاء سيئة سيئة مثلها.
    en: Had Allah spread provision wide, they would transgress; among His signs the creation of heavens and earth; what is with Allah is better and lasting; their affairs by counsel among them; the recompense
      of evil is its like.
    tr: Eğer Allah kölelerine erzak sağlasaydı, onlar da bunu dilerlerdi; O'nun işaretleri arasında göklerin ve yerin yaratılması da vardır; Allah'ın sahip olduğu şey daha iyi ve kalıcıdır; onların işleri
      birbirleriyle danışmadır; kötü bir işin bedeli de buna eşdeğerdir.
    id: Dan jika Allah memberikan perbekalan untuk hamba-Nya, mereka pasti akan mencarinya; di antara tanda-tanda-Nya adalah penciptaan langit dan bumi; dan apa yang Allah miliki lebih baik dan lebih abadi;
      dan urusan mereka adalah berunding di antara mereka sendiri; dan ganjaran atas perbuatan buruk setara dengan itu.
  children:
  - title:
      ar: بسط الرزق وقدره
      en: Provision Spread and Apportioned
      tr: Geçim kaynaklarını yaymak ve değerini artırmak
      id: Sebarkan mata pencaharian dan nilainya
    range:
    - 27
    - 27
  - title:
      ar: وأمرهم شورى بينهم
      en: Their Affairs by Counsel
      tr: Ve onların meselesi aralarında görüşülür
      id: Dan masalah mereka didiskusikan di antara mereka
    range:
    - 38
    - 38
  - title:
      ar: جزاء السيئة
      en: Recompense of Evil
      tr: Kötü davranışların cezası
      id: Hukuman atas perbuatan buruk
    range:
    - 40
    - 43
- title:
    ar: الاستجابة والوحي
    en: The Response; Revelation
    tr: Tepki ve Vahiy
    id: Respon dan Wahyu
  range:
  - 47
  - 53
  family: faith
  summary:
    ar: استجيبوا لربكم من قبل أن يأتي يوم لا مرد له من الله؛ وما على الرسول إلا البلاغ؛ وما كان لبشر أن يكلمه الله إلا وحيا أو من وراء حجاب.
    en: Answer your Lord before there comes a Day none can turn back from Allah; the Messenger's duty is but delivery; it is not for a human that Allah speak to him except by revelation or from behind a
      veil.
    tr: Allah'tan kaçırılamayacak bir gün gelmeden önce Rab'a cevap ver; Peygamber'in görevi sadece mesajı iletmektir; ve hiçbir insanın, Allah'a yalnızca vahiyle ya da perde arkasından konuşması gerekir.
    id: Jawablah kepada Tuhan sebelum Hari datang dari Allah yang tidak dapat dihindari; tugas Rasulullah hanyalah menyampaikan pesan; dan tidak ada manusia yang boleh berbicara kepada Allah kecuali melalui
      wahyu atau dari balik tabir.
  children:
  - title:
      ar: استجيبوا لربكم
      en: Answer Your Lord
      tr: Rab'binize cevap verin
      id: Jawablah Tuhanmu
    range:
    - 47
    - 47
  - title:
      ar: أنواع الوحي
      en: The Modes of Revelation
      tr: Vahiy Türleri
      id: Jenis-jenis Wahyu
    range:
    - 51
    - 51
