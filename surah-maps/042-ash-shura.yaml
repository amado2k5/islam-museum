surah: 42
slug: ash-shura
sources_consulted:
  - "taftaq.com — سورة الشورى (مقدمة، 11-16، 17-26، 27-46، خلاصة 47-53)"
  - "arz.wikipedia.org — سورة الشورى (موضوع السورة)"
  - "islamweb.net — في ظلال القرآن: مقدمة سورة الشورى (وحدة الوحي)"
map:
  - title: { ar: "الوحي والرسالة", en: "Revelation and the Message" }
    range: [1, 10]
    family: faith
    summary:
      ar: "حم عسق؛ كذلك يوحي إليك وإلى الذين من قبلك الله العزيز الحكيم؛ له ما في السماوات والأرض؛ والملائكة يسبحون ويستغفرون لمن في الأرض."
      en: "Ha-Mim, Ayn-Sin-Qaf; thus Allah the Mighty, the Wise reveals to you and those before you; His is all in heavens and earth; the angels glorify Him and seek forgiveness for those on earth."
    children:
      - { title: { ar: "كذلك يوحي إليك", en: "Thus He Reveals to You" }, range: [3, 3] }
      - { title: { ar: "تسبيح الملائكة", en: "The Angels' Glorification" }, range: [5, 5] }
  - title: { ar: "الخلق والرزق والدين", en: "Creation, Provision and the Religion" }
    range: [11, 16]
    family: faith
    summary:
      ar: "فاطر السماوات والأرض؛ جعل لكم من أنفسكم أزواجا؛ ليس كمثله شيء؛ له مقاليد السماوات والأرض؛ شرع لكم من الدين ما وصى به نوحا."
      en: "Originator of heavens and earth; He made spouses for you from yourselves; nothing is like Him; His are the keys of heavens and earth; He ordained for you the religion enjoined upon Noah."
    children:
      - { title: { ar: "ليس كمثله شيء", en: "Nothing Is Like Him" }, range: [11, 11] }
      - { title: { ar: "شرع لكم من الدين", en: "He Ordained the Religion for You" }, range: [13, 13] }
  - title: { ar: "الميزان والحرث", en: "The Balance; the Tillage" }
    range: [17, 26]
    family: faith
    summary:
      ar: "الله الذي أنزل الكتاب بالحق والميزان؛ من كان يريد حرث الآخرة نزد له فيها؛ قل لا أسألكم عليه أجرا إلا المودة في القربى."
      en: "Allah who sent down the Book in truth, and the Balance; whoever desires the tillage of the Hereafter, We increase it for him; say: I ask no wage except affection for kin."
    children:
      - { title: { ar: "الكتاب والميزان", en: "The Book and the Balance" }, range: [17, 18] }
      - { title: { ar: "حرث الآخرة وحرث الدنيا", en: "Tillage of the Hereafter and of the World" }, range: [20, 20] }
      - { title: { ar: "المودة في القربى", en: "Affection for Kin" }, range: [23, 23] }
  - title: { ar: "تدبير الأمور وصفات المؤمنين", en: "Ordering of Affairs; Traits of Believers" }
    range: [27, 46]
    family: faith
    summary:
      ar: "ولو بسط الله الرزق لعباده لبغوا؛ ومن آياته خلق السماوات والأرض؛ وما عند الله خير وأبقى؛ وأمرهم شورى بينهم؛ وجزاء سيئة سيئة مثلها."
      en: "Had Allah spread provision wide, they would transgress; among His signs the creation of heavens and earth; what is with Allah is better and lasting; their affairs by counsel among them; the recompense of evil is its like."
    children:
      - { title: { ar: "بسط الرزق وقدره", en: "Provision Spread and Apportioned" }, range: [27, 27] }
      - { title: { ar: "وأمرهم شورى بينهم", en: "Their Affairs by Counsel" }, range: [38, 38] }
      - { title: { ar: "جزاء السيئة", en: "Recompense of Evil" }, range: [40, 43] }
  - title: { ar: "الاستجابة والوحي", en: "The Response; Revelation" }
    range: [47, 53]
    family: faith
    summary:
      ar: "استجيبوا لربكم من قبل أن يأتي يوم لا مرد له من الله؛ وما على الرسول إلا البلاغ؛ وما كان لبشر أن يكلمه الله إلا وحيا أو من وراء حجاب."
      en: "Answer your Lord before there comes a Day none can turn back from Allah; the Messenger's duty is but delivery; it is not for a human that Allah speak to him except by revelation or from behind a veil."
    children:
      - { title: { ar: "استجيبوا لربكم", en: "Answer Your Lord" }, range: [47, 47] }
      - { title: { ar: "أنواع الوحي", en: "The Modes of Revelation" }, range: [51, 51] }
