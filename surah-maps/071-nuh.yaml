surah: 71
slug: nuh
sources_consulted:
  - "kuttab.com — Surah Nuh mind map (3 blocks: 1-12, 13-20, 21-28)"
  - "islamicstudies.info — Tafheem ul Quran, Surah 71 (71:21-28 idols commentary)"
  - "YouTube (جواهر العلماء) — تلاوة وتفسير سورة نوح: timeline of themes"
  - "archive.org — المضامين التربوية في سورة نوح (surah structure and purposes)"
map:
  - title: { ar: "دعوة نوح ليلا ونهارا", en: "Noah's Call by Night and Day" }
    range: [1, 12]
    family: stories
    summary:
      ar: "تكليف نوح بإنذار قومه، وتنويعه أساليب الدعوة بين الليل والنهار والسر والعلن، وعرضه ثمرات الاستغفار من المطر والأموال والبنين."
      en: "Noah charged with warning his people; he varies his call between night and day, secrecy and openness, and offers them the fruits of seeking forgiveness: rain, wealth, children."
    children:
      - { title: { ar: "التكليف بالإنذار", en: "The Charge to Warn" }, range: [1, 4] }
      - { title: { ar: "أساليب الدعوة", en: "Methods of the Call" }, range: [5, 9] }
      - { title: { ar: "ثمرات الاستغفار", en: "Fruits of Seeking Forgiveness" }, range: [10, 12] }
  - title: { ar: "الاستدلال بالخلق", en: "The Argument from Creation" }
    range: [13, 20]
    family: stories
    summary:
      ar: "حجة نوح على قومه بآيات الله: خلقهم أطوارا، والسماوات الطباق، والقمر نورا والشمس سراجا، والأرض بساطا."
      en: "Noah's argument to his people from Allah's signs: their creation in stages, the layered heavens, the moon as light and the sun as lamp, the earth spread as a carpet."
    children:
      - { title: { ar: "خلقكم أطوارا", en: "Created You in Stages" }, range: [13, 14] }
      - { title: { ar: "السماوات والقمر والشمس", en: "The Heavens, the Moon, the Sun" }, range: [15, 16] }
      - { title: { ar: "الأرض بساطا", en: "The Earth as a Carpet" }, range: [17, 20] }
  - title: { ar: "العناد والدعاء", en: "Obstinacy and the Supplication" }
    range: [21, 28]
    family: stories
    summary:
      ar: "شكوى نوح من عصيان قومه وتمسكهم بالأصنام الخمسة، وعاقبتهم بالغرق والنار، ودعاؤه الجامع بالهلاك للظالمين والمغفرة للمؤمنين."
      en: "Noah's complaint of his people's defiance and their clinging to the five idols; their end by drowning and the Fire; and his comprehensive supplication against the wrongdoers and for the believers."
    children:
      - { title: { ar: "الأصنام الخمسة", en: "The Five Idols" }, range: [23, 23] }
      - { title: { ar: "الغرق والنار", en: "The Drowning and the Fire" }, range: [25, 25] }
      - { title: { ar: "دعاء نوح", en: "Noah's Supplication" }, range: [26, 28] }
