map:
  - title: { ar: "الأقسام والنفس", en: "The Oaths and the Soul" }
    range: [1, 10]
    family: faith
    summary:
      ar: "أحد عشر قسما متتابعا: بالشمس والقمر والنهار والليل والسماء والأرض والنفس: قد أفلح من زكاها وقد خاب من دساها."
      en: "Eleven consecutive oaths — by the sun, the moon, the day, the night, the sky, the earth, and the soul: successful is whoever purifies it, failed whoever buries it."
    children: []
  - title: { ar: "ثمود", en: "Thamud" }
    range: [11, 15]
    family: stories
    summary:
      ar: "كذبت ثمود بطغواها إذ انبعث أشقاها: ناقة الله وسقياها، فعقروها فدمدم عليهم ربهم بذنبهم فسواها."
      en: "Thamud denied in their transgression when their most wretched rose: 'the she-camel of Allah and her drink' — they hamstrung her, so their Lord leveled them for their sin."
    children: []
