map:
- title:
    ar: الأقسام والنفس
    en: The Oaths and the Soul
    tr: Bölümler ve Ruh
    id: Bagian dan Jiwa
  range:
  - 1
  - 10
  family: faith
  summary:
    ar: 'أحد عشر قسما متتابعا: بالشمس والقمر والنهار والليل والسماء والأرض والنفس: قد أفلح من زكاها وقد خاب من دساها.'
    en: 'Eleven consecutive oaths — by the sun, the moon, the day, the night, the sky, the earth, and the soul: successful is whoever purifies it, failed whoever buries it.'
    tr: 'On bir ardışık yemin: güneş, ay, gündüz, gece, gökyüzü, yer ve ruh adına: Arındıran başarılı olmuştur, saklayan ise başarısız olmuştur.'
    id: 'Sebelas sumpah berturut-turut: oleh matahari, bulan, siang, malam, langit, bumi, dan jiwa: Dia yang menyucikannya telah berhasil, dan siapa pun yang menyembunyikannya gagal.'
  children: []
- title:
    ar: ثمود
    en: Thamud
    tr: Thamud
    id: Thamud
  range:
  - 11
  - 15
  family: stories
  summary:
    ar: 'كذبت ثمود بطغواها إذ انبعث أشقاها: ناقة الله وسقياها، فعقروها فدمدم عليهم ربهم بذنبهم فسواها.'
    en: 'Thamud denied in their transgression when their most wretched rose: ''the she-camel of Allah and her drink'' — they hamstrung her, so their Lord leveled them for their sin.'
    tr: 'Thamud, en kötü develeri ortaya çıktığında zulümlerini reddetti: Allah''ın dişi devesi, onu suladı, böylece onu sakatladılar ve Rableri onları günahları için inatçı yaptı, böylece onu yerle bir
      ettiler.'
    id: 'Thamud menyangkal tirani mereka ketika unta terburuk mereka muncul: unta betina Allah dan memberinya minuman, sehingga mereka memutilasinya, dan Tuhan mereka membuat mereka keras kepala karena
      dosa mereka, sehingga mereka menidaknya.'
  children: []
