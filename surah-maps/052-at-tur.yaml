map:
- title:
    ar: القسم ووقوع العذاب
    en: The Oaths and the Coming Punishment
    tr: Yemin ve işkencenin ortaya çıkışı
    id: Sumpah dan terjadinya siksaan
  range:
  - 1
  - 16
  family: faith
  summary:
    ar: 'قسم بالطور والكتاب المسطور والبيت المعمور والسقف المرفوع والبحر المسجور على أن عذاب ربك لواقع لا دافع له، يوم تمور السماء وتسير الجبال: ويل للمكذبين.'
    en: 'Oaths by the Mount, the inscribed Book, the frequented House, the raised canopy, and the swollen sea that your Lord''s punishment will occur, none to avert it, on the Day the sky convulses and
      the mountains move: woe to the deniers.'
    tr: 'Tab, Yazılı Kitap, yerleşik Ev, yükseltilmiş tavan ve tıkanmış deniz adına yemin ederim ki, Rabbinizin cezası çözümsüz bir gerçekliktir, gökyüzünün yükseleceği ve dağların hareket edeceği gündür:
      inkarcılara yazık.'
    id: 'Aku bersumpah atas Tab, Buku Tertulis, Rumah yang berpenghuni, langit-langit yang tinggi, dan laut yang tersumbat, bahwa hukuman Tuhanmu adalah kenyataan tanpa solusi, Hari ketika langit akan terangkat
      dan gunung-gunung akan bergerak: celakalah para penyangkal.'
  children:
  - title:
      ar: الأقسام الخمسة
      en: The Five Oaths
      tr: Beş Bölüm
      id: Lima Bagian
    range:
    - 1
