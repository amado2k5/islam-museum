- title:
    ar: نعيم المتقين
    en: The Bliss of the God-conscious
    tr: Dindarların Mutluluğu
    id: Kebahagiaan Orang Saleh
  range:
  - 17
  - 28
  family: faith
  summary:
    ar: المتقون في جنات ونعيم، فاكهين بما آتاهم ربهم ووقاهم عذاب الجحيم، متكئين على سرر مصفوفة، وألحق الله بهم ذريتهم، وكانوا في الدنيا يدعونه خوفا وطمعا.
    en: The God-conscious in gardens and bliss, rejoicing in what their Lord gave them, shielded from Hell's torment, reclining on ranged thrones, their offspring joined to them — in this world they called
      upon Him in fear and hope.
    tr: Doğru olanlar bahçelerde ve mutlulukta olur, Rabbinin verdiği meyve verir ve cehennemin cezasından korur, düzenlenmiş yataklarda uzanır; Allah onları çocuklarıyla birleştirmiştir ve bu dünyada korku
      ve umutla O'na seslenirlerdir.
    id: Orang benar akan berada di taman dan kebahagiaan, berbuah dengan apa yang telah diberikan Tuhan mereka dan melindungi mereka dari hukuman neraka, berbaring di ranjang yang tersusun, dan Allah telah
      menyatukan mereka dengan keturunan mereka, dan mereka biasa memanggil-Nya dengan takut dan harapan di dunia ini.
