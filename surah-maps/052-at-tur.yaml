- title:
    ar: دحض شبهات المكذبين
    en: Refuting the Deniers' Claims
    tr: Yalancıların şüphelerini çürütmek
    id: Membantah kecurigaan para pembohong
  range:
  - 29
  - 43
  family: faith
  summary:
    ar: 'سلسلة أسئلة إلزامية تدحض مزاعمهم: لست بكاهن ولا مجنون، فليأتوا بحديث مثله، أم خلقوا من غير شيء، أم هم الخالقون، أم عندهم خزائن ربك — أم لله البنات ولهم البنون.'
    en: 'A chain of compelling questions dismantling their claims: you are no soothsayer nor madman, let them bring a like discourse; were they created from nothing, or are they the creators; do they hold
      your Lord''s treasuries — or are daughters for Allah and sons for them.'
    tr: 'İddialarını çürüten zorunlu sorular dizisi: Ben ne kahinim ne de deliyim, o halde böyle bir hadis getirsinler, yoksa yoktan mı yaratıldılar, yoksa yaratıcılar mı, yoksa Rabbinin hazinelerine mi
      sahipler? Yoksa kızları ve oğulları mı var?'
    id: 'Serangkaian pertanyaan wajib yang membantah klaim mereka: Aku bukan peramal maupun gila, jadi biarkan mereka membawa hadits serupa, atau mereka diciptakan dari ketiadaan, atau mereka pencipta,
      atau mereka memiliki harta Tuhan kamu? Atau mereka punya putri dan putra?'
  children:
  - title:
      ar: لست بكاهن ولا مجنون
      en: No Soothsayer, No Madman
      tr: Ne rahip ne de deliyim.
      id: Saya bukan imam maupun orang gila.
    range:
    - 29
    - 34
  - title:
      ar: أسئلة الإلزام
      en: The Compelling Questions
      tr: Bağlayıcı Sorular
      id: Pertanyaan Binding
    range:
    - 35
    - 43
- title:
    ar: عذاب الظالمين
    en: The Wrongdoers' Punishment
    tr: Zalimlerin işkencesi
    id: Siksaan para penindas
  range:
  - 44
  - 47
  family: faith
  summary:
    ar: إن يروا كسفا من السماء ساقطا قالوا سحاب مركوم، فذرهم حتى يلاقوا يومهم الذي فيه يصعقون، وإن للذين ظلموا عذابا دون ذلك.
    en: If they saw a fragment of sky falling they would call it piled clouds — so leave them until they meet their Day when they are thunderstruck; and for the wrongdoers there is a punishment before that.
    tr: Eğer gökyüzünden bir tutulma düştüğünü görürlerse, 'Bulutlar yığıldı' derler. Onları, caydıracakları güne kadar bırakın. Gerçekten de kötülenler için ceza bundan azdır.
    id: Jika mereka melihat gerhana jatuh dari langit, mereka berkata, 'Awan menumpuk.' Jadi biarkan mereka sampai mereka bertemu Hari di mana mereka akan terhalang. Memang, bagi mereka yang telah berbuat
      salah adalah hukuman yang lebih kecil dari itu.
  children: []
- title:
    ar: الصبر والتسبيح
    en: Patience and Glorification
    tr: Sabır ve övgü
    id: Kesabaran dan pujian
  range:
  - 48
  - 49
  family: faith
  summary:
    ar: 'خاتمة بتسلية الرسول: اصبر لحكم ربك فإنك بأعيننا، وسبح بحمد ربك حين تقوم ومن الليل وإدبار النجوم.'
    en: 'The close consoles the Messenger: be patient for your Lord''s judgment, for you are in Our sight; glorify your Lord''s praise when you rise, and in the night and at the stars'' retreat.'
    tr: 'Resulun tesellisi ile son: Rabbinin yargısına sabret, çünkü sen bizim gözümüzdesin. Ve kalktığında, gece ve yıldızların dönüşünden itibaren Rabbinin övgüsünü yücelt.'
    id: 'Kesimpulan dengan penghiburan Rasulul: Bersabarlah untuk hukuman Tuhanmu, karena Engkau ada di mata Kami. Dan pujilah Tuhanmu saat Engkau bangun, dan dari malam serta perubahan bintang.'
  children: []
