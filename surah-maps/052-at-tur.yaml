surah: 52
slug: at-tur
sources_consulted:
  - "arz.wikipedia.org — سورة الطور: موضوع السورة (1-28, 29-47, 48-49)"
  - "tadabbur-alquran.com — تدبر سورة الطور: المحاور الأربعة (القسم، التهديد والوعد، دحض الشبهات، تسلية النبي)"
map:
  - title: { ar: "القسم ووقوع العذاب", en: "The Oaths and the Coming Punishment" }
    range: [1, 16]
    family: faith
    summary:
      ar: "قسم بالطور والكتاب المسطور والبيت المعمور والسقف المرفوع والبحر المسجور على أن عذاب ربك لواقع لا دافع له، يوم تمور السماء وتسير الجبال: ويل للمكذبين."
      en: "Oaths by the Mount, the inscribed Book, the frequented House, the raised canopy, and the swollen sea that your Lord's punishment will occur, none to avert it, on the Day the sky convulses and the mountains move: woe to the deniers."
    children:
      - { title: { ar: "الأقسام الخمسة", en: "The Five Oaths" }, range: [1, 6] }
      - { title: { ar: "مشهد وقوع العذاب", en: "The Scene of the Punishment" }, range: [7, 10] }
      - { title: { ar: "ويل للمكذبين", en: "Woe to the Deniers" }, range: [11, 16] }
  - title: { ar: "نعيم المتقين", en: "The Bliss of the God-conscious" }
    range: [17, 28]
    family: faith
    summary:
      ar: "المتقون في جنات ونعيم، فاكهين بما آتاهم ربهم ووقاهم عذاب الجحيم، متكئين على سرر مصفوفة، وألحق الله بهم ذريتهم، وكانوا في الدنيا يدعونه خوفا وطمعا."
      en: "The God-conscious in gardens and bliss, rejoicing in what their Lord gave them, shielded from Hell's torment, reclining on ranged thrones, their offspring joined to them — in this world they called upon Him in fear and hope."
    children:
      - { title: { ar: "جنات ونعيم", en: "Gardens and Bliss" }, range: [17, 20] }
      - { title: { ar: "إلحاق الذرية", en: "Joining the Offspring" }, range: [21, 24] }
      - { title: { ar: "دعاؤهم في الدنيا", en: "Their Supplication in This World" }, range: [25, 28] }
  - title: { ar: "دحض شبهات المكذبين", en: "Refuting the Deniers' Claims" }
    range: [29, 43]
    family: faith
    summary:
      ar: "سلسلة أسئلة إلزامية تدحض مزاعمهم: لست بكاهن ولا مجنون، فليأتوا بحديث مثله، أم خلقوا من غير شيء، أم هم الخالقون، أم عندهم خزائن ربك — أم لله البنات ولهم البنون."
      en: "A chain of compelling questions dismantling their claims: you are no soothsayer nor madman, let them bring a like discourse; were they created from nothing, or are they the creators; do they hold your Lord's treasuries — or are daughters for Allah and sons for them."
    children:
      - { title: { ar: "لست بكاهن ولا مجنون", en: "No Soothsayer, No Madman" }, range: [29, 34] }
      - { title: { ar: "أسئلة الإلزام", en: "The Compelling Questions" }, range: [35, 43] }
  - title: { ar: "عذاب الظالمين", en: "The Wrongdoers' Punishment" }
    range: [44, 47]
    family: faith
    summary:
      ar: "إن يروا كسفا من السماء ساقطا قالوا سحاب مركوم، فذرهم حتى يلاقوا يومهم الذي فيه يصعقون، وإن للذين ظلموا عذابا دون ذلك."
      en: "If they saw a fragment of sky falling they would call it piled clouds — so leave them until they meet their Day when they are thunderstruck; and for the wrongdoers there is a punishment before that."
    children: []
  - title: { ar: "الصبر والتسبيح", en: "Patience and Glorification" }
    range: [48, 49]
    family: faith
    summary:
      ar: "خاتمة بتسلية الرسول: اصبر لحكم ربك فإنك بأعيننا، وسبح بحمد ربك حين تقوم ومن الليل وإدبار النجوم."
      en: "The close consoles the Messenger: be patient for your Lord's judgment, for you are in Our sight; glorify your Lord's praise when you rise, and in the night and at the stars' retreat."
    children: []
