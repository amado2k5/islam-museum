map:
- title:
    ar: رحلتا قريش
    en: Quraysh's Two Journeys
    tr: Quraysh'in Yolculuğu
    id: Perjalanan Quraysh
  range:
  - 1
  - 2
  family: faith
  summary:
    ar: 'لإيلاف قريش إيلافهم رحلة الشتاء والصيف: نعمة الأمن في التجارة.'
    en: For Quraysh's accustomed security — their winter and summer journeys kept safe.
    tr: 'Qureyş''in Aşinalığı Kış ve Yaz Yolculuğu: Ticarette Güvenliğin Kutsaması.'
    id: 'Keakraban Quraysh Perjalanan mereka di musim dingin dan musim panas: berkah keamanan dalam perdagangan.'
  children: []
- title:
    ar: فليعبدوا رب هذا البيت
    en: So Let Them Worship
    tr: Bırakın bu evin Rabbine tapsınlar.
    id: Biarkan mereka menyembah Tuhan rumah ini.
  range:
  - 3
  - 4
  family: faith
  summary:
    ar: 'فليعبدوا رب هذا البيت الذي أطعمهم من جوع وآمنهم من خوف: الشكر واجب المنعم.'
    en: So let them worship the Lord of this House, who fed them against hunger and secured them from fear.
    tr: 'Açlıktan besleyen ve korkudan koruyan bu Evin Rabbine tapsınlar: şükran Veren''in görevidir.'
    id: 'Biarlah mereka menyembah Tuhan Rumah ini yang memberi makan mereka dari kelaparan dan melindungi mereka dari ketakutan: rasa syukur adalah tugas Sang Pemberi.'
