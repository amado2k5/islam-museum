- title:
    ar: 'الختام: الأزفة والسجود'
    en: 'The Close: The Approaching Hour and Prostration'
    tr: 'Sonuç: Şarkılar ve Secdeler'
    id: 'Kesimpulan: Lagu dan Sujud'
  range:
  - 56
  - 62
  family: faith
  summary:
    ar: 'هذا نذير من النذر الأولى، أزفت الآزفة ليس لها من دون الله كاشفة، أفمن هذا الحديث تعجبون وتضحكون ولا تبكون وأنتم سامدون: فاسجدوا لله واعبدوا.'
    en: 'This is a warner like the former warners; the Approaching has drawn near, none besides Allah can remove it — do you wonder at this discourse, laughing and not weeping, diverted: so prostrate to
      Allah and worship Him.'
    tr: 'Bu, ilk yeminlerden itibaren bir uyarıdır; en aşağılık yeminlerin Allah''tan başka bir vahyi yoktur. Bu, hayret edip güldüğünüz, ağlamadığınız ve sadık kaldığınız hadis midir: Allah''a secde edin
      ve O''na ibadet edin?'
    id: 'Ini adalah peringatan dari sumpah pertama, sumpah yang paling hina tidak memiliki wahyu selain Allah. Apakah ini hadits yang kau kagum dan tertawa dan tidak menangis saat kau teguh: Jadi sujud
      kepada Allah dan sembahyang-Nya?'
  children: []
