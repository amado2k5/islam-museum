map:
- title:
    ar: صدق الوحي ومشهداه
    en: The Truth of Revelation and Its Two Scenes
    tr: Vahiyin gerçeği ve sahneleri
    id: Kebenaran wahyu dan adegannya
  range:
  - 1
  - 18
  family: faith
  summary:
    ar: 'قسم بالنجم إذا هوى على أن صاحبهم ما ضل وما غوى وما ينطق عن الهوى، ثم مشهدان للوحي: تلقيه عن شديد القوى بالأفق الأعلى، ورؤيته نزلة أخرى عند سدرة المنتهى.'
    en: 'An oath by the star as it descends that their companion neither strayed nor erred nor speaks from desire, then two scenes of revelation: receiving it from the mighty one at the highest horizon,
      and seeing him a second descent at the Lote Tree of the Utmost.'
    tr: 'Yıldız inerken yemin etti, sanki sahipleri yoldan sapmamış, yanılmış ve arzusundan konuşmamıştı. Sonra iki vahiy sahnesi: en yüksek ufukta güçlüler tarafından kabul edilmesi ve onu En Büyük Sınırdaki
      Lota Ağacı''nda tekrar görmesi.'
    id: 'Ia bersumpah demi bintang saat turun, seolah-olah pemiliknya tidak tersesat, disesatkan, dan tidak berbicara dari keinginannya. Kemudian dua adegan wahyu: penerimaannya oleh yang berkuasa di cakrawala
      tertinggi, dan melihatnya kembali di Pohon Lote Wates Tertinggi.'
  children:
  - title:
      ar: 'المشهد الأول: تلقي الوحي'
      en: 'First Scene: Receiving Revelation'
      tr: 'Birinci Sahne: Vahiy Alma'
      id: 'Adegan Satu: Menerima Wahyu'
    range:
    - 1
    - 12
  - title:
      ar: 'المشهد الثاني: سدرة المنتهى'
      en: 'Second Scene: The Utmost Lote Tree'
      tr: 'İkinci Sahne: Lota Ağacı'
      id: 'Adegan Dua: Pohon Lote'
    range:
    - 13
    - 18
- title:
    ar: تهافت عقيدة الشرك
    en: The Hollowness of Polytheism
    tr: Çoktanrıcılık Doktrininin Çöküşü
    id: Runtuhnya Doktrin Politeisme
  range:
  - 19
  - 32
  family: faith
  summary:
    ar: اللات والعزى ومناة الثالثة الأخرى مجرد أسماء سموها ما أنزل الله بها من سلطان، وأوهامهم عن الملائكة بنات الله مبنية على الظن، ثم الإعراض عمن تولى عن الذكر وسعة مغفرة الله.
    en: Al-Lat, al-'Uzza, and Manat the third are mere names they invented with no authority from Allah; their fancies about the angels as Allah's daughters rest on conjecture; then turn from whoever turns
      from the Reminder, and Allah's vast forgiveness.
    tr: Al-Lat, Al-Uzza ve üçüncü Manat, Tanrı'nın otoritesini vahyettiği şeylerden dolayı isimlendirilen isimlerdir ve melekler, yani Tanrı'nın kızları hakkındaki yanılsamaları, ardından hatırlamadan ve
      Allah'ın bağışlamasının enginliğinden uzaklaşanlardan uzaklaşan varsayımlara dayanır.
    id: Al-Lat, Al-Uzza, dan Manat ketiga hanyalah nama-nama yang mereka namai berdasarkan apa yang Tuhan wahyukan tentang otoritas, dan ilusi mereka tentang malaikat, putri-putri Tuhan, didasarkan pada
      dugaan, lalu berpaling dari mereka yang berpaling dari ingatan dan luasnya pengampunan Tuhan.
  children:
