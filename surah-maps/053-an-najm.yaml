surah: 53
slug: an-najm
sources_consulted:
  - "ar.wikipedia.org — سورة النجم: ملخص مقدمة في ظلال القرآن (4 مقاطع: 1-18، 19-32، 33-55، 56-62)"
  - "quran.inoor.ir — مقدمة السورة النجم: المحتوى والموضوعات (7-part outline; thematic structure only)"
map:
  - title: { ar: "صدق الوحي ومشهداه", en: "The Truth of Revelation and Its Two Scenes" }
    range: [1, 18]
    family: faith
    summary:
      ar: "قسم بالنجم إذا هوى على أن صاحبهم ما ضل وما غوى وما ينطق عن الهوى، ثم مشهدان للوحي: تلقيه عن شديد القوى بالأفق الأعلى، ورؤيته نزلة أخرى عند سدرة المنتهى."
      en: "An oath by the star as it descends that their companion neither strayed nor erred nor speaks from desire, then two scenes of revelation: receiving it from the mighty one at the highest horizon, and seeing him a second descent at the Lote Tree of the Utmost."
    children:
      - { title: { ar: "المشهد الأول: تلقي الوحي", en: "First Scene: Receiving Revelation" }, range: [1, 12] }
      - { title: { ar: "المشهد الثاني: سدرة المنتهى", en: "Second Scene: The Utmost Lote Tree" }, range: [13, 18] }
  - title: { ar: "تهافت عقيدة الشرك", en: "The Hollowness of Polytheism" }
    range: [19, 32]
    family: faith
    summary:
      ar: "اللات والعزى ومناة الثالثة الأخرى مجرد أسماء سموها ما أنزل الله بها من سلطان، وأوهامهم عن الملائكة بنات الله مبنية على الظن، ثم الإعراض عمن تولى عن الذكر وسعة مغفرة الله."
      en: "Al-Lat, al-'Uzza, and Manat the third are mere names they invented with no authority from Allah; their fancies about the angels as Allah's daughters rest on conjecture; then turn from whoever turns from the Reminder, and Allah's vast forgiveness."
    children:
      - { title: { ar: "اللات والعزى ومناة", en: "Al-Lat, al-'Uzza, and Manat" }, range: [19, 28] }
      - { title: { ar: "الإعراض عن المتولي", en: "Turning from the One Who Turns Away" }, range: [29, 32] }
  - title: { ar: "أصول العقيدة ومصارع الغابرين", en: "Foundations of Creed and the Fates of the Past" }
    range: [33, 55]
    family: faith
    summary:
      ar: "الذي تولى وأعطى قليلا وأكدى، وما في صحف موسى وإبراهيم: ألا تزر وازرة وزر أخرى وأن للإنسان ما سعى؛ وإلى ربك المنتهى المتصرف في الضحك والبكاء والموت والحياة؛ ثم إهلاك عاد وثمود وقوم نوح والمؤتفكة."
      en: "The one who turned away and gave little then withheld, and what is in the scrolls of Moses and Abraham: no bearer bears another's burden, man has only what he strives for; to your Lord is the final end, disposing laughter and weeping, death and life; then the destruction of 'Ad, Thamud, Noah's people, and the overturned towns."
    children:
      - { title: { ar: "الذي تولى والصحف الأولى", en: "The One Who Turned Away and the Early Scrolls" }, range: [33, 41] }
      - { title: { ar: "إلى ربك المنتهى", en: "To Your Lord Is the Final End" }, range: [42, 49] }
      - { title: { ar: "إهلاك عاد وثمود وقوم نوح", en: "Destroying 'Ad, Thamud, and Noah's People" }, range: [50, 55] }
  - title: { ar: "الختام: الأزفة والسجود", en: "The Close: The Approaching Hour and Prostration" }
    range: [56, 62]
    family: faith
    summary:
      ar: "هذا نذير من النذر الأولى، أزفت الآزفة ليس لها من دون الله كاشفة، أفمن هذا الحديث تعجبون وتضحكون ولا تبكون وأنتم سامدون: فاسجدوا لله واعبدوا."
      en: "This is a warner like the former warners; the Approaching has drawn near, none besides Allah can remove it — do you wonder at this discourse, laughing and not weeping, diverted: so prostrate to Allah and worship Him."
    children: []
