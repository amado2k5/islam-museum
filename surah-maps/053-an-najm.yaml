  - title:
      ar: الإعراض عن المتولي
      en: Turning from the One Who Turns Away
      tr: Al-Mutawalli'den Uzaklaşmak
      id: Berpaling dari Al-Mutawalli
    range:
    - 29
    - 32
- title:
    ar: أصول العقيدة ومصارع الغابرين
    en: Foundations of Creed and the Fates of the Past
    tr: İnanç Dili ve Antik Savaşın Kökenleri
    id: Asal-usul Creed dan Pertempuran Kuno
  range:
  - 33
  - 55
  family: faith
  summary:
    ar: 'الذي تولى وأعطى قليلا وأكدى، وما في صحف موسى وإبراهيم: ألا تزر وازرة وزر أخرى وأن للإنسان ما سعى؛ وإلى ربك المنتهى المتصرف في الضحك والبكاء والموت والحياة؛ ثم إهلاك عاد وثمود وقوم نوح والمؤتفكة.'
    en: 'The one who turned away and gave little then withheld, and what is in the scrolls of Moses and Abraham: no bearer bears another''s burden, man has only what he strives for; to your Lord is the
      final end, disposing laughter and weeping, death and life; then the destruction of ''Ad, Thamud, Noah''s people, and the overturned towns.'
    tr: 'Ele alıp az verip onaylayan ve Musa ile İbrahim''in kutsal yazılarında şöyle yazmaktadır: ''Başka bir yükün yükünü taşıma, o insan çabaladığı şeye sahiptir; ve kahkaha, ağlama, ölüm ve yaşamı kontrol
      eden Rabbin Nihai Hakim''e; sonra Aad, Semud, Nuh halkı ve Mutafikah''ın yıkımı olur.'
    id: 'Dia yang mengambil alih dan memberi sedikit dan menegaskan, dan apa yang tertulis dalam kitab Musa dan Abraham adalah: ''Janganlah menanggung beban lain, dan manusia itu memiliki apa yang dia perjuangkan;
      dan kepada Tuhanmu Hakim Tertinggi, yang mengendalikan tawa, tangisan, kematian, dan hidup; kemudian kehancuran ''Aad, Thamud, umat Nuh, dan Al-Mutafikah.'
  children:
  - title:
