map:
- title:
    ar: انفطار السماء
    en: The Sky Splits
    tr: Gökyüzünün Kırılması
    id: Pecahnya Langit
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'إذا السماء انفطرت والكواكب انتثرت والبحار فجرت والقبور بعثرت: علمت نفس ما قدمت وأخرت.'
    en: When the sky splits apart, stars scatter, seas burst and graves overturn — every soul will know what it sent ahead and left behind.
    tr: 'Gökyüzü yarıldığında, yıldızlar dağıldığında, denizler fırladı ve mezarlar dağıldı: bir ruh neyin önce geldiğini ve neyi geciktirdiğini bilirdi.'
    id: 'Ketika langit terbelah, bintang-bintang berhamburan, lautan meledak, dan makam-makam tercerai: jiwa tahu apa yang telah terjadi sebelumnya dan apa yang telah ditunda.'
  children: []
- title:
    ar: ما غرك بربك الكريم
    en: What Deceived You
    tr: Cömert Tanrınız tarafından kandırılmadınız
    id: Kamu tidak tertipu oleh Tuhanmu yang murah hati
  range:
  - 6
  - 12
  family: faith
  summary:
    ar: يا أيها الإنسان ما غرك بربك الكريم الذي خلقك فسواك فعدلك، وإن عليكم لحافظين كراما كاتبين.
    en: O man, what deceived you about your Generous Lord who created, proportioned and balanced you? Over you are keepers, noble recorders.
    tr: Ey insanlar, sizi aldatan, sizi yaratan cömert Rabbinizdir; böylece O'nu orantılı gösterdi ve akladı. Gerçekten de sizin üzerinizde şeref koruyanlar ve yazanlar vardır.
    id: Oh manusia, yang menipu kalian adalah Tuhanmu yang murah hati yang menciptakan kalian, sehingga Dia membandingkan dan membenarkan kalian. Memang, di atasmu adalah pelindung kehormatan dan penulis.
  children: []
- title:
    ar: يوم الدين
    en: The Day of Recompense
    tr: Kıyamet Günü
    id: Hari Penghakiman
  range:
  - 13
  - 19
  family: faith
  summary:
    ar: إن الأبرار لفي نعيم وإن الفجار لفي جحيم، يوم لا تملك نفس لنفس شيئا والأمر يومئذ لله.
    en: The righteous shall be in bliss and the wicked in Hellfire — a Day no soul can avail another; the command that Day belongs to Allah.
    tr: Gerçekten de, doğru olanlar mutluluk içinde, kötüler cehennemde olacak; o gün ki hiçbir ruh başka bir şeye sahip olamayacak ve o günün işi Allah'a aittir.
    id: Memang, orang benar akan bahagia, dan orang jahat akan berada di neraka, pada hari ketika tidak ada jiwa yang memiliki apa pun melawan orang lain, dan perkara itu pada hari itu menjadi milik Allah.
  children: []
