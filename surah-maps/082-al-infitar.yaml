surah: 82
slug: al-infitar
sources_consulted:
  - "kuttab.com — Surah Al-Infitar mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "انفطار السماء", en: "The Sky Splits" }
    range: [1, 5]
    family: faith
    summary:
      ar: "إذا السماء انفطرت والكواكب انتثرت والبحار فجرت والقبور بعثرت: علمت نفس ما قدمت وأخرت."
      en: "When the sky splits apart, stars scatter, seas burst and graves overturn — every soul will know what it sent ahead and left behind."
    children: []
  - title: { ar: "ما غرك بربك الكريم", en: "What Deceived You" }
    range: [6, 12]
    family: faith
    summary:
      ar: "يا أيها الإنسان ما غرك بربك الكريم الذي خلقك فسواك فعدلك، وإن عليكم لحافظين كراما كاتبين."
      en: "O man, what deceived you about your Generous Lord who created, proportioned and balanced you? Over you are keepers, noble recorders."
    children: []
  - title: { ar: "يوم الدين", en: "The Day of Recompense" }
    range: [13, 19]
    family: faith
    summary:
      ar: "إن الأبرار لفي نعيم وإن الفجار لفي جحيم، يوم لا تملك نفس لنفس شيئا والأمر يومئذ لله."
      en: "The righteous shall be in bliss and the wicked in Hellfire — a Day no soul can avail another; the command that Day belongs to Allah."
    children: []
