map:
  - title: { ar: "سؤال العذاب والصبر الجميل", en: "The Mocking Question and Beautiful Patience" }
    range: [1, 7]
    family: faith
    summary:
      ar: "رد على المستهزئ السائل عن العذاب: إنه واقع لا دافع له، وعروج الملائكة في يوم مقداره خمسون ألف سنة، وأمر بالصبر الجميل."
      en: "Answering the mocker who demanded the punishment: it will certainly befall, with no repeller; the angels ascend on a Day of fifty thousand years; and the command to beautiful patience."
    children: []
  - title: { ar: "أهوال اليوم ولظى", en: "The Day's Terrors and the Blaze" }
    range: [8, 18]
    family: faith
    summary:
      ar: "تصوير يوم القيامة: السماء كالمهل والجبال كالعهن، وتمني المجرم الفداء بأهله، ونار لظى تنادي من أدبر وتولى."
      en: "The Day portrayed: sky like molten metal, mountains like carded wool, the criminal wishing to ransom himself with his kin, and the Blaze calling those who turned away."
    children:
      - { title: { ar: "تبدل السماء والجبال", en: "Sky and Mountains Transformed" }, range: [8, 10] }
      - { title: { ar: "تمني المجرم الفداء", en: "The Criminal's Wish to Ransom Himself" }, range: [11, 14] }
      - { title: { ar: "نار لظى", en: "The Blaze" }, range: [15, 18] }
  - title: { ar: "هلع الإنسان وصفات المصلين", en: "Man's Impatience and the Traits of the Prayerful" }
    range: [19, 35]
    family: faith
    summary:
      ar: "طبيعة الإنسان الجبلية: هلوع جزوع منوع، يستثنى منها المصلون بصفاتهم: الدوام على الصلاة، والزكاة، والتصديق بيوم الدين، وحفظ الفروج والأمانات."
      en: "Man's ingrained nature: fretful, panicking at harm, withholding at good — except the prayerful, with their traits: constant prayer, charity, belief in the Day, guarding chastity and trusts."
    children:
      - { title: { ar: "هلع الإنسان", en: "Man's Fretfulness" }, range: [19, 21] }
      - { title: { ar: "صفات المصلين", en: "Traits of the Prayerful" }, range: [22, 35] }
  - title: { ar: "توبيخ المكذبين وتركهم", en: "Rebuking the Deniers and Leaving Them" }
    range: [36, 44]
    family: faith
    summary:
      ar: "استنكار إسراع المكذبين وطمعهم في الجنة، والقسم على قدرة الله في التبديل، ثم الأمر بتركهم يخوضوا حتى يومهم الموعود."
      en: "Rebuke of the deniers' haste and their hope of Paradise; an oath on Allah's power to replace them; then the command to leave them until their promised Day."
    children:
      - { title: { ar: "استنكار طمعهم في الجنة", en: "Their Hope of Paradise Denied" }, range: [36, 41] }
      - { title: { ar: "فذرهم ومشهد الخروج", en: "Leave Them: The Scene of Emergence" }, range: [42, 44] }
