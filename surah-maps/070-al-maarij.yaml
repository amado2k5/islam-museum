map:
- title:
    ar: سؤال العذاب والصبر الجميل
    en: The Mocking Question and Beautiful Patience
    tr: İşkence ve güzel sabır meselesi
    id: Pertanyaan tentang penyiksaan dan kesabaran yang indah
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: 'رد على المستهزئ السائل عن العذاب: إنه واقع لا دافع له، وعروج الملائكة في يوم مقداره خمسون ألف سنة، وأمر بالصبر الجميل.'
    en: 'Answering the mocker who demanded the punishment: it will certainly befall, with no repeller; the angels ascend on a Day of fifty thousand years; and the command to beautiful patience.'
    tr: 'Ceza hakkında alaycı soruya şöyle yanıt verdi: Bu sebepsiz bir gerçekliktir, meleklerin elli bin yıl ölçülü bir günde yükselişi ve sabırlı olma emri güzel bir sabırdır.'
    id: 'Ia menjawab penanya yang mengejek tentang hukuman: Ini adalah kenyataan tanpa sebab, kenaikan para malaikat dalam sehari yang diukur lima puluh ribu tahun, dan perintah untuk bersabar dengan kesabaran
      yang indah.'
  children: []
- title:
    ar: أهوال اليوم ولظى
    en: The Day's Terrors and the Blaze
    tr: Bugünün dehşetleri ve alevleri
    id: Kengerian dan api hari ini
  range:
  - 8
  - 18
  family: faith
  summary:
    ar: 'تصوير يوم القيامة: السماء كالمهل والجبال كالعهن، وتمني المجرم الفداء بأهله، ونار لظى تنادي من أدبر وتولى.'
    en: 'The Day portrayed: sky like molten metal, mountains like carded wool, the criminal wishing to ransom himself with his kin, and the Blaze calling those who turned away.'
    tr: 'Kıyamet Günü''nün tasviri: gökyüzü ay gibidir, dağlar ay gibidir, suçlu ailesi için fidye ister ve yanan bir ateş, yüzünü çevirenleri çağırır.'
    id: 'Penggambaran Hari Penghakiman: langit seperti bulan, gunung-gunung seperti bulan, penjahat menginginkan tebusan untuk keluarganya, dan api yang menyala memanggil mereka yang berpaling dan berpaling.'
  children:
  - title:
      ar: تبدل السماء والجبال
      en: Sky and Mountains Transformed
      tr: Gökyüzü ve dağlar değişir
      id: Langit dan pegunungan berubah
    range:
    - 8
    - 10
  - title:
      ar: تمني المجرم الفداء
      en: The Criminal's Wish to Ransom Himself
      tr: Suçlu kurtuluş istedi
      id: Penjahat itu menginginkan penebusan
    range:
    - 11
    - 14
  - title:
      ar: نار لظى
      en: The Blaze
      tr: Alevli bir ateş
      id: Api yang menyala
