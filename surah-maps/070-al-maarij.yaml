    - 18
- title:
    ar: هلع الإنسان وصفات المصلين
    en: Man's Impatience and the Traits of the Prayerful
    tr: İnsan paniği ve tapınanların özellikleri
    id: Kepanikan manusia dan karakteristik para pemuja
  range:
  - 19
  - 35
  family: faith
  summary:
    ar: 'طبيعة الإنسان الجبلية: هلوع جزوع منوع، يستثنى منها المصلون بصفاتهم: الدوام على الصلاة، والزكاة، والتصديق بيوم الدين، وحفظ الفروج والأمانات.'
    en: 'Man''s ingrained nature: fretful, panicking at harm, withholding at good — except the prayerful, with their traits: constant prayer, charity, belief in the Day, guarding chastity and trusts.'
    tr: 'İnsan doğası dağlıktır: çeşitli panik ve kaygı, ibadet edenleri nitelikleriyle muaf tutan: dua, zekat, Kıyamet Günü''ne inanma ve özel bölgeleri ile güvenleri koruma.'
    id: 'Sifat manusia itu pegunungan: berbagai kepanikan dan kecemasan, yang membebaskan para pemuja berdasarkan sifatnya: konsistensi dalam doa, zakat, kepercayaan pada Hari Penghakiman, serta menjaga
      bagian pribadi dan kepercayaan.'
  children:
  - title:
      ar: هلع الإنسان
      en: Man's Fretfulness
      tr: İnsan paniği
      id: Kepanikan manusia
    range:
    - 19
    - 21
  - title:
      ar: صفات المصلين
      en: Traits of the Prayerful
      tr: İbadetçilerin Özellikleri
      id: Karakteristik Para Pemuja
    range:
    - 22
    - 35
- title:
    ar: توبيخ المكذبين وتركهم
    en: Rebuking the Deniers and Leaving Them
    tr: Yalancıları azarlamak ve onları terk etmek
    id: Menegur para pembohong dan meninggalkan mereka
  range:
  - 36
  - 44
  family: faith
  summary:
    ar: استنكار إسراع المكذبين وطمعهم في الجنة، والقسم على قدرة الله في التبديل، ثم الأمر بتركهم يخوضوا حتى يومهم الموعود.
    en: Rebuke of the deniers' haste and their hope of Paradise; an oath on Allah's power to replace them; then the command to leave them until their promised Day.
    tr: Inkarcıların acelesini ve Cennet umudunu kınadı, Tanrı'nın gücüyle değişmeye yemin etti, sonra da vaat edilen günlerine kadar dolaşmalarına izin verilmesini emretti.
    id: Mengecam tergesa-gesa para penyangkal dan harapan mereka akan Surga, bersumpah demi kuasa Tuhan untuk berubah, lalu memerintahkan mereka untuk dibiarkan mengembara sampai hari yang dijanjikan.
  children:
  - title:
      ar: استنكار طمعهم في الجنة
      en: Their Hope of Paradise Denied
      tr: Cennete olan açgözlülüklerini kınamak
      id: Mengecam keserakahan mereka akan surga
    range:
    - 36
    - 41
  - title:
      ar: فذرهم ومشهد الخروج
      en: 'Leave Them: The Scene of Emergence'
      tr: Onları ve dışarı çıkma sahnesini bırak
      id: Tinggalkan mereka dan suasana keluar
    range:
