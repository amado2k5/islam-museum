map:
- title:
    ar: ما ودعك ربك
    en: Your Lord Has Not Abandoned You
    tr: Tanrı seni terk etmedi
    id: Tuhan tidak meninggalkanmu
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'والضحى والليل إذا سجى ما ودعك ربك وما قلى: وللآخرة خير لك من الأولى، ولسوف يعطيك ربك فترضى.'
    en: 'By the morning light and the still night: your Lord has not forsaken you nor detests you; the Hereafter is better for you than the first — and your Lord shall give you until you are pleased.'
    tr: 'Ve şafak ve gece, akşam olduğunda, Rabbiniz size veda etmez ve şöyle demez: ''Ahiret sizin için ilkinden daha iyidir, Rabbiniz size verecek ve hoşunuza gidecek.'''
    id: 'Dan fajar dan malam, ketika senja, Tuhanmu tidak akan mengucapkan selamat tinggal dan apa yang Dia katakan: ''Dan akhirat lebih baik untukmu daripada yang pertama, dan Tuhanmu akan memberimu dan
      engkau akan senang.'''
  children: []
- title:
    ar: ثلاث نعم وثلاث وصايا
    en: Three Favors, Three Duties
    tr: Üç evet ve üç emir
    id: Tiga ya dan tiga perintah
  range:
  - 6
  - 11
  family: faith
  summary:
    ar: 'ألم يجدك يتيما فآوى ووجدك ضالا فهدى ووجدك عائلا فأغنى: فأما اليتيم فلا تقهر وأما السائل فلا تنهر وأما بنعمة ربك فحدث.'
    en: Did He not find you an orphan and shelter you, find you wandering and guide you, find you poor and enrich you? So oppress not the orphan, repulse not the beggar, and proclaim your Lord's favor.
    tr: Seni yetim bulup sığınma sağlamadı mı, kaybolmuş bulmadı mı, bu yüzden seni yönlendirdi, ihtiyaç içinde buldu ve refah içinde buldu? Yetim için zulme uğrama, dilenciden korkma, dilenciden korkma,
      Rabbinin lütfu için konuş.
    id: Bukankah Dia menemukanmu yatim piatu dan memberimu tempat berlindung, lalu menemukan engkau tersesat, maka Dia membimbingmu, dan menemukan kau membutuhkan serta makmur? Adapun anak yatim, janganlah
      tertindas, jangan takut pada pengemis, dan jangan takut pada yang meminta, dan demi rahmat Tuhanmu, maka berbicaralah.
  children: []
