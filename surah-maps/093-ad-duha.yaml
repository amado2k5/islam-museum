map:
  - title: { ar: "ما ودعك ربك", en: "Your Lord Has Not Abandoned You" }
    range: [1, 5]
    family: faith
    summary:
      ar: "والضحى والليل إذا سجى ما ودعك ربك وما قلى: وللآخرة خير لك من الأولى، ولسوف يعطيك ربك فترضى."
      en: "By the morning light and the still night: your Lord has not forsaken you nor detests you; the Hereafter is better for you than the first — and your Lord shall give you until you are pleased."
    children: []
  - title: { ar: "ثلاث نعم وثلاث وصايا", en: "Three Favors, Three Duties" }
    range: [6, 11]
    family: faith
    summary:
      ar: "ألم يجدك يتيما فآوى ووجدك ضالا فهدى ووجدك عائلا فأغنى: فأما اليتيم فلا تقهر وأما السائل فلا تنهر وأما بنعمة ربك فحدث."
      en: "Did He not find you an orphan and shelter you, find you wandering and guide you, find you poor and enrich you? So oppress not the orphan, repulse not the beggar, and proclaim your Lord's favor."
    children: []
