map:
- title:
    ar: الذي جاء يسعى
    en: The One Who Came Seeking
    tr: Kim aramaya geldi
    id: Siapa yang datang mencari
  range:
  - 1
  - 16
  family: faith
  summary:
    ar: عتاب على العبوس في وجه الأعمى الذي جاء يطلب التزكية، وبيان أن هذا القرآن تذكرة في صحف مكرمة مرفوعة.
    en: The correction for frowning at the blind man who came seeking purification; this Quran is a Reminder in honored, exalted pages.
    tr: Arınma arayan kör adamın yüzündeki kaş çatmaya bir azarlama ve bu Kur'an'ın saygılı ve yüceltilmiş kutsal metinlerde bir hatırlatma olduğunu açıklamak.
    id: Sebuah teguran atas kerutan di wajah orang buta yang datang mencari penyucian, dan memperjelas bahwa Al-Qur'an ini adalah pengingat dalam kitab suci yang dihormati dan ditinggikan.
  children: []
- title:
    ar: جحود الإنسان ونعم الله
    en: Man's Ingratitude and Allah's Favors
    tr: İnsanın nankörlüğü ve Tanrı'nın nimetleri
    id: Ketidakbersyukuran manusia dan berkat Tuhan
  range:
  - 17
  - 32
  family: faith
  summary:
    ar: 'قتل الإنسان ما أكفره: خلقه من نطفة فقدره ثم السبيل يسره، والدعوة إلى النظر في الطعام: صب الماء وشق الأرض وإنبات الزرع.'
    en: 'Perish man, how ungrateful: created from a drop and proportioned, his path eased — then the call to look at his food: poured water, split earth, grown crops.'
    tr: 'Bir insanı öldürmek, inançsız olarak ilan ettiği şeydir: Onu bir sıvı damlasından yarattı, sonra onu belirledi, sonra yolu kolaylaştırdı. Yiyeceğe bakma çağrısı şudur: su dökmek, toprağı bölmek
      ve mahsul filizlendirmek.'
    id: 'Membunuh seseorang adalah apa yang dia nyatakan sebagai orang yang tidak percaya: Dia menciptakannya dari setetes cairan, lalu menentukannya, lalu membuat jalan menjadi mudah. Panggilan untuk melihat
      makanan adalah: menuangkan air, membelah bumi, dan menumbuhkan tanaman.'
  children: []
- title:
    ar: الصاخة
    en: The Deafening Blast
    tr: Gürültülü olan
    id: Yang berisik
  range:
  - 33
  - 42
  family: faith
  summary:
    ar: فإذا جاءت الصاخة يوم يفر المرء من أخيه وأمه وأبيه وصاحبته وبنيه، وجوه مسفرة ضاحكة مستبشرة وأخرى عليها غبرة.
    en: When the Deafening Blast comes — a man flees from brother, mother, father, wife and sons; faces beaming and rejoicing, others dust-covered in gloom.
    tr: Ağlama günü, bir kişinin kardeşinden, annesinden, babasından, arkadaşından ve çocuklarından kaçtığı günde, solgun, gülen ve umut dolu yüzler, diğerlerinin toz içinde olduğu gün gelir.
    id: Ketika tangisan datang pada hari ketika seseorang melarikan diri dari saudara, ibu, ayah, teman, dan anak-anaknya, wajahnya pucat, tertawa, dan penuh harapan, yang lain tertutup debu.
  children: []
