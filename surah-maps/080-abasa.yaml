surah: 80
slug: abasa
sources_consulted:
  - "kuttab.com — Surah Abasa mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "الذي جاء يسعى", en: "The One Who Came Seeking" }
    range: [1, 16]
    family: faith
    summary:
      ar: "عتاب على العبوس في وجه الأعمى الذي جاء يطلب التزكية، وبيان أن هذا القرآن تذكرة في صحف مكرمة مرفوعة."
      en: "The correction for frowning at the blind man who came seeking purification; this Quran is a Reminder in honored, exalted pages."
    children: []
  - title: { ar: "جحود الإنسان ونعم الله", en: "Man's Ingratitude and Allah's Favors" }
    range: [17, 32]
    family: faith
    summary:
      ar: "قتل الإنسان ما أكفره: خلقه من نطفة فقدره ثم السبيل يسره، والدعوة إلى النظر في الطعام: صب الماء وشق الأرض وإنبات الزرع."
      en: "Perish man, how ungrateful: created from a drop and proportioned, his path eased — then the call to look at his food: poured water, split earth, grown crops."
    children: []
  - title: { ar: "الصاخة", en: "The Deafening Blast" }
    range: [33, 42]
    family: faith
    summary:
      ar: "فإذا جاءت الصاخة يوم يفر المرء من أخيه وأمه وأبيه وصاحبته وبنيه، وجوه مسفرة ضاحكة مستبشرة وأخرى عليها غبرة."
      en: "When the Deafening Blast comes — a man flees from brother, mother, father, wife and sons; faces beaming and rejoicing, others dust-covered in gloom."
    children: []
