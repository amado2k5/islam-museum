    range: [4, 7]
    family: faith
    summary:
      ar: "فويل للمصلين الذين هم عن صلاتهم ساهون الذين هم يراؤون ويمنعون الماعون."
      en: "Woe to worshippers heedless of their prayer — who show off, and withhold small kindnesses."
