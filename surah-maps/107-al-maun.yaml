map:
- title:
    ar: المكذب بالدين
    en: Who Denies the Recompense
    tr: Borç İnkarcısı
    id: Penyangkal Utang
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: 'أرأيت الذي يكذب بالدين: فذلك الذي يدع اليتيم ولا يحض على طعام المسكين.'
    en: Have you seen who denies the Recompense? He repels the orphan and does not urge feeding the poor.
    tr: 'Dini reddeden kişiyi görüyor musun: yetimi terk eden ve yoksulları beslemeyi teşvik etmeyen kişidir.'
    id: 'Apakah Anda melihat siapa yang menolak agama: yaitu orang yang meninggalkan anak yatim dan tidak mendorong memberi makan orang miskin.'
  children: []
- title:
    ar: الساهون عن الصلاة
    en: Heedless in Prayer
    tr: Al-Sahoon dua hakkında
    id: Al-Sahoon tentang doa
  range:
  - 4
  - 7
  family: faith
  summary:
    ar: فويل للمصلين الذين هم عن صلاتهم ساهون الذين هم يراؤون ويمنعون الماعون.
    en: Woe to worshippers heedless of their prayer — who show off, and withhold small kindnesses.
    tr: Dua edenlere, dualarını ihmal edenlere, ibadet edenleri görüp engelleyenlere yazık.
    id: Celakalah mereka yang berdoa dan mengabaikan doa mereka, mereka yang melihat dan mencegah para penyembah.
