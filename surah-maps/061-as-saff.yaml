surah: 61
slug: as-saff
sources_consulted:
  - "Wikipedia — As-Saff (verse-by-verse summary)"
  - "ar.wikipedia.org — سورة الصف (full text with verse numbering)"
  - "thelastdialogue.org — Surah As-Saff FAQs (central theme: integrating belief with action)"
  - "الخرائط الذهنية لسور القرآن — surah As-Saff mind-map series (Arabic)"
map:
  - title: { ar: "تسبيح الله", en: "The Glorification of Allah" }
    range: [1, 1]
    family: faith
    summary:
      ar: "افتتاح السورة بتسبيح كل ما في السماوات والأرض لله العزيز الحكيم، تمهيدا لدعوة المؤمنين إلى الصدق والثبات."
      en: "The surah opens with everything in the heavens and earth glorifying Allah, the Mighty, the Wise — a prelude to the call for sincerity and steadfastness."
    children: []
  - title: { ar: "عتاب من يقول ما لا يفعل", en: "Rebuking Those Who Say What They Do Not Do" }
    range: [2, 4]
    family: faith
    summary:
      ar: "عتاب شديد للمؤمنين على قول ما لا يفعلون، ثم بيان المحبوب عند الله: الذين يقاتلون في سبيله صفا كأنهم بنيان مرصوص."
      en: "A severe rebuke to the believers for saying what they do not do, followed by what Allah loves: those who fight in His cause in ranks as though a solid structure."
    children: []
  - title: { ar: "عبرة بني إسرائيل", en: "The Lesson of the Children of Israel" }
    range: [5, 9]
    family: stories
    summary:
      ar: "عبرة تاريخية: موسى آذاه قومه مع علمهم برسالته، وعيسى بشر برسول يأتي بعده اسمه أحمد فكُذِّب، والكافرون يريدون إطفاء نور الله والله متم نوره ومظهر دينه."
      en: "A historical lesson: Moses was harmed by his people despite their knowledge of his mission; Jesus gave tidings of a Messenger named Ahmad to come after him and was rejected; the disbelievers try to extinguish Allah's light, but Allah will perfect it and make His religion prevail."
    children:
      - { title: { ar: "موسى وقومه", en: "Moses and His People" }, range: [5, 5] }
      - { title: { ar: "بشارة عيسى بأحمد", en: "Jesus's Tidings of Ahmad" }, range: [6, 6] }
      - { title: { ar: "إطفاء نور الله", en: "Trying to Extinguish Allah's Light" }, range: [7, 8] }
      - { title: { ar: "إظهار الدين", en: "The Triumph of the Religion" }, range: [9, 9] }
  - title: { ar: "التجارة الرابحة", en: "The Profitable Trade" }
    range: [10, 13]
    family: faith
    summary:
      ar: "عرض تجارة تنجي من العذاب الأليم: الإيمان بالله ورسوله والجهاد بالأموال والأنفس، وثوابها مغفرة الذنوب وجنات عدن ونصر من الله وفتح قريب."
      en: "The offer of a trade that saves from painful punishment: belief in Allah and His Messenger and striving with wealth and lives — rewarded with forgiveness, Gardens of Eden, and near victory from Allah."
    children:
      - { title: { ar: "الإيمان والجهاد", en: "Belief and Striving" }, range: [10, 11] }
      - { title: { ar: "الثواب والنصر القريب", en: "Reward and Near Victory" }, range: [12, 13] }
  - title: { ar: "كونوا أنصار الله", en: "Be Helpers of Allah" }
    range: [14, 14]
    family: faith
    summary:
      ar: "ختام السورة بدعوة المؤمنين أن يكونوا أنصار الله كما كان الحواريون أنصار عيسى، فأيد الله المؤمنين على عدوهم فأصبحوا ظاهرين."
      en: "The surah closes calling the believers to be helpers of Allah as the disciples were helpers of Jesus — so Allah aided the believers against their enemy and they prevailed."
    children: []
