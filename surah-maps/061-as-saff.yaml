- title:
    ar: التجارة الرابحة
    en: The Profitable Trade
    tr: Kazanan Ticaret
    id: Perdagangan Menang
  range:
  - 10
  - 13
  family: faith
  summary:
    ar: 'عرض تجارة تنجي من العذاب الأليم: الإيمان بالله ورسوله والجهاد بالأموال والأنفس، وثوابها مغفرة الذنوب وجنات عدن ونصر من الله وفتح قريب.'
    en: 'The offer of a trade that saves from painful punishment: belief in Allah and His Messenger and striving with wealth and lives — rewarded with forgiveness, Gardens of Eden, and near victory from
      Allah.'
    tr: 'Sizi acı cezadan kurtaran bir ticaret teklifi: Allah''a ve O''nun Elçisine iman etmek, zenginlik ve canla mücadele etmek; ödülü günahların bağışlanması, Aden bahçeleri, Allah''tan zafer ve yaklaşan
      bir zaferdir.'
    id: 'Tawaran perdagangan yang menyelamatkanmu dari hukuman yang menyakitkan: iman kepada Allah dan Rasul-Nya, berjuang dengan kekayaan dan nyawa, dan ganjarannya adalah pengampunan dosa, taman Eden,
      kemenangan dari Allah, dan penaklukan yang akan datang.'
  children:
