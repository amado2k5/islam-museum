map:
- title:
    ar: تسبيح الله
    en: The Glorification of Allah
    tr: Tasbih Allah
    id: Tasbih Allah
  range:
  - 1
  - 1
  family: faith
  summary:
    ar: افتتاح السورة بتسبيح كل ما في السماوات والأرض لله العزيز الحكيم، تمهيدا لدعوة المؤمنين إلى الصدق والثبات.
    en: The surah opens with everything in the heavens and earth glorifying Allah, the Mighty, the Wise — a prelude to the call for sincerity and steadfastness.
    tr: Bölüm, gökteki ve yerdeki her şeyi Allah'a, Kudretli ve Bilgi Olan'a yücelterek, inananları doğruluğa ve kararlılığa çağırmanın bir ön hazırlık olarak başlar.
    id: Bab ini dibuka dengan memuliakan segala sesuatu di langit dan bumi untuk Allah, Yang Maha Kuasa, Yang Bijaksana, sebagai pengantar untuk memanggil orang beriman kepada kebenaran dan keteguhan.
  children: []
- title:
    ar: عتاب من يقول ما لا يفعل
    en: Rebuking Those Who Say What They Do Not Do
    tr: Yapmadıklarını söyleyenlerin suçlaması
    id: Celaan bagi mereka yang mengatakan apa yang tidak mereka lakukan
  range:
  - 2
  - 4
  family: faith
  summary:
    ar: 'عتاب شديد للمؤمنين على قول ما لا يفعلون، ثم بيان المحبوب عند الله: الذين يقاتلون في سبيله صفا كأنهم بنيان مرصوص.'
    en: 'A severe rebuke to the believers for saying what they do not do, followed by what Allah loves: those who fight in His cause in ranks as though a solid structure.'
    tr: 'Yapmadıklarını söyleyip, sonra Allah''ın sevdiğini açıklayan inananlara ağır bir azarlama: O''nun yolunda sanki sağlam bir yapıymış gibi saf halinde savaşanlar.'
    id: 'Sebuah celaan berat bagi orang beriman karena mengatakan apa yang tidak mereka lakukan, lalu memperjelas apa yang dikasihi Allah: mereka yang berjuang dalam perjuangan-Nya secara berbarisan seolah-olah
      mereka adalah struktur yang kokoh.'
  children: []
- title:
    ar: عبرة بني إسرائيل
    en: The Lesson of the Children of Israel
    tr: İsrail Çocukları'nın dersi
    id: Pelajaran tentang Anak-anak Israel
  range:
  - 5
  - 9
  family: stories
  summary:
    ar: 'عبرة تاريخية: موسى آذاه قومه مع علمهم برسالته، وعيسى بشر برسول يأتي بعده اسمه أحمد فكُذِّب، والكافرون يريدون إطفاء نور الله والله متم نوره ومظهر دينه.'
    en: 'A historical lesson: Moses was harmed by his people despite their knowledge of his mission; Jesus gave tidings of a Messenger named Ahmad to come after him and was rejected; the disbelievers try
      to extinguish Allah''s light, but Allah will perfect it and make His religion prevail.'
    tr: 'Tarihsel bir ders: Musa, halkı tarafından zararlandı, halbuki onlar onun mesajını biliyordu ve İsa, ardından Ahmed adında bir elçi geleceğine dair müjde verdi, fakat yalan söyledi. İnkârlar Tanrı''nın
      ışığını söndürmek isterler, fakat Tanrı, O''nun ışığının mükemmeli ve dininin tezahürüdür.'
    id: 'Pelajaran sejarah: Musa disakiti oleh umatnya meskipun mereka mengetahui pesannya, dan Yesus memberikan kabar gembira tentang seorang utusan yang akan datang setelahnya bernama Ahmad, tetapi dia
      berbohong. Orang kafir ingin memadamkan cahaya Tuhan, tetapi Allah adalah sempurna dari cahaya-Nya dan manifestasi agama-Nya.'
