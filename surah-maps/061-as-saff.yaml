- title:
    ar: كونوا أنصار الله
    en: Be Helpers of Allah
    tr: Ensar Allah Olun
    id: Jadilah Ansar Allah
  range:
  - 14
  - 14
  family: faith
  summary:
    ar: ختام السورة بدعوة المؤمنين أن يكونوا أنصار الله كما كان الحواريون أنصار عيسى، فأيد الله المؤمنين على عدوهم فأصبحوا ظاهرين.
    en: The surah closes calling the believers to be helpers of Allah as the disciples were helpers of Jesus — so Allah aided the believers against their enemy and they prevailed.
    tr: Bölüm, müminlerin tıpkı havarilerin İsa'nın destekçileri olduğu gibi Allah'ın destekçileri olmaları çağrısıyla sona erer. Böylece Allah, müminleri düşmanlarına karşı destekledi ve onlar ortaya çıktı.
    id: Bab ini diakhiri dengan seruan para mukmin untuk menjadi pendukung Allah seperti halnya para murid adalah pendukung Yesus. Dengan demikian, Allah mendukung para mukmin melawan musuh mereka, dan
      mereka menjadi nyata.
  children: []
