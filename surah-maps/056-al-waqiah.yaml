- title:
    ar: أدلة البعث
    en: Proofs of Resurrection
    tr: Baas'ın Kanıtları
    id: Bukti Baath
  range:
  - 57
  - 74
  family: faith
  summary:
    ar: 'نحن خلقناكم فلولا تصدقون: أفرأيتم ما تمنون أأنتم تخلقونه أم نحن الخالقون؛ وأفرأيتم ما تحرثون أأنتم تزرعونه أم نحن الزارعون؛ وأفرأيتم الماء الذي تشربون أأنتم أنزلتموه من المزن أم نحن المنزلون؛ وأفرأيتم
      النار التي تورون أأنتم أنشأتم شجرتها أم نحن المنشئون.'
    en: 'We created you — will you not believe: have you seen what you emit — do you create it or are We the Creators; have you seen what you sow — do you grow it or are We the Growers; have you seen the
      water you drink — did you send it from the clouds or did We; have you seen the fire you kindle — did you produce its tree or did We.'
    tr: 'Biz sizi yarattık, eğer inanmıyorsanız: Ne dilediğinizi gördün mü, onu yaratan siz misiniz, yoksa biz mi yaratıcıyız? Ekerlerinizi gördün mü, ekiyor musunuz, yoksa biz ekenler miyiz? İçtiğiniz
      suyu gördün mü? Onu çamurdan mı indirdiniz yoksa biz mi gönderdik? Gördüğünüz ateşi gördün mü? Ağacını siz mi yarattınız, yoksa biz mi yaratıcıyız?'
    id: 'Kami menciptakanmu, jadi jika kamu tidak percaya: Apakah kamu melihat apa yang kamu inginkan, apakah kamu yang menciptakannya, atau Kami yang menciptakan? Apakah kamu melihat apa yang kamu tanam,
      apakah kamu yang menaburnya, atau kami yang menabur? Dan apakah kamu melihat air yang kamu minum? Apakah kamu yang menurunkannya dari lumpur atau Kami yang mengirim? Dan apakah kamu melihat api yang
      kamu lihat? Apakah kamu menciptakan pohonnya, atau Kami yang menciptakan?'
