surah: 56
slug: al-waqiah
sources_consulted:
  - "tadabbur-alquran.com — دليلك لتدبر سورة الواقعة: محورها تقرير البعث والجزاء، والأصناف الثلاثة"
  - "alukah.net — تفسير سورة الواقعة كاملة (تقسيم الآيات 1-96)"
map:
  - title: { ar: "وقوع الواقعة والأصناف الثلاثة", en: "The Event Occurs: The Three Classes" }
    range: [1, 10]
    family: faith
    summary:
      ar: "إذا وقعت الواقعة ليس لوقعتها كاذبة خافضة رافعة، إذا رجت الأرض رجا وبست الجبال بسا فكانت هباء منبثا، وكنتم أزواجا ثلاثة: أصحاب الميمنة وأصحاب المشأمة والسابقون."
      en: "When the Event occurs — none denying its coming — abasing, exalting; when the earth is shaken and the mountains crumble to scattered dust, you will be three classes: the companions of the right, the companions of the left, and the foremost."
    children: []
  - title: { ar: "السابقون المقربون", en: "The Foremost, Brought Near" }
    range: [11, 26]
    family: faith
    summary:
      ar: "أولئك المقربون في جنات النعيم، ثلة من الأولين وقليل من الآخرين، على سرر موضونة متكئين عليها متقابلين، يطوف عليهم ولدان مخلدون بأكواب وأباريق وكأس من معين، وفاكهة ولحم طير وحور عين، لا يسمعون فيها لغوا ولا تأثيما إلا قيلا سلاما سلاما."
      en: "Those are the ones brought near, in the gardens of bliss — many from the former and few from the latter — on woven thrones, reclining facing one another, served by immortal youths with cups, pitchers, and a cup from a flowing spring, fruit and bird meat and wide-eyed maidens; they hear no idle talk nor sin, only peace upon peace."
    children:
      - { title: { ar: "المقربون ثلة وقليل", en: "The Near Ones: Many and Few" }, range: [11, 14] }
      - { title: { ar: "نعيمهم على السرر", en: "Their Bliss on Thrones" }, range: [15, 24] }
      - { title: { ar: "سلاما سلاما", en: "Peace Upon Peace" }, range: [25, 26] }
  - title: { ar: "أصحاب اليمين", en: "The Companions of the Right" }
    range: [27, 40]
    family: faith
    summary:
      ar: "أصحاب اليمين ما أصحاب اليمين: في سدر مخضود وطلح منضود وظل ممدود وماء مسكوب وفاكهة كثيرة لا مقطوعة ولا ممنوعة، وفرش مرفوعة، إنا أنشأناهن إنشاء فجعلناهن أبكارا عربا أترابا، ثلة من الأولين وثلة من الآخرين."
      en: "The companions of the right — what are the companions of the right: among thornless lote trees, clustered acacia, extended shade, outpoured water, abundant fruit neither cut off nor forbidden, and raised couches; We formed their spouses anew as maidens, loving, of equal age — many from the former and many from the latter."
    children:
      - { title: { ar: "سدر مخضود وظل ممدود", en: "Lote Trees and Extended Shade" }, range: [27, 31] }
      - { title: { ar: "فاكهة وفرش مرفوعة", en: "Fruit and Raised Couches" }, range: [32, 40] }
  - title: { ar: "أصحاب الشمال", en: "The Companions of the Left" }
    range: [41, 56]
    family: faith
    summary:
      ar: "أصحاب الشمال ما أصحاب الشمال: في سموم وحميم وظل من يحموم لا بارد ولا كريم، إنهم كانوا قبل ذلك مترفين وكانوا يصرون على الحنث العظيم ويكذبون بالبعث، ثم إنهم لمجموعون إلى ميقات يوم معلوم لآكلون من شجر من زقوم فشاربون عليه من الحميم شرب الهيم، هذا نزلهم يوم الدين."
      en: "The companions of the left — what are the companions of the left: in scorching wind and scalding water, in the shade of black smoke, neither cool nor generous; before that they were indulgent, persisting in the great sin, denying resurrection; they will be gathered to a known Day's appointment, eating from the Zaqqum tree, drinking scalding water like thirsty camels — this is their hospitality on the Day of Recompense."
    children:
      - { title: { ar: "سموم وحميم وظل يحموم", en: "Scorching Wind, Scalding Water, Black Smoke" }, range: [41, 44] }
      - { title: { ar: "ترفهم وتكذيبهم بالبعث", en: "Their Indulgence and Denial of Resurrection" }, range: [45, 48] }
      - { title: { ar: "نزلهم يوم الدين", en: "Their Hospitality on the Day of Recompense" }, range: [49, 56] }
  - title: { ar: "أدلة البعث", en: "Proofs of Resurrection" }
    range: [57, 74]
    family: faith
    summary:
      ar: "نحن خلقناكم فلولا تصدقون: أفرأيتم ما تمنون أأنتم تخلقونه أم نحن الخالقون؛ وأفرأيتم ما تحرثون أأنتم تزرعونه أم نحن الزارعون؛ وأفرأيتم الماء الذي تشربون أأنتم أنزلتموه من المزن أم نحن المنزلون؛ وأفرأيتم النار التي تورون أأنتم أنشأتم شجرتها أم نحن المنشئون."
      en: "We created you — will you not believe: have you seen what you emit — do you create it or are We the Creators; have you seen what you sow — do you grow it or are We the Growers; have you seen the water you drink — did you send it from the clouds or did We; have you seen the fire you kindle — did you produce its tree or did We."
    children:
      - { title: { ar: "الخلق والنشأة الأولى", en: "Creation and the First Origination" }, range: [57, 62] }
      - { title: { ar: "الحرث والزرع", en: "Tilling and Growing" }, range: [63, 67] }
      - { title: { ar: "الماء الفرات", en: "The Sweet Water" }, range: [68, 70] }
      - { title: { ar: "النار التي تورون", en: "The Fire You Kindle" }, range: [71, 74] }
  - title: { ar: "القسم بمواقع النجوم", en: "The Oath by the Stars' Positions" }
    range: [75, 82]
    family: faith
    summary:
      ar: "فلا أقسم بمواقع النجوم وإنه لقسم لو تعلمون عظيم: إنه لقرآن كريم في كتاب مكنون لا يمسه إلا المطهرون، تنزيل من رب العالمين، أفبهذا الحديث أنتم مدهنون وتجعلون رزقكم أنكم تكذبون."
      en: "So I swear by the stars' positions — a mighty oath, did you but know: it is a noble Quran, in a guarded Book, touched only by the purified, a revelation from the Lord of the worlds — is it this discourse you take lightly, making your provision that you deny."
    children:
      - { title: { ar: "القسم العظيم", en: "The Mighty Oath" }, range: [75, 76] }
      - { title: { ar: "إنه لقرآن كريم", en: "It Is a Noble Quran" }, range: [77, 82] }
  - title: { ar: "أحوال المحتضرين والختام", en: "The Dying and the Close" }
    range: [83, 96]
    family: faith
    summary:
      ar: "فلولا إذا بلغت الحلقوم وأنتم حينئذ تنظرون ونحن أقرب إليه منكم ولكن لا تبصرون: فلولا إن كنتم غير مدينين ترجعونها إن كنتم صادقين؛ فأما إن كان من المقربين فروح وريحان وجنة نعيم، وأما إن كان من أصحاب اليمين فسلام لك من أصحاب اليمين، وأما إن كان من المكذبين الضالين فنزل من حميم وتصلية جحيم: إن هذا لهو حق اليقين فسبح باسم ربك العظيم."
      en: "Why then, when the soul reaches the throat and you look on — We nearer to him than you, but you do not see — why, if you are not to be recompensed, do you not return it, if truthful; as for the near ones: rest, sweet basil, and a garden of bliss; the companions of the right: peace to you from the companions of the right; the denying astray: scalding water's hospitality and Hell's roasting — this is the certain truth, so glorify your Lord's mighty name."
    children:
      - { title: { ar: "التحدي عند الاحتضار", en: "The Challenge at the Throat" }, range: [83, 87] }
      - { title: { ar: "إن كان من المقربين", en: "If He Is of the Near Ones" }, range: [88, 89] }
      - { title: { ar: "إن كان من أصحاب اليمين", en: "If He Is of the Companions of the Right" }, range: [90, 91] }
      - { title: { ar: "إن كان من المكذبين الضالين", en: "If He Is of the Denying Astray" }, range: [92, 96] }
