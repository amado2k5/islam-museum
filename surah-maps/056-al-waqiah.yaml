- title:
    ar: أصحاب اليمين
    en: The Companions of the Right
    tr: sağ el sahipleri
    id: pemilik tangan kanan
  range:
  - 27
  - 40
  family: faith
  summary:
    ar: 'أصحاب اليمين ما أصحاب اليمين: في سدر مخضود وطلح منضود وظل ممدود وماء مسكوب وفاكهة كثيرة لا مقطوعة ولا ممنوعة، وفرش مرفوعة، إنا أنشأناهن إنشاء فجعلناهن أبكارا عربا أترابا، ثلة من الأولين وثلة من
      الآخرين.'
    en: 'The companions of the right — what are the companions of the right: among thornless lote trees, clustered acacia, extended shade, outpoured water, abundant fruit neither cut off nor forbidden,
      and raised couches; We formed their spouses anew as maidens, loving, of equal age — many from the former and many from the latter.'
    tr: 'Sağdaki yoldaşlar sağdakilerdir: tıraşlı bir nilüfer ağacında, katlanmış bir gövdede, geniş bir gölgede, dökülen suda, ne kesilmiş ne de yasaklı bol meyvede ve yükseltilmiş döşemelerde. Gerçekten
      de onları uygun şekilde yarattık ve ilk doğan Arap nesilleri yaptık, birincilerden ve diğerlerinden oluşan bir grup.'
    id: 'Teman-teman kanan adalah teman dari kanan: di pohon lote yang dicukur, batang yang dilipat, naungan yang meluas, air yang dituangkan, buah melimpah, tidak dipotong maupun dilarang, dan perabot
      yang diangkat. Memang, Kami menciptakan mereka dengan cara yang tepat dan menjadikan mereka generasi Arab sulung, kelompok dari yang pertama dan kelompok dari yang lain.'
  children:
  - title:
