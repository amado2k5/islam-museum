surah: 56
slug: al-waqiah
sources_consulted:
- 'tadabbur-alquran.com — دليلك لتدبر سورة الواقعة: محورها تقرير البعث والجزاء، والأصناف الثلاثة'
- alukah.net — تفسير سورة الواقعة كاملة (تقسيم الآيات 1-96)
map:
- title:
    ar: وقوع الواقعة والأصناف الثلاثة
    en: 'The Event Occurs: The Three Classes'
    tr: Olayın meydana gelme tarihi ve üç kategori
    id: Kejadian insiden dan tiga kategori tersebut
  range:
  - 1
  - 10
  family: faith
  summary:
    ar: 'إذا وقعت الواقعة ليس لوقعتها كاذبة خافضة رافعة، إذا رجت الأرض رجا وبست الجبال بسا فكانت هباء منبثا، وكنتم أزواجا ثلاثة: أصحاب الميمنة وأصحاب المشأمة والسابقون.'
    en: 'When the Event occurs — none denying its coming — abasing, exalting; when the earth is shaken and the mountains crumble to scattered dust, you will be three classes: the companions of the right,
      the companions of the left, and the foremost.'
    tr: 'Olay gerçekleştiğinde, bu olay sahte, alçalan ya da yükselen değildir; yer umutla titrediğinde ve dağlar kuruduğunda, bir israf, dağılmış toza dönüşür. Siz üç çifttiniz: doğru olanlar, kavganın
      insanları ve en öndekiler.'
    id: 'Ketika peristiwa itu terjadi, peristiwanya bukanlah palsu, tidak merendahkan, atau terangkat; ketika bumi bergetar oleh harapan dan gunung-gunung kering, ia menjadi debu yang tersebar dan tersebar.
      Kalian adalah tiga pasangan: orang-orang yang benar, orang-orang yang sedang bertengkar, dan yang terdepan.'
  children: []
- title:
    ar: السابقون المقربون
    en: The Foremost, Brought Near
    tr: Önceki yakın olanlar
    id: Wawancara dekat sebelumnya
  range:
  - 11
  - 26
  family: faith
  summary:
    ar: أولئك المقربون في جنات النعيم، ثلة من الأولين وقليل من الآخرين، على سرر موضونة متكئين عليها متقابلين، يطوف عليهم ولدان مخلدون بأكواب وأباريق وكأس من معين، وفاكهة ولحم طير وحور عين، لا يسمعون فيها
      لغوا ولا تأثيما إلا قيلا سلاما سلاما.
    en: Those are the ones brought near, in the gardens of bliss — many from the former and few from the latter — on woven thrones, reclining facing one another, served by immortal youths with cups, pitchers,
      and a cup from a flowing spring, fruit and bird meat and wide-eyed maidens; they hear no idle talk nor sin, only peace upon peace.
    tr: Mutluluk bahçelerinde yanlarında olanlar, ilk ve birkaç kişiden oluşan bir grup, kanepelerde yüz yüze uzanmış, etraflarında fincanlar, sürahiler, bir fincan bahar, meyve, kuş eti ve kavaklar giymiş
      ölümsüz çocuklar vardı, orada ne konuşma ne de günah duyuyorlar, sadece barış ve huzur mırıltısı.
    id: Mereka yang dekat di taman kebahagiaan, sekelompok yang pertama dan beberapa lainnya, di sofa bersandar saling berhadapan, dikelilingi oleh anak-anak abadi yang dihiasi dengan cangkir, kendi, cangkir
      musim semi, buah, daging burung, dan poplar, di mana mereka tidak mendengar ucapan atau dosa kecuali bisikan damai, damai.
  children:
