- title:
    ar: أحوال المحتضرين والختام
    en: The Dying and the Close
    tr: Ölme koşulları ve sonuç
    id: Kondisi kematian dan kesimpulan
  range:
  - 83
  - 96
  family: faith
  summary:
    ar: 'فلولا إذا بلغت الحلقوم وأنتم حينئذ تنظرون ونحن أقرب إليه منكم ولكن لا تبصرون: فلولا إن كنتم غير مدينين ترجعونها إن كنتم صادقين؛ فأما إن كان من المقربين فروح وريحان وجنة نعيم، وأما إن كان من أصحاب
      اليمين فسلام لك من أصحاب اليمين، وأما إن كان من المكذبين الضالين فنزل من حميم وتصلية جحيم: إن هذا لهو حق اليقين فسبح باسم ربك العظيم.'
    en: 'Why then, when the soul reaches the throat and you look on — We nearer to him than you, but you do not see — why, if you are not to be recompensed, do you not return it, if truthful; as for the
      near ones: rest, sweet basil, and a garden of bliss; the companions of the right: peace to you from the companions of the right; the denying astray: scalding water''s hospitality and Hell''s roasting
      — this is the certain truth, so glorify your Lord''s mighty name.'
    tr: 'Eğer boğaza ulaşıp sonra bakarsanız ve biz ona sizden daha yakınız ama görmüyorsanız: Borçlu değilseniz, dürüstseniz geri verirsiniz; ama o yakınlardansa, ruh, fesleğen ve mutluluk bahçesi; ama
      doğru yoldaşlardansa, doğru yoldaşlardan selam size olsun; ama eğer o inkârcılardan ve yoldan sapmışsa, cehennemin sıcaklığından ve duasından inin; bu kesin gerçektir, büyük Rabbinizin adını yüceltin.'
    id: 'Jadi jika bukan karena kamu mencapai tenggorokan lalu kamu melihat, dan Kami lebih dekat pada-Nya daripada kamu tetapi tidak melihat: Jika kamu tidak berhutang, kamu akan membalasnya jika kamu
      jujur; tetapi jika dia di antara yang dekat, maka roh, basil, dan Taman kebahagiaan; tetapi jika dia di antara sahabat yang benar, damai menyertaimu dari sahabat-sahabat yang benar; tetapi jika dia
      termasuk di antara para penyangkal dan tersesat, maka turunlah dari hangat dan doa Neraka: memang, inilah kebenaran kepastian, maka muliakanlah nama Tuhanmu yang agung.'
