- title:
    ar: أصحاب الشمال
    en: The Companions of the Left
    tr: Kuzey halkı
    id: Orang-orang Utara
  range:
  - 41
  - 56
  family: faith
  summary:
    ar: 'أصحاب الشمال ما أصحاب الشمال: في سموم وحميم وظل من يحموم لا بارد ولا كريم، إنهم كانوا قبل ذلك مترفين وكانوا يصرون على الحنث العظيم ويكذبون بالبعث، ثم إنهم لمجموعون إلى ميقات يوم معلوم لآكلون من
      شجر من زقوم فشاربون عليه من الحميم شرب الهيم، هذا نزلهم يوم الدين.'
    en: 'The companions of the left — what are the companions of the left: in scorching wind and scalding water, in the shade of black smoke, neither cool nor generous; before that they were indulgent,
      persisting in the great sin, denying resurrection; they will be gathered to a known Day''s appointment, eating from the Zaqqum tree, drinking scalding water like thirsty camels — this is their hospitality
      on the Day of Recompense.'
    tr: 'Kuzey halkı, kuzey halkı nedir: zehirde, sarhoşlukta ve yıkanların gölgesinde, ne soğuk ne de soylu. Ondan önce zenginlerdi, büyük itaatsizlikte ısrar ediyor ve dirilmeyi reddediyorlardı. Sonra
      belirlenen zamanda, bilinen bir günde toplanıp Zeqqum ağaçlarından yemek ve humimden al-heem içkisi gibi içtiler. Bu, Kıyamet Günü''ndeki inişleridir.'
    id: 'Orang-orang utara, apa itu orang-orang utara: dalam racun, mabuk, dan bayang-bayang mereka yang sedang mandi, tidak dingin maupun mulia. Sebelumnya, mereka kaya, menuntut ketidaktaatan besar dan
      menolak kebangkitan. Kemudian mereka berkumpul pada waktu yang ditentukan pada hari yang diketahui untuk makan dari pohon-pohon Zaqqum dan minum dari humim seperti minuman al-heem. Inilah penurunan
      mereka pada Hari Penghakiman.'
  children:
  - title:
      ar: سموم وحميم وظل يحموم
      en: Scorching Wind, Scalding Water, Black Smoke
      tr: Zehirler ve samimiyet ve sürekli ısınıyordu
