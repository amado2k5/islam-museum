- title:
    ar: القسم بمواقع النجوم
    en: The Oath by the Stars' Positions
    tr: Yıldızların konumları bölümü
    id: Bagian tentang lokasi bintang
  range:
  - 75
  - 82
  family: faith
  summary:
    ar: 'فلا أقسم بمواقع النجوم وإنه لقسم لو تعلمون عظيم: إنه لقرآن كريم في كتاب مكنون لا يمسه إلا المطهرون، تنزيل من رب العالمين، أفبهذا الحديث أنتم مدهنون وتجعلون رزقكم أنكم تكذبون.'
    en: 'So I swear by the stars'' positions — a mighty oath, did you but know: it is a noble Quran, in a guarded Book, touched only by the purified, a revelation from the Lord of the worlds — is it this
      discourse you take lightly, making your provision that you deny.'
    tr: 'Bu yüzden yıldızların konumlarına yemin etmiyorum, çünkü eğer bilseydiniz büyük bir yemindir: sadece saf olanın dokunabileceği bir kitapta gizlenmiş yüce bir Kur''an, dünyaların Rabbinden bir vahiydir.
      Bu hadislerle aldatılıyorsunuz ve geçiminizi yalan söylediğinizle sağlıyorsunuz.'
    id: 'Jadi saya tidak bersumpah pada posisi bintang-bintang, karena itu adalah sumpah besar jika Anda tahu: ini adalah Al-Qur''an mulia, tersembunyi dalam sebuah kitab yang hanya dapat disentuh oleh
      yang suci, sebuah wahyu dari Tuhan segala alam. Jadi dengan hadits ini Anda sedang ditipu dan Anda membuat mata pencaharian Anda sebagai pembohongan.'
  children:
  - title:
      ar: القسم العظيم
      en: The Mighty Oath
      tr: Büyük Bölüm
      id: Bagian Besar
    range:
    - 75
    - 76
  - title:
