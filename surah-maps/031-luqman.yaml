- title:
    ar: نعم الله وعناد المشركين
    en: Allah's Blessings; the Deniers' Obstinacy
    tr: Evet Allah ve putperestlerin inatçılığı
    id: Ya Allah dan keras kepala para politeis
  range:
  - 20
  - 31
  family: faith
  summary:
    ar: تسخير ما في السماوات والأرض، وجدال المشركين بالتقليد، وسعة علم الله، وتوحيده الفطري الذي يظهر عند الشدة.
    en: All in heavens and earth subjected to man, the deniers' blind imitation, the vastness of Allah's knowledge, and the inborn monotheism surfacing in distress.
    tr: Göklerde ve yeryüzünde olanı kontrol etmek, çoktanrılıların taklit yoluyla argümanları, Tanrı'nın bilgisinin enginliği ve zor zamanlarda ortaya çıkan doğuştan gelen birliği.
    id: Memanfaatkan apa yang ada di langit dan bumi, argumen para politeis melalui peniruan, luasnya pengetahuan Tuhan, dan kesatuan-Nya yang muncul di saat-saat kesulitan.
