- title:
    ar: التقوى ومفاتح الغيب
    en: God-consciousness; the Keys of the Unseen
    tr: Dindarlık ve Görünmeyenin Anahtarları
    id: Kesalehan dan Kunci Yang Tak Terlihat
  range:
  - 32
  - 34
  family: faith
  summary:
    ar: اتقوا يوما لا يجزي والد عن ولده؛ إن الله عنده علم الساعة وينزل الغيث ويعلم ما في الأرحام.
    en: Fear a Day when no parent avails a child; with Allah alone is knowledge of the Hour, the rain, and what the wombs bear.
    tr: Bir babanın çocuğuna karşılık vermeyeceği bir günden sakın; Allah Saati bilir, yağmur yağdırır ve rahmde ne olduğunu bilir.
    id: Berhati-hatilah dengan hari ketika seorang ayah tidak akan membalas budi untuk anaknya; sesungguhnya, Allah mengetahui Jamnya, menurunkan hujan, dan mengetahui apa yang ada di dalam rahim.
