surah: 31
slug: luqman
sources_consulted:
  - "arz.wikipedia.org — سورة لقمان (المواضيع: 1-9، 10-11، 12-19، 20-31، 32-34)"
  - "quran.inoor.ir — محتوى وموضوعات سورة لقمان (خمسة أقسام)"
  - "ar.wikipedia.org — سورة لقمان (مواعظ لقمان ووصاياه)"
map:
  - title: { ar: "الكتاب الحكيم وصفات المحسنين", en: "The Wise Book; Traits of the Doers of Good" }
    range: [1, 9]
    family: faith
    summary:
      ar: "آيات الكتاب الحكيم هدى ورحمة للمحسنين: يقيمون الصلاة ويؤتون الزكاة وهم بالآخرة يوقنون، بخلاف اللاهين عنها."
      en: "The Wise Book's verses are guidance and mercy for the doers of good — prayer, charity, certainty in the Hereafter — unlike those diverted from it."
    children: []
  - title: { ar: "أدلة الوحدانية في الخلق", en: "Proofs of Oneness in Creation" }
    range: [10, 11]
    family: faith
    summary:
      ar: "خلق السماوات بغير عمد، والجبال الرواسي، وبث الدواب، وإنزال الماء — هذا خلق الله فأروني ماذا خلق الذين من دونه."
      en: "Heavens raised without pillars, firm mountains, scattered creatures, rain sent down — 'this is Allah's creation; show Me what others created.'"
    children: []
  - title: { ar: "وصايا لقمان لابنه", en: "Luqman's Counsel to His Son" }
    range: [12, 19]
    family: stories
    summary:
      ar: "حكمة لقمان في وصيته: التوحيد ونبذ الشرك، وبر الوالدين، ومراقبة الله، والصلاة والأمر بالمعروف، وآداب المشي والصوت."
      en: "Luqman's wisdom in his counsel: pure monotheism, honoring parents, mindfulness of Allah, prayer and enjoining good, manners of walking and voice."
    children:
      - { title: { ar: "النهي عن الشرك", en: "Forbidding Association" }, range: [13, 13] }
      - { title: { ar: "بر الوالدين", en: "Honoring Parents" }, range: [14, 15] }
      - { title: { ar: "مراقبة الله", en: "Mindfulness of Allah" }, range: [16, 16] }
      - { title: { ar: "الصلاة والأمر بالمعروف", en: "Prayer and Enjoining Good" }, range: [17, 17] }
      - { title: { ar: "آداب المشي والصوت", en: "Manners of Walking and Voice" }, range: [18, 19] }
  - title: { ar: "نعم الله وعناد المشركين", en: "Allah's Blessings; the Deniers' Obstinacy" }
    range: [20, 31]
    family: faith
    summary:
      ar: "تسخير ما في السماوات والأرض، وجدال المشركين بالتقليد، وسعة علم الله، وتوحيده الفطري الذي يظهر عند الشدة."
      en: "All in heavens and earth subjected to man, the deniers' blind imitation, the vastness of Allah's knowledge, and the inborn monotheism surfacing in distress."
    children:
      - { title: { ar: "التقليد الأعمى للآباء", en: "Blind Imitation of Forefathers" }, range: [21, 21] }
      - { title: { ar: "سعة علم الله", en: "The Vastness of Allah's Knowledge" }, range: [27, 27] }
  - title: { ar: "التقوى ومفاتح الغيب", en: "God-consciousness; the Keys of the Unseen" }
    range: [32, 34]
    family: faith
    summary:
      ar: "اتقوا يوما لا يجزي والد عن ولده؛ إن الله عنده علم الساعة وينزل الغيث ويعلم ما في الأرحام."
      en: "Fear a Day when no parent avails a child; with Allah alone is knowledge of the Hour, the rain, and what the wombs bear."
    children:
      - { title: { ar: "مفاتح الغيب الخمسة", en: "The Five Keys of the Unseen" }, range: [34, 34] }
