map:
- title:
    ar: الكتاب الحكيم وصفات المحسنين
    en: The Wise Book; Traits of the Doers of Good
    tr: Bilge Kitap ve Hayırseverlerin Nitelikleri
    id: Kitab Bijak dan Kualitas Para Dermawan
  range:
  - 1
  - 9
  family: faith
  summary:
    ar: 'آيات الكتاب الحكيم هدى ورحمة للمحسنين: يقيمون الصلاة ويؤتون الزكاة وهم بالآخرة يوقنون، بخلاف اللاهين عنها.'
    en: The Wise Book's verses are guidance and mercy for the doers of good — prayer, charity, certainty in the Hereafter — unlike those diverted from it.
    tr: 'Bilgelik Kitabı''nın ayetleri, iyilik yapanlar için rehberlik ve merhamettir: Onlar dua eder ve zekat verirler, ancak ahiretten emin olurlar, dikkati dağılmışların aksine.'
    id: 'Ayat-ayat dalam Kitab Bijak adalah petunjuk dan belas kasih bagi para pelaku kebaikan: Mereka menetapkan doa dan memberikan zakat sambil yakin akan Akhirat, berbeda dengan mereka yang teralihkan
      darinya.'
  children: []
- title:
    ar: أدلة الوحدانية في الخلق
    en: Proofs of Oneness in Creation
    tr: Yaratılışta Birlik Kanıtı
    id: Bukti Kesatuan dalam Penciptaan
  range:
  - 10
  - 11
  family: faith
  summary:
    ar: خلق السماوات بغير عمد، والجبال الرواسي، وبث الدواب، وإنزال الماء — هذا خلق الله فأروني ماذا خلق الذين من دونه.
    en: Heavens raised without pillars, firm mountains, scattered creatures, rain sent down — 'this is Allah's creation; show Me what others created.'
    tr: Gökleri sütunsuz yarattı, dik dağları, hayvanların dağılmasını ve suyun inmesini yarattı—bunlar Tanrı'nın yaratılışıdır, o halde bana O'nun dışında ne yarattığını göster.
    id: Dia menciptakan langit tanpa pilar, gunung curam, penyebaran binatang, dan penurunan air—ini adalah ciptaan Tuhan, jadi tunjukkan padaku apa yang Dia ciptakan selain Dia.
  children: []
- title:
    ar: وصايا لقمان لابنه
    en: Luqman's Counsel to His Son
    tr: Luqman'ın Oğluna Verdiği Emirler
    id: Perintah Luqman kepada Putranya
  range:
  - 12
  - 19
  family: stories
  summary:
    ar: 'حكمة لقمان في وصيته: التوحيد ونبذ الشرك، وبر الوالدين، ومراقبة الله، والصلاة والأمر بالمعروف، وآداب المشي والصوت.'
    en: 'Luqman''s wisdom in his counsel: pure monotheism, honoring parents, mindfulness of Allah, prayer and enjoining good, manners of walking and voice.'
    tr: 'Luqman''ın öğütlerindeki bilgeliği: tek tanrıcılık, çoktanrıcılığın reddi, ebeveynlere saygı gösterme, Tanrı''yı gözlemlemek, dua etmek ve iyiliği teşvik etmek, yürüme ve ses görgü kuralları.'
    id: 'Kebijaksanaan Luqman dalam nasihatnya: monoteisme, penolakan politeisme, menghormati orang tua, mengamati Tuhan, doa dan memerintahkan kebaikan, serta etiket berjalan dan bersuara.'
