surah: 12
slug: yusuf
sources_consulted:
- kuttab.com — Surah Yusuf mind map (7 blocks)
- 'alloschool.com — thematic units of Surah Yusuf (cross-checked: 1-3, 4-6, 7-21)'
map:
- title:
    ar: الافتتاح والرؤيا
    en: The Opening and the Dream
    tr: Açılış ve Vizyon
    id: Pembukaan dan Visi
  range:
  - 1
  - 6
  family: stories
  summary:
    ar: الثناء على أحسن القصص، ورؤيا يوسف لأبيه، وتوجيه يعقوب له بكتمانها عن إخوته.
    en: Praise of the best of stories; Yusuf's dream told to his father, and Jacob's counsel to conceal it.
    tr: En iyi hikayeleri övmek, Joseph'in babası vizyonunu ve Jacob'un onları kardeşlerinden gizlemesi için verdiği rehberlik.
    id: Memuji cerita terbaik, visi Joseph tentang ayahnya, dan bimbingan Yakub agar menyembunyikannya dari saudara-saudaranya.
  children:
  - title:
      ar: رؤيا يوسف
      en: Yusuf's Dream
      tr: Roya Youssef
      id: Roya Youssef
    range:
    - 4
    - 6
- title:
    ar: الإخوة والجب
    en: The Brothers and the Well
    tr: Kardeşler ve Kardeşler
    id: Saudara dan Saudara
  range:
  - 7
  - 20
  family: stories
  summary:
    ar: مؤامرة الإخوة بدافع الحسد، وإلقاؤه في الجب، وكذبهم على أبيهم، وإنقاذ القافلة له وبيعه.
    en: The brothers' jealous plot, the well, their lie to their father, the caravan's rescue and his sale.
    tr: Kardeşlerin kıskançlıktan kaynaklanan komplosu, onu cebine atmak, babalarına yalan söylemek, kervanı onun için saklamak ve satmak.
    id: Konspirasi kedua saudara itu didorong oleh rasa iri, melemparkannya ke dalam saku, berbohong kepada ayah mereka, menyelamatkan karavan untuknya, dan menjualnya.
  children:
  - title:
      ar: مؤامرة الإخوة
      en: The Brothers' Plot
      tr: Kardeşlerin Komplosu
      id: Konspirasi Para Saudara
    range:
    - 7
    - 10
  - title:
      ar: الجب والقافلة
      en: The Well and the Caravan
      tr: Kuyu ve Kervan
      id: Sumur dan Karavan
    range:
    - 15
    - 19
- title:
    ar: بيت العزيز
    en: The House of al-Aziz
    tr: Beit al-Aziz
    id: Beit al-Aziz
  range:
  - 21
  - 35
  family: stories
  summary:
    ar: نشأة يوسف في بيت العزيز بمصر، ومراودة امرأته له، وثباته، وشأن النسوة، ودخوله السجن.
    en: Yusuf raised in al-Aziz's house in Egypt; his mistress's seduction, his steadfastness, the women, then prison.
    tr: Yusuf, Mısır'daki Aziz ailesinde büyüdü; karısının ona olan ilgisi, kararlılığı, kadınlar arasındaki statüsü ve hapis cezası nedeniyle yaşandı.
    id: Yusuf tumbuh besar di rumah Aziz di Mesir, dengan pendekatan istrinya padanya, keteguhannya, statusnya di antara wanita, dan penahanannya.
  children:
  - title:
      ar: مراودة امرأة العزيز
      en: The Seduction
      tr: Sevgilinin karısıyla flört etmek
      id: Menggoda istri si tercinta
    range:
    - 23
    - 29
  - title:
      ar: النسوة
      en: The Women
      tr: Kadınlar
      id: Wanita
    range:
    - 30
    - 34
- title:
    ar: السجن وتعبير الرؤييين
    en: Prison and the Two Dreams
    tr: Hapishane ve Vizyonların Yorumlanması
    id: Penjara dan Penafsiran Penglihatan
  range:
  - 36
  - 42
  family: stories
  summary:
    ar: يوسف في السجن يدعو إلى التوحيد، ويعبر رؤيي صاحبيه، ويطلب من الناجي ذكره عند الملك.
    en: In prison Yusuf calls to pure faith, interprets his companions' dreams, asks the survivor to mention him.
    tr: Hapiste Joseph tek tanrıcılığa çağrıda bulunur, iki arkadaşının vizyonlarını ifade eder ve hayatta kalanlardan kralın önünde kendisinden bahsetmesini ister.
    id: Di penjara, Yusuf menyerukan monoteisme, mengungkapkan penglihatan dua rekannya, dan meminta yang selamat untuk menyebutkannya di hadapan raja.
  children:
  - title:
      ar: تعبير الرؤييين
      en: Interpreting the Two Dreams
      tr: Vizyonerlerin Yorumu
      id: Interpretasi Para Visioner
    range:
    - 36
    - 41
- title:
    ar: رؤيا الملك والتمكين
    en: The King's Dream and Establishment
    tr: Kralın Vizyonu ve Güçlendirilmesi
    id: Visi dan Pemberdayaan Raja
  range:
  - 43
  - 57
  family: stories
  summary:
    ar: رؤيا الملك للبقرات والسنابل، وتعبير يوسف، وبراءته، وتوليته خزائن الأرض.
    en: The king's dream of cattle and ears of grain; Yusuf's interpretation, his vindication, charge of the storehouses.
    tr: Kralın inekler ve tahıl koçanları vizyonu, Joseph'in ifadesi, masumiyeti ve dünyanın hazinelerini sahiplenmesi.
    id: Penglihatan raja tentang sapi dan tongkol gandum, ekspresi Yusuf, kepolosannya, dan pengambilannya atas harta bumi.
  children:
  - title:
      ar: رؤيا الملك
      en: The King's Dream
      tr: Kralın Vizyonu
      id: Visi Raja
    range:
    - 43
    - 49
  - title:
      ar: خزائن الأرض
      en: The Storehouses of the Land
      tr: Toprak Dolapları
      id: Lemari Tanah
    range:
    - 55
    - 57
- title:
    ar: عودة الإخوة
    en: The Brothers Return
    tr: Kardeşlerin Dönüşü
    id: Kembalinya Para Saudara
  range:
  - 58
  - 93
  family: stories
  summary:
    ar: قدوم الإخوة للميرة، وأخذ بنيامين بحيلة الصواع، ثم تعريف يوسف بنفسه وعفوه عنهم.
    en: The brothers come for grain; Benjamin taken by the cup's stratagem; Yusuf reveals himself and forgives.
    tr: Kardeşler saraya geldiler ve Benyamin kılıçların kurnazlığını kullandı, ardından Joseph kendini tanıttı ve onları affetti.
    id: Para saudara tiba di istana, dan Benjamin menggunakan kecerdikan pedang, lalu Yusuf memperkenalkan diri dan mengampuni mereka.
  children:
  - title:
      ar: حيلة الصواع
      en: The Cup's Stratagem
      tr: Bataklıkların hilesi
      id: Trik para rawa
    range:
    - 69
    - 79
  - title:
      ar: تعريف يوسف بنفسه
      en: Yusuf Reveals Himself
      tr: Yusuf Kendini Tanıtıyor
      id: Yusuf memperkenalkan diri
    range:
    - 89
    - 92
- title:
    ar: اللقاء والخاتمة
    en: The Reunion and the Closing
    tr: Toplantı ve Sonuç
    id: Pertemuan dan Kesimpulan
  range:
  - 94
  - 111
  family: stories
  summary:
    ar: البشارة بقميص يوسف، واجتماع الأسرة في مصر، وسجودهم له، ودعاؤه، وخاتمة السورة بالعبرة.
    en: Glad tidings by Yusuf's shirt, the family reunited in Egypt, their prostration, his supplication, the closing lesson.
    tr: Yusuf'un gömleğinin kutsal müjdesi, ailenin Mısır'da toplanması, ona secdeleri, onun duası ve surenin derslerle sona ermesi.
    id: Kabar gembira tentang kemeja Yusuf, pertemuan keluarga di Mesir, sujud mereka kepadanya, permohonannya, dan penutupan surah dengan pelajaran.
  children:
  - title:
      ar: قميص البشارة
      en: The Shirt of Glad Tidings
      tr: Müjde gömleği
      id: Kaos Kabar Sukacita
    range:
    - 94
    - 96
  - title:
      ar: دعاء يوسف
      en: Yusuf's Supplication
      tr: Doaa Youssef
      id: Doaa Youssef
    range:
