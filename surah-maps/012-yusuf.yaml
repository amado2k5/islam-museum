surah: 12
slug: yusuf
sources_consulted:
  - "kuttab.com — Surah Yusuf mind map (7 blocks)"
  - "alloschool.com — thematic units of Surah Yusuf (cross-checked: 1-3, 4-6, 7-21)"
map:
  - title: { ar: "الافتتاح والرؤيا", en: "The Opening and the Dream" }
    range: [1, 6]
    family: stories
    summary:
      ar: "الثناء على أحسن القصص، ورؤيا يوسف لأبيه، وتوجيه يعقوب له بكتمانها عن إخوته."
      en: "Praise of the best of stories; Yusuf's dream told to his father, and Jacob's counsel to conceal it."
    children:
      - { title: { ar: "رؤيا يوسف", en: "Yusuf's Dream" }, range: [4, 6] }
  - title: { ar: "الإخوة والجب", en: "The Brothers and the Well" }
    range: [7, 20]
    family: stories
    summary:
      ar: "مؤامرة الإخوة بدافع الحسد، وإلقاؤه في الجب، وكذبهم على أبيهم، وإنقاذ القافلة له وبيعه."
      en: "The brothers' jealous plot, the well, their lie to their father, the caravan's rescue and his sale."
    children:
      - { title: { ar: "مؤامرة الإخوة", en: "The Brothers' Plot" }, range: [7, 10] }
      - { title: { ar: "الجب والقافلة", en: "The Well and the Caravan" }, range: [15, 19] }
  - title: { ar: "بيت العزيز", en: "The House of al-Aziz" }
    range: [21, 35]
    family: stories
    summary:
      ar: "نشأة يوسف في بيت العزيز بمصر، ومراودة امرأته له، وثباته، وشأن النسوة، ودخوله السجن."
      en: "Yusuf raised in al-Aziz's house in Egypt; his mistress's seduction, his steadfastness, the women, then prison."
    children:
      - { title: { ar: "مراودة امرأة العزيز", en: "The Seduction" }, range: [23, 29] }
      - { title: { ar: "النسوة", en: "The Women" }, range: [30, 34] }
  - title: { ar: "السجن وتعبير الرؤييين", en: "Prison and the Two Dreams" }
    range: [36, 42]
    family: stories
    summary:
      ar: "يوسف في السجن يدعو إلى التوحيد، ويعبر رؤيي صاحبيه، ويطلب من الناجي ذكره عند الملك."
      en: "In prison Yusuf calls to pure faith, interprets his companions' dreams, asks the survivor to mention him."
    children:
      - { title: { ar: "تعبير الرؤييين", en: "Interpreting the Two Dreams" }, range: [36, 41] }
  - title: { ar: "رؤيا الملك والتمكين", en: "The King's Dream and Establishment" }
    range: [43, 57]
    family: stories
    summary:
      ar: "رؤيا الملك للبقرات والسنابل، وتعبير يوسف، وبراءته، وتوليته خزائن الأرض."
      en: "The king's dream of cattle and ears of grain; Yusuf's interpretation, his vindication, charge of the storehouses."
    children:
      - { title: { ar: "رؤيا الملك", en: "The King's Dream" }, range: [43, 49] }
      - { title: { ar: "خزائن الأرض", en: "The Storehouses of the Land" }, range: [55, 57] }
  - title: { ar: "عودة الإخوة", en: "The Brothers Return" }
    range: [58, 93]
    family: stories
    summary:
      ar: "قدوم الإخوة للميرة، وأخذ بنيامين بحيلة الصواع، ثم تعريف يوسف بنفسه وعفوه عنهم."
      en: "The brothers come for grain; Benjamin taken by the cup's stratagem; Yusuf reveals himself and forgives."
    children:
      - { title: { ar: "حيلة الصواع", en: "The Cup's Stratagem" }, range: [69, 79] }
      - { title: { ar: "تعريف يوسف بنفسه", en: "Yusuf Reveals Himself" }, range: [89, 92] }
  - title: { ar: "اللقاء والخاتمة", en: "The Reunion and the Closing" }
    range: [94, 111]
    family: stories
    summary:
      ar: "البشارة بقميص يوسف، واجتماع الأسرة في مصر، وسجودهم له، ودعاؤه، وخاتمة السورة بالعبرة."
      en: "Glad tidings by Yusuf's shirt, the family reunited in Egypt, their prostration, his supplication, the closing lesson."
    children:
      - { title: { ar: "قميص البشارة", en: "The Shirt of Glad Tidings" }, range: [94, 96] }
      - { title: { ar: "دعاء يوسف", en: "Yusuf's Supplication" }, range: [101, 101] }
