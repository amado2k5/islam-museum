- title:
    ar: السابقون والثلاثة والخاتمة
    en: The Foremost, the Three, and the Closing
    tr: Önceki, üçü ve sonuç
    id: Yang sebelumnya, ketiga, dan kesimpulan
  range:
  - 100
  - 129
  family: faith
  summary:
    ar: فضل السابقين الأولين، ومسجد ضرار، وبيعة الله للمؤمنين، وتوبة الثلاثة الذين خلفوا، وختام بالحرص والرحمة.
    en: The merit of the foremost emigrants and helpers; the mosque of harm; Allah's transaction with believers; the three forgiven; a close of care and mercy.
    tr: Erken öncekilerin erdemleri, Darar camisi, Allah'ın müminlere sözünü etmesi, geride kalan üç kişinin tövbesi ve dikkatle ve merhametle bitirilmesi.
    id: Kebajikan para pendahulu dahulu, masjid Darar, janji Allah kepada umat berimim, pertobatan tiga orang yang datang di belakang, dan penutupan dengan perhatian dan belas kasih.
