map:
- title:
    ar: البراءة من المشركين
    en: Disavowal of the Polytheists
    tr: Çok tanrılılardan masumiyet
    id: Kepolosan dari para politeis
  range:
  - 1
  - 29
  family: law
  summary:
    ar: إعلان البراءة ونبذ العهود، وأحكام الأشهر الحرم والقتال والجزية، وعمارة المساجد للموحدين.
    en: Declaring disavowal and renouncing treaties; rulings of the sacred months, fighting, and the tribute; mosques maintained by the monotheists.
    tr: İnkar bildirisi, antlaşmalardan feragat etme, kutsal ayların hükümleri, çatışmalar, cizye ve Almohadlar için cami inşası.
    id: Deklarasi penolakan, penolakan perjanjian, penetapan bulan-bulan suci, pertempuran, jizya, dan pembangunan masjid untuk Almohad.
