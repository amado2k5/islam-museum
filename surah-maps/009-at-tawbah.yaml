- title:
    ar: المؤمنون أولياء والصدقات
    en: Believers Allied, and Charity
    tr: İnananlar koruyucu ve hayırseverdir
    id: Orang percaya adalah penjaga dan amal
  range:
  - 71
  - 99
  family: law
  summary:
    ar: المؤمنون والمؤمنات أولياء بعض، ووعد الله لهم الجنة، والنهي عن الاستغفار والصلاة على المنافقين.
    en: Believing men and women are allies of one another; Allah's promise of Paradise; no seeking forgiveness or praying over hypocrites.
    tr: İnananlar ve inananlar birbirinin müttefikleridir ve Allah onlara cennet vaat etmiştir; ikiyüzlülere af dilemeleri ve bereketler göndermeleri yasaklanmıştır.
    id: Orang yang percaya dan orang yang percaya adalah sekutu satu sama lain, dan Tuhan telah menjanjikan mereka Surga, melarang mencari pengampunan dan mengirimkan berkat kepada orang munafik.
  children:
