- title:
    ar: الأعذار والمنافقون
    en: The Excuses and the Hypocrites
    tr: Bahaneler ve ikiyüzlüler
    id: Alasan dan munafik
  range:
  - 43
  - 70
  family: faith
  summary:
    ar: كشف أعذار المتخلفين عن تبوك، وصفات المنافقين واستهزائهم، ومصارف الزكاة الثمانية.
    en: Exposing the excuses of those who stayed back from Tabuk; the hypocrites' traits and mockery; the eight categories of zakah.
    tr: Tabuk'ta geride kalanların mazeretlerini, ikiyüzlülerin özelliklerini ve alay edilmesini, sekiz zekat harcamasını ortaya koymak.
    id: Mengungkap alasan mereka yang tertinggal di Tabuk, sifat dan ejekan para munafik, serta delapan pengeluaran zakat.
  children:
  - title:
      ar: المستأذنون في التخلف
