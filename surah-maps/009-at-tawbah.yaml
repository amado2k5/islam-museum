- title:
    ar: كنز الذهب والنفير
    en: Hoarded Gold and the Call to March
    tr: Altın hazinesi ve alarm
    id: Harta emas dan alarm
  range:
  - 30
  - 42
  family: faith
  summary:
    ar: كفر الغلو في عزير والمسيح، ووعيد كانزي الذهب والفضة، والنفير العام إلى تبوك.
    en: The excess over Ezra and the Messiah refuted; the threat to hoarders of gold and silver; the general march to Tabuk.
    tr: Uzair ve Mesih'teki aşırılık küferi, altın ve gümüş vaadi ve Tabuk'a genel seferberlik.
    id: Penghujatan ekstremisme di Uzair dan Mesias, janji emas dan perak, serta mobilisasi umum ke Tabuk.
