map:
- title:
    ar: أصحاب الفيل
    en: The Companions of the Elephant
    tr: fil sahipleri
    id: pemilik gajah
  range:
  - 1
  - 5
  family: stories
  summary:
    ar: 'ألم تر كيف فعل ربك بأصحاب الفيل: ألم يجعل كيدهم في تضليل، وأرسل عليهم طيرا أبابيل ترميهم بحجارة من سجيل فجعلهم كعصف مأكول.'
    en: Have you not seen what your Lord did to the companions of the elephant? He made their plot go astray, sent birds in flocks pelting them with clay stones, leaving them like eaten straw.
    tr: 'Rabbinizin fil yoldaşlarına nasıl davrandığını görmediniz mi: Onların komplolarını aldatmadı mı, üzerlerine adaçayı taşları attırmak için Ababil kuşlarını göndermedi mi, onları yenilmiş bufalo
      gibi yaptı?'
    id: 'Tidakkah kau melihat bagaimana Tuhanmu memperlakukan para pengikut gajah: Bukankah Dia membuat mereka menyesatkan mereka, dan mengutus burung-burung Ababil melemparkan batu bijak, membuat mereka
      seperti kerbau yang dimakan?'
