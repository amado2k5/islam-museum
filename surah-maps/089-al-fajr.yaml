map:
- title:
    ar: القسم بالفجر
    en: The Oath by the Dawn
    tr: Şafakta yemin
    id: Sumpah saat fajar
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'والفجر وليال عشر والشفع والوتر والليل إذا يسر: هل في ذلك قسم لذي حجر.'
    en: By the dawn, the ten nights, the even and the odd, the night as it passes — is there not in that an oath for one of sense?
    tr: 'Ve şafak, on gece, aracılık, tek bir gece ve eğer kolaysa: taşı olan için bir ayrım var mı?'
    id: 'Dan fajar, sepuluh malam, perantaraan, yang sesekali, dan malam jika mudah: apakah ada pembagian di antara yang memegang batu?'
  children: []
- title:
    ar: عاد وثمود وفرعون
    en: Ad, Thamud and Pharaoh
    tr: Aad, Thamud ve Firavun
    id: Aad, Thamud, dan Firaun
  range:
  - 6
  - 14
  family: stories
  summary:
    ar: 'ألم تر كيف فعل ربك بعاد إرم ذات العماد وثمود الذين جابوا الصخر وفرعون ذي الأوتاد: فصب عليهم ربك سوط عذاب.'
    en: Have you not seen what your Lord did to Ad of the pillars, Thamud who carved the rocks, Pharaoh of the stakes? Your Lord poured upon them a scourge of punishment.
    tr: Rabbinizin Ad, Iram, destek direği ve Semud'a nasıl davrandığını görmediniz mi, onlar taşlarla taşlandılar, Firavun ise kazıklarla Rabbiniz onlara bir ceza kırbaç döktü.
    id: 'Tidakkah kau melihat bagaimana Tuhanmu memperlakukan ''Ad, Iram, tiang penyangga, dan Thamud yang dilempari batu itu, serta Firaun dengan pancang-pancang: maka Tuhanmu menuangkan cambuk hukuman
      ke atas mereka.'
  children: []
- title:
    ar: الإنسان والابتلاء
    en: Man Tested
    tr: İnsan ve Rahatsızlık
    id: Manusia dan Penyakit
  range:
  - 15
  - 20
  family: faith
  summary:
    ar: 'فأما الإنسان إذا ما ابتلاه ربه فأكرمه ونعمه فيقول ربي أكرمن، وإذا قدر عليه رزقه فيقول ربي أهانن: كلا بل لا يكرمون اليتيم.'
    en: When his Lord tests man with honor he says 'my Lord honored me'; when restricted, 'my Lord humiliated me' — no indeed; the fault is neglecting the orphan and the poor.
    tr: Bir kişiye gelince, Rabbi onu sınadığında, ona saygı gösterir ve 'Efendim, bana saygı göster.' der. Ve ona bakabildiğinde, 'Efendim, onları aşağılıyorum.' der. Hayır, ama yetimi onurlandırmazlar.
    id: Adapun seseorang, ketika Tuhan-Nya mengujinya, Dia menghormatinya dan memberkati-Nya, berkata, 'Tuhanku, hormatilah aku.' Dan ketika Dia mampu memberkatinya, Dia berkata, 'Tuhanku, aku menghina
      mereka.' Tidak, tetapi mereka tidak menghormati anak yatim.
  children: []
- title:
    ar: النفس المطمئنة
    en: The Tranquil Soul
    tr: Sakin ruh
    id: Jiwa yang tenang
  range:
  - 21
  - 30
  family: faith
  summary:
    ar: 'كلا إذا دكت الأرض دكا دكا وجاء ربك والملك صفا صفا وجيء يومئذ بجهنم: يا أيتها النفس المطمئنة ارجعي إلى ربك راضية مرضية.'
    en: 'When the earth is pounded to dust and Hell is brought near: O tranquil soul, return to your Lord, pleased and pleasing — enter among My servants, enter My Paradise.'
    tr: 'Hayır, yer dövüldüğünde, Rabbin ve egemenlik sırayla geldiğinde ve o gün cehennem cehenneme getirildiğinde: Ey huzurlu ruh, Rabbine dön, hoşuna giden ve hoşuna giden bir şekilde.'
    id: 'Tidak, ketika bumi dihantam dan Tuhanmu serta kekuasaan datang baris demi baris, dan hari itu Neraka dibawa ke Neraka: wahai jiwa yang tenang, kembalilah kepada Tuhanmu, dengan senang hati dan
      menyenangkan [Dia].'
  children: []
