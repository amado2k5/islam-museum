map:
  - title: { ar: "القسم بالفجر", en: "The Oath by the Dawn" }
    range: [1, 5]
    family: faith
    summary:
      ar: "والفجر وليال عشر والشفع والوتر والليل إذا يسر: هل في ذلك قسم لذي حجر."
      en: "By the dawn, the ten nights, the even and the odd, the night as it passes — is there not in that an oath for one of sense?"
    children: []
  - title: { ar: "عاد وثمود وفرعون", en: "Ad, Thamud and Pharaoh" }
    range: [6, 14]
    family: stories
    summary:
      ar: "ألم تر كيف فعل ربك بعاد إرم ذات العماد وثمود الذين جابوا الصخر وفرعون ذي الأوتاد: فصب عليهم ربك سوط عذاب."
      en: "Have you not seen what your Lord did to Ad of the pillars, Thamud who carved the rocks, Pharaoh of the stakes? Your Lord poured upon them a scourge of punishment."
    children: []
  - title: { ar: "الإنسان والابتلاء", en: "Man Tested" }
    range: [15, 20]
    family: faith
    summary:
      ar: "فأما الإنسان إذا ما ابتلاه ربه فأكرمه ونعمه فيقول ربي أكرمن، وإذا قدر عليه رزقه فيقول ربي أهانن: كلا بل لا يكرمون اليتيم."
      en: "When his Lord tests man with honor he says 'my Lord honored me'; when restricted, 'my Lord humiliated me' — no indeed; the fault is neglecting the orphan and the poor."
    children: []
  - title: { ar: "النفس المطمئنة", en: "The Tranquil Soul" }
    range: [21, 30]
    family: faith
    summary:
      ar: "كلا إذا دكت الأرض دكا دكا وجاء ربك والملك صفا صفا وجيء يومئذ بجهنم: يا أيتها النفس المطمئنة ارجعي إلى ربك راضية مرضية."
      en: "When the earth is pounded to dust and Hell is brought near: O tranquil soul, return to your Lord, pleased and pleasing — enter among My servants, enter My Paradise."
    children: []
