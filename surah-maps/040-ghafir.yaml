surah: 40
slug: ghafir
sources_consulted:
  - "fa.wikipedia.org — غافر (خلاصه آيات: تفصيل الآيات 1-85)"
  - "ar.wikipedia.org — سورة غافر (مؤمن آل فرعون)"
  - "alukah.net — تفسير سورة غافر للناشئين (26-40)"
map:
  - title: { ar: "تنزيل الكتاب ودعاء الملائكة", en: "The Book Sent Down; the Angels' Prayer" }
    range: [1, 9]
    family: faith
    summary:
      ar: "حم؛ تنزيل الكتاب من الله العزيز العليم غافر الذنب وقابل التوب؛ والملائكة يستغفرون للذين آمنوا."
      en: "Ha-Mim; the Book sent down from Allah the Mighty, the Knowing, Forgiver of sin, Accepter of repentance; the angels seeking forgiveness for the believers."
    children:
      - { title: { ar: "غافر الذنب وقابل التوب", en: "Forgiver of Sin, Accepter of Repentance" }, range: [1, 3] }
      - { title: { ar: "دعاء الملائكة للمؤمنين", en: "The Angels Pray for Believers" }, range: [7, 9] }
  - title: { ar: "مشاهد يوم القيامة", en: "Scenes of the Day of Resurrection" }
    range: [10, 20]
    family: faith
    summary:
      ar: "ندم الكافرين في النار حيث لا تنفع التوبة؛ ويوم الآزفة إذ القلوب لدى الحناجر؛ يعلم خائنة الأعين وما تخفي الصدور."
      en: "The disbelievers' remorse in the Fire where repentance no longer avails; the Day of Distress with hearts at throats; He knows the treachery of eyes and what breasts conceal."
    children:
      - { title: { ar: "ندم الكافرين", en: "The Disbelievers' Remorse" }, range: [10, 12] }
      - { title: { ar: "يوم الآزفة", en: "The Day of Distress" }, range: [18, 20] }
  - title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }
    range: [21, 27]
    family: stories
    summary:
      ar: "أولم يسيروا في الأرض فينظروا عاقبة من قبلهم؛ وأُرسل موسى إلى فرعون وهامان وقارون فاتهموه بالسحر، وهمّ فرعون بقتله."
      en: "Did they not travel the earth and see the end of those before? Moses was sent to Pharaoh, Haman and Qarun, accused of sorcery, and Pharaoh plotted to kill him."
    children: []
  - title: { ar: "مؤمن آل فرعون", en: "The Believer of Pharaoh's Household" }
    range: [28, 45]
    family: stories
    summary:
      ar: "وقال رجل مؤمن من آل فرعون يكتم إيمانه: أتقتلون رجلا أن يقول ربي الله؛ فوعظ قومه بالمنطق والتاريخ ويوم التناد، فنجاه الله ومكر فرعون في تباب."
      en: "A believing man of Pharaoh's household, concealing his faith, said: would you kill a man for saying 'my Lord is Allah'? He admonished his people with reason, history, and the Day of Mutual Calling — and Allah saved him."
    children:
      - { title: { ar: "أتقتلون رجلا أن يقول ربي الله", en: "'Would You Kill a Man for Saying: My Lord Is Allah'" }, range: [28, 29] }
      - { title: { ar: "مثل يوم الأحزاب", en: "Like the Day of the Confederates" }, range: [30, 31] }
      - { title: { ar: "يوم التناد", en: "The Day of Mutual Calling" }, range: [32, 33] }
      - { title: { ar: "الصرح", en: "The Tower" }, range: [36, 37] }
      - { title: { ar: "الدعوة إلى النجاة", en: "The Call to Deliverance" }, range: [41, 44] }
  - title: { ar: "عذاب آل فرعون", en: "The Torment of Pharaoh's People" }
    range: [46, 50]
    family: faith
    summary:
      ar: "النار يعرضون عليها غدوا وعشيا؛ وإذ يتحاجون في النار فيطلبون من خزنتها التخفيف فلا يُجابون."
      en: "The Fire — exposed to it morning and evening; disputing in the Fire, they beg its keepers for relief and are refused."
    children:
      - { title: { ar: "العرض على النار غدوا وعشيا", en: "Exposed to the Fire Morning and Evening" }, range: [46, 46] }
  - title: { ar: "نصر الرسل والدعاء", en: "The Messengers Aided; Supplication" }
    range: [51, 60]
    family: faith
    summary:
      ar: "إنا لننصر رسلنا والذين آمنوا؛ فاصبر إن وعد الله حق؛ وقال ربكم ادعوني أستجب لكم."
      en: "We surely aid Our messengers and the believers; be patient — Allah's promise is true; your Lord said: call upon Me, I shall answer you."
    children:
      - { title: { ar: "إنا لننصر رسلنا", en: "We Surely Aid Our Messengers" }, range: [51, 51] }
      - { title: { ar: "ادعوني أستجب لكم", en: "Call upon Me; I Shall Answer You" }, range: [60, 60] }
  - title: { ar: "آيات التوحيد", en: "Signs of Oneness" }
    range: [61, 68]
    family: faith
    summary:
      ar: "الله الذي جعل لكم الليل والنهار، ذلكم الله ربكم خالق كل شيء؛ هو الحي لا إله إلا هو؛ خلقكم من تراب ثم من نطفة."
      en: "Allah made for you night and day; that is Allah your Lord, creator of all; He is the Living, no god but He; He created you from dust, then from a drop."
    children: []
  - title: { ar: "المجادلون والصبر", en: "The Disputants; Patience" }
    range: [69, 77]
    family: faith
    summary:
      ar: "ألم تر إلى الذين يجادلون في آيات الله أنى يصرفون؛ إذ الأغلال في أعناقهم يُسحبون؛ فاصبر إن وعد الله حق."
      en: "Have you not seen those who dispute Allah's signs, how they are turned? With shackles on their necks, dragged along; so be patient — Allah's promise is true."
    children: []
  - title: { ar: "عاقبة التكذيب", en: "The End of Denial" }
    range: [78, 85]
    family: faith
    summary:
      ar: "ولقد أرسلنا رسلا من قبلك؛ ويريكم آياته فأي آيات الله تنكرون؛ أفلم يسيروا في الأرض فينظروا عاقبة من قبلهم."
      en: "We sent messengers before you; He shows you His signs — which of Allah's signs do you deny? Did they not travel the earth and see the end of those before?"
    children: []
