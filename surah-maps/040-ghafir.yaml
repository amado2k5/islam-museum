      en: Forgiver of Sin, Accepter of Repentance
      tr: Günahı affet ve tövbe edenle buluş
      id: Ampunilah dosa dan temui orang yang bertobat
    range:
    - 1
    - 3
  - title:
      ar: دعاء الملائكة للمؤمنين
      en: The Angels Pray for Believers
      tr: Meleklerin inananlara yaptığı dualar
      id: Doa para malaikat kepada orang-orang percaya
    range:
    - 7
    - 9
- title:
    ar: مشاهد يوم القيامة
    en: Scenes of the Day of Resurrection
    tr: Kıyamet Günü Sahneleri
    id: Adegan Hari Penghakiman
  range:
  - 10
  - 20
  family: faith
  summary:
    ar: ندم الكافرين في النار حيث لا تنفع التوبة؛ ويوم الآزفة إذ القلوب لدى الحناجر؛ يعلم خائنة الأعين وما تخفي الصدور.
    en: The disbelievers' remorse in the Fire where repentance no longer avails; the Day of Distress with hearts at throats; He knows the treachery of eyes and what breasts conceal.
    tr: Tövbenin faydasız olduğu ateşte kâfirlerin üzüntüsüdür; ve Üzüntü Günü'nde, kalpler boğazdayken, gözlerin ihanetini ve sandıkların sakladıklarını bilir.
    id: Penyesalan orang kafir dalam Api di mana pertobatan tidak berguna; dan pada Hari Penyesalan, ketika hati berdebar, Dia tahu pengkhianatan mata dan apa yang disembunyikan peti.
  children:
  - title:
      ar: ندم الكافرين
      en: The Disbelievers' Remorse
      tr: İnançsızların pişmanlığı
      id: Penyesalan para kafir
    range:
    - 10
    - 12
  - title:
      ar: يوم الآزفة
      en: The Day of Distress
      tr: Ezfa Günü
      id: Hari Ezfa
    range:
    - 18
    - 20
- title:
    ar: موسى وفرعون
    en: Moses and Pharaoh
    tr: Musa ve Firavun
    id: Musa dan Firaun
  range:
  - 21
  - 27
  family: stories
  summary:
    ar: أولم يسيروا في الأرض فينظروا عاقبة من قبلهم؛ وأُرسل موسى إلى فرعون وهامان وقارون فاتهموه بالسحر، وهمّ فرعون بقتله.
    en: Did they not travel the earth and see the end of those before? Moses was sent to Pharaoh, Haman and Qarun, accused of sorcery, and Pharaoh plotted to kill him.
    tr: Onlar topraklarda dolaşıp kendilerinden öncekilerin sonuçlarını görmediler mi? Musa, Firavun, Haman ve Karun'a büyücülükle suçlayarak gönderdi ve onlar da onu öldürdükleri için Firavundu.
    id: Bukankah mereka melakukan perjalanan ke tanah itu dan menyaksikan konsekuensi dari orang-orang sebelum mereka? Musa mengirim surat kepada Firaun, Haman, dan Qarun, menuduhnya melakukan sihir, dan
      mereka adalah Firaun karena membunuhnya.
  children: []
- title:
    ar: مؤمن آل فرعون
    en: The Believer of Pharaoh's Household
    tr: Moamen Al Faroun
    id: Moamen Al Faroun
  range:
  - 28
  - 45
  family: stories
  summary:
    ar: 'وقال رجل مؤمن من آل فرعون يكتم إيمانه: أتقتلون رجلا أن يقول ربي الله؛ فوعظ قومه بالمنطق والتاريخ ويوم التناد، فنجاه الله ومكر فرعون في تباب.'
    en: 'A believing man of Pharaoh''s household, concealing his faith, said: would you kill a man for saying ''my Lord is Allah''? He admonished his people with reason, history, and the Day of Mutual Calling
      — and Allah saved him.'
    tr: 'Firavun''un ailesinden bir inanan adam, inancını gizleyerek şöyle dedi: "''Rabbim Tanrı''dır diyen bir adamı öldürür müsün?" Halkına mantık, tarih ve Çağrı Günü''nü anlattı; Allah onu ve Firavun''un
      Tabab''daki planını kurtardı.'
    id: 'Seorang orang percaya dari keluarga Firaun, menyembunyikan imannya, berkata: "Apakah engkau akan membunuh orang yang berkata, ''Tuhanku adalah Allah?''" Ia berkhotbah kepada umat-nya dengan logika,
      sejarah, dan Hari Panggilan, dan Allah menyelamatkan dia dan rencana Firaun di Tabab.'
  children:
  - title:
      ar: أتقتلون رجلا أن يقول ربي الله
      en: '''Would You Kill a Man for Saying: My Lord Is Allah'''
      tr: Tanrı Tanrıdır demek için bir adamı öldürüyorsun
      id: Kamu membunuh seseorang hanya untuk mengatakan Tuhan itu Tuhan
    range:
    - 28
    - 29
  - title:
      ar: مثل يوم الأحزاب
      en: Like the Day of the Confederates
      tr: Partiler Günü gibi
      id: Seperti Hari Pesta
    range:
    - 30
    - 31
  - title:
      ar: يوم التناد
      en: The Day of Mutual Calling
      tr: Ziyaret Günü
      id: Hari Panggilan
    range:
    - 32
    - 33
  - title:
      ar: الصرح
      en: The Tower
      tr: Yapı
      id: Bangunan
    range:
    - 36
    - 37
  - title:
      ar: الدعوة إلى النجاة
      en: The Call to Deliverance
      tr: Kurtuluşa Çağrı
      id: Seruan Keselamatan
    range:
    - 41
    - 44
- title:
    ar: عذاب آل فرعون
    en: The Torment of Pharaoh's People
    tr: Firavun'un ailesinin işkencesi
    id: Siksaan keluarga Firaun
  range:
  - 46
  - 50
  family: faith
  summary:
    ar: النار يعرضون عليها غدوا وعشيا؛ وإذ يتحاجون في النار فيطلبون من خزنتها التخفيف فلا يُجابون.
    en: The Fire — exposed to it morning and evening; disputing in the Fire, they beg its keepers for relief and are refused.
    tr: Ateş onlara sabah ve akşam sunulur; ateşte tartıştıklarında, bekçisinden ateşi yakmasını isterler, ancak cevap vermezler.
    id: Api dipersembahkan kepada mereka pagi dan sore; dan ketika mereka berdebat di dalam api, mereka meminta penjaganya untuk menyalakannya, tetapi mereka tidak menjawab.
  children:
  - title:
      ar: العرض على النار غدوا وعشيا
      en: Exposed to the Fire Morning and Evening
      tr: Gösteri yarın ve akşam ateş içinde.
      id: Pertunjukan akan sangat hebat besok dan malam.
    range:
    - 46
    - 46
- title:
    ar: نصر الرسل والدعاء
    en: The Messengers Aided; Supplication
    tr: Elçilerin zaferi ve dualar
    id: Kemenangan para utusan dan doa
  range:
  - 51
  - 60
  family: faith
  summary:
    ar: إنا لننصر رسلنا والذين آمنوا؛ فاصبر إن وعد الله حق؛ وقال ربكم ادعوني أستجب لكم.
    en: 'We surely aid Our messengers and the believers; be patient — Allah''s promise is true; your Lord said: call upon Me, I shall answer you.'
    tr: 'Elbette, biz elçilerimize ve iman edenlere destek olacağız; sabrah edin, çünkü Allah''ın vaadi doğrudur; Rabbiniz dedi ki: ''Bana seslenin; size cevap vereceğim.'''
    id: Sesungguhnya, Kami akan menolong para rasulullah dan orang-orang yang beriman; maka bersabarlah, karena janji Allah itu benar; dan Tuhan kamu berkata, 'Panggillah aku; Aku akan menjawab kamu.'
  children:
  - title:
      ar: إنا لننصر رسلنا
      en: We Surely Aid Our Messengers
      tr: Gerçekten de, elçilerimizi destekleyeceğiz
      id: Memang, kami akan mendukung para utusan kami
    range:
    - 51
    - 51
  - title:
      ar: ادعوني أستجب لكم
      en: Call upon Me; I Shall Answer You
      tr: Sana cevap vereyim.
      id: Izinkan saya menjawab Anda.
    range:
    - 60
    - 60
- title:
    ar: آيات التوحيد
    en: Signs of Oneness
    tr: Tek tanrıcılığın dizeleri
    id: Ayat-ayat Monoteisme
  range:
  - 61
  - 68
  family: faith
  summary:
    ar: الله الذي جعل لكم الليل والنهار، ذلكم الله ربكم خالق كل شيء؛ هو الحي لا إله إلا هو؛ خلقكم من تراب ثم من نطفة.
    en: Allah made for you night and day; that is Allah your Lord, creator of all; He is the Living, no god but He; He created you from dust, then from a drop.
    tr: Allah size geceyi ve gündüzü yaratandır. O Allah'tır, sizin Rabbiniz, her şeyin yaratıcısıdır; O ebeddir canlıdır, O'ndan başka bir tanrı yoktur; sizi önce topraktan, sonra bir damla sıvıdan yaratmıştır.
    id: Allah adalah Yang menciptakan untuk kalian malam dan siang. Itulah Allah, Tuhan kalian, Pencipta segala sesuatu; Dia adalah Yang Hidup Selama, tidak ada dewa selain Dia; Dia menciptakanmu dari debu
      lalu dari setetes cairan.
  children: []
- title:
    ar: المجادلون والصبر
    en: The Disputants; Patience
    tr: Tartışmacılar ve Sabır
    id: Para Debater dan Pasien
  range:
  - 69
  - 77
  family: faith
  summary:
    ar: ألم تر إلى الذين يجادلون في آيات الله أنى يصرفون؛ إذ الأغلال في أعناقهم يُسحبون؛ فاصبر إن وعد الله حق.
    en: Have you not seen those who dispute Allah's signs, how they are turned? With shackles on their necks, dragged along; so be patient — Allah's promise is true.
    tr: Allah'ın aleketlerine karşı çıkanların, boyunlarına zincirler bağlandığında nasıl yüz çevirdiklerini görmedin mi? Sabırlı olun, çünkü Allah'ın vaadi doğrudur.
    id: Tidakkah kamu melihat mereka yang menentang tanda-tanda Allah bagaimana mereka berpaling, ketika belenggu terikat di leher mereka? Jadi bersabarlah, karena janji Allah itu benar.
  children: []
- title:
    ar: عاقبة التكذيب
    en: The End of Denial
    tr: İnkarın sonucu
    id: Konsekuensi dari penolakan
  range:
  - 78
  - 85
  family: faith
  summary:
    ar: ولقد أرسلنا رسلا من قبلك؛ ويريكم آياته فأي آيات الله تنكرون؛ أفلم يسيروا في الأرض فينظروا عاقبة من قبلهم.
    en: We sent messengers before you; He shows you His signs — which of Allah's signs do you deny? Did they not travel the earth and see the end of those before?
    tr: Ve biz size önce resuller gönderdik, o da size kendi beratlarını gösterecek, peki Allah'ın hangi aletlerini inkar edeceksiniz? Onlar yerde dolaşıp önlerinde bir sonat görmediler mi?
    id: Dan Kami mengutus utusan di hadapanmu; dan Dia akan menunjukkan tanda-tanda-Nya, jadi tanda-tanda Allah mana yang akan kamu tolak? Bukankah mereka telah menjelajahi tanah ini dan kemudian melihat
      akibatnya di hadapan mereka?
  children: []
