map:
- title:
    ar: تنزيل الكتاب ودعاء الملائكة
    en: The Book Sent Down; the Angels' Prayer
    tr: Kitabın Vahyi ve Meleklerin Yalvarışı
    id: Wahyu Kitab dan Doa Para Malaikat
  range:
  - 1
  - 9
  family: faith
  summary:
    ar: حم؛ تنزيل الكتاب من الله العزيز العليم غافر الذنب وقابل التوب؛ والملائكة يستغفرون للذين آمنوا.
    en: Ha-Mim; the Book sent down from Allah the Mighty, the Knowing, Forgiver of sin, Accepter of repentance; the angels seeking forgiveness for the believers.
    tr: Ḥam; Ø�Ø�âm; Kudretli ve Bilen Allah'tan Kitabın indirilishi; günahları bağışlayan, tövbe eden Allah'tan; melekler ise iman edenlerden af diler.
    id: Ḥam; wahyu Kitab dari Allah, Yang Maha Kuasa dan Maha Mengetahui, Yang Maha Ampun atas dosa dan menerima pertobatan; dan para malaikat memohon ampun bagi mereka yang beriman.
  children:
