surah: 48
slug: al-fath
sources_consulted:
  - "arz.wikipedia.org — سورة الفتح (1-7، 8-10، 11-16، 17-26، 27-29)"
  - "tadabbur-alquran.com — تدبر سورة الفتح (محاور السورة)"
  - "alukah.net — تفسير سورة الفتح كاملة"
map:
  - title: { ar: "الفتح المبين", en: "The Clear Victory" }
    range: [1, 7]
    family: faith
    summary:
      ar: "إنا فتحنا لك فتحا مبينا ليغفر لك الله ما تقدم من ذنبك وما تأخر ويتم نعمته عليك؛ هو الذي أنزل السكينة في قلوب المؤمنين ليزدادوا إيمانا مع إيمانهم."
      en: "We granted you a clear victory, that God may forgive your past and future sins and complete His favor upon you; He sent tranquility into believers' hearts to increase them in faith."
    children:
      - { title: { ar: "فتحا مبينا", en: "A Clear Victory" }, range: [1, 1] }
      - { title: { ar: "السكينة", en: "Tranquility" }, range: [4, 4] }
  - title: { ar: "وظيفة الرسول والبيعة", en: "The Messenger's Mission; the Pledge" }
    range: [8, 10]
    family: faith
    summary:
      ar: "إنا أرسلناك شاهدا ومبشرا ونذيرا لتؤمنوا بالله ورسوله وتعزروه وتوقروه؛ إن الذين يبايعونك إنما يبايعون الله يد الله فوق أيديهم."
      en: "We sent you as witness, bringer of glad tidings and warner, that you may believe in God and His Messenger and honor him; those who pledge to you pledge to God — God's hand above their hands."
    children:
      - { title: { ar: "يد الله فوق أيديهم", en: "God's Hand Above Theirs" }, range: [10, 10] }
  - title: { ar: "المخلفون وعاقبتهم", en: "The Laggards and Their End" }
    range: [11, 16]
    family: faith
    summary:
      ar: "سيقول لك المخلفون من الأعراب شغلتنا أموالنا وأهلونا؛ بل ظننتم أن لن ينقلب الرسول والمؤمنون؛ قل للمخلفين من الأعراب ستدعون إلى قوم أولي بأس شديد."
      en: "The laggard Bedouins will say: our wealth and families distracted us; rather you thought the Messenger and believers would never return; say to the laggards: you will be called against a people of great might."
    children:
      - { title: { ar: "سيقول لك المخلفون", en: "The Laggards Will Say" }, range: [11, 12] }
  - title: { ar: "بيعة الرضوان ونتائج الصلح", en: "The Pledge of Ridwan; the Truce's Fruits" }
    range: [17, 26]
    family: stories
    summary:
      ar: "ليس على الأعمى حرج؛ رضا الله عن المؤمنين إذ يبايعونك تحت الشجرة؛ وهو الذي كف أيديهم عنكم وأيديكم عنهم ببطن مكة؛ إذ جعل الذين كفروا في قلوبهم الحمية."
      en: "No blame on the blind; God was pleased with the believers as they pledged under the tree; He withheld their hands from you and yours from them in Mecca's valley — when deniers held tribal pride in their hearts."
    children:
      - { title: { ar: "بيعة الرضوان", en: "The Pledge of Ridwan" }, range: [18, 19] }
      - { title: { ar: "كف الأيدي", en: "The Withheld Hands" }, range: [24, 24] }
  - title: { ar: "تحقيق الرؤيا وصفات الصحابة", en: "The Fulfilled Vision; the Companions' Traits" }
    range: [27, 29]
    family: faith
    summary:
      ar: "لقد صدق الله رسوله الرؤيا بالحق لتدخلن المسجد الحرام إن شاء الله آمنين؛ هو الذي أرسل رسوله بالهدى ودين الحق ليظهره على الدين كله؛ محمد رسول الله والذين معه أشداء على الكفار رحماء بينهم."
      en: "God fulfilled His Messenger's vision in truth: you shall enter the Sacred Mosque, God willing, secure; He sent His Messenger with guidance and the true religion to make it prevail; Muhammad is God's Messenger, and those with him are stern toward deniers, merciful among themselves."
    children:
      - { title: { ar: "الرؤيا", en: "The Vision" }, range: [27, 27] }
      - { title: { ar: "أشداء على الكفار رحماء بينهم", en: "Stern Toward Deniers, Merciful Together" }, range: [29, 29] }
