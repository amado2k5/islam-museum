map:
- title:
    ar: الفتح المبين
    en: The Clear Victory
    tr: Al-Fath al-Mubin
    id: Al-Fath al-Mubin
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: إنا فتحنا لك فتحا مبينا ليغفر لك الله ما تقدم من ذنبك وما تأخر ويتم نعمته عليك؛ هو الذي أنزل السكينة في قلوب المؤمنين ليزدادوا إيمانا مع إيمانهم.
    en: We granted you a clear victory, that God may forgive your past and future sins and complete His favor upon you; He sent tranquility into believers' hearts to increase them in faith.
    tr: Gerçekten de, Allah geçmiş günahlarınızı ve sonrakı olanları bağışlasın ve size lütfunu tamamlasın diye size açık bir fırsat verdik; O, müminlerin kalplerine huzur indiren ve onların imanlarını
      da artıracaklarını söyleyen Kişidir.
    id: Sesungguhnya, Kami telah memberimu pintu yang jelas agar Allah mengampuni dosa-dosamu yang lalu dan apa yang akan datang serta sepenuhnya memberimu; Dialah yang menurunkan kedamaian ke dalam hati
      orang beriman agar mereka dapat bertambah iman bersama mereka.
  children:
  - title:
      ar: فتحا مبينا
      en: A Clear Victory
      tr: Açık bir açılış
      id: Pembukaan yang jelas
    range:
    - 1
    - 1
  - title:
      ar: السكينة
      en: Tranquility
      tr: Bıçak
      id: Pisau itu
    range:
    - 4
    - 4
- title:
    ar: وظيفة الرسول والبيعة
    en: The Messenger's Mission; the Pledge
    tr: Habercinin Rolü ve Bağlılık Yemini
    id: Peran Utusan dan Sumpah Setia
  range:
  - 8
  - 10
  family: faith
  summary:
    ar: إنا أرسلناك شاهدا ومبشرا ونذيرا لتؤمنوا بالله ورسوله وتعزروه وتوقروه؛ إن الذين يبايعونك إنما يبايعون الله يد الله فوق أيديهم.
    en: We sent you as witness, bringer of glad tidings and warner, that you may believe in God and His Messenger and honor him; those who pledge to you pledge to God — God's hand above their hands.
    tr: Seni bir şahit, müjdeyi getiren ve uyaran olarak gönderdik ki Allah'a ve O'nun Elçisine inanasın, O'nu onurlandırasın ve O'na saygı gösteresin. Size sadakat edenler, yalnızca Allah'a itaat etmişlerdir.
      Allah'ın eli onların ellerinin üstündedir.
    id: Sesungguhnya, Kami telah mengutus kamu sebagai saksi, pembawa kabar baik, dan peringatan agar kamu percaya kepada Allah dan Rasul-Nya, menghormati-Nya, dan memuja Dia. Sesungguhnya, mereka yang
      bersumpah setia kepadamu hanya bersumpah setia kepada Allah. Tangan Allah berada di atas tangan mereka.
  children:
  - title:
      ar: يد الله فوق أيديهم
      en: God's Hand Above Theirs
      tr: Tanrı'nın eli onların ellerinin üstündedir
      id: Tangan Tuhan ada di atas tangan mereka
    range:
    - 10
    - 10
- title:
    ar: المخلفون وعاقبتهم
    en: The Laggards and Their End
    tr: Geri Kalmışlar ve Cezaları
    id: Yang Tertinggal dan Hukuman Mereka
  range:
  - 11
  - 16
  family: faith
  summary:
    ar: سيقول لك المخلفون من الأعراب شغلتنا أموالنا وأهلونا؛ بل ظننتم أن لن ينقلب الرسول والمؤمنون؛ قل للمخلفين من الأعراب ستدعون إلى قوم أولي بأس شديد.
    en: 'The laggard Bedouins will say: our wealth and families distracted us; rather you thought the Messenger and believers would never return; say to the laggards: you will be called against a people
      of great might.'
    tr: 'Geride kalan bedeviler size şöyle derler: ''Servetimiz ve ailemiz bizi meşgul etti; aksine, sen Res''eflin ve müminlerin değişmeyeceğini sandın.'' Geride kalan bedevilere de ki: Büyük bir güçlü
      bir kavma çağrılacaksınız.'
    id: 'Orang Badui yang tinggal akan berkata kepadamu, ''Kekayaan dan keluarga kami memenuhi kami; sebaliknya, kamu pikir Rasul dan para mukmin tidak akan berubah.'' Katakan kepada orang Badui yang tertinggal:
      kamu akan dipanggil ke dalam bangsa yang sangat kuat.'
  children:
  - title:
      ar: سيقول لك المخلفون
      en: The Laggards Will Say
      tr: Geride kalanlar size anlatacaktır
      id: Mereka yang meninggalkan akan memberitahumu
    range:
    - 11
    - 12
- title:
    ar: بيعة الرضوان ونتائج الصلح
    en: The Pledge of Ridwan; the Truce's Fruits
    tr: Ridwan Yemin ve Barışın Sonuçları
    id: Ikrar Ridwan dan Hasil Perdamaian
  range:
  - 17
  - 26
  family: stories
  summary:
    ar: ليس على الأعمى حرج؛ رضا الله عن المؤمنين إذ يبايعونك تحت الشجرة؛ وهو الذي كف أيديهم عنكم وأيديكم عنهم ببطن مكة؛ إذ جعل الذين كفروا في قلوبهم الحمية.
    en: No blame on the blind; God was pleased with the believers as they pledged under the tree; He withheld their hands from you and yours from them in Mecca's valley — when deniers held tribal pride
      in their hearts.
    tr: Körlere suç yoktur; Allah'ın inananların ağaç altında size itaat ettiklerinde ondan hoşlanmasıdır; ve Mekke'nin karnında onların ellerini, ellerinizi de onlardan alıkoyan O'dur, çünkü kâr edenlerin
      kalplerine coşku koymuştur.
    id: Tidak ada kesalahan pada orang buta; kesenangan Allah kepada orang beriman ketika mereka bersumpah setia kepadamu di bawah pohon; dan Dialah yang menahan tangan mereka darimu dan tanganmu dari mereka
      di perut Mekah, karena Dia menaruh semangat di hati mereka yang tidak percaya.
  children:
  - title:
      ar: بيعة الرضوان
      en: The Pledge of Ridwan
      tr: Ridwan Yemini
      id: Ikrar Ridwan
    range:
    - 18
    - 19
  - title:
      ar: كف الأيدي
      en: The Withheld Hands
      tr: avuç içi
      id: telapak tangan
    range:
    - 24
    - 24
- title:
    ar: تحقيق الرؤيا وصفات الصحابة
    en: The Fulfilled Vision; the Companions' Traits
    tr: Hayalin Gerçekleşmesi ve Yoldaşların Özellikleri
    id: Realisasi Mimpi dan Karakteristik Para Pendamping
  range:
  - 27
  - 29
  family: faith
  summary:
    ar: لقد صدق الله رسوله الرؤيا بالحق لتدخلن المسجد الحرام إن شاء الله آمنين؛ هو الذي أرسل رسوله بالهدى ودين الحق ليظهره على الدين كله؛ محمد رسول الله والذين معه أشداء على الكفار رحماء بينهم.
    en: 'God fulfilled His Messenger''s vision in truth: you shall enter the Sacred Mosque, God willing, secure; He sent His Messenger with guidance and the true religion to make it prevail; Muhammad is
      God''s Messenger, and those with him are stern toward deniers, merciful among themselves.'
    tr: Allah, Elçi'nin görüşünü doğru bir şekilde yerine getirmiştir ki, Allah'ın izni ile Mescid-i sağ salim girebilsin; O, Elçisini rehber ve doğru dinle gönderen ve tüm dinlere bunu açıkça bildiren
      Odur. Muhammed Allah'ın Elçisidir ve onunla olanlar kâfirlere karşı sert ve birbirleri arasında merhametlidir.
    id: Allah telah memenuhi visi Rasul-Nya dengan kebenaran, agar kalian dapat masuk ke Masjidil Suci dengan selamat, insya Allah; Dialah yang mengutus Rasul-Nya dengan bimbingan dan agama kebenaran untuk
      memperjelaskannya kepada semua agama. Muhammad adalah Rasulullah, dan mereka yang bersamanya tegas terhadap orang kafir dan saling berbelas kasihan.
  children:
  - title:
      ar: الرؤيا
      en: The Vision
      tr: Vizyon
      id: Visi
    range:
    - 27
    - 27
  - title:
      ar: أشداء على الكفار رحماء بينهم
      en: Stern Toward Deniers, Merciful Together
      tr: İnkârlara karşı sert ve birbirlerine merhametlidirler
      id: Keras terhadap orang kafir dan penuh belas kasihan di antara mereka
    range:
    - 29
    - 29
