- title:
    ar: نزول القرآن والخاتمة
    en: The Quran's Descent and the Closing
    tr: Kur'an'ın İnkişi ve Sonuç
    id: Wahyu Al-Qur'an dan Kesimpulan
  range:
  - 192
  - 227
  family: faith
  summary:
    ar: نزل به الروح الأمين على قلبك بلسان عربي مبين، والشياطين لم تنزل به، وخاتمة السورة عن الشعراء.
    en: Brought down by the Trustworthy Spirit upon your heart in clear Arabic; no devils brought it; the poets at the close.
    tr: Güvenilir ruh kalbine berrak bir Arapça dilde indi, şeytanlar ise üzerine inmedi. Surenin sonu şairlerle ilgilidir.
    id: Roh yang dapat dipercaya turun ke hatimu dalam bahasa Arab yang jelas, dan iblis tidak turun ke atasnya. Akhir surah adalah tentang para penyair.
  children:
