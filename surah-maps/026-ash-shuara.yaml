map:
- title:
    ar: الافتتاح
    en: The Opening
    tr: Açılış
    id: Pembukaan
  range:
  - 1
  - 9
  family: faith
  summary:
    ar: حزن النبي على إعراضهم، ولو شاء الله لأنزل آية تظل أعناقهم لها خاضعة، فما يأتيهم من ذكر إلا أعرضوا.
    en: The Prophet's grief at their turning away; a sign could bend their necks — yet every reminder meets refusal.
    tr: Peygamber onların tiksintiğine üzülmüştü ve Allah izin verseydi, boyunlarının alçakgönüllü kalacağı bir ayet indirirdi; böylece bir hatırlatma geldiğinde yüz çevirirler.
    id: Nabi berduka atas kebencian mereka, dan jika Allah berkehendak, Dia akan mewahyukan ayat yang merendahkan leher mereka, sehingga setiap kali ada peringatan yang datang kepada mereka, mereka berpaling.
  children: []
- title:
    ar: موسى وفرعون
    en: Moses and Pharaoh
    tr: Musa ve Firavun
    id: Musa dan Firaun
  range:
  - 10
  - 68
  family: stories
  summary:
    ar: إرسال موسى إلى فرعون، والمناظرة في المجلس، وإيمان السحرة، ونجاة بني إسرائيل وفلق البحر.
    en: Moses sent to Pharaoh; the court's debate; the magicians' belief; the Israelites saved, the sea parted.
    tr: Musa, Firavun'a, konsildeki tartışmaya, büyücülerin inancına, İsrailoğulları'nın kurtuluşuna ve denizin bölünmesine gönderildi.
    id: Musa dikirim kepada Firaun, perdebatan dalam konsili, iman para penyihir, keselamatan orang Israel, dan terbelah laut.
