- title:
    ar: إبراهيم وقومه
    en: Abraham and His People
    tr: İbrahim ve halkı
    id: Abraham dan umatnya
  range:
  - 69
  - 104
  family: stories
  summary:
    ar: 'سؤال إبراهيم: ما تعبدون، ودعاؤه الخالد بقلب سليم يوم لا ينفع مال ولا بنون.'
    en: Abraham's question — what do you worship — and his timeless prayer for a sound heart when wealth and sons avail nothing.
    tr: 'İbrahim''in sorusu: Ne tapıyorsunuz ve ne zenginlik ne de çocukların fayda sağlayacağı günde, saf kalple onun sonsuz duası?'
    id: 'Pertanyaan Ibrahim: Apa yang kau sembah, dan doa abadi-Nya dengan hati yang murni pada hari ketika kekayaan maupun anak-anak tidak akan mendapat manfaat?'
  children:
