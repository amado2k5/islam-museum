- title:
    ar: الأمم الخمس
    en: The Five Nations
    tr: Beş Ulus
    id: Lima Bangsa
  range:
  - 105
  - 191
  family: stories
  summary:
    ar: 'خمس قصص على نسق واحد: نوح وهود وصالح ولوط وشعيب، كل رسول يقول: ألا تتقون إني لكم رسول أمين.'
    en: 'Five stories on one frame: Noah, Hud, Salih, Lot, Shuayb — each: will you not fear Allah; I am a trusted messenger.'
    tr: 'Beş hikaye bir sırayla: Nuh, Hud, Salih, Lut ve Şuayb, her bir elçi der ki: Allah''tan korkmayın; ben size güvenilir bir elçiyim.'
    id: 'Lima cerita dalam satu urutan: Nuh, Hud, Salih, Lot, dan Shu''ayb, masing-masing rasul berkata: Janganlah engkau takut kepada Allah; sesungguhnya, Aku adalah utusan yang dapat dipercaya bagimu.'
