surah: 26
slug: ash-shuara
sources_consulted:
  - "kuttab.com — Surah Ash-Shu'ara mind map (5 blocks: 1-9, 10-68, 69-104, 105-191, 192-227)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "الافتتاح", en: "The Opening" }
    range: [1, 9]
    family: faith
    summary:
      ar: "حزن النبي على إعراضهم، ولو شاء الله لأنزل آية تظل أعناقهم لها خاضعة، فما يأتيهم من ذكر إلا أعرضوا."
      en: "The Prophet's grief at their turning away; a sign could bend their necks — yet every reminder meets refusal."
    children: []
  - title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }
    range: [10, 68]
    family: stories
    summary:
      ar: "إرسال موسى إلى فرعون، والمناظرة في المجلس، وإيمان السحرة، ونجاة بني إسرائيل وفلق البحر."
      en: "Moses sent to Pharaoh; the court's debate; the magicians' belief; the Israelites saved, the sea parted."
    children:
      - { title: { ar: "إيمان السحرة", en: "The Magicians Believe" }, range: [46, 51] }
      - { title: { ar: "فلق البحر", en: "Parting the Sea" }, range: [63, 67] }
  - title: { ar: "إبراهيم وقومه", en: "Abraham and His People" }
    range: [69, 104]
    family: stories
    summary:
      ar: "سؤال إبراهيم: ما تعبدون، ودعاؤه الخالد بقلب سليم يوم لا ينفع مال ولا بنون."
      en: "Abraham's question — what do you worship — and his timeless prayer for a sound heart when wealth and sons avail nothing."
    children:
      - { title: { ar: "دعاء إبراهيم", en: "Abraham's Prayer" }, range: [83, 89] }
  - title: { ar: "الأمم الخمس", en: "The Five Nations" }
    range: [105, 191]
    family: stories
    summary:
      ar: "خمس قصص على نسق واحد: نوح وهود وصالح ولوط وشعيب، كل رسول يقول: ألا تتقون إني لكم رسول أمين."
      en: "Five stories on one frame: Noah, Hud, Salih, Lot, Shuayb — each: will you not fear Allah; I am a trusted messenger."
    children:
      - { title: { ar: "نوح", en: "Noah" }, range: [105, 122] }
      - { title: { ar: "هود", en: "Hud" }, range: [123, 140] }
      - { title: { ar: "صالح", en: "Salih" }, range: [141, 159] }
      - { title: { ar: "لوط", en: "Lot" }, range: [160, 175] }
      - { title: { ar: "شعيب", en: "Shuayb" }, range: [176, 191] }
  - title: { ar: "نزول القرآن والخاتمة", en: "The Quran's Descent and the Closing" }
    range: [192, 227]
    family: faith
    summary:
      ar: "نزل به الروح الأمين على قلبك بلسان عربي مبين، والشياطين لم تنزل به، وخاتمة السورة عن الشعراء."
      en: "Brought down by the Trustworthy Spirit upon your heart in clear Arabic; no devils brought it; the poets at the close."
    children:
      - { title: { ar: "الشعراء", en: "The Poets" }, range: [224, 227] }
