- arz.wikipedia.org — سورة سبأ (توحيد الله 1-21، الإيمان بالوحي 22-39، الإيمان بالبعث 40-54)
- 'dorar.net — موسوعة التفسير: سورة سبأ (مقاصد وموضوعات السورة)'
map:
- title:
    ar: توحيد الله
    en: The Oneness of Allah
    tr: Tewidallah
    id: Tawheed Allah
  range:
  - 1
  - 21
  family: faith
  summary:
    ar: الحمد لله المالك لما في السماوات والأرض؛ والرد على منكري البعث، مع نعم الله على داود وسليمان وقصة سبأ وسيل العرم.
    en: Praise to Allah, owner of all in heavens and earth; the deniers of resurrection answered, with Allah's favors on David and Solomon and the story of Saba.
    tr: Göklerde ve yeryüzünde olan her şeyin Sahibi olan Allah'a övgüler olsun; dirilişi reddedenlerin çürütülmesi, Tanrı'nın Davut ve Süleyman üzerindeki nimetleri, Seba hikayesi ve Peygamber'in tufanı
      ile birlikte.
    id: Puji bagi Allah, Pemilik segala sesuatu yang ada di langit dan bumi; dan penolakan dari para penyangkal kebangkitan, bersama dengan berkat Allah atas Daud dan Salomo, serta kisah Sheba dan banjir
      Nabi.
  children:
  - title:
      ar: إنكار البعث والرد عليه
      en: Denying Resurrection — Answered
      tr: Baasizmin İnkarı ve Buna Verilen Yanıt
      id: Penolakan Baathisme dan Tanggapan Terhadapnya
    range:
    - 3
    - 9
  - title:
      ar: داود وسليمان
      en: David and Solomon
      tr: David ve Süleyman
      id: Daud dan Salomo
    range:
    - 10
    - 14
  - title:
      ar: قصة سبأ وسيل العرم
      en: Saba and the Flood of the Dam
      tr: Saba'nın hikayesi ve solucanın seli
      id: Kisah Saba dan banjir cacing
    range:
    - 15
    - 21
- title:
    ar: الإيمان بالوحي
    en: Faith in the Revelation
    tr: Vahiye İnanç
    id: Kepercayaan pada Wahyu
  range:
  - 22
  - 39
  family: faith
  summary:
    ar: بطلان الشرك والشفاعة لغير الله، وحوار المستكبرين والمستضعفين يوم القيامة، والرد على المترفين، وسنة الله في الرزق.
    en: The nullity of association and of intercession besides Allah; the arrogant and the oppressed disputing on the Last Day; the affluent answered; Allah's way in provision.
    tr: Peydacılığın geçersizliği ve Allah dışındaki herkes için aracılığın, Kıyamet Günü'nde kibirli ve zayıf arasındaki diyalogun, zenginlerin reddedilmesinin ve Allah'ın yasasının geçim sağlama biçiminde.
    id: Ketidakabsahan politeisme dan perantaraan bagi siapa pun selain Allah, dialog antara orang sombong dan lemah pada Hari Kiamat, penolakan terhadap orang kaya, dan hukum Allah dalam menyediakan makanan.
  children:
  - title:
      ar: حوار المستكبرين والمستضعفين
      en: The Arrogant and the Oppressed Dispute
      tr: Kibirli ve ezilenlerin diyaloğu
      id: Dialog antara orang sombong dan tertindas
    range:
    - 31
    - 33
  - title:
      ar: المترفون
      en: The Affluent
      tr: Varlıklılar
      id: Orang kaya
    range:
    - 34
    - 35
  - title:
      ar: سنة الله في الرزق
      en: Allah's Way in Provision
      tr: Ruh olarak Allah'ın Sünneti
      id: Sunnah Tuhan sebagai pemeliharaan
    range:
    - 36
    - 39
- title:
    ar: الإيمان بالبعث ومشاهده
    en: Faith in Resurrection and Its Scenes
    tr: Dirilişe inanç ve gözlemleri
    id: Kepercayaan pada kebangkitan dan pengamatannya
  range:
  - 40
  - 54
  family: faith
  summary:
    ar: تبرؤ الملائكة ممن عبدوهم، وتكذيب الكفار للرسل، وقذف الحق على الباطل، ولا تقبل التوبة بعد فوات الأوان.
    en: The angels disowning their worshippers; the disbelievers belying the messengers; truth hurled at falsehood; no repentance accepted when too late.
    tr: Melekler, ibadet ettiklerinden koparlar, kâfirler elçileri reddeder, gerçek yalanın üzerine düşer ve tövbe kabul edilmez.
    id: Para malaikat menjauhkan diri dari mereka yang mereka sembah, kafir menyangkal utusan, dan kebenaran dibuang di atas kebohongan, dan pertobatan tidak diterima setelah terlambat.
  children:
  - title:
      ar: تبرؤ الملائكة
      en: The Angels' Disavowal
      tr: Melekler beraat etti
      id: Para malaikat membebaskan diri
    range:
    - 40
    - 42
