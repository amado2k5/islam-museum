surah: 34
slug: saba
sources_consulted:
  - "ujeeb.com — كيف أحفظ سورة سبأ بأسلوب الخريطة الذهنية (1-21، 22-39، 40-54)"
  - "arz.wikipedia.org — سورة سبأ (توحيد الله 1-21، الإيمان بالوحي 22-39، الإيمان بالبعث 40-54)"
  - "dorar.net — موسوعة التفسير: سورة سبأ (مقاصد وموضوعات السورة)"
map:
  - title: { ar: "توحيد الله", en: "The Oneness of Allah" }
    range: [1, 21]
    family: faith
    summary:
      ar: "الحمد لله المالك لما في السماوات والأرض؛ والرد على منكري البعث، مع نعم الله على داود وسليمان وقصة سبأ وسيل العرم."
      en: "Praise to Allah, owner of all in heavens and earth; the deniers of resurrection answered, with Allah's favors on David and Solomon and the story of Saba."
    children:
      - { title: { ar: "إنكار البعث والرد عليه", en: "Denying Resurrection — Answered" }, range: [3, 9] }
      - { title: { ar: "داود وسليمان", en: "David and Solomon" }, range: [10, 14] }
      - { title: { ar: "قصة سبأ وسيل العرم", en: "Saba and the Flood of the Dam" }, range: [15, 21] }
  - title: { ar: "الإيمان بالوحي", en: "Faith in the Revelation" }
    range: [22, 39]
    family: faith
    summary:
      ar: "بطلان الشرك والشفاعة لغير الله، وحوار المستكبرين والمستضعفين يوم القيامة، والرد على المترفين، وسنة الله في الرزق."
      en: "The nullity of association and of intercession besides Allah; the arrogant and the oppressed disputing on the Last Day; the affluent answered; Allah's way in provision."
    children:
      - { title: { ar: "حوار المستكبرين والمستضعفين", en: "The Arrogant and the Oppressed Dispute" }, range: [31, 33] }
      - { title: { ar: "المترفون", en: "The Affluent" }, range: [34, 35] }
      - { title: { ar: "سنة الله في الرزق", en: "Allah's Way in Provision" }, range: [36, 39] }
  - title: { ar: "الإيمان بالبعث ومشاهده", en: "Faith in Resurrection and Its Scenes" }
    range: [40, 54]
    family: faith
    summary:
      ar: "تبرؤ الملائكة ممن عبدوهم، وتكذيب الكفار للرسل، وقذف الحق على الباطل، ولا تقبل التوبة بعد فوات الأوان."
      en: "The angels disowning their worshippers; the disbelievers belying the messengers; truth hurled at falsehood; no repentance accepted when too late."
    children:
      - { title: { ar: "تبرؤ الملائكة", en: "The Angels' Disavowal" }, range: [40, 42] }
