- title:
    ar: ذو القرنين
    en: Dhul-Qarnayn
    tr: Dhu al-Qarnayn
    id: Dhu al-Qarnayn
  range:
  - 83
  - 98
  family: stories
  summary:
    ar: تمكين ذي القرنين في الأرض، ورحلاته الثلاث، وبناء السد دون يأجوج ومأجوج.
    en: Dhul-Qarnayn established in the land; his three journeys; the barrier built against Gog and Magog.
    tr: Dhul-Qarnayn'ın topraklara ulaşmasını sağlamak, üç yolculuğu ve Gog ile Magog olmadan barajı inşa etmek.
    id: Memungkinkan Dhul-Qarnayn ke daratan, tiga perjalanannya, dan membangun bendungan tanpa Gog dan Magog.
  children:
  - title:
      ar: بناء السد
      en: Building the Barrier
