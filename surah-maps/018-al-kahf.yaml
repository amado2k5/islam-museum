map:
- title:
    ar: الافتتاح
    en: The Opening
    tr: Açılış
    id: Pembukaan
  range:
  - 1
  - 12
  family: faith
  summary:
    ar: الحمد لله منزل الكتاب قيما، والإنذار والبشارة، وتمهيد لقصة أصحاب الكهف.
    en: Praise to Allah who sent the upright Book; warning and glad tidings; the Cave Sleepers introduced.
    tr: Kitabı bir rehber, bir uyarı ve hoş haber olarak sunan Tanrı'ya şükürler olsun, ayrıca Mağara Halkı hikayesinin önsözü olarak.
    id: Puji Tuhan yang mewahyukan Kitab ini sebagai petunjuk, peringatan dan kabar gembira, serta pengantar kisah Orang-orang Gua.
  children: []
- title:
    ar: أصحاب الكهف
    en: The People of the Cave
    tr: Mağaranın İnsanları
    id: Orang-Orang Gua
  range:
  - 13
  - 26
  family: stories
  summary:
    ar: فتية آمنوا فزادهم الله هدى، ولجوؤهم إلى الكهف، ونومهم الطويل، ثم بعثهم آية للناس.
    en: Youths who believed and were guided more; their cave refuge, long sleep, then raising as a sign.
    tr: İnanan gençler, Allah onları rehberlikte, mağarada sığınaklarında, uzun uykularında artırdı, sonra onlar halk için bir işaret olarak gönderildiler.
    id: Para pemuda yang beriman, maka Allah menambah mereka dalam bimbingan, perlindungan mereka di gua, tidur panjang mereka, lalu mereka dikirim sebagai tanda bagi orang-orang.
  children:
