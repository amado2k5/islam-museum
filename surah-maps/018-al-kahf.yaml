- title:
    ar: الخاتمة
    en: The Closing
    tr: Sonuç
    id: Kesimpulan
  range:
  - 99
  - 110
  family: faith
  summary:
    ar: 'أهوال القيامة وعرض جهنم، والخسران المبين، وخاتمة السورة: من كان يرجو لقاء ربه فليعمل صالحا.'
    en: 'Resurrection''s terrors, Hell displayed, the clear losers; the close: whoever hopes to meet his Lord, let him do good.'
    tr: 'Dirilişin dehşetleri, cehennemin genişliği, açık kayıp ve surenin sonu: Rab''biyle karşılaşmayı umuyorsa, doğruluğu yapsın.'
    id: 'Kengerian Kebangkitan, luasnya Neraka, kehilangan yang jelas, dan akhir surat: Siapa yang berharap bertemu Tuhannya, biarlah ia berbuat benar.'
