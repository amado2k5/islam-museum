surah: 18
slug: al-kahf
sources_consulted:
  - "kuttab.com — Surah Al-Kahf mind map (7 blocks)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "الافتتاح", en: "The Opening" }
    range: [1, 12]
    family: faith
    summary:
      ar: "الحمد لله منزل الكتاب قيما، والإنذار والبشارة، وتمهيد لقصة أصحاب الكهف."
      en: "Praise to Allah who sent the upright Book; warning and glad tidings; the Cave Sleepers introduced."
    children: []
  - title: { ar: "أصحاب الكهف", en: "The People of the Cave" }
    range: [13, 26]
    family: stories
    summary:
      ar: "فتية آمنوا فزادهم الله هدى، ولجوؤهم إلى الكهف، ونومهم الطويل، ثم بعثهم آية للناس."
      en: "Youths who believed and were guided more; their cave refuge, long sleep, then raising as a sign."
    children:
      - { title: { ar: "الفتية المؤمنة", en: "The Believing Youths" }, range: [13, 16] }
      - { title: { ar: "مدة لبثهم", en: "How Long They Stayed" }, range: [25, 26] }
  - title: { ar: "صاحب الجنتين", en: "The Owner of the Two Gardens" }
    range: [27, 44]
    family: stories
    summary:
      ar: "الأمر بالصبر مع المؤمنين، ومثل الرجلين: صاحب الجنتين المغرور وصاحبه المؤمن الناصح."
      en: "Patience with the believers commanded; the parable of two men: the deluded garden-owner and his advising friend."
    children:
      - { title: { ar: "مثل الرجلين", en: "The Parable of the Two Men" }, range: [32, 44] }
  - title: { ar: "مثل الحياة الدنيا والحساب", en: "Worldly Life and the Reckoning" }
    range: [45, 59]
    family: faith
    summary:
      ar: "الدنيا كهشيم تذروه الرياح، والمال والبنون زينة، ويوم نسير الجبال ووضع الكتاب."
      en: "This life like stubble scattered by wind; wealth and children its adornment; the Day mountains move, the record laid open."
    children:
      - { title: { ar: "المال والبنون", en: "Wealth and Children" }, range: [46, 46] }
  - title: { ar: "موسى والخضر", en: "Moses and al-Khidr" }
    range: [60, 82]
    family: stories
    summary:
      ar: "رحلة موسى في طلب العلم، والحوادث الثلاثة: السفينة والغلام والجدار، ثم تأويلها."
      en: "Moses's journey seeking knowledge; the three events — ship, boy, wall — then their explanation."
    children:
      - { title: { ar: "السفينة", en: "The Ship" }, range: [71, 73] }
      - { title: { ar: "الغلام", en: "The Boy" }, range: [74, 76] }
      - { title: { ar: "الجدار", en: "The Wall" }, range: [77, 82] }
  - title: { ar: "ذو القرنين", en: "Dhul-Qarnayn" }
    range: [83, 98]
    family: stories
    summary:
      ar: "تمكين ذي القرنين في الأرض، ورحلاته الثلاث، وبناء السد دون يأجوج ومأجوج."
      en: "Dhul-Qarnayn established in the land; his three journeys; the barrier built against Gog and Magog."
    children:
      - { title: { ar: "بناء السد", en: "Building the Barrier" }, range: [94, 98] }
  - title: { ar: "الخاتمة", en: "The Closing" }
    range: [99, 110]
    family: faith
    summary:
      ar: "أهوال القيامة وعرض جهنم، والخسران المبين، وخاتمة السورة: من كان يرجو لقاء ربه فليعمل صالحا."
      en: "Resurrection's terrors, Hell displayed, the clear losers; the close: whoever hopes to meet his Lord, let him do good."
    children: []
