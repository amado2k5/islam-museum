      tr: Sadık Çocuklar
      id: Anak-anak Setia
    range:
    - 13
    - 16
  - title:
      ar: مدة لبثهم
      en: How Long They Stayed
      tr: Yayın süresi
      id: Durasi siaran mereka
    range:
    - 25
    - 26
- title:
    ar: صاحب الجنتين
    en: The Owner of the Two Gardens
    tr: İki bahçenin sahibi
    id: Pemilik dua taman
  range:
  - 27
  - 44
  family: stories
  summary:
    ar: 'الأمر بالصبر مع المؤمنين، ومثل الرجلين: صاحب الجنتين المغرور وصاحبه المؤمن الناصح.'
    en: 'Patience with the believers commanded; the parable of two men: the deluded garden-owner and his advising friend.'
    tr: 'İnananlara sabırlı olma emri ve iki adamın örneği: Cennetin kibirli sahibi ve samimi inanan.'
    id: 'Perintah untuk bersabar dengan orang beriman, dan teladan dari dua orang: pemilik Surga yang sombong dan orang percaya yang tulus.'
  children:
  - title:
      ar: مثل الرجلين
      en: The Parable of the Two Men
      tr: İki bacak gibi
      id: Seperti dua kaki
    range:
    - 32
    - 44
- title:
    ar: مثل الحياة الدنيا والحساب
    en: Worldly Life and the Reckoning
    tr: Bu dünyanın hayatı ve hesaplaşma gibi
    id: Seperti kehidupan dunia ini dan perhitungan
  range:
  - 45
  - 59
  family: faith
  summary:
    ar: الدنيا كهشيم تذروه الرياح، والمال والبنون زينة، ويوم نسير الجبال ووضع الكتاب.
    en: This life like stubble scattered by wind; wealth and children its adornment; the Day mountains move, the record laid open.
    tr: Dünya rüzgarla savrulan sakal, zenginlik ve çocuklar süs, dağları yürüyüp kitabı koyduğumuz gün.
    id: Dunia seperti janggut yang tertiup angin, kekayaan dan anak-anak adalah hiasan, dan hari kita berjalan di pegunungan dan menetapkan buku.
  children:
  - title:
      ar: المال والبنون
      en: Wealth and Children
      tr: Para ve Çocuklar
      id: Uang dan Anak-anak
    range:
    - 46
    - 46
- title:
    ar: موسى والخضر
    en: Moses and al-Khidr
    tr: Musa ve Al-Khidr
    id: Musa dan Al-Khidr
  range:
  - 60
  - 82
  family: stories
  summary:
    ar: 'رحلة موسى في طلب العلم، والحوادث الثلاثة: السفينة والغلام والجدار، ثم تأويلها.'
    en: Moses's journey seeking knowledge; the three events — ship, boy, wall — then their explanation.
    tr: 'Musa''nın bilgi arayışı yolculuğu ve üç olay: gemi, çocuk ve duvar, ardından bunların yorumu.'
    id: 'Perjalanan Musa dalam pencarian pengetahuan, dan tiga peristiwa: bahtera, anak laki-laki, dan tembok, lalu penafsirannya.'
