surah: 23
slug: al-muminun
sources_consulted:
  - "kuttab.com — Surah Al-Mu'minun mind map (5 blocks: 1-11, 12-22, 23-50, 51-77, 78-118)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "صفات المؤمنين", en: "The Traits of Believers" }
    range: [1, 11]
    family: faith
    summary:
      ar: "سبع صفات للمفلحين: الخشوع في الصلاة، والإعراض عن اللغو، والزكاة، وحفظ الفروج والأمانات."
      en: "Seven traits of the successful: humility in prayer, shunning idle talk, alms, guarding chastity and trusts."
    children: []
  - title: { ar: "أطوار الخلق والنعم", en: "Creation's Stages and Blessings" }
    range: [12, 22]
    family: faith
    summary:
      ar: "خلق الإنسان من سلالة من طين ثم أطوار الجنين، وإنزال الماء، والجنات والزيتون والأنعام."
      en: "Man from an extract of clay through the embryo's stages; water sent down; gardens, olives, cattle."
    children:
      - { title: { ar: "أطوار الجنين", en: "The Embryo's Stages" }, range: [12, 14] }
  - title: { ar: "الرسل والأمم", en: "Messengers and Nations" }
    range: [23, 50]
    family: stories
    summary:
      ar: "نوح والفلك، وأمم تُرفع وتُهلك، وموسى وهارون بالآيات، وعيسى وأمه آية."
      en: "Noah and the ark; nations raised and destroyed; Moses and Aaron with signs; Jesus and his mother a sign."
    children:
      - { title: { ar: "نوح والفلك", en: "Noah and the Ark" }, range: [23, 30] }
      - { title: { ar: "موسى وهارون", en: "Moses and Aaron" }, range: [45, 49] }
  - title: { ar: "تقطع الأمر", en: "The Affair Torn Apart" }
    range: [51, 77]
    family: faith
    summary:
      ar: "أمة واحدة فتقطعوا شيعا، والذين يؤتون ما آتوا وقلوبهم وجلة، والاستدراج بالنعم."
      en: "One nation, then split into sects; those who give with fearful hearts; being lured through blessings."
    children: []
  - title: { ar: "السمع والبصر والخاتمة", en: "Hearing, Sight, and the Closing" }
    range: [78, 118]
    family: faith
    summary:
      ar: "من جعل لكم السمع والأبصار، وطلب الرجعة والحاجز من ورائهم، وخاتمة السورة: رب اغفر وارحم."
      en: "He who made hearing and sight; the plea to return barred behind them; the close: Lord, forgive and have mercy."
    children:
      - { title: { ar: "طلب الرجعة", en: "Pleading to Return" }, range: [99, 100] }
      - { title: { ar: "رب اغفر وارحم", en: "Lord, Forgive and Have Mercy" }, range: [118, 118] }
