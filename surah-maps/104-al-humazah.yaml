    summary:
      ar: "ويل لكل همزة لمزة الذي جمع مالا وعدده يحسب أن ماله أخلده: كلا لينبذن في الحطمة."
      en: "Woe to every slanderer and backbiter who amassed and counted wealth, thinking it would make him immortal — he shall be flung into the Crusher."
