- title:
    ar: الهماز اللماز
    en: The Slanderer
    tr: Alhamaz Al-Lamaz
    id: Alhamaz Al-Lamaz
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: 'ويل لكل همزة لمزة الذي جمع مالا وعدده يحسب أن ماله أخلده: كلا لينبذن في الحطمة.'
    en: Woe to every slanderer and backbiter who amassed and counted wealth, thinking it would make him immortal — he shall be flung into the Crusher.
    tr: 'Zenginlik biriktiren ve onu sonsuzmuş gibi sayan her bir hakaretin vahşisi olsun: hayır, enkazda atılmak.'
    id: 'Celakalah setiap hamza hinaan yang mengumpulkan kekayaan dan menganggapnya seolah-olah kekayaannya abadi: tidak, untuk dibuang ke reruntuhan.'
  children: []
- title:
    ar: الحطمة
    en: The Crusher
    tr: Yıkım
    id: Kehancuran
  range:
  - 5
  - 9
  family: faith
  summary:
    ar: 'وما أدراك ما الحطمة: نار الله الموقدة التي تطلع على الأفئدة إنها عليهم مؤصدة في عمد ممددة.'
    en: What is the Crusher? Allah's kindled fire reaching into hearts, closed over them in outstretched columns.
    tr: Ve parçalanma hakkında ne biliyorsun? Tanrı'nın kalplerin üzerine yükselen alevli ateşi, gerçekten de uzun sütunlar halinde üzerlerine kapanmıştır.
    id: Dan apa yang kau ketahui tentang pecahan itu? Api Tuhan yang menyala yang naik ke atas hati, memang, api itu tertutup di atas mereka dalam tiang-tiang yang memanjang.
