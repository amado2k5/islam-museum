  - title: { ar: "الحطمة", en: "The Crusher" }
    range: [5, 9]
    family: faith
    summary:
      ar: "وما أدراك ما الحطمة: نار الله الموقدة التي تطلع على الأفئدة إنها عليهم مؤصدة في عمد ممددة."
      en: "What is the Crusher? Allah's kindled fire reaching into hearts, closed over them in outstretched columns."
