surah: 41
slug: fussilat
sources_consulted:
  - "ar.wikipedia.org — سورة فصلت (الشوطان: 1-36 و37-54، بحسب في ظلال القرآن)"
  - "arz.wikipedia.org — سورة فصلت (موضوع السورة)"
  - "f-iraq.com — سلسلة التعريف بسور القرآن: سورة فصلت"
map:
  - title: { ar: "تنزيل الكتاب وموقف المشركين", en: "The Book Sent Down; the Deniers' Stance" }
    range: [1, 8]
    family: faith
    summary:
      ar: "حم؛ تنزيل من الرحمن الرحيم؛ كتاب فُصلت آياته قرآنا عربيا بشيرا ونذيرا؛ وقالوا قلوبنا في أكنة؛ وويل للمشركين."
      en: "Ha-Mim; a sending down from the Merciful, the Compassionate; a Book whose verses are detailed, an Arabic Quran, glad tidings and warning; 'our hearts are veiled' — and woe to the polytheists."
    children:
      - { title: { ar: "كتاب فصلت آياته", en: "A Book with Detailed Verses" }, range: [3, 4] }
      - { title: { ar: "قلوبنا في أكنة", en: "'Our Hearts Are Veiled'" }, range: [5, 5] }
  - title: { ar: "خلق السماوات والأرض", en: "The Creation of Heavens and Earth" }
    range: [9, 12]
    family: faith
    summary:
      ar: "قل أئنكم لتكفرون بالذي خلق الأرض في يومين؛ وقدر فيها أقواتها؛ فقضاهن سبع سماوات وأوحى في كل سماء أمرها."
      en: "Say: do you disbelieve in Him who created the earth in two days? He ordained its sustenance, then fashioned seven heavens, inspiring each with its command."
    children: []
  - title: { ar: "عاد وثمود", en: "Ad and Thamud" }
    range: [13, 18]
    family: stories
    summary:
      ar: "فإن أعرضوا فقل أنذرتكم صاعقة مثل صاعقة عاد وثمود؛ فأما عاد فاستكبروا، وأما ثمود فاستحبوا العمى على الهدى."
      en: "If they turn away, say: I warn you of a thunderbolt like that of Ad and Thamud — Ad were arrogant, Thamud preferred blindness to guidance."
    children:
      - { title: { ar: "عاد", en: "Ad" }, range: [15, 16] }
      - { title: { ar: "ثمود", en: "Thamud" }, range: [17, 18] }
  - title: { ar: "مشهد القيامة وأعداء الله", en: "The Resurrection Scene; Allah's Enemies" }
    range: [19, 29]
    family: faith
    summary:
      ar: "ويوم يُحشر أعداء الله إلى النار؛ شهد عليهم سمعهم وأبصارهم وجلودهم؛ وقال الذين كفروا لا تسمعوا لهذا القرآن والغوا فيه."
      en: "The Day Allah's enemies are herded to the Fire; their hearing, sight and skins testifying against them; the disbelievers said: do not listen to this Quran, drown it out."
    children:
      - { title: { ar: "شهادة الجلود", en: "The Skins Testify" }, range: [20, 22] }
      - { title: { ar: "والغوا فيه", en: "'Drown It Out'" }, range: [26, 26] }
  - title: { ar: "الاستقامة والدعوة", en: "Steadfastness and the Call" }
    range: [30, 36]
    family: faith
    summary:
      ar: "إن الذين قالوا ربنا الله ثم استقاموا تتنزل عليهم الملائكة ألا تخافوا؛ ومن أحسن قولا ممن دعا إلى الله؛ ادفع بالتي هي أحسن."
      en: "Those who said 'our Lord is Allah' then stood firm — angels descend: fear not; none speaks fairer than one who calls to Allah; repel evil with what is better."
    children:
      - { title: { ar: "تتنزل عليهم الملائكة", en: "Angels Descend upon Them" }, range: [30, 32] }
      - { title: { ar: "ادفع بالتي هي أحسن", en: "Repel with What Is Better" }, range: [34, 34] }
  - title: { ar: "آيات الكون والقرآن", en: "Signs in the Universe; the Quran" }
    range: [37, 44]
    family: faith
    summary:
      ar: "ومن آياته الليل والنهار والشمس والقمر؛ والأرض الخاشعة تهتز وتربو بالماء؛ وإن الذين كفروا بالذكر؛ ولو جعلناه قرآنا أعجميا."
      en: "Among His signs: night and day, sun and moon; the barren earth quivering and swelling with water; those who disbelieved in the Remembrance — had We made it a foreign Quran…"
    children:
      - { title: { ar: "الليل والشمس والقمر", en: "Night, Sun and Moon" }, range: [37, 37] }
      - { title: { ar: "الأرض الخاشعة", en: "The Barren Earth" }, range: [39, 39] }
  - title: { ar: "الاختلاف وطبيعة الإنسان", en: "Dispute; the Nature of Man" }
    range: [45, 51]
    family: faith
    summary:
      ar: "ولقد آتينا موسى الكتاب فاختلف فيه؛ وإليه يُرد علم الساعة؛ لا يسأم الإنسان من دعاء الخير، وإذا مسه الشر فيئوس قنوط."
      en: "Moses was given the Book and it was disputed; to Him returns knowledge of the Hour; man never tires of praying for good, and in hardship despairs."
    children:
      - { title: { ar: "علم الساعة", en: "Knowledge of the Hour" }, range: [47, 47] }
      - { title: { ar: "الإنسان في السراء والضراء", en: "Man in Ease and Hardship" }, range: [49, 51] }
  - title: { ar: "سنريهم آياتنا", en: "We Shall Show Them Our Signs" }
    range: [52, 54]
    family: faith
    summary:
      ar: "قل أرأيتم إن كان من عند الله ثم كفرتم به؛ سنريهم آياتنا في الآفاق وفي أنفسهم حتى يتبين لهم أنه الحق."
      en: "Say: what if it is from Allah and you disbelieved? We shall show them Our signs on the horizons and in themselves until it is clear to them that it is the truth."
    children:
      - { title: { ar: "في الآفاق وفي أنفسهم", en: "On the Horizons and in Themselves" }, range: [53, 53] }
