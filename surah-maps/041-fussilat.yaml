map:
- title:
    ar: تنزيل الكتاب وموقف المشركين
    en: The Book Sent Down; the Deniers' Stance
    tr: Kitabın Vahyi ve Çoktanrılıların Konumu
    id: Wahyu Kitab dan Posisi Para Politeis
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: حم؛ تنزيل من الرحمن الرحيم؛ كتاب فُصلت آياته قرآنا عربيا بشيرا ونذيرا؛ وقالوا قلوبنا في أكنة؛ وويل للمشركين.
    en: Ha-Mim; a sending down from the Merciful, the Compassionate; a Book whose verses are detailed, an Arabic Quran, glad tidings and warning; 'our hearts are veiled' — and woe to the polytheists.
    tr: 'Hami; En Merhametli, En Merhametli''den bir vahy; ayetleri ayrıntılı olan bir kitap, Arapça bir Kur''an, müjdeler getiren ve uyaran bir Kitap; ve onlar: ''Kalplerimiz yoğundur.'' dediler. Ve karikçilere
      yazık olsun.'
    id: Hami; wahyu dari Yang Maha Penyayang, Yang Maha Penyayang; sebuah Kitab yang ayat-ayatnya terperinci, sebuah Al-Qur'an Arab, pembawa kabar baik dan peringatan; dan mereka berkata, 'Hati kami padat.'
      Dan celakalah kaum politeis.
  children:
  - title:
      ar: كتاب فصلت آياته
      en: A Book with Detailed Verses
      tr: Dizeleri detaylandırılmış bir kitap
      id: Sebuah buku yang baitnya telah dirinci
    range:
    - 3
    - 4
  - title:
      ar: قلوبنا في أكنة
      en: '''Our Hearts Are Veiled'''
      tr: Kalplerimiz bir kapta
      id: Hati kita berada dalam sebuah wadah
    range:
    - 5
    - 5
- title:
    ar: خلق السماوات والأرض
    en: The Creation of Heavens and Earth
    tr: Gökyüzü ve yeryüzünün yaratılışı
    id: Penciptaan langit dan bumi
  range:
  - 9
  - 12
  family: faith
  summary:
    ar: قل أئنكم لتكفرون بالذي خلق الأرض في يومين؛ وقدر فيها أقواتها؛ فقضاهن سبع سماوات وأوحى في كل سماء أمرها.
    en: 'Say: do you disbelieve in Him who created the earth in two days? He ordained its sustenance, then fashioned seven heavens, inspiring each with its command.'
    tr: 'Şöyle deyin: ''Yeryüzünü iki günde yaratan, güçlerini orada belirleyen, onları yedi gök olarak belirlemiş ve her gökte emrini vahyettiği O''na inkar mı edeceksiniz?'''
    id: Katakanlah, 'Apakah engkau akan tidak percaya kepada Dia yang menciptakan bumi dalam dua hari; Dia menentukan kekuatannya di dalamnya; Dia menetapkan mereka sebagai tujuh langit dan mengungkapkan
      perintahnya di setiap langit?'
  children: []
- title:
    ar: عاد وثمود
    en: Ad and Thamud
    tr: Dönüş ve Thamud
    id: Kembali dan Thamud
  range:
  - 13
  - 18
  family: stories
  summary:
    ar: فإن أعرضوا فقل أنذرتكم صاعقة مثل صاعقة عاد وثمود؛ فأما عاد فاستكبروا، وأما ثمود فاستحبوا العمى على الهدى.
    en: 'If they turn away, say: I warn you of a thunderbolt like that of Ad and Thamud — Ad were arrogant, Thamud preferred blindness to guidance.'
    tr: Eğer yüz çevirirlerse, 'Sizi 'Ad ve Semud'un yıldırımına benzer bir yıldırım hakkında uyardım.' deyin. 'Ad' ise kibirliydi, Thamud ise rehberlikten çok körlüğü tercih etti.
    id: Jika mereka berbalik, katakanlah, 'Aku telah memperingatkanmu tentang petir seperti petir 'Ad dan Thamud.' Adapun 'Ad, mereka sombong, dan Thamud, mereka lebih memilih buta daripada bimbingan.
  children:
  - title:
      ar: عاد
      en: Ad
      tr: Geri döndü
      id: Dikembalikan
    range:
    - 15
    - 16
  - title:
      ar: ثمود
      en: Thamud
      tr: Thamud
      id: Thamud
    range:
    - 17
    - 18
- title:
    ar: مشهد القيامة وأعداء الله
    en: The Resurrection Scene; Allah's Enemies
    tr: Diriliş sahnesi ve Tanrı'nın düşmanları
    id: Adegan kebangkitan dan musuh-musuh Tuhan
  range:
  - 19
  - 29
  family: faith
  summary:
    ar: ويوم يُحشر أعداء الله إلى النار؛ شهد عليهم سمعهم وأبصارهم وجلودهم؛ وقال الذين كفروا لا تسمعوا لهذا القرآن والغوا فيه.
    en: 'The Day Allah''s enemies are herded to the Fire; their hearing, sight and skins testifying against them; the disbelievers said: do not listen to this Quran, drown it out.'
    tr: Ve Allah'ın düşmanları ateşe toplanacak bir gün; işitmeleri, gözleri ve derileri onlara karşı şahitlik edecek; kâfir olanlar ise 'Bu Kur'an'ı dinlemeyin, sapmayın.' diyeceklerdir.
    id: Dan pada hari itu, musuh-musuh Allah akan dikumpulkan ke dalam Api; pendengaran, penglihatan mereka, dan kulit mereka akan menjadi saksi melawan mereka; dan mereka yang kafir akan berkata, 'Jangan
      dengarkan Al-Qur'an ini dan menyimpang darinya.'
  children:
  - title:
      ar: شهادة الجلود
      en: The Skins Testify
      tr: Deri Sertifikası
      id: Sertifikasi Kulit
    range:
    - 20
    - 22
  - title:
      ar: والغوا فيه
      en: '''Drown It Out'''
      tr: Ve iptal et
      id: Dan batalkan
    range:
    - 26
    - 26
- title:
    ar: الاستقامة والدعوة
    en: Steadfastness and the Call
    tr: Doğruluk ve Da'wah
    id: Kejujuran dan Da'wah
  range:
  - 30
  - 36
  family: faith
  summary:
    ar: إن الذين قالوا ربنا الله ثم استقاموا تتنزل عليهم الملائكة ألا تخافوا؛ ومن أحسن قولا ممن دعا إلى الله؛ ادفع بالتي هي أحسن.
    en: 'Those who said ''our Lord is Allah'' then stood firm — angels descend: fear not; none speaks fairer than one who calls to Allah; repel evil with what is better.'
    tr: 'Gerçekten de, ''Rabbimiz Allah''tır diyenlere ve sonra sadık kalanlara, melekler üzerlerine iner: ''Korkmayın.'' Ve Allah''a seslenenlerden daha iyi kim vardır? En iyi şekilde püskürtün.'
    id: Memang, mereka yang berkata, 'Tuhan kami adalah Allah' lalu tetap teguh, malaikat turun kepada mereka, 'Jangan takut.' Dan siapa yang lebih baik dalam berbicara selain yang memanggil Allah? Tolaklah
      dengan cara yang terbaik.
  children:
  - title:
      ar: تتنزل عليهم الملائكة
      en: Angels Descend upon Them
      tr: Melekler üzerlerine iner
      id: Malaikat turun ke arah mereka
    range:
    - 30
    - 32
  - title:
      ar: ادفع بالتي هي أحسن
      en: Repel with What Is Better
      tr: En iyileriyle öde
      id: Bayar dengan yang terbaik
    range:
    - 34
    - 34
- title:
    ar: آيات الكون والقرآن
    en: Signs in the Universe; the Quran
    tr: Evrenin ayetleri ve Kur'an'ın ayetleri
    id: Ayat-ayat Alam Semesta dan Al-Qur'an
  range:
  - 37
  - 44
  family: faith
  summary:
    ar: ومن آياته الليل والنهار والشمس والقمر؛ والأرض الخاشعة تهتز وتربو بالماء؛ وإن الذين كفروا بالذكر؛ ولو جعلناه قرآنا أعجميا.
    en: 'Among His signs: night and day, sun and moon; the barren earth quivering and swelling with water; those who disbelieved in the Remembrance — had We made it a foreign Quran…'
    tr: Göstergeleri arasında gece ve gündüz, güneş ve ay vardır; alçakgönüllü yer suyla sarsılır ve büyür; ve gerçekten de anıtlamaya inkar edenler vardır—biz onu yabancı bir Kur'an yapsak bile.
    id: Di antara tanda-tandanya adalah malam dan siang, matahari dan bulan; dan bumi yang rendah bergetar dan tumbuh dengan air; dan memang, mereka yang tidak percaya pada ingatan itu—meskipun Kami telah
      menjadikannya Al-Qur'an asing.
  children:
  - title:
      ar: الليل والشمس والقمر
      en: Night, Sun and Moon
      tr: Gece, güneş ve ay
      id: Malam, matahari, dan bulan
    range:
    - 37
    - 37
  - title:
      ar: الأرض الخاشعة
      en: The Barren Earth
      tr: Mütevazı Toprak
      id: Tanah Sederhana
    range:
    - 39
    - 39
- title:
    ar: الاختلاف وطبيعة الإنسان
    en: Dispute; the Nature of Man
    tr: Farklılık ve İnsan Doğası
    id: Perbedaan dan Sifat Manusia
  range:
  - 45
  - 51
  family: faith
  summary:
    ar: ولقد آتينا موسى الكتاب فاختلف فيه؛ وإليه يُرد علم الساعة؛ لا يسأم الإنسان من دعاء الخير، وإذا مسه الشر فيئوس قنوط.
    en: Moses was given the Book and it was disputed; to Him returns knowledge of the Hour; man never tires of praying for good, and in hardship despairs.
    tr: Musa'ya Kutsal Kitabı verdik, fakat bu konuda anlaşmazlık vardı; ve Saat bilgisi Ona geri döndü; kimse iyilik için dua etmekten yorulmaz, kötülük ona dokunduğunda umutsuzluğa kapılır.
    id: Dan Kami memberikan Musa Kitab Suci, tetapi ada perselisihan tentangnya; dan kepada-Nya dikembalikan pengetahuan tentang Jam; tak seorang pun lelah berdoa untuk kebaikan, dan ketika kejahatan menimpanya,
      ia putus asa.
  children:
  - title:
      ar: علم الساعة
      en: Knowledge of the Hour
      tr: Saat Bilimi
      id: Ilmu Jam
    range:
    - 47
    - 47
  - title:
      ar: الإنسان في السراء والضراء
      en: Man in Ease and Hardship
      tr: İyi günde kötü günde insan.
      id: Manusia di saat suka dan buruk.
    range:
    - 49
    - 51
- title:
    ar: سنريهم آياتنا
    en: We Shall Show Them Our Signs
    tr: Onlara dizelerimizi göstereceğiz.
    id: Kami akan menunjukkan ayat-ayat kami.
  range:
  - 52
  - 54
  family: faith
  summary:
    ar: قل أرأيتم إن كان من عند الله ثم كفرتم به؛ سنريهم آياتنا في الآفاق وفي أنفسهم حتى يتبين لهم أنه الحق.
    en: 'Say: what if it is from Allah and you disbelieved? We shall show them Our signs on the horizons and in themselves until it is clear to them that it is the truth.'
    tr: 'Şöyle de: ''Eğer Allah''tan gelip sonra inkar ediyorsanız, onlara ufuklarda ve içlerinde işaretlerimizi göstereceğiz, ta ki bunun gerçek olduğu onlara netleşene kadar.'''
    id: Katakanlah, 'Apakah kamu sudah mempertimbangkan apakah itu dari Allah lalu kamu tidak percaya? Kami akan menunjukkan tanda-tanda Kami di cakrawala dan dalam diri mereka sampai mereka sadar bahwa
      itu adalah kebenaran.'
  children:
  - title:
      ar: في الآفاق وفي أنفسهم
      en: On the Horizons and in Themselves
      tr: Ufuklarda ve kendi içinde
      id: Di cakrawala dan di dalam diri mereka sendiri
    range:
    - 53
    - 53
