map:
- title:
    ar: الاستعاذة العامة
    en: Refuge from the General
    tr: Genel Temyiz
    id: Banding Umum
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: 'قل أعوذ برب الفلق من شر ما خلق ومن شر غاسق إذا وقب: من العام إلى الخاص.'
    en: 'Say: I seek refuge with the Lord of daybreak — from the evil of what He created, and from the darkness when it settles.'
    tr: 'Şöyle de: ''Yaratılanın kötülüğünden ve battığında kararmanın kötülüğünden şafak Rabbine sığınıyorum.'' Genel olandan özel olana.'
    id: Katakanlah, 'Aku mencari perlindungan kepada Tuhan fajar dari kejahatan ciptaan-Nya dan dari kejahatan kegelapan saat ia terbenam.' Dari yang umum ke yang spesifik.
  children: []
- title:
    ar: شر الحاسد
    en: From the Envier
    tr: Kıskançların kötülüğü
    id: Kejahatan orang iri
  range:
  - 4
  - 5
  family: faith
  summary:
    ar: 'ومن شر النفاثات في العقد ومن شر حاسد إذا حسد: شرور من فعل الناس.'
    en: And from the evil of the blowers on knots, and from the envier when he envies — harms that come through people.
    tr: 'Ve kolyedeki üfleyicilerin kötülüğünden, kıskançlığın kötülüğünden ise: insanların eylemlerinden kaynaklanan kötülüklerden.'
    id: 'Dan dari kejahatan para penghembus kalung, dan dari kejahatan orang iri jika dia iri: kejahatan dari tindakan manusia.'
  children: []
