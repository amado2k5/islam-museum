map:
  - title: { ar: "الاستعاذة العامة", en: "Refuge from the General" }
    range: [1, 3]
    family: faith
    summary:
      ar: "قل أعوذ برب الفلق من شر ما خلق ومن شر غاسق إذا وقب: من العام إلى الخاص."
      en: "Say: I seek refuge with the Lord of daybreak — from the evil of what He created, and from the darkness when it settles."
    children: []
  - title: { ar: "شر الحاسد", en: "From the Envier" }
    range: [4, 5]
    family: faith
    summary:
      ar: "ومن شر النفاثات في العقد ومن شر حاسد إذا حسد: شرور من فعل الناس."
      en: "And from the evil of the blowers on knots, and from the envier when he envies — harms that come through people."
    children: []
