surah: 88
slug: al-ghashiyah
sources_consulted:
  - "kuttab.com — Surah Al-Ghashiyah mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "وجوه خاشعة", en: "Faces Humbled" }
    range: [1, 7]
    family: faith
    summary:
      ar: "هل أتاك حديث الغاشية: وجوه يومئذ خاشعة عاملة ناصبة تصلى نارا حامية تسقى من عين آنية، ليس لهم طعام إلا من ضريع."
      en: "Has the news of the Overwhelming reached you? Faces that Day humbled, toiling, entering a scorching fire, drinking from a boiling spring — no food but bitter thorn."
    children: []
  - title: { ar: "وجوه ناعمة", en: "Faces at Ease" }
    range: [8, 16]
    family: faith
    summary:
      ar: "وجوه يومئذ ناعمة لسعيها راضية في جنة عالية لا تسمع فيها لاغية، فيها سرر مرفوعة وأكواب موضوعة ونمارق مصفوفة."
      en: "Faces that Day at ease, pleased with their striving, in a lofty garden hearing no idle talk — raised thrones, set cups, arrayed cushions."
    children: []
  - title: { ar: "أفلا ينظرون", en: "Do They Not Look" }
    range: [17, 26]
    family: faith
    summary:
      ar: "أفلا ينظرون إلى الإبل كيف خلقت وإلى السماء كيف رفعت وإلى الجبال كيف نصبت وإلى الأرض كيف سطحت، فذكر إنما أنت مذكر لست عليهم بمسيطر."
      en: "Do they not look at the camel how it was created, the sky raised, the mountains fixed, the earth spread? Remind — you are only a reminder, not their controller."
    children: []
