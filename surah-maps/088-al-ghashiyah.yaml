map:
- title:
    ar: وجوه خاشعة
    en: Faces Humbled
    tr: Alçakgönüllü yüzler
    id: Wajah-wajah rendah hati
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: 'هل أتاك حديث الغاشية: وجوه يومئذ خاشعة عاملة ناصبة تصلى نارا حامية تسقى من عين آنية، ليس لهم طعام إلا من ضريع.'
    en: Has the news of the Overwhelming reached you? Faces that Day humbled, toiling, entering a scorching fire, drinking from a boiling spring — no food but bitter thorn.
    tr: 'El-Haşiye hadisi size geldi mi: O gün yüzler alçakgönüllü, çalışan ve dik duracak, kuyudan sulanan sıcak ateşe namaz kılacak, sadece soyundan yiyecek olacak.'
    id: 'Apakah hadis Al-Ghashiyyah telah sampai kepada Anda: wajah pada hari itu akan rendah hati, bekerja, dan berdiri tegak, berdoa dengan api panas yang disiram dari sumur, tanpa makanan kecuali dari
      keturunan.'
  children: []
- title:
    ar: وجوه ناعمة
    en: Faces at Ease
    tr: Yumuşak Yüzler
    id: Wajah Lembut
  range:
  - 8
  - 16
  family: faith
  summary:
    ar: وجوه يومئذ ناعمة لسعيها راضية في جنة عالية لا تسمع فيها لاغية، فيها سرر مرفوعة وأكواب موضوعة ونمارق مصفوفة.
    en: Faces that Day at ease, pleased with their striving, in a lofty garden hearing no idle talk — raised thrones, set cups, arrayed cushions.
    tr: O gün yüzler, çabalarına yumuşak, hiçbir şeyin duyulmadığı yüksek bir cennette, yükseltilmiş yataklar, hazır fincanlar ve düzenlenmiş yürüyüşlerle huzurludur.
    id: Wajah-wajah hari itu lembut atas usaha mereka, puas di surga tinggi di mana tak ada yang terdengar, dengan tempat tidur tinggi, cangkir yang diatur, dan mars yang teratur.
  children: []
- title:
    ar: أفلا ينظرون
    en: Do They Not Look
    tr: Görmüyorlar mı?
    id: Apakah mereka tidak melihat?
  range:
  - 17
  - 26
  family: faith
  summary:
    ar: أفلا ينظرون إلى الإبل كيف خلقت وإلى السماء كيف رفعت وإلى الجبال كيف نصبت وإلى الأرض كيف سطحت، فذكر إنما أنت مذكر لست عليهم بمسيطر.
    en: Do they not look at the camel how it was created, the sky raised, the mountains fixed, the earth spread? Remind — you are only a reminder, not their controller.
    tr: Develere bakmıyorlar mı, nasıl yaratıldıklarına, gökyüzüne, nasıl yükseltildiklerine, dağlara nasıl kurulduklarına ve toprağa nasıl düzleştirildiklerine bakmıyorlar mı? Unutmayın, ama siz sadece
      bir hatırlatıcısınız; onlar üzerinde kontrolünüz yok.
    id: Apakah mereka tidak melihat unta, bagaimana mereka diciptakan, dan langit, bagaimana mereka diangkat, dan gunung-gunung bagaimana mereka didirikan, dan bumi, bagaimana mereka diratakan? Ingatlah,
      tetapi kamu hanyalah pengingat; kamu tidak memiliki kendali atas mereka.
  children: []
