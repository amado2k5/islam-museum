map:
- title:
    ar: الإخلاص في العبادة
    en: Sincerity in Worship
    tr: İbadette samimiyet
    id: Ketulusan dalam ibadah
  range:
  - 1
  - 6
  family: faith
  summary:
    ar: تنزيل الكتاب من الله العزيز الحكيم؛ فاعبد الله مخلصا له الدين؛ خلق السماوات والأرض وخلقكم من نفس واحدة.
    en: The Book sent down from Allah the Mighty, the Wise; worship Allah making religion sincerely His; He created the heavens, the earth, and you from a single soul.
    tr: Kitabın indiriği, Yüce ve Bilgin Allah'tandır; bu yüzden Allah'a samimiyetle bağlı olarak ibadet edin; O gökleri ve yeryüzünü yarattı ve sizi tek bir ruhtan yarattı.
    id: Wahyu Kitab ini berasal dari Allah, Yang Maha Kuasa, Yang Bijaksana; maka beribadahlah kepada Allah, yang tulus berbakti kepada-Nya; Dia menciptakan langit dan bumi serta menciptakanmu dari satu
      jiwa.
  children: []
- title:
    ar: التوحيد وأحوال الناس
    en: Oneness; the States of People
    tr: Tek tanrıcılık ve insanların koşulları
    id: Monoteisme dan kondisi manusia
  range:
  - 7
  - 26
  family: faith
  summary:
    ar: لا تزر وازرة وزر أخرى؛ والقانت آناء الليل؛ والذين يستمعون القول فيتبعون أحسنه؛ وأحسن الحديث كتابا متشابها.
    en: No bearer bears another's burden; the one devout in the night hours; those who listen to the word and follow its best; the finest discourse, a consistent Book.
    tr: Hiçbir taşıyıcı başkasının yükünü taşımaz; dindar olan gecenin aletleridir; konuşmayı dinleyip en iyisini takip edenler vardır; ve en iyi konuşma belirsiz bir kitaptır.
    id: Tidak ada pembawa beban orang lain; yang taat adalah alat malam; mereka yang mendengarkan ucapan dan mengikuti yang terbaik; dan pidato terbaik adalah buku yang ambigu.
  children:
  - title:
      ar: القانت آناء الليل
      en: Devout in the Night Hours
      tr: Gece gecenin kaplarıydı
      id: Malam adalah wadah malam
    range:
    - 9
    - 9
  - title:
      ar: يستمعون القول فيتبعون أحسنه
      en: They Follow the Best of It
      tr: Kelimeyi dinler ve en iyisini takip ederler
      id: Mereka mendengarkan firman dan mengikuti yang terbaik darinya
    range:
    - 17
    - 18
  - title:
      ar: أحسن الحديث
      en: The Finest Discourse
      tr: En iyi konuşma
      id: Pembicaraan terbaik
    range:
    - 23
    - 23
- title:
    ar: القرآن والرد على المشركين
    en: The Quran; Answering the Polytheists
    tr: Kur'an ve Çok Tanrılılara Yanıt
    id: Al-Qur'an dan Tanggapan terhadap Para Politeis
  range:
  - 27
  - 41
  family: faith
  summary:
    ar: ضُرب للناس في القرآن من كل مثل؛ قرآنا عربيا؛ مثل الشركاء المتشاكسين؛ إنك ميت وإنهم ميتون ثم تختصمون.
    en: Every parable struck for people in the Quran, an Arabic recitation; the parable of quarrelling partners; you will die and they will die, then you will dispute.
    tr: 'Kur''an''da insanlara her benzetmeyi vermiştir: Arapça Kur''an; kavga eden ortaklar gibi; ''Gerçekten siz öldünüz, onlar da öldü.'' Sonra tartışırsınız.'
    id: 'Dia telah memberikan kepada orang-orang dalam Al-Qur''an setiap perumpamaan: Al-Qur''an Arab; seperti para rekan yang suka bertengkar; ''Sesungguhnya, kamu telah mati, dan mereka pun telah mati.''
      Maka kamu berdebat.'
  children:
  - title:
      ar: قرآن عربي
      en: An Arabic Quran
      tr: Arapça Kur'an
      id: Al-Qur'an Arab
    range:
    - 27
    - 28
  - title:
      ar: مثل الشركاء المتشاكسين
      en: The Quarrelling Partners
      tr: Kavgacı ortaklar gibi
      id: Seperti pasangan yang suka bertengkar
    range:
    - 29
    - 29
  - title:
      ar: إنك ميت وإنهم ميتون
      en: You Will Die, and They Will Die
      tr: Sen öldün, onlar da öldü.
      id: Kamu sudah mati dan mereka juga mati.
    range:
    - 30
    - 31
- title:
    ar: الشفاعة والتوكل
    en: Intercession and Trust
    tr: Aracılık ve Tanrı'ya Güven
    id: Perantaraan dan Ketergantungan pada Tuhan
  range:
  - 42
  - 52
  family: faith
  summary:
    ar: الله يتوفى الأنفس حين موتها؛ أم اتخذوا من دون الله شفعاء — لله الشفاعة جميعا؛ وأنى لهم التناوش من مكان بعيد.
    en: Allah takes souls at death; have they taken intercessors besides Allah? — all intercession belongs to Allah.
    tr: Tanrı, ruhları ölüm anında alır; yoksa onlar da Tanrı'dan başka aracılar mı aldı? — Tüm aracılık Allah'a aittir; ve uzak bir yerden nasıl tartışma olabilir?
    id: Tuhan mengambil jiwa pada saat kematian mereka; atau apakah mereka mengambil perantara selain Tuhan? — Allah memiliki semua perantaraan; dan bagaimana mereka bisa berselisih dari tempat yang jauh?
  children:
  - title:
      ar: الوفاة والنوم
      en: Death and Sleep
      tr: Ölüm ve Uyku
      id: Kematian dan Tidur
    range:
    - 42
    - 42
  - title:
      ar: الشفاعة لله جميعا
      en: All Intercession Is Allah's
      tr: Aracılık hepimiz içindir
      id: Perantaraan adalah untuk kita semua
    range:
    - 43
    - 44
- title:
    ar: لا تقنطوا من رحمة الله
    en: Do Not Despair of Allah's Mercy
    tr: Tanrı'nın merhametinden umutsuzluğa kapılma
    id: Jangan putus asa akan belas kasihan Tuhan
  range:
  - 53
  - 61
  family: faith
  summary:
    ar: قل يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن الله يغفر الذنوب جميعا؛ وأنيبوا قبل أن يأتيكم العذاب.
    en: O My servants who have transgressed against themselves, do not despair of Allah's mercy — Allah forgives all sins; turn back before the torment comes.
    tr: 'Şöyle de: ''Ey benim kölerim, kendilerine günah etmişler, Allah''ın merhametinden umutsuzluk çekmeyin. Gerçekten Allah tüm günahları affeder; ceza gelmeden önce tövbe edin.'''
    id: Katakanlah, 'Wahai hamba-Ku yang telah berbuat salah pada diri mereka sendiri, janganlah putus asa akan rahmat Allah. Sesungguhnya, Allah mengampuni segala dosa; dan bertobatlah sebelum hukuman
      datang padamu.'
  children:
  - title:
      ar: يا عبادي الذين أسرفوا
      en: O My Servants Who Transgressed
      tr: Ey israfçı hizmetkarlarım
      id: Oh hamba-Ku yang telah membuang-buang
    range:
    - 53
    - 55
- title:
    ar: الربوبية والبعث
    en: Lordship and Resurrection
    tr: Lordluk ve diriliş
    id: Kepemimpinan dan kebangkitan
  range:
  - 62
  - 70
  family: faith
  summary:
    ar: الله خالق كل شيء؛ وما قدروا الله حق قدره والأرض جميعا قبضته يوم القيامة؛ ونفخ في الصور وأشرقت الأرض بنور ربها.
    en: Allah is creator of all things; they did not esteem Allah as He deserves — the whole earth in His grip on Resurrection Day; the Trumpet blown, the earth shining with its Lord's light.
    tr: Allah her şeyin Yaratıcısıdır; ve Allah'ı gerçek değerlendirmesiyle değerlendirmediler, oysa Qiyomat Günü'nde tüm yer O'nun elindeydi; boru çalındı ve yer Rabbinin ışığıyla parladı.
    id: Allah adalah Pencipta segala sesuatu; dan mereka tidak menilai Allah dengan penilaian sejati-Nya, sementara seluruh bumi berada di cengkeraman-Nya pada Hari Kebangkitan; dan terompet ditiup, dan
      bumi bersinar dengan cahaya Tuhannya.
  children:
  - title:
      ar: وما قدروا الله حق قدره
      en: They Did Not Esteem Allah Aright
      tr: Ve Tanrı'yı hak ettiği gibi takdir etmediler
      id: Dan mereka tidak menghargai Tuhan sebagaimana mestinya
    range:
    - 67
    - 67
  - title:
      ar: النفخ في الصور
      en: The Trumpet Blast
      tr: Fotoğrafları üfleme
      id: Meniup gambar
    range:
    - 68
    - 68
- title:
    ar: الزمر إلى الجنة والنار
    en: The Throngs to Paradise and Hell
    tr: Cennete ve cehenneme giden gruplar
    id: Kelompok-kelompok ke surga dan neraka
  range:
  - 71
  - 75
  family: faith
  summary:
    ar: وسيق الذين كفروا إلى جهنم زمرا؛ وسيق الذين اتقوا ربهم إلى الجنة زمرا؛ وقضي بينهم بالحق وقيل الحمد لله رب العالمين.
    en: The disbelievers driven to Hell in throngs; the God-conscious driven to Paradise in throngs; judgment passed in truth, and praise to Allah, Lord of worlds.
    tr: 'Kâfir olanlar gruplar halinde cehenneme sürülür; Rablerinden korkanlar gruplar halinde cennete sürülür; aralarında doğru yargılanır ve şöyle denilecektir: Dünyaların Rabbi Allah''a övgüler olsun.'
    id: 'Mereka yang tidak percaya akan diusir ke Neraka dalam kelompok-kelompok; mereka yang takut kepada Tuhan mereka akan diusir ke Surga secara berkelompok; dan akan diadili di antara mereka secara
      benar, dan akan dikatakan: Puji bagi Allah, Tuhan segala alam.'
  children:
  - title:
      ar: زمر أهل النار
      en: The Throngs of the Fire
      tr: Ateş halkı grupları
      id: Kelompok-kelompok orang api
    range:
    - 71
    - 72
  - title:
      ar: زمر أهل الجنة
      en: The Throngs of Paradise
      tr: Cennet halkı grupları
      id: Kelompok orang-orang Paradise
    range:
    - 73
    - 75
