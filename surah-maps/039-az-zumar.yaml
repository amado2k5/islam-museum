surah: 39
slug: az-zumar
sources_consulted:
  - "tadabbur-alquran.com — تدبر سورة الزمر (1-6، 7-70، 71-75)"
  - "mtafsir.net — سورة الزمر تقسيم موضوعي (53-61 البشارة، 62-75 الربوبية)"
  - "quran.com API — التحقق من بدايات المقاطع (27، 42، 53، 62، 71)"
map:
  - title: { ar: "الإخلاص في العبادة", en: "Sincerity in Worship" }
    range: [1, 6]
    family: faith
    summary:
      ar: "تنزيل الكتاب من الله العزيز الحكيم؛ فاعبد الله مخلصا له الدين؛ خلق السماوات والأرض وخلقكم من نفس واحدة."
      en: "The Book sent down from Allah the Mighty, the Wise; worship Allah making religion sincerely His; He created the heavens, the earth, and you from a single soul."
    children: []
  - title: { ar: "التوحيد وأحوال الناس", en: "Oneness; the States of People" }
    range: [7, 26]
    family: faith
    summary:
      ar: "لا تزر وازرة وزر أخرى؛ والقانت آناء الليل؛ والذين يستمعون القول فيتبعون أحسنه؛ وأحسن الحديث كتابا متشابها."
      en: "No bearer bears another's burden; the one devout in the night hours; those who listen to the word and follow its best; the finest discourse, a consistent Book."
    children:
      - { title: { ar: "القانت آناء الليل", en: "Devout in the Night Hours" }, range: [9, 9] }
      - { title: { ar: "يستمعون القول فيتبعون أحسنه", en: "They Follow the Best of It" }, range: [17, 18] }
      - { title: { ar: "أحسن الحديث", en: "The Finest Discourse" }, range: [23, 23] }
  - title: { ar: "القرآن والرد على المشركين", en: "The Quran; Answering the Polytheists" }
    range: [27, 41]
    family: faith
    summary:
      ar: "ضُرب للناس في القرآن من كل مثل؛ قرآنا عربيا؛ مثل الشركاء المتشاكسين؛ إنك ميت وإنهم ميتون ثم تختصمون."
      en: "Every parable struck for people in the Quran, an Arabic recitation; the parable of quarrelling partners; you will die and they will die, then you will dispute."
    children:
      - { title: { ar: "قرآن عربي", en: "An Arabic Quran" }, range: [27, 28] }
      - { title: { ar: "مثل الشركاء المتشاكسين", en: "The Quarrelling Partners" }, range: [29, 29] }
      - { title: { ar: "إنك ميت وإنهم ميتون", en: "You Will Die, and They Will Die" }, range: [30, 31] }
  - title: { ar: "الشفاعة والتوكل", en: "Intercession and Trust" }
    range: [42, 52]
    family: faith
    summary:
      ar: "الله يتوفى الأنفس حين موتها؛ أم اتخذوا من دون الله شفعاء — لله الشفاعة جميعا؛ وأنى لهم التناوش من مكان بعيد."
      en: "Allah takes souls at death; have they taken intercessors besides Allah? — all intercession belongs to Allah."
    children:
      - { title: { ar: "الوفاة والنوم", en: "Death and Sleep" }, range: [42, 42] }
      - { title: { ar: "الشفاعة لله جميعا", en: "All Intercession Is Allah's" }, range: [43, 44] }
  - title: { ar: "لا تقنطوا من رحمة الله", en: "Do Not Despair of Allah's Mercy" }
    range: [53, 61]
    family: faith
    summary:
      ar: "قل يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن الله يغفر الذنوب جميعا؛ وأنيبوا قبل أن يأتيكم العذاب."
      en: "O My servants who have transgressed against themselves, do not despair of Allah's mercy — Allah forgives all sins; turn back before the torment comes."
    children:
      - { title: { ar: "يا عبادي الذين أسرفوا", en: "O My Servants Who Transgressed" }, range: [53, 55] }
  - title: { ar: "الربوبية والبعث", en: "Lordship and Resurrection" }
    range: [62, 70]
    family: faith
    summary:
      ar: "الله خالق كل شيء؛ وما قدروا الله حق قدره والأرض جميعا قبضته يوم القيامة؛ ونفخ في الصور وأشرقت الأرض بنور ربها."
      en: "Allah is creator of all things; they did not esteem Allah as He deserves — the whole earth in His grip on Resurrection Day; the Trumpet blown, the earth shining with its Lord's light."
    children:
      - { title: { ar: "وما قدروا الله حق قدره", en: "They Did Not Esteem Allah Aright" }, range: [67, 67] }
      - { title: { ar: "النفخ في الصور", en: "The Trumpet Blast" }, range: [68, 68] }
  - title: { ar: "الزمر إلى الجنة والنار", en: "The Throngs to Paradise and Hell" }
    range: [71, 75]
    family: faith
    summary:
      ar: "وسيق الذين كفروا إلى جهنم زمرا؛ وسيق الذين اتقوا ربهم إلى الجنة زمرا؛ وقضي بينهم بالحق وقيل الحمد لله رب العالمين."
      en: "The disbelievers driven to Hell in throngs; the God-conscious driven to Paradise in throngs; judgment passed in truth, and praise to Allah, Lord of worlds."
    children:
      - { title: { ar: "زمر أهل النار", en: "The Throngs of the Fire" }, range: [71, 72] }
      - { title: { ar: "زمر أهل الجنة", en: "The Throngs of Paradise" }, range: [73, 75] }
