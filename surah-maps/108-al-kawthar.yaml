  summary:
    ar: 'إنا أعطيناك الكوثر فصل لربك وانحر: إن شانئك هو الأبتر.'
    en: We granted you abundance — so pray to your Lord and sacrifice; it is your hater who is cut off.
    tr: Gerçekten de sana El-Kâvtar verdik, Rabbine okuduk ve kurban verdik; gerçekten de düşmanın kesendir.
    id: 'Sesungguhnya, Kami telah memberikan Al-Kawthar kepadamu, bacakan kepada Tuhanmu, dan korban: sesungguhnya, musuhmu adalah yang memisahkan dirimu.'
