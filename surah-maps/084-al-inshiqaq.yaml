map:
- title:
    ar: انشقاق السماء والحساب
    en: The Splitting Sky and the Reckoning
    tr: Cennetin Bölünmesi ve Hesaplaşma
    id: Perpecahan Surga dan Penghakiman
  range:
  - 1
  - 15
  family: faith
  summary:
    ar: 'إذا السماء انشقت وأذنت لربها وحقت، والأرض مدت وألقت ما فيها: يا أيها الإنسان إنك كادح إلى ربك كدحا، فمن أوتي كتابه بيمينه فسوف يحاسب حسابا يسيرا.'
    en: 'When the sky splits in obedience to its Lord, and the earth is stretched and emptied: O man, you toil toward your Lord — whoever is given his book in his right hand shall have an easy reckoning.'
    tr: 'Sonra gökyüzü yarıldı, Rab''bini kabul etti ve doğru oldu, yer uzandı ve içindekileri savdu: Ey insan, gerçekten Rab''inize doğru çalışıyorsunuz, sağ eline kitabı verilenlere küçük bir hesap verilecektir.'
    id: 'Kemudian langit terbelah dan membiarkan Tuhannya berkata jujur, dan bumi terbentang dan mengusir apa yang ada di dalamnya: Wahai manusia, sungguh kalian bekerja untuk Tuhan kalian, maka siapa pun
      yang diberi buku-Nya di tangan kanannya akan mendapat perhitungan kecil.'
  children: []
- title:
    ar: القسم ومراحل الإنسان
    en: The Oath and Man's Stages
    tr: İnsanın yemin ve evreleri
    id: Sumpah dan tahapan manusia
  range:
  - 16
  - 25
  family: faith
  summary:
    ar: 'فلا أقسم بالشفق والليل وما وسق والقمر إذا اتسق: لتركبن طبقا عن طبق، وجزاء المؤمنين أجر غير ممنون.'
    en: 'The oath by twilight, the night and the full moon: you shall ride stage after stage — and the believers shall have an unfailing reward.'
    tr: 'Bu yüzden alacakaranlık, gece, ay ve ay battığında yemin etmem: bir tabak üstüne diğerine binersin ve inananların ödülü takdir edilmeyen bir ödüldür.'
    id: 'Jadi aku tidak bersumpah pada senja, malam, bulan, dan bulan saat terbenam: kamu akan menunggangi satu piring demi piring lainnya, dan hadiah bagi orang percaya adalah hadiah yang tidak dihargai.'
  children: []
