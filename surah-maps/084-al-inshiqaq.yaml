map:
  - title: { ar: "انشقاق السماء والحساب", en: "The Splitting Sky and the Reckoning" }
    range: [1, 15]
    family: faith
    summary:
      ar: "إذا السماء انشقت وأذنت لربها وحقت، والأرض مدت وألقت ما فيها: يا أيها الإنسان إنك كادح إلى ربك كدحا، فمن أوتي كتابه بيمينه فسوف يحاسب حسابا يسيرا."
      en: "When the sky splits in obedience to its Lord, and the earth is stretched and emptied: O man, you toil toward your Lord — whoever is given his book in his right hand shall have an easy reckoning."
    children: []
  - title: { ar: "القسم ومراحل الإنسان", en: "The Oath and Man's Stages" }
    range: [16, 25]
    family: faith
    summary:
      ar: "فلا أقسم بالشفق والليل وما وسق والقمر إذا اتسق: لتركبن طبقا عن طبق، وجزاء المؤمنين أجر غير ممنون."
      en: "The oath by twilight, the night and the full moon: you shall ride stage after stage — and the believers shall have an unfailing reward."
    children: []
