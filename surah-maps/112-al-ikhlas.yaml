map:
- title:
    ar: أحد صمد
    en: One, the Eternal Refuge
    tr: Ahad Samad
    id: Ahad Samad
  range:
  - 1
  - 2
  family: faith
  summary:
    ar: 'قل هو الله أحد الله الصمد: الواحد الذي تصمد إليه الخلائق في حوائجها.'
    en: 'Say: He is Allah, the One — Allah, the Eternal Refuge to whom all creation turns.'
    tr: 'De ki: O, yaratıkların ihtiyaçlarında dayandığı Tek Allah''tır.'
    id: 'Katakanlah: Dialah Allah, Yang Maha Esa dan Yang Maha Suci yang diharapkan oleh makhluk-makhluk dalam kebutuhan-Nya.'
  children: []
- title:
    ar: لم يلد ولم يولد
    en: Neither Begets Nor Is Begotten
    tr: Ne doğmuştu ne de doğmuştu
    id: Dia tidak lahir maupun lahir
  range:
  - 3
  - 4
  family: faith
  summary:
    ar: 'لم يلد ولم يولد ولم يكن له كفوا أحد: تنزيه مطلق عن كل شبيه.'
    en: He neither begets nor is begotten, and there is none comparable to Him — absolute transcendence.
    tr: 'Ne doğmuştu ne de doğmuştu ve O''na eşi yoktu: tüm benzerliklerden mutlak bir aşkınlık.'
    id: 'Dia tidak lahir maupun lahir, dan Dia tidak sebanding dengan-Nya: transendensi mutlak dari segala kesamaan.'
  children: []
