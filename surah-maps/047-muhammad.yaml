surah: 47
slug: muhammad
sources_consulted:
  - "alukah.net — تفسير سورة محمد (1-11: القتال وحكم الأسرى)"
  - "tadabbur-alquran.com — تدبر سورة محمد"
  - "ar.wikipedia.org — سورة محمد (ملخص الآيات)"
map:
  - title: { ar: "الفريقان", en: "The Two Parties" }
    range: [1, 3]
    family: faith
    summary:
      ar: "الذين كفروا وصدوا عن سبيل الله أضل أعمالهم؛ والذين آمنوا وعملوا الصالحات وآمنوا بما نزل على محمد كفر عنهم سيئاتهم وأصلح بالهم."
      en: "Those who disbelieve and bar from God's way — He wasted their deeds; those who believe and do good and believe in what was sent to Muhammad — He absolved their sins and set right their state."
    children:
      - { title: { ar: "أضل أعمالهم", en: "He Wasted Their Deeds" }, range: [1, 1] }
      - { title: { ar: "كفر عنهم سيئاتهم", en: "He Absolved Their Sins" }, range: [2, 2] }
  - title: { ar: "أحكام القتال والأسرى", en: "Rulings of Fighting and Captives" }
    range: [4, 6]
    family: law
    summary:
      ar: "فإذا لقيتم الذين كفروا فضرب الرقاب حتى إذا أثخنتموهم فشدوا الوثاق فإما منا بعد وإما فداء؛ والذين قتلوا في سبيل الله فلن يضل أعمالهم."
      en: "When you meet the disbelievers, strike the necks until you have overwhelmed them, then bind firmly — then grace or ransom; those killed in God's way — He will never waste their deeds."
    children:
      - { title: { ar: "فضرب الرقاب", en: "Strike the Necks" }, range: [4, 4] }
  - title: { ar: "النصر والاعتبار بالأمم", en: "Victory; Lessons from Nations" }
    range: [7, 11]
    family: faith
    summary:
      ar: "يا أيها الذين آمنوا إن تنصروا الله ينصركم ويثبت أقدامكم؛ أفلم يسيروا في الأرض فينظروا كيف كان عاقبة الذين من قبلهم دمر الله عليهم."
      en: "Believers, if you support God He will support you and make firm your steps; have they not traveled the earth to see the end of those before them — God destroyed them."
    children:
      - { title: { ar: "إن تنصروا الله ينصركم", en: "If You Support God He Supports You" }, range: [7, 7] }
      - { title: { ar: "دمر الله عليهم", en: "God Destroyed Them" }, range: [10, 10] }
  - title: { ar: "الجنة والنار والتوحيد", en: "Garden, Fire, and Oneness" }
    range: [12, 19]
    family: faith
    summary:
      ar: "إن الله يدخل الذين آمنوا جنات تجري من تحتها الأنهار؛ مثل الجنة التي وعد المتقون فيها أنهار من ماء غير آسن؛ فاعلم أنه لا إله إلا الله واستغفر لذنبك."
      en: "God admits believers into Gardens beneath which rivers flow; the likeness of the Garden promised the God-conscious — rivers of unspoiled water; know that there is no god but God, and ask forgiveness for your sin."
    children:
      - { title: { ar: "مثل الجنة", en: "The Likeness of the Garden" }, range: [15, 15] }
      - { title: { ar: "لا إله إلا الله", en: "No God but God" }, range: [19, 19] }
  - title: { ar: "المنافقون والابتلاء", en: "The Hypocrites; the Test" }
    range: [20, 32]
    family: faith
    summary:
      ar: "ويقول الذين آمنوا لولا نزلت سورة؛ أفلا يتدبرون القرآن أم على قلوب أقفالها؛ أم حسب الذين في قلوبهم مرض أن لن يخرج الله أضغانهم؛ ولنبلونكم حتى نعلم المجاهدين منكم والصابرين."
      en: "Believers say: if only a surah were sent down; will they not ponder the Quran, or are there locks on hearts; did the diseased-hearted think God would not expose their rancor; We shall test you until We know your strivers and the patient."
    children:
      - { title: { ar: "أفلا يتدبرون القرآن", en: "Will They Not Ponder the Quran" }, range: [24, 24] }
      - { title: { ar: "لحن القول", en: "The Tone of Speech" }, range: [29, 30] }
      - { title: { ar: "ولنبلونكم", en: "We Shall Test You" }, range: [31, 31] }
  - title: { ar: "الطاعة والبذل", en: "Obedience; Spending" }
    range: [33, 38]
    family: faith
    summary:
      ar: "يا أيها الذين آمنوا أطيعوا الله وأطيعوا الرسول ولا تبطلوا أعمالكم؛ فلا تهنوا وتدعوا إلى السلم وأنتم الأعلون؛ ها أنتم هؤلاء تدعون لتنفقوا في سبيل الله؛ وإن تتولوا يستبدل قوما غيركم."
      en: "Believers, obey God and obey the Messenger and do not nullify your deeds; do not weaken and call for peace when you are the uppermost; you are called to spend in God's way; if you turn away, He will replace you with another people."
    children:
      - { title: { ar: "أطيعوا الله وأطيعوا الرسول", en: "Obey God and Obey the Messenger" }, range: [33, 33] }
      - { title: { ar: "يستبدل قوما غيركم", en: "He Will Replace You" }, range: [38, 38] }
