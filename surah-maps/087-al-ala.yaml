map:
- title:
    ar: سبح اسم ربك الأعلى
    en: Glorify Your Lord the Most High
    tr: Yüce Tanrınızın adına şan olsun
    id: Kemuliaan bagi nama Tuhan tertinggi kalian
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: سبح اسم ربك الأعلى الذي خلق فسوى والذي قدر فهدى والذي أخرج المرعى فجعله غثاء أحوى.
    en: Glorify the name of your Lord, the Most High, who created and proportioned, decreed and guided, brought forth pasture then made it dark stubble.
    tr: Yüce Yüce Rabbin, yaratan ve arıtmış, karar veren ve yol gösteren, otlak yetiştiren ve onu kuru bir toprak yapan Yüce Tanrı'nın adını yücelt.
    id: Mulailah nama Tuhanmu, Yang Maha Tinggi, yang menciptakan dan memurnikan, yang menegaskan dan membimbing, yang melahirkan padang rumput dan menjadikannya tanah kering.
  children: []
- title:
    ar: التيسير والتذكير
    en: Ease and Reminder
    tr: Kolaylaştırma ve hatırlatma
    id: Fasilitasi dan pengingat
  range:
  - 6
  - 13
  family: faith
  summary:
    ar: 'سنقرئك فلا تنسى إلا ما شاء الله، ونيسرك لليسرى فذكر إن نفعت الذكرى: سيذكر من يخشى ويتجنبها الأشقى.'
    en: 'We shall make you recite and you shall not forget; We shall ease you toward ease — so remind: the God-fearing will take heed, the most wretched will avoid it.'
    tr: 'Size okuyacağız, Allah ne isterse unutma, seni sola kolay yapacağız, hatırlamanın faydası varsa hatırla: Korkanları ve en zavallıları bile o, ondan kaçınanları hatırlayacaktır.'
    id: 'Kami akan membaca kepadamu, jadi jangan lupa kecuali apa yang Allah kehendaki, dan Kami akan memudahkan kalian ke kiri, jadi ingatlah jika kenangan itu bermanfaat: Dia akan mengingat mereka yang
      takut dan menghindarinya bahkan yang paling sengsara.'
  children: []
- title:
    ar: قد أفلح
    en: The Successful
    tr: Başardı
    id: Ia berhasil
  range:
  - 14
  - 19
  family: faith
  summary:
    ar: قد أفلح من تزكى وذكر اسم ربه فصلى، بل تؤثرون الحياة الدنيا والآخرة خير وأبقى، إن هذا لفي الصحف الأولى.
    en: Successful is whoever purifies himself, remembers his Lord and prays — yet you prefer this world, while the Hereafter is better and lasting, as in the former scriptures.
    tr: Kendini temizleyip Rabbinin adını hatırlayan kişi başarıya kavuşmuştur. Aksine, sen bu dünyanın ve ahiret yaşamının daha iyi ve kalıcı olmasını tercih edersin. Gerçekten bu, ilk yazılarda vardır.
    id: Siapa pun yang menyucikan dirinya dan mengingat nama Tuhan-Nya telah berhasil. Sebaliknya, kamu lebih memilih kehidupan dunia ini dan akhirat yang lebih baik dan abadi. Memang, ini tercantum dalam
      kitab suci awal.
  children: []
