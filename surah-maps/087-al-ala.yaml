surah: 87
slug: al-ala
sources_consulted:
  - "التقسيمات الموضوعية المعتمدة (standard thematic divisions, cross-checked)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "سبح اسم ربك الأعلى", en: "Glorify Your Lord the Most High" }
    range: [1, 5]
    family: faith
    summary:
      ar: "سبح اسم ربك الأعلى الذي خلق فسوى والذي قدر فهدى والذي أخرج المرعى فجعله غثاء أحوى."
      en: "Glorify the name of your Lord, the Most High, who created and proportioned, decreed and guided, brought forth pasture then made it dark stubble."
    children: []
  - title: { ar: "التيسير والتذكير", en: "Ease and Reminder" }
    range: [6, 13]
    family: faith
    summary:
      ar: "سنقرئك فلا تنسى إلا ما شاء الله، ونيسرك لليسرى فذكر إن نفعت الذكرى: سيذكر من يخشى ويتجنبها الأشقى."
      en: "We shall make you recite and you shall not forget; We shall ease you toward ease — so remind: the God-fearing will take heed, the most wretched will avoid it."
    children: []
  - title: { ar: "قد أفلح", en: "The Successful" }
    range: [14, 19]
    family: faith
    summary:
      ar: "قد أفلح من تزكى وذكر اسم ربه فصلى، بل تؤثرون الحياة الدنيا والآخرة خير وأبقى، إن هذا لفي الصحف الأولى."
      en: "Successful is whoever purifies himself, remembers his Lord and prays — yet you prefer this world, while the Hereafter is better and lasting, as in the former scriptures."
    children: []
