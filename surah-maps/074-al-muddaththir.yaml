map:
- title:
    ar: الأمر بالإنذار
    en: The Command to Warn
    tr: Arama Emri Uyarısı
    id: Peringatan Surat Perintah
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: 'نداء المدثر: قم فأنذر، وعظم ربك، وطهر ثيابك، واهجر الرجز، ولا تمنن تستكثر، واصبر لربك.'
    en: 'The call to the cloaked one: arise and warn, magnify your Lord, purify your garments, shun defilement, give not expecting more, and be patient for your Lord.'
    tr: 'El-Muddathir''in çağrısı: Kalk, uyar, Rabbini yücelt, giysilerini arındır, rajaz''ı terk et, kibirli olma ve Rabbine sabırlı ol.'
    id: 'Seruan Al-Muddathir: Bangkitlah dan peringatkanlah, mulialah Tuhanmu, sucikan pakaianmu, tinggalkan rajaz, janganlah sombong, dan bersabarlah dengan Tuhanmu.'
  children:
