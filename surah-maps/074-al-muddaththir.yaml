      ar: مقومات الدعوة
      en: The Caller's Equipment
      tr: Da'wah'ın Unsurları
      id: Elemen Da'wah
    range:
    - 2
    - 7
- title:
    ar: النفخ في الصور
    en: The Trumpet Blast
    tr: Fotoğrafları üfleme
    id: Meniup gambar
  range:
  - 8
  - 10
  family: faith
  summary:
    ar: 'مشهد الإنذار: إذا نقر في الناقور فذلك يوم عسير على الكافرين غير يسير.'
    en: 'The warning scene: when the Trumpet sounds, that will be a difficult Day, not easy for the disbelievers.'
    tr: 'Uyarı sahnesi: Bir naqour vurulursa, bu kâfirler için zor bir gün olur, kolay değil.'
    id: 'Adegan peringatan: Jika sebuah naqour dijatuhkan, itu akan menjadi hari yang sulit bagi para kafir, bukan hari yang mudah.'
  children: []
- title:
    ar: المكذب المنعم عليه
    en: The Blessed Denier
    tr: Kutsanmış yalancı
    id: Pembohong yang diberkati
  range:
  - 11
  - 31
  family: faith
  summary:
    ar: 'قصة المكذب الذي أنعم الله عليه بالمال والبنين فجحد وكذب: فكر وقدر فعبس وبسر وقال عن القرآن سحر، فكان جزاؤه سقر ذات التسعة عشر.'
    en: 'The denier whom Allah blessed with wealth and sons, yet who denied: he schemed, frowned, and called the Quran magic — so his recompense is Saqar with its nineteen keepers.'
    tr: Allah'ın zenginlik ve çocuklarla kutsandığı, ancak inkar ettiği ve yalan söylediği yalancının hikayesi; Kur'an büyüsünden bahseden düşünen, kaşlarını çatan, gizlice konuşan ve bahseden yalancı hikaye;
      ödülü ise on dokuzuncu yüzyılın yalanıydı.
    id: 'Kisah tentang pembohong yang diberkati Tuhan dengan kekayaan dan anak-anak, tetapi ia menyangkal dan berbohong: ia berpikir, memerintahkan, diam-diam berkata, dan berkata tentang sihir Al-Qur''an,
      dan ganjarannya adalah kebohongan abad kesembilan belas.'
