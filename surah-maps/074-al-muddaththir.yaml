- title:
    ar: الإعراض عن التذكرة
    en: Turning Away from the Reminder
    tr: Bilet geri çekme
    id: Penarikan tiket
  range:
  - 49
  - 56
  family: faith
  summary:
    ar: 'خاتمة السورة: فرار المكذبين من التذكرة كالحمر المستنفرة، وأن القرآن تذكرة لمن شاء، ولا يذكرون إلا أن يشاء الله.'
    en: 'The surah''s close: the deniers flee the reminder like startled donkeys, yet the Quran is a reminder for whoever wills — and none will remember except as Allah wills.'
    tr: 'Surenin Sonucu: İnkarcılar, eşekler gibi hatırlatmadan kaçarlar ve Kur''an''ın istediği herkese bir hatırlatma olduğunu, ancak Allah izin verdiğinde hatırlarlar.'
    id: 'Kesimpulan Surah: Para penyangkal melarikan diri dari pengingat seperti keledai yang dimobilisasi, dan bahwa Al-Qur''an adalah pengingat bagi siapa pun yang Dia kehendaki, dan mereka hanya mengingat
      ketika Allah menghendaki.'
  children:
  - title:
