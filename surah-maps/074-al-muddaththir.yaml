map:
  - title: { ar: "الأمر بالإنذار", en: "The Command to Warn" }
    range: [1, 7]
    family: faith
    summary:
      ar: "نداء المدثر: قم فأنذر، وعظم ربك، وطهر ثيابك، واهجر الرجز، ولا تمنن تستكثر، واصبر لربك."
      en: "The call to the cloaked one: arise and warn, magnify your Lord, purify your garments, shun defilement, give not expecting more, and be patient for your Lord."
    children:
      - { title: { ar: "مقومات الدعوة", en: "The Caller's Equipment" }, range: [2, 7] }
  - title: { ar: "النفخ في الصور", en: "The Trumpet Blast" }
    range: [8, 10]
    family: faith
    summary:
      ar: "مشهد الإنذار: إذا نقر في الناقور فذلك يوم عسير على الكافرين غير يسير."
      en: "The warning scene: when the Trumpet sounds, that will be a difficult Day, not easy for the disbelievers."
    children: []
  - title: { ar: "المكذب المنعم عليه", en: "The Blessed Denier" }
    range: [11, 31]
    family: faith
    summary:
      ar: "قصة المكذب الذي أنعم الله عليه بالمال والبنين فجحد وكذب: فكر وقدر فعبس وبسر وقال عن القرآن سحر، فكان جزاؤه سقر ذات التسعة عشر."
      en: "The denier whom Allah blessed with wealth and sons, yet who denied: he schemed, frowned, and called the Quran magic — so his recompense is Saqar with its nineteen keepers."
    children:
      - { title: { ar: "النعم والجحود", en: "Blessings and Ingratitude" }, range: [11, 17] }
      - { title: { ar: "التفكير والتقدير", en: "The Scheming" }, range: [18, 25] }
      - { title: { ar: "سأصليه سقر", en: "Cast into Saqar" }, range: [26, 29] }
      - { title: { ar: "تسعة عشر", en: "Nineteen" }, range: [30, 31] }
  - title: { ar: "سقر وأهلها", en: "Saqar and Its People" }
    range: [32, 48]
    family: faith
    summary:
      ar: "القسم بالقمر والليل والصبح أن سقر لإحدى الكبر نذيرا للبشر، وكل نفس بما كسبت رهينة، وحوار أصحاب الجنة مع المجرمين عن سبب دخولهم سقر."
      en: "An oath by the moon, the night, the dawn that Saqar is one of the greatest warnings to mankind; every soul is held for what it earned; and the dialogue of Paradise's people with the criminals on why they entered Saqar."
    children:
      - { title: { ar: "القسم بسقر", en: "The Oath on Saqar" }, range: [32, 37] }
      - { title: { ar: "كل نفس بما كسبت رهينة", en: "Every Soul Pledged for Its Earnings" }, range: [38, 40] }
      - { title: { ar: "حوار أهل النار", en: "The Dialogue of Hell's People" }, range: [41, 48] }
  - title: { ar: "الإعراض عن التذكرة", en: "Turning Away from the Reminder" }
    range: [49, 56]
    family: faith
    summary:
      ar: "خاتمة السورة: فرار المكذبين من التذكرة كالحمر المستنفرة، وأن القرآن تذكرة لمن شاء، ولا يذكرون إلا أن يشاء الله."
      en: "The surah's close: the deniers flee the reminder like startled donkeys, yet the Quran is a reminder for whoever wills — and none will remember except as Allah wills."
    children:
      - { title: { ar: "الفرار من التذكرة", en: "Fleeing the Reminder" }, range: [49, 53] }
      - { title: { ar: "التذكرة ومشيئة الله", en: "The Reminder and Allah's Will" }, range: [54, 56] }
