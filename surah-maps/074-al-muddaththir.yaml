- title:
    ar: سقر وأهلها
    en: Saqar and Its People
    tr: Saqar ve halkı
    id: Saqar dan penduduknya
  range:
  - 32
  - 48
  family: faith
  summary:
    ar: القسم بالقمر والليل والصبح أن سقر لإحدى الكبر نذيرا للبشر، وكل نفس بما كسبت رهينة، وحوار أصحاب الجنة مع المجرمين عن سبب دخولهم سقر.
    en: An oath by the moon, the night, the dawn that Saqar is one of the greatest warnings to mankind; every soul is held for what it earned; and the dialogue of Paradise's people with the criminals on
      why they entered Saqar.
    tr: Ay, gece ve sabah saatlerinde Saqar insanlığa bir uyarıdır ve her ruh kazandığı şeyle rehin alınır; Cennet sakinlerinin suçlularla geliş sebebi üzerine konuşması Saqar'dır.
    id: Pada bulan, malam, dan pagi, Saqar menjadi peringatan bagi umat manusia, dan setiap jiwa disandera oleh apa yang telah mereka peroleh, dan dialog para penghuni Surga dengan para penjahat tentang
      alasan mereka masuk adalah Saqar.
