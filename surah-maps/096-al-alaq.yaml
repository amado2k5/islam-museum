map:
- title:
    ar: أول الوحي
    en: The First Revelation
    tr: Vahiyin başlangıcı
    id: Awal dari wahyu
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'اقرأ باسم ربك الذي خلق خلق الإنسان من علق: اقرأ وربك الأكرم الذي علم بالقلم علم الإنسان ما لم يعلم.'
    en: 'Read in the name of your Lord who created — created man from a clinging clot. Read: your Lord is the Most Generous, who taught by the pen what man knew not.'
    tr: 'İnsanı bir pıhtıdan yaratan Rabbinin adıyla oku: Oku ve Rabbin en cömert olanıdır, kalemle öğreten, insana bilmediğini öğreten.'
    id: 'Bacalah atas nama Tuhanmu yang menciptakan manusia dari gumpalan: Bacalah, dan Tuhanmu adalah Yang Maha Murah Hati, yang mengajarkan dengan pena, mengajarkan manusia apa yang tidak dia ketahui.'
  children: []
- title:
    ar: طغيان المستغني
    en: The Transgression of the Self-Sufficient
    tr: Kendi kendine yetenlerin zorbalığı
    id: Tirani orang yang mandiri
  range:
  - 6
  - 14
  family: faith
  summary:
    ar: 'كلا إن الإنسان ليطغى أن رآه استغنى إن إلى ربك الرجعى: أرأيت الذي ينهى عبدا إذا صلى، ألم يعلم بأن الله يرى.'
    en: 'No indeed: man transgresses when he sees himself self-sufficient — to your Lord is the return. Have you seen who forbids a servant when he prays? Does he not know that Allah sees?'
    tr: 'Hayır, insan kendini yeter görünce günah keser. Gerçekten Rabbinize dönen vardır: Bir hizmetkârı namaz kılırken yasaklayan kişiyi gördün mü? Allah''ın gördüğünü bilmiyor muydu?'
    id: 'Tidak, manusia akan berbuat salah ketika dia melihat dirinya cukup berdiri. Sesungguhnya, bagi Tuhanmu adalah orang yang kembali: Apakah kamu melihat dia yang melarang hamba saat dia berdoa? Apakah
      dia tidak tahu bahwa Allah melihat?'
  children: []
- title:
    ar: الناصية
    en: The Forelock
    tr: Köşe
    id: Sudut
  range:
  - 15
  - 19
  family: faith
  summary:
    ar: 'كلا لئن لم ينته لنسفعا بالناصية ناصية كاذبة خاطئة: فليدع ناديه سندع الزبانية، كلا لا تطعه واسجد واقترب.'
    en: 'If he does not desist, We shall seize the lying, sinful forelock — let him call his council, We shall call the guards. Do not obey him: prostrate and draw near.'
    tr: 'Hayır, bitirmezse ona sahte ve sahte bir tokat atacağız: Çağrısını çağırsın, köleleri çağıralım, hayır, ona itaat etmeyin, secde edin ve yaklaşın.'
    id: 'Tidak, jika dia tidak selesai, kita akan menamparnya dengan pandangan palsu dan palsu: Biarlah dia memanggilnya, mari kita panggil budak-budak, tidak, jangan patuh, sujud dan dekatlah.'
  children: []
