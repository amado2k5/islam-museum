surah: 96
slug: al-alaq
sources_consulted:
  - "kuttab.com — Surah Al-'Alaq mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "أول الوحي", en: "The First Revelation" }
    range: [1, 5]
    family: faith
    summary:
      ar: "اقرأ باسم ربك الذي خلق خلق الإنسان من علق: اقرأ وربك الأكرم الذي علم بالقلم علم الإنسان ما لم يعلم."
      en: "Read in the name of your Lord who created — created man from a clinging clot. Read: your Lord is the Most Generous, who taught by the pen what man knew not."
    children: []
  - title: { ar: "طغيان المستغني", en: "The Transgression of the Self-Sufficient" }
    range: [6, 14]
    family: faith
    summary:
      ar: "كلا إن الإنسان ليطغى أن رآه استغنى إن إلى ربك الرجعى: أرأيت الذي ينهى عبدا إذا صلى، ألم يعلم بأن الله يرى."
      en: "No indeed: man transgresses when he sees himself self-sufficient — to your Lord is the return. Have you seen who forbids a servant when he prays? Does he not know that Allah sees?"
    children: []
  - title: { ar: "الناصية", en: "The Forelock" }
    range: [15, 19]
    family: faith
    summary:
      ar: "كلا لئن لم ينته لنسفعا بالناصية ناصية كاذبة خاطئة: فليدع ناديه سندع الزبانية، كلا لا تطعه واسجد واقترب."
      en: "If he does not desist, We shall seize the lying, sinful forelock — let him call his council, We shall call the guards. Do not obey him: prostrate and draw near."
    children: []
