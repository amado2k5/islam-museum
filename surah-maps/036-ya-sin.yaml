- 'islamweb.net — في ظلال القرآن: مقدمة سورة يس'
map:
- title:
    ar: القرآن الحكيم والإنذار
    en: The Wise Quran and the Warning
    tr: Bilge Kur'an ve Uyarı
    id: Al-Qur'an Bijak dan Peringatan
  range:
  - 1
  - 12
  family: faith
  summary:
    ar: يس والقرآن الحكيم؛ إنذار قوم ما أُنذر آباؤهم، وختم على قلوب المعرضين، وإحياء الموتى وإحصاء الأعمال.
    en: Ya-Sin, and the Wise Quran; warning a people whose forefathers were not warned, the heedless sealed, the dead revived and deeds recorded.
    tr: Ya-Sin ve Kutsal Kur'an; atalarını uyaran, yüz çevirenlerin kalplerini mühürleyen, ölüleri dirilten ve eylemleri sayan bir halk için bir uyarıdır.
    id: Ya-Sin, dan Al-Qur'an; peringatan bagi umat yang telah memperingatkan leluhur mereka, menyegel hati mereka yang berbalik, menghidupkan kembali orang mati, dan menghitung perbuatan.
  children: []
- title:
    ar: أصحاب القرية
    en: The People of the Town
    tr: Köy sahipleri
    id: Pemilik desa
  range:
  - 13
  - 32
  family: stories
  summary:
    ar: مثل أصحاب القرية إذ جاءها المرسلون فكذبوهم، ومجيء الرجل المؤمن من أقصى المدينة، والحسرة على العباد.
    en: The parable of the town's people when messengers came and were belied; the believing man hastening from the farthest part; anguish for the servants.
    tr: Köy halkının elçiler gelip onları reddetmesi, şehrin en uzak köşelerinden inanan bir adamın gelişi ve halk için yaşanan üzüntü gibi.
    id: Seperti orang-orang desa ketika utusan datang dan menyangkal mereka, dan kedatangan seorang orang percaya dari penjuru kota yang paling jauh, dan kesedihan bagi orang-orang.
  children:
  - title:
      ar: تكذيب المرسلين
      en: Belying the Messengers
      tr: Elçilerin İnkarı
      id: Penolakan Utusan
    range:
    - 13
    - 19
  - title:
      ar: الرجل المؤمن
      en: The Believing Man
      tr: İnanan
      id: Sang Percaya
    range:
    - 20
    - 27
  - title:
      ar: الحسرة على العباد
      en: Anguish for the Servants
      tr: Hizmetçiler için pişmanlık
      id: Penyesalan untuk para pelayan
    range:
    - 30
    - 32
- title:
    ar: آيات القدرة في الكون
    en: Signs of Power in the Universe
    tr: Evrendeki Güç Belirtileri
    id: Tanda-tanda Kekuatan di Alam Semesta
  range:
  - 33
  - 44
  family: faith
  summary:
    ar: الأرض الميتة أحييناها، والليل نسلخ منه النهار، والشمس والقمر بحسبان، والفلك المشحون — آيات للموقنين.
    en: The dead earth revived, night stripped from day, sun and moon in reckoning, the laden ship — signs for the certain.
    tr: Ölü dünyayı, gündüzü ve ayı hesaplayarak çıkardığımız geceyi, ve yüklü yıldızları — kesin olanın işaretlerini — canlandırıyoruz.
    id: Kita menghidupkan kembali bumi yang mati, malam dari mana Kita menghilangkan siang, matahari dan bulan dengan perhitungan, serta bintang-bintang yang bermuatan — tanda-tanda yang pasti.
  children:
  - title:
      ar: الأرض الميتة
      en: The Dead Earth
      tr: Ölü Dünya
      id: Bumi Mati
    range:
    - 33
    - 36
  - title:
      ar: الليل والشمس والقمر
      en: Night, Sun and Moon
      tr: Gece, güneş ve ay
      id: Malam, matahari, dan bulan
    range:
    - 37
    - 40
  - title:
      ar: الفلك المشحون
      en: The Laden Ship
      tr: Şarjlı Astronomi
      id: Astronomi Bermuatan
    range:
    - 41
    - 44
- title:
    ar: مشاهد القيامة
    en: Scenes of the Resurrection
    tr: Diriliş Sahneleri
    id: Adegan Kebangkitan
  range:
  - 45
  - 68
  family: faith
  summary:
    ar: الصيحة الواحدة تأخذهم، والنفخ في الصور، وأصحاب الجنة في شغل فاكهون، وامتاز المجرمون إلى جهنم.
    en: A single Blast seizing them, the Trumpet blown, the companions of Paradise in joyous occupation, the guilty separated off to Hell.
    tr: Tek bir çığlık onları sarar, boru çalınır, Cennet'in sakinleri meyvelerle meşguldür ve suçlular Cehenneme gider.
    id: Satu teriakan menguasai mereka, terompet ditiup, penduduk Surga sibuk dengan buah-buahan, dan para penjahat ditakdirkan ke Neraka.
  children:
  - title:
      ar: النفخة في الصور
      en: The Trumpet Blast
      tr: Fotoğraflardaki puff
      id: Puff di foto-foto
    range:
    - 51
    - 54
  - title:
      ar: أصحاب الجنة
      en: The Companions of Paradise
      tr: Paradise'ın sahipleri
      id: Para pemilik Paradise
    range:
    - 55
    - 58
  - title:
      ar: جهنم والمجرمون
      en: Hell and the Guilty
      tr: Cehennem ve Suçlular
      id: Neraka dan Para Penjahat
    range:
    - 59
    - 68
- title:
    ar: القرآن وقدرة الله
    en: The Quran; Allah's Power
    tr: Kur'an ve Allah'ın Gücü
    id: Al-Qur'an dan Kuasa Allah
  range:
  - 69
  - 83
  family: faith
  summary:
    ar: وما علمناه الشعر وما ينبغي له؛ أولم ير الإنسان أنا خلقناه من نطفة، والذي جعل لكم من الشجر الأخضر نارا.
    en: We did not teach him poetry, nor does it befit him; has man not seen We created him from a drop — He who made fire from green trees.
    tr: Ve şiire öğrettiklerimizi ve onun ne yapması gerektiğini insan görmedi mi ki Onu bir damla sıvıdan yarattık ve sana yeşil ağaçtan bir ateş yaptı?
    id: Dan apa yang telah kami ajarkan pada puisi dan apa yang seharusnya dilakukannya; bukankah manusia melihat bahwa Kami menciptakannya dari setetes cairan, dan Dia menciptakan api untukmu dari pohon
      hijau?
  children:
  - title:
      ar: القرآن ليس شعرا
      en: The Quran Is Not Poetry
      tr: Kur'an şiir değildir
      id: Al-Qur'an bukanlah puisi
    range:
    - 69
    - 70
  - title:
      ar: خلق الإنسان من نطفة
      en: Man Created from a Drop
      tr: İnsanı bir damla sıvıdan yarattı
      id: Dia menciptakan manusia dari setetes cairan
    range:
    - 77
    - 83
