surah: 36
slug: ya-sin
sources_consulted:
  - "kuttab.com — الخريطة الذهنية لسورة يس (1-12، 13-32، 33-44، 45-68، 69-83)"
  - "islamweb.net — في ظلال القرآن: مقدمة سورة يس"
map:
  - title: { ar: "القرآن الحكيم والإنذار", en: "The Wise Quran and the Warning" }
    range: [1, 12]
    family: faith
    summary:
      ar: "يس والقرآن الحكيم؛ إنذار قوم ما أُنذر آباؤهم، وختم على قلوب المعرضين، وإحياء الموتى وإحصاء الأعمال."
      en: "Ya-Sin, and the Wise Quran; warning a people whose forefathers were not warned, the heedless sealed, the dead revived and deeds recorded."
    children: []
  - title: { ar: "أصحاب القرية", en: "The People of the Town" }
    range: [13, 32]
    family: stories
    summary:
      ar: "مثل أصحاب القرية إذ جاءها المرسلون فكذبوهم، ومجيء الرجل المؤمن من أقصى المدينة، والحسرة على العباد."
      en: "The parable of the town's people when messengers came and were belied; the believing man hastening from the farthest part; anguish for the servants."
    children:
      - { title: { ar: "تكذيب المرسلين", en: "Belying the Messengers" }, range: [13, 19] }
      - { title: { ar: "الرجل المؤمن", en: "The Believing Man" }, range: [20, 27] }
      - { title: { ar: "الحسرة على العباد", en: "Anguish for the Servants" }, range: [30, 32] }
  - title: { ar: "آيات القدرة في الكون", en: "Signs of Power in the Universe" }
    range: [33, 44]
    family: faith
    summary:
      ar: "الأرض الميتة أحييناها، والليل نسلخ منه النهار، والشمس والقمر بحسبان، والفلك المشحون — آيات للموقنين."
      en: "The dead earth revived, night stripped from day, sun and moon in reckoning, the laden ship — signs for the certain."
    children:
      - { title: { ar: "الأرض الميتة", en: "The Dead Earth" }, range: [33, 36] }
      - { title: { ar: "الليل والشمس والقمر", en: "Night, Sun and Moon" }, range: [37, 40] }
      - { title: { ar: "الفلك المشحون", en: "The Laden Ship" }, range: [41, 44] }
  - title: { ar: "مشاهد القيامة", en: "Scenes of the Resurrection" }
    range: [45, 68]
    family: faith
    summary:
      ar: "الصيحة الواحدة تأخذهم، والنفخ في الصور، وأصحاب الجنة في شغل فاكهون، وامتاز المجرمون إلى جهنم."
      en: "A single Blast seizing them, the Trumpet blown, the companions of Paradise in joyous occupation, the guilty separated off to Hell."
    children:
      - { title: { ar: "النفخة في الصور", en: "The Trumpet Blast" }, range: [51, 54] }
      - { title: { ar: "أصحاب الجنة", en: "The Companions of Paradise" }, range: [55, 58] }
      - { title: { ar: "جهنم والمجرمون", en: "Hell and the Guilty" }, range: [59, 68] }
  - title: { ar: "القرآن وقدرة الله", en: "The Quran; Allah's Power" }
    range: [69, 83]
    family: faith
    summary:
      ar: "وما علمناه الشعر وما ينبغي له؛ أولم ير الإنسان أنا خلقناه من نطفة، والذي جعل لكم من الشجر الأخضر نارا."
      en: "We did not teach him poetry, nor does it befit him; has man not seen We created him from a drop — He who made fire from green trees."
    children:
      - { title: { ar: "القرآن ليس شعرا", en: "The Quran Is Not Poetry" }, range: [69, 70] }
      - { title: { ar: "خلق الإنسان من نطفة", en: "Man Created from a Drop" }, range: [77, 83] }
