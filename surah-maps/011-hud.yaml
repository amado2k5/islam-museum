- title:
    ar: شعيب والثبات على الأمر
    en: Shuayb and Standing Firm
    tr: Şuaib ve konudaki kararlılık
    id: Shuaib dan keteguhan dalam hal ini
  range:
  - 84
  - 123
  family: stories
  summary:
    ar: 'قصة شعيب مع قومه، ثم أنباء القرى عبرة، والخاتمة: الثبات على ما أمر الله به والتوكل عليه.'
    en: 'Shuayb and his people, the towns'' news as a lesson, and the close: stand firm as commanded, trust in Allah.'
    tr: 'Şuayb''ın ve onun kaminin hikayesi, ardından köylerin haberleri ders olarak ve sonuç: Allah''ın emrettiği şeylerde kararlılık ve O''na güvenmek.'
    id: 'Kisah Shu''ayb bersama rakyatnya, lalu berita desa-desa sebagai pelajaran, dan kesimpulannya: keteguhan pada apa yang Allah perintahkan dan ketergantungan kepada-Nya.'
  children:
