  - 49
  family: stories
  summary:
    ar: دعوة نوح الطويلة، وبناء السفينة، والطوفان، ونجاة المؤمنين، وحوار نوح في شأن ابنه.
    en: Noah's long call, the ark, the flood, the believers saved, and Noah's plea concerning his son.
    tr: Nuh'un uzun duası, gemiyi inşa etmesi, tufan, inananların kurtuluşu ve Nuh'un oğluyla ilgili diyalogu.
    id: Doa panjang Nuh, membangun bahtera, banjir, keselamatan orang percaya, dan dialog Nuh tentang putranya.
