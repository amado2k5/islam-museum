- title:
    ar: هود وصالح وإبراهيم ولوط
    en: Hud, Salih, Abraham and Lot
    tr: Hud, Saleh, İbrahim ve Lot
    id: Hud, Saleh, Ibrahim, dan Lot
  range:
  - 50
  - 83
  family: stories
  summary:
    ar: 'أربع قصص متتابعة: عاد مع هود، وثمود والناقة مع صالح، وضيف إبراهيم، وقوم لوط.'
    en: 'Four successive stories: Ad with Hud, Thamud and the she-camel with Salih, Abraham''s guests, Lot''s people.'
    tr: 'Dört ardışık hikaye: ''O, Hud, Semud ve dişi deveyle birlikte Salih (İbrahim''in misafiri ve Lut''un halkı ile) geri döndü.'
    id: 'Empat cerita berturut-turut: ''Ia kembali bersama Hud, Thamud, dan unta betina bersama Salih, tamu Abraham, dan umat Lot.'
  children:
