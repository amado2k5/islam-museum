surah: 11
slug: hud
sources_consulted:
  - "kuttab.com — Surah Hud mind map (4 blocks: 1-24, 25-49, 50-83, 84-123)"
  - "islamicstudies.info — ruku divisions of Surah Hud (cross-checked)"
map:
  - title: { ar: "الكتاب المحكم والدعوة إلى التوبة", en: "The Perfected Book and the Call to Repentance" }
    range: [1, 24]
    family: faith
    summary:
      ar: "الكتاب أُحكمت آياته ثم فُصلت، والدعوة إلى عبادة الله وحده والاستغفار والتوبة، وتحدي المشركين بعشر سور."
      en: "A Book perfected then explained; the call to worship Allah alone, seek forgiveness, repent; the ten-surah challenge."
    children:
      - { title: { ar: "تحدي العشر سور", en: "The Ten-Surah Challenge" }, range: [13, 14] }
  - title: { ar: "قصة نوح", en: "The Story of Noah" }
    range: [25, 49]
    family: stories
    summary:
      ar: "دعوة نوح الطويلة، وبناء السفينة، والطوفان، ونجاة المؤمنين، وحوار نوح في شأن ابنه."
      en: "Noah's long call, the ark, the flood, the believers saved, and Noah's plea concerning his son."
    children:
      - { title: { ar: "الطوفان", en: "The Flood" }, range: [40, 41] }
      - { title: { ar: "ابن نوح", en: "Noah's Son" }, range: [42, 46] }
  - title: { ar: "هود وصالح وإبراهيم ولوط", en: "Hud, Salih, Abraham and Lot" }
    range: [50, 83]
    family: stories
    summary:
      ar: "أربع قصص متتابعة: عاد مع هود، وثمود والناقة مع صالح، وضيف إبراهيم، وقوم لوط."
      en: "Four successive stories: Ad with Hud, Thamud and the she-camel with Salih, Abraham's guests, Lot's people."
    children:
      - { title: { ar: "عاد", en: "Ad" }, range: [50, 60] }
      - { title: { ar: "ثمود والناقة", en: "Thamud and the She-Camel" }, range: [61, 68] }
      - { title: { ar: "ضيف إبراهيم", en: "Abraham's Guests" }, range: [69, 76] }
      - { title: { ar: "قوم لوط", en: "The People of Lot" }, range: [77, 83] }
  - title: { ar: "شعيب والثبات على الأمر", en: "Shuayb and Standing Firm" }
    range: [84, 123]
    family: stories
    summary:
      ar: "قصة شعيب مع قومه، ثم أنباء القرى عبرة، والخاتمة: الثبات على ما أمر الله به والتوكل عليه."
      en: "Shuayb and his people, the towns' news as a lesson, and the close: stand firm as commanded, trust in Allah."
    children:
      - { title: { ar: "قصة شعيب", en: "The Story of Shuayb" }, range: [84, 95] }
      - { title: { ar: "موسى وفرعون", en: "Moses and Pharaoh" }, range: [96, 99] }
      - { title: { ar: "فاستقم كما أمرت", en: "Stand Firm as Commanded" }, range: [112, 113] }
