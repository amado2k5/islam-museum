map:
- title:
    ar: الكتاب المحكم والدعوة إلى التوبة
    en: The Perfected Book and the Call to Repentance
    tr: Mükemmel Kitap ve Tövbe Çağrısı
    id: Kitab Sempurna dan Seruan untuk Pertobatan
  range:
  - 1
  - 24
  family: faith
  summary:
    ar: الكتاب أُحكمت آياته ثم فُصلت، والدعوة إلى عبادة الله وحده والاستغفار والتوبة، وتحدي المشركين بعشر سور.
    en: A Book perfected then explained; the call to worship Allah alone, seek forgiveness, repent; the ten-surah challenge.
    tr: Kitap açıklanmış ve ardından ayrıntılı olarak sunulmuş, yalnızca Allah'a ibadet etmeye, af ve tövbe dilemeye ve on sureyle müşriklere meydan okumaya çalışmıştır.
    id: Kitab ini telah diperjelas dan kemudian dirinci, menyerukan untuk hanya beribadah kepada Allah, memohon pengampunan dan pertobatan, serta menantang para musyrik dengan sepuluh surah.
  children:
