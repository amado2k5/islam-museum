map:
- title:
    ar: القسم بالمرسلات
    en: The Oath by the Emissaries
    tr: Sevkiyatlar Departmanı
    id: Departemen Pengiriman
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: 'خمسة أقسام بالرياح والملائكة على أن ما توعدون لواقع؛ ويتكرر في السورة عشر مرات: ويل يومئذ للمكذبين.'
    en: Five oaths by the winds and angels that what you are promised will come to pass; the refrain 'woe that Day to the deniers' sounds ten times through the surah.
    tr: 'Rüzgarlar ve melekler tarafından beş kategori, çünkü vaat ettiğiniz şey gerçektir; ve bu surede on kez tekrarlanır: O gün inkarcılara vay.'
    id: 'Lima kategori oleh angin dan malaikat, karena apa yang kau janjikan adalah kenyataan; dan itu diulang sepuluh kali dalam surat: Celakalah hari itu bagi para penyangkal.'
  children: []
- title:
    ar: أهوال يوم الفصل
    en: Terrors of the Day of Separation
    tr: Dönemin gününün dehşetleri
    id: Kengerian hari semester
  range:
  - 8
  - 15
  family: faith
  summary:
    ar: 'النجوم تطمس والسماء تفرج والجبال تنسف، والرسل توقت لأي يوم أجلت: ليوم الفصل.'
    en: Stars dimmed, the sky split, mountains scattered — the messengers appointed to the Day of Separation.
    tr: 'Yıldızlar bulanıklaşıyor, gökyüzü serbest kalıyor, dağlar havaya uçuyor, haberciler ertelenen herhangi bir günü arzuluyor: ayrılık günü.'
    id: 'Bintang-bintang menjadi kabur, langit dilepaskan, dan gunung-gunung diledakkan, dan para utusan merindukan setiap hari yang ditunda: hari pemisahan.'
  children: []
- title:
    ar: ألم نهلك الأولين
    en: Did We Not Destroy the Ancients
    tr: İlk ikisini yok etmedik mi?
    id: Bukankah kita sudah mati dua yang pertama?
  range:
  - 16
  - 28
  family: faith
  summary:
    ar: 'سلسلة استفهامات: إهلاك الأولين، وخلق الإنسان من ماء مهين، وجعل الأرض كفاتا والجبال رواسي والماء فراتا.'
    en: 'A series of questions: the destroyed ancients, man''s creation from a despised fluid, the earth a container, firm mountains and sweet water.'
    tr: 'Bir dizi soru: Kadimlerin yok edilmesi, insanın bozulan sudan yaratılması, yeryüzünün yeterli olması, dağların dağlar ve suyun dere olarak yaratılması.'
    id: 'Serangkaian pertanyaan: Kehancuran para leluhur, penciptaan manusia dari air yang merusak, dan bumi sebagai cukup, gunung-gunung sebagai gunung, dan air sebagai Aliran.'
  children: []
- title:
    ar: انطلقوا إلى ما كذبتم به
    en: Proceed to What You Denied
    tr: Yalan söylediğin şeye git
    id: Lanjutkan ke apa yang kamu bohongi
  range:
  - 29
  - 40
  family: faith
  summary:
    ar: 'مشهد جهنم: ظل ذي ثلاث شعب لا ظليل ولا يغني من اللهب، ويوم لا ينطقون ولا يؤذن لهم فيعتذرون.'
    en: 'Hell''s scene: a shade of three columns giving no shelter from the flame; a day they cannot speak nor be permitted to excuse themselves.'
    tr: 'Cehennem sahnesi: üç kişinin gölgesi, ne alevin gölgesinde ne de şarkı söyleniyor, ve o gün ne konuşuyorlar, ne dua ediliyorlar ve affedilirler.'
    id: 'Adegan Neraka: bayangan tiga orang, tidak tertutup atau dinyanyikan oleh api, dan pada hari itu mereka tidak berbicara atau dipanggil untuk berdoa, dan mereka dimaafkan.'
  children: []
- title:
    ar: جزاء المتقين والخاتمة
    en: The Godfearing and the Conclusion
    tr: Tanrı Korkusunun Ödülü ve Sonuç
    id: Ganjaran dari Orang yang Takut Tuhan dan Kesimpulan
  range:
  - 41
  - 50
  family: faith
  summary:
    ar: 'إن المتقين في ظلال وعيون وفواكه مما يشتهون، ثم الوعيد الأخير: كلوا وتمتعوا قليلا، فبأي حديث بعده يؤمنون.'
    en: The Godfearing amid shades, springs and fruits; then the final warning — 'in what statement after this will they believe?'
    tr: 'Gerçekten de, doğru olanlar istediklerinin gölgesinde, pınarlarında ve meyvelerindedir. Sonra son uyarı: Biraz yiyin ve tadını çıkarın, çünkü ondan sonra hangi hadise inanacaklar?'
    id: 'Memang, orang benar berada dalam naungan, mata air, dan buah dari apa yang mereka inginkan. Lalu peringatan terakhir: Makanlah dan nikmati sedikit, karena hadits mana setelahnya mereka akan percaya?'
  children: []
