surah: 77
slug: al-mursalat
sources_consulted:
  - "kuttab.com — Surah Al-Mursalat mind map (thematic block divisions)"
  - "في ظلال القرآن — Sayyid Qutb (thematic surah introductions)"
map:
  - title: { ar: "القسم بالمرسلات", en: "The Oath by the Emissaries" }
    range: [1, 7]
    family: faith
    summary:
      ar: "خمسة أقسام بالرياح والملائكة على أن ما توعدون لواقع؛ ويتكرر في السورة عشر مرات: ويل يومئذ للمكذبين."
      en: "Five oaths by the winds and angels that what you are promised will come to pass; the refrain 'woe that Day to the deniers' sounds ten times through the surah."
    children: []
  - title: { ar: "أهوال يوم الفصل", en: "Terrors of the Day of Separation" }
    range: [8, 15]
    family: faith
    summary:
      ar: "النجوم تطمس والسماء تفرج والجبال تنسف، والرسل توقت لأي يوم أجلت: ليوم الفصل."
      en: "Stars dimmed, the sky split, mountains scattered — the messengers appointed to the Day of Separation."
    children: []
  - title: { ar: "ألم نهلك الأولين", en: "Did We Not Destroy the Ancients" }
    range: [16, 28]
    family: faith
    summary:
      ar: "سلسلة استفهامات: إهلاك الأولين، وخلق الإنسان من ماء مهين، وجعل الأرض كفاتا والجبال رواسي والماء فراتا."
      en: "A series of questions: the destroyed ancients, man's creation from a despised fluid, the earth a container, firm mountains and sweet water."
    children: []
  - title: { ar: "انطلقوا إلى ما كذبتم به", en: "Proceed to What You Denied" }
    range: [29, 40]
    family: faith
    summary:
      ar: "مشهد جهنم: ظل ذي ثلاث شعب لا ظليل ولا يغني من اللهب، ويوم لا ينطقون ولا يؤذن لهم فيعتذرون."
      en: "Hell's scene: a shade of three columns giving no shelter from the flame; a day they cannot speak nor be permitted to excuse themselves."
    children: []
  - title: { ar: "جزاء المتقين والخاتمة", en: "The Godfearing and the Conclusion" }
    range: [41, 50]
    family: faith
    summary:
      ar: "إن المتقين في ظلال وعيون وفواكه مما يشتهون، ثم الوعيد الأخير: كلوا وتمتعوا قليلا، فبأي حديث بعده يؤمنون."
      en: "The Godfearing amid shades, springs and fruits; then the final warning — 'in what statement after this will they believe?'"
    children: []
