- title:
    ar: الضيوف والقرى المهلكة
    en: The Guests and the Destroyed Towns
    tr: Misafirler ve Yıkılan Köyler
    id: Tamu dan Desa yang Hancur
  range:
  - 51
  - 84
  family: stories
  summary:
    ar: ضيف إبراهيم وبشارته، وقوم لوط في الصباح، وأصحاب الأيكة، وأصحاب الحجر الذين نحتوا البيوت.
    en: Abraham's guests and his glad tidings, Lot's people at dawn, the Thicket's folk, Al-Hijr's house-carvers.
    tr: İbrahim'in misafiri ve onun müjdesi, sabah Lut halkı, kuyu halkı ve evleri oyan taş adamları.
    id: Tamu Abraham dan kabar bahagianya, orang-orang Lot di pagi hari, orang-orang sumur dan orang-orang batu yang mengukir rumah-rumah.
