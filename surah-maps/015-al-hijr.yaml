- title:
    ar: 'الخاتمة: الثبات والعبادة'
    en: 'The Closing: Firmness and Worship'
    tr: 'Sonuç: Kararlılık ve Tapınma'
    id: 'Kesimpulan: Keteguhan dan Pemujaan'
  range:
  - 85
  - 99
  family: faith
  summary:
    ar: السبع المثاني والقرآن العظيم، وخفض الجناح للمؤمنين، واعبد ربك حتى يأتيك اليقين.
    en: The seven oft-repeated and the great Quran; lower the wing to believers; worship your Lord till certainty comes.
    tr: Yedi sıkça tekrarlanan ayet ve büyük Kur'an, kanadı indir ve inananlar için kanadı indir, kesinlik gelene kadar Rabbine ibadet et.
    id: Tujuh ayat yang sering diulang dan Al-Qur'an agung, dan turunkan sayap untuk orang beriman, dan sembahlah Tuhanmu sampai kepastian datang kepadamu.
