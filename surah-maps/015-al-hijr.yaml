surah: 15
slug: al-hijr
sources_consulted:
  - "kuttab.com — Surah Al-Hijr mind map (4 blocks: 1-25, 26-50, 51-84, 85-99)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "حفظ الذكر ودلائل القدرة", en: "Preserving the Reminder and Signs of Power" }
    range: [1, 25]
    family: faith
    summary:
      ar: "تكفل الله بحفظ الذكر، وآياته في البروج والرياح اللواقح وخزائن كل شيء بمقدار."
      en: "Allah's guarantee to preserve the Reminder; His signs in constellations, fertilizing winds, measured treasuries."
    children:
      - { title: { ar: "حفظ الذكر", en: "The Reminder Preserved" }, range: [9, 9] }
  - title: { ar: "خلق الإنسان وإبليس", en: "Man's Creation and Iblis" }
    range: [26, 50]
    family: stories
    summary:
      ar: "خلق الإنسان من صلصال، وأمر الملائكة بالسجود، وإباء إبليس، وإنظاره، وبشارة العباد بالمغفرة."
      en: "Man from sounding clay, the angels ordered to prostrate, Iblis's refusal, his respite, servants given glad tidings."
    children:
      - { title: { ar: "إباء إبليس", en: "Iblis Refuses" }, range: [31, 35] }
      - { title: { ar: "نبئ عبادي", en: "Inform My Servants" }, range: [49, 50] }
  - title: { ar: "الضيوف والقرى المهلكة", en: "The Guests and the Destroyed Towns" }
    range: [51, 84]
    family: stories
    summary:
      ar: "ضيف إبراهيم وبشارته، وقوم لوط في الصباح، وأصحاب الأيكة، وأصحاب الحجر الذين نحتوا البيوت."
      en: "Abraham's guests and his glad tidings, Lot's people at dawn, the Thicket's folk, Al-Hijr's house-carvers."
    children:
      - { title: { ar: "بشارة إبراهيم", en: "Abraham's Glad Tidings" }, range: [51, 56] }
      - { title: { ar: "قوم لوط", en: "The People of Lot" }, range: [61, 77] }
      - { title: { ar: "أصحاب الحجر", en: "The Dwellers of Al-Hijr" }, range: [80, 84] }
  - title: { ar: "الخاتمة: الثبات والعبادة", en: "The Closing: Firmness and Worship" }
    range: [85, 99]
    family: faith
    summary:
      ar: "السبع المثاني والقرآن العظيم، وخفض الجناح للمؤمنين، واعبد ربك حتى يأتيك اليقين."
      en: "The seven oft-repeated and the great Quran; lower the wing to believers; worship your Lord till certainty comes."
    children:
      - { title: { ar: "السبع المثاني", en: "The Seven Oft-Repeated" }, range: [87, 87] }
