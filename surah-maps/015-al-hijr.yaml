map:
- title:
    ar: حفظ الذكر ودلائل القدرة
    en: Preserving the Reminder and Signs of Power
    tr: Yetenek Anılarını ve İşaretlerini Ezberlemek
    id: Menghafal Kenangan dan Tanda-tanda Kemampuan
  range:
  - 1
  - 25
  family: faith
  summary:
    ar: تكفل الله بحفظ الذكر، وآياته في البروج والرياح اللواقح وخزائن كل شيء بمقدار.
    en: Allah's guarantee to preserve the Reminder; His signs in constellations, fertilizing winds, measured treasuries.
    tr: Tanrı, anıyı korumaktan, burçlardaki burçlardaki işaretlerini ve tozlayıcı rüzgarları ve her şeyin hazinelerini ölçüde korumakla sorumludur.
    id: Allah bertanggung jawab untuk melestarikan ingatan, dan tanda-tanda-tanda-Nya dalam zodiak dan angin penyerbuk, serta harta segala sesuatu yang terukur.
  children:
