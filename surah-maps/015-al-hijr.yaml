- title:
    ar: خلق الإنسان وإبليس
    en: Man's Creation and Iblis
    tr: İnsan ve Şeytan'ın yaratılışı
    id: Penciptaan manusia dan Setan
  range:
  - 26
  - 50
  family: stories
  summary:
    ar: خلق الإنسان من صلصال، وأمر الملائكة بالسجود، وإباء إبليس، وإنظاره، وبشارة العباد بالمغفرة.
    en: Man from sounding clay, the angels ordered to prostrate, Iblis's refusal, his respite, servants given glad tidings.
    tr: İnsanı kilden yarattı, meleklere secde etmelerini emretti, İblis Tanrı'yı onurlandırdı ve ona baktı, hizmetkârlara bağışlama müjdesini verdi.
    id: Ia menciptakan manusia dari tanah liat, memerintahkan malaikat untuk sujud, menghormati Iblis dan memandangnya, serta menyampaikan kabar baik pengampunan kepada para hamba.
