- title:
    ar: عاقبة القرى العاتية
    en: The Fate of the Defiant Towns
    tr: Güçlü köylerin kaderi
    id: Nasib desa-desa perkasa
  range:
  - 8
  - 10
  family: faith
  summary:
    ar: تحذير المعاندين بمصير القرى التي عتت عن أمر ربها ورسله فحاسبها الله حسابا شديدا وعذبها عذابا نكرا، فذاقت وبال أمرها.
    en: A warning to the defiant through the fate of the towns that rebelled against their Lord's command and His messengers — Allah reckoned them severely and punished them harshly, so they tasted the
      evil consequence of their conduct.
    tr: Tanrı, Rabbilerinin ve elçilerinin emrini dinlemeyenlerin akıbeti hakkında isyancıları, onları ağır şekilde hesap vermeye zorladı ve korkunç bir ceza verdi, böylece işlerinin gazabını tattılar.
    id: Dengan memperingatkan para pemberontak tentang nasib desa-desa yang membangkang perintah Tuhan dan utusan-Nya, sehingga Tuhan menuntut pertanggungjawaban mereka dengan keras dan menghukum mereka
      dengan hukuman yang mengerikan, sehingga mereka merasakan murka dalam urusan mereka.
  children: []
- title:
    ar: الذكر المنزل والقدرة الإلهية
    en: The Sent-down Reminder and Divine Power
    tr: Erkek Evi ve İlahi Güç
    id: Rumah Laki-laki dan Kekuatan Ilahi
  range:
  - 11
  - 12
  family: faith
  summary:
    ar: 'ختام السورة: قد أنزل الله إليكم ذكرا ورسولا يتلو الآيات ليخرج المؤمنين من الظلمات إلى النور، والتذكير بقدرة الله الذي خلق سبع سماوات ومن الأرض مثلهن وأحاط بكل شيء علما.'
    en: 'The surah''s closing: Allah has sent down to you a Reminder and a Messenger reciting the verses to bring the believers from darkness to light, and a reminder of Allah''s power — Creator of seven
      heavens and their earthly counterparts, encompassing all things in knowledge.'
    tr: 'Surenin Sonu: Allah size bir hatırlatma ve ayetleri okuyarak müminleri karanlıktan ışığa çıkaran ve yedi gökyüzü ve yeryüzünü onlara benzeyen ve her şeyi bilgiyle kapsayan Allah''ın gücünü hatırlatmak
      için bir Vahiy indirmiştir.'
    id: 'Akhir Surah: Allah telah menurunkan peringatan dan Rasulullah kepada Anda yang membacakan ayat-ayat untuk membawa orang beriman keluar dari kegelapan ke dalam terang, dan mengingatkan akan kuasa
      Allah, yang menciptakan tujuh langit dan bumi seperti itu dan mencakup segala sesuatu dalam ilmu pengetahuan.'
  children: []
