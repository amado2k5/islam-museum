map:
- title:
    ar: أحكام الطلاق والعدة والنفقة
    en: The Rulings of Divorce, Waiting Period, and Maintenance
    tr: Boşanma, bekleme süresi ve nafaka ile ilgili kararlar
    id: Putusan perceraian, masa tunggu, dan tunjangan
  range:
  - 1
  - 7
  family: law
  summary:
    ar: 'منظومة أحكام الطلاق: الطلاق لعدتهن وعدم إخراج المطلقات من بيوتهن، والرجعة أو الفراق بالمعروف مع الإشهاد، ومدد العدد، والسكنى والنفقة بحسب القدرة — تتخللها وعود التقوى بالمخرج والرزق والتيسير.'
    en: 'The system of divorce rulings: divorcing at the appointed time and not expelling divorced women from their homes, reunion or separation with kindness and witnesses, the waiting periods, housing
      and maintenance according to means — interwoven with promises that God-consciousness brings a way out, provision, and ease.'
    tr: 'Boşanma kararları sistemi: bekleme süresi nedeniyle boşanma ve boşanmış kadınların evlerinden alınmaması, iyi niyetle uzlaşma veya tanıklıkla ayrılma, sayının süresi, barınma ve yeteneğe göre bakım
      — aralara bir çıkış yolu, sağlamlık ve kolaylık vaatleri verilir.'
    id: 'Sistem putusan perceraian: perceraian karena masa tunggu dan tidak membawa wanita yang bercerai keluar dari rumah mereka, rekonsiliasi atau pemisahan dengan itikad baik dengan saksi, durasi jumlah,
      tempat tinggal dan pemeliharaan sesuai kemampuan — diselingi janji kesalehan melalui jalan keluar, penyediaan, dan kemudahan.'
