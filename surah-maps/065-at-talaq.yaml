map:
  - title: { ar: "أحكام الطلاق والعدة والنفقة", en: "The Rulings of Divorce, Waiting Period, and Maintenance" }
    range: [1, 7]
    family: law
    summary:
      ar: "منظومة أحكام الطلاق: الطلاق لعدتهن وعدم إخراج المطلقات من بيوتهن، والرجعة أو الفراق بالمعروف مع الإشهاد، ومدد العدد، والسكنى والنفقة بحسب القدرة — تتخللها وعود التقوى بالمخرج والرزق والتيسير."
      en: "The system of divorce rulings: divorcing at the appointed time and not expelling divorced women from their homes, reunion or separation with kindness and witnesses, the waiting periods, housing and maintenance according to means — interwoven with promises that God-consciousness brings a way out, provision, and ease."
    children:
      - { title: { ar: "الطلاق للعدة وعدم الإخراج", en: "Divorce at the Appointed Time, No Expulsion" }, range: [1, 2] }
      - { title: { ar: "جزاء التقوى: المخرج والرزق", en: "The Fruit of Taqwa: A Way Out and Provision" }, range: [3, 3] }
      - { title: { ar: "مدد العدد", en: "The Waiting Periods" }, range: [4, 5] }
      - { title: { ar: "السكنى والنفقة", en: "Housing and Maintenance" }, range: [6, 7] }
  - title: { ar: "عاقبة القرى العاتية", en: "The Fate of the Defiant Towns" }
    range: [8, 10]
    family: faith
    summary:
      ar: "تحذير المعاندين بمصير القرى التي عتت عن أمر ربها ورسله فحاسبها الله حسابا شديدا وعذبها عذابا نكرا، فذاقت وبال أمرها."
      en: "A warning to the defiant through the fate of the towns that rebelled against their Lord's command and His messengers — Allah reckoned them severely and punished them harshly, so they tasted the evil consequence of their conduct."
    children: []
  - title: { ar: "الذكر المنزل والقدرة الإلهية", en: "The Sent-down Reminder and Divine Power" }
    range: [11, 12]
    family: faith
    summary:
      ar: "ختام السورة: قد أنزل الله إليكم ذكرا ورسولا يتلو الآيات ليخرج المؤمنين من الظلمات إلى النور، والتذكير بقدرة الله الذي خلق سبع سماوات ومن الأرض مثلهن وأحاط بكل شيء علما."
      en: "The surah's closing: Allah has sent down to you a Reminder and a Messenger reciting the verses to bring the believers from darkness to light, and a reminder of Allah's power — Creator of seven heavens and their earthly counterparts, encompassing all things in knowledge."
    children: []
