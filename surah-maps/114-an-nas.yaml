map:
- title:
    ar: ثلاث صفات
    en: Three Attributes
    tr: Üç nitelik
    id: Tiga kualitas
  range:
  - 1
  - 3
  family: faith
  summary:
    ar: 'قل أعوذ برب الناس ملك الناس إله الناس: التوسل إلى الله بثلاث من صفاته قبل ذكر المخوف منه.'
    en: 'Say: I seek refuge with the Lord of mankind, the King of mankind, the God of mankind — approaching Allah through three attributes before naming what is feared.'
    tr: De ki, 'İnsanlığın Rab'bine, insanlığın Egemenine, İnsanlığın Tanrısına sığınıyorum.' Korkulan şeyden bahsetmeden önce Allah'a üç sıfatıyla aracılık diledim.
    id: Katakanlah, 'Aku mencari perlindungan kepada Tuhan umat manusia, Yang Maha Kuasa umat manusia, Allah umat manusia.' Mohon perantaraan kepada Allah dengan tiga sifat-Nya sebelum menyebutkan apa yang
      ditakuti dari-Nya.
  children: []
- title:
    ar: الوسواس الخناس
    en: The Retreating Whisperer
    tr: takıntılı kişi
    id: Orang yang Obsesif
  range:
  - 4
  - 6
  family: faith
  summary:
    ar: من شر الوسواس الخناس الذي يوسوس في صدور الناس من الجنة والناس.
    en: From the evil of the retreating whisperer who whispers into the breasts of people — from among the jinn and mankind.
    tr: Fısıldayanın kötülüğünden, cennetten gelen ve insanlar arasında insanların kalplerine fısıldayan spor ayakkabıdan.
    id: Dari kejahatan sang whisperer, si sneaker yang berbisik di hati orang-orang dari Surga dan di antara manusia.
  children: []
