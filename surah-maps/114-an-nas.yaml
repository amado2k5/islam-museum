map:
  - title: { ar: "ثلاث صفات", en: "Three Attributes" }
    range: [1, 3]
    family: faith
    summary:
      ar: "قل أعوذ برب الناس ملك الناس إله الناس: التوسل إلى الله بثلاث من صفاته قبل ذكر المخوف منه."
      en: "Say: I seek refuge with the Lord of mankind, the King of mankind, the God of mankind — approaching Allah through three attributes before naming what is feared."
    children: []
  - title: { ar: "الوسواس الخناس", en: "The Retreating Whisperer" }
    range: [4, 6]
    family: faith
    summary:
      ar: "من شر الوسواس الخناس الذي يوسوس في صدور الناس من الجنة والناس."
      en: "From the evil of the retreating whisperer who whispers into the breasts of people — from among the jinn and mankind."
