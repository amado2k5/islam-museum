- title:
    ar: 'نوران: التوراة والقرآن'
    en: 'Two Lights: Torah and Quran'
    tr: 'Nuran: Tevrat ve Kur''an'
    id: 'Nouran: Taurat dan Al-Qur''an'
  range:
  - 43
  - 56
  family: faith
  summary:
    ar: الكتاب الذي أوتي موسى هدى ورحمة، وموقف المشركين من القرآن، والذين آمنوا بالكتابين.
    en: The Book given to Moses as guidance and mercy; the polytheists' stance toward the Quran; believers in both.
    tr: Musa'ya rehberlik ve merhamet olarak verilen kitap, Kur'an'a ve iki kutsal metne inananların tutumuna dair tutum.
    id: Kitab yang diberikan kepada Musa sebagai petunjuk dan belas kasihan, serta sikap para musyrik terhadap Al-Qur'an, dan mereka yang percaya pada dua Kitab Suci.
  children: []
- title:
    ar: قارون والخاتمة
    en: Qarun and the Closing
    tr: Qarun ve Sonuç
    id: Qarun dan Kesimpulan
  range:
  - 57
  - 88
  family: stories
  summary:
    ar: قارون وكنوزه وخسف الله به، وأن الدار الآخرة للذين لا يريدون علوا ولا فسادا، وخاتمة السورة.
    en: Qarun and his treasures swallowed by the earth; the Last Home for the humble; the surah's closing.
    tr: Qarun ve hazineleri, Allah onu yutturur, ve ahiret, yükselme ya da yozlaşma istemeyenler içindir. Surenin sonu.
    id: Qarun dan harta-hartanya, dan Tuhan telah membuatnya menelannya, dan bahwa Akhirat adalah bagi mereka yang tidak menginginkan pengangkatan atau kerusakan. Kesimpulan surat.
