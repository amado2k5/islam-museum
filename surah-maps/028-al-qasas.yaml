surah: 28
slug: al-qasas
sources_consulted:
  - "kuttab.com — Surah Al-Qasas mind map (5 blocks: 1-21, 22-28, 29-42, 43-56, 57-88)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "النهر والفرار", en: "The River and the Flight" }
    range: [1, 21]
    family: stories
    summary:
      ar: "طغيان فرعون، ووحي الله إلى أم موسى وإلقاؤه في اليم، ونشأته في القصر، وقتله المصري وفراره."
      en: "Pharaoh's tyranny; Allah inspiring Moses's mother; the river basket; palace upbringing; the Egyptian slain; flight."
    children:
      - { title: { ar: "أم موسى والتابوت", en: "Moses's Mother and the Basket" }, range: [7, 13] }
      - { title: { ar: "الفرار إلى مدين", en: "The Flight to Midian" }, range: [14, 21] }
  - title: { ar: "مدين", en: "Midian" }
    range: [22, 28]
    family: stories
    summary:
      ar: "ورود ماء مدين، وسقيه للمرأتين، واستئجاره، وزواجه بإحداهما على ثماني حجج."
      en: "The waters of Midian; watering for the two women; his hiring; marriage to one of them for eight terms."
    children: []
  - title: { ar: "النار وفرعون", en: "The Fire and Pharaoh" }
    range: [29, 42]
    family: stories
    summary:
      ar: "نداء موسى عند النار، والآيتين: العصا واليد، ومواجهة فرعون وملئه، وغرقهم في اليم."
      en: "Moses called at the fire; the two signs — staff and hand; confronting Pharaoh and his court; their drowning."
    children:
      - { title: { ar: "العصا واليد", en: "The Staff and the Hand" }, range: [31, 32] }
      - { title: { ar: "غرق فرعون وجنوده", en: "Pharaoh and His Hosts Drowned" }, range: [40, 42] }
  - title: { ar: "نوران: التوراة والقرآن", en: "Two Lights: Torah and Quran" }
    range: [43, 56]
    family: faith
    summary:
      ar: "الكتاب الذي أوتي موسى هدى ورحمة، وموقف المشركين من القرآن، والذين آمنوا بالكتابين."
      en: "The Book given to Moses as guidance and mercy; the polytheists' stance toward the Quran; believers in both."
    children: []
  - title: { ar: "قارون والخاتمة", en: "Qarun and the Closing" }
    range: [57, 88]
    family: stories
    summary:
      ar: "قارون وكنوزه وخسف الله به، وأن الدار الآخرة للذين لا يريدون علوا ولا فسادا، وخاتمة السورة."
      en: "Qarun and his treasures swallowed by the earth; the Last Home for the humble; the surah's closing."
    children:
      - { title: { ar: "خسف قارون", en: "Qarun Swallowed" }, range: [76, 82] }
      - { title: { ar: "الدار الآخرة", en: "The Last Home" }, range: [83, 83] }
