map:
- title:
    ar: النهر والفرار
    en: The River and the Flight
    tr: Nehir ve Kaçış
    id: Sungai dan Pelarian
  range:
  - 1
  - 21
  family: stories
  summary:
    ar: طغيان فرعون، ووحي الله إلى أم موسى وإلقاؤه في اليم، ونشأته في القصر، وقتله المصري وفراره.
    en: Pharaoh's tyranny; Allah inspiring Moses's mother; the river basket; palace upbringing; the Egyptian slain; flight.
    tr: Firavun'un zorbalığı, Tanrı'nın Musa'nın annesine vahyi ve denize atılması, sarayda yetiştirilmesi, Mısırlıları öldürüp kaçması.
    id: Tirani Firaun, wahyu Tuhan kepada ibu Musa dan penuntuhannya ke laut, didikan di istana, pembunuhan dan pelariannya terhadap orang Mesir.
  children:
  - title:
      ar: أم موسى والتابوت
      en: Moses's Mother and the Basket
      tr: Um Musa ve Gemi
      id: Um Musa dan Tabut
    range:
    - 7
    - 13
  - title:
      ar: الفرار إلى مدين
      en: The Flight to Midian
