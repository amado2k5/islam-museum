- title:
    ar: مدين
    en: Midian
    tr: borçlu
    id: debitur
  range:
  - 22
  - 28
  family: stories
  summary:
    ar: ورود ماء مدين، وسقيه للمرأتين، واستئجاره، وزواجه بإحداهما على ثماني حجج.
    en: The waters of Midian; watering for the two women; his hiring; marriage to one of them for eight terms.
    tr: Midyan'dan gelen suyun gelişi, suyunun iki kadına verilmesi, kiralanması ve sekiz hac yolculuğunda biriyle evlenmesi.
    id: Kedatangan air dari Midian, airnya diberikan kepada kedua wanita itu, penyewaannya, dan pernikahannya dengan salah satu dari mereka dalam delapan ziarah.
  children: []
- title:
    ar: النار وفرعون
    en: The Fire and Pharaoh
    tr: Ateş ve Firavun
    id: Api dan Firaun
  range:
  - 29
  - 42
  family: stories
  summary:
    ar: 'نداء موسى عند النار، والآيتين: العصا واليد، ومواجهة فرعون وملئه، وغرقهم في اليم.'
    en: Moses called at the fire; the two signs — staff and hand; confronting Pharaoh and his court; their drowning.
    tr: 'Musa''nın ateşe çağrısı ve iki ayet: asa ve el, Firavun''a dönüp onu doldurup denizde boğan.'
    id: 'Seruan Musa di atas api, dan dua ayat: tongkat dan tangan, menghadap Firaun dan mengisinya, lalu menenggelamkannya di laut.'
  children:
  - title:
