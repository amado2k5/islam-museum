- title:
    ar: أمة واحدة
    en: One Nation
    tr: Tek Ulus
    id: Satu Bangsa
  range:
  - 92
  - 112
  family: faith
  summary:
    ar: إن هذه أمتكم أمة واحدة، وخروج يأجوج ومأجوج، وطي السماء، ووراثة الأرض للصالحين.
    en: This nation of yours is one nation; Gog and Magog released; the sky rolled up; the righteous inherit the earth.
    tr: Gerçekten de, bu ulusun tek bir ulustur; Gog ve Magog'un dirilişi, göklerin katlanması ve yeryüzünün doğrulara mirası.
    id: Memang, bangsamu ini adalah satu bangsa, kebangkitan Gog dan Magog, pelipatan langit, dan warisan bumi bagi orang benar.
