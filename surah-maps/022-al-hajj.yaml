- title:
    ar: الإذن بالقتال
    en: Permission to Fight
    tr: Savaşma yetkisi
    id: Otorisasi untuk bertempur
  range:
  - 39
  - 59
  family: law
  summary:
    ar: أول آية أذنت للمظلومين بالقتال، وسنن الله في إهلاك القرى، والقلوب العمياء لا الأبصار.
    en: The first verse permitting the wronged to fight; Allah's way with destroyed towns; it is hearts, not eyes, that go blind.
    tr: Ezilenlerin savaşmasına izin veren ilk ayet ve Tanrı'nın yasaları köyleri yok etmekti, kör kalpleri yok etmekti, görme değil.
    id: Ayat pertama yang mengizinkan yang tertindas untuk berperang, dan hukum Tuhan adalah menghancurkan desa-desa, dan membutakan hati, bukan penglihatan.
  children:
  - title:
      ar: أذن للذين يقاتلون
      en: Leave Given to Those Fought
      tr: Savaşanlara izin
      id: Izin bagi mereka yang berjuang
    range:
    - 39
    - 39
- title:
    ar: وجاهدوا في الله
    en: Strive for Allah
    tr: Ve Tanrı'nın yolunda mücadele ettiler
    id: Dan mereka berjuang di jalan Tuhan
  range:
  - 60
  - 78
  family: faith
  summary:
    ar: 'لكل أمة منسك، ومثل الذباب الذي لا يخلق شيئا، وخاتمة السورة: جاهدوا واعتصموا، وملة أبيكم إبراهيم.'
    en: 'Every nation its rites; the fly parable; the close: strive, hold fast — the creed of your father Abraham.'
    tr: 'Her milletin kendi ritüeli vardır ve hiçbir şey yaratmayan bir sineğin örneği vardır. Surenin sonu: ''Çabala ve sağlam dur'' ve babanın dini İbrahim''dir.'
    id: 'Setiap bangsa memiliki ritualnya sendiri, dan contoh lalat yang tidak menciptakan apa-apa. Kesimpulan surah: ''Berjuanglah dan teguh,'' dan agama ayahmu adalah Ibrahim.'
