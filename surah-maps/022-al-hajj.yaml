surah: 22
slug: al-hajj
sources_consulted:
  - "kuttab.com — Surah Al-Hajj mind map (4 blocks: 1-24, 25-38, 39-59, 60-78)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "زلزلة الساعة", en: "The Quaking of the Hour" }
    range: [1, 24]
    family: faith
    summary:
      ar: "هول زلزلة الساعة، وأطوار خلق الإنسان حجة على البعث، والخصمان يختصمان في ربهم."
      en: "The Hour's quake; man's stages of creation as proof of resurrection; the two disputants about their Lord."
    children:
      - { title: { ar: "أطوار الخلق", en: "The Stages of Creation" }, range: [5, 5] }
  - title: { ar: "المناسك", en: "The Rites" }
    range: [25, 38]
    family: law
    summary:
      ar: "البيت الحرام سواء العاكف والباد، والأذان بالحج، والهدي والبدن، ولن ينال الله لحومها بل التقوى."
      en: "The Sacred House equal for resident and visitor; the call to pilgrimage; sacrifices — Allah receives piety, not meat."
    children:
      - { title: { ar: "الأذان بالحج", en: "Proclaiming the Pilgrimage" }, range: [27, 27] }
      - { title: { ar: "الهدي", en: "The Sacrifice" }, range: [36, 37] }
  - title: { ar: "الإذن بالقتال", en: "Permission to Fight" }
    range: [39, 59]
    family: law
    summary:
      ar: "أول آية أذنت للمظلومين بالقتال، وسنن الله في إهلاك القرى، والقلوب العمياء لا الأبصار."
      en: "The first verse permitting the wronged to fight; Allah's way with destroyed towns; it is hearts, not eyes, that go blind."
    children:
      - { title: { ar: "أذن للذين يقاتلون", en: "Leave Given to Those Fought" }, range: [39, 39] }
  - title: { ar: "وجاهدوا في الله", en: "Strive for Allah" }
    range: [60, 78]
    family: faith
    summary:
      ar: "لكل أمة منسك، ومثل الذباب الذي لا يخلق شيئا، وخاتمة السورة: جاهدوا واعتصموا، وملة أبيكم إبراهيم."
      en: "Every nation its rites; the fly parable; the close: strive, hold fast — the creed of your father Abraham."
    children:
      - { title: { ar: "مثل الذباب", en: "The Fly Parable" }, range: [73, 73] }
      - { title: { ar: "ملة إبراهيم", en: "Abraham's Creed" }, range: [78, 78] }
