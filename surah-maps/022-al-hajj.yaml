map:
- title:
    ar: زلزلة الساعة
    en: The Quaking of the Hour
    tr: Saatin Depremi
    id: Gempa Bumi Saat Ini
  range:
  - 1
  - 24
  family: faith
  summary:
    ar: هول زلزلة الساعة، وأطوار خلق الإنسان حجة على البعث، والخصمان يختصمان في ربهم.
    en: The Hour's quake; man's stages of creation as proof of resurrection; the two disputants about their Lord.
    tr: Saat depreminin dehşeti, insan yaratılışının dirilişe karşı kanıtı olarak görülmesi ve iki düşmanın Rableri hakkında tartıştığı.
    id: Kengerian gempa Jam, tahapan penciptaan manusia sebagai bukti melawan kebangkitan, dan kedua musuh yang berdebat tentang Tuhan mereka.
  children:
  - title:
      ar: أطوار الخلق
      en: The Stages of Creation
      tr: Yaratılış Aşamaları
      id: Tahapan Penciptaan
    range:
    - 5
    - 5
- title:
    ar: المناسك
    en: The Rites
    tr: ritüeller
    id: ritual
  range:
  - 25
  - 38
  family: law
  summary:
    ar: البيت الحرام سواء العاكف والباد، والأذان بالحج، والهدي والبدن، ولن ينال الله لحومها بل التقوى.
    en: The Sacred House equal for resident and visitor; the call to pilgrimage; sacrifices — Allah receives piety, not meat.
    tr: Kutsal Ev, kalan kişi mi kalan mı yoksa kalan mı evde kalan ve evde kalan kişi ile Hac için nazan, kurban ve beden için namaz kılan ve Allah onun etine ancak takvadan ulaşır.
    id: Rumah Suci adalah apakah yang tinggal atau yang tinggal dan yang tinggal di rumah, dan seruan untuk shalat Haji, korban dan tubuh, dan Allah tidak akan mencapai dagingnya kecuali kesalehan.
  children:
  - title:
      ar: الأذان بالحج
      en: Proclaiming the Pilgrimage
      tr: Hac sırasında ezan çağrısı
      id: Seruan untuk shalat selama Haji
    range:
    - 27
    - 27
  - title:
      ar: الهدي
      en: The Sacrifice
      tr: Al-Huda
      id: Al-Huda
