map:
  - title: { ar: "سعيان مختلفان", en: "Two Strivings" }
    range: [1, 11]
    family: faith
    summary:
      ar: "والليل إذا يغشى والنهار إذا تجلى وما خلق الذكر والأنثى إن سعيكم لشتى: فأما من أعطى واتقى فسنيسره لليسرى، وأما من بخل واستغنى فسنيسره للعسرى."
      en: "By the night enshrouding, the day brightening, male and female: your striving is diverse — whoever gives and fears Allah is eased toward ease; whoever withholds and deems himself self-sufficient is eased toward hardship."
    children: []
  - title: { ar: "النار والأتقى", en: "The Fire and the Most Righteous" }
    range: [12, 21]
    family: faith
    summary:
      ar: "إن علينا للهدى وإن لنا للآخرة والأولى: لا يصلاها إلا الأشقى، وسيجنبها الأتقى الذي يؤتي ماله يتزكى."
      en: "Guidance is upon Us, and to Us belong the Hereafter and this world: none shall enter the Fire but the most wretched — while the most righteous, who gives his wealth to purify himself, shall be kept far from it."
    children: []
