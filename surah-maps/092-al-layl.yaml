map:
- title:
    ar: سعيان مختلفان
    en: Two Strivings
    tr: İki farklı uğraş
    id: Dua kegiatan yang berbeda
  range:
  - 1
  - 11
  family: faith
  summary:
    ar: 'والليل إذا يغشى والنهار إذا تجلى وما خلق الذكر والأنثى إن سعيكم لشتى: فأما من أعطى واتقى فسنيسره لليسرى، وأما من بخل واستغنى فسنيسره للعسرى.'
    en: 'By the night enshrouding, the day brightening, male and female: your striving is diverse — whoever gives and fears Allah is eased toward ease; whoever withholds and deems himself self-sufficient
      is eased toward hardship.'
    tr: 'Gece ve gün ortaya çıktığında, erkekle dişiyi yaratan şey olduğunda, çabalarınız çeşitlidir: Veren ve Allah''tan korkanları sola kaydıracağız, cimri ve kendi kendine yetenleri ise zorluğa çekeceğiz.'
    id: 'Dan ketika malam menutupi dan siang ketika ia terwujud, dan apa yang menciptakan jantan dan betina, memang usahamu beragam: Adapun mereka yang memberi dan takut kepada Tuhan, Kami akan memudahkan
      mereka ke kiri, dan bagi mereka yang pelit dan mandiri, Kami akan memudahkan mereka menghadapi kesulitan.'
  children: []
- title:
    ar: النار والأتقى
    en: The Fire and the Most Righteous
    tr: Ateş ve En Doğru
    id: Api dan Yang Paling Benar
  range:
  - 12
  - 21
  family: faith
  summary:
    ar: 'إن علينا للهدى وإن لنا للآخرة والأولى: لا يصلاها إلا الأشقى، وسيجنبها الأتقى الذي يؤتي ماله يتزكى.'
    en: 'Guidance is upon Us, and to Us belong the Hereafter and this world: none shall enter the Fire but the most wretched — while the most righteous, who gives his wealth to purify himself, shall be
      kept far from it.'
    tr: Gerçekten de rehberimiz ve ahiret vardır. En iyisi, sadece en zavallı olanların dua etmesidir ve en dindar olanlar da kendini arındırmak için servetini verdiğinde ondan kaçınır.
    id: Memang, kita memiliki petunjuk dan akhirat. Yang terbaik adalah hanya yang paling sengsara yang berdoa, dan yang paling saleh akan menghindarinya ketika dia memberikan kekayaannya untuk menyucikan
      dirinya.
  children: []
