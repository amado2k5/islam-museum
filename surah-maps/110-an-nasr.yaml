map:
- title:
    ar: النصر والفتح
    en: Victory and Conquest
    tr: El-Nasr ve El-Fateh
    id: Al-Nassr dan Al-Fateh
  range:
  - 1
  - 2
  family: faith
  summary:
    ar: إذا جاء نصر الله والفتح ورأيت الناس يدخلون في دين الله أفواجا.
    en: When Allah's help and the conquest come, and you see people entering Allah's religion in crowds.
    tr: Tanrı'nın zaferi ve fetih geldiğinde, insanların kalabalıklar halinde Tanrı'nın dinine girdiğini gördüğünüzde.
    id: Ketika kemenangan dan penaklukan Tuhan datang, dan Anda melihat orang-orang memasuki agama Tuhan dalam kerumunan.
  children: []
- title:
    ar: التسبيح والاستغفار
    en: Glorify and Seek Forgiveness
    tr: Övgü ve af dileme
    id: Puji dan mencari pengampunan
  range:
  - 3
  - 3
  family: faith
  summary:
    ar: 'فسبح بحمد ربك واستغفره إنه كان توابا: عند تمام النعمة يكون التسبيح والاستغفار.'
    en: 'Then glorify your Lord with praise and seek His forgiveness — at the height of blessing: praise and repentance, for He is ever Accepting.'
    tr: 'Bu yüzden Rabbinizi övgüyle yüceltin ve O''ndan af dileyin, çünkü O, her zaman tövbe eder: Kutsamanın tamamlandığında, övgü ve af dileme vardır.'
    id: 'Maka memuliakan dengan pujian kepada Tuhanmu dan mintalah ampun-Nya, karena Dia selalu Selalu Bertobat: Setelah selesai berkat, ada pemuliaan dan pencarian pengampunan.'
  children: []
