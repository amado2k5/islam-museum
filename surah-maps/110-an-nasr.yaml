  - title: { ar: "التسبيح والاستغفار", en: "Glorify and Seek Forgiveness" }
    range: [3, 3]
    family: faith
    summary:
      ar: "فسبح بحمد ربك واستغفره إنه كان توابا: عند تمام النعمة يكون التسبيح والاستغفار."
      en: "Then glorify your Lord with praise and seek His forgiveness — at the height of blessing: praise and repentance, for He is ever Accepting."
