map:
- title:
    ar: الطارق
    en: The Nightcomer
    tr: Tariq
    id: Tariq
  range:
  - 1
  - 10
  family: faith
  summary:
    ar: 'والسماء والطارق النجم الثاقب: إن كل نفس لما عليها حافظ، خلق الإنسان من ماء دافق، إنه على رجعه لقادر.'
    en: 'By the sky and the nightcomer — the piercing star: over every soul is a keeper; man was created from a spurting fluid, and Allah is able to bring him back.'
    tr: 'Ve gökyüzü ve delici yıldız: Her ruh, sahip olduğu şeyin koruyucusudur. İnsan akan sudan yaratıldı; gerçekten de geri dönebilir.'
    id: 'Dan langit serta bintang yang menusuk: Setiap jiwa adalah penjaga atas apa yang dijunjungnya. Manusia diciptakan dari air yang mengalir; memang, Dia mampu kembali.'
  children: []
- title:
    ar: القول الفصل
    en: The Decisive Word
    tr: Son söz
    id: Kata terakhir
  range:
  - 11
  - 17
  family: faith
  summary:
    ar: 'والسماء ذات الرجع والأرض ذات الصدع إنه لقول فصل وما هو بالهزل: إنهم يكيدون كيدا وأكيد كيدا فمهل الكافرين أمهلهم رويدا.'
    en: 'By the returning sky and the splitting earth: it is a decisive word, no amusement — they plot, and I plan; so grant the disbelievers a brief respite.'
    tr: 'Ve gök dönüşüyle, yeryüzü çatlaklarla. Bu ayrıntılı bir sözdür ve şaka değildir: Plan yaparlar ve kesinlikle plan yaparlar, böylece kâfirlerin zamanı kademelidir.'
    id: 'Dan surga dengan kembalinya dan bumi dengan retakan. Ini adalah pepatah yang rinci, dan bukan lelucon: Mereka merencanakan dan tentu saja merencanakan, sehingga waktu orang kafir berlangsung secara
      bertahap.'
  children: []
