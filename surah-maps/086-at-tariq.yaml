map:
  - title: { ar: "الطارق", en: "The Nightcomer" }
    range: [1, 10]
    family: faith
    summary:
      ar: "والسماء والطارق النجم الثاقب: إن كل نفس لما عليها حافظ، خلق الإنسان من ماء دافق، إنه على رجعه لقادر."
      en: "By the sky and the nightcomer — the piercing star: over every soul is a keeper; man was created from a spurting fluid, and Allah is able to bring him back."
    children: []
  - title: { ar: "القول الفصل", en: "The Decisive Word" }
    range: [11, 17]
    family: faith
    summary:
      ar: "والسماء ذات الرجع والأرض ذات الصدع إنه لقول فصل وما هو بالهزل: إنهم يكيدون كيدا وأكيد كيدا فمهل الكافرين أمهلهم رويدا."
      en: "By the returning sky and the splitting earth: it is a decisive word, no amusement — they plot, and I plan; so grant the disbelievers a brief respite."
    children: []
