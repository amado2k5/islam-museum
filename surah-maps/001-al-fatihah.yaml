surah: 1
slug: al-fatihah
sources_consulted:
  - "kuttab.com — Surah Al-Fatiha mind map (3 blocks: 1-4 praise, 5 the pledge, 6-7 the request)"
  - "الخريطة الذهنية لسورة الفاتحة — kuttab.com النسخة العربية (نفس التقسيم)"
  - "التقسيم المشهور المبني على الحديث القدسي: نصفها ثناء ونصفها دعاء"
map:
  - title: { ar: "الثناء على الله", en: "Praise of Allah" }
    range: [1, 4]
    family: faith
    summary:
      ar: "البسملة وحمد رب العالمين، وذكر الرحمة وملك يوم الدين — أربعة آيات ثناء يفتتح بها الدعاء."
      en: "The basmala and praise of the Lord of the worlds, mercy, and mastery of the Day of Recompense — four verses of praise opening the supplication."
    children: []
  - title: { ar: "العهد: العبادة والاستعانة", en: "The Pledge: Worship and Help" }
    range: [5, 5]
    family: faith
    summary:
      ar: "الآية الوسطى التي جعلها الحديث القدسي بين العبد وربه: إخلاص العبادة وطلب العون من الله وحده."
      en: "The middle verse the hadith qudsi places between servant and Lord: worship and help sought from Allah alone."
    children: []
  - title: { ar: "طلب الهداية", en: "The Request for Guidance" }
    range: [6, 7]
    family: faith
    summary:
      ar: "الدعاء الجامع: اهدنا الصراط المستقيم — طريق المنعم عليهم، لا طريق المغضوب عليهم ولا الضالين."
      en: "The comprehensive supplication: guide us along the straight path — of those favored, not of those who earned anger or went astray."
    children: []
