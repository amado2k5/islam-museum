surah: 1
slug: al-fatihah
sources_consulted:
- 'kuttab.com — Surah Al-Fatiha mind map (3 blocks: 1-4 praise, 5 the pledge, 6-7 the request)'
- الخريطة الذهنية لسورة الفاتحة — kuttab.com النسخة العربية (نفس التقسيم)
- 'التقسيم المشهور المبني على الحديث القدسي: نصفها ثناء ونصفها دعاء'
map:
- title:
    ar: الثناء على الله
    en: Praise of Allah
    tr: Tanrı'ya şükürler olsun
    id: Segala puji bagi Tuhan
  range:
  - 1
  - 4
  family: faith
  summary:
    ar: البسملة وحمد رب العالمين، وذكر الرحمة وملك يوم الدين — أربعة آيات ثناء يفتتح بها الدعاء.
    en: The basmala and praise of the Lord of the worlds, mercy, and mastery of the Day of Recompense — four verses of praise opening the supplication.
    tr: Basmala, Dünyaların Rabbine övgü olsun, merhametten bahsetmek ve Kıyamet Günü Kralı — duanın başladığı dört övgü ayeti.
    id: Basmala, puji bagi Tuhan segala Dunia, penyebutan belas kasihan, dan Raja Hari Penghakiman — empat ayat pujian yang menjadi awal permohonan itu.
  children: []
- title:
    ar: 'العهد: العبادة والاستعانة'
    en: 'The Pledge: Worship and Help'
    tr: 'Antlaşma: İbadet ve Yardım Arama'
    id: 'Perjanjian: Beribadah dan Mencari Bantuan'
  range:
  - 5
  - 5
  family: faith
  summary:
    ar: 'الآية الوسطى التي جعلها الحديث القدسي بين العبد وربه: إخلاص العبادة وطلب العون من الله وحده.'
    en: 'The middle verse the hadith qudsi places between servant and Lord: worship and help sought from Allah alone.'
    tr: Orta ayet, hizmetkar ile Rabbi arasındaki kutsal hadisin ibadet ve yalnızca Allah'tan yardım istemekle samimi bir şekilde yapıldığıdır.
    id: Ayat tengah adalah bahwa hadis suci antara hamba dan Tuhannya dijadikan tulus dalam penyembahan dan hanya memohon pertolongan dari Allah.
  children: []
- title:
    ar: طلب الهداية
    en: The Request for Guidance
    tr: Rehberlik talebi
    id: Permintaan panduan
  range:
  - 6
  - 7
  family: faith
  summary:
    ar: 'الدعاء الجامع: اهدنا الصراط المستقيم — طريق المنعم عليهم، لا طريق المغضوب عليهم ولا الضالين.'
    en: 'The comprehensive supplication: guide us along the straight path — of those favored, not of those who earned anger or went astray.'
    tr: 'Kapsamlı dua: Bizi doğru yola yönlendir — onlara lütfunu bahşetmiş O''nun yoluna, öfkelenlerin ya da yanlış yola düşenlerin yoluna değil.'
    id: 'Doa yang menyeluruh: Bimbing kami ke jalan yang benar — jalan Dia yang telah menganugerahkan rahmat-Nya kepada mereka, bukan jalan mereka yang telah marah atau tersesat.'
  children: []
