surah: 75
slug: al-qiyamah
sources_consulted:
  - "kuttab.com — Surah Al-Qiyamah mind map (3 blocks: 1-15, 16-25, 26-40)"
  - "quran.com — معلومات عن سورة القيامة (مقتبس من تفسير ابن عاشور): أغراض السورة"
  - "tadabbur-alquran.com — مقاصد سورة القيامة"
  - "tafsir.sa — أساليب التأثير النفسي في سورة القيامة (مركز تفسير للدراسات القرآنية)"
map:
  - title: { ar: "القسم بيوم القيامة وجمع العظام", en: "Oaths on the Day and the Gathering of Bones" }
    range: [1, 15]
    family: faith
    summary:
      ar: "القسم بيوم القيامة والنفس اللوامة على قدرة الله في جمع العظام وتسوية البنان، ثم أشراط اليوم الذي لا ملجأ فيه، والإنسان على نفسه بصيرة."
      en: "Oaths by the Day of Resurrection and the self-reproaching soul on Allah's power to gather bones and fashion fingertips; then the Day's signs with no refuge, and man a witness against himself."
    children:
      - { title: { ar: "القسمان وقدرة البعث", en: "The Two Oaths and the Power of Resurrection" }, range: [1, 4] }
      - { title: { ar: "أشراط اليوم", en: "The Day's Portents" }, range: [5, 12] }
      - { title: { ar: "الإنسان على نفسه بصيرة", en: "Man a Witness Against Himself" }, range: [13, 15] }
  - title: { ar: "التؤدة في تلقي الوحي", en: "Unhurried Reception of the Revelation" }
    range: [16, 19]
    family: faith
    summary:
      ar: "توجيه نبوي في أثناء السورة: لا تعجل بتحريك اللسان بالوحي، فجمعه وقرآنه وبيانه على الله."
      en: "A prophetic directive amid the surah: do not hasten your tongue with the revelation — its collection, recitation, and clarification rest with Allah."
    children: []
  - title: { ar: "حب العاجلة والوجوه يومئذ", en: "Love of the Fleeting and the Faces That Day" }
    range: [20, 25]
    family: faith
    summary:
      ar: "سبب الغفلة: حب الدنيا العاجلة وترك الآخرة، ثم انقسام الناس يوم القيامة إلى وجوه ناضرة ناظرة إلى ربها ووجوه باسرة."
      en: "The cause of heedlessness: love of the fleeting world and neglect of the Hereafter; then mankind split on that Day into radiant faces gazing at their Lord and darkened faces."
    children:
      - { title: { ar: "حب العاجلة", en: "Love of the Fleeting" }, range: [20, 21] }
      - { title: { ar: "الوجوه الناضرة والباسرة", en: "The Radiant and the Darkened Faces" }, range: [22, 25] }
  - title: { ar: "سكرات الموت", en: "The Throes of Death" }
    range: [26, 30]
    family: faith
    summary:
      ar: "مشهد الاحتضار: إذا بلغت الروح التراقي والتفت الساق بالساق، إلى ربك يومئذ المساق."
      en: "The deathbed scene: when the soul reaches the collarbones and leg is joined with leg — to your Lord that Day is the driving."
    children: []
  - title: { ar: "المكذب ودليل الخلق", en: "The Denier and the Proof from Creation" }
    range: [31, 40]
    family: faith
    summary:
      ar: "صورة المكذب الذي لا يصدق ولا يصلي ويتمطى مستكبرا، ثم دليل الخلق على البعث: من نطفة إلى علقة إلى زوجين، أليس القادر على ذلك بقادر على إحياء الموتى."
      en: "The denier who neither believed nor prayed, strutting in arrogance; then the proof of creation for resurrection: from drop to clot to the two sexes — is not He who did that able to revive the dead."
    children:
      - { title: { ar: "تبختر المكذب", en: "The Denier's Strut" }, range: [31, 35] }
      - { title: { ar: "دليل الخلق على البعث", en: "Creation as Proof of Resurrection" }, range: [36, 40] }
