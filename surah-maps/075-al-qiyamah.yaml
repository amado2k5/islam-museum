surah: 75
slug: al-qiyamah
sources_consulted:
- 'kuttab.com — Surah Al-Qiyamah mind map (3 blocks: 1-15, 16-25, 26-40)'
- 'quran.com — معلومات عن سورة القيامة (مقتبس من تفسير ابن عاشور): أغراض السورة'
- tadabbur-alquran.com — مقاصد سورة القيامة
- tafsir.sa — أساليب التأثير النفسي في سورة القيامة (مركز تفسير للدراسات القرآنية)
map:
- title:
    ar: القسم بيوم القيامة وجمع العظام
    en: Oaths on the Day and the Gathering of Bones
    tr: Diriliş Günü'ndeki yemin ve kemiklerin toplanması
    id: Sumpah pada Hari Kebangkitan dan pengumpulan tulang
  range:
  - 1
  - 15
  family: faith
  summary:
    ar: القسم بيوم القيامة والنفس اللوامة على قدرة الله في جمع العظام وتسوية البنان، ثم أشراط اليوم الذي لا ملجأ فيه، والإنسان على نفسه بصيرة.
    en: Oaths by the Day of Resurrection and the self-reproaching soul on Allah's power to gather bones and fashion fingertips; then the Day's signs with no refuge, and man a witness against himself.
    tr: Diriliş Günü'nde verilen yemin ve Tanrı'nın kemikleri toplama ve uzuvları düzeltme yeteneğine dair azarlayan ruh, ardından sığınacak olmayan bir günün işaretleri ve kişinin kendini kavrayabildiği
      bir günün işaretleri.
    id: Sumpah pada Hari Kebangkitan dan jiwa yang menegur tentang kemampuan Tuhan mengumpulkan tulang dan menghaluskan anggota tubuh, lalu tanda-tanda hari ketika tidak ada tempat berlindung, dan seseorang
      memiliki wawasan tentang dirinya sendiri.
  children:
  - title:
      ar: القسمان وقدرة البعث
      en: The Two Oaths and the Power of Resurrection
      tr: İki bölünme ve dirilme yeteneği
      id: Dua divisi dan kemampuan untuk membangkitkan kembali
    range:
    - 1
    - 4
  - title:
      ar: أشراط اليوم
      en: The Day's Portents
      tr: Bugünün işaretleri
      id: Tanda-tanda hari ini
    range:
    - 5
    - 12
  - title:
      ar: الإنسان على نفسه بصيرة
      en: Man a Witness Against Himself
      tr: Bir kişi kendisi hakkında içgörü sahibi olur
      id: Seseorang memiliki wawasan tentang dirinya sendiri
    range:
    - 13
    - 15
- title:
    ar: التؤدة في تلقي الوحي
    en: Unhurried Reception of the Revelation
    tr: Vahiy alırken naziklik
    id: Kelembutan dalam menerima wahyu
  range:
  - 16
  - 19
  family: faith
  summary:
    ar: 'توجيه نبوي في أثناء السورة: لا تعجل بتحريك اللسان بالوحي، فجمعه وقرآنه وبيانه على الله.'
    en: 'A prophetic directive amid the surah: do not hasten your tongue with the revelation — its collection, recitation, and clarification rest with Allah.'
    tr: 'Surede peygamberlik rehberi: Dilinizi vahyle hareket ettirmeye acele etmeyin, böylece onun toplanması, Kur''an''ı ve açıklaması Allah''ın üzerindedir.'
    id: 'Panduan nabi dalam Surat: Jangan terburu-buru menggerakkan lidah dengan wahyu, agar pengumpulan, Al-Qur''an, dan penjelasannya ada pada Allah.'
  children: []
- title:
    ar: حب العاجلة والوجوه يومئذ
    en: Love of the Fleeting and the Faces That Day
    tr: O günün aciliyetini ve yüzlerini seviyorum
    id: Cintai yang mendesak dan wajah-wajah hari itu
  range:
  - 20
  - 25
  family: faith
  summary:
    ar: 'سبب الغفلة: حب الدنيا العاجلة وترك الآخرة، ثم انقسام الناس يوم القيامة إلى وجوه ناضرة ناظرة إلى ربها ووجوه باسرة.'
    en: 'The cause of heedlessness: love of the fleeting world and neglect of the Hereafter; then mankind split on that Day into radiant faces gazing at their Lord and darkened faces.'
    tr: 'Dikkatsizliğin nedeni: yakın dünyayı sevmek ve ahireti terk etmek, ardından Kıyamet Günü''nde insanları Rab''blerine bakan parlak yüzler ve parlak yüzler olarak bölmek.'
    id: 'Penyebab kelalaian: mencintai dunia langsung dan meninggalkan akhirat, lalu pembagian manusia pada Hari Penghakiman menjadi wajah-wajah bercahaya yang menatap Tuhan mereka dan wajah-wajah bercahaya.'
  children:
  - title:
      ar: حب العاجلة
      en: Love of the Fleeting
      tr: Acil sevgi
      id: Cinta yang mendesak
    range:
    - 20
    - 21
  - title:
      ar: الوجوه الناضرة والباسرة
      en: The Radiant and the Darkened Faces
      tr: Parlak ve Net Yüzler
      id: Wajah-wajah yang Bersinar dan Jelas
    range:
    - 22
    - 25
- title:
    ar: سكرات الموت
    en: The Throes of Death
    tr: Ölüm Sancıları
    id: Kematian Throes
  range:
  - 26
  - 30
  family: faith
  summary:
    ar: 'مشهد الاحتضار: إذا بلغت الروح التراقي والتفت الساق بالساق، إلى ربك يومئذ المساق.'
    en: 'The deathbed scene: when the soul reaches the collarbones and leg is joined with leg — to your Lord that Day is the driving.'
    tr: 'Ölüm sahnesi: Eğer Trakyalı ruh bacağına ulaşıp ayak ayak dönerse, o gün yol Rabbine açılır.'
    id: 'Adegan kematian: Jika jiwa Thracia mencapai kaki dan berbalik kaki ke kaki, pada hari itu jalan akan dibuat.'
  children: []
- title:
    ar: المكذب ودليل الخلق
    en: The Denier and the Proof from Creation
    tr: Yalancı ve yaratılışın kanıtı
    id: Sang pembohong dan bukti penciptaan
  range:
  - 31
  - 40
  family: faith
  summary:
    ar: 'صورة المكذب الذي لا يصدق ولا يصلي ويتمطى مستكبرا، ثم دليل الخلق على البعث: من نطفة إلى علقة إلى زوجين، أليس القادر على ذلك بقادر على إحياء الموتى.'
    en: 'The denier who neither believed nor prayed, strutting in arrogance; then the proof of creation for resurrection: from drop to clot to the two sexes — is not He who did that able to revive the dead.'
    tr: 'İnanmayan, dua etmeyen ve kibirle gerilen inkârın görüntüsü, o zaman diriliş için yaratılışın kanıtı: bir damla spermden bir yumruya, bir eşe kadar. Bunu yapabilecek kişi ölüleri hayata döndüremez
      mi?'
    id: 'Gambaran orang yang menyangkal yang tidak percaya, tidak berdoa, dan meregang dengan sombong, lalu bukti penciptaan untuk kebangkitan: dari setetes sperma menjadi gumpalan hingga pasangan. Bukankah
      orang yang mampu melakukan itu mampu menghidupkan kembali orang mati?'
  children:
  - title:
      ar: تبختر المكذب
      en: The Denier's Strut
      tr: Yalancı Yürüyüş
      id: Kaki Pembohong
    range:
    - 31
    - 35
  - title:
      ar: دليل الخلق على البعث
      en: Creation as Proof of Resurrection
      tr: Diriliş için yaratılışın kanıtı
      id: Bukti penciptaan untuk kebangkitan
    range:
    - 36
    - 40
