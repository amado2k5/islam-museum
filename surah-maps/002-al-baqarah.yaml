- title:
    ar: الإنفاق والصدقة
    en: Spending and Charity
    tr: Harcamalar ve Hayırseverlik
    id: Pengeluaran dan Amal
  range:
  - 261
  - 274
  family: law
  summary:
    ar: فضل الصدقة وآدابها، ومضاعفة الأجر عليها أضعافا كثيرة.
    en: 'The merit and manners of charity: like a grain growing seven ears.'
    tr: Hayırseverliğin erdemi ve görgü kuralları ile bunun karşılığında defalarca artan ödül.
    id: Kebajikan dan etiket dari amal, dan ganjaran yang berlipat ganda untuk itu berkali-kali lipat.
  children: []
- title:
    ar: تحريم الربا
    en: The Prohibition of Usury
    tr: Tefeciliğin yasaklanması
    id: Larangan riba
  range:
  - 275
  - 281
  family: law
  summary:
    ar: تحريم الربا تحريما قاطعا، والأمر بتقوى الله، والتذكير بيوم الجزاء.
    en: Usury categorically forbidden; fear Allah; remember the Day of Recompense.
    tr: Tefeciliğin kesin yasaklanması, Allah'tan korkma emri ve Kıyamet Günü'nün hatırlatılması.
    id: Larangan mutlak riba, perintah untuk takut kepada Allah, dan pengingat Hari Kiamat (Hari Penghakiman).
  children: []
- title:
    ar: آية الدَّين
    en: The Verse of Debt
    tr: Ayetdin
    id: Ayat al-Din
  range:
  - 282
  - 282
  family: law
  summary:
    ar: 'أطول آية في القرآن: كتابة الدَّين والإشهاد عليه حفظا للحقوق.'
    en: 'The longest verse in the Quran: writing down debts and witnesses to protect rights.'
    tr: 'Kur''an''daki en uzun ayet: Hakları korumak için dini yazmak ve ona tanıklık etmek.'
    id: 'Ayat terpanjang dalam Al-Qur''an: Menulis agama dan menjadi saksi untuk menjaga hak-hak.'
  children: []
- title:
    ar: خواتيم السورة
    en: The Closing Verses
    tr: Sure Sonuçları
    id: Kesimpulan Surah
  range:
  - 283
  - 286
  family: faith
  summary:
    ar: الأمانة وأداؤها، ودعاء المؤمنين الخالد في خواتيم السورة.
    en: 'Trusts and their fulfillment, and the believers'' timeless supplication: ''The Messenger believes…'''
    tr: Güvenilirlik ve onun gerçekleşmesi, ve surenin sonunda müminlerin ebedi duası.
    id: Kejujuran dan pemenuhannya, serta doa abadi orang beriman di akhir surat.
  children: []
