- title:
    ar: قصة طالوت وجالوت
    en: Talut and Jalut
    tr: Talut ve Golyath'ın hikayesi
    id: Kisah Talut dan Goliath
  range:
  - 243
  - 252
  family: stories
  summary:
    ar: طالوت وجنوده، وداود يقتل جالوت — النصر بالصبر والثبات لا بالكثرة.
    en: Talut and his troops; David slays Jalut — victory through patience, not numbers.
    tr: Talut ve askerleri, Davud ise Goliath'ı öldürür—zafer bollukla değil, sabır ve kararlılıkla olur.
    id: Talut dan tentaranya, dan Daud membunuh Goliath—kemenangan datang melalui kesabaran dan keteguhan, bukan dengan kelimpahan.
  children: []
- title:
    ar: آيات القدرة الإلهية
    en: Signs of Divine Power
    tr: İlahi Gücün Belirtileri
    id: Tanda-tanda Kekuatan Ilahi
  range:
  - 253
  - 260
  family: faith
  summary:
    ar: 'سلسلة من آيات القدرة: الكرسي، ومحاجة النمرود، والذي أماته الله، وإحياء الموتى لإبراهيم.'
    en: 'A sequence on divine power: the Throne verse, Nimrod''s dispute, the century-long death, reviving birds.'
    tr: 'Güç dolu bir dizi ayet: Taht, Tanrı''nın öldürdüğü (Tanrı''nın öldürdüğü) Nimrod ile tartışma ve İbrahim için ölülerin dirilişi.'
    id: 'Serangkaian ayat kekuasaan: Takhta, perdebatan dengan Nimrod, siapa yang dibunuh Tuhan (siapa yang dibunuh Tuhan), dan kebangkitan orang mati untuk Abraham.'
