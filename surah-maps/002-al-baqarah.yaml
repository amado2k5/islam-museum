- title:
    ar: قصة إبراهيم
    en: The Story of Abraham
    tr: İbrahim'in Hikayesi
    id: Kisah Abraham
  range:
  - 124
  - 141
  family: stories
  summary:
    ar: إمامة إبراهيم، ورفع قواعد البيت، ودعاؤه — واتباع ملته الحنيفية.
    en: Abraham's leadership, raising the House's foundations, his supplication — the upright creed.
    tr: İbrahim'in liderliği, evin temellerini atması ve onun duaları — ve Hanifi mezhebine uymaması.
    id: Kepemimpinan Ibrahim, mengangkat fondasi Rumah, dan permohonannya — serta mengikuti sekte Hanifi-nya.
  children: []
- title:
    ar: تحويل القبلة
    en: The Change of Qibla
    tr: Kıble Dönüşümü
    id: Konversi Qibla
  range:
  - 142
  - 152
  family: law
  summary:
    ar: تحويل القبلة إلى المسجد الحرام، ووسطية هذه الأمة وشهادتها على الناس.
    en: The qibla turned to the Sacred Mosque; this nation as a middle, witnessing nation.
    tr: Kıble'nin Müdemsal Camii'ye dönüştürülmesi, bu milletin ılımlılığı ve halka tanıklığı sağlanması.
    id: Mengubah Qibla menjadi Masjid Suci, serta moderasi bangsa ini dan kesaksiannya kepada rakyat.
  children: []
- title:
    ar: أحكام العبادات والمعاملات
    en: 'Rulings: Worship and Dealings'
    tr: İbadet ve İşlemlerin Hükümleri
    id: Putusan Ibadah dan Transaksi
  range:
  - 153
  - 242
  family: law
  summary:
    ar: 'أكبر كتلة تشريعية في السورة: الصبر والصلاة، القصاص، الصيام، الحج، القتال، الإنفاق، النكاح والطلاق.'
    en: 'The largest legal block: patience and prayer, retribution, fasting, pilgrimage, fighting, marriage.'
    tr: 'Suredeki en büyük yasama organları şunlardır: sabır ve dua, intikam, oruç, hac, kavga, harcama, evlilik ve boşanma.'
    id: 'Badan legislatif terbesar dalam surah adalah: kesabaran dan doa, pembalasan, puasa, ziarah, pertengkaran, pengeluaran, pernikahan, dan perceraian.'
