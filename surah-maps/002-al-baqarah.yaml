surah: 2
slug: al-baqarah
sources_consulted:
  - "Hand-drawn thematic mind map of Surah Al-Baqarah (user-supplied study notebook)"
  - "في ظلال القرآن — مقدمة سورة البقرة (thematic introduction)"
  - "Standard thematic divisions (Ibn Kathir-style section breaks)"
map:
  - title: { ar: "صفات المؤمنين", en: "Traits of the Believers" }
    range: [1, 5]
    family: faith
    summary:
      ar: "افتتاح السورة بوصف المتقين: الإيمان بالغيب وإقام الصلاة والإنفاق — ملامح المؤمن في خمس آيات."
      en: "The surah opens describing the God-conscious: belief in the unseen, prayer, spending."
    children: []
  - title: { ar: "صفات الكافرين", en: "Traits of the Disbelievers" }
    range: [6, 7]
    family: faith
    summary:
      ar: "الذين كفروا سواء عليهم أأنذرتهم أم لم تنذرهم؛ ختم الله على قلوبهم وسمعهم وأبصارهم."
      en: "Those who disbelieve — warning them or not is the same; Allah has sealed their hearts and hearing."
    children: []
  - title: { ar: "صفات المنافقين", en: "Traits of the Hypocrites" }
    range: [8, 20]
    family: faith
    summary:
      ar: "أطول وصف للمنافقين في القرآن: يخادعون الله، في قلوبهم مرض، وإذا لقوا المؤمنين قالوا آمنا."
      en: "The longest portrait of the hypocrites: they deceive Allah, sickness in their hearts."
    children: []
  - title: { ar: "دعوة الناس إلى العبادة", en: "The Call to Worship" }
    range: [21, 29]
    family: faith
    summary:
      ar: "نداء الناس إلى عبادة ربهم وحده، والتحدي بالإتيان بسورة من مثله، والبشارة، والتذكير بخلق السماوات والأرض."
      en: "'O mankind, worship your Lord': the challenge to produce a surah, glad tidings, creation reminded."
    children: []
  - title: { ar: "قصة آدم", en: "The Story of Adam" }
    range: [30, 39]
    family: stories
    summary:
      ar: "خلافة آدم، وسجود الملائكة، ومعصية إبليس، ثم الهبوط إلى الأرض — أول قصص السورة."
      en: "Adam's vicegerency, the angels' prostration, Iblis's refusal, then the descent — the first story."
    children: []
  - title: { ar: "خطاب بني إسرائيل", en: "Address to the Children of Israel" }
    range: [40, 123]
    family: stories
    summary:
      ar: "أطول خطاب في السورة: تذكير بنعم الله على بني إسرائيل ونقضهم للمواثيق، تتخلله قصص فرعية."
      en: "The longest address in the surah: Allah's favors on the Children of Israel and their broken covenants."
    children:
      - { title: { ar: "فرعون والنجاة", en: "Pharaoh and the Deliverance" }, range: [49, 50] }
      - { title: { ar: "العجل", en: "The Calf" }, range: [51, 54] }
      - { title: { ar: "طلب رؤية الله", en: "Demanding to See Allah" }, range: [55, 55] }
      - { title: { ar: "المن والسلوى", en: "Manna and Quails" }, range: [57, 57] }
      - { title: { ar: "الاستسقاء", en: "The Water from the Rock" }, range: [60, 60] }
      - { title: { ar: "الطور", en: "The Mount" }, range: [63, 63] }
      - { title: { ar: "البقرة", en: "The Cow" }, range: [67, 73] }
      - { title: { ar: "سليمان والشياطين", en: "Solomon and the Devils" }, range: [102, 102] }
  - title: { ar: "قصة إبراهيم", en: "The Story of Abraham" }
    range: [124, 141]
    family: stories
    summary:
      ar: "إمامة إبراهيم، ورفع قواعد البيت، ودعاؤه — واتباع ملته الحنيفية."
      en: "Abraham's leadership, raising the House's foundations, his supplication — the upright creed."
    children: []
  - title: { ar: "تحويل القبلة", en: "The Change of Qibla" }
    range: [142, 152]
    family: law
    summary:
      ar: "تحويل القبلة إلى المسجد الحرام، ووسطية هذه الأمة وشهادتها على الناس."
      en: "The qibla turned to the Sacred Mosque; this nation as a middle, witnessing nation."
    children: []
  - title: { ar: "أحكام العبادات والمعاملات", en: "Rulings: Worship and Dealings" }
    range: [153, 242]
    family: law
    summary:
      ar: "أكبر كتلة تشريعية في السورة: الصبر والصلاة، القصاص، الصيام، الحج، القتال، الإنفاق، النكاح والطلاق."
      en: "The largest legal block: patience and prayer, retribution, fasting, pilgrimage, fighting, marriage."
    children:
      - { title: { ar: "الصيام", en: "Fasting" }, range: [183, 187] }
      - { title: { ar: "الحج", en: "The Pilgrimage" }, range: [196, 203] }
      - { title: { ar: "الطلاق والعدة", en: "Divorce and Waiting Period" }, range: [228, 234] }
  - title: { ar: "قصة طالوت وجالوت", en: "Talut and Jalut" }
    range: [243, 252]
    family: stories
    summary:
      ar: "طالوت وجنوده، وداود يقتل جالوت — النصر بالصبر والثبات لا بالكثرة."
      en: "Talut and his troops; David slays Jalut — victory through patience, not numbers."
    children: []
  - title: { ar: "آيات القدرة الإلهية", en: "Signs of Divine Power" }
    range: [253, 260]
    family: faith
    summary:
      ar: "سلسلة من آيات القدرة: الكرسي، ومحاجة النمرود، والذي أماته الله، وإحياء الموتى لإبراهيم."
      en: "A sequence on divine power: the Throne verse, Nimrod's dispute, the century-long death, reviving birds."
    children:
      - { title: { ar: "آية الكرسي", en: "The Throne Verse" }, range: [255, 255] }
      - { title: { ar: "محاجة النمرود", en: "Nimrod's Dispute" }, range: [258, 258] }
      - { title: { ar: "الذي أماته الله مائة عام", en: "Dead a Hundred Years" }, range: [259, 259] }
      - { title: { ar: "إحياء الموتى لإبراهيم", en: "Reviving the Dead for Abraham" }, range: [260, 260] }
  - title: { ar: "الإنفاق والصدقة", en: "Spending and Charity" }
    range: [261, 274]
    family: law
    summary:
      ar: "فضل الصدقة وآدابها، ومضاعفة الأجر عليها أضعافا كثيرة."
      en: "The merit and manners of charity: like a grain growing seven ears."
    children: []
  - title: { ar: "تحريم الربا", en: "The Prohibition of Usury" }
    range: [275, 281]
    family: law
    summary:
      ar: "تحريم الربا تحريما قاطعا، والأمر بتقوى الله، والتذكير بيوم الجزاء."
      en: "Usury categorically forbidden; fear Allah; remember the Day of Recompense."
    children: []
  - title: { ar: "آية الدَّين", en: "The Verse of Debt" }
    range: [282, 282]
    family: law
    summary:
      ar: "أطول آية في القرآن: كتابة الدَّين والإشهاد عليه حفظا للحقوق."
      en: "The longest verse in the Quran: writing down debts and witnesses to protect rights."
    children: []
  - title: { ar: "خواتيم السورة", en: "The Closing Verses" }
    range: [283, 286]
    family: faith
    summary:
      ar: "الأمانة وأداؤها، ودعاء المؤمنين الخالد في خواتيم السورة."
      en: "Trusts and their fulfillment, and the believers' timeless supplication: 'The Messenger believes…'"
    children: []
