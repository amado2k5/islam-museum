surah: 2
slug: al-baqarah
sources_consulted:
- Hand-drawn thematic mind map of Surah Al-Baqarah (user-supplied study notebook)
- في ظلال القرآن — مقدمة سورة البقرة (thematic introduction)
- Standard thematic divisions (Ibn Kathir-style section breaks)
map:
- title:
    ar: صفات المؤمنين
    en: Traits of the Believers
    tr: İnananların Özellikleri
    id: Karakteristik Para Penganut
  range:
  - 1
  - 5
  family: faith
  summary:
    ar: 'افتتاح السورة بوصف المتقين: الإيمان بالغيب وإقام الصلاة والإنفاق — ملامح المؤمن في خمس آيات.'
    en: 'The surah opens describing the God-conscious: belief in the unseen, prayer, spending.'
    tr: 'Surenin başında dindarların tasviri yer alır: görünmeyene inanç, dua kurma ve harcama — müminin beş ayetteki özellikleri.'
    id: 'Pembukaan surah dengan deskripsi orang saleh: iman pada yang tak terlihat, menetapkan doa, dan menghabiskan — ciri-ciri orang beriman dalam lima ayat.'
  children: []
- title:
    ar: صفات الكافرين
    en: Traits of the Disbelievers
    tr: İnançsızların özellikleri
    id: Karakteristik kaum kafir
  range:
  - 6
  - 7
  family: faith
  summary:
    ar: الذين كفروا سواء عليهم أأنذرتهم أم لم تنذرهم؛ ختم الله على قلوبهم وسمعهم وأبصارهم.
    en: Those who disbelieve — warning them or not is the same; Allah has sealed their hearts and hearing.
    tr: Kâr edenleri, uyarsan da uyarmasan da, Allah onların kalplerine, işitmelerine ve görmelerine mühürlemiştir.
    id: Mereka yang kafir, entah kamu memperingatkan atau tidak, Allah telah mengucap di hati, pendengaran, dan penglihatan mereka.
  children: []
- title:
    ar: صفات المنافقين
    en: Traits of the Hypocrites
    tr: İkiyüzlülerin özellikleri
    id: Karakteristik munafik
  range:
  - 8
  - 20
  family: faith
  summary:
    ar: 'أطول وصف للمنافقين في القرآن: يخادعون الله، في قلوبهم مرض، وإذا لقوا المؤمنين قالوا آمنا.'
    en: 'The longest portrait of the hypocrites: they deceive Allah, sickness in their hearts.'
    tr: 'Kur''an''daki en uzun münafıklar tanımı şudur: Allah''ı kalplerinde hastalıkla kandırırlar ve inananlarla karşılaştıklarında, ''İnanıyoruz'' derler.'
    id: 'Deskripsi terpanjang tentang munafik dalam Al-Qur''an adalah: Mereka menipu Tuhan, dengan penyakit di hati mereka, dan ketika mereka bertemu orang beriman, mereka berkata, ''Kami percaya.'''
  children: []
- title:
    ar: دعوة الناس إلى العبادة
    en: The Call to Worship
    tr: İnsanları ibadete davet etmek
    id: Mengundang orang untuk beribadah
  range:
  - 21
  - 29
  family: faith
  summary:
    ar: نداء الناس إلى عبادة ربهم وحده، والتحدي بالإتيان بسورة من مثله، والبشارة، والتذكير بخلق السماوات والأرض.
    en: '''O mankind, worship your Lord'': the challenge to produce a surah, glad tidings, creation reminded.'
    tr: İnsanları yalnızca Rab'blerine ibadet etmeye çağırmak, O'nun gibi bir sure, müjde getirmeleri ve gökyüzü ile yerin yaratılışını hatırlatmak.
    id: Memanggil orang untuk menyembah Tuhan mereka sendiri, menantang mereka untuk membawa surah seperti Dia, kabar gembira, dan mengingatkan mereka akan penciptaan langit dan bumi.
  children: []
- title:
    ar: قصة آدم
    en: The Story of Adam
    tr: Adam'ın Hikayesi
    id: Kisah Adam
  range:
  - 30
  - 39
  family: stories
  summary:
    ar: خلافة آدم، وسجود الملائكة، ومعصية إبليس، ثم الهبوط إلى الأرض — أول قصص السورة.
    en: Adam's vicegerency, the angels' prostration, Iblis's refusal, then the descent — the first story.
    tr: Adem'in halifeliği, meleklerin secdesi, İblis'in itaatsizliği, ardından yeryüzüne iniş — surenin ilk hikayeleri.
    id: Khalifah Adam, sujud para malaikat, ketidaktaatan Iblis, lalu turun ke bumi — cerita pertama surah.
  children: []
- title:
    ar: خطاب بني إسرائيل
    en: Address to the Children of Israel
    tr: İsrail Çocuklarının Söylemi
    id: Wacana Anak-anak Israel
  range:
  - 40
  - 123
  family: stories
  summary:
    ar: 'أطول خطاب في السورة: تذكير بنعم الله على بني إسرائيل ونقضهم للمواثيق، تتخلله قصص فرعية.'
    en: 'The longest address in the surah: Allah''s favors on the Children of Israel and their broken covenants.'
    tr: 'Suredeki en uzun konuşma: Allah''ın İsrailoğulları üzerindeki nimetlerini ve onların antlaşmalarını bozmalarını, yan hikayelerle serpiştirilmiş bir hatırlatma.'
    id: 'Pidato terpanjang dalam surat: pengingat akan berkat Allah atas anak-anak Israel dan pelanggaran perjanjian mereka, diselingi subplot.'
