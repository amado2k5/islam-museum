map:
- title:
    ar: الرد على المشركين
    en: Answering the Polytheists
    tr: Çoktanrıcılara Yanıt
    id: Tanggapan terhadap para politeis
  range:
  - 1
  - 16
  family: faith
  summary:
    ar: 'ص والقرآن ذي الذكر؛ بل الذين كفروا في عزة وشقاق: تعجبوا من التوحيد، وتواصوا بالثبات على آلهتهم، وشككوا في الوحي.'
    en: 'Sad, and the Quran full of remembrance; the disbelievers in pride and dissent: amazed at oneness, urging steadfastness on their gods, doubting revelation.'
    tr: Kur'an ise anma kitabıdır; aksine, onur ve anlaşmazlıktan inatsızlar tek tanrıcılığa şaşırmış, tanrılarına bağlılık emretmiş, vahyeden şüphe etmişlerdir.
    id: dan Al-Qur'an adalah yang mengenang; sebaliknya, mereka yang tidak percaya pada kehormatan dan perselisihan terpesona oleh monoteisme, mewajibkan keteguhan kepada dewa mereka, dan meragukan wahyu.
  children:
  - title:
      ar: عزة المشركين وشقاقهم
      en: The Deniers' Pride and Dissent
      tr: Çoktanrılıların gururu ve anlaşmazlığı
      id: Kebanggaan dan perselisihan para politeis
    range:
    - 2
    - 3
  - title:
