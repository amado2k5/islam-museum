- title:
    ar: آدم وإبليس
    en: Adam and Iblis
    tr: Adem ve Şeytan
    id: Adam dan Setan
  range:
  - 67
  - 88
  family: stories
  summary:
    ar: قل هو نبأ عظيم؛ إذ قال ربك للملائكة إني خالق بشرا من طين فسجدوا إلا إبليس استكبر، فطُرد وتوعد بإغواء الذرية.
    en: 'Say: it is a tremendous tiding — when your Lord told the angels He would create man from clay, they prostrated except Iblis, who scorned, was expelled, and vowed to mislead.'
    tr: De ki, 'Bu büyük bir haberdir,' çünkü Rabbiniz meleklere dedi ki, 'Ben kilden yaratılmış bir insanım.' Böylece kibirli, kovulan ve çocukları baştan çıkarmakla tehdit eden İblis hariç secde ettiler.
    id: Katakanlah, 'Ini kabar besar,' karena Tuhanmu berkata kepada para malaikat, 'Aku manusia yang diciptakan dari tanah liat.' Maka mereka bersujud kecuali Iblis, yang sombong, diusir, dan mengancam
      akan menggoda keturunan.
  children:
  - title:
      ar: سجود الملائكة واستكبار إبليس
      en: The Angels Prostrate; Iblis Scorns
      tr: Meleklerin secdesi ve Şeytan'ın kibri
      id: Sujud para malaikat dan kesombongan Setan
    range:
