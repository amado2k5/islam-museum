surah: 38
slug: sad
sources_consulted:
  - "tadabbur-alquran.com — مواضيع سورة صاد (1-16، 17-48، 49-66، 67-88)"
  - "ar.wikipedia.org — سورة ص (قصص داود وسليمان وأيوب؛ إبليس)"
map:
  - title: { ar: "الرد على المشركين", en: "Answering the Polytheists" }
    range: [1, 16]
    family: faith
    summary:
      ar: "ص والقرآن ذي الذكر؛ بل الذين كفروا في عزة وشقاق: تعجبوا من التوحيد، وتواصوا بالثبات على آلهتهم، وشككوا في الوحي."
      en: "Sad, and the Quran full of remembrance; the disbelievers in pride and dissent: amazed at oneness, urging steadfastness on their gods, doubting revelation."
    children:
      - { title: { ar: "عزة المشركين وشقاقهم", en: "The Deniers' Pride and Dissent" }, range: [2, 3] }
      - { title: { ar: "التعجب من التوحيد", en: "Amazement at Oneness" }, range: [4, 8] }
  - title: { ar: "قصص الأنبياء الأوابين", en: "Stories of the Oft-Returning Prophets" }
    range: [17, 48]
    family: stories
    summary:
      ar: "اصبر على ما يقولون واذكر عبادنا الأوابين: داود ذا الأيد، وسليمان نعم العبد، وأيوب الصابر، وإبراهيم وذريته أولو الأيدي والأبصار."
      en: "Be patient and remember Our oft-returning servants: David of strength, Solomon the excellent servant, the patient Job, Abraham and his seed of insight."
    children:
      - { title: { ar: "داود", en: "David" }, range: [17, 29] }
      - { title: { ar: "سليمان", en: "Solomon" }, range: [30, 40] }
      - { title: { ar: "أيوب", en: "Job" }, range: [41, 44] }
      - { title: { ar: "إبراهيم وإسحاق ويعقوب", en: "Abraham, Isaac and Jacob" }, range: [45, 47] }
      - { title: { ar: "إسماعيل واليسع وذو الكفل", en: "Ishmael, Elisha and Dhul-Kifl" }, range: [48, 48] }
  - title: { ar: "الثواب والعقاب", en: "Reward and Punishment" }
    range: [49, 66]
    family: faith
    summary:
      ar: "هذا ذكر وإن للمتقين لحسن مآب: جنات عدن؛ وهذا وإن للطاغين لشر مآب: جهنم؛ وتخاصم أهل النار بعضهم مع بعض."
      en: "This is a reminder: for the God-conscious a fine return — Gardens of Eden; for the tyrants an evil return — Hell; the people of the Fire disputing."
    children:
      - { title: { ar: "ثواب المتقين", en: "The God-conscious Rewarded" }, range: [49, 54] }
      - { title: { ar: "عذاب الطاغين", en: "The Tyrants Tormented" }, range: [55, 58] }
      - { title: { ar: "تخاصم أهل النار", en: "The Fire's People Disputing" }, range: [59, 64] }
  - title: { ar: "آدم وإبليس", en: "Adam and Iblis" }
    range: [67, 88]
    family: stories
    summary:
      ar: "قل هو نبأ عظيم؛ إذ قال ربك للملائكة إني خالق بشرا من طين فسجدوا إلا إبليس استكبر، فطُرد وتوعد بإغواء الذرية."
      en: "Say: it is a tremendous tiding — when your Lord told the angels He would create man from clay, they prostrated except Iblis, who scorned, was expelled, and vowed to mislead."
    children:
      - { title: { ar: "سجود الملائكة واستكبار إبليس", en: "The Angels Prostrate; Iblis Scorns" }, range: [71, 76] }
      - { title: { ar: "طرد إبليس ووعيده", en: "Iblis Expelled; His Threat" }, range: [77, 85] }
