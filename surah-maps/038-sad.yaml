- title:
    ar: قصص الأنبياء الأوابين
    en: Stories of the Oft-Returning Prophets
    tr: Geri Dönen Peygamberlerin Hikayeleri
    id: Kisah Para Nabi yang Kembali
  range:
  - 17
  - 48
  family: stories
  summary:
    ar: 'اصبر على ما يقولون واذكر عبادنا الأوابين: داود ذا الأيد، وسليمان نعم العبد، وأيوب الصابر، وإبراهيم وذريته أولو الأيدي والأبصار.'
    en: 'Be patient and remember Our oft-returning servants: David of strength, Solomon the excellent servant, the patient Job, Abraham and his seed of insight.'
    tr: 'Söylediklerine sabırlı olun ve tövbe eden hizmetkârlarımızı unutmayın: elleri olan Davut, en iyi hizmetçi Süleyman, sarsılmaz Eyüp ve eller ve anlayış insanları İbrahim ve soyundan gelenler.'
    id: 'Bersabarlah dengan apa yang mereka katakan, dan ingatlah hamba-hamba Kami yang bertobat: Daud yang bertangan, Salomo yang terbaik dari hamba, Ayub yang teguh, dan Abraham beserta keturunannya,
      umat tangan dan wawasan.'
