- title:
    ar: الثواب والعقاب
    en: Reward and Punishment
    tr: Ödül ve Ceza
    id: Hadiah dan Hukuman
  range:
  - 49
  - 66
  family: faith
  summary:
    ar: 'هذا ذكر وإن للمتقين لحسن مآب: جنات عدن؛ وهذا وإن للطاغين لشر مآب: جهنم؛ وتخاصم أهل النار بعضهم مع بعض.'
    en: 'This is a reminder: for the God-conscious a fine return — Gardens of Eden; for the tyrants an evil return — Hell; the people of the Fire disputing.'
    tr: 'Bu bir hatırlatmadır: ''Doğrular için iyi bir dönüş vardır: Aden bahçeleri; ve zorbalar için en kötü dönüş cehennemdir; cehennem halkı birbirleriyle tartıştı.'''
    id: 'Ini adalah pengingat: ''Memang, bagi orang benar ada balasan yang baik: taman Eden; dan memang, bagi para tiran, balasan terburuk adalah Neraka; dan orang-orang Neraka bertengkar satu sama lain.'''
  children:
