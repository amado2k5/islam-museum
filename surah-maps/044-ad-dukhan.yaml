surah: 44
slug: ad-dukhan
sources_consulted:
  - "arz.wikipedia.org — سورة الدخان (1-6، 7-8، 9-16، 17-33، 34-50، 51-59)"
  - "almalomat.com — سورة الدخان (مشتملات الآيات)"
  - "جواهر العلماء — سورة الدخان بالتفسير الميسر (مقاصد السورة)"
map:
  - title: { ar: "نزول القرآن في ليلة القدر", en: "The Quran Sent Down on the Blessed Night" }
    range: [1, 8]
    family: faith
    summary:
      ar: "حم؛ والكتاب المبين؛ إنا أنزلناه في ليلة مباركة فيها يُفرق كل أمر حكيم؛ رب السماوات والأرض إن كنتم موقنين."
      en: "Ha-Mim; and the clear Book; We sent it down on a blessed night wherein every wise matter is apportioned; Lord of heavens and earth, if you are certain."
    children:
      - { title: { ar: "الليلة المباركة", en: "The Blessed Night" }, range: [3, 4] }
  - title: { ar: "الدخان وتهديد المشركين", en: "The Smoke; Warning the Deniers" }
    range: [9, 16]
    family: faith
    summary:
      ar: "بل هم في شك يلعبون؛ فارتقب يوم تأتي السماء بدخان مبين يغشى الناس؛ إنا كاشفو العذاب قليلا إنكم عائدون."
      en: "They are in doubt, playing; so watch for the Day the sky brings a clear smoke enveloping people; We shall remove the torment a little — yet you will revert."
    children:
      - { title: { ar: "الدخان المبين", en: "The Clear Smoke" }, range: [10, 11] }
      - { title: { ar: "البطشة الكبرى", en: "The Greatest Seizure" }, range: [16, 16] }
  - title: { ar: "قوم فرعون", en: "The People of Pharaoh" }
    range: [17, 33]
    family: stories
    summary:
      ar: "ولقد فتنا قبلهم قوم فرعون وجاءهم رسول كريم؛ فأسر بعبادي ليلا واترك البحر رهوا؛ كم تركوا من جنات وعيون فما بكت عليهم السماء والأرض."
      en: "We tested Pharaoh's people before them, and a noble messenger came; journey with My servants by night, leave the sea parted; how many gardens and springs they left — neither heaven nor earth wept for them."
    children:
      - { title: { ar: "دعوة موسى", en: "Moses's Call" }, range: [17, 22] }
      - { title: { ar: "الغرق", en: "The Drowning" }, range: [23, 24] }
      - { title: { ar: "فما بكت عليهم السماء", en: "Neither Heaven nor Earth Wept" }, range: [25, 29] }
  - title: { ar: "إنكار البعث", en: "Denying Resurrection" }
    range: [34, 39]
    family: faith
    summary:
      ar: "إن هؤلاء ليقولون إن هي إلا موتتنا الأولى وما نحن بمنشرين فأتوا بآبائنا؛ وما خلقنا السماوات والأرض وما بينهما لاعبين."
      en: "They say: there is only our first death, we shall not be raised — bring back our forefathers; We did not create the heavens and earth and what is between in play."
    children: []
  - title: { ar: "يوم الفصل والزقوم", en: "The Day of Decision; Zaqqum" }
    range: [40, 50]
    family: faith
    summary:
      ar: "إن يوم الفصل ميقاتهم أجمعين؛ إن شجرة الزقوم طعام الأثيم كالمهل يغلي في البطون؛ ذق إنك أنت العزيز الكريم."
      en: "The Day of Decision is their appointed time, all together; the tree of Zaqqum is the food of the sinful, like molten metal boiling in bellies — taste, you the mighty, the noble."
    children:
      - { title: { ar: "يوم الفصل", en: "The Day of Decision" }, range: [40, 42] }
      - { title: { ar: "شجرة الزقوم", en: "The Tree of Zaqqum" }, range: [43, 46] }
  - title: { ar: "نعيم المتقين", en: "The Bliss of the God-conscious" }
    range: [51, 59]
    family: faith
    summary:
      ar: "إن المتقين في مقام أمين؛ في جنات وعيون يلبسون من سندس وإستبرق؛ وزوجناهم بحور عين؛ فإنما يسرناه بلسانك لعلهم يتذكرون."
      en: "The God-conscious in a secure station; in Gardens and springs, wearing silk and brocade; wed to wide-eyed maidens; We made it easy in your tongue that they may remember."
    children:
      - { title: { ar: "مقام أمين", en: "A Secure Station" }, range: [51, 57] }
