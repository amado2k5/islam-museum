surah: 44
slug: ad-dukhan
sources_consulted:
- arz.wikipedia.org — سورة الدخان (1-6، 7-8، 9-16، 17-33، 34-50، 51-59)
- almalomat.com — سورة الدخان (مشتملات الآيات)
- جواهر العلماء — سورة الدخان بالتفسير الميسر (مقاصد السورة)
map:
- title:
    ar: نزول القرآن في ليلة القدر
    en: The Quran Sent Down on the Blessed Night
    tr: Kur'an'ın Ferman Gecesinde Vahiy Tarihi
    id: Wahyu Al-Qur'an pada Malam Dekrit
  range:
  - 1
  - 8
  family: faith
  summary:
    ar: حم؛ والكتاب المبين؛ إنا أنزلناه في ليلة مباركة فيها يُفرق كل أمر حكيم؛ رب السماوات والأرض إن كنتم موقنين.
    en: Ha-Mim; and the clear Book; We sent it down on a blessed night wherein every wise matter is apportioned; Lord of heavens and earth, if you are certain.
    tr: Ve berrak Kitap; gerçekten de onu her bilgece ayrılan kutsanmış bir gecede indirdik; eğer emin olsan göklerin ve yerin Rabbisi.
    id: Dan Kitab yang jelas; memang, Kami mengirimkannya pada malam yang diberkati di mana setiap urusan bijak dipisahkan; Tuhan langit dan bumi, jika Engkau yakin.
  children:
  - title:
      ar: الليلة المباركة
      en: The Blessed Night
      tr: Kutsanmış Gece
      id: Malam yang Diberkati
    range:
    - 3
    - 4
- title:
    ar: الدخان وتهديد المشركين
    en: The Smoke; Warning the Deniers
    tr: Duman ve çoktanrılıların tehdidi
    id: Asap dan ancaman para politeis
  range:
  - 9
  - 16
  family: faith
  summary:
    ar: بل هم في شك يلعبون؛ فارتقب يوم تأتي السماء بدخان مبين يغشى الناس؛ إنا كاشفو العذاب قليلا إنكم عائدون.
    en: They are in doubt, playing; so watch for the Day the sky brings a clear smoke enveloping people; We shall remove the torment a little — yet you will revert.
    tr: Terk ediyorlar ve oyun oynuyorlar; gökyüzünün berrak dumanla kaplanacağı günü bekleyin; biz cezayı biraz da olsa göstereceğiz. Gerçekten geri döneceksiniz.
    id: Sebaliknya, mereka sedang ragu dan bermain; maka nantikan Hari ketika langit akan datang dengan asap jernih menutupi orang-orang; memang, Kami akan sedikit mengungkapkan hukuman. Memang, kamu akan
      kembali.
  children:
  - title:
      ar: الدخان المبين
      en: The Clear Smoke
      tr: Görünür duman
      id: Asap yang terlihat
    range:
    - 10
    - 11
  - title:
      ar: البطشة الكبرى
      en: The Greatest Seizure
      tr: Büyük Zorbalık
      id: Bullying Besar
    range:
    - 16
    - 16
- title:
    ar: قوم فرعون
    en: The People of Pharaoh
    tr: Firavun'un halkı
    id: Umat Firaun
  range:
  - 17
  - 33
  family: stories
  summary:
    ar: ولقد فتنا قبلهم قوم فرعون وجاءهم رسول كريم؛ فأسر بعبادي ليلا واترك البحر رهوا؛ كم تركوا من جنات وعيون فما بكت عليهم السماء والأرض.
    en: We tested Pharaoh's people before them, and a noble messenger came; journey with My servants by night, leave the sea parted; how many gardens and springs they left — neither heaven nor earth wept
      for them.
    tr: Ve onlardan önce Firavun'un halkını sınattık, onlara soylu bir Elçi geldi; gece kullarımı aldı ve denizi huzura kavuşturdu; geride ne kadar çok bahçe ve kaynak bıraktılar, ama ne gökler ne de yer
      onlar için ağladı.
    id: Dan di hadapan mereka, Kami menguji umat Firaun, dan seorang Utusan mulia datang kepada mereka; Dia mengambil hamba-Ku pada malam hari dan meninggalkan laut dalam keadaan tenang; berapa banyak taman
      dan mata air yang mereka tinggalkan, namun langit maupun bumi tidak menangisi mereka.
  children:
  - title:
      ar: دعوة موسى
      en: Moses's Call
      tr: Musa'nın Çağrısı
      id: Panggilan Musa
    range:
    - 17
    - 22
  - title:
      ar: الغرق
      en: The Drowning
      tr: boğulma
      id: tenggelam
    range:
    - 23
    - 24
  - title:
      ar: فما بكت عليهم السماء
      en: Neither Heaven nor Earth Wept
      tr: Gökyüzü onlar için ağlamadı
      id: Jadi langit tidak menangis untuk mereka
    range:
    - 25
    - 29
- title:
    ar: إنكار البعث
    en: Denying Resurrection
    tr: Baas inkârı
    id: Penolakan Baath
  range:
  - 34
  - 39
  family: faith
  summary:
    ar: إن هؤلاء ليقولون إن هي إلا موتتنا الأولى وما نحن بمنشرين فأتوا بآبائنا؛ وما خلقنا السماوات والأرض وما بينهما لاعبين.
    en: 'They say: there is only our first death, we shall not be raised — bring back our forefathers; We did not create the heavens and earth and what is between in play.'
    tr: Bu insanlar der ki, 'Bu sadece ilk ölümümüzdür, biz dağılmaz değiliz.' O halde atalarımızı getirin; gökleri ve yeri ve aralarındaki olanı oyuncak olarak yaratmadık.
    id: Orang-orang ini berkata, 'Ini hanya kematian pertama kita, dan kita bukan penyebar.' Maka bawalah leluhur kita; kita juga tidak menciptakan langit dan bumi serta apa yang ada di antara mereka sebagai
      mainan.
  children: []
- title:
    ar: يوم الفصل والزقوم
    en: The Day of Decision; Zaqqum
    tr: Ayrılık ve Zaqqum günü
    id: Hari pemisahan dan Zaqqum
  range:
  - 40
  - 50
  family: faith
  summary:
    ar: إن يوم الفصل ميقاتهم أجمعين؛ إن شجرة الزقوم طعام الأثيم كالمهل يغلي في البطون؛ ذق إنك أنت العزيز الكريم.
    en: The Day of Decision is their appointed time, all together; the tree of Zaqqum is the food of the sinful, like molten metal boiling in bellies — taste, you the mighty, the noble.
    tr: Ayrılık Günü onların belirlenen zamanıdır; Zeqqum ağacı günahkarların yiyeceğidir; Kudretli ve cömert olduğunu tat.
    id: Hari Pemisahan adalah waktu yang telah ditetapkan bagi mereka; pohon Zaqqum adalah makanan bagi orang berdosa seperti menelan yang mendidih di perut; rasakanlah bahwa Engkau adalah Yang Perkasa,
      Yang Dermawan.
  children:
  - title:
      ar: يوم الفصل
      en: The Day of Decision
      tr: Dönem Günü
      id: Hari Semester
    range:
    - 40
    - 42
  - title:
      ar: شجرة الزقوم
      en: The Tree of Zaqqum
      tr: Zaqqum ağacı
      id: Pohon Zaqqum
    range:
    - 43
    - 46
- title:
    ar: نعيم المتقين
    en: The Bliss of the God-conscious
    tr: Dindarların Mutluluğu
    id: Kebahagiaan Orang Saleh
  range:
  - 51
  - 59
  family: faith
  summary:
    ar: إن المتقين في مقام أمين؛ في جنات وعيون يلبسون من سندس وإستبرق؛ وزوجناهم بحور عين؛ فإنما يسرناه بلسانك لعلهم يتذكرون.
    en: The God-conscious in a secure station; in Gardens and springs, wearing silk and brocade; wed to wide-eyed maidens; We made it easy in your tongue that they may remember.
    tr: Gerçekten de doğru olanlar güvenilir bir konumdadır; bahçelerde ve pınarlarda, güzel ve baş döndürücü giysiler içindedir; ve biz onları göz denizleriyle evlendirdik; sadece hatırlamaları için dilinde
      hoş hale getirdik.
    id: Memang, orang benar berada dalam posisi yang dapat dipercaya; di taman dan mata air berpakaian indah dan memabukkan; dan Kami telah menikahkan mereka dengan lautan mata; Kami hanya membuatnya menyenangkan
      dalam bahasa Engkau agar mereka mengingat.
  children:
  - title:
      ar: مقام أمين
      en: A Secure Station
      tr: Makam Amin
      id: Maqam Amin
    range:
    - 51
    - 57
