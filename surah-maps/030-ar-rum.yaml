map:
- title:
    ar: غلبة الروم والوعد بالنصر
    en: The Romans and the Promise of Victory
    tr: Romalıların Zaferi ve Zafer Vaadi
    id: Kemenangan Romawi dan Janji Kemenangan
  range:
  - 1
  - 7
  family: faith
  summary:
    ar: غُلبت الروم وسيغلبون في بضع سنين؛ لله الأمر من قبل ومن بعد، ووعد الله لا يُخلف.
    en: The Romans were defeated and will prevail within years; command belongs to Allah before and after, and His promise never fails.
    tr: Romalılar yenildi ve birkaç yıl içinde yenilecekler; öncesi ve sonrası Tanrı'ya aittir ve Tanrı'nın vaadi kırılmazdır.
    id: Orang Romawi telah dikalahkan dan akan dikalahkan dalam beberapa tahun; urusan sebelum dan sesudahnya milik Tuhan, dan janji Tuhan tidak dapat dilanggar.
  children: []
- title:
    ar: الآيات الكونية
    en: The Cosmic Signs
    tr: Kozmik İşaretler
    id: Tanda Kosmik
  range:
  - 8
  - 32
  family: faith
  summary:
    ar: 'دعوة للتفكر في الخلق: الإنسان من تراب، والزوجية والمودة، واختلاف الألسنة، والبرق والمطر، وحياة الأرض بعد موتها.'
    en: 'A call to reflect on creation: man from dust, spouses and affection, tongues, lightning and rain, the earth revived after death.'
    tr: 'Yaratılış üzerine düşünmeye bir davet: insanı tozdan, evlilikten ve sevgiden, dil farklılıkları, yıldırım ve yağmur, ve ölümünden sonraki dünyanın yaşamı.'
    id: 'Sebuah undangan untuk merenungkan penciptaan: manusia dari debu, pernikahan dan kasih sayang, perbedaan bahasa, petir dan hujan, serta kehidupan bumi setelah kematiannya.'
  children:
  - title:
      ar: الزوجية والمودة
      en: Spouses and Affection
      tr: Evlilik ve sevgi
      id: Pernikahan dan kasih sayang
    range:
    - 21
    - 21
  - title:
      ar: البرق والمطر
      en: Lightning and Rain
      tr: Yıldırım ve yağmur
      id: Petir dan hujan
    range:
    - 24
    - 24
- title:
    ar: الرزق والفساد في الأرض
    en: Provision and Corruption on Earth
    tr: Yeryüzündeki geçim kaynakları ve yolsuzluk
    id: Penghidupan dan korupsi di bumi
  range:
  - 33
  - 42
  family: faith
  summary:
    ar: تقلب الإنسان بين الضر والرخاء، وذم الربا، وظهور الفساد في البر والبحر بما كسبت أيدي الناس.
    en: Man's swing between hardship and ease, the condemnation of usury, and corruption appearing on land and sea by people's deeds.
    tr: İnsan, zarar ile refah, tefeciliğin kınanması ve insanların elde ettiği yolsuzluk nedeniyle kara ve denizde ortaya çıkan yolsuzluk arasında gidip gelir.
    id: Manusia berfluktuasi antara bahaya dan kemakmuran, kecaman riba, dan munculnya korupsi di darat dan laut karena apa yang telah diperoleh oleh tangan manusia.
  children:
  - title:
      ar: ذم الربا
      en: Condemnation of Usury
      tr: Tefeciliğin kınanması
      id: Kecaman terhadap riba
    range:
    - 39
    - 39
  - title:
      ar: ظهر الفساد في البر والبحر
      en: Corruption on Land and Sea
      tr: Yolsuzluk kara ve denizde ortaya çıktı
      id: Korupsi muncul di darat dan laut
    range:
    - 41
    - 41
- title:
    ar: اتباع الدين وعاقبة المجرمين
    en: Holding to the Religion; the Guilty
    tr: Din takipçileri ve suçluların kaderi
    id: Pengikut agama dan nasib para penjahat
  range:
  - 43
  - 51
  family: faith
  summary:
    ar: أمر بإقامة الوجه للدين حنيفا على الفطرة، مع الاعتبار بمصير المكذبين من قبل والرياح والسحاب.
    en: Command to set one's face to the upright religion upon the natural disposition, heeding the fate of past deniers.
    tr: Dinin yüzünü doğal eğilime göre dik bir şekilde kurmasını, önceden inkar edenlerin kaderini, rüzgarları ve bulutları dikkate alarak emretti.
    id: Ia memerintahkan untuk menetapkan wajah agama yang tegak sesuai dengan sifat alami, dengan mempertimbangkan nasib mereka yang menyangkal sebelumnya, angin, dan awan.
  children: []
- title:
    ar: هداية النبي وقدرة الله في الخلق
    en: The Prophet's Guidance; Allah's Power
    tr: Peygamberin rehberliği ve Tanrı'nın yaratılıştaki gücü
    id: Panduan nabi dan kuasa Allah dalam penciptaan
  range:
  - 52
  - 54
  family: faith
  summary:
    ar: إنك لا تُسمع الموتى؛ والله الذي خلق الإنسان من ضعف ثم قوة ثم ضعف وشيبة.
    en: You cannot make the dead hear; and Allah who created man from weakness, then strength, then weakness and grey hair.
    tr: Ölüleri duymuyorsun; önce zayıflıktan, sonra güçten, sonra zayıflıktan ve gri saçlardan insanı yaratan Tanrı'ya adına.
    id: Kamu tidak mendengar orang mati; demi Tuhan, yang menciptakan manusia dari kelemahan, lalu kekuatan, lalu kelemahan dan rambut beruban.
  children: []
- title:
    ar: أحوال الناس يوم القيامة
    en: People on the Day of Resurrection
    tr: Kıyamet Günü'nde halkın koşulları
    id: Kondisi orang-orang pada Hari Penghakiman
  range:
  - 55
  - 57
  family: faith
  summary:
    ar: يوم تقوم الساعة يُقسم المجرمون ما لبثوا غير ساعة، ولا ينفع الظالمين معذرتهم.
    en: When the Hour comes the guilty will swear they tarried but an hour; no excuse will avail the wrongdoers.
    tr: Saat belirlendiği gün, suçlular yemin edecek; sadece bir saat kalacaklar ve suçlular onların bahanelerinden fayda sağlamayacak.
    id: Pada Hari Waktu ditetapkan, para penjahat akan bersumpah; mereka tidak akan tinggal hanya satu jam, dan para pelaku tidak akan mendapat alasan dari mereka.
  children: []
- title:
    ar: الأمثال والصبر
    en: The Parables and Patience
    tr: Atasözleri ve sabır
    id: Amsal dan kesabaran
  range:
  - 58
  - 60
  family: faith
  summary:
    ar: ضُرب للناس في القرآن من كل مثل فأعرضوا؛ فاصبر إن وعد الله حق ولا يستخفنك الذين لا يوقنون.
    en: Every parable was struck for people in the Quran, yet they turned away; so be patient — Allah's promise is true.
    tr: Kur'an'da insanlara her örnek vermiştir, yüz çevirin; sabrah edin, çünkü Allah'ın vaadi doğrudur ve kesin olmayanların sizi hafife almamasına izin verin.
    id: Dia telah memberikan setiap contoh bagi manusia dalam Al-Qur'an, maka berpalinglah; maka bersabarlah, karena janji Allah itu benar, dan jangan biarkan mereka yang tidak yakin menganggapmu remeh.
  children: []
