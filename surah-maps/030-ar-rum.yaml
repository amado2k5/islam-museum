surah: 30
slug: ar-rum
sources_consulted:
  - "arz.wikipedia.org — سورة الروم (المواضيع: 1-7، 8-32، 33-42، 43-51، 52-54، 55-57، 58-60)"
  - "khutabaa.com — سورة الروم (الآيات الكونية وضرب الأمثال)"
  - "quran.inoor.ir — محتوى وموضوعات سورة الروم (سبعة أقسام)"
map:
  - title: { ar: "غلبة الروم والوعد بالنصر", en: "The Romans and the Promise of Victory" }
    range: [1, 7]
    family: faith
    summary:
      ar: "غُلبت الروم وسيغلبون في بضع سنين؛ لله الأمر من قبل ومن بعد، ووعد الله لا يُخلف."
      en: "The Romans were defeated and will prevail within years; command belongs to Allah before and after, and His promise never fails."
    children: []
  - title: { ar: "الآيات الكونية", en: "The Cosmic Signs" }
    range: [8, 32]
    family: faith
    summary:
      ar: "دعوة للتفكر في الخلق: الإنسان من تراب، والزوجية والمودة، واختلاف الألسنة، والبرق والمطر، وحياة الأرض بعد موتها."
      en: "A call to reflect on creation: man from dust, spouses and affection, tongues, lightning and rain, the earth revived after death."
    children:
      - { title: { ar: "الزوجية والمودة", en: "Spouses and Affection" }, range: [21, 21] }
      - { title: { ar: "البرق والمطر", en: "Lightning and Rain" }, range: [24, 24] }
  - title: { ar: "الرزق والفساد في الأرض", en: "Provision and Corruption on Earth" }
    range: [33, 42]
    family: faith
    summary:
      ar: "تقلب الإنسان بين الضر والرخاء، وذم الربا، وظهور الفساد في البر والبحر بما كسبت أيدي الناس."
      en: "Man's swing between hardship and ease, the condemnation of usury, and corruption appearing on land and sea by people's deeds."
    children:
      - { title: { ar: "ذم الربا", en: "Condemnation of Usury" }, range: [39, 39] }
      - { title: { ar: "ظهر الفساد في البر والبحر", en: "Corruption on Land and Sea" }, range: [41, 41] }
  - title: { ar: "اتباع الدين وعاقبة المجرمين", en: "Holding to the Religion; the Guilty" }
    range: [43, 51]
    family: faith
    summary:
      ar: "أمر بإقامة الوجه للدين حنيفا على الفطرة، مع الاعتبار بمصير المكذبين من قبل والرياح والسحاب."
      en: "Command to set one's face to the upright religion upon the natural disposition, heeding the fate of past deniers."
    children: []
  - title: { ar: "هداية النبي وقدرة الله في الخلق", en: "The Prophet's Guidance; Allah's Power" }
    range: [52, 54]
    family: faith
    summary:
      ar: "إنك لا تُسمع الموتى؛ والله الذي خلق الإنسان من ضعف ثم قوة ثم ضعف وشيبة."
      en: "You cannot make the dead hear; and Allah who created man from weakness, then strength, then weakness and grey hair."
    children: []
  - title: { ar: "أحوال الناس يوم القيامة", en: "People on the Day of Resurrection" }
    range: [55, 57]
    family: faith
    summary:
      ar: "يوم تقوم الساعة يُقسم المجرمون ما لبثوا غير ساعة، ولا ينفع الظالمين معذرتهم."
      en: "When the Hour comes the guilty will swear they tarried but an hour; no excuse will avail the wrongdoers."
    children: []
  - title: { ar: "الأمثال والصبر", en: "The Parables and Patience" }
    range: [58, 60]
    family: faith
    summary:
      ar: "ضُرب للناس في القرآن من كل مثل فأعرضوا؛ فاصبر إن وعد الله حق ولا يستخفنك الذين لا يوقنون."
      en: "Every parable was struck for people in the Quran, yet they turned away; so be patient — Allah's promise is true."
    children: []
