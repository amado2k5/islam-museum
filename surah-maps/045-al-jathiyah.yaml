map:
- title:
    ar: آيات الله في الخلق
    en: God's Signs in Creation
    tr: Yaratılıştaki Tanrı İşaretleri
    id: Tanda-tanda Tuhan dalam Penciptaan
  range:
  - 1
  - 6
  family: faith
  summary:
    ar: حم؛ تنزيل الكتاب من الله العزيز الحكيم؛ إن في السماوات والأرض لآيات للمؤمنين وفي خلقكم وما يبث من دابة واختلاف الليل والنهار.
    en: Ha-Mim; the sending down of the Book from God, the Mighty, the Wise; in the heavens and earth are signs for believers — in your creation, in the creatures scattered, in night and day.
    tr: 'Hımm; Yüce ve Bilgin Allah''tan Kitabın indirilişi: Gerçekten gökte ve yerde, müminler için, yaratımında ve yaratılışında ve gece ile gündüzün dönüşümünde işaretler vardır.'
    id: 'Hum; wahyu Kitab dari Allah, Yang Maha Kuasa, Yang Bijaksana: Sesungguhnya, di langit dan bumi terdapat tanda-tanda bagi orang beriman, dan dalam ciptaan-Mu serta apa yang tersebar makhluk dan
      pergantian siang dan malam.'
  children:
  - title:
      ar: آيات للمؤمنين
      en: Signs for Believers
      tr: İnananlar İçin Ayetler
      id: Ayat-ayat untuk Orang Percaya
    range:
    - 3
    - 5
- title:
    ar: تهديد المكذبين
    en: Threat to the Deniers
    tr: Yalancıların tehdidi
    id: Ancaman para pembohong
  range:
  - 7
  - 11
  family: faith
  summary:
    ar: ويل لكل أفاك أثيم يسمع آيات الله تتلى عليه ثم يصر مستكبرا؛ أولئك لهم عذاب مهين من ورائهم جهنم.
    en: Woe to every sinful liar who hears God's verses recited then persists arrogantly; they have a humiliating torment, and Hell behind them.
    tr: Allah'ın ayetlerini dinleyip sonra kibirle ısrar eden her günahkar aptalın vay hası; çünkü onların aşağılayıcı bir cezası vardır, arkalarında cehennem vardır.
    id: Celakalah setiap orang berdosa yang mendengar ayat-ayat Allah dibacakan kepadanya lalu bersinggung dengan sombong; karena mereka akan mendapat hukuman yang memalukan, di belakangnya adalah Neraka.
  children:
  - title:
      ar: الأفاك الأثيم
      en: The Sinful Liar
      tr: Kötü İftiracılar
      id: Para Pencemaran Nama Jahat
    range:
    - 7
    - 8
- title:
    ar: نعم الله وبنو إسرائيل
    en: God's Favors; the Children of Israel
    tr: Tanrı'ya ve İsrailoğullarına Evet
    id: Ya untuk Allah dan anak-anak Israel
  range:
  - 12
  - 22
  family: faith
  summary:
    ar: الله الذي سخر لكم البحر لتجري الفلك فيه؛ وآتينا بني إسرائيل الكتاب والحكم والنبوة ورزقناهم؛ أم حسب الذين اجترحوا السيئات أن نجعلهم كالذين آمنوا.
    en: God subjected the sea to you so ships may sail; We gave the Children of Israel the Book, judgment and prophethood; do evildoers think We shall make them like the believers?
    tr: Tanrı, denizin size teslim edilmesi için gemileri içinde seyretme yapan Tanrı'dır; biz İsrailoğullarına Kutsal Kitap, Yargı ve Peygamberlik verdik, onlara sağladık; yoksa kötülük edenlerin onları
      iman edenlere benzetmesi yeterli midir?
    id: Allah adalah Dia yang menyerahkan laut kepada kalian agar kapal-kapal dapat berlayar di dalamnya; dan Kami memberikan Kitab Suci, penghakiman, dan kenabian kepada anak-anak Israel, dan menyediakan
      untuk mereka; atau apakah cukup bagi mereka yang berbuat jahat untuk menjadikan mereka seperti orang yang beriman?
  children:
  - title:
      ar: تسخير البحر
      en: The Subjected Sea
      tr: Denizi Kullanmak
      id: Memanfaatkan Laut
    range:
    - 12
    - 13
  - title:
      ar: شريعة من الأمر
      en: A Path of the Command
      tr: Bir yasa
      id: Sebuah hukum
    range:
    - 18
    - 18
- title:
    ar: الضلال والجزاء
    en: Misguidance and Recompense
    tr: Yanlış Yönlendirme ve Cezalandırma
    id: Pengalihan dan Hukuman yang Salah
  range:
  - 23
  - 35
  family: faith
  summary:
    ar: أفرأيت من اتخذ إلهه هواه وأضله الله على علم؛ وقالوا ما هي إلا حياتنا الدنيا؛ ويوم تقوم الساعة يومئذ يخسر المبطلون؛ وترى كل أمة جاثية.
    en: 'Have you seen one who takes his desire as god, whom God misguided knowingly; they say: only our worldly life — bring our forefathers; on the Hour the falsifiers lose; you will see every nation
      kneeling.'
    tr: 'Arzusunu tanrısı sanan ve Allah''ın bilerek yoldan saptırdığı birini gördün mü? Ve onlar şöyle derler: ''Bu bizim dünyamızdan başka bir şey değildir; ve Kıyamet Günü, sahtecilerin kaybedeceği zamandır;
      ve her ummatın diz çöktüğünü göreceksiniz.'''
    id: Pernahkah kamu melihat seseorang yang menganggap keinginannya sebagai tuhan dan yang Allah sesatkan dengan sadar; dan mereka berkata, 'Itu tidak lain adalah kehidupan duniawi kita; dan Hari Kebangkitan,
      itulah saat para pemalsu akan kalah; dan kamu akan melihat setiap bangsa berlutut.'
  children:
  - title:
      ar: من اتخذ إلهه هواه
      en: Who Takes His Desire as God
      tr: Sevgisini bir tanrı olarak gören
      id: Yang menganggap cintanya sebagai dewa
    range:
    - 23
    - 23
  - title:
      ar: كل أمة جاثية
      en: Every Nation Kneeling
      tr: Her millet diz çöküyor
      id: Setiap bangsa berlutut
    range:
    - 28
    - 29
- title:
    ar: الحمد والكبرياء
    en: Praise; the Majesty
    tr: Övgü ve gurur
    id: Pujian dan kebanggaan
  range:
  - 36
  - 37
  family: faith
  summary:
    ar: فلله الحمد رب السماوات ورب الأرض رب العالمين؛ وله الكبرياء في السماوات والأرض وهو العزيز الحكيم.
    en: To God belongs praise, Lord of the heavens, Lord of the earth, Lord of the worlds; His is the majesty in the heavens and the earth, and He is the Mighty, the Wise.
    tr: Tüm övgüler göklerin Rabbi ve yeryüzünün Rabbi, alemlerin Rabbi Allah'a aittir; göklerin ve yerin kibri O'na aittir, O Yüce ve Bilge'dir.
    id: Segala puji adalah milik Allah, Tuhan langit dan Tuhan bumi, Tuhan segala alam; dan kepujian-Nya adalah kesombongan di langit dan bumi, dan Dia adalah Yang Maha Kuasa, Yang Bijaksana.
  children: []
