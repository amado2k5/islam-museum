surah: 45
slug: al-jathiyah
sources_consulted:
  - "arz.wikipedia.org — سورة الجاثية (1-6، 7-11، 12-22، 23-35، 36-37)"
  - "tadabbur-alquran.com — تدبر سورة الجاثية (1-25، 26-37)"
map:
  - title: { ar: "آيات الله في الخلق", en: "God's Signs in Creation" }
    range: [1, 6]
    family: faith
    summary:
      ar: "حم؛ تنزيل الكتاب من الله العزيز الحكيم؛ إن في السماوات والأرض لآيات للمؤمنين وفي خلقكم وما يبث من دابة واختلاف الليل والنهار."
      en: "Ha-Mim; the sending down of the Book from God, the Mighty, the Wise; in the heavens and earth are signs for believers — in your creation, in the creatures scattered, in night and day."
    children:
      - { title: { ar: "آيات للمؤمنين", en: "Signs for Believers" }, range: [3, 5] }
  - title: { ar: "تهديد المكذبين", en: "Threat to the Deniers" }
    range: [7, 11]
    family: faith
    summary:
      ar: "ويل لكل أفاك أثيم يسمع آيات الله تتلى عليه ثم يصر مستكبرا؛ أولئك لهم عذاب مهين من ورائهم جهنم."
      en: "Woe to every sinful liar who hears God's verses recited then persists arrogantly; they have a humiliating torment, and Hell behind them."
    children:
      - { title: { ar: "الأفاك الأثيم", en: "The Sinful Liar" }, range: [7, 8] }
  - title: { ar: "نعم الله وبنو إسرائيل", en: "God's Favors; the Children of Israel" }
    range: [12, 22]
    family: faith
    summary:
      ar: "الله الذي سخر لكم البحر لتجري الفلك فيه؛ وآتينا بني إسرائيل الكتاب والحكم والنبوة ورزقناهم؛ أم حسب الذين اجترحوا السيئات أن نجعلهم كالذين آمنوا."
      en: "God subjected the sea to you so ships may sail; We gave the Children of Israel the Book, judgment and prophethood; do evildoers think We shall make them like the believers?"
    children:
      - { title: { ar: "تسخير البحر", en: "The Subjected Sea" }, range: [12, 13] }
      - { title: { ar: "شريعة من الأمر", en: "A Path of the Command" }, range: [18, 18] }
  - title: { ar: "الضلال والجزاء", en: "Misguidance and Recompense" }
    range: [23, 35]
    family: faith
    summary:
      ar: "أفرأيت من اتخذ إلهه هواه وأضله الله على علم؛ وقالوا ما هي إلا حياتنا الدنيا؛ ويوم تقوم الساعة يومئذ يخسر المبطلون؛ وترى كل أمة جاثية."
      en: "Have you seen one who takes his desire as god, whom God misguided knowingly; they say: only our worldly life — bring our forefathers; on the Hour the falsifiers lose; you will see every nation kneeling."
    children:
      - { title: { ar: "من اتخذ إلهه هواه", en: "Who Takes His Desire as God" }, range: [23, 23] }
      - { title: { ar: "كل أمة جاثية", en: "Every Nation Kneeling" }, range: [28, 29] }
  - title: { ar: "الحمد والكبرياء", en: "Praise; the Majesty" }
    range: [36, 37]
    family: faith
    summary:
      ar: "فلله الحمد رب السماوات ورب الأرض رب العالمين؛ وله الكبرياء في السماوات والأرض وهو العزيز الحكيم."
      en: "To God belongs praise, Lord of the heavens, Lord of the earth, Lord of the worlds; His is the majesty in the heavens and the earth, and He is the Mighty, the Wise."
    children: []
