- title:
    ar: نوح وإبراهيم
    en: Noah and Abraham
    tr: Nuh ve İbrahim
    id: Nuh dan Abraham
  range:
  - 75
  - 113
  family: stories
  summary:
    ar: ولقد نادانا نوح فلنعم المجيبون؛ وإبراهيم إذ حطم الأصنام وأُلقي في النار، ورؤيا الذبح والفداء العظيم.
    en: Noah called upon Us — how excellent the responders; Abraham smashing the idols, cast into the fire, the dream of sacrifice and the great ransom.
    tr: Ve Nuh bize seslendi; ne kadar mükemmeller cevap veriyor; İbrahim, putları kırıp ateşe atıldığında, büyük kurban ve kurtuluş vizyonu.
    id: Dan Nuh memanggil kita; betapa hebatnya para responden; dan Abraham, ketika ia memecahkan berhala dan dilemparkan ke dalam api, serta melihat penglihatan tentang korban besar dan penebusan.
