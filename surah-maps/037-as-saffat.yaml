- 'islamweb.net — في ظلال القرآن: مقدمة سورة الصافات'
map:
- title:
    ar: الصافات والصاحبان
    en: The Ranks; the Two Companions
    tr: El-Safat ve El-Sahiban
    id: Al-Safat dan Al-Sahiban
  range:
  - 1
  - 74
  family: faith
  summary:
    ar: والصافات صفا؛ حفظ السماء من كل شيطان مارد، وإنكار البعث والرد عليه، ومشهد الحشر، ونعيم المخلصين، والقرين في النار، وشجرة الزقوم.
    en: By those ranged in ranks; the heaven guarded from every rebellious devil, resurrection denied and answered, the mustering, the bliss of the sincere, the companion in the Fire, the tree of Zaqqum.
    tr: Ve saffatlar sıraya dizilir; gökyüzünü her asi şeytandan korur, dirilişi reddeder ve çürütür, diriliş sahnesi, kurtarıcıların mutluluğu, ateşteki yoldaş ve Zeqqum ağacı.
    id: Dan para saffat berbaris; melindungi langit dari setiap iblis pemberontak, menolak kebangkitan dan membantahnya, adegan kebangkitan, kebahagiaan para penyelamat, teman dalam api, dan pohon Zaqqum.
  children:
