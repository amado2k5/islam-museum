- title:
    ar: الرد على المشركين
    en: Answering the Polytheists
    tr: Çoktanrıcılara Yanıt
    id: Tanggapan terhadap para politeis
  range:
  - 149
  - 182
  family: faith
  summary:
    ar: فاستفتهم ألربك البنات ولهم البنون؛ وتبرئة الملائكة، ولكل مقام معلوم، وسلام على المرسلين والحمد لله رب العالمين.
    en: '''Ask them: does your Lord have daughters while they have sons?'' — the angels exonerated, each with a known station; peace upon the messengers, praise to Allah.'
    tr: Bu yüzden Rabbin, kızlar ve oğullar, meleklerin arınmasını ve bilinen her konumu istediler, elçilere selam olsun, dünyaların Rabbi Allah'a da şükürler olsun.
    id: Maka mereka meminta pertanyaan kepada Tuhanmu, anak-anak perempuan dan putra; penyucian para malaikat, dan setiap status yang diketahui, dan damai sejahtera atas para rasul, dan puji Allah, Tuhan
      segala alam.
  children:
  - title:
      ar: دعوى البنات لله
      en: Ascribing Daughters to Allah
      tr: Kızların duası Tanrı için
      id: Doa para gadis itu untuk Tuhan
