surah: 37
slug: as-saffat
sources_consulted:
  - "kuttab.com — Surah As-Saffat mind map (1-74، 75-113، 114-148، 149-182)"
  - "islamweb.net — في ظلال القرآن: مقدمة سورة الصافات"
map:
  - title: { ar: "الصافات والصاحبان", en: "The Ranks; the Two Companions" }
    range: [1, 74]
    family: faith
    summary:
      ar: "والصافات صفا؛ حفظ السماء من كل شيطان مارد، وإنكار البعث والرد عليه، ومشهد الحشر، ونعيم المخلصين، والقرين في النار، وشجرة الزقوم."
      en: "By those ranged in ranks; the heaven guarded from every rebellious devil, resurrection denied and answered, the mustering, the bliss of the sincere, the companion in the Fire, the tree of Zaqqum."
    children:
      - { title: { ar: "حفظ السماء من الشياطين", en: "The Heaven Guarded from Devils" }, range: [1, 10] }
      - { title: { ar: "إنكار البعث والرد", en: "Resurrection Denied — Answered" }, range: [11, 21] }
      - { title: { ar: "مشهد الحشر", en: "The Mustering" }, range: [22, 39] }
      - { title: { ar: "نعيم المخلصين", en: "Bliss of the Sincere" }, range: [40, 49] }
      - { title: { ar: "القرينان", en: "The Two Companions" }, range: [50, 61] }
      - { title: { ar: "شجرة الزقوم", en: "The Tree of Zaqqum" }, range: [62, 70] }
  - title: { ar: "نوح وإبراهيم", en: "Noah and Abraham" }
    range: [75, 113]
    family: stories
    summary:
      ar: "ولقد نادانا نوح فلنعم المجيبون؛ وإبراهيم إذ حطم الأصنام وأُلقي في النار، ورؤيا الذبح والفداء العظيم."
      en: "Noah called upon Us — how excellent the responders; Abraham smashing the idols, cast into the fire, the dream of sacrifice and the great ransom."
    children:
      - { title: { ar: "نوح", en: "Noah" }, range: [75, 82] }
      - { title: { ar: "إبراهيم وتحطيم الأصنام", en: "Abraham Smashes the Idols" }, range: [83, 98] }
      - { title: { ar: "رؤيا الذبح والفداء", en: "The Dream of Sacrifice; the Ransom" }, range: [99, 107] }
      - { title: { ar: "سلام على إبراهيم", en: "Peace upon Abraham" }, range: [108, 113] }
  - title: { ar: "موسى وإلياس ولوط ويونس", en: "Moses, Elias, Lot and Jonah" }
    range: [114, 148]
    family: stories
    summary:
      ar: "ولقد مننا على موسى وهارون فنجيناهما؛ وإلياس مع قومه، ولوط إذ نجيناه، ويونس في بطن الحوت ثم القرية المؤمنة."
      en: "We favored Moses and Aaron and delivered them; Elias with his people, Lot delivered, Jonah in the whale then the believing town."
    children:
      - { title: { ar: "موسى وهارون", en: "Moses and Aaron" }, range: [114, 122] }
      - { title: { ar: "إلياس", en: "Elias" }, range: [123, 132] }
      - { title: { ar: "لوط", en: "Lot" }, range: [133, 138] }
      - { title: { ar: "يونس", en: "Jonah" }, range: [139, 148] }
  - title: { ar: "الرد على المشركين", en: "Answering the Polytheists" }
    range: [149, 182]
    family: faith
    summary:
      ar: "فاستفتهم ألربك البنات ولهم البنون؛ وتبرئة الملائكة، ولكل مقام معلوم، وسلام على المرسلين والحمد لله رب العالمين."
      en: "'Ask them: does your Lord have daughters while they have sons?' — the angels exonerated, each with a known station; peace upon the messengers, praise to Allah."
    children:
      - { title: { ar: "دعوى البنات لله", en: "Ascribing Daughters to Allah" }, range: [149, 157] }
      - { title: { ar: "مقامات الملائكة", en: "The Angels' Stations" }, range: [164, 166] }
      - { title: { ar: "سلام على المرسلين", en: "Peace upon the Messengers" }, range: [180, 182] }
