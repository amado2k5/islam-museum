- title:
    ar: موسى وإلياس ولوط ويونس
    en: Moses, Elias, Lot and Jonah
    tr: Musa, İlyas, Lut ve Yunus
    id: Musa, Elias, Lot, dan Yunus
  range:
  - 114
  - 148
  family: stories
  summary:
    ar: ولقد مننا على موسى وهارون فنجيناهما؛ وإلياس مع قومه، ولوط إذ نجيناه، ويونس في بطن الحوت ثم القرية المؤمنة.
    en: We favored Moses and Aaron and delivered them; Elias with his people, Lot delivered, Jonah in the whale then the believing town.
    tr: Ve Musa ile Harun tarafından lütuf edildik ve onları kurtardık; İlyas halkıyla birlikte, Lut onu kurtardığımızda, Yunus balığın karnında, sonra inanan kasaba.
    id: Dan Kami diberkati oleh Musa dan Harun dan menyelamatkan mereka; Elia bersama kaumnya, Lot saat Kami menyelamatkannya, Yunus di perut ikan, lalu kota yang percaya.
