map:
- title:
    ar: خلق الإنسان في كبد
    en: Created in Hardship
    tr: İnsan bir karaciğerde yaratılmıştır
    id: Manusia diciptakan dalam hati
  range:
  - 1
  - 10
  family: faith
  summary:
    ar: 'لا أقسم بهذا البلد وأنت حل بهذا البلد ووالد وما ولد: لقد خلقنا الإنسان في كبد، يظن أن لن يقدر عليه أحد.'
    en: 'I swear by this city — and you are free therein — by parent and offspring: We created man in hardship, yet he thinks none has power over him.'
    tr: 'Sen bu ülkede yaşarken ve bir baba ve doğan şeye yemin etmiyorum: İnsanı bir karaciğerde yarattık, kimsenin üstesinden gelemeyeceğini düşündük.'
    id: 'Aku tidak bersumpah demi negara ini selama kamu hidup di negeri ini dan seorang ayah dan apa yang lahir: Kami menciptakan manusia dalam hati, berpikir tak ada yang bisa mengatasinya.'
  children: []
- title:
    ar: اقتحام العقبة
    en: The Steep Path
    tr: Akabe'nin Baskını
    id: Penyerbuan Aqaba
  range:
  - 11
  - 20
  family: faith
  summary:
    ar: 'فلا اقتحم العقبة: فك رقبة أو إطعام في يوم ذي مسغبة يتيما ذا مقربة أو مسكينا ذا متربة، ثم كان من الذين آمنوا وتواصوا بالصبر والمرحمة.'
    en: 'He has not attempted the steep path: freeing a slave, or feeding on a day of hunger an orphan of kin or a poor man in dust — then being among those who believed and counseled patience and mercy.'
    tr: 'Engeli aşmadı: bir köleyi çözmedi ya da zor bir günde yakın bir akraba ya da muhtaç bir kişiyle yetimi beslemedi. O zaman birbirine sabır ve merhamet konusunda inananlar arasındaydı.'
    id: 'Dia tidak melewati batas: melepaskan ikatan budak atau memberi makan yatim piatu dengan kerabat dekat atau orang yang membutuhkan pada hari kesulitan. Kemudian dia termasuk di antara mereka yang
      percaya dan saling menasihati kesabaran dan belas kasihan.'
  children:
  - title:
      ar: فك رقبة
      en: Freeing a Slave
      tr: Boyun çözüldü
      id: Leher terlepas
    range:
    - 13
    - 13
  - title:
      ar: إطعام اليتيم والمسكين
      en: Feeding Orphan and Poor
      tr: Yetim ve Fakirleri Beslemek
      id: Memberi Makan Anak Yatim dan Miskin
    range:
    - 14
    - 16
