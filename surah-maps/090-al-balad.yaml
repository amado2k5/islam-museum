map:
  - title: { ar: "خلق الإنسان في كبد", en: "Created in Hardship" }
    range: [1, 10]
    family: faith
    summary:
      ar: "لا أقسم بهذا البلد وأنت حل بهذا البلد ووالد وما ولد: لقد خلقنا الإنسان في كبد، يظن أن لن يقدر عليه أحد."
      en: "I swear by this city — and you are free therein — by parent and offspring: We created man in hardship, yet he thinks none has power over him."
    children: []
  - title: { ar: "اقتحام العقبة", en: "The Steep Path" }
    range: [11, 20]
    family: faith
    summary:
      ar: "فلا اقتحم العقبة: فك رقبة أو إطعام في يوم ذي مسغبة يتيما ذا مقربة أو مسكينا ذا متربة، ثم كان من الذين آمنوا وتواصوا بالصبر والمرحمة."
      en: "He has not attempted the steep path: freeing a slave, or feeding on a day of hunger an orphan of kin or a poor man in dust — then being among those who believed and counseled patience and mercy."
    children:
      - { title: { ar: "فك رقبة", en: "Freeing a Slave" }, range: [13, 13] }
      - { title: { ar: "إطعام اليتيم والمسكين", en: "Feeding Orphan and Poor" }, range: [14, 16] }
