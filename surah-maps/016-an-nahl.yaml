map:
- title:
    ar: النعم الدالة على المنعم
    en: Blessings Pointing to the Bestower
    tr: Bağışlayanı gösteren kutsamalar
    id: Berkat yang menunjukkan Sang Pemberi
  range:
  - 1
  - 34
  family: faith
  summary:
    ar: 'سورة النعم: الأنعام والخيل والبحر والنجوم والمطر — تعداد آلاء الله الدالة على وحدانيته.'
    en: 'The surah of blessings: cattle, horses, sea, stars, rain — Allah''s favors listed as proof of His oneness.'
    tr: 'En-Ni''suresi: hayvanlar, atlar, deniz, yıldızlar ve yağmur — Allah''ın birliğini gösteren nimetlerini sayar.'
    id: 'Surah An-Ni''am: ternak, kuda, laut, bintang, dan hujan — menyebutkan berkat Allah yang menandakan keesaan-Nya.'
  children:
  - title:
      ar: الأنعام والخيل
      en: Cattle and Horses
      tr: Sığır ve Atlar
      id: Sapi dan Kuda
    range:
    - 5
    - 8
- title:
    ar: الرد على المشركين
    en: Answering the Polytheists
    tr: Çoktanrıcılara Yanıt
    id: Tanggapan terhadap para politeis
  range:
  - 35
  - 89
  family: faith
  summary:
    ar: إبطال الشرك ووأد البنات، وإيحاء الله إلى النحل وما فيه من شفاء، وضرب الأمثال للناس.
    en: Refuting polytheism and infant burial; Allah inspiring the bee with its healing; parables struck for people.
    tr: Çoktanrıcılığı ve kız çocuklarının öldürülmesini ortadan kaldırmak, Tanrı'nın arılara ilham vermesi ve onları iyileştiren şeyler ile insanlara örnek olma.
    id: Menghapuskan politeisme dan pembunuhan anak perempuan, inspirasi Tuhan bagi lebah dan apa yang menyembuhkan mereka, serta memberi teladan bagi manusia.
  children:
  - title:
      ar: إيحاء النحل
      en: The Bee Inspired
      tr: Arı Önerisi
      id: Saran Lebah
    range:
    - 68
    - 69
- title:
    ar: العدل والإحسان
    en: Justice and Excellence
    tr: Adalet ve Hayırseverlik
    id: Keadilan dan Amal
  range:
  - 90
  - 110
  family: law
  summary:
    ar: الأمر بالعدل والإحسان وإيتاء ذي القربى، والوفاء بالعهود، وتحريم نقض الأيمان.
    en: Commanding justice, excellence, giving kin their due; fulfilling covenants; forbidding broken oaths.
    tr: Adaleti emreder, iyilik gösterir, akrabalara yardım eder, sözleri tutur ve yeminleri bozmayı yasaklar.
    id: Memerintahkan keadilan, kebaikan, memberi kepada kerabat, menepati janji, dan melarang melanggar sumpah.
  children:
  - title:
      ar: آية العدل
      en: The Verse of Justice
      tr: Ayat al-Adl
      id: Ayat al-Adl
    range:
    - 90
    - 90
- title:
    ar: الدعوة بالحكمة
    en: Calling with Wisdom
    tr: Bilgelikle çağrı
    id: Memanggil dengan kebijaksanaan
  range:
  - 111
  - 128
  family: faith
  summary:
    ar: 'من أسلم بعد الفتنة، وإبراهيم أمة وحده، وخاتمة السورة: الدعوة بالحكمة والموعظة الحسنة والصبر.'
    en: 'Those who believed after trial; Abraham a nation alone; the close: call with wisdom, good counsel, patience.'
    tr: 'Sınavdan sonra İslam''ı benimseyen ve İbrahim yalnız bir ulusdu. Surenin sonu: bilgelik, iyi öğüt ve sabırla çağırmak.'
    id: 'Siapa pun yang memeluk Islam setelah ujian, dan Abraham adalah bangsa sendiri. Kesimpulan surat: memanggil dengan kebijaksanaan, nasihat yang baik, dan kesabaran.'
  children:
  - title:
      ar: ادع إلى سبيل ربك
      en: Call to Your Lord's Way
      tr: Rabbinin yoluna dua et
      id: Berdoalah kepada jalan Tuhanmu
    range:
    - 125
    - 125
