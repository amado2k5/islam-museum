surah: 16
slug: an-nahl
sources_consulted:
  - "kuttab.com — Surah An-Nahl mind map (4 blocks: 1-34, 35-89, 90-110, 111-128)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "النعم الدالة على المنعم", en: "Blessings Pointing to the Bestower" }
    range: [1, 34]
    family: faith
    summary:
      ar: "سورة النعم: الأنعام والخيل والبحر والنجوم والمطر — تعداد آلاء الله الدالة على وحدانيته."
      en: "The surah of blessings: cattle, horses, sea, stars, rain — Allah's favors listed as proof of His oneness."
    children:
      - { title: { ar: "الأنعام والخيل", en: "Cattle and Horses" }, range: [5, 8] }
  - title: { ar: "الرد على المشركين", en: "Answering the Polytheists" }
    range: [35, 89]
    family: faith
    summary:
      ar: "إبطال الشرك ووأد البنات، وإيحاء الله إلى النحل وما فيه من شفاء، وضرب الأمثال للناس."
      en: "Refuting polytheism and infant burial; Allah inspiring the bee with its healing; parables struck for people."
    children:
      - { title: { ar: "إيحاء النحل", en: "The Bee Inspired" }, range: [68, 69] }
  - title: { ar: "العدل والإحسان", en: "Justice and Excellence" }
    range: [90, 110]
    family: law
    summary:
      ar: "الأمر بالعدل والإحسان وإيتاء ذي القربى، والوفاء بالعهود، وتحريم نقض الأيمان."
      en: "Commanding justice, excellence, giving kin their due; fulfilling covenants; forbidding broken oaths."
    children:
      - { title: { ar: "آية العدل", en: "The Verse of Justice" }, range: [90, 90] }
  - title: { ar: "الدعوة بالحكمة", en: "Calling with Wisdom" }
    range: [111, 128]
    family: faith
    summary:
      ar: "من أسلم بعد الفتنة، وإبراهيم أمة وحده، وخاتمة السورة: الدعوة بالحكمة والموعظة الحسنة والصبر."
      en: "Those who believed after trial; Abraham a nation alone; the close: call with wisdom, good counsel, patience."
    children:
      - { title: { ar: "ادع إلى سبيل ربك", en: "Call to Your Lord's Way" }, range: [125, 125] }
