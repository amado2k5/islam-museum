map:
- title:
    ar: زكريا ويحيى
    en: Zachariah and John
    tr: Zakaria ve Yahya
    id: Zakaria dan Yahya
  range:
  - 1
  - 15
  family: stories
  summary:
    ar: دعاء زكريا الخفي ليرزق وريثا، والبشارة بيحيى، وآية الصمت ثلاث ليال.
    en: Zachariah's hidden prayer for an heir; John's glad tidings; the sign of three nights' silence.
    tr: Zekeriya'nın gizli bir varis duası, Yahya'ya müjde ve üç gece boyunca sessizlik ayeti.
    id: Doa tersembunyi Zakharia agar diberikan pewaris, kabar bahagia kepada Yahya, dan ayat keheningan selama tiga malam.
  children:
  - title:
      ar: دعاء زكريا
      en: Zachariah's Prayer
      tr: Doaa Zakaria
      id: Doaa Zakaria
    range:
    - 2
    - 6
- title:
    ar: مريم وعيسى
    en: Mary and Jesus
    tr: Meryem ve İsa
    id: Maria dan Yesus
  range:
  - 16
  - 40
  family: stories
  summary:
    ar: اعتزال مريم، والبشارة بغلام زكي، والولادة عند جذع النخلة، وكلام عيسى في المهد.
    en: Mary's withdrawal, the pure boy's glad tidings, birth by the palm trunk, Jesus speaking in the cradle.
    tr: Meryem'in emekliliği, iyi bir çocuk haberi, palmiye gövdesinde doğum ve İsa'nın beşikteki sözleri.
    id: Pensiun Maria, kabar baik tentang anak laki-laki yang baik, kelahiran di batang palem, dan kata-kata Yesus di buaian.
  children:
