    - 33
- title:
    ar: إبراهيم وأبوه
    en: Abraham and His Father
    tr: İbrahim ve babası
    id: Ibrahim dan ayahnya
  range:
  - 41
  - 50
  family: stories
  summary:
    ar: دعوة إبراهيم لأبيه بألطف خطاب، وإعراض الأب، واعتزال إبراهيم لقومه، وهبة إسحاق ويعقوب.
    en: Abraham's gentlest call to his father, the father's refusal, Abraham's withdrawal, Isaac and Jacob granted.
    tr: İbrahim'in babasına nazik bir hitap ile daveti, babasının geri çekilmesi, İbrahim'in halkından çekilişi ve İshak ile Yakup'un hediyesi.
    id: Undangan Abraham kepada ayahnya dengan pidato lembut, mundurnya ayahnya, penarikan Abraham dari umatnya, dan hadiah Ishak serta Yakub.
  children: []
- title:
    ar: سلسلة الأنبياء
    en: The Chain of Prophets
    tr: Peygamberler Serisi
    id: Seri Nabi
  range:
  - 51
  - 65
  family: stories
  summary:
    ar: 'موسى وهارون وإسماعيل وإدريس: الذين أنعم الله عليهم من النبيين، يخرون سجدا وبكيا.'
    en: Moses, Aaron, Ishmael, Idris — the prophets Allah favored, falling prostrate and weeping.
    tr: 'Musa, Harun, İsmail ve İdris: Tanrı''nın peygamberler arasında kutsandığı, secde edip ağlayan kişiler.'
    id: 'Musa, Harun, Ismael, dan Idris: mereka yang telah Allah berkati di antara para nabi, yang sujud dan menangis.'
  children:
