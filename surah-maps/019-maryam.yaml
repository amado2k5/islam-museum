      en: Birth by the Palm
      tr: Palmiye ağacında doğum
      id: Kelahiran di pohon palem
    range:
    - 22
    - 26
  - title:
      ar: كلامه في المهد
      en: Speech in the Cradle
      tr: Sözleri beşikte
      id: Kata-katanya sudah di buaian
    range:
