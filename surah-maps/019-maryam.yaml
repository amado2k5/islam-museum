- title:
    ar: البعث والخاتمة
    en: Resurrection and the Closing
    tr: Baas ve Sonuç
    id: Baath dan Kesimpulan
  range:
  - 66
  - 98
  family: faith
  summary:
    ar: الرد على منكري البعث، ودحض ادعاء الولد لله، وخاتمة السورة بتيسير القرآن باللسان العربي.
    en: Answering resurrection-deniers, refuting any son attributed to Allah, the Quran eased in the Arabic tongue.
    tr: Dirilişi reddedenlerin çürütülmesi, çocuğun Tanrı için olduğu iddiasının çürütülmesi ve Arapça Kur'an'ın kolaylaştırılmasıyla surenin sonlandırılması.
    id: Sebuah penolakan terhadap para penyangkal kebangkitan, menolak klaim bahwa anak itu adalah Tuhan, dan mengakhiri surah dengan memfasilitasi Al-Qur'an dalam bahasa Arab.
  children:
  - title:
      ar: ادعاء الولد
      en: Claiming a Son
      tr: Çocuğun talebi
      id: Klaim anak laki-laki itu
    range:
    - 88
    - 93
