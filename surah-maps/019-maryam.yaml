surah: 19
slug: maryam
sources_consulted:
  - "kuttab.com — Surah Maryam mind map (5 blocks: 1-15, 16-40, 41-50, 51-65, 66-98)"
  - "Standard thematic divisions (cross-checked)"
map:
  - title: { ar: "زكريا ويحيى", en: "Zachariah and John" }
    range: [1, 15]
    family: stories
    summary:
      ar: "دعاء زكريا الخفي ليرزق وريثا، والبشارة بيحيى، وآية الصمت ثلاث ليال."
      en: "Zachariah's hidden prayer for an heir; John's glad tidings; the sign of three nights' silence."
    children:
      - { title: { ar: "دعاء زكريا", en: "Zachariah's Prayer" }, range: [2, 6] }
  - title: { ar: "مريم وعيسى", en: "Mary and Jesus" }
    range: [16, 40]
    family: stories
    summary:
      ar: "اعتزال مريم، والبشارة بغلام زكي، والولادة عند جذع النخلة، وكلام عيسى في المهد."
      en: "Mary's withdrawal, the pure boy's glad tidings, birth by the palm trunk, Jesus speaking in the cradle."
    children:
      - { title: { ar: "البشارة", en: "The Glad Tidings" }, range: [17, 21] }
      - { title: { ar: "الولادة عند النخلة", en: "Birth by the Palm" }, range: [22, 26] }
      - { title: { ar: "كلامه في المهد", en: "Speech in the Cradle" }, range: [29, 33] }
  - title: { ar: "إبراهيم وأبوه", en: "Abraham and His Father" }
    range: [41, 50]
    family: stories
    summary:
      ar: "دعوة إبراهيم لأبيه بألطف خطاب، وإعراض الأب، واعتزال إبراهيم لقومه، وهبة إسحاق ويعقوب."
      en: "Abraham's gentlest call to his father, the father's refusal, Abraham's withdrawal, Isaac and Jacob granted."
    children: []
  - title: { ar: "سلسلة الأنبياء", en: "The Chain of Prophets" }
    range: [51, 65]
    family: stories
    summary:
      ar: "موسى وهارون وإسماعيل وإدريس: الذين أنعم الله عليهم من النبيين، يخرون سجدا وبكيا."
      en: "Moses, Aaron, Ishmael, Idris — the prophets Allah favored, falling prostrate and weeping."
    children:
      - { title: { ar: "موسى وهارون", en: "Moses and Aaron" }, range: [51, 53] }
      - { title: { ar: "إسماعيل وإدريس", en: "Ishmael and Idris" }, range: [54, 57] }
  - title: { ar: "البعث والخاتمة", en: "Resurrection and the Closing" }
    range: [66, 98]
    family: faith
    summary:
      ar: "الرد على منكري البعث، ودحض ادعاء الولد لله، وخاتمة السورة بتيسير القرآن باللسان العربي."
      en: "Answering resurrection-deniers, refuting any son attributed to Allah, the Quran eased in the Arabic tongue."
    children:
      - { title: { ar: "ادعاء الولد", en: "Claiming a Son" }, range: [88, 93] }
