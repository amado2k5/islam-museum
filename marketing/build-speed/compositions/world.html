<template>
  <style>
    #root { position: absolute; inset: 0; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <canvas id="world-canvas" class="clip" data-start="0" data-duration="36" width="1920" height="1080" data-layout-ignore></canvas>
  </div>
  <script>
    (function () {
      // The ground and the dots. A dot is a page (hook), an edge of the graph (the scans) or a file of the artifact.
      const W = 1920, H = 1080, CX = 960, CY = 540, COLS = 96, ROWS = 54, N = COLS * ROWS, CELL = 20;
      const cv = document.getElementById("world-canvas"), ctx = cv.getContext("2d");
      let s = 6496;
      const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const gx = new Float32Array(N), gy = new Float32Array(N), bx = new Float32Array(N), by = new Float32Array(N), dl = new Float32Array(N);
      for (let i = 0; i < N; i++) { gx[i] = ((i % COLS) + 0.5) * CELL; gy[i] = (Math.floor(i / COLS) + 0.5) * CELL; bx[i] = 1330 + rnd() * 180; by[i] = 450 + rnd() * 180; dl[i] = rnd(); }
      const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x), in3 = (x) => x * x * x * x, io = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2);
      const SHAKES = [7.8, 9.6, 31.2];

      function draw(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const g = ctx.createLinearGradient(0, 0, W * 0.36, H); g.addColorStop(0, "#0a2533"); g.addColorStop(1, "#113f4e");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        const ivory = (t >= 9.6 && t < 12) || t >= 31.2;
        if (ivory) { ctx.fillStyle = "#f9f8f6"; const k = t < 12 ? clamp((t - 9.6) / 0.14) : 1; if (k >= 1) ctx.fillRect(0, 0, W, H); else { ctx.beginPath(); ctx.arc(CX, CY, 1150 * k * k, 0, 6.283); ctx.fill(); } }
        let sx = 0, sy = 0;
        for (const h of SHAKES) { const d = t - h; if (d >= 0 && d < 0.4) { const a = 20 * Math.exp(-d * 11); sx += Math.sin(d * 150) * a; sy += Math.cos(d * 117) * a; } }
        ctx.translate(sx, sy);

        if (t < 9.6) {
          // pages, then edges; from 5.4 a scan line crosses them eight times; at the end they are pulled to one point
          const scanning = t >= 5.4 && t < 7.8, k = scanning ? (t - 5.4) / 0.3 : -1, band = scanning ? (k - Math.floor(k)) * (W + 200) - 100 : -9999;
          const pull = in3(clamp((t - 8.5) / 1.06));
          const base = t < 2.4 ? 0.3 : t < 4.8 ? 0.14 : 0.42;
          const sweep = t >= 4.8 && t < 5.4;
          for (let pass = 0; pass < 2; pass++) {
            ctx.fillStyle = pass ? "#f9f8f6" : "#c5a059";
            for (let i = 0; i < N; i++) {
              const near = scanning && Math.abs(gx[i] - band) < 60;
              if ((near ? 1 : 0) !== pass) continue;
              let al = near ? 1 : base;
              if (sweep) al = base * clamp((t - 4.8 - (gy[i] / H) * 0.3) / 0.08);
              if (al <= 0.01) continue;
              const x = gx[i] + (CX - gx[i]) * pull, y = gy[i] + (CY - gy[i]) * pull, sz = near ? 9 : 5;
              ctx.globalAlpha = al; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
            }
          }
          if (scanning) { ctx.globalAlpha = 0.9; ctx.fillStyle = "#f9f8f6"; ctx.fillRect(band - 3, 0, 6, H); }
          ctx.globalAlpha = 1;
        } else if (t >= 24 && t < 26.4) {
          // the artifact: a field of files (right two thirds of the frame) folds into one block
          const p = t - 24;
          for (let i = 0; i < N; i++) {
            if (gx[i] < 860) continue;
            const a = clamp((p - (gy[i] / H) * 0.25) / 0.08);
            const q = io(clamp((p - 0.62 - dl[i] * 0.25) / 0.55));
            const x = gx[i] + (bx[i] - gx[i]) * q, y = gy[i] + (by[i] - gy[i]) * q;
            ctx.globalAlpha = a * (0.55 + 0.45 * q); ctx.fillStyle = q > 0.98 ? "#c5a059" : "#d9765f";
            ctx.fillRect(x - 3, y - 3, 6, 6);
          }
          ctx.globalAlpha = 1;
          const solid = clamp((p - 1.4) / 0.12); if (solid > 0) { ctx.globalAlpha = solid; ctx.fillStyle = "#c5a059"; ctx.fillRect(1330, 450, 180, 180); ctx.globalAlpha = 1; }
        }
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 36, duration: 36, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
