<template>
  <style>
    #root { position: absolute; inset: 0; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  </style>
  <div id="root" data-composition-id="world" data-width="1920" data-height="1080">
    <canvas id="world-canvas" class="clip" data-start="0" data-duration="38.4" width="1920" height="1080" data-layout-ignore></canvas>
  </div>
  <script>
    (function () {
      const W = 1920, H = 1080, CX = 960, CY = 540;
      const D = window.__IM || { pts: [], centuries: {}, arcs: [] };
      const N = D.pts.length;
      const cv = document.getElementById("world-canvas");
      const ctx = cv.getContext("2d");
      // Seeded PRNG (mulberry32): the same film on every render.
      let s = 1448;
      const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const mk = () => new Float32Array(N * 2);
      const order = Array.from({ length: N }, (_, i) => i);
      for (let i = N - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const o = order[i]; order[i] = order[j]; order[j] = o; }
      const delay = new Float32Array(N), phase = new Float32Array(N), light = new Uint8Array(N);
      for (let i = 0; i < N; i++) { delay[i] = rnd(); phase[i] = rnd() * 6.283; light[i] = rnd() < 0.3 ? 1 : 0; }

      const L = {};
      // scatter: the story before the museum
      L.scatter = mk(); for (let i = 0; i < N; i++) { L.scatter[i * 2] = -40 + rnd() * (W + 80); L.scatter[i * 2 + 1] = -40 + rnd() * (H + 80); }
      L.centre = mk(); for (let i = 0; i < N; i++) { L.centre[i * 2] = CX + (rnd() - 0.5) * 6; L.centre[i * 2 + 1] = CY + (rnd() - 0.5) * 6; }
      L.out = mk(); for (let i = 0; i < N; i++) { const a = rnd() * 6.283, r = 1180 + rnd() * 500; L.out[i * 2] = CX + Math.cos(a) * r; L.out[i * 2 + 1] = CY + Math.sin(a) * r; }
      // grid: every record a cell
      L.grid = mk(); { const cols = 84, rows = Math.ceil(N / cols), cw = W / cols, ch = H / rows; for (let k = 0; k < N; k++) { const i = order[k]; L.grid[i * 2] = ((k % cols) + 0.5) * cw; L.grid[i * 2 + 1] = (Math.floor(k / cols) + 0.5) * ch; } }
      // map: real coordinates, equirectangular, 30°W–125°E, 12°S–62°N
      L.map = mk(); { const sc = 1760 / 155; for (let i = 0; i < N; i++) { L.map[i * 2] = 80 + (D.pts[i][0] / 100 + 30) * sc; L.map[i * 2 + 1] = 91 + (62 - D.pts[i][1] / 100) * sc; } }
      // timeline: one column a century, heights from the dated events of the graph
      L.time = mk(); { const keys = []; for (let c = 4; c <= 20; c++) keys.push(c); const total = keys.reduce((a, c) => a + (D.centuries[c] || 0), 0) || 1; const colW = 1760 / keys.length; let k = 0;
        keys.forEach((c, ci) => { const n = ci === keys.length - 1 ? N - k : Math.min(N - k, Math.round(((D.centuries[c] || 0) / total) * N)); for (let j = 0; j < n; j++, k++) { const i = order[k]; L.time[i * 2] = 80 + ci * colW + 12 + (j % 8) * 10.4; L.time[i * 2 + 1] = 905 - Math.floor(j / 8) * 9.4; } }); }
      // rings: a gathering around the number
      L.rings = mk(); { let k = 0, r = 332; while (k < N) { const n = Math.min(N - k, Math.floor((6.283 * r) / 9)); const off = rnd() * 6.283; for (let j = 0; j < n; j++, k++) { const i = order[k], a = off + (j / n) * 6.283; L.rings[i * 2] = CX + Math.cos(a) * r; L.rings[i * 2 + 1] = CY + Math.sin(a) * r; } r += 12; } }
      // shelves: the books, in order
      L.shelves = mk(); { let k = 0; const bases = [330, 630, 930]; outer: for (let sh = 0; sh < 3; sh++) { for (let b = 0; b < 39; b++) { const h = 8 + Math.floor(rnd() * 7), x0 = 90 + b * 45; for (let j = 0; j < h * 3; j++, k++) { if (k >= N) break outer; const i = order[k]; L.shelves[i * 2] = x0 + (j % 3) * 9; L.shelves[i * 2 + 1] = bases[sh] - Math.floor(j / 3) * 9; } } }
        for (; k < N; k++) { const i = order[k]; L.shelves[i * 2] = 90 + rnd() * 1740; L.shelves[i * 2 + 1] = 966; } }
      // star: the outline of the museum's own mark (site/public/brand/logo-mark.svg)
      const STAR = [[60,2],[76.07,21.2],[101.01,18.99],[98.8,43.93],[118,60],[98.8,76.07],[101.01,101.01],[76.07,98.8],[60,118],[43.93,98.8],[18.99,101.01],[21.2,76.07],[2,60],[21.2,43.93],[18.99,18.99],[43.93,21.2]];
      const star = (cx, cy, R, band) => { const a = mk(), sc = R / 58, nPoly = Math.floor(N * 0.72); for (let k = 0; k < N; k++) { const i = order[k]; let x, y;
          if (k < nPoly) { const u = (k / nPoly) * 16, e = Math.floor(u), f = u - e, p = STAR[e], q = STAR[(e + 1) % 16]; x = p[0] + (q[0] - p[0]) * f - 60; y = p[1] + (q[1] - p[1]) * f - 60; const sh = 1 - delay[i] * band; x *= sh; y *= sh; }
          else { const an = ((k - nPoly) / (N - nPoly)) * 6.283, rr = 36 * (1 - delay[i] * band * 0.6); x = Math.cos(an) * rr; y = Math.sin(an) * rr; }
          a[i * 2] = cx + x * sc; a[i * 2 + 1] = cy + y * sc; } return a; };
      L.starBig = star(CX, CY, 500, 0.07);
      L.starLogo = star(524, 470, 128, 0.5);
      L.burst = mk(); for (let i = 0; i < N; i++) { const a = rnd() * 6.283, r = 300 + rnd() * 1500; L.burst[i * 2] = 524 + Math.cos(a) * r; L.burst[i * 2 + 1] = 470 + Math.sin(a) * r; }

      const inOut = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2), in3 = (x) => x * x * x * x, out = (x) => 1 - Math.pow(2, -10 * x) * (1 - x);
      const SEG = [
        { at: 0, dur: 0.001, from: "scatter", to: "scatter", e: inOut, st: 0 },
        { at: 4.8, dur: 2.36, from: "scatter", to: "centre", e: in3, st: 0.04 },
        { at: 7.2, dur: 1.1, from: "centre", to: "out", e: out, st: 0 },
        { at: 10.8, dur: 0.001, from: "grid", to: "grid", e: inOut, st: 0 },
        { at: 13.2, dur: 0.62, from: "grid", to: "map", e: inOut, st: 0.3 },
        { at: 18.0, dur: 0.62, from: "map", to: "time", e: inOut, st: 0.3 },
        { at: 20.4, dur: 0.62, from: "time", to: "rings", e: inOut, st: 0.3 },
        { at: 22.8, dur: 0.62, from: "rings", to: "shelves", e: inOut, st: 0.3 },
        { at: 27.9, dur: 0.7, from: "shelves", to: "starBig", e: inOut, st: 0.2 },
        { at: 33.6, dur: 0.36, from: "starBig", to: "starLogo", e: in3, st: 0 },
        { at: 33.96, dur: 1.2, from: "starLogo", to: "burst", e: out, st: 0 },
      ];
      const HITS = [0, 1.2, 2.4, 10.8, 13.2, 15.6, 18, 20.4, 22.8, 28.8];
      const SHAKES = [7.2, 33.96];
      const clamp = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

      function draw(t) {
        const ivory = (t >= 7.2 && t < 10.8) || t >= 33.6;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        // ground: the site's hero gradient, or its ivory
        const g = ctx.createLinearGradient(0, 0, W * 0.36, H); g.addColorStop(0, "#0a2533"); g.addColorStop(1, "#113f4e");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        if (ivory) { ctx.fillStyle = "#f9f8f6"; const k = t < 10.8 ? clamp((t - 7.2) / 0.14) : 1; if (k >= 1) ctx.fillRect(0, 0, W, H); else { ctx.beginPath(); ctx.arc(CX, CY, 1150 * k * k, 0, 6.283); ctx.fill(); } }
        let sx = 0, sy = 0;
        for (const h of SHAKES) { const d = t - h; if (d >= 0 && d < 0.4) { const a = 22 * Math.exp(-d * 11); sx += Math.sin(d * 150) * a; sy += Math.cos(d * 117) * a; } }
        ctx.translate(sx, sy);

        let seg = SEG[0]; for (const q of SEG) if (t >= q.at) seg = q;
        const A = L[seg.from], B = L[seg.to];
        let kick = 0; for (const h of HITS) { const d = t - h; if (d >= 0 && d < 1) kick += Math.exp(-d * 7); }
        const drift = seg.to === "scatter" || seg.to === "centre";
        const spin = seg.to === "starBig" && t > 28.5 ? ((t - 28.5) * 4 * Math.PI) / 180 : 0, cs = Math.cos(spin), sn = Math.sin(spin);
        const size = seg.to === "grid" ? 5 : seg.to === "starBig" || seg.to === "starLogo" ? 4 : 3.4;
        let base = 1;
        if (seg.to === "grid") base = 0.42;
        if (seg.to === "burst") base = 1 - clamp((t - 33.96) / 0.9);
        if (seg.to === "out") base = 1 - clamp((t - 7.5) / 0.7);
        const colA = ivory ? "#113f4e" : "#c5a059", colB = ivory ? "#9a7b38" : "#e6d5b8";
        for (let pass = 0; pass < 2; pass++) {
          ctx.fillStyle = pass ? colB : colA;
          for (let i = 0; i < N; i++) {
            if (light[i] !== pass) continue;
            const p = seg.e(clamp((t - seg.at - delay[i] * seg.st) / seg.dur));
            let x = A[i * 2] + (B[i * 2] - A[i * 2]) * p, y = A[i * 2 + 1] + (B[i * 2 + 1] - A[i * 2 + 1]) * p;
            if (drift) { const w = 1 - (seg.to === "centre" ? p : 0); x += Math.sin(t * 0.7 + phase[i]) * 14 * w; y += Math.cos(t * 0.55 + phase[i] * 1.7) * 14 * w; }
            if (spin) { const dx = x - CX, dy = y - CY; x = CX + dx * cs - dy * sn; y = CY + dx * sn + dy * cs; }
            if (kick > 0.01) { const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) || 1; const k = (kick * (seg.to === "scatter" ? 46 : 12)) / d; x += dx * k * (0.4 + delay[i]); y += dy * k * (0.4 + delay[i]); }
            let al = base;
            if (seg.to === "grid") al = base * clamp((t - 10.8 - (x / W) * 0.35) / 0.08);
            if (al <= 0.01) continue;
            ctx.globalAlpha = al;
            ctx.fillRect(x - size / 2, y - size / 2, size, size);
          }
        }
        ctx.globalAlpha = 1;
        // arcs: records that name two mapped places link them
        if (t >= 15.6 && t < 18.0) {
          const M = L.map, K = D.arcs.length, fade = 1 - clamp((t - 17.75) / 0.25);
          ctx.strokeStyle = "#e6d5b8"; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5 * fade; ctx.beginPath();
          for (let k = 0; k < K; k++) {
            const p = out(clamp((t - 15.6 - (k / K) * 1.3) / 0.6)); if (p <= 0) continue;
            const a = D.arcs[k][0], b = D.arcs[k][1], x0 = M[a * 2], y0 = M[a * 2 + 1], x1 = M[b * 2], y1 = M[b * 2 + 1];
            const mx = (x0 + x1) / 2, my = (y0 + y1) / 2 - Math.hypot(x1 - x0, y1 - y0) * 0.22;
            ctx.moveTo(x0, y0);
            for (let q = 1; q <= 14; q++) { const u = (q / 14) * p, v = 1 - u; ctx.lineTo(v * v * x0 + 2 * v * u * mx + u * u * x1, v * v * y0 + 2 * v * u * my + u * u * y1); }
          }
          ctx.stroke(); ctx.globalAlpha = 1;
        }
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 38.4, duration: 38.4, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
