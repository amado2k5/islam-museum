# تمرد عبد الله بن أبي بن سلول وانسحاب المنافقين

في وقت حرج جداً، وقبل طلوع الفجر بقليل، وبينما كان الجيش الإسلامي في منطقة "الشوط" على مقربة من العدو، حدث تمرد مفاجئ قاده عبد الله بن أبي بن سلول {cite:mubarakpuri-raheeq p.253}. فقد انسحب ابن سلول بنحو ثلث الجيش، أي ما يقارب ثلاثمائة مقاتل، متذرعاً بأن النبي ﷺ قد ترك رأيه وأطاع غيره في قرار الخروج من المدينة {cite:mubarakpuri-raheeq p.253}.

لم يكن هدف هذا الانسحاب مجرد الاعتراض على الرأي العسكري، بل كان يرمي إلى إحداث حالة من البلبلة والاضطراب في صفوف المسلمين أمام أعين عدوهم، لكسر معنويات من تبقى مع النبي ﷺ وتشجيع جيش المشركين، طمعاً في عودة الرياسة إلى ابن سلول وأصحابه {cite:mubarakpuri-raheeq p.254}.

كاد هذا التمرد أن يؤدي إلى انهيار أجزاء من الجيش، حيث همت طائفتان من الأوس (بنو حارثة) والخزرج (بنو سلمة) بالانسحاب، لكن الله ثبتهم بعد حالة من الاضطراب {cite:mubarakpuri-raheeq p.254}. وفي محاولة يائسة لإعادة المنافقين، تبعهم عبد الله بن حرام —والد جابر بن عبد الله— وهو يوبخهم ويحثهم على الرجوع، لكنهم ردوا عليه قائلين: "لو نعلم أنكم تقاتلون لم نرجع"، فتركهم قائلاً: "أبعدكم اللّٰه، أعداء اللّٰه، فسيغني اللّٰه عنكم نبيه" {cite:mubarakpuri-raheeq p.254}.

بعد هذا الانشقاق، بقي مع النبي ﷺ سبعمائة مقاتل فقط، واصلوا سيرهم نحو جبل أحد {cite:mubarakpuri-raheeq p.254}.
